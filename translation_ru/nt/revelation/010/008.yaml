id: REV.10.8
reference: Revelation 10:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἡ φωνὴ ἣν ἤκουσα ἐκ τοῦ οὐρανοῦ, πάλιν ⸀λαλοῦσαν μετ’ ἐμοῦ καὶ ⸀λέγουσαν· Ὕπαγε λάβε τὸ ⸀βιβλίον τὸ ἠνεῳγμένον ἐν τῇ χειρὶ τοῦ ἀγγέλου τοῦ ἑστῶτος ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/008.yaml
  text: And the voice that I heard from heaven spoke to me again and said[a], “Go[b], take the scroll that is opened in the hand of the angel who is standing on the sea and on the land.”
translation:
  language: ru
  text: 'И голос, который я слышал с неба, снова заговорил со мной и сказал: «Иди, возьми раскрытый свиток[a], находящийся в руке ангела, стоящего на море и на суше[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «маленький свиток». В соседних стихах употреблена уменьшительная форма, но здесь в греческом тексте стоит βιβλίον — «свиток».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «земле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: голос
  rationale: В данном контексте речь идёт о говорящем небесном голосе, а не просто о звуке.
- source_word: πάλιν
  choice: снова
  rationale: Передаёт повторное обращение небесного голоса к Иоанну.
- source_word: λαλοῦσαν μετ’ ἐμοῦ καὶ λέγουσαν
  choice: обратился ко мне и сказал
  rationale: Естественно передаёт обращённую к Иоанну речь и два греческих причастия без тяжеловесного буквального повтора.
- source_word: Ὕπαγε λάβε
  choice: Иди, возьми
  rationale: Сохраняет два последовательных повеления в их прямом и простом значении.
- source_word: βιβλίον
  choice: свиток
  rationale: Для историко-литературной обстановки Откровения «свиток» точнее, чем современное «книга»; в этом стихе употреблено βιβλίον, а не уменьшительное βιβλαρίδιον.
- source_word: ἠνεῳγμένον
  choice: раскрытый
  rationale: 'Передаёт результирующее состояние перфектного страдательного причастия: свиток был раскрыт и остаётся раскрытым.'
- source_word: ἐν τῇ χειρὶ
  choice: из руки
  rationale: Хотя ἐν буквально обозначает нахождение «в руке», при русском глаголе «возьми» естественно обозначить источник изъятия; положение свитка в руке ангела при этом ясно сохраняется.
- source_word: ἑστῶτος
  choice: стоящего
  rationale: Передаёт продолжающееся состояние ангела, который стоит на море и суше.
- source_word: ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς
  choice: на море и на суше
  rationale: В сцене противопоставлены море и его земная, сухопутная сторона; «суша» создаёт ясную пространственную пару с «морем».
theological_decisions:
- issue: Значение γῆ в апокалиптическом образе
  choice: суша
  alternative: земля
  rationale: Непосредственный образ описывает положение ангела на море и на сухопутной части мира; «суша» не навязывает дополнительного космологического смысла, а возможный вариант «земля» отмечен в сноске.
- issue: Передача βιβλίον в связи с ближайшим контекстом
  choice: свиток
  alternative: маленький свиток; книга
  rationale: В самом стихе стоит βιβλίον без уменьшительной формы. Поэтому основной текст не гармонизируется с соседними стихами, где встречается βιβλαρίδιον; контекстуальный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис сделан естественным для устного восприятия; подлинные лексические варианты βιβλίον и γῆ сохранены в сносках.
