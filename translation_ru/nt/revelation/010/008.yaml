revisions:
- from: 'И голос, который я слышал с неба, снова обратился ко мне и сказал: «Иди, возьми раскрытый свиток из руки ангела, стоящего на море и на суше[b]».[a]'
  to: 'И голос, который я слышал с неба, снова заговорил со мной и сказал: «Иди, возьми раскрытый свиток[a], находящийся в руке ангела, стоящего на море и на суше[b]».'
  rationale: Перемещены оба сносочных якоря к словам, к которым они относятся. «Из руки ангела» заменено на «находящийся в руке ангела», чтобы сохранить значение ἐν τῇ χειρὶ. «Снова обратился ко мне» уточнено как «снова заговорил со мной», что ближе передаёт λαλοῦσαν μετ’ ἐμοῦ и остаётся естественным по-русски.
