source:
  edition: SBLGNT
  text: ἀλλ’ ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου, ὅταν μέλλῃ σαλπίζειν, καὶ ἐτελέσθη τὸ μυστήριον τοῦ θεοῦ, ὡς εὐηγγέλισεν τοὺς ⸂ἑαυτοῦ δούλους⸃ τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/007.yaml
  text: but in the days of the voice of the seventh angel[a], when he is about to sound the trumpet, then the mystery of God is fulfilled, just as he proclaimed the good news to his own servants, the prophets.
translation:
  language: ru
  text: но в дни, когда будет звучать голос седьмого ангела, когда он соберётся вострубить, совершится тайна Бога, как Он возвестил благую весть Своим рабам[a] — пророкам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «слугам». Греческое слово может означать и «рабов», и «слуг»; здесь подчёркнута их принадлежность Богу.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: но
  rationale: Краткий противительный союз естественно связывает стих с предшествующим утверждением.
- source_word: ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου
  choice: в дни, когда зазвучит голос седьмого ангела
  rationale: Сохраняет образ «голоса» (φωνή), не отождествляя его безоговорочно с трубным звуком, но передаёт временное выражение естественным современным русским языком.
- source_word: ὅταν μέλλῃ σαλπίζειν
  choice: и он будет готов вострубить
  rationale: Передаёт значение близости предстоящего действия в μέλλῃ и подразумеваемую трубу в глаголе σαλπίζω. «Вострубить» уместно для возвышенного апокалиптического регистра.
- source_word: καὶ ἐτελέσθη
  choice: совершится
  rationale: Аорист в будущем временном контексте передан русским будущим временем; «совершится» сохраняет оттенки завершения и осуществления, не сводя смысл только к прекращению.
- source_word: τὸ μυστήριον τοῦ θεοῦ
  choice: тайна Бога
  rationale: Сохраняет ключевой богословский термин μυστήριον и прямо передаёт родительный оборот.
- source_word: ὡς εὐηγγέλισεν
  choice: как Он и возвестил благую весть
  rationale: Передаёт присущий εὐαγγελίζω смысл возвещения благой вести, а частица «и» естественно подчёркивает соответствие ранее данному возвещению.
- source_word: τοὺς ἑαυτοῦ δούλους
  choice: Своим рабам
  rationale: «Рабам» сохраняет выраженные словами ἑαυτοῦ и δοῦλος принадлежность Богу и подчинённое служение; возвратное «Своим» однозначно относится к Богу.
- source_word: τοὺς προφήτας
  choice: пророкам
  rationale: Тире ясно передаёт приложение, поясняющее, что Божьи рабы здесь — пророки.
theological_decisions:
- issue: Временная форма и смысл ἐτελέσθη
  choice: совершится
  alternative: завершится; исполнилась
  rationale: Хотя греческая форма — аорист, придаточное с ὅταν и μέλλῃ ориентирует высказывание на будущее. Русское будущее передаёт эту перспективу, а «совершится» сохраняет напряжение между завершением Божьего замысла и его исполнением, не навязывая конкретной эсхатологической схемы.
- issue: Передача δοῦλος применительно к пророкам Бога
  choice: рабы
  alternative: слуги
  rationale: В сочетании с ἑαυτοῦ слово подчёркивает принадлежность Богу и полное подчинение Ему. Традиционное русское библейское «рабы» точно удерживает эту связь, тогда как более мягкое «слуги» указано как допустимая лексическая альтернатива.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Слова «вострубить», «тайна» и «рабы» сохраняют библейский регистр, оставаясь понятными современному читателю.
