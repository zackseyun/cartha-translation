    rationale: μέλλῃ с инфинитивом обозначает предстоящее, близкое действие. «Соберётся вострубить» передаёт это значение точнее и остаётся в возвышенном регистре.
  - severity: low
    issue: Стилистика формулировки сноски.
    rationale: Оборот «может означать как рабов, так и слуг» грамматически возможен, но «может означать и “рабов”, и “слуг”» естественнее и яснее.
