id: REV.10.1
reference: Revelation 10:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον ἰσχυρὸν καταβαίνοντα ἐκ τοῦ οὐρανοῦ, περιβεβλημένον νεφέλην, καὶ ἡ ἶρις ἐπὶ ⸂τὴν κεφαλὴν⸃ αὐτοῦ, καὶ τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, καὶ οἱ πόδες αὐτοῦ ὡς στῦλοι πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/001.yaml
  text: And I saw another mighty angel coming down from heaven[a], clothed with a cloud, with the rainbow over his head, and his face was like the sun[b], and his feet like pillars of fire.
translation:
  language: ru
  text: И увидел я другого могущественного ангела[a], сходящего с неба, облачённого в облако. Над его головой была радуга[b], лицо его — как солнце, а ноги — как огненные столпы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «другого сильного ангела».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово обычно означает «радуга», но может обозначать и сияющий ореол.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: другого … ангела
  rationale: В контексте небесного видения ἄγγελος естественно обозначает ангела; «другого» сохраняет связь с другими ангельскими фигурами Откровения.
- source_word: ἰσχυρὸν
  choice: могущественного
  rationale: Передаёт исключительную силу фигуры и звучит естественно в возвышенном апокалиптическом повествовании; возможен также более буквальный вариант «сильного».
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: сходящего с неба
  rationale: Сохраняет направленное движение вниз и причастную форму исходного текста.
- source_word: περιβεβλημένον νεφέλην
  choice: облачённого в облако
  rationale: Сохраняет метафору одеяния в περιβάλλω и теофанический образ облака, не сводя его просто к окружению облаком.
- source_word: ἡ ἶρις
  choice: радуга
  rationale: Обычное значение ἶρις и наиболее вероятный образ с учётом Откр 4:3; возможность обозначения сияющего ореола отмечена в сноске.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: над его головой
  rationale: Естественно передаёт пространственное положение радуги поверх головы.
- source_word: τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος
  choice: лицо его — как солнце
  rationale: Сохраняет краткое сравнение без добавления отсутствующего в греческом глагола состояния.
- source_word: οἱ πόδες αὐτοῦ ὡς στῦλοι πυρός
  choice: ноги — как огненные столпы
  rationale: «Ноги» естественно передаёт πόδες в данном образе, а «огненные столпы» сохраняет яркость генитивной конструкции στῦλοι πυρός.
theological_decisions:
- issue: Личность могущественного ангела
  choice: Переводить нейтрально как «другого могущественного ангела», не отождествляя его прямо со Христом и не уточняя, что это сотворённый ангел.
  alternative: Понимать фигуру либо как сотворённого ангела, либо как явление Мессии/Христа.
  rationale: Греческий текст называет фигуру ἄλλον ἄγγελον ἰσχυρόν и сам по себе не разрешает спор о её точной природе; перевод должен сохранить эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, подходящим для апокалиптического видения регистром. Инверсия «увидел я» и именные сравнения с тире сохраняют торжественный ритм, оставаясь понятными современному читателю.
