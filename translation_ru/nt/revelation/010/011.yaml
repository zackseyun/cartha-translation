    rationale: В Καὶ λέγουσίν μοι· Δεῖ σε πάλιν προφητεῦσαι ἐπὶ λαοῖς καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς прилагательное πολλοῖς стоит в дательном мужском множественного числа и согласуется с ближайшим βασιλεῦσιν, а не с λαοῖς, ἔθνεσιν и γλώσσαις. Русский перевод должен сохранить это ограничение.
