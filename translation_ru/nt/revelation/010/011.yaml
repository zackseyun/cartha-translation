source:
  edition: SBLGNT
  text: Καὶ λέγουσίν μοι· Δεῖ σε πάλιν προφητεῦσαι ἐπὶ λαοῖς ⸀καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/011.yaml
  text: And they say to me, “You must prophesy again about many peoples and nations and languages and kings.”
translation:
  language: ru
  text: 'И говорят мне: «Тебе надлежит снова пророчествовать о народах, племенах, языках и многих царях».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῖ σε
  choice: Тебе надлежит
  rationale: Передаёт безличную необходимость и обязательность, выраженную δεῖ, в естественном и достойном русском регистре.
- source_word: πάλιν
  choice: снова
  rationale: Прямо передаёт повторность действия.
- source_word: προφητεῦσαι
  choice: пророчествовать
  rationale: Сохраняет пророческий характер поручения без сужения смысла до одного лишь предсказания.
- source_word: ἐπὶ
  choice: о
  rationale: В данном контексте естественно обозначает предмет или направленность пророчества; возможная смысловая широта предлога не требует искусственного уточнения.
- source_word: λαοῖς καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς
  choice: о многих народах, племенах, языках и царях
  rationale: Сохраняет четырёхчастный перечень; «племенах» отличает ἔθνη от λαοί, хотя категории частично пересекаются. «Многих» естественно относится ко всему ряду.
theological_decisions:
- issue: Направленность пророчества при ἐπὶ с дательным падежом
  choice: о многих народах... и царях
  alternative: многим народам... и царям / против многих народов... и царей
  rationale: Предлог допускает контекстуальную широту, но «о» сохраняет неоднозначность содержания пророчества и не утверждает без достаточных оснований ни адресованность, ни враждебную направленность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Настоящее время «говорят» сохранено вслед за греческим историческим настоящим λέγουσίν. Местоимение «они» не добавлено, поскольку неопределённо-личная конструкция естественно передаёт невыраженный субъект.
