  source_fidelity: 'Требуется исправление области действия πολλοῖς: в греческом тексте это прилагательное согласовано только с βασιλεῦσιν («многим царям»), а не с полным рядом. «Народы, племена, языки» адекватно передаёт λαοί, ἔθνη, γλῶσσαι; «племена» здесь является допустимым традиционно-библейским различением с «народами».'
  naturalness: Фраза естественна для современного литературного русского и сохраняет умеренно возвышенный библейский регистр. Перенос «многих» непосредственно к «царям» также делает синтаксис яснее.
  terminology: «Тебе надлежит», «пророчествовать» и «о» точно и естественно передают соответственно δεῖ σε, προφητεῦσαι и контекстуальное ἐπί с дательным. Неопределённо-личное «говорят мне» оправданно передаёт невыраженный субъект λέγουσίν.
