base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/004.yaml
  text: And when the seven thunders spoke[a], I was about to write; and I heard a voice from heaven saying, “Seal up what the seven thunders spoke, and do not write them.”
translation:
  language: ru
  text: 'И когда заговорили семь громов, я хотел было записать, но услышал голос с неба, говоривший: «Запечатай то, что сказали семь громов, и не записывай этого[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не записывай их»; греческое местоимение стоит во множественном числе и относится к тому, что сказали семь громов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησαν
  choice: проговорили
  rationale: Передаёт речевое действие и сохраняет олицетворение громов; в данном контексте естественно указывает на произнесённое ими содержание.
- source_word: αἱ ἑπτὰ βρονταί
  choice: семь громов
  rationale: Буквально сохраняет апокалиптический образ семи громов, выступающих как говорящие действующие лица.
- source_word: ἤμελλον γράφειν
  choice: я хотел было записать
  rationale: Русская конструкция «хотел было» естественно передаёт намерение, которое уже готово было осуществиться, но было прервано.
- source_word: φωνὴν ἐκ τοῦ οὐρανοῦ
  choice: голос с неба
  rationale: Естественно передаёт небесный источник голоса, не уточняя личность говорящего.
- source_word: Σφράγισον
  choice: Запечатай
  rationale: Сохраняет образ печати и повелительную форму; в контексте означает, что сказанное не должно быть раскрыто письменно.
- source_word: ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί
  choice: то, что проговорили семь громов
  rationale: Передаёт содержание речи, выраженное нейтральным множественным относительным местоимением ἃ, естественной русской собирательной конструкцией.
- source_word: μὴ αὐτὰ γράψῃς
  choice: не записывай этого
  rationale: Естественная русская формулировка, относящая запрет ко всему произнесённому содержанию; грамматическое множественное число греческого αὐτά отмечено в сноске.
theological_decisions:
- issue: Следует ли прямо назвать того, кому принадлежит голос с неба
  choice: 'оставить говорящего неопределённым: «голос с неба»'
  alternative: «голос Бога с неба»
  rationale: Греческий текст сообщает источник голоса, но не называет говорящего; перевод не добавляет отсутствующей идентификации.
- issue: Как передать запечатывание сказанного семью громами
  choice: «Запечатай то, что проговорили семь громов»
  alternative: «Сохрани в тайне то, что сказали семь громов»
  rationale: «Запечатай» сохраняет исходный апокалиптический образ, не сводя его значение только к истолкованию как сокрытия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Хотел было записать» передаёт прерванное намерение; «запечатай» сохраняет образ исходного текста без конфессионального истолкования.
