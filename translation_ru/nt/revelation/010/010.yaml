  text: καὶ ἔλαβον τὸ ⸀βιβλαρίδιον ἐκ τῆς χειρὸς τοῦ ἀγγέλου καὶ κατέφαγον αὐτό, καὶ ἦν ἐν τῷ στόματί μου ὡς μέλι γλυκύ· καὶ ὅτε ἔφαγον αὐτό, ἐπικράνθη ἡ κοιλία μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/010.yaml
  text: And I took the little scroll from the hand of the angel and ate it, and in my mouth it was sweet like honey; and when I had eaten it, my stomach was made bitter.
translation:
  language: ru
  text: И я взял маленький свиток[a] из руки ангела и съел его. Во рту он был сладок, как мёд, а когда я съел его, в желудке у меня стало горько[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «маленькую книжку». Греческое слово имеет уменьшительную форму и может обозначать небольшой письменный документ; «маленький свиток» лучше соответствует вероятной древней форме.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «мой желудок стал горьким»; возможно также: «моё чрево стало горьким».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: маленький свиток
  rationale: Уменьшительная форма обозначает небольшой письменный документ; «свиток» соответствует наиболее вероятной древней форме, а «маленький» передаёт уменьшительный оттенок.
- source_word: ἐκ τῆς χειρὸς τοῦ ἀγγέλου
  choice: из руки ангела
  rationale: Прямо и естественно сохраняет образ получения свитка из руки ангела.
- source_word: κατέφαγον
  choice: съел
  rationale: Нейтральное «съел» естественно передаёт действие, не усиливая его до «поглотил» или «пожрал», хотя сложный глагол может иметь усилительный оттенок.
- source_word: ὡς μέλι γλυκύ
  choice: сладок, как мёд
  rationale: Естественное русское сравнение, сохраняющее образ и значение ὡς.
- source_word: ὅτε ἔφαγον αὐτό
  choice: когда я съел его
  rationale: Сохраняет аористную повествовательную последовательность без искусственного внесения отдельного временного значения.
- source_word: ἐπικράνθη ἡ κοιλία μου
  choice: в желудке у меня стало горько
  rationale: Естественная русская передача телесного ощущения и наступившей горечи; она избегает неидиоматичного буквального выражения «мой желудок был сделан горьким».
- source_word: κοιλία
  choice: желудок
  rationale: В данном телесном контексте это ясный современный эквивалент; более буквальное «чрево» звучит архаично, а «живот» менее точно.
theological_decisions:
- issue: Символическое съедение свитка
  choice: Передать образ буквально, не объясняя его символику в основном тексте.
  alternative: Прямо истолковать сладость и горечь как радость и суд либо как иной духовный опыт.
  rationale: Сам стих не раскрывает символику полностью; перевод должен сохранить образ и богословское напряжение, не подменяя их толкованием.
- issue: Пассивная форма ἐπικράνθη
  choice: Передать естественной безличной конструкцией «в желудке у меня стало горько».
  alternative: «Мой желудок был сделан горьким» или «мой желудок стал горьким».
  rationale: Греческая форма допускает значение наступившего состояния, тогда как буквальный русский пассив неестественен и может ошибочно акцентировать внешнего деятеля.
translation_notes:
  register: Современный литературный русский язык с ясной, несколько торжественной библейской интонацией. Союз «но» естественно выражает контраст между сладостью во рту и последующей горечью, заложенный в последовательности греческого текста. Все сноски отмечены в основном тексте.
