id: REV.20.11
reference: Revelation 20:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνον μέγαν λευκὸν καὶ τὸν καθήμενον ⸂ἐπ’ αὐτοῦ⸃, οὗ ἀπὸ ⸀τοῦ προσώπου ἔφυγεν ἡ γῆ καὶ ὁ οὐρανός, καὶ τόπος οὐχ εὑρέθη αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/011.yaml
  text: And I saw a great white throne and the one seated on it[a], from whose presence the earth and heaven fled, and no place was found for them.
translation:
  language: ru
  text: И увидел я великий белый престол и сидящего на нём, от присутствия которого[a] бежали земля и небо, и не нашлось для них места.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «от лица которого».
    reason: Греч. πρόσωπον буквально означает «лицо», но в данном обороте идиоматически обозначает присутствие.
lexical_decisions:
- source_word: θρόνον μέγαν λευκὸν
  choice: великий белый престол
  rationale: «Великий» передаёт не только величину, но и величие престола; порядок определений естественен для современного русского языка.
- source_word: τὸν καθήμενον ἐπ’ αὐτοῦ
  choice: Сидящего на нём
  rationale: Субстантивированное причастие сохраняет описательный характер греческого выражения и не уточняет личность Сидящего сверх текста.
- source_word: ἀπὸ τοῦ προσώπου
  choice: от лица которого
  rationale: Буквальная метафора понятна по-русски, сохраняет яркий образ исходного текста и не требует замены на более отвлечённое «от присутствия».
- source_word: ἔφυγεν
  choice: бежали
  rationale: Глагол сохраняет олицетворённый и динамичный образ бегства творения, не истолковывая его как исчезновение.
- source_word: ἡ γῆ καὶ ὁ οὐρανός
  choice: земля и небо
  rationale: Обычные русские соответствия с естественным опущением артиклей, отсутствующих в русском языке; единственное число сохранено.
- source_word: τόπος οὐχ εὑρέθη αὐτοῖς
  choice: не нашлось для них места
  rationale: Естественная русская безличная конструкция сохраняет смысл греческого пассива и торжественную краткость высказывания.
theological_decisions:
- issue: Личность Сидящего на престоле
  choice: 'Оставлена не названной: «Сидящего на нём»'
  alternative: Бог; Бог Отец; божественный Судья
  rationale: Сам стих не называет Сидящего, поэтому перевод не вносит более узкого богословского отождествления.
- issue: Характер бегства земли и неба
  choice: Сохранён образ «бежали»
  alternative: исчезли; скрылись
  rationale: Греческий φεύγω описывает бегство; перевод не превращает образ в прямое утверждение об уничтожении или исчезновении мира.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Инверсия «И увидел я» сохраняет повествовательную формулу видения; прописная буква в «Сидящего» служит традиционным графическим обозначением уникального престольного Лица, не называя его прямо.
