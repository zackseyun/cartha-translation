source:
  edition: SBLGNT
  text: καὶ ἐξελεύσεται πλανῆσαι τὰ ἔθνη τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς, τὸν Γὼγ ⸀καὶ Μαγώγ, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον, ὧν ὁ ἀριθμὸς ⸀αὐτῶν ὡς ἡ ἄμμος τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/008.yaml
  text: and he will go out to deceive the nations at the four corners of the earth—Gog and Magog—and to gather them for war[c][b][a], whose number is like the sand of the sea.
translation:
  language: ru
  text: И он выйдет, чтобы обмануть[a] народы, находящиеся на четырёх концах земли, — Гога и Магога[b], — и собрать их на войну[c]; число их — как песок морской.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сбить с пути».'
    reason: lexical_alternative
  - marker: b
    text: «Гог и Магог» отсылает к книге Иезекииля, главы 38–39, и, возможно, служит типологическим обозначением народов, собранных для последнего мятежа.
    reason: cross_reference
  - marker: c
    text: 'Или: «на битву». Греческое слово может означать как войну, так и битву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσεται
  choice: он выйдет
  rationale: Будущая форма ἐξέρχομαι передаёт выход сатаны после освобождения (ст. 7). Местоимение «он» естественно восстанавливает подразумеваемое подлежащее из ближайшего контекста.
- source_word: πλανῆσαι
  choice: чтобы обмануть
  rationale: πλανάω может означать «обманывать» или «сбивать с пути». «Обмануть» кратко и естественно передаёт действие сатаны, не устраняя альтернативный образ ухода с верного пути.
- source_word: τὰ ἔθνη
  choice: народы
  rationale: В данном контексте ἔθνη обозначает народы мира как совокупности, а не специально неевреев в противопоставлении евреям.
- source_word: τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς
  choice: находящиеся на четырёх концах земли
  rationale: Греческий образ четырёх углов указывает на крайние пределы обитаемого мира. Русское выражение «четыре конца земли» понятно и сохраняет глобальный масштаб образа.
- source_word: τὸν Γὼγ καὶ Μαγώγ
  choice: Гога и Магога
  rationale: Имена транслитерированы и поставлены в винительный падеж вслед за греческим текстом. Пунктуация представляет их как приложение к «народам», не определяя точнее характер этой апокалиптической идентификации.
- source_word: συναγαγεῖν
  choice: и собрать
  rationale: Инфинитив выражает цель выхода и обольщения; союз «и» отражает координацию действий в греческом тексте.
- source_word: εἰς τὸν πόλεμον
  choice: на войну
  rationale: πόλεμος допускает значения «война» и «битва». «На войну» сохраняет более широкое значение и естественно сочетается с глаголом «собрать».
- source_word: ὧν ὁ ἀριθμὸς αὐτῶν
  choice: число их
  rationale: Формулировка относится к собранным народам и сохраняет библейскую сжатость исходной относительной конструкции.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: как песок морской
  rationale: Сохранён устойчивый библейский образ неисчислимого множества и его межтекстовые связи.
theological_decisions:
- issue: Подразумеваемое подлежащее глагола «выйдет»
  choice: «Он» относится к сатане из предыдущего стиха.
  alternative: 'Оставить подлежащее полностью невыраженным: «и выйдет».'
  rationale: Непосредственный контекст (Откр. 20:7) называет сатану освобождённым из темницы. Местоимение делает русскую фразу естественной, не добавляя нового толкования.
- issue: Значение выражения «Гог и Магог»
  choice: Имена переданы как приложение, относящееся к обманутым народам.
  alternative: Понимать их либо как исключительно символические названия последних врагов Бога, либо как прямое отождествление с Гогом из земли Магог в Иезекииля 38–39.
  rationale: Перевод сохраняет аллюзию и грамматическую связь, но не решает спорный вопрос о том, являются ли эти имена символическими, типологическими или этногеографическими.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет длинное апокалиптическое движение фразы, а тире выделяют «Гога и Магога» как приложение. Все примечания отмечены в основном тексте.
