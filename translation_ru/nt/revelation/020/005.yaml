  text: ⸀οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη. αὕτη ἡ ἀνάστασις ἡ πρώτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/005.yaml
  text: The rest of the dead did not come to life until the thousand years were finished[a]. This is the first resurrection.
translation:
  language: ru
  text: Остальные умершие не ожили, пока не окончилась тысяча лет[a]. Это — первое воскресение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не жили, пока не окончилась тысяча лет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν νεκρῶν
  choice: остальные из мёртвых
  rationale: Передаёт группу, оставшуюся в противопоставлении ранее упомянутым умершим, и сохраняет выраженную в греческом тексте конструкцию с родительным падежом.
- source_word: οὐκ ἔζησαν
  choice: не ожили
  rationale: 'В контексте воскресения аорист глагола ζάω естественно имеет начинательное значение: они не стали живыми. «Не ожили» ясно выражает это, не уточняя природу воскресения сверх сказанного в тексте.'
- source_word: ἄχρι τελεσθῇ
  choice: пока не окончилась
  rationale: Конструкция обозначает предел времени, а пассивный аорист τελεσθῇ — достижение завершения. По-русски сочетание с «тысяча лет» естественно требует формы единственного числа.
- source_word: τὰ χίλια ἔτη
  choice: тысяча лет
  rationale: Прямая и естественная передача определённого тысячелетнего периода, уже названного в контексте.
- source_word: αὕτη ἡ ἀνάστασις ἡ πρώτη
  choice: Это — первое воскресение
  rationale: Сохраняет указательное местоимение без сужения его референта и передаёт ἀνάστασις общепринятым русским словом «воскресение».
theological_decisions:
- issue: К чему относится фраза «Это — первое воскресение»
  choice: Указательное «это» оставлено без поясняющего дополнения и указывает на описанную в контексте действительность.
  alternative: Прямо отнести его только к мученикам из стиха 4, ко всем праведным умершим либо истолковать воскресение как исключительно духовное.
  rationale: Греческий текст не разрешает здесь спор о конкретной эсхатологической системе; перевод сохраняет широту указания и богословское напряжение.
- issue: Значение ἔζησαν в данном контексте
  choice: «не ожили»
  alternative: «не жили» либо истолковывающее уточнение о духовном оживлении
  rationale: Ближайший контекст воскресения поддерживает начинательное значение «ожили», однако перевод не добавляет утверждений о характере события, которых нет в самом стихе.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная без архаизмов. Слово «мёртвых» сохраняет связь с исходным существительным, а тире в заключительной фразе естественно подчёркивает отождествление.
