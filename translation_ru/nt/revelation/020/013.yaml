base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/013.yaml
  text: And the sea gave up the dead who were in it[a], and Death and Hades gave up the dead who were in them, and each one was judged according to their deeds.
translation:
  language: ru
  text: И море отдало мёртвых, находившихся в нём, и Смерть и Аид[a] отдали мёртвых, находившихся в них; и каждый был судим по своим делам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царство мёртвых». Греческое слово ᾅδης обозначает мир мёртвых и отличается от слов, которыми обозначается место окончательного наказания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν / ἔδωκαν
  choice: отдало / отдали
  rationale: В этом контексте δίδωμι обозначает выдачу или возвращение мёртвых для суда. «Отдало / отдали» естественно передаёт образ, не добавляя идеи принуждения.
- source_word: ἡ θάλασσα
  choice: море
  rationale: Обычное и точное соответствие θάλασσα; определённость понятна из контекста и не требует дополнительных средств в русском языке.
- source_word: τοὺς νεκρούς
  choice: мёртвых
  rationale: Субстантивированное прилагательное естественно передаётся русским субстантивированным «мёртвых».
- source_word: τοὺς ἐν αὐτῇ / τοὺς ἐν αὐτοῖς
  choice: которые были в нём / которые были в них
  rationale: Относительные придаточные ясно сохраняют уточняющую функцию греческих конструкций и различие между единственным и множественным числом.
- source_word: ὁ θάνατος
  choice: Смерть
  rationale: Прописная буква подчёркивает олицетворение Смерти в апокалиптическом образе наряду с Адом.
- source_word: ὁ ᾅδης
  choice: Ад
  rationale: В русском библейском употреблении «Ад» может обозначать царство мёртвых; сноска уточняет значение ᾅδης и не позволяет автоматически отождествить его с местом окончательного наказания.
- source_word: ἐκρίθησαν ἕκαστος
  choice: каждый был судим
  rationale: Передаёт распределительный смысл ἕκαστος и естественно согласует фразу в русском языке, хотя греческий глагол стоит во множественном числе.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: по своим делам
  rationale: «По… делам» сохраняет устойчивую библейскую формулу суда согласно делам; возвратное «своим» естественно связывает дела с каждым судимым.
theological_decisions:
- issue: Значение ᾅδης в контексте последнего суда
  choice: Ад со сноской «царство мёртвых»
  alternative: царство мёртвых; преисподняя; место мучения
  rationale: Перевод сохраняет узнаваемый отдельный термин, а сноска отличает ᾅδης от обозначений окончательного наказания, включая озеро огненное в ближайшем контексте.
- issue: Олицетворение θάνατος
  choice: Смерть с прописной буквы
  alternative: смерть
  rationale: Так передаётся самостоятельная роль Смерти в видении без добавления отдельного доктринального утверждения.
- issue: Основание суда κατὰ τὰ ἔργα
  choice: по своим делам
  alternative: на основании своих поступков; соответственно своим делам
  rationale: Формулировка сохраняет утверждение текста о соответствии суда делам, не разъясняя сверх текста отношение дел к спасению или осуждению.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Параллелизм греческой фразы сохранён; точка с запятой перед заключительным судом облегчает чтение. Прописные буквы в «Смерть» и «Ад» передают олицетворённые силы/области в данном видении.
