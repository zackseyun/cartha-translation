id: REV.20.12
reference: Revelation 20:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς νεκρούς, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστιν τῆς ζωῆς· καὶ ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/012.yaml
  text: And I saw the dead[a], the great and the small, standing before the throne, and books were opened. And another book was opened, which is the book of life. And the dead were judged from what had been written in the books[b], according to their works.
translation:
  language: ru
  text: И увидел я мёртвых — великих и малых, — стоящих перед престолом. И раскрыты были книги[a]. Была раскрыта и другая книга — книга жизни. И мёртвые были судимы по написанному в книгах, согласно их делам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «книги», в древнем контексте могло также обозначать свитки.
    reason: cultural_note
lexical_decisions:
- source_word: νεκρούς / νεκροὶ
  choice: мёртвых / мёртвые
  rationale: Субстантивированное прилагательное обозначает умерших как совокупность; русское «мёртвые» естественно, кратко и сохраняет торжественный регистр.
- source_word: μεγάλους καὶ τοὺς μικρούς
  choice: великих и малых
  rationale: Сохраняет меризм, охватывающий людей любого положения, не сводя выражение только к общественной значимости.
- source_word: ἑστῶτας
  choice: стоящих
  rationale: 'Передаёт результирующее состояние, выраженное перфектным причастием: они стоят перед престолом.'
- source_word: ἐνώπιον τοῦ θρόνου
  choice: перед престолом
  rationale: Прямой и естественный перевод без истолковывающего добавления «судилищем».
- source_word: βιβλία
  choice: книги
  rationale: Обычный широкий эквивалент; исторически слово могло обозначать свитки, что отмечено в сноске.
- source_word: ἠνοίχθησαν / ἠνοίχθη
  choice: раскрыты были / была раскрыта
  rationale: «Раскрыть» естественно сочетается с книгой и точно передаёт пассивные формы, не добавляя идеи снятия печатей.
- source_word: ἄλλο βιβλίον
  choice: другая книга
  rationale: Обозначает ещё одну, отличную от ранее упомянутых книг; русский контекст ясно передаёт её добавочный характер.
- source_word: ὅ ἐστιν τῆς ζωῆς
  choice: книга жизни
  rationale: В греческом обороте слово «книга» подразумевается; по-русски оно восстановлено для ясности и естественности.
- source_word: ἐκρίθησαν
  choice: были судимы
  rationale: Сохраняет судебный смысл и пассивную конструкцию, не предрешая исход суда как осуждение.
- source_word: ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις
  choice: по написанному в книгах
  rationale: Передаёт основание суда и завершённость записанного, выраженную перфектным причастием.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: согласно их делам
  rationale: «Дела» естественно передаёт ἔργα как поступки и деятельность, а «согласно» сохраняет идею соответствия при суде.
theological_decisions:
- issue: Суд согласно делам
  choice: согласно их делам
  alternative: согласно тому, что они сделали
  rationale: Формулировка прямо сохраняет утверждение текста о суде в соответствии с делами и не смягчает его посредством привнесённого богословского объяснения.
- issue: Значение ἐκρίθησαν
  choice: были судимы
  alternative: были осуждены
  rationale: Глагол обозначает совершение суда, но сам по себе здесь не требует перевода «осуждены»; нейтральная судебная формулировка сохраняет открытым вопрос о приговоре.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным ритмом. Инверсия «раскрыты были книги» поддерживает возвышенное звучание, оставаясь понятной; архаические местоименные и падежные формы не используются.
