id: REV.20.6
reference: Revelation 20:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ· ἐπὶ τούτων ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν, ἀλλ’ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ χριστοῦ, καὶ βασιλεύσουσιν μετ’ αὐτοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/006.yaml
  text: Blessed and holy is the one who has a share in the first resurrection. Over these the second death has no authority[a], but they will be priests of God and of Messiah, and they will reign with him for a thousand years.
translation:
  language: ru
  text: Блажен и свят тот, кто имеет участие в первом воскресении. Над ними вторая смерть не имеет власти, но они будут священниками Бога и Мессии[a] и будут царствовать с Ним тысячу лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа». Греческое Χριστός — титул, означающий «Помазанник», то есть «Мессия».'
    reason: Сохраняется традиционный русский вариант и поясняется титульное значение греческого слова.
lexical_decisions:
- source_word: μακάριος καὶ ἅγιος
  choice: Блажен и свят
  rationale: Сохраняет традиционный язык блаженства и прямое значение святости как посвящённости Богу, не сводя выражение к субъективному счастью или только нравственному качеству.
- source_word: ὁ ἔχων μέρος
  choice: тот, кто имеет участие
  rationale: Естественно передаёт субстантивированное причастие и идею причастности; единственное число сохранено.
- source_word: ἐν τῇ ἀναστάσει τῇ πρώτῃ
  choice: в первом воскресении
  rationale: Прямой и ясный эквивалент греческого сочетания без истолкования характера воскресения.
- source_word: ἐπὶ τούτων
  choice: над ними
  rationale: При ἐπί с родительным падежом выражает власть над названными людьми; местоимение согласовано с последующим множественным числом.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: не имеет власти
  rationale: Передаёт значение полномочия и господства точнее, чем формулировка о физической силе.
- source_word: ἱερεῖς
  choice: священниками
  rationale: Сохраняет прямой культовый и царственно-священнический образ существительного.
- source_word: τοῦ θεοῦ καὶ τοῦ χριστοῦ
  choice: Бога и Мессии
  rationale: Χριστός здесь выступает как титул в формальной конструкции наряду с Богом; «Мессия» сохраняет его титульный смысл.
- source_word: βασιλεύσουσιν μετ’ αὐτοῦ
  choice: будут царствовать с Ним
  rationale: Сохраняет царскую образность и совместность правления; местоимение относится к Мессии.
- source_word: χίλια ἔτη
  choice: тысячу лет
  rationale: Прямо передаёт указанную продолжительность, не добавляя предлога и не навязывая определённой системы толкования.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном сочетании слово сохраняет заметную функцию титула. Основной текст передаёт этот смысл как «Мессия», а привычный русский эквивалент указан в примечании.
- issue: Характер первого воскресения
  choice: первое воскресение
  alternative: истолковать как духовное или телесное воскресение
  rationale: Перевод сохраняет формулировку источника и не разрешает спор о характере события средствами перевода.
- issue: Тысячелетний срок
  choice: тысячу лет
  alternative: истолковать срок буквально или символически
  rationale: Сохранено явное временное выражение текста без привнесения конкретной эсхатологической схемы.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического и богослужебного регистра. Синтаксис остаётся близким к греческому, но местоименное число естественно переходит от собирательного единственного «тот, кто» к множественному «над ними… они». Заглавная буква в «Ним» следует устойчивой русской религиозной издательской практике.
