reference: Revelation 20:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν αὐτὸν εἰς τὴν ἄβυσσον, καὶ ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ, ἵνα μὴ ⸀πλανήσῃ ἔτι τὰ ἔθνη, ἄχρι τελεσθῇ τὰ χίλια ἔτη· ⸀μετὰ ταῦτα δεῖ ⸂λυθῆναι αὐτὸν⸃ μικρὸν χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/003.yaml
  text: And he threw him into the abyss[a], and shut it and sealed it over him, so that he might no longer deceive the nations until the thousand years were finished[c][b]. After these things he must be released for a short time.
translation:
  language: ru
  text: И он бросил его в бездну[a], закрыл её и запечатал над ним, чтобы тот больше не обманывал народы[b], пока не окончится тысяча лет. После этого его необходимо освободить на короткое время[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в бездонную пропасть».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «больше не вводил народы в заблуждение».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «отпустить ненадолго».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: бросил
  rationale: Аорист βάλλω обозначает решительное, насильственное низвержение; «бросил» передаёт эту выразительность естественным современным русским языком.
- source_word: ἄβυσσον
  choice: бездну
  rationale: В Откровении ἄβυσσος служит апокалиптическим обозначением места заточения. «Бездна» сохраняет этот образ и не добавляет толкования.
- source_word: ἔκλεισεν
  choice: закрыл
  rationale: κλείω означает «закрывать, запирать». «Закрыл» не уточняет способ запирания, которого греческий текст не называет.
- source_word: ἐσφράγισεν ἐπάνω αὐτοῦ
  choice: запечатал её над ним
  rationale: Фраза передаёт как действие запечатывания, так и пространственное отношение ἐπάνω αὐτοῦ — бездна закрыта и скреплена печатью над заключённым в ней.
- source_word: ἵνα μὴ πλανήσῃ ἔτι τὰ ἔθνη
  choice: чтобы тот больше не обманывал народы
  rationale: πλανάω может означать «обманывать» или «вводить в заблуждение»; краткое «обманывал» естественно в контексте. Местоимение «тот» устраняет возможную в русском неясность субъекта.
- source_word: ἄχρι τελεσθῇ τὰ χίλια ἔτη
  choice: пока не окончится тысяча лет
  rationale: τελεσθῇ указывает на достижение срока или завершение периода. Единственное число «тысяча» требует в русском сказуемого «окончится», при этом содержание греческой фразы сохраняется.
- source_word: μετὰ ταῦτα
  choice: после этого
  rationale: Естественный русский временной переход, точно передающий последовательность событий.
- source_word: δεῖ
  choice: должен
  rationale: δεῖ выражает необходимость, но сам стих не объясняет её природу. «Должен» сохраняет эту силу без богословского уточнения.
- source_word: λυθῆναι αὐτὸν
  choice: он должен быть освобождён
  rationale: Пассивный инфинитив λύω здесь означает снятие наложенного ограничения или освобождение из заточения. Пассивная форма сохранена.
- source_word: μικρὸν χρόνον
  choice: на короткое время
  rationale: Винительный длительности передан обычным русским оборотом, подчёркивающим ограниченность срока.
theological_decisions:
- issue: Характер тысячи лет
  choice: Передать прямо как «тысяча лет», без толковательного определения.
  alternative: Уточнить как буквальное тысячелетие или как символический длительный период.
  rationale: Греческий текст сам не разрешает спор о буквальном или символическом понимании этого срока; перевод сохраняет его открытость.
- issue: Смысл необходимости в δεῖ
  choice: Передать словом «должен», не уточняя источник необходимости.
  alternative: Истолковать как прямое указание на божественное предопределение либо как простую повествовательную неизбежность.
  rationale: δεῖ ясно выражает необходимость, однако данный стих не раскрывает её механизм или основание.
translation_notes:
  register: Современный литературный русский с сохранением торжественной сдержанности апокалиптического повествования. Синтаксис сделан ясным для обычного читателя; образность и богословская неоднозначность оригинала не устранены.
