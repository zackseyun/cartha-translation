id: REV.20.10
reference: Revelation 20:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ὁ διάβολος ὁ πλανῶν αὐτοὺς ἐβλήθη εἰς τὴν λίμνην τοῦ πυρὸς καὶ θείου, ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης, καὶ βασανισθήσονται ἡμέρας καὶ νυκτὸς εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/010.yaml
  text: And the devil[a], who was deceiving them, was thrown into the lake of fire and sulfur, where also the beast and the false prophet are[b], and they will be tormented day and night forever and ever.
translation:
  language: ru
  text: А дьявол, обольщавший их, был брошен в озеро огня и серы, где также находятся зверь и лжепророк, и они будут мучиться день и ночь во веки веков.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάβολος
  choice: дьявол
  rationale: В Откровении это устойчивое личное обозначение сатаны, а не общее наименование клеветника.
- source_word: ὁ πλανῶν αὐτοὺς
  choice: обольщавший их
  rationale: Субстантивированное причастие обозначает дьявола через его продолжающуюся деятельность; несовершенный вид естественно передаёт её длительность в повествовательном контексте.
- source_word: ἐβλήθη
  choice: был брошен
  rationale: Страдательная форма βάλλω здесь выражает насильственное ввержение как акт суда; современное «был брошен» ясно передаёт этот смысл.
- source_word: λίμνην τοῦ πυρὸς καὶ θείου
  choice: озеро огня и серы
  rationale: θεῖον означает серу; формулировка сохраняет греческую координацию двух родительных определений и апокалиптический образ.
- source_word: ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: где уже находятся зверь и лжепророк
  rationale: В греческом глагол отсутствует. Настоящее время соответствует продолжающемуся пребыванию после Откр 19:20; «уже» естественно передаёт καί в его контекстуальном присоединительном оттенке.
- source_word: θηρίον
  choice: зверь
  rationale: Устоявшееся и прямое обозначение апокалиптической фигуры в Откровении.
- source_word: ψευδοπροφήτης
  choice: лжепророк
  rationale: Прямой и общепринятый русский эквивалент составного греческого существительного.
- source_word: βασανισθήσονται
  choice: будут мучиться
  rationale: Передаёт тяжкое страдание, не конкретизируя способ его причинения сверх сказанного в тексте.
- source_word: ἡμέρας καὶ νυκτός
  choice: день и ночь
  rationale: Естественная русская идиома непрерывности, соответствующая греческому выражению.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устойчивый русский библейский эквивалент усиленной греческой формулы, выражающей нескончаемую длительность.
theological_decisions:
- issue: Продолжительность наказания, выраженная εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  alternative: на веки вечные; на века веков
  rationale: Устойчивая формула сохраняет усиленный и открытый по длительности смысл греческого выражения, не смягчая его и не привнося отдельной доктринальной системы.
- issue: Подразумеваемый глагол в ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: где уже находятся зверь и лжепророк
  alternative: где были зверь и лжепророк
  rationale: Поскольку греческая клауза безглагольная, русский требует восполнения. Настоящее время лучше согласуется с ближайшим контекстом и обозначает их сохраняющееся местонахождение, не превращая это восполнение в самостоятельное догматическое утверждение.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Сохранены привычные библейские термины «дьявол», «зверь», «лжепророк» и формула «во веки веков»; архаическая синтаксическая тяжеловесность избегается.
