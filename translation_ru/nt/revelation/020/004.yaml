    rationale: В SBLGNT имеется лишь начальное Καὶ εἶδον; дальнейшие винительные формы входят в тот же ряд увиденного. Повтор допустим как русское эксплицирование, но здесь он излишне отделяет вторую часть видения.
  - severity: low
    issue: «а также тех, кто»
    rationale: Союзное «а также» естественно читается как присоединение отдельной группы. Греческое οἵτινες допускает также характеристику уже названных; нейтральное «и тех, кто» лучше сохраняет спорную связь групп.
