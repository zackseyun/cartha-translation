revisions:
- from: И я увидел престолы, и они сели на них, и суд был дан им. Я увидел и души обезглавленных за свидетельство Иисуса[a] и за слово Божье, а также тех, кто не поклонился зверю и его образу и не принял начертания на лоб и на руку. Они ожили и царствовали с Мессией[b] тысячу лет.
  to: И я увидел престолы; они сели на них, и им был дан суд; я увидел души обезглавленных за свидетельство Иисуса[a] и за слово Божье, и тех, кто не поклонился зверю и его образу и не принял начертания на лоб и на руку. Они ожили и царствовали с Мессией[b] тысячу лет.
  rationale: Правка устраняет не соответствующий оригиналу повтор первого лица, заменяя его вторым однородным дополнением при начальном «я увидел», и снимает слегка толковательное значение «а также». Сохранены неопределённый субъект сидящих, широкий смысл «суда», двусмысленность «свидетельства Иисуса», а также отсутствие догматического решения относительно связи мучеников с не поклонившимися зверю.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:36:39Z'
review_pass:
  verdict: revise
  source_fidelity: Нужна небольшая правка синтаксиса. В греческом тексте один глагол εἶδον («я увидел») управляет рядом объектов; повтор «Я увидел» перед «души» не имеет отдельного соответствия в исходном тексте и членит видение сильнее, чем оригинал. Кроме того, «а также тех» несколько сильнее представляет δεύτεую группу как добавленную, хотя οἵτινες может быть как уточняющим, так и присоединительным оборотом.
  naturalness: «Они сели на них» и «им был дан суд» понятны и сохраняют намеренную неопределённость. Предлагаемое пунктуационно-синтаксическое членение делает длинное перечисление естественнее для современного литературного русского без введения второго акта видения.
  terminology: «Престолы», «души», «обезглавленных», «зверь», «образ», «начертание» и «Мессия» точны и уместны в апокалиптическом регистре. «За свидетельство Иисуса» удачно сохраняет двусмысленность родительного падежа; примечание корректно её поясняет. Якоря примечаний расположены у относящихся выражений.
