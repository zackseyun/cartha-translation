id: REV.20.4
reference: Revelation 20:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνους, καὶ ἐκάθισαν ἐπ’ αὐτούς, καὶ κρίμα ἐδόθη αὐτοῖς, καὶ τὰς ψυχὰς τῶν πεπελεκισμένων διὰ τὴν μαρτυρίαν Ἰησοῦ καὶ διὰ τὸν λόγον τοῦ θεοῦ, καὶ οἵτινες οὐ προσεκύνησαν τὸ θηρίον οὐδὲ τὴν εἰκόνα αὐτοῦ καὶ οὐκ ἔλαβον τὸ χάραγμα ἐπὶ τὸ μέτωπον καὶ ἐπὶ τὴν χεῖρα αὐτῶν· καὶ ἔζησαν καὶ ἐβασίλευσαν μετὰ τοῦ χριστοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/004.yaml
  text: And I saw thrones[a], and they sat on them, and judgment was given to them, and the souls of those who had been beheaded because of the testimony of Jesus and because of the word of God, and those who had not worshiped the beast or its image and had not received the mark on their forehead and on their hand[b]; and they came to life and reigned with the Messiah for a thousand years.
translation:
  language: ru
  text: И я увидел престолы; они сели на них, и им был дан суд; я увидел души обезглавленных за свидетельство Иисуса[a] и за слово Божье, и тех, кто не поклонился зверю и его образу и не принял начертания на лоб и на руку. Они ожили и царствовали с Мессией[b] тысячу лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за их свидетельство об Иисусе». Греческое выражение «свидетельство Иисуса» может означать как свидетельство, данное Иисусом, так и свидетельство об Иисусе.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «с Христом». Греческий титул Χριστός здесь переведён словом «Мессия», поскольку употреблён именно как титул.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θρόνους
  choice: престолы
  rationale: Прямой и естественный перевод, сохраняющий образ небесного царского суда.
- source_word: ἐκάθισαν ἐπ’ αὐτούς
  choice: они сели на них
  rationale: Сохраняет активную форму и не называет подразумеваемый субъект, который в греческом тексте прямо не определён.
- source_word: κρίμα ἐδόθη αὐτοῖς
  choice: суд был дан им
  rationale: Формулировка сохраняет диапазон значения κρίμα — суд, судебное решение или право судить — и не заменяет его однозначным толкованием.
- source_word: ψυχὰς
  choice: души
  rationale: Сохраняет прозрачный апокалиптический образ и связь между их смертью и последующим оживлением.
- source_word: πεπελεκισμένων
  choice: обезглавленных
  rationale: Точно передаёт способ казни без неестественного для русского текста уточнения об орудии.
- source_word: διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: за свидетельство Иисуса
  rationale: 'Предлог «за» естественно выражает причину преследования, а родительный оборот сохраняет неоднозначность: свидетельство Иисуса или свидетельство об Иисусе.'
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: за слово Божье
  rationale: Естественная русская формулировка, передающая причинное значение διά с винительным падежом.
- source_word: οἵτινες
  choice: тех, кто
  rationale: Передаёт выделение и характеристику группы, не навязывая решения о том, тождественна ли она ранее упомянутым мученикам.
- source_word: προσεκύνησαν
  choice: не поклонился
  rationale: В контексте поклонения зверю глагол выражает религиозное почитание; совершенный вид указывает на состоявшийся отказ.
- source_word: θηρίον
  choice: зверю
  rationale: Устоявшийся и прямой перевод апокалиптического обозначения.
- source_word: εἰκόνα
  choice: образу
  rationale: Прямой перевод, сохраняющий образную и межтекстовую связь; «идол» было бы толковательным сужением.
- source_word: χάραγμα
  choice: начертания
  rationale: Устоявшийся русский термин для знака зверя в Откровении.
- source_word: ἔζησαν
  choice: ожили
  rationale: Передаёт событийное значение глагола в контексте умерших, не добавляя уточнений о характере воскресения.
- source_word: χριστοῦ
  choice: Мессией
  rationale: Здесь Χριστός функционирует как титул; «Мессия» передаёт его значение, а традиционное «Христос» отмечено как допустимая альтернатива.
- source_word: χίλια ἔτη
  choice: тысячу лет
  rationale: Прямой перевод без истолкования характера или хронологии указанного периода.
theological_decisions:
- issue: Неопределённый субъект ἐκάθισαν и получатели суда
  choice: Сохранены местоимения «они» и «им» без отождествления с мучениками, всеми святыми, апостолами или небесным советом.
  alternative: Явно назвать сидящих мучениками, святыми либо небесными существами.
  rationale: Греческий текст оставляет субъект подразумеваемым; его конкретизация внесла бы в перевод спорное толкование.
- issue: Значение κρίμα ἐδόθη αὐτοῖς
  choice: «суд был дан им»
  alternative: «им было дано право судить» или «им была дана власть судить»
  rationale: Более развёрнутые варианты однозначно понимают κρίμα как судебную власть, тогда как греческая формулировка допускает также суд или судебное решение.
- issue: Значение διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: В основном тексте сохранено «за свидетельство Иисуса».
  alternative: «за их свидетельство об Иисусе» либо «за свидетельство, данное Иисусом»
  rationale: Родительный падеж Ἰησοῦ допускает как субъектное, так и объектное понимание; примечание сохраняет явную альтернативу.
- issue: Соотношение обезглавленных и тех, кто не поклонился зверю
  choice: Оборот «а также тех, кто» не утверждает однозначно ни полного тождества, ни полного различия групп.
  alternative: Понять второе описание исключительно как характеристику тех же мучеников либо как отдельную группу.
  rationale: Синтаксис допускает дискуссию о соотношении названных групп; перевод не должен заранее решать её.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном контексте слово выступает как титул; смысловой перевод раскрывает титульное значение, а традиционная форма приведена в примечании.
- issue: Передача ἔζησαν
  choice: «ожили»
  alternative: «стали жить», «жили» или «ожили вновь»
  rationale: «Ожили» естественно выражает переход от смерти к жизни, но не добавляет отсутствующего в греческом тексте «вновь» и не определяет богословски природу события.
translation_notes:
  register: Современный литературный русский язык с dignified апокалиптическим звучанием. Синтаксис слегка упорядочен повтором «Я увидел», чтобы длинная греческая конструкция оставалась понятной, при этом неопределённость субъектов и соотношения групп сохранена. Маркеры примечаний поставлены непосредственно после относящихся к ним выражений.
