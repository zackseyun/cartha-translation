  text: Καὶ ὅταν τελεσθῇ τὰ χίλια ἔτη, λυθήσεται ὁ Σατανᾶς ἐκ τῆς φυλακῆς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/007.yaml
  text: And when the thousand years are completed, Satan will be released from his prison,
translation:
  language: ru
  text: И когда завершится тысяча лет, Сатана будет освобождён из своей темницы,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: когда
  rationale: В сочетании с сослагательным наклонением вводит придаточное времени с ожидаемым будущим событием; «когда» естественно передаёт эту связь, не добавляя толкования.
- source_word: τελεσθῇ
  choice: завершатся
  rationale: Аорист пассивного залога от τελέω обозначает достижение установленным периодом своего завершения. Русская возвратная форма естественно передаёт результативный смысл греческого пассива.
- source_word: τὰ χίλια ἔτη
  choice: тысяча лет
  rationale: Речь идёт об уже упомянутом в контексте определённом периоде. В русском языке после «завершатся» выражение без указательного слова звучит естественно, при этом контекстуальная определённость сохраняется.
- source_word: λυθήσεται
  choice: будет освобождён
  rationale: Будущее пассивное от λύω в контексте заключения означает снятие удерживающих уз. «Будет освобождён» ясно передаёт пассивную конструкцию без архаичного оттенка.
- source_word: Σατανᾶς
  choice: сатана
  rationale: Общепринятая русская передача имени-титула; строчная буква соответствует современной практике написания этого обозначения.
- source_word: ἐκ τῆς φυλακῆς αὐτοῦ
  choice: из своей темницы
  rationale: φυλακή здесь означает место заключения. «Темница» — понятное и достойное литературное слово в библейском контексте, а возвратное «своей» однозначно соотносит место заключения с сатаной.
theological_decisions:
- issue: Характер тысячи лет
  choice: Передать прямо как «тысяча лет», не определяя, буквальный это срок или символический период.
  alternative: Истолковать как буквальное тысячелетнее царство либо как символически длительный период.
  rationale: Сам стих называет срок, но не разрешает разногласий между эсхатологическими системами; перевод не должен вносить такое решение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Союз «же» передаёт Καί как продолжение и переход в последовательности видения. Порядок слов сохраняет акцент на наступлении конца указанного периода.
