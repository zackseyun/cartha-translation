  yaml_path: translation/nt/revelation/020/002.yaml
  text: And he seized the dragon—that ancient serpent[a], who is the Devil and Satan—and bound him for a thousand years,
translation:
  language: ru
  text: И схватил он дракона — древнего змея[a], который есть Дьявол и Сатана, — и связал его на тысячу лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «того древнего змея»; возможно также: «змея издревле».'
