lexical_decisions:
- source_word: ἐκράτησεν
  choice: схватил
  rationale: Передаёт решительное и силовое действие κρατέω, оставаясь кратким и естественным в современном русском языке.
- source_word: δράκοντα
  choice: дракона
  rationale: Обычный русский эквивалент δράκων, сохраняющий апокалиптический образ и связь с другими местами Откровения.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: древнего змея
  rationale: Передаёт пояснительное приложение к слову «дракона» и естественно выражает значение ἀρχαῖος без добавочного толкования.
- source_word: Διάβολος
  choice: дьявол
  rationale: Устоявшееся русское обозначение; строчная буква соответствует современному литературному употреблению названия этого лица.
- source_word: Σατανᾶς
  choice: сатана
  rationale: Устоявшаяся русская передача личного имени или титула; строчная буква соответствует современному литературному употреблению.
- source_word: ἔδησεν
  choice: связал
  rationale: Сохраняет конкретный образ глагола δέω и не уточняет сверх текста характер ограничения.
- source_word: χίλια ἔτη
  choice: на тысячу лет
  rationale: Естественно передаёт винительный длительности в русском языке и сохраняет прямое указание на тысячу лет.
theological_decisions:
- issue: Характер тысячи лет
  choice: Передать χίλια ἔτη прямо как «на тысячу лет», не определяя, буквальный это срок или символический.
  alternative: Истолковать период как буквальное тысячелетие либо как символический срок.
  rationale: Сам стих не разрешает этот богословский спор; перевод сохраняет его формулировку и напряжение.
- issue: Отождествление дракона
  choice: 'Сохранить всю последовательность наименований: дракон, древний змей, дьявол и сатана.'
  alternative: Свести эти наименования к одному упрощённому обозначению.
  rationale: Текст явно соединяет все четыре обозначения, поэтому ни одно из них не следует опускать.
- issue: Синтаксис ὅς ἐστιν
  choice: 'Передать буквально и ясно: «который есть дьявол и сатана».'
  alternative: «то есть дьявола и сатану» или «это дьявол и сатана».
  rationale: Форма «который есть» сохраняет относительную конструкцию греческого текста и её торжественный характер, хотя звучит несколько книжно.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Конкретные образы «схватил» и «связал» сохранены; спорный смысл тысячелетнего периода не истолкован.
