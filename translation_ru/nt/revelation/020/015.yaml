id: REV.20.15
reference: Revelation 20:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἴ τις οὐχ εὑρέθη ἐν ⸂τῇ βίβλῳ⸃ τῆς ζωῆς γεγραμμένος, ἐβλήθη εἰς τὴν λίμνην τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/015.yaml
  text: And if anyone was not found written in the book of life[b][a], he was thrown into the lake of fire.
translation:
  language: ru
  text: И если кто не оказался записанным в книге жизни[a], тот был брошен в огненное озеро.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в свитке жизни». Греческое слово может означать как книгу, так и свиток.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: если кто
  rationale: Передаёт открытое неопределённое условие и естественно звучит в современном русском языке.
- source_word: οὐχ εὑρέθη ... γεγραμμένος
  choice: не оказался записанным
  rationale: Сохраняет как смысл обнаружения при рассмотрении, выраженный εὑρέθη, так и состояние записи, выраженное перфектным причастием γεγραμμένος; по-русски это естественнее буквального «не был найден записанным».
- source_word: ἐν τῇ βίβλῳ τῆς ζωῆς
  choice: в книге жизни
  rationale: «Книга жизни» — ясное и устойчивое русское соответствие; возможность значения «свиток» отмечена в сноске.
- source_word: ἐβλήθη
  choice: был брошен
  rationale: Точно передаёт пассивную форму и насильственный характер действия без архаичного оттенка.
- source_word: εἰς τὴν λίμνην τοῦ πυρός
  choice: в огненное озеро
  rationale: Естественное русское выражение, сохраняющее апокалиптический образ; родительный τοῦ πυρός идиоматически передан прилагательным «огненное».
- source_word: τις ... γεγραμμένος / ἐβλήθη
  choice: кто ... записанным, тот был брошен
  rationale: Русская соотносительная конструкция сохраняет единичное, обобщённо-личное обозначение и мужской грамматический род исходных форм.
theological_decisions:
- issue: Обобщённо-личная форма мужского рода
  choice: кто ... записанным, тот был брошен
  alternative: если какой-либо человек не оказался записанным ... он был брошен
  rationale: Выбранная конструкция естественна по-русски и сохраняет грамматическое единственное число и мужской род, не утверждая, что речь идёт исключительно о мужчинах.
- issue: Образ окончательного суда
  choice: огненное озеро
  alternative: озеро огня
  rationale: Образ сохранён без истолкования природы окончательного наказания; более естественная русская форма не снимает богословского напряжения текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конструкция «не оказался записанным» избегает тяжёлой кальки, но сохраняет судебно-проверочный оттенок исходного текста.
