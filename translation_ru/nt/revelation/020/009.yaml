  text: καὶ ἀνέβησαν ἐπὶ τὸ πλάτος τῆς γῆς, καὶ ⸀ἐκύκλευσαν τὴν παρεμβολὴν τῶν ἁγίων καὶ τὴν πόλιν τὴν ἠγαπημένην. καὶ κατέβη πῦρ ⸂ἐκ τοῦ οὐρανοῦ⸃ καὶ κατέφαγεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/009.yaml
  text: And they came up over the breadth of the earth and surrounded the camp of the saints and the beloved city[c][b][a]. And fire came down from heaven and consumed them.
translation:
  language: ru
  text: И поднялись они на широкие просторы земли и окружили стан святых и возлюбленный город.[a] И сошёл с неба огонь и поглотил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В данном стихе не уточняется, какой именно город назван «возлюбленным»; его часто понимают как Иерусалим или, шире, как город Божий.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβησαν
  choice: вышли
  rationale: Аорист ἀναβαίνω выражает движение вверх или выступление вперёд. «Вышли» естественно для повествования о наступающих войсках и не навязывает конкретной географии.
- source_word: ἐπὶ τὸ πλάτος τῆς γῆς
  choice: на широкие просторы земли
  rationale: πλάτος означает ширину или широкое пространство. Русское выражение передаёт образ огромного пространства без добавления отсутствующей в греческом слова «равнина».
- source_word: ἐκύκλευσαν
  choice: окружили
  rationale: Глагол означает «обступить кругом, окружить»; выбран ясный и современный русский эквивалент.
- source_word: παρεμβολὴν
  choice: стан
  rationale: παρεμβολή обозначает лагерь или стан, нередко военный. «Стан» кратко сохраняет библейско-военный образ и соответствует достоинству регистра.
- source_word: τῶν ἁγίων
  choice: святых
  rationale: Субстантивированное ἅγιοι традиционно и точно передаётся как «святые», сохраняя межтекстовую связь в Откровении.
- source_word: τὴν πόλιν τὴν ἠγαπημένην
  choice: возлюбленный город
  rationale: Причастие ἠγαπημένην означает «возлюбленный, любимый». Формулировка сохраняет пассивный смысл и не называет прямо того, кто любит город.
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: сошёл с неба огонь
  rationale: Прямо передаёт движение огня с неба и сохраняет порядок образов, естественный для возвышенного русского повествования.
- source_word: κατέφαγεν αὐτούς
  choice: поглотил их
  rationale: κατεσθίω буквально значит «съесть, пожрать», а применительно к огню — полностью уничтожить. «Поглотил» сохраняет яркость исходной метафоры и естественно сочетается с огнём.
theological_decisions:
- issue: Кого или что обозначает «возлюбленный город»
  choice: Оставить общее обозначение «возлюбленный город», не отождествляя его в основном тексте.
  alternative: Иерусалим; эсхатологический город или народ Божий.
  rationale: Греческий текст в данном стихе не называет город. Более точное отождествление устранило бы намеренно сохраняемую текстом неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Широкие просторы» выбраны ради естественности без добавления образа равнины; «стан» и «поглотил» сохраняют образность оригинала. Единственная сноска отмечена в основном тексте.
