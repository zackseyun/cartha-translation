  terminology: «Святые» последовательно передаёт ἅγιοι; «стан» удачно сохраняет лагерно-военный образ παρεμβολή. «Возлюбленный город» не вводит неуказанного в тексте субъекта любви и не отождествляет город с Иерусалимом или иной реальностью. Сноска корректно сохраняет эту неопределённость.
