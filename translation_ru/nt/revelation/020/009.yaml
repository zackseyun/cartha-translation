  source_fidelity: 'Требуется небольшая правка первого глагола: «вышли» не передаёт семантику ἀνέβησαν («поднялись / взошли»). «Поднялись» сохраняет движение, обозначенное греческим глаголом, не уточняя географию. «На широкие просторы земли» приемлемо передаёт ἐπὶ τὸ πλάτος τῆς γῆς без добавления «равнины». Остальные соответствия точны: «окружили», «стан святых», «возлюбленный город», «сошёл с неба огонь», «поглотил их».'
