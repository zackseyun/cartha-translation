  text: Καὶ εἶδον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα τὴν κλεῖν τῆς ἀβύσσου καὶ ἅλυσιν μεγάλην ἐπὶ τὴν χεῖρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/001.yaml
  text: And I saw an angel coming down from heaven[a], holding the key to the abyss and a great chain in his hand.
translation:
  language: ru
  text: И увидел я ангела, сходящего с неба, с ключом от бездны[a] и большой цепью в руке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бездонная пропасть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Сохраняет характерную для Откровения последовательную связь видений без добавления более толковательного «затем».
- source_word: εἶδον
  choice: увидел я
  rationale: Прямо передаёт аорист ὁράω в повествовании о видении; постпозиция местоимения поддерживает естественный для русского библейского повествования возвышенный ритм.
- source_word: ἄγγελον
  choice: ангела
  rationale: В данном апокалиптическом контексте речь явно идёт о небесном существе, поэтому «ангел» точнее общего «вестник».
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: сходящего с неба
  rationale: Передаёт одновременное зрительно воспринимаемое движение вниз и небесное происхождение ангела; «с неба» в этом контексте естественнее, чем пространное «из небес».
- source_word: ἔχοντα
  choice: у которого были
  rationale: Причастие относится к ангелу и охватывает оба предмета. Такая конструкция естественно передаёт наличие при нём ключа и цепи, не утверждая сверх текста, что оба предмета он сжимал одной рукой.
- source_word: τὴν κλεῖν τῆς ἀβύσσου
  choice: ключ от бездны
  rationale: Русская конструкция «ключ от» идиоматично выражает связь ключа с тем, что он отпирает; определённость понятна из уникальной функции предмета.
- source_word: ἅλυσιν μεγάλην
  choice: большая цепь
  rationale: «Большая» прямо и естественно передаёт μέγας как указание на размер или внушительность, не усиливая образ до «огромной» или «массивной».
- source_word: ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: в руке
  rationale: Хотя предлог буквально допускает образ «на руке», по-русски «в руке» естественно обозначает удерживание или нахождение предмета при руке. Фраза поставлена после «цепи», как и в греческом, поэтому ближайшим образом относится к ней.
theological_decisions:
- issue: Передача ἄβυσσος в апокалиптическом контексте
  choice: бездна
  alternative: бездонная пропасть
  rationale: «Бездна» непосредственно и без лишней конкретизации передаёт греческое ἄβυσσος, сохраняя апокалиптический образ и не добавляя слова «яма» или обязательного пространственного описания.
- issue: К чему относится выражение ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: сохранена естественная связь прежде всего с цепью
  alternative: явно представить и ключ, и цепь находящимися в одной руке
  rationale: Греческий порядок ставит выражение «на/в руке его» после «большой цепи», но синтаксис может шире описывать то, что ангел имеет при себе. Перевод не превращает эту деталь в богословски значимое уточнение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным ритмом. Сохранена паратактическая связь «И», но избегнуты архаизмы вроде «нисходящего» и «имевшего».
