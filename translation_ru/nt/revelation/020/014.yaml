  text: And Death and Hades were thrown into the lake of fire. This is the second death[a], the lake of fire.
translation:
  language: ru
  text: 'И Смерть, и Аид[a] были брошены в огненное озеро. Это — вторая смерть: огненное озеро.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мир мёртвых». Греческое слово «Аид» здесь не обозначает огненное озеро: Аид сам брошен в него. Поэтому перевод «ад» может размыть различие между Аидом и огненным озером.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θάνατος
  choice: Смерть / смерть
  rationale: 'В первой части слово передано с прописной буквы, поскольку Смерть вместе с Аидом представлена как олицетворённая сущность, которую бросают в озеро. В выражении «вторая смерть» употреблена строчная буква: здесь это наименование суда или состояния.'
- source_word: ᾅδης
  choice: Аид
  rationale: Транслитерация сохраняет особое греческое понятие и не отождествляет его с огненным озером. Перевод «ад» в современном русском мог бы создать впечатление, будто речь уже идёт о месте окончательного наказания.
- source_word: ἐβλήθησαν
  choice: были брошены
  rationale: Естественная современная передача аориста страдательного залога, сохраняющая образ насильственного низвержения.
- source_word: λίμνη τοῦ πυρός
  choice: огненное озеро
  rationale: Устоявшаяся и понятная русская передача образа; повторена во второй части, как и в греческом тексте.
- source_word: οὗτος ... ἐστιν
  choice: Это —
  rationale: Сохраняет прямое отождествление, выраженное указательным местоимением и связкой.
- source_word: θάνατος ὁ δεύτερος
  choice: вторая смерть
  rationale: Естественная русская передача греческой именной группы и устойчивого апокалиптического выражения.
theological_decisions:
- issue: Передача ᾅδης в контексте окончательного суда
  choice: Аид
  alternative: ад; мир мёртвых; могила
  rationale: В стихе Аид отличён от огненного озера и сам брошен в него. «Аид» сохраняет это различие, не навязывая конкретной богословской схемы.
- issue: Олицетворение θάνατος
  choice: «Смерть» в первой части; «смерть» во второй
  alternative: строчная или прописная буква в обоих случаях
  rationale: Прописная буква передаёт олицетворение в паре «Смерть и Аид», а строчная не превращает выражение «вторая смерть» в отдельное действующее лицо.
- issue: Связь выражений «вторая смерть» и «огненное озеро»
  choice: Сохранено приложение через запятую
  alternative: пояснительная конструкция с двоеточием или «то есть»
  rationale: Запятая сохраняет сжатую греческую конструкцию и прямое соположение двух обозначений, не усиливая толкование.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического образа. Союз «и … и …» воспроизводит парное выделение подлежащих; повтор «огненное озеро» сохраняет риторическую структуру оригинала.
