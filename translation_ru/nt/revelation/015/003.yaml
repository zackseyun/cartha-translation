id: REV.15.3
reference: Revelation 15:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν τὴν ᾠδὴν Μωϋσέως τοῦ δούλου τοῦ θεοῦ καὶ τὴν ᾠδὴν τοῦ ἀρνίου λέγοντες· Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου, κύριε, ὁ θεός, ὁ παντοκράτωρ· δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου, ὁ βασιλεὺς τῶν ⸀αἰώνων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/003.yaml
  text: 'And they sing the song of Moses[a], the servant of God, and the song of the Lamb, saying: “Great and marvelous are your works, Lord God, the Almighty; righteous and true are your ways, O King of the ages.”'
translation:
  language: ru
  text: 'И поют они песнь Моисея, раба Божьего, и песнь Агнца, говоря: «Велики и дивны дела Твои, Господи Боже Вседержитель! Праведны и истинны пути Твои, Царь веков[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Царь народов».'
    reason: textual_variant
lexical_decisions:
- source_word: ᾄδουσιν
  choice: поют
  rationale: Настоящее время естественно передаётся как живое настоящее в повествовании о видении.
- source_word: ᾠδὴν
  choice: песнь
  rationale: Передаёт обычное значение слова и сохраняет возвышенный поэтический регистр, не добавляя более узкой литургической окраски слова «гимн».
- source_word: Μωϋσέως
  choice: Моисея
  rationale: Стандартная русская форма библейского имени в требуемом падеже.
- source_word: δούλου
  choice: раба
  rationale: Сохраняет значение принадлежности Богу и служения по Его поручению; в русском библейском контексте «раб Божий» — понятное и торжественное обозначение, не требующее смягчения до «служителя».
- source_word: ἀρνίου
  choice: Агнца
  rationale: В Откровении это христологический титул; традиционная форма сохраняет жертвенный и мессианский образ.
- source_word: λέγοντες
  choice: говоря
  rationale: Причастие прямо вводит содержание песни и близко соответствует греческой конструкции.
- source_word: Μεγάλα καὶ θαυμαστὰ
  choice: велики и дивны
  rationale: Естественная русская предикативная конструкция, сохраняющая величие и вызывающий изумление характер Божьих дел.
- source_word: ἔργα
  choice: дела
  rationale: Обычное и точное обозначение Божьих деяний по-русски.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Господи Боже Вседержитель
  rationale: Сохраняет все три элемента обращения и естественно звучит в возвышенной русской речи.
- source_word: δίκαιαι καὶ ἀληθιναὶ
  choice: праведны и истинны
  rationale: Сохраняет морально-богословский оттенок δίκαιαι и значение подлинности, верности истине у ἀληθιναί.
- source_word: ὁ βασιλεὺς τῶν αἰώνων
  choice: Царь веков
  rationale: Формально и ёмко передаёт чтение SBLGNT αἰώνων, не подменяя его значительным вариантом «народов».
theological_decisions:
- issue: Передача δοῦλος в титуле Моисея
  choice: раб Божий
  alternative: служитель Божий
  rationale: «Раб» сохраняет семантику принадлежности Богу и подчинённого служения, тогда как «служитель» смягчает исходный термин.
- issue: Текстовая форма заключительного божественного титула
  choice: Царь веков
  alternative: Царь народов
  rationale: Основной текст следует предоставленному SBLGNT с αἰώνων («веков»); существенный рукописный вариант передан в сноске.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным библейско-поэтическим звучанием. Формы «песнь», «Агнец», «Вседержитель» и «Царь веков» оправданы жанром небесной песни; синтаксис остаётся ясным для обычного читателя.
