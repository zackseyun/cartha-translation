id: REV.15.2
reference: Revelation 15:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὡς θάλασσαν ὑαλίνην μεμιγμένην πυρί, καὶ τοὺς νικῶντας ἐκ τοῦ θηρίου καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην, ἔχοντας κιθάρας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/002.yaml
  text: And I saw what appeared to be a sea of glass mixed with fire[a], and those who were victorious over the beast and over its image and over the number of its name, standing on the sea of glass[b], holding harps of God.
translation:
  language: ru
  text: И увидел я нечто подобное стеклянному морю, смешанному с огнём, и тех, кто одержал победу над зверем, над его образом и над числом его имени[a]. Они стояли на стеклянном море, держа Божьи кифары[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «побеждающих от зверя…». Греческая конструкция может указывать как на победу над зверем, его образом и числом его имени, так и на выход из-под их власти.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «кифары Бога». Родительный падеж может указывать на принадлежность Богу, происхождение от Него или посвящение Ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: нечто подобное
  rationale: Передаёт характерное для видения сравнение, не отождествляя увиденное буквально с морем.
- source_word: θάλασσαν ὑαλίνην
  choice: стеклянному морю / стеклянном море
  rationale: Сохраняет яркий образ и повтор исходного выражения; «стеклянное море» естественно и узнаваемо в русском библейском стиле.
- source_word: μεμιγμένην πυρί
  choice: смешанному с огнём
  rationale: Прямо передаёт причастную конструкцию и не истолковывает необычный состав образа.
- source_word: τοὺς νικῶντας
  choice: тех, кто одержал победу
  rationale: Передаёт значение преодоления или победы и естественно сочетается в русском языке с последующим «над».
- source_word: ἐκ τοῦ θηρίου ... καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ
  choice: над зверем, над его образом и над числом его имени
  rationale: В сочетании с νικάω выражает победу над враждебными силами; повтор «над» сохраняет трёхчастную структуру, хотя ἐκ допускает оттенок выхода из-под их власти.
- source_word: ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην
  choice: стояли на стеклянном море
  rationale: Сохраняет поразительный пространственный образ; вариант «у моря» был бы менее буквальным и ослаблял бы ἐπί.
- source_word: κιθάρας τοῦ θεοῦ
  choice: Божьи кифары
  rationale: Сохраняет родительный оборот как обозначение принадлежности, происхождения или посвящения; «кифары» точнее исторически, чем современное «арфы».
theological_decisions:
- issue: Отношение победителей к зверю, выраженное повторяющимся ἐκ после νικῶντας
  choice: Они одержали победу над зверем, его образом и числом его имени.
  alternative: Они вышли из-под власти зверя, его образа и числа его имени.
  rationale: Русская конструкция «одержать победу над» естественно передаёт основной смысл νικάω, тогда как примечание сохраняет возможный оттенок избавления или выхода из сферы власти, присущий ἐκ.
- issue: Значение родительного τοῦ θεοῦ при κιθάρας
  choice: Божьи кифары
  alternative: кифары, данные Богом / посвящённые Богу
  rationale: Основной текст не уточняет, обозначает ли родительный принадлежность, источник или посвящение, а примечание сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «И увидел я» сохраняет ритм видения; второе причастное построение разделено на отдельное предложение ради ясности. Термин «кифары» сохраняет историко-культурную точность.
