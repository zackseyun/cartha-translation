source:
  edition: SBLGNT
  text: τίς οὐ μὴ ⸀φοβηθῇ, κύριε, καὶ ⸀δοξάσει τὸ ὄνομά σου, ὅτι μόνος ⸀ὅσιος; ὅτι πάντα τὰ ἔθνη ἥξουσιν καὶ προσκυνήσουσιν ἐνώπιόν σου, ὅτι τὰ δικαιώματά σου ἐφανερώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/004.yaml
  text: Who will not fear[a], Lord, and glorify your name? For you alone are holy. For all the nations will come and worship before you, because your righteous acts have been revealed.
translation:
  language: ru
  text: Кто не убоится Тебя, Господи, и не прославит Твоё имя? Ибо Ты один свят. Ибо все народы придут и поклонятся пред Тобой, потому что Твои праведные деяния стали явными.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праведные суды Твои». Греческое слово может также означать судебные решения или установления, но здесь, вероятно, речь идёт о ставших явными справедливых деяниях Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς οὐ μὴ φοβηθῇ
  choice: Кто не убоится Тебя
  rationale: Риторический вопрос с οὐ μή предполагает ответ «никто» и имеет выраженную будущую направленность. «Не убоится» сохраняет эту силу и уместный возвышенный регистр.
- source_word: κύριε
  choice: Господи
  rationale: Звательная форма κύριος передана естественным русским обращением «Господи».
- source_word: δοξάσει τὸ ὄνομά σου
  choice: не прославит имени Твоего
  rationale: «Прославить имя» сохраняет библейский образ почитания открытого людям Божьего характера и славы.
- source_word: μόνος ὅσιος
  choice: Ты один свят
  rationale: В славословии ὅσιος указывает на исключительную святость и нравственную чистоту Бога; по-русски «свят» звучит естественно и весомо.
- source_word: πάντα τὰ ἔθνη
  choice: все народы
  rationale: Передаёт всеобщий этнический и национальный охват, не сужая значение до язычников в противопоставлении иудеям.
- source_word: ἥξουσιν
  choice: придут
  rationale: Простая форма будущего времени точно и естественно передаёт пророческую перспективу.
- source_word: προσκυνήσουσιν ἐνώπιόν σου
  choice: поклонятся пред Тобой
  rationale: «Поклонятся» передаёт религиозное поклонение, а «пред Тобой» сохраняет пространственно-литургический оборот ἐνώπιόν σου.
- source_word: τὰ δικαιώματά σου
  choice: праведные деяния Твои
  rationale: δικαίωμα допускает значения праведного дела, судебного решения и установления. В контексте явленной Божьей справедливости «праведные деяния» сохраняет широту смысла.
- source_word: ἐφανερώθησαν
  choice: открылись
  rationale: Аорист пассива обозначает, что Божьи деяния стали явными; «открылись» лаконично выражает совершившееся проявление с актуальным результатом.
theological_decisions:
- issue: Значение ὅσιος в обращённом к Богу славословии
  choice: свят
  alternative: верен; благочестив
  rationale: Контекст поклонения подчёркивает уникальную святость и нравственную чистоту Бога. «Верный» неоправданно сужает смысл до надёжности, а «благочестивый» менее естественно как определение Бога.
- issue: Значение δικαιώματα в контексте апокалиптического суда
  choice: праведные деяния
  alternative: праведные суды; установления
  rationale: Речь идёт о ставших явными проявлениях Божьей справедливости. Основной вариант сохраняет семантическую широту, а судебный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Формы «Господи», «убоится» и «пред Тобой» поддерживают достоинство песни, не делая текст чрезмерно архаичным. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской религиозно-издательской традиции.
