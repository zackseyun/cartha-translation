id: REV.15.8
reference: Revelation 15:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐγεμίσθη ὁ ναὸς καπνοῦ ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ, καὶ οὐδεὶς ἐδύνατο εἰσελθεῖν εἰς τὸν ναὸν ἄχρι τελεσθῶσιν αἱ ἑπτὰ πληγαὶ τῶν ἑπτὰ ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/008.yaml
  text: And the sanctuary was filled with smoke from the glory of God and from his power[a], and no one was able to enter the sanctuary until the seven plagues of the seven angels were finished.
translation:
  language: ru
  text: И святилище наполнилось дымом от славы Бога и от Его силы, и никто не мог войти в святилище, пока не завершились семь язв семи ангелов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть семь язв, связанных с семью ангелами; греческое выражение не уточняет характер этой связи.
    reason: preserved_ambiguity
lexical_decisions:
- source_word: ναὸς
  choice: святилище
  rationale: В Откровении ναός обычно обозначает собственно священное место Божьего присутствия, а не весь храмовый комплекс; «святилище» передаёт эту специфику и естественно звучит по-русски.
- source_word: ἐγεμίσθη
  choice: наполнилось
  rationale: Форма аориста страдательного залога передана русским возвратным глаголом совершенного вида, естественно выражающим наступивший результат.
- source_word: καπνοῦ
  choice: дымом
  rationale: Родительный падеж при γεμίζω обозначает содержимое; русский творительный после «наполнилось» точно и естественно передаёт эту связь. «Дым» соответствует контексту богоявления.
- source_word: ἐκ τῆς δόξης τοῦ θεοῦ
  choice: от славы Бога
  rationale: ἐκ обозначает источник; предлог «от» сохраняет образ дыма, исходящего от явленной Божьей славы.
- source_word: ἐκ τῆς δυνάμεως αὐτοῦ
  choice: от Его силы
  rationale: Сохраняется параллелизм двух оборотов с ἐκ и прямое значение δύναμις как силы или могущества.
- source_word: οὐδεὶς ἐδύνατο
  choice: никто не мог
  rationale: Краткое и естественное русское соответствие, передающее выраженную имперфектом продолжающуюся невозможность.
- source_word: ἄχρι τελεσθῶσιν
  choice: пока не завершились
  rationale: Оборот обозначает временной предел; совершенный вид передаёт достижение завершения. Русская конструкция «пока не» идиоматична и не меняет смысла.
- source_word: πληγαὶ
  choice: бедствия
  rationale: В данном апокалиптическом контексте речь идёт о поражающих Божьих карах. «Бедствия» понятно современному читателю и не сужает значение до эпидемий, как могло бы слово «язвы».
- source_word: τῶν ἑπτὰ ἀγγέλων
  choice: семи ангелов
  rationale: 'Родительный падеж сохраняет компактную и допускающую естественную ассоциацию формулировку источника: это бедствия, связанные с семью ангелами.'
theological_decisions:
- issue: Передача ναός в контексте небесного поклонения
  choice: святилище
  alternative: храм
  rationale: «Святилище» указывает на внутреннее святое место Божьего присутствия, не отождествляя его со всем храмовым комплексом и не добавляя конфессионального толкования.
- issue: Характер связи семи бедствий с семью ангелами
  choice: семь бедствий семи ангелов
  alternative: семь бедствий, принесённых семью ангелами
  rationale: Греческий родительный падеж сам по себе не уточняет, несут ли ангелы бедствия, распоряжаются ими или лишь связаны с ними. Буквенная русская конструкция сохраняет эту неоднозначность; пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Повтор «святилище» сохранён вслед за греческим текстом. Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской издательской норме.
