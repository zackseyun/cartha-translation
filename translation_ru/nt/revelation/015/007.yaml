  text: καὶ ἓν ἐκ τῶν τεσσάρων ζῴων ἔδωκεν τοῖς ἑπτὰ ἀγγέλοις ἑπτὰ φιάλας χρυσᾶς γεμούσας τοῦ θυμοῦ τοῦ θεοῦ τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/007.yaml
  text: And one of the four living creatures gave to the seven angels seven golden bowls full of the wrath of God[b][a], who lives forever and ever.
translation:
  language: ru
  text: И одно из четырёх живых существ дало семи ангелам семь золотых чаш[a], наполненных гневом Бога, живущего во веки веков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семь золотых фиал»; греческое слово обозначает чашеобразный сосуд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν ἐκ τῶν τεσσάρων ζῴων
  choice: одно из четырёх живых существ
  rationale: В Откровении ζῷον обозначает живых существ у престола и отличается от θηρίον («зверь»); выбранный перевод сохраняет это различие и согласуется со средним родом греческого числительного.
- source_word: ἔδωκεν τοῖς ἑπτὰ ἀγγέλοις
  choice: дало семи ангелам
  rationale: Прямой и естественный перевод аориста δίδωμι и дательного адресата.
- source_word: ἑπτὰ φιάλας χρυσᾶς
  choice: семь золотых чаш
  rationale: φιάλη — широкая, сравнительно неглубокая чашеобразная ёмкость; «чаши» понятно современному читателю и не создаёт ошибочного образа узких сосудов.
- source_word: γεμούσας τοῦ θυμοῦ τοῦ θεοῦ
  choice: наполненных яростью Бога
  rationale: Причастие с родительным передаёт наполненность; «ярость» сохраняет интенсивность θυμός и звучит естественнее сочетания «гневом гнева», не добавляя причин или целей суда.
- source_word: τοῦ ζῶντος
  choice: живущего
  rationale: Причастие относится к Богу; форма «живущего» прямо сохраняет его атрибутивную связь с существительным.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устоявшийся, понятный и торжественный русский эквивалент греческой формулы неограниченной длительности.
theological_decisions:
- issue: Передача θυμός применительно к Богу
  choice: ярость Бога
  alternative: гнев Бога
  rationale: В данном контексте θυμός выражает предельную силу Божьего негодования в эсхатологическом суде. «Ярость» сохраняет интенсивность термина, тогда как «гнев» также возможен, но может стирать различие между θυμός и ὀργή.
- issue: Связь определения «живущий» с вечностью
  choice: Бога, живущего во веки веков
  alternative: живого Бога во веки веков
  rationale: Выбранная конструкция ясно связывает τοῦ ζῶντος с θεοῦ, а εἰς τοὺς αἰῶνας τῶν αἰώνων — с Божьей жизнью, не превращая причастие в отдельный титул и не добавляя догматических уточнений.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис близок к греческому, но естественен по-русски; формула «во веки веков» сохранена как общеупотребительный библейский оборот.
