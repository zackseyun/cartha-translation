  text: Καὶ μετὰ ταῦτα εἶδον, καὶ ἠνοίγη ὁ ναὸς τῆς σκηνῆς τοῦ μαρτυρίου ἐν τῷ οὐρανῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/005.yaml
  text: And after these things I saw[a], and the temple of the tabernacle of the testimony in heaven was opened[b],
translation:
  language: ru
  text: 'И после этого я увидел: на небе открылся храм скинии свидетельства.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Скиния свидетельства» — ветхозаветное культовое выражение, связанное со скинией Израиля.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ μετὰ ταῦτα
  choice: И после этого
  rationale: Сохраняет последовательную связь с предыдущим видением и начальное καί; русское «после этого» естественно передаёт множественное ταῦτα в данной формуле повествования.
- source_word: εἶδον
  choice: я увидел
  rationale: Прямо передаёт аорист ὁράω как восприятие в видении, не смещая смысл к намеренному взгляду.
- source_word: ἠνοίγη
  choice: открылось
  rationale: Естественно передаёт аорист пассивного залога; русская возвратная форма сохраняет событие открытия без указания действующего лица.
- source_word: ὁ ναὸς
  choice: святилище
  rationale: ναός обозначает храмовое святилище, особенно внутреннюю святую часть, а не весь храмовый комплекс; в сочетании со скинией «святилище» также звучит естественнее, чем «храм».
- source_word: τῆς σκηνῆς
  choice: скиния
  rationale: В культовом библейском контексте σκηνή отсылает к походному святилищу Израиля; традиционное «скиния» сохраняет эту межтекстовую связь.
- source_word: τοῦ μαρτυρίου
  choice: свидетельства
  rationale: Передаёт μαρτύριον и устойчивую ветхозаветную формулу, связанную с Божьим свидетельством завета.
- source_word: ἐν τῷ οὐρανῷ
  choice: на небе
  rationale: Обычное современное русское обозначение небесной сферы; положение фразы ясно относит открывшееся святилище к небу.
theological_decisions:
- issue: Культовый образ небесного святилища
  choice: Сохранить оба образа — святилище и скинию свидетельства — связав их пояснительным тире.
  alternative: «открылся храм скинии свидетельства на небе» или обобщённое «открылось небесное святилище»
  rationale: Греческая цепочка родительных определений намеренно соединяет небесный ναός с ветхозаветной σκηνή τοῦ μαρτυρίου. Русская конструкция с тире сохраняет оба образа и их напряжение, не сводя их к общему парафразу и не создавая впечатления, будто храм находится внутри отдельной скинии.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного библейского регистра. Двоеточие естественно вводит содержание увиденного, а тире помогает ясно передать плотную греческую цепочку культовых определений. Маркер сноски помещён непосредственно после соответствующего выражения.
