source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ πληγὰς ἐκ τοῦ ναοῦ, ⸀ἐνδεδυμένοι ⸀λίνον καθαρὸν λαμπρὸν καὶ περιεζωσμένοι περὶ τὰ στήθη ζώνας χρυσᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/006.yaml
  text: And the seven angels who had the seven plagues came out from the sanctuary[a], clothed in clean, bright linen[c][b], and wrapped around the chest with golden sashes.
translation:
  language: ru
  text: И семь ангелов, у которых были семь язв, вышли из святилища[a], одетые в чистую, сияющую льняную одежду[b] и опоясанные вокруг груди золотыми поясами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храма»; греческое слово ναός обычно обозначает собственно святилище, а не весь храмовый комплекс.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в чистое, блестящее льняное облачение».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «перевязями». Пояса располагались вокруг груди, а не на талии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: вышли
  rationale: Аорист ἐξέρχομαι обозначает движение наружу; «вышли» естественно и точно передаёт это направление.
- source_word: ἄγγελοι
  choice: ангелы
  rationale: В контексте небесного видения Откровения речь идёт о сверхъестественных ангелах, а не о человеческих вестниках.
- source_word: πληγάς
  choice: язв
  rationale: В Откровении слово обозначает ниспосланные Богом поражения и бедствия; «язвы» сохраняет устойчивую библейскую лексику и связь с последующими казнями.
- source_word: ναοῦ
  choice: святилища
  rationale: ναός обозначает собственно священное внутреннее помещение, а не весь храмовый комплекс; «святилище» сохраняет эту конкретность.
- source_word: ἐνδεδυμένοι
  choice: одетые
  rationale: Причастие описывает состояние ангелов; «одетые» ясно и естественно в современном русском языке.
- source_word: λίνον
  choice: лён
  rationale: Существительное называет льняную ткань или одежду из неё. Буквальное «лён» сохраняет образ и не добавляет отсутствующего в греческом определения «тонкий».
- source_word: καθαρὸν λαμπρὸν
  choice: чистый, сияющий
  rationale: «Чистый» непосредственно передаёт καθαρός, а «сияющий» — зрительный блеск λαμπρός; сочетание звучит естественно и сохраняет оба определения.
- source_word: περιεζωσμένοι περὶ τὰ στήθη
  choice: опоясанные вокруг груди
  rationale: Форма περιζώννυμι передаёт обвязывание или препоясывание, а περὶ τὰ στήθη указывает необычное расположение поясов на груди, а не на талии.
- source_word: ζώνας χρυσᾶς
  choice: золотыми поясами
  rationale: ζώνη означает пояс, перевязь или кушак. «Поясами» — прямой эквивалент; указание «вокруг груди» предотвращает ошибочное представление об их расположении на талии.
theological_decisions:
- issue: Передача ναός в контексте небесного храма
  choice: святилище
  alternative: храм
  rationale: «Святилище» передаёт более узкое значение внутреннего священного помещения и не отождествляет ναός со всем храмовым комплексом.
- issue: Значение καθαρός в описании льна
  choice: чистый
  alternative: непорочный
  rationale: Основное предметное значение уместно в описании одежды, при этом возможный символический оттенок чистоты не устраняется и не превращается в явное богословское толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным библейским регистром. Синтаксис сохраняет последовательность греческого описания; архаизмы вроде «облечённые» и «препоясанные» не используются.
