revisions:
- from: И семь ангелов, у которых были семь язв, вышли из святилища[a], одетые в чистый, сияющий лён[b] и опоясанные вокруг груди золотыми поясами[c].
  to: И семь ангелов, у которых были семь язв, вышли из святилища[a], одетые в чистую, сияющую льняную одежду[b] и опоясанные вокруг груди золотыми поясами[c].
