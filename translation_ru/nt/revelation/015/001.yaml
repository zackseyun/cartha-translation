id: REV.15.1
reference: Revelation 15:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο σημεῖον ἐν τῷ οὐρανῷ μέγα καὶ θαυμαστόν, ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ τὰς ἐσχάτας, ὅτι ἐν αὐταῖς ἐτελέσθη ὁ θυμὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/001.yaml
  text: 'And I saw another sign in heaven[a], great and marvelous: seven angels having seven last plagues[b], because in them the wrath of God was finished.'
translation:
  language: ru
  text: 'И увидел я другое знамение на небе, великое и поразительное[a]: семь ангелов с семью последними бедствиями, потому что в них завершился[b] гнев Божий.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великое и дивное».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пришёл к концу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: знамение
  rationale: Обычное и прозрачное обозначение видимого символического явления в Откровении; сохраняет библейскую весомость без излишнего оттенка угрозы.
- source_word: ἐν τῷ οὐρανῷ
  choice: на небе
  rationale: В апокалиптическом контексте речь идёт о небесной сфере; по-русски естественно говорить «знамение на небе».
- source_word: μέγα καὶ θαυμαστόν
  choice: великое и поразительное
  rationale: Передаёт величие и вызываемое зрелищем изумление современным, торжественным и понятным языком.
- source_word: ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ
  choice: семь ангелов с семью бедствиями
  rationale: Конструкция с «с» естественно передаёт причастие ἔχοντας, не уточняя сверх текста, каким именно образом ангелы обладали бедствиями. «Бедствия» ясно выражает здесь кары, тогда как «язвы» в современном русском прежде всего понимаются как телесные поражения.
- source_word: τὰς ἐσχάτας
  choice: последними
  rationale: Прямо сохраняет значение места в последовательности и не усиливает его толкованием.
- source_word: ὅτι
  choice: потому что
  rationale: 'Явно передаёт причинную связь: эти бедствия названы последними потому, что в них Божий гнев достигает завершения.'
- source_word: ἐν αὐταῖς
  choice: в них
  rationale: Сохраняет прямое значение предлога и образ того, что Божий гнев завершается в этих бедствиях, не заменяя его инструментальным толкованием «ими».
- source_word: ἐτελέσθη
  choice: завершился
  rationale: Передаёт достижение конца или полноты действия и сохраняет форму, в которой Божий гнев является грамматическим подлежащим.
- source_word: ὁ θυμὸς τοῦ θεοῦ
  choice: гнев Божий
  rationale: Торжественная и естественная русская формула, сохраняющая напряжённый язык Божьего суда без смягчения или усиления.
theological_decisions:
- issue: Передача языка Божьего суда в апокалиптическом контексте
  choice: гнев Божий
  alternative: ярость Бога; Божий гнев
  rationale: «Гнев» сохраняет серьёзный судебный смысл θυμός, не смягчая его до простого недовольства и не усиливая до неконтролируемой ярости.
- issue: Смысл ἐτελέσθη применительно к Божьему гневу
  choice: завершился
  alternative: исполнился; пришёл к концу
  rationale: Формулировка показывает, что в семи последних бедствиях гнев достигает завершения, но не вводит более широкого утверждения о прекращении всякого суда, которого сам стих прямо не делает.
translation_notes:
  register: Современный литературный русский язык с торжественностью, соответствующей апокалиптическому видению. Инверсия «И увидел я» сохраняет повествовательный ритм и возвышенный тон, оставаясь понятной современному читателю. Архаичное в обычной речи «язвы» заменено контекстуально ясным «бедствия».
