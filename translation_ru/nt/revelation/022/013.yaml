  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγὼ τὸ Ἄλφα καὶ τὸ Ὦ, ὁ πρῶτος καὶ ὁ ἔσχατος, ⸀ἡ ἀρχὴ καὶ ⸀τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/013.yaml
  text: I am the Alpha and the Omega[a], the first and the last, the beginning and the end.
translation:
  language: ru
  text: Я — Альфа и Омега, Первый и Последний, Начало и Конец[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Источник и Цель».'
    reason: 'Лексическая альтернатива: ἀρχή может обозначать не только начало, но и источник или происхождение, а τέλος — не только конец, но и цель или завершение.'
lexical_decisions:
- source_word: ἐγὼ
  choice: Я
  rationale: Явно передаёт усиленное греческое местоимение; тире естественно оформляет торжественное именное самообозначение в современном русском языке.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: Альфа и Омега
  rationale: Сохраняет названия первой и последней букв греческого алфавита как устойчивое символическое именование, не заменяя их русскими буквами.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: Первый и Последний
  rationale: Прямо и ритмично передаёт субстантивированные прилагательные и сохраняет их параллельность.
- source_word: ἡ ἀρχὴ καὶ τὸ τέλος
  choice: Начало и Конец
  rationale: Сохраняет краткую парную формулу и её соответствие двум предыдущим парам; возможные значения «источник» и «цель» отмечены в сноске.
theological_decisions:
- issue: Передача трёх параллельных самообозначений без избыточного истолкования их метафизического смысла
  choice: Я — Альфа и Омега, Первый и Последний, Начало и Конец.
  alternative: Я — Альфа и Омега, Первый и Последний, Источник и Цель.
  rationale: Основной текст сохраняет формальную симметрию и всеохватность трёх титульных пар, не уточняя сверх сказанного, идёт ли речь прежде всего о вечности, верховенстве, происхождении всего или окончательной цели. Семантическая возможность значений «источник» и «цель» не устраняется, а выносится в сноску.
- issue: Личность говорящего
  choice: Не добавлять имя или титул говорящего в сам стих
  alternative: Я, Иисус, — Альфа и Омега…
  rationale: Хотя ближайший контекст связывает речь с Иисусом, данный греческий стих не называет говорящего по имени; добавление имени сняло бы контекстуальное напряжение и вышло бы за пределы текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным ритмом. Заглавные буквы у парных обозначений подчёркивают их титульное употребление. Маркер сноски поставлен непосредственно после той пары, к которой относится лексическая альтернатива.
