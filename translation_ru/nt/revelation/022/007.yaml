  text: καὶ ἰδοὺ ἔρχομαι ταχύ· μακάριος ὁ τηρῶν τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/007.yaml
  text: And behold[a], I am coming soon[b]. Blessed is the one who keeps the words of the prophecy of this book.
translation:
  language: ru
  text: И вот, я скоро[a] приду. Блажен тот, кто хранит слова пророчества этой книги[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быстро»; греческое слово может указывать как на близость по времени, так и на быстроту или внезапность прихода.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «этого свитка».'
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: вот
  rationale: Естественно и точно передаёт указательно-побудительную силу греческого маркера, привлекающего внимание, без излишней архаизации.
- source_word: ἔρχομαι
  choice: я приду
  rationale: В данном контексте настоящее время имеет направленность в будущее; русское «приду» естественно передаёт обещанное прибытие. Буквальное «прихожу» здесь звучало бы неестественно.
- source_word: ταχύ
  choice: скоро
  rationale: В контексте наиболее вероятно указание на временную близость. Возможный оттенок быстроты или внезапности сохранён в сноске.
- source_word: μακάριος
  choice: блажен
  rationale: Устоявшееся и уместное для формулы блаженства слово, сохраняющее религиозно-эсхатологическую весомость, в отличие от преимущественно эмоционального «счастлив».
- source_word: ὁ τηρῶν
  choice: тот, кто хранит
  rationale: 'Передаёт обобщённое значение субстантивированного причастия и сохраняет широкий смысл τηρέω: беречь, соблюдать и держаться сказанного, не сужая его только до послушания.'
- source_word: τοὺς λόγους
  choice: слова
  rationale: Сохраняет форму множественного числа и конкретное обозначение речений пророчества; «весть» неоправданно обобщала бы выражение.
- source_word: τῆς προφητείας
  choice: пророчества
  rationale: Прямо передаёт жанрово-богословскую категорию текста и сохраняет связь «слова пророчества».
- source_word: τοῦ βιβλίου τούτου
  choice: этой книги
  rationale: Наиболее естественное современное обозначение письменного произведения и его самоназвание в данном контексте; исторически возможное «свитка» отмечено в сноске.
theological_decisions:
- issue: 'Кто говорит: «я скоро приду»'
  choice: Не добавлять имени говорящего и сохранить только первое лицо, как в греческом тексте.
  alternative: Явно вставить «Иисус» в текст стиха.
  rationale: Греческий текст не называет говорящего в самом предложении; его личность определяется литературным контекстом. Вставка имени устранила бы сохранённую оригиналом контекстуальную зависимость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным библейским регистром. «Блажен» и «слова пророчества» сохраняют торжественность жанра; архаичное «гряду» не используется. Строчная буква в местоимении «я» следует обычной современной орфографии и не добавляет отсутствующего в греческом тексте типографического истолкования.
