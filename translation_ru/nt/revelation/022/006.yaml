reference: Revelation 22:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ⸀εἶπέν μοι· Οὗτοι οἱ λόγοι πιστοὶ καὶ ἀληθινοί, καὶ ⸀ὁ κύριος, ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν, ἀπέστειλεν τὸν ἄγγελον αὐτοῦ δεῖξαι τοῖς δούλοις αὐτοῦ ἃ δεῖ γενέσθαι ἐν τάχει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/006.yaml
  text: And he said to me[a], “These words are trustworthy and true, and the Lord, the God of the spirits of the prophets[b], sent his angel to show his servants what must happen soon.”
translation:
  language: ru
  text: 'И он сказал мне: «Эти слова верны и истинны, и Господь, Бог духов пророков, послал Своего ангела показать Своим рабам[b], что должно вскоре[a] произойти».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что должно произойти быстро». Греческое выражение может подчёркивать либо близость событий во времени («вскоре»), либо быстроту их совершения («быстро»).'
    reason: alternative_reading
  - marker: b
    text: 'Или: «слугам». Слово «рабы» подчёркивает принадлежность Богу и подчинённость Ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστοὶ
  choice: верны
  rationale: В сочетании со «словами» передаёт их надёжность и достойность доверия; вместе с «истинны» сохраняет различие между надёжностью и истинностью.
- source_word: ἀληθινοί
  choice: истинны
  rationale: Прямо передаёт истинность сказанного и естественно сочетается с «верны» в современном литературном русском.
- source_word: κύριος
  choice: Господь
  rationale: Сохраняет значение божественного титула и его библейское звучание.
- source_word: ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: Бог духов пророков
  rationale: Сохраняет греческую родительную конструкцию и не сводит неоднозначную связь Бога с духами пророков к пояснительной перифразе об их вдохновении.
- source_word: ἄγγελον
  choice: ангела
  rationale: В апокалиптическом контексте речь идёт о небесном вестнике; «ангел» — точное и естественное соответствие.
- source_word: δούλοις
  choice: рабам
  rationale: Передаёт принадлежность и подчинённость Богу, выраженные словом δοῦλος, не ослабляя его до общего обозначения служения.
- source_word: δεῖξαι
  choice: показать
  rationale: Прямое соответствие глаголу δείκνυμι, уместное в контексте видения.
- source_word: ἃ δεῖ γενέσθαι
  choice: чему надлежит произойти
  rationale: Естественно по-русски выражает как необходимость, заключённую в δεῖ, так и наступление событий.
- source_word: ἐν τάχει
  choice: вскоре
  rationale: В основном тексте передаёт вероятный акцент на близости во времени; возможный смысл быстроты совершения сохранён в сноске.
- source_word: Καὶ εἶπέν μοι
  choice: И он сказал мне
  rationale: Сохраняет простой соединительный характер καί, не усиливая его до явно временного перехода.
theological_decisions:
- issue: Значение ἐν τάχει в эсхатологическом контексте
  choice: вскоре
  alternative: быстро
  rationale: Оборот может указывать как на близость событий, так и на быстроту их совершения. Основной текст сохраняет значение временной близости, а сноска — подлинную неоднозначность.
- issue: Значение δοῦλοι применительно к Божьему народу
  choice: рабы
  alternative: слуги
  rationale: «Рабы» сохраняет выраженную греческим словом принадлежность Богу и полную подчинённость Ему; более мягкий традиционный вариант приведён в сноске.
- issue: Связь в выражении θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: Бог духов пророков
  alternative: Бог, вдохновляющий пророков
  rationale: Формальная родительная конструкция не решает за читателя, обозначены ли духи, принадлежащие пророкам, пророческие духи или действие Бога как источника вдохновения.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис сделан естественным для русского языка, при этом сохранены ключевые повторы, божественный титул и неоднозначная конструкция «Бог духов пророков». Маркеры сносок помещены непосредственно при словах, к которым относятся.
