id: REV.22.17
reference: Revelation 22:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τὸ πνεῦμα καὶ ἡ νύμφη λέγουσιν· Ἔρχου· καὶ ὁ ἀκούων εἰπάτω· Ἔρχου· καὶ ὁ διψῶν ἐρχέσθω, ὁ θέλων λαβέτω ὕδωρ ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/017.yaml
  text: And the Spirit and the bride say[a], “Come.” And let the one who hears say, “Come.” And let the one who is thirsty come[c][b]; let the one who desires take the water of life freely.
translation:
  language: ru
  text: 'И Дух, и невеста говорят: «Приди!» И тот, кто слышит, пусть скажет: «Приди!» И тот, кто жаждет, пусть приходит; кто желает, пусть возьмёт воду жизни даром.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бесплатно», «без платы» или «как дар».'
    reason: Лексема δωρεάν допускает эти близкие способы передачи; «даром» кратко сохраняет как отсутствие платы, так и характер дара.
  - marker: b
    text: Первые два призыва «Приди!» часто понимают как обращение с просьбой о пришествии Господа; далее жаждущему и желающему предлагается прийти и получить воду жизни.
    reason: Греческий текст не называет адресата первых двух призывов, поэтому сноска сохраняет важное толкование, не закрепляя его в основном тексте.
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Дух
  rationale: В данном контексте Откровения определённая форма естественнее всего указывает на Святого Духа; прописная буква передаёт референциальный смысл, не выраженный отдельной формой в греческом.
- source_word: ἡ νύμφη
  choice: невеста
  rationale: Сохранён символический образ Откровения без истолковывающей подстановки «церковь», «народ Божий» или «новый Иерусалим».
- source_word: λέγουσιν
  choice: говорят
  rationale: Настоящее время передано естественным русским настоящим, выражающим продолжающийся и живой призыв.
- source_word: Ἔρχου
  choice: Приди!
  rationale: Императив второго лица единственного числа передан кратким прямым призывом; восклицательный знак естественно выражает его силу.
- source_word: ὁ ἀκούων
  choice: тот, кто слышит
  rationale: Субстантивированное причастие передано общеродовой русской конструкцией без сужения круга адресатов.
- source_word: εἰπάτω
  choice: пусть скажет
  rationale: Императив третьего лица естественно передаётся русской побудительной конструкцией с «пусть».
- source_word: ὁ διψῶν
  choice: тот, кто жаждет
  rationale: «Жаждет» сохраняет одновременно образ физической жажды и метафору глубокой духовной нужды.
- source_word: ἐρχέσθω
  choice: пусть приходит
  rationale: Императив настоящего времени передан формой несовершенного вида, естественной для открытого приглашения приблизиться.
- source_word: ὁ θέλων
  choice: кто желает
  rationale: Передаёт желание или волю без добавления отсутствующего в греческом прямого дополнения «этого».
- source_word: λαβέτω
  choice: пусть берёт
  rationale: «Берёт» сохраняет императив и параллелизм; контекст свободно предлагаемой воды исключает оттенок насильственного присвоения.
- source_word: ὕδωρ ζωῆς
  choice: воду жизни
  rationale: Прямо сохраняет родительную конструкцию и характерный для Иоанновой литературы образ, не заменяя его выражением «живую воду».
- source_word: δωρεάν
  choice: даром
  rationale: Кратко и ясно передаёт значение «бесплатно, без платы, как дар» и естественно сочетается с глаголом «берёт».
theological_decisions:
- issue: К кому обращены первые два призыва «Приди!»
  choice: Адресат прямо не назван; формулировка оставлена открытой, допуская призыв к Господу, после которого приглашение обращается к жаждущему.
  alternative: Понимать все призывы как обращённые только к Иисусу либо понимать их все как приглашение человеку прийти за водой жизни.
  rationale: В греческом первые два случая — одинаковый императив второго лица, а затем следуют императивы третьего лица о жаждущем и желающем. Перевод не добавляет не названного адресата и сохраняет литературное и богословское напряжение; пояснение вынесено в сноску.
- issue: Символический референт «невесты»
  choice: Сохранить образ «невеста» без поясняющей замены в основном тексте.
  alternative: Перевести как «церковь», «народ Божий» или «новый Иерусалим».
  rationale: Образ в Откровении намеренно объединяет несколько взаимосвязанных ассоциаций; истолковывающая замена сузила бы смысл.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксический параллелизм оригинала сохранён, но повтор союза καί передан естественно для русского. Формы «говорят», «пусть скажет», «пусть приходит», «пусть берёт» ясны обычному читателю. Все маркеры сносок присутствуют в основном тексте.
