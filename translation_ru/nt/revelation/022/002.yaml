  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐν μέσῳ τῆς πλατείας αὐτῆς· καὶ τοῦ ποταμοῦ ἐντεῦθεν καὶ ἐκεῖθεν ξύλον ζωῆς ποιοῦν καρποὺς δώδεκα, κατὰ μῆνα ἕκαστον ⸀ἀποδιδοῦν τὸν καρπὸν αὐτοῦ, καὶ τὰ φύλλα τοῦ ξύλου εἰς θεραπείαν τῶν ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/002.yaml
  text: in the middle of its street[a], and on this side and on that side of the river, was the tree of life, bearing twelve fruits, yielding its fruit each month[c][b]. And the leaves of the tree are for the healing of the nations.
translation:
  language: ru
  text: Посреди её улицы и по ту и по другую сторону реки росло дерево жизни[c], приносящее двенадцать плодов[b] и каждый месяц дающее свой плод. А листья дерева — для исцеления народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «двенадцать видов плодов». Греческое выражение буквально означает «двенадцать плодов»; в контексте оно может подразумевать двенадцать разновидностей или повторяющееся ежемесячное плодоношение.'
    reason: lexical_alternative
  - marker: c
    text: Этот образ перекликается с деревом жизни в Быт. 2:9 и с плодоносящими деревьями в Иез. 47:12.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν μέσῳ τῆς πλατείας αὐτῆς
  choice: Посреди её улицы
  rationale: Передаёт пространственное значение ἐν μέσῳ и сохраняет местоимение αὐτῆς. πλατεία здесь естественно понимать как широкую городскую улицу; вариант «площадь» возможен, но хуже согласуется с образом города в контексте.
- source_word: ἐντεῦθεν καὶ ἐκεῖθεν
  choice: по ту и по другую сторону
  rationale: Естественная русская передача буквального пространственного выражения «отсюда и оттуда», сохраняющая распределительный смысл без устранения необычной географии видения.
- source_word: ξύλον ζωῆς
  choice: дерево жизни
  rationale: Хотя ξύλον может означать также древесину, контекст Бытия и Откровения ясно указывает на дерево жизни. Единственное число сохранено.
- source_word: ποιοῦν καρποὺς δώδεκα
  choice: приносящее двенадцать плодов
  rationale: ποιοῦν с καρπούς идиоматически означает плодоношение. Греческий текст прямо говорит «двенадцать плодов», не уточняя «видов», поэтому неоднозначность сохранена и пояснена в сноске.
- source_word: κατὰ μῆνα ἕκαστον ἀποδιδοῦν τὸν καρπὸν αὐτοῦ
  choice: каждый месяц дающее свой плод
  rationale: Передаёт регулярность κατὰ μῆνα ἕκαστον и сельскохозяйственный смысл ἀποδιδοῦν; «свой плод» точно отражает τὸν καρπὸν αὐτοῦ.
- source_word: εἰς θεραπείαν τῶν ἐθνῶν
  choice: для исцеления народов
  rationale: «Для» сохраняет целевое значение εἰς, «исцеление» — конкретное значение θεραπεία, а «народы» передаёт широкий эсхатологический охват ἔθνη.
theological_decisions:
- issue: Синтаксически сжатое описание положения дерева относительно улицы и реки
  choice: Сохранить единственное число «дерево жизни» и связать его как с серединой улицы, так и с обеими сторонами реки, не перестраивая образ.
  alternative: Передать во множественном числе «деревья жизни» либо явно распределить дерево/деревья по берегам.
  rationale: Греческий текст содержит единственное число ξύλον и намеренно необычный, сжатый апокалиптический образ. Перевод сохраняет связь с деревом жизни из Бытия и не разрешает географическое напряжение за автора.
- issue: Значение выражения «двенадцать плодов»
  choice: Оставить «двенадцать плодов» в основном тексте.
  alternative: Уточнить «двенадцать видов плодов» или «двенадцать урожаев».
  rationale: καρποὺς δώδεκα не содержит слова «виды» или «урожаи». Контекст допускает эти понимания, но не требует выбрать одно из них.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но доступной библейской интонацией. Синтаксическая необычность пространственного образа намеренно сохранена; архаизмы и конфессионально окрашенные уточнения исключены.
