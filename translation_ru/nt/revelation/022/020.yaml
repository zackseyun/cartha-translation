lexical_decisions:
- source_word: Λέγει
  choice: говорит
  rationale: Настоящее время естественно передаётся обычной формулой введения прямой речи «говорит» без излишнего возвышения регистра.
- source_word: ὁ μαρτυρῶν
  choice: свидетельствующий
  rationale: Субстантивированное причастие настоящего времени обозначает того, кто свидетельствует, и сохраняет смысл свидетельского подтверждения.
- source_word: ταῦτα
  choice: об этом
  rationale: В современном русском единственное собирательное «об этом» естественно указывает на всё содержание данного откровения, не меняя референта греческого множественного указательного местоимения.
- source_word: Ναί
  choice: Да
  rationale: Прямое утвердительное значение передано кратко и без добавочной интерпретационной торжественности.
- source_word: ἔρχομαι
  choice: Я приду
  rationale: Форма настоящего времени имеет здесь направленное в будущее значение; русское «приду» звучит естественно и ясно передаёт обещание прихода.
- source_word: ταχύ
  choice: скоро
  rationale: В контексте заключительного обещания наречие естественно указывает на близость во времени; возможный оттенок быстроты сохранён в сноске.
- source_word: Ἀμήν
  choice: Аминь
  rationale: Сохранена традиционная и понятная литургическая формула согласия и молитвенного подтверждения.
- source_word: ἔρχου
  choice: Приди
  rationale: Повелительная форма второго лица передана прямой, краткой молитвенной просьбой.
- source_word: κύριε
  choice: Господь
  rationale: В обращении к Иисусу сохранён устойчивый новозаветный титул; русский звательный синтаксис формы «Господь» нормативен.
- source_word: Ἰησοῦ
  choice: Иисус
  rationale: Имя передано в принятой русской библейской форме.
theological_decisions:
- issue: Значение ταχύ в обещании пришествия Христа
  choice: скоро
  alternative: быстро, стремительно
  rationale: Греческое наречие допускает как временную близость, так и быстроту наступления или действия. Основной текст передаёт наиболее естественный в данном обмене репликами временной смысл, а существенная эсхатологическая неоднозначность не устраняется и отмечена в сноске.
translation_notes:
  register: Современный литературный русский с сохранением краткости, торжественности и молитвенной силы заключительных слов. «Я приду» предпочтено более архаичному «гряду», чтобы текст был понятен обычному современному читателю; прописная «Я» следует принятому в русском религиозном письме уважительному оформлению речи Христа.
