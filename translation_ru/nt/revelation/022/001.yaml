id: REV.22.1
reference: Revelation 22:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἔδειξέν μοι ⸀ποταμὸν ὕδατος ζωῆς λαμπρὸν ὡς κρύσταλλον, ἐκπορευόμενον ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/001.yaml
  text: And he showed me a river of the water of life[a], bright as crystal[b], flowing out from the throne of God and of the Lamb.
translation:
  language: ru
  text: И он показал мне реку воды жизни, сияющую, как кристалл, текущую от престола Бога и Агнца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδειξέν μοι
  choice: показал мне
  rationale: Прямая и естественная передача аориста δείκνυμι с дательным местоимением; сохраняет характер сцены видения без дополнительного толкования.
- source_word: ποταμὸν ὕδατος ζωῆς
  choice: реку воды жизни
  rationale: Сохранена образная генитивная конструкция оригинала. Варианты «животворную реку» и «реку живой воды» были бы более истолковательными.
- source_word: λαμπρὸν ὡς κρύσταλλον
  choice: сияющую, как кристалл
  rationale: λαμπρός прежде всего обозначает яркость и сияние, а ὡς вводит сравнение. «Прозрачную» неоправданно смещало бы смысл от сияния к прозрачности.
- source_word: ἐκπορευόμενον
  choice: текущую
  rationale: Причастие описывает движение реки от её источника; «текущую» естественно по-русски и точно в данном образе. Более буквальное «исходящую» звучит отвлечённо и архаично.
- source_word: ἐκ τοῦ θρόνου
  choice: от престола
  rationale: Передаёт источник или начало движения, выраженное предлогом ἐκ, естественным русским оборотом.
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: Бога и Агнца
  rationale: Сохранены оба согласованных родительных определения при единственном числе «престол»; ἀρνίον передано как закреплённый в Откровении титул «Агнец».
theological_decisions:
- issue: Единый престол Бога и Агнца
  choice: «от престола Бога и Агнца»
  alternative: «от престолов Бога и Агнца»; «от общего престола Бога и Агнца»
  rationale: В греческом тексте стоит единственное число θρόνου с двумя однородными определениями. Перевод сохраняет образ единого престола и его богословское напряжение, не усиливая его пояснением «общего» и не искажая множественным числом.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического видения. Синтаксис близок к оригиналу, но причастия выбраны естественные для русского описания реки; архаизмы «исходящую» и «светлую, как кристалл» не использованы.
