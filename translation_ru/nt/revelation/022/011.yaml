base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/011.yaml
  text: Let the one who does wrong still do wrong, and the filthy still be made filthy, and the righteous still practice righteousness, and the holy still be made holy.
translation:
  language: ru
  text: Кто поступает несправедливо, пусть и дальше поступает несправедливо; и кто осквернён, пусть и дальше оскверняется[a]; и праведный пусть и дальше творит праведность[b]; и святой пусть и дальше освящается[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть и дальше остаётся осквернённым». Греческий глагол имеет пассивную форму; возможен также смысл дальнейшего пребывания в нечистоте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «творит справедливость». Слово δικαιοσύνη может означать как праведность, так и справедливость.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «пусть и дальше делается святым». Греческий глагол имеет пассивную форму и может также переводиться «быть освящаемым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀδικῶν … ἀδικησάτω ἔτι
  choice: Кто поступает несправедливо, пусть и дальше поступает несправедливо
  rationale: Субстантивированное причастие передано обобщённой личной конструкцией, а императив третьего лица — оборотом «пусть». «И дальше» естественно выражает повторяющееся ἔτι и сохраняет значение продолжения.
- source_word: ὁ ῥυπαρὸς … ῥυπαρευθήτω ἔτι
  choice: кто осквернён, пусть и дальше оскверняется
  rationale: ῥυπαρός обозначает нравственную или культовую нечистоту, а пассивный императив ῥυπαρευθήτω сохранён возвратно-пассивной формой «оскверняется», не называющей деятеля.
- source_word: ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι
  choice: праведный пусть и дальше творит праведность
  rationale: Сохранены однокоренная этическая лексика и активный характер выражения ποιεῖν δικαιοσύνην. «Творить праведность» звучит возвышенно, но понятно и ближе к форме оригинала, чем пояснительное «поступать праведно».
- source_word: ὁ ἅγιος ἁγιασθήτω ἔτι
  choice: святой пусть и дальше освящается
  rationale: «Освящается» передаёт пассивную форму ἁγιασθήτω и оставляет подразумеваемого деятеля неопределённым; «и дальше» выражает ἔτι.
theological_decisions:
- issue: Повелительная форма в контексте окончательного нравственного разделения
  choice: Во всех четырёх частях сохранена форма повеления с «пусть».
  alternative: 'Передать как предсказание: «будет и дальше…»'
  rationale: Греческие формы являются императивами третьего лица. Перевод сохраняет их суровую риторическую и судебную напряжённость, не превращая слова ни в простое предсказание, ни в одобрение зла.
- issue: Пассивный залог ῥυπαρευθήτω и ἁγιασθήτω
  choice: Передать как «оскверняется» и «освящается», не называя деятеля.
  alternative: «Остаётся осквернённым / святым» или «продолжает жить в нечистоте / святости»
  rationale: Пассивная форма оригинала сохранена, а возможная агентность не раскрыта. Это удерживает подлинную богословскую неоднозначность текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, судебно-пророческим звучанием. Четырёхчастный параллелизм и повтор «и дальше» воспроизводят настойчивость оригинала; пассивные формы не сглажены до статических характеристик.
