id: REV.22.19
reference: Revelation 22:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ἀφέλῃ ἀπὸ τῶν λόγων τοῦ βιβλίου τῆς προφητείας ταύτης, ⸀ἀφελεῖ ὁ θεὸς τὸ μέρος αὐτοῦ ἀπὸ τοῦ ξύλου τῆς ζωῆς καὶ ἐκ τῆς πόλεως τῆς ἁγίας, τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/019.yaml
  text: and if anyone takes away from the words of the book of this prophecy[a], God will take away his share from the tree of life and from the holy city, which are written in this book.
translation:
  language: ru
  text: И если кто отнимет что-либо от слов книги этого пророчества, Бог отнимет его долю от дерева жизни[a] и от святого города, о которых написано в этой книге.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «книги жизни» вместо «дерева жизни».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀφέλῃ
  choice: отнимет что-либо
  rationale: Аорист конъюнктива с ἐάν выражает возможное действие. «Отнимет» естественно передаёт смысл удаления части текста и сохраняет словесную перекличку с ἀφελεῖ; «что-либо» делает русское управление ясным, не добавляя нового смыслового элемента.
- source_word: λόγων
  choice: слов
  rationale: Здесь λόγοι обозначает словесное содержание пророчества; прямой перевод «слова» уместен в предостережении об изменении текста.
- source_word: βιβλίου
  choice: книги
  rationale: Хотя βιβλίον могло обозначать свиток, «книга» — точный и понятный современному читателю эквивалент в данном контексте.
- source_word: προφητείας
  choice: пророчества
  rationale: Сохраняет жанровое обозначение и торжественный характер предупреждения без пояснительного расширения.
- source_word: ἀφελεῖ
  choice: отнимет
  rationale: 'Будущее изъявительное передано тем же глаголом, что и ἀφέλῃ, чтобы сохранить намеренную взаимность: у отнимающего Бог отнимет его долю.'
- source_word: μέρος
  choice: долю
  rationale: «Доля» естественно выражает принадлежащую человеку часть или участие и в современном русском яснее, чем буквальное «часть».
- source_word: ξύλου τῆς ζωῆς
  choice: дерева жизни
  rationale: В контексте Откровения ξύλον обозначает дерево жизни; перевод согласуется с Откр. 22:2, 14.
- source_word: πόλεως τῆς ἁγίας
  choice: святого города
  rationale: Прямое и устойчивое обозначение апокалиптического святого города.
- source_word: τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ
  choice: о которых написано в этой книге
  rationale: Форма множественного числа позволяет отнести оборот и к дереву жизни, и к святому городу. «О которых написано» естественно передаёт смысл совершенного пассивного причастия и избегает неясного буквального «которые написаны» применительно к предметам.
theological_decisions:
- issue: Разночтение «дерево жизни» / «книга жизни»
  choice: дерево жизни
  alternative: книга жизни
  rationale: 'Основной текст следует предоставленному SBLGNT: ξύλου τῆς ζωῆς. Это чтение поддерживается критическим текстом и соответствует ближайшему контексту Откр. 22. Известное традиционное разночтение сохраняется в сноске.'
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранён повтор «отнимет — отнимет», важный для риторической взаимности исходного текста. Местоимение «его» не уточняется как гендерно специфическое и относится к любому человеку.
