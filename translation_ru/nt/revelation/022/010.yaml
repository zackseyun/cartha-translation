  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Μὴ σφραγίσῃς τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου, ὁ καιρὸς γὰρ ἐγγύς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/010.yaml
  text: And he says to me[a], “Do not seal up the words of the prophecy of this book[c][b], for the time is near.”
translation:
  language: ru
  text: 'И он говорит мне: «Не запечатывай слов пророчества этой книги[a], потому что время близко[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ср. Дан 12:4, где пророчество велено запечатать; здесь дано противоположное повеление. «Не запечатывай» может также означать «не скрывай» или «не держи в тайне».
    reason: cross_reference_and_lexical_alternative
  - marker: b
    text: 'Или: «потому что назначенное время близко». Греческое καιρός может обозначать решающий или назначенный срок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει μοι
  choice: И говорит мне
  rationale: Настоящее время сохраняет характерный для Откровения живой повествовательный презенс; по-русски такая форма здесь естественна и выразительна.
- source_word: Μὴ σφραγίσῃς
  choice: Не запечатывай
  rationale: Глагол σφραγίζω буквально означает «запечатывать» и в пророческом контексте подразумевает закрытие или сокрытие откровения. Буквальный образ понятен по-русски и сохраняет связь с книгой Даниила.
- source_word: τοὺς λόγους
  choice: слов
  rationale: Передан конкретный множественный смысл λόγοι, без сведения его к более толковательному «посланию».
- source_word: τῆς προφητείας τοῦ βιβλίου τούτου
  choice: пророчества этой книги
  rationale: Естественная русская передача последовательности родительных конструкций, сохраняющая принадлежность слов пророчеству, содержащемуся в этой книге.
- source_word: ὁ καιρὸς
  choice: время
  rationale: Краткая и нейтральная передача καιρός; возможный оттенок решающего или назначенного срока отмечен в сноске, чтобы не усиливать его в основном тексте.
- source_word: ἐγγύς ἐστιν
  choice: близко
  rationale: Прямая современная передача утверждения о близости, без смягчения или уточнения эсхатологической хронологии.
theological_decisions:
- issue: Близость времени в апокалиптическом контексте
  choice: потому что время близко
  alternative: потому что назначенное время близко; потому что время уже близко
  rationale: Формулировка сохраняет прямое утверждение текста о близости и присущую ему богословскую напряжённость, не превращая его в подробную схему сроков и не ослабляя сказанного.
- issue: Запечатывание пророчества
  choice: Не запечатывай
  alternative: Не скрывай; не держи в тайне
  rationale: Сохраняется пророческий образ печати и противопоставление повелению в Дан 12:4, не сводя образное выражение к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальной близостью к греческому тексту. Сохранены повествовательное настоящее, образ запечатывания и лаконичное утверждение о близости времени; архаизмы и конфессионально окрашенные уточнения не вводятся.
