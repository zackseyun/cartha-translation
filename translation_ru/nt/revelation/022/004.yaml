  text: καὶ ὄψονται τὸ πρόσωπον αὐτοῦ, καὶ τὸ ὄνομα αὐτοῦ ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/004.yaml
  text: and they will see his face[b][a], and his name will be on their foreheads.
translation:
  language: ru
  text: И они увидят Его лицо[a], и Его имя будет на их лбах.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «узрят Его лицо».'
    reason: lexical_alternative
  - marker: b
    text: Местоимение «Его» может относиться к Богу; в ближайшем контексте оно также может отражать общее божественное царствование Бога и Агнца.
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψονται
  choice: увидят
  rationale: Будущая форма глагола ὁράω здесь естественно передаётся нейтральным современным «увидят»; более возвышенное «узрят» возможно, но стилистически архаичнее.
- source_word: τὸ πρόσωπον
  choice: лицо
  rationale: Основное значение πρόσωπον — «лицо». В сочетании с глаголом зрения конкретный смысл предпочтительнее расширенного «присутствие».
- source_word: τὸ ὄνομα
  choice: имя
  rationale: Прямое соответствие греческому ὄνομα, без внесения в текст подразумеваемых значений принадлежности, тождества или характера.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: у них на лбу
  rationale: Естественная русская передача положения «на их лбах». Распределительное единственное число «у них на лбу» обозначает лоб каждого и избегает неестественного звучания множественного «на их лбах».
- source_word: καὶ
  choice: и
  rationale: Оба случая καί переданы сочинительным союзом «и», что сохраняет присоединительную структуру греческого текста.
- source_word: αὐτοῦ
  choice: Его
  rationale: Местоимение сохранено без замены на «Бога» или «Агнца», чтобы не сужать референцию по сравнению с греческим текстом.
theological_decisions:
- issue: К кому относится αὐτοῦ («Его») в выражениях «Его лицо» и «Его имя»
  choice: Сохранить местоимение «Его», не называя референта прямо.
  alternative: 'Уточнить: «Бога»; либо истолковать единственное число в свете общего царствования Бога и Агнца.'
  rationale: В ближайшем контексте Бог и Агнец тесно связаны (Откр 22:3), а греческий текст употребляет местоимение единственного числа. Сохранение местоимения передаёт подлинную контекстуальную неоднозначность и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. «Увидят» предпочтено архаизирующему «узрят». Прописная буква в «Его» соответствует принятому русскому библейскому оформлению божественного местоимения, не устраняя неоднозначности его референта. Маркер [a] поставлен непосредственно после спорной лексемы, а [b] — после всего предложения, поскольку поясняет оба случая «Его».
