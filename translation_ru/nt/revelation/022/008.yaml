source:
  edition: SBLGNT
  text: Κἀγὼ Ἰωάννης ὁ ἀκούων καὶ βλέπων ταῦτα. καὶ ὅτε ἤκουσα καὶ ἔβλεψα, ἔπεσα προσκυνῆσαι ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου τοῦ δεικνύοντός μοι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/008.yaml
  text: And I[a], John, am the one hearing and seeing these things. And when I heard and saw, I fell down to worship before the feet of the angel who was showing me these things.
translation:
  language: ru
  text: И я, Иоанн, — тот, кто слышит и видит всё это. И когда я услышал и увидел всё это, я пал перед ногами ангела, показывающего мне всё это, чтобы поклониться ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пасть ниц перед ним» или «оказать ему почтение». Греческий глагол может обозначать падение ниц или выражение глубокого почтения; здесь он передан словом «поклониться» ввиду его обычного значения в Откровении и последующего запрета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ
  choice: И я
  rationale: Сохраняет соединительное καί и выраженное местоимением смысловое выделение говорящего; естественно продолжает повествование.
- source_word: Ἰωάννης
  choice: Иоанн
  rationale: Передаёт личное имя в традиционной и общепонятной русской библейской форме.
- source_word: ὁ ἀκούων καὶ βλέπων
  choice: тот, кто слышит и видит
  rationale: Сохраняет настоящее время и субстантивированную конструкцию с причастиями, не превращая её без необходимости в простое прошедшее.
- source_word: ταῦτα
  choice: это
  rationale: В современном русском собирательное «это» естественно обозначает совокупность только что описанных видений и откровений; повторено в конце стиха.
- source_word: ὅτε
  choice: когда же
  rationale: Передаёт временную связь без усиления до значения «после того как»; частица «же» естественно отмечает переход к следующему действию.
- source_word: ἤκουσα καὶ ἔβλεψα
  choice: я услышал и увидел
  rationale: Аористы переданы формами совершенного вида прошедшего времени, естественными для последовательности событий.
- source_word: ἔπεσα
  choice: пал
  rationale: Кратко и достойно передаёт физическое падение ниц в данном контексте.
- source_word: προσκυνῆσαι
  choice: чтобы поклониться
  rationale: Сохраняет целевое значение инфинитива и серьёзность религиозного жеста, не смягчая напряжение перед последующим запретом.
- source_word: ἔμπροσθεν τῶν ποδῶν
  choice: перед ногами
  rationale: Формально сохраняет пространственное ἔμπροσθεν и явное упоминание ног, хотя по-русски возможно более идиоматичное «к ногам».
- source_word: τοῦ ἀγγέλου
  choice: ангела
  rationale: В контексте Откровения речь идёт о небесном существе, поэтому установленное соответствие «ангел» точнее общего «вестник».
- source_word: τοῦ δεικνύοντός μοι ταῦτα
  choice: показывавшего мне это
  rationale: Причастие несовершенного вида передаёт продолжающуюся роль ангела как показывающего видения Иоанну.
theological_decisions:
- issue: Характер действия προσκυνέω, направленного к ангелу
  choice: «поклониться» с пояснением возможного диапазона значения
  alternative: «пасть ниц перед», «оказать почтение»
  rationale: В Откровении глагол часто имеет силу поклонения, а последующий запрет показывает неуместность действия Иоанна. Основной текст не смягчает поступок до простого знака уважения, но русское «поклониться» сохраняет присущую греческому слову лексическую широту.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Конструкция «тот, кто слышит и видит» намеренно сохраняет настоящее время греческих причастий. «Перед ногами» выбрано ради близости к форме оригинала, несмотря на более обычное русское «у ног» или «к ногам».
