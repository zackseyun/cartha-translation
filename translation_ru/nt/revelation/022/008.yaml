- from: И я, Иоанн, — тот, кто слышит и видит это. Когда же я услышал и увидел, то пал, чтобы поклониться перед ногами ангела, показывавшего мне это.[a]
  to: И я, Иоанн, — тот, кто слышит и видит всё это. И когда я услышал и увидел всё это, я пал перед ногами ангела, показывающего мне всё это, чтобы поклониться ему.[a]
  rationale: Правка сохраняет видо-временные различия оригинала и его смысловую неоднозначность, но делает русскую синтаксическую связь между падением перед ногами ангела и направленным к нему поклонением ясной. «Всё это» последовательно передаёт ταῦτα как совокупность показанного; «И когда» отражает καὶ ὅτε. Сноска сохраняет лексические альтернативы без догматического предрешения характера жеста.
