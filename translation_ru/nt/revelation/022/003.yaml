  verdict: approve
  source_fidelity: Перевод точно передаёт πᾶν κατάθεμα как конкретно понимаемое «ничего проклятого» и сохраняет будущее прекращение этого состояния в «уже не будет». Сохранены единственное число «Престол», явное «Бога и Агнца», локативное «в нём» (с отсылкой к городу) и греческие местоимения единственного числа «Его / Ему». «Рабы» обоснованно передаёт δοῦλοι, а «будут служить» — широкий культовый смысл λατρεύσουσιν.
  naturalness: Текст звучит как современный литературный русский с уместной умеренно возвышенной библейской лексикой. Порядок слов «рабы Его будут служить Ему» естественен для данного регистра. «В нём» нормально отсылает к ранее названному городу; не следует искусственно вносить слово «город» в сам стих.
  terminology: «Престол», «Бог», «Агнец» и «рабы» последовательны и точны для апокалиптического контекста. Сноска к «ничего проклятого» корректно сохраняет возможность более абстрактного («никакого проклятия») и более конкретного прочтения. Сноски к «служить» и к единственному числу престола и местоимений адекватно отмечают существенные альтернативы и грамматическое напряжение, не навязывая доктринального разрешения.
