source:
  edition: SBLGNT
  text: καὶ πᾶν κατάθεμα οὐκ ἔσται ἔτι. καὶ ὁ θρόνος τοῦ θεοῦ καὶ τοῦ ἀρνίου ἐν αὐτῇ ἔσται, καὶ οἱ δοῦλοι αὐτοῦ λατρεύσουσιν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/003.yaml
  text: And there will no longer be any curse[a]. And the throne of God and of the Lamb will be in it, and his servants will worship him[d][c][b],
translation:
  language: ru
  text: И ничего проклятого уже не будет[a]. Престол Бога и Агнца будет в нём, и рабы Его будут служить Ему[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никакого проклятия»; возможно также: «ничего преданного проклятию».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будут поклоняться Ему» или «будут совершать Ему священное служение».'
    reason: lexical_alternative
  - marker: c
    text: 'В греческом тексте употреблено единственное число: один «престол Бога и Агнца», а затем — «рабы Его будут служить Ему». Так сохраняются и различие между Богом и Агнцем, и их единое царствование.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν κατάθεμα
  choice: ничего проклятого
  rationale: 'Средний род единственного числа с πᾶν допускает конкретное понимание: «ничто проклятое / никакая проклятая вещь». В сочетании с отрицанием русская конструкция «ничего проклятого» естественна и сохраняет лексическую неоднозначность через сноску.'
- source_word: οὐκ ἔσται ἔτι
  choice: уже не будет
  rationale: Естественно передаёт будущую экзистенциальную конструкцию и значение ἔτι «больше, уже».
- source_word: ὁ θρόνος
  choice: престол
  rationale: Стандартный библейский эквивалент, сохраняющий значимое единственное число.
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: Бога и Агнца
  rationale: Оба родительных определения переданы явно; «Агнец» сохраняет устойчивый образ Откровения.
- source_word: ἐν αὐτῇ
  choice: в нём
  rationale: Местоимение относится к городу; мужской род обусловлен русским словом «город» и естественнее буквального согласования с греческим женским родом.
- source_word: οἱ δοῦλοι αὐτοῦ
  choice: рабы Его
  rationale: «Рабы» сохраняет значение принадлежности и подчинения, выраженное δοῦλοι; вынесенное после существительного «Его» поддерживает достоинство литературного регистра и оставляет единственное число местоимения.
- source_word: λατρεύσουσιν αὐτῷ
  choice: будут служить Ему
  rationale: λατρεύω обозначает служение, особенно священное или богослужебное. «Служить» сохраняет более широкий смысл, чем одно лишь «поклоняться», а религиозный контекст ясен из престола Бога и Агнца.
- source_word: αὐτοῦ ... αὐτῷ
  choice: Его ... Ему
  rationale: Единственное число греческих местоимений сохранено, несмотря на два родительных определения при одном престоле, чтобы не устранять напряжение текста.
theological_decisions:
- issue: Один престол Бога и Агнца при местоимениях единственного числа
  choice: 'Сохранить: «Престол Бога и Агнца ... рабы Его будут служить Ему»'
  alternative: 'Употребить множественное число: «их рабы будут служить им»'
  rationale: Греческий текст различает Бога и Агнца, но говорит об одном престоле и затем употребляет местоимения единственного числа. Перевод сохраняет эту грамматическую и богословскую напряжённость, не разрешая её поясняющим пересказом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой («престол», «Агнец»). Синтаксис остаётся ясным для широкого читателя. Единственное число местоимений намеренно сохранено; заглавные буквы в «Его / Ему» помогают естественному восприятию местоименной отсылки в русском религиозном тексте.
