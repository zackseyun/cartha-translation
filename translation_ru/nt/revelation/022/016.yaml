source:
  edition: SBLGNT
  text: Ἐγὼ Ἰησοῦς ἔπεμψα τὸν ἄγγελόν μου μαρτυρῆσαι ὑμῖν ταῦτα ἐπὶ ταῖς ἐκκλησίαις. ἐγώ εἰμι ἡ ῥίζα καὶ τὸ γένος Δαυίδ, ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/016.yaml
  text: I[a], Jesus, have sent my angel to testify to you these things for the churches[b]. I am the root and the descendant of David, the bright morning star.
translation:
  language: ru
  text: «Я, Иисус, послал моего ангела засвидетельствовать вам всё это для церквей[a]. Я — корень и потомок Давида[b], яркая утренняя звезда».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «засвидетельствовать вам всё это в церквах» или «засвидетельствовать вам всё это о церквах». Греческое выражение ἐπὶ ταῖς ἐκκλησίαις допускает несколько смысловых оттенков.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «корень и отпрыск Давида» или «корень и потомство Давида».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ Ἰησοῦς
  choice: Я, Иисус,
  rationale: Явное местоимение перед собственным именем выражает подчёркнутое самообозначение. Конструкция с приложением естественна по-русски и не добавляет отсутствующую в этой части греческой фразы связку.
- source_word: ἔπεμψα
  choice: послал
  rationale: Греческий аорист обозначает совершившееся действие. Русский совершенный вид естественно передаёт как сам факт послания, так и его сохраняющуюся значимость в данном контексте.
- source_word: τὸν ἄγγελόν μου
  choice: Моего ангела
  rationale: В контексте Откровения ἄγγελος естественнее всего понимать как небесного ангела, а не просто человеческого вестника.
- source_word: μαρτυρῆσαι ὑμῖν ταῦτα
  choice: засвидетельствовать вам всё это
  rationale: Инфинитив выражает цель послания. «Засвидетельствовать» сохраняет смысл свидетельства, дательный передан словом «вам», а ταῦτα — собирательным русским выражением «всё это».
- source_word: ἐπὶ ταῖς ἐκκλησίαις
  choice: для церквей
  rationale: Сочетание ἐπί с дательным допускает несколько оттенков. «Для церквей» естественно передаёт предназначение свидетельства, не исключая отмеченных в сноске вариантов.
- source_word: ἡ ῥίζα
  choice: корень
  rationale: Буквальный образ сохраняет мессианский титул и представление об источнике или происхождении, не разъясняя его вместо текста.
- source_word: τὸ γένος Δαυίδ
  choice: потомок Давида
  rationale: γένος может обозначать род, происхождение или потомство. В единственном именном сказуемом о Христе «потомок Давида» ясно и естественно передаёт династическое происхождение.
- source_word: ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός
  choice: яркая утренняя звезда
  rationale: Повторные артикли присоединяют к слову «звезда» определения «яркая» и «утренняя». Русское сочетание сохраняет оба определения и цельный образ.
theological_decisions:
- issue: Мессианское самообозначение через отношение к Давиду
  choice: «корень и потомок Давида»
  alternative: «источник и потомок Давида»
  rationale: 'Буквальный «корень» сохраняет напряжение: Иисус назван и тем, что предшествует Давиду или служит его основанием, и его потомком. Перевод не устраняет этот парадокс поясняющей заменой.'
- issue: Христологический титул утренней звезды
  choice: «яркая утренняя звезда»
  alternative: «звезда яркая, утренняя»
  rationale: Фраза сохранена как непосредственное самообозначение Иисуса без привнесения позднейших богословских толкований.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Заглавное «Моего» отражает принятое в русском библейском стиле почтительное написание местоимения, относящегося к Иисусу. Тире подчёркивает именное самообозначение «Я — корень…» без добавления отсутствующей в русском настоящем времени связки.
