id: REV.22.5
reference: Revelation 22:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ νὺξ οὐκ ἔσται ⸀ἔτι, καὶ ⸂οὐκ ἔχουσιν χρείαν⸃ ⸀φωτὸς λύχνου καὶ ⸀φῶς ἡλίου, ὅτι κύριος ὁ θεὸς φωτίσει ⸀ἐπ’ αὐτούς, καὶ βασιλεύσουσιν εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/005.yaml
  text: And night will be no more[a], and they will have no need of lamplight or sunlight, because the Lord God will shine on them[b], and they will reign forever and ever.
translation:
  language: ru
  text: И ночи больше не будет, и они не будут нуждаться[a] ни в свете светильника, ни в свете солнца, потому что Господь Бог будет светить им, и они будут царствовать во веки веков[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «они не имеют нужды»; настоящее время употреблено внутри описания грядущего.'
    reason: temporal_ambiguity
  - marker: b
    text: 'Буквально по-гречески: «в веки веков» — усиленное выражение нескончаемой длительности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νὺξ οὐκ ἔσται ἔτι
  choice: ночи больше не будет
  rationale: Естественно и торжественно передаёт прекращение ночи; сохраняет будущую форму и смысл ἔτι — «больше».
- source_word: οὐκ ἔχουσιν χρείαν
  choice: они не будут нуждаться
  rationale: Хотя греческий глагол стоит в настоящем времени, будущая форма по-русски связно передаёт описание грядущего состояния в окружении будущих форм.
- source_word: φωτὸς λύχνου
  choice: в свете светильника
  rationale: Сохраняет образ λύχνος как светильника и генитивное значение источника света, не сводя древний предмет к современной лампе.
- source_word: φῶς ἡλίου
  choice: в свете солнца
  rationale: Точно передаёт словосочетание и образ солнца как источника света; параллельно выражению «в свете светильника».
- source_word: κύριος ὁ θεός
  choice: Господь Бог
  rationale: Традиционное, точное и нейтральное соответствие греческому титулу и имени Бога в данном контексте.
- source_word: φωτίσει ἐπ’ αὐτούς
  choice: будет светить им
  rationale: Передаёт действие света, направленного на людей, и сохраняет связь с упомянутыми источниками света; по-русски звучит естественно.
- source_word: βασιλεύσουσιν
  choice: будут царствовать
  rationale: Точно сохраняет царственный смысл глагола без добавления объекта или сферы правления, которых в тексте нет.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устойчивое русское библейское выражение, точно передающее усиленную формулу нескончаемой длительности.
theological_decisions:
- issue: Временная форма οὐκ ἔχουσιν χρείαν в описании будущего
  choice: 'Передать будущим временем: «они не будут нуждаться».'
  alternative: 'Формально передать настоящим временем: «они не нуждаются» или «не имеют нужды».'
  rationale: Настоящее время может оживлять пророческое видение, однако окружающие формы ἔσται, φωτίσει и βασιλεύσουσιν стоят в будущем времени. Русское будущее обеспечивает временную связность, не устраняя формальную особенность оригинала, отмеченную в сноске.
- issue: Характер действия φωτίσει ἐπ’ αὐτούς
  choice: «будет светить им»
  alternative: «озарит их» или «осветит их»
  rationale: Выбранная формулировка сохраняет образ непрерывно исходящего Божьего света и не превращает его в явно однократное действие.
- issue: Смысл царствования и его длительность
  choice: «будут царствовать во веки веков» без названного объекта правления
  alternative: «будут править как цари вечно»
  rationale: Перевод не уточняет, над кем или чем они царствуют, поскольку источник этого не сообщает, и сохраняет усиленное выражение бесконечной длительности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический параллелизм и повтор союза «и» сохранены; архаизмы ограничены устойчивым выражением «во веки веков».
