id: REV.22.21
reference: Revelation 22:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἡ χάρις τοῦ κυρίου ⸀Ἰησοῦ μετὰ ⸀πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/021.yaml
  text: The grace of the Lord Jesus be with all[a].
translation:
  language: ru
  text: Благодать Господа Иисуса да будет со всеми[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Благодать Господа Иисуса да будет со всеми святыми», а в других: «со всеми вами».'
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: Устоявшееся и точное новозаветное слово для заключительного благословения; сохраняет смысл Божьей незаслуженной милости и спасительного дара.
- source_word: κυρίου
  choice: Господа
  rationale: Естественная передача христологического титула κύριος в данном контексте.
- source_word: Ἰησοῦ
  choice: Иисуса
  rationale: Общепринятая русская форма личного имени.
- source_word: μετά
  choice: да будет со
  rationale: В греческом благословении глагол отсутствует, но по-русски формула требует его восполнения; «да будет» передаёт пожелание и сохраняет торжественный заключительный характер фразы.
- source_word: πάντων
  choice: всеми
  rationale: Передаёт широкое и ничем не уточнённое πάντων, не добавляя отсутствующих в основном тексте слов «вами» или «святыми».
theological_decisions:
- issue: Следует ли уточнять, кого обозначает πάντων в заключительном благословении
  choice: 'Оставить обозначение адресатов неуточнённым: «со всеми»'
  alternative: «со всеми вами» или «со всеми святыми»
  rationale: Текст SBLGNT содержит только πάντων — «всех/всеми». Уточнение «вами» либо «святыми» устранило бы сохранённую основным греческим текстом широту и отразило бы иные текстовые варианты.
translation_notes:
  register: Современный литературный русский язык с традиционной, но понятной формой заключительного благословения. Частица «да» уместна для пожелания и позволяет естественно передать подразумеваемый в греческом глагол.
