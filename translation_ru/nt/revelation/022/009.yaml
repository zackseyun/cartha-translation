id: REV.22.9
reference: Revelation 22:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν προφητῶν καὶ τῶν τηρούντων τοὺς λόγους τοῦ βιβλίου τούτου· τῷ θεῷ προσκύνησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/009.yaml
  text: And he says to me[a], “Do not do that! I am a fellow servant with you and with your brothers the prophets, and with those who keep the words of this book[c][b]. Worship God.”
translation:
  language: ru
  text: 'И он говорит мне: «Смотри, не делай этого![a] Я такой же раб, как ты, твои братья-пророки и те, кто соблюдает слова этой книги.[b] Поклонись Богу!»[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально греческий запрет имеет вид: «Смотри, не…»; подразумевается: не поклоняйся ангелу.'
    reason: lexical_alternative
  - marker: b
    text: «Такой же раб» — то есть вместе с Иоанном и другими находящийся под властью одного Господина.
    reason: lexical_clarification
  - marker: c
    text: Ср. Откровение 19:10, где ангел так же отвергает поклонение и велит поклониться Богу.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μή
  choice: Смотри, не делай этого!
  rationale: Греческое выражение представляет собой резкий эллиптический запрет; подразумеваемое действие — попытка Иоанна поклониться ангелу — ясно из контекста. Русское «Смотри, не делай этого!» сохраняет и образную форму, и силу запрета.
- source_word: σύνδουλός
  choice: такой же раб
  rationale: Слово обозначает того, кто вместе с другими находится в положении раба одного господина. Формулировка передаёт общую подчинённость ангела, Иоанна и прочих служителей Богу, не превращая σύνδουλος в более мягкое «сослужитель».
- source_word: ἀδελφῶν σου τῶν προφητῶν
  choice: твои братья-пророки
  rationale: Определение «пророки» поясняет, о каких братьях идёт речь. Дефисное сочетание естественно и кратко передаёт эту связь в современном русском языке.
- source_word: τηρούντων
  choice: соблюдает
  rationale: Глагол включает верное хранение и исполнение сказанного. «Соблюдает» сохраняет эту смысловую широту и привычно сочетается со «словами» книги.
- source_word: τοὺς λόγους τοῦ βιβλίου τούτου
  choice: слова этой книги
  rationale: Прямой перевод сохраняет повторяющуюся в Откровении лексику; «книга» понятно современному читателю и не требует непременного уточнения древней материальной формы свитка.
- source_word: τῷ θεῷ προσκύνησον
  choice: Поклонись Богу!
  rationale: В данном контексте προσκυνέω обозначает религиозное поклонение. Повеление подчёркивает, что поклонение должно быть обращено не к ангелу, а к Богу.
theological_decisions:
- issue: Статус ангела в выражении σύνδουλος
  choice: Передать общую рабскую подчинённость словами «такой же раб».
  alternative: «сослужитель» или «такой же слуга»
  rationale: Ангел отвергает поклонение себе, поскольку сам находится под властью Бога наравне с Иоанном, пророками и соблюдающими слова книги. Более мягкое «сослужитель» может ослабить этот аргумент.
- issue: Подразумеваемое действие в Ὅρα μή
  choice: 'Уточнить: «не делай этого».'
  alternative: Оставить только «не надо» или «смотри, не…»
  rationale: Греческая фраза эллиптична, однако предшествующий контекст однозначно указывает на попытку поклонения ангелу. Уточнение делает запрет естественным по-русски, не устраняя богословской неоднозначности текста.
- issue: Круг лиц после σύνδουλος
  choice: Представить Иоанна, братьев-пророков и соблюдающих слова книги как три согласованных дополнения к сравнению «такой же раб».
  alternative: Понять «соблюдающих» как дополнительное описание только пророков.
  rationale: Повтор артикля καὶ τῶν перед последней группой естественно выделяет её наряду с Иоанном и пророками, хотя группы могут пересекаться.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной синтаксической формой. Историческое настоящее «говорит» сохранено вслед за греческим текстом. Резкость ангельского запрета и повеления передана восклицательными знаками; терминология не сглаживает мотив общей подчинённости Богу.
