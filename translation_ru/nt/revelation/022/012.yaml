  verdict: approve
  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: призыв Ἰδοὺ («Вот»), футуристическое значение ἔρχομαι («Я ... приду»), временную многозначность ταχύ («скоро»), наличие у говорящего μισθός («воздаяние Моё со Мной»), цель ἀποδοῦναι и распределительное ἑκάστῳ («воздать каждому»). Формула «по его делу» естественно передаёт ὡς τὸ ἔργον ἐστὶν αὐτοῦ, сохраняя единственное число «дело» и меру воздаяния. Явная связка ἐστίν в русском в настоящем времени не требуется.'
  naturalness: Фраза звучит как современный литературный русский, при этом сохраняет уместный для Откровения торжественный регистр. «Вот» не архаично, но выполняет функцию пророческого привлечения внимания. «Воздаяние Моё со Мной, чтобы воздать каждому» несколько намеренно повторяет корень, однако это допустимо и помогает сохранить смысловую связь μισθός и ἀποδοῦναι.
  terminology: «Воздаяние» удачно шире, чем «награда», и не предрешает положительный либо отрицательный характер ответа по делам. «Каждому по его делу» сохраняет личную и распределительную направленность оригинала без богословских добавлений. Заглавные буквы в местоимениях соответствуют русской библейской издательской традиции и не затрагивают смысл. Сноска корректно отмечает реальную семантическую альтернативу ταχύ; её якорь поставлен непосредственно при фразе «скоро приду».
