id: REV.22.12
reference: Revelation 22:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ταχύ, καὶ ὁ μισθός μου μετ’ ἐμοῦ, ἀποδοῦναι ἑκάστῳ ὡς τὸ ἔργον ⸀ἐστὶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/012.yaml
  text: Behold[a], I am coming soon, and my reward is with me, to repay each one according to what his work is.
translation:
  language: ru
  text: «Вот, Я скоро приду[a], и воздаяние Моё со Мной, чтобы воздать каждому по его делу».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я приду быстро (внезапно)». Греческое ταχύ может указывать как на близость события («скоро»), так и на быстроту или внезапность («быстро», «внезапно»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Сохраняет функцию торжественного призыва к вниманию и естественно звучит в современном литературном русском языке.
- source_word: ἔρχομαι
  choice: Я скоро приду
  rationale: Русское будущее время естественно передаёт направленное в будущее значение греческого настоящего в данном контексте.
- source_word: ταχύ
  choice: скоро
  rationale: Передаёт вероятный акцент на близости пришествия; возможный смысл быстроты или внезапности отмечен в сноске.
- source_word: ὁ μισθός μου
  choice: воздаяние Моё
  rationale: «Воздаяние» охватывает смысл награды или отплаты в контексте суда и не ограничивает выражение только положительной наградой.
- source_word: μετ’ ἐμοῦ
  choice: со Мной
  rationale: Естественно передаёт предложное сочетание; связка в русском настоящем времени не требуется.
- source_word: ἀποδοῦναι
  choice: чтобы воздать
  rationale: Инфинитив передан целевой конструкцией; «воздать» сохраняет идею отплаты в соответствии с делом.
- source_word: ἑκάστῳ
  choice: каждому
  rationale: Точно сохраняет распределительное значение и личную ответственность.
- source_word: ὡς τὸ ἔργον ἐστὶν αὐτοῦ
  choice: по его делу
  rationale: Краткая естественная русская конструкция сохраняет существительное единственного числа ἔργον и выражает меру воздаяния, не превращая его в обобщённое множественное «дела».
theological_decisions:
- issue: Характер воздаяния
  choice: «воздаяние Моё… воздать каждому»
  alternative: «награда Моя… наградить каждого»
  rationale: Выбранная формулировка сохраняет более широкий смысл суда и отплаты, не предполагая, что речь идёт исключительно о положительной награде.
- issue: Воздаяние в соответствии с делом
  choice: «по его делу»
  alternative: «по тому, что он сделал»
  rationale: Сохранена именная форма и единственное число источника без добавления вывода о том, каким образом дела соотносятся со спасением.
- issue: Грамматический род в ἑκάστῳ… αὐτοῦ
  choice: «каждому по его делу»
  alternative: «каждому человеку по его делам»
  rationale: Сохранена мужская форма единственного числа с обобщающим значением, естественная для русского языка и близкая форме греческого текста.
translation_notes:
  register: Современный литературный русский с торжественным апокалиптическим звучанием. Заглавные буквы в местоимениях, относящихся к говорящему Христу, следуют устойчивой русской библейской издательской традиции, не меняя смысла исходного текста.
