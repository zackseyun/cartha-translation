  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Μακάριοι οἱ ⸂πλύνοντες τὰς στολὰς αὐτῶν⸃, ἵνα ἔσται ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς καὶ τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/014.yaml
  text: Blessed are those who wash their robes[c][b][a], so that they may have the right to the tree of life and may enter the city by the gates.
translation:
  language: ru
  text: Блаженны те, кто омывает свои одежды[a][b], чтобы они имели право на дерево жизни и вошли в город через ворота[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Блаженны те, кто исполняет его заповеди» или «соблюдает его заповеди» — вместо слов «омывает свои одежды».'
    reason: textual_variant
  - marker: b
    text: Образ омовения одежд перекликается с Откровением 7:14, где одежды омыты и убелены кровью Агнца.
    reason: cross_reference
  - marker: c
    text: 'Греческий оборот можно передать более буквально: «войти в город воротами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Блаженны
  rationale: Традиционная и естественная для библейского изречения формулировка, сохраняющая эсхатологический и заветный смысл; «счастливы» звучало бы преимущественно как описание субъективного состояния.
- source_word: πλύνοντες
  choice: омывает
  rationale: Настоящее причастие обозначает людей, для которых это действие характерно. Русское придаточное с настоящим временем звучит естественно и сохраняет конкретный образ омовения.
- source_word: στολὰς
  choice: одежды
  rationale: Передаёт предметный образ облачений и согласуется с образом одежд в Откровении 7:14; «одеяния» возможно, но менее обычно в современном русском.
- source_word: ἵνα ἔσται ἡ ἐξουσία αὐτῶν
  choice: чтобы иметь право
  rationale: Естественно передаёт целевое или результативное отношение ἵνα с будущим временем. Здесь ἐξουσία означает законное право или дозволенный доступ, а не силу либо власть над деревом.
- source_word: ἐπὶ τὸ ξύλον τῆς ζωῆς
  choice: на дерево жизни
  rationale: В сочетании с «иметь право» предлог ἐπί указывает на право доступа к дереву, а не на господство над ним. Формулировка сохраняет связь с греческим оборотом без добавления не выраженного прямо действия, например вкушения плодов.
- source_word: τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν
  choice: войти в город через ворота
  rationale: Дательный падеж τοῖς πυλῶσιν естественно понимается как указание на путь или средство входа. «Через ворота» ясно и современно передаёт этот смысл.
theological_decisions:
- issue: Разночтение в первой части стиха
  choice: «те, кто омывает свои одежды»
  alternative: «те, кто исполняет Его заповеди» или «соблюдает Его заповеди»
  rationale: 'Основной текст следует предоставленному SBLGNT: πλύνοντες τὰς στολὰς αὐτῶν. Известное разночтение сохранено в сноске ввиду его широкой представленности в рукописной и переводческой традиции.'
- issue: Связь омовения одежд с доступом к жизни
  choice: Сохранить заявленную в стихе связь, не уточняя в основном тексте её богословский механизм
  alternative: Истолковать омовение как заслуживающее награды человеческое дело либо прямо добавить в основной текст, что одежды омыты кровью Агнца
  rationale: Стих называет омывающих одежды теми, кому принадлежит право на дерево жизни и вход в город, но сам здесь не объясняет механизм этого омовения. Перекличка с Откровением 7:14 отмечена в сноске, а не внесена в перевод.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; символические образы и неоднозначность связи между омовением и правом доступа не истолкованы сверх текста.
