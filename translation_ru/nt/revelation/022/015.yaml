id: REV.22.15
reference: Revelation 22:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἔξω οἱ κύνες καὶ οἱ φάρμακοι καὶ οἱ πόρνοι καὶ οἱ φονεῖς καὶ οἱ εἰδωλολάτραι καὶ πᾶς φιλῶν καὶ ποιῶν ψεῦδος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/015.yaml
  text: Outside are the dogs and the sorcerers and the sexually immoral and the murderers and the idolaters[b][a], and everyone who loves and practices falsehood.
translation:
  language: ru
  text: А снаружи — псы[b], чародеи, развратники, убийцы, идолопоклонники и всякий, кто любит и творит ложь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякий, кто любит ложь и поступает лживо».'
    reason: lexical_alternative
  - marker: b
    text: «Псы» здесь, вероятно, — метафорическое обозначение отвергнутых и нравственно нечистых людей; некоторые толкователи понимают это слово более узко.
    reason: cultural_note
lexical_decisions:
- source_word: ἔξω
  choice: А снаружи —
  rationale: Наречие вынесено в начало и подчёркивает исключение из города; связка перед перечнем естественно передана тире. Союз «А» выражает контекстуальное противопоставление.
- source_word: κύνες
  choice: псы
  rationale: Сохранён конкретный и резкий апокалиптический образ. «Псы» в данном метафорическом употреблении звучит естественнее и выразительнее, чем нейтральное «собаки», без уточнения спорной референции.
- source_word: φάρμακοι
  choice: чародеи
  rationale: В контексте Откровения слово обозначает занимающихся магией или колдовством; «чародеи» кратко передаёт значение и сохраняет стиль перечня.
- source_word: πόρνοι
  choice: развратники
  rationale: Передаёт людей, для которых характерна половая распущенность, не сужая значение до одного конкретного вида сексуального проступка.
- source_word: φονεῖς
  choice: убийцы
  rationale: Прямое и современное соответствие существительному, обозначающему совершающих убийство.
- source_word: εἰδωλολάτραι
  choice: идолопоклонники
  rationale: Точное, общепонятное и компактное соответствие, сохраняющее форму перечня пороков.
- source_word: πᾶς φιλῶν καὶ ποιῶν ψεῦδος
  choice: всякий, кто любит и творит ложь
  rationale: Конструкция с причастиями передана как характеристика устойчивой склонности и поведения. «Творит ложь» сохраняет необычную, весомую сочетаемость ποιῶν ψεῦδος и допускает как ложную речь, так и более широкую причастность ко лжи.
- source_word: ψεῦδος
  choice: ложь
  rationale: Русское «ложь» может обозначать и отдельную неправду, и ложь как нравственную сферу; поэтому оно естественно сохраняет широту греческого слова.
theological_decisions:
- issue: Следует ли истолковать «псов» в основном тексте как определённую группу людей.
  choice: Сохранить буквальный образ «псы».
  alternative: нечистые; бесстыдные; мужчины, занимающиеся культовой проституцией
  rationale: κύνες — конкретный метафорический образ, но его точная референция спорна. Буквальная передача сохраняет риторическую силу и не навязывает частного толкования.
- issue: Следует ли понимать ψεῦδος узко как отдельную ложь или шире как ложь вообще.
  choice: Передать словом «ложь», допускающим общее нравственное значение.
  alternative: неправду; всё ложное
  rationale: Сочетание «любит и творит» указывает на устойчивую приверженность, однако само слово может относиться и к конкретной лжи. Русское «ложь» сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством и краткостью апокалиптического перечня. Начальная позиция «снаружи» и тире сохраняют эмфазу; лексика понятна широкому читателю, а спорные толкования не внесены в основной текст.
