  text: Μαρτυρῶ ἐγὼ παντὶ τῷ ἀκούοντι τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου· ἐάν τις ἐπιθῇ ἐπ’ αὐτά, ⸀ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν τὰς πληγὰς τὰς γεγραμμένας ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/018.yaml
  text: 'I testify to everyone who hears the words of the prophecy of this book: if anyone adds to them[b][a], God will add to him the plagues that are written in this book.'
translation:
  language: ru
  text: 'Свидетельствую[b] каждому, кто слышит слова пророчества этой книги[a]: если кто прибавит к ним, Бог прибавит ему те язвы, записанные в этой книге.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свитка». Греческое слово βιβλίον могло обозначать свиток — обычную в древности материальную форму письменного текста.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Даю свидетельство» или «Свидетельствую». Употреблённый глагол относится к языку свидетельства, а не просто к общему предостережению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μαρτυρῶ
  choice: Свидетельствую
  rationale: Сохраняет торжественный язык свидетельства; значение предупреждения раскрывается в последующем условном высказывании, а не подменяет смысл глагола.
- source_word: παντὶ τῷ ἀκούοντι
  choice: каждому, кто слышит
  rationale: Естественно передаёт дательный оборот с причастием настоящего времени, не перегружая русскую фразу.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: слова пророчества
  rationale: Прямо передаёт словесное содержание пророчества и сохраняет его пророческий характер.
- source_word: τοῦ βιβλίου τούτου / ἐν τῷ βιβλίῳ τούτῳ
  choice: этой книги / в этой книге
  rationale: «Книга» — современное и естественное обозначение письменного произведения; оба вхождения переданы последовательно.
- source_word: ἐάν τις ἐπιθῇ ἐπ’ αὐτά
  choice: если кто прибавит к ним
  rationale: Глагол с предлогом означает добавление к тексту; «прибавит» позволяет сохранить намеренный словесный повтор следующей части.
- source_word: ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν
  choice: Бог прибавит ему
  rationale: 'Повтор «прибавит» воспроизводит риторическое соответствие греческого текста: кто прибавляет к словам, тому Бог прибавляет язвы.'
- source_word: τὰς πληγὰς
  choice: те язвы
  rationale: «Язвы» сохраняют характерную для Откровения лексику Божьих судов; указательное «те» естественно вводит последующее определение.
- source_word: τὰς γεγραμμένας
  choice: о которых написано
  rationale: Естественная русская формулировка передаёт совершенный пассивный смысл — эти язвы остаются записанными в книге.
theological_decisions:
- issue: Свидетельство или прямое предупреждение
  choice: Свидетельствую
  alternative: Предупреждаю
  rationale: Греческий глагол относится прежде всего к языку свидетельства. Предупредительная сила ясна из содержания, поэтому её не следует вносить вместо исходного значения.
- issue: Сохранение словесного соответствия между человеческим действием и Божьим воздаянием
  choice: прибавит… Бог прибавит
  alternative: добавит… Бог наведёт
  rationale: Одинаковый греческий глагол в обеих частях создаёт смысловую симметрию, которую важно сохранить, не уточняя сверх текста природу воздаяния.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Сохранены пророческая терминология и намеренный повтор «прибавит», хотя сочетание «Бог прибавит ему язвы» несколько более формально, чем повседневная речь.
