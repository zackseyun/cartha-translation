  source_fidelity: 'Смысловые соответствия в черновике в целом верны: «народы», «будут ходить», «цари земли» и «слава» хорошо передают греческий текст. Однако «благодаря её свету» несколько смещает значение διά к причинному («вследствие») и менее точно передаёт средство. Кроме того, греческое αὐτῆς/αὐτήν относится к городу, но русское «её / в неё» не может быть мотивировано родом слова «город», поскольку «город» в русском языке мужского рода. Настоящее φέρουσιν в данном пророческом контексте естественно передать русским будущим, как и в английском аудиторском решении.'
