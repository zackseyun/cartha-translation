  text: καὶ περιπατήσουσιν τὰ ἔθνη διὰ τοῦ φωτὸς αὐτῆς· καὶ οἱ βασιλεῖς τῆς γῆς φέρουσιν ⸂τὴν δόξαν αὐτῶν⸃ εἰς αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/024.yaml
  text: And the nations will walk by its light[c][b][a], and the kings of the earth will bring their glory into it.
translation:
  language: ru
  text: И народы будут ходить при его свете[c][a], и цари земли принесут в него свою славу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посредством его света».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «своё великолепие» или «свой почёт».'
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте местоимения женского рода, поскольку относятся к городу; в русском они переданы в мужском роде по слову «город».
    reason: grammatical_note
lexical_decisions:
- source_word: περιπατήσουσιν
  choice: будут ходить
  rationale: Сохраняет конкретный образ движения при свете города; более отвлечённые варианты «будут жить» или «будут поступать» здесь неоправданно ослабляют образ.
- source_word: τὰ ἔθνη
  choice: народы
  rationale: Передаёт собирательный этнополитический смысл и сохраняет связь с пророческими образами народов, приходящих к свету нового Иерусалима.
- source_word: διὰ τοῦ φωτὸς αὐτῆς
  choice: благодаря её свету
  rationale: 'διά с родительным обозначает средство или основание: свет города делает возможным хождение народов. Формулировка естественна по-русски и точнее передаёт эту связь, чем простое «в её свете».'
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: цари земли
  rationale: Устойчивое для Откровения обозначение земных правителей; «земли» сохраняет межтекстовую связь и апокалиптический регистр.
- source_word: φέρουσιν
  choice: приносят
  rationale: Сохраняет настоящее время греческого текста после будущего περιπατήσουσιν. Такая смена времени может быть живописным настоящим в пророческом видении, и её не следует без необходимости сглаживать.
- source_word: τὴν δόξαν αὐτῶν
  choice: свою славу
  rationale: Возвратное «свою» естественно соотносит славу с царями; «славу» сохраняет широкий смысл δόξα и библейско-пророческий отзвук, не сводя значение только к богатству или пышности.
- source_word: εἰς αὐτήν
  choice: в неё
  rationale: εἰς выражает направленность внутрь города. Русское местоимение женского рода естественно относится к слову «город» в контекстуальном образе нового Иерусалима и одновременно созвучно его олицетворению.
theological_decisions:
- issue: Образ народов, ходящих посредством света города
  choice: Сохранить буквальный образ «будут ходить», не заменяя его описанием образа жизни или поведения.
  alternative: «Будут жить» либо «будут поступать».
  rationale: Контекст видения соединяет реальный городской свет с пророческой символикой; буквальный образ сохраняет оба уровня и не решает заранее, насколько выражение метафорично.
- issue: Слава земных царей, вносимая в новый Иерусалим
  choice: Передать δόξα как «славу».
  alternative: «Великолепие», «почести» или «богатство».
  rationale: Греческое слово допускает оттенки чести, великолепия и ценности. «Слава» сохраняет эту смысловую широту и не вводит узкое толкование природы приношения.
- issue: Женское местоимение, относящееся к новому Иерусалиму
  choice: «её / в неё».
  alternative: Избежать местоимения посредством повторения «города / в город».
  rationale: В русском обозначение Иерусалима местоимением женского рода естественно в непосредственной связи с подразумеваемым словом «город» женского рода; оно также не устраняет возможного отзвука образа невесты, но и не усиливает его искусственно.
translation_notes:
  register: Современный литературный русский язык с торжественным, но ясным апокалиптическим звучанием. Сохранена смена будущего времени на настоящее, присутствующая в греческом тексте. Местоимения женского рода естественно отсылают к городу, названному в ближайшем контексте.
