  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις τετράγωνος κεῖται, καὶ τὸ μῆκος αὐτῆς ⸀ὅσον τὸ πλάτος. καὶ ἐμέτρησεν τὴν πόλιν τῷ καλάμῳ ἐπὶ ⸀σταδίους δώδεκα ⸀χιλιάδων· τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/016.yaml
  text: 'And the city lies foursquare[a], and its length is as great as its width. And he measured the city with the measuring rod: twelve thousand stadia[c][b]. Its length and width and height are equal.'
translation:
  language: ru
  text: 'Город имеет форму квадрата: длина его равна ширине. Он измерил город мерной тростью: двенадцать тысяч стадиев[c]. Длина, ширина и высота его равны.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: Стадий — древняя мера длины. Двенадцать тысяч стадиев — примерно 2 220 километров, хотя точное значение зависит от принятой длины стадия.
    reason: cultural_note
lexical_decisions:
- source_word: τετράγωνος
  choice: четырёхугольником
  rationale: Передаёт буквальное указание на четырёхстороннюю, квадратную в плане форму, не заменяя его более узким геометрическим выводом.
- source_word: κεῖται
  choice: расположен
  rationale: Естественно по-русски описывает положение и план города; буквальное «лежит» здесь звучало бы менее ясно.
- source_word: τὸ μῆκος αὐτῆς ὅσον τὸ πλάτος
  choice: длина его такая же, как ширина
  rationale: Сохраняет выраженное ὅσον равенство протяжённости и звучит естественно в современном русском.
- source_word: ἐμέτρησεν
  choice: он измерил
  rationale: Прямо передаёт аорист; местоимение сохраняет не названного в самом стихе субъекта, определяемого из контекста.
- source_word: τῷ καλάμῳ
  choice: мерной тростью
  rationale: κάλαμος буквально обозначает трость, которая здесь служит измерительным инструментом; сочетание передаёт и предмет, и функцию.
- source_word: ἐπὶ σταδίους δώδεκα χιλιάδων
  choice: двенадцать тысяч стадиев
  rationale: Передаёт результат измерения идиоматично, не перегружая русский текст отдельным соответствием предлогу ἐπί.
- source_word: στάδιος
  choice: стадий
  rationale: Сохраняет древнюю единицу длины; современный приблизительный пересчёт вынесен в примечание.
- source_word: τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν
  choice: Длина, ширина и высота его равны
  rationale: Непосредственно передаёт равенство трёх измерений, не подменяя формулировку текста выводом о кубической форме.
theological_decisions:
- issue: Сохранять ли древнюю единицу или заменить её современным эквивалентом
  choice: В основном тексте сохранено «двенадцать тысяч стадиев»
  alternative: Около 2 220 километров
  rationale: Греческий текст использует древнюю меру, тогда как современный пересчёт приблизителен и зависит от принятой длины стадия.
- issue: Назвать ли город кубом
  choice: Сохранено прямое утверждение о равенстве длины, ширины и высоты
  alternative: «Город представляет собой совершенный куб»
  rationale: Кубическая форма подразумевается, но греческий текст не употребляет геометрического названия и прямо говорит о равенстве измерений.
- issue: Как передать τετράγωνος при последующем упоминании высоты
  choice: «расположен четырёхугольником» как описание плана города
  alternative: «имеет форму квадрата»
  rationale: Так сохраняется связь с планировкой города и не устраняется напряжение между квадратным планом в первой фразе и равенством трёх измерений в последней.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным повествовательным строем. Повторы «длина», «ширина», «высота» сохранены ради точности и риторической формы исходного текста.
