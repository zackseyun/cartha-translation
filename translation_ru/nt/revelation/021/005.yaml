base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/005.yaml
  text: And the one seated on the throne said[a], “Behold, I am making all things new.” And he said, “Write[b], because these words are trustworthy and true.”
translation:
  language: ru
  text: 'И Сидящий на престоле сказал: «Вот, Я делаю всё новым».[a] И говорит: «Запиши, потому что эти слова достойны доверия и истинны».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я обновляю всё». Греческое выражение буквально означает: «Я делаю всё новым»; оно само по себе не уточняет, идёт ли речь о замене всего прежнего или о его обновлении.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «эти слова верны и истинны». Греческое слово πιστοί может означать «верные», «надёжные» или «достойные доверия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος ἐπὶ τῷ θρόνῳ
  choice: Сидящий на престоле
  rationale: Субстантивированное причастие сохраняет описание говорящего через образ престола и звучит в русском торжественно, но понятно.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Естественный современный русский указательный возглас, сохраняющий функцию привлечения внимания без излишней архаичности.
- source_word: καινὰ ποιῶ πάντα
  choice: Я творю всё новое
  rationale: Передаёт всеохватность πάντα и качественную новизну καινά, не уточняя сверх текста, идёт ли речь о замене прежнего или о его обновлении.
- source_word: Γράψον
  choice: Запиши
  rationale: Прямое повеление передано естественным русским глаголом, подходящим для поручения зафиксировать откровение письменно.
- source_word: ὅτι
  choice: потому что
  rationale: 'Передаёт вероятную причинную связь: слова следует записать ввиду их надёжности и истинности.'
- source_word: οὗτοι οἱ λόγοι
  choice: эти слова
  rationale: Прямой и широкий эквивалент, относящийся к провозглашённому откровению.
- source_word: πιστοὶ καὶ ἀληθινοί
  choice: верны и истинны
  rationale: 'Сохраняет два согласованных определения и их смысловое различие: на эти слова можно положиться, и они соответствуют истине.'
theological_decisions:
- issue: Характер эсхатологического обновления в καινὰ ποιῶ πάντα
  choice: Я творю всё новое
  alternative: Я делаю всё новым
  rationale: Основной вариант сохраняет масштаб и торжественность заявления, не решая однозначно, обозначает ли оно сотворение нового или преображение существующего; альтернативный синтаксически возможный смысл указан в примечании.
- issue: Обозначение говорящего через образ престола
  choice: Сидящий на престоле
  alternative: Тот, кто сидит на престоле
  rationale: Сохранён данный в стихе образ верховной власти без добавочного богословского уточнения личности говорящего.
- issue: Переход от аориста εἶπεν к настоящему λέγει
  choice: сказал… говорит
  alternative: сказал… сказал
  rationale: Необычная смена временных форм сохранена вслед за греческим текстом, а не сглажена молчаливо.
translation_notes:
  register: Современный литературный русский с умеренно торжественным звучанием, уместным для речи с престола. Архаизмы сведены к минимуму; синтаксически заметная смена «сказал… говорит» сохранена по греческому источнику. Прописная буква в «Сидящий» обусловлена началом наименования после союза и его титульной функцией в данном контексте; «Я» оформлено по принятой русской библейской издательской норме.
