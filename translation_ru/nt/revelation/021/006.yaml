id: REV.21.6
reference: Revelation 21:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι· ⸂Γέγοναν. ἐγὼ⸃ τὸ Ἄλφα καὶ τὸ Ὦ, ἡ ἀρχὴ καὶ τὸ τέλος. ἐγὼ τῷ διψῶντι δώσω ἐκ τῆς πηγῆς τοῦ ὕδατος τῆς ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/006.yaml
  text: And he said to me[a], “It is done. I am the Alpha and the Omega, the beginning and the end[b]. To the one who is thirsty I will give from the spring of the water of life freely.”
translation:
  language: ru
  text: 'И Он сказал мне: «Всё это свершилось[a]. Я — Альфа и Омега, начало и конец. Тому, кто жаждет, Я дам пить из источника воды жизни даром[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «они свершились» или «они осуществились». Греческий глагол стоит во множественном числе и относится к возвещённым событиям или реалиям.'
    reason: Уточнение грамматического числа и возможной буквальной передачи.
  - marker: b
    text: 'Или: «без платы», «как дар».'
    reason: Передача смысловых оттенков δωρεάν.
lexical_decisions:
- source_word: Γέγοναν
  choice: Всё это свершилось
  rationale: Форма перфекта во множественном числе указывает на то, что возвещённые события уже осуществились. Русское «всё это» естественно передаёт подразумеваемую совокупность, а «свершилось» сохраняет торжественный характер провозглашения.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: Альфа и Омега
  rationale: Сохранены названия греческих букв как устойчивый символический титул в Откровении; его смысл далее раскрывается словами «начало и конец».
- source_word: ἡ ἀρχὴ καὶ τὸ τέλος
  choice: начало и конец
  rationale: Прямой и естественный перевод, сохраняющий временной и целевой оттенки выражения без излишнего истолкования.
- source_word: τῷ διψῶντι
  choice: тому, кто жаждет
  rationale: Естественно передаёт субстантивированное причастие настоящего времени и сохраняет личный характер обещания.
- source_word: δώσω
  choice: Я дам пить
  rationale: Глагол означает «дам»; добавление подразумеваемого «пить» необходимо для естественной русской конструкции с последующим «из источника» и не меняет образа.
- source_word: ἐκ τῆς πηγῆς
  choice: из источника
  rationale: «Источник» точно и естественно передаёт πηγή в образе животворной воды.
- source_word: τοῦ ὕδατος τῆς ζωῆς
  choice: воды жизни
  rationale: Сохранена исходная родительная конструкция и устоявшийся библейский образ без поясняющего парафраза.
- source_word: δωρεάν
  choice: даром
  rationale: 'Передаёт значение безвозмездности: вода даётся бесплатно, как дар.'
theological_decisions:
- issue: Передача множественного числа в Γέγοναν
  choice: Всё это свершилось
  alternative: Свершилось
  rationale: Выбранный вариант не сглаживает множественное число греческого глагола и связывает провозглашение с совокупностью возвещённых реалий нового творения, не уточняя их сверх текста.
- issue: Сохранение образа Альфы и Омеги как Божественного титула
  choice: Альфа и Омега
  alternative: первая и последняя буква
  rationale: Названия греческих букв сохраняют символику и межтекстовые связи Откровения; стоящее рядом выражение «начало и конец» само поясняет смысл титула.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Местоимение «Он» и местоимение говорящего «Я» написаны с прописной буквы по принятой русской библейской издательской традиции; синтаксис остаётся ясным и не архаизируется.
