  text: Καὶ ὁ λαλῶν μετ’ ἐμοῦ εἶχεν μέτρον κάλαμον χρυσοῦν, ἵνα μετρήσῃ τὴν πόλιν καὶ τοὺς πυλῶνας αὐτῆς καὶ τὸ τεῖχος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/015.yaml
  text: And the one speaking with me had a golden measuring rod[a], so that he might measure the city and its gates and its wall.
translation:
  language: ru
  text: И тот, кто говорил со мной, имел золотую мерную трость[a], чтобы измерить город, его ворота и его стену.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «золотой мерный жезл». Греческое κάλαμος буквально означает «тростник» или «трость»; здесь это орудие для измерения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν μετ’ ἐμοῦ
  choice: тот, кто говорил со мной
  rationale: Субстантивированное причастие настоящего времени передано естественным русским оборотом без добавления слова «ангел», которого в данном стихе нет. Несовершенный вид глагола сохраняет значение продолжающейся речи.
- source_word: εἶχεν
  choice: имел
  rationale: Имперфект ἔχω прямо обозначает наличие или обладание. «Имел» сохраняет формальную сдержанность оригинала и не добавляет подразумеваемого «держал».
- source_word: μέτρον κάλαμον χρυσοῦν
  choice: золотую мерную трость
  rationale: κάλαμος буквально означает «трость, камышовая палка», а μέτρον указывает на её измерительную функцию. «Мерная трость» сохраняет предметный образ оригинала и ясно передаёт назначение орудия.
- source_word: ἵνα μετρήσῃ
  choice: чтобы измерить
  rationale: Союз ἵνα с аористом сослагательного наклонения выражает цель; русский оборот «чтобы измерить» естественно и точно передаёт это значение.
- source_word: τὴν πόλιν
  choice: город
  rationale: Стандартное соответствие без поясняющего добавления «Новый Иерусалим», отсутствующего в самом стихе.
- source_word: τοὺς πυλῶνας αὐτῆς
  choice: его ворота
  rationale: πυλών обозначает ворота или вход; «ворота» — естественное русское архитектурное обозначение. Местоимение «его» однозначно относится к городу.
- source_word: τὸ τεῖχος αὐτῆς
  choice: его стену
  rationale: τεῖχος обозначает городскую оборонительную стену. «Стена» точно передаёт слово без избыточного уточнения.
theological_decisions:
- issue: Следует ли прямо назвать говорящего ангелом
  choice: Сохранить описательное выражение «тот, кто говорил со мной» без слова «ангел».
  alternative: «Ангел, говоривший со мной»
  rationale: В более широком контексте этот персонаж является одним из ангелов, однако в данном стихе греческий текст использует причастное описание и не называет его ангелом. Перевод не вносит контекстуальную идентификацию в сам текст стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Мерная трость» сохраняет образ оригинала и остаётся понятной по контексту; синтаксис сделан плавным без устранения повторяющейся принадлежности городских частей.
