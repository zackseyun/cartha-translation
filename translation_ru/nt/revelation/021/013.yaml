  text: ἀπὸ ⸀ἀνατολῆς πυλῶνες τρεῖς, καὶ ἀπὸ βορρᾶ πυλῶνες τρεῖς, καὶ ἀπὸ νότου πυλῶνες τρεῖς, καὶ ἀπὸ δυσμῶν πυλῶνες τρεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/013.yaml
  text: On the east[a], three gates; and on the north, three gates; and on the south, three gates; and on the west, three gates.
translation:
  language: ru
  text: С восточной стороны[a] — трое ворот, и с северной — трое ворот, и с южной — трое ворот, и с западной — трое ворот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от востока… от севера… от юга… от запада»; здесь выражение передано по-русски как указание на стороны города, где расположены ворота.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ ἀνατολῆς
  choice: с восточной стороны
  rationale: Предлог ἀπό буквально указывает на исходную точку («от»), но в схематическом описании города сочетание обозначает расположение ворот на соответствующей стороне. «С восточной стороны» естественно передаёт пространственный смысл и не создаёт ложного впечатления движения.
- source_word: πυλῶνες
  choice: ворота
  rationale: πυλών может обозначать ворота или весь воротный проём/сооружение. В описании стены Нового Иерусалима обычное русское «ворота» ясно и уместно, тогда как «вратные сооружения» было бы излишне конкретным.
- source_word: τρεῖς
  choice: трое
  rationale: С существительным pluralia tantum «ворота» в современном литературном русском нормативно употребляется собирательное числительное «трое». Повтор сохранён во всех четырёх частях стиха.
- source_word: ἀπὸ βορρᾶ / ἀπὸ νότου / ἀπὸ δυσμῶν
  choice: с северной / с южной / с западной стороны
  rationale: Направления переданы единообразно; слово «стороны», выраженное в первой части, естественно подразумевается в последующих, сохраняя симметрию без тяжеловесности.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: и ... и ... и ...
  rationale: Повтор союзов сохранён, поскольку он создаёт намеренный размеренный, перечислительный ритм и подчёркивает строгую симметрию описания.
theological_decisions:
- issue: Пространственное описание ворот Нового Иерусалима
  choice: 'Прямое архитектурное перечисление: по трое ворот с каждой из четырёх сторон.'
  alternative: Внести в перевод указание на символическую связь с расположением колен Израиля или видением Иезекииля.
  rationale: Сам стих лишь перечисляет ворота по сторонам света. Возможные канонические и символические связи не отрицаются, но не добавляются в перевод, чтобы оставить их для толкования.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Параллелизм и повтор союзов оригинала сохранены; тире ясно оформляет четыре симметричные части перечисления.
