base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/001.yaml
  text: And I saw a new heaven and a new earth[a], for the first heaven and the first earth had passed away[b], and the sea is no more.
translation:
  language: ru
  text: И я увидел новое небо и новую землю, потому что первое небо и первая земля прошли[a], и моря больше нет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прежнее небо и прежняя земля». В греческом тексте буквально: «первое небо и первая земля»; здесь «первое» может обозначать прежний порядок в противопоставлении новому.'
    reason: lexical_alternative
  - marker: b
    text: Слова «моря больше нет» можно понимать буквально; вместе с тем в Откровении море может вызывать ассоциации с хаосом, опасностью или разделением.
    reason: cultural_note
lexical_decisions:
- source_word: εἶδον
  choice: я увидел
  rationale: Аорист ὁράω передан простым повествовательным глаголом прошедшего времени; формулировка ясна и естественна для современного русского языка.
- source_word: οὐρανὸν ... γῆν
  choice: небо ... землю
  rationale: В апокалиптическом космическом контексте эта устойчивая пара обозначает сотворённый мир, а не только видимое небо и сушу; единственное число соответствует греческому тексту.
- source_word: καινὸν ... καινήν
  choice: новое ... новую
  rationale: Сохраняется значение новизны без преждевременного решения, идёт ли речь о полной замене творения или о его преображении.
- source_word: ὁ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ
  choice: первое небо и первая земля
  rationale: Прямо передаёт πρῶτος и сохраняет противопоставление первого порядка новому; вариант «прежнее… прежняя» естественнее по-русски, но несколько более истолковывающий.
- source_word: ἀπῆλθαν
  choice: миновали
  rationale: В данном контексте глагол указывает на исчезновение прежнего порядка. «Миновали» передаёт завершённость действия и звучит литературно, не вводя дополнительного объяснения.
- source_word: ἡ θάλασσα
  choice: море
  rationale: Конкретное значение существительного сохранено; возможные символические ассоциации не внесены в основной текст.
- source_word: οὐκ ἔστιν ἔτι
  choice: больше нет
  rationale: Естественная современная русская формулировка, точно передающая отрицание существования с ἔτι — «уже не, больше не».
theological_decisions:
- issue: Характер нового неба и новой земли
  choice: Переведено словом «новое» без уточнения, заменено ли прежнее творение полностью или преобразовано.
  alternative: Полная замена прежнего творения; обновление или преображение существующего творения.
  rationale: Само прилагательное καινός выражает новизну, но данный стих не разрешает вопрос о замене или преображении; перевод сохраняет эту богословскую открытость.
- issue: Смысл слов «моря больше нет»
  choice: Образ моря сохранён без истолкования в основном тексте.
  alternative: Буквальное отсутствие моря; символическое устранение хаоса, опасности, зла или разделения.
  rationale: В Откровении море может иметь символические оттенки, однако текст прямо называет море. Возможные значения уместнее обозначить в примечании, не подменяя ими перевод.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным повествовательным звучанием. Синтаксис следует греческой последовательности мысли, избегая архаизмов и конфессионально окрашенных уточнений.
