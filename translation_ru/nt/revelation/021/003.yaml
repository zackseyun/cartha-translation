id: REV.21.3
reference: Revelation 21:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνῆς μεγάλης ἐκ τοῦ ⸀θρόνου λεγούσης· Ἰδοὺ ἡ σκηνὴ τοῦ θεοῦ μετὰ τῶν ἀνθρώπων, καὶ σκηνώσει μετ’ αὐτῶν, καὶ αὐτοὶ ⸀λαοὶ αὐτοῦ ἔσονται, καὶ αὐτὸς ὁ θεὸς ⸂μετ’ αὐτῶν ἔσται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/003.yaml
  text: And I heard a loud voice from the throne saying[a], “Behold, the dwelling place of God is with humanity, and he will dwell with them, and they will be his peoples[d][c][b], and God himself will be with them.”
translation:
  language: ru
  text: 'И услышал я громкий голос от престола, говоривший: «Вот, жилище Бога[a] — с людьми, и Он будет обитать[b] с ними. Они будут Его народами[c], и Сам Бог будет с ними».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «скиния Бога» или «шатёр Бога». Греческое σκηνή вызывает образ скинии — места Божьего присутствия.'
    reason: lexical_alternative
  - marker: b
    text: 'Глагол родственен слову, переведённому как «жилище»; буквальный образ: «Он поставит Свой шатёр» или «будет жить в шатре» с ними.'
    reason: lexical_alternative
  - marker: c
    text: 'В греческом тексте стоит множественное число: «народы», а не традиционное единственное «народ».'
    reason: alternative_reading
lexical_decisions:
- source_word: φωνῆς μεγάλης
  choice: громкий голос
  rationale: В сочетании с φωνή прилагательное μέγας указывает прежде всего на силу и громкость голоса; это естественная современная русская передача.
- source_word: ἐκ τοῦ θρόνου
  choice: от престола
  rationale: Предлог ἐκ обозначает источник голоса. «Престол» сохраняет образ небесного престола, важный для Откровения.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: «Вот» естественно и торжественно привлекает внимание, передавая функцию ἰδού без излишней архаичности.
- source_word: ἡ σκηνὴ τοῦ θεοῦ
  choice: жилище Бога
  rationale: σκηνή буквально означает шатёр или скинию, а здесь говорит о месте Божьего пребывания среди людей. Ясное «жилище» помещено в основной текст, а буквальный образ сохранён в сноске.
- source_word: μετὰ τῶν ἀνθρώπων
  choice: с людьми
  rationale: ἄνθρωποι обозначает здесь людей вообще, а не только мужчин; русское «с людьми» точно и естественно передаёт этот общий смысл.
- source_word: σκηνώσει
  choice: будет обитать
  rationale: Глагол σκηνόω родственен существительному σκηνή и буквально вызывает образ поставленного шатра. «Будет обитать» ясно передаёт смысл, а образная связь отмечена в сноске.
- source_word: λαοὶ αὐτοῦ
  choice: Его народами
  rationale: В SBLGNT стоит множественное число λαοί. Необычная для русского традиционного звучания форма сохранена, чтобы не сглаживать особенность греческого текста.
- source_word: αὐτὸς ὁ θεός
  choice: Сам Бог
  rationale: «Сам» передаёт эмфатическое αὐτός и подчёркивает непосредственное присутствие Бога.
- source_word: μετ’ αὐτῶν ἔσται
  choice: будет с ними
  rationale: Простая и естественная русская передача будущего времени, сохраняющая формулу Божьего присутствия.
theological_decisions:
- issue: Множественное число λαοὶ вместо традиционного единственного «народ»
  choice: Они будут Его народами
  alternative: Они будут Его народом
  rationale: Критический греческий текст имеет множественное число. Его сохранение не устраняет возможного напряжения между множеством народов и единством принадлежащих Богу людей и не навязывает истолкование этого напряжения.
- issue: Образ скинии в σκηνή и σκηνόω
  choice: жилище Бога… будет обитать
  alternative: скиния Бога… раскинет Свою скинию / будет жить в шатре
  rationale: Основной текст остаётся понятным современному читателю, а сноски сохраняют буквальный образ шатра или скинии и связь между существительным и глаголом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаическим строем. Инверсия «И услышал я» поддерживает возвышенный повествовательный регистр Откровения. Необычное «Его народами» намеренно сохраняет множественное число оригинала; буквальная образность σκηνή/σκηνόω вынесена в сноски ради ясности основного текста.
