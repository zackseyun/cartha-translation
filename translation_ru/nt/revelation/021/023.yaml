id: REV.21.23
reference: Revelation 21:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις οὐ χρείαν ἔχει τοῦ ἡλίου οὐδὲ τῆς σελήνης, ἵνα φαίνωσιν αὐτῇ, ἡ γὰρ δόξα τοῦ θεοῦ ἐφώτισεν αὐτήν, καὶ ὁ λύχνος αὐτῆς τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/023.yaml
  text: And the city has no need of the sun or of the moon to shine on it[a], for the glory of God gave it light, and its lamp is the Lamb.
translation:
  language: ru
  text: И город не нуждается ни в солнце, ни в луне, чтобы они светили ему[a], потому что слава Бога осветила его, и светильник его — Агнец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы они освещали его». Греческое выражение буквально означает «чтобы они светили ему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλις
  choice: город
  rationale: Прямое и естественное обозначение нового Иерусалима в данном контексте.
- source_word: οὐ χρείαν ἔχει
  choice: не нуждается
  rationale: Естественно передаёт греческую идиому «не имеет нужды», не утяжеляя современный русский текст.
- source_word: τοῦ ἡλίου οὐδὲ τῆς σελήνης
  choice: ни в солнце, ни в луне
  rationale: Конструкция с повторяющимся «ни» естественно передаёт парное отрицание и управление русского глагола «нуждаться».
- source_word: ἵνα φαίνωσιν αὐτῇ
  choice: чтобы они светили ему
  rationale: Сохраняет конкретный образ светящих небесных тел и дательный оттенок αὐτῇ; местоимение согласовано с русским словом «город».
- source_word: δόξα τοῦ θεοῦ
  choice: слава Бога
  rationale: Сохраняет традиционный и богословски значимый смысл δόξα, не сводя его только к сиянию.
- source_word: ἐφώτισεν
  choice: осветила
  rationale: Передаёт конкретное действие света и сохраняет отличие от предшествующего глагола «светили».
- source_word: λύχνος
  choice: светильник
  rationale: Точно обозначает источник света, а не сам свет и не подставку для светильника; подходит к древнему образу лучше современного слова «лампа».
- source_word: ἀρνίον
  choice: Агнец
  rationale: Устоявшееся в Откровении христологическое наименование; прописная буква отмечает титульное употребление.
theological_decisions:
- issue: Метафора «светильник его — Агнец»
  choice: 'Метафора сохранена непосредственно: «светильник его — Агнец».'
  alternative: «Агнец — его свет» или «его освещает Агнец».
  rationale: Греческий текст употребляет λύχνος — «светильник», а не общее слово «свет»; формулировка сохраняет различие между славой Бога, освещающей город, и Агнцем как его светильником.
- issue: Образ божественного освещения
  choice: Утверждение передано без добавочного эсхатологического объяснения.
  alternative: Пояснить в тексте, что Бог заменяет все сотворённые источники света.
  rationale: Стих говорит об отсутствии нужды в солнце и луне и указывает на славу Бога и Агнца, но не развивает дальнейшего объяснения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис остаётся ясным для широкого круга читателей; образность оригинала не сглажена.
