id: REV.21.17
reference: Revelation 21:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐμέτρησεν τὸ τεῖχος αὐτῆς ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν, μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/017.yaml
  text: And he measured its wall[a], 144 cubits by human measure, which is also an angel’s measure.
translation:
  language: ru
  text: И измерил он её стену — 144 локтя по человеческой мере, которая также является мерой ангела[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по мере человека, то есть ангела». Греческое выражение может подчёркивать либо то, что ангел пользовался человеческой единицей измерения, либо то, что человеческая и ангельская меры здесь совпадают.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμέτρησεν
  choice: измерил
  rationale: Аорист μετρέω прямо обозначает совершённое действие измерения; «измерил» естественно и точно передаёт его в данном повествовании.
- source_word: τεῖχος
  choice: стену
  rationale: τεῖχος обозначает городскую или оборонительную стену; в описании Нового Иерусалима обычное русское «стена» ясно передаёт смысл.
- source_word: αὐτῆς
  choice: её
  rationale: Местоимение относится к городу; в русском слово «город» грамматически мужского рода, но ближайшим смысловым референтом в контексте является персонифицированная столица/невеста. Форма «её» сохраняет связь с описываемым городом как женским образом и соответствует греческому αὐτῆς.
- source_word: ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν
  choice: 144 локтя
  rationale: Сохранена древняя единица измерения без приблизительного пересчёта; запись цифрами облегчает восприятие апокалиптического числа.
- source_word: μέτρον ἀνθρώπου
  choice: по человеческой мере
  rationale: ἀνθρώπου имеет обобщённое значение, поэтому «человеческой», а не «мужской», точно и естественно передаёт смысл.
- source_word: ὅ ἐστιν ἀγγέλου
  choice: которая также является мерой ангела
  rationale: 'В греческом выражение эллиптическое: существительное «мера» во второй части подразумевается. Его повторение делает русский текст понятным, а «также» выражает соответствие человеческой и ангельской меры, не добавляя отдельной единицы измерения.'
theological_decisions:
- issue: Смысл выражения μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου
  choice: Размер дан в человеческой мере, которая здесь одновременно является мерой ангела.
  alternative: Размер определён «мерой человека, то есть ангела», причём ангел может пониматься как тот, кто производит измерение.
  rationale: Греческая фраза сжата и допускает разный синтаксический акцент. Основной текст передаёт наиболее естественное пояснительное соответствие, а примечание сохраняет альтернативную возможность, не делая догматических выводов.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Тире естественно вводит числовой результат измерения. Древняя мера сохранена, а не пересчитана; неоднозначность относительно того, что именно означает соответствие человеческой и ангельской меры, отмечена в сноске.
