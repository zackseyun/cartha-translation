id: REV.21.7
reference: Revelation 21:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ νικῶν κληρονομήσει ταῦτα, καὶ ἔσομαι αὐτῷ θεὸς καὶ αὐτὸς ἔσται μοι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/007.yaml
  text: The one who overcomes will inherit these things[a], and I will be his God[b], and he will be my son.
translation:
  language: ru
  text: Тот, кто побеждает[a], унаследует всё это, и Я буду ему Богом, а он будет Мне сыном[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тот, кто одерживает победу». Греческий глагол νικάω неоднократно употребляется в Откровении о том, кто остаётся верным и побеждает.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте буквально: «он будет Мне сыном». Мужская форма здесь, вероятно, имеет обобщающее значение, однако перевод сохраняет исходный образ сыновства, связанный с наследованием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Тот, кто побеждает
  rationale: Субстантивированное причастие настоящего времени обозначает человека, для которого верность в преодолении является характерной. Такая передача ясна современному читателю и сохраняет повторяющийся в Откровении мотив победы.
- source_word: κληρονομήσει
  choice: унаследует
  rationale: Глагол прямо передаёт получение наследства и сохраняет семейно-заветные оттенки, связанные с последующим образом отношений Бога и сына.
- source_word: ταῦτα
  choice: всё это
  rationale: Греческое местоимение имеет форму множественного числа и указывает на описанные ранее блага нового творения. По-русски собирательное «всё это» звучит естественнее буквального «эти вещи», не меняя объёма указания.
- source_word: ἔσομαι αὐτῷ θεὸς
  choice: Я буду ему Богом
  rationale: Передача с дательным падежом близко отражает греческую конструкцию и естественно воспроизводит заветную формулу в русском языке.
- source_word: αὐτὸς ἔσται μοι υἱός
  choice: он будет Мне сыном
  rationale: Формулировка сохраняет как дательную конструкцию оригинала, так и личный образ сыновства, связанный здесь с наследованием.
- source_word: υἱός
  choice: сыном
  rationale: Мужской термин оригинала важен для образов сыновства и наследования. Его вероятное обобщающее значение поясняется в сноске, а не нейтрализуется в основном тексте.
theological_decisions:
- issue: Мужской образ сыновства в обещании, обращённом в общем смысле к побеждающему
  choice: Сохранить «сыном» в основном тексте
  alternative: «ребёнком» или «дитём»
  rationale: В греческом прямо употреблено υἱός, и образ сына связан с наследованием. При этом единственное число мужского рода, вероятно, представляет всякого верного победителя; это пояснено без изменения исходного образа.
- issue: Отзвук заветной формулы
  choice: «Я буду ему Богом, а он будет Мне сыном»
  alternative: «Я буду его Богом, а он будет Моим сыном»
  rationale: Выбранная конструкция непосредственно отражает греческие дательные αὐτῷ и μοι и сохраняет узнаваемую заветную формулу, не добавляя толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конструкция «Тот, кто побеждает» понятнее обычному читателю, чем субстантивированное «Побеждающий». Заглавные буквы в местоимениях, относящихся к Богу, поддерживают принятый в русском библейском письме уважительный регистр.
