source:
  edition: SBLGNT
  text: καὶ τὸ τεῖχος τῆς πόλεως ⸀ἔχων θεμελίους δώδεκα, καὶ ἐπ’ αὐτῶν δώδεκα ὀνόματα τῶν δώδεκα ἀποστόλων τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/014.yaml
  text: And the wall of the city had twelve foundations[a], and on them were the twelve names of the twelve apostles of the Lamb.
translation:
  language: ru
  text: А стена города имела двенадцать оснований[a], и на них — двенадцать имён двенадцати апостолов Агнца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «двенадцать фундаментных камней». Греческое слово θεμελίους в архитектурном контексте может означать как основания, так и фундаментные камни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεῖχος
  choice: стена
  rationale: В данном архитектурном контексте слово обозначает городскую, в том числе оборонительную, стену; «стена» — естественный и точный русский эквивалент.
- source_word: πόλεως
  choice: города
  rationale: 'Родительный падеж естественно передаёт принадлежность: стена, относящаяся к городу.'
- source_word: ἔχων
  choice: имела
  rationale: Греческое причастие буквально означает «имеющая», но личная форма «имела» естественнее в русском повествовательном описании и сохраняет смысл.
- source_word: θεμελίους δώδεκα
  choice: двенадцать оснований
  rationale: θεμέλιος может обозначать как основание, так и фундаментный камень. Основной вариант «оснований» близок к форме исходного текста, а предметная альтернатива отмечена в сноске.
- source_word: ἐπ’ αὐτῶν
  choice: на них
  rationale: Предлог ἐπί с родительным здесь выражает положение на основаниях; местоимение ясно отсылает к ним и не добавляет отсутствующих в тексте деталей.
- source_word: ὀνόματα
  choice: имён
  rationale: Исходный текст говорит именно об именах, не уточняя, были ли они начертаны, поэтому слово «надписей» не добавляется.
- source_word: ἀποστόλων
  choice: апостолов
  rationale: В новозаветном контексте это устоявшийся и точный термин, сохраняющий особый статус названных лиц.
- source_word: τοῦ ἀρνίου
  choice: Агнца
  rationale: В Откровении ἀρνίον служит устойчивым христологическим титулом. Традиционное русское «Агнец» сохраняет титульность и библейскую образность, оставаясь понятным современному читателю.
theological_decisions:
- issue: Христологический титул ἀρνίον
  choice: Агнца
  alternative: ягнёнка
  rationale: «Агнец» в русской библейской речи узнаваем как титул Иисуса и передаёт богословскую насыщенность образа. Прописная буква обозначает титульное употребление, не добавляя нового содержания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис сохраняет параллелизм оригинала; тире во второй части естественно восполняет опущенный глагол. Форма «имён» соответствует современной нормативной речи.
