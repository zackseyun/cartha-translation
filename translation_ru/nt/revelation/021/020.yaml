  source_fidelity: Текст точно передаёт восемь порядковых позиций и все названия камней в последовательности греческого оригинала. Средний род числительных («пятое», «шестое» и т. д.) корректно отсылает к подразумеваемому «основанию» из предшествующего контекста. «Сардоникс» и «сардий» сохраняют различие между σαρδόνυξ и σάρδιον; «гиацинт» адекватно передаёт ὑάκινθος как камень.
