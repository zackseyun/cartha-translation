id: REV.21.20
reference: Revelation 21:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ πέμπτος σαρδόνυξ, ὁ ἕκτος σάρδιον, ὁ ἕβδομος χρυσόλιθος, ὁ ὄγδοος βήρυλλος, ὁ ἔνατος τοπάζιον, ὁ δέκατος χρυσόπρασος, ὁ ἑνδέκατος ὑάκινθος, ὁ δωδέκατος ἀμέθυστος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/020.yaml
  text: the fifth[a], sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, topaz; the tenth[b], chrysoprase; the eleventh, jacinth; the twelfth, amethyst.
translation:
  language: ru
  text: пятое — сардоникс; шестое — сардий[a]; седьмое — хризолит; восьмое — берилл; девятое — топаз; десятое — хризопраз; одиннадцатое — гиацинт[b]; двенадцатое — аметист.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «сердолик»; точное соответствие древнего названия современному минералу остаётся неясным.
    reason: lexical_alternative
  - marker: b
    text: Здесь «гиацинт» — название драгоценного камня, а не цветка.
    reason: lexical_clarification
lexical_decisions:
- source_word: σαρδόνυξ
  choice: сардоникс
  rationale: Устоявшееся русское название камня, непосредственно соответствующее греческому термину и сохраняющее его отличие от σάρδιον.
- source_word: σάρδιον
  choice: сардий
  rationale: Традиционное название древнего камня сохраняет различие с сардониксом; отождествление с современным сердоликом вероятно, но не бесспорно.
- source_word: χρυσόλιθος
  choice: хризолит
  rationale: Устоявшийся русский эквивалент названия камня; буквальное «золотой камень» здесь было бы неестественным и могло бы создать ложную точность.
- source_word: βήρυλλος
  choice: берилл
  rationale: Стандартное современное русское название минерала.
- source_word: τοπάζιον
  choice: топаз
  rationale: Стандартный русский эквивалент греческого названия, при том что точное соответствие древней и современной минералогии не всегда устанавливается.
- source_word: χρυσόπρασος
  choice: хризопраз
  rationale: Устоявшееся название драгоценного камня; этимологическая калька была бы непонятна современному читателю.
- source_word: ὑάκινθος
  choice: гиацинт
  rationale: Традиционное русское название драгоценного камня; примечание предупреждает, что речь не о цветке.
- source_word: ἀμέθυστος
  choice: аметист
  rationale: Однозначный и общеупотребительный русский эквивалент.
- source_word: πέμπτος … δωδέκατος
  choice: пятое … двенадцатое
  rationale: Порядковые числительные переданы в среднем роде по подразумеваемому русскому слову «основание», указанному в предшествующем контексте; повторяющаяся структура греческого перечня сохранена.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным ритмом перечня. Тире естественно передаёт опущенную в греческом связку. Названия камней даны в традиционной русской минералогической форме без искусственной этимологизации.
