id: REV.21.10
reference: Revelation 21:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με ἐν πνεύματι ἐπὶ ὄρος μέγα καὶ ὑψηλόν, καὶ ἔδειξέν μοι τὴν ⸀πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/010.yaml
  text: And he carried me away in the Spirit onto a great and high mountain[a], and showed me the holy city, Jerusalem, coming down out of heaven from God,
translation:
  language: ru
  text: И он перенёс меня в духе[a] на великую и высокую гору и показал мне святой город Иерусалим, сходящий с неба от Бога,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Духе». Греческое выражение может обозначать состояние пророческого видения; в Откровении оно неоднократно вводит описание такого видения.'
    reason: Сохранение лексической и богословской неоднозначности выражения ἐν πνεύματι.
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: перенёс
  rationale: Глагол обозначает перемещение с одного места наблюдения на другое; «перенёс» естественно звучит по-русски и сохраняет оттенок переноса в контексте видения.
- source_word: ἐν πνεύματι
  choice: в духе
  rationale: Формула в Откровении вводит пророческое видение. Строчная буква не предрешает, обозначает ли выражение действие Святого Духа или состояние духа пророка; варианты пояснены в сноске.
- source_word: ἐπὶ ὄρος μέγα καὶ ὑψηλόν
  choice: на великую и высокую гору
  rationale: Предлог с винительным падежом передаёт движение на гору; оба определения сохранены как отдельные характеристики.
- source_word: ἔδειξέν μοι
  choice: показал мне
  rationale: Прямой и естественный эквивалент, не добавляющий к глаголу отсутствующего в тексте значения откровения.
- source_word: τὴν πόλιν τὴν ἁγίαν Ἰερουσαλήμ
  choice: святой город Иерусалим
  rationale: Иерусалим представлен как приложение к «святому городу»; порядок слов соответствует нормам современного русского языка.
- source_word: καταβαίνουσαν
  choice: сходящий
  rationale: Причастие настоящего времени изображает город в процессе движения вниз; форма согласована с русским словом «город».
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с неба
  rationale: Передаёт исходную точку движения; по-русски «сходить с неба» естественнее буквального «из неба».
- source_word: ἀπὸ τοῦ θεοῦ
  choice: от Бога
  rationale: Сохраняет указание на Бога как источник, не добавляя слов «из присутствия».
theological_decisions:
- issue: Значение формулы ἐν πνεύματι
  choice: «в духе» со сноской, сохраняющей возможность действия Святого Духа
  alternative: «в Духе» как прямое указание на Святого Духа
  rationale: В греческом тексте слово πνεῦμα не сопровождается определением, которое однозначно указывало бы на референта. Контекст пророческого видения допускает действие Святого Духа, но перевод не должен устранять возможное значение состояния духа Иоанна.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены повтор союза «и», оба определения горы и различие между «с неба» и «от Бога».
