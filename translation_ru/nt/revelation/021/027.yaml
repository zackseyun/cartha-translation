id: REV.21.27
reference: Revelation 21:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ εἰσέλθῃ εἰς αὐτὴν πᾶν κοινὸν καὶ ⸀ποιῶν βδέλυγμα καὶ ψεῦδος, εἰ μὴ οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/027.yaml
  text: And nothing unclean will ever enter it[a], nor anyone who does what is detestable or false[b], but only those written in the Lamb’s book of life.
translation:
  language: ru
  text: И ничто нечистое никогда не войдёт в него[a], и никто, кто творит мерзость и ложь[b], не войдёт; войдут только записанные в книге жизни Агнца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ничто осквернённое» или «ничто профанное».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «творящий мерзость и ложь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ εἰσέλθῃ
  choice: никогда не войдёт
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание; «никогда не войдёт» естественно передаёт безусловность исключения.
- source_word: αὐτὴν
  choice: в него
  rationale: Местоимение относится к городу — Новому Иерусалиму; по-русски «город» мужского рода.
- source_word: πᾶν κοινὸν
  choice: ничто нечистое
  rationale: Средний род единственного числа с πᾶν имеет обобщающий смысл «ничто»; κοινός в контексте чистоты означает нечистое, осквернённое или профанное.
- source_word: ποιῶν βδέλυγμα καὶ ψεῦδος
  choice: кто творит мерзость и ложь
  rationale: Субстантивированное причастие обозначает человека, совершающего названное; буквальная и при этом традиционно понятная конструкция сохраняет оба дополнения при одном глаголе.
- source_word: εἰ μὴ
  choice: но только
  rationale: Оборот вводит единственное исключение и ясно подчёркивает контраст.
- source_word: οἱ γεγραμμένοι
  choice: записанные
  rationale: 'Перфектное страдательное причастие указывает на состоявшийся результат: эти люди находятся среди записанных; слово «имена» не добавляется, поскольку его нет в греческом тексте.'
- source_word: ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου
  choice: в книге жизни Агнца
  rationale: Сохраняется устойчивый библейский образ «книги жизни» и христологический титул «Агнец»; родительный падеж допускает присоединение «Агнца» к выражению «книга жизни» без искусственного устранения возможной синтаксической нюансировки.
theological_decisions:
- issue: Объём исключения из Нового Иерусалима
  choice: Сохранить различие между «ничем нечистым» и людьми, творящими мерзость и ложь.
  alternative: Понять первую часть только как указание на безличную нечистоту, не относящуюся к людям.
  rationale: Греческий текст сочетает средний род πᾶν κοινόν и субстантивированное причастие ποιῶν, поэтому перевод не сливает эти две формулировки.
- issue: Что именно записано в книге
  choice: Перевести просто «записанные».
  alternative: «Те, чьи имена записаны».
  rationale: Книжный образ подразумевает запись людей или их имён, однако слово «имена» в данном стихе отсутствует; эксплицитация не требуется.
- issue: Связь выражения «Агнца»
  choice: Сохранить «в книге жизни Агнца».
  alternative: «В принадлежащей Агнцу книге жизни».
  rationale: Более развёрнутый вариант однозначно задаёт притяжательное толкование, тогда как компактная форма ближе к структуре оригинала и не снимает возможную синтаксическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического стиля. «Творит мерзость и ложь» слегка возвышенно, но ясно и близко к греческой конструкции; «Агнец» сохраняется как ключевой титул Откровения.
