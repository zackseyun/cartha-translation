  source_fidelity: '«Он имел» превращает настоящее причастие ἔχουσαν, согласованное с «городом» из предыдущего стиха, в самостоятельное сказуемое прошедшего времени. Безопаснее сохранить зависимую причастную связь: «имеющий славу Бога». Остальные ключевые соответствия переданы точно: «слава Бога», «сияние», превосходная степень «драгоценнейшему», повтор образа камня и сравнение с кристаллом.'
  naturalness: «Имеющий славу Бога; сияние его было подобно…» — естественный литературный русский синтаксис для продолжения предложения из ст. 10. Форма мужского рода оправдана, если предшествующий референт переведён как «город». «Камню — яшме» яснее обозначает пояснительное приложение, чем слитное «камню яшме».
  terminology: «Слава Бога» надёжно сохраняет богословски значимое δόξα τοῦ θεοῦ. «Сияние» допустимо для φωστήρ в данном описательном контексте; сноска корректно сообщает альтернативы «свет» и «блеск». «Яшма» и «кристалл» употреблены уместно.
