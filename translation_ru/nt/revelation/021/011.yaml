  rationale: 'Исправлена только передача ἔχουσαν: причастная форма «имеющий» точно связывает данный стих с «городом» предыдущего стиха. Тире в «камню — яшме» уточняет приложение. Сноска a сохранена как часть полного набора примечаний, но её якорь следует размещать после «сияние» при вёрстке текста; в представленной строке якорь a был утрачен, поэтому ниже требуется текст с обоими якорями.'
