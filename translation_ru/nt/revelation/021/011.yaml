  text: ἔχουσαν τὴν δόξαν τοῦ θεοῦ· ὁ φωστὴρ αὐτῆς ὅμοιος λίθῳ τιμιωτάτῳ, ὡς λίθῳ ἰάσπιδι κρυσταλλίζοντι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/011.yaml
  text: having the glory of God[a]; its radiance was like a most precious stone, like a jasper stone[b], clear as crystal.
translation:
  language: ru
  text: имеющий славу Бога; сияние его было подобно драгоценнейшему камню — камню яшме, прозрачному, как кристалл[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «сверкающему, как кристалл».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσαν
  choice: имел
  rationale: Причастие настоящего времени относится к городу из предыдущего стиха. В русском род согласован со словом «город»; личная форма естественно передаёт продолжение описания, не сводя связь со славой Бога лишь к внешнему сопровождению.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: славу Бога
  rationale: «Слава» сохраняет широкий библейский смысл δόξα — явленное величие и присутствие Бога, — тогда как «великолепие» или «сияние» сузили бы выражение до зрительного впечатления.
- source_word: ὁ φωστὴρ αὐτῆς
  choice: его сияние
  rationale: φωστήρ может обозначать источник света, свет или яркое свечение. В описании облика города «сияние» естественно передаёт видимый световой эффект, не утверждая, что речь непременно идёт об отдельном светиле.
- source_word: λίθῳ τιμιωτάτῳ
  choice: драгоценнейшему камню
  rationale: Превосходная степень τιμιωτάτῳ передана формой «драгоценнейшему», а λίθος — словом «камень»; тем самым сохранены и образ, и усиление исходного текста.
- source_word: ὡς λίθῳ ἰάσπιδι
  choice: камню яшме
  rationale: Сохранено повторение слова λίθος и название камня ἴασπις. Бессоюзное пояснение после тире звучит по-русски естественнее, чем повторное «подобно» или «как».
- source_word: κρυσταλλίζοντι
  choice: прозрачному, как кристалл
  rationale: Причастие описывает яшму как кристаллоподобную — прозрачную или сверкающую. Основной вариант передаёт возможную прозрачность, а вариант со сверканием отмечен в сноске.
theological_decisions:
- issue: Значение δόξα τοῦ θεοῦ в апокалиптическом описании
  choice: слава Бога
  alternative: великолепие Бога
  rationale: Выражение указывает не только на красоту, но и на явленное Божье величие и присутствие. «Слава Бога» сохраняет эту богословскую насыщенность, не уточняя сверх сказанного, каким именно образом она принадлежит городу.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Мужской род местоимения обусловлен русским словом «город», к которому относится описание. Повтор «камню — камню» сохраняет образную структуру греческого текста и смягчён пояснительным тире.
