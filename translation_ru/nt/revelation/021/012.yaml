id: REV.21.12
reference: Revelation 21:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἔχουσα τεῖχος μέγα καὶ ὑψηλόν, ἔχουσα πυλῶνας δώδεκα, καὶ ἐπὶ ⸂τοῖς πυλῶσιν⸃ ἀγγέλους δώδεκα, καὶ ὀνόματα ἐπιγεγραμμένα ἅ ⸀ἐστιν τῶν δώδεκα ⸀φυλῶν υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/012.yaml
  text: having a great and high wall, having twelve gates, and at the gates twelve angels, and names inscribed, which are those of the twelve tribes of the sons of Israel.
translation:
  language: ru
  text: У него великая и высокая стена, двенадцать ворот, а у ворот — двенадцать ангелов; начертаны и имена двенадцати колен сынов Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более традиционной передаче: «детей Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσα
  choice: у него
  rationale: Причастие женского рода описывает город из предыдущего стиха. Русская конструкция «у него» естественно продолжает описание, не перегружая фразу буквальным повторением «имеющий».
- source_word: τεῖχος μέγα καὶ ὑψηλόν
  choice: великая и высокая стена
  rationale: Оба определения переданы раздельно; «великая» выражает значительность и масштаб, а «высокая» — высоту.
- source_word: πυλῶνας δώδεκα
  choice: двенадцать ворот
  rationale: «Ворота» — обычное и контекстуально точное обозначение входов в городскую стену.
- source_word: ἐπὶ τοῖς πυλῶσιν
  choice: у ворот
  rationale: Предлог ἐπί с дательным здесь имеет локативное значение. «У ворот» не создаёт впечатления, будто ангелы находятся поверх ворот.
- source_word: ἀγγέλους δώδεκα
  choice: двенадцать ангелов
  rationale: Прямое и однозначное соответствие греческому выражению.
- source_word: ὀνόματα ἐπιγεγραμμένα
  choice: начертаны имена
  rationale: «Начертаны» передаёт смысл надписи на архитектурном объекте точнее, чем общее «написаны», при этом место нанесения не уточняется сверх сказанного в греческом тексте.
- source_word: ἅ ἐστιν τῶν δώδεκα φυλῶν
  choice: имена двенадцати колен
  rationale: Отношение принадлежности, выраженное относительным оборотом, естественно передано по-русски родительным падежом без утраты смысла.
- source_word: φυλῶν
  choice: колен
  rationale: «Колено» — устойчивое русское библейское обозначение племенного подразделения Израиля.
- source_word: υἱῶν Ἰσραήλ
  choice: сынов Израиля
  rationale: Сохраняется прямо выраженное в источнике υἱῶν («сынов») и корпоративное обозначение народа Израиля.
theological_decisions:
- issue: Передача υἱῶν Ἰσραήλ как корпоративного наименования
  choice: сынов Израиля
  alternative: детей Израиля
  rationale: Основной текст сохраняет мужской род исходного слова υἱῶν и не нейтрализует родственное обозначение. Более широкая традиционная формулировка дана в сноске.
- issue: Место, где начертаны имена
  choice: не уточнять явно
  alternative: на воротах начертаны имена
  rationale: Контекст тесно связывает имена с воротами, однако в данном греческом предложении при ἐπιγεγραμμένα нет явно выраженного дополнения «на них». Перевод сохраняет эту синтаксическую недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Тире выделяет местонахождение ангелов, а точка с запятой делает длинное перечисление яснее. Маркер [a] помещён непосредственно после выражения, к которому относится сноска.
