id: REV.21.21
reference: Revelation 21:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ οἱ δώδεκα πυλῶνες δώδεκα μαργαρῖται, ἀνὰ εἷς ἕκαστος τῶν πυλώνων ἦν ἐξ ἑνὸς μαργαρίτου· καὶ ἡ πλατεῖα τῆς πόλεως χρυσίον καθαρὸν ὡς ὕαλος διαυγής.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/021.yaml
  text: And the twelve gates were twelve pearls; each one of the gates was from a single pearl. And the street of the city was pure gold[a], like transparent glass.
translation:
  language: ru
  text: 'А двенадцать ворот — двенадцать жемчужин: каждые ворота были сделаны из одной жемчужины. А улица[a] города — чистое золото, словно прозрачное стекло.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «широкая улица города»; или: «площадь города».'
    reason: Лексическая неоднозначность πλατεῖα.
lexical_decisions:
- source_word: πυλῶνες
  choice: ворота
  rationale: В описании архитектуры Нового Иерусалима слово обозначает ворота или воротное сооружение; «ворота» — естественный и точный русский эквивалент.
- source_word: μαργαρῖται / μαργαρίτου
  choice: жемчужины / жемчужины
  rationale: 'Сохранено прямое значение «жемчужина», а также переход от множественного числа к единственному: двенадцать ворот соответствуют двенадцати жемчужинам, и каждые ворота — одной жемчужине.'
- source_word: ἀνὰ εἷς ἕκαστος
  choice: каждые ворота
  rationale: 'Сочетание имеет усиленное распределительное значение: каждые из ворот по отдельности. По-русски это естественно передаётся словами «каждые ворота».'
- source_word: ἐξ ἑνὸς μαργαρίτου
  choice: были сделаны из одной жемчужины
  rationale: Предлог ἐξ указывает здесь на материал или происхождение. «Сделаны из» ясно передаёт образ, а «одной» сохраняет акцент на единственности.
- source_word: πλατεῖα
  choice: улица
  rationale: Слово может обозначать широкую улицу, открытую городскую дорогу или площадь. В данном контексте «улица» звучит естественно и не навязывает образ конкретной современной планировки; варианты отмечены в сноске.
- source_word: χρυσίον καθαρὸν
  choice: чистое золото
  rationale: Обычное и точное русское выражение для золота, характеризуемого как чистое.
- source_word: ὡς ὕαλος διαυγής
  choice: словно прозрачное стекло
  rationale: διαυγής передаёт прозрачность и ясность; «прозрачное стекло» сохраняет необычный образ золота, подобного стеклу.
theological_decisions:
- issue: Образ городской πλατεῖα
  choice: Единственное число передано как «улица города» без уточнения городской планировки.
  alternative: «широкая улица города» или «площадь города»
  rationale: Это лексическая неоднозначность образа, а не основание для догматического уточнения. Основной текст остаётся естественным, а допустимые значения сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Именные конструкции с тире сохраняют выразительность греческого описания; повтор слова «ворота» помогает естественно передать распределительный акцент.
