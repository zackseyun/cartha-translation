id: REV.21.2
reference: Revelation 21:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τὴν πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καινὴν εἶδον καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ, ἡτοιμασμένην ὡς νύμφην κεκοσμημένην τῷ ἀνδρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/002.yaml
  text: And I saw the holy city[a], new Jerusalem, coming down out of heaven from God[c][b], prepared like a bride adorned for her husband.
translation:
  language: ru
  text: И увидел я святой город — новый Иерусалим, сходящий с неба от Бога, приготовленный, словно невеста, украшенная для своего мужа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόλιν
  choice: город
  rationale: Прямое значение πόλις; сохраняет конкретный образ города, существенный для видения.
- source_word: ἁγίαν
  choice: святой
  rationale: Обычный библейский эквивалент ἅγιος, естественный в устойчивом сочетании «святой город».
- source_word: Ἰερουσαλὴμ καινὴν
  choice: новый Иерусалим
  rationale: Имя передано традиционной русской формой, а καινός — прилагательным «новый»; строчная буква сохраняет его описательную функцию, не превращая сочетание в формальный титул.
- source_word: εἶδον
  choice: увидел я
  rationale: Точно передаёт аорист ὁράω; порядок слов поддерживает возвышенный повествовательный ритм, оставаясь естественным по-русски.
- source_word: καταβαίνουσαν
  choice: сходящий
  rationale: Естественно передаёт движение вниз и согласуется с образом города; «нисходящий» возможно, но звучит более архаично.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с неба
  rationale: Русское «сходить с неба» естественно выражает движение из небесной сферы; буквальное «из неба» здесь стилистически неестественно.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: от Бога
  rationale: Передаёт источник или происхождение без добавления отсутствующего в греческом слова «присутствие».
- source_word: ἡτοιμασμένην
  choice: приготовленный
  rationale: Причастие совершенного вида выражает достигнутое состояние, соответствуя перфектному пассивному причастию.
- source_word: ὡς
  choice: словно
  rationale: Ясно вводит сравнение и не отождествляет город с невестой на уровне грамматики данного стиха.
- source_word: νύμφην
  choice: невеста
  rationale: Сохраняет свадебный образ без превращения существительного в формальный титул.
- source_word: κεκοσμημένην
  choice: украшенная
  rationale: Точно и естественно передаёт свадебное убранство, обозначенное κοσμέω.
- source_word: τῷ ἀνδρὶ αὐτῆς
  choice: для своего мужа
  rationale: В свадебном контексте ἀνήρ естественно означает мужа; «жених» было бы более специальным словом, которого в греческом тексте нет.
theological_decisions:
- issue: Следует ли оформлять «Новый Иерусалим» как закреплённый эсхатологический титул
  choice: «новый Иерусалим» со строчной буквы у прилагательного
  alternative: «Новый Иерусалим»
  rationale: В греческом Ἰερουσαλήμ сопровождается описательным прилагательным καινήν. Русская прописная буква в прилагательном внесла бы дополнительное толкование как официального названия.
- issue: Следует ли прямо отождествлять свадебный образ с Церковью или невестой Агнца
  choice: Сохранено только выраженное в стихе сравнение города с невестой
  alternative: «приготовленный как Церковь, невеста Агнца»
  rationale: Сам стих формулирует сравнение через ὡς; поясняющее отождествление добавило бы богословскую интерпретацию сверх исходной формулировки.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным ритмом. Тире оформляет приложение «новый Иерусалим» и делает длинную фразу прозрачной. Причастные обороты сохраняют структуру греческого описания без тяжеловесности.
