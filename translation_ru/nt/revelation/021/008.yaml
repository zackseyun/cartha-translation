id: REV.21.8
reference: Revelation 21:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τοῖς δὲ δειλοῖς καὶ ⸀ἀπίστοις καὶ ἐβδελυγμένοις καὶ φονεῦσι καὶ πόρνοις καὶ φαρμάκοις καὶ εἰδωλολάτραις καὶ πᾶσι τοῖς ψευδέσιν τὸ μέρος αὐτῶν ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ, ὅ ἐστιν ὁ θάνατος ὁ δεύτερος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/008.yaml
  text: But for the cowardly and unbelieving and detestable and murderers and sexually immoral and sorcerers and idolaters and all liars[a], their portion will be in the lake burning with fire and sulfur[c][b], which is the second death.
translation:
  language: ru
  text: А участь малодушных, неверующих[a], мерзких, убийц, развратников, чародеев, идолопоклонников и всех лжецов — в озере, горящем огнём и серой. Это вторая смерть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неверных».'
    reason: alternative_reading
lexical_decisions:
- source_word: δειλοῖς
  choice: малодушным
  rationale: Передаёт нравственно предосудительную трусость, а не обычное чувство страха; естественно звучит в современном литературном русском.
- source_word: ἀπίστοις
  choice: неверующим
  rationale: В данном перечне осуждённых наиболее прямо обозначает тех, кто не верит; возможное значение неверности сохранено в сноске.
- source_word: ἐβδελυγμένοις
  choice: осквернённым
  rationale: Форма указывает на людей, ставших мерзкими или осквернёнными; «осквернённым» сохраняет оттенок нечистоты и не вынуждает толковать причастие как обозначение конкретных поступков.
- source_word: φονεῦσι
  choice: убийцам
  rationale: Точно обозначает виновных в убийстве, а не всякого, кто причинил смерть.
- source_word: πόρνοις
  choice: развратникам
  rationale: Краткое и понятное обозначение людей, практикующих половую безнравственность; соответствует форме перечня лиц.
- source_word: φαρμάκοις
  choice: чародеям
  rationale: В контексте Откровения слово обозначает занимающихся магией или колдовством, а не аптекарей или просто отравителей.
- source_word: εἰδωλολάτραις
  choice: идолопоклонникам
  rationale: Прямо и естественно передаёт поклонение идолам.
- source_word: πᾶσι τοῖς ψευδέσιν
  choice: всем лжецам
  rationale: Субстантивированное прилагательное в перечне пороков естественно означает лжецов.
- source_word: τὸ μέρος αὐτῶν
  choice: участь
  rationale: Передаёт назначенную долю или конечную судьбу; эллиптическое русское предложение сохраняет лаконизм греческой безглагольной конструкции.
- source_word: ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ
  choice: в озере, горящем огнём и серой
  rationale: Сохраняет определительную причастную конструкцию и конкретный образ серы без архаизации.
- source_word: ὅ ἐστιν ὁ θάνατος ὁ δεύτερος
  choice: это вторая смерть
  rationale: Естественно по-русски отождествляет описанную участь в озере со второй смертью, не добавляя толкования.
theological_decisions:
- issue: Значение ἄπιστος в перечне осуждённых
  choice: неверующим
  alternative: неверным, не заслуживающим доверия
  rationale: Контекст суда и противопоставление наследующим новое творение благоприятствуют значению отсутствия веры, однако слово допускает значение неверности; неоднозначность отмечена в сноске.
- issue: Образ огня и серы
  choice: серой
  alternative: архаическое «жупелом»
  rationale: Греческое θεῖον буквально обозначает серу; современное слово сохраняет исходный образ и не зависит от традиционной архаической формулы.
- issue: Характеристика ἐβδελυγμένοις
  choice: осквернённым
  alternative: мерзким; творящим мерзости
  rationale: Причастная форма допускает характеристику людей как ставших отвратительными или осквернёнными. Выбранный вариант сохраняет пассивно-результативный оттенок и не превращает его без необходимости в описание действий.
translation_notes:
  register: Современный литературный русский с торжественной библейской интонацией. Повторяющийся греческий союз καί передан перечислительной конструкцией без многократного «и», чтобы избежать тяжеловесности. Тире подчёркивает итог перечня, не добавляя нового смыслового отношения.
