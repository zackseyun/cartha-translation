review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: δειλοῖς — «малодушные», ἀπίστοις — «неверующие», φονεῦσι — «убийцы», φαρμάκοις — «чародеи», εἰδωλολάτραις — «идолопоклонники», а образ озера, горящего огнём и серой, сохранён. Однако «осквернённым» сужает ἐβδελυγμένοις до ритуальной или нравственной нечистоты; слово характеризует тех, кто отвратителен/мерзок. Перестройка фразы с «участь малодушных...» яснее выражает τὸ μέρος αὐτῶν и устраняет не вполне естественную русскую конструкцию с дательным падежом и безличным «участь».'
  naturalness: Исправленный вариант сохраняет современный литературный и торжественный регистр. Генитивная конструкция «участь ... — в озере» естественна, ясно связывает участь со всем перечнем и не добавляет временного значения. Два предложения в конце позволяют однозначно и естественно передать пояснительное ὅ ἐστιν.
  terminology: «Мерзких» точнее передаёт оценочную силу ἐβδελυγμένοις, не навязывая конкретного ритуального понимания. «Развратников» остаётся допустимой современной передачей πόρνοις; «чародеев», «идолопоклонников» и «серой» сохраняются. Сноска к «неверующим» должна ограничиваться релевантной альтернативой «неверным», а не вводить вторичное значение «не заслуживающим доверия», которое здесь не является предпочтительным контекстуальным чтением.
  issues:
  - severity: medium
    issue: «Осквернённым» для ἐβδελυγμένοις
    rationale: Этот вариант преимущественно вызывает представление о скверне или дефилементе, тогда как греческое совершенное страдательное причастие характеризует людей как ставших отвратительными, мерзкими. «Мерзких» лучше сохраняет семантическую оценку без сужения.
  - severity: low
    issue: Синтаксис «А малодушным ... — участь ...»
    rationale: Конструкция понятна, но эллиптическое сочетание дательного перечня с «участь» звучит менее естественно и не выражает явно принадлежность участи перечисленным лицам. «А участь малодушных...» передаёт τὸ μέρος αὐτῶν непосредственно.
  - severity: low
    issue: Сноска расширяет альтернативу до «не заслуживающих доверия»
    rationale: Хотя ἄπιστος в иных контекстах может иметь оттенок ненадёжности, в данном перечне релевантная альтернатива — «неверным» / «неверующим». Дополнительное значение может отвлечь от контекстуального выбора.
  revised_text: А участь малодушных, неверующих[a], мерзких, убийц, развратников, чародеев, идолопоклонников и всех лжецов — в озере, горящем огнём и серой. Это вторая смерть.
