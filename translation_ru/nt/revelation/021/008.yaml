revisions:
- from: А малодушным, неверующим[a], осквернённым, убийцам, развратникам, чародеям, идолопоклонникам и всем лжецам — участь в озере, горящем огнём и серой, — это вторая смерть.
  to: А участь малодушных, неверующих[a], мерзких, убийц, развратников, чародеев, идолопоклонников и всех лжецов — в озере, горящем огнём и серой. Это вторая смерть.
  rationale: Исправление уточняет передачу ἐβδελυγμένοις и делает русскую синтаксическую связь с «участью» ясной и естественной. Образ и значение второй смерти сохранены без конфессионального истолкования; альтернативное значение ἀπίστοις отмечено краткой, контекстуально уместной сноской.
