lexical_decisions:
- source_word: πυλῶνες
  choice: ворота
  rationale: В описании города слово обозначает городские ворота или воротные сооружения; «ворота» естественно и точно передаёт образ.
- source_word: οὐ μὴ κλεισθῶσιν
  choice: не будут запираться
  rationale: Конструкция οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание в будущем. В сочетании с отсутствием ночи русский контекст ясно передаёт, что ворота никогда не закроют; усиление отмечено в сноске.
- source_word: ἡμέρας
  choice: днём
  rationale: Родительный падеж употреблён наречно во временном значении; краткое «днём» сохраняет противопоставление ночи.
- source_word: νὺξ γὰρ οὐκ ἔσται ἐκεῖ
  choice: потому что ночи там не будет
  rationale: «Потому что» явно передаёт объяснительную функцию γάρ, а «ночи там не будет» естественно сохраняет экзистенциальный смысл ἔσται.
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз связывает стих с предшествующим описанием города.
- source_word: αὐτῆς
  choice: его
  rationale: Местоимение относится к городу; в русском «город» мужского рода, поэтому естественное согласование — «его», без дополнительной персонификации.
theological_decisions:
- issue: Степень олицетворения Нового Иерусалима
  choice: «ворота его» с согласованием по русскому слову «город»
  alternative: «ворота её» с подразумеваемым словом «столица» или усиленным олицетворением
  rationale: Женский род греческого αὐτῆς обусловлен родом слова πόλις. Русская грамматика требует согласования с «городом»; богословская мысль стиха — постоянная открытость города и отсутствие ночи — от этого не меняется.
- issue: Сила отрицания οὐ μή
  choice: Основной текст передаёт утверждение естественной русской конструкцией, а его эмфатический характер раскрыт в сноске
  alternative: «ни в коем случае не будут запираться» или «никогда не будут запираться»
  rationale: Буквальное усиление рядом с «днём» может звучать тяжеловесно или создавать ложное временное ограничение. Сноска сохраняет грамматическую силу исходного текста, не сглаживая её.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и торжественный без архаизмов. «Запираться» естественно описывает обычное состояние городских ворот, а объяснительный союз сохраняет связь, выраженную γάρ.
