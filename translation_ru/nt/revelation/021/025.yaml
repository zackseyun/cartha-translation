translation:
  language: ru
  text: И ворота его днём никогда не будут закрываться[a], потому что ночи там не будет.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте употреблено усиленное отрицание; буквально: «ворота его днём ни в коем случае не будут закрыты».'
    reason: lexical_alternative
