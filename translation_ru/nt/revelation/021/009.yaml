id: REV.21.9
reference: Revelation 21:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, ⸂τῶν γεμόντων⸃ τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὴν ⸂νύμφην τὴν γυναῖκα⸃ τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/009.yaml
  text: Then one of the seven angels who had the seven bowls full of the seven last plagues came and spoke with me[a], saying, “Come, I will show you the bride[b], the wife of the Lamb.”
translation:
  language: ru
  text: 'И пришёл один из семи ангелов, у которых были семь чаш, наполненных семью последними язвами[a], и заговорил со мной: «Иди сюда, я покажу тебе невесту, жену Агнца».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семью последними бедствиями».'
    reason: Лексическая альтернатива для πληγαί; в основном тексте сохранено более точное и терминологически последовательное «язвы».
lexical_decisions:
- source_word: Καὶ ἦλθεν
  choice: И пришёл
  rationale: Союз сохраняет связь и последовательность повествования; аорист ἦλθεν естественно передаётся совершенным видом «пришёл».
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: один из семи ангелов
  rationale: Естественная русская передача партитивной конструкции ἐκ с родительным падежом.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: у которых были семь чаш
  rationale: Оборот обозначает ангелов по принадлежавшим им чашам; «чаши» точно и понятно передаёт широкие неглубокие сосуды φιάλαι, не создавая образа современных флаконов.
- source_word: τῶν γεμόντων τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων
  choice: наполненных семью последними бедствиями
  rationale: γεμόντων обозначает наполненность чаш; πληγαί в данном апокалиптическом контексте — поражающие бедствия, а ἐσχάτων указывает на их заключительное место в последовательности.
- source_word: ἐλάλησεν μετ’ ἐμοῦ
  choice: заговорил со мной
  rationale: «Со мной» сохраняет значение μετά с родительным; «заговорил» естественно вводит последующую прямую речь, не превращая выражение без необходимости в «сказал мне».
- source_word: λέγων
  choice: двоеточие перед прямой речью
  rationale: Русская синтаксическая конструкция с прямой речью естественно передаёт функцию причастия λέγων без тяжеловесного «говоря».
- source_word: Δεῦρο
  choice: Подойди
  rationale: Повеление приглашает Иоанна приблизиться к ангелу; «подойди» в этом контексте естественнее буквального «иди сюда».
- source_word: δείξω σοι
  choice: я покажу тебе
  rationale: Прямая передача будущего времени и местоименного дополнения.
- source_word: τὴν νύμφην τὴν γυναῖκα τοῦ ἀρνίου
  choice: невесту, жену Агнца
  rationale: 'Сохранены оба стоящих в приложении существительных: νύμφη как «невеста» и γυνή в брачном контексте как «жена»; ἀρνίον передано традиционным и понятным титулом «Агнец».'
theological_decisions:
- issue: Соотношение νύμφην и γυναῖκα
  choice: невесту, жену Агнца
  alternative: невесту — супругу Агнца; невесту Агнца
  rationale: Греческий текст явно сохраняет два брачных обозначения в приложении. Передача обоих не сглаживает напряжение между образами невесты и уже названной жены.
- issue: Христологический титул ἀρνίον
  choice: Агнец
  alternative: Ягнёнок
  rationale: «Агнец» — укоренившаяся в современном русском библейском употреблении форма титула Христа; она сохраняет титульный характер слова, не добавляя в стих богословского толкования.
- issue: Образ семи последних πληγαί
  choice: бедствия
  alternative: язвы; поражения
  rationale: «Бедствия» передаёт разрушительные суды в контексте Откровения и остаётся понятным современному читателю; вариант «язвы» отмечен как традиционная библейская передача, поскольку он может восприниматься уже и телеснее, чем греческое слово.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Синтаксис сделан плавным, но повтор «семь» сохранён как характерная для Откровения композиционная деталь. Архаичное «се» и канцелярское «имевших» не использованы.
