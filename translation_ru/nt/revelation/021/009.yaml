    rationale: В Откровении πληγαί — термин для серии карающих поражений; «язвы» точно передаёт слово и его внутрикнижную терминологическую связь. «Бедствия» можно оставить как альтернативу в сноске.
  - severity: medium
    issue: Неточная формулировка сноски b о глагольной форме
    rationale: 'В SBLGNT стоит ἐλάλησεν, аорист («заговорил/сказал»), поэтому утверждение «буквально: говорил со мной» грамматически неточно. Сноску следует удалить либо исправить; она не требуется для понимания перевода.'
  - severity: low
    issue: «Подойди» несколько сужает Δεῦρο
    rationale: Δεῦρο означает приглашение «иди/подойди сюда»; «иди сюда» передаёт его без добавления конкретного пространственного оттенка.
