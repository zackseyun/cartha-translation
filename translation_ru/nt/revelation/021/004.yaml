id: REV.21.4
reference: Revelation 21:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐξαλείψει πᾶν δάκρυον ⸀ἐκ τῶν ὀφθαλμῶν αὐτῶν, καὶ ὁ θάνατος οὐκ ἔσται ἔτι· οὔτε πένθος οὔτε κραυγὴ οὔτε πόνος οὐκ ἔσται ⸀ἔτι. τὰ πρῶτα ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/004.yaml
  text: And he will wipe away every tear from their eyes[a], and death will be no more; neither mourning nor crying nor pain will be any more[c][b]. The former things have passed away.
translation:
  language: ru
  text: И отрёт Он всякую слезу с их глаз[a], и смерти больше не будет; ни скорби, ни вопля[b], ни боли больше не будет. Прежнее прошло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всякую слезу из их глаз». Единственное число имеет распределительный смысл — каждую слезу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «крика». Греческое слово может обозначать крик или громкий вопль.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαλείψει
  choice: отрёт
  rationale: Будущее время глагола ἐξαλείφω. В сочетании со слезой естественное и образное русское соответствие — «отрёт»; оно сохраняет личный характер действия.
- source_word: πᾶν δάκρυον
  choice: всякую слезу
  rationale: 'Единственное число с πᾶν имеет распределительное значение: речь идёт о каждой слезе. «Всякую слезу» точно и торжественно передаёт этот оттенок.'
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: с их глаз
  rationale: В контексте удаления слёз русское «с их глаз» идиоматичнее буквального «из их глаз» и точно передаёт исходную конструкцию.
- source_word: ὁ θάνατος
  choice: смерти
  rationale: Конструкция «смерти больше не будет» естественно передаёт полное упразднение смерти, выраженное греческим текстом.
- source_word: οὐκ ἔσται ἔτι
  choice: больше не будет
  rationale: Передаёт категорическое и окончательное прекращение; повтор сохранён и во второй части стиха.
- source_word: πένθος
  choice: скорби
  rationale: πένθος обозначает скорбь и траур. «Скорбь» здесь естественно охватывает переживание утраты и сочетается с воплем и болью.
- source_word: κραυγή
  choice: вопля
  rationale: κραυγή может означать громкий крик или вопль. «Вопль» сохраняет интенсивность слова и подходит к контексту страдания.
- source_word: πόνος
  choice: боли
  rationale: В данном перечне упразднённых страданий πόνος естественно означает боль, включая телесное и душевное страдание.
- source_word: τὰ πρῶτα
  choice: прежнее
  rationale: Субстантивированное среднее множественное указывает на прежний порядок вещей. Русское собирательное «прежнее» лаконично передаёт смысл без добавочного истолкования.
- source_word: ἀπῆλθαν
  choice: прошло
  rationale: Аорист указывает на состоявшийся уход прежнего. «Прошло» естественно и торжественно передаёт завершённость.
theological_decisions:
- issue: Подлежащее при «отрёт» подразумевается из Откр 21:3 и не повторено в греческом тексте стиха.
  choice: «И отрёт Он», без вставки имени «Бог».
  alternative: «И Бог отрёт».
  rationale: Заглавная форма местоимения ясно указывает на Бога в контексте, но не добавляет существительное, отсутствующее в данном стихе.
- issue: Полнота прекращения смерти и страдания в новом творении.
  choice: Категорические формулы «смерти больше не будет» и «больше не будет».
  alternative: «смерть перестанет существовать»; «уже не будет».
  rationale: Греческий текст утверждает окончательное прекращение без оговорок; перевод сохраняет эту эсхатологическую безусловность.
translation_notes:
  register: Современный литературный русский язык с достоинством и ритмом пророческого утешения. Синтаксический параллелизм оригинала сохранён; устаревшие «очи», «плач» в значении траура и тяжеловесное «не будет уже» не использованы.
