id: REV.21.19
reference: Revelation 21:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀οἱ θεμέλιοι τοῦ τείχους τῆς πόλεως παντὶ λίθῳ τιμίῳ κεκοσμημένοι· ὁ θεμέλιος ὁ πρῶτος ἴασπις, ὁ δεύτερος σάπφιρος, ὁ τρίτος χαλκηδών, ὁ τέταρτος σμάραγδος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/019.yaml
  text: 'The foundations of the wall of the city were adorned with every kind of precious stone: the first foundation was jasper[a], the second sapphire, the third chalcedony, the fourth emerald[b],'
translation:
  language: ru
  text: 'Основания городской стены были украшены всевозможными драгоценными камнями[a]: первое основание — яспис, второе — сапфир, третье — халкидон[b], четвёртое — изумруд.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всяким драгоценным камнем». Греческое выражение допускает такое буквальное прочтение; здесь оно понято распределительно: «всевозможными драгоценными камнями».'
    reason: lexical_alternative
  - marker: b
    text: «Халкидон» — традиционная передача греческого названия; точная идентификация некоторых древних драгоценных камней остаётся неопределённой.
    reason: cultural_note
lexical_decisions:
- source_word: θεμέλιοι
  choice: основания
  rationale: Форма множественного числа обозначает основания или ряды камней в основании городской стены; «основания» естественно по-русски и не добавляет слова «камни», которого здесь нет в греческом тексте.
- source_word: τεῖχος
  choice: стена
  rationale: Обычное значение слова в данном описании; более развёрнутое «крепостная стена» было бы излишне конкретным.
- source_word: πόλεως
  choice: городской
  rationale: Родительное сочетание τοῦ τείχους τῆς πόλεως естественно передано как «городская стена».
- source_word: παντὶ λίθῳ τιμίῳ
  choice: всевозможными драгоценными камнями
  rationale: Передаёт вероятный распределительный смысл παντί и значение дательного средства при κεκοσμημένοι; буквальная возможность «всяким драгоценным камнем» отмечена в сноске.
- source_word: κεκοσμημένοι
  choice: были украшены
  rationale: Передаёт совершенный страдательный оттенок причастия и сохраняет возвышенный, но понятный современный стиль.
- source_word: ὁ θεμέλιος ὁ πρῶτος
  choice: первое основание
  rationale: Сохраняет последовательное перечисление отдельных оснований без добавления подразумеваемого слова «камень».
- source_word: ἴασπις
  choice: яспис
  rationale: Традиционное русское библейское наименование древнего драгоценного камня; его точное соответствие современной минералогии не вполне определённо.
- source_word: σάπφιρος
  choice: сапфир
  rationale: Устоявшийся русский эквивалент названия камня.
- source_word: χαλκηδών
  choice: халкидон
  rationale: Традиционная передача греческого названия через транслитерацию; точная идентификация древнего минерала остаётся неопределённой.
- source_word: σμάραγδος
  choice: изумруд
  rationale: Устоявшийся и наиболее вероятный русский эквивалент древнего названия камня.
theological_decisions:
- issue: Передача перечня камней в апокалиптическом описании
  choice: Названия камней переведены прямо, без символического толкования в основном тексте.
  alternative: Истолковать отдельные камни как символы колен Израиля, апостолов или облачения первосвященника.
  rationale: Сам стих перечисляет украшения, но не разъясняет их символику; перевод не должен вносить отсутствующую в исходном тексте богословскую схему.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апокалиптического описания. Синтаксис сделан естественным для русского: «городская стена» вместо буквального «стена города». Двоеточие и тире ясно оформляют торжественное перечисление.'
