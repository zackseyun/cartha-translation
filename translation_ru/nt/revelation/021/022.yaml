id: REV.21.22
reference: Revelation 21:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ναὸν οὐκ εἶδον ἐν αὐτῇ, ὁ γὰρ κύριος, ὁ θεός, ὁ παντοκράτωρ, ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/022.yaml
  text: And I saw no temple in it[a], for the Lord God, the Almighty[b], is its temple, and the Lamb.
translation:
  language: ru
  text: Храма[a] я в нём[b] не увидел, потому что его храм — Господь Бог Вседержитель и Агнец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святилища». Греческое ναός может обозначать собственно внутреннее святилище храма.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по-гречески: «в ней», поскольку слово «город» (πόλις) в греческом языке женского рода; русское местоимение согласовано со словом «город».'
    reason: grammar_note
lexical_decisions:
- source_word: ναὸν / ναὸς
  choice: храм
  rationale: «Храм» естественно и ясно передаёт ναός в данном контексте и сохраняет противопоставление между отсутствием рукотворного храма и тем, что храмом города являются Сам Бог и Агнец. Более узкое «святилище» отмечено в сноске.
- source_word: οὐκ εἶδον
  choice: я не увидел
  rationale: Прямо передаёт отрицание и аорист εἶδον; вынесение «храма» в начало сохраняет смысловой акцент на его отсутствии.
- source_word: ἐν αὐτῇ
  choice: в нём
  rationale: Местоимение относится к городу. В русском языке оно естественно согласуется с существительным «город» в мужском роде, хотя греческое πόλις — женского рода.
- source_word: κύριος, ὁ θεός
  choice: Господь Бог
  rationale: Устоявшаяся и прямая передача составного божественного наименования.
- source_word: παντοκράτωρ
  choice: Вседержитель
  rationale: Традиционный, точный и литературно естественный русский эквивалент, выражающий всеобъемлющее владычество и могущество Бога.
- source_word: ναὸς αὐτῆς
  choice: его храм
  rationale: Местоимение относится к городу; русский мужской род обусловлен словом «город». Порядок слов делает «храм» именной частью конструкции и позволяет естественно назвать Бога и Агнца вместе.
- source_word: καὶ τὸ ἀρνίον
  choice: и Агнец
  rationale: Сохраняет простое соединение посредством καί, не ослабляя и не разъясняя сверх текста соотнесённость Агнца с Господом Богом как храмом города.
theological_decisions:
- issue: Связь выражения «ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον» с Господом Богом и Агнцем
  choice: «его храм — Господь Бог Вседержитель и Агнец»
  alternative: «Господь Бог Вседержитель — его храм, и Агнец»
  rationale: Русская именная конструкция естественно включает и Господа Бога, и Агнца в обозначение единственного храма города, сохраняя единственное число «храм» и соединительную силу καί. При этом перевод не вводит позднейшей догматической формулы и не поясняет природу этого единства сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью библейского повествования. Инверсия «Храма я… не увидел» подчёркивает отсутствие храма, не звуча архаично. «Вседержитель» сохранён как общепонятный традиционный библейский титул.
