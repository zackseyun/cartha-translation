  source_fidelity: «И принесут в него славу и честь народов» точно передаёт будущее действие οἴσουσιν, оба объекта («славу и честь») и принадлежность/связь с народами. «В него» уместно соотносит αὐτήν с городом — Новым Иерусалимом — без искусственной русской феминизации.
  naturalness: Фраза звучит естественно для современного литературного русского и сохраняет краткий торжественный синтаксис Откровения. Начальное «И» оправданно поддерживает связь с предыдущим описанием.
  terminology: «Слава», «честь», «народы» — точные и традиционно узнаваемые, но не архаизирующие соответствия δόξα, τιμή и ἔθνη. Формулировка не сужает образ до богатств, дани или культурных достижений.
