  yaml_path: translation/nt/revelation/021/026.yaml
  text: and they will bring the glory and the honor of the nations into it[a].
translation:
  language: ru
  text: И принесут в него славу и честь народов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в неё» — если сохранять женскую персонификацию города в греческом тексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴσουσιν
  choice: принесут
  rationale: Будущее время действительного залога от φέρω; «принесут» естественно передаёт направленное движение внутрь города.
- source_word: δόξαν
  choice: славу
  rationale: «Слава» сохраняет широкий смысл δόξα, включая величие, блеск и почёт, а также его библейское звучание.
- source_word: τιμὴν
  choice: честь
  rationale: «Честь» естественно сочетается со «славой» и не сужает значение до материальных богатств или дани.
- source_word: τῶν ἐθνῶν
  choice: народов
  rationale: В данном видении ἔθνη обозначает народы мира; вариант «язычников» неоправданно выдвинул бы на первый план противопоставление иудеев и неиудеев.
- source_word: εἰς αὐτήν
  choice: в него
  rationale: Местоимение относится к городу, то есть Новому Иерусалиму. В русском литературном употреблении «город» мужского рода, поэтому естественно «в него»; греческий женский род и возможная персонификация отмечены в сноске.
- source_word: καὶ
  choice: И
  rationale: Союз связывает стих с предыдущим контекстом; внутри пары однородных существительных русское «и» также передаёт второе καί.
theological_decisions:
- issue: Референт и персонификация αὐτήν
  choice: Местоимение отнесено к Новому Иерусалиму как городу и передано «в него».
  alternative: «в неё», если сохранять женскую персонификацию города как невесты
  rationale: В греческом αὐτήν согласуется с πόλις, существительным женского рода, и может поддерживать образ города-невесты. Однако в русском непосредственный референт «город» требует мужского рода; значимый образный оттенок сохранён в сноске.
- issue: Смысл выражения «слава и честь народов»
  choice: Формулировка оставлена семантически широкой.
  alternative: богатства народов; культурное великолепие народов; честь, воздаваемая народами
  rationale: Контекст не требует однозначно понимать выражение как материальную дань, культурные достижения или действие почитания. Буквально-естественная передача сохраняет образ и богословскую открытость текста.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Начальное «И» сохранено как связка с предыдущим стихом. Выражение «слава и честь народов» намеренно не истолковано более узко.
