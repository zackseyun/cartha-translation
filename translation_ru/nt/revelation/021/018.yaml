source:
  edition: SBLGNT
  text: ⸀καὶ ἡ ἐνδώμησις τοῦ τείχους αὐτῆς ἴασπις, καὶ ἡ πόλις χρυσίον καθαρὸν ὅμοιον ὑάλῳ καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/018.yaml
  text: And the material of its wall was jasper[a], and the city was pure gold[b], like pure glass.
translation:
  language: ru
  text: Стена города была сложена из ясписа[a], а сам город — из чистого золота, подобного прозрачному стеклу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кладка стены города была из ясписа». Греческое ἐνδώμησις может обозначать сооружение или кладку стены, а также материал, из которого она сложена.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чистому стеклу». Выражение может подчёркивать чистоту, ясность или сияющую прозрачность стекла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδώμησις
  choice: была сложена из
  rationale: Существительное может обозначать кладку, устройство сооружения или материал, из которого оно состоит. Русская конструкция «стена была сложена из» естественно передаёт вещественный смысл в данном контексте, где сказуемым служит название камня, не сводя значение лишь к процессу строительства.
- source_word: τεῖχος
  choice: стена
  rationale: Речь идёт о городской стене; «стена» — обычный и точный русский эквивалент.
- source_word: ἴασπις
  choice: яспис
  rationale: Сохранено традиционное название древнего драгоценного камня; его точное соответствие современному минералогическому яспису остаётся не вполне определённым.
- source_word: χρυσίον καθαρόν
  choice: чистое золото
  rationale: χρυσίον обозначает золото как материал, а καθαρόν — его чистоту; сочетание естественно передаётся как «чистое золото».
- source_word: ὅμοιον
  choice: подобного
  rationale: Слово вводит сравнение между чистым золотом и стеклом; согласование с «золотом» сохраняет структуру исходного текста.
- source_word: ὕαλῳ καθαρῷ
  choice: чистому стеклу
  rationale: Буквально сохранено повторение καθαρός («чистый»). В отношении стекла выражение может также указывать на прозрачность и ясность, что отмечено в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Местоимение «его» согласовано с русским словом «город», хотя в греческом αὐτῆς согласовано с существительным πόλις женского рода. Добавление «сам» естественно выделяет переход от стены к городу и не меняет смысла.
