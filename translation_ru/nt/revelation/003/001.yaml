id: REV.3.1
reference: Revelation 3:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Σάρδεσιν ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὰ ἑπτὰ πνεύματα τοῦ θεοῦ καὶ τοὺς ἑπτὰ ἀστέρας· Οἶδά σου τὰ ἔργα, ὅτι ὄνομα ἔχεις ὅτι ζῇς, καὶ νεκρὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/001.yaml
  text: 'And write to the angel of the church in Sardis: These things says the one who has the seven spirits of God and the seven stars: I know your works[a]; you have a name that you are alive[d][c][b], but you are dead.'
translation:
  language: ru
  text: 'И ангелу церкви в Сардах напиши: «Так говорит Тот, у Кого семь духов Божьих[a] и семь звёзд: Я знаю твои дела. Ты слывёшь живым[b], но ты мёртв».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семь духов Бога». Выражение может символически указывать на полноту Божьего Духа; другие понимают его как семь небесных духов.'
    reason: Сохраняет богословскую неоднозначность символа и отмечает более буквальную форму.
  - marker: b
    text: 'Буквально: «ты имеешь имя, что живёшь». То есть тебя считают живым, у тебя такая репутация.'
    reason: Поясняет идиоматический перевод греческого выражения ὄνομα ἔχεις, не придавая ὅτι оттенок сомнения.
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ангелу
  rationale: Основное значение слова и апокалиптический контекст Откровения поддерживают перевод «ангел»; возможное значение «вестник» не устраняет неопределённости референта.
- source_word: ἐκκλησίας
  choice: церкви
  rationale: Естественное и устоявшееся обозначение христианской общины в современном русском языке.
- source_word: Τάδε λέγει
  choice: Так говорит
  rationale: Естественная русская пророческая формула, сохраняющая торжественный характер греческого выражения без неуклюжего буквализма.
- source_word: ὁ ἔχων
  choice: Тот, у Кого
  rationale: Передаёт субстантивированное причастие естественной русской конструкцией и сохраняет идею обладания.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: семь духов Божьих
  rationale: Сохранено грамматическое множественное число греческого текста, чтобы не разрешать спорный символический смысл посредством перевода.
- source_word: τοὺς ἑπτὰ ἀστέρας
  choice: семь звёзд
  rationale: Прямой и ясный перевод без преждевременного истолкования символа.
- source_word: Οἶδά σου τὰ ἔργα
  choice: Я знаю твои дела
  rationale: Устоявшаяся, точная и понятная формулировка, сохраняющая повторяющуюся в Откровении лексику оценки.
- source_word: ὄνομα ἔχεις ὅτι ζῇς
  choice: Ты слывёшь живым
  rationale: Идиоматически передаёт наличие «имени», то есть репутации, что адресат жив; буквальная конструкция «имеешь имя, что жив» в современном русском неестественна.
- source_word: νεκρὸς εἶ
  choice: ты мёртв
  rationale: Прямой и резкий перевод, сохраняющий контраст с внешней репутацией живого.
theological_decisions:
- issue: Значение выражения «семь духов Божьих»
  choice: 'Сохранить во множественном числе: «семь духов Божьих».'
  alternative: «семикратный Дух Божий» или истолкование как семи небесных духов
  rationale: Греческий текст имеет форму множественного числа, а символ допускает разные толкования; перевод не должен заранее отождествлять его исключительно с полнотой Святого Духа либо с ангельскими существами.
- issue: Кого обозначает «ангел» церкви
  choice: Перевести ἀγγέλῳ как «ангелу», не уточняя его природу.
  alternative: «вестнику» или человеческому представителю церкви
  rationale: Апокалиптический контекст и обычное значение слова поддерживают «ангел», однако личность адресата остаётся предметом толкования.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным звучанием. Пророческая формула передана как «Так говорит», обращение оформлено прямой речью. «Божьих» выбрано как естественная современная форма; резкий итоговый контраст сохранён.
