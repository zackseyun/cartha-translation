  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: συμβουλεύω σοι ἀγοράσαι ⸂παρ’ ἐμοῦ χρυσίον⸃ πεπυρωμένον ἐκ πυρὸς ἵνα πλουτήσῃς, καὶ ἱμάτια λευκὰ ἵνα περιβάλῃ καὶ μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου, καὶ κολλούριον ⸀ἐγχρῖσαι τοὺς ὀφθαλμούς σου ἵνα βλέπῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/018.yaml
  text: I counsel you to buy from me gold refined by fire so that you may become rich[a], and white garments so that you may clothe yourself and the shame of your nakedness may not be exposed[c][b], and eye salve to anoint your eyes so that you may see.
translation:
  language: ru
  text: Советую тебе купить у Меня золото, очищенное огнём[a], чтобы стать богатым, и белые одежды[b], чтобы одеться в них и чтобы не стал явным позор твоей наготы, и глазную мазь[c], чтобы помазать глаза и чтобы видеть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очищенное в огне»; возможно также: «испытанное огнём».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «белые одеяния»; в некоторых контекстах — «белые ризы».'
    reason: lexical_alternative
  - marker: c
    text: Греческое слово обозначает лечебное средство, которое наносили на глаза.
    reason: cultural_note
lexical_decisions:
- source_word: συμβουλεύω
  choice: Советую
  rationale: Настоящее время, первое лицо единственного числа. «Советую» естественно передаёт весомое наставление, не превращая его в приказ.
- source_word: ἀγοράσαι παρ’ ἐμοῦ
  choice: купить у Меня
  rationale: Инфинитив ἀγοράσαι передан обычным глаголом «купить», а παρά с родительным — естественным русским оборотом «у Меня», обозначающим источник приобретения.
- source_word: χρυσίον
  choice: золото
  rationale: Общее обозначение драгоценного металла; уточнение формы золота в тексте отсутствует.
- source_word: πεπυρωμένον ἐκ πυρός
  choice: очищенное огнём
  rationale: Причастие совершенного вида в страдательном залоге описывает золото, прошедшее действие огня. «Очищенное огнём» сохраняет металлургический образ; возможны оттенки испытания и закалки, отмеченные в сноске.
- source_word: ἵνα πλουτήσῃς
  choice: чтобы стать богатым
  rationale: Аорист конъюнктива допускает оттенок вхождения в новое состояние; «стать богатым» передаёт его яснее, чем «быть богатым».
- source_word: ἱμάτια λευκά
  choice: белые одежды
  rationale: ἱμάτια — широкое обозначение предметов одежды. «Одежды» сохраняет возвышенный образ Откровения, не сужая значение до определённого вида одеяния.
- source_word: ἵνα περιβάλῃ
  choice: чтобы одеться
  rationale: Средний залог передаёт действие, направленное на самого адресата. Русское «одеться» естественно выражает это возвратное значение.
- source_word: μὴ φανερωθῇ
  choice: чтобы не обнаружился
  rationale: Страдательная форма означает, что позор не должен стать явным или видимым. «Не обнаружился» сохраняет этот смысл без лишнего пояснения.
- source_word: ἡ αἰσχύνη τῆς γυμνότητός σου
  choice: позор твоей наготы
  rationale: Буквально и естественно передаёт сочетание αἰσχύνη с родительным γυμνότητος; «позор» здесь указывает на постыдность открытой наготы.
- source_word: κολλούριον
  choice: мазь для глаз
  rationale: Речь о лечебном средстве, наносимом на глаза. Описательное русское выражение понятно современному читателю и не требует технического термина «коллирий».
- source_word: ἐγχρῖσαι τοὺς ὀφθαλμούς σου
  choice: чтобы помазать ею глаза
  rationale: Глагол обозначает нанесение вещества посредством помазывания или втирания. «Помазать ею глаза» сохраняет конкретный образ, не придавая действию сакраментального смысла.
- source_word: ἵνα βλέπῃς
  choice: и видеть
  rationale: Целевое ἵνα относится к восстановлению способности видеть. Однородный инфинитив после «чтобы» звучит по-русски естественно.
theological_decisions:
- issue: Символическое значение золота, белых одежд и мази для глаз
  choice: Сохранить все три образа без истолкования их духовных соответствий в основном тексте.
  alternative: Прямо назвать золото духовным богатством, одежды — праведностью или чистотой, а мазь — духовным прозрением.
  rationale: Греческий текст этого стиха использует образы, но не раскрывает каждый из них прямым толкованием. Перевод не должен заранее разрешать их богословское значение.
- issue: Возможные религиозные оттенки глагола ἐγχρῖσαι
  choice: Передать как «помазать», понимая слово в его конкретном смысле нанесения мази.
  alternative: 'Передать нейтральнее: «нанести на глаза» или «смазать глаза».'
  rationale: «Помазать» близко к способу действия, выраженному греческим глаголом, однако контекст мази для глаз ясно указывает на лечебный образ и не требует сакраментального истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией, соответствующей обращению в Откровении. Заглавная буква в «Меня» обозначает говорящего Христа согласно ближайшему контексту и русской издательской традиции, не добавляя нового содержания. Синтаксический ряд исходного текста сохранён, но сделан достаточно плавным для чтения вслух.
