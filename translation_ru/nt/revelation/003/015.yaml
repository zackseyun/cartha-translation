id: REV.3.15
reference: Revelation 3:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, ὅτι οὔτε ψυχρὸς εἶ οὔτε ζεστός. ὄφελον ψυχρὸς ἦς ἢ ζεστός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/015.yaml
  text: 'I know your works: you are neither cold nor hot[a]. I wish that you were cold or hot.'
translation:
  language: ru
  text: 'Знаю твои дела: ты ни холоден, ни горяч. О, если бы ты был холоден или горяч![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я хотел бы, чтобы ты был холоден или горяч».'
    reason: Лексико-синтаксический вариант передачи пожелания, выраженного словом ὄφελον.
lexical_decisions:
- source_word: Οἶδά
  choice: Знаю
  rationale: Глагол οἶδα имеет здесь значение настоящего времени и выражает устойчивое знание; «знаю» естественно передаёт прямой оценочный тон.
- source_word: τὰ ἔργα
  choice: твои дела
  rationale: «Дела» сохраняет обычную для Откровения формулу оценки и нравственную весомость выражения, не превращая его в пересказ «что ты делаешь».
- source_word: ψυχρὸς
  choice: холоден
  rationale: Сохранён буквальный образ температуры без истолкования его духовного смысла в самом переводе.
- source_word: ζεστός
  choice: горяч
  rationale: «Горяч» естественно противопоставляется слову «холоден» и сохраняет температурную метафору; более сильное «раскалён» или истолковывающее «ревностен» не требуется контекстом.
- source_word: ὄφελον
  choice: О, если бы
  rationale: Частица выражает сильное желание, не соответствующее нынешней действительности. Русская конструкция «О, если бы…» ясно и естественно передаёт этот оттенок.
- source_word: ἢ
  choice: или
  rationale: Простой разделительный союз точно передаёт греческое ἢ.
theological_decisions:
- issue: Значение образов «холоден» и «горяч»
  choice: В основном тексте сохранена буквальная температурная метафора без её расшифровки.
  alternative: Понимать «холоден» как духовно безразличен или неверующ, а «горяч» — как духовно ревностен; либо понимать оба состояния как по-разному полезные.
  rationale: Сам стих не объясняет символику температур. Буквальный перевод сохраняет намеренную образность и богословское напряжение, не навязывая одну из конкурирующих интерпретаций.
translation_notes:
  register: Современный литературный русский язык с краткими формами прилагательных, естественными для торжественной прямой речи. Формулировка лаконична и сохраняет повтор температурных терминов и резкую оценочную интонацию оригинала.
