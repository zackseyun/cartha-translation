id: REV.3.22
reference: Revelation 3:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/022.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: ru
  text: У кого есть ухо[a], пусть услышит, что Дух[b] говорит церквам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто имеет ухо, пусть услышит».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дух»; здесь имеется в виду Святой Дух.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: У кого есть
  rationale: Субстантивированное сочетание артикля с причастием обозначает всякого человека, обладающего названным признаком. Оборот «у кого есть» естественен в современном русском языке и сохраняет обобщённо-единственное значение.
- source_word: οὖς
  choice: ухо
  rationale: Сохранено единственное число греческого существительного и образный характер повторяющегося призыва.
- source_word: ἀκουσάτω
  choice: пусть услышит
  rationale: Аорист, действительный залог, повелительное наклонение, третье лицо единственного числа. Конструкция «пусть услышит» естественно передаёт призыв и не ослабляет его до совета.
- source_word: τί
  choice: что
  rationale: Местоимение вводит содержание речи; русское «что» точно и естественно передаёт эту функцию.
- source_word: τὸ πνεῦμα
  choice: Дух
  rationale: В повторяющемся обращении к церквам в Откровении речь идёт о Божьем Духе; прописная буква указывает на этот контекстуальный референт, не добавляя отдельного пояснения в основной текст.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время передано обычной русской формой настоящего времени; «говорит» непосредственно выражает речевое действие.
- source_word: ταῖς ἐκκλησίαις
  choice: церквам
  rationale: Дательный падеж обозначает адресатов речи. «Церкви» — устоявшееся и контекстуально точное обозначение общин, к которым обращены послания в Откровении 2–3.
theological_decisions:
- issue: Обобщённое единственное число в призыве
  choice: У кого есть ухо, пусть услышит
  alternative: Имеющий ухо да слышит; кто имеет ухо, пусть услышит
  rationale: Перевод сохраняет единственное число и обращённость к каждому человеку, но избегает ненужной архаизации. Он не заменяет исходную форму множественным числом.
- issue: Референт слова πνεῦμα
  choice: Дух
  alternative: дух
  rationale: Контекст повторяющейся формулы в Откровении указывает на Святого Духа. Прописная буква отражает эту идентификацию, тогда как само греческое написание не кодирует её регистром.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизмов. Формула «пусть услышит» сохраняет силу повеления, а «у кого есть ухо» — образность и единственное число оригинала.
