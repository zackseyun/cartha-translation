  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/013.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: ru
  text: У кого есть ухо, пусть услышит, что Дух говорит церквам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: У кого есть
  rationale: Субстантивированное причастие обозначает всякого человека, отвечающего условию. Эта формулировка естественна в современном русском и сохраняет обобщённый смысл.
- source_word: οὖς
  choice: ухо
  rationale: Сохраняется единственное число греческого текста и образ способности воспринимать обращённое слово.
- source_word: ἀκουσάτω
  choice: пусть услышит
  rationale: Передаёт повелительное наклонение третьего лица и сохраняет традиционный библейский глагол, включающий в данном призыве смысл внимательного восприятия.
- source_word: τί
  choice: что
  rationale: Естественно вводит содержание речи в русском языке.
- source_word: τὸ πνεῦμα
  choice: Дух
  rationale: В повторяющейся формуле Откровения определённое обозначение указывает на Святого Духа; прописная буква ясно передаёт этот вероятный референт.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время передано обычной русской формой без неоправданного усиления длительности действия.
- source_word: ταῖς ἐκκλησίαις
  choice: церквам
  rationale: Дательный падеж обозначает адресатов. «Церкви» — стандартный и контекстуально точный эквивалент для общин, к которым обращены послания Откровения.
theological_decisions:
- issue: Кого обозначает «Дух»
  choice: Святого Духа, говорящего церквам
  alternative: человеческий дух или безличный дух пророчества
  rationale: В повторяющемся призыве книги Откровение «Дух» естественнее всего относится к Святому Духу, обращающемуся к церквам через пророческое послание. Перевод не добавляет к этому конфессиональных уточнений.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным и легко понятным библейским звучанием. Синтаксис сохраняет единственное число и афористическую форму оригинала.
