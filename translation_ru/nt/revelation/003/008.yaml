id: REV.3.8
reference: Revelation 3:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα— ἰδοὺ δέδωκα ἐνώπιόν σου θύραν ἠνεῳγμένην, ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν— ὅτι μικρὰν ἔχεις δύναμιν, καὶ ἐτήρησάς μου τὸν λόγον, καὶ οὐκ ἠρνήσω τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/008.yaml
  text: I know your works. Look[a], I have set before you an open door, which no one is able to shut, because you have little strength, and you have kept my word, and have not denied my name.
translation:
  language: ru
  text: Я знаю твои дела. Вот, Я поставил перед тобой открытую дверь[a], которую никто не может закрыть, потому что у тебя мало силы, и ты сохранил Моё слово, и не отрёкся от Моего имени.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дверь, стоящую открытой». Греческое перфектное причастие указывает, что дверь была открыта.'
    reason: Передаёт возможный оттенок греческого ἠνεῳγμένην без представления разъясняющей формулировки как буквального перевода.
lexical_decisions:
- source_word: Οἶδά σου τὰ ἔργα
  choice: Я знаю твои дела
  rationale: οἶδα имеет форму перфекта, но значение настоящего времени; «дела» сохраняет конкретное множественное число и устойчивую формулу Откровения.
- source_word: ἰδοὺ
  choice: Вот
  rationale: Естественный для современного литературного русского указательный возглас, привлекающий внимание.
- source_word: δέδωκα ἐνώπιόν σου
  choice: Я поставил перед тобой
  rationale: В сочетании с образом двери δέδωκα естественно передаётся глаголом «поставил»; совершенный вид выражает совершённое действие с сохраняющимся результатом.
- source_word: θύραν ἠνεῳγμένην
  choice: открытую дверь
  rationale: Естественное русское выражение; значение греческого перфектного причастия — дверь была открыта и остаётся открытой — пояснено в сноске.
- source_word: ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν
  choice: которую никто не может закрыть
  rationale: Точно и естественно передаёт отрицание способности; местоименное возобновление αὐτήν по-русски не воспроизводится как избыточное.
- source_word: ὅτι μικρὰν ἔχεις δύναμιν
  choice: потому что у тебя мало силы
  rationale: ὅτι понято причинно, а δύναμις передано как «сила», без сужения смысла до власти или политического могущества.
- source_word: καὶ ἐτήρησάς μου τὸν λόγον
  choice: но ты сохранил Моё слово
  rationale: τηρέω передано широким «сохранил», допускающим верность и соблюдение; союз «но» естественно выражает контраст между малой силой и верностью, который в греческом обозначен последовательным καί.
- source_word: καὶ οὐκ ἠρνήσω τὸ ὄνομά μου
  choice: и не отрёкся от Моего имени
  rationale: Русская конструкция «отречься от имени» естественно передаёт отказ от исповедания и верности, не устраняя образ имени.
theological_decisions:
- issue: Смысл образа открытой двери
  choice: Образ сохранён без истолкования.
  alternative: Миссионерская возможность; доступ к спасению или Царству; иная дарованная возможность.
  rationale: Сам стих не разъясняет метафору, поэтому перевод не должен выбирать одну богословскую интерпретацию.
- issue: Связь малой силы с последующими утверждениями
  choice: «потому что у тебя мало силы, но ты сохранил…»
  alternative: 'Последовательное «и»: «потому что у тебя мало силы, и ты сохранил…»'
  rationale: 'Русское «но» делает явным естественный контраст, заложенный в последовательности: несмотря на ограниченные силы, община осталась верна. Причинное ὅτι при этом не переопределяется догматически.'
- issue: Временной и результативный оттенок греческих форм
  choice: 'Русские формы совершенного вида: «поставил», «сохранил», «не отрёкся».'
  alternative: 'Формы с подчёркнутым наличным результатом: «держу открытой», «сохранил доныне».'
  rationale: Русский совершенный вид естественно передаёт завершённость; продолжающееся состояние открытой двери выражено прилагательным и контекстом, без искусственной кальки английского present perfect.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Местоимения, относящиеся к Христу, написаны с прописной буквы согласно распространённой русской издательской традиции; обращение к общине сохранено в единственном числе.
