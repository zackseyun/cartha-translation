  verdict: revise
  source_fidelity: Драфт в целом точно передаёт повеления γίνου γρηγορῶν и στήρισον, неопределённый референт τὰ λοιπά, а также образ завершённости в πεπληρωμένα. Однако «было близко к смерти» несколько ослабляет μέλλω с инфинитивом, выражающее близость/ожидание наступления смерти.
  naturalness: Фраза понятна и литературна, но сочетание «то, что ещё остаётся и было близко к смерти» слегка шероховато из-за смены настоящего времени на прошедшее и недостаточно ясно оформленного относительного определения. «То, что ещё осталось и было готово умереть» естественнее и компактнее.
  terminology: «Пробудись», «укрепи», «дела завершёнными» и «перед Моим Богом» приемлемы. «Готово было умереть» точнее передаёт ἔμελλον ἀποθανεῖν, не конкретизируя, что именно составляет «оставшееся».
