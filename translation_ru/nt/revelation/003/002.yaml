source:
  edition: SBLGNT
  text: γίνου γρηγορῶν, καὶ στήρισον τὰ λοιπὰ ἃ ⸂ἔμελλον ἀποθανεῖν⸃, οὐ γὰρ εὕρηκά σου ⸀τὰ ἔργα πεπληρωμένα ἐνώπιον τοῦ θεοῦ μου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/002.yaml
  text: Wake up, and strengthen what remains, which was about to die, for I have not found your works completed in the sight of my God.
translation:
  language: ru
  text: Пробудись и укрепи то, что ещё осталось и было готово умереть, потому что Я не нашёл твоих дел завершёнными перед Моим Богом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνου γρηγορῶν
  choice: Пробудись
  rationale: Буквально выражение призывает стать бодрствующим; в контексте духовного оцепенения Сардиса естественное русское «Пробудись» точно передаёт повелительный смысл и согласуется с консультационным английским текстом.
- source_word: στήρισον
  choice: укрепи
  rationale: Передаёт значение утверждения, поддержания и придания силы тому, что ещё сохранилось.
- source_word: τὰ λοιπά
  choice: то, что ещё остаётся
  rationale: Сохраняет обобщённость среднего рода во множественном числе и не уточняет без достаточного основания, идёт ли речь о людях, делах или иных остатках общинной жизни.
- source_word: ἔμελλον ἀποθανεῖν
  choice: было близко к смерти
  rationale: Передаёт перифрастическую конструкцию μέλλω с инфинитивом как непосредственную угрозу смерти, не утверждая, что смерть уже наступила.
- source_word: πεπληρωμένα
  choice: завершёнными
  rationale: Перфектное страдательное причастие от πληρόω здесь указывает на дела, не доведённые до полноты или завершения; «завершёнными» сохраняет связь с английским audited layer и не добавляет нравственной оценки вроде «совершенными».
- source_word: ἐνώπιον τοῦ θεοῦ μου
  choice: перед Моим Богом
  rationale: Естественный и точный русский эквивалент выражения «в присутствии/пред лицом Моего Бога».
theological_decisions:
- issue: Референт выражения τὰ λοιπά
  choice: Сохранено неопределённое «то, что ещё остаётся»
  alternative: «оставшихся» или «остальных людей»
  rationale: Греческая форма среднего рода не требует личного референта; конкретизация могла бы неоправданно сузить смысл.
- issue: Характер недостатка дел
  choice: «не нашёл твоих дел завершёнными»
  alternative: «не нашёл твоих дел совершенными» или «исполненными»
  rationale: Выбранная формулировка передаёт незавершённость/неполноту, не вводя отдельного учения о безгрешном совершенстве и не превращая фразу в оценку исполнения заповедей.
translation_notes:
  register: Современный литературный русский язык, прямой и торжественный без архаизмов. Заглавные буквы в местоимениях «Я» и «Моим» обозначают говорящего Христа согласно устойчивой русской библейской издательской практике.
