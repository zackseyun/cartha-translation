id: REV.3.21
reference: Revelation 3:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ νικῶν δώσω αὐτῷ καθίσαι μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου, ὡς κἀγὼ ἐνίκησα καὶ ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/021.yaml
  text: The one who conquers—I will grant him to sit with me on my throne[b][a], just as I also conquered and sat down with my Father on his throne.
translation:
  language: ru
  text: Побеждающему дам сесть со Мною на престоле Моём[a], как и Я победил и сел с Отцом Моим на престоле Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тому, кто одерживает победу». Глагол с тем же корнем повторяется далее: «Я победил». Единственное число имеет представительный смысл: обещание обращено ко всякому побеждающему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Побеждающему
  rationale: Субстантивированное причастие настоящего времени передано традиционной и естественной для русского библейского стиля формой; она обозначает всякого, кто побеждает, и сохраняет связь с повторным ἐνίκησα.
- source_word: δώσω αὐτῷ καθίσαι
  choice: дам сесть
  rationale: Конструкция δίδωμι с инфинитивом выражает предоставление возможности или права. Русское «дам сесть» близко к форме оригинала и естественно в данном контексте.
- source_word: μετ’ ἐμοῦ
  choice: со Мною
  rationale: Передаёт значение совместности у μετά с родительным падежом; форма соответствует достоинству и ритму речи Христа.
- source_word: ἐν τῷ θρόνῳ μου
  choice: на престоле Моём
  rationale: Хотя употреблён предлог ἐν, русский язык в контексте воцарения требует «на престоле».
- source_word: ὡς κἀγὼ
  choice: как и Я
  rationale: Сохраняет сравнительную силу ὡς и добавочное значение καί в κἀγώ.
- source_word: ἐνίκησα
  choice: победил
  rationale: Тот же корень, что и в «Побеждающему», сохраняет намеренный мотив победы.
- source_word: ἐκάθισα
  choice: сел
  rationale: Простой аорист указывает на совершившееся действие; «сел» точно и естественно передаёт образ воцарения.
- source_word: μετὰ τοῦ πατρός μου
  choice: с Отцом Моим
  rationale: Прямо передаёт совместность и сыновнее отношение, выраженное словами «Отец Мой».
- source_word: ἐν τῷ θρόνῳ αὐτοῦ
  choice: на престоле Его
  rationale: Русская идиома требует «на престоле»; местоимение сохраняет параллель с «на престоле Моём».
theological_decisions:
- issue: Представительное единственное число в обещании побеждающему
  choice: Сохранить единственное число в форме «Побеждающему»
  alternative: «Тем, кто побеждает» или «всякому побеждающему»
  rationale: Греческий текст употребляет субстантивированное причастие мужского рода единственного числа в представительном смысле. Русская дательная форма сохраняет число и не требует отдельного местоимения мужского рода.
- issue: Соотношение участия побеждающего в престоле Христа и пребывания Христа с Отцом на Его престоле
  choice: Передать параллель прямо, без поясняющего смягчения
  alternative: Добавить в текст толкование о символическом характере или природе этого участия
  rationale: Оригинал намеренно проводит сильную параллель, не объясняя её метафизически. Перевод сохраняет как обещание участия, так и различие между Христом и Отцом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Инверсия «на престоле Моём» и формы «со Мною», «Отцом Моим» поддерживают торжественный ритм, оставаясь понятными современному читателю. Заглавные буквы в местоимениях, относящихся к Христу и Отцу, применены как русская издательская конвенция, а не как добавочное толкование.
