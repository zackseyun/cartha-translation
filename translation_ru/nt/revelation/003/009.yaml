  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ, τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι, καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται— ἰδοὺ ποιήσω αὐτοὺς ἵνα ⸂ἥξουσιν καὶ προσκυνήσουσιν⸃ ἐνώπιον τῶν ποδῶν σου, καὶ γνῶσιν ὅτι ⸀ἐγὼ ἠγάπησά σε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/009.yaml
  text: Look[a], I am giving some from the synagogue of Satan—those who call themselves Jews and are not, but are lying—look, I will make them come and bow down before your feet[b], and they will know that I have loved you.
translation:
  language: ru
  text: Вот, Я даю некоторых из синагоги Сатаны[a] — тех, кто называет себя иудеями, но ими не являются, а лгут. Вот, Я сделаю так, что они придут и склонятся перед твоими ногами[b], и узнают, что Я возлюбил тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я даю из синагоги Сатаны». Вероятно, речь идёт о некоторых людях из этой группы; возможно также: «тех, кто из синагоги Сатаны».'
    reason: Лексическая и синтаксическая неоднозначность подразумеваемого дополнения при διδῶ ἐκ.
  - marker: b
    text: 'Или: «придут и поклонятся перед твоими ногами». Греческий глагол может означать как поклон, выражающий почтение или подчинение, так и поклонение.'
    reason: Сохранение смысловой широты προσκυνέω без утверждения, что верующим воздают божественное поклонение.
lexical_decisions:
- source_word: ἰδοὺ
  choice: Вот
  rationale: Современное и при этом торжественное указательное междометие, дважды сохраняющее призыв обратить внимание.
- source_word: διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ
  choice: Я даю некоторых из синагоги сатаны
  rationale: Настоящее время διδῶ сохранено; «некоторых» восполняет подразумеваемый объект и передаёт частичное значение ἐκ, не относя обещание непременно ко всей группе.
- source_word: συναγωγῆς τοῦ Σατανᾶ
  choice: синагоги сатаны
  rationale: Сохранены конкретное обозначение и резкий полемический генитив без смягчения или поясняющего расширения.
- source_word: τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι
  choice: тех, кто называет себя иудеями
  rationale: Естественно передана рефлексивная конструкция и заявляемая ими идентичность.
- source_word: καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται
  choice: но не является ими, а лжёт
  rationale: Единственное число согласовано с русским относительным «кто»; резкое противопоставление исходного текста сохранено.
- source_word: ποιήσω αὐτοὺς ἵνα ἥξουσιν
  choice: Я сделаю так, что они придут
  rationale: Передана каузативная сила ποιήσω и последующее действие без искусственной буквальности греческой конструкции.
- source_word: προσκυνήσουσιν ἐνώπιον τῶν ποδῶν σου
  choice: поклонятся у твоих ног
  rationale: «Поклонятся» сохраняет телесный жест почтения и смысловую неоднозначность προσκυνέω; «у твоих ног» естественно по-русски передаёт положение перед ногами адресата.
- source_word: γνῶσιν ὅτι ἐγὼ ἠγάπησά σε
  choice: узнают, что Я возлюбил тебя
  rationale: «Узнают» естественно выражает достижение знания; аорист ἠγάπησα передан совершенным видом без добавочного толкования.
theological_decisions:
- issue: Смысл слов о называющих себя иудеями, но не являющихся ими
  choice: Сохранить формулировку как полемическое суждение текста о заявленной идентичности, не уточняя её природу.
  alternative: Истолковать это прямо как этническое отрицание либо как полное переопределение слова «иудей» в исключительно духовном смысле.
  rationale: Сам стих не разъясняет основание суждения; перевод не должен переносить его на еврейский народ вообще или заранее разрешать богословскую напряжённость.
- issue: Значение προσκυνήσουσιν перед ногами верующего
  choice: Передать как «поклонятся у твоих ног», понимая выражение прежде всего как жест подчинения или признания, но отметить лексическую широту.
  alternative: «Будут поклоняться перед твоими ногами» в смысле религиозного поклонения.
  rationale: Глагол допускает и поклон как знак почтения, и религиозное поклонение. Контекст с ногами адресата благоприятствует жесту признания, однако неоднозначность отмечена в сноске.
- issue: Объём группы, обозначенной конструкцией διδῶ ἐκ
  choice: В основном тексте восполнить «некоторых», сохранив частичное значение «из».
  alternative: Понимать оборот как относящийся ко всем принадлежащим к названной синагоге.
  rationale: После «даю» в греческом нет явно выраженного дополнения, а ἐκ естественно указывает на людей из состава группы; восполнение необходимо для ясного русского синтаксиса, но вынесено в сноску как интерпретационное.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Заглавные «Я» относятся к говорящему Христу. «Иудеи» выбрано как устойчивое библейское обозначение идентичности; формулировка не расширяется до суждения о еврейском народе в целом. Повтор ἰδοὺ сохранён словом «Вот».
