  text: οὕτως, ὅτι χλιαρὸς εἶ καὶ ⸀οὔτε ζεστὸς οὔτε ψυχρός, μέλλω σε ἐμέσαι ἐκ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/016.yaml
  text: So[a], because you are lukewarm, and neither hot nor cold, I am about to vomit you out of my mouth.
translation:
  language: ru
  text: Итак, поскольку ты тепловатый — ни горячий, ни холодный, — Я вот-вот изрыгну тебя изо рта[a] Моего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол означает «извергнуть при рвоте»; это более сильный образ, чем «выплюнуть».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Итак
  rationale: Передаёт вывод из предшествующего высказывания естественным для современного русского языка связующим словом.
- source_word: ὅτι
  choice: поскольку
  rationale: 'Сохраняет причинное значение: состояние адресата названо основанием грядущего суда.'
- source_word: χλιαρός
  choice: тёплый
  rationale: Прямо передаёт температурный образ и естественно противопоставляется словам «горячий» и «холодный». Более буквальное «тепловатый» в данном обращении звучало бы разговорно и ослабляло торжественную резкость предупреждения.
- source_word: οὔτε ζεστὸς οὔτε ψυχρός
  choice: ни горячий, ни холодный
  rationale: Сохраняет симметричное отрицательное противопоставление без истолкования метафоры.
- source_word: μέλλω
  choice: Я вот-вот
  rationale: Передаёт близость и неизбежную надвигаемость действия, а не просто нейтральное будущее время.
- source_word: ἐμέσαι
  choice: изрыгну
  rationale: Сохраняет сильный телесный образ рвоты. «Выплюну» было бы слишком мягким, а «выблюю» — чрезмерно просторечным для литературного регистра.
- source_word: ἐκ τοῦ στόματός μου
  choice: тебя изо рта
  rationale: Сохраняет направление удаления и конкретный телесный образ; «рот» ближе к обычному значению στόμα, чем возвышенное «уста».
theological_decisions:
- issue: Сила образа суда в ἐμέσαι
  choice: Сохранить резкий образ рвоты посредством «изрыгну».
  alternative: Смягчить до «выплюну».
  rationale: Греческий глагол намеренно создаёт отталкивающий образ полного отвержения; смягчение ослабило бы риторическую и богословскую силу предупреждения.
- issue: Временное значение μέλλω
  choice: Передать близость действия словами «вот-вот».
  alternative: Использовать простое будущее «изрыгну» без дополнительного указания времени.
  rationale: Конструкция выражает надвигающееся действие и придаёт предупреждению срочность, которую важно не сглаживать.
translation_notes:
  register: Современный литературный русский с сохранением резкости исходного образа. Тире помогает естественно оформить поясняющее противопоставление «ни горячий, ни холодный». Местоимения, относящиеся к говорящему Христу, не капитализируются, что соответствует нейтральной современной орфографической подаче и не влияет на смысл.
