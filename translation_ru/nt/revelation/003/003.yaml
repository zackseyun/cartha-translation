id: REV.3.3
reference: Revelation 3:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πῶς εἴληφας καὶ ἤκουσας καὶ τήρει, καὶ μετανόησον· ἐὰν οὖν μὴ γρηγορήσῃς, ⸀ἥξω ὡς κλέπτης, καὶ οὐ μὴ ⸀γνῷς ποίαν ὥραν ἥξω ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/003.yaml
  text: Therefore remember how you have received and heard[a]; keep it, and repent. So if you do not stay awake, I will come like a thief[c][b], and you will certainly not know at what hour I will come upon you.
translation:
  language: ru
  text: Итак, помни, как ты принял и услышал[a]; храни это и покайся. Если же не будешь бодрствовать[b], Я приду как вор[c], и ты точно не узнаешь, в какой час Я приду на тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «помни, что ты принял и услышал». В греческом тексте буквально стоит «как»; это может подчёркивать то, каким образом была принята весть, хотя выражение можно понимать и как указание на саму весть.'
    reason: alternative_reading
  - marker: b
    text: «Бодрствовать» можно также передать как «быть бдительным» или «не терять бдительности».
    reason: lexical_alternative
  - marker: c
    text: Слова «Я приду как вор» перекликаются с другими библейскими предупреждениями о внезапном, неожиданном приходе. Сам этот стих не уточняет, идёт ли речь об окончательном суде или о более близком наказующем посещении.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: помни
  rationale: Настоящее повелительное наклонение призывает постоянно помнить; «помни» естественно и ясно передаёт этот призыв.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего обличения и естественно звучит в начале русского предложения.
- source_word: πῶς
  choice: как
  rationale: Сохраняет прямое значение наречия и возможный акцент на том, каким образом весть была принята, не сводя смысл только к её содержанию.
- source_word: εἴληφας
  choice: ты принял
  rationale: Русское прошедшее время здесь естественно обозначает состоявшийся приём вести, сохраняющий значение для настоящего; перфектной формы, полностью соответствующей греческой, в русском нет.
- source_word: ἤκουσας
  choice: услышал
  rationale: Прямо передаёт предшествующее действие слышания и хорошо сочетается с «принял».
- source_word: τήρει
  choice: храни это
  rationale: «Храни» сохраняет оттенки удержания, соблюдения и бережного отношения, не ограничивая смысл только послушанием; «это» добавлено для ясной связи с принятым и услышанным.
- source_word: μετανόησον
  choice: покайся
  rationale: Краткий, общепонятный новозаветный призыв отвернуться от греха.
- source_word: γρηγορήσῃς
  choice: не будешь бодрствовать
  rationale: Передаёт образ духовного бодрствования и поддерживает связь с последующим образом внезапно приходящего вора.
- source_word: ἥξω ὡς κλέπτης
  choice: Я приду как вор
  rationale: Естественное русское сравнение, сохраняющее образ внезапного и неожиданного прихода.
- source_word: οὐ μὴ γνῷς
  choice: ты точно не узнаешь
  rationale: «Точно не» передаёт усиленное греческое отрицание οὐ μή современным и понятным языком.
- source_word: ποίαν ὥραν
  choice: в какой час
  rationale: Сохраняет конкретный образ часа и торжественно-предостерегающий тон исходного текста.
- source_word: ἐπὶ σέ
  choice: на тебя
  rationale: Передаёт направленность прихода к адресату и его угрожающий оттенок, не уточняя сверх текста, идёт ли речь о суде или наказующем посещении.
theological_decisions:
- issue: Смысл выражения πῶς εἴληφας καὶ ἤκουσας
  choice: «помни, как ты принял и услышал»
  alternative: «помни, что ты принял и услышал»
  rationale: В греческом стоит πῶς («как»), поэтому основной текст сохраняет возможный акцент на характере или обстоятельствах первоначального принятия вести. При этом сноска отмечает допустимое понимание как указание на само содержание вести.
- issue: Характер предупреждения «Я приду как вор»
  choice: Не уточнять, о каком именно приходе идёт речь
  alternative: Прямо отнести слова ко Второму пришествию либо к ближайшему наказующему посещению общины
  rationale: Сам стих подчёркивает неожиданность прихода, но не определяет однозначно его масштаб и момент; перевод сохраняет эту богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с достойным, предостерегающим тоном. Обращение сохранено в единственном числе, как в греческом тексте. Заглавная буква в «Я» отражает речь Христа по русской издательской традиции. Формулировки избегают архаизмов и не снимают смысловую и богословскую неоднозначность стиха.
