base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/004.yaml
  text: But you have a few names in Sardis who have not soiled their garments[a], and they will walk with me in white[c][b], because they are worthy.
translation:
  language: ru
  text: Но у тебя в Сардах есть несколько имён[a] — тех, кто не запятнал своих одежд[b]; они будут ходить со Мной в белом[c], потому что достойны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть несколько человек; буквально: «несколько имён».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не осквернили своих одежд».'
    reason: lexical_alternative
  - marker: c
    text: 'То есть, вероятно, в белых одеждах; по-гречески кратко: «в белом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт сильное противопоставление предшествующему обличению общины в Сардах.
- source_word: ἔχεις ὀλίγα ὀνόματα
  choice: есть у тебя несколько имён
  rationale: 'Сохраняет прямое обращение и выразительную метонимию оригинала: «имена» обозначают конкретных людей.'
- source_word: ἐν Σάρδεσιν
  choice: в Сардах
  rationale: Нормальная русская форма предложного падежа названия города Сарды.
- source_word: οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν
  choice: не запятнали своих одежд
  rationale: «Запятнали» естественно поддерживает образ одежды и одновременно допускает нравственный смысл; «одежд» сохраняет возвышенный символический регистр.
- source_word: περιπατήσουσιν μετ’ ἐμοῦ
  choice: они будут ходить со Мной
  rationale: Сохраняет буквальный образ хождения, не сводя его лишь к отвлечённому значению общения или образа жизни.
- source_word: ἐν λευκοῖς
  choice: в белом
  rationale: Передаёт лаконичность греческого выражения, в котором подразумевается белая одежда.
- source_word: ὅτι ἄξιοί εἰσιν
  choice: потому что достойны
  rationale: Прямо передаёт указанное в тексте основание обещания, не добавляя богословских оговорок.
theological_decisions:
- issue: Передавать ли ὀνόματα буквально или раскрыть как «люди»
  choice: «несколько имён» в основном тексте
  alternative: «несколько человек»
  rationale: Буквальная метонимия выразительна и подчёркивает отдельных, известных по имени людей; значение поясняется в сноске.
- issue: Характер образа μολύνω применительно к одежде
  choice: «не запятнали своих одежд»
  alternative: «не осквернили своих одежд»
  rationale: Выбранная формулировка сохраняет одновременно конкретный образ пятна на одежде и нравственную символику, не усиливая без необходимости ритуальный оттенок.
- issue: Смысл утверждения ἄξιοί εἰσιν
  choice: «достойны» без поясняющего расширения
  alternative: «пригодны» или «заслуживают этого»
  rationale: Перевод сохраняет богословское напряжение исходного утверждения и не навязывает текста ни меритократическое, ни смягчающее толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены выразительные образы «имён», незапятнанных одежд и хождения «в белом». Разбиение на два предложения облегчает чтение, не меняя логической связи оригинала; местоимение «Мной» написано с прописной буквы по принятой русской библейской издательской традиции.
