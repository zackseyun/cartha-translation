id: REV.3.19
reference: Revelation 3:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγὼ ὅσους ἐὰν φιλῶ ἐλέγχω καὶ παιδεύω· ⸀ζήλευε οὖν καὶ μετανόησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/019.yaml
  text: Those whom I love[a], I rebuke and discipline[c][b]. Therefore be zealous and repent.
translation:
  language: ru
  text: Всех, кого Я люблю[a], Я обличаю и воспитываю[b]. Поэтому будь ревностен[c] и покайся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кого бы Я ни любил».'
    reason: lexical_alternative
  - marker: b
    text: Здесь «воспитываю» означает исправляющее воздействие и обучение, а не просто наказание.
    reason: cultural_note
  - marker: c
    text: 'Или: «будь усерден».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Я
  rationale: Выраженное местоимение сохраняет акцент на говорящем; отдельная усилительная конструкция по-русски была бы тяжеловесной или могла бы внести отсутствующее противопоставление.
- source_word: ὅσους ἐὰν
  choice: всех, кого
  rationale: Сочетание имеет неопределённо-обобщающий смысл — «всех, кого / кого бы ни». В данном контексте «всех, кого» естественно передаёт полноту обозначенной группы.
- source_word: φιλῶ
  choice: люблю
  rationale: Глагол обозначает любовь и привязанность. «Люблю» сохраняет полную силу отношения и не создаёт искусственного технического противопоставления другим греческим словам любви.
- source_word: ἐλέγχω
  choice: обличаю
  rationale: В контексте нравственного исправления слово означает выявление неправоты и вразумляющее порицание. «Обличаю» точнее «упрекаю» передаёт направленность на исправление.
- source_word: παιδεύω
  choice: воспитываю
  rationale: Глагол охватывает обучение и исправляющее воздействие, а не только наказание. «Воспитываю» естественно выражает формирующую цель действия.
- source_word: ζήλευε
  choice: будь ревностен
  rationale: Настоящее повелительное наклонение призывает к устойчивой горячей и деятельной серьёзности. «Будь ревностен» сохраняет интенсивность исходного слова.
- source_word: οὖν
  choice: поэтому
  rationale: 'Союз обозначает вывод: любящее обличение и воспитание требуют соответствующего ответа.'
- source_word: μετανόησον
  choice: покайся
  rationale: Это устоявшийся и точный русский эквивалент для нравственно-духовного обращения, включающего перемену отношения и пути.
theological_decisions:
- issue: Характер любви, выраженной φιλῶ, в связи с исправлением
  choice: «люблю» без ослабления до простой симпатии
  alternative: «дорожу», «испытываю привязанность»
  rationale: Текст прямо основывает обличение и воспитание на подлинной любви. Перевод не вводит технического богословского различия между φιλῶ и другими греческими глаголами любви.
- issue: Смысл παιδεύω
  choice: «воспитываю» как исправляющее и формирующее воздействие
  alternative: «наказываю», «наставляю»
  rationale: Исходное слово сочетает исправление с формированием. «Наказываю» чрезмерно сужает его до кары, а «наставляю» ослабляет болезненную сторону исправления.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Обращение во второй половине стиха оставлено в единственном числе, как в греческом тексте. Заглавное «Я» принято по русской библейской издательской традиции для речи Христа.
