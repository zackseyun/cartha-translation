  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ νικῶν ⸀οὕτως περιβαλεῖται ἐν ἱματίοις λευκοῖς, καὶ οὐ μὴ ἐξαλείψω τὸ ὄνομα αὐτοῦ ἐκ τῆς βίβλου τῆς ζωῆς, καὶ ὁμολογήσω τὸ ὄνομα αὐτοῦ ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/005.yaml
  text: The one who conquers will thus be clothed in white garments[a], and I will certainly not erase his name from the book of life[d][c][b], and I will confess his name before my Father and before his angels.
translation:
  language: ru
  text: Побеждающий будет так облачён в белые одежды[a], и Я никогда не сотру его имя из книги жизни[b][c], и признаю его перед Моим Отцом и перед Его ангелами[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тот, кто одерживает победу, будет так облачён в белые одежды».'
    reason: Лексическая и синтаксическая альтернатива для ὁ νικῶν и περιβαλεῖται.
  - marker: b
    text: 'Греческий текст содержит усиленное отрицание: «ни в коем случае не сотру».'
    reason: Передача эмфатической конструкции οὐ μή.
  - marker: c
    text: «Книга жизни» — образ небесного списка тех, кто принадлежит Богу и наследует жизнь.
    reason: Культурно-образное пояснение без разрешения богословского спора о возможности стирания имени.
  - marker: d
    text: 'Или: «открыто признаю (исповедаю) его имя». Сравните Матфея 10:32.'
    reason: Лексическая альтернатива и межтекстовая связь для ὁμολογήσω; сноска сохраняет буквальное упоминание имени.
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Побеждающий
  rationale: Субстантивированное причастие настоящего времени передаёт постоянную характеристику человека и сохраняет важный для Откровения мотив победы.
- source_word: οὕτως
  choice: так
  rationale: Кратко сохраняет указание на соответствие предшествующему обещанию и не добавляет толкования.
- source_word: περιβαλεῖται
  choice: облечётся
  rationale: Естественная для возвышенного библейского контекста результативная формулировка; средне-пассивная форма допускает такое русское выражение без уточнения действующего лица.
- source_word: ἱματίοις λευκοῖς
  choice: в белые одежды
  rationale: «Одежды» не сужает значение до конкретного вида одеяния и сохраняет апокалиптический образ.
- source_word: οὐ μὴ ἐξαλείψω
  choice: Я никогда не сотру
  rationale: «Никогда не» ясно передаёт усиленное греческое отрицание οὐ μή, а «сотру» естественно сочетается с образом записи в книге.
- source_word: ἐκ τῆς βίβλου τῆς ζωῆς
  choice: из книги жизни
  rationale: Устоявшееся и точное выражение; βίβλος здесь обозначает книгу или реестр, причём конкретный материальный формат уточнять не требуется.
- source_word: ὁμολογήσω τὸ ὄνομα αὐτοῦ
  choice: признаю его имя
  rationale: Передаёт открытое признание перед свидетелями и звучит естественнее современного русского «исповедую его имя», не устраняя связи с публичным исповеданием.
- source_word: ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ
  choice: перед Моим Отцом и перед Его ангелами
  rationale: Повтор «перед» сохраняет параллелизм оригинала; местоимение «Его» естественно относится к ближайшему антецеденту — Отцу.
theological_decisions:
- issue: Связь обещания не стирать имя из книги жизни с учениями о стойкости и отпадении
  choice: Передать как усиленное обещание победителю, не выводя из него отдельного догматического заключения.
  alternative: Истолковать либо как безусловную гарантию невозможности отпадения, либо как прямое утверждение возможности утраты спасения.
  rationale: Сам стих утверждает обещание Христа победителю, но не разрешает однозначно более широкий богословский спор.
- issue: Грамматический род единственного числа
  choice: 'Сохранить форму мужского рода: «Побеждающий… его имени».'
  alternative: Использовать множественное или гендерно-нейтральное выражение.
  rationale: Русская форма соответствует грамматически мужскому единственному числу оригинала и имеет обобщающий смысл.
- issue: Значение ὁμολογήσω
  choice: «признаю его имя» как публичное благосклонное признание.
  alternative: «исповедую его имя» или «возвещу его имя».
  rationale: Выбранная формулировка не приписывает Христу исповедание в смысле признания греха и сохраняет публично-декларативный смысл.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Облечётся» сохраняет достоинство апокалиптического обещания, оставаясь понятным; синтаксис краток и близок к трёхчастной структуре греческого текста. Прописные буквы в «Моим» и «Его» применены как издательская норма для местоимений, относящихся к Богу.
