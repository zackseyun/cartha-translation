  rationale: Сохранено единственное число греческого текста и характерная для повторяющейся формулы образность.
- source_word: ἀκουσάτω
  choice: пусть услышит
  rationale: Передаёт повелительное наклонение третьего лица и сохраняет единственное число; «услышит» здесь подразумевает внимательное восприятие и отклик.
- source_word: τί
  choice: что
  rationale: Естественно вводит содержание речи Духа.
- source_word: τὸ πνεῦμα
  choice: Дух
  rationale: В повторяющейся формуле Откровения речь в контексте идёт о Святом Духе; прописная буква обозначает этот референт.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время передано естественной русской формой, выражающей актуальную и характерную речь.
- source_word: ταῖς ἐκκλησίαις
  choice: церквам
  rationale: Стандартный и контекстуально точный эквивалент дательного падежа множественного числа ἐκκλησία в обращениях к семи церквам.
theological_decisions:
- issue: Кого обозначает «Дух»
  choice: Святой Дух
  alternative: дух или некое духовное существо
  rationale: В повторяющемся рефрене Откровения 2–3 определённая форма «Дух» указывает на Святого Духа, обращающегося к церквам через пророческое послание.
- issue: Обобщённое единственное число в призыве
  choice: У кого есть ухо, пусть услышит
  alternative: У кого есть уши, пусть слушают
  rationale: Греческий текст использует единственное число в обобщённой конструкции. Русская формулировка сохраняет его, не ограничивая обращение мужчинами.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского призыва. Единственное число «ухо» намеренно сохранено; «церквам» соответствует устойчивому новозаветному употреблению.
