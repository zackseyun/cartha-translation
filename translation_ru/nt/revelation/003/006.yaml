lexical_decisions:
- source_word: ὁ ἔχων
  choice: У кого есть
  rationale: Субстантивированное причастие обозначает любого человека, к которому обращён призыв; эта формулировка естественна по-русски и сохраняет обобщённый смысл.
- source_word: οὖς
