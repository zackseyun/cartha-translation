id: REV.3.11
reference: Revelation 3:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἔρχομαι ταχύ· κράτει ὃ ἔχεις, ἵνα μηδεὶς λάβῃ τὸν στέφανόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/011.yaml
  text: I am coming soon[a]; hold fast what you have[b], so that no one may take your crown.
translation:
  language: ru
  text: Я скоро приду[a]. Крепко держись того, что у тебя есть, чтобы никто не отнял твоего венца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я приду быстро (стремительно)». Греческое наречие может подчёркивать как близость во времени, так и быстроту действия.'
    reason: alternative_reading
  - marker: b
    text: Греческое слово означает венок или венец, вручавшийся победителю либо как знак почёта, а не собственно царскую диадему.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχομαι
  choice: Я приду
  rationale: Настоящее время имеет здесь значение предстоящего прихода; русское будущее «приду» естественно передаёт этот смысл.
- source_word: ταχύ
  choice: скоро
  rationale: Наречие может указывать на близость во времени или быстроту действия. В основном тексте «скоро» естественно выражает близость прихода, а альтернативный оттенок отмечен в сноске.
- source_word: κράτει
  choice: крепко держись
  rationale: Повелительная форма призывает твёрдо сохранять уже имеющееся; выражение передаёт настойчивость увещания.
- source_word: ὃ ἔχεις
  choice: того, что у тебя есть
  rationale: Формулировка сохраняет намеренную неопределённость объекта, не добавляя толкования.
- source_word: ἵνα μηδεὶς λάβῃ
  choice: чтобы никто не отнял
  rationale: Передаёт целевое предостережение и нежелательный исход, которого следует избежать.
- source_word: τὸν στέφανόν σου
  choice: твоего венца
  rationale: «Венец» в современном библейском регистре обозначает почётную награду и лучше, чем «корона», отличает στέφανος от царской диадемы.
theological_decisions:
- issue: Оттенок ταχύ в обещании прихода Христа
  choice: скоро
  alternative: быстро, стремительно
  rationale: Греческое наречие допускает как временную близость, так и быстроту действия. Основной текст передаёт первое значение, не исключая второго, которое сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и увещательным звучанием. Синтаксис естественный, а неопределённость оригинала и различие между почётным венцом и царской диадемой сохранены.
