id: REV.3.7
reference: Revelation 3:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Φιλαδελφείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἅγιος, ὁ ἀληθινός, ὁ ἔχων τὴν κλεῖν ⸀Δαυίδ, ὁ ἀνοίγων καὶ οὐδεὶς κλείσει, ⸂καὶ κλείων⸃ καὶ οὐδεὶς ⸀ἀνοίγει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/007.yaml
  text: 'And write to the angel of the church in Philadelphia: These things says the Holy One[a], the True One, the one who has the key of David, who opens and no one will shut[b], and who shuts and no one opens:'
translation:
  language: ru
  text: 'И ангелу[a] церкви в Филадельфии напиши: «Так говорит Святой, Истинный, имеющий ключ Давида[b], открывающий — и никто не запрёт, и запирающий — и никто не открывает:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестнику». Греческое ἄγγελος может обозначать как ангела, так и посланника или вестника.'
    reason: alternative_reading
  - marker: b
    text: Выражение «ключ Давида», вероятно, отсылает к Ис 22:22 и служит образом царской власти открывать и запирать.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ангелу
  rationale: Слово может означать как небесного ангела, так и человеческого вестника. В повторяющейся формуле обращений к семи церквам «ангел» сохраняет наиболее естественное и традиционное понимание, не исключая иной возможности, отмеченной в сноске.
- source_word: ἐκκλησίας
  choice: церкви
  rationale: В данной формуле ἐκκλησία обозначает местную общину христиан; «церковь» — ясный и естественный русский эквивалент.
- source_word: Τάδε λέγει
  choice: Так говорит
  rationale: Формула передаёт торжественное пророческое вступление и звучит естественно по-русски. Демонстративная сила τάδε выражена формулой «так говорит», не сводящей высказывание к нейтральному «говорит».
- source_word: ὁ ἅγιος
  choice: Святой
  rationale: Артикль и субстантивированное прилагательное указывают на титул говорящего; прописная буква отражает титульное употребление.
- source_word: ὁ ἀληθινός
  choice: Истинный
  rationale: В данном контексте слово выражает не только правдивость, но подлинность и абсолютную истинность; титульная форма сохраняется.
- source_word: κλεῖν Δαυίδ
  choice: ключ Давида
  rationale: Прямо сохраняется библейский образ и давидовская связь, вероятно восходящая к Ис 22:22, без замены образа толкованием.
- source_word: ἀνοίγων
  choice: открывающий
  rationale: Причастие сохраняет последовательность торжественных титулов и определений говорящего.
- source_word: κλείσει
  choice: запрёт
  rationale: Будущее время греческого глагола сохранено, включая намеренное различие времён с последующим настоящим временем.
- source_word: κλείων
  choice: запирающий
  rationale: Причастная форма передаёт параллелизм с «открывающий».
- source_word: ἀνοίγει
  choice: открывает
  rationale: 'Сохранено настоящее время оригинала: Он открывает — никто не запрёт; Он запирает — никто не открывает.'
theological_decisions:
- issue: Христологические титулы ὁ ἅγιος и ὁ ἀληθινός
  choice: 'Переданы как прямые титулы воскресшего Христа: «Святой, Истинный».'
  alternative: 'Передать как описательные прилагательные со строчной буквы: «святой, истинный».'
  rationale: В ближайшем контексте говорит Христос, а конструкции с артиклем функционируют как торжественные титулы. Перевод сохраняет высокую христологию текста, ничего к ней не добавляя.
- issue: Образ «ключ Давида»
  choice: Образ сохранён буквально, а вероятная связь с Ис 22:22 отмечена в сноске.
  alternative: 'Раскрыть образ толковательным переводом, например: «владеющий властью над царством Давида».'
  rationale: Исайинская аллюзия указывает на царскую власть открывать и запирать, однако основной текст должен сохранять исходный образ, а не подменять его объяснением.
- issue: Личность ἄγγελος церкви
  choice: В основном тексте употреблено «ангел», при этом «вестник» дан как допустимая альтернатива в сноске.
  alternative: Перевести в основном тексте как «вестник».
  rationale: Греческое слово допускает оба значения, а сам стих не устраняет неоднозначность. Традиционный перевод «ангел» не должен превращаться в утверждение, будто человеческий вестник лексически невозможен.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Причастный параллелизм «открывающий… и запирающий…» сохраняет структуру греческого текста; различие между будущим «не запрёт» и настоящим «не открывает» намеренно удержано.
