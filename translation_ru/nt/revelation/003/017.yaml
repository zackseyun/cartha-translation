  source_fidelity: В целом перевод точно передаёт причинное первое ὅτι, содержание речи через прямую цитату, перфект πεπλούτηκα («разбогател»), всеохватность οὐδέν («ни в чём») и образный ряд χαρακτηρισик. Однако καί перед οὐκ οἶδας — простое «и», а не противительное «но»; русский союз «и» сохраняет исходную синтаксическую связь, при этом контраст остаётся ясным из контекста.
  naturalness: Текст звучит естественно в современном литературном русском и сохраняет сдержанно-библейский регистр. «Это ты — несчастный» удачно передаёт выделенное σὺ без искусственного воспроизведения греческого артикля. «Нагой» уместно в данном регистре.
  terminology: «Богат», «разбогател», «нищий», «слепой» и «нагой» последовательно сохраняют лексику и иронию оригинала. «Жалкий» достаточно различает ἐλεεινός и ταλαίπωρος. Добавлять «духовно» не следует, поскольку этого нет в греческом тексте.
