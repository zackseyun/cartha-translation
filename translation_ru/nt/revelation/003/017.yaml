id: REV.3.17
reference: Revelation 3:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι λέγεις ⸀ὅτι Πλούσιός εἰμι καὶ πεπλούτηκα καὶ ⸀οὐδὲν χρείαν ἔχω, καὶ οὐκ οἶδας ὅτι σὺ εἶ ὁ ταλαίπωρος ⸀καὶ ἐλεεινὸς καὶ πτωχὸς καὶ τυφλὸς καὶ γυμνός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/017.yaml
  text: because you say[a], ‘I am rich, and I have become wealthy[b], and I have need of nothing,’ and you do not know that you are wretched and pitiable and poor and blind and naked.
translation:
  language: ru
  text: 'потому что ты говоришь: «Я богат, разбогател и ни в чём не нуждаюсь», — и не знаешь, что это ты — несчастный и жалкий, нищий, слепой и нагой.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι λέγεις ὅτι
  choice: 'потому что ты говоришь: «…»'
  rationale: Первое ὅτι передаёт причину обличения, второе вводит содержание речи; по-русски естественна прямая цитата после двоеточия.
- source_word: Πλούσιός εἰμι
  choice: Я богат
  rationale: Прямо сохраняет самооценку адресата и готовит контраст с πτωχός.
- source_word: πεπλούτηκα
  choice: разбогател
  rationale: Перфект обозначает достигнутое обогащение с сохраняющимся результатом; совершенный вид естественно передаёт это по-русски.
- source_word: οὐδὲν χρείαν ἔχω
  choice: ни в чём не нуждаюсь
  rationale: Современный и точный русский эквивалент идиомы «иметь нужду», сохраняющий всеохватность οὐδέν.
- source_word: οὐκ οἶδας
  choice: не знаешь
  rationale: Сохраняет явный глагол знания без поясняющего истолкования «не сознаёшь».
- source_word: σὺ εἶ ὁ ταλαίπωρος
  choice: это ты — несчастный
  rationale: Конструкция «это ты» передаёт ударное σὺ и заострённость субстантивированного ὁ ταλαίπωρος, оставаясь естественной по-русски.
- source_word: ἐλεεινός
  choice: жалкий
  rationale: Передаёт состояние, вызывающее жалость, и не сливает слово полностью с ταλαίπωρος.
- source_word: πτωχός
  choice: нищий
  rationale: Передаёт резкий контраст с заявлением о богатстве сильнее, чем более широкое «бедный».
- source_word: τυφλός
  choice: слепой
  rationale: Стандартный прямой эквивалент без внесения в текст пояснения о переносном смысле.
- source_word: γυμνός
  choice: нагой
  rationale: Точный, достоинственный и уместный для библейского регистра эквивалент, сохраняющий образ наготы.
theological_decisions:
- issue: Следует ли явно обозначить богатство, нищету, слепоту и наготу как духовные
  choice: Образы оставлены без добавления слова «духовно».
  alternative: «духовно нищий, слепой и нагой»
  rationale: Сам текст создаёт метафорический и иронический контраст; пояснение сняло бы часть риторического напряжения и внесло толкование в основной текст.
- issue: Как передать указательность ὁ ταλαίπωρος при именной части сказуемого
  choice: «это ты — несчастный»
  alternative: «ты несчастен»
  rationale: Выбранная конструкция сохраняет особое выделение адресата и заострённость греческого выражения, не превращая его в неестественное русское «тот несчастный».
translation_notes:
  register: Современный литературный русский с достоинственным библейским звучанием. Синтаксис прямой и понятный; тире подчёркивает разоблачительный контраст между самооценкой адресата и истинным положением.
