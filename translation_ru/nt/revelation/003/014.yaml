  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Λαοδικείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ Ἀμήν, ὁ μάρτυς ὁ πιστὸς ⸀καὶ ἀληθινός, ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/014.yaml
  text: 'And write to the angel of the church in Laodicea: These things says the Amen[a], the faithful and true witness[b], the beginning of the creation of God.'
translation:
  language: ru
  text: 'И ангелу[a] Лаодикийской церкви напиши: «Так говорит Аминь, верный и истинный Свидетель, начало Божьего творения[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестнику Лаодикийской церкви».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «источник Божьего творения»; возможно также: «Владыка Божьего творения». Греческое слово архэ может означать «начало», «источник» или «правитель».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ангелу
  rationale: Слово может обозначать ангела или вестника; в повторяющейся формуле обращений к семи церквам Откровения традиционное и наиболее естественное соответствие — «ангел».
- source_word: Τάδε λέγει
  choice: Так говорит
  rationale: Естественная для русского библейского стиля формула, точно передающая пророческое вводное выражение без ненужной буквальности.
- source_word: ὁ Ἀμήν
  choice: Аминь
  rationale: Сохранено как особый титул Христа, несущий смысл достоверности и истины и сохраняющий библейскую межтекстовую связь.
- source_word: ὁ μάρτυς
  choice: Свидетель
  rationale: Прямое и естественное соответствие, сохраняющее значение свидетельствующего о правде.
- source_word: ὁ πιστὸς καὶ ἀληθινός
  choice: верный и истинный
  rationale: Передаёт как надёжность и верность, так и подлинность свидетельства; естественно сочетается в русском языке.
- source_word: ἡ ἀρχὴ
  choice: начало
  rationale: Наиболее прямое соответствие, сохраняющее смысловую широту и богословское напряжение греческого слова, которое также может означать источник, происхождение или власть/начальство.
- source_word: τῆς κτίσεως τοῦ θεοῦ
  choice: Божьего творения
  rationale: Кратко и естественно передаёт греческую родительную конструкцию «творения Бога», не уточняя неоднозначное отношение сверх выраженного в оригинале.
theological_decisions:
- issue: Значение ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ как христологического титула
  choice: начало Божьего творения
  alternative: источник Божьего творения; начало, от которого произошло Божье творение; Владыка Божьего творения
  rationale: Основной текст сохраняет наиболее прямое значение ἀρχή и не разрешает спорную христологическую неоднозначность в пользу одного толкования. Возможные значения, не представляющие Христа частью творения, отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Пророческая формула передана устойчивым выражением «Так говорит». Написание «Свидетель» с прописной буквы подчёркивает функцию слова как титула в ряду христологических наименований.
