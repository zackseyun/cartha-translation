  source_fidelity: 'Основной текст в целом точно передаёт синтаксис и лексику греческого оригинала: сохранён повтор τηρέω («сохранил… сохраню»), не снята неоднозначность τὸν λόγον τῆς ὑπομονῆς μου, а τηρήσω ἐκ передано без навязывания способа защиты. «Обитаемый мир» удачно передаёт οἰκουμένη. Однако сноска b нуждается в более точной формулировке альтернативы «preserve … through»: «сохраню тебя во время» обозначает лишь время действия и не выражает сохранения через испытание.'
