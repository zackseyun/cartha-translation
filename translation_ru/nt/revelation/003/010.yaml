  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι ἐτήρησας τὸν λόγον τῆς ὑπομονῆς μου, κἀγώ σε τηρήσω ἐκ τῆς ὥρας τοῦ πειρασμοῦ τῆς μελλούσης ἔρχεσθαι ἐπὶ τῆς οἰκουμένης ὅλης, πειράσαι τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/010.yaml
  text: Because you have kept my word of endurance[a], I also will keep you from the hour of testing that is about to come upon the whole inhabited world[b], to test those who dwell on the earth.
translation:
  language: ru
  text: Так как ты сохранил слово Моей стойкости[a], то и Я сохраню тебя от часа испытания[b], который должен прийти на весь обитаемый мир, чтобы испытать живущих на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слово о Моей стойкости»; или: «Моё слово, призывающее к стойкости». Греческое выражение допускает несколько близких по смыслу пониманий.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сохраню тебя через час испытания»; или: «уберегу тебя вне часа испытания». В греческом тексте буквально сказано «сохраню… от», и само это выражение не определяет, каким именно образом будет осуществлена защита.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτήρησας … τηρήσω
  choice: сохранил … сохраню
  rationale: 'Повтор одного русского глагола передаёт намеренную связь между двумя формами τηρέω: адресат сохранил слово Христа, и Христос в ответ сохранит его. В первом случае «сохранил слово» означает верно держался его и исполнял его.'
- source_word: τὸν λόγον τῆς ὑπομονῆς μου
  choice: слово Моей стойкости
  rationale: 'Близкая к форме греческого выражения конструкция сохраняет неоднозначность родительного падежа: это может быть слово о стойкости Христа, слово, связанное с Его стойкостью, или Его слово, призывающее к стойкости. Возможные толкования указаны в сноске.'
- source_word: κἀγώ
  choice: то и Я
  rationale: 'Передаёт подчёркнутую взаимность: поскольку адресат сохранил слово, Христос также сохранит его.'
- source_word: τηρήσω ἐκ
  choice: сохраню тебя от
  rationale: Прямо передаёт сочетание τηρέω с ἐκ и не вводит в основной текст определённую эсхатологическую схему. Другие возможные способы понимания защиты отмечены в сноске.
- source_word: ὥρας τοῦ πειρασμοῦ
  choice: часа испытания
  rationale: «Час» сохраняет апокалиптическую образность ὥρα, а «испытание» передаёт широкий смысл πειρασμός без сужения до нравственного искушения.
- source_word: τῆς μελλούσης ἔρχεσθαι
  choice: который грядёт
  rationale: Лаконичное и естественное для возвышенного пророческого контекста выражение передаёт предстоящее наступление часа испытания.
- source_word: ἐπὶ τῆς οἰκουμένης ὅλης
  choice: на весь обитаемый мир
  rationale: «Обитаемый мир» сохраняет значение οἰκουμένη и не расширяет его до всей вселенной или космоса.
- source_word: πειράσαι
  choice: чтобы испытать
  rationale: Инфинитив передаётся как цель предстоящего испытания; повтор корня «испыт-» связывает πειράσαι с πειρασμός.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: живущих на земле
  rationale: Естественная современная формулировка сохраняет словесную форму повторяющегося в Откровении выражения, а не свёртывает её до существительного «жители».
theological_decisions:
- issue: Значение τηρήσω ἐκ в эсхатологическом контексте
  choice: сохраню тебя от
  alternative: сохраню тебя во время часа испытания; уберегу тебя вне часа испытания
  rationale: Основной текст следует наиболее прямому значению греческого сочетания, но не решает, означает ли обещание устранение до испытания, защиту посреди него или избавление от его действия.
- issue: Смысл родительного падежа в τὸν λόγον τῆς ὑπομονῆς μου
  choice: слово Моей стойкости
  alternative: слово о Моей стойкости; Моё слово, призывающее к стойкости
  rationale: Греческая конструкция допускает несколько близких прочтений. Формулировка основного текста и сноска сохраняют эту смысловую напряжённость, не закрепляя единственное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Сохранены повтор глагола «сохранить», образ «часа» и выражение «обитаемый мир». Местоимения, относящиеся ко Христу, написаны с прописной буквы в соответствии с принятой русской библейской издательской традицией.
