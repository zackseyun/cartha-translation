  terminology: «Стойкость», «час испытания», «обитаемый мир» и «живущие на земле» последовательно и уместно передают ключевые термины. Прописное написание местоимений соответствует заявленной библейской издательской конвенции. Сноска a корректно сохраняет генитивную неоднозначность; сноска b после уточнения будет сохранять богословскую неопределённость сочетания τηρήσω ἐκ.
