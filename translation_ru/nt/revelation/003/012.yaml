id: REV.3.12
reference: Revelation 3:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ νικῶν ποιήσω αὐτὸν στῦλον ἐν τῷ ναῷ τοῦ θεοῦ μου, καὶ ἔξω οὐ μὴ ἐξέλθῃ ἔτι, καὶ γράψω ἐπ’ αὐτὸν τὸ ὄνομα τοῦ θεοῦ μου καὶ τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ, ἡ ⸀καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου, καὶ τὸ ὄνομά μου τὸ καινόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/012.yaml
  text: The one who conquers—I will make him a pillar in the temple of my God[a], and he will never go out from it anymore. And I will write on him the name of my God, and the name of the city of my God, the new Jerusalem, which comes down out of heaven from my God[c][b], and my own new name.
translation:
  language: ru
  text: Того, кто побеждает[a], Я сделаю столпом в храме Моего Бога, и он уже никогда не выйдет оттуда[b]. Я напишу на нём имя Моего Бога и имя города Моего Бога — нового Иерусалима, который нисходит с неба от Моего Бога, — и Моё новое имя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «того, кто одерживает победу». Греческий глагол νικάω — повторяющееся в Откровении обозначение победы, достигаемой верностью.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте употреблено усиленное отрицание: «ни в коем случае больше не выйдет».'
    reason: source_emphasis
lexical_decisions:
- source_word: ὁ νικῶν
  choice: того, кто побеждает
  rationale: Субстантивированное причастие настоящего времени передаёт человека, сохраняющего верность и одерживающего победу; конструкция «того, кто…» естественна по-русски и согласуется с последующим αὐτόν.
- source_word: ποιήσω αὐτὸν στῦλον
  choice: Я сделаю столпом
  rationale: Сохранены значение превращения или назначения и буквальный архитектурный образ постоянства и чести.
- source_word: ἐν τῷ ναῷ
  choice: в храме
  rationale: ναός обозначает собственно храм или святилище, а не весь храмовый комплекс; «в храме» понятно и естественно для современного читателя.
- source_word: ἔξω οὐ μὴ ἐξέλθῃ ἔτι
  choice: он уже никогда не выйдет оттуда
  rationale: «Никогда» передаёт усиленное отрицание οὐ μή, «уже» — окончательность ἔτι в отрицательной конструкции, а «оттуда» естественно восполняет подразумеваемый храм.
- source_word: γράψω ἐπ’ αὐτὸν
  choice: Я напишу на нём
  rationale: Сохранён прямой образ нанесения имени на человека без поясняющего истолкования.
- source_word: τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ
  choice: имя города Моего Бога — нового Иерусалима
  rationale: Тире ясно показывает, что новый Иерусалим является приложением к «городу Моего Бога», сохраняя структуру и смысл греческого текста.
- source_word: ἡ καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου
  choice: который нисходит с неба от Моего Бога
  rationale: Настоящее время сохраняет описательную силу причастия; «с неба от Моего Бога» передаёт и небесное происхождение, и Бога как источник.
- source_word: τὸ ὄνομά μου τὸ καινόν
  choice: Моё новое имя
  rationale: Естественная русская передача определительной конструкции с сохранением тайны содержания имени и без добавления спорного усиления вроде «собственное».
theological_decisions:
- issue: Мужской род и единственное число в формуле обещания
  choice: «того… он… на нём»
  alternative: «побеждающие… они… на них»
  rationale: Греческий текст последовательно употребляет единственное число и грамматически мужские формы, при этом выражение имеет обобщающий смысл. Русская формулировка сохраняет обе особенности.
- issue: Повторение слов «Мой Бог» в речи Христа
  choice: сохранить все четыре повторения «Моего Бога»
  alternative: устранить часть повторов ради стилистической плавности
  rationale: Повторение явно присутствует в греческом тексте и богословски значимо; его не следует сглаживать или объяснять в самом переводе.
- issue: Новое имя говорящего
  choice: «Моё новое имя» без истолкования
  alternative: уточнить содержание или носителя имени
  rationale: Текст не раскрывает содержания нового имени; перевод сохраняет эту намеренную недосказанность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Заглавные буквы в местоимениях, относящихся к Богу и говорящему Христу, соответствуют принятой русской религиозной издательской норме. Образ «столпа» и четырёхкратное «Моего Бога» сохранены без стилистического сглаживания.
