  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἰδοὺ ἕστηκα ἐπὶ τὴν θύραν καὶ κρούω· ἐάν τις ἀκούσῃ τῆς φωνῆς μου καὶ ἀνοίξῃ τὴν θύραν, ⸀καὶ εἰσελεύσομαι πρὸς αὐτὸν καὶ δειπνήσω μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/020.yaml
  text: Look[a], I stand at the door and knock. If anyone hears my voice and opens the door, I will come in to him and dine with him[c][b], and he with me.
translation:
  language: ru
  text: Вот, Я стою у двери и стучу. Если кто услышит Мой голос и откроет дверь, Я войду к нему[a] и буду есть с ним[b], а он — со Мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «к нему» передаёт личную направленность действия, а не просто вход в какое-либо место.
    reason: lexical_alternative
  - marker: b
    text: Образ совместной трапезы выражает близкое взаимное общение. Толкователи по-разному связывают его с Вечерей Господней, обращением человека или восстановлением общения; сам текст прямо не уточняет этого.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἰδοὺ
  choice: Вот
  rationale: Естественная для современного литературного русского частица, привлекающая внимание и сохраняющая непосредственность греческого выражения.
- source_word: ἕστηκα
  choice: Я стою
  rationale: 'Перфект ἵστημι имеет здесь настоящее стативное значение: речь о сохраняющемся положении, а не только о завершённом прошлом действии.'
- source_word: ἐπὶ τὴν θύραν
  choice: у двери
  rationale: Нормальное русское обозначение положения перед входом; буквальное «на двери» здесь неестественно.
- source_word: κρούω
  choice: стучу
  rationale: Настоящее время передаёт продолжающееся действие и естественно сочетается с «стою».
- source_word: ἐάν τις
  choice: Если кто
  rationale: Сохраняет неопределённый и открытый характер условия без гендерного ограничения.
- source_word: ἀκούσῃ τῆς φωνῆς μου
  choice: услышит Мой голос
  rationale: Прямо передаёт φωνή как личный голос; русское управление требует винительного падежа.
- source_word: ἀνοίξῃ τὴν θύραν
  choice: откроет дверь
  rationale: Точное и естественное соответствие условной конструкции с аористом сослагательного наклонения.
- source_word: καὶ εἰσελεύσομαι πρὸς αὐτόν
  choice: Я войду к нему
  rationale: «Войду» передаёт движение внутрь, а «к нему» сохраняет личную направленность πρὸς αὐτόν, не сводя смысл к входу в помещение.
- source_word: δειπνήσω
  choice: буду есть
  rationale: Передаёт совместную трапезу естественным современным русским языком; «ужинать» могло бы излишне сузить образ до конкретного времени суток.
- source_word: μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ
  choice: с ним, а он — со Мной
  rationale: Сохраняет эллипсис и подчёркнутую взаимность греческой фразы; тире естественно восполняет опущенный глагол по-русски.
theological_decisions:
- issue: Образ совместной трапезы
  choice: Образ передан прямо как личная взаимная трапеза, без уточнения её догматического значения.
  alternative: Истолковать трапезу непосредственно как Вечерю Господню, обращение человека или восстановление общения с верующим либо церковью.
  rationale: Текст ясно выражает близкое взаимное общение, но сам по себе не определяет образ исключительно как таинство, первоначальное обращение или восстановленное общение.
translation_notes:
  register: Современный литературный русский, ясный и dignified без архаизации. Прописные местоимения, относящиеся ко Христу, употреблены в соответствии с устойчивой русской библейской издательской традицией. Фраза сохраняет торжественную непосредственность обращения и взаимность заключительного оборота.
