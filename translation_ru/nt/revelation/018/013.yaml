id: REV.18.13
reference: Revelation 18:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ κιννάμωμον ⸂καὶ ἄμωμον⸃ καὶ θυμιάματα καὶ μύρον καὶ λίβανον καὶ οἶνον καὶ ἔλαιον καὶ σεμίδαλιν καὶ σῖτον καὶ ⸂κτήνη καὶ πρόβατα⸃, καὶ ἵππων καὶ ῥεδῶν καὶ σωμάτων, καὶ ψυχὰς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/013.yaml
  text: and cinnamon and spice and incense and perfume and frankincense and wine and olive oil and fine flour and wheat and cattle and sheep[a], and horses and chariots and servants, that is[b], human souls.
translation:
  language: ru
  text: и корицу, и амом[a], и благовония, и ароматное масло, и ладан, и вино, и оливковое масло, и тонкую муку, и пшеницу, и скот, и овец, и коней, и повозки, и тела[b], и души человеческие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Амом — дорогое ароматическое растение или пряность; точное ботаническое отождествление неясно.
    reason: lexical_alternative
  - marker: b
    text: Буквально «тела»; в торговом перечне имеются в виду люди, продаваемые в рабство.
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: корица
  rationale: Прямое и общеупотребительное название дорогой привозной пряности.
- source_word: ἄμωμον
  choice: амом
  rationale: Сохраняет отдельное наименование ароматического растения и не сливает его с последующим общим обозначением благовоний; значение пояснено в сноске.
- source_word: θυμιάματα
  choice: благовония
  rationale: В торговом перечне обозначает ароматические вещества для воскурения; русское слово естественно передаёт товарную категорию.
- source_word: μύρον
  choice: ароматное масло
  rationale: Передаёт дорогое душистое масло или мазь точнее, чем современное «парфюм», и остаётся понятным читателю.
- source_word: λίβανον
  choice: ладан
  rationale: Это конкретная ароматическая смола, отличная от более общего θυμιάματα.
- source_word: ἔλαιον
  choice: оливковое масло
  rationale: Контекстуально подразумевается масло из оливок; уточнение устраняет современную неоднозначность слова «масло».
- source_word: σεμίδαλιν
  choice: тонкая мука
  rationale: Обозначает высококачественную муку тонкого помола.
- source_word: σῖτον
  choice: пшеница
  rationale: В данном перечне наиболее вероятно конкретное значение «пшеница», а не зерно вообще.
- source_word: κτήνη
  choice: скот
  rationale: Широкое обозначение домашних крупных животных; сохраняет отличие от отдельно названных овец.
- source_word: πρόβατα
  choice: овцы
  rationale: Прямое соответствие греческому названию овец.
- source_word: ἵππων
  choice: кони
  rationale: Естественное литературное обозначение лошадей в торжественном перечне.
- source_word: ῥεδῶν
  choice: повозки
  rationale: Слово обозначает четырёхколёсные экипажи; нейтральное «повозки» не навязывает военного значения «колесницы».
- source_word: σωμάτων
  choice: тела
  rationale: Сохраняет буквальную и намеренно потрясающую лексику о превращении людей в товар; рабовладельческий смысл пояснён сноской.
- source_word: ψυχὰς ἀνθρώπων
  choice: души человеческие
  rationale: Сохраняет отличное от «тел» выражение и кульминационное обличение торговли людьми, не сводя ψυχαί только к физической жизни.
theological_decisions:
- issue: Связь σωμάτων καὶ ψυχὰς ἀνθρώπων
  choice: «и тела, и души человеческие»
  alternative: «и рабов, то есть человеческие души»
  rationale: Греческий текст формально соединяет два дополнения союзом καί и допускает риторическое нарастание. Буквальная передача сохраняет напряжение между «телами» как товаром и человеческими жизнями/душами, не превращая связь безусловно в пояснительное «то есть».
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического торгового перечня. Повторяющийся союз «и» сохранён ради накопительного ритма оригинала. Неясность ἄμωμον и напряжённая формулировка о «телах» и «душах человеческих» не сглажены.
