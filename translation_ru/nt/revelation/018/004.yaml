source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ἄλλην φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· ⸀Ἐξέλθατε, ⸂ὁ λαός μου, ἐξ αὐτῆς⸃, ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς, καὶ ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/004.yaml
  text: And I heard another voice from heaven saying[a], “Come out of her, my people, so that you may not share in her sins[b], and so that you may not receive any of her plagues.”
translation:
  language: ru
  text: 'И услышал я иной голос с неба, говоривший: «Выйдите из неё, народ Мой, чтобы вы не участвовали в её грехах и чтобы не приняли на себя её язв[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы не получить от её язв»; имеется в виду не получить доли в постигших её язвах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλην φωνὴν
  choice: иной голос
  rationale: Передаёт дополнительный и отличный от прежнего голос; это естественное библейско-литературное выражение в современном русском.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с неба
  rationale: В данном контексте οὐρανός обозначает небесную сферу; «с неба» звучит естественно и точно.
- source_word: Ἐξέλθατε
  choice: Выйди
  rationale: Аористный императив множественного числа обращён к собирательному «народ Мой». По-русски согласование по грамматическому числу требует единственного числа; повеление означает покинуть Вавилон.
- source_word: ὁ λαός μου
  choice: народ Мой
  rationale: Сохраняет обращение и заветный оттенок выражения без добавления отдельной звательной частицы.
- source_word: ἐξ αὐτῆς
  choice: от неё
  rationale: Женский род сохраняет олицетворение Вавилона как женщины и города; «от неё» естественнее по-русски, чем буквальное «из неё» при таком олицетворении.
- source_word: ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς
  choice: чтобы не участвовать вам в грехах её
  rationale: συγκοινωνέω означает совместное участие или причастность. Инфинитивная конструкция с дательным субъектом естественно объединяет две цели предшествующего повеления.
- source_word: ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε
  choice: не подвергнуться язвам её
  rationale: Греческое выражение буквально говорит о получении доли от её πληγαί. По-русски «подвергнуться язвам» естественно передаёт попадание под эти суды, не утверждая, что народ разделяет ответственность за них.
- source_word: πληγῶν
  choice: язвам
  rationale: В Откровении слово обозначает ниспосланные бедствия и кары; «язвы» сохраняет традиционную библейскую связь с языком Божьих судов.
theological_decisions:
- issue: Референт и образ αὐτῆς
  choice: 'Сохранён женский род: «от неё», «грехах её», «язвам её».'
  alternative: Использовать средний род и представить Вавилон прежде всего как безличный город или строй.
  rationale: Контекст Откровения олицетворяет Вавилон как женщину, одновременно изображая его городом; женский род сохраняет эту намеренную образность.
- issue: Связь двух предложений с ἵνα μή
  choice: 'Обе цели переданы как однородные зависимые конструкции после одного «чтобы»: не участвовать и не подвергнуться.'
  alternative: Повторить «чтобы» или передать обе части через «дабы не».
  rationale: Повтор ἵνα подчёркивает две согласованные цели или предупреждения. Русское однократное «чтобы» с однородными инфинитивами сохраняет связь и избегает тяжеловесности.
- issue: Характер «язв её»
  choice: Формулировка не уточняет, принадлежат ли язвы Вавилону как постигшие его или связаны с ним иным образом.
  alternative: Разъяснить как «язвы, посланные на неё».
  rationale: Греческий родительный допускает контекстуально ясную, но формально не развёрнутую связь; перевод не должен добавлять отсутствующее пояснение.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической речи. Инверсия «услышал я» и постпозиция местоимения в «народ Мой», «грехах её», «язвам её» поддерживают возвышенный библейский регистр без архаических форм; пунктуация и синтаксис остаются понятными современному читателю.
