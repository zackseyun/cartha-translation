  edition: SBLGNT
  text: ἀπὸ μακρόθεν ἑστηκότες διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, Βαβυλὼν ἡ πόλις ἡ ἰσχυρά, ὅτι μιᾷ ὥρᾳ ἦλθεν ἡ κρίσις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/010.yaml
  text: standing far off because of the fear of her torment[a], saying, ‘Woe, woe, the great city, Babylon[b], the strong city! For in one hour your judgment has come.’
translation:
  language: ru
  text: 'Стоя вдали из страха перед её мучением, они говорили: «Горе, горе тебе, великий город, Вавилон, город могучий! Ибо в один час настал суд над тобой».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ μακρόθεν ἑστηκότες
  choice: стоя вдали
  rationale: Оборот передаёт устойчивое положение на значительном расстоянии; русское деепричастие естественно сохраняет образ и связь с последующим λέγοντες.
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: из страха перед её мучением
  rationale: διά с винительным обозначает причину, а βασανισμός — тяжкое мучение. Формулировка сохраняет страх наблюдателей перед постигшей город участью.
- source_word: λέγοντες
  choice: они говорили
  rationale: Личное местоимение добавлено ради естественной русской конструкции после деепричастного оборота; новых участников оно не вводит.
- source_word: Οὐαὶ οὐαί
  choice: Горе, горе
  rationale: Возглас сочетает плач и предвестие гибели; «горе» сохраняет пророческую и апокалиптическую силу.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: великий город
  rationale: Прямое и естественное соответствие усиленной греческой именной группе.
- source_word: Βαβυλὼν
  choice: Вавилон
  rationale: Принятая русская форма библейского имени.
- source_word: ἡ πόλις ἡ ἰσχυρά
  choice: город могучий
  rationale: ἰσχυρός выражает силу и мощь; «могучий» естественно звучит в торжественном обращении и не ограничивает смысл физической крепостью.
- source_word: μιᾷ ὥρᾳ
  choice: в один час
  rationale: Сохраняет временное выражение и подчёркивает внезапность суда.
- source_word: ἦλθεν ἡ κρίσις σου
  choice: настал суд над тобой
  rationale: ἦλθεν обозначает наступление события, а «суд над тобой» ясно передаёт, что κρίσις направлен на Вавилон, не создавая ошибочного впечатления о суде, совершаемом им.
theological_decisions:
- issue: Двойной возглас οὐαὶ
  choice: Горе, горе
  alternative: Увы, увы
  rationale: «Горе» удерживает одновременно плач и пророческое возвещение бедствия, тогда как «увы» сильнее смещает смысл к одному лишь сожалению.
- issue: Направленность выражения ἡ κρίσις σου
  choice: суд над тобой
  alternative: твой суд
  rationale: Родительное местоимение указывает на суд, постигший Вавилон. Более явная русская конструкция устраняет грамматическую двусмысленность, не уточняя природу суда сверх исходного текста.
- issue: Образ «одного часа»
  choice: в один час
  alternative: за один час
  rationale: Буквальная временная формула сохраняет апокалиптический образ внезапности и не решает сверх текста, обозначает ли «час» точную продолжительность или краткий срок.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Синтаксис сделан естественным для русского, при этом сохранены повтор возгласа, образ расстояния и внезапность суда.
