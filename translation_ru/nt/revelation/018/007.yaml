  text: ὅσα ἐδόξασεν αὑτὴν καὶ ἐστρηνίασεν, τοσοῦτον δότε αὐτῇ βασανισμὸν καὶ πένθος. ὅτι ἐν τῇ καρδίᾳ αὐτῆς λέγει ὅτι Κάθημαι βασίλισσα, καὶ χήρα οὐκ εἰμί, καὶ πένθος οὐ μὴ ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/007.yaml
  text: As much as she glorified herself and lived in luxury[a], give her that much torment and mourning. For she says in her heart, ‘I sit as a queen, and I am not a widow[b], and I will certainly never see mourning.’
translation:
  language: ru
  text: 'Сколько она прославила себя и жила в роскоши[a], столько же дайте ей мучение и скорбь. Ведь в сердце своём она говорит: «Я восседаю царицей, я не вдова и скорби никогда не увижу[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жила в самоугодливой роскоши» или «жила в чувственных наслаждениях». Греческий глагол может обозначать роскошную, разнузданную жизнь ради собственных удовольствий.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте здесь употреблено усиленное отрицание, выражающее твёрдую уверенность, что скорбь никогда не наступит.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα ... τοσοῦτον
  choice: Сколько ... столько же
  rationale: Сохраняет соотносительную конструкцию греческого текста и выраженную ею соразмерность воздаяния.
- source_word: ἐδόξασεν αὑτὴν
  choice: она прославляла себя
  rationale: Передаёт явную возвратность и смысл самопрославления, не сводя выражение лишь к почёту или богатству.
- source_word: ἐστρηνίασεν
  choice: предавалась роскоши
  rationale: Естественно передаёт роскошную, разнузданно-самоугодливую жизнь, не придавая глаголу исключительно сексуального смысла.
- source_word: δότε αὐτῇ
  choice: дайте ей
  rationale: Прямо сохраняет повелительное наклонение и судебный характер воздаяния.
- source_word: βασανισμὸν
  choice: мучения
  rationale: Передаёт тяжесть кары, не ограничивая её только физической пыткой.
- source_word: πένθος
  choice: скорби
  rationale: Подходит для скорби вследствие утраты и суда и позволяет сохранить повтор этого слова в стихе.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς λέγει
  choice: в сердце своём она говорит
  rationale: Сохраняет библейский образ внутренней речи и самоуверенности, оставаясь понятным современному читателю.
- source_word: Κάθημαι βασίλισσα
  choice: Я восседаю царицей
  rationale: Сохраняет образ царственного положения и уверенного пребывания на престоле; «восседаю» естественно передаёт этот образ по-русски.
- source_word: χήρα οὐκ εἰμί
  choice: я не вдова
  rationale: Прямая передача образа женщины, считающей себя защищённой от утраты и оставленности.
- source_word: οὐ μὴ ἴδω
  choice: никогда не увижу
  rationale: Передаёт категорическую уверенность говорящей; усиленная греческая отрицательная конструкция поясняется в сноске.
theological_decisions:
- issue: Олицетворение Вавилона как женщины, царицы и вдовы
  choice: 'Последовательно сохранён женский образ: «она», «царицей», «вдова».'
  alternative: Передать Вавилон безлично как город или экономическую систему.
  rationale: Женское олицетворение последовательно выражено в греческом тексте и существенно для пророческого образа самовозвышения и последующего суда.
- issue: Характер суда в слове βασανισμός
  choice: мучения
  alternative: пытка; боль
  rationale: «Мучения» сохраняет суровость судебного воздаяния, но не уточняет его способ сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, пророческим звучанием. Библейский оборот «в сердце своём» и царственный глагол «восседаю» сохранены ради образности; синтаксис остаётся ясным для обычного читателя.
