  text: καὶ ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν καὶ ⸀ἔκραξαν κλαίοντες καὶ ⸀πενθοῦντες λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἐν ᾗ ἐπλούτησαν πάντες οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ ἐκ τῆς τιμιότητος αὐτῆς, ὅτι μιᾷ ὥρᾳ ἠρημώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/019.yaml
  text: And they threw dust on their heads and cried out[a], weeping and mourning, saying, “Woe, woe, the great city, in which all who had ships on the sea became rich from her wealth[b], because in one hour she has been laid waste.”
translation:
  language: ru
  text: 'И они посыпали головы пылью и кричали, плача и скорбя: «Горе, горе великому городу, в котором разбогатели все, у кого были корабли в море, благодаря его богатствам[a]! Ведь в один час он был опустошён».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «роскоши», «великолепию» или «дорогим богатствам». Греческое слово может обозначать высокую ценность, дорогостоящую роскошь или великолепие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: посыпали головы пылью
  rationale: Естественно передаёт буквальный образ и известный жест скорби, не добавляя отсутствующих в греческом тексте подробностей.
- source_word: ἔκραξαν κλαίοντες καὶ πενθοῦντες
  choice: кричали, плача и скорбя
  rationale: Сохраняет громкий характер плача и различает физическое проявление слёз и более широкое состояние скорби.
- source_word: Οὐαὶ οὐαί
  choice: Горе, горе тебе
  rationale: «Горе» сохраняет одновременно плачевный и пророчески-судебный оттенок междометия; местоимение «тебе» естественно по-русски при последующем обращении к городу.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: великий город
  rationale: Прямое и естественное соответствие греческой определённой именной группе.
- source_word: ἐν ᾗ ἐπλούτησαν
  choice: чьей … обогатились
  rationale: В русском инструментальная конструкция естественно выражает связь между городом, его роскошью и обогащением судовладельцев, не превращая сам город в буквальное место их обогащения.
- source_word: οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ
  choice: все, у кого были корабли в море
  rationale: Близко следует греческому ἔχοντες и не уточняет владение сильнее, чем исходный текст.
- source_word: ἐκ τῆς τιμιότητος αὐτῆς
  choice: чьей роскошью
  rationale: В коммерческом контексте τιμιότης указывает на дорогостоящую роскошь, великолепие и ценность; «роскошь» хорошо связывает стих с торговой тематикой главы.
- source_word: μιᾷ ὥρᾳ ἠρημώθη
  choice: в один час ты был опустошён
  rationale: Сохраняет подчёркнутую внезапность, страдательный залог и достигнутое состояние разорения.
theological_decisions:
- issue: Значение плачевной формулы Οὐαὶ οὐαί в контексте апокалиптического суда
  choice: Горе, горе тебе
  alternative: Увы, увы
  rationale: «Горе» удерживает напряжение между плачем о городе и провозглашением суда; «увы» передало бы плач, но ослабило бы пророческий оттенок.
- issue: Обращение к великому городу в последней части возгласа
  choice: ты был опустошён
  alternative: он был опустошён
  rationale: Хотя грамматически греческое ἠρημώθη относится к πόλις в третьем лице, весь возглас естественно воспринимается как обращение к городу; русское второе лицо обеспечивает связность, не меняя содержания суда.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Синтаксис упрощён для устного восприятия, тогда как повтор «Горе, горе» и образ внезапного опустошения сохранены.
