  text: Καὶ κλαύσουσιν καὶ κόψονται ἐπ’ αὐτὴν οἱ βασιλεῖς τῆς γῆς οἱ μετ’ αὐτῆς πορνεύσαντες καὶ στρηνιάσαντες, ὅταν βλέπωσιν τὸν καπνὸν τῆς πυρώσεως αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/009.yaml
  text: And the kings of the earth who committed sexual immorality and lived in luxury with her will weep and mourn over her when they see the smoke of her burning[b][a],
translation:
  language: ru
  text: И цари земли, которые с нею блудодействовали и предавались роскоши, будут плакать и скорбеть о ней[a], когда увидят дым её пожара.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут бить себя в грудь», «будут причитать»; греческий глагол подразумевает явное, демонстративное выражение скорби.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαύσουσιν
  choice: будут плакать
  rationale: Будущее время κλαίω обозначает плач, нередко слышимый; «будут плакать» естественно передаёт эмоциональную силу глагола.
- source_word: κόψονται
  choice: будут скорбеть
  rationale: В контексте оплакивания средняя форма κόπτω обозначает явное, обрядово выражаемое горе; перевод передаёт смысл идиомы, не создавая ложного впечатления о нанесении себе ран.
- source_word: ἐπ’ αὐτὴν
  choice: о ней
  rationale: При глаголах плача ἐπί с винительным указывает на того, кого оплакивают; по-русски естественно «скорбеть о ней».
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: цари земли
  rationale: Устойчивое апокалиптическое обозначение земных правителей; «земли» сохраняет широкий, мировой охват выражения.
- source_word: μετ’ αὐτῆς
  choice: вместе с нею
  rationale: Оборот поставлен перед двумя однородными сказуемыми, чтобы естественно отнести связь с ней к обоим причастиям, как допускает греческий синтаксис.
- source_word: πορνεύσαντες
  choice: блудодействовали
  rationale: Слово сохраняет сексуальную образность греческого текста и одновременно допускает характерный для Откровения переносный смысл неверности и порочного союза.
- source_word: στρηνιάσαντες
  choice: предавались роскоши
  rationale: Глагол выражает самодовольную, необузданную роскошную жизнь; выбранная формулировка ясна и передаёт нравственно-критическую окраску.
- source_word: ὅταν βλέπωσιν
  choice: когда увидят
  rationale: Ὅταν с сослагательным наклонением здесь выражает будущее обстоятельство; это естественный русский эквивалент.
- source_word: τὸν καπνὸν
  choice: дым
  rationale: Прямой и естественный русский эквивалент.
- source_word: τῆς πυρώσεως αὐτῆς
  choice: от охватившего её пожара
  rationale: Формулировка естественно передаёт процесс уничтожения огнём, обозначенный πύρωσις, не подменяя его более специальным образом «огненного мучения».
theological_decisions:
- issue: Характер образа блудодеяния Вавилона
  choice: Сохранить в основном тексте сексуально окрашенное «блудодействовали», отметив возможную метафорическую силу образа.
  alternative: 'Передать отвлечённо: «поступали безнравственно» или «вступали с нею в порочный союз».'
  rationale: В Откровении образ блуда связан с идолопоклонством и порочными союзами, но перевод не должен устранять сексуальную образность или сводить её только к одному символическому толкованию.
- issue: Передача κόψονται
  choice: Передать смысл оплакивания словом «скорбеть».
  alternative: «Будут бить себя в грудь» или буквально «будут бить себя».
  rationale: В данном обороте глагол обозначает демонстративное оплакивание. Смысловой перевод избегает ошибочного акцента на самоповреждении, а телесная образность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. «Цари земли» сохраняет библейскую образность; «предавались роскоши» понятно современному читателю. Буква «ё» употреблена последовательно там, где требуется.
