  verdict: revise
  source_fidelity: 'Основной смысл передан верно: будущий плач и ритуальное оплакивание царей земли, их связь с Вавилоном в блуде и роскоши, а также дым её горения сохранены. Однако «от охватившего её пожара» добавляет отсутствующую в греческом характеристику пожара («охватившего») и несколько смещает τῆς πυρώσεως αὐτῆς, буквально обозначающее её горение/пожар.'
  naturalness: Текст в целом литературен и понятен. «Блудодействовали» уместно в возвышенно-библейском регистре, хотя конструкция «вместе с нею» менее прямо выражает «с нею», чем возможно в русском. «Дым от её пожара» естественнее и точнее, чем развёрнутое описание пожара.
  terminology: «Цари земли», «блудодействовали», «предавались роскоши», «плакать и скорбеть» сохраняют апокалиптический регистр и не навязывают толкования образа блуда. Сноска b корректно отмечает метафорическую функцию, не устраняя сексуальную образность. В сноске a более точным буквальным ориентиром будет «бить себя в грудь», а не неопределённое «бить себя».
  issues:
  - severity: medium
    issue: Добавлено описание пожара как «охватившего её».
