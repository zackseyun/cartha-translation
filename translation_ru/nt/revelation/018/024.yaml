  text: καὶ ἐν αὐτῇ ⸀αἷμα προφητῶν καὶ ἁγίων εὑρέθη καὶ πάντων τῶν ἐσφαγμένων ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/024.yaml
  text: And in her was found the blood of prophets and saints[c][b][a], and of all who have been slaughtered on the earth.
translation:
  language: ru
  text: И в ней[c] была найдена кровь пророков, святых[a] и всех закланных[b] на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвящённых Богу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «убитых». Греческое слово указывает на насильственное умерщвление и сильнее общего слова «убить».'
    reason: lexical_alternative
  - marker: c
    text: «Она» — Вавилон, изображённый в окружающем видении как женщина.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: в ней
  rationale: Местоимение женского рода относится к Вавилону, который в контексте представлен как город и как женщина; «в ней» сохраняет это олицетворение.
- source_word: αἷμα
  choice: кровь
  rationale: Прямое соответствие греческому слову; в контексте также подразумевает вину за пролитую кровь.
- source_word: προφητῶν
  choice: пророков
  rationale: Обычный и точный русский эквивалент.
- source_word: ἁγίων
  choice: святых
  rationale: Краткое и традиционное обозначение посвящённых Богу людей; контекст говорит о людях, а не об абстрактной святости.
- source_word: εὑρέθη
  choice: была найдена
  rationale: Сохраняет страдательный залог и судебно-обличительный оттенок обнаружения.
- source_word: πάντων τῶν ἐσφαγμένων
  choice: всех убитых
  rationale: Причастие σφάζω обозначает насильственное умерщвление и может передаваться как «закланных» или «убитых». В основном тексте выбрано естественное современное «убитых», а более сильный оттенок отмечен в сноске.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: В апокалиптическом контексте Откровения γῆ здесь имеет широкий смысл всей земли, а не отдельной страны.
theological_decisions:
- issue: Отнесение местоимения и образ Вавилона
  choice: «в ней» сохраняет женское олицетворение Вавилона
  alternative: «в нём» с пониманием Вавилона только как города
  rationale: Греческое αὐτῇ имеет женский род, а окружающее видение изображает Вавилон как женщину; перевод не должен устранять этот образ.
- issue: Масштаб вины Вавилона
  choice: 'Сохранено всеохватное обвинение: кровь всех убитых на земле найдена в ней'
  alternative: Понимать последнюю часть как риторическое преувеличение или как указание только на праведных мучеников
  rationale: Греческий текст не уточняет, как всеохватное образное обвинение соотносится с исторической действительностью, поэтому перевод сохраняет его широту и напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического судебного изречения. Синтаксис близок к греческому, но естественен по-русски; традиционное «святых» пояснено, а более резкий оттенок σφάζω вынесен в сноску.
