id: REV.18.2
reference: Revelation 18:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν ⸀ἐν ἰσχυρᾷ φωνῇ λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, καὶ ἐγένετο κατοικητήριον ⸀δαιμονίων καὶ φυλακὴ παντὸς πνεύματος ἀκαθάρτου καὶ φυλακὴ παντὸς ὀρνέου ἀκαθάρτου ⸂καὶ φυλακὴ παντὸς θηρίου ἀκαθάρτου⸃ καὶ μεμισημένου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/002.yaml
  text: And he cried out with a mighty voice[a], saying, “Fallen, fallen is Babylon the great! She has become a dwelling place of demons, a prison of every unclean spirit, a prison of every unclean bird[b], and a prison of every unclean and hated beast.”
translation:
  language: ru
  text: 'И он возгласил могучим голосом: «Пал, пал Вавилон великий! Вавилон стал жилищем демонов, темницей[a] для всякого нечистого духа, темницей для всякой нечистой птицы и темницей для всякого нечистого и ненавистного зверя[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пристанищем для всякого нечистого духа… всякой нечистой птицы… всякого нечистого и ненавистного зверя». Греческое слово, переведённое как «темница», может также обозначать место, где кто-либо содержится, обитает или часто бывает.'
    reason: lexical_alternative
  - marker: b
    text: В некоторых рукописях нет слов «и темницей для всякого нечистого и ненавистного зверя».
    reason: textual_variant
lexical_decisions:
- source_word: ἔκραξεν ἐν ἰσχυρᾷ φωνῇ
  choice: возгласил могучим голосом
  rationale: Сочетание передаёт громкий, сильный возглас и сохраняет возвышенный тон Откровения без разговорного оттенка.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: Пал, пал
  rationale: Повтор аориста сохранён как торжественное пророческое провозглашение суда; мужской род согласован с русским названием «Вавилон».
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Вавилон великий
  rationale: Сохранена постпозитивная, почти титульная конструкция греческого текста.
- source_word: ἐγένετο κατοικητήριον δαιμονίων
  choice: стал жилищем демонов
  rationale: «Стал» выражает наступившее состояние, κατοικητήριον прямо передано как «жилище», а δαιμόνια — как «демоны», без обобщающей замены на «злых духов».
- source_word: φυλακή
  choice: темница
  rationale: Слово может обозначать стражу, место содержания или заключения. «Темница» сохраняет образ удерживания и соответствует возвышенному апокалиптическому регистру; контекстуальная возможность значения «пристанище» отмечена в сноске.
- source_word: παντὸς πνεύματος ἀκαθάρτου
  choice: всякого нечистого духа
  rationale: Сохранены универсальность παντός и традиционная библейская лексика чистоты и нечистоты.
- source_word: παντὸς ὀρνέου ἀκαθάρτου
  choice: всякой нечистой птицы
  rationale: ὄρνεον означает птицу; перевод не добавляет отсутствующего в тексте уточнения о хищной или падальщиках.
- source_word: παντὸς θηρίου ἀκαθάρτου καὶ μεμισημένου
  choice: всякого нечистого и ненавистного зверя
  rationale: θηρίον передано как нарицательное «зверь», а перфектное пассивное причастие μεμισημένου — как «ненавистный», с сохранением идеи того, что зверь является предметом ненависти.
theological_decisions:
- issue: Следует ли понимать θηρίον как титул апокалиптического Зверя
  choice: нарицательное «зверь» со строчной буквы
  alternative: «Зверь» как обозначение особого противника из других мест Откровения
  rationale: Здесь слово зависит от παντός и входит в перечисление наряду с нечистыми духами и птицами, поэтому синтаксис указывает на общее обозначение животных, а не на единичного символического персонажа.
- issue: Как передать φυλακή в картине суда над Вавилоном
  choice: «темница» с указанием альтернативы в сноске
  alternative: «пристанище» или «обиталище»
  rationale: «Темница» непосредственно отражает значение места содержания под стражей, но греческое слово и контекст допускают образ места, где нечистые существа обитают или постоянно водятся; неоднозначность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим ритмом. Повторы исходного текста сохранены намеренно. Местоимение «он» относится к возвещающему ангелу из контекста; для Вавилона далее также употреблён грамматически мужской род, естественный для русского названия города.
