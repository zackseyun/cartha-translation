    issue: Примечание a даёт вариант «спускающегося с небес».
    rationale: 'В греческом тексте стоит единственное число: ἐκ τοῦ οὐρανοῦ, «с неба». Русское «с небес» может быть стилистически привычным, но как заявленный лексический вариант меняет число исходного выражения. Безопаснее дать вариант «нисходящего с неба».'
  - severity: medium
    issue: Примечание b, помеченное как буквальное, использует «земля озарилась».
    rationale: 'ἐφωτίσθη — аорист страдательного залога: «земля была озарена». Возвратная форма «озарилась» не воспроизводит этот залог и потому не должна выдаваться за буквальный вариант.'
