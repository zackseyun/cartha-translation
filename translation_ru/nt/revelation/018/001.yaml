  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον ἄλλον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα ἐξουσίαν μεγάλην, καὶ ἡ γῆ ἐφωτίσθη ἐκ τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/001.yaml
  text: After these things I saw another angel coming down out of heaven[a], having great authority[b], and the earth was illuminated by his glory.
translation:
  language: ru
  text: После всего этого я увидел другого ангела, сходящего с неба[a]. Он обладал великой властью, и земля была озарена его славой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нисходящего с неба».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «земля была озарена от его славы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: После всего этого
  rationale: Передаёт последовательность видений и сохраняет множественное ταῦτα посредством естественного русского выражения «всего этого».
- source_word: εἶδον
  choice: я увидел
  rationale: Прямо передаёт аорист ὁράω, вводящий новую сцену видения, без добавления отсутствующих в тексте оттенков.
- source_word: ἄλλον ἄγγελον
  choice: другого ангела
  rationale: 'Естественно и точно передаёт ἄλλον: ещё одного ангела в последовательности видений.'
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: сходящего с неба
  rationale: Настоящее причастие представляет действие как происходящее в момент видения; «с неба» естественно передаёт исходную точку, выраженную ἐκ.
- source_word: ἔχοντα ἐξουσίαν μεγάλην
  choice: Он обладал великой властью
  rationale: ἐξουσία здесь обозначает власть или полномочия, а не просто физическую силу. Отдельное предложение устраняет тяжеловесное нанизывание русских причастий, не меняя смысла.
- source_word: ἡ γῆ
  choice: земля
  rationale: Космический масштаб образа освещения поддерживает широкое значение «земля», а не локальное «страна» или «суша».
- source_word: ἐφωτίσθη
  choice: была озарена
  rationale: Сохраняет страдательное значение аориста φωτίζω и соответствует возвышенному характеру видения.
- source_word: ἐκ τῆς δόξης αὐτοῦ
  choice: его славой
  rationale: Русский творительный естественно выражает источник или средство озарения; более буквальное указание на источник через «от» дано в примечании.
theological_decisions:
- issue: Природа славы и власти ангела
  choice: Текст прямо приписывает ангелу великую власть и славу, озаряющую землю, не называя его божественным.
  alternative: Необычайный масштаб сияния может побуждать к усиленному или божественному прочтению образа ангела.
  rationale: Перевод без смягчения сохраняет выражения о власти и славе ангела, но не добавляет утверждения о его природе, которого нет в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным регистром. Причастный оборот сохранён для зрительной одновременности, а второй греческий причастный оборот преобразован в отдельное предложение ради естественного русского синтаксиса.
