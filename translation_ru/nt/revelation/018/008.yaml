id: REV.18.8
reference: Revelation 18:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν μιᾷ ἡμέρᾳ ἥξουσιν αἱ πληγαὶ αὐτῆς, θάνατος καὶ πένθος καὶ λιμός, καὶ ἐν πυρὶ κατακαυθήσεται· ὅτι ἰσχυρὸς κύριος ὁ θεὸς ὁ κρίνας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/008.yaml
  text: 'For this reason, in one day her plagues will come: death and mourning and famine, and she will be burned up with fire; because strong is the Lord God who judged her.'
translation:
  language: ru
  text: 'Поэтому в один день придут на неё бедствия: смерть, скорбь и голод. Она будет сожжена огнём, потому что силён Господь Бог, осудивший её.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληγαί
  choice: бедствия
  rationale: В данном контексте слово обозначает ниспосланные кары и губительные бедствия; «бедствия» естественно по-русски и не сужает смысл до телесных поражений.
- source_word: πένθος
  choice: скорбь
  rationale: Передаёт траур и глубокое горе, составляющие один из перечисленных судов.
- source_word: ἐν πυρὶ κατακαυθήσεται
  choice: будет сожжена огнём
  rationale: Сохраняет страдательный залог и усиленное значение полного сожжения без тяжеловесного «будет сожжена дотла в огне».
- source_word: ἰσχυρός
  choice: силён
  rationale: Прямо сохраняет характеристику силы Бога, данную в греческом тексте, вместо близкого, но менее буквального «могуществен».
- source_word: ὁ κρίνας αὐτήν
  choice: осудивший её
  rationale: В контексте судебного наказания аористное причастие указывает на Бога, вынесшего ей приговор; «осудивший» естественно выражает этот смысл.
theological_decisions:
- issue: Основание неизбежности суда
  choice: «потому что силён Господь Бог, осудивший её»
  alternative: «ибо могуществен Господь Бог, судящий её»
  rationale: Перевод сохраняет причинную связь ὅτι, качество ἰσχυρός и предшествующий по виду акт суда в ὁ κρίνας, не превращая причастие в настоящее время.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Женский род местоимений сохранён в соответствии с образом Вавилона в контексте.
