  text: And they cried out as they saw the smoke of her burning[a], saying, “What city is like the great city?”
translation:
  language: ru
  text: 'И они закричали, видя дым от её пожара: «Какой город подобен великому городу?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Кто (или что) подобен великому городу?» В греческом вопрос эллиптичен; слово «город» добавлено в переводе для ясности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξαν
  choice: закричали
  rationale: Аорист κράζω обозначает громкий возглас; «закричали» естественно передаёт его силу.
- source_word: βλέποντες
  choice: увидев
  rationale: Причастие выражает действие, связанное с главным глаголом; деепричастие естественно передаёт обстоятельство, вызвавшее крик.
- source_word: τὸν καπνὸν τῆς πυρώσεως αὐτῆς
  choice: дым от её пожара
  rationale: Передаёт дым, исходящий от охватившего город огня, и сохраняет женское местоимение, соответствующее олицетворённому городу.
- source_word: Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
  choice: Какой город подобен великому городу?
  rationale: В греческом вопрос эллиптичен, а связка не выражена. Добавление «город» делает сравнение ясным по-русски, не вводя времени глагола.
- source_word: τῇ πόλει τῇ μεγάλῃ
  choice: великому городу
  rationale: Прямо передаёт определённое обозначение уже известного из контекста великого города.
theological_decisions:
- issue: Олицетворение Вавилона как женщины и города
  choice: сохранить женское местоимение «её»
  alternative: 'передать без местоимения: «дым от пожара города»'
  rationale: В Откровении Вавилон последовательно изображён и как женщина, и как город; женский род русского слова «город» здесь также позволяет естественно сохранить этот образ.
- issue: Время подразумеваемой связки в риторическом вопросе
  choice: использовать безвременную именную конструкцию «подобен»
  alternative: «Какой город был подобен великому городу?»
  rationale: В греческом тексте связка отсутствует, поэтому перевод не должен без необходимости определять настоящее или прошедшее время.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной лексикой. Синтаксис сохраняет напряжённость повествования и риторическую силу плача.
