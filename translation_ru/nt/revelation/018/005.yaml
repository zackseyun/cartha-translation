id: REV.18.5
reference: Revelation 18:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι ἐκολλήθησαν αὐτῆς αἱ ἁμαρτίαι ἄχρι τοῦ οὐρανοῦ, καὶ ἐμνημόνευσεν ὁ θεὸς τὰ ἀδικήματα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/005.yaml
  text: for her sins have piled up as high as heaven, and God has remembered her wrongdoings.
translation:
  language: ru
  text: потому что её грехи нагромоздились до самого неба[a], и Бог вспомнил её неправедные дела[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соединились вплоть до неба». Греческий глагол буквально означает «склеились, соединились»; здесь он изображает грехи, скопившиеся огромной грудой.'
    reason: lexical_alternative
  - marker: b
    text: 'В данном контексте «вспомнил» имеет судебный смысл: Бог не оставил её неправедные дела без внимания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Передаёт причинное значение союза и связывает стих с повелением предыдущего стиха.
- source_word: ἐκολλήθησαν
  choice: нагромоздились
  rationale: Буквально глагол означает «склеились, соединились, пристали»; при подлежащем «грехи» и выражении «до неба» он метафорически рисует огромную накопившуюся груду. «Нагромоздились» естественно передаёт этот образ по-русски.
- source_word: αἱ ἁμαρτίαι
  choice: грехи
  rationale: Обычный и точный русский эквивалент ἁμαρτίαι.
- source_word: ἄχρι τοῦ οὐρανοῦ
  choice: до самого неба
  rationale: Передаёт предел и сохраняет вертикальный образ; частица «самого» естественно подчёркивает колоссальный масштаб накопления.
- source_word: ἐμνημόνευσεν
  choice: вспомнил
  rationale: Сохраняет прямое значение греческого глагола и не подменяет подразумеваемое судебное действие явным толкованием вроде «привлёк к ответу».
- source_word: ὁ θεός
  choice: Бог
  rationale: Прямой общепринятый эквивалент.
- source_word: τὰ ἀδικήματα
  choice: неправедные дела
  rationale: Передаёт конкретные проявления неправды и сохраняет лексическое отличие от ранее упомянутых «грехов».
theological_decisions:
- issue: Различение ἁμαρτίαι и ἀδικήματα в одном стихе
  choice: 'Передать разными выражениями: «грехи» и «неправедные дела»'
  alternative: Передать оба слова как «грехи» или «беззакония»
  rationale: Греческий текст употребляет два близких, но разных слова. Их различение сохраняет риторическую полноту оригинала, не навязывая чрезмерно резкого богословского разграничения.
- issue: Смысл Божьего воспоминания
  choice: «Бог вспомнил»
  alternative: «Бог призвал к ответу» или «Бог подверг суду»
  rationale: В библейском контексте Божье воспоминание предполагает последующее действие, здесь — судебное, однако сам глагол означает «вспомнил». Буквальная передача сохраняет богословскую напряжённость и не разворачивает подразумеваемое в парафраз.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным апокалиптического контекста звучанием. Образ накопившихся до неба грехов сохранён; различие между «грехами» и «неправедными делами» также удержано.
