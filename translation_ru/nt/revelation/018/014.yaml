id: REV.18.14
reference: Revelation 18:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἡ ὀπώρα ⸂σου τῆς ἐπιθυμίας τῆς ψυχῆς⸃ ἀπῆλθεν ἀπὸ σοῦ, καὶ πάντα τὰ λιπαρὰ καὶ τὰ λαμπρὰ ἀπώλετο ἀπὸ σοῦ, καὶ ⸀οὐκέτι ⸂οὐ μὴ αὐτὰ εὑρήσουσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/014.yaml
  text: And the fruit of your soul’s desire has gone away from you[a], and all the rich and splendid things have perished from you[b], and they will never be found again.
translation:
  language: ru
  text: И плод, которого жаждала твоя душа, ушёл от тебя, и всё роскошное и блистательное исчезло у тебя, и больше этого никогда не найдут.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и они уже никогда этого не найдут»; в греческом тексте действующее лицо не названо.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπώρα
  choice: спелые плоды
  rationale: Слово обозначает плод, особенно созревший или поздний плод; множественное число естественно по-русски передаёт собирательное значение и сохраняет образ желанных яств.
- source_word: σου τῆς ἐπιθυμίας τῆς ψυχῆς
  choice: которых жаждала твоя душа
  rationale: Передаёт вложенную генитивную конструкцию естественным русским придаточным оборотом, сохраняя и ψυχή («душа»), и силу внутреннего желания.
- source_word: ἀπῆλθεν ἀπὸ σοῦ
  choice: ушли от тебя
  rationale: Прямо передаёт удаление и окончательную утрату; число согласовано с естественным русским выражением «спелые плоды».
- source_word: πάντα τὰ λιπαρὰ
  choice: всё роскошное
  rationale: В контексте торговли и богатства λιπαρά указывает шире на изобилие и роскошь, а не только на жирную пищу.
- source_word: τὰ λαμπρὰ
  choice: блистательное
  rationale: Сохраняет значение блеска и великолепия предметов роскоши и поддерживает возвышенный тон плача.
- source_word: ἀπώλετο ἀπὸ σοῦ
  choice: исчезло у тебя
  rationale: Естественно выражает необратимую утрату того, чем город прежде обладал, не сужая значение до физического уничтожения.
- source_word: οὐκέτι οὐ μὴ
  choice: больше ... никогда
  rationale: Передаёт усиленное греческое отрицание и окончательность утраты без неестественного русского удвоения.
- source_word: αὐτὰ εὑρήσουσιν
  choice: этого ... не найдут
  rationale: Сохраняет греческое третье лицо множественного числа с неопределённым субъектом, не вводя конкретных действующих лиц.
theological_decisions:
- issue: Неопределённый субъект εὑρήσουσιν
  choice: «этого никогда не найдут» — неопределённо-личная конструкция
  alternative: «этого никогда больше не будет» или «они никогда больше не будут найдены»
  rationale: Русская неопределённо-личная форма близко сохраняет активное третье лицо множественного числа греческого текста и его неуказанный субъект, не превращая его без необходимости в пассив.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но ясной интонацией пророческого плача. Обращение на «ты» соответствует единственному числу греческого σου и персонификации Вавилона. Маркер сноски помещён после относящегося к нему заключительного оборота.
