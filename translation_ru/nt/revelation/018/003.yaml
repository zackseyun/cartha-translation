  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς ⸀πέπτωκαν πάντα τὰ ἔθνη, καὶ οἱ βασιλεῖς τῆς γῆς μετ’ αὐτῆς ἐπόρνευσαν, καὶ οἱ ἔμποροι τῆς γῆς ἐκ τῆς δυνάμεως τοῦ στρήνους αὐτῆς ἐπλούτησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/003.yaml
  text: For all the nations have drunk from the wine of the wrath of her sexual immorality[a], and the kings of the earth committed sexual immorality with her[c][b], and the merchants of the earth grew rich from the power of her luxury.
translation:
  language: ru
  text: Ибо все народы пали из-за вина ярости её разврата[a][b], цари земли предались разврату с нею[c], а купцы земли разбогатели благодаря могуществу её необузданной роскоши[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В ряде рукописей: «напились вина». Представленный текст SBLGNT имеет форму «пали», поэтому основной перевод следует этому чтению.'
    reason: textual_variant
  - marker: b
    text: 'Или: «из-за вина страсти её разврата». Греческое слово θυμός может означать как ярость или гнев, так и сильную страсть, а связь родительных падежей допускает несколько пониманий.'
    reason: lexical_alternative
  - marker: c
    text: Разврат здесь, вероятно, служит образом идолопоклоннического, порочного и эксплуататорского союза; перевод сохраняет сексуальную образность греческого текста.
    reason: alternative_reading
  - marker: d
    text: Греческое слово означает самоугодливую, надменную и чрезмерную роскошь, а не просто материальный достаток.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Ибо
  rationale: Союз вводит основание для предшествующего объявления о падении Вавилона; «ибо» сохраняет причинную связь и подходит для литературного повествования.
- source_word: ἐκ τοῦ οἴνου
  choice: из-за вина
  rationale: При чтении πέπτωκαν предлог ἐκ выражает причину или источник падения. «Из-за вина» сохраняет образ вина и делает причинную связь понятной по-русски.
- source_word: πέπτωκαν
  choice: пали
  rationale: Перевод следует непосредственно представленному тексту SBLGNT, где стоит перфект πέπτωκαν от πίπτω — «падать». Русское «пали» передаёт совершившееся падение и его сохраняющийся результат; вариант «напились» отмечен в сноске.
- source_word: θυμοῦ
  choice: ярости
  rationale: θυμός может означать ярость, гнев или сильную страсть. В насыщенном судной образностью контексте Откровения «ярость» сохраняет силу выражения, не устраняя возможного значения страсти, указанного в сноске.
- source_word: πορνείας / ἐπόρνευσαν
  choice: разврата / предавались разврату
  rationale: Так сохраняется намеренно сексуальный образ греческого текста и его лексическая связь в обеих частях стиха, без сведения метафоры исключительно к идолопоклонству или политическому союзу.
- source_word: ἔμποροι
  choice: купцы
  rationale: «Купцы» естественно обозначает участников крупной торговли и хорошо соответствует торгово-экономическому контексту главы.
- source_word: ἐκ τῆς δυνάμεως
  choice: благодаря могуществу
  rationale: Оборот передаёт источник обогащения, а «могущество» сохраняет основное значение δύναμις и подчёркивает действенную силу роскоши Вавилона.
- source_word: στρήνους
  choice: необузданной роскоши
  rationale: στρῆνος обозначает не просто достаток или комфорт, а надменную, самоугодливую и чрезмерную роскошь. Определение «необузданной» выражает этот оттенок в основном тексте.
- source_word: ἐπλούτησαν
  choice: разбогатели
  rationale: Естественный современный русский эквивалент, ясно передающий достигнутый результат обогащения.
theological_decisions:
- issue: Передавать ли πορνεία и πορνεύω сексуальной лексикой или сразу истолковать их как идолопоклонство и порочный союз
  choice: Сохранить в основном тексте слова «разврат» и «предавались разврату»
  alternative: «идолопоклонство», «духовная измена» или «вступали с нею в порочный союз»
  rationale: Откровение намеренно использует сексуальный образ для политической, экономической и религиозной неверности. Буквальная образность сохраняет богословскую многозначность и не сводит её к одному толкованию.
- issue: Как понимать цепочку родительных падежей τοῦ θυμοῦ τῆς πορνείας αὐτῆς
  choice: «вина ярости её разврата»
  alternative: «вина страсти её разврата»
  rationale: Греческая конструкция допускает разные смысловые отношения между «вином», «яростью/страстью» и «развратом». Основной текст сохраняет компактную цепочку образов, а сноска открыто указывает альтернативу.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической речи. «Ибо», «цари земли» и «купцы» поддерживают возвышенный библейский регистр без излишней архаики. Необычный образ «пали из-за вина» сохранён ради точности к представленному греческому чтению и разъяснён текстологической сноской.
