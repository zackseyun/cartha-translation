lexical_decisions:
- source_word: γόμον
  choice: груз
  rationale: Слово обозначает корабельный груз или поклажу; единственное число сохраняет собирательный смысл в перечне предметов торговли.
- source_word: λίθου τιμίου
  choice: драгоценных камней
  rationale: Русское множественное число естественно передаёт собирательное значение названия материала в торговом перечне.
- source_word: μαργαριτῶν
  choice: жемчуга
  rationale: Родительный падеж единственного числа в русском употребляется как собирательное название товара и естественно передаёт греческое множественное число.
- source_word: βυσσίνου
  choice: тонкого льна
  rationale: Обозначает дорогую тонкую льняную ткань; выражение понятно современному читателю и сохраняет оттенок роскоши.
- source_word: πορφύρας
  choice: пурпурной ткани
  rationale: Возможны значения красителя, ткани или одежды; контекст торгового перечня делает ткань наиболее естественным выбором.
- source_word: σιρικοῦ
  choice: шёлка
  rationale: Прямое и современное обозначение шёлка или шёлковой ткани.
- source_word: κοκκίνου
  choice: багряной ткани
  rationale: Обозначает материал ярко-красного цвета; добавление слова «ткань» проясняет характер товара и соответствует параллельному πορφύρας.
- source_word: πᾶν ξύλον θύϊνον
  choice: всякого туевого дерева[a]
  rationale: Редкое прилагательное обозначает дорогую ароматную древесину, традиционно называемую туевой; примечание поясняет непривычный термин, не утверждая спорную точную ботаническую идентификацию.
- source_word: πᾶν σκεῦος ἐλεφάντινον
  choice: всевозможных изделий из слоновой кости
  rationale: σκεῦος имеет широкое значение предмета, сосуда или изделия; «изделий» лучше подходит к материалу и сохраняет широту смысла.
- source_word: πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου
  choice: всевозможных изделий из самого ценного дерева
  rationale: «Самого ценного» передаёт превосходную степень τιμιωτάτου, а «изделий» естественно воспроизводит повторение σκεῦος.
- source_word: χαλκοῦ
  choice: бронзы
  rationale: χαλκός может означать медь или бронзу; в перечне древних изделий и материалов «бронза» является вероятным и привычным соответствием.
- source_word: σιδήρου
  choice: железа
  rationale: Прямое соответствие названию материала.
- source_word: μαρμάρου
  choice: мрамора
  rationale: Прямое соответствие названию материала.
