language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀπόδοτε αὐτῇ ὡς καὶ αὐτὴ ἀπέδωκεν, καὶ ⸀διπλώσατε ⸀τὰ διπλᾶ κατὰ τὰ ἔργα αὐτῆς· ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν κεράσατε αὐτῇ διπλοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/006.yaml
  text: Pay her back as she herself has paid back[a], and repay her double according to her works; in the cup that she mixed[b], mix a double portion for her.
translation:
  language: ru
  text: Отплатите ей так же, как и она сама отплатила, и воздайте ей вдвойне по её делам[a]; в чаше, в которой она смешала напиток[b], смешайте для неё двойную меру.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «удвойте ей двойное по её делам». Греческое выражение сжато и риторически усилено повтором слова «двойное»; оно может подчёркивать усиленное воздаяние.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте не названо, что именно она смешала. Глагол может означать приготовление напитка смешиванием; образ чаши связан с приготовленным для неё воздаянием.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπόδοτε αὐτῇ
  choice: Воздайте ей
  rationale: Императив передаёт требование ответного, справедливого воздаяния; «воздайте» сохраняет судебно-ретрибутивный оттенок и достоинство стиля.
- source_word: ὡς καὶ αὐτὴ ἀπέδωκεν
  choice: так, как и она воздавала
  rationale: Повтор того же русского глагола отражает лексический повтор ἀποδίδωμι, а «и она» передаёт эмфатическое αὐτή. Прошедшее несовершенного вида естественно описывает её прежнюю практику, не уточняя объект воздаяния, которого нет и в греческом тексте.
- source_word: διπλώσατε τὰ διπλᾶ
  choice: воздайте ей вдвое
  rationale: Греческое выражение с повтором корня риторически сжато и усилительно. Русское «воздайте ей вдвое» естественно передаёт удвоенное возмездие, тогда как буквально-калькированное выражение было бы неясным.
- source_word: κατὰ τὰ ἔργα αὐτῆς
  choice: по делам её
  rationale: Сохраняется буквальное значение ἔργα и идея меры воздаяния, определяемой её поступками.
- source_word: ἐν τῷ ποτηρίῳ
  choice: в чаше
  rationale: «Чаша» — естественный русский эквивалент ποτήριον, сохраняющий устойчивый библейский образ суда.
- source_word: ᾧ ἐκέρασεν
  choice: в которой она смешивала вино
  rationale: Глагол κεράννυμι обозначает смешивание или приготовление напитка, обычно вина. Добавление «вино» делает подразумеваемый объект ясным для современного читателя и согласуется с образом чаши, не заменяя сам образ общим словом «готовила».
- source_word: κεράσατε αὐτῇ διπλοῦν
  choice: смешайте для неё двойную меру
  rationale: Повтор глагола «смешивать» сохраняет словесную связь с предыдущей частью, а «двойную меру» естественно передаёт субстантивированное διπλοῦν.
theological_decisions:
- issue: Характер двойного воздаяния
  choice: Сохранить образ удвоенного судебного возмездия, не определяя, является ли удвоение точной количественной мерой или риторическим усилением.
  alternative: Истолковать «вдвое» как строгую юридическую формулу либо сгладить его до общего утверждения о справедливом суде.
  rationale: Апокалиптическая речь намеренно соединяет соответствие делам с усиленным, двойным воздаянием. Перевод сохраняет это напряжение и не навязывает более узкого толкования.
- issue: Чаша и смешанный напиток
  choice: Сохранить конкретный образ чаши со смешанным вином как образ приготовленного воздаяния.
  alternative: Прямо назвать содержимое «чашей Божьего гнева» или заменить образ отвлечённым словом «наказание».
  rationale: Контекст Откровения допускает образ суда, но сам стих не называет ни Бога, ни гнев прямо; поэтому перевод не должен вносить это истолкование в основной текст.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Лексический повтор «воздайте — воздавала» и образ чаши сохранены; необычная греческая конструкция об удвоении передана естественно, а её буквальная форма отмечена в сноске.
