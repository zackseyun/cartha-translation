  source_fidelity: 'Основной смысл передан верно: это призыв к радости по поводу Вавилона («её») и основание для него — совершённый Богом судебный акт в пользу адресатов и против неё. «Совершил над ней суд за вас» удачно сохраняет судебную, а не прямо мстительную лексику. Однако один русский императив единственного числа не может естественно управлять последующим явно множественным обращением «вы, святые, апостолы и пророки».'
  naturalness: '«Радуйся о ней, небо, а также вы...» грамматически и стилистически неровно: «а также вы» присоединено к форме единственного числа. Повторение императива во множественном числе — необходимая и не добавляющая смысла русская экспликация. «И вы» естественнее, чем «а также вы».'
