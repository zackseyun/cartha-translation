  text: Εὐφραίνου ἐπ’ αὐτῇ, οὐρανέ, καὶ οἱ ἅγιοι καὶ οἱ ἀπόστολοι καὶ οἱ προφῆται, ὅτι ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν ἐξ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/020.yaml
  text: Rejoice over her[a], O heaven, and you saints and apostles and prophets, because God has judged your judgment from her.
translation:
  language: ru
  text: Радуйся о ней[a], небо; радуйтесь и вы, святые, апостолы и пророки, потому что Бог совершил над ней суд за вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более истолковательно: «радуйтесь её гибели… потому что Бог осудил её за то, что она сделала вам» или «потому что Бог отомстил ей за вас». Греческий оборот сжат; буквально, с сохранением необычности: «Бог судил ваш суд от неё».'
    reason: Сноска отмечает, что предмет радости и судебная формула в греческом тексте выражены сжато; она предлагает истолковательные варианты, не подменяя ими основной текст.
lexical_decisions:
- source_word: Εὐφραίνου
  choice: Радуйся
  rationale: Форма повелительного наклонения во втором лице единственного числа обращена прежде всего к небу; «радуйся» ясно и естественно передаёт призыв.
- source_word: ἐπ’ αὐτῇ
  choice: о ней
  rationale: С глаголом радости ἐπί с дательным падежом обозначает предмет или повод радости. «О ней» сохраняет краткость и не добавляет в основной текст уточнение «о её гибели».
- source_word: οὐρανέ
  choice: небо
  rationale: Сохраняет прямое обращение к олицетворённому небу без архаического русского звательного оборота.
- source_word: οἱ ἅγιοι
  choice: святые
  rationale: Краткое и установившееся обозначение принадлежащих Богу людей; в данном контексте оно естественнее развёрнутого «святой народ Божий».
- source_word: οἱ ἀπόστολοι
  choice: апостолы
  rationale: В сочетании с пророками наиболее вероятно специальное значение «апостолы», а не общее «посланники».
- source_word: οἱ προφῆται
  choice: пророки
  rationale: Прямое и естественное соответствие греческому слову в данном контексте.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно вводит основание призыва к радости.
- source_word: ἔκρινεν ὁ θεὸς
  choice: Бог совершил суд
  rationale: Передаёт завершённое судебное действие Бога и сохраняет лексику суда, не заменяя её прямым указанием на месть.
- source_word: τὸ κρίμα ὑμῶν ἐξ αὐτῆς
  choice: над ней суд за вас
  rationale: Греческий оборот сжат и буквально необычен. Русская формулировка передаёт судебное действие против Вавилона в защиту названных людей, но не вводит более сильный глагол «отомстил».
theological_decisions:
- issue: Насколько явно истолковать Божий суд над Вавилоном как возмездие за святых
  choice: «Бог совершил над ней суд за вас»
  alternative: '«Бог отомстил ей за вас»; «Бог взыскал с неё за вас»; буквально: «Бог судил ваш суд от неё»'
  rationale: Греческий текст употребляет однокоренные слова κρίνω и κρίμα, а не явный глагол мести. Основной текст сохраняет судебный образ и смысл действия в пользу пострадавших, тогда как буквальная сжатость и более толковательные варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным звучанием. Единственное число «Радуйся» сохраняет обращение к небу; оборот «а также вы» естественно присоединяет святых, апостолов и пророков, не создавая ошибочного согласования. Судебная лексика сохранена, а прямое толкование как мести вынесено в сноску.
