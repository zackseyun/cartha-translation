source:
  edition: SBLGNT
  text: καὶ φωνὴ κιθαρῳδῶν καὶ μουσικῶν καὶ αὐλητῶν καὶ σαλπιστῶν οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι, καὶ πᾶς τεχνίτης πάσης τέχνης οὐ μὴ εὑρεθῇ ἐν σοὶ ἔτι, καὶ φωνὴ μύλου οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/022.yaml
  text: And the sound of harpists and musicians and flute players and trumpeters will never be heard in you again[a], and no craftsman of any craft will ever be found in you again, and the sound of a mill will never be heard in you again[b],
translation:
  language: ru
  text: И звука кифаристов, музыкантов, флейтистов и трубачей уже никогда не услышат в тебе[a]; и ни одного мастера какого бы то ни было ремесла уже никогда не найдут в тебе; и звука жернова уже никогда не услышат в тебе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально речь идёт об исполнителях на авлосе — древнем духовом инструменте, не вполне тождественном современной флейте.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «звука мельницы». Греческое слово может обозначать мельничное устройство или жернов; здесь имеется в виду звук помола.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: звук / шум
  rationale: В контексте речь идёт не о голосе как речи, а о слышимом звуке. Для музыкантов естественно «звук», а для жерновов — «шум»; при этом повтор исходного слова отражён общей звуковой образностью.
- source_word: κιθαρῳδῶν
  choice: кифаристов
  rationale: Слово обозначает исполнителей, связанных с кифарой. «Кифаристы» точнее сохраняет реалии древности, чем «арфисты», и понятно из контекста как название музыкантов.
- source_word: μουσικῶν
  choice: музыкантов
  rationale: Это естественное современное обобщающее обозначение музыкальных исполнителей; более узкое «певцов» здесь не требуется контекстом.
- source_word: αὐλητῶν
  choice: флейтистов
  rationale: Доступный русский эквивалент для исполнителей на авлосе; сноска уточняет, что древний авлос не был тождествен современной флейте.
- source_word: σαλπιστῶν
  choice: трубачей
  rationale: Прямое, краткое и естественное обозначение играющих на трубе.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: уже никогда не услышат
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает решительное отрицание, а ἔτι — прекращение навсегда. Активная неопределённо-личная конструкция естественна по-русски и сохраняет смысл греческого пассива.
- source_word: ἐν σοὶ
  choice: в тебе
  rationale: Сохраняет прямое обращение к Вавилону, олицетворённому как город.
- source_word: πᾶς τεχνίτης πάσης τέχνης
  choice: ни одного мастера какого бы то ни было ремесла
  rationale: Передаёт всеохватность исходного выражения и его смысловую повторность естественным современным русским языком.
- source_word: οὐ μὴ εὑρεθῇ ... ἔτι
  choice: уже никогда не найдут
  rationale: Передаёт категорическую и окончательную невозможность обнаружить в городе какого-либо ремесленника.
- source_word: μύλου
  choice: жерновов
  rationale: В данном образе μύλος обозначает мельничное устройство или жернова; множественное число «жерновов» естественно называет характерный шум повседневного помола, не привязывая образ к зданию мельницы.
theological_decisions:
- issue: Образ суда над Вавилоном
  choice: Сохранить трёхчастное провозглашение полного прекращения музыки, ремесла и повседневного труда в осуждённом городе.
  alternative: Рассматривать перечисленные детали лишь как декоративное описание либо раскрывать каждую из них как отдельный аллегорический символ.
  rationale: Повтор οὐ μή ... ἔτι подчёркивает окончательность запустения. Перевод сохраняет конкретные образы и их возможную символическую глубину, не навязывая им узкого аллегорического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Троекратное «уже никогда ... в тебе» сохраняет ритм и окончательность греческой формулы; точка с запятой удерживает длинное перечисление читаемым.
