source:
  edition: SBLGNT
  text: Καὶ οἱ ἔμποροι τῆς γῆς ⸂κλαίουσιν καὶ πενθοῦσιν⸃ ἐπ’ ⸀αὐτήν, ὅτι τὸν γόμον αὐτῶν οὐδεὶς ἀγοράζει οὐκέτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/011.yaml
  text: And the merchants of the earth weep and mourn over her[a], because no one buys their cargo anymore[b],
translation:
  language: ru
  text: И купцы земли[b] плачут и скорбят о ней, потому что их груз[a] больше никто не покупает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «товары». Греческое слово может обозначать корабельный груз или перевозимые для продажи товары.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «страны». Греческое слово может означать как землю вообще, так и землю в смысле страны или суши; в Откровении здесь, вероятно, подразумевается более широкий, всемирный охват.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: купцы
  rationale: «Купцы» естественно обозначает людей, занимающихся крупной торговлей, и соответствует контексту торговли предметами роскоши в Откровении 18.
- source_word: τῆς γῆς
  choice: земли
  rationale: γῆ может означать как «землю» в широком смысле, так и отдельную «страну/сушу». В апокалиптическом контексте Откровения выражение, вероятнее всего, имеет широкий охват; буквальное «земли» сохраняет и возможную неоднозначность.
- source_word: κλαίουσιν καὶ πενθοῦσιν
  choice: плачут и скорбят
  rationale: 'Сохранены оба глагола и их риторическое усиление: первый выражает плач, второй — скорбь и траур.'
- source_word: ἐπ’ αὐτήν
  choice: о ней
  rationale: При глаголах плача и скорби ἐπί с винительным указывает на предмет оплакивания. «О ней» естественно по-русски и сохраняет женский образ олицетворённого Вавилона.
- source_word: γόμον
  choice: груз
  rationale: γόμος обозначает груз, особенно корабельный, а также совокупность перевозимых товаров. «Груз» подчёркивает торгово-морской контекст и сохраняет собирательное единственное число.
- source_word: οὐδεὶς ἀγοράζει οὐκέτι
  choice: больше никто не покупает
  rationale: Такой порядок слов естественен в современном русском языке, сохраняет настоящее время и ясно передаёт прекращение торговли, выраженное οὐκέτι.
- source_word: αὐτῶν
  choice: их
  rationale: Родительное местоимение выражает принадлежность груза купцам; «их» является прямым и естественным соответствием.
theological_decisions:
- issue: Образ и референт Вавилона
  choice: Женский род сохранён в выражении «о ней», поддерживая образ олицетворённого города.
  alternative: Передать город или систему местоимением среднего рода либо безличной конструкцией.
  rationale: В Откровении Вавилон представлен как женщина и город. Сохранение женского местоимения передаёт литературно-богословский образ, не уточняя сверх текста, кого именно символизирует Вавилон.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан естественным для русского читателя; парная формула «плачут и скорбят» и женское олицетворение Вавилона сохранены.
