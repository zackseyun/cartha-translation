  text: Καὶ ἦρεν εἷς ἄγγελος ἰσχυρὸς λίθον ὡς ⸀μύλινον μέγαν, καὶ ἔβαλεν εἰς τὴν θάλασσαν λέγων· Οὕτως ὁρμήματι βληθήσεται Βαβυλὼν ἡ μεγάλη πόλις, καὶ οὐ μὴ εὑρεθῇ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/021.yaml
  text: And one mighty angel lifted up a stone like a great millstone and threw it into the sea[a], saying, “So will Babylon the great city be thrown down with violence, and it will never be found again.”
translation:
  language: ru
  text: 'И один могучий ангел поднял камень, подобный большому жернову, и бросил его в море, говоря: «Так с неудержимой силой[a] будет низвержен Вавилон, великий город, и уже никогда не найдут его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стремительно», «с силой», «с мощным натиском». Греческое слово обозначает внезапное, неудержимое и мощное движение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦρεν
  choice: поднял
  rationale: Аорист αἴρω описывает, как ангел поднял камень перед символическим броском; русский глагол естественно передаёт намеренное физическое действие.
- source_word: εἷς ἄγγελος ἰσχυρὸς
  choice: один сильный ангел
  rationale: «Один» сохраняет εἷς, а «сильный» прямо и естественно передаёт ἰσχυρός, не ослабляя возвышенного апокалиптического регистра.
- source_word: λίθον ὡς μύλινον μέγαν
  choice: камень, подобный большому жернову
  rationale: '«Подобный» сохраняет сравнительное ὡς: речь идёт о камне, уподобленном большому жернову, а не обязательно прямо названном жерновом.'
- source_word: ἔβαλεν εἰς τὴν θάλασσαν
  choice: бросил его в море
  rationale: Передаёт обычное значение βάλλω и сохраняет энергичность символического действия.
- source_word: Οὕτως
  choice: так
  rationale: Кратко и точно связывает символическое действие с последующим истолкованием.
- source_word: ὁρμήματι
  choice: стремительно
  rationale: Передаёт внезапное, неудержимое и силовое движение, заключённое в ὅρμημα; оттенок силы пояснён в сноске.
- source_word: βληθήσεται
  choice: будет низвержен
  rationale: Будущий пассив βάλλω перекликается с броском камня; «низвержен» естественно выражает направленное вниз разрушительное падение города.
- source_word: Βαβυλὼν ἡ μεγάλη πόλις
  choice: Вавилон, великий город
  rationale: Сохраняет приложение и устойчивое апокалиптическое обозначение Вавилона.
- source_word: οὐ μὴ εὑρεθῇ ἔτι
  choice: уже никогда не найдут его
  rationale: Сочетание «уже никогда» передаёт усиленное отрицание οὐ μή вместе с ἔτι; неопределённо-личная конструкция звучит по-русски естественнее буквального пассива.
theological_decisions:
- issue: Характер образа уничтожения Вавилона
  choice: Сохранить образ стремительного, насильственного и окончательного низвержения, не уточняя, является ли Вавилон буквальным городом, символом или сочетает оба смысла.
  alternative: Истолковать Вавилон исключительно как исторический город либо исключительно как символ мировой системы, противостоящей Богу.
  rationale: Сам стих даёт символическое действие и пророческое провозглашение суда, но не разрешает здесь вопрос о точном референте Вавилона; перевод не должен предрешать эсхатологическое толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим апокалиптическому видению. Синтаксис сделан ясным для обычного читателя; сохранены сравнение с жерновом, словесная перекличка броска и низвержения, а также усиленная окончательность приговора.
