source:
  edition: SBLGNT
  text: καὶ φῶς λύχνου οὐ μὴ φάνῃ ἐν σοὶ ἔτι, καὶ φωνὴ νυμφίου καὶ νύμφης οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι· ὅτι οἱ ἔμποροί σου ἦσαν οἱ μεγιστᾶνες τῆς γῆς, ὅτι ἐν τῇ φαρμακείᾳ σου ἐπλανήθησαν πάντα τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/023.yaml
  text: And the light of a lamp will never shine in you again[a], and the voice of bridegroom and bride will never be heard in you again; for your merchants were the great ones of the earth[b], because by your sorcery all the nations were led astray.
translation:
  language: ru
  text: И свет светильника уже никогда не засияет в тебе, и голос жениха и невесты уже никогда не будет слышен в тебе; ибо твои купцы были знатнейшими людьми земли[a], и твоим колдовством[b] были введены в заблуждение все народы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великими людьми земли»; греческое слово обозначает людей исключительного влияния и могущества.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чародейством», «магическими искусствами». Греческое слово φαρμακεία обозначает колдовство или магические приёмы обольщения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς λύχνου
  choice: светильник
  rationale: В данном контексте естественное русское выражение «светильник засияет» передаёт образ света лампы без тяжеловесного «свет светильника».
- source_word: οὐ μὴ φάνῃ ... ἔτι
  choice: уже никогда не засияет
  rationale: Сочетание «уже никогда» ясно передаёт усиленное отрицание οὐ μή и окончательность, выраженную ἔτι в отрицательной конструкции.
- source_word: φωνὴ νυμφίου καὶ νύμφης
  choice: голоса жениха и невесты
  rationale: «Голоса» естественно передаёт φωνή применительно к двум людям и сохраняет отзвук пророческих формул суда.
- source_word: οἱ ἔμποροί σου
  choice: твои купцы
  rationale: «Купцы» точно соответствует торговому контексту главы и сохраняет традиционно понятный библейский образ.
- source_word: οἱ μεγιστᾶνες τῆς γῆς
  choice: властители земли
  rationale: Слово обозначает влиятельных и могущественных людей; «властители» передаёт высокий статус, не ограничивая его формальным дворянством.
- source_word: ἐν τῇ φαρμακείᾳ σου
  choice: твоим колдовством
  rationale: φαρμακεία здесь обозначает магию или чародейство; «колдовство» понятно современному читателю и не создаёт ошибочной современной ассоциации исключительно с лекарствами.
- source_word: ἐπλανήθησαν
  choice: были введены в заблуждение
  rationale: Пассивная конструкция сохраняет форму греческого текста и выражает как обман, так и совращение с верного пути.
- source_word: πάντα τὰ ἔθνη
  choice: все народы
  rationale: В Откровении ἔθνη обычно обозначает народы мира; это точнее и естественнее, чем «язычники» в данном месте.
theological_decisions:
- issue: Значение φαρμακεία в описании суда над Вавилоном
  choice: колдовство
  alternative: чародейство; магические искусства
  rationale: Перевод сохраняет религиозно-нравственный смысл магического обмана и не сводит слово к современному понятию фармакологии.
- issue: Сила повторяющихся конструкций οὐ μή
  choice: уже никогда не…
  alternative: больше не…; совершенно не…
  rationale: Формулировка передаёт усиленное отрицание и необратимость суда, не вводя дополнительного богословского толкования.
- issue: Причинная связь двух ὅτι
  choice: потому что… и…
  alternative: ибо… потому что…
  rationale: 'Два основания падения Вавилона представлены как связанные обвинения: возвышение его купцов и обольщение народов. Союз «и» делает русскую фразу естественной, сохраняя оба причинных утверждения.'
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Персонифицированное обращение к Вавилону сохранено формой «в тебе». Маркеры сносок помещены непосредственно после соответствующих выражений.
