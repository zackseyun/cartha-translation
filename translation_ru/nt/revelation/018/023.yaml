  source_fidelity: 'Требуется исправление двух лексических мест. φῶς λύχνου означает «свет светильника/лампы», а не сам «светильник»: в исходнике говорится, что более не будет сиять его свет. Μεγιστᾶνες обозначает знатных, влиятельных, могущественных людей; «властители» неоправданно сужает значение до правителей. Остальные элементы переданы верно: emphatic οὐ μή ... ἔτι — «уже никогда/более не», пассив ἐπλανήθησαν — «были введены в заблуждение», а φαρμακεία — «колдовство».'
  naturalness: Исправленная формулировка сохраняет современный литературный русский с уместно торжественным пророческим звучанием. «Свет светильника» несколько возвышенно, но прозрачно и точно в библейском контексте; «знатнейшие люди земли» естественно передаёт социальное влияние без указания на конкретный государственный статус.
  terminology: «Жених и невеста», «купцы», «колдовство» и «народы» уместны и последовательны. Сноска к μεγιστᾶνες уточняет широкий смысл термина; сноска к φαρμακεία сохраняет допустимые лексические альтернативы без конфессионального истолкования.
