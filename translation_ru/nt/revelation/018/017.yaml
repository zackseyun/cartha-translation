lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит объяснение плача в ближайшем контексте; «потому что» естественно передаёт причинно-пояснительную связь.
- source_word: μιᾷ ὥρᾳ
  choice: в один час
  rationale: Сохраняет временную конструкцию и подчёркивает внезапность разорения, не определяя, буквально ли понимается продолжительность.
- source_word: ἠρημώθη
  choice: было разорено
  rationale: Передаёт пассивное значение опустошения и уничтожения, оставаясь естественным применительно к богатству.
- source_word: ὁ τοσοῦτος πλοῦτος
  choice: такое великое богатство
  rationale: Сохраняет усилительное значение τοσοῦτος и скорбно-риторический тон.
- source_word: πᾶς κυβερνήτης
  choice: всякий кормчий
  rationale: В морском контексте κυβερνήτης обозначает управляющего судном или рулевого; «кормчий» точно и достойно передаёт морской образ, хотя имеет несколько возвышенную окраску.
- source_word: πᾶς ὁ ἐπὶ τόπον πλέων
  choice: всякий, кто плывёт к месту назначения
  rationale: Передаёт буквальное направление движения и не сужает не вполне ясную идиому до пассажиров либо торговцев; альтернативы отмечены в сноске.
- source_word: ναῦται
  choice: моряки
  rationale: Современное и ясное обозначение моряков, непосредственно соответствующее греческому слову.
- source_word: ὅσοι τὴν θάλασσαν ἐργάζονται
  choice: все, кто трудится на море
  rationale: Сохраняет широту выражения, охватывающего не только моряков, и его образную связь с морем.
- source_word: ἀπὸ μακρόθεν
  choice: вдали
  rationale: Естественно передаёт пространственную удалённость наблюдателей.
- source_word: ἔστησαν
  choice: остановились
  rationale: В данном повествовательном контексте аорист ἵστημι может обозначать занятие позиции; «остановились вдали» звучит естественнее буквального «встали вдали» и согласуется с продолжающимся описанием.
theological_decisions:
- issue: Состав перечисленных групп людей, связанных с морем
  choice: Сохранить отдельными кормчих, плывущих к месту назначения, моряков и всех трудящихся на море
  alternative: Обобщить их как всех мореплавателей или истолковать вторую группу исключительно как пассажиров либо торговцев
  rationale: Греческий текст соединяет несколько различных групп, риторически показывая всеобъемлющие экономические последствия падения Вавилона; их объединение или уточнение добавило бы отсутствующее в тексте толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Кормчий» выбран ради точности морского термина; синтаксис перечня сохранён. Начальная строчная буква и закрывающая кавычка учитывают продолжение прямой речи из предыдущего стиха.
