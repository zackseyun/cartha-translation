  source_fidelity: 'Основные группы в перечислении переданы раздельно, а причинное «потому что», χρονологическое «в один час» и образ морского труда в целом соответствуют греческому тексту. Однако «к месту назначения» несколько конкретизирует не вполне ясное ἐπὶ τόπον; безопаснее сохранить неопределённость: «в какое-либо место». «Остановились вдали» может означать прекращение движения, тогда как ἔστησαν описывает занятую ими позицию; «стали поодаль» передаёт это точнее.'
