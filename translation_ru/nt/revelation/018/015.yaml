id: REV.18.15
reference: Revelation 18:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ ἔμποροι τούτων, οἱ πλουτήσαντες ἀπ’ αὐτῆς, ἀπὸ μακρόθεν στήσονται διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς κλαίοντες καὶ πενθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/015.yaml
  text: The merchants of these things[a], who became rich from her, will stand far off because of the fear of her torment, weeping and mourning,
translation:
  language: ru
  text: Торговцы всем этим[a], разбогатевшие благодаря ей, встанут вдали из страха перед её мучением, плача и скорбя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «торговцы этими товарами»; выражение отсылает к предметам роскоши, перечисленным выше.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: торговцы
  rationale: Обозначает людей, занимающихся торговлей; «торговцы» естественно звучит в контексте торговли предметами роскоши.
- source_word: τούτων
  choice: всем этим
  rationale: Указательное местоимение отсылает к перечисленным ранее предметам торговли. Оборот сохраняет эту отсылку, не заменяя местоимение более конкретным существительным.
- source_word: πλουτήσαντες
  choice: разбогатевшие
  rationale: Аористное причастие указывает на приобретённое прежде богатство; русский оборот краток и естественен.
- source_word: ἀπ’ αὐτῆς
  choice: благодаря ей
  rationale: ἀπό указывает на источник их обогащения. В данном контексте «благодаря ей» ясно передаёт зависимость богатства торговцев от Вавилона, не приписывая ей прямого действия.
- source_word: ἀπὸ μακρόθεν
  choice: вдали
  rationale: Передаёт пространственную удалённость, которую торговцы сохраняют из страха.
- source_word: στήσονται
  choice: встанут
  rationale: Будущая форма среднего залога здесь означает, что они займут положение на расстоянии; «встанут» сохраняет образ исходного текста.
- source_word: διὰ τὸν φόβον
  choice: из страха
  rationale: διά с винительным выражает причину; «из страха» естественно и точно передаёт причинную связь.
- source_word: βασανισμοῦ
  choice: мучением
  rationale: В Откровении слово обозначает тяжёлое мучение в контексте суда; перевод сохраняет силу выражения, не сужая его до современного понятия пытки.
- source_word: κλαίοντες
  choice: плача
  rationale: Передаёт явный плач и сохраняет отличие от следующего обозначения скорби.
- source_word: πενθοῦντες
  choice: скорбя
  rationale: Передаёт состояние траура и глубокой печали, не дублируя значение «плача».
theological_decisions:
- issue: Характер βασανισμός в апокалиптическом языке суда
  choice: «мучение» без смягчения до одной лишь душевной или экономической беды
  alternative: «наказание» или «бедствие»
  rationale: Ближайший контекст говорит о суде над Вавилоном, а βασανισμός в Откровении обозначает тяжёлое мучение. Перевод сохраняет серьёзность суда, не добавляя подробностей о его природе.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Синтаксис сохраняет последовательность греческого стиха и различие между плачем и скорбью.
