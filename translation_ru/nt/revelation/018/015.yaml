  source_fidelity: 'Текст точно передаёт синтаксические и смысловые элементы греческого оригинала: торговцев указанных предметов, их прежнее обогащение от неё, удалённое положение вследствие страха перед её мучением, а также два различных действия — плач и скорбь. «Благодаря ей» несколько более благоприятно по оттенку, чем нейтральное «от неё», но в данном контексте естественно выражает её роль как источника их богатства и не меняет смысла.'
