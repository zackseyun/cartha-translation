  terminology: «Торговцы» хорошо соответствует ἔμποροι; «всем этим» сохраняет намеренно обобщённую анафорическую отсылку τούτων, а примечание предлагает уместное уточнение. «Мучение» адекватно передаёт βασανισμός в апокалиптическом контексте, не подменяя его более узким «пытка» или более слабым «бедствие».
