source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἡ περιβεβλημένη βύσσινον καὶ πορφυροῦν καὶ κόκκινον καὶ ⸀κεχρυσωμένη χρυσίῳ καὶ λίθῳ τιμίῳ καὶ ⸀μαργαρίτῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/016.yaml
  text: saying[a], “Woe, woe, the great city, clothed in fine linen and purple and scarlet, and adorned with gold and precious stones and pearls,”
translation:
  language: ru
  text: 'говоря: «Горе, горе великому городу, одетому в тонкий лён, пурпурную и алую ткани, украшенному золотом, драгоценными камнями и жемчугом!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: говоря
  rationale: Причастие настоящего времени во множественном числе вводит плач и сохраняет синтаксическую связь с предыдущим стихом, не добавляя явно названного субъекта.
- source_word: Οὐαὶ οὐαί
  choice: Горе, горе
  rationale: Передаёт одновременно плач и пророческое возвещение бедствия; повтор сохранён ради силы и ритма оригинала.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: великий город
  rationale: Естественно передаёт греческую конструкцию с повторным артиклем и сохраняет её смысловой акцент.
- source_word: περιβεβλημένη
  choice: одетый
  rationale: Перфектное причастие описывает состояние города, олицетворённого как богато одетая женщина; русская форма согласована с существительным «город».
- source_word: βύσσινον
  choice: тонкий лён
  rationale: Обозначает дорогую тонкую льняную ткань; этот вариант понятен современному читателю и сохраняет образ роскоши без архаичного «виссон».
- source_word: πορφυροῦν
  choice: пурпур
  rationale: Сохраняет цветовую и царственно-роскошную образность; в перечне тканей слово употреблено как название материала.
- source_word: κόκκινον
  choice: багряницу
  rationale: Передаёт яркую багряную ткань и сохраняет возвышенный апокалиптический регистр, оставаясь понятным в контексте дорогого одеяния.
- source_word: κεχρυσωμένη
  choice: украшенный
  rationale: Поскольку последующий ряд включает не только золото, но также камни и жемчуг, широкое значение «украшенный» точнее, чем буквальное «позолоченный».
- source_word: χρυσίῳ
  choice: золотом
  rationale: Естественная передача дательного материала или средства в перечне украшений.
- source_word: λίθῳ τιμίῳ
  choice: драгоценными камнями
  rationale: Греческое единственное число допускает собирательное понимание; множественное число естественно в русском перечне богатых украшений.
- source_word: μαργαρίτῃ
  choice: жемчугом
  rationale: Собирательное русское существительное естественно передаёт греческое единственное число и образ дорогого украшения.
theological_decisions:
- issue: Тон плача о падении Вавилона
  choice: «Горе» — с оттенками плача и суда
  alternative: «Увы» — с преимущественным оттенком скорби
  rationale: В контексте суда над Вавилоном οὐαί выражает не только сожаление, но и пророческое возвещение бедствия; перевод не сводит реплику к одной лишь печали.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным апокалиптическим звучанием. Сохранены олицетворение города, повтор междометия и роскошная образность; архаизм «виссон» заменён прозрачным выражением «тонкий лён».
