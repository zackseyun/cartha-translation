  source_fidelity: 'Основной смысл передан верно: сохранены повтор οὐαί, «великий город», роскошное одеяние и перечень украшений. Однако «багряницу» обычно понимают как предмет одежды, тогда как κόκκινον здесь, наряду с πορφυροῦν, обозначает дорогую ткань/материал; это создаёт нежелательное смешение ткани и одежды в одном ряду.'
  naturalness: «Горе, горе, великий город» в современном русском звучит синтаксически обрывочно. Дательный оборот «горе ... великому городу» естественно передаёт возглас, не добавляя нового участника действия. «Тонкий лён, пурпурную и алую ткани» ясно и современно передаёт ряд материалов.
  terminology: «Горе» уместно сохраняет судный и плачевный тон οὐαί; сноска с «Увы» обоснована. «Драгоценными камнями и жемчугом» — естественная русская собирательная передача греческих форм единственного числа.
