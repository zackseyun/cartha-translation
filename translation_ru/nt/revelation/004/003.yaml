source:
  edition: SBLGNT
  text: ⸂καὶ ὁ καθήμενος⸃ ὅμοιος ὁράσει λίθῳ ἰάσπιδι καὶ σαρδίῳ, καὶ ἶρις κυκλόθεν τοῦ θρόνου ⸂ὅμοιος ὁράσει σμαραγδίνῳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/003.yaml
  text: And the one seated there was in appearance like jasper and sardius stone[b][a], and around the throne was a rainbow in appearance like emerald.
translation:
  language: ru
  text: И Сидящий был по виду подобен яспису и сердолику[a], а вокруг престола была радуга[b], по виду подобная изумруду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сардис» — традиционное название камня, здесь переданного как «сердолик».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ореол»; греческое слово может обозначать радужное сияние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος
  choice: Сидящий
  rationale: Субстантивированное причастие обозначает пребывающего на престоле; заглавная буква уместна как контекстное наименование Бога, не добавляя имени или толкования.
- source_word: ὅμοιος ὁράσει
  choice: с виду подобен
  rationale: Передаёт дательный отношения/сферы ὁράσει и сохраняет именно зрительное сравнение, а не утверждение о материальном составе.
- source_word: λίθῳ ἰάσπιδι
  choice: камням яспису
  rationale: «Яспис» — закрепившееся русское название древнего драгоценного камня; множественное «камням» естественно охватывает два последующих названия при сохранении слова λίθῳ.
- source_word: σαρδίῳ
  choice: сердолику
  rationale: Современное и понятное название красновато-бурой разновидности халцедона; оно точнее для обычного читателя, чем традиционное, но малопонятное «сардис».
- source_word: ἶρις
  choice: радуга
  rationale: Основное значение в данном видении; возможный смысл сияющего радужного ореола отмечен в сноске.
- source_word: κυκλόθεν τοῦ θρόνου
  choice: вокруг престола
  rationale: Прямо и естественно передаёт окружающее престол положение.
- source_word: ὅμοιος ὁράσει σμαραγδίνῳ
  choice: с виду подобная изумруду
  rationale: Сохраняет повтор сравнения и не утверждает, будто радуга буквально состоит из изумруда.
theological_decisions:
- issue: Описание Сидящего посредством зрительного сравнения, а не прямого физического изображения
  choice: 'Сохранить обе сравнительные формулы: «с виду подобен / подобная»'
  alternative: Передать Сидящего и радугу как состоящих из драгоценных камней либо прямо описать их цвета
  rationale: Греческий текст дважды подчёркивает подобие по виду; буквальное отождествление с камнями устранило бы намеренную образность и напряжение видения.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Повтор «с виду» намеренно отражает повтор греческой сравнительной формулы; инверсия «камням яспису и сердолику» сохраняет достоинство стиля без архаизации.
