  source_fidelity: 'Смысл сравнительных формул передан верно: ὅμοιος ὁράσει в обоих случаях сохраняется как зрительное подобие, а не отождествление с камнями. «Сердолик» — допустимое современное обозначение σάρδιον; вариант «сардис» уместно оставить в сноске. Однако «подобен камням яспису и сердолику» грамматически и стилистически неудачно: множественное «камням» не согласуется с последующими формами и создаёт искусственную конструкцию. Союз καί следует передать без привносимого противопоставления «А».'
