  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ κυκλόθεν τοῦ θρόνου ⸀θρόνοι εἴκοσι τέσσαρες, καὶ ἐπὶ τοὺς ⸀θρόνους εἴκοσι τέσσαρας πρεσβυτέρους καθημένους περιβεβλημένους ⸀ἐν ἱματίοις λευκοῖς, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν στεφάνους χρυσοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/004.yaml
  text: And around the throne were twenty-four thrones[a], and on the thrones were seated twenty-four elders, clothed in white garments, and on their heads were golden crowns.
translation:
  language: ru
  text: А вокруг престола — двадцать четыре престола, а на этих престолах сидели двадцать четыре старейшины, облачённые в белые одежды, и на головах у них были золотые венцы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «золотые победные венки». Греческое слово может обозначать венец, вручавшийся в знак почести или победы, а не только царскую корону.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κυκλόθεν
  choice: вокруг
  rationale: Передаёт пространственное расположение престолов, окружающих центральный престол, естественно и без добавочного толкования.
- source_word: θρόνοι
  choice: престолы
  rationale: Сохраняет повтор того же греческого существительного, которым обозначен центральный престол, и поддерживает царственно-судебный образ.
- source_word: εἴκοσι τέσσαρες
  choice: двадцать четыре
  rationale: Стандартная передача греческого числительного.
- source_word: ἐπὶ τοὺς θρόνους
  choice: на этих престолах
  rationale: Предлог в данном контексте обозначает местонахождение; указательное «этих» естественно связывает фразу с только что названными двадцатью четырьмя престолами.
- source_word: πρεσβυτέρους
  choice: старейшины
  rationale: Передаёт название особой группы, а не просто возраст людей; в современном русском сохраняет титульно-представительный оттенок.
- source_word: καθημένους
  choice: сидели
  rationale: Финитная форма естественно передаёт греческое причастие в структуре русского повествования о видении.
- source_word: περιβεβλημένους
  choice: облачённые
  rationale: Передаёт состояние тех, на ком уже находятся одежды, и сохраняет торжественный, но понятный регистр.
- source_word: ἐν ἱματίοις λευκοῖς
  choice: в белые одежды
  rationale: «Одежды» не сужает широкое значение ἱμάτια до конкретного фасона, например мантий или риз.
- source_word: στεφάνους
  choice: венцы
  rationale: Русское «венцы» позволяет сохранить связь στέφανος с почётным или победным венком и не отождествляет его безоговорочно с царской короной.
- source_word: χρυσοῦς
  choice: золотые
  rationale: Прямая и естественная передача атрибутивного прилагательного.
theological_decisions:
- issue: Характер двадцати четырёх окружающих θρόνοι
  choice: Переведено как «престолы», а не «сиденья».
  alternative: «Сиденья» могло бы ослабить впечатление соправления, однако устранило бы лексический повтор исходного текста.
  rationale: Греческий текст повторяет θρόνος; перевод сохраняет царственно-судебную образность, не утверждая равенства окружающих престолов с центральным.
- issue: Кто такие двадцать четыре старейшины
  choice: Оставлено без поясняющей идентификации.
  alternative: Представители Церкви; ангельские существа; представители Израиля и апостолов.
  rationale: Сам стих называет их старейшинами, но не раскрывает их природу или представительство, поэтому перевод не должен разрешать этот вопрос.
- issue: Оттенок значения στέφανος
  choice: Основной перевод — «венцы», с примечанием о возможном победном или почётном оттенке.
  alternative: «Короны» или «победные венки».
  rationale: στέφανος может обозначать венец как знак победы или почести, тогда как перевод «короны» мог бы чрезмерно подчеркнуть исключительно царское достоинство, а «победные венки» — сузить значение.
translation_notes:
  register: Современный литературный русский с торжественным тоном повествования о небесном видении. Тире после вводной пространственной фразы делает длинную конструкцию яснее; повтор «престол» намеренно сохранён. «Старейшины» выбрано вместо конфессионально окрашенного «пресвитеры».
