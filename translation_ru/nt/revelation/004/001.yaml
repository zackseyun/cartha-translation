  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ θύρα ἠνεῳγμένη ἐν τῷ οὐρανῷ, καὶ ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ, λέγων· Ἀνάβα ὧδε, καὶ δείξω σοι ἃ δεῖ γενέσθαι. μετὰ ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/001.yaml
  text: After these things I looked[a], and behold, a door standing open in heaven, and the first voice that I had heard, like a trumpet speaking with me, said, “Come up here[c][b], and I will show you what must take place after these things.”
translation:
  language: ru
  text: 'После этих событий[a] я увидел: вот, на небе стояла открытая дверь. И тот первый голос[b], который я слышал, — словно труба, говорившая со мной[c], — сказал: «Поднимись сюда, и я покажу тебе, чему надлежит произойти после этих событий».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно: «После этого… после этого». В греческом тексте в начале и конце стиха повторена одна и та же фраза во множественном числе — буквально «после этих [вещей/событий]».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «первый голос», вероятно, отсылает к голосу, который Иоанн слышал прежде (см. Откр. 1:10).
    reason: cross_reference
  - marker: c
    text: 'Возможный более естественный перевод: «говорившая мне». Буквально греческий текст говорит «говорившая со мной».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: После этих событий
  rationale: Передаёт временную последовательность, множественное число указательного местоимения и повтор одной и той же греческой фразы в начале и конце стиха.
- source_word: εἶδον
  choice: я увидел
  rationale: Основное значение глагола сохранено; последующее «вот» естественно вводит содержание видения в современном русском.
- source_word: ἰδοὺ
  choice: вот
  rationale: Краткий и естественный русский указательный маркер сохраняет внезапное переключение внимания и возвышенный характер видения.
- source_word: θύρα ἠνεῳγμένη
  choice: стояла открытая дверь
  rationale: Совершенное страдательное причастие обозначает сохраняющееся состояние после открытия; эта конструкция естественно передаёт результирующее состояние.
- source_word: ἐν τῷ οὐρανῷ
  choice: в небесах
  rationale: Речь идёт о небесной сфере, а не просто о видимом небе; множественная русская форма звучит естественно в этом апокалиптическом контексте.
- source_word: ἡ φωνὴ ἡ πρώτη
  choice: тот первый голос
  rationale: Сохраняет определённость и слово «первый», не превращая вероятную отсылку к Откр. 1:10 в бесспорное толкование.
- source_word: ἣν ἤκουσα
  choice: который я слышал
  rationale: Естественно указывает на предшествующее восприятие голоса; русский вид и контекст делают отдельное выражение предпрошедшего времени ненужным.
- source_word: ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ
  choice: словно труба, говорившая со мной
  rationale: Сохраняет образное сравнение, глагол речи и буквальное значение μετά «со мной», не сводя трубу лишь к громкости или тембру.
- source_word: λέγων
  choice: сказал
  rationale: Причастие, вводящее прямую речь, естественно передано личной формой русского глагола; мужской род также соответствует форме греческого λέγων, подразумевающей говорящего.
- source_word: Ἀνάβα ὧδε
  choice: Поднимись сюда
  rationale: Передаёт движение вверх к месту, откуда говорит голос, и естественно звучит по-русски.
- source_word: δείξω σοι
  choice: я покажу тебе
  rationale: Прямая и современная передача простого будущего времени.
- source_word: ἃ δεῖ γενέσθαι
  choice: чему надлежит произойти
  rationale: «Надлежит» сохраняет оттенок необходимости в δεῖ, а «произойти» естественно передаёт γενέσθαι в отношении будущих событий.
theological_decisions:
- issue: Временной смысл повторённого μετὰ ταῦτα
  choice: 'Оба вхождения переданы одинаково: «после этих событий».'
  alternative: «После этого» или «затем» с менее заметным повтором.
  rationale: Повтор сохранён без уточнения, относится ли последовательность прежде всего к литературному порядку, ходу видения или к истории будущих событий; тем самым не навязывается определённая эсхатологическая схема.
- issue: Кого обозначает «первый голос»
  choice: Сохранено буквальное «тот первый голос» с пояснением в сноске.
  alternative: «Голос, который я слышал прежде».
  rationale: Более толковый вариант сделал бы отсылку к Откр. 1:10 явной частью текста, тогда как греческий сохраняет формулировку «первый голос».
- issue: Образ трубы и речь
  choice: «словно труба, говорившая со мной».
  alternative: «говоривший со мной голос, подобный звуку трубы».
  rationale: Выбранный вариант сохраняет необычный греческий образ трубы, которая говорит, и не ограничивает сравнение только звучанием, хотя более гладкое прочтение возможно.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. «Вот» и «надлежит» сохраняют достоинство и напряжённость текста, оставаясь понятными широкому читателю. Пунктуация выделяет необычное сравнение голоса с говорящей трубой и делает длинное греческое предложение читаемым.
