source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ θρόνου ἐκπορεύονται ἀστραπαὶ καὶ φωναὶ καὶ βρονταί· καὶ ἑπτὰ λαμπάδες πυρὸς καιόμεναι ἐνώπιον τοῦ θρόνου, ⸀ἅ εἰσιν ⸀τὰ ἑπτὰ πνεύματα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/005.yaml
  text: And from the throne come flashes of lightning and sounds and peals of thunder[a]; and before the throne were seven lamps of fire burning[c][b], which are the seven spirits of God.
translation:
  language: ru
  text: От престола исходят молнии, звуки[a] и раскаты грома; перед престолом горят семь огненных светильников[b] — это семь духов Божьих[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «голоса».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «горят семь огненных факелов».'
    reason: lexical_alternative
  - marker: c
    text: Многие понимают выражение «семь духов Божьих» как символическое указание на полноту единого Святого Духа; однако в греческом тексте буквально сказано «семь духов».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύονται
  choice: исходят
  rationale: Настоящее время и сочетание с ἐκ описывают явления, исходящие от престола; «исходят» естественно передаёт направление и сохраняет настоящее время.
- source_word: ἀστραπαὶ
  choice: молнии
  rationale: Русское множественное число естественно передаёт повторяющиеся вспышки молнии без тяжеловесного уточнения.
- source_word: φωναὶ
  choice: звуки
  rationale: φωνή допускает значения «голос» и «звук». В ряду с молниями и громом более широкое «звуки» не вводит предположения о говорящих; вариант «голоса» отмечен в сноске.
- source_word: βρονταί
  choice: раскаты грома
  rationale: Идиоматическое русское выражение передаёт множественное число и повторяющийся гром.
- source_word: λαμπάδες πυρὸς
  choice: огненные светильники
  rationale: λαμπάς может обозначать светильник или факел. «Огненные светильники» сохраняет образ и связь с огнём; возможное «факелы» дано в сноске.
- source_word: καιόμεναι
  choice: горят
  rationale: Настоящее время передаёт продолжающееся горение; в русском языке личная глагольная конструкция звучит естественнее буквального причастного оборота.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: перед престолом
  rationale: Прямое и естественное пространственное обозначение в сцене небесного престола.
- source_word: ἅ εἰσιν
  choice: это
  rationale: Русская конструкция с тире и указательным «это» ясно вводит символическое отождествление и естественно передаёт греческое относительное выражение.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: семь духов Божьих
  rationale: Сохраняется явное множественное число греческого текста без истолковывающей замены на «семикратный Дух».
theological_decisions:
- issue: Толкование τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: 'В основном тексте буквально: «семь духов Божьих».'
  alternative: «Семикратный Дух Божий» или символическое обозначение полноты единого Святого Духа.
  rationale: Греческий текст прямо употребляет множественное число. Перевод не должен превращать распространённое богословское толкование в сам текст; неоднозначность сохранена, а толкование вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Настоящее время сохранено в обеих частях стиха; ритм перечисления и образность престольного видения переданы без архаизации.
