  text: And before the throne was something like a sea of glass[a], like crystal. And in the midst of the throne and around the throne were four living creatures[c][b], full of eyes in front and behind.
translation:
  language: ru
  text: А перед престолом — словно стеклянное море[a], подобное кристаллу. И посреди престола и вокруг престола[c] — четыре живых существа[b], полные глаз спереди и сзади.
  philosophy: optimal-equivalence
  footnotes:
