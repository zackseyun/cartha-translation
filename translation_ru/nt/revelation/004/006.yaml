  - marker: b
    text: 'Или: «четыре живых создания». Греческое слово здесь не обозначает враждебных «зверей», появляющихся далее в Откровении.'
    reason: lexical_alternative
  - marker: c
    text: Выражение «посреди престола и вокруг престола» пространственно трудно для понимания; перевод сохраняет необычную перспективу видения, не уточняя её истолкованием.
    reason: alternative_reading
