  rationale: Передаёт образ ёмко и естественно; прилагательное ὑαλίνη указывает на стекло или стекловидность.
- source_word: ὁμοία κρυστάλλῳ
  choice: подобное кристаллу
  rationale: Сохраняет второе явное сравнение и согласуется с существительным среднего рода «море».
- source_word: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: посреди престола и вокруг престола
  rationale: Намеренно сохраняет пространственно трудное описание греческого текста, не навязывая видению уточнённую геометрию.
- source_word: ζῷα
  choice: живые существа
  rationale: Обозначает одушевлённых небесных существ и не смешивает их со зловещими «зверями» последующих глав Откровения.
- source_word: γέμοντα ὀφθαλμῶν
  choice: полных глаз
  rationale: Близко и понятно передаёт причастную конструкцию с родительным дополнением.
- source_word: ἔμπροσθεν καὶ ὄπισθεν
  choice: спереди и сзади
  rationale: Естественная русская парная конструкция, описывающая расположение глаз.
theological_decisions:
- issue: Передача ζῷα в небесном видении престола
  choice: живые существа
  alternative: живые создания; животные; звери
  rationale: Выбор сохраняет связь с образом одушевлённых существ у Божьего престола и избегает ложного отождествления с враждебными зверями в дальнейших главах.
- issue: Пространственная трудность выражения ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: сохранить формулировку «посреди престола и вокруг престола»
  alternative: сгладить как «в центре вокруг престола» или истолковать как «между престолом и окружавшими его»
  rationale: Исходный текст допускает необычную перспективу видения; перевод сохраняет напряжение, не разрешая его толкованием.
