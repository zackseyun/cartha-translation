source:
  edition: SBLGNT
  text: Ἄξιος εἶ, ὁ κύριος καὶ ὁ θεὸς ⸀ἡμῶν, λαβεῖν τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν, ὅτι σὺ ἔκτισας ⸀τὰ πάντα, καὶ διὰ τὸ θέλημά σου ἦσαν καὶ ἐκτίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/011.yaml
  text: You are worthy[a], our Lord and God, to receive the glory and the honor and the power, because you created all things[b], and by your will they existed and were created.
translation:
  language: ru
  text: Достоин Ты, Господь и Бог наш, принять славу, честь и силу, потому что Ты сотворил всё, и по Твоей воле[a] всё существовало и было сотворено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодаря Твоей воле» или «по причине Твоей воли». Греческое выражение διὰ τὸ θέλημά σου прежде всего имеет причинный смысл; «по Твоей воле» естественно передаёт эту зависимость, не уточняя её чрезмерно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄξιος εἶ
  choice: Достоин Ты
  rationale: Именная часть сказуемого вынесена вперёд, как в греческом тексте, что сохраняет смысловое ударение; инверсия уместна в возвышенной прямой речи.
- source_word: ὁ κύριος καὶ ὁ θεὸς ἡμῶν
  choice: Господь и Бог наш
  rationale: Определённые формы существительных в данном контексте служат обращением. Такая формулировка сохраняет оба титула и естественно звучит в русском славословии.
- source_word: λαβεῖν
  choice: принять
  rationale: Инфинитив после ἄξιος указывает, чего достоин адресат; «принять» естественно передаёт получение воздаваемых славы, чести и силы.
- source_word: τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν
  choice: славу, честь и силу
  rationale: Сохранены все три самостоятельных понятия и их торжественный перечислительный ритм; греческие артикли не требуют повторяющегося русского указателя.
- source_word: ὅτι σὺ ἔκτισας τὰ πάντα
  choice: потому что Ты сотворил всё
  rationale: ὅτι вводит основание высказанной достойности, а τὰ πάντα выражает всеохватность творения. Местоимение «Ты» передаёт явное и emphatic σὺ.
- source_word: διὰ τὸ θέλημά σου
  choice: по Твоей воле
  rationale: Естественная русская формула связывает бытие и сотворение всего с Божьей волей, не сводя выражение исключительно к орудию действия; возможный более явно причинный оттенок указан в сноске.
- source_word: ἦσαν καὶ ἐκτίσθησαν
  choice: всё существовало и было сотворено
  rationale: Различены несовершенный вид ἦσαν, обозначающий существование, и аорист страдательного залога ἐκτίσθησαν, обозначающий совершившийся акт сотворения. Необычное смысловое напряжение двух глаголов не сглажено.
theological_decisions:
- issue: Форма обращения к Богу
  choice: Господь и Бог наш
  alternative: наш Господь и Бог
  rationale: Выбрана прямая звательная по функции формула, сохраняющая оба наименования и общий притяжательный смысл без догматического расширения текста.
- issue: Связь Божьей воли с существованием и сотворением
  choice: по Твоей воле
  alternative: благодаря Твоей воле / ради Твоей воли
  rationale: Основной вариант достаточно широк, чтобы передать зависимость творения от Божьей воли, тогда как сноска сохраняет причинный или целевой оттенок διά с винительным падежом, не разрешая неоднозначность принудительно.
- issue: Соотношение «существовало» и «было сотворено»
  choice: сохранить оба глагола раздельно
  alternative: объединить как «возникло»
  rationale: Греческий текст различает ἦσαν и ἐκτίσθησαν. Их объединение устранило бы подлинное смысловое напряжение и сузило бы возможное понимание фразы.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным ритмом славословия. Инверсия «Достоин Ты» намеренно сохраняет начальное ударение греческого текста; архаические звательные частицы и устаревшая лексика не используются.
