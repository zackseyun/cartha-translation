id: REV.4.7
reference: Revelation 4:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τὸ ζῷον τὸ πρῶτον ὅμοιον λέοντι, καὶ τὸ δεύτερον ζῷον ὅμοιον μόσχῳ, καὶ τὸ τρίτον ζῷον ⸀ἔχων ⸂τὸ πρόσωπον ὡς⸃ ἀνθρώπου, καὶ τὸ τέταρτον ζῷον ὅμοιον ἀετῷ πετομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/007.yaml
  text: And the first living creature was like a lion, and the second living creature like a calf, and the third living creature had a face like a man, and the fourth living creature was like an eagle in flight.
translation:
  language: ru
  text: И первое живое существо было подобно льву, и второе живое существо было подобно тельцу, и третье живое существо имело лицо, как у человека[a], и четвёртое живое существо было подобно летящему орлу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человеческое лицо». Буквально: «лицо как у человека».'
    reason: Лексическая альтернатива поясняет, что ἀνθρώπου может иметь обобщённое значение, при этом основной текст сохраняет форму сравнения.
lexical_decisions:
- source_word: ζῷον
  choice: живое существо
  rationale: Передаёт широкое значение слова и отличает небесных существ у престола от враждебных «зверей» (θηρίον), появляющихся далее в книге.
- source_word: ὅμοιον
  choice: подобно
  rationale: Сохраняет значение сходства, а не тождества; во втором однородном обороте сказуемое подразумевается и обозначено тире.
- source_word: λέοντι
  choice: льву
  rationale: Прямой и естественный эквивалент названия животного после ὅμοιον.
- source_word: μόσχῳ
  choice: тельцу
  rationale: Слово обозначает телёнка или молодое животное из крупного рогатого скота. «Телец» точно, кратко и соответствует достоинству апокалиптического описания, не уточняя пол сверх необходимого.
- source_word: ἔχων
  choice: имело
  rationale: Причастие передано личной формой глагола ради естественного русского синтаксиса без изменения описательного смысла.
- source_word: τὸ πρόσωπον ὡς ἀνθρώπου
  choice: лицо, как у человека
  rationale: Сохраняет и значение πρόσωπον («лицо»), и выраженное посредством ὡς сравнение, не превращая сходство в полное отождествление.
- source_word: ἀετῷ
  choice: орлу
  rationale: «Орёл» — обычное и наиболее уместное значение слова в данном возвышенном образе.
- source_word: πετομένῳ
  choice: летящему
  rationale: Прямо передаёт причастие, изображающее орла в полёте.
theological_decisions:
- issue: Передача ἀνθρώπου в описании третьего существа
  choice: как у человека
  alternative: человеческое лицо
  rationale: Русское «человек» естественно может обозначать представителя человеческого рода вообще. Такая формулировка сохраняет явное сравнение с ὡς и не вносит дополнительного гендерного или богословского уточнения.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной лексикой. Повтор «живое существо» сохранён ради ритма и ясности перечисления; «четвёртое» написано с «ё» последовательно.
