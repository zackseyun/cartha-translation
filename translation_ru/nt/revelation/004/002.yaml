  text: ⸀εὐθέως ἐγενόμην ἐν πνεύματι· καὶ ἰδοὺ θρόνος ἔκειτο ἐν τῷ οὐρανῷ, καὶ ἐπὶ τὸν θρόνον καθήμενος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/002.yaml
  text: Immediately I was in the Spirit[a], and behold, a throne stood in heaven, and one seated on the throne,
translation:
  language: ru
  text: 'И тотчас я оказался в Духе[a], и вот: на небе стоял престол, и на престоле сидел некто,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в духе». В греческом перед словом «дух» нет артикля; выражение может указывать как на пребывание в Святом Духе, так и на духовное, визионерское состояние.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: тотчас
  rationale: Передаёт непосредственность и внезапность перехода; естественно звучит в современном литературном русском и сохраняет возвышенный тон.
- source_word: ἐγενόμην
  choice: я оказался
  rationale: Аорист γίνομαι обозначает переход в новое состояние. «Оказался» естественнее буквального «стал быть» и динамичнее статичного «был».
- source_word: ἐν πνεύματι
  choice: в Духе
  rationale: Вероятно, речь о пророческом переживании под действием Святого Духа. Отсутствие артикля допускает также понимание «в духе», поэтому оно отмечено в сноске.
- source_word: ἰδοὺ
  choice: И вот
  rationale: Привлекает внимание к открывшемуся видению и сохраняет апокалиптическую выразительность без архаичного «се».
- source_word: θρόνος
  choice: престол
  rationale: Обычное и стилистически уместное русское обозначение царского престола в небесном видении.
- source_word: ἔκειτο
  choice: стоял
  rationale: Передаёт устойчивое расположение престола; по-русски «престол стоял» естественнее буквального «лежал».
- source_word: ἐν τῷ οὐρανῷ
  choice: на небе
  rationale: В данном апокалиптическом контексте обозначает небесную сферу; русская идиома требует «на небе».
- source_word: καθήμενος
  choice: Сидящий
  rationale: Субстантивированное причастие сохраняет намеренную неопределённость греческого текста, не называя Личность прямо; прописная буква указывает на титульное употребление в данном контексте.
theological_decisions:
- issue: Означает ли ἐν πνεύματι пребывание в Святом Духе или духовное/визионерское состояние
  choice: в Духе
  alternative: в духе
  rationale: В Откровении эта формула отмечает пророческое видение и, вероятнее всего, действие Святого Духа. Однако греческое существительное употреблено без артикля, поэтому более общее понимание сохранено в сноске.
- issue: Следует ли прямо назвать Сидящего на престоле Богом
  choice: сохранить «Сидящий» без прямого именования
  alternative: Бог, сидящий на престоле
  rationale: Греческий текст использует только субстантивированное причастие καθήμενος. Контекст проясняет личность, но перевод не должен добавлять отсутствующее имя.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. «И вот» предпочтено архаичному «се»; двоеточие и тире естественно передают резкий зрительный переход и незавершённую в исходном стихе конструкцию.
