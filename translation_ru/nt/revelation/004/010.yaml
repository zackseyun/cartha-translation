source:
  edition: SBLGNT
  text: πεσοῦνται οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἐνώπιον τοῦ καθημένου ἐπὶ τοῦ θρόνου, καὶ προσκυνήσουσιν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ βαλοῦσιν τοὺς στεφάνους αὐτῶν ἐνώπιον τοῦ θρόνου, λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/010.yaml
  text: 'the twenty-four elders will fall down before the one seated on the throne[a], and they will worship the one who lives forever and ever, and they will cast their crowns before the throne[b], saying:'
translation:
  language: ru
  text: 'двадцать четыре старейшины падут перед тем, кто сидит на престоле, поклонятся тому, кто живёт во веки веков[a], и бросят свои венцы[b] перед престолом, говоря:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в эпохи эпох».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово может обозначать также победные венки, вручавшиеся в знак почёта.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσοῦνται
  choice: падут
  rationale: Будущая форма сохраняет зримое действие почтительного падения ниц, не добавляя отсутствующего в тексте уточнения о полной прострации.
- source_word: πρεσβύτεροι
  choice: старейшины
  rationale: Общеупотребительное русское обозначение членов небесного совета; «пресвитеры» здесь звучало бы излишне конфессионально и институционально.
- source_word: ἐνώπιον
  choice: перед
  rationale: Краткий и естественный эквивалент, подходящий для обоих употреблений в стихе.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: тем, кто сидит на престоле
  rationale: Передаёт субстантивированное причастие описательно и не вводит в перевод прямого именования Бога, которого в самом стихе нет.
- source_word: προσκυνήσουσιν
  choice: поклонятся
  rationale: В контексте небесного богослужения глагол означает поклонение; русский глагол сохраняет и телесный, и религиозный оттенок.
- source_word: τῷ ζῶντι
  choice: тому, кто живёт
  rationale: Естественно передаёт субстантивированное причастие и подчёркивает непрестанную жизнь описываемого лица.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устойчивое и понятное русское выражение неограниченной длительности, сохраняющее усиленную форму греческой идиомы.
- source_word: βαλοῦσιν
  choice: бросят
  rationale: Сохраняет энергичность и зримость действия βάλλω, не ослабляя его до «положат».
- source_word: στεφάνους
  choice: венцы
  rationale: «Венцы» естественно для торжественного апокалиптического контекста и, в отличие от «корон», допускает оттенок почётной или победной награды.
- source_word: λέγοντες
  choice: говоря
  rationale: Сохраняет причастную форму, вводящую последующую прямую речь.
theological_decisions:
- issue: Кого обозначают сидящий на престоле и живущий во веки веков
  choice: Сохранены описательные выражения «тот, кто сидит на престоле» и «тот, кто живёт во веки веков».
  alternative: Прямо назвать его Богом Отцом.
  rationale: Контекст ясно указывает на Бога, однако греческий текст данного стиха использует описательные титулы, а не прямое именование; перевод не устраняет эту особенность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Строчные буквы в описательных оборотах не добавляют отсутствующей в греческом тексте конфессиональной капитализации; «престол» и «венцы» сохраняют достоинство апокалиптической сцены.
