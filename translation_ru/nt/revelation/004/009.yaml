source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀δώσουσιν τὰ ζῷα δόξαν καὶ τιμὴν καὶ εὐχαριστίαν τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃, τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/009.yaml
  text: And whenever the living creatures give glory and honor and thanksgiving to the one seated on the throne[a], to the one who lives forever and ever,
translation:
  language: ru
  text: И всякий раз, когда живые существа воздают славу, честь и благодарение Сидящему на престоле, Живущему во веки веков[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в века веков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: всякий раз, когда
  rationale: 'Передаёт неопределённо-повторяющееся временное значение: речь идёт не об одном случае, а о всяком таком случае в небесном богослужении.'
- source_word: δώσουσιν
  choice: воздают
  rationale: В сочетании со «славой, честью и благодарением» русский глагол «воздавать» естественно выражает δίδωμι в богослужебном контексте, не добавляя смысла поклонения, которого нет в самом глаголе.
- source_word: τὰ ζῷα
  choice: живые существа
  rationale: Обозначает престольных существ, описанных ранее в главе; «существа» точнее контекстуального референта, чем «животные», а число «четыре» в этом стихе не добавляется.
- source_word: δόξαν
  choice: славу
  rationale: Прямой и традиционно понятный эквивалент δόξα в доксологическом контексте.
- source_word: τιμήν
  choice: честь
  rationale: Естественный эквивалент τιμή, сохраняющий трёхчастный ряд без избыточного истолкования.
- source_word: εὐχαριστίαν
  choice: благодарение
  rationale: Сохраняет существительное и возвышенный ритм перечисления; «благодарность» могла бы сильнее обозначать внутреннее чувство, а не выраженное действие.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: Сидящему на престоле
  rationale: Естественно передаёт субстантивированное причастие и устойчивый образ пребывания на престоле; прописная буква указывает на титульное употребление в данном контексте.
- source_word: τῷ ζῶντι
  choice: Живущему
  rationale: Сохраняет параллельную причастную форму и приложение к «Сидящему», связывая её с последующим обозначением вечной жизни.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Естественный и укоренившийся русский эквивалент идиомы неограниченной длительности, близкий также к образной форме греческого выражения.
theological_decisions:
- issue: Передача божественного престольного титула без добавления отсутствующего имени
  choice: Сидящему на престоле — Живущему во веки веков
  alternative: Богу, сидящему на престоле и живущему вечно
  rationale: Греческий текст не добавляет слово «Бог» и ставит два определительных причастных оборота в приложении. Перевод сохраняет это отождествление и не конкретизирует референта сверх источника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной, соответствующей видению престола интонацией. Синтаксис намеренно оставлен незавершённым, поскольку стих является придаточной временной частью предложения, продолжающегося в Откр. 4:10.
