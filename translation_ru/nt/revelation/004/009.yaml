  terminology: «Живые существа», «воздают», «слава», «честь», «благодарение», «Сидящему на престоле» и «во веки веков» уместны и последовательны. Прописные буквы в субстантивированных причастиях допустимы в данном контексте и не добавляют отсутствующего в источнике имени.
