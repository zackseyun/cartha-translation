id: REV.4.8
reference: Revelation 4:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα, ἓν ⸂καθ’ ἓν⸃ ⸀αὐτῶν ⸀ἔχων ἀνὰ πτέρυγας ἕξ, κυκλόθεν καὶ ἔσωθεν γέμουσιν ὀφθαλμῶν· καὶ ἀνάπαυσιν οὐκ ἔχουσιν ἡμέρας καὶ νυκτὸς λέγοντες· Ἅγιος ἅγιος ἅγιος κύριος, ὁ θεός, ὁ παντοκράτωρ, ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/008.yaml
  text: 'And the four living creatures[a], each one of them having six wings, are full of eyes all around and within; and they have no rest day and night, saying: “Holy, holy, holy is the Lord God, the Almighty, who was and who is and who is coming.”'
translation:
  language: ru
  text: 'И каждое из четырёх живых существ имеет по шесть крыльев; кругом и внутри они полны глаз. Ни днём ни ночью они не имеют покоя и говорят: «Свят, свят, свят Господь Бог Вседержитель, который был, есть и приходит[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более традиционной передаче: «Который был, есть и грядёт».'
    reason: Допустимый традиционный вариант передачи настоящего причастия ὁ ἐρχόμενος.
lexical_decisions:
- source_word: ζῷα
  choice: живые существа
  rationale: Передаёт одушевлённых небесных существ видения и не создаёт современного оттенка обычных животных, который возник бы при переводе «звери».
- source_word: ἓν καθ’ ἓν αὐτῶν
  choice: каждое из четырёх
  rationale: 'Сохраняет распределительное значение: сказанное о крыльях относится к каждому существу в отдельности.'
- source_word: ἔχων ἀνὰ πτέρυγας ἕξ
  choice: имеет по шесть крыльев
  rationale: Русское «по шесть» ясно показывает, что шесть крыльев имеет каждое из четырёх существ.
- source_word: κυκλόθεν καὶ ἔσωθεν
  choice: кругом и внутри
  rationale: Сохраняет обе пространственные характеристики образа, не пытаясь устранить его намеренную необычность.
- source_word: γέμουσιν ὀφθαλμῶν
  choice: полны глаз
  rationale: Прямо передаёт значение γέμω с родительным падежом и сохраняет яркость апокалиптического образа.
- source_word: ἀνάπαυσιν οὐκ ἔχουσιν
  choice: не имеют покоя
  rationale: Буквально и естественно передаёт отсутствие отдыха или передышки, не сводя выражение только к непрерывности речи.
- source_word: ἡμέρας καὶ νυκτός
  choice: ни днём ни ночью
  rationale: Естественная русская формула непрерывности; отрицательная конструкция согласована с «не имеют покоя».
- source_word: λέγοντες
  choice: и говорят
  rationale: Личная форма естественнее русского деепричастия после развернутого предложения и нейтрально передаёт содержание постоянного возглашения.
- source_word: Ἅγιος ἅγιος ἅγιος
  choice: Свят, свят, свят
  rationale: Троекратное повторение сохранено без сокращения как существенная риторическая и богословская черта текста.
- source_word: κύριος, ὁ θεός
  choice: Господь Бог
  rationale: Обычное и точное русское сочетание божественных титулов.
- source_word: ὁ παντοκράτωρ
  choice: Вседержитель
  rationale: Устоявшийся русский божественный титул, выражающий всеобъемлющую власть и силу.
theological_decisions:
- issue: Передача формулы ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος
  choice: Который был, есть и приходит
  alternative: Который был, есть и грядёт
  rationale: «Приходит» сохраняет значение настоящего причастия ὁ ἐρχόμενος и оттенок совершающегося приближения, не заменяя его простой будущностью. Традиционная формула с «грядёт» приведена в сноске как допустимый более торжественный вариант.
translation_notes:
  register: Современный литературный русский с сохранением достоинства небесной литургии. Синтаксис слегка упрощён ради ясности, но последовательность образов и трёхкратное «Свят» сохранены. Формы «живые существа» и «Вседержитель» поддерживают связь с библейской речью без излишней архаизации.
