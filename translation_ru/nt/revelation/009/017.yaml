  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ οὕτως εἶδον τοὺς ἵππους ἐν τῇ ὁράσει καὶ τοὺς καθημένους ἐπ’ αὐτῶν, ἔχοντας θώρακας πυρίνους καὶ ὑακινθίνους καὶ θειώδεις· καὶ αἱ κεφαλαὶ τῶν ἵππων ὡς κεφαλαὶ λεόντων, καὶ ἐκ τῶν στομάτων αὐτῶν ἐκπορεύεται πῦρ καὶ καπνὸς καὶ θεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/017.yaml
  text: And this is how I saw the horses in the vision, and those sitting on them[a]—they had breastplates fiery red and hyacinth-blue and sulfur-yellow; and the heads of the horses were like lions’ heads[b], and out of their mouths come fire and smoke and sulfur.
translation:
  language: ru
  text: 'И вот как я увидел в видении коней и сидящих на них: у сидевших на них были нагрудники — огненные, гиацинтовые[a] и серные; головы коней были подобны головам львов, и из их пастей выходят огонь, дым и сера.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Гиацинтовые — цвета гиацинта или драгоценного камня гиацинта; вероятно, тёмно-синие или сине-фиолетовые.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: вот как
  rationale: Передаёт указание на образ увиденного естественным современным русским выражением, не сводя слово лишь к последовательному «так».
- source_word: ἐν τῇ ὁράσει
  choice: в видении
  rationale: В апокалиптическом контексте ὅρασις обозначает именно пророческое видение.
- source_word: τοὺς καθημένους ἐπ’ αὐτῶν
  choice: сидящих на них
  rationale: Сохраняет явную причастную конструкцию греческого текста и её конкретный образ.
- source_word: θώρακας
  choice: нагрудники
  rationale: Конкретное и понятное обозначение защитной части доспеха; точнее общего слова «доспехи».
- source_word: πυρίνους καὶ ὑακινθίνους καὶ θειώδεις
  choice: огненные, гиацинтовые и серные
  rationale: Сохраняет параллелизм и образную неоднозначность прилагательных, не добавляя прямо не названные в греческом цвета — красный, синий и жёлтый.
- source_word: ὡς κεφαλαὶ λεόντων
  choice: подобны головам львов
  rationale: Достоинственная и естественная передача сравнения с ὡς.
- source_word: ἐκπορεύεται
  choice: выходят
  rationale: Сохраняет настоящее время видения; русское множественное число согласовано с однородным составным подлежащим.
- source_word: θεῖον
  choice: сера
  rationale: Современное точное название вещества без архаизации.
theological_decisions:
- issue: Характер трёх прилагательных при нагрудниках
  choice: Сохранить образные определения «огненные, гиацинтовые и серные» без явного добавления названий цветов.
  alternative: «Огненно-красные, гиацинтово-синие и серно-жёлтые».
  rationale: Контекст допускает цветовое понимание, однако формы могут описывать не только цвет, но также вид или качество. Более формальная передача сохраняет апокалиптическую многозначность и не закрепляет один из оттенков сверх текста.
- issue: Историческое настоящее ἐκπορεύεται
  choice: «выходят» в настоящем времени
  alternative: «выходили» в прошедшем времени.
  rationale: Настоящее время оживляет разворачивающееся видение и соответствует форме исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, образным строем. Двоеточие проясняет, что далее описывается вид коней и всадников; «пасти» выбрано как естественное обозначение ртов животных. Местоимение «на них» после двусоставного объекта допускает отнесение к сидящим на конях, как требует согласование ἔχοντας.
