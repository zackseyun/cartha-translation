id: REV.9.19
reference: Revelation 9:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἡ γὰρ ἐξουσία τῶν ἵππων ἐν τῷ στόματι αὐτῶν ἐστιν καὶ ἐν ταῖς οὐραῖς αὐτῶν· αἱ γὰρ οὐραὶ αὐτῶν ὅμοιαι ⸀ὄφεσιν, ἔχουσαι κεφαλάς, καὶ ἐν αὐταῖς ἀδικοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/019.yaml
  text: For the power of the horses is in their mouths and in their tails[a]; for their tails are like serpents, having heads[b], and with them they do harm.
translation:
  language: ru
  text: 'Ведь сила коней — в их ртах и в их хвостах: их хвосты подобны змеям, имеют головы, и ими они причиняют вред.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσία
  choice: сила
  rationale: В контексте видения слово обозначает действенную способность коней причинять вред, а не прежде всего законное или делегированное право.
- source_word: στόματι αὐτῶν
  choice: в их ртах
  rationale: Хотя в греческом стоит единственное число при множественном обладателе, по-русски естественно употребить распределительное множественное число.
- source_word: οὐραῖς αὐτῶν
  choice: в их хвостах
  rationale: Прямо сохраняет множественное число и пространственный образ греческого текста.
- source_word: ὅμοιαι ὄφεσιν
  choice: подобны змеям
  rationale: «Змеям» понятно современному читателю и сохраняет образ; «подобны» поддерживает достойный литературный регистр.
- source_word: ἔχουσαι κεφαλάς
  choice: имеют головы
  rationale: Личная глагольная форма звучит по-русски естественнее причастной конструкции и сохраняет последовательность образов.
- source_word: ἐν αὐταῖς
  choice: ими
  rationale: Передаёт инструментальное значение ἐν; местоимение грамматически может отсылать к хвостам, внутри которых в образе находятся головы, без принудительного уточнения.
- source_word: ἀδικοῦσιν
  choice: причиняют вред
  rationale: В данном контексте ἀδικέω означает наносить ущерб или вред, а не абстрактно поступать несправедливо.
- source_word: γὰρ
  choice: ведь / двоеточие
  rationale: Первое γάρ передано словом «ведь» как объяснительная связь с предыдущим стихом; второе выражено двоеточием, естественно вводящим пояснение в русском синтаксисе.
theological_decisions:
- issue: Апокалиптический образ хвостов и голов
  choice: Передать образ непосредственно, не истолковывая его символически
  alternative: Отождествить хвосты или головы с конкретным учением, духовной силой либо историческим явлением
  rationale: Сам стих описывает видение, но не раскрывает символическое соответствие; перевод не должен вносить отсутствующее в тексте толкование.
- issue: К чему относится местоимение αὐταῖς
  choice: Сохранить обобщённое «ими», относящееся в ближайшем контексте к хвостам
  alternative: 'Уточнить: «головами они причиняют вред»'
  rationale: Греческое местоимение женского рода множественного числа формально отсылает к хвостам (οὐραί), тогда как головы являются частью этих хвостов; уточнение до одних только голов сузило бы образ.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным регистром. Синтаксис упрощён без утраты причинно-пояснительной связи и необычной образности исходного текста.
