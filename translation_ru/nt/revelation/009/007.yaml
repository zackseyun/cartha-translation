source:
  edition: SBLGNT
  text: Καὶ τὰ ὁμοιώματα τῶν ἀκρίδων ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν ὡς στέφανοι ⸂ὅμοιοι χρυσῷ⸃, καὶ τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/007.yaml
  text: And the appearance of the locusts was like horses prepared for battle[a], and on their heads were what seemed to be crowns like gold, and their faces were like human faces[b],
translation:
  language: ru
  text: Саранча по виду была подобна коням, приготовленным к битве; на головах у них было нечто вроде венцов, подобных золоту, а лица у них были как человеческие лица[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «лица людей»; речь идёт о людях вообще, а не только о мужчинах.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ὁμοιώματα τῶν ἀκρίδων
  choice: саранча по виду
  rationale: Оборот передаёт зрительный облик увиденной саранчи, а не буквальное тождество; русская конструкция естественна и сохраняет характер описания видения.
- source_word: ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον
  choice: была подобна коням, приготовленным к битве
  rationale: Сохраняется прямое сравнение и выраженное перфектным причастием состояние готовности к сражению.
- source_word: ὡς στέφανοι
  choice: нечто похожее на венцы
  rationale: ὡς обозначает видимое сходство, а не утверждает, что это были настоящие венцы; «венцы» допускает как царский, так и победный образ.
- source_word: ὅμοιοι χρυσῷ
  choice: подобные золоту
  rationale: Греческий текст говорит о сходстве с золотом, не утверждая прямо ни материал, ни только золотой цвет.
- source_word: πρόσωπα ἀνθρώπων
  choice: человеческие лица
  rationale: ἄνθρωπος употреблено родово и обозначает людей вообще, а не исключительно мужчин.
theological_decisions:
- issue: Сравнительный характер апокалиптического образа
  choice: 'Сохранить последовательные указания на сходство: «по виду», «подобна», «похожее», «подобные», «как»'
  alternative: Передать венцы как буквальные золотые короны
  rationale: Повторяющиеся ὅμοια и ὡς описывают впечатление от видения; перевод не должен превращать образные сравнения в утверждения о буквальной природе увиденного.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической формой. Собирательное «саранча» сохраняет естественность русского описания; повтор сравнительных слов намеренно удерживает неопределённость видения.
