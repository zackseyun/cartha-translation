id: REV.9.13
reference: Revelation 9:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἄγγελος ἐσάλπισεν· καὶ ἤκουσα φωνὴν μίαν ἐκ ⸀τῶν κεράτων τοῦ θυσιαστηρίου τοῦ χρυσοῦ τοῦ ἐνώπιον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/013.yaml
  text: And the sixth angel blew his trumpet[a], and I heard one voice from the horns of the golden altar that is before God,
translation:
  language: ru
  text: И шестой ангел затрубил в трубу, и я услышал один голос[a], донёсшийся от рогов золотого жертвенника, находящегося перед Богом,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «единственный голос». Греческий текст подчёркивает, что голос был один.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: затрубил в трубу
  rationale: Глагол означает «трубить, подавать звук трубой». Явно названное по-русски дополнение делает фразу естественной и передаёт подразумеваемый в греческом глаголе инструмент.
- source_word: φωνὴν μίαν
  choice: один голос
  rationale: Сохраняет выраженное словом μίαν указание на единственность голоса, не уточняя его принадлежность.
- source_word: ἐκ τῶν κεράτων
  choice: донёсшийся от рогов
  rationale: Предлог ἐκ обозначает источник; оборот «донёсшийся от» естественно передаёт по-русски происхождение слышимого голоса и сохраняет образ рогов жертвенника.
- source_word: θυσιαστηρίου τοῦ χρυσοῦ
  choice: золотого жертвенника
  rationale: Естественная русская передача определённого сочетания, сохраняющая храмовый образ.
- source_word: τοῦ ἐνώπιον τοῦ θεοῦ
  choice: находящегося перед Богом
  rationale: Передаёт положение жертвенника в присутствии Бога без добавления невыраженного в оригинале действия.
- source_word: ἄγγελος
  choice: ангел
  rationale: В контексте видения речь идёт об ангельском существе, а не о человеческом посланнике.
theological_decisions:
- issue: Кому принадлежит голос
  choice: Оставить нейтральное «один голос»
  alternative: 'Уточнить: «голос Бога», «голос ангела» или «голос от жертвенника» как персонифицированного источника'
  rationale: Греческий текст сообщает лишь, что Иоанн услышал один голос, донёсшийся от рогов золотого жертвенника; личность говорящего не названа, поэтому перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Затрубил в трубу» понятнее современному читателю, чем архаизирующее «вострубил»; «донёсшийся от» устраняет неестественное для русского языка сочетание «услышал голос от рогов». Конечная запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
