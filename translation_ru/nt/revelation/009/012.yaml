  text: Ἡ οὐαὶ ἡ μία ἀπῆλθεν· ἰδοὺ ἔρχεται ἔτι δύο οὐαὶ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/012.yaml
  text: The first woe has passed[a]. Behold[b], two woes are still coming after these things.
translation:
  language: ru
  text: Первое горе миновало[a]. Вот, после этих событий грядут ещё два горя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом буквально: «то одно горе миновало»; по контексту речь идёт о первом из трёх горе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: горе
  rationale: Сохраняет формулу пророческого возвещения бедствия и суда, а также связь с тремя «горестями» в контексте Откровения.
- source_word: ἡ μία
  choice: первое
  rationale: Буквально сочетание означает «одно», но в последовательности из трёх горестей имеет порядковое значение; «первое» естественно передаёт функцию выражения.
- source_word: ἀπῆλθεν
  choice: миновало
  rationale: Передаёт завершённость первого горя и по-русски естественно сочетается со словом «горе», не навязывая пространственного смысла «ушло».
- source_word: ἰδού
  choice: вот
  rationale: Привлекает внимание к последующему возвещению и сохраняет возвышенный пророческий тон без архаичного «се».
- source_word: ἔρχεται
  choice: грядут
  rationale: Передаёт яркую направленность предстоящих событий; множественное число соответствует русской грамматике при подлежащем «два горя», несмотря на единственное число греческого глагола.
- source_word: ἔτι
  choice: ещё
  rationale: Показывает, что после первого остаются два дополнительных горя.
- source_word: μετὰ ταῦτα
  choice: после этого
  rationale: Естественная русская передача временной последовательности; формальное «после этих событий» возможно, но здесь звучит тяжелее.
theological_decisions:
- issue: Апокалиптическая последовательность трёх горестей
  choice: Стих отмечает завершение первого горя и предстоящее наступление ещё двух.
  alternative: Передать οὐαί как общее «бедствие» или «суд», ослабив повторяющуюся формулу.
  rationale: Слово «горе» и порядковое «первое» сохраняют литературную и богословскую структуру нарастающей последовательности судов, не добавляя толкования об их природе.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. «Вот» предпочтено архаичному «се», а «грядут» сохраняет торжественную неотвратимость возвещения.
