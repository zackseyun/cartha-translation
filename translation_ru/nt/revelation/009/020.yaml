id: REV.9.20
reference: Revelation 9:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ οἱ λοιποὶ τῶν ἀνθρώπων, οἳ οὐκ ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις, ⸀οὐδὲ μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν, ἵνα μὴ ⸀προσκυνήσουσιν τὰ δαιμόνια καὶ τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα, ἃ οὔτε βλέπειν ⸀δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/020.yaml
  text: And the rest of humanity[a], who were not killed by these plagues, did not even repent of the works of their hands, so as not to worship demons and the idols of gold and silver and bronze and stone and wood[c][b], which can neither see nor hear nor walk.
translation:
  language: ru
  text: А остальные люди, которых не убили эти язвы, даже не раскаялись в делах своих рук[a], чтобы не поклоняться[b] демонам и идолам — золотым, серебряным, медным, каменным и деревянным, которые не могут ни видеть, ни слышать, ни ходить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от дел своих рук». В данном контексте речь прежде всего о том, что люди изготовили и чему поклонялись, однако выражение может охватывать и их дела в более широком смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен также перевод: «так что они не поклонялись бы». Греческий оборот может обозначать цель или предполагаемый результат раскаяния.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν ἀνθρώπων
  choice: остальные люди
  rationale: Передаёт собирательное и обобщённое значение ἀνθρώπων без указания исключительно на мужчин; по-русски звучит естественно.
- source_word: ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις
  choice: не погибшие от этих бедствий
  rationale: Пассив ἀποκτείνω означает, что они не были убиты; «погибшие» естественно в данном контексте. πληγαί в Откровении обозначает губительные кары или бедствия; «бедствия» сохраняет широкий смысл.
- source_word: οὐδὲ μετενόησαν
  choice: даже не раскаялись
  rationale: '«Даже» передаёт усилительную силу οὐδέ: пережив бедствия, остальные всё же не раскаялись.'
- source_word: ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν
  choice: в делах своих рук
  rationale: Сохраняется конкретный библейский образ рукотворных дел, который в контексте прежде всего указывает на изготовленных и почитаемых идолов; управление «раскаяться в» естественно для русского языка.
- source_word: ἵνα μὴ προσκυνήσουσιν
  choice: чтобы больше не поклоняться
  rationale: Передаёт цель или предполагаемый результат раскаяния — прекращение идолопоклонства. «Больше не» ясно показывает отказ от продолжавшейся практики, не превращая оборот в отдельное независимое действие.
- source_word: τὰ δαιμόνια
  choice: бесам
  rationale: «Бесы» — ясное и традиционно понятное русское обозначение враждебных духовных существ в новозаветном контексте.
- source_word: τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα
  choice: идолам — золотым, серебряным, медным, каменным и деревянным
  rationale: «Идолы» точно выражает культовый смысл εἴδωλα, а последовательность определений сохраняет накопительный перечень материалов оригинала.
- source_word: ἃ οὔτε βλέπειν δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν
  choice: которые не могут ни видеть, ни слышать, ни ходить
  rationale: Буквально и естественно передаёт тройное описание бессилия идолов; περιπατεῖν означает именно «ходить».
theological_decisions:
- issue: Связь раскаяния с прекращением поклонения бесам и идолам
  choice: «чтобы больше не поклоняться» как цель или предполагаемый результат раскаяния
  alternative: «так что они не поклонялись бы» / «и не перестали поклоняться»
  rationale: Оборот с ἵνα μή допускает оттенок цели или предполагаемого результата. Основной текст сохраняет эту связь, не сводя раскаяние лишь к внешнему прекращению обряда; сноска отмечает допустимую смысловую вариативность.
- issue: Объём выражения «дела своих рук»
  choice: сохранить образ буквально, не ограничивая его только идолами
  alternative: «в том, что изготовили своими руками»
  rationale: Хотя ближайший контекст подчёркивает рукотворных идолов, выражение может охватывать дела шире. Буквальный образ сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся доступным, перечисление материалов и тройное «ни» сохраняют риторическую силу оригинала. «Бедствия» выбрано вместо более узкого «язвы», чтобы естественно передать апокалиптические πληγαί без ненужной медицинской окраски.
