base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/015.yaml
  text: And the four angels who had been prepared for the hour and day and month and year were released[b][a], so that they might kill a third of humanity.
translation:
  language: ru
  text: И были освобождены четыре ангела, приготовленные к часу, дню, месяцу и году[a], чтобы убить треть людей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для часа, дня, месяца и года». Это выражение может подчёркивать точно назначенное время; возможно также понимание его как периода продолжительностью год, месяц, день и час.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «треть человечества». Имеются в виду люди вообще, а не только мужчины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύθησαν
  choice: были освобождены
  rationale: Аорист страдательного залога от λύω. Перевод сохраняет пассивную конструкцию и связь с тем, что прежде ангелы были связаны (ст. 14), оставаясь естественным для современного русского языка.
- source_word: ἄγγελοι
  choice: ангела
  rationale: В апокалиптическом контексте Откровения речь идёт о сверхъестественных существах, а не о человеческих посланниках.
- source_word: ἡτοιμασμένοι
  choice: приготовленные
  rationale: Перфектное страдательное причастие обозначает ранее совершённое приготовление и сохраняющееся состояние готовности.
- source_word: εἰς τὴν ὥραν καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν
  choice: к тому часу, дню, месяцу и году
  rationale: Сохраняется накопительная последовательность единиц времени; указательное «тому» естественно передаёт определённость греческого артикля, не добавляя явного указания на продолжительность периода.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое значение придаточного предложения естественной современной русской конструкцией.
- source_word: ἀποκτείνωσιν
  choice: убить
  rationale: Прямой и современный эквивалент со значением лишения жизни; форма в конструкции с «чтобы» естественно передаёт греческий конъюнктив.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: треть людей
  rationale: Партитивное выражение означает одну треть; ἄνθρωποι здесь обозначает людей вообще, а не только мужчин.
theological_decisions:
- issue: Значение временной последовательности «час, день, месяц и год»
  choice: Сохранена формулировка, указывающая на определённое время с нарастающей точностью.
  alternative: Понимать выражение как суммарный период продолжительностью год, месяц, день и час.
  rationale: Греческая конструкция естественно допускает акцент на точно назначенном моменте, однако перевод не вводит толкование апокалиптической хронологии и не исключает полностью понимание как периода.
- issue: Объём значения ἀνθρώπων
  choice: людей
  alternative: человечества
  rationale: Слово относится к человеческим существам вообще. «Людей» точно передаёт родительный партитив и не создаёт мужского ограничения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены пассивная конструкция, порядок временных обозначений и целевая связь; архаизмы вроде «умертвить» и «разрешены» не использованы.
