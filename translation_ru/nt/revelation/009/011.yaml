base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/011.yaml
  text: They have over them as king the angel of the abyss[a]. His name in Hebrew is Abaddon[c][b], and in Greek he has the name Apollyon.
translation:
  language: ru
  text: Царём над ними они имеют ангела бездны[a]. По-еврейски имя ему — Аваддон[b], а по-гречески он носит имя Аполлион[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бездонной пропасти».'
    reason: alternative_reading
  - marker: b
    text: Имя «Аваддон» связано с еврейским словом, означающим гибель или разрушение.
    reason: lexical_alternative
  - marker: c
    text: Греческое имя «Аполлион» означает «Губитель».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσιν ἐπ’ αὐτῶν βασιλέα
  choice: Царём над собой они имеют
  rationale: Сохранена греческая конструкция с ἔχω («иметь») и ἐπί с родительным падежом («над ними»), но порядок слов приспособлен к естественному русскому синтаксису. βασιλέα передано конкретным словом «царём», сохраняющим царский образ.
- source_word: τὸν ἄγγελον τῆς ἀβύσσου
  choice: ангела бездны
  rationale: В контексте Откровения ἄγγελος естественно означает «ангел». Слово ἄβυσσος прямо передано как «бездна»; более развернутый традиционный вариант дан в сноске.
- source_word: ὄνομα αὐτῷ
  choice: имя ему
  rationale: Дательный αὐτῷ сохранён в естественном для литературного русского обороте «имя ему», который также передаёт несколько возвышенный стиль оригинала.
- source_word: Ἑβραϊστὶ
  choice: по-еврейски
  rationale: Наречие означает «на еврейском языке»; «по-еврейски» кратко и естественно передаёт противопоставление греческому имени.
- source_word: Ἀβαδδών
  choice: Аваддон
  rationale: Имя транслитерировано в принятой русской библейской форме, а связанное с ним значение разрушения указано в сноске.
- source_word: καὶ ἐν τῇ Ἑλληνικῇ
  choice: а по-гречески
  rationale: Союз «а» естественно выражает сопоставление еврейской и греческой форм имени.
- source_word: ὄνομα ἔχει
  choice: он носит имя
  rationale: Оборот сохраняет повтор слова «имя» в оригинале и при этом звучит естественнее по-русски, чем буквальное «имеет имя».
- source_word: Ἀπολλύων
  choice: Аполлион
  rationale: Греческая форма передана как собственное имя; её прозрачное значение «Губитель» сохранено в сноске.
theological_decisions:
- issue: Перевод или транслитерация имён Ἀβαδδών и Ἀπολλύων
  choice: 'Оба имени транслитерированы в основном тексте: «Аваддон» и «Аполлион».'
  alternative: 'Передать одно или оба имени по значению: «Гибель» / «Губитель».'
  rationale: В стихе обе формы прямо названы именами ангела. Транслитерация сохраняет их функцию собственных имён, а важные смысловые оттенки не утрачиваются благодаря сноскам.
- issue: Передача ἀβύσσου
  choice: бездна
  alternative: бездонная пропасть
  rationale: «Бездна» — прямой, краткий и привычный русский эквивалент, не добавляющий к образу уточнения, которого нет непосредственно в греческом слове. Альтернативный образный вариант указан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов сохраняет акцент на царской власти ангела, а параллельные обороты «по-еврейски» и «по-гречески» ясно передают структуру оригинала.
