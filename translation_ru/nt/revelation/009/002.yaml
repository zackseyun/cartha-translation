revisions:
- from: И он открыл колодец бездны[a]. Из колодца поднялся дым, словно дым из огромной печи, и солнце и воздух были омрачены дымом из колодца.
  to: И он открыл шахту бездны[a]. Из шахты поднялся дым, словно дым из большой печи, и солнце и воздух были затемнены дымом из шахты.
  rationale: Заменены «колодец» на «шахта» и «огромной» на «большой». Эти правки точнее передают пространственный образ φρέαρ и меру μεγάλης, не меняя смысла и не внося конфессионального толкования. Сноска пересмотрена так, чтобы естественно отражать лексический диапазон и традиционный вариант.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:34:56Z'
