id: REV.9.2
reference: Revelation 9:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἤνοιξεν τὸ φρέαρ τῆς ἀβύσσου, καὶ ἀνέβη καπνὸς ἐκ τοῦ φρέατος ὡς καπνὸς καμίνου ⸀μεγάλης, καὶ ⸀ἐσκοτώθη ὁ ἥλιος καὶ ὁ ἀὴρ ἐκ τοῦ καπνοῦ τοῦ φρέατος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/002.yaml
  text: And he opened the shaft of the abyss[a], and smoke went up from the shaft like the smoke of a great furnace, and the sun and the air were darkened by the smoke from the shaft.
translation:
  language: ru
  text: И он открыл шахту бездны[a]. Из шахты поднялся дым, словно дым из большой печи, и солнце и воздух были затемнены дымом из шахты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «яма бездны»; традиционно: «кладезь бездны».'
    reason: Слово φρέαρ может обозначать колодец, яму или вертикальный проход. Основной текст передаёт его как «шахта», чтобы сохранить различие между проходом и самой бездной; сноска отмечает возможный вариант и традиционную формулировку.
lexical_decisions:
- source_word: ἤνοιξεν
  choice: открыл
  rationale: Прямо передаёт аорист глагола ἀνοίγω, не уточняя способ открытия.
- source_word: φρέαρ
  choice: колодец
  rationale: Передаёт вертикальное углубление или проход и сохраняет отличие φρέαρ от самой ἄβυσσος. В данном образе это отверстие, ведущее в бездну.
- source_word: ἀβύσσου
  choice: бездны
  rationale: Прямой и укоренившийся русский эквивалент, не добавляющий толкования «бездонная яма».
- source_word: ἀνέβη
  choice: поднялся
  rationale: Естественно передаёт направленное вверх движение дыма.
- source_word: ὡς καπνὸς καμίνου μεγάλης
  choice: словно дым из огромной печи
  rationale: Сохраняет сравнение и мощь образа; «печь» понятно современному читателю, а «огромной» естественно передаёт μεγάλης.
- source_word: ἐσκοτώθη
  choice: были омрачены
  rationale: Сохраняет страдательное значение греческой формы и совместное воздействие дыма на солнце и воздух.
- source_word: ὁ ἀὴρ
  choice: воздух
  rationale: Непосредственно обозначает воздух или атмосферу; перевод «небо» неоправданно изменил бы образ.
- source_word: ἐκ τοῦ καπνοῦ τοῦ φρέατος
  choice: дымом из колодца
  rationale: Естественно выражает одновременно источник дыма и его причинную роль в омрачении.
theological_decisions:
- issue: Передача апокалиптического места без внесения традиционного истолкования
  choice: «колодец бездны» с пояснением в сноске
  alternative: «бездонная яма»; «провал бездны»; «шахта бездны»
  rationale: Формулировка различает отверстие или проход (φρέαρ) и бездну (ἄβυσσος), не отождествляя их и не добавляя к тексту признак бездонности.
translation_notes:
  register: Современный литературный русский с торжественным, но не архаичным звучанием. Повтор слова «колодец» сохранён вслед за греческим текстом; «кладезь» вынесен в сноску как традиционный, но устаревший вариант.
