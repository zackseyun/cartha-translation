source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἄγγελος ἐσάλπισεν· καὶ εἶδον ἀστέρα ἐκ τοῦ οὐρανοῦ πεπτωκότα εἰς τὴν γῆν, καὶ ἐδόθη αὐτῷ ἡ κλεὶς τοῦ φρέατος τῆς ἀβύσσου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/001.yaml
  text: And the fifth angel sounded the trumpet[a], and I saw a star that had fallen from heaven to the earth[c][b], and the key to the shaft of the abyss was given to him.
translation:
  language: ru
  text: И пятый ангел затрубил, и я увидел звезду, упавшую с неба на землю[a], и ей[b] был дан ключ от колодца, ведущего в бездну[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Можно также: «звезду, уже упавшую с неба на землю». Греческая форма указывает, что падение, вероятно, уже произошло к тому времени, когда Иоанн увидел звезду.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте местоимение имеет мужской род — «ему», поскольку греческое слово «звезда» мужского рода. Продолжение рассказа может представлять звезду как образ личностного существа, но прямо оно не названо.
    reason: alternative_reading
  - marker: c
    text: 'Или: «шахты бездны», «ямы бездны». Греческое слово может обозначать глубокий колодец, яму или шахту; здесь речь идёт о проходе в бездну. Традиционный перевод: «кладезь бездны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: затрубил
  rationale: Глагол означает «трубить, подавать звук трубой». Русское «затрубил» естественно передаёт действие, не требуя добавлять отсутствующее в греческом существительное «труба».
- source_word: ἀστέρα
  choice: звезду
  rationale: Сохранён буквальный апокалиптический образ звезды; возможное указание на личностное существо не внесено в основной текст как толкование.
- source_word: πεπτωκότα
  choice: упавшую
  rationale: 'Перфектное причастие обозначает уже совершившееся падение и возникшее состояние: когда Иоанн увидел звезду, она уже упала.'
- source_word: ἐκ τοῦ οὐρανοῦ ... εἰς τὴν γῆν
  choice: с неба на землю
  rationale: Передан пространственный и космический контраст исходного текста; «небо» в видении предпочтительнее более узкого «небосвод».
- source_word: ἐδόθη αὐτῷ
  choice: был дан ей
  rationale: Сохранена пассивная конструкция без указания дающего. Женский род местоимения обусловлен грамматическим родом русского слова «звезда»; мужской род греческого местоимения отмечен в сноске.
- source_word: ἡ κλεὶς
  choice: ключ
  rationale: Определённость выражена контекстом и естественной русской конструкцией «дан ключ»; искусственное добавление указательного слова не требуется.
- source_word: τοῦ φρέατος τῆς ἀβύσσου
  choice: от колодца бездны
  rationale: φρέαρ обозначает колодец, шахту или глубокую яму, то есть вход к бездне, тогда как ἄβυσσος обозначает саму бездну. Генитивная связь сохранена.
theological_decisions:
- issue: Следует ли прямо отождествить «звезду» с ангелом или сатанинской фигурой
  choice: В основном тексте сохранён образ звезды без отождествления
  alternative: «ангел», «духовное существо» или «сатанинская фигура»
  rationale: Текст изображает деятеля как звезду и далее употребляет мужское местоимение, что допускает личностный символизм, но прямо не раскрывает его тождества.
- issue: Следует ли назвать Бога тем, кто дал ключ
  choice: Сохранён пассив «был дан» без названного деятеля
  alternative: «Бог дал ей/ему ключ»
  rationale: Греческий текст не называет дающего. Возможный божественный источник власти не следует превращать из подразумеваемого в явно высказанный.
- issue: Как передать смену грамматического рода между греческим и русским
  choice: В основном тексте использовано согласованное русское «ей», а греческий мужской род вынесен в сноску
  alternative: Несогласованное «ему», подчёркивающее личностный смысл символа
  rationale: «Ей» необходимо для естественного современного русского языка, тогда как сноска сохраняет важную особенность оригинала и не навязывает конкретного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом, подходящим для апокалиптического повествования. Синтаксический повтор «и» сохраняет последовательность греческого текста. Архаизмы исключены из основного текста; традиционное «кладезь» приведено только в сноске.
