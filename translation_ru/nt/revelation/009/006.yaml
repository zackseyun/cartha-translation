id: REV.9.6
reference: Revelation 9:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐν ταῖς ἡμέραις ἐκείναις ζητήσουσιν οἱ ἄνθρωποι τὸν θάνατον καὶ οὐ μὴ εὑρήσουσιν αὐτόν, καὶ ἐπιθυμήσουσιν ἀποθανεῖν καὶ ⸀φεύγει ⸂ὁ θάνατος ἀπ’ αὐτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/006.yaml
  text: And in those days people will seek death and will certainly not find it[a], and they will long to die, but death flees from them.
translation:
  language: ru
  text: В те дни люди будут искать смерти, но никак не найдут её; они будут жаждать умереть, но смерть бежит от них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: в те дни
  rationale: Естественное русское соответствие устойчивому временному выражению, сохраняющее указательное значение ἐκείναις.
- source_word: ζητήσουσιν
  choice: будут искать
  rationale: Передаёт намеренное, настойчивое стремление найти смерть и сохраняет будущую форму.
- source_word: οἱ ἄνθρωποι
  choice: люди
  rationale: В данном контексте ἄνθρωποι обозначает людей вообще, а не только мужчин; современное русское «люди» точно передаёт родовое значение.
- source_word: οὐ μὴ εὑρήσουσιν αὐτόν
  choice: ни за что её не найдут
  rationale: Сочетание οὐ μή с будущим временем выражает усиленное отрицание. Оборот «ни за что не найдут» передаёт эту категоричность естественно и торжественно; местоимение согласовано с русским словом «смерть».
- source_word: ἐπιθυμήσουσιν ἀποθανεῖν
  choice: будут жаждать умереть
  rationale: «Жаждать» передаёт сильное желание, выраженное ἐπιθυμέω, не ослабляя сурового образа.
- source_word: φεύγει ὁ θάνατος ἀπ’ αὐτῶν
  choice: смерть бежит от них
  rationale: Сохранены олицетворение смерти и драматическое настоящее время φεύγει, контрастирующее с будущими формами первой части стиха.
theological_decisions:
- issue: Олицетворение смерти в картине суда
  choice: 'Сохранить прямой образ: «смерть бежит от них».'
  alternative: 'Передать смысл пояснительно: «они не смогут умереть».'
  rationale: Греческий текст прямо делает смерть подлежащим глагола φεύγει. Буквенный образ сохраняет апокалиптическую напряжённость и не сводит её к объясняющему пересказу.
- issue: Обобщающее значение οἱ ἄνθρωποι
  choice: «люди»
  alternative: «мужчины» или «человечество»
  rationale: В контексте речь идёт о людях вообще. «Люди» точно и естественно передаёт обобщающее значение без неоправданного ограничения только мужским полом и без абстрактности слова «человечество».
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Точка с запятой подчёркивает параллелизм двух безуспешных стремлений. Настоящее время «бежит» намеренно сохранено как яркий переход от будущих форм к живому олицетворённому образу.
