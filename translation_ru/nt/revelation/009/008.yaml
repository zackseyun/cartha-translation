lexical_decisions:
- source_word: εἶχον
  choice: у них были
  rationale: Имперфект ἔχω в описании видения естественно передаётся русским прошедшим временем; конструкция «у них были» идиоматична.
- source_word: τρίχας
  choice: волосы
  rationale: Греческое множественное число естественно соответствует русскому собирательному употреблению слова «волосы».
- source_word: ὡς τρίχας γυναικῶν
  choice: как волосы у женщин
  rationale: ὡς вводит прямое сравнение; формулировка сохраняет образ и звучит естественно в современном русском языке.
- source_word: οἱ ὀδόντες αὐτῶν
  choice: зубы у них
  rationale: Так естественно передаётся греческая именная группа с притяжательным местоимением и сохраняется параллелизм фразы.
- source_word: ὡς λεόντων
  choice: как у львов
  rationale: Родительный множественного числа указывает на львов; русская эллиптическая конструкция ясно подразумевает «зубы», не добавляя лишнего повторения.
- source_word: ἦσαν
  choice: были
  rationale: Имперфект εἰμί в описательном контексте передан обычным русским прошедшим временем.
theological_decisions:
- issue: Характер образов в апокалиптическом описании
  choice: Сохранить сравнения без символического истолкования.
  alternative: Добавить объяснение предполагаемого символического смысла женских волос и львиных зубов.
  rationale: Греческий текст лишь представляет образы через ὡς и не объясняет их значения; перевод не должен устранять эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Тире подчёркивают два зрительных сравнения; повтор «у них были» сохраняет структуру греческого описания.
