  text: καὶ ἐκ τοῦ καπνοῦ ἐξῆλθον ἀκρίδες εἰς τὴν γῆν, καὶ ἐδόθη αὐταῖς ἐξουσία ὡς ἔχουσιν ἐξουσίαν οἱ σκορπίοι τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/003.yaml
  text: And out of the smoke came locusts onto the earth[a], and authority was given to them, as the scorpions of the earth have authority.
translation:
  language: ru
  text: И из дыма вышла на землю саранча, и ей была дана власть — такая, какая есть у земных скорпионов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сила». Греческое слово может означать власть, право, полномочие или силу; здесь «власть» подчёркивает, что это полномочие было дано.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ καπνοῦ
  choice: из дыма
  rationale: Предлог ἐκ передаёт движение изнутри наружу; естественное русское «из дыма» сохраняет образ появления.
- source_word: ἐξῆλθον
  choice: вышла
  rationale: Аорист ἐξέρχομαι обозначает выход или появление. Собирательное русское «саранча» требует единственного числа.
- source_word: ἀκρίδες
  choice: саранча
  rationale: ἀκρίς обычно означает саранчу; в русском языке это естественное собирательное существительное для множества этих насекомых.
- source_word: εἰς τὴν γῆν
  choice: на землю
  rationale: εἰς выражает направленное движение; «на землю» естественно передаёт движение к земной поверхности, а γῆ в контексте Откровения имеет широкий смысл.
- source_word: ἐδόθη αὐταῖς ἐξουσία
  choice: дана была ей власть
  rationale: «Власть» передаёт ἐξουσία как предоставленное право или полномочие, а страдательная конструкция сохраняет подразумеваемое, но не названное лицо, давшее её. Единственное «ей» согласовано с собирательным «саранча».
- source_word: ὡς ἔχουσιν ἐξουσίαν
  choice: подобная власти
  rationale: ὡς вводит сравнение. Такая формулировка естественна по-русски и сохраняет повтор понятия ἐξουσία.
- source_word: οἱ σκορπίοι τῆς γῆς
  choice: земных скорпионов
  rationale: «Земные скорпионы» кратко и естественно передаёт определительную конструкцию τῆς γῆς, отличая обычных скорпионов земли от апокалиптической саранчи.
theological_decisions:
- issue: Характер способности, данной саранче
  choice: Передать ἐξουσία словом «власть» и сохранить безличную страдательную конструкцию «дана была», не называя дающего.
  alternative: Перевести как «сила» или прямо назвать Бога дающим.
  rationale: Греческий текст подчёркивает предоставленное полномочие или дозволение, а не независимую силу; при этом он не называет дающего, поэтому перевод сохраняет эту сдержанность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической формой. Инверсия «дана была» сохраняет библейскую выразительность без архаизации; собирательное «саранча» согласовано в единственном числе.
