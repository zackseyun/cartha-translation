lexical_decisions:
- source_word: ἀριθμὸς
  choice: число
  rationale: Прямой и естественный эквивалент; повтор слова в обеих частях стиха сохраняет повтор греческого текста.
- source_word: στρατευμάτων τοῦ ἱππικοῦ
  choice: конных войск
  rationale: Передаёт воинские подразделения, составляющие конницу, и звучит естественно в современном русском языке; не заменяет коллективное обозначение отдельными всадниками.
- source_word: δισμυριάδες μυριάδων
  choice: двести миллионов
  rationale: Греческое выражение обозначает две мириады мириад, то есть 200 000 000. Числовое значение ясно передано в основном тексте, а буквальная форма сохранена в сноске.
- source_word: ἤκουσα
  choice: я слышал
  rationale: Прямая передача повествовательного аориста без дополнительного смыслового оттенка.
- source_word: αὐτῶν
  choice: их
  rationale: Местоимение отсылает к конным войскам; формулировка «их число» также сохраняет структуру и повтор исходного текста.
