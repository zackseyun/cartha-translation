id: REV.9.10
reference: Revelation 9:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἔχουσιν οὐρὰς ὁμοίας σκορπίοις καὶ κέντρα, καὶ ἐν ταῖς οὐραῖς αὐτῶν ⸂ἡ ἐξουσία αὐτῶν⸃ ἀδικῆσαι τοὺς ἀνθρώπους μῆνας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/010.yaml
  text: And they have tails like scorpions[a], and stingers; and in their tails is their power to harm people for five months.
translation:
  language: ru
  text: У них хвосты, подобные скорпионам, и жала; в их хвостах — сила причинять людям вред в течение пяти месяцев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρὰς ὁμοίας σκορπίοις
  choice: хвосты, подобные хвостам скорпионов
  rationale: Дательный при ὁμοίας выражает сравнение. Повтор «хвостам» естественно уточняет, что сравниваются именно хвосты, а не существа целиком.
- source_word: κέντρα
  choice: жала
  rationale: В образе скорпионов слово обозначает колющие органы на хвостах; «жала» точно и естественно передаёт конкретную деталь видения.
- source_word: ἐξουσία
  choice: сила
  rationale: В сочетании с инфинитивом ἀδικῆσαι речь прежде всего о действенной способности причинять вред. «Сила» сохраняет этот смысл, не исключая того, что она дана или допущена свыше.
- source_word: ἀδικῆσαι
  choice: причинять вред
  rationale: В контексте бедствия глагол обозначает нанесение вреда, а не отвлечённую несправедливость.
- source_word: τοὺς ἀνθρώπους
  choice: людям
  rationale: Здесь ἄνθρωποι обозначает людей вообще; современное русское «людям» точно передаёт общий референт без ненужного гендерного ограничения.
- source_word: μῆνας πέντε
  choice: в течение пяти месяцев
  rationale: Винительный длительности обозначает продолжительность действия; эта формулировка ясно передаёт временной предел.
theological_decisions:
- issue: Значение ἐξουσία в образе апокалиптического бедствия
  choice: сила
  alternative: власть
  rationale: Контекст непосредственно описывает способность наносить вред хвостами. «Сила» передаёт действенную возможность и при этом не решает сверх текста вопрос об источнике или характере данного полномочия.
translation_notes:
  register: Современный литературный русский язык; образность и синтаксический параллелизм оригинала сохранены, при этом эллиптическое сравнение уточнено естественным для русского повтором «хвостам».
