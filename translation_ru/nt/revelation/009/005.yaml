source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτοῖς ἵνα μὴ ἀποκτείνωσιν αὐτούς, ἀλλ’ ἵνα ⸀βασανισθήσονται μῆνας πέντε· καὶ ὁ βασανισμὸς αὐτῶν ὡς βασανισμὸς σκορπίου, ὅταν παίσῃ ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/005.yaml
  text: And it was given to them that they should not kill them[a], but that they should be tormented for five months[b]; and their torment was like the torment of a scorpion when it strikes a man.
translation:
  language: ru
  text: Им было дано не убивать их, а мучить пять месяцев; и мучение от них было подобно мучению от скорпиона, когда скорпион поражает человека[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, точнее по контексту: «жалит человека».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτοῖς
  choice: им было дано
  rationale: Сохранены безлично-пассивная форма и неназванный податель дозволения; это передаёт характерный для Откровения оборот, не добавляя прямо имени Бога.
- source_word: ἵνα μὴ ἀποκτείνωσιν αὐτούς
  choice: не убивать их
  rationale: Русский инфинитив естественно выражает содержание данного им дозволения и сохраняет местоименное обозначение жертв.
- source_word: ἀλλ’ ἵνα βασανισθήσονται μῆνας πέντε
  choice: а мучить пять месяцев
  rationale: 'Активная конструкция естественна по-русски и ясно сохраняет противопоставление: им дано не убивать, а причинять мучение в течение указанного срока. Необычная греческая будущая пассивная форма после ἵνα передана по смыслу без тяжеловесной двусмысленности местоимений.'
- source_word: βασανισθήσονται / βασανισμός
  choice: мучить / мучение
  rationale: Корень «муч-» сохраняет лексический повтор и обозначает сильное страдание, не сужая смысл до судебной пытки.
- source_word: ὁ βασανισμὸς αὐτῶν
  choice: мучение от них
  rationale: Оборот передаёт мучение, исходящее от саранчи-подобных существ, и остаётся ближе к широкой связи греческого родительного, чем развёрнутое «которое они причиняли».
- source_word: ὡς βασανισμὸς σκορπίου
  choice: подобно мучению от скорпиона
  rationale: Сохранены сравнение, повтор слова «мучение» и образ боли, причиняемой скорпионом.
- source_word: ὅταν παίσῃ ἄνθρωπον
  choice: когда он поражает человека
  rationale: «Поражает» сохраняет основное значение παίω — наносить удар, тогда как более конкретное для скорпиона «жалит» отмечено в сноске. «Человека» естественно передаёт родовое значение ἄνθρωπον без ограничения только мужчинами.
theological_decisions:
- issue: Божественный пассив в апокалиптическом суде
  choice: Сохранить «им было дано», не называя того, кто дал дозволение.
  alternative: «Бог позволил им» или «им было позволено»
  rationale: Греческий текст оставляет подателя неназванным. Явное упоминание Бога устранило бы намеренную недосказанность, а «было позволено» ослабило бы образ данного полномочия.
- issue: Отношение между действующими существами и мучимыми людьми
  choice: Передать вторую часть активным «а мучить», сохранив тот же подразумеваемый субъект.
  alternative: «а чтобы те мучились»
  rationale: Пассивный вариант формально ближе к βασανισθήσονται, но по-русски требует добавочного указательного местоимения и звучит менее естественно. Активная форма не меняет роли участников в контексте.
- issue: Родовое значение ἄνθρωπον
  choice: «человека»
  alternative: «мужчину»
  rationale: ἄνθρωπος здесь обозначает человека вообще; русское «человека» точно сохраняет это родовое значение и не вносит необоснованного ограничения по полу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Порядок слов сделан естественным для русского, при этом сохранены пассив «им было дано», противопоставление убийства и мучения, пятимесячный срок и повтор «мучить / мучение».
