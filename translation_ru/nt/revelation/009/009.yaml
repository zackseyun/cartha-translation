source:
  edition: SBLGNT
  text: καὶ εἶχον θώρακας ὡς θώρακας σιδηροῦς, καὶ ἡ φωνὴ τῶν πτερύγων αὐτῶν ὡς φωνὴ ἁρμάτων ἵππων πολλῶν τρεχόντων εἰς πόλεμον·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/009.yaml
  text: And they had breastplates like iron breastplates[a], and the sound of their wings was like the sound of many chariots with horses rushing into battle.
translation:
  language: ru
  text: На них были панцири, подобные железным панцирям, а шум их крыльев был подобен грохоту колесниц с множеством коней, мчащихся в бой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «как звук колесниц многих коней, бегущих в бой».'
    reason: Греческое сочетание допускает более буквальную передачу, в которой синтаксическая связь между колесницами и множеством коней остаётся несколько сжатой и неоднозначной.
lexical_decisions:
- source_word: θώρακας
  choice: панцири
  rationale: Слово обозначает защитное вооружение груди и туловища; «панцири» точно и естественно передаёт образ в данном воинском контексте.
- source_word: ὡς θώρακας σιδηροῦς
  choice: подобные железным панцирям
  rationale: Сохраняет явное сравнение, выраженное ὡς, не превращая образ в буквальное утверждение.
- source_word: φωνὴ
  choice: шум / грохот
  rationale: Здесь речь идёт не о голосе, а о слышимом звуке; «шум» естественно относится к крыльям, а «грохот» живо передаёт звук колесниц.
- source_word: πτερύγων
  choice: крыльев
  rationale: Прямой и однозначный эквивалент πτέρυγες.
- source_word: ἁρμάτων ἵππων πολλῶν
  choice: колесниц с множеством коней
  rationale: Сохраняет в тексте и колесницы, и множество коней, не уточняя сверх греческого текста характер их связи.
- source_word: τρεχόντων
  choice: мчащихся
  rationale: Передаёт быстрое движение, выраженное τρέχω, и естественно сочетается с военным образом.
- source_word: εἰς πόλεμον
  choice: в бой
  rationale: В контексте стремительно движущихся колесниц краткое «в бой» естественно передаёт направленность к сражению.
theological_decisions:
- issue: Характер образов в видении Иоанна
  choice: Описание передано как последовательность сравнений без отождествления существ с конкретными машинами, демонами или историческими армиями.
  alternative: Истолковать образы непосредственно в переводе как буквенную военную технику либо как определённую символическую силу.
  rationale: Частица ὡς прямо маркирует сравнения; перевод должен сохранять апокалиптическую образность и её возможную многозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной апокалиптической образностью. Различение «шума» крыльев и «грохота» колесниц делает фразу естественной по-русски, сохраняя единое греческое φωνή на уровне общего звукового образа.
