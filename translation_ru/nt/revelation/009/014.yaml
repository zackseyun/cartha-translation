translation:
  language: ru
  text: 'говорящий шестому ангелу, державшему трубу: «Освободи четырёх ангелов, связанных у великой реки Евфрат».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые были связаны» или «связанных прежде»; греческое перфектное страдательное причастие указывает на их нынешнее состояние связанности как результат прежнего связывания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντα
  choice: говоривший
  rationale: Причастие согласуется с «голосом» из предыдущего стиха и продолжает его характеристику; русское причастие естественно связывает фразу с контекстом.
- source_word: τῷ ἕκτῳ ἀγγέλῳ
  choice: шестому ангелу
  rationale: Прямая передача дательного падежа и порядкового числительного в естественном русском порядке слов.
- source_word: ὁ ἔχων τὴν σάλπιγγα
  choice: у которого была труба
  rationale: Оборот определяет шестого ангела через обладание трубой; такая формулировка естественна по-русски и сохраняет отсылку к уже названной трубе.
- source_word: Λῦσον
  choice: Освободи
  rationale: Аористный императив обозначает повеление снять удерживающие узы; «освободи» ясно и современно.
- source_word: τοὺς τέσσαρας ἀγγέλους
  choice: четырёх ангелов
  rationale: Прямая передача дополнения с числительным без добавочных толкований.
- source_word: τοὺς δεδεμένους
  choice: связанных
  rationale: Перфектное страдательное причастие выражает сохраняющееся состояние как результат прежнего связывания; русское «связанных» удерживает оба смысловых компонента.
- source_word: ἐπὶ τῷ ποταμῷ
  choice: у реки
  rationale: Предлог с дательным имеет здесь локативное значение; «у» естественно обозначает местонахождение возле реки, не уточняя берег или область.
- source_word: τῷ μεγάλῳ Εὐφράτῃ
  choice: великой реки Евфрат
  rationale: Сохраняются эпитет и собственное имя; несклоняемое приложение «Евфрат» после родового слова звучит понятно и литературно.
theological_decisions:
- issue: Личность и нравственный статус четырёх ангелов
  choice: Передать просто как «четырёх ангелов», не определяя, святые они или падшие.
  alternative: «четырёх падших ангелов» или «четырёх ангелов, назначенных для суда»
  rationale: Сам стих называет их лишь связанными ангелами у Евфрата. Уточнение их статуса внесло бы отсутствующий в тексте богословский вывод.
translation_notes:
  register: Современный литературный русский с сохранением торжественного апокалиптического регистра. Начальное причастие намеренно опирается на «голос» из предыдущего стиха; двоеточие естественно вводит прямую речь.
