  verdict: revise
  source_fidelity: '«Им было велено» передаёт контекстуально возможный авторитетный характер распоряжения, но ἐρρέθη буквально остаётся безличным пассивом «им было сказано» и не требует усиления до «велено». «Ни какой-либо зелени» неудачно оформляет πᾶν χλωρόν: в русском при данном собирательном существительном естественнее «ни всякой зелени». Остальные смысловые элементы, включая неуказанного говорящего, ограничительное εἰ μή, родительный оборот «печать Бога» и распределительное «на лбу», сохранены верно.'
  naturalness: 'Предлагаемая правка делает фразу более естественной для современного литературного русского: «сказано не причинять вреда» не звучит канцелярски, а параллельное «ни… ни… ни…» остаётся ясным. «На лбу» нормативно передаёт принадлежность каждому человеку в группе.'
  terminology: «Печать Бога» точно сохраняет ключевой образ σφραγὶς τοῦ θεοῦ без богословского истолкования. «Зелень» здесь уместна как широкое, контекстуально растительное обозначение substantivized χλωρόν; «всякой» адекватно передаёт πᾶν в отрицательной конструкции.
  issues:
