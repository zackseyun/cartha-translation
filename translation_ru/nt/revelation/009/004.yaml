    rationale: Пассив λέγω означает «им было сказано»; контекст указывает на распоряжение, но сам глагол не называет действие приказом.
  - severity: medium
    issue: Сочетание «ни какой-либо зелени» стилистически и грамматически неудачно.
    rationale: «Зелень» в этом значении собирательна; для πᾶν в конструкции с отрицанием естественно «ни всякой зелени».
  revised_text: Им было сказано не причинять вреда ни траве на земле, ни всякой зелени, ни какому-либо дереву, а только людям, у которых нет печати Бога на лбу.
