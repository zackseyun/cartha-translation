id: REV.9.4
reference: Revelation 9:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐρρέθη αὐταῖς ἵνα μὴ ⸀ἀδικήσουσιν τὸν χόρτον τῆς γῆς οὐδὲ πᾶν χλωρὸν οὐδὲ πᾶν δένδρον, εἰ μὴ τοὺς ἀνθρώπους οἵτινες οὐκ ἔχουσι τὴν σφραγῖδα τοῦ θεοῦ ἐπὶ τῶν ⸀μετώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/004.yaml
  text: And they were told not to harm the grass of the earth[a], or any green thing, or any tree, but only the people who do not have the seal of God on their foreheads.
translation:
  language: ru
  text: Им было сказано не причинять вреда ни траве на земле, ни всякой зелени, ни какому-либо дереву, а только людям, у которых нет печати Бога на лбу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρρέθη αὐταῖς
  choice: им было велено
  rationale: Безлично-пассивная конструкция сохраняет неуказанного говорящего; «велено» естественно передаёт авторитетный характер указания, не называя его источника.
- source_word: ἵνα μὴ ἀδικήσουσιν
  choice: не вредить
  rationale: В контексте суда ἀδικέω означает причинение вреда; инфинитив естественно зависит от «было велено».
- source_word: τὸν χόρτον τῆς γῆς
  choice: траве земной
  rationale: Передаёт χόρτος как траву и сохраняет связь с землёй; форма «земной» звучит естественно в возвышенной повествовательной речи.
- source_word: οὐδὲ πᾶν χλωρόν
  choice: ни какой-либо зелени
  rationale: Субстантивированное χλωρόν обозначает зелёную растительность в широком смысле. «Зелень» естественнее буквального «что-либо зелёное» и не сужает значение до отдельного вида растений.
- source_word: οὐδὲ πᾶν δένδρον
  choice: ни какому-либо дереву
  rationale: Прямое и естественное соответствие; повтор «какому-либо» передаёт πᾶν в отрицательной конструкции.
- source_word: εἰ μὴ
  choice: а только
  rationale: Ясно обозначает единственное исключение — людей, которым разрешено причинить вред.
- source_word: τοὺς ἀνθρώπους
  choice: тем людям
  rationale: ἄνθρωποι относится к людям вообще, а не только к мужчинам; дательный падеж обусловлен русским управлением глагола «вредить».
- source_word: οἵτινες οὐκ ἔχουσι
  choice: у которых нет
  rationale: Естественная русская конструкция обладания в отрицательной форме.
- source_word: τὴν σφραγῖδα τοῦ θεοῦ
  choice: печати Бога
  rationale: Сохраняет важный для Откровения образ печати как знака принадлежности и защиты, а также исходную родительную конструкцию.
- source_word: ἐπὶ τῶν μετώπων
  choice: на лбу
  rationale: Русское единственное число обычно употребляется при распределённой принадлежности частей тела нескольким лицам; смысл «на лбу каждого из них» ясен из относительного придаточного.
theological_decisions:
- issue: Объём значения ἀνθρώπους
  choice: люди вообще
  alternative: только мужчины
  rationale: Контекст противопоставляет растительность людям, имеющим или не имеющим Божьей печати; ограничения по полу в греческом тексте нет.
- issue: Источник повеления в пассивной конструкции
  choice: говорящий не назван
  alternative: явно назвать Бога источником повеления
  rationale: ἐρρέθη — пассивная форма, оставляющая говорящего невыраженным. Перевод не добавляет субъекта, хотя контекст подразумевает высшую власть.
- issue: Значение печати
  choice: сохранить образ без истолкования
  alternative: развернуть как знак Божьей принадлежности или защиты
  rationale: Текст называет «печать Бога», но в самом стихе не объясняет её значение; перевод сохраняет образ и его богословскую многозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Отрицательная координация оформлена естественной конструкцией «ни… ни… ни…». Местоимение, относящееся к саранче из контекста, передано нейтральным «им», что соответствует форме множественного числа и не вводит лишнего уточнения.
