  text: καὶ οὐ μετενόησαν ἐκ τῶν φόνων αὐτῶν οὔτε ἐκ τῶν ⸀φαρμάκων αὐτῶν οὔτε ἐκ τῆς πορνείας αὐτῶν οὔτε ἐκ τῶν κλεμμάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/021.yaml
  text: And they did not repent of their murders[a], or of their sorceries, or of their sexual immorality, or of their thefts.
translation:
  language: ru
  text: И они не раскаялись ни в своих убийствах, ни в своём колдовстве[a], ни в своей сексуальной безнравственности, ни в своих кражах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «магических действиях»; греческое слово также может обозначать зелья, яды или отравления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετενόησαν
  choice: не раскаялись
  rationale: В данном нравственном контексте глагол означает раскаяние и отказ от грехов, перечисленных далее; «не раскаялись» естественно передаёт эту мысль по-русски.
- source_word: ἐκ
  choice: в
  rationale: При русском глаголе «раскаяться» нормативно употребляется конструкция «раскаяться в чём-либо»; смысл оставления названных грехов сохраняется контекстом.
- source_word: φόνων
  choice: убийствах
  rationale: Слово обозначает убийства или лишение жизни; в перечне грехов «убийства» ясно передаёт его нравственно-преступный смысл.
- source_word: φαρμάκων
  choice: колдовстве
  rationale: В контексте Откровения наиболее вероятно значение оккультных или магических действий. Единственное собирательное «колдовство» звучит по-русски естественнее буквального множественного числа, а более широкий диапазон слова отмечен в сноске.
- source_word: πορνείας
  choice: сексуальной распущенности
  rationale: Так передаётся широкий смысл половой безнравственности без архаичности слова «блуд» и без чрезмерного сужения до одного конкретного проступка.
- source_word: κλεμμάτων
  choice: кражах
  rationale: В перечне пороков слово естественно означает совершаемые кражи; русское множественное число сохраняет форму и смысл оригинала.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: ни ... ни ... ни
  rationale: После отрицания «не раскаялись» повторяющийся союз естественно и точно передаётся русской конструкцией «ни … ни … ни».
theological_decisions:
- issue: Смысловой объём φαρμάκων в апокалиптическом перечне грехов
  choice: колдовстве
  alternative: магических действиях; зельях; отравлениях
  rationale: В Откровении родственные слова обычно связаны с магией и обманом, поэтому в основном тексте выбрано «колдовство». Однако греческое слово исторически могло относиться также к зельям и ядам, что сохранено в сноске без искусственного устранения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с ясной, торжественной синтаксической структурой. Повтор «своих» частично сохранён, чтобы передать четырёхкратное αὐτῶν, а повтор предлога и союза поддерживает ритм исходного перечня.
