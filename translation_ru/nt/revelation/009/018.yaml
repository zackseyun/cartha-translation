id: REV.9.18
reference: Revelation 9:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀπὸ τῶν τριῶν πληγῶν τούτων ἀπεκτάνθησαν τὸ τρίτον τῶν ἀνθρώπων, ⸀ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/018.yaml
  text: By these three plagues a third of mankind was killed—by the fire and the smoke and the sulfur coming out of their mouths[a][b].
translation:
  language: ru
  text: От этих трёх язв была убита треть людей — от огня, дыма и серы, выходившей из их ртов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τῶν τριῶν πληγῶν τούτων
  choice: от этих трёх язв
  rationale: Предлог ἀπό здесь указывает на причину гибели; русское «от» естественно передаёт причинное значение. Указательное τούτων сохранено словом «этих».
- source_word: ἀπεκτάνθησαν
  choice: погибла
  rationale: Форма передаёт насильственную смерть в пассивной конструкции. Сочетание «погибла треть людей» по-русски звучит естественно и не вводит явно названного деятеля, которого в греческом тексте нет.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: треть людей
  rationale: Передано партитивное значение «одна треть». ἄνθρωποι обозначает людей вообще, а не только мужчин; «людей» точно и современно выражает этот смысл.
- source_word: ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου
  choice: от огня, дыма и серы
  rationale: ἐκ обозначает источник или средство смерти. «Сера» — современное и точное соответствие θεῖον; перечисление сохранено без архаизации.
- source_word: τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν
  choice: выходивших из их ртов
  rationale: Причастный оборот передаёт продолжающееся исхождение. Множественное число естественно связывает оборот со всем рядом «огня, дыма и серы», как подсказывает ближайший контекст видения.
theological_decisions:
- issue: Объём значения ἀνθρώπων в сцене суда
  choice: людей
  alternative: человечества
  rationale: Греческое слово относится ко всем людям без указания на пол. «Людей» сохраняет широкий смысл и при этом не превращает образную долю погибших в более абстрактное выражение.
- issue: К чему относится причастие ἐκπορευομένου
  choice: 'ко всем трём явлениям: огню, дыму и сере'
  alternative: только к сере
  rationale: Греческое причастие формально стоит в единственном числе и согласуется с ближайшим θεῖον, однако весь координированный ряд имеет повторяющиеся артикли, а Откр. 9:17 описывает огонь, дым и серу как исходящие из пастей. Русское множественное число сохраняет наиболее вероятную связь со всем рядом, не добавляя нового богословского толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной апокалиптической интонацией. «Язвы» сохранены как привычное библейское обозначение губительных кар, тогда как остальная лексика не архаизирована.
