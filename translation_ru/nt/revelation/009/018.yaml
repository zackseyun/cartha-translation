review_pass:
  verdict: revise
  source_fidelity: Причастие τοῦ ἐκπορευομένου стоит в ед. числе, ср. роде, род. падеже и непосредственно согласуется с τοῦ θείου («серы»), а не со всем рядом «огонь, дым и сера». Поэтому русский оборот во множественном числе («выходивших») расширяет синтаксическую связь оригинала. Пассивное ἀπεκτάνθησαν точнее передать как «была убита», а не более общее «погибла».
  naturalness: «От этих трёх язв была убита треть людей — от огня, дыма и серы, выходившей из их ртов» звучит как современный литературный русский и сохраняет торжественную интонацию. Повтор «от» соответствует двум греческим предлогам и ясно связывает три явления со смертью.
  terminology: «Язвы» уместно для πληγαί в Откровении; «людей» точно передаёт ἀνθρώπων как людей вообще; «сера» — современное соответствие θείον. Архаичное «сера/жупел» не требуется.
  issues:
  - severity: medium
    issue: 'Причастие переведено во множественном числе: «выходивших из их ртов».'
    rationale: В SBLGNT τοῦ ἐκπορευομένου формально согласуется с ближайшим существительным τοῦ θείου, «серы», и стоит в единственном числе. Контекст предыдущего стиха описывает также огонь и дым как исходящие из пастей, но данный стих синтаксически уточняет именно серу; перевод не должен без отметки заменять эту связь множественным числом.
  - severity: low
    issue: «Погибла» ослабляет выраженную в греческом пассивную семантику убийства.
    rationale: ἀπεκτάνθησαν означает «были убиты». «Была убита треть людей» сохраняет пассив и не добавляет деятеля.
  revised_text: От этих трёх язв была убита треть людей — от огня, дыма и серы, выходившей из их ртов.
  revised_footnotes: []
