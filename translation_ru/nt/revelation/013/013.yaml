id: REV.13.13
reference: Revelation 13:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ποιεῖ σημεῖα μεγάλα, ⸂ἵνα καὶ πῦρ ποιῇ⸃ ἐκ τοῦ οὐρανοῦ ⸂καταβαίνειν εἰς⸃ τὴν γῆν ἐνώπιον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/013.yaml
  text: And it performs great signs[b][a], even causing fire to come down from heaven to the earth before people.
translation:
  language: ru
  text: И творит великие знамения[a], так что даже низводит огонь с неба на землю на глазах у людей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великие чудеса»; буквально: «знамения».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «перед людьми».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: творит
  rationale: В сочетании со «знамениями» глагол «творит» естественен для возвышенного библейского повествования и передаёт совершение необычайных деяний.
- source_word: σημεῖα μεγάλα
  choice: великие знамения
  rationale: «Знамения» сохраняет смысл явлений, несущих знаковое значение, не определяя заранее, являются ли они подлинными чудесами или обманом; μεγάλα передано как «великие».
- source_word: ἵνα καὶ πῦρ ποιῇ
  choice: так что даже низводит огонь
  rationale: Оборот «так что» естественно выражает здесь результат проявления силы; «даже» сохраняет усилительное καί, а «низводит» вместе с последующим направлением ясно передаёт действие с огнём.
- source_word: πῦρ
  choice: огонь
  rationale: Прямой перевод сохраняет апокалиптический образ и возможные пророческие отзвуки.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с неба
  rationale: «Небо» сохраняет апокалиптический регистр и не сужает значение до атмосферного явления.
- source_word: καταβαίνειν εἰς τὴν γῆν
  choice: низводит ... на землю
  rationale: Русский глагол «низводит» естественно передаёт каузативную конструкцию ποιῇ ... καταβαίνειν — заставляет огонь сойти вниз; «на землю» сохраняет указанное направление.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: на глазах у людей
  rationale: Передаёт публичность и наблюдаемость происходящего; ἀνθρώπων относится к людям вообще, без указания только на мужчин.
theological_decisions:
- issue: Природа знамений
  choice: Описать наблюдаемое совершение великих знамений, не уточняя их сверхъестественный механизм или иллюзорность.
  alternative: Перевести как «великие чудеса» либо прямо назвать происходящее обманом.
  rationale: В данном стихе говорится о знамениях и о видимом низведении огня, но не объясняется природа явления; перевод сохраняет эту богословскую напряжённость.
- issue: Значение ἵνα
  choice: 'Передать как результат: «так что».'
  alternative: 'Передать как цель: «чтобы».'
  rationale: В контексте перечисления действий зверя результативное прочтение естественно, однако греческая конструкция допускает оттенок цели; это не меняет основного утверждения о низведении огня.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. «Творит знамения» и «низводит огонь» сохраняют библейский регистр, оставаясь понятными современному читателю.
