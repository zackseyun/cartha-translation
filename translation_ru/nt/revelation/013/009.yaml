  text: Εἴ τις ἔχει οὖς ἀκουσάτω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/009.yaml
  text: If anyone has an ear[a], let him hear.
translation:
  language: ru
  text: У кого есть ухо, пусть услышит.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴ τις
  choice: У кого
  rationale: Греческое условное сочетание буквально означает «если кто», но в русском языке формула «у кого есть…» естественно и точно передаёт открытое условное обращение.
- source_word: ἔχει
  choice: есть
  rationale: Обычное обозначение обладания; в русской конструкции «у кого есть» звучит естественнее буквального «кто имеет».
- source_word: οὖς
  choice: ухо
  rationale: Сохранено единственное число греческого текста и устойчивый библейский образ способности услышать и принять сказанное.
- source_word: ἀκουσάτω
  choice: пусть услышит
  rationale: Форма третьего лица единственного числа передаёт повелительный призыв. «Услышит» сохраняет библейскую формулу и её смысл внимательного, действенного восприятия, не сводя его лишь к пониманию или слушанию.
theological_decisions:
- issue: Родовая отнесённость призыва
  choice: пусть услышит
  alternative: пусть слушает
  rationale: Русская форма третьего лица единственного числа не требует выраженного местоимения и потому естественно относится к любому человеку, сохраняя число и повелительную силу греческого текста без искусственного указания пола.
- issue: Смысл формулы о слышании
  choice: сохранить глагол «услышать» без поясняющего расширения
  alternative: пусть поймёт / пусть внимает
  rationale: Греческий текст использует краткий пророческий призыв к восприимчивому вниманию. «Услышит» сохраняет его литературный и богословский диапазон, не ограничивая смысл одним лишь пониманием.
translation_notes:
  register: Краткая, торжественная и легко понятная формула на современном литературном русском языке. Синтаксис естественен, при этом сохранены единственное число и библейский образ уха и слышания.
