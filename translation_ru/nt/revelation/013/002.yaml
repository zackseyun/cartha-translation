reference: Revelation 13:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ εἶδον ἦν ὅμοιον παρδάλει, καὶ οἱ πόδες αὐτοῦ ὡς ἄρκου, καὶ τὸ στόμα αὐτοῦ ὡς στόμα λέοντος. καὶ ἔδωκεν αὐτῷ ὁ δράκων τὴν δύναμιν αὐτοῦ καὶ τὸν θρόνον αὐτοῦ καὶ ἐξουσίαν μεγάλην.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/002.yaml
  text: And the beast that I saw was like a leopard[a], and its feet were like a bear's, and its mouth was like a lion's mouth. And the dragon gave it his power and his throne and great authority.
translation:
  language: ru
  text: И зверь, которого я увидел, был подобен леопарду[a]; ноги у него были как у медведя, а пасть — как пасть льва. И дракон дал ему свою силу, свой престол и великую власть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Образы леопарда, медведя и льва перекликаются с видениями зверей в Дан. 7.
    reason: cross_reference
lexical_decisions:
- source_word: θηρίον
  choice: зверь
  rationale: В Откровении это устойчивое апокалиптическое обозначение чудовищного противника; «зверь» сохраняет как прямой смысл, так и символическую силу слова.
- source_word: ὅμοιον παρδάλει
  choice: подобен барсу
  rationale: Конструкция выражает сходство. «Подобен барсу» естественнее для возвышенного современного русского, чем буквальное «как барс» после связки; παρδάλις обозначает крупную пятнистую кошку, традиционно передаваемую здесь как «барс».
- source_word: πόδες ... ὡς ἄρκου
  choice: ноги ... как у медведя
  rationale: πούς буквально означает «нога, ступня»; русский оборот «ноги как у медведя» естественно передаёт эллиптическое греческое сравнение, не конкретизируя его как «лапы».
- source_word: στόμα ... ὡς στόμα λέοντος
  choice: пасть ... как пасть льва
  rationale: Повтор существительного сохранён вслед за греческим текстом. В описании зверей «пасть» звучит естественнее нейтрального «рот» и поддерживает выразительность образа.
- source_word: δράκων
  choice: дракон
  rationale: Прямое и общепринятое обозначение апокалиптического персонажа в Откровении.
- source_word: ἔδωκεν
  choice: отдал
  rationale: δίδωμι означает «дать». В сочетании с принадлежащими дракону силой и престолом «отдал ему» естественно передаёт передачу во владение или распоряжение, не добавляя идеи окончательного отказа от них.
- source_word: δύναμιν
  choice: силу
  rationale: Передаёт действенную мощь или способность и сохраняет отличие от ἐξουσία — власти или полномочия.
- source_word: θρόνον
  choice: престол
  rationale: Сохраняет буквальный царский образ и связанные с ним представления о правлении.
- source_word: ἐξουσίαν μεγάλην
  choice: великую власть
  rationale: ἐξουσία обозначает власть, право или полномочие действовать; «великая власть» естественно для русского библейского регистра и остаётся отличимой от «силы».
- source_word: αὐτοῦ
  choice: свою / свой
  rationale: Русское возвратное притяжательное местоимение однозначно относит силу и престол к подлежащему «дракон» и избегает неестественного повторения «его».
theological_decisions:
- issue: Соотношение дракона и зверя в передаче местоимений
  choice: Зверь обозначен местоимением «у него», а принадлежность силы и престола дракону выражена словами «свою» и «свой».
  alternative: Повторить «его силу, его престол», сохранив формальное единообразие αὐτοῦ.
  rationale: Возвратное «свой» в русском ясно указывает на дракона как подлежащее и не усиливает персонализацию сверх того, что выражено повествованием.
- issue: Составной образ животных и связь с Даниилом 7
  choice: Сравнения переданы прямо, без истолкования в основном тексте; связь с Даниилом отмечена только в сноске.
  alternative: Встроить указание на видение Даниила в основной текст.
  rationale: Греческий текст даёт образы без объяснения. Перевод должен сохранить образность и возможную аллюзию, не превращая её в явное авторское толкование.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, но понятным библейским регистром. Синтаксический параллелизм исходного описания сохранён; «а пасть» естественно разграничивает части составного образа. Маркер сноски помещён непосредственно после первого элемента тройного образа, как в консультационном тексте.
