id: REV.13.4
reference: Revelation 13:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ προσεκύνησαν τῷ δράκοντι ⸂ὅτι ἔδωκεν⸃ τὴν ἐξουσίαν τῷ θηρίῳ, καὶ προσεκύνησαν τῷ θηρίῳ λέγοντες· Τίς ὅμοιος τῷ θηρίῳ, καὶ τίς ⸀δύναται πολεμῆσαι μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/004.yaml
  text: And they worshiped the dragon because he had given authority to the beast[a], and they worshiped the beast, saying, “Who is like the beast[c][b], and who is able to make war with it?”
translation:
  language: ru
  text: 'И поклонились дракону, потому что он дал власть зверю, и поклонились зверю, говоря: «Кто подобен зверю?[a] И кто может сразиться с ним?[b]»[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто сравнится со зверем?»'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «И кто способен вести против него войну?»'
    reason: lexical_alternative
  - marker: c
    text: Этот возглас, вероятно, перекликается с ветхозаветными словами о несравнимости Бога (например, Исх. 15:11; Пс. 34:10), но здесь кощунственно относится к зверю.
    reason: cross_reference
lexical_decisions:
- source_word: προσεκύνησαν
  choice: поклонились
  rationale: В контексте Откровения глагол обозначает религиозное поклонение; «поклонились» естественно передаёт как действие, так и идолопоклоннический смысл.
- source_word: τῷ δράκοντι
  choice: дракону
  rationale: Прямое и традиционное соответствие апокалиптическому образу δράκων без внесения толкования в текст.
- source_word: ὅτι ἔδωκεν
  choice: потому что он дал
  rationale: ὅτι имеет причинное значение, а аорист ἔδωκεν обозначает совершившуюся передачу власти; русский совершенный вид ясно передаёт предшествующее действие без необходимости добавлять «ранее».
- source_word: τὴν ἐξουσίαν
  choice: власть
  rationale: ἐξουσία здесь означает предоставленное право и способность властвовать; «власть» точнее по контексту, чем более широкое «сила».
- source_word: τῷ θηρίῳ
  choice: зверю
  rationale: «Зверь» — точное и закрепившееся русское соответствие θηρίον в образном строе Откровения.
- source_word: λέγοντες
  choice: говоря
  rationale: Деепричастие естественно вводит содержание возгласа и сохраняет синтаксическую связь с поклонением.
- source_word: Τίς ὅμοιος τῷ θηρίῳ
  choice: Кто подобен зверю?
  rationale: Формулировка близка к греческой и сохраняет вероятную отсылку к ветхозаветным возгласам о несравнимости Бога.
- source_word: τίς δύναται πολεμῆσαι μετ’ αὐτοῦ
  choice: кто может сразиться с ним?
  rationale: πολεμῆσαι указывает на вооружённое противостояние; «сразиться» звучит естественно и ёмко, а μετά с родительным в этом контексте выражает враждебное столкновение.
theological_decisions:
- issue: Местоимение при звере
  choice: «с ним»
  alternative: «с ним (со зверем)» либо безличное «против него»
  rationale: Хотя θηρίον в греческом среднего рода, русское «зверь» мужского рода и требует местоимения «ним». Это грамматическое согласование, а не дополнительная персонализация образа.
- issue: Отзвук формулы о несравнимости Бога
  choice: Сохранить «Кто подобен зверю?» без пояснения внутри стиха
  alternative: Явно назвать возглас кощунственным подражанием словам о Боге
  rationale: Исходный текст оставляет аллюзию неразъяснённой; её богословское напряжение лучше сохранить в основном тексте, а вероятную связь пояснить в сноске.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Повтор «поклонились» сохранён как значимый элемент исходного текста. Образные наименования «дракон» и «зверь» переданы прямо, без интерпретирующего раскрытия.
