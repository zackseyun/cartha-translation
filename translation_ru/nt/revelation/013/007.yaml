source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῷ ποιῆσαι πόλεμον μετὰ τῶν ἁγίων καὶ νικῆσαι αὐτούς, καὶ ἐδόθη αὐτῷ ἐξουσία ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/007.yaml
  text: And it was given to him to make war against the saints and to conquer them[c][b][a], and authority was given to him over every tribe and people and language and nation.
translation:
  language: ru
  text: И ему было дано вести войну против святых[a] и победить их[b], и ему была дана власть над каждым племенем, народом, языком и нацией.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «вести войну со святыми»; здесь выражение означает войну против них.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «одолеть их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: ему было дано / ему была дана
  rationale: Сохранена безличная пассивная конструкция оригинала и повтор во второй части стиха; дарующий прямо не назван.
- source_word: ποιῆσαι πόλεμον
  choice: вести войну
  rationale: Естественное современное русское соответствие греческому выражению со значением ведения войны.
- source_word: μετὰ τῶν ἁγίων
  choice: против святых
  rationale: Хотя μετά с родительным обычно означает «с», в сочетании с выражением «вести войну» оно обозначает враждебное противостояние.
- source_word: νικῆσαι αὐτούς
  choice: победить их
  rationale: Сохраняет ключевой для Откровения мотив победы и не сужает смысл до физического уничтожения.
- source_word: ἐξουσία
  choice: власть
  rationale: Передаёт предоставленное право господства или полномочие, а не только физическую силу.
- source_word: ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος
  choice: над каждым племенем, народом, языком и нацией
  rationale: Передана четырёхчастная формула всеобщего охвата; «язык» обозначает языковую общность, а «нация» позволяет отличить ἔθνος от стоящего рядом λαός.
theological_decisions:
- issue: Неназванный источник власти в повторённом ἐδόθη
  choice: Сохранить пассивную форму «ему было дано / ему была дана», не называя того, кто дал.
  alternative: «Ему было позволено», с прямым указанием на разрешение свыше.
  rationale: Оригинал не называет дающего; пассивная форма сохраняет напряжение между Божьим верховенством и временно предоставленной зверю властью, не разрешая его толковательно.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «ему было дано / ему была дана» намеренно сохранён; архаизмы и конфессионально окрашенные уточнения не используются.
