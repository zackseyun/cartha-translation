id: REV.13.14
reference: Revelation 13:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ πλανᾷ ⸀τοὺς κατοικοῦντας ἐπὶ τῆς γῆς διὰ τὰ σημεῖα ἃ ἐδόθη αὐτῷ ποιῆσαι ἐνώπιον τοῦ θηρίου, λέγων τοῖς κατοικοῦσιν ἐπὶ τῆς γῆς ποιῆσαι εἰκόνα τῷ θηρίῳ, ⸂ὃς ἔχει⸃ τὴν πληγὴν ⸂τῆς μαχαίρης καὶ ἔζησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/014.yaml
  text: And it deceives those who dwell on the earth because of the signs that it was given to perform in the presence of the beast[c][b][a], telling those who dwell on the earth to make an image for the beast that had the wound of the sword and yet lived.
translation:
  language: ru
  text: И он обманывает[a] живущих на земле посредством знамений, которые ему было дано совершать перед зверем, и говорит живущим на земле, чтобы они сделали образ для зверя[b] — того, у которого рана от меча и который ожил[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вводит в заблуждение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «образ зверя»; буквально по-гречески — «образ для зверя».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «остался жив».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλανᾷ
  choice: обманывает
  rationale: Передаёт настоящее время и каузативный смысл введения в заблуждение; вариант «вводит в заблуждение» отмечен в сноске.
- source_word: κατοικοῦντας / κατοικοῦσιν ἐπὶ τῆς γῆς
  choice: живущих на земле
  rationale: Сохраняет глагольную форму и повторяющееся в Откровении тематическое выражение, оставаясь естественным по-русски.
- source_word: διὰ τὰ σημεῖα
  choice: посредством знамений
  rationale: Передаёт инструментальное значение διά с винительным; причинный оттенок также остаётся понятен из контекста.
- source_word: σημεῖα
  choice: знамения
  rationale: Традиционное и достаточно широкое библейское соответствие, не добавляющее отсутствующего в самом слове определения «чудесные».
- source_word: ἐδόθη αὐτῷ ποιῆσαι
  choice: ему было дано совершать
  rationale: Сохраняет пассивную конструкцию и не называет прямо того, кто дал такую возможность.
- source_word: ἐνώπιον τοῦ θηρίου
  choice: перед зверем
  rationale: Кратко и естественно передаёт пространственно-реляционное значение ἐνώπιον.
- source_word: λέγων
  choice: говоря
  rationale: Формально сохраняет причастную связь с подлежащим и не усиливает значение до «приказывая».
- source_word: ποιῆσαι εἰκόνα τῷ θηρίῳ
  choice: сделали образ зверю
  rationale: Русский дательный сохраняет греческий дательный τῷ θηρίῳ и допускает значение образа, предназначенного зверю, не превращая его безоговорочно в родительный «образ зверя».
- source_word: εἰκόνα
  choice: образ
  rationale: Сохраняет широкий смысл изображения или культового подобия и не сужает его до статуи.
- source_word: ὃς ἔχει τὴν πληγὴν τῆς μαχαίρης
  choice: у которого рана от меча
  rationale: Передаёт настоящее ἔχει и ясно относит мужское ὃς к зверю, а не к образу.
- source_word: μάχαιρα
  choice: меч
  rationale: Обычное и контекстуально уместное соответствие без чрезмерного уточнения разновидности оружия.
- source_word: καὶ ἔζησεν
  choice: и который ожил
  rationale: Передаёт аорист как наступившее событие жизни после раны, не добавляя невыраженного противительного союза; менее сильное прочтение «остался жив» дано в сноске.
theological_decisions:
- issue: Кем была дана возможность совершать знамения
  choice: Сохранить безлично-пассивное «ему было дано», не называя дающего.
  alternative: «Бог дал ему возможность» или «ему позволили».
  rationale: Греческий текст оставляет деятеля невыраженным; явное называние Бога разрешило бы апокалиптическую богословскую напряжённость за текст.
- issue: Значение ἔζησεν после раны зверя
  choice: «ожил» в основном тексте с вариантом «остался жив» в сноске.
  alternative: «остался жив».
  rationale: «Ожил» непосредственно передаёт событийный аорист ζάω, тогда как контекст допускает также понимание выживания; сноска сохраняет эту реальную неоднозначность без догматизации.
- issue: Отношение образа к зверю
  choice: 'Сохранить дательный: «образ зверю».'
  alternative: «образ зверя».
  rationale: Так не предрешается, обозначает ли дательный прежде всего посвящение образа зверю или его изображение; естественная смысловая альтернатива указана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Повтор «живущих на земле» намеренно сохранён как тематическая формула Откровения. Необычный дательный «образ зверю» оставлен ради значимой грамматической неоднозначности оригинала и пояснён сноской.
