revisions:
- from: И он обманывает[a] живущих на земле посредством знамений, которые ему было дано совершать перед зверем, говоря живущим на земле, чтобы они сделали образ зверю[b] — тому, у которого рана от меча и который ожил[c].
  to: И он обманывает[a] живущих на земле посредством знамений, которые ему было дано совершать перед зверем, и говорит живущим на земле, чтобы они сделали образ для зверя[b] — того, у которого рана от меча и который ожил[c].
  rationale: Исправлены только естественность русской синтаксической связи и передача датива при εἰκόνα τῷ θηρίῳ. «Для зверя» отражает избранное в английском аудите значение греческого датива, не подменяя его родительным; возможное «образ зверя» сохранено в сноске. Остальные существенные неоднозначности, в том числе пассив ἐδόθη и значение ἔζησεν, сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:35:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом передача точна: сохранены настоящее время πλανᾷ и ἔχει, пассивное «ему было дано», повтор тематической формулы «живущие на земле», а также невыраженный субъект божественного пассива. «Ожил» допустимо передаёт аорист ἔζησεν как событие после раны; сноска уместно отмечает вариант понимания как выживания.'
  naturalness: «Говоря живущим на земле, чтобы они сделали» грамматически возможно, но тяжеловесно. Кроме того, «образ зверю» в современном литературном русском звучит неестественно и может быть понято как подарок зверю, а не как образ, связанный со зверем. «Образ для зверя» сохраняет значение греческого датива, отмеченное в английском аудите, и читается естественнее.
  terminology: «Зверь», «знамения», «образ», «меч» и «живущие на земле» соответствуют регистру Откровения. «Обманывает» — приемлемая нейтральная передача πλανᾷ; «вводит в заблуждение» остаётся полезной альтернативой.
  issues:
  - severity: medium
    issue: Неестественное сочетание «образ зверю».
    rationale: Хотя оно формально копирует датив τῷ θηρίῳ, в современном русском эта конструкция не передаёт ясно значения «образ для зверя» и способна создать ложное впечатление, что образ просто вручают зверю. Нужна более естественная конструкция с «для», при сохранении сноски об альтернативном «образ зверя».
  - severity: low
    issue: Тяжеловесная синтаксическая связка «говоря ... чтобы они сделали».
    rationale: Замена деепричастного оборота на координированное «и говорит ... чтобы» естественнее по-русски и не меняет функции λέγων.
