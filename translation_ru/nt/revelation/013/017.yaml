translation:
  language: ru
  text: чтобы никто не мог ни покупать, ни продавать, кроме тех, у кого есть начертание[a], имя зверя или число его имени.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «начертание, то есть имя зверя или число его имени». Греческая конструкция допускает понимание имени и числа как пояснения к начертанию.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἵνα μή τις δύνηται
  choice: чтобы никто не мог
  rationale: ἵνα передаёт цель или результат, μή τις — отрицательное неопределённое лицо («никто»), а δύνηται — возможность или способность. Эта формулировка естественна по-русски и сохраняет силу греческой конструкции.
- source_word: ἀγοράσαι ἢ πωλῆσαι
  choice: ни покупать, ни продавать
  rationale: Парные инфинитивы обозначают обычную торговую деятельность; при отрицании русская конструкция «ни… ни…» точно и естественно передаёт сочетание с ἤ.
- source_word: εἰ μὴ ὁ ἔχων
  choice: кроме того, у кого есть
  rationale: εἰ μή вводит единственное исключение, а субстантивированное причастие ὁ ἔχων означает «тот, кто имеет». Оборот «у кого есть» звучит естественно и сохраняет обобщённый характер выражения.
- source_word: τὸ χάραγμα
  choice: начертание
  rationale: χάραγμα обозначает нанесённый или отпечатанный знак. «Начертание» — понятный и укоренившийся в русском библейском языке эквивалент, уместный в апокалиптическом контексте.
- source_word: τὸ ὄνομα τοῦ θηρίου
  choice: имя зверя
  rationale: Прямая передача генитивной конструкции; «зверь» точно сохраняет символический титул θηρίον в Откровении.
- source_word: ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ
  choice: или число его имени
  rationale: Формулировка близко следует греческому тексту. Русское «его» естественно относится к зверю и не требует искусственного различения между личным и неличным местоимением.
theological_decisions:
- issue: Соотношение начертания, имени зверя и числа его имени
  choice: сохранить перечисление через запятую без поясняющей связки
  alternative: «начертание, то есть имя зверя или число его имени»
  rationale: Греческий синтаксис допускает аппозиционное понимание, при котором имя или число поясняют начертание, но не выражает это однозначно. Запятая сохраняет напряжение и не навязывает толкование; возможное пояснительное прочтение вынесено в сноску.
- issue: Обобщённое значение ὁ ἔχων
  choice: «того, у кого есть»
  alternative: «того, кто имеет»
  rationale: Форма мужского рода единственного числа в греческом употреблена обобщённо. Русская конструкция передаёт это значение естественно, не ограничивая речь мужчинами.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской лексикой. «Начертание» сохранено как точный и узнаваемый термин; остальная фраза построена просто и естественно. Союзное начало «чтобы» отражает зависимость стиха от предыдущего контекста.
