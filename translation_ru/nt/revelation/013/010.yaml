id: REV.13.10
reference: Revelation 13:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἴ τις ⸂εἰς αἰχμαλωσίαν, εἰς αἰχμαλωσίαν⸃ ὑπάγει· εἴ τις ἐν μαχαίρῃ ⸀ἀποκτανθῆναι αὐτὸν ἐν μαχαίρῃ ἀποκτανθῆναι. ὧδέ ἐστιν ἡ ὑπομονὴ καὶ ἡ πίστις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/010.yaml
  text: If anyone is for captivity[a], into captivity he goes; if anyone is to be killed with the sword, with the sword he must be killed[c][b]. Here is the endurance and the faith of the saints.
translation:
  language: ru
  text: Если кому идти в плен — тот идёт в плен[a]; если кому быть убитым мечом — тот должен быть убит мечом[b]. Здесь — стойкость и вера[c] святых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Дословно: «Если кто — в плен, в плен идёт». Эти слова можно понимать как указание на назначенную участь, а не как повеление.'
    reason: alternative_reading
  - marker: b
    text: 'В некоторых рукописях эта часть читается иначе, в том числе: «Кто убивает мечом, тот должен быть убит мечом». Здесь переведён принятый текст, однако разночтение существенно для понимания стиха.'
    reason: textual_variant
  - marker: c
    text: 'Или: «верность святых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: кому
  rationale: В составе краткого условно-обобщающего изречения русское «кому… тот…» естественно передаёт неопределённый и общий смысл.
- source_word: εἰς αἰχμαλωσίαν ... ὑπάγει
  choice: суждено быть взятым в плен — тот пойдёт в плен
  rationale: Так сохраняются смысл предопределённой участи, движение в плен и подчёркнутый повтор, хотя греческая формула остаётся предельно сжатой.
- source_word: αἰχμαλωσία
  choice: плен
  rationale: «Плен» прямо обозначает участь пленника и сохраняет библейский оттенок суда; «заключение» было бы уже по смыслу.
- source_word: ἐν μαχαίρῃ
  choice: мечом
  rationale: Творительный падеж естественно передаёт орудийное значение греческого оборота и сохраняет образ меча.
- source_word: ἀποκτανθῆναι
  choice: быть убитым
  rationale: Передаёт пассивный инфинитив ясно и без излишне архаичного «быть умерщвлённым».
- source_word: αὐτὸν
  choice: тот должен быть убит
  rationale: Русская корреляция «кому… тот…» устраняет синтаксическую шероховатость буквального воспроизведения местоимения, сохраняя его отнесённость к тому же человеку.
- source_word: ὧδέ ἐστιν
  choice: здесь нужны
  rationale: В данном контексте оборот указывает, что описанная ситуация требует названных качеств; такая формулировка естественна по-русски и не превращает фразу в отвлечённое определение.
- source_word: ὑπομονή
  choice: стойкость
  rationale: «Стойкость» передаёт упорное терпение и постоянство под давлением, оставаясь естественным современным словом.
- source_word: πίστις
  choice: вера
  rationale: Основное и богословски не сужающее значение; возможный контекстуальный оттенок верности вынесен в примечание.
- source_word: τῶν ἁγίων
  choice: святых
  rationale: Краткое традиционное обозначение принадлежащего Богу народа, понятное в современном русском библейском регистре.
theological_decisions:
- issue: 'Смысл первых двух частей: предустановленная участь или предписание'
  choice: описание неизбежной, назначенной участи
  alternative: повеление не сопротивляться; либо принцип воздаяния пленителям и убийцам
  rationale: Принятый греческий текст наиболее естественно допускает торжественное описание назначенной участи. Перевод не выводит из строки самостоятельно ни этику непротивления, ни закон ответного возмездия.
- issue: Значение πίστις в заключительной части
  choice: вера
  alternative: верность
  rationale: «Вера» сохраняет широкий смысл термина; в условиях гонения слово может также подчеркивать верность, поэтому этот оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического изречения. Повтор «плен… плен» и «убитым мечом… убит мечом» намеренно сохранён. Формула «суждено» делает понятной эллиптическую греческую конструкцию, не снимая отмеченной в сноске неоднозначности.
