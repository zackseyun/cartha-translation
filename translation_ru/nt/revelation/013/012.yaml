id: REV.13.12
reference: Revelation 13:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τὴν ἐξουσίαν τοῦ πρώτου θηρίου πᾶσαν ποιεῖ ἐνώπιον αὐτοῦ. καὶ ⸀ποιεῖ τὴν γῆν καὶ τοὺς ἐν αὐτῇ κατοικοῦντας ἵνα ⸀προσκυνήσουσιν τὸ θηρίον τὸ πρῶτον, οὗ ἐθεραπεύθη ἡ πληγὴ τοῦ θανάτου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/012.yaml
  text: And it exercises all the authority of the first beast in its presence[a]. And it causes the earth and those who dwell on it to worship the first beast[b], whose mortal wound was healed.
translation:
  language: ru
  text: И осуществляет всю власть первого зверя в его присутствии[a] и побуждает землю и живущих на ней поклониться первому зверю, у которого исцелилась смертельная рана[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед ним». Эти слова могут подчёркивать, что второй зверь действует на виду у первого зверя или непосредственно перед ним.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рана его смерти»; то есть рана, несущая смерть, смертельная рана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: властью
  rationale: «Власть» передаёт право и возможность действовать, а не только физическую силу.
- source_word: ποιεῖ τὴν ἐξουσίαν
  choice: действует всей властью
  rationale: Так естественно по-русски передаётся идиома об осуществлении или применении власти.
- source_word: ἐνώπιον αὐτοῦ
  choice: в его присутствии
  rationale: 'Фраза сохраняет пространственно-реляционный смысл: второй зверь действует перед первым, у него на виду.'
- source_word: ποιεῖ ... ἵνα προσκυνήσουσιν
  choice: заставляет ... поклониться
  rationale: Каузативная конструкция означает, что зверь добивается поклонения; «заставляет» естественно передаёт это воздействие, не уточняя его конкретный способ.
- source_word: τὴν γῆν
  choice: землю
  rationale: В контексте Откровения слово имеет широкий, мировой смысл, а не узко территориальный.
- source_word: τοὺς ἐν αὐτῇ κατοικοῦντας
  choice: живущих на ней
  rationale: Сохраняется характерный для Откровения словесный образ жителей земли в естественной современной русской форме.
- source_word: προσκυνήσουσιν
  choice: поклониться
  rationale: В данном апокалиптическом контексте речь идёт о почитании зверя, выраженном поклонением.
- source_word: θηρίον
  choice: зверь
  rationale: Прямое и традиционное соответствие греческому θηρίον в апокалиптическом контексте.
- source_word: ἐθεραπεύθη
  choice: исцелилась
  rationale: Пассивный смысл греческой формы естественно выражается русской возвратной конструкцией, сохраняющей мотив исцеления.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: смертельная рана
  rationale: Идиоматично передаёт буквальное «рана смерти», то есть рана, несущая смерть.
theological_decisions:
- issue: Характер воздействия второго зверя на жителей земли
  choice: заставляет ... поклониться
  alternative: побуждает ... поклониться; делает так, чтобы ... поклонились
  rationale: Греческая каузативная конструкция указывает, что второй зверь вызывает или обеспечивает поклонение первому, но сама по себе не определяет конкретный способ принуждения. Русское «заставляет» передаёт сильную каузацию без дополнительного догматического уточнения.
- issue: Значение ἐνώπιον αὐτοῦ
  choice: в его присутствии
  alternative: перед ним
  rationale: Выбранный вариант сохраняет возможность понимать действие как совершаемое непосредственно перед первым зверем или у него на виду, не уточняя характер зависимости сверх текста.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного апокалиптического тона. Местоимение «его» соотнесено с первым зверем; неоднозначность выражения «в его присутствии» пояснена в сноске. Синтаксис сделан плавным, но последовательность двух действий сохранена.
