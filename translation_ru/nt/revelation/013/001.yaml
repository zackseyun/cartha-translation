source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐκ τῆς θαλάσσης θηρίον ἀναβαῖνον, ἔχον κέρατα δέκα καὶ κεφαλὰς ἑπτά, καὶ ἐπὶ τῶν κεράτων αὐτοῦ δέκα διαδήματα, καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ⸀ὀνόματα βλασφημίας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/001.yaml
  text: And I saw a beast coming up out of the sea[a], having ten horns and seven heads, and on its horns ten crowns[b], and on its heads names of blasphemy.
translation:
  language: ru
  text: И увидел я зверя, поднимающегося из моря. У него было десять рогов и семь голов; на его рогах — десять диадем, и на его головах — богохульные имена[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «имена богохульства».'
    reason: Лексико-синтаксическая альтернатива для ὀνόματα βλασφημίας.
lexical_decisions:
- source_word: εἶδον
  choice: увидел я
  rationale: Простой аорист ὁράω передан повествовательной формой прошедшего времени без добавления слов «в видении»; постпозиция местоимения сохраняет торжественный ритм, не делая фразу архаичной.
- source_word: ἐκ τῆς θαλάσσης
  choice: из моря
  rationale: Предлог ἐκ обозначает движение изнутри наружу; русское «из моря» естественно передаёт источник и направление появления.
- source_word: θηρίον
  choice: зверя
  rationale: «Зверь» — прямое и традиционно понятное обозначение апокалиптического существа; образ не истолковывается как конкретная власть или личность.
- source_word: ἀναβαῖνον
  choice: поднимающегося
  rationale: Причастие настоящего времени изображает происходящее перед глазами движение вверх; «поднимающегося» сохраняет этот аспект лучше, чем более общее «выходящего».
- source_word: ἔχον
  choice: у него было
  rationale: Греческое причастие перестроено в естественную русскую предикативную конструкцию, сохраняющую все признаки зверя без тяжеловесного «имеющего».
- source_word: κέρατα δέκα καὶ κεφαλὰς ἑπτά
  choice: десять рогов и семь голов
  rationale: Образы переданы буквально, без символического истолкования.
- source_word: διαδήματα
  choice: диадем
  rationale: διάδημα означает именно царскую повязку или диадему. Современное русское «диадема» понятно и точнее общего слова «венец» или «корона».
- source_word: ὀνόματα βλασφημίας
  choice: имена богохульства
  rationale: Сохранена генитивная конструкция оригинала, допускающая оттенок принадлежности или характеристики; более гладкий атрибутивный вариант приведён в примечании.
theological_decisions:
- issue: Символические образы апокалиптического видения
  choice: Сохранить буквально «зверь», «рога», «головы» и «диадемы».
  alternative: В основном тексте отождествить зверя с царём, царством, империей или сатанинской силой.
  rationale: Сам стих даёт образы, но не раскрывает здесь всех их соответствий; перевод не должен заранее закреплять одну эсхатологическую схему.
- issue: Значение сочетания ὀνόματα βλασφημίας
  choice: «имена богохульства»
  alternative: «богохульные имена»
  rationale: Родительный падеж в греческом допускает более формальное «имена богохульства» и атрибутивное понимание «богохульные имена». Основной текст сохраняет структуру и смысловую напряжённость оригинала, а примечание указывает естественную альтернативу.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным ритмом. Длинная греческая конструкция разделена на два предложения ради ясности; точка с запятой и параллельные обороты сохраняют нарастающее описание видения. «Диадема» выбрана в основном тексте как точный и доступный термин.
