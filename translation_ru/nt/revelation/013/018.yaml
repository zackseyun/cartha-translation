source:
  edition: SBLGNT
  text: ὧδε ἡ σοφία ἐστίν· ὁ ἔχων νοῦν ψηφισάτω τὸν ἀριθμὸν τοῦ θηρίου, ἀριθμὸς γὰρ ἀνθρώπου ἐστίν· καὶ ὁ ἀριθμὸς ⸀αὐτοῦ ⸂ἑξακόσιοι ἑξήκοντα ἕξ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/018.yaml
  text: 'Here is wisdom: let the one who has understanding calculate the number of the beast[a], for it is the number of a man[b], and its number is six hundred sixty-six.'
translation:
  language: ru
  text: 'Здесь нужна мудрость: кто обладает разумом, пусть вычислит число зверя, потому что это число человека[a], и его число — шестьсот шестьдесят шесть[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это человеческое число».'
    reason: alternative_reading
  - marker: b
    text: 'В некоторых рукописях: 616 вместо 666.'
    reason: textual_variant
lexical_decisions:
- source_word: ὧδε ἡ σοφία ἐστίν
  choice: Здесь нужна мудрость
  rationale: 'Передаёт указательное ὧδε и смысл краткой греческой конструкции естественным современным русским языком: в данном случае требуется мудрое распознавание.'
- source_word: ὁ ἔχων νοῦν
  choice: кто обладает разумом
  rationale: Сохраняет обобщённое значение субстантивированного причастного оборота; νοῦς здесь означает способность понимать и распознавать.
- source_word: ψηφισάτω
  choice: пусть вычислит
  rationale: Передаёт повелительную форму и значение подсчёта или вычисления числа, а не простого перечисления.
- source_word: τὸν ἀριθμὸν τοῦ θηρίου
  choice: число зверя
  rationale: Прямой и устойчивый перевод выражения в апокалиптическом контексте Откровения.
- source_word: ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: потому что это число человека
  rationale: 'Русская форма без артикля естественно сохраняет неоднозначность греческого родительного: речь может идти о числе определённого человека, числе, принадлежащем человеку, или человеческом числе.'
- source_word: καὶ ὁ ἀριθμὸς αὐτοῦ
  choice: и число его
  rationale: Местоимение отнесено к зверю; в русском языке согласование по мужскому роду естественно и не требует искусственного безличного оборота.
- source_word: ἑξακόσιοι ἑξήκοντα ἕξ
  choice: шестьсот шестьдесят шесть
  rationale: Прямая передача числительного основного греческого текста словами.
theological_decisions:
- issue: Значение ἀνθρώπου в выражении ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: «это число человека»
  alternative: «это человеческое число»
  rationale: Греческий родительный допускает как отнесение к человеку, возможно конкретному, так и качественное понимание — «человеческое». Основной текст не уточняет того, чего не уточняет оригинал, а примечание сохраняет существенную альтернативу.
- issue: Числовой текст в конце стиха
  choice: 666 в основном тексте
  alternative: 616 в части рукописей
  rationale: Чтение 666 имеет основную текстовую поддержку SBLGNT; значимый древний вариант 616 указан в примечании без попытки богословски разрешить разночтение.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. Конструкция «кто обладает разумом, пусть…» понятна широкому читателю и сохраняет увещевательный тон. Число дано словами в соответствии с формой исходного текста.
