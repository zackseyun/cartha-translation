id: REV.13.15
reference: Revelation 13:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτῷ ⸂δοῦναι πνεῦμα⸃ τῇ εἰκόνι τοῦ θηρίου, ἵνα καὶ λαλήσῃ ἡ εἰκὼν τοῦ θηρίου καὶ ποιήσῃ ⸀ἵνα ὅσοι ἐὰν μὴ προσκυνήσωσιν τῇ εἰκόνι τοῦ θηρίου ἀποκτανθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/015.yaml
  text: And it was given to him to give breath to the image of the beast[b][a], so that the image of the beast might even speak and cause those who would not worship the image of the beast to be killed.
translation:
  language: ru
  text: И дано было ему дать дыхание[a] образу зверя, чтобы образ зверя даже заговорил и сделал так, чтобы все, кто не поклонится образу зверя, были убиты.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дать дух»; или: «дать жизнь образу зверя».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и добился того, чтобы все, кто не поклонится образу зверя, были убиты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: дано было ему
  rationale: Сохранены безличная пассивная конструкция и не названный в греческом тексте источник дозволения или способности; местоимение явно обозначает получателя.
- source_word: δοῦναι πνεῦμα
  choice: вложить дыхание
  rationale: πνεῦμα может означать «дух», «дыхание» или жизненное начало. В контексте ожившего и заговорившего образа «дыхание» передаёт конкретный образ, не утверждая однозначно ни личного духа, ни подлинной жизни.
- source_word: εἰκών
  choice: образ
  rationale: Широкое и традиционно понятное соответствие, которое не сужает значение до статуи или иного определённого вида изображения.
- source_word: θηρίον
  choice: зверь
  rationale: Устоявшееся и точное обозначение апокалиптического существа без усилительного толкования вроде «чудовище».
- source_word: ἵνα καὶ λαλήσῃ
  choice: чтобы ... даже заговорил
  rationale: Передаёт целевое или результативное значение ἵνα с сослагательным наклонением; «даже» выражает поразительный факт речи оживлённого образа.
- source_word: ποιήσῃ ἵνα
  choice: добился того, чтобы
  rationale: Естественно по-русски передаёт каузативную силу конструкции ποιέω с ἵνα, не уточняя, каким именно способом образ приводит к казни.
- source_word: ὅσοι ἐὰν μὴ προσκυνήσωσιν
  choice: все, кто не поклонится
  rationale: Естественная передача неопределённо-относительной конструкции, охватывающей каждого отказавшегося поклониться.
- source_word: προσκυνήσωσιν
  choice: поклонится
  rationale: В контексте Откровения глагол обозначает религиозное поклонение образу зверя; русское «поклониться» сохраняет также жест почитания.
- source_word: ἀποκτανθῶσιν
  choice: были убиты
  rationale: Сохранён пассивный залог без добавления не названного исполнителя казни.
theological_decisions:
- issue: Значение πνεῦμα при оживлении образа зверя
  choice: дыхание
  alternative: дух; жизнь
  rationale: «Дыхание» сохраняет связь речи с оживлением образа и возможный отзвук сотворения жизни, но не решает за текст, получил ли образ личный дух или подлинную жизнь.
- issue: Кто даёт способность оживить образ
  choice: источник оставлен не названным
  alternative: прямо назвать Бога или дракона/сатану
  rationale: Греческая пассивная конструкция не называет дающего; перевод сохраняет эту богословски значимую неопределённость.
- issue: Характер воздействия образа на казнь непоклоняющихся
  choice: каузативная связь сохранена без уточнения механизма
  alternative: представить образ непосредственно выносящим приказ или собственноручно убивающим
  rationale: ποιήσῃ ἵνα указывает, что образ добивается результата, но не сообщает, каким образом совершается убийство.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным апокалиптическим звучанием. Синтаксис остаётся близким к греческому, но тяжёлая конструкция ποιήσῃ ἵνα передана естественным русским оборотом. Повтор «образ зверя» намеренно сохранён.
