- from: И дано было ему вложить дыхание[a] в образ зверя, чтобы образ зверя даже заговорил и добился того, чтобы все, кто не поклонится образу зверя, были убиты.[b]
  to: И дано было ему дать дыхание[a] образу зверя, чтобы образ зверя даже заговорил и сделал так, чтобы все, кто не поклонится образу зверя, были убиты.[b]
  rationale: Заменены два оборота, которые либо добавляли невыраженную в греческом пространственную деталь, либо слегка усиливали каузативный смысл. Смысл, неопределённость неназванного дающего и пассивный характер казни сохранены; сноски приведены в соответствие с исправленным основным текстом.
