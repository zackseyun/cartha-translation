  text: Καὶ ἐδόθη αὐτῷ στόμα λαλοῦν μεγάλα καὶ ⸀βλασφημίας, καὶ ἐδόθη αὐτῷ ⸀ἐξουσία ποιῆσαι μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/005.yaml
  text: And a mouth was given to him[a], speaking great things and blasphemies[b], and authority was given to him to act for forty-two months.
translation:
  language: ru
  text: И даны были ему уста, чтобы произносить великие слова[b] и богохульства, и дана была ему власть действовать сорок два месяца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в традиционном переводе: «продолжать действовать сорок два месяца». Греческое ποιῆσαι буквально означает «делать»; в сочетании с указанием срока возможны разные способы передачи.'
    reason: lexical_alternative
  - marker: b
    text: «Великие слова» в данном контексте, вероятно, означают надменные или хвастливые речи.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη
  choice: даны были / дана была
  rationale: Страдательная форма показывает, что зверь получает уста и власть, а не обладает ими сам по себе. Повтор глагола сохранён, как и в греческом тексте.
- source_word: στόμα
  choice: уста
  rationale: Сохраняется зримый апокалиптический образ наделённых речью уст; слово «уста» естественно для возвышенного библейского повествования.
- source_word: λαλοῦν
  choice: говорившие
  rationale: Причастие согласовано со словом «уста» и передаёт их продолжающееся речевое действие без сведения образа к отвлечённой «способности говорить».
- source_word: μεγάλα
  choice: великое
  rationale: Буквально сохраняет широкое значение греческого выражения. В контексте оно подразумевает надменные, хвастливые речи, однако это уточнение не внесено прямо в основной текст.
- source_word: βλασφημίας
  choice: богохульства
  rationale: Множественное число и религиозная направленность оскорбительной речи переданы прямо; ближайший контекст показывает, что речь обращена против Бога.
- source_word: ἐξουσία
  choice: власть
  rationale: Передаёт предоставленное право и дозволенную сферу действия лучше, чем слово «сила», которое могло бы подчеркнуть прежде всего физическое могущество.
- source_word: ποιῆσαι
  choice: действовать
  rationale: Широкий по значению инфинитив ποιῆσαι в сочетании с указанием продолжительности передан без добавления подразумеваемого объекта. «Действовать» естественно по-русски и не сужает смысл до одного вида деятельности.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: сорок два месяца
  rationale: Винительный падеж продолжительности естественно передаётся в русском без предлога; срок сохранён буквально.
theological_decisions:
- issue: Характер речи зверя в выражении μεγάλα
  choice: «великое»
  alternative: «хвастливые речи»; «надменные слова»
  rationale: Контекст придаёт выражению хвастливый и богопротивный оттенок, но само слово μεγάλα шире. Основной текст сохраняет эту неоднозначность, а примечание поясняет вероятный смысл.
- issue: Значение ποιῆσαι при обозначении срока
  choice: «действовать сорок два месяца»
  alternative: «продолжать действовать сорок два месяца»; «осуществлять власть сорок два месяца»
  rationale: Перевод следует чтению ποιῆσαι в SBLGNT. Он не вводит в основной текст ни дополнительный глагол «продолжать», ни подразумеваемый объект «власть».
- issue: Источник власти зверя
  choice: Сохранена безличная страдательная конструкция «дана была ему власть»
  alternative: Назвать Бога непосредственно дающим власть
  rationale: Греческий текст не называет действующее лицо. Перевод сохраняет как представление о предоставленной власти, так и намеренную недосказанность относительно того, кем она дана.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Слово «уста» сохраняет апокалиптический образ, а формула «говорившие великое» намеренно оставлена несколько необычной, чтобы не устранять смысловую широту оригинала. Маркеры примечаний поставлены непосредственно после соответствующих выражений.
