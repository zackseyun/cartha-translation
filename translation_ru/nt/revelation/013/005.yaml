  source_fidelity: 'Основные синтаксические элементы SBLGNT переданы верно: дважды сохранено страдательное «даны/дана», образ στόμα передан русским pluralia tantum «уста», βλασφημίας оставлено во множественном числе, а срок «сорок два месяца» сохранён. Однако «говорившие великое» заметно неестественно в современном литературном русском. «Великие слова» в данном речевом контексте передаёт субстантивированное μεγάλα без преждевременной замены его на «хвастливые речи».'
  naturalness: Формулировка «даны были ему уста, говорившие великое» грамматически возможна, но звучит искусственно. «Даны были ему уста, чтобы произносить великие слова и богохульства» естественнее и сохраняет образ уст и смысл причастия λαλοῦν. Целевая конструкция в русском здесь является нормальным способом передать функцию данных уст, не добавляя нового содержания.
  terminology: «Уста», «богохульства» и «власть» удачны для умеренно возвышенного библейского регистра. Примечание к окончанию стиха следует не представлять как установленный рукописный факт то, что в предоставленном английском следе смешивает переводческую традицию и вариант; безопаснее обозначить «продолжать» как традиционный вариант перевода. Якоря сохранены у соответствующих выражений.
