    rationale: В SBLGNT для Откр. 13:3 нет ни «увидел я», ни эквивалентного вводного оборота. Добавление меняет содержание и синтаксическую связь стиха.
  - severity: medium
    issue: «Смертельная рана её» меняет референт αὐτοῦ.
    rationale: Греческое αὐτοῦ имеет мужской род и относится к θηρίον («зверь»), а не к κεφαλή («голова», женский род). В русском следует явно назвать зверя, чтобы не перенести рану исключительно на голову.
  - severity: low
    issue: Деепричастие «изумляясь» не вполне прямо отражает ἐθαυμάσθη.
    rationale: Пассивная форма выражает, что вся земля была охвачена изумлением; отдельное сказуемое сохраняет этот акцент яснее.
