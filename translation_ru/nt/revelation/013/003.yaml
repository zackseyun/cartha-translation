  text: καὶ μίαν ἐκ τῶν κεφαλῶν αὐτοῦ ⸀ὡς ἐσφαγμένην εἰς θάνατον, καὶ ἡ πληγὴ τοῦ θανάτου αὐτοῦ ἐθεραπεύθη. καὶ ⸀ἐθαυμάσθη ⸂ὅλη ἡ γῆ⸃ ὀπίσω τοῦ θηρίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/003.yaml
  text: And one of its heads was as if slaughtered to death[a], and its deadly wound was healed. And the whole earth marveled and followed after the beast[b],
translation:
  language: ru
  text: И одна из его голов была словно заклана насмерть[a], и смертельная рана зверя исцелилась. И вся земля пришла в изумление и последовала за зверем[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «казалась закланной насмерть». Греческое «словно» может обозначать видимость или подобие, а не безоговорочное утверждение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вся страна», хотя в данном апокалиптическом контексте вероятнее значение «вся земля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μίαν ἐκ τῶν κεφαλῶν αὐτοῦ
  choice: одна из голов его
  rationale: Естественно передаёт партитивную конструкцию μίαν ἐκ с родительным падежом множественного числа; местоимение мужского рода соотнесено со зверем.
- source_word: ὡς ἐσφαγμένην εἰς θάνατον
  choice: была словно заклана насмерть
  rationale: «Словно» сохраняет сравнительно-видимый характер ὡς, а «заклана» передаёт сильный образ σφάζω и его связь с языком жертвенного заклания в Откровении; «насмерть» выражает εἰς θάνατον.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: смертельная рана её
  rationale: Идиоматичная русская передача генитивной конструкции; местоимение женского рода относится к голове, что согласуется с ближайшим смысловым референтом раны.
- source_word: ἐθεραπεύθη
  choice: исцелилась
  rationale: Естественно выражает восстановление после раны и сохраняет образ исцеления, не уточняя его механизм.
- source_word: ἐθαυμάσθη ὅλη ἡ γῆ
  choice: вся земля, изумляясь
  rationale: Передаёт охват ὅλη ἡ γῆ и удивление, выраженное пассивной формой ἐθαυμάσθη, в естественной русской синтаксической связи с последующим следованием.
- source_word: ὀπίσω τοῦ θηρίου
  choice: последовала за зверем
  rationale: Передаёт как направленность «за», так и возможный оттенок приверженности, не добавляя явно поклонения или одобрения.
- source_word: θηρίου
  choice: зверем
  rationale: Устоявшаяся и прозрачная передача θηρίον в апокалиптической образности; строчная буква не превращает обозначение в собственное имя.
theological_decisions:
- issue: Характер смертельной раны и исцеления головы зверя
  choice: Сохранить образ головы, словно закланной насмерть, и последующего исцеления её смертельной раны, не уточняя природу события.
  alternative: Истолковать это как буквальную смерть и воскресение, символическое восстановление власти либо инсценированный обман.
  rationale: ὡς указывает на подобие или видимость, тогда как упоминание смертельной раны и её исцеления сохраняет напряжение между apparent смертностью и восстановлением. Текст сам не разрешает, буквальна, символична или обманчива эта сцена.
- issue: Значение реакции всей земли
  choice: Передать одновременно изумление и следование за зверем.
  alternative: Истолковать реакцию прямо как поклонение, политическую преданность или лишь нейтральное удивление.
  rationale: ἐθαυμάσθη и ὀπίσω τοῦ θηρίου выражают изумление и движение вслед, но данный стих сам по себе не требует более узкой конфессиональной или эсхатологической трактовки.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. «Заклана» сохранено как точное и узнаваемое слово для σφάζω; синтаксис сделан плавным и понятным обычному читателю.
