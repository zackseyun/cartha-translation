reference: Revelation 13:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ποιεῖ πάντας, τοὺς μικροὺς καὶ τοὺς μεγάλους, καὶ τοὺς πλουσίους καὶ τοὺς πτωχούς, καὶ τοὺς ἐλευθέρους καὶ τοὺς δούλους, ἵνα ⸀δῶσιν αὐτοῖς ⸀χάραγμα ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς ἢ ἐπὶ τὸ μέτωπον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/016.yaml
  text: And it causes everyone—the small and the great[a], and the rich and the poor, and the free and the servants—to be given a mark on their right hand or on their forehead,
translation:
  language: ru
  text: И он добивается того, чтобы всем — малым и великим, богатым и бедным, свободным и рабам — дали начертание[a] на правую руку или на лоб,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «чтобы дали им начертание». В греческом тексте не названо, кто именно его даёт.'
    reason: Сохраняется грамматическая неоднозначность трудной конструкции ἵνα δῶσιν αὐτοῖς χάραγμα.
lexical_decisions:
- source_word: ποιεῖ
  choice: делает так, что
  rationale: 'В сочетании с ἵνα и сослагательным наклонением глагол выражает причинность: зверь добивается того, чтобы это произошло. Формулировка естественна по-русски и не усиливает значение до прямого «принуждает».'
- source_word: πάντας
  choice: всем
  rationale: Дательный падеж обусловлен русской конструкцией «всем дают» и передаёт всеохватность, далее раскрытую парными категориями.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: малым и великим
  rationale: Сохранено устойчивое меризматическое противопоставление социальных рангов и торжественный ритм текста Откровения.
- source_word: τοὺς πλουσίους καὶ τοὺς πτωχούς
  choice: богатым и бедным
  rationale: Прямое и ясное обозначение социально-экономических противоположностей.
- source_word: τοὺς ἐλευθέρους καὶ τοὺς δούλους
  choice: свободным и рабам
  rationale: Противопоставление свободным подчёркивает именно несвободный правовой и общественный статус δοῦλοι, поэтому «рабы» точнее, чем «слуги».
- source_word: ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: дают начертание
  rationale: Греческий текст буквально говорит, чтобы неопределённые лица «дали им начертание». Русская неопределённо-личная конструкция естественно передаёт эту форму, не называя деятеля и не заменяя её истолковывающим «получают».
- source_word: χάραγμα
  choice: начертание
  rationale: «Начертание» в данном апокалиптическом контексте обозначает нанесённый опознавательный знак и сохраняет узнаваемую библейскую лексику без ненужной архаичности.
- source_word: ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς
  choice: на правую руку
  rationale: Русский винительный падеж естественен при обозначении нанесения знака на поверхность; единственное число имеет распределительное значение для каждого человека.
- source_word: ἢ ἐπὶ τὸ μέτωπον αὐτῶν
  choice: или на лоб
  rationale: Сохранены альтернатива и распределительное единственное число греческого текста.
theological_decisions:
- issue: Передача δοῦλος в паре со «свободными»
  choice: рабы
  alternative: слуги
  rationale: Непосредственное противопоставление ἐλεύθεροι указывает на общественно-правовую несвободу, а не просто на служение.
- issue: Передача трудной конструкции ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: делает так, что… дают начертание
  alternative: делает так, чтобы они получили начертание
  rationale: Выбранный вариант следует засвидетельствованному активному δῶσιν с дательным αὐτοῖς, сохраняя неопределённость субъекта. Более гладкое «получили» отражает контекстуальный смысл, но меняет грамматическую перспективу.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического стиля. Пары «малые и великие, богатые и бедные, свободные и рабы» сохраняют риторический строй оригинала. «Начертание» выбрано как точный и общеупотребительный в библейском контексте термин.
