id: REV.13.8
reference: Revelation 13:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ προσκυνήσουσιν ⸀αὐτὸν πάντες οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ⸀οὗ οὐ γέγραπται τὸ ὄνομα ⸀αὐτοῦ ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου τοῦ ἐσφαγμένου ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/008.yaml
  text: And all who dwell on the earth will worship him—everyone whose name has not been written in the book of life of the Lamb who was slain from the foundation of the world[a].
translation:
  language: ru
  text: И поклонятся ему все живущие на земле — каждый, чьё имя не записано в книге жизни Агнца, закланного от основания мира.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждый, чьё имя от основания мира не записано в книге жизни закланного Агнца». Греческий текст позволяет отнести слова «от основания мира» либо к «закланного», либо к «не записано».'
    reason: alternative_reading
lexical_decisions:
- source_word: προσκυνήσουσιν
  choice: поклонятся
  rationale: В Откровении глагол обозначает религиозное поклонение; «поклонятся» естественно передаёт как действие, так и культовый смысл.
- source_word: κατοικοῦντες ἐπὶ τῆς γῆς
  choice: живущие на земле
  rationale: Естественное современное выражение, сохраняющее повторяющуюся в Откровении характеристику жителей земли.
- source_word: οὗ οὐ γέγραπται τὸ ὄνομα αὐτοῦ
  choice: каждый, чьё имя не записано
  rationale: Греческая конструкция стоит в единственном числе и выделяет имя каждого человека; перфект передан кратким страдательным причастием, обозначающим существующий результат записи.
- source_word: βιβλίῳ τῆς ζωῆς
  choice: книге жизни
  rationale: Устоявшееся и понятное обозначение апокалиптической небесной книги.
- source_word: τοῦ ἀρνίου
  choice: Агнца
  rationale: «Агнец» сохраняет христологический титул и жертвенный образ; прописная буква указывает на титульное употребление.
- source_word: τοῦ ἐσφαγμένου
  choice: закланного
  rationale: «Закланного» передаёт насильственную смерть и жертвенный оттенок σφάζω, сохраняя достоинство стиля.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: от основания мира
  rationale: Прямо передаёт ἀπό с родительным падежом и сохраняет традиционный библейский оборот.
theological_decisions:
- issue: К чему относится оборот «от основания мира»
  choice: В основном тексте — к «закланного»
  alternative: «каждый, чьё имя от основания мира не записано в книге жизни закланного Агнца»
  rationale: Порядок слов непосредственно связывает оборот с ближайшим причастием «закланного», тогда как Откр. 17:8 поддерживает его связь с записью имени. Подлинная синтаксическая неоднозначность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Сохранены привычные термины «книга жизни» и «Агнец»; синтаксис сделан ясным без устранения неоднозначности оригинала.
