  to: И увидел я другого зверя, выходившего из земли[a]. У него было два рога, как у ягнёнка, и говорил он как дракон.
  rationale: Исправлен союз на нейтральное «и», соответствующее καί. Сравнение рогов передано современной русской конструкцией «как у ягнёнка», которая сохраняет образ оригинала и возможную, но не навязанную аллюзию на Агнца в Откровении. Сноска к γῆ сохранена и привязана корректно.
