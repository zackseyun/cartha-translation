  source_fidelity: Требуются две безопасные правки. Противительный союз «но» не имеет соответствия в греческом καί («и») и эксплицирует контраст, который читатель может увидеть сам. Кроме того, «подобные рогам Агнца» меняет прямое сравнение «рога, подобные ягнёнку» на сравнение с рогами определённого Агнца и чрезмерно закрепляет интерпретацию прописной буквой.
  naturalness: «И увидел я» и «У него было два рога» естественны для современного литературного русского в торжественном повествовательном регистре. Формулировка «два рога, как у ягнёнка» ясно и естественно передаёт образ; она не требует архаичной конструкции «подобные агнчим».
  terminology: «Зверь» и «дракон» удачно сохраняют терминологическую связь с апокалиптическими образами Откровения. «Ягнёнок» передаёт ἀρνίον современно и не превращает вероятную аллюзию в прямо названный титул «Агнец».
