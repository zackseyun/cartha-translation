  text: Καὶ εἶδον ἄλλο θηρίον ἀναβαῖνον ἐκ τῆς γῆς, καὶ εἶχεν κέρατα δύο ὅμοια ἀρνίῳ, καὶ ἐλάλει ὡς δράκων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/011.yaml
  text: And I saw another beast coming up out of the earth[a], and it had two horns like a lamb, and it was speaking like a dragon.
translation:
  language: ru
  text: И увидел я другого зверя, выходившего из земли[a]. У него было два рога, как у ягнёнка, и говорил он как дракон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выходившего из суши». Греческое слово γῆ может означать «земля» или «суша».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο θηρίον
  choice: другого зверя
  rationale: «Зверь» сохраняет устойчивый апокалиптический образ и связь с предшествующим зверем; ἄλλο передано как «другого».
- source_word: ἀναβαῖνον ἐκ τῆς γῆς
  choice: выходившего из земли
  rationale: Причастная конструкция передаёт зверя в процессе появления. «Из земли» естественно выражает движение снизу вверх и сохраняет широкий смысл γῆ; возможное значение «суша» отмечено в сноске.
- source_word: εἶχεν κέρατα δύο
  choice: у него было два рога
  rationale: Естественная русская описательная конструкция точно передаёт несовершенный вид εἶχεν и образ двух рогов.
- source_word: ὅμοια ἀρνίῳ
  choice: подобные рогам Агнца
  rationale: Грамматически ὅμοια согласуется с «рогами». Добавление повторного «рогам» делает сравнение ясным по-русски, не утверждая тождества зверя с Агнцем. Прописная буква сохраняет вероятную отсылку к образу Агнца в Откровении.
- source_word: ἐλάλει ὡς δράκων
  choice: но говорил он как дракон
  rationale: Имперфект передаёт характерную или продолжающуюся манеру речи. «Как дракон» сохраняет сравнение, а «но» естественно выражает резкий контраст, заложенный в сопоставлении внешности и речи.
theological_decisions:
- issue: Отсылка ἀρνίον к образу Агнца в Откровении
  choice: Агнца
  alternative: ягнёнка
  rationale: В книге ἀρνίον служит устойчивым обозначением Агнца; прописная буква помогает сохранить вероятную намеренную отсылку. Формулировка не отождествляет зверя с Агнцем, а говорит лишь о сходстве его рогов.
- issue: Значение γῆ
  choice: земли
  alternative: суши
  rationale: Оба значения лексически возможны. «Земля» сохраняет широкий космический образ и контраст со зверем, выходящим из моря, не сужая смысл до определённой территории; альтернатива вынесена в сноску.
- issue: Характер связи между двумя последними описаниями
  choice: но говорил он как дракон
  alternative: и говорил он как дракон
  rationale: Греческое καί формально означает «и», однако контекст создаёт явный смысловой контраст между подобием Агнцу и речью дракона. «Но» естественно передаёт этот дискурсивный эффект, не устраняя самого сравнения.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Инверсия «И увидел я» сохраняет торжественный ритм видения, оставаясь понятной современному читателю.
