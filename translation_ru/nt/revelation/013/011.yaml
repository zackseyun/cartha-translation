    rationale: В оригинале между описаниями стоят καί ... καί («и ... и»). Контраст может быть прагматически ощутим, но «но» является дополнительной интерпретационной маркировкой.
  - severity: medium
    issue: «Подобные рогам Агнца» подменяет объект сравнения и делает аллюзию определённой.
    rationale: ὅμοια ἀρνίῳ буквально соотносит два рога с ягнёнком; текст не говорит «подобные рогам Агнца». Прописное «Агнца» допустимо лишь как интерпретация аллюзии, но не должно устранять поверхностную неоднозначность образа.
