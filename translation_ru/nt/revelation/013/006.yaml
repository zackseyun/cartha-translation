  yaml_path: translation/nt/revelation/013/006.yaml
  text: And it opened its mouth in blasphemies against God[a], to blaspheme his name and his dwelling[b], those dwelling in heaven.
translation:
  language: ru
  text: И он открыл свои уста для богохульств против Бога, чтобы хулить его имя, его жилище[b] и живущих на небе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или заключительный оборот можно понимать как пояснение к словам «его жилище»: «его жилище, то есть живущих на небе».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «скинию»; также возможно: «шатёр».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε τὸ στόμα αὐτοῦ
  choice: открыл он уста свои
  rationale: Сохранён яркий библейский образ «открыть уста»; возвратное «свои» естественно указывает на зверя как на субъект и не смешивает его с последующими местоимениями, относящимися к Богу.
- source_word: εἰς βλασφημίας πρὸς τὸν θεόν
  choice: для хулы на Бога
  rationale: Оборот передаёт направленность враждебной речи против Бога. Единственное собирательное «хула» звучит по-русски естественнее буквального «хуления», сохраняя смысл богохульных речей.
- source_word: βλασφημῆσαι
  choice: чтобы хулить
  rationale: Целевой инфинитив передан придаточным цели, что ясно и естественно выражает функцию греческого аористного инфинитива.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: его имя
  rationale: Буквально сохранено слово «имя» с присущим библейскому контексту значением Божьей явленной личности и чести, без поясняющего расширения.
- source_word: τὴν σκηνὴν αὐτοῦ
  choice: его жилище
  rationale: «Жилище» доступно современному читателю и передаёт место пребывания Бога; более специальные варианты «скиния» и «шатёр» отмечены в сноске.
- source_word: τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας
  choice: живущих на небе
  rationale: Причастный оборот передан естественной русской формой. Тире позволяет прочитать его как присоединённое пояснение к «жилищу», не добавляя отсутствующего в греческом выражения «то есть».
theological_decisions:
- issue: Связь между «его жилищем» и «живущими на небе»
  choice: 'Основной текст представляет заключительный оборот как присоединённое пояснение к Божьему жилищу: «его жилище — живущих на небе».'
  alternative: 'Понимать «живущих на небе» как третий однородный объект глагола «хулить»: «и живущих на небе».'
  rationale: Греческий винительный оборот допускает как пояснительное, так и сочинительное понимание. Основной вариант сохраняет тесную словесную связь σκηνή и σκηνοῦντας, а сноска открыто сохраняет другую грамматически возможную интерпретацию.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Оборот «открыл уста» сохранён как понятный устойчивый образ; архаичные «отверз» и «обиталище» не используются. Местоимения, относящиеся к Богу, даны со строчной буквы как нейтральное редакционное решение.
