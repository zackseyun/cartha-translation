  source_fidelity: 'Греческое εἰς βλασφημίας требует множественного значения; «для хулы» неоправданно сглаживает его. Заключительное τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας синтаксически спорно: его можно понимать как пояснение к «его жилищу» либо как ещё один объект при «хулить». Русская конструкция исходного текста «его жилище — живущих на небе» не образует естественного и грамматически ясного пояснения. В основном тексте выбран грамматически прозрачный сочинительный вариант, а пояснительное прочтение сохранено в сноске.'
  naturalness: «Он открыл свои уста» сохраняет библейский образ, но остаётся современным литературным русским. «Для богохульств против Бога» передаёт множественность и направленность греческого выражения. Координация «и живущих на небе» естественна и не создаёт смыслового сбоя, возникающего при отождествлении жилища с людьми.
  terminology: «Богохульства», «хулить», «имя» и «жилище» точны по регистру и смыслу. «Жилище» как перевод σκηνή допустимо; варианты «скиния» и «шатёр» корректно вынесены в сноску. Местоимения Бога со строчной буквы соответствуют заявленной нейтральной редакционной практике.
