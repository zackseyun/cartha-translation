id: REV.7.11
reference: Revelation 7:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἄγγελοι εἱστήκεισαν κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων, καὶ ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/011.yaml
  text: And all the angels were standing around the throne and the elders and the four living creatures[a], and they fell before the throne on their faces and worshiped God,
translation:
  language: ru
  text: И все ангелы стояли вокруг престола, старейшин и четырёх живых существ[a]; они пали ниц перед престолом и поклонились Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «четырёх живых созданий».'
    reason: Лексическая альтернатива для ζῷα, которое может обозначать живых существ или созданий.
lexical_decisions:
- source_word: πάντες οἱ ἄγγελοι
  choice: все ангелы
  rationale: Прямо передаёт сочетание πάντες с определённым артиклем и сохраняет обычное для Откровения обозначение ангелов.
- source_word: εἱστήκεισαν
  choice: стояли
  rationale: Форма имеет статическое значение и описывает продолжавшееся положение, а не момент вставания.
- source_word: κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων
  choice: вокруг престола, старейшин и четырёх живых существ
  rationale: Предлог «вокруг» естественно передаёт пространственное значение κύκλῳ с родительным падежом; однородный ряд сохранён без пояснительного истолкования взаимного расположения фигур.
- source_word: τῶν πρεσβυτέρων
  choice: старейшин
  rationale: В Откровении слово обозначает известную небесную группу; «старейшины» — понятный и устойчивый русский эквивалент.
- source_word: τῶν τεσσάρων ζῴων
  choice: четырёх живых существ
  rationale: Такой перевод сохраняет одушевлённость и особый характер престольных существ, не создавая ошибочной ассоциации с обычными животными.
- source_word: ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: пали ниц перед престолом
  rationale: Русское выражение «пасть ниц» естественно и точно передаёт полное простирание лицом вниз; «перед престолом» сохраняет пространственное значение ἐνώπιον.
- source_word: προσεκύνησαν τῷ θεῷ
  choice: поклонились Богу
  rationale: При прямом объекте «Богу» и после уже описанного падения ниц глагол обозначает религиозное поклонение, а не только телесный поклон.
theological_decisions:
- issue: Обозначение небесных существ у престола (ζῷα)
  choice: живые существа
  alternative: живые создания
  rationale: Выбранное выражение сохраняет апокалиптическую образность и не отождествляет этих существ ни с обычными животными, ни с какой-либо истолковательной категорией.
- issue: Значение προσκυνέω по отношению к Богу
  choice: поклонились Богу
  alternative: совершили поклон перед Богом
  rationale: Контекст указывает на поклонение Богу, а телесная сторона действия уже выражена словами «пали ниц»; при этом естественный русский глагол не добавляет конфессионально окрашенного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Пали ниц» сохраняет достоинство и образность исходного текста, оставаясь понятным современному читателю; точка с запятой удерживает единство греческого предложения без тяжеловесности.
