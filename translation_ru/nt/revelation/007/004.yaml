  text: Καὶ ἤκουσα τὸν ἀριθμὸν τῶν ἐσφραγισμένων, ⸀ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, ⸀ἐσφραγισμένοι ἐκ πάσης φυλῆς υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/004.yaml
  text: 'And I heard the number of those who had been sealed: one hundred forty-four thousand[a], sealed from every tribe of the sons of Israel.'
translation:
  language: ru
  text: 'И я услышал число запечатлённых: сто сорок четыре тысячи, запечатлённых из каждого колена сынов Израиля.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детей Израиля». В греческом тексте: «сынов Израиля»; употреблено слово мужского рода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: я услышал
  rationale: 'Аорист ἀκούω в повествовательном контексте прямо передаётся совершенным видом: «услышал».'
- source_word: τὸν ἀριθμὸν
  choice: число
  rationale: «Число» естественно обозначает названную далее общую численность группы.
- source_word: τῶν ἐσφραγισμένων / ἐσφραγισμένοι
  choice: запечатлённых / запечатлённые
  rationale: Страдательное причастие совершенного времени обозначает тех, над кем запечатление уже совершено и кто пребывает в этом состоянии. Повтор причастия сохранён.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: сто сорок четыре тысячи
  rationale: Стандартная современная русская форма записи числительного словами.
- source_word: ἐκ
  choice: из
  rationale: Предлог указывает на происхождение или выделение из соответствующей группы.
- source_word: πάσης φυλῆς
  choice: из каждого колена
  rationale: Сочетание с πᾶς в единственном числе имеет распределительный смысл; «каждого» передаёт участие отдельных колен.
- source_word: υἱῶν Ἰσραήλ
  choice: сынов Израиля
  rationale: Буквально сохраняет мужское родословное обозначение и его связь с последующим перечнем колен.
theological_decisions:
- issue: Передача υἱῶν Ἰσραήλ в контексте перечня колен
  choice: сынов Израиля
  alternative: детей Израиля; народа Израиля
  rationale: Греческий текст использует мужское υἱῶν и родословную формулу. Буквальная передача сохраняет формулировку источника, не предрешая, как следует богословски понимать перечисленную группу.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного библейского регистра. Термин «колено» оставлен как общепринятое обозначение племени Израиля. Тире делает повтор «запечатлённые» естественным, не устраняя его из исходного текста.
