id: REV.7.17
reference: Revelation 7:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι τὸ ἀρνίον τὸ ἀνὰ μέσον τοῦ θρόνου ⸀ποιμανεῖ αὐτούς, καὶ ⸀ὁδηγήσει αὐτοὺς ἐπὶ ζωῆς πηγὰς ὑδάτων· καὶ ἐξαλείψει ὁ θεὸς πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/017.yaml
  text: because the Lamb in the midst of the throne will shepherd them[a], and he will guide them to springs of the water of life[c][b], and God will wipe away every tear from their eyes.
translation:
  language: ru
  text: потому что Агнец, Который посреди престола[a], будет пасти их и поведёт их[b] к источникам воды жизни[c], и Бог утрёт всякую слезу с их глаз.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Который в центре престола».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет направлять их».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «к источникам живой воды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνίον
  choice: Агнец
  rationale: Сохраняет устойчивый апокалиптический и христологический титул из Откровения, а также его жертвенные и мессианские ассоциации; уменьшительное «ягнёнок» здесь звучало бы неуместно.
- source_word: ἀνὰ μέσον τοῦ θρόνου
  choice: посреди престола
  rationale: Передаёт центральное положение Агнца относительно престола и сохраняет яркий пространственный образ греческого выражения.
- source_word: ποιμανεῖ
  choice: будет пасти
  rationale: 'Буквально передаёт пастырский смысл ποιμαίνω и сохраняет намеренный парадокс: Агнец выступает пастырем. Последующее ведение к воде жизни поддерживает именно этот смысл, а не более отвлечённое «будет править».'
- source_word: ὁδηγήσει
  choice: поведёт
  rationale: Естественно передаёт направляющее движение к указанной цели и хорошо сочетается с образом пастыря, не дублируя глагол «пасти».
- source_word: ἐπὶ ζωῆς πηγὰς ὑδάτων
  choice: к источникам воды жизни
  rationale: Предлог при глаголе движения естественно передан как «к»; «источники» сохраняют природный образ, а сочетание «вода жизни» наиболее вероятно отражает связь родительных форм, не исключая образа живой воды.
- source_word: ἐξαλείψει
  choice: утрёт
  rationale: В утешительном контексте естественно передаёт удаление слёз заботливым действием, тогда как «изгладит» звучало бы здесь слишком отвлечённо или судебно.
- source_word: πᾶν δάκρυον
  choice: всякую слезу
  rationale: Сохраняет греческое единственное число и подчёркнутую всеохватность обещания.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: с их глаз
  rationale: Естественный современный русский эквивалент, сохраняющий исходный образ.
theological_decisions:
- issue: Христологический парадокс Агнца как пастыря
  choice: Сохранено буквальное сочетание «Агнец… будет пасти их».
  alternative: «Агнец… будет заботиться о них» или «будет править ими».
  rationale: Образ намеренно соединяет Агнца и пастыря; сглаживание этого парадокса ослабило бы богословскую и образную силу стиха.
- issue: Соотношение Бога и Агнца в заключительной части
  choice: Фраза «Бог утрёт» сохранена как отдельная часть с явно названным подлежащим.
  alternative: Продолжить фразу так, будто подразумеваемым подлежащим остаётся Агнец.
  rationale: В греческом тексте ὁ θεός прямо назван подлежащим заключительного глагола; перевод не должен стирать это грамматическое различие.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Титул «Агнец» и относящееся к нему местоимение «Который» оформлены по принятой в русской библейской традиции орфографии; синтаксис оставлен ясным и близким к структуре греческого текста.
