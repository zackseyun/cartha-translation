  text: ἐκ φυλῆς Συμεὼν δώδεκα χιλιάδες, ἐκ φυλῆς Λευὶ δώδεκα χιλιάδες, ἐκ φυλῆς Ἰσσαχὰρ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/007.yaml
  text: from the tribe of Simeon[a], twelve thousand; from the tribe of Levi, twelve thousand; from the tribe of Issachar, twelve thousand.
translation:
  language: ru
  text: из колена Симеона — двенадцать тысяч; из колена Левия — двенадцать тысяч; из колена Иссахара — двенадцать тысяч.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ
  choice: из
  rationale: Предлог обозначает происхождение или принадлежность и естественно передаётся русским «из»; повтор сохраняет формулу греческого текста.
- source_word: φυλῆς
  choice: колена
  rationale: В контексте родоплеменного устройства Израиля «колено» — традиционный и точный русский эквивалент.
- source_word: Συμεὼν
  choice: Симеона
  rationale: Употреблена общепринятая русская библейская форма имени в родительном падеже после «колена».
- source_word: δώδεκα χιλιάδες
  choice: двенадцать тысяч
  rationale: Число передано словами в соответствии с литературным характером перечисления.
- source_word: Λευὶ
  choice: Левия
  rationale: Сохранена общепринятая русская библейская форма; необычное включение Левия в перечень не сопровождается толкованием, которого нет в исходном тексте.
- source_word: Ἰσσαχὰρ
  choice: Иссахара
  rationale: Употреблена общепринятая русская библейская форма имени в родительном падеже.
theological_decisions:
- issue: Повторяющийся синтаксис перечня колен
  choice: Для каждого колена сохранена формула «из колена… — двенадцать тысяч».
  alternative: Сжать до «из колен Симеона, Левия и Иссахара — по двенадцать тысяч».
  rationale: Греческий текст повторяет полную формулу, создавая ритм торжественного перечисления; сокращение устранило бы эту структуру.
- issue: Включение Левия в перечень колен
  choice: Имя Левия переведено без пояснения в основном тексте.
  alternative: Добавить пояснение о необычности включения Левия.
  rationale: Исходный текст лишь называет Левия; пояснение внесло бы в перевод отсутствующее в стихе толкование.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и ритма апокалиптического перечисления. Тире естественно отделяет указание колена от числа и не меняет смысл исходного текста.
