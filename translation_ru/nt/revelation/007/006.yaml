    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ
  choice: из
  rationale: 'Предлог указывает на происхождение или принадлежность: названные люди происходят из каждого соответствующего колена.'
- source_word: φυλῆς
  choice: колена
  rationale: В контексте родовых подразделений Израиля «колено» — точный и общепринятый русский библейский эквивалент.
- source_word: Ἀσὴρ
  choice: Асира
  rationale: Использована закрепившаяся в русском библейском употреблении форма имени Асир, поставленная в родительном падеже после «из колена».
- source_word: δώδεκα χιλιάδες
  choice: двенадцать тысяч
  rationale: Числительное передаёт количество без добавления глагола, отсутствующего в греческом тексте данного стиха.
- source_word: Νεφθαλὶμ
  choice: Неффалима
  rationale: Использована традиционная и узнаваемая русская форма имени Неффалим в требуемом родительном падеже.
- source_word: Μανασσῆ
  choice: Манассии
  rationale: Использована закрепившаяся русская форма имени Манассия в родительном падеже.
theological_decisions:
- issue: Следует ли восполнить подразумеваемый из контекста глагол «были запечатлены»
  choice: Не добавлять глагол в основной текст и сохранить безглагольное перечисление.
  alternative: «из колена Асира были запечатлены двенадцать тысяч» — с аналогичным восполнением для следующих колен.
  rationale: В самом греческом тексте стиха глагола нет; мысль о запечатлении задаётся предшествующим контекстом. Безглагольная конструкция сохраняет краткость оригинала и не устраняет его синтаксическую подразумеваемость.
translation_notes:
  register: Современный литературный русский с сохранением общепринятой библейской терминологии «колено» и традиционных русских форм имён. Тире делает безглагольное перечисление ясным и естественным, не добавляя отсутствующего в оригинале сказуемого.
