  text: καὶ ⸀εἴρηκα αὐτῷ· Κύριέ μου, σὺ οἶδας. καὶ εἶπέν μοι· Οὗτοί εἰσιν οἱ ἐρχόμενοι ἐκ τῆς θλίψεως τῆς μεγάλης, καὶ ἔπλυναν τὰς στολὰς αὐτῶν καὶ ἐλεύκαναν ⸀αὐτὰς ἐν τῷ αἵματι τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/014.yaml
  text: And I said to him[a], “My lord, you know.” And he said to me, “These are the ones coming out of the great tribulation[b]. They washed their robes and made them white in the blood of the Lamb.”
translation:
  language: ru
  text: 'И я сказал ему: «Господин мой, ты знаешь». И он сказал мне: «Это те, кто выходит из великой скорби[a]. Они омыли свои одежды и сделали их белыми в крови Агнца[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из великого бедствия» или «из великого притеснения». Греческое слово может означать скорбь, бедствие или притеснение.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «в крови Агнца» сохранено намеренно. Греческий оборот можно понимать и в инструментальном смысле — «кровью Агнца», однако перевод с «в» сохраняет парадоксальный образ очищения в Откровении.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκα
  choice: я сказал
  rationale: Хотя в греческом стоит перфект, в повествовательном диалоге он естественно передаётся русским прошедшим временем.
- source_word: Κύριέ μου
  choice: Господин мой
  rationale: Иоанн обращается к небесному старцу, а не прямо к Богу или Христу; формула сохраняет почтительность, не приписывая собеседнику божественного титула.
- source_word: σὺ οἶδας
  choice: ты знаешь
  rationale: Прямое и естественное соответствие; выражает почтительное признание того, что старец знает ответ.
- source_word: οἱ ἐρχόμενοι
  choice: те, кто выходит
  rationale: Настоящее причастие сохранено как продолжающееся или характерное действие, а не сведено к завершённому прошлому.
- source_word: ἐκ τῆς θλίψεως τῆς μεγάλης
  choice: из великой скорби
  rationale: «Скорбь» естественно передаёт θλῖψις и сохраняет узнаваемую библейскую формулу без привязки к определённой эсхатологической схеме.
- source_word: ἔπλυναν
  choice: омыли
  rationale: Аорист передан совершенным видом как целостное завершённое действие; «омыли» соответствует возвышенному регистру видения.
- source_word: στολάς
  choice: одежды
  rationale: В данном образе «одежды» звучит естественнее, чем узкое «мантии», и передаёт длинные одеяния, обозначенные словом στολή.
- source_word: ἐλεύκαναν
  choice: убелили
  rationale: Сохраняет каузативное значение «сделали белыми» и возвышенную, но понятную библейскую образность.
- source_word: ἐν τῷ αἵματι
  choice: в крови
  rationale: Предлог «в» сохраняет намеренно парадоксальный образ очищения кровью; возможное инструментальное понимание отмечено в сноске.
- source_word: τοῦ ἀρνίου
  choice: Агнца
  rationale: В Откровении это титульное обозначение Христа; прописная буква и слово «Агнец» сохраняют эту функцию.
theological_decisions:
- issue: Обращение κύριος к старцу
  choice: Господин мой
  alternative: Господи мой; почтенный господин
  rationale: Контекст указывает на небесного старца, поэтому перевод сохраняет почтительность, не отождествляя его с Богом или Мессией.
- issue: Значение выражения «великая скорбь»
  choice: великая скорбь
  alternative: великое бедствие; великое притеснение
  rationale: Лексический перевод сохраняет определённость выражения и не решает, относится ли оно к особому периоду конца времён, к страданиям верующих вообще или сочетает оба смысла.
- issue: Образ очищения кровью
  choice: убелили их в крови Агнца
  alternative: убелили их кровью Агнца
  rationale: Буквенная пространственная формулировка сохраняет богословски значимый парадокс Откровения; инструментальное прочтение остаётся возможным и указано в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным регистром. Формы «Агнец», «омыли» и «убелили» поддерживают образность апокалиптического видения, оставаясь понятными современному читателю. Все сноски привязаны к соответствующим местам основного текста.
