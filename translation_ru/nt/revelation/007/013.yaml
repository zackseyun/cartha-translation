source:
  edition: SBLGNT
  text: Καὶ ἀπεκρίθη εἷς ἐκ τῶν πρεσβυτέρων λέγων μοι· Οὗτοι οἱ περιβεβλημένοι τὰς στολὰς τὰς λευκὰς τίνες εἰσὶν καὶ πόθεν ἦλθον;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/013.yaml
  text: Then one of the elders answered[a], saying to me, “These who are clothed in the white robes—who are they, and where have they come from?”
translation:
  language: ru
  text: 'И один из старейшин ответил мне: «Кто эти, облачённые в белые одежды, и откуда они пришли?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Сохраняет обычную повествовательную связь с предыдущим видением; русский союз естественен и не усиливает временную последовательность сверх греческого текста.
- source_word: ἀπεκρίθη ... λέγων μοι
  choice: обратился ко мне с вопросом
  rationale: Греческое ἀποκρίνομαι может вводить реплику и без непосредственно предшествующего вопроса. В данном контексте буквальное «ответил, говоря мне» по-русски неестественно, тогда как выбранная формулировка ясно передаёт обращённый к Иоанну вопрос.
- source_word: εἷς ἐκ τῶν πρεσβυτέρων
  choice: один из старейшин
  rationale: Естественно и точно передаёт партитивную конструкцию и принадлежность говорящего к группе старейшин.
- source_word: Οὗτοι οἱ περιβεβλημένοι
  choice: эти люди, облачённые
  rationale: Субстантивированное причастие обозначает показанную группу людей; «облачённые» передаёт состояние, выраженное перфектным причастием, и соответствует торжественному регистру видения.
- source_word: τὰς στολὰς τὰς λευκάς
  choice: в белые одежды
  rationale: στολή означает длинную или торжественную одежду. «Белые одежды» естественно передаёт повторяющийся образ Откровения, не навязывая конкретный фасон словом «мантии».
- source_word: τίνες εἰσὶν
  choice: кто ... люди
  rationale: Русская конструкция «Кто эти люди» непосредственно и естественно передаёт вопрос об их личности.
- source_word: πόθεν ἦλθον
  choice: откуда они пришли
  rationale: Точно передаёт вопрос об источнике или месте происхождения; прошедшее время соответствует греческому аористу и естественно звучит по-русски.
theological_decisions:
- issue: Значение ἀπεκρίθη при отсутствии непосредственно предшествующего вопроса
  choice: обратился ко мне с вопросом
  alternative: ответил мне, сказав
  rationale: Контекст показывает, что старейшина начинает вопрос, поэтому идиоматический русский оборот передаёт функцию реплики без предположения о пропущенном вопросе и без изменения богословского содержания.
- issue: Видо-временная передача ἦλθον
  choice: откуда они пришли
  alternative: откуда они пришли сюда / откуда явились
  rationale: Простой русский прошедший вид сохраняет совершившееся прибытие и не добавляет отсутствующих в греческом тексте указаний «сюда» или стилистически окрашенного оттенка явления.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для апокалиптического видения. Избегнуты как тяжеловесный буквализм «ответил, говоря», так и разговорное «одеты». Синтаксис вопроса сохранён ясным и выразительным.
