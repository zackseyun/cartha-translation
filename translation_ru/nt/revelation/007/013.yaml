  source_fidelity: В черновике точно переданы говорящий, белые одежды и два вопроса, а также аорист ἦλθον как «пришли». Однако «обратился ко мне с вопросом» заменяет ἀπεκρίθη («ответил») описанием речевого акта и тем самым сглаживает формулировку исходного текста. Прямое «ответил мне» возможно и естественно в литературно-библейском повествовании; причастие λέγων нормально передаётся вводом прямой речи.
  naturalness: Исправленный текст звучит современно и литературно. Конструкция «Кто эти, облачённые в белые одежды?» компактна, ясна и сохраняет определение группы без добавления слова «люди».
  terminology: «Старейшины» соответствует πρεσβύτεροι в образном языке Откровения; «облачённые» и «белые одежды» адекватно передают περιβεβλημένοι и στολὰς λευκάς. Специальных богословских терминов, требующих иной передачи, в стихе нет.
