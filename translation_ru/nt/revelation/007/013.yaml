  to: 'И один из старейшин ответил мне: «Кто эти, облачённые в белые одежды, и откуда они пришли?»'
  rationale: 'Заменено «обратился ко мне с вопросом» на «ответил мне», чтобы сохранить ἀπεκρίθη, как это делает и английская контрольная версия. Прямая речь естественно включает значение λέγων μοι. Убрано добавочное «люди»: подразумеваемая группа остаётся ясной, а русская конструкция ближе к демонстративно-причастному обороту оригинала. Сноска не требуется: «откуда они пришли» однозначно и естественно передаёт πόθεν ἦλθον; альтернативная русская формулировка не представляет значимого текстологического или смыслового варианта.'
