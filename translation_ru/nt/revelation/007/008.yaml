source:
  edition: SBLGNT
  text: ἐκ φυλῆς Ζαβουλὼν δώδεκα χιλιάδες, ἐκ φυλῆς Ἰωσὴφ δώδεκα χιλιάδες, ἐκ φυλῆς Βενιαμὶν δώδεκα χιλιάδες ⸀ἐσφραγισμένοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/008.yaml
  text: from the tribe of Zebulun[a], twelve thousand; from the tribe of Joseph, twelve thousand; from the tribe of Benjamin, twelve thousand, having been sealed.
translation:
  language: ru
  text: из колена Завулона — двенадцать тысяч; из колена Иосифа — двенадцать тысяч; из колена Вениамина — двенадцать тысяч — все они запечатлены.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «запечатлённые». Греческое причастие стоит в конце и относится к перечисленным группам в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ φυλῆς
  choice: из колена
  rationale: В перечне племён Израиля «колено» — точный, общепринятый и естественный русский эквивалент; предлог «из» передаёт происхождение или принадлежность.
- source_word: Ζαβουλών
  choice: Завулон
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: δώδεκα χιλιάδες
  choice: двенадцать тысяч
  rationale: Прямо передаёт число и сохраняет повторяющуюся структуру греческого перечня.
- source_word: Ἰωσήφ
  choice: Иосиф
  rationale: Сохранено названное в тексте имя; оно не заменено названиями Ефрема или Манассии.
- source_word: Βενιαμίν
  choice: Вениамин
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: ἐσφραγισμένοι
  choice: все они запечатлены
  rationale: Форма «запечатлены» естественно передаёт пассивное действие и его сохраняющийся результат; «все они» ясно показывает итоговый охват перечисленных групп, который в греческом выражен стоящим в конце причастием.
theological_decisions:
- issue: Охват и смысл заключительного причастия ἐσφραγισμένοι
  choice: Передать как итоговое «все они запечатлены», относящееся ко всем перечисленным группам.
  alternative: 'Буквально: «запечатлённые»; либо «которые были запечатлены».'
  rationale: Греческое причастие стоит в конце перечня и суммирует названные группы. Перевод не уточняет природу или богословское значение запечатления, но устраняет возможное в русском ошибочное впечатление, будто слово относится только к колену Вениамина.
translation_notes:
  register: Современный литературный русский язык с традиционными библейскими формами имён. Повтор и порядок исходного перечня сохранены; тире помогают ясно оформить перечисление и его итог.
