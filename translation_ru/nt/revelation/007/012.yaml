id: REV.7.12
reference: Revelation 7:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγοντες· Ἀμήν· ἡ εὐλογία καὶ ἡ δόξα καὶ ἡ σοφία καὶ ἡ εὐχαριστία καὶ ἡ τιμὴ καὶ ἡ δύναμις καὶ ἡ ἰσχὺς τῷ θεῷ ἡμῶν εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/012.yaml
  text: saying[a], “Amen! The blessing and the glory and the wisdom and the thanksgiving and the honor and the power and the might be to our God forever and ever. Amen.”
translation:
  language: ru
  text: 'говоря: «Аминь! Благословение, слава, мудрость, благодарение, честь, сила и могущество — нашему Богу во веки веков[a]. Аминь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в века веков».'
    reason: Лексическая альтернатива, показывающая форму греческого устойчивого выражения.
lexical_decisions:
- source_word: λέγοντες
  choice: говоря
  rationale: Причастная форма настоящего времени передаёт сопутствующее речевое действие и непосредственно вводит содержание возгласа, сохраняя синтаксическую связь с предыдущим стихом.
- source_word: Ἀμήν / ἀμήν
  choice: Аминь
  rationale: В литургическом и славословном контексте традиционная транслитерация естественнее перевода «истинно»; повтор обрамляет славословие.
- source_word: ἡ εὐλογία
  choice: благословение
  rationale: Сохраняет основное значение εὐλογία и форму первого элемента семичленного славословия; контекст допускает смысл благословения или хвалы, воздаваемых Богу.
- source_word: ἡ δόξα
  choice: слава
  rationale: Устойчивое и точное соответствие в славословном контексте.
- source_word: ἡ σοφία
  choice: мудрость
  rationale: Прямое соответствие, сохраняющее перечисление Божьих достоинств и воздаваемой Ему хвалы.
- source_word: ἡ εὐχαριστία
  choice: благодарение
  rationale: Передаёт отвлечённое существительное и поддерживает торжественный ритм перечисления.
- source_word: ἡ τιμή
  choice: честь
  rationale: В контексте поклонения обозначает честь, воздаваемую Богу.
- source_word: ἡ δύναμις
  choice: сила
  rationale: Естественно передаёт значение силы и способности, оставаясь отличимым от следующего близкого по смыслу слова.
- source_word: ἡ ἰσχύς
  choice: могущество
  rationale: Сохраняет риторическое нагромождение близких понятий, не сливая ἰσχύς с δύναμις.
- source_word: τῷ θεῷ ἡμῶν
  choice: нашему Богу
  rationale: Дательный падеж передаёт адресата славословия; русская безглагольная конструкция с тире позволяет не добавлять отсутствующий в греческом тексте глагол.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Естественная и укоренённая русская формула неограниченной продолжительности, близко отражающая структуру греческого выражения.
theological_decisions:
- issue: Отсутствующий глагол в славословии
  choice: безглагольная конструкция «— нашему Богу»
  alternative: «да будут у нашего Бога» / «принадлежат нашему Богу»
  rationale: Греческий текст не содержит глагола. Русская конструкция с дательным падежом и тире сохраняет направленность славословия к Богу, не превращая её однозначно в утверждение о принадлежности.
- issue: Различение δύναμις и ἰσχύς
  choice: «сила и могущество»
  alternative: «мощь и сила»
  rationale: Разные русские слова сохраняют намеренное сочетание близких понятий и полноту семичленного славословия.
- issue: Значение εὐλογία в обращённом к Богу славословии
  choice: «благословение»
  alternative: «хвала»
  rationale: «Благословение» ближе к лексической форме оригинала и сохраняет библейское напряжение выражения, в котором благословение воздаётся Богу; перевод «хвала» был бы более истолковывающим.
translation_notes:
  register: Современный литературный русский с торжественным славословным ритмом. Артикли перед каждым существительным не воспроизводятся, поскольку это было бы неестественно для русского языка; семичленная структура сохранена. Формула «во веки веков» уместна как понятная и укоренённая библейская идиома.
