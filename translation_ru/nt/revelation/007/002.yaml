source:
  edition: SBLGNT
  text: καὶ εἶδον ἄλλον ἄγγελον ἀναβαίνοντα ἀπὸ ἀνατολῆς ἡλίου, ἔχοντα σφραγῖδα θεοῦ ζῶντος, καὶ ἔκραξεν φωνῇ μεγάλῃ τοῖς τέσσαρσιν ἀγγέλοις οἷς ἐδόθη αὐτοῖς ἀδικῆσαι τὴν γῆν καὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/002.yaml
  text: And I saw another angel coming up from the east[a], having the seal of the living God, and he cried out with a loud voice to the four angels to whom it had been given to harm the earth and the sea,
translation:
  language: ru
  text: 'И увидел я другого ангела, поднимающегося с востока[a]. У него была печать живого Бога, и он громко воззвал к четырём ангелам, которым было дано причинить вред земле и морю:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от восхода солнца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: другого ангела
  rationale: ἄλλον обозначает ещё одного ангела, отличного от четырёх уже упомянутых; «другого ангела» естественно и точно передаёт это значение.
- source_word: ἀναβαίνοντα
  choice: поднимающегося
  rationale: Причастие выражает движение вверх; форма «поднимающегося» сохраняет пространственный образ и подходит для описания видения.
- source_word: ἀπὸ ἀνατολῆς ἡλίου
  choice: с востока
  rationale: Буквально выражение означает «от восхода солнца», но в данном контексте служит указанием направления. Буквальный образ сохранён в сноске.
- source_word: ἔχοντα σφραγῖδα
  choice: у него была печать
  rationale: ἔχοντα означает обладание. Такая русская конструкция естественнее буквального «имеющего», при этом не уточняет, держал ли ангел печать в руке или нёс её иным образом.
- source_word: θεοῦ ζῶντος
  choice: живого Бога
  rationale: Устойчивое и точное библейское выражение, сохраняющее атрибутивную силу причастия ζῶντος.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: громко воззвал
  rationale: κράζω передаёт сильный крик, а φωνῇ μεγάλῃ — громкость голоса. «Громко воззвал» звучит достойно и естественно в контексте торжественного видения.
- source_word: τοῖς τέσσαρσιν ἀγγέλοις
  choice: к четырём ангелам
  rationale: Дательный падеж обозначает адресатов возгласа; в русском языке это естественно передаётся сочетанием «воззвал к».
- source_word: οἷς ἐδόθη αὐτοῖς
  choice: которым было дано
  rationale: Сохранена безличная пассивная конструкция греческого текста без добавления невыраженного слова «власть» и без прямого указания на дающего.
- source_word: ἀδικῆσαι
  choice: причинить вред
  rationale: В данном апокалиптическом контексте глагол обозначает нанесение вреда земле и морю, а не отвлечённую несправедливость.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: земле и морю
  rationale: В космическом контексте Откровения γῆ лучше передать как «земля», в паре с морем.
theological_decisions:
- issue: Характер полномочия в ἐδόθη
  choice: «которым было дано причинить вред»
  alternative: «которым была дана власть причинить вред»; «которым было позволено причинить вред»
  rationale: Греческий пассив указывает на дарованную возможность или полномочие, но прямо не содержит существительного «власть» и не называет дающего. Перевод сохраняет эту недосказанность.
- issue: Направление в выражении ἀπὸ ἀνατολῆς ἡλίου
  choice: «с востока» в основном тексте
  alternative: «от восхода солнца»
  rationale: «С востока» ясно передаёт направительное значение современному читателю, а буквальный зрительный образ остаётся доступен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром, соответствующим апокалиптическому видению. Инверсия «И увидел я» сохраняет торжественный повествовательный ритм. Двоеточие в конце показывает, что обращение ангела продолжается в следующем стихе.
