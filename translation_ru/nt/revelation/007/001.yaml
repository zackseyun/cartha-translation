id: REV.7.1
reference: Revelation 7:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀Μετὰ τοῦτο εἶδον τέσσαρας ἀγγέλους ἑστῶτας ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς, κρατοῦντας τοὺς τέσσαρας ἀνέμους τῆς γῆς, ἵνα μὴ πνέῃ ἄνεμος ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ ⸀πᾶν δένδρον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/001.yaml
  text: After this I saw four angels standing at the four corners of the earth[b][a], holding back the four winds of the earth so that no wind might blow on the earth or on the sea or on any tree.
translation:
  language: ru
  text: После этого я увидел четырёх ангелов, стоящих у четырёх углов земли[a] и удерживающих четыре ветра земли, чтобы ветер не дул ни на землю, ни на море, ни на какое дерево.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Четыре угла земли» — традиционное образное выражение, обозначающее крайние пределы земли или четыре стороны света.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: После этого
  rationale: Естественный для современного русского языка маркер последовательности видений; сохраняет временную связь, не утяжеляя фразу буквальным «после этих вещей».
- source_word: εἶδον
  choice: я увидел
  rationale: Прямо передаёт аорист ὁράω как сообщение о восприятии в видении; добавление «взглянул» греческим текстом не требуется.
- source_word: τέσσαρας ἀγγέλους ἑστῶτας
  choice: четырёх ангелов, стоящих
  rationale: Причастие ἑστῶτας описывает состояние или позу; «стоящих» прозрачнее и менее интерпретативно, чем «поставленных» или «расположившихся».
- source_word: ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς
  choice: у четырёх углов земли
  rationale: Предлог «у» идиоматично обозначает положение при углах; образ «четырёх углов земли» сохранён как традиционная пространственная формула.
- source_word: κρατοῦντας
  choice: удерживающих
  rationale: Контекст последующей цели — чтобы ветер не дул — показывает значение сдерживания, поэтому «удерживающих» естественно выражает функцию κρατέω.
- source_word: τοὺς τέσσαρας ἀνέμους τῆς γῆς
  choice: четыре ветра земли
  rationale: Сохраняет апокалиптический образ ветров четырёх направлений и согласуется с глобальным масштабом сцены.
- source_word: ἵνα μὴ πνέῃ ἄνεμος
  choice: чтобы ветер не дул
  rationale: Передаёт целевое значение ἵνα с сослагательным наклонением; русский родовой единственный «ветер» естественно обозначает полное отсутствие ветра.
- source_word: ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ πᾶν δένδρον
  choice: ни на землю, ни на море, ни на какое дерево
  rationale: Повтор «ни… ни… ни…» ясно сохраняет трёхчастную отрицательную координацию, а «ни на какое дерево» передаёт распределительное πᾶν δένδρον.
theological_decisions:
- issue: Объём значения γῆ в апокалиптическом видении
  choice: «земля» во всём стихе
  alternative: «суша» или «страна»
  rationale: Четыре угла, четыре ветра, земля, море и всякое дерево образуют космическую сцену; «страна» неоправданно сузила бы её. «Суша» возможна в противопоставлении морю, но нарушила бы лексическую связь с выражением «ветры земли».
- issue: Характер выражения «четыре угла земли»
  choice: Образ сохранён буквально с пояснительной сноской
  alternative: «четыре края земли» или «четыре стороны света»
  rationale: Буквальная передача сохраняет образность видения и подлинную древнюю идиому, не превращая её в утверждение о физической форме земли; сноска предупреждает ошибочное прочтение.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и ритма апокалиптического повествования. Синтаксис близок к греческому, но естественен по-русски; причастные обороты удерживают единство длинного предложения.
