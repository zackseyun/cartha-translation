source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ ὄχλος πολύς, ὃν ἀριθμῆσαι ⸀αὐτὸν οὐδεὶς ἐδύνατο, ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν, ⸀ἑστῶτες ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου, περιβεβλημένους στολὰς λευκάς, καὶ ⸀φοίνικες ἐν ταῖς χερσὶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/009.yaml
  text: After these things I looked[a], and behold, a great multitude that no one was able to count, from every nation and tribe and people and language, standing before the throne and before the Lamb, clothed in white robes, with palm branches in their hands.
translation:
  language: ru
  text: 'После этого я увидел — и вот: великое множество людей, которое никто не мог сосчитать, — из всякого народа, племён, народов и языков[a]. Они стояли перед престолом и перед Агнцем, облачённые в белые одежды, с пальмовыми ветвями в руках.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более плавно: «из всякого народа, племени, народа и языка». Основной текст сохраняет переход в греческом оригинале от единственного числа («народа») к множественному («племён, народов и языков»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: После этого
  rationale: Естественно передаёт последовательность видений и при этом сохраняет множественное ταῦτα как совокупность предшествующих событий.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: я увидел — и вот
  rationale: «Увидел» прямо передаёт εἶδον, а «и вот» сохраняет функцию ἰδού как призыва обратить внимание.
- source_word: ὄχλος πολύς
  choice: великое множество людей
  rationale: «Великое множество» соответствует торжественному апокалиптическому регистру; добавление «людей» естественно для русского и ясно выражает смысл ὄχλος.
- source_word: ὃν ἀριθμῆσαι αὐτὸν οὐδεὶς ἐδύνατο
  choice: которого никто не мог сосчитать
  rationale: Передаёт невозможность исчислить множество без тяжеловесного воспроизведения греческого возобновительного местоимения αὐτόν.
- source_word: ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν
  choice: из всякого народа, племён, народностей и языков
  rationale: Сохраняет заметный переход греческого текста от единственного числа ἔθνους к множественному числу остальных категорий. «Народности» помогает отличить λαοί от ἔθνος, не сводя оба слова к одному русскому соответствию.
- source_word: ἑστῶτες
  choice: Они стояли
  rationale: Личная форма устраняет грамматическое рассогласование греческих причастий с собирательным существительным и естественно описывает увиденную группу.
- source_word: ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου
  choice: перед престолом и перед Агнцем
  rationale: Повтор «перед» отражает повтор ἐνώπιον и сохраняет торжественный ритм фразы.
- source_word: περιβεβλημένους στολὰς λευκάς
  choice: облачённые в белые одежды
  rationale: «Облачённые» соответствует περιβεβλημένους и уместно в возвышенном, но понятном регистре; «одежды» не придаёт στολαί излишне специального смысла.
- source_word: φοίνικες ἐν ταῖς χερσὶν αὐτῶν
  choice: с пальмовыми ветвями в руках
  rationale: В данном контексте φοίνικες обозначает пальмовые ветви; конструкция естественно сохраняет образ, не добавляя невыраженного глагола действия.
theological_decisions:
- issue: Передача ἀρνίον как христологического титула
  choice: Агнец
  alternative: ягнёнок
  rationale: В Откровении ἀρνίον функционирует как устойчивый христологический титул. «Агнец» узнаваем, сохраняет богословский вес образа и не превращает титул в неуместное уменьшительное обозначение.
translation_notes:
  register: Современный литературный русский с торжественной интонацией, соответствующей видению. Пунктуация расчленяет длинную греческую конструкцию ради ясности, не меняя последовательности образов.
