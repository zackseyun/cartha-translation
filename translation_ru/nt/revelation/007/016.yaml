base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/016.yaml
  text: They will hunger no more[a], nor thirst anymore; the sun will not strike them, nor any scorching heat.
translation:
  language: ru
  text: Они больше не будут ни голодать, ни жаждать; ни солнце, ни никакой зной никогда не будут палить их[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «не падёт на них»; усиленное греческое отрицание означает, что этого ни в коем случае не случится.'
    reason: Сохраняет буквальный образ πέσῃ и поясняет силу конструкции οὐδὲ μή.
lexical_decisions:
- source_word: πεινάσουσιν
  choice: будут голодать
  rationale: Глагольная форма естественно передаёт будущее действие и сохраняет параллелизм с «будут жаждать».
- source_word: ἔτι
  choice: больше не
  rationale: В сочетании с отрицанием указывает, что голод и жажда прекратятся и уже не возобновятся.
- source_word: διψήσουσιν
  choice: будут жаждать
  rationale: Глагольный перевод соответствует форме греческого текста и параллелен «будут голодать».
- source_word: οὐδὲ μὴ πέσῃ ἐπ’ αὐτούς
  choice: их никогда не будет палить
  rationale: Сочетание οὐδὲ μή с аористом сослагательного наклонения выражает усиленное отрицание будущего; «палить» естественно передаёт воздействие солнца и зноя в данном контексте.
- source_word: ὁ ἥλιος
  choice: солнце
  rationale: Прямое и естественное соответствие.
- source_word: πᾶν καῦμα
  choice: какой бы то ни было зной
  rationale: Оборот передаёт всеохватность πᾶν в отрицательной конструкции, а «зной» — обжигающую жару, обозначенную καῦμα.
theological_decisions:
- issue: Аллюзия на Исаию 49:10 и образ эсхатологического восстановления
  choice: Сохранены конкретные образы голода, жажды, солнца и зноя без их истолкования в самом переводе.
  alternative: Передать голод и жажду прежде всего как метафоры духовной неудовлетворённости.
  rationale: Текст использует предметные образы пророческого обещания; перевод оставляет открытыми их буквальные и богословские оттенки, не сводя их к одному толкованию.
translation_notes:
  register: Современный литературный русский язык; торжественный, но понятный регистр. Перестройка порядка слов объединяет «солнце» и «зной» при общем сказуемом и делает фразу естественной по-русски.
