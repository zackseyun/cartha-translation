id: REV.7.3
reference: Revelation 7:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγων· Μὴ ἀδικήσητε τὴν γῆν μήτε τὴν θάλασσαν μήτε τὰ δένδρα, ⸀ἄχρι σφραγίσωμεν τοὺς δούλους τοῦ θεοῦ ἡμῶν ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/003.yaml
  text: saying[a], “Do not harm the earth or the sea or the trees until we have sealed the servants of our God on their foreheads.”
translation:
  language: ru
  text: 'говоря: «Не причиняйте вреда ни земле, ни морю, ни деревьям, пока мы не поставим печать на лбах рабов[a] нашего Бога».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «слуг». Греческое слово δοῦλος обозначает человека, принадлежащего господину; перевод «рабов» сохраняет здесь оттенок принадлежности.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: говоря
  rationale: Причастие сохранено как связка с предшествующим контекстом; двоеточие естественно вводит прямую речь.
- source_word: ἀδικήσητε
  choice: не причиняйте вреда
  rationale: При неодушевлённых объектах — земле, морю и деревьях — глагол обозначает нанесение ущерба, а не нравственную несправедливость.
- source_word: τὴν γῆν
  choice: земле
  rationale: В ряду с морем и деревьями слово имеет широкий, космический смысл; «земля» уместнее локального «суша».
- source_word: μήτε … μήτε
  choice: ни … ни
  rationale: Русская повторная конструкция естественно передаёт последовательное греческое отрицание.
- source_word: ἄχρι
  choice: пока … не
  rationale: Естественная русская конструкция, обозначающая временной предел запрета.
- source_word: σφραγίσωμεν
  choice: не поставим печать
  rationale: Передаёт действие запечатления и сохраняет явный образ печати; совершенный вид указывает на действие, которое должно быть завершено до снятия запрета.
- source_word: τοὺς δούλους
  choice: рабов
  rationale: «Рабы» сохраняет выраженную в δοῦλος принадлежность господину; более мягкое «слуги» возможно, но ослабляет этот оттенок.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: нашего Бога
  rationale: Прямо сохраняет принадлежность Богу и местоимение первого лица множественного числа.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: на лбах
  rationale: Кратко и естественно обозначает место нанесения печати; принадлежность лбов уже ясна из выражения «рабов нашего Бога».
theological_decisions:
- issue: Передача δοῦλος в контексте принадлежности Богу
  choice: рабы
  alternative: слуги
  rationale: Образ печати подчёркивает принадлежность и верность Богу, поэтому «рабы» точнее сохраняет сильный смысл исходного слова. В сноске отмечен более мягкий контекстуальный вариант без устранения напряжения.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Конструкция «не причиняйте вреда ни…» ясна обычному читателю, а «поставим печать» сохраняет ключевой образ Откровения без архаичного «запечатлеем».
