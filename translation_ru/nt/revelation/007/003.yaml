  source_fidelity: 'Текст точно передаёт греческий оригинал: запрет относится ко всем трём объектам («земле, морю, деревьям»), «пока мы не…» верно выражает временную границу ἄχρι с аористом сослагательного наклонения, а образ нанесения печати на лбы сохранён. Явное αὐτῶν не переведено отдельным словом «их», однако принадлежность лбов однозначно выражена родительным оборотом «лбах рабов нашего Бога»; смысл не утрачен.'
