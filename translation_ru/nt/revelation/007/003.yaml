  terminology: «Рабы нашего Бога» является точной передачей δούλους и сохраняет акцент на принадлежности Богу; сноска корректно даёт «слуг» как более мягкую альтернативу. «Печать» последовательно передаёт σφραγίζω без конфессионального толкования.
