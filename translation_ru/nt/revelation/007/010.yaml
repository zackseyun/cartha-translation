base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/010.yaml
  text: And they cry out with a loud voice[a], saying, “Salvation belongs to our God, who sits on the throne, and to the Lamb!”
translation:
  language: ru
  text: 'И они восклицают громким голосом: «Спасение принадлежит нашему Богу, сидящему на престоле, и Агнцу!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или более буквально: «Спасение нашему Богу, сидящему на престоле, и Агнцу!»'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράζουσι
  choice: восклицают
  rationale: Настоящее время передаёт живое, разворачивающееся действие; «восклицают» сохраняет силу громкого публичного возгласа и звучит естественно в современном литературном русском.
- source_word: φωνῇ μεγάλῃ
  choice: громким голосом
  rationale: Дательный образа действия передан устойчивым русским выражением, сохраняющим образ голоса, а не только степень громкости.
- source_word: λέγοντες
  choice: двоеточие перед прямой речью
  rationale: Причастие вводит содержание возгласа; в русском его естественно передать пунктуационно, не утяжеляя фразу словами «говоря» или «и говоря».
- source_word: Ἡ σωτηρία
  choice: Спасение — у
  rationale: Безглагольная формула с дательными обозначает отнесение спасения к Богу и Агнцу. Русская конструкция «спасение — у» сохраняет лаконизм возгласа и может выражать, что спасение принадлежит им и исходит от них, не сужая смысл до одной трактовки.
- source_word: τῷ θεῷ ἡμῶν
  choice: у нашего Бога
  rationale: Дательный отнесения передан конструкцией «у», связывающей спасение с нашим Богом без добавления отсутствующего в греческом глагола.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: сидящего на престоле
  rationale: Причастный оборот приложен к «нашему Богу»; «престол» сохраняет возвышенный библейский образ и остаётся понятным современному читателю.
- source_word: τῷ ἀρνίῳ
  choice: у Агнца
  rationale: Титул Иисуса передан традиционным «Агнец», сохраняющим жертвенный и мессианский образ Откровения; параллельная конструкция совместно относит спасение к Богу и Агнцу.
theological_decisions:
- issue: Отношение спасения к Богу и Агнцу
  choice: «Спасение — у нашего Бога… и у Агнца!»
  alternative: '«Спасение принадлежит нашему Богу… и Агнцу!»; более буквально: «Спасение нашему Богу… и Агнцу!»'
  rationale: Греческий безглагольный возглас с двумя дательными совместно относит спасение к Богу и Агнцу, но не уточняет глагол. Конструкция «у» сохраняет эту смысловую ёмкость и не вводит узкого догматического пояснения.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным звучанием. Порядок определений сохраняет сценическую ясность; повтор «у» подчёркивает параллель между Богом и Агнцем. Маркер сноски поставлен после всего цитируемого возгласа.
