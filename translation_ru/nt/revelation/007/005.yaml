  text: ἐκ φυλῆς Ἰούδα δώδεκα χιλιάδες ⸀ἐσφραγισμένοι, ἐκ φυλῆς Ῥουβὴν δώδεκα χιλιάδες, ἐκ φυλῆς Γὰδ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/005.yaml
  text: from the tribe of Judah[a], twelve thousand were sealed; from the tribe of Reuben, twelve thousand; from the tribe of Gad, twelve thousand.
translation:
  language: ru
  text: из колена Иуды — двенадцать тысяч запечатлённых; из колена Рувима — двенадцать тысяч; из колена Гада — двенадцать тысяч.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ
  choice: из
  rationale: Предлог обозначает происхождение или принадлежность; «из» естественно сохраняет повторяющуюся формулу перечня.
- source_word: φυλῆς
  choice: колена
  rationale: В контексте родового деления Израиля традиционное и точное русское соответствие — «колено»; «племя» менее точно передаёт устойчивое обозначение двенадцати колен.
- source_word: Ἰούδα
  choice: Иуды
  rationale: Нормативная русская библейская форма имени в родительном падеже после «колена».
- source_word: δώδεκα χιλιάδες
  choice: двенадцать тысяч
  rationale: Прямая передача числительного; добавлять «человек» греческий текст не требует.
- source_word: ἐσφραγισμένοι
  choice: запечатлённых
  rationale: Пассивное причастие передано причастием, согласованным с подразумеваемыми людьми; это сохраняет форму и расположение греческого выражения без превращения его в отдельное личное сказуемое.
- source_word: Ῥουβὴν
  choice: Рувима
  rationale: Нормативная русская библейская форма имени в родительном падеже.
- source_word: Γὰδ
  choice: Гада
  rationale: Нормативная русская библейская форма имени в родительном падеже.
theological_decisions:
- issue: Форма и сфера действия ἐσφραγισμένοι в перечислении колен
  choice: 'Сохранить причастную конструкцию в первом члене: «двенадцать тысяч запечатлённых», а в следующих членах оставить сказуемое подразумеваемым.'
  alternative: «Были запечатлены двенадцать тысяч» в первом члене или повторение «запечатлённых» после каждого названия колена.
  rationale: Греческий текст помещает пассивное причастие после первого числа; оно характеризует исчисляемых и по параллелизму относится ко всему перечню. Причастная передача сохраняет синтаксическую сжатость и не усиливает текст повторениями.
translation_notes:
  register: Современный литературный русский с достоинством библейского перечня. Тире делает эллиптическую структуру ясной, не добавляя отсутствующего в оригинале существительного «человек».
