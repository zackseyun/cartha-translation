id: REV.7.15
reference: Revelation 7:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὰ τοῦτό εἰσιν ἐνώπιον τοῦ θρόνου τοῦ θεοῦ, καὶ λατρεύουσιν αὐτῷ ἡμέρας καὶ νυκτὸς ἐν τῷ ναῷ αὐτοῦ, καὶ ὁ καθήμενος ἐπὶ ⸂τοῦ θρόνου⸃ σκηνώσει ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/015.yaml
  text: For this reason they are before the throne of God[a], and they serve him day and night in his temple, and the one seated on the throne will spread his tent over them.
translation:
  language: ru
  text: Поэтому они находятся перед престолом Бога и служат Ему день и ночь в Его храме, а Сидящий на престоле раскинет над ними Свой шатёр.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет обитать над ними»; или: «укроет их». Греческий глагол связан с образом шатра или скинии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτό
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим объяснением естественно и ясно по-русски.
- source_word: ἐνώπιον
  choice: перед
  rationale: Кратко сохраняет пространственный смысл и значение пребывания в присутствии Бога.
- source_word: λατρεύουσιν
  choice: служат
  rationale: В храмовом контексте выражает священное, богослужебное служение, не сужая его до словесного поклонения.
- source_word: ἡμέρας καὶ νυκτός
  choice: день и ночь
  rationale: Сохраняет ясный образ непрестанного служения.
- source_word: ναῷ
  choice: храме
  rationale: Естественный и общеупотребительный русский эквивалент; контекст указывает на небесное святилище.
- source_word: ὁ καθήμενος ἐπὶ τοῦ θρόνου
  choice: Сидящий на престоле
  rationale: Сохраняет титульный характер причастного оборота и звучит естественно в возвышенном современном русском регистре.
- source_word: σκηνώσει ἐπ’ αὐτούς
  choice: раскинет над ними Свой шатёр
  rationale: Сохраняет образ шатра/скинии и защитного Божьего присутствия, выраженный глаголом σκηνόω и предлогом ἐπί.
theological_decisions:
- issue: Передача образа σκηνώσει как Божьего присутствия и защиты
  choice: раскинет над ними Свой шатёр
  alternative: будет обитать над ними; укроет их
  rationale: Выбранный вариант сохраняет образ скинии и одновременно допускает оттенки пребывания и защиты, не сводя выражение только к одному из них.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Заглавные местоимения «Ему», «Его», «Свой» использованы как принятая русская редакционная форма почтительного обозначения Бога; они не отражают отдельного различия в греческом тексте.
