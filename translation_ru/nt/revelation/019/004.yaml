source:
  edition: SBLGNT
  text: καὶ ἔπεσαν οἱ πρεσβύτεροι οἱ εἴκοσι τέσσαρες καὶ τὰ τέσσαρα ζῷα, καὶ προσεκύνησαν τῷ θεῷ τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ λέγοντες· Ἀμήν, Ἁλληλουϊά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/004.yaml
  text: And the twenty-four elders and the four living creatures fell down and worshiped God[a], the one seated on the throne, saying, “Amen! Hallelujah!”
translation:
  language: ru
  text: 'И двадцать четыре старца и четыре живых существа пали ниц и поклонились Богу, сидящему на престоле, говоря: «Аминь! Аллилуйя![a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Хвалите Господа!» (древнееврейский богослужебный возглас; буквально также возможно: «Хвалите Ях!»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσαν
  choice: пали ниц
  rationale: Аорист πίπτω в контексте поклонения обозначает земной поклон; «пали ниц» естественно передаёт не случайное падение, а благоговейное простирание.
- source_word: πρεσβύτεροι οἱ εἴκοσι τέσσαρες
  choice: двадцать четыре старца
  rationale: «Старцы» — понятное и укоренившееся в русском библейском языке обозначение этих небесных участников видения; «пресвитеры» здесь звучало бы как узкий церковный титул.
- source_word: τὰ τέσσαρα ζῷα
  choice: четыре живых существа
  rationale: Такой перевод сохраняет значение ζῷα и показывает, что речь идёт об особых существах у престола, а не об обычных животных.
- source_word: προσεκύνησαν
  choice: поклонились
  rationale: При объекте «Богу» глагол означает религиозное поклонение; в сочетании с «пали ниц» русский глагол ясно передаёт этот смысл.
- source_word: τῷ θεῷ τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: Богу, сидящему на престоле
  rationale: Причастный оборот непосредственно определяет Бога и сохраняет формулу Откровения о Сидящем на престоле без добавочного истолкования.
- source_word: λέγοντες
  choice: говоря
  rationale: Деепричастие формально сохраняет связь между поклонением и последующим возгласом.
- source_word: Ἀμήν
  choice: Аминь
  rationale: Сохраняется общепринятая русская форма литургического возгласа, а не его объяснительный перевод.
- source_word: Ἁλληλουϊά
  choice: Аллилуйя
  rationale: Сохраняется закрепившаяся в русском языке форма древнееврейского литургического возгласа; его буквальный смысл указан в сноске.
theological_decisions:
- issue: Передача древнееврейского литургического возгласа Ἁλληλουϊά, включённого в греческий текст
  choice: Аллилуйя
  alternative: Хвалите Господа! / Хвалите Ях!
  rationale: Транслитерированная форма сохраняет характер устойчивого богослужебного возгласа и хорошо известна русскому читателю. Значение возгласа сообщается в сноске без навязывания произношения имени Бога в основном тексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Старцы», «пали ниц», «престол», «Аминь» и «Аллилуйя» сохраняют достоинство сцены и остаются понятными широкому читателю. Маркер сноски поставлен непосредственно после слова «Аллилуйя», к которому относится примечание.
