base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/003.yaml
  text: And a second time they said[a], “Hallelujah!” And her smoke goes up forever and ever.
translation:
  language: ru
  text: 'И во второй раз они сказали: «Аллилуйя!» И дым её восходит во веки веков.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в века веков» — греческий оборот, обозначающий нескончаемую длительность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερον
  choice: во второй раз
  rationale: 'Наречное употребление винительного падежа указывает на повторение и сохраняет последовательность: это второе возглашение.'
- source_word: εἴρηκαν
  choice: они сказали
  rationale: Греческая форма перфекта передаёт совершённое речевое действие; в русском повествовании естественно употребить прошедшее время, не добавляя отсутствующей в глаголе эмоциональной окраски.
- source_word: Ἁλληλουϊά
  choice: Аллилуйя
  rationale: Сохранена узнаваемая богослужебная формула, восходящая к еврейскому призыву прославлять Ях.
- source_word: ὁ καπνὸς αὐτῆς
  choice: дым её
  rationale: Местоимение женского рода отсылает к Вавилону, представленному в контексте как женщина и город; такой порядок слов звучит торжественно и сохраняет олицетворение.
- source_word: ἀναβαίνει
  choice: восходит
  rationale: Настоящее время сохраняет живой, продолжающийся образ поднимающегося дыма; «восходит» естественно для возвышенного апокалиптического повествования.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устоявшееся русское соответствие греческой формуле передаёт нескончаемую длительность и сохраняет её торжественное звучание.
theological_decisions:
- issue: Длительность, выраженная εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  alternative: в века веков
  rationale: В контексте окончательного суда формула естественно обозначает нескончаемую длительность. Устоявшийся русский оборот передаёт этот смысл, а более буквальная форма приведена в сноске для прозрачности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, апокалиптическим звучанием. Сохранены краткость стиха, литургическое «Аллилуйя» и женское олицетворение Вавилона.
