  source_fidelity: 'Русский текст точно передаёт все элементы греческого оригинала: повторность («во второй раз»), речевое действие без добавленной экспрессии («сказали»), литургическое «Аллилуйя», женское олицетворение Вавилона («её») и настоящее время образа («дым её восходит»). Формула «во веки веков» адекватно передаёт εἰς τοὺς αἰῶνας τῶν αἰώνων.'
