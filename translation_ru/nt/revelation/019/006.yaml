id: REV.19.6
reference: Revelation 19:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ὡς φωνὴν ὄχλου πολλοῦ καὶ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῶν ἰσχυρῶν, ⸀λεγόντων· Ἁλληλουϊά, ὅτι ἐβασίλευσεν κύριος, ὁ ⸀θεός, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/006.yaml
  text: And I heard what seemed to be the voice of a great multitude[a], and like the voice of many waters, and like the voice of mighty thunders, saying, “Hallelujah! For the Lord God, the Almighty[b], reigns.”
translation:
  language: ru
  text: 'И услышал я словно голос огромного множества людей, словно шум многих вод и словно грохот могучих громов. Они говорили: «Аллилуйя! Ведь воцарился[b] Господь, Бог Вседержитель[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Господь, Бог наш, Вседержитель»; в принятом здесь греческом тексте буквально: «Господь, Бог, Вседержитель».'
    reason: textual_variant
  - marker: b
    text: 'Или: «царствует», «вступил в царствование». Греческий глагол может прославлять решительное проявление Божьего царствования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: услышал я
  rationale: Аорист ἀκούω прямо передаёт событие в последовательности видения; порядок слов сохраняет возвышенный повествовательный тон, оставаясь естественным по-русски.
- source_word: ὡς
  choice: словно
  rationale: Повторяющееся ὡς вводит сравнения, а не отождествляет услышанное буквально с множеством людей, водами или громами.
- source_word: φωνὴν
  choice: голос / шум / грохот
  rationale: 'φωνή может обозначать как голос, так и звук. Контекстуальные русские соответствия сохраняют троекратное сравнение и делают образы естественными: человеческий голос, шум вод и грохот громов.'
- source_word: ὄχλου πολλοῦ
  choice: огромного множества людей
  rationale: Передаёт многочисленность собравшихся и ясно обозначает людей, не снижая возвышенного регистра.
- source_word: ὑδάτων πολλῶν
  choice: многих вод
  rationale: Сохраняет традиционный библейский образ величественного, всепоглощающего звучания без конкретизирующего пересказа.
- source_word: βροντῶν ἰσχυρῶν
  choice: могучих громов
  rationale: ἰσχυρός подчёркивает силу; сочетание сохраняет множественное число греческого текста и апокалиптическую образность.
- source_word: λεγόντων
  choice: Они говорили
  rationale: Множественное число причастия сохранено отдельным предложением; местоимение естественно отсылает к множеству людей, при этом образ совокупного голоса остаётся цельным.
- source_word: Ἁλληλουϊά
  choice: Аллилуйя
  rationale: Устоявшаяся русская передача литургического возгласа, восходящего к еврейскому призыву хвалить Господа.
- source_word: ὅτι
  choice: Ведь
  rationale: В данном возгласе союз вводит основание для хвалы; «ведь» звучит естественно и сохраняет причинную связь.
- source_word: ἐβασίλευσεν
  choice: воцарился
  rationale: Русский совершенный вид передаёт аорист и торжественное провозглашение решительного явления Божьего царствования, не разъясняя его как начало Божьего владычества в абсолютном смысле.
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: Господь, Бог Вседержитель
  rationale: Передаёт три наименования печатного греческого текста без отсутствующего в нём притяжательного «наш»; «Вседержитель» является точным и укоренённым русским соответствием παντοκράτωρ.
theological_decisions:
- issue: Значение аориста ἐβασίλευσεν применительно к Божьему царствованию
  choice: воцарился
  alternative: царствует; вступил в царствование
  rationale: Форма может торжественно отмечать решительное проявление Божьего царствования. Основной текст сохраняет событийную силу аориста, а примечание не позволяет сделать вывод, будто до этого Бог вовсе не владычествовал.
- issue: Чтение божественного титула и наличие притяжательного местоимения
  choice: Господь, Бог Вседержитель
  alternative: Господь, Бог наш, Вседержитель
  rationale: SBLGNT в предоставленном тексте не содержит ἡμῶν («наш»), поэтому основной перевод следует печатному греческому тексту. Значимый рукописный вариант указан в примечании.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным апокалиптическим звучанием. Повтор «словно» сохраняет ритм трёх сравнений; «многие воды» и «могучие громы» удерживают библейскую образность. Оба маркера поставлены непосредственно после выражения, к которому относятся примечания о титуле и глаголе.
