  text: καὶ ἐκ τοῦ στόματος αὐτοῦ ἐκπορεύεται ⸀ῥομφαία ὀξεῖα, ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη, καὶ αὐτὸς ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ· καὶ αὐτὸς πατεῖ τὴν ληνὸν τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς τοῦ θεοῦ τοῦ παντοκράτορος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/015.yaml
  text: And from his mouth comes a sharp sword[a], so that with it he may strike the nations, and he himself will shepherd them with an iron rod[b]; and he himself treads the winepress of the wine of the fury of the wrath of God the Almighty.
translation:
  language: ru
  text: Из Его уст выходит острый меч, чтобы им поражать народы; и Он Сам будет пасти их железным жезлом[a]; и Он Сам топчет давильню вина ярости гнева Бога Вседержителя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет править ими железным жезлом». Греческий глагол буквально означает «пасти»; здесь он перекликается с Псалмом 2 и одновременно передаёт образ царского правления.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύεται
  choice: выходит
  rationale: Настоящее время сохраняет живую картину; «выходит» естественно передаёт движение меча из уст.
- source_word: ῥομφαία ὀξεῖα
  choice: острый меч
  rationale: «Меч» ясно и без излишней конкретизации передаёт крупное клинковое оружие; определение «острый» воспроизводит ὀξεῖα.
- source_word: ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη
  choice: чтобы им поражать народы
  rationale: «Чтобы» передаёт целевое значение ἵνα, «им» — инструментальное ἐν αὐτῇ, а «поражать» сохраняет судебно-враждебную силу πατάσσω, не добавляя явно не выраженного результата «сразить».
- source_word: ποιμανεῖ
  choice: будет пасти
  rationale: Сохраняется буквальная пастырская метафора глагола, которая в аллюзии на Псалом 2 одновременно выражает царское правление.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: железным жезлом
  rationale: Творительный падеж естественно передаёт инструментальное ἐν; «жезл» сохраняет царский и библейский оттенок образа.
- source_word: πατεῖ τὴν ληνὸν
  choice: топчет давильню
  rationale: Настоящее время и глагол «топчет» сохраняют яркость пророческого образа; «давильня» обозначает место выжимания винограда.
- source_word: τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς
  choice: с вином ярости гнева
  rationale: Сочетание сохраняет оба близких, но различных слова θυμός и ὀργή и их нарастающую интенсивность, не сводя их к одному понятию.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: Бога Вседержителя
  rationale: «Вседержитель» — ясный и укоренённый русский эквивалент божественного титула παντοκράτωρ.
theological_decisions:
- issue: ποιμανεῖ в аллюзии на Псалом 2 и в контексте суда
  choice: будет пасти их железным жезлом
  alternative: будет править ими железным жезлом
  rationale: Основной текст сохраняет пастырскую метафору греческого глагола и заключённое в ней напряжение между попечением, царской властью и судом; значение «править» отмечено в сноске.
- issue: Сочетание θυμοῦ τῆς ὀργῆς
  choice: ярости гнева
  alternative: лютого гнева
  rationale: Передача двумя существительными сохраняет двойное усиление исходного текста, тогда как вариант с прилагательным сглаживает его структуру.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической речи. Синтаксис слегка упрощён для ясности, но повтор αὐτός передан как «Он Сам» в обеих фразах. Пастырская метафора и накопление слов, обозначающих Божий гнев, сохранены.
