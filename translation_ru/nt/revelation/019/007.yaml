source:
  edition: SBLGNT
  text: χαίρωμεν καὶ ⸀ἀγαλλιῶμεν, καὶ ⸀δώσομεν τὴν δόξαν αὐτῷ, ὅτι ἦλθεν ὁ γάμος τοῦ ἀρνίου, καὶ ἡ γυνὴ αὐτοῦ ἡτοίμασεν ἑαυτήν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/007.yaml
  text: Let us rejoice and exult[a], and let us give glory to him, because the marriage of the Lamb has come[b], and his bride has made herself ready.
translation:
  language: ru
  text: Будем радоваться и ликовать и воздадим Ему славу[b], потому что настала свадьба Агнца и Его невеста[a] приготовилась.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его жена». Греческое слово γυνή может означать «женщина», «жена» или, в контексте свадьбы, «невеста».'
    reason: lexical_alternative
  - marker: b
    text: 'Или, как утверждение о будущем: «и мы воздадим Ему славу». В греческом здесь стоит форма будущего времени, которая в этой последовательности, вероятно, имеет побудительный смысл.'
    reason: alternative_reading
lexical_decisions:
- source_word: χαίρωμεν
  choice: будем радоваться
  rationale: Форма первого лица множественного числа имеет побудительное значение; русское «будем радоваться» естественно передаёт совместный призыв.
- source_word: ἀγαλλιῶμεν
  choice: ликовать
  rationale: Сохраняет усиленный оттенок бурной радости и не сливает значение с предшествующим χαίρωμεν.
- source_word: δώσομεν τὴν δόξαν αὐτῷ
  choice: воздадим Ему славу
  rationale: Греческая форма является будущим временем, но в последовательности побудительных форм естественно звучит как призыв. Русское «воздадим» сохраняет и форму будущего времени, и возможную побудительную силу.
- source_word: δόξαν
  choice: славу
  rationale: Обычное и содержательно точное соответствие δόξα в контексте прославления.
- source_word: ἦλθεν
  choice: настал
  rationale: Передаёт наступление события как уже свершившийся факт с актуальным значением; по-русски естественнее буквального «пришёл» применительно к браку.
- source_word: γάμος
  choice: брак
  rationale: Сохраняет значение брачного союза и не добавляет значения пира, которое прямо выражено далее, в Откр 19:9.
- source_word: ἀρνίου
  choice: Агнца
  rationale: Устоявшаяся русская передача христологического титула в Откровении.
- source_word: γυνὴ αὐτοῦ
  choice: Его невеста
  rationale: В контексте наступающего брака «невеста» наиболее естественно передаёт брачный образ; лексически возможно также «жена».
- source_word: ἡτοίμασεν ἑαυτήν
  choice: приготовила себя
  rationale: Сохраняет возвратность греческого выражения и ответственность самой невесты за приготовление, не уточняя, в чём оно состояло.
theological_decisions:
- issue: Передача γυνὴ αὐτοῦ в эсхатологическом брачном образе
  choice: Его невеста
  alternative: Его жена
  rationale: «Невеста» соответствует сцене наступающего брака и подчёркивает приготовление к нему, однако греческое γυνή допускает и значение «жена», поэтому вариант отмечен в сноске.
- issue: Смысл δώσομεν в последовательности призывов
  choice: воздадим Ему славу — как совместный призыв
  alternative: мы воздадим Ему славу — как утверждение о будущем
  rationale: Будущее изъявительное δώσομεν стоит после двух побудительных форм и, вероятно, продолжает призыв к прославлению; при этом его формальное значение будущего времени не следует скрывать.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным звучанием. Парные глаголы «радоваться и ликовать» сохраняют нарастание выражения. Заглавные буквы в «Ему», «Его» и «Агнец» следуют принятому русскому библейскому оформлению. Маркеры сносок размещены непосредственно при соответствующих выражениях; их порядок в тексте определяется местом спорных слов.
