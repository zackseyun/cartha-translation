  text: οἱ δὲ ὀφθαλμοὶ ⸀αὐτοῦ φλὸξ πυρός, καὶ ἐπὶ τὴν κεφαλὴν αὐτοῦ διαδήματα πολλά, ⸀ἔχων ὄνομα γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/012.yaml
  text: His eyes were a flame of fire, and on his head were many crowns, and he had a name written that no one knows except himself.
translation:
  language: ru
  text: Его глаза — пламя огня, на голове у Него — много царских венцов[a], и у Него есть написанное имя, которого не знает никто, кроме Него Самого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «много диадем». Диадемы — царские венцы.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ὀφθαλμοὶ αὐτοῦ
  choice: Его глаза
  rationale: Естественная русская передача конструкции с притяжательным родительным; δέ здесь служит мягкой связкой в продолжающемся описании и не требует отдельного перевода.
- source_word: φλὸξ πυρός
  choice: пламя огня
  rationale: Сохраняет именную метафору греческого текста без добавления сравнительного «как» и поддерживает образную связь с другими апокалиптическими описаниями.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: на голове у Него
  rationale: Прямая и естественная передача пространственного значения ἐπί в данном контексте.
- source_word: διαδήματα πολλά
  choice: множество царских венцов
  rationale: διάδημα обозначает именно знак царской власти. «Царские венцы» понятно современному читателю и точнее простого «венцы»; буквальный термин указан в сноске.
- source_word: ἔχων ὄνομα γεγραμμένον
  choice: На Нём написано имя
  rationale: Передаёт наличие у всадника написанного имени и результативный смысл γεγραμμένον, не уточняя место надписи сверх того, что допускает контекст.
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός
  choice: которого не знает никто, кроме Него Самого
  rationale: Сохраняет настоящее значение οἶδεν, исключительность знания и эмфатическое αὐτός; формулировка естественна по-русски.
theological_decisions:
- issue: К кому относится исключительное знание имени
  choice: Имя знает только Сам всадник.
  alternative: Фразу можно понимать прежде всего как указание на непостижимость имени, не делая акцента на самопознании всадника.
  rationale: 'Греческий текст прямо говорит: «никто не знает, кроме него самого». Перевод сохраняет это исключительное утверждение, не расширяя его богословского смысла.'
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Именная метафора «глаза — пламя огня» сохранена без добавленного сравнения; прописные местоимения использованы в соответствии с традиционным русским библейским регистром.
