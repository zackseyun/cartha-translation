  source_fidelity: 'Вторая часть черновика («На Нём написано имя») вводит не выраженное в греческом указание на место надписи — как будто имя написано на самом Всаднике. ἔχων ὄνομα γεγραμμένον означает, что у Него есть/Он имеет написанное имя. Остальные образы переданы точно: именная метафора «глаза — пламя огня», множественность διαδήματα и исключительное «никто, кроме Него Самого».'
  naturalness: «Его глаза — пламя огня» и «на голове у Него» естественны для современного литературного библейского регистра. «У Него есть написанное имя» ясно передаёт обладание именем, не создавая ложного пространственного смысла.
  terminology: «Царские венцы» удачно передаёт царское значение διαδήματα; сноска сохраняет термин «диадемы». Формулировку сноски следует сделать нейтральнее и точнее, не сводя диадемы к головным повязкам и не добавляя характеристику «верховной» власти, которой в данном слове нет.
