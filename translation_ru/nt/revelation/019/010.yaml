  source_fidelity: 'Смысл исходного текста в целом передан точно: сохранены падение перед ногами, запрет поклонения ангелу, общий подчинённый статус ангела с Иоанном и его братьями, а также неоднозначность родительного падежа в «свидетельстве Иисуса». Перевод «раб» для σύνδουλος оправдан контекстом. Однако исходная русская конструкция «как ты и твои братья, имеющие...» синтаксически неудачна: деепричастно-причастное определение после сочинённой группы может восприниматься как характеристика всей группы либо создаёт шероховатую связь. Разделение сравнительных членов точнее воспроизводит греческое разграничение «тебе и твоим братьям, имеющим...»'
  naturalness: Текст выдержан в современном литературном, сдержанно библейском регистре. Требуется небольшая синтаксическая правка в реплике ангела, чтобы фраза читалась без двусмысленной привязки определения и без нарушения плавности.
  terminology: «Поклониться», «раб», «свидетельство Иисуса» и «дух пророчества» уместны и согласуются с исходным текстом и английским аудит-трейлом. Сноска к «свидетельству Иисуса» надлежащим образом сохраняет субъектно-объектную неоднозначность; сноска о «братьях» не навязывает интерпретацию.
