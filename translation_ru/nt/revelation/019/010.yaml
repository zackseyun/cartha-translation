id: REV.19.10
reference: Revelation 19:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ προσκυνῆσαι αὐτῷ. καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ· τῷ θεῷ προσκύνησον· ἡ γὰρ ⸀μαρτυρία Ἰησοῦ ἐστιν τὸ πνεῦμα τῆς προφητείας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/010.yaml
  text: And I fell before his feet to worship him[a]. But he says to me, “See that you do not! I am a fellow servant with you and with your brothers who hold the testimony of Jesus. Worship God[c][b], for the testimony of Jesus is the spirit of prophecy.”
translation:
  language: ru
  text: 'И я пал перед его ногами, чтобы поклониться ему. Но он говорит мне: «Не делай этого! Я — такой же раб, как ты[c], и как твои братья[b], у которых есть свидетельство Иисуса[a]. Богу поклонись! Ведь свидетельство Иисуса — дух пророчества».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «свидетельство Иисуса» может означать как «свидетельство об Иисусе», так и «свидетельство самого Иисуса». Та же неоднозначность сохраняется и в конце стиха.
    reason: alternative_reading
  - marker: b
    text: 'Или: «братья и сёстры»; слово «братья» может здесь представительно обозначать всех верующих.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «Я сораб твой», то есть раб вместе с тобой. Возможный перевод: «Я такой же служитель, как ты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ
  choice: я пал перед его ногами
  rationale: Передаёт и телесное движение, и значение ἔμπροσθεν («перед»), не сводя выражение к менее точному «к его ногам».
- source_word: προσκυνῆσαι αὐτῷ / τῷ θεῷ προσκύνησον
  choice: чтобы поклониться ему / Богу поклонись
  rationale: В контексте ангел отвергает направленное к нему религиозное почитание и обращает его к Богу; «поклониться» сохраняет как телесный, так и культовый смысл глагола.
- source_word: Ὅρα μή
  choice: Не делай этого!
  rationale: Краткий и резкий запрет естественно передаёт силу греческой идиомы; буквальное «смотри, не…» в современном русском здесь звучало бы менее ясно.
- source_word: σύνδουλός
  choice: такой же раб, как ты
  rationale: Передаёт совместный рабский статус и общую подчинённость Богу, на которой строится отказ ангела принять поклонение.
- source_word: ἀδελφῶν σου
  choice: твои братья
  rationale: Сохраняет мужское множественное число исходного текста; возможное представительное употребление отмечено в сноске.
- source_word: τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: имеющие свидетельство Иисуса
  rationale: «Имеющие» прямо передаёт ἐχόντων, а «свидетельство Иисуса» не устраняет неоднозначность греческого родительного падежа.
- source_word: μαρτυρία Ἰησοῦ
  choice: свидетельство Иисуса
  rationale: Русская конструкция, как и греческая, допускает понимание и как свидетельства об Иисусе, и как свидетельства, исходящего от Иисуса.
- source_word: πνεῦμα τῆς προφητείας
  choice: дух пророчества
  rationale: Формальная передача сохраняет богословски насыщенное слово πνεῦμα и не сводит его без достаточных оснований к «сути» или «сущности» пророчества.
theological_decisions:
- issue: Значение родительного падежа в выражении μαρτυρία Ἰησοῦ
  choice: В основном тексте сохранено неоднозначное «свидетельство Иисуса» в обоих случаях.
  alternative: «свидетельство об Иисусе» или «свидетельство самого Иисуса»
  rationale: Греческий родительный падеж допускает как объектное, так и субъектное понимание; контекст не вынуждает однозначно выбрать одно из них.
- issue: Передача σύνδουλος
  choice: такой же раб, как ты
  alternative: «служитель вместе с тобой» или «соработник»
  rationale: Ангел подчёркивает не просто совместное служение, а общий подчинённый статус перед Богом, поэтому значение рабской зависимости здесь существенно.
- issue: К кому относятся «братья»
  choice: Сохранено «твои братья».
  alternative: «твои братья и сёстры» или «единоверцы»
  rationale: Мужское множественное число соответствует форме исходного текста, но в данном контексте оно может представительно охватывать всех верующих; это пояснено в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Настоящее время «говорит» сохранено как повествовательное настоящее оригинала. Инверсия «Богу поклонись!» передаёт вынесение τῷ θεῷ в начало повеления и подчёркивает единственно надлежащий объект поклонения.
