  to: 'И я пал перед его ногами, чтобы поклониться ему. Но он говорит мне: «Не делай этого! Я — такой же раб, как ты[c], и как твои братья[b], у которых есть свидетельство Иисуса[a]. Богу поклонись! Ведь свидетельство Иисуса — дух пророчества».'
