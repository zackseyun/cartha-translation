id: REV.19.1
reference: Revelation 19:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἤκουσα ὡς φωνὴν μεγάλην ὄχλου πολλοῦ ἐν τῷ οὐρανῷ λεγόντων· Ἁλληλουϊά· ἡ σωτηρία καὶ ἡ ⸂δόξα καὶ ἡ δύναμις⸃ τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/001.yaml
  text: After these things I heard what seemed to be the loud voice of a great multitude in heaven[a], saying, “Hallelujah! Salvation and glory and power belong to our God,”
translation:
  language: ru
  text: 'После этого я услышал словно громкий голос великого множества на небе, говорившего: «Аллилуйя![a] Спасение, слава и сила принадлежат нашему Богу!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть «Хвалите Ях» или «Хвалите Господа».
    reason: Лексическое пояснение еврейского богослужебного возгласа, переданного в греческом тексте транслитерацией.
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: После этого
  rationale: Естественная русская формула последовательности видений; множественное ταῦτα по-русски идиоматично передаётся собирательным «это».
- source_word: ἤκουσα
  choice: я услышал
  rationale: Прямая передача аориста ἀκούω в повествовательной последовательности.
- source_word: ὡς
  choice: словно
  rationale: Сохраняет оттенок уподобления или слухового впечатления, не отождествляя звук безоговорочно с голосом множества.
- source_word: φωνὴν μεγάλην
  choice: громкий голос
  rationale: В сочетании с φωνή прилагательное μέγας обозначает прежде всего силу звучания; «громкий» естественно по-русски.
- source_word: ὄχλου πολλοῦ
  choice: великого множества
  rationale: Передаёт многочисленность небесного собрания и сохраняет возвышенный, но понятный регистр.
- source_word: ἐν τῷ οὐρανῷ
  choice: на небе
  rationale: Здесь οὐρανός обозначает небесную сферу; нормативная русская формула — «на небе».
- source_word: λεγόντων
  choice: говорившего
  rationale: Причастие согласовано по смыслу с собирательным существительным «множество» и вводит содержание возгласа.
- source_word: Ἁλληλουϊά
  choice: Аллилуйя
  rationale: Устоявшаяся русская транслитерация еврейского богослужебного возгласа сохраняет его узнаваемость и межтекстовую связь.
- source_word: ἡ σωτηρία
  choice: Спасение
  rationale: Стандартная передача σωτηρία в славословии; отсутствие артикля в русском звучит естественно.
- source_word: ἡ δόξα
  choice: слава
  rationale: Обычный и контекстуально точный эквивалент δόξα в богослужебном славословии.
- source_word: ἡ δύναμις
  choice: сила
  rationale: Естественный широкий эквивалент δύναμις, обозначающий Божью мощь.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: принадлежат нашему Богу
  rationale: Явно и естественно выражает притяжательное значение греческого родительного падежа.
theological_decisions:
- issue: Передача небесного возгласа Ἁλληλουϊά
  choice: Аллилуйя
  alternative: Хвалите Ях; хвалите Господа
  rationale: Транслитерация сохраняет древний богослужебный возглас, вошедший в русский христианский язык, а его буквальный смысл дан в сноске без навязывания реконструированного произношения имени.
- issue: Характер выражения ὡς φωνὴν
  choice: словно громкий голос
  alternative: громкий голос
  rationale: Слово ὡς сохраняет апокалиптическую осторожность описания и оттенок воспринимаемого подобия, не устраняя возможное напряжение между сравнением и идентификацией.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом славословия. Синтаксис остаётся доступным; «Аллилуйя» сохранено в традиционной русской форме, а значение пояснено сноской.
