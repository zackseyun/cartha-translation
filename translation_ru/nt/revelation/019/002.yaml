id: REV.19.2
reference: Revelation 19:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ· ὅτι ἔκρινεν τὴν πόρνην τὴν μεγάλην ἥτις ⸀ἔφθειρεν τὴν γῆν ἐν τῇ πορνείᾳ αὐτῆς, καὶ ἐξεδίκησεν τὸ αἷμα τῶν δούλων αὐτοῦ ἐκ χειρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/002.yaml
  text: because his judgments are true and just; because he judged the great prostitute who corrupted the earth with her sexual immorality[a], and he avenged the blood of his servants from her hand.
translation:
  language: ru
  text: потому что истинны и справедливы Его суды; потому что Он осудил великую блудницу, которая растлевала землю своим блудом[a], и взыскал с неё за кровь Своих рабов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «развратом». Здесь «блуд» может также образно указывать на идолопоклонство и неверность Богу.'
    reason: Слово πορνεία имеет буквальное половое значение, но в образном языке Откровения также несёт смысл религиозной неверности.
lexical_decisions:
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: истинны и справедливы
  rationale: 'Сохраняет два отдельных качества Божьих судов: их соответствие истине и их нравственно-судебную справедливость.'
- source_word: αἱ κρίσεις αὐτοῦ
  choice: Его суды
  rationale: «Суды» естественно передаёт как судебные решения, так и совершаемые Богом акты суда в эсхатологическом контексте.
- source_word: ἔκρινεν
  choice: осудил
  rationale: Хотя κρίνω шире по значению, контекст уже совершённой кары великой блудницы ясно указывает на обвинительный приговор; русское «осудил» звучит естественно и точно в данном контексте.
- source_word: τὴν πόρνην τὴν μεγάλην
  choice: великую блудницу
  rationale: «Блудница» — прямое, литературное и понятное соответствие πόρνη, сохраняющее силу апокалиптического образа.
- source_word: ἔφθειρεν
  choice: растлевала
  rationale: Глагол может обозначать разрушение или нравственное разложение; сочетание с πορνεία здесь поддерживает значение развращающего, растлевающего воздействия. Несовершенный вид передаёт продолжительный характер действия.
- source_word: τὴν γῆν
  choice: землю
  rationale: В космическом контексте Откровения γῆ естественно означает землю, а не отдельную страну.
- source_word: ἐν τῇ πορνείᾳ αὐτῆς
  choice: своим блудом
  rationale: Сохраняет словесную связь между πόρνη и πορνεία и не устраняет намеренную двойственность между буквальной половой распущенностью и символической неверностью Богу.
- source_word: ἐξεδίκησεν τὸ αἷμα
  choice: взыскал … за кровь
  rationale: Русская судебно-библейская конструкция передаёт совершение справедливого возмездия за пролитую кровь, не сводя глагол к личной мстительности.
- source_word: τῶν δούλων αὐτοῦ
  choice: Своих рабов
  rationale: «Рабов» прямо передаёт δοῦλοι и сохраняет выраженную принадлежность этих людей Богу; в русском библейском регистре слово не требует искусственного смягчения до «слуг».
- source_word: ἐκ χειρὸς αὐτῆς
  choice: с неё
  rationale: Передаёт виновную сторону и источник взыскания естественной русской конструкцией «взыскать с кого-либо», не калькируя неестественное здесь «из её руки».
theological_decisions:
- issue: Значение πορνεία в образе великой блудницы
  choice: блуд
  alternative: разврат; проституция; духовная неверность
  rationale: «Блуд» сохраняет как половое значение, так и метафорический смысл идолопоклоннической неверности, не принуждая читателя выбрать лишь один уровень образа.
- issue: Передача δοῦλοι применительно к принадлежащим Богу людям
  choice: рабы
  alternative: слуги
  rationale: Греческое δοῦλος обозначает человека, принадлежащего господину. «Рабы» сохраняет эту более сильную идею принадлежности, тогда как «слуги» могло бы неоправданно её ослабить.
- issue: Характер воздаяния в ἐξεδίκησεν
  choice: взыскал с неё за кровь
  alternative: отомстил ей за кровь
  rationale: Выбранная формулировка сохраняет смысл возмездия, но подчёркивает контекст справедливого Божьего суда, не представляя действие как частную эмоциональную месть.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Повтор «потому что» сохранён по греческому ὅτι … ὅτι и связывает стих с предшествующим возгласом хвалы. Сочетание «блудница … блудом» намеренно сохраняет греческую лексическую связь πόρνη … πορνεία.
