  source_fidelity: Текст точно передаёт греческий оригинал. «Истинны и справедливы Его суды» сохраняет предикативную конструкцию и судебный смысл κρίσεις. «Осудил» несколько конкретизирует κρίνω, однако в непосредственном контексте совершённого суда над великой блудницей это оправданная и естественная русская передача. «Растлевала землю своим блудом» хорошо передаёт продолженное ἔφθειρεν и намеренную связь πόρνη—πορνεία. «Взыскал с неё за кровь Своих рабов» точно воспроизводит воздаяние за кровь и агентное ἐκ χειρὸς αὐτῆς без неестественной кальки.
  naturalness: Современный литературный русский сохранён; фраза звучит торжественно, но не архаично. Повтор «потому что» уместно отражает два ὅτι и связь с предшествующей хвалой. «Блудница», «блуд» и «рабы» соответствуют возвышенно-библейскому регистру и остаются понятными современному читателю.
  terminology: «Блудница» и «блуд» сохраняют образный и лексический параллелизм оригинала, не сводя πορνεία только к одному буквальному или символическому значению. «Рабы» — прямое и уместное соответствие δούλοι; оно сохраняет смысл принадлежности Богу. Сноска корректно поясняет возможный образный аспект, не навязывая конфессионального толкования.
