  source_fidelity: '«Небесные воинства» естественно по-русски, но несколько ослабляет явно локативное τὰ ἐν τῷ οὐρανῷ («те, что на небе») и может подразумевать небесную природу или принадлежность. Безопаснее вынести локативное значение в основной текст. Остальные элементы переданы верно: имперфект выражен несовершенным видом, ἐφ’ ἵπποις — «на ... конях», а βύσσινον λευκὸν καθαρόν — «белый и чистый виссон».'
  naturalness: «Воинства, находившиеся на небе» — современная литературная и достаточно возвышенная формулировка для апокалиптического контекста. «Облачённые» стилистически более уместно, чем нейтральное «одетые», и хорошо передаёт ἐνδεδυμένοι.
  terminology: «Воинства» точно передаёт στρατεύματα и не определяет состав этих сил. «Виссон» является устоявшимся библейским термином для βύσσινον; «белый и чистый» сохраняет оба определения без богословского расширения.
