  to: И воинства, находившиеся на небе[a], следовали за Ним на белых конях, облачённые в белый и чистый виссон.
  rationale: Основной текст исправлен так, чтобы прямо выразить локативное значение греческой конструкции и не приписывать воинствам небесную природу или определённый состав. Остальная образность и грамматический аспект сохранены; замена «одетые» на «облачённые» улучшает регистр без изменения смысла.
