    rationale: Прилагательное может обозначать не только местонахождение, но и происхождение, принадлежность либо природу воинств. Греческий текст говорит о воинствах, находящихся на небе, не определяя их идентичность.
  - severity: low
    issue: «Одетые» несколько снижает возвышенный регистр видения.
    rationale: Это не ошибка смысла, но «облачённые» естественно передаёт состояние, обозначенное ἐνδεδυμένοι, и лучше соответствует русскому библейскому стилю.
  revised_text: И воинства, находившиеся на небе[a], следовали за Ним на белых конях, облачённые в белый и чистый виссон.
