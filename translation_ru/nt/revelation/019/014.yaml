source:
  edition: SBLGNT
  text: καὶ τὰ στρατεύματα ⸀τὰ ἐν τῷ οὐρανῷ ἠκολούθει αὐτῷ ἐφ’ ἵπποις λευκοῖς, ἐνδεδυμένοι βύσσινον λευκὸν καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/014.yaml
  text: And the armies in heaven were following him on white horses[a], clothed in fine linen, white and clean.
translation:
  language: ru
  text: И воинства, находившиеся на небе[a], следовали за Ним на белых конях, облачённые в белый и чистый виссон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «небесные воинства». Буквально: «воинства, те, что на небе».'
    reason: Указывает на локативный характер греческого определения и сохраняет естественный русский вариант без уточнения состава воинств.
lexical_decisions:
- source_word: στρατεύματα
  choice: воинства
  rationale: Слово обозначает организованные военные силы; «воинства» сохраняет множественное число и уместно в возвышенном апокалиптическом контексте.
- source_word: τὰ ἐν τῷ οὐρανῷ
  choice: небесные
  rationale: Естественная русская передача определительной конструкции с локативным значением; буквально речь идёт о воинствах, находящихся на небе.
- source_word: ἠκολούθει αὐτῷ
  choice: следовали за Ним
  rationale: Имперфект изображает продолжающееся действие в разворачивающемся видении; русская форма несовершенного вида сохраняет этот оттенок.
- source_word: ἐφ’ ἵπποις λευκοῖς
  choice: на белых конях
  rationale: Прямая и естественная передача образа всадников и символического белого цвета.
- source_word: ἐνδεδυμένοι
  choice: одетые
  rationale: Причастие описывает состояние участников воинств и естественно согласуется по смыслу с подразумеваемыми лицами.
- source_word: βύσσινον
  choice: виссон
  rationale: Традиционный и точный русский термин для дорогой тонкой льняной ткани, повторяющийся в образной системе Откровения.
- source_word: λευκὸν καθαρόν
  choice: белый, чистый
  rationale: Оба прилагательных непосредственно характеризуют виссон; запятая сохраняет два параллельных качества без усилительного или причинного истолкования.
theological_decisions:
- issue: Кто входит в небесные воинства
  choice: Не уточнять их состав и передать их описательно как «небесные воинства».
  alternative: Назвать их ангелами, прославленными святыми или теми и другими.
  rationale: Стих сообщает их местонахождение и внешний вид, но прямо не определяет их состав; перевод не должен устранять эту неоднозначность.
- issue: Значение καθαρόν
  choice: Передать как «чистый».
  alternative: «непорочный» или «святой»
  rationale: «Чистый» сохраняет как зрительный, так и символический потенциал слова, не превращая образ в прямое догматическое утверждение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным регистром, соответствующим апокалиптическому видению. «Виссон» сохраняет библейскую образность; местоимение «Ним» написано с прописной буквы по устойчивой русской библейской традиции.
