  text: καὶ ἐδόθη αὐτῇ ἵνα περιβάληται βύσσινον ⸀λαμπρὸν καθαρόν, τὸ γὰρ βύσσινον τὰ δικαιώματα τῶν ἁγίων ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/008.yaml
  text: And it was given to her to clothe herself with fine linen[a], bright and clean, for the fine linen is the righteous deeds of the saints.
translation:
  language: ru
  text: И ей было дано облечься в тонкий лён — сияющий и чистый, ибо тонкий лён — это праведные дела[a] святых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праведные поступки». В других контекстах греческое слово может также означать «праведные требования» или «установления», но здесь естественнее всего понимать его как праведные дела святых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῇ
  choice: дано было ей
  rationale: Безличная пассивная конструкция сохраняет не названного прямо деятеля и не добавляет в текст явного указания на Бога как подателя.
- source_word: ἵνα περιβάληται
  choice: облечься
  rationale: 'Возвратная форма передаёт средний залог и значение цели или результата: ей дано самой облечься.'
- source_word: βύσσινον
  choice: тонкий лён
  rationale: Передаёт дорогую тонкую льняную ткань понятным современному читателю выражением; традиционное «виссон» менее прозрачно.
- source_word: λαμπρὸν καθαρόν
  choice: сияющий и чистый
  rationale: «Сияющий» сохраняет зрительный образ блеска, а «чистый» описывает ткань, не подменяя образ отвлечённой нравственной характеристикой.
- source_word: τὸ γὰρ βύσσινον
  choice: потому что тонкий лён
  rationale: Союз вводит объяснение символа; повтор существительного сохраняет явный повтор греческого текста.
- source_word: τὰ δικαιώματα
  choice: праведные дела
  rationale: Во множественном числе и в данном символическом контексте слово естественнее всего обозначает праведные поступки святых, хотя его семантический диапазон шире.
- source_word: τῶν ἁγίων
  choice: святых
  rationale: Обычное новозаветное обозначение принадлежащего Богу святого народа, краткое и укоренённое в русском библейском языке.
theological_decisions:
- issue: Значение δικαιώματα в образе одежды невесты
  choice: Тонкий лён символизирует праведные дела святых.
  alternative: Праведные установления или требования, относящиеся к святым; либо их оправдание или праведный статус.
  rationale: Контекст и форма множественного числа прежде всего указывают на дела или поступки. При этом первая часть стиха говорит, что одежда ей дана, поэтому перевод сохраняет напряжение между даром и праведной жизнью святых, не устраняя ни одной стороны.
- issue: Кто совершает действие в ἐδόθη
  choice: 'Податель прямо не назван: «дано было ей».'
  alternative: «Бог дал ей».
  rationale: Божественное действие весьма вероятно по контексту, однако в греческом тексте субъект не выражен; перевод не делает подразумеваемое явным.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Облечься» сохраняет достоинство и возвратность исходной формы; понятное «тонкий лён» предпочтено малознакомому современному читателю слову «виссон».
