lexical_decisions:
- source_word: ἕνα ἄγγελον
  choice: одного ангела
  rationale: Сохраняется явно выраженное числительное ἕνα и конкретность видения; более гладкое «ангела» скрыло бы эту особенность греческого текста.
- source_word: ἑστῶτα ἐν τῷ ἡλίῳ
  choice: стоящего в солнце
  rationale: Буквально передаёт ἐν τῷ ἡλίῳ и сохраняет намеренно необычный апокалиптический образ, не заменяя его толкованием «перед солнцем».
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: воззвал громким голосом
  rationale: «Воззвал» передаёт силу κράζω в достойном литературном регистре, а «громким голосом» естественно отражает φωνῇ μεγάλῃ.
- source_word: πᾶσι τοῖς ὀρνέοις
  choice: ко всем птицам
  rationale: ὄρνεον обозначает птицу вообще; значение «хищные птицы» следует из контекста, но не выражено самим существительным.
- source_word: τοῖς πετομένοις ἐν μεσουρανήματι
  choice: летящим посреди неба
  rationale: Так естественно по-русски передаётся μεσουράνημα — средняя, высокая область неба; особый апокалиптический оттенок термина поясняется в сноске.
- source_word: Δεῦτε
  choice: Летите сюда
  rationale: В обращении к птицам контекстуально естественное «летите сюда» передаёт побуждение приблизиться; пространственная направленность соответствует Δεῦτε.
- source_word: συνάχθητε
  choice: соберитесь
  rationale: Форма передана естественным русским возвратным повелительным глаголом без излишне буквального пассива.
- source_word: εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ
  choice: на великий пир Божий
  rationale: «Пир» естественно обозначает торжественную большую трапезу и сохраняет связь с образом брачного пира в ближайшем контексте; прилагательное «Божий» лаконично передаёт родительный τοῦ θεοῦ.
theological_decisions:
- issue: Передача апокалиптического пространственного образа
  choice: стоящего в солнце
  alternative: стоящего перед солнцем
  rationale: Греческий текст содержит поразительный образ с ἐν; перевод сохраняет его буквальную напряжённость и не подменяет возможным истолкованием.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным апокалиптическим звучанием. Синтаксис слегка расчленён для ясности; яркие образы оригинала сохранены. Незавершённость прямой речи соответствует границе стиха.
