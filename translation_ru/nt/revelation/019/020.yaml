id: REV.19.20
reference: Revelation 19:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐπιάσθη τὸ θηρίον καὶ ⸂μετ’ αὐτοῦ ὁ⸃ ψευδοπροφήτης ὁ ποιήσας τὰ σημεῖα ἐνώπιον αὐτοῦ, ἐν οἷς ἐπλάνησεν τοὺς λαβόντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ· ζῶντες ἐβλήθησαν οἱ δύο εἰς τὴν λίμνην τοῦ πυρὸς ⸂τῆς καιομένης⸃ ἐν θείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/020.yaml
  text: And the beast was captured[a], and with it the false prophet who had performed the signs in its presence, by which he deceived those who had received the mark of the beast and those who worshiped its image[b]. The two of them were thrown alive into the lake of fire that burns with sulfur.
translation:
  language: ru
  text: И зверь был схвачен, и вместе с ним[a] был схвачен лжепророк, совершивший перед зверем знамения, которыми он обманул принявших начертание зверя и поклонявшихся его образу. Оба были брошены живыми в огненное озеро, горящее серой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое местоимение относится к «зверю» — слову среднего рода в греческом языке. В русском переводе оно согласуется с мужским родом слова «зверь».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιάσθη
  choice: был схвачен
  rationale: Аорист страдательного залога от πιάζω означает захват или взятие под стражу; «был схвачен» естественно передаёт и действие, и пассивную форму.
- source_word: θηρίον
  choice: зверь
  rationale: Устоявшееся и точное обозначение апокалиптического существа в Откровении.
- source_word: μετ’ αὐτοῦ
  choice: вместе с ним
  rationale: По-русски существительное «зверь» мужского рода, поэтому требуется местоимение «ним»; смысл совместного захвата сохраняется.
- source_word: ψευδοπροφήτης
  choice: лжепророк
  rationale: Прямой, современный и традиционно понятный эквивалент сложного греческого существительного.
- source_word: ὁ ποιήσας τὰ σημεῖα
  choice: совершавший … знамения
  rationale: Причастный оборот естественно связывает прежние действия лжепророка с его характеристикой; «знамения» сохраняет смысл знаков, а не только чудес.
- source_word: ἐνώπιον αὐτοῦ
  choice: перед зверем
  rationale: Передаёт значение «перед ним, в его присутствии» и устраняет возможную неясность русского местоимения.
- source_word: ἐν οἷς ἐπλάνησεν
  choice: которыми он обманул
  rationale: 'Творительный падеж выражает инструментальное значение: знамения служили средством обмана.'
- source_word: τοὺς λαβόντας τὸ χάραγμα
  choice: принявших начертание
  rationale: «Принявших» естественно передаёт предшествующее действие, а «начертание» сохраняет принятую в русском библейском языке апокалиптическую лексику.
- source_word: τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ
  choice: поклонявшихся его образу
  rationale: В данном культовом контексте προσκυνέω означает поклонение, а εἰκών — изображение или образ зверя.
- source_word: ζῶντες ἐβλήθησαν οἱ δύο
  choice: они оба были живыми брошены
  rationale: Сохранены множественность, состояние «живыми» и страдательная конструкция греческого текста.
- source_word: εἰς τὴν λίμνην τοῦ πυρὸς τῆς καιομένης ἐν θείῳ
  choice: в огненное озеро, горящее серой
  rationale: Естественная русская формулировка сохраняет конкретный апокалиптический образ огненного озера и серы без догматического пояснения.
theological_decisions:
- issue: Местоимения, относящиеся к зверю
  choice: Использовать русское мужское местоимение «ним», но пояснить грамматическое различие в сноске
  alternative: Искусственно употребить средний род или безличную конструкцию, чтобы воспроизвести греческий род
  rationale: Греческое θηρίον имеет средний грамматический род, тогда как русское «зверь» — мужской. Русское согласование не должно превращаться в утверждение о личностной природе образа.
- issue: Образ окончательного суда
  choice: Сохранить образ огненного озера, горящего серой
  alternative: Истолковать образ словами «ад» или «вечные мучения»
  rationale: Стих даёт конкретный апокалиптический образ; перевод не должен подменять его более поздней богословской формулировкой.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и образности апокалиптического повествования. Устоявшиеся термины «зверь», «лжепророк», «знамения» и «начертание» сохранены; синтаксис слегка упрощён ради ясности без устранения богословской напряжённости текста.
