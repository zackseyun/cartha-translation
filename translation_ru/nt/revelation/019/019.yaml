  text: καὶ εἶδον τὸ θηρίον καὶ τοὺς βασιλεῖς τῆς γῆς καὶ τὰ στρατεύματα αὐτῶν συνηγμένα ποιῆσαι ⸀τὸν πόλεμον μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου καὶ μετὰ τοῦ στρατεύματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/019.yaml
  text: And I saw the beast and the kings of the earth and their armies gathered to make war against the one seated on the horse and against his army[a][b].
translation:
  language: ru
  text: И увидел я зверя, царей земли и их войска, собранные, чтобы вести войну против Сидящего на коне и против Его войска.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «совершить войну с». В данном контексте смысл враждебный: «вести войну против».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: зверь
  rationale: В Откровении это устойчивый апокалиптический образ; слово «зверь» сохраняет его символическую и угрожающую силу.
- source_word: βασιλεῖς τῆς γῆς
  choice: цари земли
  rationale: В глобальном апокалиптическом контексте γῆ обозначает землю как обитаемый мир, а не отдельную страну.
- source_word: στρατεύματα αὐτῶν
  choice: их войска
  rationale: Множественное число и военный контекст естественно передаются словом «войска».
- source_word: συνηγμένα
  choice: собранные
  rationale: Причастие перфекта в пассиве описывает войска и царей как уже собранных вместе; русское «собранные» сохраняет этот результативный оттенок.
- source_word: ποιῆσαι τὸν πόλεμον
  choice: чтобы сразиться
  rationale: Греческий военный идиоматический оборот в данном контексте естественно передаётся русским глаголом цели; буквальное «сделать войну» по-русски неупотребительно, а «вести войну» хуже согласуется с разовым эсхатологическим столкновением.
- source_word: μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: с Сидящим на коне
  rationale: После глагола «сразиться» предлог «с» однозначно выражает противостояние и одновременно формально отражает μετά с родительным; описательное причастие сохранено без подстановки титула.
- source_word: τοῦ καθημένου
  choice: Сидящим
  rationale: Субстантивированное причастие передано непосредственно, без интерпретирующей замены на «Всадник» или «Христос»; прописная буква указывает на уже определённого в контексте небесного Всадника.
- source_word: ἐπὶ τοῦ ἵππου
  choice: на коне
  rationale: Прямое и естественное обозначение местоположения в современном русском языке.
- source_word: μετὰ τοῦ στρατεύματος αὐτοῦ
  choice: с Его войском
  rationale: Единственное число στρατεύματος передано собирательным «войском»; после «сразиться» конструкция «с» имеет ясный враждебный смысл.
theological_decisions:
- issue: Кого обозначает «Сидящий на коне»
  choice: Сохранено описательное обозначение «Сидящий на коне»
  alternative: Христос; Мессия; Всадник
  rationale: Сам стих использует причастный оборот, хотя ближайший контекст позволяет опознать Всадника. Перевод не подставляет отсутствующий в греческом тексте христологический титул.
- issue: Смысл μετά в сочетании с выражением войны
  choice: Передано русской конструкцией «сразиться с», однозначно обозначающей противника
  alternative: вести войну против; воевать с
  rationale: Само μετά обычно означает «с», но в военном идиоматическом контексте участники после него являются противниками; русская конструкция сохраняет и форму «с», и враждебный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Инверсия «И увидел я» сохраняет торжественный повествовательный ритм, оставаясь понятной. Заглавные буквы в «Сидящим» и «Его» отражают определённого небесного персонажа контекста, не заменяя исходное описание богословским титулом.
