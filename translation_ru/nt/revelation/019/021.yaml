  text: καὶ οἱ λοιποὶ ἀπεκτάνθησαν ἐν τῇ ῥομφαίᾳ τοῦ καθημένου ἐπὶ τοῦ ἵππου τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ, καὶ πάντα τὰ ὄρνεα ἐχορτάσθησαν ἐκ τῶν σαρκῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/021.yaml
  text: And the rest were killed by the sword of the one seated on the horse[a], the sword that came out from his mouth[b], and all the birds were filled from their flesh.
translation:
  language: ru
  text: А остальные были убиты[a] мечом сидящего на коне — мечом, вышедшим из его уст[b]. И все птицы насытились их плотью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были сражены».'
    reason: lexical_alternative
  - marker: b
    text: Меч, вышедший из его уст, — апокалиптический образ; ср. Откр. 19:15.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ λοιποὶ
  choice: остальные
  rationale: Естественное собирательное обозначение тех, кто остался после участи зверя и лжепророка в предшествующем контексте.
- source_word: ἀπεκτάνθησαν
  choice: были убиты
  rationale: Сохраняет страдательный залог аориста ἀποκτείνω и звучит ясно и современно; «были сражены» возможно, но более возвышенно.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: мечом
  rationale: Творительный падеж естественно передаёт инструментальное значение ἐν с дательным; конкретный образ большого меча сохраняется.
- source_word: τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: Сидящего на коне
  rationale: Близко передаёт субстантивированное причастие и сохраняет связь с уже представленным всадником; прописная буква указывает на конкретного мессианского персонажа данного видения, не добавляя имени.
- source_word: τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ
  choice: мечом, выходившим из Его уст
  rationale: Согласованное причастие относится к мечу; повтор существительного по-русски проясняет синтаксическую связь и сохраняет буквальный апокалиптический образ.
- source_word: πάντα τὰ ὄρνεα
  choice: все птицы
  rationale: Не добавляет контекстуально вероятное, но лексически не выраженное уточнение «хищные» или «плотоядные».
- source_word: ἐχορτάσθησαν
  choice: насытились
  rationale: Естественно передаёт полное утоление голода, выраженное χορτάζω, без усиления до «нажрались» или «объелись».
- source_word: ἐκ τῶν σαρκῶν αὐτῶν
  choice: их плотью
  rationale: Русский творительный после «насытились» идиоматически выражает пищу, которой насытились; буквальное «от их плоти» было бы неестественно. Множественное σάρκων допускает собирательное русское «плотью».
theological_decisions:
- issue: Природа меча, выходящего из уст всадника
  choice: Сохранить конкретный образ меча, выходящего из Его уст, не истолковывая его в основном тексте.
  alternative: Передать меч непосредственно как слово или суд всадника.
  rationale: Греческий текст даёт апокалиптический образ, но в этом стихе не раскрывает его символическое значение; перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим апокалиптическому повествованию. Синтаксис разделён на два предложения ради ясности; повтор «мечом» снимает неоднозначность приложения. Архаизмы и избыточно натуралистические усиления исключены.
