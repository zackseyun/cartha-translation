id: REV.19.9
reference: Revelation 19:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Γράψον· Μακάριοι οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι. καὶ λέγει μοι· Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/009.yaml
  text: 'And he says to me[a], “Write: Blessed are those who have been invited to the wedding supper of the Lamb.” And he says to me[c][b], “These are the true words of God.”'
translation:
  language: ru
  text: 'И говорит мне: «Напиши: блаженны приглашённые[a] на брачный пир Агнца». И говорит мне: «Это истинные[b] слова Бога».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призванные на брачный пир Агнца».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «верные», то есть заслуживающие доверия; эти слова истинны и исходят от Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γράψον
  choice: Напиши
  rationale: Аористный императив единственного числа передан прямым и естественным русским повелением без добавления отсутствующего в греческом дополнения.
- source_word: Μακάριοι
  choice: блаженны
  rationale: Сохраняет торжественную форму блаженства, характерную для Откровения и всего Нового Завета; «счастливы» звучало бы более субъективно.
- source_word: οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι
  choice: приглашённые на брачный пир Агнца
  rationale: Перфектное страдательное причастие обозначает тех, кто был приглашён и остаётся в этом положении. В контексте пира «приглашённые» естественно передаёт смысл καλέω, не превращая выражение в утверждение о какой-либо особой доктрине призвания.
- source_word: δεῖπνον
  choice: пир
  rationale: В данном свадебном контексте слово обозначает торжественную общую трапезу; «пир» по-русски естественнее и точнее передаёт образ, чем бытовое «ужин», а «вечеря» для современного читателя архаична.
- source_word: γάμου
  choice: брачный
  rationale: Родительный γάμου относится к пиршеству по случаю брака; сочетание «брачный пир» сохраняет и брачную, и праздничную образность.
- source_word: τοῦ ἀρνίου
  choice: Агнца
  rationale: «Агнец» — закрепившийся в русском библейском языке христологический титул, сохраняющий символическое и жертвенное звучание образа Откровения.
- source_word: Οὗτοι οἱ λόγοι
  choice: Это … слова
  rationale: Естественная русская конструкция, прямо передающая указательное местоимение и существительное; связка настоящего времени по нормам русского языка не выражена.
- source_word: ἀληθινοὶ
  choice: истинные
  rationale: Прямо выражает истинность сказанного, сохраняя также возможный оттенок достоверности; вариант «верные, заслуживающие доверия» указан в сноске.
- source_word: τοῦ θεοῦ
  choice: Бога
  rationale: Формально сохраняет греческий родительный и не сужает его до более толковательного «от Бога».
- source_word: λέγει μοι
  choice: говорит мне
  rationale: Сохраняет настоящее время греческого повествования и намеренный повтор формулы в обеих частях стиха.
theological_decisions:
- issue: Значение κεκλημένοι в образе эсхатологического брачного пира
  choice: приглашённые
  alternative: призванные
  rationale: В контексте участия в пире глагол καλέω идиоматически означает приглашение. Вариант «призванные» ближе к форме слова и может вызывать более широкий богословский смысл; он сохранён в сноске, чтобы не устранять эту смысловую возможность.
- issue: Характеристика слов как ἀληθινοί
  choice: истинные
  alternative: верные; заслуживающие доверия
  rationale: «Истинные» — наиболее прямое соответствие, не ограничивающее фразу одной лишь надёжностью, тогда как контекст допускает и оттенок достоверности.
- issue: Отношение родительного τοῦ θεοῦ к словам
  choice: слова Бога
  alternative: слова от Бога
  rationale: Родительный может указывать на принадлежность или источник. Основной текст сохраняет более широкую формулировку оригинала, не сводя её только к происхождению слов.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Слова «блаженны» и «Агнец» сохранены как понятные и укоренённые библейские термины; архаичное «вечеря» не используется. Повтор «И говорит мне» намеренно сохранён вслед за греческим текстом.
