id: REV.19.16
reference: Revelation 19:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἔχει ἐπὶ τὸ ἱμάτιον καὶ ἐπὶ τὸν μηρὸν αὐτοῦ ὄνομα γεγραμμένον· Βασιλεὺς βασιλέων καὶ κύριος κυρίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/016.yaml
  text: 'And he has a name written on his robe and on his thigh: King of kings and Lord of lords[a].'
translation:
  language: ru
  text: 'И на одежде Его, и на бедре Его написано имя: «Царь царей и Господь господ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начертано имя». Буквально по-гречески: «имеет имя написанное».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχει
  choice: написано
  rationale: Греческая конструкция буквально говорит, что Он «имеет имя написанное»; по-русски естественнее передать сохраняющийся результат действия безличной формой «написано», не добавляя толкования «носит».
- source_word: ἐπὶ τὸ ἱμάτιον
  choice: на одежде Его
  rationale: ἱμάτιον обозначает одежду или одеяние. «Одежда» точно и понятно современному читателю; местоимение следует ближайшему контексту и параллельной фразе «на бедре Его».
- source_word: ἐπὶ τὸν μηρὸν αὐτοῦ
  choice: на бедре Его
  rationale: μηρός прямо означает «бедро». Оба указания места сохранены без попытки объяснить взаимное расположение надписи и одежды.
- source_word: ὄνομα γεγραμμένον
  choice: написано имя
  rationale: 'Передаёт перфектное пассивное причастие как наличный результат: имя уже написано и остаётся видимым. «Начертано» возможно, но несколько конкретнее исходного слова.'
- source_word: Βασιλεὺς βασιλέων
  choice: Царь царей
  rationale: Традиционная и точная передача возвышенного титула с родительным множественного числа.
- source_word: κύριος κυρίων
  choice: Господь господ
  rationale: Сохраняет буквальную структуру и богословское звучание титула; «господ» здесь — нормативная форма родительного множественного числа.
theological_decisions:
- issue: Передача царского титула
  choice: Сохранить буквальные титулы «Царь царей и Господь господ» как написанное имя.
  alternative: «Верховный Царь и верховный Господь».
  rationale: Буквальная форма сохраняет параллелизм, возвышенную силу и христологическое значение греческого текста без разъясняющего пересказа.
- issue: Соотношение выражений «на одежде» и «на бедре»
  choice: Передать оба места отдельно и буквально.
  alternative: «На одежде, покрывающей бедро» или «в области перевязи у бедра».
  rationale: В оригинале стоят две параллельные конструкции с ἐπί; перевод не должен устранять оставленную текстом пространственную неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Постпозиция местоимения «Его» поддерживает возвышенный регистр; заглавные буквы в титуле подчёркивают его функцию собственного имени.
