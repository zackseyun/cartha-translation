  source_fidelity: 'Текст точно передаёт греческий оригинал: περιβεβλημένος выражено как устойчивое состояние («облачён»), ἱμάτιον не излишне конкретизировано («одеяние»), а βεβαμμένον αἵματι сохраняет образ погружения в кровь без указания, чья это кровь. Конструкция «его имя — Слово Божье» естественно передаёт κέκληται τὸ ὄνομα αὐτοῦ и титульное ὁ Λόγος τοῦ Θεοῦ.'
