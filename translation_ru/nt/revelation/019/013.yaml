  terminology: «Слово Божье» корректно передаёт личный титул Λόγος и оформлено с нужной прописной буквы. «Одеяние» не навязывает более узкое значение, чем греческое ἱμάτιον. Сноска корректно даёт допустимую альтернативу «обагрённое кровью» и поясняет основной оттенок βάπτω.
