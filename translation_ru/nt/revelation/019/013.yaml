id: REV.19.13
reference: Revelation 19:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ περιβεβλημένος ἱμάτιον ⸀βεβαμμένον αἵματι, καὶ ⸀κέκληται τὸ ὄνομα αὐτοῦ ὁ Λόγος τοῦ Θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/013.yaml
  text: And he is clothed in a robe dipped in blood[a], and his name is called the Word of God.
translation:
  language: ru
  text: Он облачён в одеяние, окунутое в кровь[a], и его имя — Слово Божье.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обагрённое кровью». Греческий глагол буквально означает «окунуть» или «окрасить погружением».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένος
  choice: облачён
  rationale: Перфектное причастие описывает сохраняющееся состояние. «Облачён» естественно сочетается с торжественным контекстом видения и точнее передаёт это состояние, чем простое «носит».
- source_word: ἱμάτιον
  choice: одеяние
  rationale: Слово обозначает верхнюю одежду вообще. «Одеяние» сохраняет возвышенный регистр царственно-воинского образа, не уточняя вид одежды сверх греческого текста.
- source_word: βεβαμμένον αἵματι
  choice: окунутое в кровь
  rationale: Причастие от βάπτω прежде всего выражает погружение или окрашивание посредством погружения. «Окунутое в кровь» сохраняет конкретность и силу образа; возможное контекстуальное понимание «обагрённое кровью» вынесено в сноску.
- source_word: κέκληται
  choice: его имя —
  rationale: Греческий перфект страдательного залога указывает на данное и сохраняющееся имя. Именная русская конструкция естественно передаёт итоговое состояние называния, не утяжеляя фразу буквальным «названо имя его».
- source_word: τὸ ὄνομα αὐτοῦ
  choice: его имя
  rationale: Естественная русская передача греческой притяжательной конструкции.
- source_word: ὁ Λόγος τοῦ Θεοῦ
  choice: Слово Божье
  rationale: Здесь λόγος выступает личным христологическим титулом всадника, а не просто обозначением сообщения или речи. Заглавная буква отмечает титульное употребление.
theological_decisions:
- issue: Христологический титул λόγος
  choice: Слово Божье
  alternative: весть Бога
  rationale: В данном апокалиптическом контексте выражение ὁ Λόγος τοῦ Θεοῦ является личным именованием всадника. Перевод «Слово Божье» сохраняет богословскую значимость титула и возможную связь с иоанновским словоупотреблением, не разворачивая её в толкование.
- issue: Чья кровь изображена на одеянии
  choice: не уточнять
  alternative: его собственная кровь или кровь врагов
  rationale: Сам стих не указывает, кому принадлежит кровь. Перевод сохраняет эту подлинную неоднозначность и не вводит конкретное богословское толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром, соответствующим апокалиптическому видению. «Одеяние» и «облачён» придают фразе достоинство без архаической грамматики; местоимение «его» написано со строчной буквы, а личный титул «Слово Божье» — с заглавной.
