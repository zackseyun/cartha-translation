  text: Καὶ φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν λέγουσα· Αἰνεῖτε ⸂τῷ θεῷ⸃ ἡμῶν, πάντες οἱ δοῦλοι αὐτοῦ, ⸀καὶ οἱ φοβούμενοι αὐτόν, οἱ μικροὶ καὶ οἱ μεγάλοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/005.yaml
  text: And a voice came from the throne[a], saying, “Praise our God, all his servants, and those who fear him[b], the small and the great.”
translation:
  language: ru
  text: 'И от престола раздался голос: «Хвалите нашего Бога, все Его рабы[a] и боящиеся Его[b], малые и великие!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служители». Греческое слово δοῦλοι может обозначать рабов или слуг; здесь оно подчёркивает принадлежность Богу и подчинение Ему.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «благоговеющие перед Ним». В библейской речи «бояться Бога» означает относиться к Нему с благоговейным страхом, почтением и верностью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν
  choice: от престола раздался голос
  rationale: Русское «раздался голос» естественно передаёт появление слышимого голоса, а «от престола» сохраняет указание на его источник, не утверждая, кто именно говорил.
- source_word: Αἰνεῖτε τῷ θεῷ ἡμῶν
  choice: Хвалите нашего Бога
  rationale: Повелительное наклонение и обращение к группе переданы прямо; дательный объект при αἰνέω естественно выражен в русском винительным падежом.
- source_word: πάντες οἱ δοῦλοι αὐτοῦ
  choice: все Его рабы
  rationale: «Рабы» сохраняет сильное значение принадлежности и полной подчинённости Богу, присущее δοῦλοι, тогда как «служители» могло бы сузить смысл до исполнения определённых обязанностей.
- source_word: οἱ φοβούμενοι αὐτόν
  choice: боящиеся Его
  rationale: Сохранён библейский оборот, в котором страх перед Богом включает благоговение, почтение и верность, но не сводится только к одному из этих оттенков.
- source_word: οἱ μικροὶ καὶ οἱ μεγάλοι
  choice: малые и великие
  rationale: Формальная парность оригинала сохранена; выражение охватывает людей независимо от их положения и значимости.
theological_decisions:
- issue: Значение δοῦλοι применительно к принадлежащим Богу
  choice: рабы
  alternative: служители
  rationale: Основной текст сохраняет более сильный смысл принадлежности Богу и подчинения Ему. Вариант «служители» дан в примечании как естественная контекстуальная возможность, без ослабления исходного образа в тексте.
- issue: Смысл страха перед Богом
  choice: боящиеся Его
  alternative: благоговеющие перед Ним
  rationale: Буквальный библейский оборот сохраняет напряжение между страхом, почтением и благоговением; более истолковывающий вариант вынесен в примечание.
- issue: Соотношение групп «рабы» и «боящиеся»
  choice: сохранено сочинение через «и»
  alternative: понимать «боящихся Его» как пояснение к «рабам»
  rationale: Греческая последовательность допускает тесное смысловое сближение обозначений, но не требует однозначно считать их одной группой или двумя отдельными группами. Русский текст не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулы «рабы», «боящиеся Его», «малые и великие» сохранены ради образности и богословской ёмкости оригинала; пунктуация делает длинное обращение ясным для чтения вслух.
