id: REV.19.11
reference: Revelation 19:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ εἶδον τὸν οὐρανὸν ἠνεῳγμένον, καὶ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ⸂πιστὸς καλούμενος⸃ καὶ ἀληθινός, καὶ ἐν δικαιοσύνῃ κρίνει καὶ πολεμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/011.yaml
  text: And I saw heaven opened[a], and behold, a white horse, and the one sitting on it is called Faithful and True, and in righteousness he judges and wages war.
translation:
  language: ru
  text: И увидел я открытое небо, и вот — белый конь. Сидящий на нём зовётся Верным и Истинным; в праведности[a] он судит и ведёт войну.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливо судит и ведёт войну».'
    reason: 'Контекстуальная лексическая альтернатива для ἐν δικαιοσύνῃ: «справедливость» подчёркивает судебный аспект, тогда как в основном тексте сохранено более широкое «праведность».'
lexical_decisions:
- source_word: ἠνεῳγμένον
  choice: открытое
  rationale: Перфектное пассивное причастие представляет небо в состоянии, наступившем вследствие его открытия. «Открытое небо» естественно передаёт этот результативный смысл.
- source_word: ἰδοὺ
  choice: и вот
  rationale: «И вот» сохраняет внезапность видения и характерную для апокалиптического повествования выразительность, не прибегая к архаичному «се».
- source_word: ἵππος λευκός
  choice: белый конь
  rationale: Прямой и естественный перевод именной группы; русский язык не требует выражения неопределённости артиклем.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: Сидящий на нём
  rationale: Передаёт субстантивированное причастие и не заменяет его более толковательным словом «всадник».
- source_word: πιστὸς καλούμενος καὶ ἀληθινός
  choice: зовётся Верным и Истинным
  rationale: Передаёт καλούμενος как обозначение имени или титула, а πιστός и ἀληθινός — как парные наименования. «Зовётся» звучит естественно и сохраняет буквальный образ называния.
- source_word: πιστός
  choice: Верный
  rationale: «Верный» охватывает значение надёжности и преданности и естественно выступает здесь как титул.
- source_word: ἀληθινός
  choice: Истинный
  rationale: «Истинный» подходит для титульного употребления и сохраняет смысл подлинности и соответствия истине.
- source_word: ἐν δικαιοσύνῃ
  choice: по праведности
  rationale: Оборот передаёт основание и нравственный характер суда и войны. Существительное «праведность» сохраняет традиционно значимый семантический объём δικαιοσύνη; контекстуальное «по справедливости» дано в сноске.
- source_word: κρίνει
  choice: Он судит
  rationale: Прямо передаёт настоящее время глагола без добавочного наречия; прописная буква у местоимения согласуется с титульным представлением персонажа в данном контексте.
- source_word: πολεμεῖ
  choice: ведёт войну
  rationale: Современное идиоматическое выражение, точно сохраняющее военный смысл πολεμέω.
theological_decisions:
- issue: Представление наименований всадника
  choice: «Верный и Истинный» как титульные наименования с прописной буквы
  alternative: «верный и истинный» как обычные описательные прилагательные
  rationale: В ближайшем контексте Откровения эти слова не просто сообщают качества, а служат наименованиями фигуры. Прописные буквы отмечают титульную функцию, не добавляя к греческому тексту нового отождествления.
- issue: Передача δικαιοσύνη
  choice: «праведность» в основном тексте
  alternative: «справедливость»
  rationale: В контексте суда и войны слово включает идею справедливого действия, но «праведность» сохраняет более широкий нравственно-богословский диапазон δικαιοσύνη. Контекстуально уместная альтернатива приведена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, апокалиптическим звучанием. Архаизмы вроде «се» и «отверстое» исключены. Инверсия «И увидел я» сохраняет торжественный повествовательный ритм, оставаясь понятной современному читателю.
