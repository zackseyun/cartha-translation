- from: И увидел я открытое небо, и вот — белый конь. Сидящий на нём зовётся Верным и Истинным; по праведности[a] Он судит и ведёт войну.
  to: И увидел я открытое небо, и вот — белый конь. Сидящий на нём зовётся Верным и Истинным; в праведности[a] он судит и ведёт войну.
  rationale: Исправлен предлог при «праведности», чтобы точнее передать ἐν δικαιοσύνῃ и улучшить естественность русского текста. Почтительная прописная буква в местоимении заменена строчной без изменения смысла. Сноска переформулирована как естественная русская контекстуальная альтернатива, относящаяся ко всему сочетанию с ἐν δικαιοσύνῃ.
