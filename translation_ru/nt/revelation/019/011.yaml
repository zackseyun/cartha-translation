    issue: Оборот «по праведности» для ἐν δικαιοσύνῃ
    rationale: Предлог ἐν здесь обозначает сферу или образ действия. Русское «по праведности» звучит как «согласно праведности» и стилистически тяжеловесно. «В праведности» точнее сохраняет исходный образ и естественнее в данном регистре.
  - severity: low
    issue: Прописное «Он»
    rationale: Греческий текст не маркирует местоимение почтительной прописной буквой. Титульность уже ясно передана словами «Верным и Истинным»; строчное «он» нейтральнее и не добавляет редакционного конфессионального сигнала.
