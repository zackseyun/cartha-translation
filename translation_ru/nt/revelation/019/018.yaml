id: REV.19.18
reference: Revelation 19:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἵνα φάγητε σάρκας βασιλέων καὶ σάρκας χιλιάρχων καὶ σάρκας ἰσχυρῶν καὶ σάρκας ἵππων καὶ τῶν καθημένων ἐπ’ ⸀αὐτῶν, καὶ σάρκας πάντων ἐλευθέρων τε καὶ δούλων καὶ μικρῶν ⸀καὶ μεγάλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/018.yaml
  text: so that you may eat the flesh of kings[a], the flesh of commanders, the flesh of the mighty, the flesh of horses and of those who sit on them, and the flesh of all, both free and servant, and small and great.
translation:
  language: ru
  text: чтобы вы ели плоть царей, плоть военачальников, плоть сильных, плоть коней и сидящих на них, плоть всех — и свободных, и рабов, и малых, и великих.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα φάγητε
  choice: чтобы вы ели
  rationale: Союз ἵνα с аористным сослагательным наклонением выражает цель призыва из предыдущего стиха. Русская конструкция «чтобы вы ели» естественно сохраняет эту синтаксическую зависимость, не превращая фразу в самостоятельное повеление.
- source_word: σάρκας
  choice: плоть
  rationale: В сцене суда речь идёт о телах в буквальном смысле. Повтор «плоть» перед перечисляемыми группами передаёт настойчивый риторический рисунок греческого текста; русское единственное число уместно для вещества или телесной плоти.
- source_word: βασιλέων
  choice: царей
  rationale: βασιλεῖς здесь прямо обозначает царей; более общее «правителей» ослабило бы конкретность образа.
- source_word: χιλιάρχων
  choice: военачальников
  rationale: χιλίαρχος обозначает высокого военного командира, исторически начальника тысячи. «Военачальники» ясно передаёт военный статус без неестественной транслитерации и без чрезмерно узкого современного звания.
- source_word: ἰσχυρῶν
  choice: сильных
  rationale: Субстантивированное прилагательное обозначает сильных или могущественных людей. «Сильных» сохраняет лаконичность и допускает как физическую, так и властную силу, не сужая образ только до воинов.
- source_word: ἵππων καὶ τῶν καθημένων ἐπ’ αὐτῶν
  choice: коней и сидящих на них
  rationale: Перевод сохраняет раздельное упоминание коней и людей, сидящих на них. Более краткое «всадников» возможно, но сворачивает причастный образ оригинала.
- source_word: πάντων
  choice: всех
  rationale: Слово обобщает следующие пары и подчёркивает всеохватность суда.
- source_word: ἐλευθέρων τε καὶ δούλων
  choice: и свободных, и рабов
  rationale: Парная конструкция обозначает противоположные общественные положения. Повтор союза естественно передаёт корреляцию τε καὶ в русском перечислении.
- source_word: μικρῶν καὶ μεγάλων
  choice: и малых, и великих
  rationale: Сохранена традиционная меризма, охватывающая людей любого положения или значимости, без пояснительного сужения до конкретной социальной шкалы.
theological_decisions:
- issue: Передача δοῦλος в противопоставлении свободным
  choice: рабов
  alternative: слуг
  rationale: Прямое противопоставление ἐλεύθερος и δοῦλος указывает именно на юридически и социально несвободное положение. «Слуги» могло бы скрыть эту противоположность.
- issue: Объём выражения μικρῶν καὶ μεγάλων
  choice: малых и великих
  alternative: незнатных и знатных
  rationale: Оригинал использует широкую меризму. Буквально-идиоматическая передача сохраняет её многозначность и не ограничивает смысл только знатностью, возрастом или властью.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским ритмом. Повтор слова «плоть» намеренно сохранён ради суровой анафорической силы перечисления. «Кони» выбраны вместо нейтрального «лошади» как естественное слово в военном и возвышенном контексте; архаические формы и специальные воинские титулы исключены.
