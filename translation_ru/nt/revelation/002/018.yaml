  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Θυατείροις ἐκκλησίας γράψον· Τάδε λέγει ὁ υἱὸς τοῦ θεοῦ, ὁ ἔχων τοὺς ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός, καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/018.yaml
  text: 'And to the angel of the church in Thyatira write: These things says the Son of God[a], the one who has his eyes like a flame of fire[b], and his feet like burnished bronze:'
translation:
  language: ru
  text: 'И ангелу[a] церкви в Фиатире напиши: «Так говорит Сын Божий, у Которого глаза — как пламя огня, а ноги — подобны сияющему металлу[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестнику».'
    reason: alternative_reading
  - marker: b
    text: Греческое слово, переданное как «сияющий металл», встречается редко и может в более общем смысле обозначать очищенный, светящийся металл или сплав.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ангелу
  rationale: В повторяющейся формуле обращения к семи церквам Откровения основным выбран традиционный и контекстуально уместный вариант «ангел»; лексически возможное «вестник» сохраняется в примечании.
- source_word: τῆς ἐν Θυατείροις ἐκκλησίας
  choice: церкви в Фиатире
  rationale: «Церковь» естественно обозначает местную христианскую общину; греческое множественное название города по-русски передаётся принятой формой единственного числа «Фиатира».
- source_word: Τάδε λέγει
  choice: Так говорит
  rationale: Сохраняет торжественную пророческую формулу и звучит естественно в современном литературном русском языке.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Сын Божий
  rationale: Прямая передача явного христологического титула без ослабления или поясняющей переработки.
- source_word: ὁ ἔχων τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: у Которого глаза
  rationale: Естественная русская конструкция, сохраняющая определительное описание говорящего; прописная буква соответствует принятому благоговейному написанию местоимений, относящихся к Христу.
- source_word: ὡς φλόγα πυρός
  choice: как пламя огня
  rationale: Близко воспроизводит греческое сравнение и его яркий апокалиптический образ.
- source_word: οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ
  choice: ноги — подобны сияющему металлу
  rationale: Редкое χαλκολίβανον не позволяет уверенно определить конкретный металл или сплав. «Сияющий металл» сохраняет зрительный образ, не создавая ложной лексической точности.
theological_decisions:
- issue: Самоназвание Христа
  choice: Сын Божий
  alternative: функциональный или смягчённый пересказ титула
  rationale: Греческий текст прямо называет говорящего Сыном Бога; перевод сохраняет это утверждение без догматического расширения.
- issue: К кому относится ἀγγέλῳ
  choice: ангелу
  alternative: вестнику
  rationale: Апокалиптический контекст и единообразная формула посланий поддерживают «ангелу», однако слово может обозначать и вестника, поэтому эта неоднозначность отмечена в сноске.
- issue: Точный референт χαλκολιβάνῳ
  choice: сияющему металлу
  alternative: начищенной бронзе; очищенной бронзе; блестящему сплаву
  rationale: Поскольку точный состав обозначаемого редким словом вещества неизвестен, перевод сохраняет образ блеска и металла, не утверждая определённый сплав.
translation_notes:
  register: 'Современный литературный русский с торжественным библейским ритмом. Прямая речь открыта кавычкой и двоеточием в конце, поскольку стих вводит продолжающееся послание. В основном тексте маркер [a] поставлен при «сияющему металлу», но примечание [a] относится к «ангелу»; требуется исправить маркировку: [a] после «ангелу», [b] после «металлу».'
