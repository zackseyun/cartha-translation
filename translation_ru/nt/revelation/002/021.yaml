  text: καὶ ἔδωκα αὐτῇ χρόνον ἵνα μετανοήσῃ, καὶ οὐ θέλει μετανοῆσαι ἐκ τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/021.yaml
  text: And I gave her time to repent[a], but she is not willing to repent of her sexual immorality.
translation:
  language: ru
  text: Я дал ей время покаяться, но она не хочет покаяться в своей сексуальной безнравственности.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «покаяться от своей сексуальной безнравственности».'
    reason: 'Лексическая альтернатива: ἐκ буквально означает «от, из», тогда как русский оборот «каяться в» естественно передаёт связь покаяния с тем, в чём каются.'
lexical_decisions:
- source_word: ἔδωκα
  choice: Я дал
  rationale: Аорист изъявительного наклонения обозначает совершённое предоставление времени; простой прошедший вид естественен по-русски.
- source_word: αὐτῇ
  choice: ей
  rationale: Дательный падеж женского рода указывает на женщину, символически названную Иезавелью в ближайшем контексте.
- source_word: χρόνον
  choice: время
  rationale: χρόνος означает время или некоторый срок; русское «время» естественно передаёт предоставленную возможность покаяться.
- source_word: ἵνα μετανοήσῃ
  choice: покаяться
  rationale: Конструкция ἵνα с сослагательным наклонением выражает цель; сочетание «дал ей время покаяться» естественно передаёт её по-русски.
- source_word: οὐ θέλει
  choice: она не хочет
  rationale: θέλω выражает волю или желание. «Не хочет» сохраняет прямой волевой смысл, не усиливая его до категорического «отказывается».
- source_word: μετανοῆσαι
  choice: каяться
  rationale: Инфинитив дополняет θέλει; повтор корня «каяться» сохраняет акцент исходного текста, а несовершенный вид естествен после «не хочет».
- source_word: ἐκ τῆς πορνείας αὐτῆς
  choice: в своём разврате
  rationale: πορνεία обозначает половую распущенность или сексуальную безнравственность. «Разврат» краток, понятен и сохраняет сексуальную конкретность; русский оборот «каяться в» идиоматичен, хотя ἐκ буквально означает «из, от».
theological_decisions:
- issue: Значение πορνεία в контексте апокалиптического обличения
  choice: «разврат» с сохранением конкретного сексуального смысла
  alternative: «блуд», «сексуальная безнравственность», «распутство» или полностью метафорическое понимание как идолопоклонства
  rationale: В пророческой и апокалиптической речи слово может иметь буквальные и метафорические оттенки. Конкретный перевод не навязывает исключительно аллегорическое толкование и позволяет ближайшему контексту определить возможную связь с идолопоклонством.
translation_notes:
  register: Современный литературный русский язык, простой и dignified; сохранён повтор глагола «каяться» и волевой оттенок οὐ θέλει. Маркер сноски поставлен непосредственно после относящейся к нему фразы.
