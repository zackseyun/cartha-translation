id: REV.2.13
reference: Revelation 2:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀Οἶδα ποῦ κατοικεῖς, ὅπου ὁ θρόνος τοῦ Σατανᾶ, καὶ κρατεῖς τὸ ὄνομά μου, καὶ οὐκ ἠρνήσω τὴν πίστιν μου ⸀καὶ ἐν ταῖς ⸀ἡμέραις Ἀντιπᾶς, ὁ μάρτυς μου, ὁ πιστός ⸀μου, ὃς ἀπεκτάνθη παρ’ ὑμῖν, ὅπου ὁ Σατανᾶς κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/013.yaml
  text: I know where you live—where Satan’s throne is[a]. Yet you hold fast my name, and you did not deny faith in me, even in the days of Antipas, my witness, my faithful one, who was killed among you[b], where Satan lives.
translation:
  language: ru
  text: 'Я знаю, где ты живёшь: там, где престол Сатаны. Но ты крепко держишься моего имени и не отрёкся от веры в меня[a] даже в дни Антипы, моего свидетеля, верного мне, который был убит среди вас — там, где живёт Сатана.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «моей веры». Греческое выражение может также пониматься как «моей верности».'
    reason: Сохранение неоднозначности формы μου при слове πίστις.
lexical_decisions:
- source_word: Οἶδα
  choice: Я знаю
  rationale: Перфект имеет настоящее значение; прямое и естественное соответствие в современном русском языке.
- source_word: κατοικεῖς
  choice: ты живёшь
  rationale: Передаёт обычное значение проживания в определённом месте без излишне архаичного «обитаешь».
- source_word: ὅπου ὁ θρόνος τοῦ Σατανᾶ
  choice: там, где престол Сатаны
  rationale: Сохраняет резкий апокалиптический образ и не поясняет, что именно символизирует престол.
- source_word: κρατεῖς τὸ ὄνομά μου
  choice: ты крепко держишься моего имени
  rationale: κρατέω выражает стойкую приверженность; «держишься имени» сохраняет исходный образ, а наречие «крепко» передаёт силу глагола.
- source_word: οὐκ ἠρνήσω
  choice: не отрёкся
  rationale: В контексте верности Христу «отречься» естественнее русского «отрицать» и точно передаёт отказ от исповедания или верности.
- source_word: τὴν πίστιν μου
  choice: веры в меня
  rationale: В данном контексте наиболее естественно обозначает веру, направленную на говорящего; компактность и неоднозначность греческого оборота отмечены в сноске.
- source_word: ἐν ταῖς ἡμέραις Ἀντιπᾶς
  choice: даже в те дни, когда Антипа… был убит
  rationale: Естественно оформляет по-русски временную конструкцию и связывает её с последующим сообщением об убийстве Антипы.
- source_word: ὁ μάρτυς μου
  choice: мой свидетель
  rationale: Основное значение μάρτυς — «свидетель»; возможный оттенок «мученик» сохранён в сноске.
- source_word: ὁ πιστός μου
  choice: верный мне
  rationale: Сохраняет отдельную характеристику Антипы и естественно передаёт его верность Христу, не добавляя отсутствующего в тексте слова «служитель».
- source_word: ἀπεκτάνθη
  choice: был убит
  rationale: Точно передаёт пассивную форму без добавления юридического оттенка слова «убит злодейски» или «казнён».
- source_word: παρ’ ὑμῖν
  choice: среди вас
  rationale: Передаёт местное значение παρά с дательным и не создаёт ложного впечатления, будто адресаты сами убили Антипу.
theological_decisions:
- issue: Значение τὴν πίστιν μου
  choice: «веры в меня» в основном тексте
  alternative: «моей веры» или «моей верности»
  rationale: В контексте стойкости общины объектное понимание — вера во Христа — наиболее естественно, однако греческое сочетание с μου допускает и другие отношения, поэтому они указаны в сноске.
- issue: Значение μάρτυς в контексте насильственной смерти
  choice: «свидетель»
  alternative: «мученик»
  rationale: «Свидетель» сохраняет базовое лексическое значение и связь со свидетельством об Иисусе; контекст смерти позволяет услышать также формирующийся смысл «мученик», отмеченный в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной интонацией. Единственное число «ты» сохранено по греческому обращению. Повтор образа места, где находится и живёт Сатана, оставлен без рационализирующего пояснения. Двоеточие и тире помогают ясно передать структуру длинного греческого предложения.
