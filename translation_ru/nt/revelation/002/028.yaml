  text: ὡς κἀγὼ εἴληφα παρὰ τοῦ πατρός μου, καὶ δώσω αὐτῷ τὸν ἀστέρα τὸν πρωϊνόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/028.yaml
  text: just as I also have received from my Father[a], and I will give him the morning star.
translation:
  language: ru
  text: как и Я получил от Моего Отца, и дам ему утреннюю звезду.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный вариант: «звезду рассвета». Этот образ может отсылать к мессианской царской символике, а также предвосхищать Откр. 22:16, где Иисус называет Себя «яркой утренней звездой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς κἀγὼ
  choice: как и Я
  rationale: Передаёт сравнительное ὡς и добавочно-усилительное κἀγώ, связывая получение Сыном от Отца с предшествующим обещанием.
- source_word: εἴληφα
  choice: получил
  rationale: Русский совершенный вид естественно выражает завершённое получение; сохраняющееся следствие следует из контекста, тогда как форма «имею полученным» была бы неестественной.
- source_word: παρὰ τοῦ πατρός μου
  choice: от Моего Отца
  rationale: παρά с родительным обозначает источник; перевод сохраняет прямо названное отношение Сына к Отцу без богословского пояснения.
- source_word: καὶ δώσω αὐτῷ
  choice: и дам ему
  rationale: Прямо и естественно передаёт будущее время и дательный падеж, отсылающий к побеждающему в предшествующем контексте.
- source_word: τὸν ἀστέρα τὸν πρωϊνόν
  choice: утреннюю звезду
  rationale: Устойчивое и естественное русское соответствие сохраняет образ, не определяя его значение в основном тексте.
theological_decisions:
- issue: Значение «утренней звезды»
  choice: Сохранить образ без истолкования в основном тексте.
  alternative: Уточнить как Самого Христа, мессианскую царскую награду либо эсхатологическую славу.
  rationale: Сам стих не раскрывает символ однозначно; буквальный образ сохраняет внутритекстовую связь с Откр. 22:16 и богословскую многозначность.
- issue: Христологическое отношение во фразе «от Моего Отца»
  choice: Передать прямо, без пояснения характера полученного.
  alternative: Добавить указание на делегированную власть или домостроительство искупления.
  rationale: Текст прямо говорит об Отце как источнике полученного, но здесь не разъясняет природу этого отношения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Заглавные местоимения «Я», «Моего», «Себя» употреблены по принятой русской издательской традиции применительно к Богу и Христу; синтаксис сохраняет связь с предшествующим стихом.
