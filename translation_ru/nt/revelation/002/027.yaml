lexical_decisions:
- source_word: ποιμανεῖ
  choice: будет пасти
  rationale: Сохраняет прямой пастырский образ глагола ποιμαίνω и одновременно не устраняет заложенный в отсылке к Псалму 2 смысл царской власти.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: железным жезлом
  rationale: «Жезл» естественно передаёт ῥάβδος в возвышенном библейском контексте и допускает как пастырский, так и царский оттенок; творительный падеж передаёт инструментальное ἐν.
- source_word: ὡς
  choice: как
  rationale: Естественно вводит сравнение в современном литературном русском языке.
- source_word: τὰ σκεύη τὰ κεραμικὰ
  choice: глиняные сосуды
  rationale: Точно и понятно передаёт сосуды из обожжённой глины, сохраняя образ хрупкости.
- source_word: συντρίβεται
  choice: разбиваются
  rationale: Передаёт сокрушительное разрушение; множественное число согласовано с русским подлежащим, тогда как единственное число греческого глагола обычно при среднем роде множественного числа.
- source_word: καὶ
  choice: и
  rationale: Сохраняет связь с продолжающимся предложением и предшествующим обещанием.
theological_decisions:
- issue: Царско-мессианская отсылка к Псалму 2:9 в глаголе ποιμανεῖ и образе железного жезла
  choice: 'В основном тексте сохранить пастырскую метафору: «будет пасти».'
  alternative: «будет править» или «будет управлять»
  rationale: Греческий текст использует ποιμαίνω, буквально связанный с пастырством, но в данном контексте он также выражает царскую власть. Перевод сохраняет напряжение между пастырским попечением и властным судом, не сводя выражение только к политическому господству.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Пасти» и «жезл» сохраняют взаимосвязанные пастырский и царский образы. Строчная начальная буква и конечная запятая отражают синтаксическую связь стиха с окружающим предложением.
