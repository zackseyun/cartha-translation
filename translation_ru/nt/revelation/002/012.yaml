  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Περγάμῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὴν ῥομφαίαν τὴν δίστομον τὴν ὀξεῖαν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/012.yaml
  text: 'And to the angel of the church in Pergamum write: These things says the one who has the sharp, double-edged sword:[a]'
translation:
  language: ru
  text: 'И ангелу[a] церкви в Пергаме напиши: «Так говорит Тот, у Кого острый обоюдоострый меч»:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестнику» вместо «ангелу». Толкователи расходятся во мнениях, идёт ли речь о небесном существе или о представителе церкви.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ангелу
  rationale: ἄγγελος может обозначать небесного ангела или человеческого вестника. «Ангел» естественно сохраняет установленную для Откровения формулу и не устраняет неоднозначность референта.
- source_word: ἐκκλησίας
  choice: церкви
  rationale: В данном христианском контексте ἐκκλησία обозначает общину верующих; «церковь» — ясный и естественный русский эквивалент.
- source_word: γράψον
  choice: напиши
  rationale: Аористный императив передан совершенным видом, естественным для разового повеления; содержание письма следует далее.
- source_word: Τάδε λέγει
  choice: Так говорит
  rationale: Формула передаёт торжественный пророческий характер заявления и звучит естественно в современном литературном русском; буквальное «это говорит» было бы неидиоматично.
- source_word: ὁ ἔχων
  choice: Тот, у Кого
  rationale: Субстантивированное причастие передано титульной описательной конструкцией, сохраняющей определённость и торжественный регистр.
- source_word: ῥομφαίαν
  choice: меч
  rationale: ῥομφαία может подразумевать большой меч, однако уточнение типа оружия здесь привнесло бы излишнюю конкретизацию.
- source_word: δίστομον
  choice: обоюдоострый
  rationale: Буквально «двухустый», идиоматически — имеющий два острых лезвия; «обоюдоострый» точно и естественно передаёт образ.
- source_word: ὀξεῖαν
  choice: острый
  rationale: ὀξύς непосредственно характеризует меч как острый.
- source_word: Περγάμῳ
  choice: Пергаме
  rationale: «Пергам» — современная русская форма древнего топонима Πέργαμος; предложный падеж соответствует греческому местному значению.
theological_decisions:
- issue: Кто такой «ангел» церкви
  choice: В основном тексте сохранено «ангел» без уточнения, небесное это существо или человеческий представитель.
  alternative: вестник; руководитель церкви; небесный представитель
  rationale: Само слово ἄγγελος допускает несколько пониманий, а данный стих не разрешает вопрос. Перевод не должен навязывать определённую экклезиологическую или ангелологическую трактовку.
translation_notes:
  register: Современный литературный русский с торжественной интонацией пророческого обращения. Формула «Так говорит» естественно передаёт Τάδε λέγει; прописные буквы в «Тот, у Кого» отмечают титульное обозначение Говорящего, не добавляя имени. Порядок определений «острый обоюдоострый меч» сохраняет греческое накопление характеристик без неестественной русской пунктуации.
