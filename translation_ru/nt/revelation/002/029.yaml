  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/029.yaml
  text: The one who has an ear, let him hear what the Spirit says to the churches.
translation:
  language: ru
  text: У кого есть ухо, пусть услышит, что Дух говорит церквам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: У кого есть
  rationale: Субстантивированное сочетание артикля с причастием обозначает всякого обладающего названной способностью. Эта формулировка естественна в современном русском и сохраняет обобщённый характер призыва.
- source_word: οὖς
  choice: ухо
  rationale: Сохранено единственное число греческого текста и образ способности воспринимать сказанное.
- source_word: ἀκουσάτω
  choice: пусть услышит
  rationale: Передаёт повелительное наклонение третьего лица и сохраняет торжественную формулу призыва; «услышит» включает не только слуховое восприятие, но и внимательное принятие вести.
- source_word: τί
  choice: что
  rationale: Естественно вводит содержание речи в русском языке.
- source_word: τὸ πνεῦμα
  choice: Дух
  rationale: В повторяющемся обращении Откровения речь идёт о Божьем Духе; прописная буква обозначает этот референт, не добавляя толкования в сам текст.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время естественно передаёт продолжающуюся или характерную речь Духа.
- source_word: ταῖς ἐκκλησίαις
  choice: церквам
  rationale: В контексте Откровения 2–3 слово обозначает общины, к которым обращены послания; «церкви» — точный и общепонятный русский эквивалент.
theological_decisions:
- issue: Кого обозначает «Дух»
  choice: Святой Дух, говорящий церквам
  alternative: человеческий дух; дух или смысл вести Иисуса
  rationale: В повторяющемся рефрене Откровения 2–3 Дух выступает божественным говорящим, обращающимся через эти вести ко всем церквам. Прописная буква сохраняет это отождествление без поясняющей вставки.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. Синтаксис сохраняет афористическую форму и единственное число исходного текста; архаическое «имеющий ухо» заменено естественным «у кого есть ухо».
