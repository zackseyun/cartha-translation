source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, καὶ τὴν ⸂ἀγάπην καὶ τὴν πίστιν⸃ καὶ τὴν διακονίαν καὶ τὴν ὑπομονήν σου, καὶ τὰ ἔργα σου τὰ ἔσχατα πλείονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/019.yaml
  text: I know your works[a], your love and faith and service and endurance, and that your last works are more than the first.
translation:
  language: ru
  text: 'Знаю твои дела: твою любовь, веру[a], служение и стойкость, а также то, что последних твоих дел больше, чем первых.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верность». Греческое слово в этом контексте может означать и веру, и верность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά
  choice: Знаю
  rationale: Форма οἶδα имеет здесь настоящее стативное значение и входит в повторяющуюся формулу обращения к церквам.
- source_word: ἔργα
  choice: дела
  rationale: «Дела» естественно обозначает конкретные поступки и позволяет сохранить повтор этого слова в заключительной части стиха.
- source_word: ἀγάπην
  choice: любовь
  rationale: Обычный и точный русский эквивалент ἀγάπη в перечне христианских добродетелей.
- source_word: πίστιν
  choice: веру
  rationale: Основное соответствие πίστις; возможный смысл «верность» сохранён в сноске, поскольку контекст допускает оба понимания.
- source_word: διακονίαν
  choice: служение
  rationale: Передаёт практическое служение без неоправданного сведения значения к церковной должности.
- source_word: ὑπομονήν
  choice: стойкость
  rationale: Выражает устойчивость и способность не отступать под давлением; в современном русском звучит естественнее буквального «терпения» в данном перечне.
- source_word: τὰ ἔργα σου τὰ ἔσχατα
  choice: последних дел у тебя
  rationale: Сохраняет временное противопоставление последних дел первым и повтор существительного «дела».
- source_word: πλείονα τῶν πρώτων
  choice: больше, чем первых
  rationale: Не уточняет без достаточных оснований, идёт ли речь о числе, объёме или превосходстве дел, и потому сохраняет широту сравнительной формы πλείονα.
theological_decisions:
- issue: Значение πίστις в перечне добродетелей
  choice: вера
  alternative: верность
  rationale: В данном контексте πίστις может означать как доверие Богу, так и проявленную в поведении верность. Основной текст сохраняет обычное «вера», а сноска — подлинную смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной интонацией. Перечень сделан естественным для русского синтаксиса; заключительная фраза сохраняет повтор слова «дела» и неоднозначную сравнительную силу πλείονα.
