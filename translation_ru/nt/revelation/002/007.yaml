id: REV.2.7
reference: Revelation 2:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω αὐτῷ φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, ὅ ἐστιν ἐν τῷ παραδείσῳ τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/007.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give to eat from the tree of life, which is in the paradise of God.
translation:
  language: ru
  text: У кого есть ухо, пусть услышит, что Дух говорит церквам. Побеждающему[a] дам поесть от дерева жизни, которое находится в раю Божьем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Преодолевающему».'
    reason: Лексическая альтернатива для τῷ νικῶντι; она передаёт смысл одоления, хотя слабее сохраняет образ победы.
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: У кого есть ухо
  rationale: Сохраняет единственное число οὖς и идиоматический, обращённый ко всякому слушателю характер греческой конструкции с субстантивированным причастием.
- source_word: ἀκουσάτω
  choice: пусть услышит
  rationale: Передаёт побудительную силу аористного императива третьего лица и естественно звучит в современном литературном русском языке.
- source_word: τὸ πνεῦμα
  choice: Дух
  rationale: В повторяющейся формуле Откровения 2–3 речь идёт о Божьем Духе; прописная буква обозначает контекстуально определённого референта.
- source_word: λέγει ταῖς ἐκκλησίαις
  choice: говорит церквам
  rationale: Простое настоящее время точно передаёт λέγει, а «церквам» является обычным контекстуальным соответствием ἐκκλησίαις.
- source_word: τῷ νικῶντι
  choice: Побеждающему
  rationale: Причастная форма сохраняет длительно-характеризующую силу настоящего причастия и образ победы, присущий νικάω в Откровении.
- source_word: δώσω αὐτῷ φαγεῖν
  choice: дам есть
  rationale: Лаконично передаёт греческую конструкцию «дам ему есть» без тяжеловесного или двусмысленного русского местоимения; адресат уже выражен дательным «побеждающему».
- source_word: ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: от дерева жизни
  rationale: «От» сохраняет значение источника у ἐκ, а ξύλον в данном контексте означает дерево и отсылает к библейскому образу дерева жизни.
- source_word: παραδείσῳ τοῦ θεοῦ
  choice: раю Божьем
  rationale: «Рай» сохраняет эсхатологический и межтекстовый вес παράδεισος; прилагательное «Божьем» естественно передаёт краткую генитивную связь τοῦ θεοῦ.
theological_decisions:
- issue: Референт τὸ πνεῦμα
  choice: Дух, то есть Святой Дух
  alternative: некий дух или духовное начало
  rationale: Повторяющаяся в обращениях к церквам формула представляет речь Духа как божественное обращение; прописная буква отражает этот контекст, не расширяя текст.
- issue: Значение νικάω в формуле обетования
  choice: побеждающий
  alternative: преодолевающий
  rationale: «Побеждающий» непосредственно сохраняет лексику победы и конфликтную образность Откровения; возможное «преодолевающий» отмечено в сноске.
- issue: Образ дерева жизни в раю Божьем
  choice: сохранён без поясняющей идентификации
  alternative: истолковать рай как конкретное небесное или восстановленное эдемское место
  rationale: Текст утверждает местонахождение дерева, но не уточняет здесь пространственно-временную природу рая; перевод сохраняет эту богословскую недосказанность.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной библейской ритмикой. Формула «У кого есть ухо, пусть услышит» ясна обычному читателю и сохраняет греческое единственное число. «Дам есть» намеренно лаконично и возвышенно, но остаётся понятным; «рай Божий» передан естественной формой «в раю Божьем».
