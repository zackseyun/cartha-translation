  text: ὑμῖν δὲ λέγω τοῖς λοιποῖς τοῖς ἐν Θυατείροις, ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην, οἵτινες οὐκ ἔγνωσαν τὰ βαθέα τοῦ Σατανᾶ, ὡς λέγουσιν, οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/024.yaml
  text: 'But to the rest of you in Thyatira I say: all who do not hold this teaching[a], who have not known the deep things of Satan, as they call them—I am not laying any other burden on you.'
translation:
  language: ru
  text: 'А вам, остальным в Фиатире, — всем, кто не держится этого учения и не познал глубин Сатаны, как они говорят,[a] — говорю: не возлагаю на вас иного бремени.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «так называемых глубин Сатаны». Греческая фраза может полемически откликаться на притязание обладать особым «глубоким» знанием; неясно, кому именно принадлежат эти слова целиком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς λοιποῖς τοῖς ἐν Θυατείροις
  choice: остальным в Фиатире
  rationale: Передаёт оставшуюся часть общины, противопоставленную сторонникам упомянутого учения, без добавления отсутствующего в греческом тексте существительного.
- source_word: ἔχουσιν τὴν διδαχὴν ταύτην
  choice: держится этого учения
  rationale: В данном контексте ἔχω обозначает принятие и приверженность учению; русский оборот естественно выражает эту связь, не усиливая её до активного исполнения.
- source_word: οἵτινες οὐκ ἔγνωσαν
  choice: кто не познал
  rationale: Глагол γινώσκω может подразумевать не только осведомлённость, но и приобщение или опыт; «не познал» сохраняет эту смысловую широту.
- source_word: τὰ βαθέα τοῦ Σατανᾶ
  choice: глубин сатаны
  rationale: Буквально и ёмко передаёт образ «глубин», сохраняя возможную иронию по отношению к притязаниям на тайное духовное знание.
- source_word: ὡς λέγουσιν
  choice: как они говорят
  rationale: Сохраняет сжатость и неоднозначность греческой формулировки относительно того, кто именно и в каком смысле употребляет это обозначение.
- source_word: οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος
  choice: не возлагаю на вас иного бремени
  rationale: Естественно передаёт идиому βάλλω ἐπί и сохраняет метафору налагаемой обязанности; «бремя» соответствует возвышенному, но понятному регистру Откровения.
theological_decisions:
- issue: Смысл выражения «глубины сатаны, как они говорят»
  choice: Сохранить прямую, сжатую формулировку без уточнения, является ли она самообозначением лжеучителей или полемической характеристикой Иоанна.
  alternative: Уточнить, что учители называли своё знание «глубинами», а Иоанн приписывает его сатане; либо представить всё выражение как их собственное название.
  rationale: Греческий текст допускает несколько способов связать ὡς λέγουσιν с предшествующей фразой. Уточнение сняло бы намеренно сохранённую риторическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Порядок фразы перестроен для ясности, а парные определения «всем, кто… кто…» сохраняют охват греческих конструкций. Тире отделяют адресатов от главного сообщения.
