  text: οὕτως ἔχεις καὶ σὺ κρατοῦντας τὴν ⸀διδαχὴν Νικολαϊτῶν ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/015.yaml
  text: So you also have those who hold to the teaching of the Nicolaitans likewise[a].
translation:
  language: ru
  text: Так и у тебя есть те, кто держатся учения николаитов так же[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подобным образом». Греческое слово может подчёркивать, что эти люди сходны с упомянутыми в предыдущем стихе.'
    reason: Лексическая и синтаксическая неоднозначность наречия ὁμοίως.
lexical_decisions:
- source_word: οὕτως
  choice: Так
  rationale: Передаёт сравнительно-следственную связь с обличением в предыдущем стихе и естественно вводит русскую фразу.
- source_word: ἔχεις
  choice: у тебя есть
  rationale: Сохраняет прямоту греческого глагола; по контексту речь идёт о людях, находящихся среди общины.
- source_word: καὶ σὺ
  choice: и у тебя
  rationale: 'Передаёт подчёркнутое сопоставление: такие люди есть также и в Пергаме.'
- source_word: κρατοῦντας
  choice: те, кто держится
  rationale: Выражает устойчивую приверженность учению, не усиливая значение до более экспрессивного «крепко держится».
- source_word: διδαχὴν
  choice: учения
  rationale: Современное и естественное соответствие, менее узкоконфессиональное, чем «доктрина».
- source_word: Νικολαϊτῶν
  choice: николаитов
  rationale: Использована закрепившаяся в русской библейской традиции форма названия этой группы.
- source_word: ὁμοίως
  choice: подобным образом
  rationale: Сохраняет сравнительное значение наречия и его связь с предшествующим стихом; положение во фразе допускает отнесение как к характеру приверженности, так и к более широкому сопоставлению.
theological_decisions:
- issue: Синтаксическая связь ὁμοίως
  choice: «подобным образом» помещено перед «держится», при сохранении связи всей фразы с предыдущим стихом
  alternative: «Так же и у тебя есть те, кто держится учения николаитов»
  rationale: 'Греческий текст допускает небольшую неоднозначность: наречие может характеризовать то, как они держатся учения, либо выражать общее сопоставление с людьми из предыдущего стиха. Перевод не отождествляет прямо два учения и не устраняет эту напряжённость.'
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, прямая и достойная по тону. Сохранены обращение в единственном числе и связь с предыдущим обличением.
