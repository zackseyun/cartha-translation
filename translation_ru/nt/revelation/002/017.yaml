id: REV.2.17
reference: Revelation 2:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω ⸀αὐτῷ τοῦ μάννα τοῦ κεκρυμμένου, καὶ δώσω αὐτῷ ψῆφον λευκήν, καὶ ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/017.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give some of the hidden manna, and I will give him a white stone, and a new name written on it[c][b], which no one knows except the one who receives it.
translation:
  language: ru
  text: У кого есть ухо, пусть услышит, что Дух говорит церквам. Тому, кто побеждает[a], Я дам скрытой манны и белый камень[b], на котором написано новое имя, которого никто не знает, кроме того, кто получает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тому, кто одерживает победу»; также возможно: «тому, кто преодолевает».'
    reason: lexical_alternative
  - marker: b
    text: Белый камень мог напоминать камешек для голосования, знак оправдания или жетон, дававший право на вход; сам текст не уточняет, какой именно обычай подразумевается.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: У кого есть ухо
  rationale: Сохранено единственное число греческой устойчивой формулы; русская конструкция звучит естественнее буквального «имеющий ухо» и не меняет её обобщённого смысла.
- source_word: ἀκουσάτω
  choice: пусть услышит
  rationale: Передаёт повелительное значение аориста и согласуется с обобщённым лицом в единственном числе.
- source_word: τὸ πνεῦμα
  choice: Дух
  rationale: Контекст указывает на Божьего Духа, однако определение «Святой» в греческом тексте отсутствует и не добавляется.
- source_word: ταῖς ἐκκλησίαις
  choice: церквам
  rationale: Общепринятое и уместное в контексте Откровения обозначение адресуемых общин.
- source_word: τῷ νικῶντι
  choice: Тому, кто побеждает
  rationale: Настоящее причастие передано как продолжающаяся характеристика человека; сохранён образ победы, важный для Откровения.
- source_word: τοῦ μάννα τοῦ κεκρυμμένου
  choice: скрытой манны
  rationale: Родительный падеж после «дам» естественно выражает часть или долю вещества; «скрытой» передаёт состояние того, что было сокрыто.
- source_word: ψῆφον λευκήν
  choice: белый камень
  rationale: Нейтральная передача не выбирает одну из возможных историко-культурных функций такого камня.
- source_word: ἐπὶ τὴν ψῆφον
  choice: на камне
  rationale: Естественно обозначает место, где написано имя.
- source_word: ὄνομα καινὸν γεγραμμένον
  choice: написанное новое имя
  rationale: Сохранены значение нового имени и результат совершённого написания; порядок слов приспособлен к русскому синтаксису.
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων
  choice: которого никто не знает, кроме того, кто его получает
  rationale: Относительное предложение отнесено к «имени», как требует грамматическая связь; «получает» сохраняет настоящее значение причастия.
theological_decisions:
- issue: Обобщённое лицо в единственном числе
  choice: 'Сохранить единственное число: «у кого есть ухо», «тому, кто побеждает», «ему».'
  alternative: Передать обращение множественным числом или безличной конструкцией.
  rationale: Греческий текст последовательно использует единственное число с обобщённым значением; русский текст может сохранить эту форму без ограничения обещания только мужчинами.
- issue: Значение белого камня
  choice: Оставить образ без однозначного толкования.
  alternative: Назвать его знаком оправдания, камнем для голосования или пропуском на пир.
  rationale: Сам стих не объясняет символ; конкретизация устранила бы намеренную интерпретационную открытость.
- issue: Смысл скрытой манны
  choice: Передать буквально как «скрытая манна», не раскрывая символ в основном тексте.
  alternative: Истолковать её как небесную пищу, эсхатологическую награду или Самого Христа.
  rationale: Текст обещает скрытую манну, но не устанавливает здесь единственного толкования этого образа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Единственное число в начальной формуле и повторение «дам» сохранены вслед за греческим текстом; символические образы не истолкованы внутри перевода.
