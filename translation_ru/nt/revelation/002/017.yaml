revisions:
- from: У кого есть ухо, пусть услышит, что Дух говорит церквам. Тому, кто побеждает[a], Я дам скрытой манны и дам ему белый камень[b], а на камне — написанное новое имя, которого никто не знает, кроме того, кто его получает.
  to: У кого есть ухо, пусть услышит, что Дух говорит церквам. Тому, кто побеждает[a], Я дам скрытой манны и белый камень[b], на котором написано новое имя, которого никто не знает, кроме того, кто получает.
  rationale: 'Перестроено только описание имени на камне: вместо калькированной и стилистически затруднённой конструкции использовано естественное русское относительное предложение. Финальное «кто получает» оставлено без названного объекта, как и греческое ὁ λαμβάνων, чтобы не решать, относится ли получение непосредственно к камню, имени или к дару как целому. Сноски сохранены, при этом «пропуск» уточнён как жетон, дававший право на вход.'
