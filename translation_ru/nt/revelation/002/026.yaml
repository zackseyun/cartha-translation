source:
  edition: SBLGNT
  text: καὶ ὁ νικῶν καὶ ὁ τηρῶν ἄχρι τέλους τὰ ἔργα μου, δώσω αὐτῷ ἐξουσίαν ἐπὶ τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/026.yaml
  text: And to the one who conquers and keeps my works until the end[a], I will give authority over the nations[c][b],
translation:
  language: ru
  text: И тому, кто побеждает и до конца соблюдает Мои дела[a], Я дам власть над народами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение «Мои дела» может означать дела, принадлежащие Иисусу или соответствующие Ему: Его собственные дела, Его замыслы либо дела, которых Он требует; греческий текст не уточняет эту связь.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте употреблены формы мужского рода единственного числа («тому, кто…»), имеющие здесь обобщающий смысл.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ νικῶν
  choice: тому, кто побеждает
  rationale: Субстантивированное причастие настоящего времени обозначает человека, которого характеризует победа; «побеждает» сохраняет деятельный образ борьбы, характерный для Откровения.
- source_word: ὁ τηρῶν
  choice: соблюдает
  rationale: τηρέω здесь передаёт верное хранение и исполнение; «соблюдает» естественно сочетается с «делами», не сводя значение исключительно к повиновению или охране.
- source_word: ἄχρι τέλους
  choice: до конца
  rationale: Прямо передаёт продолжительность верности вплоть до конечного момента.
- source_word: τὰ ἔργα μου
  choice: Мои дела
  rationale: 'Сохраняет буквальную и намеренно неуточнённую связь: это могут быть дела Христа, дела, соответствующие Ему, либо дела, которых Он требует.'
- source_word: δώσω αὐτῷ
  choice: Я дам
  rationale: Косвенный объект уже выражен начальным «тому»; «дам» прямо передаёт будущее время δίδωμι без ненужного повторения местоимения.
- source_word: ἐξουσίαν
  choice: власть
  rationale: В контексте управления народами слово обозначает предоставленное право властвовать; русское «власть» здесь естественнее и точнее общего «силу».
- source_word: ἐπὶ τῶν ἐθνῶν
  choice: над народами
  rationale: ἐπί с родительным выражает власть над кем-либо; ἔθνη в Откровении естественно означает народы мира, а не только язычников в противопоставлении иудеям.
theological_decisions:
- issue: Репрезентативная форма мужского рода единственного числа
  choice: «тому, кто»
  alternative: «тем, кто» / «всякому, кто»
  rationale: Греческий текст использует формы мужского рода единственного числа в обобщающем смысле. Русская конструкция «тому, кто» сохраняет число и естественно выступает как общая, не ограниченная мужчинами.
- issue: Смысл выражения «Мои дела»
  choice: Сохранить «Мои дела»
  alternative: «дела, которых Я требую» / «то, что Я заповедал»
  rationale: Родительная связь в греческом тексте не уточнена. Буквальная формулировка не навязывает более узкого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной библейской интонацией. Синтаксис следует греческому обращению к победителю, избегая архаизмов и излишней конфессиональной конкретизации.
