  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι τὴν ἀγάπην σου τὴν πρώτην ἀφῆκες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/004.yaml
  text: 'But I have this against you: you have abandoned your first love[a].'
translation:
  language: ru
  text: Но имею против тебя то, что ты оставил свою первую любовь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покинул свою первую любовь». Эти слова могут означать любовь, которая была у тебя вначале: к Господу, друг к другу — или и то и другое.'
    reason: Лексическая альтернатива и сохранение неоднозначности того, к кому относится любовь.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Противительный союз резко противопоставляет упрёк предшествующей похвале; «но» естественно передаёт этот переход.
- source_word: ἔχω κατὰ σοῦ
  choice: имею против тебя
  rationale: Сохраняет образ обвинения или претензии, выраженный оборотом ἔχω κατά с родительным падежом, и остаётся понятным по-русски.
- source_word: ὅτι
  choice: то, что
  rationale: Вводит содержание упрёка, не придавая конструкции причинного смысла, который могло бы внести «потому что».
- source_word: τὴν ἀγάπην σου τὴν πρώτην
  choice: свою первую любовь
  rationale: 'Буквально и лаконично сохраняет как значение ἀγάπη, так и многозначность πρώτην: речь может идти о любви, бывшей вначале, без уточнения её объекта.'
- source_word: ἀφῆκες
  choice: оставил
  rationale: Передаёт значение «оставить, покинуть» без излишнего усиления; более тяжёлое «оставил навсегда» или «отрёкся» выходило бы за пределы греческого текста.
theological_decisions:
- issue: К кому или чему относится «первая любовь»
  choice: Сохранено буквальное «свою первую любовь» без уточнения объекта любви.
  alternative: «любовь ко Мне, которая была у тебя вначале»; «любовь, которую ты имел вначале»; «прежнюю любовь»
  rationale: Греческое выражение не уточняет, имеется ли в виду любовь к Господу, друг к другу или обе; перевод сохраняет эту намеренную или контекстуальную открытость.
- issue: Степень силы глагола ἀφῆκες
  choice: «оставил»
  alternative: «покинул»; «оставил позади»; «утратил»
  rationale: «Оставил» сохраняет деятельный характер глагола и не превращает поступок в невольную утрату; при этом оно не усиливает смысл до окончательного отречения.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной и слегка судебной формулировкой упрёка. Местоимение «ты» соответствует обращению к ангелу церкви в единственном числе; прописные формы, отсутствующие в исходном тексте, не вводятся.
