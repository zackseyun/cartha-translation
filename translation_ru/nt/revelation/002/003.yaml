reference: Revelation 2:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ὑπομονὴν ἔχεις, καὶ ἐβάστασας διὰ τὸ ὄνομά μου, καὶ ⸂οὐ κεκοπίακες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/003.yaml
  text: And you have endurance[a], and have borne up for my name[b], and have not grown weary.
translation:
  language: ru
  text: И у тебя есть стойкость, и ты выдержал ради Моего имени[a], и не изнемог[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за Моего имени», «во имя Моё».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не устал». Употреблённое здесь слово может обозначать как утомление, так и тяжёлый труд; поэтому возможен смысл: «не утомился от труда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴν
  choice: стойкость
  rationale: Передаёт твёрдую выдержку в испытаниях, не сужая смысл до пассивного терпения или только активной настойчивости.
- source_word: ἔχεις
  choice: у тебя есть
  rationale: Прямо передаёт настоящее время и нынешнее качество адресата; по-русски звучит естественно.
- source_word: ἐβάστασας
  choice: ты выдержал
  rationale: В данном контексте βαστάζω означает переносить тяготы, держаться под бременем. «Выдержал» естественно передаёт завершённое действие и не повторяет дословно существительное «стойкость».
- source_word: διὰ τὸ ὄνομά μου
  choice: ради Моего имени
  rationale: Передаёт возможное значение причины или основания верности Иисусу и сохраняет библейский образ имени, не конкретизируя характер испытаний.
- source_word: οὐ κεκοπίακες
  choice: не изнемог
  rationale: 'Передаёт достигнутую усталость или истощение, отрицаемое формой перфекта: адресат не дошёл до состояния изнеможения. При этом сохраняется контекстуальная связь слова с тяжёлым трудом.'
theological_decisions:
- issue: Характер стойкости и переносимых тягот
  choice: Стих хвалит продолжительную стойкость и способность выдерживать ради имени Иисуса, не уточняя, шла ли речь именно о гонениях, служении или иной тяжёлой работе.
  alternative: 'Последнюю часть можно теснее связать с трудом: «ты не утомился от труда».'
  rationale: Греческий текст говорит о стойкости и усталости, но не называет конкретный вид страдания или труда; перевод не должен вносить отсутствующую конкретизацию.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным синтаксисом. Повтор союза «и» сохраняет последовательную структуру греческого текста. Заглавные буквы в «Моего» следуют принятому благоговейному оформлению речи Христа, не добавляя толкования.
