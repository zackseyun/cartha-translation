id: REV.2.14
reference: Revelation 2:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὀλίγα, ὅτι ἔχεις ἐκεῖ κρατοῦντας τὴν διδαχὴν Βαλαάμ, ὃς ⸂ἐδίδασκεν τῷ⸃ Βαλὰκ βαλεῖν σκάνδαλον ἐνώπιον τῶν υἱῶν Ἰσραήλ, ⸀φαγεῖν εἰδωλόθυτα καὶ πορνεῦσαι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/014.yaml
  text: 'But I have a few things against you: you have there some who hold to the teaching of Balaam[a], who taught Balak to put a stumbling block before the sons of Israel, to eat food sacrificed to idols and to commit sexual immorality.'
translation:
  language: ru
  text: 'Но у Меня есть кое-что против тебя: есть у тебя там те, кто держится учения Валаама, который научил Валака положить перед сынами Израиля[a] камень преткновения, чтобы они ели принесённое в жертву идолам и предавались разврату.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед народом Израиля» или «перед израильтянами». Буквально: «перед сынами Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: кое-что
  rationale: Субстантивированное среднее множественное означает несколько предметов упрёка; «кое-что» естественно по-русски и не требует искусственного «несколько вещей».
- source_word: κρατοῦντας τὴν διδαχὴν
  choice: тех, кто держится учения
  rationale: κρατέω здесь обозначает стойкую приверженность учению, а не физическое удерживание; настоящее причастие передано описательной конструкцией.
- source_word: ἐδίδασκεν τῷ Βαλὰκ
  choice: научил Валака
  rationale: В данном повествовательном воспоминании имперфект может описывать осуществлявшееся наставление; совершенный русский глагол естественно выражает его результат, не добавляя отдельного содержания.
- source_word: βαλεῖν σκάνδαλον
  choice: поставить преткновение
  rationale: Сохранён образ σκάνδαλον как препятствия, ведущего к падению; «преткновение» — понятный в библейском регистре эквивалент без сведения образа только к ловушке или поводу ко греху.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: сынами Израиля
  rationale: Сохранена формальная мужская множественная форма исходного выражения и традиционное библейское обозначение народа.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: чтобы они ели принесённое в жертву идолам
  rationale: εἰδωλόθυτα обозначает пищу, принесённую в жертву идолам; субстантивированная конструкция лаконична и ясна в современном русском.
- source_word: πορνεῦσαι
  choice: предавались разврату
  rationale: πορνεύω обозначает недозволенное половое поведение в широком смысле; выражение сохраняет нравственную силу и не сужает значение до конкретной формы нарушения.
theological_decisions:
- issue: Передача τῶν υἱῶν Ἰσραήλ
  choice: сыны Израиля
  alternative: народ Израиля / израильтяне
  rationale: Основной текст сохраняет прямо выраженный мужской образ исходного языка и устойчивую библейскую формулу; более идиоматические варианты отмечены в сноске.
- issue: Степень буквальности при передаче σκάνδαλον
  choice: преткновение
  alternative: ловушку / повод ко греху
  rationale: Сохранён метафорический образ, допускающий и соблазнение, и вызванное им нравственное падение; толковательные варианты преждевременно сужают смысл.
- issue: Синтаксическая связь инфинитивов φαγεῖν и πορνεῦσαι
  choice: 'цель или результат поставленного преткновения: «чтобы они…»'
  alternative: 'приложение, поясняющее содержание преткновения: «а именно есть… и предаваться…»'
  rationale: Русское «чтобы они» естественно передаёт зависимость инфинитивов от βαλεῖν σκάνδαλον и обозначает задуманное следствие, не утверждая отдельной причинной схемы.
translation_notes:
  register: Современный литературный русский с достоинством библейского регистра. Сохранены формула «сыны Израиля» и метафора «преткновение»; устаревшие синтаксические обороты сведены к минимуму.
