id: REV.2.20
reference: Revelation 2:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι ἀφεῖς τὴν ⸀γυναῖκα Ἰεζάβελ, ἡ ⸀λέγουσα ἑαυτὴν προφῆτιν, καὶ διδάσκει καὶ πλανᾷ τοὺς ἐμοὺς δούλους πορνεῦσαι καὶ φαγεῖν εἰδωλόθυτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/020.yaml
  text: 'But I have this against you: you tolerate the woman Jezebel[c][b][a], who calls herself a prophetess and teaches and deceives my servants to commit sexual immorality and to eat food sacrificed to idols.'
translation:
  language: ru
  text: 'Но вот что Я имею против тебя: ты терпишь женщину Иезавель[a], которая называет себя пророчицей[b], учит Моих рабов и вводит их в заблуждение[c], побуждая предаваться половой распущенности и есть пищу, принесённую в жертву идолам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «твою жену Иезавель».'
    reason: textual_variant
  - marker: b
    text: 'Или: «которая утверждает, что она пророчица».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «сбивает их с пути».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт резкое противопоставление предшествующей похвале естественным современным русским союзом.
- source_word: ἔχω κατὰ σοῦ
  choice: вот что Я имею против тебя
  rationale: Естественно передаёт греческую идиому обвинения, сохраняя её прямую и серьёзную силу.
- source_word: ἀφεῖς
  choice: ты терпишь
  rationale: В контексте речь идёт о виновном попустительстве продолжающемуся вредному влиянию, а не просто о разрешении отдельного действия.
- source_word: τὴν γυναῖκα Ἰεζάβελ
  choice: женщину Иезавель
  rationale: Сохраняет основной текст SBLGNT и не вносит в него вариант «твою жену Иезавель».
- source_word: ἡ λέγουσα ἑαυτὴν προφῆτιν
  choice: которая называет себя пророчицей
  rationale: Точно передаёт самоназвание и явно выраженный в греческом женский род слова προφῆτις.
- source_word: διδάσκει
  choice: учит
  rationale: Простое настоящее время естественно выражает продолжающуюся, характерную для неё деятельность.
- source_word: πλανᾷ
  choice: вводит их в заблуждение
  rationale: Передаёт как обман, так и увод от истины; местоимение добавлено ради ясного и естественного русского синтаксиса.
- source_word: τοὺς ἐμοὺς δούλους
  choice: Моих рабов
  rationale: «Рабы» сохраняет смысл принадлежности и подчинения Христу, подчёркнутый притяжательным местоимением, и соответствует устойчивому русскому библейскому употреблению.
- source_word: πορνεῦσαι
  choice: предаваться половой распущенности
  rationale: Ясно обозначает недозволенное половое поведение без архаичного или чрезмерно узкого значения.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: есть пищу, принесённую в жертву идолам
  rationale: Понятно современному читателю раскрывает значение компактного греческого слова εἰδωλόθυτα.
theological_decisions:
- issue: Кем является «Иезавель»
  choice: Сохранить имя «Иезавель», не определяя, является ли оно настоящим именем женщины или символическим обозначением.
  alternative: Считать её буквально женщиной по имени Иезавель либо символически связать с ветхозаветной Иезавелью.
  rationale: Сам стих не разрешает этот вопрос, поэтому перевод не устраняет подлинную неоднозначность.
- issue: Передача δοῦλος
  choice: Мои рабы
  alternative: Мои слуги
  rationale: В сочетании с притяжательным «Мои» слово подчёркивает принадлежность Христу и обязательность повиновения Ему; русское «рабы» сохраняет эту силу.
- issue: Связь глаголов διδάσκει и πλανᾷ с инфинитивами
  choice: 'Передать оба действия, а последующее поведение представить как их результат: «учит… и вводит… в заблуждение, побуждая…».'
  alternative: «учит и вводит в заблуждение… чтобы они…»
  rationale: Такой русский синтаксис остаётся близким к греческой конструкции и при этом ясно показывает, к чему ведёт её учение и обман, не уточняя сверх текста конкретный механизм влияния.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные формы «Я», «Моих» обозначают говорящего Христа по принятой русской издательской традиции. Выражение «половая распущенность» выбрано ради понятности, а описательная передача εἰδωλόθυτα — вместо менее прозрачного для многих читателей слова «идоложертвенное».
