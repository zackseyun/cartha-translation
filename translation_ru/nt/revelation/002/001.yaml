id: REV.2.1
reference: Revelation 2:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τῷ ἀγγέλῳ ⸀τῆς ἐν Ἐφέσῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ κρατῶν τοὺς ἑπτὰ ἀστέρας ἐν τῇ δεξιᾷ αὐτοῦ, ὁ περιπατῶν ἐν μέσῳ τῶν ἑπτὰ λυχνιῶν τῶν χρυσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/001.yaml
  text: 'To the angel of the church in Ephesus write: These things says the one who holds the seven stars in his right hand[a], who walks among the seven golden lampstands:'
translation:
  language: ru
  text: '«Ангелу[a] церкви в Эфесе напиши: Так говорит Тот, Кто держит семь звёзд в Своей правой руке и ходит среди семи золотых светильников:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестнику».'
    reason: Греческое слово может обозначать как ангела, так и человеческого вестника.
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ангелу
  rationale: Слово может обозначать как небесного ангела, так и человеческого вестника. Основной вариант сохраняет естественное для апокалиптического контекста значение, а иное возможное понимание вынесено в сноску.
- source_word: ἐκκλησίας
  choice: церкви
  rationale: В контексте христианской общины это наиболее точное и естественное соответствие в современном русском языке.
- source_word: γράψον
  choice: напиши
  rationale: Прямо передаёт аористный императив и естественно звучит как конкретное повеление.
- source_word: Τάδε λέγει
  choice: Так говорит
  rationale: Сохраняет торжественную пророческую формулу оригинала и при этом остаётся понятным современному читателю.
- source_word: κρατῶν
  choice: держит
  rationale: Передаёт значение твёрдого обладания или удерживания без избыточного истолкования образа.
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: в Своей правой руке
  rationale: Сохраняет конкретный образ оригинала; возвратное «Своей» естественно соотносит руку с говорящим.
- source_word: περιπατῶν ἐν μέσῳ
  choice: ходит среди
  rationale: Естественно передаёт движение посреди светильников, сохраняя живость образа.
- source_word: λυχνιῶν τῶν χρυσῶν
  choice: золотых светильников
  rationale: «Светильник» обозначает подставку для лампы, а не саму лампу, и обеспечивает согласованность с образностью Откровения 1.
theological_decisions:
- issue: Кого обозначает «ангел церкви»
  choice: В основном тексте сохранено «ангел»
  alternative: вестник
  rationale: Греческое ἄγγελος допускает оба значения. Апокалиптическая обстановка благоприятствует переводу «ангел», однако личность адресата остаётся спорной, поэтому возможное значение «вестник» сохранено в сноске без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Заглавные буквы в «Тот, Кто» и «Своей» ясно указывают на говорящего Христа, не добавляя нового содержания; синтаксис остаётся близким к греческой формуле.
