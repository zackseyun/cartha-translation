  source_fidelity: 'Текст точно передаёт греческий оригинал: дательный адресат («Ангелу церкви в Эфесе»), повеление «напиши», пророческая формула «Так говорит», а также оба причастных определения говорящего сохранены. «Среди» адекватно передаёт ἐν μέσῳ; «светильники» в данном контексте уместно передаёт λυχνίαι как светильники/подсвечники, а не сами лампы.'
