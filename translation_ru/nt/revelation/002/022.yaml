id: REV.2.22
reference: Revelation 2:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἰδοὺ βάλλω αὐτὴν εἰς κλίνην, καὶ τοὺς μοιχεύοντας μετ’ αὐτῆς εἰς θλῖψιν μεγάλην, ἐὰν μὴ ⸀μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/022.yaml
  text: Look[a], I am throwing her onto a bed, and those who commit adultery with her into great affliction[b], unless they repent of her works.
translation:
  language: ru
  text: Вот, Я повергаю её на постель[a], а тех, кто прелюбодействует с ней, — в великую скорбь[b], если они не покаются в её делах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на постель болезни». По-гречески буквально «на постель»; в контексте суда многие понимают это как постель страдания или болезни.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в великое бедствие». Здесь речь идёт о тяжёлом страдании и горе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Вот
  rationale: Современное и вместе с тем достойное вводное слово, привлекающее внимание к близкому и несомненному действию; не требует архаичного «се».
- source_word: βάλλω
  choice: Я повергаю
  rationale: Передаёт энергичность и судебный характер действия, а настоящее время сохраняет его яркую непосредственность.
- source_word: αὐτὴν εἰς κλίνην
  choice: её на постель
  rationale: κλίνη буквально означает постель или ложе. Основной текст не уточняет болезнь, поэтому возможный смысл постели болезни вынесен в сноску.
- source_word: τοὺς μοιχεύοντας μετ’ αὐτῆς
  choice: тех, кто прелюбодействует с ней
  rationale: Сохраняет прямое значение μοιχεύω и длительный характер действия причастия, не устраняя возможного символического измерения образа.
- source_word: εἰς θλῖψιν μεγάλην
  choice: в великую скорбь
  rationale: «Скорбь» естественно передаёт тяжёлое бедствие и страдание, сохраняя традиционную библейскую окраску без обязательного сведения выражения к специальной эсхатологической категории.
- source_word: ἐὰν μὴ μετανοήσωσιν
  choice: если они не покаются
  rationale: Прямо и естественно передаёт отрицательное условие; в русском контексте эта форма яснее обозначает условность суда, чем «если только не».
- source_word: ἐκ τῶν ἔργων αὐτῆς
  choice: в её делах
  rationale: При русском глаголе «покаяться» предложное сочетание «в делах» звучит естественно и передаёт, что покаяние должно относиться к совершаемым ею делам; местоимение множественного числа по контексту относится к её соучастникам.
theological_decisions:
- issue: Следует ли явно истолковать κλίνη как постель болезни или страдания
  choice: Сохранить буквальное «постель» в основном тексте
  alternative: «постель болезни» или «одр болезни»
  rationale: Контекст указывает на суд и допускает иронический образ постели страдания, однако само κλίνη не содержит обязательного указания на болезнь. Неоднозначность сохранена в тексте и пояснена сноской.
- issue: Является ли прелюбодеяние буквальным, духовным или одновременно тем и другим
  choice: Передать прямым выражением «прелюбодействует с ней»
  alternative: «разделяет с ней разврат» или «изменяет Богу вместе с ней»
  rationale: Глагол прямо обозначает прелюбодеяние. Символическая духовная сила возможна в контексте Откровения, но её не следует подставлять вместо конкретного образа исходного текста.
- issue: Чьи дела обозначены выражением τῶν ἔργων αὐτῆς
  choice: Сохранить «её дела»
  alternative: 'Вариантное чтение некоторых рукописей: «их дела»'
  rationale: Текст SBLGNT читает αὐτῆς, то есть «её». Это создаёт содержательно значимую связь между её делами и покаянием участвующих с ней; перевод не исправляет её на «их».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. «Вот» заменяет архаичное «се»; «повергаю» сохраняет силу пророческого суда. Пунктуационное тире облегчает чтение параллельной конструкции.
