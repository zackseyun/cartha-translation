  text: μετανόησον οὖν· εἰ δὲ μή, ἔρχομαί σοι ταχύ, καὶ πολεμήσω μετ’ αὐτῶν ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/016.yaml
  text: Therefore repent[a]. But if not, I am coming to you quickly[b], and I will make war against them with the sword of my mouth.
translation:
  language: ru
  text: Итак, покайся. Если же нет, Я скоро приду к тебе и буду воевать с ними[a] мечом Моих уст[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с ними». После глагола «воевать» выражение в данном контексте означает: «против них».'
    reason: lexical_alternative
  - marker: b
    text: «Меч Моих уст» — апокалиптический образ слова Христа как орудия суда.
    reason: cross_reference
lexical_decisions:
- source_word: μετανόησον
  choice: покайся
  rationale: Аористный повелительный глагол призывает к решительному покаянию; «покайся» кратко и точно передаёт нравственно-духовную силу выражения.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего обличения и естественно звучит в современном литературном русском языке.
- source_word: εἰ δὲ μή
  choice: а если нет
  rationale: Сохраняет условное предостережение и явное противопоставление, не сглаживая резкости исходного текста.
- source_word: ἔρχομαί σοι
  choice: Я приду к тебе
  rationale: Русское будущее естественно передаёт настоящее время с оттенком близкого предстоящего действия. Дательный σοι передан нейтрально как «к тебе»; враждебный характер действия выражен следующим предложением.
- source_word: ταχύ
  choice: скоро
  rationale: В контексте пришествия «скоро» естественно передаёт временную близость, при этом возможный оттенок быстроты или внезапности отмечен в сноске.
- source_word: πολεμήσω μετ’ αὐτῶν
  choice: сражусь с ними
  rationale: Глагол сохраняет военную образность. Русская конструкция «сражаться с кем-либо» однозначно выражает направленность против них, хотя μετά с родительным вне такого контекста обычно означает совместность.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: мечом
  rationale: Творительный падеж естественно передаёт инструментальное значение ἐν. Более узкое обозначение типа «большой меч» излишне конкретизировало бы образ.
- source_word: τοῦ στόματός μου
  choice: Моих уст
  rationale: Сохраняет необычный апокалиптический образ и зависимость родительного падежа, не заменяя его толкованием «Моим словом».
theological_decisions:
- issue: К кому обращено предостережение и против кого направлена война
  choice: Сохранено различие между приходом Христа «к тебе» и Его сражением «с ними».
  alternative: Представить всё собрание без различия объектом войны либо ограничить приход только лжеучителями.
  rationale: Единственное число σοι относится к адресату послания, тогда как αὐτῶν указывает на отдельную группу. Перевод сохраняет эту напряжённость и не уточняет сверх текста меру ответственности всей общины.
- issue: Характер «меча уст»
  choice: Апокалиптический образ сохранён буквально.
  alternative: Передать толкованием «Моим словом» или «силой Моего приговора».
  rationale: Образ является значимой частью языка Откровения; его разъяснение допустимо в сноске, но не должно вытеснять метафору из основного текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным регистром. Формы «Я» и «Моих» написаны с прописной буквы как относящиеся к Христу. Выражение «меч Моих уст» намеренно сохраняет возвышенную и необычную образность оригинала.
