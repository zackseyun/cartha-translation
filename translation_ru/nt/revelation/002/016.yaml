    rationale: 'Сноска о варианте значения ταχύ не компенсирует отсутствие примечания к «с ними». Для прозрачности исходного текста нужно привязать примечание к этому выражению: буквально μετά с родительным обычно означает «с», но после πολεμέω контекст требует значения «против».'
