id: REV.2.11
reference: Revelation 2:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. ὁ νικῶν οὐ μὴ ἀδικηθῇ ἐκ τοῦ θανάτου τοῦ δευτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/011.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches[b]. The one who conquers will certainly not be harmed by the second death.
translation:
  language: ru
  text: У кого есть ухо, пусть услышит, что Дух говорит церквам. Побеждающий[a] ни в коем случае не потерпит вреда от второй смерти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Преодолевающий».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вторая смерть не причинит ему никакого вреда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: У кого есть ухо
  rationale: Передаёт единственное число и обобщающий смысл субстантивированного причастия естественной современной русской формулой.
- source_word: ἀκουσάτω
  choice: пусть услышит
  rationale: Сохраняет побудительную силу аористного императива третьего лица и характерную формулу призыва.
- source_word: τί
  choice: что
  rationale: Естественно вводит содержание того, что Дух говорит церквам.
- source_word: τὸ πνεῦμα
  choice: Дух
  rationale: В повторяющемся рефрене Откровения это личный божественный говорящий; прописная буква обозначает вероятную отсылку к Святому Духу, не добавляя пояснения в текст.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время передано обычным русским настоящим временем, подходящим для повторяющейся формулы провозглашения.
- source_word: ταῖς ἐκκλησίαις
  choice: церквам
  rationale: В Откровении 2–3 речь идёт о конкретных общинах; «церкви» — ясный и устоявшийся контекстуальный эквивалент.
- source_word: ὁ νικῶν
  choice: Побеждающий
  rationale: Причастие настоящего времени обозначает человека, для которого характерна победа или преодоление; «побеждающий» сохраняет яркий образ победы и форму греческого выражения.
- source_word: οὐ μὴ
  choice: ни в коем случае не
  rationale: Передаёт усиленное отрицание οὐ μή без архаической русской конструкции.
- source_word: ἀδικηθῇ
  choice: не потерпит вреда
  rationale: В данном контексте пассивная форма ἀδικέω означает испытать ущерб или вред, а не только подвергнуться несправедливости.
- source_word: ἐκ τοῦ θανάτου τοῦ δευτέρου
  choice: от второй смерти
  rationale: Предлог ἐκ при пассивном глаголе указывает на источник вреда; русское «от» естественно сохраняет это отношение.
- source_word: τοῦ θανάτου τοῦ δευτέρου
  choice: вторая смерть
  rationale: Богословски значимое апокалиптическое выражение сохранено без истолковывающего расширения.
theological_decisions:
- issue: Кого обозначает «Дух»
  choice: Святой Дух, говорящий церквам
  alternative: пророческий дух в более общем смысле
  rationale: В повторяющемся рефрене Откровения Дух выступает божественным говорящим. Прописная буква отражает наиболее вероятного референта, не превращая перевод в пояснительный пересказ.
- issue: Обобщающий смысл форм единственного числа
  choice: сохранить единственное число в формулах «у кого есть ухо» и «побеждающий»
  alternative: перестроить во множественное число ради явной гендерной нейтральности
  rationale: Греческие формы стоят в грамматическом мужском роде и единственном числе, но имеют обобщающий смысл; русский перевод сохраняет их число и репрезентативную функцию без добавления мужского местоимения там, где оно не требуется.
- issue: Смысл выражения «вторая смерть»
  choice: сохранить выражение без поясняющей расшифровки
  alternative: раскрыть его как вечное осуждение или окончательный суд
  rationale: Само Откровение далее раскрывает значение выражения; здесь не следует устранять его богословскую ёмкость истолковывающей вставкой.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического воззвания. Сохранены краткость, единственное число слова «ухо», усиленное отрицание и богословски значимое выражение «вторая смерть». Маркеры английского консультационного слоя были соотнесены с теми словами, к которым фактически относятся его примечания.
