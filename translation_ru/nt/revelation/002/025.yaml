  text: πλὴν ὃ ἔχετε κρατήσατε ἄχρι οὗ ἂν ἥξω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/025.yaml
  text: Nevertheless[a], hold fast what you have until I come.
translation:
  language: ru
  text: Но[a] твёрдо держитесь того, что у вас есть, пока Я не приду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Только твёрдо держитесь того, что у вас есть, пока Я не приду».'
    reason: Лексическое значение πλὴν допускает не только противительную оговорку «но», но и ограничительное значение «только».
lexical_decisions:
- source_word: πλὴν
  choice: Но
  rationale: Частица вводит ограничение или оговорку по отношению к предшествующим словам. «Но» естественно передаёт противительно-ограничительный оттенок; возможное значение «только» сохранено в сноске.
- source_word: ὃ ἔχετε
  choice: того, что у вас есть
  rationale: Субстантивированное относительное выражение обозначает то, чем адресаты уже обладают. Русская формулировка естественна и не уточняет без основания, идёт ли речь об учении, верности или духовном достоянии.
- source_word: κρατήσατε
  choice: твёрдо держитесь
  rationale: Повелительная форма κρατέω призывает не выпускать и стойко сохранять имеющееся. «Твёрдо держитесь» передаёт настойчивость призыва и требует в русском родительного падежа.
- source_word: ἄχρι οὗ ἂν
  choice: пока
  rationale: Оборот указывает на будущую временную границу. «Пока» ясно и естественно связывает повеление с моментом прихода говорящего.
- source_word: ἥξω
  choice: Я не приду
  rationale: 'В сочетании с «пока» русское отрицание нормативно и не меняет смысла греческого утверждения: держаться следует до прихода говорящего. Глагол «приду» сохраняет как идею прибытия, так и эсхатологический оттенок без его конкретизации.'
theological_decisions:
- issue: Относится ли приход Иисуса именно к окончательному эсхатологическому пришествию или к посещению этой церкви для суда
  choice: «пока Я не приду» без уточнения характера и времени прихода
  alternative: «пока Я не приду судить» / «до Моего окончательного пришествия»
  rationale: Греческий текст не определяет здесь вид прихода. Перевод сохраняет эту богословскую неоднозначность и не добавляет толкования.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным увещевательным звучанием. Местоимение «Я» написано с прописной буквы как реплика Христа. Формулировка избегает архаичного порядка слов и не конкретизирует содержание того, что имеют адресаты.
