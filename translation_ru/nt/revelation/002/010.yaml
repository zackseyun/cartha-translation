id: REV.2.10
reference: Revelation 2:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀μηδὲν φοβοῦ ἃ μέλλεις ⸀πάσχειν. ⸀ἰδοὺ μέλλει ⸀βάλλειν ὁ διάβολος ἐξ ὑμῶν εἰς φυλακὴν ἵνα πειρασθῆτε, καὶ ⸀ἕξετε θλῖψιν ἡμερῶν δέκα. γίνου πιστὸς ἄχρι θανάτου, καὶ δώσω σοι τὸν στέφανον τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/010.yaml
  text: Do not fear what you are about to suffer[a]. Look, the devil is about to throw some of you into prison so that you may be tested, and you will have tribulation for ten days. Be faithful until death[c][b], and I will give you the crown of life.
translation:
  language: ru
  text: Не бойся того, что тебе предстоит претерпеть. Вот, дьявол собирается бросить некоторых из вас в тюрьму, чтобы вы были испытаны[a], и десять дней вы будете терпеть скорбь. Будь верен до смерти[b], и Я дам тебе венец жизни[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол может также означать «подвергнуты проверке» или «искушаемы»; в зависимости от контекста он обозначает испытание, проверку либо искушение.
    reason: lexical_alternative
  - marker: b
    text: «До смерти» может также означать «даже до самой смерти», то есть оставаться верным, даже если за это придётся умереть.
    reason: alternative_reading
  - marker: c
    text: Греческое слово στέφανος обозначает венок победителя или почётную награду, а не царскую диадему.
    reason: cultural_note
lexical_decisions:
- source_word: μηδὲν φοβοῦ
  choice: Не бойся
  rationale: Естественно передаёт запрет с μηδέν; дополнение раскрывается следующим относительным оборотом.
- source_word: ἃ μέλλεις πάσχειν
  choice: того, что тебе предстоит претерпеть
  rationale: «Предстоит» сохраняет направленность μέλλω на близкое будущее, а «претерпеть» передаёт πάσχω в контексте грядущих страданий.
- source_word: ἰδοὺ
  choice: Вот
  rationale: Современный и выразительный способ привлечь внимание к последующему сообщению без архаического оттенка.
- source_word: μέλλει βάλλειν
  choice: готов бросить
  rationale: Передаёт близость предстоящего действия; «бросить в тюрьму» естественно по-русски и сохраняет образность βάλλω.
- source_word: ὁ διάβολος
  choice: дьявол
  rationale: В контексте это устойчивое обозначение личного сверхъестественного противника, а не просто нарицательное «клеветник».
- source_word: ἐξ ὑμῶν
  choice: некоторых из вас
  rationale: Передаёт выделение части из всей группы.
- source_word: εἰς φυλακήν
  choice: в тюрьму
  rationale: φυλακή здесь обозначает заключение под стражу; «тюрьма» соответствует контексту и регистру.
- source_word: ἵνα πειρασθῆτε
  choice: чтобы вы были испытаны
  rationale: πειράζω допускает значения испытания, проверки и искушения; в контексте заключения и страданий «испытаны» наиболее непосредственно передаёт проверку верности, а неоднозначность отмечена в сноске.
- source_word: ἕξετε θλῖψιν ἡμερῶν δέκα
  choice: десять дней вы будете терпеть скорбь
  rationale: Перестройка делает фразу естественной по-русски, сохраняя длительность и весомое значение θλῖψις как тяжкого притеснения и страдания.
- source_word: γίνου πιστός
  choice: Будь верен
  rationale: Кратко и естественно выражает повеление войти в состояние верности и оставаться в нём.
- source_word: ἄχρι θανάτου
  choice: до смерти
  rationale: 'Сохраняет широту греческой фразы: верность до конца жизни и, если потребуется, перед лицом мученической смерти.'
- source_word: τὸν στέφανον τῆς ζωῆς
  choice: венец жизни
  rationale: Сохраняет генитивную конструкцию и традиционно понятный образ победной награды, не сводя её к царской короне.
theological_decisions:
- issue: Значение πειρασθῆτε при гонении, которое устраивает дьявол
  choice: испытаны
  alternative: искушаемы; подвергнуты проверке
  rationale: Контекст заключения и скорби указывает на проверку стойкости, однако глагол может включать оттенок искушения; возможные значения не исключаются и указаны в сноске.
- issue: Смысл ἄχρι θανάτου
  choice: до смерти
  alternative: до самой смерти; даже если придётся умереть
  rationale: Основной текст близок к греческому и не ограничивает смысл исключительно мученичеством, тогда как сноска сохраняет вероятный призыв быть верным даже ценой жизни.
- issue: Образ στέφανος
  choice: венец
  alternative: победный венок
  rationale: «Венец» сохраняет достоинство и библейскую образность; сноска уточняет, что речь идёт о наградном венке победителя, а не о царской диадеме.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического увещания. Синтаксис сделан естественным для широкого читателя; сохранены повелительный тон, переход от единственного числа к множественному и ключевые образы «скорби» и «венца жизни».
