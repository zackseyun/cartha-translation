id: REV.2.5
reference: Revelation 2:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πόθεν ⸀πέπτωκας, καὶ μετανόησον καὶ τὰ πρῶτα ἔργα ποίησον· εἰ δὲ μή, ἔρχομαί ⸀σοι, καὶ κινήσω τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς, ἐὰν μὴ μετανοήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/005.yaml
  text: Therefore remember from where you have fallen[a], and repent, and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you repent.
translation:
  language: ru
  text: Итак, вспомни, откуда ты пал[a], покайся и твори прежние дела. А если нет, Я приду к тебе и уберу твой светильник с его места[b], если не покаешься.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с какой высоты ты пал». Буквально по-гречески: «откуда ты пал»; некоторые понимают это как подразумеваемый образ высоты.'
    reason: lexical_alternative
  - marker: b
    text: В Откровении 1:20 светильник служит образом церкви.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: вспомни
  rationale: Настоящее повелительное наклонение призывает держать в памяти прежнее состояние; «вспомни» естественно передаёт прямое побуждение в современном русском.
- source_word: οὖν
  choice: итак
  rationale: Выражает вывод из предшествующего обличения и сохраняет логическую связь.
- source_word: πόθεν πέπτωκας
  choice: откуда ты пал
  rationale: Буквально сохраняет пространственную метафору и перфектный результат падения, не добавляя отсутствующего в греческом слова «высота» и не усиливая смысл до вероотступничества.
- source_word: μετανόησον / μετανοήσῃς
  choice: покайся / не покаешься
  rationale: «Покаяться» — ясный и устоявшийся русский эквивалент нравственно-духовного обращения, уместный в обоих употреблениях.
- source_word: τὰ πρῶτα ἔργα ποίησον
  choice: твори прежние дела
  rationale: Передаёт возвращение к делам, характерным для прежнего состояния; глагол «твори» сохраняет библейское достоинство речи и остаётся понятным.
- source_word: εἰ δὲ μή
  choice: а если нет
  rationale: Сохраняет краткость и резкость условного предупреждения.
- source_word: ἔρχομαί σοι
  choice: Я приду к тебе
  rationale: Настоящее время имеет живое будущее значение; по-русски «приду» звучит естественно и не добавляет толкования «против тебя», которого прямо нет в тексте.
- source_word: κινήσω
  choice: сдвину
  rationale: Сохраняет основное значение κινέω «двинуть, переместить» и в сочетании «с места» ясно выражает устранение, не стирая конкретный образ.
- source_word: τὴν λυχνίαν σου
  choice: твой светильник
  rationale: В русском библейском употреблении «светильник» естественно обозначает подставку для светильника и сохраняет символический образ из Откровения 1:20.
- source_word: ἐκ τοῦ τόπου αὐτῆς
  choice: с его места
  rationale: Естественно передаёт удаление предмета из занимаемого им положения.
theological_decisions:
- issue: Смысл падения
  choice: Сохранить метафору «откуда ты пал»
  alternative: «С какой высоты ты пал» или «как низко ты пал»
  rationale: Текст подразумевает пространственный образ, но прямо не называет высоту и не определяет падение как окончательное отпадение.
- issue: Характер угрозы светильнику
  choice: Сохранить символический образ перемещения светильника
  alternative: Истолковать как утрату свидетельства, церковного статуса, существования общины или индивидуального спасения
  rationale: Откровение 1:20 связывает светильники с церквями, однако данный стих не формулирует более узкого систематического вывода; образ и богословское напряжение следует сохранить.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис сохраняет последовательность повелений и резкость предупреждения; символические образы не раскрываются внутри основного текста.
