  source_fidelity: Перевод точно передаёт противопоставление ἀλλά, эмфатическое «вот что у тебя есть», содержание через двоеточие, а также повтор μισέω — «ненавидишь / ненавижу». Прямым объектом ненависти остаются «дела николаитов», как и в греческом τὰ ἔργα τῶν Νικολαϊτῶν; текст не переносит осуждение непосредственно на людей.
  naturalness: Фраза краткая, понятная и соответствует современному литературному русскому с уместным библейским оттенком. Порядок слов «которые и Я ненавижу» несколько торжественен, но естественен для данного регистра и хорошо передаёт присоединительное κἀγώ.
  terminology: «Дела», «николаиты» и «ненавижу» употреблены точно и последовательно. Заглавное «Я» соответствует принятому русскому библейскому оформлению речи Христа. Сноска корректно предлагает «поступки» как лексический вариант, не меняя смысла.
