id: REV.2.6
reference: Revelation 2:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτο ἔχεις ὅτι μισεῖς τὰ ἔργα τῶν Νικολαϊτῶν, ἃ κἀγὼ μισῶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/006.yaml
  text: 'But this you have: you hate the works of the Nicolaitans[a], which I also hate.'
translation:
  language: ru
  text: 'Но вот что у тебя есть: ты ненавидишь дела[a] николаитов, которые и Я ненавижу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступки». Греческое слово обозначает действия или практику.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт противопоставление предшествующему контексту кратко и естественно.
- source_word: τοῦτο ἔχεις
  choice: вот что у тебя есть
  rationale: Сохраняет смысл греческого оборота и выделение τοῦτο, оставаясь естественным для современного русского языка.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι вводит содержание того, что имеется у адресата; двоеточие естественно выражает эту пояснительную связь.
- source_word: μισεῖς
  choice: ты ненавидишь
  rationale: Прямо передаёт сильное значение μισέω без смягчения и позволяет сохранить повтор того же глагола далее.
- source_word: τὰ ἔργα
  choice: дела
  rationale: Обозначает действия и практику николаитов; не переносит ненависть с их дел на самих людей.
- source_word: τῶν Νικολαϊτῶν
  choice: николаитов
  rationale: Устоявшаяся русская передача названия этой группы.
- source_word: ἃ
  choice: которые
  rationale: Относительное местоимение ясно относится к множественному существительному «дела».
- source_word: κἀγὼ
  choice: и Я
  rationale: Передаёт καὶ ἐγώ — присоединение говорящего к той же оценке — и сохраняет эмфатическое личное местоимение.
- source_word: μισῶ
  choice: ненавижу
  rationale: Повторяет тот же русский глагол, что и для μισεῖς, в соответствии с повтором μισέω в оригинале.
theological_decisions:
- issue: Объект ненависти
  choice: Ненависть направлена на дела николаитов.
  alternative: Формулировка, которая могла бы подразумевать ненависть к самим николаитам.
  rationale: Прямым дополнением в греческом тексте служит τὰ ἔργα, поэтому перевод не расширяет объект осуждения до самих людей.
- issue: Единство оценки говорящего и общины
  choice: «которые и Я ненавижу»
  alternative: «которые Я тоже ненавижу»
  rationale: Формулировка сохраняет прямую силу κἀγὼ и повтор глагола μισέω, не ослабляя сказанного.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная, но понятная. Заглавная буква в «Я» указывает на говорящего Христа в соответствии с принятой русской библейской традицией.
