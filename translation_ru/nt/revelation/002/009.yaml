  text: Οἶδά ⸀σου τὴν θλῖψιν καὶ τὴν πτωχείαν, ἀλλὰ πλούσιος εἶ, καὶ τὴν βλασφημίαν ἐκ τῶν λεγόντων Ἰουδαίους εἶναι ἑαυτούς, καὶ οὐκ εἰσίν, ἀλλὰ συναγωγὴ τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/009.yaml
  text: I know your affliction and your poverty—but you are rich—and the slander of those who say that they are Jews and are not[b][a], but are a synagogue of Satan.
translation:
  language: ru
  text: Я знаю твою скорбь и нищету — но ты богат — и злословие[a] со стороны тех, кто называет себя иудеями, но ими не являются, а они — синагога Сатаны.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «богохульство». Здесь слово обозначает враждебную, порочащую речь против верующих, поэтому в основном тексте стоит «злословие».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «синагога Сатаны» сохранено буквально. Слово «синагога» может также означать «собрание».
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  choice: скорбь
  rationale: Слово обозначает тяготы, притеснение и страдание. «Скорбь» естественно для возвышенного современного русского и не придаёт выражению узкого эсхатологического смысла.
- source_word: πτωχείαν
  choice: нищету
  rationale: πτωχεία указывает на бедность, вплоть до крайней нужды. «Нищета» сохраняет резкий контраст с последующим «ты богат».
- source_word: πλούσιος
  choice: богат
  rationale: Предикативное прилагательное оставлено без пояснения «духовно», поскольку греческий текст сохраняет подразумеваемый характер этого богатства.
- source_word: βλασφημίαν
  choice: злословие
  rationale: В контексте речь идёт о враждебной речи людей против верующих. «Злословие» передаёт это значение, не ограничивая слово современным значением «богохульства».
- source_word: ἐκ τῶν λεγόντων
  choice: тех, кто говорит
  rationale: ἐκ обозначает источник злословия; русская конструкция с родительным «злословие тех» естественно передаёт исходящую от них речь.
- source_word: Ἰουδαίους εἶναι ἑαυτούς
  choice: говорит о себе, что они иудеи
  rationale: Формулировка передаёт рефлексивное ἑαυτούς и сохраняет прямое наименование «иудеи», не добавляя отсутствующего в тексте определения «истинные».
- source_word: συναγωγὴ
  choice: синагога
  rationale: Слово может означать собрание, но здесь сохраняется его историческая и полемическая конкретность.
- source_word: τοῦ Σατανᾶ
  choice: сатаны
  rationale: Прямой родительный падеж сохраняет лаконичную и резкую силу греческого выражения.
theological_decisions:
- issue: Высказывание о тех, кто называет себя иудеями, но ими не является
  choice: Сохранить слово «иудеи» и прямое отрицание без поясняющих определений.
  alternative: «называют себя истинными иудеями» или «называют себя Божьим народом»
  rationale: Греческий текст прямо употребляет Ἰουδαίους и не уточняет характер отрицания. Перевод не должен ни превращать высказывание в явное отрицание этнического происхождения, ни заранее истолковывать его как исключительно заветную или духовную категорию.
- issue: Характер богатства адресатов
  choice: «но ты богат» без уточнения
  alternative: «но ты духовно богат»
  rationale: Контраст с материальной нищетой подразумевает иной вид богатства, однако в греческом тексте это не выражено отдельным словом.
translation_notes:
  register: Современный литературный русский с библейским достоинством, без архаических форм. Тире сохраняют резкое вводное противопоставление «но ты богат». Маркеры примечаний помещены после всего полемического высказывания, к которому относятся пояснения.
