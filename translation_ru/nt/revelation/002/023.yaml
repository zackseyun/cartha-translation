source:
  edition: SBLGNT
  text: καὶ τὰ τέκνα αὐτῆς ἀποκτενῶ ἐν θανάτῳ· καὶ γνώσονται πᾶσαι αἱ ἐκκλησίαι ὅτι ἐγώ εἰμι ὁ ἐραυνῶν νεφροὺς καὶ καρδίας, καὶ δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/023.yaml
  text: And I will kill her children with death[a], and all the churches will know that I am the one who searches hearts and minds[b], and I will give to each of you according to your works.
translation:
  language: ru
  text: И детей её Я поражу смертью[a], и все церкви узнают, что Я — Тот, Кто исследует сердца и мысли[b], и Я воздам каждому из вас по вашим делам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поражу мором». Буквально по-гречески: «убью смертью»; это выражение может усиливать суровость приговора или перекликаться с ветхозаветным языком суда.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «почки и сердца» — библейское обозначение сокровенного внутреннего мира человека, включая его мысли, побуждения и желания.'
    reason: cultural_note
lexical_decisions:
- source_word: τέκνα
  choice: детей
  rationale: Сохраняет обычное значение слова и не решает, имеются ли в виду родные дети или последователи.
- source_word: ἀποκτενῶ ἐν θανάτῳ
  choice: поражу смертью
  rationale: Передаёт смертельный приговор и сохраняет необычное повторение понятия смерти, а также возможную связь с ветхозаветным языком суда.
- source_word: πᾶσαι αἱ ἐκκλησίαι
  choice: все церкви
  rationale: В контексте Откровения речь идёт о христианских общинах; «церкви» — ясное и устоявшееся современное соответствие.
- source_word: ὁ ἐραυνῶν
  choice: Тот, Кто исследует
  rationale: Передаёт постоянное действие субстантивированного причастия и его торжественный судебный оттенок.
- source_word: νεφροὺς καὶ καρδίας
  choice: сердца и мысли
  rationale: Функционально передаёт библейское обозначение сокровенного внутреннего мира человека; порядок выбран естественный для современного русского языка, а буквальный образ указан в сноске.
- source_word: δώσω ὑμῖν ἑκάστῳ
  choice: воздам каждому из вас
  rationale: В контексте суда «воздам» естественно выражает смысл воздаяния, заключённый в сочетании с последующей фразой «по вашим делам».
- source_word: κατὰ τὰ ἔργα ὑμῶν
  choice: по вашим делам
  rationale: Сохраняет библейскую формулу личного воздаяния и лексическую связь слова ἔργα с человеческими делами.
theological_decisions:
- issue: Кого обозначают «её дети»
  choice: Оставить выражение без пояснения в основном тексте
  alternative: 'Уточнить: её родные дети или её последователи'
  rationale: Греческий текст допускает как буквальное, так и образное понимание, поэтому перевод не должен устранять эту неоднозначность.
- issue: Самоопределение говорящего как исследующего внутреннего человека
  choice: Сохранить сильную формулу «Я — Тот, Кто исследует…»
  alternative: Ослабить до общего утверждения о знании или наблюдении
  rationale: Текст приписывает воскресшему Иисусу глубокое знание внутреннего мира и власть Судьи; это необходимо передать без смягчения.
- issue: Характер воздаяния по делам
  choice: Передать судебный контекст глаголом «воздам», не уточняя вид награды или наказания
  alternative: Буквальное «дам» либо поясняющее «накажу»
  rationale: «Воздам» естественно выражает контекстуальное значение, но не сужает общую формулу до одного лишь наказания.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Заглавные буквы в «Я — Тот, Кто» подчёркивают прямое самоопределение говорящего, не добавляя толкования. Разделение на два предложения делает причинно-следственный переход более ясным; «тогда» передаёт результирующую связь, подразумеваемую последовательностью будущих действий.
