  rationale: «Умер» — естественная современная русская передача событийного ἐγένετο νεκρός; «ожил» точно и лаконично передаёт ἔζησεν в данном контексте. Примечание b сохраняет допустимую альтернативу со статическим «был мёртв». Открытая кавычка и двоеточие сохранены, поскольку прямая речь продолжается в следующем стихе.
