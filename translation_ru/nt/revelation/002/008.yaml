  terminology: «Ангелу» с примечанием «вестнику», «церкви», «Первый и Последний» и «ожил» удачно передают ключевые термины. Примечание b следует согласовать с основным чтением, чтобы оно представляло действительно альтернативный способ передачи греческой формулировки.
