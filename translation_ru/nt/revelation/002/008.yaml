  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Σμύρνῃ ἐκκλησίας γράψον· Τάδε λέγει ὁ πρῶτος καὶ ὁ ἔσχατος, ὃς ἐγένετο νεκρὸς καὶ ἔζησεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/008.yaml
  text: 'And to the angel of the church in Smyrna write: These things says the First and the Last[b][a], who became dead and lived again:'
translation:
  language: ru
  text: 'И ангелу[a] церкви в Смирне напиши: «Так говорит Первый и Последний, который умер и ожил[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестнику».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «который был мёртв и вновь ожил».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ангелу
  rationale: В апокалиптическом контексте Откровения основным значением избрано «ангел»; лексически возможное «вестник» сохранено в примечании.
- source_word: ἐκκλησίας
  choice: церкви
  rationale: Здесь слово обозначает христианскую общину; «церковь» естественно и точно передаёт этот смысл в современном русском языке.
- source_word: Τάδε λέγει
  choice: Так говорит
  rationale: Устойчивая и торжественная русская формула естественно передаёт греческое пророческое введение, не утяжеляя его буквальным «вот что говорит».
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: Первый и Последний
  rationale: Слова переданы как титул Христа с прописных букв, сохраняя параллелизм и отзвук божественного титула у Исаии.
- source_word: ἐγένετο νεκρὸς
  choice: был мёртв
  rationale: Это естественная русская передача в данном противопоставлении смерти и возвращения к жизни; буквальное «стал мёртвым» звучит неестественно, а событийный смысл ясно следует из контекста.
- source_word: ἔζησεν
  choice: ожил
  rationale: Глагол «ожил» кратко и естественно передаёт возвращение к жизни после смерти; вариант, подробнее отражающий последовательность событий, дан в примечании.
theological_decisions:
- issue: Христологический титул и формулировка воскресения
  choice: «Первый и Последний, Который был мёртв и ожил»
  alternative: «первый и последний, Который умер и вновь стал жить»
  rationale: Перевод сохраняет титульный характер самообозначения Христа и прямо передаёт Его смерть и возвращение к жизни, не добавляя догматического пояснения и не устраняя лаконичность греческого текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Формула «Так говорит» сохраняет библейскую ритмику; обращение и титул переданы без архаизмов. Открывающая кавычка оставлена незакрытой, поскольку стих вводит продолжающуюся далее прямую речь.
