id: REV.2.2
reference: Revelation 2:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οἶδα τὰ ἔργα σου, καὶ τὸν ⸀κόπον καὶ τὴν ὑπομονήν σου, καὶ ὅτι οὐ δύνῃ βαστάσαι κακούς, καὶ ἐπείρασας τοὺς λέγοντας ἑαυτοὺς ⸀ἀποστόλους, καὶ οὐκ εἰσίν, καὶ εὗρες αὐτοὺς ψευδεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/002.yaml
  text: I know your works[a], your labor, and your endurance, and that you cannot tolerate evil people. You tested those who call themselves apostles and are not[b], and you found them to be false.
translation:
  language: ru
  text: Знаю твои дела, твой тяжёлый труд и стойкость, а также то, что ты не можешь терпеть злых людей. Ты испытал тех, кто называет себя апостолами, но на самом деле ими не является, и обнаружил, что они — лжеапостолы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἶδα
  choice: Знаю
  rationale: Прямо передаёт глагол знания в настоящем значении и сохраняет личный, оценивающий тон обращения.
- source_word: ἔργα
  choice: дела
  rationale: Естественное и широкое соответствие, охватывающее поступки и деятельность; уместно для языка Откровения.
- source_word: κόπον
  choice: тяжёлый труд
  rationale: Передаёт не просто работу, а изнурительное усилие, заключённое в κόπος, оставаясь понятным современному читателю.
- source_word: ὑπομονήν
  choice: стойкость
  rationale: Выражает упорное сохранение верности под давлением; звучит естественно и не сводит смысл только к пассивному терпению.
- source_word: οὐ δύνῃ βαστάσαι
  choice: не можешь терпеть
  rationale: Сохраняет образное значение «нести/выносить» и в данном контексте естественно означает отказ мириться со злыми людьми.
- source_word: κακούς
  choice: злых людей
  rationale: Субстантивированное прилагательное обозначает людей; перевод ясно выражает личный референт без ненужного ограничения по полу.
- source_word: ἐπείρασας
  choice: испытал
  rationale: Передаёт проверку заявлений и качеств претендентов, сохраняя связь с основным значением πειράζω.
- source_word: λέγοντας ἑαυτοὺς ἀποστόλους
  choice: тех, кто называет себя апостолами
  rationale: Сохраняет возвратную силу ἑαυτούς и ясно показывает, что апостольский статус был их собственным притязанием.
- source_word: ἀποστόλους
  choice: апостолами
  rationale: В церковном контексте наиболее вероятно специальное значение авторитетных посланников, а не просто обычных вестников.
- source_word: ψευδεῖς
  choice: лжецы
  rationale: В русском предикативное «ложными» применительно к людям звучит менее естественно; «лжецы» ясно передаёт, что их притязание оказалось обманным, хотя несколько конкретизирует смысл прилагательного.
theological_decisions:
- issue: Статус людей, называвших себя ἀπόστολοι
  choice: Передать как церковный титул «апостолы».
  alternative: «посланники»
  rationale: Контекст испытания притязаний внутри церкви указывает на заявленный духовный авторитет. «Апостолы» сохраняет вероятный специальный смысл, не определяя при этом позднейшие институциональные вопросы.
- issue: Характер обвинения ψευδεῖς
  choice: «обнаружил, что они лжецы»
  alternative: «обнаружил, что они не те, за кого себя выдают» / «нашёл их ложными»
  rationale: «Лжецы» естественно по-русски и соответствует ложности их заявления, однако не уточняет, были ли ложными только их притязания или их характер в целом; исходная напряжённость обвинения сохраняется.
- issue: Значение οὐ δύνῃ βαστάσαι
  choice: «не можешь терпеть злых людей»
  alternative: «не в силах выносить злых людей»
  rationale: Фраза может описывать как неспособность, так и решительный отказ мириться со злом. Выбранный русский оборот сохраняет эту смысловую близость, не превращая её прямо в предписание или конфессиональное утверждение.
translation_notes:
  register: Современный литературный русский язык с достойным, прямым тоном. Синтаксис следует накопительной структуре греческого текста, но разделён на два предложения ради ясности. Местоимение «ты» уместно, поскольку обращение идёт к «ангелу церкви» в единственном числе.
