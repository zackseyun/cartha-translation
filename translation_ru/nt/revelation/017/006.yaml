source:
  edition: SBLGNT
  text: καὶ εἶδον τὴν γυναῖκα μεθύουσαν ἐκ τοῦ αἵματος τῶν ἁγίων ⸀καὶ ἐκ τοῦ αἵματος τῶν μαρτύρων Ἰησοῦ. Καὶ ἐθαύμασα ἰδὼν αὐτὴν θαῦμα μέγα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/006.yaml
  text: And I saw the woman drunk with the blood of the saints and with the blood of the martyrs of Jesus. And seeing her[a], I marveled greatly.
translation:
  language: ru
  text: И увидел я женщину, упоённую кровью святых и кровью свидетелей Иисуса[a]. Увидев её, я чрезвычайно изумился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мучеников Иисуса». Греческое слово может означать как «свидетелей», так и «мучеников»; упоминание их крови делает здесь значение «мученики» особенно уместным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθύουσαν ἐκ τοῦ αἵματος
  choice: упоённую кровью
  rationale: Причастие описывает состояние женщины, а ἐκ указывает на то, чем она опьянена. «Упоённую кровью» естественно и выразительно передаёт метафору, сохраняя её ужасающую силу.
- source_word: τῶν ἁγίων
  choice: святых
  rationale: В Откровении слово обозначает посвящённый Богу народ; «святых» — краткий, традиционный и понятный русский эквивалент.
- source_word: τῶν μαρτύρων Ἰησοῦ
  choice: свидетелей Иисуса
  rationale: μάρτυς прежде всего означает «свидетель», но в контексте пролитой крови включает смысл мученической смерти. Родительный Ἰησοῦ сохранён компактным оборотом «Иисуса», не устраняя возможных оттенков принадлежности Ему и свидетельства о Нём.
- source_word: ἐθαύμασα ... θαῦμα μέγα
  choice: чрезвычайно изумился
  rationale: Однокоренное сочетание усиливает глагол; наречное «чрезвычайно» естественно передаёт интенсивность θαῦμα μέγα без неестественного русского повтора.
- source_word: ἰδὼν αὐτήν
  choice: увидев её
  rationale: Деепричастный оборот близко и естественно передаёт аористное причастие и его связь с последующим изумлением.
theological_decisions:
- issue: Значение μαρτύρων в контексте гонений и пролитой крови
  choice: 'В основном тексте: «свидетелей Иисуса»; в сноске: «мучеников Иисуса».'
  alternative: «мучеников Иисуса»
  rationale: Основное значение слова — «свидетели», и тема свидетельства важна для Откровения. Упоминание крови делает смысл мученичества особенно уместным, поэтому он отмечен как контекстуально сильная лексическая альтернатива.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Инверсия «И увидел я» поддерживает повествовательную торжественность, не создавая архаической тяжеловесности.
