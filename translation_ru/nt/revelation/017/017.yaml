source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ἔδωκεν εἰς τὰς καρδίας αὐτῶν ποιῆσαι τὴν γνώμην αὐτοῦ, καὶ ποιῆσαι ⸂μίαν γνώμην⸃ καὶ δοῦναι τὴν βασιλείαν αὐτῶν τῷ θηρίῳ, ἄχρι ⸀τελεσθήσονται οἱ λόγοι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/017.yaml
  text: For God put it into their hearts to carry out his purpose[a], and to act with one purpose and to give their kingdom to the beast[b], until the words of God are fulfilled.
translation:
  language: ru
  text: Ибо Бог вложил им в сердца мысль исполнить свой замысел, принять единое решение[a] и отдать свою царскую власть зверю, пока не исполнятся слова Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «действовать с одной целью» или «быть единодушными». Буквально: «сделать одно решение (намерение)».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пока слова Бога не будут исполнены» или «пока не сбудутся слова Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν εἰς τὰς καρδίας αὐτῶν
  choice: вложил в их сердца
  rationale: Сохраняет образ сердца как средоточия внутренних решений и передаёт причиняющее действие Бога без ослабления до простого позволения.
- source_word: ποιῆσαι τὴν γνώμην αὐτοῦ
  choice: исполнить свой замысел
  rationale: γνώμη здесь обозначает намерение или замысел, а ποιῆσαι — его осуществление. Возвратное «свой» однозначно относит замысел к Богу, подлежащему предложения.
- source_word: ποιῆσαι μίαν γνώμην
  choice: принять единое решение
  rationale: Передаёт сжатое греческое выражение «сделать одно решение/намерение» естественным русским оборотом и подчёркивает согласованную волю правителей.
- source_word: δοῦναι τὴν βασιλείαν αὐτῶν
  choice: отдать свою царскую власть
  rationale: В данном контексте βασιλεία означает не столько территорию, сколько царствование или властные полномочия. Единственное число и совместный характер передачи власти сохранены.
- source_word: τῷ θηρίῳ
  choice: зверю
  rationale: Сохраняет устойчивый образ θηρίον в книге Откровение.
- source_word: ἄχρι τελεσθήσονται
  choice: пока не исполнятся
  rationale: Передаёт достижение завершения и одновременно естественно сочетается в русском языке с пророческими «словами Бога».
- source_word: οἱ λόγοι τοῦ θεοῦ
  choice: слова Бога
  rationale: Широкое и точное соответствие λόγοι, не сужающее смысл до отдельных изречений или постановлений.
theological_decisions:
- issue: Божественная суверенность и человеческое действие правителей
  choice: 'Прямо сказать, что Бог вложил решение в их сердца, сохранив при этом реальные действия самих правителей: они принимают решение и отдают власть.'
  alternative: Ослабить роль Бога словами «позволил» или «допустил» либо усилить текст детерминистским пояснением, которого нет в греческом.
  rationale: Греческий текст одновременно утверждает причиняющее действие Бога и осмысленные согласованные действия правителей; перевод сохраняет это напряжение, не разрешая его в пользу одной богословской схемы.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. «Ибо» сохраняет пояснительную связь γάρ; синтаксический параллелизм трёх инфинитивных действий сохранён. Специальная конфессиональная терминология и чрезмерно архаичные формы не используются.
