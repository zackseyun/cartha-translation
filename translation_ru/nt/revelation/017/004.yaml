  text: καὶ ἡ γυνὴ ἦν περιβεβλημένη πορφυροῦν καὶ κόκκινον, ⸀καὶ κεχρυσωμένη ⸀χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις, ἔχουσα ποτήριον χρυσοῦν ἐν τῇ χειρὶ αὐτῆς γέμον βδελυγμάτων καὶ τὰ ἀκάθαρτα τῆς πορνείας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/004.yaml
  text: And the woman was clothed in purple and scarlet[a], and adorned with gold and precious stones and pearls, holding in her hand a golden cup full of abominations and the unclean things of her sexual immorality.
translation:
  language: ru
  text: Женщина была одета в пурпурные и алые одежды и украшена золотом, драгоценным камнем и жемчугом. В руке она держала золотую чашу, полную мерзостей и нечистот её блуда.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также: «разврата» или «проституции». В Откровении греческое слово может одновременно указывать на половую распущенность и на духовную неверность, в том числе идолопоклонство.'
    reason: Лексическая альтернатива и сохранение буквального и метафорического смыслов πορνεία.
lexical_decisions:
- source_word: περιβεβλημένη
  choice: была одета
  rationale: Перифрастическая конструкция с ἦν описывает устойчивое состояние и сохраняет результативно-пассивный оттенок.
- source_word: πορφυροῦν καὶ κόκκινον
  choice: в пурпур и багряницу
  rationale: Названия роскошных тканей и цветов передают подразумеваемое одеяние; «багряница» сохраняет яркий алый оттенок κόκκινον и возвышенный апокалиптический регистр.
- source_word: κεχρυσωμένη
  choice: украшена
  rationale: Глагол обозначает богатое украшение золотом, а не обязательно сплошное золочение.
- source_word: χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις
  choice: золотом, драгоценным камнем и жемчугом
  rationale: 'Сохранено число исходного текста: λίθῳ τιμίῳ стоит в единственном числе, μαργαρίταις — во множественном.'
- source_word: ποτήριον χρυσοῦν
  choice: золотую чашу
  rationale: Прямое и естественное соответствие словосочетанию.
- source_word: γέμον
  choice: полную
  rationale: Кратко и естественно передаёт причастие, характеризующее чашу.
- source_word: βδελυγμάτων
  choice: мерзостей
  rationale: Сохраняет сильную нравственно-культовую окраску библейского термина.
- source_word: τὰ ἀκάθαρτα
  choice: нечистоты
  rationale: Субстантивированное среднее множественное передано собирательным существительным, сохраняющим нравственную и ритуальную окраску.
- source_word: πορνείας
  choice: разврата
  rationale: Современное русское слово достаточно широко обозначает половую распущенность и в символическом контексте допускает смысл неверности, не сводя образ только к коммерческой проституции.
theological_decisions:
- issue: Значение πορνεία в апокалиптическом образе женщины
  choice: разврат
  alternative: блуд; проституция
  rationale: «Разврат» сохраняет буквальную сексуальную образность и допускает метафорический смысл идолопоклонства и духовной неверности; «проституция» была бы уже, а «блуд» менее понятен части современных читателей.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным апокалиптическим звучанием. Синтаксис разделён на два предложения для естественности без утраты связей исходного текста; сохранено единственное число у «драгоценного камня».
