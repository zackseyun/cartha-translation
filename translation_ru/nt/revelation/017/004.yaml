  source_fidelity: 'Смысл исходника в целом передан точно: состояние женщины, её роскошное убранство, золотая чаша и два компонента её содержимого сохранены. Однако «в пурпур и багряницу» не вполне ровно по-русски: «пурпур» здесь воспринимается прежде всего как цвет, а «багряница» — как предмет одежды. Кроме того, «блуд» в апокалиптическом контексте точнее сохраняет одновременно сексуальный и образно-религиозный потенциал πορνεία, не истолковывая образ как одну лишь распущенность.'
