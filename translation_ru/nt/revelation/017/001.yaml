source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὸ κρίμα τῆς πόρνης τῆς μεγάλης τῆς καθημένης ἐπὶ ⸀ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/001.yaml
  text: Then one of the seven angels who had the seven bowls came and spoke with me[a], saying, “Come[b], I will show you the judgment of the great prostitute who sits on many waters,”
translation:
  language: ru
  text: 'И пришёл один из семи ангелов, у которых были семь чаш, и заговорил со мной: «Подойди, я покажу тебе суд[a] над великой блудницей, сидящей на многих водах».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осуждение великой блудницы» или «наказание великой блудницы».'
    reason: Лексема κρίμα может обозначать судебное решение, осуждение или последующее наказание; основной текст сохраняет более широкое значение «суд».
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Сохраняет повествовательную связь с предшествующим контекстом и естественно звучит в русском библейском повествовании.
- source_word: ἦλθεν
  choice: пришёл
  rationale: Прямо передаёт повествовательный аорист ἔρχομαι.
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: один из семи ангелов
  rationale: Естественная русская передача партитивной конструкции.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: у которых были семь чаш
  rationale: Определяет группу ангелов; «чаши» точно и традиционно передаёт φιάλαι в образном строе Откровения.
- source_word: ἐλάλησεν μετ’ ἐμοῦ λέγων
  choice: заговорил со мной
  rationale: Естественно объединяет глагол речи и причастие λέγων, сохраняя значение μετά с родительным — «со мной».
- source_word: Δεῦρο
  choice: Подойди
  rationale: Передаёт призыв приблизиться к говорящему; в данном контексте по-русски естественнее, чем буквальное и потенциально двусмысленное «иди сюда».
- source_word: δείξω σοι
  choice: я покажу тебе
  rationale: Прямая передача будущего времени греческого глагола.
- source_word: τὸ κρίμα
  choice: суд
  rationale: Сохраняет широкий судебный смысл κρίμα, не сужая его преждевременно до осуждения или кары.
- source_word: τῆς πόρνης τῆς μεγάλης
  choice: над великой блудницей
  rationale: «Блудница» — понятное современному читателю и одновременно достойное по регистру обозначение, сохраняющее резкую пророческую метафору πόρνη; предлог «над» естественно сочетается со словом «суд».
- source_word: τῆς καθημένης ἐπὶ ὑδάτων πολλῶν
  choice: сидящей на многих водах
  rationale: Сохраняет намеренно необычный апокалиптический образ и не подменяет ἐπί толкованием «у вод».
theological_decisions:
- issue: Метафорическое обозначение πόρνη применительно к Вавилону
  choice: великая блудница
  alternative: великая проститутка
  rationale: «Блудница» сохраняет пророческую метафору неверности и развращённости, не конкретизируя личность символического Вавилона и не снижая литературный регистр.
- issue: Значение κρίμα в апокалиптическом судебном контексте
  choice: суд
  alternative: осуждение; наказание
  rationale: «Суд» охватывает как приговор, так и его карательное осуществление, сохраняя смысловую широту греческого слова.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис умеренно формальный, но понятный обычному читателю; символические образы сохранены без поясняющего истолкования.
