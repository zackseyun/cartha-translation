  text: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν. αἱ ἑπτὰ κεφαλαὶ ἑπτὰ ὄρη εἰσίν, ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν. καὶ βασιλεῖς ⸂ἑπτά εἰσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/009.yaml
  text: 'Here is the mind that has wisdom: the seven heads are seven mountains on which the woman sits[a], and they are seven kings.'
translation:
  language: ru
  text: 'Здесь нужен ум, обладающий мудростью: семь голов — это семь гор[a], на которых сидит женщина, и семь царей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семь холмов». Греческое слово может обозначать как горы, так и холмы; «горы» — более прямой перевод.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὧδε
  choice: Здесь нужен
  rationale: В данном контексте слово вводит призыв к мудрому осмыслению видения; по-русски «Здесь нужен» естественно связывается с последующим образом ума, обладающего мудростью.
- source_word: ὁ νοῦς ὁ ἔχων σοφίαν
  choice: ум, обладающий мудростью
  rationale: Сохраняет прямые значения νοῦς и σοφία и передаёт артикль с причастным оборотом без замены мудрости более узким понятием «проницательность».
- source_word: αἱ ἑπτὰ κεφαλαὶ
  choice: семь голов
  rationale: Символический образ сохранён без истолковывающего расширения.
- source_word: ἑπτὰ ὄρη
  choice: семь гор
  rationale: Прямое и обычное соответствие ὄρη; возможное значение «холмы» отмечено в сноске, чтобы не навязывать отождествление с Римом.
- source_word: ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν
  choice: на которых сидит женщина
  rationale: Естественно по-русски передаёт совместный смысл ὅπου и ἐπ’ αὐτῶν, избегая неуклюжей пространственной избыточности.
- source_word: καὶ βασιλεῖς ἑπτά εἰσιν
  choice: и это семь царей
  rationale: Передаёт эллиптическое отождествление семи голов также с семью царями; «это» ясно отсылает к головам, не превращая фразу в отдельное сообщение о существовании царей.
theological_decisions:
- issue: Исторический смысл семи гор и семи царей
  choice: Сохранить данные самим стихом символические соответствия, не уточняя их исторического референта.
  alternative: Истолковать семь гор как семь холмов Рима, а семь царей — как конкретных императоров, правителей или царства.
  rationale: Греческий текст устанавливает соответствия, но сам по себе не определяет однозначно конкретную историческую схему; перевод не должен разрешать эту неоднозначность за читателя.
- issue: Связь «семи царей» с «семью головами»
  choice: 'Передать как второе отождествление семи голов: «и это семь царей».'
  alternative: 'Перевести без явного подлежащего: «и семь царей есть» или как отдельное существование: «и есть семь царей».'
  rationale: Греческая конструкция допускает подразумеваемое подлежащее из предыдущей части; выбранная русская формулировка сохраняет связь, не определяя, следует ли понимать царей как отдельных правителей или более широкие царства.
translation_notes:
  register: Современный литературный русский язык, сдержанный и торжественный без архаизмов. Формулировка сохраняет апокалиптическую образность и не вводит в основной текст отождествление с Римом.
