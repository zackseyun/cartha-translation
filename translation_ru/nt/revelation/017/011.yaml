  text: καὶ τὸ θηρίον ὃ ἦν καὶ οὐκ ἔστιν. καὶ ⸀αὐτὸς ὄγδοός ἐστιν καὶ ἐκ τῶν ἑπτά ἐστιν, καὶ εἰς ἀπώλειαν ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/011.yaml
  text: And the beast that was and is not is itself an eighth and is from the seven[b][a], and it goes to destruction.
translation:
  language: ru
  text: И зверь, который был и которого нет, сам — восьмой[a] и из семи[b], и идёт к погибели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сам — восьмой царь»; слово «царь» подразумевается из контекста, но в греческом тексте здесь не употреблено.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «один из семи». Более буквально греческий текст говорит «из семи», что может указывать на происхождение, принадлежность или тесную связь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: зверь
  rationale: В Откровении это устойчивое апокалиптическое обозначение чудовищной силы, противостоящей Богу; «зверь» сохраняет символический и межтекстовый смысл.
- source_word: ὃ ἦν καὶ οὐκ ἔστιν
  choice: который был и которого нет
  rationale: Формулировка сохраняет резкий параллелизм греческого текста и его перекличку с повторяющейся в главе формулой, не уточняя сверх текста временной смысл.
- source_word: αὐτὸς
  choice: сам
  rationale: Передаёт эмфатическое значение местоимения и естественно согласуется в русском языке со словом «зверь».
- source_word: ὄγδοός
  choice: восьмой
  rationale: В греческом употреблено субстантивированное порядковое числительное без явно названного существительного. Русское «восьмой» сохраняет эту лаконичность и не вводит в основной текст подразумеваемое слово «царь».
- source_word: ἐκ τῶν ἑπτά
  choice: из семи
  rationale: Буквально передаёт отношение происхождения или связи, выраженное предлогом ἐκ, не сводя неоднозначную фразу к более узкому толкованию «один из семи».
- source_word: εἰς ἀπώλειαν
  choice: к погибели
  rationale: «Погибель» ясно передаёт эсхатологическую гибель и обречённость, сохраняя торжественный библейский регистр без излишней архаичности.
- source_word: ὑπάγει
  choice: идёт
  rationale: Простая форма настоящего времени сохраняет непосредственность и образ движения в греческом тексте.
theological_decisions:
- issue: Следует ли явно добавить подразумеваемое существительное «царь» после «восьмой»
  choice: Оставить «восьмой» без добавления существительного в основном тексте.
  alternative: «восьмой царь»
  rationale: Контекст говорит о царях, поэтому такое восполнение возможно, однако слова βασιλεύς в данном стихе нет. Лаконичная передача сохраняет символическую неоднозначность, а возможное восполнение указано в сноске.
- issue: Следует ли истолковать ἐκ τῶν ἑπτά как «один из семи»
  choice: Перевести «из семи».
  alternative: «один из семи»
  rationale: Греческая фраза обозначает происхождение, принадлежность или тесную связь с семью, но не уточняет характер этой связи. Выбранный вариант не устраняет заложенную в тексте неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксическая краткость и повтор союза «и» сохраняют ритм исходного текста; тире естественно обозначает составное именное сказуемое.
