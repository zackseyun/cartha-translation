id: REV.17.16
reference: Revelation 17:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες καὶ τὸ θηρίον, οὗτοι μισήσουσι τὴν πόρνην, καὶ ἠρημωμένην ποιήσουσιν αὐτὴν καὶ ⸀γυμνήν, καὶ τὰς σάρκας αὐτῆς φάγονται, καὶ αὐτὴν κατακαύσουσιν ἐν πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/016.yaml
  text: And the ten horns that you saw[a], and the beast—these will hate the prostitute, and they will make her desolate and naked, and they will eat her flesh[b], and they will burn her up with fire.
translation:
  language: ru
  text: И десять рогов, которые ты видел, и зверь — они возненавидят блудницу, разорят её и оставят нагой[a], съедят её плоть[b] и сожгут её в огне дотла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обнажат». Греческое слово буквально означает «нагая»; здесь образ включает публичное обнажение и унижение.'
    reason: lexical_alternative
  - marker: b
    text: «Плоть» — буквальный перевод. В апокалиптической образности Откровения это выражение рисует полное насильственное уничтожение.
    reason: cultural_note
lexical_decisions:
- source_word: κέρατα
  choice: рога
  rationale: Сохранён сам апокалиптический образ, а не подставлено его истолкование («цари» или «силы»).
- source_word: θηρίον
  choice: зверь
  rationale: Обычный и точный русский эквивалент, сохраняющий зловещий символический образ Откровения.
- source_word: πόρνην
  choice: блудницу
  rationale: «Блудница» ясно передаёт значение слова в возвышенном библейском повествовании и не заменяет образ его толкованием.
- source_word: μισήσουσι
  choice: возненавидят
  rationale: Прямо передаёт будущее время и сильное значение μισέω.
- source_word: ἠρημωμένην ποιήσουσιν
  choice: разорят её
  rationale: 'Естественно по-русски передаёт результативный смысл: они приведут её в опустошённое, разорённое состояние.'
- source_word: γυμνήν
  choice: оставят нагой
  rationale: Сохраняет прямое значение «нагой» и одновременно естественно выражает результат действия; подразумеваемые обнажение и унижение разъяснены в сноске.
- source_word: σάρκας
  choice: плоть
  rationale: Буквально сохраняет жестокий апокалиптический образ, не смягчая его словом «тело».
- source_word: φάγονται
  choice: съедят
  rationale: Прямой эквивалент глагола «есть»; образ намеренно не смягчён и не заменён более толковательным «поглотят».
- source_word: κατακαύσουσιν ἐν πυρί
  choice: сожгут её в огне дотла
  rationale: «Сожгут дотла» передаёт усилительную силу κατακαίω, а «в огне» сохраняет явное ἐν πυρί.
- source_word: οὗτοι
  choice: они
  rationale: После тире русское ударное «они» естественно возобновляет составное подлежащее и сохраняет указание на совместно действующих участников.
theological_decisions:
- issue: Согласование «десяти рогов» и «зверя» с последующим множественным числом
  choice: Сохранить составное подлежащее и возобновить его после тире местоимением «они».
  alternative: Сгладить конструкцию, убрав возобновляющее местоимение, либо понять зверя как пояснение к рогам.
  rationale: Греческое οὗτοι с глаголами во множественном числе представляет рога и зверя как союзных деятелей; русская конструкция с тире передаёт этот акцент без неестественного буквализма.
- issue: Характер образа уничтожения блудницы
  choice: Сохранить символическую апокалиптическую картину без раскрытия её референта в основном тексте.
  alternative: Заменить «блудницу» истолкованием, например «городом» или «системой».
  rationale: Сам стих говорит посредством образа; перевод не должен заранее разрешать его символику или ослаблять напряжённость сцены.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис несколько торжественный, но понятный; повторяющаяся цепь действий уплотнена без утраты последовательности и жестокости исходного образа.
