id: REV.17.14
reference: Revelation 17:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὗτοι μετὰ τοῦ ἀρνίου πολεμήσουσιν, καὶ τὸ ἀρνίον νικήσει αὐτούς, ὅτι κύριος κυρίων ἐστὶν καὶ βασιλεὺς βασιλέων, καὶ οἱ μετ’ αὐτοῦ κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/014.yaml
  text: These will make war against the Lamb[a], and the Lamb will conquer them, because he is Lord of lords and King of kings, and those with him are called and chosen and faithful.
translation:
  language: ru
  text: Они будут воевать против Агнца[a], и Агнец победит их, потому что Он — Господь господ и Царь царей, и те, кто с Ним, — призванные, избранные и верные.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будут воевать с Агнцем»; в этом контексте речь идёт о войне против Него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Они
  rationale: Местоимение указывает на упомянутых ранее царей; по-русски «они» естественно сохраняет эту связь, тогда как буквальное «эти» здесь звучало бы обрывочно.
- source_word: μετὰ τοῦ ἀρνίου
  choice: против Агнца
  rationale: 'Хотя μετά с родительным падежом обычно означает «с», при πολεμέω контекст требует противительного смысла: вести войну против Агнца. Вариант «с Агнцем» ошибочно подразумевал бы союз.'
- source_word: ἀρνίον
  choice: Агнец
  rationale: Устоявшееся в русской библейской речи христологическое наименование из Откровения; оно сохраняет возвышенный апокалиптический регистр.
- source_word: πολεμήσουσιν
  choice: будут воевать
  rationale: Передаёт военный смысл глагола естественным современным русским языком и не сужает действие до одного сражения.
- source_word: νικήσει
  choice: победит
  rationale: Точно и естественно передаёт ключевой для Откровения мотив победы; в данном военном контексте яснее, чем «одолеет».
- source_word: ὅτι
  choice: потому что
  rationale: Ясно выражает причинную связь между победой Агнца и Его верховным владычеством.
- source_word: κύριος κυρίων
  choice: Господь господ
  rationale: Сохраняет традиционную титульную формулу превосходства и её христологическое применение к Агнцу.
- source_word: βασιλεὺς βασιλέων
  choice: Царь царей
  rationale: Естественная и устоявшаяся русская формула, выражающая высшую царскую власть.
- source_word: οἱ μετ’ αὐτοῦ
  choice: те, кто с Ним
  rationale: Естественно передаёт субстантивированное выражение и обозначает спутников или сторонников Агнца, не уточняя их тождество сверх текста.
- source_word: κλητοὶ
  choice: призванные
  rationale: Сохраняет новозаветный смысл призвания, не решая, идёт ли речь преимущественно о приглашении или действенном призыве.
- source_word: ἐκλεκτοὶ
  choice: избранные
  rationale: Прямо и доступно передаёт значение слова без привнесения поздней систематической терминологии.
- source_word: πιστοί
  choice: верные
  rationale: В сочетании с «призванные» и «избранные» выражает верность и стойкую преданность; при этом греческое слово также может иметь оттенок «верующие».
theological_decisions:
- issue: Титул Агнца и язык победы
  choice: «Агнец победит»
  alternative: «Агнец одолеет» или «Агнец восторжествует над ними»
  rationale: «Агнец» сохраняет характерный христологический титул Откровения, а «победит» — повторяющийся в книге мотив νικάω без добавочного толкования.
- issue: Три определения κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί
  choice: «призванные, избранные и верные»
  alternative: «призванные, избранные и верующие»
  rationale: Сохранены все три однородных определения и их порядок; перевод не разрешает конфессиональные споры о призвании и избрании. «Верные» лучше отражает в данном ряду стойкую принадлежность Агнцу, хотя возможен оттенок веры.
- issue: Связь заключительной группы с предыдущим сказуемым
  choice: 'Сохранить именную конструкцию: «и те, кто с Ним, — призванные, избранные и верные»'
  alternative: 'Добавить подразумеваемое действие: «и вместе с Ним победят призванные, избранные и верные»'
  rationale: В греческом тексте для спутников Агнца отдельный глагол победы не выражен. Перевод сохраняет синтаксическую сжатость и не добавляет прямо не названного участия в победе.
translation_notes:
  register: Современный литературный русский с сохранением возвышенного апокалиптического регистра. Традиционные титулы «Агнец», «Господь господ» и «Царь царей» оставлены ради межтекстовой узнаваемости; синтаксис сделан ясным для обычного современного читателя.
