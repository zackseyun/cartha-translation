  source_fidelity: Придаточное οὗ ἡ πόρνη κάθηται описывает место, где/на чём сидит блудница; по-русски «на которых сидит» точнее связывает этот образ именно с водами. ἔθνη в данном всеохватном перечне лучше передать «нации», а не более узким «племена».
  naturalness: «На которых сидит» звучит естественно и устраняет возможную шероховатость конструкции «воды, где сидит». Обычное русское перечисление без повторения союза перед каждым членом сохраняет ритм, не утяжеляя фразу.
  terminology: «Блудница» уместно сохраняет традиционный библейский и символический регистр для πόρνη. «Народы, толпы, нации и языки» воспроизводит четыре различающихся группы оригинала без добавления толкования.
