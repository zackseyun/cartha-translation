source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Τὰ ὕδατα ἃ εἶδες, οὗ ἡ πόρνη κάθηται, λαοὶ καὶ ὄχλοι εἰσὶν καὶ ἔθνη καὶ γλῶσσαι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/015.yaml
  text: And he says to me, “The waters that you saw, where the prostitute sits, are peoples and crowds and nations and languages.”
translation:
  language: ru
  text: 'И говорит он мне: «Воды, которые ты видел, на которых сидит блудница, — это народы, толпы, нации и языки».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρνη
  choice: блудница
  rationale: Традиционное и понятное в библейском контексте обозначение женщины, занимающейся проституцией; сохраняет символический и торжественный регистр Откровения.
- source_word: λαοί
  choice: народы
  rationale: Передаёт множественное число и широкий смысл групп населения.
- source_word: ὄχλοι
  choice: толпы
  rationale: Прямо передаёт значение многочисленных скоплений людей и сохраняет отличие от λαοί.
- source_word: ἔθνη
  choice: племена
  rationale: В четырёхчастном перечне позволяет отличить ἔθνη от λαοί; обозначает этнические общности без навязывания узко богословского смысла «язычники».
- source_word: γλῶσσαι
  choice: языки
  rationale: Сохраняет метонимическое обозначение языковых сообществ, обычное для Откровения.
- source_word: λέγει
  choice: говорит
  rationale: Историческое настоящее оригинала сохранено для живости повествования.
theological_decisions:
- issue: Символическое толкование вод
  choice: Сохранена прямая идентификация вод с человеческими общностями
  alternative: 'Передать как свободное пояснение: «воды символизируют...»'
  rationale: Оригинал использует связку εἰσίν («суть/являются»), не вводя отдельного глагола «символизируют».
- issue: Значение ἔθνη
  choice: племена
  alternative: язычники / нации
  rationale: Контекст перечисляет всеохватные человеческие общности; «язычники» внесло бы лишнее религиозное уточнение, а «нации» менее естественно и частично дублирует «народы».
translation_notes:
  register: Современный литературный русский с сохранением торжественной ритмики и повторяющегося союза καί в итоговом перечне. Порядок придаточного «где сидит блудница» оставлен близким к греческому, поскольку он понятен и сохраняет образную структуру стиха.
