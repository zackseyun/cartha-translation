id: REV.17.18
reference: Revelation 17:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἣν εἶδες ἔστιν ἡ πόλις ἡ μεγάλη ἡ ἔχουσα βασιλείαν ἐπὶ τῶν βασιλέων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/018.yaml
  text: And the woman whom you saw is the great city that has dominion over the kings of the earth[a].
translation:
  language: ru
  text: А женщина, которую ты видел, — это великий город, властвующий над царями земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «имеющий царство над царями земли». Греческое выражение буквально означает «имеющий царство» и может также подразумевать обладание царской властью или царским достоинством.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: женщина
  rationale: В контексте видения речь идёт о символической женской фигуре; «женщина» естественно передаёт значение слова, не добавляя смысла «жена».
- source_word: ἣν εἶδες
  choice: которую ты видел
  rationale: Прямо соотносит пояснение с женской фигурой, ранее увиденной Иоанном.
- source_word: πόλις ἡ μεγάλη
  choice: великий город
  rationale: Точная и естественная передача существительного с определением, сохраняющая апокалиптическое обозначение.
- source_word: ἔχουσα βασιλείαν
  choice: властвующий
  rationale: Оборот буквально означает «имеющий царство/царскую власть»; причастие «властвующий» ясно передаёт осуществляемое господство над царями, при этом иной возможный оттенок отмечен в сноске.
- source_word: βασιλεία
  choice: власть
  rationale: В сочетании с «над царями» слово указывает прежде всего на царское господство или правление, а не обязательно на территориальное царство.
- source_word: ἐπὶ τῶν βασιλέων
  choice: над царями
  rationale: Предлог с родительным падежом здесь выражает власть и превосходство.
- source_word: τῆς γῆς
  choice: земли
  rationale: В апокалиптическом контексте обозначает землю в широком, а не узко территориальном смысле.
theological_decisions:
- issue: Характер отождествления женщины с городом
  choice: «женщина… — это великий город»
  alternative: «женщина… представляет великий город»
  rationale: Греческий текст использует простую связку ἔστιν («есть»). Прямое отождествление сохраняет формулировку и напряжение символического образа, не заменяя её толкованием.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной библейской интонацией. Согласование «властвующий» относится к слову «город», которое является сказуемым-отождествлением.
