  yaml_path: translation/nt/revelation/017/005.yaml
  text: 'And on her forehead a name was written: Mystery[a], Babylon the Great, the mother of prostitutes and of the abominations of the earth.'
translation:
  language: ru
  text: 'И на её лбу было написано имя: «Тайна[a], Вавилон великий, мать блудниц и мерзостей земли».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «было написано имя — тайна: Вавилон великий, мать блудниц и мерзостей земли», если слово «тайна» вводит символический смысл имени, а не является частью самой надписи.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ τὸ μέτωπον αὐτῆς
  choice: на лбу у неё
  rationale: Естественно передаёт пространственное значение ἐπί с винительным и сохраняет образ надписи на лбу.
- source_word: ὄνομα γεγραμμένον
  choice: было написано имя
  rationale: Передаёт результативно-пассивное значение причастия γεγραμμένον естественной русской конструкцией.
- source_word: μυστήριον
  choice: Тайна
  rationale: В основном тексте понимается как часть написанного имени; прописная буква обозначает его титульную функцию и сохраняет апокалиптическое звучание.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Вавилон великий
  rationale: Передаёт имя собственное и определение ἡ μεγάλη без добавления отсутствующего в греческом слова; строчная буква в прилагательном соответствует нормам русского оформления составного наименования.
- source_word: ἡ μήτηρ
  choice: мать
  rationale: В русском приложении после составного имени нулевой артикль передаётся без отдельного определителя.
- source_word: τῶν πορνῶν
  choice: блудниц
  rationale: Точно передаёт πόρνη и сохраняет библейский нравственно-символический регистр; «проституток» звучало бы преимущественно социально-бытово.
- source_word: τῶν βδελυγμάτων
  choice: мерзостей
  rationale: Сохраняет сильную оценочную и библейско-культовую окраску βδέλυγμα, не сужая значение только до идолопоклонства.
- source_word: τῆς γῆς
  choice: земли
  rationale: В апокалиптическом контексте обозначает землю в широком смысле и по структуре относится к «блудницам» и «мерзостям».
theological_decisions:
- issue: Является ли μυστήριον частью надписи или пояснением символического смысла имени
  choice: 'В основном тексте «Тайна» включена в надпись: «Тайна, Вавилон великий…».'
  alternative: 'Понимать слово как вводное пояснение: «было написано имя — тайна: „Вавилон великий…“».'
  rationale: Греческий текст допускает оба пунктуационных истолкования. Последовательность слов позволяет считать μυστήριον частью имени, однако реальная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified библейско-апокалиптическим регистром. Сохранены традиционные и понятные слова «блудницы» и «мерзости»; синтаксис сделан естественным для современного читателя.
