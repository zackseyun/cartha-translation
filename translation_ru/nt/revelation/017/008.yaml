  to: Зверь, которого ты видел, был и нет его; он вот-вот поднимется из бездны и пойдёт к погибели. И живущие на земле, чьё имя не записано в книге жизни от основания мира, изумятся, увидев зверя, потому что он был, и нет его, и будет[a].
