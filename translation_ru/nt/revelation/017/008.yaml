id: REV.17.8
reference: Revelation 17:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὸ θηρίον ὃ εἶδες ἦν καὶ οὐκ ἔστιν, καὶ μέλλει ἀναβαίνειν ἐκ τῆς ἀβύσσου, καὶ εἰς ἀπώλειαν ⸀ὑπάγει· καὶ ⸀θαυμασθήσονται οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ὧν οὐ γέγραπται ⸂τὸ ὄνομα⸃ ἐπὶ τὸ βιβλίον τῆς ζωῆς ἀπὸ καταβολῆς κόσμου, βλεπόντων ⸂τὸ θηρίον ὅτι ἦν⸃ καὶ οὐκ ἔστιν καὶ παρέσται.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/008.yaml
  text: The beast that you saw was[a], and is not, and is about to come up out of the abyss and go to destruction. And those who dwell on the earth, whose name has not been written in the book of life from the foundation of the world, will marvel when they see the beast[c][b], because it was and is not and will be present.
translation:
  language: ru
  text: Зверь, которого ты видел, был и нет его; он вот-вот поднимется из бездны и пойдёт к погибели. И живущие на земле, чьё имя не записано в книге жизни от основания мира, изумятся, увидев зверя, потому что он был, и нет его, и будет[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изумятся, увидев зверя: он был, и нет его, и будет присутствовать (или: придёт, явится)». Греческое ὅτι может означать как «потому что», так и «что», а παρέσται указывает на будущее присутствие и в данном контексте может подразумевать прибытие или появление.'
    reason: alternative_reading
lexical_decisions:
- source_word: θηρίον
  choice: зверь
  rationale: Устоявшееся в русской библейской речи обозначение апокалиптического чудовища; сохраняет символическую и угрожающую силу слова.
- source_word: ἦν καὶ οὐκ ἔστιν
  choice: был, и нет его
  rationale: Передаёт резкий временной контраст и естественно звучит по-русски, не устраняя намеренного параллелизма контекста.
- source_word: μέλλει ἀναβαίνειν
  choice: вот-вот поднимется
  rationale: Передаёт оттенок близкого предстоящего действия у μέλλει и направленность вверх у ἀναβαίνειν.
- source_word: ἄβυσσος
  choice: бездна
  rationale: Точное и общепринятое апокалиптическое соответствие без добавочного образа «бездонной ямы».
- source_word: εἰς ἀπώλειαν ὑπάγει
  choice: пойдёт к погибели
  rationale: Сохраняет образ движения к окончательной гибели и не использует архаическое «в погибель идёт».
- source_word: θαυμασθήσονται
  choice: изумятся
  rationale: Естественно передаёт сильное удивление; пассивная греческая форма по-русски идиоматично выражается возвратным глаголом.
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: живущие на земле
  rationale: Сохраняет повторяющуюся формулу Откровения в ясной современной форме.
- source_word: ὧν οὐ γέγραπται τὸ ὄνομα
  choice: чьё имя не записано
  rationale: Сохранено грамматически значимое единственное число τὸ ὄνομα.
- source_word: ἐπὶ τὸ βιβλίον τῆς ζωῆς
  choice: в книге жизни
  rationale: Русская идиома требует «в книге», хотя греческий предлог буквально допускает представление записи «на» книге или свитке.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: от основания мира
  rationale: Формально точно сохраняет временную формулу и её богословский вес.
- source_word: βλεπόντων
  choice: увидев
  rationale: Деепричастие естественно связывает изумление с восприятием зверя и передаёт обстоятельственное значение причастия.
- source_word: ὅτι ἦν καὶ οὐκ ἔστιν καὶ παρέσται
  choice: потому что он был, и нет его, и он явится
  rationale: ὅτι понято причинно; «явится» передаёт будущую наличность или прибытие, выраженную παρέσται, естественнее буквального «будет присутствовать».
theological_decisions:
- issue: Временная отнесённость выражения ἀπὸ καταβολῆς κόσμου
  choice: 'Связано с «не записано в книге жизни»: «чьё имя не записано в книге жизни от основания мира».'
  alternative: Пытаться связать выражение с иной идеей на основании параллельных мест.
  rationale: Порядок слов и синтаксис данного стиха естественно относят оборот к записи имени; перевод не развивает это в отдельную систему предопределения.
- issue: Значение παρέσται
  choice: «явится» с примечанием о буквальном значении присутствия.
  alternative: «будет присутствовать» или «придёт».
  rationale: Форма будущего времени от πάρειμι обозначает будущую наличность и может подразумевать прибытие. Основной текст должен быть естественным по-русски, а примечание сохраняет лексическую неоднозначность.
- issue: Значение ὅτι
  choice: 'Причинное: «потому что».'
  alternative: 'Изъяснительное: «что он был, и нет его, и он явится».'
  rationale: Причинное прочтение естественно объясняет изумление, но греческий союз допускает также введение содержания этого изумления; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Сохранены ключевые повторения «был — нет его» и традиционные термины «зверь», «бездна», «книга жизни», но синтаксис сделан понятным обычному современному читателю.
