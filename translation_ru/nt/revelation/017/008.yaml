  terminology: Термины «зверь», «бездна», «погибель» и «книга жизни» выбраны удачно и согласуются с употреблением в Откровении. «Живущие на земле» — ясная современная передача устойчивого выражения οἱ κατοικοῦντες ἐπὶ τῆς γῆς.
