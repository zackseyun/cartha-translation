  source_fidelity: 'В целом перевод точно передаёт синтаксис и образы греческого текста: «зверь», «бездна», «книга жизни», единственное число «имя», временная формула «от основания мира» и двусмысленность ὅτι сохранены. Однако παρέσται — будущее от πάρειμι, прежде всего «будет присутствовать / будет налицо», а «явится» несколько сильнее смещает смысл к самому акту появления. В данном намеренно повторяющемся экзистенциальном ряду наиболее точное и естественное русское соответствие — «будет».'
