  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὗτοι μίαν ⸂γνώμην ἔχουσιν⸃, καὶ τὴν δύναμιν ⸀καὶ ἐξουσίαν αὐτῶν τῷ θηρίῳ διδόασιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/013.yaml
  text: These are of one mind[a], and they give their power and authority to the beast.
translation:
  language: ru
  text: У них одно намерение[a], и они отдают зверю свою силу и власть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они единодушны». Буквально: «имеют одно мнение»; это греческое выражение может указывать на общее намерение, решение или цель.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: у них / они
  rationale: Указательное местоимение относится к упомянутым ранее десяти царям. В русском контексте местоименная передача естественна и не требует тяжеловесного «эти».
- source_word: μίαν γνώμην ἔχουσιν
  choice: у них одни намерения
  rationale: γνώμη может обозначать мнение, замысел, намерение или решимость. В политическом контексте множественное «одни намерения» естественно выражает их общую направленность, не сводя смысл лишь к интеллектуальному согласию.
- source_word: δύναμιν
  choice: силу
  rationale: δύναμις здесь означает действенную силу или могущество; «сила» — прямое и понятное соответствие.
- source_word: ἐξουσίαν
  choice: власть
  rationale: ἐξουσία обозначает полномочие и право распоряжаться или править. «Власть» сохраняет отличие от физической или действенной силы.
- source_word: τὴν δύναμιν καὶ ἐξουσίαν αὐτῶν
  choice: свою силу и власть
  rationale: Возвратное «свою» ясно связывает оба существительных с действующим подлежащим и естественно звучит по-русски; оба различных греческих понятия сохранены.
- source_word: τῷ θηρίῳ
  choice: зверю
  rationale: «Зверь» — устойчивое и контекстуально определённое обозначение апокалиптической фигуры в Откровении; определённость следует из контекста, поскольку в русском нет артикля.
- source_word: διδόασιν
  choice: отдают
  rationale: Настоящее время сохранено. «Отдают» в данном контексте естественно передаёт передачу собственной силы и власти зверю, не добавляя идеи насильственного изъятия.
theological_decisions:
- issue: Значение идиомы μίαν γνώμην ἔχουσιν в апокалиптическом политическом контексте
  choice: у них одни намерения
  alternative: они единодушны; у них одна цель; они держатся одного мнения
  rationale: Фраза допускает оттенки общего мнения, намерения, решения или цели. Основной текст передаёт совместную направленность воли, а примечание сохраняет более буквальную и более широкую альтернативу.
- issue: Различение δύναμις и ἐξουσία
  choice: силу и власть
  alternative: могущество и полномочия
  rationale: Сохранение двух отдельных понятий не позволяет свести действенную мощь и властные полномочия к одному значению.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и торжественный, без архаизмов. «Зверь» сохраняет традиционную терминологическую связь с образом в Откровении.
