id: REV.17.7
reference: Revelation 17:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι ὁ ἄγγελος· Διὰ τί ἐθαύμασας; ἐγὼ ἐρῶ σοι τὸ μυστήριον τῆς γυναικὸς καὶ τοῦ θηρίου τοῦ βαστάζοντος αὐτήν, τοῦ ἔχοντος τὰς ἑπτὰ κεφαλὰς καὶ τὰ δέκα κέρατα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/007.yaml
  text: And the angel said to me[a], “Why did you marvel? I will tell you the mystery of the woman and of the beast that carries her, which has the seven heads and the ten horns.”
translation:
  language: ru
  text: 'И ангел сказал мне: «Почему ты изумился? Я расскажу тебе тайну женщины и зверя, несущего её и имеющего семь голов и десять рогов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθαύμασας
  choice: ты изумился
  rationale: Глагол обозначает сильное удивление или изумление; «изумился» естественно передаёт аорист и не сводит вопрос к простому любопытству.
- source_word: μυστήριον
  choice: тайну
  rationale: В апокалиптическом контексте речь идёт о прежде скрытой реальности, которую теперь раскрывают; «тайна» сохраняет этот смысл.
- source_word: γυναικός
  choice: женщины
  rationale: В данном образе γυνή означает женщину; указания на брачные отношения здесь нет.
- source_word: θηρίου
  choice: зверя
  rationale: «Зверь» сохраняет устойчивый апокалиптический образ Откровения и его угрожающие коннотации.
- source_word: βαστάζοντος
  choice: который несёт её
  rationale: Причастие обозначает зверя как несущего женщину; личная форма создаёт естественную русскую фразу и сохраняет образ.
- source_word: ἔχοντος
  choice: у которого
  rationale: Оборот естественно передаёт принадлежность семи голов и десяти рогов зверю и ясно сохраняет синтаксическую связь.
- source_word: κεφαλάς
  choice: голов
  rationale: Сохраняется буквальная зрительная образность видения.
- source_word: κέρατα
  choice: рогов
  rationale: Сохраняется традиционная и контекстуально значимая апокалиптическая символика.
- source_word: Διὰ τί
  choice: Почему
  rationale: Краткий и естественный русский эквивалент вопросительной конструкции.
- source_word: ἐρῶ σοι
  choice: Я расскажу тебе
  rationale: Будущая форма λέγω вводит последующее раскрытие смысла; «расскажу тебе» близко исходному глаголу и звучит естественно.
theological_decisions:
- issue: К чему относится описание «у которого семь голов и десять рогов»
  choice: Описание прямо отнесено к зверю.
  alternative: Оставить синтаксическую связь менее определённой.
  rationale: Формы τοῦ βαστάζοντος и τοῦ ἔχοντος согласуются с θηρίου, а не с γυναικός; русский текст отражает ясность греческого синтаксиса, не добавляя толкования символов.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Повтор «зверя» после тире слегка эксплицирует греческую связь двух причастных определений и устраняет неверное отнесение семи голов и десяти рогов к женщине.
