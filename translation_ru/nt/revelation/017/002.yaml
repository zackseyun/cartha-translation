id: REV.17.2
reference: Revelation 17:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μεθ’ ἧς ἐπόρνευσαν οἱ βασιλεῖς τῆς γῆς, καὶ ἐμεθύσθησαν οἱ κατοικοῦντες τὴν γῆν ἐκ τοῦ οἴνου τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/002.yaml
  text: with whom the kings of the earth committed sexual immorality[d][c][b][a], and those who dwell on the earth became drunk from the wine of her sexual immorality.
translation:
  language: ru
  text: с которой блудодействовали[a][b] цари земли, а живущие на земле[c] упились вином её блуда[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с нею».'
    reason: lexical_alternative
  - marker: b
    text: Образ блуда здесь, вероятно, символизирует порочные, идолопоклоннические или неверные союзы, но сохраняет силу сексуальной метафоры.
    reason: cultural_note
  - marker: c
    text: 'Или: «обитатели земли».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «её проституции».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἧς
  choice: с которой
  rationale: Относительное местоимение прямо связывает этот оборот с женщиной из предыдущего стиха и сохраняет греческую относительную конструкцию.
- source_word: ἐπόρνευσαν
  choice: блудодействовали
  rationale: Глагол сохраняет явный сексуальный образ и одновременно допускает его символическое применение к идолопоклонству, политической порочности и неверности.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: цари земли
  rationale: Устойчивое апокалиптическое выражение передано широко, без неоправданного ограничения значением отдельной страны или территории.
- source_word: ἐμεθύσθησαν
  choice: упились
  rationale: Передаёт достижение состояния опьянения и естественно сочетается в русском языке с образом вина; страдательная форма греческого глагола здесь не требует буквального воспроизведения.
- source_word: οἱ κατοικοῦντες τὴν γῆν
  choice: живущие на земле
  rationale: Сохраняет глагольный характер повторяющейся в Откровении формулы и звучит естественно на современном русском языке.
- source_word: ἐκ τοῦ οἴνου
  choice: вином
  rationale: Русский творительный падеж естественно выражает средство или причину опьянения, сохраняя исходный образ.
- source_word: τῆς πορνείας αὐτῆς
  choice: её блуда
  rationale: «Блуд» сохраняет связь с однокоренным глаголом «блудодействовали», сексуальную метафору и широкий символический смысл; более узкое «проституция» вынесено в примечание как возможная передача.
theological_decisions:
- issue: Следует ли прямо истолковать πορνεύω/πορνεία как идолопоклонство либо политико-религиозную неверность
  choice: Сохранить в основном тексте образ блуда без поясняющего пересказа
  alternative: Передать как «вступали с ней в нечестивый союз» или «изменяли Богу, поклоняясь идолам»
  rationale: Сексуальная образность Откровения намеренно соединяет буквальную силу метафоры с темами идолопоклонства, неверности и порочного союза. Прямое истолкование сузило бы сохраняемую текстом многозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Блудодействовали» и «блуд» употреблены ради сохранения однокоренной связи и символической напряжённости оригинала; синтаксис остаётся ясным для обычного современного читателя.
