id: REV.17.12
reference: Revelation 17:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες δέκα βασιλεῖς εἰσιν, οἵτινες βασιλείαν οὔπω ἔλαβον, ἀλλὰ ἐξουσίαν ὡς βασιλεῖς μίαν ὥραν λαμβάνουσιν μετὰ τοῦ θηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/012.yaml
  text: And the ten horns that you saw are ten kings[a], who have not yet received a kingdom, but they receive authority as kings for one hour with the beast.
translation:
  language: ru
  text: А десять рогов, которые ты видел, — это десять царей. Они ещё не получили царства, но на один час[a] получают власть как цари вместе со зверем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на короткое время». В апокалиптической образности выражение «один час», вероятно, означает краткий, ограниченный срок.'
    reason: 'Лексико-интерпретационная альтернатива: сохранено буквальное выражение при указании его вероятного образного смысла.'
lexical_decisions:
- source_word: κέρατα
  choice: рогов
  rationale: Буквальный перевод сохраняет апокалиптический образ; его символическое значение раскрывается далее отождествлением с царями.
- source_word: βασιλεῖς
  choice: царей
  rationale: Основное лексическое значение — «цари». Перевод не уточняет, буквальные это монархи или символические правители.
- source_word: βασιλείαν
  choice: царства
  rationale: «Царство» естественно передаёт владение или царскую область и сохраняет отличие от последующего ἐξουσίαν — «власть».
- source_word: οὔπω ἔλαβον
  choice: ещё не получили
  rationale: 'Передаёт временное отрицание и актуальный результат: к моменту видения царство ими ещё не получено.'
- source_word: ἐξουσίαν
  choice: власть
  rationale: Передаёт предоставленное право властвовать и не смешивает его с «царством».
- source_word: ὡς βασιλεῖς
  choice: как цари
  rationale: Прямо сохраняет сравнительно-статусную формулировку греческого текста, не превращая её в утверждение о характере их царствования.
- source_word: μίαν ὥραν
  choice: на один час
  rationale: Буквально сохраняет апокалиптическое выражение; возможный образный смысл краткого, ограниченного срока вынесен в примечание.
- source_word: λαμβάνουσιν
  choice: получают
  rationale: Настоящее время греческого текста сохранено как настоящее, что соответствует живому стилю видения, хотя контекст допускает отнесённость к будущему.
- source_word: μετὰ τοῦ θηρίου
  choice: вместе со зверем
  rationale: Естественно передаёт совместность или союз с указанным зверем.
- source_word: θηρίου
  choice: зверем
  rationale: Традиционный и точный эквивалент θηρίον в Откровении, сохраняющий последовательность образа.
theological_decisions:
- issue: Следует ли истолковать десять царей как буквальных монархов либо как символических правителей или державы
  choice: Сохранить прямое выражение «десять царей» без поясняющего истолкования в основном тексте.
  alternative: «десять правителей», «десять политических сил» или «десять царств»
  rationale: Греческий текст прямо называет их царями, тогда как апокалиптический контекст допускает символическое понимание. Перевод сохраняет это напряжение.
- issue: Следует ли понимать μίαν ὥραν буквально или как краткий период
  choice: В основном тексте перевести «на один час», а вероятный образный смысл указать в примечании.
  alternative: «на короткое время» или «ненадолго»
  rationale: Формально выражение означает «один час», но в апокалиптической образности, вероятно, обозначает краткий и ограниченный срок.
- issue: Временное значение настоящего λαμβάνουσιν в контексте ещё не состоявшегося получения царства
  choice: 'Сохранить настоящее время: «получают».'
  alternative: «получат»
  rationale: Так точнее отражается греческая форма и живой характер пророческого видения, при этом контекстуальная отнесённость к будущему остаётся возможной.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён для ясности без утраты смысловых противопоставлений; «рога», «цари», «царство», «власть» и «зверь» сохранены как отдельные элементы апокалиптического образа.
