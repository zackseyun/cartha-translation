  text: οἱ πέντε ἔπεσαν, ὁ εἷς ἔστιν, ὁ ἄλλος οὔπω ἦλθεν, καὶ ὅταν ἔλθῃ ὀλίγον ⸂αὐτὸν δεῖ⸃ μεῖναι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/010.yaml
  text: Five have fallen[a], one is, the other has not yet come; and when he comes, he must remain for a little while.
translation:
  language: ru
  text: Пять пали[a], один есть, другой ещё не пришёл; а когда придёт, ему надлежит пробыть недолго.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более явно с учётом контекста: «Пять царей пали, один царь есть, другой царь ещё не пришёл».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πέντε
  choice: Пять
  rationale: Артикль указывает на пять из семи царей, названных в предыдущем стихе; русское «пять» естественно сохраняет эту отсылку без обязательного повторения существительного.
- source_word: ἔπεσαν
  choice: пали
  rationale: Буквальное и уместное для апокалиптической речи значение аориста πίπτω; в контексте подразумевается падение пяти царей.
- source_word: ὁ εἷς ἔστιν
  choice: один есть
  rationale: Сохраняет намеренно сжатую греческую формулировку и не конкретизирует её как «царствует» или «остаётся».
- source_word: ὁ ἄλλος
  choice: другой
  rationale: Обозначает следующего из оставшихся царей в последовательности.
- source_word: οὔπω ἦλθεν
  choice: ещё не пришёл
  rationale: Естественная русская передача ожидаемого, но пока не состоявшегося прихода.
- source_word: ὅταν ἔλθῃ
  choice: когда придёт
  rationale: Передаёт будущую ситуацию, выраженную ὅταν с аористом сослагательного наклонения.
- source_word: ὀλίγον
  choice: недолго
  rationale: Наречная передача краткой продолжительности, естественная в сочетании с «пробыть».
- source_word: αὐτὸν δεῖ μεῖναι
  choice: ему надлежит пробыть
  rationale: Передаёт безличную необходимость δεῖ и временное пребывание μεῖναι; «надлежит» поддерживает dignified апокалиптический регистр.
theological_decisions:
- issue: Степень конкретизации образа семи царей
  choice: Сохранить эллиптическую формулировку стиха, не называя царей в основном тексте.
  alternative: 'Передать развёрнуто: «Пять царей пали, один царь есть, другой царь ещё не пришёл».'
  rationale: Предыдущий стих прямо отождествляет головы с царями, однако данный стих сформулирован сжато. Такая передача сохраняет неоднозначность образа и не навязывает спорную историческую идентификацию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Сжатость оригинала сохранена; спорные исторические отождествления не внесены.
