id: REV.17.3
reference: Revelation 17:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με εἰς ἔρημον ἐν πνεύματι. καὶ εἶδον γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον, ⸀γέμοντα ὀνόματα βλασφημίας, ⸀ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/003.yaml
  text: And he carried me away in the Spirit into a wilderness. And I saw a woman sitting on a scarlet beast[a], full of blasphemous names, having seven heads and ten horns.
translation:
  language: ru
  text: И он унёс меня в духе[a] в пустынное место. И я увидел женщину, сидящую на багряном звере, который был полон богохульных имён и имел семь голов и десять рогов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Духе». Греческое выражение может обозначать духовное состояние либо перенесение Духом; в Откровении оно обычно вводит пророческое видение.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: унёс
  rationale: Глагол передаёт перемещение в другое место; «унёс» естественно сохраняет образ перенесения в пророческом видении.
- source_word: εἰς ἔρημον
  choice: в пустынное место
  rationale: Существительное ἔρημος без артикля может обозначать пустыню или безлюдное, необитаемое место; этот вариант не навязывает образ песчаной пустыни.
- source_word: ἐν πνεύματι
  choice: в духе
  rationale: Фраза обозначает духовное или пророческое состояние и может подразумевать действие Духа; строчная буква сохраняет неоднозначность греческого текста, а возможное личное понимание пояснено в сноске.
- source_word: γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον
  choice: женщину, сидящую на багряном звере
  rationale: Прямо и естественно передаёт положение женщины на звере; «багряный» сохраняет яркий красный оттенок и возвышенный апокалиптический регистр.
- source_word: γέμοντα ὀνόματα βλασφημίας
  choice: который был полон богохульных имён
  rationale: Причастие относится к зверю и буквально выражает наполненность; родительный оборот естественно передан качественным прилагательным.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: имел семь голов и десять рогов
  rationale: Сохраняет описание зверя и стандартную апокалиптическую образность без истолковывающей вставки.
theological_decisions:
- issue: Значение ἐν πνεύματι
  choice: «в духе» в основном тексте с пояснением возможного значения «в Духе»
  alternative: «в Духе» как прямое указание на Святого Духа
  rationale: В Откровении выражение вводит пророческое видение, но в греческой рукописной традиции регистр букв не решает, обозначен ли непосредственно Святой Дух или духовное состояние. Перевод сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. «Пустынное место» выбрано вместо более узкого «пустыня», а синтаксис слегка раскрыт придаточным предложением для ясного согласования описаний зверя.
