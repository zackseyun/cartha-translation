id: REV.1.9
reference: Revelation 1:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰωάννης, ὁ ἀδελφὸς ὑμῶν καὶ ⸀συγκοινωνὸς ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ ⸀ἐν Ἰησοῦ, ἐγενόμην ἐν τῇ νήσῳ τῇ καλουμένῃ Πάτμῳ διὰ τὸν λόγον τοῦ θεοῦ ⸀καὶ τὴν μαρτυρίαν ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/009.yaml
  text: I[a], John, your brother and fellow participant in the tribulation and kingdom and endurance in Jesus, was on the island called Patmos because of the word of God and the testimony of Jesus.
translation:
  language: ru
  text: Я, Иоанн, ваш брат и соучастник в скорби, царстве и стойкости в Иисусе, был на острове, называемом Патмос, по причине слова Божьего и свидетельства Иисуса[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свидетельство об Иисусе». Греческий родительный падеж может означать как свидетельство, данное Иисусом, так и свидетельство об Иисусе.'
    reason: alternative_reading
lexical_decisions:
- source_word: συγκοινωνός
  choice: соучастник
  rationale: Передаёт совместное участие Иоанна и его читателей в названных далее реалиях, не привнося коммерческих оттенков слова «партнёр».
- source_word: ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ
  choice: в скорби, царстве и стойкости
  rationale: Сохраняет три однородных существительных как общую сферу участия. «Скорбь» соответствует весомости θλῖψις в апокалиптическом контексте, а «стойкость» естественно передаёт длительное терпеливое устояние, выраженное ὑπομονή.
- source_word: ἐν Ἰησοῦ
  choice: в Иисусе
  rationale: Сохраняет краткую богословскую формулу и её наиболее естественную связь со всей предшествующей триадой, не добавляя отсутствующего в греческом тексте титула.
- source_word: ἐγενόμην ἐν τῇ νήσῳ
  choice: был на острове
  rationale: В данном контексте γίνομαι идиоматически обозначает пребывание в месте. Такой перевод не уточняет не названный в тексте способ прибытия на остров.
- source_word: τῇ καλουμένῃ Πάτμῳ
  choice: называемом Патмос
  rationale: Естественно передаёт причастный оборот, поясняющий название острова.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: за слово Божье
  rationale: Передаёт причинное значение διά с винительным падежом и естественно звучит в контексте пребывания, вызванного верностью Божьему слову, не уточняя прямо, была ли это ссылка или иная форма преследования.
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: свидетельство Иисуса
  rationale: Русский родительный падеж, подобно греческому генитиву, позволяет сохранить возможность как свидетельства, исходящего от Иисуса, так и свидетельства об Иисусе.
- source_word: ἀδελφὸς ὑμῶν
  choice: ваш брат
  rationale: Прямо и естественно выражает братскую солидарность Иоанна с адресатами.
theological_decisions:
- issue: Неоднозначность генитива в μαρτυρίαν Ἰησοῦ
  choice: 'В основном тексте: «свидетельство Иисуса»'
  alternative: «свидетельство об Иисусе»
  rationale: Греческий генитив допускает как субъектное, так и объектное понимание. Основной текст сохраняет эту неоднозначность, а примечание явно указывает альтернативное прочтение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет торжественную самопрезентацию Иоанна и тесную связь трёх реалий с выражением «в Иисусе», оставаясь понятным обычному читателю.
