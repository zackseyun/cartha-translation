id: REV.1.3
reference: Revelation 1:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μακάριος ὁ ἀναγινώσκων καὶ οἱ ἀκούοντες τοὺς λόγους τῆς προφητείας καὶ τηροῦντες τὰ ἐν αὐτῇ γεγραμμένα, ὁ γὰρ καιρὸς ἐγγύς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/003.yaml
  text: Blessed is the one who reads aloud[a], and those who hear the words of this prophecy and keep what is written in it[b], for the time is near.
translation:
  language: ru
  text: Блажен тот, кто читает вслух[a], и те, кто слушает слова этого пророчества и соблюдает написанное в нём, потому что время близко[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто читает»; по-гречески, вероятно, имеется в виду чтец, читающий вслух перед собранием.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «назначенное время близко».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Блажен
  rationale: Сохраняет традиционную форму блаженства и передаёт духовное благоволение, а не только чувство счастья.
- source_word: ὁ ἀναγινώσκων
  choice: тот, кто читает вслух
  rationale: Единственное число в сочетании с множественным «те, кто слушает» указывает на вероятное публичное чтение в собрании; «вслух» естественно выражает этот контекст.
- source_word: οἱ ἀκούοντες
  choice: те, кто слушает
  rationale: В контексте публичного чтения «слушает» звучит естественно и подразумевает внимательное восприятие, не подменяя следующую мысль о соблюдении.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: слова этого пророчества
  rationale: «Слова» прямо передаёт λόγους, а «этого» указывает на пророчество данной книги.
- source_word: τηροῦντες
  choice: соблюдает
  rationale: Передаёт верное следование написанному и связанную с ним послушную практику, не сужая значение до охраны текста.
- source_word: τὰ ἐν αὐτῇ γεγραμμένα
  choice: написанное в нём
  rationale: Естественная русская передача субстантивированного причастного оборота; местоимение относится к пророчеству.
- source_word: ὁ γὰρ καιρὸς
  choice: потому что время
  rationale: «Время» сохраняет широту καιρός; союз «потому что» ясно передаёт пояснительно-причинное γάρ.
- source_word: ἐγγύς
  choice: близко
  rationale: Кратко и естественно передаёт временную близость, не определяя конкретную схему исполнения пророчества.
theological_decisions:
- issue: Контекст публичного чтения, подразумеваемый единственным числом читающего и множественным числом слушающих
  choice: «тот, кто читает вслух»
  alternative: «тот, кто читает» без уточнения устного характера чтения
  rationale: Синтаксис убедительно предполагает одного чтеца перед собранием, однако сноска сохраняет более буквальную лексическую возможность.
- issue: Эсхатологическая сила выражения ὁ καιρὸς ἐγγύς
  choice: «время близко»
  alternative: «назначенное время близко»
  rationale: Перевод сохраняет утверждение о близости, не навязывая хронологию или определённую эсхатологическую систему; возможный оттенок назначенного срока отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Сохранена формула «Блажен», а синтаксис упрощён до естественного русского без устранения смысловой напряжённости выражения о близости времени.
