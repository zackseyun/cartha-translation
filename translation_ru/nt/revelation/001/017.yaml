id: REV.1.17
reference: Revelation 1:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδον αὐτόν, ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός· καὶ ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμὲ λέγων· Μὴ φοβοῦ· ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/017.yaml
  text: And when I saw him[a], I fell at his feet like a dead man. And he placed his right hand on me, saying, “Do not fear[b]. I am the First and the Last,”
translation:
  language: ru
  text: 'И когда я увидел Его, то упал к Его ногам, словно мёртвый.[a] Он положил на меня Свою правую руку и сказал: «Не бойся![b] Я — Первый и Последний».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как мёртвый».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Не страшись!»'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε εἶδον αὐτόν
  choice: И когда я увидел Его
  rationale: Сохраняет повествовательную связь καί и временное значение ὅτε; «увидел» прямо передаёт аорист εἶδον.
- source_word: ἔπεσα πρὸς τοὺς πόδας αὐτοῦ
  choice: упал к Его ногам
  rationale: Естественно передаёт падение перед стоящим лицом, не добавляя поклонения, прямо не названного в тексте.
- source_word: ὡς νεκρός
  choice: словно мёртвый
  rationale: Сохраняет явное сравнение с ὡς и не создаёт впечатления, будто Иоанн действительно умер.
- source_word: ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμέ
  choice: Он положил на меня Свою правую руку
  rationale: «Положил» точно и естественно передаёт τίθημι; правая рука сохранена как явная и значимая деталь исходного текста.
- source_word: λέγων
  choice: и сказал
  rationale: В русском повествовании личная форма естественнее буквального причастия «говоря» и точно выражает одновременное речевое действие.
- source_word: Μὴ φοβοῦ
  choice: Не бойся
  rationale: Обычный современный русский эквивалент запрета в настоящем императиве; сохраняет прямой и утешающий характер обращения.
- source_word: ἐγώ εἰμι
  choice: Я —
  rationale: Русское именное предложение с тире естественно передаёт усиленное самообозначение ἐγώ εἰμι перед титулами, без искусственного добавления связки «есть».
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: Первый и Последний
  rationale: Определённые субстантивированные прилагательные переданы как парный титул; прописные буквы отмечают титульное употребление, не изменяя смысла слов.
theological_decisions:
- issue: Титульная сила выражения ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: Первый и Последний
  alternative: первый и последний
  rationale: В контексте это торжественное самообозначение говорящего, перекликающееся с языком книги Исаии. Прописные буквы обозначают титульную функцию, не добавляя отдельного толкования.
- issue: Сила выражения ἐγώ εἰμι
  choice: Я — Первый и Последний
  alternative: Я есть Первый и Последний
  rationale: Тире соответствует нормальному русскому именному предложению и сохраняет акцент на личности говорящего; форма «Я есть» была бы стилистически тяжеловесной и могла бы привнести более специальную аллюзию, чем требует этот стих.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Местоимения, относящиеся к явившемуся Христу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской традицией; титул также выделен прописными буквами.
