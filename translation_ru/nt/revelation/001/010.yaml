id: REV.1.10
reference: Revelation 1:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγενόμην ἐν πνεύματι ἐν τῇ κυριακῇ ἡμέρᾳ, καὶ ἤκουσα ⸂ὀπίσω μου φωνὴν⸃ μεγάλην ὡς σάλπιγγος
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/010.yaml
  text: I came to be in the Spirit on the Lord’s day[a], and I heard behind me a loud voice like a trumpet[b],
translation:
  language: ru
  text: В день Господень[b] я оказался в Духе[a] и услышал позади себя громкий голос, словно звук трубы,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в духе». Вероятно, речь идёт о пророческом действии Святого Духа; сам текст, однако, прямо не говорит о состоянии транса.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, что менее вероятно: «в день Господа». Здесь по-гречески стоит выражение κυριακῇ ἡμέρᾳ («день, принадлежащий Господу»), а не более обычное обозначение эсхатологического «дня Господа».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγενόμην
  choice: я оказался
  rationale: Передаёт вхождение или наступление состояния, возможное для аориста γίνομαι, не сводя выражение к простому «я был» и не добавляя отсутствующего в тексте указания на транс.
- source_word: ἐν πνεύματι
  choice: в Духе
  rationale: Наиболее вероятна отсылка к пророческому действию Святого Духа в формулах видений Откровения. Краткая предложная конструкция сохраняет форму греческого текста; прописная буква отражает вероятное понимание, а сноска сохраняет неоднозначность.
- source_word: ἐν τῇ κυριακῇ ἡμέρᾳ
  choice: в день Господень
  rationale: Прилагательное κυριακός означает «принадлежащий Господу». Русское устойчивое сочетание «день Господень» передаёт эту форму, хотя внешне может совпадать с эсхатологическим выражением; поэтому различие пояснено в сноске.
- source_word: ἤκουσα
  choice: услышал
  rationale: В контексте глагол обозначает слуховое восприятие, а не намеренное вслушивание.
- source_word: ὀπίσω μου
  choice: позади себя
  rationale: 'Передаёт пространственное значение: голос прозвучал за спиной Иоанна.'
- source_word: φωνὴν μεγάλην
  choice: громкий голос
  rationale: При φωνή прилагательное μέγας указывает прежде всего на силу и громкость звучания; это естественная современная русская формулировка.
- source_word: ὡς σάλπιγγος
  choice: словно звук трубы
  rationale: Сравнение относится к звучанию голоса. Добавление родового слова «звук» естественно для русского языка и не превращает сравнение в буквальное отождествление голоса с инструментом.
theological_decisions:
- issue: Обозначает ли ἐν πνεύματι действие Святого Духа или состояние человеческого духа
  choice: в Духе
  alternative: в духе; в состоянии транса
  rationale: Контекст пророческого видения делает отсылку к Святому Духу вероятной, однако греческий текст не называет состояние трансом. Основной текст сохраняет краткость и богословское напряжение оригинала, а сноска отмечает иной возможный разбор.
- issue: Обозначает ли κυριακῇ ἡμέρᾳ еженедельный день Господень или эсхатологический день Господа
  choice: в день Господень
  alternative: в день Господа
  rationale: Форма с прилагательным κυριακός буквально обозначает день, принадлежащий Господу, и отличается от обычной греческой конструкции для эсхатологического «дня Господа». Перевод не уточняет сверх текста, какой именно календарный день имелся в виду.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Порядок обстоятельства времени в начале фразы звучит естественно по-русски; «оказался в Духе» сохраняет оттенок наступления состояния. Сравнение «словно звук трубы» понятно обычному читателю и не добавляет образа трубного сигнала или трубного гласа, которых существительное само по себе не выражает.
