source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ πρωτότοκος τῶν νεκρῶν καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ ⸀λύσαντι ἡμᾶς ⸀ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/005.yaml
  text: and from Jesus the Messiah[a], the faithful witness, the firstborn of the dead, and the ruler of the kings of the earth[b]. To him who loves us and freed us from our sins by his blood—
translation:
  language: ru
  text: и от Иисуса Мессии[a] — верного свидетеля, первенца из мёртвых и правителя царей земли. Тому, кто любит нас и своей кровью освободил нас от наших грехов[b], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Христа». Греческое Χριστός означает «Мессия».'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях: «омыл нас от наших грехов своей кровью» вместо «освободил нас от наших грехов своей кровью».'
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь выступает как титул, поэтому передан его смысл — «Мессия», а не только традиционная транслитерация «Христос».
- source_word: ὁ μάρτυς ὁ πιστός
  choice: верного свидетеля
  rationale: μάρτυς означает того, кто свидетельствует, а πιστός подчёркивает его верность и надёжность; «мученик» здесь было бы неоправданным сужением смысла.
- source_word: ὁ πρωτότοκος τῶν νεκρῶν
  choice: первенца из мёртвых
  rationale: «Первенец» сохраняет библейский образ πρωτότοκος, а «из мёртвых» естественно передаёт связь с воскресением, не сводя выражение лишь к хронологическому первенству.
- source_word: ὁ ἄρχων τῶν βασιλέων τῆς γῆς
  choice: правителя земных царей
  rationale: «Правитель» ясно выражает власть над царями; «земных царей» естественно и кратко передаёт τῶν βασιλέων τῆς γῆς в космическом контексте Откровения.
- source_word: Τῷ ἀγαπῶντι ἡμᾶς
  choice: Тому, кто любит нас
  rationale: Настоящее причастие обозначает продолжающуюся любовь; русская конструкция с личной формой звучит естественно и сохраняет это значение.
- source_word: λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν
  choice: освободил нас от наших грехов
  rationale: λύω означает «развязывать, отпускать, освобождать», а ἐκ выражает избавление или отделение от грехов.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: своей кровью
  rationale: 'ἐν здесь естественно понимать инструментально: кровь является средством освобождения. Возвратное «своей» недвусмысленно относится к действующему лицу.'
theological_decisions:
- issue: Разночтение λύσαντι / λούσαντι
  choice: освободил нас
  alternative: омыл нас
  rationale: Основной текст SBLGNT содержит λύσαντι («освободившему»). Известное разночтение λούσαντι («омывшему») существенно для образности стиха, поэтому оно отмечено в сноске, но не внесено в основной текст.
- issue: Передача христологического титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном перечислении титулов Χριστός уместно перевести по смыслу как «Мессия». Традиционная форма «Христос» сохранена как допустимый вариант в сноске.
- issue: Смысл πρωτότοκος τῶν νεκρῶν
  choice: первенец из мёртвых
  alternative: первенец мёртвых
  rationale: Выбранная формулировка сохраняет метафору первенца и указывает на выход из состояния смерти, не устраняя возможный оттенок первенства и превосходства.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Тире после имени вводит ряд пояснительных титулов; заключительное тире сохраняет незавершённость фразы, продолжающейся в следующем стихе.
