source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχεται μετὰ τῶν νεφελῶν, καὶ ὄψεται αὐτὸν πᾶς ὀφθαλμὸς καὶ οἵτινες αὐτὸν ἐξεκέντησαν, καὶ κόψονται ἐπ’ αὐτὸν πᾶσαι αἱ φυλαὶ τῆς γῆς. ναί, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/007.yaml
  text: Look[a], he is coming with the clouds, and every eye will see him, even those who pierced him, and all the tribes of the earth will mourn over him. Yes, amen.
translation:
  language: ru
  text: Вот, Он грядёт с облаками, и увидит Его всякий глаз, даже те, кто пронзил Его; и возрыдают о Нём все племена земли[a]. Да, аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все племена страны будут рыдать о Нём». Эти слова могут перекликаться с Захарией 12:10–12, где «страна» по контексту является возможным переводом.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Естественный современный призыв обратить внимание, сохраняющий живость греческого вводного слова без архаического оттенка.
- source_word: ἔρχεται
  choice: грядёт
  rationale: Передаёт яркий презенс с будущей направленностью и сохраняет торжественный, пророческий регистр текста.
- source_word: μετὰ τῶν νεφελῶν
  choice: с облаками
  rationale: Буквально сохраняет образ и вероятную отсылку к Даниилу 7:13; в русском определённость здесь не выражается артиклем.
- source_word: ὄψεται
  choice: увидит
  rationale: Обычная русская передача будущей формы ὁράω.
- source_word: πᾶς ὀφθαλμὸς
  choice: всякий глаз
  rationale: Сохраняет конкретное распределительное выражение оригинала, не заменяя его обобщённым «все люди».
- source_word: οἵτινες
  choice: те, кто
  rationale: Естественно обозначает особо выделенную группу среди всех, кто увидит Его.
- source_word: ἐξεκέντησαν
  choice: пронзил
  rationale: Сохраняет точное значение и словесную связь с Захарией 12:10 и Иоанном 19:37.
- source_word: κόψονται
  choice: возрыдают
  rationale: Передаёт публичный, сильный плач и скорбь, не добавляя конкретного жеста биения себя в грудь.
- source_word: ἐπ’ αὐτὸν
  choice: о Нём
  rationale: Соответствует языку плача о ком-либо и сохраняет вероятное эхо Захарии, не сводя смысл исключительно к причинному «из-за Него».
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: все племена земли
  rationale: «Племена» сохраняет конкретность φυλαί, а «земли» допускает универсальный смысл γῆ; локальное значение «страны» отмечено в сноске из-за связи с Захарией 12.
- source_word: ναί, ἀμήν
  choice: Да, аминь
  rationale: Сохраняет двойное торжественное подтверждение и общеупотребительное литургическое слово «аминь».
theological_decisions:
- issue: Объём значения τῆς γῆς в выражении πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: 'В основном тексте: «все племена земли»'
  alternative: «все племена страны»
  rationale: Всеобщность выражения «всякий глаз» и сочетание образов из Даниила и Захарии поддерживают всемирный смысл. Однако отсылка к Захарии 12:10–12 оставляет возможным локальное значение «страны», поэтому оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. «Грядёт» и «возрыдают» слегка возвышенны, но понятны широкому читателю и соответствуют жанру Откровения; синтаксис остаётся ясным и близким к структуре греческого текста.
