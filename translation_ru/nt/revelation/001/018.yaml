lexical_decisions:
- source_word: ὁ ζῶν
  choice: Живой
  rationale: Причастие с артиклем употреблено как титул. Субстантивированное «Живой» сохраняет титульный характер выражения и его связь с божественным самоописанием.
- source_word: ἐγενόμην νεκρός
  choice: Я был мёртв
  rationale: Естественная русская передача состояния смерти в резком противопоставлении последующему «Я жив». Переходное значение глагола γίνομαι сохранено в сноске как более буквальный вариант.
- source_word: ἰδού
  choice: но вот
  rationale: «Вот» передаёт указательно-восклицательную силу слова; добавленное «но» естественно выражает очевидное в контексте противопоставление смерти и нынешней жизни, не устраняя смысла исходного текста.
- source_word: ζῶν εἰμι
  choice: Я жив
  rationale: Краткая и естественная русская конструкция точно передаёт нынешнее состояние и сохраняет контраст с «Я был мёртв».
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устоявшаяся и понятная русская идиома, передающая усиленную формулу бесконечной длительности.
- source_word: κλεῖς
  choice: ключи
  rationale: Прямой эквивалент, сохраняющий образ власти и контроля.
- source_word: τοῦ θανάτου
  choice: смерти
  rationale: Прямо передаёт родительный падеж; строчная буква не навязывает олицетворение.
- source_word: τοῦ ᾅδου
  choice: мира мёртвых
  rationale: Передаёт ᾅδης как область пребывания умерших, не отождествляя её ни с могилой, ни с местом окончательного наказания. Для современного русского читателя это яснее, чем мифологически окрашенное «Аид».
theological_decisions:
- issue: Передача ᾅδης в эсхатологическом контексте
  choice: мир мёртвых
  alternative: Аид; преисподняя; ад; могила
  rationale: Формулировка сохраняет различие между смертью и областью мёртвых. «Ад» может быть ошибочно понят как место окончательного наказания, а «могила» чрезмерно сужает значение до места погребения.
- issue: Переход в состояние смерти в ἐγενόμην νεκρός
  choice: Я был мёртв с буквальным вариантом в сноске
  alternative: Я стал мёртвым; Я умер
  rationale: Основной текст остаётся естественным по-русски, а сноска сохраняет выраженный глаголом γίνομαι оттенок перехода в состояние смерти, не превращая его без пояснения в простой глагол «умер».
translation_notes:
  register: Современный литературный русский язык с возвышенной, но ясной библейской интонацией. Сохранены краткость, торжественность и резкие противопоставления исходного текста; архаизмы ограничены устойчивой формулой «во веки веков».
