  text: ὃς ἐμαρτύρησεν τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ, ὅσα εἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/002.yaml
  text: who testified to the word of God and to the testimony of Jesus the Messiah[a], all that he saw.
translation:
  language: ru
  text: который свидетельствовал о слове Бога и о свидетельстве Иисуса Мессии[a] — обо всём, что он увидел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свидетельство, данное Иисусом Мессией»; или: «свидетельство об Иисусе Мессии». Греческий текст допускает оба понимания.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: засвидетельствовал
  rationale: Передаёт значение свидетельского подтверждения и сохраняет однокоренную связь с существительным «свидетельство».
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: слово Бога
  rationale: Формально и ясно передаёт λόγος как сообщённое Богом слово, не сужая его до общего понятия «весть».
- source_word: τὴν μαρτυρίαν
  choice: свидетельство
  rationale: Естественный русский эквивалент, сохраняющий связь с глаголом «засвидетельствовал».
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός передан как титул «Мессия»; русская форма сохраняет приложение к имени и общий родительный падеж.
- source_word: ὅσα εἶδεν
  choice: всё, что он увидел
  rationale: Передаёт обобщающее и всеохватное значение ὅσα; местоимение «он» делает русскую фразу ясной.
theological_decisions:
- issue: Неоднозначность родительного падежа в μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: свидетельство Иисуса Мессии
  alternative: свидетельство, данное Иисусом Мессией; свидетельство об Иисусе Мессии
  rationale: Русский родительный падеж, как и греческий, позволяет понять Иисуса либо как источник свидетельства, либо как того, о ком свидетельствуют; основной текст не разрешает эту подлинную неоднозначность.
- issue: Передача Χριστοῦ как титула
  choice: Мессии
  alternative: Христа
  rationale: В данном контексте титульное значение остаётся заметным, поэтому смысл титула передан прямо.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тире естественно вводит итоговое пояснение «всё, что он увидел», а конструкция с родительным падежом намеренно сохраняет неоднозначность оригинала.
