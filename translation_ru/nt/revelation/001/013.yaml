  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐν μέσῳ ⸀τῶν λυχνιῶν ὅμοιον ⸀υἱὸν ἀνθρώπου, ἐνδεδυμένον ποδήρη καὶ περιεζωσμένον πρὸς τοῖς μαστοῖς ζώνην χρυσᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/013.yaml
  text: and in the midst of the lampstands[a], one like a son of man, clothed in a robe reaching to the feet and girded across the chest with a golden sash.
translation:
  language: ru
  text: и посреди светильников — подобного сыну человеческому[a], облачённого в одежду до пят и опоясанного на груди золотым поясом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подобного Сыну Человеческому». Греческое выражение перекликается с Дан. 7:13 и здесь относится к прославленному Иисусу.'
    reason: Альтернативное титульное прочтение христологически значимого выражения.
lexical_decisions:
- source_word: ἐν μέσῳ
  choice: посреди
  rationale: Передаёт пространственное значение выражения кратко и естественно, сохраняя возвышенный характер видения.
- source_word: λυχνιῶν
  choice: светильников
  rationale: λυχνία обозначает подставку для лампы, то есть светильник, а не саму лампу; выбор согласуется с образом и его объяснением в контексте Откровения.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: подобного сыну человеческому
  rationale: Строчная буква и отсутствие определённости сохраняют формальную неоднозначность безартиклевого греческого оборота и одновременно позволяют услышать отсылку к Даниилу 7:13.
- source_word: ἐνδεδυμένον
  choice: облачённого
  rationale: Естественно передаёт состояние описываемой фигуры и соответствует торжественному регистру видения.
- source_word: ποδήρη
  choice: в одежду до пят
  rationale: Передаёт буквальный смысл прилагательного — одежда, доходящая до ступней, — не конкретизируя её вид сверх сказанного в тексте.
- source_word: περιεζωσμένον
  choice: опоясанного
  rationale: Сохраняет образ подпоясанной одежды и торжественный стиль исходного текста.
- source_word: πρὸς τοῖς μαστοῖς
  choice: по груди
  rationale: Ясно и естественно указывает на высокое расположение пояса на туловище, не прибегая к неуклюже буквальному выражению.
- source_word: ζώνην χρυσᾶν
  choice: золотым поясом
  rationale: ζώνη может означать пояс или перевязь; «пояс» является ясным и традиционно понятным русским обозначением, а его расположение уточнено словами «по груди».
theological_decisions:
- issue: Христологическое значение выражения ὅμοιον υἱὸν ἀνθρώπου
  choice: 'В основном тексте: «подобного сыну человеческому»; традиционное титульное понимание вынесено в сноску.'
  alternative: «подобного Сыну Человеческому»
  rationale: Такой перевод сохраняет грамматическую неопределённость греческого выражения и отсылку к Даниилу 7:13, не превращая оборот в однозначно оформленный титул. Вместе с тем контекст Откровения относит этот образ к прославленному Иисусу, поэтому традиционное христологическое прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной лексикой, соответствующей апокалиптическому видению. Синтаксический фрагмент сохранён как продолжение предыдущего стиха; тире помогает естественно оформить явление центральной фигуры. Неоднозначность выражения «сын человеческий» не устранена капитализацией в основном тексте.
