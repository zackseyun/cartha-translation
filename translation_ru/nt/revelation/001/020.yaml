id: REV.1.20
reference: Revelation 1:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὸ μυστήριον τῶν ἑπτὰ ἀστέρων ⸀οὓς εἶδες ἐπὶ τῆς δεξιᾶς μου, καὶ τὰς ἑπτὰ λυχνίας τὰς χρυσᾶς· οἱ ἑπτὰ ἀστέρες ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν εἰσίν, καὶ αἱ λυχνίαι αἱ ἑπτὰ ἑπτὰ ἐκκλησίαι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/020.yaml
  text: 'As for the mystery of the seven stars that you saw in my right hand[a], and the seven golden lampstands: the seven stars are the angels of the seven churches, and the seven lampstands are the seven churches.'
translation:
  language: ru
  text: 'Тайна семи звёзд, которые ты видел в Моей правой руке, и семи золотых светильников такова: семь звёзд — это ангелы[a] семи церквей, а семь светильников — семь церквей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестники семи церквей». Греческое слово может обозначать как ангелов, так и людей-вестников.'
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: тайна
  rationale: Сохраняет апокалиптический и богословский термин, не сводя его лишь к «символическому значению»; в контексте речь идёт о раскрываемом смысле видения.
- source_word: ἀστέρων / ἀστέρες
  choice: звёзд / звёзды
  rationale: Прямая передача образа, значение которого объясняется далее в стихе.
- source_word: οὓς εἶδες
  choice: которые ты видел
  rationale: Естественно передаёт относительное придаточное, относящееся к звёздам.
- source_word: ἐπὶ τῆς δεξιᾶς μου
  choice: в Моей правой руке
  rationale: В данном образном контексте русское «в руке» естественно передаёт положение звёзд и согласуется с ближайшим контекстом Откровения.
- source_word: λυχνίας
  choice: светильников
  rationale: В русском библейском и литературном употреблении «светильник» естественно обозначает предмет, на котором горит лампа, и сохраняет конкретный образ.
- source_word: χρυσᾶς
  choice: золотых
  rationale: Краткая и естественная передача прилагательного; может означать золотые или сделанные из золота.
- source_word: ἄγγελοι
  choice: ангелы
  rationale: Основное и контекстуально вероятное значение в Откровении; возможное значение «вестники» сохранено в сноске.
- source_word: ἐκκλησιῶν / ἐκκλησίαι
  choice: церквей / церкви
  rationale: Стандартное и понятное обозначение местных общин, к которым обращено Откровение.
- source_word: τὸ μυστήριον ... καὶ ...
  choice: 'Тайна ... и ... такова:'
  rationale: Естественно воспроизводит вынесенную в начало тему и последующее разъяснение, не добавляя самостоятельной связки к первой именной группе.
theological_decisions:
- issue: Кого обозначает ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν
  choice: ангелы семи церквей
  alternative: вестники семи церквей
  rationale: ἄγγελος может обозначать небесного ангела или человеческого вестника. Поскольку Откровение часто употребляет это слово о небесных существах, в основном тексте выбрано «ангелы», но неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавная буква в «Моей» указывает на речь Христа по контексту. Синтаксис делает явным переход к толкованию символов, сохраняя структуру исходного текста.
