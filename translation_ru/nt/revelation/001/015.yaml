lexical_decisions:
- source_word: πόδες
  choice: ноги
  rationale: В данном описании πούς обозначает ступни или ноги; русское «ноги» естественно передаёт видимый образ нижних конечностей, не сужая его до одних ступней.
- source_word: ὅμοιοι
  choice: словно
  rationale: Передаёт сравнение, выраженное ὅμοιοι, естественно для современного русского повествования.
- source_word: χαλκολιβάνῳ
  choice: сияющая бронза
  rationale: Редкое слово не позволяет уверенно установить точный металл или сплав. «Сияющая бронза» передаёт металлический блеск и связь с последующим образом раскалённого металла, не утверждая спорный металлургический состав.
- source_word: ὡς ἐν καμίνῳ πεπυρωμένης
  choice: будто раскалённая в печи
  rationale: πυρόω может означать подвергать действию огня, раскалять или очищать огнём; в зрительном образе наиболее непосредственно звучит «раскалённая». κάμινος передано обычным и точным словом «печь».
- source_word: φωνή
  choice: голос
  rationale: Первое употребление относится к личности и естественно означает «голос».
- source_word: ὡς φωνὴ ὑδάτων πολλῶν
  choice: словно шум множества вод
  rationale: Во втором употреблении φωνή обозначает воспринимаемое звучание. «Шум» по-русски естественно передаёт мощный звук, а «множество вод» сохраняет библейский образ, не сводя его к морскому прибою или водопаду.
theological_decisions:
- issue: Повтор φωνή в сравнении с множеством вод
  choice: голос Его — словно шум множества вод
  alternative: голос Его — словно голос множества вод
  rationale: Выбранный вариант сохраняет величественный звуковой образ и при этом естественно звучит по-русски. Более буквальный повтор возможен и приведён в примечании, чтобы не скрывать устройство греческой фразы.
- issue: Точный смысл χαλκολίβανον
  choice: сияющая бронза
  alternative: блестящая медь; тонкая бронза; неизвестный ярко сияющий металлический сплав
  rationale: Точный состав вещества неизвестен и богословски не должен определяться переводом. Основной текст даёт понятный зрительный образ, а примечание сохраняет лексическую неопределённость.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического видения. Конструкция с тире и «словно» делает фразу ясной без утраты параллелизма; прописное «Его» соответствует принятому почтительному библейскому регистру.
