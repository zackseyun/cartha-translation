id: REV.1.19
reference: Revelation 1:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: γράψον οὖν ἃ εἶδες καὶ ἃ εἰσὶν καὶ ἃ μέλλει ⸀γίνεσθαι μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/019.yaml
  text: Therefore write what you have seen[a], and what is, and what is about to happen after these things.
translation:
  language: ru
  text: Итак, запиши то, что ты видел, и то, что есть, и то, чему предстоит произойти после этого.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и то, что произойдёт после этого». Глагол может в некоторых контекстах выражать почти простое будущее, хотя часто указывает на то, чему предстоит случиться.'
    reason: alternative_reading
lexical_decisions:
- source_word: γράψον
  choice: запиши
  rationale: Аористный императив второго лица единственного числа передаёт прямое повеление. «Запиши» естественно по-русски выражает поручение зафиксировать увиденное, не добавляя толкования.
- source_word: οὖν
  choice: итак
  rationale: Союз отмечает вывод или продолжение на основании предшествующего видения и поручения. «Итак» ясно и естественно сохраняет эту связующую функцию.
- source_word: ἃ εἶδες
  choice: то, что ты видел
  rationale: Относительное местоимение с аористом указывает на уже увиденное содержание видения. Русское прошедшее время точно и естественно передаёт форму без необходимости добавлять результативный оттенок.
- source_word: ἃ εἰσὶν
  choice: то, что есть
  rationale: Формально это относительное местоимение среднего рода множественного числа с глаголом «быть». Коллективная конструкция «то, что есть» звучит естественно и сохраняет неопределённость относительно того, что именно имеется в виду.
- source_word: μέλλει γίνεσθαι
  choice: чему предстоит произойти
  rationale: μέλλω с инфинитивом может указывать на предстоящее или надвигающееся событие, а иногда приближается по значению к простому будущему. «Предстоит произойти» сохраняет направленность в будущее и оттенок ожидаемого наступления, не усиливая чрезмерно непосредственную близость.
- source_word: μετὰ ταῦτα
  choice: после этого
  rationale: Греческое выражение буквально имеет множественное число («после этих вещей»), но по-русски «после этого» естественно передаёт временную последовательность и не создаёт стилистической тяжеловесности.
theological_decisions:
- issue: Временная сила μέλλει в апокалиптическом контексте
  choice: Передать как «предстоит произойти», сохраняя оттенок ожидаемого или надвигающегося события.
  alternative: «произойдёт» как простое будущее либо «вот-вот произойдёт» с усиленной непосредственной близостью.
  rationale: Греческая конструкция допускает как оттенок предстояния, так и употребление, близкое к простому будущему. Выбранная формулировка сохраняет временное напряжение текста, не решая за него более широкий эсхатологический вопрос.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Трёхчастный параллелизм оригинала сохранён повторением «и то, что». Формулировка не навязывает спорного деления книги на хронологические разделы.
