source:
  edition: SBLGNT
  text: λεγούσης· Ὃ βλέπεις γράψον εἰς βιβλίον καὶ πέμψον ταῖς ἑπτὰ ἐκκλησίαις, εἰς Ἔφεσον καὶ εἰς Σμύρναν καὶ εἰς Πέργαμον καὶ εἰς Θυάτειρα καὶ εἰς Σάρδεις καὶ εἰς Φιλαδέλφειαν καὶ εἰς Λαοδίκειαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/011.yaml
  text: 'saying[a], “What you see[b], write in a book and send it to the seven churches: to Ephesus and to Smyrna and to Pergamum and to Thyatira and to Sardis and to Philadelphia and to Laodicea.”'
translation:
  language: ru
  text: 'говоривший: «То, что ты видишь, запиши в книгу[a] и отправь семи церквам: в Эфес, и в Смирну, и в Пергам[b], и в Фиатиру, и в Сарды, и в Филадельфию, и в Лаодикию».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в свиток»; греческое слово βιβλίον могло обозначать книгу, свиток или письменный документ.'
    reason: lexical_alternative
  - marker: b
    text: В некоторых, особенно старых, переводах название передаётся как «Пергамос».
    reason: alternative_reading
lexical_decisions:
- source_word: λεγούσης
  choice: говоривший
  rationale: Причастие продолжает описание голоса из предыдущего стиха. В русском переводе форма согласована с русским словом «голос», а не с грамматическим родом греческого φωνή.
- source_word: Ὃ βλέπεις
  choice: То, что ты видишь
  rationale: Естественно передаёт относительную конструкцию и настоящее время, не сужая её до одного отдельного видения.
- source_word: γράψον εἰς βιβλίον
  choice: запиши в книгу
  rationale: «Запиши» естественно выражает повеление зафиксировать увиденное письменно; βιβλίον допускает значения книги, свитка или письменного документа, поэтому материальная форма уточнена в сноске.
- source_word: πέμψον
  choice: пошли
  rationale: Кратко и прямо передаёт аористный императив; подразумеваемым объектом служит написанное.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: семи церквам
  rationale: Речь идёт о конкретных христианских общинах; «церкви» — ясный и конфессионально нейтральный эквивалент в данном контексте.
- source_word: εἰς Ἔφεσον ... εἰς Λαοδίκειαν
  choice: в Эфес, и в Смирну, и в Пергам, и в Фиатиру, и в Сарды, и в Филадельфию, и в Лаодикию
  rationale: Повторение предлога и союза сохраняет распределительный ритм греческого перечисления и ясно обозначает отдельные места назначения.
theological_decisions:
- issue: Значение ἐκκλησίαις в Откровении 1:11
  choice: церквам
  alternative: общинам / собраниям
  rationale: В контексте это семь определённых христианских общин. Слово «церкви» точно передаёт церковный референт, не привнося особенностей какой-либо деноминации.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Местоимение «ты» добавлено как естественно выраженное в русском подлежащее личной формы глагола. Повторение «и в» намеренно сохраняет риторический строй оригинала. Сноски поставлены при тех словах, к которым они фактически относятся; их расположение исправляет несоответствие маркеров в английском консультационном слое.
