  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἡ δὲ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες λευκαὶ ὡς ἔριον λευκόν, ὡς χιών, καὶ οἱ ὀφθαλμοὶ αὐτοῦ ὡς φλὸξ πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/014.yaml
  text: His head and hair were white[a], like white wool, like snow, and his eyes were like a flame of fire[b],
translation:
  language: ru
  text: Его голова и волосы были белыми[a], словно белая шерсть, словно снег, а глаза — словно пламя огня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «голова Его и волосы — белые, словно белая шерсть, словно снег».'
    reason: Передаёт возможный более номинативный способ построения описания, не меняя смысла.
  - marker: b
    text: Этот образ перекликается с Дан. 7:9 и подчёркивает, что перед нами описание видения.
    reason: Указывает важный ветхозаветный отзвук и жанровый характер образа, не истолковывая его символику однозначно.
lexical_decisions:
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Слабая связка продолжает описание; в русском контексте её функцию естественно передаёт последовательность фраз, без добавления временного или усиленного противительного значения.
- source_word: κεφαλὴ
  choice: голова
  rationale: Современное и прямое обозначение части тела; «глава» здесь звучало бы архаично.
- source_word: τρίχες
  choice: волосы
  rationale: Естественное русское собирательное обозначение волос на голове.
- source_word: λευκαὶ
  choice: белы
  rationale: Сохраняет основное цветовое значение и повторяющийся образ белизны без толкования символики.
- source_word: ὡς ἔριον λευκόν
  choice: словно белая шерсть
  rationale: Прямо сохраняет сравнение и явное определение «белая»; «словно» естественно вводит образное уподобление.
- source_word: ὡς χιών
  choice: словно снег
  rationale: Сохраняет второе, нарастающее сравнение белизны.
- source_word: ὀφθαλμοὶ
  choice: глаза
  rationale: Обычное современное русское соответствие анатомическому термину.
- source_word: ὡς φλὸξ πυρός
  choice: словно пламя огня
  rationale: Формально близко передаёт родительную конструкцию и сохраняет характерный апокалиптический образ, не сводя его просто к «огненному» цвету.
theological_decisions:
- issue: Символическое описание прославленного Сына Человеческого
  choice: Образы белой шерсти, снега и пламени огня сохранены без объяснения их символического смысла в основном тексте.
  alternative: Раскрыть образы как указание на чистоту, вечность, всеведение или суд.
  rationale: Сам стих даёт зрительные сравнения, но не истолковывает их; буквальное сохранение образов не устраняет богословскую многозначность.
- issue: Связь образа с Даниилом 7:9
  choice: Отметить отзвук в сноске, не отождествляя персонажей посредством поясняющей вставки в текст.
  alternative: Встроить в перевод явное толкование связи с Ветхим Заветом.
  rationale: Интертекстуальная связь существенна, однако её богословские следствия выходят за рамки непосредственно сказанного в стихе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном. Использованы общеупотребительные «голова», «волосы», «глаза» вместо архаизмов; параллельные «словно» сохраняют ритм и образность видения. Местоимение «Его» написано с прописной буквы согласно принятой русской библейской издательской традиции.
