id: REV.1.16
reference: Revelation 1:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ δεξιᾷ ⸂χειρὶ αὐτοῦ⸃ ἀστέρας ἑπτά, καὶ ἐκ τοῦ στόματος αὐτοῦ ῥομφαία δίστομος ὀξεῖα ἐκπορευομένη, καὶ ἡ ὄψις αὐτοῦ ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/016.yaml
  text: And he had seven stars in his right hand[a], and from his mouth came a sharp two-edged sword[b], and his appearance was like the sun shining in its strength.
translation:
  language: ru
  text: В правой руке Он держал семь звёзд; из Его уст выходил острый меч с двумя лезвиями[a], а облик Его был подобен солнцу, сияющему во всей своей силе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «острый обоюдоострый меч».'
    reason: 'Лексическая альтернатива для δίστομος ὀξεῖα: «обоюдоострый» компактно передаёт два лезвия, тогда как основной текст яснее разграничивает двухлезвийность и остроту.'
  - marker: b
    text: 'Или: «солнцу, сияющему в полную силу».'
    reason: Лексическая альтернатива для ἐν τῇ δυνάμει αὐτοῦ, подчёркивающая полноту интенсивности солнечного сияния.
lexical_decisions:
- source_word: ἔχων
  choice: Он держал
  rationale: Причастие входит в продолжающееся описание видения; личная форма естественна по-русски и передаёт состояние, изображённое Иоанном.
- source_word: ἐν τῇ δεξιᾷ χειρὶ αὐτοῦ
  choice: в правой руке
  rationale: Существительное χείρ прямо присутствует в греческом тексте; перевод сохраняет его и звучит естественно.
- source_word: ἀστέρας ἑπτά
  choice: семь звёзд
  rationale: Прямой и идиоматичный перевод с естественным для русского языка порядком слов.
- source_word: ῥομφαία
  choice: меч
  rationale: Слово может обозначать большой меч, однако нейтральное «меч» ясно передаёт образ, не вводя излишней конкретизации вида оружия.
- source_word: δίστομος ὀξεῖα
  choice: острый обоюдоострый
  rationale: 'Сохранены оба определения: ὀξεῖα указывает на остроту, а δίστομος — на два лезвия; «обоюдоострый» является естественным русским соответствием.'
- source_word: ἐκπορευομένη
  choice: выходил
  rationale: Причастие описывает меч, исходящий из уст; глагольная форма сохраняет динамику образа и естественна в русском повествовании.
- source_word: ἡ ὄψις αὐτοῦ
  choice: облик Его
  rationale: ὄψις обозначает видимый облик или внешний вид и не обязательно ограничивается лицом; «облик» сохраняет эту широту.
- source_word: ὡς ὁ ἥλιος φαίνει
  choice: подобен солнцу, сияющему
  rationale: Формулировка естественно передаёт сравнение и продолжающееся яркое сияние.
- source_word: ἐν τῇ δυνάμει αὐτοῦ
  choice: во всей своей силе
  rationale: В данном образе δύναμις означает силу или интенсивность солнечного сияния; добавление «всей» делает смысл ясным по-русски, не меняя образа.
theological_decisions:
- issue: Смысл меча, выходящего из уст
  choice: Сохранить символический образ без истолкования внутри перевода.
  alternative: Прямо назвать меч словом Христа или орудием Его суда.
  rationale: Сам стих даёт апокалиптический образ, но не разъясняет его. Перевод не должен подменять образ богословским толкованием.
- issue: Значение ὄψις
  choice: «облик», то есть видимый образ в целом
  alternative: «лицо»
  rationale: Греческое слово допускает значение внешнего вида и не требует сужать описание до лица; более широкое значение сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным синтаксисом. Заглавные местоимения по отношению ко Христу соответствуют распространённой русской библейской издательской практике. Образность исходного текста сохранена без конфессионального истолкования.
