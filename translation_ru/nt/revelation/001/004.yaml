source:
  edition: SBLGNT
  text: Ἰωάννης ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ· χάρις ὑμῖν καὶ εἰρήνη ⸀ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, καὶ ἀπὸ τῶν ἑπτὰ πνευμάτων ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/004.yaml
  text: 'John, to the seven churches in Asia: Grace to you and peace from him who is, and who was, and who is coming, and from the seven spirits who are before his throne,'
translation:
  language: ru
  text: 'Иоанн — семи церквам в Асии: благодать вам и мир от Того, Кто есть, Кто был и Кто грядёт,[a] и от семи духов,[b] находящихся перед Его престолом,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «от Того, Кто есть, Кто был и Кто приходит».'
    reason: lexical_alternative
  - marker: b
    text: '«Семь духов» могут символически обозначать полноту Святого Духа либо семь небесных духов; в греческом тексте стоит именно множественное число: «семь духов».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωάννης
  choice: Иоанн
  rationale: Устоявшаяся русская библейская форма имени, естественная для литературного перевода.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: семи церквам
  rationale: В эпистолярном христианском контексте «церкви» естественно передаёт ἐκκλησίαις; дательный падеж сохраняет адресную конструкцию.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: в Асии
  rationale: Здесь имеется в виду римская провинция Асия, а не современная Азия; форма «Асия» помогает сохранить историко-географическое различие.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: благодать вам и мир
  rationale: Сохраняет порядок греческого текста и традиционную формулу апостольского приветствия, оставаясь понятной современному читателю.
- source_word: ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: от Того, Кто есть, Кто был и Кто грядёт
  rationale: Передаёт личный и титульный характер необычной греческой конструкции. «Грядёт» сохраняет динамическое значение настоящего причастия ἐρχόμενος и возвышенный регистр.
- source_word: τῶν ἑπτὰ πνευμάτων
  choice: семи духов
  rationale: Греческий оригинал употребляет множественное число; буквальная передача не предрешает спорную идентификацию этих духов.
- source_word: ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ
  choice: находящихся перед Его престолом
  rationale: Причастный оборот естественно связывает относительное предложение с «семью духами» и не вносит дополнительного толкования их природы.
theological_decisions:
- issue: Божественное именование ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: Тот, Кто есть, Кто был и Кто грядёт
  alternative: Тот, Кто есть, Кто был и Кто должен прийти
  rationale: Основной вариант сохраняет трёхчастную формулу и непосредственную глагольную силу ἐρχόμενος. Заглавные буквы отмечают употребление выражения как божественного титула, не устраняя намеренной грамматической необычности оригинала.
- issue: Кого обозначают «семь духов»
  choice: Сохранить в основном тексте буквальное множественное число «семь духов»
  alternative: Символическая полнота Святого Духа либо семь небесных духов
  rationale: Оригинал сам не разрешает эту богословскую неоднозначность; перевод не должен подменять текст одним из толкований.
translation_notes:
  register: Современный литературный русский с достоинством библейского послания. Форма «Асия» употреблена как историческое название римской провинции. Слово «грядёт» несколько возвышенно, но понятно и уместно для торжественного божественного титула. Все сноски отмечены в основном тексте.
