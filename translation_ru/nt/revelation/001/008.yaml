id: REV.1.8
reference: Revelation 1:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος, ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/008.yaml
  text: “I am the Alpha and the Omega,” says the Lord God[a], “the one who is and who was and who is coming, the Almighty.”
translation:
  language: ru
  text: «Я — Альфа и Омега, — говорит Господь Бог, — Тот, Кто есть, Кто был и Кто грядёт[a], Вседержитель».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто придёт».'
    reason: 'Лексико-грамматическая альтернатива для ὁ ἐρχόμενος: настоящее причастие допускает как образ совершающегося пришествия, так и ориентированную на будущее передачу.'
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Я —
  rationale: Именная конструкция с тире естественно передаёт по-русски торжественное и эмфатическое самообозначение, не добавляя избыточного «Я Сам».
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: Альфа и Омега
  rationale: Сохранены названия греческих букв и традиционный апокалиптический образ; замена на «А и Я» изменила бы исходную символику.
- source_word: λέγει κύριος, ὁ θεός
  choice: говорит Господь Бог
  rationale: Прямо передаёт настоящее время λέγει и два стоящих рядом божественных титула без искусственного разделения.
- source_word: ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: Тот, Кто есть, Кто был и Кто грядёт
  rationale: Сохраняет трёхчастное самообозначение. «Грядёт» передаёт направленное к будущему пришествие в форме настоящего времени и соответствует возвышенному, но понятному регистру Откровения.
- source_word: ὁ παντοκράτωρ
  choice: Вседержитель
  rationale: Устоявшийся русский библейский эквивалент, выражающий всеобъемлющую власть и правление Бога; он точнее по контексту и естественнее, чем буквальное «Властитель всего».
theological_decisions:
- issue: Передача ὁ ἐρχόμενος в формуле о Божьем бытии и пришествии
  choice: Кто грядёт
  alternative: Кто придёт
  rationale: Греческое причастие настоящего времени изображает пришествие как активную реальность, а не только как отвлечённое будущее событие. Вариант «Кто придёт» также возможен по смыслу и приведён в сноске, чтобы не устранять временную и богословскую напряжённость выражения.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Заглавные буквы в «Тот, Кто» поддерживают ясность божественного самообозначения; «грядёт» сохраняет возвышенность, оставаясь общеупотребительным и понятным.
