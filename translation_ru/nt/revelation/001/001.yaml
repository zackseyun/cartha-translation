source:
  edition: SBLGNT
  text: Ἀποκάλυψις Ἰησοῦ Χριστοῦ, ἣν ἔδωκεν αὐτῷ ὁ θεὸς δεῖξαι τοῖς δούλοις αὐτοῦ, ἃ δεῖ γενέσθαι ἐν τάχει, καὶ ἐσήμανεν ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ τῷ δούλῳ αὐτοῦ Ἰωάννῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/001.yaml
  text: The revelation of Jesus the Messiah[a], which God gave him to show his servants what must happen soon, and he made it known by sending it through his angel to his servant John[d][c][b],
translation:
  language: ru
  text: Откровение Иисуса Христа[a], которое Бог дал Ему, чтобы показать Своим рабам то, чему надлежит вскоре произойти[b]. Он дал знать об этом[c], послав его через Своего ангела Своему рабу Иоанну.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Откровение от Иисуса Христа» или «Откровение об Иисусе Христе». Греческий родительный падеж допускает оба оттенка.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «быстро произойти». Выражение может указывать либо на близость событий, либо на стремительность их совершения.'
    reason: lexical_alternative
  - marker: c
    text: 'Греческий глагол может также подразумевать, что сообщение было передано посредством знаков; возможный перевод: «сообщил посредством знаков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκάλυψις
  choice: Откровение
  rationale: Передаёт раскрытие прежде сокрытого и сохраняет естественное для русского языка традиционное наименование жанра и книги.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  rationale: «Христос» — укоренившаяся в русском языке передача титула Χριστός («Помазанник», «Мессия»). Родительный падеж, как и в греческом, не уточняет окончательно, идёт ли речь об откровении от Иисуса Христа или об откровении о Нём.
- source_word: ἣν ἔδωκεν αὐτῷ ὁ θεὸς
  choice: которое Бог дал Ему
  rationale: 'Сохраняет прямое соотношение действующих лиц: Бог даёт откровение Иисусу Христу, без дополнительных богословских пояснений.'
- source_word: δεῖξαι
  choice: чтобы показать
  rationale: Прямо передаёт инфинитив цели и соответствует зрительному характеру последующих видений.
- source_word: τοῖς δούλοις αὐτοῦ
  choice: Своим рабам
  rationale: «Раб» сохраняет выраженную словом δοῦλος принадлежность господину и вместе с тем естественно звучит в русском библейском регистре.
- source_word: ἃ δεῖ γενέσθαι
  choice: то, чему надлежит произойти
  rationale: Естественная русская конструкция, сохраняющая заложенную в δεῖ необходимость событий.
- source_word: ἐν τάχει
  choice: вскоре
  rationale: Передаёт наиболее вероятное здесь значение временной близости; возможное значение быстроты отмечено в сноске.
- source_word: ἐσήμανεν
  choice: дал знать об этом
  rationale: Ясно передаёт основной смысл «сообщил, сделал известным», а возможный оттенок сообщения посредством знаков сохраняется в сноске.
- source_word: ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: послав через Своего ангела
  rationale: Причастная конструкция передаёт способ сообщения, а «через» сохраняет роль ангела как посредника.
- source_word: τῷ δούλῳ αὐτοῦ Ἰωάννῃ
  choice: Своему рабу Иоанну
  rationale: Дательный падеж обозначает получателя; «раб» последовательно передаёт δοῦλος.
theological_decisions:
- issue: Значение родительного падежа в Ἀποκάλυψις Ἰησοῦ Χριστοῦ
  choice: «Откровение Иисуса Христа» без уточнения отношения
  alternative: «Откровение от Иисуса Христа» или «Откровение об Иисусе Христе»
  rationale: Греческая конструкция допускает понимание Иисуса как источника откровения и как его содержания. Русский родительный падеж позволяет не устранять эту подлинную неоднозначность.
- issue: Передача δοῦλος
  choice: раб / рабы
  alternative: слуга / служители
  rationale: В данном контексте слово обозначает не только исполнение служения, но и принадлежность Богу или Христу; «раб» сохраняет эту силу и является понятным русским библейским словоупотреблением.
- issue: Субъект действия ἐσήμανεν и притяжательных местоимений
  choice: Сохранена местоименная связь «Он… Своего», без вставки имени
  alternative: Явно назвать Иисуса Христа или Бога
  rationale: Греческий текст не повторяет имени субъекта. Явное добавление имени сняло бы возможную синтаксическую неоднозначность, поэтому перевод её не разрешает редакционной вставкой.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены привычные термины «откровение», «Христос», «ангел» и «раб», но устранены ненужные архаизмы. Заглавные местоимения употреблены в соответствии с распространённой русской религиозной издательской практикой; они не сопровождаются добавлением имени и потому не служат толкованием спорной синтаксической связи.
