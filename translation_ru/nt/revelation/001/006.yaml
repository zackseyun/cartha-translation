source:
  edition: SBLGNT
  text: καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ— αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/006.yaml
  text: and made us a kingdom[a], priests to his God and Father—to him be the glory and the dominion forever and ever[b]. Amen.
translation:
  language: ru
  text: и сделал нас царством[a], священниками Богу и Отцу Его — Ему слава и владычество во веки веков[b]. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых более поздних рукописях: «царями и священниками» вместо «царством, священниками». Основной текст следует приведённому греческому чтению.'
    reason: textual_variant
  - marker: b
    text: 'Буквальнее: «в веки веков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: сделал
  rationale: Аорист передан простым прошедшим временем. Современное «сделал» сохраняет смысл действия и не вносит дополнительно подчеркнутого результата, как могло бы «соделал» или «сделал… навеки».
- source_word: βασιλείαν
  choice: царством
  rationale: Единственное число означает «царство», а не «царей». Творительный падеж естественно сочетается с «сделал нас» и сохраняет корпоративный образ общины.
- source_word: ἱερεῖς
  choice: священниками
  rationale: Прямой эквивалент сохраняет культовый и заветный смысл обозначения общины.
- source_word: τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: Его Богу и Отцу
  rationale: 'Дательный падеж сохранён без поясняющего предлога и выражает принадлежность служения. «Его» относится к Иисусу Христу и грамматически связано с обоими существительными: Богом и Отцом.'
- source_word: αὐτῷ
  choice: Ему
  rationale: Дательный в безглагольном славословии естественно передаётся формулой «Ему слава…» без добавления отсутствующего в греческом глагола.
- source_word: δόξα
  choice: слава
  rationale: Устойчивый и точный русский эквивалент в славословии.
- source_word: κράτος
  choice: владычество
  rationale: Передаёт не просто способность или силу, а могущественную верховную власть, соответствующую употреблению слова в славословии.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Естественная и укоренённая русская формула для неограниченной длительности; буквальный образ «веков» при этом не исчезает.
- source_word: ἀμήν
  choice: Аминь
  rationale: Традиционная русская передача литургического утверждения, понятная современному читателю.
theological_decisions:
- issue: К кому относится «Его Богу и Отцу»
  choice: 'Местоимение «Его» относится к Иисусу Христу: община сделана царством и священниками Его Богу и Отцу.'
  alternative: Сгладить выражение как «Богу, Его Отцу» или просто «Богу Отцу».
  rationale: Ближайший референт в контексте — Иисус Христос. Формулировка сохраняет relational wording текста и не устраняет его христологическое напряжение.
- issue: Статус общины
  choice: Сохранено «царством, священниками».
  alternative: «царями и священниками».
  rationale: Предоставленный греческий текст содержит βασιλείαν, «царство», в единственном числе, а не «царей». Перевод отражает основной текст и сохраняет корпоративный образ.
- issue: Адресат славословия
  choice: Местоимение «Ему» оставлено с той же референциальной связностью, что и в греческом контексте.
  alternative: Явно подставить имя «Иисусу Христу» или «Богу».
  rationale: Явное именование сняло бы возможную синтаксическую напряжённость и добавило бы толкование, отсутствующее в исходной формулировке.
translation_notes:
  register: Современный литературный русский с достоинством славословия, без архаизма «соделал». Формула «во веки веков» сохранена как общеупотребительная библейская идиома. Тире отмечает переход к славословию. Маркеры примечаний размещены при тех выражениях, которых соответствующие примечания действительно касаются; в консультационном английском слое их привязка была переставлена.
