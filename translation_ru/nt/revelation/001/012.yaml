id: REV.1.12
reference: Revelation 1:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀Καὶ ἐπέστρεψα βλέπειν τὴν φωνὴν ἥτις ἐλάλει μετ’ ἐμοῦ· καὶ ἐπιστρέψας εἶδον ἑπτὰ λυχνίας χρυσᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/012.yaml
  text: And I turned to see the voice that was speaking with me[a], and when I turned, I saw seven golden lampstands,
translation:
  language: ru
  text: Я обернулся, чтобы увидеть голос, говоривший со мной[a]. Обернувшись, я увидел семь золотых светильников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говоривший мне». Буквально по-гречески: «говоривший со мной».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψα
  choice: я обернулся
  rationale: Глагол обозначает физический поворот; «обернулся» естественно передаёт ситуацию, в которой Иоанн поворачивается к источнику голоса.
- source_word: βλέπειν
  choice: чтобы увидеть
  rationale: Инфинитив выражает цель поворота. Хотя буквально увидеть можно говорящего, а не голос, сохранён намеренный образ исходного текста.
- source_word: φωνὴν
  choice: голос
  rationale: В контексте речи φωνή означает именно «голос», а не просто «звук».
- source_word: ἐλάλει μετ’ ἐμοῦ
  choice: говоривший со мной
  rationale: Причастный оборот передаёт продолженное действие имперфекта, а «со мной» сохраняет значение совместности, выраженное μετά с родительным падежом.
- source_word: ἐπιστρέψας
  choice: обернувшись
  rationale: Деепричастие кратко и естественно передаёт действие, предшествующее тому, что Иоанн увидел.
- source_word: εἶδον
  choice: я увидел
  rationale: Прямое соответствие аористу ὁράω; приставка «у-» здесь естественна в русском повествовании и обозначает состоявшееся зрительное восприятие.
- source_word: ἑπτὰ λυχνίας χρυσᾶς
  choice: семь золотых светильников
  rationale: λυχνία обозначает подставку для лампы, но в русском библейском и литературном употреблении «светильник» естественно называет весь осветительный предмет и сохраняет связь с последующим истолкованием образа; «золотых» передаёт материал или вид предметов без лишнего уточнения.
theological_decisions:
- issue: Передача символического предмета λυχνίας в апокалиптическом контексте
  choice: светильников
  alternative: подставок для ламп; лампад
  rationale: «Светильники» — конкретное, понятное и устойчивое русское обозначение этого образа; оно позволяет сохранить терминологическую связь с Откровением 1:20, не подменяя сам предмет его символическим толкованием.
- issue: Необычное выражение «увидеть голос»
  choice: сохранить «увидеть голос»
  alternative: увидеть того, чей голос говорил со мной; посмотреть, кто говорил со мной
  rationale: Греческий текст прямо соединяет βλέπειν с τὴν φωνήν. Сглаживание устранило бы яркий апокалиптический образ и истолковало бы объект видения за автора.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной повествовательной тональности. Необычный оборот «увидеть голос» намеренно оставлен как черта исходного текста; повтор «обернулся — обернувшись» сохраняет риторическую структуру греческого стиха.
