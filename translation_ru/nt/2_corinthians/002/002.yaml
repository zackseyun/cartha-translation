  text: For if I grieve you[a], who is there to make me glad except the one who is grieved by me?
translation:
  language: ru
  text: Ведь если я огорчаю вас, то кто порадует меня, кроме того, кто огорчён из-за меня[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
