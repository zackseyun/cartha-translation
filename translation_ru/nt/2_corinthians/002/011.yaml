    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: чтобы… не
  rationale: Естественно передаёт целевое значение с отрицанием и сохраняет связь с предшествующим контекстом.
- source_word: πλεονεκτηθῶμεν
  choice: не перехитрил нас
  rationale: В данном контексте передаёт идею получения преимущества над кем-либо посредством коварного расчёта; сноска сохраняет более широкую возможность значения «воспользоваться нами» или «обмануть нас».
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: сатана… нас
  rationale: Греческая пассивная конструкция естественно преобразована в русскую активную; личное имя передано традиционной транслитерацией.
- source_word: γὰρ
  choice: ведь
  rationale: Вводит основание для предшествующего утверждения и естественно звучит в современном русском.
- source_word: νοήματα
  choice: замыслы
  rationale: В контексте обозначает продуманные намерения или планы сатаны, не сводя значение лишь к нейтральным мыслям.
- source_word: οὐ… ἀγνοοῦμεν
  choice: нам известны
  rationale: Естественная русская передача литоты «мы не не знаем / не остаёмся в неведении» без изменения её смыслового результата.
