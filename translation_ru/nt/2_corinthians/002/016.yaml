  text: οἷς μὲν ὀσμὴ ⸀ἐκ θανάτου εἰς θάνατον, οἷς δὲ ὀσμὴ ⸁ἐκ ζωῆς εἰς ζωήν. καὶ πρὸς ταῦτα τίς ἱκανός;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/016.yaml
  text: To the one[a], a fragrance from death to death; to the other, a fragrance from life to life[c][b]. And who is sufficient for these things?
translation:
  language: ru
  text: Для одних — запах от смерти к смерти, для других же — запах от жизни к жизни.[a] И кто способен на это?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражения «от смерти к смерти» и «от жизни к жизни» могут обозначать источник и результат («из смерти, ведущий к смерти» / «из жизни, ведущий к жизни») либо усиленно характеризовать запах как смертоносный и животворный.
    reason: alternative_reading
  - marker: b
    text: 'Или: «И кто достаточен для этого?»; также возможно: «кто пригоден для этого?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσμή
  choice: запах
  rationale: «Запах» — естественное и семантически нейтральное русское слово, способное передать как смертоносную, так и животворную сторону единого образа; «благоухание» в первой половине звучало бы неуместно положительно.
- source_word: ἐκ θανάτου εἰς θάνατον
  choice: смерти, ведущий к смерти
  rationale: Передаёт вероятное отношение источника и результата, сохраняя сжатость и параллелизм греческого выражения; возможность усилительной характеристики отмечена в сноске.
- source_word: ἐκ ζωῆς εἰς ζωήν
  choice: жизни, ведущий к жизни
  rationale: Симметрично передаёт вторую часть противопоставления и сохраняет повтор «жизнь — жизнь».
- source_word: πρὸς ταῦτα
  choice: на такое
  rationale: Естественный современный русский эквивалент, относящий вопрос к только что описанному служению и его последствиям.
- source_word: ἱκανός
  choice: способен
  rationale: В риторическом вопросе естественно выражает достаточность, пригодность и соответствие столь весомой задаче.
theological_decisions:
- issue: Смысл парных выражений ἐκ θανάτου εἰς θάνατον и ἐκ ζωῆς εἰς ζωήν
  choice: В основном тексте передать вероятное движение от источника к результату, а неоднозначность сохранить в сноске.
  alternative: «от смерти к смерти / от жизни к жизни» либо характеристика запаха как смертоносного / животворного.
  rationale: Греческие предлоги естественно допускают смысл источника и результата, но выражение остаётся сжатым и может иметь усилительный оттенок; сноска не позволяет свести его к единственному толкованию.
- issue: Объём вопроса καὶ πρὸς ταῦτα τίς ἱκανός;
  choice: «И кто способен на такое?»
  alternative: «И кто достаточен для этого?»
  rationale: Выбранная формулировка ясно передаёт вопрос о человеческой пригодности к описанному служению, не утверждая здесь источник этой способности и не привнося конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с кратким, риторически выразительным параллелизмом. Нейтральное слово «запах» сохраняет двусторонность метафоры; тире помогают воспроизвести противопоставление. Все маркеры сносок присутствуют в основном тексте.
