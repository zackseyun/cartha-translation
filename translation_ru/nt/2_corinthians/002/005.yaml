  text: Εἰ δέ τις λελύπηκεν, οὐκ ἐμὲ λελύπηκεν, ἀλλὰ ἀπὸ μέρους ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: ru
  text: Если же кто-то причинил огорчение, то огорчил не меня, а в какой-то мере — всех вас, чтобы не преувеличивать.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы не слишком обременять всех вас». Греческий глагол буквально означает «возлагать бремя»; его связь с «всех вас» и риторический оттенок фразы понимаются по-разному.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λελύπηκεν
  choice: причинил огорчение / огорчил
  rationale: 'Сохраняется повтор одного греческого глагола и его смысл: совершённое действие продолжает иметь последствия. Русское прошедшее время выражает это естественнее буквального воспроизведения перфекта.'
- source_word: οὐκ ἐμὲ
  choice: не меня
  rationale: Прямая передача контраста без добавочного усиления вроде «не меня лично».
- source_word: ἀπὸ μέρους
  choice: отчасти
  rationale: Кратко и естественно передаёт ограничительный смысл оборота, не уточняя сверх текста, относится ли ограничение прежде всего к степени огорчения или к охвату всей общины.
- source_word: ἐπιβαρῶ
  choice: не сказать слишком резко
  rationale: В данном контексте глагол с образом возложения бремени, вероятно, служит риторическим смягчением высказывания. Основной текст передаёт эту функцию, а буквальный смысл и иной возможный синтаксический разбор отмечены в сноске.
- source_word: πάντας ὑμᾶς
  choice: всех вас
  rationale: Сохраняется явно выраженный всеобщий охват обращения к коринфской общине.
theological_decisions:
- issue: К кому относится причинённое огорчение и как связаны ἀπὸ μέρους, ἵνα μὴ ἐπιβαρῶ и πάντας ὑμᾶς
  choice: «отчасти — чтобы не сказать слишком резко — всех вас»
  alternative: «но отчасти, чтобы не обременять всех вас»
  rationale: Греческая конструкция допускает более буквальное соединение «чтобы не обременять всех вас», однако в контексте её часто понимают как оговорку Павла, смягчающую утверждение, что виновный огорчил всю общину. Основной текст остаётся ясным, а сноска сохраняет реальную синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и пастырский. Повтор «огорчение / огорчил» намеренно сохраняет лексическую связь оригинала, а тире выделяют смягчающую оговорку Павла.
