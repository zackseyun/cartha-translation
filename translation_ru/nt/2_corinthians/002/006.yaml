  text: Для такого человека достаточно наказания, наложенного большинством.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Для такого человека достаточно взыскания, наложенного большинством».'
    reason: 'Лексическая альтернатива: ἐπιτιμία может быть передано как «взыскание»; этот вариант сохраняет смысл дисциплинарной меры.'
lexical_decisions:
- source_word: ἱκανὸν
  choice: достаточно
  rationale: Предикативное «достаточно» естественно по-русски и передаёт мысль о том, что уже применённая мера достигла необходимой степени.
- source_word: τῷ τοιούτῳ
  choice: для такого человека
  rationale: Выражение указывает на конкретного виновного; «человека» сохраняет личный характер обозначения и звучит естественнее буквального «такого».
- source_word: ἐπιτιμία
  choice: наказание
  rationale: В данном контексте слово обозначает применённую общиной дисциплинарную меру. «Наказание» яснее передаёт конкретную санкцию, тогда как «порицание» могло бы быть понято лишь как словесный упрёк.
- source_word: ἡ ὑπὸ τῶν πλειόνων
  choice: которому его подвергло большинство
  rationale: Оборот передаёт деятеля при применённом наказании и естественно связывается с русским словом «наказание»; οἱ πλείονες понимается как большая часть общины.
