lexical_decisions:
- source_word: ἔκρινα
  choice: решил
  rationale: Аорист κρίνω здесь передаёт принятое, обдуманное личное решение; «решил» естественно и точно звучит по-русски.
- source_word: γὰρ
  choice: итак
  rationale: Частица вводит объяснение предыдущего высказывания. В данном контексте русское «итак» естественно передаёт пояснительно-выводную связь, не утяжеляя фразу.
- source_word: ἐμαυτῷ
  choice: для себя
  rationale: Возвратное местоимение в дательном падеже подчёркивает личный и внутренне принятый характер решения.
- source_word: τοῦτο
  choice: вот что
  rationale: Указательное местоимение отсылает вперёд к содержанию решения; оборот «вот что» естественно подготавливает следующее пояснение.
- source_word: τὸ μὴ ... ἐλθεῖν
  choice: не приходить
  rationale: Артиклированный инфинитив выражает содержание решения; русский инфинитив сохраняет краткость и структуру исходного текста.
- source_word: πάλιν
  choice: снова
  rationale: Передаёт повторность действия без добавочного толкования.
- source_word: ἐν λύπῃ
  choice: в печали
  rationale: Сохраняет образ состояния, выраженный ἐν, и широкое значение λύπη — печаль, скорбь или огорчение.
- source_word: πρὸς ὑμᾶς
  choice: к вам
  rationale: При глаголе движения πρός с винительным естественно передаётся по-русски как «к вам».
