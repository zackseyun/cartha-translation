  text: εἰς τοῦτο γὰρ καὶ ἔγραψα ἵνα γνῶ τὴν δοκιμὴν ὑμῶν, εἰ εἰς πάντα ὑπήκοοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: ru
  text: 'Ибо именно для этого я и написал: чтобы узнать на деле[a], послушны ли вы во всём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. δοκιμή может означать «испытанность», «проверенное качество» или «результат, доказательство проверки».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ καὶ ἔγραψα
  choice: Именно для того я и написал
  rationale: «Именно для того» естественно передаёт целевое значение εἰς τοῦτο, γὰρ связывает фразу с предшествующим объяснением, а частица «и» сохраняет добавочное значение καὶ.
- source_word: ἵνα γνῶ
  choice: чтобы узнать
  rationale: Сохраняет целевое придаточное и значение обретения знания, не утяжеляя современную русскую фразу.
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: как вы проявите себя в испытании
  rationale: δοκιμή может обозначать как испытание, так и обнаруженный им результат — доказанность или проверенное качество. Выбранная формулировка естественна по-русски и удерживает оба смысловых аспекта.
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: послушны ли вы во всём
  rationale: Передаёт εἰ как вводное слово косвенного вопроса после «узнать», а εἰς πάντα — как всеохватность послушания.
theological_decisions:
- issue: Отношение δοκιμή к последующей фразе о послушании
  choice: Двоеточие представляет «послушны ли вы во всём» как раскрытие того, в чём состоит испытание общины.
  alternative: Запятая могла бы представить эти слова как более самостоятельный косвенный вопрос.
  rationale: В греческом тексте εἰ вводит вопрос, уточняющий содержание узнаваемой δοκιμή; двоеточие ясно и без догматического переосмысления передаёт эту связь по-русски.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировка избегает неестественного буквального выражения «доказательство вас», сохраняя смысловую широту δοκιμή.
