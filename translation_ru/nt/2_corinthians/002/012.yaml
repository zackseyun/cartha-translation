  naturalness: «Когда же я пришёл … и передо мной уже была открыта дверь …» естественно для современного литературного русского, сохраняет незавершённую синтаксическую связь со следующим стихом и яснее передаёт метафорический образ.
  terminology: «Евангелие Мессии» согласуется с принятым титульным пониманием Χριστός и не навязывает один конкретный оттенок родительного падежа. «В Господе» уместно сохраняет неоднозначность ἐν κυρίῳ. Название «Троада» нормативно.
