source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ εἰς τὴν Τρῳάδα εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ θύρας μοι ἀνεῳγμένης ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/012.yaml
  text: When I came to Troas for the gospel of Messiah[a], and a door had been opened for me in the Lord[b],
translation:
  language: ru
  text: Когда же я пришёл в Троаду ради Евангелия Мессии[a] и передо мной уже была открыта дверь в Господе[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради Евангелия Христа»; также возможно по смыслу: «ради Евангелия о Мессии».'
    reason: 'Лексическая и синтаксическая альтернатива: Χριστός можно передать традиционным «Христос», а родительный падеж допускает понимание вести как вести о Мессии.'
  - marker: b
    text: 'Или: «и передо мной стояла открытая в Господе дверь».'
    reason: Альтернативная передача перфектного причастия, подчёркивающая сохранявшееся состояние открытой двери.
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Когда же я пришёл
  rationale: Аористное причастие передано временным придаточным, а δέ — мягкой переходной частицей «же». Такая формулировка естественна по-русски и сохраняет связь с продолжением мысли в следующем стихе.
- source_word: εἰς τὴν Τρῳάδα
  choice: в Троаду
  rationale: Обычная русская передача направления движения с названием города.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: ради Евангелия
  rationale: Второе εἰς выражает цель. «Ради» передаёт целевое значение, не добавляя отсутствующего в греческом тексте глагола «проповедовать».
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь сохраняет значение титула Помазанника. Родительный падеж оставлен без уточнения «о», чтобы не сужать возможный смысл сочетания.
- source_word: θύρας
  choice: дверь
  rationale: Сохранён образ двери, хотя в контексте он обозначает предоставленную возможность для служения.
- source_word: ἀνεῳγμένης
  choice: была открыта
  rationale: Перфектное страдательное причастие указывает на совершившееся открытие и сохраняющийся результат; русская страдательная конструкция передаёт оба аспекта достаточно ясно.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохранена характерная для Павла формула и неоднозначность ἐν без сведения её только к значению «Господом» или «благодаря Господу».
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В данном сочетании слово естественно воспринимается как титул Помазанника; «Мессия» раскрывает титульное значение, а традиционная форма «Христос» отмечена как допустимая альтернатива.
- issue: Связь родительного τοῦ Χριστοῦ с εὐαγγέλιον
  choice: Евангелия Мессии
  alternative: Евангелия о Мессии
  rationale: Родительный падеж может обозначать как принадлежность или источник, так и содержание вести. Основной текст сохраняет эту неоднозначность и не навязывает только объектное толкование.
- issue: Значение ἐν κυρίῳ
  choice: в Господе
  alternative: Господом
  rationale: Формулировка может указывать на сферу служения или на действие Господа. Буквенно близкая передача сохраняет богословское напряжение и не делает инструментальное понимание единственно возможным.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. «Евангелие» выбрано как общеупотребительный и точный термин; метафора двери и формула «в Господе» сохранены. Конечная запятая отражает незавершённость греческого предложения, продолжающегося в 2 Кор 2:13.
