source:
  edition: SBLGNT
  text: ὥστε τοὐναντίον ⸀μᾶλλον ὑμᾶς χαρίσασθαι καὶ παρακαλέσαι, μή πως τῇ περισσοτέρᾳ λύπῃ καταποθῇ ὁ τοιοῦτος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/007.yaml
  text: so that[a], on the contrary, you should rather forgive and comfort him[b], so that such a person may not be overwhelmed by excessive sorrow.
translation:
  language: ru
  text: так что вам, напротив, лучше простить и утешить его, чтобы такой человек не был поглощён чрезмерной скорбью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не был проглочен чрезмерной скорбью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὐναντίον
  choice: напротив
  rationale: Ясно передаёт резкий поворот от прежней меры взыскания к восстановлению человека.
- source_word: μᾶλλον
  choice: скорее
  rationale: Сохраняет сравнительный оттенок наречия рядом с τοὐναντίον, не усиливая его до значения «тем более».
- source_word: χαρίσασθαι
  choice: простить
  rationale: В контексте церковного взыскания речь идёт о даровании прощения; глагол при этом несёт оттенок милостивого дара.
- source_word: παρακαλέσαι
  choice: утешить
  rationale: Последующее упоминание скорби делает значение утешения наиболее естественным, хотя глагол может также означать ободрение.
- source_word: καταποθῇ
  choice: был поглощён
  rationale: Сохраняет яркую исходную метафору «быть проглоченным», оставаясь понятным по-русски.
- source_word: ὁ τοιοῦτος
  choice: такой человек
  rationale: Передаёт неопределённо-указательное выражение без излишней конкретизации личности.
- source_word: τῇ περισσοτέρᾳ λύπῃ
  choice: чрезмерной скорбью
  rationale: Естественно выражает здесь опасность слишком сильной, подавляющей скорби.
theological_decisions:
- issue: Характер действия, выраженного χαρίσασθαι
  choice: простить
  alternative: милостиво отнестись
  rationale: Контекст восстановления после взыскания поддерживает значение прощения, но перевод не уточняет ни форму взыскания, ни условия восстановления.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет противопоставление и цель увещания. Метафора καταποθῇ оставлена в основном тексте в естественной русской форме.
