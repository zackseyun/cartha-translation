base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/004.yaml
  text: For out of much affliction and anguish of heart I wrote to you through many tears[a], not so that you might be grieved[b], but so that you might know the love that I have especially for you.
translation:
  language: ru
  text: Ибо я писал вам в великой скорби и сердечной муке, со многими слезами, не для того, чтобы опечалить вас, а чтобы вы узнали, какую большую любовь я питаю к вам[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «какую любовь я питаю к вам в ещё большей мере»; слово περισσοτέρως может выражать особую, обильную меру любви и иметь сравнительный оттенок, без указанного объекта сравнения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ πολλῆς θλίψεως
  choice: Ибо я писал вам в великой скорби
  rationale: Предлог ἐκ указывает на внутреннее состояние, из которого возникло письмо; по-русски это естественно передаётся обстоятельством «в великой скорби», без сужения θλῖψις до внешнего преследования.
- source_word: συνοχῆς καρδίας
  choice: сердечной муке
  rationale: Передаёт внутреннюю стеснённость и мучительное напряжение сердца современным, эмоционально весомым выражением.
- source_word: ἔγραψα
  choice: я писал
  rationale: Простой аорист не требует добавления «раньше»; указание на предшествующее письмо остаётся контекстуальным.
- source_word: διὰ πολλῶν δακρύων
  choice: со многими слезами
  rationale: Естественное русское выражение сопутствующего обстоятельства сохраняет образ письма, написанного в слезах.
- source_word: οὐχ ἵνα λυπηθῆτε
  choice: не для того, чтобы опечалить вас
  rationale: Естественная русская причинительная конструкция точно передаёт цель, которую Павел отрицает; пассивный смысл греческой формы выражен через результат для адресатов.
- source_word: τὴν ἀγάπην ἵνα γνῶτε
  choice: чтобы вы узнали… мою любовь
  rationale: Сохраняет целевую конструкцию и обычное соответствие ἀγάπη — «любовь».
- source_word: ἣν ἔχω περισσοτέρως εἰς ὑμᾶς
  choice: как особенно сильна моя любовь к вам
  rationale: Передаёт усилительное, возможно сравнительное значение περισσοτέρως естественным современным русским языком, не вводя неуказанный объект сравнения.
theological_decisions:
- issue: Сравнительная или усилительная сила περισσοτέρως
  choice: «как особенно сильна моя любовь к вам»
  alternative: '«как велика моя любовь к вам»; более буквально: «какую любовь я имею к вам в большей мере»'
  rationale: В контексте не назван объект сравнения. Основной текст сохраняет повышенную степень любви, а сноска отмечает возможную сравнительную силу, не утверждая, что Павел любит коринфян больше какой-либо конкретной группы.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясной эмоциональной силой. Синтаксис упрощён до естественного русского порядка, при этом сохранены скорбь, сердечная мука, слёзы и противопоставление целей письма.
