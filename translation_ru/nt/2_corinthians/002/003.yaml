  text: καὶ ⸀ἔγραψα τοῦτο αὐτὸ ἵνα μὴ ἐλθὼν λύπην ⸀σχῶ ἀφ’ ὧν ἔδει με χαίρειν, πεποιθὼς ἐπὶ πάντας ὑμᾶς ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: ru
  text: И я написал именно это, чтобы, придя, не испытать печали от тех, кто должен был бы меня радовать,[a] будучи уверенным в вас всех, что моя радость — это радость всех вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «от тех, от кого мне следовало бы радоваться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: я написал
  rationale: Аорист передан простым прошедшим временем и указывает на написанное Павлом ранее.
- source_word: τοῦτο αὐτό
  choice: именно это
  rationale: Сочетание имеет усилительное значение; «именно это» естественно передаёт эмфазу по-русски.
- source_word: ἵνα μὴ ... λύπην σχῶ
  choice: чтобы ... не испытать печали
  rationale: Сохраняется целевое значение ἵνα и эмоциональный смысл λύπη; русская инфинитивная конструкция естественна при совпадении субъекта.
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: от тех, кто должен был бы меня радовать
  rationale: Передаёт людей как ожидаемый источник радости Павла, избегая неестественной русской кальки; более буквальная конструкция дана в сноске.
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: будучи уверен во всех вас
  rationale: Причастная конструкция сохраняет форму и не усиливает смысл до однозначно причинного «потому что»; перфект выражает устойчивую уверенность.
- source_word: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: моя радость — это радость всех вас
  rationale: Сохранена близкая к греческой структура и мысль об общей для Павла и коринфян радости без сведения её к одному лишь владению или переживанию.
theological_decisions:
- issue: Характер связи причастия πεποιθὼς с основной мыслью
  choice: будучи уверен
  alternative: потому что я был уверен
  rationale: Греческое причастие допускает обстоятельственный, в том числе причинный, оттенок, но не требует его однозначной экспликации; причастная передача сохраняет эту открытость.
- issue: Смысл выражения «моя радость — радость всех вас»
  choice: сохранить взаимосвязь радости без поясняющего перефразирования
  alternative: все вы разделяете мою радость
  rationale: Родительный πάντων ὑμῶν допускает понимание общей или разделяемой радости; более узкая формулировка могла бы преждевременно устранить смысловую ёмкость текста.
translation_notes:
  register: Современный литературный русский язык, доступный обычному читателю. Синтаксис в целом естественный, но причастный оборот намеренно сохраняет смысловую связь оригинала и не превращает её в однозначно причинную.
