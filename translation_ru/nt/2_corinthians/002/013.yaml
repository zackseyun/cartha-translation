  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: ru
  text: Дух мой не находил покоя, потому что я не встретил Тита, моего брата[a]. Но, простившись с ними, я отправился в Македонию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Брат» — здесь брат по вере.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἔσχηκα ἄνεσιν
  choice: не находил покоя
  rationale: Греческий перфект в повествовательном контексте описывает сохранявшееся тогда состояние Павла; естественное русское выражение «не находил покоя» передаёт внутреннее беспокойство и значение ἄνεσις.
- source_word: τῷ πνεύματί μου
  choice: дух мой
  rationale: 'Дательный указывает на сферу или отношение: покоя не было у духа Павла. Формулировка сохраняет слово «дух», не сводя его значение только к чувствам или психическому состоянию.'
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: потому что я не встретил там Тита
  rationale: Артиклевый инфинитив с μή выражает причину отсутствия покоя. «Не встретил» естественно для ситуации, когда Павел ожидал увидеть Тита; «там» проясняет подразумеваемое место, не меняя смысла.
- source_word: Τίτον τὸν ἀδελφόν μου
  choice: Тита, брата моего
  rationale: Сохранена семейная метафора Павла и её тёплый оттенок; речь идёт о брате по вере и соработнике, а не о кровном родственнике.
- source_word: ἀποταξάμενος αὐτοῖς
  choice: простившись с ними
  rationale: Причастие обозначает прощание перед уходом. Эта формулировка современна, точна и сохраняет временную связь с последующим отправлением.
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: я отправился в Македонию
  rationale: Передаёт направленное отбытие естественным современным русским языком без неуместного буквализма «вышел в Македонию».
theological_decisions:
- issue: Значение πνεῦμα в выражении τῷ πνεύματί μου
  choice: «дух мой»
  alternative: «душа моя» или «я внутренне»
  rationale: Перевод сохраняет антропологический термин исходного текста и не разрешает без необходимости вопрос о том, обозначает ли он человеческий дух, внутреннее состояние или личность Павла в целом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «дух мой» и выражение «брата моего» сохраняют достоинство и эмоциональную теплоту текста, оставаясь понятными современному читателю.
