  terminology: «Дух» верно сохраняет πνεῦμα без богословского сужения. «Брат» корректно передает ἀδελφός; пояснение «по вере» уместно. Указание на соработничество относится к более широкому контексту Павла, а не прямо к лексическому содержанию данного стиха, поэтому его лучше не включать в краткую сноску.
