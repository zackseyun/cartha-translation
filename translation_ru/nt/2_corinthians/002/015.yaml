  text: ὅτι Χριστοῦ εὐωδία ἐσμὲν τῷ θεῷ ἐν τοῖς σῳζομένοις καὶ ἐν τοῖς ἀπολλυμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/015.yaml
  text: For we are the aroma of Messiah to God among those who are being saved and among those who are perishing[b][a],
translation:
  language: ru
  text: Ведь мы — Христово благоухание для Бога среди спасаемых и среди погибающих.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ведь
  rationale: Союз вводит пояснение к предыдущей мысли; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: Χριστοῦ
  choice: Христово
  rationale: Притяжательное прилагательное сохраняет родительный падеж и естественно передаёт принадлежность или связь благоухания со Христом, не сводя эту связь к одному узкому толкованию.
- source_word: εὐωδία
  choice: благоухание
  rationale: Слово передаёт образ приятного запаха и в русском библейском контексте естественно сочетается с образом благоухания, обращённого к Богу.
- source_word: τῷ θεῷ
  choice: для Бога
  rationale: Так передаётся дательный падеж и отношение благоухания к Богу без добавления отсутствующего в тексте действия.
- source_word: ἐν τοῖς σῳζομένοις
  choice: среди спасаемых
  rationale: 'Субстантивированное причастие настоящего времени сохраняет процессуальный оттенок: речь идёт о тех, кто спасается или кого спасают.'
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: среди погибающих
  rationale: Причастие настоящего времени передаёт продолжающийся процесс; «погибающих» не уточняет сверх текста характер погибели.
theological_decisions:
- issue: Процессуальный аспект σῳζομένοις и ἀπολλυμένοις
  choice: «среди спасаемых и среди погибающих»
  alternative: «среди спасённых и погибших»
  rationale: Настоящие причастия представлены как продолжающиеся процессы, а не заменены обозначениями уже завершившихся состояний.
- issue: Смысл родительного Χριστοῦ при εὐωδία
  choice: «Христово благоухание»
  alternative: «благоухание Христа»
  rationale: Формулировка сохраняет возможные оттенки принадлежности, происхождения и характеристики, не выбирая без необходимости только один из них.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «среди» сохраняет параллелизм двух греческих конструкций с ἐν.
