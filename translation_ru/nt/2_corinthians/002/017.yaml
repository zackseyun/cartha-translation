  source_fidelity: 'В основном переданы противопоставление «многим», коммерчески-корыстный образ καπηλεύοντες, «слово Божье», «перед Богом» и «в Мессии». Однако в основном тексте утрачена первая сравнительная конструкция ὡς ἐξ εἰλικρινείας («как из/от искренности»): наречие «искренне» передаёт качество речи, но не сохраняет параллелизм двух ὡς и двух указаний на источник. Кроме того, единственное «Напротив» сглаживает повторное ἀλλ’ сильнее, чем необходимо.'
