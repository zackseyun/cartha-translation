revisions:
- from: Ведь мы не такие, как многие[a], которые торгуют словом Божьим[b]. Напротив, мы говорим искренне[c], как от Бога, перед Богом[d], в Мессии[e].
  to: Ведь мы не подобны многим[a], которые торгуют словом Божьим[b]. Мы же говорим перед Богом[d], в Мессии[e], как от искренности[c], как от Бога.
  rationale: «Подобны» естественно передаёт ὡς в начальном сравнении. Формулировка «как от искренности, как от Бога» намеренно сохраняет обе сравнительные конструкции и их параллелизм; несколько необычная, но понятная сочетаемость соответствует возвышенному библейскому регистру и не подменяет «от Бога» более толковательным «посланные Богом». Порядок «перед Богом, в Мессии» следует греческому тексту и делает связь с «говорим» ясной.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:58:13Z'
