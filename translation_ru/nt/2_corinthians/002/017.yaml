  text: οὐ γάρ ἐσμεν ὡς οἱ ⸀πολλοὶ καπηλεύοντες τὸν λόγον τοῦ θεοῦ, ἀλλ’ ὡς ἐξ εἰλικρινείας, ἀλλ’ ὡς ἐκ θεοῦ ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/017.yaml
  text: For we are not like the many[a], peddling the word of God, but as from sincerity, but as from God[f][e][d][c][b], before God we speak in Messiah.
translation:
  language: ru
  text: Ведь мы не подобны многим[a], которые торгуют словом Божьим[b]. Мы же говорим перед Богом[d], в Мессии[e], как от искренности[c], как от Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как это множество»; выражение не обязательно означает большинство людей.'
    reason: lexical_alternative
  - marker: b
    text: Глагол может подразумевать корыстный сбыт, а также порчу или подмешивание в товар ради выгоды.
    reason: lexical_alternative
  - marker: c
    text: 'Букв.: «из искренности».'
    reason: formal_equivalence
  - marker: d
    text: 'Или: «в присутствии Бога», «пред лицом Бога».'
    reason: lexical_alternative
  - marker: e
    text: 'Традиционно: «во Христе».'
    reason: alternative_rendering
lexical_decisions:
- source_word: οἱ πολλοί
  choice: многие
  rationale: Передаёт определённую, но не обязательно статистически преобладающую группу, с которой Павел противопоставляет себя и своих сотрудников.
- source_word: καπηλεύοντες
  choice: торгуют
  rationale: Сохраняет образ корыстной торговли или сбыта; возможный оттенок искажения товара ради выгоды пояснён в сноске.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: словом Божьим
  rationale: Прямая и естественная для русского библейского регистра передача родительной конструкции.
- source_word: ἐξ εἰλικρινείας
  choice: искренне
  rationale: Естественно выражает неподдельность и чистоту побуждений; буквальный оттенок источника «из искренности» отмечен в сноске.
- source_word: ἐκ θεοῦ
  choice: как от Бога
  rationale: Сохраняет сравнительную частицу ὡς и указание на Бога как источник речи и служения.
- source_word: κατέναντι θεοῦ
  choice: перед Богом
  rationale: Кратко передаёт речь в Божьем присутствии и под Его судом.
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Передаёт Χριστός как титул Помазанника и сохраняет ёмкую павловскую формулу сферы единения и служения.
- source_word: λαλοῦμεν
  choice: мы говорим
  rationale: Прямая передача настоящего времени без усиления до «возвещаем».
theological_decisions:
- issue: Значение ἐν Χριστῷ
  choice: в Мессии
  alternative: во Христе
  rationale: Основной текст раскрывает титульное значение Χριστός, не уточняя сверх греческого текста, каким именно образом речь совершается «в» Мессии; традиционная форма дана как альтернатива.
- issue: Связь ἐξ εἰλικρινείας и ἐκ θεοῦ с λαλοῦμεν
  choice: мы говорим искренне, как от Бога
  alternative: мы говорим как бы из искренности и как бы от Бога
  rationale: Обороты характеризуют происхождение и характер апостольской речи. Русское «как бы» могло бы ошибочно выражать сомнение или притворство, поэтому оно не использовано.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Длинная греческая фраза разделена на два предложения для ясности. Повтор ἀλλ’ передан одним «напротив», поскольку буквальное повторение «но… но…» в современном русском звучало бы как самопоправка. Все сноски отмечены в основном тексте.
