    issue: «распространяет» для φανεροῦντι
    rationale: φανερόω означает делать явным, проявлять, открывать. Хотя образ аромата допускает «распространять», такой выбор ослабляет прямо выраженную идею явления/открытия знания. «Являет» передаёт и исходный глагол, и метафору.
