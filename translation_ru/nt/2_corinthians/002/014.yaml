revisions:
- from: Но благодарение Богу, который в Мессии всегда ведёт нас в триумфальном шествии[a] и через нас повсюду распространяет благоухание[b] знания о Нём.
  to: Но благодарение Богу, который в Мессии всегда ведёт нас в триумфальном шествии[a] и через нас повсюду являет благоухание[b] знания о Нём.
  rationale: Заменено только «распространяет» на «являет», чтобы точнее передать φανεροῦντι («делает явным»), не утрачивая образа благоухания. Остальная формулировка и обе сноски сохраняют смысл и заявленную текстовую неоднозначность.
