  text: Τῷ δὲ θεῷ χάρις τῷ πάντοτε θριαμβεύοντι ἡμᾶς ἐν τῷ Χριστῷ καὶ τὴν ὀσμὴν τῆς γνώσεως αὐτοῦ φανεροῦντι δι’ ἡμῶν ἐν παντὶ τόπῳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/014.yaml
  text: But thanks be to God[b][a], who always leads us in triumphal procession in the Messiah and makes the fragrance of the knowledge of him known through us in every place.
translation:
  language: ru
  text: Но благодарение Богу, который в Мессии всегда ведёт нас в триумфальном шествии[a] и через нас повсюду являет благоухание[b] знания о Нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который в Мессии всегда торжествует победу над нами».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «аромат».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: благодарение
  rationale: В обороте Τῷ δὲ θεῷ χάρις это естественное русское выражение благодарности и хвалы Богу, а не отвлечённое обозначение благодати.
- source_word: θριαμβεύοντι
  choice: ведёт нас в триумфальном шествии
  rationale: Передаёт конкретный образ античного триумфального шествия и сохраняет ἡμᾶς как прямое дополнение; возможный смысл победы над пленёнными участниками шествия вынесен в сноску.
- source_word: ἐν τῷ Χριστῷ
  choice: в Мессии
  rationale: Χριστός здесь сохраняет значение титула; краткая конструкция «в Мессии» не уточняет сверх текста характер связи с Ним.
- source_word: ὀσμὴν
  choice: благоухание
  rationale: Слово естественно передаёт образ приятного аромата в данном контексте; более нейтральный вариант «аромат» отмечен в сноске.
- source_word: γνώσεως
  choice: знания
  rationale: Прямо и понятно передаёт γνώσεως, не сужая его до простого узнавания.
- source_word: φανεροῦντι
  choice: распространяет
  rationale: В сочетании с образом благоухания по-русски естественно выражает то, как Бог через служителей делает знание о Себе ощутимым и явным повсюду.
- source_word: δι’ ἡμῶν
  choice: через нас
  rationale: Точно передаёт значение посредничества или орудия при διά с родительным падежом.
- source_word: ἐν παντὶ τόπῳ
  choice: повсюду
  rationale: Естественный современный русский эквивалент, сохраняющий всеохватность греческого выражения.
theological_decisions:
- issue: Значение θριαμβεύω при ἡμᾶς в роли прямого дополнения
  choice: Бог ведёт апостольских служителей в триумфальном шествии в Мессии.
  alternative: Бог торжествует победу над нами в Мессии.
  rationale: Основной текст сохраняет яркий образ триумфального шествия и его связь с последующим образом благоухания. Поскольку глагол может представлять участников как побеждённых пленников, этот более резкий смысл не устраняется, а сохраняется в сноске.
- issue: Референт местоимения αὐτοῦ
  choice: «о Нём» относится к Богу.
  alternative: Местоимение может быть понято как относящееся к Мессии.
  rationale: Главным действующим лицом предложения является Бог, поэтому Он наиболее вероятный референт; формулировка остаётся близкой к греческой местоименной конструкции.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Образ римского триумфа сохранён, а богословски значимая двусмысленность глагола θριαμβεύω не устранена.
