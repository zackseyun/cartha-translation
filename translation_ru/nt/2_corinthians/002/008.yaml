lexical_decisions:
- source_word: διό
  choice: Поэтому
  rationale: Передаёт логическое следствие из предыдущего призыва простить и утешить человека.
- source_word: παρακαλῶ ὑμᾶς
  choice: прошу вас
  rationale: В данном контексте естественно передаёт настойчивое, но пастырское обращение Павла.
- source_word: κυρῶσαι
  choice: подтвердить
  rationale: Глагол означает сделать действительным, утвердить или официально подтвердить; «подтвердить» сохраняет оттенок явного и действенного признания любви.
- source_word: εἰς αὐτὸν ἀγάπην
  choice: свою любовь к нему
  rationale: Естественная русская конструкция, ясно передающая направленность любви на упомянутого человека.
theological_decisions:
- issue: Характер подтверждения любви
  choice: подтвердить свою любовь к нему
  alternative: вновь проявить свою любовь к нему
  rationale: Выбранный вариант не сужает смысл до эмоционального проявления и сохраняет возможный формальный или общинный оттенок κυρῶσαι.
translation_notes:
