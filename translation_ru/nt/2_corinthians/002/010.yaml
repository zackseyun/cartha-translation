id: 2CO.2.10
reference: 2 Corinthians 2:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ᾧ δέ τι χαρίζεσθε, κἀγώ· καὶ γὰρ ἐγὼ ⸂ὃ κεχάρισμαι, εἴ τι⸃ κεχάρισμαι, δι’ ὑμᾶς ἐν προσώπῳ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: ru
  text: Кому вы что-либо прощаете, тому и я прощаю. Ведь то, что я простил, — если я вообще что-либо простил, — простил ради вас перед лицом Мессии[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от лица Мессии».'
    reason: Лексически πρόσωπον может указывать не только на присутствие («перед лицом»), но и на лицо, в качестве представителя которого совершается действие.
lexical_decisions:
- source_word: χαρίζεσθε / κεχάρισμαι
  choice: прощаете / простил
  rationale: В контексте церковного взыскания и восстановления χαρίζομαι означает освобождение от вины за проступок; «прощать» естественно и точно передаёт этот смысл.
- source_word: ᾧ ... τι
  choice: кому ... что-нибудь
  rationale: 'Дательный относительного местоимения обозначает получателя прощения, а неопределённое τι сохраняет открытый объём: «что-нибудь».'
- source_word: κἀγώ
  choice: тому и я
  rationale: Сжатое греческое «и я» в русском раскрыто через соотносительное «тому», чтобы ясно передать согласие Павла с решением коринфян.
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: то, что я простил, — если я вообще что-нибудь простил, — простил
  rationale: Сохранены повтор глагола и вводная условная оговорка Павла; «вообще» естественно передаёт её осторожный, несколько самоумаляющий характер, не устраняя условности.
- source_word: δι’ ὑμᾶς
  choice: ради вас
  rationale: διά с винительным здесь выражает действие в интересах коринфян; «ради вас» кратко и естественно передаёт эту направленность.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: перед лицом Мессии
  rationale: Оборот сохраняет образ πρόσωπον («лицо») и прежде всего выражает действие в присутствии Мессии и под его взглядом, не исключая оттенка представительства.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Χριστός передан как титул «Мессия», а не как ставшее именем обозначение.
theological_decisions:
- issue: Следует ли понимать ἐν προσώπῳ Χριστοῦ как действие в присутствии Мессии или от его лица
  choice: перед лицом Мессии
  alternative: от лица Мессии / в лице Мессии
  rationale: Основной текст передаёт значение присутствия и подотчётности, тогда как примечание сохраняет возможный смысл представительства, не навязывая один богословский вывод.
- issue: Передача Χριστοῦ как титула или традиционного имени-подобного «Христос»
  choice: Мессии
  alternative: Христа
  rationale: В данном обороте ничто не требует ослаблять титульный смысл Χριστός; «Мессия» прямо передаёт титул.
translation_notes:
  register: Современный литературный русский с ясным соотносительным построением «кому... тому» и сохранённой вводной оговоркой Павла. Конечная запятая отражает синтаксическое продолжение мысли в следующем стихе.
