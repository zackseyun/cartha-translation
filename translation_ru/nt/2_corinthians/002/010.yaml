    issue: В первой фразе пропущено сказуемое при «я».
    rationale: Русское «тому и я» возможно как эллипсис, но в данном соотносительном построении менее плавно и менее ясно, чем «тому и я прощаю». Добавление сказуемого не меняет времени или смысла греческого κἀγώ.
