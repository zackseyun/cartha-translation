revisions:
- from: Кому вы что-нибудь прощаете, тому и я. Ведь то, что я простил, — если я вообще что-нибудь простил, — простил ради вас перед лицом Мессии[a],
  to: Кому вы что-либо прощаете, тому и я прощаю. Ведь то, что я простил, — если я вообще что-либо простил, — простил ради вас перед лицом Мессии[a],
  rationale: 'Исправлена только русская синтаксическая эллиптичность первой части: добавлено «прощаю». Также «что-нибудь» заменено на более литературное «что-либо» в обоих случаях. Остальные решения, включая титул «Мессия», повтор перфекта и запятую в конце как знак продолжения фразы в следующем стихе, сохранены.'
