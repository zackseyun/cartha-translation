  text: Ἔχομεν δὲ τὸν θησαυρὸν τοῦτον ἐν ὀστρακίνοις σκεύεσιν, ἵνα ἡ ὑπερβολὴ τῆς δυνάμεως ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/007.yaml
  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: ru
  text: Но это сокровище мы имеем в глиняных сосудах[a], чтобы необычайная сила[b] была от Бога, а не от нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в сосудах из обожжённой глины».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «безмерное величие силы»; возможен также перевод: «превосходящая всё сила».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχομεν δὲ
  choice: Но … мы храним
  rationale: 'δὲ передаёт контраст с предыдущим контекстом; «но» естественно выражает его по-русски. Для ἔχομεν выбрано «храним»: в сочетании с сокровищем и сосудами оно звучит естественно, не добавляя идеи, отсутствующей в образе обладания.'
- source_word: τὸν θησαυρὸν τοῦτον
  choice: это сокровище
  rationale: Сохраняются обычное значение θησαυρός и указательное местоимение, отсылающее к предшествующему контексту.
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: в глиняных сосудах
  rationale: ὀστράκινος обозначает сделанное из обожжённой глины, а σκεῦος — сосуд или вместилище. Формулировка сохраняет метафору и остаётся естественной в современном литературном русском.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое значение, допуская присущий контексту оттенок результата.
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: необычайная сила
  rationale: Греческое сочетание обозначает чрезвычайный, превосходящий обычную меру характер силы. Естественное русское выражение не воспроизводит буквально отвлечённую конструкцию «чрезвычайность силы», но сохраняет её смысл.
- source_word: ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν
  choice: 'было видно: … сила — от Бога, а не от нас'
  rationale: Связка ᾖ с родительным τοῦ θεοῦ выражает принадлежность или источник, тогда как ἐξ явно указывает на источник. «Было видно» делает цель образа ясной по-русски, а «от Бога, а не от нас» сохраняет основной контраст происхождения силы.
theological_decisions:
- issue: Смысл метафоры сокровища и глиняных сосудов
  choice: Сохранить метафору без пояснения, что именно означает сокровище и кого или что обозначают сосуды.
  alternative: Развернуть как «сокровище Благой Вести» и «наши хрупкие тела».
  rationale: Сам стих не раскрывает метафору прямо; её истолкование в основном тексте устранило бы намеренную образность и сузило возможные контекстуальные оттенки.
- issue: Значение конструкции с ἵνα
  choice: 'Передать как цель с возможным оттенком результата: «чтобы было видно».'
  alternative: 'Передать только как результат: «так что становится ясно».'
  rationale: ἵνα естественно выражает цель, хотя здесь цель тесно связана с проявляющимся результатом.
- issue: Отношение силы к Богу
  choice: 'Сохранить контраст источника: «от Бога, а не от нас».'
  alternative: 'Передать как принадлежность: «принадлежит Богу, а не нам».'
  rationale: τοῦ θεοῦ допускает оттенок принадлежности, но последующее ἐξ ἡμῶν явно выражает происхождение; единая формулировка «от … не от …» ясно сохраняет контраст.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Метафора сохранена без конфессионально обусловленного толкования. Двоеточие и тире помогают естественно выразить по-русски цель образа и противопоставление источника силы.
