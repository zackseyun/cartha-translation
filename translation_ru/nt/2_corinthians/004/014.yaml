  text: εἰδότες ὅτι ὁ ἐγείρας ⸀τὸν Ἰησοῦν καὶ ἡμᾶς ⸀σὺν Ἰησοῦ ἐγερεῖ καὶ παραστήσει σὺν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/014.yaml
  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: ru
  text: 'Потому что мы знаем: Тот, кто воскресил Иисуса[a], воскресит и нас вместе с Иисусом и представит нас вместе с вами.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Господа Иисуса» вместо «Иисуса».'
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: потому что мы знаем
  rationale: Причастие выражает основание сказанного ранее. Причинная конструкция естественна в современном русском языке и ясно передаёт связь с контекстом.
- source_word: ὁ ἐγείρας
  choice: Тот, кто воскресил
  rationale: Субстантивированное аористное причастие обозначает Бога. Такая передача сохраняет относительную конструкцию и звучит естественно и достойно.
- source_word: τὸν Ἰησοῦν
  choice: Иисуса
  rationale: Основной текст SBLGNT содержит имя «Иисус» без титула «Господь»; более пространное чтение вынесено в сноску.
- source_word: καὶ ἡμᾶς
  choice: воскресит и нас
  rationale: Частица καί имеет присоединительное значение и связывает воскресение верующих с воскресением Иисуса.
- source_word: σὺν Ἰησοῦ
  choice: вместе с Иисусом
  rationale: σύν с дательным падежом выражает совместность. Перевод сохраняет формулировку источника и не подменяет её инструментальным значением «через Иисуса».
- source_word: παραστήσει
  choice: представит нас
  rationale: Глагол может означать «представить» или «поставить перед кем-либо». Русское «представит» сохраняет эсхатологический оттенок предстояния, не уточняя сверх текста, перед кем именно произойдёт представление.
- source_word: σὺν ὑμῖν
  choice: вместе с вами
  rationale: Передаёт совместность Павла и коринфян в будущих воскресении и предстоянии.
theological_decisions:
- issue: Разночтение после ἐγείρας
  choice: 'В основном тексте: «Иисуса»; вариант «Господа Иисуса» — в сноске.'
  alternative: Господа Иисуса
  rationale: Основной текст следует SBLGNT. Разночтение является текстологическим, а не доктринальным, и потому сохраняется для прозрачности в сноске.
- issue: Эсхатологическое значение παραστήσει
  choice: «представит нас вместе с вами» без уточнения места и адресата представления
  alternative: поставит нас вместе с вами перед Собой
  rationale: Контекст указывает на будущее эсхатологическое предстояние, однако греческий текст прямо не называет, перед кем будут представлены верующие. Перевод сохраняет эту недосказанность и не сужает толкование.
- issue: Значение σὺν Ἰησοῦ
  choice: вместе с Иисусом
  alternative: через Иисуса
  rationale: Форма с σύν выражает совместность, а не средство. Хотя выражение допускает обсуждение характера этой совместности, перевод не разрешает это богословское напряжение за автора.
translation_notes:
  register: Современный литературный русский язык; ясный и достойный регистр. Сохранены причинная связь с предыдущим контекстом, повтор глагола воскресения, совместность с Иисусом и общая надежда Павла и коринфян. Местоимение «Тот» написано с прописной буквы как уважительное обозначение Бога, хотя имя Бога в стихе прямо не названо.
