  text: Διὰ τοῦτο, ἔχοντες τὴν διακονίαν ταύτην καθὼς ἠλεήθημεν, οὐκ ⸀ἐγκακοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/001.yaml
  text: Therefore, since we have this ministry, just as we have received mercy, we do not lose heart.
translation:
  language: ru
  text: Поэтому, имея это служение по милости, оказанной нам, мы не падаем духом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения Павла.
- source_word: τὴν διακονίαν ταύτην
  choice: это служение
  rationale: «Служение» естественно и точно передаёт διακονίαν в данном контексте.
- source_word: καθὼς ἠλεήθημεν
  choice: по милости, оказанной нам
  rationale: Сохраняет пассивную форму и мысль о том, что служение дано вследствие полученной милости; по-русски связь выражена естественно.
- source_word: οὐκ ἐγκακοῦμεν
  choice: мы не падаем духом
  rationale: Передаёт значение «не унываем, не ослабеваем, не сдаёмся» в современном литературном русском.
theological_decisions:
- issue: Связь полученной милости со служением и стойкостью
  choice: по милости, оказанной нам
  alternative: как мы были помилованы
  rationale: Выбранный вариант не определяет чрезмерно узко, относится ли оборот прежде всего к получению служения или к основанию стойкости, хотя синтаксически естественно связывает милость с обладанием служением.
translation_notes:
  register: Современный литературный русский; краткая, достойная и общепонятная формулировка без конфессионально окрашенной терминологии.
