source:
  edition: SBLGNT
  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: ru
  text: 'Но мы, имея тот же дух веры[a], согласно написанному: «Я поверил, потому и говорил», — и мы верим, потому и говорим[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тот же Дух веры», если под πνεῦμα подразумевается Святой Дух, а не общий с псалмопевцем исполненный веры внутренний настрой.'
    reason: alternative_reading
  - marker: b
    text: Павел цитирует Псалом 115:1 по Септуагинте (в иной нумерации — Псалом 116:10), соотнося собственную веру и речь со свидетельством псалмопевца.
    reason: cross_reference
lexical_decisions:
- source_word: Ἔχοντες δὲ
  choice: Но, имея
  rationale: Причастная конструкция сохраняет синтаксическое течение греческого текста, а «но» передаёт мягкое противопоставление или переход, выраженный δέ.
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: тот же дух веры
  rationale: Строчная буква сохраняет наиболее естественное в контексте значение общего внутреннего настроя, движимого верой, не исключая при этом возможной отсылки к Святому Духу; родительная конструкция передана без поясняющего перефразирования.
- source_word: κατὰ τὸ γεγραμμένον
  choice: согласно написанному
  rationale: Формула ясно вводит цитату из Писания и сохраняет значение соответствия написанному.
- source_word: Ἐπίστευσα, διὸ ἐλάλησα
  choice: Я поверил, потому и заговорил
  rationale: «Поверил» прямо передаёт аорист πιστεύω, а «потому и» выражает следствие в διό. «Заговорил» естественно показывает, что речь стала следствием веры, не уточняя содержания сказанного.
- source_word: καὶ ἡμεῖς πιστεύομεν
  choice: и мы верим
  rationale: Сочетание «и мы» передаёт эмфатическое ἡμεῖς с καί и подчёркивает соответствие между псалмопевцем и Павлом с его сотрудниками.
- source_word: διὸ καὶ λαλοῦμεν
  choice: потому и говорим
  rationale: Формулировка сохраняет причинно-следственную связь и риторический параллелизм с цитатой.
theological_decisions:
- issue: Обозначает ли πνεῦμα Святого Духа или общий дух, то есть исполненный веры внутренний настрой
  choice: «дух веры» со строчной буквы
  alternative: «Дух веры» как указание на Святого Духа
  rationale: Связь с цитатой «Я поверил, потому и заговорил» естественно указывает на общий настрой веры. Однако греческая фраза допускает понимание πνεῦμα как Святого Духа, поэтому эта возможность сохранена в примечании.
- issue: Передача слов группы πιστ-
  choice: «поверил / верим»
  alternative: «доверился / доверяем»; «имел веру / имеем веру»
  rationale: Выбранные слова прямо и естественно передают формы πιστεύω и сохраняют повтор, связывающий цитату с её применением Павлом.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной библейской интонацией. Сохранены причастное построение, повтор корня «вер-» и параллелизм цитаты с её применением.
