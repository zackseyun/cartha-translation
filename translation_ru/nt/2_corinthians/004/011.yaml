  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: ru
  text: Ведь нас, живущих, постоянно отдают на смерть ради Иисуса[a], чтобы и жизнь Иисуса явилась в нашей смертной плоти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за Иисуса» или «за Иисуса».'
    reason: lexical_alternative
  - marker: b
    text: «Плоть» здесь означает смертное телесное существование, а не «греховную природу».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀεὶ
  choice: постоянно
  rationale: Передаёт повторяющееся и непрерывно сопровождающее апостольское служение действие; в данном контексте по-русски звучит естественнее, чем буквальное «всегда».
- source_word: γάρ
  choice: ведь
  rationale: Сохраняет пояснительную связь с предыдущей мыслью и естественно вводит обоснование в современном русском языке.
- source_word: ἡμεῖς οἱ ζῶντες
  choice: нас, живущих
  rationale: Сохраняет выраженное местоимение и субстантивированное причастие, а также противопоставление живущих смерти.
- source_word: εἰς θάνατον παραδιδόμεθα
  choice: предают смерти
  rationale: Настоящее пассивное передаёт продолжающееся действие; русская конструкция сохраняет пассивный смысл без добавления действующего лица, а εἰς θάνατον обозначает направленность к смерти.
- source_word: διὰ Ἰησοῦν
  choice: ради Иисуса
  rationale: διά с винительным может выражать причину или основание. «Ради Иисуса» естественно передаёт страдание вследствие верности Иисусу, не исключая оттенка «из-за Иисуса»; альтернатива отмечена в сноске.
- source_word: ἵνα
  choice: чтобы
  rationale: Сохраняет целевой или результативный оттенок греческого союза, не разрешая однозначно возможное напряжение между целью и результатом.
- source_word: καὶ ἡ ζωὴ τοῦ Ἰησοῦ
  choice: и жизнь Иисуса
  rationale: «И» сохраняет соответствие предыдущему упоминанию Иисуса и параллель между смертью и жизнью.
- source_word: φανερωθῇ
  choice: явилась
  rationale: Естественный русский эквивалент пассивной формы со значением проявления или обнаружения; не добавляет явно названного деятеля.
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: в нашей смертной плоти
  rationale: Сохраняет σάρξ как «плоть» и единственное число греческого собирательно-телесного выражения; определение «смертной» ясно указывает на уязвимое телесное существование.
theological_decisions:
- issue: Значение σάρξ в выражении «смертная плоть»
  choice: буквальное «плоть»
  alternative: «тело»; «греховная природа»
  rationale: Контекст говорит о смертном и уязвимом телесном существовании апостолов, а не о нравственном принципе греха. «Плоть» сохраняет термин Павла и его связь со смертностью; пояснение предотвращает ошибочное этическое прочтение.
- issue: Смысл διὰ Ἰησοῦν
  choice: «ради Иисуса» с сохранением причинного оттенка в сноске
  alternative: «из-за Иисуса»; «за Иисуса»
  rationale: Оборот может обозначать причину — происходящее вследствие связи с Иисусом — и в контексте допускает оттенок страдания ради Него. Основной текст выбран идиоматично, а реальная смысловая широта не скрыта.
- issue: Отношение цели и результата в ἵνα
  choice: «чтобы»
  alternative: развёрнутое «для того чтобы»; результативное «так что»
  rationale: Греческая конструкция допускает тесное соединение цели и результата. Русское «чтобы» сохраняет эту открытость лучше, чем однозначно результативная передача.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Порядок слов слегка формальный, но понятный; «ведь» естественно связывает стих с контекстом. Все смысловые альтернативы, существенные для причины страдания и значения слова «плоть», вынесены в сноски.
