base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: ru
  text: Ибо всё это — ради вас, чтобы благодать, умножаясь через всё большее число людей[a], умножала благодарение во славу Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через многих»; или: «через большее число людей». Греческое выражение может обозначать как многих людей вообще, так и возрастающее число людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ γὰρ πάντα
  choice: Ведь всё это
  rationale: Артиклевое среднее множественное имеет всеобъемлющий смысл, а «это» естественно связывает фразу с предшествующим контекстом. «Ведь» передаёт пояснительную силу γάρ.
- source_word: δι’ ὑμᾶς
  choice: ради вас
  rationale: διά с винительным здесь выражает пользу или благо для адресатов; «ради вас» ясно и естественно передаёт этот смысл.
- source_word: ἡ χάρις
  choice: благодать
  rationale: Сохраняет богословскую ёмкость χάρις, не сужая её до одного конкретного действия или результата.
- source_word: πλεονάσασα
  choice: достигая
  rationale: В сочетании с διὰ τῶν πλειόνων причастие описывает расширяющееся действие благодати. Такой перевод естественен по-русски, однако не устраняет неоднозначность, которая отмечена в сноске.
- source_word: διὰ τῶν πλειόνων
  choice: всё большего числа людей[a]
  rationale: Субстантивированная сравнительная форма может указывать на возрастающее число людей, хотя возможны и более буквальные понимания «через многих» или «через большее число».
- source_word: τὴν εὐχαριστίαν περισσεύσῃ
  choice: умножала благодарение
  rationale: Передаёт изобилие, выраженное περισσεύσῃ, и сохраняет благодарение как обращённый к Богу отклик.
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: во славу Бога
  rationale: Естественная русская формула, передающая направленность и итог, выраженные εἰς.
theological_decisions:
- issue: Смысл «благодати» в придаточном цели
  choice: Сохранено широкое значение Божьей благодати, действующей и распространяющей своё воздействие среди людей.
  alternative: Уточнить как спасительную благодать, получаемую всё большим числом людей, либо как Божье благоволение в апостольском служении.
  rationale: Сам стих не требует выбрать один узкий механизм действия χάρις; перевод сохраняет богословскую ёмкость и напряжение текста.
- issue: Связь благодати, людей и благодарения
  choice: Фраза понимается так, что расширяющееся действие благодати умножает благодарение.
  alternative: 'Понимать διὰ τῶν πλειόνων как средство: благодарение изобилует «через многих».'
  rationale: Греческий синтаксис допускает разные оттенки связи. Основной текст даёт естественное контекстуальное прочтение, а сноска сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно и достойно. Сохранены ключевые богословские термины «благодать», «благодарение» и «слава», а синтаксическая неоднозначность διὰ τῶν πλειόνων вынесена в сноску.
