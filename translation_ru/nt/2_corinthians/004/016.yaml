base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/016.yaml
  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: ru
  text: Поэтому мы не падаем духом. Но даже если наш внешний человек[a] ветшает, всё же наш внутренний человек[a] обновляется день за днём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «внешний наш человек» и «внутренний наш [человек]». Во втором выражении слово «человек» подразумевается. Эта намеренная пара говорит о внешней и внутренней стороне человеческой жизни, не определяя их как жёсткое разделение тела и души.'
    reason: Поясняется сохранённая греческая антитеза, представительный смысл слова «человек» и эллипсис во втором выражении.
lexical_decisions:
- source_word: Διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения и естественно связывает стих с контекстом.
- source_word: οὐκ ἐγκακοῦμεν
  choice: мы не падаем духом
  rationale: Устойчиво и понятно передаёт значение утраты мужества или внутренней стойкости, не сводя выражение просто к прекращению действий.
- source_word: ἀλλ’ εἰ καὶ
  choice: Даже если
  rationale: Передаёт уступительный характер конструкции; отдельное «но» по-русски перед следующим противопоставлением было бы тяжеловесным.
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: наш внешний человек
  rationale: Сохраняет намеренный образ и параллель с «внутренним человеком», не превращая их заранее в строгое противопоставление тела и души.
- source_word: διαφθείρεται
  choice: разрушается
  rationale: Настоящее страдательное передаёт продолжающийся процесс разрушения и упадка; формулировка сохраняет более широкую силу греческого слова.
- source_word: ὁ ἔσω ἡμῶν
  choice: наш внутренний человек
  rationale: Восстанавливает опущенное во второй части слово «человек» и сохраняет точную риторическую пару с «внешним человеком».
- source_word: ἀνακαινοῦται
  choice: обновляется
  rationale: Передаёт продолжающееся обновление, которому подвергается внутренний человек, без добавления явно не названного действующего лица.
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: день за днём
  rationale: Естественный русский эквивалент распределительного оборота, обозначающего непрерывно повторяющееся обновление.
theological_decisions:
- issue: Соотношение «внешнего человека» и «внутреннего человека»
  choice: Сохранены выражения «внешний человек» и «внутренний человек».
  alternative: Передать как «внешняя сторона нашей жизни» и «внутренняя сторона нашей жизни» либо истолковать как «тело» и «душа».
  rationale: Текст утверждает противопоставление внешнего разрушения и внутреннего обновления, но сам по себе не формулирует исчерпывающей антропологической схемы. Буквенно понятные парные выражения сохраняют эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Парные выражения «внешний человек» и «внутренний человек» сохранены ради образа и богословской сдержанности; остальной синтаксис сделан естественным для современного читателя.
