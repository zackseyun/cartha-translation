language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλὰ ἀπειπάμεθα τὰ κρυπτὰ τῆς αἰσχύνης, μὴ περιπατοῦντες ἐν πανουργίᾳ μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ, ἀλλὰ τῇ φανερώσει τῆς ἀληθείας ⸀συνιστάνοντες ἑαυτοὺς πρὸς πᾶσαν συνείδησιν ἀνθρώπων ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: ru
  text: Но мы отвергли постыдные дела, совершаемые втайне, не действуя коварно и не искажая слово Божье[a], но, открыто являя истину[b], рекомендуя себя совести каждого человека перед Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не подделывая слово Божье»; глагол может обозначать обманное примешивание или порчу чего-либо.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «через явление истины»; речь о том, чтобы делать истину открытой и очевидной, а не только провозглашать её.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: мы отвергли
  rationale: Аорист передаёт решительный отказ; «отвергли» естественно и весомо звучит по-русски, не добавляя оттенка формального отречения.
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: постыдные дела, совершаемые втайне
  rationale: Передаёт как скрытость, так и постыдный характер подразумеваемых практик; слово «дела» эксплицирует субстантивированное τὰ κρυπτά без существенного сужения смысла.
- source_word: μὴ περιπατοῦντες ἐν πανουργίᾳ
  choice: не прибегаем к коварству
  rationale: Греческая метафора хождения обозначает образ действий. Русское «не прибегаем к коварству» естественно передаёт нечестную изворотливость πανουργία.
- source_word: μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ
  choice: и не искажаем слово Божье
  rationale: δολόω означает обманным образом фальсифицировать или примешивать чуждое. «Искажаем» ясно передаёт порчу смысла, а более конкретный образ оговорён в примечании.
- source_word: τῇ φανερώσει τῆς ἀληθείας
  choice: открыто являя истину
  rationale: Сохраняет значение обнаружения и делания явным, не сводя выражение только к словесному провозглашению.
- source_word: συνιστάνοντες ἑαυτοὺς
  choice: представляем себя суду
  rationale: В данном контексте речь о том, что служители предоставляют себя оценке совести людей. Добавление «суду» делает связь с последующей фразой естественной по-русски, не подразумевая самовосхваления.
- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: совести каждого человека
  rationale: Передаёт распределительное πᾶσαν и общий смысл ἀνθρώπων современным литературным русским языком.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: перед Богом
  rationale: Прямо сохраняет идею Божьего присутствия, свидетельства и оценки.
theological_decisions:
- issue: Характер противопоставления ложного и истинного служения
  choice: Стих говорит об этической открытости апостольского служения и честном обращении со словом Божьим.
  alternative: Понимать выражение исключительно как осуждение риторических уловок либо как исчерпывающее общее учение о всяком толковании Писания.
  rationale: Ближайший контекст касается поведения и возвещения апостолов; перевод сохраняет эту направленность, не вводя более узкого или более широкого конфессионального тезиса.
- issue: Значение φανέρωσις
  choice: «открыто являя истину» — истина делается явной без уточнения единственного способа.
  alternative: «Открыто провозглашая истину» — ограничивает выражение словесной проповедью.
  rationale: Существительное обозначает проявление или раскрытие и может охватывать как возвещение, так и прозрачный образ служения.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской речи. Причастные конструкции оригинала частично преобразованы в личные глагольные формы ради ясности. «Слово Божье» сохраняет традиционную библейскую формулу, а «открыто являя истину» удерживает намеренную широту φανέρωσις.
