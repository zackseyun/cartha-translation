    reason: lexical_alternative
lexical_decisions:
- source_word: σκοπούντων
  choice: обращаем взгляд
  rationale: Передаёт направленное внимание и сохраняет зрительный образ σκοπέω, не усиливая его до неподвижного «не сводим глаз».
- source_word: μὴ ... ἀλλὰ
  choice: не ... а
  rationale: Естественно и точно выражает отрицание и резкое противопоставление.
- source_word: τὰ βλεπόμενα
  choice: видимое
  rationale: Субстантивированное прилагательное естественно по-русски передаёт «то, что видно», сохраняя обобщённый характер выражения.
- source_word: τὰ μὴ βλεπόμενα
  choice: невидимое
  rationale: Сохраняет формальную и смысловую параллель с «видимым», не подменяя противопоставление категориями материального и духовного.
- source_word: γὰρ
  choice: ведь
  rationale: Вводит обоснование предыдущего утверждения и звучит естественно в современном русском тексте.
- source_word: πρόσκαιρα
  choice: временно
  rationale: Передаёт ограниченность во времени без более сильного оттенка кратковременности, который мог бы возникнуть у слова «мимолётно».
- source_word: αἰώνια
  choice: вечно
  rationale: В контрасте с πρόσκαιρα обозначает непреходящий, вечный характер невидимого.
- source_word: ἡμῶν
  choice: мы
  rationale: Формальный родительный субъект причастия естественно передан личным местоимением в придаточно-присоединённой конструкции.
theological_decisions:
- issue: Противопоставление видимого и невидимого
  choice: видимое ... невидимое
  alternative: материальное ... духовное
  rationale: Греческий текст говорит о воспринимаемом и не воспринимаемом зрением, не отождествляя эти категории прямо с материальным и духовным; перевод сохраняет эту смысловую открытость.
- issue: Синтаксическая связь с предыдущим стихом
  choice: поскольку мы обращаем взгляд
  alternative: мы смотрим
  rationale: Причастный оборот зависит от предыдущего высказывания; «поскольку» передаёт сопутствующее основание, хотя точный оттенок связи определяется более широким контекстом.
translation_notes:
  register: Современный литературный русский язык; сохранены риторический параллелизм и конкретный зрительный образ. Начальная строчная буква отражает синтаксическую зависимость стиха от предыдущего контекста.
