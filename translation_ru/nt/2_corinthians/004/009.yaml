  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διωκόμενοι
  choice: нас преследуют
  rationale: Передаёт враждебное преследование и сохраняет параллельную пассивную направленность греческого причастия в естественной русской конструкции.
- source_word: ἐγκαταλειπόμενοι
  choice: мы не оставлены
  rationale: «Оставлены» — современное и достаточно широкое соответствие со значением покинутости; оно не уточняет прямо, кем именно говорящие не оставлены.
- source_word: καταβαλλόμενοι
  choice: нас повергают
  rationale: Глагол означает свержение или повержение; «повергают» сохраняет образ удара, валящего наземь, и допускает переносное понимание.
- source_word: ἀπολλύμενοι
  choice: мы не погибаем
  rationale: Настоящее время «не погибаем» естественно передаёт греческое причастие настоящего времени и создаёт ясный контраст с повержением без излишнего усиления до окончательного уничтожения.
- source_word: ἀλλ’ οὐκ
  choice: но … не
  rationale: Сохраняет две краткие симметричные антитезы оригинала.
theological_decisions:
- issue: Следует ли прямо назвать Бога тем, кто не оставляет апостолов
  choice: Сохранить безлично-пассивную формулировку «мы не оставлены»
  alternative: «Бог нас не оставляет»
  rationale: В контексте такое понимание возможно и естественно, однако греческий текст не называет действующее лицо; перевод сохраняет эту недосказанность.
- issue: Передавать ли ἀπολλύμενοι как окончательное уничтожение или как гибель
  choice: «мы не погибаем»
  alternative: «мы не уничтожены»
  rationale: «Погибаем» сохраняет аспект настоящего времени и богословское напряжение между тяжёлым поражением и неокончательной гибелью, не вводя более узкого представления об уничтожении.
translation_notes:
  register: Современный литературный русский язык; краткий, ритмичный ряд антитез. Личные местоимения и глагольные формы введены для естественности русского синтаксиса, поскольку отдельно стоящие страдательные причастия звучали бы тяжеловесно. Пунктуация и конечная запятая учитывают продолжение перечня в контексте стихов 8–10.
