lexical_decisions:
- source_word: παραυτίκα
  choice: нынешнее
  rationale: Слово обозначает то, что относится к настоящему моменту и носит временный характер. «Нынешнее» естественно по-русски противопоставляется «вечной», хотя кратковременность выражает менее явно, чем буквальное «мгновенное».
- source_word: ἐλαφρὸν
  choice: лёгкое
  rationale: Сохраняет намеренную антитезу с βάρος («тяжесть») и не означает, что страдание безболезненно или незначительно.
- source_word: θλίψεως
  choice: страдание
  rationale: Передаёт переживаемую скорбь и бедствие ясным современным словом, не внося специальных эсхатологических оттенков, возможных у слова «скорбь» в некоторых контекстах.
- source_word: ἡμῶν
  choice: наше
  rationale: Передаёт притяжательный родительный падеж и относит страдание прежде всего к Павлу и его сотрудникам, не исключая более широкого применения.
- source_word: καθ’ ὑπερβολὴν εἰς ὑπερβολὴν
  choice: безмерную
  rationale: Идиоматическое удвоение ὑπερβολή выражает чрезвычайную, превосходящую всякую меру степень. «Безмерную» естественно усиливает «тяжесть славы», а буквальная структура поясняется в сноске.
- source_word: αἰώνιον
  choice: вечную
  rationale: Сохраняет прямое противопоставление временному нынешнему страданию и соответствует эсхатологическому употреблению у Павла.
- source_word: βάρος
  choice: тяжесть
  rationale: Сохраняет образную антитезу «лёгкое — тяжесть». «Бремя» могло бы ошибочно представить славу как нечто гнетущее.
- source_word: δόξης
  choice: славы
  rationale: Сохраняет родительную конструкцию «тяжесть славы», не сводя её к прилагательному и не устраняя её библейскую выразительность.
- source_word: κατεργάζεται
  choice: производит
  rationale: Передаёт действенное достижение результата и продолжающееся действие настоящего времени, не уточняя сверх текста механизм связи между страданием и славой.
- source_word: ἡμῖν
  choice: для нас
  rationale: 'Передаёт дательный пользы: слава производится для страдающих. Вариант «в нас» возможен грамматически, но мог бы сузить смысл до внутреннего нравственного преобразования.'
- source_word: τὸ ... ἐλαφρὸν τῆς θλίψεως ἡμῶν
  choice: наше нынешнее лёгкое страдание
  rationale: Естественно перестраивает греческую именную группу, сохраняя принадлежность, временность и лёгкость страдания.
theological_decisions:
- issue: Характер связи между страданием и славой
  choice: Настоящее страдание приводит для верующих к будущей вечной славе; перевод сохраняет сильный глагол причинного результата, не утверждая, что страдание заслуживает спасение.
  alternative: Понимать страдание как человеческую заслугу, приобретающую славу, либо только как средство нынешнего духовного развития.
  rationale: Контраст нынешнего и вечного указывает на эсхатологический итог. При этом κατεργάζεται выражает действенный результат, но сам стих не формулирует учения о заслуге и не позволяет ослабить связь до одной лишь внутренней зрелости.
translation_notes:
  register: Современный литературный русский язык с сохранением риторической антитезы «лёгкое — тяжесть» и библейски насыщенного выражения «тяжесть славы». «Нынешнее» звучит естественнее, чем «мгновенное», и в контексте противопоставлено «вечной»; сноска сохраняет необычную интенсивность греческой формулы.
