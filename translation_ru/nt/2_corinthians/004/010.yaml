lexical_decisions:
- source_word: πάντοτε
  choice: всегда
  rationale: Передаёт постоянный характер обстоятельства кратко и естественно.
- source_word: νέκρωσιν
  choice: смерть
  rationale: Существительное обозначает смерть, состояние мёртвенности или переживание умирания. «Смерть» ясно передаёт смысл и сохраняет параллель с «жизнью» во второй части стиха.
- source_word: τοῦ Ἰησοῦ
  choice: Иисуса
  rationale: Родительный падеж сохранён без уточнения характера связи, чтобы не сужать смысл до одного толкования.
- source_word: ἐν τῷ σώματι
  choice: в теле
  rationale: В первом случае греческий текст не содержит явного притяжательного местоимения; перевод сохраняет эту особенность.
- source_word: περιφέροντες
  choice: носим
  rationale: Настоящее причастие выражает продолжающееся несение на себе. В русском контексте личная форма звучит естественно и согласуется с подразумеваемым множественным субъектом.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое и одновременно результативное отношение между частями высказывания.
- source_word: καὶ
  choice: и
  rationale: Сохраняет соответствие между смертью Иисуса и его жизнью; в русском «и» естественно несёт значение «также» в данной конструкции.
- source_word: ζωὴ
  choice: жизнь
  rationale: Прямой эквивалент, сохраняющий контраст со смертью.
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: в нашем теле
  rationale: Сохранено единственное число греческого существительного при притяжательном местоимении множественного числа, что поддерживает коллективное звучание и параллелизм стиха.
- source_word: φανερωθῇ
  choice: явилась
  rationale: Естественно передаёт пассивный смысл проявления или обнаружения жизни Иисуса без уточнения действующего лица.
theological_decisions:
- issue: Значение νέκρωσις применительно к Иисусу
  choice: смерть Иисуса
  alternative: умирание Иисуса
  rationale: «Смерть» соответствует основному значению существительного и сохраняет точную антитезу «смерть — жизнь», а возможный процессуальный оттенок отмечен в сноске.
- issue: Число существительного σῶμα
  choice: 'единственное число в обоих случаях: «в теле» и «в нашем теле»'
  alternative: «в наших телах» во второй части
  rationale: Греческий текст дважды употребляет единственное число. Его сохранение поддерживает риторический параллелизм и допускает корпоративный смысл апостольского служения.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной и достойной формулировкой. Личная форма «мы носим» делает продолжающуюся мысль естественной для русского читателя; единственное число «тело» сохранено по греческому тексту. Маркер сноски поставлен непосредственно после спорного выражения.
