source:
  edition: SBLGNT
  text: ἐν οἷς ὁ θεὸς τοῦ αἰῶνος τούτου ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων εἰς τὸ μὴ ⸀αὐγάσαι τὸν φωτισμὸν τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ, ὅς ἐστιν εἰκὼν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/004.yaml
  text: In their case[a], the god of this age has blinded the minds of the unbelieving, so that the light of the gospel of the glory of Messiah, who is the image of God[c][b], might not shine on them.
translation:
  language: ru
  text: В их случае бог нынешнего века[b] ослепил умы неверующих, чтобы им не воссиял[a] свет Благой вести о славе Мессии[c], который является образом Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы они не увидели света Благой вести о славе Мессии». Редкий греческий глагол может подчёркивать либо сияние света, либо то, что люди его видят.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бог этого мира». Греческое αἰών обычно означает «век», подчёркивая нынешнюю падшую эпоху.'
    reason: lexical_alternative
  - marker: c
    text: Греческое Χριστός; здесь переведено как «Мессия», поскольку употреблено как титул.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: У них
  rationale: Оборот отсылает к погибающим и неверующим из предшествующего контекста. «У них» естественно передаёт эту соотнесённость и не создаёт нежелательного смысла пребывания внутри кого-либо.
- source_word: ὁ θεὸς τοῦ αἰῶνος τούτου
  choice: бог нынешнего века
  rationale: «Век» точнее передаёт αἰών как нынешнюю падшую эпоху, а не сотворённый мир. Строчная буква показывает, что речь не об истинном Боге.
- source_word: ἐτύφλωσεν τὰ νοήματα
  choice: ослепил умы
  rationale: Аорист передан совершенным видом, а νοήματα в данном контексте обозначает способность понимать и воспринимать, поэтому естественное соответствие — «умы».
- source_word: τῶν ἀπίστων
  choice: неверующих
  rationale: Субстантивированное прилагательное обозначает тех, кто не верит; этот вариант не привносит более сильного оттенка неверности или вероломства.
- source_word: εἰς τὸ μὴ αὐγάσαι
  choice: чтобы им не воссиял
  rationale: Конструкция выражает цель или результат. Редкий глагол согласован в переводе со «светом», а подразумеваемый адресат естественно выражен местоимением «им».
- source_word: τὸν φωτισμὸν
  choice: свет
  rationale: «Свет» ясно и естественно передаёт метафору, не утяжеляя текст отвлечённым словом «озарение».
- source_word: τοῦ εὐαγγελίου
  choice: Благой вести
  rationale: Передаёт исходное значение εὐαγγέλιον современным и понятным русским выражением, сохраняя его устойчивый библейский смысл.
- source_word: τῆς δόξης τοῦ Χριστοῦ
  choice: о славе Мессии
  rationale: Сохраняется смысловая связь Благой вести со славой Мессии без превращения родительного оборота в общее прилагательное «славная».
- source_word: ὅς ἐστιν εἰκὼν τοῦ θεοῦ
  choice: который является образом Бога
  rationale: Прямое христологическое утверждение сохранено без пояснительных добавлений; «образ Бога» передаёт εἰκὼν τοῦ θεοῦ и сохраняет межтекстовые связи.
theological_decisions:
- issue: Кого обозначает «бог нынешнего века»
  choice: Личная злая власть, традиционно понимаемая как сатана, но не названная в переводе прямо
  alternative: Безличная мирская система либо истинный Бог
  rationale: Греческое выражение естественно указывает на узурпирующую власть над нынешней эпохой. Перевод сохраняет формулировку источника и не подставляет отсутствующее в стихе имя.
- issue: Значение αὐγάσαι при φωτισμός
  choice: Свет Благой вести не воссиял неверующим
  alternative: Неверующие не увидели свет Благой вести
  rationale: Редкий глагол допускает акцент как на сиянии света, так и на его восприятии. Основной текст следует синтаксически естественному образу сияющего света, а другая возможность вынесена в сноску.
- issue: Сила выражения «образ Бога»
  choice: Прямое утверждение об отношении Мессии к Богу без догматического развёртывания
  alternative: Пояснение этого отношения позднейшей богословской терминологией
  rationale: Перевод сохраняет сильное христологическое утверждение греческого текста, не добавляя формулировок, которых в нём нет.
translation_notes:
  register: Современный литературный русский язык с ясным, возвышенным, но не архаичным библейским звучанием. Синтаксис сохраняет плотность и богословскую напряжённость оригинала; строчная буква в слове «бог» различает названную власть и истинного Бога.
