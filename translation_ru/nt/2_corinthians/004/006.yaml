  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: ru
  text: 'Потому что Бог, сказавший: «Из тьмы воссияет свет»[a], воссиял в наших сердцах, чтобы просветить нас познанием славы Бога в лице[b] Мессии[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эти слова перекликаются с Быт. 1:3 и переносят образ сотворённого света на Божье действие откровения в человеческом сердце.
    reason: cross_reference
  - marker: b
    text: 'Или: «в личности». Греческое слово может обозначать как лицо, так и личность; буквальное «в лице» сохраняет образ явленной и сияющей славы.'
    reason: alternative_reading
  - marker: c
    text: Греч. Χριστοῦ; традиционный перевод — «Христа». Здесь слово передано как титул «Мессия», то есть «Помазанник».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Потому что
  rationale: Союз вводит основание предыдущего утверждения; причинная связь передана прямо и естественно по-русски.
- source_word: ὁ θεὸς ὁ εἰπών
  choice: Бог, сказавший
  rationale: Субстантивированное причастие передано русским причастным оборотом, сохраняющим тесную связь Божьего повеления при творении с Его действием в сердцах.
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: Из тьмы воссияет свет
  rationale: Сохранены исходное значение ἐκ, будущая форма глагола и торжественный образ света, возникающего из тьмы.
- source_word: ὃς ἔλαμψεν
  choice: сам воссиял
  rationale: Местоименное усиление «сам» естественно связывает относительное местоимение с Богом и подчёркивает соответствие между Его словом о свете и Его действием; глагол оставлен непереходным.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: в наших сердцах
  rationale: Сохранена библейская метафора сердца как внутреннего человека.
- source_word: πρὸς φωτισμὸν τῆς γνώσεως
  choice: чтобы просветить нас познанием
  rationale: Целевая конструкция πρὸς передана придаточным цели. Дополнение «нас» ясно из «наших сердцах» и необходимо для естественного русского управления; связь просвещения с познанием сохранена без превращения её в чисто интеллектуальное объяснение.
- source_word: τῆς δόξης τοῦ θεοῦ
  choice: славы Бога
  rationale: Сохранена последовательность родительных понятий и прямое обозначение Бога; современная форма «Бога» предпочтена более архаичному «Божьей» в этой конструкции.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: в лице Мессии
  rationale: Конкретное «лицо» передаёт основное значение προσώπῳ и поддерживает контекст сияния и явленной славы. Χριστοῦ передано как титул «Мессия».
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: Здесь слово сохраняет значение титула Помазанника; перевод «Мессия» делает это значение явным, не отрицая традиционного варианта «Христос».
- issue: Смысл ἐν προσώπῳ Χριστοῦ
  choice: в лице Мессии
  alternative: в личности Христа / в особе Христа
  rationale: Буквально-конкретная передача сохраняет образ видимой славы и света. При этом примечание оставляет открытым более идиоматическое понимание προσώπῳ как указания на личность.
- issue: Связь света творения и внутреннего просвещения
  choice: сохранено словесное соответствие «воссияет — воссиял»
  alternative: перефразировать второе действие как «озарил»
  rationale: Повтор корня отражает повтор λάμψει — ἔλαμψεν и позволяет читателю увидеть богословскую аналогию между творением света и Божьим откровением, не отождествляя эти действия.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Воссияет / воссиял» сохранено ради образной и лексической связи, тогда как синтаксис сделан понятным обычному современному читателю.
