reference: 2 Corinthians 4:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your servants for Jesus' sake.
translation:
  language: ru
  text: Ведь мы возвещаем не самих себя, а Иисуса Мессию[a] как Господа; самих же себя — как ваших рабов[b] ради Иисуса[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа Иисуса». Греческое Χριστός означает «Мессия», но также может употребляться подобно имени.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ваших слуг». Греческое δοῦλοι может обозначать рабов или слуг; вариант «рабов» сильнее подчёркивает подчинённость в противопоставлении Иисусу как Господу.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «из-за Иисуса».'
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσομεν
  choice: возвещаем
  rationale: Передаёт публичное провозглашение и не сужает смысл до произнесения церковной проповеди.
- source_word: ἑαυτοὺς
  choice: самих себя
  rationale: Сохраняет повтор греческого возвратного местоимения и подчёркнутое противопоставление между содержанием возвещения и ролью Павла с его сотрудниками.
- source_word: Χριστὸν Ἰησοῦν
  choice: Иисуса Мессию
  rationale: Χριστός передано как титул «Мессия»; перестановка в естественный для русского языка порядок позволяет ясно отнести титул к личному имени Иисуса.
- source_word: κύριον
  choice: как Господа
  rationale: 'Передаёт предикативную функцию κύριον: Иисуса возвещают в качестве Господа, без добавления отсутствующего в греческом тексте личного глагола.'
- source_word: δούλους
  choice: рабов
  rationale: Сохраняет сильное значение подчинённости и намеренный контраст с именованием Иисуса Господом; «слуги» было бы мягче.
- source_word: ὑμῶν
  choice: ваших
  rationale: Естественно передаёт родительный падеж при δούλους и отношение служения коринфским верующим.
- source_word: διὰ Ἰησοῦν
  choice: ради Иисуса
  rationale: 'διά с винительным падежом здесь наиболее естественно указывает на основание или побуждение: они занимают положение рабов по отношению к адресатам ради Иисуса.'
theological_decisions:
- issue: Передача Χριστός как титула или как части имени
  choice: Мессия
  alternative: Христос
  rationale: В данном высказывании титульный смысл остаётся значимым, поскольку речь идёт о содержании возвещения об Иисусе; примечание сохраняет допустимую традиционную передачу.
- issue: Синтаксическая сила сочетания Χριστὸν Ἰησοῦν κύριον
  choice: Иисуса Мессию как Господа
  alternative: Христа Иисуса, Господа
  rationale: Основной текст сохраняет предикативный смысл κύριον, не превращая оборот в отдельное законченное утверждение «Иисус есть Господь» и не сводя «Господа» однозначно к приложению.
- issue: Сила слова δοῦλοι
  choice: рабы
  alternative: слуги
  rationale: «Рабы» сохраняет резкость самоумаления Павла и контраст между господством Иисуса и подчинённым служением апостолов, не добавляя учения сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского высказывания. Точка с запятой и частица «же» делают двойное противопоставление прозрачным; повтор «самих себя» сохранён, несмотря на возможность более гладкого сокращения.
