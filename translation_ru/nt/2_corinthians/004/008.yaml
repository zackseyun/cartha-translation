  - marker: c
    text: 'Или: «не оказываемся в полной безысходности». Греческий глагол усиливает предыдущее выражение «в растерянности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντί
  choice: всячески
  rationale: Сочетание указывает на всеохватность испытаний и естественно передаётся наречием, не сводящим образ к пространственному «со всех сторон».
- source_word: θλιβόμενοι
  choice: нас притесняют
  rationale: Причастие θλίβω обозначает давление, стеснение и причиняемые страдания. «Притесняют» сохраняет образ внешнего давления и допускает подразумеваемого деятеля.
- source_word: στενοχωρούμενοι
  choice: не загоняют в безвыходное положение
  rationale: Глагол буквально связан с тесным, стеснённым пространством. Русское выражение передаёт отрицаемый результат — полную скованность и отсутствие выхода — и поддерживает контраст с внешним давлением.
- source_word: ἀπορούμενοι
  choice: мы в растерянности
  rationale: Форма обозначает состояние человека, который не знает, как поступить или куда обратиться. «В растерянности» звучит естественно и не усиливает смысл до отчаяния.
- source_word: ἐξαπορούμενοι
  choice: не впадаем в отчаяние
  rationale: Сложный глагол усиливает ἀπορέω и обозначает крайнюю степень безысходности. Такой перевод ясно передаёт нарастание, не утверждая полной невозмутимости героев.
- source_word: ἀλλ’ οὐ ... ἀλλ’ οὐκ
  choice: но не ... но не
  rationale: Повтор противительного оборота сохраняет параллельный ритм и резкие контрасты греческой фразы.
theological_decisions:
- issue: Степень усиления во второй паре причастий
  choice: Передать ἐξαπορούμενοι как «не впадаем в отчаяние»
  alternative: «не оказываемся в полной безысходности» или «не теряемся окончательно»
  rationale: Контекст говорит о стойкости среди апостольских страданий, но не отрицает настоящей растерянности. «Отчаяние» передаёт усиление, не превращая стих в специальное утверждение о невозможности утраты веры.
- issue: Образ тесноты в первой паре
  choice: Передать στενοχωρούμενοι как «не загоняют в безвыходное положение»
  alternative: «не стеснены» или «не раздавлены»
  rationale: Выбранный вариант сохраняет представление об отсутствии выхода и противопоставляет его реальному внешнему давлению, не вводя более сильный образ физического уничтожения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены две параллельные антитезы и переход от реального страдания и растерянности к отрицанию их крайнего, безысходного исхода.
