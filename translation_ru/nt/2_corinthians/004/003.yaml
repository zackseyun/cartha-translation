  text: εἰ δὲ καὶ ἔστιν κεκαλυμμένον τὸ εὐαγγέλιον ἡμῶν, ἐν τοῖς ἀπολλυμένοις ἐστὶν κεκαλυμμένον,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/003.yaml
  text: And even if our gospel is veiled[a], it is veiled among those who are perishing,
translation:
  language: ru
  text: Но даже если наше благовестие и покрыто завесой[a], то для погибающих оно покрыто завесой,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скрыто»; далее: «среди погибающих» или «у погибающих».'
    reason: κεκαλυμμένον сохраняет образ завесы/покрова, хотя может передаваться более обобщённо как «скрыто». ἐν τοῖς ἀπολλυμένοις допускает буквальное сферическое «среди» и контекстуальное «у/для».
lexical_decisions:
- source_word: εἰ δὲ καὶ
  choice: Но даже если… и
  rationale: Передаёт условно-уступительное значение оборота, сохраняя δέ как продолжение с оттенком противопоставления, а καί — как усиление «даже»; частица «и» естественно оформляет русскую уступительную конструкцию.
- source_word: κεκαλυμμένον
  choice: сокрыта за покровом
  rationale: Сохраняет образ покрова, заданный ближайшим контекстом (3:14–16; 4:4), и значение перфектного пассивного причастия, не сводя метафору к нейтральному «скрыта».
- source_word: τὸ εὐαγγέλιον ἡμῶν
  choice: наша Благая Весть
  rationale: Сохраняет притяжательное ἡμῶν и передаёт εὐαγγέλιον ясным современным выражением; написание с прописных букв обозначает весть о Христе, не добавляя содержания сверх текста.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: среди погибающих
  rationale: «Среди» передаёт ἐν с дательным как сферу или круг лиц, а причастие настоящего времени «погибающих» сохраняет значение продолжающегося состояния или процесса.
- source_word: ἐστὶν κεκαλυμμένον
  choice: сокрыта она
  rationale: Сохраняет повтор сказуемого, подчёркнутый в греческом тексте; местоимение «она» естественно отсылает к Благой Вести.
theological_decisions:
- issue: Значение ἀπολλυμένοις в сотериологическом контексте Павла
  choice: погибающих
  alternative: погибших; тех, кто потерян
  rationale: Причастие настоящего времени представляет состояние или процесс как продолжающийся. «Погибающих» сохраняет богословское напряжение текста и не превращает выражение в окончательный статичный ярлык.
- issue: Отношение ἐν τοῖς ἀπολλυμένοις к сокрытости Благой Вести
  choice: среди погибающих
  alternative: для погибающих
  rationale: Основной текст сохраняет пространственно-сферическое значение ἐν; вариант «для» возможен по смыслу, но может сильнее выразить направленность или восприятие, чем это делает сама греческая конструкция.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Образ покрова сохранён ради связи с ближайшим контекстом; синтаксический повтор оригинала удержан без неестественной буквальности.
