base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/012.yaml
  text: So then[a], death is at work in us, but life in you.
translation:
  language: ru
  text: Итак, смерть действует в нас, а жизнь — в вас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Итак
  rationale: В данном контексте союз вводит итоговый вывод из сказанного в ст. 8–11. «Итак» естественно передаёт следственное значение и сохраняет краткость оригинала.
- source_word: ὁ θάνατος
  choice: смерть
  rationale: В русском языке артикль отдельно не передаётся. Слово сохранено без истолковывающего уточнения, чтобы не сужать образ до одной лишь физической смерти или метафоры.
- source_word: ἐν ἡμῖν
  choice: в нас
  rationale: Прямое соответствие греческой конструкции сохраняет личный и телесный оттенок контекста, а также параллель с «в вас».
- source_word: ἐνεργεῖται
  choice: действует
  rationale: Настоящее время и форма глагола обозначают продолжающееся действенное проявление. «Действует» звучит естественно и точно, не внося лишнего технического оттенка.
- source_word: ἡ δὲ ζωὴ
  choice: а жизнь
  rationale: Частица δέ выражает противопоставление. Русское «а» кратко и естественно подчёркивает симметричный контраст между смертью и жизнью.
- source_word: ἐν ὑμῖν
  choice: в вас
  rationale: Буквальный параллелизм с «в нас» сохраняет лаконичную антитезу и не устраняет возможные личный и общинный оттенки.
theological_decisions:
- issue: Смысл противопоставления смерти и жизни
  choice: 'Сохранены буквальные и ёмкие слова «смерть» и «жизнь»: смерть действует в страдающих апостольских служителях, тогда как через их служение жизнь действует в коринфянах.'
  alternative: Истолковать контраст исключительно как физическую смерть и сохранение жизни либо исключительно как духовное умирание для себя и вечную жизнь.
  rationale: Контекст ст. 10–11 связывает смерть и жизнь Иисуса с телесными страданиями служителей, а более широкий ход мысли — с жизнью, передаваемой другим через служение. Краткая формулировка оригинала намеренно не сведена к одной категории.
translation_notes:
  register: Современный литературный русский язык; лаконичный, достойный стиль. Тире перед «в вас» естественно восполняет опущенный во второй части глагол и сохраняет ритмичный параллелизм греческого текста.
