source:
  edition: SBLGNT
  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: ru
  text: Мы же все с непокрытым лицом, созерцая, словно в зеркале, славу Господа[a], преображаемся в тот же образ — от славы к славе, как от Господа, Духа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отражая, словно зеркало, славу Господа».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «от Господа, Который есть Дух»; возможно также: «от Духа Господня».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: с открытым лицом
  rationale: Причастие перфекта описывает сохраняющееся состояние после снятия покрывала; оборот естественен по-русски и сохраняет собирательное единственное число.
- source_word: δόξαν κυρίου
  choice: славу Господа
  rationale: Прямая передача родительного падежа; κύριος последовательно передано как «Господь».
- source_word: κατοπτριζόμενοι
  choice: созерцая, словно в зеркале
  rationale: Глагол допускает значения созерцания посредством зеркала и отражения подобно зеркалу. Основной текст выбирает созерцание как подходящее контексту преображения, а реальная лексическая неоднозначность сохранена в сноске.
- source_word: τὴν αὐτὴν εἰκόνα
  choice: в тот же образ
  rationale: Форма «тот же» естественно указывает на уже подразумеваемый образ Господа и близко передаёт τὴν αὐτὴν.
- source_word: μεταμορφούμεθα
  choice: преображаемся
  rationale: Настоящее время и медиопассивная форма передают продолжающееся преображение без необходимости утяжелять русский текст аналитической конструкцией.
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: от славы к славе
  rationale: Сохранена краткая и выразительная греческая формула без истолковывающего добавления «от одной степени».
- source_word: καθάπερ
  choice: как
  rationale: Современный и контекстуально достаточный сравнительный эквивалент; значение усиления поддерживается всей конструкцией.
- source_word: ἀπὸ κυρίου πνεύματος
  choice: от Господа, Духа
  rationale: Сжатая аппозитивная передача сохраняет необычность и синтаксическую неоднозначность греческой фразы, не превращая её в однозначное богословское пояснение.
- source_word: κύριος
  choice: Господь
  rationale: Общепринятый современный библейский эквивалент, уместный в обоих случаях.
theological_decisions:
- issue: Значение κατοπτριζόμενοι
  choice: созерцая, словно в зеркале, славу Господа
  alternative: отражая, словно зеркало, славу Господа
  rationale: Контекст перехода от созерцания славы к преображению поддерживает значение «созерцать», однако значение «отражать» лексически возможно и поэтому вынесено в сноску.
- issue: Соотношение κυρίου и πνεύματος в заключительной фразе
  choice: от Господа, Духа
  alternative: от Господа, Который есть Дух; от Духа Господня
  rationale: Греческая формулировка предельно сжата и допускает аппозиционное и генитивное понимание. Основной перевод сохраняет эту напряжённость, а более явные толкования приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет ход греческой мысли, но остаётся понятным; тире выделяет формулу «от славы к славе». Все существенные неоднозначности исходного текста сохранены в сносках.
