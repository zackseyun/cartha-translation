  text: Such confidence we have through Messiah toward God[a][b].
translation:
  language: ru
  text: Такую уверенность мы имеем через Мессию перед Богом.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через Христа».'
    reason: Традиционная русская передача титула Χριστός.
  - marker: b
    text: 'Букв.: «по направлению к Богу»; возможно также: «по отношению к Богу».'
    reason: Сохранение направленного и реляционного смыслового диапазона греческого πρὸς τὸν θεόν.
lexical_decisions:
- source_word: Πεποίθησιν
  choice: уверенность
  rationale: Передаёт устойчивую убеждённость, о которой говорится в контексте, не превращая её в обозначение веры как таковой.
- source_word: δὲ τοιαύτην
  choice: такую
  rationale: «Такую» естественно связывает стих с предыдущими словами Павла; отдельный союз в русском здесь не требуется.
- source_word: ἔχομεν
  choice: мы имеем
  rationale: Прямое и естественное соответствие простому греческому глаголу.
- source_word: διὰ τοῦ Χριστοῦ
  choice: через Христа
  rationale: διά с родительным падежом выражает посредство; «через» сохраняет эту функцию. «Христос» — укоренившееся в современном русском обозначение Иисуса и одновременно передача титула Χριστός.
- source_word: πρὸς τὸν θεόν
  choice: перед Богом
  rationale: В данном контексте выражает направленность и отношение к Богу естественным русским оборотом, не приписывая Богу роль объекта человеческой самоуверенности.
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Христа
  alternative: Мессию; Помазанника
  rationale: «Христос» наиболее естественно и узнаваемо в русском апостольском послании; примечание сохраняет титульное значение греческого слова.
- issue: Смысл πρὸς τὸν θεόν
  choice: перед Богом
  alternative: по отношению к Богу; к Богу
  rationale: «Перед Богом» идиоматично в русском, однако примечание сохраняет буквальную направленность πρός и не устраняет возможный оттенок отношения к Богу.
translation_notes:
  register: Современный литературный русский, краткий и достойный эпистолярный стиль. Порядок слов сохраняет акцент на «такой уверенности», а формулировка остаётся понятной без специальной богословской подготовки.
