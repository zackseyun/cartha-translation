  yaml_path: translation/nt/2_corinthians/003/001.yaml
  text: Are we beginning again to commend ourselves? Or do we need[a], like some, letters of recommendation to you or from you?
translation:
  language: ru
  text: Неужели мы снова начинаем рекомендовать самих себя? Или, подобно некоторым, нам нужны рекомендательные письма к вам или от вас?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀρχόμεθα πάλιν
  choice: мы снова начинаем
  rationale: Передаёт настоящее время и повторность действия; в риторическом вопросе естественно звучит с частицей «неужели».
- source_word: ἑαυτοὺς συνιστάνειν
  choice: рекомендовать самих себя
  rationale: Глагол обозначает представление кого-либо в благоприятном свете или удостоверение его достоинств; «рекомендовать» сохраняет связь с последующим выражением «рекомендательные письма».
- source_word: ἢ μὴ χρῄζομεν
  choice: Или нам … нужны
  rationale: Естественная русская вопросительная конструкция; отрицательная частица μή указывает на ожидаемый отрицательный ответ, что передаётся риторической формой вопроса.
- source_word: ὥς τινες
  choice: как некоторым
  rationale: Сохраняет неопределённость группы лиц и сравнительный смысл.
- source_word: συστατικῶν ἐπιστολῶν
  choice: рекомендательные письма
  rationale: Современное и ясное обозначение писем, представляющих или удостоверяющих человека.
- source_word: πρὸς ὑμᾶς ἢ ἐξ ὑμῶν
  choice: к вам или от вас
  rationale: Точно передаёт направление πρός и источник ἐξ, сохраняя симметрию исходной фразы.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; риторический, слегка ироничный тон оригинала передан частицей «неужели». Формулировка ясная и достойная, без конфессионально обусловленных уточнений.
