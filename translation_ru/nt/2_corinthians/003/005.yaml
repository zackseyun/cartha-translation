  source_fidelity: 'Русский текст точно передаёт структуру и смысл греческого оригинала: уступительно-уточняющий оборот οὐχ ὅτι, отрицание самодостаточности, мысленное «счесть» что-либо происходящим от себя и противопоставление способности, источником которой является Бог. Широкий объём утверждения не сужен до одного апостольского служения.'
