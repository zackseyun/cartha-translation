source:
  edition: SBLGNT
  text: οὐχ ὅτι ⸂ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν⸃ λογίσασθαί τι ὡς ἐξ ⸀αὑτῶν, ἀλλ’ ἡ ἱκανότης ἡμῶν ἐκ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/005.yaml
  text: Not that we are sufficient in ourselves to consider anything as coming from ourselves[a], but our sufficiency is from God[b],
translation:
  language: ru
  text: Не то чтобы мы сами по себе были способны[a] счесть[b] что-либо исходящим от нас самих, но наша способность — от Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достаточны»; соответственно далее: «достаточность». Возможно также: «пригодны» / «пригодность».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рассудить», «признать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Не то чтобы
  rationale: Оборот вводит уточнение и ограничение предыдущей мысли, а не причинное объяснение; эта русская формулировка естественно передаёт риторический поворот Павла.
- source_word: ἀφ’ ἑαυτῶν
  choice: сами по себе
  rationale: В сочетании с ἱκανοί ἐσμεν выражение указывает на способность, которой человек якобы обладает независимо и которая исходит от него самого.
- source_word: ἱκανοί / ἡ ἱκανότης
  choice: способны / способность
  rationale: Однокоренные русские слова сохраняют намеренную лексическую связь между прилагательным и существительным и ясно передают достаточность или пригодность для действия.
- source_word: λογίσασθαί
  choice: счесть
  rationale: Глагол обозначает мысленную оценку или заключение; «счесть» передаёт этот смысл кратко и естественно.
- source_word: τι
  choice: что-либо
  rationale: В отрицательном контексте форма передаёт широкий неопределённый охват без ненужного уточнения.
- source_word: ὡς ἐξ αὑτῶν
  choice: исходящим от нас самих
  rationale: Формулировка сохраняет значение источника или происхождения и звучит естественно по-русски.
- source_word: ἐκ τοῦ θεοῦ
  choice: от Бога
  rationale: Кратко и прямо обозначает Бога как источник способности, не добавляя отсутствующих в тексте пояснений.
theological_decisions:
- issue: Объём утверждения Павла о человеческой способности
  choice: Сохранено широкое утверждение об отсутствии способности, исходящей от самих людей.
  alternative: Сузить смысл до одной лишь пригодности к апостольскому служению.
  rationale: Ближайший контекст относится к служению, однако греческая формулировка этого стиха сама по себе шире; перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет риторическое противопоставление оригинала. Повтор «сами… самих» оставлен ради смыслового акцента на невозможности самодостаточного происхождения способности.
