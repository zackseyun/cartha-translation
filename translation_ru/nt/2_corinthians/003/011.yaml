  text: εἰ γὰρ τὸ καταργούμενον διὰ δόξης, πολλῷ μᾶλλον τὸ μένον ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/011.yaml
  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: ru
  text: Ибо если то, что упразднялось, сопровождалось славой[a], то тем более то, что остаётся, пребывает во славе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «через славу»; возможно также: «посредством славы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταργούμενον
  choice: упраздняемое
  rationale: Причастие передаёт то, что устраняется, прекращает действие или упраздняется. Такой выбор точнее, чем контекстуальное «угасающее», и сохраняет безличную форму греческого текста.
- source_word: διὰ δόξης
  choice: было окружено славой
  rationale: Буквально сочетание означает «через славу», однако в данном контексте речь о том, что преходящее сопровождалось славой. Русская формулировка передаёт это естественно, не превращая славу в действующее средство.
- source_word: μένον
  choice: пребывающее
  rationale: Сохраняет параллельную форму субстантивированного причастия и значение того, что остаётся, длится и не прекращается.
- source_word: ἐν δόξῃ
  choice: во славе
  rationale: Прямо сохраняет предложную конструкцию и контраст с διὰ δόξης.
- source_word: πολλῷ μᾶλλον
  choice: тем более
  rationale: Естественный русский сравнительный оборот, выражающий усиление противопоставления.
theological_decisions:
- issue: Характер противопоставления между прежним и остающимся
  choice: Сохранены безличные формы «упраздняемое» и «пребывающее» без явного называния заветов или служений.
  alternative: Можно было прямо назвать прежний и новый заветы либо соответствующие служения.
  rationale: В самом стихе употреблены субстантивированные причастия среднего рода; конкретизация следует из контекста, но не должна вноситься в текст стиха как явное толкование.
- issue: Смысл καταργούμενον
  choice: «упраздняемое» — процесс прекращения действия или устранения.
  alternative: «Угасающее», «устраняемое», «прекращающееся».
  rationale: «Упраздняемое» сохраняет более строгий смысл глагола, но не уточняет сверх текста, каким именно образом происходит прекращение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Эллипсис во второй части («пребывающее — во славе») сохраняет риторическую сжатость оригинала; причастия удерживают параллелизм греческой фразы.
