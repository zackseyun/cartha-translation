    issue: «Было окружено славой» для διὰ δόξης
    rationale: Оборот «окружено славой» добавляет пространственно-образный оттенок, которого в διά нет. Контекстуально более нейтрально сказать «сопровождалось славой», оставив буквальное «через славу» в примечании.
  - severity: low
    issue: Субстантивированные «упраздняемое» и «пребывающее»
    rationale: Хотя они формально близки греческому тексту, в современном русском без «то, что» они воспринимаются как отвлечённо-канцелярские. Конструкция «то, что упразднялось / то, что остаётся» сохраняет неопределённость оригинала и улучшает читаемость.
  revised_text: Ибо если то, что упразднялось, сопровождалось славой[a], то тем более то, что остаётся, пребывает во славе.
