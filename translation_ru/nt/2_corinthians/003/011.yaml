review_pass:
  verdict: revise
  source_fidelity: 'Основной контраст передан верно: καταργούμενον — то, что упраздняется/упразднялось, μένον — то, что остаётся, а πολλῷ μᾶλλον — «тем более». Однако «было окружено славой» слишком образно и несколько смещает διὰ δόξης («через/посредством славы») к представлению об окружённости. Также субстантивированные формы «упраздняемое» и «пребывающее» без опорного слова звучат канцелярски и менее естественно по-русски.'
  naturalness: Предлагаемая редакция сохраняет безличность и неопределённость греческих субстантивированных причастий посредством «то, что…», но звучит как современный литературный русский. Явные глаголы «сопровождалось» и «пребывает» делают параллелизм понятным без неоправданного толкования.
  terminology: «Упразднялось» адекватно передаёт пассивное καταργούμενον без внесения конкретного предмета (завета или служения). «Остаётся» и «пребывает во славе» передают μένον и ἐν δόξῃ. «Сопровождалось славой» — идиоматическое контекстуальное выражение для διὰ δόξης; буквальная возможность сохранена в сноске.
  issues:
