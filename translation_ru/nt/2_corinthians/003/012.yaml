  text: Ἔχοντες οὖν τοιαύτην ἐλπίδα πολλῇ παρρησίᾳ χρώμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/012.yaml
  text: Since, then, we have such a hope, we act with great boldness,
translation:
  language: ru
  text: Итак, имея такую надежду, мы действуем с большой смелостью[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы проявляем большую открытость»; возможно также: «мы говорим со всей прямотой».'
    reason: Греческое παρρησία охватывает значения смелости, открытости и прямоты, а χρώμεθα само по себе не уточняет, идёт ли речь исключительно о говорении.
lexical_decisions:
- source_word: Ἔχοντες
  choice: имея
  rationale: Деепричастие естественно передаёт обстоятельственное причастие и сохраняет его связь с главным глаголом; причинный оттенок понятен из контекста без добавления «поскольку».
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего рассуждения и естественно звучит в современном русском тексте.
- source_word: τοιαύτην
  choice: такую
  rationale: Кратко и точно передаёт указательно-качественное значение слова.
- source_word: ἐλπίδα
  choice: надежду
  rationale: Обычный и контекстуально точный эквивалент, выражающий уверенное ожидание.
- source_word: πολλῇ
  choice: большой
  rationale: В сочетании со «смелостью» естественно передаёт усилительное значение прилагательного.
- source_word: παρρησίᾳ
  choice: смелостью
  rationale: Слово может означать смелость, открытость или прямоту. В данном контексте «смелость» хорошо передаёт уверенность Павла, не ограничивая выражение только речью.
- source_word: χρώμεθα
  choice: мы действуем с
  rationale: Средний глагол с дательным падежом означает пользоваться чем-либо или проявлять это. Такая формулировка естественна по-русски и не добавляет прямо не названного объекта речи.
