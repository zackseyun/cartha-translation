  text: καὶ οὐ καθάπερ Μωϋσῆς ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον ⸀αὐτοῦ, πρὸς τὸ μὴ ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ τέλος τοῦ καταργουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/013.yaml
  text: and not like Moses[b][a], who used to put a veil over his face so that the sons of Israel would not gaze at the end of what was fading away.
translation:
  language: ru
  text: И не так, как Моисей, который обычно накладывал покрывало на своё лицо, чтобы израильтяне[a] не могли пристально смотреть на конец того, что преходило[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на цель (или исход) того, что прекращалось»; возможен также перевод: «на конец того, что упразднялось».'
    reason: alternative_reading
lexical_decisions:
- source_word: καθάπερ
  choice: как
  rationale: Передаёт сравнительную конструкцию естественно для современного русского языка; сочетание «не так, как» сохраняет связь с предшествующим утверждением.
- source_word: ἐτίθει
  choice: обычно закрывал
  rationale: Имперфект указывает на повторявшееся или обычное действие; наречие «обычно» делает этот аспект явным.
- source_word: κάλυμμα ἐπὶ τὸ πρόσωπον αὐτοῦ
  choice: закрывал своё лицо покрывалом
  rationale: Сохраняет конкретный образ покрывала на лице и естественно звучит по-русски.
- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: чтобы ... не всматривались
  rationale: Передаёт целевое значение конструкции и усиленный смысл глагола ἀτενίζω — пристально, внимательно смотреть.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: израильтяне
  rationale: Передаёт смысл древнееврейского по происхождению библейского оборота естественным современным русским обозначением народа; буквальная форма отмечена в сноске.
- source_word: εἰς τὸ τέλος
  choice: в конец
  rationale: Сохраняет наиболее вероятный здесь смысл завершения или прекращения, не устраняя возможные значения «цель» и «исход», указанные в сноске.
- source_word: τοῦ καταργουμένου
  choice: того, что сходило на нет
  rationale: Передаёт процесс прекращения действия или исчезновения без чрезмерно узкого толкования как формальной отмены; форма настоящего причастия отражена как продолжающийся процесс.
theological_decisions:
- issue: Значение τέλος τοῦ καταργουμένου
  choice: «конец того, что сходило на нет» — речь прежде всего о прекращении преходящего.
  alternative: «цель / исход того, что прекращалось» или «конец того, что упразднялось».
  rationale: Ближайший контекст противопоставляет преходящее пребывающему. Основной текст сохраняет этот контраст, а сноска отмечает смысловую широту τέλος и возможность более буквальной передачи καταργουμένου, не превращая перевод в однозначное догматическое толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис оставляет стих связанным с предшествующей мыслью Павла; «обычно» передаёт повторяемость действия, а «всматривались» — напряжённость взгляда.
