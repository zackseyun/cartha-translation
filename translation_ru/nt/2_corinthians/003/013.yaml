review_pass:
  verdict: revise
  source_fidelity: 'Сравнительная конструкция, имперфект ἐτίθει, целевое πρὸς τὸ μή и смысл ἀτενίσαι переданы в целом точно. Однако «закрывал своё лицо покрывалом» чуть меняет образ: греческое ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον означает «накладывал/покрывал лицо покрывалом», а не непременно закрывал лицо. «В конец» в данном русском синтаксисе ненормативно и неестественно; требуется «на конец» (или иной ясный вариант).'
  naturalness: Текст в целом современный, но сочетание «всматривались в конец того, что сходило на нет» звучит тяжеловесно, а «в конец» не соответствует обычному русскому управлению. «Не могли пристально смотреть на конец...» естественнее и хорошо передаёт целевой оборот и ἀτενίζω.
  terminology: «Моисей», «покрывало» и «израильтяне» уместны. Сноска к «израильтянам» корректно отмечает буквальное «сыны Израиля». Для καταργουμένου «сходило на нет» допустимо, но «преходило» лучше согласуется с контекстом и русской библейской традицией, не навязывая специального значения «упразднялось».
  issues:
  - severity: medium
    issue: Неестественное и фактически неверное управление «всматривались в конец».
    rationale: При значении направления внимания нормативно «смотреть/всматриваться на что-либо»; для передачи εἰς τὸ τέλος требуется «на конец». Кроме того, в данном контексте «не могли пристально смотреть» лучше выражает ограничивающий результат целевого оборота.
  - severity: low
    issue: «Закрывал своё лицо покрывалом» избыточно и несколько огрубляет образ.
    rationale: ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον буквально описывает возложение покрывала на лицо. «Накладывал покрывало на лицо» точнее и естественнее.
  - severity: low
    issue: Формулировка первой альтернативы в сноске «в цель ...» неестественна.
    rationale: При альтернативном значении τέλος по-русски следует «на цель» или, более идиоматично, «на конечную цель»; это не должно создавать ложного впечатления буквальности.
  revised_text: И не так, как Моисей, который обычно накладывал покрывало на своё лицо, чтобы израильтяне[a] не могли пристально смотреть на конец того, что преходило[b].
  revised_footnotes:
