  rationale: Исправлены управление и естественность русского выражения, уточнён образ возложения покрывала на лицо и выбрано «преходило» как ясная, контекстуально уместная передача продолжающегося καταργουμένου. Альтернативные значения τέλος и καταργουμένου сохранены в сноске без догматического уточнения.
