  text: ἡ ἐπιστολὴ ἡμῶν ὑμεῖς ἐστε, ἐγγεγραμμένη ἐν ταῖς καρδίαις ἡμῶν, γινωσκομένη καὶ ἀναγινωσκομένη ὑπὸ πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/002.yaml
  text: You are our letter[a], written in our hearts, known and read by all people.
translation:
  language: ru
  text: Вы — наше письмо, написанное в наших сердцах, которое знают и читают все люди.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которое узнают и читают все люди».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολή
  choice: письмо
  rationale: Обычное современное обозначение письменного послания; естественно передаёт метафору без излишне традиционного оттенка слова «послание».
- source_word: ἡμῶν
  choice: наше
  rationale: 'Родительный падеж выражает принадлежность: коринфяне метафорически названы письмом Павла и его соработников.'
- source_word: ὑμεῖς ἐστε
  choice: Вы —
  rationale: Именное предложение передано прямо; постановка местоимения в начале и тире естественно сохраняют его смысловое выделение.
- source_word: ἐγγεγραμμένη
  choice: написанное
  rationale: Перфектное страдательное причастие указывает на то, что письмо остаётся написанным; «написанное» естественно продолжает метафору.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: в наших сердцах
  rationale: Буквально и естественно передаёт ἐν и сохраняет образ внутренней запечатлённости.
- source_word: γινωσκομένη
  choice: знают
  rationale: Передаёт значение «быть известным, узнаваемым»; личная конструкция по-русски легче и естественнее, чем два страдательных причастия подряд.
- source_word: ἀναγινωσκομένη
  choice: читают
  rationale: Прямо сохраняет образ письма и образует естественную пару с «знают».
- source_word: ὑπὸ πάντων ἀνθρώπων
  choice: все люди
  rationale: Передаёт универсальный и общий для людей смысл ἀνθρώπων без указания только на мужчин.
