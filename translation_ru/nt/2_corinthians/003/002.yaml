review_pass:
  verdict: approve
  source_fidelity: «Вы — наше письмо» точно передаёт предикативную метафору ἡ ἐπιστολὴ ἡμῶν ὑμεῖς ἐστε. «Написанное в наших сердцах» сохраняет совершенное страдательное причастие ἐγγεγραμμένη и ἐν. Оборот «которое знают и читают все люди» естественно передаёт два страдательных причастия с ὑπό («всеми людьми») без изменения смысла или универсального охвата.
  naturalness: Текст звучит по-современному и литературно. Относительное придаточное удачно избегает тяжеловесной цепочки страдательных причастий, сохраняя образ письма и ясную связь «читают» с ним.
  terminology: «Письмо» — точный и современный эквивалент ἐπιστολή в данном образе. «Сердца» и «все люди» нейтральны, естественны и не вносят конфессиональной интерпретации. Сноска корректно отмечает возможный оттенок «узнают/распознают» у γινωσκομένη.
