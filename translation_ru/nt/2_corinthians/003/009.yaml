reference: 2 Corinthians 3:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ γὰρ ⸂τῇ διακονίᾳ⸃ τῆς κατακρίσεως δόξα, πολλῷ μᾶλλον περισσεύει ἡ διακονία τῆς ⸀δικαιοσύνης δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: ru
  text: Ибо если служение осуждения сопровождалось славой, то тем более служение праведности[a] изобилует славой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονία
  choice: служение
  rationale: «Служение» естественно обозначает здесь не отдельный акт помощи, а целостное устроение, связанное с заветом; этот перевод также сохраняет повтор одного и того же греческого слова в обеих частях стиха.
- source_word: κατάκρισις
  choice: осуждение
  rationale: Слово имеет судебный смысл — вынесение обвинительного приговора или состояние под осуждением; краткое «осуждение» точно передаёт его и ясно противопоставляется праведности.
- source_word: δόξα
  choice: слава
  rationale: «Слава» сохраняет ключевой термин всего контекста и его богословскую насыщенность; «сияние» было бы уже и могло бы свести смысл лишь к видимому блеску.
- source_word: πολλῷ μᾶλλον
  choice: тем более
  rationale: Устойчивый русский оборот естественно передаёт усиленное заключение Павла от меньшего к большему; значение πολλῷ поддерживается всей конструкцией противопоставления.
- source_word: περισσεύω
  choice: изобилует
  rationale: «Изобилует» передаёт идею преизбытка и сочетается с творительным «славой», не превращая глагол в простое сравнительное «превосходит».
- source_word: δικαιοσύνη
  choice: праведность
  rationale: «Праведность» сохраняет широкий смысл слова в Павловом употреблении и не снимает напряжение между нравственным, судебным и заветным оттенками; возможный оттенок справедливости указан в сноске.
- source_word: '[verbless clause: τῇ διακονίᾳ … δόξα]'
  choice: служение … сопровождалось славой
  rationale: В первой греческой части нет выраженного глагола. «Сопровождалось славой» естественно восполняет связку, не отождествляя само служение со славой и сохраняя асимметрию с более сильным «изобилует славой» во второй части.
theological_decisions:
- issue: Значение δικαιοσύνη в противопоставлении двух служений
  choice: праведность
  alternative: справедливость; оправдание
  rationale: «Праведность» наиболее полно сохраняет многозначность греческого термина. «Справедливость» возможна лексически, но в данном противопоставлении может чрезмерно сузить смысл; «оправдание» ярко передало бы судебную противоположность осуждению, однако заменило бы абстрактное δικαιοσύνη более конкретным результатом действия.
- issue: Характер славы служения осуждения
  choice: сопровождалось славой
  alternative: имело славу; было славным
  rationale: Греческая первая часть безглагольна. Выбранная формулировка утверждает наличие славы при этом служении, но не усиливает тезис до качественного определения «было славным» и сохраняет нарастание к служению, которое «изобилует славой».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис сохраняет Павлово рассуждение от меньшего к большему; повтор «служение» и «слава» намеренно удержан ради структуры исходного текста.
