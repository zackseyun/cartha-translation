  text: φανερούμενοι ὅτι ἐστὲ ἐπιστολὴ Χριστοῦ διακονηθεῖσα ὑφ’ ἡμῶν, ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ’ ἐν πλαξὶν καρδίαις σαρκίναις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/003.yaml
  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: ru
  text: Становится ясно, что вы — письмо Мессии[a], созданное благодаря нашему служению, написанное не чернилами, а Духом живого Бога[b], не на каменных скрижалях, а на скрижалях, то есть на сердцах из плоти[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «письмо Христа». Греческий родительный падеж может выражать принадлежность, авторство или источник; также возможно: «письмо от Мессии».'
    reason: alternative_reading
  - marker: b
    text: Контекст противопоставления чернилам и записи на каменных скрижалях указывает на Божьего Духа, совершающего внутреннее написание.
    reason: clarification
  - marker: c
    text: 'Буквально: «на скрижалях — сердцах из плоти». Образ перекликается с обещанием нового сердца в Иезекииля 11:19; 36:26.'
    reason: cross_reference
lexical_decisions:
- source_word: φανερούμενοι
  choice: вы показываете
  rationale: Причастие выражает явную очевидность и продолжает мысль предыдущего стиха; личная форма естественна по-русски.
- source_word: ἐπιστολὴ
  choice: письмо
  rationale: Современный и точный эквивалент, сохраняющий метафору.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Χριστός передано как титул «Мессия»; родительный падеж оставлен семантически открытым и может указывать на принадлежность, авторство или источник.
- source_word: διακονηθεῖσα ὑφ’ ἡμῶν
  choice: составленное при нашем служении
  rationale: Передаёт посредническое служение Павла и его сотрудников, не сводя глагол ни к простой доставке письма, ни к современному церковному званию.
- source_word: ἐγγεγραμμένη
  choice: написанное
  rationale: Естественно поддерживает противопоставление чернил и Духа.
- source_word: μέλανι
  choice: чернилами
  rationale: Прямой эквивалент в метафоре письма.
- source_word: πνεύματι θεοῦ ζῶντος
  choice: Духом живого Бога
  rationale: Контекст нового завета и противопоставление внешней записи указывают на Божьего Духа.
- source_word: πλαξὶν λιθίναις
  choice: каменных скрижалях
  rationale: «Скрижали» естественно сохраняют узнаваемую отсылку к Синаю.
- source_word: πλαξὶν καρδίαις σαρκίναις
  choice: на скрижалях — человеческих сердцах
  rationale: Тире передаёт пояснительное сближение скрижалей и сердец, избегая неестественной цепочки родительных падежей; «человеческих» в основном тексте ясно выражает образ живых сердец.
theological_decisions:
- issue: Значение родительного Χριστοῦ
  choice: письмо Мессии
  alternative: письмо от Мессии
  rationale: 'Более формальное русское выражение сохраняет неоднозначность греческого родительного: принадлежность, авторство или источник.'
- issue: Референт πνεύματι
  choice: Духом живого Бога
  alternative: духом живого Бога
  rationale: Контраст между чернилами и божественным внутренним написанием в контексте завета достаточно ясно указывает на Святого Духа.
- issue: Образ καρδίαις σαρκίναις
  choice: человеческих сердцах
  alternative: сердцах из плоти
  rationale: Основной текст передаёт смысл естественно по-русски, а буквальная форма и ветхозаветная перекличка сохраняются в примечании.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Скрижали» сохранены ради устойчивого синайского образа; громоздкая буквальная конструкция в конце разъяснена тире и примечанием.
