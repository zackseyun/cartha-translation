  - severity: medium
    issue: «Человеческих сердцах» не передаёт σαρκίναις.
    rationale: σαρκίναις характеризует сердца как «из плоти»; слово «человеческих» отсутствует в исходном тексте и ослабляет намеренный контраст с каменными скрижалями.
