source:
  edition: SBLGNT
  text: ὃς καὶ ἱκάνωσεν ἡμᾶς διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος, τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: ru
  text: Он и сделал нас способными быть служителями нового завета — не буквы, а Духа[a], потому что буква убивает, а Дух даёт жизнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или в обоих случаях: «духа» (в соответствующей форме).'
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: сделал нас способными
  rationale: 'Передаёт причинное значение глагола: Бог наделил апостолов необходимой способностью и пригодностью к служению, а не просто признал их таковыми.'
- source_word: διακόνους
  choice: служителями
  rationale: Естественно передаёт направленность διάκονος на служение, не сводя слово ни к церковной должности, ни к социальному положению раба.
- source_word: καινῆς διαθήκης
  choice: нового завета
  rationale: Точно передаёт родительный оборот и сохраняет узнаваемую библейскую категорию нового завета; отсутствие артикля в греческом не требует неопределённости в русском.
- source_word: γράμματος / γράμμα
  choice: буквы
  rationale: Сохраняет лаконичный и многозначный Павлов контраст; вариант «писаного установления» был бы более истолковывающим и сузил бы образ.
- source_word: πνεύματος / πνεῦμα
  choice: Духа
  rationale: В контексте нового завета вероятнее всего имеется в виду Святой Дух; прописная буква отражает это понимание, а языковая неоднозначность отмечена в сноске.
- source_word: ἀποκτέννει
  choice: убивает
  rationale: Прямой и сильный эквивалент, сохраняющий образность и настоящее время греческого глагола.
- source_word: ζῳοποιεῖ
  choice: даёт жизнь
  rationale: Естественная современная русская формулировка, точно передающая животворящее действие.
theological_decisions:
- issue: Следует ли понимать πνεῦμα как Святого Духа или как дух
  choice: Дух
  alternative: дух
  rationale: Новозаветный контекст и утверждение о даровании жизни указывают прежде всего на Святого Духа. Однако греческое письмо само по себе не различает прописную и строчную буквы, поэтому альтернативное понимание сохранено в сноске.
- issue: Следует ли истолковать γράμμα как писаный закон
  choice: буква
  alternative: писаное установление
  rationale: «Буква» сохраняет широту и напряжение метафоры Павла, тогда как более пояснительный вариант заранее отождествил бы её с конкретным писаным сводом.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис остаётся ясным и близким к греческому противопоставлению; тире помогает естественно оформить уточнение «не буквы, а Духа». Термин «служители» выбран без привнесения позднейшего значения церковной должности.
