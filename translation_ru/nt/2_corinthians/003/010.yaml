  verdict: revise
  source_fidelity: Нужна небольшая правка. «Даже» в начале может естественно читаться как относящееся к «прославленному» («даже прославленное»), тогда как καὶ γάρ здесь совместно выполняют усилительно-пояснительную функцию. Кроме того, «не было прославлено» как простое прошедшее время недостаточно передаёт результативный, парадоксальный характер перфекта οὐ δεδόξασται.
  naturalness: Фраза в целом понятна, но «Ведь даже прославленное» несколько двусмысленно по сфере действия «даже». Предлагаемая формулировка сохраняет намеренный повтор и звучит естественно в современном литературном русском.
  terminology: «Прославлено / прославленное / слава» удачно сохраняет игру слов семейства δοξ-. «Превосходящая слава» точно передаёт ὑπερβαλλούσης без добавления в основной текст невыраженного объекта сравнения.
  issues:
  - severity: medium
    issue: Сфера действия «даже» в «Ведь даже прославленное».
    rationale: καὶ γάρ усиливает всё пояснительное высказывание («ибо и / ведь и»), а не обязательно выделяет субъект как «даже прославленное». Русская конструкция способна изменить акцент.
  - severity: medium
    issue: «Не было прославлено» передаёт οὐ δεδόξασται как простое завершённое прошлое.
    rationale: Перфект выражает парадоксальную актуальную оценку ранее прославленного в свете большей славы. «Уже не прославлено» лучше воспроизводит этот результативный смысл, не превращая выражение в утверждение, что прежнее вовсе не имело славы.
  revised_text: Ибо то, что было прославлено, в этом отношении уже не прославлено — из-за превосходящей славы.[a]
