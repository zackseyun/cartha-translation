- from: Ведь даже прославленное в этом отношении не было прославлено — из-за славы, которая превосходит его.[a]
  to: Ибо то, что было прославлено, в этом отношении уже не прославлено — из-за превосходящей славы.[a]
  rationale: Устранена двусмысленность, создаваемая начальным «даже», и точнее передан результативный смысл греческого перфекта. Повтор «прославлено» сохранён ради риторической связи с «славой». Добавленное «уже» естественно выражает сравнительную, а не абсолютную, отмену прежней славы в данном отношении. Сноска сохраняет указанную в греческом неопределённость объекта при «превосходящей».
