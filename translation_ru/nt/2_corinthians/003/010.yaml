  text: καὶ γὰρ οὐ δεδόξασται τὸ δεδοξασμένον ἐν τούτῳ τῷ μέρει ⸀εἵνεκεν τῆς ὑπερβαλλούσης δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: ru
  text: Ибо то, что было прославлено, в этом отношении уже не прославлено — из-за превосходящей славы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за славы, которая превосходит». В греческом тексте прямо не названо, что именно она превосходит.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Ведь даже
  rationale: «Ведь» передаёт пояснительную силу γάρ, а «даже» — усилительный оттенок καί; сочетание естественно звучит по-русски и подчёркивает парадокс сравнения.
- source_word: οὐ δεδόξασται
  choice: не было прославлено
  rationale: Сохранена пассивная глагольная форма и словесная связь с «прославленное» и «слава». Такая формулировка удерживает намеренно парадоксальное утверждение Павла, не превращая его в простое «не имело славы».
- source_word: τὸ δεδοξασμένον
  choice: прославленное
  rationale: Субстантивированное причастие передано без добавления отсутствующего в греческом существительного. Из контекста ясно, что речь идёт о прежде наделённом славой служении.
- source_word: ἐν τούτῳ τῷ μέρει
  choice: в этом отношении
  rationale: 'Фраза ограничивает область отрицания: прежняя слава не отрицается абсолютно, а рассматривается в сравнении с превосходящей её славой.'
- source_word: εἵνεκεν
  choice: из-за
  rationale: Передаёт причинное значение предлога кратко и естественно.
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: из-за славы, которая превосходит его
  rationale: Причастие передано глагольной конструкцией, чтобы выразить сравнительную силу ὑπερβάλλω. Местоимение «его» добавлено по контексту и относится к ранее прославленному; поскольку объект прямо не назван в греческом, альтернативная передача отмечена в сноске.
- source_word: δόξα / δεδοξασμένον / δεδόξασται
  choice: прославленное … не было прославлено … слава
  rationale: Сохранён повтор общего корня δοξ-, важный для риторики и смысла стиха.
theological_decisions:
- issue: Отрицает ли Павел всякую славу прежнего служения или говорит сравнительно?
  choice: 'Отрицание понято сравнительно и ограничено словами «в этом отношении»: прежняя слава как бы перестаёт быть славой рядом с превосходящей её славой.'
  alternative: Абсолютное отрицание того, что прежнее служение обладало подлинной славой.
  rationale: Оборот ἐν τούτῳ τῷ μέρει ограничивает отрицание, а ближайший контекст прямо признаёт славу прежнего служения, одновременно утверждая превосходство новой славы.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и намеренного Павлова парадокса. Порядок слов слегка перестроен ради ясности; тире обозначает смысловой итог, не добавляя нового содержания.
