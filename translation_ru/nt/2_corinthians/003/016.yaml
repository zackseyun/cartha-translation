  text: ἡνίκα ⸂δὲ ἐὰν⸃ ἐπιστρέψῃ πρὸς κύριον, περιαιρεῖται τὸ κάλυμμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/016.yaml
  text: But whenever one turns to the Lord[b][a], the veil is removed.
translation:
  language: ru
  text: Но всякий раз, когда кто-либо обращается к Господу[a], покрывало снимается.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом подлежащее не выражено: «когда [он] обращается к Господу». В контексте образа из Исх. 34 возможна отсылка к Моисею.'
    reason: Подлежащее греческого глагола прямо не названо; примечание поясняет возможное контекстуальное прочтение, не выдавая его за иной вариант текста.
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: Но всякий раз, когда
  rationale: Сочетание временного союза с ἐὰν и сослагательным наклонением выражает неопределённое или повторяющееся условие; «всякий раз, когда» естественно передаёт этот оттенок, а «но» сохраняет связующую силу δέ.
- source_word: ἐπιστρέψῃ
  choice: обращается
  rationale: Глагол обозначает поворот или обращение к кому-либо. «Обращается» сохраняет направленность действия и не сужает смысл до формального религиозного обращения.
- source_word: πρὸς κύριον
  choice: к Господу
  rationale: Предлог πρός с винительным падежом указывает направление к лицу; русское «к Господу» передаёт его кратко и естественно.
- source_word: περιαιρεῖται
  choice: снимается
  rationale: Настоящее время страдательного залога описывает то, что происходит с покрывалом, не называя действующего лица. «Снимается» естественно сочетается с «покрывалом» и сохраняет пассивную конструкцию.
- source_word: τὸ κάλυμμα
  choice: покрывало
  rationale: В контексте образ восходит к покрывалу Моисея; «покрывало» точно сохраняет эту конкретную связь.
theological_decisions:
- issue: Не названное прямо подлежащее при ἐπιστρέψῃ
  choice: 'Передать неопределённо: «кто-либо обращается»'
  alternative: «он обращается», с возможной отсылкой непосредственно к Моисею
  rationale: В греческом тексте подлежащее не выражено. Основной вариант сохраняет обобщённую силу конструкции, не ограничивая её ни одним человеком, ни группой; примечание отмечает возможное контекстуальное прочтение.
- issue: Кого обозначает «Господь»
  choice: Оставить «Господь» без дополнительного уточнения
  alternative: Уточнить как Христа или Духа
  rationale: Сам стих содержит только κύριον. Контекст связывает Господа и Духа сложным образом, поэтому перевод не должен заранее разрешать эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и торжественно-сдержанная. Выражение «всякий раз, когда» передаёт неопределённо-повторяющийся характер греческой конструкции, а «кто-либо» позволяет не вводить более узкое богословское толкование.
