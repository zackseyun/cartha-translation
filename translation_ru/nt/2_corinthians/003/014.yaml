  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: ru
  text: Но их умы были ожесточены. Ведь до сего дня при чтении старого завета то же покрывало остаётся неснятым, потому что в Мессии оно устраняется.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…то же покрывало остаётся неснятым, ибо в Мессии оно устраняется». Подлежащее греческого глагола «устраняется» не выражено; он может относиться к покрывалу или, по другому пониманию, к старому завету.'
    reason: Греческая конструкция μὴ ἀνακαλυπτόμενον, ὅτι ἐν Χριστῷ καταργεῖται допускает обсуждаемую неоднозначность подразумеваемого субъекта καταργεῖται. Основной текст следует ближайшему антецеденту — «покрывало», не исключая альтернативу.
lexical_decisions:
- source_word: ἐπωρώθη τὰ νοήματα αὐτῶν
  choice: их умы были ожесточены
  rationale: Передаёт пассивную форму и образ внутренней чёрствости или невосприимчивости, не усиливая её до сознательного упрямства.
- source_word: ἄχρι γὰρ τῆς σήμερον ἡμέρας
  choice: ведь до сего дня
  rationale: Сохраняет временной акцент оригинала и соответствует возвышенному, но понятному современному русскому регистру.
- source_word: κάλυμμα
  choice: покрывало
  rationale: Сохраняет связь с образом покрывала Моисея в ближайшем контексте.
- source_word: ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης
  choice: при чтении старого завета
  rationale: «При чтении» естественно передаёт обстоятельство, а «завет» сохраняет основное значение διαθήκη, не подменяя его названием корпуса Писания.
- source_word: μένει μὴ ἀνακαλυπτόμενον
  choice: остаётся неснятым
  rationale: Естественно по-русски выражает продолжающееся состояние и сохраняет образ покрывала, которое не снято.
- source_word: ἐν Χριστῷ
  choice: лишь в Мессии
  rationale: «Мессия» передаёт титульное значение Χριστός; «лишь» делает явной ограничительную силу контекста, подразумеваемую конструкцией.
- source_word: καταργεῖται
  choice: устраняется
  rationale: 'Глагол передан достаточно широко: он применим к устранению покрывала и не исключает возможной связи со старым заветом.'
theological_decisions:
- issue: Референт καταργεῖται
  choice: Местоимение «оно» в основном тексте относится прежде всего к ближайшему существительному «покрывало».
  alternative: Возможен смысл, при котором упраздняется старый завет; синтаксис также допускает менее однозначное понимание всей заключительной части.
  rationale: Ближайший естественный антецедент — κάλυμμα, что согласуется с образом неснятого покрывала. Значимая неоднозначность отмечена в сноске, чтобы не превращать перевод в более сильное богословское утверждение, чем позволяет греческий текст.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Сохранены метафора ожесточения и образ покрывала; традиционное «Ветхий Завет» не использовано в основном тексте, чтобы яснее передать значение «завет», а не название раздела Библии.
