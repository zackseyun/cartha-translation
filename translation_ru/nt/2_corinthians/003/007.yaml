  text: Εἰ δὲ ἡ διακονία τοῦ θανάτου ἐν ⸀γράμμασιν ⸀ἐντετυπωμένη λίθοις ἐγενήθη ἐν δόξῃ, ὥστε μὴ δύνασθαι ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ πρόσωπον Μωϋσέως διὰ τὴν δόξαν τοῦ προσώπου αὐτοῦ τὴν καταργουμένην,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/007.yaml
  text: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
translation:
  language: ru
  text: Но если служение смерти, начертанное письменами на камнях, явилось во славе, так что сыны Израиля[a] не могли пристально смотреть на лицо Моисея из-за славы его лица, которая угасала[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которая была преходящей», «которая прекращалась» или «которая упразднялась».'
    reason: alternative_reading
lexical_decisions:
- source_word: διακονία
  choice: служение
  rationale: Сохраняет как идею служения, так и порученного установления, важную для противопоставления у Павла.
- source_word: τοῦ θανάτου
  choice: смерти
  rationale: Краткая родительная конструкция передаёт резкость выражения Павла, не уточняя истолковательно «несущее смерть».
- source_word: ἐν γράμμασιν ἐντετυπωμένη λίθοις
  choice: начертанное буквами на камнях
  rationale: Передаёт письмена и нанесение надписи на камни, не добавляя отсутствующего в греческом тексте слова «скрижали».
- source_word: ἐγενήθη ἐν δόξῃ
  choice: явилось во славе
  rationale: Сохраняет событийный смысл глагола и связь установления со славой, оставаясь приемлемым в возвышенном современном русском регистре.
- source_word: ὥστε μὴ δύνασθαι ἀτενίσαι
  choice: так что … не могли пристально смотреть
  rationale: Передаёт конструкцию результата и значение напряжённого, неотрывного взгляда.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: сыны Израиля
  rationale: Близко отражает мужскую форму греческого выражения и сохраняет узнаваемую библейскую формулу.
- source_word: εἰς τὸ πρόσωπον Μωϋσέως
  choice: на лицо Моисея
  rationale: Естественное русское управление при глаголе «смотреть» сохраняет конкретное указание на лицо.
- source_word: καταργουμένην
  choice: угасающей
  rationale: В ближайшем контексте речь идёт о видимой славе лица Моисея; «угасающей» естественно выражает её временный характер, не исключая более общего смысла прекращения.
theological_decisions:
- issue: Следует ли передавать καταργουμένην как видимое угасание славы или как её прекращение/упразднение.
  choice: славы угасающей
  alternative: славы, которая прекращалась; славы преходящей
  rationale: Непосредственный образ связан со славой на лице Моисея, поэтому «угасающей» уместно в данном предложении. В сноске сохранена смысловая возможность прекращения или устранения, чтобы не разрешать однозначно богословское напряжение контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулы «служение смерти» и «сыны Израиля» сохранены ради близости к греческому тексту; более обычный вариант для второго выражения дан в сноске. Тире проясняет, что причастие относится к славе, не снимая смысловой многозначности καταργουμένην.
