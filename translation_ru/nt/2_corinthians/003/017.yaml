  text: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν· οὗ δὲ τὸ πνεῦμα ⸀κυρίου, ἐλευθερία.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/017.yaml
  text: The Lord is the Spirit[a], and where the Spirit of the Lord is, there is freedom.
translation:
  language: ru
  text: Господь же есть Дух[a], а где Дух Господа, там свобода.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Господь есть Дух» можно понимать как тесное отождествление в данном контексте, без уточнения того, как именно следует определять эту связь богословски.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: Господь
  rationale: Передаёт обычное библейское и богословски значимое употребление κύριος в данном контексте; вариант «господин» здесь неоправданно ослабил бы смысл.
- source_word: πνεῦμα
  choice: Дух
  rationale: Оба употребления в ходе рассуждения Павла относятся к Святому Духу; прописная буква ясно передаёт этот референт, не добавляя слова «Святой», которого нет в греческом тексте.
- source_word: δὲ
  choice: же / а
  rationale: Первое δέ передано частицей «же», естественно отмечающей развитие мысли без временного значения; второе — союзом «а», который плавно связывает общее утверждение со следующим положением.
- source_word: οὗ
  choice: где
  rationale: Сохраняет местное значение относительного наречия и естественно звучит в общем утверждении; более широкое «везде, где» возможно, но несколько усиливает греческую формулировку.
- source_word: ἐλευθερία
  choice: свобода
  rationale: Современный и точный русский эквивалент, сохраняющий богословскую весомость слова без архаизации.
- source_word: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν
  choice: Господь же есть Дух
  rationale: Прямо сохраняет именное отождествляющее высказывание греческого текста и его богословское напряжение; связка «есть» уместна в торжественной библейской прозе и подчёркивает структуру утверждения.
- source_word: τὸ πνεῦμα κυρίου
  choice: Дух Господа
  rationale: Сохраняет явную родительную конструкцию греческого текста и её библейские созвучия.
theological_decisions:
- issue: Богословски спорное отождествление в словах «Господь есть Дух».
  choice: Сохранено прямое утверждение «Господь же есть Дух» без смягчающего пересказа.
  alternative: Понимать эти слова как функциональное или относящееся к новому завету отождествление либо уточнять «Господь» как Христа.
  rationale: Греческий текст формулирует отождествление прямо, но не определяет исчерпывающе характер этой связи. Перевод сохраняет подлинную неоднозначность и не навязывает частного догматического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Частица «же» передаёт развитие мысли, не вводя отсутствующего в оригинале временного «теперь». Конструкция «где… там…» естественно выражает общее положение.
