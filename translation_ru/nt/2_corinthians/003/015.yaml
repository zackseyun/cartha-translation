  text: ἀλλ’ ἕως σήμερον ἡνίκα ⸂ἂν ἀναγινώσκηται⸃ Μωϋσῆς κάλυμμα ἐπὶ τὴν καρδίαν αὐτῶν κεῖται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/015.yaml
  text: But to this day[a], whenever Moses is read[b], a veil lies over their heart.
translation:
  language: ru
  text: Но и по сей день, всякий раз, когда читают Моисея[a], покрывало лежит у них на сердце[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть писания Моисея, прежде всего закон.
    reason: cultural_note
  - marker: b
    text: 'В греческом тексте — «сердце» в единственном числе, вероятно в собирательном смысле; возможно также: «на их сердцах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Но
  rationale: Передаёт противопоставление предыдущему высказыванию кратким и естественным русским союзом.
- source_word: ἕως σήμερον
  choice: и по сей день
  rationale: Естественное современное выражение, подчёркивающее, что описанное состояние продолжается до настоящего времени.
- source_word: ἡνίκα ἂν ἀναγινώσκηται
  choice: всякий раз, когда читают
  rationale: Сочетание ἡνίκα с ἄν и настоящим сослагательным указывает на неопределённо повторяющееся обстоятельство; русская неопределённо-личная конструкция естественно передаёт греческий пассив.
- source_word: Μωϋσῆς
  choice: Моисея
  rationale: 'Сохранена метонимия оригинала: имя Моисея обозначает связанные с ним Писания, но это толкование не внесено непосредственно в основной текст.'
- source_word: κάλυμμα
  choice: покрывало
  rationale: Сохраняет ключевой образ покрывала, проходящий через ближайший контекст главы.
- source_word: ἐπὶ τὴν καρδίαν αὐτῶν
  choice: у них на сердце
  rationale: Сохраняет единственное число «сердце» при множественном обладателе и при этом звучит по-русски естественнее буквального «на их сердце».
- source_word: κεῖται
  choice: лежит
  rationale: Прямо передаёт устойчивое положение покрывала в метафорическом образе.
theological_decisions:
- issue: Следует ли явно раскрыть, что «Моисей» означает Моисеевы писания или закон
  choice: Сохранить в основном тексте метонимическое «Моисея»
  alternative: Перевести как «закон Моисея» или «писания Моисея»
  rationale: В греческом тексте стоит имя «Моисей». Его сохранение не сужает смысл до одной заранее выбранной формулировки, а метонимическое значение поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формула «по сей день» общеупотребительна и сохраняет достоинство стиля; конструкция «у них на сердце» сочетает естественность с формальной точностью к единственному числу оригинала.
