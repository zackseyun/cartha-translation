lexical_decisions:
- source_word: μή
  choice: Разве ...?
  rationale: Частица вводит риторический вопрос, предполагающий отрицательный ответ; «разве» естественно передаёт это ожидание по-русски.
- source_word: τινα ὧν
  choice: через кого-нибудь из тех, кого
  rationale: 'Передаёт неопределённость и партитивное значение: любой человек из числа посланных Павлом.'
- source_word: ἀπέσταλκα
  choice: я посылал
  rationale: Русский глагол прошедшего времени в данном контексте естественно обозначает тех, кого Павел направлял к коринфянам; результативность греческого перфекта отдельно выражать не требуется.
- source_word: πρὸς ὑμᾶς
  choice: к вам
  rationale: Естественная передача направления движения применительно к людям.
- source_word: δι’ αὐτοῦ
  choice: через кого-нибудь из тех
  rationale: Греческое местоимение стоит в единственном числе («через него») и соотносится с неопределённым τινα. Русская конструкция объединяет обе части без изменения распределительного смысла.
- source_word: ἐπλεονέκτησα
  choice: я нажился
  rationale: Глагол обозначает получение выгоды за чужой счёт. «Нажился на вас» кратко и естественно передаёт как корыстную выгоду, так и отрицательную нравственную оценку.
- source_word: ὑμᾶς
  choice: на вас
  rationale: Предлог требуется русским выражением «нажиться на ком-либо» и сохраняет коринфян как объект предполагаемой корыстной выгоды.
