reference: 2 Corinthians 12:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἰδοὺ τρίτον ⸀τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς, καὶ οὐ ⸀καταναρκήσω· οὐ γὰρ ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς, οὐ γὰρ ὀφείλει τὰ τέκνα τοῖς γονεῦσιν θησαυρίζειν, ἀλλὰ οἱ γονεῖς τοῖς τέκνοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: ru
  text: Вот, я в третий раз готов прийти к вам[a] и не стану обременять вас[b], потому что ищу не вашего, а вас самих. Ведь не дети должны копить для родителей, а родители — для детей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «вот, этот третий раз я готов прийти к вам». Формулировка может относиться к третьему намерению или готовности прийти, а не обязательно к третьему состоявшемуся посещению.'
    reason: lexical_alternative
  - marker: b
    text: Употреблённый здесь глагол может означать материально отягощать кого-либо, то есть жить за его счёт.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Естественное для современного русского языка средство привлечения внимания, сохраняющее выразительность греческого слова без архаичного «се».
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς
  choice: я в третий раз готов прийти к вам
  rationale: Близко передаёт греческую конструкцию, относя «в третий раз» к нынешней готовности Павла прийти и не утверждая сверх текста, что два прежних посещения непременно состоялись.
- source_word: καταναρκήσω
  choice: не стану обременять вас
  rationale: Передаёт идею тяготы, которая в данном контексте прежде всего связана с материальным содержанием Павла коринфянами.
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: ищу не вашего, а вас самих
  rationale: Сохраняет ёмкое противопоставление имущества или средств адресатов им самим; «вас самих» естественно подчёркивает личностный объект заботы.
- source_word: ὀφείλει
  choice: должны
  rationale: Ясно выражает обязанность или надлежащий порядок, заложенный в греческом глаголе.
- source_word: θησαυρίζειν
  choice: копить
  rationale: В данном семейно-материальном контексте естественно передаёт накопление средств; буквальное «собирать сокровища» звучало бы менее естественно и могло бы сузить смысл.
- source_word: γονεῦσιν / γονεῖς
  choice: родителей / родители
  rationale: Точно передаёт общее обозначение обоих родителей.
- source_word: τέκνα / τέκνοις
  choice: дети / детей
  rationale: Сохраняет общее, не ограниченное полом обозначение потомков.
theological_decisions:
- issue: Смысл слов Павла о «третьем разе»
  choice: «я в третий раз готов прийти к вам» — третий случай готовности или намерения прийти
  alternative: «я готов прийти к вам в третий раз» — формулировка, легче воспринимаемая как утверждение о двух уже состоявшихся посещениях
  rationale: Порядок и конструкция греческого текста связывают третий раз с нынешней готовностью Павла. Перевод сохраняет возможность разных реконструкций истории его посещений и не разрешает эту неоднозначность без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены риторическое «Вот», противопоставление «не вашего, а вас самих» и семейная аналогия; архаизмы и конфессионально окрашенные добавления исключены.
