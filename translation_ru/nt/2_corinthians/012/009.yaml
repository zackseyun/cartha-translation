revisions:
- from: 'И Он сказал мне: «Довольно для тебя Моей благодати, ведь сила достигает полноты в слабости».[a] Поэтому я с ещё большей радостью буду хвалиться своими слабостями, чтобы сила Мессии пребывала надо мной.[b]'
  to: 'И Он сказал мне: «Тебе достаточно Моей благодати, ведь сила достигает полноты в слабости[a]». Поэтому я с ещё большей радостью буду хвалиться своими слабостями, чтобы сила Мессии осенила меня[b].'
  rationale: Исправлены естественность начальной реплики и положение маркера сноски. «Осенила меня» передаёт направленность ἐπί и образ ἐπισκηνόω, не превращая его в буквальное утверждение о физическом шатре. Сохранены отсутствие явного притяжательного местоимения в основном тексте SBLGNT, лексический повтор «слабость/слабости» и титульная передача Χριστοῦ как «Мессии».
