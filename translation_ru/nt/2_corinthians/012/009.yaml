    rationale: Глагол ἐπισκηνόω вызывает образ шатра, раскинутого над кем-либо, и в данном контексте означает, что сила Мессии «осенит» или «раскинет шатёр над» Павлом. Простое «пребывать надо мной» ослабляет этот образ; сноска сама верно его отмечает.
