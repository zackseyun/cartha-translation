  text: καὶ εἴρηκέν μοι· Ἀρκεῖ σοι ἡ χάρις μου· ἡ γὰρ ⸀δύναμις ἐν ἀσθενείᾳ ⸀τελεῖται. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις ⸀μου, ἵνα ἐπισκηνώσῃ ἐπ’ ἐμὲ ἡ δύναμις τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/009.yaml
  text: And he has said to me[a], “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly in my weaknesses[d][c][b], so that the power of Messiah may dwell upon me.
translation:
  language: ru
  text: 'И Он сказал мне: «Тебе достаточно Моей благодати, ведь сила достигает полноты в слабости[a]». Поэтому я с ещё большей радостью буду хвалиться своими слабостями, чтобы сила Мессии осенила меня[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В ряде рукописей: «ведь Моя сила достигает полноты в слабости». Традиционно: «ибо сила Моя совершается в немощи».'
    reason: textual_and_lexical_alternative
  - marker: b
    text: 'Или: «покоилась на мне»; более буквально: «раскинула шатёр надо мной».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκέν
  choice: сказал
  rationale: Русский совершенный вид естественно передаёт состоявшееся высказывание; сохраняющаяся значимость слов явствует из прямой речи и контекста, тогда как буквальное воспроизведение греческого перфекта звучало бы неестественно.
- source_word: Ἀρκεῖ σοι ἡ χάρις μου
  choice: Довольно для тебя Моей благодати
  rationale: «Довольно» ясно передаёт достаточность, а «благодать» сохраняет насыщенное богословское значение χάρις в речи Павла.
- source_word: δύναμις
  choice: сила
  rationale: «Сила» естественно передаёт повторяющееся существительное и сохраняет связь с выражением «сила Мессии» в конце стиха.
- source_word: ἀσθενείᾳ / ἀσθενείαις
  choice: слабость / слабости
  rationale: Сохранены лексический повтор и переход от общего принципа в единственном числе к конкретным слабостям Павла во множественном; современное «слабость» шире и понятнее, чем «немощь».
- source_word: τελεῖται
  choice: достигает полноты
  rationale: Передаёт достижение полного выражения или цели, не создавая впечатления, будто Божья сила прежде была несовершенной.
- source_word: ἥδιστα οὖν μᾶλλον καυχήσομαι
  choice: Поэтому я с ещё большей радостью буду хвалиться
  rationale: Фраза естественно объединяет усилительные ἥδιστα и μᾶλλον и сохраняет парадоксальное Павлово «хвалиться».
- source_word: ἐπισκηνώσῃ ἐπ’ ἐμέ
  choice: пребывала надо мной
  rationale: Передаёт продолжительное присутствие силы над Павлом и сохраняет пространственный оттенок ἐπί; образ шатра пояснён в сноске.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Здесь Χριστός допускает титульное понимание; «Мессия» передаёт значение Помазанника, не превращая титул без необходимости в имя.
theological_decisions:
- issue: Наличие притяжательного местоимения при δύναμις
  choice: сила достигает полноты в слабости
  alternative: Моя сила достигает полноты в слабости
  rationale: В представленном греческом тексте перед δύναμις нет явного μου. Поэтому основный текст не добавляет «Моя», хотя по контексту речь естественно понимается как о силе Господа; известное чтение с притяжательным местоимением отмечено в сноске.
- issue: Смысл τελεῖται применительно к силе
  choice: достигает полноты
  alternative: совершается / становится совершенной
  rationale: Выбранная формулировка сохраняет направленность к полному проявлению, не снимая парадокса силы в слабости и не предполагая прежнего изъяна в Божьей силе.
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: Родительный падеж передан титулом «Мессия»; традиционный вариант «Христа» возможен, но в данном контексте греческая форма не требует непременно имениподобной передачи.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис сделан понятным для широкого читателя; сохранены повтор «слабость/слабости», парадокс хваления слабостями и образ пребывающей над Павлом силы. Местоимения в прямой речи написаны с прописной буквы как уважительное обозначение говорящего Господа.
