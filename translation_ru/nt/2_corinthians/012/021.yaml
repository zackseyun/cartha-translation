source:
  edition: SBLGNT
  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: ru
  text: Боюсь, как бы при моём новом приходе Бог мой не смирил меня перед вами и мне не пришлось оплакивать многих из тех, кто прежде согрешил и не раскаялся в нечистоте, разврате и распущенности, которым они предавались.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: как бы, когда я снова приду
  rationale: Оборот продолжает выражение опасения из предыдущего стиха; по-русски подразумеваемое «боюсь» необходимо повторить, а родительный абсолют естественно передать придаточным времени.
- source_word: ταπεινώσῃ με ὁ θεός μου πρὸς ὑμᾶς
  choice: мой Бог не смирил меня перед вами
  rationale: «Смирил» сохраняет основной диапазон ταπεινόω — унизить, смирить, низвести; «перед вами» передаёт возможный оттенок происходящего в присутствии коринфян, не сводя смысл только к публичному унижению.
- source_word: καὶ πενθήσω
  choice: и мне не пришлось оплакивать
  rationale: В сфере продолжающегося опасения русская конструкция «как бы… не… и не пришлось» естественно выражает второй предмет страха; «оплакивать» сохраняет силу πενθέω.
- source_word: πολλοὺς τῶν προημαρτηκότων
  choice: многих из тех, кто прежде согрешил
  rationale: Партитивное τῶν передано словами «из тех»; «прежде согрешил» выражает предшествование, а дальнейшее отсутствие раскаяния показывает сохраняющуюся актуальность совершённого греха.
- source_word: μὴ μετανοησάντων ἐπὶ
  choice: не раскаялся в
  rationale: Русское «раскаяться в» идиоматично передаёт отсутствие покаяния в перечисленных поступках.
- source_word: ἀκαθαρσίᾳ
  choice: нечистоте
  rationale: Сохраняет широкое нравственное значение термина и традиционную библейскую образность без излишнего сужения.
- source_word: πορνείᾳ
  choice: разврате
  rationale: Современное и понятное обозначение половой безнравственности; не ограничивает πορνεία одним конкретным её видом.
- source_word: ἀσελγείᾳ
  choice: распущенности
  rationale: Передаёт бесстыдную и необузданную сторону ἀσέλγεια, сохраняя отличие от более общего «разврата».
- source_word: ᾗ ἔπραξαν
  choice: которым они предавались
  rationale: Относительное местоимение в единственном числе собирательно относится ко всему перечню; «предавались» естественно передаёт практику и устойчивое поведение.
theological_decisions:
- issue: Зависимость μή от выражения страха в предыдущем стихе
  choice: «Боюсь, как бы… не…»
  alternative: «Чтобы при моём новом приходе Бог не смирил меня…»
  rationale: Повторение «боюсь» делает синтаксическую связь явной, не превращая слова Павла в самостоятельное предсказание.
- issue: Характер действия Бога в ταπεινώσῃ με
  choice: «смирил меня»
  alternative: «унизил меня»
  rationale: Выбранный вариант сохраняет возможность болезненного умаления Павла Богом, но не утверждает однозначно оттенок публичного унижения.
- issue: Разграничение трёх нравственных терминов
  choice: «нечистоте, разврате и распущенности»
  alternative: «нечистоте, половой безнравственности и бесстыдстве»
  rationale: Три пересекающихся понятия оставлены раздельными; перевод не навязывает каждому слову чрезмерно узкого конфессионального определения.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Сложная конструкция сохранена как единое выражение опасения, но выстроена естественно для русского читателя; перечисление пороков не сглажено.
