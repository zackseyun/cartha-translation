  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: ru
  text: Поэтому я радуюсь слабостям, оскорблениям, лишениям, гонениям и бедствиям ради Мессии[a], ведь когда я слаб, тогда я силён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный перевод: «ради Христа».'
    reason: Альтернативная традиционная передача титула Χριστός.
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения и сохраняет явную логическую связь.
- source_word: εὐδοκῶ
  choice: я рад
  rationale: Естественно передаёт благосклонное принятие и радость, не сводя слова Павла к пассивному смирению с обстоятельствами.
- source_word: ἐν ἀσθενείαις
  choice: слабостям
  rationale: Сохраняет множественное число и широкий смысл человеческой немощи, не ограничивая его болезнями.
- source_word: ἐν ὕβρεσιν
  choice: оскорблениям
  rationale: В данном перечне обозначает унизительное, оскорбительное обращение.
- source_word: ἐν ἀνάγκαις
  choice: лишениям
  rationale: Передаёт вынужденные тяготы и нужду; при этом не дублирует последующее обозначение бедствий.
- source_word: ἐν διωγμοῖς
  choice: гонениям
  rationale: Обычное и точное русское обозначение преследований за верность Мессии.
- source_word: καὶ στενοχωρίαις
  choice: и бедствиям
  rationale: Передаёт тяжёлые стеснённые обстоятельства и сильное давление понятным современным словом.
- source_word: ὑπὲρ Χριστοῦ
  choice: ради Мессии
  rationale: ὑπέρ указывает, ради кого и вследствие верности кому переносятся страдания; Χριστός здесь сохранено как титул.
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: ведь когда я слаб
  rationale: Передаёт обобщающее временное значение ὅταν с настоящим сослагательным и естественно вводит основание парадоксального утверждения.
- source_word: τότε δυνατός εἰμι
  choice: тогда я силён
  rationale: Сохраняет прямое противопоставление слабости и силы.
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В выражении ὑπὲρ Χριστοῦ титульный смысл остаётся ощутимым; традиционная передача указана в сноске без устранения этого различия.
translation_notes:
  register: Современный литературный русский язык; фраза построена ясно и ритмично, с сохранением перечня страданий и заключительного парадокса. «Я рад» выбрано вместо устаревшего «благодушествую» и более тяжеловесного «нахожу удовольствие».
