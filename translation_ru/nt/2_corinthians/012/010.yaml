- from: Поэтому я рад слабостям, оскорблениям, лишениям, гонениям и бедствиям ради Мессии[a], ведь когда я слаб, тогда я силён.
  to: Поэтому я радуюсь слабостям, оскорблениям, лишениям, гонениям и бедствиям ради Мессии[a], ведь когда я слаб, тогда я силён.
