  text: ἐγὼ δὲ ἥδιστα δαπανήσω καὶ ἐκδαπανηθήσομαι ὑπὲρ τῶν ψυχῶν ὑμῶν. ⸀εἰ περισσοτέρως ὑμᾶς ⸀ἀγαπῶν, ἧσσον ἀγαπῶμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/015.yaml
  text: But I will most gladly spend and be spent for your souls. If I love you more abundantly[a], am I loved less?
translation:
  language: ru
  text: Я же с величайшей радостью буду тратить и сам истощусь ради ваших душ[a]. Если я люблю вас больше, то неужели меня любят меньше?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваших жизней» или «вас самих».'
    reason: ψυχαί может означать «души», «жизни» или самих людей; основной текст сохраняет буквальное и уместное в пастырском контексте «душ».
lexical_decisions:
- source_word: ἥδιστα
  choice: с величайшей радостью
  rationale: Превосходная степень наречия передаёт не просто согласие, а горячую готовность Павла к самоотдаче.
- source_word: δαπανήσω
  choice: буду тратить всё
  rationale: Сохраняет образ расходования средств; «всё» естественно выражает подразумеваемое имущество или ресурсы, не смешивая их с последующим указанием на самого Павла.
- source_word: ἐκδαπανηθήσομαι
  choice: истрачу самого себя
  rationale: 'Формально пассивная усиленная форма продолжает метафору: Павел готов не только расходовать своё, но и полностью отдать себя. Возвратная русская конструкция естественнее буквального «быть истраченным».'
- source_word: ὑπὲρ τῶν ψυχῶν ὑμῶν
  choice: ради ваших душ
  rationale: ὑπέρ обозначает действие ради блага адресатов, а ψυχαί сохраняет личностную и духовную глубину выражения.
- source_word: εἰ
  choice: если
  rationale: Сохраняет форму риторического условия и не превращает её без необходимости в причинное «поскольку».
- source_word: περισσοτέρως
  choice: сильнее
  rationale: Естественно по-русски передаёт сравнительно усиленную степень любви; буквальное «более изобильно» здесь звучало бы неидиоматично.
- source_word: ἀγαπῶν
  choice: я люблю
  rationale: Причастие естественно передано личной формой внутри условного оборота.
- source_word: ἧσσον ἀγαπῶμαι
  choice: вы любите меня меньше
  rationale: Активная русская конструкция ясно и естественно передаёт греческий пассив «я любим меньше», причём субъект определяется контекстом.
theological_decisions:
- issue: Значение ψυχαί в пастырском контексте
  choice: ваших душ
  alternative: вас самих / ваших жизней
  rationale: «Душ» сохраняет образность и духовно-личностный вес греческого слова, не утверждая при этом специальной антропологической схемы.
- issue: Риторическая связь сравнительных выражений περισσοτέρως и ἧσσον
  choice: Если я люблю вас сильнее, то неужели вы любите меня меньше?
  alternative: Если я люблю вас всё больше, то неужели меня любят всё меньше?
  rationale: Перевод сохраняет напряжённый контраст между большей любовью Павла и меньшей ответной любовью коринфян, не превращая сравнительные формы в утверждение о постепенном изменении во времени.
translation_notes:
  register: 'Современный литературный русский язык с достоинством и эмоциональной силой. Сохранена единая метафора расходования: сначала ресурсов, затем самого себя. Риторический вопрос передан прямо и естественно.'
