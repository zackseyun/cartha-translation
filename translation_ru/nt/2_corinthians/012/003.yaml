  yaml_path: translation/nt/2_corinthians/012/003.yaml
  text: And I know such a man—whether in the body or apart from the body I do not know[a]; God knows—
translation:
  language: ru
  text: И я знаю такого человека — в теле ли он или вне тела, не знаю[a], Бог знает, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отдельно от тела». Павел не говорит, было ли это в теле или вне тела.'
    reason: Лексическая альтернатива для χωρὶς τοῦ σώματος и сохранение смысловой неопределённости.
lexical_decisions:
- source_word: οἶδα
  choice: знаю
  rationale: Обычное соответствие глаголу οἶδα; повтор «знаю / знает» сохранён ради риторического акцента.
- source_word: τὸν τοιοῦτον ἄνθρωπον
  choice: такого человека
  rationale: Передаёт указание на конкретного человека, описанного в предыдущем контексте, и сохраняет косвенную форму самореференции Павла, не отождествляя его прямо.
- source_word: εἴτε ... εἴτε
  choice: был ли ... или
  rationale: Естественная русская конструкция для двух альтернатив; глагол «был» восполняется по нормам русского языка.
- source_word: ἐν σώματι
  choice: в теле
  rationale: Формально и естественно передаёт предложное сочетание, не уточняя природу переживания.
- source_word: χωρὶς τοῦ σώματος
  choice: вне тела
  rationale: Передаёт значение отделённости и естественно противопоставляется выражению «в теле», не утверждая, что переживание непременно было внетелесным.
- source_word: οὐκ οἶδα, ὁ θεὸς οἶδεν
  choice: не знаю, Бог знает
  rationale: Сохраняет явное противопоставление незнания Павла и знания Бога, а также лексический повтор.
- source_word: θεὸς
  choice: Бог
  rationale: Стандартное и однозначное соответствие.
theological_decisions:
- issue: Косвенная самореференция Павла и природа переживания
  choice: Сохранено выражение «такого человека»; не уточняется, был ли опыт телесным или внетелесным.
  alternative: Прямо назвать этого человека Павлом либо перевести так, чтобы утверждался внетелесный опыт.
  rationale: Греческий текст сохраняет риторическую дистанцию и прямо оставляет вопрос о телесности переживания нерешённым.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достоинственный. Тире сохраняют вставной характер оговорки и незавершённое продолжение мысли в следующем стихе.
