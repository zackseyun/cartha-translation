source:
  edition: SBLGNT
  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: ru
  text: Хвалиться необходимо. Правда, пользы в этом нет[b], но я перейду к видениям и откровениям Господа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «видениям и откровениям от Господа». Греческий родительный падеж может указывать на источник, но выражение «Господа» лучше сохраняет форму и смысловую открытость оригинала.'
    reason: alternative_reading
  - marker: b
    text: 'Возможна иная формулировка: «Хвалиться необходимо, хотя пользы в этом нет; но я перейду…»'
    reason: alternative_rendering
lexical_decisions:
- source_word: Καυχᾶσθαι
  choice: Хвалиться
  rationale: Настоящий инфинитив употреблён как подлежащее при δεῖ. Русский инфинитив естественно сохраняет словесный характер выражения и тему вынужденного самовосхваления Павла.
- source_word: δεῖ
  choice: необходимо
  rationale: Передаёт объективную необходимость, выраженную δεῖ, и естественно сочетается с инфинитивом «хвалиться».
- source_word: οὐ συμφέρον μέν
  choice: Правда, пользы в этом нет
  rationale: συμφέρον обозначает пользу или преимущество, а μέν вводит уступительно-контрастную часть, которой соответствует последующее δέ. «Правда… но» естественно передаёт эту связь по-русски.
- source_word: ἐλεύσομαι δὲ
  choice: но я перейду
  rationale: В сочетании с εἰς глагол здесь обозначает переход к следующей теме. «Перейду» естественнее буквального «приду», а «но» передаёт контрастное δέ.
- source_word: εἰς ὀπτασίας
  choice: к видениям
  rationale: ὀπτασία обозначает сверхъестественное видение; обычное и понятное русское соответствие — «видение».
- source_word: καὶ ἀποκαλύψεις
  choice: и откровениям
  rationale: ἀποκάλυψις здесь означает дарованное свыше раскрытие сокрытого; «откровение» является точным и общепринятым соответствием.
- source_word: κυρίου
  choice: Господа
  rationale: Русский родительный падеж формально сохраняет смысловую открытость греческого генитива, который может указывать как на принадлежность или связь, так и на источник.
theological_decisions:
- issue: Связь κυρίου с «видениями и откровениями»
  choice: видениям и откровениям Господа
  alternative: видениям и откровениям от Господа
  rationale: Греческий родительный падеж не уточняет однозначно характер связи. Формулировка «Господа» сохраняет эту сдержанность, тогда как «от Господа» явно определяет Господа как источник.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достоинственный. Короткое первое предложение передаёт резкий переход оригинала; конструкция «правда… но» естественно отражает μέν…δέ. Терминология понятна широкому читателю и не вводит конфессиональных уточнений.
