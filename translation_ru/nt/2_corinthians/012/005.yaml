    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в слабостях»; также возможно: «в немощах». Слово «своими» добавлено по контексту. У Павла это слово может обозначать человеческую хрупкость, страдания и обстоятельства, в которых проявляется Божья сила.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ τοῦ τοιούτου
  choice: таким человеком
  rationale: Ὑπέρ с родительным здесь указывает на того, в отношении кого звучит похвала. По-русски конструкция «хвалиться таким человеком» естественно передаёт этот смысл и сохраняет риторическое дистанцирование Павла; «человеком» уместно по контексту, хотя существительное в греческом подразумевается.
- source_word: καυχήσομαι / καυχήσομαι
  choice: буду хвалиться / хвалиться не буду
  rationale: Глагол καυχάομαι передан обычным современным «хвалиться», сохраняющим как положительный, так и критический оттенок в зависимости от контекста.
- source_word: ἐμαυτοῦ
  choice: собой
  rationale: Возвратное местоимение образует прямой контраст с τοῦ τοιούτου; творительный падеж естественен при русском «хвалиться».
- source_word: εἰ μὴ
  choice: разве только
  rationale: Оборот вводит исключение, а не условие. «Разве только» ясно и естественно отмечает это исключение.
- source_word: ἐν ταῖς ἀσθενείαις
  choice: своими слабостями
  rationale: ἀσθένεια охватывает слабость, немощь, человеческую хрупкость и страдания. Множественное «слабостями» сохраняет форму источника; «своими» эксплицирует очевидную личную отнесённость, требуемую естественным русским контрастом.
theological_decisions:
- issue: Отношение «такого человека» к самому Павлу
  choice: Сохранено риторическое различение между «таким человеком» и «собой».
  alternative: Прямо отождествить «такого человека» с Павлом либо представить его буквально другим лицом.
  rationale: Контекст указывает на намеренное дистанцирование Павла от пережитого откровения, но сам стих не разрешает риторическое напряжение; перевод не навязывает одного толкования.
- issue: Допустимый предмет похвалы Павла
  choice: Павел отказывается хвалиться собой, допуская лишь похвалу своими слабостями.
  alternative: Передать фразу как отвлечённый принцип похвалы слабостью без личной отнесённости.
  rationale: Противопоставление ἐμαυτοῦ и ἀσθενείαις имеет личный характер, однако богословский парадокс силы в слабости сохранён без дополнительного объяснения в основном тексте.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и естественным синтаксисом. Повтор «хвалиться» сохранён ради контраста оригинала; тире подчёркивает исключение. Все сноски отмечены в основном тексте.
