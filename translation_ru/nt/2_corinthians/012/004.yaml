id: 2CO.12.4
reference: 2 Corinthians 12:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι ἡρπάγη εἰς τὸν παράδεισον καὶ ἤκουσεν ἄρρητα ῥήματα ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: ru
  text: он был восхищен в рай и услышал неизреченные слова, которые человеку нельзя произносить.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: был восхищен
  rationale: Пассивная форма передает внезапное перемещение действием внешней силы; традиционное «восхищен» здесь остается понятным и уместным в возвышенном повествовании.
- source_word: παράδεισον
  choice: рай
  rationale: Прямое и естественное соответствие греческому слову, сохраняющее его религиозный смысл.
- source_word: ἄρρητα ῥήματα
  choice: неизреченные слова
  rationale: Сохраняет смысл слов, которые нельзя или невозможно высказать, не устраняя заложенную в выражении неоднозначность.
- source_word: οὐκ ἐξὸν
  choice: нельзя
  rationale: Передает отсутствие дозволения или допустимости без добавления явно названного запретителя.
- source_word: ἀνθρώπῳ
  choice: человеку
  rationale: Греческое существительное имеет обобщающий смысл; русское «человеку» естественно охватывает любого человека.
- source_word: λαλῆσαι
  choice: произносить
  rationale: В сочетании со «словами» выражает устное высказывание и сохраняет акцент на невозможности или недозволенности их озвучивать.
theological_decisions:
- issue: Причина, по которой слова нельзя произносить
  choice: Сохранено общее «нельзя произносить»
  alternative: «не позволено произносить» или «невозможно выразить»
  rationale: οὐκ ἐξὸν указывает на недозволенность или недопустимость, тогда как ἄρρητα может подразумевать невыразимость; перевод сохраняет напряжение и не уточняет источник ограничения.
- issue: Кто был восхищен
  choice: Сохранено местоимение «он» в соответствии с ближайшим контекстом
  alternative: Явно назвать Павла
  rationale: Греческий текст продолжает косвенное самоописание Павла и не называет его прямо; добавление имени сняло бы риторическую дистанцию.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Восхищен» и «неизреченные» сохраняют торжественность и точность, не создавая конфессионально специфического толкования.
