  source_fidelity: 'Текст точно передает ключевые элементы греческого оригинала: пассивное ἡρπάγη — «был восхищен», направление εἰς τὸν παράδεισον — «в рай», ἄρρητα ῥήματα — «неизреченные слова», и οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι — «которые человеку нельзя произносить». Сохранено намеренное смысловое напряжение между неизреченностью услышанного и его недозволенностью для произнесения.'
  naturalness: Фраза грамматически правильна, естественна для современного литературного русского и удерживает уместный для послания умеренно возвышенный регистр. «Был восхищен» — традиционное, но все еще понятное библейско-литературное выражение.
  terminology: «Рай» соответствует παράδεισος. «Неизреченные слова» адекватно передает ἄρρητα ῥήματα, не сводя его ни только к невозможности выразить, ни только к запрету. «Человеку нельзя» сохраняет обобщенное ἀνθρώπῳ и не называет источник ограничения, которого греческий текст не уточняет.
