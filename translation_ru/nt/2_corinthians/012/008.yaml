  text: ὑπὲρ τούτου τρὶς τὸν κύριον παρεκάλεσα ἵνα ἀποστῇ ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/008.yaml
  text: Concerning this[d][c][b][a], three times I pleaded with the Lord that it might depart from me.
translation:
  language: ru
  text: Об этом[a] я трижды умолял[b] Господа[c], чтобы это отступило от меня[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «По поводу этого»; возможно также: «Из-за этого».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «просил» или «настойчиво просил».'
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте сказано только «Господа»; Павел здесь прямо не называет Иисуса.
    reason: alternative_reading
  - marker: d
    text: 'Или: «чтобы оно отошло от меня» или «удалилось от меня». В греческом подлежащее не выражено и определяется по предыдущему стиху; речь может соотноситься с «жалом» или с «посланником сатаны».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ τούτου
  choice: Об этом
  rationale: ὑπέρ с родительным падежом здесь обозначает предмет просьбы. «Об этом» естественно связывает стих с упомянутым ранее страданием, не придавая обороту значения «в защиту этого».
- source_word: τρὶς
  choice: трижды
  rationale: Наречие означает три отдельных раза. «Трижды» ясно, уместно для литературного регистра и не воспринимается в современном русском как непонятный архаизм.
- source_word: τὸν κύριον
  choice: Господа
  rationale: κύριος передано традиционным и контекстуально уместным словом «Господь». Имя Иисуса не добавлено, поскольку в греческом тексте его здесь нет.
- source_word: παρεκάλεσα
  choice: умолял
  rationale: В контексте молитвенной просьбы παρακαλέω выражает настойчивое обращение. «Умолял» передаёт его напряжённость и естественно сочетается с дополнением «Господа».
- source_word: ἵνα
  choice: чтобы
  rationale: Союз вводит содержание и желаемый результат просьбы; «чтобы» является естественным русским соответствием.
- source_word: ἀποστῇ
  choice: это отступило
  rationale: Глагол означает удалиться, отойти, оставить. В греческом подлежащее не выражено; нейтральное «это» отсылает к описанному ранее мучению, а примечание сохраняет возможность соотнести глагол как с «жалом», так и с «посланником».
- source_word: ἀπ’ ἐμοῦ
  choice: от меня
  rationale: Оборот прямо выражает удаление от Павла; «от меня» кратко и естественно передаёт значение отделения.
theological_decisions:
- issue: Кого обозначает «Господь»
  choice: Сохранено только «Господа», без добавления имени Иисуса.
  alternative: Господа Иисуса
  rationale: В данном контексте Павел, вероятно, обращается к Иисусу, однако греческий текст содержит лишь κύριον. Перевод не делает подразумеваемый референт явным.
- issue: Подлежащее при ἀποστῇ
  choice: Использовано нейтральное указательное местоимение «это», а неоднозначность разъяснена в примечании.
  alternative: чтобы он отступил; чтобы жало отступило; чтобы посланник удалился
  rationale: Греческое подлежащее подразумевается из предыдущего стиха, где названы и «жало в плоть», и «посланник сатаны». Явное называние одного из них устранило бы смысловое напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов сохраняет акцент на причине обращения, а «трижды умолял» передаёт настойчивость без лишнего толкования.
