  text: παρεκάλεσα Τίτον καὶ συναπέστειλα τὸν ἀδελφόν· μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος; οὐ τῷ αὐτῷ πνεύματι περιεπατήσαμεν; οὐ τοῖς αὐτοῖς ἴχνεσιν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/018.yaml
  text: I urged Titus to go and sent the brother with him. Titus did not take advantage of you[a], did he? Did we not walk in the same spirit? Did we not walk in the same footsteps?
translation:
  language: ru
  text: Я попросил Тита и послал с ним брата. Разве Тит извлёк выгоду за ваш счёт? Разве мы не поступали в одном и том же духе? Разве не шли одними и теми же следами?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве мы не поступали одним и тем же Духом? Разве не шли одними и теми же следами?» Слово «дух» может означать общий настрой или образ действий, но возможно и указание на Святого Духа.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρεκάλεσα Τίτον
  choice: Я попросил Тита
  rationale: В контексте практического поручения παρακαλέω означает настойчивую просьбу или обращение. «Попросил» естественно по-русски и не добавляет отсутствующее в греческом «пойти».
- source_word: συναπέστειλα τὸν ἀδελφόν
  choice: вместе с ним послал брата
  rationale: Сложный глагол συναποστέλλω обозначает отправление кого-либо вместе с другим; русский оборот ясно передаёт эту связь. «Брата» сохраняет форму исходного текста без добавления притяжательного местоимения.
- source_word: μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος
  choice: Разве Тит чем-нибудь воспользовался вами?
  rationale: μήτι вводит вопрос, предполагающий отрицательный ответ. πλεονεκτέω означает извлекать выгоду за чужой счёт; «воспользовался вами» сохраняет широту выражения, а «чем-нибудь» естественно усиливает ожидаемое отрицание.
- source_word: τῷ αὐτῷ πνεύματι περιεπατήσαμεν
  choice: Не в одном ли духе мы поступали?
  rationale: «В одном духе» допускает понимание общей внутренней установки и не исключает возможной связи со Святым Духом. Для первого περιπατέω выбрано «поступали», чтобы фраза была естественной и чтобы не создавать в русском неясный образ буквального хождения духом.
- source_word: τοῖς αὐτοῖς ἴχνεσιν
  choice: по одним и тем же следам
  rationale: ἴχνος буквально означает след или отпечаток ноги и метафорически — образ поведения. Формулировка сохраняет исходный образ и естественно сочетается с глаголом движения, подразумеваемым из предыдущего вопроса.
theological_decisions:
- issue: Значение τῷ αὐτῷ πνεύματι
  choice: «в одном духе» — прежде всего единый настрой или образ действий
  alternative: «одним и тем же Духом» — указание на Святого Духа
  rationale: Ближайший контекст подчёркивает согласованность и бескорыстие Павла и Тита. Строчная буква и оборот «в одном духе» наиболее естественно передают общий настрой, при этом примечание сохраняет возможность отнесения к Святому Духу.
- issue: Соотношение двух риторических вопросов
  choice: сохранить параллелизм общего настроя и одинакового пути поведения
  alternative: понимать оба выражения исключительно как прямое утверждение водительства Святым Духом
  rationale: Греческий текст сополагает πνεῦμα и ἴχνη, не объясняя точную связь. Перевод сохраняет образную и богословскую напряжённость, не сводя её к одной доктринальной формуле.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Риторические вопросы сохраняют ожидаемый отрицательный ответ; метафора следов оставлена, а первое περιπατέω передано как «поступали» ради естественности.
