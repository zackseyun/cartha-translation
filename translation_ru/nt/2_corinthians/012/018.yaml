  to: Я попросил Тита и послал с ним брата. Разве Тит извлёк выгоду за ваш счёт? Разве мы не поступали в одном и том же духе? Разве не шли одними и теми же следами?[a]
  rationale: Исправление уточняет смысл πλεονεκτέω как извлечение выгоды за счёт других, передаёт αὐτῷ через «одном и том же» и устраняет из примечания добавленное значение водительства. Риторическая форма и образ одинаковых следов сохранены.
