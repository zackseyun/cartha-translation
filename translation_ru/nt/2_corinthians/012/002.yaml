reference: 2 Corinthians 12:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: ru
  text: 'Я знаю человека в Мессии[a]: четырнадцать лет назад — в теле ли, не знаю, вне ли тела, не знаю, Бог знает[b] — он был восхищён до третьего неба[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по традиционному переводу: «во Христе». Греческое ἐν Χριστῷ содержит титул «Мессия» («Помазанник»).'
    reason: alternative_reading
  - marker: b
    text: 'Павел не уточняет, произошло ли это в теле или вне тела: способ переживания остаётся намеренно неразрешённым.'
    reason: theological_tension
  - marker: c
    text: «Третье небо» — выражение из древних представлений о небесах. Перевод сохраняет его, не заменяя возможным толкованием «высшее небо» или «рай».
    reason: cultural_note
lexical_decisions:
- source_word: οἶδα
  choice: я знаю
  rationale: Форма οἶδα имеет в койне настоящее значение; «я знаю» прямо и естественно передаёт смысл.
- source_word: ἄνθρωπον
  choice: человека
  rationale: Русское «человека» точно передаёт конкретное лицо мужского пола, не вынуждая преждевременно отождествлять его с Павлом.
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Χριστός здесь сохраняет значение титула; «Мессия» передаёт его смысл, а конструкция «в Мессии» сохраняет характерный для Павла язык принадлежности и единения.
- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: четырнадцать лет назад
  rationale: Это естественное русское обозначение времени, соответствующее πρό с родительным падежом.
- source_word: εἴτε ἐν σώματι … εἴτε ἐκτὸς τοῦ σώματος
  choice: в теле ли … вне ли тела
  rationale: Параллельная конструкция сохраняет контраст и дважды выраженную Павлом неуверенность.
- source_word: ὁ θεὸς οἶδεν
  choice: Бог знает
  rationale: Прямой перевод без добавления слова «один», которого в греческом тексте нет.
- source_word: ἁρπαγέντα
  choice: был восхищен
  rationale: Библейски узнаваемый русский глагол передаёт пассивное перемещение вверх; контекст исключает современное значение эмоционального восторга.
- source_word: ἕως τρίτου οὐρανοῦ
  choice: до третьего неба
  rationale: «До» формально сохраняет значение ἕως и не заменяет древнее выражение толкованием.
theological_decisions:
- issue: Передача ἐν Χριστῷ
  choice: в Мессии
  alternative: во Христе
  rationale: Выбран смысловой перевод титула Χριστός; традиционный вариант указан в примечании, чтобы не скрывать привычную церковную формулировку.
- issue: Телесный или внетелесный характер переживания
  choice: сохранить двукратное «не знаю» и заключительное «Бог знает»
  alternative: истолковать событие как телесное вознесение либо как внетелесное видение
  rationale: Сам греческий текст намеренно оставляет способ переживания нерешённым.
- issue: «Третье небо»
  choice: сохранить древнее выражение без подмены толкованием
  alternative: перевести как «высшее небо» или «рай»
  rationale: В этом стихе прямо названо τρίτου οὐρανοῦ; отождествление с раем появляется в дальнейшем контексте, но не должно молча вводиться сюда.
translation_notes:
  register: Современный литературный русский с достоинством библейской прозы. Повтор «не знаю» сохранён ради риторической структуры и смыслового акцента оригинала; тире и точка с запятой делают длинную вставную конструкцию ясной для чтения.
