  source_fidelity: 'Основной смысл передан точно: риторический вопрос, сравнительное «по сравнению с остальными церквами», личное усиление «сам я», отказ быть бременем и ироническое «простите» соответствуют греческому тексту. Однако «разве» в сочетании «кроме разве того» добавляет разговорный риторический оттенок, не необходимый для εἰ μὴ ὅτι; его лучше убрать. «Не был вам в тягость» точнее передаёт завершённое действие аориста и является более естественным библейско-литературным русским оборотом.'
