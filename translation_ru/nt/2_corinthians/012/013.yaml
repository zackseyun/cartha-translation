source:
  edition: SBLGNT
  text: τί γάρ ἐστιν ὃ ⸀ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, εἰ μὴ ὅτι αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν; χαρίσασθέ μοι τὴν ἀδικίαν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: ru
  text: В чём же вы были обделены по сравнению с остальными церквами,[a] кроме того, что сам я не был вам в тягость?[b] Простите мне эту несправедливость![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были поставлены в худшее положение, чем остальные церкви». Греческий глагол может означать, что кого-либо ущемили или поставили в менее выгодное положение.'
    reason: lexical_alternative
  - marker: b
    text: То есть Павел не становился для коринфян материальным бременем и не принимал от них содержания.
    reason: cultural_note
  - marker: c
    text: 'Павел говорит иронически: мнимая «несправедливость» состояла в том, что он отказался быть для них обременением.'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἡσσώθητε
  choice: вы были обделены
  rationale: Пассивная форма указывает на то, что коринфяне якобы оказались в менее выгодном положении или с ними обошлись хуже. «Были обделены» естественно передаёт и сравнительный смысл, и иронию, не утверждая их внутреннюю неполноценность.
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
  choice: по сравнению с остальными церквами
  rationale: После глагола со сравнительным значением ὑπέρ выражает сопоставление; русский оборот прямо и естественно передаёт эту функцию.
- source_word: αὐτὸς ἐγώ
  choice: сам я
  rationale: Сочетание усилительного местоимения с явно выраженным ἐγώ подчёркивает личное действие Павла; инверсия сохраняет акцент и хорошо звучит по-русски.
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: не обременял вас
  rationale: В данном контексте καταναρκάω означает не становиться для общины материальным бременем. Краткая формулировка сохраняет образ и не вводит пояснение непосредственно в текст.
- source_word: χαρίσασθέ μοι
  choice: простите мне
  rationale: В ироническом заключительном призыве χαρίζομαι имеет смысл прощения; русский оборот сохраняет риторическую остроту.
- source_word: τὴν ἀδικίαν ταύτην
  choice: эту несправедливость
  rationale: ἀδικία буквально обозначает неправду или несправедливость. Здесь слово иронически называет отказ Павла обременять коринфян его мнимой несправедливостью по отношению к ним.
- source_word: τί γάρ ἐστιν ὃ
  choice: в чём же
  rationale: Так естественно по-русски вводится риторический вопрос о том, в каком отношении коринфяне были обделены; частица «же» передаёт аргументативную связь γάρ с предшествующей мыслью.
- source_word: εἰ μὴ ὅτι
  choice: кроме разве того, что
  rationale: Оборот вводит единственное и явно ироническое исключение; «разве» передаёт риторический оттенок, не добавляя нового содержания.
theological_decisions:
- issue: Ироническая самозащита Павла в вопросе материальной поддержки
  choice: Сохранить прямую форму высказывания и передать иронию сочетанием «Простите мне эту несправедливость», не усиливая её вставными оценками.
  alternative: 'Явно обозначить сарказм в основном тексте, например: «Простите мне этот ужасный проступок».'
  rationale: Ирония возникает из контраста между отказом Павла обременять общину и названием этого поступка «несправедливостью». Добавочное оценочное слово вышло бы за пределы греческого текста.
translation_notes:
  register: Современный литературный русский язык; риторический вопрос и заключительная ирония сохранены. Формулировки понятны широкому читателю, но остаются достойными по тону. «Церкви» передаёт ἐκκλησίαι как местные общины без конфессионального уточнения.
