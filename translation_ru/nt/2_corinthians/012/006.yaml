  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: ru
  text: Ведь если я захочу хвалиться, то не буду неразумен, потому что скажу правду. Но я воздерживаюсь, чтобы никто не счёл меня выше того, что видит во мне или слышит от меня[a].
  philosophy: optimal-equivalence
  footnotes:
