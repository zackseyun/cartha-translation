  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: ru
  text: Я стал глупцом — вы меня к этому вынудили. Ведь вам следовало бы говорить в мою пользу, ибо я ни в чём не уступил этим сверхапостолам[a], хотя сам я ничто.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «превосходнейшим апостолам». Выражение в греческом тексте имеет особенно сильную усилительную окраску и в данном контексте может быть ироническим.'
    reason: alternative_reading
lexical_decisions:
- source_word: Γέγονα ἄφρων
  choice: Я стал безумцем
  rationale: Перфект Γέγονα обозначает возникшее состояние; «стал» естественно передаёт результат, сохраняющийся в момент речи. Существительное «безумец» отражает субстантивированное ἄφρων и ироническую самооценку Павла.
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: вы меня к этому вынудили
  rationale: Сохраняется подчёркнутое ὑμεῖς («вы»), а «к этому» естественно указывает на безумную похвальбу из ближайшего контекста.
- source_word: ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι
  choice: Ведь вам следовало бы говорить в мою пользу
  rationale: Пассивная конструкция с указанием деятеля передана естественной русской активной конструкцией. «Говорить в мою пользу» выражает контекстуальный смысл συνίστημι — рекомендовать, одобрительно представлять, свидетельствовать в чью-либо пользу — без сведения его просто к похвале.
- source_word: οὐδὲν γὰρ ὑστέρησα
  choice: потому что я ни в чём не уступил
  rationale: ὑστερέω здесь имеет сравнительное значение «быть позади, уступать». Второе γάρ передано причинным союзом, связывающим утверждение с тем, почему коринфянам следовало выступить в пользу Павла.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: этим сверхапостолам
  rationale: «Сверхапостолы» сохраняет резкую гиперболу ὑπερλίαν и допускает контекстуальную иронию, не добавляя в основной текст толкования «так называемые».
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: хотя сам я ничто
  rationale: Конструкция εἰ καί имеет уступительное значение. «Хотя» естественно передаёт его по-русски, а «сам» подчёркивает парадокс между отсутствием уступки оппонентам и признанием собственного ничтожества.
theological_decisions:
- issue: Кого обозначает выражение τῶν ὑπερλίαν ἀποστόλων и иронично ли оно
  choice: «сверхапостолам»; ироническая или полемическая окраска не разъясняется в основном тексте
  alternative: «превосходнейшим апостолам» как возможное неироническое обозначение наиболее выдающихся апостолов
  rationale: Контекст 2 Коринфянам делает иронию весьма вероятной, однако сама фраза формально может быть понята как усиленная превосходная характеристика. Основной перевод сохраняет риторическую напряжённость, а сноска отмечает альтернативу.
- issue: Соотношение утверждений «ни в чём не уступил» и «я ничто»
  choice: Сохранить оба утверждения без богословского сглаживания
  alternative: Перефразировать последнее как выражение лишь личной скромности или как условное допущение
  rationale: Греческий текст намеренно ставит рядом апостольское притязание и самоумаление. Перевод сохраняет этот парадокс.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясной риторической энергией. Разговорное по оттенку «к этому вынудили» естественно связывает фразу с предшествующей похвальбой; «говорить в мою пользу» избегает архаизма и точно передаёт коммуникативную функцию συνίστημι. Маркер сноски помещён непосредственно после спорного выражения.
