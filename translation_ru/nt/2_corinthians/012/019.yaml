  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: ru
  text: Неужели вы всё это время думаете, что мы оправдываемся перед вами? Мы говорим перед Богом, в Мессии[a]. И всё, возлюбленные, — для вашего созидания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во Христе».'
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλαι
  choice: всё это время
  rationale: Передаёт продолжающееся до настоящего момента предположение адресатов и естественно сочетается с риторическим вопросом.
- source_word: δοκεῖτε
  choice: думаете
  rationale: Настоящее время сохранено; длительность мысли уже выражена словами «всё это время».
- source_word: ἀπολογούμεθα
  choice: оправдываемся
  rationale: Русский глагол естественно передаёт самозащиту или попытку обосновать собственную правоту перед адресатами.
- source_word: κατέναντι θεοῦ
  choice: перед Богом
  rationale: Сохраняет смысл речи в Божьем присутствии и под Божьим взглядом, а также торжественность выражения.
- source_word: ἐν Χριστῷ
  choice: во Христе
  rationale: Устойчиво и точно передаёт сферу единения со Христом, не уточняя сверх текста характер этой связи.
- source_word: λαλοῦμεν
  choice: мы говорим
  rationale: Прямо передаёт настоящее время и хорошо звучит в современном литературном русском языке.
- source_word: τὰ δὲ πάντα
  choice: И всё
  rationale: «Всё» естественно охватывает все слова и действия Павла в данном контексте; δέ имеет здесь мягкую связующую силу.
- source_word: ἀγαπητοί
  choice: возлюбленные
  rationale: Сохраняет сердечное обращение и его связь с языком любви, оставаясь уместным в достоинственном библейском регистре.
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: для вашего назидания
  rationale: Передаёт метафорическое созидание общины и её духовное укрепление; «назидание» понятно в данном библейском контексте и не требует развёрнутой перифразы.
theological_decisions:
- issue: Значение выражения ἐν Χριστῷ
  choice: во Христе
  alternative: в Мессии
  rationale: В русском языке «Христос» является традиционным и прозрачным соответствием греческому титулу Χριστός. Формулировка сохраняет богословски значимую связь речи Павла со Христом, не сводя её только к полномочию, примеру или мистическому единению.
- issue: Цель всех слов и действий Павла
  choice: для вашего назидания
  alternative: для вашего укрепления
  rationale: οἰκοδομή сохраняет образ созидания и может включать духовное укрепление, но текст не уточняет единственный механизм или аспект этого созидания.
translation_notes:
  register: Современный литературный русский с достоинственным библейским звучанием. Риторический вопрос передан без архаизмов; короткие последующие предложения сохраняют напор оригинала. Порядок «перед Богом во Христе» оставляет оба обстоятельства рядом и не вводит отсутствующей в греческом тексте причинной или инструментальной связи.
