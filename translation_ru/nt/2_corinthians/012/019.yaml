  to: Неужели вы всё это время думаете, что мы оправдываемся перед вами? Мы говорим перед Богом, в Мессии[a]. И всё, возлюбленные, — для вашего созидания.
  rationale: Исправлен перевод титула Χριστός на «Мессия» в соответствии с политикой проекта; традиционный вариант дан в сноске. «Назидание» заменено на «созидание», чтобы сохранить метафору οἰκοδομή без конфессионально окрашенного сужения смысла. Остальная синтаксическая и смысловая структура исходного текста сохранена.
