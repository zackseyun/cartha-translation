  verdict: revise
  source_fidelity: Греческое «Πάλαι δοκεῖτε ὅτι…» точно передано как продолжающееся до настоящего предположение адресатов. «Оправдываемся перед вами», «перед Богом» и «для вашего созидания» сохраняют соответственно оттенок самозащиты, подотчётность Богу и метафору οἰκοδομή. Для Χριστῷ как титула следует последовательно использовать «Мессия» согласно принятой политике проекта.
  naturalness: «Всё это время думаете» и «Мы говорим перед Богом, в Мессии» звучат естественно в современном литературном русском при сохранении возвышенного библейского регистра. «Созидание» сохраняет образ оригинала и менее жаргонно, чем «назидание».
  terminology: «Во Христе» в исходном варианте не соответствует заявленной проектной политике перевода титула Χριστός как «Мессия». Добавлена сноска с традиционным вариантом «во Христе», отражающая английский аудит. «Возлюбленные» уместно для ἀγαπητοί.
