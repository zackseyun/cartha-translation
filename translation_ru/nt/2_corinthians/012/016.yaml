base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/016.yaml
  text: 'But let it be so: I did not burden you[a]. Yet, being crafty[c][b], I took you by deceit.'
translation:
  language: ru
  text: 'Пусть так: я не обременял вас[a]. Но, будучи хитрецом[b], я поймал вас обманом[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Допустим»; «Как бы то ни было». Павел, по-видимому, временно допускает этот довод ради рассуждения.'
    reason: lexical_alternative
  - marker: b
    text: Слова «будучи хитрецом, я поймал вас обманом», вероятно, иронически повторяют обвинение против Павла, а не являются его признанием в обмане.
    reason: alternative_reading
  - marker: c
    text: 'Или: «я поймал вас хитростью»; «я обманом воспользовался вами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω δέ
  choice: Пусть так
  rationale: 'Краткая естественная формула риторической уступки: Павел условно принимает высказанное положение ради дальнейшего рассуждения.'
- source_word: κατεβάρησα
  choice: обременял
  rationale: Глагол сохраняет образ бремени и в данном контексте допускает подразумеваемую материальную или финансовую нагрузку, не сужая её прямо в тексте.
- source_word: ὑπάρχων
  choice: будучи
  rationale: Причастная конструкция передана без уточнения причинного или уступительного оттенка, чтобы сохранить неоднозначность греческого оборота.
- source_word: πανοῦργος
  choice: хитрым
  rationale: Слово выражает приписываемую Павлу недобросовестную изворотливость; «хитрым» естественно по-русски и соответствует обвинительному тону.
- source_word: δόλῳ
  choice: обманом
  rationale: Творительный падеж естественно передаёт инструментальное значение дательного и сохраняет отрицательный смысл уловки или обмана.
- source_word: ἔλαβον
  choice: взял вас
  rationale: Буквальная основа λαμβάνω сохранена, а необычное по-русски сочетание намеренно удерживает напряжённость образа; более истолковывающие варианты приведены в примечании.
theological_decisions:
- issue: Является ли фраза после ἀλλὰ признанием Павла или ироническим повторением обвинения против него
  choice: 'Основной текст передаёт фразу прямо: «Но, будучи хитрым, я взял вас обманом».'
  alternative: «Но я, хитрец, поймал вас уловкой» или истолковывающий вариант «Но я хитростью воспользовался вами».
  rationale: Контекст указывает на ироническое воспроизведение обвинения, поскольку Павел отрицает, что использовал коринфян. Однако явное добавление указателя на иронию в основной текст сняло бы риторическое напряжение, поэтому пояснение дано в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и риторически напряжённым построением. Сохранены уступительный переход, причастный оборот и намеренно резкая формулировка предполагаемого обвинения; финансовый оттенок «обременял» оставлен контексту.
