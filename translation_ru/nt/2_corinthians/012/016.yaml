  source_fidelity: Уступительное «Пусть так» хорошо передаёт ἔστω δέ, а «не обременял вас» уместно сохраняет общий образ материального бремени в контексте. Однако «я взял вас обманом» не является естественным современным русским соответствием ἔλαβον ... δόλῳ и неясно передаёт образ захвата/уловления посредством уловки. «Я поймал вас обманом» передаёт риторически резкое обвинение более внятно, не превращая его в истолковывающее «воспользовался вами».
  naturalness: «Взял вас обманом» в современном литературном русском звучит неидиоматично и может быть понято как похищение. «Поймал вас обманом» естественно в контексте полемической, иронически воспроизводимой претензии. «Будучи хитрецом» несколько живее и определённее, чем «будучи хитрым», при этом сохраняет отрицательную окраску πανοῦργος.
  terminology: Специальных богословских терминов в стихе нет. «Обременял» и «обманом» точны по смыслу. Примечание об ироническом характере слов после ἀλλὰ необходимо и сохраняет неоднозначность основного текста.
