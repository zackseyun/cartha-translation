base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/012.yaml
  text: Indeed[a], the signs of an apostle were performed among you with all perseverance[b], with signs and wonders and powers.
translation:
  language: ru
  text: Поистине, признаки апостола были совершены среди вас со всей стойкостью — знамениями, чудесами и проявлениями силы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Проявления силы» можно также перевести как «могущественные дела» или «чудеса»; греческое слово подчёркивает проявление силы.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μὲν σημεῖα
  choice: Признаки… были явлены
  rationale: μέν придаёт утверждению усилительный оттенок, естественно передаваемый в русском самой уверенной конструкцией; отдельное «поистине» здесь звучало бы тяжеловесно. σημεῖα в первом употреблении обозначает удостоверяющие признаки, а не только чудеса.
- source_word: τοῦ ἀποστόλου
  choice: апостола
  rationale: Русский родительный допускает как качественно-родовой смысл («признаки, свойственные апостолу»), так и отнесение к конкретному апостолу, сохраняя неоднозначность греческого выражения.
- source_word: κατειργάσθη
  choice: были явлены
  rationale: Пассивная форма сохраняется; «были явлены» естественно говорит о признаках, обнаружившихся в служении, не уточняя действующее лицо сверх текста.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: Передаёт происходившее в коринфской общине, а не внутреннее действие в отдельных людях.
- source_word: ἐν πάσῃ ὑπομονῇ
  choice: со всей стойкостью
  rationale: ὑπομονή означает стойкое терпение и выдержку в трудностях; «стойкость» современно и уместно в контексте апостольского служения.
- source_word: σημείοις τε καὶ τέρασιν καὶ δυνάμεσιν
  choice: в знамениях, чудесах и деяниях силы
  rationale: Сохранена трёхчленная формула и различие между σημεῖα, τέρατα и δυνάμεις; последнее передано как могущественные действия, а не слито с общим понятием чудес.
theological_decisions:
- issue: Объём выражения «признаки апостола»
  choice: 'Не сводить признаки исключительно к чудесам: стойкость названа обстоятельством их проявления, а знамения, чудеса и деяния силы — их конкретным выражением.'
  alternative: Понимать только чудеса как исчерпывающие признаки апостольства.
  rationale: Синтаксис допускает связь общего утверждения и последующей чудесной триады, но не требует догматического вывода об исчерпывающем перечне апостольских удостоверений.
- issue: Общее или конкретное значение τοῦ ἀποστόλου
  choice: Русское «апостола» оставляет открытым как родовой смысл, так и возможное указание Павла на самого себя.
  alternative: Явно перевести «одного из апостолов» либо «этого апостола».
  rationale: Греческий артикль не следует механически превращать в русское указательное или неопределённое выражение; контекст допускает обе смысловые стороны.
translation_notes:
  register: Современный литературный русский, с достоинством и без архаической тяжеловесности. Тире помогает показать, что заключительная триада раскрывает проявление апостольских признаков. Маркер сноски поставлен непосредственно после выражения, к которому относится.
