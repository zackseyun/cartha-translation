id: 2CO.12.20
reference: 2 Corinthians 12:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: ru
  text: Ведь я боюсь, что, придя, найду вас не такими, какими хотел бы, и вы найдёте меня не таким, каким хотели бы; боюсь, как бы не оказалось среди вас раздоров, ревности, вспышек гнева, своекорыстного соперничества, злословия, пересудов[a], самомнения и беспорядков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сплетен».'
    reason: 'Лексическая альтернатива для ψιθυρισμοί: слово может обозначать тайные пересуды, нашёптывания или сплетни.'
lexical_decisions:
- source_word: φοβοῦμαι
  choice: я боюсь
  rationale: Настоящее время передаёт продолжающееся опасение Павла; прямое и естественное русское соответствие.
- source_word: μή πως
  choice: что…; боюсь, как бы не
  rationale: Первое употребление вводит опасение через «что», а повторное естественно передаётся конструкцией «как бы не», сохраняющей значение нежелательной возможности.
- source_word: ἐλθὼν
  choice: придя
  rationale: Аористное причастие имеет временное значение и естественно передаёт действие, предшествующее тому, что Павел может обнаружить.
- source_word: οὐχ οἵους θέλω
  choice: не такими, какими хотел бы
  rationale: Передаёт желаемое Павлом состояние коринфян, не уточняя его сверх текста.
- source_word: εὕρω ὑμᾶς
  choice: найду вас
  rationale: Сохраняет образ обнаружения их действительного состояния в предполагаемой ситуации.
- source_word: κἀγὼ εὑρεθῶ ὑμῖν
  choice: и вы найдёте меня
  rationale: 'Активная русская конструкция естественнее буквального пассива и сохраняет взаимную структуру: Павел найдёт их, а они — его.'
- source_word: οἷον οὐ θέλετε
  choice: не таким, каким хотели бы
  rationale: Зеркально соответствует предыдущему обороту и сохраняет взаимное недовольство без пояснения его причины.
- source_word: ἔρις
  choice: раздоры
  rationale: В контексте перечня пороков обозначает конфликты и распри внутри общины.
- source_word: ζῆλος
  choice: ревность
  rationale: Здесь слово имеет отрицательный смысл завистливой или соперничающей ревности, а не похвального рвения.
- source_word: θυμοί
  choice: вспышки гнева
  rationale: Множественное число указывает на повторяющиеся бурные проявления гнева.
- source_word: ἐριθεῖαι
  choice: своекорыстное соперничество
  rationale: Передаёт сочетание партийной борьбы и стремления к личной выгоде или возвышению.
- source_word: καταλαλιαί
  choice: злословие
  rationale: Обозначает порочащую речь против других; русское слово ясно и уместно для литературного регистра.
- source_word: ψιθυρισμοί
  choice: пересуды
  rationale: Передаёт неодобрительные разговоры за спиной, шёпотом распространяемые слухи или сплетни.
- source_word: φυσιώσεις
  choice: самомнение
  rationale: Образ «надменности, раздутости» естественно выражен как завышенное мнение о себе.
- source_word: ἀκαταστασίαι
  choice: беспорядки
  rationale: Сохраняет широкий смысл неустроенности, смуты и нарушения порядка, не сужая его до конкретного вида мятежа.
theological_decisions:
- issue: Характер ожидаемой взаимной неудовлетворённости
  choice: 'Сохранено общее указание: Павел может найти коринфян не такими, какими желает, а они — его не таким, каким желают.'
  alternative: Уточнить, что коринфяне увидят сурового Павла, применяющего апостольскую власть.
  rationale: Хотя контекст допускает ожидание строгости, сам стих прямо этого не формулирует; перевод не должен устранять заложенную в тексте недосказанность.
- issue: Причина перечисленных пороков
  choice: Пороки представлены как возможное состояние общины без указания их доктринальной причины.
  alternative: Связать их непосредственно с влиянием лжеучителей или противников Павла.
  rationale: Такая контекстуальная связь возможна, но в данном стихе не названа и потому не внесена в перевод.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского увещевания. Симметрия двух частей сохранена, но греческий пассив во второй части преобразован в естественную русскую активную конструкцию. Перечень оформлен ясными современными существительными и словосочетаниями.
