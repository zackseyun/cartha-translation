source:
  edition: SBLGNT
  text: καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. ⸀διὸ ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος ⸀Σατανᾶ, ἵνα με κολαφίζῃ, ⸂ἵνα μὴ ὑπεραίρωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/007.yaml
  text: And because of the surpassing greatness of the revelations—so that I might not exalt myself—a thorn in the flesh was given to me[a], a messenger of Satan, so that it might torment me[e][d][c][b], so that I might not exalt myself.
translation:
  language: ru
  text: И из-за необычайного величия откровений — чтобы я не превозносился — мне дано было жало в плоть[a], посланник Сатаны[b], чтобы он бил меня[c], чтобы я не превозносился[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «острый кол в плоть» либо «заноза в плоти». Греческое σκόλοψ обозначает острый кол, шип или занозу; точный образ неясен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ангел Сатаны». Греческое ἄγγελος может означать как посланника, так и ангела.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «чтобы он мучил меня»; буквально глагол передаёт нанесение ударов.'
    reason: lexical_alternative
  - marker: d
    text: Слова «чтобы я не превозносился» дважды присутствуют в греческом тексте, поэтому повтор сохранён.
    reason: textual_transparency
lexical_decisions:
- source_word: τῇ ὑπερβολῇ τῶν ἀποκαλύψεων
  choice: из-за необычайного величия откровений
  rationale: Передаёт исключительную значимость и масштаб откровений, сохраняя причинную связь с последующим высказыванием.
- source_word: ὑπεραίρωμαι
  choice: я не превозносился
  rationale: Сохраняет значение самовозвышения и намеренно воспроизводит повтор греческого текста.
- source_word: ἐδόθη μοι
  choice: мне дано было
  rationale: Сохраняет страдательный залог и не называет прямо того, кто дал или допустил это.
- source_word: σκόλοψ τῇ σαρκί
  choice: жало в плоть
  rationale: «Жало» сохраняет образ острого причиняющего боль предмета, а «в плоть» передаёт необычную, но выразительную конструкцию оригинала, не определяя природу страдания.
- source_word: ἄγγελος Σατανᾶ
  choice: посланник сатаны
  rationale: «Посланник» сохраняет широту значения ἄγγελος и не решает, идёт ли речь об ангеле, ином духовном существе или действующем орудии.
- source_word: κολαφίζῃ
  choice: бил меня
  rationale: Передаёт конкретный образ ударов, заложенный в глаголе, лучше сохраняя метафорическую силу оригинала, чем более общее «мучил».
theological_decisions:
- issue: Природа «жала в плоть»
  choice: Сохранить метафору без уточнения вида страдания.
  alternative: Телесная болезнь, преследования, духовное нападение или иное бедствие.
  rationale: Текст не определяет природу жала, поэтому перевод не сужает возможные толкования.
- issue: Кто дал жало
  choice: Сохранить безличную страдательную конструкцию «мне дано было».
  alternative: «Бог дал мне» или «это было допущено».
  rationale: В греческом тексте действующее лицо прямо не названо; перевод сохраняет напряжение между неявным высшим допущением и названным сатанинским посредником.
- issue: Кто такой ἄγγελος Σατανᾶ
  choice: «посланник сатаны».
  alternative: «ангел сатаны».
  rationale: Так сохраняется лексическая неоднозначность ἄγγελος без определения онтологической природы посланника.
- issue: Двойное ἵνα μὴ ὑπεραίρωμαι
  choice: Сохранить обе формулировки «чтобы я не превозносился».
  alternative: Опустить один повтор как стилистически избыточный.
  rationale: Повтор присутствует в принятом греческом тексте и подчёркивает цель данного Павлу страдания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Инверсия «мне дано было» и выражение «жало в плоть» сохраняют образность и структуру оригинала, а тире помогает ясно оформить вставную целевую фразу.
