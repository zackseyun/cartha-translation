source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ὁ τὸ πολὺ οὐκ ἐπλεόνασεν, καὶ ὁ τὸ ὀλίγον οὐκ ἠλαττόνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/015.yaml
  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: ru
  text: 'как написано: «У кого было много, не оказалось излишка, и у кого было мало, не оказалось недостатка».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с учётом формулировки Исхода 16:18: «У того, кто собрал много, не осталось излишка, и у того, кто собрал мало, не было недостатка». В греческой цитате Павла глагол «собрал» не выражен.'
    reason: Уточняет связь с Исходом 16:18, не внося глагол «собрал» в основной перевод греческого текста Павла.
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: как написано
  rationale: Устойчивое вводное выражение для цитаты из Писания; русское настоящее состояние «написано» естественно передаёт сохраняющую силу греческого перфекта.
- source_word: Ὁ τὸ πολὺ
  choice: у того, кто собрал много
  rationale: Хотя в цитате Павла глагол «собрал» не выражен, эллиптическая конструкция восходит к Исходу 16:18 и естественно восполняется из цитируемого контекста; это также позволяет избежать неясного «у того, у кого было много».
- source_word: ἐπλεόνασεν
  choice: не было излишка
  rationale: Передаёт значение отсутствия избытка и соответствует формулировке Исхода 16:18, сохраняя контраст с «недостатком».
- source_word: ὁ τὸ ὀλίγον
  choice: у того, кто собрал мало
  rationale: Параллельно первой части; восполнение «собрал» ясно связывает цитату со сбором манны, не меняя её применения Павлом.
- source_word: ἠλαττόνησεν
  choice: не было недостатка
  rationale: Естественно передаёт отсутствие нехватки или недостачи и образует точную смысловую антитезу к «излишку».
theological_decisions:
- issue: Применение цитаты из Исхода 16:18 к материальному равенству и взаимному обеспечению
  choice: Сохранить конкретную образность исходного эпизода о сборе манны, не добавляя прямого толкования о перераспределении.
  alternative: «У того, кто имел много, не было слишком много, и у того, кто имел мало, не было слишком мало».
  rationale: Форма цитаты с восполненным из контекста глаголом «собрал» хорошо укореняет слова Павла в Исходе, тогда как выражения «излишок» и «недостаток» сохраняют возможность его непосредственного применения к обеспечению нужд верующих.
translation_notes:
  register: Современный литературный русский язык; формулировка dignified и ясная. Парные существительные «излишек / недостаток» сохраняют риторический баланс оригинала. Кавычки обозначают прямую цитату из Писания.
