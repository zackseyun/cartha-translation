  text: οὐ μόνον δὲ ἀλλὰ καὶ χειροτονηθεὶς ὑπὸ τῶν ἐκκλησιῶν συνέκδημος ἡμῶν ⸀σὺν τῇ χάριτι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν πρὸς τὴν ⸀αὐτοῦ τοῦ κυρίου δόξαν καὶ προθυμίαν ἡμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/019.yaml
  text: And not only that[d][c][b][a], but he was also appointed by the churches as our traveling companion with this gracious gift that is being administered by us for the glory of the Lord himself and our eagerness—
translation:
  language: ru
  text: И не только это, но и церкви избрали[a] его нашим спутником в пути с этим благодатным даром[b], служение с которым совершаем мы, — во славу Самого Господа[c] и для проявления нашей готовности[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «назначили». Греческое слово не требует понимать это действие как голосование в современном смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с этой благодатью». В контексте сбора пожертвований слово «благодать» может обозначать также благодатный дар.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «во славу его Господа» или «ради славы Господа». Греческое выражение допускает разные синтаксические толкования.'
    reason: alternative_reading
  - marker: d
    text: 'Буквально: «к славе Самого Господа и нашей готовности».'
    reason: literal_rendering
lexical_decisions:
- source_word: χειροτονηθεὶς
  choice: избрали
  rationale: Форма указывает на назначение или избрание общинами. «Избрали» естественно передаёт участие церквей, не уточняя процедуру голосования.
- source_word: ἐκκλησιῶν
  choice: церкви
  rationale: В данном контексте речь идёт о христианских общинах; «церкви» — обычный и точный русский эквивалент.
- source_word: συνέκδημος
  choice: сопровождать нас в пути
  rationale: Передаёт роль совместно путешествующего спутника естественным современным русским выражением.
- source_word: χάριτι
  choice: благодатный дар
  rationale: В контексте сбора пожертвований χάρις обозначает конкретный дар, одновременно сохраняя оттенок благодати и щедрости.
- source_word: διακονουμένῃ
  choice: служение которым мы совершаем
  rationale: Причастие описывает ответственное осуществление служения, связанного со сбором и доставкой дара; формулировка сохраняет служебный оттенок διακονέω.
- source_word: πρὸς
  choice: во славу… и чтобы проявить
  rationale: Предлог выражает направленность или цель. Развёрнутая русская конструкция естественно связывает обе однородные цели.
- source_word: αὐτοῦ τοῦ κυρίου
  choice: Самого Господа
  rationale: Αὐτοῦ понято как усиление при τοῦ κυρίου; прописная буква соответствует русской библейской традиции.
- source_word: δόξαν
  choice: славу
  rationale: Стандартный и богословски содержательный эквивалент δόξα.
- source_word: προθυμίαν
  choice: усердие
  rationale: Передаёт добровольную готовность и ревностное желание действовать, не добавляя конкретного объекта помощи.
theological_decisions:
- issue: Значение αὐτοῦ в выражении πρὸς τὴν αὐτοῦ τοῦ κυρίου δόξαν
  choice: «во славу Самого Господа», где αὐτοῦ имеет усилительное значение
  alternative: «во славу его Господа» или «ради славы Господа»
  rationale: Сжатая греческая конструкция допускает разные разборы. Основной текст передаёт вероятное усиление, а примечание сохраняет подлинную синтаксическую неоднозначность.
- issue: Связь προθυμίαν ἡμῶν с πρὸς
  choice: «чтобы проявить наше усердие» как вторая цель служения
  alternative: «ради… нашего усердия» или «и нашу готовность»
  rationale: Греческий предлог вводит два однородных элемента; русская глагольная конструкция делает эту связь ясной без уточнения, к чему именно относится усердие.
translation_notes:
  register: 'Современный литературный русский язык с достойным библейским звучанием. Синтаксис перестроен ради ясности: пассивное греческое причастие передано активной конструкцией, а две цели при πρὸς — естественными русскими оборотами. Финальное тире сохранено, поскольку предложение продолжается в следующем стихе.'
