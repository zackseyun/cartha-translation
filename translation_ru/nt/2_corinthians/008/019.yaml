  source_fidelity: 'Начальный союзный оборот должен передавать противопоставительно-добавочную конструкцию οὐ μόνον δὲ ἀλλὰ καί: «И не только это, но и…». χειροτονηθείς точнее передать как избрание/назначение его «нашим спутником в пути», а не как избрание с инфинитивом «сопровождать». διακονουμένῃ относится к дару и означает, что им ведают/который осуществляется в служении; исходное «служение которым мы совершаем» синтаксически и семантически неудачно. Целевые дополнения при πρός естественно переданы как «во славу… и для проявления нашей готовности».'
  naturalness: Предлагаемая редакция сохраняет современный литературный и сдержанно библейский регистр. Она устраняет неестественное двоеточие после «не только это», тяжёлое «служение которым мы совершаем» и несколько неточную глагольную конструкцию «избрали его сопровождать нас».
  terminology: «Церкви», «благодатный дар», «Господь» и «слава» уместны. Для προθυμία предпочтительна «готовность», поскольку «усердие» может означать главным образом прилежание, тогда как греческое слово обозначает охотную готовность. Неоднозначность αὐτοῦ при τοῦ κυρίου сохранена в сноске.
