base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: ru
  text: В настоящее время ваш избыток служит восполнению их нужды, чтобы и их избыток послужил восполнению вашей нужды, чтобы было равенство.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость», «равновесие». Здесь греческое слово означает соразмерное взаимное восполнение нужд, а не обязательно одинаковое имущество у всех.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: Сейчас
  rationale: Передаёт нынешнее время и сложившиеся обстоятельства естественным современным русским выражением.
- source_word: τὸ ὑμῶν περίσσευμα
  choice: ваш избыток
  rationale: περίσσευμα обозначает то, что имеется сверх нужды; «избыток» сохраняет материальный смысл контекста, не ограничивая его только деньгами.
- source_word: εἰς τὸ ἐκείνων ὑστέρημα
  choice: восполняет их недостаток
  rationale: Конструкция εἰς с винительным указывает на направленность избытка к покрытию нехватки; глагольная передача естественна по-русски.
- source_word: ἵνα καὶ
  choice: чтобы и
  rationale: Сохраняет целевое значение ἵνα и взаимность, выраженную καί.
- source_word: τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα
  choice: их избыток восполнил ваш недостаток
  rationale: Зеркальная формулировка передаёт взаимность исходного текста; форма «восполнил» в придаточном цели соответствует значению сослагательности.
- source_word: ὅπως γένηται ἰσότης
  choice: так будет равенство
  rationale: ἰσότης прямо означает равенство или справедливое равновесие; формулировка сохраняет итоговую направленность мысли Павла.
theological_decisions:
- issue: Значение ἰσότης в призыве Павла к пожертвованию
  choice: равенство во взаимном восполнении нужд
  alternative: справедливость; равновесие
  rationale: Контекст говорит о взаимном покрытии недостатка из имеющегося избытка, а не обязательно об одинаковом количестве имущества у всех. Основной текст сохраняет прямой эквивалент «равенство», а сноска поясняет контекстуальный оттенок.
translation_notes:
  register: Современный литературный русский язык; краткая зеркальная конструкция сохраняет риторическую взаимность греческого текста. «Избыток» и «недостаток» намеренно повторены, чтобы воспроизвести параллелизм оригинала.
