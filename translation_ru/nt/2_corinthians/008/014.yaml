  rationale: Заменены разговорное «сейчас» и результативное «так будет» на литературную конструкцию, которая сохраняет временную рамку и две цели, выраженные ἵνα и ὅπως. Повтор «избыток / нужда» поддерживает параллелизм оригинала, а «послужил восполнению» естественно передаёт направленность взаимного обеспечения.
