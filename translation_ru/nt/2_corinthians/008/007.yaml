source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ ἐν παντὶ περισσεύετε, πίστει καὶ λόγῳ καὶ γνώσει καὶ πάσῃ σπουδῇ καὶ τῇ ἐξ ⸂ἡμῶν ἐν ὑμῖν⸃ ἀγάπῃ, ἵνα καὶ ἐν ταύτῃ τῇ χάριτι περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: ru
  text: Но, как вы изобилуете во всём — верой, словом, знанием, всяким усердием и нашей любовью, пребывающей в вас,[a] — так изобилуйте и в этой благодати.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «вашей любовью к нам». Греческое выражение трудно для истолкования; в некоторых рукописях стоит чтение, означающее «вашей любовью, пребывающей в нас».'
    reason: alternative_reading
  - marker: b
    text: То есть благодатным делом пожертвования.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: изобилуете / изобилуйте
  rationale: Повтор одного корня сохраняет обрамление стиха и образ полноты, относящийся как к уже имеющимся качествам коринфян, так и к их участию в сборе.
- source_word: ἐν παντί
  choice: во всём
  rationale: Передаёт широкий охват выражения и естественно вводит последующий перечень.
- source_word: πίστει
  choice: верой
  rationale: Обычное и контекстуально уместное значение πίστις в перечне христианских качеств.
- source_word: λόγῳ
  choice: словом
  rationale: Сохраняет широкое значение λόγος, вероятно относящееся здесь к способности выражать или возвещать истину, без излишнего уточнения.
- source_word: γνώσει
  choice: знанием
  rationale: Прямой и естественный эквивалент в данном перечне даров и качеств.
- source_word: πάσῃ σπουδῇ
  choice: всяким усердием
  rationale: Передаёт серьёзность, рвение и деятельную старательность, сохраняя структуру перечня.
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: нашей любовью, пребывающей в вас
  rationale: Естественно по-русски передаёт принятую форму текста — любовь, исходящую от Павла и его сотрудников и находящуюся в коринфянах, — при этом сноска сохраняет синтаксическую и текстологическую неопределённость.
- source_word: χάριτι
  choice: благодатью
  rationale: Сохраняет богословскую насыщенность χάρις и словоупотребление Павла; конкретное указание на дело пожертвования поясняется в сноске.
theological_decisions:
- issue: Значение χάρις в контексте сбора для святых
  choice: благодать
  alternative: благодатное дело; дар; дело милости
  rationale: Павел называет участие в пожертвовании χάρις, связывая щедрость с благодатью, поэтому конкретизация только как «дар» обеднила бы богословский смысл.
- issue: Толкование τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: нашей любовью, пребывающей в вас
  alternative: вашей любовью к нам
  rationale: Основной текст следует принятому чтению SBLGNT и не устраняет его трудность; альтернативное понимание и вариант рукописной традиции отмечены в сноске.
- issue: Сила ἵνα при переходе к последнему члену
  choice: 'побуждение: «так изобилуйте»'
  alternative: 'цель или содержание подразумеваемого призыва: «чтобы вы изобиловали»'
  rationale: В контексте ἵνα естественно выполняет побудительную функцию; русская конструкция ясно выражает призыв, не добавляя отдельного глагола «смотрите».
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского увещания. Синтаксис перечня сохранён, но трудная греческая фраза об ἀγάπη слегка развернута ради ясности. Повтор «изобилуете / изобилуйте» намеренно воспроизводит повтор περισσεύω.
