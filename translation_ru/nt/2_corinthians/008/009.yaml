base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: ru
  text: 'Ведь вы знаете благодать нашего Господа Иисуса Христа: хотя Он был богат, ради вас Он стал беден[a], чтобы вы обогатились благодаря Его бедности.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «богат», «стал беден» и «обогатились» образуют метафорическое противопоставление. Павел здесь прямо не уточняет, какие именно богатство и бедность имеются в виду.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: вы знаете
  rationale: Настоящее время указывает на уже имеющееся у коринфян знание; простая форма естественна по-русски.
- source_word: χάριν
  choice: благодать
  rationale: Сохраняет богословскую глубину χάρις и одновременно допускает значение милостивой щедрости Христа в контексте призыва к пожертвованиям.
- source_word: κυρίου
  choice: Господа
  rationale: Обычный и содержательно точный русский эквивалент титула κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  rationale: В современном русском библейском и литературном употреблении «Христос» узнаваемо передаёт мессианский титул, не создавая впечатления фамилии в данном сочетании.
- source_word: δι’ ὑμᾶς
  choice: ради вас
  rationale: Передаёт направленность действия на благо адресатов и звучит естественно и ёмко.
- source_word: ἐπτώχευσεν
  choice: стал беден
  rationale: Точно выражает переход к бедности, не уточняя её вид и не вводя отсутствующую в греческом форму страдательного залога.
- source_word: πλούσιος ὤν
  choice: будучи богат
  rationale: Формально сохраняет причастную конструкцию и её смысловое противопоставление, не усиливая её однозначно до уступительного «хотя».
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: благодаря Его бедности
  rationale: Передаёт дательный падеж средства или основания естественной русской конструкцией; местоимение сохраняет особое указание на Его бедность.
- source_word: πλουτήσητε
  choice: вы обогатились
  rationale: Сохраняет активный глагол и намеренную антитезу «стал беден — обогатились»; форма после «чтобы» передаёт цель или результат.
theological_decisions:
- issue: Смысл богатства Христа, Его бедности и обогащения верующих
  choice: Сохранить экономическую метафору без уточнения её конкретного богословского содержания.
  alternative: Истолковать богатство как предвечную славу Христа, бедность как воплощение или крест, а обогащение как исключительно духовные блага спасения.
  rationale: Сам стих не определяет метафору настолько узко. В контексте она одновременно раскрывает самоотдачу Христа и служит образцом щедрости, поэтому перевод сохраняет богословское напряжение.
- issue: Смысл πλούσιος ὤν
  choice: «будучи богат»
  alternative: «хотя Он был богат»
  rationale: Причастие допускает уступительное прочтение, однако формальная конструкция сама по себе не маркирует его однозначно; русский оборот сохраняет связь предшествующего состояния с последующим добровольным обнищанием.
translation_notes:
  register: Современный литературный русский с традиционно узнаваемой библейской терминологией. Двоеточие после «Иисуса Христа» естественно вводит раскрытие того, в чём проявилась Его благодать; прописные местоимения в отношении Христа соответствуют принятому русскому религиозному регистру.
