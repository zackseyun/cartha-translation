  text: Γνωρίζομεν δὲ ὑμῖν, ἀδελφοί, τὴν χάριν τοῦ θεοῦ τὴν δεδομένην ἐν ταῖς ἐκκλησίαις τῆς Μακεδονίας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/001.yaml
  text: We make known to you[a], brothers, the grace of God that has been given among the churches of Macedonia[b],
translation:
  language: ru
  text: Сообщаем же вам, братья[a], о благодати Божьей[b], данной в церквах Македонии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры». В греческом тексте стоит «братья»; такая форма обращения нередко относится ко всей общине.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «благодать Божья» может означать как Божье благоволение, так и порождённую им щедрость македонских церквей.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζομεν δὲ ὑμῖν
  choice: Сообщаем же вам
  rationale: «Сообщаем» передаёт настоящее время и значение «делаем известным», не добавляя интерпретирующего «хотим». Частица «же» естественно обозначает мягкий переход, выраженный δέ, без усиления до резкого противопоставления.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняется грамматически мужская форма обращения; в данном употреблении она может охватывать всю общину, что отмечено в сноске.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: о благодати Божьей
  rationale: '«Благодать» сохраняет широту ключевого для Павла слова χάρις: Божье благоволение и его действенное проявление, в контексте — в щедрости македонских общин. Предлог «о» обусловлен естественным русским управлением глагола «сообщать».'
- source_word: τὴν δεδομένην
  choice: данной
  rationale: 'Страдательное причастие передаёт перфектную пассивную форму: благодать была дана и продолжает действовать.'
- source_word: ἐν ταῖς ἐκκλησίαις τῆς Μακεδονίας
  choice: в церквах Македонии
  rationale: «В» сохраняет значение сферы, в которой дана и действует благодать; «церкви Македонии» естественно передаёт генитив и обозначает местные христианские общины.
theological_decisions:
- issue: Значение выражения «благодать Божья» в контексте
  choice: Божья благодать, действующая в македонских церквах и проявляющаяся в их щедрости
  alternative: Само пожертвование как конкретный дар либо Божье благоволение в более общем смысле
  rationale: Формулировка не сводит χάρις ни только к пожертвованию, ни только к отвлечённому благоволению, сохраняя связь между Божьей благодатью и вызванной ею щедростью.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным апостольским тоном. Синтаксис остаётся ясным для обычного читателя; частица «же» передаёт переход к новой теме, а форма «Божьей» соответствует современному употреблению.
