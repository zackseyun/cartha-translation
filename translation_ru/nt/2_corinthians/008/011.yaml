  terminology: «Довести до конца» адекватно передаёт ἐπιτελέσατε; «готовность» удачно передаёт προθυμία. «По мере ваших средств» в данном контексте яснее, чем «исходя из того, что у вас есть», и не предполагает пожертвования сверх наличного.
