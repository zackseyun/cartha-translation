  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: ru
  text: А теперь доведите до конца и само дело[a], чтобы готовности, с которой вы этого пожелали, соответствовало и доведение дела до конца — по мере ваших средств[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «закончите осуществление задуманного».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из того, что у вас есть»; то есть в соответствии с имеющимися у вас средствами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: А теперь
  rationale: Передаёт и переход к практическому действию, и лёгкий противопоставительный оттенок δέ; по-русски звучит естественно в контексте увещания.
- source_word: τὸ ποιῆσαι ἐπιτελέσατε
  choice: доведите до конца и само дело
  rationale: Сохраняет конкретный характер ранее задуманного действия и значение ἐπιτελέω — довести начатое до завершения. Частица «и» отражает καί.
- source_word: ἡ προθυμία τοῦ θέλειν
  choice: с такой же готовностью, с какой пожелали это сделать
  rationale: Передаёт προθυμία как охотную готовность, а θέλειν — как волевое желание и намерение. Перестройка делает выражение естественным для современного русского языка, не сводя его лишь к отвлечённому желанию.
- source_word: οὕτως καὶ τὸ ἐπιτελέσαι
  choice: чтобы вы завершили его с такой же готовностью
  rationale: Сравнительная конструкция «с такой же… с какой…» естественно воспроизводит соответствие καθάπερ… οὕτως καί между первоначальной готовностью и завершением дела.
- source_word: ἐκ τοῦ ἔχειν
  choice: исходя из того, что у вас есть
  rationale: Сохраняет буквальный образ источника или наличных возможностей и не превращает призыв в требование дать сверх имеющихся средств.
theological_decisions:
- issue: Соотношение обещанного пожертвования и имеющихся средств
  choice: Призыв завершить сбор в соответствии с тем, что у коринфян действительно есть
  alternative: Общий безусловный призыв осуществлять любое доброе намерение независимо от наличных возможностей
  rationale: Ближайший контекст говорит об обещанном пожертвовании, а ἐκ τοῦ ἔχειν прямо связывает завершение с наличными средствами. Перевод сохраняет это практическое ограничение.
- issue: Связь готовности с желанием и исполнением
  choice: Та же охотная готовность, которая проявилась в желании участвовать, должна сопровождать завершение дела
  alternative: Готовность относится только к первоначальному желанию, без смысловой связи со способом завершения
  rationale: Сопоставление καθάπερ… οὕτως καί ставит первоначальное волеизъявление и фактическое завершение в параллель, но не утверждает, что одного намерения достаточно.
translation_notes:
  register: Современный литературный русский язык с уважительным, увещательным тоном. Синтаксис слегка перестроен ради естественности, при этом сохранены повтор идеи завершения, сопоставление желания с исполнением и указание на наличные средства.
