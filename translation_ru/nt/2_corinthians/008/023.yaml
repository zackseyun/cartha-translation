source:
  edition: SBLGNT
  text: εἴτε ὑπὲρ Τίτου, κοινωνὸς ἐμὸς καὶ εἰς ὑμᾶς συνεργός· εἴτε ἀδελφοὶ ἡμῶν, ἀπόστολοι ἐκκλησιῶν, δόξα Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/023.yaml
  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: ru
  text: Что касается Тита, то он мой товарищ и сотрудник в служении вам; а наши братья — посланники церквей[a], слава Мессии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «апостолы церквей». Греческое слово может обозначать как апостолов, так и посланников или уполномоченных представителей; здесь контекст указывает на представителей общин.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «слава Христа». Греческое Χριστός — титул со значением «Мессия, Помазанник».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὑπὲρ Τίτου
  choice: Что касается Тита
  rationale: Эллиптическая греческая конструкция вводит первый из двух параллельных случаев; такой русский оборот естественно передаёт значение «относительно Тита».
- source_word: κοινωνὸς ἐμὸς
  choice: мой товарищ
  rationale: κοινωνός обозначает человека, участвующего в общем деле. «Товарищ» сохраняет идею близкого участия и не придаёт выражению коммерческого оттенка слова «партнёр».
- source_word: εἰς ὑμᾶς συνεργός
  choice: сотрудник в служении вам
  rationale: συνεργός — «сотрудник, соработник», а εἰς ὑμᾶς указывает на направленность его труда к коринфянам. Формулировка передаёт это отношение естественно по-русски, не добавляя мысли о результате служения.
- source_word: ἀδελφοὶ ἡμῶν
  choice: наши братья
  rationale: Грамматически мужское множественное число в данном контексте относится к мужчинам, сопровождавшим сбор пожертвований.
- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: посланники церквей
  rationale: Здесь ἀπόστολοι наиболее естественно означает уполномоченных представителей общин. «Посланники» сохраняет смысл поручения, не приписывая этим людям без необходимости особый апостольский статус.
- source_word: δόξα Χριστοῦ
  choice: слава Мессии
  rationale: Безглагольное приложение буквально характеризует братьев как «славу Мессии». Χριστός передано как титул «Мессия», а не как ставшее именем обозначение.
theological_decisions:
- issue: Значение ἀπόστολοι применительно к неназванным братьям
  choice: посланники церквей
  alternative: апостолы церквей
  rationale: Контекст сбора пожертвований и родительный оборот «церквей» указывают на представителей, посланных общинами. В сноске сохранено более буквальное и потенциально статусное прочтение.
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: Χριστός здесь сохраняет функцию титула. В основном тексте передано его титульное значение, а привычная форма «Христос» отмечена как лексическая альтернатива.
- issue: Синтаксическая сила δόξα Χριστοῦ
  choice: слава Мессии
  alternative: честь Мессии / прославляющие Мессию
  rationale: 'Сжатая именная конструкция оставлена без поясняющего глагола, чтобы не устранять неоднозначность: братья могут быть названы проявлением славы Мессии или теми, кто служит к его славе.'
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизмов. Параллель двух частей сохранена, но во второй части опущено повторное «что касается», чтобы фраза звучала естественнее. Краткое «слава Мессии» намеренно сохраняет напряжённость и смысловую ёмкость оригинала.
