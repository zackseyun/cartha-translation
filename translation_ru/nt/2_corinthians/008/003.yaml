lexical_decisions:
- source_word: ὅτι
  choice: Ибо
  rationale: Союз вводит пояснение и обоснование сказанного в предыдущем стихе; «ибо» естественно передаёт эту функцию в достойном современном русском стиле.
- source_word: κατὰ δύναμιν
  choice: по силам
  rationale: Оборот обозначает меру, соответствующую возможностям. «По силам» кратко и естественно передаёт этот смысл и создаёт ясный контраст с последующим «сверх сил».
- source_word: μαρτυρῶ
  choice: свидетельствую
  rationale: Настоящее время и вставной характер глагола сохранены; слово передаёт личное и подчёркнутое заверение Павла.
- source_word: καὶ παρὰ δύναμιν
  choice: и даже сверх сил
  rationale: παρά с винительным падежом указывает на превышение меры или предела. Частица «даже» естественно выражает усилительный смысл καί в данном противопоставлении.
- source_word: αὐθαίρετοι
  choice: по собственной воле
  rationale: Прилагательное указывает на действие по своей инициативе, без принуждения. Русский обстоятельственный оборот естественно передаёт его предикативный смысл.
theological_decisions:
- issue: Подразумеваемый глагол при αὐθαίρετοι
  choice: 'Восстановить из контекста глагол «давали»: «они давали… по собственной воле».'
  alternative: 'Передать эллиптически и более буквально: «по собственной воле» без названного действия.'
  rationale: Греческая фраза эллиптична, но речь в стихах 2–4 явно идёт о пожертвовании македонян. В русском языке добавление подразумеваемого «давали» делает предложение полноценным, не внося нового содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Параллелизм «по силам — сверх сил» сохраняет краткость и риторический контраст оригинала; подлежащее и глагол восстановлены из ближайшего контекста.
