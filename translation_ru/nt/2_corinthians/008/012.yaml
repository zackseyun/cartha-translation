id: 2CO.8.12
reference: 2 Corinthians 8:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ προθυμία πρόκειται, καθὸ ἐὰν ⸀ἔχῃ εὐπρόσδεκτος, οὐ καθὸ οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: ru
  text: Ведь если есть готовность[a], она приемлема сообразно тому, что человек имеет[b], а не тому, чего не имеет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «желание»; «усердие».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сообразно тому, что бы человек ни имел… а не сообразно тому, чего не имеет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: готовность
  rationale: Слово обозначает добровольную, усердную расположенность к действию. «Готовность» естественно передаёт наличие желания участвовать в сборе, не усиливая эмоциональный оттенок до «рвения».
- source_word: πρόκειται
  choice: есть
  rationale: 'В данном обороте глагол указывает на наличность: готовность имеется налицо. Русское «есть» передаёт этот смысл естественно, без буквального и неуместного здесь «предлежит».'
- source_word: καθὸ ἐὰν ἔχῃ
  choice: сообразно тому, что человек имеет
  rationale: Оборот задаёт меру или основание оценки в соответствии с реально имеющимися средствами. Добавленное «человек» ясно выражает обобщённый субъект греческой формы третьего лица, не ограничивая её мужчинами.
- source_word: εὐπρόσδεκτος
  choice: приемлема
  rationale: Прилагательное означает то, что принимается благосклонно или считается угодным. «Приемлема» сохраняет оценочный смысл и не уточняет того, кем именно даяние или готовность принимается.
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: а не тому, чего не имеет
  rationale: Формулировка сохраняет точное противопоставление наличных и отсутствующих средств, при этом избегая ненужного повтора слова «человек».
- source_word: εἰ γὰρ
  choice: Ведь если
  rationale: «Ведь» передаёт пояснительную связь γάρ с предыдущей мыслью, а «если» сохраняет условную силу εἰ.
theological_decisions:
- issue: Кем или перед кем готовность признаётся приемлемой
  choice: 'Оставить адресата принятия неуточнённым: «она приемлема».'
  alternative: «Она угодна Богу» или «её принимает община».
  rationale: εὐπρόσδεκτος выражает благосклонное принятие, но стих прямо не называет того, кто принимает. Перевод не сводит смысл исключительно к Божьей оценке или к оценке общины.
- issue: Что именно названо приемлемым
  choice: Грамматически связать «приемлема» с названной в условии «готовностью».
  alternative: 'Ввести подразумеваемый «дар»: «дар принимается».'
  rationale: В греческом тексте существительное «дар» отсутствует, а εὐπρόσδεκτος может согласовываться с существительным женского рода προθυμία, поскольку это прилагательное двух окончаний. Такой перевод не добавляет прямо не названный предмет, хотя контекст пожертвования определяет практическое применение мысли.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический параллелизм последней части сохранён; архаизмы и конфессионально окрашенные уточнения исключены.
