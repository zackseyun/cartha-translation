  yaml_path: translation/nt/2_corinthians/008/008.yaml
  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: ru
  text: Я говорю это не как повеление, но с помощью усердия других[a] проверяю[b] подлинность вашей любви.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рвения других»; σπουδή может означать усердие, рвение или старание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «испытываю» или «подвергаю испытанию»; δοκιμάζω может означать проверять, подвергать испытанию или устанавливать подлинность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: повеление
  rationale: «Повеление» естественно передаёт распоряжение, имеющее обязательную силу, и сохраняет противопоставление добровольному проявлению любви.
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: усердием других
  rationale: Творительный падеж передаёт инструментальное значение διά с родительным; «других» сохраняет неопределённость ἑτέρων, не добавляя прямо македонян.
- source_word: σπουδή
  choice: усердие
  rationale: В контексте сбора пожертвований слово обозначает деятельную серьёзность и рвение; «усердие» звучит естественно и не сводит значение лишь к поспешности.
- source_word: ἀγάπη
  choice: любовь
  rationale: Прямой и общепонятный эквивалент, здесь относящийся к любви коринфян, проявляемой в щедрости.
- source_word: γνήσιον
  choice: искренность
  rationale: Субстантивированное прилагательное указывает на подлинный, неподдельный характер любви; «искренность» естественно сочетается с «любовью» по-русски.
- source_word: δοκιμάζων
  choice: испытываю
  rationale: Передаёт проверку с целью выявить подлинное качество; личная форма естественно выражает сопутствующее действие причастия при λέγω.
- source_word: καί
  choice: и
  rationale: Сохраняет присоединительное значение частицы без излишнего усиления; в русском порядке слов «и искренность» указывает на добавляемый объект проверки.
- source_word: ὑμετέρας
  choice: вашей
  rationale: Точно передаёт принадлежность любви коринфской общине.
theological_decisions:
- issue: Риторическая позиция Павла в отношении пожертвования
  choice: Павел прямо говорит, что не отдаёт обязательного повеления, а проверяет искренность любви коринфян на фоне усердия других.
  alternative: Считать слова Павла лишь риторически смягчённым повелением, сохраняющим обязательную силу.
  rationale: Фраза οὐ κατ’ ἐπιταγὴν λέγω прямо отрицает форму властного предписания. Перевод сохраняет напряжение между апостольским авторитетом и добровольным поступком, вызванным любовью.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис близок к греческому, но остаётся понятным; инструментальное «усердием других» сохраняет значение средства и не вводит отсутствующее в исходном тексте пояснение.
