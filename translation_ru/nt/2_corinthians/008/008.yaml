  terminology: «Повеление», «усердие», «любовь» уместны. Для γνήσιον предпочтительно «подлинность», поскольку речь о неподдельности/аутентичности любви, а не только о субъективной искренности. «Проверяю» — естественный перевод δοκιμάζω в данном контексте; альтернативы вынесены в примечание.
