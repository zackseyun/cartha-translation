  source_fidelity: 'Основные соответствия исходнику сохранены: «повеление» точно передаёт ἐπιταγή, а «усердие других» сохраняет неопределённое ἑτέρων и инструментальное διὰ. Однако «и искренность вашей любви» ошибочно придаёт καί функцию присоединения второго, невыраженного объекта испытания. В греческом τὸ ... γνήσιον — единственный объект δοκιμάζων; καί связывает оборот с основным высказыванием, а не добавляет «также испытываю искренность». «Подлинность» точнее передаёт γνήσιον, чем «искренность».'
