  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: ru
  text: Вместе с ним мы послали брата, чья похвала в деле благовестия известна во всех церквах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чья похвала, связанная с благовестием, известна среди всех церквей».'
    reason: 'Лексико-синтаксический вариант: ἐν τῷ εὐαγγελίῳ указывает на сферу или связь с благовестием, не уточняя вид деятельности; διά с родительным допускает передачу как «во всех», так и «среди всех» церквей.'
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: Вместе с ним мы послали
  rationale: Аорист обозначает совершённое действие, а приставка συν- передаёт совместность; такая формулировка естественно выражает отправление брата вместе с ранее упомянутым человеком.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь δέ служит слабой связкой, продвигающей повествование. В русском связь естественно передаётся порядком предложений; добавление «и» или «а» могло бы создать ненужный смысловой оттенок.
- source_word: τὸν ἀδελφόν
  choice: брата
  rationale: Речь идёт о конкретном мужчине-христианине, известном адресатам. «Брат» сохраняет личный и общинный смысл исходного слова без добавления отсутствующего в греческом «наш».
- source_word: οὗ ὁ ἔπαινος
  choice: которого хвалят
  rationale: Греческая именная конструкция буквально говорит о «похвале» брата; русская глагольная формулировка звучит естественнее и сохраняет смысл, не превращая его в абстрактную «известность».
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: за благовестие
  rationale: Предлог ἐν обозначает сферу или основание похвалы, связанной с Евангелием. «За благовестие» естественно по-русски, но не уточняет, идёт ли речь именно о проповеди или о более широком служении.
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: во всех церквах
  rationale: διά с родительным выражает распространённость среди всей совокупности общин. «Во всех церквах» ясно передаёт широкое признание.
- source_word: ἐκκλησιῶν
  choice: церквах
  rationale: В данном контексте слово обозначает местные христианские общины; «церкви» — общепонятный и установившийся русский эквивалент.
theological_decisions:
- issue: Личность и статус ἀδελφός
  choice: «брат» — конкретный мужчина-христианин, сопровождающий посланника
  alternative: обобщённое «единоверец» или добавленное «наш брат»
  rationale: Мужской род, единственное число, артикль и контекст поездки указывают на определённого человека; перевод не устраняет пол и не добавляет притяжательного значения.
- issue: Смысл ἐν τῷ εὐαγγελίῳ
  choice: «за благовестие» без уточнения конкретной должности или вида служения
  alternative: «за проповедь Евангелия»; «за служение Евангелию»
  rationale: Исходный текст связывает похвалу с Евангелием, но прямо не называет ни проповедь, ни церковную должность; более широкая формулировка сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык; ясный, достойный и естественный синтаксис. Глагольная конструкция «которого хвалят» предпочтена тяжеловесному буквальному «чья похвала». Термин «благовестие» сохраняет связь с εὐαγγέλιον и не сужает её до одной формы служения.
