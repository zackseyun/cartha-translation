lexical_decisions:
- source_word: ἐν πολλῇ δοκιμῇ θλίψεως
  choice: среди тяжкого испытания скорбями
  rationale: Передаёт δοκιμή как тяжёлое испытание, а родительный θλίψεως — как обстоятельства скорбей; формулировка сохраняет смысловую связь греческих слов и естественна для современного русского языка.
- source_word: ἡ περισσεία τῆς χαρᾶς αὐτῶν
  choice: изобилие их радости
  rationale: Сохраняет именную конструкцию и повтор мотива изобилия, который затем подхватывается глаголом ἐπερίσσευσεν.
- source_word: ἡ κατὰ βάθους πτωχεία αὐτῶν
  choice: их глубокая нищета
  rationale: Идиома κατὰ βάθους усиливает значение πτωχεία и одновременно сохраняет образ глубины; «нищета» точнее передаёт крайнюю материальную бедность, чем нейтральное «бедность».
- source_word: ἐπερίσσευσεν
  choice: перелились
  rationale: Передаёт не только изобилие, но и образ направленного перехода к результату, выраженному оборотом с εἰς; множественное число по-русски согласовано с двумя однородными подлежащими.
- source_word: εἰς τὸ πλοῦτος
  choice: в богатство
  rationale: Предлог «в» сохраняет направленно-результативную силу εἰς, а «богатство» поддерживает намеренный парадокс между нищетой и богатством.
- source_word: τῆς ἁπλότητος αὐτῶν
  choice: их щедрости
  rationale: В контексте сбора материальной помощи ἁπλότης обозначает бесхитростную, чистосердечную щедрость; «щедрость» ясно передаёт контекстуальный смысл, а более буквальные оттенки отмечены в сноске.
theological_decisions:
- issue: Значение ἁπλότης в контексте материального пожертвования
  choice: щедрость
  alternative: простота; искренность; чистосердечие
  rationale: Ближайший контекст посвящён материальной помощи святым, поэтому здесь вероятнее смысл открытой, чистосердечной щедрости. Сноска сохраняет более широкую семантику слова, не превращая её в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно формальной, достойной библейского текста интонацией. Сохранены парадокс «нищета — богатство», именная формулировка «изобилие радости» и метафора переливающегося изобилия. Начальное «что» оставлено, поскольку стих синтаксически продолжает предыдущее высказывание.
