  - marker: b
    text: 'Или: «волей Бога»; «в соответствии с волей Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἠλπίσαμεν
  choice: как мы ожидали
  rationale: Глагол ἐλπίζω обычно связан с надеждой, но здесь речь идёт о том, что поступок македонян превзошёл ожидания Павла и его спутников. «Ожидали» естественно передаёт смысл в данном контексте; возможное «надеялись» сохранено в сноске.
- source_word: ἑαυτοὺς ἔδωκαν
  choice: отдали самих себя
  rationale: 'Сохранена выразительная возвратная конструкция: речь идёт не только о денежном пожертвовании, но о личной самоотдаче.'
- source_word: πρῶτον
  choice: прежде всего
  rationale: Передаёт приоритет, не уточняя окончательно, является ли он временным, логическим или ценностным.
- source_word: τῷ κυρίῳ
  choice: Господу
  rationale: Обычная и контекстуально уместная передача κύριος; в данном месте слово относится к Христу.
- source_word: καὶ ἡμῖν
  choice: и нам
  rationale: Сохранена параллельная дательная конструкция без пояснительного расширения, которое могло бы приписать Господу и апостолам равный статус.
- source_word: διὰ θελήματος θεοῦ
  choice: по воле Бога
  rationale: Естественное русское выражение, сохраняющее возможность понимать оборот как указание на действие, основание или соответствие Божьей воле; другие оттенки отмечены в сноске.
theological_decisions:
- issue: Соотношение самоотдачи Господу и апостолам
  choice: Сохранена последовательность «Господу и нам» с указанием приоритета посредством «прежде всего», без добавления «затем».
  alternative: «Прежде Господу, а затем и нам».
  rationale: πρῶτον указывает на приоритет, но синтаксис не требует однозначно понимать его как строгую временную последовательность или как утверждение об иерархии. Перевод не усиливает смысл дополнительным наречием.
- issue: Смысл διὰ θελήματος θεοῦ
  choice: по воле Бога
  alternative: «волей Бога»; «в соответствии с волей Бога»
  rationale: Греческий оборот допускает оттенки посредства, основания и соответствия. Основной текст использует естественную русскую формулу, а сноска сохраняет другие возможные прочтения.
translation_notes:
  register: Современный литературный русский язык; тон простой и достойный. Сохранена личная сила выражения «отдали самих себя», а неоднозначность πρῶτον и διὰ θελήματος θεοῦ не устранена пояснительными добавлениями.
