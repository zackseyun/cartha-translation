lexical_decisions:
- source_word: στελλόμενοι τοῦτο
  choice: Мы принимаем эти меры
  rationale: Средний залог причастия передаёт принятие предупредительных мер во избежание возможного нарекания; по-русски выражение звучит естественно и сохраняет превентивный смысл.
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: чтобы никто не упрекнул нас
  rationale: μή с конъюнктивом выражает предотвращаемый результат; μωμάομαι означает порицать, упрекать или находить в ком-либо вину.
- source_word: ἐν τῇ ἁδρότητι ταύτῃ
  choice: в связи с этим щедрым пожертвованием
  rationale: ἐν обозначает здесь область возможного нарекания, а ἁδρότης — щедрый или обильный вклад; контекст сбора помощи позволяет естественно назвать его пожертвованием.
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: которое мы распределяем
  rationale: διακονέω в контексте помощи относится к ответственному распоряжению собранными средствами. Активная русская конструкция естественнее греческой пассивной и сохраняет участие Павла и его спутников.
theological_decisions:
- issue: Характер заботы Павла при обращении с пожертвованием
  choice: Подчеркнуть практические меры, принимаемые ради предотвращения упрёков при распоряжении пожертвованием.
  alternative: Понять выражение лишь как организационные меры, связанные с доставкой дара.
  rationale: Греческий текст прямо связывает меры с тем, чтобы никто не мог упрекнуть Павла и его сотрудников; перевод сохраняет этическую тему подотчётности, не расширяя её до отдельного доктринального утверждения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Принимаем эти меры» передаёт предупредительный характер действий; «щедрое пожертвование» конкретизирует ἁδρότης по контексту, а сноска сохраняет его оттенок изобилия.
