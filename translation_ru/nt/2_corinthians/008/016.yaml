translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной, подходящей апостольскому благодарению формулировкой. «Ревность» употреблена в значении горячего усердия, а не зависти. Пунктуация сохраняет незавершённость синтаксического периода, продолжающегося в следующем стихе.
