  text: Но благодарность Богу, вложившему в сердце Тита такую же заботу о вас,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χάρις δὲ τῷ θεῷ
  choice: Но благодарение Богу
  rationale: Формула χάρις ... τῷ θεῷ в данном контексте выражает благодарность Богу, а δέ обозначает мягкий переход с оттенком противопоставления.
- source_word: τῷ διδόντι
  choice: вложившему
  rationale: Причастие от δίδωμι буквально связано с дарованием; в сочетании с образом сердца естественное русское «вложившему в сердце» передаёт действие Бога без утраты метафоры.
- source_word: τὴν αὐτὴν σπουδήν
  choice: такую же ревность
  rationale: σπουδή обозначает здесь деятельное, искреннее усердие и заботу; «ревность» в возвышенном современном регистре сохраняет силу выражения, а «такую же» передаёт αὐτήν и сопоставление с заботой Павла.
- source_word: ὑπὲρ ὑμῶν
  choice: о вас
  rationale: Предлог ὑπέρ указывает на направленную к коринфянам заботу; по-русски «ревность о вас» естественнее и точнее, чем буквальное «за вас».
- source_word: ἐν τῇ καρδίᾳ Τίτου
  choice: в сердце Тита
  rationale: Сохраняется исходный образ внутреннего расположения и прямо передаётся предложная конструкция ἐν с притяжательным родительным Τίτου.
