review_pass:
  verdict: revise
  source_fidelity: Греческий текст призывает коринфян предъявить упомянутым братьям доказательство своей любви и обоснованность хваления Павла о них, сделав это публично перед церквами. Смысл сохранён, но «перед лицом церквей» звучит несколько книжно-архаично и менее естественно для современного русского.
  naturalness: «Перед церквами» — естественная современная формула для публичного действия перед общинами. Перенос этого обстоятельства после «им» также яснее передаёт адресатов и публичный характер действия.
  terminology: «Доказательство», «любовь», «хвалимся вами» и «церкви» точно и последовательно передают ἔνδειξις, ἀγάπη, καύχησις ὑπὲρ ὑμῶν и ἐκκλησίαι. Формула «хвалимся вами» естественно передаёт хваление/похвалу о коринфянах, не добавляя отдельного действия «говоря».
  issues:
