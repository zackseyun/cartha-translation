  text: Итак, покажите им перед церквами доказательство вашей любви и того, что мы хвалимся вами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔνδειξιν
  choice: доказательство
  rationale: Существительное обозначает наглядное подтверждение, делающее нечто очевидным; «доказательство» естественно передаёт призыв подтвердить любовь конкретным поступком.
- source_word: ἀγάπης
  choice: любви
  rationale: Обычное соответствие для ἀγάπη; в контексте речь идёт о любви, проявляемой практически.
- source_word: καυχήσεως
  choice: того, чем мы хвалимся
  rationale: Описательная конструкция сохраняет характерное для Павла значение «хвалиться», но звучит естественнее, чем буквальное и двусмысленное «нашей похвалы».
- source_word: ὑπὲρ ὑμῶν
  choice: говоря о вас
  rationale: При καύχησις оборот указывает на тех, о ком Павел хвалится; такая передача ясна и естественна по-русски.
- source_word: εἰς αὐτοὺς
  choice: им
  rationale: Местоимение относится к ранее упомянутым братьям, представляющим церкви.
- source_word: ἐνδεικνύμενοι
  choice: покажите
  rationale: Причастие в контексте имеет побудительную силу; «покажите» передаёт требование сделать любовь очевидной.
- source_word: εἰς πρόσωπον
  choice: перед лицом
  rationale: Сохраняет образность греческого оборота и его значение публичного действия в присутствии представителей церквей.
- source_word: τῶν ἐκκλησιῶν
  choice: церквей
  rationale: В данном контексте речь идёт о местных христианских общинах, представленных посланными братьями.
- source_word: οὖν
  choice: Итак
  rationale: Передаёт вывод из предшествующей рекомендации братьев и призыва достойно их принять.
