- from: Итак, перед лицом церквей[b] покажите им доказательство[a] вашей любви и того, чем мы хвалимся, говоря о вас.
  to: Итак, покажите им перед церквами доказательство вашей любви и того, что мы хвалимся вами.
  rationale: Убран более архаичный оборот «перед лицом», а описание хваления заменено на естественную и более прямую русскую конструкцию. Сноска b сохраняет контекстуальное пояснение публичного характера без утверждения, что слово «церкви» лексически означает только представителей.
