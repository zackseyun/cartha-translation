    rationale: Хотя он возможен, для целевого современного литературного русского «перед церквами» звучит естественнее и прямо передаёт публичное значение εἰς πρόσωπον.
  - severity: low
    issue: «Того, чем мы хвалимся, говоря о вас» несколько расширяет исходное выражение.
    rationale: Добавленное «говоря» не требуется греческим текстом. «Того, что мы хвалимся вами» сохраняет связь с καύχησις и ὑπὲρ ὑμῶν более прямо.
  revised_text: Итак, покажите им перед церквами доказательство вашей любви и того, что мы хвалимся вами.
