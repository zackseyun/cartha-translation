  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: ru
  text: Поэтому мы попросили Тита, чтобы он, как уже начал, так и довёл у вас до конца это дело благодати.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это благодатное дело»; буквальнее: «эту благодать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: попросили
  rationale: В данном контексте παρακαλέω обозначает настойчивое побуждение Тита к действию. «Попросили» естественно звучит по-русски и допускает оттенок настоятельной просьбы без излишне властного «велели».
- source_word: καθὼς προενήρξατο
  choice: как прежде положил начало этому делу
  rationale: προενάρχομαι указывает на начало, положенное ранее. Добавление «этому делу» делает русскую фразу естественной, а референт восстанавливается из контекста сбора пожертвований.
- source_word: ἐπιτελέσῃ
  choice: довёл ... до конца
  rationale: Глагол означает завершить начатое, довести предприятие до исполнения; русское выражение сохраняет связь с предшествующим «положил начало».
- source_word: εἰς ὑμᾶς
  choice: у вас
  rationale: Оборот передаёт деятельность Тита внутри коринфской общины; «у вас» естественнее буквального направительного выражения и не сужает смысл до действия исключительно ради адресатов.
- source_word: καὶ τὴν χάριν ταύτην
  choice: и это дело благодати
  rationale: χάρις здесь связано с конкретным сбором пожертвований, но сохраняет богословский оттенок благодати. «Дело благодати» передаёт одновременно практическое дело и его благодатный характер.
theological_decisions:
- issue: Значение χάρις в контексте сбора пожертвований
  choice: «дело благодати» — конкретное благотворительное служение, осмысленное как проявление благодати
  alternative: «благодать» в отвлечённом смысле или просто «дар / пожертвование»
  rationale: Ближайший контекст говорит о сборе для святых. Однако одно лишь «пожертвование» устранило бы намеренную лексику благодати, а отвлечённое «благодать» скрыло бы конкретную деятельность.
translation_notes:
  register: Современный литературный русский язык, понятный широкой аудитории. Пара «положил начало — довёл до конца» сохраняет риторическую связь греческих глаголов. Формулировка «дело благодати» намеренно удерживает конкретный и богословский аспекты χάρις.
