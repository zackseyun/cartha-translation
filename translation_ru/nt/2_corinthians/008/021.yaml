base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: ru
  text: Ведь мы заботимся о добром[a] не только перед Господом, но и перед людьми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о достойном»; или: «о правильном».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προνοοῦμεν
  choice: мы заботимся о том, чтобы
  rationale: Глагол выражает обдуманную, предусмотрительную заботу. Русская конструкция естественно передаёт сознательное стремление обеспечить безупречное поведение, не сводя смысл лишь к намерению.
- source_word: γὰρ
  choice: ведь
  rationale: Союз вводит обоснование предыдущей мысли; «ведь» естественно сохраняет пояснительно-причинную связь в современном русском языке.
- source_word: καλὰ
  choice: поступать хорошо
  rationale: Субстантивированное среднее множественное число обозначает доброе, правильное или достойное поведение. Добавление «поступать» делает фразу естественной по-русски, а «хорошо» сохраняет широкий этический смысл.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: не только ... но и
  rationale: Стандартно и точно передаёт парную греческую конструкцию и её сопоставительный акцент.
- source_word: ἐνώπιον
  choice: перед
  rationale: Кратко передаёт значение «на виду у, в глазах» и естественно сочетается как с Господом, так и с людьми.
- source_word: κυρίου
  choice: Господом
  rationale: Обычная русская передача κύριος в данном новозаветном контексте; заглавная буква обозначает титул Господа.
- source_word: ἀνθρώπων
  choice: людьми
  rationale: Слово относится ко всем человеческим наблюдателям, а не только к мужчинам; «людьми» точно и естественно передаёт обобщённый смысл.
theological_decisions:
- issue: Этический оттенок καλὰ в контексте финансовой подотчётности
  choice: 'В основном тексте сохранён широкий смысл: «поступать хорошо».'
  alternative: «поступать достойно» или «поступать правильно»
  rationale: Греческое слово может указывать и на нравственное добро вообще, и на достойное, вызывающее уважение поведение перед наблюдателями. Основной вариант не сужает смысл до общественной репутации, а примечание сохраняет контекстуально важные оттенки.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конструкция ясна обычному читателю; параллелизм «не только… но и…» и намеренная широта этической формулировки сохранены.
