source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ αὐτοῖς τὸν ἀδελφὸν ἡμῶν ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις σπουδαῖον ὄντα, νυνὶ δὲ πολὺ σπουδαιότερον πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/022.yaml
  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: ru
  text: Вместе с ними мы послали и нашего брата, которого не раз и во многом испытали и убедились в его усердии. Теперь же он ещё усерднее благодаря великой уверенности в вас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через великую уверенность, направленную к вам». Греческий текст прямо не называет носителя этой уверенности; по контексту она, вероятно, относится к этому брату, но возможно также отнесение к Павлу и его сотрудникам.'
    reason: Сохраняет невыраженную в греческом тексте отнесённость πεποιθήσει и передаёт возможный причинно-инструментальный оттенок дательного падежа.
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: мы послали и … вместе с ними
  rationale: Аорист передаёт совершённое действие, а приставка συν- — совместное отправление с уже упомянутыми людьми. Частица «и» естественно отражает добавление ещё одного посланника.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: нашего брата
  rationale: Сохранён семейный язык раннехристианской общины и мужской род, относящийся к неназванному сотруднику.
- source_word: ὃν ἐδοκιμάσαμεν
  choice: которого … испытали и убедились
  rationale: δοκιμάζω обозначает проверку, выявляющую доказанные качества. Добавление «убедились» естественно выражает результат проверки, раскрытый последующим причастием.
- source_word: ἐν πολλοῖς πολλάκις
  choice: не раз и во многом
  rationale: 'Формулировка кратко сохраняет оба оттенка: многократность (πολλάκις) и разнообразие обстоятельств или дел (ἐν πολλοῖς).'
- source_word: σπουδαῖον ὄντα
  choice: убедились в его усердии
  rationale: σπουδαῖος здесь характеризует человека как старательного, ревностного и ответственного; «усердие» подходит контексту порученного служения и не сводит смысл только к эмоциональному рвению.
- source_word: νυνὶ δὲ πολὺ σπουδαιότερον
  choice: Теперь же он ещё усерднее
  rationale: «Ещё усерднее» естественно передаёт усиленную сравнительную степень πολὺ σπουδαιότερον и её связь с ранее названным усердием.
- source_word: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: благодаря своей великой уверенности в вас
  rationale: Дательный падеж понимается как указание на причину или средство возросшего усердия. Возвратное «своей» связывает уверенность с братом — ближайшим субъектом, при этом неоднозначность носителя уверенности отмечена в сноске.
theological_decisions:
- issue: Кому принадлежит πεποίθησις и какова её направленность
  choice: Возросшее усердие неназванного брата объясняется его великой уверенностью в коринфянах.
  alternative: Уверенность может принадлежать Павлу и его сотрудникам; εἰς ὑμᾶς также можно понять как уверенность или смелость по отношению к адресатам.
  rationale: Ближайшим смысловым субъектом остаётся «брат», поэтому основное чтение относит уверенность к нему. Однако греческий текст не содержит притяжательного местоимения и допускает иную отнесённость, которую не следует скрывать.
translation_notes:
  register: Современный литературный русский язык с dignified, но доступным синтаксисом. Сохранены христианское обращение «брат», повтор мотива усердия и причинно-инструментальная неоднозначность заключительного оборота; громоздкая греческая конструкция разделена на два предложения для ясности.
