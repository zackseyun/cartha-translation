  text: ὅτι τὴν μὲν παράκλησιν ἐδέξατο, σπουδαιότερος δὲ ὑπάρχων αὐθαίρετος ἐξῆλθεν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/017.yaml
  text: For he accepted the appeal[a], but being more earnest[d][c][b], he went to you of his own accord.
translation:
  language: ru
  text: Ибо он принял просьбу, но сам был ещё более усерден и по собственной инициативе отправился к вам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ведь
  rationale: Союз вводит объяснение благодарности из предыдущего стиха; «ведь» естественно передаёт причинно-пояснительную связь.
- source_word: τὴν παράκλησιν
  choice: нашу просьбу
  rationale: В данном контексте речь идёт о просьбе Павла к Титу взяться за поручение; добавленное «нашу» естественно выражает подразумеваемый источник просьбы, не меняя смысла.
- source_word: ἐδέξατο
  choice: принял
  rationale: Глагол обозначает положительное принятие просьбы.
- source_word: σπουδαιότερος
  choice: ещё более ревностным
  rationale: Сравнительная степень указывает на усиленную готовность и усердие Тита; «ещё более» сохраняет сравнительную силу формы.
- source_word: ὑπάρχων
  choice: будучи
  rationale: Причастный оборот формально и ясно сохраняет структуру греческого текста.
- source_word: αὐθαίρετος
  choice: по собственной воле
  rationale: Передаёт добровольность и личную инициативу Тита без отрицательного оттенка, возможного у слова «самовольный».
- source_word: ἐξῆλθεν πρὸς ὑμᾶς
  choice: отправился к вам
  rationale: Глагол указывает на выступление в путь от места пребывания Павла к коринфянам; «отправился» естественно передаёт это направление по-русски.
theological_decisions:
- issue: Соотношение просьбы Павла и инициативы Тита
  choice: 'Сохранено противопоставление: Тит принял просьбу, но действовал также по собственной воле.'
  alternative: Истолковать его действие либо только как исполнение поручения, либо только как независимую инициативу.
  rationale: Частицы μὲν…δὲ и слово αὐθαίρετος удерживают оба аспекта вместе, не устраняя напряжения между поручением и добровольностью.
translation_notes:
  register: Современный литературный русский язык; тон достоинственный и ясный. Синтаксис близок к греческому, но выражение «отправился к вам» выбрано вместо буквального и неестественного «вышел к вам».
