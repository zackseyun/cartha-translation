lexical_decisions:
- source_word: οὐ γὰρ
  choice: Ведь не
  rationale: γάρ поясняет предыдущее увещевание, а οὐ отрицает предполагаемую цель; «ведь не» естественно передаёт пояснительно-корректирующую связь.
- source_word: ἵνα
  choice: для того, чтобы
  rationale: ἵνα обозначает цель; эллиптическая конструкция по-русски естественно восполняется оборотом «не для того, чтобы» без добавления отдельного глагола намерения.
- source_word: ἄλλοις
  choice: другим
  rationale: Дательный падеж обозначает тех, кому досталось бы облегчение; неопределённое «другим» сохраняет форму и смысл греческого слова.
- source_word: ἄνεσις
  choice: облегчение
  rationale: В контексте материальной помощи слово означает ослабление нужды или бремени, а не просто душевный покой.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж образует прямую параллель с ἄλλοις и обозначает тех, на кого легла бы противоположная участь.
- source_word: θλῖψις
  choice: тягота
  rationale: Здесь речь о давлении и материальном бремени, которое могло бы возникнуть из-за пожертвования; «тягота» кратко и естественно противопоставляется «облегчению».
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: но ради равенства
  rationale: ἰσότης может означать равенство или справедливую соразмерность. «Равенство» сохраняет прямой лексический эквивалент, а «ради» естественно передаёт направленность выражения ἐξ ἰσότητος в данном эллиптическом противопоставлении.
theological_decisions:
- issue: Значение ἰσότης в контексте материальной взаимопомощи
  choice: равенства
  alternative: справедливого равновесия; справедливости
  rationale: Основной текст сохраняет прямое и риторически выразительное «равенство», не утверждая обязательного полного уравнивания имущества. Примечание удерживает возможный смысл справедливой соразмерности, который получает развитие в следующих стихах.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной библейской интонацией. Параллелизм «другим… вам» и контраст «облегчение… тягота» сохранены; конечное тире показывает, что мысль продолжается в следующем стихе.
