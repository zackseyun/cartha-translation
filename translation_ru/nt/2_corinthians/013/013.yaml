source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ θεοῦ καὶ ἡ κοινωνία τοῦ ἁγίου πνεύματος μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: ru
  text: Благодать Господа Иисуса Мессии[a], любовь Бога и общение Святого Духа[b] да будут со всеми вами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в традиционной передаче: «Иисуса Христа».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «сопричастность Святому Духу» или «единение в Святом Духе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: Устоявшийся и содержательно ёмкий русский эквивалент, сохраняющий богословское значение и смысл милостивого дара.
- source_word: κυρίου
  choice: Господа
  rationale: Естественная передача христологического титула κύριος в данном благословении.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь выступает как титул; «Мессия» передаёт его значение, а традиционное «Христос» сохранено в сноске.
- source_word: ἀγάπη
  choice: любовь
  rationale: Прямой и естественный русский эквивалент в формуле благословения.
- source_word: θεοῦ
  choice: Бога
  rationale: Сохраняет родительную конструкцию и не уточняет сверх текста, идёт ли речь исключительно о Божьей любви к людям.
- source_word: κοινωνία
  choice: общение
  rationale: 'Сохраняет широту значения: общность, сопричастность и участие; более узкие возможные передачи приведены в сноске.'
- source_word: ἁγίου πνεύματος
  choice: Святого Духа
  rationale: Нормативное современное русское наименование.
- source_word: μετὰ πάντων ὑμῶν
  choice: да будут со всеми вами
  rationale: Восполняет подразумеваемую связку в форме благословения и явно передаёт πάντων — «всеми».
theological_decisions:
- issue: Передача Χριστοῦ как христологического титула
  choice: Мессии
  alternative: Христа
  rationale: Основной текст раскрывает значение титула, не обращая его в подобие фамилии; традиционная форма сохранена как допустимая альтернатива.
- issue: Смысл κοινωνία τοῦ ἁγίου πνεύματος
  choice: общение Святого Духа
  alternative: сопричастность Святому Духу; единение в Святом Духе
  rationale: Родительная конструкция допускает взаимосвязанные толкования — общение, даруемое Духом, общение с Духом или участие в Духе. Основной вариант не устраняет эту богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством благословительной формулы. Частица «да» передаёт подразумеваемое пожелание; множественное «будут» согласовано с тремя однородными существительными. Добавления «аминь» нет, поскольку оно отсутствует в представленном греческом тексте.
