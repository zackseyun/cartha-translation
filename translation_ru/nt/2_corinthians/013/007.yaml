  text: ⸀εὐχόμεθα δὲ πρὸς τὸν θεὸν μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν, οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν, ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε, ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: ru
  text: Мы молимся Богу, чтобы вы не делали ничего дурного — не для того, чтобы мы выглядели выдержавшими испытание[a], а для того, чтобы вы поступали правильно, даже если мы будем выглядеть не выдержавшими испытание[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одобренными»; греческое слово обозначает тех, кто выдержал проверку и был признан годным.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будто мы не выдержали испытания»; возможен также смысл: «как неодобренные». В греческом здесь употреблено слово, противоположное слову «выдержавшими испытание» в первой части стиха.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐχόμεθα δὲ πρὸς τὸν θεόν
  choice: Мы молимся Богу
  rationale: εὔχομαι с πρός + винительный обозначает молитву, обращённую к Богу; δέ здесь имеет слабую связующую силу и не требует отдельной передачи.
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: чтобы вы не делали ничего дурного
  rationale: 'Инфинитив выражает содержание молитвы, а κακὸν μηδέν — усиленное отрицание: никакого дурного поступка или зла.'
- source_word: οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν
  choice: не для того, чтобы нам показаться выдержавшими испытание
  rationale: οὐχ ἵνα отрицает цель; δόκιμοι связано с проверкой и признанием годности, а φανῶμεν означает «показаться, предстать».
- source_word: ἵνα ὑμεῖς τὸ καλὸν ποιῆτε
  choice: а чтобы вы делали добро
  rationale: τὸ καλόν в нравственном контексте означает добро, то, что правильно; выражение естественно передано современным русским оборотом.
- source_word: ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν
  choice: даже если мы окажемся как не выдержавшие испытания
  rationale: 'ἀδόκιμοι — смысловой антоним δόκιμοι: не прошедшие проверки, не получившие одобрения. Оборот «даже если» естественно передаёт уступительный смысл контекста, а «как» сохраняет ὡς и не сводит выражение исключительно к чужому впечатлению.'
theological_decisions:
- issue: Смысл противопоставления δόκιμοι и ἀδόκιμοι
  choice: Сохранён образ прохождения или непрохождения испытания, относящийся к признанию служения Павла в данном контексте.
  alternative: «одобренными» / «неодобренными» либо «годными» / «негодными»
  rationale: Такая передача удерживает лексическую связь двух однокоренных понятий и не вводит утверждения об окончательном осуждении или лишении спасения.
- issue: Значение ὡς ἀδόκιμοι
  choice: «как не выдержавшие испытания»
  alternative: «кажущимися не выдержавшими испытания» или «будто мы не выдержали испытания»
  rationale: ὡς допускает характеристику или представление; основной текст сохраняет эту неоднозначность, не утверждая, что речь идёт лишь о внешнем впечатлении.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Повтор образа испытания намеренно сохраняет греческую антитезу δόκιμοι/ἀδόκιμοι; тяжеловесные богословские термины вроде «достойные» или «отверженные» не используются.
