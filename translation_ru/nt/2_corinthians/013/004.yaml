  text: καὶ ⸀γὰρ ἐσταυρώθη ἐξ ἀσθενείας, ἀλλὰ ζῇ ἐκ δυνάμεως θεοῦ. καὶ γὰρ ἡμεῖς ἀσθενοῦμεν ἐν αὐτῷ, ἀλλὰ ⸀ζήσομεν σὺν αὐτῷ ἐκ δυνάμεως θεοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: ru
  text: Ведь Он был распят в слабости[a], но живёт силой Божьей. Ведь и мы слабы в Нём, но будем жить с Ним[b] силой Божьей по отношению к вам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «из слабости» или «на основании слабости»; греческий предлог ἐξ может обозначать источник или основание.'
    reason: lexical_alternative
  - marker: b
    text: Слова «будем жить с Ним» могут относиться к будущему проявлению жизни и силы Христа в служении Павла коринфянам, а также перекликаться с более широкой темой жизни воскресения.
    reason: alternative_reading
  - marker: c
    text: 'Возможно также: «для вас» или «среди вас»; греческое εἰς ὑμᾶς допускает оттенки направленности, отношения или результата.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσταυρώθη
  choice: был распят
  rationale: Стандартная и точная передача аориста страдательного залога от σταυρόω.
- source_word: ἐξ ἀσθενείας
  choice: в немощи
  rationale: По-русски естественно передаёт состояние или обстоятельство слабости при распятии; значение источника или основания, возможное у ἐξ, отмечено в сноске.
- source_word: ζῇ
  choice: жив
  rationale: Кратко и естественно передаёт настоящее время ζάω, сохраняя контраст между распятием и нынешней жизнью.
- source_word: ἐκ δυνάμεως θεοῦ
  choice: силой Божьей
  rationale: Творительный падеж естественно выражает действующую силу или основание жизни; повтор выражения сохранён в обеих частях стиха.
- source_word: ἀσθενοῦμεν
  choice: немощны
  rationale: Сохраняет однокоренную смысловую связь с ἀσθένεια и звучит достойно, не сводя значение только к физической слабости.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Сохраняет ёмкий язык Павла о пребывании или единении со Христом без поясняющего расширения.
- source_word: ζήσομεν
  choice: будем жить
  rationale: Сохраняет форму будущего времени и не ограничивает её ни служением апостола, ни будущим воскресением.
- source_word: σὺν αὐτῷ
  choice: вместе с Ним
  rationale: Ясно передаёт участие и сопричастность, выраженные предлогом σύν.
- source_word: εἰς ὑμᾶς
  choice: в отношении вас
  rationale: Передаёт сжатое указание на направленность или соотнесённость ожидаемого проявления жизни и Божьей силы с коринфянами, не утверждая исключительно значение пользы или местонахождения.
theological_decisions:
- issue: Смысл немощи Христа при распятии
  choice: Сохранена формулировка «распят в немощи» как указание на немощь, в которой совершилось распятие.
  alternative: Передать как «из-за немощи» либо пояснить немощь исключительно как внешнюю видимость.
  rationale: Текст строит напряжённый контраст между немощью распятия и жизнью силой Бога. Перевод не превращает немощь в отрицание достоинства или природы Христа и не добавляет отсутствующего в тексте догматического пояснения.
- issue: Значение слов «будем жить вместе с Ним»
  choice: 'Будущее значение оставлено открытым: оно может относиться к проявлению дарованной Христом жизни и силы в апостольском служении коринфянам и одновременно перекликаться с темой воскресной жизни.'
  alternative: Ограничить выражение только окончательным воскресением либо только предстоящим проявлением апостольской власти.
  rationale: Ближайший контекст и εἰς ὑμᾶς связывают слова с отношением Павла к коринфянам, но язык жизни вместе со Христом имеет более широкий смысл. Перевод сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский с кратким, торжественным синтаксисом. «Немощь» выбрана вместо более бытовой «слабости», чтобы сохранить повтор одного смыслового корня и широкий диапазон значения; местоимения, относящиеся ко Христу, написаны с прописной буквы согласно распространённой русской библейской издательской норме.
