  yaml_path: translation/nt/2_corinthians/013/003.yaml
  text: since you are seeking proof that Messiah is speaking in me—he is not weak toward you[a], but is powerful in you[b],
translation:
  language: ru
  text: поскольку вы ищете доказательства того, что Мессия говорит во мне[a], — Мессия не слаб по отношению к вам, но силён в вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорит через меня». Букв.: «говорящего во мне Мессии».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «проявляет силу среди вас». Местоимение «вас» стоит во множественном числе и может относиться к общине в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: поскольку
  rationale: Передаёт причинное значение союза и связывает стих с намерением Павла действовать строго, выраженным в контексте.
- source_word: δοκιμὴν ζητεῖτε
  choice: вы ищете доказательства
  rationale: δοκιμή здесь обозначает подтверждение или доказательство, а настоящее время ζητεῖτε — продолжающееся требование коринфян.
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: того, что Мессия говорит во мне
  rationale: Содержание греческой генитивной конструкции естественно передано изъяснительным оборотом; ἐν ἐμοί сохранено буквально как «во мне», без устранения возможной смысловой напряжённости.
- source_word: Χριστοῦ
  choice: Мессия
  rationale: Χριστός здесь сохраняет значение титула; «Мессия» ясно передаёт его смысл в современном русском языке.
- source_word: εἰς ὑμᾶς
  choice: по отношению к вам
  rationale: Передаёт направленность и отношение действия Христа к коринфянам, не сужая смысл до пространственного.
- source_word: οὐκ ἀσθενεῖ
  choice: не слаб
  rationale: Сохраняет прямую лексику слабости и её контраст с силой, существенный для ближайшего контекста.
- source_word: ἀλλὰ δυνατεῖ
  choice: но силён
  rationale: Кратко и естественно выражает действие силы, сохраняя словесный контраст с «не слаб».
- source_word: ἐν ὑμῖν
  choice: в вас
  rationale: Наиболее непосредственно передаёт ἐν с местоимением во множественном числе и сохраняет возможность как личного, так и общинного понимания.
theological_decisions:
- issue: Значение Χριστοῦ
  choice: Мессия
  alternative: Христос
  rationale: В конструкции говорится о Мессии как о говорящем через присутствие в Павле; перевод титула раскрывает его исходное значение, не добавляя конфессиональной трактовки.
- issue: Значение ἐν ἐμοί
  choice: говорит во мне
  alternative: говорит через меня
  rationale: Основной текст сохраняет явный предлог ἐν; примечание указывает естественное агентное понимание, не решая однозначно, идёт ли речь о присутствии Мессии в Павле или о речи через него.
- issue: Значение ἐν ὑμῖν
  choice: силён в вас
  alternative: проявляет силу среди вас
  rationale: Буквальное «в вас» сохраняет возможность внутреннего действия в верующих, тогда как примечание отражает вероятный общинный смысл множественного числа.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского текста звучанием. Сохранены параллель «не слаб — силён» и неоднозначность обоих оборотов с ἐν; тяжеловесная буквальная генитивная конструкция преобразована в естественное русское придаточное.
