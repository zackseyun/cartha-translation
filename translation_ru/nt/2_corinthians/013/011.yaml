base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/011.yaml
  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: ru
  text: В заключение, братья[b], радуйтесь[a], исправляйтесь[c], ободряйтесь[d], будьте единомысленны[e], живите в мире, и Бог любви и мира будет с вами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прощайте». Греческое слово может быть заключительным приветствием, однако здесь, вероятно, продолжает ряд призывов: «радуйтесь».'
    reason: lexical_alternative
  - marker: b
    text: Обращение «братья» здесь относится ко всей общине и, вероятно, включает как мужчин, так и женщин.
    reason: cultural_note
  - marker: c
    text: 'Возможные варианты: «восстанавливайтесь», «приходите в должный порядок» или «достигайте полноты».'
    reason: lexical_alternative
  - marker: d
    text: 'Возможные значения: «принимайте ободрение», «принимайте утешение» или «принимайте увещание».'
    reason: lexical_alternative
  - marker: e
    text: 'Буквально: «мыслите одно и то же», то есть «будьте едины в мыслях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπόν
  choice: В заключение
  rationale: Это слово служит переходом к завершающей части послания; «в заключение» естественно передаёт его функцию в современном русском языке.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужскую форму греческого обращения; в данном контексте Павел обращается ко всей общине, что поясняется в сноске.
- source_word: χαίρετε
  choice: радуйтесь
  rationale: Хотя форма может употребляться как прощальное приветствие, здесь она входит в последовательность повелений, поэтому значение «радуйтесь» наиболее вероятно.
- source_word: καταρτίζεσθε
  choice: исправляйтесь
  rationale: Глагол обозначает приведение в надлежащее состояние, восстановление или исправление. В контексте необходимости наладить жизнь общины «исправляйтесь» звучит естественно и не подразумевает безгрешного совершенства.
- source_word: παρακαλεῖσθε
  choice: ободряйтесь
  rationale: Форма допускает значение принятия ободрения или увещания, а также взаимного ободрения; русское «ободряйтесь» сохраняет эту направленность без чрезмерного уточнения.
- source_word: τὸ αὐτὸ φρονεῖτε
  choice: будьте единомысленны
  rationale: Идиоматично передаёт буквальное «мыслите одно и то же», выражая призыв к единству мыслей, а не обязательно к полной одинаковости мнений.
- source_word: εἰρηνεύετε
  choice: живите в мире
  rationale: Настоящее повелительное наклонение указывает на постоянный мирный образ жизни внутри общины; «живите в мире» естественно передаёт этот длительный смысл.
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
  choice: Бог любви и мира
  rationale: Прямая и естественная передача греческой родительной конструкции, сохраняющая её богословскую ёмкость.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: будет с вами
  rationale: Простая форма будущего времени передаёт обещание без архаичного оттенка.
theological_decisions:
- issue: Кого охватывает обращение ἀδελφοί
  choice: В основном тексте — «братья», со сноской о включении всей общины
  alternative: «братья и сёстры»
  rationale: Так сохраняется грамматическая форма оригинала, а подразумеваемый в контексте смешанной общины охват мужчин и женщин не скрывается, но поясняется.
- issue: Связь Божьего присутствия с предшествующими призывами
  choice: Сохранить союз «и», не уточняя логическую связь
  alternative: «тогда Бог… будет с вами»
  rationale: Греческое καί не выражает условие явно. Добавление «тогда» могло бы превратить последовательность наставления и обещания в более жёсткую условную конструкцию.
translation_notes:
  register: Современный литературный русский язык с краткими параллельными повелениями, соответствующими ритму греческого текста. Тон достойный и общепонятный; архаизмы и конфессионально окрашенные формулировки исключены. Тире перед заключительным обещанием помогает ясно отделить его от ряда наставлений, не превращая связь в явно условную.
