revisions:
- from: Ведь мы радуемся, когда мы слабы, а вы сильны. И именно об этом мы молимся — о вашем исправлении[a].
  to: 'Ведь мы радуемся, когда мы слабы, а вы сильны. И об этом мы также молимся: о вашем исправлении[a].'
  rationale: Заменено «именно» на «также», чтобы передать присоединительное καί, и уточнена пунктуация, чтобы τὴν ὑμῶν κατάρτισιν ясно читалось как содержание молитвы. Главный вариант «исправление» сохранён как контекстуально возможный; сноска точнее представляет многозначность κατάρτισις.
