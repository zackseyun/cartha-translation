  text: χαίρομεν γὰρ ὅταν ἡμεῖς ἀσθενῶμεν, ὑμεῖς δὲ δυνατοὶ ἦτε· ⸀τοῦτο καὶ εὐχόμεθα, τὴν ὑμῶν κατάρτισιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/009.yaml
  text: 'For we rejoice when we are weak and you are strong[a]. And this also is what we pray for: your restoration.'
translation:
  language: ru
  text: 'Ведь мы радуемся, когда мы слабы, а вы сильны. И об этом мы также молимся: о вашем исправлении[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о вашем восстановлении», «о вашей зрелости», «о вашем оснащении» или «о приведении в надлежащее состояние». Греческое слово может означать исправление, восстановление, оснащение или приведение к должному состоянию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρομεν
  choice: мы радуемся
  rationale: Передаёт настоящее время и выраженный положительный смысл глагола, не ослабляя его до простого «мы довольны».
- source_word: γὰρ
  choice: ведь
  rationale: Естественно для современного русского языка выражает пояснительную связь с предыдущей мыслью.
- source_word: ὅταν
  choice: когда
  rationale: В сочетании с сослагательным наклонением обозначает общее временное условие; русское «когда» сохраняет эту широту.
- source_word: ἀσθενῶμεν
  choice: мы слабы
  rationale: Сохраняет широкий смысл слабости — недостатка силы, влияния или внешней убедительности, — не уточняя его сверх контекста.
- source_word: δυνατοὶ
  choice: сильны
  rationale: Передаёт прямое риторическое противопоставление слабости Павла и силе коринфян.
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: И именно об этом мы молимся
  rationale: «Молимся» соответствует значению εὔχομαι в данном контексте, а «именно об этом» передаёт выдвинутое вперёд τοῦτο и усилительное καί.
- source_word: κατάρτισιν
  choice: исправлении
  rationale: В контексте пастырского увещания обозначает приведение общины в надлежащее состояние. «Исправление» звучит естественно и не вводит специального учения о безгрешном совершенстве; другие возможные оттенки сохранены в сноске.
theological_decisions:
- issue: Смысл κατάρτισις как цели пастырской молитвы Павла
  choice: о вашем исправлении
  alternative: о вашем восстановлении; о вашей зрелости; о приведении вас к полноте
  rationale: Контекст говорит о желании Павла увидеть коринфян приведёнными в надлежащее состояние. «Исправление» передаёт вероятный пастырский смысл, не сводя слово только к нравственному совершенствованию и не утверждая технического учения о совершенстве.
translation_notes:
  register: Современный литературный русский язык; краткий, ясный и достойный стиль. Синтаксическое противопоставление «мы слабы — вы сильны» сохранено, а неоднозначность κατάρτισις отмечена в сноске.
