  text: προείρηκα καὶ προλέγω ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν ⸀νῦν, τοῖς προημαρτηκόσιν καὶ τοῖς λοιποῖς πᾶσιν, ὅτι ἐὰν ἔλθω εἰς τὸ πάλιν οὐ φείσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: ru
  text: 'Я уже говорил[a] и теперь, находясь вдали, заранее говорю — как при моём втором посещении — тем, кто прежде согрешил, и всем остальным: если я снова приду, не пощажу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я уже предупреждал». Глагол буквально означает «говорил прежде», однако в данном контексте сказанное имеет характер предупреждения.'
    reason: Указывает на допустимый контекстуальный оттенок глагола, не подменяя им его более буквальное значение в основном тексте.
lexical_decisions:
- source_word: προείρηκα
  choice: Я уже говорил прежде
  rationale: Перфект указывает на сказанное ранее, сохраняющее силу сейчас; перевод не добавляет отсутствующего в самом глаголе значения «предупреждал».
- source_word: προλέγω
  choice: заранее говорю
  rationale: Сохраняет буквальное значение «говорить наперёд» и лексическую связь с προείρηκα, тогда как оттенок предупреждения передаётся контекстом.
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: теперь, находясь вдали, ... как говорил, когда был у вас во второй раз
  rationale: Естественно раскрывает сжатое греческое противопоставление нынешнего отсутствия Павла его присутствию во время второго посещения, не превращая сравнение в утверждение о мнимом присутствии.
- source_word: τοῖς προημαρτηκόσιν
  choice: тем, кто прежде согрешил
  rationale: Передаёт предшествующий характер греха, не утверждая ничего о последующем покаянии или его отсутствии.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: всем остальным
  rationale: Сохраняет всеохватность πᾶσιν и разграничение между ранее согрешившими и остальными адресатами.
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: если я снова приду
  rationale: Естественно передаёт буквальный смысл оборота; уточнение «в третий раз» зависит от реконструкции истории посещений и вынесено в примечание.
- source_word: οὐ φείσομαι
  choice: никого не пощажу
  rationale: Русский глагол обычно требует объекта; «никого» естественно охватывает обе названные группы и сохраняет угрозу строгости без уточнения её конкретной формы.
theological_decisions:
- issue: Круг тех, кого касается обещанная Павлом строгость
  choice: Предостережение обращено и к прежде согрешившим, и ко всем остальным; при возвращении Павел никого из тех, к кому оно применимо, не пощадит.
  alternative: Отнести угрозу только к прежде согрешившим либо понимать её как неопределённое проявление апостольской строгости.
  rationale: Синтаксис прямо называет обе группы адресатов. Перевод сохраняет широкий охват и не конкретизирует форму дисциплинарных действий.
- issue: Число предполагаемых посещений
  choice: В основном тексте сохранено «если я снова приду».
  alternative: «Если я приду в третий раз».
  rationale: Греческий оборот прямо означает повторный приход, тогда как счёт «третий» выводится из контекста и потому отмечен лишь в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Вставная конструкция передаёт сложный порядок греческой фразы; «был у вас» естественно выражает личное присутствие Павла. Маркер [a] помещён непосредственно после соответствующей фразы.
