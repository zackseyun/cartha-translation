  text: But I hope that you will know that we are not disqualified[a].
translation:
  language: ru
  text: 'Но я надеюсь, что вы узнаете: мы не проваливаем проверку.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы не непризнанные»; также возможно: «мы не признаны негодными» или «мы не провалили испытание». Греческое слово обозначает того, кто не выдерживает проверки и не получает одобрения по её итогам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: надеюсь
  rationale: Настоящее время и обычное значение глагола естественно передаются как «надеюсь», сохраняя направленное вперёд ожидание Павла.
- source_word: δὲ
  choice: но
  rationale: Частица обозначает мягкое противопоставление предыдущему стиху; русское «но» ясно и естественно выражает эту связь.
- source_word: γνώσεσθε
  choice: вы узнаете
  rationale: Будущая форма указывает на предстоящее осознание или удостоверение; «узнаете» естественнее в данном контексте, чем статичное «будете знать».
- source_word: ὅτι
  choice: что / двоеточие
  rationale: Союз вводит изъяснительное придаточное; в русском после «узнаете» ту же связь естественно и ясно передаёт двоеточие.
- source_word: ἡμεῖς
  choice: мы
  rationale: Явно выраженное местоимение сохранено и относится к Павлу и его сотрудникам.
- source_word: οὐκ ἐσμὲν
  choice: не оказались
  rationale: Отрицательная связка передаётся в сочетании с результатом подразумеваемой проверки; буквальное «не являемся» с выбранным сказуемым было бы неестественно.
- source_word: ἀδόκιμοι
  choice: выдержали испытание
  rationale: Прилагательное обозначает тех, кто не выдержал проверки и не получил одобрения. Утвердительная русская формулировка после отрицания греческого слова ясно передаёт смысл «мы не провалили испытание», не привнося догматически нагруженного значения.
theological_decisions:
- issue: Передача ἀδόκιμοι в контексте проверки и апостольской состоятельности
  choice: мы выдержали испытание
  alternative: мы не оказались негодными / мы не провалили испытание
  rationale: Речь идёт о результате проверки Павла и его сотрудников. Формулировка сохраняет образ испытания и оценочный смысл, не используя богословски нагруженное «отверженные» и не уточняя сверх текста, кто именно выносит оценку.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и понятная формулировка. Двоеточие естественно оформляет содержание будущего узнавания. Образ проверки из ближайшего контекста сохранён.
