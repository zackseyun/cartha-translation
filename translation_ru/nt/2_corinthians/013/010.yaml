id: 2CO.13.10
reference: 2 Corinthians 13:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: ru
  text: Поэтому, пока я не с вами, я пишу всё это, чтобы, когда буду у вас, мне не пришлось действовать сурово[a], пользуясь властью, которую дал мне Господь, — властью для созидания, а не для разрушения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступить строго»; «обойтись с вами резко».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для назидания, а не для ниспровержения». В греческом тексте использован образ строительства: созидать, а не разрушать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Естественно передаёт причинно-следственную связь с предшествующим контекстом.
- source_word: ταῦτα
  choice: всё это
  rationale: Сохраняет указание на содержание письма или только что высказанные предостережения; русское «всё это» естественно передаёт греческое множественное число.
- source_word: ἀπὼν γράφω
  choice: пока я не с вами, я пишу
  rationale: Передаёт временное значение причастия и ясно противопоставляет отсутствие Павла его будущему личному присутствию.
- source_word: ἵνα παρὼν
  choice: чтобы, когда буду у вас
  rationale: ἵνα выражает цель, а παρών — присутствие Павла у адресатов; такой перевод естественен по-русски и не добавляет содержательной конкретизации.
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: мне не пришлось действовать сурово
  rationale: ἀποτόμως указывает на строгость или резкость, а χρήομαι в данном контексте — на образ действия. «Не пришлось» передаёт подразумеваемую нежелательную необходимость, не превращая фразу в простое обещание.
- source_word: κατὰ τὴν ἐξουσίαν
  choice: пользуясь властью
  rationale: В контексте речь идёт о применении данной Павлу власти. Формулировка естественна по-русски и связывает власть с возможным строгим действием.
- source_word: ἣν ὁ κύριος ἔδωκέν μοι
  choice: которую дал мне Господь
  rationale: Сохраняет титул κύριος без дополнительного уточнения его референта и естественно передаёт аорист ἔδωκεν прошедшим временем.
- source_word: εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν
  choice: для созидания, а не для разрушения
  rationale: Сохраняет строительное противопоставление и при этом звучит понятно и достойно в современном русском языке.
theological_decisions:
- issue: Кого обозначает титул ὁ κύριος в утверждении о дарованной Павлу власти
  choice: Господь
  alternative: 'Явно уточнить: «Господь Иисус» либо «Бог»'
  rationale: Сам стих содержит только титул ὁ κύριος. Перевод сохраняет эту открытость и не вносит более узкого богословского отождествления.
- issue: Назначение апостольской власти
  choice: власть для созидания, а не для разрушения
  alternative: для назидания, а не для уничтожения
  rationale: Формулировка сохраняет как положительное назначение власти, так и напряжение, связанное с возможностью строгого её применения, не ослабляя противопоставление Павла.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным синтаксисом. Повтор слова «властью» после тире делает назначение данной власти однозначным и не позволяет ошибочно отнести заключительную фразу только к Господу или к действию Павла. Строительная метафора сохранена.
