source:
  edition: SBLGNT
  text: Ἑαυτοὺς πειράζετε εἰ ἐστὲ ἐν τῇ πίστει, ἑαυτοὺς δοκιμάζετε· ἢ οὐκ ἐπιγινώσκετε ἑαυτοὺς ὅτι ⸂Ἰησοῦς Χριστὸς⸃ ἐν ⸀ὑμῖν; εἰ μήτι ἀδόκιμοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: ru
  text: 'Испытывайте себя: в вере ли вы?[a] Проверяйте себя. Или вы не осознаёте, что Иисус Христос[b] — в вас?[c] Если только вы не прошли проверки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «в вере» может означать как пребывание в христианской вере, так и обладание подлинной верой.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Иисус Мессия».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «среди вас».'
    reason: alternative_reading
lexical_decisions:
- source_word: πειράζετε
  choice: испытывайте
  rationale: В контексте речь не об искушении, а о проверке подлинности; «испытывайте» сохраняет оценочный смысл и естественно сочетается с «себя».
- source_word: ἐν τῇ πίστει
  choice: в вере
  rationale: Определённая греческая конструкция допускает как пребывание в христианской вере, так и обладание подлинной верой; буквальная и естественная русская формулировка сохраняет эту неоднозначность.
- source_word: δοκιμάζετε
  choice: проверяйте
  rationale: Глагол обозначает исследование с целью установить подлинность или одобрить; отдельный русский глагол передаёт близость к πειράζετε без ненужного полного повтора.
- source_word: ἐπιγινώσκετε
  choice: осознаёте
  rationale: В риторическом вопросе глагол выражает ясное узнавание и понимание. «Осознаёте» естественно передаёт этот смысл по-русски.
- source_word: Ἰησοῦς Χριστός
  choice: Иисус Христос
  rationale: «Христос» — укоренившийся в русском библейском и литературном употреблении эквивалент греческого титула Χριστός; смысловой вариант «Мессия» указан в примечании.
- source_word: ἐν ὑμῖν
  choice: в вас
  rationale: Контекст самоиспытания прежде всего поддерживает значение присутствия Христа в адресатах, хотя возможен и собирательный смысл «среди вас», отмеченный в примечании.
- source_word: εἰ μήτι
  choice: разве только
  rationale: Формула передаёт исключение с оттенком риторической оговорки и возможной иронии.
- source_word: ἀδόκιμοί
  choice: не выдержали испытания
  rationale: Прилагательное обозначает тех, кто при проверке оказался не соответствующим требованию. Формулировка сохраняет связь с начальными повелениями и не вносит позднейшего догматического оттенка слова «отверженные».
theological_decisions:
- issue: Смысл выражения ἐν τῇ πίστει
  choice: сохранить формулировку «в вере»
  alternative: являетесь ли вы истинно верующими / остаётесь ли вы в христианской вере
  rationale: Греческий текст допускает как субъективный смысл подлинной веры, так и пребывание в сфере исповедуемой христианской веры; перевод не разрешает эту напряжённость за читателя.
- issue: Передача Χριστός
  choice: Христос
  alternative: Мессия
  rationale: В современном русском «Иисус Христос» остаётся естественной и узнаваемой передачей греческого сочетания, а примечание раскрывает титульный смысл слова.
- issue: Смысл ἐν ὑμῖν
  choice: в вас
  alternative: среди вас
  rationale: Непосредственный призыв к самоиспытанию благоприятствует личностному смыслу, но форма множественного числа допускает также общинное прочтение; оно сохранено в примечании.
- issue: Смысл ἀδόκιμοι
  choice: не выдержали испытания
  alternative: оказались негодными / не прошли проверки
  rationale: Выражение описывает отрицательный результат проверки, не определяя шире богословский статус адресатов и не вводя нагруженное понятие «отверженности».
translation_notes:
  register: Современный литературный русский язык с краткими параллельными повелениями, отражающими риторическую плотность греческого текста. «Испытывайте» и «проверяйте» различают два близких глагола; финальная формулировка намеренно возвращает образ испытания. Все смысловые альтернативы, существенно влияющие на прочтение, вынесены в примечания.
