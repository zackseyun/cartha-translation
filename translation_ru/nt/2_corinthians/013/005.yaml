review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: два параллельных призыва к самоиспытанию, неоднозначное «в вере», риторический вопрос о присутствии Иисуса Христа и заключительное исключение сохранены. Однако εἰ μήτι ἀδόκιμοί ἐστε описывает актуальное отрицательное состояние/результат проверки, а не просто прошедшее действие; «если только вы не прошли проверки» передаёт это естественнее и точнее, чем «Разве только вы не выдержали испытания».'
  naturalness: Текст в целом современный и литературный. Связка «Разве только» после вопроса несколько тяжеловесна; «если только» естественно оформляет греческое исключение. Тире в «Иисус Христос — в вас» допустимо для интонационного выделения и не требует изменения.
