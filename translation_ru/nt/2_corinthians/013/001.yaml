base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: ru
  text: 'В третий раз я иду к вам: «Всякое дело будет подтверждено показаниями двух или трёх свидетелей»[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всякое слово будет установлено устами двух или трёх свидетелей». Греческий текст близко следует юридической формулировке Второзакония 19:15.'
    reason: lexical_alternative
  - marker: b
    text: Отсылка ко Второзаконию 19:15.
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: Вот уже в третий раз
  rationale: Винительный среднего рода употреблён обстоятельственно и указывает на третий приход Павла; оборот естественно передаёт повторность и актуальность объявленного посещения.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: я иду к вам
  rationale: Настоящее время ἔρχομαι в контексте имеет значение предстоящего прихода. «Иду к вам» сохраняет непосредственность и не уточняет стадию пути сверх сказанного в греческом тексте.
- source_word: ἐπὶ στόματος
  choice: свидетельством
  rationale: Это юридическая идиома, близко следующая Второзаконию 19:15. Функциональный русский эквивалент передаёт доказательную силу показаний; буквальный оборот сохранён в примечании.
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: двух или трёх свидетелей
  rationale: καί в устойчивой формуле имеет разделительно-перечислительный смысл «двух или трёх». Такой порядок слов естественен по-русски и сохраняет число свидетелей.
- source_word: σταθήσεται
  choice: будет подтверждено
  rationale: Будущее страдательного залога от ἵστημι в юридическом контексте означает, что дело получит надлежащее подтверждение или будет установлено.
- source_word: πᾶν ῥῆμα
  choice: всякое дело
  rationale: ῥῆμα буквально может означать «слово» или «высказывание», но в цитируемой юридической формуле обозначает рассматриваемое дело. Более буквальная возможность отмечена в сноске.
theological_decisions:
- issue: Применение правового принципа из Второзакония в контексте предстоящего посещения Павла
  choice: Передать цитату как общий принцип подтверждения всякого дела, не сужая её до конкретного обвинения или церковного взыскания.
  alternative: «Всякое слово» или более узкое «всякое обвинение».
  rationale: Греческий текст сохраняет широкую формулу Писания; перевод не должен заранее решать, относится ли образ двух или трёх свидетелей только к дисциплинарному разбирательству либо также к посещениям Павла.
translation_notes:
  register: Современный литературный русский язык с достойным, общедоступным звучанием. В основной строке юридическая идиома передана естественно; её буквальная форма и лексическая неоднозначность вынесены в примечание.
