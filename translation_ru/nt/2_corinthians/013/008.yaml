  text: οὐ γὰρ δυνάμεθά τι κατὰ τῆς ἀληθείας, ἀλλὰ ὑπὲρ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/008.yaml
  text: For we are not able to do anything against the truth[a], but for the truth.
translation:
  language: ru
  text: Ведь мы ничего не можем сделать против истины, но можем действовать в защиту истины.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь мы ничего не можем сделать против истины, но можем действовать в её поддержку».'
    reason: 'Лексическая альтернатива: ὑπέρ может быть передано как «в поддержку»; повторение глагола делает подразумеваемое в греческом действие явным и естественным по-русски.'
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Ведь ... не
  rationale: γάρ поясняет предыдущее утверждение; «ведь» естественно передаёт эту пояснительную связь, а οὐ отрицает сказуемое.
- source_word: δυνάμεθά τι
  choice: мы ничего не можем
  rationale: δύναμαι обозначает способность или возможность, а τι при отрицании естественно передаётся русским «ничего».
- source_word: κατὰ τῆς ἀληθείας
  choice: против истины
  rationale: κατά с родительным падежом имеет значение противодействия; артикль указывает на истину как определённую нравственную и духовную реальность.
- source_word: ἀλλὰ
  choice: но
  rationale: ἀλλά вводит резкое противопоставление двух параллельных выражений.
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: за истину
  rationale: ὑπέρ выражает действие в поддержку или на благо; «за истину» сохраняет краткую риторическую противоположность «против истины».
theological_decisions:
- issue: Значение выражения «истина» в антитезе Павла
  choice: Сохранено широкое выражение «истина» без сведения к конкретной вероучительной формуле.
  alternative: «истина Евангелия» или «то, что истинно»
  rationale: Контекст включает истину Евангелия и Божью реальность, однако сама формулировка шире; перевод не должен искусственно сужать её.
- issue: Смысл способности действовать против истины
  choice: Высказывание сохранено как категорическое риторическое утверждение Павла о направленности апостольского служения.
  alternative: Истолковать как абсолютную метафизическую невозможность любого поступка, противного истине.
  rationale: Текст говорит о «мы» в непосредственном контексте апостольского испытания и созидания общины; перевод сохраняет напряжение, не добавляя поясняющего толкования.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная антитеза сохранена. Частица «только» в основном тексте передаёт естественный ограничительный смысл конструкции οὐ ... ἀλλά в русском, хотя отдельного соответствующего слова в греческом нет; поэтому вариант без неё отражён смысловым образом в примечании.
