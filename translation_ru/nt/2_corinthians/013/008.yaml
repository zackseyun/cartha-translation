  source_fidelity: 'Основная антитеза передана верно: γάρ — «ведь», οὐ... τι — «ничего не можем», κατά — «против», а ὑπέρ — действие в пользу истины. Однако «только» в основном тексте является эксплицитным добавлением, которого в греческом тексте нет; противопоставление οὐ ... ἀλλά следует передать без отдельного ограничительного слова.'
  naturalness: «Ведь мы ничего не можем сделать против истины, но можем действовать в защиту истины» — современная литературная и ясная фраза. Повтор глагола делает эллипсис оригинала естественным по-русски, не меняя смысла.
  terminology: «Истина» обоснованно сохранена без догматического сужения. «В защиту истины» естественно и точно передаёт ὑπὲρ τῆς ἀληθείας как действие в её поддержку; имя или специальный богословский термин не добавляется.
  issues:
