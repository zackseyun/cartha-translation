revisions:
- from: Ведь мы ничего не можем против истины, но только за истину.[a]
  to: Ведь мы ничего не можем сделать против истины, но можем действовать в защиту истины.[a]
  rationale: Удалено не имеющее отдельного греческого соответствия «только». Для естественности русского синтаксиса во второй части раскрыт подразумеваемый глагол («можем действовать»). «В защиту истины» сохраняет значение ὑπέρ — действие на стороне, в поддержку истины — и не сужает значение «истины».
