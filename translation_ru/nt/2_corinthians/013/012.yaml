source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν ἁγίῳ φιλήματι. ἀσπάζονται ὑμᾶς οἱ ἅγιοι πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/012.yaml
  text: Greet one another with a holy kiss[b][a]. All the saints greet you.
translation:
  language: ru
  text: Приветствуйте друг друга святым поцелуем.[a] Вас приветствуют все святые.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священным поцелуем». Речь идёт о принятом в той культуре приветствии, которое выражало святость и христианское единство общины.'
    reason: lexical_alternative
  - marker: b
    text: Здесь «святые» — все верующие, то есть Божий святой народ, а не только особо почитаемые или канонизированные христиане.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Приветствуйте
  rationale: Аорист, медиальный императив второго лица множественного числа выражает прямое побуждение; «приветствуйте» естественно передаёт действие в контексте заключительных приветствий.
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Взаимное местоимение указывает на обоюдное действие членов общины; это обычное и ясное русское соответствие.
- source_word: ἐν ἁγίῳ φιλήματι
  choice: святым поцелуем
  rationale: Предлог ἐν в формуле приветствия естественно передаётся русским творительным падежом. «Святым» сохраняет смысл посвящённости Богу и чистоты общения, а «поцелуем» прямо передаёт φίλημα.
- source_word: ἀσπάζονται
  choice: приветствуют
  rationale: Настоящее время, медиальный индикатив третьего лица множественного числа; в эпистолярном контексте речь идёт о передаваемом адресатам приветствии.
- source_word: ὑμᾶς
  choice: вас
  rationale: Прямое дополнение во втором лице множественного числа; русская форма ясно сохраняет множественность адресатов.
- source_word: οἱ ἅγιοι πάντες
  choice: все святые
  rationale: «Святые» сохраняет устойчивое павловское обозначение верующих, а «все» передаёт πάντες без ослабления всеохватности.
theological_decisions:
- issue: Значение ἅγιοι как обозначения христианской общины
  choice: святые
  alternative: святые люди; Божий святой народ; верующие
  rationale: У Павла ἅγιοι обычно обозначает всех принадлежащих Богу верующих. «Святые» сохраняет ключевой термин и не ограничивает его позднейшей категорией особо прославленных или канонизированных христиан; пояснение вынесено в сноску.
- issue: Характер «святого поцелуя»
  choice: святым поцелуем
  alternative: священным поцелуем
  rationale: Буквальное и естественное выражение сохраняет конкретный телесный жест и его отмеченный святостью общинный характер, не превращая повеление в более общее «сердечное приветствие».
translation_notes:
  register: Современный литературный русский язык с лаконичной, достойной эпистолярной формулировкой. Сохранены конкретность жеста и традиционный павловский термин «святые»; потенциально неясные культурные и богословские оттенки пояснены в сносках.
