  text: τὰ δὲ πάντα ἐκ τοῦ θεοῦ τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ ⸀διὰ Χριστοῦ καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/018.yaml
  text: All these things are from God[a], who reconciled us to himself through Messiah and gave us the ministry of reconciliation[c][b],
translation:
  language: ru
  text: А всё это — от Бога[a], который примирил нас с Собой через Мессию и дал нам служение примирения[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё». Выражение может относиться ко всей новой реальности или, более конкретно, к только что сказанному.'
    reason: lexical_alternative
  - marker: b
    text: Греч. «через Христа»; здесь передано «через Мессию», поскольку Χριστός употреблено как титул.
    reason: alternative_reading
  - marker: c
    text: «Нас» и «нам» могут относиться к верующим в целом, однако в ближайшем контексте Павел особо говорит о поручении, данном ему и его сотрудникам.
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: А всё это
  rationale: Артиклированное среднее множественное τὰ πάντα в контексте естественно указывает на только что названные реалии, хотя может пониматься и шире; «всё это» сохраняет контекстуальную отсылку, а δέ передано мягким связующим «а».
- source_word: ἐκ τοῦ θεοῦ
  choice: от Бога
  rationale: ἐκ выражает источник или происхождение; краткая русская конструкция точно передаёт эту мысль.
- source_word: τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ
  choice: который примирил нас с Собой
  rationale: Причастный оборот естественно передан определительным придаточным; русское «примирить кого-либо с собой» точно выражает направленность восстановления отношений к Богу.
- source_word: διὰ Χριστοῦ
  choice: через Мессию
  rationale: διά с родительным обозначает посредство; Χριστός здесь сохраняет титульный смысл и передан как «Мессия».
- source_word: καὶ δόντος ἡμῖν
  choice: и поручил нам
  rationale: Буквально «и давшего нам»; с существительным «служение» глагол «поручил» естественно выражает дарование Богом ответственного служения, не меняя его источника.
- source_word: τὴν διακονίαν τῆς καταλλαγῆς
  choice: служение примирения
  rationale: διακονία обозначает порученное служение, а родительный τῆς καταλλαγῆς определяет его содержание или характер; лаконичная конструкция сохраняет эту открытость.
theological_decisions:
- issue: Значение Χριστοῦ
  choice: Мессия
  alternative: Христос
  rationale: В данном месте слово указывает на посредническую роль Помазанника и сохраняет значение титула.
- issue: Объём местоимений ἡμᾶς / ἡμῖν
  choice: нас / нам без уточнения
  alternative: всех верующих либо Павла и его сотрудников-апостолов
  rationale: Греческий текст сам не снимает напряжения между широким кругом верующих и особенно заметным в контексте апостольским поручением; основной текст не сужает референт.
- issue: Характер «служения примирения»
  choice: служение примирения
  alternative: служение, которое возвещает или осуществляет примирение
  rationale: Родительный падеж допускает оттенки содержания и направленности; буквальная компактная формулировка не определяет способ связи более узко, чем источник.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Тире подчёркивает источник всех названных реалий. Прописная буква в «Собой» следует принятому благоговейному русскому употреблению при отнесении местоимения к Богу. Все маркеры сносок присутствуют в основном тексте.
