  rationale: Заменено «поручил нам» на более прямое «дал нам», чтобы сохранить значение δόντος и не добавлять оттенок назначения. Сноска b приведена в соответствие с переводческим решением «Мессия» и английским аудит-трейлом. Сноски a и c сохранены без изменения; неоднозначность объёма «нас/нам» не разрешается в основном тексте.
