reference: 2 Corinthians 5:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ἐὰν ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους καταλυθῇ, οἰκοδομὴν ἐκ θεοῦ ἔχομεν οἰκίαν ἀχειροποίητον αἰώνιον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/001.yaml
  text: For we know that if our earthly tent-house is torn down[a], we have a building from God, a house not made with hands[d][c][b], eternal in the heavens.
translation:
  language: ru
  text: 'Ведь мы знаем: если наш земной дом-палатка[a] будет разобран[b], у нас есть[c] строение от Бога — нерукотворный[d], вечный дом на небесах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наш земной дом палатки». Греческий текст соединяет образы дома и палатки, говоря о нынешнем смертном жилище.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет разрушен» либо «будет снят». Глагол может обозначать разрушение или разборку сооружения, что соответствует образу палатки.'
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте сказано «у нас есть», а не «у нас будет»; тем самым сохраняется напряжение между нынешним обладанием и будущим осуществлением.
    reason: alternative_reading
  - marker: d
    text: То есть не созданный человеческими руками; выражение подчёркивает божественное, а не человеческое происхождение этого дома.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν γὰρ
  choice: Ведь мы знаем
  rationale: «Знаем» передаёт уверенное знание, выраженное οἴδαμεν, а «ведь» естественно связывает стих с предшествующим рассуждением, сохраняя пояснительную силу γάρ.
- source_word: ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους
  choice: наш земной дом — эта палатка
  rationale: Формулировка сохраняет оба образа исходного текста — дома и палатки — и не подменяет их прямым толкованием «тело».
- source_word: ἐὰν ... καταλυθῇ
  choice: если ... будет разобран
  rationale: Условная конструкция указывает на будущую возможность, а «будет разобран» передаёт образ снятия или разборки сооружения и особенно подходит к палатке.
- source_word: οἰκοδομὴν ἐκ θεοῦ
  choice: строение от Бога
  rationale: Существительное понято конкретно, как сооружение; «от Бога» прямо передаёт происхождение, выраженное ἐκ θεοῦ.
- source_word: ἔχομεν
  choice: у нас есть
  rationale: Сохранено настоящее время греческого глагола без истолковывающей замены будущим временем.
- source_word: οἰκίαν ἀχειροποίητον
  choice: нерукотворный дом
  rationale: «Нерукотворный» кратко и узнаваемо передаёт отсутствие человеческого изготовления и сохраняет библейское звучание выражения.
- source_word: αἰώνιον
  choice: вечный
  rationale: Слово подчёркивает непреходящий характер небесного дома в противопоставлении временному земному жилищу.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: на небесах
  rationale: Обычное русское библейское выражение естественно передаёт греческую форму множественного числа.
theological_decisions:
- issue: К чему относятся образы дома и палатки
  choice: Сохранить в основном тексте образы дома, палатки и строения.
  alternative: 'Передать подразумеваемый смысл прямо: «если наше земное тело будет уничтожено».'
  rationale: Прямая замена словом «тело» сняла бы образную многослойность Павловой речи и внесла бы толкование в основной текст.
- issue: Временное значение ἔχομεν
  choice: 'Передать настоящим временем: «у нас есть».'
  alternative: «У нас будет».
  rationale: В исходном тексте стоит настоящее время. Перевод сохраняет напряжение между нынешним обладанием и будущим осуществлением, не разрешая богословский вопрос за читателя.
- issue: Смысл небесного нерукотворного дома
  choice: Не уточнять в переводе, обозначает ли он воскресшее тело, небесное жилище или иную эсхатологическую реальность.
  alternative: Назвать его прямо «воскресшим телом».
  rationale: Сам стих сохраняет архитектурную образность и не даёт прямого пояснения; конкретизация сузила бы возможный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Тире делает сочетание образов дома и палатки естественным для русского читателя, а слова «нерукотворный» и «на небесах» сохраняют узнаваемое библейское звучание без архаизации всего предложения.
