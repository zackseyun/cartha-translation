source:
  edition: SBLGNT
  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: ru
  text: Мы не рекомендуем себя вам снова, а даём вам повод хвалиться нами, чтобы вам было что ответить тем, кто хвалится внешним, а не тем, что находится в сердце.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кто хвалится лицом, а не сердцем»; то есть внешним, видимым, а не тем, что находится в сердце.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνομεν
  choice: рекомендуем
  rationale: В данном контексте глагол означает представлять в благоприятном свете, удостоверять достоинство или рекомендовать; «рекомендуем вам самих себя» естественно передаёт идею саморекомендации.
- source_word: ἀφορμὴν
  choice: повод
  rationale: Слово обозначает основание, повод или возможность; «даём повод» кратко и естественно сочетается с последующим родительным καυχήματος.
- source_word: καυχήματος
  choice: хвалиться
  rationale: Инфинитивное выражение «повод хвалиться» естественно по-русски передаёт значение существительного и сохраняет словесную связь с последующим καυχωμένους.
- source_word: ὑπὲρ ἡμῶν
  choice: нами
  rationale: В контексте речь идёт о том, что коринфяне смогут с похвалой говорить о Павле и его сотрудниках; творительный после «хвалиться» передаёт это без избыточного уточнения, оставляя возможным оттенок выступления в их защиту.
- source_word: ἵνα ἔχητε πρὸς
  choice: чтобы вам было что ответить
  rationale: Греческое выражение подразумевает наличие того, что можно сказать оппонентам; такой перевод естественно выражает подразумеваемый ответ, не добавляя его содержания.
- source_word: ἐν προσώπῳ
  choice: внешним
  rationale: Буквально выражение связано с «лицом», но в противопоставлении сердцу указывает на видимую сторону, внешний облик или впечатление.
- source_word: καυχωμένους
  choice: тем, кто хвалится
  rationale: «Хвалится» сохраняет повтор того же смыслового корня, что и καυχήματος, и передаёт риторический контраст стиха.
- source_word: καρδίᾳ
  choice: тем, что в сердце
  rationale: Сохраняется библейский образ сердца как внутренней реальности человека, без сведения смысла только к искренности или намерениям.
- source_word: πάλιν
  choice: снова
  rationale: Наречие прямо обозначает повторность и естественно относится к отрицанию очередной саморекомендации.
theological_decisions:
- issue: Противопоставление ἐν προσώπῳ и ἐν καρδίᾳ
  choice: «внешним, а не тем, что в сердце»
  alternative: «лицом, а не сердцем»; «внешностью, а не внутренней сущностью»
  rationale: Перевод сохраняет противопоставление видимого и внутреннего, не сужая «сердце» до одной лишь искренности и не вводя отвлечённое понятие «сущности», которого в тексте нет.
- issue: Направленность ὑπὲρ ἡμῶν
  choice: «хвалиться нами»
  alternative: «хвалиться от нашего имени»; «выступить в нашу защиту»
  rationale: Творительный естественно допускает смысл похвалы по поводу апостолов, тогда как цель последующей фразы показывает возможную защитительную функцию; перевод не делает этот оттенок единственным значением.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Повтор «хвалиться» намеренно сохраняет связь καύχημα — καυχάομαι. Конструкция «рекомендуем вам самих себя» несколько формальна, но точно отражает апостольскую тему саморекомендации и понятна современному читателю.
