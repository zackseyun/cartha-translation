  source_fidelity: 'Перевод точно передаёт все основные элементы греческого текста: пояснительно-усилительное καὶ γάρ («Ведь и»), намеренно неуточнённое ἐν τούτῳ («в этом»), στενάζομεν («стенаем»), сильное желание ἐπιποθοῦντες («горячо желая»), жилище, происходящее «с неба», и образ ἐπενδύσασθαι («облечься»). Неоднозначность образа жилища/одеяния сохранена.'
  naturalness: Фраза звучит как современный литературный русский с уместным умеренно возвышенным библейским регистром. «Стенаем» и «облечься» не разговорны, но естественны для этого жанра. Сочетание «жилище с неба» несколько необычно в повседневной речи, однако намеренно и точно сохраняет указание на происхождение, а не на качество жилища.
  terminology: «Жилище», «облечься» и «стенаем» последовательно сохраняют образный и богословски неразрешённый язык оригинала. Сноска a корректно поясняет различие между «с неба» и «небесное», а сноска b верно отмечает оттенок «надеть поверх». Якоря сносок стоят у соответствующих слов.
