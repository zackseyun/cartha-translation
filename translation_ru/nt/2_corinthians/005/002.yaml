  text: καὶ γὰρ ἐν τούτῳ στενάζομεν, τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ ἐπενδύσασθαι ἐπιποθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/002.yaml
  text: For indeed in this we groan[a], longing to put on our dwelling from heaven[b],
translation:
  language: ru
  text: Ведь и в этом мы стенаем, горячо желая облечься[b] в наше жилище с неба[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «наше небесное жилище». Буквально по-гречески: «наше жилище с неба», что подчёркивает его происхождение.'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол может означать «надеть поверх» — как верхнюю одежду поверх уже надетой.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Ведь и
  rationale: Сочетание связывает стих с предыдущей мыслью, одновременно передавая пояснительный и слегка усилительный оттенок.
- source_word: ἐν τούτῳ
  choice: в этом
  rationale: Близкая к форме оригинала передача сохраняет неоднозначность указательного выражения. В контексте оно, вероятно, относится к нынешнему телесному состоянию, однако греческий текст не повторяет слово «шатёр».
- source_word: στενάζομεν
  choice: мы стенаем
  rationale: Глагол передаёт тягостный внутренний вздох и томление; «стенаем» сохраняет силу образа и подходит к достоинству библейского регистра.
- source_word: τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ
  choice: наше жилище с неба
  rationale: «Жилище» сохраняет предметную метафору, а «с неба» — значение происхождения в ἐξ οὐρανοῦ, не превращая его лишь в качественное определение «небесное».
- source_word: ἐπενδύσασθαι
  choice: облечься
  rationale: Русское «облечься» естественно поддерживает метафору одежды. Более узкий оттенок надевания поверх уже имеющегося передан в сноске.
- source_word: ἐπιποθοῦντες
  choice: горячо желая
  rationale: Причастие обозначает сильное, настойчивое желание; это выражение ясно и естественно передаёт его интенсивность.
theological_decisions:
- issue: Смысл образа небесного облечения
  choice: Сохранить совмещение образов жилища и одежды, не уточняя, идёт ли речь именно о воскресшем теле, промежуточном состоянии или эсхатологическом небесном обиталище.
  alternative: Передать как «тело воскресения с неба» либо как «небесный дом».
  rationale: Сам стих не разрешает богословское напряжение между возможными толкованиями; конкретизация внесла бы в перевод вывод, которого нет в формулировке оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка «в этом» намеренно сохраняет референциальную неоднозначность оригинала; метафоры жилища и одежды не сглажены.
