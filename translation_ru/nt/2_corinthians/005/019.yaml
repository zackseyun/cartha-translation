source:
  edition: SBLGNT
  text: ὡς ὅτι θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/019.yaml
  text: namely[a], that God was in Messiah reconciling the world to himself, not counting their trespasses against them[d][c][b], and entrusting to us the message of reconciliation.
translation:
  language: ru
  text: 'а именно: Бог был во Мессии, примиряя мир с Собой, не ставя людям в счёт их проступки, и вверил нам[a] весть о примирении[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поместив в нас»; возможно также: «среди нас».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слово примирения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ὅτι
  choice: то есть
  rationale: Оборот вводит пояснение к предшествующему утверждению. Русское «то есть» естественно передаёт пояснительную силу без неуклюжего «то есть, что».
- source_word: θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων
  choice: Бог во Мессии примирял мир с Собой
  rationale: Греческая перифрастическая конструкция с ἦν и причастием естественно передаётся русским глаголом прошедшего времени. «Во Мессии» сохраняет ἐν и не сводит его однозначно к инструментальному «через Мессию».
- source_word: Χριστῷ
  choice: Мессии
  rationale: Χριστός здесь является титулом; «Мессия» передаёт его смысл, а не превращает в непереведённое имя-подобное обозначение.
- source_word: κόσμον
  choice: мир
  rationale: Обычный широкий русский эквивалент, который в данном контексте охватывает отчуждённое от Бога человечество и не ограничивает смысл физической вселенной.
- source_word: καταλλάσσων ... καταλλαγῆς
  choice: примирял ... примирения
  rationale: Сохраняется повтор одного корня и центральный для стиха образ восстановления отношений.
- source_word: μὴ λογιζόμενος αὐτοῖς
  choice: не ставя людям в счёт
  rationale: Современная русская идиома ясно сохраняет расчётно-учётную метафору λογίζομαι. «Людям» раскрывает множественное местоимение αὐτοῖς после собирательного «мир» и избегает неясного «им».
- source_word: τὰ παραπτώματα αὐτῶν
  choice: их проступки
  rationale: «Проступки» передаёт конкретные нарушения и сохраняет более узкий оттенок παράπτωμα по сравнению с общим «грехи».
- source_word: καὶ θέμενος ἐν ἡμῖν
  choice: и вложил в нас
  rationale: Русское «вложил в нас» сохраняет конкретный смысл τίθημι и предлог ἐν, при этом звучит естественно. Личная форма согласована с главным глаголом и передаёт координацию причастных действий.
- source_word: τὸν λόγον τῆς καταλλαγῆς
  choice: слово примирения
  rationale: Формально сохраняет λόγος и родительную конструкцию, не исключая смысла провозглашаемой вести.
theological_decisions:
- issue: Связь ἐν Χριστῷ с θεὸς ἦν и καταλλάσσων
  choice: Бог во Мессии примирял мир с Собой
  alternative: Бог был во Мессии, примиряя мир с Собой
  rationale: Основной текст сохраняет «во Мессии», но не заставляет русского читателя понимать фразу исключительно как утверждение о местопребывании Бога. Сноска сохраняет более буквальную синтаксическую возможность и богословское напряжение.
- issue: Передача Χριστός как титула
  choice: Мессия
  alternative: Христос
  rationale: В данном христологическом обороте слово сохраняет титульное значение; смысловой перевод «Мессия» делает его явным без добавления конфессионального толкования.
- issue: Значение ἐν ἡμῖν
  choice: в нас
  alternative: среди нас; нам
  rationale: Основной текст прямо сохраняет предлог ἐν и допускает внутренний либо корпоративный оттенок; идиоматические служебные понимания приведены в сноске, а не навязаны тексту.
translation_notes:
  register: 'Современный литературный русский язык: ясный, достойный и пригодный для публичного чтения. «С Собой» оформлено с прописной буквы как уважительное указание на Бога. Выражение «ставя в счёт» понятно обычному читателю и сохраняет исходную метафору без специального богословского термина «вменять».'
