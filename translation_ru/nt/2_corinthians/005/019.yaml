  rationale: Исправление восстанавливает явное соответствие ἦν («был») и избегает неестественного русского образа «вложил в нас слово». Идиоматическое «вверил нам» точно передаёт функцию θέμενος в данном контексте, а сноска при «нам» сохраняет буквальное и спорное значение ἐν ἡμῖν. «А именно:» естественно вводит пояснительное содержание ὡς ὅτι.
