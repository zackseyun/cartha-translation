  text: ὁ δὲ κατεργασάμενος ἡμᾶς εἰς αὐτὸ τοῦτο θεός, ⸀ὁ δοὺς ἡμῖν τὸν ἀρραβῶνα τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: The one who prepared us for this very thing is God[b][a], who gave us the down payment of the Spirit.
translation:
  language: ru
  text: Бог, подготовивший нас именно к этому, дал нам задаток[a] Духа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «залог», «первый взнос» либо «первая часть обещанного».'
    reason: lexical_alternative
  - marker: b
    text: Выражение может означать, что сам Дух является задатком, или что Бог дал залог того, что Дух доведёт это до завершения.
    reason: alternative_reading
lexical_decisions:
- source_word: κατεργασάμενος
  choice: подготовивший
  rationale: В контексте речь идёт о целенаправленном Божьем приготовлении верующих к будущей жизни, о которой сказано в ст. 1–4. «Подготовивший» естественно передаёт направленность действия, не сводя его к механическому «сделавший».
- source_word: δὲ
  choice: же
  rationale: Постпозитивная частица «же» передаёт мягкий переход или развитие мысли без внесения сильного противопоставления или временного значения.
- source_word: εἰς αὐτὸ τοῦτο
  choice: именно к этому
  rationale: Оборот подчёркнуто указывает на только что описанную цель; «именно к этому» сохраняет и указание на контекст, и эмфатическую силу αὐτό.
- source_word: θεός
  choice: Бог
  rationale: Прямое обозначение того, кто подготовил верующих.
- source_word: δοὺς
  choice: давший
  rationale: Причастная форма естественно сохраняет греческую структуру и связывает дар Духа с Божьим приготовлением.
- source_word: ἀρραβῶνα
  choice: задаток
  rationale: «Задаток» сохраняет образ первой предоставленной части, которая служит обеспечением последующего полного исполнения обещанного. Это точнее конкретной метафоры, чем отвлечённая «гарантия».
- source_word: τοῦ πνεύματος
  choice: Духа
  rationale: 'Родительный падеж сохраняет неоднозначность греческого выражения: Дух может пониматься как сам задаток либо как связанный с Духом залог будущего исполнения.'
theological_decisions:
- issue: Смысл выражения «задаток Духа»
  choice: В основном тексте сохранён родительный оборот без явного уточнения; наиболее вероятно, что сам Святой Дух является данным верующим задатком будущей полноты жизни.
  alternative: Выражение можно понимать как задаток или гарантию того, что Дух доведёт до завершения.
  rationale: Употребление ἀρραβών в 2 Кор 1:22 и Еф 1:13–14 поддерживает понимание Духа как самого начатка и гарантии будущего наследия, однако грамматическая форма допускает более широкое прочтение, поэтому оно не закреплено однозначно в основном тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Инверсия «Подготовивший же… — Бог» сохраняет акцент исходного предложения, а термины пояснены без внесения конфессионально специфического толкования.
