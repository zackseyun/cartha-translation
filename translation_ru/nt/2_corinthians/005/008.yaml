  text: θαρροῦμεν δὲ καὶ εὐδοκοῦμεν μᾶλλον ἐκδημῆσαι ἐκ τοῦ σώματος καὶ ἐνδημῆσαι πρὸς τὸν κύριον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: ru
  text: Итак, мы уверены и предпочитаем скорее покинуть тело и быть дома у Господа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уйти из тела и быть у Господа».'
    reason: 'Лексическая альтернатива: более прямой вариант передаёт контраст ἐκδημῆσαι и ἐνδημῆσαι, но слабее сохраняет образ пребывания дома.'
lexical_decisions:
- source_word: θαρροῦμεν
  choice: мы полны уверенности
  rationale: Настоящее время передаёт устойчивую смелость и уверенность; выражение естественно для современного литературного русского языка.
- source_word: δὲ
  choice: итак
  rationale: Частица продолжает и подытоживает мысль стихов 6–7, а не вводит резкое противопоставление.
- source_word: καὶ
  choice: и
  rationale: Соединяет уверенность говорящих с выражаемым ими предпочтением.
- source_word: εὐδοκοῦμεν μᾶλλον
  choice: предпочли бы
  rationale: В сочетании с μᾶλλον глагол выражает предпочтение; условная форма по-русски естественно передаёт желательность этого состояния.
- source_word: ἐκδημῆσαι ἐκ τοῦ σώματος
  choice: покинуть тело
  rationale: Передаёт образ ухода из места пребывания и сохраняет буквальное упоминание тела, не добавляя прямого слова «умереть».
- source_word: ἐνδημῆσαι πρὸς τὸν κύριον
  choice: поселиться у Господа
  rationale: Сохраняет пространственно-домашний образ парного глагола ἐνδημέω и передаёт личное пребывание рядом с Господом.
theological_decisions:
- issue: Следует ли прямо истолковать образ как смерть и пребывание на небе
  choice: Сохранить образ ухода из тела и поселения у Господа без пояснений «умереть» или «на небе».
  alternative: 'Перевести: «умереть и отправиться на небо к Господу».'
  rationale: Стих подразумевает посмертное пребывание с Господом, но греческий текст выражает это метафорически; перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык; тон ясный и достойный. Домашне-пространственная метафора сохранена без конфессионального истолкования.
