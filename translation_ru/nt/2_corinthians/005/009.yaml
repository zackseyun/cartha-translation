  text: διὸ καὶ φιλοτιμούμεθα, εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες, εὐάρεστοι αὐτῷ εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/009.yaml
  text: Therefore we also make it our ambition[a], whether at home or away, to be pleasing to him.
translation:
  language: ru
  text: Поэтому мы и стремимся — пребываем ли мы дома или вдали[a] — быть угодными Ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть, судя по контексту: «дома, в теле, или вдали от тела».'
    reason: Поясняет подразумеваемые дополнения, не вводя их в основной текст, где в греческом они отсутствуют.
lexical_decisions:
- source_word: διὸ
  choice: И потому
  rationale: Передаёт вывод из предшествующего рассуждения о жизни в теле и пребывании с Господом; начальное «и» также естественно включает последующее καὶ в связный русский текст.
- source_word: καὶ
  choice: и (в сочетании «И потому»)
  rationale: Сохраняет присоединительно-усилительную связь с предыдущей мыслью, не перегружая русскую фразу отдельным «также».
- source_word: φιλοτιμούμεθα
  choice: мы стремимся
  rationale: Глагол обозначает ревностное, осознанное стремление к цели. Русское «стремимся» звучит естественно и достойно; оттенок целеустремлённости поддерживается всей конструкцией.
- source_word: εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες
  choice: дома ли мы или вдали
  rationale: Сохраняет краткую образную пару греческого текста, где дополнения не выражены; их телесный смысл определяется ближайшим контекстом и поясняется в сноске.
- source_word: εὐάρεστοι
  choice: угодными
  rationale: «Угодными» точно и естественно выражает значение того, что приятно и приемлемо для Господа, и соответствует возвышенному, но современному библейскому регистру.
- source_word: αὐτῷ
  choice: Ему
  rationale: Передаёт местоимение без подстановки существительного; по контексту оно относится к Господу.
- source_word: εἶναι
  choice: быть
  rationale: 'Инфинитив прямо передаёт цель стремления: быть угодными Ему.'
theological_decisions:
- issue: Следует ли раскрывать подразумеваемые дополнения при «дома» и «вдали»
  choice: В основном тексте сохранить краткое «дома ли мы или вдали»
  alternative: «дома, в теле, или вдали от тела»
  rationale: В стихах 6–8 речь явно идёт о пребывании в теле и удалении от тела, однако в самом стихе 9 Павел оставляет дополнения невысказанными. Краткая формулировка сохраняет форму и некоторую образную открытость оригинала, а контекстуальный смысл указывается в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным и достойным библейским звучанием. Тире выделяют противопоставленную обстоятельственную конструкцию и сохраняют ясность длинной фразы; прописная буква в «Ему» указывает на Господа по контексту.
