  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὥστε ἡμεῖς ἀπὸ τοῦ νῦν οὐδένα οἴδαμεν κατὰ σάρκα· ⸀εἰ καὶ ἐγνώκαμεν κατὰ σάρκα Χριστόν, ἀλλὰ νῦν οὐκέτι γινώσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/016.yaml
  text: So from now on we regard no one according to the flesh[a]. Even if we have known Messiah according to the flesh[b], yet now we no longer know him that way.
translation:
  language: ru
  text: Итак, отныне мы никого не знаем по плоти[a]. Даже если мы и знали Мессию[b] по плоти, всё же теперь уже не знаем его так.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с человеческой точки зрения»; «по мирским меркам».'
    reason: lexical_alternative
  - marker: b
    text: 'Греч. Χριστόν, винительный падеж от Χριστός, «Помазанник»; традиционно: «Христа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Итак
  rationale: Передаёт вывод, который Павел делает из предшествующего рассуждения, и естественно звучит в современном русском тексте.
- source_word: ἀπὸ τοῦ νῦν
  choice: отныне
  rationale: Кратко и точно обозначает решительную перемену, действующую с настоящего времени.
- source_word: οὐδένα οἴδαμεν
  choice: мы никого не знаем
  rationale: Сохраняет основной смысл οἴδαμεν и намеренную связь с последующим ἐγνώκαμεν и γινώσκομεν; более истолковывающее «не оцениваем» оставлено для пояснения.
- source_word: κατὰ σάρκα
  choice: по плоти
  rationale: Сохраняет значимый для Павла термин σάρξ и естественную библейскую формулу; здесь речь идёт о знании или оценке в пределах обычных человеческих, земных категорий.
- source_word: εἰ καὶ
  choice: Даже если
  rationale: Сохраняет формальную условно-уступительную неоднозначность греческого выражения, не превращая её без необходимости в однозначное «хотя».
- source_word: ἐγνώκαμεν
  choice: мы и знали
  rationale: Русское прошедшее время естественно выражает прежний способ знания; частица «и» передаёт уступительную конструкцию εἰ καὶ.
- source_word: Χριστόν
  choice: Мессию
  rationale: Передаёт смысл греческого титула Χριστός, а не обращается с ним как исключительно с личным именем.
- source_word: ἀλλὰ νῦν οὐκέτι γινώσκομεν
  choice: теперь уже не знаем Его так
  rationale: Передаёт резкий контраст с прежним знанием; «Его» восстанавливает подразумеваемое дополнение, а «так» ясно относит отрицание к способу знания, не утверждая полного незнания Мессии.
theological_decisions:
- issue: Смысл выражения κατὰ σάρκα применительно к людям и Мессии
  choice: В основном тексте сохранено «по плоти», то есть в рамках лишь человеческого, земного способа восприятия.
  alternative: «с человеческой точки зрения»; «по мирским меркам»
  rationale: Формулировка сохраняет богословское напряжение и терминологию Павла. Стих отвергает прежний ограниченный способ знания или оценки, а не истинную человечность Мессии.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном месте слово обозначает титул Иисуса; «Мессия» делает его смысл доступным современному читателю, не добавляя конфессионально-специфического толкования.
- issue: Условный или уступительный оттенок εἰ καὶ
  choice: Даже если
  alternative: «Хотя»; «даже если и вправду»
  rationale: Греческая конструкция допускает условно-уступительное прочтение. Выбранный вариант сохраняет эту неоднозначность и не решает без достаточных оснований вопрос о характере прежнего знания Павла о земном Иисусе.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «знаем — знали — не знаем» намеренно сохранён ради словесной и смысловой связи трёх греческих глагольных форм. Заглавное «Его» употреблено как традиционный русский знак уважения и для ясной отсылки к Мессии.
