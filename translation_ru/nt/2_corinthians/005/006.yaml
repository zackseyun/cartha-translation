lexical_decisions:
- source_word: Θαρροῦντες
  choice: мы ... полны мужества
  rationale: Причастие настоящего времени выражает продолжающееся состояние бодрости и смелости. Личная глагольная конструкция естественна по-русски и сохраняет смысл.
- source_word: οὖν
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения Павла.
- source_word: πάντοτε
  choice: всегда
  rationale: Точно передаёт значение постоянства.
- source_word: εἰδότες
  choice: и знаем
  rationale: Перфектное причастие οἶδα имеет значение настоящего времени и обозначает устойчивое знание.
- source_word: ἐνδημοῦντες
  choice: пока мы у себя дома
  rationale: Сохраняет образ пребывания дома и его смысловую пару с ἐκδημοῦμεν.
- source_word: ἐν τῷ σώματι
  choice: в теле
  rationale: Прямо передаёт местное значение выражения, не добавляя отсутствующего в греческом указания «этом».
- source_word: ἐκδημοῦμεν
  choice: мы вдали
  rationale: Естественно передаёт пребывание вне дома и сохраняет пространственно-бытовую метафору в противопоставлении ἐνδημοῦντες.
- source_word: ἀπὸ τοῦ κυρίου
  choice: от Господа
  rationale: Предлог ἀπό обозначает удалённость, а κύριος передан традиционным и ясным словом «Господь».
theological_decisions:
- issue: Противопоставление телесной жизни и пребывания с Господом
  choice: Сохранена формулировка «у себя дома в теле» и «вдали от Господа».
  alternative: Истолковать слова как полное духовное отделение от Христа или внести сюда формулировку следующего стиха о выходе из тела и водворении у Господа.
  rationale: Стих противопоставляет нынешнее телесное существование ещё не наступившему пребыванию с Господом, но не утверждает полного отсутствия общения или связи с Христом. Перевод сохраняет эту напряжённость и не привносит содержание стиха 8.
translation_notes:
  register: Современный литературный русский язык с сохранением домашне-пространственной метафоры оригинала. «Полны мужества» звучит достойно и естественно, не сводя θαρρέω лишь к субъективной уверенности.
