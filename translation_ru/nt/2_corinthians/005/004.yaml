revisions:
- from: Ибо мы, находясь в этом шатре, стонем под бременем, потому что хотим не совлечься, а облечься свыше[a], чтобы смертное было поглощено жизнью[b].
  to: Ведь и мы, находясь в шатре, стонем, отягощённые бременем, потому что хотим не совлечься, а облечься поверх[a], чтобы смертное было поглощено жизнью[b].
  rationale: Перевод исправлен только там, где «свыше» меняло пространственно-образный смысл ἐπενδύσασθαι и могло придавать фразе отсутствующий в оригинале небесный оттенок. «Ведь и мы» передаёт καὶ γάρ, а «в шатре» избегает добавленного указательного значения. Остальная метафорика и синтаксическая сдержанность сохранены.
