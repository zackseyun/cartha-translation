source:
  edition: SBLGNT
  text: καὶ γὰρ οἱ ὄντες ἐν τῷ σκήνει στενάζομεν βαρούμενοι ἐφ’ ᾧ οὐ θέλομεν ἐκδύσασθαι ἀλλ’ ἐπενδύσασθαι, ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/004.yaml
  text: For indeed[a], while we are in this tent, we groan, being burdened, because we do not want to be unclothed but to be further clothed[b], so that what is mortal may be swallowed up by life.
translation:
  language: ru
  text: Ведь и мы, находясь в шатре, стонем, отягощённые бременем, потому что хотим не совлечься, а облечься поверх[a], чтобы смертное было поглощено жизнью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «облечься дополнительно». Греческий глагол может обозначать надевание одежды поверх той, которая уже надета.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы смертность была поглощена жизнью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκήνει
  choice: шатре
  rationale: Сохраняет метафору нынешнего телесного существования и связь с ближайшим контекстом; слово «шатёр» естественно и понятно в современном русском.
- source_word: στενάζομεν
  choice: стонем
  rationale: Передаёт тяжесть состояния и напряжённое эсхатологическое ожидание сильнее, чем «вздыхаем».
- source_word: βαρούμενοι
  choice: под бременем
  rationale: Естественно передаёт пассивный смысл «будучи отягощены» и объясняет сопутствующую стону тяжесть.
- source_word: ἐφ’ ᾧ
  choice: потому что
  rationale: В данном контексте наиболее естественно вводит причину стона, сохраняя синтаксическую неоднозначность на уровне пояснения без искусственной буквальности.
- source_word: ἐκδύσασθαι
  choice: совлечься
  rationale: Сохраняет образ снятия одежды и не добавляет спорного толкования о состоянии после смерти.
- source_word: ἐπενδύσασθαι
  choice: облечься свыше
  rationale: Передаёт идею дополнительного облачения поверх уже имеющегося; примечание раскрывает буквальный оттенок сложного глагола.
- source_word: καταποθῇ
  choice: было поглощено
  rationale: Сохраняет яркий образ полного преодоления смертного жизнью и пассивную форму оригинала.
- source_word: τὸ θνητόν
  choice: смертное
  rationale: Субстантивированное прилагательное сохраняет широту греческого выражения и не сводит его только к абстрактной «смертности».
- source_word: ζωῆς
  choice: жизнью
  rationale: Естественно выражает средство или действующую силу в пассивной конструкции и сохраняет контраст со смертным.
- source_word: καὶ γὰρ
  choice: ибо
  rationale: Связывает стих с предшествующей мыслью как пояснение; отдельное усиление καί в русском контексте можно не выражать без существенной потери смысла.
theological_decisions:
- issue: Метафора облачения и промежуточное состояние
  choice: Сохранить образы «совлечься» и «облечься свыше», не определяя их как конкретную доктрину о промежуточном состоянии или исключительно о воскресшем теле.
  alternative: Явно истолковать «совлечься» как бесплотное существование, а «облечься» — исключительно как получение воскресшего тела.
  rationale: Греческий текст говорит метафорически и оставляет богословское напряжение; перевод не должен разрешать спорный вопрос за автора.
- issue: Предмет желания при οὐ θέλομεν ... ἀλλ’
  choice: 'Передать прямо: «хотим не совлечься, а облечься свыше».'
  alternative: 'Связать отрицание преимущественно с причиной стона: «стонем не потому, что хотим совлечься...»'
  rationale: Выбранный вариант естественно следует ближайшему синтаксису и сохраняет контраст двух инфинитивов, не добавляя объяснения мотивов Павла.
translation_notes:
  register: Современный литературный русский с сохранением возвышенной павловой метафорики. «Совлечься» несколько книжное, но образно точное и хорошо образует пару с «облечься»; смысл уточнён примечанием.
