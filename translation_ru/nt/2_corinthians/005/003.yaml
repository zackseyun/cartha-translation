translation:
  language: ru
  text: Если только мы, одевшись, и в самом деле не окажемся нагими.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если только мы, облачившись, не окажемся неодетыми».'
    reason: 'Лексико-синтаксическая альтернатива: ἐνδυσάμενοι можно передать как «облачившись», а γυμνοί — как «неодетыми».'
lexical_decisions:
- source_word: εἴ γε
  choice: если только… и в самом деле
  rationale: Сочетание сохраняет условную силу εἰ и усилительный оттенок γε, не превращая условие в утверждение.
- source_word: καὶ
  choice: и
  rationale: Частица сохранена в естественном русском сочетании «и в самом деле»; такая передача отражает её связующую или усилительную роль, не навязывая исключительно временного значения.
- source_word: ἐνδυσάμενοι
  choice: одевшись
  rationale: Аористное причастие среднего залога буквально передаёт действие субъекта — «надев на себя, одевшись» — и сохраняет образ одежды.
- source_word: οὐ
  choice: не
  rationale: Прямая передача отрицания при будущем сказуемом.
- source_word: γυμνοὶ
  choice: нагими
  rationale: Прямое и стилистически достойное соответствие γυμνοί, сохраняющее метафору и её богословскую неоднозначность.
- source_word: εὑρεθησόμεθα
  choice: не окажемся
  rationale: В данном предикативном употреблении пассивная форма естественно передаётся по-русски как «окажемся», то есть «будем обнаружены/найдены в таком состоянии».
theological_decisions:
- issue: Смысл образов одежды и наготы
  choice: Сохранить образ, не уточняя, означает ли нагота бестелесное состояние, отсутствие небесного тела или стыд и открытость перед Богом.
  alternative: Истолковать «нагими» как конкретное промежуточное состояние после смерти либо как отсутствие воскресшего тела.
  rationale: Сам стих не определяет однозначно богословский референт метафоры, поэтому перевод не должен разрешать эту напряжённость за Павла.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Нагими» выбрано вместо разговорного «голыми»; инверсия и причастная конструкция сохраняют плотность и условность греческой фразы.
