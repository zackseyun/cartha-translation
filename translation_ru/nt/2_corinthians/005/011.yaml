base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/011.yaml
  text: Therefore[a], knowing the fear of the Lord, we persuade people; but we have been made known to God[b], and I hope that we also have been made known in your consciences.
translation:
  language: ru
  text: Итак, зная страх Господень[a], мы убеждаем людей; Богу же мы открыты, и надеюсь, что и в ваших совестях мы открыты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоговение перед Господом». В контексте предыдущего стиха «страх» включает и благоговейный трепет, и сознание ответственности перед Его судом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰδότες οὖν
  choice: Итак, зная
  rationale: Сохраняет выводное значение οὖν и причастную форму Εἰδότες, не делая причинный оттенок обязательным.
- source_word: τὸν φόβον τοῦ κυρίου
  choice: страх Господень
  rationale: Устоявшееся и естественное библейское выражение; сохраняет как благоговейный трепет, так и сознание ответственности перед Господом в контексте суда (5:10).
- source_word: ἀνθρώπους πείθομεν
  choice: мы убеждаем людей
  rationale: Прямо передаёт настоящее действительное πείθομεν и обобщающее значение ἀνθρώπους без гендерного сужения.
- source_word: θεῷ δὲ πεφανερώμεθα
  choice: Богу же мы открыты
  rationale: 'Естественно по-русски передаёт совершенный пассив и его сохраняющийся результат: перед Богом истинное положение Павла и его сотрудников полностью явлено.'
- source_word: ἐλπίζω
  choice: надеюсь
  rationale: Сохраняет личное и сдержанное ожидание Павла.
- source_word: ἐν ταῖς συνειδήσεσιν ὑμῶν
  choice: вашей совести
  rationale: Русское собирательное единственное число звучит естественнее буквального «в ваших совестях», при этом относится к внутреннему нравственному свидетельству адресатов.
- source_word: πεφανερῶσθαι
  choice: открыты
  rationale: Повторяет смысл того же корня φανερόω и передаёт состояние явленности без тяжеловесного «были сделаны известными».
theological_decisions:
- issue: Значение выражения «страх Господень»
  choice: Сохранить слово «страх»
  alternative: «благоговение перед Господом»
  rationale: Контекст судилища Христова в предыдущем стихе не позволяет свести φόβος только к почтению; буквальная формулировка сохраняет и благоговение, и сознание грядущей ответственности.
- issue: Смысл φανερόω по отношению к Богу и совести коринфян
  choice: «мы открыты»
  alternative: «мы явлены» / «мы стали известны»
  rationale: Передаёт, что служение и истинные побуждения Павла полностью открыты Богу и, как он надеется, распознаны совестью адресатов, не добавляя оценки их правоты.
- issue: Число существительного συνειδήσεσιν
  choice: Естественное русское единственное «вашей совести» с примечанием о греческом множественном
  alternative: Буквальное «в ваших совестях»
  rationale: Единственное число в русском литературном употреблении естественно выражает нравственное сознание группы; примечание сохраняет формальную особенность оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сохраняет ход греческой мысли и противопоставление δέ; тяжеловесный буквальный пассив φανερόω передан естественным состоянием «открыты».
