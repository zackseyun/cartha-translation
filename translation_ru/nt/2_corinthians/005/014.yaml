  text: ἡ γὰρ ἀγάπη τοῦ Χριστοῦ συνέχει ἡμᾶς, κρίναντας τοῦτο ⸀ὅτι εἷς ὑπὲρ πάντων ἀπέθανεν· ἄρα οἱ πάντες ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: ru
  text: 'Ведь любовь Мессии движет нами[a], потому что мы пришли к такому выводу: один умер за всех — значит, все умерли.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «любовь Мессии к нам»; также возможно: «любовь к Мессии». Греческий родительный падеж допускает оба понимания.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: любовь
  rationale: Естественный современный эквивалент, сохраняющий основное значение греческого слова.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь передаёт титул; родительный падеж в русском, как и в греческом, позволяет не устранять неоднозначность между любовью Мессии и любовью к Мессии.
- source_word: συνέχει
  choice: побуждает
  rationale: Передаёт сильную направляющую и мотивирующую силу в данном контексте, не создавая механического оттенка слова «контролирует».
- source_word: κρίναντας τοῦτο
  choice: потому что мы пришли к такому выводу
  rationale: Причинная конструкция естественно передаёт функцию причастия, а «пришли к выводу» — результат обдуманного суждения.
- source_word: εἷς
  choice: один
  rationale: Сохраняет краткость и риторическую выразительность оригинала без добавления слова «человек».
- source_word: ὑπὲρ πάντων
  choice: за всех
  rationale: Естественно передаёт действие ради и от имени всех, не сужая значение до строго заместительной формулы.
- source_word: ἄρα
  choice: значит
  rationale: Ясно выражает логический вывод Павла и естественно звучит в современном русском.
- source_word: οἱ πάντες ἀπέθανον
  choice: все умерли
  rationale: Буквально сохраняет сжатое утверждение оригинала без поясняющего богословского расширения.
theological_decisions:
- issue: Значение родительного падежа в ἡ ἀγάπη τοῦ Χριστοῦ
  choice: В основном тексте оставлено неоднозначное «любовь Мессии».
  alternative: «любовь Мессии к нам» или «любовь к Мессии»
  rationale: Греческий родительный допускает субъектное и объектное понимание; русский родительный сохраняет ту же открытую формулировку, а сноска обозначает варианты.
- issue: Смысл выражения «все умерли»
  choice: Передано буквально, без истолковывающего дополнения.
  alternative: «все представительственно умерли в Мессии» или «все верующие умерли вместе с ним»
  rationale: Высказывание Павла намеренно сжато; перевод не должен заранее разрешать вопрос о характере сопричастности и объёме слова «все».
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Тире перед выводом сохраняет энергичную, сжатую логику стиха; «Мессия» употреблено как перевод титула Χριστός.
