  text: εἴτε γὰρ ἐξέστημεν, θεῷ· εἴτε σωφρονοῦμεν, ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/013.yaml
  text: For if we are out of our minds[a], it is for God; if we are of sound mind[b], it is for you.
translation:
  language: ru
  text: Ведь если мы вне себя[a], то — для Бога; если же мы в здравом уме[b], то — для вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не в своём уме».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рассудительны»; «сохраняем здравый ум».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: если ... если же
  rationale: Повторённое «если» естественно передаёт сжатое риторическое противопоставление; частица «же» ясно обозначает вторую сторону альтернативы.
- source_word: γὰρ
  choice: ведь
  rationale: «Ведь» естественно вводит пояснение или обоснование предыдущей мысли и сохраняет связующую силу γάρ.
- source_word: ἐξέστημεν
  choice: не в своём уме
  rationale: Выражение передаёт значение «быть вне себя, казаться безумным» современным и понятным русским языком, не утверждая, что Павел признаёт буквальное безумие.
- source_word: θεῷ
  choice: для Бога
  rationale: Дательный падеж в эллиптической конструкции допускает значение направленности или пользы; «для Бога» кратко сохраняет эту открытость.
- source_word: σωφρονοῦμεν
  choice: мыслим здраво
  rationale: Глагольная формулировка соответствует σωφρονοῦμεν и передаёт здравость, рассудительность и самообладание, образуя ясный контраст с «не в своём уме».
- source_word: ὑμῖν
  choice: для вас
  rationale: Как и θεῷ, дательный падеж здесь выражает направленность или пользу; «для вас» показывает, что здравое поведение Павла служит коринфянам.
theological_decisions:
- issue: Смысл противопоставленных самоописаний Павла
  choice: Сохранить контраст между поведением, которое может казаться безумием или выходом за обычные рамки, и здравым, рассудительным поведением.
  alternative: Понимать первую часть как прямое указание на буквальное безумие либо как техническое описание религиозного экстаза.
  rationale: Греческая фраза риторична и эллиптична. Перевод не сводит её ни к признанию душевной болезни, ни к определённой доктрине экстатического опыта, сохраняя напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Симметрия «для Бога — для вас» сохраняет лаконичность и риторическую структуру оригинала; варианты в сносках отражают реальный диапазон значений ключевых глаголов.
