reference: 2 Corinthians 5:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὑπὲρ Χριστοῦ οὖν πρεσβεύομεν ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν· δεόμεθα ὑπὲρ Χριστοῦ, καταλλάγητε τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/020.yaml
  text: 'Therefore[a], we are ambassadors for the Messiah, as though God were appealing through us[b]. We beg you on behalf of the Messiah: be reconciled to God.'
translation:
  language: ru
  text: 'Итак, мы — послы Мессии[a], как если бы Сам Бог увещевал через нас. От имени Мессии умоляем вас: примиритесь с Богом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа». Греческое Χριστός — титул со значением «Помазанник»; здесь он передан словом «Мессия».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ Χριστοῦ
  choice: посланники Мессии / от имени Мессии
  rationale: 'Ὑπέρ с родительным падежом здесь выражает представительство: служение совершается ради Мессии и от его имени. Во втором употреблении «от имени» естественно передаёт этот смысл по-русски.'
- source_word: οὖν
  choice: итак
  rationale: Союз вводит вывод из предшествующего рассуждения о примирении; «итак» ясно и естественно обозначает логическое следствие.
- source_word: πρεσβεύομεν
  choice: мы — посланники
  rationale: Глагол означает исполнять обязанности посла или полномочного представителя. Именная конструкция сохраняет образ представительства и звучит естественно в современном русском языке.
- source_word: ὡς
  choice: словно
  rationale: 'Передаёт сравнительный характер оборота: обращение Бога совершается через апостольских посланников так, словно обращается сам Бог.'
- source_word: παρακαλοῦντος
  choice: обращается к людям
  rationale: В контексте призыва к примирению παρακαλέω означает настойчиво призывать или обращаться с увещанием. Такой перевод передаёт приглашающий характер речи без излишней книжности; «к людям» восполняет подразумеваемый объект обращения, не ограничивая его только коринфянами.
- source_word: δι’ ἡμῶν
  choice: через нас
  rationale: 'Διά с родительным падежом указывает на посредство: Бог обращается посредством апостольских служителей.'
- source_word: δεόμεθα
  choice: умоляем вас
  rationale: Глагол выражает настоятельную, искреннюю просьбу. «Умоляем» сохраняет эмоциональную силу; «вас» естественно проясняет адресата следующего повеления.
- source_word: καταλλάγητε
  choice: примиритесь
  rationale: Форма представляет собой аористное страдательное повеление. Русский возвратный глагол — обычный и наиболее близкий способ передать призыв принять примирение, не превращая его в утверждение о том, что люди сами производят примирение.
- source_word: τῷ θεῷ
  choice: с Богом
  rationale: После русского «примириться» нормативно употребляется предлог «с» с творительным падежом. Это естественно передаёт отношение, выраженное греческим дательным при καταλλάσσω.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Χριστός является титулом «Помазанник». «Мессия» сохраняет титульное значение в понятной современному русскому читателю форме; традиционный вариант «Христос» указан в сноске.
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Основной текст раскрывает значение титула, а сноска сохраняет привычную церковную форму, не превращая титул автоматически в личное имя.
- issue: Залог и участие сторон в примирении
  choice: примиритесь с Богом
  alternative: дайте Богу примирить вас с Собой
  rationale: 'Возвратная форма сохраняет напряжение текста: Бог обращается и призывает, однако повеление адресовано слушателям. Развёрнутый альтернативный перевод излишне уточнил бы механизм божественного и человеческого действия.'
- issue: Бог говорит через посланников
  choice: через нас словно сам Бог обращается к людям
  alternative: как если бы Бог увещевал через нас
  rationale: Выбранная формулировка сохраняет сравнительную силу ὡς и посредническую роль апостолов, не отождествляя без оговорки каждое их слово с прямой речью Бога.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным, но общедоступным звучанием. Тире подчёркивает образ полномочных посланников. Повтор «Мессии» сохранён вслед за греческим текстом. Английские маркеры сносок были переставлены по смыслу: примечание о Χριστός относится к слову «Мессия»; отдельная сноска к «через нас» не добавлена, поскольку предложенный английский вариант «with God» относится не к δι’ ἡμῶν, а к τῷ θεῷ, которое по-русски и без того естественно переводится «с Богом».'
