  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: ru
  text: Ибо всем нам надлежит предстать во всей своей открытости перед судилищем Мессии[a], чтобы каждый получил по тому, что совершил посредством тела[b], — доброе или дурное.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предстать перед судилищем Мессии». Греческий глагол может обозначать как появление, так и открытое обнаружение; основной текст сохраняет более сильный оттенок раскрытия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «за совершённое в теле» или «за дела, совершённые через тело». Греческое выражение связывает поступки с телесной жизнью человека и допускает инструментальный оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθῆναι
  choice: быть явленными
  rationale: Пассивный инфинитив допускает значение не только появления, но и открытого обнаружения; «быть явленными» сохраняет более сильный смысл раскрытия перед судом.
- source_word: βήματος
  choice: судилищем
  rationale: В данном контексте βῆμα обозначает судебное место, перед которым производится оценка; «судилище» кратко и ясно передаёт юридический характер образа.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь выступает как титул; «Мессия» передаёт его смысл, не превращая автоматически в имя собственное.
- source_word: κομίσηται
  choice: получил
  rationale: Средний залог в данном контексте означает получение воздаяния или результата; соответствие поступкам выражено последующей конструкцией.
- source_word: τὰ διὰ τοῦ σώματος
  choice: живя в теле
  rationale: Сжатая греческая конструкция связывает получаемое с телесной жизнью человека. Основной текст передаёт это естественно по-русски, а инструментальное прочтение διά отмечено в сноске.
- source_word: πρὸς ἃ ἔπραξεν
  choice: соответственно тому, что он совершил
  rationale: πρός выражает соответствие между получаемым и совершёнными поступками; формулировка сохраняет личную ответственность, выраженную ἔπραξεν.
- source_word: ἕκαστος
  choice: каждый
  rationale: Сохраняет дистрибутивный смысл и подчёркивает личную ответственность каждого.
- source_word: ἀγαθὸν
  choice: доброе
  rationale: Прямо передаёт широкий нравственный смысл слова в противопоставлении φαῦλον.
- source_word: φαῦλον
  choice: дурное
  rationale: Передаёт значение плохого, низкого или негодного без неоправданного усиления до «злого».
theological_decisions:
- issue: Характер и охват суда перед Мессией
  choice: Сохранены всеобщая подотчётность, судебная образность и индивидуальное получение соответственно поступкам.
  alternative: Истолковать событие исключительно как суд над верующими ради награды либо как окончательный суд над всем человечеством.
  rationale: Сам стих не уточняет систематико-богословский охват события и не ограничивает его только наградами или осуждением, поэтому перевод не разрешает эту напряжённость за текст.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. «Судилище» сохраняет юридическую образность без громоздкой перифразы; «надлежит» передаёт необходимость δεῖ. Порядок слов сделан естественным для русского, при этом сохранены универсальность «всем нам» и индивидуальность «каждый».
