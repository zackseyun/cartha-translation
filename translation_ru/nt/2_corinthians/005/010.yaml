  source_fidelity: 'Основная мысль передана верно: все должны явиться перед судебным местом Мессии, и каждый получит в соответствии со своими делами, добрыми или дурными. Однако «живя в теле» сужает и несколько переосмысливает διά τοῦ σώματος: греческое выражение сохраняет связь дел с телом как средством/сферой, а не прямо с фактом жизни в теле. Кроме того, «быть явленными» буквально мотивировано φανερωθῆναι, но в современном литературном русском звучит неестественно. «Предстать во всей своей открытости» естественнее и сохраняет акцент на раскрытии, а не только на физическом появлении.'
