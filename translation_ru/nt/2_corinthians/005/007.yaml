lexical_decisions:
- source_word: διὰ πίστεως
  choice: верой
  rationale: διά с родительным указывает здесь на средство или образ действия. «Верой» кратко и естественно передаёт противопоставление видимому; πίστις в данном контексте означает веру, а не верность.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит пояснение к предшествующей мысли. «Ведь» естественно сохраняет пояснительную связь в современном русском языке.
- source_word: περιπατοῦμεν
  choice: мы живём
  rationale: Глагол буквально означает «ходим», но часто метафорически описывает образ жизни. «Живём» ясно передаёт этот смысл современному читателю, не создавая неестественного сочетания «ходим верой».
- source_word: οὐ διὰ εἴδους
  choice: а не тем, что видим
  rationale: εἶδος обозначает видимую форму, облик или то, что доступно зрению. Эта формулировка естественно передаёт противопоставление веры видимому и не сужает смысл до поверхностной внешности.
theological_decisions:
- issue: Значение πίστις в кратком противопоставлении εἶδος
  choice: вера
  alternative: доверие; верность
  rationale: В данном месте речь идёт не о спорной конструкции πίστις Χριστοῦ. Противопоставление видимому указывает на веру как упование на то, что пока не доступно зрению; значение «верность» здесь менее вероятно.
- issue: Характер противопоставления веры и видимого
  choice: Сохранено нейтральное противопоставление «верой — не тем, что видим»
  alternative: Толковательно уточнить как противопоставление веры земной внешности или духовного материальному
  rationale: Греческий текст не уточняет объект веры и не формулирует общего отрицания материального мира, поэтому перевод не вводит дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Метафорическое περιπατέω передано функционально как «живём», поскольку буквальное «ходим верой» в современном русском звучит искусственно. Конечное тире сохранено как знак продолжения мысли в следующем стихе.
