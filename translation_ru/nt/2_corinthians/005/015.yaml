  text: καὶ ὑπὲρ πάντων ἀπέθανεν ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: ru
  text: И Он умер за всех[a], чтобы те, кто живёт, уже не жили для себя, а для Того, Кто умер и был воскрешён за них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради всех», «в пользу всех»; те же оттенки возможны и в выражении «за них». Греческий предлог ὑπέρ может указывать на действие ради других, в их пользу или от их лица.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом стоит страдательная форма: «был воскрешён»; по-русски также возможно «воскрес».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ πάντων / ὑπὲρ αὐτῶν
  choice: за всех / за них
  rationale: ὑπέρ с родительным падежом выражает действие ради кого-либо или в чью-либо пользу и может иметь оттенок представительства. Русское «за» естественно в обоих случаях, сохраняет повтор предлога и не навязывает тексту узкую теорию искупления.
- source_word: ἀπέθανεν
  choice: Он умер
  rationale: Аорист указывает на совершившееся событие; подлежащее, выраженное в греческом личным окончанием и ясное из контекста, в русском передано местоимением «Он».
- source_word: ἵνα
  choice: чтобы
  rationale: Союз передаёт цель и возможный результат смерти Христа; «чтобы» естественно выражает эту направленность в современном русском языке.
- source_word: οἱ ζῶντες
  choice: живущие
  rationale: Субстантивированное причастие настоящего времени обозначает тех, кто живёт. «Живущие» сохраняет причастную форму и допускает заложенный контекстом духовно-экзистенциальный смысл, не делая его явным добавлением.
- source_word: μηκέτι ἑαυτοῖς ζῶσιν
  choice: уже не для себя жили
  rationale: μηκέτι обозначает прекращение прежней направленности жизни, а дательный ἑαυτοῖς — жизнь, обращённую на собственные интересы. Такой порядок слов естественен и сохраняет контраст.
- source_word: ἀλλὰ τῷ ... ἀποθανόντι καὶ ἐγερθέντι
  choice: а для Того, Кто умер ... и был воскрешён
  rationale: 'Дательный продолжает подразумеваемое «жили»: не для себя, а для Него. Относительное придаточное звучит по-русски яснее буквальной цепочки причастий, а прописная буква у «Того» уместна как уважительное обозначение Христа.'
- source_word: ἐγερθέντι
  choice: был воскрешён
  rationale: Форма является аористным страдательным причастием. «Был воскрешён» сохраняет пассивный залог и не превращает действие над Христом в грамматически активное «воскрес».
theological_decisions:
- issue: Объём πάντων и соотнесённого с ним αὐτῶν
  choice: Передано без ограничения как «всех» и «них».
  alternative: 'Уточнить: «всех людей без исключения» либо «всех верующих / всех представленных Христом».'
  rationale: Сам стих использует широкое πάντων, но не разрешает здесь богословский спор о точном объёме референта. Перевод сохраняет эту открытость.
- issue: Смысл ὑπέρ применительно к смерти Христа
  choice: «за», с примечанием о значении «ради / в пользу / от имени».
  alternative: Развернуть как «вместо всех» или «как их представитель».
  rationale: ὑπέρ допускает представительный и благотворный оттенки, однако данный предлог сам по себе не требует более узкой формулировки «вместо». Перевод не закрепляет отдельную теорию искупления.
- issue: Страдательный залог ἐγερθέντι
  choice: «был воскрешён».
  alternative: «воскрес».
  rationale: Страдательная конструкция точнее отражает греческую форму и сохраняет подразумеваемое действие Бога, не отрицая истинности активной формулировки в иных контекстах.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Синтаксис сделан ясным для обычного читателя; повтор «за всех / за них», целевая связь и противопоставление сохранены. Богословская неоднозначность πάντων и ὑπέρ не устранена поясняющими добавлениями.
