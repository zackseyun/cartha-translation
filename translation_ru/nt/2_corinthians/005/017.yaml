  source_fidelity: Текст точно передаёт выводное ὥστε («Итак»), обобщённое условие εἴ τις, эллиптичность καινὴ κτίσις и контраст между τὰ ἀρχαῖα и καινά. «Прежнее прошло» удачно воспроизводит широкое, неуточнённое значение τὰ ἀρχαῖα; «настало новое» естественно передаёт совершившееся наступление нового состояния при γέγονεν καινά, не добавляя πάντα («всё»).
