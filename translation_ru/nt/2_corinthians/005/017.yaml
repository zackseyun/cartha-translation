reference: 2 Corinthians 5:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὥστε εἴ τις ἐν Χριστῷ, καινὴ κτίσις· τὰ ἀρχαῖα παρῆλθεν, ἰδοὺ γέγονεν ⸀καινά·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/017.yaml
  text: So then[a], if anyone is in Messiah, there is a new creation; the old things have passed away; behold[b], new things have come.
translation:
  language: ru
  text: Итак, если кто во Мессии — новое творение[a]; прежнее прошло; вот[b], настало новое.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тот — новое творение». По-гречески фраза эллиптична, буквально: «если кто во Мессии — новое творение».'
    reason: alternative_reading
  - marker: b
    text: 'Во многих переводах: «всё стало новым». Однако в тексте SBLGNT здесь сказано просто «новое» — без отдельного слова «всё».'
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения и естественно звучит в современном литературном русском языке.
- source_word: εἴ τις
  choice: если кто
  rationale: Сохраняет обобщённое условие без добавления мужской специфики; в данном торжественном регистре это краткая и естественная русская формула.
- source_word: ἐν Χριστῷ
  choice: во Мессии
  rationale: Передаёт Χριστός как титул и сохраняет характерный для Павла смысл пребывания в Мессии.
- source_word: καινὴ κτίσις
  choice: новое творение
  rationale: Греческая фраза не содержит глагола и допускает как отнесение к человеку, так и более широкое провозглашение нового творения. Русское тире сохраняет эллиптичность.
- source_word: τὰ ἀρχαῖα
  choice: прежнее
  rationale: Субстантивированное среднее множественное естественно передаётся русским собирательным единственным; «прежнее» сохраняет широкий, неуточнённый охват.
- source_word: παρῆλθεν
  choice: прошло
  rationale: Лаконично передаёт совершившееся прекращение прежнего и соответствует числу русского собирательного «прежнее».
- source_word: ἰδοὺ
  choice: вот
  rationale: Современный и выразительный русский указательный возглас, привлекающий внимание к наступившему результату.
- source_word: γέγονεν καινά
  choice: настало новое
  rationale: Передаёт возникновение нового состояния с сохраняющимся результатом. «Новое» соответствует субстантивированному нейтральному καινά без внесения отсутствующего в SBLGNT слова «всё».
theological_decisions:
- issue: Передача Χριστῷ как титула или ставшего именем обозначения
  choice: во Мессии
  alternative: во Христе
  rationale: В формуле Павла титульное значение остаётся существенным; перевод «Мессия» делает его явным, не меняя смысла единения с ним.
- issue: Толкование эллиптического καινὴ κτίσις
  choice: если кто во Мессии — новое творение
  alternative: если кто во Мессии, тот — новое творение
  rationale: В греческом нет ни связки, ни выраженного подлежащего при «новом творении». Эллиптическая русская конструкция не ограничивает смысл только обновлением отдельного человека; индивидуальное прочтение отмечено в сноске.
- issue: Наличие слова «всё» в заключительной фразе
  choice: настало новое
  alternative: всё стало новым
  rationale: Текст SBLGNT содержит καινά, но не содержит слова πάντα («всё»). Основной текст следует данной греческой форме, а распространённый вариант отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Тире сохраняет выразительную эллиптичность оригинала; «вот» передаёт риторическую силу ἰδοὺ без архаизма.
