  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/021.yaml
  text: He made the one who did not know sin to be sin for us[b][a], so that in him we might become the righteousness of God.
translation:
  language: ru
  text: Того, кто не знал греха, Он ради нас сделал грехом[a], чтобы в Нём мы стали праведностью Божьей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвой за грех». В греческом тексте в обоих случаях стоит слово «грех»; здесь некоторые понимают его в жертвенном смысле.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «справедливостью Божьей»; возможно также: «праведностью от Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντα
  choice: не знал
  rationale: Сохраняет обычное значение γινώσκω и сжатую греческую формулировку, указывающую на непричастность Христа греху, но не заменяя её толкованием «не совершил греха».
- source_word: ἁμαρτίαν (первое употребление)
  choice: греха
  rationale: Прямое дополнение при «не знал» передано абстрактным существительным, как в греческом тексте.
- source_word: ὑπὲρ ἡμῶν
  choice: ради нас
  rationale: Естественно передаёт благотворно-представительное значение ὑπέρ, не ограничивая его рамками одной модели искупления.
- source_word: ἁμαρτίαν (второе употребление)
  choice: грехом
  rationale: Повтор одного и того же греческого существительного сохранён ради резкой и богословски насыщенной формулировки Павла; возможное жертвенное значение вынесено в сноску.
- source_word: ἐποίησεν
  choice: сделал
  rationale: Широкий и прямой эквивалент ποιέω, не вносящий лишней метафизической конкретизации.
- source_word: γενώμεθα
  choice: стали
  rationale: Передаёт становление и значение цели в конструкции с ἵνα, не сводя глагол к статическому «были».
- source_word: δικαιοσύνη
  choice: праведностью
  rationale: Сохраняет основной богословский термин Павла; лексическая возможность «справедливость» отмечена в сноске.
- source_word: θεοῦ
  choice: Божьей
  rationale: Передаёт родительный падеж, не разрешая однозначно, обозначает ли он источник, принадлежность или отношение.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Сохраняет краткое и значимое для Павла выражение, не разворачивая его толковательно как «в единении с Ним».
theological_decisions:
- issue: Значение выражения «сделал грехом»
  choice: 'В основном тексте сохранена формулировка Павла: безгрешного Христа Бог ради нас «сделал грехом»; она не означает, что Христос стал нравственно грешным.'
  alternative: «Сделал жертвой за грех».
  rationale: Первая часть стиха прямо утверждает непричастность Христа греху. Жертвенное понимание второго ἁμαρτία возможно, но не должно безусловно подменять более резкий буквальный оборот исходного текста, поэтому оно дано в сноске.
- issue: Смысл δικαιοσύνη θεοῦ
  choice: «Праведность Божья» оставляет открытым точный характер родительного θεοῦ.
  alternative: «Справедливость Божья» или «праведность от Бога».
  rationale: 'Выражение допускает несколько взаимосвязанных оттенков: Божью праведность, праведность от Бога или праведный статус в отношении к Богу. Основной текст не закрепляет одну спорную схему.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Порядок слов сохраняет акцент на безгрешном Христе, а формулировки «сделал грехом» и «праведностью Божьей» намеренно удерживают сжатость и богословское напряжение оригинала.
