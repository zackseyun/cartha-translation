  text: ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/021.yaml
  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: ru
  text: Тот, кто утверждает нас вместе с вами во Мессии[a] и помазал нас, — Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ко Мессии». Греческий титул «Христос» означает «Помазанник», то есть «Мессия».'
    reason: Сохраняет возможный оттенок направленности предлога εἰς и поясняет титульное значение Χριστός.
lexical_decisions:
- source_word: βεβαιῶν
  choice: утверждающий
  rationale: Передаёт значение укрепления и придания твёрдости; причастие настоящего времени сохраняет оттенок продолжающегося действия.
- source_word: σὺν ὑμῖν
  choice: вместе с вами
  rationale: Ясно выражает совместность Павла и его спутников с коринфскими верующими.
- source_word: εἰς Χριστόν
  choice: во Христе
  rationale: В данном контексте εἰς обозначает направленность и укоренённость отношений со Христом; русское «во Христе» естественно передаёт эту мысль, не сводя её к пространственному значению.
- source_word: χρίσας
  choice: помазавший
  rationale: Сохраняет прямую лексическую связь с χρίω и библейскую тему помазания, не уточняя без основания его обрядовый характер.
- source_word: θεός
  choice: Бог
  rationale: Сохранено конечное, смыслово выделенное положение слова в греческом предложении; тире естественно оформляет русское именное сказуемое.
theological_decisions:
- issue: Значение εἰς в выражении εἰς Χριστόν
  choice: «во Христе» как указание на отношение и единение со Христом
  alternative: «ко Христу» или более буквально «в Христа»
  rationale: Греческий предлог допускает оттенок направленности, однако в данном Павловом контексте речь идёт об утверждении верующих в их отношении ко Христу. Формулировка «во Христе» естественна по-русски, а сноска сохраняет возможный оттенок направленности.
- issue: Передача Χριστός
  choice: «Христос»
  alternative: «Мессия»
  rationale: В современном литературном русском «Христос» — естественная и точная передача греческого титула Χριστός; сноска поясняет его значение и сохраняет связь с понятием помазания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов по возможности отражает греческий акцент на слове «Бог», помещённом в конце.
