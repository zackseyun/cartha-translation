id: 2CO.1.3
reference: 2 Corinthians 1:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῶν οἰκτιρμῶν καὶ θεὸς πάσης παρακλήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: ru
  text: Благословен Бог и Отец нашего Господа Иисуса Мессии[a], Отец милосердия[b] и Бог всякого утешения[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Христа». Греческое Χριστός означает «Мессия», то есть «Помазанник».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «милостей» или «состраданий»; множественное число может указывать на многочисленные проявления милосердия.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ободрения» или «подкрепления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Благословен
  rationale: Предикативное прилагательное в славословной формуле; передаёт утверждение и сохраняет возвышенный, но понятный русский регистр.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Бог и Отец
  rationale: Один артикль объединяет оба существительных и указывает на одно Лицо; русский оборот естественно передаёт эту связь без повторения определителя.
- source_word: κυρίου
  choice: Господа
  rationale: Обычное и контекстуально уместное соответствие κύριος в новозаветном христологическом употреблении.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Передаёт значение титула «Помазанник», а не скрывает его за традиционной транслитерацией; форма родительного падежа согласована с «Иисуса».
- source_word: οἰκτιρμῶν
  choice: милосердия
  rationale: Естественный русский собирательный оборот для греческого множественного числа, обозначающего сострадание и его многочисленные проявления; формальное число пояснено в сноске.
- source_word: πάσης παρακλήσεως
  choice: всякого утешения
  rationale: «Утешение» естественно вводит тему Божьей поддержки в скорбях; «всякого» сохраняет распределительную полноту πάσης, а более широкий смысл παράκλησις отмечен в сноске.
theological_decisions:
- issue: Передача христологического титула Χριστός в сочетании Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  alternative: Иисуса Христа
  rationale: Основной текст раскрывает титульное значение Χριστός («Помазанник»), не превращая его автоматически в часть имени; традиционный вариант сохранён в сноске.
- issue: Смысл родительного оборота πατὴρ τῶν οἰκτιρμῶν
  choice: Отец милосердия
  alternative: Отец проявлений милосердия / Отец сострадания
  rationale: Сохранён ёмкий и естественный русский оборот без догматического уточнения того, означает ли родительный падеж источник, принадлежность или характеристику.
translation_notes:
  register: Современный литературный русский язык с достоинством славословной формулы. Порядок «нашего Господа» выбран как более естественный современный русский, при сохранении всех смысловых связей оригинала. Конечная запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
