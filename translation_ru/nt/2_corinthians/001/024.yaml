  text: οὐχ ὅτι κυριεύομεν ὑμῶν τῆς πίστεως, ἀλλὰ συνεργοί ἐσμεν τῆς χαρᾶς ὑμῶν, τῇ γὰρ πίστει ἑστήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/024.yaml
  text: Not that we lord it over your faith[a], but we are fellow workers for your joy[c][b], for you stand firm by faith.
translation:
  language: ru
  text: Не то чтобы мы господствовали над вашей верой[a]; напротив, мы — ваши соработники, трудящиеся ради вашей радости[b], ведь верой вы стоите твёрдо[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над вашим доверием».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мы — соработники вашей радости»; также возможно: «мы трудимся вместе для вашей радости».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вы твёрдо стоите в вере».'
    reason: alternative_reading
lexical_decisions:
- source_word: κυριεύομεν
  choice: господствовали
  rationale: Глагол означает осуществлять господство или власть над кем-либо. «Господствовали над» естественно передаёт отрицание властного контроля, не добавляя эмоционально окрашенного смысла самодурства.
- source_word: ὑμῶν τῆς πίστεως
  choice: над вашей верой
  rationale: Родительная конструкция при κυριεύω по-русски естественно передаётся сочетанием «господствовать над». πίστις здесь обозначает веру коринфян; возможный оттенок доверия отмечен в сноске.
- source_word: συνεργοί
  choice: мы вместе трудимся
  rationale: Передаёт совместный труд и противопоставляет его господству. Такая глагольная формулировка звучит по-русски естественнее буквального «соработники вашей радости».
- source_word: τῆς χαρᾶς ὑμῶν
  choice: ради вашей радости
  rationale: Родительный оборот выражает направленность совместного труда на радость адресатов. «Ради» ясно передаёт эту целевую связь.
- source_word: τῇ γὰρ πίστει
  choice: ведь верой
  rationale: Дательный падеж может указывать на средство или основание. Русский творительный «верой» кратко сохраняет это значение; локативное понимание «в вере» дано в сноске.
- source_word: ἑστήκατε
  choice: стоите твёрдо
  rationale: Перфект ἕστηκα выражает достигнутое и сохраняющееся устойчивое положение. «Стоите твёрдо» естественно передаёт результативно-длительный смысл.
theological_decisions:
- issue: Значение πίστις в обоих случаях
  choice: вера
  alternative: доверие; во втором случае — «в вере»
  rationale: Контекст говорит об устойчивой вере самих коринфян. Перевод «вера» сохраняет обычное павловское словоупотребление, а допустимые оттенки доверия и сферы пребывания не устраняются, но отмечаются в сносках.
- issue: Характер служения Павла и его спутников
  choice: они трудятся вместе ради радости коринфян, а не господствуют над их верой
  alternative: 'буквально: «соработники вашей радости»'
  rationale: Перевод сохраняет противопоставление между властным контролем и совместным трудом, не уточняя сверх текста, являются ли они прежде всего сотрудниками самих коринфян, Бога или друг друга.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского обращения. Конструкция «не то чтобы…; напротив…» естественно передаёт οὐχ ὅτι… ἀλλά. Формулировка избегает архаичного «владычествуем» и сохраняет богословское напряжение между апостольским авторитетом и отсутствием господства над верой общины.
