  text: ὅσαι γὰρ ἐπαγγελίαι θεοῦ, ἐν αὐτῷ τὸ Ναί· ⸀διὸ καὶ ⸂δι’ αὐτοῦ⸃ τὸ Ἀμὴν τῷ θεῷ πρὸς δόξαν δι’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: ru
  text: Ибо сколько бы ни было Божьих обещаний, в Нём — «да». Поэтому через Него мы говорим Богу аминь — во славу Его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅσαι
  choice: сколько бы ни было
  rationale: 'Передаёт неопределённую всеохватность: речь идёт обо всех Божьих обещаниях, сколько их ни есть.'
- source_word: ἐπαγγελίαι θεοῦ
  choice: Божьих обещаний
  rationale: Естественное современное выражение, обозначающее обещания, данные Богом.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Сохраняет краткую христоцентричную формулировку Павла, не добавляя в основной текст глагол «исполняются».
- source_word: τὸ Ναί
  choice: «да»
  rationale: Кавычки подчёркивают, что «да» употреблено как самостоятельное утвердительное слово; заглавная буква в русском не требуется.
- source_word: διὸ καὶ δι’ αὐτοῦ
  choice: Поэтому через Него — и
  rationale: Передаёт вывод διὸ, посредничество διά с родительным падежом и присоединительное καί, сохраняя эллиптичность оригинала.
- source_word: τὸ Ἀμὴν
  choice: «аминь»
  rationale: Сохраняет укоренившуюся библейскую транслитерацию и риторическую параллель с «да».
- source_word: τῷ θεῷ
  choice: Богу
  rationale: Дательный падеж естественно обозначает Того, к кому обращено «аминь».
- source_word: πρὸς δόξαν
  choice: во славу
  rationale: Передаёт целевую направленность выражения, не уточняя в основном тексте синтаксическую связь сверх сказанного по-гречески.
- source_word: δι’ ἡμῶν
  choice: через нас
  rationale: Буквально сохраняет широкую формулировку Павла, не добавляя толкование «через наше служение».
theological_decisions:
- issue: Следует ли раскрывать эллиптическое выражение Павла как прямое утверждение об исполнении обещаний
  choice: Сохранить сжатое «в Нём — „да“»
  alternative: «в Нём все Божьи обещания исполняются» или «в Нём они обретают своё „да“»
  rationale: Контекст подразумевает исполнение и подтверждение обещаний во Христе, но в греческом тексте это выражено кратко и риторически; добавление «исполняются» сняло бы подлинную смысловую напряжённость.
- issue: Связь выражения πρὸς δόξαν с Богом и служением апостолов
  choice: Оставить компактное «во славу через нас» и пояснить возможную связь в сноске
  alternative: «через нас — во славу Божью»
  rationale: Греческий порядок допускает более явное понимание Бога как Того, кому воздаётся слава, однако основной текст не должен молча устранять синтаксическую компактность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Тире сохраняют риторическую сжатость и параллелизм «да» — «аминь»; местоимения, относящиеся ко Христу, написаны с прописной буквы согласно принятой русской библейской традиции.
