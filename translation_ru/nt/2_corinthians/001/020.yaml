revisions:
- from: Ибо сколько бы ни было Божьих обещаний, в Нём — «да».[a] Поэтому через Него — и «аминь» Богу, во славу через нас.[b][c]
  to: Ибо сколько бы ни было Божьих обещаний, в Нём — «да». Поэтому через Него мы говорим Богу аминь — во славу Его.
  rationale: 'Добавлено «мы говорим», чтобы по-русски передать подразумеваемое действие при «аминь» и естественно связать «через нас» с этим действием. «Во славу Его» ясно передаёт πρὸς δόξαν в связи с Богом; это не меняет смысла, а устраняет неудачную русскую двусмысленность. Сноска сохраняет буквальную формулу δι’ ἡμῶν. Якоря следует поставить так: [a] после «да», [b] после «аминь», [c] после «Его».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:58:09Z'
review_pass:
  verdict: revise
  source_fidelity: Основная мысль и параллелизм τὸ Ναί — τὸ Ἀμήν переданы верно. Однако заключительное «во славу через нас» в русском не даёт ясной синтаксической связи δι’ ἡμῶν и звучит как неестественное соединение обстоятельств. В греческом δι’ ἡμῶν естественно относится к произнесению/вознесению «аминь», а πρὸς δόξαν — к славе Бога.
  naturalness: 'Начало «Ибо сколько бы ни было Божьих обещаний, в Нём — „да“» удачно и литературно. Вторая фраза требует минимального раскрытия эллипсиса: без глагола сочетание «через Него — и „аминь“ Богу, во славу через нас» тяжеловесно и не вполне понятно современному русскому читателю.'
  terminology: «Божьи обещания», «аминь» и «да» допустимы; «обетования» здесь не обязательно. «Аминь» следует оставить без кавычек как освоенное в русском библейском употреблении слово. Формулировка с «во славу Его» естественно выражает направленность πρὸς δόξαν при τῷ θεῷ, не вводя конфессионального толкования.
  issues:
  - severity: medium
    issue: Неестественная и синтаксически неясная формула «во славу через нас».
    rationale: Она буквально калькирует порядок слов, но в русском не показывает, что «через нас» относится к возглашению «аминь», а «во славу» — к Богу. Нужна безопасная минимальная экспликация синтаксиса.
  - severity: low
    issue: Кавычки вокруг «аминь» избыточны.
    rationale: В отличие от метаязыкового «да», слово «аминь» в русском библейском регистре обычно пишется без кавычек; это улучшает естественность без изменения смысла.
  - severity: low
    issue: Сноска c сформулирована как альтернативный перевод, хотя предлагаемое ею чтение уже является естественным синтаксическим пониманием греческой фразы.
    rationale: Лучше пояснить функцию заключительных слов, а не создавать впечатление отдельного текстового варианта.
  revised_text: Ибо сколько бы ни было Божьих обещаний, в Нём — «да». Поэтому через Него мы говорим Богу аминь — во славу Его.
