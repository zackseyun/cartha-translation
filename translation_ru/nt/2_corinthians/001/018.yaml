base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/018.yaml
  text: As surely as God is faithful[b][a], our message to you is not “Yes and No.”
translation:
  language: ru
  text: 'Верен Бог: наше слово к вам — не «да» и «нет».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но Бог верен, и наше слово к вам — не „да“ и „нет“». «Слово» можно также перевести как «речь» или «весть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: верен
  rationale: Передаёт Божью верность и надёжность, на которых Павел основывает своё заверение.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь частица вводит торжественное заверение; в русском его естественно передаёт начальная формула «Верен Бог» без обязательного противительного союза.
- source_word: ὅτι
  choice: двоеточие
  rationale: Двоеточие естественно вводит содержание заверения, сохраняя связь между Божьей верностью и последующим утверждением без искусственного «что» или причинного «потому что».
- source_word: λόγος
  choice: слово
  rationale: Сохраняет повтор ключевого термина λόγος в ближайшем контексте и может обозначать речь или возвещаемое послание.
- source_word: ὁ πρὸς ὑμᾶς
  choice: к вам
  rationale: Кратко и формально близко передаёт направленность слова Павла и его сотрудников к коринфянам.
- source_word: οὐκ ἔστιν Ναὶ καὶ Οὔ
  choice: не «да» и «нет»
  rationale: Сохраняет настоящее время и заострённое противопоставление согласия и отрицания, не объясняя подразумеваемую непостоянность внутри основного текста.
theological_decisions:
- issue: Синтаксическая связь πιστὸς δὲ ὁ θεὸς ὅτι
  choice: '«Верен Бог: …» как формула заверения'
  alternative: «Но Бог верен, потому что…» / «Но верен Бог, что…»
  rationale: Такой вариант сохраняет апелляцию Павла к Божьей верности как основанию истинности его утверждения, но не превращает ὅτι однозначно в причинный союз.
- issue: Значение выражения «да и нет»
  choice: Сохранить выражение без толкования
  alternative: Передать как «не бывает то „да“, то „нет“» или «не противоречиво»
  rationale: Греческая формула намеренно кратка; буквальное сохранение оставляет её риторическое напряжение и связь с последующими стихами.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формулой заверения. Выражение «да» и «нет» сохранено как риторическая пара; кавычки помогают воспринимать эти слова как обозначения взаимоисключающих утверждений.
