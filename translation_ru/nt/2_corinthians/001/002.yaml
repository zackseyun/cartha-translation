  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: ru
  text: Благодать вам и мир от Бога, Отца нашего, и Господа Иисуса Мессии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по традиции: «Иисуса Христа». Греческое слово Христос означает «Помазанник» и соответствует титулу «Мессия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: Передаёт обычное для Павла приветствие и сохраняет его богословскую насыщенность; «милость» или «благоволение» здесь были бы уже по значению.
- source_word: ὑμῖν
  choice: вам
  rationale: Естественная передача дательного адресата в русском приветствии.
- source_word: εἰρήνη
  choice: мир
  rationale: Сохраняет библейские ассоциации слова и естественно сочетается с «благодатью» в формуле приветствия.
- source_word: ἀπὸ
  choice: от
  rationale: Прямо и естественно обозначает источник благодати и мира.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Бога, Отца нашего
  rationale: Такая конструкция точно передаёт отношение приложения и сохраняет торжественный, но понятный современному читателю порядок слов.
- source_word: κυρίου
  choice: Господа
  rationale: Стандартный русский эквивалент κύριος в новозаветном титуле Иисуса; «Владыки» здесь звучало бы менее естественно.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: «Мессия» раскрывает титульное значение Χριστός — «Помазанник», тогда как традиционное «Христос» для многих русских читателей воспринимается почти как часть имени.
theological_decisions:
- issue: Передача Χριστοῦ в формуле Павлова приветствия
  choice: Мессии
  alternative: Христа
  rationale: Греческое Χριστός исторически является титулом «Помазанник», хотя в Павловых приветствиях уже может восприниматься как устойчивое именование. Основной текст делает титульный смысл прозрачным, а сноска сохраняет традиционный вариант и присущую формуле неоднозначность.
- issue: Передача κυρίου применительно к Иисусу
  choice: Господа
  alternative: Владыки
  rationale: «Господь» соответствует возвышенному и христологическому употреблению κύριος в этой формуле, не добавляя толкования сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и торжественности апостольского приветствия. Инверсия «Отца нашего» поддерживает библейский регистр, оставаясь понятной современному читателю.
