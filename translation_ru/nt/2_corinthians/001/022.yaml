translation:
  language: ru
  text: Он также запечатлел нас и дал задаток Духа в наших сердцах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «залог», «первый взнос» или «гарантия» Духа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σφραγισάμενος
  choice: запечатлел
  rationale: Сохраняет образ печати, указывающей на принадлежность, подлинность или защищённость, не сводя его к одному толкованию.
- source_word: δοὺς
  choice: дал
  rationale: Аористное причастие естественно передано однородным сказуемым, параллельным слову «запечатлел».
- source_word: ἀρραβῶνα
  choice: залог
  rationale: 'Передаёт конкретную коммерческую метафору: первоначально внесённое обеспечение, которое подтверждает последующее полное исполнение обязательства. В современном русском «залог» звучит достойно и привычно в библейском контексте; более узкие оттенки вынесены в сноску.'
- source_word: τοῦ πνεύματος
  choice: Духа
  rationale: Сохранена краткая родительная конструкция оригинала, допускающая понимание Духа как самого залога либо как источника залога; поясняющая перефразировка в основной текст не внесена.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: в наши сердца
  rationale: В русском языке с глаголом «дал» направление «в наши сердца» звучит естественно и передаёт внутреннее помещение дара, хотя греческое ἐν с дательным буквально допускает «в наших сердцах».
- source_word: ὁ καὶ ... καὶ
  choice: Он и ... и
  rationale: Субстантивированное причастие относится к Богу из предыдущего стиха. Местоимение «Он» обеспечивает естественную связь, а повтор «и» сохраняет греческое соотнесение двух действий.
theological_decisions:
- issue: Смысл Духа как ἀρραβών
  choice: «залог Духа» с сохранением коммерческого образа и компактной родительной конструкции
  alternative: «Дух как гарантия» или «первый взнос, гарантирующий грядущее»
  rationale: Текст не абстрагирован до одной лишь «гарантии» и не уточнено прямо, что именно гарантируется. Так сохраняются образ первоначального обеспечения и смысловая ёмкость формулировки Павла.
translation_notes:
  register: Современный литературный русский язык с сохранением ёмких образов оригинала. Формулировка продолжает мысль предыдущего стиха; синтаксис сделан естественным, но без конфессиональных пояснений.
