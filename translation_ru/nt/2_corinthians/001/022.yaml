  source_fidelity: '«В наши сердца» передаёт направление, тогда как ἐν ταῖς καρδίαις ἡμῶν обозначает местонахождение: «в наших сердцах». Кроме того, «залог» в современном русском прежде всего означает имущество, предоставляемое в обеспечение, и потому менее точно передаёт ἀρραβών — первоначальный платёж, обеспечивающий последующее исполнение.'
  naturalness: Исправленная фраза сохраняет сжатый, современный литературный синтаксис и естественно продолжает предыдущий стих. «Также» передаёт καί без тяжеловесного повтора «и ... и».
  terminology: «Задаток» точнее сохраняет коммерческий образ ἀρραβών, чем «залог», не сводя его к отвлечённой «гарантии». Родительная конструкция «задаток Духа» сохраняет намеренную краткость и смысловую ёмкость греческого выражения.
  issues:
