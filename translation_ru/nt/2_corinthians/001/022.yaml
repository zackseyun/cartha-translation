    issue: «в наши сердца» вместо «в наших сердцах»
    rationale: Греческое ἐν с дательным падежом означает «в, внутри» и здесь указывает на место пребывания задатка; русская винительная конструкция добавляет направление движения.
  - severity: medium
    issue: «залог» как передача ἀρραβών
    rationale: В современном русском «залог» обычно обозначает обеспечение или предмет обеспечения, а не первоначальный платёж. «Задаток» лучше передаёт коммерческую метафору первого платежа, гарантирующего последующее.
