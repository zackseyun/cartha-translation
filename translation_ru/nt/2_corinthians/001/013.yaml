    text: 'Или: «что вы полностью поймёте».'
    reason: 'Лексико-синтаксическая альтернатива: ἕως τέλους может указывать не только на продолжение до конца, но и на полноту понимания.'
  revision_rationale: Исправлены альтернатива ἢ ... ἢ καί и видовое значение будущего ἐπιγνώσεσθε. Сохранены естественный регистр, явная исключительная конструкция, неоднозначность ἕως τέλους и конечная запятая, поскольку предложение продолжается в следующем стихе.
