source:
  edition: SBLGNT
  text: οὐ γὰρ ἄλλα γράφομεν ὑμῖν ἀλλ’ ἢ ἃ ἀναγινώσκετε ἢ καὶ ἐπιγινώσκετε, ἐλπίζω δὲ ⸀ὅτι ἕως τέλους ἐπιγνώσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/013.yaml
  text: For we are not writing anything else to you except what you read and indeed understand[a], and I hope that you will understand fully to the end,
translation:
  language: ru
  text: Ведь мы не пишем вам ничего другого, кроме того, что вы читаете или также понимаете. И я надеюсь, что вы поймёте это до конца[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что вы полностью поймёте».'
    reason: 'Лексико-синтаксическая альтернатива: ἕως τέλους может указывать не только на продолжение до конца, но и на полноту понимания.'
lexical_decisions:
- source_word: ἄλλα
  choice: только то
  rationale: В сочетании οὐ ... ἄλλα ... ἀλλ’ ἢ естественная русская конструкция «только то» передаёт отрицание какого-либо иного или скрытого содержания.
- source_word: ἀναγινώσκετε
  choice: вы читаете
  rationale: Настоящее время и основное значение глагола прямо и естественно переданы русским «читаете».
- source_word: ἐπιγινώσκετε
  choice: понимаете
  rationale: В контексте противопоставления не чтению как таковому, а постижению прочитанного «понимаете» звучит естественнее, чем буквальное «узнаёте».
- source_word: ἐπιγνώσεσθε
  choice: будете понимать
  rationale: Будущее время сохраняется; повтор того же русского корня отражает связь с предыдущим ἐπιγινώσκετε, не добавляя в сам глагол спорной степени полноты.
- source_word: ἕως τέλους
  choice: до конца
  rationale: 'Буквальное пространственно-временное выражение естественно по-русски и сохраняет возможную двусмысленность: продолжение понимания до конца либо полное понимание.'
- source_word: οὐ γὰρ ... ἀλλ’ ἢ
  choice: Ведь ... только то
  rationale: 'Эта русская конструкция ясно передаёт исключительное ограничение: Павел не пишет ничего иного помимо того, что адресаты читают и понимают.'
theological_decisions:
- issue: Значение ἕως τέλους
  choice: до конца
  alternative: полностью
  rationale: «До конца» сохраняет подлинную неоднозначность греческого выражения между временной продолжительностью и полнотой понимания, не разрешая её без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык; ясный, достойный и доступный синтаксис. Союз γάρ передан словом «ведь», а длинное греческое предложение разделено на два русских для естественности. Конечная запятая сохранена, поскольку стих продолжается в следующем контексте.
