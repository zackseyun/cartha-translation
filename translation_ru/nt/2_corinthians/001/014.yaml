base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/014.yaml
  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: ru
  text: как и вы отчасти поняли нас[a], что мы — ваша гордость, как и вы — наша[b], в день нашего Господа Иисуса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поняли нас лишь отчасти» или «до некоторой степени».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «основание для гордости» или «причина для похвалы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωτε
  choice: поняли
  rationale: В данном контексте глагол указывает на достигнутое коринфянами реальное понимание или признание Павла и его спутников; «поняли» естественно по-русски и не привносит идеи полного понимания.
- source_word: ἀπὸ μέρους
  choice: отчасти
  rationale: Кратко и естественно передаёт неполноту или ограниченную степень понимания, не уточняя её сверх текста.
- source_word: καύχημα
  choice: похвала
  rationale: Сохраняет положительный смысл основания для радостной гордости и взаимного прославления, избегая резко отрицательного оттенка современного слова «хвастовство».
- source_word: καθάπερ
  choice: как и
  rationale: Передаёт явное взаимное сопоставление Павла с коринфянами.
- source_word: ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: в день нашего Господа Иисуса
  rationale: Сохраняет устойчивое эсхатологическое выражение и титул κύριος.
theological_decisions:
- issue: Взаимность образа καύχημα
  choice: мы — ваша похвала, как и вы — наша
  alternative: мы — основание для вашей гордости, как и вы — для нашей
  rationale: Формулировка сохраняет взаимный эсхатологический характер похвалы между апостолами и общиной, не превращая его ни в самовосхваление, ни в отвлечённое одобрение.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной синтаксической формой. Двоеточие после первой части естественно раскрывает содержание того, что коринфяне поняли, а тире подчёркивают взаимность похвалы.
