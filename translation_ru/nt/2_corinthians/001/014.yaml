  source_fidelity: 'Синтаксис и основные элементы греческого текста переданы верно: καθὼς καὶ, ἐπέγνωτε, ἀπὸ μέρους, взаимное сопоставление и эсхатологическое «в день нашего Господа Иисуса» сохранены. Однако «похвала» обычно обозначает хвалебное высказывание или одобрение, тогда как καύχημα здесь означает предмет либо основание для радостной гордости/похвальбы. Поэтому требуется более точная русская передача взаимного καύχημα.'
