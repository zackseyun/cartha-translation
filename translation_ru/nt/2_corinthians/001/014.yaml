  terminology: Титул «Господь» и имя «Иисус» переданы корректно. «Гордость» в данном контексте не навязывает оценку или конфессиональное толкование, а передаёт καύχημα как взаимный предмет радостного похваления. Сноска b сохраняет более развёрнутые лексические варианты.
