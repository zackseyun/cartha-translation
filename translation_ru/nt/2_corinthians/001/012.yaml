source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: ru
  text: 'Ибо вот чем мы хвалимся: свидетельство нашей совести: мы вели себя в мире в святости[a] и искренности Божьей[b], не по плотской мудрости[c], а по благодати Божьей — и особенно по отношению к вам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «простоте».'
    reason: textual_variant
  - marker: b
    text: 'Или: «искренности от Бога»; греческое выражение допускает разные способы понимания связи искренности с Богом.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «человеческой мудрости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καύχησις
  choice: хвалимся
  rationale: Передаёт допустимую у Павла положительную похвалу и уверенность, не сводя выражение к гордыне.
- source_word: μαρτύριον τῆς συνειδήσεως
  choice: наша совесть свидетельствует
  rationale: Естественная русская предикативная конструкция сохраняет смысл внутреннего свидетельства совести.
- source_word: ἁγιότητι
  choice: в святости
  rationale: Прямо передаёт чтение SBLGNT и сохраняет нравственно-религиозную силу существительного.
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: в искренности от Бога
  rationale: Сохраняет искренность как качество поведения и прозрачно выражает возможное значение Бога как её источника, не выдавая это истолкование за единственно возможное.
- source_word: σοφίᾳ σαρκικῇ
  choice: по плотской мудрости
  rationale: Сохраняет важную для Павла лексику корня σάρξ и противопоставление благодати Божьей.
- source_word: χάριτι θεοῦ
  choice: по благодати Божьей
  rationale: Естественно обозначает определяющее основание и силу поведения, сохраняя богословскую весомость χάρις.
- source_word: ἀνεστράφημεν ἐν τῷ κόσμῳ
  choice: в мире мы жили
  rationale: В данном контексте глагол обозначает образ жизни и поведения; русский глагол «жили» звучит естественно и не теряет этого смысла.
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: и особенно так поступали с вами
  rationale: Передаёт усилительное περισσοτέρως и направленность πρὸς ὑμᾶς ясным современным русским выражением.
theological_decisions:
- issue: Значение τοῦ θεοῦ при εἰλικρινείᾳ
  choice: «искренности от Бога» — понимание родительного как указания на источник
  alternative: «искренности перед Богом» или «Божьей искренности»
  rationale: Контекст противопоставляет человеческий способ действия благодати Божьей, поэтому значение источника вероятно; сноска сохраняет реальную неоднозначность греческого родительного.
- issue: Передача σάρξ в выражении σοφίᾳ σαρκικῇ
  choice: «плотской мудрости»
  alternative: «человеческой мудрости» или «мирской мудрости»
  rationale: Буквальная лексическая связь с «плотью» сохраняет павловское богословское напряжение и не ослабляет выражение до нейтрально человеческого.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского письма. Конструкция упрощена до естественного русского синтаксиса; ключевые богословские термины «святость», «плотская мудрость» и «благодать» сохранены. Все сноски отмечены в основном тексте.
