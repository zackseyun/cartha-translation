base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: ru
  text: Итак, имея такое намерение, разве я поступил легкомысленно?[a] Или я строю свои планы по плоти,[b] чтобы у меня было и «да, да», и «нет, нет»?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разве я проявил непостоянство?»'
    reason: lexical_alternative
  - marker: b
    text: '«По плоти» здесь может означать: по чисто человеческим или мирским соображениям.'
    reason: lexical_alternative
  - marker: c
    text: То есть говорить так, словно «да» и «нет» могут оставаться в силе одновременно.
    reason: cultural_note
lexical_decisions:
- source_word: βουλόμενος
  choice: имея такое намерение
  rationale: Причастие отсылает к ранее упомянутому намерению Павла посетить коринфян. Формулировка сохраняет связь с контекстом и не превращает намерение в уже принятое окончательное решение.
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: я поступил легкомысленно
  rationale: Греческое сочетание обозначает поведение, отличающееся легковесностью или непостоянством. Русская формулировка естественно передаёт риторический вопрос, не усиливая обвинение сверх исходного текста.
- source_word: ἃ βουλεύομαι κατὰ σάρκα βουλεύομαι
  choice: я строю свои планы по плоти
  rationale: Выражение передаёт обдумывание и составление планов. В русском буквальное повторение глагола было бы тяжеловесным, поэтому смысловая эмфаза выражена сочетанием «строю свои планы», а значимый павловский оборот κατὰ σάρκα сохранён формально.
- source_word: κατὰ σάρκα
  choice: по плоти
  rationale: Сохранён характерный для Павла многозначный оборот, чтобы не сводить его заранее только к мирским или чисто человеческим соображениям.
- source_word: παρ’ ἐμοὶ
  choice: у меня бывает
  rationale: Естественный русский оборот передаёт то, что обнаруживается в поведении или речи Павла, и вместе с сослагательной формой ᾖ сохраняет не категорическое утверждение, а предполагаемый результат.
- source_word: τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: и «да, да», и «нет, нет»
  rationale: Повторения сохранены, поскольку они присутствуют в греческом тексте и подчёркивают обвинение в колебании или противоречивости.
theological_decisions:
- issue: Значение κατὰ σάρκα в павловском словоупотреблении
  choice: по плоти
  alternative: по чисто человеческим соображениям; по-мирски
  rationale: Буквальный оборот сохраняет богословскую и смысловую напряжённость слова σάρξ. Сноска поясняет возможный смысл, не делая одну интерпретацию частью основного текста.
- issue: Соотношение «да» и «нет»
  choice: сохранить формулу «и „да, да“, и „нет, нет“»
  alternative: говорить одновременно и «да», и «нет»
  rationale: Исходный текст допускает понимание как непостоянства, так и противоречивости обещаний. Основной текст сохраняет образную формулу, а пояснение не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с dignified, но общедоступным синтаксисом. Риторические вопросы и повторение «да, да» / «нет, нет» сохранены; характерный павловский оборот «по плоти» оставлен в основном тексте и пояснён в сноске.
