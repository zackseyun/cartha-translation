  verdict: revise
  source_fidelity: Проект верно передаёт обращение, скорбь, случившуюся с Павлом и его спутниками в римской Асии, двойное усиление тяжести и результат отчаяния. Однако «оставались в неведении» добавляет оттенок длительного пребывания, которого в инфинитиве ἀγνοεῖν нет; «нам было чрезвычайно тяжело» несколько ослабляет образ пассивного непосильного бремени в ἐβαρήθημεν.
  naturalness: Предлагаемая правка сохраняет современный литературный строй. «Чтобы вы не знали» — естественная русская передача конструкции «не хотим, чтобы вы были в неведении» без смыслового добавления. «Мы были чрезмерно обременены» несколько книжно, но уместно для послания и точно сохраняет образ тяжести.
  terminology: «Братья» обоснованно сохраняет мужскую форму ἀδελφοί, с нейтральной поясняющей сноской об инклюзивном адресате. «Асия» и историческая сноска точны. Формулировка «отчаялись даже жить» соответствует καὶ τοῦ ζῆν и не сводит смысл исключительно к физическому выживанию.
