source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν, ἀδελφοί, ⸀ὑπὲρ τῆς θλίψεως ἡμῶν τῆς ⸀γενομένης ἐν τῇ Ἀσίᾳ, ὅτι καθ’ ὑπερβολὴν ⸂ὑπὲρ δύναμιν ἐβαρήθημεν⸃, ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/008.yaml
  text: For we do not want you to be unaware[a], brothers, about our affliction that happened in Asia, that we were burdened exceedingly, beyond our strength[c][b], so that we despaired even of life.
translation:
  language: ru
  text: 'Ибо мы не хотим, братья[a], чтобы вы не знали о нашей скорби, постигшей нас в Асии[b]: мы были чрезмерно обременены, сверх наших сил, так что отчаялись даже жить[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово имеет форму мужского рода во множественном числе; в этом обращении Павел, вероятно, имеет в виду всю общину верующих, включая женщин.
    reason: cultural_note
  - marker: b
    text: Асия — римская провинция на западе Малой Азии, а не современная часть света Азия.
    reason: cultural_note
  - marker: c
    text: 'Или: «мы потеряли всякую надежду даже на жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν
  choice: Ибо мы не хотим, чтобы вы… оставались в неведении
  rationale: Естественная современная русская передача волевого выражения с инфинитивом; сохраняет связующее γάρ и избегает стилистически резкого «не были невеждами».
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужскую форму греческого обращения; вероятный охват всей общины поясняется в сноске.
- source_word: ὑπὲρ τῆς θλίψεως ἡμῶν τῆς γενομένης ἐν τῇ Ἀσίᾳ
  choice: о скорби, постигшей нас в Асии
  rationale: «Скорбь» передаёт тяжесть θλῖψις, а «постигшей нас» естественно выражает событие, затронувшее Павла и его спутников. Форма «Асия» позволяет отличить римскую провинцию от современной Азии.
- source_word: καθ’ ὑπερβολὴν ὑπὲρ δύναμιν ἐβαρήθημεν
  choice: нам было чрезвычайно тяжело, сверх наших сил
  rationale: Передаёт образ непосильного бремени и оба усилителя, не создавая тяжеловесного буквального оборота «мы были отягощены».
- source_word: ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν
  choice: так что мы отчаялись даже остаться в живых
  rationale: Сохраняет значение результата и крайнюю степень отчаяния; «остаться в живых» ясно выражает контекстуальный смысл τοῦ ζῆν.
theological_decisions:
- issue: Охват обращения ἀδελφοί
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет грамматическую форму источника, а вероятное обращение ко всей верующей общине отмечено в сноске без конфессионального истолкования.
- issue: Смысл отчаяния καὶ τοῦ ζῆν
  choice: отчаялись даже остаться в живых
  alternative: не надеялись даже выжить
  rationale: Формулировка сохраняет экзистенциальную силу высказывания, но не превращает его в богословское утверждение об окончательной утрате всякой надежды.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского послания. Синтаксис сделан ясным для обычного читателя; «Асия» выбрана как историческое название провинции и снабжена пояснением.
