source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: ru
  text: 'Павел, апостол Мессии Иисуса[a] по воле Бога, и Тимофей, наш брат, — церкви Божьей в Коринфе вместе со всеми святыми, которые находятся по всей Ахайе:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: Христа Иисуса.'
    reason: Традиционная передача титула Χριστός.
lexical_decisions:
- source_word: ἀπόστολος
  choice: апостол
  rationale: Устоявшееся и точное обозначение посланного и уполномоченного служителя; «посланник» здесь недостаточно передаёт характер служения Павла.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Мессии Иисуса
  rationale: Сохраняет порядок греческих слов и явно передаёт титульное значение Χριστός; традиционный вариант указан в сноске.
- source_word: διὰ θελήματος θεοῦ
  choice: по воле Бога
  rationale: Естественная русская передача формулы, выражающей Божью волю как основание апостольского призвания Павла.
- source_word: ὁ ἀδελφὸς
  choice: наш брат
  rationale: Хотя притяжательного местоимения в греческом нет, в данном приветствии определённая форма указывает на известные общинные отношения; «наш брат» естественно передаёт это по-русски.
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: церкви Божьей
  rationale: «Церковь» — устоявшаяся и контекстуально точная передача ἐκκλησία в Павловом приветствии; русская притяжательная форма естественно выражает принадлежность Богу.
- source_word: ἁγίοις
  choice: святыми
  rationale: Устоявшееся в Новом Завете обозначение всего освящённого Божьего народа, а не только особо почитаемых верующих.
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: по всей Ахайе
  rationale: Идиоматично передаёт распространённость адресатов по всей области Ахайи.
theological_decisions:
- issue: Передача титула Χριστός в сочетании Χριστοῦ Ἰησοῦ
  choice: Мессии Иисуса
  alternative: Христа Иисуса
  rationale: Основной текст делает явным значение титула «Мессия», не превращая его незаметно в собственное имя; традиционная передача сохраняется в сноске.
- issue: Кого обозначает ἅγιοι
  choice: все святые
  alternative: все освящённые
  rationale: Сохранён краткий Павлов термин для всех верующих области; формулировка не ограничивает его позднейшей категорией канонизированных святых.
translation_notes:
  register: Современный литературный русский язык с достоинством эпистолярного приветствия. Тире отделяет отправителей от адресатов и помогает ясно прочитать длинную конструкцию; двоеточие сохраняет её продолжение в следующем стихе.
