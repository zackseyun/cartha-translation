    issue: Слово «ещё» перенесено к первому будущему глаголу.
    rationale: В SBLGNT первое «καὶ ῥύσεται» не содержит ἔτι; «καὶ ἔτι» стоит только перед последним ῥύσεται. Русское «ещё» должно относиться к ожидаемому в будущем избавлению после выражения надежды.
  revised_text: Он избавил нас от столь великой смерти и избавит; на Него мы возложили надежду, что Он ещё избавит нас[a].
  revised_footnotes:
