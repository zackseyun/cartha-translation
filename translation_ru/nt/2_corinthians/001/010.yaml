source:
  edition: SBLGNT
  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: ru
  text: Он избавил нас от столь великой смерти и избавит; на Него мы возложили надежду, что Он ещё избавит нас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от такой смертельной опасности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τηλικούτου
  choice: столь великой
  rationale: Передаёт усиленное указание на огромный масштаб пережитой угрозы и сохраняет возвышенную выразительность греческой фразы.
- source_word: θανάτου
  choice: смерти
  rationale: Сохраняет прямое значение существительного и сильный образ Павла; возможный смысл смертельной опасности указан в сноске.
- source_word: ἐρρύσατο
  choice: избавил
  rationale: Глагол обозначает освобождение от грозящей опасности; «избавил» естественно звучит по-русски и допускает как буквенную смерть, так и смертельную угрозу.
- source_word: ῥύσεται
  choice: избавит
  rationale: Тот же русский глагол сохраняет лексическую связь с ἐρρύσατο и ясно передаёт будущее действие.
- source_word: εἰς ὃν
  choice: на Него
  rationale: В сочетании с глаголом надежды предлог обозначает Того, на кого направлена и возложена надежда; это естественная русская конструкция.
- source_word: ἠλπίκαμεν
  choice: мы возложили надежду
  rationale: Перфект выражает возникшую прежде и сохраняющуюся уверенную надежду; эта формулировка передаёт её устойчивый характер.
- source_word: καὶ ἔτι
  choice: и впредь
  rationale: Передаёт сочетание продолжения и дополнительного будущего избавления, не устраняя повтор, присутствующий в греческом тексте.
theological_decisions:
- issue: Понимать ли θάνατος буквально как «смерть» или идиоматически как «смертельную опасность»
  choice: Сохранить «смерть» в основном тексте
  alternative: Передать выражение как «такая смертельная опасность»
  rationale: В греческом тексте прямо употреблено слово «смерть». Его сохранение удерживает силу авторского образа, тогда как вероятный идиоматический смысл сообщается в сноске.
- issue: Характер будущего избавления в заключительной части стиха
  choice: Сохранить обещание будущего избавления без уточнения его способа или обстоятельств
  alternative: Истолковать его как окончательное спасение от смерти либо как повторное избавление от конкретной опасности
  rationale: Текст утверждает продолжающуюся надежду на Божье избавление, но не уточняет здесь, относится ли оно к конкретным будущим бедствиям или к окончательному спасению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор глагола «избавить» намеренно сохранён как смысловая и риторическая особенность греческого текста; местоимение «Он» использовано вместо тяжеловесного начального «Который» для самостоятельного чтения стиха.
