  to: Он избавил нас от столь великой смерти и избавит; на Него мы возложили надежду, что Он ещё избавит нас[a].
  rationale: Исправлено только положение «ещё», чтобы оно передавало заключительное καὶ ἔτι, а не первое καὶ ῥύσεται. Сохранены образ «столь великой смерти», повтор «избавит» и бездоктринальная открытость будущего избавления.
