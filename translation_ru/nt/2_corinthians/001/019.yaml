  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: ru
  text: Ведь Сын Божий, Иисус Христос, которого мы — я, Силуан и Тимофей — возвещали среди вас, не был «да» и «нет»; напротив, в Нём было «да».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не стал „да“ и „нет“, но в Нём стало „да“».'
    reason: Сноска сохраняет необычную формулировку греческого текста и отражает употребление ἐγένετο / γέγονεν («стал» / «стало»), тогда как основной текст передаёт её естественнее по-русски.
lexical_decisions:
- source_word: υἱὸς τοῦ θεοῦ
  choice: Сын Божий
  rationale: Сохраняет титульное христологическое выражение в естественной для русского библейского языка форме.
- source_word: Ἰησοῦς Χριστός
  choice: Иисус Христос
  rationale: В данном сочетании Χριστός функционирует как устойчивое именование; традиционная русская форма естественна и не устраняет мессианского значения.
- source_word: κηρυχθείς
  choice: которого мы возвещали
  rationale: «Возвещали» передаёт публичный, провозгласительный оттенок κηρύσσω и звучит современно и достойно.
- source_word: δι’ ἡμῶν ... δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: мы ... — я, Силуан и Тимофей
  rationale: Русская активная конструкция ясно передаёт посредничество названных проповедников и избегает тяжеловесного повтора «через нас — через меня».
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὔ
  choice: не стал одновременно «да» и «нет»
  rationale: Глагол «стал» отражает ἐγένετο, а «одновременно» естественно выражает соединительное καί в противопоставлении, не сводя образ к пояснительной парафразе.
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: напротив, в Нём утвердилось «да»
  rationale: «Утвердилось» передаёт совершившийся и сохраняющий силу результат перфекта γέγονεν; образное «да» и выражение «в Нём» сохранены.
theological_decisions:
- issue: Передача Χριστός как титула или устойчивого именования
  choice: Иисус Христос
  alternative: Иисус Мессия
  rationale: Хотя Χριστός означает «Помазанник, Мессия», сочетание Ἰησοῦς Χριστός здесь естественно воспринимается как устойчивое личное именование; традиционная форма не вносит конфессионального толкования.
- issue: Толкование противопоставления Ναί и Οὔ
  choice: Сохранить риторические «да» и «нет»
  alternative: Передать смысл как «не был непостоянен, но верен»
  rationale: Прямое воспроизведение образа сохраняет богословскую напряжённость и связь со следующим стихом, не подменяя слова Павла истолкованием.
- issue: Значение перфекта γέγονεν
  choice: утвердилось
  alternative: стало / было
  rationale: Форма передаёт наступивший результат, который остаётся действительным, но не уточняет сверх текста, к чему именно относится подразумеваемое «да».
translation_notes:
  register: Современный литературный русский с достоинством библейской прозы. Активная конструкция устраняет неестественное для русского языка нагромождение оборотов с «через», а кавычки отмечают слова «да» и «нет» как элементы риторического противопоставления.
