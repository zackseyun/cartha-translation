  text: Ἐγὼ δὲ μάρτυρα τὸν θεὸν ἐπικαλοῦμαι ἐπὶ τὴν ἐμὴν ψυχήν, ὅτι φειδόμενος ὑμῶν οὐκέτι ἦλθον εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/023.yaml
  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: ru
  text: 'Но я призываю Бога в свидетели и ручаюсь собственной жизнью[a]: я не пришёл снова в Коринф, чтобы пощадить вас.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на мою душу»; возможно также: «против меня самого».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «я больше не пришёл в Коринф».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: Но я
  rationale: Передаёт лёгкое противопоставление δέ и подчёркнутое ἐγώ естественным русским оборотом.
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: призываю Бога в свидетели
  rationale: Естественная русская формула торжественного свидетельства, сохраняющая судебно-клятвенный оттенок греческого выражения.
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: и ручаюсь собственной жизнью
  rationale: Передаёт смысл клятвенного призывания Бога, при котором Павел отвечает собой за истинность сказанного; буквальный образ сохранён в примечании.
- source_word: ὅτι
  choice: ':'
  rationale: Двоеточие естественно вводит содержание торжественного заявления, которое в греческом вводится союзом ὅτι.
- source_word: φειδόμενος ὑμῶν
  choice: чтобы пощадить вас
  rationale: Ясно и естественно передаёт мотив, выраженный обстоятельственным причастием.
- source_word: οὐκέτι ἦλθον
  choice: не пришёл снова
  rationale: В контексте отложенного повторного посещения наиболее естественно передаёт οὐκέτι; возможное значение «больше не пришёл» отмечено в сноске.
- source_word: εἰς Κόρινθον
  choice: в Коринф
  rationale: Обычное русское обозначение движения в город.
theological_decisions:
- issue: Смысл клятвенной формулы ἐπὶ τὴν ἐμὴν ψυχήν
  choice: и ручаюсь собственной жизнью
  alternative: 'против меня самого; буквально: на мою душу'
  rationale: Основной текст передаёт личную ответственность Павла, не превращая ψυχή в специальное антропологическое утверждение; буквальность и неоднозначность отражены в примечании.
translation_notes:
  register: Современный литературный русский язык; тон торжественный, но понятный. Клятвенная формула передана идиоматически, а её буквальный образ и возможный оттенок ответственности — в примечании.
