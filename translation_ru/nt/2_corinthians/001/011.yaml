  text: συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα διὰ πολλῶν εὐχαριστηθῇ ὑπὲρ ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/011.yaml
  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: ru
  text: Вы также содействуете нам молитвой за нас, чтобы многие люди[b] вознесли благодарность за нас за дар, данный нам по милости[a][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы от многих лиц дар, данный нам, через многих был возблагодарён за нас». Связь слов «через многих» с остальной фразой не вполне ясна: они могут относиться к благодарению либо указывать на участие многих, вероятно в молитве.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «от многих лиц». Здесь «лица» означает людей.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «за оказанную нам милость», «за данное нам благословение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνυπουργούντων καὶ ὑμῶν
  choice: Вы тоже помогаете нам
  rationale: Оборот выражает совместное содействие адресатов. «Вы тоже помогаете нам» естественно передаёт как значение помощи, так и присоединительный смысл συν- и καί.
- source_word: τῇ δεήσει
  choice: своей молитвой
  rationale: 'Дательный падеж имеет инструментальное значение: помощь осуществляется посредством молитвы. δέησις обозначает настойчивую молитву-просьбу; в данном контексте современное «молитвой» звучит ясно и достойно.'
- source_word: ἐκ πολλῶν προσώπων
  choice: многие люди
  rationale: Буквально πρόσωπα — «лица», но здесь это естественная метонимия для людей. Русское «многие люди» передаёт смысл без неуместного буквализма.
- source_word: τὸ εἰς ἡμᾶς χάρισμα
  choice: дарованный нам благодатный дар
  rationale: χάρισμα обозначает дар, данный по благодати. Формулировка сохраняет образ дара и указание на незаслуженную Божью милость, не сводя выражение только к абстрактной «милости».
- source_word: εὐχαριστηθῇ
  choice: принесли благодарность
  rationale: Греческая пассивная форма по-русски естественно передаётся устойчивым выражением «принести благодарность». Объект благодарения в греческом не назван, поэтому в основной текст не добавлено слово «Богу».
- source_word: ὑπὲρ ἡμῶν
  choice: за нас
  rationale: Краткое русское выражение сохраняет значение отношения и представительства, уместное в контексте молитвы и благодарения.
- source_word: διὰ πολλῶν
  choice: учтено в примечании как «через многих»
  rationale: Связь этого оборота с соседними членами предложения не вполне ясна, а буквальное воспроизведение двух близких упоминаний «многих» делает основную русскую фразу малопонятной. Неопределённость сохранена в примечании, а не молча устранена.
theological_decisions:
- issue: Кому приносится благодарность
  choice: Не добавлять в основной текст слово «Богу»
  alternative: «многие люди возблагодарили Бога»
  rationale: По контексту благодарение, несомненно, обращено к Богу, однако в самой греческой фразе адресат не выражен. Пассивно-именная конструкция сохраняет эту особенность источника.
- issue: Что обозначает χάρισμα в данном контексте
  choice: «благодатный дар» без поясняющего отождествления
  alternative: «избавление», «благословение» или «оказанная нам милость»
  rationale: Контекст связывает дар с избавлением Павла, но само слово шире. Перевод не превращает контекстуальный вывод в явное содержание стиха.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис сделан доступным для чтения вслух; при этом трудность повторяющихся ἐκ πολλῶν προσώπων и διὰ πολλῶν не разрешена догматически, а вынесена в примечание. Все маркеры [a], [b], [c] присутствуют в основном тексте.
