  terminology: «Благословение» не навязывает узкоденоминационного толкования и в русском библейском регистре может обозначать благо или милость. Поскольку χάρις лексически допускает «благодать», это значение следует сохранить в примечании как буквальный вариант, а не называть его лишь отдалённой альтернативой.
