  verdict: revise
  source_fidelity: 'Основной смысл передан верно: πεποίθησις — «уверенность», ἐβουλόμην — «намеревался», πρότερον — «сначала/прежде», а ἵνα со σχῆτε — цель предполагаемого визита. Однако «Именно с такой» добавляет выделительное значение, которого в Καὶ ταύτῃ τῇ πεποιθήσει нет, и не передаёт союз καί. «Благодеяние» возможно в широком смысле, но в современном русском обычно означает конкретный благотворительный поступок и потому неудачно сужает χάρις.'
