  text: ὁ παρακαλῶν ἡμᾶς ἐπὶ πάσῃ τῇ θλίψει ἡμῶν, εἰς τὸ δύνασθαι ἡμᾶς παρακαλεῖν τοὺς ἐν πάσῃ θλίψει διὰ τῆς παρακλήσεως ἧς παρακαλούμεθα αὐτοὶ ὑπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/004.yaml
  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: ru
  text: утешающий нас во всякой нашей скорби[a], чтобы мы могли утешать находящихся в любой скорби тем утешением, которым Бог утешает нас самих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ободряющий нас… ободрять… ободрением… ободряет». В греческом тексте на протяжении всего стиха употребляются слова одного корня.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶν / παρακαλεῖν / παρακλήσεως / παρακαλούμεθα
  choice: утешающий / утешать / утешением / утешает
  rationale: В контексте θλῖψις эта группа слов обозначает утешение, которое одновременно ободряет и укрепляет. Повтор одного русского корня сохраняет заметную в греческом тексте лексическую связь.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: во всякой нашей скорби
  rationale: Предлог передан идиоматически, а θλῖψις — как «скорбь», то есть тяжёлое страдание или бедствие, а не только душевная печаль.
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: чтобы и мы могли
  rationale: Оборот допускает оттенки цели и результата; «чтобы… могли» естественно сохраняет эту смысловую связь. Частица «и» подчёркивает переход от получаемого утешения к утешению других.
- source_word: τοὺς ἐν πάσῃ θλίψει
  choice: находящихся в любой скорби
  rationale: 'Второе πάσῃ имеет широкий распределительный смысл: речь идёт о людях, переживающих скорбь любого рода.'
- source_word: διὰ τῆς παρακλήσεως
  choice: тем утешением
  rationale: Творительный падеж естественно выражает средство и сохраняет повтор существительного той же корневой группы.
- source_word: ἧς παρακαλούμεθα αὐτοὶ ὑπὸ τοῦ θεοῦ
  choice: которым Бог утешает нас самих
  rationale: Активная русская конструкция естественнее буквального пассива, ясно сохраняет Бога как действующее лицо и передаёт эмфатическое αὐτοὶ словами «нас самих».
theological_decisions:
- issue: Смысловой диапазон παρακαλέω / παράκλησις
  choice: утешать / утешение
  alternative: ободрять / ободрение; поддерживать / поддержка
  rationale: Связь со скорбью выводит на первый план утешение, понимаемое не как простое успокоение чувств, а как укрепляющую поддержку. Сноска сохраняет более широкий диапазон греческой лексемы.
- issue: Цель или результат в εἰς τὸ δύνασθαι
  choice: «чтобы… могли», без жёсткого разграничения цели и результата
  alternative: «так что мы можем»
  rationale: Греческая конструкция может совмещать целевой и результативный оттенки; перевод не должен искусственно устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис следует греческому ходу мысли, но пассив в заключительной части преобразован в естественную русскую активную конструкцию. Маркер [a] поставлен после первого ключевого слова, к которому относится лексическая сноска.
