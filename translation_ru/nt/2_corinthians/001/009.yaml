revisions:
- from: Но мы и сами уже имели в себе смертный приговор[a], чтобы полагаться не на самих себя, а на Бога, воскрешающего мёртвых.
  to: Но мы сами были уверены, что нам вынесен смертный приговор[a], чтобы мы полагались не на самих себя, а на Бога, воскрешающего мёртвых.
  rationale: Перевод убирает не обусловленное оригиналом «уже» и делает русскую целевую конструкцию грамматически полной. «Были уверены, что нам вынесен смертный приговор» естественно передаёт внутреннее наличие решающего смертного исхода, не утверждая, что Павел и его спутники сами вынесли этот приговор. Сохранены судебный оттенок ἀπόκριμα, эмфаза αὐτοὶ («мы сами»), цель ἵνα и описание Бога как воскрешающего мёртвых.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:57:59Z'
review_pass:
  verdict: revise
  source_fidelity: '«Смертный приговор» удачно передаёт τὸ ἀπόκριμα τοῦ θανάτου, а «воскрешающего мёртвых» точно соответствует τῷ ἐγείροντι τοὺς νεκρούς. Однако «имели в себе» в современном русском менее ясно выражает итоговое внутреннее убеждение/ощущение, передаваемое ἐν ἑαυτοῖς ... ἐσχήκαμεν; «уже» не имеет прямой опоры в тексте. Также инфинитив «чтобы полагаться» при подлежащем «мы» звучит неполно: цель относится к тому, чтобы они не продолжали полагаться на себя.'
  naturalness: 'Фраза в целом понятна, но «мы и сами уже имели в себе смертный приговор» тяжеловесна и несколько неестественна. «Мы сами в себе уже вынесли себе...» было бы чрезмерно интерпретирующим, поэтому лучше сохранить неоднозначность через «мы сами уже ощущали, что нам вынесен смертный приговор»; однако это добавляет «ощущали». Более близкое и естественное решение: «мы сами уже были уверены, что нам вынесен смертный приговор».'
  terminology: «Смертный приговор» и «Бог, воскрешающий мёртвых» уместны в современном литературном библейском регистре. Сноска «приговор к смерти» является реальной лексической альтернативой и должна быть сохранена.
  issues:
  - severity: medium
    issue: Добавлено «уже»
    rationale: ἐσχήκαμεν — перфект «имеем/имели», выражающий достигнутое состояние; наречие «уже» может подразумевать временную последовательность, которая прямо не выражена.
  - severity: medium
    issue: Не вполне естественно передана целевая конструкция
    rationale: «Чтобы полагаться не на самих себя» не согласует действие с обозначенным субъектом. Греческое ἵνα μὴ πεποιθότες ὦμεν означает «чтобы мы не полагались/не возлагали надежду на самих себя».
  - severity: low
    issue: Порядок «и сами ... в себе» утяжеляет фразу
    rationale: Эмфатическое αὐτοὶ и ἐν ἑαυτοῖς можно передать яснее, не утверждая, будто апостолы сами вынесли себе приговор.
  revised_text: Но мы сами были уверены, что нам вынесен смертный приговор[a], чтобы мы полагались не на самих себя, а на Бога, воскрешающего мёртвых.
  revised_footnotes:
  - marker: a
    text: 'Или: «приговор к смерти».'
    reason: lexical_alternative
  revision_rationale: Перевод убирает не обусловленное оригиналом «уже» и делает русскую целевую конструкцию грамматически полной. «Были уверены, что нам вынесен смертный приговор» естественно передаёт внутреннее наличие решающего смертного исхода, не утверждая, что Павел и его спутники сами вынесли этот приговор. Сохранены судебный оттенок ἀπόκριμα, эмфаза αὐτοὶ («мы сами»), цель ἵνα и описание Бога как воскрешающего мёртвых.
