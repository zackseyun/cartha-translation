  text: ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς τὸ ἀπόκριμα τοῦ θανάτου ἐσχήκαμεν, ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ τῷ ἐγείροντι τοὺς νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: ru
  text: Но мы сами были уверены, что нам вынесен смертный приговор[a], чтобы мы полагались не на самих себя, а на Бога, воскрешающего мёртвых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приговор к смерти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт сильное противопоставление предыдущей мысли и естественно связывает стих с контекстом.
- source_word: αὐτοὶ ἐν ἑαυτοῖς
  choice: мы и сами… в себе
  rationale: Сохраняет эмфатическое αὐτοὶ и внутренний, личный характер ἐν ἑαυτοῖς, не превращая его в явное самоосуждение.
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: смертный приговор
  rationale: В данном контексте ἀπόκριμα обозначает решающий исход или судебное постановление; выражение передаёт ощущение неизбежности смерти и естественно звучит по-русски.
- source_word: ἐσχήκαμεν
  choice: уже имели
  rationale: Глагол буквально выражает обладание или пребывание в установившемся состоянии; «уже» помогает передать результативный оттенок перфекта, не добавляя идеи получения извне.
- source_word: ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς
  choice: чтобы полагаться не на самих себя
  rationale: Передаёт целевое значение ἵνα и устойчивую уверенность или опору, выраженную πεποιθότες.
- source_word: ἀλλ’ ἐπὶ τῷ θεῷ
  choice: а на Бога
  rationale: Сохраняет прямое противопоставление опоры на себя и опоры на Бога.
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: воскрешающего мёртвых
  rationale: Точно и кратко описывает Бога через Его силу возвращать умерших к жизни; «мёртвых» сохраняет обобщённую форму оригинала.
theological_decisions:
- issue: Передавать ли τοὺς νεκρούς как «мёртвых» или как «умерших людей»
  choice: мёртвых
  alternative: умерших людей
  rationale: «Мёртвых» точно, естественно и сохраняет широкое богословское звучание утверждения о Божьей силе воскресения.
- issue: Понимать ли смертный приговор как вынесенный самими апостолами самим себе
  choice: имели в себе смертный приговор
  alternative: сами вынесли себе смертный приговор
  rationale: Оригинал говорит о наличии приговора внутри них, но прямо не утверждает, что они сами его вынесли; выбранный вариант не снимает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к греческому, но остаётся понятным; причастный оборот «воскрешающего мёртвых» сохраняет компактность исходного определения.
