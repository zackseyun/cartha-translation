  text: εἴτε δὲ θλιβόμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως καὶ σωτηρίας· ⸂εἴτε παρακαλούμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως⸃ τῆς ἐνεργουμένης ἐν ὑπομονῇ τῶν αὐτῶν παθημάτων ὧν καὶ ἡμεῖς πάσχομεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: ru
  text: Но если мы терпим скорби, то ради вашего утешения и спасения; если же получаем утешение, то ради вашего утешения[a][b], которое действует в стойком перенесении тех же страданий, какие терпим и мы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях отсутствуют слова: «если же получаем утешение, то ради вашего утешения».'
    reason: textual_variant
  - marker: b
    text: 'Или: «ободрения»; соответственно, «получаем ободрение». Это греческое слово сочетает значения утешения и укрепляющего ободрения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβόμεθα
  choice: мы терпим скорби
  rationale: Настоящее страдательное указывает на продолжающееся претерпевание давления и бедствий; выражение естественно для современного литературного русского языка и сохраняет связь со страданиями в конце стиха.
- source_word: παρακλήσεως / παρακαλούμεθα
  choice: утешение / получаем утешение
  rationale: В контексте 2 Кор 1:3–7 слово включает утешение и ободряющее укрепление. Единообразный перевод сохраняет повтор ключевого греческого корня.
- source_word: σωτηρίας
  choice: спасение
  rationale: Передаёт обычный широкий смысл σωτηρία у Павла, не сужая его до временного избавления от беды.
- source_word: τῆς ἐνεργουμένης
  choice: которое действует
  rationale: Передаёт действенность утешения, а не просто его наличие, и оставляет утешение грамматическим субъектом действия.
- source_word: ἐν ὑπομονῇ
  choice: когда вы стойко переносите
  rationale: Идиоматично выражает проявление действенного утешения в терпеливой стойкости; подразумеваемое «вы» ясно из «вашего утешения» и обращения к коринфянам.
- source_word: τῶν αὐτῶν παθημάτων
  choice: те же страдания
  rationale: Прямо сохраняет мысль об общности страданий Павла и коринфян.
- source_word: ὑπὲρ
  choice: ради
  rationale: Ясно передаёт направленность происходящего на благо адресатов и естественно звучит в обеих параллельных частях.
theological_decisions:
- issue: Объём значения σωτηρία
  choice: спасение
  alternative: избавление
  rationale: Контекст допускает связь с избавлением среди скорбей, но более широкое «спасение» сохраняет богословскую ёмкость слова и не устраняет возможную многозначность.
- issue: Связь τῆς ἐνεργουμένης ἐν ὑπομονῇ
  choice: утешение действует, когда адресаты стойко переносят страдания
  alternative: утешение производит стойкость при перенесении страданий
  rationale: Греческая конструкция описывает действенность утешения в стойком перенесении; перевод не делает более определённой причинную связь, которую текст прямо не формулирует.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Сохранены параллелизм двух условных частей, повтор «утешение» и напряжение между утешением, спасением и стойким перенесением страданий. Местоимение «вы» добавлено в придаточной конструкции ради естественности и ясности русского синтаксиса.
