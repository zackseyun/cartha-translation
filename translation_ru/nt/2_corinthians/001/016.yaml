  text: καὶ δι’ ὑμῶν διελθεῖν εἰς Μακεδονίαν, καὶ πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι εἰς τὴν Ἰουδαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/016.yaml
  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: ru
  text: и через вас отправиться в Македонию, а затем из Македонии снова прийти к вам, чтобы вы проводили меня в Иудею.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы вы помогли мне отправиться в Иудею».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὑμῶν
  choice: через вас
  rationale: διά с родительным падежом обозначает движение через Коринф, где находились адресаты; формулировка сохраняет маршрутный смысл.
- source_word: διελθεῖν εἰς Μακεδονίαν
  choice: отправиться в Македонию
  rationale: В контексте намеченного маршрута сочетание передаёт дальнейшее путешествие в Македонию. Буквальное «пройти в Македонию» по-русски неестественно.
- source_word: πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς
  choice: а затем из Македонии снова прийти к вам
  rationale: «Снова» сохраняет πάλιν и указывает на повторное посещение адресатов; «затем» естественно связывает последовательные этапы маршрута.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι
  choice: чтобы вы помогли мне продолжить путь
  rationale: В контексте путешествий προπέμπω часто означает проводить путника и снабдить его необходимым для дальнейшей дороги. Активная русская конструкция естественно передаёт агентность ὑφ’ ὑμῶν.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: в Иудею
  rationale: Естественное русское обозначение направления движения, точно передающее εἰς.
theological_decisions: []
