base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: ru
  text: 'И надежда наша на вас тверда, потому что мы знаем: как вы участвуете в страданиях, так и в утешении.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ободрении».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίς
  choice: надежда
  rationale: Стандартное и прозрачное соответствие, сохраняющее значение уверенного ожидания без усиления до полной «уверенности».
- source_word: βεβαία
  choice: тверда
  rationale: Передаёт устойчивый, надёжный характер надежды Павла и естественно сочетается со словом «надежда».
- source_word: ὑπὲρ ὑμῶν
  choice: на вас
  rationale: В данном контексте выражает направленность надежды Павла в отношении коринфян; оборот «надежда на вас» естественен для современного русского языка.
- source_word: εἰδότες
  choice: потому что мы знаем
  rationale: Причастие указывает основание твёрдой надежды; причинная связь выражена явно и естественно.
- source_word: ὡς ... οὕτως καί
  choice: как ... так и
  rationale: Сохраняет греческую соотносительную конструкцию и её смысловой параллелизм.
- source_word: κοινωνοί
  choice: участвуете
  rationale: Передаёт идею причастности и совместного участия; глагольная форма естественна по-русски и позволяет ясно восполнить эллипсис второй части.
- source_word: παθημάτων
  choice: страданиях
  rationale: Широкое и ясное соответствие, согласующееся с контекстом 2 Кор 1.
- source_word: παρακλήσεως
  choice: утешении
  rationale: В ближайшем контексте речь прежде всего об утешении среди страданий; перевод сохраняет повторяющуюся тему главы, не исключая оттенка ободрения.
- source_word: '[эллипсис во второй части]'
  choice: участвуете
  rationale: В греческом сказуемое после «так и» подразумевается; его восполнение в русском необходимо для естественного и ясного прочтения.
