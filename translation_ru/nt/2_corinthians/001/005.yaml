  text: ὅτι καθὼς περισσεύει τὰ παθήματα τοῦ Χριστοῦ εἰς ἡμᾶς, οὕτως διὰ τοῦ Χριστοῦ περισσεύει καὶ ἡ παράκλησις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/005.yaml
  text: For just as the sufferings of Christ overflow to us[b][a], so also through Christ our comfort overflows.
translation:
  language: ru
  text: Ведь как преизобилуют в нас страдания Христа[a], так через Христа преизобилует и наше утешение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страдания за Христа». Греческое выражение может обозначать страдания, относящиеся к Христу, или страдания, переносимые ради Него.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ведь
  rationale: Вводит объяснение предыдущего утверждения и естественно передаёт причинно-пояснительную связь в современном русском языке.
- source_word: καθὼς ... οὕτως
  choice: как ... так
  rationale: Сохраняет соотносительную конструкцию и ясное сопоставление двух частей стиха.
- source_word: περισσεύει
  choice: преизобилуют / преизобилует
  rationale: Повтор одного глагола сохраняет риторический параллелизм; «преизобиловать» передаёт значение избыточной полноты, хотя и имеет возвышенную окраску.
- source_word: τὰ παθήματα
  choice: страдания
  rationale: Прямой и естественный русский эквивалент, соответствующий контексту скорбей и утешения.
- source_word: τοῦ Χριστοῦ
  choice: Христа
  rationale: Сохраняет неоднозначный греческий генитив и обычное для Павла употребление Χριστός как именования; возможное значение «за Христа» вынесено в сноску.
- source_word: εἰς ἡμᾶς
  choice: в нас
  rationale: Передаёт направленность εἰς ἡμᾶς и сохраняет образ того, что страдания достигают людей и проявляются в их опыте.
- source_word: διὰ τοῦ Χριστοῦ
  choice: через Христа
  rationale: Естественно передаёт διά с родительным падежом как посредство.
- source_word: ἡ παράκλησις ἡμῶν
  choice: наше утешение
  rationale: Формально и ясно сохраняет притяжательную конструкцию, не уточняя без необходимости, идёт ли речь о получаемом или передаваемом утешении.
theological_decisions:
- issue: Смысл выражения «страдания Христа»
  choice: Сохранён прозрачный родительный оборот «страдания Христа», допускающий участие верующих в страданиях, связанных с Христом.
  alternative: «страдания за Христа» или «страдания, которые претерпел Христос и в которых участвует его народ»
  rationale: Греческий генитив допускает несколько отношений; основной текст не должен устранять эту богословски значимую неоднозначность.
- issue: Значение притяжательного местоимения в «наше утешение»
  choice: Сохранено «наше утешение» без поясняющего дополнения.
  alternative: «утешение, которое мы получаем»
  rationale: Греческая форма сама по себе не требует разворачивать притяжательное отношение; буквальная конструкция сохраняет возможную широту смысла.
translation_notes:
  register: Современный литературный русский с достоинством и умеренно возвышенной библейской окраской. «Преизобиловать» выбрано ради повторяющегося образа чрезмерной полноты и точного параллелизма; пунктуация не перегружена.
