  terminology: '«Святые» уместно сохраняет павловский термин ἅγιοι. Для пары διακονία/λειτουργία выбрано нейтральное «служение в этом деле», а не «священный труд»: последнее богословски и контекстуально чрезмерно конкретизирует λειτουργία.'
