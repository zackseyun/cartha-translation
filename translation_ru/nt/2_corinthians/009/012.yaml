  text: ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/012.yaml
  text: For the ministry of this service is not only supplying the needs of the saints[b][a], but is also overflowing in many thanksgivings to God—
translation:
  language: ru
  text: Ибо служение в этом деле не только восполняет нужды святых[a], но и умножает множество благодарений Богу[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «восполняет то, чего недостаёт святым».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «изобилует через многие благодарения Богу»; возможно также: «вызывает множество благодарений Богу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Ведь
  rationale: Союз вводит пояснение к предыдущей мысли; «ведь» естественно передаёт эту пояснительную связь.
- source_word: ἡ διακονία τῆς λειτουργίας ταύτης
  choice: это служение, совершаемое как священный труд
  rationale: 'Передаёт сочетание двух близких существительных, не сливая их полностью: διακονία обозначает служение, а λειτουργία — совершаемый труд с общественным или сакральным оттенком.'
- source_word: προσαναπληροῦσα
  choice: восполняет
  rationale: Глагол означает восполнение существующей нехватки; настоящее время естественно передаёт причастную конструкцию.
- source_word: τὰ ὑστερήματα
  choice: нужды
  rationale: В контексте материальной помощи речь идёт о том, чего недостаёт; «нужды» ясно и естественно выражает смысл.
- source_word: τῶν ἁγίων
  choice: святых
  rationale: Сохраняет обычное для Павла обозначение верующих и не заменяет его более толковательным выражением.
- source_word: περισσεύουσα
  choice: приносит ... обильные
  rationale: Передаёт идею изобилия, хотя ради естественного русского синтаксиса образ выражен через прилагательное при «благодарениях».
- source_word: διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ
  choice: приносит Богу обильные благодарения
  rationale: В контексте διά указывает на благодарения как результат или средство действия служения; дательный τῷ θεῷ обозначает адресата благодарений.
theological_decisions:
- issue: Обозначение верующих словом ἅγιοι
  choice: святые
  alternative: Божий народ; освящённые
  rationale: «Святые» сохраняет терминологию Павла без привнесения идеи позднейшей канонизации отдельных лиц.
- issue: Характер λειτουργία
  choice: священный труд
  alternative: служение; общественное служение
  rationale: В данном контексте слово может нести сакральный или общественно-служебный оттенок. Выбранная формулировка сохраняет отличие от διακονία, не утверждая, что речь идёт о храмовом обряде.
- issue: Связь περισσεύουσα διὰ πολλῶν εὐχαριστιῶν
  choice: приносит Богу обильные благодарения
  alternative: изобилует многими благодарениями Богу
  rationale: Выбор естественно выражает вероятный результат служения, тогда как примечание сохраняет более формально близкую возможность.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис упрощён для ясности, но сохранены пояснительная связь стиха, термин «святые» и смысловая напряжённость конструкции διά с родительным. Конечное тире сохранено как указание на продолжение мысли в следующем стихе.
