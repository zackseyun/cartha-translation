  rationale: Исправление устраняет добавленный смысл «священного труда», сохраняет различение между служением (διακονία) и конкретным делом служения (λειτουργία) настолько, насколько это естественно по-русски, и точнее передаёт изобилие и множественность благодарений. Конечное тире сохранено, поскольку мысль продолжается в следующем стихе.
