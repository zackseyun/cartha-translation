reference: 2 Corinthians 9:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: ru
  text: 'Ибо я знаю вашу готовность[a], которой хвалюсь перед македонянами, говоря о вас: «Ахайя[b] готова ещё с прошлого года»; и ваше рвение воодушевило большинство из них[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «горячее желание».'
    reason: lexical_alternative
  - marker: b
    text: Ахайя — римская провинция, в которую входил Коринф; здесь название области обозначает живущих в ней верующих.
    reason: cultural_note
  - marker: c
    text: 'Или: «бо́льшую часть из них».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμίαν
  choice: готовность
  rationale: Слово обозначает внутреннюю готовность и горячее желание действовать. «Готовность» естественно связано с последующим состоянием готовности Ахайи и не сводит смысл лишь к эмоции.
- source_word: καυχῶμαι
  choice: хвалюсь
  rationale: Сохраняет сильную и характерную для Павла риторическую формулировку, не смягчая её до «одобрительно отзываюсь».
- source_word: ὑπὲρ ὑμῶν
  choice: говоря о вас
  rationale: В сочетании с «хвалюсь» оборот указывает, что предметом похвалы Павла служат адресаты. Такая передача естественна по-русски и не приписывает фразе идею заместительного действия.
- source_word: Μακεδόσιν
  choice: перед македонянами
  rationale: Дательный падеж обозначает людей, которым Павел высказывает похвалу; «перед» естественно выражает адресата такой речи.
- source_word: Ἀχαΐα
  choice: Ахайя
  rationale: Сохранено явное географическое название; в контексте область метонимически обозначает находящихся там верующих, в том числе коринфян.
- source_word: παρεσκεύασται
  choice: готова
  rationale: Перфект передаёт сохраняющееся состояние как результат прежней подготовки; вместе с «с прошлого года» русская форма «готова» выражает это естественно.
- source_word: ἀπὸ πέρυσι
  choice: ещё с прошлого года
  rationale: Оборот указывает на состояние, продолжающееся с предыдущего года до настоящего времени; частица «ещё» подчёркивает длительность без изменения смысла.
- source_word: τὸ ὑμῶν ζῆλος
  choice: ваше рвение
  rationale: «Рвение» передаёт положительную горячность и деятельное усердие, избегая возможного современного оттенка зависти у слова «ревность».
- source_word: ἠρέθισε
  choice: побудило
  rationale: В данном положительном контексте глагол означает вызвать деятельный отклик. «Побудило» передаёт воздействие без отрицательного оттенка «раздражило» или «спровоцировало».
- source_word: τοὺς πλείονας
  choice: большинство из них
  rationale: Субстантивированная сравнительная форма обычно обозначает большую часть упомянутой группы; местоимение относится к македонянам.
theological_decisions:
- issue: Кого обозначает «Ахайя»
  choice: Сохранено название области, метонимически указывающее на верующих в ней.
  alternative: «Вы готовы» или «верующие Ахайи готовы».
  rationale: Греческий текст прямо называет Ἀχαΐα. Сохранение топонима удерживает более широкий региональный охват слов Павла и не ограничивает их одними коринфянами.
- issue: Сила выражения καυχῶμαι
  choice: «хвалюсь»
  alternative: «с гордостью рассказываю» или «хвалю».
  rationale: Прямая передача сохраняет риторическую остроту слов Павла; богословских оснований смягчать выражение нет.
- issue: Связь относительного местоимения ἣν
  choice: 'Оно отнесено к «готовности»: Павел хвалится этой готовностью, говоря об адресатах.'
  alternative: Свободно перестроить как «я хвалюсь вами».
  rationale: Женское относительное местоимение грамматически соотносится с προθυμίαν; перевод сохраняет эту связь, одновременно естественно передавая ὑπὲρ ὑμῶν.
translation_notes:
  register: Современный литературный русский язык с достойным, но доступным синтаксисом. Прямая речь оформлена кавычками для ясного выделения содержания похвалы Павла; географическое название и сильное «хвалюсь» сохранены. Повтор корня «готовность — готова» намеренно отражает смысловую связь в греческом тексте.
