source:
  edition: SBLGNT
  text: καὶ αὐτῶν δεήσει ὑπὲρ ὑμῶν ἐπιποθούντων ὑμᾶς διὰ τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ ἐφ’ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/014.yaml
  text: and in their prayer for you[a], they long for you because of the surpassing grace of God upon you.
translation:
  language: ru
  text: и в своей молитве о вас они тоскуют по вам благодаря преизобильной Божьей благодати, дарованной вам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέησις
  choice: молитва
  rationale: Слово обозначает обращённую к Богу настоятельную просьбу или моление. «Молитва» естественно звучит по-русски и в данном контексте включает ходатайство; более узкое «прошение» отмечено в сноске.
- source_word: αὐτῶν
  choice: своей / они
  rationale: Родительный падеж множественного числа относится к получателям дара. При перестройке сжатой греческой конструкции местоимение передано возвратным «своей», а подразумеваемое подлежащее — «они».
- source_word: ὑπὲρ ὑμῶν
  choice: о вас
  rationale: Ὑπέρ с родительным в контексте молитвы означает ходатайство за кого-либо; по-русски наиболее естественно «молиться о вас».
- source_word: ἐπιποθούντων
  choice: они горячо стремятся к вам
  rationale: Глагол выражает сильное, продолжающееся желание и сердечное влечение. «Горячо стремятся к вам» сохраняет интенсивность, не добавляя прямо отсутствующих в тексте идей встречи или общения.
- source_word: διὰ
  choice: из-за
  rationale: 'С винительным падежом διά указывает на причину: их стремление к адресатам вызвано действием Божьей благодати. «Из-за» ясно сохраняет причинную связь.'
- source_word: ὑπερβάλλουσαν
  choice: необычайной
  rationale: Причастие характеризует благодать как превосходящую обычную меру. «Необычайной» передаёт исключительность естественным современным русским языком.
- source_word: χάριν τοῦ θεοῦ
  choice: Божьей благодати
  rationale: «Благодать» сохраняет важный для Павла богословский смысл χάρις как незаслуженного Божьего расположения и действия.
- source_word: ἐφ’ ὑμῖν
  choice: к вам
  rationale: Ἐπί с дательным здесь допускает смысл направленности или проявления благодати по отношению к адресатам. «К вам» передаёт это без добавления образов излияния или пребывания, которых нет в греческом тексте.
- source_word: καὶ
  choice: и
  rationale: Союз сохраняет связь стиха с продолжающимся предложением предыдущего контекста.
theological_decisions:
- issue: Связь молитвы и горячего стремления в сжатой греческой конструкции
  choice: «в своей молитве о вас они горячо стремятся к вам»
  alternative: «своим молением о вас, горячо стремясь к вам»
  rationale: Родительный оборот αὐτῶν ... ἐπιποθούντων допускает понимание молитвы как сферы или способа выражения стремления. Русская личная конструкция ясно передаёт оба действия, но не утверждает жёстко, что молитва является исключительно средством этого стремления.
- issue: Характер Божьей благодати по отношению к адресатам
  choice: «необычайной Божьей благодати к вам»
  alternative: «превосходящей Божьей благодати на вас»
  rationale: Выбранный вариант сохраняет причинную роль благодати и её направленность к адресатам, избегая неестественного русского оборота и не уточняя сверх текста, каким именно образом благодать проявилась.
translation_notes:
  register: Современный литературный русский язык с достоинством церковного текста. Начальное «и» сохранено как связь с предыдущим стихом. Синтаксис слегка развёрнут ради ясности, при этом причинная связь и неоднозначное соотношение молитвы со стремлением не переистолкованы.
