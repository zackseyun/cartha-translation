  text: ὁ δὲ ἐπιχορηγῶν ⸀σπόρον τῷ σπείροντι καὶ ἄρτον εἰς βρῶσιν ⸀χορηγήσει καὶ ⸀πληθυνεῖ τὸν σπόρον ὑμῶν καὶ ⸀αὐξήσει τὰ γενήματα τῆς δικαιοσύνης ὑμῶν·)
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/010.yaml
  text: The one who supplies seed to the sower and bread for food will supply and multiply your seed and increase the harvest of your righteousness[a][b].
translation:
  language: ru
  text: Тот, кто даёт семя сеющему и хлеб в пищу, даст и умножит ваше семя и увеличит плоды вашей праведности[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «урожай вашей праведности»; также возможно: «результаты вашей праведности».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «плоды вашей справедливости». Греческое слово δικαιοσύνη может означать как «праведность», так и, в некоторых контекстах, «справедливость».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: тот, кто даёт
  rationale: Артикль с причастием передан как субстантивированный оборот. «Даёт» естественно по-русски и сохраняет смысл снабжения, не усиливая явно оттенок щедрости.
- source_word: σπόρον
  choice: семя
  rationale: Прямое сельскохозяйственное значение сохраняет образ сеяния и его метафорическое продолжение.
- source_word: τῷ σπείροντι
  choice: сеющему
  rationale: Субстантивированное причастие естественно передаётся русским причастием в дательном падеже.
- source_word: ἄρτον εἰς βρῶσιν
  choice: хлеб в пищу
  rationale: Сохраняется назначение хлеба и параллель с семенем, предназначенным для сеяния.
- source_word: χορηγήσει
  choice: даст
  rationale: Будущее время сохранено; выбор поддерживает лексическую связь с начальным «даёт», не создавая тяжеловесного повтора «снабжает — снабдит».
- source_word: πληθυνεῖ
  choice: умножит
  rationale: Передаёт увеличение количества и хорошо сочетается с образом семени.
- source_word: τὸν σπόρον ὑμῶν
  choice: ваше семя
  rationale: Буквальная передача сохраняет смысловую широту между материальными средствами для щедрости и сельскохозяйственной метафорой.
- source_word: αὐξήσει
  choice: увеличит
  rationale: Сохраняет значение роста или приумножения и синтаксически естественно сочетается с «плоды».
- source_word: τὰ γενήματα
  choice: плоды
  rationale: Греческое слово обозначает произведённое, урожай или плоды. «Плоды» естественно соединяются с нравственным результатом, сохраняя сельскохозяйственный образ; буквальная альтернатива отмечена в сноске.
- source_word: δικαιοσύνης
  choice: праведности
  rationale: Основное богословски ёмкое соответствие, не сужающее значение до одной лишь социальной справедливости; возможное значение «справедливость» сохранено в сноске.
theological_decisions:
- issue: Смысл выражения «плоды вашей праведности»
  choice: Результаты праведной щедрости коринфян, без ограничения смысла материальным воздаянием или судебно-оправдательным статусом
  alternative: Материальное благословение за щедрость; плоды справедливости или верности; свидетельство праведного поведения
  rationale: Контекст посвящён щедрому даянию, а сельскохозяйственная метафора допускает широкий спектр результатов. Перевод сохраняет эту широту и не превращает стих в обещание материального процветания.
- issue: Значение δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет обычную для Павла богословскую ёмкость слова; «справедливость» контекстуально возможна и поэтому указана в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского регистра. Синтаксис ясен для обычного читателя; сельскохозяйственная метафора и смысловая неоднозначность сохранены. Вводное δέ отдельно не выражено: здесь оно имеет слабую связующую функцию и не требует искусственного «теперь» или тяжёлого «же».'
