  yaml_path: translation/nt/2_corinthians/009/015.yaml
  text: Thanks be to God for his indescribable gift[a].
translation:
  language: ru
  text: Благодарение Богу за Его неописуемый дар[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «невыразимый дар». Греческое слово означает то, что невозможно вполне описать или передать словами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Благодарение
  rationale: В восклицательной конструкции с дательным τῷ θεῷ слово выражает благодарность и хвалу, а не обозначает «благодать» в обычном смысле.
- source_word: τῷ θεῷ
  choice: Богу
  rationale: Дательный указывает на Того, Кому возносится благодарение; русская формула «Благодарение Богу» естественна и торжественна.
- source_word: ἐπὶ
  choice: за
  rationale: Предлог с дательным обозначает основание или причину благодарности; по-русски это естественно передаётся предлогом «за».
- source_word: ἀνεκδιηγήτῳ
  choice: неописуемый
  rationale: Прилагательное обозначает то, что невозможно полно описать или выразить словами. «Неописуемый» ясно и естественно передаёт этот смысл.
- source_word: αὐτοῦ
  choice: Его
  rationale: Местоимение естественно относится к Богу и сохраняется без замены именем.
- source_word: δωρεᾷ
  choice: дар
  rationale: Существительное означает свободно данный дар; слово «дар» точно, кратко и стилистически уместно.
theological_decisions:
- issue: К чему именно относится выражение «Его неописуемый дар»
  choice: Оставить дар неопределённым, как в греческом тексте
  alternative: Прямо назвать этим даром Христа, спасение во Христе либо Божью благодать, проявившуюся в щедрости коринфян
  rationale: Сам стих не уточняет, что именно названо даром. Контекст допускает несколько взаимосвязанных толкований, поэтому перевод не сужает смысл и сохраняет богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной и доксологической формой. Восклицательный знак передаёт характер заключительного возгласа; местоимение «Его» написано с прописной буквы по принятой русской библейской традиции.
