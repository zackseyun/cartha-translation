id: 2CO.9.8
reference: 2 Corinthians 9:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: ru
  text: Бог же силен в изобилии даровать вам всякую благодать, чтобы вы, всегда и во всём имея полный достаток[a], изобиловали во всяком добром деле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «имея всё необходимое». Греческое слово может означать достаточность, обеспеченность или удовлетворённость; здесь речь идёт о том, что Бог даёт достаточно для добрых дел, а не о независимой самодостаточности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατεῖ
  choice: силен
  rationale: Передаёт реальную способность и силу Бога, сохраняя акцент греческого глагола и естественное для возвышенной современной русской речи выражение.
- source_word: δὲ
  choice: же
  rationale: Мягко связывает стих с предшествующим рассуждением, не создавая сильного противопоставления.
- source_word: πᾶσαν χάριν
  choice: всякую благодать
  rationale: Сохраняет широкий смысл Божьей благодати, которая в данном контексте включает и обеспечение, позволяющее проявлять щедрость, но не сводится только к материальным средствам.
- source_word: περισσεῦσαι
  choice: в изобилии даровать
  rationale: 'Передаёт каузативную мысль: Бог делает так, что благодать обильно достигает адресатов. Формулировка естественна по-русски и поддерживает мотив изобилия.'
- source_word: εἰς ὑμᾶς
  choice: вам
  rationale: Естественно выражает направленность Божьей благодати к адресатам.
- source_word: ἵνα
  choice: чтобы
  rationale: Сохраняет целевое и результирующее значение придаточного предложения.
- source_word: ἐν παντὶ πάντοτε
  choice: всегда и во всём
  rationale: Передаёт оба всеохватных выражения и сохраняет риторическое накопление форм с πᾶς.
- source_word: πᾶσαν αὐτάρκειαν
  choice: полный достаток
  rationale: Обозначает обеспеченность всем необходимым, а не независимую самодостаточность. В сноске отмечена более разъяснительная передача и сохранён смысловой диапазон слова.
- source_word: ἔχοντες
  choice: имея
  rationale: Сохраняет одновременность обеспеченности и изобилия в добрых делах, а также причастную структуру исходного текста.
- source_word: περισσεύητε
  choice: изобиловали
  rationale: Сохраняет образ изобилия и словесную перекличку с περισσεῦσαι.
- source_word: εἰς πᾶν ἔργον ἀγαθόν
  choice: во всяком добром деле
  rationale: Естественно сочетается по-русски с глаголом «изобиловать» и передаёт всеохватность добрых дел.
theological_decisions:
- issue: Значение χάρις в контексте щедрости
  choice: Божья благодать в широком смысле, включающая обеспечение для щедрости
  alternative: Только благоволение или исключительно материальный дар
  rationale: Контекст касается даяния, однако χάρις шире материального снабжения; «всякая благодать» сохраняет эту богословскую широту.
- issue: Значение αὐτάρκεια
  choice: Достаток, то есть обеспеченность необходимым от Бога
  alternative: Удовлетворённость или независимая самодостаточность
  rationale: Контекст подчёркивает Божье обеспечение ради добрых дел, поэтому перевод не должен внушать мысль об автономии человека; сноска сохраняет допустимый смысловой диапазон.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Повтор всеохватных выражений и мотив изобилия сохранён без тяжеловесной буквальности.
