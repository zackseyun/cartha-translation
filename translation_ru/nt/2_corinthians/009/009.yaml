base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/009.yaml
  text: 'as it is written: “He scattered abroad[a], he gave to the poor; his righteousness remains forever.”'
translation:
  language: ru
  text: 'Как написано: «Он щедро раздал, дал бедным; праведность[a] его пребывает вечно».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость». Греческое слово может обозначать и праведность, и справедливость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: как написано
  rationale: Устойчивое и естественное по-русски выражение, вводящее цитату из Писания.
- source_word: Ἐσκόρπισεν
  choice: Он щедро раздал
  rationale: Глагол буквально передаёт образ рассеивания во все стороны; в контексте помощи нуждающимся речь идёт о широкой и щедрой раздаче. «Расточил» формально ближе, но в современном русском часто подразумевает неразумную трату.
- source_word: ἔδωκεν
  choice: дал
  rationale: Простая форма прошедшего времени прямо передаёт греческий аорист и сохраняет поэтический параллелизм цитаты.
- source_word: τοῖς πένησιν
  choice: бедным
  rationale: Прямое и понятное обозначение людей, живущих в нужде или имеющих ограниченные средства.
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: праведность его
  rationale: «Праведность» сохраняет широкий нравственный смысл δικαιοσύνη и лексическую связь с употреблением этого слова у Павла; возможный оттенок справедливости отмечен в сноске.
- source_word: μένει
  choice: пребывает
  rationale: Передаёт продолжительное, неизменное существование; слово уместно в возвышенном регистре цитаты из Писания и остаётся понятным современному читателю.
- source_word: εἰς τὸν αἰῶνα
  choice: вечно
  rationale: Естественно передаёт устойчивое выражение со значением непрекращающейся длительности.
theological_decisions:
- issue: Значение δικαιοσύνη в цитате, приведённой Павлом
  choice: праведность
  alternative: справедливость
  rationale: В данном контексте слово может указывать как на праведный характер и поступок щедрого человека, так и на его справедливость. Основной текст сохраняет более широкое «праведность», не сводя смысл только к одному нравственному аспекту; альтернатива дана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном, соответствующим прямой цитате из Писания. Поэтический параллелизм сохранён; архаичное и двусмысленное для современного читателя «расточил» заменено ясным «щедро раздал».
