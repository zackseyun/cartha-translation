id: 2CO.9.6
reference: 2 Corinthians 9:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τοῦτο δέ, ὁ σπείρων φειδομένως φειδομένως καὶ θερίσει, καὶ ὁ σπείρων ἐπ’ εὐλογίαις ἐπ’ εὐλογίαις καὶ θερίσει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: ru
  text: 'Вот что: кто сеет скупо, тот скупо и пожнёт, а кто сеет щедро[a], тот щедро и пожнёт.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с благословениями». Греческое выражение ἐπ’ εὐλογίαις содержит существительное «благословение», но в этом контексте может идиоматически обозначать щедрую меру; то же выражение повторено применительно к жатве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: 'Вот что:'
  rationale: Кратко и естественно вводит сформулированный далее принцип; передаёт указательное Τοῦτο и переходную функцию δέ, не добавляя отсутствующего в греческом временного «теперь».
- source_word: ὁ σπείρων
  choice: кто сеет
  rationale: Русская обобщённая конструкция естественно передаёт субстантивированное причастие и сохраняет характер пословичного утверждения.
- source_word: φειδομένως
  choice: скупо
  rationale: Передаёт малую, сдержанную меру сеяния и пожинания. В данном контексте слово относится прежде всего к мере, а не обязательно приписывает человеку нравственный порок.
- source_word: καὶ θερίσει
  choice: тот … и пожнёт
  rationale: Соотносительная русская конструкция «кто … тот …» ясна и сохраняет соответствие между сеянием и жатвой; частица «и» передаёт καί.
- source_word: ἐπ’ εὐλογίαις
  choice: щедро
  rationale: В контексте пожертвований греческое выражение с существительным «благословение» идиоматически обозначает щедрую меру. «Щедро» звучит естественно по-русски, а буквальный образ и его смысловая напряжённость сохранены в сноске.
- source_word: ἐπ’ εὐλογίαις ... ἐπ’ εὐλογίαις καὶ θερίσει
  choice: сеет щедро … щедро и пожнёт
  rationale: Повтор одного наречия сохраняет строгий параллелизм исходного изречения и не превращает обещанную жатву в прямую гарантию материального обогащения.
theological_decisions:
- issue: Значение εὐλογίαις в образе сеяния и жатвы
  choice: В основном тексте передать идиоматически как «щедро», отметив в сноске буквальное «с благословениями».
  alternative: «сеет с благословениями … с благословениями и пожнёт»
  rationale: Контекст указывает на щедрость дара, но существительное εὐλογία сохраняет оттенок благословения. Сноска удерживает оба смысловых уровня, не превращая стих ни в чисто количественную формулу, ни в обещание непременного материального достатка.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная структура и параллелизм сохранены. Формула «кто … тот …» понятна широкому кругу читателей и соответствует обобщённому характеру греческой конструкции.
