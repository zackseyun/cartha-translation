revisions:
- from: Но я послал братьев, чтобы наша похвала вами не оказалась напрасной в этом деле и чтобы вы, как я и говорил, были готовы.
  to: Но я послал братьев, чтобы то, чем мы хвалились, говоря о вас, не оказалось напрасным в этом отношении и чтобы вы были готовы, как я и говорил.
  rationale: Исправление устраняет неестественную и потенциально неверно направленную русскую конструкцию «похвала вами», сохраняя смысл καύχημα ὑπὲρ ὑμῶν. «В этом отношении» передаёт идиоматическое μέρος без лишней конкретизации. Две целевые конструкции и оттенок прежнего, возможно повторяемого высказывания в «как я и говорил» сохранены.
