translation_notes:
  register: Современный литературный русский язык; тон сдержанный и достойный. Сохранены две параллельные целевые конструкции с «чтобы». Буквальный образ «опустошения» передан идиоматически, поскольку «похвала не была опустошена» по-русски звучит неясно и искусственно.
