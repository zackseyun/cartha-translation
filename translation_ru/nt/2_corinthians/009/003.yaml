translation:
  language: ru
  text: Но я послал братьев, чтобы то, чем мы хвалились, говоря о вас, не оказалось напрасным в этом отношении и чтобы вы были готовы, как я и говорил.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεμψα
  choice: я послал
  rationale: Аорист в данном пояснительно-повествовательном контексте естественно передаётся русским прошедшим временем.
- source_word: τοὺς ἀδελφούς
  choice: братьев
  rationale: Речь идёт о конкретных посланниках Павла; форма мужского рода соответствует греческому тексту и ближайшему контексту.
- source_word: τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν
  choice: наша похвала вами
  rationale: καύχημα обозначает похвалу или предмет гордости; творительный «вами» естественно передаёт направленность слов Павла о коринфянах, не сводя выражение лишь к уверенности.
- source_word: κενωθῇ
  choice: не оказалась напрасной
  rationale: Буквально глагол означает «стать пустым, быть лишённым содержания»; идиоматический русский оборот передаёт смысл несостоятельности похвалы.
- source_word: ἐν τῷ μέρει τούτῳ
  choice: в этом деле
  rationale: μέρος здесь употреблено в переносном значении — «в этом отношении, в данном вопросе»; речь идёт о подготовке пожертвования.
- source_word: καθὼς ἔλεγον
  choice: как я и говорил
  rationale: Имперфект допускает оттенок продолжающейся или повторявшейся речи; русский оборот сохраняет отсылку к прежним словам Павла без неестественной тяжеловесности.
- source_word: παρεσκευασμένοι ἦτε
  choice: были готовы
  rationale: Перифрастическая конструкция выражает состояние достигнутой готовности; русское «были готовы» естественно следует за целевым «чтобы».
