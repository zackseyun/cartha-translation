reference: 2 Corinthians 9:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers[a] to go to you ahead of us and arrange in advance the generous gift[b] you had promised, so that it would be ready as a generous gift and not as something extorted[c].
translation:
  language: ru
  text: Поэтому я счёл необходимым настоятельно попросить братьев[a] отправиться к вам раньше нас и заранее подготовить обещанный вами щедрый дар[b], чтобы он был готов как щедрый дар, а не как вынужденный побор[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братьев и сестёр», если это обозначение делегации следует понимать инклюзивно.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «благословение». Здесь имеется в виду обещанное коринфянами щедрое пожертвование.'
    reason: lexical_alternative
  - marker: c
    text: Греческое слово pleonexia обычно означает «алчность» или «корыстолюбие»; здесь оно представляет сбор как корыстное взыскание, а не как добровольный щедрый дар.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖον οὖν ἡγησάμην
  choice: Поэтому я счёл необходимым
  rationale: Передаёт вывод οὖν и обдуманное суждение ἡγησάμην, сохраняя выраженную ἀναγκαῖον практическую необходимость.
- source_word: παρακαλέσαι
  choice: настоятельно попросить
  rationale: В данном контексте глагол означает побуждение к своевременному действию; сочетание передаёт настойчивость, но не звучит как приказ.
- source_word: τοὺς ἀδελφοὺς
  choice: братьев
  rationale: Сохраняется грамматически мужская форма греческого текста; возможность более широкого употребления указана в сноске.
- source_word: προέλθωσιν εἰς ὑμᾶς
  choice: отправиться к вам раньше нас
  rationale: Ясно выражает, что посланники должны прибыть прежде Павла и его спутников; подразумеваемое сравнение восстанавливается из контекста поездки.
- source_word: προκαταρτίσωσι
  choice: заранее подготовить
  rationale: Передаёт как предварительность действия, так и доведение сбора до готовности до прибытия Павла.
- source_word: τὴν προεπηγγελμένην … ὑμῶν
  choice: обещанный вами
  rationale: Причастие указывает на данное ранее обещание, а родительный ὑμῶν естественно понимается как относящий обещание и дар к коринфянам.
- source_word: εὐλογίαν
  choice: щедрый дар
  rationale: В контексте сбора εὐλογία обозначает щедрое пожертвование. Повтор выражения сохраняет риторический контраст; буквальное «благословение» отмечено в сноске.
- source_word: οὕτως ὡς εὐλογίαν
  choice: именно как щедрый дар
  rationale: «Именно» естественно передаёт οὕτως в его пояснительно-контрастной функции и подчёркивает желаемый характер пожертвования.
- source_word: πλεονεξίαν
  choice: побор
  rationale: Хотя обычные значения слова — «алчность», «корыстолюбие», здесь оно метонимически представляет сбор как корыстное и вынужденное взыскание, противопоставленное добровольной щедрости.
theological_decisions:
- issue: Кого обозначает τοὺς ἀδελφούς
  choice: братьев
  alternative: братьев и сестёр
  rationale: Мужская форма исходного текста сохранена без догматического уточнения состава делегации; потенциально инклюзивное употребление вынесено в сноску.
- issue: Значение εὐλογία применительно к сбору
  choice: щедрый дар
  alternative: благословение
  rationale: Контекстуальный смысл делает речь о пожертвовании понятной современному читателю, а буквальный образ и возможность услышать дар как «благословение» сохранены в сноске.
- issue: Смысл πλεονεξία в противопоставлении εὐλογία
  choice: побор
  alternative: алчность; корыстолюбие
  rationale: 'Павел противопоставляет не просто внутренние качества, а два способа представить сбор: добровольный щедрый дар или нечто взысканное под давлением. Сноска сохраняет обычный лексический диапазон слова.'
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Тон серьёзный, но не архаичный. «Побор» кратко и выразительно сохраняет отрицательный образ принудительно взысканного дара; сноска предупреждает о более обычном значении греческого существительного.
