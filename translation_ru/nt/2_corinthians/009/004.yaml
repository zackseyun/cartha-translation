  text: μή πως ἐὰν ἔλθωσιν σὺν ἐμοὶ Μακεδόνες καὶ εὕρωσιν ὑμᾶς ἀπαρασκευάστους καταισχυνθῶμεν ἡμεῖς, ἵνα μὴ ⸀λέγωμεν ὑμεῖς, ἐν τῇ ὑποστάσει ⸀ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: ru
  text: Чтобы, если со мной придут македоняне и застанут вас неподготовленными, мы — не говоря уже о вас[a] — не оказались посрамлены в этой уверенности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не упоминая о вас». Павел в виде оговорки даёт понять, что коринфяне тоже разделили бы этот стыд.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «в этом начинании» или «в таком положении». Греческое слово здесь, вероятнее всего, относится к уверенности Павла в коринфянах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μή πως ἐὰν
  choice: Как бы не вышло так, что, если
  rationale: Оборот передаёт опасение Павла по поводу возможного будущего развития событий и сохраняет условное значение ἐάν.
- source_word: ἔλθωσιν σὺν ἐμοὶ Μακεδόνες
  choice: со мной придут македоняне
  rationale: Форма без артикля не указывает на заранее определённую группу; по-русски неопределённость естественно передаётся без добавления «какие-нибудь».
- source_word: εὕρωσιν ὑμᾶς ἀπαρασκευάστους
  choice: застанут вас неподготовленными
  rationale: «Застанут» естественно выражает обнаружение их состояния по прибытии, а «неподготовленными» точно передаёт ἀπαρασκευάστους в контексте ещё не готового сбора.
- source_word: καταισχυνθῶμεν
  choice: окажемся посрамлены
  rationale: Сохранены пассивная форма и публичный, общественный оттенок стыда, а не только внутреннее чувство неловкости.
- source_word: ἡμεῖς
  choice: мы
  rationale: Явное греческое местоимение имеет эмфатический характер; в русском тексте акцент поддержан обособленной вставкой.
- source_word: ἵνα μὴ λέγωμεν ὑμεῖς
  choice: не говоря уже о вас
  rationale: Естественная русская формула передаёт смягчающую оговорку, которая одновременно подразумевает, что коринфяне также были бы посрамлены.
- source_word: ἐν τῇ ὑποστάσει ταύτῃ
  choice: в этой уверенности
  rationale: ὑπόστασις здесь, вероятнее всего, обозначает уверенность Павла в коринфянах или основание этой уверенности. Буквенно близкая формулировка сохраняет некоторую неоднозначность выражения.
theological_decisions:
- issue: Значение ὑπόστασις в нетехническом контексте
  choice: уверенность или основание уверенности
  alternative: начинание; положение дел
  rationale: Контекст говорит об уверенности Павла в готовности коринфян, поэтому неуместно придавать слову позднейший метафизический смысл «сущность» или «ипостась». При этом сноска сохраняет допустимые контекстуальные варианты.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского увещевания. Конструкция «Как бы не вышло так» естественно выражает опасение; «окажемся посрамлены» сохраняет более высокий регистр и пассивно-публичный смысл исходного глагола.
