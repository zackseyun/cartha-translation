  terminology: «Служение», «прославляют Бога», «послушание», «исповедание», «Благая Весть», «Мессия» и «щедрость» последовательно передают ключевые термины. «Мессия» обоснованно сохраняет титульную семантику Χριστός; сноска отмечает вариант «Евангелие Христа» и не устраняет синтаксическую неоднозначность.
