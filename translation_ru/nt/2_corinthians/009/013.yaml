source:
  edition: SBLGNT
  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: ru
  text: Благодаря свидетельству, которое дало это служение, они прославляют Бога за послушание, проявленное в вашем исповедании Благой Вести Мессии[a], и за щедрость, с которой вы делитесь с ними и со всеми[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Евангелия Христа». Греческое слово Χριστός здесь передано как титул «Мессия»; родительный падеж может также указывать на принадлежность или источник Благой Вести.'
    reason: alternative_reading
  - marker: b
    text: Здесь «делитесь» означает прежде всего щедрое материальное участие в сборе помощи, хотя греческое слово может также обозначать общение или сопричастность.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμῆς
  choice: доказало свою подлинность
  rationale: Слово обозначает результат испытания — доказанную подлинность. Глагольная формулировка естественно передаёт это значение по-русски.
- source_word: διακονίας
  choice: служение
  rationale: Речь идёт о практическом служении помощи, связанном со сбором пожертвований; «служение» сохраняет и практический, и религиозный оттенки.
- source_word: δοξάζοντες τὸν θεὸν
  choice: они прославляют Бога
  rationale: Причастие передано личной формой ради ясности внутри длинного греческого предложения; «прославляют» близко соответствует δοξάζω.
- source_word: τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν
  choice: за вашу покорность исповедуемой вами Благой Вести
  rationale: Так сохраняется смысл покорности, связанной с исповеданием, без неестественного русского оборота «покорность вашего исповедания».
- source_word: εὐαγγέλιον
  choice: Благая Весть
  rationale: Передаёт значение вести о спасении естественным и понятным современным русским выражением.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Здесь Χριστός является титулом; «Мессия» сохраняет его смысл, а не превращает в имя.
- source_word: ἁπλότητι
  choice: щедрость
  rationale: В контексте денежного сбора слово означает открытость и щедрость в даянии, а не просто искренность.
- source_word: κοινωνίας
  choice: делитесь
  rationale: В данном контексте κοινωνία указывает на материальное участие и помощь; «делитесь» звучит естественно и сохраняет более широкий смысл участия.
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: с ними и со всеми
  rationale: При передаче κοινωνία глаголом «делитесь» это наиболее естественный русский способ обозначить получателей и круг участия.
theological_decisions:
- issue: Передача Χριστοῦ в выражении εὐαγγέλιον τοῦ Χριστοῦ
  choice: Благая Весть о Мессии
  alternative: Евангелие Христа / Благая Весть Христа
  rationale: Родительный падеж допускает связь как с содержанием вести, так и с её принадлежностью или происхождением. Основной текст естественно передаёт весть о Мессии, а сноска сохраняет грамматическую неоднозначность.
- issue: Связь ὑποταγῇ с ὁμολογίας
  choice: ваша покорность исповедуемой вами Благой Вести
  alternative: покорность вашего исповедания Благой Вести
  rationale: Греческая конструкция компактна и допускает более буквальную формулировку, однако по-русски она была бы неясной. Выбранный вариант связывает покорность с исповедуемой Благой Вестью, не добавляя отдельного объекта послушания.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис несколько развёрнут, чтобы сохранить ход мысли Павла, но тяжёлая буквальная конструкция с двумя отвлечёнными существительными заменена естественными русскими оборотами.
