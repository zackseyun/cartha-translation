revisions:
- from: Благодаря тому, что это служение доказало свою подлинность, они прославляют Бога за вашу покорность исповедуемой вами Благой Вести о Мессии[a] и за щедрость, с которой вы делитесь с ними и со всеми[b].
  to: Благодаря свидетельству, которое дало это служение, они прославляют Бога за послушание, проявленное в вашем исповедании Благой Вести Мессии[a], и за щедрость, с которой вы делитесь с ними и со всеми[b].
