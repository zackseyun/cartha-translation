  source_fidelity: 'Начальный оборот «это служение доказало свою подлинность» чрезмерно конкретизирует δοκιμή и смещает смысл: δοκιμή обозначает доказательство/свидетельство, явленное через это служение, а не обязательно доказанную подлинность самого служения. Кроме того, исходная формулировка недостаточно явно сохраняет связь ὑποταγή с ὁμολογία. Предлагаемый текст передаёт оба элемента, не навязывая спорное толкование родительного падежа при «Благой Вести Мессии».'
