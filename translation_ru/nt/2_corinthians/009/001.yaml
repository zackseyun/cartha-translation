lexical_decisions:
- source_word: Περὶ μὲν γὰρ
  choice: Что же касается
  rationale: Περὶ вводит тему, а сочетание μὲν γὰρ связывает её с предшествующим рассуждением. Русское «Что же касается» естественно передаёт переход к теме, не перегружая фразу буквальной передачей частиц.
- source_word: διακονίας
  choice: служения
  rationale: διακονία обозначает служение, в данном контексте — практическую помощь нуждающимся верующим. «Служение» сохраняет достоинство, которое Павел придаёт этому делу, и не сужает значение до одного лишь денежного сбора.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: святым
  rationale: Оборот указывает на направленность служения или на тех, ради кого оно совершается. Дательный падеж естественен по-русски и допускает оба смысловых оттенка; альтернативу поясняет сноска.
- source_word: ἁγίους
  choice: святым
  rationale: ἅγιοι — обычное у Павла обозначение верующих как посвящённых Богу. «Святые» — точный, краткий и укоренённый в библейском русском языке эквивалент.
- source_word: περισσόν
  choice: нет нужды
  rationale: Здесь περισσόν означает излишнее или ненужное. Выражение «мне нет нужды» передаёт смысл естественно и достойно, избегая менее современного «излишне» в безличной конструкции.
- source_word: μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: мне нет нужды писать вам об этом
  rationale: Русская безличная конструкция естественно передаёт греческое сочетание с артиклевым инфинитивом. «Об этом» ясно возвращает читателя к только что названному служению и не добавляет нового содержания.
