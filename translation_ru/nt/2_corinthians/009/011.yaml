    rationale: «Обогащаясь» может читаться как нейтральное «становясь богаче» и не вполне передаёт, что обогащение совершается над адресатами. Форма «обогащаемые» сохраняет пассив без введения прямо не названного субъекта.
  - severity: medium
    issue: Сочетание «для всякой щедрости» неестественно и двусмысленно.
    rationale: Русское «всякая щедрость» может означать различные виды щедрости, тогда как πᾶσαν ἁπλότητα здесь усиливает полноту и направленность щедрости. Целевая конструкция «чтобы проявлять полную щедрость» яснее передаёт смысл.
  - severity: low
