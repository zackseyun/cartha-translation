  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для всякого великодушия в даянии». В других контекстах ἁπλότης может означать «искренность» или «простоту», но здесь контекст говорит в пользу щедрости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντὶ
  choice: во всём
  rationale: Передаёт широкий, всеохватный смысл выражения и сохраняет связь с данным Богом обеспечением, не ограничивая его одной областью.
- source_word: πλουτιζόμενοι
  choice: обогащаясь
  rationale: Настоящее страдательное причастие передано естественной русской формой; подразумеваемым источником обогащения остаётся Бог. Контекст не требует идеи безусловного материального богатства.
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: для всякой щедрости
  rationale: Предлог εἰς выражает направленность или цель, а ἁπλότης в контексте сбора пожертвований означает открытость и щедрость в даянии.
- source_word: ἥτις
  choice: которая
  rationale: Относительное местоимение естественно соотносится со «щедростью» и вводит её следствие.
- source_word: κατεργάζεται
  choice: производит
  rationale: Глагол обозначает достижение или порождение результата; «производит» кратко сохраняет причинную связь.
- source_word: δι’ ἡμῶν
  choice: через нас
  rationale: Сохраняет выраженную διά с родительным падежом посредническую роль Павла и его сотрудников без добавления отсутствующего в тексте слова «служение».
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: благодарение Богу
  rationale: Существительное εὐχαριστία передано существительным «благодарение», а дательный τῷ θεῷ — естественной русской конструкцией адресата.
theological_decisions:
- issue: Значение ἁπλότης в контексте сбора пожертвований
  choice: щедрость в даянии
  alternative: простота, искренность или чистосердечие
  rationale: Хотя слово может обозначать простоту или искренность, ближайший контекст материальной помощи и возникающего вследствие неё благодарения Богу указывает на конкретную щедрость. Сноска сохраняет лексическую широту слова.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, библейски достойным звучанием. Синтаксис намеренно сохраняет незавершённость греческого предложения и тире в конце, поскольку стих продолжает более широкую мысль.
