  text: ἕκαστος καθὼς ⸀προῄρηται τῇ καρδίᾳ, μὴ ἐκ λύπης ἢ ἐξ ἀνάγκης· ἱλαρὸν γὰρ δότην ἀγαπᾷ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/007.yaml
  text: Each one should give as he has decided in his heart[a], not out of grief or compulsion[b], for God loves a cheerful giver.
translation:
  language: ru
  text: Каждый пусть даёт, как решил в своём сердце, не с огорчением[a] и не по принуждению, ведь Бог любит того, кто даёт с радостью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не против желания», «не с неохотой»; буквально: «не из печали (скорби)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: Каждый
  rationale: Сохраняет распределительное единственное число и относится к каждому человеку без указания исключительно на мужчин.
- source_word: προῄρηται
  choice: решил
  rationale: Передаёт обдуманное, заранее принятое личное решение; форма «решил» естественна в современном русском контексте.
- source_word: τῇ καρδίᾳ
  choice: в своём сердце
  rationale: Сохраняет библейский образ сердца как внутреннего средоточия намерений и воли, не сводя его только к рассудочному решению.
- source_word: μὴ ἐκ λύπης
  choice: не с огорчением
  rationale: Сохраняет прямое значение λύπη — печаль, скорбь, огорчение — и при этом естественно звучит применительно к даянию.
- source_word: ἢ ἐξ ἀνάγκης
  choice: и не по принуждению
  rationale: В данном контексте ἀνάγκη обозначает вынужденность или давление. Русское «по принуждению» ясно передаёт отсутствие свободного желания.
- source_word: ἱλαρὸν ... δότην
  choice: того, кто даёт с радостью
  rationale: Естественная русская передача определения «радостного, охотно дающего» при сохранении акцента на расположении дающего.
- source_word: ἀγαπᾷ ὁ θεός
  choice: Бог любит
  rationale: Прямо сохраняет обычное значение ἀγαπάω и не подменяет любовь более узким понятием одобрения.
theological_decisions:
- issue: Подразумеваемое повеление о даянии
  choice: Каждый пусть даёт
  alternative: Каждый — как решил в своём сердце
  rationale: В греческом стихе личная форма глагола «давать» не выражена, но однозначно подразумевается контекстом наставления о сборе пожертвований. «Пусть даёт» естественно передаёт наставительный смысл, не усиливая его до жёсткого приказа.
- issue: Значение λύπη при даянии
  choice: не с огорчением
  alternative: не против желания; не с неохотой
  rationale: Основной текст сохраняет образ печали или внутренней тягости, а примечание сообщает естественный контекстуальный смысл, не устраняя лексическую напряжённость исходного выражения.
- issue: Родовое значение единственного числа
  choice: Каждый пусть даёт, как решил в своём сердце
  alternative: Каждый человек пусть даёт согласно принятому им решению
  rationale: Русское «каждый» в этом контексте имеет обобщающее значение и охватывает людей обоих полов; отдельное местоимение мужского рода не требуется.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краткий и понятный; образ сердца сохранён, а тяжеловесная буквальная конструкция «радостного дающего» передана естественным оборотом.
