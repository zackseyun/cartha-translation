  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: ru
  text: Но то, что я делаю, я буду делать и впредь, чтобы лишить повода[a] тех, кто хочет иметь повод, и чтобы в том, чем они хвалятся, они оказались такими же, как и мы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возможности», «основания» или «предлога»; то же во втором случае употребления слова «повод» (греч. ἀφορμή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: Но то, что я делаю, я буду делать и впредь
  rationale: Настоящее и будущее время передают нынешнюю практику Павла и его решимость продолжать её; «и впредь» естественно выражает эту продолженность по-русски.
- source_word: ἐκκόψω
  choice: лишить
  rationale: В сочетании с «поводом» глагол метафорически означает устранить или отнять основание; «лишить повода» звучит естественно и сохраняет направленность действия против тех, кто ищет такой повод.
- source_word: ἀφορμή
  choice: повод
  rationale: В данном полемическом контексте слово обозначает повод, возможность или основание для притязания. «Повод» сохраняет нейтральность самого существительного и допускает отрицательную оценку из контекста.
- source_word: τῶν θελόντων ἀφορμήν
  choice: тех, кто хочет иметь повод
  rationale: Передаёт причастие θελόντων без усиления до «ищет» или «жаждет» и сохраняет намеренный повтор слова ἀφορμή.
- source_word: ἐν ᾧ καυχῶνται
  choice: в том, чем они хвалятся
  rationale: Естественно передаёт сферу или предмет похвальбы, не уточняя его сверх сказанного в греческом тексте.
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: они оказались такими же, как и мы
  rationale: «Оказались» передаёт пассивную форму εὑρεθῶσιν, а «такими же, как и мы» сохраняет прямое сравнение противников с Павлом и его сотрудниками.
theological_decisions:
- issue: Характер искомой противниками ἀφορμή
  choice: В основном тексте употреблено относительно нейтральное «повод».
  alternative: «возможность», «основание» или более оценочное «предлог»
  rationale: Полемический контекст придаёт искомому поводу отрицательную окраску, однако само существительное не требует толкования «предлог». Нейтральный вариант сохраняет смысловой диапазон.
- issue: Связь второго ἵνα с предыдущей частью предложения
  choice: Сохранена последовательность «и чтобы», не уточняющая сверх текста, чью именно цель раскрывает придаточное.
  alternative: 'Явно истолковать его как цель противников: «которые хотят получить повод оказаться…»'
  rationale: Греческий синтаксис допускает смысловую связь второго целевого оборота как с намерением Павла лишить противников повода, так и с содержанием искомого ими повода. Русская формулировка сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и полемический. Повтор «повод» сохранён вслед за греческим текстом, а продолженность действия естественно выражена словами «и впредь».
