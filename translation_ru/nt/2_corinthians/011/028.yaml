  source_fidelity: 'Текст точно передаёт основные элементы греческого: χωρὶς τῶν παρεκτός — «Помимо всего прочего» с сохранением более конкретных возможностей в примечании; καθ’ ἡμέραν — «изо дня в день»; ἐπίστασίς μοι — «на меня давит»; μέριμνα πασῶν τῶν ἐκκλησιῶν — «забота обо всех церквах». Русская синтаксическая связь «давит ... забота» корректно передаёт вероятное пояснительное приложение, не исключая тяжести ежедневного бремени.'
