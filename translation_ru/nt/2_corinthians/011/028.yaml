  text: χωρὶς τῶν παρεκτὸς ἡ ⸀ἐπίστασίς ⸀μοι ἡ καθ’ ἡμέραν, ἡ μέριμνα πασῶν τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/028.yaml
  text: 'Apart from such external things[c][b][a], there is the daily pressure on me: concern for all the churches.'
translation:
  language: ru
  text: Помимо всего прочего[a], изо дня в день на меня давит[b] забота[c] обо всех церквах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не считая остального»; возможно также: «Помимо внешних обстоятельств» или «помимо того, что осталось неупомянутым».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «лежит на мне ежедневным бременем». Греческое слово может обозначать давление, напор или обременяющее воздействие.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «тревога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς τῶν παρεκτὸς
  choice: Помимо всего прочего
  rationale: 'Оборот обозначает то, что остаётся за пределами уже перечисленного: «помимо прочего», «не считая остального» или «помимо внешних обстоятельств». Выбранный вариант естественен по-русски и не сужает смысл исключительно до внешних бедствий.'
- source_word: ἡ ἐπίστασίς μοι ἡ καθ’ ἡμέραν
  choice: изо дня в день на меня давит
  rationale: ἐπίστασις может обозначать напор, давление или обременяющее воздействие; дательный μοι передан словами «на меня». Оборот καθ’ ἡμέραν выражает постоянную, ежедневно повторяющуюся нагрузку.
- source_word: ἡ μέριμνα
  choice: забота
  rationale: Слово может означать заботу, тревогу или беспокойство. «Забота» сохраняет пастырскую направленность чувства Павла, а глагол «давит» передаёт его тяжесть, не превращая это чувство в заведомо предосудительную тревожность.
- source_word: πασῶν τῶν ἐκκλησιῶν
  choice: обо всех церквах
  rationale: В контексте посланий Павла ἐκκλησίαι — общины верующих; традиционное и понятное русское соответствие — «церкви».
theological_decisions:
- issue: Характер μέριμνα как пастырского бремени Павла
  choice: забота обо всех церквах
  alternative: тревога обо всех церквах
  rationale: «Забота» не навязывает отрицательной нравственной оценки переживаниям Павла, тогда как образ давления сохраняет их эмоциональную тяжесть.
- issue: Соотношение ἐπίστασις и μέριμνα
  choice: «забота» понята как то давление, которое Павел испытывает ежедневно
  alternative: понимать «ежедневное давление» и «заботу» как два отдельных бремени
  rationale: 'Повтор артикля допускает пояснительное приложение: ежедневное давление состоит в заботе обо всех церквах. Русская формулировка отражает это вероятное соотношение, не добавляя нового богословского содержания.'
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского свидетельства. Фраза построена естественно для обычного читателя; образ ежедневного давления сохранён, а неоднозначность начального оборота и слова μέριμνα вынесена в примечания.
