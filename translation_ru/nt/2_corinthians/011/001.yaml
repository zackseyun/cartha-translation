lexical_decisions:
- source_word: Ὄφελον
  choice: О, если бы
  rationale: Передаёт сильное пожелание, выраженное частицей, естественно и без архаизации.
- source_word: ἀνείχεσθέ μου
  choice: вы потерпели... моего
  rationale: В сочетании с родительным ἀφροσύνης глагол выражает просьбу снисходительно отнестись к некоторой доле неразумия Павла.
- source_word: μικρόν τι ἀφροσύνης
  choice: немного моего неразумия
  rationale: Сохраняет количественное преуменьшение и риторическое самоуничижение; притяжательное «моего» естественно раскрывает связь с μου.
- source_word: ἀλλὰ καὶ
  choice: Впрочем
  rationale: В данном контексте сочетание не просто противопоставляет, а поправляет просьбу с признанием, что адресаты уже терпят Павла.
- source_word: ἀνέχεσθέ μου
  choice: вы и терпите меня
  rationale: Форма может пониматься как изъявительное наклонение или повеление; основной текст отражает изъявительное прочтение, а альтернатива отмечена в сноске.
theological_decisions:
- issue: Самоопределение Павла через ἀφροσύνη
  choice: «неразумие» сохранено как ироническое самоуничижение
  alternative: «глупость»
  rationale: Павел вводит раздел иронического хвастовства; перевод не смягчает риторическое напряжение, но избегает излишне грубого оттенка.
- issue: Наклонение ἀνέχεσθέ во второй части
  choice: 'изъявительное: «вы и терпите меня»'
  alternative: 'повелительное: «потерпите же меня»'
  rationale: Греческая форма формально двусмысленна; контекст допускает как признание уже проявляемого терпения, так и повторную просьбу. Неопределённость обозначена сноской.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского обращения. Междометная конструкция передаёт пожелание, а краткая вторая фраза сохраняет риторический поворот и грамматическую неоднозначность оригинала.
