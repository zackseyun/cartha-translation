- from: и меня спустили через окно в стене в плетёной корзине, и я ускользнул из его рук.[a]
  to: И через окно меня в плетёной корзине спустили через стену, и я избежал его рук.[a]
  rationale: Перевод разделяет два последовательных греческих оборота с διὰ, не уточняя, что речь именно о городской стене. Пассив и образ корзины сохранены. «Избежал его рук» воспроизводит исходную идиому в нейтральном литературном русском; сноска передаёт документированную лексическую альтернативу для σαργάνη без доктринального или излишне пояснительного истолкования.
