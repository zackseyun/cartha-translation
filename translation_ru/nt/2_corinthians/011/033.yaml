  text: and through a window in a basket I was lowered through the wall and escaped his hands[a].
translation:
  language: ru
  text: И через окно меня в плетёной корзине спустили через стену, и я избежал его рук.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в верёвочной корзине».'
    reason: σαργάνη обозначает плетёную ёмкость; возможен более конкретный оттенок материала — верёвочная корзина.
lexical_decisions:
- source_word: θυρίδος
  choice: окно
  rationale: Слово обозначает окно или небольшое отверстие; «окно» — наиболее естественный и конкретный русский эквивалент.
- source_word: σαργάνῃ
  choice: плетёная корзина
  rationale: Слово обозначает плетёную ёмкость, вероятно из верёвок или прутьев. «Плетёная корзина» передаёт как предмет, так и способ изготовления, не уточняя материал сверх текста.
- source_word: ἐχαλάσθην
  choice: меня спустили
  rationale: Пассивная форма χαλάω в данном контексте означает спуск вниз, вероятно с помощью верёвки; русская формулировка естественно сохраняет пассивный смысл.
- source_word: διὰ τοῦ τείχους
  choice: через окно в стене
  rationale: В сочетании с θυρίς речь идёт о спуске через оконный проём в стене. Такая формулировка естественна по-русски и не добавляет отсутствующего в греческом уточнения «городской».
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: ускользнул из его рук
  rationale: Русская идиома сохраняет яркий образ избавления от чужой хватки или власти и звучит естественнее буквального «избежал его рук».
