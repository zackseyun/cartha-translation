base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/021.yaml
  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: ru
  text: Говорю это к нашему стыду[a], как будто мы были слабы[b]. Но в чём бы кто ни осмеливался хвалиться[c] — говорю неразумно[d] — осмеливаюсь и я.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорю как бы в бесчестии»; греческий оборот допускает также смысл: «говорю это к стыду».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как будто мы оказались слабыми». В контексте своей «неразумной» похвальбы Павел говорит иронически.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в чём бы кто ни осмеливался». Слово «хвалиться» подразумевается из контекста.'
    reason: implicit_object
  - marker: d
    text: 'Или: «говорю как неразумный»; буквально: «в неразумии говорю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: К стыду говорю
  rationale: Оборот труден и допускает отнесение бесчестья как к говорящему, так и к самой манере речи. «К стыду говорю» естественно передаёт риторическое признание унизительного впечатления, не устраняя неоднозначность полностью.
- source_word: ὡς ὅτι ἡμεῖς ἠσθενήκαμεν
  choice: будто мы оказались слабыми
  rationale: «Будто» передаёт сравнительно-ироническую оговорку ὡς ὅτι, а «оказались слабыми» выражает результативный оттенок перфекта и слабость в смысле недостатка силы или смелости, не сводя её к болезни.
- source_word: ἐν ᾧ δ’ ἄν τις τολμᾷ
  choice: Но в чём бы кто ни осмеливался хвалиться
  rationale: «В чём бы… ни» передаёт сферу смелости. Дополнение «хвалиться» не выражено отдельным словом, но ясно подразумевается контекстом похвальбы; это отмечено сноской.
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: говорю по неразумию
  rationale: Формулировка сохраняет существительное ἀφροσύνη и характер вставной авторской оговорки, не превращая её в буквальное самоопределение Павла как неразумного человека.
- source_word: τολμῶ κἀγώ
  choice: осмеливаюсь и я
  rationale: Сохранён повтор глагола τολμάω и подразумеваемый объект похвальбы, уже названный в предыдущей части фразы.
theological_decisions:
- issue: Ирония в словах о слабости Павла и его сотрудников
  choice: 'Передать фразу как ироническую уступку: «будто мы оказались слабыми»'
  alternative: 'Передать как прямое признание: «поскольку мы были слабы»'
  rationale: Контекст «неразумной» похвальбы показывает, что Павел принимает навязанную оценку лишь риторически. «Будто» сохраняет иронию, не отрицая важной для послания темы апостольской слабости.
- issue: Похвальба как подразумеваемый объект τολμᾷ
  choice: Явно добавить «хвалиться» в первой части и оставить объект подразумеваемым во второй
  alternative: В обоих случаях перевести только «осмеливается / осмеливаюсь»
  rationale: Контекст стихов 18 и 21–23 делает похвальбу очевидной. Уточнение обеспечивает понятность, а сноска сохраняет прозрачность по отношению к форме оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской полемики. Синтаксис сохраняет резкие вставные оговорки и повтор «осмеливался — осмеливаюсь», характерные для греческого текста; архаизмы и конфессионально окрашенные формулы исключены.
