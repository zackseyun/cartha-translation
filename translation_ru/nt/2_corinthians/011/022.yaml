  text: Ἑβραῖοί εἰσιν; κἀγώ. Ἰσραηλῖταί εἰσιν; κἀγώ. σπέρμα Ἀβραάμ εἰσιν; κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: ru
  text: Они евреи? И я тоже. Они израильтяне? И я тоже. Они семя Авраама[a]? И я тоже.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть потомки Авраама. В греческом употреблено собирательное существительное в единственном числе: «семя».'
    reason: Пояснить современному читателю значение буквального выражения, сохранив в тексте его форму и библейскую образность.
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: евреи
  rationale: Устоявшееся современное обозначение, сохраняющее этнокультурный оттенок и отличие от следующего слова «израильтяне».
- source_word: κἀγώ
  choice: и я тоже
  rationale: Естественно и кратко передаёт καί + ἐγώ, сохраняя настойчивый повтор и риторическую выразительность ответа Павла.
- source_word: Ἰσραηλῖταί
  choice: израильтяне
  rationale: Точно обозначает принадлежность к народу Израиля и не смешивает этот термин с «евреями» и «семенем Авраама».
- source_word: σπέρμα Ἀβραάμ
  choice: семя Авраама
  rationale: Сохраняет единственное число собирательного греческого выражения и его библейскую образность; значение поясняется в сноске современным словом «потомки».
- source_word: εἰσιν
  choice: они …?
  rationale: Связка естественно включена в краткие русские вопросительные именные предложения; настоящее время в русском не требует явного глагола «быть».
theological_decisions:
- issue: Различие трёх обозначений иудейской идентичности
  choice: 'Сохранить три отдельных выражения: «евреи», «израильтяне», «семя Авраама»'
  alternative: Свести все три выражения к общему обозначению «иудеи» или «потомки Авраама»
  rationale: Нагнетание трёх близких, но не тождественных характеристик составляет основу довода Павла; перевод не должен устранять различия между культурно-этнической, народно-заветной и родовой принадлежностью.
translation_notes:
  register: Краткие вопросы и одинаковые ответы воспроизводят резкий, настойчивый ритм оригинала. Лексика современная и понятная, при этом выражение «семя Авраама» сохраняет достоинство и межтекстовую библейскую связь.
