lexical_decisions:
- source_word: λογίζομαι
  choice: я считаю
  rationale: Передаёт обдуманную оценку Павла естественным современным русским языком.
- source_word: γὰρ
  choice: ведь
  rationale: Связывает стих с предшествующим рассуждением как пояснение или обоснование; по-русски здесь естественнее, чем формальное «ибо».
- source_word: μηδὲν ὑστερηκέναι
  choice: ни в чём не уступаю
  rationale: 'Сохраняет усиленное отрицание и сравнительный смысл: Павел утверждает, что ни в одном отношении не стоит ниже упомянутых апостолов.'
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: этим «сверхапостолам»
  rationale: Передаёт вероятную иронию контекста, не добавляя прямо отсутствующего в греческом определения «так называемым»; указательное «этим» естественно обозначает уже подразумеваемых соперников.
theological_decisions:
- issue: Относится ли τῶν ὑπερλίαν ἀποστόλων иронически к противникам Павла или прямо к особо почитаемым апостолам
  choice: «сверхапостолам» — вероятная ироническая характеристика соперников Павла
  alternative: «самым выдающимся апостолам» — прямое обозначение высоко почитаемых апостолов
  rationale: Ближайший полемический контекст поддерживает иронию, однако сама греческая фраза допускает прямое прочтение; поэтому неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Ведь» сохраняет ход аргумента без архаичного оттенка «ибо». Кавычки помогают услышать вероятную иронию, а сноска сохраняет подлинную неоднозначность выражения.
