  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ μὲν γὰρ ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε, καλῶς ⸀ἀνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: ru
  text: Ведь если кто-то приходит и проповедует другого Иисуса, которого мы не проповедовали, или вы получаете иной дух[a], которого не получали, или иное Евангелие[b], которого не принимали, — вы с этим отлично миритесь[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «другой дух». Греческое выражение подчёркивает отличие, но само по себе не уточняет, о каком именно духе идёт речь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «иную Благую Весть».'
    reason: lexical_alternative
  - marker: c
    text: 'Вероятно, это сказано с иронией: Павел упрекает коринфян в том, что они слишком охотно мирятся с подобной проповедью и её последствиями.'
    reason: literary_tone
lexical_decisions:
- source_word: ὁ ἐρχόμενος
  choice: кто-то приходит
  rationale: Субстантивированное причастие обозначает в данном контексте неопределённого человека; эта формулировка естественна для современного русского языка.
- source_word: ἄλλον Ἰησοῦν
  choice: другого Иисуса
  rationale: Сохраняется мысль о проповеди под тем же именем, но с иным представлением об Иисусе; «другого» прямо передаёт ἄλλον.
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: проповедует / не проповедовали
  rationale: «Проповедовать» естественно передаёт публичное провозглашение в новозаветном контексте и сохраняет повтор исходного глагола.
- source_word: πνεῦμα ἕτερον
  choice: иной дух
  rationale: «Иной» выражает контраст и качественное отличие, не уточняя природу духа сверх сказанного в греческом тексте.
- source_word: λαμβάνετε / ἐλάβετε
  choice: принимаете / прежде не приняли
  rationale: Глагол означает получение того, что даётся. «Прежде» делает понятным временной контраст настоящего времени с аористом, не меняя смысла.
- source_word: εὐαγγέλιον ἕτερον
  choice: иную Благую Весть
  rationale: «Благая Весть» понятно передаёт εὐαγγέλιον современному читателю, а «иную» сохраняет контраст ἕτερον.
- source_word: ἐδέξασθε
  choice: прежде не приняли
  rationale: В контексте глагол означает принять или одобрительно воспринять. Повтор русского «приняли» обеспечивает естественность, хотя лексическое различие с λαμβάνω становится менее заметным.
- source_word: καλῶς ἀνέχεσθε
  choice: это вы прекрасно терпите
  rationale: Формулировка близка к греческой идиоме и в контексте звучит как резкий иронический упрёк в чрезмерной терпимости.
- source_word: εἰ μὲν γὰρ
  choice: Ведь если
  rationale: «Ведь» передаёт пояснительную функцию γάρ, а «если» сохраняет условное построение.
theological_decisions:
- issue: К чему относится выражение «иной дух»
  choice: Оставлено обобщённое «иной дух» без уточнения его природы.
  alternative: Ложно представленный Святой Дух; злой дух; иной духовный настрой или опыт.
  rationale: Греческий текст не разрешает однозначно определить референт, поэтому перевод сохраняет богословскую неоднозначность.
- issue: Тон выражения καλῶς ἀνέχεσθε
  choice: 'Передано как иронический упрёк: «это вы прекрасно терпите».'
  alternative: 'Буквальная похвала или нейтральное замечание: «вы хорошо это переносите».'
  rationale: Контекст показывает, что Павел порицает готовность коринфян терпеть соперничающих проповедников, однако ирония передана самой формулировкой, а не разъясняющей вставкой.
- issue: Объект глагола ἀνέχεσθε
  choice: Нейтральное «это», охватывающее описанную проповедь и её принятие.
  alternative: «Его», то есть пришедшего проповедника.
  rationale: В греческом тексте объект не выражен; нейтральная формулировка не сужает возможную отсылку исключительно до человека.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского упрёка. Синтаксический параллелизм трёх условных частей сохранён; «прекрасно терпите» позволяет услышать иронию без внесения её непосредственно в повествовательное пояснение.
