    rationale: В оригинале аористы ἐλάβετε и ἐδέξασθε обозначают предшествующее получение/принятие относительно настоящего, но отдельного наречия «прежде» нет. Его добавление излишне усиливает временной оттенок.
  - severity: medium
    issue: 'Оба греческих глагола λαμβάνω и δέχομαι переданы одинаково: «приняли».'
    rationale: Полное лексическое разграничение не обязательно, но безопасно и естественно передать λαμβάνω как «получали», а δέχομαι как «принимали», чтобы сохранить контраст исходного текста.
  - severity: low
    issue: «Это вы прекрасно терпите» менее естественно, чем возможная русская идиоматическая передача иронии.
    rationale: «Вы с этим отлично миритесь» яснее передаёт ἀνέχεσθε и не ограничивает невыраженный объект только человеком либо только учением.
