lexical_decisions:
- source_word: κόπῳ
  choice: труде
  rationale: Слово обозначает тяжёлый, изнурительный труд; «труд» естественно передаёт основное значение и сохраняет парность с μόχθῳ.
- source_word: μόχθῳ
  choice: изнурении
  rationale: Передаёт тягостность и истощение, сопутствующие тяжёлому труду, не сливая два близких греческих существительных в одно.
- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: часто без сна
  rationale: Естественная современная формулировка для неоднократного бодрствования или бессонницы без уточнения их причины.
- source_word: ἐν λιμῷ καὶ δίψει
  choice: в голоде и жажде
  rationale: Сохраняет парную конструкцию и обозначает переносимые Павлом состояния лишения.
- source_word: ἐν νηστείαις πολλάκις
  choice: в частых постах
  rationale: «Постах» сохраняет собственное значение νηστεία и отличие от уже упомянутого голода; добровольный или вынужденный характер воздержания текст не уточняет.
- source_word: ἐν ψύχει
  choice: в холоде
  rationale: Прямо и естественно передаёт холод как переносимое состояние.
- source_word: γυμνότητι
  choice: наготе
  rationale: Сохраняет прямое значение греческого слова и его неоднозначность; в данном перечне оно может подразумевать отсутствие достаточной одежды и незащищённость от непогоды.
theological_decisions:
- issue: Значение νηστείαις в перечне страданий Павла
  choice: постах
  alternative: вынужденном отсутствии пищи
  rationale: Поскольку λιμός уже обозначает голод, «постах» сохраняет лексическое различие. При этом перевод не определяет, были ли эти посты добровольными или вызванными обстоятельствами.
- issue: Значение γυμνότητι
  choice: наготе
  alternative: недостатке одежды / незащищённости от непогоды
  rationale: Основной текст сохраняет прямой образ и возможную силу слова, а примечание поясняет вероятный контекстуальный смысл, не исключая буквального значения.
translation_notes:
  register: Современный литературный русский язык; краткая ритмичная цепь предложных оборотов сохраняет накопительный характер греческого перечня. Лексика понятна широкому читателю и не снимает смысловой неоднозначности слов νηστεία и γυμνότης.
