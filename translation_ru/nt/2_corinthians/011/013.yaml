  text: οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: ru
  text: Ведь такие люди — лжеапостолы, коварные работники, принимающие облик апостолов Мессии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «Христа». Греческое Χριστός означает «Помазанник» и может передаваться как титул «Мессия» или традиционно как «Христос».
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим рассуждением и естественно звучит в современном русском языке.
- source_word: οἱ τοιοῦτοι
  choice: такие люди
  rationale: Указывает на уже описанную категорию лиц; выражение ясно и идиоматично передаёт субстантивированное указательное местоимение во множественном числе.
- source_word: ψευδαπόστολοι
  choice: лжеапостолы
  rationale: Точно и кратко передаёт сложное слово о людях, ложно присваивающих себе апостольское служение.
- source_word: ἐργάται δόλιοι
  choice: коварные работники
  rationale: Сохраняет образ работников и нравственную характеристику δόλιοι — действующих посредством обмана и хитрости.
- source_word: μετασχηματιζόμενοι
  choice: принимающие облик
  rationale: Передаёт намеренное изменение внешнего вида или представления о себе, не подразумевая внутреннего преображения.
- source_word: εἰς ἀποστόλους Χριστοῦ
  choice: апостолов Мессии
  rationale: При μετασχηματιζόμενοι предлог εἰς обозначает принимаемый образ или роль; родительный Χριστοῦ указывает на принадлежность и представительство.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Сохраняет смысл Χριστός как титула Помазанника; традиционное «Христос» отмечено в сноске как допустимый вариант.
theological_decisions:
- issue: Передача титула Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В сочетании «апостолы Χριστοῦ» титул обозначает Того, кому принадлежат и кого представляют апостолы. «Мессия» явнее сохраняет титульный смысл, тогда как «Христос» является традиционной и естественной русской передачей; вариант приведён в сноске без изменения богословского содержания.
translation_notes:
  register: Современный литературный русский язык с ясным, строгим и обличительным тоном. Тире делает именную характеристику естественной; «принимающие облик» сохраняет образ внешней маскировки.
