  text: ἀνέχεσθε γὰρ εἴ τις ὑμᾶς καταδουλοῖ, εἴ τις κατεσθίει, εἴ τις λαμβάνει, εἴ τις ἐπαίρεται, εἴ τις ⸂εἰς πρόσωπον ὑμᾶς⸃ δέρει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: ru
  text: Ведь вы терпите, если кто-то порабощает вас, если кто-то пожирает вас, если кто-то обирает вас[a], если кто-то возвышает себя, если кто-то бьёт вас по лицу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «берёт»; возможно также: «пользуется вами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: вы терпите
  rationale: Настоящее время описывает то, что коринфяне фактически сносят. «Терпите» естественно в современном русском и сохраняет упрёк, не добавляя отсутствующего в греческом дополнения.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующей иронией Павла и естественно звучит в русском начале предложения.
- source_word: καταδουλοῖ
  choice: порабощает вас
  rationale: Сохраняет прямой и сильный образ обращения в рабство или полного подчинения, не смягчая его.
- source_word: κατεσθίει
  choice: пожирает вас
  rationale: Передаёт яркую метафору хищнической эксплуатации, а не нейтральное потребление.
- source_word: λαμβάνει
  choice: обирает вас
  rationale: Контекст указывает на корыстное, эксплуататорское взятие. «Обирает» естественно выражает это по-русски, не ограничивая смысл конкретно деньгами.
- source_word: ἐπαίρεται
  choice: превозносится
  rationale: Сохраняет значение самовозвышения и надменности; возвратная форма естественно передаёт греческий медиальный оттенок.
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: бьёт вас по лицу
  rationale: Естественно и конкретно передаёт удар в лицо, не сужая действие до пощёчины.
- source_word: εἴ τις
  choice: если кто-то
  rationale: Повтор сохранён ради анафорической силы перечня; форма естественна для современного русского.
theological_decisions:
- issue: Риторический тон высказывания Павла
  choice: Иронический упрёк передан самим перечнем злоупотреблений без прямого называния виновников лжеапостолами.
  alternative: Добавить в текст указание на лжеапостолов или ложных учителей.
  rationale: Контекст подтверждает иронию и полемическую направленность, однако сам стих не называет действующих лиц; перевод не вносит это пояснение в основной текст.
- issue: Широта значения λαμβάνει
  choice: Эксплуататорский смысл выражен словом «обирает», а общая семантика глагола отмечена в сноске.
  alternative: Буквальное «берёт» или более широкое «пользуется вами».
  rationale: Одно «берёт» по-русски требует дополнения и здесь звучит неполно; «пользуется вами» может обозначать более широкий вид эксплуатации. «Обирает» соответствует контексту имущественного злоупотребления, но сноска сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский, энергичный и достойный по тону. Повтор «если кто-то» сохранён ради риторического напора; ряд сильных глаголов передаёт нарастающий перечень унижений.
