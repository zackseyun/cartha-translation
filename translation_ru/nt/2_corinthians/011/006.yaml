base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: ru
  text: Но даже если я не искусен в речи[a], знанием я не обделён. Во всём и всячески мы ясно показали это вам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не обучен искусству речи», то есть не владею отточенным ораторским мастерством.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая фраза сжата; возможно также: «во всяком отношении и во всём мы ясно показали это вам». Оборот может пониматься несколько иначе, в том числе как указание на открытость перед всеми или на различные обстоятельства.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιώτης τῷ λόγῳ
  choice: не искусен в речи
  rationale: В данном противопоставлении выражение указывает на отсутствие ораторской выучки или риторического блеска, а не на общую необразованность. Формулировка сохраняет прямую связь с речью и звучит естественно по-русски.
- source_word: γνώσει
  choice: в знании
  rationale: Существительное обозначает знание и содержательную осведомлённость, противопоставленные речевому мастерству. Буквальное «знание» сохраняет эту антитезу.
- source_word: φανερώσαντες
  choice: мы ясно показали
  rationale: Причастие передаёт совершённое открытое проявление или доказательство. В русском языке личная форма естественнее и согласуется с подразумеваемым множественным субъектом Павла и его сотрудников.
- source_word: ἐν παντί
  choice: во всём
  rationale: Выражение указывает на полноту и всесторонность проявления; «во всём» сохраняет широкий смысл без ненужного уточнения.
- source_word: ἐν πᾶσιν
  choice: при всех
  rationale: Мужской/средний род во множественном числе без явно названного существительного допускает отнесение как к людям, так и к обстоятельствам или делам. В основном тексте выбрано естественное личное понимание, а предметное сохранено в примечании.
- source_word: εἰς ὑμᾶς
  choice: вам
  rationale: Предлог обозначает направленность проявления к коринфянам; русский дательный падеж кратко и естественно передаёт их как адресатов.
theological_decisions:
- issue: Характер признанной Павлом неопытности
  choice: Павел допускает, что не обладает отточенным ораторским мастерством, но отрицает недостаток знания.
  alternative: Павел признаёт себя вообще необразованным или говорит исключительно иронически, не допуская никакого недостатка.
  rationale: Непосредственное противопоставление речи и знанию ограничивает признание областью речевой подачи и не затрагивает истинность содержания или апостольское полномочие.
- issue: Референт ἐν πᾶσιν
  choice: «при всех» — открыто перед всеми людьми.
  alternative: «во всём / во всех отношениях / при всяких обстоятельствах».
  rationale: Греческая фраза сжата и допускает как личное, так и предметное понимание. Основной текст выбирает грамматически возможное и естественное чтение, не объявляя альтернативу невозможной.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской полемики. Синтаксис сохраняет резкое противопоставление «речь — знание», а заключительная фраза остаётся краткой. Необычная сжатость греческого заключения передана читаемо, при этом его подлинная неоднозначность отмечена в сноске.
