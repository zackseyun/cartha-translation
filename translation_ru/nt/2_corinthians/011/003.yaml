source:
  edition: SBLGNT
  text: φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ⸂ἐξηπάτησεν Εὕαν⸃ ἐν τῇ πανουργίᾳ αὐτοῦ, ⸀φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος ⸂καὶ τῆς ἁγνότητος⸃ τῆς εἰς τὸν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: ru
  text: 'Но я боюсь: как змей своей хитростью обманул Еву, так и ваш образ мыслей может быть испорчен, уведён от искренности и чистоты преданности Мессии.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уведён от простоты и чистоты по отношению к Мессии»; «простота» здесь может означать также искренность или цельность. В некоторых рукописях отсутствуют слова «и чистоты».'
    reason: Сохраняет лексическую альтернативу для ἁπλότης и отмечает текстовый вариант отсутствия καὶ τῆς ἁγνότητος.
lexical_decisions:
- source_word: φοβοῦμαι δὲ μή πως
  choice: Но я боюсь, как бы… не
  rationale: Естественная русская конструкция опасения сохраняет настоящее время φοβοῦμαι и неопределённость μή πως.
- source_word: ὁ ὄφις
  choice: змей
  rationale: Сохраняет узнаваемую отсылку к повествованию Бытия и соответствует литературно-библейскому употреблению.
- source_word: ἐξηπάτησεν Εὕαν
  choice: обманул Еву
  rationale: Прямо передаёт действие глагола ἐξαπατάω без неестественного усиления приставочного значения.
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: своей хитростью
  rationale: Творительный падеж естественно выражает средство; «хитрость» передаёт искусный обман в данном контексте.
- source_word: φθαρῇ τὰ νοήματα ὑμῶν
  choice: ваши мысли не уклонились
  rationale: Буквальное «мысли не были повреждены» по-русски тяжеловесно; «уклонились» естественно выражает пагубное отступление, подразумеваемое сочетанием φθείρω с ἀπό.
- source_word: τῆς ἁπλότητος καὶ τῆς ἁγνότητος
  choice: искренней и чистой преданности
  rationale: В контексте обручения Христу два качества описывают цельную, неразделённую преданность. Такое согласованное выражение естественно по-русски, а значимая буквальная альтернатива сохранена в сноске.
- source_word: τῆς εἰς τὸν Χριστόν
  choice: Мессии
  rationale: Дательный падеж при «преданности» естественно передаёт направленность εἰς; Χριστός здесь понимается как титул и переводится «Мессия».
theological_decisions:
- issue: Значение ἁπλότης и ἁγνότης по отношению к Мессии
  choice: искренняя и чистая преданность Мессии
  alternative: простота и чистота по отношению к Мессии
  rationale: Контекст 11:2–4 говорит о верности обручённой невесты и опасности обмана. Основной текст ясно передаёт эту связь, а сноска сохраняет формально более близкое и несколько двусмысленное прочтение.
- issue: Передача Χριστόν
  choice: Мессии
  alternative: Христу
  rationale: Χριστός сохраняет здесь титульное значение; перевод «Мессия» раскрывает его смысл, не добавляя конфессиональной специфики.
- issue: Текстовый вариант καὶ τῆς ἁγνότητος
  choice: включить «и чистой» в основной текст
  alternative: опустить эти слова
  rationale: SBLGNT включает выражение, поэтому оно переведено; отсутствие в части рукописей отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Конструкция «как бы… не уклонились» понятна широкому читателю; «змей» сохраняет аллюзию на Бытие. Сноска отмечена в основном тексте.
