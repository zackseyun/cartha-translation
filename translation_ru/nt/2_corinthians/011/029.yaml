  yaml_path: translation/nt/2_corinthians/011/029.yaml
  text: Who is weak[a], and I am not weak? Who is caused to stumble, and I do not burn with indignation?
translation:
  language: ru
  text: Кто слаб, а я не слаб? Кто спотыкается, а я не горю?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кого заставляют споткнуться, а я не воспламеняюсь?» Страдательная форма греческого глагола может подразумевать, что человека приводят к преткновению. Греческое «горю» — метафора сильного внутреннего переживания; она может выражать скорбь, ревность или негодование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: немощен / не немощен
  rationale: '«Немощен» сохраняет широту греческого глагола: речь может идти о физической, духовной или иной слабости. Повтор одного корня передаёт риторическую связь оригинала.'
- source_word: σκανδαλίζεται
  choice: спотыкается
  rationale: Возвратная форма естественно передаёт страдательно-средний оттенок и сохраняет образ преткновения, не сводя его однозначно к обиде, соблазну или падению в грех.
- source_word: πυροῦμαι
  choice: горю
  rationale: Буквальная метафора передаёт сильное внутреннее переживание Павла, не уточняя без достаточных оснований, идёт ли речь преимущественно о негодовании, скорби или ревности.
- source_word: τίς
  choice: Кто
  rationale: Естественное русское соответствие в двух параллельных риторических вопросах.
- source_word: καὶ οὐκ ἐγὼ
  choice: с тем и я не / а я не
  rationale: В первом вопросе добавленное «с тем» естественно раскрывает подразумеваемую солидарность Павла; во втором «а я не» сохраняет подчёркнутое ἐγώ и риторический параллелизм.
theological_decisions:
- issue: Характер переживания Павла, выраженного πυροῦμαι
  choice: Сохранить в основном тексте метафору «горю».
  alternative: «горю от негодования», «сгораю от скорби», «воспламеняюсь»
  rationale: Греческая метафора указывает на сильное внутреннее переживание, но сама по себе не определяет его точный эмоциональный характер. Неуточнённое «горю» сохраняет смысловую и пастырскую напряжённость текста.
- issue: Смысл σκανδαλίζεται
  choice: 'Сохранить образ: «спотыкается».'
  alternative: «впадает в грех», «соблазняется», «терпит духовное падение»
  rationale: Контекст допускает нравственное или духовное преткновение, однако перевод не должен преждевременно сужать многозначный образ.
translation_notes:
  register: Современный литературный русский с достоинством и риторической выразительностью. «Немощен» выбрано как понятное библейско-литературное слово, способное охватить разные виды слабости; синтаксис слегка адаптирован для естественного русского звучания.
