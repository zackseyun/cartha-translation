  verdict: revise
  source_fidelity: 'Первая часть в целом точно передаёт греческий текст: нужду Павла, отсутствие обременения кого-либо и помощь братьев из Македонии. Однако «старался не быть» ослабляет ἐτήρησα («сохранял/поддерживал себя [необременительным]»): речь не о попытке, а о последовательно соблюдавшемся положении. Вторая часть также должна яснее сохранить параллель между прошедшим и будущим.'
  naturalness: «Когда я был у вас и испытывал нужду» и «никому не был в тягость» естественны для современного литературного русского. Формула «во всём я не был вам в тягость и впредь не буду» кратка, ясна и передаёт повтор исходной мысли без тяжеловесного буквального оборота.
  terminology: «Братья» корректно сохраняет мужскую форму οἱ ἀδελφοί и в данном контексте подходит для конкретных христианских сотрудников. «Быть в тягость» удачно передаёт οικονομический оттенок καταναρκάω / ἀβαρής, не сводя его исключительно к деньгам.
