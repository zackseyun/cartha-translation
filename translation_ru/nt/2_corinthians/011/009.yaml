revisions:
- from: И когда я был у вас и терпел нужду, я никого не обременил, потому что братья, пришедшие из Македонии, восполнили то, чего мне недоставало. Я во всём старался не быть вам в тягость[a] и впредь не буду.
  to: И когда я был у вас и испытывал нужду, я никому не был в тягость, потому что братья, пришедшие из Македонии, восполнили то, чего мне недоставало. И во всём я не был вам в тягость[a] и впредь не буду.
  rationale: Заменено «старался не быть» на утверждение фактически сохранявшегося поведения, что точнее передаёт ἐτήρησα и поддерживает параллель с «впредь не буду» (τηρήσω). Начальная формулировка также приведена к устойчивому русскому выражению «испытывал нужду» и к согласованному повтору «быть в тягость».
  reviewer_model: gpt-5.6-terra
