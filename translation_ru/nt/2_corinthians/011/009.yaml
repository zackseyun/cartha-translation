source:
  edition: SBLGNT
  text: καὶ παρὼν πρὸς ὑμᾶς καὶ ὑστερηθεὶς οὐ κατενάρκησα οὐθενός· τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας· καὶ ἐν παντὶ ἀβαρῆ ⸂ἐμαυτὸν ὑμῖν⸃ ἐτήρησα καὶ τηρήσω.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: ru
  text: И когда я был у вас и испытывал нужду, я никому не был в тягость, потому что братья, пришедшие из Македонии, восполнили то, чего мне недоставало. И во всём я не был вам в тягость[a] и впредь не буду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть не быть для вас бременем, в данном контексте прежде всего материальным.
    reason: lexical_clarification
lexical_decisions:
- source_word: παρὼν πρὸς ὑμᾶς
  choice: когда я был у вас
  rationale: Причастный оборот имеет временное значение; этот вариант естественен по-русски и передаёт личное присутствие Павла.
- source_word: ὑστερηθεὶς
  choice: терпел нужду
  rationale: Пассивное причастие обозначает испытываемый недостаток, в данном контексте прежде всего материальный.
- source_word: οὐ κατενάρκησα οὐθενός
  choice: я никого не обременил
  rationale: Глагол καταναρκάω здесь означает стать для кого-либо обузой, особенно материальной; русская переходная конструкция точно и естественно передаёт смысл.
- source_word: τὸ ὑστέρημά μου
  choice: то, чего мне недоставало
  rationale: Передаёт конкретный недостаток без неестественной абстрактности выражения «мой недостаток».
- source_word: προσανεπλήρωσαν
  choice: восполнили
  rationale: Глагол означает восполнить недостающее, добавочно обеспечить необходимым.
- source_word: οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας
  choice: братья, пришедшие из Македонии
  rationale: Сохранена мужская форма исходного текста и естественно передан причастный оборот; в этом контексте, вероятно, имеются в виду конкретные сотрудники Павла.
- source_word: ἐν παντὶ
  choice: во всём
  rationale: Сохраняет широкий охват греческого выражения и не сужает его до одного частного обстоятельства.
- source_word: ἀβαρῆ ἐμαυτὸν ὑμῖν ἐτήρησα
  choice: я во всём старался не быть вам в тягость
  rationale: Сжатая греческая конструкция означает сохранять себя необременительным для адресатов; русское выражение ясно передаёт устойчивое поведение Павла.
- source_word: καὶ τηρήσω
  choice: и впредь не буду
  rationale: Будущее время продолжает мысль о сохранении того же положения; эллиптическая русская формулировка естественно отсылает к словам «быть вам в тягость».
theological_decisions:
- issue: Кого обозначает οἱ ἀδελφοί
  choice: братья
  alternative: братья и сёстры; верующие
  rationale: Греческая форма мужского рода множественного числа сохранена. Хотя у Павла слово может шире обозначать единоверцев, здесь оно, вероятно, относится к конкретным сотрудникам, прибывшим из Македонии.
- issue: Характер бремени в οὐ κατενάρκησα и ἀβαρῆ
  choice: обременил; быть в тягость
  alternative: не зависел ни от кого; ничего с вас не брал
  rationale: Контекст явно связан с материальным обеспечением, однако исходные выражения шире прямого указания на деньги. Перевод сохраняет этот оттенок и не сводит смысл исключительно к оплате.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Выражения «терпел нужду», «восполнили» и «быть в тягость» понятны современному читателю и сохраняют достоинство и риторический повтор исходного текста.
