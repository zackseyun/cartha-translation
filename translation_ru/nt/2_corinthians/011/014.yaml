  yaml_path: translation/nt/2_corinthians/011/014.yaml
  text: And no wonder[a], for Satan himself disguises himself as an angel of light.
translation:
  language: ru
  text: 'И неудивительно: ведь сам Сатана принимает облик ангела света.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «превращается в ангела света». Греческий глагол буквально может означать изменение облика или формы; в данном контексте, вероятно, имеется в виду обманчивая внешность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐ θαῦμα
  choice: И неудивительно
  rationale: Естественно передаёт идиоматическое значение «и это не удивительно» и сохраняет связь с предыдущим стихом.
- source_word: αὐτὸς γὰρ ὁ Σατανᾶς
  choice: ведь сам сатана
  rationale: «Ведь» выражает пояснительную функцию γάρ, а «сам» сохраняет усилительное значение αὐτός. Артикль при имени собственном отдельно не передаётся.
- source_word: μετασχηματίζεται εἰς
  choice: принимает облик
  rationale: Передаёт изменение внешнего вида или представления себя в определённом образе, не утверждая онтологического превращения; при этом сохраняет возможную широту греческого глагола.
- source_word: ἄγγελον φωτός
  choice: ангела света
  rationale: Сохраняет буквальный образ и естественную для русского языка конструкцию родительного падежа.
theological_decisions:
- issue: Характер изменения сатаны
  choice: «принимает облик» — изображает себя ангелом света или является в таком виде
  alternative: «превращается в ангела света» — более буквально подчёркивает изменение формы
  rationale: Контекст говорит об обманчивой видимости лжеапостолов. Основной перевод не делает лишнего метафизического вывода, а сноска сохраняет более буквальную возможность.
translation_notes:
  register: Современный литературный русский язык; краткая, выразительная синтаксическая конструкция. «Сатана» написано со строчной буквы в соответствии с обычной русской библейской издательской практикой.
