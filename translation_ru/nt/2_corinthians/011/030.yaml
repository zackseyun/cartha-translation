  text: Εἰ καυχᾶσθαι δεῖ, τὰ τῆς ἀσθενείας μου καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/030.yaml
  text: If I must boast[a], I will boast in the things of my weakness.
translation:
  language: ru
  text: Если необходимо хвалиться, я буду хвалиться тем, что относится к моей слабости.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более естественно: «буду хвалиться своими слабостями». Буквально греческий текст говорит: «буду хвалиться тем, что относится к моей слабости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: Если
  rationale: Сохраняет условную форму греческого текста и не превращает её без необходимости в причинное «поскольку».
- source_word: καυχᾶσθαι / καυχήσομαι
  choice: хвалиться / я буду хвалиться
  rationale: Передаёт повтор одного и того же греческого глагола и сохраняет риторический параллелизм; «хвалиться» естественно звучит в современном русском и допускает заложенную в контексте иронию.
- source_word: δεῖ
  choice: необходимо
  rationale: Передаёт безлично выраженную необходимость; формулировка звучит естественно и сохраняет оттенок вынужденности.
- source_word: τὰ τῆς ἀσθενείας μου
  choice: тем, что относится к моей слабости
  rationale: Передаёт субстантивированное среднее множественное τὰ и зависимый родительный оборот, не сводя необычную греческую конструкцию просто к «моим слабостям».
- source_word: ἀσθενείας
  choice: слабости
  rationale: «Слабость» — ясный и последовательный эквивалент, охватывающий не только физическую немощь, но и унизительные обстоятельства, раскрывающие уязвимость Павла.
theological_decisions:
- issue: Характер похвальбы Павла
  choice: Сохранить парадоксальную похвальбу тем, что относится к слабости, не добавляя богословского объяснения.
  alternative: 'Передать более идиоматично: «буду хвалиться своими слабостями».'
  rationale: Более близкая к форме оригинала конструкция сохраняет напряжение между обычной похвальбой и похвальбой слабостью, не разрешая заложенную Павлом иронию посредством толкования.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной и слегка формальной синтаксической структурой. Необычность заключительного оборота сохранена намеренно, но разъяснена в сноске.
