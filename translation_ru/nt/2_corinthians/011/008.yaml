base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/008.yaml
  text: I robbed other churches by accepting support for serving you,[a]
translation:
  language: ru
  text: Я обирал другие церкви, получая от них содержание, чтобы служить вам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «плату» или «жалованье».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλας ἐκκλησίας
  choice: другие церкви
  rationale: В посланиях Павла ἐκκλησία обычно обозначает местные христианские общины; «церкви» — естественный и точный русский эквивалент.
- source_word: ἐσύλησα
  choice: обирал
  rationale: Глагол συλάω имеет сильное значение «грабить, обирать, лишать имущества». «Обирал» сохраняет намеренно резкую и ироническую метафору, но в данном контексте естественнее по-русски, чем буквальное «грабил».
- source_word: λαβὼν
  choice: получая
  rationale: 'Причастие поясняет, каким образом Павел «обирал» другие церкви: он получал от них материальную помощь. Деепричастие сохраняет эту связь.'
- source_word: ὀψώνιον
  choice: содержание
  rationale: ὀψώνιον буквально означает плату или жалованье, первоначально также воинское довольствие. В контексте материального обеспечения служителя «содержание» передаёт смысл без излишнего оттенка трудового найма; буквальные варианты отмечены в сноске.
- source_word: πρὸς τὴν ὑμῶν διακονίαν
  choice: чтобы служить вам
  rationale: Оборот указывает на цель получаемого содержания — служение Павла коринфянам. Такая формулировка естественна по-русски и ясно передаёт подразумеваемого деятеля.
theological_decisions:
- issue: Риторический смысл утверждения Павла о помощи от других церквей
  choice: Сохранить резкую метафору «обирал» как иронию или гиперболу, а не как буквальное признание в краже.
  alternative: Смягчить до «брал содержание у других церквей» или «пользовался поддержкой других церквей».
  rationale: Греческий глагол намеренно силён. Контекст показывает, что речь идёт о материальной поддержке служения, однако смягчение устранило бы риторическое напряжение слов Павла.
translation_notes:
  register: Современный литературный русский язык с сохранением резкой павловской иронии. «Содержание» понятно как материальная поддержка и не навязывает представление о формальном найме.
