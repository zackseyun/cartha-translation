  text: ζηλῶ γὰρ ὑμᾶς θεοῦ ζήλῳ, ἡρμοσάμην γὰρ ὑμᾶς ἑνὶ ἀνδρὶ παρθένον ἁγνὴν παραστῆσαι τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/002.yaml
  text: For I am jealous for you with God's jealousy[a], because I betrothed you to one husband[b], to present you as a pure virgin to Messiah.
translation:
  language: ru
  text: Ведь я ревную о вас Божьей ревностью[a], потому что обручил вас с одним мужем, чтобы представить вас Мессии[b] чистой девой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «божественной ревностью» или «ревностью, подобной Божьей». Греческое выражение может означать ревность, принадлежащую Богу, или ревность, имеющую божественный характер.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Христу». Греческий титул Χριστός означает «Помазанник», то есть «Мессия».'
    reason: alternative_rendering
lexical_decisions:
- source_word: ζηλῶ
  choice: ревную о вас
  rationale: Глагол может обозначать и ревность, и ревностную заботу. В образе обручения «ревную о вас» сохраняет оттенок оберегающей, заветной ревности, не сводя его к зависти.
- source_word: θεοῦ ζήλῳ
  choice: Божьей ревностью
  rationale: Передаёт генитив прямо и сохраняет возможность понимать ревность как принадлежащую Богу либо как соответствующую Богу.
- source_word: ἡρμοσάμην
  choice: обручил
  rationale: Брачный контекст требует значения обещания в брак; «обручил» кратко и естественно сохраняет этот образ.
- source_word: ἑνὶ ἀνδρὶ
  choice: с одним мужем
  rationale: ἀνήρ может означать мужчину или мужа; образ невесты указывает здесь на мужа, а «одним» подчёркивает исключительность союза.
- source_word: παρθένον ἁγνήν
  choice: чистой девой
  rationale: Сохраняет одновременно брачный образ девы и нравственную чистоту; порядок слов естественен для русского литературного языка.
- source_word: παραστῆσαι
  choice: представить
  rationale: Точно передаёт действие приведения и представления невесты жениху, не уточняя сверх текста церемониальный или эсхатологический характер.
- source_word: τῷ Χριστῷ
  choice: Мессии
  rationale: Артикль и роль определённого жениха поддерживают титульное значение Χριστός; «Мессии» передаёт именно титул Помазанника.
theological_decisions:
- issue: Характер ревности Павла
  choice: Божья, заветная ревность, которой Павел ревнует о коринфянах
  alternative: Благочестивая ревностная забота Павла без прямого указания на принадлежность ревности Богу
  rationale: θεοῦ ζήλῳ допускает как притяжательное, так и качественное понимание. Основной текст буквально сохраняет первое, а сноска — второе, не устраняя смысловое напряжение.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном брачном образе слово выступает как титул обозначенного жениха; вариант «Христос» остаётся в сноске как традиционная русская передача.
- issue: Единственность жениха
  choice: один муж
  alternative: один мужчина
  rationale: Брачный контекст делает значение «муж» наиболее вероятным, при этом акцент на одном муже сохраняет тему исключительной верности.
translation_notes:
  register: Современный литературный русский с сохранением возвышенного брачного образа. Оборот «ревную о вас» несколько книжный, но понятный и точнее нейтральной «забочусь», поскольку сохраняет намеренную связь с Божьей ревностью. Союз «ведь» естественно передаёт объяснительное γάρ; повторное γάρ передано причинным «потому что».
