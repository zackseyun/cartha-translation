lexical_decisions:
- source_word: ὃ λαλῶ
  choice: То, что я говорю
  rationale: Естественно передаёт содержание нынешней речи Павла и сохраняет значение настоящего времени.
- source_word: κατὰ κύριον
  choice: по Господу
  rationale: 'Краткая формулировка сохраняет неоднозначность греческого оборота: речь может идти о соответствии образу, норме или авторитету Господа.'
- source_word: κύριον
  choice: Господу
  rationale: В контексте титул относится прежде всего к Господу Иисусу; уточнение имени в основном тексте не требуется.
- source_word: ἀλλ’ ὡς ἐν ἀφροσύνῃ
  choice: а словно в неразумии
  rationale: Передаёт сравнительно-модальный характер ὡς и не превращает слова Павла в прямое самоопределение «как глупец».
- source_word: ἐν ταύτῃ τῇ ὑποστάσει
  choice: с этой уверенностью
  rationale: ὑπόστασις здесь может обозначать уверенную позицию или основание для речи; «уверенность» естественно сочетается с последующей похвальбой, хотя неоднозначность отмечена в сноске.
- source_word: τῆς καυχήσεως
  choice: в похвальбе
  rationale: Передаёт словесный характер καύχησις и образует понятное современное сочетание с «уверенностью».
theological_decisions:
- issue: Смысл выражения κατὰ κύριον
  choice: Павел говорит, что его нынешняя манера похвальбы не соответствует Господу — Его образу или норме.
  alternative: Павел может иметь в виду, что не передаёт здесь непосредственного слова или повеления Господа.
  rationale: Греческий оборот допускает оба оттенка. Основной текст сохраняет напряжение и не превращает фразу ни в отрицание истинности слов Павла, ни в однозначное заявление об отсутствии откровения.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской речи. Синтаксис удерживает риторическое противопоставление оригинала; «неразумие» выбрано вместо более разговорного и резкого «глупость».
