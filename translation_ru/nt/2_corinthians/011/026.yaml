  text: ὁδοιπορίαις πολλάκις, κινδύνοις ποταμῶν, κινδύνοις λῃστῶν, κινδύνοις ἐκ γένους, κινδύνοις ἐξ ἐθνῶν, κινδύνοις ἐν πόλει, κινδύνοις ἐν ἐρημίᾳ, κινδύνοις ἐν θαλάσσῃ, κινδύνοις ἐν ψευδαδέλφοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/026.yaml
  text: often on journeys[a], in dangers from rivers, in dangers from robbers, in dangers from my own people, in dangers from Gentiles, in dangers in the city, in dangers in the wilderness, in dangers at sea, in dangers among false brothers[b],
translation:
  language: ru
  text: часто в путешествиях; в опасностях от рек, в опасностях от разбойников, в опасностях от соплеменников[a], в опасностях от язычников, в опасностях в городе, в опасностях в пустынных местах, в опасностях на море, в опасностях среди лжебратьев[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от моего народа», «от моих сородичей»; буквально — «от рода».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «среди мнимых верующих»; буквально — «среди лжебратьев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοιπορίαις πολλάκις
  choice: часто в путешествиях
  rationale: Естественно передаёт дательный множественного числа с наречием πολλάκις и сохраняет смысл неоднократных странствий.
- source_word: κινδύνοις
  choice: в опасностях
  rationale: Повтор сохраняет накопительный ритм греческого перечня и звучит понятно в современном русском.
- source_word: ποταμῶν
  choice: от рек
  rationale: Родительный обозначает источник или вид опасности; перевод не уточняет, шла ли речь о разливах, переправах или иной угрозе.
- source_word: λῃστῶν
  choice: от разбойников
  rationale: «Разбойники» естественно передаёт λῃσταί в контексте опасных путешествий и точнее «воров» указывает на насильственное нападение.
- source_word: ἐκ γένους
  choice: от соплеменников
  rationale: Передаёт принадлежность к собственному народу или этнической общности Павла, не вставляя отсутствующее в греческом слово «иудеи».
- source_word: ἐξ ἐθνῶν
  choice: от язычников
  rationale: В противопоставлении собственному народу τὰ ἔθνη обозначает неиудеев; «язычники» — традиционный и понятный русский эквивалент.
- source_word: ἐν πόλει
  choice: в городе
  rationale: Сохраняет единственное число и обобщённый характер греческого выражения.
- source_word: ἐν ἐρημίᾳ
  choice: в пустынных местах
  rationale: Передаёт широкий смысл ἐρημία — безлюдная, пустынная местность — без неоправданного ограничения песчаной пустыней.
- source_word: ἐν θαλάσσῃ
  choice: на море
  rationale: Соответствует естественному русскому обозначению опасностей во время морского плавания.
- source_word: ἐν ψευδαδέλφοις
  choice: среди лжебратьев
  rationale: Сохраняет буквальный образ сложного существительного ψευδάδελφοι и его грамматически мужскую форму.
theological_decisions:
- issue: Передача ψευδαδέλφοις
  choice: среди лжебратьев
  alternative: среди мнимых верующих
  rationale: Буквальная форма сохраняет указание на людей, выдававших себя за братьев по вере, не решая за текст вопрос об их подлинной принадлежности к общине.
- issue: Передача контраста ἐκ γένους и ἐξ ἐθνῶν
  choice: от соплеменников ... от язычников
  alternative: от моего народа ... от неиудеев
  rationale: Так сохраняется этнический контраст между собственной общностью Павла и другими народами без прямой вставки слова «иудеи» в первую часть.
translation_notes:
  register: Современный литературный русский с намеренным повтором «в опасностях», воспроизводящим риторическое нарастание исходного текста. Формулировки сдержанные и пригодны для публичного чтения; пунктуация отражает то, что стих является частью продолжающегося перечня.
