lexical_decisions:
- source_word: ἐν Δαμασκῷ
  choice: В Дамаске
  rationale: Предлог ἐν с дательным падежом обозначает местонахождение; это естественная современная русская передача.
- source_word: ἐθνάρχης
  choice: этнарх
  rationale: Сохранён особый исторический титул правителя народа или области; более общие варианты «правитель» и «наместник» сгладили бы значение термина.
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: царя Ареты
  rationale: Родительная конструкция связывает этнарха с царём Аретой, вероятнее всего как состоявшего у него на службе; буквальная связь сохранена без добавления толкования.
- source_word: ἐφρούρει
  choice: стерёг
  rationale: Имперфект указывает на продолжавшееся в прошлом действие, а глагол передаёт охрану или надзор; в контексте «стерёг город» звучит естественно и сохраняет оттенок бдительного контроля.
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: город дамаскинцев
  rationale: 'Передан греческий родительный падеж множественного числа: буквально «город дамаскинцев». Необычная формулировка источника сохранена, а привычный географический вариант дан в сноске.'
- source_word: πιάσαι με
  choice: чтобы схватить меня
  rationale: Инфинитив выражает цель; «схватить» сохраняет широкий смысл насильственного задержания, не уточняя юридический характер действия, как это сделал бы вариант «арестовать».
