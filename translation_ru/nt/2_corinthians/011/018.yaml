lexical_decisions:
- source_word: ἐπεὶ
  choice: Поскольку
  rationale: Передаёт причинное основание последующего иронического решения Павла и естественно звучит в современном литературном русском.
- source_word: πολλοὶ
  choice: многие
  rationale: Прямо и естественно передаёт количественное значение прилагательного.
- source_word: καυχῶνται
  choice: хвалятся
  rationale: Сохраняет полемический оттенок καυχάομαι и позволяет повторить тот же корень при переводе καυχήσομαι.
- source_word: κατὰ σάρκα
  choice: по плоти
  rationale: Сохраняет образ и богословскую многозначность σάρξ, не сводя выражение в основном тексте к одному толкованию; более ясные смысловые варианты даны в сноске.
- source_word: κἀγὼ
  choice: то и я
  rationale: Передаёт сочетание καί + ἐγώ, подчёркивая, что Павел риторически следует примеру своих оппонентов; «то» естественно связывает части русского предложения.
- source_word: καυχήσομαι
  choice: буду хвалиться
  rationale: Передаёт будущее время и сохраняет лексический повтор с καυχῶνται.
theological_decisions:
- issue: Передача σάρξ в выражении κατὰ σάρκα
  choice: по плоти
  alternative: по человеческим меркам; как принято у людей
  rationale: 'Буквальная формулировка удерживает характерную для Павла богословскую напряжённость: речь может идти о чисто человеческих основаниях и способе похвальбы, однако основной текст не должен молча закреплять лишь одно истолкование.'
translation_notes:
  register: Современный литературный русский с умеренно формальным, достойным звучанием. Повтор «хвалятся — буду хвалиться» намеренно сохраняет риторическую структуру греческого текста; ирония Павла не разъясняется внутри стиха.
