translation:
  language: ru
  text: Ведь вы охотно терпите глупцов[a], сами будучи мудрыми[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «миритесь с глупцами».'
    reason: lexical_alternative
  - marker: b
    text: 'Павел говорит иронически: коринфяне считают себя мудрыми, но охотно терпят тех, кого он называет глупцами.'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἡδέως
  choice: охотно
  rationale: Передаёт добровольную, даже готовую терпимость и естественно поддерживает иронический тон Павла.
- source_word: γὰρ
  choice: ведь
  rationale: Связывает стих с предыдущим рассуждением как пояснение или обоснование; в русском контексте «ведь» звучит естественнее буквального «ибо».
- source_word: ἀνέχεσθε
  choice: терпите
  rationale: Точно передаёт значение «выносить, мириться с кем-либо» и сохраняет резкость высказывания без разговорного снижения.
- source_word: τῶν ἀφρόνων
  choice: глупцов
  rationale: Прямое обозначение неразумных людей, сохраняющее риторический контраст с «мудрыми».
- source_word: φρόνιμοι
  choice: мудрыми
  rationale: Сохраняет очевидный лексический и иронический контраст с «глупцами».
- source_word: ὄντες
  choice: будучи
  rationale: Сохраняет причастную конструкцию и не устраняет намеренно неоднозначный оттенок между причиной и сопутствующим обстоятельством.
theological_decisions:
- issue: Ирония Павла по отношению к коринфянам
  choice: Сохранить прямую форму утверждения, позволяя иронии возникнуть из противопоставления «глупцов» и «мудрыми».
  alternative: 'Сделать иронию явной: «сами-то вы такие мудрые» или «раз вы такие мудрые».'
  rationale: В греческом тексте ирония выражена контрастом, а не дополнительными словами; явное усиление сузило бы риторическую неоднозначность.
- issue: Смысловая связь причастия ὄντες
  choice: 'Передать нейтрально: «сами будучи мудрыми».'
  alternative: Причинное «ведь вы мудры» или уступительное «хотя сами мудры».
  rationale: Греческое причастие само по себе не требует однозначно причинного или уступительного прочтения; нейтральная конструкция сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык; тон достойный и ясный. «Терпите» сохраняет остроту контекста, а синтаксис не делает иронию чрезмерно явной.
