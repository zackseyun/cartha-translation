  text: Ἢ ἁμαρτίαν ἐποίησα ἐμαυτὸν ταπεινῶν ἵνα ὑμεῖς ὑψωθῆτε, ὅτι δωρεὰν τὸ τοῦ θεοῦ εὐαγγέλιον εὐηγγελισάμην ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: ru
  text: Или я совершил грех, унижая себя, чтобы вы были возвышены, потому что безвозмездно[a] возвещал вам Божью благую весть?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «даром»; то есть не получая платы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Или
  rationale: Вводит связанный с предыдущим рассуждением резкий риторический вопрос.
- source_word: ἁμαρτίαν ἐποίησα
  choice: я совершил грех
  rationale: Естественно передаёт греческое выражение буквально означающее «сделал грех», сохраняя нравственную категорию и риторическую силу.
- source_word: ἐμαυτὸν ταπεινῶν
  choice: унижая себя
  rationale: Сохраняет возвратный смысл и намеренный контраст с последующим возвышением адресатов; деепричастный оборот передаёт обстоятельственную функцию причастия.
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: чтобы вы были возвышены
  rationale: Передаёт целевое придаточное и контраст статуса между самоуничижением Павла и возвышением коринфян.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно вводит основание предполагаемого «греха».
- source_word: δωρεὰν
  choice: безвозмездно
  rationale: Точно и в достойном современном регистре передаёт отсутствие платы.
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: Божью благую весть
  rationale: Передаёт родительную связь с Богом и исходное значение εὐαγγέλιον понятным современному читателю выражением.
- source_word: εὐηγγελισάμην ὑμῖν
  choice: возвещал вам
  rationale: Передаёт публичное провозглашение без сужения смысла до церковной проповеди.
theological_decisions:
- issue: Риторический вопрос Павла о материальной поддержке и самоуничижении
  choice: Сохранить прямой и иронически напряжённый вопрос, не добавляя оценки допустимости оплаты служителей.
  alternative: Развернуть смысл так, будто Павел прямо утверждает своё апостольское право на содержание, либо смягчить вопрос до извинения.
  rationale: Сам греческий текст спрашивает, было ли грехом самоуничижение Павла, выразившееся в безвозмездном возвещении; более широкого доктринального вывода стих прямо не формулирует.
translation_notes:
  register: Современный литературный русский язык, с сохранением достоинства и остроты риторического вопроса. «Благая весть» выбрана как понятная передача εὐαγγέλιον; «безвозмездно» уточнено в сноске более простым вариантом.
