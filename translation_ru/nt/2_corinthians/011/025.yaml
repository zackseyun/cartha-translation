  text: τρὶς ἐραβδίσθην, ἅπαξ ἐλιθάσθην, τρὶς ἐναυάγησα, νυχθήμερον ἐν τῷ βυθῷ πεποίηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: ru
  text: Трижды меня били палками, однажды меня забросали камнями, трижды я потерпел кораблекрушение; ночь и день я провёл в открытом море.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в глубине»; возможно: «в морской пучине».'
    reason: Слово βυθός может обозначать глубину или морскую пучину; основной текст передаёт вероятный контекстуальный смысл, а сноска сохраняет образность и неоднозначность оригинала.
lexical_decisions:
- source_word: τρὶς
  choice: трижды
  rationale: Точный и естественный русский эквивалент наречия, последовательно переданный в обоих случаях.
- source_word: ἐραβδίσθην
  choice: меня били палками
  rationale: Пассивная форма ῥαβδίζω обозначает избиение палками; перевод сохраняет конкретное орудие наказания и звучит естественно по-русски.
- source_word: ἅπαξ
  choice: однажды
  rationale: Естественно выражает однократность события в последовательном перечне.
- source_word: ἐλιθάσθην
  choice: побивали камнями
  rationale: Устойчивое библейское выражение для λιθάζω, обозначающее насильственное забрасывание камнями; не утверждает, что казнь завершилась смертью.
- source_word: ἐναυάγησα
  choice: я терпел кораблекрушение
  rationale: Точно и идиоматично передаёт пережитое кораблекрушение; форма «терпел» хорошо сочетается с указанием повторности.
- source_word: νυχθήμερον
  choice: ночь и день
  rationale: Сохраняет порядок компонентов греческого сложного слова и не вводит чрезмерно точного современного выражения «двадцать четыре часа».
- source_word: ἐν τῷ βυθῷ
  choice: в открытом море
  rationale: В данном контексте βυθός естественно понимается как глубокое, открытое море, где Павел провёл ночь и день после бедствия; буквальная альтернатива сохранена в сноске.
- source_word: πεποίηκα
  choice: я провёл
  rationale: ποιέω с обозначением времени идиоматически значит «проводить» время; русское прошедшее время естественно передаёт ретроспективный смысл греческого перфекта.
