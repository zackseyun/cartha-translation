    rationale: В сочетании с «однажды» эта форма менее естественно обозначает единичный завершённый эпизод, чем «однажды меня забросали камнями».
  - severity: low
    issue: «Трижды я терпел кораблекрушение» стилистически менее точно, чем «трижды я потерпел кораблекрушение».
    rationale: Греческий аорист ἐναυάγησα говорит о трёх происшедших кораблекрушениях; совершенный вид естественно передаёт эту событийность.
