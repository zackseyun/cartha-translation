  text: Πάλιν λέγω, μή τίς με δόξῃ ἄφρονα εἶναι— εἰ δὲ μή γε, κἂν ὡς ἄφρονα δέξασθέ με, ἵνα κἀγὼ μικρόν τι καυχήσωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: ru
  text: 'Ещё раз говорю: пусть никто не считает меня неразумным[a]. Но если нет, то хотя бы примите меня как неразумного, чтобы и я немного похвалился.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть никто не считает меня глупцом… примите меня хотя бы как глупца». Греческое ἄφρων можно понимать и как прилагательное («неразумный»), и как существительное («глупец»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: Ещё раз говорю
  rationale: Естественно и кратко передаёт повторный призыв Павла и настоящее время λέγω.
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: пусть никто не считает меня неразумным
  rationale: Конструкция с μή и сослагательным наклонением передана как отрицательное побуждение; «считает меня неразумным» естественно выражает δοκέω с инфинитивом.
- source_word: εἰ δὲ μή γε
  choice: А если всё же считает
  rationale: 'Эллиптическая фраза раскрыта по ближайшему контексту: если прежняя просьба не исполняется, то есть Павла всё-таки считают неразумным. Частица γε отражена словами «всё же».'
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: то примите меня хотя бы как неразумного
  rationale: «Хотя бы» передаёт уступительно-минимальный оттенок κἂν, а «примите» сохраняет прямоту императива δέξασθέ.
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: чтобы и мне немного похвалиться
  rationale: Сохраняются целевой оттенок ἵνα, акцент κἀγώ («и мне») и намеренно резкая лексика хвастовства в иронической самозащите Павла.
theological_decisions:
- issue: Ироническое самоописание Павла посредством ἄφρων и его «похвальба»
  choice: Сохранить слова «неразумный» и «похвалиться», не смягчая риторического напряжения
  alternative: Передать как «глупец» и «хвастаться» либо перефразировать как «говорящий опрометчиво»
  rationale: Павел условно принимает приписываемый ему образ неразумного, чтобы перейти к вынужденной похвальбе. Перевод сохраняет эту иронию, не превращая её ни в буквальное признание глупости, ни в нейтральную речь о самозащите.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской речи. Эллипсис εἰ δὲ μή γε слегка раскрыт ради ясности по-русски; повтор ἄφρονα передан последовательно. Маркер сноски поставлен после всего стиха.
