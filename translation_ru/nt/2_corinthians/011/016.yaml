  source_fidelity: Первая часть и цель похвальбы переданы точно. Однако «А если всё же считает» излишне эксплицирует эллипсис εἰ δὲ μή γε и вводит единственное число, которого в греческом тексте нет. «Но если нет» сохраняет исходную краткую условную уступку и не сужает её толкование.
  naturalness: «Ещё раз говорю» и «неразумный» соответствуют современному литературному, несколько возвышенному регистру. «Чтобы и я немного похвалился» естественнее и точнее выражает κἀγώ, чем «чтобы и мне немного похвалиться».
  terminology: Неразумный / похвалиться последовательно сохраняют ироничное самохарактеризование и лексику καυχάομαι без доктринального истолкования. Сноска уместно отмечает возможное субстантивное понимание ἄφρων.
