  text: ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ⸀Ἰησοῦ οἶδεν, ὁ ὢν εὐλογητὸς εἰς τοὺς αἰῶνας, ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/031.yaml
  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: ru
  text: Бог и Отец Господа Иисуса, благословенный вовеки[a], знает, что я не лгу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «в века».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Бог и Отец
  rationale: Один артикль относится к обоим существительным; устойчивое сочетание передано без сведения двух наименований к одному.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Господа Иисуса
  rationale: Титул κύριος передан как «Господь»; отсутствующее в греческом тексте местоимение «наш» не добавлено.
- source_word: οἶδεν
  choice: знает
  rationale: Сохранено прямое значение глагола; подразумеваемая торжественная ссылка на Божье свидетельство не превращена в поясняющий пересказ.
- source_word: ὁ ὢν εὐλογητὸς
  choice: благословенный
  rationale: Причастно-именная характеристика Бога естественно передана русским обособленным определением, сохраняющим славословный оттенок.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: «Вовеки» — естественное и торжественное русское соответствие устойчивой формуле вечной хвалы; буквальная форма отмечена в сноске.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание того, что знает Бог, а не причину.
- source_word: οὐ ψεύδομαι
  choice: я не лгу
  rationale: Настоящее время и личное утверждение переданы кратко и естественно, в соответствии с контекстом торжественного заверения.
theological_decisions:
- issue: Отношение выражения «Бог и Отец» к «Господу Иисусу»
  choice: Сохранить прямую формулировку «Бог и Отец Господа Иисуса».
  alternative: Смягчить или перефразировать различение Бога Отца и Господа Иисуса.
  rationale: Перевод сохраняет выраженное в тексте различение лиц и не устраняет богословское напряжение посредством поясняющей парафразы.
- issue: Связь славословного определения
  choice: Обособить «благословенный вовеки» как характеристику Бога и Отца.
  alternative: Понять оборот как ограничительное определение либо перестроить его в отдельное предложение.
  rationale: Греческий оборот ὁ ὢν εὐλογητὸς естественно относится к Богу и имеет характер благоговейного славословного отступления; обособление сохраняет эту функцию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Форма «вовеки» уместна в славословии и понятна современному читателю; синтаксис остается ясным и не перегруженным.
