  yaml_path: translation/nt/2_corinthians/011/011.yaml
  text: Why? Because I do not love you? God knows I do.
translation:
  language: ru
  text: Почему? Потому ли, что я не люблю вас? Бог знает[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте буквально: «Бог знает». Подразумеваемый ответ на риторический вопрос прямо не высказан.'
    reason: Сохранение эллиптичности оригинала и пояснение возможного смысла.
lexical_decisions:
- source_word: διὰ τί
  choice: Почему?
  rationale: Кратко и естественно передаёт вопрос о причине и его риторическую силу.
- source_word: ὅτι
  choice: Потому ли, что
  rationale: В данном контексте вводит предполагаемую причину в форме риторического вопроса; частица «ли» делает эту функцию ясной по-русски.
- source_word: οὐκ ἀγαπῶ ὑμᾶς
  choice: я не люблю вас
  rationale: Прямо сохраняет отрицание, глагол «любить» и объект второго лица множественного числа.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Обычный и точный русский эквивалент θεός в данном контексте.
- source_word: οἶδεν
  choice: знает
  rationale: Сохраняет лаконичную форму греческого текста, не добавляя подразумеваемое «что я люблю вас» в основной текст.
theological_decisions:
- issue: Следует ли раскрывать подразумеваемый положительный ответ в заключительной фразе
  choice: Бог знает.
  alternative: Бог знает, что я люблю вас.
  rationale: В греческом тексте объект знания не выражен. Контекст подразумевает положительный ответ, однако его раскрытие в основном тексте устранило бы подлинную эллиптичность оригинала.
translation_notes:
  register: Современный литературный русский язык; краткий, напряжённый риторический строй оригинала сохранён. «Потому ли, что» звучит естественно и ясно связывает второй вопрос с первым.
