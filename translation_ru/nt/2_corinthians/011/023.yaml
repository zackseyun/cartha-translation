base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: ru
  text: 'Они служители Мессии[a]? Говорю как безумец: я — в большей мере. Я больше трудился, чаще бывал в заключении, терпел побои без меры и много раз оказывался при смерти[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа»: «Они служители Христа?»'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «много раз в смертях»; вероятно, речь о неоднократных случаях, когда Павел был на грани смерти или подвергался смертельной опасности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διάκονοι
  choice: служители
  rationale: Передаёт общее значение тех, кто служит, не сужая его до формальной церковной должности; соответствует полемическому сравнению Павла с его соперниками.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Здесь Χριστός выступает как титул; «Мессия» прозрачно передаёт его значение. Традиционное «Христа» дано в сноске.
- source_word: παραφρονῶν λαλῶ
  choice: говорю как безумец
  rationale: Естественно по-русски передаёт самоироничное признание Павла, что такая похвальба звучит безумно.
- source_word: ὑπὲρ ἐγώ
  choice: я — ещё больше
  rationale: 'Сохраняет резкую эллиптическую сравнительную конструкцию: если они служители Мессии, то Павел — в ещё большей мере.'
- source_word: ἐν κόποις περισσοτέρως
  choice: гораздо больше трудился
  rationale: Передаёт изнурительный труд и усиленное сравнительное значение περισσοτέρως естественной современной фразой.
- source_word: ἐν φυλακαῖς περισσοτέρως
  choice: гораздо чаще бывал в заключении
  rationale: Множественное число указывает на повторные случаи заключения; в данном контексте сравнительная степень естественно выражает частоту.
- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: терпел побои без меры
  rationale: πληγαί обозначает нанесённые удары или побои, а ὑπερβαλλόντως подчёркивает их чрезвычайную, не поддающуюся мере степень.
- source_word: ἐν θανάτοις πολλάκις
  choice: много раз оказывался при смерти
  rationale: Естественно передаёт необычное греческое множественное число «в смертях», вероятно обозначающее неоднократную непосредственную угрозу смерти; буквальный образ сохранён в сноске.
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В этой генитивной конструкции слово сохраняет титульное значение. Основной текст раскрывает смысл титула, а традиционный вариант отмечен без объявления одного из них богословски исключительным.
- issue: Смысл выражения ἐν θανάτοις πολλάκις
  choice: много раз оказывался при смерти
  alternative: много раз «в смертях»
  rationale: Основной текст передаёт вероятный идиоматический смысл повторных смертельных опасностей, тогда как сноска сохраняет необычную буквальную форму и присущую ей образность.
translation_notes:
  register: Современный литературный русский язык с достоинством и риторической энергией. Краткий вопрос и резкое «я — ещё больше» сохраняют полемическую напряжённость; последующий перечень слегка перестроен в естественные русские глагольные фразы без устранения сравнительной градации.
