lexical_decisions:
- source_word: ὑπὸ Ἰουδαίων
  choice: от иудеев
  rationale: Оборот ὑπό с родительным падежом обозначает действующих лиц или источник наказания. «От иудеев» естественно по-русски и не уточняет сверх текста, шла ли речь о каком-либо официальном органе.
- source_word: πεντάκις
  choice: пять раз
  rationale: Прямо передаёт повторность, выраженную наречием πεντάκις.
- source_word: τεσσεράκοντα παρὰ μίαν
  choice: по сорок ударов без одного
  rationale: Сохраняет форму греческого выражения «сорок без одного», а «ударов» восполняет подразумеваемый объект наказания. Частица «по» естественно показывает одинаковое число ударов в каждом из пяти случаев.
- source_word: ἔλαβον
  choice: я получал
  rationale: Передаёт λαμβάνω в значении получения телесного наказания и сохраняет словесный образ оригинала без более толковательного «претерпел».
