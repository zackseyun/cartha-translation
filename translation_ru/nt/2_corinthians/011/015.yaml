id: 2CO.11.15
reference: 2 Corinthians 11:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: ru
  text: Поэтому неудивительно, если и его служители принимают облик служителей праведности[a]. Их конец будет соответствовать их делам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служителей справедливости». Греческое слово может означать как «праведность», так и «справедливость»; здесь речь идёт о видимости служения тому, что право.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέγα
  choice: неудивительно
  rationale: Греческое выражение буквально означает «не великое дело», но по смыслу указывает, что это не является чем-то примечательным или удивительным. Русское «неудивительно» естественно передаёт идиому.
- source_word: οὖν
  choice: поэтому
  rationale: Передаёт вывод из предыдущего стиха и сохраняет явную логическую связь.
- source_word: διάκονοι
  choice: служители
  rationale: В данном контексте речь идёт о тех, кто служит сатане. «Служители» сохраняет смысл функциональной принадлежности и не ограничивает слово церковной должностью.
- source_word: μετασχηματίζονται
  choice: принимают облик
  rationale: Глагол обозначает изменение внешнего вида или представления о себе, а не внутреннее преображение. Эта формулировка сохраняет связь с образом маскировки в предыдущем стихе.
- source_word: ὡς
  choice: служителей
  rationale: Роль или вид, который они принимают, естественно выражен конструкцией «принимают облик служителей».
- source_word: δικαιοσύνης
  choice: праведности
  rationale: «Праведность» является основным русским соответствием в контексте Павла и здесь обозначает видимость принадлежности к тому, что право и угодно Богу; возможный оттенок справедливости отмечен в сноске.
- source_word: τὸ τέλος
  choice: их конец
  rationale: Обозначает ожидающий их итог или конечную участь в контексте суда.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: будет соответствовать их делам
  rationale: 'Передаёт формулу воздаяния: конечная участь соразмерна совершённым делам. Формулировка естественна по-русски и сохраняет связь между итогом и поступками.'
theological_decisions:
- issue: Значение δικαιοσύνη в выражении διάκονοι δικαιοσύνης
  choice: праведность
  alternative: справедливость
  rationale: В данном контексте речь прежде всего о притязании выглядеть нравственно правыми и служащими тому, что право. «Праведность» передаёт этот смысл, а «справедливость» сохраняется как реальная лексическая возможность в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Неудивительно» естественно передаёт греческую идиому, а «принимают облик» подчёркивает внешнюю, обманчивую перемену без предположения о внутреннем преображении.
