base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/010.yaml
  text: As the truth of Messiah is in me[c][b][a], this boasting of mine will not be silenced in the regions of Achaia.
translation:
  language: ru
  text: Как истинно, что во мне истина Мессии[a], эта моя похвальба не будет пресечена[b] в областях Ахайи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа». Более буквально: «Истина Мессии во мне, что…»'
    reason: Сохраняет традиционную передачу титула и необычную форму греческого торжественного утверждения.
  - marker: b
    text: 'Или: «эта моя похвальба не будет заграждена» или «не будет остановлена»; буквально возможен смысл: «эта похвальба не будет перекрыта для меня (или по отношению ко мне)». Греческий оборот необычен и допускает разные способы передачи.'
    reason: Отражает образное значение φραγήσεται, будущую страдательную форму и трудную конструкцию εἰς ἐμέ.
lexical_decisions:
- source_word: ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι
  choice: 'Истиной Мессии, которая во мне, заверяю:'
  rationale: Оборот передан как торжественное заверение, что соответствует его клятвенной силе в контексте. Относительное предложение сохраняет указание на пребывающую в Павле истину, а сноска приводит более буквальную конструкцию.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Здесь Χριστός сохраняет смысл титула Помазанника; родительный падеж не уточняется сверх необходимого и допускает оттенок принадлежности или связи.
- source_word: ἡ καύχησις αὕτη εἰς ἐμὲ
  choice: эта моя похвальба
  rationale: Трудное εἰς ἐμέ естественно выражено по-русски притяжательным местоимением, без искусственного оборота «по отношению ко мне».
- source_word: οὐ φραγήσεται
  choice: не заградят уст
  rationale: Образное русское выражение передаёт будущее пассивное значение φράσσω — перекрыть, заставить замолчать — и уместно сочетается с речью или похвальбой.
- source_word: ἐν τοῖς κλίμασι τῆς Ἀχαΐας
  choice: в областях Ахайи
  rationale: Сохраняется множественное число κλίμασι и общепринятое русское название римской провинции.
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В данном торжественном утверждении титульный смысл Χριστός остаётся заметным; традиционный вариант «Христа» указан в сноске без изменения смысла стиха.
- issue: Характер начального утверждения
  choice: торжественное заверение истиной Мессии
  alternative: буквальное «истина Мессии во мне, что…»
  rationale: Греческая конструкция имеет клятвенную силу, однако её необычная форма сохранена как буквальная альтернатива в сноске, чтобы не скрывать синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Идиома «не заградят уст» сохраняет речевой образ оригинала; географическое обозначение передано без упрощения множественного числа.
