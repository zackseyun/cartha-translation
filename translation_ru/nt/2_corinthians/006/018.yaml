base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/018.yaml
  text: And I will be a Father to you[a], and you will be sons and daughters to me, says the Lord Almighty.
translation:
  language: ru
  text: «И Я буду вам Отцом[a], и вы будете Мне сыновьями и дочерьми, — говорит Господь Вседержитель».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Я буду вам в Отца, и вы будете Мне в сыновей и дочерей». Греческий оборот выражает заветные отношения; по-русски естественнее: «буду вам Отцом» и «будете Мне сыновьями и дочерьми».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσομαι ὑμῖν εἰς πατέρα
  choice: Я буду вам Отцом
  rationale: Греческая заветная формула буквально описывает отношение «быть кому-либо в качестве отца». Русское «буду вам Отцом» естественно передаёт будущность, дательный отношения и образ отца, сохраняя параллелизм следующей части.
- source_word: ὑμεῖς ἔσεσθέ μοι
  choice: вы будете Мне
  rationale: Явное ὑμεῖς передано местоимением «вы», а μοι — дательным «Мне»; тем самым сохраняются взаимность и симметрия отношений.
- source_word: υἱοὺς καὶ θυγατέρας
  choice: сыновьями и дочерьми
  rationale: Исходный текст прямо называет и сыновей, и дочерей; обобщение «детьми» устранило бы намеренно выраженное включение обоих полов.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время формулы цитирования сохранено, что соответствует греческому тексту и естественно звучит по-русски.
- source_word: κύριος
  choice: Господь
  rationale: Здесь κύριος является традиционным божественным титулом; «Господь» точно и нейтрально передаёт его в современном литературном русском.
- source_word: παντοκράτωρ
  choice: Вседержитель
  rationale: «Вседержитель» — точный и укоренённый русский библейский эквивалент παντοκράτωρ, обозначающий Бога как обладающего всеобъемлющей властью; он не подменяет это слово иным ветхозаветным титулом.
theological_decisions:
- issue: Передача взаимных отношений Бога и Его народа
  choice: «Я буду вам Отцом… вы будете Мне сыновьями и дочерьми»
  alternative: «Я стану вашим Отцом… вы станете Моими детьми»
  rationale: Выбранная формулировка сохраняет структуру греческой заветной формулы, её взаимность и смысл отношения, не усиливая оттенок начала нового состояния глаголом «стану».
- issue: Точное обозначение сыновей и дочерей
  choice: «сыновьями и дочерьми»
  alternative: «детьми»
  rationale: Сохранены оба существительных исходного текста; это не позволяет скрыть явное упоминание дочерей.
- issue: Передача божественного титула κύριος παντοκράτωρ
  choice: «Господь Вседержитель»
  alternative: «Господь Всемогущий»; «Господь Саваоф»
  rationale: «Господь Вседержитель» непосредственно передаёт греческие титулы. «Господь Саваоф» внесло бы иной исходный титул, которого в данном греческом тексте нет.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Заглавные «Я», «Мне» и «Отцом» применены как традиционные знаки почтения при речи Бога и о Боге; «Вседержитель» сохраняет вес божественного титула без архаизации синтаксиса.
