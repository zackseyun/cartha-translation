  yaml_path: translation/nt/2_corinthians/006/011.yaml
  text: Our mouth has been opened to you[a], Corinthians[b]; our heart has been widened.
translation:
  language: ru
  text: Наши уста раскрылись перед вами[a], коринфяне; наше сердце расширилось[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, передавая смысл: «Мы говорим с вами открыто».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наше сердце стало шире» или «наше сердце широко открыто».'
    reason: lexical_alternative
lexical_decisions:
- source_word: στόμα
  choice: уста
  rationale: Сохраняет телесный образ и его параллель с «сердцем». Слово «уста» литературно, но понятно и уместно в возвышенной прямой речи.
- source_word: ἀνέῳγεν
  choice: открыты
  rationale: Передаёт состояние, наступившее в результате совершившегося действия, что соответствует перфекту; образ открытых уст сохранён без тяжеловесной буквальности.
- source_word: πρὸς ὑμᾶς
  choice: для вас
  rationale: Естественно выражает направленность речи к адресатам; буквальное «к вам» при слове «открыты» в современном русском звучит неестественно.
- source_word: Κορίνθιοι
  choice: коринфяне
  rationale: Передаёт прямое обращение к жителям Коринфа обычной русской формой.
- source_word: καρδία
  choice: сердце
  rationale: Сохраняет исходный образ внутреннего мира и привязанности, а также риторическую параллель с устами.
- source_word: πεπλάτυνται
  choice: стало шире
  rationale: Передаёт образ расширения и результативное значение перфекта более естественно для современного русского, чем «расширено» или «сделалось широким».
theological_decisions:
- issue: Образы открытых уст и ставшего шире сердца как выражение откровенности и любви Павла
  choice: Сохранить оба телесных образа в основном тексте, не заменяя их истолкованием.
  alternative: Мы откровенно говорили с вами, коринфяне; мы широко открыли вам своё сердце.
  rationale: Греческий текст выражает откровенность и душевную расположенность посредством двух связанных образов. Их сохранение позволяет не сужать смысл и не добавлять отсутствующее в тексте уточнение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным словом «уста». Синтаксис сохраняет краткость, параллелизм и личное обращение греческого текста; метафоры оставлены заметными, а их идиоматический смысл пояснён в сносках.
