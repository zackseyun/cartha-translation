  source_fidelity: Греческие образы «уста» и «сердце», а также результативный характер перфектных форм в целом сохранены. Однако «для вас» обычно выражает назначение или пользу («предназначены для вас»), тогда как πρός ὑμᾶς здесь обозначает обращённость речи к адресатам. «Перед вами» естественно передаёт эту направленность в русском метафорическом обороте.
  naturalness: «Наши уста раскрылись перед вами» — современный литературный и достаточно прозрачный образ; он менее двусмыслен, чем «открыты для вас». «Наше сердце расширилось» сохраняет намеренную метафоричность оригинала и звучит приемлемо в возвышенном апостольском контексте.
  terminology: «Уста», «сердце» и «коринфяне» уместны. Конфессионально нагруженных терминов или интерпретационных добавлений в исправленном основном тексте нет.
