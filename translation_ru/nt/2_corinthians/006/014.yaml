  text: Μὴ γίνεσθε ἑτεροζυγοῦντες ἀπίστοις· τίς γὰρ μετοχὴ δικαιοσύνῃ καὶ ἀνομίᾳ, ⸂ἢ τίς⸃ κοινωνία φωτὶ πρὸς σκότος;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: ru
  text: Не впрягайтесь в одно ярмо с неверующими.[a] Ведь что общего у праведности[b] с беззаконием? И какое общение у света с тьмой?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение передаёт образ животных разного вида, запряжённых под одно ярмо; ср. Второзаконие 22:10.
    reason: cross_reference
  - marker: b
    text: 'Или: «справедливости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: Не впрягайтесь
  rationale: Запретительная конструкция с γίνομαι и причастием естественно передаётся по-русски глагольным запретом; выбор сохраняет значение вступления в такое соединение, а не только статического состояния.
- source_word: ἑτεροζυγοῦντες
  choice: в одно ярмо
  rationale: Фраза сохраняет образ совместной упряжки с несовместимым напарником, вероятно отсылающий к Второзаконию 22:10; русская формулировка естественна и не ограничивает применение стиха одной конкретной сферой отношений.
- source_word: ἀπίστοις
  choice: с неверующими
  rationale: В данном контексте слово обозначает людей, не верующих во Христа; творительный падеж с предлогом «с» естественно выражает совместность в образе ярма.
- source_word: μετοχὴ
  choice: что общего
  rationale: Идиоматическая русская передача участия или общей доли; она ясно выражает несовместимость противопоставленных начал.
- source_word: δικαιοσύνῃ
  choice: праведности
  rationale: В нравственно-религиозном противопоставлении ἀνομία слово естественно означает праведность; возможное значение «справедливость» отмечено как лексическая альтернатива.
- source_word: ἀνομίᾳ
  choice: беззаконием
  rationale: Прямая и устойчивая передача состояния пренебрежения законом; сохраняет смысловой контраст с праведностью.
- source_word: κοινωνία
  choice: общение
  rationale: Передаёт совместность, сопричастность и тесную связь, сохраняя отличие от более общего μετοχή в предыдущем вопросе.
- source_word: φωτὶ πρὸς σκότος
  choice: у света с тьмой
  rationale: Естественная русская конструкция для выражения отношения или совместности при сохранении буквального образного контраста света и тьмы.
theological_decisions:
- issue: Значение δικαιοσύνη в противопоставлении Павла
  choice: праведность
  alternative: справедливость
  rationale: Контраст с «беззаконием» прежде всего указывает на нравственно-религиозную праведность, однако слово может также включать смысл справедливости; этот диапазон не следует превращать в узкое конфессиональное толкование.
- issue: Объём запрета об одном ярме
  choice: сохранить общую метафору без уточнения вида отношений
  alternative: конкретизировать как брак, деловое партнёрство или культовое участие
  rationale: Сам стих не называет единственную сферу применения. Конкретизация в основном тексте необоснованно сняла бы присущую высказыванию широту.
translation_notes:
  register: Современный литературный русский язык с сохранением яркой метафоры ярма. Риторические вопросы переданы естественно и торжественно, без архаизмов. Лексическая альтернатива «справедливость» учтена в решениях, но отдельная сноска не добавлена, чтобы не перегружать короткий стих.
