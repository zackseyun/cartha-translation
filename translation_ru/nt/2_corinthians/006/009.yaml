- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет резкий призыв обратить внимание, оставаясь естественным для современного литературного русского языка.
- source_word: ζῶμεν
  choice: мы живы
  rationale: Естественно и лаконично передаёт настоящее время и подчёркивает парадокс с «умирающие».
- source_word: παιδευόμενοι
  choice: наказываемые
  rationale: В контексте страданий слово вероятнее обозначает подвергание взысканию или наказанию, однако примечание сохраняет также возможный воспитательный смысл.
- source_word: μὴ θανατούμενοι
