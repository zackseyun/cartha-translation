  text: ἐν πληγαῖς, ἐν φυλακαῖς, ἐν ἀκαταστασίαις, ἐν κόποις, ἐν ἀγρυπνίαις, ἐν νηστείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/005.yaml
  text: in beatings, in imprisonments, in riots, in labors, in sleepless nights, in fastings,
translation:
  language: ru
  text: под ударами, в тюрьмах, среди беспорядков, в трудах, в бессонных ночах, в постах,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληγαῖς
  choice: под ударами
  rationale: Передаёт телесные побои и сохраняет параллельный ряд обстоятельств, выраженных ἐν с дательным падежом.
- source_word: φυλακαῖς
  choice: в тюрьмах
  rationale: Естественное современное обозначение неоднократного заключения под стражу; множественное число оригинала сохранено.
- source_word: ἀκαταστασίαις
  choice: среди беспорядков
  rationale: Слово обозначает нестабильность, смятение или общественные беспорядки; «среди беспорядков» естественно передаёт обстоятельства служения, не утверждая, что Павел сам их устраивал.
- source_word: κόποις
  choice: в трудах
  rationale: Сохраняет значение изнурительного труда и традиционно понятную, достойную лексику.
- source_word: ἀγρυπνίαις
  choice: в бессонных ночах
  rationale: Передаёт вынужденное или сознательное бодрствование без уточнения причины, которой оригинал здесь не называет.
- source_word: νηστείαις
  choice: в постах
  rationale: Прямо сохраняет обычное значение добровольного религиозного воздержания от пищи, не подменяя его голодом.
theological_decisions:
- issue: 'Значение νηστείαις: религиозные посты или вынужденный голод'
  choice: в постах
  alternative: в голоде / без пищи
  rationale: Обычное лексическое значение — «посты»; контекст не требует сводить выражение к невольному лишению пищи. Сохраняется возможность того, что речь идёт о добровольном посте.
- issue: Отношение Павла к ἀκαταστασίαις
  choice: среди беспорядков
  alternative: в мятежах
  rationale: Формулировка сохраняет общественную смуту как окружающее обстоятельство и не приписывает Павлу участие в мятеже.
translation_notes:
  register: Современный литературный русский язык с лаконичным ритмом перечня. Повтор предлога варьируется только там, где этого требует естественная русская сочетаемость; запятая в конце сохранена, поскольку стих продолжает предложение.
