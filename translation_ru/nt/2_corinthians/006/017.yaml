  source_fidelity: 'Текст точно передаёт все смысловые элементы греческого оригинала: выводное διὸ («Поэтому»), решительный призыв «выйдите из их среды», повеление ἀφορίσθητε («отделитесь»), пророческую формулу «говорит Господь», запрет касаться нечистого и обещание будущего принятия. Обобщённость ἀκαθάρτου сохранена в форме «к нечистому».'
  naturalness: Перевод звучит естественно на современном литературном русском и сохраняет уместно возвышенный регистр пророческой цитаты. Обороты «из их среды», «не прикасайтесь к нечистому» и «Я приму вас» ясны и стилистически цельны.
  terminology: «Господь» корректно передаёт κύριος в новозаветной пророческой формуле. «Нечистому» сохраняет библейско-культовый и нравственный диапазон оригинала, не сужая его до конкретного предмета. Сноска к «отделитесь» адекватно отмечает пассивный оттенок греческой формы, не навязывая единственную интерпретацию.
