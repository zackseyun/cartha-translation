  text: διὸ ἐξέλθατε ἐκ μέσου αὐτῶν, καὶ ἀφορίσθητε, λέγει κύριος, καὶ ἀκαθάρτου μὴ ἅπτεσθε· κἀγὼ εἰσδέξομαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: ru
  text: 'Поэтому выйдите из их среды и отделитесь[a], — говорит Господь, — и не прикасайтесь к нечистому[b][c], и Я приму вас.


    [a] Или: «будьте отделены»; возможно также: «отделите себя».

    [b] Или: «не прикасайтесь ни к чему нечистому».

    [c] Здесь Павел перекликается с языком ветхозаветных пророков, особенно с Исайей 52:11.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будьте отделены»; возможно также: «отделите себя».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не прикасайтесь ни к чему нечистому».'
    reason: lexical_alternative
  - marker: c
    text: Здесь Павел перекликается с языком ветхозаветных пророков, особенно с Исайей 52:11.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения естественным для современного русского языка союзным наречием.
- source_word: ἐξέλθατε
  choice: выйдите
  rationale: Аористный императив во множественном числе выражает решительный призыв выйти; русский совершенный вид сохраняет эту направленность.
- source_word: ἐκ μέσου αὐτῶν
  choice: из их среды
  rationale: Естественно передаёт как пространственное, так и социальное удаление из их окружения.
- source_word: ἀφορίσθητε
  choice: отделитесь
  rationale: Форма греческого пассивного императива допускает оттенок «будьте отделены», однако русское «отделитесь» звучит естественно как призыв к обособлению и не конкретизирует его применение сверх текста.
- source_word: λέγει κύριος
  choice: говорит Господь
  rationale: Сохраняет стандартную пророческую формулу и передаёт κύριος как «Господь» в новозаветном контексте.
- source_word: ἀκαθάρτου
  choice: к нечистому
  rationale: Субстантивированное прилагательное сохраняет обобщённость греческого среднего рода и не навязывает конкретный предмет.
- source_word: μὴ ἅπτεσθε
  choice: не прикасайтесь
  rationale: Передаёт образ физического касания, уместный в контексте ритуальной и нравственной нечистоты и пророческой аллюзии.
- source_word: κἀγὼ
  choice: и Я
  rationale: Сохраняет соединение καί + ἐγώ и личный ответ Бога без искусственного усиления.
- source_word: εἰσδέξομαι ὑμᾶς
  choice: Я приму вас
  rationale: Передаёт благосклонный приём в возвышенном, но понятном регистре, соответствующем пророческой речи.
theological_decisions:
- issue: Передача κύριος в пророческом изречении с ветхозаветным фоном
  choice: Господь
  alternative: ГОСПОДЬ; Владыка
  rationale: Хотя текст перекликается с ветхозаветным местом, греческий новозаветный текст содержит κύριος; «Господь» сохраняет это обозначение без обратной подстановки имени YHWH.
- issue: Смысл повеления об отделении
  choice: отделитесь
  alternative: будьте отделены; отделите себя
  rationale: Формулировка сохраняет призыв к отличию и разрыву с оскверняющим соучастием, не превращая его в предписание полного социального ухода от всех посторонних.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Пунктуация выделяет вводную формулу «говорит Господь». Неопределённость ἀκαθάρτου сохранена, а пассивный оттенок ἀφορίσθητε отмечен в сноске.
