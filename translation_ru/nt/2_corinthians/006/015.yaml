source:
  edition: SBLGNT
  text: τίς δὲ συμφώνησις ⸀Χριστοῦ πρὸς Βελιάρ, ἢ τίς μερὶς πιστῷ μετὰ ἀπίστου;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: ru
  text: И какое согласие между Мессией и Велиаром?[a] Или какая доля у верующего с неверующим?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Велиар: греч. Βελιάρ; также употребляется форма «Велиал».'
    reason: alternative_reading
lexical_decisions:
- source_word: συμφώνησις
  choice: согласие
  rationale: Слово обозначает созвучие, согласованность или совместимость. «Согласие» естественно звучит по-русски и сохраняет смысл резкого противопоставления.
- source_word: Χριστοῦ
  choice: Мессией
  rationale: Здесь Χριστός выступает как титул в концептуальном противопоставлении Велиару; форма творительного падежа обусловлена русской конструкцией «между … и …».
- source_word: Βελιάρ
  choice: Велиаром
  rationale: Собственное имя передано транслитерацией именно греческой формы Βελιάρ; вариант «Велиал» отмечен в сноске.
- source_word: μερίς
  choice: доля
  rationale: μερίς означает часть или долю, которой кто-либо обладает либо в которой участвует. «Какая доля у…» кратко и естественно передаёт образ общей участи или принадлежности, не уточняя его сверх текста.
- source_word: πιστῷ
  choice: верующего
  rationale: Субстантивированное прилагательное обозначает верующего человека; существительное «верующий» является естественным русским соответствием.
- source_word: ἀπίστου
  choice: неверующим
  rationale: В прямом противопоставлении πιστός слово обозначает неверующего человека. Перевод «неверующий» сохраняет этот контраст и не смещает смысл к одной лишь ненадёжности или неверности.
- source_word: πρὸς
  choice: между
  rationale: При существительном συμφώνησις предлог выражает отношение между двумя сторонами; по-русски это естественно передаётся конструкцией «между … и …».
- source_word: μετὰ
  choice: с
  rationale: Предлог выражает связь или общность; русское «с» кратко сохраняет эту ассоциацию.
- source_word: δὲ
  choice: И
  rationale: Частица продолжает последовательность риторических вопросов; союз «И» передаёт добавочное движение мысли, не усиливая противопоставление.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном антитетическом сочетании с Велиаром слово имеет явную титульную силу. «Мессия» передаёт титул, тогда как «Христос» в современном русском нередко воспринимается как имя.
- issue: Идентификация Βελιάρ
  choice: Велиар — транслитерированное собственное имя
  alternative: Велиал
  rationale: Основной текст следует засвидетельствованной греческой форме, не добавляя отождествления или пояснения, отсутствующего в стихе. Более привычная библейская форма приведена в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной риторикой. Параллелизм двух вопросов сохранён; неоднозначность образа «доли» не устранена поясняющим толкованием.
