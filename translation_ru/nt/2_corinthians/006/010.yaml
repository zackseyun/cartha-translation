lexical_decisions:
- source_word: ὡς
  choice: нас считают / считают
  rationale: В контексте перечня апостольских парадоксов передаёт то, какими служители выглядят или считаются; повтор сохраняет риторическую структуру, не утверждая, будто скорбь или бедность нереальны.
- source_word: λυπούμενοι
  choice: скорбящими
  rationale: Передаёт состояние печали или скорби, не уточняя её причины и сохраняя контраст с продолжающейся радостью.
- source_word: ἀεὶ δὲ χαίροντες
  choice: но мы всегда радуемся
  rationale: Естественная современная формулировка, сохраняющая временную полноту ἀεί и резкий контраст δέ.
- source_word: πτωχοὶ
  choice: бедными
  rationale: Прямое соответствие, не усиливающее значение до полной нищеты и допускающее как материальный, так и более широкий смысл.
- source_word: πολλοὺς δὲ πλουτίζοντες
  choice: но мы многих обогащаем
  rationale: Глагол πλουτίζω означает делать богатым, обогащать; краткая формулировка сохраняет неопределённость относительно природы богатства.
- source_word: μηδὲν ἔχοντες
  choice: ничего не имеющими
  rationale: Сохраняет словесное противопоставление внешнего отсутствия имущества всеохватному обладанию в следующей части.
- source_word: πάντα κατέχοντες
  choice: но мы всем владеем
  rationale: Κατέχω здесь означает владеть, обладать; «всем» естественно передаёт всеохватное πάντα и поддерживает парадокс.
theological_decisions:
- issue: Характер богатства и обладания в апостольском парадоксе
  choice: В основном тексте не уточнять, что богатство и обладание являются духовными.
  alternative: 'Прямо перевести: «духовно обогащаем многих» и «в духовном смысле обладаем всем».'
  rationale: Контекст позволяет понимать эти выражения прежде всего как духовную реальность, однако в греческом тексте такого определения нет. Неуточнённая формулировка сохраняет богословское напряжение и риторическую силу парадокса.
- issue: Значение повторяющегося ὡς
  choice: 'Передать как восприятие окружающих: «нас считают…».'
  alternative: 'Передать формально: «как скорбящие… как бедные…».'
  rationale: В данном перечне ὡς сопоставляет внешний статус или оценку апостолов с парадоксально сосуществующей реальностью. «Нас считают» звучит естественно по-русски, при этом не делает первую сторону каждого сопоставления притворной или ложной.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Повтор «считают» воспроизводит трёхчастный параллелизм, а личные формы устраняют тяжёлую цепочку русских причастий. Точка с запятой сохраняет ритм перечня парадоксов.
