lexical_decisions:
- source_word: διὰ
  choice: в / при
  rationale: С родительным падежом в этой паре διά обозначает обстоятельства, среди которых совершается служение. По-русски повтор одного предлога звучал бы менее естественно, поэтому выбраны соответствующие каждой паре «в» и «при».
- source_word: δόξης
  choice: чести
  rationale: В противопоставлении ἀτιμία слово δόξα имеет общественный смысл признания и почёта; «честь» естественно образует краткую антитезу с «бесчестием».
- source_word: ἀτιμίας
  choice: бесчестии
  rationale: Передаёт общественное унижение и сохраняет формальную связь с «честью».
- source_word: δυσφημίας
  choice: злой молве
  rationale: Слово может обозначать порочащие речи или дурную репутацию. «Злая молва» сохраняет обе возможности лучше, чем более узкое «клевета».
- source_word: εὐφημίας
  choice: доброй молве
  rationale: Передаёт благоприятные отзывы или репутацию и сохраняет симметрию с «злой молвой».
- source_word: ὡς
  choice: нас считают
  rationale: Контекстуально раскрывает подразумеваемую внешнюю оценку, не представляя обвинение в обмане как факт.
- source_word: πλάνοι
  choice: обманщиками
  rationale: В данном контексте означает тех, кого обвиняют в том, что они вводят других в заблуждение.
- source_word: ἀληθεῖς
  choice: верны истине
  rationale: Греческое прилагательное допускает значения «истинные», «правдивые», «подлинные». «Верны истине» естественно относится к людям и сохраняет противопоставление обвинению в обмане, хотя несколько эксплицирует смысл.
theological_decisions:
- issue: Противопоставление внешней оценки апостольских служителей и действительности
  choice: «нас считают обманщиками, но мы верны истине»
  alternative: «как обманщики, однако истинные»
  rationale: ὡς в риторическом перечне вводит то, какими Павел и его сотрудники кажутся другим, тогда как ἀληθεῖς утверждает противоположную действительность. Явное «нас считают» сохраняет это напряжение и не приписывает им обмана.
translation_notes:
  register: Современный литературный русский язык с краткими, ритмически уравновешенными антитезами. Начальная строчная буква и конечная запятая сохранены, поскольку стих является частью продолжающегося перечня.
