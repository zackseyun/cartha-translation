  text: ни в чём не давая повода для преткновения[a], чтобы служение не подверглось порицанию[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни в чём не давая повода к соблазну».'
    reason: lexical_alternative
