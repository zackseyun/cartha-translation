    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν … προσκοπήν
  choice: не давая повода для преткновения
  rationale: Сочетание передаёт отсутствие какого-либо повода, из-за которого другие могли бы преткнуться. «Преткновение» сохраняет образ греческого слова, а «повод» естественно передаёт оборот с διδόντες.
- source_word: ἐν μηδενί
  choice: ни в чём
  rationale: 'Кратко и естественно выражает всеохватность: ни при каких обстоятельствах и ни в каком отношении.'
- source_word: διδόντες
  choice: давая
  rationale: Сохраняет форму и прямое значение причастия, оставаясь естественным в русском обороте «давать повод».
- source_word: ἵνα μὴ
  choice: чтобы … не
  rationale: Передаёт целевое, с возможным оттенком результата, значение греческой конструкции без его искусственного уточнения.
- source_word: μωμηθῇ
  choice: не подверглось порицанию
  rationale: Передаёт пассивную форму и значение обвинения, осуждения или нарекания; более современно и ясно, чем «не было укоряемо».
- source_word: ἡ διακονία
  choice: служение
  rationale: В контексте означает совершаемое Павлом и его сотрудниками апостольское служение. Русское «служение» передаёт этот смысл, не превращая его в название позднейшей церковной должности.
theological_decisions:
- issue: Значение ἡ διακονία в самоописании Павла
  choice: служение
  alternative: служба; наше служение
  rationale: Контекст указывает на апостольский труд Павла и его сотрудников. Вставка «наше» подразумевается контекстом, но отсутствует в греческом тексте, поэтому не внесена в основной перевод.
- issue: Характер связи, выраженной ἵνα μὴ
  choice: чтобы служение не подверглось порицанию
  alternative: дабы служение не было порицаемо; и тогда служение не будет опорочено
  rationale: Формулировка сохраняет присущую конструкции возможность целевого и результативного оттенков и не утверждает только одно из них.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. «Преткновение» сохранено ради метафоры оригинала, а более общеупотребительный вариант «соблазн» вынесен в примечание. Синтаксис причастного оборота следует связи с предшествующим контекстом стиха.
