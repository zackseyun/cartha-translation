lexical_decisions:
- source_word: ἁγνότητι
  choice: чистоте
  rationale: ἁγνότης обозначает чистоту и нравственную незапятнанность в широком смысле; «чистота» естественно звучит по-русски и не сужает значение до одного лишь целомудрия.
- source_word: γνώσει
  choice: знании
  rationale: γνῶσις означает знание, вероятно включая практическое и духовное разумение в служении; широкий эквивалент «знание» сохраняет эту смысловую ёмкость.
- source_word: μακροθυμίᾳ
  choice: долготерпении
  rationale: μακροθυμία передаёт стойкое терпение по отношению к людям и трудностям. «Долготерпение» точно отражает продолжительность и выдержку, оставаясь понятным в возвышенном библейском регистре.
- source_word: χρηστότητι
  choice: доброте
  rationale: χρηστότης обозначает доброту, благожелательность и мягкое обращение; «доброта» — естественный и широкий русский эквивалент.
- source_word: πνεύματι ἁγίῳ
  choice: Святом Духе
  rationale: В словоупотреблении Павла сочетание πνεῦμα ἅγιον здесь вероятнее всего относится к Божьему Святому Духу; прописные буквы отражают это понимание.
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: нелицемерной любви
  rationale: ἀνυπόκριτος означает отсутствие притворства или лицемерия. «Нелицемерная любовь» точно и естественно передаёт сочетание, сохраняя прямую связь с греческой формой.
- source_word: ἐν
  choice: в
  rationale: Повторяющийся предлог ἐν обозначает сферу, средство или образ действия. Последовательное «в» сохраняет риторический параллелизм исходного перечня и не устраняет его смысловую гибкость.
theological_decisions:
- issue: Референт πνεύματι ἁγίῳ
  choice: Святой Дух как Божий Дух
  alternative: святой дух как святое внутреннее расположение человека
  rationale: Словоупотребление Павла и контекст делают указание на Святого Духа наиболее вероятным, однако отсутствие артикля и положение выражения среди нравственных качеств допускают понимание человеческого расположения; эта подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно библейским ритмом. Повтор «в» сохранён ради анафоры греческого текста; запятая в конце показывает, что стих продолжает синтаксический перечень соседних стихов.
