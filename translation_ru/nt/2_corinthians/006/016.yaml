id: 2CO.6.16
reference: 2 Corinthians 6:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: ru
  text: 'Какое же согласие[a] между храмом Божьим и идолами? Ведь мы — храм живого Бога, как сказал Бог: «Я буду обитать среди них[b] и ходить среди них; Я буду их Богом, и они будут Моим народом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «какая общность» или «какой лад».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в них». Греческий предлог может означать как «в», так и «среди»; здесь контекст общины и завета поддерживает перевод «среди них».'
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: согласие
  rationale: Слово обозначает согласие, одобрение или общность позиции. «Согласие» ясно передаёт риторически подчёркнутую несовместимость Божьего храма с идолами.
- source_word: ναῷ / ναὸς
  choice: храм
  rationale: ναός обозначает храм или святилище, в отличие от всего храмового комплекса. «Храм» естественно и сохраняет культовый смысл метафоры.
- source_word: εἰδώλων
  choice: идолами
  rationale: В данном контексте речь идёт о языческих идолах, а не о нейтральных изображениях.
- source_word: ζῶντος
  choice: живого
  rationale: Определение относится к Богу и воспроизводит устойчивое библейское выражение «живой Бог», противопоставляющее Его безжизненным идолам.
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: как сказал Бог
  rationale: Форма εἶπεν естественно передаётся прошедшим временем, а καθώς вводит подтверждающую цитату из Писания.
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: Я буду обитать среди них
  rationale: Предлог ἐν допускает значения «в» и «среди». Корпоративный контекст завета и параллельное «ходить среди них» поддерживают основной вариант «среди них», при этом альтернативное понимание отмечено в сноске.
- source_word: ἐμπεριπατήσω
  choice: ходить среди них
  rationale: Перевод сохраняет образное ветхозаветное описание постоянного Божьего присутствия среди Его народа.
- source_word: ἔσομαι αὐτῶν θεός
  choice: Я буду их Богом
  rationale: Естественная русская форма традиционной формулы завета, сохраняющая её взаимно-личностный смысл.
- source_word: λαός
  choice: народ
  rationale: В формуле завета слово обозначает Божий народ как единое сообщество.
theological_decisions:
- issue: Образ общины как Божьего храма
  choice: мы — храм живого Бога
  alternative: мы — один из храмов живого Бога
  rationale: Хотя ναὸς не имеет артикля, в позиции именной части сказуемого оно качественно и определённо характеризует общину как Божий храм. Неопределённое понимание «один из храмов» здесь неуместно.
- issue: Формулировка Божьего обитания
  choice: Я буду обитать среди них
  alternative: Я буду обитать в них
  rationale: Цитата обращена к народу как к сообществу, а следующая фраза говорит, что Бог будет ходить среди них. Основной перевод сохраняет этот коллективный смысл, не исключая возможного значения «в них», указанного в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Риторический вопрос передан естественной конструкцией «между… и…». Тире подчёркивает именную часть сказуемого без добавления отсутствующего в греческом значения. В цитате сохранены образы обитания и хождения, а также формула завета.
