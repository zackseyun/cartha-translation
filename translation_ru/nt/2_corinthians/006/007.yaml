lexical_decisions:
- source_word: λόγῳ ἀληθείας
  choice: в слове истины
  rationale: 'Сохраняет форму греческого выражения и его смысловую широту: речь может идти как об истинном возвещении, так и о вести истины.'
- source_word: δυνάμει θεοῦ
  choice: в силе Бога
  rationale: Прямо передаёт родительный оборот и сохраняет параллелизм повторяющихся конструкций с ἐν.
- source_word: διὰ
  choice: посредством
  rationale: При родительном падеже διά обозначает средство; «посредством» ясно выражает инструментальное значение.
- source_word: ὅπλων
  choice: оружия
  rationale: ὅπλον может обозначать воинское снаряжение как наступательного, так и защитного назначения; «оружие» не сужает образ до одних доспехов.
- source_word: δικαιοσύνης
  choice: праведности
  rationale: Основное соответствие в данном павловском контексте; возможный смысл «справедливости» сохранён в сноске.
- source_word: τῶν δεξιῶν καὶ ἀριστερῶν
  choice: в правой и левой руке
  rationale: В русском необходимо восполнить подразумеваемое существительное. Такой перевод естественно передаёт образ полной вооружённости, не уточняя, какое оружие служит нападению, а какое защите.
theological_decisions:
- issue: Значение δικαιοσύνη в павловском выражении
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет обычную богословскую и этическую широту слова, тогда как «справедливость» представляет допустимый, но более узкий оттенок; он отмечен в сноске.
- issue: Образ оружия для правой и левой стороны
  choice: в правой и левой руке
  alternative: справа и слева
  rationale: Контекст допускает понимание обеих рук либо обеих сторон. В основном тексте выбран наиболее естественный воинский образ, а более буквальная пространственная возможность указана в сноске.
translation_notes:
  register: Современный литературный русский с достоинством и умеренно формальной библейской ритмикой. Повтор «в» сохранён в первых двух оборотах; «посредством» ясно обозначает смену греческого предлога и инструментальный смысл. Пунктуация учитывает, что стих является частью продолжающегося перечня.
