    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: но
  rationale: Передаёт противопоставление предшествующему отрицательному высказыванию и вводит положительное описание служения.
- source_word: ἐν παντί
  choice: во всём
  rationale: Сохраняет широкий охват греческого выражения, не ограничивая его ни обстоятельствами, ни отдельными сторонами поведения.
- source_word: συνιστάνοντες ἑαυτούς
  choice: показываем себя
  rationale: В данном контексте глагол означает не просто словесно рекомендовать себя, а подтверждать делами подлинность своего служения; выбранный вариант естественен по-русски и сохраняет этот смысл.
- source_word: ὡς θεοῦ διάκονοι
  choice: как служители Бога
  rationale: διάκονοι подчёркивает служение Богу, а не обязательно установленную церковную должность; «служители» сохраняет достоинство и широту термина.
- source_word: ἐν ὑπομονῇ πολλῇ
  choice: в великой стойкости
  rationale: ὑπομονή обозначает стойкое перенесение испытаний, а не только спокойное ожидание; повтор предлога «в» отражает устройство греческого перечня.
- source_word: θλίψεσιν
  choice: в бедствиях
  rationale: Передаёт тяжёлые испытания и давление обстоятельств ясным современным словом.
- source_word: ἀνάγκαις
  choice: в нуждах
  rationale: В контексте слово обозначает вынужденные, тяжёлые обстоятельства и лишения; «нужды» сохраняет ёмкость исходного выражения.
- source_word: στενοχωρίαις
  choice: в тесноте
  rationale: Сохраняет образ человека, стеснённого со всех сторон тяжёлыми обстоятельствами, и отличает этот член перечня от бедствий и нужд.
theological_decisions:
- issue: Значение διάκονοι в контексте апостольского служения
  choice: служители Бога
  alternative: слуги Бога
  rationale: Текст определяет Павла и его сотрудников через их служение Богу, но сам по себе не требует ни значения формальной церковной должности, ни более сильной социальной окраски слова «слуги».
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского перечня. Повтор «в» сохранён, чтобы передать ритм и синтаксический рисунок оригинала; «теснота» выбрана как краткое и понятное образное обозначение крайней стеснённости обстоятельствами.
