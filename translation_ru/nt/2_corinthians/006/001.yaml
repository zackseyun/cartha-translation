  text: Συνεργοῦντες δὲ καὶ παρακαλοῦμεν μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: ru
  text: Сотрудничая с Ним[a], мы также призываем вас не принять Божью благодать напрасно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как соработники, мы также призываем вас». В греческом тексте не сказано прямо, с кем Павел сотрудничает, хотя контекст указывает прежде всего на Бога.'
    reason: alternative_reading
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: Сотрудничая с Ним
  rationale: Причастие сохраняет значение совместного действия. Дополнение «с Ним» вводится из ближайшего контекста, где речь идёт о примиряющем действии Бога и служении Павла (5:18–20), но грамматически в самом стихе оно не выражено, поэтому отмечено сноской.
- source_word: δὲ
  choice: —
  rationale: Слабая соединительно-переходная частица естественно передаётся самим ходом русской фразы без отдельного союза.
- source_word: καὶ
  choice: также
  rationale: 'Передаёт добавочное значение: к сотрудничеству присоединяется настойчивый призыв.'
- source_word: παρακαλοῦμεν
  choice: призываем
  rationale: Глагол обозначает настойчивое обращение или увещание; «призываем» ясно и естественно в современном литературном русском языке.
- source_word: μὴ εἰς κενὸν
  choice: не ... напрасно
  rationale: Греческое идиоматическое выражение означает «без результата», «без пользы»; «напрасно» сохраняет краткость и риторическую силу.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: Божью благодать
  rationale: «Благодать» сохраняет весомый для Павла смысл χάρις, а притяжательное прилагательное естественно передаёт греческий родительный падеж.
- source_word: δέξασθαι ὑμᾶς
  choice: вас не принять
  rationale: Аккузативно-инфинитивная конструкция после παρακαλοῦμεν естественно передаётся как «призываем вас не принять»; совершенный вид соответствует аористному инфинитиву, не превращая его в утверждение о завершённом действии.
theological_decisions:
- issue: Неуказанный участник совместного труда при Συνεργοῦντες
  choice: «Сотрудничая с Ним», где «Ним» контекстуально относится к Богу
  alternative: «Как соработники» или «сотрудничая» без указания, с кем именно
  rationale: Контекст 5:18–20 говорит о Божьем деле примирения и о Павле как Его посланнике, поэтому Бог — наиболее вероятный подразумеваемый участник. Поскольку исходный текст не называет Его прямо, подлинная неоднозначность сохранена в сноске.
- issue: Смысл принятия благодати «напрасно»
  choice: Сохранить напряжение исходной формулировки без догматического пояснения
  alternative: Истолковать выражение как утрату спасения, отсутствие плода или лишь внешнее принятие
  rationale: Стих сам не уточняет, каким именно образом принятие благодати оказывается безрезультатным; перевод не должен разрешать этот богословский вопрос за автора.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского призыва. Формулировка краткая и доступная; традиционный богословский термин «благодать» сохранён. Заглавная буква в «Ним» показывает контекстуальную отнесённость к Богу, тогда как сноска сохраняет грамматическую неоднозначность оригинала.
