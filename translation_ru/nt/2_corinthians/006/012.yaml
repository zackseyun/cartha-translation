  footnotes:
  - marker: a
    text: 'Буквально: «В нас вам не тесно, а тесно в ваших собственных внутренностях». «Внутренности» — образ глубоких чувств и расположения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στενοχωρεῖσθε
  choice: вам тесно
  rationale: Глагол передаёт образ пребывания в тесном пространстве и переносно означает внутреннюю стеснённость или ограниченность. Выражение «вам тесно» естественно сохраняет этот образ; повтор в обеих частях воспроизводит риторический контраст греческого текста.
- source_word: ἐν ἡμῖν
  choice: из-за нас
  rationale: Предлог ἐν буквально может означать «в», однако здесь выражение указывает, что Павел и его спутники не являются причиной стеснённости коринфян. «Из-за нас» ясно передаёт эту связь, а буквальная конструкция сохранена в сноске.
- source_word: δὲ
  choice: а
  rationale: Союз обозначает прямое противопоставление двух частей. В данной отрицательно-противительной конструкции русское «а» звучит естественнее, чем «но».
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: в ваших собственных сердцах
  rationale: σπλάγχνα буквально обозначает внутренности, а переносно — глубокие чувства и внутреннюю способность к расположению. «В сердцах» понятно современному читателю и сохраняет телесно-эмоциональный образ; «собственных» подчёркивает, что источник ограниченности находится в самих коринфянах.
- source_word: οὐ
  choice: не
  rationale: Прямо передаёт отрицание первой части.
theological_decisions:
- issue: Переносное значение σπλάγχνα
  choice: «в ваших собственных сердцах» как указание на внутренние чувства и расположение коринфян
  alternative: Буквальное «в ваших внутренностях» или абстрактное «в ваших чувствах»
  rationale: Контекст говорит об отношениях Павла с коринфянами. «Сердцах» передаёт внутреннюю эмоциональную сферу, не превращая выражение ни в буквальную анатомическую деталь, ни в отвлечённое психологическое понятие.
- issue: Значение ἐν ἡμῖν
  choice: Причинно-отношенческое «из-за нас»
  alternative: Формальное «в нас»
  rationale: Фраза противопоставляет отсутствие ограничения со стороны Павла внутренней стеснённости самих адресатов. При этом буквальная и более неоднозначная форма отмечена в сноске, чтобы не скрывать структуру оригинала.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости, параллелизма и метафоры тесного пространства. Повтор «вам тесно» намеренно воспроизводит повтор στενοχωρεῖσθε; порядок слов делает противопоставление причинно ясным.
