lexical_decisions:
- source_word: τὴν δὲ αὐτὴν ἀντιμισθίαν
  choice: В качестве такого же ответного дара
  rationale: Оборот требует соответствующего ответного действия. «Ответный дар» передаёт взаимность, не сводя речь к денежной плате; «такого же» отражает αὐτήν, а δέ естественно передано связью всего оборота с предыдущим контекстом без искусственного «теперь».
- source_word: ὡς τέκνοις λέγω
  choice: говорю как детям
  rationale: Сохраняет непредложное родственное обращение без добавления отсутствующего в греческом притяжательного «моим».
- source_word: πλατύνθητε
  choice: откройтесь широко
  rationale: Буквально глагол означает «станьте широкими, расширьтесь». В контексте речь об открытости в любви и принятии; возвратное «откройтесь» естественно по-русски и не добавляет прямо не названное слово «сердца».
- source_word: καὶ ὑμεῖς
  choice: и вы
  rationale: Передаёт взаимность и подчёркнутый призыв к коринфянам ответить такой же открытостью.
theological_decisions:
- issue: Следует ли явно назвать коринфян «моими детьми»
  choice: говорю как детям
  alternative: говорю как моим детям
  rationale: Родительская теплота очевидна из контекста, однако притяжательное местоимение в исходном тексте отсутствует.
- issue: Следует ли добавить слово «сердца» как объект раскрытия
  choice: откройтесь широко
  alternative: широко откройте сердца
  rationale: Предыдущий контекст позволяет подразумевать сердца, но данный стих их прямо не называет; основной текст сохраняет метафору и её некоторую открытость.
translation_notes:
  register: Современный литературный русский язык; интонация тёплого, но настойчивого апостольского призыва. Порядок с вводным пояснением между тире сохраняет риторическое движение греческой фразы.
