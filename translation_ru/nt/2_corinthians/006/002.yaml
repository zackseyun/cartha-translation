reference: 2 Corinthians 6:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: ru
  text: 'Ибо Он говорит: «В благоприятное время Я услышал тебя[a] и в день спасения помог тебе». Вот, сейчас — особенно благоприятное время; вот, сейчас — день спасения[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я благосклонно выслушал тебя». Глагол может обозначать не просто слышание, а принятие услышанного и готовность откликнуться.'
    reason: lexical_alternative
  - marker: b
    text: 'По смыслу возможно также усиленное прочтение: «сейчас — то самое благоприятное время; сейчас — тот самый день спасения». В греческом обе фразы стоят без артикля, а русский оборот без указательного слова допускает оба оттенка.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει γάρ
  choice: Ибо Он говорит
  rationale: γάρ поясняет предшествующий призыв, а настоящее λέγει вводит цитату как продолжающую звучать речь Бога. Личное «Он» сохраняет подразумеваемого говорящего, не заменяя его безличным «Писание говорит».
- source_word: Καιρῷ δεκτῷ
  choice: В благоприятное время
  rationale: καιρός обозначает подходящее, назначенное время, а δεκτός — время принятия и благоволения. «Благоприятное время» естественно передаёт оба оттенка по-русски.
- source_word: ἐπήκουσά σου
  choice: Я услышал тебя
  rationale: ἐπακούω означает услышать, прислушаться, нередко с подразумеваемым благосклонным откликом. «Услышал» сохраняет эту возможность, не сужая смысл до явно выраженного «ответил».
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: в день спасения
  rationale: Русский язык не имеет артиклей, поэтому естественное «в день спасения» не навязывает ни определённости, ни неопределённости греческому безартиклевому обороту.
- source_word: ἐβοήθησά σοι
  choice: помог тебе
  rationale: Прямое и современное соответствие глаголу βοηθέω — «помогать, приходить на помощь».
- source_word: ἰδοὺ
  choice: вот
  rationale: «Вот» сохраняет призыв обратить внимание и торжественную настойчивость повторения, оставаясь естественным для современного русского языка.
- source_word: νῦν
  choice: сейчас
  rationale: «Сейчас» ясно и непосредственно передаёт временное ударение νῦν и неотложность обращения Павла.
- source_word: καιρὸς εὐπρόσδεκτος
  choice: особенно благоприятное время
  rationale: εὐπρόσδεκτος выражает не просто приемлемость, а особую благоприятность и желанность. Наречие «особенно» отличает его от более простого δεκτός в цитате, не превращая выражение в превосходную степень.
- source_word: ἡμέρα σωτηρίας
  choice: день спасения
  rationale: Формулировка кратка, естественна и сохраняет безартиклевость исходного оборота без искусственного добавления «один» или «этот».
theological_decisions:
- issue: Определённость выражений «благоприятное время» и «день спасения»
  choice: Оставить русские обороты без указательных или неопределённых местоимений.
  alternative: «то самое благоприятное время / тот самый день спасения» либо «одно благоприятное время / один день спасения»
  rationale: В греческом обе заключительные именные группы без артикля. Русская форма без местоимения естественно сохраняет открытость вопроса об определённости и не навязывает фиксированную эсхатологическую схему.
- issue: Кто говорит в формуле λέγει γάρ
  choice: 'Передать лично: «Он говорит».'
  alternative: «Писание говорит» или безличное «сказано»
  rationale: Контекст цитаты допускает понимание Бога как говорящего через Писание. Личная форма сохраняет эту богословскую фактуру, не добавляя имени в основной текст.
- issue: Степень выраженности Божьего отклика в ἐπήκουσά σου
  choice: «Я услышал тебя».
  alternative: «Я ответил тебе» или «Я благосклонно выслушал тебя»
  rationale: Глагол допускает благосклонное слушание и последующий отклик, но прямо не требует перевода «ответил». Основной текст сохраняет смысловую напряжённость, а примечание указывает возможный оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавные местоимения «Он» и «Я» помогают ясно обозначить Бога как говорящего в цитате. Тире подчёркивает настойчивое «сейчас», а повтор «вот» сохраняет риторическую силу оригинала.
