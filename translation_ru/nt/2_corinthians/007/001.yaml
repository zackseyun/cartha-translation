id: 2CO.7.1
reference: 2 Corinthians 7:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας, ἀγαπητοί, καθαρίσωμεν ἑαυτοὺς ἀπὸ παντὸς μολυσμοῦ σαρκὸς καὶ πνεύματος, ἐπιτελοῦντες ἁγιωσύνην ἐν φόβῳ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/001.yaml
  text: Therefore[a], since we have these promises, beloved, let us cleanse ourselves from every defilement of flesh and spirit[c][b], bringing holiness to completion in the fear of God.
translation:
  language: ru
  text: Итак, возлюбленные, имея эти обещания, очистим себя от всякой скверны плоти и духа[a], доводя святость до совершенства в страхе Божьем[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от всякой нечистоты тела и духа».'
    reason: Лексически возможная передача μολυσμός и σαρκὸς более общеупотребительными словами.
  - marker: b
    text: «Страх Божий» здесь включает благоговейный трепет перед Богом, а не только ужас перед наказанием.
    reason: Поясняет смысл библейского выражения, сохраняя более сильное слово основного текста.
lexical_decisions:
- source_word: ταύτας οὖν ... τὰς ἐπαγγελίας
  choice: Итак ... эти обещания
  rationale: «Итак» передаёт вывод из предшествующих обетований, а «эти обещания» сохраняет указание на только что приведённые Божьи заверения.
- source_word: ἀγαπητοί
  choice: возлюбленные
  rationale: Сохраняет тёплое пастырское обращение и торжественный эпистолярный тон.
- source_word: καθαρίσωμεν ἑαυτοὺς
  choice: очистим себя
  rationale: Форма первого лица множественного числа передаёт включающий Павла и читателей призыв; контекст и «итак» поддерживают побудительное, а не простое будущее значение.
- source_word: ἀπὸ παντὸς μολυσμοῦ
  choice: от всякой скверны
  rationale: «Скверна» естественно передаёт нравственно-религиозный оттенок загрязнения и согласуется с последующим упоминанием святости.
- source_word: σαρκὸς καὶ πνεύματος
  choice: плоти и духа
  rationale: Буквальная пара сохраняет телесное и внутреннее измерения человека, не сводя σάρξ к специальному значению «греховная природа».
- source_word: ἐπιτελοῦντες ἁγιωσύνην
  choice: доводя святость до совершенства
  rationale: Передаёт процесс осуществления святости до полноты; деепричастный оборот сохраняет связь причастия с главным призывом.
- source_word: ἐν φόβῳ θεοῦ
  choice: в страхе Божьем
  rationale: Сохраняет вес и привычную библейскую форму выражения, не ослабляя φόβος до одного лишь уважения.
theological_decisions:
- issue: Значение σάρξ в сочетании «скверна плоти и духа»
  choice: плоть
  alternative: тело; греховная природа
  rationale: Противопоставление духу указывает на телесную сторону человеческой жизни. «Плоть» сохраняет исходную формулировку и не навязывает здесь специализированное значение «греховная природа».
- issue: Побудительная сила καθαρίσωμεν
  choice: очистим себя
  alternative: нам следует очистить себя; давайте очистим себя
  rationale: Греческий увещательный конъюнктив включает автора вместе с адресатами. Русская форма в данном контексте передаёт совместный призыв без разговорности.
- issue: Смысл φόβος перед Богом
  choice: страх Божий
  alternative: благоговение перед Богом
  rationale: Выражение подразумевает благоговейный трепет, однако более сильное слово «страх» сохраняет библейское напряжение и не сужает смысл.
- issue: Смысл завершения святости
  choice: доводя святость до совершенства
  alternative: совершенствуя святость; завершая освящение
  rationale: Фраза отражает ἐπιτελοῦντες как движение к полноте, не превращая ἁγιωσύνη в название отдельной конфессионально определяемой схемы освящения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к греческому, но остаётся естественным; «возлюбленные», «скверна» и «страх Божий» сохранены ради пастырского, нравственно-религиозного регистра.
