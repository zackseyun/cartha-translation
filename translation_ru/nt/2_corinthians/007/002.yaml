base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/002.yaml
  text: Make room for us[a]. We have wronged no one, corrupted no one[b], taken advantage of no one.
translation:
  language: ru
  text: Дайте нам место[a]. Мы никого не обидели, никого не погубили[b], никого не использовали в корыстных целях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Примите нас». Буквально: «Дайте нам место». Вероятно, это продолжение образа из 6:11–13, где говорится о тесноте и широте сердца.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «никого не развратили»; возможно также: «никого не испортили».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χωρήσατε
  choice: Дайте место в своих сердцах
  rationale: Аористный императив χωρέω здесь, с учётом 2 Кор 6:11–13, выражает призыв вновь принять Павла и его спутников в свои чувства и отношения. Русское «дайте место в своих сердцах» естественно передаёт образ, хотя слово «сердцах» восстановлено из ближайшего контекста и поэтому отмечено сноской.
- source_word: ἡμᾶς
  choice: нам
  rationale: Местоимение является прямым объектом греческого императива; в естественной русской конструкции «дать место кому-либо» передаётся дательным падежом.
- source_word: οὐδένα
  choice: никого
  rationale: Троекратное повторение сохранено, чтобы передать эмфатический риторический ряд греческого текста.
- source_word: ἠδικήσαμεν
  choice: не обидели
  rationale: ἀδικέω означает поступить несправедливо, причинить неправду или зло. «Обидели» кратко и естественно в данном личностном контексте, не уточняя вид причинённого вреда.
- source_word: ἐφθείραμεν
  choice: не погубили
  rationale: φθείρω допускает значения «губить», «развращать», «портить». «Погубили» сохраняет широкую и сильную семантику глагола, не сводя её исключительно к нравственному развращению или финансовой эксплуатации.
- source_word: ἐπλεονεκτήσαμεν
  choice: не использовали ради своей выгоды
  rationale: πλεονεκτέω обозначает корыстное использование, эксплуатацию или обман ради выгоды. Выбранная формулировка понятна современному читателю и сохраняет мотив личной выгоды, не ограничивая смысл финансовым мошенничеством.
theological_decisions:
- issue: Характер призыва Χωρήσατε ἡμᾶς
  choice: Призыв дать Павлу и его спутникам место в своих сердцах, то есть восстановить близость и принять их
  alternative: Более общий призыв «примите нас»
  rationale: Контекст 2 Кор 6:11–13 говорит о тесноте в чувствах коринфян и призывает их расшириться. Уточнение «в своих сердцах» естественно раскрывает этот образ, а сноска сохраняет буквальную форму и возможный более общий смысл.
- issue: Смысл ἐφθείραμεν
  choice: Широкое «не погубили»
  alternative: «Не развратили», «не испортили» или «не эксплуатировали»
  rationale: Греческий глагол может указывать на разрушительный, нравственный или иной вред. Основной текст не закрепляет исключительно нравственное либо имущественное толкование; варианты отражены в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены троекратное «никого» и параллельная структура отрицаний. Образ первого призыва раскрыт по ближайшему контексту, а буквальная формулировка и альтернативы вынесены в сноску.
