  - marker: b
    text: 'Или: «присутствием Тита».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Но
  rationale: Передаёт противопоставление предшествующему рассказу Павла о скорбях и страхах и естественно вводит Божье утешение.
- source_word: ὁ παρακαλῶν
  choice: утешающий
  rationale: Субстантивированное причастие характеризует постоянное действие Бога. «Утешающий» соответствует контексту скорби и сохраняет связь с однокоренным παρεκάλεσεν.
- source_word: τοὺς ταπεινοὺς
  choice: смиренных
  rationale: Слово может обозначать смиренных, униженных обстоятельствами или павших духом. «Смиренных» сохраняет широкий смысл, а сноска отмечает контекстуально возможные оттенки.
- source_word: παρεκάλεσεν
  choice: утешил
  rationale: Форма аориста обозначает совершившееся действие и повторяет корень παρακαλ-, поэтому перевод сохраняет лексическую связь с «утешающим».
- source_word: ἐν τῇ παρουσίᾳ
  choice: приходом
  rationale: παρουσία может означать присутствие либо прибытие. Здесь дальнейший контекст указывает на прибытие Тита, поэтому событийное значение естественно передано словом «приходом».
- source_word: Τίτου
  choice: Тита
  rationale: Общепринятая русская форма имени, поставленная в родительном падеже после слова «приходом».
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Явный субъект греческого предложения; русская конструкция сохраняет Бога как действующего и утешающего.
theological_decisions:
- issue: Значение τοὺς ταπεινοὺς в контексте
  choice: смиренных
  alternative: униженных; павших духом
  rationale: Греческое выражение допускает значение людей, занимающих низкое положение, униженных обстоятельствами или удручённых. Основной текст не сводит смысл исключительно к эмоциональной подавленности, а сноска сохраняет эту неоднозначность.
- issue: Значение παρουσία применительно к Титу
  choice: приходом
  alternative: присутствием
  rationale: Контекст говорит о прибытии Тита как о средстве Божьего утешения, но исходное слово также может обозначать его присутствие; альтернативный смысл сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. Повтор «утешающий — утешил» намеренно сохранён, чтобы передать повтор греческого корня παρακαλ-.
