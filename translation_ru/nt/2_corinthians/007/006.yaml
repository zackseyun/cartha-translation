base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/006.yaml
  text: But God[a], who comforts the humble[b], comforted us by the coming of Titus.
translation:
  language: ru
  text: Но Бог, утешающий смиренных[a], утешил нас приходом Тита[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «униженных»; или: «павших духом».'
