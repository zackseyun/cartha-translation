  text: διὰ τοῦτο παρακεκλήμεθα. Ἐπὶ δὲ τῇ παρακλήσει ⸀ἡμῶν περισσοτέρως μᾶλλον ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου, ὅτι ἀναπέπαυται τὸ πνεῦμα αὐτοῦ ἀπὸ πάντων ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/013.yaml
  text: For this reason we have been comforted[a]. And in addition to our comfort, we rejoiced even more abundantly at Titus’s joy[b], because his spirit has been refreshed by all of you.
translation:
  language: ru
  text: Поэтому мы утешились[a]. Вдобавок к нашему утешению мы ещё больше обрадовались радости Тита, потому что благодаря всем вам дух его обрёл покой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ободрились»; греческое слово может означать как утешение, так и ободрение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его дух был подкреплён». Буквально: «его дух обрёл отдых благодаря всем вам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Естественно передаёт причинно-следственную связь с предшествующим контекстом.
- source_word: παρακεκλήμεθα / παρακλήσει
  choice: мы утешились / утешения
  rationale: Сохраняет лексическую связь однокоренных греческих слов и их значение утешения в данном эмоционально-отношенческом контексте; возможный оттенок ободрения отмечен в сноске.
- source_word: Ἐπὶ δὲ τῇ παρακλήσει ἡμῶν
  choice: А сверх этого утешения
  rationale: 'Передаёт прибавочный смысл: к уже испытанному утешению присоединилась ещё большая радость.'
- source_word: περισσοτέρως μᾶλλον
  choice: ещё больше
  rationale: Естественно по-русски выражает усиление, создаваемое сочетанием двух сравнительных форм, без тяжеловесной буквальности.
- source_word: ἐπὶ τῇ χαρᾷ Τίτου
  choice: радости Тита
  rationale: После глагола «обрадовались» беспредложная конструкция естественно обозначает повод для радости и сохраняет повтор корня χαρ-.
- source_word: ἀναπέπαυται
  choice: дали отдых
  rationale: Передаёт результативное состояние совершенного вида и буквальный образ обретения покоя; идиоматический вариант «ободрили» указан в сноске.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: его духу
  rationale: Прямо сохраняет антропологический язык оригинала и ясно относит «дух» к внутреннему состоянию Тита.
- source_word: ἀπὸ πάντων ὑμῶν
  choice: все вы
  rationale: Передаёт источник или действующих лиц, благодаря которым дух Тита обрёл отдых, и сохраняет подчёркнутую всеобщность.
theological_decisions:
- issue: Значение πνεῦμα применительно к Титу
  choice: личный дух, внутреннее состояние Тита
  alternative: Святой Дух
  rationale: Местоимение αὐτοῦ («его») и контекст радости и успокоения Тита указывают на его собственный дух, а не на Святого Духа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Повтор «утешились / утешения» и «обрадовались / радости» намеренно сохраняет лексические связи оригинала. Формулировка «дали отдых его духу» сохраняет образ греческого текста, а сноска предлагает более идиоматичное прочтение.
