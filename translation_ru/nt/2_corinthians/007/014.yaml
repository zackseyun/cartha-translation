  source_fidelity: 'Вторая часть первого сравнения в черновике в целом передаёт смысл, но «было истиной» звучит неестественно по-русски и несколько превращает ἐν ἀληθείᾳ («в истине/правдиво») в отвлечённое свойство высказываний. «Было правдой» точнее и идиоматичнее передаёт, что сказанное Павлом соответствовало действительности. Остальные соответствия сохранены: пассивное «не был посрамлён», предмет похвалы — коринфяне, а Тит — её получатель в контексте.'
