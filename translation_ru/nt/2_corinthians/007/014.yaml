  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: ru
  text: Ведь если я хоть в чём-то хвалился вами перед ним, то не был посрамлён. Напротив, как всё, что мы говорили вам, было правдой, так и наша похвала перед Титом[a] оказалась правдой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наша похвала Титу». Греческое выражение допускает передачу как похвалы, высказанной перед Титом, так и похвалы, обращённой к нему; из контекста ясно, что Павел хвалил коринфян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Ведь
  rationale: Союз вводит пояснение к предыдущей мысли; «ведь» естественно передаёт эту связь в современном русском.
- source_word: εἴ τι ... κεκαύχημαι
  choice: если я хоть в чём-то хвалился
  rationale: Сохраняется условная конструкция и риторическая сила καυχάομαι; «хвалился» не предрешает, была ли такая похвала греховным тщеславием.
- source_word: αὐτῷ ὑπὲρ ὑμῶν
  choice: вами перед ним
  rationale: ὑπὲρ ὑμῶν указывает на коринфян как предмет похвалы, а αὐτῷ — на адресата, которым в контексте является Тит. Формулировка избегает тяжеловесного «хвалился ему о вас».
- source_word: οὐ κατῃσχύνθην
  choice: не был посрамлён
  rationale: 'Пассивная формулировка сохраняет смысл: похвала Павла не выставила его в ложном свете и не навлекла на него стыда.'
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν
  choice: всё, что мы говорили вам, было истиной
  rationale: Передаёт широкий охват πάντα и смысл ἐν ἀληθείᾳ, оставаясь естественным по-русски.
- source_word: ἡ καύχησις ἡμῶν
  choice: наша похвала
  rationale: Существительное «похвала» естественно соответствует ранее употреблённому глаголу «хвалился» и здесь означает похвальное высказывание Павла о коринфянах.
- source_word: ἡ ἐπὶ Τίτου
  choice: перед Титом
  rationale: Формально сохраняет значение высказывания, сделанного перед Титом или в его присутствии, не добавляя повторно уже ясное из первой части «вами».
- source_word: ἀλήθεια ἐγενήθη
  choice: оказалась истинной
  rationale: 'Естественно передаёт идиоматический смысл: последующие события подтвердили истинность похвалы.'
theological_decisions:
- issue: Характер похвалы Павла
  choice: Сохранено «хвалился / похвала» без отрицательной нравственной оценки.
  alternative: «гордился / уверенность»
  rationale: В данном контексте καυχάομαι и καύχησις обозначают обоснованную похвалу или уверенное одобрение, а не обязательно греховное самовосхваление. Контекст, а не переводческий термин, определяет её правомерность.
- issue: К кому относится похвала
  choice: Павел хвалился коринфянами перед Титом.
  alternative: Похвала относилась к самому Титу.
  rationale: Первая часть стиха прямо называет коринфян предметом похвалы (ὑπὲρ ὑμῶν), а Тита — её адресатом; это же естественно определяет смысл второй части.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Посрамлён» сохранено ради пассивного смысла и риторической выразительности; синтаксис упрощён настолько, чтобы стих оставался ясным обычному читателю, но параллелизм двух частей сохранён.
