  terminology: Последовательно сохранена связь между καυχάομαι («хвалился») и καύχησις («похвала»). «Похвала перед Титом» не добавляет в сам текст повторного «о вас», которое уже задано первой частью, а примечание поясняет контекстуально обусловленный объект похвалы.
