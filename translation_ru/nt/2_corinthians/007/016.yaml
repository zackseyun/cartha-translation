    issue: «могу быть уверен»
    rationale: Модальный глагол «могу» не имеет соответствия в θαρρῶ и ослабляет утверждение Павла об имеющейся у него уверенности.
  - severity: medium
    issue: 'Сноска: «уверен за вас»'
    rationale: Формулировка неестественна по-русски и может означать поручительство или ответственность за адресатов, а не уверенность относительно них.
