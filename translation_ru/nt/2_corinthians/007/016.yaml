  text: I rejoice that in every way I have confidence in you[a].
translation:
  language: ru
  text: Я радуюсь, что во всём уверен в вас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я радуюсь, потому что во всём уверен в вас».'
    reason: Союз ὅτι может вводить содержание радости («что») или передаваться с причинным оттенком («потому что»).
lexical_decisions:
- source_word: χαίρω
  choice: Я рад
  rationale: Настоящее время и личная форма переданы естественным современным русским выражением; «радуюсь» возможно, но здесь звучит менее идиоматично.
- source_word: ὅτι
  choice: что
  rationale: Союз естественно вводит содержание радости Павла, не исключая смыслового оттенка причины.
- source_word: ἐν παντί
  choice: во всём
  rationale: Кратко и естественно передаёт всеохватность греческого выражения, сохраняя его возможную связь как с уверенностью, так и с поведением адресатов.
- source_word: θαρρῶ
  choice: могу быть уверен
  rationale: Передаёт устойчивую уверенность Павла; модальное «могу» естественно выражает его готовность полагаться на коринфян, не сводя глагол лишь к внутренней смелости.
- source_word: ἐν ὑμῖν
  choice: в вас
  rationale: Сохраняет образ уверенности, обращённой к адресатам, и близко следует греческому предлогу ἐν; вариант «за вас» был бы более идиоматичным, но менее формально близким.
