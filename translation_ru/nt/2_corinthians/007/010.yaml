    issue: Не вполне естественная сочетаемость «печаль, согласная с Божьей волей».
    rationale: Прилагательное «согласный» обычно относится к людям, мнениям или действиям; «соответствующая Божьей воле» звучит в современном литературном русском естественнее при том же смысловом охвате κατὰ θεόν.
  - severity: medium
    issue: «Не вызывающее сожаления» неточно передаёт ἀμεταμέλητον.
    rationale: Греческое прилагательное означает «не подлежащее сожаления / такое, о котором не приходится сожалеть», а не прежде всего «не вызывающее» сожаления. Уточнённая формулировка передаёт это значение без сужения неоднозначной синтаксической связи.
