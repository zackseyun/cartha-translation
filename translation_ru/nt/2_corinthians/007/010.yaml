  text: ἡ γὰρ κατὰ θεὸν λύπη μετάνοιαν εἰς σωτηρίαν ἀμεταμέλητον ⸀ἐργάζεται· ἡ δὲ τοῦ κόσμου λύπη θάνατον κατεργάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
translation:
  language: ru
  text: Ведь печаль, соответствующая Божьей воле,[a] производит покаяние, ведущее ко спасению, о котором не приходится сожалеть;[b] а печаль этого мира производит смерть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «печаль по Богу»; также: «печаль, сообразная с Богом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «производит покаяние, ведущее к спасению, о котором не приходится сожалеть». Греческое прилагательное может быть понято как относящееся непосредственно к покаянию или к спасению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ θεὸν
  choice: согласная с Божьей волей
  rationale: Оборот обозначает печаль, сообразную с Богом и Его мерой; такой перевод понятен современному читателю и не приписывает печали самостоятельную «божественность».
- source_word: λύπη
  choice: печаль
  rationale: «Печаль» естественно передаёт эмоционально-нравственный смысл слова и позволяет сохранить повтор и противопоставление двух видов печали.
- source_word: μετάνοιαν
  choice: покаяние
  rationale: Здесь речь идёт не просто о перемене мнения, а о нравственно-духовном обращении; «покаяние» является точным и общепонятным русским соответствием.
- source_word: εἰς σωτηρίαν
  choice: ведущее ко спасению
  rationale: Предлог εἰς выражает направленность или результат. Формулировка сохраняет эту связь, не определяя сверх текста механизм отношения покаяния к спасению.
- source_word: ἀμεταμέλητον
  choice: не вызывающее сожаления
  rationale: Прилагательное означает то, о чём не приходится сожалеть. В основном тексте оно синтаксически отнесено к покаянию, а возможная связь со спасением отмечена в сноске.
- source_word: ἐργάζεται / κατεργάζεται
  choice: производит
  rationale: Оба глагола выражают достижение результата. Одинаковый перевод сохраняет риторический параллелизм двух частей стиха.
- source_word: τοῦ κόσμου
  choice: этого мира
  rationale: Родительный оборот противопоставлен κατὰ θεόν. «Печаль этого мира» звучит естественно и передаёт принадлежность к нынешнему миру без лишнего уточнения.
- source_word: θάνατον
  choice: смерть
  rationale: Прямой перевод сохраняет широту исходного слова и не решает без достаточных оснований, имеется ли в виду исключительно духовная, телесная или окончательная смерть.
theological_decisions:
- issue: Противопоставление двух видов печали
  choice: «печаль, согласная с Божьей волей» и «печаль этого мира»
  alternative: «печаль по Богу» и «мирская печаль»
  rationale: Перевод передаёт противопоставление сообразной Богу печали и печали, принадлежащей миру, но не сужает значение последующей «смерти» до одного богословского смысла.
- issue: Связь покаяния со спасением
  choice: «покаяние, ведущее ко спасению»
  alternative: «покаяние для спасения» или «покаяние, результатом которого становится спасение»
  rationale: Формулировка выражает направленность εἰς σωτηρίαν, не превращая стих в более узкое конфессиональное утверждение о причинном механизме спасения.
- issue: К чему относится ἀμεταμέλητον
  choice: В основном тексте — к покаянию; неоднозначность отмечена в сноске
  alternative: Отнести непосредственно к спасению
  rationale: По форме прилагательное может согласовываться как с μετάνοιαν, так и с σωτηρίαν; ближайший смысловой разбор связывает его с покаянием, но исходную неоднозначность нельзя скрывать.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Повтор «печаль… печаль» и «производит… производит» сохранён ради параллелизма оригинала; богословски значимая неоднозначность ἀμεταμέλητον вынесена в сноску.
