source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: ru
  text: 'и не только его приходом[a], но и тем утешением[b], которое он получил благодаря вам: он сообщил нам о вашей тоске, вашей скорби[c] и вашем рвении ради меня, так что я обрадовался ещё больше.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его присутствием» или «его прибытием».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ободрением». Соответствующее греческое слово может означать как утешение, так и ободрение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вашем плаче» или «вашем оплакивании».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρουσίᾳ
  choice: приходом
  rationale: В контексте возвращения Тита слово обозначает его прибытие; «приход» естественно передаёт событийный смысл, тогда как «присутствие» остаётся возможной альтернативой.
- source_word: παρακλήσει / παρεκλήθη
  choice: утешением / получил
  rationale: «Утешение» соответствует эмоциональному контексту главы. Во второй части выражение перестроено по-русски как «которое он получил», чтобы избежать тяжеловесного «которым он был утешен»; связь с существительным остаётся ясной.
- source_word: ἐφ’ ὑμῖν
  choice: благодаря вам
  rationale: 'Передаёт основание или повод утешения Тита: отклик коринфян принёс ему утешение. Формулировка не уточняет, утешили ли они его непосредственно или своим состоянием и поведением.'
- source_word: ἀναγγέλλων
  choice: Он рассказал
  rationale: Причастие развёрнуто в отдельное предложение для естественного русского синтаксиса; оно указывает, каким образом Павел узнал об их отклике.
- source_word: ἐπιπόθησιν
  choice: как вы тоскуете
  rationale: Передаёт сильное стремление и эмоциональную направленность, не добавляя отсутствующего в греческом тексте объекта.
- source_word: ὀδυρμόν
  choice: как скорбите
  rationale: Слово обозначает глубокую, выраженную скорбь; «скорбите» понятно современному читателю, а более буквальное «оплакивание» отмечено в сноске.
- source_word: ζῆλον ὑπὲρ ἐμοῦ
  choice: как ревностно стоите за меня
  rationale: 'Сохраняет силу ζῆλος и широкую направленность ὑπέρ: горячую преданность Павлу и готовность выступить в его поддержку.'
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: так что я обрадовался ещё больше
  rationale: Ясно передаёт результат и сравнительное значение μᾶλλον.
theological_decisions:
- issue: Направленность выражения ζῆλον ὑπὲρ ἐμοῦ
  choice: ревностно стоите за меня
  alternative: ревнуете обо мне / проявляете рвение ради меня
  rationale: Выбранная формулировка выражает усердную поддержку Павла, но не вводит узкого конфессионального или доктринального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского письма. Длинный греческий период разделён на два предложения для ясности; эмоциональная последовательность «тоска — скорбь — ревностная поддержка» сохранена.
