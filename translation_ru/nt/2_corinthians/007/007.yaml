  source_fidelity: 'В целом смысл передан точно: прибытие Тита, его утешение в связи с коринфянами, его сообщение Павлу и результат — большая радость Павла. Однако «ревностно стоите за меня» чрезмерно конкретизирует ζῆλον ὑπὲρ ἐμοῦ как активную защиту Павла. Греческое выражение шире и говорит об их рвении, направленном к его благу.'
  naturalness: Текст звучит современно и ясно. Перевод трёх существительных придаточными («как вы тоскуете...»), хотя и допустим, несколько ослабляет параллелизм исходного перечисления. Именное перечисление делает фразу более собранной и естественно передаёт структуру греческого текста.
