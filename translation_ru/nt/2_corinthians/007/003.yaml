source:
  edition: SBLGNT
  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: ru
  text: Не для того, чтобы осудить вас, говорю это[a], ведь я уже говорил, что вы — в наших сердцах, чтобы вместе умереть и вместе жить[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не для осуждения говорю это»; возможен также смысл: «Говорю это не с целью осудить вас».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «так что вместе умереть и вместе жить». Греческая конструкция может выражать цель или результат, а оба глагола подчёркивают совместность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν οὐ λέγω
  choice: Не для того, чтобы осудить вас, говорю это
  rationale: Оборот πρός с винительным κατάκρισιν указывает на цель или направленность. Естественная русская формулировка передаёт отрицание намерения осудить; «вас» и «это» восстанавливаются из ближайшего контекста.
- source_word: προείρηκα
  choice: я уже говорил
  rationale: Перфект обозначает ранее сказанное, сохраняющее силу в настоящем; «уже говорил» естественно передаёт эту связь.
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: вы — в наших сердцах
  rationale: Сохранено множественное число «сердцах», относящееся к Павлу и его сотрудникам, а также образ глубокой внутренней привязанности.
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: чтобы вместе умереть и вместе жить
  rationale: Конструкция εἰς τὸ с инфинитивами допускает целевое или результативное понимание; повтор «вместе» передаёт приставку συν- в обоих параллельных глаголах и подчёркивает солидарность.
theological_decisions:
- issue: Следует ли уточнять, что совместные смерть и жизнь означают заветную верность, участие во Христе или иной технический вид единства
  choice: Сохранить широкое выражение взаимной солидарности без богословского уточнения
  alternative: Передать фразу как явную ссылку на заветную верность или участие во Христе
  rationale: Сам стих выражает глубокую привязанность и готовность разделить смерть и жизнь, но не называет конкретной богословской категории.
translation_notes:
  register: Современный литературный русский язык с достоинством и эмоциональной теплотой. Инверсия в начале сохраняет акцент греческого текста на том, что Павел не намерен осуждать адресатов; тире слегка выделяет образ пребывания в сердцах.
