    rationale: В современном русском «ревность» обычно означает jealousy и может быть ошибочно понята; σπουδή здесь означает усердие, серьёзную готовность, деятельное старание. Кроме того, далее ζῆλος уже уместно передан словом «рвение».
  - severity: medium
    issue: «Стремление восстановить справедливость» для ἐκδίκησις
    rationale: Формулировка добавляет значение намерения («стремление») и конкретизирует действие как восстановление справедливости. Греческое существительное допускает более компактные значения «взыскание», «наказание», «воздаяние», «правосудие»; объект и точная форма действия не названы.
