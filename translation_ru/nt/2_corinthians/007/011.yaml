  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: ru
  text: Ведь посмотрите, какое усердие произвела в вас сама эта печаль, согласная с Божьей волей[a], какое оправдание[b], какое негодование, какой страх, какое горячее желание, какое рвение и какое взыскание[c]! Во всём вы показали себя чистыми в этом деле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «печаль по Богу»; также возможно: «богоугодная печаль».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «защита»; возможно, речь идёт о стремлении снять с себя обвинение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «наказание», «воздаяние» или «правосудие»; слово может обозначать решительные меры в ответ на проступок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Ведь посмотрите
  rationale: «Ведь» передаёт пояснительное γάρ, а «посмотрите» — призыв ἰδού обратить внимание на очевидные результаты.
- source_word: τὸ κατὰ θεὸν λυπηθῆναι
  choice: сама эта печаль по Божьей воле
  rationale: Субстантивированное λυπηθῆναι передано существительным «печаль», αὐτὸ — усилением «сама эта», а κατὰ θεόν — понятным современным выражением, сохраняющим соотнесённость печали с Божьей волей.
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: какую ревность произвела в вас
  rationale: κατεργάζομαι обозначает достижение или произведение результата; σπουδή здесь — серьёзная, деятельная ревность, вызванная печалью.
- source_word: ἀλλὰ
  choice: а также / перечисление с «какое»
  rationale: Повторное ἀλλά имеет здесь усилительно-присоединительный, а не резко противопоставительный смысл. Русское перечисление сохраняет нарастающую риторику без неестественного многократного «но».
- source_word: ἀπολογίαν
  choice: оправдание
  rationale: Слово обозначает ответ в свою защиту и стремление снять с себя обвинение или показать правильность своей позиции; возможный оттенок раскрыт в сноске.
- source_word: ἀγανάκτησιν
  choice: негодование
  rationale: Передаёт сильное нравственное возмущение, не уточняя, на кого или на что оно направлено.
- source_word: φόβον
  choice: страх
  rationale: Объект страха в греческом тексте не назван, поэтому перевод не определяет его как страх перед Богом, Павлом или последствиями.
- source_word: ἐπιπόθησιν
  choice: горячее желание
  rationale: Передаёт напряжённое стремление или тоскующее желание, не добавляя прямо не названный объект.
- source_word: ζῆλον
  choice: рвение
  rationale: Сохраняет значение горячей деятельной заинтересованности и отличает ζῆλος от более раннего σπουδή, переведённого как «ревность».
- source_word: ἐκδίκησιν
  choice: стремление восстановить справедливость
  rationale: В контексте речь идёт о решительном исправлении положения и должном ответе на проступок; формулировка не сводит значение исключительно к карательному возмездию.
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς
  choice: Во всём вы показали себя чистыми
  rationale: συνίστημι имеет доказательный смысл «показать, подтвердить», а ἁγνούς сохраняется как «чистыми», без чрезмерного уточнения характера их невиновности.
- source_word: τῷ πράγματι
  choice: в этом деле
  rationale: Нейтрально передаёт отношение к обсуждаемому случаю, не уточняя сверх текста его юридический или нравственный статус.
theological_decisions:
- issue: Значение κατὰ θεόν
  choice: по Божьей воле
  alternative: по Богу; угодная Богу; соответствующая Богу
  rationale: Основной вариант понятен современному читателю и выражает согласованность печали с Божьей волей, но не называет Бога непосредственной причиной этой печали. Более буквальная конструкция сохранена в сноске.
- issue: Смысл ἐκδίκησις в контексте покаяния
  choice: стремление восстановить справедливость
  alternative: наказание; возмездие; взыскание
  rationale: Контекст подчёркивает деятельный отклик коринфян и исправление положения. Перевод избегает идеи личной мести, но сноска сохраняет возможный карательный оттенок.
- issue: Чистота коринфян в отношении случившегося
  choice: показали себя чистыми в этом деле
  alternative: доказали свою невиновность в этом деле
  rationale: Буквальное «чистыми» оставляет открытым, означает ли это полную непричастность к проступку или надлежащий отклик и устранение соучастия после обличения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным синтаксисом. Риторическое накопление исходного текста сохранено повторением форм «какое/какой», тогда как многократное ἀλλά передано естественным русским перечислением. Неуказанные в греческом тексте объекты страха, желания и негодования не добавлены.
