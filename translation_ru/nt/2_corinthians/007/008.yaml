  source_fidelity: 'Основной смысл передан точно: λυπέω последовательно отражено как «опечалить», μεταμέλομαι — как «жалеть», а πρὸς ὥραν — как «ненадолго». Уступительные конструкции и риторический переход от нынешнего отсутствия сожаления к прежнему сохранены. Однако «прежде» несколько неопределённо добавляет временной оттенок, тогда как несовершенный аорист? греческий imperfect μετεμελόμην прежде всего обозначает прошлое/продолжавшееся состояние сожаления, без необходимости маркировать его как просто «прежде».'
