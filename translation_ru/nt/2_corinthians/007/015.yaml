  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: ru
  text: И его сердечная привязанность к вам ещё сильнее, когда он вспоминает о послушании всех вас — о том, как вы приняли его со страхом и трепетом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с благоговением и трепетом». Выражение «страх и трепет» у Павла может обозначать серьёзное, смиренное и почтительное отношение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: любовь
  rationale: Буквально слово обозначает внутренности, но в данном контексте — глубокую сердечную привязанность. «Любовь» естественно звучит по-русски и передаёт силу чувства, не создавая буквальной неясности.
- source_word: περισσοτέρως
  choice: становится ещё сильнее
  rationale: Сравнительное наречие усиливает степень чувства Тита. Такая формулировка ясно передаёт, что воспоминание об отношении коринфян ещё более усиливает его любовь к ним.
- source_word: εἰς ὑμᾶς
  choice: к вам
  rationale: Предлог указывает направленность чувства на коринфян; «к вам» — естественное русское сочетание с существительным «любовь».
- source_word: ἀναμιμνῃσκομένου
  choice: когда он вспоминает
  rationale: Причастная конструкция обозначает сопутствующее обстоятельство, связанное с усилением чувства. Настоящее время сохраняет аспект воспоминания без излишней тяжеловесности.
- source_word: ὑπακοήν
  choice: послушании
  rationale: Прямое значение существительного — послушание. В контексте оно обозначает готовность коринфян откликнуться на апостольское наставление, но перевод не подменяет это значение более толковательным словом.
- source_word: πάντων ὑμῶν
  choice: всех вас
  rationale: Фраза подчёркивает всю общину; «всех вас» точно и естественно сохраняет этот охват.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: со страхом и трепетом
  rationale: Сохранён узнаваемый павловский оборот, передающий серьёзность, смирение и благоговейную отзывчивость; возможный оттенок значения пояснён в сноске.
- source_word: ἐδέξασθε
  choice: вы приняли
  rationale: Глагол может означать как принятие, так и радушный приём. «Приняли» сохраняет эту смысловую широту и не усиливает заранее оттенок гостеприимства.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение сохранено вслед за греческим текстом; из ближайшего контекста ясно, что речь идёт о Тите.
theological_decisions:
- issue: Смысл выражения «страх и трепет» при описании того, как коринфяне приняли Тита
  choice: Сохранить в основном тексте буквальный павловский оборот «со страхом и трепетом»
  alternative: «С благоговением и трепетом»
  rationale: Контекст указывает не обязательно на панический страх, а на серьёзное, смиренное и почтительное отношение. Однако буквальная формула сохраняет присущую выражению напряжённость, тогда как вероятный идиоматический смысл поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис плавный и понятный, тон достойный. «Любовь» выбрана вместо буквальных «внутренностей» и менее естественного «сердечного расположения». Маркер сноски поставлен непосредственно после поясняемого выражения.
