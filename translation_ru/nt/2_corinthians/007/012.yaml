  source_fidelity: Текст точно передаёт уступительно-выводную связку ἄρα εἰ καί, прошедшее ἔγραψα и трёхчастное противопоставление причин/цели. «Тот, кто поступил несправедливо» и «тот, с кем поступили несправедливо» сохраняют соответственно активное и пассивное значения причастий без исторической конкретизации. «Ваше усердие ради нас» соответствует чтению SBLGNT τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν; «среди вас» является допустимой естественной передачей трудного πρὸς ὑμᾶς и согласуется с английской аудиторской редакцией.
  naturalness: Русская фраза литературна, ясна и сохраняет возвышенный, но не архаичный регистр. Повтор «не ради того… и не ради того… но для того» удачно воспроизводит риторику оригинала. «Обнаружилось» несколько книжное, однако в данном регистре естественно и хорошо передаёт становление явным.
  terminology: «Усердие» — подходящий широкий эквивалент σπουδή; «перед Богом» точно и традиционно передаёт ἐνώπιον τοῦ θεοῦ. Термины не навязывают конфессионального истолкования.
