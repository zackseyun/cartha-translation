source:
  edition: SBLGNT
  text: ἄρα εἰ καὶ ἔγραψα ὑμῖν, οὐχ ⸀ἕνεκεν τοῦ ἀδικήσαντος, ⸀οὐδὲ ⸁ἕνεκεν τοῦ ἀδικηθέντος, ἀλλ’ ⸀1ἕνεκεν τοῦ φανερωθῆναι τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: ru
  text: Поэтому, хотя я и написал вам, не ради того, кто поступил несправедливо, и не ради того, с кем поступили несправедливо, но для того, чтобы перед Богом среди вас обнаружилось ваше усердие ради нас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «чтобы перед Богом среди вас обнаружилось наше усердие ради вас».'
    reason: textual_variant
lexical_decisions:
- source_word: ἄρα εἰ καὶ
  choice: Поэтому, хотя ... и
  rationale: «Поэтому» передаёт выводное ἄρα, а естественная русская конструкция «хотя ... и» сохраняет уступительное значение εἰ καὶ.
- source_word: ἔγραψα ὑμῖν
  choice: я и написал вам
  rationale: Аорист указывает на предшествующее письмо Павла; простое прошедшее время естественно в русском контексте.
- source_word: οὐχ ἕνεκεν τοῦ ἀδικήσαντος
  choice: не ради того, кто поступил несправедливо
  rationale: Сохраняется конструкция цели или основания с ἕνεκεν и глагольный характер субстантивированного причастия ἀδικήσαντος без уточнения характера проступка.
- source_word: οὐδὲ ἕνεκεν τοῦ ἀδικηθέντος
  choice: и не ради того, с кем поступили несправедливо
  rationale: Формулировка параллельна предыдущей и ясно передаёт пассивное значение ἀδικηθέντος.
- source_word: ἀλλ’ ἕνεκεν τοῦ φανερωθῆναι
  choice: но для того, чтобы ... обнаружилось
  rationale: 'Передаёт цель, выраженную ἕνεκεν с артиклевым инфинитивом, и сохраняет пассивно-непереходный смысл φανερωθῆναι: усердие должно стать явным.'
- source_word: τὴν σπουδὴν ὑμῶν
  choice: ваше усердие
  rationale: σπουδή обозначает серьёзное рвение, усердие или деятельную заботу; «усердие» кратко, понятно и не сужает значение до одного чувства.
- source_word: τὴν ὑπὲρ ἡμῶν
  choice: ради нас
  rationale: Передаёт направленность усердия в пользу Павла и его сотрудников, не придавая ὑπέρ чрезмерно технического оттенка.
- source_word: πρὸς ὑμᾶς
  choice: среди вас
  rationale: В трудной синтаксической конструкции выражение понимается как сфера, в которой усердие становится явным. Такая передача естественна по-русски и сохраняет неоднозначность связи слов.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: перед Богом
  rationale: Традиционная и ясная формулировка, передающая Божье присутствие и свидетельство.
theological_decisions:
- issue: Смысл синтаксически трудной фразы τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς
  choice: «чтобы перед Богом среди вас обнаружилось ваше усердие ради нас»
  alternative: «чтобы перед Богом среди вас обнаружилось наше усердие ради вас»; либо «чтобы ваше усердие ради нас стало явным вам»
  rationale: 'Основной текст следует напечатанному чтению SBLGNT: ὑμῶν — «ваше», ὑπὲρ ἡμῶν — «ради нас». Необычное πρὸς ὑμᾶς передано как «среди вас», не устраняя полностью синтаксическое напряжение. Значимое разночтение вынесено в сноску.'
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской речи. Повтор «не ради ... и не ради ... но для того» сохраняет риторическое противопоставление оригинала. Более тяжеловесные слова «обидчик» и «пострадавший» не использованы, чтобы не конкретизировать природу проступка сверх греческого текста.
