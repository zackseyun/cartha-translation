  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πολλή μοι παρρησία πρὸς ὑμᾶς, πολλή μοι καύχησις ὑπὲρ ὑμῶν· πεπλήρωμαι τῇ παρακλήσει, ὑπερπερισσεύομαι τῇ χαρᾷ ἐπὶ πάσῃ τῇ θλίψει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: ru
  text: Я с полной откровенностью обращаюсь к вам[a] и весьма хвалюсь вами. Я полон ободрения[b] и переполнен радостью при всех наших скорбях[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с большой смелостью» или «с полной открытостью». Греческое слово может обозначать уверенную свободу и откровенность речи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «утешения». Греческое слово включает как утешение, так и укрепляющее ободрение.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «несмотря на все наши скорби». Греческий оборот может описывать радость, изобилующую посреди скорби.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: откровенность
  rationale: Слово обозначает свободу, смелость и открытость речи. В сочетании с πρὸς ὑμᾶς здесь естественно передать мысль как откровенное обращение Павла к коринфянам, не ограничивая значение одной лишь внутренней уверенностью.
- source_word: πρὸς ὑμᾶς
  choice: с вами
  rationale: Предлог выражает направленность или отношение. В русском сочетание «говорю с вами с большой откровенностью» естественно передаёт открытую позицию Павла по отношению к адресатам.
- source_word: καύχησις
  choice: хвалюсь
  rationale: Сохраняет характерную для Павла лексику похвалы и хваления, не смягчая её до одной лишь гордости; контекст показывает положительный смысл.
- source_word: ὑπὲρ ὑμῶν
  choice: вами
  rationale: ὑπέρ с родительным может означать «о, относительно, в пользу». Русское «хвалюсь вами» кратко и естественно выражает похвалу коринфянам и приписывает им заслугу.
- source_word: πεπλήρωμαι
  choice: я исполнен
  rationale: Перфект пассивного залога указывает на достигнутое состояние, продолжающееся в настоящем; «исполнен» сохраняет образ наполненности.
- source_word: παρακλήσει
  choice: ободрения
  rationale: παράκλησις охватывает как утешение, так и укрепляющее ободрение. В контексте скорби и доброй вести ободрение удачно передаёт эту широту, а альтернативный оттенок отмечен в сноске.
- source_word: ὑπερπερισσεύομαι
  choice: переполнен
  rationale: Усиленный глагол выражает чрезвычайное изобилие. «Переполнен радостью» звучит естественно и сохраняет образ избытка.
- source_word: χαρᾷ
  choice: радостью
  rationale: Прямое и естественное соответствие χαρά.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: среди всех наших скорбей
  rationale: Оборот представляет радость как существующую и избыточествующую посреди продолжающихся страданий. «Среди» сохраняет одновременность радости и скорбей, не превращая связь однозначно в уступительную.
- source_word: πολλή ... πολλή
  choice: с большой ... много
  rationale: 'Повтор подчёркивает степень и изобилие. Разные, но идиоматичные русские формы обусловлены сочетаемостью: «большая откровенность» и «много хвалюсь».'
theological_decisions:
- issue: Положительное употребление Павлом слова καύχησις
  choice: «хвалюсь вами»
  alternative: «горжусь вами» или «уверен в вас»
  rationale: «Хвалюсь» сохраняет выраженную греческую риторику хваления, не навязывая ей значения греховного самовозвышения; положительный характер определяется контекстом.
- issue: Соотношение радости и скорби
  choice: «переполнен радостью среди всех наших скорбей»
  alternative: «переполнен радостью, несмотря на все наши скорби»
  rationale: 'Основной текст сохраняет богословское и эмоциональное напряжение: радость не отменяет скорби, но существует посреди неё. Уступительное прочтение возможно и отмечено в сноске, однако не внесено в текст как единственное.'
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет нарастающую эмоциональную силу оригинала; лексика «исполнен» и «скорби» слегка возвышенна, но общеупотребительна в библейском контексте.
