base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: ru
  text: Теперь я радуюсь — не потому, что вы были опечалены, а потому, что ваша печаль привела вас к покаянию. Ведь ваша печаль была угодна Богу[a], чтобы ни в чём не понести ущерба от нас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по Богу»; «так, как угодно Богу»; букв.: «согласно Богу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не потерпеть никакого вреда из-за нас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν χαίρω
  choice: Теперь я радуюсь
  rationale: Сохраняет временное противопоставление νῦν и несколько возвышенную глагольную форму χαίρω.
- source_word: ἐλυπήθητε
  choice: вы были опечалены / ваша печаль
  rationale: Основная форма сохраняет страдательность греческого глагола; при повторе естественная русская номинализация передаёт тот же смысл без тяжеловесности.
- source_word: εἰς μετάνοιαν
  choice: ваша печаль привела вас к покаянию
  rationale: Передаёт направленность и результат εἰς, а μετάνοια в данном нравственно-духовном контексте естественно и точно переводится как «покаяние».
- source_word: κατὰ θεόν
  choice: по Божьей воле
  rationale: Естественное русское выражение, обозначающее печаль, соответствующую Богу и Его воле, без сведения смысла только к эмоциональному качеству.
- source_word: ἵνα ἐν μηδενὶ ζημιωθῆτε
  choice: чтобы ни в чём не понести ущерба
  rationale: Сохраняет целевое значение ἵνα, неопределённо-широкое ἐν μηδενί и смысл потери или ущерба в ζημιόω.
- source_word: ἐξ ἡμῶν
  choice: от нас
  rationale: Прямо передаёт значение источника в ἐξ, сохраняя возможную неоднозначность причинной связи.
theological_decisions:
- issue: Значение μετάνοιαν
  choice: покаяние
  alternative: перемена мыслей / изменение образа мыслей
  rationale: В контексте вызванной апостольским письмом нравственно-духовной реакции слово означает не просто интеллектуальную перемену, а покаянный поворот; традиционный русский термин точен и понятен.
- issue: Характер печали в κατὰ θεόν
  choice: по Божьей воле
  alternative: по Богу / угодным Богу образом / благочестивой печалью
  rationale: Фраза сохраняет отношение печали к Божьему мерилу или намерению, не превращая выражение в наименование особого вида эмоции. Альтернативы отмечены в сноске.
- issue: Смысл ἐξ ἡμῶν
  choice: от нас
  alternative: из-за нас / по нашей вине
  rationale: Буквальное указание на источник не решает преждевременно, идёт ли речь о причинённом апостолами вреде или об ущербе в их служении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апостольским тоном. Повтор корня «печаль/опечалены» поддерживает риторику оригинала, а конструкция «привела вас к покаянию» естественно передаёт греческое направление к результату.
