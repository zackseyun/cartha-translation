base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/005.yaml
  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: ru
  text: 'Ведь и когда мы пришли в Македонию, наша плоть не знала никакого покоя[a], но мы со всех сторон терпели бедствия: извне — борьба, внутри — страхи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы сами не знали покоя». Буквально по-гречески: «наша плоть не имела никакого покоя»; здесь «плоть» указывает на человека в его телесной слабости и переживаемых бедствиях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Ведь и
  rationale: Передаёт пояснительную связь с предыдущей мыслью и лёгкое усиление, естественно звуча по-русски.
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: когда мы пришли в Македонию
  rationale: Родительный самостоятельный оборот выражает время; русская придаточная конструкция ясно и естественно передаёт этот смысл.
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: не имела никакого покоя
  rationale: ἄνεσις означает покой, облегчение или передышку от давления; «никакого покоя» сохраняет категоричность οὐδεμίαν и подходит контексту.
- source_word: ἡ σὰρξ ἡμῶν
  choice: плоть наша
  rationale: Сохранён буквальный образ, указывающий здесь на телесное, уязвимое человеческое существование, а не на нравственно греховное начало. Инверсия придаёт выражению достоинство и делает его приемлемым в современном литературном русском.
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: но мы были стеснены со всех сторон
  rationale: Пассивное причастие θλιβόμενοι передаёт давление и тяготы; «со всех сторон» естественно выражает всеохватность ἐν παντί и подводит к противопоставлению внешнего и внутреннего.
- source_word: ἔξωθεν μάχαι
  choice: извне — столкновения
  rationale: μάχαι может обозначать схватки, распри и конфликты. «Столкновения» сохраняет широту смысла и не ограничивает речь буквальными боями.
- source_word: ἔσωθεν φόβοι
  choice: внутри — страхи
  rationale: Краткая параллельная формулировка точно сохраняет контраст ἔξωθεν/ἔσωθεν и множественное число φόβοι.
theological_decisions:
- issue: Значение σάρξ
  choice: плоть наша
  alternative: мы сами; наше тело
  rationale: В данном контексте σάρξ обозначает человека в его телесной слабости и подверженности страданию, а не «греховную природу». Буквальный образ сохранён в тексте, а идиоматический смысл разъяснён в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Параллелизм «извне — столкновения, внутри — страхи» сохранён, как и незавершённо-напряжённый ритм исходной фразы.
