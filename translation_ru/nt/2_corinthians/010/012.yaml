  - severity: low
    issue: Числовое несоответствие в «кто сам себя рекомендует».
    rationale: Греческое ἑαυτούς имеет множественное число и относится к группе саморекомендующих себя людей; «кто рекомендует самих себя» передаёт это точнее.
