  source_fidelity: Начальная часть в целом верно передаёт ἐγκρῖναι и συγκρῖναι, а также саморекомендацию. Однако «не понимают, что делают» добавляет конкретный подразумеваемый объект к οὐ συνιᾶσιν, которого в греческом тексте нет. Его следует оставить невыраженным. Кроме того, «кто сам себя рекомендует» менее точно передаёт множественное ἑαυτούς; лучше «кто рекомендует самих себя».
  naturalness: Исправленный текст сохраняет современный литературный и достойный регистр. Деепричастный оборот естественно отражает греческие причастия и позволяет сохранить намеренно настойчивый повтор возвратных местоимений.
  terminology: «Причислять себя к» удачно передаёт ἐγκρῖναι в значении включения себя в один круг; «сравнивать» последовательно передаёт обе формы συγκρίνω. «Рекомендует самих себя» точно выражает συνιστάνω с возвратным дополнением. Дополнительных богословских терминов нет.
