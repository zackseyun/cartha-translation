  text: Οὐ γὰρ τολμῶμεν ἐγκρῖναι ἢ συγκρῖναι ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων· ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες καὶ συγκρίνοντες ἑαυτοὺς ἑαυτοῖς οὐ συνιᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: ru
  text: Ведь мы не смеем ни причислять себя к некоторым из тех, кто рекомендует самих себя[a], ни сравнивать себя с ними. Но они, измеряя себя самими собой и сравнивая себя с самими собой[b], не понимают.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ставить себя в один ряд с некоторыми из тех, кто рекомендует самих себя». Греческий глагол означает причисление себя к определённому кругу или разряду.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «измеряя себя в самих себе и сравнивая себя с самими собой». Смысл, по-видимому, в том, что мерилом для них служат они сами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμῶμεν
  choice: не смеем
  rationale: Передаёт отказ Павла самонадеянно поступать подобным образом и сохраняет оттенок иронии.
- source_word: ἐγκρῖναι
  choice: причислять себя к
  rationale: Глагол обозначает помещение себя в один разряд или круг с другими; это естественнее по-русски, чем буквальное «классифицировать».
- source_word: συγκρῖναι / συγκρίνοντες
  choice: сравнивать / сравнивают
  rationale: Сохраняет обычное значение глагола и риторический повтор двух его форм.
- source_word: ἑαυτοὺς συνιστανόντων
  choice: кто сам себя рекомендует
  rationale: Передаёт рефлексивную саморекомендацию — ключевую тему данного раздела — без добавления конфессиональной интерпретации.
- source_word: ἀλλὰ αὐτοὶ
  choice: Но они
  rationale: Противительный союз и смена субъекта естественно передают противопоставление Павла тем, кто рекомендует сам себя.
- source_word: μετροῦντες
  choice: измеряют
  rationale: Сохраняет метафору оценки по определённой мере или стандарту.
- source_word: ἐν ἑαυτοῖς … ἑαυτοὺς ἑαυτοῖς
  choice: себя самими собой … себя с самими собой
  rationale: Передаёт подчеркнутую цепочку возвратных местоимений и самореферентность их оценки, не сглаживая риторическую тяжеловесность оригинала.
- source_word: οὐ συνιᾶσιν
  choice: не понимают, что делают
  rationale: Передаёт отсутствие понимания; «что делают» естественно раскрывает подразумеваемый объект, не определяя точнее, в чём именно состоит их непонимание.
theological_decisions:
- issue: Объект непонимания в οὐ συνιᾶσιν
  choice: не понимают, что делают
  alternative: они неразумны / они не понимают
  rationale: В греческом объект не назван. Формулировка сохраняет смысловую открытость и связывает непонимание с описанным действием, не утверждая, что речь идёт об общем недостатке разума.
translation_notes:
  register: Современный литературный русский язык с достойным, но доступным регистром. Риторический повтор возвратных местоимений намеренно сохранён; синтаксис слегка перестроен ради ясности. Частица γάρ передана как «ведь», а обе инфинитивные конструкции связаны естественным русским оборотом «причислять… или сравнивать».
