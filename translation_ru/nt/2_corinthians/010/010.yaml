id: 2CO.10.10
reference: 2 Corinthians 10:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι Αἱ ⸂ἐπιστολαὶ μέν⸃, φησίν, βαρεῖαι καὶ ἰσχυραί, ἡ δὲ παρουσία τοῦ σώματος ἀσθενὴς καὶ ὁ λόγος ἐξουθενημένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/010.yaml
  text: For they say[a], “His letters are weighty and strong, but his bodily presence is weak[b], and his speech is despised.”
translation:
  language: ru
  text: 'Ведь кто-то говорит[a]: «Его письма весомы и сильны, но при личной встрече[b] он слаб, а речью его пренебрегают[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорит». Возможно также: «ведь он говорит»; форма греческого глагола — единственное число и может вводить слова одного представителя критиков.'
    reason: Сохранение грамматической и референтной неоднозначности φησίν.
  - marker: b
    text: 'Буквально: «присутствие тела»; то есть когда он присутствует лично.'
    reason: Пояснение идиоматического перевода παρουσία τοῦ σώματος.
  - marker: c
    text: 'Или: «речь его считают ничтожной»; «речь его презирают».'
    reason: Лексические варианты для ἐξουθενημένος, обозначающего пренебрежительную оценку.
lexical_decisions:
- source_word: ὅτι
  choice: ведь
  rationale: Связывает приведённое далее мнение с предыдущей мыслью как её основание; «ведь» естественно передаёт пояснительно-причинную функцию в русском контексте.
- source_word: φησίν
  choice: кто-то говорит
  rationale: Глагол стоит в единственном числе. Неопределённое «кто-то» сохраняет эту форму и показывает, что Павел цитирует мнение критика, не выдавая его за собственную оценку.
- source_word: ἐπιστολαὶ
  choice: письма
  rationale: Обычное современное обозначение письменных посланий; церковно-книжное «послания» здесь не обязательно.
- source_word: βαρεῖαι
  choice: весомы
  rationale: Сохраняет метафору тяжести и передаёт серьёзность и убедительность писем, не сводя значение только к суровости.
- source_word: ἰσχυραί
  choice: сильны
  rationale: Прямой эквивалент, естественно сочетающийся с «весомы» и не уточняющий сверх текста, в чём именно проявляется сила писем.
- source_word: μέν ... δὲ
  choice: но
  rationale: Контраст между письмами и личным присутствием по-русски естественно выражается союзом «но» без тяжеловесной конструкции «с одной стороны… с другой стороны».
- source_word: παρουσία τοῦ σώματος
  choice: при личной встрече
  rationale: В данном противопоставлении выражение относится к личному, физическому присутствию Павла в отличие от его писем. Выбор передаёт смысл естественным русским языком; буквальная форма отмечена в сноске.
- source_word: ἀσθενής
  choice: слаб
  rationale: 'Сохраняет неопределённость исходной критики: текст не уточняет, идёт ли речь о внешности, манере держаться или впечатлении от личного присутствия.'
- source_word: λόγος
  choice: речь
  rationale: В противопоставлении письмам слово обозначает устное выступление или манеру говорить, а не обязательно содержание благовестия.
- source_word: ἐξουθενημένος
  choice: речью его пренебрегают
  rationale: 'Передаёт пассивную оценку: речь считают незначительной, ею пренебрегают. Такая формулировка не утверждает, будто речь Павла сама по себе была презренной или ничтожной.'
theological_decisions:
- issue: Критика Павла не должна звучать как оценка повествователя
  choice: 'Слова оформлены как цитата неопределённого критика: «кто-то говорит».'
  alternative: «говорят» или безличное «сказано»
  rationale: Единственное число φησίν сохранено, а рамка прямой речи ясно показывает, что это сообщаемое мнение противника, а не авторское подтверждение слабости Павла.
- issue: Характер названной слабости
  choice: Оставлено общее «слаб».
  alternative: «невзрачен», «не производит впечатления» или «физически слаб»
  rationale: Греческий текст не определяет природу слабости. Более конкретные варианты сняли бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой полемической речи. «Весомы и сильны» сохраняет риторическую парность оригинала; «при личной встрече» избегает неестественного оборота «телесное присутствие», а сноска сохраняет доступ к буквальной форме.
