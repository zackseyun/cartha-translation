  text: οὐ γὰρ ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς ὑπερεκτείνομεν ἑαυτούς, ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: ru
  text: Ведь мы не простираемся чрезмерно, словно не достигли вас, ибо мы дошли даже до вас с Благой вестью Мессии—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: не выходим за отведённые нам пределы
  rationale: Глагол выражает образ чрезмерного простирания за должные границы. Русская формулировка естественно передаёт как метафору, так и контекст установленных пределов служения.
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: словно не достигли вас
  rationale: Оборот обозначает предполагаемое недостижение коринфян, при котором Павлово притязание действительно было бы выходом за пределы.
- source_word: ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν
  choice: мы дошли даже до вас
  rationale: «Дошли» передаёт завершённое достижение Коринфа, а «даже» сохраняет усилительное καί.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: с Благой вестью
  rationale: 'ἐν допускает здесь сопутствующее или сферическое значение: апостолы достигли коринфян в ходе возвещения Евангелия. «С Благой вестью» ясно и естественно по-русски.'
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь сохраняет титульный смысл в сочетании с Благой вестью; «Мессия» передаёт этот смысл непосредственно.
theological_decisions:
- issue: Значение родительного τοῦ Χριστοῦ при εὐαγγελίῳ
  choice: Благая весть Мессии
  alternative: Благая весть о Мессии / Евангелие Христово
  rationale: Греческий родительный может обозначать принадлежность, источник или содержание. Краткая конструкция «Благая весть Мессии» сохраняет эту неоднозначность, не сводя её только к вести о Мессии.
- issue: Образ пределов служения
  choice: не выходим за отведённые нам пределы
  alternative: не простираемся чрезмерно
  rationale: Контекст говорит о мере и области служения, однако стих не называет прямо того, кто отвёл пределы. Формулировка не добавляет здесь явного субъекта.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный регистр. Сохранено начальное причинное «ведь» и незавершённость мысли в конце стиха посредством тире; тяжеловесная буквальность образа «растягивать себя сверх меры» заменена естественным русским выражением без утраты смысла.
