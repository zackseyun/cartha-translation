translation:
  language: ru
  text: Но тот, кто хвалится, пусть хвалится Господом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более формально: «Хвалящийся пусть хвалится Господом». Вероятно, Павел отсылает к Иеремии 9:24 (в Септуагинте — 9:23).'
    reason: cross_reference
lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: хвалящийся
  rationale: 'Артикль с причастием настоящего времени употреблён субстантивированно и обобщённо: речь идёт о всяком, кто хвалится. Русское причастие сохраняет представительный единственный характер выражения.'
- source_word: δὲ
  choice: Но
  rationale: 'Частица обозначает мягкое противопоставление предыдущему рассуждению: неправомерной похвальбе противопоставляется подобающая.'
- source_word: καυχώμενος / καυχάσθω
  choice: хвалящийся / пусть хвалится
  rationale: Повтор одного корня передаёт риторическую структуру греческого текста. Форма «пусть хвалится» естественно выражает побудительное значение императива третьего лица, не усиливая его до значения строгой обязанности.
- source_word: ἐν κυρίῳ
  choice: Господом
  rationale: Русский творительный падеж естественно передаёт основание или предмет похвалы при глаголе «хвалиться»; буквальное «в Господе» здесь звучало бы менее естественно. Формулировка сохраняет связь с вероятной аллюзией на Иеремию 9:24.
- source_word: κυρίῳ
  choice: Господом
  rationale: Слово κύριος передано традиционным и современно понятным «Господь» без уточнения референта, которого нет в самом греческом выражении.
theological_decisions:
- issue: Кого обозначает «Господь» в контексте библейской аллюзии
  choice: Господом
  alternative: Господом Иисусом; Богом
  rationale: Павел, вероятно, отсылает к Иеремии, однако греческий текст прямо не уточняет референта κύριος. Поэтому перевод не устраняет возможное смысловое наложение ветхозаветного контекста и павловского употребления титула.
- issue: Сила императива καυχάσθω
  choice: пусть хвалится
  alternative: должен хвалиться
  rationale: Императив третьего лица непосредственно передаётся побудительной конструкцией «пусть». Это сохраняет увещевательный характер фразы и не добавляет оттенка обязанности сильнее, чем требует форма.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Сохранены лаконизм, противопоставление и повтор глагола; референт слова «Господь» намеренно не уточнён.
