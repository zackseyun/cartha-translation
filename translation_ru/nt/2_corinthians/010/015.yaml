source:
  edition: SBLGNT
  text: οὐκ εἰς τὰ ἄμετρα καυχώμενοι ἐν ἀλλοτρίοις κόποις, ἐλπίδα δὲ ἔχοντες αὐξανομένης τῆς πίστεως ὑμῶν ἐν ὑμῖν μεγαλυνθῆναι κατὰ τὸν κανόνα ἡμῶν εἰς περισσείαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/015.yaml
  text: not boasting beyond measure in the labors of others, but having hope that, as your faith is growing among you, we will be enlarged according to our sphere of ministry, unto abundance,
translation:
  language: ru
  text: не хвалясь без меры трудами других, но надеясь, что по мере возрастания вашей веры мы будем всё шире действовать среди вас, в пределах отведённого нам поприща[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «быть чрезвычайно увеличенными среди вас согласно нашему мерилу». Греческое κανών может означать меру, границу или отведённую область деятельности; μεγαλυνθῆναι — «быть увеличенными» или «возвеличенными». В контексте вероятнее всего речь идёт о дальнейшем расширении апостольского служения Павла, хотя возможен и оттенок его большего признания.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: οὐκ εἰς τὰ ἄμετρα καυχώμενοι
  choice: не хвалясь без меры
  rationale: Передаёт отрицание чрезмерной, выходящей за должные пределы похвалы и сохраняет образ меры, связанный с контекстом.
- source_word: ἐν ἀλλοτρίοις κόποις
  choice: чужими трудами
  rationale: Естественно по-русски выражает мысль о присвоении заслуг за труд, принадлежащий другим.
- source_word: ἐλπίδα δὲ ἔχοντες
  choice: но надеясь
  rationale: Естественная русская передача причастной конструкции без изменения её смысловой связи с последующим инфинитивом.
- source_word: αὐξανομένης τῆς πίστεως ὑμῶν
  choice: с возрастанием вашей веры
  rationale: Сохраняет именную конструкцию и обычное в данном контексте значение πίστις — «вера».
- source_word: ἐν ὑμῖν μεγαλυνθῆναι
  choice: мы сможем ещё шире развернуть свой труд среди вас
  rationale: В контексте речь идёт о расширении апостольского труда, а не о личном возвеличивании Павла; ἐν ὑμῖν связано с этим расширением среди коринфян.
- source_word: κατὰ τὸν κανόνα ἡμῶν
  choice: в пределах отведённого нам поприща
  rationale: κανών обозначает здесь размеченную или назначенную область деятельности; «поприще» сохраняет пространственный образ и не вызывает анахронической ассоциации с каноном Писания.
- source_word: εἰς περισσείαν
  choice: ещё шире
  rationale: Передаёт направленность к большему размаху или дальнейшему расширению естественным современным русским оборотом.
theological_decisions:
- issue: Смысл μεγαλυνθῆναι применительно к апостольскому служению
  choice: Расширение апостольского труда Павла среди коринфян и далее, а не его личное возвеличивание.
  alternative: Павел будет больше возвеличен или почитаем коринфянами.
  rationale: Непосредственный контекст говорит о пределах порученного поприща, о чужих трудах и о дальнейшем благовествовании; поэтому глагол лучше понимать как образ расширения служения, не устраняя полностью лежащую в нём метафору величины.
- issue: Значение κανών
  choice: Отведённое поприще, то есть размеченная область апостольского труда.
  alternative: Правило, норма или мера.
  rationale: В стихах 13–16 преобладает пространственный образ установленной Богом области труда. Перевод «поприще» выражает его без позднейшего богословского значения слова «канон».
- issue: Синтаксическая связь ἐν ὑμῖν
  choice: 'Отнесено к μεγαλυνθῆναι: расширить труд среди вас.'
  alternative: 'Отнесено к αὐξανομένης τῆς πίστεως: ваша вера возрастает среди вас.'
  rationale: 'Положение фразы допускает некоторую синтаксическую неоднозначность, однако связь с μεγαλυνθῆναι даёт более последовательное развитие мысли: рост веры коринфян позволит расширить труд Павла среди них и затем за их пределами.'
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской речи. Образ меры сохранён в выражениях «без меры» и «в пределах», а тяжеловесная буквальная конструкция раскрыта как расширение труда. Единственная сноска отмечена в основном тексте.
