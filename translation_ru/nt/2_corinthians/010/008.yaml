  text: ἐάν ⸀τε ⸀γὰρ περισσότερόν τι καυχήσωμαι περὶ τῆς ἐξουσίας ἡμῶν, ἧς ἔδωκεν ὁ ⸀κύριος εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ὑμῶν, οὐκ αἰσχυνθήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/008.yaml
  text: For even if I should boast somewhat more about our authority[a], which the Lord gave for building you up and not for tearing you down[b], I will not be put to shame.
translation:
  language: ru
  text: Ведь даже если я стану несколько больше хвалиться нашей властью, которую Господь дал нам для вашего созидания, а не для вашего разрушения, я не буду посрамлён.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я не буду стыдиться». Греческий будущий страдательный глагол может обозначать как внешнее посрамление, так и стыд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: И даже если
  rationale: Передаёт условное значение ἐάν с сослагательным наклонением и усилительный оттенок τε; γάρ в данном контексте естественно выражено связью с предшествующей мыслью через «и», без тяжеловесного «ибо».
- source_word: περισσότερόν τι
  choice: несколько больше
  rationale: Сохраняет сравнительную степень περισσότερον и смягчающую неопределённость τι.
- source_word: καυχήσωμαι
  choice: я стану… хвалиться
  rationale: Естественно передаёт аорист конъюнктива в условной конструкции как возможное действие.
- source_word: περὶ τῆς ἐξουσίας ἡμῶν
  choice: нашей властью
  rationale: ἐξουσία обозначает данное право и полномочие, а не просто силу; русский глагол «хвалиться» нормативно требует творительного падежа.
- source_word: ἧς ἔδωκεν ὁ κύριος
  choice: которую Господь дал нам
  rationale: Относительное местоимение относится к власти; «нам» естественно обозначает подразумеваемого получателя и согласуется с «нашей властью».
- source_word: εἰς οἰκοδομὴν
  choice: для вашего созидания
  rationale: Передаёт метафору строительства и в контексте обозначает укрепление коринфян; принадлежность «вашего» определяется параллельным ὑμῶν.
- source_word: καὶ οὐκ εἰς καθαίρεσιν ὑμῶν
  choice: а не для разрушения
  rationale: «А не» ясно передаёт противопоставление; «разрушение» сохраняет строительную метафору и допускает значение ниспровержения, не усиливая его до полного уничтожения.
- source_word: οὐκ αἰσχυνθήσομαι
  choice: мне не придётся стыдиться
  rationale: 'Естественная русская передача будущей формы, сохраняющая смысл: сказанное Павлом о власти не окажется необоснованным и постыдным.'
theological_decisions:
- issue: Природа и назначение апостольской власти
  choice: Власть дана Господом для созидания коринфян, а не для разрушения.
  alternative: Власть понимается прежде всего как средство карательного разрушения.
  rationale: Прямое противопоставление οἰκοδομή и καθαίρεσις подчёркивает созидательную цель власти, не отрицая возможности её строгого применения.
- issue: Смысл οὐκ αἰσχυνθήσομαι
  choice: Павлу не придётся стыдиться своего более смелого заявления о данной ему власти.
  alternative: Павел не будет посрамлён другими или не окажется опозоренным.
  rationale: Греческая пассивная форма допускает оттенок внешнего посрамления, тогда как русский возвратный глагол естественнее в основном тексте; альтернативный оттенок сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизации. Строительная метафора οἰκοδομή/καθαίρεσις сохранена через «созидание/разрушение»; синтаксис сделан естественным для русского читателя.
