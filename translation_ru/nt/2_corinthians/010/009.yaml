  text: чтобы я не выглядел так, будто запугиваю вас своими письмами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы я не выглядел так, будто пытаюсь устрашить вас посредством писем».'
    reason: 'Лексико-синтаксический вариант: ἐκφοβεῖν можно передать как «устрашить», а διὰ τῶν ἐπιστολῶν — более буквально как «посредством писем».'
lexical_decisions:
- source_word: ἵνα μὴ δόξω
  choice: чтобы не показалось
  rationale: Передаёт цель или ожидаемый результат, выраженный ἵνα с сослагательным наклонением, а δοκέω здесь означает «казаться». Безличная русская конструкция звучит естественно и не меняет подразумеваемого субъекта.
- source_word: ὡς ἂν
  choice: будто
  rationale: 'Естественно передаёт сравнительно-предположительный оттенок: речь идёт о том, какое впечатление могут создать действия Павла.'
- source_word: ἐκφοβεῖν
  choice: запугиваю
  rationale: Глагол обозначает сильное устрашение и в данном контексте хорошо передаётся современным «запугивать», которое включает оттенок намеренного воздействия, не усиливая смысл до «ужасать».
- source_word: ὑμᾶς
  choice: вас
  rationale: Прямое дополнение при ἐκφοβεῖν; множественное число сохранено.
- source_word: διὰ τῶν ἐπιστολῶν
  choice: своими посланиями
  rationale: διά с родительным падежом указывает на средство. «Своими» естественно уточняет контекстуально очевидную принадлежность писем Павлу; «посланиями» соответствует литературно-библейскому регистру и остаётся понятным современному читателю.
