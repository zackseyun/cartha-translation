base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/004.yaml
  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: ru
  text: Ибо оружие нашей войны не плотское[a], но обладающее Божьей силой[b], для разрушения твердынь — для ниспровержения доводов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не принадлежащее плоти»; возможно также: «не мирское».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сильное перед Богом» или «обладающее божественной силой».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «рассуждения», «умозаключения» или «измышления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλα
  choice: оружие
  rationale: Сохраняет конкретный военный образ и естественно звучит в современном русском языке.
- source_word: στρατείας
  choice: войны
  rationale: Передаёт образ продолжающейся вооружённой борьбы; сочетание «оружие нашей войны» близко к форме греческого текста.
- source_word: σαρκικὰ
  choice: плотское
  rationale: Сохраняет связь с павловским понятием «плоть» и не сужает смысл до «греховного» или просто «мирского».
- source_word: δυνατὰ τῷ θεῷ
  choice: сильное Богом
  rationale: Краткая литературная формулировка передаёт связь силы оружия с Богом, не разворачивая сжатый греческий дательный оборот в однозначное толкование.
- source_word: καθαίρεσιν
  choice: разрушения
  rationale: Передаёт демонтаж укреплений и сохраняет яркий осадный образ.
- source_word: ὀχυρωμάτων
  choice: твердынь
  rationale: Устоявшееся и выразительное обозначение укреплённых позиций, пригодное и для метафорического употребления.
- source_word: λογισμοὺς
  choice: доводы
  rationale: В контексте противостояния истине речь идёт не просто о мыслях, а об аргументации; при этом альтернативы отмечены в сноске.
- source_word: καθαιροῦντες
  choice: мы разрушаем
  rationale: Сохраняет лексическую связь с καθαίρεσιν и ясно присоединяет следующую мысль после тире.
theological_decisions:
- issue: Значение σαρκικὰ в противопоставлении человеческих и Божьих средств
  choice: плотское
  alternative: принадлежащее плоти; мирское
  rationale: «Плотское» сохраняет богословскую напряжённость понятия σάρξ и не сводит его заранее только к греховности или мирским методам.
- issue: Значение дательного τῷ θεῷ при δυνατὰ
  choice: сильное Богом
  alternative: сильное перед Богом; обладающее божественной силой
  rationale: Греческий оборот допускает разные оттенки. Основной текст связывает силу с Богом, а сноска сохраняет альтернативы, не утверждая исключительно инструментальное понимание.
- issue: Связь λογισμοὺς с образом твердынь
  choice: доводы
  alternative: рассуждения; умозаключения; измышления
  rationale: Перевод показывает, что военная метафора применяется к интеллектуальному противлению, но не добавляет в стих отсутствующей квалификации этих доводов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной военной образностью. Слова «плотское» и «твердыни» сохранены ради павловской терминологии и метафоры, а менее очевидные смысловые варианты вынесены в сноски. Переведён весь предоставленный греческий фрагмент, включая начальные слова следующего смыслового движения «λογισμοὺς καθαιροῦντες».
