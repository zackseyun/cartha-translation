  - severity: low
    issue: Финальное «мы разрушаем» разворачивает причастие в самостоятельное личное предложение.
    rationale: Греческое καθαιροῦντες относится к подразумеваемому «мы», поэтому смысл не искажён, но номинальная конструкция лучше воспроизводит тесную связь с предшествующим πρὸς καθαίρεσιν и не добавляет нового синтаксического членения.
