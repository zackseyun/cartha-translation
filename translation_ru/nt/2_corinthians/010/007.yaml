  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: ru
  text: 'Вы смотрите на внешнее[a]. Если кто уверен, что принадлежит Мессии, пусть он ещё раз сам подумает вот о чём: как он принадлежит Мессии[b], так и мы принадлежим Мессии.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Вы смотрите на то, что перед лицом» или «на то, что видно снаружи». Форму «смотрите» можно также понять как повеление: «Смотрите на то, что перед вами».'
    reason: Сохранение лексической и грамматической неоднозначности выражения Τὰ κατὰ πρόσωπον βλέπετε.
  - marker: b
    text: 'Буквально: «он — Мессии»; то есть принадлежит Мессии.'
    reason: Пояснение греческого генитива принадлежности при сохранении титульного значения Χριστός.
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: на внешнее
  rationale: Оборот указывает на то, что находится на виду, на внешнюю сторону дела. Краткое русское выражение естественно передаёт этот смысл, не добавляя прямо значения «судить».
- source_word: βλέπετε
  choice: вы смотрите
  rationale: Форма может быть понята как изъявительное наклонение или повеление. В основном тексте выбрано изъявительное как наиболее вероятный укор в данном контексте; неоднозначность отмечена в сноске.
- source_word: πέποιθεν ἑαυτῷ
  choice: уверен
  rationale: Перфект выражает устойчивую уверенность. Русское «уверен» передаёт состояние; отдельное «в себе» опущено как стилистически тяжёлое и потенциально двусмысленное, поскольку содержание уверенности далее названо прямо.
- source_word: Χριστοῦ εἶναι
  choice: принадлежит Мессии
  rationale: Генитив с εἶναι выражает принадлежность. «Мессия» сохраняет титульный смысл Χριστός, а глагол «принадлежит» делает греческую конструкцию ясной по-русски.
- source_word: λογιζέσθω πάλιν ἐφ’ ἑαυτοῦ
  choice: пусть он ещё раз сам подумает вот о чём
  rationale: Императив призывает заново обдумать и оценить сказанное применительно к себе. Формулировка звучит естественно и сохраняет личный, рефлексивный характер призыва.
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: как он принадлежит Мессии, так и мы
  rationale: Сравнительная конструкция утверждает такую же принадлежность Павла и его сотрудников Мессии. В первой части глагол повторён для ясности, а во второй сохранён естественный русский эллипсис.
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христу
  rationale: Здесь Χριστός обозначает титул Помазанника. «Мессия» ясно сохраняет титульное значение и не превращает слово без необходимости в обычное личное имя.
- issue: Смысл принадлежности Христу/Мессии
  choice: принадлежит Мессии
  alternative: Мессиев; Христов
  rationale: Греческое Χριστοῦ εἶναι буквально допускает «быть Мессии», но по-русски яснее выразить отношение принадлежности глаголом. Формулировка не уточняет сверх текста, идёт ли речь прежде всего о верности, союзе или принадлежности общине.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный по тону. Синтаксис сделан понятным для обычного читателя; реальная неоднозначность первой фразы сохранена в сноске. Обращение передано множественным числом «вы», как в греческом тексте.
