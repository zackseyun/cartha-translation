  text: For though we walk in the flesh[a], we do not wage war according to the flesh—
translation:
  language: ru
  text: Ведь хотя мы и живём во плоти[a], воюем мы не по плоти—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь хотя мы и живём в теле, воюем мы не по чисто человеческим меркам».'
    reason: 'Лексическая альтернатива поясняет различие оттенков двух употреблений слова σάρξ: телесное существование и человеческие способы действия.'
lexical_decisions:
- source_word: ἐν σαρκὶ
  choice: во плоти
  rationale: Сравнительно буквальная передача сохраняет первое употребление σάρξ как указание на обычное телесное человеческое существование и подготавливает повтор того же слова во второй части стиха.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит пояснение к предыдущей мысли; «ведь» естественно передаёт эту аргументативную связь в современном русском языке.
- source_word: περιπατοῦντες
  choice: хотя мы и живём
  rationale: Причастие περιπατοῦντες буквально связано с хождением, но здесь означает жизнь или существование. Уступительная конструкция передаёт подразумеваемое противопоставление следующей части фразы.
- source_word: οὐ κατὰ σάρκα
  choice: не по плоти
  rationale: Оборот κατὰ σάρκα указывает на норму, образ или принципы действия. Буквальная формулировка сохраняет повтор σάρξ и не сводит смысл исключительно к человеческим, мирским либо греховным меркам.
- source_word: στρατευόμεθα
  choice: воюем
  rationale: Глагол продолжает военную метафору апостольской борьбы. «Воюем» кратко, естественно и точно передаёт активный характер образа.
theological_decisions:
- issue: Передача двух употреблений σάρξ
  choice: 'В обоих случаях использовать слово «плоть»: «во плоти… не по плоти».'
  alternative: «Живём в теле… воюем не по человеческим меркам»; «живём в человеческой немощи… воюем не по-мирски».
  rationale: Первое употребление относится прежде всего к телесному человеческому существованию, второе — к способу или принципам ведения борьбы. Единая передача сохраняет риторический повтор и смысловое напряжение, не отождествляя здесь σάρξ с «греховной природой».
translation_notes:
  register: Современный литературный русский язык с сохранением выразительного повторения «плоть». Инверсия «воюем мы» подчёркивает противопоставление. Конечное тире сохранено, поскольку мысль непосредственно продолжается в следующем стихе.
