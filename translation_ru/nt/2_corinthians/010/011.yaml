  text: τοῦτο λογιζέσθω ὁ τοιοῦτος, ὅτι οἷοί ἐσμεν τῷ λόγῳ δι’ ἐπιστολῶν ἀπόντες, τοιοῦτοι καὶ παρόντες τῷ ἔργῳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/011.yaml
  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: ru
  text: 'Пусть такой человек примет во внимание: каковы мы на словах в письмах, когда отсутствуем, таковы мы и на деле, когда присутствуем.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογιζέσθω
  choice: пусть примет во внимание
  rationale: Императив третьего лица призывает обдумать и учесть сказанное; выражение естественно для современного русского языка и передаёт оттенок осознанного вывода.
- source_word: ὁ τοιοῦτος
  choice: такой человек
  rationale: Сохраняет единственное число и отсылает к человеку описанного выше типа без архаичного оборота «таковой».
- source_word: οἷοί ἐσμεν ... τοιοῦτοι
  choice: каковы мы ... таковы мы
  rationale: Прямо воспроизводит качественное соотношение двух греческих местоименных прилагательных и сохраняет риторический параллелизм.
- source_word: τῷ λόγῳ
  choice: в словах
  rationale: Передаёт дательный сферы и образует естественную русскую антитезу «в словах — в делах»; контекст писем уточняет, что речь идёт о письменных словах.
- source_word: δι’ ἐπιστολῶν
  choice: когда пишем письма
  rationale: Динамично и ясно выражает письма как средство общения; русский оборот «посредством писем» был бы точнее формально, но заметно тяжелее.
- source_word: ἀπόντες
  choice: вдали от вас
  rationale: Передаёт отсутствие Павла и его сотрудников относительно адресатов; добавленное «от вас» эксплицирует очевидное из контекста отношение и звучит естественно по-русски.
- source_word: τῷ ἔργῳ
  choice: в делах
  rationale: Сохраняет дательный сферы и компактную антитезу λόγῳ — ἔργῳ как «в словах — в делах».
- source_word: παρόντες
  choice: когда находимся у вас
  rationale: Естественно передаёт личное присутствие среди адресатов и сохраняет противопоставление отсутствию.
theological_decisions:
- issue: Соотношение письменных слов Павла и его поведения при личном присутствии
  choice: 'Передать как утверждение полного соответствия: «каковы ... таковы».'
  alternative: Развернуть фразу в явную угрозу будущими строгими действиями.
  rationale: Греческий текст содержит прямое качественное сопоставление слов в письмах и дел при личном присутствии. Контекст придаёт ему предупредительную силу, но сам стих не требует превращать это в более конкретную угрозу.
- issue: Значение λόγος и ἔργον
  choice: Сохранить широкую антитезу «слова — дела».
  alternative: Истолковать как узкое противопоставление манеры речи и властного действия.
  rationale: Широкие греческие термины допускают контекстуальную силу такого прочтения, но не сводятся однозначно к нему; перевод сохраняет исходную ёмкость и напряжение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксический параллелизм «каковы ... таковы» сохраняет риторическую строгость оригинала; антитеза «в словах — в делах» звучит естественно и не требует примечания.
