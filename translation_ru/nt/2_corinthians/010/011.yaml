  source_fidelity: В черновике верно переданы императив, качественный параллелизм «каковы... таковы» и антитеза λόγῳ—ἔργῳ. Однако «когда пишем письма» заменяет инструментальное «через/в письмах» на временно-действовательное обстоятельство, а «от вас» и «у вас» добавляют адресатов, которых в самом стихе нет. Эти добавления безопасны для контекста, но избыточны для перевода данного текста.
  naturalness: Исправленный вариант сохраняет современный литературный строй и ясный параллелизм. Обороты «в письмах, когда отсутствуем» и «когда присутствуем» естественны и не требуют искусственного уточнения места.
  terminology: «На словах» и «на деле» — естественная русская передача намеренно контрастных τῷ λόγῳ и τῷ ἔργῳ. «В письмах» передаёт роль ἐπιστολαί как средства письменного высказывания, не утверждая, будто письмо было написано именно в момент отсутствия.
