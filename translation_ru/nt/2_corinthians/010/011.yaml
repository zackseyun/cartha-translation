  to: 'Пусть такой человек примет во внимание: каковы мы на словах в письмах, когда отсутствуем, таковы мы и на деле, когда присутствуем.'
  rationale: Устранены невыраженные в греческом уточнения «от вас» и «у вас». «В письмах» передаёт инструментальную функцию δι’ ἐπιστολῶν, а временные обороты сохраняют параллельные ἀπόντες и παρόντες. Антитеза «на словах — на деле» удерживает риторическую силу оригинала без сужения значения до одной манеры речи или угрозы.
