  yaml_path: translation/nt/2_corinthians/010/016.yaml
  text: to proclaim the good news in the regions beyond you[c][b][a], not to boast in another's sphere about things already prepared.
translation:
  language: ru
  text: чтобы возвещать благую весть в краях, лежащих дальше вас[a], а не хвалиться в чужой области[b] тем, что уже подготовлено[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «возвещать благую весть в землях за пределами вашей области».'
    reason: lexical_alternative
  - marker: b
    text: «Область» передаёт греческое κανών в значении отведённой сферы или поля деятельности, а не нравственного «правила» и не позднейшего «канона».
    reason: cultural_note
  - marker: c
    text: 'То есть, вероятно, не ставить себе в заслугу труд или результаты, уже подготовленные другими; буквально: «тем, что готово».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερέκεινα
  choice: в краях, лежащих дальше
  rationale: Субстантивированное выражение обозначает местности по ту сторону некоторой точки. «В краях, лежащих дальше» естественно передаёт географическую направленность и сохраняет соотнесённость с адресатами.
- source_word: ὑμῶν
  choice: от вас
  rationale: 'Родительный падеж задаёт точку отсчёта: речь идёт о местностях дальше коринфян. Перевод не добавляет прямо отсутствующего в греческом слова «область».'
- source_word: εὐαγγελίσασθαι
  choice: возвещать благую весть
  rationale: Передаёт глагольный характер выражения и миссионерскую цель Павла ясным современным языком, не сводя его к церковному термину.
- source_word: ἀλλοτρίῳ
  choice: чужой
  rationale: Прилагательное означает принадлежащее другому. Русское «чужой» кратко и естественно выражает противопоставление своей и чужой области труда.
- source_word: κανόνι
  choice: сфере служения
  rationale: В контексте слово обозначает отведённую область или поле деятельности, а не нравственное правило и не позднейший канон. Добавление «служения» проясняет метафорический смысл в данном контексте.
- source_word: ἕτοιμα
  choice: то, что уже подготовлено
  rationale: Субстантивированное прилагательное буквально указывает на уже готовое или подготовленное. Формулировка сохраняет некоторую неопределённость предмета, не подменяя его словом «труд» или «результаты».
- source_word: καυχήσασθαι
  choice: хвалиться
  rationale: Сохраняет повторяющуюся в отрывке лексику Павла и её полемическую остроту.
theological_decisions:
- issue: Значение κανών в контексте служения Павла
  choice: отведённая другому сфера служения
  alternative: правило, мерило или канон
  rationale: В 2 Кор. 10:13–15 речь идёт о пределах и области порученного труда. Такой перевод не вносит в текст более позднее значение «канон».
- issue: Референт τὰ ἕτοιμα
  choice: то, что уже подготовлено
  alternative: уже совершённый другими миссионерский труд
  rationale: Контекст допускает связь с трудом и достижениями других служителей, однако греческое выражение остаётся сжатым и не называет «труд» прямо. Основной текст сохраняет эту неопределённость, а примечание поясняет вероятный контекстуальный смысл.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной библейского текста лексикой. Синтаксис сохраняет зависимость инфинитивной цели от предыдущего контекста, поэтому фрагмент начинается со строчной буквы «чтобы». Выражение «благая весть» употреблено как описательное, без искусственной конфессиональной маркировки.
