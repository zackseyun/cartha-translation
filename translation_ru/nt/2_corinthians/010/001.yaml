revisions:
- from: Я же, Павел, сам прошу вас, взывая к кротости и снисходительности Мессии[a], — я, смиренный, когда нахожусь среди вас лицом к лицу[b][c], но смелый с вами, когда отсутствую.
  to: Я же, сам Павел, прошу вас кротостью и снисходительностью Мессии[a] — я, смиренный в вашем присутствии[b][c], но смелый по отношению к вам, когда отсутствую.
  rationale: Правка устраняет неестественную кальку и делает значение греческих предлогов яснее, сохраняя личный акцент Αὐτὸς ... ἐγὼ Παῦλος, возможную иронию ταπεινός и нейтральную направленность εἰς ὑμᾶς. Сноски и их маркеры сохранены и согласованы с исправленным текстом.
