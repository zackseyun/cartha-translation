source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: ru
  text: Я же, сам Павел, прошу вас кротостью и снисходительностью Мессии[a] — я, смиренный в вашем присутствии[b][c], но смелый по отношению к вам, когда отсутствую.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа». Греческое Χριστός означает «Мессия», то есть «Помазанник».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «по лицу»; здесь: при личной встрече, в вашем присутствии.'
    reason: lexical_alternative
  - marker: c
    text: 'Слово «смиренный», возможно, иронически повторяет то, как некоторые характеризовали Павла при личной встрече. Возможные варианты: «непритязательный», а в более толковательном переводе — «робкий».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: Я же, Павел, сам
  rationale: Сохраняет усиленное личное местоимение и имя Павла; δέ передано частицей «же», обозначающей переход и лёгкое противопоставление без временного значения.
- source_word: παρακαλῶ ὑμᾶς
  choice: прошу вас
  rationale: В данном контексте глагол выражает личную настойчивую просьбу, а не приказ; современное «прошу» естественно передаёт этот тон.
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: взывая к кротости и снисходительности
  rationale: Оборот с διά и родительным указывает на основание или средство обращения. «Взывая к» естественно по-русски выражает обращение, основанное на качествах Мессии; «кротость» сохраняет нравственную силу πραΰτης, а «снисходительность» передаёт мягкую, уступчивую выдержку ἐπιείκεια.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь является титулом; перевод «Мессия» передаёт его смысл, а не просто традиционную транслитерацию.
- source_word: ὃς
  choice: я
  rationale: Относительное местоимение относится к Павлу. Повтор «я» естественно вводит по-русски его подчёркнутое, возможно ироническое самоописание.
- source_word: κατὰ πρόσωπον
  choice: лицом к лицу
  rationale: Сохраняет конкретный греческий оборот и в контексте означает личное присутствие, противопоставленное отсутствию.
- source_word: ταπεινὸς
  choice: смиренный
  rationale: Передаёт основное значение «смиренный, непритязательный», не устраняя возможную иронию и не усиливая выражение до интерпретирующего «робкий».
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: Естественно обозначает пребывание Павла в среде коринфян.
- source_word: ἀπὼν
  choice: когда отсутствую
  rationale: Передаёт обстоятельственное временное значение причастия и ясно противопоставляет отсутствие личному присутствию.
- source_word: θαρρῶ εἰς ὑμᾶς
  choice: смелый с вами
  rationale: Сохраняет контраст со «смиренным» и направленность отношения к адресатам, не привнося более враждебное «против вас».
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: Слово функционирует как титул; «Мессия» раскрывает его смысл и сохраняет мессианский фон.
- issue: Тон самоописания Павла
  choice: Сохранить «смиренный» без кавычек, пояснив возможную иронию в сноске
  alternative: Передать как «робкий» либо оформить как прямую цитату обвинителей
  rationale: Греческий текст допускает, что Павел иронически повторяет чужую характеристику, но не маркирует её как цитату. Основной текст сохраняет эту неоднозначность.
- issue: Направленность εἰς ὑμᾶς
  choice: с вами
  alternative: против вас
  rationale: Предлог обозначает направленность смелости Павла по отношению к коринфянам, но сам по себе не требует враждебного смысла.
translation_notes:
  register: Современный литературный русский с достоинством апостольского обращения. Синтаксис сохраняет подчёркнутое «я» и резкий риторический контраст между личным присутствием и отсутствием. Формулировка избегает архаичного «умоляю» и чрезмерно разговорных оборотов.
