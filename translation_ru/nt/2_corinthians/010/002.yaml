  variant: modern literary Russian
source:
  edition: SBLGNT
  text: δέομαι δὲ τὸ μὴ παρὼν θαρρῆσαι τῇ πεποιθήσει ᾗ λογίζομαι τολμῆσαι ἐπί τινας τοὺς λογιζομένους ἡμᾶς ὡς κατὰ σάρκα περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: ru
  text: 'Но прошу: когда я буду у вас, пусть мне не придётся действовать смело с той уверенностью, с какой я намерен осмелиться выступить против некоторых, считающих, будто мы поступаем по плоти[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будто мы живём, руководствуясь человеческими мерками».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέομαι
  choice: прошу
  rationale: Передаёт настойчивую личную просьбу Павла; в современном русском «умоляю» могло бы чрезмерно усилить эмоциональный оттенок.
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: когда я буду у вас, пусть мне не придётся действовать смело
  rationale: Передаёт содержание просьбы и подразумеваемую нежелательную необходимость, сохраняя противопоставление присутствию и отсутствию.
- source_word: τῇ πεποιθήσει
  choice: с той уверенностью
  rationale: 'Дательный падеж понят инструментально-сопроводительно: уверенность, с которой Павел готов действовать.'
- source_word: ᾗ λογίζομαι
  choice: с какой я намерен
  rationale: В данном контексте λογίζομαι выражает обдуманное намерение или решение, а не простой умственный подсчёт.
- source_word: τολμῆσαι ἐπί τινας
  choice: решительно выступить против некоторых людей
  rationale: Передаёт смелое, направленное против определённых лиц действие, не конкретизируя его как физическое или дисциплинарное столкновение.
- source_word: τοὺς λογιζομένους
  choice: считающих
  rationale: Естественно передаёт оценочное суждение оппонентов.
- source_word: κατὰ σάρκα
  choice: по плоти
  rationale: Сохраняет значимый для Павла термин и неоднозначность обвинения; более истолковывающий вариант вынесен в сноску.
- source_word: περιπατοῦντας
  choice: поступаем
  rationale: В русском языке это естественно передаёт метафорическое περιπατέω в значении образа жизни и поведения, не создавая ошибочного впечатления о буквальной ходьбе.
theological_decisions:
- issue: Передача σάρξ в выражении κατὰ σάρκα
  choice: по плоти
  alternative: руководствуемся человеческими мерками
  rationale: Основной текст сохраняет богословскую ёмкость и напряжение павловского выражения. Вариант «по греховной природе» неоправданно сужал бы обвинение, тогда как примечание поясняет вероятный антропологический смысл.
translation_notes:
  register: Современный литературный русский язык с достойным, но доступным синтаксисом. «Когда я буду у вас» естественно раскрывает παρών в контексте личного прибытия; «поступаем по плоти» сохраняет павловскую формулу без конфессионального истолкования.
