  source_fidelity: 'В целом структура и смысл переданы точно: δέоμαι — «прошу», содержание просьбы — «пусть мне не придётся», противопоставление личного присутствия, уверенность, направленность действия против критиков и обвинение «по плоти» сохранены. Однако «решительно выступить» несколько добавляет оттенок твёрдости/решительности, тогда как τολμῆσαι прежде всего означает «осмелиться, дерзнуть».'
