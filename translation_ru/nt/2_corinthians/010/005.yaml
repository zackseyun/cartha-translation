translation:
  language: ru
  text: и всё возвышенное, что воздвигается против познания Бога[a], и пленяя всякую мысль для повиновения Мессии[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякое возвышение»; по смыслу также возможно: «всякая надменная претензия» или «всякая гордая преграда».'
    reason: lexical_alternative
  - marker: b
    text: 'Греч. Χριστοῦ; традиционно: «Христу».'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν ὕψωμα
  choice: всякую высоту
  rationale: Сохраняет образ чего-то возвышенного и распределительное значение πᾶν, не сужая смысл до одной лишь высокомерной претензии или преграды.
- source_word: ἐπαιρόμενον
  choice: воздвигающуюся
  rationale: Передаёт образ поднятия или возвышения и естественно согласуется по-русски с «высотой», не навязывая строго возвратное значение «превозносящуюся».
- source_word: κατὰ τῆς γνώσεως τοῦ θεοῦ
  choice: против познания Бога
  rationale: «Познание» здесь естественно обозначает знание Бога и сохраняет ёмкость греческого родительного оборота.
- source_word: αἰχμαλωτίζοντες
  choice: берём в плен
  rationale: Сохраняет яркую военную метафору захвата пленника и звучит естественно в современном русском языке.
- source_word: πᾶν νόημα
  choice: всякую мысль
  rationale: «Мысль» — наиболее естественный широкий эквивалент в данном контексте; он не сужает νόημα до злого замысла.
- source_word: εἰς τὴν ὑπακοὴν
  choice: чтобы она повиновалась
  rationale: Естественно передаёт направленность εἰς к состоянию повиновения; местоимение «она» ясно относится к каждой мысли.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь сохраняет значение титула; «Мессия» передаёт смысл титула, тогда как традиционное «Христос» является его привычной транслитерированной формой.
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христу
  rationale: В данном обороте слово понимается как титул. Перевод «Мессия» раскрывает его значение, а сноска сохраняет знакомый традиционный вариант.
- issue: Характер противостояния в πᾶν ὕψωμα ἐπαιρόμενον
  choice: всякую высоту, воздвигающуюся
  alternative: всякую надменную претензию / всякую гордую преграду
  rationale: Греческий образ шире одной интеллектуальной претензии или конкретной преграды; буквальный образ высоты сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с сохранением военной и пространственной метафор оригинала. Синтаксис оставлен как продолжение предыдущей части предложения; формулировки ясны без конфессионального уточнения смысла.
