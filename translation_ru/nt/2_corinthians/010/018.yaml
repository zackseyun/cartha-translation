  text: οὐ γὰρ ὁ ἑαυτὸν ⸀συνιστάνων, ἐκεῖνός ἐστιν δόκιμος, ἀλλὰ ὃν ὁ κύριος συνίστησιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: ru
  text: Ибо одобрен не тот, кто сам себя рекомендует,[a] а тот, кого рекомендует Господь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сам себя представляет как достойного»… «тот, кого Господь представляет как достойного». В обоих случаях в греческом тексте употреблён один и тот же глагол.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: рекомендует
  rationale: В контексте похвалы и оценки глагол означает представлять кого-либо как достойного признания или одобрения. «Рекомендует» естественно передаёт это значение и позволяет сохранить повтор одного и того же греческого глагола в обеих частях стиха.
- source_word: δόκιμος
  choice: одобрение получает
  rationale: Прилагательное обозначает человека, признанного достойным по итогам испытания или оценки. Предикативная конструкция «одобрение получает» ясно выражает смысл и сохраняет противопоставление саморекомендации и одобрения Господом.
- source_word: κύριος
  choice: Господь
  rationale: Стандартная передача титула κύριος; возможный референт не уточняется сверх того, что сказано в греческом тексте.
- source_word: ἑαυτὸν
  choice: сам себя
  rationale: Сохраняет возвратное значение и усиление, выраженное сочетанием ἑαυτόν в конструкции о саморекомендации.
- source_word: ὃν
  choice: тот, кого
  rationale: 'Передаёт эллиптическое противопоставление лиц: не тот, кто рекомендует себя, а тот, кого рекомендует Господь.'
- source_word: γὰρ
  choice: ведь
  rationale: Естественно для современного русского языка выражает пояснительно-обосновывающую связь с предыдущей мыслью.
theological_decisions:
- issue: Кого обозначает ὁ κύριος
  choice: Господь
  alternative: Господь Иисус; Бог
  rationale: В контексте Павла титул часто относится к Иисусу, однако сам стих не уточняет референта. Перевод сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка. Повтор ключевого глагола сохранён, а греческая именная конструкция с δόκιμος естественно передана через «одобрение получает».
