  text: καὶ ἐν ἑτοίμῳ ἔχοντες ἐκδικῆσαι πᾶσαν παρακοήν, ὅταν πληρωθῇ ὑμῶν ἡ ὑπακοή.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/006.yaml
  text: and being ready to punish every act of disobedience[b][a], when your obedience is complete.
translation:
  language: ru
  text: и готовы наказать всякое непослушание[a], когда ваше послушание станет полным[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воздать за всякое непослушание». Греческий глагол может означать совершение правосудия или возмездие; здесь по контексту, вероятно, имеется в виду дисциплинарное наказание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «когда ваше послушание исполнится (завершится)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑτοίμῳ ἔχοντες
  choice: готовы
  rationale: Греческий оборот означает пребывание в готовности. Краткое «готовы» естественно по-русски и сохраняет связь причастного оборота с предыдущим контекстом.
- source_word: ἐκδικῆσαι
  choice: наказать
  rationale: В данном контексте глагол указывает на применение справедливой дисциплинарной меры к непослушанию. «Наказать» передаёт это яснее, чем «отомстить», не приписывая Павлу личной мести.
- source_word: πᾶσαν παρακοήν
  choice: всякое непослушание
  rationale: «Всякое» сохраняет распределительную силу πᾶσαν, а «непослушание» прямо передаёт отказ повиноваться, не добавляя отсутствующего в греческом тексте слова «поступок».
- source_word: ὅταν
  choice: когда
  rationale: В сочетании с сослагательным наклонением слово обозначает будущее условно-временное обстоятельство. В этом контексте русское «когда» естественно выражает ожидаемое условие, не превращая его в многократное «всякий раз, когда».
- source_word: πληρωθῇ
  choice: станет полным
  rationale: Пассивная форма πληρόω здесь говорит о достижении полноты. «Станет полным» сохраняет образ полноты и допускает смысл завершения.
- source_word: ὑμῶν ἡ ὑπακοή
  choice: ваше послушание
  rationale: Естественная русская передача притяжательной конструкции; речь идёт о послушании коринфян.
theological_decisions:
- issue: Характер предполагаемого ответа Павла на противление
  choice: наказание непослушания в рамках применения апостольской власти
  alternative: личная месть противникам или эсхатологический Божий суд
  rationale: Ближайший контекст посвящён апостольской власти и устранению мятежного противления. «Наказать» допускает дисциплинарное применение власти, но сноска сохраняет присущий глаголу оттенок воздаяния и не отождествляет действие с личной местью.
- issue: Условие применения наказания
  choice: послушание адресатов должно достичь полноты
  alternative: послушание адресатов должно быть исполнено или завершено
  rationale: Формулировка сохраняет связь πληρωθῇ с полнотой, не уточняя сверх текста, означает ли это полное послушание всей общины, большинства или завершение определённого процесса.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской речи. Начальное «и» и отсутствие добавленного подлежащего сохраняют синтаксическую связь стиха с предыдущим предложением. Формулировка избегает как архаического «быть в готовности», так и разговорных оборотов.
