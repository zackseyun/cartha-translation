review_pass:
  verdict: approve
  source_fidelity: «И готовы наказать всякое непослушание, когда ваше послушание станет полным» точно передаёт греческий текст. «Готовы» естественно выражает ἐν ἑτοίμῳ ἔχοντες; «наказать» уместно передаёт ἐκδικῆσαι в контексте дисциплинарного осуществления власти, не навязывая мотива личной мести. «Всякое непослушание» сохраняет πᾶσαν παρακοήν, а «когда» адекватно передаёт ожидаемое будущее условно-временное ὅταν с сослагательной формой πληρωθῇ.
  naturalness: Текст звучит естественно на современном литературном русском и сохраняет зависимость начального «и» от предшествующего контекста. «Ваше послушание станет полным» несколько книжно, но ясно, грамматически корректно и хорошо соответствует возвышенному регистру послания.
  terminology: Термины «непослушание», «послушание» и «наказать» согласованы между собой и с контекстом апостольского увещания. Сноски корректно отмечают возможные лексические оттенки «воздать»/«совершить правосудие» и «исполнится»/«завершится», не выдавая интерпретацию за единственно возможный смысл.
