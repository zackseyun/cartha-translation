  text: ἵνα δικαιωθέντες τῇ ἐκείνου χάριτι κληρονόμοι ⸀γενηθῶμεν κατ’ ἐλπίδα ζωῆς αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/007.yaml
  text: so that[a], having been justified by his grace[b], we might become heirs according to the hope of eternal life.
translation:
  language: ru
  text: чтобы, оправданные[a] Его благодатью, мы стали наследниками в надежде на вечную жизнь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «признанные праведными».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «согласно надежде на вечную жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно вводит придаточное цели или результата и сохраняет значение греческого союза.
- source_word: δικαιωθέντες
  choice: оправданные
  rationale: Передаёт аористное страдательное причастие и сохраняет устойчивую связь с новозаветным языком оправдания, не сводя значение только к пояснительному варианту «признанные праведными».
- source_word: τῇ ἐκείνου χάριτι
  choice: Его благодатью
  rationale: Творительный падеж естественно передаёт инструментальный дательный; местоимение «Его» не уточняет референта сверх того, что выражено в греческом тексте.
- source_word: κληρονόμοι
  choice: наследниками
  rationale: Сохраняет образ наследования и является обычным современным соответствием греческому слову.
- source_word: γενηθῶμεν
  choice: мы стали
  rationale: Передаёт вхождение в новое положение и сослагательно-целевую конструкцию после ἵνα без избыточного указания на внешнее причинение.
- source_word: κατ’ ἐλπίδα
  choice: в надежде
  rationale: Это естественное русское выражение для несколько идиоматического оборота с κατά; более буквальное «согласно надежде» возможно, но звучит тяжеловесно.
- source_word: ζωῆς αἰωνίου
  choice: на вечную жизнь
  rationale: При сочетании с русским словом «надежда» нормативное управление требует предлога «на»; выражение сохраняет вечную жизнь как содержание надежды.
theological_decisions:
- issue: Значение δικαιωθέντες в контексте спасения
  choice: оправданные
  alternative: признанные праведными
  rationale: «Оправданные» сохраняет ключевой богословский термин и объём греческого глагола, тогда как альтернатива поясняет один из его смысловых аспектов.
- issue: Референт ἐκείνου
  choice: Его — без явного уточнения референта
  alternative: Божьей благодатью / благодатью Иисуса Христа
  rationale: Местоименная форма сохраняет допустимую в контексте неоднозначность и не навязывает более точного отождествления, чем сам стих.
- issue: Связь оборота κατ’ ἐλπίδα ζωῆς αἰωνίου
  choice: стали наследниками в надежде на вечную жизнь
  alternative: стали наследниками согласно надежде на вечную жизнь
  rationale: Основной вариант естественен по-русски и сохраняет эсхатологическую направленность надежды; сноска отмечает более формальное соответствие κατά и тем самым не скрывает синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с традиционной, но общепонятной богословской лексикой. Синтаксис остаётся близким к греческому, при этом оборот κατ’ ἐλπίδα передан идиоматично; более буквальный вариант вынесен в сноску.
