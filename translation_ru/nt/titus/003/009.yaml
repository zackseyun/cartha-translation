  text: μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ⸀ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/009.yaml
  text: But avoid foolish controversies and genealogies and strife and quarrels about the law[b][a], for they are unprofitable and futile.
translation:
  language: ru
  text: А глупых споров, родословий, распрей и препирательств о законе[a] избегай, потому что они бесполезны и пусты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «препирательств, относящихся к закону»; то есть препирательств о законе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς ζητήσεις
  choice: глупых споров
  rationale: ζητήσεις в данном контексте обозначает не нейтральные вопросы, а спорные обсуждения; сочетание «глупые споры» естественно передаёт их неразумный и бесплодный характер.
- source_word: γενεαλογίας
  choice: родословий
  rationale: Прямой эквивалент сохраняет широту греческого слова и не привязывает его к недоказанной исторической реконструкции.
- source_word: ἔρεις
  choice: распрей
  rationale: «Распри» передают разлад и враждебное противостояние, отличаясь при этом от следующих слов о словесных препирательствах.
- source_word: μάχας νομικὰς
  choice: препирательств о законе
  rationale: μάχας здесь относится к словесным столкновениям, а νομικάς указывает на их связь с законом; перевод не создаёт ошибочного впечатления о судебных тяжбах.
- source_word: περιΐστασο
  choice: избегай
  rationale: Средний императив призывает держаться в стороне; «избегай» кратко и естественно передаёт это повеление.
- source_word: ἀνωφελεῖς
  choice: бесполезны
  rationale: Слово означает отсутствие пользы; современное «бесполезны» ясно передаёт оценку.
- source_word: μάταιοι
  choice: пусты
  rationale: «Пусты» сохраняет образ внутренней пустоты и бессодержательности, не сливая значение с предшествующим «бесполезны».
theological_decisions:
- issue: Характер родословий и препирательств о законе
  choice: Передать выражения обобщённо, не уточняя конкретную религиозную или еретическую систему.
  alternative: Истолковать родословия как споры о еврейском происхождении либо как ранние гностические спекуляции.
  rationale: Сам стих не позволяет с достаточной уверенностью установить конкретный исторический фон; обобщённый перевод сохраняет неоднозначность источника.
- issue: Значение νομικὰς
  choice: 'Понимать как относящееся к закону: «о законе».'
  alternative: Передать как «юридических» или «судебных».
  rationale: В контексте Пастырских посланий речь, вероятнее всего, о спорах вокруг закона, тогда как «юридические» могло бы ошибочно указывать на судебные разбирательства.
translation_notes:
  register: Современный литературный русский язык с краткой, увещательной интонацией. Начальное «А» передаёт противопоставление δέ; порядок перечисления сохранён. Термины оставлены достаточно широкими, без конфессиональных уточнений.
