id: TIT.3.1
reference: Titus 3:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὑπομίμνῃσκε αὐτοὺς ⸀ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/001.yaml
  text: Remind them to be subject to rulers and authorities[a], to be obedient, to be ready for every good work,
translation:
  language: ru
  text: Напоминай им, чтобы они подчинялись правителям и властям[a], повиновались, были готовы ко всякому доброму делу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подчинялись правителям и властям и повиновались им».'
    reason: В греческом тексте «повиновались» можно теснее связать с предшествующим упоминанием правителей и властей.
lexical_decisions:
- source_word: Ὑπομίμνῃσκε
  choice: Напоминай
  rationale: Настоящее повелительное наклонение выражает продолжающееся наставление. Несовершенный вид «напоминай» естественно передаёт эту повторяемость.
- source_word: αὐτοὺς
  choice: им
  rationale: Местоимение относится к верующим на Крите, которых Тит должен наставлять.
- source_word: ἀρχαῖς
  choice: правителям
  rationale: В данном гражданском контексте слово обозначает тех, кто стоит у власти, а не духовные силы. «Правители» сохраняет личностную сторону выражения.
- source_word: ἐξουσίαις
  choice: властям
  rationale: В сочетании с ἀρχαῖς обозначает официальные властные структуры; отдельный перевод сохраняет двучленность греческого выражения.
- source_word: ὑποτάσσεσθαι
  choice: подчинялись
  rationale: Глагол выражает признание установленного порядка и подчинение власти, не добавляя идеи безусловного рабского послушания.
- source_word: πειθαρχεῖν
  choice: повиновались
  rationale: Слово означает повиноваться тем, кто обладает властью. Русский глагол кратко и естественно продолжает ряд наставлений.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: ко всякому доброму делу
  rationale: Предлог πρός здесь указывает на направленность готовности. «Ко всякому доброму делу» точно и естественно передаёт нравственный смысл выражения.
- source_word: ἑτοίμους εἶναι
  choice: были готовы
  rationale: Оборот обозначает постоянное состояние готовности и естественно включается в придаточное предложение после «чтобы».
theological_decisions:
- issue: Пределы подчинения гражданским властям
  choice: Стих передан как общее наставление подчиняться правителям и властям и повиноваться им, без добавления идеи абсолютного повиновения при любых обстоятельствах.
  alternative: Истолковать формулировку как требование безусловного повиновения государственной власти.
  rationale: Текст прямо призывает к гражданскому подчинению, но не оговаривает здесь его пределы. Перевод сохраняет это напряжение и не вводит отсутствующих в стихе уточнений.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Несовершенные виды глаголов передают продолжающийся характер наставления; лексика остаётся понятной обычному читателю.
