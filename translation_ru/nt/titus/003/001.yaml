  source_fidelity: 'Перевод точно передаёт все элементы греческой цепочки инфинитивов: продолжающееся наставление «Напоминай», подчинение правителям и властям, повиновение и готовность ко всякому доброму делу. Дативное «правителям и властям» естественно относится как к «подчинялись», так и к подразумеваемому дополнению при «повиновались».'
