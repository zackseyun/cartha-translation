  text: ἦμεν γάρ ποτε καὶ ἡμεῖς ἀνόητοι, ἀπειθεῖς, πλανώμενοι, δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις, ἐν κακίᾳ καὶ φθόνῳ διάγοντες, στυγητοί, μισοῦντες ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/003.yaml
  text: For we ourselves also were once foolish[a], disobedient, being led astray, enslaved to various desires and pleasures, spending our lives in malice and envy, hateful[b], hating one another.
translation:
  language: ru
  text: Ведь и мы сами когда-то были неразумны, непослушны, заблуждались[a], были порабощены различными желаниями и удовольствиями, проводили жизнь в злобе и зависти, были ненавистны[b] и ненавидели друг друга.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были введены в заблуждение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «были ненавидимы». Греческое прилагательное может означать как «ненавистные, вызывающие ненависть», так и «ненавидимые».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦμεν γάρ ποτε καὶ ἡμεῖς
  choice: Ведь и мы сами когда-то были
  rationale: «Ведь» передаёт пояснительную связь γάρ с предыдущим контекстом; «и мы сами» сохраняет включающее усиление καὶ ἡμεῖς, а «когда-то» — временное значение ποτε.
- source_word: ἀνόητοι
  choice: неразумны
  rationale: Передаёт недостаток понимания и нравственного рассуждения, не сводя значение к интеллектуальной неспособности.
- source_word: ἀπειθεῖς
  choice: непокорны
  rationale: Слово выражает отказ повиноваться или поддаваться убеждению; «непокорны» естественно звучит в данном перечне нравственных качеств.
- source_word: πλανώμενοι
  choice: сбивались с пути
  rationale: Сохраняет образ уклонения с верного пути и не ограничивает смысл лишь интеллектуальным обманом; возможный пассивный оттенок отмечен в сноске.
- source_word: δουλεύοντες
  choice: были порабощены
  rationale: Передаёт сильный смысл рабской зависимости от желаний и удовольствий, а не просто добровольного служения им.
- source_word: ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις
  choice: различными желаниями и удовольствиями
  rationale: «Желания» шире сексуальной похоти и подходит для разных неупорядоченных стремлений; ποικίλαις по смыслу относится к обеим группам.
- source_word: ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  choice: проводили жизнь в злобе и зависти
  rationale: Передаёт длительный образ жизни; в межличностном контексте κακία естественно означает «злоба», а φθόνος — «зависть».
- source_word: στυγητοί
  choice: были отвратительны
  rationale: Активно-качественное понимание хорошо вписывается в перечень прежних пороков. Возможное пассивное значение «ненавидимы» сохранено в сноске.
- source_word: μισοῦντες ἀλλήλους
  choice: ненавидели друг друга
  rationale: Прямой и естественный русский эквивалент причастия с взаимным местоимением.
theological_decisions:
- issue: Сила образа δουλεύοντες при желаниях и удовольствиях как господах
  choice: были порабощены различными желаниями и удовольствиями
  alternative: служили различным желаниям и удовольствиям
  rationale: Греческий глагол обозначает рабское служение и здесь подчёркивает нравственную зависимость, не требуя привнесения дополнительной догматической системы.
- issue: Активное или пассивное значение στυγητοί
  choice: были отвратительны
  alternative: были ненавидимы
  rationale: Обе трактовки лексически возможны. В основном тексте выбрано качественное значение, соответствующее перечню пороков, а пассивное сохранено в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; перечень сохранён как единое ритмичное предложение. Лексика понятна широкому читателю, но сохраняет достоинство и нравственную силу исходного текста.
