source:
  edition: SBLGNT
  text: Ὅταν πέμψω Ἀρτεμᾶν πρὸς σὲ ἢ Τυχικόν, σπούδασον ἐλθεῖν πρός με εἰς Νικόπολιν, ἐκεῖ γὰρ κέκρικα παραχειμάσαι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/012.yaml
  text: When I send Artemas or Tychicus to you[a], make every effort to come to me at Nicopolis[b], for I have decided to spend the winter there.
translation:
  language: ru
  text: Когда я пошлю к тебе Артему или Тихика, постарайся приехать ко мне в Никополь, потому что я решил провести там зиму.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν πέμψω
  choice: Когда я пошлю
  rationale: Ὅταν с аористом сослагательного наклонения указывает здесь на ожидаемое в будущем конкретное событие; русское будущее время естественно передаёт этот смысл.
- source_word: Ἀρτεμᾶν
  choice: Артему
  rationale: Имя передано в принятой русской библейской форме; винительный падеж обусловлен глаголом «пошлю».
- source_word: ἢ Τυχικόν
  choice: или Тихика
  rationale: ἢ выражает простую альтернативу между двумя возможными посланниками; имя передано в принятой русской форме.
- source_word: σπούδασον
  choice: постарайся скорее
  rationale: Императив передаёт усердное, намеренное и достаточно скорое действие; сочетание естественно по-русски и не сводит смысл только к поспешности.
- source_word: ἐλθεῖν πρός με
  choice: прийти ко мне
  rationale: Инфинитив зависит от σπούδασον, а πρός обозначает движение по направлению к говорящему.
- source_word: εἰς Νικόπολιν
  choice: в Никополь
  rationale: εἰς указывает на направление и место назначения; русская конструкция «прийти ко мне в Никополь» звучит естественно.
- source_word: γὰρ
  choice: потому что
  rationale: Союз вводит основание предшествующей просьбы; «потому что» ясно выражает причинную связь в современном русском языке.
- source_word: κέκρικα παραχειμάσαι
  choice: я решил провести там зиму
  rationale: Перфект κέκρικα выражает принятое и сохраняющее силу решение, а παραχειμάσαι — пребывание где-либо в течение зимы.
