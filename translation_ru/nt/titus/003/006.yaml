lexical_decisions:
- source_word: οὗ
  choice: которого
  rationale: Относительное местоимение в родительном падеже относится к Святому Духу из предыдущего стиха. Русская форма «которого» согласуется с мужским родом слова «Дух» и естественно сохраняет связь между стихами.
- source_word: ἐξέχεεν
  choice: излил
  rationale: Глагол ἐκχέω обозначает излияние; «излил» — устойчивое и понятное русское выражение применительно к Святому Духу.
- source_word: ἐφ’ ἡμᾶς
  choice: на нас
  rationale: ἐπί с винительным падежом передаёт направленность действия; «на нас» точно и естественно выражает её по-русски.
- source_word: πλουσίως
  choice: обильно
  rationale: Наречие означает полноту и изобилие. Сочетание «обильно излил» естественно в современном литературном русском и точнее по смыслу, чем буквальное «богато».
- source_word: διὰ
  choice: через
  rationale: διά с родительным падежом здесь указывает на посредство; «через» сохраняет это значение без истолковывающего расширения.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессию
  rationale: Χριστός передано как титул «Мессия», а не как непрозрачная часть имени. В русском после предлога «через» всё сочетание закономерно стоит в винительном падеже.
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: нашего Спасителя
  rationale: Передаёт титул σωτήρ и притяжательное значение ἡμῶν естественной русской конструкцией; приложение относится к Иисусу Мессии.
theological_decisions:
- issue: Референт относительного местоимения οὗ
  choice: 'Местоимение относится к Святому Духу, упомянутому в Тит 3:5: Бог обильно излил Его на нас.'
  alternative: Теоретически связь можно передать менее личностно, однако русский грамматический род слова «Дух» всё равно требует формы «которого».
  rationale: Ближайший антецедент — «Святой Дух» в предыдущем стихе. Перевод сохраняет эту синтаксическую связь, не добавляя имени действующего лица, отсутствующего в греческом тексте.
- issue: Передача Χριστοῦ
  choice: Иисуса Мессию
  alternative: Иисуса Христа
  rationale: Здесь Χριστός сохраняет значение титула и стоит рядом с другим титулом — «Спаситель». Передача «Мессия» делает смысл титула прозрачным; традиционная форма указана в примечании.
- issue: Подлежащее при ἐξέχεεν
  choice: Местоимение «Он» сохранено без поясняющей замены на «Бог».
  alternative: «которого Бог обильно излил»
  rationale: Греческий текст содержит подразумеваемое подлежащее, восстанавливаемое из контекста. Русское «Он» сохраняет межстиховую связь и не вносит в сам стих отсутствующего существительного.
translation_notes:
  register: Современный литературный русский с достоинством библейского стиля. «Обильно излил» звучит естественнее буквального «богато излил». Прописная буква в «Он» поддерживает принятую русскую библейскую норму, не меняя содержания исходного текста; «Спаситель» оформлен как христологический титул.
