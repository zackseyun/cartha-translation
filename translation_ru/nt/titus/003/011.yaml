  text: зная, что такой человек сбился с пути[a] и грешит, будучи самоосуждённым[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «уклонился»; возможно также «извращён». Греческая форма указывает на состояние, возникшее вследствие прежнего уклонения.
    reason: lexical_alternative
  - marker: b
    text: Или «осуждённым самим собой». Это слово может означать осуждённого собственными поступками или собственным свидетельством против себя.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: зная
  rationale: Деепричастная форма сохраняет связь с повелением предыдущего стиха и не уточняет без необходимости, является ли оборот причинным.
- source_word: ἐξέστραπται
  choice: сбился с пути
  rationale: Перфект передаёт нынешнее устойчивое состояние как результат прежнего уклонения; этот русский оборот естественен и не сужает значение до нравственной испорченности.
- source_word: ὁ τοιοῦτος
  choice: такой человек
  rationale: Выражение указывает на упомянутого ранее сеющего разделения человека. В русском слове «человек» сохраняется отсылка к единичному лицу без неестественного подчёркивания пола.
- source_word: ἁμαρτάνει
  choice: грешит
  rationale: Настоящее время описывает продолжающееся поведение, однако русский глагол несовершенного вида передаёт это без добавления слова «продолжает».
- source_word: ὢν
  choice: сам навлекая
  rationale: Деепричастный оборот естественно связывает заключительную характеристику с предыдущим описанием.
- source_word: αὐτοκατάκριτος
  choice: сам навлекая на себя осуждение
  rationale: Формулировка передаёт, что человека осуждают его собственные поступки или свидетельство, не утверждая непременно, что он сознательно произносит приговор самому себе.
theological_decisions:
- issue: Смысл αὐτοκατάκριτος
  choice: сам навлекая на себя осуждение
  alternative: сам себя осуждая; осуждённый самим собой
  rationale: Перевод сохраняет мысль о самообличающем характере состояния и поведения человека, не превращая её в исчерпывающее утверждение об окончательном суде и не предполагая обязательно сознательного самоосуждения.
- issue: Указание на лицо в ὁ τοιοῦτος
  choice: такой человек
  alternative: такой мужчина
  rationale: В контексте речь идёт о конкретном сеющем разделения человеке; грамматический мужской род греческого выражения сам по себе не требует подчёркивать биологический пол в русском переводе.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет причастную связь с предыдущим стихом. Обороты выбраны как понятные обычному читателю, при этом смысл греческого перфекта и неоднозначность заключительного прилагательного пояснены в сносках.
