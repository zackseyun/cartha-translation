  text: ζηνᾶν τὸν νομικὸν καὶ ⸀Ἀπολλῶν σπουδαίως πρόπεμψον, ἵνα μηδὲν αὐτοῖς λείπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/013.yaml
  text: Diligently send Zenas the lawyer and Apollos on their way[a], so that they may lack nothing.
translation:
  language: ru
  text: Зину, знатока закона, и Аполлоса старательно снаряди в путь[a], чтобы они ни в чём не нуждались.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «усердно помоги Зине, знатоку закона, и Аполлосу отправиться в путь». Глагол может подразумевать практическую помощь и снабжение необходимым для путешествия, а не только проводы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηνᾶν
  choice: Зину
  rationale: Имя Ζηνᾶς передано традиционной русской библейской формой «Зина»; винительный падеж — «Зину».
- source_word: τὸν νομικὸν
  choice: знатока закона
  rationale: νομικός обозначает человека, сведущего в законе. «Знаток закона» сохраняет возможную связь как с юридической профессией, так и с религиозно-правовой областью, не сужая значение до современного «юриста».
- source_word: Ἀπολλῶν
  choice: Аполлоса
  rationale: Имя передано принятой русской библейской формой «Аполлос»; винительный падеж — «Аполлоса».
- source_word: σπουδαίως
  choice: старательно
  rationale: Наречие выражает усердие, серьёзную заботу и тщательность; «старательно» естественно относится к практической помощи путникам и не сводит смысл к поспешности.
- source_word: πρόπεμψον
  choice: снаряди в путь
  rationale: В контексте путешествия προπέμπω подразумевает не просто отправить или проводить, но помочь отправляющимся необходимым для дороги. «Снаряди в путь» кратко передаёт эту практическую поддержку.
- source_word: ἵνα μηδὲν αὐτοῖς λείπῃ
  choice: чтобы они ни в чём не нуждались
  rationale: Естественная русская передача целевого придаточного, сохраняющая широкий охват необходимого для путешествия.
theological_decisions: []
