  text: ὅτε δὲ ἡ χρηστότης καὶ ἡ φιλανθρωπία ἐπεφάνη τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/004.yaml
  text: But when the kindness and love for humanity of God our Savior appeared,[a]
translation:
  language: ru
  text: Но когда явились доброта Бога, нашего Спасителя, и Его любовь к людям[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человеколюбие»; греческое слово означает благожелательность или любовь к людям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Но когда
  rationale: ὅτε вводит придаточное времени, а δέ обозначает мягкое противопоставление прежнему состоянию людей спасительному действию Бога.
- source_word: χρηστότης
  choice: доброта
  rationale: Слово обозначает благость, доброжелательность и доброту в отношении к другим; «доброта» естественно звучит по-русски и не сливается по смыслу со следующим существительным.
- source_word: φιλανθρωπία
  choice: любовь к людям
  rationale: Передаёт направленную к людям благожелательную любовь без архаичности и без современных специальных ассоциаций, которые может вызывать слово «гуманность».
- source_word: ἐπεφάνη
  choice: явились
  rationale: Глагол означает появление или явление. Русское множественное число согласовано с двумя однородными подлежащими; перевод сохраняет образ явления, не уточняя его способ.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Бога, нашего Спасителя
  rationale: Родительный оборот относится и к доброте, и к любви к людям. Перестройка фразы с повторным местоимением «Его» делает эту связь ясной и естественной по-русски, а приложение «нашего Спасителя» сохраняет титул исходного текста.
theological_decisions:
- issue: К кому относится титул «Бог, наш Спаситель»
  choice: Перевод сохраняет титул применительно к Богу в данном стихе, не добавляя в основной текст уточнения о Лице.
  alternative: На основании ближайшего контекста понимать здесь Бога Отца, отличая Его от Иисуса Христа, названного в стихе 6.
  rationale: В Пастырских посланиях титул «Бог, наш Спаситель» обычно относится к Отцу, тогда как Спасителем именуется и Иисус Христос. Сам стих 4 не выражает это различение прямо, поэтому перевод не должен разрешать вопрос поясняющей вставкой.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов перестроен ради ясности: местоимение «Его» явно связывает «любовь к людям» с Богом, не меняя содержания. Конечная запятая сохранена, поскольку стих представляет собой незавершённое придаточное времени, продолжающееся в следующих стихах.'
