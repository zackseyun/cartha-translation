base_translation:
  language: en
  yaml_path: translation/nt/titus/003/014.yaml
  text: And let our people also learn to engage in good works for necessary needs[c][b][a], so that they may not be unfruitful.
translation:
  language: ru
  text: Пусть и наши[a] учатся посвящать себя добрым делам[b], чтобы удовлетворять насущные нужды[c] и не быть бесплодными.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наши люди»; буквально: «наши».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «заниматься добрыми делами»; возможно также: «возглавлять добрые дела».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «неотложные нужды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μανθανέτωσαν
  choice: пусть … учатся
  rationale: Форма настоящего повелительного наклонения передана русской побудительной конструкцией, сохраняющей характер продолжающегося наставления.
- source_word: οἱ ἡμέτεροι
  choice: наши
  rationale: Субстантивированное местоимение буквально означает «наши» и в контексте указывает на людей, принадлежащих к той же общине; краткая форма естественна по-русски и не вводит ограничения по полу.
- source_word: καλῶν ἔργων
  choice: добрым делам
  rationale: Устойчивое и прозрачное соответствие, сохраняющее повторяющуюся в Послании к Титу тему добрых дел.
- source_word: προΐστασθαι
  choice: посвящать себя
  rationale: В сочетании с «добрыми делами» глагол выражает деятельную и постоянную приверженность; при этом его возможное значение «возглавлять» сохранено в примечании.
- source_word: εἰς τὰς ἀναγκαίας χρείας
  choice: ради насущных нужд
  rationale: Передаёт целевую направленность добрых дел на реальные необходимые потребности без неестественного русского повтора «необходимые нужды».
- source_word: ἵνα μὴ ὦσιν ἄκαρποι
  choice: чтобы не быть бесплодными
  rationale: Сохраняет целевую конструкцию и исходную метафору отсутствия плода, не сводя её к более узкому значению «бесполезными».
theological_decisions:
- issue: Круг лиц, обозначенных οἱ ἡμέτεροι
  choice: «наши» — члены христианской общины, к которой принадлежат Павел и Тит
  alternative: «наши люди»; «наши» в противопоставлении посторонним
  rationale: Выражение носит общинный и relational характер, но само по себе не уточняет пол и не требует жёсткого противопоставления внешним.
- issue: Значение προΐστασθαι при καλῶν ἔργων
  choice: деятельно посвящать себя добрым делам
  alternative: заниматься добрыми делами; стоять во главе добрых дел
  rationale: Контекст Тит 3:8,14 поддерживает практическую приверженность добрым делам, однако семантическая возможность руководящей инициативы не устранена и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным побудительным синтаксисом. Формулировка сохраняет метафору плодотворности и избегает канцелярского сочетания «для удовлетворения необходимых потребностей».
