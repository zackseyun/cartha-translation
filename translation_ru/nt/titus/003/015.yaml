  text: Ἀσπάζονταί σε οἱ μετ’ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/015.yaml
  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: ru
  text: Все, кто со мной, приветствуют тебя. Приветствуй тех, кто любит нас в вере.[a] Благодать да будет со всеми вами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в общей вере»; возможно также: «в верности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: приветствуют
  rationale: Стандартное эпистолярное значение ἀσπάζομαι; естественно передаёт приветствие без лишнего расширения.
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: все, кто со мной
  rationale: Сохраняет πάντες («все») и значение совместного пребывания с автором.
- source_word: ἄσπασαι
  choice: приветствуй
  rationale: Прямая и естественная передача повелительной формы ἀσπάζομαι в заключительном приветствии.
- source_word: φιλοῦντας
  choice: любит
  rationale: Передаёт личную привязанность, выраженную φιλέω, простым и уместным русским глаголом.
- source_word: ἐν πίστει
  choice: в вере
  rationale: 'Сохраняет наиболее прямое значение πίστις и открытую грамматическую связь: вера может пониматься как сфера или общая основа любви.'
- source_word: ἡ χάρις
  choice: Благодать
  rationale: Традиционная и точная передача χάρις в апостольском благословении.
- source_word: μετὰ πάντων ὑμῶν
  choice: да будет со всеми вами
  rationale: Естественно восполняет подразумеваемую связку и сохраняет πάντων — «всеми».
theological_decisions:
- issue: Значение πίστις в выражении ἐν πίστει
  choice: в вере
  alternative: в общей вере; в верности
  rationale: «В вере» наиболее непосредственно передаёт греческое выражение и не уточняет сверх текста, идёт ли речь о сфере личной веры или об общей христианской вере. Значение «в верности» возможно лексически, но здесь менее вероятно.
translation_notes:
  register: Современный литературный русский язык; краткое и достойное эпистолярное завершение. Частица «да» в благословении сохраняет возвышенность, оставаясь понятной современному читателю.
