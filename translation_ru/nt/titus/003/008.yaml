source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ⸀ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/008.yaml
  text: This saying is trustworthy[a], and concerning these things I want you to insist confidently, so that those who have believed God may be careful to devote themselves to good works[b]. These things are good and beneficial for people.
translation:
  language: ru
  text: Это высказывание заслуживает доверия. Я хочу, чтобы ты настойчиво утверждал это[a], чтобы те, кто поверил Богу[b], старались заниматься добрыми делами. Всё это хорошо и полезно людям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твёрдо настаивал на этом» или «уверенно утверждал это». Греческий глагол обозначает уверенное и настойчивое утверждение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «уверовавшие в Бога» или «доверившиеся Богу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Это слово достойно доверия
  rationale: Передаёт пастырскую формулу о достоверности предшествующего высказывания или вести; «слово» сохраняет единственное число λόγος, а вся фраза звучит ясно и достойно в современном русском языке.
- source_word: περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι
  choice: Я хочу, чтобы ты настойчиво утверждал всё это
  rationale: Конструкция передаёт личное поручение Титу твёрдо и убедительно подтверждать сказанное выше. «Всё это» естественно соотносится с множественным τούτων, не ограничивая его одним тезисом.
- source_word: ἵνα φροντίζωσιν
  choice: чтобы ... старались
  rationale: «Старались» естественно выражает обдуманную заботу и целенаправленное усилие, заложенные в φροντίζω, без архаичного оборота.
- source_word: καλῶν ἔργων προΐστασθαι
  choice: посвящать себя добрым делам
  rationale: В данном контексте προΐστασθαι обозначает деятельное, постоянное участие и усердие, а не обязательно руководство другими; «добрые дела» сохраняет устойчивое соответствие καλὰ ἔργα.
- source_word: οἱ πεπιστευκότες θεῷ
  choice: поверившие Богу
  rationale: 'Прямо сохраняет дательный θεῷ и совершенный характер причастия: речь о людях, которые поверили Богу и остаются в таком отношении к Нему.'
- source_word: ταῦτά ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις
  choice: Всё это хорошо и полезно людям
  rationale: «Всё это» естественно передаёт собирательную отсылку ταῦτα, не решая однозначно, относится ли она ко всему наставлению или прежде всего к названным делам; «людям» передаёт родовое значение ἀνθρώποις.
theological_decisions:
- issue: Соотношение веры и добрых дел
  choice: 'Добрые дела представлены как ожидаемый плод уже состоявшейся веры: «поверившие Богу ... посвящать себя добрым делам».'
  alternative: Понять добрые дела как основание принятия Богом или как заслугу для спасения.
  rationale: Греческий порядок мысли сначала называет поверивших Богу, а затем побуждает их к добрым делам; перевод сохраняет эту последовательность, не добавляя конфессионального толкования.
- issue: Значение θεῷ при πεπιστευκότες
  choice: поверившие Богу
  alternative: уверовавшие в Бога; доверившиеся Богу
  rationale: Дательный падеж позволяет непосредственно передать мысль о доверии Божьему слову, однако конструкция может шире обозначать веру в Бога или доверие Ему; варианты сохранены в примечании.
- issue: Референт ταῦτα в заключительном предложении
  choice: Всё это
  alternative: Эти дела; эти наставления
  rationale: Местоимение может отсылать к изложенным истинам и наставлениям в целом либо более непосредственно к добрым делам. Собирательный оборот сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным библейским звучанием. Избегаются архаизмы и канцелярские обороты; синтаксис разделён на короткие предложения ради естественной читаемости. Маркеры [a] и [b] помещены непосредственно после соответствующих выражений.
