lexical_decisions:
- source_word: αἱρετικὸν
  choice: вносящего разделения
  rationale: В данном контексте слово, вероятнее всего, обозначает человека, создающего группировки и расколы. Такой перевод передаёт практический смысл и не привносит более позднее специальное значение слова «еретик».
- source_word: ἄνθρωπον
  choice: человека
  rationale: Естественное русское обозначение отдельного лица; в винительном падеже согласуется с определением и не подчёркивает пол там, где контекст этого не требует.
- source_word: μετὰ μίαν καὶ δευτέραν νουθεσίαν
  choice: после первого и второго вразумления
  rationale: Оборот указывает на две последовательные попытки исправить человека. «Вразумление» сохраняет как предостерегающий, так и наставительный оттенок νουθεσία.
- source_word: παραιτοῦ
  choice: отвергни
  rationale: Императив выражает решительный отказ от дальнейшего принятия или общения с упорствующим человеком; «отвергни» кратко передаёт дисциплинарную силу глагола.
theological_decisions:
- issue: Передавать ли αἱρετικὸν позднейшим догматическим термином «еретик» или его вероятным значением в контексте общинных разделений
  choice: человека, вносящего разделения
  alternative: еретика; человека, создающего группировки
  rationale: Выбранный вариант сохраняет вероятный смысл греческого слова в I веке и не сводит стих исключительно к формально определённой doctrинальной ереси.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формулировкой. Синтаксический порядок сохраняет акцент исходного текста на человеке, вызывающем разделения; «после первого и второго вразумления» ясно показывает необходимость повторной попытки исправления перед отвержением.
