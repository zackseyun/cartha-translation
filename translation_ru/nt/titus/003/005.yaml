source:
  edition: SBLGNT
  text: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ⸀ἃ ἐποιήσαμεν ἡμεῖς ἀλλὰ κατὰ ⸂τὸ αὐτοῦ ἔλεος⸃ ἔσωσεν ἡμᾶς διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/005.yaml
  text: not from works done in righteousness, which we ourselves did, but according to his mercy he saved us, through the washing of regeneration and renewal by the Holy Spirit,
translation:
  language: ru
  text: Он спас нас не благодаря делам, совершённым нами в праведности[a], а по Своей милости — через омовение возрождения[b] и обновление Святым Духом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в справедливости». Греческое слово может означать как «праведность», так и «справедливость»; здесь по контексту выбрано «праведность».'
    reason: alternative_reading
  - marker: b
    text: «Омовение» может указывать на крещение, на образ очищения или на оба смысла; греческий текст не требует выбирать один из них в основном переводе.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «обновление Святого Духа». Греческая конструкция допускает несколько способов выразить связь Святого Духа с обновлением.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ἃ ἐποιήσαμεν ἡμεῖς
  choice: не за дела, совершённые нами в праведности
  rationale: ἐκ обозначает основание или источник; по-русски «не за дела» естественно выражает отрицание основания спасения. «Совершённые нами» передаёт относительное предложение и подчёркнутое ἡμεῖς, а «в праведности» сохраняет значение δικαιοσύνη, не превращая его в оценочное прилагательное.
- source_word: ἀλλὰ κατὰ τὸ αὐτοῦ ἔλεος
  choice: а по Своей милости
  rationale: κατά выражает соответствие и основание; «по Своей милости» сохраняет противопоставление человеческим делам. Возвратное «Своей» естественно соотносится в русском с подлежащим «Он».
- source_word: ἔσωσεν ἡμᾶς
  choice: Он спас нас
  rationale: Стандартная и контекстуально точная передача сотериологического значения σῴζω. Сказуемое вынесено в начало для ясной и естественной русской структуры, без изменения логического акцента.
- source_word: διὰ λουτροῦ
  choice: через омовение
  rationale: διά с родительным выражает средство. «Омовение» сохраняет образ мытья или очищения и не решает в основном тексте, имеется ли в виду крещение, метафорическое очищение или оба смысла.
- source_word: παλιγγενεσίας
  choice: возрождения
  rationale: «Возрождение» точно и традиционно передаёт идею нового рождения в παλιγγενεσία, оставаясь понятным современному читателю.
- source_word: καὶ ἀνακαινώσεως πνεύματος ἁγίου
  choice: и обновление Святым Духом
  rationale: «Обновление» передаёт отглагольное существительное ἀνακαίνωσις, а творительный «Святым Духом» естественно выражает вероятное значение источника или деятеля при генитиве πνεύματος ἁγίου.
theological_decisions:
- issue: Значение δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: В данном контексте «праведность» лучше сохраняет широкий павловский и нравственно-религиозный смысл; возможное значение «справедливость» отмечено, но не подставлено в основной текст.
- issue: Смысл λουτρόν в выражении о спасении
  choice: нейтральное «омовение», без явного добавления «крещение»
  alternative: крещальное омовение или метафорическое очищение
  rationale: Греческое слово допускает крещальную отсылку и образ очищения, но само по себе не требует устранить эту богословскую неоднозначность.
- issue: Связь πνεύματος ἁγίου с ἀνακαινώσεως
  choice: «обновление Святым Духом», то есть вероятная деятельность или источник обновления
  alternative: «обновление Святого Духа»; возможная связь со всем сочетанием «омовение возрождения и обновления»
  rationale: Ближайшая синтаксическая связь — с «обновлением», но греческий родительный допускает менее определённое отношение; примечание сохраняет альтернативу.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского регистра. Синтаксис перестроен естественно для русского: «Он спас нас» поставлено в начало, при этом сохранено противопоставление не делам, а Божьей милости. Заглавные буквы в «Своей» и «Святым Духом» соответствуют принятому русскому библейскому оформлению.'
