  text: to slander no one[a], to be peaceable, gentle[c][b], showing all meekness toward all people.
translation:
  language: ru
  text: никого не злословить[a], быть не склонными к ссорам[b], уступчивыми и во всей полноте проявлять кротость[c] ко всем людям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никого не порочить» или «ни о ком не говорить дурного». Глагол может обозначать оскорбительную и порочащую речь шире, чем собственно клевету.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «быть миролюбивыми»; буквально речь идёт о тех, кто не склонен вступать в ссоры и распри.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «проявлять всякую мягкость». Слово πραΰτης соединяет мягкость с кротостью и отсутствием агрессивного самоутверждения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδένα
  choice: никого
  rationale: Винительный падеж μηδείς служит дополнением при βλασφημεῖν; «никого» естественно передаёт всеобщий охват запрета.
- source_word: βλασφημεῖν
  choice: злословить
  rationale: В данном контексте речь идёт о порочащей или оскорбительной речи против людей, а не о богохульстве. «Злословить» передаёт более широкий смысл, чем юридически окрашенное «клеветать».
- source_word: ἀμάχους εἶναι
  choice: быть не склонными к ссорам
  rationale: Прилагательное обозначает отказ от драк, распрей и сварливости. Выбранная формулировка сохраняет отрицательную форму и звучит естественно по-русски.
- source_word: ἐπιεικεῖς
  choice: снисходительными
  rationale: Слово выражает мягкость, уступчивость, рассудительную терпимость. «Снисходительными» отличает это качество от πραΰτης далее в стихе.
- source_word: πᾶσαν ἐνδεικνυμένους πραΰτητα
  choice: проявлять совершенную кротость
  rationale: Причастие ἐνδεικνυμένους передаёт явное проявление качества; πᾶσαν усиливает его полноту, а πραΰτης означает кроткую, неагрессивную мягкость.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: ко всем людям
  rationale: Оборот обозначает отношение к другим; ἀνθρώπους употреблено в общем смысле и охватывает всех людей независимо от пола.
theological_decisions:
- issue: Всеобщий охват πρὸς πάντας ἀνθρώπους
  choice: ко всем людям
  alternative: ко всем человекам; ко всем
  rationale: ἄνθρωποι здесь означает людей вообще, а не только мужчин. Перевод сохраняет универсальность наставления без ненужной гендерной двусмысленности.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Инфинитивная последовательность сохранена в соответствии с зависимостью наставлений от управляющей формы предыдущего стиха. Лексически различены ἐπιεικεῖς («снисходительными») и πραΰτητα («кротость»).
