lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предыдущим наставлением естественным для современного русского языка способом.
- source_word: πολλοὶ καὶ ἀνυπότακτοι
  choice: много непокорных
  rationale: Прилагательное употреблено субстантивно; русская конструкция сохраняет количественный смысл и обозначает людей без избыточного добавления существительного. Καί принято как усилительное или присоединительное в текстовом варианте SBLGNT и отдельно не выражено, поскольку по-русски это звучало бы неестественно.
- source_word: ματαιολόγοι
  choice: пустословов
  rationale: Точно и естественно обозначает тех, чьи речи пусты и бесполезны, сохраняя отрицательную оценку греческого слова.
- source_word: φρεναπάται
  choice: обманщиков
  rationale: Передаёт основное значение — людей, вводящих других в заблуждение; буквальный оттенок обмана ума в русском основном тексте был бы тяжеловесен.
- source_word: μάλιστα
  choice: особенно
  rationale: Выделяет внутри более широкой группы тех, к кому утверждение относится в особой степени.
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: среди обрезанных
  rationale: Сохраняет связь с обрезанием и не добавляет прямо не названные в греческом тексте слова «партия», «иудеи» или «иудействующие».
theological_decisions:
- issue: Кого обозначает выражение οἱ ἐκ τῆς περιτομῆς
  choice: среди обрезанных
  alternative: из сторонников обрезания; среди иудеев или иудействующих противников
  rationale: Контекст, вероятно, указывает на иудейских или иудействующих противников, однако греческое выражение компактно и не уточняет их статус. Основной текст сохраняет эту неоднозначность, а примечание разъясняет возможный смысл.
translation_notes:
  register: Современный литературный русский язык; краткая, строгая и понятная формулировка. Сохранены пояснительная связь с предыдущим стихом, резкая нравственная характеристика и неоднозначность последнего выражения.
