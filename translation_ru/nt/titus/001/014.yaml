  text: μὴ προσέχοντες Ἰουδαϊκοῖς μύθοις καὶ ἐντολαῖς ἀνθρώπων ἀποστρεφομένων τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/014.yaml
  text: not paying attention to Jewish myths and commandments of people who turn away from the truth[a].
translation:
  language: ru
  text: не обращая внимания на иудейские мифы и предписания людей, отворачивающихся от истины[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не увлекаясь иудейскими мифами и человеческими предписаниями людей, отворачивающихся от истины».'
    reason: 'Лексическая альтернатива: προσέχω может обозначать не только обращение внимания, но и увлечение, приверженность; ἐντολαῖς ἀνθρώπων возможно передать как «человеческие предписания».'
lexical_decisions:
- source_word: μὴ προσέχοντες
  choice: не внимая
  rationale: Причастный оборот продолжает наставление предыдущего контекста и обозначает то, чего слушателям не следует делать. «Не внимая» естественно и ёмко передаёт направленное внимание к чему-либо.
- source_word: Ἰουδαϊκοῖς μύθοις
  choice: иудейским мифам
  rationale: μῦθος обозначает вымышленные рассказы или предания, а Ἰουδαϊκοῖς характеризует их как иудейские по происхождению или содержанию. «Мифы» — ясный современный эквивалент без добавочной оценки, присущей слову «басни».
- source_word: ἐντολαῖς ἀνθρώπων
  choice: заповедям людей
  rationale: Так сохраняется смысл ἐντολαῖς как обязательных предписаний и генитив ἀνθρώπων. Формулировка подчёркивает человеческий источник этих предписаний, не добавляя отсутствующего в тексте пояснения.
- source_word: ἀποστρεφομένων
  choice: отворачивающихся от
  rationale: Причастие настоящего времени в родительном падеже естественнее всего относится к «людей». «Отворачивающихся» сохраняет образ сознательного удаления от истины и аспект продолжающегося действия.
- source_word: τὴν ἀλήθειαν
  choice: истины
  rationale: Стандартная передача ἀλήθεια. Хотя в Пастырских посланиях слово может подразумевать истину Благой вести, сам текст не требует такого уточнения.
theological_decisions:
- issue: К чему относится причастие ἀποστρεφομένων
  choice: 'Причастие отнесено к «людям»: «заповедям людей, отворачивающихся от истины».'
  alternative: 'Его можно понимать шире: и мифы, и заповеди связаны с теми, кто отворачивается от истины.'
  rationale: Ближайшая и грамматически наиболее естественная связь — с ἀνθρώπων, поскольку оба слова стоят во множественном числе родительного падежа. Этот выбор не добавляет к тексту специальных вероучительных выводов.
translation_notes:
  register: Современный литературный русский язык, краткий и достойный стиль. «Иудейским» точнее передаёт историко-религиозную характеристику, чем современное этническое «еврейским». «Внимать» сохраняет библейскую серьёзность, оставаясь понятным современному читателю.
