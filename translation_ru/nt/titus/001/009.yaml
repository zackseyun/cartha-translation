  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/009.yaml
  text: holding firmly to the trustworthy word in accordance with the teaching[b][a], so that he may be able both to exhort by sound teaching and to rebuke those who contradict it.
translation:
  language: ru
  text: крепко держащийся надёжного слова, соответствующего учению[a], чтобы он был способен и увещевать здравым учением, и обличать возражающих[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крепко держащийся верного слова в соответствии с учением».'
    reason: 'Лексико-синтаксический вариант: πιστός может быть передано как «верный», а κατά — более буквально как «в соответствии с».'
  - marker: b
    text: 'Или: «опровергать возражающих». Греческий глагол может означать как обличение и исправительный упрёк, так и выявление или доказательство неправоты.'
    reason: Лексическая альтернатива для многозначного ἐλέγχειν.
lexical_decisions:
- source_word: ἀντεχόμενον
  choice: крепко держащийся
  rationale: Причастие передаёт стойкую, деятельную приверженность; сочетание естественно по-русски и сохраняет образ удерживания.
- source_word: πιστοῦ λόγου
  choice: верного слова
  rationale: πιστός здесь характеризует слово как заслуживающее доверия. «Верное» сохраняет смысл надёжности и не исключает оттенка верности, а λόγος передано традиционным и понятным словом «слово».
- source_word: κατὰ τὴν διδαχήν
  choice: согласного с учением
  rationale: κατά с винительным выражает соответствие установленному учению. Такая формулировка ясно связывает оборот с «верным словом» и звучит естественно в современном русском языке.
- source_word: δυνατὸς ᾖ
  choice: был способен
  rationale: Оборот выражает способность в целевом придаточном после ἵνα; «был способен» точно и естественно передаёт эту функцию.
- source_word: παρακαλεῖν
  choice: увещевать
  rationale: В контексте ответственности церковного руководителя глагол обозначает настойчивое наставление и призыв, а не только утешение; «увещевать» сохраняет этот пастырский оттенок.
- source_word: ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ
  choice: здравым учением
  rationale: ὑγιαίνω метафорически означает здравость, правильность. Творительный падеж естественно передаёт вероятное значение средства у ἐν, не превращая выражение в позднейший технический термин.
- source_word: τοὺς ἀντιλέγοντας
  choice: возражающих
  rationale: Причастие обозначает тех, кто говорит против или противится изложенному учению. Русское «возражающих» сохраняет речевой характер противодействия без добавления отсутствующего в греческом тексте прямого дополнения.
- source_word: ἐλέγχειν
  choice: обличать
  rationale: Глагол может обозначать выявление ошибки, доказательство неправоты и исправительный упрёк. «Обличать» сохраняет широкий корректирующий смысл; оттенок опровержения отмечен в сноске.
theological_decisions:
- issue: Соотношение «верного слова» и «учения»
  choice: «Верное слово» представлено как согласное с признанным учением.
  alternative: Понимать речь как общее указание на нравственно полезное наставление.
  rationale: Артикль при διδαχή и контекст Пастырских посланий указывают на уже известное христианское учение. Перевод передаёт это, не вводя более поздних конфессиональных категорий.
- issue: Характер воздействия на возражающих
  choice: Передано глаголом «обличать», охватывающим выявление заблуждения и исправительный упрёк.
  alternative: «Опровергать», с акцентом на доказательстве неправоты.
  rationale: ἐλέγχω допускает оба оттенка. Основной текст сохраняет пастырско-корректирующую силу, а сноска отмечает аргументативное значение, важное в контексте возражения.
- issue: Роль здравого учения при увещевании
  choice: Здравое учение представлено как средство увещевания.
  alternative: 'Понимать ἐν как указание на сферу: «увещевать в здравом учении».'
  rationale: Инструментальное понимание ἐν хорошо соответствует синтаксису и естественно по-русски, но не исключает того, что увещевание совершается в пределах здравого учения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным церковно-пастырским регистром. Сохранён параллелизм «и… и…» для καί… καί; избегается узкоконфессиональная терминология.
