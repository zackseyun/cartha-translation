  text: ἐφανέρωσεν δὲ καιροῖς ἰδίοις, τὸν λόγον αὐτοῦ ἐν κηρύγματι ὃ ἐπιστεύθην ἐγὼ κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/003.yaml
  text: but in his own times he revealed his word through the proclamation with which I was entrusted[a], according to the command of God our Savior[c][b],
translation:
  language: ru
  text: Но в назначенные Им времена Он явил Своё слово через провозглашение, которое было мне вверено[a], по повелению Бога, нашего Спасителя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен и другой смысл: «Своё слово, которое было мне вверено, Он явил через провозглашение». Греческое относительное местоимение может относиться либо к «провозглашению», либо по смыслу к «слову».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφανέρωσεν
  choice: явил
  rationale: Аорист действительного залога; подразумеваемый субъект — Бог из предшествующего контекста. «Явил» передаёт открытое обнаружение прежде сокрытого и сохраняет возвышенный, но понятный регистр.
- source_word: καιροῖς ἰδίοις
  choice: в назначенные Им времена
  rationale: Фраза указывает на времена, принадлежащие Божьему замыслу. Такой перевод естественно выражает и своевременность, и подразумеваемое Божье назначение, не превращая множественное число в единственное.
- source_word: τὸν λόγον αὐτοῦ
  choice: Своё слово
  rationale: «Слово» сохраняет лексическую связь с λόγος и в контексте обозначает сообщённую Богом весть.
- source_word: ἐν κηρύγματι
  choice: через возвещение
  rationale: Предлог ἐν имеет здесь инструментальный оттенок, а κήρυγμα может обозначать как акт провозглашения, так и возвещаемую весть. «Возвещение» в некоторой мере сохраняет оба аспекта.
- source_word: ὃ ἐπιστεύθην ἐγώ
  choice: которое было мне вверено
  rationale: Пассивная форма πιστεύω в этой конструкции означает поручение или вверение. Средний род относительного местоимения позволяет ближайшим антецедентом считать κήρυγμα — «возвещение».
- source_word: κατ’ ἐπιταγὴν
  choice: по повелению
  rationale: Передаёт властное предписание как основание поручения и звучит естественно по-русски.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Бога, нашего Спасителя
  rationale: 'Сохраняет приложение: Бог назван нашим Спасителем, без внесения дополнительных конфессиональных уточнений.'
theological_decisions:
- issue: Подразумеваемый субъект ἐφανέρωσεν и смысл καιροῖς ἰδίοις
  choice: Бог явил Своё слово в назначенные Им времена.
  alternative: «В надлежащие времена было явлено Его слово» или буквально «в Свои времена Он явил».
  rationale: Контекст указывает на Бога как действующее лицо. Формулировка сохраняет личное Божье действие и оттенок установленных Им сроков.
- issue: Антецедент относительного местоимения ὃ
  choice: 'Местоимение отнесено к «возвещению»: «которое было мне вверено».'
  alternative: 'Отнести его к «слову»: «Своё слово… которое было мне вверено».'
  rationale: Ближайший грамматически подходящий антецедент — κήρυγμα среднего рода. Вместе с тем синтаксис допускает смысловую связь со «словом», поэтому альтернативное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Заглавные буквы в местоимениях «Им», «Своё» употреблены по принятой русской религиозно-издательской норме; синтаксис остаётся ясным для обычного читателя.
