id: TIT.1.15
reference: Titus 1:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: ru
  text: Для чистых всё чисто[a], а для осквернённых и неверующих нет ничего чистого; напротив, осквернены и их ум, и совесть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неосквернённо»; греческое слово в разных формах повторяется в этом стихе и может обозначать как обрядовую чистоту, так и нравственную чистоту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: всё
  rationale: Форма среднего рода множественного числа употреблена обобщённо; русское «всё» естественно передаёт всеохватность афористического высказывания.
- source_word: καθαρά / καθαρόν / καθαροῖς
  choice: чисто / чистого / чистых
  rationale: «Чистый» сохраняет как обрядовые, так и нравственные оттенки греческого καθαρός и позволяет воспроизвести повтор одного корня во всём стихе.
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: для осквернённых
  rationale: Перфектное причастие обозначает сохраняющееся состояние вследствие осквернения; субстантивированное «осквернённых» передаёт это кратко и естественно.
- source_word: ἀπίστοις
  choice: неверующих
  rationale: В данном противопоставлении речь прежде всего об отсутствии веры; «неверующих» яснее, чем возможное «неверных», которое могло бы подразумевать главным образом ненадёжность или неверность.
- source_word: οὐδὲν καθαρόν
  choice: нет ничего чистого
  rationale: Оборот сохраняет предикативный смысл и повтор лексики первого предложения, оставаясь естественным для современного русского языка.
- source_word: ἀλλὰ
  choice: напротив
  rationale: 'Передаёт сильное противопоставление: проблема не в окружающих вещах, а в состоянии самих людей.'
- source_word: μεμίανται
  choice: осквернены
  rationale: Перфектная форма подчёркивает наличное состояние; повтор корня «оскверн-» связывает сказуемое с предшествующим причастием.
- source_word: νοῦς
  choice: ум
  rationale: Обычное и точное обозначение способности мыслить и воспринимать.
- source_word: συνείδησις
  choice: совесть
  rationale: Устоявшийся русский эквивалент для способности нравственной самооценки.
- source_word: καὶ ... καὶ
  choice: и ... и
  rationale: Парная конструкция естественно подчёркивает, что осквернение затронуло обе названные способности.
theological_decisions:
- issue: Объём значения лексики чистоты
  choice: Во всём стихе использован корень «чист-», сохраняющий одновременно обрядовой и нравственный смысл.
  alternative: Передать καθαρός словами «неосквернённый» или «обрядово чистый», усилив один из оттенков.
  rationale: Контекст затрагивает предписания о чистоте, однако высказывание переходит к внутреннему состоянию человека. Перевод не должен сужать смысл только до обрядовой либо только до нравственной чистоты.
translation_notes:
  register: Современный литературный русский язык с краткой афористической структурой. Повторы «чист-» и «оскверн-» намеренно сохранены, как и параллелизм исходного текста.
