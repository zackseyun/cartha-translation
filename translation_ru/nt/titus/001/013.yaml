  source_fidelity: 'Текст точно передаёт греческий оригинал: «Это свидетельство истинно» соответствует ἡ μαρτυρία αὕτη ἐστὶν ἀληθής; «Поэтому» адекватно передаёт δι’ ἣν αἰτίαν; «резко обличай их» сохраняет императив ἔλεγχε и силу ἀποτόμως; целевое придаточное «чтобы они были здравы в вере» передаёт ἵνα ὑγιαίνωσιν ἐν τῇ πίστει без неоправданного сужения значения πίστις.'
