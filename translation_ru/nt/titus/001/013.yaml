id: TIT.1.13
reference: Titus 1:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. δι’ ἣν αἰτίαν ἔλεγχε αὐτοὺς ἀποτόμως, ἵνα ὑγιαίνωσιν ἐν τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: ru
  text: Это свидетельство истинно. Поэтому резко обличай их, чтобы они были здравы в вере[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «здравы в вере» может означать как здоровую, крепкую личную веру, так и здравость в христианской вере как совокупности исповедуемых истин.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρία
  choice: свидетельство
  rationale: Сохраняет смысл засвидетельствованного высказывания о критянах и его доказательную окраску; «утверждение» было бы более общим.
- source_word: ἀληθής
  choice: истинно
  rationale: Предикативно характеризует свидетельство как соответствующее действительности; это прямой и естественный русский эквивалент.
- source_word: δι’ ἣν αἰτίαν
  choice: поэтому
  rationale: Естественно передаёт причинно-следственный переход от предыдущего утверждения к повелению.
- source_word: ἔλεγχε
  choice: обличай
  rationale: Передаёт прямое выявление и порицание заблуждения с целью исправления, не сводя действие к мягкому наставлению.
- source_word: ἀποτόμως
  choice: резко
  rationale: Сохраняет силу наречия, обозначающего суровую, решительную манеру обличения, но не добавляет идеи наказания.
- source_word: ὑγιαίνωσιν
  choice: были здравы
  rationale: Сохраняет метафору здоровья, характерную для Пастырских посланий, и передаёт состояние духовной и вероучительной целостности.
- source_word: ἐν τῇ πίστει
  choice: в вере
  rationale: Буквально и естественно передаёт предложную конструкцию, не устраняя возможную двусмысленность между личной верой и христианской верой как содержанием исповедания.
theological_decisions:
- issue: Значение ἐν τῇ πίστει
  choice: в вере
  alternative: верой; в христианской вере как совокупности убеждений
  rationale: Артикль и контекст ложного учения допускают понимание πίστις как христианской веры в объективном смысле, однако сама греческая конструкция может также относиться к личной вере. Основной текст сохраняет эту открытость, а примечание поясняет варианты.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Обличай» сохраняет нравственно-вероучительный характер исправления, а «здравы» — исходную метафору здоровья. Маркер примечания поставлен непосредственно после спорного выражения.
