  text: Τούτου χάριν ⸀ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/005.yaml
  text: For this reason I left you in Crete[a], so that you might set in order what remained and appoint elders in every city[c][b], as I directed you.
translation:
  language: ru
  text: По этой причине я оставил тебя на Крите, чтобы ты привёл в порядок то, что ещё оставалось сделать[a], и назначил старейшин в каждом городе[b], как я тебе указал[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, чего недоставало».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «город за городом».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «как я тебе повелел».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Для того
  rationale: Естественно передаёт причинно-целевую связь с последующим ἵνα и по-русски ясно вводит объяснение, зачем Тит был оставлен на Крите.
- source_word: ἀπέλιπόν
  choice: оставил
  rationale: Аорист указывает на совершённое действие Павла; нейтральное «оставил» точно и естественно, без лишнего акцента, возможного в «оставил позади».
- source_word: ἐν Κρήτῃ
  choice: на Крите
  rationale: Нормативное русское обозначение местонахождения на острове.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт цель действия естественной современной русской конструкцией.
- source_word: τὰ λείποντα
  choice: то, что оставалось незавершённым
  rationale: Сохраняет смысл дел, которые ещё предстояло довести до конца. Возможный оттенок недостатка вынесен в сноску.
- source_word: ἐπιδιορθώσῃ
  choice: привёл в порядок
  rationale: Передаёт исправление и дальнейшее упорядочение незавершённых дел без излишне технического оттенка.
- source_word: καταστήσῃς
  choice: назначил
  rationale: В данном контексте обозначает поставление людей на признанное служение; «назначил» ясно выражает это действие.
- source_word: κατὰ πόλιν
  choice: в каждом городе
  rationale: Ясно передаёт распределительное значение κατά с существительным в единственном числе.
- source_word: πρεσβυτέρους
  choice: старейшин
  rationale: Передаёт обозначение признанных руководителей общин, оставаясь понятным современному читателю и не навязывая позднейшую конфессиональную структуру должностей.
- source_word: ὡς ἐγώ σοι διεταξάμην
  choice: как я тебе поручил
  rationale: Передаёт авторитетное указание Павла естественно по-русски, не усиливая его без необходимости до категорического приказа; более сильный вариант отмечен в сноске.
theological_decisions:
- issue: Обозначение церковного служения словом πρεσβυτέρους
  choice: старейшин
  alternative: пресвитеров; старших мужчин
  rationale: Контекст говорит о признанных руководителях общин, а не просто о пожилых мужчинах. «Старейшины» отражает функцию и не предрешает позднейшие споры о церковном устройстве.
- issue: Степень властности глагола διεταξάμην
  choice: как я тебе поручил
  alternative: как я тебе повелел; как я тебя наставил
  rationale: Греческий глагол допускает значение властного распоряжения. «Поручил» сохраняет авторитет Павла и естественный русский тон, а более сильное «повелел» приведено как допустимая альтернатива.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет цельную структуру греческого предложения. Формулировки понятны широкому читателю, выдержаны в достойном регистре и не привязаны к конкретной конфессиональной модели церковного управления.
