  text: εἶπέν τις ἐξ αὐτῶν, ἴδιος αὐτῶν προφήτης, Κρῆτες ἀεὶ ψεῦσται, κακὰ θηρία, γαστέρες ἀργαί·
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: ru
  text: 'Один из них, их собственный пророк, сказал: «Критяне всегда лжецы, злые звери, ленивые обжоры[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ленивые утробы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: Один из них ... сказал
  rationale: 'Сочетание τις с ἐξ αὐτῶν имеет партитивный смысл: речь идёт об одном человеке из их среды. Такой перевод естественен по-русски и сохраняет структуру греческой фразы.'
- source_word: ἴδιος αὐτῶν προφήτης
  choice: их собственный пророк
  rationale: ἴδιος подчёркивает принадлежность пророка к самим критянам; «собственный» передаёт это ударение без добавочного толкования.
- source_word: Κρῆτες ἀεὶ ψεῦσται
  choice: Критяне всегда лжецы
  rationale: Прямо передаёт этноним, наречие ἀεί («всегда») и существительное ψεῦσται («лжецы»), сохраняя резкость цитируемого изречения.
- source_word: κακὰ θηρία
  choice: злые звери
  rationale: Перевод сохраняет буквальный образ θηρία и нравственно отрицательную окраску κακά, не заменяя метафору пояснительным пересказом.
- source_word: γαστέρες ἀργαί
  choice: ленивые обжоры
  rationale: Буквально выражение означает «ленивые утробы». В данном оскорбительном ряду оно метонимически описывает людей, преданных еде и праздности; «ленивые обжоры» понятно современному читателю, а буквальный образ указан в сноске.
theological_decisions:
- issue: Передача резкого этнического обобщения в цитате
  choice: Сохранить прямую и жёсткую формулировку, ясно оставив её словами цитируемого пророка
  alternative: Смягчить отрицательные характеристики или превратить их в ограниченное утверждение лишь о некоторых критянах
  rationale: Греческий текст прямо приводит резкое изречение и предварительно обозначает его как слова одного из самих критян. Перевод не должен ни смягчать цитату, ни расширять её до самостоятельного богословского утверждения вне данного риторического контекста.
translation_notes:
  register: Современный литературный русский язык; синтаксис сжатый и афористичный, соответствующий форме цитаты. Резкость исходных образов сохранена, а непривычная буквальная метонимия пояснена в сноске.
