  text: οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/011.yaml
  text: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
translation:
  language: ru
  text: Их следует заставить замолчать[a], ведь они разрушают целые семьи[b], уча тому, чему не следует, ради постыдной наживы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «заградить им уста»; то есть пресечь их вредное учение.'
    reason: lexical_alternative
  - marker: b
    text: Здесь имеются в виду семьи вместе с домочадцами, а не здания.
    reason: cultural_note
  - marker: c
    text: 'Или: «ради грязной выгоды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς δεῖ ἐπιστομίζειν
  choice: Им нужно заграждать уста
  rationale: Русская конструкция передаёт необходимость пресечь их речь и сохраняет образ греческого глагола «закрывать, заграждать рот», не уточняя не названный в тексте способ воздействия.
- source_word: οἵτινες
  choice: ведь они
  rationale: 'В данном контексте относительное местоимение вводит основание необходимости: вред, причиняемый этими людьми.'
- source_word: ὅλους οἴκους
  choice: целые семьи
  rationale: οἶκος здесь естественно обозначает домашнее сообщество — семью и домочадцев, а не здание.
- source_word: ἀνατρέπουσιν
  choice: разрушают
  rationale: Глагол выражает серьёзное расстройство и подрыв устроения семей; «разрушают» передаёт его силу естественным современным русским языком.
- source_word: διδάσκοντες
  choice: уча
  rationale: Деепричастие естественно передаёт сопутствующее действие и средство, посредством которого причиняется вред.
- source_word: ἃ μὴ δεῖ
  choice: тому, чему не следует
  rationale: Сохраняет намеренную неопределённость содержания ложного учения и выраженную в δεῖ нормативную оценку.
- source_word: αἰσχροῦ κέρδους χάριν
  choice: ради постыдной наживы
  rationale: «Нажива» ясно передаёт корыстную выгоду, а «постыдная» сохраняет нравственное осуждение αἰσχρός.
theological_decisions:
- issue: Характер требуемого пресечения деятельности лжеучителей
  choice: Им нужно заграждать уста
  alternative: Их нужно заставить замолчать
  rationale: Образная формулировка близка к греческому тексту и указывает на прекращение вредного учения, но не приписывает стиху какой-либо конкретный способ принуждения.
- issue: Степень вреда, наносимого семьям
  choice: разрушают целые семьи
  alternative: расстраивают целые семьи
  rationale: ἀνατρέπω — сильный глагол со значением опрокидывания или подрыва. «Разрушают» сохраняет серьёзность обвинения, не уточняя, является ли разрушение окончательным.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «заграждать уста». Формулировка остаётся понятной благодаря сноске; синтаксис краткий и обличительный, в соответствии с оригиналом.
