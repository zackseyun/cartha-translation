lexical_decisions:
- source_word: ἀλλὰ
  choice: но
  rationale: Противительный союз противопоставляет перечисленным в предыдущем стихе порокам требуемые положительные качества.
- source_word: φιλόξενον
  choice: гостеприимным
  rationale: Прилагательное обозначает радушие к гостям и чужеземцам; «гостеприимный» естественно и точно передаёт это качество по-русски.
- source_word: φιλάγαθον
  choice: любящим добро
  rationale: Сложное прилагательное буквально указывает на любовь к добру; выбранная формулировка сохраняет объект любви и звучит естественно.
- source_word: σώφρονα
  choice: здравомыслящим
  rationale: Слово охватывает рассудительность, здравость ума и сдержанность. Этот выбор также позволяет не смешивать его с ἐγκρατῆ в конце перечня.
- source_word: δίκαιον
  choice: справедливым
  rationale: В перечне нравственных качеств слово указывает на праведное и справедливое поведение; «справедливый» понятно современному читателю и не сужает смысл до судебной сферы.
- source_word: ὅσιον
  choice: благочестивым
  rationale: Слово обозначает почтительное отношение к Богу и соответствие священному; «благочестивый» сохраняет религиозно-нравственный оттенок без отождествления с более широким ἅγιος.
- source_word: ἐγκρατῆ
  choice: владеющим собой
  rationale: Прилагательное подчёркивает власть над собственными желаниями и побуждениями; выражение ясно передаёт самодисциплину и отличает это качество от σώφρονα.
theological_decisions:
- issue: Различение близких по смыслу σώφρονα и ἐγκρατῆ
  choice: Передать σώφρονα как «здравомыслящим», а ἐγκρατῆ как «владеющим собой»
  alternative: «сдержанным» и «воздержанным» либо два близких обозначения самообладания
  rationale: 'Греческий текст называет два связанных, но не тождественных качества: здравую рассудительность и практическое господство над собой. Разные русские выражения сохраняют это различие.'
- issue: Передача ὅσιον
  choice: «благочестивым»
  alternative: «святым»
  rationale: В данном перечне ὅσιος прежде всего характеризует благочестие и верность тому, что угодно Богу. «Святой» возможен, но в русском языке может быть воспринят как более широкое богословское обозначение статуса.
translation_notes:
  register: Современный литературный русский язык, краткий и достойный перечень качеств. Формы творительного падежа продолжают синтаксическую конструкцию предыдущего стиха. Сохранена завершающая запятая, поскольку стих является частью продолжающегося предложения.
