lexical_decisions:
- source_word: ἐπ’ ἐλπίδι
  choice: в надежде
  rationale: Оборот с ἐπί и дательным может обозначать основание, обстоятельство или сферу. «В надежде» естественно по-русски передаёт связь служения Павла с названной надеждой, не сужая смысл до одной причинной трактовки.
- source_word: ζωῆς αἰωνίου
  choice: на вечную жизнь
  rationale: После русского слова «надежда» нормативно употребляется конструкция «на что»; она передаёт вечную жизнь как содержание и предмет надежды.
- source_word: ἣν
  choice: которую
  rationale: Женский род и единственное число местоимения естественно соотносят его с «вечной жизнью», а не с надеждой как отвлечённым отношением.
- source_word: ἐπηγγείλατο
  choice: обещал
  rationale: Простая форма «обещал» точно и естественно передаёт аорист среднего залога ἐπαγγέλλομαι; отдельное выражение залогового оттенка по-русски здесь не требуется.
- source_word: ὁ ἀψευδὴς θεὸς
  choice: не лгущий Бог
  rationale: Так сохраняется прямое значение ἀψευδής — «не лгущий, правдивый» — без усиления до «не способный солгать». Причастный оборот звучит в современном литературном русском кратко и достойно.
- source_word: πρὸ χρόνων αἰωνίων
  choice: прежде вековых времён
  rationale: Формулировка сохраняет оба элемента греческого выражения — χρόνοι («времена») и αἰώνιοι («вековые, относящиеся к векам») — и его допредельную временную перспективу. Необычность исходной фразы поясняется сноской, а не устраняется толкованием.
theological_decisions:
- issue: Временное выражение πρὸ χρόνων αἰωνίων и Божье обещание
  choice: «прежде вековых времён» — обещание вечной жизни предшествует названным временам, без уточнения того, кому оно было дано и как именно следует понимать его предвечный характер.
  alternative: «до начала времён»; «прежде вечных времён»; «от вечности»
  rationale: Греческий текст утверждает предшествование обещания векам или вековым временам, но не раскрывает адресата обещания и не объясняет его метафизический механизм. Перевод сохраняет эту богословскую напряжённость.
- issue: Характеристика Бога словом ἀψευδής
  choice: «не лгущий Бог»
  alternative: «Бог, Который не может лгать»; «правдивый Бог»
  rationale: Выбранный вариант непосредственно передаёт отрицание лжи, не усиливая его до отдельного утверждения о невозможности солгать и не заменяя отрицательную форму более общим качеством «правдивый».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Не лгущий Бог» сохраняет компактность греческого определения; «прежде вековых времён» намеренно удерживает необычность исходного выражения, а более гладкий вариант вынесен в сноску.
