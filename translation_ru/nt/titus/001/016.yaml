base_translation:
  language: en
  yaml_path: translation/nt/titus/001/016.yaml
  text: They profess to know God[a], but by their works they deny him[d][c][b], being detestable and disobedient and unfit for every good work.
translation:
  language: ru
  text: Они утверждают, что знают Бога[a], но своими делами отрекаются от Него[b]; они мерзки[c], непослушны и непригодны ни для какого доброго дела[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заявляют, что знают Бога».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «своими поступками отрицают Его».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «отвратительны».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «не выдерживают проверки и потому непригодны ни для какого доброго дела».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογοῦσιν εἰδέναι
  choice: утверждают, что знают
  rationale: В данном контексте глагол обозначает открытое заявление, которое противопоставлено поступкам. «Утверждают» естественно передаёт заявленное притязание, не предполагая его истинности.
- source_word: τοῖς δὲ ἔργοις
  choice: но своими делами
  rationale: Дательный падеж может выражать средство или сферу проявления; «своими делами» ясно показывает, что их поступки служат практическим отрицанием сказанного.
- source_word: ἀρνοῦνται
  choice: отрекаются от Него
  rationale: Местоименный объект естественно восстанавливается из «Бога» в первой части. «Отрекаются от Него» сохраняет личный объект и сильное противопоставление между словами и жизнью.
- source_word: βδελυκτοὶ
  choice: мерзки
  rationale: Слово выражает сильную нравственную отвратительность. «Мерзки» — краткое, современное и достаточно сильное соответствие.
- source_word: ἀπειθεῖς
  choice: непокорны
  rationale: Передаёт упорный отказ повиноваться, сохраняя возможный оттенок непослушания и мятежности.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι
  choice: непригодны ни к какому доброму делу
  rationale: ἀδόκιμοι указывает на несоответствие испытанному стандарту и, как следствие, непригодность. В отрицательной русской конструкции πᾶν естественно передаётся как «ни к какому».
theological_decisions:
- issue: Соотношение исповедания Бога на словах и отречения от Него на деле
  choice: Их слова заявляют о знании Бога, тогда как поступки фактически выражают отречение от Него.
  alternative: Понимать вторую часть шире — как отрицание Божьей истины вообще.
  rationale: Прямой объект первой части — Бог; во второй части этот объект естественно подразумевается. Перевод сохраняет напряжение между словесным заявлением и практической жизнью, не добавляя отсутствующего в тексте доктринального уточнения.
translation_notes:
  register: Современный литературный русский язык с ясным, строгим и нравственно весомым звучанием. Синтаксис разделён на два предложения ради естественности и удобочитаемости; смысловая связь греческого причастия ὄντες сохранена последовательным описанием тех же людей.
