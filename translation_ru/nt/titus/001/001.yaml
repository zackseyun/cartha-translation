  text: Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ’ εὐσέβειαν
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/001.yaml
  text: Paul[a], a servant of God and an apostle of Jesus the Messiah, for the faith of God’s chosen ones and the knowledge of the truth that accords with godliness[c][b],
translation:
  language: ru
  text: Павел, раб Божий и апостол Иисуса Мессии, для веры избранных Богом и их познания[a] истины, соответствующей благочестию[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полного познания».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «истины, ведущей к благочестию».'
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος θεοῦ
  choice: раб Божий
  rationale: «Раб» сохраняет смысл полной принадлежности Богу и подчинённости Ему; это также естественное и укоренённое библейское выражение в русском языке.
- source_word: ἀπόστολος
  choice: апостол
  rationale: Устоявшийся русский термин точно передаёт особое посланническое служение Павла.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός передано как титул «Мессия», а не как утратившая прозрачность транслитерация; русский родительный падеж соответствует греческой конструкции.
- source_word: κατὰ
  choice: ради
  rationale: В данной сжатой конструкции κατά, вероятно, указывает на направленность апостольского служения Павла — к вере и познанию; «ради» естественно передаёт эту целевую соотнесённость, не превращая её в строго причинное отношение.
- source_word: πίστιν
  choice: веры
  rationale: Наиболее прямое и контекстуально естественное соответствие, обозначающее веру избранных Богом.
- source_word: ἐκλεκτῶν θεοῦ
  choice: избранных Божьих
  rationale: Передаёт совершённое Богом избрание, не добавляя конфессиональной системы толкования; субстантивированное прилагательное естественно по-русски.
- source_word: ἐπίγνωσιν
  choice: познания
  rationale: «Познание» естественно обозначает обретённое и осмысленное знание истины; возможный усилительный оттенок ἐπίγνωσις вынесен в примечание.
- source_word: ἀληθείας
  choice: истины
  rationale: Родительный падеж естественно зависит от «познания» и сохраняет определённость истины в данном контексте.
- source_word: τῆς κατ’ εὐσέβειαν
  choice: согласной с благочестием
  rationale: Формулировка сохраняет отношение соответствия, выраженное κατά, не навязывая более узкого причинного смысла.
- source_word: εὐσέβειαν
  choice: благочестием
  rationale: Устоявшееся и точное русское слово для почтительной к Богу жизни и преданности Ему.
theological_decisions:
- issue: Смысл выражения ἐκλεκτῶν θεοῦ
  choice: избранных Божьих
  alternative: избранников Бога
  rationale: Основной вариант ясно сохраняет Божье избрание, но не уточняет его механизм, объём или конфессиональное понимание.
- issue: Отношение κατά к πίστιν и ἐπίγνωσιν
  choice: ради веры… и познания
  alternative: в соответствии с верой… и познанием
  rationale: «Ради» передаёт вероятную направленность апостольства Павла на веру и познание избранных, однако греческая конструкция допускает и значение соответствия.
- issue: Отношение истины к благочестию в τῆς κατ’ εὐσέβειαν
  choice: истины, согласной с благочестием
  alternative: истины, ведущей к благочестию
  rationale: Основной текст сохраняет более широкий смысл соответствия; возможную направленность истины к благочестивой жизни не следует исключать, поэтому она отмечена отдельно.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В этом именовании слово сохраняет титульный смысл Помазанника; «Мессия» делает этот смысл доступным современному читателю.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского вступления. Синтаксис сохраняет незавершённость стиха как части длинного вступительного предложения (Тит. 1:1–4). «Раб Божий» и «апостол» оставлены в укоренённом библейском регистре; менее прозрачный титул Χριστός передан смысловым эквивалентом «Мессия».
