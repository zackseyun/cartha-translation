lexical_decisions:
- source_word: ἀνέγκλητος
  choice: безупречен
  rationale: Передаёт не абсолютную безгрешность, а отсутствие обоснованного обвинения; естественно звучит в перечне требований.
- source_word: μιᾶς γυναικὸς ἀνήρ
  choice: муж одной жены
  rationale: Формально прозрачная передача греческого выражения, сохраняющая его мужскую грамматическую форму и не решающая спорные вопросы толкования.
- source_word: τέκνα
  choice: детей
  rationale: Обычное и естественное обозначение детей в контексте семьи.
- source_word: πιστά
  choice: верных
  rationale: Сохраняет более широкое значение надёжности и верности; возможное значение «верующих» вынесено в примечание.
- source_word: ἐν κατηγορίᾳ ἀσωτίας
  choice: которых не обвиняют в распутстве
  rationale: Передаёт как смысл обвинения, так и нравственно необузданное поведение, обозначенное словом ἀσωτία.
- source_word: ἀνυπότακτα
  choice: непокорности
  rationale: Передаёт отказ подчиняться должному порядку; согласование с «обвиняют» естественно объединяет два отрицательных признака.
theological_decisions:
- issue: Значение πιστά в τέκνα ἔχων πιστά
  choice: верных детей
  alternative: верующих детей
  rationale: πιστά допускает как нравственную верность и надёжность, так и веру; основной текст сохраняет более широкое значение, а иной вариант отмечен в сноске.
- issue: Смысл μιᾶς γυναικὸς ἀνήρ
  choice: муж одной жены
  alternative: мужчина, верный одной женщине
  rationale: Буквально прозрачная формулировка не навязывает выводов о семейном положении, повторном браке или точном объёме требования.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная, синтаксически продолжает перечень требований из контекста. Подлинная неоднозначность πιστά и идиоматичность μιᾶς γυναικὸς ἀνήρ сохранены с помощью примечаний.
