base_translation:
  language: en
  yaml_path: translation/nt/titus/001/006.yaml
  text: if anyone is above reproach[a], the husband of one wife[c][b], having faithful children not under accusation of debauchery or insubordinate.
translation:
  language: ru
  text: если кто безупречен, муж одной жены[a], имеет верных детей[b], не обвиняемых в распутстве и не проявляющих непокорности.
  philosophy: optimal-equivalence
  footnotes:
