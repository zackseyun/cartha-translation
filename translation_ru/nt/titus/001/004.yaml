id: TIT.1.4
reference: Titus 1:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τίτῳ γνησίῳ τέκνῳ κατὰ κοινὴν πίστιν· χάρις ⸀καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τοῦ σωτῆρος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: ru
  text: 'Титу, истинному сыну по общей вере[a]: благодать и мир от Бога Отца и Мессии Иисуса[b], нашего Спасителя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по разделяемой нами вере».'
    reason: lexical_alternative
  - marker: b
    text: 'По-гречески: «Христа Иисуса»; здесь Χριστός передано по смыслу как титул «Мессия».'
    reason: alternative_reading
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: истинному сыну
  rationale: γνήσιος указывает на подлинность духовного родства, а не на биологическое происхождение. Хотя τέκνον буквально означает «ребёнок» или «дитя», применительно к известному адресату-мужчине русское «сын» естественно передаёт семейную метафору.
- source_word: κατὰ κοινὴν πίστιν
  choice: по общей вере
  rationale: κατά с винительным падежом выражает отношение или основание, а κοινήν обозначает то, что является общим для Павла и Тита. Краткая конструкция сохраняет смысл и естественно звучит по-русски.
- source_word: πίστιν
  choice: вере
  rationale: В данном контексте πίστις означает разделяемую христианскую веру, а не верность как качество.
- source_word: χάρις καὶ εἰρήνη
  choice: благодать и мир
  rationale: Сохраняются традиционные и точные соответствия словам апостольского благословения.
- source_word: θεοῦ πατρὸς
  choice: Бога Отца
  rationale: В греческом тексте при πατρός нет местоимения «нашего», поэтому перевод не добавляет его.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Мессии Иисуса
  rationale: Χριστός передаётся по смыслу как титул «Мессия», а не только традиционной транслитерацией «Христос».
- source_word: σωτῆρος ἡμῶν
  choice: нашего Спасителя
  rationale: Фраза непосредственно и приложительно определяет Мессию Иисуса как Спасителя; притяжательное местоимение ἡμῶν передано явно.
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: В контексте сохраняется смысл греческого титула Χριστός — «Помазанник, Мессия». Традиционная форма отмечена как допустимый вариант.
- issue: К кому относится σωτῆρος ἡμῶν
  choice: «нашего Спасителя» относится к Мессии Иисусу
  alternative: Более свободное отнесение ко всей сочинённой формуле источника
  rationale: Артикль τοῦ и непосредственное положение оборота после Χριστοῦ Ἰησοῦ естественнее всего указывают на приложение к Иисусу; пунктуация перевода делает эту связь ясной, не добавляя отдельного богословского утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского приветствия. Синтаксис близок к греческому, но понятен обычному читателю. Местоимение «моему» не добавлено, поскольку его нет в исходном тексте; мужское «сыну» выбрано как естественная русская форма духовно-семейной метафоры применительно к Титу.
