  text: δεῖ γὰρ τὸν ἐπίσκοπον ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, μὴ αὐθάδη, μὴ ὀργίλον, μὴ πάροινον, μὴ πλήκτην, μὴ αἰσχροκερδῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/007.yaml
  text: For an overseer must be above reproach as God's steward[a], not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain[b],
translation:
  language: ru
  text: 'Ибо блюститель[a] должен быть безупречным как Божий домоуправитель: не своевольным, не вспыльчивым, не пристрастным к вину, не драчливым и не падким на постыдную наживу[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «епископ». Греческое слово означает того, кто осуществляет надзор и попечение; здесь оно не обязательно несёт все более поздние значения церковного титула.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «не стремиться к бесчестной выгоде». Греческое слово указывает на стремление к прибыли, считающейся постыдной или нравственно недостойной.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: должен
  rationale: Прямо и естественно передаёт необходимость и обязательность, выраженные греческим словом.
- source_word: γὰρ
  choice: ведь
  rationale: Сохраняет пояснительную связь с предыдущим стихом и естественно звучит в современном русском тексте.
- source_word: ἐπίσκοπον
  choice: блюститель
  rationale: Передаёт исходный смысл человека, осуществляющего надзор и попечение, не навязывая слову более позднее значение церковного титула.
- source_word: ἀνέγκλητον
  choice: безупречен
  rationale: Обозначает человека, против которого нельзя выдвинуть обоснованное обвинение, не утверждая его абсолютной безгрешности.
- source_word: ὡς θεοῦ οἰκονόμον
  choice: как Божий домоуправитель
  rationale: Сохраняет образ управляющего, которому Бог доверил Своё хозяйство и который подотчётен Ему.
- source_word: αὐθάδη
  choice: своевольным
  rationale: Передаёт упрямую ориентацию на собственную волю и самоугодничество; значение не сводится только к высокомерию.
- source_word: ὀργίλον
  choice: вспыльчивым
  rationale: Передаёт постоянную склонность быстро приходить в гнев, а не единичную вспышку.
- source_word: πάροινον
  choice: пристрастным к вину
  rationale: Естественно передаёт характеризующую человека тягу к вину и связанную с ним невоздержанность, не усиливая смысл до обязательного пьянства.
- source_word: πλήκτην
  choice: драчливым
  rationale: Передаёт буквальную и поведенческую склонность пускать в ход кулаки; звучит яснее для современного читателя, чем книжные аналоги.
- source_word: αἰσχροκερδῆ
  choice: падким на постыдную наживу
  rationale: Сохраняет как корыстную тягу к прибыли, так и нравственно постыдный характер способов или самой выгоды; не ограничивает смысл юридически нечестным доходом.
theological_decisions:
- issue: Передача ἐπίσκοπος в контексте служения в общине
  choice: блюститель
  alternative: епископ
  rationale: «Блюститель» отражает смысл надзора и попечения, не приписывая тексту более позднюю конфессиональную или иерархическую структуру; традиционный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством новозаветного наставления. «Блюститель» и «домоуправитель» несколько книжны, но прозрачны по смыслу и сохраняют служебный и хозяйственный образы оригинала. Двоеточие ясно вводит перечень качеств, синтаксически зависящих от «должен быть».
