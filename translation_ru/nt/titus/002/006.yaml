lexical_decisions:
- source_word: Τοὺς νεωτέρους
  choice: молодых мужчин
  rationale: Форма с артиклем во множественном числе мужского рода в контексте последовательных наставлений разным возрастным и половым группам обозначает именно молодых мужчин, а не молодёжь вообще.
- source_word: ὡσαύτως
  choice: так же
  rationale: Наречие связывает это наставление с предыдущими параллельными наставлениями; «так же» естественно передаёт смысл «подобным образом».
- source_word: παρακάλει
  choice: наставляй
  rationale: Настоящее повелительное наклонение предполагает продолжающееся действие. В данном контексте «наставляй» передаёт призыв к серьёзному увещанию естественным современным русским языком.
- source_word: σωφρονεῖν
  choice: быть рассудительными
  rationale: Глагол охватывает здравомыслие, трезвость суждений и дисциплинированное самообладание. «Быть рассудительными» сохраняет этот смысл, а возможный акцент на самообладании указан в сноске.
theological_decisions:
- issue: Гендерная отнесённость νεωτέρους
  choice: конкретное указание на молодых мужчин
  alternative: обобщённое указание на молодых людей обоих полов
  rationale: Ближайший контекст поочерёдно обращается к пожилым мужчинам, пожилым женщинам, молодым женщинам и затем молодым мужчинам; мужской род исходного текста следует сохранить.
- issue: Смысл σωφρονεῖν
  choice: быть рассудительными
  alternative: владеть собой; быть здравомыслящими
  rationale: Исходное слово соединяет здравое суждение с сдержанностью. Основной текст не сужает его только до контроля эмоций или поведения, а сноска сохраняет возможные оттенки.
translation_notes:
  register: Современный литературный русский язык, краткий и наставительный тон. Формулировка сохраняет параллелизм контекста и мужскую референцию исходного текста; лексическая многозначность σωφρονεῖν отражена в сноске.
