  text: Δούλους ἰδίοις δεσπόταις ὑποτάσσεσθαι ἐν πᾶσιν, εὐαρέστους εἶναι, μὴ ἀντιλέγοντας,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/009.yaml
  text: Servants are to submit to their own masters in everything[a], to be pleasing, not argumentative[b],
translation:
  language: ru
  text: Рабы[a] должны во всём подчиняться своим хозяевам, быть им угодными и не перечить[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. δοῦλος может означать раба или слугу; здесь, судя по упоминанию хозяев, вероятнее всего имеются в виду именно рабы.
    reason: alternative_reading
  - marker: b
    text: 'Или: «не возражать», «не прекословить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δούλους
  choice: Рабы
  rationale: В сочетании с δεσπόταις слово обозначает людей, находящихся в рабской зависимости; перевод «слуги» смягчил бы социальную реальность текста.
- source_word: ἰδίοις δεσπόταις
  choice: своим хозяевам
  rationale: «Своим» передаёт ἰδίοις, а «хозяевам» естественно обозначает здесь владельцев рабов, не привнося богословского оттенка слова «Господь».
- source_word: ὑποτάσσεσθαι
  choice: должны … подчиняться
  rationale: Так переданы продолженное требование и увещательный смысл инфинитива в естественной современной русской форме.
- source_word: ἐν πᾶσιν
  choice: во всём
  rationale: Сохраняет широкий, формально не ограниченный охват греческого выражения.
- source_word: εὐαρέστους εἶναι
  choice: быть им угодными
  rationale: Передаёт значение «быть приятными, заслуживать одобрение»; местоимение «им» естественно восполняет подразумеваемое отношение к хозяевам.
- source_word: μὴ ἀντιλέγοντας
  choice: не перечить
  rationale: Передаёт словесное противодействие или возражение и соответствует наставительному контексту.
theological_decisions:
- issue: Передача δοῦλος в контексте домашних отношений
  choice: рабы
  alternative: слуги; подневольные слуги
  rationale: Упоминание δεσπόταις указывает на реальную рабскую зависимость. Такой перевод описывает социальное положение адресатов, не выражая одобрения рабства.
- issue: Неограниченно звучащее ἐν πᾶσιν
  choice: во всём
  alternative: во всех отношениях
  rationale: Сохранён широкий смысл исходного выражения без добавления отсутствующих в стихе оговорок; тем самым не снимается напряжение текста и не расширяется его смысл толкованием.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной формулировкой. Синтаксически самостоятельное «должны» естественно передаёт зависимую инфинитивную конструкцию греческого текста при цитировании одного стиха. Завершающая запятая сохранена, поскольку мысль продолжается в следующем стихе.
