  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε μετὰ πάσης ἐπιταγῆς· μηδείς σου περιφρονείτω.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: ru
  text: Говори об этом, увещевай и обличай со всей властью. Пусть никто тобой не пренебрегает.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть никто не смотрит на тебя свысока»; возможно также: «Пусть никто тебя не презирает».'
    reason: Глагол περιφρονέω охватывает оттенки пренебрежения, высокомерного отношения и презрения; основной текст и сноска вместе сохраняют его смысловой диапазон.
lexical_decisions:
- source_word: Ταῦτα
  choice: об этом
  rationale: Указательное местоимение среднего рода множественного числа отсылает ко всему комплексу предшествующих наставлений. Русское «об этом» естественно сохраняет широкий охват, не сводя его к одному учению или вопросу.
- source_word: λάλει
  choice: говори
  rationale: Настоящее повелительное наклонение призывает к продолжающемуся возвещению. «Говори» прямо передаёт значение глагола и не сужает его до более специального «учи».
- source_word: παρακάλει
  choice: увещевай
  rationale: Глагол может означать призыв, ободрение или настойчивое наставление. В сочетании с «говори» и «обличай» слово «увещевай» сохраняет как пастырский, так и побудительный оттенок.
- source_word: ἔλεγχε
  choice: обличай
  rationale: Здесь глагол означает выявлять неправоту и призывать к исправлению. «Обличай» передаёт эту корректирующую силу и соответствует достойному современному библейскому регистру.
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: со всей властью
  rationale: ἐπιταγή может обозначать повеление, распоряжение или власть. В данном обороте выражение указывает на полноту полномочия, с которым Тит должен исполнять перечисленные действия, не утверждая его независимой личной власти.
- source_word: μηδείς
  choice: никто
  rationale: Стандартная и ясная передача отрицательного неопределённого местоимения в запретительной конструкции.
- source_word: σου
  choice: тобой
  rationale: Родительный падеж местоимения зависит от περιφρονείτω; русское управление глагола «пренебрегать» естественно требует творительного падежа.
- source_word: περιφρονείτω
  choice: не пренебрегает
  rationale: Глагол включает значения «считать незначительным», «презирать», «не принимать всерьёз». «Не пренебрегает» естественно выражает запрет игнорировать Тита и его служение, а более сильный вариант отмечен в сноске.
theological_decisions:
- issue: Характер власти в выражении μετὰ πάσης ἐπιταγῆς
  choice: Тит должен говорить, увещевать и обличать со всей предоставленной ему властью.
  alternative: Выражение может пониматься преимущественно как указание на повелительную силу речи или на власть самого возвещаемого наставления.
  rationale: Оборот естественно относится к трём повелительным глаголам и передаёт полноту полномочия при исполнении поручения. Перевод не уточняет сверх текста, принадлежит ли акцент лично Титу, его служению или авторитету порученного ему наставления.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и умеренно библейским звучанием. Параллельные повелительные формы сохраняют ритм греческого текста. Маркер сноски поставлен непосредственно после выражения, к которому относится.
