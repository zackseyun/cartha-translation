id: TIT.2.1
reference: Titus 2:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Σὺ δὲ λάλει ἃ πρέπει τῇ ὑγιαινούσῃ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/001.yaml
  text: But as for you[a], speak the things that are fitting for sound teaching.
translation:
  language: ru
  text: Ты же говори то, что соответствует здравому учению.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «здоровому наставлению».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Ты же
  rationale: Явно выраженное местоимение вместе с δέ создаёт контраст с упомянутыми ранее лжеучителями. Русское «Ты же» естественно передаёт и личное выделение Тита, и противопоставление.
- source_word: λάλει
  choice: говори
  rationale: Глагол означает «говорить» и здесь выражает повеление. «Говори» сохраняет широту значения, не сужая его до формального преподавания.
- source_word: ἃ
  choice: то, что
  rationale: Оборот естественно передаёт содержание речи; русское собирательное «то, что» соответствует греческому нейтральному множественному относительному местоимению без тяжеловесности.
- source_word: πρέπει
  choice: соответствует
  rationale: Глагол выражает уместность и подобие должному. В сочетании с учением «соответствует» звучит естественно и ясно передаёт мысль о согласованности того, что говорит Тит, со здравым учением.
- source_word: ὑγιαινούσῃ
  choice: здравому
  rationale: Метафорически обозначает здоровое, правильное, неповреждённое состояние учения. «Здравое учение» — понятное и укоренённое русское сочетание.
- source_word: διδασκαλίᾳ
  choice: учению
  rationale: Слово может обозначать как преподавание, так и его содержание. «Учение» сохраняет эту смысловую широту и естественно сочетается с «здравое».
theological_decisions:
- issue: Передача τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: здравому учению
  alternative: здоровому наставлению
  rationale: «Здравое учение» сохраняет метафору здоровья и включает содержание апостольского наставления, не вводя более узкого конфессионального смысла. Альтернатива возможна, но по-русски менее устойчива и может сильнее акцентировать процесс наставления.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизации. Контраст передан кратким «Ты же»; фраза остаётся доступной обычному читателю.
