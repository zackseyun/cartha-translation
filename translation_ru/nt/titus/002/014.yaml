  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: ru
  text: который отдал себя за нас, чтобы искупить нас от всякого беззакония и очистить для себя народ — своё особое достояние[a], исполненный рвения к добрым делам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «особый народ», «драгоценный народ» или «народ, принадлежащий ему». Греческое выражение сохраняет заветный смысл народа, который принадлежит ему как особое достояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: отдал себя
  rationale: Передаёт добровольную самоотдачу и сохраняет возвратное значение греческого выражения без добавления «на смерть», которого в тексте нет.
- source_word: ὑπὲρ ἡμῶν
  choice: за нас
  rationale: Кратко и естественно передаёт действие ради нас и в нашу пользу, не сводя возможный заместительный оттенок к единственной модели искупления.
- source_word: ἵνα λυτρώσηται
  choice: чтобы искупить
  rationale: «Искупить» сохраняет смысл освобождения ценой выкупа и богословскую насыщенность глагола λυτρόομαι.
- source_word: ἀπὸ πάσης ἀνομίας
  choice: от всякого беззакония
  rationale: «Беззаконие» точно передаёт ἀνομία, а «всякого» сохраняет всеохватность πάσης.
- source_word: καθαρίσῃ
  choice: очистить
  rationale: Передаёт нравственно-культовый и заветный смысл очищения, оставаясь естественным в современном русском языке.
- source_word: ἑαυτῷ
  choice: для себя
  rationale: 'Передаёт дательный отношения или принадлежности: очищенный народ предназначен Христу и принадлежит ему.'
- source_word: λαὸν περιούσιον
  choice: народ — своё особое достояние
  rationale: Формулировка сохраняет заветную идею народа, особо принадлежащего Богу, и звучит естественнее буквального «народ в собственность».
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: исполненный рвения к добрым делам
  rationale: Передаёт деятельную горячую преданность добрым делам; это естественнее по-русски, чем калька «ревностный к добрым делам».
theological_decisions:
- issue: Смысл ὑπὲρ ἡμῶν в самоотдаче Христа
  choice: «за нас»
  alternative: «ради нас»; «вместо нас»
  rationale: «За нас» допускает как благотворный, так и заместительный оттенок и не разрешает в переводе богословскую многозначность предлога односторонне.
- issue: Заветный оттенок λαὸν περιούσιον
  choice: «народ — своё особое достояние»
  alternative: «особый народ»; «драгоценный народ»; «народ, принадлежащий ему»
  rationale: Выбранная формулировка удерживает вероятную отсылку к языку Септуагинты о народе как особом Божьем достоянии, не сводя смысл лишь к необычности или ценности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Синтаксис сохраняет зависимость относительного предложения от предыдущего стиха. Местоимения, относящиеся к Христу, написаны со строчной буквы согласно обычной современной орфографической норме; тире естественно раскрывает приложение «особое достояние».
