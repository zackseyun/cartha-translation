lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Союз естественно передаёт целевое значение греческой конструкции с сослагательным наклонением.
- source_word: σωφρονίζωσι
  choice: наставляли
  rationale: Глагол означает приводить к здравомыслию, вразумлять или обучать благоразумному поведению. «Наставляли» передаёт продолжительное формирующее воздействие, не сводя его лишь к сообщению знаний.
- source_word: τὰς νέας
  choice: молодых женщин
  rationale: Субстантивированное прилагательное женского рода обозначает молодых или более молодых женщин в противопоставлении пожилым женщинам из ближайшего контекста. Вариант не сужает значение до «молодых жён».
- source_word: φιλάνδρους
  choice: любить своих мужей
  rationale: Сложное прилагательное обозначает любовь и привязанность к мужу. В русском инфинитив после «наставляли» звучит естественнее буквального «быть любящими мужей».
- source_word: εἶναι
  choice: любить
  rationale: Связка εἶναι с двумя прилагательными включена в естественную русскую инфинитивную конструкцию «любить…», соответствующую управлению глагола «наставляли».
- source_word: φιλοτέκνους
  choice: любить … детей
  rationale: Сложное прилагательное обозначает любовь и привязанность к детям; параллелизм с φιλάνδρους передан однородными дополнениями при одном глаголе «любить».
theological_decisions:
- issue: Круг молодых женщин, к которым относится наставление
  choice: Сохранить общее обозначение «молодых женщин», не сужая его в самом переводе до «молодых жён».
  alternative: Перевести «молодых жён», исходя из последующего упоминания мужей и детей.
  rationale: В греческом тексте подразумеваются женщины, а не выражено существительное «жёны». Упоминание мужей и детей описывает предполагаемую в данном наставлении семейную ситуацию, но не даёт оснований превращать её в исчерпывающее определение всех молодых женщин.
- issue: Форма характеристик φιλάνδρους и φιλοτέκνους
  choice: Передать их естественной русской конструкцией «любить своих мужей и детей».
  alternative: 'Более формально: «быть любящими мужей, любящими детей».'
  rationale: Выбранная формулировка сохраняет смысл обеих характеристик и их параллелизм, не добавляя учения о распределении семейных ролей сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Наставляли» уместно для межпоколенческого нравственного обучения; притяжательное «своих» естественно уточняет отношения с мужьями, а при слове «детей» распространяется по смыслу и на второй объект. Порядок маркеров приведён в последовательности их появления в русском тексте.
