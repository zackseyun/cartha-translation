  yaml_path: translation/nt/titus/002/010.yaml
  text: not pilfering[a], but showing all good faith, so that in everything they may adorn the teaching of God our Savior.
translation:
  language: ru
  text: не присваивая чужого, но проявляя всяческую добросовестность[a], чтобы во всём украшать учение Бога — нашего Спасителя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проявляя полную верность» или «показывая себя во всём достойными доверия». Греческое слово πίστις часто означает «веру», но здесь по контексту, вероятнее всего, речь идёт о верности, надёжности и добросовестности.'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: νοσφιζομένους
  choice: не присваивая чужого
  rationale: Глагол обозначает присвоение себе того, что принадлежит другому. В контексте поведения рабов эта формулировка точна и естественна; она не сужает смысл до конкретной формы хищения.
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: проявляя полную верность
  rationale: В данном контексте πίστις имеет прежде всего этический смысл верности и надёжности. «Полную» передаёт усиливающее πᾶσαν, а положительная оценка ἀγαθήν естественно заключена в русском слове «верность» и пояснена в сноске.
- source_word: κοσμῶσιν
  choice: украшать
  rationale: 'Сохраняется метафора украшения: достойное поведение делает Божье учение привлекательным и приносит ему честь.'
- source_word: διδασκαλίαν
  choice: учение
  rationale: Современное и общепонятное соответствие, не имеющее излишне специального оттенка слова «доктрина».
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Бога — нашего Спасителя
  rationale: Тире ясно показывает, что «нашего Спасителя» является приложением к слову «Бога», и сохраняет прямой смысл греческого выражения.
- source_word: ἐν πᾶσιν
  choice: во всём
  rationale: Передаёт широкий охват поведения и сохраняет естественность русского выражения.
theological_decisions:
- issue: Значение πίστις в этическом контексте
  choice: «верность» в основном тексте
  alternative: «надёжность», «добросовестность»; буквально также «вера»
  rationale: Речь идёт о поведении рабов по отношению к хозяевам, поэтому контекст указывает на верность и надёжность, а не на внутреннюю веру. Сноска сохраняет смысловой диапазон слова.
- issue: К кому относится титул «наш Спаситель»
  choice: к Богу, как прямо сказано в данной фразе
  alternative: не уточнять здесь связь с употреблением титула «Спаситель» по отношению ко Христу в других местах Послания
  rationale: Перевод передаёт синтаксис данного стиха и не вводит в него утверждений, которые зависят от более широкого богословского контекста.
translation_notes:
  register: Современный литературный русский язык с сохранением метафоры «украшать учение». Формулировка «присваивая чужое» понятна широкому читателю и точнее передаёт действие, чем разговорное «подворовывая» или более узкое юридическое «растрачивая».
