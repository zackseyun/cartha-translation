  text: προσδεχόμενοι τὴν μακαρίαν ἐλπίδα καὶ ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/013.yaml
  text: as we await the blessed hope and the appearing of the glory of our great God and Savior[a], Jesus the Messiah,
translation:
  language: ru
  text: ожидая блаженной надежды и явления славы нашего великого Бога и Спасителя[a] — Иисуса Мессии,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, менее вероятно: «славы великого Бога и нашего Спасителя Иисуса Мессии», если понимать слова «Бог» и «Спаситель» как обозначения двух разных лиц, а не как единый титул Иисуса.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: ожидая
  rationale: Деепричастие естественно продолжает синтаксис предыдущего стиха и передаёт длительное, устремлённое к будущему ожидание.
- source_word: μακαρίαν ἐλπίδα
  choice: блаженной надежды
  rationale: «Блаженная надежда» сохраняет возвышенный эсхатологический смысл; речь идёт не о неопределённом желании, а об ожидаемом будущем благе.
- source_word: ἐπιφάνειαν
  choice: явления
  rationale: «Явление» ясно передаёт видимое обнаружение и эсхатологический смысл слова без специального термина «эпифания».
- source_word: δόξης
  choice: славы
  rationale: Родительный падеж сохраняет греческую конструкцию «явление славы», не сводя её без необходимости к «славному явлению».
- source_word: τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν
  choice: нашего великого Бога и Спасителя
  rationale: Единый артикль при двух личных существительных естественнее всего указывает на одно лицо; русский порядок слов звучит современно и сохраняет единое титулование.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός передано смысловым титулом «Мессия», а не традиционной транслитерацией; родительный падеж оформляет приложение к словам «Бога и Спасителя».
theological_decisions:
- issue: Относится ли выражение «великий Бог и Спаситель» только к Иисусу или к Богу и Иисусу как к двум разным лицам?
  choice: Иисус Мессия назван одним лицом — «нашим великим Богом и Спасителем».
  alternative: «Слава великого Бога и нашего Спасителя Иисуса Мессии», где имеются в виду два лица.
  rationale: В греческом один артикль управляет двумя соединёнными союзом singularными личными существительными, после которых стоит «Иисуса Мессии»; это наиболее естественно образует единое обозначение одного лица. Тире в русском тексте ясно оформляет приложение, а менее вероятный двухреферентный разбор сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Сохранена зависимость от предыдущего стиха посредством деепричастия «ожидая»; тире естественно обозначает пояснительное приложение. Запятая в конце отражает продолжение предложения.
