lexical_decisions:
- source_word: λόγον
  choice: речь
  rationale: В данном контексте слово относится к содержанию и характеру речи Тита при наставлении, а не к отдельному слову. «Речь» естественно сочетается с последующими определениями.
- source_word: ὑγιῆ
  choice: здравую
  rationale: Сохраняет характерную для Пастырских посланий метафору здоровья применительно к учению и речи и звучит естественно в современном русском языке.
- source_word: ἀκατάγνωστον
  choice: не подлежащую осуждению
  rationale: Передаёт значение речи, против которой нельзя выдвинуть обоснованное порицание; оборот сохраняет оттенок оценки и осуждения.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевое значение союза.
- source_word: ὁ ἐξ ἐναντίας
  choice: противник
  rationale: Греческое субстантивированное выражение буквально указывает на человека с противоположной стороны; «противник» кратко и естественно передаёт этот смысл.
- source_word: ἐντραπῇ
  choice: устыдился
  rationale: Передаёт переживание стыда вследствие отсутствия оснований для обвинения; русская возвратная форма естественно выражает смысл греческого пассива, не сводя его к простому смущению.
- source_word: μηδὲν ἔχων λέγειν
  choice: не имея сказать ... ничего
  rationale: Сохраняет греческую причастную конструкцию и смысл отсутствия каких-либо оснований для обвинительной речи.
- source_word: περὶ ἡμῶν
  choice: о нас
  rationale: Точно сохраняет первое лицо множественного числа, не сужая и не расширяя круг подразумеваемых лиц.
- source_word: φαῦλον
  choice: дурного
  rationale: В контексте возможных обвинений означает нечто нравственно плохое или предосудительное; «дурного» естественно сочетается с глаголом «сказать» и сохраняет моральную окраску.
theological_decisions:
- issue: Круг лиц, обозначенных местоимением περὶ ἡμῶν
  choice: «о нас» без уточнения
  alternative: «о тебе», «о нас, христианах» или «о нашем учении»
  rationale: В греческом тексте стоит первое лицо множественного числа. Его сохранение не навязывает ни узкого отнесения только к Титу, ни расширительного отнесения ко всей христианской общине.
- issue: Характер стыда в ἐντραπῇ
  choice: «устыдился»
  alternative: «был пристыжен» или «оказался посрамлён»
  rationale: Форма допускает оттенок того, что противник будет приведён к стыду, однако «устыдился» естественно по-русски передаёт результат при сохранении нравственно-социального напряжения контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет связь с предшествующим перечнем наставлений; лексика понятна широкому читателю и не вводит конфессионально обусловленных уточнений.
