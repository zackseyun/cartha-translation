translation:
  language: ru
  text: быть благоразумными, чистыми, заниматься домашними делами[a], быть добрыми, подчиняться своим мужьям[b], чтобы слово Божье не подвергалось поношению[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «трудиться по дому» или «заботиться о доме». Редкое греческое слово обозначает деятельность, связанную с домашним хозяйством.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «быть покорными своим мужьям».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не подвергалось хуле»; более буквально: «не хулилось».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σώφρονας
  choice: благоразумны
  rationale: Слово обозначает здравомыслие, проявляющееся в сдержанности и владении собой. «Благоразумны» естественно передаёт эту нравственно-практическую добродетель и согласуется с контекстом наставления.
- source_word: ἁγνάς
  choice: чисты
  rationale: Прилагательное выражает прежде всего нравственную чистоту. Краткое «чисты» сохраняет широту греческого слова и не сужает его исключительно до полового целомудрия.
- source_word: οἰκουργούς
  choice: занимались домашними делами
  rationale: Редкое сложное слово связано с домом и трудом и указывает на деятельное исполнение домашних обязанностей. Такой перевод передаёт трудовой аспект, не добавляя идеи обязательного пребывания исключительно дома.
- source_word: ἀγαθάς
  choice: были добры
  rationale: В перечне качеств слово указывает на нравственную доброту, которая проявляется в отношении к другим. «Добры» звучит естественно и содержательнее буквального, но расплывчатого «хороши».
- source_word: ὑποτασσομένας
  choice: подчинялись
  rationale: Причастие обозначает признание установленного порядка и подчинение. «Подчинялись» прямо передаёт смысл, не разворачивая его в более широкую богословскую систему.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: своим мужьям
  rationale: В семейном контексте ἀνήρ означает «муж», а ἰδίοις ограничивает отношение собственным супругом каждой женщины, а не мужчинами вообще.
- source_word: ἵνα μὴ
  choice: чтобы ... не
  rationale: Обычная русская целевая конструкция сохраняет направленность наставления на предотвращение дурной молвы о Божьем слове.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: слово Божье
  rationale: Устоявшееся и прямое обозначение Божьей вести; форма «Божье» естественна в современном литературном русском языке.
- source_word: βλασφημῆται
  choice: не подвергалось хуле
  rationale: Глагол означает злословить, поносить или хулить. Поскольку объектом выступает Божье слово, «подвергалось хуле» сохраняет религиозную серьёзность выражения и одновременно допускает смысл публичного поношения.
theological_decisions:
- issue: Передача οἰκουργούς без усиления идеи домашнего затворничества
  choice: занимались домашними делами
  alternative: были хранительницами дома; работали дома
  rationale: Греческое слово подчёркивает домашнюю деятельность и ответственность, но само по себе не утверждает запрета на всякую работу или деятельность вне дома.
- issue: Передача ὑποτασσομένας без конфессионального расширения
  choice: подчинялись своим мужьям
  alternative: были покорны своим мужьям; повиновались своим мужьям
  rationale: Перевод сохраняет выраженное в тексте отношение подчинения и ограничивает его брачной связью благодаря слову «своим», не добавляя общей доктрины о положении женщин или полномочиях мужей.
- issue: Связь поведения адресатов с общественным отношением к Божьему слову
  choice: чтобы слово Божье не подвергалось хуле
  alternative: чтобы слово Божье не злословили
  rationale: 'Страдательная конструкция сохраняет грамматическую форму и богословское напряжение исходного текста: поведение верующих может стать поводом для поношения Божьей вести, хотя сама весть не представлена виновной.'
translation_notes:
  register: 'Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет зависимость стиха от предыдущего наставления: начальное «были» продолжает подразумеваемую конструкцию о том, чему следует учить молодых женщин. Перечень передан однородными формами, а редкий бытовой термин раскрыт без архаизма и без идеи принудительного затворничества.'
