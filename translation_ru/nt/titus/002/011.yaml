  text: Ἐπεφάνη γὰρ ἡ χάρις τοῦ ⸀θεοῦ σωτήριος πᾶσιν ἀνθρώποις
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/011.yaml
  text: For the grace of God has appeared[b][a], bringing salvation to all people.
translation:
  language: ru
  text: Ведь явилась благодать Бога, несущая спасение всем людям[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «спасительная для всех людей» или «явилась, спасая всех людей»; выражение можно понять и как «явилась всем людям». Греческое прилагательное σωτήριος («спасительная», «несущая спасение») и дательный оборот πᾶσιν ἀνθρώποις допускают несколько близких синтаксических связей.'
    reason: lexical_alternative
  - marker: b
    text: Слово «людям» передаёт греческое ἀνθρώποις, которое здесь обозначает людей вообще, а не только мужчин.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεφάνη
  choice: явилась
  rationale: 'Аорист ἐπιφαίνω употреблён непереходно: благодать стала явной, явилась. Совершенный вид естественно передаёт совершившееся событие, значимое для настоящего контекста.'
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит основание предыдущего наставления; «ведь» естественно и ясно выражает эту пояснительно-причинную связь.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: благодать Бога
  rationale: «Благодать» сохраняет устойчивый богословский смысл χάρις, а родительный τοῦ θεοῦ передан без уточнения, означает ли он принадлежность или источник.
- source_word: σωτήριος
  choice: несущая спасение
  rationale: Прилагательное характеризует благодать как спасительную, приносящую спасение. Причастный оборот звучит по-русски естественно и не вводит дополнительных богословских утверждений.
- source_word: πᾶσιν ἀνθρώποις
  choice: всем людям
  rationale: ἄνθρωποι обозначает людей вообще, а не только мужчин. Дательный падеж сохранён в естественной русской конструкции и не сужает всеобщий охват выражения.
theological_decisions:
- issue: Охват выражения πᾶσιν ἀνθρώποις применительно к спасению
  choice: «всем людям» — сохранён универсальный охват греческого выражения без пояснения, идёт ли речь о каждом отдельном человеке или обо всех группах людей.
  alternative: «всяким людям» / «всем родам людей»
  rationale: Контекст перечисляет разные группы, однако сам стих говорит πᾶσιν ἀνθρώποις без ограничивающего слова «роды» или «категории»; перевод не должен заранее разрешать сотериологический спор.
- issue: Синтаксическая связь σωτήριος и πᾶσιν ἀνθρώποις
  choice: σωτήριος отнесено к «благодати», а πᾶσιν ἀνθρώποις — к выражению «несущая спасение».
  alternative: «спасительная для всех людей» или «явилась всем людям»
  rationale: Греческий допускает несколько близких способов синтаксического осмысления. Основной текст передаёт наиболее естественную связь, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. «Ведь» ясно связывает стих с предшествующим наставлением; порядок слов остаётся естественным и при этом близким к греческому. Маркеры сносок поставлены после всего спорного оборота в последовательности [a][b].
