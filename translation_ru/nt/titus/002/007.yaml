lexical_decisions:
- source_word: περὶ πάντα
  choice: во всём
  rationale: Сочетание употреблено наречно и указывает на всеохватность поведения Тита. «Во всём» естественно по-русски и сохраняет возможный оттенок «во всех отношениях».
- source_word: σεαυτὸν παρεχόμενος
  choice: показывай себя
  rationale: Средний причастный оборот выражает сознательное представление самого себя в качестве примера. С учётом повелительного контекста предыдущего стиха по-русски естественно передать его личной повелительной формой.
- source_word: τύπον
  choice: примером
  rationale: В нравственном контексте слово обозначает образец для подражания. «Пример» ясно и современно передаёт этот смысл.
- source_word: καλῶν ἔργων
  choice: добрых дел
  rationale: Прямое соответствие родительному сочетанию; выражение сохраняет широкий нравственный смысл без дополнительного богословского сужения.
- source_word: ἐν τῇ διδασκαλίᾳ
  choice: в своём учении
  rationale: По контексту речь идёт о том, как и чему учит Тит. Возвратное «своём» естественно связывает наставление с адресатом, не сводя διδασκαλία к формальной доктрине.
- source_word: ἀφθορίαν
  choice: чистоту
  rationale: В данном контексте существительное обозначает отсутствие порчи или искажения в учении и поведении учителя. «Чистота» звучит естественно, оставляя открытыми оттенки неподкупности и цельности.
- source_word: σεμνότητα
  choice: достоинство
  rationale: Слово обозначает внушающую уважение серьёзность. «Достоинство» передаёт уважительный и весомый характер поведения без оттенка мрачности.
theological_decisions:
- issue: Передача διδασκαλία церковно-догматическим термином
  choice: «в своём учении»
  alternative: «в учении»; «в вероучении»
  rationale: Контекст охватывает наставническую деятельность Тита и, вероятно, её содержание и манеру. «Учение» сохраняет эту широту, тогда как «вероучение» неоправданно сужает смысл.
- issue: Конкретизация значения ἀφθορία
  choice: «чистоту» с примечанием об альтернативных оттенках
  alternative: «неповреждённость»; «неподкупность»; «цельность»
  rationale: Греческое слово допускает как отсутствие искажения в учении, так и нравственную цельность учителя. Основной текст должен быть понятным, а примечание сохраняет реальную смысловую широту.
translation_notes:
  register: 'Современный литературный русский язык, ясный и достойный по тону. Причастная конструкция оригинала преобразована в повелительную в соответствии с синтаксической зависимостью от призыва в предыдущем стихе. Точка с запятой сохраняет две взаимосвязанные стороны наставления: личный пример и качества учения.'
