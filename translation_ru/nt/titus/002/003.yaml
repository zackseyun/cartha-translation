source:
  edition: SBLGNT
  text: Πρεσβύτιδας ὡσαύτως ἐν καταστήματι ἱεροπρεπεῖς, μὴ διαβόλους ⸀μηδὲ οἴνῳ πολλῷ δεδουλωμένας, καλοδιδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/003.yaml
  text: Older women likewise are to be reverent in behavior[a], not slanderers nor enslaved to much wine, teachers of what is good[b],
translation:
  language: ru
  text: Пожилые женщины также должны вести себя благоговейно[a], не быть клеветницами, не быть порабощёнными многим вином[b], учить добру.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вести себя так, как подобает священному».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не быть порабощёнными многим вином».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβύτιδας
  choice: Пожилые женщины
  rationale: Обозначает женщин старшего возраста и соответствует упоминанию пожилых мужчин в предыдущем стихе; это естественное и ясное выражение в современном русском языке.
- source_word: ὡσαύτως
  choice: также
  rationale: Сохраняет связь с предшествующим наставлением и естественно вводит параллельное увещание.
- source_word: ἐν καταστήματι ἱεροπρεπεῖς
  choice: должны вести себя благоговейно
  rationale: κατάστημα обозначает внешний образ поведения, а ἱεροπρεπής — поведение, подобающее святыне. Выбранная формулировка передаёт оба элемента естественным современным русским языком.
- source_word: μὴ διαβόλους
  choice: не быть клеветницами
  rationale: В данном перечне διάβολος обозначает человека, который клевещет или ложно обвиняет, а не дьявола. «Клеветницами» прямо передаёт этический смысл без лишнего расширения.
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: не становиться рабынями пристрастия к вину
  rationale: Формулировка сохраняет образ рабской зависимости, выраженный δουλόω, а «пристрастие к вину» естественно передаёт власть чрезмерного употребления вина. Русское «становиться» здесь описывает недопустимое состояние как результат порабощения, хотя греческий перфект непосредственно указывает на уже сложившуюся зависимость.
- source_word: καλοδιδασκάλους
  choice: учить добру
  rationale: Редкое сложное слово обозначает обучение тому, что хорошо. «Учить добру» ясно указывает на содержание наставления и не создаёт двусмысленности «хорошие учительницы».
theological_decisions:
- issue: Образ рабства в увещании об употреблении вина
  choice: 'Сохранить образ порабощения: «не становиться рабынями пристрастия к вину»'
  alternative: «не злоупотреблять вином» или «не пристраститься к вину»
  rationale: Греческий глагол δουλόω представляет зависимость как рабство и господство вина над человеком. Сохранение этого образа передаёт силу исходного текста, не сводя выражение к более общему запрету злоупотребления.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и наставительным звучанием. Синтаксис сделан естественным для русского языка посредством повторяемой конструкции «должны…», при этом сохранены параллельность увещаний, образ рабской зависимости и смысл обучения добру.
