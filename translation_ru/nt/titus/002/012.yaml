  text: παιδεύουσα ἡμᾶς, ἵνα ἀρνησάμενοι τὴν ἀσέβειαν καὶ τὰς κοσμικὰς ἐπιθυμίας σωφρόνως καὶ δικαίως καὶ εὐσεβῶς ζήσωμεν ἐν τῷ νῦν αἰῶνι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/012.yaml
  text: training us[a], so that, having renounced ungodliness and worldly desires, we might live self-controlled, righteous, and godly lives in the present age[c][b],
translation:
  language: ru
  text: воспитывающая нас, чтобы мы, отвергнув нечестие и мирские желания[a], жили в нынешнем веке благоразумно, праведно и благочестиво.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мирские страсти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύουσα
  choice: наставляющая
  rationale: 'Причастие описывает формирующее воздействие благодати: обучение, воспитание и нравственное наставление. «Наставляющая» естественно передаёт этот широкий смысл без излишне карательного оттенка.'
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое значение союза и естественно связывает действие благодати с последующей жизнью верующих.
- source_word: ἀρνησάμενοι
  choice: отвергнув
  rationale: Деепричастие передаёт решительный отказ, предшествующий описанному образу жизни, и сохраняет значение аористного причастия.
- source_word: ἀσέβειαν
  choice: нечестие
  rationale: Передаёт религиозно-нравственный смысл жизни без почтения к Богу; это устоявшееся и понятное библейское слово в современном русском языке.
- source_word: κοσμικὰς ἐπιθυμίας
  choice: мирские желания
  rationale: Обозначает желания, принадлежащие нынешнему мирскому порядку. «Мирские» сохраняет нравственный оттенок κοσμικός, а «желания» не усиливает значение до страстей без необходимости.
- source_word: σωφρόνως
  choice: благоразумно
  rationale: Наречие выражает здравомыслие, сдержанность и самообладание. «Благоразумно» естественно в ряду трёх наречий и соответствует повторяющейся теме Послания к Титу.
- source_word: δικαίως
  choice: праведно
  rationale: Сохраняет форму наречия и нравственно-богословское значение поведения в соответствии с тем, что право.
- source_word: εὐσεβῶς
  choice: благочестиво
  rationale: Передаёт благоговейную, направленную к Богу жизнь и сохраняет параллелизм трёх греческих наречий.
- source_word: ζήσωμεν
  choice: жили
  rationale: Форма после «чтобы» естественно передаёт греческий конъюнктив и его целевую направленность, не превращая высказывание в прямое повеление.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: в нынешнем веке
  rationale: Сохраняет эсхатологическое значение αἰών — нынешней эпохи в противопоставлении грядущему веку.
theological_decisions:
- issue: Триада σωφρόνως καὶ δικαίως καὶ εὐσεβῶς
  choice: благоразумно, праведно и благочестиво
  alternative: с самообладанием, праведностью и благочестием
  rationale: Греческий текст содержит три наречия, непосредственно характеризующие то, как следует жить. Русский язык позволяет естественно сохранить эту грамматическую и риторическую структуру без преобразования в существительные.
- issue: Отношение ἀρνησάμενοι к ζήσωμεν
  choice: отвергнув … жили
  alternative: отвергая … жили
  rationale: Аористное причастие допускает представление решительного отказа как логически предшествующего новому образу жизни. При этом перевод не утверждает, что борьба с желаниями полностью завершена раз и навсегда.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранены причастная связь с контекстом предыдущего стиха, целевая конструкция и три греческих наречия. Маркер сноски поставлен непосредственно после выражения, к которому относится.
