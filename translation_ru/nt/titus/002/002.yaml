id: TIT.2.2
reference: Titus 2:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: ru
  text: Пожилые мужчины должны быть трезвыми, достойными, рассудительными, здравыми в вере[a], любви и стойкости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верности». Греческое πίστις в данном контексте может означать как веру, так и верность.'
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτας
  choice: пожилые мужчины
  rationale: В наставлениях возрастным группам слово обозначает мужчин старшего возраста, а не церковных пресвитеров.
- source_word: νηφαλίους
  choice: трезвыми
  rationale: Слово указывает как на буквальную трезвость, так и шире на сдержанность и ясность ума; русское «трезвыми» сохраняет эту связь.
- source_word: σεμνούς
  choice: достойными
  rationale: Передаёт серьёзность и благородство поведения, вызывающего уважение, без оттенка мрачности.
- source_word: σώφρονας
  choice: рассудительными
  rationale: Передаёт здравое, дисциплинированное самообладание и не дублирует полностью значение «трезвыми».
- source_word: ὑγιαίνοντας
  choice: здравыми
  rationale: Сохраняет метафору здоровья, применённую к основным христианским добродетелям.
- source_word: τῇ πίστει
  choice: в вере
  rationale: «Вера» является естественным основным соответствием πίστις; допустимое значение «верность» сохранено в сноске.
- source_word: τῇ ἀγάπῃ
  choice: любви
  rationale: Прямое и естественное соответствие ἀγάπη; предлог «в» распространяется на весь однородный ряд.
- source_word: τῇ ὑπομονῇ
  choice: стойкости
  rationale: Передаёт терпеливую выносливость и постоянство перед лицом трудностей.
- source_word: εἶναι
  choice: должны быть
  rationale: Ясно выражает наставительный характер инфинитива, зависящего от указания в предыдущем стихе.
theological_decisions:
- issue: Значение πίστις в перечне добродетелей
  choice: вера
  alternative: верность
  rationale: В сочетании «вера, любовь и стойкость» πίστις может обозначать как веру и доверие, так и верность. Основной текст следует наиболее обычному соответствию, не устраняя альтернативу.
translation_notes:
  register: Современный литературный русский язык; краткий и ритмичный перечень добродетелей. Формулировка сохраняет метафору духовного здоровья и различает близкие по смыслу νηφάλιος и σώφρων.
