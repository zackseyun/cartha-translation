  text: εἷς ⸀ἐστιν νομοθέτης ⸂καὶ κριτής⸃, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ⸂ὁ κρίνων⸃ τὸν ⸀πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/012.yaml
  text: There is one Lawgiver and Judge, the one who is able to save and to destroy. But who are you, judging your neighbor?
translation:
  language: ru
  text: Есть один Законодатель и Судья — тот, кто может спасти и погубить. А ты кто такой, что судишь ближнего?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομοθέτης
  choice: Законодатель
  rationale: Прямо передаёт значение того, кто устанавливает закон, и сохраняет связь с упоминанием закона в ближайшем контексте.
- source_word: κριτής
  choice: Судья
  rationale: Точный и естественный русский эквивалент, сохраняющий параллель с последующим «судишь».
- source_word: ἀπολέσαι
  choice: погубить
  rationale: Передаёт сильное значение уничтожения или гибели без неоправданного уточнения о временной либо вечной участи.
- source_word: ὁ κρίνων
  choice: что судишь
  rationale: Естественная русская передача субстантивированного причастия в риторическом вопросе; сохраняет направленную на адресата обличительную силу.
- source_word: πλησίον
  choice: ближнего
  rationale: Традиционный и понятный библейский термин для другого человека, находящегося в сфере нравственной ответственности.
theological_decisions:
- issue: Единственность Законодателя и Судьи
  choice: «Один есть Законодатель и Судья»
  alternative: «Есть только один Законодатель и Судья»
  rationale: Сохраняет выраженную греческим εἷς эмфазу и достоинство речи, не добавляя пояснения о личности этого Судьи.
- issue: Смысл «спасти и погубить»
  choice: Сохранена краткая пара без богословского уточнения
  alternative: «даровать спасение и осудить на погибель»
  rationale: Исходный текст не определяет здесь вид спасения или погибели; буквальная смысловая пара сохраняет богословскую напряжённость.
- issue: Форма заключительного вопроса
  choice: «А ты кто такой, что судишь ближнего?»
  alternative: «Но кто ты, судящий ближнего?»
  rationale: Выбран естественный современный русский риторический оборот, который сохраняет причастный смысл и не превращает вопрос в отдельный запрет.
translation_notes:
  register: Современный литературный русский язык с достоинством и риторической силой. Заглавные буквы в «Тот, Кто» обозначают отнесённость к единственному Законодателю и Судье, не вводя в текст имени, отсутствующего в греческом оригинале.
