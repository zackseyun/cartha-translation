reference: James 4:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἵτινες οὐκ ἐπίστασθε ⸀τὸ τῆς αὔριον ⸀ποία ἡ ζωὴ ὑμῶν· ἀτμὶς γάρ ⸀ἐστε ⸀ἡ πρὸς ὀλίγον φαινομένη, ⸀ἔπειτα καὶ ἀφανιζομένη·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/014.yaml
  text: You do not know what tomorrow will bring[a]. What is your life? For you are a mist that appears for a little while and then vanishes.
translation:
  language: ru
  text: Вы не знаете, что будет завтра. Что такое ваша жизнь? Ведь вы — пар[a], который появляется ненадолго, а затем исчезает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дымка».'
    reason: Лексическая альтернатива для ἀτμίς, которое может обозначать пар, лёгкий туман или дымку.
lexical_decisions:
- source_word: ἐπίστασθε
  choice: не знаете
  rationale: В данном контексте глагол обозначает отсутствие знания о будущем; «не знаете» естественно и прямо передаёт смысл.
- source_word: τὸ τῆς αὔριον
  choice: что будет завтра
  rationale: Эллиптическое выражение указывает на завтрашние обстоятельства. Этот вариант естественен по-русски и не добавляет конкретики, которой нет в греческом тексте.
- source_word: ποία ἡ ζωὴ ὑμῶν
  choice: Что такое ваша жизнь?
  rationale: ποία ставит вопрос о природе или качестве жизни; формулировка сохраняет краткость и риторическую силу оригинала.
- source_word: ἀτμὶς
  choice: пар
  rationale: Слово обозначает пар или дымку — нечто видимое, но недолговечное. «Пар» даёт ясный и естественный в русском образ быстрого исчезновения; возможный вариант отмечен в сноске.
- source_word: πρὸς ὀλίγον
  choice: ненадолго
  rationale: Наречная передача естественно выражает краткую продолжительность и сохраняет лаконичность фразы.
- source_word: φαινομένη
  choice: появляется
  rationale: Причастие описывает то, что на короткое время становится видимым; «появляется» естественно передаёт этот образ.
- source_word: ἔπειτα καὶ ἀφανιζομένη
  choice: а затем исчезает
  rationale: Формулировка ясно сохраняет временную последовательность и последующее исчезновение.
theological_decisions:
- issue: Метафорическое изображение быстротечности человеческой жизни
  choice: Сохранить образ пара как риторическое указание на краткость и неопределённость человеческой жизни.
  alternative: 'Передать истолковательно: «ваша жизнь быстротечна».'
  rationale: Метафора важна для литературной и богословской напряжённости текста и не должна заменяться отвлечённым пояснением или дополняться утверждениями о суде и смертности, прямо здесь не выраженными.
translation_notes:
  register: Современный литературный русский язык; краткая, риторически выразительная формулировка. Обращение во множественном числе сохранено, метафора не истолкована сверх текста.
