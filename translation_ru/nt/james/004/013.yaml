  text: Ἄγε νῦν οἱ λέγοντες· Σήμερον ⸀ἢ αὔριον ⸀πορευσόμεθα εἰς τήνδε τὴν πόλιν καὶ ⸀ποιήσομεν ἐκεῖ ⸀ἐνιαυτὸν καὶ ⸀ἐμπορευσόμεθα καὶ ⸀κερδήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/013.yaml
  text: Come now[a], you who say, “Today or tomorrow we will go into this city and spend a year there and do business and make a profit.”
translation:
  language: ru
  text: 'Послушайте же, вы, которые говорите: «Сегодня или завтра мы отправимся в этот город, проведём там год, будем торговать и получим прибыль».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Послушайте теперь
  rationale: Призыв привлекает внимание и вводит прямое обличение. Такой перевод естественен для современного русского языка и сохраняет настойчивый риторический тон.
- source_word: οἱ λέγοντες
  choice: вы, которые говорите
  rationale: Субстантивированное причастие обращено непосредственно к адресатам; форма второго лица передаёт это яснее, чем отстранённое «те, кто говорит».
- source_word: Σήμερον ἢ αὔριον
  choice: Сегодня или завтра
  rationale: ἤ имеет разделительное значение «или» и обозначает один из предполагаемых ближайших дней.
- source_word: πορευσόμεθα
  choice: мы отправимся
  rationale: Будущая форма обозначает запланированное перемещение. «Отправимся» естественно выражает намеренный отъезд, не добавляя идеи дальнего путешествия.
- source_word: εἰς τήνδε τὴν πόλιν
  choice: в такой-то город
  rationale: Указательное τήνδε буквально относится к определённому городу в замысле говорящих. В воспроизводимой прямой речи русское «такой-то город» естественно передаёт типовой, но для самих говорящих конкретный пункт назначения; буквальная возможность отмечена в сноске.
- source_word: ποιήσομεν ἐκεῖ ἐνιαυτόν
  choice: проведём там год
  rationale: ποιέω с обозначением отрезка времени идиоматически означает провести этот период; русский перевод сохраняет и продолжительность, и место.
- source_word: ἐμπορευσόμεθα
  choice: будем торговать
  rationale: Глагол обозначает торговую, коммерческую деятельность. «Будем торговать» точно и понятно передаёт этот смысл.
- source_word: κερδήσομεν
  choice: получим прибыль
  rationale: В контексте торговли κερδαίνω означает финансовую выгоду; «получим прибыль» сохраняет коммерческую конкретность.
theological_decisions:
- issue: Тон прямого обличения
  choice: 'Прямое обращение: «вы, которые говорите»'
  alternative: 'Отстранённое описание: «те, кто говорит»'
  rationale: Иаков не просто описывает группу, а непосредственно обращается к самоуверенным планировщикам; прямое обращение сохраняет апострофический характер фразы.
- issue: Степень определённости города
  choice: Идиоматическое «такой-то город» с буквальным вариантом в сноске
  alternative: Буквальное «этот город»
  rationale: Греческое указательное выражение представляет город как определённый в плане говорящих, но в русском цитировании типового заявления «этот город» может ошибочно звучать как указание на город в непосредственной ситуации речи. Сноска сохраняет формальную особенность оригинала и его неоднозначность.
translation_notes:
  register: Современный литературный русский язык с прямым, достойным и понятным тоном. Цепочка глаголов будущего времени сохраняет самоуверенную последовательность человеческого плана; в сам стих не внесено явное богословское осуждение, которое раскрывается контекстом.
