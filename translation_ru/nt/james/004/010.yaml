  source_fidelity: «Смиритесь перед Господом, и он возвысит вас» точно передаёт императив ταπεινώθητε, пространственно-реляционное ἐνώπιον, намеренно неуточнённое κυρίου и обещание ὑψώσει ὑμᾶς. Возвратная форма «смиритесь» уместно передаёт увещательный, добровольный оттенок пассивного аористного императива, не исключая его формальной пассивности.
