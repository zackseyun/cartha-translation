id: JAS.4.10
reference: James 4:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ταπεινώθητε ἐνώπιον ⸀κυρίου, καὶ ὑψώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/010.yaml
  text: Humble yourselves before the Lord[b][a], and he will exalt you.
translation:
  language: ru
  text: Смиритесь перед Господом[a], и он возвысит вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в присутствии Господа».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поднимет вас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώθητε
  choice: смиритесь
  rationale: Аористный пассивный императив в данном увещательном контексте допускает возвратно-среднее понимание. «Смиритесь» естественно передаёт призыв к добровольному смирению, не превращая его лишь в описание внешнего унижения.
- source_word: ἐνώπιον
  choice: перед
  rationale: Предлог передаёт значение «перед кем-либо, в чьём-либо присутствии» и звучит естественно в современном литературном русском языке.
- source_word: κυρίου
  choice: Господом
  rationale: Традиционное и точное соответствие κύριος в данном религиозном контексте; форма творительного падежа обусловлена предлогом «перед». Перевод не уточняет, идёт ли речь о Боге или об Иисусе Христе.
- source_word: ὑψώσει
  choice: возвысит
  rationale: Глагол передаёт метафорическое возвышение и оказание чести после смирения; он сохраняет смысловую связь с противопоставлением высоты и уничижения.
- source_word: ὑμᾶς
  choice: вас
  rationale: Передаёт прямое обращение во втором лице множественного числа.
theological_decisions:
- issue: Кого обозначает «Господь»
  choice: Сохранено общее обозначение «Господь» без дальнейшего уточнения.
  alternative: Бог; Господь Иисус
  rationale: В Послании Иакова κύριος может относиться и к Богу, и к Иисусу. Непосредственный контекст не требует устранять эту неоднозначность.
- issue: Характер обещанного возвышения
  choice: Использовано широкое метафорическое «возвысит».
  alternative: поднимет; вознесёт; окажет честь
  rationale: Греческий текст не уточняет, является ли возвышение духовным, общественным или эсхатологическим; выбранная формулировка сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой увещания. «Перед» предпочтено более архаичному «пред»; местоимение «он» дано со строчной буквы в соответствии с обычной современной орфографией и без добавления отсутствующего в греческом тексте усиления.
