review_pass:
  verdict: revise
  source_fidelity: Передача императивов, будущего обещания и образов «рук» и «сердец» в целом точна. Однако «двоедушные» в современном литературном русском не является естественным и ясным обращением; к тому же оно может восприниматься как характеристика лицемерия, тогда как δίψυχοι прежде всего обозначает внутреннюю раздвоенность, разделённую верность. Более прозрачное «люди с раздвоенной душой» сохраняет образ и не сужает значение.
  naturalness: «Приблизьтесь к Богу, и он приблизится к вам» звучит естественно и сохраняет параллелизм. «Очистите руки, грешники» допустимо как библейски окрашенное обращение. «Сделайте чистыми сердца» понятно, но несколько тяжеловесно; «очистите сердца» естественнее. Лексическое различие καθαρίσατε / ἁγνίσατε может быть сохранено как «очистите» / «сделайте чистыми», однако в данном кратком русском контексте естественность и точный нравственно-ритуальный оттенок второго глагола лучше передаёт «очистите»; греческая вариация не требует искусственного разведения русских глаголов.
  terminology: «Бог», «грешники», «руки», «сердца» переданы корректно. Для δίψυχοι следует заменить редкое и потенциально неоднозначное «двоедушные» на ясное «люди с раздвоенной душой» и уточнить сноску как буквальную передачу образа, не приписывая ему более узкий смысл.
  issues:
  - severity: medium
    issue: Неестественное и семантически рискованное «двоедушные».
    rationale: Слово архаично для современного литературного русского и может ассоциироваться с двуличием. Греческое δίψυχοι буквально образовано от «две души» и в контексте обозначает разделённость внутренней верности; это лучше выражает описательный вариант с сохранением образа.
  - severity: low
    issue: «Сделайте чистыми сердца» стилистически тяжелее, чем требуется.
    rationale: Это допустимо, но «очистите сердца» естественно для русского библейского регистра и адекватно передаёт ἁγνίσατε. Полное различение двух греческих глаголов в русском здесь не обязательно, если оно ведёт к неуклюжести.
  revised_text: Приблизьтесь к Богу, и он приблизится к вам. Очистите руки, грешники, и очистите сердца, люди с раздвоенной душой[a].
