- from: Приблизьтесь к Богу, и он приблизится к вам. Очистите руки, грешники, и сделайте чистыми сердца, двоедушные[a].
  to: Приблизьтесь к Богу, и он приблизится к вам. Очистите руки, грешники, и очистите сердца, люди с раздвоенной душой[a].
  rationale: 'Исправление ограничено последним обращением и связанной сноской: оно делает текст понятным для современного читателя, сохраняет метафору оригинала и избегает ложных ассоциаций. Замена «сделайте чистыми» на «очистите» улучшает плавность фразы без изменения смысла; повтор соответствует параллельной повелительной структуре стиха.'
