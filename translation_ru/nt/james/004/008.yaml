  text: ἐγγίσατε τῷ θεῷ, καὶ ⸀ἐγγιεῖ ὑμῖν. καθαρίσατε χεῖρας, ἁμαρτωλοί, καὶ ἁγνίσατε καρδίας, δίψυχοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/008.yaml
  text: Draw near to God[a], and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, double-minded people.
translation:
  language: ru
  text: Приблизьтесь к Богу, и он приблизится к вам. Очистите руки, грешники, и очистите сердца, люди с раздвоенной душой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «двухдушные» или «имеющие две души». Речь о людях с разделённой внутренней верностью.'
    reason: Поясняет необычный греческий образ δίψυχοι, сохраняя его буквальный смысл и не сводя его к одному толкованию.
lexical_decisions:
- source_word: ἐγγίσατε
  choice: Приблизьтесь
  rationale: Аорист, действительный залог, повелительное наклонение, второе лицо множественного числа. «Приблизьтесь» естественно передаёт призыв подойти к Богу и позволяет сохранить словесный параллелизм со следующим предложением.
- source_word: τῷ θεῷ
  choice: к Богу
  rationale: Дательный падеж при ἐγγίζω обозначает того, к кому приближаются; по-русски естественно передаётся конструкцией «к Богу».
- source_word: ἐγγιεῖ
  choice: он приблизится
  rationale: Будущее время, действительный залог, третье лицо единственного числа; подразумеваемое подлежащее — Бог. Повтор глагола сохраняет параллелизм греческого текста.
- source_word: καθαρίσατε
  choice: Очистите
  rationale: Аористный императив передан прямым повелением. Глагол сохраняет как образ физического очищения рук, так и его нравственный смысл.
- source_word: χεῖρας
  choice: руки
  rationale: Сохранён телесный образ, который может указывать на поступки, но не развёрнут в толкование.
- source_word: ἁμαρτωλοί
  choice: грешники
  rationale: Форма обращения во множественном числе; резкий прямой укор сохранён без смягчения.
- source_word: ἁγνίσατε
  choice: сделайте чистыми
  rationale: Формулировка передаёт очищение от нравственной нечистоты и одновременно отличает этот глагол от καθαρίσατε, сохраняя лексическое варьирование оригинала.
- source_word: καρδίας
  choice: сердца
  rationale: Сохранён библейский образ сердца как внутреннего человека — области побуждений и верности.
- source_word: δίψυχοι
  choice: двоедушные
  rationale: Русское «двоедушные» сохраняет яркий греческий образ разделённой внутренней жизни и подходит для прямого обращения; сноска поясняет его значение современному читателю.
theological_decisions:
- issue: Образное очищение рук и сердец
  choice: Сохранить телесные образы «руки» и «сердца» без поясняющего пересказа.
  alternative: Передать смысл как очищение поступков и внутренних побуждений.
  rationale: Формулировка Иакова соединяет нравственное увещание с языком очищения и, возможно, с культовыми ассоциациями. Перевод не устраняет эту многослойность.
- issue: Передача δίψυχοι
  choice: «двоедушные» в основном тексте с пояснением в сноске.
  alternative: «колеблющиеся», «непостоянные» или «люди с раздвоенной преданностью».
  rationale: Более свободные варианты делают один аспект значения явным, но ослабляют образ двух душ и могут преждевременно сузить смысл до нерешительности. «Двоедушные» сохраняет образ и богословское напряжение разделённой верности.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и обличительным звучанием. Местоимение «он» написано со строчной буквы согласно обычной современной орфографической практике. Обращения сохранены в резкой форме оригинала; редкое «двоедушные» разъяснено сноской.
