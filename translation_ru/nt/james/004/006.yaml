  text: μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/006.yaml
  text: But he gives greater grace. Therefore it says[a], “God opposes the proud, but gives grace to the humble.”
translation:
  language: ru
  text: 'Но Он даёт большую благодать. Поэтому сказано[a]: «Бог противится гордым, а смиренным даёт благодать».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поэтому он говорит»; или: «Поэтому Писание говорит». В греческом тексте подлежащее при глаголе «говорит» не выражено.'
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα
  choice: ещё большую
  rationale: Сравнительная степень сохранена; «ещё большую» естественно выражает усиление по отношению к предшествующему контексту.
- source_word: δίδωσιν χάριν
  choice: даёт благодать
  rationale: Прямой и естественный перевод, сохраняющий словесный повтор в обеих частях стиха.
- source_word: διὸ
  choice: поэтому
  rationale: Ясно передаёт логическое следствие и звучит естественно в современном русском языке.
- source_word: λέγει
  choice: сказано
  rationale: Безличная форма не уточняет оставленный в греческом тексте невыраженным субъект и естественно вводит цитату Писания.
- source_word: ὑπερηφάνοις
  choice: гордым
  rationale: Передаёт субстантивированное прилагательное и сохраняет прямой контраст со «смиренными».
- source_word: ἀντιτάσσεται
  choice: противится
  rationale: Передаёт активное противостояние Бога; это ясное, ёмкое и уместное для библейского регистра слово.
- source_word: ταπεινοῖς
  choice: смиренным
  rationale: Передаёт этический смысл в данном контексте и образует естественную антитезу с «гордыми».
- source_word: δὲ
  choice: но / а
  rationale: В начале стиха «но» связывает утверждение с контекстом, а внутри цитаты «а» естественно оформляет противопоставление в русском языке.
theological_decisions:
- issue: Субъект при λέγει в формуле цитирования
  choice: Поэтому сказано
  alternative: Поэтому Он говорит / Поэтому Писание говорит
  rationale: В греческом тексте субъект не выражен. Безличная русская конструкция сохраняет эту неопределённость и не отождествляет говорящего явно ни с Богом, ни с Писанием.
- issue: Референт подразумеваемого субъекта в δίδωσιν
  choice: Он
  alternative: Бог
  rationale: Местоимение естественно продолжает предшествующий контекст, не добавляя имени в первую фразу; заглавная буква отражает отнесение к Богу, очевидное из контекста и последующей цитаты.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Сохранены сравнительная сила μείζονα, повтор «даёт благодать» и неопределённость субъекта в формуле цитирования.
