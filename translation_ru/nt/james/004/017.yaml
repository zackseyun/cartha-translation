  text: εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι, ἁμαρτία αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/017.yaml
  text: So[a], for the one who knows to do good and does not do it, it is sin for him.
translation:
  language: ru
  text: Итак[a], кто знает делать добро, но не делает этого, тому это грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поэтому тот, кто знает, что нужно делать добро, но не делает этого, — грешит».'
    reason: 'Лексико-синтаксический вариант: передаёт выводное значение οὖν как «поэтому» и эксплицирует этическую обязательность, подразумеваемую контекстом выражения «делать добро».'
lexical_decisions:
- source_word: εἰδότι
  choice: кто знает
  rationale: Дательный падеж единственного числа субстантивированного причастия обозначает человека, обладающего знанием. Русская обобщённо-личная конструкция «кто знает» естественно передаёт единственное число и общий смысл.
- source_word: οὖν
  choice: итак
  rationale: Союз вводит вывод из предшествующего рассуждения; «итак» ясно сохраняет логическую связь и соответствует литературному русскому регистру.
- source_word: καλὸν
  choice: добро
  rationale: В данном контексте слово обозначает нравственно доброе и должное. Существительное «добро» сохраняет широкий этический смысл, не сводя его к одному конкретному поступку.
- source_word: ποιεῖν
  choice: должен делать
  rationale: Инфинитив буквально означает «делать». В сочетании с εἰδότι и καλὸν русское «знает, что должен делать добро» естественно выражает знание нравственной обязанности, подразумеваемой конструкцией, однако альтернативное более формальное прочтение отмечено в сноске.
- source_word: μὴ ποιοῦντι
  choice: но не делает
  rationale: Причастие противопоставляет знание добра бездействию. Противительный союз «но» естественно передаёт смысловой контраст, а опущенное дополнение остаётся понятным из первой части.
- source_word: ἁμαρτία
  choice: грех
  rationale: Безартиклевое именное сказуемое характеризует такое бездействие как грех. Русская конструкция «это грех» передаёт качественный смысл без ненужного уточнения.
- source_word: αὐτῷ
  choice: для того
  rationale: Дательный отношения указывает на человека, для которого сознательное неделание добра является грехом. «Для того» согласуется с обобщённым «кто» и сохраняет личное применение.
- source_word: ἐστιν
  choice: это
  rationale: Русская именная конструкция в настоящем времени не требует выраженной связки; указательное «это» связывает предшествующее бездействие со сказуемым «грех».
theological_decisions:
- issue: Смысл утверждения о неделании добра
  choice: Стих утверждает, что сознательное неделание должного добра является грехом, сохраняя связь с предшествующим рассуждением и широкую этическую применимость.
  alternative: Ограничить утверждение исключительно непосредственным контекстом самонадеянного планирования либо оформить его как отдельное систематическое учение о грехах бездействия.
  rationale: οὖν связывает фразу с непосредственным контекстом, но обобщённая грамматическая форма выражает принцип шире одного примера. Перевод не сужает и не догматизирует это напряжение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Основной текст передаёт подразумеваемую нравственную обязанность естественной русской конструкцией; сноска сохраняет более формальную синтаксическую возможность. Маркер [a] помещён в основном тексте.
