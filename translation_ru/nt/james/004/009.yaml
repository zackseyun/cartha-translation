  text: ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε· ὁ γέλως ὑμῶν εἰς πένθος ⸀μετατραπήτω καὶ ἡ χαρὰ εἰς κατήφειαν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/009.yaml
  text: Be miserable and mourn and weep[b][a]. Let your laughter be turned into mourning and your joy into gloom.
translation:
  language: ru
  text: Сокрушайтесь, скорбите и плачьте. Пусть ваш смех обратится в скорбь, а радость — в уныние.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в подавленность». Греческое слово обозначает мрачное, поникшее состояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαιπωρήσατε
  choice: Сокрушайтесь
  rationale: Аористный императив призывает осознать своё бедственное состояние и глубоко сокрушиться. В данном контексте покаяния «сокрушайтесь» естественно и весомо по-русски, не сливаясь полностью со следующими «скорбите» и «плачьте».
- source_word: πενθήσατε
  choice: скорбите
  rationale: Передаёт глубокую скорбь, в том числе покаянную, и сохраняет связь с существительным πένθος во второй части стиха.
- source_word: κλαύσατε
  choice: плачьте
  rationale: Прямо передаёт плач как внешнее выражение скорби и сохраняет трёхчастное нарастание призывов.
- source_word: ὁ γέλως ὑμῶν
  choice: ваш смех
  rationale: Естественно передаёт существительное с притяжательным местоимением, сохраняя конкретный образ.
- source_word: εἰς πένθος
  choice: в скорбь
  rationale: Сохраняет смысл траура и глубокой печали, а также лексическую связь с «скорбите».
- source_word: μετατραπήτω
  choice: пусть … обратится
  rationale: Передаёт аористный пассивный императив и резкую перемену состояния; такая конструкция естественна для современного литературного русского языка.
- source_word: ἡ χαρὰ
  choice: радость
  rationale: В параллельной конструкции принадлежность естественно распространяется от «ваш смех» и на радость, хотя отдельное «ваша» не повторяется.
- source_word: εἰς κατήφειαν
  choice: в уныние
  rationale: Передаёт состояние подавленности, мрачной, опущенной печали. Русское «уныние» звучит естественно и не требует добавочного пояснения в основном тексте.
theological_decisions:
- issue: Покаянная скорбь и сила повелений
  choice: Сохранён резкий призыв к сокрушению, скорби и плачу.
  alternative: Ослабить до призыва стать серьёзнее или опечалиться.
  rationale: Контекст Иак. 4:6–10 указывает на смиренное покаяние перед Богом; сила трёх императивов не должна сглаживаться, но в перевод не добавляется отсутствующее в стихе прямое упоминание греха.
translation_notes:
  register: Современный литературный русский язык с торжественной и строгой интонацией. Трёхчастный ряд повелений и параллелизм второй половины сохранены; архаичные «возрыдайте» и «сетование» не использованы.
