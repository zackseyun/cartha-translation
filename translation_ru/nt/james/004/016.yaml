  yaml_path: translation/nt/james/004/016.yaml
  text: But as it is[a], you boast in your arrogance. All such boasting is evil.
translation:
  language: ru
  text: Теперь же вы хвалитесь своими самонадеянными притязаниями[a]. Всякое такое хвастовство — зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своей самонадеянностью», «своим высокомерием» или «своими хвастливыми заявлениями». Греческое слово может обозначать высокомерную претенциозность вообще; здесь оно, вероятно, относится прежде всего к самоуверенным планам, описанным в предыдущих стихах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Теперь же
  rationale: Передаёт временное значение νῦν и противопоставление δέ предыдущему призыву ставить планы в зависимость от воли Господа.
- source_word: καυχᾶσθε
  choice: вы хвалитесь
  rationale: Прямо и естественно передаёт значение глагола и сохраняет связь с однокоренным существительным καύχησις во второй части стиха.
- source_word: ἐν ταῖς ἀλαζονείαις ὑμῶν
  choice: своими самонадеянными притязаниями
  rationale: ἀλαζονεία обозначает высокомерную, хвастливую самоуверенность или притязание. Формулировка сохраняет множественное число и не сводит выражение исключительно к замыслам, хотя контекст связывает его с самоуверенными планами.
- source_word: πᾶσα καύχησις τοιαύτη
  choice: всякое такое хвастовство
  rationale: Сохраняет обобщающе-распределительное значение πᾶσα и качественную отсылку τοιαύτη — «такого рода».
- source_word: πονηρά
  choice: зло
  rationale: Передаёт нравственную оценку, а не просто отрицательное качество; именная конструкция по-русски звучит кратко и весомо.
theological_decisions:
- issue: Характер осуждаемого хвастовства
  choice: Осуждается самонадеянное хвастовство притязаниями и планами, не поставленными в зависимость от воли Господа.
  alternative: Общее осуждение любой уверенности в себе либо осуждение исключительно торгового планирования.
  rationale: Ближайший контекст Иак. 4:13–15 говорит о самоуверенном планировании, однако заключительная формулировка стиха имеет более общий нравственный охват. Перевод сохраняет обе стороны и не вводит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; тон краткий, обличительный и достойный. «Самонадеянные притязания» сохраняет смысловую широту и множественное число греческого выражения, не добавляя более узкого понятия «замыслы» в основной текст.
