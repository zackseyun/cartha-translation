  text: ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει· Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ ⸀κατῴκισεν ἐν ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/005.yaml
  text: Or do you think that the Scripture speaks in vain? The Spirit whom he caused to dwell in us yearns jealously[a].
translation:
  language: ru
  text: 'Или вы думаете, что Писание говорит напрасно: «Дух, которого Он поселил в нас, ревниво жаждет»?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «дух, который Он поселил в нас, жаждет с завистью». Греческий текст может говорить как о Святом Духе, так и о человеческом духе; слово, переведённое как «ревниво», может также означать «с завистью».'
    reason: Сохраняет грамматическую неоднозначность указания на Святого или человеческого духа и смысловую неоднозначность выражения πρὸς φθόνον.
lexical_decisions:
- source_word: κενῶς
  choice: напрасно
  rationale: Наречие передаёт мысль о пустых, бесцельных или не имеющих силы словах; «говорит напрасно» естественно звучит по-русски и сохраняет риторический вопрос.
- source_word: ἡ γραφὴ
  choice: Писание
  rationale: Единственное число с артиклем обозначает авторитетное Священное Писание; в русском библейском употреблении достаточно формы «Писание».
- source_word: Πρὸς φθόνον
  choice: ревностно
  rationale: Наречное прочтение при ἐπιποθεῖ передаёт сильную ревнивую или ревностную устремлённость. Оно не навязывает Святому Духу порочную зависть, а буквальная возможность значения «с завистью» отмечена в сноске.
- source_word: ἐπιποθεῖ
  choice: жаждет
  rationale: Глагол выражает сильное желание или томление; «жаждет» сохраняет интенсивность и достойный регистр.
- source_word: τὸ πνεῦμα
  choice: Дух
  rationale: В основном тексте принято понимание как Святого Духа, поскольку Бог поселил Его в верующих; грамматически возможное понимание человеческого духа сохранено в сноске.
- source_word: κατῴκισεν
  choice: поселил
  rationale: 'Русский глагол передаёт каузативный смысл: Он сделал так, чтобы Дух обитал в нас, а не просто сообщил, что дух обитает.'
- source_word: ἐν ἡμῖν
  choice: в нас
  rationale: Наиболее прямо передаёт внутреннее обитание; вариант «среди нас» здесь менее вероятен.
theological_decisions:
- issue: Кого обозначает τὸ πνεῦμα
  choice: Святого Духа, поселённого Богом в верующих
  alternative: человеческий дух, который Бог поселил в нас
  rationale: 'Грамматика допускает оба понимания. Основной текст следует вероятному новозаветному мотиву пребывания Божьего Духа в верующих, но не устраняет значимую неоднозначность: альтернативное прочтение дано в сноске.'
- issue: Нравственная окраска φθόνος
  choice: «ревностно», в смысле сильной, исключительной привязанности
  alternative: «с завистью» или «до зависти»
  rationale: При понимании πνεῦμα как Святого Духа «ревностно» позволяет выразить правомерную Божью ревность, не приписывая Богу греховной зависти. Вместе с тем более отрицательная лексическая возможность греческого выражения сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет риторический вопрос и последующее высказывание Писания. Прописные «Дух» и «Он» отражают принятое в основном тексте прочтение, тогда как сноска явно сохраняет альтернативу.
