  text: Πόθεν πόλεμοι καὶ ⸀πόθεν μάχαι ἐν ὑμῖν; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/001.yaml
  text: From where come wars and from where come fights among you? Is it not from here—from your pleasures that wage war in your members?[a][b][c]
translation:
  language: ru
  text: Откуда у вас войны и откуда распри? Не отсюда ли они — от ваших удовольствий, воюющих в ваших членах?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «конфликты… ссоры». В греческом тексте употреблены военные слова, буквально «войны» и «сражения», применённые к раздорам в общине.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «внутри вас». Греческое выражение может указывать как на столкновения среди адресатов, так и на борьбу внутри них. Весь стих связывает внешние распри с внутренними желаниями.'
    reason: alternative_reading
  - marker: c
    text: «Члены» — буквально; речь может идти о частях тела или, шире, о действующих в человеке способностях.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν ... πόθεν
  choice: Откуда ... и откуда
  rationale: Сохраняет повтор вопросительного наречия и риторический акцент на источнике конфликтов.
- source_word: πόλεμοι
  choice: войны
  rationale: Прямой эквивалент сохраняет усиленную военную метафору; в контексте речь идёт о тяжёлых конфликтах в общине.
- source_word: μάχαι
  choice: распри
  rationale: Передаёт столкновения и ссоры, не повторяя слово «войны»; буквальная военная окраска пояснена в сноске.
- source_word: ἐν ὑμῖν
  choice: у вас
  rationale: Естественно обозначает происходящее среди адресатов, но не исключает связи с внутренней борьбой.
- source_word: οὐκ ἐντεῦθεν, ἐκ
  choice: Не отсюда ли — от
  rationale: Сохраняет риторический вопрос, ожидающий утвердительного ответа, и указание на далее названный источник.
- source_word: ἡδονῶν
  choice: удовольствий
  rationale: Прямо передаёт ἡδονή и не заменяет удовольствие более общим понятием желания или страсти.
- source_word: στρατευομένων
  choice: воюющих
  rationale: Сохраняет продолжающуюся военную метафору и словесную связь с «войнами».
- source_word: ἐν τοῖς μέλεσιν ὑμῶν
  choice: в ваших членах
  rationale: 'Сохраняет телесную метафору и неоднозначность: это могут быть части тела либо шире — действующие в человеке способности.'
theological_decisions:
- issue: Внешние распри в общине или внутренняя борьба
  choice: Первое ἐν ὑμῖν передано как «у вас», а заключительное выражение — буквально как «в ваших членах».
  alternative: Передать первое выражение как «внутри вас», а последнее — как «в вас».
  rationale: Так сохраняется связь между внешними конфликтами адресатов и внутренне действующими удовольствиями, без сведения смысла только к общественной или только к психологической стороне.
translation_notes:
  register: Современный литературный русский язык с сохранением риторического повтора и военной образности оригинала. Слово «члены» несколько книжное, но уместно для точной передачи телесной метафоры и сопровождается пояснением.
