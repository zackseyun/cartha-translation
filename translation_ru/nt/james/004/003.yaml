  text: αἰτεῖτε καὶ οὐ λαμβάνετε, διότι κακῶς αἰτεῖσθε, ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/003.yaml
  text: You ask and do not receive[a], because you ask wrongly[b], so that you may spend it on your pleasures.
translation:
  language: ru
  text: Вы просите, но не получаете, потому что просите неправильно, чтобы потратить полученное на свои удовольствия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «просите дурно»; по смыслу возможно: «просите с дурными намерениями». «Удовольствия» также может означать самоугодные желания или страсти; буквально: «в своих удовольствиях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτεῖτε
  choice: вы просите
  rationale: Настоящее время и второе лицо множественного числа переданы прямо. «Просите» естественно звучит в контексте подразумеваемого обращения к Богу, не добавляя отсутствующего в греческом тексте дополнения.
- source_word: καὶ οὐ λαμβάνετε
  choice: но не получаете
  rationale: Соединительный καί здесь естественно приобретает противительный оттенок из-за контраста между просьбой и отсутствием получения; «получаете» сохраняет связь между просьбой и ответом.
- source_word: διότι
  choice: потому что
  rationale: 'Ясно передаёт причинную связь: далее объясняется, почему просящие не получают.'
- source_word: κακῶς
  choice: неправильно
  rationale: Сохраняет широкий нравственно-качественный смысл наречия и не сводит его заранее исключительно к нечистым мотивам; цель просьб раскрывается следующей частью стиха.
- source_word: αἰτεῖσθε
  choice: просите
  rationale: Средний залог не требует обязательного возвратного дополнения в русском. Повтор глагола сохраняет параллелизм исходного текста.
- source_word: ἵνα
  choice: хотите
  rationale: В данном контексте конструкция с ἵνα раскрывает порочную цель просьбы. Русское «хотите» естественно выражает намерение, не превращая его в неизбежный результат.
- source_word: δαπανήσητε
  choice: потратить полученное
  rationale: Глагол означает расходовать или тратить. «Потратить» не усиливает оценку до «растратить» или «промотать», а «полученное» естественно восполняет подразумеваемый объект — то, о чём просят.
- source_word: ἐν ταῖς ἡδοναῖς ὑμῶν
  choice: на свои удовольствия
  rationale: ἡδονή обозначает удовольствие, наслаждение, а в отрицательном контексте также самоугодные желания. Предлог «на» идиоматично сочетается в русском с глаголом «потратить».
theological_decisions:
- issue: Следует ли прямо указать, что просьбы обращены к Богу
  choice: 'Оставить адресата подразумеваемым: «Вы просите»'
  alternative: «Вы просите у Бога»
  rationale: Контекст указывает на молитву, однако в самом стихе Бог как адресат прямо не назван. Перевод не добавляет отсутствующего дополнения.
- issue: Следует ли истолковать κακῶς исключительно как указание на мотивы
  choice: 'Передать широко: «просите неправильно»'
  alternative: «просите с дурными намерениями»
  rationale: Само наречие шире указания только на внутренние мотивы. Следующая целевая конструкция поясняет, в чём состоит неправильность просьб.
- issue: Считать ли ἵνα указанием на цель или результат
  choice: 'Передать как намерение: «хотите потратить»'
  alternative: «так что тратите»
  rationale: Сослагательное наклонение после ἵνα прежде всего указывает здесь на цель просьбы; перевод сохраняет целевой смысл и не утверждает, будто желаемое уже было получено и потрачено.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Противопоставление передано естественным «но», а двоеточие показывает, что заключительная часть объясняет, в чём именно просьбы неправильны. Формулировка избегает как церковнославянизмов, так и разговорного снижения.
