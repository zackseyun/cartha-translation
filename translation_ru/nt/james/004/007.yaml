  text: ὑποτάγητε οὖν τῷ θεῷ· ἀντίστητε δὲ τῷ διαβόλῳ, καὶ φεύξεται ἀφ’ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/007.yaml
  text: Submit yourselves[a], therefore, to God. But resist the devil, and he will flee from you.
translation:
  language: ru
  text: Итак, покоритесь Богу[a], противостаньте же дьяволу — и он убежит от вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подчинитесь Богу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτάγητε
  choice: покоритесь
  rationale: Аористный пассивный императив здесь имеет возвратный смысл и призывает добровольно признать Божью власть. «Покоритесь» естественно и кратко передаёт этот призыв.
- source_word: οὖν
  choice: итак
  rationale: Сохраняет вывод из предшествующего рассуждения и звучит естественно в современном русском тексте.
- source_word: τῷ θεῷ
  choice: Богу
  rationale: Дательный падеж обозначает того, кому следует покориться.
- source_word: ἀντίστητε
  choice: противостаньте
  rationale: Аористный активный императив означает занять твёрдую позицию против кого-либо; «противостаньте» сохраняет образ сопротивления и возвышенный, но понятный регистр.
- source_word: δὲ
  choice: же
  rationale: Частица отмечает контраст между покорностью Богу и сопротивлением дьяволу, не делая противопоставление чрезмерно резким.
- source_word: τῷ διαβόλῳ
  choice: дьяволу
  rationale: В данном контексте διάβολος с артиклем обозначает личного духовного противника; это принятое русское соответствие.
- source_word: καὶ
  choice: и
  rationale: Связывает повеление с обещанным результатом без добавления невыраженной причинности.
- source_word: φεύξεται
  choice: он убежит
  rationale: Будущее время выражает последствие сопротивления; местоимение явно отсылает к дьяволу.
- source_word: ἀφ’ ὑμῶν
  choice: от вас
  rationale: Предлог ἀπό с родительным падежом указывает на удаление от адресатов.
theological_decisions:
- issue: Значение διάβολος
  choice: дьявол как личный духовный противник
  alternative: клеветник или безличное начало зла
  rationale: Артикль и контекст духовного противостояния указывают на конкретного личного противника, а не просто на качество или отвлечённую силу.
- issue: Связь двух повелений
  choice: покорность Богу противопоставлена сопротивлению дьяволу
  alternative: передать δέ простым соединительным «и»
  rationale: Частица δέ допускает мягкое противопоставление; «же» сохраняет его, не усиливая до категорического «но».
translation_notes:
  register: Современный литературный русский язык с кратким, увещевательным и достойным звучанием. «Покоритесь» передаёт добровольное признание власти; «противостаньте» сохраняет симметрию повелений и образ твёрдого сопротивления.
