id: JAS.4.4
reference: James 4:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀μοιχαλίδες, οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ⸀ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/004.yaml
  text: Adulteresses[a], do you not know that friendship with the world is hostility toward God? Therefore[d][c][b], whoever wants to be a friend of the world makes himself an enemy of God.
translation:
  language: ru
  text: Прелюбодейки![a] Разве вы не знаете, что дружба с миром — вражда против Бога?[b] Итак, кто хочет быть другом миру, тот становится врагом Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально — «прелюбодейки». Вероятно, это метафора духовной неверности Богу, созвучная пророческому языку о нарушении завета.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вражда с Богом». Под «миром» здесь понимается человеческий порядок, противостоящий Богу, а не сотворённый мир как таковой.'
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχαλίδες
  choice: Прелюбодейки!
  rationale: Сохранены обращение, женский род и резкость греческого слова. В контексте это, вероятнее всего, пророческая метафора духовной неверности, однако её не следует заменять толкованием в основном тексте.
- source_word: οὐκ οἴδατε
  choice: Разве вы не знаете
  rationale: Естественно передаёт отрицательный риторический вопрос и ожидаемый утвердительный ответ.
- source_word: φιλία τοῦ κόσμου
  choice: дружба с миром
  rationale: Сохраняет значение φιλία и лексическую связь с последующим φίλος; «мир» оставлен без поясняющей подстановки в основном тексте.
- source_word: ἔχθρα τοῦ θεοῦ
  choice: вражда против Бога
  rationale: 'Передаёт вероятное объективное понимание родительного: дружба с миром представляет собой враждебность, направленную против Бога. Возможное более симметричное прочтение отмечено в сноске.'
- source_word: ὃς ἐὰν οὖν
  choice: Итак, кто
  rationale: «Итак» передаёт выводное οὖν, а «кто» естественно вводит обобщённое условно-относительное высказывание.
- source_word: βουληθῇ
  choice: хочет
  rationale: Передаёт волеизъявление без усиления до значения окончательного решения или намерения.
- source_word: φίλος εἶναι τοῦ κόσμου
  choice: быть другом миру
  rationale: Сохраняет именную конструкцию и противопоставление «друг миру — враг Бога»; дательный после «друг» естественен для литературного русского языка.
- source_word: ἐχθρὸς τοῦ θεοῦ καθίσταται
  choice: становится врагом Бога
  rationale: καθίσταται обозначает вступление в определённое положение или обретение статуса. «Становится» точнее сохраняет неоднозначность относительно рефлексивной причинности, чем более толковательное «делает себя».
theological_decisions:
- issue: Метафорический смысл μοιχαλίδες
  choice: Сохранить буквальное женское обращение «Прелюбодейки!» в основном тексте.
  alternative: «Неверные Богу люди!» или «Прелюбодейный народ!»
  rationale: Слово, вероятно, отсылает к пророческому образу нарушения заветной верности, но замена метафоры её объяснением устранила бы намеренную резкость и грамматически отмеченный женский род.
- issue: Смысл κόσμος
  choice: Перевести как «мир», пояснив контекстуальное значение в сноске.
  alternative: «богопротивный порядок мира» или «мирская система»
  rationale: Здесь речь идёт о человеческом порядке и ценностях, противостоящих Богу, а не о творении как таковом; однако развёрнутая формулировка в основном тексте была бы избыточно толковательной.
- issue: Значение ἔχθρα τοῦ θεοῦ
  choice: «вражда против Бога»
  alternative: «вражда с Богом»
  rationale: Объективное понимание родительного хорошо соответствует добровольной дружбе с миром как направленной против Бога позиции. При этом греческая конструкция допускает менее направленное «вражда с Богом», что отмечено в сноске.
- issue: Сила καθίσταται
  choice: «становится врагом Бога»
  alternative: «делает себя врагом Бога»
  rationale: Глагол описывает возникновение или установление статуса. Контекст связывает его с сознательным желанием, но сам глагол не требует явно рефлексивного перевода; поэтому сохранена богословски значимая напряжённость между выбором и итоговым положением.
translation_notes:
  register: Современный литературный русский язык с сохранением резкого пророческого обращения. Синтаксис краткий и риторически выразительный; традиционные библейские слова используются лишь там, где они остаются понятными современному читателю.
