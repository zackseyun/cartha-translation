  text: ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος ⸀θελήσῃ, καὶ ⸀ζήσομεν καὶ ⸀ποιήσομεν τοῦτο ἢ ἐκεῖνο.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/015.yaml
  text: Instead, you ought to say, “If the Lord wills, we will live and also do this or that.”
translation:
  language: ru
  text: 'Вместо того чтобы говорить[a]: «Если Господь пожелает, то мы и будем жить, и сделаем то или другое».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «вместо вашего говорения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ λέγειν ὑμᾶς
  choice: Вместо этого вам следует говорить
  rationale: Оборот ἀντὶ τοῦ с инфинитивом буквально означает «вместо того чтобы говорить», а ὑμᾶς указывает на субъект «вы». Формулировка со словом «следует» естественно передаёт подразумеваемое исправительное наставление и связь с предыдущим стихом.
- source_word: Ἐὰν
  choice: Если
  rationale: Союз вводит условие с аористом сослагательного наклонения θελήσῃ; русское «если» точно и естественно передаёт его здесь.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Сохраняется обычное библейское соответствие κύριος — «Господь», без уточнения лица, которого сам текст не даёт.
- source_word: θελήσῃ
  choice: пожелает
  rationale: Глагол выражает волю. «Пожелает» звучит естественно в современном русском и сохраняет смысл зависимости человеческой жизни и намерений от воли Господа.
- source_word: καὶ ζήσομεν καὶ ποιήσομεν
  choice: то мы и жить будем, и сделаем
  rationale: Парная конструкция «и… и…» отражает оба καί и подчёркивает, что условию подчинены как продолжение жизни, так и осуществление замыслов, не внося дополнительного богословского содержания.
- source_word: τοῦτο ἢ ἐκεῖνο
  choice: то или другое
  rationale: Естественный русский оборот с неопределённым охватом различных задуманных дел.
theological_decisions:
- issue: Кого обозначает ὁ κύριος и какова сила условного высказывания
  choice: Перевести как «Господь», не уточняя референта; сохранить зависимость и жизни, и человеческих дел от Его воли.
  alternative: «Бог» или «Господь Иисус»
  rationale: Греческий текст содержит только ὁ κύριος и не вынуждает переводчика определять, имеется ли в виду именно Отец или Иисус. Уточнение сняло бы подлинную неоднозначность текста.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Парное «и жить будем, и сделаем» несколько приподнято, но естественно и точно сохраняет греческую координацию. Маркер сноски поставлен после всей цитаты, поскольку сноска поясняет вводную конструкцию стиха.
