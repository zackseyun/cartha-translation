id: JAS.4.11
reference: James 4:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: ru
  text: Не злословьте друг друга[a], братья[b]. Кто злословит брата или судит своего брата, тот злословит закон и судит закон. А если ты судишь закон, то ты не исполнитель закона, а судья.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не говорите друг против друга»; греческий глагол означает враждебно или порочаще отзываться о ком-либо.'
    reason: lexical_alternative
  - marker: b
    text: Греческое «братья», вероятно, обращено ко всей общине, включая братьев и сестёр.
    reason: inclusive_reference
lexical_decisions:
- source_word: καταλαλεῖτε / καταλαλῶν / καταλαλεῖ
  choice: злословьте / злословит
  rationale: «Злословить» естественно передаёт враждебную или порочащую речь против другого и позволяет сохранить трёхкратный повтор греческого глагола. Смысл не сужается до юридически понимаемой клеветы.
- source_word: ἀλλήλων
  choice: друг друга
  rationale: Обычное и естественное выражение взаимности в русском увещании.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняется форма мужского рода и семейная метафора оригинала; вероятное обращение ко всей общине поясняется в сноске.
- source_word: ἀδελφοῦ / τὸν ἀδελφὸν αὐτοῦ
  choice: брата / своего брата
  rationale: Сохраняются семейная метафора и лексическая связь с обращением «братья».
- source_word: ἢ
  choice: или
  rationale: 'Передаёт разделительное значение: злословие брата и суд над ним представлены как соотнесённые действия.'
- source_word: κρίνων / κρίνει / κρίνεις
  choice: судит / судишь
  rationale: Единый глагол сохраняет повтор оригинала и связь с существительным «судья», не сужая значение до осуждения.
- source_word: νόμου / νόμον
  choice: закон
  rationale: Определённость в русском языке выражается контекстом. Перевод не уточняет, идёт ли речь именно о царском, Моисеевом или Божьем законе.
- source_word: ποιητὴς
  choice: исполнитель
  rationale: «Исполнитель закона» естественнее по-русски, чем буквальное «делатель закона», и ясно выражает того, кто исполняет его предписания.
- source_word: κριτής
  choice: судья
  rationale: Прямо и кратко передаёт существительное, сохраняя контраст между исполнителем закона и судьёй.
theological_decisions:
- issue: Круг адресатов ἀδελφοί
  choice: В основном тексте — «братья», с пояснением вероятного включения женщин в сноске.
  alternative: «братья и сёстры» или «верующие»
  rationale: Греческая форма — мужской род множественного числа, однако в контексте она, вероятно, обращена ко всей общине. Основной текст сохраняет форму и образ оригинала, а сноска поясняет охват обращения.
- issue: Референт слова νόμος
  choice: «закон» без дополнительного уточнения
  alternative: «Моисеев закон», «царский закон» или «Божий закон»
  rationale: Контекст Послания Иакова связывает закон с Божьим нравственным требованием и любовью к ближнему, но сам стих не даёт более узкого определения. Неопределённость сохранена.
- issue: Характер запрещённой речи
  choice: «злословить»
  alternative: «говорить против» или «клеветать»
  rationale: Запрет касается враждебной, порочащей речи, но текст не требует понимать её только как заведомо ложную клевету. «Злословить» сохраняет эту широту и нравственную остроту.
translation_notes:
  register: Современный литературный русский язык с достоинством увещательного стиля. Сохранены повторы «злословит», «судит» и «закон», важные для хода аргумента. Переход от общего обращения к единственному числу «если ты» воспроизводит риторическое заострение оригинала.
