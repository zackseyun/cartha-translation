  text: ἐπιθυμεῖτε, καὶ οὐκ ἔχετε· φονεύετε καὶ ζηλοῦτε, καὶ οὐ δύνασθε ἐπιτυχεῖν· μάχεσθε καὶ πολεμεῖτε. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/002.yaml
  text: You desire and do not have[a]; you murder and envy and are not able to obtain; you fight and wage war[d][c][b]. You do not have because you do not ask.
translation:
  language: ru
  text: Вы желаете и не имеете[a]; совершаете убийства[b] и завидуете[c], но не можете получить; сражаетесь и воюете. Вы не имеете, потому что не просите[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вы страстно желаете»; греческий глагол означает сильное желание, здесь — порочное.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «убиваете». Греческий глагол обычно означает «совершать убийство». Некоторые понимают эти слова как риторическое преувеличение или метафору, но перевод сохраняет сильное прямое значение слова.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ревнуете». Здесь имеется в виду завистливое, ревнивое стремление получить желаемое.'
    reason: lexical_alternative
  - marker: d
    text: Из контекста следует, что речь идёт о просьбе к Богу, хотя в греческом тексте этого стиха Бог прямо не назван.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμεῖτε
  choice: вы желаете
  rationale: Глагол обозначает сильное желание, в данном контексте нравственно порочное. «Желаете» сохраняет широту значения, не сужая его до сексуальной страсти или стремления завладеть чужой собственностью.
- source_word: ἔχετε
  choice: имеете
  rationale: Прямой и естественный эквивалент ἔχω; повтор сохранён для связи между началом и концом стиха.
- source_word: φονεύετε
  choice: убиваете
  rationale: Русское «убиваете» передаёт сильное прямое значение глагола и сохраняет резкость высказывания; более юридически узкое «совершаете убийства» звучало бы тяжеловесно и могло бы преждевременно определить способ понимания риторики.
- source_word: ζηλοῦτε
  choice: завидуете
  rationale: В контексте неудовлетворённых желаний и вражды ζηλόω имеет отрицательный смысл; «завидуете» естественно передаёт стремление иметь то, что есть у другого.
- source_word: οὐ δύνασθε ἐπιτυχεῖν
  choice: не можете получить
  rationale: Сочетание выражает невозможность достичь желаемого или завладеть им; «получить» ясно связывает фразу с предшествующими желанием и завистью.
- source_word: μάχεσθε
  choice: сражаетесь
  rationale: Слово может обозначать как физическую борьбу, так и распри. «Сражаетесь» сохраняет сильный образ и не сводит конфликт лишь к словесным ссорам.
- source_word: πολεμεῖτε
  choice: ведёте войны
  rationale: Глагол усиливает образ противостояния по сравнению с μάχεσθε; данная формулировка сохраняет военную метафорику и нарастание.
- source_word: διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς
  choice: потому что не просите
  rationale: Конструкция с διά и артиклевым инфинитивом выражает причину. Объект просьбы не добавлен, поскольку в греческом тексте он подразумевается, но не назван.
theological_decisions:
- issue: Следует ли смягчать φονεύετε как метафору или риторическое преувеличение
  choice: Сохранить сильное прямое «убиваете»
  alternative: «враждуете», «убиваете в своих сердцах» или юридически более узкое «совершаете убийства»
  rationale: Перевод должен сохранять резкость исходного глагола, не решая в основном тексте, является ли выражение буквальным, метафорическим или гиперболическим.
- issue: Следует ли назвать Бога объектом глагола αἰτεῖσθαι
  choice: 'Оставить объект подразумеваемым: «не просите»'
  alternative: «не просите у Бога»
  rationale: Из ближайшего контекста ясно, что просить следует Бога, однако в данном стихе греческий текст прямо его не называет.
translation_notes:
  register: Современный литературный русский язык с достоинством и пророческой резкостью оригинала. Параллельные конструкции и повтор «не имеете» сохранены; тире помогают естественно передать смысловые связи, а точка отделяет заключительное объяснение причины.
