  text: μηδεὶς πειραζόμενος λεγέτω ὅτι Ἀπὸ θεοῦ πειράζομαι· ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν, πειράζει δὲ αὐτὸς οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/013.yaml
  text: Let no one who is being tempted say[a], “I am being tempted by God,” for God is untemptable by evil, and he himself tempts no one.
translation:
  language: ru
  text: 'Пусть никто, подвергаясь искушению, не говорит: «Меня искушает Бог», — потому что Бог не подвержен искушению злом[a] и сам никого не искушает.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более гладко: «Бога невозможно искусить злом». Греческое выражение буквально означает, что Бог «не подвержен искушению злом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς … λεγέτω
  choice: Пусть никто … не говорит
  rationale: Естественно передаёт отрицательное повеление третьего лица, сохраняя увещевательную форму греческого текста.
- source_word: πειραζόμενος
  choice: подвергаясь искушению
  rationale: Настоящее пассивное причастие обозначает человека в процессе искушения; контекст последующих стихов указывает именно на побуждение ко злу, а не на испытание вообще.
- source_word: Ἀπὸ θεοῦ πειράζομαι
  choice: Меня искушает Бог
  rationale: ἀπό обозначает источник действия. Активная русская конструкция естественнее буквальной пассивной и ясно передаёт отвергаемое утверждение, не меняя его смысла.
- source_word: ἀπείραστός ἐστιν κακῶν
  choice: Бог не подвержен искушению злом
  rationale: Редкое прилагательное ἀπείραστος в данном контексте лучше всего понимать как неподверженность искушению; κακῶν передано собирательным «злом», что естественно по-русски. Необычность и возможная более гладкая формулировка отмечены в сноске.
- source_word: πειράζει δὲ αὐτὸς οὐδένα
  choice: и Сам никого не искушает
  rationale: «Искушает» сохраняет смысловую связь с предыдущими формами πειράζω, а «Сам» передаёт эмфатическое αὐτός.
theological_decisions:
- issue: Значение форм πειράζω в стихе
  choice: Во всех случаях передавать через «искушать/искушение».
  alternative: «Испытывать/испытание» в одном или нескольких случаях.
  rationale: Ближайший контекст говорит о влечении к греху собственным желанием; стих отрицает, что Бог является источником такого искушения. Это не устраняет иной библейской темы испытаний, посылаемых или допускаемых Богом.
- issue: Значение ἀπείραστός ἐστιν κακῶν
  choice: «Бог не подвержен искушению злом».
  alternative: «Бога невозможно искусить злом»; «Бог не причастен злу»; «Бог не искушён во зле».
  rationale: Фраза лексически трудна. Выбранный вариант передаёт наиболее вероятный в контексте смысл — зло не может склонить Бога, — не превращая выражение в более широкое утверждение, прямо не сформулированное в стихе.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной увещевательной интонацией. Повтор корня «искуш-» намеренно сохранён для передачи словесной связи греческого текста. Прописное «Сам» графически подчёркивает эмфатическое αὐτός.
