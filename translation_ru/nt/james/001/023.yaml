  text: ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/023.yaml
  text: For if anyone is a hearer of the word and not a doer, this one is like a man carefully looking at the face of his birth[a] in a mirror,
translation:
  language: ru
  text: Ведь если кто слушатель слова, а не исполнитель, тот подобен мужчине, внимательно рассматривающему в зеркале своё лицо, данное ему от рождения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лицо своего рождения»; то есть своё природное лицо, данное от рождения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροατὴς λόγου
  choice: слушатель слова
  rationale: Сохраняет именную форму и прямое противопоставление слову ποιητής; «слово» соответствует λόγος и связывает стих с ближайшим контекстом.
- source_word: ποιητής
  choice: исполнитель
  rationale: Передаёт существительное со значением того, кто осуществляет услышанное, и образует естественную пару «слушатель — исполнитель».
- source_word: ἔοικεν
  choice: подобен
  rationale: Естественно передаёт значение сходства при перфектной форме с настоящим значением.
- source_word: ἀνδρὶ
  choice: мужчине
  rationale: Сохраняет конкретно мужской род греческого ἀνήρ, хотя сравнение по смыслу применимо шире.
- source_word: κατανοοῦντι
  choice: внимательно рассматривающему
  rationale: Передаёт не беглый взгляд, а сосредоточенное наблюдение, выраженное κατανοέω.
- source_word: τὸ πρόσωπον τῆς γενέσεως αὐτοῦ
  choice: своё лицо, какое оно от рождения
  rationale: Естественно по-русски выражает смысл необычного греческого сочетания, не сводя его без пояснения только к «природному лицу»; буквальная конструкция отмечена в сноске.
- source_word: ἐν ἐσόπτρῳ
  choice: в зеркале
  rationale: Стандартное современное соответствие, ясно сохраняющее образ исходного текста.
theological_decisions:
- issue: Родовое значение мужского образа в ἀνδρὶ
  choice: мужчине
  alternative: человеку
  rationale: В исходном тексте употреблено конкретно мужское ἀνήρ, поэтому перевод сохраняет мужской образ, не отрицая его общей нравственной применимости.
- issue: Значение выражения τὸ πρόσωπον τῆς γενέσεως αὐτοῦ
  choice: своё лицо, какое оно от рождения
  alternative: своё природное лицо
  rationale: Выбранный вариант сохраняет связь γενέσεως с рождением и не устраняет необычность выражения, одновременно оставаясь понятным современному читателю.
translation_notes:
  register: Современный литературный русский язык с умеренно формальной, достойной библейского текста интонацией. Именная пара «слушатель — исполнитель» сохраняет риторическую структуру оригинала; причастный оборот передаёт внимательность наблюдения без стилистической тяжеловесности.
