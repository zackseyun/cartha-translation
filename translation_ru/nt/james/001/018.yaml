  text: βουληθεὶς ἀπεκύησεν ἡμᾶς λόγῳ ἀληθείας, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/018.yaml
  text: Having willed it[a], he gave birth to us by the word of truth[b], so that we might be a kind of firstfruits of his creatures.
translation:
  language: ru
  text: По Своей воле[a] Он родил нас словом истины, чтобы мы стали своего рода первыми плодами[b] среди Его творений.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пожелав, Он родил нас словом истины».'
    reason: alternative_reading
  - marker: b
    text: «Первые плоды» — первая часть урожая, которую посвящали Богу. Здесь этот образ представляет верующих как начальную, посвящённую Богу часть среди Его творений.
    reason: cultural_note
lexical_decisions:
- source_word: βουληθεὶς
  choice: По Своей воле
  rationale: Передаёт предшествующее главному действию волеизъявление Бога и Его инициативу. Оборот естественен по-русски и не вводит какой-либо законченной доктринальной системы.
- source_word: ἀπεκύησεν
  choice: Он родил нас
  rationale: Сохраняет яркий образ рождения и смысловую перекличку с Иак. 1:15, где то же греческое слово описывает рождение греха. Более отвлечённые варианты вроде «произвёл нас» ослабили бы метафору.
- source_word: λόγῳ ἀληθείας
  choice: словом истины
  rationale: Творительный падеж передаёт средство действия; устойчивое библейское выражение сохраняет возможность понимать его как истинную весть, не превращая это толкование в явное дополнение текста.
- source_word: εἰς τὸ εἶναι ἡμᾶς
  choice: чтобы мы стали
  rationale: Передаёт целевое или результативное значение конструкции с артиклевым инфинитивом, не устраняя присущую ей смысловую широту.
- source_word: ἀπαρχήν
  choice: первыми плодами
  rationale: Сохраняет образ первой части урожая, посвящаемой Богу, и остаётся понятнее современному читателю, чем одно слово «начаток».
- source_word: τινα
  choice: своего рода
  rationale: Передаёт смягчающее и квалифицирующее значение неопределённого местоимения, а не ошибочное числовое значение.
- source_word: τῶν αὐτοῦ κτισμάτων
  choice: среди Его творений
  rationale: Сохраняет конкретное множественное число κτισμάτων и широкий объём выражения, не ограничивая его только людьми.
theological_decisions:
- issue: Божественная инициатива в новом рождении
  choice: «По Своей воле Он родил нас» подчёркивает, что действие исходит от воли Бога.
  alternative: «Пожелав этого, Он родил нас»
  rationale: Греческий текст ставит волеизъявление Бога перед рождением верующих и связывает их между собой, но не излагает здесь полной системы предопределения или возрождения.
- issue: Объём значения κτισμάτων
  choice: Сохранено широкое «среди Его творений».
  alternative: «среди созданных Им людей»
  rationale: Сужение до человечества добавило бы уточнение, которого нет в греческом тексте; формулировка позволяет соотнести верующих со всем сотворённым порядком.
- issue: Метафора первых плодов
  choice: Сохранён образ «первых плодов», указывающий на начальную и посвящённую часть целого.
  alternative: «начатком Его творения»
  rationale: Перевод удерживает сельскохозяйственный и культовый фон ἀπαρχή, а примечание поясняет его без внесения пояснения непосредственно в стих.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Необычное «родил нас» намеренно сохраняет телесную метафору оригинала и связь с ближайшим контекстом; пояснение образа первых плодов вынесено в сноску.
