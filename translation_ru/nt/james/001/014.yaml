lexical_decisions:
- source_word: ἕκαστος
  choice: каждый
  rationale: Передаёт распределительное значение и сохраняет акцент на личной ответственности отдельного человека.
- source_word: δὲ
  choice: но
  rationale: 'Обозначает противопоставление предыдущему стиху: искушение исходит не от Бога, но связано с собственной страстью человека.'
- source_word: πειράζεται
  choice: искушается
  rationale: В ближайшем контексте речь идёт о побуждении ко греху, а не просто об испытании.
- source_word: ὑπὸ τῆς ἰδίας ἐπιθυμίας
  choice: собственной страстью
  rationale: Творительный падеж естественно передаёт источник или действующую силу; «собственной» подчёркивает принадлежность человеку и его личную ответственность.
- source_word: ἐπιθυμίας
  choice: страстью
  rationale: В данном контексте слово обозначает сильное, влекущее ко греху желание. «Страсть» в современном русском не ограничивается сексуальной сферой и лучше, чем нейтральное «желание», передаёт отрицательную направленность контекста.
- source_word: ἐξελκόμενος
  choice: увлекаемый
  rationale: Передаёт образ вытягивания или уведения прочь, не делая метафору чрезмерно буквальной.
- source_word: καὶ δελεαζόμενος
  choice: и обольщаемый
  rationale: Передаёт заманивание привлекательной приманкой и естественно сочетается с первым причастием.
theological_decisions:
- issue: Источник искушения в его отношении к Богу
  choice: Искушение связывается с собственной страстью человека, а не с Богом.
  alternative: Понять πειράζεται как нейтральное внешнее испытание.
  rationale: Стих 13 отрицает, что Бог кого-либо искушает, а стих 15 описывает рождение греха из желания; поэтому здесь имеется в виду именно искушение ко греху. При этом перевод не добавляет утверждений о более широких причинах зла.
- issue: Образность двух причастий
  choice: 'Сохранены два страдательных причастия: «увлекаемый и обольщаемый».'
  alternative: Развернуть метафору прямо в тексте как «выманиваемый приманкой».
  rationale: Греческие слова вызывают образы охоты или рыбной ловли, однако прямо не называют ни добычу, ни рыбу, ни ловушку. Более явное раскрытие вынесено в примечание, чтобы не сузить подлинную образность.
- issue: Род обобщённого обозначения человека
  choice: Использовано русское «каждый» без дополнительного местоимения мужского рода.
  alternative: «Каждый человек искушается своим собственным желанием».
  rationale: Русская форма «каждый» естественно сохраняет единственное число и обобщённый смысл греческого ἕκαστος, не требуя тяжеловесного уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксический параллелизм греческих причастий сохранён; редкие или узкоконфессиональные выражения не использованы.
