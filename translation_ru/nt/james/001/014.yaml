  text: Но каждый искушается собственной страстью[a], увлекаемый и обольщаемый ею[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собственным вожделением» или «сильным желанием». Греческое слово обозначает сильное желание и не ограничивается сексуальным влечением.'
