base_translation:
  language: en
  yaml_path: translation/nt/james/001/017.yaml
  text: Every good gift and every perfect gift is from above[a], coming down from the Father of lights[b], with whom there is no variation or shadow of turning.
translation:
  language: ru
  text: Всякое доброе даяние[a] и всякий совершенный дар приходят свыше, нисходя от Отца светил, у Которого нет ни перемены, ни тени от поворота[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всякий добрый дар и всякий совершенный дар». Первое существительное может подчёркивать как само дарение, так и то, что дано; второе — прежде всего дар как полученное благо.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «тени перемены», «тени от вращения» или «движущейся тени». Вероятно, здесь подразумеваются меняющиеся тени, связанные с движением небесных светил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα δόσις ἀγαθὴ
  choice: Всякое доброе даяние
  rationale: «Даяние» сохраняет возможный оттенок как самого акта дарения, так и данного блага, а также отличает δόσις от следующего δώρημα.
- source_word: πᾶν δώρημα τέλειον
  choice: всякий совершенный дар
  rationale: «Дар» естественно обозначает получаемый дар; «совершенный» передаёт полноту и безупречную благость τέλειον.
- source_word: ἄνωθέν ἐστιν, καταβαῖνον
  choice: приходят свыше, нисходя
  rationale: Русское согласование требует множественного числа при двух однородных членах. Формулировка сохраняет как небесный источник, так и образ движения сверху вниз.
- source_word: ἀπὸ τοῦ πατρὸς τῶν φώτων
  choice: от Отца светил
  rationale: Сохранена метафора оригинала и вероятная отсылка к небесным светилам без поясняющей подстановки в основном тексте.
- source_word: παρ’ ᾧ οὐκ ἔνι παραλλαγὴ
  choice: у Которого нет ни перемены
  rationale: «У Которого» естественно передаёт отношение, выраженное παρά; «перемена» ясно обозначает отсутствие изменчивости.
- source_word: ἢ τροπῆς ἀποσκίασμα
  choice: ни тени от поворота
  rationale: После отрицания «ни… ни…» естественно для русского языка. Выражение остаётся близким к трудному образу греческого текста и не устраняет его неоднозначность.
theological_decisions:
- issue: Образ «Отца светил» и неизменность Бога
  choice: Сохранить образ светил и отрицание перемены без догматического развёртывания.
  alternative: 'Заменить «светила» прямым указанием на небесные тела, а заключение передать отвлечённо: «Он никогда не меняется».'
  rationale: Исходный текст сопоставляет Бога с изменчивыми светилами через образный язык. Прямое объяснение в основном тексте сняло бы поэтическое напряжение и сузило смысл.
- issue: Значение τροπῆς ἀποσκίασμα
  choice: «тени от поворота»
  alternative: «тени перемены» или «движущейся тени»
  rationale: Родительный оборот допускает разные смысловые связи. Выбранный вариант сохраняет поворот/вращение как часть образа, не утверждая в основном тексте единственное астрономическое объяснение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Даяние» и «светила» dignified but understandable; синтаксис сделан естественным для русского языка, при этом образность и неоднозначность заключительной фразы сохранены.
