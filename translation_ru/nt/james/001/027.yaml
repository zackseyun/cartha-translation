source:
  edition: SBLGNT
  text: θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ ⸀τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/027.yaml
  text: 'Religion that is pure and undefiled before God the Father is this: to care for orphans and widows in their affliction[b][a], and to keep oneself unstained from the world.'
translation:
  language: ru
  text: 'Чистое и неосквернённое благочестие перед Богом Отцом — вот что: заботиться о сиротах и вдовах в их беде[a] и хранить себя неосквернённым от мира[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «навещать сирот и вдов в их беде»; греческий глагол может означать как посещение, так и деятельную заботу о них.'
    reason: lexical_alternative
  - marker: b
    text: «Мир» здесь обозначает нравственно испорченный порядок, противящийся Богу, а не сотворённый мир сам по себе.
    reason: cultural_note
lexical_decisions:
- source_word: θρησκεία
  choice: благочестие
  rationale: Здесь слово обозначает внешне выраженную религиозную преданность и её практическое осуществление. «Благочестие» естественно передаёт живую религиозную практику, о которой говорит Иаков, не сводя смысл к религии как системе.
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: чистое и неосквернённое
  rationale: Сочетание сохраняет два близких, но не полностью тождественных определения и их культово-нравственный оттенок.
- source_word: παρὰ τῷ θεῷ καὶ πατρὶ
  choice: перед Богом и Отцом
  rationale: παρά с дательным выражает оценку перед кем-либо, в чьих-либо глазах. Перевод сохраняет греческое «Богом и Отцом» и не добавляет отсутствующего в тексте местоимения «нашим».
- source_word: ἐπισκέπτεσθαι
  choice: заботиться о
  rationale: В данном контексте глагол означает не просто навещать, а проявлять деятельное внимание и оказывать помощь; буквальная оттеночная возможность отмечена в сноске.
- source_word: ὀρφανοὺς καὶ χήρας
  choice: о сиротах и вдовах
  rationale: Прямые и общепонятные русские соответствия для названных социально уязвимых групп.
- source_word: ἐν τῇ θλίψει αὐτῶν
  choice: в их беде
  rationale: «Беда» естественно и ёмко передаёт состояние тяжёлого несчастья и нужды; единственное число соответствует собирательному выражению оригинала.
- source_word: ἄσπιλον ἑαυτὸν τηρεῖν
  choice: хранить себя незапятнанным
  rationale: Передаёт образ нравственного пятна и значение постоянного бережного сохранения себя от осквернения.
- source_word: ἀπὸ τοῦ κόσμου
  choice: от мира
  rationale: Буквальная краткость сохраняет богословскую напряжённость слова κόσμος и не подменяет его истолкованием в основном тексте.
theological_decisions:
- issue: Значение κόσμος в нравственном контексте
  choice: Сохранить в основном тексте выражение «от мира», пояснив контекстуальный смысл в сноске.
  alternative: «от скверны мира» или «от порочного мирового порядка»
  rationale: У Иакова «мир» здесь выступает источником нравственного осквернения, однако развёрнутый перевод сузил бы многозначность оригинала и мог бы ошибочно представить творение как зло.
- issue: Связь θεῷ καὶ πατρὶ
  choice: «перед Богом и Отцом»
  alternative: «перед Богом Отцом» или «перед нашим Богом и Отцом»
  rationale: Форма допускает понимание одного Лица как Бога и Отца; буквальная координация сохраняет конструкцию оригинала, тогда как «нашим» не засвидетельствовано в данном греческом тексте.
- issue: Обобщающий характер ἑαυτόν
  choice: «себя»
  alternative: «самого себя» с явно мужским согласованием вне контекста
  rationale: Инфинитивная формулировка представляет общий нравственный принцип; русское возвратное местоимение естественно сохраняет его универсальный характер.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изложения. «Благочестие» выбрано как понятное церковно-религиозное слово, обозначающее практическое выражение веры; синтаксис слегка перестроен для естественности, при этом параллелизм двух инфинитивных требований сохранён.
