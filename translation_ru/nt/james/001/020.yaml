  text: ὀργὴ γὰρ ἀνδρὸς δικαιοσύνην θεοῦ ⸂οὐκ ἐργάζεται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/020.yaml
  text: For a man's anger does not produce God's righteousness.
translation:
  language: ru
  text: потому что гнев человека не творит Божьей праведности.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ ἀνδρός
  choice: гнев человека
  rationale: Передаёт родовую формулировку о человеческом гневе естественно для современного русского языка, без неоправданного сужения до одного мужчины.
- source_word: δικαιοσύνην θεοῦ
  choice: Божьей праведности
  rationale: 'Сохраняет краткую и допускающую смысловую многогранность конструкцию оригинала: речь может идти о праведности, принадлежащей Богу, угодной Ему или осуществляемой Им.'
- source_word: οὐκ ἐργάζεται
  choice: не творит
  rationale: Передаёт деятельный смысл глагола — не совершает и не осуществляет — и естественно сочетается с «праведностью».
- source_word: γάρ
  choice: потому что
  rationale: Ясно выражает причинную связь с предыдущим наставлением.
theological_decisions:
- issue: Значение родительного θεοῦ при δικαιοσύνην
  choice: Божьей праведности
  alternative: праведности перед Богом / праведности, угодной Богу
  rationale: Притяжательное прилагательное сохраняет ёмкость греческого выражения и не закрепляет лишь одно из возможных толкований.
translation_notes:
  register: Современный литературный русский; лаконичная, достойная формулировка. Строчная буква в начале обусловлена продолжением синтаксической связи с предыдущим стихом.
