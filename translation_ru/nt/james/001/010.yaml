  text: ὁ δὲ πλούσιος ἐν τῇ ταπεινώσει αὐτοῦ, ὅτι ὡς ἄνθος χόρτου παρελεύσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/010.yaml
  text: and the rich man in his humiliation[b][a], because like a flower of grass he will pass away.
translation:
  language: ru
  text: А богатый — своим унижением[a], потому что он исчезнет, как цветок травы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, восполняя пропуск из предыдущего стиха: «а богатый пусть хвалится своим унижением».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «цветок травы» — образ быстро исчезающей растительности в пору цветения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλούσιος
  choice: а богатый
  rationale: Субстантивированное прилагательное обозначает богатого мужчину; союз δέ передан как «а», чтобы сохранить параллель с предыдущим стихом и одновременно обозначить противопоставление бедному брату, не усиливая его до резкого «но».
- source_word: ἐν τῇ ταπεινώσει αὐτοῦ
  choice: своим унижением
  rationale: ταπείνωσις здесь указывает на умаление, утрату высокого положения или унижение богатого, а не прежде всего на добродетель смирения. Творительный падеж естественно продолжает подразумеваемый из ст. 9 глагол «хвалиться».
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит причину, по которой богатому следует хвалиться своим унижением; «потому что» ясно передаёт причинную связь.
- source_word: ὡς ἄνθος χόρτου
  choice: как цветок травы
  rationale: Передача сохраняет необычный, но понятный греческий образ и его библейскую аллюзию, не добавляя отсутствующего в тексте слова «поле» и не сводя образ к более узкому «полевому цветку».
- source_word: παρελεύσεται
  choice: он исчезнет
  rationale: В данном образе παρέρχομαι выражает преходящесть и исчезновение, а не пространственное прохождение мимо. «Исчезнет» естественно по-русски передаёт участь богатого, не опережая следующий стих глаголом «увянет».
theological_decisions:
- issue: Эллипсис, связывающий стих с Иак. 1:9
  choice: В основном тексте подразумеваемый глагол не добавлен; тире обозначает синтаксический пропуск.
  alternative: «а богатый пусть хвалится своим унижением»
  rationale: В греческом тексте стих зависит от повеления καυχάσθω в предыдущем стихе. Сохранение эллипсиса делает перевод проверяемым по источнику, а сноска разъясняет синтаксическую связь.
- issue: Смысл унижения богатого
  choice: Умаление или унижение богатого на фоне преходящести его жизни и положения.
  alternative: Добровольное смирение как нравственная добродетель либо просто низкое общественное положение.
  rationale: Причинное продолжение о его исчезновении, подобном цветку травы, связывает ταπείνωσις с утратой высокого положения и бренностью. Перевод не превращает эту фразу в законченную конфессиональную доктрину.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и краткости оригинала. Синтаксический эллипсис намеренно сохранён и отмечен тире; несколько необычный библейский образ «цветок травы» пояснён в сноске.
