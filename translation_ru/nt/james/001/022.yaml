  text: Γίνεσθε δὲ ποιηταὶ λόγου καὶ μὴ ⸂ἀκροαταὶ μόνον⸃ παραλογιζόμενοι ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/022.yaml
  text: But be doers of the word[a], and not hearers only, deceiving yourselves.
translation:
  language: ru
  text: Будьте же исполнителями слова, а не только слушателями, обманывающими самих себя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вводящими самих себя в заблуждение»; греческое слово может подразумевать самообман посредством ложных рассуждений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γίνεσθε
  choice: будьте
  rationale: Настоящее повелительное наклонение призывает к постоянному образу жизни; «будьте» естественно передаёт продолжительную установку, не усиливая возможный начинательный оттенок до «станьте».
- source_word: δὲ
  choice: но
  rationale: 'Передаёт мягкое противопоставление предыдущему наставлению: недостаточно лишь услышать слово.'
- source_word: ποιηταὶ λόγου
  choice: исполнителями слова
  rationale: «Исполнители» по-русски естественно обозначает тех, кто осуществляет сказанное, и сохраняет контраст со «слушателями»; «слово» удерживает связь с Иак. 1:21 и библейскую многозначность λόγος.
- source_word: ἀκροαταὶ μόνον
  choice: не только слушателями
  rationale: Точно передаёт ограничительную силу μόνον и риторический контраст с теми, кто исполняет слово.
- source_word: παραλογιζόμενοι
  choice: обманывающими
  rationale: Ясно передаёт самообман; подразумеваемый греческим глаголом оттенок ложного рассуждения вынесен в примечание.
- source_word: ἑαυτούς
  choice: самих себя
  rationale: Прямо и естественно передаёт возвратное местоимение с усилительным оттенком.
theological_decisions:
- issue: Значение λόγος в Иак. 1:22
  choice: «слово» как принятое Божье слово или возвещённая весть, без искусственного сужения значения
  alternative: «весть»; «учение»
  rationale: В ближайшем контексте речь идёт о «насаждённом слове» (1:21); «слово» сохраняет контекстуальную связь и богословскую насыщенность.
- issue: Видовая сила Γίνεσθε
  choice: 'продолжающееся увещание: постоянно быть исполнителями'
  alternative: начинательное «станьте исполнителями»
  rationale: Форма настоящего времени естественно указывает на устойчивую практику, хотя не исключает призыва начать жить так.
- issue: Связь причастия παραλογιζόμενοι с призывом
  choice: тот, кто лишь слушает, тем самым обманывает самого себя
  alternative: 'более явное причинное прочтение: «иначе вы обманываете себя»'
  rationale: Сохранена греческая причастная конструкция и её смысловая напряжённость без добавления союза, однозначно задающего логическое отношение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Парный контраст «исполнителями — слушателями» сохраняет краткость и афористичность оригинала. Маркер примечания поставлен после всего оборота, к которому относится пояснение.
