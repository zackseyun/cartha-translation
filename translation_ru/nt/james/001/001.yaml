  source_fidelity: 'Основная передача адресной формулы точна: «Иаков», «раб», «Бога и Господа», «двенадцати коленам» и «в рассеянии» адекватно воспроизводят греческий текст. Однако χαίρειν — безличная эпистолярная формула приветствия, а не личное «Приветствую вас!»: последнее добавляет финитный глагол от первого лица и прямое обращение «вас», которых в греческой формуле нет.'
