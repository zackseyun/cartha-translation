  terminology: «Раб» точно передаёт δοῦλος в данном самообозначении. «Господь Иисус Христос» — устойчивое и естественное русское библейское наименование; сноска корректно раскрывает титульное значение Χριστός как возможную передачу «Мессия». «Рассеяние» сохраняет образ διασπορά без преждевременного ограничения адресатов.
