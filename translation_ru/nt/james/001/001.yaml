base_translation:
  language: en
  yaml_path: translation/nt/james/001/001.yaml
  text: 'James[a], a servant of God and of the Lord Jesus the Messiah[c][b], to the twelve tribes in the Dispersion: greetings.'
translation:
  language: ru
  text: 'Иаков, раб Бога и Господа Иисуса Христа[a], — двенадцати коленам, находящимся в рассеянии[b]: приветствие.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Мессии». Греческое Χριστός означает «Мессия, Помазанник» и может употребляться как титул или как ставшая привычной часть имени.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в Рассеянии». Так называли евреев, живших за пределами земли Израиля.'
    reason: cultural_note
lexical_decisions:
- source_word: Ἰάκωβος
  choice: Иаков
  rationale: Традиционная и исторически точная русская форма имени, соответствующая греческому Ἰάκωβος.
- source_word: θεοῦ
  choice: Бога
  rationale: 'Прямо передаёт родительный падеж при δοῦλος: «раб Бога».'
- source_word: κυρίου
  choice: Господа
  rationale: Сохраняет титул власти и устойчивое новозаветное наименование Иисуса.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  rationale: В современном русском «Христос» остаётся узнаваемым титулом и одновременно является устойчивой формой наименования; мессианское значение отмечено в сноске.
- source_word: δοῦλος
  choice: раб
  rationale: Передаёт сильное значение принадлежности господину точнее, чем более широкое «слуга», и естественно звучит в русском библейском регистре.
- source_word: ταῖς δώδεκα φυλαῖς
  choice: двенадцати коленам
  rationale: Сохраняет традиционный израильский образ и форму адресата.
- source_word: ταῖς ἐν τῇ διασπορᾷ
  choice: находящимся в рассеянии
  rationale: Передаёт определительную конструкцию без добавления отсутствующего в тексте географического уточнения.
- source_word: χαίρειν
  choice: Приветствую вас!
  rationale: Передаёт принятую формулу приветствия в начале древнего письма, а не буквальное «радоваться».
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Христа
  alternative: Мессии
  rationale: «Христос» — естественный для русского читателя титул Иисуса; при этом исходное значение «Мессия, Помазанник» не устраняется и дано как допустимая передача в сноске.
- issue: Передача δοῦλος в самообозначении Иакова
  choice: раб
  alternative: слуга
  rationale: «Раб» сохраняет выраженную греческим словом принадлежность господину и полноту подчинения, тогда как «слуга» может ослабить этот оттенок.
- issue: Образ двенадцати колен в рассеянии
  choice: сохранён без уточнения адресатов
  alternative: иудейскому народу, живущему вне земли Израиля
  rationale: Фраза допускает обсуждение точного круга адресатов; перевод не должен заранее сводить образ только к одному толкованию.
translation_notes:
  register: Современный литературный русский с достоинством апостольского послания. Синтаксис сохраняет форму древнего адреса письма, но заключительное приветствие выражено естественно по-русски. Маркеры [a] и [b] размещены непосредственно при поясняемых выражениях.
