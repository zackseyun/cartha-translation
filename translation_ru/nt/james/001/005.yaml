id: JAS.1.5
reference: James 1:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ ⸀μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/005.yaml
  text: But if any of you lacks wisdom[a], let him ask of God, who gives to all generously and without reproach[b], and it will be given to him.
translation:
  language: ru
  text: Если же кому-нибудь из вас недостаёт мудрости, пусть просит у Бога, который щедро даёт всем и не упрекает[a], и ему[b] будет дано.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не укоряет».'
    reason: lexical_alternative
  - marker: b
    text: Формы единственного числа («кому-нибудь», «ему») относятся к любому человеку из числа адресатов, как к мужчине, так и к женщине.
    reason: cultural_note
lexical_decisions:
- source_word: Εἰ δέ
  choice: Если же
  rationale: Частица δέ мягко продолжает и слегка противопоставляет мысль предыдущему стиху; русское «же» передаёт эту связь без чрезмерного усиления контраста.
- source_word: τις ὑμῶν
  choice: кому-нибудь из вас
  rationale: Неопределённое τις с партитивным ὑμῶν означает любого человека из числа адресатов и сохраняет прямое пастырское обращение.
- source_word: λείπεται σοφίας
  choice: недостаёт мудрости
  rationale: Идиоматически обозначает нужду в мудрости. Формулировка естественна по-русски и не сужает σοφία до одного конкретного вида практического знания.
- source_word: αἰτείτω παρὰ τοῦ ... θεοῦ
  choice: пусть просит у Бога
  rationale: Императив третьего лица передан побудительной конструкцией «пусть просит», а παρά с родительным после αἰτέω — естественным русским «у Бога».
- source_word: τοῦ διδόντος θεοῦ πᾶσιν
  choice: Бога, который ... даёт всем
  rationale: Причастная характеристика Бога раскрыта придаточным определительным; πᾶσιν сохранено как широкое «всем».
- source_word: ἁπλῶς
  choice: щедро
  rationale: В контексте даяния наречие вероятнее всего выражает простую, нелицеприятную и неограниченную щедрость. «Щедро» ясно передаёт основную силу слова, не развивая её в отдельное богословское утверждение.
- source_word: μὴ ὀνειδίζοντος
  choice: и не упрекает
  rationale: ὀνειδίζω означает упрекать, поносить или стыдить. Прямой глагольный перевод показывает, что Бог не унижает просящего.
- source_word: δοθήσεται αὐτῷ
  choice: и ему будет дано
  rationale: Будущий пассив сохранён; подразумеваемый дар — мудрость. Местоимение единственного числа соответствует репрезентативному единственному числу греческого текста.
theological_decisions:
- issue: Репрезентативное единственное число
  choice: кому-нибудь ... пусть просит ... ему будет дано
  alternative: если кому-то ... пусть они просят ... им будет дано
  rationale: Греческий текст говорит об одном неопределённом человеке как представителе любого из адресатов. Русское «кому-нибудь ... ему» естественно сохраняет единственное число и не ограничивает обещание мужчинами.
- issue: Значение ἁπλῶς в описании Божьего даяния
  choice: щедро
  alternative: просто; бескорыстно; без оговорок
  rationale: В данном контексте слово прежде всего характеризует Божье даяние как щедрое и не сдерживаемое упрёком. Перевод не превращает стих в обещание материального благополучия.
- issue: Объём обещания «будет дано»
  choice: сохранён без добавления условий или уточнений
  alternative: Бог непременно даст просимое решение либо любой желаемый ответ
  rationale: Местоименно подразумевается мудрость, о которой просят. Перевод сохраняет силу обещания, но не расширяет его до всякой просьбы и не снимает напряжения с последующим требованием просить с верой.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Синтаксис близок к греческому ходу мысли, но естественен по-русски. Относительное местоимение «который» написано со строчной буквы, чтобы не вводить конфессионально обусловленную систему почтительных прописных.
