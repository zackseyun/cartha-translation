  text: μὴ γὰρ οἰέσθω ὁ ἄνθρωπος ἐκεῖνος ὅτι λήμψεταί τι παρὰ τοῦ κυρίου
base_translation:
  language: en
  yaml_path: translation/nt/james/001/007.yaml
  text: For that man must not suppose that he will receive anything from the Lord,[a]
translation:
  language: ru
  text: Ведь такой человек[a] не должен думать, что получит что-либо от Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тот человек»; имеется в виду сомневающийся человек, описанный в предыдущем стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γὰρ
  choice: Ведь ... не должен
  rationale: γάρ объясняет предшествующее предупреждение и передано словом «ведь». Запретительное μή с οἰέσθω естественно выражено современной русской конструкцией «не должен думать».
- source_word: οἰέσθω
  choice: думать
  rationale: Глагол означает «думать, полагать, считать». «Думать» ясно и естественно передаёт мыслительный акт, не подменяя его более контекстуальным «надеяться».
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: такой человек
  rationale: Оборот указывает на описанного в предыдущем стихе сомневающегося человека. Русское «такой человек» естественно сохраняет эту отсылку; более буквальное «тот человек» отмечено в сноске.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание мысли и прямо соответствует русскому «что».
- source_word: λήμψεταί
  choice: получит
  rationale: Будущая форма λαμβάνω передана обычным и стилистически уместным русским глаголом «получит».
- source_word: τι
  choice: что-либо
  rationale: 'В сфере отрицания неопределённое местоимение имеет обобщающее значение: человек не должен рассчитывать получить что бы то ни было.'
- source_word: παρὰ τοῦ κυρίου
  choice: от Господа
  rationale: παρά с родительным обозначает источник, а κύριος сохранено как титул «Господь» без уточнения референта.
theological_decisions:
- issue: Кого обозначает τοῦ κυρίου
  choice: Господа
  alternative: Бога; Господа Бога
  rationale: Греческий текст употребляет κύριος без дополнительного уточнения. Перевод «Господа» сохраняет формулировку и не вводит более конкретного отождествления.
- issue: Род и представительное значение ὁ ἄνθρωπος ἐκεῖνος
  choice: такой человек
  alternative: тот человек; такой человек мужского пола
  rationale: В греческом стоит форма мужского рода единственного числа, однако в контексте она представляет любого сомневающегося человека. Русское существительное «человек» сохраняет грамматическую форму и обобщающий смысл.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Конструкция «не должен думать» естественно передаёт силу греческого запрета, а «такой человек» связывает стих с непосредственным контекстом.
