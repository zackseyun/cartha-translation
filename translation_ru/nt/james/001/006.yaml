  text: αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/006.yaml
  text: But let him ask in faith[a], doubting nothing, for the one who doubts is like a wave of the sea, driven by the wind and tossed about.
translation:
  language: ru
  text: Но пусть просит с верой[a], нисколько не сомневаясь, потому что сомневающийся подобен морской волне, гонимой ветром и бросаемой из стороны в сторону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с доверием». Греческое слово πίστις («вера») в данном контексте может выражать доверительное упование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτείτω
  choice: пусть просит
  rationale: Форма настоящего времени повелительного наклонения в третьем лице передана естественной русской побудительной конструкцией; по контексту речь идёт о просьбе к Богу о мудрости.
- source_word: δὲ
  choice: но
  rationale: Союз обозначает мягкое противопоставление или переход к условию, с которым следует просить.
- source_word: ἐν πίστει
  choice: с верой
  rationale: Русское «с верой» естественно передаёт обстоятельственный смысл греческого оборота и сохраняет значимое понятие веры; оттенок доверия указан в сноске.
- source_word: μηδὲν διακρινόμενος
  choice: нисколько не сомневаясь
  rationale: В данном контексте διακρίνομαι обозначает внутреннее колебание или сомнение; «нисколько» передаёт силу μηδέν без неестественной буквальности.
- source_word: ὁ γὰρ διακρινόμενος
  choice: потому что сомневающийся
  rationale: Субстантивированное причастие передано обобщённо и без добавления отсутствующего в греческом тексте указания на мужской пол.
- source_word: ἔοικεν κλύδωνι θαλάσσης
  choice: подобен морской волне
  rationale: Сравнение и образ морского волнения переданы кратко, ясно и в современном литературном регистре.
- source_word: ἀνεμιζομένῳ καὶ ῥιπιζομένῳ
  choice: которую ветер гонит и мечет
  rationale: Относительное придаточное естественно для русского языка и сохраняет два согласованных образа воздействия ветра и беспорядочного движения волны.
theological_decisions:
- issue: Передача πίστις в наставлении о молитве
  choice: вера
  alternative: доверие
  rationale: Основной текст сохраняет широкое и богословски значимое понятие «вера», тогда как контекстуальный оттенок доверительного упования на Бога отмечен в сноске; тем самым ни один из оттенков не устраняется.
translation_notes:
  register: 'Современный литературный русский язык: ясная побудительная конструкция, нейтрально-достоинный тон и живой образ морской волны. Причастные формы не перегружены, а богословская неоднозначность между верой и доверием сохранена посредством сноски.'
