id: JAS.1.26
reference: James 1:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ θρησκὸς ⸀εἶναι μὴ χαλιναγωγῶν γλῶσσαν ⸀αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν ⸀αὐτοῦ, τούτου μάταιος ἡ θρησκεία.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/026.yaml
  text: If anyone thinks he is religious while not bridling his tongue but deceiving his heart[c][b][a], this person's religion is worthless.
translation:
  language: ru
  text: Если кто считает себя религиозным[a], но не обуздывает[b] свой язык, а обманывает своё сердце, у того религия тщетна[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кажется религиозным».'
    reason: lexical_alternative
  - marker: b
    text: Буквально здесь сохраняется образ узды, которой сдерживают и направляют животное.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «пуста»; «бесполезна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖ
  choice: считает себя
  rationale: В данном контексте передаёт самооценку человека; при этом возможное значение «кажется» сохранено в сноске.
- source_word: θρησκὸς
  choice: религиозным
  rationale: Сохраняет направленность на исповедуемую религиозность и лексическую связь с θρησκεία в конце стиха, не сужая смысл до внутреннего благочестия.
- source_word: χαλιναγωγῶν
  choice: обуздывает
  rationale: Сохраняет образ узды, которой управляют животным, и тематическую связь с Иак. 3:2–3; выражение естественно и понятно по-русски.
- source_word: γλῶσσαν αὐτοῦ
  choice: свой язык
  rationale: Буквально сохраняет конкретный образ языка как органа речи; возвратное притяжательное местоимение естественно соотносит язык с подлежащим.
- source_word: ἀπατῶν
  choice: обманывает
  rationale: Прямой русский эквивалент, выражающий внутреннее самообольщение через сочетание со «своё сердце».
- source_word: καρδίαν αὐτοῦ
  choice: своё сердце
  rationale: Сохраняет библейский образ сердца как внутреннего человека, не заменяя его толкованием «самого себя».
- source_word: τούτου
  choice: у того
  rationale: Естественно передаёт указательную силу греческого местоимения и отсылает к только что описанному человеку.
- source_word: μάταιος
  choice: тщетна
  rationale: Передаёт идею бесплодности и отсутствия подлинной пользы; альтернативы «пуста» и «бесполезна» отмечены в сноске.
- source_word: ἡ θρησκεία
  choice: религия
  rationale: Прямой эквивалент, обозначающий здесь религиозную практику или исповедуемую религиозность; сохраняет связь с «религиозным» в первой части стиха.
theological_decisions:
- issue: Родовая отсылка к человеку
  choice: Если кто считает себя религиозным… свой язык… своё сердце
  alternative: Если кто-либо считает себя религиозным…
  rationale: Греческие формы стоят в мужском роде единственного числа, но имеют обобщающее значение. Русская конструкция «если кто» естественно сохраняет и единственное число, и общий охват.
- issue: Значение θρησκεία/θρησκός
  choice: религиозным / религия
  alternative: набожным / набожность; соблюдающим обряды / религиозные обряды
  rationale: Выбранные слова сохраняют лексическую связь между двумя греческими однокоренными словами и не сводят смысл ни исключительно к обрядам, ни исключительно к внутреннему благочестию.
- issue: Обман сердца
  choice: обманывает своё сердце
  alternative: обманывает самого себя
  rationale: Буквальная формулировка сохраняет богословски насыщенный образ сердца как центра внутренней жизни, не устраняя его толкованием.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис краток и доступен; метафоры «обуздывает язык» и «обманывает сердце» сохранены без разъясняющего сглаживания.
