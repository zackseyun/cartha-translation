base_translation:
  language: en
  yaml_path: translation/nt/james/001/024.yaml
  text: For he looked at himself and went away[a], and immediately forgot what kind of person he was.
translation:
  language: ru
  text: Ведь он посмотрел на себя, ушёл и тотчас забыл, каким он был.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каков он был»; греческое выражение указывает на свойство или характер человека, а не просто на его личность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατενόησεν
  choice: посмотрел
  rationale: В контексте зеркала передаёт конкретное действие и не исключает оттенка внимательного разглядывания, присущего κατανοέω.
- source_word: γὰρ
  choice: не выражено отдельным словом
  rationale: γάρ связывает стих с предыдущим объяснением; в современном русском начало с «ведь» здесь утяжеляло бы отдельно цитируемую фразу, тогда как пояснительная связь ясна из контекста.
- source_word: ἑαυτὸν
  choice: на себя
  rationale: Точно передаёт возвратное местоимение, не добавляя отсутствующего в этом стихе слова «лицо».
- source_word: ἀπελήλυθεν
  choice: отошёл
  rationale: Естественно продолжает сцену у зеркала и передаёт удаление; русское прошедшее время уместно для последовательности событий, несмотря на перфектную форму греческого глагола.
- source_word: εὐθέως
  choice: тотчас
  rationale: Сохраняет значение немедленности в нейтральном, литературном регистре.
- source_word: ἐπελάθετο
  choice: забыл
  rationale: Прямой и естественный русский эквивалент.
- source_word: ὁποῖος ἦν
  choice: каким был
  rationale: 'Сохраняет качественное значение ὁποῖος и естественную русскую неоднозначность: речь может идти о внешнем виде или, в образном контексте, о том, каким человеком он является.'
theological_decisions:
- issue: Обобщённый мужской род в образе человека перед зеркалом
  choice: каким был
  alternative: каким человеком он был
  rationale: Русский мужской род согласуется с единичным представителем из предыдущего контекста, но не ограничивает применение стиха только мужчинами; добавление «человеком» могло бы чрезмерно направить смысл к нравственному самоосознанию.
- issue: Качественный смысл ὁποῖος
  choice: сохранить краткое «каким был»
  alternative: «что он за человек» или «как он выглядел»
  rationale: Греческая формулировка допускает качественный смысл, связанный как с зеркальным образом, так и с его нравственным применением. Перевод не должен устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная последовательность сохранена. «Отошёл» конкретнее соответствует сцене у зеркала, а «тотчас» подчёркивает резкость забывания.
