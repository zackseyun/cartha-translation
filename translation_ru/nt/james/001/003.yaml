lexical_decisions:
- source_word: γινώσκοντες
  choice: зная
  rationale: Причастие настоящего времени связано с призывом предыдущего стиха и естественно передаёт основание для него; русский деепричастный оборот сохраняет грамматическую связь и не добавляет отсутствующего союза.
- source_word: ὅτι
  choice: что
  rationale: Вводит содержание того, что адресаты знают.
- source_word: τὸ δοκίμιον
  choice: испытание
  rationale: Слово может обозначать как процесс проверки, так и выявленную ею подлинность. В основном тексте «испытание» естественно соответствует контексту испытаний, а альтернативный смысл сохранён в сноске.
- source_word: ὑμῶν τῆς πίστεως
  choice: вашей веры
  rationale: Родительная конструкция указывает на веру адресатов как предмет испытания; «вера» — прямой и естественный эквивалент πίστις в данном контексте.
- source_word: κατεργάζεται
  choice: производит
  rationale: Глагол обозначает достижение или создание результата; «производит» ясно сохраняет причинно-результативную связь.
- source_word: ὑπομονήν
  choice: стойкость
  rationale: ὑπομονή обозначает устойчивое перенесение трудностей и упорство в них. «Стойкость» звучит естественно и ёмко; близкие варианты приведены в сноске.
theological_decisions:
- issue: Передача πίστις
  choice: вера
  alternative: доверие; верность
  rationale: Здесь речь идёт о вере адресатов, проходящей испытание. Контекст не требует сужать значение до субъективного доверия или нравственной верности.
- issue: Неоднозначность δοκίμιον
  choice: испытание веры
  alternative: испытанная подлинность веры
  rationale: Контекст поддерживает процесс испытания, который порождает стойкость, однако греческое слово допускает также значение качества, подтверждённого испытанием; эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык, краткий и достойный по тону. Деепричастие «зная» сохраняет связь с предыдущим стихом; без него фраза остаётся синтаксически зависимой, как и в греческом тексте.
