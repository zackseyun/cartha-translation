reference: James 1:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ⸀ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: ru
  text: Блажен человек, который стойко переносит испытание[a], потому что, пройдя его, он получит венец жизни[b], который Он обещал любящим Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «искушение» или «проверку»: греческое слово может обозначать как испытание, так и искушение; здесь контекст подчёркивает стойкость в испытании.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово обозначало в том числе венок, которым награждали победителя, а не обязательно царскую корону.
    reason: cultural_note
lexical_decisions:
- source_word: Μακάριος
  choice: Блажен
  rationale: Сохраняет форму и богословскую весомость изречения-блаженства; «счастлив» могло бы звучать преимущественно как описание субъективного чувства.
- source_word: ἀνὴρ
  choice: человек
  rationale: Хотя греческое слово имеет мужской род, здесь оно употреблено обобщённо; русское «человек» естественно передаёт и форму единственного числа, и общий смысл.
- source_word: ὑπομένει
  choice: стойко переносит
  rationale: Передаёт не просто пассивное терпение, а сохраняемую под давлением стойкость.
- source_word: πειρασμόν
  choice: испытание
  rationale: В данном контексте речь прежде всего о трудности, которую нужно стойко перенести; при этом в примечании сохранён более широкий диапазон значения, включающий искушение.
- source_word: δόκιμος γενόμενος
  choice: выдержав испытание
  rationale: Естественно по-русски выражает результат проверки — человек оказался испытанным и одобренным. Буквальное «став одобренным» было бы тяжеловесно.
- source_word: λήμψεται
  choice: получит
  rationale: Прямо и естественно передаёт будущее время глагола λαμβάνω.
- source_word: στέφανον
  choice: венец
  rationale: Традиционное и уместное русское соответствие для наградного венка; примечание поясняет отличие от царской короны.
- source_word: τῆς ζωῆς
  choice: жизни
  rationale: Сохраняет формальную неоднозначность греческого родительного падежа без истолковывающего расширения вроде «венец, который есть жизнь».
- source_word: ἐπηγγείλατο
  choice: обещал
  rationale: Передаёт греческий аорист естественным русским прошедшим временем.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: любящим Его
  rationale: Кратко и естественно передаёт дательный падеж и причастную конструкцию, обозначающую людей, для которых любовь к Богу характерна.
theological_decisions:
- issue: Смысл πειρασμός в Иакова 1:12
  choice: испытание
  alternative: искушение; проверка
  rationale: Упоминания стойкости, успешного прохождения проверки и награды выдвигают на первый план испытание трудностями. Однако возможный оттенок искушения не устранён, а отмечен в сноске.
- issue: Неявный субъект ἐπηγγείλατο
  choice: Господь с текстовым примечанием
  alternative: Он; Бог
  rationale: В греческом предложении субъект явно не назван, но по смыслу обещающим является Господь/Бог. Чтение «Господь» имеет сильную рукописную поддержку как вариант текста и делает русский текст ясным; сноска сохраняет текстологическую прозрачность.
- issue: Образ στέφανος τῆς ζωῆς
  choice: венец жизни
  alternative: венок жизни; венец, то есть жизнь
  rationale: Сохраняет метафору и неоднозначную связь родительного падежа, не решая, означает ли выражение венец, состоящий в жизни, или венец, связанный с жизнью.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изречения. Синтаксис сделан ясным и плавным; традиционные слова «блажен» и «венец жизни» сохранены как понятные и содержательно точные. Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской практике.
