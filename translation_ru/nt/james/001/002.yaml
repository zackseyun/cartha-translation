lexical_decisions:
- source_word: Πᾶσαν χαρὰν
  choice: полной радостью
  rationale: Винительный оборот служит именной частью при ἡγήσασθε. «Полной радостью» передаёт всеохватный смысл πᾶσαν и по-русски звучит естественнее буквального «всякой радостью», не сводя выражение лишь к сильной степени радости.
- source_word: ἡγήσασθε
  choice: считайте это
  rationale: Аористный императив среднего залога от ἡγέομαι требует осознанной оценки происходящего. «Считайте это» сохраняет повелительную силу и звучит современно.
- source_word: ἀδελφοί μου
  choice: братья мои
  rationale: Сохранена грамматически мужская форма обращения. В данном послании она, вероятно, охватывает всю общину верующих; это уточнено в сноске.
- source_word: ὅταν
  choice: всякий раз, когда
  rationale: С сослагательным наклонением περιπέσητε союз выражает неопределённо-временное, повторяющееся значение; «всякий раз, когда» передаёт его яснее простого «когда».
- source_word: πειρασμοῖς
  choice: испытания
  rationale: В ближайшем контексте речь идёт о трудностях, испытывающих веру, а не прежде всего о внутреннем соблазне ко греху. Более широкий диапазон греческого слова отмечен в сноске.
- source_word: περιπέσητε
  choice: попадаете в
  rationale: Глагол буквально рисует попадание или впадение в некую ситуацию. Выражение сохраняет образность оригинала и остаётся понятным по-русски.
- source_word: ποικίλοις
  choice: самые разные
  rationale: Прилагательное обозначает многообразие. «Самые разные» естественно передаёт этот смысл в современном русском языке.
theological_decisions:
- issue: Охватывает ли обращение ἀδελφοί женщин в общине
  choice: В основном тексте сохранено «братья мои», а вероятный включительный смысл пояснён в сноске.
  alternative: братья и сёстры мои
  rationale: Так сохраняется форма исходного текста без исключения вероятного обращения ко всей общине.
- issue: Значение πειρασμοῖς в данном контексте
  choice: испытания
  alternative: искушения; проверки
  rationale: Продолжение говорит об испытании веры, тогда как нравственное искушение специально обсуждается в Иак. 1:13–14. При этом лексическая многозначность слова не скрывается.
translation_notes:
  register: Современный литературный русский язык с уважительным, но не архаичным звучанием. Порядок обращения сохранён близко к греческому; оборот «всякий раз, когда» передаёт неопределённо-повторяющееся значение, а «попадаете в» удерживает образность исходного глагола.
