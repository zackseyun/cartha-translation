  text: Человек с раздвоенной душой непостоянен во всех своих путях.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνὴρ
  choice: человек
  rationale: Хотя существительное стоит в мужском роде и единственном числе, здесь оно имеет обобщающее значение и относится к просящему из предыдущего стиха. «Человек» сохраняет грамматическую форму и естественно передаёт представительный смысл, не ограничивая высказывание мужчинами.
- source_word: δίψυχος
  choice: с раздвоенной душой
  rationale: Буквально прилагательное означает «двухдушный». Выражение «с раздвоенной душой» понятно передаёт внутреннюю раздвоенность и колебание, не сводя смысл лишь к переменчивости мыслей.
- source_word: ἀκατάστατος
  choice: непостоянный
  rationale: В данном контексте слово обозначает отсутствие устойчивости и последовательности. «Непостоянный» звучит естественно и лучше соответствует поведению человека, чем более буквальные варианты «неустойчивый» или «беспорядочный».
- source_word: ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ
  choice: во всех своих путях
  rationale: Образ «путей» обозначает все стороны жизни и поведения человека. Русское выражение сохраняет метафору оригинала и остаётся понятным в библейском контексте.
theological_decisions:
- issue: Обобщающее обозначение человека словом мужского рода
  choice: Передать ἀνὴρ словом «человек» в основном тексте
  alternative: «муж»
  rationale: Греческая форма — мужского рода и единственного числа, но в контексте имеет представительный, а не исключительно мужской смысл. Русское «человек» сохраняет единственное число и естественно включает любого просящего.
- issue: Характер внутренней раздвоенности
  choice: Сохранить образ раздвоенной души
  alternative: «сомневающийся» или «колеблющийся»
  rationale: δίψυχος описывает не только отдельное сомнение, но более глубокую внутреннюю разделённость. Образная передача сохраняет богословское напряжение между обращённостью к Богу и иной направленностью воли.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой, афористичной структуры оригинала. Метафора «пути» оставлена без разъясняющей подмены словом «поведение».
