  text: ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: ru
  text: Ведь взошло солнце с палящим зноем[a], иссушило траву, её цветок опал, и её прекрасный вид исчез; так и богатый увянет в своих занятиях[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с палящим ветром». Греческое слово может обозначать сильный зной, а в некоторых контекстах — связанный с ним горячий ветер.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в своих путях» или «в своих путешествиях». Греческое слово может обозначать как поездки, так и шире — ход деятельности человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέτειλεν
  choice: взошло
  rationale: Обычное русское обозначение восхода солнца; аорист передан совершенным видом в прошедшем времени.
- source_word: σὺν τῷ καύσωνι
  choice: с палящим зноем
  rationale: Передаёт сильный иссушающий жар и естественно сочетается с солнцем; возможность значения горячего ветра отмечена в сноске.
- source_word: ἐξήρανεν τὸν χόρτον
  choice: иссушило траву
  rationale: Сохраняет конкретный образ растительности, высохшей от жара, и причинную последовательность действий.
- source_word: τὸ ἄνθος αὐτοῦ ἐξέπεσεν
  choice: её цветок опал
  rationale: Глагол «опал» естественно описывает падение цветка и сохраняет физический образ греческого ἐκπίπτω.
- source_word: ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ
  choice: красота её облика
  rationale: Передаёт красоту внешнего вида, не вводя неестественного для растения буквального «лица».
- source_word: ἀπώλετο
  choice: исчезла
  rationale: В данном образе форма обозначает утрату и исчезновение красоты; русское слово ясно передаёт результат.
- source_word: ὁ πλούσιος
  choice: богатый
  rationale: Субстантивированное прилагательное сохраняет мужской род и единичного представительного участника без дополнительной оценочной окраски слова «богач».
- source_word: ἐν ταῖς πορείαις αὐτοῦ
  choice: среди своих начинаний
  rationale: Передаёт широкий смысл жизненных занятий и предпринимаемых дел, не сужая выражение до буквальных путешествий; буквальная возможность отмечена в сноске.
- source_word: μαρανθήσεται
  choice: увянет
  rationale: Сохраняет продолжение растительного образа и определённость будущего предупреждения.
theological_decisions:
- issue: Род и представительный характер выражения ὁ πλούσιος
  choice: богатый
  alternative: богатый человек; богач
  rationale: Мужской род единственного числа сохранён как в греческом тексте; предупреждение при этом не истолковывается как ограниченное только мужчинами.
- issue: Объём значения πορείαις в предупреждении богатому
  choice: начинания
  alternative: пути; путешествия; дела
  rationale: Выбран широкий смысл хода деятельности человека, чтобы не ограничивать предупреждение буквальными поездками или только коммерческими занятиями, при сохранении лексической неоднозначности в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Краткие совершенные глаголы сохраняют последовательность яркого природного образа; «увянет» связывает заключительное предупреждение с иссохшей травой. Все сноски отмечены в основном тексте.
