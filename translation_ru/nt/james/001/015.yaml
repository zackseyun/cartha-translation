id: JAS.1.15
reference: James 1:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν, ἡ δὲ ἁμαρτία ἀποτελεσθεῖσα ἀποκύει θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/015.yaml
  text: Then desire[a], after it has conceived, gives birth to sin; and sin, when it is fully grown[b], brings forth death.
translation:
  language: ru
  text: Затем желание, зачав, рождает грех, а грех, достигнув зрелости[a], порождает смерть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достигнув завершения»; возможен также смысл «полностью развившись».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: затем
  rationale: Передаёт последовательность развития от искушения к смерти и естественно звучит по-русски.
- source_word: ἐπιθυμία
  choice: желание
  rationale: Сохраняет широкий смысл слова в контексте; «похоть» чрезмерно сужала бы его до преимущественно сексуального значения.
- source_word: συλλαβοῦσα
  choice: зачав
  rationale: Сохраняет образ зачатия и предшествование этого действия рождению греха.
- source_word: τίκτει
  choice: рождает
  rationale: Ясно и естественно передаёт образ рождения.
- source_word: ἁμαρτίαν
  choice: грех
  rationale: Прямой и общепринятый эквивалент в данном нравственном контексте.
- source_word: δὲ
  choice: а
  rationale: Продолжает цепь образов, одновременно отмечая переход от желания к олицетворённому греху; в русском «а» здесь естественнее простого «и».
- source_word: ἀποτελεσθεῖσα
  choice: достигнув зрелости
  rationale: Передаёт достижение полноты или завершённости и поддерживает органический образ развития.
- source_word: ἀποκύει
  choice: порождает
  rationale: Сохраняет образ произведения на свет, но избегает неестественного повтора глагола «рождает».
- source_word: θάνατον
  choice: смерть
  rationale: Прямо передаёт исходный текст, не уточняя физическую, духовную или вечную смерть.
theological_decisions:
- issue: Образная связь желания, греха и смерти
  choice: Сохранить олицетворённый образ зачатия, рождения и созревания.
  alternative: 'Передать отвлечённо: «желание ведёт ко греху, а грех — к смерти».'
  rationale: Причинный пересказ ослабил бы риторическую силу текста и устранил бы последовательный образ, заложенный в греческих глаголах.
- issue: Значение θάνατος
  choice: Передать без уточнения как «смерть».
  alternative: «духовная смерть» или «вечная смерть».
  rationale: Греческий текст не ограничивает значение слова; перевод не должен вводить отсутствующее в стихе догматическое уточнение.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичности и яркой родовой метафоры оригинала. «Зачав» намеренно сохраняет образ и грамматически относится к олицетворённому желанию. Формулировка торжественная, но понятная обычному читателю.
