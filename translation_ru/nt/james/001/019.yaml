  text: ⸀Ἴστε, ἀδελφοί μου ἀγαπητοί. ἔστω ⸀δὲ πᾶς ἄνθρωπος ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/019.yaml
  text: 'Know this[a], my beloved brothers: let every man be quick to hear, slow to speak, slow to anger[c][b],'
translation:
  language: ru
  text: 'Знайте это, мои возлюбленные братья[a]: пусть каждый человек будет готов слушать, не спешит говорить и не спешит гневаться.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мои возлюбленные братья и сёстры». В греческом тексте стоит «братья», но обращение, вероятно, относится ко всей общине верующих.'
    reason: alternative_reading
  - marker: b
    text: 'Или начало стиха можно перевести: «Вы знаете это, мои возлюбленные братья». Греческая форма ἴστε допускает как повелительное, так и изъявительное понимание.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴστε
  choice: Знайте это
  rationale: Форма допускает как повелительное «знайте», так и изъявительное «вы знаете». В увещательном контексте предпочтено повелительное прочтение; «это» добавлено для естественной русской связи.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: мои возлюбленные братья
  rationale: Сохранены грамматически мужское обращение и оттенок ἀγαπητοί; вероятная обращённость ко всей общине отмечена в сноске.
- source_word: ἔστω δὲ πᾶς ἄνθρωπος
  choice: пусть каждый человек будет
  rationale: «Пусть… будет» передаёт повелительное значение ἔστω. «Каждый человек» естественно выражает обобщающее πᾶς ἄνθρωπος без ненужного ограничения только мужчинами; слабосоединительное δέ отдельно не выражено.
- source_word: ταχὺς εἰς τὸ ἀκοῦσαι
  choice: скор на слышание
  rationale: Формально и ёмко передаёт образ греческой конструкции и сохраняет лексическую связь со «слышать»; выражение понятно в современном литературном русском, хотя имеет возвышенный библейский оттенок.
- source_word: βραδὺς εἰς τὸ λαλῆσαι
  choice: медлен на слова
  rationale: Естественная русская параллель к «скор на слышание», передающая сдержанность в речи, а не физическую медлительность говорения.
- source_word: βραδὺς εἰς ὀργήν
  choice: медлен на гнев
  rationale: Сохраняет параллелизм и передаёт смысл неспешности к гневной реакции; «гнев» соответствует ὀργή без усиления до «ярости».
theological_decisions:
- issue: Повелительное или изъявительное значение Ἴστε
  choice: 'Повелительное: «Знайте это»'
  alternative: 'Изъявительное: «Вы знаете это»'
  rationale: Обе трактовки грамматически возможны. Повелительное прочтение лучше согласуется с последующим увещанием, но альтернативу необходимо сохранить в сноске.
- issue: Охват обращения ἀδελφοί
  choice: «братья» в основном тексте
  alternative: «братья и сёстры»
  rationale: Основной текст сохраняет мужскую форму источника, тогда как сноска поясняет вероятный смешанный состав христианской общины.
- issue: Обобщающее πᾶς ἄνθρωπος
  choice: «каждый человек»
  alternative: «всякий» / «каждый мужчина»
  rationale: ἄνθρωπος здесь имеет родовое значение «человек»; русский мужской грамматический род слова «человек» сохраняет форму единственного числа, не сужая наставление до мужчин.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Параллельные обороты «скор на… / медлен на…» сохраняют ритм и афористичность оригинала; пунктуация делает обращение и трёхчастное увещание ясными.
