id: JAS.1.16
reference: James 1:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μὴ πλανᾶσθε, ἀδελφοί μου ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/016.yaml
  text: Do not be deceived[a], my beloved brothers.
translation:
  language: ru
  text: Не заблуждайтесь, мои возлюбленные братья[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; греческое слово «братья» может быть собирательным обращением к верующим, включая женщин.'
    reason: Лексическая альтернатива и пояснение возможного охвата адресатов.
lexical_decisions:
- source_word: μὴ
  choice: не
  rationale: С формой повелительного наклонения выражает запрет; простое «не» не привносит неподтверждённого оттенка «перестаньте».
- source_word: πλανᾶσθε
  choice: заблуждайтесь
  rationale: В данном контексте речь идёт о ложном представлении о Боге как источнике искушения. «Не заблуждайтесь» естественно по-русски и сохраняет возможность понимать форму как предостережение как от обмана, так и от уклонения в ошибку.
- source_word: ἀδελφοί
  choice: братья
  rationale: Форма мужского рода буквально означает «братья» и служит обращением к собратьям по вере; возможный охват женщин пояснён в сноске.
- source_word: μου
  choice: мои
  rationale: Притяжательное местоимение передаёт личную, пастырскую близость обращения.
- source_word: ἀγαπητοί
  choice: возлюбленные
  rationale: Слово выражает тёплую привязанность; «возлюбленные» сохраняет достоинство и насыщенность исходного обращения лучше, чем более разговорное «дорогие».
theological_decisions:
- issue: Гендерная форма обращения к общине верующих
  choice: В основном тексте ἀδελφοί передано как «братья», а его возможное собирательное значение пояснено в сноске.
  alternative: «братья и сёстры»
  rationale: Греческое слово грамматически имеет мужской род, но в обращении могло охватывать всю общину, включая женщин. Такое решение сохраняет форму источника, не скрывая вероятный круг адресатов.
translation_notes:
  register: Современный литературный русский язык с кратким, настойчивым запретом и тёплым пастырским обращением. Порядок слов «мои возлюбленные братья» звучит естественно и сохраняет смысл всех элементов греческой фразы.
