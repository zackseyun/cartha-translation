  to: И пусть стойкость доведёт своё дело до конца[a], чтобы вы были зрелыми и цельными, ни в чём не имея недостатка.
  rationale: Заменено лишь менее естественное русское сочетание «совершает своё дело до конца» на идиоматичное «доведёт своё дело до конца». Смысловой ход стиха, различие между зрелостью и целостностью, а также всеобъемлющее «ни в чём» сохранены. Сноска уточнена, чтобы не создавать впечатления, будто русские выражения являются однокоренными.
