  text: ἡ δὲ ὑπομονὴ ἔργον τέλειον ἐχέτω, ἵνα ἦτε τέλειοι καὶ ὁλόκληροι, ἐν μηδενὶ λειπόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/004.yaml
  text: And let endurance have its perfect work[a], so that you may be mature and complete, lacking in nothing.
translation:
  language: ru
  text: И пусть стойкость доведёт своё дело до конца[a], чтобы вы были зрелыми и цельными, ни в чём не имея недостатка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «пусть имеет совершенное дело». Греческие слова, переданные здесь как «до конца» и «зрелыми», родственны и говорят о достижении предназначенной цели; «цельными» подчёркивает полноту во всех отношениях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴ
  choice: стойкость
  rationale: В контексте испытаний слово обозначает упорную выдержку и постоянство, а не пассивное ожидание; «стойкость» естественно передаёт этот смысл по-русски.
- source_word: ἔργον τέλειον ἐχέτω
  choice: пусть совершает своё дело до конца
  rationale: Греческая конструкция буквально говорит о «совершенном/завершённом деле». Русская формулировка передаёт повеление позволить стойкости привести своё действие к предназначенной полноте.
- source_word: ἵνα ἦτε
  choice: чтобы вы были
  rationale: Сохраняет целевое или результативное значение ἵνα с сослагательным наклонением, не вынуждая выбирать только одно из них.
- source_word: τέλειοι
  choice: зрелыми
  rationale: Применительно к людям τέλειος здесь указывает на достигнутую зрелость и соответствие цели; «зрелыми» не навязывает смысл абсолютной безгрешности.
- source_word: ὁλόκληροι
  choice: цельными
  rationale: Передаёт целостность во всех частях и сохраняет отличие от τέλειοι — «зрелыми».
- source_word: ἐν μηδενὶ λειπόμενοι
  choice: ни в чём не имея недостатка
  rationale: 'Передаёт всеохватное отрицание и причастный оборот: не испытывать нехватки ни в каком отношении.'
- source_word: δὲ
  choice: А
  rationale: Мягко связывает стих с предыдущей мыслью, отмечая следующий этап рассуждения без резкого противопоставления.
theological_decisions:
- issue: Значение τέλειοι в контексте духовного формирования
  choice: зрелыми
  alternative: совершенными
  rationale: Речь идёт о результате стойкости — достижении предназначенной зрелости и целостности. Такой перевод не утверждает и не отрицает доктрину безгрешного совершенства, которой сам стих однозначно не формулирует.
- issue: Соотношение τέλειοι и ὁλόκληροι
  choice: зрелыми и цельными
  alternative: совершенными и полными
  rationale: 'Выбранная пара сохраняет смысловое различие: достижение цели и зрелости, с одной стороны, и целостность во всех отношениях — с другой.'
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное, без архаизмов. Формулировка сохраняет образ действия стойкости и смысловую связь между завершённым делом и зрелостью человека.
