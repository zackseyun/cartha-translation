source:
  edition: SBLGNT
  text: ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, ⸀οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/025.yaml
  text: But the one who has looked intently into the perfect law[a], the law of freedom[c][b], and has continued in it—not becoming a forgetful hearer but a doer of the work—this one will be blessed in his doing.
translation:
  language: ru
  text: Но тот, кто пристально вгляделся в совершенный закон — закон свободы[a] — и продолжает держаться его, не становится забывчивым слушателем[b], а исполняет дело[c]; такой будет блажен в том, что делает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «в совершенный закон свободы».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «слушателем забывчивости»; по смыслу также: «слушателем, который забывает».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «исполняет дело»; более идиоматично: «действует» или «совершает дело».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: пристально вгляделся
  rationale: Глагол передаёт образ человека, который наклоняется, чтобы внимательно рассмотреть что-либо. Выбранный оборот сохраняет идею сосредоточенного, а не мимолётного взгляда и естественно звучит по-русски.
- source_word: νόμον τέλειον τὸν τῆς ἐλευθερίας
  choice: совершенный закон — закон свободы
  rationale: Повтор слова «закон» передаёт пояснительную конструкцию греческого текста и не сводит богословски ёмкое выражение к значению «закон, дающий свободу».
- source_word: παραμείνας
  choice: продолжает держаться его
  rationale: Причастие обозначает не разовое обращение к закону, а дальнейшее пребывание при нём. Настоящее время в русском ясно выражает эту длительность; местоимение относится к закону.
- source_word: οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος
  choice: став не забывчивым слушателем
  rationale: Родительный падеж ἐπιλησμονῆς естественно передан качественным прилагательным. Конструкция сохраняет противопоставление слушателя и исполнителя.
- source_word: ποιητὴς ἔργου
  choice: исполнителем дела
  rationale: ἔργον означает дело или действие, а не «слово», употреблённое в ближайшем контексте. Несколько необычная формулировка сохранена, чтобы не стирать это лексическое различие.
- source_word: μακάριος
  choice: блажен
  rationale: «Блажен» сохраняет религиозно-нравственный смысл μακάριος и здесь уместнее, чем более бытовые «счастлив» или «удачлив».
- source_word: ἐν τῇ ποιήσει αὐτοῦ
  choice: в том, что делает
  rationale: Буквальное «в своём делании» по-русски тяжеловесно. Выбранная формулировка естественно передаёт действие и сохраняет смысловую связь с «исполнителем».
- source_word: ὁ ... οὗτος
  choice: тот, кто ... [тот подразумевается как подлежащее главной части]
  rationale: Оборот сохраняет единичный обобщающий образ и не ограничивает высказывание мужчинами; в русском относительная конструкция «тот, кто» грамматически естественна.
theological_decisions:
- issue: Значение выражения «закон свободы»
  choice: Сохранить формулировку «закон свободы», не уточняя, что именно имеется в виду под законом и каким образом он связан со свободой.
  alternative: «закон, который даёт свободу»; «освобождающий закон»; явное отождествление с Евангелием или нравственным законом
  rationale: Греческий текст допускает богословски насыщенное понимание и сам не разрешает все возможные толкования. Буквенно ясная формулировка сохраняет эту напряжённость.
- issue: Обобщающий мужской род
  choice: Передать конструкцией «тот, кто», применимой к любому человеку.
  alternative: «муж»; «человек, который»; множественное число
  rationale: Мужской род греческого единственного числа здесь имеет обобщающее значение. Русская конструкция сохраняет единственное число, не вводя необоснованного ограничения по полу.
- issue: Связь благословения с делами
  choice: Сохранить утверждение «будет блажен в том, что делает» без пояснения причинной или заслуживающей связи.
  alternative: «получит благословение за свои дела»; «будет успешен в делах»
  rationale: Предлог ἐν не требует значения награды «за» дела, а текст не объясняет здесь механизм благословения. Перевод не должен заранее разрешать этот богословский вопрос.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Слово «блажен» намеренно сохранено; синтаксис упрощён ровно настолько, чтобы длинная греческая конструкция оставалась понятной обычному читателю. Тире выделяют пояснительное приложение «закон свободы».
