  terminology: '«Совершенный закон», «закон свободы» и «блажен» уместны. «Исполняет дело» сохраняет отличие ἔργον от «слова» и звучит по-русски естественнее, чем номинальное «исполнитель дела» в данной длинной конструкции. В сноске c нельзя предлагать «исполняет услышанное» как лексический вариант: это вводит «услышанное», которого в ἔργου нет.'
