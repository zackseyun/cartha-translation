    reason: alternative_reading
lexical_decisions:
- source_word: Καυχάσθω
  choice: пусть хвалится
  rationale: Форма настоящего времени повелительного наклонения передаёт призыв. «Хвалится» сохраняет смысл καυχάομαι и не смягчает его до простого «радуется»; предмет такой похвалы определяется как дарованное возвышение, а не самовозвеличивание.
- source_word: δὲ
  choice: же
  rationale: Частица δέ обозначает переход с лёгким оттенком противопоставления. Русское «же» естественно связывает стих с контекстом и подготавливает противопоставление брату богатому в следующем стихе.
- source_word: ὁ ἀδελφὸς
  choice: брат
  rationale: Сохранены мужской род и единственное число греческого текста. В Послании Иакова слово обычно обозначает члена общины верующих; возможное представительное употребление пояснено в сноске.
- source_word: ὁ ταπεινὸς
  choice: занимающий низкое положение
  rationale: В данном контексте ταπεινός указывает прежде всего на низкое общественное или материальное положение, особенно ввиду противопоставления богатому в стихе 10. Формулировка не сводит значение ни только к бедности, ни к личной добродетели смирения.
- source_word: ἐν τῷ ὕψει αὐτοῦ
  choice: своим возвышением
  rationale: Слово ὕψος означает высоту или возвышение. Выбранный вариант сохраняет образ переворота положения и допускает как нынешний почётный статус верующего перед Богом, так и будущее возвышение.
theological_decisions:
- issue: Смысл «возвышения» брата, занимающего низкое положение
  choice: Сохранено широкое значение возвышенного положения или чести перед Богом с мотивом перемены участи.
  alternative: Нынешнее общественное возвышение; исключительно духовный статус перед Богом; исключительно будущее эсхатологическое возвышение.
  rationale: Сопоставление униженного и богатого в стихах 9–10 предполагает переворот положения, но сам стих не ограничивает его только настоящим или будущим и не определяет его исключительно социально либо духовно.
- issue: Передача ἀδελφός по роду и числу
  choice: «брат» в мужском роде и единственном числе
  alternative: «брат или сестра»; «верующий»; «член общины»
  rationale: Основной текст сохраняет грамматическую форму источника, тогда как возможный представительный смысл указывается в сноске без подмены исходного выражения.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Оборот «занимающий низкое положение» несколько развёрнут, но естественнее и точнее передаёт статусный смысл ταπεινός, чем двусмысленные «низкий», «униженный» или преимущественно нравственное «смиренный».
