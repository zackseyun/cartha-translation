id: JAS.1.21
reference: James 1:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/021.yaml
  text: Therefore, having put away all filthiness and the overflow of wickedness, receive with meekness the implanted word, which is able to save your souls.
translation:
  language: ru
  text: Поэтому, отвергнув всякую нечистоту и избыток зла[a], с кротостью[b] примите посеянное в вас слово[c], которое может спасти ваши души[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обилие зла»; возможно также: «избыток злобы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с мягкостью»; возможно также: «в смирении».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вложенное в вас слово»; буквально возможно также: «врождённое слово»; традиционно: «насаждённое слово».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «вас самих» или «ваши жизни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего наставления и сохраняет явную логическую связь.
- source_word: ἀποθέμενοι
  choice: отвергнув
  rationale: Деепричастие передаёт сопутствующее или логически предшествующее действие аористного причастия; «отвергнув» естественно выражает сознательное устранение нравственной нечистоты.
- source_word: πᾶσαν ῥυπαρίαν
  choice: всякую нечистоту
  rationale: Сохраняет нравственный смысл образа загрязнения и звучит естественнее в современном русском, чем буквальное «всякую грязь».
- source_word: περισσείαν κακίας
  choice: избыток зла
  rationale: περισσεία обозначает избыток или изобилие, а κακία здесь имеет широкий нравственный смысл; формулировка не сужает значение до одной лишь злобы.
- source_word: ἐν πραΰτητι
  choice: с кротостью
  rationale: Передаёт мягкость, смиренную восприимчивость и отсутствие самоуверенного противления; сохраняет традиционный, но понятный русский термин.
- source_word: δέξασθε
  choice: примите
  rationale: Прямо передаёт повелительное наклонение и активное, благожелательное принятие.
- source_word: τὸν ἔμφυτον λόγον
  choice: посеянное в вас слово
  rationale: Естественно передаёт образ слова, помещённого внутрь и укореняющегося там, не определяя точнее механизм этого действия. «Насаждённое» возможно, но в современном русском может иметь нежелательный оттенок навязывания.
- source_word: τὸν δυνάμενον σῶσαι
  choice: которое может спасти
  rationale: Сохраняет утверждение о способности слова спасать, не добавляя объяснения способа или времени спасения.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: ваши души
  rationale: Формально сохраняет ψυχή и богословскую весомость выражения, тогда как контекстуальные варианты «вас самих» и «ваши жизни» вынесены в примечание.
theological_decisions:
- issue: Значение τὰς ψυχὰς ὑμῶν в контексте спасения
  choice: ваши души
  alternative: вас самих; ваши жизни
  rationale: «Ваши души» сохраняет ключевой термин и традиционную богословскую выразительность, но примечание отмечает, что ψυχή может обозначать также жизнь или самого человека.
- issue: Смысл τὸν ἔμφυτον λόγον
  choice: посеянное в вас слово
  alternative: врождённое слово; насаждённое слово
  rationale: Выбранная формулировка сохраняет представление о слове, находящемся внутри слушателей, и сельскохозяйственный оттенок, не решая однозначно, следует ли понимать ἔμφυτος как «вложенное», «укоренённое» или «врождённое».
translation_notes:
  register: Современный литературный русский с достоинством библейского наставления. Синтаксис сохраняет причинно-следственную связь, деепричастную конструкцию и главное повеление. Лексика понятна широкому читателю; неоднозначности ἔμφυτος, πραΰτης, περισσεία κακίας и ψυχή отражены в примечаниях.
