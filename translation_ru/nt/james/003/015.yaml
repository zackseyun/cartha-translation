base_translation:
  language: en
  yaml_path: translation/nt/james/003/015.yaml
  text: This wisdom is not coming down from above[a], but is earthly, unspiritual, demonic.
translation:
  language: ru
  text: Эта мудрость не нисходит свыше, но она земная, бездуховная[a], бесовская.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «природная». Греческое прилагательное может обозначать то, что принадлежит лишь естественной жизни, в противоположность духовному.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη ἡ σοφία
  choice: эта мудрость
  rationale: Указательное местоимение с существительным отсылает к мудрости, только что описанной в контексте; прямой перевод сохраняет эту связь без лишнего истолкования.
- source_word: ἄνωθεν
  choice: свыше
  rationale: Традиционное и естественное русское соответствие передаёт происхождение «сверху» и сохраняет созвучие с темой даров от Бога в Иак. 1:17, не заменяя выражение более толковательным «с небес».
- source_word: κατερχομένη
  choice: нисходит
  rationale: Настоящее причастие передаёт продолжающееся нисхождение; личная глагольная форма звучит естественно по-русски и сохраняет образ движения сверху вниз.
- source_word: ἐπίγειος
  choice: земная
  rationale: Сохраняет точное противопоставление выражению «свыше» и не добавляет оттенков слова «мирская».
- source_word: ψυχική
  choice: бездуховная
  rationale: Передаёт отрицательное противопоставление духовному, оставаясь понятным современному читателю. Поскольку греческое слово может также обозначать принадлежащее лишь естественной жизни, альтернативный оттенок отмечен в сноске.
- source_word: δαιμονιώδης
  choice: бесовская
  rationale: Ясно и кратко обозначает относящееся к бесам или свойственное им; в данном библейском регистре звучит естественнее, чем «демоническая».
theological_decisions:
- issue: Значение ψυχική в противопоставлении духовному
  choice: бездуховная
  alternative: природная; душевная
  rationale: «Бездуховная» ясно выражает отрицательный контраст с тем, что приходит свыше, но сноска сохраняет возможный смысл принадлежности лишь естественной жизни. «Душевная» формально близка, однако для большинства современных читателей непрозрачна и может ошибочно восприниматься положительно.
translation_notes:
  register: Современный литературный русский язык с кратким, весомым трёхчленным рядом определений. Сохранены образ нисхождения и противопоставление «свыше — земная»; союз ἀλλά передан конструкцией «но она», естественной для русского синтаксиса.
