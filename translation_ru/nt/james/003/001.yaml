base_translation:
  language: en
  yaml_path: translation/nt/james/003/001.yaml
  text: Not many of you should become teachers[a], my brothers, knowing that we will receive a greater judgment.
translation:
  language: ru
  text: Не многие из вас должны становиться учителями, братья мои[a], ведь вы знаете, что мы подвергнемся более строгому суду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое обращение «братья» здесь, вероятно, относится ко всей общине, включая сестёр.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ πολλοὶ
  choice: пусть не многие из вас
  rationale: Сочетание μή с повелительной формой выражает предостережение или запрет; такая конструкция естественно передаёт его по-русски, а «из вас» ясно указывает на адресатов формы второго лица множественного числа.
- source_word: διδάσκαλοι
  choice: учителями
  rationale: Прямое и естественное соответствие, не предполагающее сверх текста особой формальной должности.
- source_word: γίνεσθε
  choice: становятся
  rationale: Передаёт значение вступления в роль учителя, а не просто пребывания в ней.
- source_word: ἀδελφοί μου
  choice: Братья мои
  rationale: Сохраняет грамматически мужскую форму греческого обращения; вероятный охват всей общины пояснён в сноске.
- source_word: εἰδότες
  choice: ведь вы знаете
  rationale: Естественно выражает обосновывающую силу причастия в данном контексте, не превращая её в более жёсткую причинную формулу.
- source_word: μεῖζον
  choice: более строгому
  rationale: В сочетании с κρίμα сравнительная форма указывает на повышенную меру ответственности и более суровую оценку; «более строгому» звучит естественно по-русски.
- source_word: κρίμα
  choice: суду
  rationale: «Суд» сохраняет широту значения — судебное решение или осуждение — и не предрешает, что речь непременно идёт об окончательном осуждении.
- source_word: λημψόμεθα
  choice: мы подвергнемся
  rationale: Идиоматически передаёт получение суда по-русски и сохраняет первое лицо множественного числа, которым автор включает себя в число ответственных учителей.
theological_decisions:
- issue: Круг адресатов обращения ἀδελφοί μου
  choice: «Братья мои» в основном тексте со сноской об инклюзивном употреблении
  alternative: «Братья и сёстры мои»
  rationale: Греческая форма грамматически мужская, но в обращении часто охватывает всю христианскую общину. Основной текст сохраняет форму источника, а сноска сообщает вероятный широкий смысл.
- issue: Смысл κρίμα в предостережении учителям
  choice: «суд»
  alternative: «осуждение» или «приговор»
  rationale: Стих утверждает повышенную ответственность учителей, но κρίμα само по себе здесь не требует понимания как окончательного осуждения; более широкое «суд» сохраняет богословское напряжение.
- issue: Сравнительная сила μεῖζον κρίμα
  choice: «более строгому суду»
  alternative: «большему суду»
  rationale: Буквальное «большему суду» неестественно для современного русского языка. «Более строгому» ясно передаёт сравнительную степень ответственности, не уточняя сверх текста природу приговора.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского увещания. Порядок слов слегка перестроен ради естественности: обращение вынесено в начало. Формулировка сохраняет предупреждение, авторское «мы» и неоднозначность слова «суд».'
