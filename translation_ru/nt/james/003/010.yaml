- source_word: ἐκ τοῦ αὐτοῦ στόματος
  choice: Из одних и тех же уст
  rationale: Естественно передаёт источник речи и сохраняет образ одних уст, из которых исходит противоположное.
- source_word: ἐξέρχεται
  choice: исходят
  rationale: 'Глагол передан во множественном числе по нормам русского согласования с двумя однородными подлежащими: «благословение и проклятие».'
- source_word: εὐλογία
  choice: благословение
  rationale: Сохраняет прямое значение произносимого благословения и ясный контраст с проклятием.
- source_word: κατάρα
  choice: проклятие
  rationale: Прямой и естественный русский эквивалент для речевого акта, противопоставленного благословению.
- source_word: οὐ χρή
  choice: не должно
  rationale: Передаёт нравственную недопустимость и несообразность, выраженную безличным χρή, не усиливая её до прямого запрета.
- source_word: ἀδελφοί μου
  choice: Братья мои
  rationale: Сохраняет грамматически мужскую форму греческого обращения; вероятный охват всей общины отмечен в сноске.
- source_word: ταῦτα οὕτως γίνεσθαι
  choice: этому быть так
  rationale: Естественная русская конструкция сохраняет указание на описанное явление и οὕτως — «так».
theological_decisions:
- issue: Гендерный охват обращения ἀδελφοί μου
  choice: Братья мои
  alternative: Братья и сёстры мои
  rationale: Основной текст отражает мужскую форму оригинала, а сноска сохраняет вероятный контекстуальный смысл обращения ко всей общине верующих, не устраняя неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, весомая формулировка сохраняет образность и нравственный тон оригинала. Порядок «Братья мои» выбран как естественное библейское обращение без архаизации остального стиха.
