  text: ⸂εἰ δὲ⸃ τῶν ἵππων τοὺς χαλινοὺς εἰς τὰ στόματα βάλλομεν ⸀εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν, καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/003.yaml
  text: If we put bits into the mouths of horses so that they obey us[a], we also guide their whole bodies.
translation:
  language: ru
  text: Если мы вкладываем лошадям в рот удила, чтобы они повиновались нам, то направляем и всё тело каждой из них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Если
  rationale: Условное «если» естественно вводит пример; слабый связующий оттенок δέ в русском контексте не требует отдельного слова.
- source_word: χαλινοὺς
  choice: удила
  rationale: При помещении в рот лошади речь точнее идёт об удилах, а не обо всей узде.
- source_word: εἰς τὰ στόματα βάλλομεν
  choice: вкладываем ... в рот
  rationale: Передаёт движение внутрь, выраженное εἰς, и обычное значение βάλλομεν «класть, помещать»; собирательное русское выражение «лошадям в рот» звучит естественнее буквального множественного числа.
- source_word: εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν
  choice: чтобы они повиновались нам
  rationale: Сохраняет целевое значение конструкции с εἰς и инфинитивом и значение πείθεσθαι с дательным как повиновение.
- source_word: μετάγομεν
  choice: управляем
  rationale: В контексте лошадей глагол обозначает направление их движения; «управляем» естественно выражает контроль над всем телом посредством удил.
- source_word: ὅλον τὸ σῶμα αὐτῶν
  choice: всем их телом
  rationale: Сохраняет греческое единственное число σώμα в естественной для русского языка распределительной конструкции при множественном референте.
