  source_fidelity: «Удила» точно передаёт χαλινοὺς в данном контексте, поскольку речь идёт о предмете, помещаемом в рот лошади. Целевое «чтобы они повиновались нам» верно передаёт εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν. Однако «управляем всем их телом» менее точно отражает μετάγομεν, то есть направлять движение, и несколько неестественно при распределительном единственном σώμα.
