id: JAS.3.14
reference: James 3:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/014.yaml
  text: But if you have bitter jealousy and selfish ambition in your hearts[d][c][b][a], do not boast and lie against the truth.
translation:
  language: ru
  text: Но если в ваших сердцах[a] есть горькая зависть[b] и своекорыстное честолюбие[c], не хвалитесь и не лгите вопреки истине[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в вашем сердце»; единственное число имеет здесь распределительный смысл.'
    reason: previous_rendering
  - marker: b
    text: 'Или: «горькая ревность»; возможно также: «горькая завистливая ревность».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «соперничество», «склонность к раздорам».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «не будьте лживы по отношению к истине».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Но если
  rationale: Передаёт условие и контраст с предшествующим описанием мудрости, сохраняя естественный русский синтаксис.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: в ваших сердцах
  rationale: Греческое единственное число при местоимении множественного числа имеет распределительное значение; русское множественное число ясно показывает обращение ко всей группе.
- source_word: ζῆλον πικρὸν
  choice: горькая зависть
  rationale: В отрицательном контексте и в сочетании с ἐριθεία слово ζῆλος обозначает прежде всего завистливую ревность; «горькая» непосредственно передаёт πικρόν.
- source_word: ἐριθείαν
  choice: своекорыстное честолюбие
  rationale: Выражение передаёт стремление к личному возвышению и выгоде, а также заложенную в слове склонность к соперничеству и раздорам.
- source_word: μὴ κατακαυχᾶσθε
  choice: не хвалитесь
  rationale: Кратко и естественно передаёт запрет на надменное самовосхваление; возможный оттенок превозношения над другими раскрывается контекстом.
- source_word: ψεύδεσθε κατὰ τῆς ἀληθείας
  choice: не лгите вопреки истине
  rationale: «Не лгите» сохраняет глагольную силу ψεύδεσθε, а «вопреки» передаёт направленность κατά против истины без лишнего уточнения её содержания.
theological_decisions:
- issue: Смысл выражения «истина»
  choice: Сохранено широкое обозначение «истина».
  alternative: «истина Евангелия», «истинный путь мудрости» или только «правдивость в речи»
  rationale: Контекст допускает связь и с Божьей истиной, и с истинной мудростью, и с правдивостью; конкретизация сузила бы намеренно широкое выражение.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и умеренно формальным звучанием. Синтаксис близок к греческому, но естественен для современного читателя; неоднозначность ключевых слов вынесена в примечания.
