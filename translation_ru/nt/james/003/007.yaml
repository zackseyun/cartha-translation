  yaml_path: translation/nt/james/003/007.yaml
  text: For every kind of beast and bird[a], of reptile and sea creature, is being tamed and has been tamed by humankind.
translation:
  language: ru
  text: Ведь всякий вид зверей и птиц, пресмыкающихся и морских животных укрощается и укрощён человеческим родом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человеческой природой» или «человечеством». Греческое выражение может обозначать человеческий род собирательно либо человеческую природу в более отвлечённом смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ... φύσις
  choice: всякий вид
  rationale: В перечне животных φύσις обозначает вид или род живых существ; сочетание с πᾶσα имеет распределительное значение.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит пояснение к предыдущей мысли; «ведь» естественно передаёт эту связь по-русски.
- source_word: θηρίων
  choice: зверей
  rationale: «Звери» — краткое и естественное обозначение наземных животных, сохраняющее оттенок θηρίον.
- source_word: πετεινῶν
  choice: птиц
  rationale: Обычное современное соответствие для обозначения летающих существ в таком перечне.
- source_word: ἑρπετῶν
  choice: пресмыкающихся
  rationale: Передаёт широкое обозначение ползающих существ и сохраняет традиционную категорию перечня без чрезмерного сужения до современной зоологической классификации.
- source_word: ἐναλίων
  choice: морских животных
  rationale: Субстантивированное прилагательное обозначает живых существ, обитающих в море; выбран ясный широкий эквивалент.
- source_word: δαμάζεται καὶ δεδάμασται
  choice: укрощается и укрощён
  rationale: Различение настоящего и перфекта сохраняет сочетание продолжающегося процесса с уже достигнутым результатом.
- source_word: τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: человеческим родом
  rationale: В контексте выражение наиболее естественно понимать собирательно — как человечество, выступающее деятелем укрощения; буквальная возможность значения «человеческой природой» отмечена в сноске.
theological_decisions:
- issue: Смысл τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: Собирательное обозначение человеческого рода как деятеля
  alternative: «человеческой природой»
  rationale: Контраст с видами животных поддерживает собирательное прочтение, однако грамматика допускает и более отвлечённое значение, поэтому неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и dignified; синтаксический параллелизм и различие глагольных форм оригинала сохранены. Сноска поставлена непосредственно после спорного выражения.
