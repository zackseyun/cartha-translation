id: JAS.3.9
reference: James 3:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐν αὐτῇ εὐλογοῦμεν τὸν ⸀κύριον καὶ πατέρα, καὶ ἐν αὐτῇ καταρώμεθα τοὺς ἀνθρώπους τοὺς καθ’ ὁμοίωσιν θεοῦ γεγονότας·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/009.yaml
  text: With it we bless the Lord and Father[b][a], and with it we curse people who have been made according to the likeness of God.
translation:
  language: ru
  text: Им мы благословляем Господа и Отца[a], и им же проклинаем людей[b], сотворённых по подобию Божьему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Господа и Отца»; это выражение можно понимать как «Господа, Который есть Отец» или как соединённое именование Бога.'
    reason: alternative_reading
  - marker: b
    text: То есть всех людей, человечество вообще.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: им
  rationale: Местоимение относится к языку из предшествующего контекста; творительный падеж естественно передаёт орудийное значение.
- source_word: εὐλογοῦμεν
  choice: благословляем
  rationale: Сохраняет прямое значение глагола и резкий лексический контраст с «проклинаем».
- source_word: τὸν κύριον καὶ πατέρα
  choice: Господа и Отца
  rationale: Буквально сохраняет сочинительную конструкцию и не устраняет возможное приложительное понимание выражения.
- source_word: καταρώμεθα
  choice: проклинаем
  rationale: Прямой и естественный эквивалент, сохраняющий нравственную силу противопоставления благословению.
- source_word: τοὺς ἀνθρώπους
  choice: людей
  rationale: Передаёт общее обозначение человечества без ограничения только мужчинами.
- source_word: καθ’ ὁμοίωσιν θεοῦ
  choice: по подобию Божьему
  rationale: Естественная русская формулировка, близко передающая καθ’ ὁμοίωσιν и отсылающая к языку повествования о сотворении.
- source_word: γεγονότας
  choice: сотворённых
  rationale: В контексте Божьего подобия передаёт результат творческого действия и подразумеваемое Божье участие яснее, чем буквальное «ставших».
theological_decisions:
- issue: Обобщающее значение ἀνθρώπους
  choice: людей
  alternative: человеков; человеческих существ
  rationale: Речь идёт обо всех людях как носителях Божьего подобия; «людей» точно и естественно передаёт общий смысл.
- issue: Соотношение титулов «Господь» и «Отец»
  choice: Господа и Отца
  alternative: Господа, то есть Отца; Господа, Который есть Отец
  rationale: Греческая конструкция допускает приложительное понимание, но буквальная координация сохраняет подлинную неоднозначность и не навязывает толкование.
- issue: Значение γεγονότας в связи с Божьим подобием
  choice: сотворённых
  alternative: ставших; созданных
  rationale: Форма буквально указывает на возникшее и сохраняющееся состояние; в явной аллюзии на сотворение «сотворённых» естественно передаёт смысл, не отрицая результирующего оттенка.
translation_notes:
  register: Современный литературный русский язык с библейски достоинственным регистром. Повтор «им… им же» сохраняет риторический контраст оригинала; «Божьему» звучит естественнее для широкого современного читателя, чем более высокий вариант «Божию».
