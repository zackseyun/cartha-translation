source:
  edition: SBLGNT
  text: τὴν δὲ γλῶσσαν οὐδεὶς ⸂δαμάσαι δύναται ἀνθρώπων⸃· ⸀ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/008.yaml
  text: But no one among men is able to tame the tongue[a]. It is a restless evil[b], full of deadly poison.
translation:
  language: ru
  text: Но язык никто из людей не может укротить. Это — неугомонное зло[a], полное смертоносного яда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беспокойное зло», «неустойчивое зло»; возможно: «необузданное зло».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: язык
  rationale: Сохраняет буквальный образ органа речи и связь с предыдущими стихами, где язык служит образом человеческой речи.
- source_word: οὐδεὶς … ἀνθρώπων
  choice: никто из людей
  rationale: 'Естественно передаёт партитивную конструкцию: ни один человек, никто из числа людей.'
- source_word: δαμάσαι δύναται
  choice: укротить не может
  rationale: «Укротить» сохраняет связь с укрощением животных в ближайшем контексте; сочетание с «не может» естественно передаёт способность, выраженную δύναται.
- source_word: ἀκατάστατον
  choice: неукротимое
  rationale: В данном контексте слово обозначает зло, которое невозможно удержать или подчинить; вариант сохраняет смысловую связь с предыдущим утверждением, хотя греческое слово также может означать «беспокойное» или «необузданное».
- source_word: κακόν
  choice: зло
  rationale: Передаёт моральную и разрушительную силу слова, а не только причиняемый им вред.
- source_word: μεστὴ
  choice: полное
  rationale: Прямое и естественное соответствие, согласованное в русском с существительным «зло».
- source_word: ἰοῦ θανατηφόρου
  choice: смертоносного яда
  rationale: В контексте ἰός означает яд, а θανατηφόρος — несущий смерть; «смертоносный яд» ясно и ёмко передаёт сочетание.
theological_decisions:
- issue: Объём утверждения οὐδεὶς … ἀνθρώπων
  choice: никто из людей
  alternative: ни один человек
  rationale: Сохраняется универсальное утверждение о человеческой неспособности укротить язык без добавления вывода о невозможности для Бога.
- issue: Характеристика языка как ἀκατάστατον κακόν
  choice: неукротимое зло
  alternative: беспокойное зло; необузданное зло; неустойчивое зло
  rationale: Не устраняет напряжение между повелениями управлять речью и утверждением, что ни один человек не способен окончательно укротить язык; сноска сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, образная и торжественная формулировка. Порядок слов сделан естественным для русского, при этом сохранены метафора языка, универсальность утверждения и неоднозначность ἀκατάστατον.
