  text: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/013.yaml
  text: Who is wise and understanding among you? Let him show his works by his good conduct[b][a], in the meekness of wisdom.
translation:
  language: ru
  text: Кто среди вас мудр и разумен? Пусть он[a] покажет свои дела добрым поведением, с кротостью, присущей мудрости.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст употребляет форму мужского рода единственного числа в обобщающем смысле — о любом таком человеке в общине.
    reason: cultural_note
  - marker: b
    text: 'Или: «с кротостью, которая исходит от мудрости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν
  choice: Кто среди вас мудр и разумен?
  rationale: Риторический вопрос передан естественным русским порядком слов. «Мудр» выражает практическую и нравственную мудрость, а «разумен» — понимание и рассудительность в данном увещательном контексте.
- source_word: δειξάτω
  choice: Пусть он покажет
  rationale: Форма третьего лица единственного числа имеет повелительное значение; конструкция «пусть… покажет» естественно сохраняет этот смысл.
- source_word: ἐκ τῆς καλῆς ἀναστροφῆς
  choice: добрым поведением
  rationale: 'ἀναστροφή обозначает поведение, образ жизни; здесь ἐκ указывает на средство или проявление: дела становятся видны через доброе поведение.'
- source_word: τὰ ἔργα αὐτοῦ
  choice: свои дела
  rationale: Возвратное «свои» естественно соотносит дела с подлежащим; «дела» сохраняет важную для Послания Иакова лексику ἔργα.
- source_word: ἐν πραΰτητι σοφίας
  choice: с кротостью, присущей мудрости
  rationale: πραΰτης передано как нравственная «кротость», не означающая слабости. Родительный σοφίας допускает характеристику кротости мудростью; более причинное понимание отмечено в сноске.
theological_decisions:
- issue: Мужской род единственного числа и обобщающее значение
  choice: Пусть он покажет
  alternative: Пусть такой человек покажет
  rationale: Греческий текст использует мужской род единственного числа в обобщающем смысле. Русская форма сохраняет грамматику оригинала, а сноска поясняет, что речь идёт о любом таком человеке в общине.
- issue: Связь родительного σοφίας с πραΰτητι
  choice: с кротостью, присущей мудрости
  alternative: с кротостью, которая исходит от мудрости
  rationale: Основной текст сохраняет качественную связь кротости с мудростью, не сводя её однозначно к причинной; допустимое понимание мудрости как источника кротости дано в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным увещательным тоном. Сохранены ключевые понятия «мудрость», «дела» и «кротость»; синтаксис сделан понятным без устранения неоднозначности сочетания πραΰτητι σοφίας.
