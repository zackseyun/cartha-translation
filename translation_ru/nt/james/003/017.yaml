source:
  edition: SBLGNT
  text: ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ⸀ἀδιάκριτος, ἀνυπόκριτος·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: ru
  text: Но мудрость свыше прежде всего чиста, затем миролюбива, кротка, готова прислушаться, полна милосердия и добрых плодов, беспристрастна[a] и нелицемерна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «нераздвоенна» или «без колебаний, без сомнений»; греческое слово ἀδιάκριτος допускает эти значения наряду с «беспристрастна».'
    reason: Лексически трудное слово ἀδιάκριτος может означать «беспристрастная», а также передавать мысль о нераздвоенности либо отсутствии колебаний и сомнений.
lexical_decisions:
- source_word: ἄνωθεν
  choice: свыше
  rationale: Передаёт обычное значение наречия и сохраняет противопоставление мудрости свыше земной мудрости в контексте (3:15), не уточняя образ словом «небесная».
- source_word: σοφία
  choice: мудрость
  rationale: Прямой и естественный эквивалент; здесь речь идёт о характере мудрости.
- source_word: πρῶτον μὲν
  choice: прежде всего
  rationale: Сохраняет указание на первенство чистоты в последующем перечислении и естественно звучит по-русски.
- source_word: ἁγνή
  choice: чиста
  rationale: Передаёт нравственную чистоту и цельность без более узкого оттенка целомудрия.
- source_word: ἔπειτα
  choice: затем
  rationale: Сохраняет последовательность признаков.
- source_word: εἰρηνική
  choice: миролюбива
  rationale: Выражает направленность к миру, а не просто спокойное состояние.
- source_word: ἐπιεικής
  choice: кротка
  rationale: Передаёт мягкость и незлобивую уступчивость; слово естественно для возвышенного, но понятного нравственного описания.
- source_word: εὐπειθής
  choice: готова прислушаться
  rationale: Редкое прилагательное обозначает восприимчивость к убеждению и отсутствие упрямства; формулировка не создаёт впечатления слепой покорности или доверчивости.
- source_word: μεστὴ ἐλέους
  choice: полна милосердия
  rationale: Прямо передаёт образ полноты и обилия.
- source_word: καρπῶν ἀγαθῶν
  choice: добрых плодов
  rationale: Сохраняет множественное число и метафору видимых добрых результатов.
- source_word: ἀδιάκριτος
  choice: беспристрастна
  rationale: В нравственном перечне и с учётом осуждения лицеприятия в Иак 2:1–4 это наиболее вероятное значение; реальная лексическая неоднозначность отмечена в сноске.
- source_word: ἀνυπόκριτος
  choice: нелицемерна
  rationale: Близко передаёт отсутствие притворства и сохраняет связь с образом лицемерия.
theological_decisions:
- issue: Толкование ἀδιάκριτος
  choice: беспристрастна
  alternative: недвойственна; неколебима, без сомнения
  rationale: 'Слово допускает социально-нравственное значение «не делающая различий, беспристрастная», но может быть связано также с внутренней нераздвоенностью или отсутствием сомнения. Контекст послания поддерживает обе смысловые линии: осуждение лицеприятия (2:1–4) и двоедушия/сомнения (1:6–8; 4:8). Основной текст следует наиболее естественному смыслу данного перечня, а альтернативы сохраняются в сноске.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского нравственного наставления. Краткие однородные определения сохраняют ритм греческого перечня; выражение «готова прислушаться» выбрано ради ясности для обычного читателя.
