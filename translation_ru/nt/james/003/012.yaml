  text: μὴ δύναται, ἀδελφοί μου, συκῆ ἐλαίας ποιῆσαι ἢ ἄμπελος σῦκα; ⸂οὔτε ἁλυκὸν⸃ γλυκὺ ποιῆσαι ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/012.yaml
  text: My brothers[a], can a fig tree produce olives[c][b], or a grapevine figs? Neither can salt water produce fresh water.
translation:
  language: ru
  text: Братья мои[a], разве смоковница может приносить маслины или виноградная лоза — смоквы? И солёная вода не может давать пресную воду[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Братья и сёстры мои». В греческом тексте стоит форма мужского рода «братья», которая может служить обращением к смешанной группе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сладкую воду». Последняя фраза в греческом тексте эллиптична; с учётом образа источника в предыдущем стихе её можно также понять так: «И солёный источник не может давать пресную воду».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί μου
  choice: Братья мои
  rationale: Сохраняет мужскую форму обращения в греческом тексте; в контексте послания она может относиться ко всей общине, что отмечено в сноске.
- source_word: μὴ δύναται
  choice: разве ... может
  rationale: Частица μή вводит риторический вопрос, предполагающий отрицательный ответ; русская конструкция с «разве» естественно передаёт этот оттенок.
- source_word: συκῆ
  choice: смоковница
  rationale: Обозначает дерево, а не плод; «смоковница» — точный и укоренённый в библейском русском языке эквивалент.
- source_word: ἐλαίας ποιῆσαι
  choice: приносить маслины
  rationale: В отношении плодового дерева ποιέω означает производить, приносить плод; «приносить» естественно по-русски.
- source_word: ἄμπελος
  choice: виноградная лоза
  rationale: Ясно обозначает именно лозу винограда и сохраняет сельскохозяйственный образ.
- source_word: σῦκα
  choice: смоквы
  rationale: Прямой эквивалент названия плодов смоковницы.
- source_word: οὔτε ἁλυκὸν
  choice: Не может и солёное
  rationale: Сохраняет эллиптичность греческого текста, где субстантивированное прилагательное означает «солёное»; контекст воды раскрывается сказуемым и дополнением.
- source_word: γλυκὺ ποιῆσαι ὕδωρ
  choice: давать пресную воду
  rationale: γλυκύς буквально значит «сладкий», но применительно к воде противопоставляет пресную воду солёной; «давать» естественно передаёт ποιέω в данном образе.
theological_decisions:
- issue: Референт эллиптического οὔτε ἁλυκὸν
  choice: Сохранить обобщённое «солёное»
  alternative: «солёный источник» или «солёная вода»
  rationale: 'Греческая фраза сжата и допускает восстановление существительного из ближайшего контекста: речь может идти о солёном источнике либо о солёной воде. Основной текст не устраняет эту неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой («смоковница», «маслины», «виноградная лоза»). Риторический вопрос передан естественной конструкцией с «разве»; эллиптичность заключительной фразы по возможности сохранена, а возможное восполнение пояснено в сноске.
