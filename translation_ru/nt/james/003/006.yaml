source:
  edition: SBLGNT
  text: καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ⸀ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: ru
  text: 'И язык — огонь. Среди наших членов язык оказывается миром неправедности: он оскверняет всё тело[a], воспламеняет круговорот жизни[b] и сам воспламеняется геенной[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также: «пятнает всё тело».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «колесо рождения»; возможные передачи: «течение жизни» или «круг жизни».'
    reason: lexical_alternative
  - marker: c
    text: Геенна — греческая передача семитского названия; традиционно переводится словом «ад».
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσα
  choice: язык
  rationale: Сохраняет конкретный образ части тела, проходящий через весь контекст, и одновременно естественно обозначает речь метонимически.
- source_word: πῦρ
  choice: огонь
  rationale: Кратко и выразительно передаёт именную метафору; в русском языке нулевой артикль естественен.
- source_word: ὁ κόσμος τῆς ἀδικίας
  choice: целый мир неправедности
  rationale: Сохраняет необычный и всеохватный образ греческого выражения, не сводя его просто к «злу»; «неправедность» передаёт широкое нравственное значение ἀδικία.
- source_word: καθίσταται ἐν τοῖς μέλεσιν ἡμῶν
  choice: занимает среди наших членов место
  rationale: Естественно по-русски передаёт положение и роль языка среди частей тела, не уточняя сверх текста, является ли форма средней или пассивной.
- source_word: σπιλοῦσα
  choice: оскверняет
  rationale: Передаёт нравственное загрязнение; образ пятна сохранён как допустимая более буквальная альтернатива в сноске.
- source_word: ὅλον τὸ σῶμα
  choice: всё тело
  rationale: Прямо сохраняет всеохватную силу ὅλον.
- source_word: φλογίζουσα
  choice: воспламеняет
  rationale: Сохраняет огненный образ и связь с последующим пассивным причастием.
- source_word: τὸν τροχὸν τῆς γενέσεως
  choice: круговорот жизни
  rationale: Передаёт образ вращающегося колеса и жизненного существования, оставаясь понятным современному читателю; буквальная странность выражения отмечена в сноске.
- source_word: φλογιζομένη
  choice: сама воспламеняется
  rationale: 'Сохраняет пассивность: язык поджигает другое, но его самого воспламеняет внешний источник.'
- source_word: ὑπὸ τῆς γεέννης
  choice: от геенны
  rationale: Сохраняет конкретный греческий термин γέεννα, не заменяя его без пояснения более широким богословским словом «ад».
theological_decisions:
- issue: Передача γέεννα
  choice: геенна
  alternative: ад
  rationale: Транслитерация сохраняет историческую и понятийную конкретность исходного слова; традиционная интерпретирующая передача дана в сноске.
- issue: Передача τὸν τροχὸν τῆς γενέσεως
  choice: круговорот жизни
  alternative: колесо рождения; течение жизни
  rationale: Выбранная формулировка удерживает образ круга/колеса и вероятный смысл всей человеческой жизни, не связывая выражение с учением о перевоплощении и не устраняя трудность исходной метафоры без сноски.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис сделан ясным для обычного читателя, при этом сохранены напряжённая огненная образность, повтор глагола «воспламенять» и необычность ключевых метафор.
