  text: ἰδοὺ καὶ τὰ πλοῖα, τηλικαῦτα ὄντα καὶ ὑπὸ ⸂ἀνέμων σκληρῶν⸃ ἐλαυνόμενα, μετάγεται ὑπὸ ἐλαχίστου πηδαλίου ὅπου ⸂ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/004.yaml
  text: 'Look also at the ships: though they are so large and are driven by strong winds[a], they are steered by a very small rudder wherever the inclination of the one steering wills.'
translation:
  language: ru
  text: 'Посмотрите и на корабли: хотя они так велики и их гонят сильные ветры, совсем небольшой руль направляет их туда, куда пожелает рулевой[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «куда желает устремление управляющего».'
    reason: Сноска сохраняет необычное выражение ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται, которое в основном тексте передано естественной русской формулировкой.
lexical_decisions:
- source_word: ἰδοὺ καὶ τὰ πλοῖα
  choice: Посмотрите и на корабли
  rationale: ἰδού передано современным призывом обратить внимание, а καί обозначает второй, параллельный предыдущему пример.
- source_word: τηλικαῦτα ὄντα
  choice: хотя они так велики
  rationale: Сохранены подчёркнутая величина кораблей и подразумеваемое контекстом уступительное противопоставление малому рулю.
- source_word: ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα
  choice: их гонят сильные ветры
  rationale: σκληρός применительно к ветрам естественно означает «сильный, суровый»; действительная русская конструкция ясно и живо передаёт греческий пассив.
- source_word: μετάγεται
  choice: направляет их
  rationale: В сочетании с πηδάλιον глагол означает изменение или задание курса. Единственное число греческого сказуемого при среднем роде множественного числа τὰ πλοῖα в русском закономерно передано множественным объектом при «руль направляет».
- source_word: ὑπὸ ἐλαχίστου πηδαλίου
  choice: совсем небольшой руль
  rationale: ἐλάχιστος усиливает контраст размеров; «совсем небольшой» естественнее по-русски, чем буквальное превосходное «самый малый», и не создаёт ложного абсолютного сравнения.
- source_word: ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: туда, куда пожелает рулевой
  rationale: Передан смысл направления согласно намерению управляющего кораблём. Необычная буквальная структура с ὁρμή разъясняется в сноске, чтобы основной текст оставался ясным и современным.
theological_decisions:
- issue: Степень буквальности в описании воли управляющего
  choice: «туда, куда пожелает рулевой» с буквальным пояснением в сноске
  alternative: «куда желает устремление управляющего»
  rationale: 'Греческая фраза грамматически необычна: субъектом βούλεται выступает ὁρμή («порыв, стремление, устремление») управляющего. Буквальная калька по-русски затемняет простой образ, поэтому смысл дан естественно, а лексическая особенность сохранена в сноске без навязывания богословского истолкования.'
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным тоном. Морской термин «рулевой» понятен широкому читателю и естественно передаёт субстантивированное τοῦ εὐθύνοντος; синтаксис подчёркивает контраст огромного корабля и малого руля.
