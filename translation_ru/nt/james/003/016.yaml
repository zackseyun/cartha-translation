id: JAS.3.16
reference: James 3:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/016.yaml
  text: For where jealousy and selfish ambition are[b][a], there is disorder and every vile practice.
translation:
  language: ru
  text: Ведь где зависть[a] и своекорыстие, там неустройство и всякое дурное дело[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ревность». Греческое слово может также означать «рвение», но здесь контекст придаёт ему явно отрицательный смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всякий злой поступок»; буквально: «всякое дурное дело».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: где
  rationale: В паре с ἐκεῖ естественно образует обобщающую конструкцию «где… там…».
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предыдущей мыслью и естественно звучит в современном русском.
- source_word: ζῆλος
  choice: зависть
  rationale: Контекст 3:14–15 требует отрицательного значения; «зависть» ясно передаёт порок, тогда как буквальное «рвение» могло бы быть понято положительно.
- source_word: ἐριθεία
  choice: своекорыстие
  rationale: Передаёт эгоистическое стремление к личной выгоде и первенству, не сужая значение до одной лишь партийной распри.
- source_word: ἐκεῖ
  choice: там
  rationale: Сохраняет параллельную афористическую структуру «где… там…».
- source_word: ἀκαταστασία
  choice: неустройство
  rationale: Обозначает нарушенность порядка, смятение и нестабильность в общине; «неустройство» сохраняет широту значения.
- source_word: πᾶν
  choice: всякое
  rationale: Естественно согласуется в русском с существительным единственного числа «дело».
- source_word: φαῦλον
  choice: дурное
  rationale: Передаёт отрицательную нравственную оценку без чрезмерного усиления; возможны также «злое» и «низкое».
- source_word: πρᾶγμα
  choice: дело
  rationale: В данном нравственном контексте обозначает поступок или деятельность; «дело» близко к форме оригинала и естественно по-русски.
theological_decisions:
- issue: Нравственная окраска ζῆλος
  choice: Отрицательное значение «зависть»
  alternative: «ревность» или нейтральное/положительное «рвение»
  rationale: Ближайший контекст прямо связывает ζῆλος со своекорыстием и земной, недуховной мудростью, поэтому положительное значение здесь исключается; при этом примечание сохраняет лексическую многозначность.
- issue: Характер последствий порочной мудрости
  choice: «неустройство и всякое дурное дело»
  alternative: «смятение и всякая злая практика»
  rationale: Перевод не ограничивает ἀκαταστασία внутренним замешательством и не превращает πρᾶγμα в специальный термин; речь остаётся о социальном беспорядке и разнообразных дурных поступках.
translation_notes:
  register: Современный литературный русский, сжатый афористический строй. «Ведь» сохраняет пояснительную функцию γὰρ; парная конструкция «где… там…» воспроизводит синтаксис оригинала. Лексика понятна широкому читателю и сохраняет нравственную силу текста без конфессиональных уточнений.
