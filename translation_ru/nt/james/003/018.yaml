  yaml_path: translation/nt/james/003/018.yaml
  text: And the fruit of righteousness is sown in peace by those who make peace[a][b].
translation:
  language: ru
  text: И плод праведности сеется в мире теми, кто устанавливает мир[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плод справедливости». Греческое слово может обозначать как нравственную праведность, так и справедливость в отношениях между людьми и в правовой сфере.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для тех, кто устанавливает мир». Греческий дательный падеж допускает оба понимания, хотя при страдательном глаголе более вероятно значение «теми, кто устанавливает мир».'
    reason: alternative_reading
lexical_decisions:
- source_word: καρπὸς
  choice: плод
  rationale: Сохраняет образ посева и плодоношения, а также наиболее прямо передаёт греческое существительное в единственном числе.
- source_word: δὲ
  choice: И
  rationale: Здесь частица служит мягкой связкой с предыдущей мыслью, а не выражает резкое противопоставление.
- source_word: δικαιοσύνης
  choice: праведности
  rationale: Передаёт нравственный смысл δικαιοσύνη и сохраняет неоднозначность связи между плодом и праведностью; возможный оттенок справедливости отмечен в сноске.
- source_word: ἐν εἰρήνῃ
  choice: в мире
  rationale: Близко следует греческому выражению и допускает понимание мира как обстановки или образа совершения посева.
- source_word: σπείρεται
  choice: сеется
  rationale: Естественно передаёт настоящее время и страдательный залог, сохраняя земледельческий образ.
- source_word: τοῖς ποιοῦσιν εἰρήνην
  choice: теми, кто устанавливает мир
  rationale: Творительный оборот естественно выражает исполнителя действия при страдательном глаголе. «Устанавливает мир» передаёт ποιέω + εἰρήνην без двусмысленного русского выражения «создаёт мир».
theological_decisions:
- issue: Смысл выражения «плод праведности»
  choice: Сохранено буквальное сочетание без уточнения, является ли праведность содержанием, качеством или результатом плода.
  alternative: «Урожай, состоящий в праведности» или «плод, ведущий к праведности».
  rationale: Родительный падеж δικαιοσύνης допускает несколько тесно связанных толкований; контекст указывает на нравственный плод небесной мудрости и мирного поведения, но не требует устранять грамматическую неоднозначность.
- issue: Значение дательного оборота τοῖς ποιοῦσιν εἰρήνην
  choice: 'Исполнитель действия: «теми, кто устанавливает мир».'
  alternative: 'Получатель или заинтересованная сторона: «для тех, кто устанавливает мир».'
  rationale: При страдательном σπείρεται понимание дательного как обозначения действующего лица уместно, однако иной синтаксический разбор остаётся возможным и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и земледельческого образа оригинала. Повтор слова «мир» намеренно сохранён, поскольку он связывает обстановку посева с деятельностью миротворцев.
