  text: μήτι ἡ πηγὴ ἐκ τῆς αὐτῆς ὀπῆς βρύει τὸ γλυκὺ καὶ τὸ πικρόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/003/011.yaml
  text: Does a spring pour out both sweet and bitter water from the same opening?[a]
translation:
  language: ru
  text: Разве из одного и того же отверстия источника течёт и сладкая, и горькая вода?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Разве источник из одного и того же отверстия изливает сладкое и горькое?»'
    reason: Лексическая альтернатива сохраняет субстантивированные прилагательные и более сильное значение глагола βρύει.
lexical_decisions:
- source_word: μήτι
  choice: разве
  rationale: Частица вводит риторический вопрос, предполагающий отрицательный ответ; «разве» естественно передаёт эту силу в современном русском языке.
- source_word: ἡ πηγή
  choice: источник
  rationale: В данном образе слово обозначает природный источник воды; русский эквивалент точен и стилистически естественен.
- source_word: ἐκ τῆς αὐτῆς ὀπῆς
  choice: из одного и того же отверстия источника
  rationale: ὀπή обозначает отверстие или выход. Добавление «источника» ясно связывает отверстие с водным источником и не вводит метафорического «устья», отсутствующего в греческом тексте.
- source_word: βρύει
  choice: течёт
  rationale: Глагол описывает истечение или биение воды. «Течёт» звучит естественно, тогда как более буквальное «извергает» в этом контексте было бы тяжеловесным.
- source_word: τὸ γλυκὺ καὶ τὸ πικρόν
  choice: и сладкая, и горькая вода
  rationale: Субстантивированные прилагательные относятся к воде; существительное «вода» выражено один раз для ясности и естественности, сохраняя буквальный контраст сладкого и горького.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; риторический вопрос передан частицей «разве». Формулировка сохраняет наглядный образ источника и отрицательное ожидание вопроса без излишней архаизации.
