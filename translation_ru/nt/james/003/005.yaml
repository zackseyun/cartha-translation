  source_fidelity: 'В целом образ и синтаксическое сопоставление переданы верно: язык назван небольшой частью тела, его хвастовство сохранено, а затем следует образ огня и леса. Однако «хвалится великим» не является естественным современным русским управлением и недостаточно ясно передаёт μεγάλα αὐχεῖ. «Хвастается великим» точнее сохраняет намеренную широту греческого выражения. Передача ἡλίκον как «небольшой» контекстуально обоснована, но альтернативное восклицательное понимание следует оставить в сноске.'
