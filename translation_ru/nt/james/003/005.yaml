lexical_decisions:
- source_word: γλῶσσα
  choice: язык
  rationale: Сохраняет конкретный образ части тела и одновременно естественно обозначает речь в русском языке.
- source_word: μικρὸν μέλος
  choice: небольшая часть тела
  rationale: Передаёт телесный образ ясно и естественно; буквальное «малый член» в современном русском двусмысленно и менее удачно.
- source_word: μεγάλα αὐχεῖ
  choice: хвалится великим
  rationale: 'Сохраняет краткость и некоторую смысловую открытость греческого выражения: язык может похваляться великими делами, притязаниями или возможностями.'
- source_word: Ἰδοὺ
  choice: Посмотрите
  rationale: Современный и выразительный призыв обратить внимание на последующий образ.
- source_word: ἡλίκον πῦρ
  choice: какой малый огонь
  rationale: Контекст подчёркивает несоразмерность малой причины и большого последствия, в соответствии с образом языка как небольшой части тела; возможное восклицательное понимание отмечено в сноске.
- source_word: ἡλίκην ὕλην
  choice: какой большой лес
  rationale: В данном образе ὕλη естественно понимается как лес или масса горючей древесины; «лес» создаёт ясную и привычную картину.
- source_word: ἀνάπτει
  choice: поджигает
  rationale: Ясно и живо передаёт действие огня, от которого загорается большая масса горючего материала.
