  terminology: «Язык» удачно сохраняет телесный образ γλῶσσα. «Часть тела» — безопасная современная передача μέλος. Для αὐχεῖ предпочтительно «хвастается», а не «хвалится». «Лес» — допустимый основной вариант для ὕλη; в сноске нужно точнее обозначить возможные значения «древесина» и «горючий материал», не приравнивая слово безоговорочно к «чаще».
