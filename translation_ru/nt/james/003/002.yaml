source:
  edition: SBLGNT
  text: πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/002.yaml
  text: For we all stumble in many ways[a]. If anyone does not stumble in word, this one is a mature man[c][b], able also to bridle the whole body.
translation:
  language: ru
  text: Ведь все мы во многом спотыкаемся. Кто не спотыкается в слове[a], тот — зрелый человек[b][c], способный обуздать и всё тело.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в слове», то есть в речи, в том, что человек говорит.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «совершенный человек». Греческое τέλειος может означать «совершенный», «цельный» или «зрелый»; здесь, вероятно, имеется в виду нравственная зрелость, а не абсолютная безгрешность.'
    reason: lexical_alternative
  - marker: c
    text: В греческом стоит ἀνήρ — «мужчина, муж»; здесь слово употреблено в общем, репрезентативном смысле.
    reason: cultural_note
lexical_decisions:
- source_word: πολλὰ
  choice: много
  rationale: В сочетании с πταίομεν форма имеет наречное значение и допускает оттенки «во многом» и «часто». Русское «много согрешаем» естественно передаёт широту и повторяемость проступков, не превращая πολλὰ в прямое дополнение.
- source_word: γὰρ
  choice: ведь
  rationale: Частица обосновывает предыдущее предостережение; «ведь» естественно сохраняет пояснительно-причинную связь.
- source_word: πταίομεν / πταίει
  choice: согрешаем / согрешает
  rationale: В данном нравственном контексте метафорическое πταίω означает допускать проступок, ошибаться нравственно. «Согрешать» ясно передаёт этический смысл; буквальное «спотыкаться» в современном русском здесь может восприниматься прежде всего физически.
- source_word: ἅπαντες
  choice: все мы
  rationale: Сохраняет эмфатическую всеохватность и само-включение автора.
- source_word: εἴ τις
  choice: кто
  rationale: Русская обобщённо-условная конструкция «кто не…, тот…» естественно соответствует греческому «если кто» и сохраняет универсальное применение.
- source_word: ἐν λόγῳ
  choice: в слове
  rationale: Формально близко передаёт компактное греческое выражение, означающее речь или сказанное; смысл поясняется в сноске.
- source_word: οὗτος
  choice: тот
  rationale: В парной русской конструкции «кто…, тот…» указательное местоимение сохраняет выделяющую силу οὗτος.
- source_word: τέλειος
  choice: зрелый
  rationale: В контексте Иакова слово указывает на нравственную зрелость и цельность; «совершенный» могло бы ошибочно внушать абсолютную безгрешность.
- source_word: ἀνήρ
  choice: человек
  rationale: Хотя ἀνήρ имеет мужскую форму и может означать мужчину, здесь оно входит в общее изречение после εἴ τις и имеет репрезентативное значение. «Человек» естественно передаёт общую применимость без утверждения, что речь только о мужчинах.
- source_word: δυνατὸς
  choice: способный
  rationale: Прямо выражает способность к самоуправлению.
- source_word: χαλιναγωγῆσαι
  choice: обуздать
  rationale: Сохраняет образ узды, который развивается в следующих стихах, и при этом идиоматично звучит по-русски.
- source_word: καὶ
  choice: и
  rationale: 'Передаёт присоединение: умеющий владеть речью способен управлять также всем телом; по-русски добавочное значение ясно из конструкции.'
- source_word: ὅλον τὸ σῶμα
  choice: всё тело
  rationale: Прямо сохраняет целостность объекта и телесный образ исходного текста.
theological_decisions:
- issue: Значение τέλειος в этическом контексте
  choice: зрелый, то есть нравственно цельный
  alternative: совершенный
  rationale: Непосредственное признание «все мы много согрешаем» не позволяет без пояснения понимать τέλειος как абсолютную безгрешность. Перевод «зрелый» сохраняет мысль о достигнутой нравственной цельности, а сноска отмечает более буквальную альтернативу.
- issue: Образный или прямой перевод πταίω
  choice: согрешать
  alternative: спотыкаться
  rationale: Глагол сохраняет образ спотыкания, но в данном контексте обозначает нравственный проступок. Русское «согрешать» ясно выражает этическую силу высказывания, хотя часть исходной метафоры становится менее явной.
- issue: Репрезентативное ἀνήρ
  choice: человек с общим значением
  alternative: муж / мужчина
  rationale: Условное εἴ τις имеет всеобщий характер, поэтому ἀνήρ здесь не ограничивает утверждение взрослыми мужчинами. «Человек» передаёт референтный охват; мужская форма оригинала отмечена в сноске.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Синтаксис «кто…, тот…» делает обобщённое условие естественным. Метафора узды сохранена словом «обуздать»; «в слове» оставлено в основном тексте с пояснением. Маркеры сносок размещены непосредственно после соответствующих выражений.
