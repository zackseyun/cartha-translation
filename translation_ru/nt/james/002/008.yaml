  text: Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/james/002/008.yaml
  text: If[a], however, you are fulfilling the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well.
translation:
  language: ru
  text: 'Если же вы исполняете царский[a] закон по Писанию: «Люби ближнего твоего, как самого себя», — то поступаете хорошо.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «закон Царя» либо «закон царства». Греческое выражение буквально означает «царский закон» и может указывать как на его царский источник, так и на его высшее положение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μέντοι
  choice: Если же
  rationale: Сочетание сохраняет условный смысл εἰ и мягкий оттенок противопоставления или уточнения, выраженный μέντοι; формулировка естественна для современного русского языка.
- source_word: νόμον ... βασιλικὸν
  choice: царский закон
  rationale: Прилагательное βασιλικός буквально характеризует закон как царский. Перевод не решает однозначно, имеется ли в виду его источник, принадлежность царству или высшее положение среди заповедей.
- source_word: τελεῖτε
  choice: исполняете
  rationale: Глагол τελέω здесь означает осуществлять или исполнять требование; настоящее время передано настоящим временем русского глагола.
- source_word: κατὰ τὴν γραφήν
  choice: по Писанию
  rationale: Кратко и естественно передаёт соответствие сказанному в Писании и вводит следующую цитату, сохраняя единственное число γραφή.
- source_word: Ἀγαπήσεις
  choice: Люби
  rationale: Будущая форма в греческой библейской цитате имеет силу повеления. Русское повелительное наклонение ясно и естественно передаёт эту функцию без ненужной архаизации.
- source_word: τὸν πλησίον σου
  choice: ближнего твоего
  rationale: «Ближний» — точный и устойчивый библейский эквивалент πλησίον; порядок слов сохраняет достоинство цитатного стиля и остаётся понятным.
- source_word: ὡς σεαυτόν
  choice: как самого себя
  rationale: Передаёт краткое греческое сравнение без пояснительного добавления отсутствующего в исходном тексте глагола.
- source_word: καλῶς ποιεῖτε
  choice: поступаете хорошо
  rationale: Фраза утверждает правильность действия и естественно передаёт настоящее время и оценочный смысл греческого выражения.
theological_decisions:
- issue: Смысл выражения «царский закон»
  choice: Сохранено буквальное и многозначное выражение «царский закон».
  alternative: «закон Царя», «закон царства» или «высший закон»
  rationale: Греческое βασιλικός допускает связь с царём, царством или превосходящим статусом закона. Основной текст не сводит эту смысловую широту к одному богословскому толкованию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным регистром. Формулировка библейской цитаты сохраняет традиционное слово «ближний», избегая излишней архаики.
