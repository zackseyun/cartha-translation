  text: θέλεις δὲ γνῶναι, ὦ ἄνθρωπε κενέ, ὅτι ἡ πίστις χωρὶς τῶν ἔργων ⸀ἀργή ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/020.yaml
  text: But do you want to know[a], O foolish man[b], that faith apart from works is useless?
translation:
  language: ru
  text: Но хочешь ли ты знать, пустой человек[a], что вера без дел бездейственна[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также можно перевести: «неразумный человек». Буквально: «пустой человек».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бесполезна», «праздна», «не приносит плода». Греческое слово обозначает бездействующее или не дающее результата.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις δὲ γνῶναι
  choice: Но хочешь ли ты знать
  rationale: Сохраняет значение волеизъявления в θέλεις, прямое значение γνῶναι и противопоставительный оттенок δέ; вопросительная форма естественна по-русски.
- source_word: ὦ ἄνθρωπε κενέ
  choice: пустой человек
  rationale: Передаёт единственное число и обращение, а также сохраняет конкретный образ κενός — «пустой», не заменяя его без пояснения более толковательным «неразумный».
- source_word: ὅτι
  choice: что
  rationale: Вводит содержание того, что собеседнику следует знать.
- source_word: ἡ πίστις
  choice: вера
  rationale: Стандартный и наименее толковательный эквивалент πίστις в рассуждении Иакова.
- source_word: χωρὶς τῶν ἔργων
  choice: без дел
  rationale: Кратко и естественно передаёт отсутствие дел, о котором говорит χωρίς с родительным падежом.
- source_word: ἀργή ἐστιν
  choice: бездейственна
  rationale: Передаёт значение бездействия и отсутствия результата, свойственное ἀργός, и звучит естественно в сочетании со словом «вера».
theological_decisions:
- issue: Соотношение веры и дел в аргументе Иакова
  choice: Вера без дел названа «бездейственной».
  alternative: «Бесполезна», «праздна» или более сильное «мертва».
  rationale: ἀργή означает бездействующую, не дающую результата; здесь не употреблено νεκρά («мертва»). Перевод сохраняет формулировку и напряжение самого стиха, не подменяя их конфессиональным истолкованием или языком соседних стихов.
translation_notes:
  register: Современный литературный русский язык с сохранением прямого, обличительного обращения. Необычный образ «пустой человек» оставлен в основном тексте ради точности и пояснён в сноске; «бездейственна» сочетает ясность с близостью к значению греческого слова.
