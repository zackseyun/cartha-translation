source:
  edition: SBLGNT
  text: βλέπεις ὅτι ἡ πίστις συνήργει τοῖς ἔργοις αὐτοῦ καὶ ἐκ τῶν ἔργων ἡ πίστις ἐτελειώθη,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/022.yaml
  text: You see that faith was working together with his works[b][a], and by the works faith was brought to completion.
translation:
  language: ru
  text: Ты видишь, что вера[a] действовала вместе с его делами и через дела вера была доведена до полноты[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верность» или «доверие».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «была усовершенствована» или «стала полной»; греческий глагол может означать достижение предназначенной цели, полноты или зрелости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπεις
  choice: Ты видишь
  rationale: Форма второго лица единственного числа передана как прямое риторическое обращение, сохраняющее ход рассуждения Иакова.
- source_word: πίστις
  choice: вера
  rationale: Основное и традиционно понятное соответствие в данном контексте; оно не предрешает спор о соотношении веры и дел. Возможные оттенки отмечены в сноске.
- source_word: συνήργει
  choice: действовала вместе с
  rationale: Передаёт значение совместного действия и длительный характер имперфекта, не сводя дела лишь к внешнему свидетельству веры.
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: с его делами
  rationale: Предлог «с» естественно передаёт дательный падеж при συνεργέω; «дела» сохраняет ключевую лексику рассуждения Иакова.
- source_word: ἐκ τῶν ἔργων
  choice: через дела
  rationale: В контексте ἐκ указывает на средство или источник достижения полноты; «через» звучит естественно и сохраняет причинно-инструментальную связь.
- source_word: ἐτελειώθη
  choice: была доведена до полноты
  rationale: Пассивная конструкция сохраняет форму греческого глагола и идею достижения назначенной цели или зрелости, не внушая непременно нравственной безупречности.
theological_decisions:
- issue: Соотношение веры и дел в рассуждении Иакова
  choice: Сохранено утверждение, что вера действовала вместе с делами и через дела была доведена до полноты.
  alternative: Пояснить, что дела лишь показывают веру людям, либо определить их как необходимое условие оправдания.
  rationale: Сам греческий текст утверждает совместное действие и достижение полноты, но не излагает здесь законченную систему учения об оправдании; перевод не должен устранять эту богословскую напряжённость.
- issue: Значение πίστις
  choice: вера
  alternative: верность; доверие
  rationale: «Вера» лучше всего соответствует непосредственному контексту Иакова 2 и сохраняет связь с окружающим рассуждением, тогда как допустимые смысловые оттенки вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык; обращение на «ты» передаёт форму единственного числа. Синтаксис сохраняет параллелизм греческой фразы и повтор слова «вера», а ключевые богословские термины переданы без конфессионального истолкования.
