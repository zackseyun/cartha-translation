  source_fidelity: 'Текст точно передаёт греческий оригинал: βλέπεις — «Ты видишь», имперфект συνήργει — «действовала вместе с», дательный τοῖς ἔργοις αὐτοῦ — «с его делами», а ἐκ τῶν ἔργων и аористный пассив ἐτελειώθη — «через дела ... была доведена до полноты». Повтор слова «вера» сохранён, как в оригинале.'
  naturalness: Фраза звучит естественно в современном литературном русском. «Действовала вместе с его делами» несколько формально, но уместно для аргументативного, богословского регистра и хорошо сохраняет смысл συνεργέω. Обращение на «ты» соответствует единственному числу греческого текста.
  terminology: «Вера» и «дела» сохраняют терминологическую связность с контекстом Иакова и не навязывают конфессионального толкования. «Доведена до полноты» удачно передаёт τελειόω как достижение полноты/цели, не обязательно подразумевая предшествующее нравственное несовершенство. Сноски корректно отражают лексические альтернативы; якоря расположены при соответствующих словах.
