  text: οὕτως καὶ ἡ πίστις, ἐὰν μὴ ⸂ἔχῃ ἔργα⸃, νεκρά ἐστιν καθ’ ἑαυτήν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/017.yaml
  text: So also faith[a], if it does not have works, is dead by itself.
translation:
  language: ru
  text: Так и вера[a], если не имеет дел, мертва сама по себе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доверие»; менее вероятно здесь: «верность». Греческое слово πίστις может иметь эти значения, но в рассуждении Иакова в этом стихе лучше всего подходит «вера».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Так и
  rationale: Кратко и естественно передаёт сопоставление с предшествующим примером и сохраняет ход рассуждения.
- source_word: ἡ πίστις
  choice: вера
  rationale: В контексте Иакова речь идёт об исповедуемой вере; вариант «вера» лучше всего сохраняет как основной смысл, так и богословское напряжение отрывка.
- source_word: ἐὰν μὴ ἔχῃ
  choice: если не имеет
  rationale: Прозрачно передаёт условную конструкцию ἐὰν μή с настоящим сослагательным наклонением без смыслового усиления.
- source_word: ἔργα
  choice: дел
  rationale: «Дела» сохраняет устойчивую лексическую связь со всем рассуждением Иакова 2 и не сужает значение до отдельного вида поступков.
- source_word: νεκρά
  choice: мертва
  rationale: Передаёт резкий метафорический предикат оригинала без смягчения.
- source_word: καθ’ ἑαυτήν
  choice: сама по себе
  rationale: Естественно по-русски выражает веру, рассматриваемую отдельно, без дел.
theological_decisions:
- issue: Передача πίστις в контексте спора о вере и делах
  choice: вера
  alternative: доверие; верность
  rationale: «Вера» точнее соответствует аргументу Иакова и не разрешает заранее богословское напряжение между верой и делами. Лексически возможные оттенки отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Сохранены традиционные термины «вера» и «дела», важные для лексической связности главы.
