source:
  edition: SBLGNT
  text: σὺ πιστεύεις ὅτι ⸂εἷς ἐστιν ὁ θεός⸃; καλῶς ποιεῖς· καὶ τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/019.yaml
  text: You believe that God is one[a]; you do well[b]. Even the demons believe—and shudder.
translation:
  language: ru
  text: Ты веришь, что Бог един[a]. Хорошо делаешь. Даже бесы верят — и содрогаются[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что есть один Бог». Греческую фразу можно понять и так; «Бог един» ближе следует её построению и, возможно, перекликается с еврейским исповеданием веры в единого Бога.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «трепещут».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: Ты
  rationale: Единственное число и прямое обращение сохранены; явное местоимение передаёт греческое смысловое выделение адресата.
- source_word: πιστεύεις
  choice: веришь
  rationale: Глагол вводит содержание убеждения через ὅτι; «веришь» естественно по-русски и позволяет сохранить повтор с πιστεύουσιν.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание веры и прямо соответствует русской конструкции «верить, что…».
- source_word: εἷς ἐστιν ὁ θεός
  choice: Бог един
  rationale: Формулировка близка к греческой предикативной конструкции и сохраняет возможный отзвук иудейского исповедания единства Бога, не превращая его без необходимости в утверждение существования.
- source_word: καλῶς ποιεῖς
  choice: Хорошо делаешь
  rationale: Краткое, естественное и достаточно буквальное выражение, сохраняющее риторическую похвалу перед последующим резким сопоставлением.
- source_word: καὶ
  choice: И
  rationale: Повтор «и… и…» прямо воспроизводит два καί и по-русски подчёркивает, что одной такой веры недостаточно; перевод «даже» также возможен, но несколько явнее истолковывает восходящую силу первого καί.
- source_word: τὰ δαιμόνια
  choice: бесы
  rationale: «Бесы» — устойчивый, понятный и точный русский эквивалент δαιμόνια; «злые духи» было бы пояснительным переводом.
- source_word: πιστεύουσιν
  choice: верят
  rationale: Повтор того же русского корня сохраняет центральное для аргумента сопоставление с «ты веришь».
- source_word: φρίσσουσιν
  choice: содрогаются
  rationale: Передаёт сильную телесную реакцию ужаса, выраженную φρίσσω; «трепещут» возможно, но в современном русском звучит более традиционно и допускает более широкий оттенок благоговения.
theological_decisions:
- issue: Передача исповедания εἷς ἐστιν ὁ θεός
  choice: Бог един
  alternative: есть один Бог
  rationale: Выбранная формулировка следует строю греческой фразы и сохраняет возможную связь с исповеданием единства Бога. Альтернатива грамматически допустима, но переносит акцент на существование одного Бога.
- issue: Сопоставление человеческой и бесовской веры
  choice: И бесы верят — и содрогаются
  alternative: Даже бесы верят и трепещут
  rationale: 'Лексический повтор «веришь / верят» сохранён, а тире усиливает риторический поворот без добавления нового смысла. Формулировка оставляет напряжение текста: правильное убеждение само по себе не исчерпывает подлинной веры.'
translation_notes:
  register: Современный литературный русский язык; прямое обращение на «ты» соответствует единственному числу оригинала. Сохранены краткость, повтор «веришь / верят» и резкий риторический переход. Архаизирующее «трепещут» заменено более однозначным современным «содрогаются».
