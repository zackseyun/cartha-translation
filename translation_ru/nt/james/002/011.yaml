reference: James 2:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰπών Μὴ ⸀μοιχεύσῃς εἶπεν καί Μὴ ⸀φονεύσῃς· εἰ δὲ οὐ ⸂μοιχεύεις φονεύεις⸃ δέ, γέγονας παραβάτης νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/011.yaml
  text: For he who said, “Do not commit adultery,” also said, “Do not murder.” Now if you do not commit adultery but do murder, you have become a transgressor of the law.
translation:
  language: ru
  text: 'Ведь тот, кто сказал: «Не прелюбодействуй», сказал также: «Не совершай убийства». Если ты не прелюбодействуешь, но совершаешь убийство, то стал нарушителем Закона.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... εἰπών
  choice: Тот, Кто сказал
  rationale: Субстантивированное причастие указывает на давшего заповеди Бога, но перевод не добавляет прямо отсутствующее в греческом тексте имя «Бог». Написание местоимения с прописной буквы естественно обозначает божественного Говорящего в русском библейском тексте.
- source_word: Μὴ μοιχεύσῃς
  choice: Не прелюбодействуй
  rationale: Устойчивая и понятная русская формулировка заповеди; точно передаёт запрет прелюбодеяния и сохраняет связь с Декалогом.
- source_word: καί
  choice: также
  rationale: Подчёркивает, что обе заповеди исходят от одного и того же Говорящего, сохраняя ход аргумента.
- source_word: Μὴ φονεύσῃς
  choice: Не убивай
  rationale: Это узнаваемая русская формулировка заповеди. В данном контексте φονεύω означает противоправное лишение человека жизни, а не всякое умерщвление вообще; контекст заповеди удерживает это значение.
- source_word: εἰ δὲ
  choice: И если
  rationale: Естественно вводит условное применение сказанного; союз δέ здесь обозначает переход и контраст внутри условия, не требуя резкого «но» в начале фразы.
- source_word: οὐ μοιχεύεις ... φονεύεις δέ
  choice: ты не прелюбодействуешь, но убиваешь
  rationale: Настоящее время передано как общий условный случай, а «но» ясно выражает контраст, обозначенный δέ.
- source_word: γέγονας
  choice: стал
  rationale: 'Передаёт совершившееся изменение состояния: нарушив заповедь, человек оказался и остаётся преступником закона. Русское «стал» естественнее буквального «сделался».'
- source_word: παραβάτης νόμου
  choice: преступником закона
  rationale: Сохраняет юридико-нравственный смысл παραβάτης — того, кто переступил установленную норму, — и относит нарушение ко всему закону, а не только к одной заповеди.
theological_decisions:
- issue: Кто произнёс заповеди
  choice: «Тот, Кто сказал» без добавления имени «Бог»
  alternative: «Бог, сказавший»
  rationale: Из контекста ясно, что Говорящий — Бог, однако греческий текст использует субстантивированное причастие и не называет Его прямо. Перевод сохраняет эту форму и не вносит пояснение в основной текст.
- issue: Объём нарушения закона
  choice: «преступником закона»
  alternative: «нарушителем этой заповеди»
  rationale: 'Иаков говорит о законе как едином целом: нарушение одной заповеди делает человека преступником закона. Более узкий вариант ослабил бы смысл аргумента.'
- issue: Смысл запрета Μὴ φονεύσῃς
  choice: «Не убивай» в узнаваемой форме заповеди
  alternative: «Не совершай убийства»
  rationale: Традиционная русская формулировка сохраняет прямую связь с Декалогом. Глагол φονεύω в контексте означает убийство человека, а не безусловный запрет всякого лишения жизни.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Формулировки заповедей оставлены краткими и узнаваемыми; синтаксис прост и пригоден для публичного чтения.
