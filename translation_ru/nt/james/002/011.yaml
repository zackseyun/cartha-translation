revisions:
- from: 'Ведь Тот, Кто сказал: «Не прелюбодействуй», сказал также: «Не убивай». И если ты не прелюбодействуешь, но убиваешь, то стал преступником закона.'
  to: 'Ведь тот, кто сказал: «Не прелюбодействуй», сказал также: «Не совершай убийства». Если ты не прелюбодействуешь, но совершаешь убийство, то стал нарушителем Закона.'
  rationale: 'Исправлены две лексические неточности, существенные для современного восприятия: φονεύω передано как «совершать убийство», а παραβάτης νόμου — как «нарушитель Закона». Сохранены совершенный результативный оттенок γέγονας («стал»), условный характер настоящих форм и отсутствие прямо названного субъекта заповедей.'
