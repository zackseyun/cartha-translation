  text: ὅστις γὰρ ὅλον τὸν νόμον ⸂τηρήσῃ, πταίσῃ⸃ δὲ ἐν ἑνί, γέγονεν πάντων ἔνοχος.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/010.yaml
  text: For whoever keeps the whole law but stumbles in one point has become guilty of all of it[a][b].
translation:
  language: ru
  text: Ибо тот, кто соблюдает весь Закон, но спотыкается в чём-то одном[a], оказывается виновным во всём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «спотыкается в одном»; то есть допускает проступок в чём-то одном или нарушает одно предписание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «становится ответственным за всё». Речь о виновности по отношению ко всему Закону, а не обязательно о том, что человек совершил каждое отдельное нарушение.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅστις
  choice: кто
  rationale: Неопределённо-относительное местоимение вводит общее правило; русская конструкция «кто... тот» естественно передаёт универсальный смысл.
- source_word: γὰρ
  choice: ибо
  rationale: Союз вводит обоснование предыдущей мысли; «ибо» сохраняет логическую связь и соответствует достоинству литературного библейского регистра.
- source_word: ὅλον τὸν νόμον
  choice: весь закон
  rationale: Передаёт полноту, выраженную ὅλον, ясно и без смыслового расширения.
- source_word: τηρήσῃ
  choice: соблюдает
  rationale: В контексте закона τηρέω означает исполнять или соблюдать его предписания; «соблюдает» — точный и естественный русский эквивалент.
- source_word: πταίσῃ
  choice: споткнётся
  rationale: Сохраняет метафору πταίω о нравственном проступке; совершенный вид уместно обозначает единичное нарушение.
- source_word: ἐν ἑνί
  choice: в чём-то одном
  rationale: Передаёт сферу или отдельный пункт нарушения, не добавляя отсутствующего в греческом существительного.
- source_word: γέγονεν
  choice: стал
  rationale: 'Передаёт результативность перфекта γέγονεν: проступок приводит человека в состояние виновности.'
- source_word: πάντων ἔνοχος
  choice: виновен перед всем законом
  rationale: Формулировка передаёт ответственность по отношению ко всему закону и устраняет возможное ошибочное прочтение «виновен во всех отдельных грехах».
theological_decisions:
- issue: Объём виновности по отношению к закону
  choice: Нарушивший одно становится виновным перед всем законом.
  alternative: Нарушение одной заповеди равнозначно отдельному совершению нарушений всех заповедей.
  rationale: πάντων ἔνοχος выражает ответственность по отношению к целому, но само по себе не утверждает, что нарушитель совершил каждое возможное нарушение или что все проступки одинаковы по тяжести.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной связкой «ибо». Сохранена метафора спотыкания и результативность греческого перфекта; богословское значение не расширено до утверждения, будто нарушитель фактически преступил каждую заповедь по отдельности.
