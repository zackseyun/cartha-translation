reference: James 2:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂ἐπιβλέψητε δὲ⸃ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ ⸀εἴπητε· Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ⸂ἢ κάθου ἐκεῖ⸃ ὑπὸ τὸ ὑποπόδιόν μου,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/003.yaml
  text: and if you pay attention to the one wearing the bright clothing and say[a], “You sit here in a good place,” and say to the poor man, “You stand there[b], or sit under my footstool,”
translation:
  language: ru
  text: 'и вы обратите особое внимание на того, кто одет в блестящую одежду[a], и скажете: «Ты садись здесь, на хорошее место», а бедному скажете: «Ты стой или садись там, под моей скамеечкой для ног»[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нарядную одежду»; также: «великолепную одежду».'
    reason: lexical_alternative
  - marker: b
    text: В некоторых рукописях отсутствуют слова «или садись там».
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιβλέψητε
  choice: обратите особое внимание
  rationale: Глагол в данном контексте означает не просто посмотреть, а благосклонно выделить человека вниманием; формулировка передаёт это, не подменяя конкретное действие прямым обвинением в лицеприятии.
- source_word: φοροῦντα
  choice: одет
  rationale: Причастие обозначает ношение одежды; русское «одет в» естественно и точно в данном контексте.
- source_word: ἐσθῆτα τὴν λαμπράν
  choice: блестящую одежду
  rationale: λαμπρός может означать блестящий, сияющий, великолепный или нарядный. «Блестящую» сохраняет зрительный образ и подразумеваемую заметность дорогого наряда.
- source_word: Σὺ κάθου ὧδε καλῶς
  choice: Ты садись здесь, на хорошее место
  rationale: Передаёт повеление и благоприятность предложенного места; добавление «место» естественно выражает подразумеваемый смысл καλῶς.
- source_word: τῷ πτωχῷ
  choice: бедному
  rationale: Субстантивированное прилагательное мужского рода указывает на конкретного бедного мужчину; эллиптическое русское «бедному» сохраняет это без тяжеловесного повторения слова «человек».
- source_word: στῆθι
  choice: стой
  rationale: Простое повеление остаться стоять; место выражено наречием «там».
- source_word: ἢ κάθου ἐκεῖ
  choice: или садись здесь
  rationale: В принятом тексте SBLGNT фраза ἢ κάθου ἐκεῖ текстуально отмечена; при пунктуационном понимании, отражённом в ряде переводов, ἐκεῖ относится к унизительному месту у подножия. Русское «здесь» делает дейктический контраст с «там» естественным, хотя буквально ἐκεῖ — «там»; вариант отмечен в сноске.
- source_word: ὑπὸ τὸ ὑποπόδιόν μου
  choice: у подножия ног моих
  rationale: Буквальное «под моей скамеечкой для ног» по-русски может ошибочно описывать физически невозможное положение. Выражение «у подножия ног моих» сохраняет пространственную приниженность и намеренно унизительный тон; буквальный вариант дан в сноске.
theological_decisions:
- issue: Социальное лицеприятие
  choice: Передать конкретное предпочтительное внимание и противопоставленные распоряжения, не вводя в этот стих абстрактный термин «лицеприятие».
  alternative: «окажете особое предпочтение» или «проявите лицеприятие»
  rationale: Стих изображает поведение, тогда как его богословская оценка раскрывается контекстом. Конкретная формулировка сохраняет ход рассуждения Иакова.
- issue: Грамматический род πτωχῷ
  choice: бедному
  alternative: бедному человеку / бедняку
  rationale: Мужской род и единственное число сохранены; «бедняк» мог бы придать нежелательную разговорную или оценочную окраску.
- issue: Унизительное место бедного
  choice: у подножия ног моих
  alternative: под моей скамеечкой для ног
  rationale: Выбранная формулировка сохраняет контраст чести и унижения, не сглаживая богословское напряжение и не вынуждая читателя представлять буквально сидящего под предметом мебели.
translation_notes:
  register: Современный литературный русский язык с прямой, слегка торжественной речью. Синтаксис сохраняет незавершённую условную конструкцию, продолжающую предыдущий стих. Обращение «ты» передано явно для сохранения резкого противопоставления двух посетителей.
