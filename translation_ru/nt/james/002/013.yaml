  text: ἡ γὰρ κρίσις ἀνέλεος τῷ μὴ ποιήσαντι ἔλεος· κατακαυχᾶται ⸀ἔλεος κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/013.yaml
  text: For judgment is without mercy to the one who has shown no mercy[a]; mercy triumphs over judgment.
translation:
  language: ru
  text: Ибо суд будет без милости к тому, кто не проявил милости; милость торжествует над судом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «милость превозносится над судом». Греческий глагол может означать «хвалиться, ликовать над»; в тексте он передан идиоматически как «торжествует над».'
    reason: Лексическая альтернатива для κατακαυχᾶται.
lexical_decisions:
- source_word: κρίσις / κρίσεως
  choice: суд / судом
  rationale: Передаёт судебную и божественную оценку, не сужая смысл до одного лишь осуждения; повтор одного корня сохраняет внутренний контраст стиха.
- source_word: ἀνέλεος
  choice: без милости
  rationale: Естественное предикативное выражение, сохраняющее явную лексическую связь с повторяющимся ἔλεος.
- source_word: τῷ μὴ ποιήσαντι ἔλεος
  choice: к тому, кто не проявил милости
  rationale: Идиоматично передаёт оборот ποιεῖν ἔλεος — проявлять, оказывать милость — и сохраняет нравственную взаимность в контексте.
- source_word: κατακαυχᾶται
  choice: торжествует над
  rationale: Передаёт контекстуальную силу глагола — хвалиться, ликовать над кем-либо или чем-либо — естественным русским выражением, не устраняя образ полностью.
- source_word: ἔλεος
  choice: милость
  rationale: Стандартный и контекстуально точный эквивалент, позволяющий сохранить троекратную смысловую связь внутри стиха.
theological_decisions:
- issue: Смысл заключительной фразы κατακαυχᾶται ἔλεος κρίσεως
  choice: 'Общий афористический принцип: «милость торжествует над судом»'
  alternative: «Милость хвалится перед судом» или «милость превозносится над судом»
  rationale: 'Краткая формулировка сохраняет намеренную неопределённость: речь может идти о Божьей милости, о милости, действующей при суде, либо о значении милости, проявленной человеком. Перевод не вводит учение о заслугах и не разрешает заложенное в тексте богословское напряжение.'
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, торжественная и понятная. Будущее «будет» делает по-русски естественной направленность предупреждения, выраженную греческим именным предложением.
