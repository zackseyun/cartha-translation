id: JAS.2.26
reference: James 2:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις ⸀χωρὶς ἔργων νεκρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/026.yaml
  text: For just as the body without the spirit is dead[b][a], so also faith without works is dead.
translation:
  language: ru
  text: Ведь как тело без духа[a] мертво, так и вера[b] без дел мертва.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «без дыхания». Греческое слово может означать как «дух», так и «дыхание».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «верность»; возможно также «доверие». Греческое слово имеет этот диапазон значений; в основном тексте дано «вера».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Ведь как
  rationale: «Ведь» естественно передаёт пояснительное γὰρ и связывает итоговое сравнение с предшествующим рассуждением; «как» вводит первую часть сопоставления.
- source_word: τὸ σῶμα
  choice: тело
  rationale: Прямое и общеупотребительное соответствие для физического тела.
- source_word: χωρὶς πνεύματος
  choice: без духа
  rationale: Сохраняет форму и широкий смысл πνεῦμα; возможное значение «дыхание» указано в сноске.
- source_word: νεκρόν ἐστιν
  choice: мертво
  rationale: Кратко и точно передаёт именное сказуемое и сохраняет силу исходного выражения.
- source_word: οὕτως καὶ
  choice: так и
  rationale: Естественная русская формула, ясно обозначающая вторую часть сопоставления.
- source_word: ἡ πίστις
  choice: вера
  rationale: Основное соответствие в данном контексте; возможные значения «верность» и «доверие» сохранены в сноске без разрешения смыслового напряжения.
- source_word: χωρὶς ἔργων
  choice: без дел
  rationale: Точное и традиционно понятное соответствие, сохраняющее связь с аргументацией Иакова о вере и делах.
- source_word: νεκρά ἐστιν
  choice: мертва
  rationale: Повтор того же прилагательного сохраняет параллелизм и риторическую силу греческого текста.
theological_decisions:
- issue: Значение πνεύματος в сравнении
  choice: духа
  alternative: дыхания
  rationale: «Дух» сохраняет обычный смысловой диапазон греческого слова и антропологическую неоднозначность образа; «дыхание» также возможно и отмечено в сноске.
- issue: Значение πίστις в Иакова 2:26
  choice: вера
  alternative: верность; доверие
  rationale: Основной текст сохраняет прямое и контекстуально ожидаемое «вера», а лексически возможные варианты указаны в сноске, чтобы не устранять богословское напряжение толкованием.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная конструкция сохраняет параллелизм оригинала. Формы «мертво / мертва» согласованы с существительными и воспроизводят повтор исходного прилагательного.
