source:
  edition: SBLGNT
  text: ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς ⸂τῷ κόσμῳ⸃ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/005.yaml
  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: ru
  text: 'Послушайте, мои возлюбленные братья[a]: разве не избрал Бог тех, кто беден в глазах мира[b], но богат верой[c] и является наследником Царства, которое Он обещал любящим Его?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мои возлюбленные братья и сёстры». В греческом тексте буквально стоит «братья», но обращение может включать всю верующую общину.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «беден по мирским меркам»; возможно также: «беден в этом мире».'
    reason: lexical_alternative
  - marker: c
    text: «Вера» может также передаваться как «доверие» или, что здесь менее вероятно, «верность».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατε
  choice: Послушайте
  rationale: Аористный императив во множественном числе прямо призывает адресатов обратить внимание; «послушайте» естественно передаёт эту силу в современном русском языке.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: возлюбленные братья мои
  rationale: Сохраняет мужской род греческого ἀδελφοί и значение ἀγαπητοί; вероятный охват всей общины пояснён в сноске.
- source_word: οὐχ ὁ θεὸς ἐξελέξατο
  choice: не избрал ли Бог
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и не добавляет к глаголу избрания позднейшей догматической конкретизации.
- source_word: τοὺς πτωχοὺς τῷ κόσμῳ
  choice: тех, кто беден в глазах мира
  rationale: 'Дательный τῷ κόσμῳ естественно понимается как отношение или мерило: бедные с точки зрения мира. Формулировка избегает возможного ошибочного смысла «бедны для мира».'
- source_word: πλουσίους ἐν πίστει
  choice: богаты верой
  rationale: Кратко и естественно сохраняет противопоставление мирской бедности богатству в сфере веры.
- source_word: κληρονόμους τῆς βασιλείας
  choice: наследниками Царства
  rationale: «Наследники» сохраняет юридически-семейную метафору κληρονόμοι; «Царство» соответствует устойчивому библейскому обозначению Божьего Царства в данном контексте.
- source_word: ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν
  choice: которое Он обещал любящим Его
  rationale: Передаёт Царство как прямое дополнение при «обещал», а причастие настоящего времени — как характеристику тех, кто любит Бога.
theological_decisions:
- issue: Смысл Божьего избрания
  choice: Передать ἐξελέξατο нейтрально как «избрал», не уточняя механизм или вечный характер избрания.
  alternative: Истолковать выражение в терминах определённой доктрины предопределения.
  rationale: Стих противопоставляет Божью оценку бедных человеческому лицеприятию; он не раскрывает здесь полноценную систему учения об избрании.
- issue: Охват обращения ἀδελφοί
  choice: В основном тексте оставить «братья», а возможный охват братьев и сестёр указать в сноске.
  alternative: Перевести в основном тексте «братья и сёстры».
  rationale: Греческая форма грамматически мужского рода, но в обращении может включать всю верующую общину; сноска сохраняет обе стороны.
- issue: Значение πίστις
  choice: Перевести как «вера».
  alternative: «доверие» или, менее вероятно здесь, «верность».
  rationale: В сочетании «богаты верой» и в данном контексте «вера» является наиболее естественным значением, хотя лексическая широта слова отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Риторический вопрос сохранён. Порядок слов «возлюбленные братья мои» слегка возвышенный и соответствует эпистолярному обращению; пояснения вынесены в сноски, чтобы основной текст оставался ясным.
