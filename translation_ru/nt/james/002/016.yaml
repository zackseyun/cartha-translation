  yaml_path: translation/nt/james/002/016.yaml
  text: and one of you says to them[a], “Go in peace; keep warm and be filled,” but you do not give them the necessities of the body, what benefit is that?
translation:
  language: ru
  text: 'И кто-нибудь из вас скажет им: «Идите с миром, грейтесь и насыщайтесь»[a], — а вы не дадите им необходимого для тела — какая от этого польза?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «будьте согреты и насыщены». Греческие формы могут пониматься как страдательные или средние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπῃ δέ τις ... ἐξ ὑμῶν
  choice: и кто-нибудь из вас скажет
  rationale: Греческая конструкция вводит предполагаемый пример; «кто-нибудь из вас» естественно передаёт неопределённость τις и партитивное ἐξ ὑμῶν. Союз δέ передан как «и», поскольку здесь он продолжает рассуждение, не требуя резкого противопоставления.
- source_word: Ὑπάγετε ἐν εἰρήνῃ
  choice: Идите с миром
  rationale: Естественная русская формула благопожелания при прощании, сохраняющая ироническую силу контекста.
- source_word: θερμαίνεσθε
  choice: грейтесь
  rationale: Возвратная форма звучит естественно по-русски и допускает практический смысл «согревайтесь», не уточняя способ получения тепла.
- source_word: χορτάζεσθε
  choice: насыщайтесь
  rationale: Передаёт значение насыщения, прежде всего пищей, и сохраняет параллелизм с «грейтесь».
- source_word: μὴ δῶτε δὲ αὐτοῖς
  choice: но не даст им
  rationale: Аористический сослагательный глагол согласован с гипотетическим единственным субъектом «кто-нибудь»; «но» ясно выражает контраст между словами и отсутствием помощи.
- source_word: τὰ ἐπιτήδεια τοῦ σώματος
  choice: необходимого для тела
  rationale: Естественно и достаточно близко передаёт необходимые материальные средства для телесных нужд, сохраняя явное упоминание тела.
- source_word: τί ὄφελος;
  choice: какая от этого польза?
  rationale: Идиоматичный русский вопрос о практической ценности поступка; «от этого» явно отсылает к пустому благопожеланию.
theological_decisions:
- issue: Залог форм θερμαίνεσθε и χορτάζεσθε
  choice: «грейтесь и насыщайтесь» без пояснения, должны ли нуждающиеся сами обеспечить себя или получить помощь извне
  alternative: «будьте согреты и накормлены»
  rationale: Греческие формы допускают среднее или страдательное понимание. Русские возвратные формы сохраняют риторический смысл пустых пожеланий и не превращают неоднозначность залога в отдельное нравственное утверждение.
translation_notes:
  register: Современный литературный русский язык; достоинство апостольского наставления сочетается с ясной разговорной формой прямой речи. Синтаксис сохраняет единый гипотетический субъект в единственном числе, а обращение к нуждающимся — во множественном.
