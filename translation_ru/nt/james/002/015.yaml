lexical_decisions:
- source_word: ἐὰν
  choice: Если
  rationale: Передаёт условный характер придаточной части просто и естественно.
- source_word: ἀδελφὸς ἢ ἀδελφή
  choice: брат или сестра
  rationale: Прямо сохраняет явную мужскую и женскую формы исходного текста и его семейную лексику.
- source_word: γυμνοὶ
  choice: плохо одеты
  rationale: В сочетании с нехваткой ежедневной пищи слово, вероятнее всего, обозначает недостаток необходимой одежды, хотя допускает и буквальное значение «наги».
- source_word: ὑπάρχωσιν
  choice: одеты
  rationale: Глагол выполняет связочную функцию при предикативном прилагательном; в естественном русском его смысл выражается формой сказуемого «одеты».
- source_word: λειπόμενοι
  choice: не имеют
  rationale: Естественно передаёт продолжающуюся нехватку жизненно необходимого, не усиливая смысл до полного голодания.
- source_word: τῆς ἐφημέρου τροφῆς
  choice: пищи на каждый день
  rationale: Передаёт пищу, необходимую изо дня в день; выражение естественно в современном русском и несколько яснее буквального «ежедневной пищи».
theological_decisions:
- issue: Круг лиц, обозначенных выражением ἀδελφὸς ἢ ἀδελφή
  choice: Сохранить «брат или сестра» как семейное обозначение, вероятнее всего относящееся в контексте к собратьям по вере.
  alternative: 'Передать обобщённо: «человек» или «ближний».'
  rationale: Перевод сохраняет формулировку Иакова и не расширяет её явно за пределы текста, не отрицая при этом более широкого нравственного применения.
translation_notes:
  register: Современный литературный русский; синтаксис простой и достойный. Множественное согласование «одеты» естественно объединяет пару «брат или сестра», а форма «не имеют» сохраняет структуру незавершённого условного предложения.
