id: JAS.2.6
reference: James 2:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/006.yaml
  text: But you have dishonored the poor man[b][a]. Is it not the rich who oppress you and themselves drag you into courts?
translation:
  language: ru
  text: А вы унизили бедняка.[a] Не богатые ли притесняют вас и сами тащат вас в суды?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедного человека»; возможно также обобщённо: «бедных». В греческом тексте стоит единственное число, которое, вероятно, отсылает к бедному мужчине из примера в предыдущих стихах и одновременно представляет бедных вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в судебные учреждения»; греческое слово обозначает места судебного разбирательства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠτιμάσατε
  choice: унизили
  rationale: Глагол означает лишить чести, обесчестить или отнестись с презрением. «Унизили» естественно передаёт в современном русском контраст чести и бесчестия и связь с пренебрежительным обращением в предыдущих стихах.
- source_word: τὸν πτωχόν
  choice: бедняка
  rationale: Артикль и форма единственного числа указывают прежде всего на бедного мужчину из примера в 2:2–3; при этом он может представлять бедных вообще.
- source_word: οἱ πλούσιοι
  choice: богатые
  rationale: 'Субстантивированное прилагательное естественно передаётся как обозначение социальной группы: «богатые».'
- source_word: καταδυναστεύουσιν
  choice: притесняют
  rationale: Глагол обозначает жестокое или несправедливое применение власти против кого-либо. «Притесняют» сохраняет значение угнетения, не уточняя его способ.
- source_word: ἕλκουσιν
  choice: тащат
  rationale: Глагол выражает насильственное, принудительное движение; «тащат» сохраняет яркость и враждебность образа.
- source_word: κριτήρια
  choice: суды
  rationale: Во множественном числе здесь обозначает судебные учреждения или разбирательства; «суды» ясно и естественно в современном русском.
- source_word: καὶ αὐτοὶ
  choice: и сами
  rationale: Сочетание имеет эмфатический характер и подчёркивает, что именно богатые лично тащат адресатов в суд.
- source_word: οὐχ ... ;
  choice: Не ... ли?
  rationale: Отрицательная вопросительная конструкция предполагает утвердительный ответ; русская форма «Не ... ли?» естественно передаёт риторическую силу.
theological_decisions:
- issue: Кого обозначает единственное число τὸν πτωχόν
  choice: Бедный мужчина из описанного ранее случая, одновременно представляющий бедных в более широком смысле
  alternative: Собирательное обозначение бедных вообще
  rationale: Контекст Иак. 2:2–3 говорит о конкретном бедном мужчине, поэтому единственное число сохранено; вместе с тем обобщающая сила примера не исключается.
translation_notes:
  register: Современный литературный русский, ясный и достойный. «Бедняка» сохраняет мужское единственное число и связь с ближайшим контекстом; «тащат» передаёт резкость исходного образа. Порядок маркеров приведён в соответствие с местами, к которым относятся примечания.
