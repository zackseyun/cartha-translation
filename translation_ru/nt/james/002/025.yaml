  text: ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/025.yaml
  text: And likewise[b][a], was not Rahab the prostitute also justified by works when she welcomed the messengers and sent them out by another way?
translation:
  language: ru
  text: Так же и блудница Раав не делами ли была оправдана[a], когда приютила посланников[b] и отправила их другой дорогой?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «была признана праведной»; возможно также: «оказалась праведной». В греческом тексте употреблён глагол «оправдать», поэтому основной перевод сохраняет эту формулировку, не разрешая здесь богословский спор о её точном оттенке.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вестников» или «посланников». По контексту речь идёт о людях, которых приютила Раав (Нав. 2), а не о небесных ангелах.'
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: Подобно этому, и
  rationale: Передаёт связь с предшествующим примером Авраама и вводит Раав как второй аналогичный случай; выражение естественно для современного русского языка.
- source_word: Ῥαὰβ
  choice: Раав
  rationale: Употреблена традиционная русская библейская форма имени.
- source_word: ἡ πόρνη
  choice: блудница
  rationale: Точно передаёт значение πόρνη и сохраняет узнаваемую, не чрезмерно разговорную библейскую лексику; слово понятно современному читателю.
- source_word: οὐκ ἐξ ἔργων ἐδικαιώθη
  choice: не делами ли была оправдана
  rationale: Сохраняет риторический вопрос, пассивную форму и краткое выражение основания/средства через ἐκ; термин «оправдана» не устраняет богословскую напряжённость контекста.
- source_word: ὑποδεξαμένη
  choice: когда приняла
  rationale: Передаёт обстоятельственное значение причастия и гостеприимный приём посланников без неестественной для русского деепричастной перегрузки.
- source_word: τοὺς ἀγγέλους
  choice: посланников
  rationale: ἄγγελος означает посланника или вестника; здесь, согласно контексту рассказа о Раав, речь идёт о людях, а не о небесных ангелах.
- source_word: καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα
  choice: и отправила их другой дорогой
  rationale: В данном контексте ἐκβάλλω означает отправить или вывести, а не насильственно изгнать; ἑτέρᾳ ὁδῷ естественно передано как «другой дорогой».
theological_decisions:
- issue: Значение δικαιόω в Иакова 2:25 и связь оправдания с делами
  choice: Сохранить в основном тексте «была оправдана», не уточняя механизм или этап оправдания.
  alternative: «была признана праведной» или «показала себя праведной»
  rationale: Греческий глагол допускает обсуждаемые оттенки, а контекст намеренно связывает оправдание с делами. Формулировка «была оправдана» сохраняет терминологическую связь и не решает богословский спор посредством парафраза.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой. Синтаксис сохраняет риторический вопрос оригинала; «другой дорогой» звучит естественнее буквального «другим путём» в повествовательном контексте.
