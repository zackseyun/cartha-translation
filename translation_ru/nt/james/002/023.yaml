  text: καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα· Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/023.yaml
  text: And the Scripture was fulfilled that says[a], “Abraham believed God, and it was counted to him as righteousness,” and he was called a friend of God.
translation:
  language: ru
  text: 'И исполнилось Писание, в котором сказано: «Авраам поверил Богу, и это было вменено ему в праведность»[a], и он был назван другом Божьим.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это было засчитано ему как праведность»; греческий глагол также может означать «причислено» или «учтено».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπληρώθη
  choice: исполнилось
  rationale: Обычная формула исполнения Писания; передаёт пассивную форму и сохраняет утверждение Иакова о том, что приведённое место Писания достигло исполнения.
- source_word: ἡ γραφὴ ἡ λέγουσα
  choice: Писание, которое говорит
  rationale: Передаёт единственное число и формулу цитирования священного текста; настоящее время причастия естественно выражено глаголом «говорит».
- source_word: Ἐπίστευσεν ... Ἀβραὰμ τῷ θεῷ
  choice: Авраам поверил Богу
  rationale: Дательный падеж при πιστεύω указывает на то, что Авраам принял слово Бога как истинное; «поверил Богу» точнее сохраняет конструкцию, чем более общее «уверовал в Бога».
- source_word: ἐλογίσθη αὐτῷ
  choice: это было вменено ему
  rationale: «Вменено» сохраняет смысл засчитывания или приписывания и естественно сочетается с выражением «в праведность». Местоимение «это» соотносится с верой Авраама, не добавляя самостоятельного существительного.
- source_word: εἰς δικαιοσύνην
  choice: в праведность
  rationale: Устойчивая и близкая к форме цитаты передача εἰς в сочетании с δικαιοσύνη; сохраняет богословски значимый термин без замены его словом «справедливость».
- source_word: φίλος θεοῦ
  choice: другом Бога
  rationale: Передаёт именную часть сказуемого и родительный θεοῦ без уточнения характера отношения сверх сказанного в тексте.
- source_word: ἐκλήθη
  choice: был назван
  rationale: Естественно передаёт пассив καλέω и сохраняет возможность понимать выражение как наименование или признанное обозначение.
theological_decisions:
- issue: Связь веры Авраама и его дел в рассуждении Иакова
  choice: Сохранена формула «исполнилось Писание» и прямое утверждение о вере, вменённой в праведность.
  alternative: Истолковать стих либо исключительно судебно и в отрыве от дел, либо так, будто дела заменяют веру как основание праведности.
  rationale: Сам стих связывает Бытие 15:6 с показанным ранее послушанием Авраама. Перевод сохраняет эту напряжённость и не разрешает межконфессиональный спор за пределами формулировки текста.
- issue: Передача δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: В контексте цитаты об Аврааме «праведность» соответствует значению термина и традиции Бытия 15:6; «справедливость» здесь сузила бы или сместила смысл.
- issue: Референт подразумеваемого подлежащего при ἐλογίσθη
  choice: это было вменено ему
  alternative: вера была вменена ему
  rationale: Греческий текст не выражает существительное «вера» в этой части предложения. Местоимение «это» сохраняет естественную отсылку к тому, что Авраам поверил, не делая подразумеваемое содержание явным сильнее оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Вменено» сохранено как точный и узнаваемый термин, а его смысл пояснён в сноске. Начальное καί передано союзом «И»; δέ внутри цитаты отдельно не воспроизведено, поскольку здесь оно не требует явного русского соответствия.
