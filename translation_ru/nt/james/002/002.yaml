  text: ἐὰν γὰρ εἰσέλθῃ ⸀εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/002.yaml
  text: For if a man wearing gold rings and bright clothing enters into your assembly[a], and a poor man in filthy clothing also enters,
translation:
  language: ru
  text: Ведь если в ваше собрание[a] войдёт мужчина с золотыми кольцами на пальцах, в блестящей одежде, и войдёт также бедняк в грязной одежде,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в синагогу». Греческое слово συναγωγή означает «синагога» или «собрание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγήν
  choice: собрание
  rationale: В данном контексте слово обозначает место или событие, где собралась община. «Собрание» естественно по-русски и не предрешает, идёт ли речь о синагоге как учреждении; буквальная альтернатива сохранена в сноске.
- source_word: ἀνὴρ
  choice: человек
  rationale: Хотя существительное мужского рода может означать мужчину, в русском «человек» здесь естественно обозначает участника сцены мужского пола и не утяжеляет фразу повтором слова «мужчина».
- source_word: χρυσοδακτύλιος
  choice: с золотыми кольцами
  rationale: Редкое прилагательное буквально описывает человека, украшенного золотом на пальцах. Эта формулировка передаёт заметный признак богатства и допускает множественность колец, не навязывая её как отдельное утверждение.
- source_word: ἐσθῆτι λαμπρᾷ
  choice: в блестящей одежде
  rationale: λαμπρός может указывать как на сияние, так и на великолепие. «Блестящая одежда» сохраняет зрительный образ и оттенок нарядности.
- source_word: πτωχὸς
  choice: бедняк
  rationale: Субстантивированное прилагательное мужского рода обозначает бедного мужчину; «бедняк» кратко и естественно сохраняет социальный контраст.
- source_word: ῥυπαρᾷ ἐσθῆτι
  choice: в грязной одежде
  rationale: ῥυπαρός прямо означает грязный, нечистый. «Грязная» точнее «поношенной» или «бедной», которые добавляли бы иной смысл.
- source_word: εἰσέλθῃ ... εἰσέλθῃ
  choice: войдёт ... войдёт также
  rationale: Повтор глагола сохранён ради параллельной структуры греческого текста.
- source_word: γὰρ
  choice: ведь
  rationale: «Ведь» естественно связывает пример с предшествующим предостережением и передаёт пояснительную функцию γάρ.
theological_decisions:
- issue: Значение συναγωγή в контексте христианской общины
  choice: собрание
  alternative: синагога
  rationale: Текст не уточняет институциональный статус места встречи. Основной вариант передаёт общее значение слова и не вводит лишнего конфессионального вывода, а буквальная возможность «синагога» отмечена в сноске.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Сохранены гипотетическая конструкция, повтор глагола и незавершённость предложения, продолжающегося в следующем стихе.
