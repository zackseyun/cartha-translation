  text: οὐκ αὐτοὶ βλασφημοῦσιν τὸ καλὸν ὄνομα τὸ ἐπικληθὲν ἐφ’ ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/007.yaml
  text: Do not they themselves blaspheme the good name that was called upon you?[a][b]
translation:
  language: ru
  text: Не они ли сами хулят доброе имя[a], которым вы названы?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «почётное имя»; «благородное имя».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «доброе имя, наречённое над вами». Это выражение, вероятно, означает имя, с которым отождествляют верующих, и, возможно, перекликается с языком завета или крещения.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ αὐτοὶ
  choice: Не они ли сами
  rationale: Риторический вопрос с οὐκ ожидает утвердительного ответа, а αὐτοὶ подчёркивает, что речь идёт именно о ранее упомянутых людях.
- source_word: βλασφημοῦσιν
  choice: хулят
  rationale: Глагол может означать злословие или поношение, в том числе святого имени. «Хулят» сохраняет сильный религиозный оттенок и естественно сочетается со словом «имя».
- source_word: τὸ καλὸν ὄνομα
  choice: доброе имя
  rationale: Сохраняет основное значение καλός и намеренно не уточняет, чьё это имя; возможные оттенки достоинства и чести вынесены в примечание.
- source_word: τὸ ἐπικληθὲν ἐφ’ ὑμᾶς
  choice: которым вы названы
  rationale: Естественно передаёт греческую идиому о имени, наречённом над людьми или присвоенном им, не делая русский текст искусственно буквальным.
theological_decisions:
- issue: К кому относится «доброе имя»
  choice: Оставить референт прямо не названным, как в греческом тексте.
  alternative: 'Уточнить: «имя Христа», «имя Иисуса» или «имя Бога».'
  rationale: Контекст Иак. 2:1 делает связь с Иисусом Христом весьма вероятной, однако данный стих не называет его прямо. Перевод сохраняет эту смысловую открытость.
- issue: Смысл выражения «имя, наречённое над вами»
  choice: В основном тексте передать как «имя, которым вы названы».
  alternative: 'Буквальнее: «имя, наречённое над вами».'
  rationale: Фраза может указывать на принадлежность и отождествление верующих с носителем имени, возможно с заветным или крещальным оттенком. Основной вариант понятен современному читателю, а буквальный образ сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с краткой, выразительной формой риторического вопроса. «Хулят» сохраняет достоинство и религиозную силу оригинала; необычный греческий оборот разъяснён в примечании.
