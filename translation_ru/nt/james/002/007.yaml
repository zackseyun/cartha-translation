review_pass:
  verdict: approve
  source_fidelity: «Не они ли сами» точно передаёт риторический вопрос с οὐκ и эмфатическое αὐτοί. «Хулят» соответствует сильному βλασφημοῦσιν и уместно с «именем». «Доброе имя, которым вы названы» сохраняет неуточнённый референт τὸ καλὸν ὄνομα и естественно передаёт конструкцию τὸ ἐπικληθὲν ἐφ’ ὑμᾶς без добавления имени Христа или Бога.
  naturalness: Текст краток, грамматически ясен и звучит по-современному литературно. Риторическая форма «Не они ли сами…?» естественна. «Доброе имя» в русском также может означать репутацию, но в сочетании с «которым вы названы» достаточно ясно выступает именно как имя; это продуктивно сохраняет образ оригинала.
  terminology: «Хулят» оправданно сохраняет религиозно-нравственную силу глагола, не сводя его к нейтральному «злословят». Перевод не догматизирует референт «доброго имени». Примечания корректно дают лексические альтернативы и поясняют возможный образ имени, наречённого над верующими, как вероятность, а не как установленный факт.
