id: JAS.2.14
reference: James 2:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀Τί ὄφελος, ἀδελφοί μου, ἐὰν πίστιν λέγῃ τις ἔχειν ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/014.yaml
  text: What good is it[a], my brothers[c][b], if someone says he has faith but does not have works? Can that faith save him?
translation:
  language: ru
  text: Какая польза, братья мои[a], если кто говорит, что имеет веру, а дел не имеет? Разве эта вера может спасти его?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры мои». В греческом стоит форма мужского рода «братья», которая может использоваться как обращение ко всей общине верующих.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Разве такая вера может спасти его?» Буквально: «Разве вера может спасти его?» Артикль перед словом «вера» отсылает к только что описанной вере — той, о которой человек говорит, но которая не сопровождается делами.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὄφελος
  choice: Какая польза
  rationale: Естественно передаёт риторический вопрос о практической пользе или результате.
- source_word: ἀδελφοί μου
  choice: братья мои
  rationale: Сохраняет форму обращения мужского рода во множественном числе; в данном контексте она может относиться ко всей общине верующих, что отмечено в сноске.
- source_word: πίστιν
  choice: веру
  rationale: В сочетании «говорит, что имеет веру» речь идёт о заявляемой вере; варианты «доверие» и «верность» здесь менее естественны.
- source_word: λέγῃ τις ἔχειν
  choice: если кто говорит, что имеет
  rationale: Близко следует греческой конструкции и не усиливает её более истолковывающим глаголом «утверждает».
- source_word: ἔργα
  choice: дел
  rationale: Сохраняет устойчивую лексическую связь «вера — дела» на протяжении рассуждения Иакова.
- source_word: μὴ δύναται
  choice: Разве ... может?
  rationale: Частица μή предполагает отрицательный ответ; русская конструкция с «разве» естественно передаёт это риторическое ожидание.
- source_word: ἡ πίστις
  choice: эта вера
  rationale: 'Указательное «эта» передаёт анафорическую силу артикля: имеется в виду только что названная вера, о наличии которой говорят, но которая не сопровождается делами.'
- source_word: σῶσαι αὐτόν
  choice: спасти его
  rationale: Стандартно передаёт σῴζω, сохраняя богословский вес вопроса и личное местоимение мужского рода.
theological_decisions:
- issue: Соотношение веры и дел в риторическом вопросе
  choice: Вопрос отнесён к «этой вере», то есть к заявляемой вере без дел.
  alternative: «Может ли вера спасти его?» или «Может ли такая вера спасти его?»
  rationale: Так сохраняется отсылка артикля к описанному виду веры, но текст не получает дополнительного догматического объяснения и не разрешает напряжение сверх сказанного Иаковом.
- issue: Форма обращения к общине
  choice: «братья мои» в основном тексте с пояснением в сноске
  alternative: «братья и сёстры мои»
  rationale: Основной текст сохраняет грамматически мужскую форму оригинала, а сноска сообщает о её возможном представительном употреблении применительно ко всей общине.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет две риторические части оригинала. «Дела» выбраны вместо «поступков» ради лексической и богословской связности ближайшего контекста; «разве» явно, но естественно передаёт ожидаемый отрицательный ответ.
