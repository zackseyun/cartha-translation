    reason: lexical_alternative
  - marker: b
    text: 'Или: «обличает» или «показывает вашу виновность». Греческое слово может обозначать выявление проступка, обличение и доказательство вины.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «как преступивших закон».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Но если
  rationale: «Если» сохраняет условный характер фразы, а «но» передаёт мягкое противопоставление предыдущему рассуждению.
- source_word: προσωπολημπτεῖτε
  choice: вы проявляете пристрастие
  rationale: Глагол обозначает пристрастное отношение к людям из-за их внешнего положения или статуса. Этот вариант естественен в современном русском языке и не воспроизводит буквально исходную семитскую идиому.
- source_word: ἁμαρτίαν ἐργάζεσθε
  choice: совершаете грех
  rationale: Сочетание буквально означает «делаете грех»; «совершаете грех» точно и естественно передаёт его идиоматический смысл.
- source_word: ἐλεγχόμενοι
  choice: и закон обличает вас
  rationale: Греческое страдательное причастие указывает, что закон выявляет проступок и показывает виновность. Координация с личной формой делает русское предложение естественным, при этом субъект действия назван в следующем обороте исходного текста.
- source_word: ὑπὸ τοῦ νόμου
  choice: закон
  rationale: 'Оборот обозначает деятеля при страдательной конструкции — «законом». При переходе к действительной конструкции он естественно становится подлежащим: «закон обличает».'
- source_word: ὡς παραβάται
  choice: как нарушителей
  rationale: Слово обозначает тех, кто преступает установленную границу или предписание. «Нарушители» сохраняет юридико-нравственный смысл, а ближайшее упоминание закона ясно указывает, что именно нарушено.
theological_decisions:
- issue: Характер закона в нравственном рассуждении Иакова
  choice: Передать νόμος как «закон» со строчной буквы, без уточнения.
  alternative: «Закон», «Божий закон» или «Моисеев закон».
  rationale: Греческий текст представляет закон как мерило, выявляющее пристрастие как грех, но сам по себе не требует здесь более узкого заветного или конфессионального толкования.
- issue: Связь обличения законом с совершением греха
  choice: 'Передать причастие отдельной сочинённой частью: «и закон обличает вас».'
  alternative: «совершаете грех, обличаемые законом» или «будучи обличаемы законом».
  rationale: Так сохраняется логическая связь между грехом и выявлением виновности законом без утверждения сверх текста о времени или окончательном судебном приговоре.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Избегнуто малопонятное для части современных читателей «лицеприятие»; выражение «проявляете пристрастие» передаёт смысл ясно и достойно. Активная конструкция «закон обличает вас» выбрана вместо тяжеловесного русского страдательного причастного оборота.
