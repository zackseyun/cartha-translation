  source_fidelity: '«Вы видите, что человек оправдывается делами, а не одной лишь верой» точно передаёт синтаксис и смысл греческого текста: ὁρᾶτε — прямое обращение во множественном числе; ἐξ ἔργων — основание/средство; δικαιοῦται сохранено как «оправдывается»; противопоставление «делами, а не ... верой» и ограничение μόνον переданы без добавления толкования.'
