  text: ⸀ὁρᾶτε ὅτι ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/024.yaml
  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: ru
  text: Вы видите, что человек оправдывается делами, а не одной лишь верой[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «показывает себя праведным» или «признаётся правым». Формулировка Иакова сохранена без устранения спора о том, как она соотносится с употреблением слова «оправдывать» у Павла.'
    reason: alternative_reading
  - marker: b
    text: Греческое πίστις может также передаваться словами «доверие» или «верность», однако здесь основным соответствием служит «вера».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Вы видите
  rationale: Форма обращена к нескольким адресатам и здесь естественно читается как утверждение, подводящее итог предшествующему примеру; перевод сохраняет прямое обращение и не превращает его в повеление.
- source_word: ἐξ ἔργων
  choice: делами
  rationale: Предлог ἐξ с родительным падежом обозначает основание или средство; русское творительное «делами» кратко и естественно передаёт эту связь.
- source_word: δικαιοῦται
  choice: оправдывается
  rationale: Этот выбор сохраняет ключевой термин δικαιόω, его богословскую значимость и напряжение с другими новозаветными контекстами, не подменяя его одним из возможных толкований.
- source_word: ἄνθρωπος
  choice: человек
  rationale: Греческое существительное употреблено в общем, представительном смысле. Русское «человек» точно и естественно относится здесь к любому человеку, не ограничивая высказывание мужчинами.
- source_word: πίστεως
  choice: верой
  rationale: «Вера» — основное соответствие πίστις в данном противопоставлении делам; другие допустимые оттенки отмечены в сноске.
- source_word: μόνον
  choice: одной лишь
  rationale: Сочетание «одной лишь верой» естественно по-русски выражает исключительность, обозначенную μόνον, и сохраняет смысл формулы «верой одной».
theological_decisions:
- issue: Значение δικαιοῦται и его отношение к учению об оправдании
  choice: Сохранить в основном тексте «оправдывается».
  alternative: «показывает себя праведным»; «признаётся правым»
  rationale: Глагол δικαιόω допускает судебный смысл «оправдывать» и контекстуальный оттенок подтверждения или признания правоты. Основной текст сохраняет формулировку Иакова и не устраняет заранее напряжение с употреблением этого глагола у Павла; возможные смысловые оттенки вынесены в сноску.
- issue: Соотношение дел и веры
  choice: 'Передать: «делами, а не одной лишь верой».'
  alternative: «не только верой, но и делами»
  rationale: Выбранный порядок ближе к греческому тексту и сохраняет акцент Иакова на делах, не добавляя систематического объяснения того, как именно соотносятся вера и дела.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная формулировка сохраняет прямой вывод автора. «Человек» естественно имеет общий смысл, поэтому отдельная гендерная сноска не требуется. Все сноски обозначены в основном тексте.
