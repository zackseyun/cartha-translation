  text: have you not made distinctions among yourselves and become judges with evil thoughts?[a][b]
translation:
  language: ru
  text: разве вы не провели различия между собой и не стали судьями со злыми помыслами?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разве вы не проявили пристрастия между собой?» Глагол может также означать «разделиться» или, в других контекстах, «сомневаться», но здесь речь, вероятнее всего, идёт о пристрастном проведении различий.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «судьями злых помыслов (или рассуждений)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκρίθητε
  choice: стали проводить различия
  rationale: В контексте неодинакового отношения к богатому и бедному глагол обозначает проведение различий, ведущее к пристрастному обращению. Формулировка сохраняет связь с непосредственным контекстом, не подменяя её более узким словом «дискриминировать».
- source_word: ἐν ἑαυτοῖς
  choice: между собой
  rationale: В сцене общинного собрания выражение естественнее всего понимать в межличностном, общинном смысле; возможный оттенок внутренней раздвоенности отмечен в сноске.
- source_word: ἐγένεσθε
  choice: сделались
  rationale: 'Глагол выражает результат предшествующего действия: проводя такие различия, адресаты оказались судьями определённого рода.'
- source_word: κριταὶ
  choice: судьями
  rationale: Прямой и понятный эквивалент, сохраняющий судебно-нравственную силу упрёка.
- source_word: διαλογισμῶν πονηρῶν
  choice: со злыми помыслами
  rationale: Греческий родительный допускает буквальное «судьями злых помыслов/рассуждений», но по смыслу характеризует их суждение как исходящее из злых размышлений. «Помыслы» сохраняет содержание διαλογισμός и звучит естественно в достойном современном регистре.
- source_word: οὐ
  choice: разве ... не
  rationale: Эта конструкция передаёт риторический вопрос, ожидающий утвердительного ответа, и сохраняет обличительную силу фразы.
theological_decisions:
- issue: Значение διακρίνω в связи с лицеприятием
  choice: Стих обличает проведение пристрастных различий внутри общины.
  alternative: Стих говорит о внутренней раздвоенности или сомнении.
  rationale: Непосредственный контекст Иак. 2:1–3 описывает предпочтение богатого бедному, поэтому социально-нравственное значение здесь вероятнее; однако смысл «разделиться в себе» лексически возможен и сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. «Проводить различия» понятно широкому читателю и позволяет не сужать многозначность глагола; «помыслы» несколько возвышенно, но естественно в нравственном обличении.
