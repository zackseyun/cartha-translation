  yaml_path: translation/nt/james/002/012.yaml
  text: So speak and so act as those who are going to be judged through the law of freedom.
translation:
  language: ru
  text: Так говорите и так поступайте, как люди, которым предстоит быть судимыми через закон свободы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε
  choice: Так говорите и так поступайте
  rationale: Сохраняет параллелизм и увещевательную силу двух форм настоящего повелительного наклонения, предполагающих постоянный образ речи и действий.
- source_word: ὡς ... μέλλοντες κρίνεσθαι
  choice: как те, кому предстоит быть судимыми
  rationale: Передаёт сравнительное ὡς, значение предстоящего действия в μέλλοντες и страдательный залог κρίνεσθαι, не уточняя прямо не названного Судью.
- source_word: διὰ νόμου ἐλευθερίας
  choice: через закон свободы
  rationale: Передаёт διά с родительным как «через», сохраняя инструментально-посредническую формулировку источника и не заменяя её более однозначным «по» или «законом».
theological_decisions:
- issue: Роль «закона свободы» в грядущем суде
  choice: через закон свободы
  alternative: по закону свободы / законом свободы
  rationale: Греческое διά с родительным допускает идею посредства. Выбранная формулировка сохраняет необычность и богословское напряжение текста, не сводя закон лишь к мерилу суда и не утверждая сверх текста, что сам закон выступает судьёй.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Тире помогает естественно отделить повеление от сравнительной характеристики адресатов; лексический повтор «так ... и так ...» сохраняет риторическую структуру оригинала.
