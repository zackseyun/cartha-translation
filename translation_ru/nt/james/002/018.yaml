  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἀλλ’ ἐρεῖ τις· Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου ⸀χωρὶς τῶν ⸀ἔργων, κἀγώ ⸂σοι δείξω⸃ ἐκ τῶν ἔργων μου τὴν ⸀πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/018.yaml
  text: But someone will say[a], “You have faith, and I have works.” Show me your faith apart from works[c][b], and I will show you my faith by my works.
translation:
  language: ru
  text: 'Но кто-нибудь скажет: «У тебя есть вера[a], а у меня есть дела». Покажи мне свою веру без дел[b], а я покажу тебе свою веру своими делами[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. pistis; возможно также: «доверие», а в некоторых контекстах — «верность».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «отдельно от дел». Греческое выражение может означать как «без дел», так и «отдельно от дел».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «по моим делам»; букв. «из моих дел». Греческий предлог может указывать на источник или средство; здесь дела делают веру видимой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλ’
  choice: Но
  rationale: Краткий противительный союз естественно вводит возражение в ходе рассуждения Иакова.
- source_word: ἐρεῖ τις
  choice: кто-нибудь скажет
  rationale: Будущее время сохранено и передаёт реплику предполагаемого собеседника.
- source_word: πίστιν / πίστιν
  choice: вера / веру
  rationale: «Вера» — точный и традиционно понятный эквивалент πίστις; он сохраняет напряжение между исповедуемой верой и делами, не сводя значение заранее ни к доверию, ни к верности.
- source_word: ἔργα / ἔργων
  choice: дела / дел
  rationale: «Дела» сохраняют ключевое понятие всего рассуждения и его узнаваемую связь с ближайшим контекстом.
- source_word: δεῖξόν μοι
  choice: покажи мне
  rationale: Прямая и естественная передача повелительной формы и требования наглядно подтвердить веру.
- source_word: χωρὶς τῶν ἔργων
  choice: без дел
  rationale: Естественная русская передача значения «без, отдельно от»; не добавляет отсутствующих в греческом тексте пояснений.
- source_word: κἀγώ σοι δείξω
  choice: а я покажу тебе
  rationale: «А я» передаёт подчёркнутое противопоставление двух собеседников и звучит естественно по-русски.
- source_word: ἐκ τῶν ἔργων μου
  choice: своими делами
  rationale: Творительный падеж ясно выражает средство, посредством которого вера становится видимой; возможное исходное значение предлога ἐκ отмечено в сноске.
theological_decisions:
- issue: Передача πίστις в споре о вере и делах
  choice: вера
  alternative: доверие; верность
  rationale: «Вера» сохраняет богословскую и риторическую напряжённость текста. Варианты «доверие» и особенно «верность» могли бы преждевременно сузить смысл.
- issue: Связь веры с делами в выражении ἐκ τῶν ἔργων μου
  choice: покажу веру своими делами
  alternative: покажу веру из моих дел / по моим делам
  rationale: Основной текст выражает доказательную роль дел, не утверждая сверх текста, что дела являются источником веры; буквальная неоднозначность ἐκ сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык, прямой и достойный по тону. Сохранены диалогическая форма, параллелизм «покажи — покажу» и традиционные ключевые термины «вера» и «дела». Кавычки обозначают предполагаемую реплику; последующие слова оставлены вне кавычек в соответствии с пунктуационно естественным пониманием структуры стиха, которая в греческом допускает дискуссию о границах реплики.
