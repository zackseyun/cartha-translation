  text: Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/021.yaml
  text: Was not Abraham our father justified by works when he offered up Isaac his son on the altar?[a]
translation:
  language: ru
  text: Разве не был оправдан делами Авраам, наш отец, когда возложил на жертвенник Исаака, своего сына?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был признан праведным»; возможно также: «его праведность была подтверждена». Греческий глагол в зависимости от контекста может обозначать как признание праведным, так и явное подтверждение праведности.'
    reason: alternative_reading
lexical_decisions:
- source_word: πατὴρ ἡμῶν
  choice: наш отец
  rationale: Сохраняет семейный образ и язык общей заветной принадлежности; это естественнее и выразительнее, чем более нейтральное «наш предок».
- source_word: ἐξ ἔργων
  choice: делами
  rationale: Творительный падеж естественно передаёт основание или средство, выраженное ἐξ с родительным, и сохраняет ключевую богословскую формулировку контекста.
- source_word: ἐδικαιώθη
  choice: был оправдан
  rationale: Сохраняет прямую лексическую связь с темой оправдания и не снимает напряжение между декларативным и удостоверяющим оттенками глагола δικαιόω.
- source_word: ἀνενέγκας
  choice: когда вознёс
  rationale: Деепричастие аориста здесь естественно передаётся временным придаточным; «вознёс» сохраняет жертвенный оттенок ἀναφέρω, то есть принесение жертвы на жертвеннике.
- source_word: θυσιαστήριον
  choice: жертвенник
  rationale: Точное и общепонятное обозначение сооружения для жертвоприношения; в данном контексте точнее общего слова «алтарь».
- source_word: οὐκ ... ἐδικαιώθη;
  choice: Разве не ... был оправдан?
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, естественной русской конструкцией.
theological_decisions:
- issue: Значение δικαιόω в Иакова 2:21 в связи с делами
  choice: В основном тексте — «был оправдан».
  alternative: «был признан праведным»; «показал свою праведность»; «его праведность была подтверждена».
  rationale: «Был оправдан» сохраняет терминологическую связь с более широкой новозаветной дискуссией об оправдании и не сводит смысл заранее ни только к судебному объявлению, ни только к явному подтверждению праведности. Возможные оттенки отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Порядок «Авраам, наш отец» звучит естественно и сохраняет акцент исходного текста; «своего сына Исаака» избегает тяжеловесного буквального повтора местоимения.
