  text: Ἀδελφοί μου, μὴ ἐν προσωπολημψίαις ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/001.yaml
  text: My brothers[d][c][b][a], do not hold the faith of our Lord Jesus the Messiah with partiality.
translation:
  language: ru
  text: Братья мои[a], не сочетайте веру нашего Господа Иисуса Мессии, Господа славы[c], с лицеприятием.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Братья и сёстры»; по-гречески буквально «братья», но обращение относится к верующей общине в целом.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «нашего славного Господа Иисуса Мессию».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Братья мои
  rationale: Сохраняет грамматически мужское обращение оригинала; в данном контексте оно обращено ко всей общине, что поясняется в сноске.
- source_word: μὴ ... ἔχετε
  choice: не совмещайте
  rationale: Передаёт запрет настоящего времени и естественно связывает веру с осуждаемым образом поведения, не ослабляя повелительной силы.
- source_word: ἐν προσωπολημψίαις
  choice: с лицеприятием
  rationale: «Лицеприятие» точно обозначает пристрастное отношение к людям по их положению или внешним признакам; греческое множественное число по-русски естественно передаётся отвлечённым существительным в единственном числе.
- source_word: τὴν πίστιν
  choice: веру
  rationale: Основное значение πίστις сохранено без добавления отсутствующего в тексте притяжательного местоимения.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: нашего Господа Иисуса Мессии
  rationale: Формальная родительная конструкция сохраняет возможную неоднозначность связи с πίστις; Χριστός передано как действующий титул «Мессия».
- source_word: τῆς δόξης
  choice: Господа славы
  rationale: Передаёт библейскую конструкцию родительного падежа и её возвышенную христологическую силу, относя «славу» к Господу Иисусу Мессии.
theological_decisions:
- issue: Связь родительного оборота τοῦ κυρίου ... с πίστιν
  choice: «веру нашего Господа Иисуса Мессии»
  alternative: «веру в нашего Господа Иисуса Мессию»
  rationale: Греческий родительный допускает более одного понимания. Основной текст сохраняет его форму, а сноска даёт естественное по-русски объектное прочтение, не выдавая его за единственно возможное.
- issue: Значение Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В торжественной последовательности титулов слово сохраняет значение мессианского звания, а не выступает только как привычная часть имени.
- issue: Отнесение τῆς δόξης
  choice: «Господа славы» как приложение к Иисусу Мессии
  alternative: «нашего славного Господа Иисуса Мессию»
  rationale: Так сохраняется компактный библейский оборот и не сводится δόξα лишь к качественному прилагательному.
- issue: Объём обращения Ἀδελφοί
  choice: «Братья» в основном тексте
  alternative: «Братья и сёстры»
  rationale: Основной текст отражает грамматическую форму оригинала; вероятное обращение ко всей смешанной общине отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского наставления. «Лицеприятие» несколько книжное, но остаётся понятным и здесь точнее разговорных вариантов «фаворитизм» или «предвзятость». Порядок слов близок к греческому там, где это помогает сохранить смысловую неоднозначность.
