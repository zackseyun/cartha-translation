lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Послушайте же
  rationale: Идиоматическое побуждение, вводящее резкое пророческое обращение; передаёт настойчивость без архаического оттенка.
- source_word: οἱ πλούσιοι
  choice: богатые
  rationale: Именительный падеж употреблён как обращение; русская форма естественно сохраняет прямоту и широту адресата.
- source_word: κλαύσατε
  choice: плачьте
  rationale: Повелительная форма призывает к явному скорбному плачу и сохраняет весомость греческого глагола.
- source_word: ὀλολύζοντες
  choice: рыдайте
  rationale: Причастие усиливает повеление, обозначая громкий, открытый плач; однородная повелительная форма звучит естественно по-русски.
- source_word: ἐπὶ ταῖς ταλαιπωρίαις
  choice: о бедствиях
  rationale: Предлог с дательным указывает на основание или повод для плача; «о» естественно выражает предмет скорби.
- source_word: ταλαιπωρίαις
  choice: бедствиях
  rationale: Слово обозначает тяжёлые несчастья и бедственное положение; «бедствия» соответствует контексту грядущего суда, не сужая смысл до личных переживаний.
- source_word: ταῖς ἐπερχομέναις
  choice: которые надвигаются на вас
  rationale: Передаёт приближение бедствий и их направленность на адресатов, не усиливая степень непосредственной близости.
theological_decisions:
- issue: Тон и адресат обращения к богатым
  choice: Пророческое обличение богатых людей, которым грозят надвигающиеся бедствия или суд, без уточнения их принадлежности к верующим либо неверующим.
  alternative: Обращение исключительно к неверующим землевладельцам-угнетателям или исключительно к богатым членам христианской общины.
  rationale: Сам стих прямо обращён к «богатым» и возвещает грядущие бедствия, однако в этой строке их религиозный статус не определён; перевод сохраняет эту намеренную широту и напряжение.
translation_notes:
  register: Современный литературный русский язык с резким пророческим тоном. «Послушайте же» передаёт функцию Ἄγε νῦν естественнее буквального «Ну же». Пара «плачьте и рыдайте» сохраняет усиление, заложенное в повелении и сопровождающем причастии.
