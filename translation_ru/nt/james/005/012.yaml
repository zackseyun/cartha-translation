source:
  edition: SBLGNT
  text: Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ⸂ὑπὸ κρίσιν⸃ πέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/012.yaml
  text: But above all[a], my brothers, do not swear, either by heaven or by earth or by any other oath. Instead, let your yes be yes and your no, no[b], so that you may not fall under judgment.
translation:
  language: ru
  text: Но прежде всего, братья мои[a], не клянитесь ни небом, ни землёй, ни какой-либо другой клятвой. Пусть ваше «да» будет «да», а ваше «нет» — «нет», чтобы вам не подпасть под суд[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры мои»; в греческом тексте стоит «братья», но обращение, вероятно, относится ко всей общине верующих.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы вам не подпасть под осуждение».'
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: прежде всего
  rationale: Естественное русское выражение, передающее первостепенную важность увещания; не обязательно указывает на временную последовательность.
- source_word: ἀδελφοί μου
  choice: братья мои
  rationale: Сохраняет грамматически мужскую форму греческого обращения и его тёплый характер; вероятное обращение ко всей общине поясняется в сноске.
- source_word: μὴ ὀμνύετε
  choice: не клянитесь
  rationale: Передаёт общий запрет на принесение клятв; дальнейшее перечисление ясно показывает, что речь не о бранной речи.
- source_word: μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον
  choice: ни небом, ни землёй и никакой другой клятвой
  rationale: Сохраняет последовательность запретов и всеохватность последнего выражения, оставаясь естественным по-русски.
- source_word: ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: Пусть ваше «да» будет «да», а ваше «нет» — «нет»
  rationale: Сохраняет краткую, афористичную форму греческого текста и подчёркивает прямоту и достоверность речи без добавочного толкования.
- source_word: ἵνα μὴ ὑπὸ κρίσιν πέσητε
  choice: чтобы вам не подпасть под суд
  rationale: «Подпасть под суд» естественно передаёт сочетание предлога ὑπό с метафорическим πέσητε и сохраняет более широкое значение κρίσις, не сужая его до осуждения.
theological_decisions:
- issue: 'Передача κρίσις: «суд» или более сильное «осуждение»'
  choice: суд
  alternative: осуждение
  rationale: Кρίσις обозначает суд или судебное решение и само по себе не требует более узкого смысла окончательного осуждения; основной текст сохраняет эту смысловую широту, а вариант отмечен в сноске.
- issue: Охват обращения ἀδελφοί
  choice: братья мои
  alternative: братья и сёстры мои
  rationale: Основной текст сохраняет форму оригинала, тогда как сноска сообщает, что в данном общинном обращении она, вероятно, включает всех верующих.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и умеренно формальным библейским регистром. Краткая афористичность второй половины стиха сохранена; кавычки помогают воспринимать «да» и «нет» как слова-ответы.
