base_translation:
  language: en
  yaml_path: translation/nt/james/005/010.yaml
  text: Brothers[a], take the prophets who spoke in the name of the Lord as an example of suffering and patience.
translation:
  language: ru
  text: Братья[a], возьмите пророков, говоривших от имени Господа, как пример страданий и долготерпения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переведённое как «братья», имеет форму мужского рода; в этом обращении Иаков, вероятно, имеет в виду всю общину верующих, включая женщин.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα λάβετε
  choice: возьмите себе в пример
  rationale: Естественно передаёт повелительную конструкцию «возьмите как образец», сохраняя призыв подражать пророкам.
- source_word: ἀδελφοί
  choice: Братья
  rationale: Сохраняет грамматически мужскую форму греческого обращения; вероятное обращение ко всей общине поясняется в сноске.
- source_word: κακοπαθίας
  choice: страдания
  rationale: Передаёт тяготы и бедствия, переносимые пророками; форма родительного падежа соответствует зависимости от «пример».
- source_word: μακροθυμίας
  choice: долготерпения
  rationale: Сохраняет оттенок длительного терпения перед лицом страданий и хорошо отражает μακροθυμία в данном увещательном контексте.
- source_word: τοὺς προφήτας
  choice: пророков
  rationale: Прямо называет тех, кого следует взять в пример.
- source_word: ἐλάλησαν
  choice: говорили
  rationale: Простое и точное соответствие обычному значению λαλέω без усиления до «возвещали» или «провозглашали».
- source_word: ἐν τῷ ὀνόματι κυρίου
  choice: от имени Господа
  rationale: Естественный русский библейский оборот, выражающий представительство и власть Господа; по смыслу соответствует греческому «в имени Господа».
theological_decisions:
- issue: Род обращения ἀδελφοί и охват адресатов
  choice: «Братья» в основном тексте с пояснением в сноске
  alternative: «Братья и сёстры»
  rationale: Греческая форма грамматически мужского рода, но в послании, вероятно, охватывает всю общину. Перевод сохраняет форму источника, а возможную включённость женщин поясняет сноска.
- issue: Связь пророков с ὑπόδειγμα и родительными κακοπαθίας καὶ μακροθυμίας
  choice: «возьмите себе в пример страдания и долготерпения пророков»
  alternative: «возьмите пророков в пример страдания и долготерпения»
  rationale: Выбранная русская конструкция ясно показывает, что примером служит перенесение пророками страданий с долготерпением, не превращая абстрактные качества в самостоятельный объект подражания.
- issue: Значение ἐν τῷ ὀνόματι κυρίου
  choice: «от имени Господа»
  alternative: «именем Господа» / «во имя Господа»
  rationale: «От имени» наиболее ясно сохраняет идею уполномоченного представительства, не исключая более широкого библейского смысла принадлежности и власти.
translation_notes:
  register: Современный литературный русский с достоинством библейского увещания. «Долготерпение» несколько возвышенно, но понятно и точнее, чем общее «терпение», передаёт продолжительность стойкого ожидания. Маркер [a] помещён непосредственно после обращения.
