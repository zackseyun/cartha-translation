lexical_decisions:
- source_word: Κακοπαθεῖ
  choice: злострадает
  rationale: Глагол обозначает перенесение бед, тягот или страданий без сужения смысла до болезни либо гонений; «злострадает» кратко и точно передаёт этот широкий смысл в библейском, но понятном регистре.
- source_word: τις
  choice: кто-нибудь
  rationale: Неопределённое местоимение имеет единственное число и обобщающее значение; русское «кто-нибудь» естественно сохраняет обе особенности.
- source_word: ἐν ὑμῖν
  choice: из вас
  rationale: В вопросительной конструкции «кто-нибудь из вас» естественно указывает на человека внутри общины и по-русски звучит лучше буквального «среди вас».
- source_word: προσευχέσθω
  choice: пусть молится
  rationale: Форма третьего лица единственного числа передаёт побуждение; настоящее время допускает понимание молитвы как надлежащего, продолжающегося отклика на страдание.
- source_word: εὐθυμεῖ
  choice: в добром расположении
  rationale: Глагол означает быть бодрым, мужественным или в хорошем расположении духа. Выбор сохраняет широту значения и не сводит его только к веселью.
- source_word: ψαλλέτω
  choice: пусть поёт хвалу
  rationale: В данном контексте глагол обозначает хвалебное пение, обращённое к Богу; формулировка остаётся доступной и не ограничивает смысл исключительно каноническими псалмами.
theological_decisions:
- issue: Обобщающие конструкции единственного числа
  choice: 'Сохранить единственное число: «кто-нибудь… пусть молится / пусть поёт»'
  alternative: 'Передать множественным числом: «пусть они молятся / поют»'
  rationale: Греческий текст последовательно использует неопределённое местоимение и повелительные формы третьего лица в единственном числе. Русская конструкция естественно сохраняет грамматику и обобщающий смысл без указания на пол.
- issue: Значение ψαλλέτω
  choice: «пусть поёт хвалу»
  alternative: «пусть поёт псалмы»
  rationale: Глагол может обозначать пение псалмов, но также шире — хвалебное пение. Основной текст передаёт вероятный широкий смысл, а более узкая возможность сохранена в примечании без превращения стиха в конкретное литургическое предписание.
translation_notes:
  register: Современный литературный русский с краткими параллельными вопросами и побуждениями, соответствующими структуре греческого текста. «Злострадает» несколько возвышенно, но понятно и семантически точнее разговорных вариантов; «в добром расположении» сохраняет оттенок бодрости и хорошего духа.
