  terminology: «Иов», «Господь», «блаженными», «сострадания» и «милосерден» уместны для современного литературного библейского регистра. «Какой исход даровал Господь» — допустимое контекстуальное раскрытие τὸ τέλος κυρίου как исхода, произведённого Господом; оно не сводит выражение к «цели» и не создаёт ложного значения смерти Господа.
