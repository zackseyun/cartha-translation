  source_fidelity: 'Основной смысл передан точно: μακαρίζομεν — «называем блаженными», обе формы ὑπομένω — «выстоял / стойкость», а πολύσπλαγχνος и οἰκτίρμων различены как сострадание и милосердие. Однако «потому что» чрезмерно фиксирует ὅτι как прямую причинную связь. Здесь союз естественнее передать как пояснение того, что было усмотрено в исходе, не навязывая более узкую логическую связь.'
