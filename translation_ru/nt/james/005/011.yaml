source:
  edition: SBLGNT
  text: ἰδοὺ μακαρίζομεν τοὺς ⸀ὑπομείναντας· τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου ⸀εἴδετε, ὅτι πολύσπλαγχνός ἐστιν ⸂ὁ κύριος⸃ καὶ οἰκτίρμων.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/011.yaml
  text: Behold, we count those who have endured as blessed. You have heard of Job’s endurance, and you have seen the Lord’s outcome, that the Lord is very compassionate and merciful.
translation:
  language: ru
  text: Вот, мы называем блаженными тех, кто выстоял. Вы слышали о стойкости Иова и видели, какой исход даровал Господь, — ведь Господь исполнен сострадания и милосерден.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακαρίζομεν
  choice: называем блаженными
  rationale: Передаёт значение признания людей блаженными, не смешивая его с обычным пожеланием счастья.
- source_word: ὑπομείναντας / ὑπομονήν
  choice: тех, кто выстоял / стойкости
  rationale: Сохраняет смысл терпеливой верности под испытанием и естественно звучит по-русски.
- source_word: τὸ τέλος κυρίου
  choice: какой исход даровал Господь
  rationale: τέλος здесь обозначает итог или исход, связанный с Господом; формулировка сохраняет направленность фразы и избегает менее вероятного понимания как «смерти Господа».
- source_word: πολύσπλαγχνος
  choice: исполнен сострадания
  rationale: Выражает усиленное значение глубокого, сердечного сострадания.
- source_word: οἰκτίρμων
  choice: милосерден
  rationale: Естественный и точный эквивалент качества милости и жалости.
theological_decisions:
- issue: Значение τὸ τέλος κυρίου
  choice: какой исход даровал Господь
  alternative: цель Господа; конец Господа
  rationale: Контекст Иова указывает на итог, который Господь произвёл или даровал. Перевод не подменяет «исход» более толковательным словом «цель» и не создаёт ошибочного впечатления, будто речь идёт о смерти Господа.
- issue: Связь заключительного ὅτι
  choice: потому что
  alternative: что
  rationale: 'Союз вводит основание для восприятия Господнего исхода: он обнаруживает глубокое сострадание и милость Господа.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Вот» сохраняет риторическое ἰδού; «Иов» дан в традиционной русской форме. Пара «исполнен сострадания и милосерден» сохраняет два различных греческих определения.
