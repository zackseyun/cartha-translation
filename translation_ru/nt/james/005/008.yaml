base_translation:
  language: en
  yaml_path: translation/nt/james/005/008.yaml
  text: You also be patient; strengthen your hearts[a], because the coming of the Lord has drawn near.
translation:
  language: ru
  text: И вы будьте терпеливы; укрепите свои сердца, потому что пришествие[a] Господа уже близко.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «присутствие». Греческое слово может означать как присутствие, так и прибытие; здесь контекст указывает на ожидаемое пришествие Господа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακροθυμήσατε
  choice: будьте терпеливы
  rationale: Аорист, действительный залог, повелительное наклонение, 2-е лицо множественного числа. Глагол призывает терпеливо переносить трудности в течение времени; этот естественный русский эквивалент соответствует контексту ожидания в Иак. 5:7–8.
- source_word: καὶ ὑμεῖς
  choice: и вы
  rationale: Сочетание связывает обращение к читателям с примером земледельца в предыдущем стихе и подчёркивает, что им также следует проявлять терпение.
- source_word: στηρίξατε
  choice: укрепите
  rationale: Аорист, действительный залог, повелительное наклонение, 2-е лицо множественного числа. Передаёт призыв утвердиться внутренне и обрести стойкость.
- source_word: τὰς καρδίας ὑμῶν
  choice: свои сердца
  rationale: Сохранена библейская метафора сердца как средоточия воли, решимости и внутренней жизни; возвратное «свои» естественно при обращении к читателям.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание для двух предшествующих повелений.
- source_word: ἡ παρουσία
  choice: пришествие
  rationale: В контексте Иак. 5:7–8 слово обозначает ожидаемое эсхатологическое прибытие Господа. В сноске сохранено его буквальное лексическое значение «присутствие».
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: «Господь» — естественная и традиционно узнаваемая передача титула κύριος в новозаветном эсхатологическом контексте.
- source_word: ἤγγικεν
  choice: уже близко
  rationale: Перфект действительного залога указывает на достигнутую близость и сохраняющееся состояние. Русское «уже близко» естественно выражает этот результирующий смысл, не утверждая, что событие уже произошло.
theological_decisions:
- issue: Значение παρουσία в эсхатологическом высказывании о Господе
  choice: пришествие Господа
  alternative: присутствие Господа
  rationale: Контекст ожидания в Иак. 5:7–8 указывает на будущее явление или прибытие Господа. Однако поскольку παρουσία также буквально означает «присутствие», эта подлинная лексическая возможность отмечена в сноске.
- issue: Смысл перфекта ἤγγικεν применительно к пришествию
  choice: уже близко
  alternative: приблизилось
  rationale: Формулировка передаёт нынешнее состояние близости как основание для терпения, не превращая перфект в утверждение о состоявшемся пришествии и не уточняя способ или сроки его исполнения.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской метафоры «сердца». Синтаксис краткий и увещевательный; «уже близко» звучит естественнее буквального «приблизилось» и передаёт результирующее значение греческого перфекта.
