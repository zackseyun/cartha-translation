source:
  edition: SBLGNT
  text: ⸀γινωσκέτω ὅτι ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν ⸀αὐτοῦ ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/020.yaml
  text: let him know that whoever turns a sinner back from the error of his way will save his soul from death and will cover a multitude of sins[a][b].
translation:
  language: ru
  text: 'Пусть он знает: тот, кто вернёт грешника с ложного пути, спасёт его душу от смерти[a][b] и покроет множество грехов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасёт его жизнь от смерти». Греческое слово может означать и «душу», и «жизнь».'
    reason: lexical_alternative
  - marker: b
    text: Местоимение «его» может относиться к грешнику, которого вернули с ложного пути; некоторые понимают его как указание на того, кто вернул грешника.
    reason: alternative_reading
lexical_decisions:
- source_word: γινωσκέτω
  choice: Пусть он знает
  rationale: Форма третьего лица единственного числа настоящего времени повелительного наклонения передана прямым увещанием, естественным для современного русского языка.
- source_word: ὁ ἐπιστρέψας
  choice: тот, кто обратит
  rationale: Субстантивированное причастие имеет обобщающий смысл. «Обратит» передаёт возвращение заблудившегося на верный путь, не вводя специального конфессионального значения.
- source_word: ἁμαρτωλὸν
  choice: грешника
  rationale: Неопределённое обозначение человека как представителя категории естественно передаётся по-русски без артикля или дополнительного местоимения.
- source_word: ἐκ πλάνης ὁδοῦ αὐτοῦ
  choice: с его ошибочного пути
  rationale: Формулировка сохраняет образ пути и передаёт πλάνη как ошибочность и уклонение, оставаясь понятной и естественной по-русски.
- source_word: σώσει
  choice: спасёт
  rationale: Стандартное соответствие σῴζω сохраняет как смысл избавления, так и богословскую весомость выражения.
- source_word: ψυχὴν αὐτοῦ
  choice: его душу
  rationale: «Душу» формально сохраняет основное лексическое соответствие ψυχή, а местоимение «его» не устраняет неоднозначность того, к кому оно относится.
- source_word: ἐκ θανάτου
  choice: от смерти
  rationale: Буквальная и естественная передача не уточняет, идёт ли речь о физической, духовной или всеобъемлющей смерти.
- source_word: καλύψει
  choice: покроет
  rationale: Сохраняется библейский образ покрытия грехов без истолковывающего уточнения.
- source_word: πλῆθος ἁμαρτιῶν
  choice: множество грехов
  rationale: Точная и стилистически достойная передача собирательного выражения.
theological_decisions:
- issue: К кому относится αὐτοῦ в ψυχὴν αὐτοῦ
  choice: В основном тексте оставлено неоднозначное «его душу»
  alternative: душу возвращённого грешника; душу того, кто его обратил
  rationale: Грамматика допускает обе соотнесённости, хотя ближайшим и более вероятным референтом является грешник. Перевод не устраняет заложенную в тексте неоднозначность.
- issue: Значение ψυχή и характер θάνατος
  choice: «душу от смерти» без дальнейшего уточнения
  alternative: «жизнь от смерти»; «душу от духовной смерти»
  rationale: Источник допускает значение «душа» или «жизнь» и не определяет вид смерти; основной текст сохраняет эту богословскую широту, а лексическая альтернатива вынесена в примечание.
- issue: Чьи грехи составляют «множество грехов»
  choice: Референт не уточняется
  alternative: грехи обращённого грешника; грехи того, кто его обратил
  rationale: В греческом тексте принадлежность грехов прямо не обозначена, поэтому перевод не добавляет притяжательного определения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис остаётся ясным для широкого круга читателей; традиционные слова «спасёт», «душу» и «покроет множество грехов» сохраняют межтекстовые и богословские связи без конфессионального уточнения.
