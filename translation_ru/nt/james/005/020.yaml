  rationale: Исправлено управление при описании возвращения грешника с ложного пути и устранено необязательное предпочтение одного антецедента в примечании. Смысл, образ пути, лексическая альтернатива ψυχή («душа»/«жизнь»), а также неоднозначность αὐτοῦ сохранены.
