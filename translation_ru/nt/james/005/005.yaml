  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ⸀ὑμῶν ἐν ἡμέρᾳ σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/005.yaml
  text: You have lived in luxury on the earth and indulged yourselves[d][c][b][a]; you have fattened your hearts in a day of slaughter.
translation:
  language: ru
  text: Вы жили на земле в роскоши[a] и предавались излишествам[b]; вы откормили свои сердца в день заклания[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жили в неге».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жили, потворствуя своим желаниям».'
    reason: lexical_alternative
  - marker: c
    text: Здесь возникает образ животных, которых откармливают перед убоем; вероятно, он указывает на грядущий суд.
    reason: cultural_note
  - marker: d
    text: 'Или: «ко дню заклания».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτρυφήσατε
  choice: жили в роскоши
  rationale: Глагол обозначает жизнь в неге, удовольствиях и роскоши. Такой перевод естественен по-русски и сохраняет обличительный смысл, не сводя его к простому наслаждению жизнью.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: γῆ может означать «земля» или «страна»; в общем обличении богатых уместен более широкий смысл «на земле».
- source_word: ἐσπαταλήσατε
  choice: предавались излишествам
  rationale: Глагол усиливает предыдущую мысль и указывает на расточительное, потворствующее желаниям существование. Выражение сохраняет нравственную оценку и звучит современно.
- source_word: ἐθρέψατε
  choice: откормили
  rationale: Хотя основное значение — «питать, кормить», контекст заклания создаёт иронический образ животных, откормленных перед убоем. «Откормили» передаёт эту связь.
- source_word: τὰς καρδίας ὑμῶν
  choice: свои сердца
  rationale: Буквальный образ сохраняет библейское представление о сердце как внутреннем центре человека и не заменяет его поясняющим пересказом.
- source_word: ἐν ἡμέρᾳ σφαγῆς
  choice: в день заклания
  rationale: Перевод близко передаёт ἐν и сохраняет резкий метафорический образ. «Заклание» здесь уместно как понятное литературное слово, связанное с убоем жертвенного или иного животного.
theological_decisions:
- issue: Смысл образа «день заклания»
  choice: Сохранить образ надвигающегося заклания, не называя прямо Божий суд в основном тексте.
  alternative: Передать как прямое указание на день Божьего суда либо связать с убийством невинных в ближайшем контексте.
  rationale: Контекст убедительно предполагает суд, однако греческий текст оставляет образ без прямого пояснения. Его сохранение не устраняет богословскую напряжённость и не уточняет референт сверх сказанного.
- issue: Временное или целевое значение ἐν ἡμέρᾳ σφαγῆς
  choice: в день заклания
  alternative: ко дню заклания
  rationale: Предлог ἐν формально поддерживает временное значение «в день», тогда как образ откорма допускает целевое понимание «ко дню». Основной текст следует более прямому значению, а смысловая альтернатива вынесена в примечание.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. «Предавались излишествам» передаёт нравственное обличение без архаичного оттенка, а «заклание» сохраняет жёсткую образность и связь с откормом перед убоем.
