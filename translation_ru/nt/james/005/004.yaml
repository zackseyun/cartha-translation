  text: ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ⸀ἀφυστερημένος ἀφ’ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ ⸀εἰσεληλύθασιν·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/004.yaml
  text: Look[a], the wages of the workers who harvested your fields, which have been withheld by you, are crying out, and the cries of those who did the harvesting have entered into the ears of the Lord of Hosts.
translation:
  language: ru
  text: Вот, плата работников, сжавших ваши поля, которую вы удерживаете, взывает, и крики жнецов дошли до ушей Господа Воинств[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господа Саваофа». Греческий текст сохраняет еврейское слово «Саваоф» («воинства») в составе божественного титула.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Вот
  rationale: Естественное для современного литературного русского указательное слово, сохраняющее призыв обратить внимание и обличительную выразительность.
- source_word: μισθὸς
  choice: плата
  rationale: Обозначает причитающееся работникам вознаграждение; «плата» естественна в единственном числе и согласуется с греческим сказуемым.
- source_word: ἐργατῶν
  choice: работников
  rationale: Современное общее обозначение наёмных тружеников, уместное в сельскохозяйственном контексте.
- source_word: ἀμησάντων
  choice: сжавших
  rationale: Передаёт уборку урожая и сохраняет связь с образом жатвы; форма причастия соответствует греческой конструкции.
- source_word: χώρας
  choice: поля
  rationale: В контексте землевладельцев слово обозначает возделываемые земельные угодья.
- source_word: ἀφυστερημένος ἀφ’ ὑμῶν
  choice: которую вы удержали
  rationale: Передаёт незаконное удержание причитающейся платы без добавления более узкого толкования «обманом присвоили».
- source_word: κράζει
  choice: вопиёт
  rationale: Сохраняет настоящее время, единственное число и яркую персонификацию платы, взывающей о справедливости.
- source_word: βοαὶ
  choice: крики
  rationale: Прямо передаёт громкие настойчивые возгласы пострадавших.
- source_word: θερισάντων
  choice: жнецов
  rationale: Краткое и понятное обозначение людей, убиравших урожай; сохраняет сельскохозяйственный образ.
- source_word: εἰς τὰ ὦτα
  choice: дошли до ушей
  rationale: Естественная русская передача семитского образа, не сводящая его к абстрактному «были услышаны».
- source_word: Κυρίου Σαβαὼθ
  choice: Господа Воинств
  rationale: Переводит божественный титул по его ветхозаветному смыслу, сохраняя «Господь» как передачу κύριος; транслитерация отмечена в сноске.
- source_word: εἰσεληλύθασιν
  choice: дошли
  rationale: Передаёт совершившееся достижение с сохраняющимся результатом и естественно сочетается с выражением «до ушей».
theological_decisions:
- issue: Передача божественного титула Κυρίου Σαβαὼθ
  choice: Господа Воинств
  alternative: Господа Саваофа
  rationale: Σαβαώθ воспроизводит еврейское слово со значением «воинства»; перевод титула делает его смысл понятным, а традиционная транслитерация сохраняется в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Вот» и «вопиёт» сохраняют обличительную силу, а синтаксис остаётся ясным для обычного читателя.
