  source_fidelity: 'Греческое ἀφυστερημένος — перфектное страдательное причастие: плата удержана/удерживается самими адресатами. Формулировка «которую вы удержали» возможна, но неоправданно представляет удержание как завершённое прошлое действие; «которую вы удерживаете» яснее передаёт продолжающийся результат обвинения. Остальные ключевые элементы переданы точно: сельскохозяйственные работники, их крики, образ достижения «ушей» Господа и титул Κυρίου Σαβαώθ.'
  naturalness: Текст в целом ясен и выдержан в литературно-библейском регистре. «Взывает» сохраняет силу κράζει, но звучит современнее и естественнее, чем несколько архаичное «вопиёт». «Сжавших ваши поля» допустимо в литературной библейской речи и удачно сохраняет образ жатвы.
  terminology: '«Господь Воинств» — точная смысловая передача титула, а «Господь Саваоф» уместно приведён как вариант. Однако сноска неточно называет значением одного слова Σαβαώθ весь титул «Господь Воинств»: Σαβαώθ означает «воинства/силы», тогда как κύριος соответствует «Господь». Сноска исправлена.'
