source:
  edition: SBLGNT
  text: μὴ στενάζετε, ⸂ἀδελφοί, κατ’ ἀλλήλων⸃, ἵνα μὴ κριθῆτε· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/009.yaml
  text: Do not grumble against one another[a], brothers, so that you may not be judged. Look, the Judge is standing at the doors.
translation:
  language: ru
  text: Не сетуйте друг на друга, братья[a], чтобы не быть судимыми. Вот, Судья стоит у дверей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переведённое как «братья», в таком обращении может относиться ко всей общине верующих, включая женщин.
    reason: lexical_alternative
lexical_decisions:
- source_word: στενάζετε
  choice: сетовать
  rationale: В сочетании с κατ’ ἀλλήλων глагол обозначает недовольную жалобу, направленную против других. «Сетовать друг на друга» естественно передаёт этот межличностный и нравственный оттенок, не сводя смысл к физическому стону.
- source_word: ἀδελφοί
  choice: братья
  rationale: Форма мужского рода сохраняется в основном тексте; в обращении к общине она может охватывать и мужчин, и женщин, что пояснено в сноске.
- source_word: κατ’ ἀλλήλων
  choice: друг на друга
  rationale: κατά с родительным здесь выражает направленность жалобы против других членов общины.
- source_word: κριθῆτε
  choice: быть судимыми
  rationale: Пассивная форма κρίνω означает подвергнуться суду, не предрешая обвинительного исхода; «быть осуждёнными» было бы чрезмерно определённо.
- source_word: κριτής
  choice: Судья
  rationale: Существительное указывает на эсхатологического божественного Судью. Заглавная буква передаёт титульное употребление, не уточняя референта сверх греческого текста.
- source_word: πρὸ τῶν θυρῶν
  choice: у дверей
  rationale: Сохранено множественное число θυρῶν; выражение образно подчёркивает непосредственную близость.
- source_word: ἕστηκεν
  choice: стоит
  rationale: 'Греческий перфект описывает наличное состояние: Судья уже занял место и теперь стоит в готовности.'
theological_decisions:
- issue: Кого обозначает «Судья»
  choice: Оставить титул «Судья» без дальнейшего уточнения
  alternative: Прямо назвать Господа, Христа или Бога
  rationale: Контекст указывает на близкий эсхатологический суд и, вероятнее всего, на Господа, однако сам стих не называет Судью прямо; перевод сохраняет эту богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с краткой, настойчивой формой увещевания. «Не сетуйте» звучит достойно и понятно, а «Вот» сохраняет живую указательную силу ἰδού. Множественное «у дверей» намеренно следует исходному тексту.
