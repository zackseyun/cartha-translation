  verdict: approve
  source_fidelity: '«Не сетуйте друг на друга, братья, чтобы не быть судимыми. Вот, Судья стоит у дверей» точно передаёт все смысловые элементы греческого текста: запрет στενάζετε в его межличностном контексте, κατ’ ἀλλήλων, цель ἵνα μὴ κριθῆτε, указательное ἰδού и образ близости πρὸ τῶν θυρῶν. Пассивное «быть судимыми» не подменяет суд осуждением. Множественное число «дверей» сохранено.'
  naturalness: Текст краток, ясен и соответствует современному литературному русскому. «Не сетуйте друг на друга» несколько более книжно, чем «не ропщите» или «не жалуйтесь», но это естественное литературное увещевание и удачно выражает недовольную жалобу, а не физический стон. «Вот» и «стоит у дверей» звучат живо и без архаизации.
  terminology: «Братья» корректно отражает ἀδελφοί; сноска уместно поясняет возможное инклюзивное обращение к общине, не изменяя форму основного текста. «Судья» с прописной буквы допустимо передаёт титульную и эсхатологическую функцию без догматического уточнения референта. Сноска привязана к слову «братья» и содержательно точна.
