lexical_decisions:
- source_word: κατεδικάσατε
  choice: вы осудили
  rationale: Аорист, действительный залог, второе лицо множественного числа. «Осудили» естественно и точно сохраняет судебный смысл глагола без лишнего пояснения.
- source_word: ἐφονεύσατε
  choice: убили
  rationale: Глагол обозначает предосудительное, неправомерное лишение жизни. В русском «убили» в прямом обвинении звучит достаточно сильно и естественнее, чем более узкое «совершили убийство».
- source_word: τὸν δίκαιον
  choice: праведника
  rationale: Субстантивированное прилагательное мужского рода в единственном числе. «Праведник» передаёт и грамматическую форму, и нравственно-религиозный смысл, не определяя однозначно, идёт ли речь о конкретном лице или о типичном невинно угнетённом человеке.
- source_word: οὐκ ἀντιτάσσεται ὑμῖν
  choice: он не противится вам
  rationale: ἀντιτάσσομαι означает «противиться, выступать против». Утвердительная форма ясно передаёт обычное контекстуальное понимание фразы; вопросительная пунктуация SBLGNT отмечена в сноске.
theological_decisions:
- issue: Кого обозначает «праведник»
  choice: В основном тексте сохранено неопределённое обозначение «праведник», допускающее собирательно-представительное понимание.
  alternative: Возможен отголосок именования Иисуса «Праведником».
  rationale: Ближайший контекст говорит об угнетении праведного бедняка богатыми и не требует прямого отождествления с Иисусом. При этом формулировка не исключает христологического отзвука.
- issue: Сила заключительной фразы
  choice: 'Утвердительное предложение: «Он не противится вам».'
  alternative: 'Вопросительное прочтение: «Разве он не противится вам?»'
  rationale: Хотя SBLGNT ставит вопросительный знак, фразу часто понимают как указание на беззащитность праведника. Утвердительный перевод естественен по-русски, а формальная возможность вопросительного чтения сохранена в сноске.
translation_notes:
  register: 'Современный литературный русский язык; краткий, обличительный ритм оригинала сохранён бессоюзием: «осудили, убили». Слово «праведник» достоинственно и понятно широкому читателю, а неоднозначность референта и пунктуации вынесена в сноски.'
