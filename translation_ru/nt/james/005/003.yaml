  text: ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/003.yaml
  text: Your gold and silver have rusted[a], and their corrosion will be evidence against you and will eat your flesh like fire[b]. You have stored up treasure in the last days.
translation:
  language: ru
  text: Ваше золото и серебро покрылись ржавчиной[a], и эта ржавчина будет свидетельствовать против вас и пожрёт вашу плоть, как огонь[b]. Вы накопили сокровища в последние дни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «заржавели». Здесь слово шире обозначает порчу или коррозию металла, хотя золото и серебро не ржавеют в обычном смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Вы накопили огонь в последние дни». Оборот «как огонь» можно отнести не к словам «пожрёт вашу плоть», а к заключительной фразе.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατίωται
  choice: покрылись ржавчиной
  rationale: Перфект передаёт нынешнее состояние как результат уже произошедшего процесса. Хотя золото и серебро в строгом смысле не ржавеют, образ намеренно говорит о порче накопленного богатства; русское выражение сохраняет наглядность греческого текста.
- source_word: ἰὸς
  choice: ржавчина
  rationale: В контексте металлов слово обозначает продукт или след коррозии. «Ржавчина» непосредственно связывает его с предшествующим глаголом и сохраняет единый образ.
- source_word: εἰς μαρτύριον ὑμῖν
  choice: будет свидетельствовать против вас
  rationale: Фраза имеет судебный оттенок. Такой перевод естественно передаёт образ свидетельства и подразумеваемую направленность обвинения.
- source_word: φάγεται τὰς σάρκας ὑμῶν
  choice: пожрёт вашу плоть
  rationale: Выбранное выражение сохраняет резкий и конкретный образ греческого текста. Единственное число «плоть» естественнее по-русски при собирательном обращении, тогда как греческое множественное число буквально означает «ваши плоти».
- source_word: ὡς πῦρ
  choice: как огонь
  rationale: 'Оборот наиболее естественно относится к предшествующему глаголу: ржавчина пожрёт плоть подобно огню. Возможная иная синтаксическая связь отмечена в сноске.'
- source_word: ἐθησαυρίσατε
  choice: накопили сокровища
  rationale: Глагол содержит идею собирания и хранения сокровищ. Перевод передаёт эту лексику, не усиливая её дополнительным оценочным оттенком слова «нажили» или «награбили».
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: в последние дни
  rationale: Прямой и узнаваемый перевод эсхатологического выражения без добавления отсутствующего в греческом указательного элемента «эти».
theological_decisions:
- issue: Синтаксическая связь ὡς πῦρ
  choice: '«Как огонь» относится к предшествующей фразе: ржавчина пожрёт их плоть как огонь.'
  alternative: '«Как огонь» относится к заключительной фразе: «Вы накопили огонь в последние дни».'
  rationale: Ближайшая синтаксическая связь и цельность образа разрушительного суда говорят в пользу отнесения оборота к «пожрёт». Однако другая пунктуация древнего текста возможна и меняет образ, поэтому она сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой резкости и судебного образа. «Пожрёт вашу плоть» намеренно звучит сильно и конкретно; «будет свидетельствовать против вас» естественно передаёт юридический оттенок. Все сноски обозначены в основном тексте.
