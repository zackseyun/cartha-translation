id: JAS.5.17
reference: James 5:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/017.yaml
  text: Elijah was a man with a nature like ours[a], and he prayed earnestly that it would not rain, and it did not rain on the land for three years and six months.
translation:
  language: ru
  text: Илия был человеком, подобным нам[a], и горячо помолился, чтобы не было дождя; и дождя не было на земле три года и шесть месяцев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «таким же человеком, как и мы»; возможно также: «испытывавшим те же чувства и страсти, что и мы».'
    reason: 'Лексическая альтернатива: ὁμοιοπαθής может указывать широко на общую человеческую природу и опыт либо конкретнее на сходные чувства и страсти.'
lexical_decisions:
- source_word: Ἠλίας
  choice: Илия
  rationale: Традиционная и общепринятая русская форма имени ветхозаветного пророка.
- source_word: ἄνθρωπος
  choice: человеком
  rationale: Передаёт мысль об обычной человеческой природе Илии; по-русски естественно сочетается с последующим «подобным нам».
- source_word: ὁμοιοπαθὴς ἡμῖν
  choice: подобным нам
  rationale: Сохраняет широкий смысл общей с читателями человеческой природы и участи, не сужая его лишь до чувств или страстей.
- source_word: προσευχῇ προσηύξατο
  choice: горячо помолился
  rationale: Естественно передаёт усилительный оттенок греческой конструкции с однокоренными существительным и глаголом, избегая неуклюжего буквального повтора.
- source_word: τοῦ μὴ βρέξαι
  choice: чтобы не было дождя
  rationale: Идиоматично выражает содержание или желаемый результат молитвы, сохраняя возможную смысловую связь цели и содержания.
- source_word: οὐκ ἔβρεξεν
  choice: дождя не было
  rationale: Естественная русская безличная конструкция, соответствующая контексту отсутствия дождя.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: 'Сохраняет лексическую широту γῆ: выражение может относиться к земле или стране, не навязывая исключительно глобального смысла.'
- source_word: ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ
  choice: три года и шесть месяцев
  rationale: Естественно передаёт винительный длительности; продолжительность уже ясно выражена конструкцией «дождя не было».
theological_decisions:
- issue: Значение ὁμοιοπαθὴς применительно к человечности Илии
  choice: Илия представлен человеком, подобным читателям по общей человеческой природе и участи.
  alternative: Илия испытывал те же чувства или страсти, что и мы.
  rationale: Широкое «подобным нам» поддерживает ободряющий смысл примера Илии и не ограничивает сходство одной эмоциональной сферой.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Горячо помолился» передаёт эмфазу без архаичного однокоренного повтора; пунктуация сохраняет тесную связь молитвы с последовавшей засухой.
