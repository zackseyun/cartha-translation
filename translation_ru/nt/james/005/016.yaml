id: JAS.5.16
reference: James 5:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐξομολογεῖσθε ⸀οὖν ἀλλήλοις ⸂τὰς ἁμαρτίας⸃ καὶ ⸀εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/016.yaml
  text: Therefore[a], confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful as it is at work.
translation:
  language: ru
  text: Итак, признавайтесь друг другу в своих грехах и молитесь друг за друга, чтобы вы были исцелены. Молитва праведного человека, когда она действует, обладает великой силой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Действенная мольба праведного человека имеет большую силу».'
    reason: 'Лексико-синтаксическая альтернатива для δέησις δικαίου ἐνεργουμένη: δέησις может означать «мольба», а ἐνεργουμένη допускает передачу как «действенная».'
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: признавайтесь
  rationale: Передаёт открытое признание грехов в обоюдном общении, не привнося обязательного смысла формального таинства.
- source_word: οὖν
  choice: итак
  rationale: Естественно обозначает вывод из предшествующего рассуждения о молитве, грехе и восстановлении.
- source_word: ἀλλήλοις
  choice: друг перед другом
  rationale: Ясно выражает взаимный характер признания.
- source_word: τὰς ἁμαρτίας
  choice: в грехах
  rationale: Естественное русское управление с глаголом «признаваться»; определённый артикль не требует отдельной передачи.
- source_word: εὔχεσθε ὑπὲρ ἀλλήλων
  choice: молитесь друг за друга
  rationale: Прямо и идиоматично передаёт взаимную ходатайственную молитву.
- source_word: ὅπως ἰαθῆτε
  choice: чтобы получить исцеление
  rationale: Сохраняет целевое значение и широкий смысл исцеления, не ограничивая его только телесной или только духовной сферой.
- source_word: πολὺ ἰσχύει
  choice: обладает великой силой
  rationale: Передаёт значительную действенность или силу, не уточняя сверх текста конкретный результат.
- source_word: δέησις
  choice: молитва
  rationale: Понятное широкое соответствие; более узкое значение «прошение» отмечено в сноске.
- source_word: δικαίου
  choice: праведного
  rationale: Субстантивированное прилагательное в русском языке естественно имеет родовое, обобщающее значение и не требует добавления слова «человек».
- source_word: ἐνεργουμένη
  choice: когда действует
  rationale: Сохраняет трудную и неоднозначную характеристику молитвы как действующей, не сводя причастие однозначно к пассивному «приводимой в действие».
theological_decisions:
- issue: Предписывает ли стих сакраментальную исповедь духовенству или взаимное признание грехов верующими
  choice: взаимное признание друг перед другом
  alternative: исповедь при посредничестве рукоположённого духовенства
  rationale: Взаимное местоимение ἀλλήλοις прямо обозначает обоюдность среди адресатов; перевод не привносит более узкую церковную практику.
- issue: Объём значения ἰαθῆτε
  choice: исцеление в широком смысле
  alternative: только физическое либо только духовное исцеление
  rationale: Контекст говорит о болезни, но также упоминает грехи; широкая формулировка сохраняет эту смысловую напряжённость.
- issue: Родовое значение δικαίου
  choice: праведного
  alternative: праведного мужчины
  rationale: Мужской род греческой формы здесь имеет обобщающий характер; русская субстантивированная форма также естественно допускает родовое прочтение.
- issue: Залоговое и смысловое значение ἐνεργουμένη
  choice: молитва действует
  alternative: молитва приводится в действие / молитва действенна
  rationale: Средне-пассивная форма допускает разные оттенки; основной текст сохраняет образ действующей молитвы, а сноска указывает возможную альтернативную конструкцию всего заключительного предложения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Признавайтесь» выбрано вместо более конфессионально нагруженного «исповедуйтесь». Маркер сноски поставлен непосредственно после предложения, к которому относится альтернатива.
