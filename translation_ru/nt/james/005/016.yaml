revisions:
- from: Итак, признавайтесь друг перед другом в грехах и молитесь друг за друга, чтобы получить исцеление. Молитва праведного обладает великой силой, когда действует.[a]
  to: Итак, признавайтесь друг другу в своих грехах и молитесь друг за друга, чтобы вы были исцелены. Молитва праведного человека, когда она действует, обладает великой силой.[a]
  rationale: 'Исправлены русское выражение взаимности и передача пассивной формы «были исцелены». Заключительная фраза сохраняет порядок смысловых компонентов оригинала: великая сила принадлежит молитве праведного человека в её действии. Сноска даёт естественную русскую альтернативу, не решая спорный оттенок средне-пассивного причастия догматически.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:31:50Z'
review_pass:
  verdict: revise
  source_fidelity: Начальное повеление передано по смыслу, однако «друг перед другом» менее точно и естественно, чем прямое взаимное «друг другу». «Чтобы получить исцеление» ослабляет пассивную форму ἰαθῆτε («чтобы вы были исцелены»). Заключительная фраза в целом отражает силу молитвы, но нуждается в более естественном и точном выражении связи с ἐνεργουμένη.
  naturalness: «Признавайтесь друг перед другом в грехах» звучит несколько тяжеловесно; «признавайтесь друг другу в своих грехах» современно и ясно. В заключении повторение «обладает великой силой, когда действует» формально возможно, но стилистически лучше согласовать придаточное с подлежащим и сохранить характеристику молитвы.
  terminology: «Молитва», «грехи», «исцелены» и «праведный человек» соответствуют широкому смыслу оригинала и не вносят конфессионального ограничения. «Праведный человек» передаёт обобщённое субстантивированное δικαίου без неоправданного ограничения мужским полом.
  issues:
  - severity: medium
    issue: Взаимное дополнение в первом повелении передано как «друг перед другом».
    rationale: ἀλλήλοις — «друг другу / друг друга»; в русском с «признаваться в грехах» нормативнее и прозрачнее «признавайтесь друг другу в своих грехах».
  - severity: medium
    issue: Пассив ἰαθῆτε передан конструкцией «получить исцеление».
    rationale: Эта конструкция близка по смыслу, но не воспроизводит прямо пассивное «быть исцелёнными» и несколько меняет синтаксическую перспективу. «Чтобы вы были исцелены» точнее и естественно.
  - severity: low
    issue: Сноска «Действующее прошение...» звучит неестественно и не вполне ясно отражает причастную конструкцию.
    rationale: Следует дать идиоматичную альтернативу с «мольба/прошение» и явно связать характеристику действенности с молитвой.
  revised_text: Итак, признавайтесь друг другу в своих грехах и молитесь друг за друга, чтобы вы были исцелены. Молитва праведного человека, когда она действует, обладает великой силой.[a]
  revised_footnotes:
