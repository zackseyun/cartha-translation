    text: 'Или: «Действенная мольба праведного человека имеет большую силу».'
    reason: 'Лексико-синтаксическая альтернатива для δέησις δικαίου ἐνεργουμένη: δέησις может означать «мольба», а ἐνεργουμένη допускает передачу как «действенная».'
  revision_rationale: 'Исправлены русское выражение взаимности и передача пассивной формы «были исцелены». Заключительная фраза сохраняет порядок смысловых компонентов оригинала: великая сила принадлежит молитве праведного человека в её действии. Сноска даёт естественную русскую альтернативу, не решая спорный оттенок средне-пассивного причастия догматически.'
