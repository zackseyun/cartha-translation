lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Братья мои
  rationale: Сохраняет мужскую форму множественного числа и обращение с μου; по-русски звучит естественно и достойно. В данном контексте обращение, вероятно, относится ко всей общине, что отмечено в сноске.
- source_word: ἐάν τις ἐν ὑμῖν
  choice: если кто-нибудь из вас
  rationale: Передаёт условность ἐάν, неопределённость и единственное число τις, а также естественно выражает принадлежность к общине.
- source_word: πλανηθῇ ἀπὸ τῆς ἀληθείας
  choice: уклонится от истины
  rationale: «Уклонится» естественно передаёт уход с верного пути и сохраняет образ отклонения от истины. Греческая пассивная форма допускает также оттенки заблуждения или введения в заблуждение; неоднозначность отмечена в сноске.
- source_word: καὶ ἐπιστρέψῃ τις αὐτόν
  choice: и кто-то обратит его назад
  rationale: «Обратит» сохраняет переходность ἐπιστρέψῃ и образ возвращения человека; «назад» ясно выражает значение возвращения, не уточняя сверх текста, к кому или к чему именно.
theological_decisions:
- issue: Охват обращения Ἀδελφοί
  choice: Сохранить в основном тексте «Братья мои»
  alternative: «Братья и сёстры мои»
  rationale: Греческая форма грамматически мужская, хотя в обращении может включать всю общину. Основной текст сохраняет форму источника, а возможный широкий охват поясняется в сноске.
- issue: Залоговая и смысловая неоднозначность πλανηθῇ
  choice: «уклонится»
  alternative: «будет введён в заблуждение» / «заблудится»
  rationale: В контексте возможны как самостоятельное уклонение, так и пассивный оттенок обмана. «Уклонится» естественно для современного русского и не навязывает конкретного действующего лица; варианты вынесены в сноску.
- issue: Смысл ἐπιστρέψῃ
  choice: «обратит его назад»
  alternative: «вернёт его»
  rationale: Сохраняется образ поворота/обращения и грамматическая роль другого человека как действующего лица, без добавления конфессионально нагруженного смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Порядок «Братья мои» сохраняет достоинство и близость обращения. Синтаксис оставлен незавершённым запятой, поскольку стих составляет условную придаточную часть, продолжение которой следует в Иак. 5:20.
