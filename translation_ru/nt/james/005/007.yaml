  text: Μακροθυμήσατε οὖν, ἀδελφοί, ἕως τῆς παρουσίας τοῦ κυρίου. ἰδοὺ ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς, μακροθυμῶν ἐπ’ ⸀αὐτῷ ἕως ⸀λάβῃ πρόϊμον καὶ ὄψιμον.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/007.yaml
  text: Be patient[a], therefore, brothers, until the coming of the Lord. Look, the farmer waits for the precious fruit of the earth[b], being patient over it until it receives the early and late rains.
translation:
  language: ru
  text: Итак, братья[a], будьте терпеливы до пришествия Господа[b]. Вот земледелец терпеливо ждёт драгоценного плода земли, пока не придут ранние и поздние дожди[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры». Греческий текст буквально говорит «братья»; такое обращение часто относится ко всей верующей общине.'
    reason: alternative_reading
  - marker: b
    text: Греческое слово παρουσία может означать также «присутствие» или «прибытие»; здесь речь, вероятнее всего, о будущем пришествии Господа.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «пока не получит ранний и поздний [дождь]». В греческом тексте не выражено, кто именно «получит»; перевод передаёт подразумеваемое наступление дождей.'
    reason: textual_and_grammatical_ambiguity
lexical_decisions:
- source_word: Μακροθυμήσατε
  choice: будьте терпеливы
  rationale: Передаёт повеление проявлять длительное терпение и выдержку; это естественная современная формулировка.
- source_word: οὖν
  choice: итак
  rationale: Сохраняет вывод из предшествующего рассуждения и естественно открывает русское предложение.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужское обращение оригинала; возможное обращение ко всей общине пояснено в сноске.
- source_word: παρουσίας
  choice: пришествия
  rationale: В данном эсхатологическом контексте обозначает ожидаемое будущее прибытие Господа; «пришествие» естественно и точно передаёт этот смысл.
- source_word: ἰδοὺ
  choice: вот
  rationale: Сохраняет функцию привлечения внимания к примеру без архаического оттенка.
- source_word: γεωργὸς
  choice: земледелец
  rationale: Точно обозначает человека, возделывающего землю, и соответствует достоинству библейского регистра.
- source_word: ἐκδέχεται
  choice: ждёт
  rationale: Передаёт продолжительное ожидание с надеждой на результат.
- source_word: τίμιον καρπὸν τῆς γῆς
  choice: драгоценного плода земли
  rationale: Сохраняет широкую земледельческую метафору и подчёркивает ценность урожая, не сужая образ до конкретной культуры.
- source_word: μακροθυμῶν ἐπ’ αὐτῷ
  choice: терпеливо ожидает его
  rationale: Естественно выражает терпение земледельца по отношению к плоду и сохраняет смысловой повтор корня μακροθυμ- без неестественной русской конструкции.
- source_word: ἕως λάβῃ πρόϊμον καὶ ὄψιμον
  choice: пока земля не получит ранний и поздний дождь
  rationale: Подлежащее греческого λάβῃ текстуально и грамматически неоднозначно; «земля» является естественным подразумеваемым получателем дождей, однако вариантная форма глагола отражена в сноске.
theological_decisions:
- issue: Обращение ἀδελφοί
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет форму оригинала, а сноска отмечает, что такое обращение нередко охватывает всю верующую общину.
- issue: παρουσία τοῦ κυρίου
  choice: пришествие Господа
  alternative: присутствие Господа
  rationale: Контекст ожидания указывает на будущее прибытие Господа, но лексически возможное значение «присутствие» отмечено, чтобы не скрывать смысловой диапазон.
- issue: Подлежащее при λάβῃ и текстовый вариант
  choice: земля получит ранний и поздний дождь
  alternative: он получит ранний и поздний дождь / пока не выпадут ранний и поздний дожди
  rationale: Форма λάβῃ в представленном тексте буквально означает «получит» и допускает подразумеваемое подлежащее; наиболее связно дождь получает земля. В рукописной традиции имеется вариант, влияющий на выражение этой мысли, поэтому неоднозначность вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены логическая связь, повтор темы терпения и сельскохозяйственный образ; синтаксис сделан естественным для широкого круга читателей.
