source:
  edition: SBLGNT
  text: καὶ πάλιν προσηύξατο, καὶ ὁ οὐρανὸς ⸂ὑετὸν ἔδωκεν⸃ καὶ ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/018.yaml
  text: And he prayed again[a], and the sky gave rain[b], and the earth produced its fruit.
translation:
  language: ru
  text: И снова он помолился, и небо дало дождь, а земля произрастила свой плод.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земля дала свой урожай».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: снова
  rationale: Передаёт повторность молитвы кратко и естественно, соотнося её с предыдущей молитвой Илии.
- source_word: προσηύξατο
  choice: он помолился
  rationale: Аорист προσεύχομαι означает, что он совершил молитву; усиление «усердно» в этом стихе отсутствует и не добавляется.
- source_word: ὁ οὐρανός
  choice: небо
  rationale: В контексте дождя речь идёт о видимом небе; русское «небо» естественно передаёт это значение и одновременно сохраняет обычную многозначность исходного слова.
- source_word: ὑετὸν ἔδωκεν
  choice: дало дождь
  rationale: Сохраняется образное и достаточно естественное выражение оригинала — буквально «дало дождь» — без замены на «Бог послал дождь».
- source_word: ἡ γῆ
  choice: земля
  rationale: Сохраняет параллель с небом и допускает как общее значение земли, так и сельскохозяйственное значение почвы или страны.
- source_word: ἐβλάστησεν
  choice: произрастила
  rationale: Передаёт возникновение растительности и урожая под действием дождя, сохраняя переходную конструкцию оригинала с καρπός в качестве дополнения.
- source_word: τὸν καρπὸν αὐτῆς
  choice: свой плод
  rationale: Близко передаёт буквальный образ оригинала; в данном контексте «плод» означает земные плоды, урожай.
theological_decisions:
- issue: Связь молитвы Илии с Божьим ответом
  choice: 'Описать наблюдаемый результат молитвы словами самого стиха: небо дало дождь, земля произрастила плод.'
  alternative: Явно сказать, что Бог послал дождь.
  rationale: Контекст подразумевает действие Бога, однако сам стих выражает его через небо и землю. Перевод не добавляет отсутствующего в этой фразе пояснения и сохраняет образ оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Произрастила свой плод» сохраняет образ оригинала; более разговорный сельскохозяйственный вариант дан в сноске. Союзы передают последовательность и параллелизм греческой фразы без излишней архаизации.
