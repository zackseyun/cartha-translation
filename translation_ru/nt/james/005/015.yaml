id: JAS.5.15
reference: James 5:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/015.yaml
  text: And the prayer of faith will save the one who is sick[a], and the Lord will raise him up. And if he has committed sins[c][b], he will be forgiven.
translation:
  language: ru
  text: И молитва веры[a] спасёт больного[b], и Господь поднимет его. И если он совершил грехи[c], они будут ему прощены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть молитва, исполненная веры или доверия Богу; возможно также: «молитва, отличающаяся верностью», хотя здесь это менее вероятно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «исцелит», «сделает здоровым»; буквально: «спасёт».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «даже если он совершил грехи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχὴ τῆς πίστεως
  choice: молитва веры
  rationale: В контексте молитвы пресвитеров εὐχή означает «молитва», а родительный падеж πίστεως естественно передаётся как «веры», сохраняя возможный смысл молитвы, исполненной доверия Богу.
- source_word: σώσει
  choice: спасёт
  rationale: Глагол σῴζω может обозначать как спасение, так и исцеление или восстановление. «Спасёт» сохраняет широту греческого слова, тогда как контекст болезни указывает и на телесное выздоровление.
- source_word: τὸν κάμνοντα
  choice: больного
  rationale: Хотя κάμνω может означать утомление или изнеможение, контекст болезни, помазания и поднятия с одра делает «больного» наиболее ясным и естественным вариантом.
- source_word: ἐγερεῖ
  choice: поднимет
  rationale: «Поднимет» сохраняет образ глагола ἐγείρω и в данном контексте естественно предполагает восстановление больного, не устраняя более широких смысловых отзвуков.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Это обычная и богословски содержательная передача κύριος, когда речь идёт о Боге как действующем лице.
- source_word: κἂν ἁμαρτίας ᾖ πεποιηκώς
  choice: и если он совершил грехи
  rationale: Условная конструкция допускает также уступительный оттенок «даже если». Основной вариант прямо и естественно передаёт условие, не связывая всякую болезнь с личным грехом.
- source_word: ἀφεθήσεται αὐτῷ
  choice: они будут ему прощены
  rationale: По-русски явное местоимение «они» естественно отсылает к упомянутым грехам. Страдательная конструкция сохраняет подразумеваемое действие Бога и не добавляет его имени в текст.
theological_decisions:
- issue: Означает ли σώσει только физическое исцеление или более широкое спасение и восстановление
  choice: В основном тексте употреблено «спасёт», а значение исцеления раскрывается контекстом и сноской.
  alternative: «исцелит» или «восстановит»
  rationale: Так сохраняется лексическая широта σῴζω и одновременно не отрицается непосредственный контекст телесной болезни.
- issue: Обещает ли стих автоматическое исцеление в результате молитвы
  choice: Будущие формы переданы прямо, без добавочных оговорок и без усиления утверждения.
  alternative: «может исцелить» или «непременно исцелит в каждом случае»
  rationale: Перевод не должен ни ослаблять прямое утверждение греческого текста, ни вносить учение о гарантированном исцелении при любых обстоятельствах.
- issue: Связана ли всякая болезнь с личным грехом больного
  choice: 'Упоминание грехов сохранено как условное: «если он совершил грехи».'
  alternative: Передача, предполагающая, что болезнь всегда вызвана личным грехом
  rationale: Греческий текст представляет совершение грехов как возможное обстоятельство, а не как универсальную причину болезни.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Сохранены прямые будущие формы, образ «поднимет» и богословская широта слова «спасёт»; неоднозначности вынесены в краткие сноски.
