lexical_decisions:
- source_word: πλοῦτος
  choice: богатство
  rationale: Естественный современный эквивалент собирательного единственного числа; обозначает накопленное материальное состояние и сохраняет форму греческого текста.
- source_word: σέσηπεν
  choice: сгнило
  rationale: Перфект передаёт наступившее разложение и его наличный результат; форма «сгнило» звучит ярко и естественно.
- source_word: ἱμάτια
  choice: одежда
  rationale: Собирательное «одежда» ясно и современно передаёт множественное число со значением предметов одежды без излишне книжного оттенка слова «одеяния».
- source_word: σητόβρωτα
  choice: изъеденной молью
  rationale: Точно сохраняет конкретный образ повреждения ткани молью и звучит естественнее буквального сложного прилагательного.
- source_word: γέγονεν
  choice: стала
  rationale: Передаёт переход в состояние и итоговую силу перфекта γίνομαι, а не только статическое «есть».
