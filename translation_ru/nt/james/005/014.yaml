  text: ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ’ αὐτὸν ἀλείψαντες ⸀αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: ru
  text: Болен ли кто-нибудь из вас?[a] Пусть он позовёт пресвитеров церкви, и пусть они помолятся над ним, помазав его маслом[b] во имя Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Слаб ли кто-нибудь из вас?» Греческий глагол может обозначать слабость шире, однако молитва, помазание маслом и контекст исцеления в следующем стихе указывают прежде всего на болезнь.'
    reason: lexical_alternative
  - marker: b
    text: Помазание маслом можно понимать как лечебное или символическое действие либо как сочетание того и другого; сам текст этого не уточняет.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενεῖ
  choice: болен
  rationale: В контексте молитвы, помазания маслом и последующего упоминания об исцелении глагол прежде всего указывает на телесную болезнь, хотя может шире обозначать слабость.
- source_word: τις ἐν ὑμῖν
  choice: кто-нибудь из вас
  rationale: Естественно передаёт неопределённое и обобщающее значение выражения, не ограничивая его мужчинами.
- source_word: προσκαλεσάσθω
  choice: пусть он позовёт
  rationale: Передаёт повелительное значение формы и просьбу пригласить пресвитеров к больному.
- source_word: τοὺς πρεσβυτέρους τῆς ἐκκλησίας
  choice: пресвитеров церкви
  rationale: В сочетании с «церкви» πρεσβύτεροι обозначает признанных руководителей общины; «пресвитеры» — точный и привычный для русского библейского языка термин.
- source_word: προσευξάσθωσαν ἐπ’ αὐτόν
  choice: пусть они помолятся над ним
  rationale: Сохраняет повелительную силу и пространственно-направленный оттенок ἐπί, не заменяя его более общим «за него».
- source_word: ἀλείψαντες αὐτὸν ἐλαίῳ
  choice: помазав его маслом
  rationale: Точно и нейтрально обозначает нанесение масла, не определяя действие как исключительно лечебное, символическое или обрядовое.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου
  choice: во имя Господа
  rationale: Сохраняет библейскую формулу, связывающую действие с личностью и властью Господа.
theological_decisions:
- issue: Значение ἀσθενεῖ в данном контексте
  choice: телесная болезнь как основной смысл
  alternative: слабость вообще, в том числе духовная или физическая немощь
  rationale: Молитва над человеком, помазание маслом и контекст следующего стиха делают болезнь наиболее вероятным значением, но более широкий смысл отмечен в сноске.
- issue: Назначение помазания маслом
  choice: нейтрально передать само действие
  alternative: истолковать его как лечебное, символическое или таинственное действие
  rationale: Греческий текст сообщает о помазании, но не объясняет его механизм или богословский статус, поэтому перевод не выбирает конфессиональное толкование.
- issue: Референция κύριος
  choice: Господь
  alternative: уточнить в тексте как «Господь Иисус» или передать как «Владыка»
  rationale: Титул передан непосредственно и без добавленного уточнения; контекст христианской общины допускает отнесение к Иисусу, но сам стих имени не называет.
translation_notes:
  register: Современный литературный русский с сохранением достойного библейского регистра. «Пресвитеры» предпочтены разговорному «старейшины» как устоявшееся обозначение руководителей христианской общины. Синтаксис сохраняет последовательность двух повелений и сопутствующего причастного действия.
