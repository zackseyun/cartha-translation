  text: ὃς πάντας ἀνθρώπους θέλει σωθῆναι καὶ εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/004.yaml
  text: who desires all people to be saved and to come to the knowledge of the truth[a][b].
translation:
  language: ru
  text: Который хочет, чтобы все люди спаслись и пришли к познанию истины.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «желает, чтобы все люди спаслись»; греческий глагол можно также передать словами «желает» или «волит».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пришли к полному познанию истины»; употреблённое греческое существительное может подразумевать более полное знание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Который
  rationale: Относительное местоимение относится к Богу в предыдущем стихе и сохраняет синтаксическую связь с ним.
- source_word: πάντας ἀνθρώπους
  choice: все люди
  rationale: Сочетание обозначает всех людей без ограничения по полу; этот перевод прямо передаёт всеобщий охват греческого выражения.
- source_word: θέλει
  choice: хочет
  rationale: θέλω может означать «хотеть», «желать» или «волить». «Хочет» — естественный современный русский эквивалент, не превращающий глагол в специальный богословский термин.
- source_word: σωθῆναι
  choice: чтобы … спаслись
  rationale: Пассивный инфинитив σῴζω здесь имеет сотериологический смысл. Русская конструкция с «чтобы» естественно передаёт зависимые инфинитивы после θέλει.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: к познанию истины
  rationale: Выражение обозначает достижение знания или признания истины; «познание истины» естественно и не навязывает усилительный оттенок полноты.
- source_word: ἐλθεῖν
  choice: пришли
  rationale: ἔρχομαι с εἰς образно выражает движение к состоянию или реальности; «прийти к познанию» — прямое и устойчивое русское соответствие.
theological_decisions:
- issue: Охват πάντας ἀνθρώπους и спасительная воля Бога
  choice: «все люди» и «хочет»
  alternative: «все роды людей»; «желает»; «волит»
  rationale: Греческий текст естественно имеет всеобщий охват. Перевод не сужает «всех людей» до отдельных категорий и не придаёт θέλει технического смысла непреложного постановления, сохраняя богословское напряжение текста.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Придаточная конструкция с «чтобы» звучит естественнее буквального сохранения двух греческих инфинитивов; «Который» удерживает связь с предыдущим стихом.
