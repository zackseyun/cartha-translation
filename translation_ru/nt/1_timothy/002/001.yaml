  source_fidelity: 'В целом перевод точно передаёт греческую конструкцию и перечень: «итак», «прежде всего», четыре вида молитв и «за всех людей». Однако «прошу» несколько ослабляет настойчивую побудительную силу Παρακαλῶ; «призываю» точнее и естественно в апостольском наставлении. Сноска a ошибочно привязана к «всех людей», хотя заявленная лексическая альтернатива относится к ὑπέρ, то есть к «за».'
