lexical_decisions:
- source_word: Παρακαλῶ
  choice: прошу
  rationale: В данном наставлении παρακαλέω выражает настойчивый призыв. «Прошу» естественно по-русски и в сочетании с контекстом сохраняет серьёзность обращения, не прибегая к более архаичному «увещеваю».
- source_word: οὖν
  choice: итак
  rationale: Частица обозначает логический переход от предшествующего рассуждения; «итак» ясно и естественно передаёт эту связь.
- source_word: πρῶτον πάντων
  choice: прежде всего
  rationale: Оборот указывает на первостепенную важность наставления, не обязательно задавая строгую нумерацию.
- source_word: ποιεῖσθαι
  choice: совершать
  rationale: Этот глагол относится ко всем четырём видам молитвенного действия. «Совершать» сохраняет широкий смысл и достойный регистр, не добавляя обязательного литургического оттенка.
- source_word: δεήσεις
  choice: прошения
  rationale: δέησις обозначает просьбу, вызванную нуждой. «Прошения» точно передаёт смысл и сохраняет отличие от общего слова «молитвы».
- source_word: προσευχάς
  choice: молитвы
  rationale: προσευχή — общее обозначение молитвы; прямой русский эквивалент здесь наиболее уместен.
- source_word: ἐντεύξεις
  choice: ходатайства
  rationale: В данном контексте слово обозначает обращения к Богу в интересах других; «ходатайства» естественно передаёт этот представительский оттенок.
- source_word: εὐχαριστίας
  choice: благодарения
  rationale: Множественное «благодарения» сохраняет форму и место слова в перечне различных молитвенных действий.
- source_word: ὑπὲρ
  choice: за
  rationale: С родительным падежом ὑπέρ здесь выражает действие ради или в пользу кого-либо. В контексте молитвы русское «за» наиболее естественно; более развёрнутый смысл отмечен в сноске.
- source_word: πάντων ἀνθρώπων
  choice: всех людей
  rationale: ἄνθρωπος употреблено обобщённо о людях, а не только о мужчинах. «Всех людей» точно и естественно передаёт нен限定енный объём греческого выражения.
theological_decisions:
- issue: Объём выражения πάντων ἀνθρώπων
  choice: всех людей
  alternative: людей всякого рода / всех категорий людей
  rationale: Греческий текст непосредственно говорит «всех людей» и сам по себе не сужает значение до различных категорий. Перевод сохраняет буквальный объём выражения, а возможное толкование отмечается в сноске без разрешения богословского спора.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского наставления. Синтаксис следует греческому перечню, но остаётся естественным для русского читателя. Все слова перечня разграничены лексически; гендерно обобщённое ἀνθρώπων передано как «людей».
