  terminology: '«Прошения», «молитвы», «ходатайства», «благодарения» хорошо разграничивают греческие термины. «Всех людей» верно передаёт πάντων ἀνθρώπων. Альтернативу «ради всех людей» в сноске следует убрать: для ὑπέρ в данном контексте она менее точна, чем «за» / «в пользу».'
