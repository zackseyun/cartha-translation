  text: ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/002.yaml
  text: for kings and all who are in high positions[a], so that we may lead a tranquil and quiet life in all godliness and dignity.
translation:
  language: ru
  text: за царей и всех, кто занимает высокое положение[a], чтобы нам вести спокойную и тихую жизнь во всяком благочестии и достоинстве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех, кто наделён властью». Греческий оборот буквально означает «всех находящихся на высоте, в высоком положении».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: за
  rationale: В контексте молитв и прошений предлог обозначает тех, за кого молятся; «за» — естественный и точный русский эквивалент.
- source_word: βασιλέων
  choice: царей
  rationale: Существительное прямо обозначает царей или монархов; более общее «правителей» неоправданно расширило бы его значение.
- source_word: πάντων τῶν ἐν ὑπεροχῇ ὄντων
  choice: всех, кто занимает высокое положение
  rationale: Оборот указывает на высокое, видное положение и не ограничивается исключительно формально установленной властью.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз естественно выражает цель молитв, а возможно и предполагаемый результат, не устраняя присущую конструкции смысловую близость цели и следствия.
- source_word: ἤρεμον
  choice: спокойную
  rationale: Слово передаёт отсутствие волнений и внешних потрясений; «спокойную» сохраняет отличие от следующего определения.
- source_word: ἡσύχιον
  choice: тихую
  rationale: Слово подчёркивает тишину, мирный и не тревожимый уклад жизни; «тихую» образует естественную пару со «спокойную».
- source_word: βίον διάγωμεν
  choice: нам вести … жизнь
  rationale: Глагол означает проводить или вести жизнь; русское сочетание «вести жизнь» передаёт это значение естественно и сохраняет форму пожелания в первом лице множественного числа.
- source_word: ἐν πάσῃ εὐσεβείᾳ
  choice: в полном благочестии
  rationale: εὐσέβεια означает почтительное отношение к Богу, проявляемое в образе жизни. «Благочестие» сохраняет ключевое для Пастырских посланий понятие, а «полном» естественно передаёт πάσῃ в данном сочетании.
- source_word: σεμνότητι
  choice: достоинстве
  rationale: Существительное обозначает серьёзность и нравственную степенность, заслуживающие уважения; «достоинство» ясно передаёт этот общественно-нравственный оттенок без архаизма.
theological_decisions:
- issue: Объём и цель молитвы за гражданских правителей
  choice: Текст призывает молиться за царей и других людей, занимающих высокое положение, ради спокойной жизни в благочестии и достоинстве.
  alternative: Понять оборот исключительно как указание на официально наделённых властью лиц или усилить его до требования безусловного одобрения и подчинения каждому правителю.
  rationale: Греческий текст называет тех, за кого следует молиться, и желаемые условия жизни, но сам по себе не утверждает безусловную законность или нравственную правоту всякого правителя.
- issue: Объём πάσῃ при двух существительных
  choice: «в полном благочестии и достоинстве» позволяет естественно отнести идею полноты ко всему сочетанию.
  alternative: 'Отнести πάσῃ только к εὐσεβείᾳ: «во всяком благочестии и достоинстве».'
  rationale: Два существительных соединены одним предлогом и стоят в одинаковой форме; русский вариант сохраняет возможный широкий охват определения, не превращая его в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Сохранены два близких, но не тождественных определения — «спокойную и тихую»; политический смысл оборота не сужен до одной лишь формальной должности.
