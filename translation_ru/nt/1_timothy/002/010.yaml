lexical_decisions:
- source_word: ἀλλ’
  choice: но
  rationale: Передаёт противопоставление внешним украшениям, описанным в предыдущем стихе.
- source_word: ὃ πρέπει
  choice: как и подобает
  rationale: Естественно передаёт значение уместности и соответствия; оборот связывает добрые дела с образом жизни таких женщин.
- source_word: γυναιξὶν
  choice: женщинам
  rationale: В данном контексте множественное число имеет общее значение; ограничивать его замужними женщинами нет оснований.
- source_word: ἐπαγγελλομέναις
  choice: заявляющим о своём
  rationale: Причастие указывает на открытое исповедание или притязание, не подразумевая формального обета.
- source_word: θεοσέβειαν
  choice: благоговении перед Богом
  rationale: Ясно и непосредственно передаёт почтение к Богу и преданность Ему; современному читателю прозрачнее, чем неоднозначное «благочестие».
- source_word: δι’ ἔργων ἀγαθῶν
  choice: добрыми делами
  rationale: Творительный падеж естественно передаёт διά с родительным как средство или образ действия и сохраняет образ подобающего украшения из контекста.
theological_decisions:
- issue: Связь добрых дел с исповедуемым благоговением перед Богом
  choice: Добрые дела представлены как подобающее внешнее выражение заявленного благоговения перед Богом.
  alternative: Добрые дела являются основанием заслуженного принятия Богом.
  rationale: Синтаксис и контекст противопоставляют добрые дела внешним украшениям; стих не формулирует учения о том, чем заслуживается спасение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Порядок слов перестроен ради естественности и связи с предшествующим стихом; тире сохраняет пояснительное отношение между добрыми делами и тем, что подобает женщинам.
