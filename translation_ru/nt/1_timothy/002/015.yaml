  source_fidelity: Основной текст точно передаёт будущее страдательное σωθήσεται («будет спасена»), условие ἐὰν и существенный переход от единственного числа к множественному. «Через рождение детей» адекватно передаёт διὰ τῆς τεκνογονίας в его общем значении и не навязывает толкования о физической безопасности или о мессианском рождении. Однако μετὰ σωφροσύνης буквально и синтаксически лучше передать предложной группой «с самообладанием», а не деепричастием, которое несколько перестраивает связь последнего качества с перечнем.
