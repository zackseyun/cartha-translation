  text: σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/015.yaml
  text: Yet she will be saved through childbearing[c][b][a], if they continue in faith and love and holiness with self-control.
translation:
  language: ru
  text: Но она будет спасена через рождение детей[a], если они[b] останутся в вере[c], любви и святости, с самообладанием.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «через рождение ребёнка». Некоторые понимают эти слова как указание на определённое рождение, возможно рождение Мессии; однако выражение может иметь и общий смысл — «через рождение детей».'
    reason: alternative_reading
  - marker: b
    text: В греческом тексте единственное число («она будет спасена») сменяется множественным («если они останутся»).
    reason: lexical_alternative
  - marker: c
    text: Слово «вера» здесь можно также понимать в значении «верность».
    reason: lexical_alternative
lexical_decisions:
- source_word: σωθήσεται
  choice: будет спасена
  rationale: Будущее страдательное от σῴζω в посланиях Павла обычно означает спасение. Варианты «будет сохранена» или «останется невредимой» неоправданно свели бы смысл к физической безопасности.
- source_word: δὲ
  choice: но
  rationale: δέ обозначает мягкое противопоставление или переход по отношению к предыдущему утверждению; «но» ясно и без излишнего усиления передаёт эту связь.
- source_word: διὰ τῆς τεκνογονίας
  choice: через рождение детей
  rationale: τεκνογονία означает рождение или вынашивание детей. Выражение «рождение детей» естественно для современного русского языка и сохраняет общий смысл, не сводя его к безопасности во время родов или к материнству как заслуге.
- source_word: ἐὰν
  choice: если
  rationale: ἐάν вводит условное придаточное; прямое соответствие — «если».
- source_word: μείνωσιν
  choice: останутся
  rationale: Форма μένω в условной конструкции передаёт продолжение пребывания в названных качествах. «Останутся» звучит естественно и сохраняет идею стойкости.
- source_word: ἐν πίστει
  choice: в вере
  rationale: πίστις обычно передаётся как «вера»; в данном контексте возможен также оттенок верности, отмеченный в сноске.
- source_word: ἀγάπῃ
  choice: любви
  rationale: Обычное и точное соответствие ἀγάπη в перечне христианских качеств.
- source_word: ἁγιασμῷ
  choice: святости
  rationale: ἁγιασμός может означать освящение или святость. В перечне качеств «святость» естественнее и не вносит излишне специальной богословской терминологии.
- source_word: μετὰ σωφροσύνης
  choice: сохраняя самообладание
  rationale: σωφροσύνη охватывает самообладание, рассудительность и сдержанность. Такая формулировка ясна современному читателю и естественно связывает это качество со всем предшествующим перечнем.
theological_decisions:
- issue: Переход от единственного числа «она будет спасена» к множественному «если они останутся»
  choice: Грамматический переход сохранён без согласования числа.
  alternative: 'Сгладить переход: «женщины будут спасены… если останутся»; либо прямо отождествить «она» с Евой, а «они» — с женщинами вообще.'
  rationale: Греческий текст намеренно или значимо переходит от единственного числа к множественному. Сохранение формы не решает за читателя, относится ли «она» к женщине из предыдущего контекста, к Еве или к женщине как обобщённому образу.
- issue: Смысл выражения «будет спасена через рождение детей»
  choice: Сохранить формулировку без уточнения природы спасения и способа связи с рождением детей.
  alternative: «Будет сохранена во время родов»; «спасётся, исполняя материнское призвание»; «будет спасена через рождение Мессии».
  rationale: Греческий текст не уточняет, идёт ли речь о духовном или эсхатологическом спасении, физическом сохранении либо о конкретном рождении. Основной текст должен сохранять эту реальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан ясным для обычного читателя; грамматическая смена числа и смысловая неоднозначность спорного выражения намеренно сохранены.
