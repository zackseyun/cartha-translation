  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος— ἀλήθειαν ⸀λέγω, οὐ ψεύδομαι— διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: ru
  text: Для этого[a] я был назначен глашатаем и апостолом — истину говорю, не лгу, — учителем язычников[b] в вере[c] и истине.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для чего я был назначен».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «учителем народов».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в верности и истине».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: Для этого
  rationale: Оборот указывает назад, на провозглашённую в предыдущих стихах спасительную весть и связанную с ней цель. «Для этого» естественно по-русски передаёт целевое значение, не уточняя его сверх текста.
- source_word: ἐτέθην
  choice: я был назначен
  rationale: Пассивная форма τίθημι здесь означает поручение или назначение на служение, а не физическое помещение; «назначен» ясно и современно передаёт этот смысл.
- source_word: κῆρυξ
  choice: глашатаем
  rationale: κῆρυξ обозначает официального публичного вестника, говорящего от имени пославшего. «Глашатай» сохраняет оттенок уполномоченного провозглашения лучше, чем более узкое церковное «проповедник».
- source_word: ἀπόστολος
  choice: апостолом
  rationale: В самоназвании Павла это признанное обозначение его служения; традиционный русский эквивалент точен и понятен.
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: истину говорю, не лгу
  rationale: Сохранены краткость, эмфатическое двойное заверение и вставной характер фразы; порядок слов звучит торжественно, но естественно.
- source_word: διδάσκαλος ἐθνῶν
  choice: учителем язычников
  rationale: В данном контексте ἔθνη обозначает прежде всего нееврейские народы. «Язычники» — общепринятый русский библейский эквивалент, тогда как буквальное «народы» шире и оставлено в примечании.
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: в вере и истине
  rationale: Предлог ἐν допускает понимание сферы или образа служения. Основной перевод сохраняет параллельную конструкцию и обычное значение πίστις «вера», не устраняя возможный смысл «верность».
theological_decisions:
- issue: Значение ἐθνῶν в описании поручения Павла
  choice: язычников
  alternative: народов
  rationale: В контексте служения Павла слово обычно относится к неевреям. При этом более широкое буквальное значение не исключено и потому отмечено в сноске.
- issue: Значение πίστις в выражении ἐν πίστει καὶ ἀληθείᾳ
  choice: в вере
  alternative: в верности
  rationale: «Вера» сохраняет основное и богословски нейтральное соответствие πίστις; контекст не позволяет окончательно исключить качественное значение «верность», поэтому оно дано как альтернатива.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Глашатай» выбран ради оттенка официального публичного провозглашения; синтаксис с тире сохраняет вставное заверение Павла и риторическую напряжённость оригинала.
