  source_fidelity: 'Текст точно передаёт греческий оригинал: «Для этого» адекватно εἰς ὃ, «был назначен» — ἐτέθην в значении поставления на служение, а тройное обозначение роли Павла («глашатаем и апостолом… учителем») сохранено. Вставное заверение «истину говорю, не лгу» воспроизводит ἀλήθειαν λέγω, οὐ ψεύδομαι без добавлений. «Язычников» контекстуально точно передаёт ἐθνῶν, а «в вере и истине» сохраняет синтаксическую и смысловую открытость ἐν πίστει καὶ ἀληθείᾳ.'
