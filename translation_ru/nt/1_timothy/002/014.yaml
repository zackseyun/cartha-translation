  text: καὶ Ἀδὰμ οὐκ ἠπατήθη, ἡ δὲ γυνὴ ⸀ἐξαπατηθεῖσα ἐν παραβάσει γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/014.yaml
  text: And Adam was not deceived[a], but the woman, having been deceived[b], came to be in transgression.
translation:
  language: ru
  text: И Адам не был обманут, а женщина, оказавшись обманутой[a], впала в преступление[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «оказавшись полностью обманутой» или «совершенно введённой в заблуждение»; употреблённый здесь греческий глагол может быть сильнее предыдущего слова «обманут».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «оказалась в преступлении»; греческая форма совершенного вида может подчёркивать наступившее в результате состояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδὰμ
  choice: Адам
  rationale: Имя передано в традиционной русской форме.
- source_word: ἠπατήθη
  choice: не был обманут
  rationale: Пассивный аорист ἀπατάω прямо и естественно передаётся русским страдательным оборотом; отрицание сохранено без ослабления.
- source_word: ἡ γυνή
  choice: женщина
  rationale: В контексте отсылки к повествованию Бытия значение «женщина» прозрачнее и не вводит дополнительного акцента на супружеском статусе, хотя слово может также означать «жена».
- source_word: ἐξαπατηθεῖσα
  choice: оказавшись обманутой
  rationale: Оборот передаёт пассивное причастие и предшествование обмана последующему действию. Возможный усилительный оттенок составного глагола вынесен в примечание, поскольку его выражение словом «полностью» в основном тексте было бы спорным и менее естественным.
- source_word: ἐν παραβάσει
  choice: в преступление
  rationale: В составе русского выражения «впала в преступление» сохраняется абстрактное существительное παράβασις и идея нарушения установленной границы или заповеди; перевод не превращает женщину в обозначение «преступница».
- source_word: γέγονεν
  choice: впала
  rationale: Естественное русское выражение передаёт наступление состояния вследствие совершившегося действия. Оттенок результата греческого перфекта пояснён в примечании.
- source_word: δὲ
  choice: а
  rationale: Русский противительный союз естественно выражает противопоставление Адама и женщины.
- source_word: καὶ
  choice: И
  rationale: Союз сохраняет связь стиха с предшествующим рассуждением без добавления причинного или выводного значения.
theological_decisions:
- issue: Как передать связь женщины с преступлением, не делая более широких выводов о природе или виновности женщин.
  choice: «женщина, оказавшись обманутой, впала в преступление»
  alternative: «жена, будучи обманута, стала преступницей»
  rationale: Выбранный вариант следует форме исторического утверждения и сохраняет абстрактное существительное «преступление». Он не заменяет его личностным ярлыком и не расширяет смысл стиха за пределы отсылки к повествованию Бытия.
- issue: Следует ли явно усиливать значение ἐξαπατηθεῖσα.
  choice: В основном тексте — «оказавшись обманутой», возможное усиление — в примечании.
  alternative: «оказавшись полностью обманутой»
  rationale: Приставочный глагол может иметь усилительный оттенок, особенно рядом с ἀπατάω, однако обязательность значения «полностью» не бесспорна. Примечание сохраняет лексическую возможность, не преувеличивая её в основном тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Выражение «впала в преступление» несколько формально, но понятно, сохраняет образ исходного текста и позволяет избежать неестественного «оказалась в преступлении» в основном тексте.
