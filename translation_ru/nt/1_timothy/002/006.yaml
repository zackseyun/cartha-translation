lexical_decisions:
- source_word: δοὺς
  choice: отдал
  rationale: Аористное причастие относится к Иисусу Христу из предыдущего стиха. Русское «Который отдал» естественно передаёт определительное значение причастия.
- source_word: ἑαυτὸν
  choice: Себя
  rationale: Возвратное местоимение подчёркивает добровольную самоотдачу; прописная буква соответствует принятому русскому библейскому оформлению местоимений, относящихся ко Христу.
- source_word: ἀντίλυτρον
  choice: как выкуп
  rationale: Слово обозначает выкупную цену и несёт оттенок замещения. «Как выкуп» ясно передаёт основное значение, не превращая перевод в богословское толкование.
- source_word: ὑπὲρ πάντων
  choice: за всех
  rationale: Краткое и естественное соответствие, сохраняющее широкий охват πάντων и значение действия ради других, не уточняя спорный объём слова «всех».
- source_word: τὸ μαρτύριον
  choice: свидетельство
  rationale: 'Существительное сохраняет сжатую аппозиционную связь с предшествующим самопожертвованием Христа: оно является свидетельством. Определённость греческого артикля не требует отдельного выражения в русском.'
- source_word: καιροῖς ἰδίοις
  choice: в назначенные времена
  rationale: Фраза указывает на особые, надлежащие сроки. «Назначенные» естественно выражает подразумеваемую установленность этих времён, а множественное число сохраняет форму оригинала.
theological_decisions:
- issue: Объём πάντων применительно к выкупу Христа
  choice: «за всех» без дальнейшего уточнения
  alternative: «за каждого человека» или «за людей всякого рода»
  rationale: Греческий текст имеет универсальную формулировку, но сам по себе не разрешает позднейший спор о том, означает ли она каждого без исключения или все группы людей.
- issue: Заместительный оттенок ἀντίλυτρον
  choice: «выкуп»
  alternative: «заместительный выкуп» или «выкуп вместо всех»
  rationale: Приставка ἀντί- поддерживает оттенок обмена или замещения, однако его развёрнутое включение в основной текст было бы избыточно толковательным.
- issue: Связь τὸ μαρτύριον с предшествующей фразой
  choice: 'аппозиция: самопожертвование Христа названо свидетельством'
  alternative: понимать как свидетельство, которое было возвещено в назначенные времена
  rationale: Греческая конструкция сжата и допускает различную синтаксическую развёртку. Основной текст сохраняет аппозиционную связь, а примечание отмечает возможное понимание подразумеваемого действия.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксическая сжатость оригинала сохранена, но тире помогает русскому читателю распознать приложение. Формулировка понятна без конфессионально специфической терминологии.
