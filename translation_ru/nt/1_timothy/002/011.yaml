  text: γυνὴ ἐν ἡσυχίᾳ μανθανέτω ἐν πάσῃ ὑποταγῇ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/011.yaml
  text: A woman must learn in quietness[b][a], in all submission.
translation:
  language: ru
  text: Женщина[a] пусть учится в тишине[b], со всей покорностью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Жена»; греческое слово в зависимости от контекста может означать и женщину, и жену.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «в безмолвии»; греческое слово может также означать тишину или спокойствие, не обязательно полное отсутствие речи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: Женщина
  rationale: Греческое γυνή может означать как «женщина», так и «жена» в зависимости от контекста. Здесь форма без артикля, вероятнее всего, употреблена обобщённо; перевод «женщина» не ограничивает смысл семейным положением.
- source_word: ἐν ἡσυχίᾳ
  choice: в тишине
  rationale: ἡσυχία обозначает тишину, спокойствие или невозмутимое, не нарушающее порядка поведение и не обязательно требует абсолютного безмолвия. Перевод сохраняет предложную конструкцию, а примечание указывает на широту значения.
- source_word: μανθανέτω
  choice: пусть учится
  rationale: Форма настоящего времени повелительного наклонения передаёт прямое предписание. «Пусть учится» естественно выражает его силу по-русски и сохраняет положительную направленность повеления — учиться.
- source_word: ἐν πάσῃ ὑποταγῇ
  choice: со всей покорностью
  rationale: ὑποταγή означает покорность, подчинение. Русская конструкция «со всей покорностью» естественно передаёт полноту πάσῃ, не добавляя отсутствующего в греческом тексте объекта подчинения.
theological_decisions:
- issue: Следует ли понимать ἡσυχία как абсолютное молчание или как тихое, спокойное поведение
  choice: тишина
  alternative: безмолвие; спокойствие
  rationale: Слово допускает значение молчания, но также может обозначать спокойный и не нарушающий порядка образ поведения. Основной перевод не усиливает требование до безусловной немоты, а примечание сохраняет смысловой диапазон.
- issue: Следует ли переводить γυνή как «женщина» или «жена»
  choice: женщина
  alternative: жена
  rationale: Непосредственный контекст не обозначает однозначно брачные отношения. «Женщина» сохраняет более широкое значение исходного слова, тогда как вариант «жена» отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным звучанием. Повелительная конструкция «пусть учится» близка к греческой форме и понятна обычному читателю; формулировка не уточняет объект покорности, поскольку он не назван в исходном тексте.
