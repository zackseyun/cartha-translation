  text: εἷς γὰρ θεός, εἷς καὶ μεσίτης θεοῦ καὶ ἀνθρώπων ἄνθρωπος Χριστὸς Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/005.yaml
  text: For there is one God[a], and one mediator between God and men, the man Messiah Jesus[c][b],
translation:
  language: ru
  text: Ведь Бог один, и один посредник между Богом и людьми — человек Мессия Иисус.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человек Христос Иисус». Греч. Χριστός означает «Мессия», «Помазанник».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἷς
  choice: один
  rationale: 'Одинаковый перевод обоих употреблений сохраняет подчёркнутый параллелизм: один Бог — один посредник.'
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предыдущей мыслью естественным для современного русского языка способом.
- source_word: μεσίτης
  choice: посредник
  rationale: Точный и общепонятный эквивалент для лица, стоящего между двумя сторонами и соединяющего их.
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: между Богом и людьми
  rationale: Хотя в греческом стоят родительные падежи, русское управление слова «посредник» естественно требует конструкции «между… и…».
- source_word: ἄνθρωπος
  choice: человек
  rationale: Сохраняет прямое утверждение подлинной человечности посредника; отсутствие артикля в греческом допускает качественно-аппозитивное понимание.
- source_word: Χριστὸς Ἰησοῦς
  choice: Мессия Иисус
  rationale: Χριστός передано как титул «Мессия», а Ἰησοῦς — как личное имя; сохранён порядок исходного текста.
theological_decisions:
- issue: Связь ἀνθρώπων и ἄνθρωπος
  choice: «людьми — человек»
  alternative: «человечеством — человек»
  rationale: Русское «людьми» естественно обозначает всех людей, а повтор корня, возможный в английском, по-русски не требуется для сохранения смысла. Слово «человек» прямо подчёркивает человечность Иисуса.
- issue: Передача Χριστός как титула
  choice: «Мессия Иисус»
  alternative: «Христос Иисус»
  rationale: Здесь Χριστός сохраняет титульную силу; перевод «Мессия» делает её прозрачной и не превращает слово в подобие второго имени.
- issue: Христологическое значение ἄνθρωπος Χριστὸς Ἰησοῦς
  choice: Прямо назвать посредника человеком, не добавляя пояснений о его природе
  alternative: Развернуть формулировку так, чтобы явно оговорить его божественность
  rationale: Стих подчёркивает человечность Иисуса, но сам по себе не отрицает и не формулирует его божественность. Перевод сохраняет эту богословскую напряжённость и ничего не привносит.
translation_notes:
  register: Современный литературный русский язык; достоинство и сжатый параллелизм оригинала сохранены. Тире ясно вводит приложение, отождествляющее единственного посредника с человеком — Мессией Иисусом.
