source:
  edition: SBLGNT
  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: ru
  text: Так же и женщины пусть украшают себя подобающей одеждой[a], со скромностью и самообладанием, не плетёными причёсками, золотом, жемчугом или дорогими нарядами[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «приличной одеждой», «скромным нарядом».'
    reason: lexical_alternative
  - marker: b
    text: Перечень «плетёные причёски, золото, жемчуг или дорогие наряды», вероятно, направлен против показной роскоши, а не устанавливает безусловный запрет на любые косы и украшения при всех обстоятельствах.
    reason: cultural_note
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: так же и
  rationale: Передаёт как связь с предшествующим наставлением, так и добавочное καί, естественно звуча по-русски.
- source_word: γυναῖκας
  choice: женщины
  rationale: В общем наставительном контексте множественное число без указания на брачные отношения означает женщин, а не исключительно жён.
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: подобающей одеждой
  rationale: καταστολή здесь обозначает одежду или наряд, а κόσμιος — пристойность, упорядоченность и соответствие принятому благоприличию.
- source_word: μετὰ αἰδοῦς
  choice: со скромностью
  rationale: αἰδώς выражает внутреннее чувство приличия и сдержанность, удерживающую от неподобающего поведения или вида.
- source_word: σωφροσύνης
  choice: самообладанием
  rationale: Передаёт разумную сдержанность и владение собой, не сводя значение слова только к внешней скромности.
- source_word: κοσμεῖν ἑαυτάς
  choice: пусть украшают себя
  rationale: Сохраняет образ украшения и передаёт наставительную силу зависимого инфинитива естественной русской конструкцией.
- source_word: μὴ ἐν πλέγμασιν
  choice: не плетёными причёсками
  rationale: πλέγματα обозначает заплетённые волосы или сложные плетения; выбранная формулировка ясна и не добавляет прямо отсутствующего в тексте определения «роскошными».
- source_word: χρυσίῳ
  choice: золотом
  rationale: Сохраняет широкое обозначение материала украшений, не уточняя без необходимости их форму.
- source_word: μαργαρίταις
  choice: жемчугом
  rationale: Прямое и обычное соответствие греческому слову в перечне дорогих украшений.
- source_word: ἱματισμῷ πολυτελεῖ
  choice: дорогими нарядами
  rationale: Передаёт одежду, отличающуюся высокой стоимостью; «наряды» естественно сочетаются с перечислением способов внешнего украшения.
theological_decisions:
- issue: Обращено ли наставление ко всем женщинам или только к жёнам
  choice: к женщинам вообще
  alternative: только к жёнам
  rationale: В контексте общих наставлений и без показателей брачных отношений γυναικας естественнее понимать в общем смысле.
- issue: Является ли перечень абсолютным запретом любых кос, золота, жемчуга и дорогой одежды
  choice: текст дословно сохраняет запретительную форму, а примечание указывает на вероятную направленность против показной роскоши
  alternative: абсолютный запрет каждого из перечисленных предметов при любых обстоятельствах
  rationale: Синтаксис противопоставляет подобающий вид, скромность и самообладание демонстративным средствам украшения. Однако неоднозначность не снимается в основном тексте интерпретирующей вставкой.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизмов. «Самообладание» сохраняет этическую силу σωφροσύνη, а «подобающая одежда» передаёт социально-нравственный оттенок κόσμιος. Пунктуация с конечной запятой сохранена, поскольку стих синтаксически продолжается в 1 Тим 2:10.
