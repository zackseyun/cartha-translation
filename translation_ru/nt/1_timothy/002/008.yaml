  yaml_path: translation/nt/1_timothy/002/008.yaml
  text: Therefore I want the men in every place to pray[a], lifting up holy hands without anger or quarreling.
translation:
  language: ru
  text: Итак, я хочу, чтобы мужчины во всяком месте молились, поднимая святые руки без гнева и споров.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «без гнева и сомнения». Греческое слово может означать внутренние рассуждения или сомнение, но здесь, вероятно, речь идёт о спорах, вызывающих раздор в собрании.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βούλομαι
  choice: я хочу
  rationale: Передаёт волю и настойчивое желание Павла естественным современным русским языком.
- source_word: οὖν
  choice: итак
  rationale: Сохраняет логическую связь с предшествующим рассуждением и звучит естественно в русском наставлении.
- source_word: προσεύχεσθαι
  choice: молились
  rationale: Обычный русский эквивалент; сослагательная конструкция после «хочу, чтобы» естественно передаёт зависимый инфинитив.
- source_word: τοὺς ἄνδρας
  choice: мужчины
  rationale: ἀνήρ здесь обозначает именно мужчин, а не людей вообще; контекст далее отдельно обращается к женщинам.
- source_word: ἐν παντὶ τόπῳ
  choice: во всяком месте
  rationale: Сохраняет распределительное значение исходной фразы и её несколько торжественный библейский регистр.
- source_word: ἐπαίροντας
  choice: поднимая
  rationale: Естественно передаёт сопутствующий молитве жест и связь причастия с мужчинами.
- source_word: ὁσίους χεῖρας
  choice: святые руки
  rationale: Прямо передаёт ὅσιος как нравственную и религиозную святость, не подменяя его отдельным понятием ритуальной чистоты.
- source_word: χωρὶς
  choice: без
  rationale: Точно выражает отсутствие названных состояний и действий.
- source_word: ὀργῆς
  choice: гнева
  rationale: Точный и естественный русский эквивалент в межличностном контексте.
- source_word: διαλογισμοῦ
  choice: споров
  rationale: В сочетании с «гневом» и в контексте общей молитвы вероятнее всего обозначает пререкания или конфликтные рассуждения; множественное число естественно по-русски.
theological_decisions:
- issue: Гендерная определённость τοὺς ἄνδρας
  choice: мужчины
  alternative: люди; все; мужья
  rationale: Форма ἀνήρ здесь гендерно определённа, а ближайший контекст содержит различающиеся наставления мужчинам и женщинам. Обобщение до «все» устранило бы эту особенность текста.
- issue: Значение διαλογισμοῦ при наставлении о молитве
  choice: споры
  alternative: сомнение; внутренние колебания; пререкания
  rationale: Сочетание с гневом поддерживает межличностный смысл конфликтных споров, однако значение внутреннего сомнения лексически возможно и потому отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским оттенком. «Во всяком месте» сохраняет форму оригинала; синтаксис остаётся ясным для обычного читателя.
