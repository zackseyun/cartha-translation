lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Вводит основание для предшествующего наставления; «ведь» естественно передаёт пояснительно-причинную связь, не усиливая её до отдельного придаточного причины.
- source_word: Ἀδὰμ
  choice: Адам
  rationale: Устоявшаяся русская форма библейского личного имени.
- source_word: πρῶτος
  choice: сначала
  rationale: Передаёт временную последовательность по отношению к созданию Евы и естественно сочетается с последующим «а затем».
- source_word: ἐπλάσθη
  choice: был создан
  rationale: В данном контексте обозначает Божье формирование человека. «Создан» звучит естественно в современном русском тексте, а более буквальная связь с образом придания формы отмечена в сноске.
- source_word: εἶτα
  choice: а затем
  rationale: Ясно обозначает последующее событие; союз «а» естественно сопоставляет два звена последовательности без добавления смыслового противопоставления.
- source_word: Εὕα
  choice: Ева
  rationale: Устоявшаяся русская форма библейского личного имени.
theological_decisions:
- issue: Связь с порядком сотворения в Бытии в контексте споров о церковном служении
  choice: 'Передать стих как простое утверждение временной последовательности: сначала Адам, затем Ева.'
  alternative: Включить в перевод вывод об авторитете или различии ролей.
  rationale: Сам греческий текст этого стиха прямо указывает лишь порядок формирования и не формулирует его богословские следствия. Перевод сохраняет эту напряжённость и не привносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. Конструкция «Ведь сначала… а затем…» сохраняет пояснительную функцию γὰρ и простой временной порядок исходного текста.
