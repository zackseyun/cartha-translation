  text: ⸂διδάσκειν δὲ γυναικὶ⸃ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ’ εἶναι ἐν ἡσυχίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: ru
  text: Но я не позволяю женщине учить или властвовать над мужчиной[a][b]; напротив, ей следует пребывать в тишине[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жене… над мужем». Греческие слова могут обозначать как женщину и мужчину вообще, так и жену и мужа.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «иметь власть над»; возможно также: «господствовать над». Греческий глагол редок, и его точный оттенок остаётся предметом споров.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в спокойствии» или «в молчании». В зависимости от контекста греческое слово может обозначать спокойствие, тишину или молчание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διδάσκειν
  choice: учить
  rationale: Прямо передаёт значение инфинитива, зависящего от «не позволяю», без ненужного уточнения вида или длительности действия.
- source_word: δὲ
  choice: но
  rationale: Передаёт мягкое противопоставление или переход от предыдущего наставления к данному ограничению.
- source_word: γυναικὶ
  choice: женщине
  rationale: γυνή может означать как женщину вообще, так и жену; контекст 2:9–15 позволяет предпочесть общее значение, сохранив брачное прочтение в сноске.
- source_word: οὐκ ἐπιτρέπω
  choice: я не позволяю
  rationale: Естественно передаёт настоящее время как общее утверждение и сохраняет сдержанно-официальный регистр греческого выражения.
- source_word: οὐδὲ
  choice: или
  rationale: 'В сфере действия отрицания естественно связывает второй запрещаемый инфинитив с первым: «не позволяю… учить или…».'
- source_word: αὐθεντεῖν
  choice: осуществлять власть над
  rationale: Редкий и спорный глагол передан нейтральным выражением власти без обязательного оттенка злоупотребления; иные возможные оттенки указаны в сноске.
- source_word: ἀνδρός
  choice: мужчиной
  rationale: ἀνήρ может означать мужчину или мужа; общее значение выбрано для основного текста, а брачное сохранено как допустимая альтернатива.
- source_word: ἀλλ’
  choice: напротив
  rationale: Ясно вводит положительное требование, противопоставленное двум предшествующим запретам.
- source_word: εἶναι
  choice: ей следует пребывать
  rationale: Делает зависимую инфинитивную конструкцию естественной по-русски и выражает предписываемое состояние без добавления идеи продолжительности.
- source_word: ἐν ἡσυχίᾳ
  choice: в спокойствии
  rationale: Сохраняет значение спокойного, мирного состояния и не сводит выражение однозначно к полному молчанию.
theological_decisions:
- issue: Значение редкого глагола αὐθεντεῖν в спорном церковном тексте
  choice: осуществлять власть над
  alternative: иметь власть над; господствовать над
  rationale: Нейтральная формулировка не навязывает ни исключительно должностного, ни обязательно деспотического смысла. Лексическая неопределённость прямо отмечена в сноске.
- issue: Следует ли понимать γυνή / ἀνήρ как «женщина / мужчина» или как «жена / муж»
  choice: женщина … мужчина
  alternative: жена … муж
  rationale: Оба существительных допускают общее и брачное значения. Более широкий контекст позволяет выбрать общее значение в основном тексте, не исключая брачного прочтения.
- issue: Объём значения ἡσυχία
  choice: спокойствие
  alternative: тишина; молчание
  rationale: Так сохраняется возможный смысл спокойного, невозмутимого поведения и не утверждается безусловно, что речь идёт о полном отсутствии речи.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизации. Синтаксис сделан естественным для русского читателя; спорные лексические и богословски значимые варианты не устранены, а вынесены в сноски.
