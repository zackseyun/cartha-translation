  text: ⸀τοῦτο καλὸν καὶ ἀπόδεκτον ἐνώπιον τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/003.yaml
  text: This is good and acceptable before God our Savior,
translation:
  language: ru
  text: Это хорошо и угодно Богу, нашему Спасителю,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: Это
  rationale: Указательное местоимение среднего рода отсылает к предшествующему наставлению о молитве; «это» естественно передаёт анафорическую связь, не уточняя её сверх текста.
- source_word: καλὸν
  choice: хорошо
  rationale: В данном этическом контексте слово обозначает нравственно доброе и должное, а не эстетически прекрасное.
- source_word: ἀπόδεκτον
  choice: угодно
  rationale: Прилагательное обозначает то, что принимается благосклонно. В сочетании с указанием на Божью оценку «угодно» звучит естественно и сохраняет смысл благоприятного принятия.
- source_word: ἐνώπιον
  choice: Богу
  rationale: Конструкция ἐνώπιον с родительным выражает оценку перед лицом Бога, то есть в Его глазах. По-русски это естественно передаётся дательным при сказуемом «угодно» без отдельного пространственного оборота.
- source_word: σωτῆρος
  choice: Спасителю
  rationale: «Спаситель» — устойчивый и точный эквивалент титула σωτήρ, сохраняющий его богословскую значимость.
- source_word: ἡμῶν
  choice: нашему
  rationale: Притяжательное местоимение прямо сохранено и согласовано с приложением «Спасителю».
- source_word: θεοῦ
  choice: Богу
  rationale: 'Существительное связано приложением с «нашим Спасителем»: Бог отождествляется как наш Спаситель. Русский порядок слов ясно и естественно передаёт эту связь.'
theological_decisions:
- issue: Отношение приложения в τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: «Богу, нашему Спасителю»
  alternative: «нашему Спасителю Богу»
  rationale: Греческие формы родительного падежа естественно понимаются как приложение, называющее Бога нашим Спасителем. Выбранная русская конструкция идиоматична и не добавляет утверждений сверх текста.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Оборот «угодно Богу» естественно объединяет значения ἀπόδεκτον и ἐνώπιον; запятая после «Спасителю» сохранена, поскольку стих синтаксически продолжается в 2:4.
