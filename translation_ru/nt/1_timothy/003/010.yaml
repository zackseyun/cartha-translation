base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/010.yaml
  text: And these also must first be tested[a]; then let them serve[b], being beyond reproach.
translation:
  language: ru
  text: Пусть и они сначала будут проверены; затем пусть служат[a], будучи безупречными[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В данном контексте возможно: «служат как диаконы» или «исполняют диаконское служение». Греческий глагол буквально означает «служить».'
    reason: lexical_alternative
  - marker: b
    text: То есть против них нельзя выдвинуть обоснованного обвинения; речь не идёт об абсолютной безгрешности.
    reason: lexical_clarification
lexical_decisions:
- source_word: καὶ οὗτοι δὲ
  choice: Пусть и они
  rationale: Сочетание указывает на обсуждаемую группу и связывает предъявляемое к ней требование с предыдущими наставлениями. Русское «и они» естественно передаёт указательно-добавочный смысл без внесения отсутствующего в этой фразе существительного.
- source_word: δοκιμαζέσθωσαν πρῶτον
  choice: сначала будут испытаны
  rationale: δοκιμάζω обозначает испытание или проверку с целью установить пригодность; страдательная форма и повелительная сила сохранены конструкцией «пусть… будут испытаны», а πρῶτον — словом «сначала».
- source_word: εἶτα
  choice: затем
  rationale: 'Передаёт последовательность: служение допускается после предварительного испытания.'
- source_word: διακονείτωσαν
  choice: пусть служат
  rationale: Глагол означает «служить» и в данном контексте может подразумевать диаконское служение. Основной текст сохраняет лексическую форму и контекстуальную неоднозначность, а должностное понимание отмечено в сноске.
- source_word: ἀνέγκλητοι ὄντες
  choice: если они безупречны
  rationale: Причастный оборот выражает необходимое состояние лиц, допускаемых к служению. Условная конструкция естественна по-русски и ясно связывает безупречность с результатом испытания, не подразумевая абсолютной безгрешности.
theological_decisions:
- issue: Имеет ли διακονείτωσαν общее значение «служить» или специальное значение «служить как диаконы»
  choice: 'В основном тексте: «пусть служат»'
  alternative: «пусть служат как диаконы» / «пусть исполняют диаконское служение»
  rationale: Непосредственный контекст касается диаконов, однако в самой фразе употреблён глагол «служить», а не существительное «диакон». Перевод сохраняет эту форму и не устраняет контекстуальную должностную окраску, которая поясняется в сноске.
- issue: Означает ли ἀνέγκλητοι нравственную безгрешность
  choice: «безупречны» в смысле отсутствия обоснованного обвинения
  alternative: «непорочны»
  rationale: В перечне требований слово обозначает отсутствие веского основания для обвинения, а не абсолютное совершенство или безгрешность.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского текста синтаксисом. Страдательная конструкция сохраняет неопределённость относительно того, кто именно проводит испытание; условный оборот естественно выражает связь между проверкой и допуском к служению.
