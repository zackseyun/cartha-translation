    rationale: Μετὰ πάσης σεμνότητος означает «со всем достоинством» / «со всей подобающей серьёзностью». Русское «с полным достоинством» неестественно и может означать «в полной мере достойно», а не характеризовать достоинство как качество.
  - severity: low
    issue: Оборот «держащий детей в подчинении»
