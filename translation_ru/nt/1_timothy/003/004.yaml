lexical_decisions:
- source_word: τοῦ ἰδίου οἴκου
  choice: своим домом
  rationale: В данном контексте οἶκος обозначает не только жилище, но прежде всего домочадцев и семейный уклад. Русское «свой дом» естественно охватывает эту домашнюю сферу и передаёт усиленное притяжательное значение ἰδίου.
- source_word: καλῶς
  choice: хорошо
  rationale: Наречие прямо характеризует исполнение руководящей обязанности; «хорошо» кратко и естественно передаёт смысл надлежащего, достойного управления.
- source_word: προϊστάμενον
  choice: управляющий
  rationale: Причастие выражает ответственное руководство и попечение с реальными полномочиями. «Управляющий» сохраняет этот смысл, не придавая ему излишне жёсткого оттенка слова «властвующий».
- source_word: τέκνα ἔχοντα
  choice: держащий детей
  rationale: Оборот с ἔχω в сочетании с ἐν ὑποταγῇ описывает поддержание определённого порядка. «Держащий детей в подчинении» естественно воспроизводит всю конструкцию, хотя буквально ἔχοντα означает «имеющий».
- source_word: ἐν ὑποταγῇ
  choice: в подчинении
  rationale: Существительное ὑποταγή обозначает подчинённость установленному порядку. Такой перевод сохраняет именную форму и не сужает значение до отдельных проявлений послушания.
- source_word: μετὰ πάσης σεμνότητος
  choice: с полным достоинством
  rationale: σεμνότης передаёт достоинство, серьёзность и почтенность поведения, а πάσης усиливает полноту качества. Формулировка сохраняет нравственный вес выражения и не устраняет синтаксическую неоднозначность его связи.
theological_decisions:
- issue: Объём выражения о руководстве домом
  choice: Стих говорит об ответственном руководстве собственным домом как о требовании к кандидату в надзиратели.
  alternative: Понимать выражение либо как утверждение жёсткой патриархальной власти вообще, либо как одно лишь заботливое служение без властных полномочий.
  rationale: προΐστημι и ὑποταγή предполагают действительное руководство и упорядоченность, однако данный стих формулирует конкретное требование, а не исчерпывающее учение о семейной власти.
- issue: К чему относится выражение μετὰ πάσης σεμνότητος
  choice: Сохранить возможность его связи как с подчинением детей, так и с общим характером управления домом.
  alternative: Однозначно отнести достоинство только к поведению детей или только к манере управления отца.
  rationale: Греческий порядок слов допускает оба понимания; перевод и примечание не должны искусственно устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством, подобающим перечню требований к церковному служителю. Синтаксис сохраняет причастную форму исходного фрагмента, предполагающего связь с контекстом предыдущего стиха. Термины власти переданы ясно, но без архаической или чрезмерно суровой окраски.
