source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος· εἴ τις ἐπισκοπῆς ὀρέγεται, καλοῦ ἔργου ἐπιθυμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/001.yaml
  text: 'This saying is trustworthy: if anyone aspires to oversight[b][a], he desires a good work.'
translation:
  language: ru
  text: 'Это верное слово: если кто стремится к обязанности надзора[a], тот желает доброго дела[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к попечительству»; традиционно: «к епископству» или «к должности епископа».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «благородного дела».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Верно это слово
  rationale: Передаёт устойчивую формулу Пастырских посланий, вводящую заслуживающее доверия утверждение; сохраняет образ λόγος («слово, изречение»), не делая фразу неестественной по-русски.
- source_word: εἴ τις
  choice: если кто
  rationale: Неопределённое местоимение τις само по себе имеет обобщённое значение; русский оборот «если кто» естественен и не добавляет к этой фразе ограничения по полу.
- source_word: ἐπισκοπῆς
  choice: к служению надзирателя
  rationale: Передаёт попечение и руководство, связанные с ἐπισκοπή, и сохраняет связь с ἐπίσκοπος в следующем стихе. Слово «служение» подчёркивает труд, а не сан, и не переносит в текст позднейшую церковную иерархию.
- source_word: ὀρέγεται
  choice: стремится к
  rationale: Глагол обозначает устремлённость к чему-либо; «стремится к» естественно выражает намерение и сохраняет положительный оттенок контекста.
- source_word: καλοῦ ἔργου
  choice: доброго дела
  rationale: Близко передаёт как оценку καλός, так и конкретное указание на ἔργον — дело или труд, а не положение и почёт.
- source_word: ἐπιθυμεῖ
  choice: желает
  rationale: Прямо и без чрезмерного усиления передаёт положительное желание, сохраняя смысловой параллелизм с ὀρέγεται.
theological_decisions:
- issue: Следует ли передавать ἐπισκοπή термином позднейшей церковной иерархии
  choice: служение надзирателя
  alternative: епископство; должность епископа
  rationale: Греческое слово обозначает надзор, попечение или связанную с ними ответственность и не требует понимания в смысле позднейшего епископского устройства. Выбранный вариант сохраняет служебный характер роли и связь со следующим стихом.
- issue: Следует ли при переводе εἴ τις прямо указывать на мужчину
  choice: если кто
  alternative: если мужчина
  rationale: Местоимение τις в условной фразе неопределённое и обобщённое. Поэтому перевод не вносит в саму эту фразу уточнение, которого она лексически не выражает, оставляя дальнейшему контексту описание требований к надзирателю.
translation_notes:
  register: Современный литературный русский язык с краткой, весомой формулировкой. «Служение надзирателя» понятно без привязки к конкретной конфессиональной системе; синтаксическая конструкция «если кто…, тот…» естественно передаёт греческое условие и избегает ненужного местоименного уточнения.
