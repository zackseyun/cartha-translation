id: 1TI.3.6
reference: 1 Timothy 3:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μὴ νεόφυτον, ἵνα μὴ τυφωθεὶς εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/006.yaml
  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: ru
  text: Он не должен быть новообращённым, чтобы, возгордившись, не подпасть под суд дьявола.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не подвергнуться тому же осуждению, что и дьявол»; возможно также: «не подпасть под суд, связанный с дьяволом».'
    reason: alternative_reading
lexical_decisions:
- source_word: νεόφυτον
  choice: новообращённым
  rationale: Буквально слово означает «недавно посаженный», но здесь метафорически обозначает человека, недавно обратившегося к вере. «Новообращённый» ясно и естественно передаёт церковный контекст.
- source_word: τυφωθεὶς
  choice: возгордившись
  rationale: Причастие указывает на ослепляющее самомнение, надменность. «Возгордившись» естественно передаёт нравственное предостережение, не добавляя отсутствующей в тексте причины.
- source_word: κρίμα
  choice: суд
  rationale: Слово может обозначать как судебное решение вообще, так и осуждение. Более широкое «суд» сохраняет эту смысловую неоднозначность.
- source_word: τοῦ διαβόλου
  choice: дьявола
  rationale: Родительный падеж в греческом допускает разные смысловые отношения. Столь же краткое русское сочетание «суд дьявола» не устраняет неоднозначность основного текста.
- source_word: ἐμπέσῃ
  choice: подпасть под
  rationale: В сочетании с «судом» выражение «подпасть под» звучит по-русски естественнее буквального «впасть в», сохраняя смысл попадания под опасное решение или осуждение.
- source_word: ἵνα μὴ
  choice: чтобы… не
  rationale: Обычная современная русская конструкция ясно передаёт целевое или результативное предостережение.
theological_decisions:
- issue: Значение выражения εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου
  choice: В основном тексте сохранено неоднозначное выражение «подпасть под суд дьявола».
  alternative: «подвергнуться тому же осуждению, что и дьявол»; «подпасть под суд, связанный с дьяволом»; возможно, «подпасть под суд со стороны дьявола».
  rationale: Греческий родительный τοῦ διαβόλου сам по себе не устанавливает однозначно, идёт ли речь об осуждении, которому подвергся дьявол, о суде, связанном с ним, или о суде с его стороны. Перевод не разрешает эту богословскую напряжённость за читателя.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и понятная формулировка. Причастная конструкция «возгордившись» сохраняет причинно-временную связь без тяжеловесности. Маркер сноски поставлен у неоднозначного выражения, которое он поясняет.
