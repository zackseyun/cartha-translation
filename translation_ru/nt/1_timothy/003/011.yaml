  text: γυναῖκας ὡσαύτως σεμνάς, μὴ διαβόλους, νηφαλίους, πιστὰς ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: ru
  text: Женщины также должны быть достойными уважения[a], не клеветницами, трезвомыслящими, верными во всём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Жёны также должны быть достойными уважения…» Греческое слово γυναῖκας в этом контексте может означать и «женщины», и «жёны»; в тексте прямо не сказано «их жёны».'
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: Женщины
  rationale: Форма от γυνή может означать как «женщины», так и «жёны». В греческом тексте нет ни артикля, ни притяжательного слова «их», поэтому основной текст не уточняет, что речь именно о жёнах; существенная альтернатива сохранена в сноске.
- source_word: ὡσαύτως
  choice: также
  rationale: Передаёт структурную параллель с предшествующим перечнем требований естественным современным русским языком.
- source_word: σεμνάς
  choice: достойными уважения
  rationale: Передаёт сочетание нравственной серьёзности, достоинства и почтенности без архаичности и без сведения смысла лишь к внешней степенности.
- source_word: μὴ διαβόλους
  choice: не клеветницами
  rationale: Здесь διάβολος употреблено как характеристика злословящих или ложно обвиняющих людей, а не как имя дьявола.
- source_word: νηφαλίους
  choice: трезвомыслящими
  rationale: Сохраняет образ трезвости и выражает ясность, сдержанность и здравость мышления; это точнее отражает νηφάλιος, чем более широкое «владеющими собой».
- source_word: πιστὰς
  choice: верными
  rationale: 'Сохраняет широту πιστός: верность, надёжность и заслуживающий доверия характер.'
- source_word: ἐν πᾶσιν
  choice: во всём
  rationale: Естественно и полно передаёт всеохватность греческого выражения.
theological_decisions:
- issue: Кого обозначает γυναῖκας в перечне требований
  choice: Женщины
  alternative: Жёны
  rationale: Греческое γυνή допускает оба значения. Отсутствие явного «их» не позволяет переводить как «их жёны» без добавления, а ὡσαύτως поддерживает самостоятельное введение группы. Поскольку контекст допускает понимание как женщин-служителей, так и жён диаконов, альтернативное прочтение отмечено в сноске без разрешения спорного вопроса в пользу одной церковной позиции.
translation_notes:
  register: Современный литературный русский язык; достоинство и лаконичность перечня сохранены. Женские формы согласованы с γυναῖκας. Формулировка не вводит конфессионального решения относительно служения женщин или статуса жён диаконов.
