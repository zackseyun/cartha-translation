  text: Ταῦτά σοι γράφω, ἐλπίζων ἐλθεῖν πρὸς σὲ ⸂ἐν τάχει⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/014.yaml
  text: I am writing these things to you[a], hoping to come to you soon,
translation:
  language: ru
  text: Всё это пишу тебе, надеясь вскоре[a] прийти к тебе,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быстро»; возможно также: «через короткое время».'
    reason: Лексическое выражение ἐν τάχει может указывать как на скорое наступление события, так и на быстроту действия.
lexical_decisions:
- source_word: Ταῦτά
  choice: всё это
  rationale: Форма среднего рода множественного числа указывает на совокупность наставлений; «всё это» естественно передаёт это значение по-русски.
- source_word: σοι
  choice: тебе
  rationale: Дательный падеж при γράφω обозначает адресата письма.
- source_word: γράφω
  choice: пишу
  rationale: Настоящее время естественно передаёт совершаемое автором действие письма.
- source_word: ἐλπίζων
  choice: надеясь
  rationale: Причастие выражает сопутствующую главному действию надежду автора, не превращая её в уверенное ожидание.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: прийти к тебе
  rationale: Оборот с πρός и винительным падежом обозначает движение к адресату.
- source_word: ἐν τάχει
  choice: вскоре
  rationale: В данном контексте идиома естественно означает прибытие в ближайшее время, хотя допускает оттенок быстроты действия.
