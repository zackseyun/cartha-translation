  text: Διακόνους ὡσαύτως σεμνούς, μὴ διλόγους, μὴ οἴνῳ πολλῷ προσέχοντας, μὴ αἰσχροκερδεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/008.yaml
  text: Deacons likewise must be dignified[a], not double-tongued, not devoted to much wine, not greedy for shameful gain[c][b],
translation:
  language: ru
  text: Диаконы также должны быть достойны уважения, не двуличны в речах[a], не увлекаться вином в больших количествах[b] и не быть падкими на постыдную наживу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не говорящими одному одно, а другому — другое».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не пристрастными к многому вину»; то есть не приверженными употреблению большого количества вина.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не стремящимися к постыдной выгоде».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακόνους
  choice: Диаконы
  rationale: В данном перечне требований слово обозначает признанное церковное служение, параллельное служению надзирателей в предыдущих стихах; поэтому контекстуально точнее должностное наименование, а не общее «служители».
- source_word: ὡσαύτως
  choice: также
  rationale: Связывает требования к диаконам с предшествующими требованиями к надзирателям и естественно звучит по-русски.
- source_word: σεμνούς
  choice: достойны уважения
  rationale: Передаёт почтенность и достойное поведение, не создавая оттенка угрюмой или чрезмерной серьёзности.
- source_word: μὴ διλόγους
  choice: не двуличны в речах
  rationale: 'Передаёт речевую неискренность: человек не должен говорить разным людям противоречащие друг другу вещи. Добавление «в речах» ограничивает смысл именно областью речи.'
- source_word: μὴ οἴνῳ πολλῷ προσέχοντας
  choice: не склонны пить много вина
  rationale: Естественно передаёт устойчивую привязанность к употреблению большого количества вина, сохраняя смысл πολλῷ и не вводя современный клинический термин зависимости.
- source_word: μὴ αἰσχροκερδεῖς
  choice: не падки на постыдную наживу
  rationale: Сохраняет как жадное стремление к выгоде, так и нравственно позорный характер такой прибыли; выражение понятно и идиоматично в современном русском языке.
theological_decisions:
- issue: Статус διάκονος в данном контексте
  choice: 'Передать как название церковного служения: «диаконы»'
  alternative: «служители» или «слуги»
  rationale: Параллельный перечень требований после требований к надзирателям указывает на определённую церковную роль. «Диаконы» сохраняет эту контекстуальную конкретность, не приписывая роли более позднее конфессиональное устройство.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным тоном. Синтаксически добавлено подразумеваемое из контекста «должны быть»; далее использованы однородные краткие формы. Образность греческих выражений сохранена там, где она остаётся понятной, а менее естественные буквальные варианты вынесены в сноски.
