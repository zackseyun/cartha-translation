base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: ru
  text: Итак, епископ должен быть безупречным, мужем одной жены[a], трезвомыслящим, рассудительным, благопристойным, гостеприимным, способным учить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верным своей жене»; буквально: «мужем одной женщины». Выражение может подчёркивать супружескую верность, а не только брачный статус.'
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: должен
  rationale: Передаёт необходимость и обязательность требования, а не простую рекомендацию.
- source_word: οὖν
  choice: итак
  rationale: Естественно обозначает вывод из предшествующего рассуждения и сохраняет логическую связь.
- source_word: ἐπίσκοπον
  choice: надзиратель
  rationale: Передаёт смысл греческого наименования служения, не внося более позднюю церковную терминологию.
- source_word: ἀνεπίλημπτον
  choice: безупречным
  rationale: Обозначает человека, которому нельзя предъявить обоснованное обвинение, не подразумевая абсолютной безгрешности.
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: мужем одной жены
  rationale: Формально и естественно сохраняет мужскую формулировку греческого текста и не разрешает спорные вопросы о точном объёме требования.
- source_word: νηφάλιον
  choice: трезвомыслящим
  rationale: Передаёт ясность ума и сдержанность, не сводя значение лишь к воздержанию от вина.
- source_word: σώφρονα
  choice: рассудительным
  rationale: Передаёт здравое, дисциплинированное суждение и при этом отличает качество от стоящего рядом νηφάλιον.
- source_word: κόσμιον
  choice: достойным
  rationale: В данном перечне выражает благопристойность и достойное поведение на естественном современном русском языке.
- source_word: φιλόξενον
  choice: гостеприимным
  rationale: Краткий и общепонятный эквивалент добродетели, связанной с радушным приёмом гостей и странников.
- source_word: διδακτικόν
  choice: способным учить
  rationale: Передаёт пригодность и умение наставлять, а не только желание это делать.
theological_decisions:
- issue: Толкование выражения μιᾶς γυναικὸς ἄνδρα в требованиях к церковному служителю
  choice: 'В основном тексте: «мужем одной жены»'
  alternative: '«верным своей жене»; более буквально: «мужем одной женщины»'
  rationale: 'Выражение допускает разные толкования: акцент на супружеской верности, запрет многожёнства либо ограничения, связанные с повторным браком. Формальная передача сохраняет эту богословскую и церковную напряжённость, а примечание указывает важную смысловую возможность.'
translation_notes:
  register: Современный литературный русский язык; достоинство и лаконичность перечня сохранены. Смежные νηφάλιον и σώφρονα разведены как «трезвомыслящим» и «рассудительным», чтобы не смешивать ясность и сдержанность ума со здравым самоконтролем.
