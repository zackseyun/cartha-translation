base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
translation:
  language: ru
  text: Кроме того, он должен пользоваться хорошей репутацией у тех, кто вне общины[a], чтобы не подвергнуться поношению[b] и не попасть в ловушку дьявола[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от тех, кто снаружи»; имеются в виду люди вне христианской общины.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «не впасть в бесчестье».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможный перевод: «в ловушку клеветника», если διάβολος понимать здесь в нарицательном смысле; в основном тексте слово понято как обозначение дьявола.'
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: должен
  rationale: Передаёт необходимость и обязательность этого требования к надзирателю без ослабления до простого пожелания.
- source_word: δὲ καὶ
  choice: Кроме того
  rationale: Естественно связывает стих с предыдущим перечнем и вводит дополнительное требование.
- source_word: μαρτυρίαν καλὴν ἔχειν
  choice: иметь хорошую репутацию
  rationale: В данном контексте речь идёт о благоприятном свидетельстве окружающих о человеке. «Хорошая репутация» естественно выражает это по-русски, не сводя μαρτυρία к формальному показанию.
- source_word: ἀπὸ τῶν ἔξωθεν
  choice: у посторонних
  rationale: Обозначает людей вне христианской общины. Краткая русская формулировка сохраняет границу между общиной и внешними людьми; точное значение пояснено в сноске.
- source_word: ἵνα μὴ
  choice: чтобы не
  rationale: Передаёт отрицательную целевую или результативную связь без искусственного уточнения одного из возможных оттенков.
- source_word: εἰς ὀνειδισμὸν ἐμπέσῃ
  choice: не навлечь на себя поношения
  rationale: Естественная русская передача образного греческого выражения «впасть в поношение», сохраняющая смысл публичного порицания и бесчестья.
- source_word: παγίδα
  choice: ловушку
  rationale: Ясно и современно передаёт метафору западни или силка.
- source_word: τοῦ διαβόλου
  choice: дьявола
  rationale: В контексте Нового Завета сочетание наиболее вероятно указывает на личного противника; альтернативное нарицательное значение сохранено в сноске.
theological_decisions:
- issue: Значение τοῦ διαβόλου
  choice: дьявол как личный духовный противник
  alternative: клеветник или ловушка клеветника
  rationale: Употребление διάβολος с артиклем в пастырских посланиях и в Новом Завете в целом поддерживает личный референт. Однако слово может нарицательно означать «клеветник», поэтому эта подлинная лексическая возможность отмечена в сноске.
- issue: Связь между поношением и ловушкой
  choice: два связанных, но грамматически различимых последствия
  alternative: поношение как сама ловушка дьявола
  rationale: Союз καί допускает тесную смысловую связь, но не требует отождествлять поношение с ловушкой. Перевод не вводит такого отождествления и сохраняет напряжение текста.
translation_notes:
  register: Современный литературный русский язык с достойным, но не архаичным звучанием. «Хорошая репутация» и «навлечь на себя поношение» выбраны ради естественности; термин «посторонние» пояснён, чтобы исключить значение случайных незнакомцев. Все сноски привязаны к соответствующим словам основного текста.
