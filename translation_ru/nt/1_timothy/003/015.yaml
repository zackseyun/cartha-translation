  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: ru
  text: Я пишу тебе это, чтобы, если я задержусь[a], ты знал, как следует вести себя в Божьем доме, то есть в общине живого Бога[b] — столпе и опоре истины[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если я замедлю с приходом»; речь идёт о возможной задержке Павла.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «церкви живого Бога».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «столп и твердыня истины»; для слова «опора» также предлагают перевод «основание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: я задержусь
  rationale: В контексте речь о возможной задержке Павла с прибытием; русское «задержусь» естественно передаёт непереходное значение без нравственного оттенка медлительности.
- source_word: ἵνα εἰδῇς
  choice: чтобы ты знал
  rationale: Прямо и естественно передаёт целевое придаточное.
- source_word: δεῖ ... ἀναστρέφεσθαι
  choice: как следует вести себя
  rationale: Передаёт нормативную необходимость и образ поведения; безличная греческая конструкция сохранена естественной русской формой.
- source_word: ἐν οἴκῳ θεοῦ
  choice: в Божьем доме
  rationale: Сохраняет образ οἶκος и допускает как значение дома, так и домочадцев; последующее пояснение показывает, что имеются в виду люди Божьи, а не здание.
- source_word: ἥτις ἐστίν
  choice: то есть ... которая есть
  rationale: «То есть» ясно передаёт пояснительное отношение между Божьим домом и общиной; местоимение «которая» грамматически связывает последующую метафору с общиной.
- source_word: ἐκκλησία
  choice: община
  rationale: «Община» обозначает собранный народ и в современном русском звучит естественнее буквального «собрание», не сводя смысл к зданию или учреждению.
- source_word: θεοῦ ζῶντος
  choice: живого Бога
  rationale: Устойчиво и точно передаёт греческое определение, сохраняя его богословский акцент.
- source_word: στῦλος
  choice: столп
  rationale: Сохраняет архитектурную метафору и достоинство библейского стиля; слово понятно в сочетании «столп истины».
- source_word: ἑδραίωμα
  choice: опора
  rationale: Передаёт редкое существительное как то, что придаёт устойчивость и поддерживает; не утверждает, будто община является источником истины.
- source_word: τῆς ἀληθείας
  choice: истины
  rationale: В русском определённость естественно выражается контекстом; речь идёт об определённой истине веры.
theological_decisions:
- issue: Значение ἐκκλησία в описании Божьего народа
  choice: община
  alternative: церковь; собрание
  rationale: «Община» подчёркивает людей, составляющих Божий дом, и не привносит представление о здании. Традиционное «церковь» отмечено в сноске.
- issue: К чему относится выражение «столп и опора истины»
  choice: к общине живого Бога
  alternative: к последующему подразумеваемому содержанию благочестия
  rationale: Ближайшая и синтаксически естественная связь — с ἐκκλησία; перевод сохраняет её явно, не перестраивая пунктуацию ради иной интерпретации.
- issue: Смысл ἑδραίωμα
  choice: опора
  alternative: основание; твердыня; утверждение
  rationale: Редкое слово допускает несколько оттенков. «Опора» сохраняет высокий статус общины по отношению к истине, но не снимает лексической неопределённости, которая отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Божьем» и «община» обеспечивают доступность, а «столп» сохраняет достоинство и архитектурную образность оригинала. Добавленное «пишу это» эксплицирует подразумеваемое действие главного предложения, как требует естественный русский синтаксис.
