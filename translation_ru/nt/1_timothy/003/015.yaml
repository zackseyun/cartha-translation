revisions:
- from: Но если я задержусь, пишу это, чтобы ты знал, как следует вести себя в Божьем доме, то есть в общине живого Бога[a], которая есть столп и опора истины[b].
  to: Я пишу тебе это, чтобы, если я задержусь[a], ты знал, как следует вести себя в Божьем доме, то есть в общине живого Бога[b] — столпе и опоре истины[c].
  rationale: Перестроен порядок слов, чтобы естественно по-русски передать зависимость ἵνα εἰδῇς от контекстуально подразумеваемого «пишу тебе это» из предыдущего стиха, не меняя смысла. Сохранены «Божий дом», «община», «живой Бог», «столп» и «опора». Сноски разделены и поставлены непосредственно после соответствующих слов; это устраняет неверную привязку, присутствующую в английском аудиторском следе, не воспроизводя её в русском тексте.
