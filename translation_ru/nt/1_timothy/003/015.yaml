review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: βραδύνω — возможная задержка с прибытием; οἶκος θεοῦ поясняется как ἐκκλησία; «столп и опора истины» относится к общине. Однако «пишу это» в данном стихе эксплицирует глагол γράφω из 3:14, а не присутствует в приведённом греческом тексте 3:15; в русском его следует оформить как контекстуально необходимое продолжение, с более естественным порядком слов. Имеющаяся расстановка сносок не соответствует их содержанию: сноска о «церкви» не может стоять после «общине» под тем же маркером, который в английском аудите поставлен после «задержан», а варианты ἑδραίωμα нуждаются в отдельной привязке к «опоре».'
  naturalness: «Но если я задержусь, пишу это, чтобы ты знал» понятно, но для современного литературного русского тяжеловесно и синтаксически не вполне гладко. Перестановка «Я пишу тебе это, чтобы, если я задержусь, ты знал…» естественно выражает зависимость целевого придаточного от подразумеваемого из 3:14 «пишу». «Дом Божий» и «община живого Бога» звучат литературно и ясно; «столп» уместен в умеренно возвышенном библейском регистре.
  terminology: '«Община» — допустимый современный эквивалент ἐκκλησία; традиционное «церковь» следует сохранить в сноске. «Столп и опора истины» точно сохраняет образ и не навязывает спорный оттенок «основания». В сноске «утверждение» лучше не предлагать как прямой вариант ἑδραίωμα: это скорее толковательная передача, тогда как «опора», «основание», «твердыня/оплот» непосредственно отражают обсуждаемый семантический диапазон.'
  issues:
  - severity: medium
    issue: Синтаксически неудачное размещение «пишу это».
    rationale: 'В SBLGNT 3:15 нет самостоятельного γράφω: цель ἵνα εἰδῇς продолжает «пишу тебе это» из 3:14. Добавление оправдано контекстом, но в текущем порядке фраза по-русски звучит как неудачная аподосис условного предложения. Следует перестроить предложение, не выдавая добавленные слова за лексический материал самого стиха.'
  - severity: high
    issue: Сноски поставлены у неверных слов и смешивают разные лексические вопросы.
    rationale: Сноска о традиционном «церкви» должна быть привязана к «общине», а лексические варианты ἑδραίωμα — к «опоре». Если сохранять примечание о βραδύνω, ему требуется собственный маркер у «задержусь». Это исправляет несоответствие между якорями и содержанием примечаний.
  - severity: low
    issue: «Утверждение» в сноске как вариант «опоры» неточно.
    rationale: Для ἑδραίωμα более прозрачны «основание», «оплот» или «твердыня»; «утверждение» в русском легко понимается как высказывание либо действие, а не как архитектурно-метафорическая опора.
