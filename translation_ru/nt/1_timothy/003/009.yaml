  text: holding the mystery of the faith with a clear conscience[a].
translation:
  language: ru
  text: хранящие тайну веры[a] с чистой совестью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Вера» здесь, вероятнее всего, означает содержание христианской веры; возможно также понимание в смысле личной веры, доверия Богу.
    reason: semantic_ambiguity
lexical_decisions:
- source_word: ἔχοντας
  choice: хранящие
  rationale: Причастие настоящего времени относится к служителям, названным в предыдущем стихе, и выражает постоянное обладание верой и верность ей. «Хранящие» естественно передаёт не просто наличие, а бережное и твёрдое следование.
- source_word: μυστήριον
  choice: тайну
  rationale: В употреблении Павла это Божья истина, прежде сокрытая, но теперь открытая; слово «тайна» сохраняет термин и не добавляет пояснения, отсутствующего в тексте. «Таинство» могло бы ошибочно вызвать более поздние сакраментальные ассоциации.
- source_word: τῆς πίστεως
  choice: веры
  rationale: Родительный оборот естественно передаётся как «тайна веры». В данном церковном контексте «вера», вероятнее всего, означает содержание христианской веры, хотя русская формулировка не исключает оттенка личного доверия Богу.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: с чистой совестью
  rationale: Это естественное современное русское выражение, точно передающее нравственную чистоту и внутреннюю цельность. Предлог «с» идиоматично выражает сопутствующее состояние, обозначенное греческим ἐν.
theological_decisions:
- issue: Значение τῆς πίστεως
  choice: содержание христианской веры
  alternative: личная вера, доверие Богу
  rationale: Контекст требований к церковным служителям благоприятствует объективному смыслу — христианской вере как исповедуемой истине. Однако перевод «веры» и сноска сохраняют возможную смысловую широту греческого выражения.
translation_notes:
  register: Современный литературный русский язык; краткая причастная конструкция сохраняет синтаксическую связь с предыдущим стихом. «Тайна» предпочтена перед «таинством», чтобы избежать привнесения конфессионально-сакраментального смысла.
