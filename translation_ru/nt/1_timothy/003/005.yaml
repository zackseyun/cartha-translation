review_pass:
  verdict: approve
  source_fidelity: Текст точно передаёт условное противопоставление εἰ δέ, неопределённый субъект τις, идиоматическое «не умеет» при οἶδα с инфинитивом, риторическое πῶς и будущее ἐπιμελήσεται. Различие между προστῆναι («руководить») и ἐπιμελήσεται («будет заботиться») обоснованно сохранено. «Собственным домом» в данном контексте может обозначать домашнее сообщество, что своевременно пояснено сноской.
  naturalness: 'Фраза естественна для современного литературного русского: кратка, ясна и соответствует сдержанному наставительному регистру. Обороты «Если же кто не умеет…» и «как он будет…?» хорошо воспроизводят синтаксис и риторическую силу оригинала.'
  terminology: «Божьей церкви» — естественная русская передача ἐκκλησίας θεοῦ. Выбор «руководить» и «заботиться» не смешивает руководство с попечением и не привносит конфессионально обусловленной модели служения. Мужское «он» согласуется с грамматическим родом и непосредственным контекстом, не превращая неопределённое τις в более узкое по смыслу слово «мужчина».
