  variant: modern literary Russian
source:
  edition: SBLGNT
  text: (εἰ δέ τις τοῦ ἰδίου οἴκου προστῆναι οὐκ οἶδεν, πῶς ἐκκλησίας θεοῦ ἐπιμελήσεται;)
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/005.yaml
  text: But if someone does not know how to manage his own household[c][b][a], how will he care for God’s church?
translation:
  language: ru
  text: Если же кто не умеет руководить собственным домом[a], как он будет заботиться о Божьей церкви?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть своей семьёй и домочадцами; также возможно: «собственным хозяйством».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Если же
  rationale: Передаёт условие εἰ и мягкое противопоставление или переход, выраженный δέ, естественным для русского языка оборотом.
- source_word: τις
  choice: кто
  rationale: Неопределённое местоимение передано обобщённо, без добавления слова «мужчина»; дальнейшее «он» соответствует мужскому единственному числу и ближайшему контексту требований к надзирателю.
- source_word: τοῦ ἰδίου οἴκου
  choice: собственным домом
  rationale: В данном контексте «дом» означает не здание, а домашнее сообщество — семью и домочадцев; русский оборот сохраняет естественность и широту значения οἶκος.
- source_word: προστῆναι
  choice: руководить
  rationale: Глагол выражает ответственное главенство и попечение. «Руководить» передаёт это без излишне властного оттенка слова «править».
- source_word: οὐκ οἶδεν
  choice: не умеет
  rationale: Сочетание οἶδα с инфинитивом означает практическое знание того, как совершать действие; по-русски это естественно выражается глаголом «уметь».
- source_word: πῶς
  choice: как
  rationale: Сохраняет форму риторического вопроса и вывод от управления домом к заботе о церкви.
- source_word: ἐκκλησίας θεοῦ
  choice: о Божьей церкви
  rationale: Притяжательная конструкция естественно передаёт родительный θεοῦ, а «церковь» является уместным обозначением христианской общины в данном контексте.
- source_word: ἐπιμελήσεται
  choice: будет заботиться
  rationale: Передаёт будущее время и значение внимательного, продолжительного попечения, отличая его от глагола руководства в первой части стиха.
theological_decisions:
- issue: Соотношение руководства домом и попечения о церкви
  choice: 'Сохранить разные глаголы: «руководить» домом и «заботиться» о Божьей церкви.'
  alternative: Передать оба действия одним глаголом, например «управлять».
  rationale: В греческом тексте употреблены разные глаголы, προΐστημι и ἐπιμελέομαι. Их разграничение сохраняет аналогию между двумя сферами, но не сводит церковное служение лишь к административной власти.
- issue: Род неопределённого субъекта
  choice: Употребить обобщённое «кто», а затем местоимение «он».
  alternative: Полностью устранить указание на род либо прямо написать «мужчина».
  rationale: Само τις является неопределённым, тогда как грамматика и непосредственный контекст требований к надзирателю поддерживают мужское единственное число; выбранная формулировка сохраняет оба аспекта без лишнего уточнения.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. «Божьей» звучит естественнее, чем более книжное «церкви Бога», а «будет заботиться» сохраняет длительный характер попечения.
