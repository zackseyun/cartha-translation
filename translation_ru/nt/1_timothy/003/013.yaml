  text: οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/013.yaml
  text: For those who have served well obtain for themselves a good standing and great boldness in the faith that is in Messiah Jesus[a][b][c].
translation:
  language: ru
  text: Ведь те, кто хорошо послужил, обретают достойное положение и большую смелость[a] в вере[b] в Мессию Иисуса[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «большую уверенность»; греческое слово может означать смелость, уверенность или откровенность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в верности, связанной с Мессией Иисусом». Греческое πίστις может означать веру, доверие или верность.'
    reason: alternative_reading
  - marker: c
    text: Греческое Χριστός означает «Христос», то есть «Мессия»; здесь это слово передано как титул.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονήσαντες
  choice: послужил
  rationale: Глагол означает «служить» и в данном контексте относится к обсуждаемым служителям, однако сам по себе не требует передачи названием церковной должности.
- source_word: καλῶς
  choice: хорошо
  rationale: Прямое и естественное наречие, характеризующее качество служения.
- source_word: βαθμὸν ... καλὸν
  choice: достойное положение
  rationale: βαθμός буквально может обозначать ступень, положение или ранг; здесь выражение метафорически указывает на достойное, почётное положение, приобретаемое хорошим служением, без утверждения о формальном церковном повышении.
- source_word: περιποιοῦνται
  choice: приобретают себе
  rationale: Передаёт значение приобретения и возвратный оттенок среднего залога.
- source_word: παρρησίαν
  choice: смелость
  rationale: Сохраняет силу слова, которое может обозначать смелую открытость и уверенность; возможный вариант «уверенность» указан в сноске.
- source_word: πίστει
  choice: вере
  rationale: Основное значение в данном контексте — вера; возможный оттенок верности не исключается и отмечен в сноске.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: которая в Мессии Иисусе
  rationale: Определённый артикль с предложным оборотом характеризует «веру». Формулировка сохраняет греческую синтаксическую связь и выражение пребывания веры в Мессии Иисусе.
- source_word: Χριστῷ
  choice: Мессии
  rationale: Χριστός передан по значению титула «Мессия», а не как ставшая почти именем транслитерация.
theological_decisions:
- issue: Значение πίστις в выражении ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ
  choice: вера
  alternative: верность
  rationale: В данном контексте наиболее естественно понимать слово как веру, связанную с Мессией Иисусом, однако греческое πίστις допускает значение «верность», поэтому неоднозначность сохранена в сноске.
- issue: Характер выражения βαθμὸν καλόν
  choice: достойное положение
  alternative: добрая ступень; хороший ранг
  rationale: Текст не поясняет, идёт ли речь о признании в общине, духовном продвижении или иной благоприятной позиции. Перевод не закрепляет за выражением конкретную систему церковных степеней.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Ведь» естественно передаёт пояснительное γάρ. Причастная конструкция развёрнута в придаточное «те, кто хорошо послужил» ради ясности. Сохранены неоднозначность πίστις и отсутствие конкретизации метафоры βαθμός.
