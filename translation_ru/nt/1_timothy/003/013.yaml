  source_fidelity: 'Смысл в целом передан верно: καλῶς διακονήσαντες — «те, кто хорошо послужил», περιποιοῦνται — «обретают», βαθμὸν καλόν — благоприятное/почётное положение, παρρησία — смелость. Однако формула «в вере, которая в Мессии Иисусе» калькирует греческий оборот и по-русски создаёт неясный образ веры, находящейся «в» личности. «В вере в Мессию Иисуса» естественно передаёт наиболее вероятную синтаксическую и смысловую связь, не внося конфессионального толкования.'
