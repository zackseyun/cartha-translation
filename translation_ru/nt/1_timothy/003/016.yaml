id: 1TI.3.16
reference: 1 Timothy 3:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: ru
  text: 'И, бесспорно, велика тайна благочестия:


    Он[a] был явлен во плоти,

    был признан правым в духе[b],

    Его увидели ангелы,

    Он был возвещён среди народов[c],

    в Него поверили в мире,

    Он был вознесён во славе[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Бог был явлен во плоти». Критический греческий текст читает «который/кто», что здесь передано местоимением «Он».'
    reason: textual_variant
  - marker: b
    text: 'Возможно также: «был признан правым Духом» или «был признан правым в Духе». Краткий греческий оборот может указывать либо на действие Святого Духа, либо на духовную сферу или состояние.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «среди язычников».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «был вознесён в славу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: бесспорно
  rationale: Передаёт смысл общепризнанности и несомненности современным литературным словом, без архаического оборота «по общему признанию».
- source_word: μέγα ἐστὶν
  choice: велика
  rationale: Порядок слов «велика тайна» сохраняет вынесенное вперёд сказуемое и торжественное ударение греческого текста.
- source_word: τὸ τῆς εὐσεβείας μυστήριον
  choice: тайна благочестия
  rationale: «Тайна» сохраняет характерное для Павла значение прежде сокрытой, а теперь открытой Божьей истины; «благочестие» здесь обозначает почитание Бога и соответствующую ему жизнь.
- source_word: Ὃς
  choice: Он
  rationale: Критический текст содержит относительное местоимение мужского рода «который/кто», а не существительное «Бог». В русском исповедальном фрагменте личное местоимение «Он» естественно вводит речь о Христе.
- source_word: ἐφανερώθη ἐν σαρκί
  choice: был явлен во плоти
  rationale: Сохраняет страдательную форму и смысл явления в подлинном человеческом, телесном существовании; «во плоти» соответствует возвышенному поэтическому регистру отрывка.
- source_word: ἐδικαιώθη
  choice: был признан правым
  rationale: В данном контексте глагол означает подтверждение правоты или оправдание перед судом, а не наделение праведностью. Формулировка избегает возможного неверного сотериологического оттенка слова «оправдан».
- source_word: ἐν πνεύματι
  choice: в духе
  rationale: 'Строчная буква и краткий предложный оборот сохраняют неоднозначность: речь может идти о действии Святого Духа либо о духовной сфере или состоянии.'
- source_word: ὤφθη ἀγγέλοις
  choice: Его увидели ангелы
  rationale: Естественная русская перестройка страдательной конструкции точно передаёт факт, что Он стал видим ангелам; в данном контексте ἄγγελοι вероятнее всего означает небесных ангелов.
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: был возвещён среди народов
  rationale: «Возвещён» передаёт публичное провозглашение, а «народы» сохраняет широкий смысл ἔθνη, не исключая значения «язычники».
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: в Него поверили в мире
  rationale: Естественно выражает необычную греческую страдательную конструкцию с личным объектом веры и сохраняет всемирный масштаб отклика.
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: был вознесён во славе
  rationale: «Вознесён» передаёт восхождение и страдательную форму, а «во славе» сохраняет основное пространственно-сферическое значение ἐν, не исключая альтернативы «в славу».
theological_decisions:
- issue: 'Разночтение в начале исповедального фрагмента: Ὃς, θεός или ὅ'
  choice: Критическое чтение Ὃς передано личным местоимением «Он».
  alternative: «Бог был явлен во плоти»; также засвидетельствовано чтение среднего рода, соответствующее «которое».
  rationale: SBLGNT читает Ὃς («который/кто»). Контекст указывает на Христа, поэтому «Он» естественно по-русски, но исторически значимое чтение «Бог» не внесено в основной текст и отмечено в сноске.
- issue: Референт и функция ἐν πνεύματι
  choice: Нейтральное «в духе».
  alternative: «Духом» — если имеется в виду действие Святого Духа; «в Духе» — если имеется в виду сфера Святого Духа.
  rationale: Греческое πνεύματι употреблено без артикля, а конструкция допускает как орудийное, так и сферическое понимание. Основной текст не разрешает эту богословски значимую неоднозначность.
- issue: Значение ἐδικαιώθη применительно ко Христу
  choice: «Был признан правым».
  alternative: «Был оправдан»; «был засвидетельствован как праведный».
  rationale: Перевод подчёркивает подтверждение правоты Христа, не предполагая, будто Он прежде был неправеден или нуждался в нравственном исправлении.
translation_notes:
  register: Современный литературный русский язык с торжественным, ритмичным строем, соответствующим вероятному исповедальному или гимническому фрагменту. Сохранены короткие параллельные строки и богословская неоднозначность греческих выражений; архаизмы по возможности исключены.
