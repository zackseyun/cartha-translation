  source_fidelity: 'Перевод точно следует SBLGNT: ὁμολογουμένως передано как «бесспорно», эмфатическое μέγα ἐστὶν сохранено в «велика тайна», а все шесть кратких членoв исповедального фрагмента переданы без смысловых добавлений. Страдательные формы в ключевых строках сохранены либо естественно преобразованы: «Его увидели ангелы» точно выражает ὤφθη ἀγγέλοις. Неоднозначное ἐν πνεύματι не разрешено в основном тексте.'
