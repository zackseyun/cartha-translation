  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: ru
  text: Каждый диакон должен быть мужем одной жены[a], хорошо управлять своими детьми и собственным домом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мужчиной одной женщины». Это выражение может подчёркивать супружескую верность; некоторые понимают его более узко — как запрет многожёнства или повторного брака.'
    reason: Сохраняет идиоматическую форму греческого выражения и сообщает основные возможные толкования, не выбирая одно из них.
lexical_decisions:
- source_word: διάκονοι
  choice: диаконы
  rationale: В контексте требований к церковному служению слово обозначает признанное служение диаконов, а не служителей вообще.
- source_word: ἔστωσαν
  choice: должны быть
  rationale: Форма повелительного наклонения выражает обязательное требование; такой перевод естественен для современного русского списка требований.
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: мужья одной жены
  rationale: Близкий к форме греческого выражения перевод сохраняет мужской род и не снимает неоднозначность между супружеской верностью, единобрачием и более узкими толкованиями.
- source_word: τέκνων
  choice: своими детьми
  rationale: Притяжательное местоимение естественно следует из конструкции и параллели с собственными домами.
- source_word: καλῶς
  choice: хорошо
  rationale: Прямой и естественный эквивалент наречия в данном контексте.
- source_word: προϊστάμενοι
  choice: управлять
  rationale: Передаёт ответственное руководство и попечение в домашнем контексте без излишне властной окраски.
- source_word: τῶν ἰδίων οἴκων
  choice: своими домами
  rationale: Здесь «дом» означает не только жилище, но домашнее хозяйство и всех домашних; русский библейский и литературный оборот сохраняет эту смысловую ёмкость.
theological_decisions:
- issue: Толкование выражения μιᾶς γυναικὸς ἄνδρες как требования к диаконам
  choice: В основном тексте дано формальное «мужья одной жены» без однозначного толкования.
  alternative: «верные своим жёнам», «мужчины одной женщины», «женатые только один раз»
  rationale: Греческое выражение кратко и допускает несколько пониманий. Близкий перевод сохраняет богословское напряжение и не вводит конфессионального вывода в основной текст.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Диаконы» употреблено как название церковного служения; «своими домами» сохраняет более широкий смысл домашнего круга, а не только здания.
