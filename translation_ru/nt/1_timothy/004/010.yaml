id: 1TI.4.10
reference: 1 Timothy 4:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰς τοῦτο ⸀γὰρ κοπιῶμεν καὶ ⸀ὀνειδιζόμεθα, ὅτι ἠλπίκαμεν ἐπὶ θεῷ ζῶντι, ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/010.yaml
  text: For to this end we labor and are reproached[a], because we have put our hope in the living God, who is the Savior of all people[c][b], especially of believers.
translation:
  language: ru
  text: Ведь ради этого мы усердно трудимся и терпим поношения[a], потому что возложили надежду на живого Бога[b], который есть Спаситель всех людей, особенно верующих[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «трудимся до изнеможения, и нас поносят».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «положились на живого Бога». Греческая форма указывает на надежду, возложенную прежде и сохраняющуюся теперь.'
    reason: lexical_alternative
  - marker: c
    text: 'Выражение «Спаситель всех людей, особенно верующих» передано без истолковательного сужения. Его понимают по-разному: как указание на Божью сохраняющую заботу обо всех, на предоставленное всем спасение или на спасение, особым образом осуществляющееся в верующих.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: ради этого
  rationale: Оборот указывает на цель, названную в предшествующем контексте; «ради этого» естественно передаёт целевую направленность.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит пояснение к предыдущему утверждению; русское «ведь» сохраняет эту связь без излишней формальности.
- source_word: κοπιῶμεν
  choice: мы усердно трудимся
  rationale: Глагол обозначает напряжённый, изнурительный труд. Сочетание передаёт интенсивность и остаётся понятным современному читателю.
- source_word: ὀνειδιζόμεθα
  choice: терпим поношения
  rationale: Страдательная форма говорит о словесном унижении и поругании, которому подвергаются говорящие; «терпим поношения» сохраняет эту смысловую окраску.
- source_word: ἠλπίκαμεν ἐπὶ
  choice: возложили надежду на
  rationale: 'Перфект выражает совершившееся действие с сохраняющимся результатом: надежда была возложена и продолжает определять настоящее.'
- source_word: θεῷ ζῶντι
  choice: живого Бога
  rationale: Сохранено устойчивое библейское выражение и естественный русский порядок слов.
- source_word: σωτὴρ
  choice: Спаситель
  rationale: Хотя слово может обозначать также избавителя или хранителя, в Пастырских посланиях оно имеет выраженный богословский вес; традиционное «Спаситель» не сужает его заранее до одного аспекта.
- source_word: πάντων ἀνθρώπων
  choice: всех людей
  rationale: ἄνθρωποι употреблено в родовом, всеохватном смысле; «всех людей» точно и естественно передаёт эту универсальность.
- source_word: μάλιστα
  choice: особенно
  rationale: Основное значение здесь — «особенно», «в особенности». Оно сохраняет напряжение между всеобщим утверждением и особым отношением к верующим, не превращая выражение в «то есть».
- source_word: πιστῶν
  choice: верующих
  rationale: В данном контексте слово обозначает людей, характеризуемых верой; «верующих» — ясный и нейтральный современный эквивалент.
theological_decisions:
- issue: Значение выражения «Спаситель всех людей, особенно верующих»
  choice: Всеобщее утверждение и особое указание на верующих сохранены буквально по смыслу, без истолковательного сужения.
  alternative: Понимать Бога как хранителя всех и Спасителя верующих в искупительном смысле; видеть здесь утверждение всеобщего спасения; понимать «всех людей» как «людей всякого рода»; либо понимать μάλιστα как «то есть».
  rationale: Греческий текст одновременно говорит о «всех людях» и «особенно верующих». Перевод сохраняет эту подлинную богословскую напряжённость и не решает спор в пользу какой-либо системы толкования.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Формулировка избегает архаизмов, но сохраняет традиционно значимые слова «живой Бог» и «Спаситель». Связка «который есть» намеренно сохранена как ясное отождествляющее утверждение, не делая фразу чрезмерно книжной.
