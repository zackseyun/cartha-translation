source:
  edition: SBLGNT
  text: μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: ru
  text: Не пренебрегай даром, который в тебе и был дан тебе через пророчество[a] с возложением рук совета старейшин[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через пророческое изречение». Пророчество могло сопровождать дарование дара или служить его посредником.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «собрания старейшин»; речь идёт о старейшинах как о коллективе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀμέλει
  choice: не пренебрегай
  rationale: Настоящее повелительное наклонение с μή выражает запрет продолжающегося пренебрежения; выбранная формулировка естественна и точно передаёт недостаток должного внимания.
- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: даром, который пребывает в тебе
  rationale: «Дар» не добавляет отсутствующего в греческом тексте определения «духовный», а оборот «пребывает в тебе» сохраняет явное ἐν σοὶ и звучит достойно и естественно.
- source_word: ἐδόθη σοι
  choice: был дан тебе
  rationale: Страдательная форма сохранена без уточнения дарителя, которого греческий текст прямо не называет.
- source_word: διὰ προφητείας
  choice: через пророчество
  rationale: διά с родительным падежом допускает значение средства или посредства; перевод сохраняет эту связь, не решая окончательно, сопровождало ли пророчество дарование или служило его посредником.
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: с возложением рук
  rationale: Это устойчивое и ясное русское обозначение соответствующего действия; притяжательная связь с последующим πρεσβυτερίου показывает, чьи это были руки.
- source_word: τοῦ πρεσβυτερίου
  choice: совета старейшин
  rationale: Слово обозначает коллектив старейшин. «Совет старейшин» ясно передаёт собирательный смысл и не привносит позднейшую конфессиональную терминологию.
theological_decisions:
- issue: Следует ли конкретизировать χάρισμα как особый «духовный дар»
  choice: дар
  alternative: духовный дар; благодатный дар
  rationale: В контексте, вероятно, имеется в виду дар для служения, однако определение «духовный» в греческом тексте отсутствует; общий перевод сохраняет смысловую открытость.
- issue: Роль пророчества в даровании
  choice: через пророчество
  alternative: через пророческое изречение; по пророчеству
  rationale: Фраза может указывать как на посредствующую роль пророческой речи, так и на пророчество, сопровождавшее дарование. Основной текст сохраняет инструментальную неоднозначность, а примечание её поясняет.
- issue: Характер πρεσβυτέριον и устройство церкви
  choice: совет старейшин
  alternative: собрание старейшин; пресвитерство
  rationale: Перевод утверждает лишь участие коллективного органа старейшин и не приписывает тексту устройство какой-либо позднейшей деноминации.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис упрощён за счёт одного относительного оборота: оба сказуемых («пребывает», «был дан») относятся к дару. Термины, способные навязать позднейшее конфессиональное устройство, исключены.'
