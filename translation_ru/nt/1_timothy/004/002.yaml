lexical_decisions:
- source_word: ἐν
  choice: через
  rationale: Предлог передаёт значение средства или посредства по отношению к предыдущей части предложения; «через» естественно связывает лицемерие лжецов с распространением ложного учения.
- source_word: ὑποκρίσει
  choice: лицемерие
  rationale: Прямой и общепонятный эквивалент, обозначающий притворство и несоответствие внешнего поведения внутренней действительности.
- source_word: ψευδολόγων
  choice: лжецов
  rationale: Родительный падеж зависит от «лицемерия»; слово кратко и естественно обозначает людей, говорящих ложь.
- source_word: κεκαυστηριασμένων
  choice: выжжена клеймом
  rationale: Передаёт образ воздействия раскалённого железа и результирующее состояние, выраженное перфектным пассивным причастием, не сводя образ исключительно к утрате чувствительности или к знаку принадлежности.
- source_word: τὴν ἰδίαν συνείδησιν
  choice: чья собственная совесть
  rationale: Относительная конструкция естественна по-русски; «собственная» сохраняет усилительное значение ἰδίαν, а единственное число соответствует греческому тексту и имеет распределительный смысл.
theological_decisions:
- issue: Образное значение κεκαυστηριασμένων
  choice: «чья собственная совесть выжжена клеймом»
  alternative: «заклеймённых в собственной совести»; «чья собственная совесть прижжена»
  rationale: Формулировка сохраняет многозначный образ раскалённого клейма или прижигания и не утверждает ни необратимую духовную отверженность, ни исключительно потерю нравственной чувствительности.
