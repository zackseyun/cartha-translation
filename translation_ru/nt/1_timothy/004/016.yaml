source:
  edition: SBLGNT
  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: ru
  text: 'Внимательно следи за собой и за учением. Будь постоянен в этом[a]: ведь, поступая так, ты спасёшь и себя, и тех, кто тебя слушает[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «продолжай заниматься этим»; «не отступай от этого».'
    reason: 'Лексическая альтернатива: ἐπίμενε передаёт стойкое продолжение, а αὐτοῖς отсылает к названным выше обязанностям.'
  - marker: b
    text: 'Или: «сохранишь», «убережёшь». Греческое слово может означать спасение, избавление или сохранение — в зависимости от контекста.'
    reason: Лексическая и богословская альтернатива для σώσεις без преждевременного сужения его значения.
lexical_decisions:
- source_word: ἔπεχε
  choice: Внимательно следи
  rationale: Императив выражает не разовое действие, а постоянное, пристальное внимание. «Внимательно следи» естественно по-русски передаёт требование сохранять бдительность.
- source_word: σεαυτῷ
  choice: за собой
  rationale: Возвратное местоимение обозначает первый объект постоянного внимания Тимофея; сочетание «следи за собой» естественно для современного русского языка.
- source_word: τῇ διδασκαλίᾳ
  choice: за учением
  rationale: διδασκαλία здесь охватывает содержание наставления, которое преподаёт Тимофей. «Учение» сохраняет этот смысл и менее терминологично, чем «доктрина».
- source_word: ἐπίμενε αὐτοῖς
  choice: Будь постоянен в этом
  rationale: Глагол призывает неотступно продолжать начатое, а местоимение указывает на только что названные обязанности в совокупности. Формулировка передаёт длительность и стойкость, не сужая смысл до одного лишь учения.
- source_word: τοῦτο γὰρ ποιῶν
  choice: ведь, поступая так
  rationale: Причастный оборот указывает на образ действия и средство; «поступая так» звучит естественно и соотносится со всем предшествующим наставлением.
- source_word: σώσεις
  choice: ты спасёшь
  rationale: Основное значение σῴζω — «спасать». Его не следует без необходимости ослаблять до одного лишь сохранения или безопасности, поскольку в контексте сохраняется богословская весомость слова.
- source_word: τοὺς ἀκούοντάς σου
  choice: тех, кто тебя слушает
  rationale: Настоящее причастие обозначает людей, постоянно слушающих наставление Тимофея. Эта формулировка ясна и естественна в современном русском языке.
theological_decisions:
- issue: Значение «спасёшь» в пастырском наставлении
  choice: Сохранить в основном тексте «спасёшь», не сводя его ни исключительно к вечному спасению, ни к практическому сохранению.
  alternative: «Сохранишь» или «убережёшь», с акцентом на духовную и практическую безопасность.
  rationale: Текст связывает постоянство Тимофея в жизни и учении со спасением его самого и слушателей, но не объясняет здесь механизм этой связи. Перевод сохраняет богословское напряжение и не приписывает Тимофею независимой от Бога спасительной силы.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным пастырским звучанием. Синтаксис краток и прям; сохранены настойчивость повелений и богословская весомость слова «спасёшь».
