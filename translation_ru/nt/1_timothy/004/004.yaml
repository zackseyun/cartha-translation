lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание предшествующего утверждения; «потому что» естественно и ясно передаёт причинно-пояснительную связь.
- source_word: πᾶν κτίσμα θεοῦ
  choice: всё сотворённое Богом
  rationale: Сочетание обозначает всякую созданную Богом вещь. Такая формулировка сохраняет широкий охват греческого κτίσμα и естественнее по-русски, чем буквальное «всякое творение Бога».
- source_word: καλόν
  choice: хорошо
  rationale: Средний род краткого прилагательного согласуется с субстантивированным «всё сотворённое» и передаёт положительную оценку, созвучную повествованию о сотворении.
- source_word: οὐδὲν ἀπόβλητον
  choice: ничто не должно быть отвергнуто
  rationale: Передаёт значение отглагольного прилагательного ἀπόβλητον как того, что следует отвергать, естественной русской конструкцией.
- source_word: μετὰ εὐχαριστίας
  choice: с благодарением
  rationale: Сохраняет явную тему благодарения Богу и возвышенный, но понятный библейский регистр.
- source_word: λαμβανόμενον
  choice: если его принимают
  rationale: Условная придаточная конструкция естественно передаёт обстоятельственное значение причастия, не исключая возможного временного понимания.
theological_decisions:
- issue: Объём значения κτίσμα в контексте запретов на пищу
  choice: «всё сотворённое Богом» — широкая формулировка, применимая в контексте к пище, но не сведённая только к ней
  alternative: «всякое творение Божье»; «всякая пища, сотворённая Богом»
  rationale: Греческое слово шире непосредственной темы пищи. Перевод сохраняет общий принцип благости Божьего творения и не вносит в текст уточнение, отсутствующее в оригинале.
- issue: Смысл причастия λαμβανόμενον
  choice: условное «если его принимают с благодарением»
  alternative: временное «когда его принимают с благодарением»; буквальное «принимаемое с благодарением»
  rationale: Условная конструкция ясно связывает неотвержение сотворённого с благодарным принятием, однако примечание сохраняет допустимое временное прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Благодарение» сохранено ради смысловой связи с молитвенной благодарностью; синтаксис остаётся понятным обычному читателю.
