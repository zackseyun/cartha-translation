id: 1TI.4.8
reference: 1 Timothy 4:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος, ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν, ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/008.yaml
  text: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
translation:
  language: ru
  text: Ведь телесное упражнение приносит пользу лишь в малой мере[a], а благочестие полезно во всём, поскольку заключает в себе обещание жизни — и нынешней, и грядущей.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приносит пользу лишь на короткое время». Греческое выражение может указывать либо на малую степень, либо на краткую продолжительность пользы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «имея обещание жизни нынешней и грядущей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σωματικὴ γυμνασία
  choice: телесное упражнение
  rationale: Передаёт тренировку или упражнение тела естественным современным русским выражением, не сужая смысл исключительно до спорта.
- source_word: πρὸς ὀλίγον
  choice: лишь в малой мере
  rationale: Греческое выражение допускает ограничение как по степени, так и по времени. В основном тексте выбрано ограничение по степени; неоднозначность сохранена в сноске.
- source_word: ὠφέλιμος
  choice: приносит пользу / полезно
  rationale: Естественно и последовательно передаёт полезность в обеих частях стиха без экономического оттенка слова «выгодно».
- source_word: εὐσέβεια
  choice: благочестие
  rationale: Устоявшееся русское обозначение почтительной, обращённой к Богу жизни; здесь оно точнее и шире, чем «набожность».
- source_word: πρὸς πάντα
  choice: во всём
  rationale: Сохраняет всеохватность греческого выражения и звучит естественно по-русски.
- source_word: ἐπαγγελίαν ἔχουσα
  choice: поскольку заключает в себе обещание
  rationale: Причастный оборот относится к благочестию и поясняет, почему оно полезно во всём; формулировка сохраняет образ обладания обещанием.
- source_word: ζωῆς τῆς νῦν καὶ τῆς μελλούσης
  choice: жизни — и нынешней, и грядущей
  rationale: Передаёт противопоставление настоящей и будущей жизни, восполняя подразумеваемое во второй части существительное без утраты греческой симметрии.
theological_decisions:
- issue: Характер ограниченной пользы телесного упражнения
  choice: Польза ограничена, но не отрицается; основной текст понимает πρὸς ὀλίγον как ограничение по степени.
  alternative: Польза сохраняется лишь недолгое время.
  rationale: Греческий допускает оба понимания. Перевод сохраняет положительную оценку телесного упражнения, но подчёркивает всеохватную пользу благочестия; временная трактовка отмечена в сноске.
- issue: Обещание нынешней и грядущей жизни
  choice: Благочестие связано с обещанием жизни как в настоящем, так и в будущем веке.
  alternative: Обещание относится преимущественно к качеству жизни сейчас и к вечной жизни впоследствии.
  rationale: Текст прямо называет обе сферы, не уточняя характер благ, поэтому перевод не конкретизирует содержание обещания сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис близок к греческому, но естественен для обычного читателя; подлинная неоднозначность πρὸς ὀλίγον вынесена в сноску.
