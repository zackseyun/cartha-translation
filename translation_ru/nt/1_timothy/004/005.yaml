lexical_decisions:
- source_word: ἁγιάζεται
  choice: освящается
  rationale: Настоящее время, страдательный залог. «Освящается» точно передаёт действие над пищей, упомянутой в предыдущем стихе, и сохраняет религиозную многозначность глагола, не сводя её прямо к нравственному очищению или спасению.
- source_word: γὰρ
  choice: потому что
  rationale: Союз вводит основание предыдущего утверждения; «потому что» естественно и ясно выражает пояснительно-причинную связь.
- source_word: διὰ
  choice: посредством
  rationale: С родительным падежом διά обозначает средство. «Посредством» сохраняет инструментальное значение и одинаково относится к слову Божьему и молитве.
- source_word: λόγου θεοῦ
  choice: словом Божьим
  rationale: Естественная русская передача родительной конструкции. Формулировка сохраняет открытым вопрос, имеется ли в виду слово Писания, Божье установление или Божье провозглашение в более широком смысле.
- source_word: ἐντεύξεως
  choice: молитвой
  rationale: В данном контексте благодарного принятия пищи общее слово «молитва» звучит естественнее, тогда как возможные более узкие оттенки прошения или ходатайства сохранены в сноске.
theological_decisions:
- issue: Смысл освящения в контексте
  choice: Сохранено слово «освящается», а непосредственный контекст указывает на пищу, принимаемую как допустимую для употребления.
  alternative: Передать как «становится святой» или истолковать освящение в более широком религиозном смысле.
  rationale: Стихи 3–4 говорят о пище, принимаемой с благодарением. Перевод сохраняет богословски насыщенный глагол, но не добавляет к нему сакраментальных, сотериологических или иных доктринальных уточнений, которых нет в самом тексте.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. Местоимение «оно» согласуется с подразумеваемым словом «творение» из предыдущего стиха; строчная буква в начале сохраняет связь с предшествующим предложением.
