  yaml_path: translation/nt/1_timothy/004/015.yaml
  text: Practice these things; be in them[a], so that your progress may be evident to all.
translation:
  language: ru
  text: Занимайся этим; всецело отдавайся этому, чтобы твоё преуспевание было очевидно всем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: этим
  rationale: Указательное местоимение во множественном числе отсылает к предшествующим наставлениям; в русском собирательное «этим» передаёт связь естественно и без лишнего уточнения.
- source_word: μελέτα
  choice: занимайся
  rationale: Глагол обозначает сосредоточенное, постоянное внимание и практическое упражнение. «Занимайся» передаёт деятельную вовлечённость, не сводя смысл только к размышлению.
- source_word: ἐν τούτοις ἴσθι
  choice: пребывай в этом
  rationale: Сохраняется исходный образ «быть в этом» и подразумеваемая глубокая вовлечённость; более идиоматический смысл пояснён в сноске.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевое, а возможно и результативное, отношение между наставлением и его видимым итогом.
- source_word: προκοπή
  choice: преуспевание
  rationale: Слово обозначает продвижение или заметный рост. «Преуспевание» сохраняет широкий смысл, не ограничивая его только духовной зрелостью или служебными навыками.
- source_word: φανερὰ ᾖ πᾶσιν
  choice: было очевидно всем
  rationale: Передаёт открытый, доступный наблюдению характер продвижения Тимофея и сохраняет обобщённое «всем».
theological_decisions:
- issue: Объём видимого преуспевания Тимофея
  choice: Сохранён широкий смысл — наблюдаемый рост Тимофея во всём, к чему относились предшествующие наставления.
  alternative: Ограничить смысл преимущественно духовным ростом или преимущественно успешностью служения.
  rationale: Контекст охватывает учение, поведение и усердие; греческое προκοπή само по себе не требует более узкого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка сохраняет образность греческого выражения, а сноска даёт его естественный идиоматический смысл.
