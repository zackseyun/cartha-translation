base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/003.yaml
  text: forbidding marriage and requiring abstinence from foods that God created to be received with thanksgiving by those who believe and have come to know the truth[a].
translation:
  language: ru
  text: запрещающих вступать в брак и предписывающих воздерживаться от пищи[a], которую Бог сотворил, чтобы верующие, познавшие истину, принимали её с благодарностью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально структура фразы допускает передачу: «запрещающих вступать в брак и воздерживаться от пищи». Однако по смыслу речь идёт о людях, которые запрещают брак и предписывают воздержание от пищи; поэтому подразумеваемое предписание выражено в тексте явно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόντων γαμεῖν
  choice: запрещающих вступать в брак
  rationale: Причастие продолжает описание людей из предыдущего стиха; сочетание «запрещать вступать в брак» естественно для современного русского языка и точно передаёт управление инфинитивом.
- source_word: ἀπέχεσθαι βρωμάτων
  choice: предписывающих воздерживаться от пищи
  rationale: Сам инфинитив означает «воздерживаться», а смысл предписания восстанавливается из контекста и синтаксического параллелизма. В русском его необходимо выразить отдельным управляющим словом, иначе получилось бы противоположное по смыслу «запрещающих воздерживаться». Собирательное «пища» естественно передаёт множественное βρωμάτων без добавления отсутствующего в тексте уточнения «определённой».
- source_word: ἃ ὁ θεὸς ἔκτισεν
  choice: которую Бог сотворил
  rationale: «Сотворил» сохраняет выраженную глаголом κτίζω тему творения; относительное местоимение согласовано с русским собирательным существительным «пища».
- source_word: εἰς μετάλημψιν
  choice: чтобы … принимали её
  rationale: Оборот с εἰς выражает предназначение. Целевая конструкция естественна по-русски и передаёт принятие пищи, а не абстрактное «участие».
- source_word: μετὰ εὐχαριστίας
  choice: с благодарностью
  rationale: Передаёт благодарное принятие Божьего дара естественным современным выражением. В следующем стихе прямо названо благодарение Богу, но здесь существительное допускает обычное «благодарность».
- source_word: τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: верующие, познавшие истину
  rationale: Два согласованных определения с общим артиклем наиболее естественно описывают одну группу. Русское обособленное причастие ясно выражает это, не превращая характеристики в две категории людей. Перфектное ἐπεγνωκόσι указывает на достигнутое и сохраняющееся знание; «познавшие» передаёт этот результат.
theological_decisions:
- issue: Описывает ли τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν одну группу или две
  choice: 'Одна группа: верующие, которые познали истину'
  alternative: 'Две группы: верующие и познавшие истину'
  rationale: Общий артикль и согласованные характеристики грамматически склоняют к описанию одних и тех же людей с двух сторон. Запятая и причастный оборот в русском позволяют передать это без лишнего богословского вывода.
- issue: Как передать отсутствующий при ἀπέχεσθαι глагол предписания
  choice: 'Сделать подразумеваемое предписание явным: «предписывающих воздерживаться»'
  alternative: 'Формально связать оба инфинитива с κωλυόντων: «запрещающих вступать в брак и воздерживаться от пищи»'
  rationale: Формальная связь дала бы противоположный контексту смысл — запрет воздерживаться от пищи. Параллелизм и описание лжеучителей требуют понимать второй инфинитив как содержание навязываемого ими воздержания; примечание сохраняет прозрачность синтаксической трудности.
translation_notes:
  register: Современный литературный русский язык с достойным, общедоступным звучанием. «Вступать в брак» предпочтено более разговорному «жениться и выходить замуж»; «пища» сохраняет библейскую возвышенность без архаичности. Начальная форма причастия оставлена со строчной буквы, поскольку стих синтаксически продолжает предыдущее предложение.
