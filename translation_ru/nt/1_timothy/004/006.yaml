  naturalness: Исправленный вариант сохраняет литературный библейский регистр и делает начальный оборот и заключительное придаточное более естественными по-русски. «Питаясь словами» допустимо как образное выражение и хорошо передаёт ἐντρεφόμενος, не навязывая источник действия.
