id: 1TI.4.6
reference: 1 Timothy 4:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ταῦτα ὑποτιθέμενος τοῖς ἀδελφοῖς καλὸς ἔσῃ διάκονος ⸂Χριστοῦ Ἰησοῦ⸃, ἐντρεφόμενος τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας ᾗ παρηκολούθηκας,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/006.yaml
  text: By putting these things before the brothers[a], you will be a good servant of Messiah Jesus[c][b], being nourished by the words of the faith and of the good teaching that you have followed.
translation:
  language: ru
  text: Напоминая братьям[a] обо всём этом, ты будешь добрым служителем Мессии Иисуса[b], питаясь словами веры[c] и доброго учения, которому ты следовал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «братья» здесь может обозначать всех верующих общины, включая женщин.
    reason: cultural_note
  - marker: b
    text: 'Или: «Христа Иисуса». Греческое Χριστός означает «Мессия», то есть «Помазанник».'
    reason: lexical_alternative
  - marker: c
    text: Слово «веры» здесь может обозначать не только личную веру, но и признанное содержание христианской веры.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: всё это
  rationale: Указательное местоимение во множественном числе отсылает к предшествующим наставлениям; «всё это» естественно передаёт совокупность упомянутого.
- source_word: ὑποτιθέμενος
  choice: предлагая
  rationale: Причастие означает помещать нечто перед кем-либо, а в данном контексте — излагать или представлять общине; «предлагая» сохраняет образ без тяжеловесной буквальности.
- source_word: τοῖς ἀδελφοῖς
  choice: братьям
  rationale: Сохранена грамматически мужская форма греческого выражения; возможное широкое обозначение верующих поясняется в сноске.
- source_word: καλὸς
  choice: добрым
  rationale: Обычное и уместное определение качества служителя, соответствующее καλός без излишнего усиления.
- source_word: διάκονος
  choice: служителем
  rationale: Здесь слово функционально описывает того, кто служит, и не обязательно обозначает установленную должность диакона.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Мессии Иисуса
  rationale: Χριστός передано по смыслу как титул «Мессия», а личное имя Ἰησοῦ — как «Иисус».
- source_word: ἐντρεφόμενος
  choice: питаясь
  rationale: Форма выражает продолжающееся питание или взращивание посредством слов веры и учения; возвратное причастие естественно звучит по-русски.
- source_word: τοῖς λόγοις
  choice: словами
  rationale: Сохранено конкретное значение λόγοις и инструментальный смысл дательного падежа при образе духовного питания.
- source_word: τῆς πίστεως
  choice: веры
  rationale: Русский язык не выражает артикль; «слова веры» сохраняют возможность понимать πίστις и как веру, и как содержание исповедуемой веры.
- source_word: τῆς καλῆς διδασκαλίας
  choice: доброго учения
  rationale: Переданы и существительное «учение», и положительная оценка καλῆς без замены на более интерпретирующее «здравое».
- source_word: ᾗ παρηκολούθηκας
  choice: которому ты последовал
  rationale: Относительное местоимение наиболее естественно соотносится с ближайшим выражением «доброе учение»; глагол допускает смысл внимательного следования и приверженности.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: В данном сочетании сохраняется титульный смысл Χριστός; традиционная русская передача отмечена как допустимая альтернатива.
- issue: Объём значения τοῖς ἀδελφοῖς
  choice: братьям
  alternative: братьям и сёстрам; верующим
  rationale: Основной текст сохраняет мужскую форму оригинала, а сноска отмечает, что в раннехристианской речи она могла охватывать всю общину.
- issue: Значение πίστις
  choice: вера
  alternative: вероучение; содержание веры
  rationale: «Вера» сохраняет основной лексический смысл, тогда как контекст рядом с «учением» допускает объективное значение — признанное содержание веры.
- issue: Отнесение ᾗ
  choice: к доброму учению
  alternative: ко всей фразе «слова веры и доброго учения»
  rationale: Женский род относительного местоимения непосредственно согласуется с διδασκαλία, однако смысловое отнесение ко всему составному выражению полностью исключать нельзя.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским регистром. Синтаксис сохраняет причастную структуру оригинала, но избегает архаизмов и канцелярских оборотов.
