  text: Command these things and teach them[a].
translation:
  language: ru
  text: Предписывай это и учи этому.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Наставляй в этом и учи этому».'
    reason: 'Лексическая альтернатива для Παράγγελλε: «наставляй в этом» передаёт инструктивный оттенок, но слабее выражает директивную силу глагола.'
lexical_decisions:
- source_word: Παράγγελλε
  choice: предписывай
  rationale: Настоящее повелительное наклонение передаёт продолжающееся авторитетное наставление. «Предписывай» сохраняет директивную силу глагола, не добавляя к тексту специальных представлений о церковной власти.
- source_word: ταῦτα
  choice: это / этому
  rationale: Указательное местоимение среднего рода множественного числа отсылает к сказанному выше. В современном русском собирательное «это» звучит естественнее буквального «эти вещи»; при глаголе «учи» тот же объект закономерно выражен дательным «этому».
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз, связывающий два повелительных глагола.
- source_word: δίδασκε
  choice: учи
  rationale: Настоящее повелительное наклонение обозначает продолжающееся действие. Краткое «учи» естественно по-русски, а объект «этому» восстанавливается из ταῦτα.
theological_decisions:
- issue: Степень авторитетности глагола παραγγέλλω
  choice: Передать как «предписывай», сохранив силу распоряжения.
  alternative: «Наставляй» или «поручай» — менее властные варианты.
  rationale: Παράγγελλε здесь сильнее простого совета и стоит наряду с повелительным δίδασκε; при этом «предписывай» не привносит дополнительных конфессиональных выводов о характере служения Тимофея.
translation_notes:
  register: Современный литературный русский, краткий и достойный по тону. Синтаксический параллелизм двух повелений сохранён; длительный характер настоящих императивов естественно подразумевается формами несовершенного вида.
