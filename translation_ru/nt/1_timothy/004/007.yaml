base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/007.yaml
  text: But reject profane and old-womanish myths[a], and train yourself for godliness.
translation:
  language: ru
  text: А отвергай нечестивые и бабьи мифы[a]; упражняй же себя в благочестии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мифы, свойственные старухам» или «старым женщинам»; это пренебрежительное выражение. Возможный идиоматический перевод: «бабьи басни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: нечестивых
  rationale: Передаёт противопоставление священному и характеризует мифы как чуждые почтению к Богу; в современном русском звучит естественнее, чем «профанных».
- source_word: γραώδεις
  choice: бабьих
  rationale: Сохраняет конкретный, пренебрежительный образ греческого прилагательного «свойственных старухам/старым женщинам», не сглаживая риторическую резкость; оттенок пояснён в сноске.
- source_word: μύθους
  choice: мифов
  rationale: Прямо передаёт μῦθος как вымышленные или спекулятивные рассказы; «басни» могло бы ошибочно наводить на мысль о литературном жанре.
- source_word: παραιτοῦ
  choice: отвергай
  rationale: Средний императив требует решительно отказываться от таких рассказов; «отвергай» кратко сохраняет силу повеления.
- source_word: γύμναζε
  choice: упражняй
  rationale: Сохраняет образ систематической, подобной атлетической, тренировки и естественно сочетается с возвратным местоимением.
- source_word: σεαυτόν
  choice: себя
  rationale: Прямо передаёт возвратное местоимение, указывающее на самого Тимофея как объект упражнения.
- source_word: πρὸς εὐσέβειαν
  choice: в благочестии
  rationale: Передаёт направленность упражнения к богопочтительной жизни; русское сочетание «упражняй себя в благочестии» естественно выражает цель и сферу практики.
- source_word: δὲ ... δὲ
  choice: А ... же
  rationale: Первое δέ отмечает контраст с предыдущим контекстом, второе вводит противопоставленное положительное повеление; конструкция «А ...; ... же» сохраняет оба перехода без тяжеловесности.
theological_decisions:
- issue: Передача уничижительного выражения γραώδεις μύθους
  choice: «бабьих мифов» в основном тексте с пояснением в сноске
  alternative: «старушечьих мифов»; «бабьих басен»; «нелепых мифов»
  rationale: Греческое выражение буквально и пренебрежительно связывает эти мифы со старыми женщинами. Нейтральное «нелепых» устранило бы культурно отмеченный образ, а «старушечьих» звучит неестественно и может приобрести ласкательный оттенок. «Бабьих» сохраняет резкость оригинала, тогда как сноска уточняет буквальный смысл.
- issue: Значение εὐσέβεια
  choice: «благочестие» как богопочтительная жизнь
  alternative: «набожность»; «почитание Бога»
  rationale: В Пастырских посланиях εὐσέβεια охватывает почтение к Богу, проявляющееся в образе жизни. «Благочестие» сохраняет эту ёмкость, не сводя смысл лишь к чувству набожности или внешней религиозности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Бабьих» намеренно сохраняет резкий и культурно обусловленный оттенок оригинала; сноска предотвращает потерю буквального смысла. Точка с запятой подчёркивает контраст между отрицательным и положительным повелениями.
