lexical_decisions:
- source_word: πιστὸς
  choice: верно
  rationale: В формуле πιστὸς ὁ λόγος прилагательное имеет предикативное значение и характеризует высказывание как надёжное и заслуживающее доверия; краткое «верно» естественно передаёт это по-русски.
- source_word: ὁ λόγος
  choice: это слово
  rationale: Здесь λόγος обозначает конкретное высказывание. «Это слово» сохраняет традиционную формулу и её смысловую широту; сноска указывает более явные контекстуальные варианты.
- source_word: πάσης
  choice: полного
  rationale: В сочетании πάσης ἀποδοχῆς выражает полноту принятия, поэтому естественный русский эквивалент — «полного».
- source_word: ἀποδοχῆς
  choice: принятия
  rationale: ἀποδοχή означает принятие или благожелательный приём; «принятие» точно и естественно в данном сочетании.
- source_word: ἄξιος
  choice: достойно
  rationale: ἄξιος с родительным падежом означает «достойный чего-либо»; форма среднего рода согласуется с «слово».
