id: 1TI.4.1
reference: 1 Timothy 4:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, προσέχοντες πνεύμασι πλάνοις καὶ διδασκαλίαις δαιμονίων
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/001.yaml
  text: The Spirit explicitly says that in later times some will depart from the faith[a], paying attention to deceitful spirits and teachings of demons[c][b],
translation:
  language: ru
  text: Дух же прямо говорит, что в последующие времена[a] некоторые отступят от веры, внимая духам, вводящим в заблуждение[b], и учениям бесов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в позднейшие времена».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обманчивым духам».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «демоническим учениям»; выражение может указывать как на источник учений, так и на их характер.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: Τὸ ... πνεῦμα
  choice: Дух
  rationale: Артикль и контекст пророческой речи у Павла наиболее естественно указывают на Святого Духа; прописная буква передаёт этот референт в русском тексте.
- source_word: δὲ
  choice: же
  rationale: Постпозитивная частица естественно передаёт мягкий переход δέ, не усиливая его до резкого противопоставления.
- source_word: ῥητῶς
  choice: прямо
  rationale: Передаёт значение явного, недвусмысленного высказывания и звучит естественно в современном русском языке.
- source_word: λέγει
  choice: говорит
  rationale: Сохранено настоящее время греческого глагола.
- source_word: ἐν ὑστέροις καιροῖς
  choice: в последующие времена
  rationale: Фраза обозначает времена, наступающие позднее относительно настоящего автора, и сама по себе не ограничена исключительно последним этапом истории.
- source_word: ἀποστήσονταί
  choice: отступят
  rationale: Глагол выражает уход или отпадение; «отступят» сохраняет образ и не навязывает более узкого богословского толкования.
- source_word: τινες
  choice: некоторые
  rationale: Естественный русский эквивалент неопределённого местоимения во множественном числе.
- source_word: τῆς πίστεως
  choice: от веры
  rationale: В данном контексте выражение прежде всего указывает на исповедуемую христианскую веру, при этом русская формулировка не исключает личного аспекта веры.
- source_word: προσέχοντες
  choice: внимая
  rationale: Причастие передаёт направленное внимание и следование; «внимая» кратко и уместно для достоинства библейского регистра.
- source_word: πνεύμασι πλάνοις
  choice: духам, вводящим в заблуждение
  rationale: Передаёт активную силу πλάνος — эти духи обманывают и уводят с верного пути; допустимый качественный оттенок отражён в сноске.
- source_word: διδασκαλίαις δαιμονίων
  choice: учениям бесов
  rationale: 'Сохраняет генитивную конструкцию и её возможные оттенки: бесы могут пониматься как источник этих учений либо как определяющая их принадлежность и природа.'
theological_decisions:
- issue: Кого обозначает «Дух»
  choice: Святой Дух
  alternative: пророческий дух или человеческий дух
  rationale: Определённость выражения и контекст авторитетного пророческого высказывания наиболее естественно указывают на Святого Духа, хотя способ сообщения пророчества текст не уточняет.
- issue: Значение выражения «от веры»
  choice: от христианской веры как исповедуемого содержания
  alternative: от личной веры или доверия
  rationale: Артикль и ближайший контекст ложных учений поддерживают объективный смысл, однако перевод не разворачивает это в конфессиональное учение об отступничестве.
- issue: Связь «учений» с бесами
  choice: учения, исходящие от бесов или принадлежащие им
  alternative: учения, лишь характеризуемые как демонические
  rationale: Греческий родительный падеж допускает оттенок источника и более широкую характеристику; основной перевод сохраняет сжатость и напряжение оригинала, а сноска обозначает альтернативную формулировку.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Дух же» сохраняет плавный переход, «прямо говорит» избегает архаизма, а «внимая» поддерживает достоинство стиля без утраты понятности.
