id: 1TI.4.12
reference: 1 Timothy 4:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ⸀ἀγάπῃ, ἐν πίστει, ἐν ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: ru
  text: Пусть никто не смотрит на тебя свысока из-за твоей молодости, но будь примером для верующих в речи, в поведении, в любви, в вере[a], в чистоте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в верности». Греческое слово в этом контексте может означать и веру, и верность.'
    reason: alternative_reading
lexical_decisions:
- source_word: μηδείς … καταφρονείτω
  choice: Пусть никто не смотрит … свысока
  rationale: Отрицательное повеление передано естественной русской увещательной конструкцией. «Смотреть свысока» выражает социальный оттенок пренебрежения, не усиливая его до открытой ненависти.
- source_word: σου τῆς νεότητος
  choice: на тебя … из-за твоей молодости
  rationale: Греческая конструкция буквально связывает пренебрежение с молодостью Тимофея. Русская причинная формулировка ясно и естественно передаёт этот смысл.
- source_word: τύπος γίνου
  choice: будь примером
  rationale: В данном контексте τύπος — образец для подражания, а повелительное γίνου естественно передаётся как «будь».
- source_word: τῶν πιστῶν
  choice: для верующих
  rationale: Родительный падеж обозначает людей, для которых Тимофей должен служить примером. «Верующие» здесь естественнее, чем неоднозначное «верные».
- source_word: ἐν λόγῳ
  choice: в речи
  rationale: В перечне качеств λόγος относится к словам и манере говорить; краткое «в речи» сохраняет структуру оригинала.
- source_word: ἐν ἀναστροφῇ
  choice: в поведении
  rationale: ἀναστροφή обозначает поведение или образ жизни. «В поведении» точно и понятно в данном перечне.
- source_word: ἐν ἀγάπῃ
  choice: в любви
  rationale: Прямое и общеупотребительное соответствие ἀγάπη.
- source_word: ἐν πίστει
  choice: в вере
  rationale: πίστις может обозначать как веру, так и верность. В основном тексте сохранено широкое «в вере», а возможное значение «в верности» отмечено в сноске.
- source_word: ἐν ἁγνείᾳ
  choice: в чистоте
  rationale: ἁγνεία обозначает нравственную чистоту, включая половую чистоту, но широкое «чистота» не сужает смысл без достаточных оснований.
theological_decisions:
- issue: Значение πίστις в перечне качеств
  choice: в вере
  alternative: в верности
  rationale: Контекст допускает как внутреннюю веру и доверие Богу, так и проявляемую верность. Основной текст сохраняет традиционное широкое значение, а альтернатива вынесена в сноску, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Параллельное повторение «в» сохранено во всём перечне ради ритма и соответствия греческой структуре. Маркер сноски поставлен после «вере», к слову πίστις, которого относится вариант чтения.
