    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔρχομαι
  choice: Пока я не приду
  rationale: Естественно передаёт временной предел поручения и будущее по контексту значение формы ἔρχομαι.
- source_word: πρόσεχε
  choice: усердно занимайся
  rationale: Императив обозначает постоянное, сосредоточенное внимание и преданность делу, а не мимолётное внимание.
- source_word: τῇ ἀναγνώσει
  choice: публичным чтением
  rationale: В церковном контексте ἀνάγνωσις, вероятнее всего, означает чтение перед собранием; объект чтения в греческом тексте прямо не назван.
- source_word: τῇ παρακλήσει
  choice: наставлением
  rationale: Передаёт пастырское увещание, ободрение и призыв к должному образу действий, не сужая значение до порицания.
- source_word: τῇ διδασκαλίᾳ
  choice: учением
  rationale: Естественно обозначает деятельность по обучению и её содержание, сохраняя параллелизм перечисления.
theological_decisions:
- issue: Следует ли прямо назвать Писание объектом чтения
  choice: публичным чтением
  alternative: чтением Писания
  rationale: Контекст служения в собрании убедительно указывает на публичное чтение Писания, однако само слово «Писание» в греческом тексте отсутствует. Основной текст отражает вероятный публичный характер чтения, а уточнение объекта сохраняется в сноске.
- issue: Диапазон значения παράκλησις
  choice: наставлением
  alternative: увещанием; ободрением
  rationale: Греческое слово допускает как побуждение, так и ободрение. «Наставление» в данном пастырском перечне достаточно широко и не устраняет эту смысловую напряжённость.
translation_notes:
  register: 'Современный литературный русский язык; ясный и достойный пастырский регистр. Синтаксис сделан естественным для русского: единое управление «занимайся» объединяет три однородных элемента.'
