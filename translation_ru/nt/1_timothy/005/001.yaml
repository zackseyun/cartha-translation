  terminology: «Пресвитер» корректно сохранён в примечании как возможное, но менее вероятное контекстуальное значение. «Увещевай» уместно для παρακάλει в наставительном регистре; «братьев» верно сохраняет мужскую группу, отличенную от женщин в следующем стихе.
