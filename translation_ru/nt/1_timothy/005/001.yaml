  text: Πρεσβυτέρῳ μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει ὡς πατέρα, νεωτέρους ὡς ἀδελφούς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/001.yaml
  text: Do not rebuke an older man[a], but appeal to him as a father, and to younger men as brothers,
translation:
  language: ru
  text: Пожилого мужчину не укоряй, но увещевай его, как отца, а молодых мужчин — как братьев,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: старшего мужчину
  rationale: Субстантивированное прилагательное πρεσβύτερος здесь противопоставлено νεωτέρους («молодым мужчинам»), а в следующем стихе продолжается деление по возрасту и полу; поэтому возрастное значение вероятнее, чем обозначение церковного служения.
- source_word: μὴ ἐπιπλήξῃς
  choice: не укоряй строго
  rationale: ἐπιπλήσσω обозначает резкое порицание, словесный выговор. Сочетание «не укоряй строго» передаёт как само порицание, так и оттенок резкости, не подразумевая запрета на любое исправление.
- source_word: ἀλλὰ παρακάλει
  choice: но увещевай
  rationale: παρακαλέω может означать просить, призывать, ободрять или увещевать. Здесь, в противопоставлении резкому выговору, «увещевай» естественно передаёт уважительное наставление; объект понятен из первой части фразы.
- source_word: ὡς πατέρα
  choice: как отца
  rationale: ὡς вводит прямое сравнение; «как отца» кратко и естественно сохраняет семейный образ.
- source_word: νεωτέρους
  choice: молодых мужчин
  rationale: Форма мужского рода во множественном числе относится именно к мужчинам, что подтверждается словом ἀδελφούς и последующим отдельным упоминанием женщин.
- source_word: ὡς ἀδελφούς
  choice: как братьев
  rationale: Мужской род следует сохранить, поскольку контекст последовательно различает мужчин и женщин; добавление «по вере» не выражено в греческом тексте.
theological_decisions:
- issue: Обозначает ли Πρεσβυτέρῳ пожилого мужчину или церковного пресвитера
  choice: 'возрастное значение: «старшего мужчину»'
  alternative: «пресвитера»
  rationale: Симметрия контекста — старший мужчина как отец, молодые мужчины как братья, затем старшие женщины как матери и молодые как сёстры — убедительно указывает на возрастную, а не должностную категорию. Альтернатива сохранена в примечании.
- issue: Следует ли передавать ἀδελφούς инклюзивно
  choice: «братьев»
  alternative: «братьев и сестёр»
  rationale: 'В данном контексте это не обобщённое обращение: мужчины и женщины распределены по отдельным группам, поэтому мужской род имеет смысловое значение.'
translation_notes:
  register: Современный литературный русский язык с уважительным, наставительным тоном. «Увещевай» сохраняет достоинство библейского регистра и остаётся понятным; «старшего мужчину» точнее, чем двусмысленное «старшего», обозначает возрастную и половую категорию.
