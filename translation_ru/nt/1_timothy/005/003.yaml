  text: Honor widows who are truly widows[a].
translation:
  language: ru
  text: Почитай тех вдов, которые действительно вдовы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поддерживай тех вдов, которые действительно вдовы»; в данном контексте «почитать», вероятно, подразумевает и материальную заботу.'
    reason: 'Лексическая альтернатива: контекст уточняет практическую сторону широкого значения τιμάω.'
lexical_decisions:
- source_word: Χήρας
  choice: вдов
  rationale: χήρα прямо обозначает вдову; форма винительного падежа множественного числа является дополнением при повелительном глаголе.
- source_word: τίμα
  choice: Почитай
  rationale: τιμάω означает «почитать, ценить, оказывать уважение». В данном контексте почитание, вероятно, включает и материальную заботу, однако значение глагола шире одной лишь финансовой поддержки.
- source_word: τὰς ὄντως χήρας
  choice: тех вдов, которые действительно вдовы
  rationale: 'Повтор слова «вдовы» и наречие ὄντως образуют подчёркнутое различение, которое раскрывается в последующем контексте: речь идёт о вдовах, действительно оставшихся без поддержки и соответствующих условиям церковной помощи.'
- source_word: ὄντως
  choice: действительно
  rationale: Наречие означает «действительно, на самом деле» и здесь вводит содержательное уточнение, а не служит лишь риторическим усилением.
theological_decisions:
- issue: Объём значения τιμάω в контексте
  choice: В основном тексте сохранено широкое значение «почитай», включающее уважение и, по контексту, вероятно, материальную поддержку.
  alternative: «Поддерживай тех вдов, которые действительно вдовы».
  rationale: Ближайший контекст главы говорит о материальном обеспечении вдов, но сам греческий глагол шире финансовой помощи. Основной перевод не сужает его значение, а практический оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая повелительная конструкция сохраняет достоинство и прямоту оригинала. Формулировка «действительно вдовы» намеренно сохраняет повтор и смысловое напряжение греческого текста, разъясняемое дальнейшим контекстом.
