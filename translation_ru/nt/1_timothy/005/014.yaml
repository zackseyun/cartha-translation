  source_fidelity: 'Текст точно передаёт греческий ряд инфинитивов: личное волевое предпочтение βούλομαι, выводное οὖν, контекстуально восстановленное «вдовы», вступление в брак без добавления значения, рождения детей, ведения дома и недопущения повода для враждебного злословия. Единственное число τῷ ἀντικειμένῳ сохранено.'
