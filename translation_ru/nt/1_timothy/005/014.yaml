id: 1TI.5.14
reference: 1 Timothy 5:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: ru
  text: Поэтому я хочу, чтобы молодые вдовы выходили замуж[a], рожали детей, управляли своим домом и не давали противнику[b] никакого повода злословить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол означает просто «вступать в брак»; поскольку речь идёт о вдовах, повторный брак подразумевается контекстом.
    reason: lexical_alternative
  - marker: b
    text: Возможно, под противником подразумевается сатана; греческий текст прямо этого не уточняет.
    reason: alternative_reading
lexical_decisions:
- source_word: βούλομαι
  choice: я хочу
  rationale: Передаёт личное волеизъявление Павла естественно и без излишней торжественности.
- source_word: οὖν
  choice: поэтому
  rationale: Сохраняет логический вывод из предшествующего рассуждения.
- source_word: νεωτέρας
  choice: молодые вдовы
  rationale: Само прилагательное означает «молодые/младшие [женщины]», а существительное «вдовы» восстанавливается из непосредственного контекста главы.
- source_word: γαμεῖν
  choice: выходили замуж
  rationale: Глагол означает «вступать в брак». Поскольку речь идёт о вдовах, повторный брак подразумевается контекстом, но не выражен самим глаголом.
- source_word: τεκνογονεῖν
  choice: рожали детей
  rationale: Точно передаёт значение рождения детей и сохраняет параллельный ряд действий.
- source_word: οἰκοδεσποτεῖν
  choice: управляли своим домом
  rationale: Передаёт активное руководство домашними делами, не усиливая значение до жёсткого господства.
- source_word: μηδεμίαν ἀφορμὴν διδόναι
  choice: не давали никакого повода
  rationale: Естественно передаёт отсутствие основания или удобного случая для враждебного выступления.
- source_word: τῷ ἀντικειμένῳ
  choice: противнику
  rationale: Сохраняет единственное число и не определяет преждевременно, идёт ли речь о человеке-противнике или о сатане.
- source_word: λοιδορίας χάριν
  choice: злословить
  rationale: Передаёт цель — враждебную, оскорбительную или порочащую речь — естественной русской конструкцией «дать повод злословить».
theological_decisions:
- issue: Кого обозначает τῷ ἀντικειμένῳ
  choice: противник без уточнения личности
  alternative: сатана как духовный противник
  rationale: Греческое причастие буквально обозначает «того, кто противится» и само по себе не называет сатану. Основной текст сохраняет эту неоднозначность, а возможное отнесение к сатане отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и достойный, без архаизмов. Формулировка «управляли своим домом» сохраняет управленческий смысл редкого глагола οἰκοδεσποτεῖν, а «повода злословить» естественно передаёт целевую конструкцию λοιδορίας χάριν.
