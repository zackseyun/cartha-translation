  footnotes:
  - marker: a
    text: 'Буквально: «отказывай молодым вдовам»; по контексту — не принимай их в упомянутый выше список вдов.'
    reason: contextual_clarification
  - marker: b
    text: 'Или: «когда они предаются чувственным желаниям вопреки Мессии». Греческое выражение допускает понимание, что их желания вступают в противоречие с прежней преданностью ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεωτέρας δὲ χήρας
  choice: Но молодых вдов
  rationale: Сохраняет контраст δέ с предыдущими указаниями и сравнительный смысл νεωτέρας в естественной русской форме.
- source_word: παραιτοῦ
  choice: не включай в список
  rationale: В контексте речь идёт не об отвержении молодых вдов вообще, а об отказе принимать их в упомянутый ранее список; экспликация предотвращает ошибочное широкое понимание.
- source_word: ὅταν γὰρ
  choice: потому что, когда
  rationale: Передаёт объяснительную силу γάρ и временно-обобщающее значение ὅταν.
- source_word: καταστρηνιάσωσιν
  choice: их страсти влекут их прочь
  rationale: Редкий глагол обозначает действие сильных чувственных побуждений; такая формулировка понятна современному читателю и не сводит смысл исключительно к половому желанию.
- source_word: τοῦ Χριστοῦ
  choice: от Мессии
  rationale: Передаёт трудную зависимость родительного падежа как удаление от прежней преданности Мессии, не вставляя в основной текст подробного толкования.
- source_word: γαμεῖν θέλουσιν
  choice: они хотят выйти замуж
  rationale: Естественно передаёт θέλουσιν с инфинитивом; применительно к вдовам русское «выйти замуж» точнее обычного «жениться».
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: Χριστός здесь сохраняет значение титула; «Мессия» ясно передаёт его семантику, тогда как традиционное «Христос» возможно как привычный эквивалент.
- issue: Смысл καταστρηνιάσωσιν τοῦ Χριστοῦ
  choice: их страсти влекут их прочь от Мессии
  alternative: они предаются чувственным желаниям вопреки Мессии
  rationale: Формулировка сохраняет напряжение между желаниями и предшествующей преданностью Мессии, но не представляет само повторное замужество как безусловно предосудительное.
- issue: Объём запрета παραιτοῦ
  choice: не включай в список
  alternative: отказывай молодым вдовам
  rationale: Ближайший контекст говорит о внесении вдов в список; перевод не должен создавать впечатление, будто Тимофею велено отвергать молодых вдов как людей.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Контекстуальная экспликация «в список» ограничивает административный смысл повеления; редкий греческий глагол передан без архаичного или чрезмерно осуждающего «разнуздываются».
