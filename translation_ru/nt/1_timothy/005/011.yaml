  yaml_path: translation/nt/1_timothy/005/011.yaml
  text: But refuse younger widows[a], for when they become sensual against the Messiah, they desire to marry[c][b],
translation:
  language: ru
  text: Но молодых вдов не включай в список[a], потому что, когда они поддаются чувственным желаниям вопреки Мессии[b], они хотят выйти замуж,
