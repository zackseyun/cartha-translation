  text: ἔχουσαι κρίμα ὅτι τὴν πρώτην πίστιν ἠθέτησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/012.yaml
  text: incurring judgment because they have set aside their former faith[a].
translation:
  language: ru
  text: подпадая под суд за то, что отвергли прежнюю веру[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «первое обещание» или «прежнее обязательство». Греческое слово может означать «веру», но некоторые понимают его здесь как данное ранее обещание, вероятно связанное с внесением в список вдов.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσαι
  choice: подпадая
  rationale: Причастие буквально означает «имея», но в сочетании с κρίμα естественно передаёт состояние тех, кто оказывается под судом; деепричастная форма сохраняет зависимость от предыдущего контекста.
- source_word: κρίμα
  choice: суд
  rationale: «Суд» сохраняет широту греческого слова и его серьёзность, не уточняя без достаточных оснований, идёт ли речь об окончательном осуждении или ином судебном решении.
- source_word: ὅτι
  choice: за то, что
  rationale: Оборот ясно вводит основание суда и естественно сочетается по-русски с выражением «подпадая под суд».
- source_word: τὴν πρώτην πίστιν
  choice: прежнюю веру
  rationale: πρώτην здесь допускает временное значение «прежнюю», а πίστιν прежде всего передано как «веру». Возможное контекстуальное значение обещания или обязательства сохранено в сноске.
- source_word: ἠθέτησαν
  choice: отвергли
  rationale: Глагол означает отвергать, отменять или оставлять без силы. «Отвергли» естественно сочетается с «верой» и передаёт сознательное отступление, не вводя технического смысла нарушения обета в основной текст.
theological_decisions:
- issue: Значение τὴν πρώτην πίστιν в контексте
  choice: прежнюю веру
  alternative: первое обещание; прежнее обязательство
  rationale: Греческое πίστις обычно означает «вера», однако в данном контексте может обозначать ранее данное обещание или принятое обязательство, вероятно связанное с внесением в список вдов. Основной текст сохраняет прямое значение, а сноска — подлинную контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая и достойная формулировка. Деепричастный оборот сохраняет синтаксическую незавершённость греческого фрагмента и его связь с предыдущим стихом.
