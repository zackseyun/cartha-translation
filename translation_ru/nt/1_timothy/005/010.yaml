  text: ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: ru
  text: 'известная своими добрыми делами: если она воспитала детей, если оказывала гостеприимство[a], если омывала ноги святым[b], если помогала бедствующим, если следовала всякому доброму делу[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принимала странников». Греческий глагол конкретно указывает на приём гостей или странников в своём доме.'
    reason: lexical_alternative
  - marker: b
    text: «Святые» здесь — Божий святой народ, то есть другие верующие.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «стремилась ко всякому доброму делу». Греческое выражение подчёркивает деятельное стремление и постоянную приверженность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔργοις καλοῖς μαρτυρουμένη
  choice: известная добрыми делами
  rationale: Передаёт пассивную засвидетельствованность женщины на основании её видимых добрых дел естественным современным русским языком.
- source_word: εἰ
  choice: она…
  rationale: Повторяющееся εἰ перечисляет фактические признаки, подтверждающие добрую репутацию. В русском последовательность утвердительных глаголов после двоеточия звучит естественнее многократного «если», не меняя функции перечня.
- source_word: ἐτεκνοτρόφησεν
  choice: воспитала детей
  rationale: Глагол обозначает вскармливание и воспитание детей и не уточняет, были ли они родными.
- source_word: ἐξενοδόχησεν
  choice: проявляла гостеприимство
  rationale: Естественно выражает приём гостей или странников; конкретный оттенок отмечен в сноске.
- source_word: ἁγίων πόδας ἔνιψεν
  choice: омывала ноги святым
  rationale: Сохраняет конкретный акт смиренного служения и традиционный для Павла термин «святые».
- source_word: θλιβομένοις ἐπήρκεσεν
  choice: помогала бедствующим
  rationale: Передаёт практическую помощь людям, находящимся под давлением, в нужде или скорби, не сужая значение до гонений.
- source_word: παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν
  choice: посвящала себя всякому доброму делу
  rationale: В этическом контексте ἐπακολουθέω выражает деятельное следование и устойчивую приверженность; русский оборот передаёт это естественно, а более буквальная возможность указана в сноске.
theological_decisions:
- issue: Кого обозначает ἁγίων
  choice: святые
  alternative: верующие; святой народ
  rationale: В употреблении Павла это обычно Божий освящённый народ, то есть другие верующие. Основной текст сохраняет ключевой термин, а сноска поясняет его смысл.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Синтаксис оформлен как перечень признаков после двоеточия; формы прошедшего времени передают сложившуюся репутацию и подтверждённый образ жизни.
