base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/022.yaml
  text: Do not lay hands on anyone hastily[a], nor share in the sins of others; keep yourself pure.
translation:
  language: ru
  text: Ни на кого не возлагай рук поспешно[a] и не участвуй в чужих грехах. Храни себя чистым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более конкретно в данном контексте: «Не назначай (не поставляй) никого слишком скоро». Буквально по-гречески: «не возлагай рук» — выражение, часто связанное с признанием или поставлением человека на служение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χεῖρας ... ἐπιτίθει
  choice: возлагай рук
  rationale: Сохранён буквальный и укоренившийся в русском библейском языке оборот «возлагать руки». В данном контексте он, вероятно, связан с признанием или поставлением на служение, но основной текст не сужает значение до конкретной церковной процедуры.
- source_word: ταχέως
  choice: поспешно
  rationale: Передаёт не просто быстроту, а необдуманную, преждевременную поспешность.
- source_word: μηδενὶ
  choice: ни на кого
  rationale: Естественно передаёт всеобщий охват запрета при отрицательном повелении.
- source_word: μηδὲ κοινώνει
  choice: и не становись соучастником
  rationale: Глагол означает участие или причастность; «становись соучастником» ясно выражает возможную вовлечённость в чужую вину, не уточняя принудительно связь между двумя запретами.
- source_word: ἁμαρτίαις ἀλλοτρίαις
  choice: чужих грехов
  rationale: Кратко и естественно передаёт грехи, принадлежащие другим людям.
- source_word: σεαυτὸν
  choice: себя
  rationale: Прямое соответствие возвратному местоимению, объекту повеления.
- source_word: ἁγνὸν
  choice: чистым
  rationale: Здесь речь о широкой нравственной чистоте; вариант не сужает смысл до одной лишь половой чистоты.
- source_word: τήρει
  choice: храни
  rationale: Передаёт продолжающееся сохранение и бдительную заботу; выражение «храни себя чистым» естественно для современного литературного русского языка.
theological_decisions:
- issue: Значение выражения «возлагать руки» в контексте
  choice: Сохранить оборот «возлагать руки», не заменяя его в основном тексте словами «назначать» или «рукополагать».
  alternative: «Не назначай никого поспешно»; «Не рукополагай никого слишком скоро».
  rationale: Контекст наставлений о старейшинах позволяет понимать выражение как признание или поставление на служение. Однако греческий текст употребляет более широкий образный оборот, поэтому конкретизация вынесена в сноску и не превращена в конфессионально окрашенную формулировку.
- issue: Связь между двумя запретами
  choice: Передать второй запрет как предостережение от соучастия в чужих грехах, не делая причинную связь явной.
  alternative: Понимать его как общее, независимое наставление либо специально как предупреждение о разделении вины при поспешном поставлении.
  rationale: Соседство фраз предполагает возможную связь, но греческий текст её прямо не определяет. Перевод сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краткий и ясный; традиционный оборот «возлагать руки» сохранён ради смысловой широты оригинала, а его вероятное контекстуальное значение пояснено в сноске.
