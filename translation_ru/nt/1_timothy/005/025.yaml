- from: Так же очевидны и добрые дела, а те, с которыми дело обстоит иначе[a], не могут остаться скрытыми.
  to: Так же и добрые дела очевидны, и иные не могут остаться скрытыми[a].
  rationale: Перестроен порядок слов для естественного русского синтаксиса; «а те, с которыми дело обстоит иначе» заменено на краткое «и иные», где «дела» ясно подразумеваются из первой части. Это передаёт субстантивированный греческий оборот, сохраняет его смысловую открытость и не добавляет моральной оценки. Союз «и» ближе к καί.
