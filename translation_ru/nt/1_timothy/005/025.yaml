  text: ὡσαύτως καὶ τὰ ⸂ἔργα τὰ καλὰ⸃ ⸀πρόδηλα, καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/025.yaml
  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: ru
  text: Так же и добрые дела очевидны, и иные не могут остаться скрытыми[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «те, что иного рода» или «те, что не таковы». По аналогии с предыдущим стихом некоторые понимают здесь именно злые дела.'
    reason: Сохраняет неоднозначность выражения τὰ ἄλλως ἔχοντα и указывает возможное контекстуальное толкование, не внося его в основной текст.
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: Так же ... и
  rationale: Передаёт тесную связь с предыдущим стихом и сохраняет усиленную параллельную конструкцию обоих греческих слов в естественном русском порядке.
- source_word: ἔργα τὰ καλά
  choice: добрые дела
  rationale: Естественное современное выражение, сохраняющее конкретный смысл ἔργα и нравственную оценку καλά.
- source_word: πρόδηλα
  choice: очевидны
  rationale: Передаёт значение явности и открытости, сохраняя контраст с тем, что скрыто.
- source_word: τὰ ἄλλως ἔχοντα
  choice: те, с которыми дело обстоит иначе
  rationale: Сохраняет неопределённость греческого оборота и не уточняет без достаточного основания, идёт ли речь именно о злых делах или о добрых делах, пока ещё не ставших явными.
- source_word: κρυβῆναι οὐ δύνανται
  choice: не могут остаться скрытыми
  rationale: Точно выражает невозможность и в контексте показывает, что ныне неявные дела со временем обнаружатся.
theological_decisions:
- issue: Относится ли τὰ ἄλλως ἔχοντα именно к злым делам или шире — к делам, которые пока не очевидны
  choice: 'Сохранить более широкую и неоднозначную формулировку: «те, с которыми дело обстоит иначе»'
  alternative: «злые дела» или «те, что не таковы»
  rationale: В греческом тексте слово «злые» отсутствует. Контекст предыдущего стиха допускает такое понимание, но не требует его; поэтому основной текст не должен устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, без архаизмов. Несколько развёрнутый оборот «с которыми дело обстоит иначе» выбран ради сохранения смысловой открытости оригинала.
