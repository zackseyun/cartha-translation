    issue: Неудачная передача τὰ ἄλλως ἔχοντα
    rationale: Оборот «те, с которыми дело обстоит иначе» означает скорее «те, относительно которых обстоятельства иные», тогда как греческий оборот характеризует сами подразумеваемые дела как «иные/не такие».
  - severity: low
    issue: Усилительное противопоставление союзом «а»
    rationale: В греческом стоит καί в обеих частях. Русское «и» точнее передаёт связь, не навязывая более резкой антитезы.
  revised_text: Так же и добрые дела очевидны, и иные не могут остаться скрытыми[a].
