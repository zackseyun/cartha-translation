review_pass:
  verdict: revise
  source_fidelity: Вторая часть передаёт намеренно неопределённое τὰ ἄλλως ἔχοντα без внесения слова «злые», а «не могут остаться скрытыми» хорошо выражает κρυβῆναι οὐ δύνανται. Однако союз «а» придаёт противопоставлению большую силу, чем простое καί, а оборот «те, с которыми дело обстоит иначе» смещает смысл к обстоятельствам, в которых находятся дела, вместо самих «иных» дел.
  naturalness: «Так же очевидны и добрые дела» понятно, но менее естественно и менее прозрачно по построению, чем «Так же и добрые дела очевидны». Формулировка «те, с которыми дело обстоит иначе» тяжеловесна и разговорно-канцелярская для современного литературного библейского текста.
  terminology: «Добрые дела» — естественная и точная передача ἔργα τὰ καλά. «Очевидны» уместно для πρόδηλα. «Иные [дела]» сохраняет отсылку к подразумеваемым делам и не решает спорный вопрос, являются ли они именно злыми.
  issues:
