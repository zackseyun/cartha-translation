  naturalness: В исходном тексте конструкция «не только к праздности, но становятся болтливыми» грамматически непараллельна. Исправленный вариант строит естественное русское противопоставление «не только праздны, но и болтливы». «В то же время» точнее отражает ἅμα δὲ καὶ, не сводя его только к добавочному значению.
  terminology: «Болтливы» удачно передаёт широкое значение φλύαροι; возможность более узкого понимания как сплетен остаётся в примечании. «Вмешиваются в чужие дела» — современное и точное соответствие περίεργοι. «Говоря то, чего не следует» не уточняет намеренно общий объект τὰ μὴ δέοντα.
