  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: ru
  text: В то же время, ходя по домам, они привыкают к праздности; и не только праздны, но и болтливы[a], и вмешиваются в чужие дела[b], говоря то, чего не следует.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сплетницами». Греческое слово может шире обозначать пустую или неразумную болтовню, хотя в данном контексте, вероятно, подразумевает и сплетни.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «занимаются не своим делом»; то есть неуместно вмешиваются в дела других.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: К тому же
  rationale: В контексте оборот добавляет к предыдущему рассуждению ещё одно следствие; современное русское «к тому же» естественно передаёт добавочное значение, не исключая сопутствующего характера происходящего.
- source_word: ἀργαὶ μανθάνουσιν
  choice: приучаются к праздности
  rationale: Буквальное «учатся быть праздными» по-русски звучит неестественно. «Приучаются» передаёт приобретение устойчивой привычки, а «праздность» — отсутствие полезного занятия, сохраняя связь с повторным ἀργαί.
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: ходя по домам
  rationale: Кратко и идиоматично передаёт переход из одного дома в другой без добавления отсутствующего в тексте мотива.
- source_word: φλύαροι
  choice: болтливыми
  rationale: Слово обозначает пустую, неразумную или нескромную разговорчивость; «болтливыми» сохраняет более широкий смысл, чем исключительно «сплетницами».
- source_word: περίεργοι
  choice: вмешиваются в чужие дела
  rationale: Передаёт не любознательность, а неуместное вмешательство в то, что человека не касается; глагольная формулировка естественнее редких или стилистически тяжёлых существительных.
- source_word: λαλοῦσαι τὰ μὴ δέοντα
  choice: говоря то, чего не следует
  rationale: 'Сохраняет общую формулировку оригинала: речь идёт о неподобающих высказываниях, однако их содержание намеренно не уточняется.'
theological_decisions:
- issue: Женский род форм и их референт
  choice: они ... становятся болтливыми и вмешиваются
  alternative: эти женщины ... становятся сплетницами и вмешиваются
  rationale: Формы греческого текста стоят во множественном числе женского рода и в контексте относятся к молодым вдовам. Русское «они» естественно отсылает к явному контексту, а формы «болтливыми» и «говоря» не нейтрализуют и не расширяют референт.
- issue: Характер речи, обозначенной φλύαροι
  choice: болтливыми
  alternative: сплетницами
  rationale: Контекст допускает сплетни, но само слово шире и может обозначать пустую либо неразумную болтовню. Основной текст сохраняет эту смысловую широту, а примечание указывает контекстуально вероятный вариант.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достойный. Синтаксис сохраняет повтор «праздность», противопоставление «не только... но...» и последовательность греческого текста, избегая архаизмов и конфессионально окрашенной лексики.
