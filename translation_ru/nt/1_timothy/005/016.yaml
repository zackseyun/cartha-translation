  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: ru
  text: Если у какой-либо верующей женщины есть вдовы на её попечении, пусть она оказывает им поддержку, и пусть церковь не будет обременена, чтобы она могла поддержать вдов, действительно нуждающихся в поддержке.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Если у какого-либо верующего мужчины или женщины есть вдовы на попечении» или «Если у какого-либо верующего есть вдовы на попечении».'
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: у какой-нибудь верующей женщины
  rationale: Форма πιστή — женского рода, единственного числа; поэтому в основном тексте речь идёт именно о верующей женщине. Оборот «у ... есть» естественно передаёт ἔχει.
- source_word: χήρας
  choice: вдовы
  rationale: Прямое обозначение вдов; в контексте главы имеются в виду женщины, нуждающиеся в материальной поддержке.
- source_word: ἐπαρκείτω / ἐπαρκέσῃ
  choice: пусть она помогает / могла помогать
  rationale: ἐπαρκέω означает оказывать достаточную практическую помощь. Повтор одного русского глагола сохраняет лексическую связь между обязанностью женщины и служением церкви.
- source_word: βαρείσθω
  choice: пусть церковь не обременяется
  rationale: Пассивный императив выражает требование не возлагать на церковь дополнительное бремя содержания.
- source_word: ἡ ἐκκλησία
  choice: церковь
  rationale: В Пастырских посланиях слово обозначает христианскую общину; «церковь» — ясный и общепринятый русский эквивалент.
- source_word: ταῖς ὄντως χήραις
  choice: истинным вдовам
  rationale: Сохраняет краткость и повторяющуюся в главе категорию вдов, действительно оставшихся без поддержки; смысловое уточнение не вносится непосредственно в текст.
theological_decisions:
- issue: Род субъекта в начальной части стиха
  choice: 'конкретный субъект женского рода: «у какой-нибудь верующей женщины»'
  alternative: «у какого-нибудь верующего» или «у какого-нибудь верующего или верующей» по другим рукописным чтениям
  rationale: В предоставленном тексте SBLGNT стоит τις πιστή, грамматически женский род единственного числа. Основной текст это сохраняет, а более широкие варианты отражены в сноске.
- issue: Значение выражения ὄντως χήραις
  choice: «истинным вдовам»
  alternative: «вдовам, действительно оставшимся одинокими»
  rationale: Более буквальная формулировка сохраняет категориальное выражение Павла и не подменяет его контекстуальным толкованием; из предшествующего контекста видно, что речь идёт о вдовах без семейной поддержки.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет последовательность греческих повелительной и целевой конструкций; «помогает» выбрано как естественное обозначение практической материальной поддержки.
