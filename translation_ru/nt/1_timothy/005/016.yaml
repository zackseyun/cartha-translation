revisions:
- from: Если у какой-нибудь верующей женщины есть вдовы[a], пусть она помогает им, и пусть церковь не обременяется, чтобы она могла помогать истинным вдовам.
  to: Если у какой-либо верующей женщины есть вдовы на её попечении, пусть она оказывает им поддержку, и пусть церковь не будет обременена, чтобы она могла поддержать вдов, действительно нуждающихся в поддержке.[a]
  rationale: 'Исправлены две точки, где буквальная передача мешала естественности русского и прозрачности смысла: «на её попечении» выражает контекстуальную силу ἔχει, а заключительная формулировка поясняет категориальный смысл ὄντως χήραις. Сноска сохранена и уточнена так, чтобы точно отражать расширяющие варианты чтения. Маркер перенесён к завершающей фразе, поскольку он относится к начальному субъекту; при публикационной верстке его допустимо поставить после «женщины» в первой части стиха.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:48:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: γυναῖκα/πιστή сохранены как субъект женского рода, χήρας — «вдовы», а цель состоит в том, чтобы община могла поддержать категорию «действительно вдов». Однако «у ... есть вдовы» без уточнения попечения в русском звучит неестественно и недостаточно передаёт контекст обязательства по содержанию. «Истинные вдовы» также может создавать ненужный оттенок противопоставления настоящих и ненастоящих вдов; греческое ὄντως выражает квалификацию их положения.'
  naturalness: Переработка делает начальную конструкцию идиоматичной для современного литературного русского и яснее связывает «вдов» с обязанностью верующей женщины. Пассивное «пусть церковь не будет обременена» естественно передаёт βαρείσθω.
  terminology: «Верующая женщина» точно сохраняет женский род πιστή в тексте SBLGNT. «Оказывать поддержку» адекватно передаёт ἐπαρκέω в контексте материальной заботы и повторяет тот же смысл для женщины и церкви. «Вдов, действительно нуждающихся в поддержке» эксплицирует прагматический смысл ὄντως в ближайшем контексте, не вводя конфессионального толкования.
  issues:
  - severity: medium
    issue: Неестественная и семантически неполная конструкция «у какой-нибудь верующей женщины есть вдовы».
    rationale: Буквальное «есть вдовы» в русском не выражает, что эти вдовы находятся в сфере её ответственности. Формулировка «есть вдовы на её попечении» передаёт ἔχει в контексте распоряжения о содержании, не меняя смысла.
  - severity: low
    issue: Выражение «истинным вдовам» может быть неверно понято как вопрос подлинности их статуса.
    rationale: Ὄντως в данном контексте выделяет вдов, реально нуждающихся в общинной поддержке. Более ясная русская передача избегает оттенка «ненастоящих» вдов.
  revised_text: Если у какой-либо верующей женщины есть вдовы на её попечении, пусть она оказывает им поддержку, и пусть церковь не будет обременена, чтобы она могла поддержать вдов, действительно нуждающихся в поддержке.[a]
