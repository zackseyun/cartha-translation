  text: ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ ⸀θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/005.yaml
  text: She who is truly a widow[a], and is left all alone[c][b], has set her hope on God and continues in petitions and prayers night and day.
translation:
  language: ru
  text: А та, которая действительно вдова[a] и осталась совсем одна[b], возложила надежду на Бога[c] и пребывает в мольбах и молитвах[d] ночью и днём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поистине вдова»; в контексте речь идёт о вдове, действительно соответствующей описываемой здесь категории.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «находится в одиночестве»; греческая форма подчёркивает состояние женщины, оставшейся без поддержки близких.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «уповает на Бога». Греческий перфект может подчёркивать твёрдо возложенную надежду, которая сохраняется и теперь.'
    reason: lexical_alternative
  - marker: d
    text: 'Сохранены два греческих слова: «мольбы» обозначают настойчивые, конкретные просьбы, а «молитвы» — молитвенное обращение в более общем смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Передаёт переход и контраст с ближайшим контекстом без добавления отсутствующего в греческом временного значения «теперь».
- source_word: ὄντως χήρα
  choice: та, которая действительно вдова
  rationale: ὄντως выделяет вдову, действительно соответствующую описываемой в контексте категории, а не просто носительницу социального обозначения.
- source_word: μεμονωμένη
  choice: осталась совсем одна
  rationale: Перфектное причастие обозначает наступившее и сохраняющееся состояние женщины, оставшейся без близкой поддержки; «совсем» естественно выражает её полное одиночество.
- source_word: ἤλπικεν ἐπὶ θεόν
  choice: возложила надежду на Бога
  rationale: Перфект указывает на совершившееся упование с продолжающимся результатом — её надежда по-прежнему обращена к Богу.
- source_word: προσμένει
  choice: пребывает
  rationale: Глагол выражает продолжающееся, стойкое участие; «пребывает» естественно сочетается с последующими дательными формами и сохраняет достоинство стиля.
- source_word: ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς
  choice: в мольбах и молитвах
  rationale: 'Сохранены оба греческих существительных: первое подчёркивает конкретные настойчивые просьбы, второе обозначает молитву шире.'
- source_word: νυκτὸς καὶ ἡμέρας
  choice: ночью и днём
  rationale: Сохранены греческий порядок и обычное идиоматическое указание на постоянство практики.
theological_decisions:
- issue: Характеристика «действительной вдовы»
  choice: 'Стих описывает вдову, действительно относящуюся к выделяемой в контексте категории: она лишена человеческой поддержки, надеется на Бога и постоянна в молитве.'
  alternative: Понимать выражение как общее описание любой женщины, у которой умер муж, без признаков особой категории.
  rationale: ὄντως и ближайший контекст 1 Тим 5 проводят различие между вдовами; перевод сохраняет это различие, не вводя конфессиональных правил церковного устройства.
- issue: Значение перфекта ἤλπικεν
  choice: «Возложила надежду» передаёт принятое упование, сохраняющее силу в настоящем.
  alternative: «Надеется» передаёт только настоящее состояние, а «надеялась» может прозвучать как надежда, оставшаяся в прошлом.
  rationale: Греческий перфект совмещает совершившееся действие и его продолжающийся результат; формулировка не уточняет сверх текста ни момент, ни обстоятельства этого упования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Пребывает» сохраняет достоинство и продолжительный характер действия, не звуча архаично в данном контексте; порядок «ночью и днём» следует греческому тексту.
