lexical_decisions:
- source_word: ἤδη
  choice: уже
  rationale: 'Сохраняет временное значение наречия: описанное уклонение к этому моменту уже произошло.'
- source_word: γάρ
  choice: ведь
  rationale: Естественно вводит пояснение и основание для предшествующего наставления.
- source_word: τινες
  choice: некоторые
  rationale: Передаёт неопределённое указание на часть упомянутой ранее группы, не уточняя её численность.
- source_word: ἐξετράπησαν
  choice: уклонились
  rationale: Сохраняет образ отклонения от надлежащего пути и не вводит отсутствующего в форме глагола явного внешнего виновника.
- source_word: ὀπίσω
  choice: пойдя за
  rationale: В сочетании с личным обозначением естественно выражает следование за кем-либо; деепричастный оборот связывает это следование с уклонением, не ослабляя направительного образа.
- source_word: Σατανᾶ
  choice: сатаной
  rationale: Использовано общепринятое в современном русском языке библейское обозначение; творительный падеж обусловлен конструкцией «идти за кем».
theological_decisions:
- issue: Следует ли передать ὀπίσω τοῦ Σατανᾶ буквально как положение «позади сатаны» или идиоматически как следование за ним.
  choice: пойдя за сатаной
  alternative: уклонились вслед за сатаной / уклонились позади сатаны
  rationale: Основной текст ясно передаёт метафору следования и подразумеваемой приверженности, а сноска сохраняет пространственно-направительную неоднозначность греческого выражения.
translation_notes:
  register: Современный литературный русский язык; краткая, серьёзная и понятная формулировка. Союз «ведь» сохраняет пояснительную связь с предыдущим стихом, а образ уклонения не заменён отвлечённым богословским термином.
