lexical_decisions:
- source_word: σπαταλῶσα
  choice: предаётся удовольствиям
  rationale: Причастие обозначает продолжающийся образ жизни, сосредоточенный на удовольствиях и потакании себе, а не просто переживание радости. Эта формулировка естественна по-русски и сохраняет отрицательную нравственную окраску.
- source_word: ζῶσα
  choice: заживо
  rationale: Наречие кратко и естественно передаёт уступительно-временной смысл причастия — «будучи физически живой» — и сохраняет намеренный парадокс.
- source_word: τέθνηκεν
  choice: мертва
  rationale: Перфект подчёркивает наличное состояние как результат смерти; краткое прилагательное «мертва» точно передаёт это состояние, не устраняя метафорический смысл.
- source_word: ἡ ... σπαταλῶσα
  choice: та, что предаётся удовольствиям
  rationale: Субстантивированное причастие женского рода передано конструкцией женского рода без добавления слова «вдова», которого непосредственно в стихе нет.
- source_word: δὲ
  choice: А
  rationale: Частица вводит контраст с истинной вдовой из предыдущего стиха; русское «А» выражает это противопоставление естественнее, чем более резкое «Но».
theological_decisions:
- issue: Характер смерти при физической жизни
  choice: 'Сохранить метафору: «заживо мертва»'
  alternative: Уточнить как «духовно мертва» или «нравственно мертва»
  rationale: Исходный текст намеренно не уточняет вид смерти. Перевод сохраняет парадокс и богословскую напряжённость, не подставляя в основной текст более узкое толкование.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, выразительная и достойная. «Заживо мертва» сохраняет парадокс оригинала, а «предаётся удовольствиям» передаёт длительный, самоуслаждающий образ жизни без архаизма.
