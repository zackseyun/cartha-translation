  source_fidelity: 'Перевод точно передаёт синтаксис и основные смысловые компоненты греческого текста: торжественное обращение перед Богом, Христом Иисусом и избранными ангелами; требование соблюдать «всё это» без предварительного суждения и не действовать по пристрастию. Различие между πρόκριμα и πρόσκλισις сохранено.'
  naturalness: Текст звучит как современный литературный русский с уместно торжественным регистром. «Торжественно призываю тебя» несколько мягче, чем формальное «торжественно поручаю/заклинаю», но в данном наставительном контексте остаётся допустимой передачей διαμαρτύρομαι и естественно сочетается с инфинитивом «соблюдать».
  terminology: «Христом Иисусом» — естественная и общеупотребительная в русском библейском языке передача Χριστοῦ Ἰησοῦ; она сохраняет титульное обозначение без доктринального уточнения. «Избранными ангелами» не объясняет основание избрания, как и оригинал. «Предвзятое суждение» и «пристрастие» удачно разводят два греческих понятия.
