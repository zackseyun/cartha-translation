id: 1TI.5.21
reference: 1 Timothy 5:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: ru
  text: Торжественно призываю тебя перед Богом, Христом Иисусом и избранными ангелами соблюдать всё это без предвзятого суждения[a] и ничего не делать из пристрастия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «без заранее вынесенного суждения».'
    reason: Лексема πρόκριμα может указывать именно на суждение или решение, принятое заранее.
  - marker: b
    text: 'Или: «не склоняясь ни на чью сторону».'
    reason: Лексема πρόσκλισις обозначает пристрастную склонность в пользу одной из сторон.
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: торжественно призываю
  rationale: В данном наставлении глагол выражает solemnное, обязывающее увещание перед свидетелями; формулировка передаёт вес высказывания и звучит естественно по-русски.
- source_word: ἐνώπιον
  choice: перед
  rationale: Краткое и естественное русское соответствие, сохраняющее смысл присутствия Бога, Христа и ангелов как свидетелей торжественного призыва.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Христом Иисусом
  rationale: «Христос» — укоренившееся в русском языке обозначение титула Мессии; порядок слов оригинала сохранён.
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: избранными ангелами
  rationale: Передаёт обычное значение ἐκλεκτός, не уточняя, в каком именно смысле эти ангелы названы избранными.
- source_word: ταῦτα φυλάξῃς
  choice: соблюдать всё это
  rationale: В контексте φυλάσσω означает исполнять или неуклонно соблюдать данные наставления; «всё это» естественно отсылает к предшествующим указаниям.
- source_word: χωρὶς προκρίματος
  choice: без предвзятого суждения
  rationale: Сохраняет компонент заранее сформированного решения или суждения и отличает его от последующего упоминания пристрастия.
- source_word: μηδὲν ποιῶν κατὰ πρόσκλισιν
  choice: ничего не делать из пристрастия
  rationale: Естественно передаёт запрет склоняться на чью-либо сторону или действовать из личной благосклонности.
theological_decisions:
- issue: Передача Χριστός
  choice: Христос Иисус
  alternative: Мессия Иисус
  rationale: В современном русском «Христос» остаётся общепонятным и торжественным титулом, исторически передающим «Мессия»; сочетание «Христос Иисус» естественнее русского «Мессия Иисус» и сохраняет порядок греческого текста.
- issue: Смысл «избранных ангелов»
  choice: Не уточнять основание или назначение их избрания
  alternative: ангелы, избранные Богом / ангелы-избранники
  rationale: Греческий текст называет ангелов избранными, но не объясняет, в каком отношении; перевод сохраняет эту недосказанность.
translation_notes:
  register: 'Современный литературный русский язык с торжественным, но понятным регистром. Две близкие идеи в конце стиха намеренно разведены: πρόκριμα передано как предвзятое или заранее вынесенное суждение, а πρόσκλισις — как пристрастие к одной из сторон.'
