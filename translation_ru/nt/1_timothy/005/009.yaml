  text: В список следует вносить только вдову не моложе шестидесяти лет, которая была женой одного мужа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «женщина одного мужчины». Это выражение может указывать на супружескую верность и добрую репутацию; некоторые понимают его как «бывшую замужем только один раз».'
    reason: alternative_reading
lexical_decisions:
- source_word: Χήρα
  choice: вдову
  rationale: Обычное значение — женщина, муж которой умер; винительный падеж естественно обусловлен русской безличной конструкцией «следует вносить».
- source_word: καταλεγέσθω
  choice: следует вносить в список
  rationale: Передаёт повелительное значение и административный смысл внесения в официальный перечень.
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα
  choice: не моложе шестидесяти лет
  rationale: Естественно передаёт установленный греческим оборотом минимальный возраст; причастие γεγονυῖα указывает на достигнутый возраст и отдельно в русском не выражается.
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: бывшую женой одного мужа
  rationale: Формально сохраняет греческую идиому и её неоднозначность, не сводя её без достаточных оснований ни к единственному браку за всю жизнь, ни только к супружеской верности.
theological_decisions:
- issue: Значение ἑνὸς ἀνδρὸς γυνή
  choice: Сохранить в основном тексте выражение «бывшую женой одного мужа».
  alternative: «бывшую замужем только один раз» или «хранившую верность мужу»
  rationale: Греческое выражение допускает спор о том, обозначает ли оно брачную историю или супружескую верность и добрую репутацию. Формальная передача вместе со сноской сохраняет эту богословски значимую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; конструкция «вносить в список» ясна обычному читателю и сохраняет официальный оттенок. Оборот «бывшую женой одного мужа» намеренно несколько формален ради сохранения неоднозначности оригинала.
