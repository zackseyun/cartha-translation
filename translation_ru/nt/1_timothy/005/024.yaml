  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: ru
  text: Грехи некоторых людей очевидны[a] и идут впереди них на суд[b], а грехи других следуют за ними позже.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «явны».'
    reason: lexical_alternative
  - marker: b
    text: В данном контексте «суд» может означать совершаемую теперь оценку человека, но выражение допускает и более широкий смысл Божьего суда.
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι
  choice: Грехи некоторых людей
  rationale: Родительный оборот естественно передан как определение к слову «грехи»; ἄνθρωπος здесь имеет общее значение, поэтому выбрано нейтральное «людей».
- source_word: πρόδηλοί
  choice: очевидны
  rationale: Современное и ясное соответствие значению «явные, легко заметные» без стилистической архаики.
- source_word: προάγουσαι εἰς κρίσιν
  choice: идут впереди них на суд
  rationale: Сохранён образ грехов, которые идут впереди людей, а также направительное значение εἰς; местоимение «них» восполняет подразумеваемый из контекста объект.
- source_word: τισὶν δὲ καὶ ἐπακολουθοῦσιν
  choice: а за некоторыми следуют потом
  rationale: 'Сохранены противопоставление и олицетворённый образ: у других людей грехи обнаруживаются следом, позднее. Подлежащее «грехи» остаётся понятным из первой части, как и в греческом тексте.'
theological_decisions:
- issue: Значение κρίσις
  choice: суд
  alternative: рассмотрение или оценка человека в общине
  rationale: Ближайший контекст допускает оценку людей при церковном служении, однако само слово может указывать и на более широкий, в том числе Божий, суд. Общая формулировка не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык; сохранено олицетворение грехов и намеренно не уточнено, идёт ли речь только о церковной оценке или также о Божьем суде.
