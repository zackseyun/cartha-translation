id: 1TI.5.19
reference: 1 Timothy 5:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: κατὰ πρεσβυτέρου κατηγορίαν μὴ παραδέχου, ἐκτὸς εἰ μὴ ἐπὶ δύο ἢ τριῶν μαρτύρων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: ru
  text: Не принимай обвинения против пресвитера[a] иначе как на основании показаний двух или трёх свидетелей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пожилого мужчины», если πρεσβυτέρου здесь указывает на возраст, а не на служение пресвитера в общине.'
    reason: alternative_reading
  - marker: b
    text: 'Эта формулировка отражает ветхозаветный правовой принцип: дело подтверждается показаниями двух или трёх свидетелей (ср. Втор 19:15).'
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: против пресвитера
  rationale: В данном контексте πρεσβύτερος, вероятнее всего, обозначает руководителя общины; «пресвитер» сохраняет церковное значение термина, не уточняя устройство служения сверх сказанного в тексте. Возможное возрастное значение отмечено в сноске.
- source_word: κατηγορίαν
  choice: обвинения
  rationale: Слово обозначает обвинение, вероятно имеющее формальный характер. Русское «обвинение» ясно передаёт юридико-процедурный оттенок.
- source_word: μὴ παραδέχου
  choice: не принимай
  rationale: Императив запрещает принимать обвинение к рассмотрению; формулировка не означает, что обвинение заранее признаётся ложным.
- source_word: ἐκτὸς εἰ μὴ
  choice: иначе как
  rationale: Оборот вводит исключение; «иначе как» естественно связывает запрет с необходимым условием.
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: на основании показаний двух или трёх свидетелей
  rationale: ἐπί выражает доказательную основу. Добавление «показаний» естественно по-русски раскрывает роль свидетелей и сохраняет судебный оттенок и связь с Втор 19:15.
theological_decisions:
- issue: Значение πρεσβυτέρου в контексте общины
  choice: пресвитер, то есть руководитель общины
  alternative: пожилой мужчина
  rationale: Ближайший контекст наставлений о пресвитерах и церковном порядке делает служебное значение наиболее вероятным, однако лексическая неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и процедурно-правовым звучанием. «Пресвитер» выбран как понятный церковный термин; неоднозначность между служением и возрастом не устранена, а вынесена в сноску.
