source:
  edition: SBLGNT
  text: Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/017.yaml
  text: Let the elders who lead well be considered worthy of double honor[c][b][a], especially those who labor in word and teaching.
translation:
  language: ru
  text: Старейшины, которые хорошо руководят, пусть считаются достойными двойной чести[a], особенно[b] те, кто усердно трудится в слове и учении[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достойными двоякой чести». Это выражение может включать и уважение, и материальную поддержку, особенно в свете следующего стиха.'
    reason: lexical_alternative
  - marker: b
    text: 'Некоторые понимают «особенно» в значении «а именно», то есть как уточнение: здесь имеются в виду старейшины, трудящиеся в слове и учении.'
    reason: alternative_reading
  - marker: c
    text: Выражение «в слове и учении», вероятно, означает словесное служение — возвещение и наставление.
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: старейшины
  rationale: В Пастырских посланиях слово обозначает признанных руководителей общины, а не просто пожилых мужчин. «Старейшины» передаёт эту функцию, не привнося позднейшую церковно-иерархическую структуру.
- source_word: καλῶς προεστῶτες
  choice: которые хорошо руководят
  rationale: Оборот указывает на ответственное руководство и попечение. «Хорошо руководят» звучит естественно и сохраняет реальную меру власти без излишне жёсткого оттенка слова «правят».
- source_word: διπλῆς τιμῆς
  choice: двойной чести
  rationale: 'Буквальная формулировка сохраняет смысловую широту: речь может идти и об уважении, и о материальной поддержке, особенно с учётом следующего стиха.'
- source_word: ἀξιούσθωσαν
  choice: пусть считаются достойными
  rationale: Пассивный императив призывает общину признавать их достойными соответствующей чести.
- source_word: μάλιστα
  choice: особенно
  rationale: Наиболее естественно слово выделяет внутри более широкой группы тех, кому уделяется особое внимание, не исключая возможного пояснительного понимания.
- source_word: κοπιῶντες
  choice: кто усердно трудится
  rationale: Глагол выражает напряжённый, требующий усилий труд; наречие «усердно» делает этот оттенок ясным в современном русском.
- source_word: ἐν λόγῳ
  choice: в слове
  rationale: Формулировка сохраняет широту греческого λόγος и не сводит её исключительно к проповеди, хотя здесь, вероятно, имеется в виду словесное служение.
- source_word: διδασκαλίᾳ
  choice: учении
  rationale: «Учение» естественно передаёт как содержание, так и деятельность наставления, не придавая выражению излишне технического звучания.
theological_decisions:
- issue: Значение выражения «двойная честь» применительно к руководителям общины
  choice: Сохранить широкое выражение «двойная честь», не ограничивая его только уважением или только материальным содержанием.
  alternative: «двойное уважение»; «двойное вознаграждение»; «честь, включающая материальную поддержку»
  rationale: Ближайший контекст 1 Тим 5:18 указывает на материальную поддержку, однако τιμή может обозначать также почёт и уважение. Широкая формулировка сохраняет смысловой диапазон текста.
- issue: Смысл μάλιστα
  choice: Передать как «особенно».
  alternative: «а именно»
  rationale: Так сохраняется вероятное выделение особо отмеченной части старейшин, но перевод не решает окончательно вопрос о том, является ли оборот уточняющим обозначением всех упомянутых старейшин.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. Синтаксис близок к греческому, но естественен для русского читателя. Формулировки «двойной чести» и «в слове и учении» намеренно сохраняют смысловую широту оригинала; возможные толкования вынесены в примечания.
