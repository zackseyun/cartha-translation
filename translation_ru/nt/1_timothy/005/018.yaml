base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: ru
  text: 'Ведь Писание говорит: «Не надевай намордник на вола, когда он вымолачивает зерно», и: «Работник достоин своего заработка».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: Ведь Писание говорит
  rationale: «Ведь» передаёт пояснительную связь γάρ с предыдущим стихом; ἡ γραφή обозначает авторитетное священное Писание, а настоящее время λέγει естественно передаётся как «говорит».
- source_word: Βοῦν
  choice: вола
  rationale: В данном сельскохозяйственном контексте βοῦς обозначает вола, используемого для работы.
- source_word: ἀλοῶντα
  choice: когда он молотит
  rationale: Причастие обозначает вола, занятого молотьбой; придаточная конструкция звучит естественно по-русски и сохраняет одновременность действия.
- source_word: οὐ φιμώσεις
  choice: Не надевай намордника
  rationale: Будущее изъявительное имеет запретительное значение. Такая формулировка ясно и современно передаёт конкретный смысл φιμόω — лишать животное возможности есть посредством намордника.
- source_word: καί
  choice: и
  rationale: Простой союз сохраняет координацию двух цитат без добавочного толкования.
- source_word: Ἄξιος ὁ ἐργάτης
  choice: Работник достоин
  rationale: ἐργάτης — тот, кто трудится; «работник» — современное, общее и естественное соответствие, сохраняющее форму мужского рода единственного числа.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: своей платы
  rationale: μισθός здесь означает вознаграждение за выполненный труд, а не отвлечённую награду. Возвратное «своей» естественно соотносится в русском с подлежащим единственного числа.
theological_decisions:
- issue: Отнесение обеих цитат к формуле «Писание говорит»
  choice: Обе цитаты переданы как грамматически подчинённые общей вводной формуле.
  alternative: Считать Писанием только первую цитату, а вторую — отдельной пословицей или изречением Иисуса.
  rationale: Греческий текст ставит обе цитаты после одной вводной формулы и соединяет их καί. Перевод сохраняет эту структуру, не делая дополнительных выводов о каноническом статусе второй цитаты.
- issue: Род и число в αὐτοῦ
  choice: Сохранено единственное число в сочетании «своей платы».
  alternative: 'Употребить множественное число: «работники достойны своей платы».'
  rationale: Исходный текст имеет мужской род единственного числа и формулирует общий принцип посредством единичного представителя; перевод не меняет эту форму.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис двух цитат сохранён; архаичные обороты вроде «не заграждай рта» не использованы.
