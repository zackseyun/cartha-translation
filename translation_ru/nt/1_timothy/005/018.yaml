  naturalness: «Ведь Писание говорит» и «Работник достоин своего заработка» естественны для современного литературного русского языка при сохранении умеренного библейского регистра. «Вымолачивает зерно» яснее и идиоматичнее в данном сельскохозяйственном образе.
  terminology: «Писание», «вол», «работник» и «заработок» соответствуют греческим ἡ γραφή, βοῦς, ἐργάτης и μισθός. «Заработок» точнее обозначает причитающееся за труд вознаграждение, чем несколько менее определённая «плата».
