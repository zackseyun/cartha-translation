language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/004.yaml
  text: But if any widow has children or grandchildren[a], let them first learn to show godliness to their own household and to repay their forebears[c][b], for this is acceptable before God.
translation:
  language: ru
  text: Если же у вдовы есть дети или внуки[a], пусть они прежде учатся проявлять благочестие по отношению к собственной семье[b] и воздавать должное своим предкам[c], потому что это угодно Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети или потомки». Греческое слово ἔκγονα может обозначать потомков вообще, хотя здесь, вероятнее всего, имеются в виду внуки.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пусть они прежде учатся благочестиво заботиться о собственной семье». Греческий текст связывает заботу о семье с благочестием.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «своим предкам». В данном контексте, вероятно, подразумеваются живые представители старших поколений семьи, например родители или прародители.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: вдова
  rationale: Обычное значение слова; весь контекст посвящён женщинам, потерявшим мужа.
- source_word: τέκνα ἢ ἔκγονα
  choice: дети или внуки
  rationale: τέκνα означает детей, а ἔκγονα — потомков; в данном контексте семейной заботы естественнее всего подразумеваются внуки, при этом более широкое значение отмечено в сноске.
- source_word: μανθανέτωσαν
  choice: пусть они прежде учатся
  rationale: Форма настоящего времени повелительного наклонения в третьем лице множественного числа передана естественной русской побудительной конструкцией; местоимение ясно относит повеление к детям и внукам.
- source_word: τὸν ἴδιον οἶκον
  choice: по отношению к собственной семье
  rationale: οἶκος здесь обозначает семью или домочадцев, а не строение; ἴδιον передано словом «собственной».
- source_word: εὐσεβεῖν
  choice: проявлять благочестие
  rationale: 'Сохранено религиозно-нравственное значение глагола: забота о семье представлена как практическое выражение благочестия.'
- source_word: ἀμοιβὰς ἀποδιδόναι
  choice: воздавать должное
  rationale: Выражение означает отдавать в ответ за ранее полученную заботу; выбранная формулировка естественна по-русски и не создаёт узкого представления о денежной выплате.
- source_word: τοῖς προγόνοις
  choice: своим родителям и прародителям
  rationale: πρόγονοι обозначает предшествующие поколения, буквально предков; в контексте заботы о живой вдове речь идёт прежде всего о родителях и старших предках семьи.
- source_word: ἀπόδεκτον ἐνώπιον τοῦ θεοῦ
  choice: это угодно Богу
  rationale: Естественная русская передача мысли о поступке, благоприятно принимаемом и одобряемом Богом.
theological_decisions:
- issue: К кому относится повеление μανθανέτωσαν
  choice: К детям или внукам вдовы
  alternative: К вдовам вообще, несмотря на переход к множественному числу
  rationale: Ближайшее грамматически подходящее подлежащее во множественном числе — τέκνα ἢ ἔκγονα. Это также согласуется с обязанностью младших поколений заботиться о вдове и отвечать на полученную прежде семейную заботу.
- issue: Религиозный смысл εὐσεβεῖν
  choice: Забота о семье является проявлением благочестия
  alternative: Речь идёт лишь об исполнении семейного долга без выраженного религиозного смысла
  rationale: Глагол εὐσεβεῖν несёт явный смысл благочестия, а заключение стиха связывает такое поведение с Божьим одобрением.
- issue: Объём значения τοῖς προγόνοις
  choice: Родители и прародители как предшествующие поколения семьи
  alternative: Все предки вообще или только родители
  rationale: Греческое слово допускает более широкий смысл «предки», однако непосредственный контекст требует живых представителей старшего поколения, которым можно воздать заботой. Перевод не ограничивает выражение одними родителями.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формулировки «проявлять благочестие» и «воздавать должное» сохраняют богословскую и нравственную насыщенность оригинала, оставаясь понятными современному читателю.
