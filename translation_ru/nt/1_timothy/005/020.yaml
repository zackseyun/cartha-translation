  terminology: «Обличай» сохраняется как точный и уместный для дисциплинарного контекста термин. «Страх» сохранён без подмены его «благоговением», «ужасом» или «опасением». Контекстуальная сноска о пресвитерах корректно оформлена как возможность, а не как ограничение смысла стиха.
