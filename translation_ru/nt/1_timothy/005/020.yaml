  source_fidelity: 'Основные соответствия точны: «обличай» передаёт ἔλεγχε, «перед всеми» — ἐνώπιον πάντων, а придаточное цели с «чтобы» — ἵνα. Не следует добавлять в основной текст «пресвитеров»: τοὺς ἁμαρτάνοντας само по себе этого не говорит. Настоящее причастие уместно передать как продолжающееся/текущее согрешение, не делая устойчивость в грехе обязательным значением.'
