base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/020.yaml
  text: Rebuke those who are sinning before everyone[b][a], so that the rest also may have fear.
translation:
  language: ru
  text: Тех, кто согрешает, обличай перед всеми[a][b], чтобы и остальные испытывали страх.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, кто продолжает грешить»; форма настоящего времени может указывать на продолжающееся греховное поведение.'
    reason: lexical_alternative
  - marker: b
    text: Ближайший контекст может указывать прежде всего на согрешающих пресвитеров, хотя в самом стихе сказано лишь о тех, кто согрешает.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἁμαρτάνοντας
  choice: согрешающих
  rationale: Субстантивированное причастие настоящего времени передано без добавления явно не выраженного значения упорства; длительный или повторяющийся характер действия отмечен в сноске.
- source_word: ἐνώπιον πάντων
  choice: перед всеми
  rationale: Буквальное и естественное русское соответствие, сохраняющее указание на открытое обличение, не сводя выражение к более толковательному «публично».
- source_word: ἔλεγχε
  choice: обличай
  rationale: В контексте церковного наставления глагол означает выявлять проступок и строго исправлять; «обличай» сохраняет обе стороны значения лучше, чем более узкие «упрекай» или «разоблачай».
- source_word: οἱ λοιποὶ
  choice: остальные
  rationale: Нейтрально передаёт тех, кто остаётся помимо согрешающих, не уточняя сверх текста, идёт ли речь только о пресвитерах или обо всей общине.
- source_word: φόβον ἔχωσιν
  choice: имели страх
  rationale: 'Сохраняет греческую конструкцию и её смысловую открытость: речь может идти о спасительном предостережении и серьёзном опасении, а не обязательно об ужасе.'
theological_decisions:
- issue: Кого именно следует обличать
  choice: В основном тексте оставлено широкое «согрешающих», без добавления «пресвитеров».
  alternative: Из ближайшего контекста (ст. 19–20) можно заключить, что прежде всего имеются в виду согрешающие пресвитеры.
  rationale: Сам стих прямо не повторяет существительное «пресвитеры». Перевод сохраняет формулировку греческого текста, а контекстуальную возможность отмечает в сноске.
- issue: Характер страха
  choice: «имели страх»
  alternative: «боялись» или «прониклись страхом»
  rationale: Так сохраняется богословски значимая неоднозначность между трезвым предостережением, благоговейным страхом и опасением наказания.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, церковно уместным звучанием. Порядок маркеров приведён к последовательному [a][b]. Формулировка краткая и близкая к синтаксису источника, но естественная для русского читателя.
