lexical_decisions:
- source_word: πρεσβυτέρας
  choice: пожилых женщин
  rationale: Форма женского рода употреблена субстантивированно и в противопоставлении νεωτέρας обозначает возраст, а не церковное служение пресвитера.
- source_word: ὡς μητέρας
  choice: как матерей
  rationale: ὡς вводит сравнение, а перевод без добавления «своих» сохраняет лаконичность и не вносит отсутствующего в греческом притяжательного значения.
- source_word: νεωτέρας
  choice: молодых
  rationale: Субстантивированное прилагательное обозначает молодых женщин; слово «женщин» естественно подразумевается из первой части параллельной конструкции.
- source_word: ὡς ἀδελφὰς
  choice: как сестёр
  rationale: Сохраняется семейная метафора и симметрия выражения «как матерей».
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: со всей чистотой
  rationale: Оборот естественно передаёт образ действия; «чистота» сохраняет широкий нравственный смысл ἁγνεία, включая уместную в контексте половую непорочность, но не ограничиваясь ею.
theological_decisions:
- issue: Объём значения ἁγνεία в наставлении об отношении к молодым женщинам
  choice: со всей чистотой
  alternative: в полном целомудрии
  rationale: Греческое слово допускает широкий смысл нравственной чистоты и вместе с тем в данном контексте особо подразумевает целомудрие и половую пристойность. Основной текст не сужает значение до одной стороны, а примечание поясняет контекстуальный оттенок.
translation_notes:
  register: Современный литературный русский язык; краткая параллельная конструкция сохраняет форму греческого наставления. Тире помогают восстановить подразумеваемое действие из предыдущего стиха, не добавляя нового содержания.
