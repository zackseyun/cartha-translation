  text: εἰ δέ τις τῶν ἰδίων καὶ ⸀μάλιστα οἰκείων οὐ ⸀προνοεῖ, τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/008.yaml
  text: But if anyone does not provide for his own[a], and especially for members of his household[b], he has denied the faith and is worse than an unbeliever.
translation:
  language: ru
  text: Если же кто не заботится о своих[a], и особенно о домашних, тот отрёкся от веры[b] и хуже неверующего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о своих близких». Это выражение шире, чем круг живущих под одной крышей; далее особо выделяются «домашние».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отказался от веры»; греческая форма указывает на совершившееся действие с сохраняющимся результатом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τις
  choice: кто-то
  rationale: Неопределённое местоимение имеет обобщающий смысл; «кто-то» естественно передаёт его без ограничения высказывания только мужчинами.
- source_word: τῶν ἰδίων
  choice: о своих
  rationale: Субстантивированное «своих» сохраняет широкий круг родных, близких и зависимых от человека, не сводя его лишь к живущим с ним под одной крышей.
- source_word: μάλιστα
  choice: особенно
  rationale: Указывает на подгруппу, в отношении которой обязанность выражена с особой силой.
- source_word: οἰκείων
  choice: о домашних
  rationale: «Домашние» обозначает принадлежащих к дому или домохозяйству и сохраняет более узкое значение по сравнению с предшествующим «своих».
- source_word: προνοεῖ
  choice: заботится
  rationale: В данном контексте глагол означает предусмотрительную практическую заботу, включая материальное обеспечение; «заботится» передаёт смысл естественно и не сужает его до одной только денежной помощи.
- source_word: τὴν πίστιν
  choice: от веры
  rationale: Артикль и контекст указывают на исповедуемую христианскую веру, а не просто на субъективное доверие или надёжность.
- source_word: ἤρνηται
  choice: отрёкся
  rationale: Перфект обозначает совершившееся отречение с сохраняющимся результатом; «отрёкся» передаёт силу нравственного и исповедального разрыва.
- source_word: ἀπίστου
  choice: неверующего
  rationale: В контрасте с исповедуемой верой слово обозначает человека, не верующего во Христа, а не просто ненадёжного или неверного.
- source_word: χείρων
  choice: хуже
  rationale: Прямо и естественно передаёт нравственное сравнение.
theological_decisions:
- issue: Обобщающий характер грамматически мужской конструкции
  choice: Передать τις как «кто-то», а дальнейшую фразу построить без грамматически маркированного притяжательного местоимения.
  alternative: «Если же какой-нибудь мужчина не заботится о своих…» или последовательная форма мужского рода с «его».
  rationale: Греческая форма единственного числа имеет обобщающий, а не исключительно мужской смысл. Русская конструкция сохраняет универсальную применимость наставления и не устраняет его личный характер.
- issue: Значение πίστις в выражении τὴν πίστιν ἤρνηται
  choice: «отрёкся от веры» — от исповедуемой христианской веры.
  alternative: «отказался от доверия» или «оказался неверным».
  rationale: В контексте Пастырских посланий выражение естественно относится к христианской вере, которую поведение человека фактически отрицает. Перевод не уточняет, означает ли это окончательное отпадение, сохраняя напряжённость исходного утверждения.
translation_notes:
  register: Современный литературный русский язык с кратким и строгим наставительным звучанием. «О своих» сохраняет намеренную широту первой группы, а «о домашних» — последующее сужение. Запятая перед «и особенно» оставлена для смыслового выделения уточняющей части.
