id: 1TI.6.14
reference: 1 Timothy 6:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον μέχρι τῆς ἐπιφανείας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/014.yaml
  text: that you keep the commandment unstained and above reproach until the appearing of our Lord Jesus the Messiah[c][b][a],
translation:
  language: ru
  text: чтобы ты соблюдал заповедь незапятнанной и безупречной[a] до явления нашего Господа Иисуса Мессии[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «незапятнанной и безупречной» грамматически относятся к «заповеди», но сжатое греческое выражение может подразумевать также безупречность самого соблюдения заповеди Тимофеем.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Иисуса Христа». Греческое Χριστός может передаваться как титул «Мессия» или традиционной формой «Христос», приближающейся к имени.'
    reason: alternative_reading
lexical_decisions:
- source_word: τηρῆσαί
  choice: соблюдал
  rationale: В зависимости от поручения в предыдущем стихе инфинитив выражает верное исполнение; «соблюдал» естественно передаёт длительную верность заповеди, не сужая смысл до простого хранения.
- source_word: σε
  choice: ты
  rationale: В греческой инфинитивной конструкции это винительный субъекта; по-русски естественно передаётся придаточным с «чтобы ты».
- source_word: τὴν ἐντολήν
  choice: заповедь
  rationale: Определённое существительное в единственном числе. «Заповедь» сохраняет нравственный и авторитетный вес слова и, вероятно, указывает на только что данное апостольское поручение.
- source_word: ἄσπιλον
  choice: незапятнанной
  rationale: Слово означает отсутствие пятна или порока. Русское «незапятнанной» сохраняет образ и согласование с «заповедь».
- source_word: ἀνεπίλημπτον
  choice: безупречной
  rationale: Передаёт состояние, не дающее законного повода для обвинения или порицания; это ясное и современное русское соответствие.
- source_word: μέχρι
  choice: до
  rationale: Обозначает временной предел, наступающий при будущем событии.
- source_word: τῆς ἐπιφανείας
  choice: явления
  rationale: В Пастырских посланиях обозначает будущее видимое явление Христа. «Явление» передаёт это прямо, не добавляя отсутствующего в самом слове указания на повторность.
- source_word: τοῦ κυρίου ἡμῶν
  choice: нашего Господа
  rationale: Сохраняет притяжательное отношение и христологический титул κύριος в естественном современном порядке слов.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь слышится как титул в торжественном эсхатологическом выражении. В русском языке артикля нет, поэтому «Иисуса Мессии» естественно передаёт значение титула без добавления определителя.
theological_decisions:
- issue: К кому по смыслу относятся определения ἄσπιλον и ἀνεπίλημπτον
  choice: Грамматически согласовать их с «заповедью», сохранив сжатость исходного выражения
  alternative: Явно отнести качества к Тимофею или к тому, как он соблюдает заповедь
  rationale: В греческом оба прилагательных согласованы с ἐντολήν, однако по смыслу могут характеризовать и безукоризненное соблюдение заповеди Тимофеем. Основной текст следует форме оригинала, а примечание сохраняет смысловую неоднозначность.
- issue: Передача Χριστοῦ в сочетании Ἰησοῦ Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В контексте будущего явления титульный смысл «Помазанник, Мессия» остаётся отчётливым. Традиционная форма «Христос» также возможна и отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством апостольского наставления. Форма «чтобы ты соблюдал» учитывает синтаксическую зависимость от поручения в предыдущем стихе. Лексика ясна для обычного читателя, при этом сохранены торжественный эсхатологический тон и смысловая сжатость оригинала.
