source:
  edition: SBLGNT
  text: ἔστιν δὲ πορισμὸς μέγας ἡ εὐσέβεια μετὰ αὐταρκείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/006.yaml
  text: But godliness with contentment is great gain[a][b].
translation:
  language: ru
  text: А благочестие вместе с довольством — великое приобретение[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великая выгода», или: «великое средство приобретения». Греческое слово связано с выгодой и приобретением и перекликается с предыдущим стихом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «самодостаточностью», «достаточностью». Здесь, вероятнее всего, имеется в виду удовлетворённость тем, что есть, а не независимость от Бога или других.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Мягко передаёт противопоставление предыдущей мысли о людях, считающих благочестие средством наживы, и естественно связывает стих с контекстом.
- source_word: πορισμὸς
  choice: приобретение
  rationale: Передаёт значение выгоды, прибыли или средства приобретения и сохраняет смысловую перекличку с предыдущим стихом, не ограничивая смысл материальным богатством.
- source_word: μέγας
  choice: великое
  rationale: Передаёт высокую оценку и согласуется с существительным «приобретение».
- source_word: εὐσέβεια
  choice: благочестие
  rationale: Устоявшееся и уместное в современном литературном русском обозначение почтительной, направленной к Богу жизни.
- source_word: μετὰ
  choice: вместе с
  rationale: Ясно выражает сопровождение или сочетание, обозначенное μετά с родительным падежом.
- source_word: αὐταρκείας
  choice: довольством
  rationale: В контексте следующих стихов означает удовлетворённость имеющимся; это слово не создаёт нежелательного впечатления независимости от Бога.
theological_decisions:
- issue: Смысл αὐτάρκεια в христианском контексте
  choice: довольство
  alternative: самодостаточность; достаточность
  rationale: Стихи 7–8 поясняют это как удовлетворённость необходимым для жизни, а не как философскую или духовную независимость.
- issue: Соотношение благочестия и приобретения
  choice: благочестие вместе с довольством само является великим приобретением
  alternative: благочестие при наличии довольства служит великим средством приобретения
  rationale: Предикативная конструкция допускает оба оттенка, однако основной текст естественно передаёт наиболее вероятное отождествление и не представляет благочестие утилитарным средством наживы; альтернативный лексический оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Благочестие» сохраняет важный термин Посланий к Тимофею, а «довольство» понятно современному читателю в значении удовлетворённости имеющимся. Тире естественно оформляет именную предикативную конструкцию.
