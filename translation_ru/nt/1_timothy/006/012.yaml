  text: ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς, εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: ru
  text: Веди достойную борьбу за веру[a], крепко держись за вечную жизнь, к которой ты был призван и перед многими свидетелями произнёс достойное исповедание.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Веди достойную борьбу веры»; возможно также: «Веди достойную борьбу, основанную на вере». Греческий оборот может обозначать борьбу за христианскую веру либо борьбу, совершаемую с верой.'
    reason: alternative_reading
  - marker: b
    text: Греческий текст прямо не указывает содержание исповедания. По контексту оно может быть связано с вечной жизнью, к которой Тимофей был призван.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγωνίζου τὸν καλὸν ἀγῶνα
  choice: Веди добрую борьбу
  rationale: Сочетание передаёт настойчивое, продолжающееся участие в достойной борьбе. «Веди борьбу» естественно по-русски и сохраняет образ состязания или сражения, не сводя его только к одной из этих сфер.
- source_word: τῆς πίστεως
  choice: веры
  rationale: 'Родительный падеж сохраняет неоднозначность: речь может идти как о борьбе, определяемой верой, так и о борьбе за христианскую веру. Определённость греческого выражения нельзя непосредственно воспроизвести русским артиклем.'
- source_word: ἐπιλαβοῦ
  choice: крепко держись
  rationale: Повелительная форма призывает решительно ухватиться за вечную жизнь и не выпускать её. «Крепко держись» передаёт образ овладения и удержания естественным современным русским языком.
- source_word: τῆς αἰωνίου ζωῆς
  choice: вечной жизни
  rationale: Устойчивое и точное обозначение обещанной Богом жизни; дополнение при «держись» закономерно стоит в родительном падеже.
- source_word: εἰς ἣν ἐκλήθης
  choice: к которой ты был призван
  rationale: Предлог εἰς обозначает направленность или цель призвания. Пассивная конструкция сохраняет подразумеваемое Божье действие, не делая его явным сверх текста.
- source_word: ὡμολόγησας τὴν καλὴν ὁμολογίαν
  choice: исповедал доброе исповедание
  rationale: Намеренный однокоренной оборот сохраняет риторическую фигуру греческого текста и подчёркивает публичное исповедание. Хотя повтор заметен, он понятен и уместен в возвышенной библейской прозе.
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: перед многими свидетелями
  rationale: Точно и естественно передаёт публичную обстановку исповедания; «свидетели» здесь не означает позднейшее специальное значение «мученики».
theological_decisions:
- issue: Значение πίστεως в выражении τὸν καλὸν ἀγῶνα τῆς πίστεως
  choice: Неоднозначное «борьбу веры»
  alternative: «борьбу за веру» или «борьбу, совершаемую с верой»
  rationale: Родительный оборот допускает объективное понимание — борьбу за христианскую веру — и качественное или субъективное понимание — борьбу, отмеченную верой. Основной текст не разрешает эту богословски значимую неоднозначность.
- issue: Связь доброго исповедания с вечной жизнью и призванием
  choice: 'Сочинительная связь: «был призван и … исповедал»'
  alternative: Исповедание можно понимать как относящееся к вечной жизни или к призванию к ней
  rationale: В греческом тексте прямо не названо содержание исповедания. Поэтому основной текст не добавляет «о которой», а возможную смысловую связь с вечной жизнью поясняет в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены параллельные определения «добрую/доброе» и однокоренной оборот «исповедал … исповедание» как риторические особенности исходного текста; архаичные «подвизайся» и «подвиг» не использованы.
