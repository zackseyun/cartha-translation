review_pass:
  verdict: revise
  source_fidelity: 'Основные смысловые соответствия сохранены: повеления ἀγωνίζου и ἐπιλαβοῦ, призвание к вечной жизни и публичный характер исповедания переданы верно. Однако «крепко держись вечной жизни» без предлога звучит неестественно и может означать скорее приверженность жизни, чем образно выраженное «ухватиться за неё».'
  naturalness: «Веди добрую борьбу веры» и особенно «исповедал доброе исповедание» представляют собой тяжёлые кальки и не вполне отвечают современному литературному русскому. «Веди достойную борьбу за веру» и «произнёс достойное исповедание» звучат яснее, сохраняя возвышенный, но не архаизирующий регистр.
  terminology: «Вечная жизнь», «призван», «исповедание» и «свидетели» уместны. «Достойный» естественнее передаёт καλός в русских сочетаниях, чем «добрый» в применении к борьбе и исповеданию. Основное прочтение τῆς πίστεως как цели борьбы сопровождается сноской, сохраняющей иные допустимые оттенки.
  issues:
  - severity: medium
    issue: Неестественное управление в «крепко держись вечной жизни».
    rationale: 'Для образного значения ἐπιλαβοῦ («ухватись, возьмись») в русском необходим или наиболее естественен предлог «за»: «крепко держись за вечную жизнь».'
  - severity: medium
    issue: Калькированный оборот «исповедал доброе исповедание».
    rationale: Однокоренной греческий оборот не следует механически воспроизводить ценой понятности современного русского. «Произнёс достойное исповедание» сохраняет существительное ὁμολογία, не уточняет его содержание и передаёт совершённый публичный речевой акт.
  - severity: low
    issue: «Добрая борьба» слабо сочетается в современном русском.
    rationale: «Достойная борьба» передаёт положительную оценку καλός более естественно. «За веру» выбирает вероятное объективное понимание τῆς πίστεως, а сноска явно сохраняет качественное/субъективное прочтение.
