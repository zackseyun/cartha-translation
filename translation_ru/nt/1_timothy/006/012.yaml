revisions:
- from: Веди добрую борьбу веры[a], крепко держись вечной жизни, к которой ты был призван и перед многими свидетелями исповедал доброе исповедание.[b]
  to: Веди достойную борьбу за веру[a], крепко держись за вечную жизнь, к которой ты был призван и перед многими свидетелями произнёс достойное исповедание.[b]
