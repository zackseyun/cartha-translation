  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: ru
  text: Ты же, человек Божий, убегай от всего этого, а стремись к праведности[a], благочестию, вере[b], любви, стойкости и кротости[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливости».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «верности» или «доверию».'
    reason: lexical_alternative
  - marker: c
    text: Редкое греческое слово можно также передать как «мягкость», «терпеливая сдержанность» или «терпеливая кротость».
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: Ты же
  rationale: Передаёт подчёркнутое местоимение второго лица и резкий контраст с предшествующим наставлением.
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: человек Божий
  rationale: Сохраняет узнаваемое библейское обращение к Тимофею; частица ὦ естественно выражена самим обращением без отдельного междометия.
- source_word: ταῦτα φεῦγε
  choice: убегай от всего этого
  rationale: Передаёт силу настоящего повелительного φεῦγε как настойчивого, продолжающегося удаления от ранее названных пороков и заблуждений.
- source_word: δίωκε δὲ
  choice: а стремись
  rationale: Сохраняет противопоставление между бегством от зла и деятельным устремлением к добродетелям; «стремись» естественно передаёт целенаправленность δίωκε.
- source_word: δικαιοσύνην
  choice: праведности
  rationale: В перечне добродетелей обозначает нравственно верную жизнь и отношения; возможное значение «справедливость» сохранено в примечании.
- source_word: εὐσέβειαν
  choice: благочестию
  rationale: Устоявшееся и понятное обозначение почтительной, обращённой к Богу жизни, особенно характерное для Пастырских посланий.
- source_word: πίστιν
  choice: вере
  rationale: Основное и богословски открытое соответствие; контекст перечня добродетелей допускает также «верность» или «доверие», что отмечено в сноске.
- source_word: ἀγάπην
  choice: любви
  rationale: Прямое, естественное и общепринятое соответствие.
- source_word: ὑπομονήν
  choice: стойкости
  rationale: Выражает продолжительную твёрдость и выдержку под давлением лучше, чем более узкое «терпение».
- source_word: πραϋπαθίαν
  choice: кротости
  rationale: Редкое слово сочетает мягкость нрава с терпеливой сдержанностью; «кротость» сохраняет его нравственную силу, а более развёрнутые варианты приведены в примечании.
theological_decisions:
- issue: Обращение ὦ ἄνθρωπε θεοῦ
  choice: человек Божий
  alternative: Божий человек
  rationale: Форма обращена непосредственно к Тимофею и сохраняет традиционный библейский титул без добавления конфессиональных оттенков.
- issue: Смысл δικαιοσύνη в перечне добродетелей
  choice: праведность
  alternative: справедливость
  rationale: Контекст допускает широкий нравственно-реляционный смысл; основной текст следует обычному значению «праведность», не исключая оттенка справедливости.
- issue: Смысл πίστις в перечне добродетелей
  choice: вера
  alternative: верность или доверие
  rationale: Греческое слово может здесь обозначать как веру или доверие, так и надёжную верность; неоднозначность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Парные выражения «убегай… а стремись» сохраняют риторический контраст оригинала; перечень дан плавно и без архаической тяжеловесности.
