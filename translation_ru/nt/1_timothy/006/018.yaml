  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοεργεῖν
  choice: делать добро
  rationale: Инфинитив продолжает содержание наставления. «Делать добро» естественно звучит по-русски и сохраняет глагольный характер выражения, не сводя его только к отдельным поступкам.
- source_word: πλουτεῖν
  choice: богатеть
  rationale: Глагол передаёт образ богатства и намеренно перекликается с материальным богатством в контексте. «Богатеть» сохраняет динамическую глагольную форму и метафору оригинала.
- source_word: ἐν ἔργοις καλοῖς
  choice: добрыми делами
  rationale: Творительный падеж естественно выражает по-русски то, в чём должно состоять богатство. «Добрые дела» — ясное и устоявшееся соответствие выражению ἔργα καλά.
- source_word: εὐμεταδότους
  choice: щедрыми
  rationale: Прилагательное обозначает готовность давать другим и делиться своим имуществом. «Щедрыми» кратко и естественно передаёт эту черту.
- source_word: κοινωνικούς
  choice: готовыми делиться
  rationale: Слово описывает расположенность делиться и участвовать в нуждах других. Этот перевод сохраняет смысловую связь с κοινωνία и избегает неуместных современных оттенков слова «общественный».
- source_word: εὐμεταδότους εἶναι, κοινωνικούς
  choice: быть щедрыми, готовыми делиться
  rationale: 'Два близких, но не полностью тождественных определения сохранены: первое подчёркивает щедрость в даянии, второе — устойчивую готовность делиться.'
