id: 1TI.6.16
reference: 1 Timothy 6:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: ru
  text: Он один обладает бессмертием и обитает в неприступном свете. Его никто из людей[a] не видел и видеть не может. Ему — честь и вечное владычество[b]. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни один человек».'
    reason: lexical_alternative
  - marker: b
    text: Некоторые понимают это описание и славословие как относящиеся более непосредственно к Господу Иисусу Мессии в более широком контексте, хотя слова о невидимости естественнее всего указывают на Бога.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ μόνος ἔχων ἀθανασίαν
  choice: Он один обладает бессмертием
  rationale: Передаёт исключительность μόνος и значение ἔχων ἀθανασίαν естественным современным русским языком, не ослабляя утверждения о присущем Ему бессмертии.
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: обитает в неприступном свете
  rationale: Сохраняет образ постоянного пребывания и точный смысл ἀπρόσιτον — света, к которому невозможно приблизиться.
- source_word: οὐδεὶς ἀνθρώπων
  choice: никто из людей
  rationale: Естественно передаёт партитивную конструкцию и ясно охватывает всё человечество без ненужной гендерной двусмысленности в современном русском языке.
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: и видеть не может
  rationale: Сохраняет выраженную глаголом δύναται невозможность видеть, а не только отсутствие такого опыта в прошлом.
- source_word: τιμὴ καὶ κράτος αἰώνιον
  choice: честь и вечное владычество
  rationale: «Владычество» передаёт κράτος как действенную верховную власть в славословии, а не просто отвлечённую силу.
- source_word: ἀμήν
  choice: Аминь
  rationale: Сохранена традиционная и общепонятная русская передача литургического утверждения.
theological_decisions:
- issue: К кому относятся описания и славословие
  choice: Основной текст сохраняет единый референт и соотносит местоимения с Богом, описанным в ближайшем контексте как блаженный и единый Владыка.
  alternative: Некоторые относят эти слова более непосредственно к Господу Иисусу Мессии ввиду синтаксиса и более широкого контекста.
  rationale: Фраза о Том, Кого никто из людей не видел и видеть не может, естественнее всего указывает на Бога; при этом сноска сохраняет реальную контекстуальную неоднозначность и не разрешает её догматически.
- issue: Передача ἀνθρώπων
  choice: «людей»
  alternative: «ни один человек»
  rationale: В данном контексте ἄνθρωποι обозначает человечество в целом; «людей» точно и естественно передаёт этот смысл по-русски.
translation_notes:
  register: Современный литературный русский язык с достоинством славословия. Короткие предложения делают сложную греческую конструкцию ясной, сохраняя её смысловую последовательность. Тире в формуле «Ему — честь» естественно передаёт безглагольное славословие.
