source:
  edition: SBLGNT
  text: τετύφωται, μηδὲν ἐπιστάμενος, ἀλλὰ νοσῶν περὶ ζητήσεις καὶ λογομαχίας, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/004.yaml
  text: he is puffed up[a], understanding nothing, but sick with a craving for controversies and word-battles, from which come envy, strife, slanders, and evil suspicions[c][b],
translation:
  language: ru
  text: тот надменен[a] и ничего не понимает, но болен страстью к спорам и препирательствам о словах[b], от которых рождаются зависть, раздоры, злословия[c] и злые подозрения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возгордился». Греческое слово буквально вызывает образ человека, раздувшегося от гордости.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «словесным распрям»; возможно также: «спорам о значении слов».'
    reason: lexical_alternative
  - marker: c
    text: Здесь речь, вероятно, идёт об оскорбительной или порочащей речи против людей; в других контекстах то же греческое слово может означать «богохульства».
    reason: lexical_alternative
lexical_decisions:
- source_word: τετύφωται
  choice: надменен
  rationale: Перфект передаёт устойчивое состояние самомнения. «Надменен» естественно звучит по-русски; буквальный образ раздутости пояснён в сноске.
- source_word: μηδὲν ἐπιστάμενος
  choice: ничего не понимает
  rationale: Передаёт отсутствие подлинного понимания, а не только незнание отдельных сведений.
- source_word: νοσῶν
  choice: болен страстью
  rationale: Сохраняет метафору болезни и одновременно ясно выражает нездоровое пристрастие.
- source_word: περὶ ζητήσεις
  choice: к спорам
  rationale: В данном контексте ζητήσεις обозначает спорные, вызывающие распри обсуждения; краткое русское «споры» естественно сочетается с выражением «болен страстью».
- source_word: λογομαχίας
  choice: препирательствам о словах
  rationale: Передаёт как предмет — слова, так и конфликтный характер составного греческого слова.
- source_word: ἐξ ὧν γίνεται
  choice: от которых рождаются
  rationale: Ясно обозначает перечисленные пороки как следствие споров и словесных препирательств.
- source_word: φθόνος
  choice: зависть
  rationale: Точно передаёт недоброжелательное чувство к чужому благу или преимуществу.
- source_word: ἔρις
  choice: раздоры
  rationale: Передаёт разлад и конфликт; множественное число естественно в русском перечне последствий.
- source_word: βλασφημίαι
  choice: злословия
  rationale: В межличностном контексте речь, вероятнее всего, идёт об оскорбительной или порочащей речи, хотя слово может означать и богохульство.
- source_word: ὑπόνοιαι πονηραί
  choice: злые подозрения
  rationale: Прямо и естественно передаёт морально дурные подозрения или домыслы.
theological_decisions:
- issue: Объект βλασφημίαι
  choice: злословия
  alternative: богохульства
  rationale: Перечень последствий споров указывает прежде всего на оскорбительную речь против людей, но более широкое значение греческого слова сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык, доступный широкой аудитории. Синтаксис сохраняет резкое обличительное движение греческой фразы; образ болезни удержан без тяжеловесной буквальности. Начальное «тот» связывает стих с условным описанием человека в предыдущем стихе.
