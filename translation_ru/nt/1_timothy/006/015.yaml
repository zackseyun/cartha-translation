  text: которое в Свои сроки явит блаженный и единственный Владыка — Царь тех, кто царствует, и Господь тех, кто властвует[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный перевод: «Царь царей и Господь господ». В греческом тексте употреблены причастия; буквально: «Царь тех, кто царствует, и Господь тех, кто властвует».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: которое
  rationale: Относительное местоимение женского рода в греческом относится к ἐπιφάνειαν («явление») в ст. 14; в русском согласуется со словом «явление» в среднем роде.
- source_word: καιροῖς ἰδίοις
  choice: в назначенные Им сроки
  rationale: Множественное число καιροῖς сохранено словом «сроки»; оборот передаёт времена, принадлежащие распоряжению действующего лица, без неестественного русского выражения «в Свои времена».
- source_word: δείξει
  choice: явит
  rationale: Будущее время δείκνυμι означает, что явление будет открыто показано; «явит» естественно сочетается с «явлением» и сохраняет конкретную силу глагола.
- source_word: ὁ μακάριος καὶ μόνος δυνάστης
  choice: блаженный и единственный Владыка
  rationale: «Блаженный» сохраняет возвышенный титульный смысл μακάριος, а «Владыка» передаёт δυνάστης как носителя верховной власти.
- source_word: ὁ βασιλεὺς τῶν βασιλευόντων
  choice: Царь царствующих
  rationale: Причастие βασιλευόντων передано причастием «царствующих», а не сглажено до традиционного «царей».
- source_word: κύριος τῶν κυριευόντων
  choice: Господь властвующих
  rationale: «Господь» передаёт титул κύριος, а «властвующих» сохраняет глагольную силу причастия κυριευόντων.
theological_decisions:
- issue: Кто явит явление Иисуса Христа
  choice: Субъект не назван добавленным именем, а обозначен титулами самого стиха.
  alternative: 'Прямо уточнить: «Бог Отец явит».'
  rationale: Греческий текст не даёт здесь имени, поэтому перевод не разрешает за читателя контекстуальный и богословский вопрос.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной титулатурой. Синтаксис продолжает предложение из ст. 14; прописные буквы в местоимении «Им» и божественных титулах соответствуют принятому русскому библейскому регистру.
