source:
  edition: SBLGNT
  text: ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: ru
  text: Ибо любовь к деньгам — корень всевозможных зол[a]. Стремясь к деньгам, некоторые сбились с пути веры[b] и пронзили себя многими муками[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный традиционный перевод: «любовь к деньгам — корень всего зла». Греческий текст естественно допускает смысл «корень всевозможных зол», не утверждая, что у всякого зла только одна причина.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «были уведены от веры». Здесь под верой, вероятно, подразумевается христианская вера как исповедуемая истина, хотя возможен и оттенок личного доверия Богу.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «пронзили себя многими страданиями (скорбями)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: корень
  rationale: Русский язык не имеет артикля, поэтому «корень» естественно передаёт образ источника, не утверждая прямо, что это единственный корень всех зол.
- source_word: πάντων τῶν κακῶν
  choice: всевозможных зол
  rationale: Формулировка передаёт широкий, распределительный смысл множественного числа и не создаёт впечатления, будто всякое зло без исключения имеет лишь одну причину.
- source_word: φιλαργυρία
  choice: любовь к деньгам
  rationale: Прозрачно передаёт значение сложного существительного — любовь к серебру, то есть к деньгам, — и точнее по объёму, чем более широкое «алчность».
- source_word: ἧς τινες ὀρεγόμενοι
  choice: погнавшись за деньгами
  rationale: Греческое выражение буквально связывает сильное стремление с «любовью к деньгам», но по-русски стремятся не к любви как таковой, а к деньгам; выбранная формулировка естественно передаёт настойчивое желание и сохраняет связь с предыдущей мыслью.
- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: уклонились от веры
  rationale: Передаёт удаление от прежнего положения и допускает как оттенок заблуждения, так и добровольного уклонения, не перегружая текст толкованием пассивной формы.
- source_word: περιέπειραν
  choice: пронзили себя
  rationale: Сохраняет яркий образ греческого глагола — проколоть или пронзить насквозь — и возвратное значение ἑαυτούς.
- source_word: ὀδύναις πολλαῖς
  choice: множеством мук
  rationale: «Муки» охватывают сильную боль, страдание и душевную скорбь, соответствуя широкому значению ὀδύνη.
theological_decisions:
- issue: Объём утверждения о любви к деньгам и зле
  choice: Любовь к деньгам названа корнем всевозможных зол, без утверждения, что она является единственной причиной всякого зла.
  alternative: «Любовь к деньгам — корень всего зла».
  rationale: Отсутствие артикля при ῥίζα и множественное πάντων τῶν κακῶν позволяют и в данном контексте поддерживают неисключительное понимание; русская формулировка сохраняет это, не добавляя явно «один из».
- issue: Значение τῆς πίστεως
  choice: Оставлено «от веры», что в контексте может обозначать прежде всего христианскую веру как исповедуемую истину.
  alternative: Личная вера или доверие Богу.
  rationale: Артикль и употребление в Пастырских посланиях поддерживают объективный смысл «христианская вера», однако само слово допускает личностный оттенок, поэтому основной текст не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены образ корня и резкая метафора самопричинённого пронзения; архаичные «сребролюбие» и «ввергли себя» не использованы.
