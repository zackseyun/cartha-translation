base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/021.yaml
  text: By professing it[a], some have missed the mark concerning the faith[c][b]. Grace be with you.
translation:
  language: ru
  text: Некоторые, претендуя на это знание, сбились с пути в вопросах веры.[a] Благодать да будет с вами.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч.: «которое некоторые, исповедуя или на которое притязая, сбились с пути в отношении веры». Относительное местоимение относится к «знанию» в предыдущем стихе. Глагол буквально означает «не попасть в цель»; возможны также переводы: «ошиблись», «уклонились». Под «верой», вероятнее всего, имеется в виду христианская вера, хотя возможно и понимание личной веры.'
    reason: lexical_alternative
  - marker: b
    text: '«С вами» в греческом тексте стоит во множественном числе. В части рукописей: «с тобой».'
    reason: textual_variant
lexical_decisions:
- source_word: ἥν
  choice: ею
  rationale: Относительное местоимение женского рода отсылает к «знанию» из предыдущего стиха. Русская конструкция сохраняет эту связь посредством местоимения «ею».
- source_word: ἐπαγγελλόμενοι
  choice: заявляя, что обладают
  rationale: В данном контексте средний залог выражает притязание на обладание так называемым знанием, а не обещание. Развёрнутая формулировка естественна по-русски и ясно передаёт объект притязания.
- source_word: ἠστόχησαν
  choice: уклонились
  rationale: Глагол означает не попасть в цель, а переносно — отклониться или сбиться. «Уклонились» естественно передаёт смысл в контексте веры; образ промаха отмечен в сноске.
- source_word: περὶ τὴν πίστιν
  choice: от веры
  rationale: Хотя περί с винительным обозначает отношение к чему-либо, при русском глаголе «уклонились» конструкция «от веры» наиболее естественно передаёт мысль об отклонении в вопросах веры.
- source_word: Ἡ χάρις
  choice: Благодать
  rationale: В заключительном благословении артикль по-русски не передаётся; «Благодать» сохраняет краткость и достоинство формулы.
- source_word: μεθ’ ὑμῶν
  choice: да будет с вами
  rationale: Глагол-связка подразумевается и естественно восполняется в русском благословении. «С вами» сохраняет множественное число местоимения.
theological_decisions:
- issue: Значение выражения «вера»
  choice: Христианская вера как исповедуемое учение и образ верности ему
  alternative: Личная вера или доверие человека
  rationale: Контекст предостережения о ложно именуемом знании и словоупотребление Пастырских посланий поддерживают объективное значение, однако артикль сам по себе не устраняет полностью возможность более личного смысла; неоднозначность отмечена в сноске.
- issue: Адресаты заключительного благословения
  choice: Множественное число «с вами»
  alternative: Единственное число «с тобой», обращённое только к Тимофею
  rationale: Основной текст SBLGNT читает ὑμῶν, то есть множественное число, что может распространять благословение на общину. Рукописный вариант с единственным числом указан в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным эпистолярным завершением. Формулировка «заявляя, что обладают ею» избегает тяжеловесного буквального синтаксиса, сохраняя явную отсылку к «знанию» из предыдущего стиха. Богословская и текстологическая неоднозначность вынесена в сноски без конфессионального уточнения.
