  source_fidelity: 'Смысл в целом передан верно: повеление хранить вверенное, избегая пустой и не соответствующей священному речи и «противоречий» ложно именуемого знания. Однако «чуждых святыне» звучит неестественно и несколько конкретизирует βεβήλους через образ «святыни», которого в греческом нет. Кроме того, в исходнике определение βεβήλους грамматически может охватывать и «противоречия», что лучше отразить в русском.'
