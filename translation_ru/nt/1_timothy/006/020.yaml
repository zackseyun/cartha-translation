  text: Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/020.yaml
  text: O Timothy[a], guard the deposit entrusted to you[b], turning away from the profane empty talk and contradictions of what is falsely called knowledge.
translation:
  language: ru
  text: Тимофей! Храни вверенное тебе, уклоняясь от нечестивых пустых речей и противоречий[a] ложно называемого знания[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «противопоставлений».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «так называемого знания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: Тимофей!
  rationale: Прямое восклицательное обращение естественно передаёт усиленный греческой частицей Ὦ торжественный и настойчивый тон, не вводя архаичное для современной речи «о».
- source_word: παραθήκην
  choice: вверенное тебе
  rationale: Существительное обозначает то, что передано кому-либо на сохранение. Субстантивированная конструкция сохраняет неопределённость содержания и звучит по-русски естественнее, чем буквальное «вклад» или «залог».
- source_word: φύλαξον
  choice: храни
  rationale: Передаёт требование бдительно оберегать полученное на сохранение и сохраняет краткость повеления.
- source_word: ἐκτρεπόμενος
  choice: уклоняясь от
  rationale: Сохраняет образ сознательного отвращения в сторону и естественно связывается с главным повелением.
- source_word: βεβήλους
  choice: чуждых святыне
  rationale: Передаёт противопоставление несвященного и святого ясным современным выражением, не усиливая значение до прямого утверждения о безбожии.
- source_word: κενοφωνίας
  choice: пустых речей
  rationale: Передаёт образ лишённой содержания речи без излишне разговорного оттенка слов «болтовня» или «пустая трескотня».
- source_word: ἀντιθέσεις
  choice: противоречий
  rationale: Передаёт полемический смысл противопоставленных утверждений; более широкое «противопоставлений» сохранено в сноске.
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: ложно называемого знания
  rationale: Прямо показывает, что автор отрицает правомерность названия «знание», и сохраняет родительную связь греческой фразы.
theological_decisions:
- issue: Содержание παραθήκη
  choice: Передано обобщённо как «вверенное тебе» без уточнения содержания.
  alternative: «Евангелие», «апостольское учение» или «порученное служение».
  rationale: Контекст позволяет связывать вверенное с апостольской вестью, однако сам стих не называет его содержание; перевод сохраняет эту содержательную открытость.
- issue: Оценка знания в выражении ψευδωνύμου γνώσεως
  choice: «ложно называемого знания» — название «знание» представлено как неправомерное.
  alternative: «так называемого знания».
  rationale: Основной вариант яснее передаёт отрицательную оценку компонента ψευδώνυμος, тогда как более идиоматичный, но несколько менее явный вариант дан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством прямого апостольского обращения. Формулировка избегает как разговорной сниженности, так и излишней церковнославянской архаики; метафора вверенного на хранение передана естественно, без догматического уточнения её содержания.
