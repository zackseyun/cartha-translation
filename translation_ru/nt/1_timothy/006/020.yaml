  terminology: «Вверенное тебе» удачно сохраняет неопределённость παραθήκη. «Ложно называемого знания» точно передаёт ψευδωνύμου γνώσεως; вариант «так называемого знания» уместен в сноске. «Противоречий» возможен для ἀντιθέσεις, при сохранении «противопоставлений» как альтернативы.
