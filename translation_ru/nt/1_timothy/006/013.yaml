  text: παραγγέλλω σοι ἐνώπιον τοῦ θεοῦ τοῦ ⸀ζῳογονοῦντος τὰ πάντα καὶ Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/013.yaml
  text: I charge you before God[a], who gives life to all things, and Messiah Jesus, who testified to the good confession before Pontius Pilate[c][b],
translation:
  language: ru
  text: Повелеваю тебе перед Богом[a], дающим жизнь всему, и перед Мессией Иисусом[b], засвидетельствовавшим доброе исповедание перед Понтием Пилатом[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поддерживающим жизнь всего»; возможно также: «оживляющим всё». Греческое слово может указывать как на дарование жизни, так и на её сохранение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Христом Иисусом». Греческое Χριστός — титул со значением «Мессия».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «при Понтии Пилате». Греческое выражение может обозначать как присутствие Пилата, так и время его правления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλω σοι
  choice: Повелеваю тебе
  rationale: Глагол выражает торжественное и обязательное повеление; «повелеваю» сохраняет его силу и соответствует контексту обращения перед Богом и Мессией.
- source_word: ἐνώπιον
  choice: перед
  rationale: Кратко и естественно передаёт смысл нахождения в присутствии Бога и Мессии как свидетелей торжественного повеления.
- source_word: τοῦ θεοῦ τοῦ ζῳογονοῦντος τὰ πάντα
  choice: Богом, дающим жизнь всему
  rationale: Передаёт всеохватность τὰ πάντα и широкий смысл причастия ζῳογονοῦντος, не ограничивая его только первоначальным дарованием жизни или её сохранением.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Мессией Иисусом
  rationale: Χριστός здесь сохраняет силу титула; «Мессия» раскрывает его значение для современного читателя, хотя традиционное «Христос Иисус» возможно.
- source_word: μαρτυρήσαντος
  choice: засвидетельствовавшим
  rationale: Сохраняет значение публичного свидетельства и судебный оттенок, уместный в связи с Понтием Пилатом.
- source_word: τὴν καλὴν ὁμολογίαν
  choice: доброе исповедание
  rationale: «Исповедание» передаёт публичное признание или заявление, а «доброе» сохраняет повторяющуюся в контексте характеристику καλός без пояснительного перефразирования.
- source_word: ἐπὶ Ποντίου Πιλάτου
  choice: перед Понтием Пилатом
  rationale: В сочетании с глаголом свидетельства наиболее естественно указывает на исповедание в присутствии Пилата; временное значение предлога остаётся возможным и отмечено в сноске.
theological_decisions:
- issue: Значение ζῳογονοῦντος
  choice: дающим жизнь всему
  alternative: сохраняющим всё живым; оживляющим всё
  rationale: Греческое причастие допускает как наделение жизнью, так и сохранение жизни. Основной текст оставляет формулировку достаточно широкой, а варианты вынесены в сноску.
- issue: Передача титула Χριστός
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: Выбран смысловой перевод титула, подчёркивающий мессианское достоинство Иисуса; традиционная русская форма сохранена в сноске.
- issue: Значение ἐπὶ Ποντίου Πιλάτου
  choice: перед Понтием Пилатом
  alternative: при Понтии Пилате
  rationale: Контекст свидетельства поддерживает значение личного присутствия Пилата, однако конструкция с ἐπί и родительным падежом может также обозначать время или правление.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. «Повелеваю» сохраняет вес апостольского поручения; причастные обороты отражают структуру греческого текста. Конечная запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
