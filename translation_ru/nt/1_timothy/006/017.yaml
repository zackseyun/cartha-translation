id: 1TI.6.17
reference: 1 Timothy 6:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλ’ ⸀ἐπὶ ⸀θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/017.yaml
  text: Command those who are rich in the present age not to be arrogant[a], nor to set their hope on the uncertainty of riches, but on God[b], who richly provides us with everything for enjoyment.
translation:
  language: ru
  text: Тем, кто богат в нынешнем веке[a], повелевай не превозноситься и не возлагать надежды на ненадёжное богатство[b], а надеяться на Бога, в изобилии дающего нам всё для наслаждения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в нынешнем мире». Греческое слово может означать «век», а в расширенном смысле — существующий мировой порядок; «век» лучше сохраняет временной контраст.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «на неопределённость богатства»; по смыслу: на богатство, которое непрочно и не даёт уверенности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς πλουσίοις
  choice: Тем, кто богат
  rationale: Субстантивированное сочетание в дательном падеже обозначает адресатов повеления; эта формулировка естественна по-русски и не превращает богатство в исчерпывающий ярлык.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: в нынешнем веке
  rationale: «Век» сохраняет временной и эсхатологический оттенок αἰών, тогда как «мир» мог бы быть понят как материальное творение.
- source_word: παράγγελλε
  choice: повелевай
  rationale: Императив выражает властное, обязательное наставление; «повелевай» передаёт эту силу в достойном литературном регистре.
- source_word: μὴ ὑψηλοφρονεῖν
  choice: не превозноситься
  rationale: Глагол означает высокомерие, гордое мнение о себе; «не превозноситься» ясно и естественно передаёт нравственный смысл.
- source_word: μηδὲ ἠλπικέναι
  choice: не возлагать надежды
  rationale: Перфектный инфинитив указывает на устойчиво избранный предмет упования; русское сочетание передаёт не разовое ожидание, а направленность надежды.
- source_word: ἐπὶ πλούτου ἀδηλότητι
  choice: на ненадёжное богатство
  rationale: ἀδηλότης характеризует богатство как нечто неопределённое и непрочное. Такая формулировка естественнее буквального «на неопределённость богатства» и сохраняет смысл.
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: а надеяться на Бога
  rationale: В греческом тексте глагол подразумевается из предыдущей части. Его повтор делает противопоставление ясным и грамматически естественным по-русски, не добавляя нового смысла.
- source_word: τῷ παρέχοντι ἡμῖν
  choice: дающего нам
  rationale: Причастный оборот непосредственно характеризует Бога как того, кто предоставляет дары.
- source_word: πάντα
  choice: всё
  rationale: Сохраняется широкий, ничем в самом тексте не ограниченный охват; перевод не сужает его до одних необходимых вещей.
- source_word: πλουσίως
  choice: в изобилии
  rationale: Передаёт щедрость и полноту Божьего дара; буквальное «богато дающего» в современном русском звучит менее естественно.
- source_word: εἰς ἀπόλαυσιν
  choice: для наслаждения
  rationale: Сочетание передаёт цель или предназначение предоставляемого Богом; формулировка лаконична и не ослабляет положительный смысл ἀπόλαυσις.
theological_decisions:
- issue: Значение αἰών в этико-эсхатологическом контексте
  choice: нынешний век
  alternative: нынешний мир
  rationale: «Век» сохраняет характерное для Павла противопоставление нынешней эпохи иной грядущей реальности и не создаёт впечатления, будто богатство относится лишь к физическому миру.
- issue: Объём Божьего дара в πάντα
  choice: всё
  alternative: всё необходимое
  rationale: Греческий текст выражается широко и не ограничивает Божье обеспечение необходимым минимумом. Перевод сохраняет эту широту, не превращая её при этом в утверждение о гарантированном материальном процветании.
- issue: Положительный смысл εἰς ἀπόλαυσιν
  choice: для наслаждения
  alternative: для пользования
  rationale: Текст допускает и прямо выражает радость от Божьих даров; нейтральное «пользование» неоправданно ослабило бы этот смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Повелевай» сохраняет властную силу наставления, а синтаксически добавленное «надеяться» ясно оформляет подразумеваемый в греческом тексте глагол. Все примечания поставлены непосредственно после относящихся к ним выражений.
