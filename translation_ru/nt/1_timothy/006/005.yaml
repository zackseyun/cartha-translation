base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/005.yaml
  text: constant friction among people whose minds are corrupted and who have been deprived of the truth[b][a], imagining that godliness is a means of gain.
translation:
  language: ru
  text: постоянные трения[a] между людьми с испорченным умом, лишёнными истины и считающими благочестие средством получения выгоды[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «постоянные распри», «бесконечные препирательства». Греческое слово рисует образ непрекращающегося взаимного трения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «считая благочестие прибылью» или «источником выгоды». Смысл в том, что благочестие рассматривают как способ получить выгоду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπαρατριβαὶ
  choice: постоянные трения
  rationale: Редкое существительное обозначает непрекращающееся взаимное трение, а переносно — постоянные столкновения и споры. Русское «постоянные трения» сохраняет образ и естественно звучит в современном литературном языке.
- source_word: διεφθαρμένων … τὸν νοῦν
  choice: с испорченным умом
  rationale: Перфектное страдательное причастие описывает устойчивое состояние как результат порчи. Формулировка сохраняет нравственно-познавательный смысл νοῦς, не усиливая его до «развращённого» или «порочного» ума.
- source_word: ἀπεστερημένων τῆς ἀληθείας
  choice: лишённых истины
  rationale: Страдательная форма и результирующее состояние переданы кратко и буквально; определённость τῆς ἀληθείας естественно выражается по-русски словом «истины» без артикля.
- source_word: νομιζόντων
  choice: считающих
  rationale: Причастие вводит ошибочное убеждение этих людей. «Считающих» естественно связывается с предикативной конструкцией и не добавляет отсутствующей в самом глаголе эмоциональной окраски.
- source_word: πορισμὸν
  choice: средством наживы
  rationale: πορισμός может обозначать прибыль либо средство её получения. «Средство наживы» передаёт инструментальное отношение к благочестию и отрицательную оценку контекста, не ограничивая речь строго определённым способом обогащения.
- source_word: εὐσέβειαν
  choice: благочестие
  rationale: В Пастырских посланиях слово обозначает почтительную, обращённую к Богу жизнь. «Благочестие» — устоявшийся и точный русский эквивалент; порочным здесь является не само благочестие, а стремление использовать его ради выгоды.
theological_decisions:
- issue: Следует ли передавать εὐσέβεια как истинное благочестие или как внешнюю религиозность
  choice: «благочестие» — положительное по смыслу понятие, которое эти люди пытаются использовать
  alternative: «религия» или «набожность» с оттенком одной лишь внешней практики
  rationale: Греческое слово само по себе имеет положительный смысл. Осуждается инструментальное отношение к нему, выраженное сочетанием со «средством наживы».
- issue: Насколько сильно выражать нравственное состояние διεφθαρμένων
  choice: «с испорченным умом»
  alternative: «с развращённым умом» или «порочных умом»
  rationale: Так сохраняется резкое осуждение и результирующее состояние, но не вносится более сильная богословская или нравственно-психологическая характеристика, чем требует греческий текст.
- issue: Кем или чем люди были лишены истины
  choice: Сохранена страдательная и неуточнённая формулировка «лишённых истины»
  alternative: Уточнить, что они сами отвергли или утратили истину
  rationale: Греческий текст не называет деятеля и не объясняет механизм утраты; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизации. Синтаксически сохранён зависимый фрагмент перечисления из ближайшего контекста. Причастная цепочка отражает структуру греческого текста, оставаясь понятной по-русски; все сноски поставлены непосредственно после относящихся к ним выражений.
