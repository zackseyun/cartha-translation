id: 1TI.6.3
reference: 1 Timothy 6:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ’ εὐσέβειαν διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/003.yaml
  text: If anyone teaches a different doctrine and does not agree with sound words[a], those of our Lord Jesus the Messiah, and with the teaching that accords with godliness[b],
translation:
  language: ru
  text: Если кто учит иному и не держится здравых слов нашего Господа Иисуса Мессии[a] и учения, соответствующего благочестию[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в традиционной передаче титула: «Иисуса Христа».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный смысл: «учения, ведущего к благочестию».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτεροδιδασκαλεῖ
  choice: учит иному
  rationale: Передаёт идею иного учения по отношению к принятому, не добавляя прямо отсутствующего в глаголе определения «ложному».
- source_word: προσέρχεται
  choice: держится
  rationale: В сочетании с дательным падежом глагол означает принятие учения и приверженность ему; «держится» естественно передаёт этот смысл, не сводя его лишь к интеллектуальному согласию.
- source_word: ὑγιαίνουσι λόγοις
  choice: здравых слов
  rationale: Сохраняет метафору здоровья в ὑγιαίνω и прямое значение λόγοις, оставаясь понятным в современном русском библейском регистре.
- source_word: τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: слов нашего Господа Иисуса Мессии
  rationale: Родительный оборот связывает здравые слова с Иисусом как их источником или обладателем; повтор слова в русском делает синтаксическую связь ясной.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Передаёт смысл титула Χριστός, а не только его традиционную транслитерацию.
- source_word: κατ’ εὐσέβειαν
  choice: соответствующего благочестию
  rationale: Передаёт соответствие или согласованность учения с благочестием, не уточняя сверх текста, что оно обязательно является причиной благочестия.
- source_word: διδασκαλίᾳ
  choice: учения
  rationale: Здесь слово обозначает содержание наставления; «учение» ясно выражает доктринальный смысл и естественно сочетается с определением.
- source_word: εὐσέβειαν
  choice: благочестию
  rationale: В Пастырских посланиях обозначает почтительную, обращённую к Богу жизнь; «благочестие» сохраняет этот ёмкий смысл и устоявшийся русский регистр.
theological_decisions:
- issue: Передача Χριστοῦ в полном титуле Ἰησοῦ Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: «Мессия» раскрывает титульный смысл греческого Χριστός; традиционная форма «Христос» сохранена в сноске.
- issue: Связь учения с εὐσέβεια в обороте κατ’ εὐσέβειαν
  choice: соответствующего благочестию
  alternative: ведущего к благочестию
  rationale: Основной вариант сохраняет выраженное κατά соответствие, не превращая его без необходимости в однозначную причинно-целевую связь.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка сохраняет незавершённость условного придаточного, поскольку стих продолжается в следующем предложении.
