  text: Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι, τοὺς ἰδίους δεσπότας πάσης τιμῆς ἀξίους ἡγείσθωσαν, ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/001.yaml
  text: All who are servants under a yoke should regard their own masters as worthy of all honor[c][b][a], so that the name of God and the teaching may not be slandered.
translation:
  language: ru
  text: Все рабы, находящиеся под ярмом, пусть считают своих господ достойными всяческого почтения, чтобы имя Бога и учение не были хулимы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы имя Бога и учение не были опорочены»; греческий глагол может обозначать хулу, поношение или злословие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι ὑπὸ ζυγόν
  choice: кто несёт рабство как ярмо
  rationale: Передаёт и рабский статус, и образ ярма естественным современным русским языком, не смягчая явно обозначенную подневольность.
- source_word: τοὺς ἰδίους δεσπότας
  choice: своих господ
  rationale: «Своих» сохраняет ἰδίους, а «господ» обозначает лиц, обладавших властью над рабами; слово не следует понимать здесь как обращение к Богу.
- source_word: πάσης τιμῆς ἀξίους
  choice: достойными всяческого почтения
  rationale: Сохраняет полноту πάσης и выражает τιμή как уважение и почёт без искусственно буквального оборота.
- source_word: ἡγείσθωσαν
  choice: пусть считают
  rationale: Передаёт повелительное наклонение и требуемую устойчивую оценку.
- source_word: ἡ διδασκαλία
  choice: учение
  rationale: Обычное и достаточно широкое русское соответствие, не ограничивающее смысл позднейшим техническим понятием доктрины.
- source_word: βλασφημῆται
  choice: не подвергались хуле
  rationale: Глагол относится одновременно к имени Бога и к учению; «подвергаться хуле» естественно сочетается с обоими объектами и сохраняет религиозно-нравственную силу выражения.
theological_decisions:
- issue: Передача социального положения δοῦλοι
  choice: явно назвать рабство и сохранить метафору ярма
  alternative: «рабы под ярмом» или смягчённое «слуги»
  rationale: Контекст недвусмысленно говорит о рабской зависимости. Формулировка описывает предполагаемую текстом социальную реальность, но сама по себе не утверждает её нравственного одобрения.
- issue: Значение βλασφημῆται
  choice: «подвергались хуле»
  alternative: «были опорочены» или «подвергались богохульству»
  rationale: «Богохульство» плохо сочетается с учением, а «опорочены» слабее передаёт резкость греческого глагола. Выбранный вариант охватывает оба однородных подлежащих.
- issue: Объём выражения πάσης τιμῆς
  choice: «всяческого почтения»
  alternative: «полного почтения»
  rationale: Сохранена всеохватность формулировки без добавления оговорок, которых нет в данном стихе.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Необычная конструкция «несёт рабство как ярмо» выбрана для одновременной передачи фактического рабского положения и метафоры ζυγός; «почтение» и «хула» сохраняют достоинство и смысловую силу исходного текста.
