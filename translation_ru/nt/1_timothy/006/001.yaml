review_pass:
  verdict: revise
  source_fidelity: 'Начальная формулировка «кто несёт рабство как ярмо» не вполне точно передаёт синтаксис и образ оригинала. δοῦλοι — это «рабы», а ὑπὸ ζυγόν описывает их положение: «под ярмом», а не действие «нести рабство». Остальные основные соответствия сохранены: «своих господ», «достойными всяческого почтения», «имя Бога и учение».'
  naturalness: «Все рабы, находящиеся под ярмом» — ясная и литературно приемлемая формулировка с сохранением образа подневольности. «Пусть считают» естественно передаёт повеление. «Не подвергались хуле» возможно, но более плавный вариант «не были хулимы» сохраняет страдательный залог греческого глагола и относится к обоим однородным подлежащим.
  terminology: «Рабы» необходимы ввиду δοῦλοι и уточнения «под ярмом»; «слуги» неоправданно смягчило бы социальный статус. «Господа» точно передаёт δεσπότας в данном социальном контексте. «Учение» хорошо передаёт διδασκαλία без излишней терминологичности. «Хулимы» передаёт βλασφημῆται; с учётом координации с «учением» это шире, чем узкое «богохульству».
