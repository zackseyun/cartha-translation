base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: ru
  text: А те, кто стремится к богатству[a], впадают в искушение, в западню[b] и во множество безрассудных и пагубных желаний, которые погружают людей в гибель и разрушение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хочет быть богатым» или «хочет разбогатеть». Греческое выражение может обозначать как желание быть богатым, так и стремление стать богатым.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ловушку».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι πλουτεῖν
  choice: А те, кто хочет разбогатеть
  rationale: Оборот обозначает устойчивое желание или намерение стать богатым. «Хочет разбогатеть» естественно передаёт направленность стремления, не осуждая само обладание богатством.
- source_word: ἐμπίπτουσιν εἰς πειρασμόν
  choice: впадают в искушение
  rationale: Сохраняется образ попадания в опасное состояние; в контексте нравственного предостережения πειρασμός означает именно искушение, а не нейтральное испытание.
- source_word: παγίδα
  choice: западню
  rationale: «Западня» ясно и образно передаёт ловушку, в которую попадает человек.
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: во множество безрассудных и пагубных желаний
  rationale: «Желания» сохраняет широту ἐπιθυμίαι; «безрассудные» передаёт отсутствие здравого смысла, а «пагубные» — причиняемый ими серьёзный вред.
- source_word: βυθίζουσι
  choice: ввергают
  rationale: Глагол βυθίζω буквально связан с погружением или потоплением. «Ввергают» сохраняет сильное причинное движение к гибельному исходу и звучит естественно в данном контексте.
- source_word: τοὺς ἀνθρώπους
  choice: людей
  rationale: ἄνθρωποι употреблено обобщённо и относится ко всем людям, а не только к мужчинам.
- source_word: ὄλεθρον καὶ ἀπώλειαν
  choice: разорение и гибель
  rationale: Два разных существительных переданы разными русскими словами. «Разорение» выражает опустошительный крах, а «гибель» — конечный разрушительный исход, без искусственного уточнения его масштаба.
theological_decisions:
- issue: Следует ли понимать ὄλεθρον καὶ ἀπώλειαν как прямое указание именно на вечное осуждение
  choice: «разорение и гибель» без уточнения, что речь обязательно идёт о вечном осуждении
  alternative: «погибель и вечное осуждение» либо иная формулировка, прямо задающая эсхатологический смысл
  rationale: Греческие слова выражают крайне тяжёлый разрушительный исход, но сам стих не определяет его исключительно как вечное осуждение. Перевод сохраняет серьёзность и богословскую напряжённость текста, не сужая смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксический ряд сохранён, но оформлен естественными для русского языка повторяющимися предлогами. Образность «впадают» и «ввергают» передаёт нарастающее движение от искушения к гибельному исходу.
