  text: ἔχοντες δὲ διατροφὰς καὶ σκεπάσματα, τούτοις ἀρκεσθησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/008.yaml
  text: But if we have food and covering[a], we will be content with these.
translation:
  language: ru
  text: Но если у нас есть пища и то, чем укрыться[a], будем этим довольны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одежда»; греческое слово имеет более широкое значение — то, что покрывает или укрывает человека, и, возможно, включает также кров.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: если у нас есть
  rationale: Причастие задаёт обстоятельство для главного глагола; условная формулировка естественна по-русски и не придаёт обороту чрезмерно сильного причинного значения.
- source_word: δὲ
  choice: но
  rationale: Частица обозначает умеренное противопоставление предыдущей мысли о приобретении и довольстве.
- source_word: διατροφὰς
  choice: пища
  rationale: Слово обозначает средства пропитания, прежде всего пищу; выбран общеупотребительный и точный русский эквивалент.
- source_word: σκεπάσματα
  choice: то, чем укрыться
  rationale: 'Формулировка сохраняет широту греческого слова: речь может идти об одежде и, возможно, также о крове, а не только об одном из них.'
- source_word: τούτοις
  choice: этим
  rationale: Указательное местоимение отсылает к только что названным основным жизненным потребностям.
- source_word: ἀρκεσθησόμεθα
  choice: будем довольны
  rationale: Будущее время изъявительного наклонения передано прямо; значение достаточности и удовлетворённости выражено естественным русским оборотом без превращения фразы в призыв.
theological_decisions:
- issue: Объём значения σκεπάσματα
  choice: широкое обозначение того, чем человек может укрыться
  alternative: только одежда или только жилище
  rationale: Греческое слово допускает более широкий смысл, поэтому перевод не ограничивает учение стиха одной конкретной необходимостью и сохраняет заложенную в тексте смысловую открытость.
translation_notes:
  register: Современный литературный русский язык; формулировка проста и достойна по тону. Оборот «то, чем укрыться» намеренно сохраняет смысловую широту оригинала, хотя несколько менее привычен, чем узкое «одежда».
