base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: ru
  text: Ведь мы ничего не принесли в мир[a] и ничего не можем вынести из него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Ведь мы ничего не принесли в мир, потому что и вынести ничего не можем». Греческий союз может выражать причину («потому что») или вводить соответствующее второе утверждение.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: ничего
  rationale: Естественно передаёт абсолютное отрицание и служит дополнением к глаголу «принесли».
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительно-обосновывающую связь с предыдущей мыслью и естественно звучит по-русски.
- source_word: εἰσηνέγκαμεν
  choice: принесли
  rationale: Точно сохраняет направленность εἰσφέρω — «внести, принести внутрь» — в сочетании «в мир».
- source_word: εἰς τὸν κόσμον
  choice: в мир
  rationale: κόσμος обозначает здесь мир, в который человек приходит при рождении; русское «в мир» естественно сохраняет этот образ.
- source_word: ὅτι
  choice: и
  rationale: Передаёт вторую часть как соответствующее, параллельное утверждение; возможное причинное значение сохранено в сноске.
- source_word: οὐδὲ
  choice: и ничего не
  rationale: В сочетании с неопределённым местоимением и отрицанием естественно выражает мысль, что вынести невозможно ничего.
- source_word: ἐξενεγκεῖν
  choice: вынести
  rationale: Сохраняет направленность ἐκφέρω — «нести наружу» — и образ ухода человека из мира.
- source_word: τι
  choice: ничего
  rationale: Под отрицанием неопределённое τι естественно передаётся русским отрицательным местоимением «ничего».
- source_word: δυνάμεθα
  choice: не можем
  rationale: Современное и точное соответствие значению «не способны, не имеем возможности».
theological_decisions:
- issue: Связь второй части стиха, вводимой ὅτι
  choice: 'Сочинительное продолжение: «и ничего не можем вынести из него»'
  alternative: 'Причинная связь: «потому что и вынести ничего не можем»'
  rationale: 'Контекст и параллелизм поддерживают два уравновешенных утверждения: человек ничего не приносит в мир и ничего из него не уносит. Поскольку ὅτι допускает причинное понимание, эта неоднозначность отмечена в сноске, а не устранена молча.'
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и уравновешенная формулировка. Добавленное «из него» естественно для русского и явно передаёт подразумеваемое направление ἐξ- в глаголе ἐκφέρω.
