revisions:
- from: А те, у кого господа — верующие, пусть не относятся к ним с пренебрежением из-за того, что они братья[a], но, напротив, служат им ещё усерднее, потому что принимающие пользу от их доброго служения — верующие и возлюбленные[b]. Этому учи и это настойчиво внушай.
  to: А те, у кого господа — верующие, пусть не относятся к ним с пренебрежением, потому что они братья; но, напротив, пусть служат им тем более, потому что те, кто пользуется благодеянием, — верующие и возлюбленные[a]. Этому учи и к этому призывай.
  rationale: Заменено добавочное «ещё усерднее» на «тем более», непосредственно передающее μᾶλλον. Из причинного оборота убраны слова «от их доброго служения», которых нет в греческом тексте и которые заранее разрешали спорный референт; вероятное понимание сохранено в сноске. Сноска о «братьях» сохранена с новым якорем после соответствующего слова.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:48:27Z'
review_pass:
  verdict: revise
  source_fidelity: В целом переданы адресаты, запрет на презрение, мотив общего христианского братства и заключительное повеление. Однако «ещё усерднее» вносит отсутствующий в μᾶλλον оттенок усердия; требуется сравнительное усиление («тем более»). Кроме того, добавление «от их доброго служения» чрезмерно эксплицирует спорный оборот οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι и предваряет толкование, которое сноска должна оставлять открытым.
  naturalness: Текст в основном литературный и понятный. «Пусть ... служат ... тем более» естественно передаёт противопоставление двух повелений без добавочного смыслового оттенка. «Пользуются благодеянием» сохраняет лаконичность и синтаксическую неопределённость греческого выражения.
  terminology: «Господа», «верующие», «братья» и «возлюбленные» допустимы и соответствуют регистру. «Благодеяние» удачно передаёт εὐεργεσία без необоснованного уточнения, что это именно доброе служение рабов.
  issues:
  - severity: medium
    issue: «Ещё усерднее» вместо сравнительного усиления
    rationale: μᾶλλον означает «более, тем более», тогда как «усерднее» добавляет значение прилежания, отсутствующее в оригинале.
  - severity: medium
    issue: Экспликация «от их доброго служения» в основном тексте
    rationale: В греческом обороте не названы ни служение, ни его субъект; такое уточнение закрепляет одно из обсуждаемых толкований и сужает сохранённую оригиналом неоднозначность.
