id: 1TI.6.2
reference: 1 Timothy 6:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ δὲ πιστοὺς ἔχοντες δεσπότας μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν· ἀλλὰ μᾶλλον δουλευέτωσαν, ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι. Ταῦτα δίδασκε καὶ παρακάλει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: ru
  text: А те, у кого господа — верующие, пусть не относятся к ним с пренебрежением, потому что они братья; но, напротив, пусть служат им тем более, потому что те, кто пользуется благодеянием, — верующие и возлюбленные[a]. Этому учи и к этому призывай.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий оборот «те, кто пользуется благодеянием» труден для однозначного истолкования. Вероятнее всего, речь идёт о верующих господах, получающих пользу от служения рабов.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς ... δεσπότας
  choice: господа — верующие
  rationale: Прилагательное обозначает господ, верующих во Христа. Конструкция с тире естественна по-русски и не допускает понимания «надёжные господа».
- source_word: δεσπότας
  choice: господа
  rationale: В контексте рабовладельческого домашнего уклада слово обозначает людей, обладающих властью над рабами. «Господа» сохраняет историческую социальную связь; «владыки» звучало бы неуместно возвышенно.
- source_word: καταφρονείτωσαν
  choice: пусть не относятся к ним с пренебрежением
  rationale: Глагол выражает презрительное отношение и неуважение. Эта формулировка естественнее в данном контексте, чем неоднозначное «не презирают их».
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняется грамматически мужская форма греческого текста и раннехристианский смысл духовного родства между верующими.
- source_word: μᾶλλον δουλευέτωσαν
  choice: но, напротив, служат им ещё усерднее
  rationale: δουλεύω описывает службу в положении раба, уже очевидном из упоминания господ; μᾶλλον передано сравнительным усилением «ещё усерднее».
- source_word: πιστοί ... καὶ ἀγαπητοί
  choice: верующие и возлюбленные
  rationale: πιστοί здесь, как и ранее, обозначает верующих во Христа; «возлюбленные» сохраняет характерную для христианской речи смысловую насыщенность ἀγαπητοί.
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: принимающие пользу от их доброго служения
  rationale: Оборот сжат и труден. «Принимающие пользу» передаёт значение участия в благодеянии или получения пользы, а «от их доброго служения» делает русскую связь понятной, не устраняя отмеченную в сноске спорность референта.
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: Этому учи и это настойчиво внушай
  rationale: Оба настоящих императива переданы прямым наставлением. В данном увещательном контексте παρακαλέω означает не просто утешать, а настойчиво призывать и внушать.
theological_decisions:
- issue: Значение ἀδελφοί применительно к верующим господам
  choice: братья
  alternative: братья и сёстры; единоверцы
  rationale: Мужская форма соответствует греческому тексту и конкретным господам, при этом сноска поясняет более широкий христианский смысл родства.
- issue: Терминология рабовладельческого уклада
  choice: господа ... служат
  alternative: хозяева ... служат как рабы
  rationale: Перевод не скрывает властного социального отношения, но и не вводит существительное «рабы», отсутствующее в данном стихе. Глагол «служат» естественно передаёт действие δουλεύω в уже заданном контексте.
- issue: К кому относится οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: принимающие пользу — верующие господа
  alternative: верующие рабы, усердствующие в благодеянии; обе стороны, разделяющие благо
  rationale: Наиболее естественно связать субстантивированное причастие с ближайшими по смыслу господами, получающими пользу от служения. Поскольку греческий оборот допускает споры, сноска прямо сохраняет эту трудность.
translation_notes:
  register: Современный литературный русский язык с достойным наставительным тоном. Историческая социальная реальность сохранена без архаического «рабы да повинуются» и без смягчения самого отношения господства. Синтаксис последнего причинного оборота слегка развёрнут ради ясности русского текста, а подлинная неоднозначность отмечена в сноске.
