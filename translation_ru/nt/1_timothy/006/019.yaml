  to: накапливая для себя доброе основание на будущее, чтобы ухватиться за подлинную жизнь.
  rationale: Исправлен заключительный глагол, чтобы сохранить активный образ ἐπιλαμβάνομαι и целевую направленность аориста. «Подлинную жизнь» передаёт качественный акцент ὄντως без богословского сужения. Формулировка «доброе основание» намеренно сохранена, поскольку оригинал не заменяет образ основания на более конкретное «прочное основание».
