  source_fidelity: Начальный оборот в целом верно передаёт ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, включая намеренное сочетание образов накопления и основания. Однако «держаться» обычно означает продолжать держаться уже имеющегося и ослабляет целенаправленное «взяться / ухватиться» в ἐπιλάβωνται (аорист, цель действия).
  naturalness: «Накапливая себе доброе основание» допустимо, но несколько шероховато; «для себя» естественнее в современном литературном русском. «Ухватиться за подлинную жизнь» сохраняет образ активного овладения и звучит ясно в наставительном контексте.
  terminology: '«Подлинная жизнь» естественно передаёт τῆς ὄντως ζωῆς: наречие ὄντως выражает действительность, реальность жизни, а не абстрактную «истинность» в доктринальном смысле. «Доброе основание» сохраняет семантическую широту καλόν; замена на «прочное» была бы чрезмерно уточняющей.'
