  text: ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, ἵνα ἐπιλάβωνται τῆς ⸀ὄντως ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/019.yaml
  text: storing up for themselves a good foundation for the future[a], so that they may take hold of the life that is truly life.
translation:
  language: ru
  text: накапливая для себя доброе основание на будущее, чтобы ухватиться за подлинную жизнь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποθησαυρίζοντας
  choice: накапливая
  rationale: Причастие настоящего времени продолжает наставление предыдущего стиха. «Накапливая» передаёт идею собирания сокровища без архаического оттенка.
- source_word: ἑαυτοῖς
  choice: себе
  rationale: Возвратное местоимение в дательном падеже указывает, в чью пользу совершается действие; по-русски естественно «себе».
- source_word: θεμέλιον καλὸν
  choice: доброе основание
  rationale: Сохраняется строительный образ θεμέλιον и положительная оценка καλόν. Выражение также передаёт намеренное сочетание образов накопления и основания в греческом тексте.
- source_word: εἰς τὸ μέλλον
  choice: на будущее
  rationale: Передаёт широкую направленность к грядущему, не сужая выражение до явно названного будущего века, хотя эсхатологический оттенок контекста сохраняется.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно выражает цель в современном русском языке.
- source_word: ἐπιλάβωνται
  choice: держаться
  rationale: Средний аорист конъюнктива ἐπιλαμβάνομαι выражает активное овладение или удержание. «Держаться» сохраняет зримый образ и хорошо сочетается с родительным падежом, управляемым греческим глаголом.
- source_word: τῆς ὄντως ζωῆς
  choice: истинной жизни
  rationale: ὄντως означает «действительно, поистине». «Истинная жизнь» кратко и естественно передаёт противопоставление подлинной жизни кажущейся обеспеченности богатством, не устраняя существительное ζωή.
theological_decisions:
- issue: Следует ли передавать εἰς τὸ μέλλον как прямое указание на грядущий век
  choice: на будущее
  alternative: для грядущего века
  rationale: Контекст допускает эсхатологическое понимание, но само греческое выражение не содержит слова «век». Более широкая формулировка сохраняет эту открытость.
- issue: Насколько развернуто передать τῆς ὄντως ζωῆς
  choice: истинной жизни
  alternative: жизни, которая действительно является жизнью
  rationale: Основной вариант естественен для русского языка и сохраняет качественное противопоставление. Развёрнутый вариант точнее воспроизводит наречие ὄντως, но звучит тяжеловесно.
translation_notes:
  register: Современный литературный русский язык; тон наставительный и достойный. Синтаксис сохраняет зависимость причастного оборота от предыдущего стиха. Намеренное смешение образов сокровища и основания в оригинале не сглажено.
