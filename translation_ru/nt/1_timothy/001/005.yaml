  text: τὸ δὲ τέλος τῆς παραγγελίας ἐστὶν ἀγάπη ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/005.yaml
  text: The goal of the instruction is love from a pure heart and a good conscience and sincere faith[c][b][a],
translation:
  language: ru
  text: Цель[a] же наставления[b] — любовь, исходящая из чистого сердца, доброй совести и искренней веры[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «назначение» или «итог».
    reason: lexical_alternative
  - marker: b
    text: Или «повеления» или «поручения».
    reason: lexical_alternative
  - marker: c
    text: Буквально «нелицемерной веры»; слово πίστις в некоторых контекстах может также означать «верность» или «доверие».
    reason: alternative_reading
lexical_decisions:
- source_word: τέλος
  choice: цель
  rationale: В данном контексте слово обозначает назначение или желаемый результат наставления, а не его прекращение.
- source_word: παραγγελίας
  choice: наставления
  rationale: Передаёт содержание и пастырскую направленность данного Тимофею поручения; возможные более властные оттенки сохранены в сноске.
- source_word: ἀγάπη
  choice: любовь
  rationale: Обычный и точный русский эквивалент, соответствующий нравственному акценту стиха.
- source_word: ἐκ
  choice: исходящая из
  rationale: Предлог указывает на источник; причастный оборот позволяет естественно связать любовь с тремя последующими существительными.
- source_word: καθαρᾶς καρδίας
  choice: чистого сердца
  rationale: Сохраняет образ внутренней нравственной чистоты и естественно звучит по-русски.
- source_word: συνειδήσεως ἀγαθῆς
  choice: доброй совести
  rationale: Формально передаёт ἀγαθῆς и не сужает смысл до одной лишь спокойной или незапятнанной совести.
- source_word: πίστεως
  choice: веры
  rationale: Основное контекстуальное значение — подлинная вера; допустимые значения «верность» и «доверие» отмечены в сноске.
- source_word: ἀνυποκρίτου
  choice: искренней
  rationale: Естественно передаёт отсутствие лицемерия; более буквальный вариант приведён в сноске.
- source_word: δὲ
  choice: же
  rationale: Передаёт мягкую связь или противопоставление с предшествующим рассуждением, не вводя отсутствующего в греческом тексте временного «теперь».
theological_decisions:
- issue: Значение πίστις в выражении πίστεως ἀνυποκρίτου
  choice: вера
  alternative: верность; доверие
  rationale: В контексте вероятнее всего имеется в виду подлинная вера как один из внутренних источников любви, однако семантический диапазон слова не позволяет исключить оттенки верности или доверия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Оборот «любовь, исходящая из…» естественно выражает источник, сохраняя тройную координацию греческого текста.
