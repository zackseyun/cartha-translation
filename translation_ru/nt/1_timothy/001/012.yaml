  text: ⸀Χάριν ἔχω τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/012.yaml
  text: I give thanks to Messiah Jesus our Lord[a], who has strengthened me, because he considered me faithful, appointing me to ministry[b],
translation:
  language: ru
  text: Благодарю укрепившего меня Мессию Иисуса, Господа нашего,[a] за то, что Он счёл меня верным, назначив на служение.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа Иисуса, Господа нашего». Греческий титул Χριστός можно передать переводом «Мессия» или традиционным словом «Христос».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «назначив на службу» или «для служения». Греческое διακονία имеет широкое значение: служба, служение, исполнение поручения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω
  choice: Благодарю
  rationale: Греческий идиоматический оборот означает выражение благодарности; «благодарю» естественно и точно передаёт его в современном русском языке.
- source_word: ἐνδυναμώσαντί με
  choice: укрепившего меня
  rationale: Причастие указывает на Христа как на Того, кто дал Павлу силу; «укрепившего» сохраняет личный характер действия и не сужает его до официального наделения полномочиями.
- source_word: Χριστῷ Ἰησοῦ
  choice: Мессию Иисуса
  rationale: Χριστός здесь сохраняет значение титула; перевод «Мессия» передаёт его смысл, а не только традиционную транслитерацию.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: Господа нашего
  rationale: Устойчивое и уместное русское обозначение власти Иисуса; порядок слов поддерживает достоинство стиля и не затрудняет понимание.
- source_word: πιστόν
  choice: верным
  rationale: Слово может означать верность и надёжность. «Верным» сохраняет эту смысловую широту и естественно сочетается с порученным служением.
- source_word: ἡγήσατο
  choice: счёл
  rationale: Передаёт значение «посчитал, признал» без излишнего судебного оттенка.
- source_word: θέμενος εἰς διακονίαν
  choice: поставил на служение
  rationale: В данном контексте буквальное «поместив» обозначает назначение к служению. Формулировка естественна по-русски и не вводит представления о поздней церковной должности.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессию Иисуса
  alternative: Христа Иисуса
  rationale: Перевод титула раскрывает его исходное значение. Традиционный вариант указан в сноске, поскольку в русском христианском употреблении он широко известен.
- issue: Связь между признанием верным и назначением
  choice: счёл меня верным и поставил на служение
  alternative: счёл меня верным, поставив на служение
  rationale: Греческое причастие θέμενος допускает тесную обстоятельственную связь с ἡγήσατο. Русское сочинение ясно передаёт оба действия одного субъекта, не уточняя сверх текста, было ли назначение доказательством признания или его следствием.
- issue: Значение διακονία
  choice: служение
  alternative: служба
  rationale: «Служение» охватывает порученную деятельность Павла, не ограничивая её ни бытовым обслуживанием, ни формально учреждённой церковной должностью.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Инверсия «Господа нашего» сохраняет достоинство речи, оставаясь понятной. Заглавное «Он» употреблено как принятая в русском религиозном письме форма уважительного обозначения Христа.
