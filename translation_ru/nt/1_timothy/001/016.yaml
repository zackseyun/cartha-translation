language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/016.yaml
  text: But for this reason I received mercy[a], so that in me, as the foremost[d][c][b], Messiah Jesus might display all his patience as a pattern for those who were going to believe in him for eternal life.
translation:
  language: ru
  text: 'Но именно поэтому я и был помилован: чтобы Мессия Иисус показал на мне, первом из грешников[a], всё Своё долготерпение, сделав меня примером для тех, кому предстояло уверовать в Него для вечной жизни[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на мне, первом». Слово «первом» отсылает к предыдущему утверждению Павла о себе как о первом из грешников (ст. 15); возможно также понимание «главном» или «худшем».'
    reason: Сохранение контекстуальной отсылки и смыслового диапазона πρώτῳ.
  - marker: b
    text: 'Или: «для тех, кто уверует в Него ради вечной жизни». Греческий предлог может обозначать цель или результат.'
    reason: Сохранение перспективного значения τῶν μελλόντων πιστεύειν и возможного целевого либо результирующего оттенка εἰς ζωὴν αἰώνιον.
lexical_decisions:
- source_word: ἠλεήθην
  choice: я был помилован
  rationale: Естественная русская передача страдательной формы; сохраняет неназванного деятеля и связь с милостью.
- source_word: πρώτῳ
  choice: первом из грешников
  rationale: Слово отсылает к утверждению Павла в ст. 15; добавление «из грешников» делает эту анафорическую связь понятной по-русски, не превращая «первого» однозначно в «худшего».
- source_word: ἐνδείξηται
  choice: показал
  rationale: Передаёт целевое значение ἵνα с сослагательным наклонением и смысл явного проявления.
- source_word: Χριστὸς Ἰησοῦς
  choice: Мессия Иисус
  rationale: Χριστός сохраняет здесь значение титула и передаётся его смысловым эквивалентом «Мессия».
- source_word: ἅπασαν μακροθυμίαν
  choice: всё Своё долготерпение
  rationale: «Всё» сохраняет усиленную полноту ἅπασαν, а «долготерпение» точно передаёт терпеливую сдержанность μακροθυμίαν.
- source_word: ὑποτύπωσιν
  choice: пример
  rationale: Обозначает наглядный образец для последующих верующих; «пример» естественнее современному русскому читателю, чем «прообраз» или «модель».
- source_word: τῶν μελλόντων πιστεύειν
  choice: тех, кому предстояло уверовать
  rationale: Сохраняет перспективное значение μέλλω относительно помилования Павла и звучит естественно по-русски.
- source_word: πιστεύειν ἐπ’ αὐτῷ
  choice: уверовать в Него
  rationale: Передаёт направленное личное доверие, выраженное πιστεύω с ἐπί и дательным падежом.
- source_word: εἰς ζωὴν αἰώνιον
  choice: и обрести вечную жизнь
  rationale: Передаёт целевое или результирующее значение εἰς естественной русской конструкцией; связь этого оборота допускает иной синтаксический оттенок, отмеченный в сноске.
theological_decisions:
- issue: Значение Χριστός
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: В данном сочетании титульный смысл остаётся различимым; перевод «Мессия» раскрывает значение греческого титула без внесения конфессиональной специфики.
- issue: Кто оказывает милость и проявляет долготерпение
  choice: Страдательная форма «был помилован» оставляет деятеля неназванным, а долготерпение прямо связывается с Мессией Иисусом
  alternative: Прямо назвать Бога Отца или Иисуса единственным субъектом обоих действий
  rationale: Греческий текст не называет деятеля при ἠλεήθην, но явно называет Мессию Иисуса субъектом ἐνδείξηται; перевод не устраняет это различие.
- issue: Смысл πρώτῳ
  choice: первом из грешников
  alternative: главном / худшем грешнике
  rationale: Перевод сохраняет отсылку к ст. 15 и первенство Павла в контексте, не навязывая исключительно нравственно-сравнительное значение «худший».
- issue: Связь εἰς ζωὴν αἰώνιον
  choice: уверовать в Него и обрести вечную жизнь
  alternative: уверовать в Него для вечной жизни
  rationale: Основной текст естественно выражает результат или цель веры, а сноска сохраняет более буквальную конструкцию и её допустимую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской речи. «Но именно поэтому я и был помилован» естественно передаёт контраст и подчёркивание διὰ τοῦτο; двоеточие ясно вводит цель. Местоимения, относящиеся к Мессии Иисусу, написаны с прописной буквы в соответствии с устойчивой русской библейской традицией.
