  text: ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: ru
  text: Но благодать нашего Господа излилась с преизбытком, вместе с верой и любовью во Христе Иисусе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: стала преизобильной
  rationale: Усиленный глагол передаёт чрезвычайное изобилие благодати; формулировка сохраняет интенсивность греческого слова и звучит естественно в современном литературном русском.
- source_word: δὲ
  choice: Но
  rationale: Союз обозначает контраст с предшествующим упоминанием неверия и проступка Павла.
- source_word: ἡ χάρις
  choice: благодать
  rationale: Традиционный и точный русский эквивалент, обозначающий действенную незаслуженную милость Господа.
- source_word: τοῦ κυρίου ἡμῶν
  choice: нашего Господа
  rationale: Передаёт родительный оборот и сохраняет обычный новозаветный титул κύριος.
- source_word: μετὰ πίστεως καὶ ἀγάπης
  choice: вместе с верой и любовью
  rationale: μετά с родительным указывает на сопутствующие веру и любовь, не уточняя сверх текста причинную связь.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: которые во Христе Иисусе
  rationale: Определительный оборот естественно соотнесён и с верой, и с любовью; множественное «которые» делает эту связь явной. «Христос Иисус» — естественная русская передача титульного сочетания Χριστὸς Ἰησοῦ.
theological_decisions:
- issue: Связь выражения «вместе с верой и любовью» с благодатью
  choice: Вера и любовь представлены как сопутствующие преизобильной благодати.
  alternative: Вера и любовь могут пониматься как произведённые благодатью качества Павла.
  rationale: Грамматически оборот с μετά относится к глагольному высказыванию о благодати; перевод сохраняет эту связь, не исключая богословского понимания веры и любви как её плодов.
- issue: Значение выражения ἐν Χριστῷ Ἰησοῦ
  choice: «во Христе Иисусе» оставлено как ёмкое выражение сферы или единения.
  alternative: «которые даёт Христос Иисус» или «обретёнными во Христе Иисусе».
  rationale: Греческий предлог ἐν не выражает здесь однозначно ни источник, ни обладание; буквальная и естественная формулировка сохраняет смысловую насыщенность и неопределённость.
translation_notes:
  register: 'Современный литературный русский с достоинством библейского регистра. Выбрано «преизобильной», чтобы передать усиление в ὑπερεπλεόνασεν без громоздкого «излилась ещё более обильно». Тире помогает ясно присоединить сопутствующий оборот. Слово «Мессия» здесь не использовано: устойчивое русское сочетание «Христос Иисус» сохраняет титул и не создаёт неестественного «Мессия Иисус».'
