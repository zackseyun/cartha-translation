  text: κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/011.yaml
  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: ru
  text: согласно Евангелию славы блаженного Бога[a], которое было вверено мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «славному Евангелию блаженного Бога».'
    reason: Альтернативная, более идиоматическая передача родительного падежа τῆς δόξης как качественного определения.
lexical_decisions:
- source_word: κατὰ
  choice: согласно
  rationale: Предлог с винительным падежом указывает здесь на норму или мерило, с которым согласуется предшествующее утверждение.
- source_word: εὐαγγέλιον
  choice: Евангелию
  rationale: Устоявшийся и понятный в русском христианском употреблении эквивалент, сохраняющий богословскую весомость термина.
- source_word: τῆς δόξης
  choice: славы
  rationale: Родительный падеж сохранён, чтобы не сводить неоднозначную греческую конструкцию только к значению прилагательного «славному».
- source_word: μακαρίου
  choice: блаженного
  rationale: В отношении Бога «блаженный» — традиционный и достойный эквивалент; «счастливый» звучало бы недостаточно возвышенно, а «благословенный» могло бы привнести иной смысл.
- source_word: θεοῦ
  choice: Бога
  rationale: Прямой эквивалент греческого θεός в родительном падеже.
- source_word: ὃ
  choice: которое
  rationale: Относительное местоимение относится к «Евангелию» и в русском согласуется с ним в среднем роде.
- source_word: ἐπιστεύθην
  choice: было вверено мне
  rationale: Аорист пассива πιστεύω здесь означает не «я уверовал», а «мне было доверено/вверено»; безлично-пассивная русская конструкция естественно передаёт этот смысл.
- source_word: ἐγώ
  choice: мне
  rationale: Явно выраженное греческое местоимение подчёркивает личное поручение Павлу; в русском это передано местоимением «мне» в конечной позиции.
theological_decisions:
- issue: Связь родительных падежей в τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ
  choice: Евангелию славы блаженного Бога
  alternative: славному Евангелию блаженного Бога
  rationale: Основной текст сохраняет греческую конструкцию «Евангелие славы», не устраняя возможность того, что речь идёт о славе, принадлежащей Богу или характеризующей благую весть. Более идиоматическое понимание родительного как качественного дано в сноске.
- issue: Значение ἐπιστεύθην
  choice: было вверено мне
  alternative: я уверовал
  rationale: Пассивная форма в данном синтаксическом окружении обозначает поручение Евангелия Павлу, а не акт его веры.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Формальная конструкция «Евангелие славы» сохранена ради смысловой открытости оригинала; прописная буква в слове «Евангелие» соответствует устойчивому русскому употреблению применительно к христианской Благой вести.
