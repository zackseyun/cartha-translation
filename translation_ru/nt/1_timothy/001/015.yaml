  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: ru
  text: 'Это слово верно и достойно полного принятия: Мессия Иисус[a] пришёл в мир, чтобы спасти грешников, из которых я — первый[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос Иисус».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «главный»; по смыслу возможно: «худший».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: Это слово верно
  rationale: Формула указывает на надёжное, заслуживающее доверия высказывание. «Это слово верно» естественно звучит по-русски и сохраняет традиционную библейскую лексику.
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: достойно полного принятия
  rationale: πάσης усиливает значение ἀποδοχῆς; «полного принятия» передаёт эту полноту без буквального и неестественного «всякого принятия».
- source_word: ὅτι
  choice: двоеточие без отдельного союза
  rationale: ὅτι вводит содержание верного слова. В русском языке после формулы естественно поставить двоеточие; добавление «что» здесь утяжелило бы фразу.
- source_word: Χριστὸς Ἰησοῦς
  choice: Мессия Иисус
  rationale: Χριστός сохраняет значение титула «Мессия», а порядок компонентов соответствует греческому тексту. Более привычное «Христос Иисус» отмечено в сноске.
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: пришёл в мир
  rationale: Прямой и естественный эквивалент, сохраняющий движение и богословскую ёмкость исходного выражения.
- source_word: ἁμαρτωλοὺς σῶσαι
  choice: чтобы спасти грешников
  rationale: Инфинитив цели передан естественной русской конструкцией «чтобы спасти»; «грешников» точно отражает субстантивированное прилагательное.
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: из которых я — первый
  rationale: «Первый» сохраняет образ порядка или первенства в πρῶτος и не сводит его к толкованию «худший». Местоимение «я» и тире передают эмфатический характер ἐγώ.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: В данном исповедальном высказывании у Χριστός различим титульный смысл. При этом традиционное, более имяподобное прочтение сохраняется в сноске.
- issue: Смысл πρῶτος применительно к грешникам
  choice: первый
  alternative: худший; главный
  rationale: Исходное слово допускает первенство по положению или степени. Буквальное «первый» сохраняет напряжение и неоднозначность, тогда как «худший» уже истолковывает меру греховности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изречения. Синтаксис сделан ясным для обычного читателя; неоднозначность πρῶτος и титульное значение Χριστός не устранены молча.
