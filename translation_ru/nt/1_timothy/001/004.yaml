  text: μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ⸀ἐκζητήσεις παρέχουσι μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει—
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/004.yaml
  text: nor to pay attention to myths and endless genealogies[c][b][a], which promote speculations rather than the stewardship from God that is by faith—
translation:
  language: ru
  text: и не увлекались мифами и бесконечными родословиями, которые порождают изыскания[a], а не Божье устроение в вере[b][c], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вызывают споры»; или: «порождают вопросы». Греческое слово может обозначать изыскания, спорные вопросы или разногласия; в данном контексте оно имеет отрицательный оттенок непродуктивных умствований.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Божье управление», «Божий замысел» или «вверенное Богом служение». Греческое слово может обозначать управление, попечение, порядок осуществления или замысел.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «посредством веры». Слово «вера» здесь может также включать оттенок доверия или верности.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχειν
  choice: занимались
  rationale: В данном контексте глагол означает уделять чему-либо внимание, обращаться к этому и быть этим поглощённым. «Занимались» естественно передаёт продолжительное увлечение предметом без излишнего усиления.
- source_word: μύθοις
  choice: мифами
  rationale: Прямой и современный эквивалент, не придающий слову оттенка детской нравоучительной басни.
- source_word: γενεαλογίαις ἀπεράντοις
  choice: бесконечными родословиями
  rationale: Передаёт как буквальный смысл ἀπέραντος — не имеющий конца, так и отрицательный оттенок нескончаемых занятий генеалогиями.
- source_word: ἐκζητήσεις
  choice: бесплодные рассуждения
  rationale: Слово может обозначать изыскания, споры или спорные вопросы. Контекст требует отрицательного оттенка непродуктивных умствований; определение «бесплодные» делает этот оттенок ясным, не сводя значение только к конфликтам.
- source_word: παρέχουσι
  choice: порождают
  rationale: Естественно выражает причинное значение «вызывают, производят».
- source_word: μᾶλλον ἢ
  choice: а не
  rationale: В русском языке ясно и естественно передаёт резкое противопоставление двух результатов.
- source_word: οἰκονομίαν θεοῦ
  choice: Божье устроение
  rationale: '«Устроение» сохраняет широту οἰκονομία: управление, порядок осуществления или замысел. Прилагательное «Божье» оставляет открытым, идёт ли речь о принадлежащем Богу устроении или об устроении, исходящем от Него.'
- source_word: τὴν ἐν πίστει
  choice: совершающееся в вере
  rationale: Причастная конструкция делает связь с «устроением» ясной и сохраняет пространственно-сферический оттенок ἐν, не ограничивая его исключительно инструментальным значением.
- source_word: πίστει
  choice: вере
  rationale: Обычный русский эквивалент πίστις в данном контексте; возможные оттенки доверия и верности отмечены в сноске.
theological_decisions:
- issue: Значение οἰκονομίαν θεοῦ
  choice: Божье устроение
  alternative: Божье управление; Божий замысел; вверенное Богом служение
  rationale: 'Фраза допускает несколько смысловых акцентов: Божий порядок действия, Его замысел либо порученное Им попечение. «Божье устроение» сохраняет эту широту и не навязывает узкую богословскую систему.'
- issue: Значение πίστει в τὴν ἐν πίστει
  choice: в вере
  alternative: в доверии; в верности; посредством веры
  rationale: «В вере» формально и естественно сохраняет неоднозначность πίστις и ἐν, тогда как альтернативы могли бы преждевременно решить, обозначает ли выражение сферу, средство, доверие или верность.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского наставления. Начальный союз и конечное тире сохраняют синтаксическую незавершённость отрывка, продолжающего повеление предыдущего стиха. Маркеры сносок размещены непосредственно после соответствующих выражений.
