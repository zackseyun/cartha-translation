lexical_decisions:
- source_word: τὸ πρότερον ὄντα
  choice: хотя прежде я был
  rationale: Оборот относится к Павлу и описывает его прежнее состояние; «прежде я был» естественно передаёт временной и причастный смысл. «Хотя» связывает этот фрагмент с предшествующим предложением, как того требует синтаксически зависимое винительное причастие.
- source_word: βλάσφημον
  choice: богохульником
  rationale: Существительное в ряду личных характеристик; «богохульник» — прямой и понятный русский эквивалент.
- source_word: διώκτην
  choice: гонителем
  rationale: Обычный русский эквивалент существительного, обозначающего того, кто преследует людей, здесь — последователей Христа.
- source_word: ὑβριστήν
  choice: жестоким человеком
  rationale: Слово обозначает человека, проявляющего оскорбительную, разнузданную агрессию. «Жестокий человек» ясно передаёт насильственный аспект, а сноска сохраняет оттенок дерзкого оскорбительного поведения.
- source_word: ἠλεήθην
  choice: меня помиловали
  rationale: Форма страдательного залога сохранена естественной русской безлично-пассивной конструкцией; божественный деятель подразумевается, но не добавляется явно.
- source_word: ὅτι
  choice: потому что
  rationale: Передаёт естественный причинно-пояснительный смысл союза, не утверждая, будто неведение само по себе заслуживало милости.
- source_word: ἀγνοῶν ἐποίησα
  choice: я поступал так по неведению
  rationale: Причастие и глагол вместе описывают действия Павла как совершавшиеся в неведении. «Так» восполняет подразумеваемый объект из контекста, не уточняя его сверх текста.
- source_word: ἐν ἀπιστίᾳ
  choice: в неверии
  rationale: В данном контексте наиболее вероятен смысл отсутствия веры, а не вероломства или нарушения заветной верности.
theological_decisions:
- issue: Смысл основания, вводимого ὅτι
  choice: Павел говорит, что был помилован, потому что поступал по неведению, находясь в неверии.
  alternative: Слова о неведении лишь описывают сопутствующие обстоятельства, но не указывают причину помилования.
  rationale: Причинное «потому что» сохраняет наиболее прямой смысл греческого ὅτι и напряжение самого текста. Перевод не добавляет вывода, будто неведение заслужило милость или само стало основанием спасения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены последовательность трёх характеристик, страдательная форма глагола о милости и причинная связь; тяжеловесное буквальное «прежде будучи» заменено естественным русским оборотом.
