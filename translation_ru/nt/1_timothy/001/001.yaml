  text: Paul[a], an apostle of Messiah Jesus by the command of God our Savior and Messiah Jesus our hope[b],
translation:
  language: ru
  text: Павел, апостол Иисуса Мессии[a] по повелению Бога, нашего Спасителя, и Иисуса Мессии, нашей надежды[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа Иисуса» — в обоих случаях. Греческий титул Χριστός означает «Мессия», но в некоторых контекстах употребляется почти как часть имени — «Христос».'
    reason: alternative_reading
  - marker: b
    text: 'Более развёрнутый перевод: «по повелению Бога, нашего Спасителя, и по повелению Иисуса Мессии, нашей надежды». В греческом слово «повеление» не повторяется.'
    reason: syntax_clarification
lexical_decisions:
- source_word: Παῦλος
  choice: Павел
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: ἀπόστολος
  choice: апостол
  rationale: Устоявшийся русский термин, сохраняющий значение особого посланника и раннехристианского служения.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Иисуса Мессии
  rationale: Χριστός передан как значимый титул «Мессия», а имя Ἰησοῦ — традиционной русской формой «Иисус»; порядок перестроен ради естественного русского сочетания имени и титула.
- source_word: κατ’ ἐπιταγήν
  choice: по повелению
  rationale: Передаёт основание апостольского служения в авторитетном Божьем распоряжении и звучит естественно и торжественно.
- source_word: θεοῦ σωτῆρος ἡμῶν
  choice: Бога, нашего Спасителя
  rationale: Приложение ясно относит титул «Спаситель» к Богу и сохраняет структуру греческого выражения.
- source_word: Χριστοῦ Ἰησοῦ τῆς ἐλπίδος ἡμῶν
  choice: Иисуса Мессии, нашей надежды
  rationale: Сохраняет приложение, прямо именующее Иисуса Мессию нашей надеждой, без поясняющего расширения.
- source_word: ἐλπίδος
  choice: надежды
  rationale: Обычное и богословски ёмкое соответствие, выражающее уверенное ожидание спасения.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном приветствии титульное значение остаётся различимым; «Мессия» переводит титул, тогда как «Христос» в современном русском чаще воспринимается как часть имени.
- issue: Связь определения «наша надежда» с Иисусом Мессией
  choice: 'Приложение: «Иисуса Мессии, нашей надежды»'
  alternative: 'Пояснительное придаточное: «Иисуса Мессии, Который есть наша надежда»'
  rationale: Греческое τῆς ἐλπίδος ἡμῶν непосредственно приложено к Χριστοῦ Ἰησοῦ; краткая форма сохраняет эту структуру и не добавляет связку.
- issue: К кому относится «повеление»
  choice: К Богу и Иисусу Мессии совместно
  alternative: 'Явно повторить зависимое слово: «по повелению Бога… и по повелению Иисуса Мессии…»'
  rationale: Оба родительных оборота соединены καί и зависят от ἐπιταγήν; русский общий оборот сохраняет компактность и допускает ту же синтаксическую связь.
translation_notes:
  register: Современный литературный русский язык с достоинством эпистолярного приветствия. Формулировка остаётся компактной, но пунктуация проясняет приложения «нашего Спасителя» и «нашей надежды». Титул «Мессия» поставлен после имени, что естественнее для русского языка, хотя греческий порядок обратный.
