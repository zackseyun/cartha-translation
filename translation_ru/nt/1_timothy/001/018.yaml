  text: Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι, τέκνον Τιμόθεε, κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας, ἵνα ⸀στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/018.yaml
  text: This charge I entrust to you[a], child Timothy, in accordance with the prophecies previously made about you, so that by them you may wage the good warfare[c][b],
translation:
  language: ru
  text: Это поручение я вверяю тебе, Тимофей, дитя, согласно ранее высказанным о тебе пророчествам[a], чтобы с их помощью[b] ты вёл добрую воинскую борьбу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «относительно тебя»; образно — «над тобой», то есть сказанными в связи с тобой.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «руководствуясь ими» или, более буквально, «в них»; греческое выражение может обозначать средство или сферу действия.'
    reason: lexical_alternative
  - marker: c
    text: 'Традиционно: «сражался добрым сражением». Греческий оборот буквально говорит о ведении доброго воинского дела; существительное может обозначать военную кампанию или службу, а не только отдельную схватку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγελίαν
  choice: поручение
  rationale: Слово обозначает авторитетное наставление или предписание. «Поручение» сохраняет одновременно обязательность и личную ответственность, связанную с последующим глаголом «вверяю».
- source_word: παρατίθεμαί
  choice: вверяю
  rationale: Средний залог передаёт мысль о том, что нечто доверяется заботе и ответственности другого человека; «вверяю» естественно выражает эту личную доверительность.
- source_word: τέκνον
  choice: дитя моё
  rationale: Буквально «дитя»; это сердечное духовно-родственное обращение. Местоимение «моё», хотя отдельно в греческом не выражено, по-русски естественно передаёт силу такого обращения, не заменяя образ более конкретным словом «сын».
- source_word: κατὰ τὰς προαγούσας
  choice: в соответствии с прежними
  rationale: κατά выражает соответствие или основание, а причастие προαγούσας указывает на то, что пророчества предшествовали нынешнему поручению.
- source_word: ἐπὶ σὲ
  choice: о тебе
  rationale: Сочетание может обозначать направленность пророчеств на Тимофея или их отношение к нему. «О тебе» — ясная основная передача; иная возможная формулировка отмечена в сноске.
- source_word: προφητείας
  choice: пророчествами
  rationale: Прямое и общепонятное обозначение пророческих речений во множественном числе.
- source_word: ἐν αὐταῖς
  choice: с их помощью
  rationale: 'ἐν допускает инструментальное понимание: прежние пророчества служат Тимофею средством или опорой в его служении. Возможное значение сферы сохранено в сноске.'
- source_word: στρατεύῃ ... τὴν καλὴν στρατείαν
  choice: вёл достойную воинскую борьбу
  rationale: Глагол и однокоренное существительное создают развёрнутый военный образ — ведение кампании или несение воинской службы. Формулировка сохраняет этот образ и передаёт καλός как «достойную», не сводя выражение к одной отдельной схватке.
theological_decisions:
- issue: Связь поручения Тимофею с прежними пророчествами
  choice: Прежние пророчества о Тимофее служат основанием и опорой для данного ему поручения.
  alternative: Пророчества сами по себе формально поставили Тимофея на служение либо были лишь частным ободрением.
  rationale: Текст тесно связывает поручение с пророчествами, но не объясняет точного обряда, обстоятельств или богословского механизма этой связи; перевод не уточняет того, чего не уточняет греческий текст.
- issue: Значение ἐν αὐταῖς
  choice: 'Пророчества понимаются как средство или опора: «с их помощью».'
  alternative: 'Пророчества могут обозначать сферу, в которой Тимофей ведёт борьбу: «в них» или «в согласии с ними».'
  rationale: Греческий предлог допускает как инструментальный, так и сферический оттенок. Основной текст выбран ради естественности русского языка, а неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством пастырского обращения. Военная метафора сохранена, но архаичное «брань» не использовано. Синтаксис сделан естественным для чтения вслух; неоднозначность предлогов ἐπί и ἐν вынесена в краткие сноски.
