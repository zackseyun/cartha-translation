  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: ru
  text: Как я просил тебя остаться в Эфесе, когда отправлялся в Македонию, чтобы ты поручил[a] некоторым не учить иному[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приказал некоторым»; греческий глагол может обозначать авторитетное распоряжение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не преподавать другого учения»; буквально: «не учить иначе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς
  choice: Как… и
  rationale: Передаёт отсылку к прежней просьбе и сохраняет незавершённую в пределах стиха синтаксическую связь с последующим контекстом.
- source_word: παρεκάλεσά
  choice: просил
  rationale: В данном контексте глагол выражает настойчивое личное побуждение; «просил» звучит естественно и не превращает обращение к Тимофею в прямой приказ.
- source_word: προσμεῖναι
  choice: остаться
  rationale: Точно и естественно передаёт продолжение пребывания в определённом месте.
- source_word: ἐν Ἐφέσῳ
  choice: в Эфесе
  rationale: Устоявшаяся русская форма географического названия.
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: когда отправлялся в Македонию
  rationale: Причастный оборот передан временным придаточным; его субъектом по ближайшей синтаксической связи остаётся говорящий Павел.
- source_word: ἵνα
  choice: чтобы
  rationale: Сохраняет целевое значение союза.
- source_word: παραγγείλῃς
  choice: ты велел
  rationale: Передаёт властный характер поручения без архаичного «заповедал»; менее сильное «наставил» отмечено в сноске.
- source_word: τισὶν
  choice: некоторым
  rationale: Сохраняет неопределённое указание на конкретных, но не названных людей.
- source_word: ἑτεροδιδασκαλεῖν
  choice: не преподавать иного учения
  rationale: Передаёт идею учения, отличного от принятой апостольской нормы, не усиливая её до явно оценочного «лжеучения».
theological_decisions:
- issue: Степень властности παραγγείλῃς в контексте исправления учителей
  choice: «велел» как ясное указание, данное с полномочием
  alternative: «наставил» или «поручил»
  rationale: Глагол обозначает не совет, а авторитетное распоряжение. При этом сноска сохраняет возможность менее категоричного выражения по-русски.
- issue: Оценочная сила ἑτεροδιδασκαλεῖν
  choice: «не преподавать иного учения»
  alternative: «не учить иначе» или интерпретирующее «не преподавать ложного учения»
  rationale: Сложный глагол прямо указывает на иное, отличающееся учение. Перевод не добавляет определения «ложное», хотя отрицательная оценка ясна из запрета.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского письма. Синтаксис стиха намеренно оставлен незавершённым и завершён запятой, поскольку греческая конструкция продолжается в следующем стихе. Избегаются как архаизмы («заповедал»), так и более сильное толкование «лжеучение».
