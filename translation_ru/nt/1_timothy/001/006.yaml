  text: ὧν τινες ἀστοχήσαντες ἐξετράπησαν εἰς ματαιολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/006.yaml
  text: Some[a], having missed these things, have turned aside to empty talk[b],
translation:
  language: ru
  text: Некоторые, уклонившись от этого[a], свернули к пустословию[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не достигнув этого». Глагол может означать промах относительно цели или отклонение от неё.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пустым разговорам», «бесплодным речам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: от этого
  rationale: Родительное местоимение множественного числа отсылает к названным в ст. 5 духовно-нравственным целям. Русское «от этого» естественно связывает причастие «уклонившись» с предшествующим контекстом, не сужая референцию до одного элемента.
- source_word: τινες
  choice: Некоторые
  rationale: Неопределённое местоимение указывает на не названную конкретно часть людей; «некоторые» точно и естественно передаёт эту неопределённость.
- source_word: ἀστοχήσαντες
  choice: уклонившись
  rationale: Глагол означает не попасть в цель, не достичь её или отклониться от неё. «Уклонившись» сохраняет образ отклонения от должной цели и хорошо сочетается с родительным «от этого».
- source_word: ἐξετράπησαν
  choice: свернули
  rationale: Форма ἐκτρέπομαι описывает уход с правильного пути. «Свернули» сохраняет направительный образ и не навязывает явно ни пассивного, ни внешне-принудительного понимания.
- source_word: εἰς
  choice: к
  rationale: Предлог обозначает направление или достигнутый результат; после «свернули» русское «к» передаёт это движение естественно.
- source_word: ματαιολογίαν
  choice: пустословию
  rationale: Слово обозначает пустую, бесплодную, не имеющую пользы речь. «Пустословие» — ёмкий и понятный литературный эквивалент, подходящий к контексту ложного учительства.
theological_decisions:
- issue: Референт ὧν
  choice: Обобщённая отсылка к названным в ст. 5 целям и качествам — «от этого».
  alternative: Более узкая отсылка только к чистому сердцу, доброй совести и искренней вере; либо буквальное «от которых».
  rationale: Синтаксис требует отсылки назад, но не вынуждает переводчика жёстко ограничивать её только отдельными членами перечня. Единственное собирательное «этого» ясно для русского читателя и сохраняет широту связи.
- issue: Соотношение ἀστοχήσαντες и ἐξετράπησαν
  choice: 'Сохранены два взаимосвязанных образа: «уклонившись… свернули».'
  alternative: 'Сгладить в одно действие: «отступили… и предались» или передать первый глагол как «не достигнув».'
  rationale: Два глагола исходного текста описывают промах относительно цели и последующий уход в ином направлении. Их раздельная передача сохраняет риторическое движение и не устраняет смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формулировкой. «Пустословие» несколько книжное, но общеупотребительное и точно передаёт полемическую силу ματαιολογία без архаизации.
