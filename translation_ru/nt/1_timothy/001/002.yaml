  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: ru
  text: 'Тимофею, моему истинному сыну[a] в вере[b]: благодать, милость и мир от Бога Отца и Мессии Иисуса, нашего Господа.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ребёнку» или «дитяти».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «по вере».'
    reason: ambiguity
  - marker: c
    text: 'Традиционный перевод: «Христа Иисуса, нашего Господа».'
    reason: translation_tradition
lexical_decisions:
- source_word: γνησίῳ
  choice: истинному
  rationale: Передаёт подлинность духовного родства Павла с Тимофеем, не подразумевая биологического происхождения.
- source_word: τέκνῳ
  choice: сыну
  rationale: Хотя греческое слово буквально означает «ребёнок, дитя», применительно к Тимофею русское «сын» естественно передаёт метафору духовного родства; более буквальный вариант указан в сноске.
- source_word: ἐν πίστει
  choice: в вере
  rationale: 'Сохраняет форму и возможную смысловую широту греческого выражения: вера может пониматься и как общая сфера духовного родства, и как доверие Богу.'
- source_word: χάρις
  choice: благодать
  rationale: Устоявшийся и точный русский эквивалент характерного для Павла приветственного слова.
- source_word: ἔλεος
  choice: милость
  rationale: Прямо передаёт значение слова и сохраняет особую трёхчастную формулу приветствия в пастырских посланиях.
- source_word: εἰρήνη
  choice: мир
  rationale: Сохраняет как приветственный, так и богословский смысл греческого слова.
- source_word: θεοῦ πατρὸς
  choice: Бога Отца
  rationale: Естественная русская передача греческого сочетания без добавления смысловых уточнений.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Мессии Иисуса
  rationale: Передаёт Χριστός как титул «Мессия» и сохраняет греческий порядок титула и имени.
- source_word: κυρίου
  choice: Господа
  rationale: Устоявшаяся передача κύριος, сохраняющая христологическую значимость титула.
theological_decisions:
- issue: Смысл выражения ἐν πίστει
  choice: в вере
  alternative: по вере
  rationale: «В вере» формально сохраняет греческий предлог и не решает однозначно, обозначает ли выражение общую христианскую веру, сферу духовного родства или веру как средство этого родства.
- issue: Передача Χριστοῦ Ἰησοῦ
  choice: Мессии Иисуса
  alternative: Христа Иисуса
  rationale: Выбран перевод титула Χριστός, а не его традиционная транслитерация; при этом сохранён исходный порядок слов.
- issue: Метафора τέκνον
  choice: сыну
  alternative: ребёнку
  rationale: «Сын» естественнее по-русски в обращении к взрослому мужчине и ясно выражает духовное родство, тогда как буквальная широта слова τέκνον отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского приветствия. Синтаксис близок к греческому, но естественен для русского читателя; богословски значимые формулы и неоднозначность ἐν πίστει сохранены.
