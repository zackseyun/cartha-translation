  text: πόρνοις, ἀρσενοκοίταις, ἀνδραποδισταῖς, ψεύσταις, ἐπιόρκοις, καὶ εἴ τι ἕτερον τῇ ὑγιαινούσῃ διδασκαλίᾳ ἀντίκειται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/010.yaml
  text: the sexually immoral, men who have sex with men,[a] servant traders, liars, perjurers, and whatever else is opposed to sound teaching,
translation:
  language: ru
  text: блудникам, мужчинам, вступающим в половую связь с мужчинами,[a] работорговцам, лжецам, тем, кто даёт ложные клятвы, и всему прочему, что противится здравому учению,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мужчинам, практикующим гомосексуальные половые связи». Греческое слово ἀρσενοκοῖται встречается редко, и точный объём его значения обсуждается; оно относится к половым связям между мужчинами.'
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνοις
  choice: блудникам
  rationale: Слово обозначает людей, ведущих половую жизнь, считающуюся безнравственной; «блудникам» сохраняет широту категории и естественно звучит в библейском перечне пороков.
- source_word: ἀρσενοκοίταις
  choice: мужчинам, вступающим в половую связь с мужчинами
  rationale: Редкое сложное слово связано с ἄρσην («мужчина, самец») и κοίτη («ложе», в том числе половая связь). Описательный перевод передаёт мужской и поведенческий характер выражения, не привнося современную категорию сексуальной идентичности.
- source_word: ἀνδραποδισταῖς
  choice: работорговцам
  rationale: Слово обозначает тех, кто похищает, обращает в рабство или продаёт людей как рабов. «Работорговцам» кратко и ясно передаёт связь именно с торговлей людьми как рабами.
- source_word: ψεύσταις
  choice: лжецам
  rationale: Прямой и естественный русский эквивалент существительного со значением «те, кто лжёт».
- source_word: ἐπιόρκοις
  choice: тем, кто даёт ложные клятвы
  rationale: Описательный перевод точно передаёт ложность или нарушение клятвы и понятнее современному читателю, чем книжное «клятвопреступникам».
- source_word: καὶ εἴ τι ἕτερον
  choice: и всему прочему
  rationale: Идиоматически передаёт открытое расширение перечня на любые другие подобные явления; дательный падеж согласован с последующим оборотом.
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: здравому учению
  rationale: Сохраняет метафорическое значение ὑγιαίνω — «быть здоровым, здравым» — и передаёт διδασκαλία как учение, не утяжеляя текст специальной терминологией.
- source_word: ἀντίκειται
  choice: противится
  rationale: Передаёт активное противостояние или несовместимость со здравым учением и естественно сочетается с дательным падежом.
theological_decisions:
- issue: Передача редкого и спорного слова ἀρσενοκοίταις
  choice: мужчинам, вступающим в половую связь с мужчинами
  alternative: мужчинам, практикующим гомосексуальные половые связи
  rationale: Основной перевод описывает действие, а не современную идентичность, и сохраняет мужскую специфику греческого слова. Поскольку точный объём значения редкого термина обсуждается, распространённый альтернативный перевод вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранён дательный падеж элементов перечня, поскольку стих является продолжением синтаксической конструкции предыдущего контекста. Формулировки по возможности краткие; спорный термин передан описательно, без архаичного и потенциально более узкого слова «мужеложники».
