lexical_decisions:
- source_word: εἰδὼς τοῦτο
  choice: зная
  rationale: Причастие выражает осознание факта, служащего основанием для предшествующего наставления; русское «зная» естественно передаёт эту связь.
- source_word: δικαίῳ
  choice: для праведника
  rationale: Дательный падеж единственного числа при νόμος οὐ κεῖται; «праведник» сохраняет единственное число и обобщающий личный характер выражения.
- source_word: νόμος οὐ κεῖται
  choice: закон установлен не
  rationale: κεῖται имеет значение «положен, установлен»; такая передача сохраняет юридический оттенок и не сужает смысл до «не применяется».
- source_word: ἀνόμοις
  choice: для беззаконных
  rationale: Передаёт нравственно-правовой смысл отсутствия уважения к закону.
- source_word: ἀνυποτάκτοις
  choice: непокорных
  rationale: Обозначает тех, кто отказывается подчиняться; это естественное и достаточно точное современное русское слово.
- source_word: ἀσεβέσι
  choice: нечестивых
  rationale: Передаёт отсутствие благоговения перед Богом и сохраняет библейски достойный, но понятный регистр.
- source_word: ἁμαρτωλοῖς
  choice: грешных
  rationale: Сохраняет прилагательную форму и параллелизм перечня.
- source_word: ἀνοσίοις
  choice: несвятых
  rationale: Буквально и кратко передаёт противоположность святости, не смешивая слово со следующим βεβήλοις.
- source_word: βεβήλοις
  choice: оскверняющих святое
  rationale: Функционально передаёт отношение к священному как к обыденному или попираемому и яснее современному читателю, чем неоднозначное «непосвящённых».
- source_word: πατρολῴαις
  choice: убивающих отцов
  rationale: Редкое слово может означать нанесение побоев или убийство отца; в данном перечне вероятен более сильный смысл, а альтернативу сохраняет сноска.
- source_word: μητρολῴαις
  choice: убивающих матерей
  rationale: Параллельно πατρολῴαις; вероятный смысл — убийство матери, при сохранении возможного значения насильственного избиения в сноске.
- source_word: ἀνδροφόνοις
  choice: убийц
  rationale: Естественно обозначает совершающих преступное убийство и сохраняет отличие от двух предыдущих конкретных категорий.
theological_decisions:
- issue: Обобщающий характер δικαίῳ
  choice: для праведника
  alternative: для праведного человека; для праведных
  rationale: Греческая форма стоит в мужском роде и единственном числе, но употреблена обобщённо. «Праведник» сохраняет грамматическое число и не ограничивает утверждение только мужчинами.
- issue: Значение πατρολῴαις / μητρολῴαις
  choice: убивающих отцов / убивающих матерей
  alternative: избивающих отцов / избивающих матерей
  rationale: Оба редких слова допускают значение тяжёлого насилия над родителями, включая побои, однако контекст перечня тяжких нарушений и соседство с ἀνδροφόνοις поддерживают значение убийства. Неопределённость отмечена в сноске.
- issue: Соотношение ἀνοσίοις и βεβήλοις
  choice: несвятых и оскверняющих святое
  alternative: неблагочестивых и мирских; нечистых и кощунников
  rationale: 'Выбранная пара старается не сливать два близких понятия: первое обозначает отсутствие святости, второе — попрание границы священного.'
translation_notes:
