  text: θέλοντες εἶναι νομοδιδάσκαλοι, μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/007.yaml
  text: wanting to be teachers of the law[b][a], though they understand neither what they are saying nor the things about which they speak so confidently.
translation:
  language: ru
  text: Они хотят быть учителями Закона[a], хотя не понимают ни того, что говорят, ни того, о чём так уверенно утверждают.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Учителя Закона» — вероятно, те, кто претендовал на право авторитетно учить иудейскому Закону (Торе).
    reason: cultural_note
  - marker: b
    text: 'Или: «не понимая ни того, что говорят, ни того, о чём уверенно утверждают».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλοντες
  choice: желая
  rationale: Деепричастие передаёт продолжающееся стремление подразумеваемых лиц и сохраняет связь с предыдущим стихом.
- source_word: εἶναι
  choice: быть
  rationale: Обычный инфинитив при θέλοντες, естественно передаваемый сочетанием «желая быть».
- source_word: νομοδιδάσκαλοι
  choice: учителями Закона
  rationale: Сложное существительное обозначает учителей, связанных с законом. Прописная буква указывает на наиболее вероятную в контексте отсылку к иудейскому Закону, не добавляя в основной текст уточнения «Моисеев».
- source_word: μὴ νοοῦντες
  choice: хотя не понимают
  rationale: 'Причастный оборот имеет уступительный смысл: они стремятся учить, но не обладают пониманием. Союз «хотя» естественно выражает это противопоставление по-русски.'
- source_word: μήτε ... μήτε
  choice: ни ... ни
  rationale: Прямой и естественный русский эквивалент парной греческой отрицательной конструкции.
- source_word: ἃ λέγουσιν
  choice: того, что говорят
  rationale: Передаёт содержание их речи без ненужного усиления или конкретизации.
- source_word: περὶ τίνων
  choice: того, о чём
  rationale: Сохраняет различие между тем, что они произносят, и предметами, относительно которых они делают уверенные утверждения.
- source_word: διαβεβαιοῦνται
  choice: так уверенно заявляют
  rationale: Передаёт значение настойчивого, уверенного утверждения и критический оттенок контекста, оставаясь естественным для современного русского языка.
theological_decisions:
- issue: К чему относится Закон в νομοδιδάσκαλοι
  choice: «Закон» в основном тексте, с пояснением в сноске о вероятной отсылке к Торе
  alternative: «Моисеев Закон» или «Тора» непосредственно в основном тексте
  rationale: Контекст с высокой вероятностью указывает на иудейский Закон, однако само греческое сложное слово не содержит определения «Моисеев». Основной текст сохраняет лаконичность источника, а сноска сообщает культурный контекст.
- issue: Соотношение двух объектов непонимания
  choice: 'Сохранены две параллельные части: «что говорят» и «о чём ... заявляют»'
  alternative: 'Свести обе части к общему смыслу: «не понимают собственных уверенных утверждений»'
  rationale: Греческий текст формально различает содержание речи (ἃ λέγουσιν) и предмет уверенных утверждений (περὶ τίνων διαβεβαιοῦνται); перевод не устраняет возможное смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис следует греческой структуре, но уступительная связь выражена явно ради естественности и ясности.
