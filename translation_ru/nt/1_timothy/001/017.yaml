base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: ru
  text: Царю веков — нетленному, невидимому, единственному Богу[a] — честь и слава во веки веков. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «единственному мудрому Богу».'
    reason: textual_variant
lexical_decisions:
- source_word: βασιλεῖ τῶν αἰώνων
  choice: Царю веков
  rationale: Сохраняет образ Бога как Царя и форму родительного падежа, не сводя αἰῶνες только к отвлечённой идее вечности.
- source_word: ἀφθάρτῳ
  choice: нетленному
  rationale: Передаёт неподверженность тлению и гибели; это естественное и устоявшееся русское слово в возвышенном библейском контексте.
- source_word: ἀοράτῳ
  choice: невидимому
  rationale: Прямой и понятный эквивалент, сохраняющий смысл греческого прилагательного.
- source_word: μόνῳ θεῷ
  choice: единому Богу
  rationale: Передаёт исключительность Бога и естественно входит в ряд определений; не добавляет отсутствующее в основном греческом тексте слово «мудрому».
- source_word: τιμὴ καὶ δόξα
  choice: честь и слава
  rationale: Точно и идиоматично передаёт традиционную доксологическую пару.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устоявшаяся и естественная русская формула, выражающая бесконечную продолжительность.
- source_word: ἀμήν
  choice: Аминь
  rationale: Сохранена общепринятая русская богослужебная и библейская передача.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь частица отмечает переход к славословию; в самостоятельной русской формулировке её явная передача словом «же» звучала бы менее естественно и не добавляла бы существенного смысла.
theological_decisions:
- issue: Передача монотеистического утверждения μόνῳ θεῷ
  choice: единому Богу
  alternative: одному Богу
  rationale: Формулировка прямо сохраняет исключительность Бога, не внося дополнительных догматических пояснений и не снимая богословского напряжения контекста.
- issue: Разночтение с σοφῷ («мудрому» / «премудрому»)
  choice: не включать слово в основной текст
  alternative: единому премудрому Богу
  rationale: В предоставленном тексте SBLGNT слово σοφῷ отсутствует; известное более длинное чтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным доксологическим звучанием. Тире ясно оформляют ряд приложений и помогают избежать синтаксической двусмысленности.
