  text: Οἴδαμεν δὲ ὅτι καλὸς ὁ νόμος ἐάν τις αὐτῷ νομίμως χρῆται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/008.yaml
  text: We know that the law is good[a], if one uses it lawfully,
translation:
  language: ru
  text: Мы же знаем, что закон хорош, если кто-либо пользуется им законно[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если кто-либо пользуется им правильно»; или: «если кто-либо пользуется им надлежащим образом».'
    reason: Лексема νομίμως может указывать как на соответствие закону, так и шире — на правильное, правомерное употребление.
lexical_decisions:
- source_word: Οἴδαμεν
  choice: мы знаем
  rationale: Форма οἶδα имеет значение настоящего времени и выражает устойчивое знание; «мы знаем» — точная и естественная передача.
- source_word: δὲ
  choice: же
  rationale: Частица обозначает мягкий переход или умеренное противопоставление. Постпозитивное «же» сохраняет эту связь, не усиливая её до резкого «но».
- source_word: καλὸς
  choice: хорош
  rationale: В данном контексте слово положительно характеризует закон; «хорош» естественно передаёт широкий смысл καλός без ненужного уточнения.
- source_word: ὁ νόμος
  choice: закон
  rationale: Перевод сохраняет определённое обозначение закона, не уточняя в основном тексте, идёт ли речь именно о Моисеевом законе или о законе как категории.
- source_word: ἐάν τις
  choice: если кто-либо
  rationale: Передаёт общее условие и неопределённое местоимение единственного числа, оставаясь естественным в современном русском языке.
- source_word: αὐτῷ
  choice: им
  rationale: Местоимение относится к слову «закон» и при глаголе «пользоваться» закономерно ставится в творительном падеже.
- source_word: νομίμως
  choice: законно
  rationale: '«Законно» передаёт значение соответствия закону или установленной норме и сохраняет словесную связь νομίμως с νόμος: «закон — законно».'
- source_word: χρῆται
  choice: пользуется
  rationale: Глагол χράομαι означает «пользоваться, употреблять»; выбранный вариант точен и естественно сочетается с творительным падежом.
theological_decisions:
- issue: Объём понятия «закон»
  choice: В основном тексте оставлено просто «закон».
  alternative: «Моисеев закон» или «закон вообще».
  rationale: Контекст, вероятно, прежде всего указывает на Моисеев закон, однако греческий текст не содержит такого уточнения. Перевод сохраняет смысловую открытость.
- issue: Значение νομίμως
  choice: «законно»
  alternative: «правильно» или «надлежащим образом»
  rationale: Выбранный вариант сохраняет риторическую связь со словом «закон», но не определяет, в чём именно состоит должное применение закона.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и достойная по тону. Конструкция «закон… законно» намеренно сохраняет однокоренную игру греческих νόμος и νομίμως. Маркер сноски поставлен непосредственно после выражения, к которому относится примечание.
