    reason: alternative_reading
lexical_decisions:
- source_word: ἔχων
  choice: храня
  rationale: Причастие настоящего времени указывает на продолжающееся действие подразумеваемого адресата; «храня» естественно передаёт деятельное сохранение веры и доброй совести.
- source_word: πίστιν
  choice: веру
  rationale: В данном контексте слово естественнее всего обозначает христианскую веру; возможный оттенок доверия не требует отдельного выражения в основном тексте.
- source_word: ἀγαθὴν συνείδησιν
  choice: добрую совесть
  rationale: Прямой и прозрачный перевод, сохраняющий нравственный смысл ἀγαθή; «чистую совесть» было бы более узким толкованием.
- source_word: ἥν
  choice: которую
  rationale: Форма женского рода единственного числа грамматически и по ближайшему антецеденту указывает прежде всего на «совесть».
- source_word: ἀπωσάμενοι
  choice: отвергли
  rationale: Передаёт намеренное отталкивание или отвержение без неестественной для современного русского буквальности.
- source_word: περὶ τὴν πίστιν
  choice: в вере
  rationale: Кратко и естественно обозначает сферу, в которой произошло метафорическое кораблекрушение; артикль допускает понимание христианской веры.
- source_word: ἐναυάγησαν
  choice: потерпели кораблекрушение
  rationale: Сохраняет яркую морскую метафору греческого глагола и звучит естественно в современном литературном русском.
theological_decisions:
- issue: К чему относится ἥν
  choice: Относительное местоимение относится непосредственно к «доброй совести».
  alternative: Оно может обобщённо относиться к вере и доброй совести вместе.
  rationale: Женский род единственного числа и ближайший антецедент συνείδησιν наиболее прямо поддерживают первое понимание, однако более широкий смысл синтаксически и контекстуально полностью исключать нельзя.
- issue: Значение περὶ τὴν πίστιν
  choice: «в вере» — кораблекрушение произошло в сфере веры.
  alternative: «в отношении веры» или «что касается веры».
  rationale: Основной вариант естественнее по-русски и сохраняет метафору, не уточняя сверх текста, идёт ли речь преимущественно о личной вере или о христианской вере как содержании исповедания.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и морской метафоры оригинала. Синтаксис согласован с продолжением наставления из предыдущего стиха; формулировка не вводит причинной связи, прямо не выраженной в греческом тексте.
