  text: ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/020.yaml
  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: ru
  text: Среди них — Именей и Александр, которых я предал Сатане[a], чтобы они научились[b] не богохульствовать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отдал Сатане».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово может означать обучение, воспитание, вразумление или исправление посредством взыскания.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: Среди них
  rationale: Передаёт партитивное значение родительного относительного местоимения и естественно связывает стих с ранее упомянутыми людьми.
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: Именей и Александр
  rationale: Использованы закрепившиеся в русской библейской традиции формы личных имён.
- source_word: παρέδωκα
  choice: я предал
  rationale: Кратко и точно передаёт аорист παραδίδωμι; прошедшее время естественно для русского повествования и не навязывает конкретный церковный механизм.
- source_word: τῷ Σατανᾷ
  choice: Сатане
  rationale: Передаёт личное обозначение Σατανᾶς обычной русской формой; прописная буква подчёркивает употребление как имени.
- source_word: ἵνα παιδευθῶσι
  choice: чтобы они научились
  rationale: παιδεύω охватывает обучение, воспитание и исправляющее взыскание. Возвратная конструкция естественна по-русски и сохраняет направленность на исправление, не уточняя способ воздействия.
- source_word: μὴ βλασφημεῖν
  choice: не богохульствовать
  rationale: В данном контексте глагол указывает на речь, оскорбляющую Бога или веру; «богохульствовать» сохраняет религиозную серьёзность выражения.
theological_decisions:
- issue: Значение выражения «предал Сатане»
  choice: Фраза сохранена буквально; цель последующего воздействия представлена как исправительная.
  alternative: Чудесное причинение телесного страдания или окончательное осуждение.
  rationale: Целевая конструкция ἵνα παιδευθῶσι указывает на вразумление и исправление, однако сам текст не объясняет ни механизма, ни точной формы этого действия.
- issue: Оттенок παιδευθῶσι
  choice: «научились» с пояснением в сноске об исправляющем воздействии.
  alternative: «были наказаны», «были вразумлены» или «прошли исправительное взыскание».
  rationale: «Научились» не сводит многозначный глагол только к карательному смыслу, а сноска сохраняет присутствующий в контексте оттенок дисциплины и исправления.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. Синтаксис остаётся близким к греческому, но не выглядит искусственным; богословски нагруженная фраза «предал Сатане» не истолкована внутри основного текста.
