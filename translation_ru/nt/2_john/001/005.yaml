  text: καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν ⸂καινὴν γράφων σοι⸃ ἀλλὰ ἣν εἴχομεν ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/005.yaml
  text: 'And now I ask you[a], lady, not as though I were writing to you a new commandment, but the one we have had from the beginning: that we love one another.'
translation:
  language: ru
  text: И теперь прошу тебя[a], госпожа, не потому, что пишу тебе новую заповедь, но ту, которую мы имели от начала, — чтобы мы любили друг друга.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возможно, «госпожа» образно обозначает церковь; некоторые понимают «Кирия» как собственное имя.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: прошу
  rationale: В данном эпистолярном контексте передаёт значение просьбы без усиления до «настоятельно призываю»; по-русски звучит естественнее буквального «спрашиваю».
- source_word: κυρία
  choice: госпожа
  rationale: Прямое обращение, соответствующее звательной форме существительного «госпожа/владычица»; сохраняет возможность понимать адресата как конкретную женщину, образ церкви или, менее вероятно, имя.
- source_word: ἐντολὴν καινὴν
  choice: новую заповедь
  rationale: Устойчивый и точный перевод, сохраняющий связь с употреблением этой формулы в Иоанновых текстах.
- source_word: γράφων σοι
  choice: я пишу тебе
  rationale: Русская личная конструкция естественно передаёт причастный оборот внутри противопоставления οὐχ ὡς ... ἀλλά.
- source_word: ἣν εἴχομεν
  choice: ту, которую мы имели
  rationale: Сохраняет значение имперфекта εἴχομεν и не добавляет явно выраженного в русском продолженного обладания, хотя контекст допускает его.
- source_word: ἀπ’ ἀρχῆς
  choice: от начала
  rationale: Сохраняет характерную для Иоанновых текстов формулу и её литературно-богословскую связь с другими местами.
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  choice: чтобы мы любили друг друга
  rationale: Передаёт ἵνα с сослагательным наклонением как содержание заповеди, сохраняя также оттенок побуждения.
theological_decisions:
- issue: Кого обозначает κυρία
  choice: Перевести буквально как «госпожа», не отождествляя адресата однозначно ни с отдельной женщиной, ни с церковью.
  alternative: Понять слово как образное обозначение поместной церкви либо как собственное имя Кирия.
  rationale: Греческий текст допускает несколько толкований; основной перевод сохраняет эту подлинную неоднозначность, а примечание сообщает основные возможности.
- issue: Временной оттенок εἴχομεν
  choice: «которую мы имели»
  alternative: «которая у нас есть от начала» или «которую мы имеем от начала»
  rationale: Имперфект буквально указывает на обладание в прошлом; выражение «от начала» в контексте может подразумевать продолжающуюся значимость, но перевод не должен незаметно заменять грамматическую форму настоящим временем.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского послания. Синтаксис слегка сглажен для ясности, но противопоставление «не новую… но ту…» и неоднозначность обращения сохранены.
