  source_fidelity: 'Смысл в целом передан верно: ἐρωτῶ — «прошу», κυρία — «госпожа», «новую заповедь», «от начала» и призыв к взаимной любви сохранены. Однако греческое противопоставление οὐχ ὡς ... γράφων σοι ἀλλά ... означает «не как если бы я писал тебе новую заповедь, но [как уже известную] ту, которую...». В черновике «я пишу тебе не новую заповедь, но ту...» прямо утверждается, что автор пишет заповедь, и устраняет сравнительный оборот ὡς.'
