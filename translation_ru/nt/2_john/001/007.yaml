  source_fidelity: 'Основной смысл передан верно: πολλοὶ πλάνοι — «много обманщиков», ὁμολογοῦντες — «исповедуют», а «во плоти» сохраняет существенное выражение ἐν σαρκί. Однако «грядущего» в современном русском преимущественно означает будущего, тогда как настоящее причастие ἐρχόμενον означает «приходящего/идущего» и не требует будущего значения. Его следует передать как «приходящего», сохранив аспект и спорную интерпретационную открытость. Конструкция «Иисуса как Мессию» допустима, но несколько ослабляет прямое титульное сочетание Ἰησοῦν Χριστόν; apposition «Иисуса, Мессию» яснее представляет Мессию как титул.'
