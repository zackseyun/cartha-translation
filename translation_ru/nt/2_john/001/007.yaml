source:
  edition: SBLGNT
  text: ὅτι πολλοὶ πλάνοι ⸀ἐξῆλθον εἰς τὸν κόσμον, οἱ μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί· οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/007.yaml
  text: For many deceivers have gone out into the world[a], those who do not confess Jesus the Messiah coming in the flesh[b]. This is the deceiver and the antichrist.
translation:
  language: ru
  text: Потому что много обманщиков вышло в мир[a], которые не исповедуют Иисуса, Мессию, приходящего во плоти[b]. Такой человек — обманщик и антихрист.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заблуждающих». Греческое слово обозначает людей, которые вводят других в заблуждение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пришедшего во плоти». Буквально по-гречески: «приходящего во плоти»; такая формулировка подчёркивает исповедание подлинного телесного человечества Иисуса-Мессии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Потому что
  rationale: Союз вводит основание предшествующего наставления; «потому что» естественно передаёт причинно-пояснительную связь.
- source_word: πολλοὶ πλάνοι
  choice: много обманщиков
  rationale: πλάνος обозначает тех, кто вводит других в заблуждение; «обманщики» сохраняет активный смысл и связь с единственным числом далее.
- source_word: ἐξῆλθον εἰς τὸν κόσμον
  choice: в мир вышло
  rationale: Передаёт появление и распространение этих людей в мире без добавления идеи «мировой системы».
- source_word: οἱ μὴ ὁμολογοῦντες
  choice: которые не исповедуют
  rationale: «Исповедуют» сохраняет публичный и содержательный характер ὁμολογέω, а придаточное предложение звучит естественно по-русски.
- source_word: Ἰησοῦν Χριστόν
  choice: Иисуса как Мессию
  rationale: Χριστός здесь имеет титульный смысл и входит в содержание исповедания; конструкция с «как» ясно показывает, что Мессия — титул Иисуса.
- source_word: ἐρχόμενον
  choice: грядущего
  rationale: Сохраняет форму настоящего причастия и намеренно не сводит выражение к завершённому прошедшему событию.
- source_word: ἐν σαρκί
  choice: во плоти
  rationale: Традиционное и точное выражение, обозначающее подлинное телесное человечество, а не «греховную природу».
- source_word: οὗτός ἐστιν
  choice: Такой человек —
  rationale: Единственное число обобщает любого представителя названной группы; «такой человек» естественно передаёт этот индивидуализирующий смысл.
- source_word: ὁ πλάνος καὶ ὁ ἀντίχριστος
  choice: обманщик и антихрист
  rationale: Сохраняется лексическая связь с πλάνοι и общепринятый термин «антихрист».
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном исповедальном высказывании слово явно функционирует как титул; перевод «Мессия» делает это понятным, не добавляя конфессиональной интерпретации.
- issue: Временной и аспектуальный смысл ἐρχόμενον ἐν σαρκί
  choice: грядущего во плоти
  alternative: пришедшего во плоти
  rationale: Греческий текст имеет причастие настоящего времени «идущего/приходящего». Основной текст сохраняет эту форму и связанную с ней неоднозначность; распространённое понимание как уже совершившегося воплощения отмечено в сноске.
- issue: Значение σάρξ
  choice: плоть в смысле реального телесного человечества
  alternative: греховная природа
  rationale: Христологический контекст говорит о реальном воплощении и не допускает значения «греховная природа».
- issue: Единственное οὗτος после множественного описания
  choice: Такой человек
  alternative: Это
  rationale: Формулировка индивидуализирует любого, кто соответствует предшествующему описанию, не утверждая без основания, что речь идёт об одном конкретном лице.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Сохранены ключевые термины «исповедуют», «Мессия», «во плоти» и «антихрист». Синтаксис сделан понятным для обычного читателя; подлинная неоднозначность причастия ἐρχόμενον сохранена в тексте и пояснена сноской.
