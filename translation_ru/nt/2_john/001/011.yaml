  text: For the one who says to him[a], “Greetings,” shares in his evil works.
translation:
  language: ru
  text: 'Ибо тот, кто говорит ему: «Приветствую!»[a], участвует в его злых делах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Радуйся». Греческое χαίρειν — обычная формула приветствия; в данном контексте речь идёт не просто об обмене любезностями, а о приветливом приёме, который может выражать поддержку или одобрение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: тот, кто говорит
  rationale: Артикль с причастием употреблён субстантивированно и имеет обобщающий смысл; эта формулировка естественно передаёт его по-русски.
- source_word: γάρ
  choice: ибо
  rationale: Союз вводит обоснование запрета из предыдущего стиха; «ибо» кратко сохраняет пояснительную связь и соответствует достойному литературному регистру.
- source_word: αὐτῷ
  choice: ему
  rationale: Местоимение отсылает к человеку, упомянутому в предыдущем стихе; перевод не конкретизирует референта сверх исходного текста.
- source_word: χαίρειν
  choice: «Приветствую тебя»
  rationale: После λέγων инфинитив служит устойчивой формулой приветствия. Русская прямая речь передаёт функцию выражения естественнее, чем буквальное «радоваться».
- source_word: κοινωνεῖ
  choice: участвует в
  rationale: Глагол с дательным падежом обозначает участие или причастность. «Участвует в» ясно передаёт нравственную сопричастность, не привнося специального церковного значения.
- source_word: τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς
  choice: в его злых делах
  rationale: Сочетание обозначает дела этого человека, охарактеризованные как злые; перевод сохраняет обычные соответствия для ἔργα и πονηρός.
theological_decisions:
- issue: Означает ли приветствие простую вежливость или выражение поддержки, ведущее к сопричастности
  choice: Основной текст сохраняет обычную формулу приветствия и прямо связывает её с участием в злых делах; примечание указывает на значение приветствия в данном контексте.
  alternative: Понимать стих как безусловный запрет любого вежливого приветствия такого человека при любых обстоятельствах.
  rationale: Само χαίρειν является формулой приветствия, однако κοινωνεῖ и ближайший контекст приёма в доме в стихе 10 указывают на сопричастность через гостеприимство и поддержку. Это поясняется без расширительного пересказа в основном тексте.
translation_notes:
  register: Современный литературный русский язык с краткой, ясной синтаксической структурой. «Ибо» сохраняет достойный библейский регистр без архаизации; прямая речь естественно передаёт греческую формулу приветствия.
