base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/002.yaml
  text: because of the truth that remains in us and will be with us forever[a].
translation:
  language: ru
  text: благодаря истине, которая пребывает в нас и будет с нами вовеки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остаётся в нас».'
    reason: 'Лексическая альтернатива для μένω: «остаётся» звучит более нейтрально, тогда как «пребывает» лучше сохраняет длительный смысл и связь с Иоанновой лексикой.'
lexical_decisions:
- source_word: διὰ τὴν ἀλήθειαν
  choice: ради истины
  rationale: Сочетание διά с винительным указывает на основание или причину любви, упомянутой в предыдущем стихе. «Ради истины» естественно связывает этот стих с предыдущим и не сужает значение слова «истина».
- source_word: τὴν μένουσαν
  choice: которая пребывает
  rationale: Настоящее причастие от μένω выражает продолжающееся присутствие. «Пребывает» сохраняет длительный и характерный для Иоанновых текстов смысл, оставаясь понятным в современном литературном русском языке.
- source_word: ἐν ἡμῖν
  choice: в нас
  rationale: Буквально и естественно передаёт ἐν с дательным падежом, не заменяя внутреннее присутствие более широким значением «среди нас».
- source_word: καὶ μεθ’ ἡμῶν ἔσται
  choice: и будет с нами
  rationale: Точно передаёт μετά с родительным и будущее время ἔσται; добавлять здесь «пребывать» не требуется, поскольку этот смысл уже выражен предыдущим причастием.
- source_word: εἰς τὸν αἰῶνα
  choice: вовеки
  rationale: Устойчиво и ёмко передаёт неограниченную продолжительность; форма соответствует достоинству библейского регистра и понятна современному читателю.
theological_decisions:
- issue: Богословский смысл слова ἀλήθεια
  choice: истина
  alternative: евангельская истина; истинное учение
  rationale: Греческий текст не уточняет, обозначает ли здесь «истина» благую весть, учение, Божье откровение или более широкую реальность. Простое «истина» сохраняет эту смысловую глубину и неоднозначность.
- issue: Характер пребывания истины
  choice: в нас
  alternative: среди нас
  rationale: Перевод «в нас» сохраняет возможность как личного, так и общинного понимания, не сводя выражение исключительно к присутствию истины внутри общины.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет зависимость стиха от предыдущего предложения; «вовеки» выбрано как краткое и понятное выражение постоянства.
