source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/001.yaml
  text: The elder[a], to the chosen lady and her children, whom I love in truth—and not I alone[b], but also all who have come to know the truth—
translation:
  language: ru
  text: Старейшина — избранной госпоже[a] и её детям, которых я люблю в истине[b], — и не только я, но и все познавшие истину, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «избранной Кирии». Некоторые понимают «госпожу» как образ поместной общины, а некоторые считают «Кирию» личным именем.'
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «которых я истинно люблю»; выражение может иметь и характерный для Иоанна смысл «люблю в истине».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: Старейшина
  rationale: В начале письма слово служит самоназванием, указывающим на признанное положение или руководство, но может сохранять оттенок старшинства по возрасту. «Старейшина» естественнее и менее конфессионально нагружено, чем «пресвитер».
- source_word: ἐκλεκτῇ
  choice: избранной
  rationale: Передаёт значение избрания и применимо как к конкретной женщине, так и к олицетворённой общине.
- source_word: κυρίᾳ
  choice: госпоже
  rationale: Обычное значение существительного — «госпожа». Написание со строчной буквы не превращает неоднозначное греческое обращение в личное имя.
- source_word: τοῖς τέκνοις αὐτῆς
  choice: её детям
  rationale: τέκνα обозначает детей без указания пола. Формулировка подходит как для буквальной семьи, так и для членов общины при метафорическом понимании.
- source_word: οὓς
  choice: которых
  rationale: Мужской род множественного числа в греческом естественно относится к детям или ко всей группе как к людям; русская форма сохраняет личное отнесение.
- source_word: ἀγαπῶ
  choice: люблю
  rationale: Прямой и естественный эквивалент без отсутствующего в греческом усиления.
- source_word: ἐν ἀληθείᾳ
  choice: в истине
  rationale: Сохраняет как возможный смысл искренности, так и характерный для Иоанна смысл пребывания в истине, не сводя выражение только к наречию «истинно».
- source_word: οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες
  choice: и не только я, но и все
  rationale: Естественно передаёт греческое противопоставление автора всем остальным знающим истину.
- source_word: οἱ ἐγνωκότες
  choice: познавшие
  rationale: Результативное значение перфектного причастия передано формой, указывающей на состоявшееся познание с сохраняющимся результатом.
- source_word: τὴν ἀλήθειαν
  choice: истину
  rationale: Сохраняет обычное и богословски насыщенное иоанновское употребление слова «истина».
theological_decisions:
- issue: Кого обозначает ἐκλεκτῇ κυρίᾳ
  choice: Основной текст выглядит как обращение к избранной госпоже, не исключая олицетворения поместной общины.
  alternative: Конкретная христианка; олицетворённая община и её члены; «Кирия» как личное имя.
  rationale: Греческий допускает все эти понимания. Перевод не должен без достаточных оснований разрешать эту неоднозначность.
- issue: Смысл ἐν ἀληθείᾳ
  choice: «в истине»
  alternative: «истинно», «поистине» или «в Истине»
  rationale: Выбранная формулировка сохраняет одновременно оттенок искренности и характерное для Иоанна богословское звучание, не добавляя отсутствующего в греческом артикля.
translation_notes:
  register: Современный литературный русский язык с достоинством эпистолярного вступления. Тире отражают незавершённый синтаксис стиха, который продолжается далее. Термины подобраны так, чтобы не навязывать конфессиональную трактовку.
