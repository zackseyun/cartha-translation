  yaml_path: translation/nt/2_john/001/013.yaml
  text: The children of your chosen sister greet you.
translation:
  language: ru
  text: Приветствуют тебя дети твоей избранной сестры.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: Приветствуют
  rationale: Естественная русская формула передачи приветствия; сказуемое согласовано по смыслу с подлежащим среднего рода множественного числа τὰ τέκνα.
- source_word: τὰ τέκνα
  choice: дети
  rationale: Прямое и естественное соответствие; в контексте сохраняет возможность как буквального, так и образного понимания.
- source_word: ἐκλεκτῆς
  choice: избранной
  rationale: Передаёт значение «избранная, выбранная» и сохраняет связь с обращением в стихе 1, не уточняя, кем именно она избрана.
theological_decisions:
- issue: Буквальное или образное обозначение сестры и её детей
  choice: Сохранить «сестры» и «дети» без поясняющей интерпретации
  alternative: Передать как церковь и её членов
  rationale: Греческий текст допускает понимание как конкретных лиц, так и образного обозначения общин; перевод не должен устранять эту неоднозначность.
- issue: Смысл ἐκλεκτῆς
  choice: «избранной»
  alternative: «выбранной»
  rationale: «Избранной» естественно в библейском регистре и сохраняет возможный богословский оттенок, не добавляя отсутствующего в тексте указания на действующее лицо.
translation_notes:
  register: Краткая, современная и достойная заключительная формула. Порядок слов слегка приспособлен к естественному русскому синтаксису; местоимение «тебя» сохраняет единственное число оригинала.
