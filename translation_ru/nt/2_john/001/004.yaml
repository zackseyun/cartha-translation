  text: Ἐχάρην λίαν ὅτι εὕρηκα ἐκ τῶν τέκνων σου περιπατοῦντας ἐν ἀληθείᾳ, καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/004.yaml
  text: I rejoiced greatly that I have found some of your children walking in the truth[b][a], just as we received a commandment from the Father.
translation:
  language: ru
  text: Я очень обрадовался, обнаружив, что некоторые из твоих детей[b] живут в истине[a], согласно заповеди, которую мы получили от Отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ходят в истине». Речь идёт об образе жизни, согласном с истиной, а не только об искренности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из числа твоих детей». Греческое выражение указывает на некоторых из них, не обязательно на всех.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην λίαν
  choice: Я очень обрадовался
  rationale: Аорист Ἐχάρην передаёт возникшую реакцию радости, а λίαν усиливает её. Такая формулировка естественна в современном русском и сохраняет возвышенный тон.
- source_word: εὕρηκα
  choice: обнаружив
  rationale: Перфект указывает на состоявшееся обнаружение с сохраняющейся значимостью результата. Русское деепричастие естественно связывает это обстоятельство с радостью, не превращая εὕρηκα в глагол случайной встречи.
- source_word: ἐκ τῶν τέκνων σου
  choice: некоторые из твоих детей
  rationale: Конструкция ἐκ с родительным падежом имеет партитивный смысл и обозначает часть детей, не утверждая, что речь идёт обо всех.
- source_word: περιπατοῦντας
  choice: живут
  rationale: Буквально глагол означает «ходят», но здесь это устойчивое этическое употребление со значением образа жизни. «Живут» ясно передаёт смысл современному русскому читателю; метафорический вариант отмечен в сноске.
- source_word: ἐν ἀληθείᾳ
  choice: по истине
  rationale: Выражение описывает жизнь, согласующуюся с истиной, а не только искренность. «По истине» сохраняет связь с истиной как нормой жизни и не требует добавлять отсутствующий в греческом артикль.
- source_word: καθὼς
  choice: как … и
  rationale: Конструкция естественно выражает соответствие поведения полученной заповеди.
- source_word: ἐντολὴν ἐλάβομεν
  choice: мы и получили заповедь
  rationale: Сохраняются аорист, первое лицо множественного числа и значимый для Иоанновых писаний термин «заповедь».
- source_word: παρὰ τοῦ πατρός
  choice: от Отца
  rationale: Перевод сохраняет данное в тексте именование без пояснительного добавления «Бога».
theological_decisions:
- issue: Смысл выражения ἐν ἀληθείᾳ
  choice: живут по истине
  alternative: ходят в истине; живут истинно
  rationale: Выбранный вариант указывает на жизнь в согласии с открытой истиной, но сноска сохраняет пространственно-этическую метафору оригинала и его возможную формальную передачу.
- issue: Объём выражения «твои дети»
  choice: некоторые из твоих детей
  alternative: твои дети
  rationale: Партитивное ἐκ прямо указывает на некоторую часть группы; перевод не должен распространять утверждение на всех детей.
- issue: Кого обозначает «Отец»
  choice: от Отца
  alternative: от Бога Отца
  rationale: Оригинал содержит только титул «Отец». Его богословский референт ясен из контекста, но добавлять отсутствующее слово «Бог» не следует.
translation_notes:
  register: Современный литературный русский с уважительным библейским звучанием. Местоимение «твоих» оставлено со строчной буквы как обращение к адресату послания; «Отец» пишется с прописной как титул Бога. Этическая метафора «ходить» раскрыта в основном тексте как «жить», а буквальная форма сохранена в сноске.
