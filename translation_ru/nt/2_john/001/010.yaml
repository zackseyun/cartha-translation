  text: εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν καὶ χαίρειν αὐτῷ μὴ λέγετε·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/010.yaml
  text: If anyone comes to you and does not bring this teaching, do not receive him into your house, and do not say a greeting to him.
translation:
  language: ru
  text: Если кто-нибудь приходит к вам и не приносит этого учения[b], не принимайте его в дом и не приветствуйте его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не говорите ему: “Радуйся!”»; χαίρειν было обычной греческой формулой приветствия.'
    reason: 'Лексическая альтернатива: поясняет буквальную форму греческого выражения χαίρειν αὐτῷ μὴ λέγετε.'
  - marker: b
    text: В данном контексте речь идёт о человеке, который приходит без «этого учения», вероятно о странствующем учителе, чья проповедь расходится с апостольским исповеданием, описанным в соседних стихах.
    reason: 'Контекстуальное пояснение: уточняет ближайший литературный контекст, не сужая запрет в основном тексте.'
lexical_decisions:
- source_word: εἴ τις
  choice: Если кто-нибудь
  rationale: Передаёт неопределённое условие и общий характер случая естественным современным русским языком.
- source_word: ἔρχεται πρὸς ὑμᾶς
  choice: приходит к вам
  rationale: Прямо передаёт движение к адресатам, не добавляя в основной текст предположений о церковном или частном характере прихода.
- source_word: ταύτην τὴν διδαχήν
  choice: этого учения
  rationale: «Учение» естественно передаёт διδαχή как содержание наставления; указательное местоимение сохранено. Родительный падеж обусловлен русским управлением после отрицания.
- source_word: οὐ φέρει
  choice: не приносит
  rationale: Сохраняет образ греческого φέρω и естественно сочетается с распространением учения.
- source_word: μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν
  choice: не принимайте его в дом
  rationale: Передаёт конкретный язык приёма и гостеприимства, не сужая и не расширяя запрет толкованием.
- source_word: χαίρειν αὐτῷ μὴ λέγετε
  choice: не приветствуйте его
  rationale: 'Естественный русский эквивалент формулы «не говорите ему: “Радуйся/Приветствую”»; буквальная форма разъяснена в сноске.'
theological_decisions:
- issue: Объём запрета в отношении человека, не приносящего этого учения
  choice: Сохранён конкретный запрет принимать его в дом и приветствовать его без поясняющего расширения или сужения в основном тексте.
  alternative: Истолковать это либо как запрет всякого общения, либо исключительно как запрет официального церковного гостеприимства странствующему учителю.
  rationale: Контекст указывает на лжеучителей и возможное содействие их деятельности, однако сам стих сохраняет конкретные выражения о доме и приветствии; перевод не разрешает эту напряжённость за читателя.
- issue: Передача мужского единственного αὐτόν / αὐτῷ
  choice: его
  alternative: такого человека / их
  rationale: Русское мужское местоимение сохраняет грамматическую форму источника и относится к неопределённому «кто-нибудь».
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достойный. «Не приветствуйте» предпочтено буквальному, но неестественному «не говорите ему приветствие»; исходная формула сохранена в сноске. Выражение «в дом» не снабжено добавленным притяжательным местоимением, которого нет в греческом тексте.
