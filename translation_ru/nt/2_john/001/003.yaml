  text: ἔσται μεθ’ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ ⸀παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/003.yaml
  text: Grace[a], mercy, and peace will be with us from God the Father and from Jesus the Messiah, the Father's Son[b], in truth and love.
translation:
  language: ru
  text: Благодать, милость и мир будут с нами от Бога Отца и от Иисуса — Мессии, Сына Отца, в истине и любви.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσται
  choice: будут
  rationale: Будущее время изъявительного наклонения передано прямо; множественное число согласуется в русском с однородными подлежащими «благодать, милость и мир».
- source_word: μεθ’ ἡμῶν
  choice: с нами
  rationale: μετά с родительным падежом здесь естественно означает совместность; выражение подходит для эпистолярного благословения.
- source_word: χάρις ἔλεος εἰρήνη
  choice: благодать, милость и мир
  rationale: Сохранены последовательность и традиционные, понятные русские соответствия трём подлежащим.
- source_word: παρὰ θεοῦ πατρός
  choice: от Бога Отца
  rationale: παρά с родительным указывает на источник; притяжательное местоимение, отсутствующее в греческом, не добавлено.
- source_word: παρὰ Ἰησοῦ Χριστοῦ
  choice: от Иисуса Мессии
  rationale: παρά вновь обозначает источник, а Χριστός передано как титул «Мессия», а не как транслитерация.
- source_word: τοῦ υἱοῦ τοῦ πατρός
  choice: Сына Отца
  rationale: Прямо сохраняется определённое родственное обозначение и приложение, отождествляющее Иисуса Мессию с Сыном Отца.
- source_word: ἐν ἀληθείᾳ καὶ ἀγάπῃ
  choice: в истине и любви
  rationale: Предлог ἐν передан как «в»; существительные без артикля сохранены без добавочного определения.
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: Χριστός здесь является титулом Иисуса; перевод «Мессия» раскрывает значение титула и не сводит его к привычной транслитерации.
- issue: Связь выражения τοῦ υἱοῦ τοῦ πατρός с Иисусом
  choice: 'Приложение: «Иисуса Мессии, Сына Отца»'
  alternative: Более свободное описательное присоединение после имени Иисуса
  rationale: Греческая генитивная группа естественно выступает приложением, прямо называя Иисуса Мессию Сыном Отца, без добавления вне-текстовых догматических формулировок.
translation_notes:
  register: Современный литературный русский язык с достоинством эпистолярного благословения. Синтаксис близок к греческому, но естественен по-русски; богословская формула и повтор источника («от… и от…») сохранены.
