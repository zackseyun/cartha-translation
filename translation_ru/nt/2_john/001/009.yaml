language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πᾶς ὁ ⸀προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ ⸀διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/009.yaml
  text: Everyone who goes on ahead and does not remain in the teaching of Messiah does not have God[a]. The one who remains in the teaching[b], this one has both the Father and the Son.
translation:
  language: ru
  text: Всякий, кто идёт дальше и не остаётся в учении Мессии[a], не имеет Бога. Кто остаётся в этом учении[b], тот имеет и Отца, и Сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «забегает вперёд», «заходит слишком далеко». В некоторых рукописях вместо «идёт дальше» стоит «преступает».'
    reason: textual_variant
  - marker: b
    text: Выражение «учение Мессии» может означать как учение, данное Мессией, так и учение о Мессии.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ προάγων
  choice: Всякий, кто идёт дальше
  rationale: Артиклированное причастие с πᾶς обозначает любого человека такого рода. «Идёт дальше» сохраняет образ движения вперёд и допускает контекстуальный смысл выхода за пределы истинного учения, не подменяя исходное προάγων более резким вариантом «преступает».
- source_word: μὴ μένων
  choice: не остаётся
  rationale: Передаёт ключевой для Иоанновых текстов глагол μένω современным и естественным русским словом, сохраняя смысл пребывания и верности.
- source_word: ἐν τῇ διδαχῇ τοῦ Χριστοῦ
  choice: в учении Мессии
  rationale: «Учение» доступнее и естественнее, чем конфессионально окрашенное «доктрина». Родительный падеж «Мессии» сохраняет возможность понимать выражение и как учение, данное Мессией, и как учение о Мессии.
- source_word: θεὸν οὐκ ἔχει
  choice: не имеет Бога
  rationale: Сохраняет краткую и резкую формулировку оригинала, не добавляя толкования вроде «не имеет общения с Богом».
- source_word: ὁ μένων ἐν τῇ διδαχῇ
  choice: Кто остаётся в этом учении
  rationale: Естественно передаёт субстантивированное причастие и сохраняет параллелизм с первой частью. Указательное «этом» ясно отсылает к уже названному учению Мессии.
- source_word: οὗτος
  choice: тот
  rationale: Русская соотносительная конструкция «кто… тот» естественно передаёт подчёркнутое οὗτος.
- source_word: καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει
  choice: имеет и Отца, и Сына
  rationale: Повторный союз «и… и» точно и естественно передаёт греческую корреляцию καὶ…καὶ; личные титулы сохранены.
theological_decisions:
- issue: Смысл προάγων
  choice: идёт дальше
  alternative: забегает вперёд; заходит слишком далеко; преступает
  rationale: Основной текст SBLGNT содержит προάγων, а не вариант παραβαίνων. Выбранная передача сохраняет метафору движения за установленные пределы и не усиливает её до прямого «преступает».
- issue: Значение выражения «учение Мессии»
  choice: сохранён компактный родительный падеж
  alternative: учение, данное Мессией; учение о Мессии
  rationale: Греческий родительный τοῦ Χριστοῦ допускает обе смысловые связи; перевод не устраняет эту подлинную неоднозначность.
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Здесь Χριστός функционирует как титул. «Мессия» раскрывает его титульное значение и соответствует принятой политике проекта.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизации. Конструкция «кто… тот» обеспечивает естественность второй фразы; повтор «и Отца, и Сына» сохраняет торжественный параллелизм. Все сноски отмечены в основном тексте.
