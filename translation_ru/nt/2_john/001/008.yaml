  text: βλέπετε ἑαυτούς, ἵνα μὴ ⸀ἀπολέσητε ἃ ⸀εἰργασάμεθα, ἀλλὰ μισθὸν πλήρη ⸀ἀπολάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/008.yaml
  text: Watch yourselves[a], so that you may not lose what we have worked for, but may receive a full reward.
translation:
  language: ru
  text: Следите за собой, чтобы вам не потерять того, над чем мы трудились[a], но получить полную награду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «то, над чем вы трудились».'
    reason: textual_variant
lexical_decisions:
- source_word: βλέπετε ἑαυτούς
  choice: Следите за собой
  rationale: Настоящее повелительное наклонение во множественном числе выражает продолжающуюся бдительность; сочетание с возвратным местоимением естественно передаётся современным русским «следите за собой».
- source_word: ἵνα μὴ ἀπολέσητε
  choice: чтобы вам не потерять
  rationale: Конструкция ἵνα с отрицанием и аористом сослагательного наклонения обозначает нежелательный результат или цель, которой следует избежать. В контексте речь идёт об утрате плода труда, а не об уничтожении.
- source_word: ἃ εἰργασάμεθα
  choice: того, над чем мы трудились
  rationale: Перевод сохраняет первое лицо множественного числа данной формы SBLGNT и естественно выражает труд, результаты которого могут быть утрачены. Перфект указывает на совершённый труд с сохраняющимся результатом.
- source_word: μισθὸν πλήρη
  choice: награду сполна
  rationale: μισθός здесь естественнее понимать как награду, а не буквальную плату; наречное «сполна» ясно передаёт полноту получения и звучит по-русски естественно.
- source_word: ἀπολάβητε
  choice: получить
  rationale: В данном контексте глагол означает получение награды; возможный оттенок «получить обратно» недостаточно определён, чтобы вводить его в основной текст.
theological_decisions:
- issue: Лицо подлежащего при εἰργασάμεθα
  choice: мы трудились
  alternative: вы трудились
  rationale: Предоставленный текст SBLGNT имеет форму первого лица множественного числа εἰργασάμεθα, поэтому основное чтение связывает труд с автором и его соработниками. Вариант второго лица меняет акцент на труд самих адресатов и отмечен в сноске без устранения текстологической напряжённости.
- issue: Характер «награды»
  choice: Сохранено общее выражение «награду сполна»
  alternative: Уточнить её как спасение, служительскую награду или плату
  rationale: Сам стих не определяет природу награды, поэтому перевод не вводит конфессионального или частного богословского толкования.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, увещательная и понятная, без архаизмов. «Следите за собой» сохраняет прямую силу предупреждения, а «награду сполна» передаёт естественным русским оборотом полноту μισθὸν πλήρη.
