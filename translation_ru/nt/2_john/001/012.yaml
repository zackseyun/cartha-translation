  text: Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω ⸀γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ⸀ὑμῶν ⸂πεπληρωμένη ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/012.yaml
  text: Though I have many things to write to you[a], I did not want to do so with paper and ink. Instead, I hope to come to you and speak face to face, so that your joy may be made complete.
translation:
  language: ru
  text: У меня есть многое, о чём написать вам, но я не захотел писать об этом на бумаге и чернилами. Я надеюсь прийти к вам и поговорить с вами лицом к лицу, чтобы ваша[a] радость была полной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «наша радость».'
    reason: textual_variant
lexical_decisions:
- source_word: Πολλὰ ἔχων ὑμῖν γράφειν
  choice: У меня есть ещё многое, о чём написать вам
  rationale: Передаёт наличие многого, что автор мог бы изложить адресатам, без добавления оттенка обязанности; русская конструкция естественнее буквального причастного оборота.
- source_word: οὐκ ἐβουλήθην
  choice: я не захотел
  rationale: Сохраняет значение волевого решения в аористе и звучит естественно в современном русском.
- source_word: διὰ χάρτου καὶ μέλανος
  choice: на бумаге чернилами
  rationale: 'Естественно передаёт средство письменного общения: χάρτης обозначает писчий материал, а μέλαν — чернила.'
- source_word: ἐλπίζω γενέσθαι πρὸς ὑμᾶς
  choice: надеюсь прийти к вам
  rationale: Передаёт надежду автора лично оказаться у адресатов и сохраняет направленность πρός.
- source_word: στόμα πρὸς στόμα λαλῆσαι
  choice: поговорить с вами лицом к лицу
  rationale: Передаёт смысл непосредственного личного разговора; буквальное «устами к устам» в современном русском могло бы быть понято неверно.
- source_word: ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ
  choice: чтобы ваша радость была полной
  rationale: Сохраняет целевую конструкцию и состояние полноты, выраженное перфектным причастием с сослагательной формой εἰμί.
theological_decisions:
- issue: Разночтение местоимения, определяющего, чья радость имеется в виду
  choice: ваша радость
  alternative: наша радость
  rationale: Основной текст SBLGNT читает ὑμῶν («ваша»). Значимое разночтение ἡμῶν («наша») сохранено в сноске, а не устранено толкованием.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным эпистолярным тоном. Буквальные конструкции сглажены там, где они были бы неестественны или двусмысленны по-русски; текстологическая неоднозначность сохранена в сноске.
