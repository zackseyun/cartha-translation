source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ⸂ἡ ἐντολή ἐστιν⸃, καθὼς ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/006.yaml
  text: 'And this is love: that we walk according to his commandments. This is the commandment[a], just as you heard from the beginning, that you should walk in it.'
translation:
  language: ru
  text: 'И любовь состоит в том, чтобы мы ходили по Его заповедям. Это и есть заповедь, которую вы слышали от начала: чтобы вы ходили в ней[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы вы ходили в любви»; местоимение «ней» может относиться не к заповеди, а к любви.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: любовь
  rationale: Естественный современный эквивалент, сохраняющий ключевое для Иоанновых текстов понятие и связь с ближайшим контекстом.
- source_word: ἵνα περιπατῶμεν
  choice: чтобы мы ходили
  rationale: Оборот раскрывает, в чём любовь выражается на деле. «Ходили» сохраняет этическую метафору греческого текста.
- source_word: κατὰ τὰς ἐντολὰς αὐτοῦ
  choice: по Его заповедям
  rationale: Предлог κατά с винительным падежом обозначает соответствие; русский оборот «по Его заповедям» передаёт жизнь согласно им и сохраняет множественное число.
- source_word: ἐντολάς / ἐντολή
  choice: заповедям / заповедь
  rationale: Одинаковая лексема сохраняет намеренный переход от множественного числа к единственному.
- source_word: καθὼς ἠκούσατε ἀπ’ ἀρχῆς
  choice: которую вы слышали от начала
  rationale: Сохраняется характерное для Иоанновых писаний выражение «от начала»; относительная конструкция делает русскую фразу естественной, не меняя смысла.
- source_word: ἵνα ἐν αὐτῇ περιπατῆτε
  choice: чтобы вы ходили в ней
  rationale: Сохраняются повтор глагола περιπατέω и грамматическая неопределённость женского местоимения; в основном тексте ближайшим антецедентом выступает «заповедь».
theological_decisions:
- issue: К чему относится αὐτῇ в заключительной части стиха
  choice: К непосредственно предшествующему слову «заповедь»
  alternative: К слову «любовь» в начале стиха
  rationale: Ближайший грамматический антецедент — существительное ἐντολή женского рода и единственного числа. Однако ἀγάπη имеет те же грамматические признаки и тесно связано со смыслом всей фразы, поэтому альтернативу следует сохранить в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. Повтор «ходили» намеренно сохраняет этическую метафору и внутреннюю связь двух частей стиха; заглавное «Его» следует традиционной русской практике обозначения божественного референта.
