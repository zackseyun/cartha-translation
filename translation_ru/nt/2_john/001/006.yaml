  rationale: Правка делает вторую фразу более естественной и ближе к греческой указательно-именной конструкции, сохраняя переход от множественного числа «заповеди» к единственному «заповедь». Сноска исправлена так, чтобы альтернативное понимание референта αὐτῇ не устраняло повтор этической метафоры «ходить».
