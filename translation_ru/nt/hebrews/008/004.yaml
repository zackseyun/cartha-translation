base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/004.yaml
  text: If he were on earth[a], he would not even be a priest, since there are those who offer the gifts according to the law.
translation:
  language: ru
  text: Если бы он был на земле, то не был бы даже священником, поскольку есть те, кто по Закону приносит дары[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приношения». Греческое слово буквально означает «дары» и в данном контексте употребляется о жертвенных приношениях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Если бы
  rationale: Условная конструкция передана естественным русским оборотом; частицы обозначают логический переход, который в данном предложении не требует отдельного вводного слова.
- source_word: ἦν
  choice: он был
  rationale: В сочетании с «если бы» форма передаёт условие, представленное как не соответствующее действительности; местоимение восполняет ясное из контекста подлежащее.
- source_word: ἐπὶ γῆς
  choice: на земле
  rationale: Естественная передача пространственного выражения, противопоставляющего земную сферу небесной в ближайшем контексте.
- source_word: οὐδ’ ἂν ἦν
  choice: то не был бы даже
  rationale: Частица «бы» передаёт потенциальную аподосис, а «даже» сохраняет усиленную отрицательность οὐδέ.
- source_word: ἱερεύς
  choice: священником
  rationale: Обычное русское обозначение культового служителя в данном контексте.
- source_word: ὄντων τῶν προσφερόντων
  choice: поскольку есть те, кто приносит
  rationale: Родительный независимый оборот имеет здесь обстоятельственно-причинный смысл; выбранная формулировка не называет этих людей прямо священниками сверх сказанного в греческом тексте.
- source_word: κατὰ νόμον
  choice: по Закону
  rationale: Краткая и естественная передача действия в соответствии с установленным Законом; прописная буква показывает контекстуальную отсылку к Моисееву Закону.
- source_word: τὰ δῶρα
  choice: дары
  rationale: Буквальное значение сохраняет лексическую форму исходного текста; в контексте священнического служения слово обозначает жертвенные приношения.
theological_decisions:
- issue: Неявное подлежащее условной конструкции
  choice: Добавлено местоимение «он», относящееся к Иисусу из непосредственного контекста.
  alternative: Повторить имя или титул; перестроить фразу без явного подлежащего.
  rationale: Русская фраза требует ясного подлежащего, но повтор имени или титула сделал бы явным то, что в греческом тексте остаётся контекстуально подразумеваемым.
- issue: Характер условия
  choice: 'Передано как условие, не соответствующее действительности: «Если бы он был… то не был бы…».'
  alternative: 'Передать нейтральным реальным условием: «Если он находится…».'
  rationale: Сочетание εἰ с имперфектом и ἄν с имперфектом указывает на контрфактическую условную конструкцию; перевод сохраняет её, не развивая богословских выводов сверх текста.
- issue: Референт νόμος
  choice: «Закон» с прописной буквы.
  alternative: «закон» со строчной буквы.
  rationale: Контекст священнических даров указывает на установленный Моисеевым Законом порядок; прописная буква уточняет референт, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным синтаксисом. Местоимение «он» оставлено со строчной буквы как обычное контекстуальное местоимение. Маркер сноски поставлен непосредственно после слова «дары», к которому относится лексическая альтернатива.
