id: HEB.8.6
reference: Hebrews 8:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ διαφορωτέρας τέτυχεν λειτουργίας, ὅσῳ καὶ κρείττονός ἐστιν διαθήκης μεσίτης, ἥτις ἐπὶ κρείττοσιν ἐπαγγελίαις νενομοθέτηται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/006.yaml
  text: But as it is[a], he has obtained a more excellent ministry, by as much as he is also the mediator of a better covenant[c][b], which has been enacted on better promises.
translation:
  language: ru
  text: Но ныне служение, которое Он обрёл, тем выше, чем лучше завет, Посредником которого Он является[a], — завет, введённый в силу на основании лучших обещаний[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может означать «завет», а в некоторых контекстах — «завещание»; здесь «завет» соответствует обещанию нового завета у Иеремии, которое цитируется далее.
    reason: alternative_reading
  - marker: b
    text: 'Или: «завет, установленный на лучших обещаниях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Но ныне
  rationale: Передаёт и противопоставление предыдущему рассуждению о земных священниках, и указание на нынешнее положение дел; сохраняет возвышенный, но понятный регистр.
- source_word: διαφορωτέρας
  choice: более превосходное
  rationale: Сравнительная форма выражает качественное превосходство; формулировка поддерживает усиленную сравнительную структуру стиха.
- source_word: τέτυχεν
  choice: получил
  rationale: Перфект обозначает совершившееся обретение служения с сохраняющимся результатом; в русском это естественно передаётся совершенным видом.
- source_word: λειτουργίας
  choice: служение
  rationale: В контексте речь идёт о священном, священническом служении Христа, но добавление «священническое» не требуется, поскольку это ясно из контекста.
- source_word: ὅσῳ καὶ
  choice: поскольку Он также
  rationale: Выражает основание превосходства служения в превосходстве завета, посредником которого является Христос; буквальная пропорциональная конструкция по-русски была бы тяжеловесной.
- source_word: κρείττονός ... διαθήκης
  choice: лучшего завета
  rationale: «Лучший» естественно передаёт ключевой для Послания сравнительный термин κρείττων, а «завет» соответствует контексту последующей цитаты из Иеремии.
- source_word: μεσίτης
  choice: Посредник
  rationale: Точный и укоренившийся термин для того, кто выступает между сторонами и осуществляет заветные отношения.
- source_word: ἥτις
  choice: который
  rationale: Относительное местоимение отсылает к завету и вводит его характеристику без необходимости искусственно усиливать качественный оттенок.
- source_word: ἐπὶ κρείττοσιν ἐπαγγελίαις
  choice: на лучших обещаниях
  rationale: Предлог с дательным указывает на основание; «на» сохраняет образ опоры и краткость исходной фразы.
- source_word: νενομοθέτηται
  choice: утверждён
  rationale: Перфект пассива указывает на введение завета в силу с продолжающимся результатом. «Утверждён» естественно передаёт юридико-заветный оттенок, хотя менее буквально, чем «законодательно установлен».
theological_decisions:
- issue: Передача διαθήκη в Евр 8:6
  choice: завет
  alternative: завещание
  rationale: Восьмая глава прямо опирается на обещание нового завета у Иеремии и говорит о посредничестве и священстве; «завет» точно сохраняет ветхозаветный фон, тогда как «завещание» здесь затемнило бы его.
- issue: Связь превосходства служения и завета в ὅσῳ καὶ
  choice: поскольку Он также Посредник лучшего завета
  alternative: настолько превосходнейшее, насколько Он и Посредник лучшего завета
  rationale: 'Выбрана естественная русская причинная формулировка, передающая логику автора: превосходство служения связано с превосходством завета. Альтернатива точнее воспроизводит пропорциональную форму, но звучит тяжеловесно.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Местоимение «Он» и титул «Посредник» написаны с прописной буквы в соответствии с распространённой русской библейской практикой; синтаксис упрощён относительно греческой пропорциональной конструкции ради ясности.
