id: HEB.8.9
reference: Hebrews 8:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, κἀγὼ ἠμέλησα αὐτῶν, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/009.yaml
  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: ru
  text: не такой, как завет, который Я заключил с их отцами в тот день, когда взял их за руку[a], чтобы вывести их из земли Египта, потому что они не остались верны Моему завету, и Я пренебрёг ими[b], — говорит Господь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «взялся за их руку».'
    reason: lexical_alternative
  - marker: b
    text: 'Здесь цитата следует греческой формулировке Послания к Евреям: «Я пренебрёг ими». В еврейском тексте Иеремии 31:32 смысл иной; его часто передают: «хотя Я был их супругом» или «хотя Я был их владыкой».'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκην
  choice: завет
  rationale: В Послании к Евреям слово обозначает установленные Богом заветные отношения; «договор» звучал бы слишком светски, а «завещание» здесь вводило бы в заблуждение.
- source_word: ἐποίησα
  choice: заключил
  rationale: По-русски устойчивое сочетание «заключить завет» естественно передаёт ποιέω с διαθήκη.
- source_word: πατράσιν
  choice: отцами
  rationale: Сохраняет прямое обозначение отцов Израиля и соответствует мужскому роду греческого существительного.
- source_word: ἐν ἡμέρᾳ
  choice: в тот день
  rationale: Сохраняет конкретный временной образ исхода и естественно звучит по-русски.
- source_word: ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν
  choice: когда взял их за руку
  rationale: Идиоматически передаёт образ личного водительства; греческое единственное число χειρός отражено словом «руку».
- source_word: ἐξαγαγεῖν
  choice: чтобы вывести их
  rationale: Глагол точно и естественно обозначает выведение из Египта; инфинитив цели передан конструкцией «чтобы».
- source_word: γῆς Αἰγύπτου
  choice: из земли Египетской
  rationale: Сохраняет явно выраженное γῆς и использует понятную библейскую формулу без архаической грамматики.
- source_word: οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου
  choice: не остались верны Моему завету
  rationale: Передаёт не просто нахождение «в» завете, а продолжение верности ему; это естественный русский эквивалент контекстуального смысла ἐμμένω.
- source_word: κἀγὼ
  choice: и Я
  rationale: Сохраняет простое соединительное значение κἀγώ, не усиливая его до явно причинного «поэтому».
- source_word: ἠμέλησα αὐτῶν
  choice: Я перестал заботиться о них
  rationale: Передаёт значение ἀμελέω — не заботиться, пренебречь — естественно и без усиления до активного отвержения.
- source_word: λέγει κύριος
  choice: говорит Господь
  rationale: Обычная русская формула цитирования сохраняет настоящее время λέγει и титул κύριος.
theological_decisions:
- issue: Расхождение греческого текста Евр 8:9 с еврейским текстом Иер 31:32 в передаче ἠμέλησα αὐτῶν
  choice: Я перестал заботиться о них
  alternative: хотя Я был их супругом / владыкой
  rationale: Перевод следует непосредственно греческому тексту Послания к Евреям, где стоит ἠμέλησα αὐτῶν. Отличающийся смысл масоретского текста Иеремии сохраняется в примечании, чтобы не скрывать межтекстовое напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской издательской практике. Синтаксис остаётся близким к структуре цитаты, но избегает неестественных калек.
