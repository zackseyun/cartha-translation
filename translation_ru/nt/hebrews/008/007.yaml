  yaml_path: translation/nt/hebrews/008/007.yaml
  text: For if that first covenant had been faultless[b][a], no place would have been sought for a second.
translation:
  language: ru
  text: Ведь если бы тот первый завет[a] был без изъяна, не стали бы искать места для второго[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «тот первый»; слово «завет» добавлено по контексту.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не стали бы искать возможности (или случая) для второго».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ γὰρ
  choice: Ведь если бы
  rationale: «Ведь» естественно передаёт пояснительную связь γάρ с предыдущим рассуждением, а условная конструкция с «если бы» сохраняет контрфактический смысл.
- source_word: ἡ πρώτη ἐκείνη
  choice: тот первый завет
  rationale: Существительное «завет» подразумевается контекстом и согласованием формы женского рода в греческом; его добавление делает русский текст ясным. Буквальная эллиптическая форма отмечена в сноске.
- source_word: ἦν ἄμεμπτος
  choice: был без изъяна
  rationale: ἄμεμπτος означает отсутствие основания для упрёка или недостатка. Формулировка не уточняет природу изъяна и тем самым сохраняет напряжение текста.
- source_word: οὐκ ἂν
  choice: не стали бы
  rationale: Сочетание отрицания с ἄν выражает следствие нереального условия; русская форма с «бы» передаёт эту модальность естественно.
- source_word: δευτέρας
  choice: для второго
  rationale: Сохраняется краткость греческой эллиптической конструкции; из первой части стиха ясно, что речь идёт о втором завете.
- source_word: ἐζητεῖτο τόπος
  choice: стали бы искать места
  rationale: Формулировка близка к греческому пассивному обороту и остаётся понятной по-русски; возможное идиоматическое значение «возможность/основание» указано в сноске.
theological_decisions:
- issue: Следует ли явно добавить слово «завет», отсутствующее в данном греческом словосочетании
  choice: «тот первый завет» с пояснительной сноской
  alternative: «тот первый» / «первый»
  rationale: Контекст противопоставляет заветы, и добавление существительного лишь раскрывает подразумеваемый референт, не внося отдельного богословского утверждения.
- issue: Что именно признаётся небезупречным в первом завете
  choice: «был без изъяна» без дальнейшего пояснения
  alternative: Раскрыть изъян как недостаток самого завета, его исполнения или народа
  rationale: Сам стих формулирует условное рассуждение, но не определяет здесь природу изъяна. Перевод не разрешает эту богословскую напряжённость за автора.
translation_notes:
  register: Современный литературный русский язык; сдержанный, достойный библейский регистр без архаизмов. Порядок слов сохраняет акцент на контрфактическом сопоставлении первого и второго заветов.
