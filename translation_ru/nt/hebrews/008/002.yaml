id: HEB.8.2
reference: Hebrews 8:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τῶν ἁγίων λειτουργὸς καὶ τῆς σκηνῆς τῆς ἀληθινῆς, ἣν ἔπηξεν ὁ κύριος, ⸀οὐκ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/002.yaml
  text: a minister of the holy places and of the true tabernacle[a], which the Lord set up[b], not man.
translation:
  language: ru
  text: служитель святилища[a] и истинной скинии, которую воздвиг[b] Господь, а не человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «святых мест»; греческое выражение может обозначать святилище в целом или его святые части, но не обязательно святых людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поставил», как ставят шатёр.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ἁγίων
  choice: святилища
  rationale: Субстантивированное прилагательное во множественном числе в культовом контексте Послания к евреям обозначает святые места, то есть святилище. Единственное число «святилища» естественно по-русски и не допускает ошибочного понимания как служения святым людям; формальная множественность отмечена в сноске.
- source_word: λειτουργὸς
  choice: служитель
  rationale: Передаёт религиозное и священническое служение без узкотехнического или конфессионально окрашенного термина.
- source_word: σκηνῆς
  choice: скинии
  rationale: «Скиния» сохраняет прямую связь с ветхозаветной скинией и её небесным соответствием в аргументации Послания к евреям; общее «шатёр» ослабило бы этот культовый смысл.
- source_word: ἀληθινῆς
  choice: истинной
  rationale: Сохраняет краткость греческого и смысл подлинной, окончательной реальности в противопоставлении земному образу, не разворачивая толкование в основном тексте.
- source_word: ἔπηξεν
  choice: воздвиг
  rationale: Естественно сочетается со «скинией» и передаёт установление или сооружение шатра; более буквальный образ постановки шатра указан в сноске.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Обычный и богословски нейтральный русский эквивалент κύριος в данном контексте.
- source_word: οὐκ ἄνθρωπος
  choice: а не человек
  rationale: Передаёт резкое противопоставление действия Господа человеческому действию и сохраняет обобщающее единственное число греческого.
theological_decisions:
- issue: Значение τῶν ἁγίων и его отношение к небесному святилищу
  choice: культовое обозначение святилища
  alternative: святые места; святыни; святые люди
  rationale: Контекст Евр 8:1–5 говорит о первосвященническом служении Мессии в небесном святилище. «Святилище» сохраняет этот контекст, тогда как «святые» могло бы ошибочно указать на людей.
- issue: Характер «истинной скинии»
  choice: сохранено выражение «истинная скиния» без поясняющего расширения
  alternative: подлинная или небесная скиния
  rationale: Греческое ἀληθινῆς допускает оттенки «истинная», «подлинная», «соответствующая окончательной реальности». Основной текст не должен преждевременно сводить их к одному толкованию.
- issue: Обобщающее значение ἄνθρωπος
  choice: человек
  alternative: люди; человеческие руки
  rationale: Единственное число сохраняет лаконичный контраст оригинала между Господом и человеком вообще, не добавляя отсутствующего в тексте образа рук.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Термины «служитель», «святилище» и «скиния» сохраняют культовый контекст, оставаясь понятными читателю; синтаксис следует лаконичному строю греческого фрагмента.
