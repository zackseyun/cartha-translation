  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: ru
  text: 'Ведь упрекая их, Он говорит: «Вот, наступают дни, — говорит Господь, — и Я заключу новый завет с домом Израиля и с домом Иуды,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμφόμενος
  choice: упрекая
  rationale: Передаёт значение порицания или выражения недовольства естественным и достойным русским языком.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Сохраняет привлекающую внимание силу греческого слова и ветхозаветный пророческий регистр без архаичного «се».
- source_word: συντελέσω
  choice: заключу
  rationale: В сочетании с «завет» это естественный русский эквивалент совершения и установления завета; буквальное «доведу до завершения» здесь было бы неясным.
- source_word: διαθήκην καινήν
  choice: новый завет
  rationale: Устоявшийся и точный эквивалент в данном библейском контексте.
- source_word: οἶκον Ἰσραὴλ / οἶκον Ἰούδα
  choice: домом Израиля / домом Иуды
  rationale: Сохраняет корпоративно-родовое значение «дома» и параллелизм пророческой цитаты.
theological_decisions:
- issue: Кого порицает Бог в выражении αὐτούς
  choice: их
  alternative: его / завет
  rationale: Принятый текст содержит местоимение мужского рода множественного числа αὐτούς, поэтому перевод не заменяет людей абстрактным «заветом» и сохраняет референциальную краткость оригинала.
- issue: Характер действия при установлении нового завета
  choice: заключу новый завет
  alternative: исполню / доведу до завершения новый завет
  rationale: Русская формула «заключить завет» точно передаёт действие в контексте, не добавляя конфессионального толкования о способе или времени его исполнения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой цитаты. «Вот» выбрано вместо архаичного «се». Заглавные местоимения «Он» и «Я» последовательно указывают на Господа. Конечная запятая сохранена, поскольку цитата и предложение продолжаются в следующем стихе.
