  text: Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/001.yaml
  text: 'The main point in what is being said is this: we have such a high priest[a], who sat down at the right hand of the throne of the Majesty in the heavens[b],'
translation:
  language: ru
  text: 'Главное[a] же в том, о чём идёт речь, таково: у нас есть такой Первосвященник, который воссел по правую руку от престола Величия на небесах[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «суть» или «главный вывод» в том, о чём идёт речь.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «на небе»; в греческом тексте — «на небесах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κεφάλαιον
  choice: Главное
  rationale: В данном контексте обозначает основную мысль или суть рассуждения, а не буквальную «главу».
- source_word: δὲ
  choice: же
  rationale: Передаёт мягкий переход к главному положению без усиления до резкого противопоставления.
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: в сказанном
  rationale: Естественно по-русски передаёт отсылку к обсуждаемому; греческая форма допускает связь как с уже сказанным, так и с продолжающимся изложением.
- source_word: τοιοῦτον ἔχομεν ἀρχιερέα
  choice: у нас есть такой Первосвященник
  rationale: Сохраняет указание на Первосвященника именно такого рода, какого автор описал ранее. «Первосвященник» — традиционный и точный термин для ἀρχιερεύς.
- source_word: ἐκάθισεν
  choice: воссел
  rationale: Передаёт завершённое действие и царственно-культовый регистр без добавления отсутствующего в тексте богословского пояснения.
- source_word: ἐν δεξιᾷ
  choice: по правую руку
  rationale: Сохраняет библейский образ почётного и властного положения и звучит естественно в возвышенной современной прозе.
- source_word: τοῦ θρόνου τῆς μεγαλωσύνης
  choice: от престола Величия
  rationale: Русская конструкция «по правую руку от престола» ясно выражает пространственное отношение; «Величие» сохраняет благоговейное косвенное именование Бога.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: на небесах
  rationale: Сохраняет множественное число греческого выражения и является естественной русской библейской формулой.
theological_decisions:
- issue: Следует ли прямо назвать Бога вместо τῆς μεγαλωσύνης
  choice: Сохранить косвенное именование «Величие».
  alternative: «престола Бога» или «престола Величественного»
  rationale: Источник употребляет возвышенное косвенное обозначение, а не θεός; его сохранение не делает текст более определённым, чем оригинал.
- issue: Следует ли истолковать ἐκάθισεν как указание на завершённость священнического дела
  choice: Передать простым глаголом «воссел».
  alternative: «воссел, завершив Своё служение»
  rationale: Контекст Послания допускает такой богословский вывод, но сам стих не выражает его добавочными словами.
- issue: Временная направленность τοῖς λεγομένοις
  choice: 'Перевести компактно: «в сказанном».'
  alternative: «в том, что говорится»
  rationale: Причастие настоящего времени буквально относится к говоримому, однако в контексте выражение может подводить итог предшествующему рассуждению. Русское «в сказанном» естественно для резюме, не меняя основной мысли.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Воссел», «Первосвященник» и «Величие» поддерживают торжественный характер фразы, оставаясь понятными. Прописные буквы в «Первосвященник» и «Величие» отражают их употребление как титула и благоговейного именования в данном контексте.
