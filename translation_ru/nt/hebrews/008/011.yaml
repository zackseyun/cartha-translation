  text: καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ, λέγων· Γνῶθι τὸν κύριον, ὅτι πάντες εἰδήσουσίν με ἀπὸ ⸀μικροῦ ἕως μεγάλου αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
translation:
  language: ru
  text: 'И никто не будет учить[a] — каждый своего согражданина и каждый своего брата, говоря: «Познай Господа», потому что все будут знать Меня — от самого малого среди них до самого великого.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ближнего». В греческом тексте Послания к евреям стоит «согражданина», тогда как соответствующее место Книги Иеремии обычно переводят словом «ближнего».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: уже никто не будет учить
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает решительное отрицание. В данном обобщённо-распределительном контексте естественная русская конструкция «никто не будет» передаёт отсутствие таких случаев, а «уже» подчёркивает перемену, связанную с новым заветом.
- source_word: ἕκαστος ... ἕκαστος
  choice: ни ... ни
  rationale: Двойное ἕκαστος имеет распределительное значение. После «никто» русская конструкция «ни своего согражданина, ни своего брата» естественно сохраняет обе отдельно названные категории.
- source_word: πολίτην
  choice: согражданина
  rationale: πολίτης означает гражданина или согражданина. Выбор следует сохранившемуся греческому тексту Послания к евреям, не подменяя его более привычным по Иеремии словом «ближний».
- source_word: ἀδελφὸν
  choice: брата
  rationale: Передаёт грамматически мужскую форму единственного числа и сохраняет семейную образность заветного сообщества.
- source_word: Γνῶθι
  choice: Познай
  rationale: Аористный императив передан прямым повелением. «Познай» в торжественном библейском контексте выражает не только осведомлённость, но и приход к знанию Господа.
- source_word: κύριον
  choice: Господа
  rationale: Традиционное и контекстуально точное соответствие κύριος, уместное в цитате о завете.
- source_word: πάντες εἰδήσουσίν με
  choice: все они будут знать Меня
  rationale: Сохраняются всеобщность πάντες, будущее значение и явное местоименное дополнение με.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: от малого до великого
  rationale: Устойчивый русский оборот передаёт весь диапазон членов сообщества, не сводя различие только к возрасту или общественному положению.
theological_decisions:
- issue: Передача πολίτην в цитате, восходящей к Иеремии 31:34
  choice: согражданина
  alternative: ближнего
  rationale: Греческий текст Послания к евреям содержит πολίτην, поэтому основной текст сохраняет гражданскую лексику. Традиционный вариант, обусловленный текстом Иеремии, указан в сноске.
- issue: Грамматически мужская семейная лексика ἀδελφόν
  choice: брата
  alternative: брата или сестру; ближнего по вере
  rationale: «Брата» точно сохраняет форму и семейную образность источника, не отрицая всеобщего охвата обещания, явно выраженного далее словом πάντες.
- issue: Соотношение повеления «Познай Господа» и обещания «все будут знать Меня»
  choice: сохранено прямое сопоставление без поясняющей гармонизации
  alternative: расширить как «научись знать» или уточнить характер знания
  rationale: Текст сам противопоставляет внешнее наставление всеобщему знанию Бога; перевод не определяет сверх сказанного природу или степень этого знания.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным звучанием. Синтаксис сделан естественным для русского: двойное ἕκαστος передано конструкцией «ни ... ни» после обобщающего «никто». Прописная буква в «Меня» отражает традиционное русское оформление местоимения, относящегося к Богу.'
