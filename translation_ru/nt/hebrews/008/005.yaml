    rationale: Русский глагол «служить» обычно требует указания адресата или учреждения, поэтому исходная конструкция может быть понята как служение самому «подобию и тени». Греческий дательный здесь характеризует служение как происходящее в сфере земного подобия и тени небесного.
  - severity: low
