  variant: modern literary Russian
source:
  edition: SBLGNT
  text: (οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων, καθὼς κεχρημάτισται Μωϋσῆς μέλλων ἐπιτελεῖν τὴν σκηνήν, Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον τὸν δειχθέντα σοι ἐν τῷ ὄρει)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
translation:
  language: ru
  text: 'которые совершают служение в подобии и тени небесного, как и Моисей получил Божье указание[a], когда готовился устроить скинию[b]. Ибо сказано: «Смотри, сделай всё по образцу, показанному тебе на горе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был предупреждён Богом»; греческий глагол может передавать божественное наставление или предостережение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «завершить скинию»; греческий глагол может означать как осуществить сооружение, так и довести его до завершения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: которые
  rationale: Естественно вводит относительное придаточное, относящееся к священникам из предыдущего контекста, без избыточной передачи качественного оттенка местоимения.
- source_word: ὑποδείγματι
  choice: подобию
  rationale: В данном культовом контексте обозначает земное соответствие небесному; «подобие» передаёт зависимый и вторичный характер земного святилища, не сводя его к простому примеру.
- source_word: σκιᾷ
  choice: тени
  rationale: Сохраняет характерную для Послания к евреям метафору чего-то действительного, но уступающего небесному по полноте.
- source_word: λατρεύουσιν
  choice: служат
  rationale: Глагол обозначает религиозное, культовое служение; контекст святилища ясно задаёт сакральный смысл.
- source_word: τῶν ἐπουρανίων
  choice: небесного
  rationale: Субстантивированное единственное число по-русски естественно передаёт совокупный и намеренно широкий смысл греческого множественного, не уточняя его как места, предметы или абстрактные реалии.
- source_word: κεχρημάτισται
  choice: получил Божье указание
  rationale: Передаёт божественный источник сообщения и его направляющую силу; возможный оттенок предостережения отмечен в сноске.
- source_word: μέλλων
  choice: когда собирался
  rationale: 'Естественно передаёт перспективное значение: Моисей намеревался приступить к делу.'
- source_word: ἐπιτελεῖν
  choice: соорудить
  rationale: В контексте изготовления скинии обозначает доведение порученного сооружения до осуществления; «соорудить» естественно в русском и соответствует конкретному контексту.
- source_word: σκηνήν
  choice: скинию
  rationale: Устоявшийся и точный русский библейский термин для священного шатра Моисея.
- source_word: Ὅρα
  choice: Смотри
  rationale: Сохраняет прямую форму повеления и оттенок настойчивого внимания.
- source_word: ποιήσεις πάντα
  choice: сделай всё
  rationale: Греческое будущее в цитате имеет повелительную силу; русский императив ясно и естественно передаёт функцию формы.
- source_word: τύπον
  choice: образцу
  rationale: Обозначает показанную Моисею модель или образец, по которому следовало изготовить скинию; позволяет отличить этот термин от ὑπόδειγμα в первой части стиха.
theological_decisions:
- issue: Соотношение земного служения и небесного
  choice: «служат подобию и тени небесного»
  alternative: «служат образу и тени небесных реалий»
  rationale: Формулировка сохраняет одновременно соответствие земного небесному и неполноту земного, не превращая это соотношение ни в чистую символику, ни в разработанную онтологическую схему.
- issue: Сила глагола κεχρημάτισται
  choice: «получил Божье указание»
  alternative: «был предупреждён Богом»
  rationale: Основной текст сохраняет как божественный источник, так и наставляющий характер сообщения; возможный предостерегающий оттенок не исключён и вынесен в сноску.
- issue: Кто говорит в вводной формуле φησίν
  choice: «Он говорит»
  alternative: «сказано»
  rationale: Заглавная буква обозначает подразумеваемого Бога как говорящего в цитируемом Писании, при этом не добавляет имени, отсутствующего в греческом тексте.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой. Сохранён общеупотребительный термин «скиния»; синтаксис сделан ясным и плавным. Цитата передана прямым, dignified повелением без архаических форм.
