review_pass:
  verdict: revise
  source_fidelity: 'Основная смысловая линия передана верно: земное священническое служение соотнесено с небесным, Моисей получает божественное наставление, а цитата требует следовать показанному образцу. Однако «служат подобию и тени» по-русски создаёт впечатление, будто «подобие и тень» являются объектом служения. Дательный ὑποδείγματι καὶ σκιᾷ здесь описывает сферу/характер культового служения; это следует выразить яснее. Также безличное «сказано» в цитатной формуле естественнее и не добавляет эксплицитного субъекта к φησίν.'
  naturalness: «Совершают служение в подобии и тени небесного» сохраняет культовой характер λατρεύουσιν и естественно звучит в современном литературном русском. «Когда Моисей готовился устроить скинию» плавно передаёт μέλλων ἐπιτελεῖν, не сужая значение ἐπιτελεῖν лишь до физического возведения или лишь до завершения.
  terminology: '«Подобие», «тень», «небесное», «скиния» и «образец» удачны и согласованы с библейским регистром. Сноска к κεχρημάτισται уточнена: возможен не только оттенок предупреждения, но и божественного наставления. Маркеры сносок сохранены и привязаны к соответствующим словам.'
