id: HEB.8.13
reference: Hebrews 8:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐν τῷ λέγειν Καινὴν πεπαλαίωκεν τὴν πρώτην, τὸ δὲ παλαιούμενον καὶ γηράσκον ἐγγὺς ἀφανισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/013.yaml
  text: By saying[a], “new,” he has made the first obsolete[c][b]. And what is becoming obsolete and growing old is near to disappearing.
translation:
  language: ru
  text: Назвав его «новым»[a], Он тем самым сделал первый завет устаревшим[b]. А то, что устаревает и ветшает, близко к исчезновению[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Говоря: „новый“»; или: «Когда Он говорит: „новый“». В греческом тексте буквально процитировано только слово «новый», отсылающее к выражению «новый завет» в предшествующей цитате из Иер. 31:31.'
    reason: Лексическая альтернатива и межтекстовая отсылка.
  - marker: b
    text: 'Буквально: «сделал первое устаревшим»; из контекста ясно, что речь идёт о первом завете.'
    reason: Пояснение добавленного для ясности существительного.
  - marker: c
    text: 'Или: «близко к тому, чтобы исчезнуть»; возможный оттенок: «близко к устранению».'
    reason: Лексическая альтернатива, сохраняющая диапазон значения ἀφανισμός.
lexical_decisions:
- source_word: ἐν τῷ λέγειν
  choice: Назвав его
  rationale: Конструкция с ἐν и субстантивированным инфинитивом выражает обстоятельство и может иметь оттенок средства. Русское деепричастие естественно связывает произнесение слова «новым» с последующим выводом; местоимение «его» указывает на завет из контекста.
- source_word: Καινὴν
  choice: «новым»
  rationale: В греческом тексте стоит только прилагательное, эллиптически отсылающее к выражению «новый завет» в предшествующей цитате. Кавычки сохраняют характер краткой цитаты.
- source_word: πεπαλαίωκεν
  choice: сделал ... устаревшим
  rationale: Перфект обозначает совершившееся действие с сохраняющимся результатом. «Сделал устаревшим» передаёт смысл παλαιόω в данном противопоставлении заветов, не сводя его лишь к возрасту.
- source_word: τὴν πρώτην
  choice: первый завет
  rationale: Субстантивированное прилагательное относится к первому завету. В русском добавление существительного необходимо для ясности и естественности, поскольку форма «первый» без опоры могла бы звучать неопределённо.
- source_word: τὸ ... παλαιούμενον
  choice: то, что устаревает
  rationale: Настоящее причастие передаёт продолжающийся процесс; русская конструкция сохраняет обобщённую форму греческого среднего рода.
- source_word: γηράσκον
  choice: ветшает
  rationale: Слово передаёт образ старения. «Ветшает» звучит естественно и достойно применительно к установлению, сохраняя различие с предшествующим «устаревает».
- source_word: ἐγγὺς
  choice: близко к
  rationale: Сочетание с родительным обозначает близость к наступлению события; русская конструкция прямо воспроизводит эту связь.
- source_word: ἀφανισμοῦ
  choice: исчезновению
  rationale: Существительное означает исчезновение, устранение из видимости. Выбор сохраняет образ угасания, не усиливая его до однозначного «уничтожения».
theological_decisions:
- issue: Подразумеваемый субъект при ἐν τῷ λέγειν
  choice: «Он» без уточнения в основном тексте
  alternative: «Бог» или «Писание»
  rationale: В греческом субъект не назван и определяется по говорящему в цитате из Иеремии. Местоимение сохраняет эту текстовую сдержанность, а заглавная буква отражает ясную контекстуальную отсылку к Богу, не добавляя имени в сам стих.
- issue: Статус первого завета
  choice: «сделал первый завет устаревшим»
  alternative: «сделал первый завет старым»
  rationale: Контекст утверждает утрату первым заветом прежнего статуса вследствие обещания нового. «Устаревшим» передаёт силу глагола, не добавляя более широких выводов о законе, которых стих прямо не формулирует.
- issue: Смысл ἀφανισμός
  choice: «исчезновение»
  alternative: «устранение» или «уничтожение»
  rationale: «Исчезновение» сохраняет образ и допускаемую греческим словом смысловую широту, не разрешая преждевременно вопрос о точном историческом или богословском способе прекращения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан ясным для обычного читателя; эллипсис греческого текста отмечен кавычками и пояснён в сносках. Повтор корня παλαιόω передан через «устаревшим / устаревает», а отдельный образ γηράσκον — словом «ветшает».
