reference: Hebrews 8:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: ru
  text: Ведь каждый первосвященник назначается, чтобы приносить и дары, и жертвы; поэтому и Ему[a] необходимо иметь что принести.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и этому также». В контексте речь идёт об Иисусе как Первосвященнике.'
    reason: Указательное местоимение τοῦτον имеет подразумеваемый из контекста референт; сноска отмечает указательную форму оригинала и значение «также», не перегружая основной текст.
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: Ведь всякий первосвященник
  rationale: πᾶς с существительным в единственном числе имеет распределительное значение «всякий». γάρ передано как «ведь», естественно обозначающее пояснение к предыдущей мысли.
- source_word: εἰς τὸ προσφέρειν
  choice: чтобы приносить
  rationale: Конструкция εἰς с субстантивированным инфинитивом выражает цель; оборот «чтобы приносить» ясно и естественно передаёт эту функцию.
- source_word: δῶρά τε καὶ θυσίας
  choice: и дары, и жертвы
  rationale: Соотносительная конструкция «и… и…» передаёт τε καὶ и сохраняет различие между двумя культовыми категориями.
- source_word: καθίσταται
  choice: поставляется
  rationale: В контексте священнического служения глагол означает назначение или поставление на служение. «Поставляется» сохраняет официальный и культовый оттенок.
- source_word: ὅθεν
  choice: поэтому
  rationale: Слово вводит логический вывод из общего принципа, сформулированного в первой части стиха.
- source_word: ἀναγκαῖον ἔχειν
  choice: необходимо иметь
  rationale: Безличная конструкция передаёт необходимость, сохраняя ясный современный русский синтаксис.
- source_word: τι
  choice: что
  rationale: В сочетании «иметь что принести» русское местоимение «что» естественно передаёт неопределённое τι — нечто, предназначенное для принесения.
- source_word: καὶ τοῦτον
  choice: и Ему
  rationale: В контексте указательное местоимение относится к Иисусу как Первосвященнику. Местоименная форма «Ему» звучит естественно по-русски, а частица «и» сохраняет значение καί; указательная форма оригинала отмечена в сноске.
- source_word: ὃ προσενέγκῃ
  choice: что принести
  rationale: 'Краткий русский оборот передаёт относительное местоимение и предполагаемое действие аориста сослагательного наклонения: должно иметься нечто, что Он мог бы принести.'
theological_decisions:
- issue: К кому относится τοῦτον
  choice: В основном тексте употреблено «Ему», а контекстуальный референт — Иисус как Первосвященник — не назван дополнительно.
  alternative: «этому»; «этому Первосвященнику»; прямое добавление имени «Иисусу» или титула «Христу»
  rationale: Греческий текст употребляет указательное местоимение и не повторяет имени. Русское «Ему» сохраняет контекстуальную соотнесённость и избегает неестественного «этому», а сноска сообщает буквальную форму и её референт.
- issue: Различие между δῶρα и θυσίαι
  choice: Сохранены отдельные понятия «дары» и «жертвы».
  alternative: Обобщающее «приношения» или объединённое «жертвенные дары»
  rationale: Автор называет две культовые категории, не раскрывая здесь подробнее их богословское отношение к жертве Христа; перевод не должен сводить их в одно понятие.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. «Поставляется» сохраняет священнический оттенок, а синтаксис «иметь что принести» остаётся простым и понятным. Заглавная буква в «Ему» указывает на Иисуса согласно устойчивой русской библейской традиции, не добавляя имени в текст.
