  text: For I will be merciful toward their unrighteousness[b][a], and I will remember their sins no more.
translation:
  language: ru
  text: Ибо Я буду милостив к их неправдам[a] и больше не вспомню их грехов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к их неправедности» или «к их несправедливым поступкам». Греческое слово может обозначать как неправедность вообще, так и конкретные проявления неправды.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и грехов их больше не вспомню». Усиленное отрицание подчёркивает решительность обещания; в контексте завета эти слова выражают полное прощение, а не утрату Богом знания о совершённых грехах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Потому что
  rationale: Союз вводит основание или пояснение к предшествующему обетованию завета; «потому что» естественно передаёт причинно-пояснительную связь.
- source_word: ἵλεως ἔσομαι
  choice: Я буду милостив
  rationale: ἵλεως обозначает милостивое, благосклонное отношение, особенно в контексте прощения; этот перевод ясен и не вводит специальной богословской терминологии.
- source_word: ταῖς ἀδικίαις αὐτῶν
  choice: к их неправедным делам
  rationale: Дательный падеж после ἵλεως естественно передан предлогом «к». Множественное число ἀδικίαις может указывать на конкретные проявления неправды, поэтому «неправедные дела» сохраняет моральный смысл и число.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: их грехов
  rationale: Обычный и точный русский эквивалент множественного числа ἁμαρτία.
- source_word: οὐ μὴ μνησθῶ ἔτι
  choice: больше не вспомню
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает решительное отрицание, а ἔτι — «больше, впредь»; по-русски эта формула звучит естественно и сохраняет образ исходного текста.
theological_decisions:
- issue: Смысл Божьего невоспоминания грехов
  choice: Сохранён библейский образ «больше не вспомню», выражающий окончательное прощение в рамках завета
  alternative: 'Передать толковательно: «больше не поставлю им в вину их грехи» или понять как буквальное забывание'
  rationale: Исходный текст говорит о невоспоминании, не поясняя его механизм. Основной перевод сохраняет этот образ и его богословское напряжение; примечание указывает на заветный контекст, не подменяя перевод толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис прост и понятен; заглавная «Я» употреблена по принятой русской традиции при прямой речи Бога. Оба маркера примечаний размещены непосредственно после соответствующих выражений.
