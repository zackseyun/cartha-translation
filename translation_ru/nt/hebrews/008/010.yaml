  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: ru
  text: 'Ибо это завет, который Я заключу с домом Израиля после тех дней, — говорит Господь: Я вложу Мои законы в их разум и напишу их на их сердцах; и буду их Богом, а они будут Моим народом.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκη
  choice: завет
  rationale: В Послании к евреям слово обозначает завет в контексте цитаты из Иеремии, а не завещание; «завет» сохраняет ветхозаветную связь.
- source_word: διαθήσομαι
  choice: заключу
  rationale: В сочетании с «завет» глагол естественно передаётся по-русски как «заключу», при этом адресат оформлен оборотом «с домом Израиля».
- source_word: οἴκῳ Ἰσραήλ
  choice: с домом Израиля
  rationale: Сохранено пророческое и корпоративное выражение «дом Израиля», а не упрощённое «с Израилем».
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: после тех дней
  rationale: Прямая передача временного оборота сохраняет пророческую формулу и связь с Иеремией.
- source_word: κύριος
  choice: Господь
  rationale: Так естественно передаётся κύριος в новозаветной цитате, одновременно сохраняющей ветхозаветное звучание.
- source_word: διδοὺς
  choice: вкладывая
  rationale: Деепричастие сохраняет форму греческого причастия и образ помещения законов внутрь разума; более плавная конструкция с личным глаголом дана в примечании.
- source_word: νόμους
  choice: законы
  rationale: Сохранено явно выраженное в греческом тексте множественное число.
- source_word: διάνοιαν
  choice: разум
  rationale: Слово обозначает внутреннюю способность мыслить и понимать; единственное число сохраняет форму греческого текста, тогда как притяжательное местоимение указывает на многих людей.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: на их сердцах
  rationale: Предлог «на» сохраняет метафору письма на поверхности, а множественное число соответствует греческому καρδίας.
- source_word: ἐπιγράψω
  choice: Я напишу
  rationale: «Напишу» ясно и естественно передаёт образ нанесения письменных знаков, не усиливая его до более специального «начертаю».
- source_word: ἔσομαι αὐτοῖς εἰς θεόν
  choice: буду их Богом
  rationale: Естественная русская форма традиционной формулы заветных отношений.
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: они будут Моим народом
  rationale: Сохраняет взаимную формулу принадлежности и отношений завета.
theological_decisions:
- issue: Сохранение связи цитаты с Иеремией и языка завета
  choice: Сохранены выражения «завет», «дом Израиля», «Мои законы», «их сердца», «буду их Богом» и «будут Моим народом».
  alternative: Передать цитату более свободно и современно, например заменив «дом Израиля» просто на «Израиль».
  rationale: Богословская сила стиха связана с узнаваемой пророческой формулой нового завета; её не следует растворять в пересказе.
- issue: Смешанная глагольная конструкция διδοὺς ... ἐπιγράψω
  choice: 'В основном тексте сохранено причастное значение: «вкладывая ... Я напишу».'
  alternative: «Я вложу Мои законы в их разум и напишу их на их сердцах».
  rationale: Греческий текст сочетает причастие настоящего времени с личной формой будущего времени. Основной текст показывает эту особенность, а примечание предлагает естественное русское сглаживание без изменения смысла.
translation_notes:
  register: Современный литературный русский язык с несколько возвышенным, но понятным языком заветной формулы. Заглавные буквы в местоимениях, относящихся к Богу, поддерживают принятый в русском библейском стиле почтительный регистр. Пунктуация выделяет вводную формулу «говорит Господь» и сохраняет последовательность обещаний.
