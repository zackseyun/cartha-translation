  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: ru
  text: Ты полюбил праведность[a] и возненавидел беззаконие; поэтому Бог, Твой Бог, помазал Тебя елеем радости в большей мере, чем Твоих товарищей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость». Греческое слово может обозначать как праведность, так и справедливость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησας
  choice: Ты полюбил
  rationale: Аорист передан совершенным видом в прошедшем времени; это естественно для русского языка и сохраняет прямое утверждение цитаты.
- source_word: δικαιοσύνην
  choice: праведность
  rationale: Передаёт нравственное качество в противопоставлении беззаконию; возможный оттенок справедливости отмечен в сноске.
- source_word: ἐμίσησας
  choice: возненавидел
  rationale: Совершенный вид соответствует аористу и сохраняет сильный параллельный контраст с «полюбил».
- source_word: ἀνομίαν
  choice: беззаконие
  rationale: Прямо отражает идею нарушения или отвержения закона и естественно противопоставляется праведности.
- source_word: διὰ τοῦτο
  choice: поэтому
  rationale: Кратко и ясно выражает причинно-следственную связь.
- source_word: ἔχρισέν σε
  choice: помазал Тебя
  rationale: Сохраняет царский и мессианский образ помазания без поясняющей вставки.
- source_word: ὁ θεός, ὁ θεός σου
  choice: Бог, Твой Бог
  rationale: Сохраняет повтор и отношения, выраженные греческим текстом, не разрешая его христологическое напряжение посредством парафраза.
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: елеем радости
  rationale: Сохраняет узнаваемый библейский образ помазания; «радости» ясно передаёт значение ἀγαλλίασις, а «елей» уместен в возвышенной цитате.
- source_word: παρὰ τοὺς μετόχους σου
  choice: больше, чем Твоих соучастников
  rationale: Передаёт сравнительное значение παρά; «соучастники» сохраняет более широкий смысл μετόχους и связь с употреблением этого слова в Послании к евреям.
theological_decisions:
- issue: Значение δικαιοσύνη в мессианской цитате
  choice: праведность
  alternative: справедливость
  rationale: Основной текст сохраняет широкое нравственно-богословское значение, а допустимый судебно-общественный оттенок указан в сноске.
- issue: Христологическое выражение ὁ θεός, ὁ θεός σου
  choice: Бог, Твой Бог
  alternative: Бог, именно Твой Бог
  rationale: Буквенное повторение сохраняет обращённость стиха к Сыну и одновременно выражение «Твой Бог», не добавляя конфессионального толкования.
- issue: Сравнение с μετόχους
  choice: больше, чем Твоих соучастников
  alternative: превыше Твоих спутников
  rationale: Формулировка сохраняет превосходящую меру помазания и не уточняет без достаточных оснований, кем именно являются μετόχοι.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной интонацией ветхозаветной цитаты. Местоимения, обращённые к Сыну, написаны с прописной буквы по принятой русской библейской традиции; синтаксис остаётся прозрачным для современного читателя.
