source:
  edition: SBLGNT
  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: ru
  text: 'Об ангелах же Он говорит: «Он делает Своих ангелов ветрами[a] и Своих служителей — пламенем огня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духами». Греческое слово может означать и «ветры», и «духов».'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: Об ангелах же
  rationale: 'Оборот с πρός при λέγει здесь имеет тематический смысл: цитата говорит об ангелах, а не обращена непосредственно к ним. Частица μέν вводит первую сторону сопоставления с Сыном; русское «же» естественно обозначает этот контраст.'
- source_word: λέγει
  choice: Он говорит
  rationale: Настоящее время сохраняет характерный для новозаветных формул цитирования «настоящий момент» Писания; местоимение указывает на Бога из контекста.
- source_word: Ὁ ποιῶν
  choice: Он делает
  rationale: Субстантивированное причастие передано естественной русской личной конструкцией с сохранением активного значения ποιέω.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: Своих ангелов
  rationale: В контексте Евр 1 ἄγγελοι — небесные ангелы. Возвратное «Своих» естественно соотносит их с действующим лицом «Он» и не требует тяжеловесного «Его ангелов».
- source_word: πνεύματα
  choice: ветрами
  rationale: πνεῦμα может означать как «ветер», так и «дух». В свете еврейского текста Пс 103:4 (104:4) и параллели с пламенем огня основным выбран смысл «ветры»; реальная неоднозначность сохранена в сноске.
- source_word: τοὺς λειτουργοὺς αὐτοῦ
  choice: Своих служителей
  rationale: λειτουργός обозначает того, кто исполняет служение, иногда официальное или священное. «Служители» сохраняет возвышенный оттенок, не вводя конкретной поздней церковной должности.
- source_word: πυρὸς φλόγα
  choice: пламенем огня
  rationale: Сохранены единственное число и образная родительная конструкция греческого текста. Творительный падеж естественно дополняет русское «делает».
theological_decisions:
- issue: Значение πνεύματα в цитате из Пс 103:4 (104:4)
  choice: ветрами
  alternative: духами
  rationale: «Ветрами» лучше соответствует еврейскому фону и поэтической параллели «пламенем огня», однако греческое πνεύματα допускает также значение «духами». Сноска сохраняет эту богословски значимую неоднозначность.
- issue: Направленность формулы πρὸς ... λέγει
  choice: Бог говорит об ангелах
  alternative: Бог говорит ангелам
  rationale: Содержание цитаты описывает ангелов и не является обращением к ним; тематическое понимание также соответствует противопоставлению тому, что говорится о Сыне в следующем стихе.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис краток и ясен; прописные местоимения при указании на Бога соответствуют принятому русскому религиозному регистру. Тире перед «пламенем огня» помогает ясно увидеть параллельную структуру цитаты.
