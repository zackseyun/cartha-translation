  text: αὐτοὶ ἀπολοῦνται, σὺ δὲ διαμένεις· καὶ πάντες ὡς ἱμάτιον παλαιωθήσονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/011.yaml
  text: They will perish[a], but you remain; and they all will wear out like a garment[b],
translation:
  language: ru
  text: Они погибнут, а Ты пребываешь; и все они обветшают, как одежда[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот образ восходит к Псалму 101:26–28 и противопоставляет преходящесть сотворённого мира неизменному постоянству Того, к кому обращены слова.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: они
  rationale: Местоимение отсылает к небесам и земле в предыдущем стихе; противопоставление подчеркнуто последующим «а Ты».
- source_word: ἀπολοῦνται
  choice: погибнут
  rationale: Передаёт сильное значение прекращения существования, не добавляя прямо не названного внешнего деятеля.
- source_word: σὺ δὲ
  choice: а Ты
  rationale: Сохраняет явное местоимение и резкое противопоставление преходящего творения Тому, к кому обращены слова.
- source_word: διαμένεις
  choice: пребываешь
  rationale: Выражает непрерывность и постоянство; возвышенное, но понятное слово уместно в псаломной цитате.
- source_word: πάντες
  choice: все они
  rationale: Ясно и собирательно отсылает ко всему ранее упомянутому сотворённому порядку.
- source_word: ὡς ἱμάτιον
  choice: как одежда
  rationale: Передаёт обобщённый образ предмета одежды, не сужая значение до плаща или одеяния особого вида.
- source_word: παλαιωθήσονται
  choice: обветшают
  rationale: Передаёт становление старым и изношенным и естественно сочетается в русском языке с образом одежды.
theological_decisions:
- issue: К кому обращены слова и их христологическая сила
  choice: 'Сохранено прямое обращение к Сыну: «Ты пребываешь».'
  alternative: Заменить второе лицо пояснительным именованием адресата.
  rationale: В контексте Евр 1 автор относит псаломную цитату к Сыну. Прямое обращение сохраняет это применение, не добавляя отсутствующего в стихе догматического пояснения.
- issue: Контраст гибели творения и постоянства адресата
  choice: «погибнут, а Ты пребываешь»
  alternative: Смягчить до «пройдут, но Ты останешься».
  rationale: Выбранная формулировка сохраняет силу ἀπολοῦνται и продолжающееся настоящее διαμένεις, не уточняя механизм гибели.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром, соответствующим цитате из Псалтири. Заглавная буква в «Ты» отмечает обращение к Сыну по контексту и русской библейской традиции; синтаксис сохраняет параллелизм оригинала.
