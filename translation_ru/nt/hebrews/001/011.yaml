  source_fidelity: 'Текст точно передаёт греческий оригинал: «Они погибнут» соответствует αὐτοὶ ἀπολοῦνται; явное противопоставление σὺ δέ сохранено в «а Ты пребываешь»; πάντες, ὡς ἱμάτιον и παλαιωθήσονται адекватно переданы как «все они обветшают, как одежда». Настоящее время «пребываешь» верно отражает διαμένεις.'
  naturalness: Фраза литературна, ясна и сохраняет ритм и параллелизм псаломной цитаты. «Обветшают, как одежда» естественно в библейско-поэтическом регистре. Умеренно возвышенное «пребываешь» уместно и понятно современному читателю.
  terminology: «Погибнут», «пребываешь» и «обветшают» точно и последовательно передают ключевые понятия без богословских добавлений. Заглавное «Ты» соответствует русской библейской традиции прямого обращения и не изменяет смысла. Ссылка на Псалом 101:26–28 корректна для русской нумерации; английская ссылка 102:25–27 использует иную нумерацию.
