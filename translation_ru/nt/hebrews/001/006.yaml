  text: ὅταν δὲ πάλιν εἰσαγάγῃ τὸν πρωτότοκον εἰς τὴν οἰκουμένην, λέγει· Καὶ προσκυνησάτωσαν αὐτῷ πάντες ἄγγελοι θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/006.yaml
  text: And when he again brings the Firstborn into the world[a], he says[b], “And let all God’s angels worship him.”
translation:
  language: ru
  text: 'И когда Он вновь вводит Первенца в мир[a], то говорит: «И да поклонятся Ему все ангелы Божьи».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И ещё, когда Он вводит Первенца в мир, говорит: „Да поклонятся Ему все ангелы Божьи“». Греческое слово, переведённое как «вновь», может относиться либо к «вводит», либо к «говорит».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: когда
  rationale: Вводит придаточное времени; в данном контексте речь идёт об определённом событии, поэтому «когда» естественнее, чем повторительное «всякий раз, когда».
- source_word: δὲ
  choice: и
  rationale: Слабая связка, продолжающая рассуждение без подчёркнутого противопоставления.
- source_word: πάλιν
  choice: вновь
  rationale: В основном тексте отнесено к глаголу «вводит». Греческий допускает также связь с «говорит»; эта реальная неоднозначность отражена в сноске.
- source_word: εἰσαγάγῃ
  choice: вводит
  rationale: Передаёт значение «привести внутрь, ввести» и сохраняет образ движения в οἰκουμένην точнее, чем более общее «приводит».
- source_word: τὸν πρωτότοκον
  choice: Первенца
  rationale: Существительное употреблено как обозначение Сына; прописная буква показывает титульное употребление, не добавляя отсутствующего в греческом толкования.
- source_word: εἰς τὴν οἰκουμένην
  choice: во вселенную
  rationale: οἰκουμένη обозначает обитаемый мир, вселенную. «Во вселенную» естественно в возвышенном контексте и сохраняет отличие от более обычного κόσμος.
- source_word: λέγει
  choice: говорит
  rationale: Сохраняет настоящее время греческого текста и не добавляет подразумеваемое «в Писании».
- source_word: προσκυνησάτωσαν
  choice: да поклонятся
  rationale: Форма с «да» естественно передаёт повелительно-пожелательное значение аористного императива; «поклонятся» в контексте чести, воздаваемой Сыну всеми ангелами, сохраняет культовый смысл προσκυνέω.
- source_word: αὐτῷ
  choice: Ему
  rationale: Дательный объект при προσκυνέω естественно передаётся русским «поклониться Ему».
- source_word: πάντες ἄγγελοι θεοῦ
  choice: все ангелы Божьи
  rationale: Естественная русская передача родительного θεοῦ; вариант «все ангелы Бога» возможен, но стилистически тяжелее.
theological_decisions:
- issue: Синтаксическая связь πάλιν
  choice: '«вновь» относится к «вводит»: «когда Он вновь вводит Первенца»'
  alternative: '«и ещё говорит: когда Он вводит Первенца во вселенную…»'
  rationale: Положение πάλιν перед εἰσαγάγῃ позволяет связать наречие с действием введения, однако греческий текст допускает его понимание как формулы перехода к следующей цитате. Альтернатива сохранена в сноске.
- issue: Значение προσκυνέω по отношению к Сыну
  choice: «да поклонятся Ему»
  alternative: «да склонятся перед Ним» / «да воздадут Ему почтение»
  rationale: В контексте превосходства Сына над ангелами и всеобщего повеления ангелам «поклонятся» лучше сохраняет религиозную силу глагола, не сводя действие к обычному почтению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, относящиеся к Богу и Сыну, написаны с прописной буквы по принятой русской библейской традиции. Конструкция «да поклонятся» сохраняет торжественность цитаты и повелительно-пожелательную силу оригинала.
