source:
  edition: SBLGNT
  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: ru
  text: 'Но кому из ангелов Он когда-либо сказал: «Сядь по правую руку от Меня, пока Я не сделаю Твоих врагов подножием для Твоих ног[a]»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока Я не положу Твоих врагов под Твои ноги».'
    reason: 'Лексическая альтернатива: τίθημι допускает более буквальную передачу «положу», тогда как основной текст сохраняет конструкцию с ὑποπόδιον — «подножием».'
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: Но кому из ангелов
  rationale: Предлог πρός при глаголе речи и вопросительном местоимении передаётся естественным русским «кому». Союз δέ выражает контраст с предшествующим рассуждением, поэтому выбран союз «но».
- source_word: εἴρηκέν ποτε
  choice: Он когда-либо сказал
  rationale: Перфект εἴρηκεν указывает на однажды произнесённое слово, сохраняющее силу, а ποτέ придаёт вопросу значение «когда-либо». Русское прошедшее время здесь звучит естественно и не устраняет риторический акцент.
- source_word: Κάθου
  choice: Сядь
  rationale: Прямой и естественный перевод повелительной формы κάθημαι; сохраняет характер царского повеления.
- source_word: ἐκ δεξιῶν μου
  choice: по правую руку от Меня
  rationale: Устойчивое русское выражение для почётного места рядом с говорящим; передаёт локативный смысл библейской формулы воцарения.
- source_word: ἕως ἂν θῶ
  choice: пока Я не сделаю
  rationale: Конструкция ἕως ἂν с аористом сослагательного наклонения указывает на ожидаемое будущее действие. «Пока ... не сделаю» естественно сочетается с последующим именным дополнением «подножием».
- source_word: τοὺς ἐχθρούς σου
  choice: Твоих врагов
  rationale: Прямо передаёт определённое дополнение во множественном числе; прописная буква согласуется с обращением к Сыну в данной цитате.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: подножием для Твоих ног
  rationale: Сохраняет конкретный образ подчинения из Псалма 109:1 и при этом звучит понятно на современном русском языке.
theological_decisions:
- issue: Передача цитаты из Псалма 109:1 с сохранением её христологической силы без поясняющего пересказа
  choice: 'Сохранить прямую речь как обращённое к Сыну повеление о воцарении: «Сядь по правую руку от Меня, пока Я не сделаю Твоих врагов подножием для Твоих ног».'
  alternative: 'Передать образ толковательно, например: «пока Я полностью не покорю Твоих врагов».'
  rationale: Довод Послания к евреям зависит от точной формы цитаты и противопоставления Сына ангелам. Поэтому царский образ места по правую руку и образ врагов как подножия сохранены, а не заменены богословским объяснением.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прямой речи. Синтаксис риторического вопроса сохранён. Местоимения, относящиеся к Богу и Сыну в цитате, написаны с прописной буквы по принятой русской библейской традиции; архаические формы вроде «одесную» и «подножие ног Твоих» не использованы.
