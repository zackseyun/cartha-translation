source:
  edition: SBLGNT
  text: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων ἐλάλησεν ἡμῖν ἐν υἱῷ, ὃν ἔθηκεν κληρονόμον πάντων, δι’ οὗ καὶ ⸂ἐποίησεν τοὺς αἰῶνας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/002.yaml
  text: in these last days he has spoken to us in a Son[a], whom he appointed heir of all things[b], through whom he also made the ages.
translation:
  language: ru
  text: в эти последние дни говорил нам в Сыне[a], которого поставил наследником всего и через которого сотворил также века[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через Сына». Буквально по-гречески: «в Сыне»; перед словом «Сын» нет артикля, и выражение подчёркивает способ и высший характер Божьей речи. В русском языке отсутствие артикля отдельно передать невозможно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сотворил вселенную» либо «сотворил миры». Греческое «века» может обозначать как сами века, так и, в расширенном смысле, всё сотворённое мироздание.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων
  choice: в эти последние дни
  rationale: Естественная русская временная формулировка, сохраняющая эсхатологический смысл выражения; буквальное «при конце этих дней» звучало бы неестественно и могло бы сузить значение.
- source_word: ἐλάλησεν
  choice: говорил
  rationale: Передаёт речевое действие и поддерживает связь с противопоставлением прежней речи через пророков; русская форма прошедшего времени не требует искусственно воспроизводить английский перфект.
- source_word: ἐν υἱῷ
  choice: в Сыне
  rationale: Сохраняет необычное ἐν и не сводит выражение исключительно к посредничеству. В русском языке отсутствие артикля передать невозможно; заглавная буква ясно указывает на конкретного Сына в контексте.
- source_word: ὃν ἔθηκεν
  choice: которого поставил
  rationale: 'τίθημι с обозначением роли естественно передаётся глаголом «поставил»: Бог установил Сына наследником.'
- source_word: κληρονόμον πάντων
  choice: наследником всего
  rationale: Кратко и естественно передаёт всеохватность πάντων без ненужного добавления существительного «вещи».
- source_word: δι’ οὗ
  choice: через которого
  rationale: διά с родительным падежом обозначает посредничество или действующую причастность; относительная конструкция точно сохраняется.
- source_word: ἐποίησεν
  choice: сотворил
  rationale: В космологическом контексте «сотворил» естественно выражает ποιέω, не меняя утверждения о Божьем действии на более узкое описание процесса.
- source_word: τοὺς αἰῶνας
  choice: века
  rationale: Сохраняет временно-космическую широту αἰῶνες. Возможное расширенное значение — мироздание или вселенная — вынесено в примечание.
theological_decisions:
- issue: Христологическая сила выражения ἐν υἱῷ
  choice: в Сыне
  alternative: через Сына; в лице Сына; в Сыне Своём
  rationale: Основной текст сохраняет предлог ἐν и риторически необычную форму оригинала, не добавляя отсутствующее притяжательное местоимение. При этом контекст однозначно говорит о Сыне, а не об одном из многих сыновей.
- issue: Объём значения τοὺς αἰῶνας и участие Сына в творении
  choice: века
  alternative: вселенную; мироздание; миры
  rationale: «Века» удерживает явный лексический образ оригинала и его временное измерение, тогда как примечание сообщает о засвидетельствованном космологическом значении выражения. Так перевод не устраняет смысловую широту текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Необычное «в Сыне» намеренно сохранено ради формы и смысловой напряжённости греческого текста; пояснение дано в примечании. Союз «также» оставлен рядом со сказуемым, чтобы передать καί без тяжеловесности.
