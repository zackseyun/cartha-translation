base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: ru
  text: 'А о Сыне сказано[a]: «Твой престол, Боже[c], — во веки веков, и скипетр правоты[b] — скипетр Твоего Царства».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А Сыну Он говорит». В греческом тексте глагол речи подразумевается, а оборот может передавать как адресата слов, так и того, о ком они сказаны.'
    reason: syntactic_alternative
  - marker: b
    text: 'Или: «скипетр праведности». Греческое слово может обозначать прямоту, правильность или нравственную праведность.'
    reason: lexical_alternative
  - marker: c
    text: 'Или, менее вероятно: «Бог — Твой престол во веки веков». Греческое построение обсуждается, но прямое обращение «Твой престол, Боже» лучше соответствует контексту и смыслу цитаты.'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: А о Сыне сказано
  rationale: Оборот πρός с винительным падежом при подразумеваемом глаголе речи может означать обращение к Сыну или слова о Нём. Безличное «сказано» естественно по-русски восполняет подразумеваемый глагол и не уточняет его субъекта сверх текста.
- source_word: υἱόν
  choice: Сыне
  rationale: Определённый артикль указывает на титульное употребление; «Сын» сохраняет христологический титул и противопоставление ангелам.
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: Твой престол, Боже
  rationale: ὁ θεός лучше всего понимается здесь как обращение, несмотря на форму с артиклем. Такое прочтение соответствует контексту цитаты и ходу рассуждения Послания; грамматически возможная альтернатива вынесена в сноску.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: во веки веков
  rationale: Устойчивый русский библейский оборот естественно передаёт усиленное обозначение бесконечной длительности.
- source_word: ῥάβδος
  choice: скипетр
  rationale: В царском контексте слово обозначает жезл правителя как знак власти; «скипетр» точно передаёт этот образ.
- source_word: τῆς εὐθύτητος
  choice: правоты
  rationale: εὐθύτης обозначает прямоту, правильность и нравственную правоту. «Правота» сохраняет основной образ и звучит естественно в сочетании со «скипетром»; возможное «праведности» отмечено в сноске.
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: скипетр Твоего Царства
  rationale: βασιλεία здесь допускает значения царства, царской власти и правления. «Царство» прямо передаёт форму исходного выражения и сохраняет традиционный царский образ.
theological_decisions:
- issue: Является ли ὁ θεός прямым обращением к Сыну или именной частью высказывания «Бог — Твой престол».
  choice: 'Прямое обращение: «Твой престол, Боже».'
  alternative: «Бог — Твой престол во веки веков».
  rationale: Прямое обращение лучше соответствует контексту Евр 1, где через цепь цитат раскрывается превосходство и уникальное положение Сына, а также естественной силе цитаты из Псалма. Поскольку другая синтаксическая трактовка грамматически возможна и обсуждается, она сохранена в сноске без замалчивания напряжения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром, уместным для царской цитаты. Сохранены традиционные и понятные выражения «во веки веков» и «скипетр». Местоимения, относящиеся к Богу и Сыну, написаны с прописной буквы в соответствии с принятой русской библейской практикой.
