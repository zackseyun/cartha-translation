  text: καί· Σὺ κατ’ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/010.yaml
  text: And[a], “You, Lord, in the beginning laid the foundation of the earth, and the heavens are the works of your hands.”
translation:
  language: ru
  text: 'И ещё: «Ты, Господи, в начале[a] заложил основание земли, и небеса — творения Твоих рук».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вначале».'
    reason: Лексико-стилистическая альтернатива для κατ’ ἀρχάς; выражение обозначает первоначальное время творения.
lexical_decisions:
- source_word: καί
  choice: И ещё
  rationale: Союз вводит следующую цитату в последовательности свидетельств; «И ещё» естественно передаёт добавочную связь, не перегружая текст.
- source_word: Σὺ
  choice: Ты
  rationale: Явно выраженное местоимение имеет эмфатический оттенок и сохранено в начале прямого обращения.
- source_word: κατ’ ἀρχάς
  choice: в начале
  rationale: Устойчивое временное выражение указывает на первоначало творения; вариант сохраняет библейское звучание и допускаемую исходным текстом смысловую широту.
- source_word: κύριε
  choice: Господи
  rationale: Звательная форма κύριος передана естественной русской формой прямого обращения «Господи».
- source_word: τὴν γῆν
  choice: земли
  rationale: В паре с небесами γῆ обозначает землю как часть сотворённого мира; родительный падеж обусловлен русским выражением «положил основание земли».
- source_word: ἐθεμελίωσας
  choice: положил основание
  rationale: Перевод сохраняет конкретный строительный образ глагола θεμελιόω и звучит естественно по-русски.
- source_word: ἔργα τῶν χειρῶν σού
  choice: дело Твоих рук
  rationale: Единственное собирательное «дело» согласуется в русском с подлежащим «небеса» через именную конструкцию и сохраняет образ рук; по смыслу небеса представлены как произведение Божьих рук.
- source_word: οἱ οὐρανοί
  choice: небеса
  rationale: Русское множественное «небеса» точно соответствует форме источника и подходит контексту творения.
theological_decisions:
- issue: Применение к Сыну слов Псалма, обращённых к Господу
  choice: Сохранено прямое обращение «Ты, Господи» без ослабления его силы.
  alternative: Передать обращение нейтральнее либо опустить титул, уменьшая христологическую выразительность цитаты.
  rationale: В греческом тексте прямо стоит звательная форма κύριε, а контекст Послания относит цитату к Сыну. Перевод сохраняет это, не добавляя богословских пояснений в сам стих.
translation_notes:
  register: Современный литературный русский с достоинством библейской цитаты. Синтаксис сделан ясным для обычного читателя; прописные буквы в «Твоих» отражают принятое уважительное оформление обращения к Богу, не изменяя смысла оригинала.
