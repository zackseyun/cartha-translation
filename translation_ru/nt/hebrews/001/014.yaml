id: HEB.1.14
reference: Hebrews 1:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/014.yaml
  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: ru
  text: Не все ли они — служебные духи, посылаемые на служение ради тех, кому предстоит унаследовать спасение?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые унаследуют спасение». Греческое выражение указывает на будущее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ πάντες
  choice: Не все ли они
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и сохраняет всеохватность πάντες.
- source_word: λειτουργικὰ πνεύματα
  choice: служебные духи
  rationale: Сохраняет значение духовных существ, исполняющих порученное служение, а также возвышенный оттенок λειτουργικός, не превращая выражение в название церковной должности.
- source_word: εἰς διακονίαν
  choice: на служение
  rationale: Предлог εἰς выражает цель; существительное «служение» сохраняет именную форму διακονία и естественно звучит по-русски.
- source_word: ἀποστελλόμενα
  choice: посылаемые
  rationale: Причастие настоящего времени в пассивном залоге передано русским страдательным причастием, описывающим духов как тех, кого посылают.
- source_word: διὰ τοὺς
  choice: ради тех
  rationale: Передаёт направленность действия на благо названных людей, не сводя διά лишь к причинному значению.
- source_word: τοὺς μέλλοντας
  choice: тех, кому предстоит
  rationale: Сохраняет перспективную, ориентированную на будущее силу μέλλω, не добавляя идеи предопределённости.
- source_word: κληρονομεῖν σωτηρίαν
  choice: унаследовать спасение
  rationale: Сохраняет образ наследования и обычное богословское значение σωτηρία в контексте Послания к евреям.
theological_decisions:
- issue: Смысл μέλλοντας κληρονομεῖν σωτηρίαν
  choice: кому предстоит унаследовать спасение
  alternative: которые унаследуют спасение
  rationale: Основной текст сохраняет перспективный оттенок μέλλω, но не уточняет основание или неизбежность будущего наследования и тем самым не разрешает богословское напряжение сверх сказанного в греческом тексте.
translation_notes:
  register: Современный литературный русский с достоинством библейской прозы. Тире делает риторический вопрос прозрачным; сочетание «служебные духи» сохраняет возвышенный традиционный оттенок, а «посылаемые на служение» точно воспроизводит различие между λειτουργικός и διακονία.
