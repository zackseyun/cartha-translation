reference: Hebrews 1:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε, καὶ πάλιν· Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα, καὶ αὐτὸς ἔσται μοι εἰς υἱόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/005.yaml
  text: For to which of the angels did he ever say[a], “You are my Son; today I have begotten you”? And again, “I will be to him a father[c][b], and he will be to me a son”?
translation:
  language: ru
  text: 'Ведь кому из ангелов Он когда-либо сказал[a]: «Ты — Мой Сын, Я сегодня родил Тебя»[b], — и ещё: «Я буду ему отцом, и он будет Мне сыном»[c]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «сказал когда-нибудь».'
    reason: lexical_alternative
  - marker: b
    text: Слова «Я сегодня родил Тебя» — цитата из Псалма 2:7. Их связывают с царским воцарением, воскресением или вечным отношением Сына к Отцу; перевод сохраняет формулировку, не выбирая одно из этих толкований.
    reason: cross_reference
  - marker: c
    text: 'Цитата из 2 Царств 7:14. Возможен более свободный перевод: «Я буду его Отцом, и он будет Моим сыном».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τίνι ... τῶν ἀγγέλων
  choice: кому из ангелов
  rationale: Дательный вопросительного местоимения вместе с родительным разделительным естественно передаётся как «кому из ангелов», сохраняя сопоставление Сына с ангелами.
- source_word: γὰρ
  choice: ведь
  rationale: «Ведь» естественно выражает пояснительную связь с предшествующим рассуждением и хорошо вводит риторический вопрос.
- source_word: εἶπέν ποτε
  choice: когда-либо сказал
  rationale: Сочетание аориста с ποτέ означает отсутствие какого бы то ни было случая; русский оборот передаёт силу риторического вопроса без утяжеления.
- source_word: ἀγγέλων
  choice: ангелов
  rationale: В контексте первой главы Послания к евреям речь идёт о небесных ангелах, а не о человеческих посланниках.
- source_word: Υἱός μου εἶ σύ
  choice: Ты — Мой Сын
  rationale: Естественный русский порядок слов сохраняет именное утверждение и прямое обращение; тире подчёркивает сказуемое, а «Сын» передаёт титульное употребление в христологическом контексте.
- source_word: σήμερον
  choice: сегодня
  rationale: Прямое соответствие временному наречию без истолковывающего парафраза.
- source_word: γεγέννηκά σε
  choice: родил Тебя
  rationale: Прямо сохраняется образ γεννάω и формулировка Псалма 2:7; перевод не заменяет её толкованием о воцарении, воскресении или вечном отношении Сына к Отцу.
- source_word: καὶ πάλιν
  choice: И ещё
  rationale: Формула вводит следующую цитату Писания; «И ещё» звучит естественно и ясно в современном русском языке.
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: Я буду ему отцом
  rationale: Передаёт дательный αὐτῷ и конструкцию εἰς с сохранением торжественного заветного параллелизма цитаты.
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: и он будет Мне сыном
  rationale: Сохраняет параллельную конструкцию, дательный μοι и предикативное значение εἰς υἱόν.
theological_decisions:
- issue: Передача сыновней лексики в двух ветхозаветных цитатах
  choice: В первой цитате употреблено «Сын» как прямое именование адресата, а во второй — «сыном» как часть заветной формулы.
  alternative: Писать оба слова с прописной буквы для явного христологического отождествления либо оба со строчной, избегая толкующей капитализации.
  rationale: Послание применяет обе цитаты к Сыну, однако первая прямо называет адресата «Мой Сын», тогда как вторая воспроизводит заветную формулу из 2 Царств 7:14. Различие сохраняет литературную форму цитат, не ослабляя аргумента контекста.
- issue: Смысл слов «Я сегодня родил Тебя»
  choice: Сохранить формулировку цитаты без уточнения её богословского референта в основном тексте.
  alternative: Истолковать выражение непосредственно как воцарение, воскресение или вечное рождение Сына.
  rationale: Сам стих не разрешает здесь всех возможных связей этой формулы; буквальное сохранение образа удерживает подлинную богословскую многозначность.
- issue: Прописные буквы в местоимениях, относящихся к Богу и Сыну
  choice: Сохранить русскую почтительную капитализацию для говорящего Бога и прямого адресата, но оставить местоимения третьего лица во второй ветхозаветной цитате со строчной буквы.
  alternative: Унифицировать все божественные местоимения с прописной либо все со строчной буквы.
  rationale: Такой выбор делает прямое обращение ясным, но не вносит в форму второй цитаты больше явной христологической маркировки, чем требуется её заветной формулой.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Риторическая структура сохранена двумя вопросительными фрагментами; «ведь» ясно связывает стих с предшествующим доводом. Формулы «родил Тебя» и «буду ему отцом» намеренно не сглажены, чтобы сохранить образность и заветный параллелизм источника.
