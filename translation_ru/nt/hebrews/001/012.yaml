base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: ru
  text: И, словно плащ, Ты свернёшь их[a]; как одежда, они изменятся. Но Ты — тот же, и годы Твои не окончатся[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сложишь их».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не прекратятся»; «не иссякнут».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: словно
  rationale: Передаёт сравнительное значение естественным для современного русского языка способом и сохраняет поэтический образ.
- source_word: περιβόλαιον
  choice: плащ
  rationale: Слово обозначает то, чем оборачиваются, в частности верхнюю одежду. «Плащ» ясно и без архаизации сохраняет образ одежды.
- source_word: ἑλίξεις
  choice: свернёшь
  rationale: Будущая форма глагола ἑλίσσω допускает значения сворачивания и складывания. «Свернёшь» сохраняет наглядный образ обращения с небесами как с одеждой.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение отсылает к упомянутым ранее творениям; русское «их» естественно сохраняет эту связь.
- source_word: ὡς ἱμάτιον
  choice: как одежда
  rationale: Сохраняет второе сравнение с одеждой и параллелизм поэтической цитаты.
- source_word: ἀλλαγήσονται
  choice: они изменятся
  rationale: Передаёт будущую форму и смысл перемены, которой подвергнется сотворённый порядок, не уточняя сверх текста характер этой перемены.
- source_word: σὺ δὲ
  choice: Но Ты
  rationale: «Но» ясно выражает резкий контраст между изменчивым творением и неизменностью адресата.
- source_word: ὁ αὐτὸς
  choice: остаёшься тем же
  rationale: Естественно по-русски передаёт устойчивое выражение о тождественности и постоянстве, не вводя позднейшей технической терминологии.
- source_word: τὰ ἔτη σου
  choice: годы Твои
  rationale: Буквально сохраняет временной поэтический образ непрекращающегося существования.
- source_word: οὐκ ἐκλείψουσιν
  choice: не окончатся
  rationale: Передаёт здесь значение «не прекратятся, не придут к концу» и звучит естественно применительно к годам.
theological_decisions:
- issue: Выражение постоянства адресата в христологической цитате
  choice: Но Ты остаёшься тем же
  alternative: Но Ты — тот же; Но Ты неизменен
  rationale: Выбранный вариант сохраняет противопоставление изменяющегося творения постоянству адресата и смысл греческого ὁ αὐτός, но не превращает поэтическое высказывание в отвлечённый богословский термин.
- issue: Характер перемены творения
  choice: они изменятся
  alternative: они будут изменены
  rationale: Русская возвратная форма естественно передаёт греческий пассив без уточнения действующего лица и сохраняет заложенную в тексте неопределённость относительно характера перемены.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Образы плаща и одежды сохранены, синтаксис сделан ясным для обычного читателя. Прописные формы «Ты», «Твои» соответствуют традиционному русскому оформлению обращения к Богу, не добавляя толкования к самому содержанию стиха.
