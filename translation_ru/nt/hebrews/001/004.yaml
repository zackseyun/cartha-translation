  text: having become as much superior to the angels as the name he has inherited is more excellent than theirs.
translation:
  language: ru
  text: став настолько выше ангелов, насколько более славное, чем у них, имя Он унаследовал[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «став настолько лучше ангелов, насколько более почётное, чем у них, имя Он унаследовал».'
