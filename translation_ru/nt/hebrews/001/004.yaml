lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: настолько ... насколько
  rationale: Русская соотносительная конструкция естественно передаёт пропорциональное сопоставление двух степеней превосходства.
- source_word: κρείττων
  choice: выше
  rationale: В контексте сравнения Сына с ангелами слово указывает прежде всего на превосходство в положении и достоинстве, а не на нравственное качество; «выше» ясно передаёт этот смысл.
- source_word: γενόμενος
  choice: став
  rationale: Деепричастие сохраняет значение греческого аористного причастия и связь с предшествующим контекстом, не привнося идеи сотворения, возможной при переводе «будучи сделан».
- source_word: τῶν ἀγγέλων
  choice: ангелов
  rationale: Родительный падеж после сравнительной формы естественно передаёт греческий генитив сравнения.
- source_word: διαφορώτερον
  choice: превосходнее
  rationale: Сравнительная форма выражает не просто отличие, а более высокое достоинство или значимость имени.
- source_word: παρ’ αὐτούς
  choice: их
  rationale: 'Местоимение сохранено как объект сравнения: имя превосходнее самих ангелов. Это ближе к греческой формулировке, чем пояснительное «их имени».'
- source_word: κεκληρονόμηκεν
  choice: Он унаследовал
  rationale: 'Совершенный вид передаёт достигнутый результат греческого перфекта: имя получено в наследие и принадлежит Ему.'
- source_word: ὄνομα
  choice: имя
  rationale: Буквальный перевод сохраняет литературное развитие мысли; последующий контекст поясняет, о каком имени идёт речь, без преждевременной подстановки титула.
theological_decisions:
- issue: Христологический смысл γενόμενος («став»)
  choice: Передать глагольную форму прямо как «став», относя её в контексте к достигнутому превосходящему положению Сына.
  alternative: «будучи сделан выше» либо перевод, прямо утверждающий изменение божественной природы Сына
  rationale: Текст говорит о превосходстве над ангелами и об унаследованном имени. Перевод сохраняет мотив возвышения, но не добавляет отсутствующего в стихе утверждения о сотворении Сына или приобретении Им божественности.
- issue: Значение слова «имя»
  choice: Сохранить слово «имя», позволив следующим стихам раскрыть его как имя и положение Сына.
  alternative: Сразу перевести как «титул Сына» или обобщить до «чести и положения»
  rationale: В данном стихе стоит именно «имя»; буквальная передача сохраняет образ и последовательность аргумента автора, не исключая более широких оттенков достоинства и статуса.
- issue: Объект сравнения в παρ’ αὐτούς
  choice: «имя ... превосходнее их», то есть ангелов
  alternative: «имя ... превосходнее их имени»
  rationale: Греческое местоимение соотносится с ангелами и буквально не содержит повторного слова «имя». Основной текст сохраняет эту лёгкую смысловую напряжённость, а не устраняет её толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим возвышенному стилю Послания к евреям. Начальное деепричастие сохраняет синтаксическую связь стиха с предыдущим предложением. Местоимение «Он» написано с прописной буквы как принятое в русском библейском регистре обозначение Сына.
