    reason: lexical_alternative
  - marker: c
    text: 'Или: «предкам». Буквально: «отцам».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «посредством пророков»; буквально: «в пророках».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολυμερῶς
  choice: частями
  rationale: Передаёт мысль о множественности частей или отдельных порций откровения и сохраняет отличие от следующего наречия πολυτρόπως, обозначающего разнообразие способов.
- source_word: πολυτρόπως
  choice: разными способами
  rationale: Естественно для современного русского языка передаёт разнообразие образов и способов Божьей речи, не смешивая его со значением Πολυμερῶς.
- source_word: πάλαι
  choice: В древности
  rationale: Передаёт отдалённость прежнего времени ясно, литературно и без излишне архаического оттенка.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Прямое соответствие подлежащему греческого предложения.
- source_word: λαλήσας
  choice: говорил
  rationale: Хотя в греческом употреблено причастие аориста, его конструкция завершается главным глаголом в Евр 1:2. Для самостоятельного русского текста стиха личная форма звучит естественно и сохраняет временное противопоставление со следующим стихом.
- source_word: τοῖς πατράσιν
  choice: отцам
  rationale: Сохраняет буквальный, историко-заветный и грамматически мужской образ греческого выражения, не добавляя отсутствующего в тексте местоимения «нашим».
- source_word: ἐν τοῖς προφήταις
  choice: через пророков
  rationale: 'Передаёт инструментальное значение ἐν: Бог является говорящим, а пророки — посредниками его речи. По-русски это естественнее буквального «в пророках».'
theological_decisions:
- issue: Передача причастной конструкции в связи с Евр 1:2
  choice: Употребить в стихе 1 личную форму «Бог… говорил», сохранив возможность временного противопоставления со стихом 2.
  alternative: 'Более формально сохранить причастие: «Бог, в древности… говоривший…» или «Бог, некогда говорив…».'
  rationale: Греческое λαλήσας синтаксически связано с главным глаголом следующего стиха, однако при отдельном представлении Евр 1:1 буквальная причастная конструкция остаётся незавершённой или звучит неестественно. Личная форма передаёт смысл без добавления богословского толкования.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Порядок слов сохраняет парность двух греческих наречий. «Частями» несколько необычно, но осознанно удерживает смысловое различие между фрагментарностью прежнего откровения и разнообразием способов его передачи.
