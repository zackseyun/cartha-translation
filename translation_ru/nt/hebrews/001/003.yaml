id: HEB.1.3
reference: Hebrews 1:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως, ⸂δι’ αὑτοῦ⸃ καθαρισμὸν ⸂τῶν ἁμαρτιῶν ποιησάμενος⸃ ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/003.yaml
  text: He[a], being the radiance of his glory and the exact imprint of his being, and sustaining all things by the word of his power, after making purification for sins through himself[b], sat down at the right hand of the Majesty on high[c],
translation:
  language: ru
  text: Он[a] — сияние Его славы и точный отпечаток Его сущности. Он поддерживает всё словом Своей силы и, совершив через Самого Себя[b] очищение от грехов, воссел по правую руку Величия в вышних[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Который»; речь идёт о Сыне, упомянутом в предыдущем стихе.'
    reason: referent_clarification
  - marker: b
    text: 'В некоторых рукописях слов «через Самого Себя» нет; здесь они включены согласно тексту SBLGNT. Возможный перевод: «Сам Собою».'
    reason: textual_variant
  - marker: c
    text: 'Или: «на высотах», «на небесах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: сияние
  rationale: Передаёт исходящее сияние славы и не ослабляет образ до простого отражения.
- source_word: δόξα
  choice: слава
  rationale: Устоявшийся и содержательно ёмкий эквивалент в контексте Божьего величия.
- source_word: χαρακτήρ
  choice: точный отпечаток
  rationale: Сохраняет конкретный образ оттиска, указывающего на точное соответствие.
- source_word: ὑπόστασις
  choice: сущность
  rationale: В данном контексте обозначает действительную, основополагающую реальность Бога; слово сохраняет онтологическую силу, хотя может иметь позднейшие богословские ассоциации.
- source_word: φέρων
  choice: поддерживает
  rationale: Выражает непрерывное деятельное сохранение и несение всего существующего.
- source_word: τὰ πάντα
  choice: всё
  rationale: Сохраняет всеобъемлющий смысл без ограничения только физической вселенной.
- source_word: τῷ ῥήματι τῆς δυνάμεως
  choice: словом Своей силы
  rationale: Формально сохраняет греческую конструкцию и образ действенного властного слова.
- source_word: δι’ αὑτοῦ
  choice: через Самого Себя
  rationale: Передаёт обычное инструментальное значение предлога διά и следует чтению SBLGNT.
- source_word: καθαρισμὸν τῶν ἁμαρτιῶν
  choice: очищение от грехов
  rationale: Естественная русская конструкция, сохраняющая культово-жертвенный оттенок очищения.
- source_word: ποιησάμενος
  choice: совершив
  rationale: Деепричастие естественно обозначает действие, предшествующее главному глаголу «воссел».
- source_word: ἐν δεξιᾷ
  choice: по правую руку
  rationale: Естественное достоинственное выражение почётного положения рядом с Величием.
- source_word: ἐν ὑψηλοῖς
  choice: в вышних
  rationale: Кратко сохраняет пространственно-возвышенный и торжественный смысл греческого выражения.
theological_decisions:
- issue: Значение ὑπόστασις в христологически значимом стихе
  choice: сущность
  alternative: бытие; природа; действительность
  rationale: «Сущность» ясно передаёт онтологическую силу контекста, но перевод не добавляет позднейшей соборной терминологии сверх самого текста.
- issue: Христологическая сила образов ἀπαύγασμα и χαρακτήρ
  choice: сияние Его славы и точный отпечаток Его сущности
  alternative: отражение славы и образ природы
  rationale: Выбранная формулировка сохраняет сильное утверждение текста и не ослабляет его до внешнего или приблизительного подобия.
- issue: Разночтение с δι’ αὑτοῦ
  choice: включить «через Самого Себя» в основной текст
  alternative: опустить фразу; передать «Сам Собою»
  rationale: SBLGNT включает δι’ αὑτοῦ; разночтение прозрачно отмечено в сноске.
- issue: Соотношение причастий с главным глаголом
  choice: настоящее поддерживающее действие и предшествующее очищение
  alternative: передать все действия как одновременные
  rationale: Настоящее φέρων описывает продолжающееся действие, тогда как аорист ποιησάμενος естественно предшествует ἐκάθισεν.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Длинная греческая периодическая конструкция разделена на два предложения ради ясности, при этом логические связи сохранены. «В вышних» намеренно оставлено как понятное высокорегистровое выражение; альтернативы даны в сноске.
