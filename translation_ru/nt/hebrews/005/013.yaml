  text: πᾶς γὰρ ὁ μετέχων γάλακτος ἄπειρος λόγου δικαιοσύνης, νήπιος γάρ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/013.yaml
  text: For everyone who partakes of milk is unskilled in the word of righteousness[b][a], for he is an infant.
translation:
  language: ru
  text: Ибо всякий, кто питается молоком, не сведущ в слове праведности[a][b], ибо он младенец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в вести о праведности»; возможно также: «в слове о праведности».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедливости».'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ... ὁ μετέχων
  choice: всякий, кто питается
  rationale: Артикль с причастием образует обобщённое обозначение каждого человека данного рода. «Питается» естественно передаёт образ употребления молока, не усиливая его до исключительного «живёт одним молоком».
- source_word: γάλακτος
  choice: молоком
  rationale: Буквальное обозначение сохранено как часть развёрнутой метафоры духовной незрелости.
- source_word: ἄπειρος
  choice: неопытен
  rationale: Слово указывает на отсутствие опыта или умения, а не обязательно на полное незнание; «неопытен» естественно сочетается со «словом праведности».
- source_word: λόγου δικαιοσύνης
  choice: в слове праведности
  rationale: 'Компактная конструкция сохраняет неоднозначность родительного падежа: это может быть слово, несущее праведность, или весть о праведности.'
- source_word: δικαιοσύνης
  choice: праведности
  rationale: «Праведность» передаёт религиозно-нравственную широту δικαιοσύνη и не сужает значение исключительно до общественной справедливости.
- source_word: νήπιος
  choice: младенец
  rationale: Точно сохраняет резкую метафору незрелости и непосредственную связь с молоком.
- source_word: γάρ ... γάρ
  choice: ведь ... потому что
  rationale: Оба союза имеют пояснительную функцию; варьирование делает русскую аргументацию естественной, сохраняя обе логические связи.
theological_decisions:
- issue: Значение δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: В контексте духовного наставления «праведность» наиболее полно сохраняет нравственно-богословский смысл, тогда как возможное значение «справедливость» отмечено отдельно.
- issue: Связь родительного падежа в λόγου δικαιοσύνης
  choice: слово праведности
  alternative: весть о праведности
  rationale: Формальная конструкция в основном тексте сохраняет смысловую открытость греческого выражения и не решает без достаточных оснований, обозначает ли родительный падеж содержание, качество или результат слова.
- issue: Обобщённый мужской род νήπιος ... ἐστιν
  choice: он младенец
  alternative: такой человек — младенец
  rationale: Местоимение отражает грамматический мужской род единственного числа и остаётся в русском языке естественным обобщённым обозначением; утверждение не ограничивается мужчинами.
translation_notes:
  register: Современный литературный русский язык с ясной, но dignified библейской интонацией. Сохранены образ молока и младенца, обе пояснительные связи γάρ и смысловая неоднозначность λόγου δικαιοσύνης.
