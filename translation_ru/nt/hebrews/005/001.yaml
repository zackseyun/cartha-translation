source:
  edition: SBLGNT
  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: ru
  text: Ведь всякий первосвященник, избираемый из людей, назначается для людей в том, что относится к Богу, чтобы приносить дары и жертвы за грехи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς
  choice: всякий
  rationale: 'Передаёт распределительное значение единственного числа: речь идёт о каждом первосвященнике как представителе этого служения.'
- source_word: γὰρ
  choice: ведь
  rationale: Естественно вводит пояснение и обоснование предшествующей мысли.
- source_word: ἀρχιερεὺς
  choice: первосвященник
  rationale: Устоявшееся и точное обозначение иудейской священнической должности.
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: избираемый из людей
  rationale: Сохраняет пассивный смысл причастия и указывает, что первосвященник берётся из среды людей; «избираемый» звучит естественнее буквального «берущийся» и не уточняет, кем совершается избрание.
- source_word: ὑπὲρ ἀνθρώπων
  choice: от имени людей
  rationale: Передаёт значение представительства и посреднического служения ради людей.
- source_word: καθίσταται
  choice: поставляется
  rationale: Обозначает возведение или назначение на установленное служение и сохраняет пассивную форму.
- source_word: τὰ πρὸς τὸν θεόν
  choice: в том, что относится к Богу
  rationale: Передаёт широту греческого оборота, не сводя его только к одному аспекту богослужения.
- source_word: ἵνα προσφέρῃ
  choice: чтобы приносить
  rationale: Сохраняет выраженное конструкцией ἵνα назначение первосвященнического служения.
- source_word: δῶρά τε καὶ θυσίας
  choice: дары и жертвы
  rationale: Сохраняет оба культовых термина; русский союз естественно передаёт сочетание τε καὶ без обязательного добавления «как… так и».
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: за грехи
  rationale: Устоявшееся в жертвенном контексте выражение для приношений, совершаемых в связи с грехами.
theological_decisions:
- issue: Представительный смысл ὑπὲρ ἀνθρώπων
  choice: служить от имени людей
  alternative: служить ради людей; быть поставленным за людей
  rationale: Формулировка передаёт посредническую направленность служения, не внося дополнительного учения о точном характере представительства.
- issue: Обобщающее значение ἀνθρώπων
  choice: людей в обоих случаях
  alternative: мужчин; человеков
  rationale: Греческое ἄνθρωπος здесь обозначает людей как человечество, тогда как исторически мужской характер должности уже выражен словом «первосвященник». Русское «людей» точно и естественно сохраняет повтор исходного слова.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены синтаксическая связь причастия с подлежащим, повтор слова «людей» и различие между «дарами» и «жертвами»; избегнуты архаизмы вроде «человеков».
