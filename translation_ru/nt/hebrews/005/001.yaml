revisions:
- from: Ведь всякий первосвященник, избираемый из людей, поставляется служить от имени людей в том, что относится к Богу, чтобы приносить дары и жертвы за грехи.
  to: Ведь всякий первосвященник, избираемый из людей, назначается для людей в том, что относится к Богу, чтобы приносить дары и жертвы за грехи.
  rationale: Убрано не выраженное в оригинале «служить»; «для людей» непосредственно относится к назначению первосвященника и передаёт представительскую направленность ὑπὲρ ἀνθρώπων, не добавляя толкования. Остальная лексика сохранена как точная, естественная и соответствующая регистру.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:50:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: обобщающее «всякий», происхождение первосвященника «из людей», его назначение в отношении Бога и принесение даров и жертв за грехи сохранены. Однако «поставляется служить от имени людей» синтаксически перераспределяет греческие связи: глагол «служить» отсутствует в оригинале, а «от имени людей» оказывается зависимым от добавленного глагола, а не непосредственно от «поставляется».'
  naturalness: Текст в целом литературен и понятен. Формула «поставляется служить от имени людей» несколько тяжеловесна и создаёт не вполне точное впечатление, будто речь прежде всего о словесном представительстве. «Назначается для людей в том, что относится к Богу» естественна в умеренно возвышенном библейском регистре и лучше сохраняет структуру оригинала.
  terminology: «Первосвященник», «дары», «жертвы» и «за грехи» удачны и терминологически устойчивы. «Людей» является точной современной передачей ἀνθρώπων в обоих случаях; специальная сноска не требуется. «Избираемый» допустимо передаёт пассивное λαμβανόμενος в контексте поставления на должность.
  issues:
  - severity: medium
    issue: Добавлен глагол «служить», а оборот «от имени людей» присоединён к нему.
    rationale: 'В греческом ὑπὲρ ἀνθρώπων непосредственно характеризует назначение первосвященника: он поставляется для/ради людей в делах, относящихся к Богу. Добавленное «служить» не необходимо и ослабляет исходную синтаксическую связь.'
  revised_text: Ведь всякий первосвященник, избираемый из людей, назначается для людей в том, что относится к Богу, чтобы приносить дары и жертвы за грехи.
