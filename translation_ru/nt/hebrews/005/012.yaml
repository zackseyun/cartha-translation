  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: ru
  text: Ибо, хотя к этому времени вам уже следовало бы быть учителями, вы снова нуждаетесь в том, чтобы кто-то учил вас самым первым основам[a] изречений Бога[b]. Вы дошли до того, что вам нужно молоко, а не твёрдая пища.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «элементам начала»; возможный перевод: «начальным принципам».'
    reason: lexical_alternative
  - marker: b
    text: «Изречения Бога» — слова или откровения, исходящие от Бога; речь не идёт о языческих оракулах.
    reason: cultural_note
lexical_decisions:
- source_word: ὀφείλοντες εἶναι
  choice: вам уже следовало бы быть
  rationale: Передаёт ожидаемую обязанность и несостоявшееся к настоящему моменту взросление без излишне юридического оттенка.
- source_word: διδάσκαλοι
  choice: учителями
  rationale: Прямое и естественное обозначение тех, кто способен наставлять других.
- source_word: διὰ τὸν χρόνον
  choice: по прошествии столь долгого времени
  rationale: Выражает обусловленное истекшим временем ожидание зрелости; слово «столь» естественно передаёт подразумеваемую длительность.
- source_word: πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς
  choice: вы снова нуждаетесь в том, чтобы кто-то учил вас
  rationale: Сохраняет значение повторной нужды в обучении; подразумеваемый деятель выражен словом «кто-то» ради ясности русского синтаксиса.
- source_word: τινὰ τὰ στοιχεῖα τῆς ἀρχῆς
  choice: самым первым основам
  rationale: Передаёт риторически усиленную мысль о начальных, элементарных предметах обучения, избегая неестественного буквального сочетания «элементы начала».
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: изречений Бога
  rationale: «Изречения» сохраняет возвышенное значение λόγια как слов или откровений, исходящих от Бога, и не вносит языческой ассоциации слова «оракулы».
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: вы дошли до того, что вам нужно
  rationale: Передаёт достигнутое состояние, подчёркнутое перфектом, а также укоризненную направленность контекста.
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: молоко, а не твёрдая пища
  rationale: Сохраняет авторскую метафору и её резкое противопоставление без поясняющего богословского парафраза.
theological_decisions:
- issue: Метафорическое противопоставление молока и твёрдой пищи
  choice: Метафора сохранена без расшифровки как особой системы ступеней духовного обучения.
  alternative: Передать как «начальное учение, а не более глубокое учение».
  rationale: Сам стих не определяет техническую программу обучения; сохранение образа удерживает риторическую силу и богословскую открытость текста.
- issue: Значение τῶν λογίων τοῦ θεοῦ
  choice: «изречений Бога» — Божественных слов или откровений.
  alternative: «слова Божьего» либо «оракулов Бога».
  rationale: Выбор сохраняет особый смысл λόγια, не ограничивая его конкретным корпусом Писания и не вызывая ненужных ассоциаций с языческими оракулами.
translation_notes:
  register: Современный литературный русский язык с достойным, но общедоступным звучанием. Повтор «учителями — учил» сохранён вслед за греческим διδάσκαλοι — διδάσκειν. Образ молока и твёрдой пищи оставлен без конфессиональной конкретизации.
