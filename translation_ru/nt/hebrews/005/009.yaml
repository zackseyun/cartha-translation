lexical_decisions:
- source_word: τελειωθεὶς
  choice: достигнув совершенства
  rationale: Аористное страдательное причастие от τελειόω указывает здесь на достижение предназначенной полноты и завершение пути, связанного с первосвященническим и спасительным служением, а не на исправление нравственного недостатка. Русское выражение естественно и сохраняет традиционную лексику совершенства, а сноска предупреждает возможное неверное понимание.
- source_word: ἐγένετο
  choice: стал
  rationale: 'Глагол обозначает наступившее состояние или роль: по достижении полноты Он стал источником спасения.'
- source_word: πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: для всех, кто повинуется Ему
  rationale: Дательный падеж указывает на тех, кому принадлежит благо спасения; ὑπακούω передаёт послушание, а форма причастия — характерное или продолжающееся действие.
- source_word: αἴτιος
  choice: источником
  rationale: Слово обозначает того, кто является причиной или виновником результата. «Источник» ясно и естественно выражает действенную причинность без литературного оттенка слова «автор».
- source_word: σωτηρίας αἰωνίου
  choice: вечного спасения
  rationale: Сохраняется устойчивый богословский смысл σωτηρία и прямое значение αἰώνιος в данном контексте.
- source_word: καὶ
  choice: и
  rationale: Союз непосредственно связывает стих с предшествующим рассуждением без дополнительного истолкования логической связи.
theological_decisions:
- issue: Христологический смысл τελειωθεὶς
  choice: достигнув совершенства
  alternative: будучи усовершенствован; будучи приведён к полноте
  rationale: Перевод сохраняет идею достижения цели и полноты служения и не утверждает, будто Иисус прежде был нравственно несовершенен. Сноска делает эту смысловую грань явной, не устраняя многозначности греческого слова.
- issue: Связь спасения с повиновением Христу
  choice: для всех, кто повинуется Ему
  alternative: для всех, кто слушается Его
  rationale: Явное указание греческого текста на послушание сохранено без замены его словом «верует» и без включения в перевод какой-либо конфессиональной схемы.
- issue: Причинная роль Христа в спасении
  choice: источником вечного спасения
  alternative: виновником вечного спасения; причиной вечного спасения
  rationale: «Источник» передаёт, что Христос производит и обеспечивает спасение, оставаясь современным и достойным русским выражением.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Заглавные местоимения «Он» и «Ему» употреблены как принятая в русском религиозном письме форма почтительности; синтаксис остаётся ясным для широкого читателя.
