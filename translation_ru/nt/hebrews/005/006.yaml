  text: just as he also says in another place[b][a], “You are a priest forever according to the order of Melchizedek,”
translation:
  language: ru
  text: 'Как и в другом месте Он говорит: «Ты — священник навеки по чину Мелхиседека»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по порядку Мелхиседека».'
