lexical_decisions:
- source_word: καθὼς καὶ
  choice: как и
  rationale: 'Естественно передаёт сравнительно-связующую формулу и сохраняет значение καί: эта цитата приводится наряду с предыдущей.'
- source_word: ἐν ἑτέρῳ
  choice: в другом месте
  rationale: 'В греческом выражение эллиптическое: буквально «в другом», с подразумеваемым указанием на другой отрывок Писания. Русское «в другом месте» ясно и идиоматично.'
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохранено; не названный прямо субъект остаётся таким же, как в контексте, что позволяет слышать в Писании живую речь Бога без добавления слова «Бог».
- source_word: Σὺ ἱερεὺς
  choice: Ты — священник
  rationale: Сохраняется прямое обращение во втором лице; тире естественно оформляет именное сказуемое в современном русском языке.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Краткий и возвышенный современный эквивалент со значением непрекращающейся длительности.
- source_word: κατὰ τὴν τάξιν
  choice: по чину
  rationale: «Чин» точно и традиционно передаёт здесь установленный тип или разряд священства; формулировка также естественно связывает стих с дальнейшим рассуждением Послания.
- source_word: Μελχισέδεκ
  choice: Мелхиседека
  rationale: Устоявшаяся русская библейская форма имени; родительный падеж обусловлен сочетанием «по чину».
theological_decisions:
- issue: Субъект глагола λέγει в формуле цитирования
  choice: «говорит», без явного добавления субъекта
  alternative: «сказано» или «Писание говорит»
  rationale: Греческий текст не называет субъект в этом стихе. Контекст связывает речь с Богом, однако перевод не вводит отсутствующее существительное и сохраняет характерную для Послания непосредственность звучащего ныне слова Писания.
- issue: Значение τάξις в цитате о Мелхиседеке
  choice: «чин» как установленный тип или разряд священства
  alternative: «порядок», «образ» или «подобие»
  rationale: «Чин» сохраняет связь с особым священством Мелхиседека и не сводит выражение лишь к сходству в манере служения. При этом перевод не уточняет сверх текста природу этого чина.
translation_notes:
  register: Современный литературный русский с достоинством библейской цитаты. Формула «как и в другом месте говорит» намеренно сохраняет невыраженный субъект греческого текста. «Навеки» выбрано как естественное и торжественное, а «по чину Мелхиседека» — как точное и узнаваемое выражение. Маркер сноски поставлен непосредственно после цитаты.
