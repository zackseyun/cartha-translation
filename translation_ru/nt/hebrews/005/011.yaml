  text: Περὶ οὗ πολὺς ἡμῖν ὁ λόγος καὶ δυσερμήνευτος λέγειν, ἐπεὶ νωθροὶ γεγόνατε ταῖς ἀκοαῖς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/011.yaml
  text: About this we have much to say[a], and it is hard to explain[c][b], since you have become dull in hearing.
translation:
  language: ru
  text: Об этом[a] нам многое нужно сказать, но объяснить это трудно[b], потому что вы стали вялыми в слушании[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «О нём». Греческое местоимение может относиться лично к Мелхиседеку, хотя здесь, вероятно, указывает шире на обсуждаемую тему.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «трудно истолковать»; также возможно: «трудно изложить».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «стали вялыми в слушании», то есть стали медленно и без должной восприимчивости принимать наставление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ οὗ
  choice: Об этом
  rationale: Форма относительного местоимения допускает отнесение как к Мелхиседеку лично, так и ко всей обсуждаемой теме. В контексте естественнее вводится дальнейшее изложение темы; неоднозначность отмечена в сноске.
- source_word: πολὺς ἡμῖν ὁ λόγος
  choice: нам есть многое сказать
  rationale: Идиоматическая русская передача буквально более тяжеловесного оборота «у нас много слова/речи»; она сохраняет мысль о значительном объёме предстоящего изложения.
- source_word: δυσερμήνευτος λέγειν
  choice: это трудно объяснить
  rationale: Прилагательное обозначает трудность истолкования или изложения, а инфинитив λέγειν связывает эту трудность с выражением мысли словами. «Трудно объяснить» естественно передаёт сочетание целиком.
- source_word: ἐπεὶ
  choice: потому что
  rationale: Союз вводит причину, по которой тему трудно объяснить данной аудитории.
- source_word: νωθροὶ γεγόνατε
  choice: вы стали плохо воспринимать
  rationale: Перфект γεγόνατε указывает на достигнутое и сохраняющееся состояние, поэтому передан глаголом «стали». В контексте νωθροί означает вялость и невосприимчивость, а не физический недостаток слуха.
- source_word: ταῖς ἀκοαῖς
  choice: услышанное
  rationale: Оборот относится к восприятию наставления. Такая передача звучит естественно по-русски и сохраняет образ слушания, не сводя его к работе органов слуха.
theological_decisions:
- issue: К чему относится Περὶ οὗ
  choice: 'В основном тексте фраза отнесена к обсуждаемой теме в целом: «Об этом».'
  alternative: 'Местоимение может относиться лично к Мелхиседеку: «О нём».'
  rationale: Непосредственно перед этим упомянут Мелхиседек, поэтому личное отнесение грамматически возможно. Однако дальнейшие слова вводят более широкое изложение темы священства. Сноска сохраняет подлинную неоднозначность, не устраняя связь с Мелхиседеком.
translation_notes:
  register: Современный литературный русский язык, понятный широкому кругу читателей. Синтаксис сохраняет последовательность мысли оригинала, но избегает неестественной кальки. Формулировка о слушании передаёт духовно-интеллектуальную невосприимчивость, не создавая впечатления физической тугоухости.
