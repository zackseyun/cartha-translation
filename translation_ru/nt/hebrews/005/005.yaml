source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: ru
  text: 'Так и Мессия[a] не сам себя прославил[b], чтобы стать первосвященником, а прославил Его Тот, кто сказал Ему: «Ты — Мой Сын; сегодня Я родил Тебя».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое Χριστός означает «Помазанник» и здесь употреблено как титул.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «не сам себя удостоил этой чести». Греческий глагол может означать как прославление, так и оказание чести.'
    reason: lexical_alternative
  - marker: c
    text: Цитата из Псалма 2:7.
    reason: cross_reference
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Так и
  rationale: Кратко и естественно связывает стих с предшествующим рассуждением о призвании первосвященника.
- source_word: ὁ Χριστὸς
  choice: Мессия
  rationale: В данном рассуждении Χριστός выступает как титул Помазанника, назначенного Богом, а не просто как имя.
- source_word: οὐχ ἑαυτὸν ἐδόξασεν
  choice: не сам себя прославил
  rationale: Сохраняет возвратную конструкцию и основное значение δοξάζω — «прославлять»; в контексте также возможен оттенок «удостоить чести».
- source_word: γενηθῆναι ἀρχιερέα
  choice: чтобы стать первосвященником
  rationale: Передаёт вхождение в положение или служение; русское название должности естественно употребляется здесь без неопределённого артикля.
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: а Тот, кто сказал ему
  rationale: 'Сохраняет подразумеваемое противопоставление: Мессия прославил не сам себя, а Бог, обращающийся к нему в цитате. «Сказал» естественно передаёт λαλέω при введении прямой речи.'
- source_word: Υἱός μου εἶ σύ
  choice: Ты — Мой Сын
  rationale: Естественный русский порядок слов передаёт торжественное прямое обращение; тире ясно выражает именную связку.
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: сегодня Я родил Тебя
  rationale: Прямо передаёт σήμερον и γεννάω, не уточняя богословски, относится ли образ к воцарению, воскресению или иному аспекту сыновства.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово имеет явную функцию титула в рассуждении о Божьем назначении на служение; примечание сохраняет привычный вариант.
- issue: Смысл слов «сегодня Я родил Тебя»
  choice: Цитата сохранена без истолковывающего дополнения
  alternative: Парафраз с указанием на воцарение, воскресение или вечное рождение
  rationale: Формулировка Псалма 2:7 сама по себе не должна в переводе принудительно разрешать последующие христологические споры.
- issue: Подразумеваемый деятель в противопоставлении
  choice: 'Оставить синтаксическое подразумевание: Мессию прославил Тот, кто сказал ему'
  alternative: Явно добавить «но Его прославил Тот»
  rationale: Так сохраняется сжатая эллиптическая форма греческого текста, оставаясь понятной по-русски.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием прямой речи. Синтаксис сохраняет лаконичное противопоставление оригинала; богословская неоднозначность цитаты не снимается. Прописные буквы в обращении подчёркивают форму библейской цитаты, не добавляя отдельного толкования.
