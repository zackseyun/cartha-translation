  text: καὶ ⸂δι’ αὐτὴν⸃ ὀφείλει, καθὼς περὶ τοῦ λαοῦ, οὕτως καὶ περὶ ⸀αὑτοῦ προσφέρειν ⸀περὶ ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/003.yaml
  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: ru
  text: И потому[a] он обязан, как за народ, так и за самого себя, приносить жертвы за грехи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из-за неё» — то есть из-за немощи первосвященника, о которой сказано в предыдущем стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: и потому
  rationale: Передаёт причинное значение διά с винительным падежом. Местоимение женского рода отсылает к немощи первосвященника в предыдущем стихе; естественная русская связка сохраняет эту отсылку, не делая её явной в основном тексте.
- source_word: ὀφείλει
  choice: он обязан
  rationale: Выражает требование и долг, а не просто желательность действия.
- source_word: καθὼς ... οὕτως καὶ
  choice: как ... так и
  rationale: Естественно и точно сохраняет греческую соотносительную конструкцию.
- source_word: τοῦ λαοῦ
  choice: за народ
  rationale: В контексте имеется в виду народ завета; добавлять «Израиля» в основной текст нет необходимости.
- source_word: περὶ αὑτοῦ
  choice: за самого себя
  rationale: Передаёт рефлексивный смысл и подчёркнутое сопоставление с народом.
- source_word: προσφέρειν
  choice: приносить жертвы
  rationale: Хотя дополнение прямо не выражено, в священническом контексте глагол означает совершение жертвоприношения; по-русски «приносить за грехи» без дополнения звучит неполно.
- source_word: περὶ ἁμαρτιῶν
  choice: за грехи
  rationale: Кратко и естественно передаёт значение περί с родительным в жертвенном контексте, не сужая его до конкретного вида жертвы.
theological_decisions:
- issue: К чему относится «потому»
  choice: К немощи первосвященника, упомянутой в предыдущем стихе
  alternative: К его положению или служению вообще
  rationale: Ближайший грамматический и смысловой антецедент местоимения женского рода — «немощь» в Евр 5:2; примечание поясняет связь, не вставляя толкование в основной текст.
- issue: Неявное дополнение при προσφέρειν
  choice: Добавлено «жертвы»
  alternative: Оставить только «приносить»
  rationale: Жертвенный контекст однозначно задаёт подразумеваемый объект, а русская фраза требует его для ясности; формулировка не уточняет вид жертвы сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Сохранены обязанность первосвященника и параллель «как за народ, так и за самого себя»; архаизмы и конфессионально окрашенные уточнения исключены.
