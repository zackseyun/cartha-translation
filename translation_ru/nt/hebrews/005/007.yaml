  source_fidelity: 'В целом перевод точно передаёт структуру и лексику греческого текста: «во дни Своей плоти», два обозначения молитвенного обращения, сильный вопль и слёзы, благоприятное услышание и причинный оттенок ἀπὸ τῆς εὐλαβείας. Однако «мог спасти» в русском естественно может звучать как прошедшая, ситуативная способность; настоящее «способен спасти» лучше передаёт характеристику «Того, Кто может/способен» (τοῦ δυναμένου) и не добавляет временного ограничения.'
