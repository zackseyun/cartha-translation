source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/007.yaml
  text: who[a], in the days of his flesh, having offered up both prayers and petitions with loud cries and tears to the one able to save him from death, and having been heard because of his reverence[b],
translation:
  language: ru
  text: Он во дни Своей плоти с громким воплем и слезами принёс молитвы и моления Тому, Кто способен спасти Его от смерти[a], и был услышан благодаря Своему благоговению[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение «спасти Его от смерти» может также означать: «спасти Его, выведя из смерти», то есть через воскресение.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «за Свой благоговейный страх».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  choice: во дни Своей плоти
  rationale: Сохраняет конкретное слово «плоть» и телесный акцент греческого выражения, при этом звучит естественно в возвышенном библейском регистре.
- source_word: δεήσεις τε καὶ ἱκετηρίας
  choice: молитвы и моления
  rationale: Передаёт два близких обозначения настойчивого обращения к Богу; «моления» подчёркивает характер просьбы, не прибегая к тяжеловесному «прошения».
- source_word: πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου
  choice: Тому, Кто мог спасти Его от смерти
  rationale: 'Передаёт субстантивированное причастие и сохраняет неоднозначность ἐκ θανάτου: избавление от наступления смерти либо выведение из смерти.'
- source_word: μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων
  choice: с громким воплем и слезами
  rationale: Сохраняет единственное число κραυγῆς и силу выражения, оставаясь понятным современному читателю.
- source_word: προσενέγκας
  choice: принёс
  rationale: Передаёт значение προσφέρω и сохраняет возможный жертвенно-священнический оттенок, важный для Послания к евреям, не делая его явным сверх текста.
- source_word: εἰσακουσθεὶς
  choice: был услышан
  rationale: Точно передаёт благоприятное услышание молитвы, не уточняя не названную в тексте форму ответа.
- source_word: ἀπὸ τῆς εὐλαβείας
  choice: благодаря Своему благоговению
  rationale: «Благоговение» близко передаёт εὐλάβεια как почтительность и благочестивый страх; причинная связь выражена естественным русским оборотом без добавления идеи покорности.
theological_decisions:
- issue: Смысл ἀπὸ τῆς εὐλαβείας применительно к Иисусу
  choice: благодаря Своему благоговению
  alternative: за Свой благоговейный страх
  rationale: Основной вариант сохраняет почтительное отношение Сына к Отцу и не вводит отсутствующее в слове прямое указание на покорность. Альтернатива отражает допустимый оттенок благочестивого страха.
- issue: Объём значения σῴζειν αὐτὸν ἐκ θανάτου
  choice: спасти Его от смерти
  alternative: избавить Его из смерти
  rationale: Основной текст не решает однозначно, имеется ли в виду предотвращение смерти или избавление через воскресение; эта смысловая напряжённость отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис сделан более естественным для самостоятельного русского предложения, а прописные местоимения употреблены как традиционный знак почтения; смысловых уточнений сверх греческого текста не внесено.
