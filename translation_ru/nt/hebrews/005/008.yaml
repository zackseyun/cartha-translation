lexical_decisions:
- source_word: καίπερ
  choice: Хотя… и
  rationale: 'Уступительная конструкция естественно передаёт контраст: несмотря на положение Сына, Он научился послушанию через пережитое страдание.'
- source_word: ὢν υἱός
  choice: Он и был Сыном
  rationale: Причастная конструкция передана естественным русским придаточным оборотом. «Сын» написано с прописной буквы как христологическое наименование; отсутствие артикля в греческом нельзя прямо воспроизвести средствами русского языка.
- source_word: ἔμαθεν
  choice: Он научился
  rationale: Прямо сохраняет утверждение греческого текста о подлинном, опытном научении, не ослабляя его толкованием.
- source_word: ἀφ’ ὧν
  choice: из того, что
  rationale: Передаёт значение источника или основания у ἀπό с относительным местоимением и сохраняет связь между научением и пережитым.
- source_word: ἔπαθεν
  choice: претерпел
  rationale: Точно обозначает перенесённое страдание; в данном контексте «претерпел» звучит естественно и весомо без добавления отсутствующего в тексте существительного.
- source_word: τὴν ὑπακοήν
  choice: послушанию
  rationale: Русское управление «научиться чему» требует дательного падежа. Слово передаёт покорное исполнение воли Бога; греческий артикль при отвлечённом существительном отдельно не воспроизводится.
theological_decisions:
- issue: Сыновний статус Христа и Его научение
  choice: Хотя Он и был Сыном
  alternative: Хотя Он был Сыном; хотя Он был Сын
  rationale: Формулировка одновременно сохраняет истинное сыновство Иисуса и контраст с последующим утверждением о научении. Русский язык не различает определённый и неопределённый артикли, поэтому степень определённости не следует искусственно уточнять.
- issue: Подразумевает ли выражение «научился послушанию» прежнее непослушание
  choice: Сохранить прямое выражение «Он научился послушанию»
  alternative: Он на опыте познал послушание; Он узнал цену послушания
  rationale: Греческий текст прямо говорит о научении послушанию. Перевод сохраняет богословское напряжение и не подменяет текст объяснением; контекст позволяет понимать это как познание послушания в пережитом страдании, а не как исправление прежнего непослушания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Порядок слов сохраняет уступительный контраст и прямоту исходного утверждения; местоимение «Он» написано с прописной буквы согласно принятому благоговейному оформлению христологического референта.
