  text: καὶ οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, ⸀καθώσπερ καὶ Ἀαρών.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: ru
  text: И никто не присваивает себе этой чести[a], но получает её, будучи призван Богом, как и Аарон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чести». В греческом тексте стоит определённая форма «честь»; в контексте имеется в виду честь или достоинство первосвященнического служения.'
    reason: lexical_clarification
lexical_decisions:
- source_word: τις (с οὐχ)
  choice: никто
  rationale: Сочетание отрицания с неопределённым местоимением естественно передаётся по-русски универсальным отрицанием «никто».
- source_word: ἑαυτῷ
  choice: себе
  rationale: Дательный возвратного местоимения указывает на присвоение чести самому себе.
- source_word: λαμβάνει
  choice: присваивает
  rationale: В первой части глагол описывает самовольное принятие достоинства; «присваивает» ясно передаёт этот оттенок и контраст с Божьим призванием.
- source_word: τὴν τιμήν
  choice: эту честь
  rationale: «Честь» прямо передаёт τιμή, а указательное «эту» естественно связывает выражение с первосвященническим достоинством в ближайшем контексте.
- source_word: καλούμενος ὑπὸ τοῦ θεοῦ
  choice: будучи призван Богом
  rationale: Сохраняет пассивное причастие и прямо называет Бога действующим лицом призвания.
- source_word: καθώσπερ καὶ Ἀαρών
  choice: как и Аарон
  rationale: Кратко и естественно сохраняет сравнение и добавочное значение καί; недостающее сказуемое понятно из предыдущей части.
theological_decisions:
- issue: Характер первосвященнического назначения
  choice: Человек не присваивает себе связанную со священством честь, а получает её в силу Божьего призвания.
  alternative: Понять высказывание как общее положение о всякой чести, не связывая его непосредственно с первосвященством.
  rationale: Контекст Евр 5:1–5 говорит о первосвященнике, однако перевод сохраняет более широкое слово «честь», не подменяя его словом «должность».
- issue: Синтаксическая неполнота второй части
  choice: Явно добавить «получает её», понимая эллиптическое противопоставление как получение чести призванным Богом.
  alternative: 'Перевести буквально: «но будучи призван Богом», оставив русскую конструкцию синтаксически неполной.'
  rationale: Добавление требуется для ясного и грамматически полноценного русского предложения; оно вытекает из λαμβάνει и не вводит нового основания назначения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Присваивает себе» подчёркивает недопустимость самовольного принятия достоинства, тогда как «будучи призван Богом» сохраняет форму и богословский акцент греческого текста.
