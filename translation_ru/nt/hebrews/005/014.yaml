base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: ru
  text: Твёрдая же пища — для зрелых, у которых благодаря практике способности восприятия[a] натренированы различать добро и зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чувства»; здесь это слово употреблено метафорически и обозначает внутренние способности воспринимать и оценивать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τελείων
  choice: зрелых
  rationale: Субстантивированное прилагательное во множественном числе обозначает зрелых людей в противопоставлении младенцам из ближайшего контекста (5:13), не подразумевая безгрешного совершенства.
- source_word: στερεὰ τροφή
  choice: твёрдая пища
  rationale: Естественно сохраняет метафорическое противопоставление молоку и пище для взрослых.
- source_word: διὰ τὴν ἕξιν
  choice: благодаря постоянному упражнению
  rationale: ἕξις может обозначать навык, привычку или практику; формулировка передаёт повторяющееся применение, ведущее к устойчивой способности, не сводя значение лишь к пассивной привычке.
- source_word: τὰ αἰσθητήρια
  choice: способности восприятия
  rationale: Буквально речь идёт о чувствах или органах чувств, но здесь слово метафорически обозначает внутренние способности воспринимать и оценивать; выбранный вариант сохраняет эту широту.
- source_word: γεγυμνασμένα ἐχόντων
  choice: их ... приучены
  rationale: Перфектное пассивное причастие с ἐχόντων выражает достигнутое в результате упражнения состояние. Русская конструкция естественно передаёт этот устойчивый результат.
- source_word: πρὸς διάκρισιν
  choice: различать
  rationale: Инфинитив естественно передаёт цель или результат, выраженные сочетанием πρός с отглагольным существительным.
- source_word: καλοῦ τε καὶ κακοῦ
  choice: добро и зло
  rationale: Сохраняет традиционную и ясную нравственную пару; в русском дополнительная конструкция «как... так и» здесь не требуется.
- source_word: δέ
  choice: же
  rationale: Частица обозначает контраст с молоком из предыдущего стиха; «же» передаёт его естественно и без чрезмерно резкого разрыва.
theological_decisions:
- issue: Значение τελείων в контексте духовного возрастания
  choice: зрелых
  alternative: совершенных; взрослых
  rationale: Контекст противопоставляет младенцев тем, чьи способности развиты упражнением. «Зрелых» сохраняет идею достигнутой зрелости, не вводя утверждения о нравственной безупречности.
translation_notes:
  register: Современный литературный русский язык; достоинство и образность оригинала сохранены. Синтаксис слегка перестроен ради ясности, при этом причинная связь, результат упражнения и нравственное различение переданы без конфессионального уточнения.
