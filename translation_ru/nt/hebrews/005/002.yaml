base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/002.yaml
  text: being able to deal gently with those who are ignorant and going astray[a], since he himself also is beset with weakness[b],
translation:
  language: ru
  text: Он способен мягко обращаться с теми, кто пребывает в неведении и сбился с пути[a], потому что и сам окружён слабостью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «теми, кого ввели в заблуждение». Греческое причастие допускает пассивный оттенок.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «окружён» или «облечён слабостью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετριοπαθεῖν
  choice: снисходительно относиться
  rationale: Глагол обозначает сдержанное, умеренное и мягкое отношение — без суровости, но и без безразличия. Этот вариант естественен по-русски и передаёт как внутреннюю установку, так и практическое обращение с людьми.
- source_word: δυνάμενος
  choice: способен
  rationale: Передаёт устойчивую способность первосвященника, выраженную причастием настоящего времени, и естественно продолжает его характеристику в контексте.
- source_word: τοῖς ἀγνοοῦσι
  choice: к тем, кто пребывает в неведении
  rationale: Сохраняет причастный смысл и не превращает людей в обозначенный ярлыком класс. «Неведение» уместно в возвышенной, но современной речи и не сужает значение до одного вида проступка.
- source_word: πλανωμένοις
  choice: заблуждается
  rationale: Форма может описывать как отклонение с верного пути, так и состояние тех, кого вводят в заблуждение. Основной текст оставляет агентность неопределённой, а возможный пассивный оттенок отмечен в сноске.
- source_word: ἐπεὶ
  choice: потому что
  rationale: Ясно выражает причинную связь между снисходительностью священника и его собственной немощью.
- source_word: καὶ αὐτὸς
  choice: и сам
  rationale: Кратко и естественно сохраняет как присоединительное значение καί, так и эмфазу αὐτός.
- source_word: περίκειται ἀσθένειαν
  choice: окружён немощью
  rationale: Близко передаёт образ буквального окружения или облечённости слабостью, сохраняя широту значения ἀσθένεια и достоинство библейского регистра.
theological_decisions:
- issue: Характер состояния людей, обозначенных ἀγνοοῦσι καὶ πλανωμένοις
  choice: Люди пребывают в неведении и отклоняются от верного пути; формулировка не ограничена исключительно технической категорией неумышленных грехов.
  alternative: Понимать выражение только как специальную отсылку к неумышленным грехам в левитской жертвенной системе.
  rationale: Священнический контекст допускает такую ветхозаветную ассоциацию, однако греческие слова сами по себе шире. Перевод сохраняет эту широту и не вводит в текст более узкое доктринальное толкование.
- issue: Значение ἀσθένεια применительно к первосвященнику
  choice: Немощь как широкое обозначение человеческой слабости и ограниченности.
  alternative: Только физическая слабость либо только нравственная слабость.
  rationale: Контекст не требует сводить понятие исключительно к телесной или нравственной сфере. «Немощь» сохраняет намеренную смысловую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Снисходительно относиться» передаёт меру и мягкость без сентиментальности; «немощь» сохраняет достоинство стиля и широкое значение человеческой слабости. Все сноски отмечены в основном тексте.
