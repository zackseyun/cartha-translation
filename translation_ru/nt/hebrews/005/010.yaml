  text: προσαγορευθεὶς ὑπὸ τοῦ θεοῦ ἀρχιερεὺς κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/010.yaml
  text: having been designated by God as a high priest according to the order of Melchizedek[a][b].
translation:
  language: ru
  text: и был назван Богом Первосвященником по чину Мелхиседека[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и был провозглашён Богом Первосвященником»; возможно также: «и был поставлен Богом Первосвященником».'
    reason: lexical_alternative
  - marker: b
    text: 'Здесь звучит отсылка к Псалму 109:4, где о священстве сказано: «по чину Мелхиседека».'
    reason: cross_reference
lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: был назван
  rationale: Аористное страдательное причастие προσαγορεύω обозначает действие Бога, который называет или провозглашает Иисуса Первосвященником. «Был назван» сохраняет пассивную форму и не вносит более сильного оттенка официального поставления, хотя такой перевод контекстуально возможен.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: Богом
  rationale: Ὑπό с родительным падежом указывает на действующее лицо при страдательной конструкции. В исходном тексте сказано только «Богом», без добавления «Отцом».
- source_word: ἀρχιερεὺς
  choice: Первосвященником
  rationale: Обычный русский эквивалент ἀρχιερεύς. Творительный падеж естественно сочетается со страдательной конструкцией «был назван»; прописная буква указывает на титульное употребление применительно к Иисусу, не добавляя отдельного определения.
- source_word: κατὰ τὴν τάξιν
  choice: по чину
  rationale: В данной устойчивой формуле κατά выражает соответствие, а τάξις — чин, порядок или тип священства. «По чину» естественно для русского библейского стиля и сохраняет связь с Псалмом 109:4.
- source_word: Μελχισέδεκ
  choice: Мелхиседека
  rationale: Устоявшаяся русская передача имени; родительный падеж обусловлен сочетанием «чин Мелхиседека».
theological_decisions:
- issue: Следует ли передать причастие как назначение на должность или как наименование и провозглашение статуса
  choice: был назван Богом Первосвященником
  alternative: был поставлен Богом Первосвященником; был провозглашён Богом Первосвященником
  rationale: Глагол допускает оттенки называния, провозглашения и официального обозначения. «Был назван» ближе к его непосредственному значению и не решает сверх текста вопрос о характере или моменте вступления в первосвященство.
- issue: Значение выражения κατὰ τὴν τάξιν Μελχισέδεκ
  choice: по чину Мелхиседека
  alternative: по образцу Мелхиседека; согласно порядку Мелхиседека
  rationale: «Чин» сохраняет традиционную и контекстуально ёмкую формулу, не сводя τάξις исключительно к институциональной организации, рангу или простому сходству.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Союз «и» сохраняет связь причастного оборота с предыдущим стихом. Формула «Первосвященником по чину Мелхиседека» понятна современному читателю и одновременно поддерживает межтекстовую связь с Псалмом 109:4.
