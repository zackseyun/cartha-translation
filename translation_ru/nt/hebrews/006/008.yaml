  text: ἐκφέρουσα δὲ ἀκάνθας καὶ τριβόλους ἀδόκιμος καὶ κατάρας ἐγγύς, ἧς τὸ τέλος εἰς καῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/008.yaml
  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: ru
  text: А земля, приносящая терния и чертополох, негодна[a] и близка к проклятию; конец её — сожжение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отвергнута».'
    reason: Лексическая альтернатива для ἀδόκιμος; в данном контексте слово может обозначать не прошедшее проверки и отвергнутое как непригодное.
lexical_decisions:
- source_word: ἐκφέρουσα
  choice: приносит
  rationale: Причастие продолжает образ земли из предыдущего стиха; «приносит» естественно передаёт произведение землёй растительности.
- source_word: δὲ
  choice: А
  rationale: Союз обозначает контраст с плодородной землёй в стихе 7; русское «а» ясно и естественно связывает оба стиха.
- source_word: ἀκάνθας καὶ τριβόλους
  choice: терния и колючки
  rationale: Передаёт два вида колючей сорной растительности, сохраняя сельскохозяйственный образ и различие между парными словами.
- source_word: ἀδόκιμος
  choice: негодна
  rationale: В контексте земли слово означает не выдержавшую проверки и непригодную; «негодна» сохраняет оценочный смысл без излишнего уточнения характера отвержения.
- source_word: κατάρας ἐγγύς
  choice: близка к проклятию
  rationale: Близко следует греческой именной конструкции и сохраняет открытым, идёт ли речь о проклятом состоянии или предстоящем акте проклятия.
- source_word: ἧς τὸ τέλος
  choice: конец её
  rationale: Относительное местоимение относится к земле; формулировка сохраняет лаконичность и возможность понимать τέλος как конец или итог.
- source_word: εἰς καῦσιν
  choice: сожжение
  rationale: Передаёт направленность к сжиганию, не превращая сельскохозяйственный образ в более конкретное утверждение о конечном суде.
theological_decisions:
- issue: Нужно ли явно назвать подразумеваемую землю
  choice: Назвать «землю» для естественной связи с предыдущим стихом
  alternative: Начать с местоимения «она»
  rationale: Женский род причастия и относительного местоимения указывает на γῆ из стиха 7. В отдельном русском стихе явное существительное делает референцию понятной, не меняя образ.
- issue: Передача ἀδόκιμος
  choice: «негодна» в основном тексте; «отвергнута» в примечании
  alternative: «отвергнута» в основном тексте
  rationale: «Негодна» соответствует непосредственному образу бесполезной земли, а примечание сохраняет более сильную возможную передачу и связанную с ней богословскую напряжённость.
- issue: Толкование εἰς καῦσιν
  choice: Сохранить образ сожжения без догматического пояснения
  alternative: «её ждёт огонь окончательного суда»
  rationale: Греческий текст говорит о сожжении, но в самом стихе не отождествляет его прямо с адом или окончательным осуждением.
translation_notes:
  register: Современный литературный русский язык с достойной, лаконичной библейской интонацией. «Терния» сохраняет узнаваемый библейский сельскохозяйственный образ, а «колючки» остаётся понятным обычному читателю.
