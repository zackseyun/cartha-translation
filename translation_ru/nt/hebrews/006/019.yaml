  text: ἣν ὡς ἄγκυραν ἔχομεν τῆς ψυχῆς, ⸀ἀσφαλῆ τε καὶ βεβαίαν καὶ εἰσερχομένην εἰς τὸ ἐσώτερον τοῦ καταπετάσματος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/019.yaml
  text: We have this as an anchor of the soul[a], both secure and firm, and entering into the inner place behind the curtain,
translation:
  language: ru
  text: Мы имеем эту надежду как якорь для нашей души — надёжный и прочный, входящий во внутреннее пространство за завесой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внутрь, за завесу»; традиционно: «за завесу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: Она
  rationale: Относительное местоимение женского рода отсылает к надежде в предыдущем стихе; русское «она» естественно возобновляет эту связь в начале предложения.
- source_word: ὡς ἄγκυραν
  choice: словно якорь
  rationale: ὡς вводит сравнение; «словно якорь» сохраняет образ и звучит естественно в современном русском.
- source_word: ἔχομεν
  choice: для души нашей
  rationale: Значение «имеем» передано перестройкой «она для души нашей — словно якорь», позволяющей избежать тяжеловесного «мы имеем её как якорь» при сохранении смысла обладания надеждой.
- source_word: τῆς ψυχῆς
  choice: для души нашей
  rationale: Родительный при «якоре» по-русски естественно передаётся конструкцией назначения «для души»; «нашей» делает подразумеваемую связь с ἔχομεν явной.
- source_word: ἀσφαλῆ
  choice: надёжный
  rationale: В образе якоря слово обозначает безопасность и безотказность; «надёжный» сохраняет это значение и не сливается с βεβαίαν.
- source_word: τε καὶ
  choice: и
  rationale: Два согласованных качества естественно соединяются по-русски союзом «и»; отдельная коррелятивная конструкция была бы стилистически избыточна.
- source_word: βεβαίαν
  choice: прочный
  rationale: Передаёт устойчивость и твёрдость якоря, сохраняя отличие от ἀσφαλῆ «надёжный».
- source_word: εἰσερχομένην
  choice: входящий
  rationale: Причастие согласовано с «якорь» и сохраняет метафорическое продолжение исходного текста.
- source_word: εἰς τὸ ἐσώτερον
  choice: во внутреннее святилище
  rationale: Субстантивированное сравнительное прилагательное обозначает внутреннюю область; в контексте завесы это внутренняя часть святилища. Выбор проясняет подразумеваемый культовый контекст, не уточняя её далее как Святое святых.
- source_word: τοῦ καταπετάσματος
  choice: за завесу
  rationale: Генитив обозначает пространство по ту сторону храмовой завесы; «за завесу» кратко и естественно передаёт пространственное отношение и сохраняет библейский культовый образ.
theological_decisions:
- issue: Образ небесного святилища
  choice: «за завесу во внутреннее святилище»
  alternative: «внутрь, за завесу»
  rationale: Перевод сохраняет храмовый образ и делает понятным субстантивированное τὸ ἐσώτερον, не называя место прямо Святым святых и тем самым не добавляя большей определённости, чем есть в стихе.
- issue: Необычный образ якоря, входящего за завесу
  choice: Сохранить причастие «входящий» при слове «якорь»
  alternative: Перестроить фразу так, чтобы за завесу входила надежда
  rationale: Греческое причастие грамматически описывает якорь. Необычность смешения морского и храмового образов принадлежит исходному тексту и не должна устраняться переводом.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Завеса» сохранена как понятный культовый термин; синтаксис сделан естественным без архаичного «которую имеем как якорь души».
