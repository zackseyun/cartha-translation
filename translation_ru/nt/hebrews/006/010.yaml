source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: ru
  text: Ведь Бог не несправедлив, чтобы забыть ваше дело и любовь, которую вы проявили ради Его имени[a], послужив святым[b] и продолжая служить им[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Его имени».'
    reason: lexical_alternative
  - marker: b
    text: То есть верующим, Божьему святому народу; здесь «святые» не означает особую категорию людей, позднее официально причисленных к лику святых.
    reason: cultural_note
  - marker: c
    text: 'Или: «тем, что послужили святым и продолжаете служить им».'
    reason: previous_rendering
lexical_decisions:
- source_word: ἄδικος
  choice: несправедлив
  rationale: 'Передаёт контекстуальный смысл: Бог не поступит вопреки справедливости, оставив без внимания их верное служение.'
- source_word: ἐπιλαθέσθαι
  choice: забыть
  rationale: Сохраняет прямое значение глагола; в контексте подразумевается не просто утрата памяти, а отсутствие действенного признания.
- source_word: τοῦ ἔργου ὑμῶν
  choice: ваше дело
  rationale: Единственное число ἔργον имеет собирательный смысл; «дело» естественно связывается с последующим описанием служения.
- source_word: τῆς ἀγάπης
  choice: любовь
  rationale: Прямое и общепринятое соответствие ἀγάπη; дальнейшая фраза показывает любовь в конкретном служении.
- source_word: ἐνεδείξασθε
  choice: вы проявили
  rationale: Передаёт явное, подтверждённое поступками выражение любви и звучит естественно по-русски.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: к Его имени
  rationale: Сохраняет направленность εἰς и библейское понятие имени Бога, не сводя его без пояснения к чести или славе.
- source_word: διακονήσαντες
  choice: послужив
  rationale: Деепричастие совершенного вида передаёт предшествующее и уже осуществлённое служение.
- source_word: τοῖς ἁγίοις
  choice: святым
  rationale: Сохраняет новозаветное обозначение принадлежащих Богу верующих, не подменяя его более толковательным выражением.
- source_word: διακονοῦντες
  choice: продолжая служить им
  rationale: Передаёт длительный характер настоящего причастия и его контраст с предшествующим аористом.
theological_decisions:
- issue: Учит ли стих заслуге перед Богом или верному признанию Богом дел верующих
  choice: Формулировка утверждает справедливость Бога, который не забывает их дело и любовь, но не говорит, что этими делами они заслуживают спасение.
  alternative: Понимание, согласно которому Бог обязан вознаградить людей потому, что их дела обладают самостоятельной спасительной заслугой.
  rationale: Греческий текст прямо связывает Божью справедливость с тем, что Он не забудет их дело и любовь; перевод сохраняет это утверждение, не добавляя отсутствующего в стихе учения о заслуживании спасения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Конструкция «не несправедлив, чтобы забыть» намеренно сохраняет логику и риторическое напряжение греческого текста; видовое различие двух причастий передано как завершённое прошлое и продолжающееся настоящее служение.
