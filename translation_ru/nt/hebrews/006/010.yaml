  source_fidelity: 'Основной смысл передан точно: γάρ отражено словом «ведь», ἄδικος — «несправедлив», инфинитив ἐπιλαθέσθαι — «забыть», а противопоставление завершённого служения (διακονήσαντες) продолжающемуся (διακονοῦντες) сохранено как «послужив» / «продолжая служить». Однако «любовь, которую вы проявили к Его имени» не является естественным русским выражением и способна означать любовь именно к слову или имени. В данном контексте εἰς τὸ ὄνομα αὐτοῦ обозначает служение и любовь ради Божьего имени, то есть ради Него и Его чести.'
