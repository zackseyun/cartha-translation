revisions:
- from: Но в отношении вас, возлюбленные, мы убеждены в лучшем — в том, что связано со спасением,[a] — хотя и говорим так.
  to: Но мы убеждены, возлюбленные, что у вас есть нечто лучшее — то, что связано со спасением,[a] — хотя и говорим так.
  rationale: Перестроено предложение, чтобы естественно по-русски передать уверенное суждение авторов об адресатах. «Нечто лучшее» воспроизводит субстантивированное τὰ κρείσσονα без неоправданного уточнения, а пояснение после тире передаёт связь этого «лучшего» со спасением. Уступительный оборот сохранён в конце, как в греческом тексте. Сноска сохраняет жизнеспособную лексическую альтернативу для ἐχόμενα σωτηρίας.
