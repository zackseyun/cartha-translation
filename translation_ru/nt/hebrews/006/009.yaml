  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: ru
  text: Но мы убеждены, возлюбленные, что у вас есть нечто лучшее — то, что связано со спасением,[a] — хотя и говорим так.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечто, сопутствующее спасению».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: мы убеждены
  rationale: Перфект передаёт устойчивую, сложившуюся уверенность автора; «мы убеждены» естественно звучит по-русски и сохраняет эту силу.
- source_word: δὲ
  choice: Но
  rationale: Союз обозначает контраст с суровым предостережением в предыдущих стихах.
- source_word: περὶ ὑμῶν
  choice: в отношении вас
  rationale: Прямо передаёт περί с родительным падежом и сохраняет литературный регистр.
- source_word: ἀγαπητοί
  choice: возлюбленные
  rationale: Передаёт тёплое обращение и его церковно-литературную торжественность без разговорного оттенка.
- source_word: τὰ κρείσσονα
  choice: в лучшем
  rationale: Субстантивированная сравнительная форма обозначает «лучшее»; конструкция «убеждены в лучшем» естественна в современном русском языке.
- source_word: ἐχόμενα σωτηρίας
  choice: в том, что связано со спасением
  rationale: Причастие с родительным выражает принадлежность или тесную связь. Формулировка не уточняет, являются ли названные реалии признаками, следствиями или сопутствующими явлениями спасения.
- source_word: εἰ καὶ
  choice: хотя и
  rationale: Естественно передаёт уступительное значение оборота.
- source_word: οὕτως
  choice: так
  rationale: Отсылает к суровому содержанию и тону предшествующего предостережения.
- source_word: λαλοῦμεν
  choice: говорим
  rationale: Простая форма настоящего времени прямо и естественно передаёт греческий глагол.
theological_decisions:
- issue: Связь ἐχόμενα с σωτηρίας в контексте предостережения
  choice: «то, что связано со спасением»
  alternative: «то, что сопутствует спасению»
  rationale: Греческий текст утверждает связь названного «лучшего» со спасением, но не определяет её точнее как свидетельство, следствие, условие или причину. Перевод сохраняет эту богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Обращение «возлюбленные» сохраняет теплоту оригинала; пунктуация выделяет пояснение к «лучшему» и делает длинную фразу ясной.
