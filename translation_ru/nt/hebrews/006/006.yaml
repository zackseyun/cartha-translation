  text: καὶ παραπεσόντας, πάλιν ἀνακαινίζειν εἰς μετάνοιαν, ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ καὶ παραδειγματίζοντας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/006.yaml
  text: and having fallen away[a], to renew them again to repentance[b], since they are crucifying again for themselves the Son of God and exposing him to public shame.
translation:
  language: ru
  text: и отпавших[a] — вновь приводить к покаянию[b], поскольку они вновь распинают для самих себя Сына Божьего и выставляют Его на публичный позор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершивших отступничество». Греческий глагол может обозначать серьёзное отпадение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пока они вновь распинают для самих себя Сына Божьего и выставляют Его на публичный позор». Греческие причастия можно понимать не только как объясняющие причину, но и как обозначающие одновременное действие.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραπεσόντας
  choice: отпавших
  rationale: Причастие обозначает серьёзное отпадение. «Отпавших» сохраняет силу предупреждения, но не вводит в основной текст более узкий позднейший термин «отступники».
- source_word: πάλιν ἀνακαινίζειν
  choice: снова обновлять
  rationale: Наречие πάλιν естественно относится к инфинитиву ἀνακαινίζειν и указывает на повторное обновление. Формулировка сохраняет синтаксис и образ исходного текста.
- source_word: εἰς μετάνοιαν
  choice: к покаянию
  rationale: Предлог εἰς выражает направленность или цель; «к покаянию» естественно передаёт это значение и сохраняет богословски значимый термин μετάνοια.
- source_word: ἀνασταυροῦντας
  choice: вновь распинают
  rationale: Настоящее причастие передаёт действие, сопутствующее или объясняющее невозможность обновления. Личная форма делает зависимое русское предложение ясным.
- source_word: ἑαυτοῖς
  choice: для себя
  rationale: Дательный возвратного местоимения допускает значение отношения или заинтересованности; буквальное «для себя» сохраняет возможную смысловую напряжённость, не устраняя её толкованием.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: Сына Божьего
  rationale: Прямой и общепринятый русский эквивалент христологического титула.
- source_word: παραδειγματίζοντας
  choice: выставляют Его на публичный позор
  rationale: Глагол означает публично подвергать бесчестью, выставлять напоказ как позорный пример. Выбранная формулировка ясно сохраняет публичный характер унижения.
theological_decisions:
- issue: Синтаксическая зависимость от предыдущего стиха
  choice: Стих начинается союзом «и» и не восполняет слова «невозможно».
  alternative: «невозможно… снова обновлять к покаянию тех, кто отпал»
  rationale: Греческий текст синтаксически продолжает Евр 6:4–5. Сохранение зависимости не превращает отдельный стих в самостоятельное утверждение и соответствует исходной структуре.
- issue: Характер отпадения
  choice: «отпавших»
  alternative: «совершивших отступничество»
  rationale: Перевод сохраняет серьёзность παραπίπτω, но не решает через терминологию споры об утрате спасения, мнимой вере или иной природе отступничества.
- issue: Смысловая функция причастий ἀνασταυροῦντας и παραδειγματίζοντας
  choice: Объяснительное «поскольку они…» в основном тексте с указанием временного прочтения в сноске.
  alternative: «пока они…»
  rationale: Причастия могут объяснять основание невозможности обновления либо обозначать одновременное обстоятельство. Основной текст отражает вероятную объяснительную функцию, а сноска сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык, сдержанный и торжественный библейский регистр. Сохранены зависимость от контекста, лексическая тяжесть предупреждения и неоднозначность функции причастий. Заглавная буква в «Его» употреблена в соответствии с распространённой русской библейской издательской практикой.
