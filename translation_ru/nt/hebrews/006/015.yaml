  yaml_path: translation/nt/hebrews/006/015.yaml
  text: And so[a], after waiting patiently, he obtained the promise.
translation:
  language: ru
  text: И так, терпеливо ожидая, он получил обещание.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «получил обещанное». Греческий текст буквально говорит: «получил (достиг) обещание».'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ οὕτως
  choice: И так
  rationale: Связывает вывод с предшествующим рассказом об Аврааме и передаёт значение образа действия или результата без излишней конкретизации.
- source_word: μακροθυμήσας
  choice: проявив долготерпение
  rationale: Аористное причастие обозначает терпеливую стойкость на протяжении времени; деепричастная конструкция естественно передаёт предшествующее обстоятельство.
- source_word: ἐπέτυχεν
  choice: обрёл
  rationale: Передаёт успешное достижение или получение; при этом не уточняет, шла ли речь о полном исполнении обещанного.
- source_word: τῆς ἐπαγγελίας
  choice: обещание
  rationale: Сохраняет существительное ἐπαγγελία и его связь с ближайшим контекстом, не заменяя его истолкованием «обещанное».
theological_decisions:
- issue: Означает ли ἐπέτυχεν τῆς ἐπαγγελίας получение полного исполнения обещания или обретение самого обещания.
  choice: «обрёл обещание» без уточнения полного исполнения
  alternative: «получил обещанное»
  rationale: Греческий текст буквально называет «обещание», а не прямо «обещанное» или «исполнение обещания». Такая передача сохраняет богословское напряжение в Послании к евреям.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Долготерпение» несколько возвышенно, но понятно и точно передаёт длительное терпеливое ожидание; «обрёл» сохраняет формальную связь с идеей достижения.
