- source_word: λέγων
  choice: сказав
  rationale: Причастие вводит содержание Божьей клятвы и естественно связывает цитату с предшествующим контекстом.
- source_word: Εἰ μὴν
  choice: Истинно
  rationale: Устойчивое усилительное выражение в формуле клятвы; это не условное «если», а торжественное заверение.
- source_word: εὐλογῶν εὐλογήσω
  choice: непременно благословлю
  rationale: Сочетание причастия с личной формой того же глагола передаёт семитское усиление. Наречие сохраняет эмфатический смысл в естественном русском синтаксисе.
- source_word: σε
  choice: тебя
  rationale: Местоимение второго лица единственного числа относится к Аврааму.
- source_word: καὶ
  choice: и
  rationale: Простой сочинительный союз соединяет две части обещания.
- source_word: πληθύνων πληθυνῶ σε
  choice: непременно умножу тебя
  rationale: Повторное «непременно» сохраняет параллелизм и усиление обеих греческих глагольных конструкций; «умножу тебя» удерживает прямую форму обетования и её связь с Быт 22:17.
theological_decisions:
- issue: Передача усилительной формулы Божьей клятвы в цитате обетования Аврааму
  choice: 'Естественная русская формула с повтором «непременно»: «непременно благословлю… и непременно умножу».'
  alternative: 'Более формально: «благословляя, благословлю тебя и умножая, умножу тебя».'
  rationale: Так сохраняются торжественность клятвы, параллельное усиление обоих обещаний и связь с формой Септуагинты, но основной текст остаётся понятным современному читателю.
translation_notes:
