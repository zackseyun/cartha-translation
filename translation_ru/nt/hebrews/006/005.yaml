  source_fidelity: 'Текст точно передаёт греческую конструкцию: причастие γευσαμένους сохранено как «вкусивших», καλὸν θεοῦ ῥῆμα — как «доброе слово Божье», а δυνάμεις μέλλοντος αἰῶνος — как «силы грядущего века». Синтаксическая незавершённость и заключительная запятая оправданны, поскольку стих продолжает ряд из Евр. 6:4–6.'
