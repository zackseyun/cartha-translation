  text: καὶ καλὸν γευσαμένους θεοῦ ῥῆμα δυνάμεις τε μέλλοντος αἰῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/005.yaml
  text: and have tasted the good word of God and the powers of the coming age[b][a],
translation:
  language: ru
  text: и вкусивших доброе слово Божье и силы[b] грядущего века[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будущего века».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чудеса» или «могущественные деяния».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: доброе
  rationale: Прилагательное положительно характеризует слово Бога; «доброе» естественно передаёт его благость и благотворность, не сужая значение до красоты или превосходства.
- source_word: γευσαμένους
  choice: вкусивших
  rationale: Сохраняется метафора вкушения и грамматическая связь причастия винительного падежа множественного числа с продолжающимся перечнем из предыдущего стиха; перевод не определяет заранее глубину пережитого.
- source_word: θεοῦ ῥῆμα
  choice: слово Божье
  rationale: Передаёт слово, исходящее от Бога, естественным и узнаваемым русским выражением; ῥῆμα здесь не требуется сужать до отдельного изречения.
- source_word: δυνάμεις
  choice: силы
  rationale: 'Формально и семантически сохраняет широту множественного числа: речь может идти как о проявлениях силы, так и о чудесных деяниях.'
- source_word: τε
  choice: и
  rationale: Естественно связывает «силы» с предшествующим объектом вкушения без искусственного усиления.
- source_word: μέλλοντος αἰῶνος
  choice: грядущего века
  rationale: Сохраняет эсхатологическую направленность выражения и звучит естественно в современном литературном русском языке.
theological_decisions:
- issue: Смысл метафоры «вкусить» в контексте предостережения
  choice: Сохранить «вкусивших» без уточнения степени участия или переживания.
  alternative: «испытавших»; «лишь слегка вкусивших»
  rationale: Греческое γεύομαι не разрешает богословский спор о глубине участия описанных людей. Буквенная метафора сохраняет напряжение текста.
- issue: Значение δυνάμεις в эсхатологическом контексте
  choice: Перевести как «силы».
  alternative: «чудеса»; «могущественные деяния»
  rationale: Контекст допускает чудесные проявления силы наступающего века, но слово может иметь и более широкое значение. «Силы» не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. Сохранена синтаксическая незавершённость фрагмента, поскольку стих продолжает конструкцию Евреям 6:4–6; конечная запятая отражает продолжение предложения.
