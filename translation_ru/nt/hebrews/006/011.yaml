  text: ἐπιθυμοῦμεν δὲ ἕκαστον ὑμῶν τὴν αὐτὴν ἐνδείκνυσθαι σπουδὴν πρὸς τὴν πληροφορίαν τῆς ἐλπίδος ἄχρι τέλους,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/011.yaml
  text: And we desire each one of you to show the same diligence for the full assurance of hope until the end[b][a],
translation:
  language: ru
  text: Но мы желаем, чтобы каждый из вас проявлял такое же усердие ради полной уверенности в надежде[a] вплоть до конца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полной убеждённости в надежде». Греческое слово может обозначать полноту уверенности или убеждённости.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «до самого конца». Выражение подчёркивает стойкость и продолжение до завершения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμοῦμεν
  choice: мы желаем
  rationale: Передаёт настойчивое пастырское желание, не придавая ему оттенка страстного влечения и не снижая регистр до разговорного «хотим».
- source_word: δὲ
  choice: но
  rationale: Обозначает мягкий поворот от ободрения в предыдущем контексте к новому увещанию; русское «но» естественно передаёт этот лёгкий контраст.
- source_word: ἕκαστον ὑμῶν
  choice: каждый из вас
  rationale: Сохраняет распределительное значение и подчёркивает, что призыв обращён к каждому человеку в общине.
- source_word: τὴν αὐτὴν
  choice: такое же
  rationale: Отсылает к уже проявленному усердию в любви и служении; в данном русском построении «такое же» звучит естественнее буквального «то же самое».
- source_word: ἐνδείκνυσθαι
  choice: проявлял
  rationale: Точно и естественно передаёт обнаружение качества в поступках; форма согласована с конструкцией «чтобы каждый».
- source_word: σπουδὴν
  choice: усердие
  rationale: Выражает деятельную серьёзность и постоянное старание, а не только эмоциональный пыл.
- source_word: πρὸς
  choice: ради
  rationale: Передаёт целевую направленность усердия к полной уверенности, не добавляя отдельного действия вроде «достичь» или «обрести».
- source_word: πληροφορίαν
  choice: полной уверенности
  rationale: Передаёт полноту убеждённости или уверенности и оставляет открытым оттенок как внутренней уверенности, так и твёрдости самой надежды.
- source_word: ἐλπίδος
  choice: в надежде
  rationale: Идиоматичная русская передача родительного отношения в выражении πληροφορία τῆς ἐλπίδος; не сводит надежду к простому пожеланию.
- source_word: ἄχρι τέλους
  choice: вплоть до конца
  rationale: Сохраняет временное и персеверативное значение продолжения до завершения; «вплоть» подчёркивает непрерывность.
theological_decisions:
- issue: Связь «полной уверенности» с надеждой и стойкостью
  choice: Выражение передано как «полная уверенность в надежде» без уточнения, является ли это прежде всего внутренней уверенностью верующего или твёрдостью надежды, основанной на Божьем обещании.
  alternative: «Полная уверенность в спасении» либо «полное осуществление надежды».
  rationale: Греческая конструкция допускает смысловое наложение субъективной уверенности и объективной надёжности ожидаемого. Добавление «спасение» или «осуществление» неоправданно сузило бы смысл.
- issue: Сфера действия выражения «до конца»
  choice: Оборот оставлен в конце предложения, где он может относиться к постоянству проявляемого усердия и к сохранению полной уверенности надежды.
  alternative: 'Явно присоединить его только к усердию: «до самого конца проявлял…» — или только к уверенности: «ради уверенности, сохраняющейся до конца».'
  rationale: Положение оборота в греческом тексте допускает естественную смысловую связь со всем призывом; перевод не должен искусственно устранять эту широту.
translation_notes:
  register: Современный литературный русский язык с достойным пастырским тоном. Синтаксис остаётся близким к греческому, но избегает неестественного буквального оборота «уверенность надежды». Маркеры сносок помещены непосредственно после соответствующих выражений.
