source:
  edition: SBLGNT
  text: γῆ γὰρ ἡ πιοῦσα τὸν ἐπ’ αὐτῆς ⸂ἐρχόμενον πολλάκις⸃ ὑετόν, καὶ τίκτουσα βοτάνην εὔθετον ἐκείνοις δι’ οὓς καὶ γεωργεῖται, μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: ru
  text: Ведь земля, пьющая дождь, который часто проливается на неё, и приносящая растительность[a], полезную тем, ради кого её и возделывают[b], получает благословение от Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «растения», «траву» либо «урожай».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «полезную тем, кто её и возделывает», однако сочетание διά с винительным падежом здесь вероятнее означает «ради кого её возделывают».'
    reason: alternative_reading
lexical_decisions:
- source_word: γῆ
  choice: земля
  rationale: В земледельческой метафоре речь идёт об участке обрабатываемой земли; «земля» естественно передаёт образ, не сужая его до одного лишь почвенного слоя.
- source_word: πιοῦσα
  choice: пьющая
  rationale: Сохраняет яркое олицетворение земли; более нейтральное «впитывающая» ослабило бы образ исходного текста.
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: дождь, который часто проливается на неё
  rationale: Естественно передаёт повторяемость, выраженную πολλάκις, и направленность дождя на землю; «проливается» идиоматично для русского земледельческого контекста.
- source_word: τίκτουσα
  choice: взращивающая
  rationale: Передаёт появление растительности благодаря земле и дождю и звучит естественно в современном литературном русском.
- source_word: βοτάνην
  choice: растения
  rationale: Широкое и понятное обозначение растительного покрова или произрастания без неоправданного сведения смысла к конкретной сельскохозяйственной культуре.
- source_word: εὔθετον
  choice: полезные
  rationale: В данном практическом контексте прилагательное означает пригодность и пользу растений для людей.
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: тем, ради кого её и возделывают
  rationale: διά с винительным падежом естественнее всего выражает основание или цель — «ради кого», а καί передано частицей «и».
- source_word: γεωργεῖται
  choice: её и возделывают
  rationale: «Возделывают» точно и естественно обозначает сельскохозяйственную обработку земли, сохраняя пассив исходного текста в русской неопределённо-личной конструкции.
- source_word: μεταλαμβάνει
  choice: получает
  rationale: В контексте благословения ясно передаёт обретение землёй Божьего благоволения; «приобщается» было бы менее естественно.
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: благословение от Бога
  rationale: Сохраняет источник благословения и не вносит дополнительных богословских уточнений.
theological_decisions:
- issue: Земледельческая метафора в контексте предостережения
  choice: Передать положительную сторону земледельческой метафоры прямо, не уточняя доктринальный статус изображённых людей.
  alternative: Истолковательно обозначить землю как истинно верующих либо как верующих, получающих одобрение за плодотворность.
  rationale: Сам стих описывает плодородную землю и Божье благословение, но не разрешает напрямую богословские споры о стойкости и отпадении; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изложения. Олицетворение земли сохранено в словах «земля, пьющая дождь»; синтаксис сделан плавным и понятным без устранения смысловой неоднозначности.
