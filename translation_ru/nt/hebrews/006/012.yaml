id: HEB.6.12
reference: Hebrews 6:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἵνα μὴ νωθροὶ γένησθε, μιμηταὶ δὲ τῶν διὰ πίστεως καὶ μακροθυμίας κληρονομούντων τὰς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/012.yaml
  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: ru
  text: чтобы вы не стали вялыми, а подражали тем, кто верой[a] и терпением наследует обещания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верностью и терпением». Греческое слово, переведённое как «вера», в некоторых контекстах может также означать «верность» или «доверие».'
    reason: Лексическая альтернатива для πίστις без устранения смысловой неоднозначности.
lexical_decisions:
- source_word: νωθροὶ
  choice: вялыми
  rationale: Передаёт медлительность и недостаток усердия в данном контексте, не сводя смысл лишь к нравственно окрашенной «лени» и не используя архаизм.
- source_word: γένησθε
  choice: не стали
  rationale: 'Сохраняет начинательное значение γίνομαι: предостережение не впасть в такое состояние.'
- source_word: μιμηταὶ
  choice: подражали
  rationale: Естественно передаёт прямой призыв брать других за образец; по-русски глагольная конструкция звучит лучше, чем «были подражателями».
- source_word: διὰ πίστεως
  choice: верой
  rationale: Передаёт средство или образ действия и сохраняет широкое значение πίστις, включая доверие Богу; возможный оттенок верности отмечен в сноске.
- source_word: μακροθυμίας
  choice: терпением
  rationale: Ясное современное обозначение терпеливой стойкости на протяжении времени; «долготерпение» возможно, но менее обычно в современной речи.
- source_word: κληρονομούντων
  choice: наследует
  rationale: Настоящее причастие характеризует этих людей как наследующих; личная форма в относительном обороте естественна по-русски.
- source_word: τὰς ἐπαγγελίας
  choice: обещания
  rationale: Сохраняет явное множественное число и связь с повторяющейся в Послании темой Божьих обещаний.
- source_word: ἵνα μὴ
  choice: чтобы ... не
  rationale: Сохраняет целевую или результативную связь с предшествующим увещанием и естественно звучит по-русски.
theological_decisions:
- issue: Значение πίστις в увещательном контексте
  choice: вера
  alternative: верность; доверие
  rationale: «Вера» сохраняет обычное и богословски широкое значение слова, не исключая доверия Богу. Поскольку в данном контексте возможен оттенок «верности», он указан в сноске, а не навязан основному тексту.
translation_notes:
  register: Современный литературный русский язык с достойным, но доступным звучанием. Синтаксис сохраняет зависимость стиха от предыдущего предложения; «вялыми» передаёт духовную пассивность без архаичности, а «наследует обещания» удерживает образ и множественное число оригинала.
