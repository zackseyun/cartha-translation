reference: Hebrews 6:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἀδύνατον γὰρ τοὺς ἅπαξ φωτισθέντας γευσαμένους τε τῆς δωρεᾶς τῆς ἐπουρανίου καὶ μετόχους γενηθέντας πνεύματος ἁγίου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/004.yaml
  text: For it is impossible[a], in the case of those who were once enlightened, and who tasted the heavenly gift, and became partakers of the Holy Spirit[c][b],
translation:
  language: ru
  text: Ибо невозможно тех, кто однажды были просвещены[a], вкусили небесный дар[b] и стали причастниками Святого Духа[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Просвещены» может в широком смысле означать получение духовного света или наставления; некоторые понимают это слово конкретнее — как обращение или просвещение, связанное с крещением.
    reason: alternative_reading
  - marker: b
    text: 'Или: «испытали небесный дар». Глагол буквально означает «вкусить», но может обозначать реальное переживание, а не лишь поверхностную пробу.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «стали участниками Святого Духа», «стали сопричастны Святому Духу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδύνατον
  choice: невозможно
  rationale: Предикативное прилагательное передано безличной конструкцией, естественной для русского языка и сохраняющей эмфатическое положение слова в начале рассуждения.
- source_word: γὰρ
  choice: ибо
  rationale: Пояснительно-аргументативная связь с предыдущим контекстом передана кратким литературным союзом, без уточнения логики сверх выраженного в греческом тексте.
- source_word: ἅπαξ
  choice: однажды
  rationale: Обозначает однократное совершившееся событие; вариант не усиливает значение до «раз и навсегда», чего сама форма здесь не требует.
- source_word: φωτισθέντας
  choice: были просвещены
  rationale: Сохраняется метафора духовного или познавательного просвещения, при этом перевод не отождествляет её прямо ни с обращением, ни с крещением.
- source_word: γευσαμένους
  choice: вкусили
  rationale: Сохранён конкретный образ исходного глагола, который в данном употреблении может обозначать реальное переживание, а не только поверхностную пробу.
- source_word: δωρεᾶς τῆς ἐπουρανίου
  choice: небесный дар
  rationale: Лаконично сохраняет атрибутивную конструкцию и не конкретизирует, что именно является даром.
- source_word: τε ... καὶ
  choice: и
  rationale: Накопительная связь между однородными причастными описаниями естественно выражена русским союзом «и».
- source_word: μετόχους
  choice: причастниками
  rationale: Слово передаёт участие и общность и сохраняет весомость выражения, не сводя его ни к внешнему соприкосновению, ни к заранее определённой систематико-богословской категории.
- source_word: γενηθέντας
  choice: стали
  rationale: Передаёт вхождение в названное состояние, выраженное аористным причастием γίνομαι.
- source_word: πνεύματος ἁγίου
  choice: Святого Духа
  rationale: Родительный падеж зависит от «причастниками»; прописные буквы отражают личный божественный референт в новозаветном контексте.
theological_decisions:
- issue: Следует ли понимать φωτισθέντας исключительно как обращение или крещальное просвещение
  choice: Сохранить более широкое «были просвещены»
  alternative: «обратились» или «были просвещены в крещении»
  rationale: Греческий текст использует метафору просвещения и прямо не определяет её референт; более широкая формулировка сохраняет неоднозначность.
- issue: Указывает ли γευσαμένους лишь на поверхностную пробу или на полноценное переживание
  choice: Передать буквально «вкусили», пояснив возможный смысл в сноске
  alternative: «испытали» либо «лишь попробовали»
  rationale: Глагол способен обозначать подлинное переживание, но сам по себе не решает спор о характере описанного опыта.
- issue: Определяет ли μετόχους γενηθέντας πνεύματος ἁγίου точный сотериологический статус этих людей
  choice: «стали причастниками Святого Духа» без дополнительного догматического уточнения
  alternative: «получили спасительное пребывание Святого Духа» или ослабленное «соприкоснулись с действием Святого Духа»
  rationale: Прямой перевод сохраняет силу выражения, не разрешая на лексическом уровне богословское напряжение отрывка об отступничестве и стойкости.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис намеренно остаётся незавершённым: стих представляет собой начало длинного предложения, продолжающегося в следующих стихах. Формы множественного числа с «которые» ясно отражают греческие причастия во множественном числе.'
