lexical_decisions:
- source_word: γὰρ
  choice: Ведь
  rationale: Передаёт пояснительную связь с предшествующим рассуждением и звучит естественно в современном русском языке.
- source_word: Τῷ ... Ἀβραὰμ ἐπαγγειλάμενος
  choice: дав Аврааму обещание
  rationale: Дательный падеж обозначает получателя обещания, а деепричастный оборот сохраняет связь греческого причастия с основным действием.
- source_word: ἐπεὶ
  choice: поскольку
  rationale: В данном контексте союз выражает причину того, что Бог поклялся Самим Собой.
- source_word: κατ’ οὐδενὸς ... μείζονος
  choice: никем более великим
  rationale: Контекст клятвы указывает на личный референт; формулировка сохраняет сравнительное значение μείζονος, не добавляя отсутствующего в тексте уточнения «чем Он».
- source_word: ὀμόσαι / ὤμοσεν
  choice: поклясться / поклялся
  rationale: Повтор одного русского корня воспроизводит лексический повтор греческого текста.
- source_word: καθ’ ἑαυτοῦ
  choice: Самим Собой
  rationale: В формуле клятвы κατά с возвратным местоимением означает поклясться самим собой; русский творительный падеж передаёт это идиоматично.
theological_decisions:
- issue: Основание Божьей клятвы
  choice: Бог поклялся Самим Собой, поскольку не мог поклясться никем более великим.
  alternative: Бог поклялся Самим Собой, поскольку не было никого более великого, кем Он мог бы поклясться.
  rationale: Перевод сохраняет утверждение текста о непревзойдённом величии Бога, не разворачивая его в более поздние богословские формулы.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Начальное «Ведь» естественно связывает стих с предыдущим рассуждением; прописные буквы в «Самим Собой» ясно указывают на Бога.
