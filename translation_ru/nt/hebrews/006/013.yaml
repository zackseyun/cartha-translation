  text: Τῷ γὰρ Ἀβραὰμ ἐπαγγειλάμενος ὁ θεός, ἐπεὶ κατ’ οὐδενὸς εἶχεν μείζονος ὀμόσαι, ὤμοσεν καθ’ ἑαυτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/013.yaml
  text: For when God made the promise to Abraham[a], since he could swear by no one greater, he swore by himself[b],
translation:
  language: ru
  text: Ведь Бог, дав Аврааму обещание[a], поскольку не мог поклясться никем, кто был бы более велик, чем Он Сам, поклялся Самим Собой[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, проще: «обещав Аврааму».'
