  text: ἵνα διὰ δύο πραγμάτων ἀμεταθέτων, ἐν οἷς ἀδύνατον ψεύσασθαι ⸀θεόν, ἰσχυρὰν παράκλησιν ἔχωμεν οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: ru
  text: чтобы благодаря двум неизменным вещам, в которых Богу невозможно солгать, мы, прибегшие в поисках убежища,[a] обрели сильное ободрение ухватиться за предложенную нам надежду.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «прибегшие [в поисках убежища]». В греческом тексте не названо, к кому или куда они прибегли. Выражение может напоминать о бегстве в место безопасности, в том числе о ветхозаветных городах-убежищах.'
    reason: implicit_object_and_cross_reference
  - marker: b
    text: 'Или: «крепко держаться за предложенную нам надежду». Греческий глагол может означать «схватить», «ухватиться» или «крепко держаться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое или результативное значение союза и естественно связывает стих с предшествующим контекстом.
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: благодаря двум неизменным вещам
  rationale: πράγματα остаётся достаточно широким обозначением двух реалий из контекста — обещания и клятвы Бога; ἀμετάθετος указывает на невозможность изменения.
- source_word: ἐν οἷς
  choice: в которых
  rationale: Сохраняет прямую относительную связь с двумя упомянутыми вещами, не уточняя её сверх текста.
- source_word: ἀδύνατον ψεύσασθαι θεόν
  choice: Богу невозможно солгать
  rationale: Воспроизводит безличную конструкцию с инфинитивом и сохраняет торжественное утверждение исходного текста.
- source_word: ἰσχυρὰν παράκλησιν
  choice: твёрдое ободрение
  rationale: παράκλησις здесь обозначает укрепляющее ободрение, а ἰσχυράν подчёркивает его силу; «твёрдое» естественно соотносится с надёжностью Божьего обещания.
- source_word: ἔχωμεν
  choice: получили
  rationale: В русском целевая конструкция «чтобы… получили» естественно передаёт сослагательное значение после ἵνα; выбор глагола «получили» выражает обретение ободрения без существенного смыслового сдвига.
- source_word: οἱ καταφυγόντες
  choice: мы, прибегшие к Нему в поисках убежища
  rationale: Сохраняет образ бегства к безопасному месту. «К Нему» грамматически восполняет естественный для русского языка объект, подразумеваемый контекстом, и отмечено сноской как контекстуальное уточнение.
- source_word: κρατῆσαι
  choice: крепко держаться
  rationale: Передаёт диапазон «схватиться, удерживать, твёрдо держаться» и особенно естественно сочетается в русском с надеждой, сохраняя активное усилие.
- source_word: τῆς προκειμένης ἐλπίδος
  choice: за предложенную нам надежду
  rationale: Передаёт надежду как находящуюся перед адресатами и доступную им; «предложенную нам» естественно выражает πρόκειμαι в данном контексте.
theological_decisions:
- issue: Образ убежища и активного держания за надежду
  choice: Сохранён конкретный образ людей, прибегших в поисках убежища, и призыв крепко держаться за надежду.
  alternative: мы, нашедшие прибежище, получили сильное утешение уповать на данную нам надежду
  rationale: Исходный текст соединяет образ бегства ради безопасности с энергичным κρατῆσαι. Абстрактный пересказ ослабил бы оба образа.
- issue: Невозможность для Бога солгать
  choice: Богу невозможно солгать
  alternative: Бог не может лгать
  rationale: Формулировка сохраняет безличную греческую конструкцию и утверждение Божьей правдивости, не разворачивая его в более широкую догматическую формулу.
- issue: Референт двух неизменных вещей
  choice: двум неизменным вещам
  alternative: неизменным обещанию и клятве
  rationale: Хотя контекст указывает на Божье обещание и клятву, сам стих называет их общим словом πράγματα; перевод не заменяет эту отсылку явным толкованием.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Сохранены длинная причинно-целевая структура стиха, образ убежища и напряжение между «ухватиться» и «держаться». Все сноски отмечены в основном тексте.
