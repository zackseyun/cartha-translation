lexical_decisions:
- source_word: ἐν ᾧ
  choice: Поэтому
  rationale: Оборот связывает стих с предшествующим рассуждением о Божьей клятве и здесь естественно передаёт логическую связь, не воспроизводя неясное буквальное «в чём».
- source_word: περισσότερον
  choice: ещё яснее
  rationale: Наречие усиливает глагол «показать»; это сочетание естественно по-русски и передаёт усиленную наглядность данного Богом заверения.
- source_word: βουλόμενος
  choice: желая
  rationale: Причастие выражает сознательное намерение Бога; «желая» сохраняет форму и не подразумевает бессильного пожелания в данном контексте.
- source_word: ἐπιδεῖξαι
  choice: показать
  rationale: Прямое и понятное соответствие глаголу со значением «показать, продемонстрировать».
- source_word: τοῖς κληρονόμοις τῆς ἐπαγγελίας
  choice: наследникам обещания
  rationale: Сохраняется образ наследования и генитивная связь с обещанием без добавления отсутствующего в греческом притяжательного местоимения.
- source_word: τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ
  choice: неизменность Своего замысла
  rationale: Субстантивированное прилагательное передано отвлечённым существительным «неизменность», а βουλή — доступным и весомым словом «замысел», обозначающим обдуманное намерение.
- source_word: ἐμεσίτευσεν ὅρκῳ
  choice: подтвердил его клятвой
  rationale: 'Передаёт контекстуальную функцию действия: Бог дал дополнительное удостоверение неизменности замысла посредством клятвы. Более буквальный посреднический оттенок отмечен в сноске.'
theological_decisions:
- issue: Неизменность Божьего замысла без привнесения поздней метафизической терминологии
  choice: неизменность Своего замысла
  alternative: непреложность Своего решения; неизменность Своего совета
  rationale: Формулировка прямо сохраняет утверждение текста о невозможности изменения Божьего намерения, но не вводит специальной догматической лексики сверх сказанного в стихе.
- issue: Значение ἐμεσίτευσεν применительно к Божьей клятве
  choice: подтвердил его клятвой
  alternative: поручился за него клятвой; выступил посредником посредством клятвы
  rationale: Основной текст ясно передаёт функцию клятвы как удостоверения замысла, а сноска сохраняет необычный буквальный образ глагола и тем самым не скрывает лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. «Замысел» предпочтён более архаичному и потенциально двусмысленному «совету»; «подтвердил» — более естественному для обычного читателя выражению, при сохранении буквального оттенка в сноске.
