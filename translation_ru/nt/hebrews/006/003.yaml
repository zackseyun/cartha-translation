  yaml_path: translation/nt/hebrews/006/003.yaml
  text: And this we will do[a], if indeed God permits.
translation:
  language: ru
  text: И это мы сделаем, если только Бог позволит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если Бог позволит». Выражение «если только» передаёт усиленный характер условия в греческом тексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Обычный соединительный союз, связывающий это намерение с предыдущим призывом.
- source_word: τοῦτο
  choice: это
  rationale: Форма среднего рода единственного числа указывает на только что названное действие или направление дальнейшего наставления.
- source_word: ποιήσομεν
  choice: мы сделаем
  rationale: Будущее время ποιέω передано прямо; контекст проясняет, что речь идёт о намерении двигаться дальше в наставлении.
- source_word: ἐάνπερ
  choice: если только
  rationale: Передаёт реальное условие и усилительный оттенок частицы περ естественным современным русским выражением.
- source_word: ἐπιτρέπῃ
  choice: позволит
  rationale: Точно и естественно передаёт значение разрешения; будущее время в русском соответствует условной конструкции о предстоящем действии.
- source_word: ὁ θεός
  choice: Бог
  rationale: Подлежащее передано идиоматично, без отдельного воспроизведения греческого артикля.
theological_decisions:
- issue: Условие о Божьем позволении
  choice: 'Сохранено прямое условие: намерение автора осуществится, если Бог позволит.'
  alternative: Ослабленное «если будет угодно Богу» или расширенное толкование о характере Божьего действия.
  rationale: Греческий текст прямо подчиняет человеческое намерение Божьему позволению, но не объясняет механизм этого отношения; перевод сохраняет эту напряжённость без конфессионального уточнения.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка. «Если только» сохраняет усиление в ἐάνπερ, не превращая условие ни в простую вводную формулу, ни в более сильное богословское утверждение.
