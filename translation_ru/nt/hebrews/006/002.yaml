  text: βαπτισμῶν ⸀διδαχὴν ἐπιθέσεώς τε χειρῶν, ἀναστάσεώς ⸀τε νεκρῶν καὶ κρίματος αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/002.yaml
  text: instruction about washings[a], the laying on of hands, the resurrection of the dead, and eternal judgment.
translation:
  language: ru
  text: учение об омовениях[a], возложении рук, воскресении мёртвых и вечном суде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «учение о крещениях». Греческое слово во множественном числе может обозначать ритуальные омовения вообще, а не обязательно именно христианское крещение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισμῶν
  choice: омовениях
  rationale: Множественное число и словоупотребление допускают более широкое значение ритуальных омовений, а не только христианского крещения. «Омовения» естественно передаёт церемониальный характер и сохраняет множественное число.
- source_word: διδαχὴν
  choice: учение
  rationale: 'Слово продолжает перечень основ из предыдущего стиха и естественно сочетается с последующими зависимыми существительными: «учение об омовениях…».'
- source_word: ἐπιθέσεώς τε χειρῶν
  choice: возложении рук
  rationale: Устойчивое и понятное русское обозначение названного действия, точно передающее конструкцию оригинала.
- source_word: ἀναστάσεώς τε νεκρῶν
  choice: воскресении мёртвых
  rationale: Естественная русская передача родительной конструкции, сохраняющая собирательное значение νεκρῶν.
- source_word: κρίματος αἰωνίου
  choice: вечном суде
  rationale: Передаёт αἰώνιος стандартным словом «вечный», а κρίμα — как «суд», не сужая значение до осуждения.
- source_word: τε ... τε καὶ
  choice: перечисление с союзом «и» перед последним элементом
  rationale: Русское бессоюзное перечисление с заключительным «и» естественно передаёт структуру греческого ряда без тяжеловесного воспроизведения частиц.
theological_decisions:
- issue: Значение βαπτισμῶν в перечне начальных учений
  choice: «омовениях»
  alternative: «крещениях»
  rationale: Множественное число и диапазон значения слова позволяют понимать его как ритуальные омовения вообще. Основной текст не навязывает специально христианское или конфессионально-сакраментальное прочтение; допустимая альтернатива указана в сноске.
- issue: Объём значения κρίματος αἰωνίου
  choice: «вечном суде»
  alternative: «вечном осуждении»
  rationale: Греческий текст говорит о суде, а не только об осуждении. Выбранная формулировка сохраняет широту и богословское напряжение оригинала.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная, сохраняет синтаксическую связь с предыдущим стихом. Церковно узнаваемые выражения «возложение рук», «воскресение мёртвых» и «вечный суд» оставлены как естественные и точные.
