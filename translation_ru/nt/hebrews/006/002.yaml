  source_fidelity: 'Текст точно передаёт греческий перечень: διδαχήν — «учение», βαπτισμῶν сохранено во множественном числе как «омовения», ἐπίθεσις χειρῶν — «возложение рук», ἀνάστασις νεκρῶν — «воскресение мёртвых», κρῖμα αἰώνιον — «вечный суд». Синтаксическая связь «учение об ...» с последующими пунктами перечня в русском понятна и соответствует функции родительных конструкций в оригинале.'
