  terminology: «Омовения» удачно передаёт вероятное более широкое, ритуальное значение βαπτισμῶν и не отождествляет его безоговорочно с христианским крещением. Сноска корректно и ненавязчиво сообщает допустимую альтернативу «крещения». «Вечный суд» не подменяет κρίμα более узким «осуждением». Маркер сноски расположен непосредственно после «омовениях» и соответствует её содержанию.
