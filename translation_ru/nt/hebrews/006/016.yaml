id: HEB.6.16
reference: Hebrews 6:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ἄνθρωποι γὰρ κατὰ τοῦ μείζονος ὀμνύουσιν, καὶ πάσης αὐτοῖς ἀντιλογίας πέρας εἰς βεβαίωσιν ὁ ὅρκος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/016.yaml
  text: For people swear by one greater than themselves[b][a], and for them an oath is the end of every dispute for confirmation.
translation:
  language: ru
  text: Ведь люди клянутся тем, кто выше их, и клятва служит им подтверждением и кладёт конец всякому спору[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякому возражению»; также возможно: «всякому разногласию».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωποι
  choice: люди
  rationale: Форма множественного числа имеет здесь обобщённое значение и относится ко всем людям, а не только к мужчинам; «люди» естественно передаёт эту мысль по-русски.
- source_word: κατὰ τοῦ μείζονος
  choice: тем, кто выше их
  rationale: В формуле клятвы κατά с родительным падежом указывает на того, кем клянутся; сравнительная степень μείζονος выражает превосходство этого лица над клянущимися, не уточняя его личности.
- source_word: ὀμνύουσιν
  choice: клянутся
  rationale: Прямой и естественный русский эквивалент в настоящем времени; существительное «клятва» далее передано отдельно.
- source_word: πάσης ... ἀντιλογίας
  choice: всякому спору
  rationale: В данном контексте ἀντιλογία обозначает спор, возражение или разногласие, которое может быть прекращено клятвой; «спор» наиболее естественно выражает общий смысл.
- source_word: πέρας
  choice: кладёт конец
  rationale: Глагольная конструкция естественно передаёт буквальный образ «конца» и роль клятвы в прекращении спора.
- source_word: εἰς βεβαίωσιν
  choice: служит им подтверждением
  rationale: βεβαίωσις означает подтверждение или удостоверение; конструкция передаёт назначение и результат клятвы без добавления не названного в тексте объекта подтверждения.
- source_word: ὁ ὅρκος
  choice: клятва
  rationale: В обобщающем высказывании русское существительное без артикля естественно обозначает клятву как общепринятое средство подтверждения.
theological_decisions:
- issue: Обобщённое обозначение человечества
  choice: люди
  alternative: мужчины
  rationale: ἄνθρωποι здесь обозначает людей вообще и описывает общую человеческую практику; мужской пол не является смысловым компонентом высказывания.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, без архаизмов. Параллельные сказуемые «служит… подтверждением» и «кладёт конец» сохраняют обе смысловые стороны греческой фразы, не устраняя возможный оттенок слова ἀντιλογία.
