base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/020.yaml
  text: where Jesus has entered as a forerunner on our behalf[b][a], having become a high priest forever according to the order of Melchizedek.
translation:
  language: ru
  text: куда Иисус вошёл как предшественник ради нас[a], став Первосвященником навеки по чину Мелхиседека[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за нас». Греческое выражение может обозначать действие ради блага других; здесь оно подчёркивает, что Иисус вошёл как их представитель.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в соответствии с чином Мелхиседека». Это выражение отсылает к Пс. 109:4 (110:4).'
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: куда
  rationale: Местоименное наречие отсылает к месту за завесой (ст. 19). Русское «куда» естественно сочетается с глаголом движения «вошёл» и передаёт направительное значение, подразумеваемое контекстом.
- source_word: πρόδρομος
  choice: предшественник
  rationale: Слово обозначает того, кто идёт впереди других. «Предшественник» сохраняет образ Иисуса, первым вошедшего туда и открывающего путь следующим за Ним.
- source_word: ὑπὲρ ἡμῶν
  choice: ради нас
  rationale: Передаёт действие ради блага других и допускает представительный оттенок, не сужая выражение до однозначного значения «вместо нас».
- source_word: εἰσῆλθεν
  choice: вошёл
  rationale: Простой вид прошедшего времени естественно передаёт греческий аорист как совершившееся событие; контекст Послания раскрывает его непреходящее значение.
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Устоявшаяся русская форма имени.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: по чину Мелхиседека
  rationale: Устоявшееся и точное выражение, сохраняющее связь с Псалмом 109:4 по традиционной русской нумерации (110:4 по еврейской/современной международной). «Чин» здесь означает установленный порядок или тип священства.
- source_word: ἀρχιερεὺς
  choice: Первосвященником
  rationale: Точный термин для высшего священнического служения, центрального для аргумента Послания к евреям. Прописная буква уместна как обозначение уникального служения Иисуса в данном контексте.
- source_word: γενόμενος
  choice: став
  rationale: Сохраняет значение причастия и указывает на принятие первосвященнического служения, не превращая форму в прямое утверждение о происхождении или изменении сущности Иисуса.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Кратко и естественно выражает непреходящий характер первосвященства и сохраняет возвышенное звучание цитатной аллюзии.
theological_decisions:
- issue: Отношение γενόμενος («став») к христологии
  choice: Сохранено «став Первосвященником» как указание на обретение или принятие служебного статуса.
  alternative: «будучи поставлен Первосвященником»; «сделавшись Первосвященником»
  rationale: Греческое причастие нельзя бесследно устранять, однако стих говорит о священническом служении Иисуса, а не о возникновении Его личности или изменении Его сущности.
- issue: Смысл ὑπὲρ ἡμῶν
  choice: «ради нас»
  alternative: «за нас»; «вместо нас»; «от нашего имени»
  rationale: Контекст подчёркивает, что Иисус вошёл впереди верующих ради их блага и как их представитель. «Ради нас» сохраняет широту греческого выражения и не навязывает более узкое заместительное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис остаётся ясным для обычного читателя; традиционные термины «Первосвященник» и «чин Мелхиседека» сохранены из-за их точности и межтекстовой значимости.
