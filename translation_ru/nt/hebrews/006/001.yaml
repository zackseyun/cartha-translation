  source_fidelity: 'Основной смысл передан верно: Διό — «Поэтому», ἀφέντες — «оставив», τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον — «начальное учение о Мессии», а движение к τελειότης естественно выражено как движение «к зрелости». Однако «покаяния в мёртвых делах» не передаёт ἀπό («от, прочь от»): такая русская формулировка скорее означает покаяние, совершаемое в связи с этими делами. Также у θεμέλιον единственное число.'
