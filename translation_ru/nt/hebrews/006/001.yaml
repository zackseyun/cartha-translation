id: HEB.6.1
reference: Hebrews 6:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, μὴ πάλιν θεμέλιον καταβαλλόμενοι μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/001.yaml
  text: Therefore[a], leaving the elementary message about the Messiah, let us be carried on to maturity, not laying again a foundation of repentance from dead works and of faith toward God[d][c][b],
translation:
  language: ru
  text: Поэтому, оставив начальное учение о Мессии[a], будем двигаться дальше[c] — к зрелости[b], не закладывая снова основания покаяния от мёртвых дел и веры в Бога[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «основы учения о Мессии»; возможно также: «начальное слово Мессии».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к совершенству» или «к полноте».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквальнее греческая пассивная форма может быть передана: «будем несомы дальше»; возможно также естественное по-русски: «пойдём дальше».'
    reason: lexical_alternative
  - marker: d
    text: 'Буквальнее: «веры, обращённой к Богу»; по смыслу: «доверия Богу».'
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения и естественно вводит призыв.
- source_word: ἀφέντες
  choice: оставив
  rationale: Сохраняет форму деепричастия и обозначает переход от начального наставления к дальнейшему, а не отказ от него как от ложного.
- source_word: τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον
  choice: начальное учение о Мессии
  rationale: Естественно передаёт λόγος как «учение», а τῆς ἀρχῆς — как относящееся к первым, основополагающим наставлениям. Родительная конструкция допускает и другие оттенки, отмеченные в сноске.
- source_word: Χριστοῦ
  choice: о Мессии
  rationale: В данном контексте Χριστός уместно понимать как титул и передавать словом «Мессия».
- source_word: ἐπὶ τὴν τελειότητα
  choice: к зрелости
  rationale: В контрасте с начальными основами речь идёт о зрелости или полноте развития; вариант не навязывает идею абсолютной безгрешности.
- source_word: φερώμεθα
  choice: будем двигаться дальше
  rationale: Это естественный современный русский призыв в данном контексте. Пассивный оттенок греческой формы сохранён в сноске, чтобы не скрывать особенность оригинала.
- source_word: θεμέλιον καταβαλλόμενοι
  choice: не закладывая снова основания
  rationale: Сохраняет строительную метафору и связь с повторным преподаванием основ.
- source_word: μετανοίας ἀπὸ νεκρῶν ἔργων
  choice: покаяния в мёртвых делах
  rationale: «Покаяние» точно и привычно передаёт μετάνοια, а «мёртвые дела» сохраняет ёмкую и не до конца истолкованную метафору оригинала.
- source_word: πίστεως ἐπὶ θεόν
  choice: веры в Бога
  rationale: Наиболее естественная русская формулировка; направительный оттенок ἐπί отмечен в сноске.
theological_decisions:
- issue: Означает ли ἀφέντες отказ от начального учения о Мессии
  choice: Переход от основ к дальнейшей зрелости без отвержения самих основ
  alternative: Полный отказ от прежнего учения
  rationale: Продолжение фразы говорит не о разрушении основания, а о том, что его не следует закладывать снова.
- issue: Следует ли понимать τελειότης как совершенство или зрелость
  choice: зрелость
  alternative: совершенство; полнота
  rationale: Контекст противопоставляет начальное наставление дальнейшему развитию. «Зрелость» ясно передаёт это противопоставление, а альтернативы сохранены в сноске.
- issue: Как передать пассивную форму φερώμεθα
  choice: В основном тексте употребить естественное «будем двигаться дальше», указав пассивный смысл в сноске
  alternative: будем несомы; да будем влекомы
  rationale: Буквальные русские пассивные варианты звучат неестественно или архаично, однако грамматическая неоднозначность оригинала не должна быть скрыта.
- issue: Смысл выражения «мёртвые дела»
  choice: Сохранить метафору без поясняющего сужения
  alternative: дела, ведущие к смерти; бесплодные дела; греховные дела
  rationale: Сам стих не уточняет, являются ли эти дела духовно безжизненными, ведущими к смерти или понимаемыми иначе.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Синтаксис сохраняет движение одной греческой фразы, а двоеточие помогает показать, что покаяние и вера относятся к образу основания. Термины не привязаны к конфессионально-специфическому толкованию.
