source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐτελείωσεν ὁ νόμος, ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος, δι’ ἧς ἐγγίζομεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/019.yaml
  text: For the law perfected nothing[a], but there is the introduction of a better hope[b], through which we draw near to God.
translation:
  language: ru
  text: Ведь закон ничего не довёл до совершенства[a], но была введена лучшая надежда[b], посредством которой мы приближаемся к Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «закон ничего не сделал совершенным». Греческий глагол может также означать «довести до завершения» или «привести к цели».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «но введение лучшей надежды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν
  choice: ничего
  rationale: Винительный падеж среднего рода служит дополнением при ἐτελείωσεν; «ничего» естественно передаёт абсолютное отрицание.
- source_word: γὰρ
  choice: ведь
  rationale: Союз вводит объяснение предыдущей мысли; «ведь» естественно сохраняет пояснительно-обосновывающую связь в современном русском.
- source_word: ἐτελείωσεν
  choice: не довёл до совершенства
  rationale: Глагол обозначает приведение к цели, завершённости или совершенству и в Послании к евреям имеет особый богословский вес. Оборот сохраняет этот смысл и не создаёт впечатления, будто закон вообще ничего не делал.
- source_word: ὁ νόμος
  choice: закон
  rationale: В контексте имеется в виду Моисеев закон и связанный с ним священнический порядок; строчная буква не добавляет отсутствующего в греческом графического разграничения.
- source_word: ἐπεισαγωγὴ
  choice: была введена
  rationale: Редкое существительное означает введение или привнесение чего-либо нового. Глагольная передача делает эллиптическое греческое противопоставление естественным по-русски, не меняя его смысла.
- source_word: δὲ
  choice: но
  rationale: Здесь союз выражает явное противопоставление неспособности закона и введению лучшей надежды.
- source_word: κρείττονος ἐλπίδος
  choice: лучшая надежда
  rationale: «Лучшая» сохраняет ключевое для Послания сравнительное обозначение; отсутствие артикля не требует неопределённости, которую русский язык грамматически не выражает.
- source_word: δι’ ἧς
  choice: благодаря которой
  rationale: Относительное местоимение женского рода естественно относится к надежде; оборот передаёт её как средство доступа к Богу.
- source_word: ἐγγίζομεν
  choice: мы приближаемся
  rationale: Передаёт движение к Богу и сохраняет характерный для Послания смысл доступа к Нему, оставаясь понятным современному читателю.
- source_word: τῷ θεῷ
  choice: к Богу
  rationale: Дательный падеж после ἐγγίζομεν обозначает того, к кому приближаются; «к Богу» — естественная русская конструкция.
theological_decisions:
- issue: Смысл τελειόω применительно к закону
  choice: Закон ничего не довёл до состояния совершенства или завершённости, необходимого для полного доступа к Богу.
  alternative: Закон вообще ничего не совершил; либо закон не усовершенствовал лишь священство.
  rationale: В Послании глагол связан с достижением цели, священнической действенностью и доступом к Богу. Формулировка сохраняет абсолютное «ничего», но не превращает стих в утверждение о полной бесполезности закона.
- issue: Эллиптическое противопоставление после утверждения о законе
  choice: Передать именной греческий оборот естественной русской конструкцией «но была введена лучшая надежда».
  alternative: «Но — введение лучшей надежды» или «но есть введение лучшей надежды».
  rationale: В греческом конечный глагол отсутствует. Русская глагольная конструкция ясно выражает подразумеваемое событие, не уточняя, кем именно была введена надежда, и сохраняет противопоставление.
translation_notes:
  register: Современный литературный русский, понятный широкому читателю. «Довёл до совершенства» сохраняет ключевую лексику Послания, а пассивное «была введена» естественно передаёт греческий эллипсис без добавления действующего лица.
