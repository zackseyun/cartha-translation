source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες ἐντολὴν ἔχουσιν ἀποδεκατοῦν τὸν λαὸν κατὰ τὸν νόμον, τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν, καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/005.yaml
  text: And those from the sons of Levi who receive the priesthood have a commandment according to the law to collect a tenth from the people—that is[b][a], from their brothers—though they also have come from Abraham’s loins.
translation:
  language: ru
  text: И те из сынов Левия, кто принимает священство, имеют по закону повеление взимать десятину с народа, то есть со своих братьев[a], хотя и сами они произошли из чресл Авраама[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со своих соплеменников-израильтян». В греческом тексте буквально: «со своих братьев».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «произошли от Авраама». Буквально: «вышли из чресл Авраама».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  choice: те из сынов Левия
  rationale: 'Сохраняет частичный смысл ἐκ и родовую формулировку: речь не обо всех левитах вообще, а о тех из линии Левия, кто получает священство.'
- source_word: τὴν ἱερατείαν λαμβάνοντες
  choice: кто принимает священство
  rationale: Передаёт получение священнического служения, а не самовольное присвоение; «священство» естественно соответствует ἱερατεία.
- source_word: ἐντολὴν ἔχουσιν
  choice: имеют заповедь
  rationale: Сохраняет именную конструкцию и нормативно-заветный оттенок ἐντολή.
- source_word: ἀποδεκατοῦν
  choice: брать десятину с
  rationale: Ясно обозначает получение десятины от других, а не её отдачу.
- source_word: τὸν λαὸν
  choice: народа
  rationale: Прямо передаёт λαός; последующее пояснение уточняет, что имеются в виду соплеменники-израильтяне.
- source_word: κατὰ τὸν νόμον
  choice: по закону
  rationale: Естественная русская юридическая формулировка, выражающая соответствие предписанию закона.
- source_word: τοῦτ’ ἔστιν
  choice: то есть
  rationale: Естественно вводит поясняющее приложение.
- source_word: τοὺς ἀδελφοὺς αὐτῶν
  choice: со своих братьев
  rationale: Сохраняет мужской термин родства и образ общего происхождения; широкий смысл внутри Израиля пояснён в сноске.
- source_word: καίπερ
  choice: хотя и
  rationale: Передаёт уступительное значение и естественно сочетается с усилительным «сами».
- source_word: ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ
  choice: сами они произошли из чресл Авраама
  rationale: Сохраняет конкретный телесно-родовой образ, значимый для рассуждения главы, при этом традиционное «чресла» понятно в возвышенном библейском регистре.
theological_decisions:
- issue: Родственная лексика в контексте всего народа Израиля
  choice: со своих братьев
  alternative: со своих соплеменников-израильтян
  rationale: Греческий текст использует мужское ἀδελφούς. Основной текст сохраняет родовой образ, а сноска разъясняет его более широкий общеизраильский смысл.
- issue: Сохранение телесного образа происхождения
  choice: произошли из чресл Авраама
  alternative: произошли от Авраама
  rationale: Буквальный образ общего телесного происхождения поддерживает аргумент автора о родстве священников и тех, с кого они получают десятину.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Синтаксис следует ходу греческой фразы, но остаётся понятным; архаизирующий элемент «чресла» сохранён целенаправленно ради телесного образа происхождения и пояснён сноской.
