source:
  edition: SBLGNT
  text: ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος βασιλεὺς δικαιοσύνης ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: ru
  text: которому Авраам также выделил десятую часть из всего[a]. Прежде всего, его имя в переводе означает «Царь праведности»[b], а затем он также царь Салима, то есть «Царь мира».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «десятину». По-гречески буквально: «десятую часть».'
    reason: lexical_alternative
  - marker: b
    text: '«Царь праведности» можно также перевести как «Царь справедливости»: греческое слово допускает оба значения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: которому
  rationale: Дательный падеж относительного местоимения указывает на Мелхиседека как получателя десятой части.
- source_word: δεκάτην ἀπὸ πάντων
  choice: десятую часть от всего
  rationale: Передаёт буквальное значение δεκάτην («десятая часть») и естественно выражает долю, выделенную из всего имущества или добычи.
- source_word: ἐμέρισεν
  choice: отделил
  rationale: Глагол обозначает выделение или распределение части; «отделил» сохраняет этот оттенок и звучит естественно по-русски.
- source_word: πρῶτον μὲν ἑρμηνευόμενος
  choice: Имя его прежде всего переводится как
  rationale: Причастная конструкция объясняет значение имени Мелхиседека; добавление «имя его» делает русскую фразу ясной, не меняя смысла.
- source_word: βασιλεὺς δικαιοσύνης
  choice: Царь праведности
  rationale: δικαιοσύνη здесь допускает значения праведности и справедливости; основное чтение сохраняет традиционную и контекстуально уместную формулировку.
- source_word: ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ
  choice: а затем он ещё и царь Салима
  rationale: Сохраняется последовательность двух объяснений и утверждение титула, связанного с географическим названием Салим.
- source_word: ὅ ἐστιν βασιλεὺς εἰρήνης
  choice: то есть «Царь мира»
  rationale: «То есть» естественно вводит пояснение значения Салима, а εἰρήνη передано обычным русским словом «мир».
theological_decisions:
- issue: Значение δικαιοσύνη в объяснении имени-титула
  choice: праведность
  alternative: справедливость
  rationale: Оба значения лексически возможны. Основной текст передаёт устойчивое богословское звучание «Царь праведности», а альтернативу сохраняет сноска, не устраняя смысловой диапазон.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Заглавные буквы и кавычки отмечают объясняемые титулы; в словах «царь Салима» слово «царь» оставлено со строчной буквы как обычное обозначение правителя места.
