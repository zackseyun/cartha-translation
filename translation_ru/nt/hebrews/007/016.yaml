  text: ὃς οὐ κατὰ νόμον ἐντολῆς ⸀σαρκίνης γέγονεν ἀλλὰ κατὰ δύναμιν ζωῆς ἀκαταλύτου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/016.yaml
  text: who has become such not according to a law of a fleshly commandment[a], but according to the power of an indestructible life[c][b],
translation:
  language: ru
  text: который стал священником не по закону телесной заповеди[a], а по силе неразрушимой жизни[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по закону плотской заповеди»; возможный смысл: «по закону, основанному на физическом требовании».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «бесконечной жизни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: который
  rationale: Относительное местоимение сохраняет синтаксическую связь с лицом, упомянутым в предыдущем стихе.
- source_word: κατὰ νόμον
  choice: по закону
  rationale: κατά с винительным выражает норму или основание. В русском отсутствие артикля не требует неопределённой формы; «по закону» естественно и не отождествляет его прямо со всем Моисеевым законом.
- source_word: ἐντολῆς σαρκίνης
  choice: плотской заповеди
  rationale: Сохраняется образ σάρξ и родительная связь с νόμον. «Плотской» здесь указывает на телесное, внешнее и связанное с происхождением установление, а не на нравственную греховность.
- source_word: γέγονεν
  choice: стал священником
  rationale: Перфект обозначает возникшее и сохраняющееся состояние. Слово «священником» восполняет ясный из контекста эллиптический предикат и делает русский текст понятным.
- source_word: ἀλλὰ κατὰ δύναμιν
  choice: а по силе
  rationale: Сохраняет параллель и противопоставление двух оборотов с κατά, оставаясь естественным по-русски.
- source_word: ζωῆς ἀκαταλύτου
  choice: неразрушимой жизни
  rationale: ἀκατάλυτος означает то, что невозможно разрушить, упразднить или прекратить; «неразрушимой» передаёт больше, чем только бесконечную длительность.
theological_decisions:
- issue: Значение σαρκίνης в противопоставлении ἀκαταλύτου
  choice: «плотской» в телесном, внешнем и родословном смысле
  alternative: «телесной» или «относящейся к физическому требованию»
  rationale: Контекст противопоставляет внешнее установление, связанное со смертной плотью и происхождением, силе неразрушимой жизни. Нравственный смысл «греховной» текстом не выражен.
- issue: Передача ἀκαταλύτου
  choice: «неразрушимой»
  alternative: «бесконечной»
  rationale: Основной вариант сохраняет значение невозможности разрушения или прекращения, не сводя выражение лишь к продолжительности.
- issue: Восполнение эллипсиса при γέγονεν
  choice: «стал священником»
  alternative: «стал таковым»
  rationale: Предыдущий контекст однозначно говорит о священстве; восполнение обеспечивает естественный русский синтаксис, не определяя дополнительно характер этого священства.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Конструкция краткая и сохраняет антитезу «не по… а по…». «Плотской» оставлено ради исходного образа, а примечание предотвращает ошибочное нравственное прочтение.
