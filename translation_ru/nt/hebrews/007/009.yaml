lexical_decisions:
- source_word: ὡς ἔπος εἰπεῖν
  choice: так сказать
  rationale: 'Устойчивое современное русское выражение, естественно передающее риторическую оговорку автора: последующее утверждение верно в особом, опосредованном смысле.'
- source_word: δι’ Ἀβραὰμ
  choice: через Авраама
  rationale: 'Предлог διά с родительным падежом выражает посредство: действие Левия рассматривается как совершённое через его предка Авраама, без уточнения механизма такого представительства.'
- source_word: καὶ Λευὶ
  choice: даже Левий
  rationale: 'καί имеет здесь усилительное значение и подчёркивает неожиданный вывод рассуждения: десятину отдал даже тот Левий, чьи потомки получают десятины.'
- source_word: ὁ δεκάτας λαμβάνων
  choice: получающий десятины
  rationale: Субстантивированное причастие настоящего времени характеризует Левия через постоянную функцию связанного с ним священнического порядка. Настоящее время и множественное число сохранены.
- source_word: δεκάτας
  choice: десятины
  rationale: «Десятина» — общепринятый и точный русский термин для культового приношения десятой части.
- source_word: δεδεκάτωται
  choice: сам отдал десятину
  rationale: 'Естественная русская передача смысла греческого перфекта: Левий рассматривается как уже уплативший десятину через Авраама. «Сам» подчёркивает контраст с его ролью получателя; необычная пассивная форма оригинала отмечена в сноске.'
theological_decisions:
- issue: Представительное участие Левия в поступке Авраама
  choice: Сохранено опосредованное утверждение, что Левий отдал десятину через Авраама, с авторской оговоркой «так сказать».
  alternative: Разъяснить, что Левий буквально находился в Аврааме либо что речь идёт только о фигуральном высказывании.
  rationale: Текст использует родственную связь Левия с Авраамом в аргументе о превосходстве Мелхиседека, но не определяет точный богословский механизм такого участия. Перевод сохраняет эту напряжённость и не превращает её ни в буквальную онтологию, ни в простую метафору.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис следует ходу греческого рассуждения, но остаётся понятным на слух. Формулировка «отдал десятину» предпочтена неестественному русскому пассиву; формальная особенность оригинала сохранена в сноске.
