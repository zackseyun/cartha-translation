  text: Beyond all dispute[a], the lesser is blessed by the greater.
translation:
  language: ru
  text: 'И бесспорно: меньшего благословляет больший.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «без всякого спора»; или: «без всякого возражения»; или: «без всякого противоречия».'
    reason: Лексическая альтернатива для ἀντιλογία, которое может обозначать спор, возражение или противоречие.
lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: И, без всякого сомнения
  rationale: Оборот выражает отсутствие спора или возражения и вводит положение как бесспорное. «Без всякого сомнения» естественно звучит по-русски; δέ передано мягким связующим «и», отмечающим продолжение рассуждения без усиленного противопоставления.
- source_word: τὸ ἔλαττον
  choice: меньший
  rationale: Субстантивированная сравнительная форма обозначает того, кто ниже по положению. «Меньший» сохраняет сравнительный характер и не вносит идеи нравственной неполноценности.
- source_word: ὑπὸ τοῦ κρείττονος
  choice: большим
  rationale: ὑπό с родительным указывает на действующее лицо при пассивном глаголе. «Больший» здесь обозначает более высокое положение или достоинство и естественно образует пару с «меньший».
- source_word: εὐλογεῖται
  choice: благословляется
  rationale: 'Настоящее время пассивного залога выражает общее положение: меньший принимает благословение от большего. Глагол прямо сохраняет религиозный смысл контекста.'
theological_decisions:
- issue: Характер сопоставления «меньшего» и «большего»
  choice: 'Сохранено общее положение о статусе: меньший благословляется большим.'
  alternative: Понимать это лишь как общественный обычай, не имеющий богословского значения.
  rationale: В контексте Евр 7 это положение служит доводом о превосходстве Мелхиседека над Авраамом. Перевод сохраняет сравнительные обозначения, не добавляя к ним толкования.
translation_notes:
  register: Современный литературный русский язык, краткий и торжественно-нейтральный. Синтаксический параллелизм «меньший — большим» сохраняет афористичность исходного утверждения.
