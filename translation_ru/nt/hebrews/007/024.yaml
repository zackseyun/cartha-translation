base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/024.yaml
  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: ru
  text: А Он, поскольку пребывает вечно, имеет непреходящее священство.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «имеет неизменное священство»; возможно также: «имеет священство, не переходящее к другому». Греческое прилагательное допускает оба оттенка. В данном контексте мысль в том, что, поскольку Он живёт вечно, Его священство не переходит к преемнику.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: А Он
  rationale: Субстантивированное ὁ указывает на Иисуса и противопоставляет Его множеству прежних священников; δέ передано естественным для русского контекста противительным союзом «а».
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: поскольку пребывает
  rationale: διά с субстантивированным инфинитивом выражает причину. «Пребывает» сохраняет длительный смысл μένω и соответствует возвышенному, но понятному библейскому регистру.
- source_word: εἰς τὸν αἰῶνα
  choice: вечно
  rationale: Устойчивое выражение обозначает неограниченную длительность; «вечно» естественно и точно передаёт временной смысл.
- source_word: ἀπαράβατον
  choice: непреходящее
  rationale: В контексте слово указывает на священство, которое не прекращается и не переходит к преемнику. «Непреходящее» передаёт постоянство, не сводя многозначность исключительно к неизменности или непередаваемости.
- source_word: ἔχει τὴν ἱερωσύνην
  choice: имеет … священство
  rationale: Прямое и естественное соответствие выражению обладания священническим служением; более буквальное «имеет» не добавляет отсутствующего в греческом оттенка официального занятия должности.
- source_word: ἱερωσύνην
  choice: священство
  rationale: Стандартное русское обозначение священнического сана или служения, уместное в аргументации Послания к евреям.
theological_decisions:
- issue: Значение ἀπαράβατον применительно к священству Христа
  choice: «непреходящее священство» — оно остаётся за Ним и не прекращается, поскольку Он живёт вечно
  alternative: «неизменное священство» или «непередаваемое священство»
  rationale: Греческое прилагательное допускает оттенки неизменности и непереходности к другому. Контекст противопоставляет Христа смертным священникам, которых сменяли преемники; основной текст передаёт постоянство, а примечание сохраняет подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Заглавное «Он» принято как уважительное контекстуальное оформление, а не как грамматическое требование греческого текста. Формулировка остаётся понятной широкому читателю и сохраняет смысловую неоднозначность ἀπαράβατον в примечании.
