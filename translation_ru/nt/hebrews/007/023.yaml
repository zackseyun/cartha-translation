lexical_decisions:
- source_word: Καὶ οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς
  choice: И тех священников было много
  rationale: Оборот указывает на многочисленность прежних священников и готовит противопоставление единственному, непреходящему священству Иисуса в следующем стихе. Частица μέν передана контекстуально указательным «тех» и самой незавершённостью противопоставления; более буквальное воспроизведение совершенного причастия по-русски звучало бы неестественно.
- source_word: διὰ τὸ θανάτῳ κωλύεσθαι
  choice: потому что смерть не позволяла им
  rationale: διά с субстантивированным инфинитивом выражает причину, а θανάτῳ обозначает средство или действующую причину препятствия. Активная русская конструкция естественно передаёт смысл греческого пассива.
- source_word: παραμένειν
  choice: оставаться в служении
  rationale: Сам глагол означает «оставаться, продолжать пребывать»; в данном контексте подразумевается продолжение священнического служения. Дополнение делает подразумеваемый смысл ясным и отмечено сноской.
- source_word: Καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет связь с предшествующим рассуждением.
theological_decisions:
- issue: Характер противопоставления прежних священников и священства Иисуса
  choice: Подчёркнута многочисленность прежних священников, обусловленная их смертностью, без прямого добавления слова «левитских».
  alternative: Назвать их в основном тексте «левитскими священниками».
  rationale: Хотя контекст указывает на левитское священство, в самом греческом тексте этого стиха определение «левитские» отсутствует; его добавление сделало бы перевод более толковательным.
translation_notes:
  register: Современный литературный русский язык; ясная, сдержанная и достойная формулировка. Запятая в конце сохранена, поскольку стих синтаксически продолжается в следующем стихе.
