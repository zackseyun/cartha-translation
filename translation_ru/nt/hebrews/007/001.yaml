id: HEB.7.1
reference: Hebrews 7:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οὗτος γὰρ ὁ Μελχισέδεκ, βασιλεὺς Σαλήμ, ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου, ⸀ὁ συναντήσας Ἀβραὰμ ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων καὶ εὐλογήσας αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/001.yaml
  text: For this Melchizedek[a], king of Salem, priest of God Most High, met Abraham as he was returning from the slaughter of the kings and blessed him[b],
translation:
  language: ru
  text: Ведь этот Мелхиседек, царь Салима, священник Бога Всевышнего, встретил Авраама, возвращавшегося после разгрома царей,[a] и благословил его,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после поражения царей». Буквально: «после избиения царей».'
    reason: Лексема κοπή может обозначать поражение или избиение; примечание сохраняет более буквальный оттенок, не добавляя невыраженных в греческом тексте деталей.
lexical_decisions:
- source_word: Οὗτος γὰρ
  choice: Ведь этот
  rationale: «Ведь» передаёт пояснительную связь γάρ с предшествующим рассуждением, а «этот» сохраняет указательное значение οὗτος.
- source_word: Μελχισέδεκ
  choice: Мелхиседек
  rationale: Традиционная русская библейская передача имени, сохраняющая узнаваемую связь с Быт 14.
- source_word: βασιλεὺς Σαλήμ
  choice: царь Салима
  rationale: Естественная русская конструкция и традиционная передача топонима Салим.
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: священник Бога Всевышнего
  rationale: Сохраняет порядок и титульный характер греческого выражения; по-русски звучит естественно и торжественно.
- source_word: ὁ συναντήσας
  choice: встретил
  rationale: Причастная конструкция преобразована в личную форму для ясного современного русского синтаксиса; значение действия сохранено.
- source_word: Ἀβραὰμ ὑποστρέφοντι
  choice: Авраама, возвращавшегося
  rationale: Причастие настоящего времени обозначает действие Авраама, происходившее в момент встречи; русское причастие сохраняет эту одновременность.
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: после разгрома царей
  rationale: В военном контексте κοπή обозначает поражение и истребление противника. «Разгром» естественен по-русски и не утверждает, что все цари лично были убиты; буквальный вариант отмечен в сноске.
- source_word: καὶ εὐλογήσας αὐτόν
  choice: и благословил его
  rationale: Передаёт второе координированное действие Мелхиседека простой и точной русской формой.
theological_decisions:
- issue: Передача божественного титула τοῦ θεοῦ τοῦ ὑψίστου
  choice: Бога Всевышнего
  alternative: Всевышнего Бога
  rationale: Оба варианта грамматически возможны и богословски равнозначны; выбранный вариант ближе к порядку греческих слов и сохраняет «Всевышний» как титул Бога.
- issue: Смысл выражения κοπὴ τῶν βασιλέων
  choice: разгром царей
  alternative: избиение царей
  rationale: Родительный падеж допускает понимание царей как предводителей побеждённых сил, а повествование Быт 14 не требует вывода, что Авраам убил самих царей. Более буквальная и жесткая передача сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён до ясного личного предложения, при этом сохранены пояснительная связь с предыдущим контекстом, титулы Мелхиседека и незавершённость фразы, продолжающейся в следующем стихе.
