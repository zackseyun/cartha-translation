  language: en
  yaml_path: translation/nt/hebrews/007/010.yaml
  text: For he was still in the loins of his father when Melchizedek met him[a].
translation:
  language: ru
  text: Ведь он был ещё в чреслах своего праотца[a], когда Мелхиседек встретил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в чреслах отца». Это образное выражение означает, что Левий происходил от своего предка.'
    reason: Лексическое пояснение древнего образного выражения и контекстуального родового значения слова «отец».
lexical_decisions:
- source_word: ἔτι
  choice: ещё
  rationale: Передаёт продолжавшееся к моменту встречи состояние и естественно звучит по-русски.
- source_word: γὰρ
  choice: ведь
  rationale: Сохраняет пояснительную связь с предыдущим стихом; в данном контексте звучит естественнее буквального «ибо».
- source_word: ἐν τῇ ὀσφύϊ
  choice: в чреслах
  rationale: Сохраняет конкретный образ греческого текста и его указание на происхождение от предка; значение пояснено в сноске.
- source_word: τοῦ πατρὸς
  choice: своего отца
  rationale: Возвратное притяжательное местоимение ясно связывает «отца» с субъектом; здесь «отец» употреблён в широком родовом смысле и относится к Аврааму.
- source_word: ἦν
  choice: был
  rationale: Прямая и естественная передача имперфекта глагола «быть».
- source_word: ὅτε
  choice: когда
  rationale: Обычная передача временного союза.
- source_word: συνήντησεν
  choice: встретил
  rationale: Кратко и точно передаёт совершившуюся встречу, отсылающую к повествованию Бытия.
- source_word: αὐτῷ
  choice: его
  rationale: Сохраняет местоимение оригинала; из контекста ясно, что речь идёт об Аврааме.
- source_word: Μελχισέδεκ
  choice: Мелхиседек
  rationale: Использована устоявшаяся русская форма библейского имени.
theological_decisions:
- issue: Образное представление происхождения Левия от Авраама
  choice: Сохранить в основном тексте конкретное выражение «в чреслах своего отца»
  alternative: «в теле своего предка» или «в семени своего предка»
  rationale: Автор строит довод на том, что Левий в родовом смысле уже находился в Аврааме. Сохранение образа делает ход рассуждения видимым и не подменяет его богословским истолкованием.
- issue: Кого обозначает «отец»
  choice: Передать τοῦ πατρὸς как «своего отца», не вставляя имя Авраама
  alternative: «своего предка Авраама»
  rationale: Хотя по контексту имеется в виду Авраам, греческий текст сохраняет более общее обозначение «отец»; перевод не добавляет отсутствующего в оригинале имени.
translation_notes:
  register: Современный литературный русский язык с сохранением одного традиционного библейского образа — «в чреслах». Частица «ведь» естественно передаёт пояснительный характер стиха. Сноска делает архаичный образ понятным обычному современному читателю.
