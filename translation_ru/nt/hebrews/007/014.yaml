  text: πρόδηλον γὰρ ὅτι ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν, εἰς ἣν φυλὴν ⸂περὶ ἱερέων οὐδὲν⸃ Μωϋσῆς ἐλάλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: ru
  text: Ведь очевидно, что наш Господь произошёл из Иуды[a], о котором Моисей ничего не говорил относительно священников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен также перевод: «возник из Иуды» или «произрос из Иуды». Греческий глагол вызывает образ восхода или произрастания; здесь он обозначает происхождение из племени Иуды, а не прежде всего воскресение.'
    reason: 'Лексическая альтернатива: передаёт образный оттенок ἀνατέταλκεν и предотвращает ошибочное понимание глагола как прямой ссылки на воскресение.'
lexical_decisions:
- source_word: πρόδηλον
  choice: очевидно
  rationale: Передаёт предикативное прилагательное как утверждение явно установленного факта и естественно звучит в современном русском языке.
- source_word: γὰρ
  choice: ведь
  rationale: Сохраняет пояснительную связь с предшествующим рассуждением; в данном контексте естественнее буквального «ибо».
- source_word: ἐξ Ἰούδα
  choice: из Иуды
  rationale: Предлог обозначает происхождение. Упоминание племени в следующей части стиха устраняет необходимость добавлять его здесь.
- source_word: ἀνατέταλκεν
  choice: произошёл
  rationale: В контексте речь идёт о племенном происхождении Господа. Основной текст передаёт этот смысл естественно, а образ восхождения или произрастания сохраняется в сноске как подлинная лексическая особенность глагола.
- source_word: ὁ κύριος ἡμῶν
  choice: наш Господь
  rationale: Естественно передаёт титул и притяжательное местоимение, не добавляя имени Иисуса, которого определяет контекст.
- source_word: εἰς ἣν φυλήν
  choice: об этом племени
  rationale: Идиоматически связывает относительное предложение с уже названным Иудой и передаёт предмет последующего высказывания Моисея.
- source_word: περὶ ἱερέων οὐδὲν
  choice: ничего не говорил относительно священников
  rationale: Сохраняет конкретное множественное число «священников», не заменяя его более абстрактным «священством».
- source_word: Μωϋσῆς ἐλάλησεν
  choice: Моисей ... не говорил
  rationale: Прямой и естественный эквивалент λαλέω с учётом отрицательной конструкции.
theological_decisions:
- issue: Кого обозначает выражение «наш Господь»
  choice: Сохранён титул «наш Господь» без добавления имени; в контексте он относится к Иисусу.
  alternative: «наш Господь Иисус»
  rationale: Контекст ясно устанавливает референта, но имя в греческом тексте этого стиха отсутствует, поэтому его добавление было бы излишним толкованием.
- issue: Смысл ἀνατέταλκεν
  choice: В основном тексте передано происхождение из Иуды; образный оттенок глагола отмечен в сноске.
  alternative: «восстал из Иуды» или «произрос из Иуды»
  rationale: Рассуждение касается племенного происхождения и основания священства, а не прежде всего воскресения. При этом метафорический образ греческого глагола не скрыт, а вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Ведь» сохраняет логическую связь без архаичного «ибо»; «относительно священников» точно передаёт предмет высказывания и сохраняет конкретность греческого множественного числа.
