    rationale: διὰ τοῦ λέγοντος πρὸς αὐτόν указывает на Того, чьим высказыванием дана клятва. В русском «через Того» здесь воспринимается как неудачное обозначение посредника. «С клятвой от Того, кто сказал ему» ясно передаёт связь клятвы с божественным говорящим.
  - severity: low
