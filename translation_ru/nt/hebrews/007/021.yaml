  text: ὁ δὲ μετὰ ὁρκωμοσίας διὰ τοῦ λέγοντος πρὸς αὐτόν· Ὤμοσεν κύριος, καὶ οὐ μεταμεληθήσεται, Σὺ ἱερεὺς εἰς τὸν ⸀αἰῶνα),
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/021.yaml
  text: but this one became a priest with an oath through the one who said to him[a], “The Lord has sworn and will not change his mind, ‘You are a priest forever.’”
translation:
  language: ru
  text: 'А этот стал священником с клятвой от Того, кто сказал ему: «Поклялся[a] Господь и не изменит Своего решения: Ты — священник навеки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь дал клятву». Греческий аорист Ὤμοσεν может передаваться как простым прошедшим временем («поклялся») или формулировкой, подчёркивающей совершившийся акт клятвы.'
    reason: Лексико-грамматическая альтернатива для Ὤμοσεν; сноска привязана к соответствующему слову цитаты.
lexical_decisions:
- source_word: ὁ δὲ
  choice: а Этот
  rationale: Сохраняет выраженное артиклем и δέ противопоставление прежним священникам из предыдущего стиха; прописная буква указывает на конкретного Лица в данном контексте, не добавляя имени в текст.
- source_word: μετὰ ὁρκωμοσίας
  choice: с клятвой
  rationale: Естественно передаёт сопутствующее обстоятельство и сохраняет контраст со священниками, поставленными без клятвы.
- source_word: διὰ τοῦ λέγοντος πρὸς αὐτόν
  choice: через Того, Кто сказал Ему
  rationale: Передаёт διά с родительным как посредство или действие через говорящего и сохраняет несколько необычную формулировку греческого текста.
- source_word: Ὤμοσεν κύριος
  choice: Поклялся Господь
  rationale: Русский совершенный вид естественно передаёт греческий аорист и торжественный характер цитаты из Псалма 109:4 по нумерации Септуагинты.
- source_word: οὐ μεταμεληθήσεται
  choice: не изменит Своего решения
  rationale: В контексте клятвы речь идёт об отсутствии отмены или перемены объявленного намерения, а не о нравственном покаянии.
- source_word: Σὺ ἱερεὺς
  choice: Ты — священник
  rationale: Глагол-связка, отсутствующий в греческом, естественно выражен в русском именным предложением с тире.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Устойчиво и естественно передаёт неограниченную продолжительность священства.
theological_decisions:
- issue: Божественная клятва и постоянство священства адресата Псалма 109:4
  choice: Перевод подчёркивает, что этот священник поставлен с клятвой Господа и остаётся священником навеки.
  alternative: 'Можно формальнее сохранить эллипсис: «а Этот — с клятвой», не повторяя «стал священником».'
  rationale: Добавление «стал священником» явно восстанавливает сказуемое из контекста стихов 20–21, не вводя более поздней богословской терминологии; постоянство священства прямо выражено словами εἰς τὸν αἰῶνα.
- issue: Значение οὐ μεταμεληθήσεται применительно к Господу
  choice: не изменит Своего решения
  alternative: не передумает; не раскается
  rationale: Выбранная формулировка сохраняет неизменность торжественно объявленного намерения и не создаёт впечатления, будто речь идёт о покаянии в грехе.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Эллипсис раскрыт словами «стал священником» ради ясности. Местоимения, относящиеся к Богу и адресату цитаты, написаны с прописной буквы как стилистический сигнал в данном фрагменте; это не меняет содержания исходного текста.
