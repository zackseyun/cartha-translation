base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/006.yaml
  text: But the one who is not traced by genealogy from them has taken a tenth from Abraham and has blessed the one who had the promises[a][b].
translation:
  language: ru
  text: Но тот, чьё происхождение не прослеживается по родословию от них, получил десятину от Авраама[a] и благословил того, кто имел обетования[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взял десятую часть у Авраама». Греческий глагол может означать взять или получить десятую часть.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «того, кто имеет обетования». В греческом стоит причастие настоящего времени; в русском рассказе об Аврааме естественно прошедшее время.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν
  choice: Но тот, кто по родословию не происходит от них
  rationale: Передаёт противопоставление Мелхиседека потомкам Левия и сохраняет акцент на родословной, не делая выводов о природе или происхождении Мелхиседека сверх сказанного в контексте.
- source_word: δεδεκάτωκεν Ἀβραάμ
  choice: получил десятину от Авраама
  rationale: Глагол обозначает получение или взимание десятой части. «Получил десятину» ясно показывает, что Авраам дал её Мелхиседеку; греческий перфект в русском повествовании естественно передан прошедшим временем.
- source_word: τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: того, кто имел обещания
  rationale: Сохранены множественное число и смысл обладания данными Аврааму обещаниями. Прошедшее время естественно для русского повествования, тогда как примечание отмечает форму настоящего времени в греческом.
- source_word: εὐλόγηκεν
  choice: благословил
  rationale: Обычный и точный русский эквивалент; прошедшее совершенного вида передаёт завершённое действие, значимое для рассуждения автора.
theological_decisions:
- issue: Родословное отношение Мелхиседека к левитскому священству
  choice: Фраза означает, что Мелхиседек не происходит по родословной от упомянутых потомков Левия.
  alternative: Можно перевести как «не числится в их родословии», подчеркнув родословную регистрацию.
  rationale: Контекст обсуждает право на священство и получение десятины вне левитской родословной; перевод не превращает это в метафизическое утверждение о Мелхиседеке.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-торжественное. Термин «десятина» сохранён как общеупотребительное библейское слово, а необычная греческая конструкция о родословии передана естественно без устранения её смыслового акцента.
