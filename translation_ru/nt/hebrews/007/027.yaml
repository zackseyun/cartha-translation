source:
  edition: SBLGNT
  text: ὃς οὐκ ἔχει καθ’ ἡμέραν ἀνάγκην, ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ (τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: ru
  text: которому не нужно изо дня в день, подобно первосвященникам, приносить жертвы — сначала за свои грехи, а затем за грехи народа, — ведь это он сделал раз и навсегда[a], принеся в жертву самого себя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «однажды».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «когда принёс в жертву самого себя»; возможен также смысл: «тем, что принёс в жертву самого себя».'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: изо дня в день
  rationale: Передаёт повторяющийся ежедневный характер действия и естественно звучит по-русски.
- source_word: ἀνάγκην
  choice: не нужно
  rationale: Конструкция οὐκ ἔχει ... ἀνάγκην естественно передаётся современной русской конструкцией «не нужно», без излишней канцелярской тяжеловесности.
- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: подобно первосвященникам
  rationale: Сохраняет сравнение и множественное число греческого текста.
- source_word: πρότερον ... ἔπειτα
  choice: сначала ... а затем
  rationale: Ясно передаёт последовательность жертвоприношений.
- source_word: ὑπὲρ τῶν ἰδίων ἁμαρτιῶν
  choice: за свои грехи
  rationale: В контексте жертвы ὑπέρ естественно означает «за»; это краткая и привычная русская формулировка.
- source_word: θυσίας ἀναφέρειν
  choice: приносить жертвы
  rationale: Стандартно и точно передаёт культовое значение сочетания, не перегружая русский текст.
- source_word: τῶν τοῦ λαοῦ
  choice: за грехи народа
  rationale: Русский текст восполняет подразумеваемое существительное «грехи», поскольку буквальная эллиптическая конструкция «а затем за [грехи] народа» звучала бы неестественно.
- source_word: τοῦτο γὰρ ἐποίησεν
  choice: ведь это Он совершил
  rationale: Сохраняет указательное «это» и причинно-пояснительную связь γάρ; заглавная буква в «Он» служит русской издательской ясности в отношении референта.
- source_word: ἐφάπαξ
  choice: раз и навсегда
  rationale: Передаёт как однократность, так и окончательный, неповторимый характер действия.
- source_word: ἑαυτὸν ἀνενέγκας
  choice: принеся в жертву самого себя
  rationale: Деепричастный оборот сохраняет обстоятельственную неоднозначность аористного причастия, а выражение «в жертву» явно передаёт культовый смысл ἀναφέρω.
theological_decisions:
- issue: Объём указания «это» в пояснительной части
  choice: Формулировка «это Он совершил» сохраняет широкий анафорический характер τοῦτο, но благодаря контрасту и упоминанию самопожертвования не приписывает Христу принесение жертвы за собственные грехи.
  alternative: Понимать «это» исключительно как принесение жертвы за грехи народа.
  rationale: Греческое τοῦτο допускает отсылку к описанному священническому действию в целом, тогда как ближайший контекст противопоставляет безгрешного Сына прочим первосвященникам. Перевод не должен ни создавать ложного впечатления о Его греховности, ни чрезмерно сужать референцию.
- issue: Характер самоприношения Христа
  choice: «принеся в жертву самого себя»
  alternative: «принеся самого себя» или «отдав самого себя»
  rationale: Выбранная формулировка сохраняет священнический и жертвенный смысл, центральный для аргумента Послания к Евреям, не сводя выражение к общему самопожертвованию.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Синтаксис сохраняет длинное сопоставление оригинала, но тире помогают ясно отделить последовательность жертв от пояснения. Эллипсис τῶν τοῦ λαοῦ раскрыт ради естественности русского языка.
