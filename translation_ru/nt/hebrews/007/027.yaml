  source_fidelity: 'Основной текст в целом точно передаёт греческий синтаксис и смысл: καθημερινая необходимость, сопоставление с первосвященниками, последовательность «сначала ... затем», а также однократное самоприношение сохранены. «За грехи народа» правомерно раскрывает эллипсис τῶν τοῦ λαοῦ. Формулировка «это он сделал» оставляет указание τοῦτο достаточно широким и не утверждает, будто Христос приносил жертву за собственные грехи.'
