    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος
  choice: без отца, без матери, без родословия
  rationale: Сохраняется торжественная трёхчастная структура греческого текста. Сноска поясняет, что в контексте речь идёт об отсутствии родословной записи о Мелхиседеке, не устраняя буквальную выразительность формулировки.
- source_word: μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων
  choice: не имеющий ни начала дней, ни конца жизни
  rationale: Близко передаёт параллельную конструкцию с двойным отрицанием и сохраняет возвышенный стиль оригинала.
- source_word: ἀφωμοιωμένος
  choice: уподобленный
  rationale: Передаёт страдательное значение перфектного причастия и выражает подобие Сыну, а не тождество с Ним.
- source_word: τῷ υἱῷ τοῦ θεοῦ
  choice: Сыну Божьему
  rationale: Естественная для современного литературного русского передача христологического титула.
- source_word: μένει ἱερεὺς
  choice: остаётся священником
  rationale: Настоящее время μένει обозначает продолжающееся состояние; «остаётся» естественно передаёт этот смысл.
- source_word: εἰς τὸ διηνεκές
  choice: навсегда
  rationale: Кратко и естественно выражает непрерывный, непреходящий характер священства; сноска отмечает возможный оттенок «непрестанно, на всё время».
theological_decisions:
- issue: Описывает ли стих Мелхиседека как буквально не имеющего родителей и вечного или использует молчание повествования Бытия типологически
  choice: Сохранить прямые определения текста, пояснив в сноске их вероятную связь с отсутствием родословной записи в Бытии.
  alternative: Передать непосредственно как «без записанного отца, без записанной матери» или истолковать Мелхиседека как предвечное явление Сына.
  rationale: Греческий текст формулирует определения прямо, а ἀφωμοιωμένος указывает на уподобление Сыну, не на тождество. Перевод сохраняет напряжение текста и не навязывает метафизического или конфессионального вывода.
- issue: Степень абсолютности εἰς τὸ διηνεκές
  choice: «навсегда» в основном тексте с пояснением длительного, непрерывного смысла в сноске.
  alternative: «непрестанно» или «на всё время».
  rationale: Выражение подчёркивает непреходящий характер священства в аргументации Послания; сноска сохраняет диапазон значения и не сужает его до одной догматической трактовки.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным синтаксисом. Порядок определений и параллелизм греческого текста сохранены; «уподобленный» избрано ради точной передачи пассивного значения и типологической связи.
