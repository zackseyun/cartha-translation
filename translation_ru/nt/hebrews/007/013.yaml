source:
  edition: SBLGNT
  text: ἐφ’ ὃν γὰρ λέγεται ταῦτα φυλῆς ἑτέρας μετέσχηκεν, ἀφ’ ἧς οὐδεὶς προσέσχηκεν τῷ θυσιαστηρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/013.yaml
  text: For the one about whom these things are said belongs to another tribe[b][a], from which no one has served at the altar.
translation:
  language: ru
  text: Ведь тот, о ком говорится всё это, принадлежит к другому колену[a], из которого никто не служил у жертвенника[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «связан с другим коленом», «происходит из другого колена». Греческий глагол может обозначать участие или принадлежность; здесь речь идёт о принадлежности к колену.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «находился при жертвеннике». Греческое выражение обозначает пребывание и служение при жертвеннике.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ ὃν
  choice: о ком
  rationale: Сочетание ἐπί с винительным при λέγεται выражает отнесённость высказывания к определённому лицу; «о ком» естественно передаёт этот смысл.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит обоснование предыдущего утверждения; «ведь» сохраняет пояснительную связь и естественно звучит по-русски.
- source_word: λέγεται ταῦτα
  choice: говорится всё это
  rationale: Сохранены настоящее время, страдательное значение и множественное указательное местоимение; «всё это» идиоматично объединяет упомянутые утверждения.
- source_word: φυλῆς ἑτέρας
  choice: к другому колену
  rationale: В контексте φυλή обозначает одно из колен Израиля, а ἑτέρας указывает на колено, отличное от священнического колена, о котором шла речь.
- source_word: μετέσχηκεν
  choice: принадлежит
  rationale: Перфект выражает установившуюся и значимую для настоящего принадлежность. Здесь речь идёт не об эпизодическом участии, а о принадлежности к колену.
- source_word: ἀφ’ ἧς
  choice: из которого
  rationale: Относительное местоимение относится к «колену» и указывает на происхождение членов этого колена.
- source_word: οὐδεὶς
  choice: никто
  rationale: Прямой и естественный русский эквивалент отрицательного местоимения.
- source_word: προσέσχηκεν τῷ θυσιαστηρίῳ
  choice: не служил у жертвенника
  rationale: В культовом контексте προσέχω обозначает пребывание при жертвеннике и связанное с ним служение. Формулировка не уточняет сверх текста конкретные священнические действия.
- source_word: θυσιαστηρίῳ
  choice: жертвенника
  rationale: «Жертвенник» — традиционный и понятный русский эквивалент для места принесения жертв.
theological_decisions:
- issue: Связь Иисуса с иным, не левитским коленом в рассуждении о священстве
  choice: Передать принадлежность к другому колену, не добавляя прямого утверждения о происхождении или родословной.
  alternative: «происходит из другого колена»
  rationale: Греческий глагол μετέχω здесь указывает на участие или принадлежность. Контекст подразумевает родовую связь, однако сам стих формулирует её как принадлежность к колену, поэтому более толковательный вариант не внесён в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Колено» и «жертвенник» сохранены как понятные контекстуальные термины. Местоимения, относящиеся к Иисусу, не выделены прописными буквами, поскольку такое написание отсутствует в греческом тексте и относится к редакционной конфессиональной традиции.
