revisions:
- from: Итак, если бы совершенство достигалось через левитское священство — ведь на его основании народ получил Закон, — то какая ещё была нужда восстать иному священнику по чину Мелхиседека, а не называться священником по чину Аарона?[a][b]
  to: Итак, если бы совершенство достигалось через левитское священство — ведь на его основании народ получил Закон, — то какая ещё была бы нужда в том, чтобы появился иной священник по чину Мелхиседека, а не назывался священником по чину Аарона?[a][b]
  rationale: Правка ограничена устранением неестественного и потенциально двусмысленного «восстать иному священнику» и согласованием русской условной конструкции. «Появился» передаёт контекстуальное значение ἀνίστασθαι — появиться, выступить как священник, — не превращая его в утверждение о воскресении. Сноска b обновлена, чтобы её формулировка соответствовала исправленной синтаксической модели.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:50:35Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: сохранены условный риторический вопрос, связь Закона с левитским священством, противопоставление чина Мелхиседека чину Аарона и термин «совершенство». Однако «восстать иному священнику» в современном русском может означать бунт или сопротивление и неестественно управляется дательным падежом; для ἀνίστασθαι здесь требуется нейтральное «появился» (или «восстал» только в более архаичном регистре).'
  naturalness: 'Предложение нуждается в небольшой синтаксической правке: «какая ещё была нужда восстать иному священнику» не соответствует современной литературной норме. Конструкция «какая ещё была бы нужда в том, чтобы появился иной священник» естественна, сохраняет риторическую форму и согласует условную конструкцию по-русски.'
  terminology: «Совершенство», «левитское священство», «Закон», «чин Мелхиседека» и «чин Аарона» уместны. Добавленное в основном тексте «священником» при «назывался» — допустимое русское прояснение подразумеваемого статуса и не меняет смысла λέγεσθαι.
  issues:
  - severity: medium
    issue: «восстать иному священнику»
    rationale: Русское «восстать» обычно означает подняться против кого-либо либо, в возвышенно-архаическом употреблении, явиться; в данной конструкции с дательным «иному священнику» оно звучит неестественно и может исказить ἀνίστασθαι. «Появился иной священник» передаёт здесь возникновение/выступление священника без навязывания значения воскресения.
  - severity: low
    issue: Согласование условной конструкции
    rationale: При «если бы ... достигалось» естественнее «какая ещё была бы нужда», а не «какая ещё была нужда». Это не меняет греческой риторической формы, но делает русскую контрфактическую логику яснее.
  revised_text: Итак, если бы совершенство достигалось через левитское священство — ведь на его основании народ получил Закон, — то какая ещё была бы нужда в том, чтобы появился иной священник по чину Мелхиседека, а не назывался священником по чину Аарона?[a][b]
