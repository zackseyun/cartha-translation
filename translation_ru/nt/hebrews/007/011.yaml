id: HEB.7.11
reference: Hebrews 7:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: ru
  text: Итак, если бы совершенство достигалось через левитское священство — ведь на его основании народ получил Закон, — то какая ещё была бы нужда в том, чтобы появился иной священник по чину Мелхиседека, а не назывался священником по чину Аарона?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь при нём народ получил Закон». Греческое выражение допускает более буквальную передачу; речь идёт о связи данного народу Закона с левитским священством.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы появился иной священник в чине Мелхиседека, а не именовался священником в чине Аарона».'
    reason: alternative_reading
lexical_decisions:
- source_word: τελείωσις
  choice: совершенство
  rationale: Сохраняет ёмкое культовое и богословское значение слова в Послании к евреям, не сводя его ни к нравственной безупречности, ни просто к завершению.
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: через левитское священство
  rationale: Передаёт инструментальное значение διά с родительным падежом и естественно звучит по-русски.
- source_word: ἐπ’ αὐτῆς
  choice: на его основании
  rationale: Местоимение наиболее естественно относится к левитскому священству; перевод выражает зависимость законодательного устройства народа от этого священства.
- source_word: νενομοθέτηται
  choice: получил Закон
  rationale: Естественно передаёт совершенную форму со значением состоявшегося наделения законом и сохраняющегося результата.
- source_word: τίς ἔτι χρεία
  choice: какая ещё была нужда
  rationale: Сохраняет форму и риторическую силу вопроса.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: по чину Мелхиседека
  rationale: «Чин» — понятное и укоренившееся русское соответствие τάξις в данном библейском контексте, обозначающее порядок или тип священства.
- source_word: ἕτερον ... ἱερέα
  choice: иному священнику
  rationale: «Иной» позволяет ощутить различие типа священства, которое далее раскрывается противопоставлением Мелхиседека и Аарона.
- source_word: ἀνίστασθαι
  choice: восстать
  rationale: Сохраняет образное и библейское звучание глагола, не утверждая здесь специально воскресение; смысл — появиться или быть воздвигнутым как священник.
- source_word: καὶ οὐ ... λέγεσθαι
  choice: а не называться священником
  rationale: Естественно передаёт противопоставление и значение обозначения или наименования; слово «священником» повторено для ясности русского синтаксиса.
- source_word: Μελχισέδεκ / Ἀαρών
  choice: Мелхиседек / Аарон
  rationale: Использованы традиционные русские формы библейских имён.
theological_decisions:
- issue: Значение τελείωσις в рассуждении о священстве
  choice: совершенство
  alternative: завершение; приведение к совершенству; полный доступ к Богу
  rationale: «Совершенство» сохраняет богословскую насыщенность и позволяет ближайшему и более широкому контексту уточнить, в чём оно состоит.
- issue: Референт αὐτῆς в ἐπ’ αὐτῆς νενομοθέτηται
  choice: левитское священство
  alternative: Закон; всё устройство завета
  rationale: Ближайший подходящий антецедент — «священство»; вставное пояснение связывает законодательное устройство Израиля с левитским священством.
- issue: Значение ἀνίστασθαι
  choice: появление или воздвижение иного священника, выраженное словом «восстать»
  alternative: прямое указание на воскресение
  rationale: В этом вопросе глагол прежде всего обозначает выступление или появление священника; перевод не должен насильно устранять возможный отзвук более широкого значения, но и не должен превращать его в однозначное учение о воскресении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Закон» написан с прописной буквы как обозначение данного Израилю Закона. Сохранены длинный риторический вопрос и вставное пояснение оригинала; «Итак» передаёт выводное οὖν, не добавляя временного значения.
