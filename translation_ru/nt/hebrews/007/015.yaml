  text: Καὶ περισσότερον ἔτι κατάδηλόν ἐστιν, εἰ κατὰ τὴν ὁμοιότητα Μελχισέδεκ ἀνίσταται ἱερεὺς ἕτερος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/015.yaml
  text: And it is even more evident[a], if another priest arises according to the likeness of Melchizedek[b],
translation:
  language: ru
  text: И это ещё более очевидно, если по подобию Мелхиседека появляется другой священник[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иной священник». Слово ἕτερος может подчёркивать отличие, а не только обозначать ещё одного священника.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «по подобию Мелхиседека» перекликается с формулировкой и ходом рассуждения, основанными в этой главе на Псалме 109:4.
    reason: cross_reference
lexical_decisions:
- source_word: περισσότερον ἔτι
  choice: ещё очевиднее
  rationale: Сочетание усиливает уже высказанный довод; сравнительная форма по-русски естественно передаёт нарастание убедительности.
- source_word: κατάδηλόν ἐστιν
  choice: становится очевиднее
  rationale: Κατάδηλος означает «явный, очевидный». Русская конструкция в целом естественно выражает то, что довод обнаруживается с ещё большей ясностью, хотя буквально ἐστιν — «есть».
- source_word: εἰ
  choice: если
  rationale: Сохраняется формально условная частица, хотя в ходе рассуждения условие близко по смыслу к установленному основанию.
- source_word: κατὰ τὴν ὁμοιότητα Μελχισέδεκ
  choice: по подобию Мелхиседека
  rationale: Формулировка близко передаёт греческую предложную конструкцию и сохраняет связь с аргументацией главы на основании Пс 109:4 по русской нумерации.
- source_word: ἀνίσταται
  choice: восстаёт
  rationale: Глагол обозначает появление или выступление священника; «восстаёт» сохраняет образ исходного текста, не уточняя способ его поставления.
- source_word: ἱερεὺς ἕτερος
  choice: иной священник
  rationale: «Иной» естественно передаёт возможный оттенок качественного отличия ἕτερος, важный для противопоставления левитскому священству, не сводя выражение лишь к численному добавлению.
theological_decisions:
- issue: Оттенок ἕτερος применительно к священнику
  choice: иной священник
  alternative: другой священник
  rationale: Контекст говорит о священнике, отличном от левитского порядка и подобном Мелхиседеку. «Иной» сохраняет этот возможный качественный оттенок, но не определяет его догматически.
- issue: Условная или причинная сила εἰ
  choice: если
  alternative: поскольку
  rationale: Формально условный оборот сохранён, чтобы не превращать риторическое условие в явно причинное утверждение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Мелхиседек» дан в принятой русской форме имени. Запятая в конце сохранена, поскольку стих синтаксически продолжается в следующем стихе.
