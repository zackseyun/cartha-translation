id: HEB.7.28
reference: Hebrews 7:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν, ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον υἱόν, εἰς τὸν αἰῶνα τετελειωμένον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: ru
  text: Ведь закон поставляет первосвященниками людей, подверженных слабости, а слово клятвы, данной после закона, поставляет Сына[a], сделанного совершенным навеки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте слово «Сын» стоит без артикля; этим подчёркнуто противопоставление людям, хотя из контекста ясно, что речь идёт об Иисусе.
    reason: Передаёт невыразимую средствами русского артиклевую особенность и сохраняет качественный оттенок υἱόν.
  - marker: b
    text: 'Или: «навеки приведённого к полноте»; это слово может также означать «доведённого до завершения», а в священническом контексте — «посвящённого».'
    reason: Сохраняет страдательный характер τετελειωμένον, его результативное значение и смысловой диапазон в контексте Послания к евреям.
lexical_decisions:
- source_word: νόμος
  choice: закон
  rationale: Речь идёт о Моисеевом законе, в особенности о его установлениях о священстве; строчная буква естественна в современном русском тексте.
- source_word: καθίστησιν
  choice: поставляет
  rationale: В контексте служения означает официальное назначение на должность; «поставляет» сохраняет библейский регистр и одинаково относится к обеим частям противопоставления.
- source_word: ἀνθρώπους
  choice: людей
  rationale: Сохраняет противопоставление смертных людей Сыну; исторически речь идёт о мужчинах-первосвященниках, но русское «людей» точнее передаёт акцент на человеческой природе.
- source_word: ἀρχιερεῖς
  choice: первосвященниками
  rationale: Обычное и точное обозначение носителей высшего священнического служения; множественное число отражает последовательность многих служителей.
- source_word: ἔχοντας ἀσθένειαν
  choice: подверженных слабости
  rationale: Передаёт присущую им человеческую немощь и уязвимость, не сводя ἀσθένεια к физической болезни.
- source_word: ὁ λόγος τῆς ὁρκωμοσίας
  choice: слово клятвы
  rationale: Сохраняет образ Божьего изречения, содержащего клятву, и возвышенный библейский регистр.
- source_word: τῆς μετὰ τὸν νόμον
  choice: данной после закона
  rationale: Уточняет, что после закона была дана клятва, и естественно выражает временную последовательность аргумента.
- source_word: υἱόν
  choice: Сына
  rationale: Русский винительный падеж без артикля не позволяет воспроизвести греческую безартиклевость как английское «a Son»; заглавная буква ясно указывает на Иисуса в контексте.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Кратко и идиоматично передаёт непреходящий характер состояния и служения.
- source_word: τετελειωμένον
  choice: достигшего совершенства
  rationale: Передаёт результативное состояние перфектного пассивного причастия и сохраняет широкий смысл завершённости и полной пригодности, не сводя его только к посвящению.
theological_decisions:
- issue: Безартиклевое υἱόν в противопоставлении ἀνθρώπους
  choice: Сына
  alternative: одного Сына; Сына как такового
  rationale: В русском языке отсутствие артикля нельзя воспроизвести буквально без неестественного или двусмысленного оборота. «Сына» сохраняет христологическую отсылку, а сноска отмечает качественный акцент греческой формы и противопоставление людям.
- issue: Значение τετελειωμένον в священническом богословии Послания к евреям
  choice: достигшего совершенства
  alternative: сделанного совершенным; навеки посвящённого
  rationale: Формулировка сохраняет смысл доведения до предназначенной полноты и результативность формы, не решая однозначно, означает ли слово нравственное совершенство, завершение пути или священническое посвящение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Параллельное «поставляет» сохраняет риторическое противопоставление закона и слова клятвы; синтаксис остаётся ясным для обычного читателя.
