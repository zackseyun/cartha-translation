revisions:
- from: Ведь когда изменяется священство, по необходимости происходит и изменение закона.[a]
  to: Ведь когда изменяется священство, неизбежно происходит и изменение закона[a].
  rationale: Замена «по необходимости» на «неизбежно» точнее передаёт логическую необходимость ἐξ ἀνάγκης и исключает бытовую двусмысленность. Примечание перенесено к слову «закона» и переформулировано как контекстуальное пояснение, поскольку греческий текст не даёт отдельного варианта, который в русском выражался бы одной лишь прописной буквой.
