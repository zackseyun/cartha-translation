  text: μετατιθεμένης γὰρ τῆς ἱερωσύνης ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/012.yaml
  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: ru
  text: Ведь когда изменяется священство, неизбежно происходит и изменение закона[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В контексте речь идёт о Моисеевом Законе, установившем левитское священство.
    reason: Контекстуальное уточнение значения νόμου; основной текст сохраняет более широкую формулировку оригинала.
lexical_decisions:
- source_word: μετατιθεμένης
  choice: когда изменяется
  rationale: Причастие в родительном абсолютном обороте выражает обстоятельство, логически влекущее последующее изменение. «Изменяется» сохраняет широкое значение перехода от одного устройства к другому, не сводя его лишь к административной передаче.
- source_word: ἱερωσύνης
  choice: священство
  rationale: Речь идёт об установлении и служении священства, а не только о должности отдельного священника; «священство» естественно передаёт этот институциональный смысл.
- source_word: ἐξ ἀνάγκης
  choice: по необходимости
  rationale: Выражает логическую неизбежность следствия и сохраняет строгий характер рассуждения Послания к евреям.
- source_word: νόμου
  choice: закона
  rationale: Форма без артикля допускает обобщённое указание на правовой порядок, регулирующий священство, хотя контекст естественно включает Моисеев закон.
- source_word: μετάθεσις
  choice: изменение
  rationale: Существительное однокоренное с μετατιθεμένης; повтор слова «изменение» передаёт намеренный лексический параллелизм оригинала и не усиливает смысл до полной отмены.
- source_word: γίνεται
  choice: происходит
  rationale: Передаёт наступление необходимого следствия естественным современным русским выражением.
- source_word: καὶ
  choice: и
  rationale: Обозначает добавочное, соответствующее изменение закона вслед за изменением священства.
- source_word: γὰρ
  choice: ведь
  rationale: Связывает стих с предыдущим рассуждением как его обоснование; «ведь» естественно и ясно выражает пояснительно-причинную связь по-русски.
theological_decisions:
- issue: Объём значения νόμος применительно к священству
  choice: «закона» — без добавленного уточнения «Моисеева», чтобы сохранить некоторую широту греческой формулировки.
  alternative: «Закона» как прямое и определённое указание на Моисеев закон.
  rationale: 'Контекст говорит о законодательном устройстве левитского священства и тем самым указывает на Моисеев закон, однако отсутствие артикля и сама формулировка позволяют услышать также более общий смысл: перемена священства требует перемены регулирующего его закона. Примечание сохраняет контекстуально более узкое прочтение.'
translation_notes:
  register: Современный литературный русский язык с достоинством и краткостью аргументации оригинала. Повтор «изменяется — изменение» намеренно сохраняет однокоренную пару μετατιθεμένης — μετάθεσις. Маркер примечания поставлен после всего утверждения, к которому относится уточнение о значении «закона».
