    rationale: В современном употреблении оно может означать действие при наличии потребности. Здесь ἐξ ἀνάγκης обозначает необходимое, неизбежное следствие.
  - severity: low
    issue: Примечание оформлено как альтернатива, хотя различие «закона/Закона» главным образом графическое и контекстуальное.
    rationale: Следует пояснить отнесение νόμος к Моисееву Закону в контексте, не представляя капитализацию как отдельное чтение греческого текста.
