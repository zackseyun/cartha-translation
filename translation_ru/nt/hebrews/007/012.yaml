  source_fidelity: 'Смысл передан точно: родительный абсолютный оборот передан придаточным времени с причинно-логическим следствием; сохранены связь «изменяется — изменение», добавочное «и» и необходимость следствия. Однако «по необходимости» в современном русском может пониматься как «по мере надобности», а не как логическая неизбежность ἐξ ἀνάγκης.'
  naturalness: Фраза в целом литературна и ясна. «Неизбежно» естественнее и однозначнее выражает аргументативную необходимость. Примечание лучше привязать непосредственно к слову «закона», а не ко всему предложению.
  terminology: «Священство» и «закон» удачны. Контекст действительно относится к Моисееву Закону, но греческое νόμου без артикля не требует вносить это уточнение в основной текст. Заглавная буква в русском не является полноценным лексическим вариантом перевода, поэтому исходная формула «Или» неточна; контекстуальное пояснение следует сформулировать как примечание, а не как альтернативное чтение.
  issues:
