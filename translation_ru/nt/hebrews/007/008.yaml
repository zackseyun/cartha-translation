  source_fidelity: 'Вторая часть греческого предложения эллиптична, но личное причастие μαρτυρούμενος относится к Мелхиседеку: «о котором свидетельствуется, что он жив». В черновике безличное «засвидетельствовано» грамматически возможно, однако ослабляет личную отнесённость свидетельства и звучит неполно без «о нём».'
  naturalness: «Смертные люди» понятно, но несколько книжно и менее точно передаёт причастие ἀποθνῄσκοντες, акцентирующее тех, кто умирает. «Люди, которые умирают» естественно для современного литературного русского и сохраняет данный акцент. Конструкция «там о нём свидетельствуется» естественна и сохраняет пассивную, свидетельскую форму.
  terminology: «Десятины» — устоявшийся точный термин. Имя «Мелхиседек» в примечании передано нормативно. Формула «свидетельствуется, что он жив» не утверждает напрямую его буквальное бессмертие и сохраняет аргументацию текста.
  issues:
