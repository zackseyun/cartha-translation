  text: καὶ ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν, ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/008.yaml
  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: ru
  text: И здесь десятины получают люди, которые умирают, а там о нём свидетельствуется, что он жив.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «там получают их от того, о ком свидетельствуется, что он жив». Греческий текст сохраняет форму свидетельства Писания, а не прямо утверждает буквальное бессмертие Мелхиседека.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὧδε
  choice: здесь
  rationale: Сохраняет краткое указательное противопоставление ὧδε… ἐκεῖ и относит первую часть к левитскому священству.
- source_word: δεκάτας
  choice: десятины
  rationale: Обычный и точный русский термин для установленной доли, получаемой священниками.
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: смертные люди
  rationale: Естественно передаёт причастную конструкцию «люди, которые умирают» и подчёркивает смертность в противопоставлении Мелхиседеку.
- source_word: λαμβάνουσιν
  choice: получают
  rationale: Нейтрально передаёт получение десятин, не добавляя оттенка принудительного взимания.
- source_word: ἐκεῖ
  choice: там
  rationale: Сохраняет риторическую пару «здесь… там» и указывает на свидетельство Писания о Мелхиседеке.
- source_word: μαρτυρούμενος ὅτι ζῇ
  choice: засвидетельствовано, что он жив
  rationale: Сохраняет пассивный характер свидетельства и настоящее время ζῇ, не превращая формулировку в прямое утверждение буквального бессмертия Мелхиседека.
theological_decisions:
- issue: Характер противопоставления левитских священников и Мелхиседека
  choice: Смертные левитские священники противопоставлены Мелхиседеку, о котором Писание свидетельствует, что он жив.
  alternative: Стих прямо утверждает буквальное и продолжающееся личное бессмертие Мелхиседека.
  rationale: Пассивное μαρτυρούμενος представляет это как свидетельство текста Писания. Перевод сохраняет данную форму аргумента и не разрешает заложенное в ней богословское напряжение.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка. Сохранено риторическое противопоставление «здесь… там» и намеренно пассивное указание на свидетельство.
