source:
  edition: SBLGNT
  text: Τοιοῦτος γὰρ ἡμῖν ⸀καὶ ἔπρεπεν ἀρχιερεύς, ὅσιος, ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν, καὶ ὑψηλότερος τῶν οὐρανῶν γενόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/026.yaml
  text: 'For such a high priest was indeed fitting for us: holy[a], innocent, undefiled, separated from sinners[b], and having become higher than the heavens.'
translation:
  language: ru
  text: 'Ибо такой Первосвященник как раз и подобал нам: святой[a], чуждый зла, неосквернённый, отделённый от грешников и ставший выше небес.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благочестивый».'
    reason: Лексема ὅσιος может обозначать благочестие или верность Богу наряду со святостью.
lexical_decisions:
- source_word: Τοιοῦτος
  choice: именно такой
  rationale: Указательное прилагательное отсылает к Первосвященнику, описанному выше; «именно такой» естественно передаёт эту отсылку и в сочетании с καί подчёркивает соответствие.
- source_word: γὰρ
  choice: ибо
  rationale: Сохраняет пояснительную связь с предшествующим рассуждением; слово уместно в современном литературном библейском регистре.
- source_word: ἡμῖν καὶ ἔπρεπεν
  choice: и подобал нам
  rationale: Дательный ἡμῖν обозначает соответствие нуждам верующих, а несовершенный вид ἔπρεπεν — то, что было надлежащим; «подобал нам» кратко и точно сохраняет эту мысль.
- source_word: ἀρχιερεύς
  choice: Первосвященник
  rationale: Устоявшееся обозначение высшего священнического служения. Заглавная буква указывает на употребление титула по отношению к Иисусу, не добавляя нового смысла.
- source_word: ὅσιος
  choice: святой
  rationale: Передаёт нравственную и религиозную чистоту; возможный оттенок благочестия отмечен в сноске.
- source_word: ἄκακος
  choice: невинный
  rationale: Выражает отсутствие зла и злого умысла; естественнее и содержательнее здесь, чем «безвредный».
- source_word: ἀμίαντος
  choice: неосквернённый
  rationale: Сохраняет образ отсутствия осквернения и его вероятный культовый оттенок.
- source_word: κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν
  choice: отделённый от грешников
  rationale: Перфектное причастие обозначает достигнутое и сохраняющееся состояние отделённости. Прямой перевод не уточняет без необходимости, является ли акцент нравственным, культовым или пространственно-эсхатологическим.
- source_word: ὑψηλότερος τῶν οὐρανῶν γενόμενος
  choice: ставший выше небес
  rationale: Сохраняет как сравнительную конструкцию «выше небес», так и значение перехода к результирующему состоянию в γενόμενος, не вводя явно выраженную в оригинале пассивность.
theological_decisions:
- issue: Смысл выражения «отделённый от грешников»
  choice: Сохранена прямая формулировка, допускающая связь как с нравственной чистотой, так и с возвышенным положением Первосвященника.
  alternative: Передать исключительно как пространственное удаление от грешных людей либо только как послевознесенческое отделение.
  rationale: Ряд определений подчёркивает пригодность, чистоту и возвышение Иисуса. Перевод не должен отрицать его земного общения с грешниками и вместе с тем не должен устранять присущую фразе многозначность.
- issue: Значение γενόμενος в описании положения выше небес
  choice: «ставший выше небес» — историко-результативное описание возвышенного первосвященнического положения.
  alternative: «пребывающий выше небес» как чисто статическое описание или «вознесённый выше небес» с явным обозначением внешнего деятеля.
  rationale: Причастие передаёт достижение состояния, однако само по себе не выражает пассивный залог. Такая формулировка не утверждает изменения божественной природы Христа, а сохраняет язык его возвышения в ходе спасительного служения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис следует компактному перечислению греческого текста; термины «Первосвященник» и «неосквернённый» сохраняют священнический и культовый контекст Послания к евреям.
