source:
  edition: SBLGNT
  text: ἀθέτησις μὲν γὰρ γίνεται προαγούσης ἐντολῆς διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/018.yaml
  text: For there is indeed a setting aside of the former commandment because of its weakness and uselessness[b][a],
translation:
  language: ru
  text: Ибо прежняя заповедь отменяется из-за её слабости и бесполезности[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предшествующая заповедь»; буквально: «заповедь, шедшая прежде».'
    reason: lexical_alternative
  - marker: b
    text: То есть она была неспособна привести к совершенству, о котором говорится в данном контексте (см. Евр. 7:19); это не означает, что данное прежде Божье откровение само по себе было злом.
    reason: cross_reference
lexical_decisions:
- source_word: ἀθέτησις
  choice: отменяется
  rationale: Передаёт упразднение или лишение прежней заповеди силы; глагольная конструкция естественнее по-русски, чем отвлечённое «происходит отмена».
- source_word: μὲν γὰρ
  choice: ибо
  rationale: «Ибо» сохраняет пояснительную связь с предыдущим рассуждением. Контраст, намеченный μέν и продолженный в следующем стихе, по-русски может быть выражен без тяжеловесного «с одной стороны».
- source_word: γίνεται
  choice: отменяется
  rationale: В сочетании с ἀθέτησις обозначает происходящую отмену; значение включено в естественную русскую глагольную форму.
- source_word: προαγούσης ἐντολῆς
  choice: прежняя заповедь
  rationale: Причастие означает «предшествующая, идущая прежде». «Прежняя» ясно передаёт временное предшествование и естественно звучит в данном контексте.
- source_word: ἀσθενές
  choice: слабость
  rationale: Сохраняет прямую и резкую оценку недостатка силы или действенности, выраженную субстантивированным прилагательным.
- source_word: ἀνωφελές
  choice: бесполезность
  rationale: Прямо передаёт отсутствие пользы или способности достичь требуемой цели, не смягчая формулировку оригинала.
theological_decisions:
- issue: Объём критики прежней заповеди
  choice: Сохранена сильная формулировка «слабость и бесполезность», относящаяся в контексте к неспособности прежнего установления привести к совершенству.
  alternative: Понять стих как безусловное утверждение о полной бесполезности всего Моисеева закона либо смягчить оценку до нейтральной «недостаточности».
  rationale: Ближайший контекст связывает оценку с прежним священническим установлением и достижением совершенства (Евр 7:11, 19). Перевод сохраняет богословское напряжение текста, а сноска уточняет контекст, не устраняя его резкости.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского стиля. Синтаксис сделан естественным для русского: греческая именная конструкция передана глаголом «отменяется». Запятая в конце сохраняет связь с продолжением мысли в стихе 19.'
