  naturalness: Формулировка естественна для современного литературного русского и сохраняет достойный библейский регистр. «Ведь Он всегда жив, чтобы ходатайствовать за них» читается ясно и передаёт основание способности спасать вместе с направленностью постоянной жизни к ходатайству.
  terminology: «Спасать», «приближаться к Богу» и «ходатайствовать» — точные, устоявшиеся и понятные соответствия без излишней конфессиональной интерпретации. Написание относящихся ко Христу местоимений с прописной буквы последовательно в рамках заявленной издательской нормы.
