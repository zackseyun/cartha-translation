id: HEB.7.25
reference: Hebrews 7:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅθεν καὶ σῴζειν εἰς τὸ παντελὲς δύναται τοὺς προσερχομένους δι’ αὐτοῦ τῷ θεῷ, πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: ru
  text: Поэтому Он и может полностью[a] спасать тех, кто через Него приближается к Богу, ведь Он всегда жив, чтобы ходатайствовать за них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасать навеки»; также возможно: «спасать до конца».'
    reason: Лексическое значение εἰς τὸ παντελές допускает как смысл полноты, так и смысл непреходящей длительности.
lexical_decisions:
- source_word: ὅθεν
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения о непреходящем священстве Иисуса и естественно связывает стихи.
- source_word: καὶ
  choice: и
  rationale: 'Сохраняет добавочное значение частицы: непреходящее священство Христа имеет и это следствие — способность спасать.'
- source_word: σῴζειν
  choice: спасать
  rationale: Обычное и богословски ёмкое соответствие глаголу σῴζω в данном контексте.
- source_word: εἰς τὸ παντελές
  choice: полностью
  rationale: Передаёт прежде всего полноту и завершённость спасения, не сводя выражение только к временному значению; возможный смысл «навеки» сохранён в сноске.
- source_word: δύναται
  choice: может
  rationale: Естественно выражает способность, основанную на непреходящем священстве Христа.
- source_word: τοὺς προσερχομένους
  choice: тех, кто… приближается
  rationale: Сохраняет характерный для Послания к евреям образ приближения к Богу, включая оттенки доступа к Нему и поклонения.
- source_word: δι’ αὐτοῦ
  choice: через Него
  rationale: Передаёт посредническую роль Иисуса в доступе людей к Богу.
- source_word: τῷ θεῷ
  choice: к Богу
  rationale: Естественное русское управление при глаголе «приближаться» точно передаёт направление действия.
- source_word: πάντοτε ζῶν
  choice: ведь Он всегда жив
  rationale: Сохраняет постоянный характер Его жизни и передаёт причину Его способности спасать.
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: чтобы ходатайствовать
  rationale: «Ходатайствовать» точно и кратко передаёт заступническое действие; конструкция с «чтобы» сохраняет оттенок цели.
- source_word: ὑπὲρ αὐτῶν
  choice: за них
  rationale: Естественно передаёт действие в пользу и от имени упомянутых людей.
theological_decisions:
- issue: Смысловой объём выражения εἰς τὸ παντελές
  choice: 'В основном тексте: «полностью»'
  alternative: «навеки»; «до конца»
  rationale: Выражение допускает значение как полноты, так и неограниченной длительности. Контекст непреходящего священства и постоянной жизни Христа поддерживает оба оттенка, поэтому основной текст подчёркивает полноту спасения, а временной и традиционный варианты сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Местоимения, относящиеся ко Христу, написаны с прописной буквы как принятая русская библейская издательская норма; синтаксис оставлен доступным для обычного читателя.
