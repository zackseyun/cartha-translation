  text: ⸀μαρτυρεῖται γὰρ ὅτι Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/017.yaml
  text: 'For it is testified: “You are a priest forever according to the order of Melchizedek.”[a][b]'
translation:
  language: ru
  text: 'Ибо засвидетельствовано: «Ты — священник навеки по чину Мелхиседека».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласно чину Мелхиседека».'
    reason: lexical_alternative
  - marker: b
    text: Цитата из Псалма 109:4 (110:4 по иной нумерации).
    reason: cross_reference
lexical_decisions:
- source_word: μαρτυρεῖται
  choice: засвидетельствовано
  rationale: Безличная пассивная форма сохраняет мысль о свидетельстве Писания, не уточняя прямо действующее лицо.
- source_word: γὰρ
  choice: ибо
  rationale: Передаёт обоснование предыдущего утверждения и соответствует достоинству аргументативного стиля Послания.
- source_word: ὅτι
  choice: ':'
  rationale: Союз вводит содержание свидетельства; в русском прямая цитата после двоеточия звучит естественнее конструкции с «что».
- source_word: Σὺ
  choice: Ты
  rationale: Сохраняет прямое обращение и выраженное местоимением смысловое ударение.
- source_word: ἱερεὺς
  choice: священник
  rationale: Точно передаёт название служения; добавление «первосвященник» вышло бы за пределы текста данного стиха.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Естественно и ёмко передаёт значение непрекращающейся длительности.
- source_word: κατὰ τὴν τάξιν
  choice: по чину
  rationale: Устойчивая русская библейская формула, обозначающая соответствие определённому чину или порядку; она остаётся понятной в современном литературном русском.
- source_word: Μελχισέδεκ
  choice: Мелхиседека
  rationale: Традиционная русская передача личного имени; родительный падеж обусловлен оборотом «по чину».
theological_decisions:
- issue: Передача священнического наименования в цитате из псалма без внесения последующего богословского пояснения
  choice: священник
  alternative: первосвященник
  rationale: В греческом тексте стоит ἱερεύς, «священник». Хотя Послание называет Иисуса первосвященником в других местах, добавлять это уточнение здесь означало бы расширять исходный текст.
- issue: Характер связи с Мелхиседеком
  choice: по чину Мелхиседека
  alternative: подобно Мелхиседеку
  rationale: Формулировка сохраняет многозначность τάξις — чин, порядок, установленный образ — и не сводит связь лишь к общему сходству.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Ибо» и «засвидетельствовано» поддерживают строгий ход рассуждения; традиционное «по чину» понятно из контекста и сопровождается лексической альтернативой в сноске.
