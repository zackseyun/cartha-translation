  terminology: «Священник», «навеки», «по чину Мелхиседека» — точные и устойчивые соответствия. Имя «Мелхиседек» передано в нормативной русской библейской форме. Альтернативная формулировка в сноске корректно отмечает допустимое «согласно чину».
