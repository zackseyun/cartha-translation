  text: By so much[a], Jesus has become the guarantor of a better covenant.
translation:
  language: ru
  text: Тем самым Иисус стал поручителем лучшего завета[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «завещания». Греческое слово может означать как «завет», так и в некоторых контекстах «завещание»; здесь рассуждение о священстве и клятве лучше соответствует значению «завет».'
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τοσοῦτο
  choice: И настолько
  rationale: 'Оборот κατά с винительным меры выражает степень и связывает стих с предшествующим рассуждением: насколько выше священство, настолько лучше и завет. Союз «и» естественно передаёт смысловую связь с предыдущим стихом.'
- source_word: κρείττονος
  choice: лучшего
  rationale: Сравнительная степень сохраняет ключевой для Послания к евреям мотив превосходства; «лучшего» звучит ясно и естественно.
- source_word: διαθήκης
  choice: завета
  rationale: В контексте священства и Божьей клятвы речь идёт о заветном установлении. Возможное в иных контекстах значение «завещание» здесь менее уместно.
- source_word: γέγονεν
  choice: стал
  rationale: Перфект γίνομαι обозначает наступившее состояние с сохраняющимся результатом. Русское «стал» естественно передаёт переход в это положение; продолжающийся результат понятен из именного сказуемого.
- source_word: ἔγγυος
  choice: поручителем
  rationale: Слово обозначает лицо, которое выступает гарантией исполнения обязательства. «Поручитель» точно и понятно передаёт личный характер роли Иисуса.
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Общепринятая русская форма имени.
theological_decisions:
- issue: Значение διαθήκη в Евр 7:22
  choice: завет
  alternative: завещание
  rationale: Связь с новым священством и подтверждающей его клятвой указывает на завет, а не на юридическое завещание. Смысловой диапазон греческого слова отмечен в сноске без преждевременного переноса нюанса «завещания» в основной текст.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Начальное «И настолько» сохраняет тесную логическую связь с предыдущим рассуждением и меру сравнения, не устраняя некоторую краткость оригинала.
