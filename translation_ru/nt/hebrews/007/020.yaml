lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Союз сохраняет связь с предшествующим рассуждением.
- source_word: καθ’ ὅσον
  choice: поскольку
  rationale: В данном аргументативном контексте оборот вводит основание последующего вывода; «поскольку» естественно передаёт эту функцию по-русски.
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: не без клятвы
  rationale: Сохраняются отрицательная конструкция и акцент оригинала; ὁρκωμοσία обозначает клятву или акт её принесения.
- source_word: οἱ μὲν γὰρ
  choice: ведь те
  rationale: «Ведь» передаёт пояснительную силу γάρ, а «те» подготавливает противопоставление, продолжающееся в следующем стихе.
- source_word: χωρὶς ὁρκωμοσίας
  choice: без клятвы
  rationale: Повтор ключевого выражения передан последовательно, но без отрицания, как в греческом тексте.
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: стали священниками
  rationale: Естественно передаёт завершённое вступление в священническое служение и возникшее вследствие этого положение.
theological_decisions:
- issue: Подразумеваемое событие в эллиптическом обороте οὐ χωρὶς ὁρκωμοσίας
  choice: «это произошло не без клятвы»
  alternative: «Он стал священником не без клятвы»
  rationale: Нейтральное «это произошло» восполняет необходимую для русского языка связку, не вводя в данный стих явного субъекта или более развёрнутого богословского утверждения, отсутствующего в греческом тексте.
- issue: Противопоставление прежних священников и священства, утверждённого клятвой
  choice: Сохранено начатое здесь противопоставление без его преждевременного разъяснения
  alternative: Явно назвать «тех» левитскими священниками, а подразумеваемого священника — Иисусом
  rationale: Контекст указывает на такое противопоставление, однако сам стих выражает его местоименно и синтаксически продолжает в следующем стихе; перевод не должен расширять формулировку оригинала.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного аргументативного тона Послания. Незавершённая скобочная конструкция и конечная запятая сохранены, поскольку синтаксис продолжается в Евр 7:21.
