  text: Θεωρεῖτε δὲ πηλίκος οὗτος ⸀ᾧ δεκάτην Ἀβραὰμ ἔδωκεν ἐκ τῶν ἀκροθινίων ὁ πατριάρχης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/004.yaml
  text: Consider how great this man was[b][a], to whom Abraham the patriarch gave a tenth of the spoils.
translation:
  language: ru
  text: Обратите внимание, как велик тот, кому патриарх Авраам отдал десятую часть[a] из добычи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «десятину». По-гречески буквально: «десятую часть».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово обозначает военную добычу и может также подразумевать её лучшую, отборную часть.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωρεῖτε
  choice: Посмотрите
  rationale: Настоящее повелительное множественного числа призывает читателей внимательно осмыслить сказанное; «посмотрите» естественно сочетает образ наблюдения с побуждением к размышлению.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Частица обозначает мягкий переход; в русском связность достаточно передана порядком фразы, а отдельное «теперь» создало бы отсутствующий в греческом временной оттенок.
- source_word: πηλίκος
  choice: как велик
  rationale: Прямо передаёт величие, не уточняя преждевременно, идёт ли речь о достоинстве, положении или значимости.
- source_word: οὗτος
  choice: тот
  rationale: Указывает на Мелхиседека из предшествующего контекста. Русское «тот» естественно вводит следующую относительную конструкцию и не добавляет отсутствующего существительного.
- source_word: ᾧ
  choice: кому
  rationale: Дательный падеж относительного местоимения при глаголе «отдал».
- source_word: δεκάτην
  choice: десятую часть
  rationale: Буквально передаёт числовое значение и не привносит более поздние институциональные ассоциации слова «десятина».
- source_word: Ἀβραὰμ
  choice: Авраам
  rationale: Общепринятая русская форма имени.
- source_word: ἔδωκεν
  choice: отдал
  rationale: Естественно передаёт совершённую передачу доли другому лицу; смысл простого δίδωμι сохранён.
- source_word: ἐκ τῶν ἀκροθινίων
  choice: военной добычи
  rationale: В контексте Бытия речь идёт о добыче после сражения. Родительный оборот после «десятую часть» естественен по-русски; возможный оттенок отборной или лучшей доли оставлен в примечании.
- source_word: ὁ πατριάρχης
  choice: патриарх
  rationale: Сохраняет титул Авраама и подчёркивает его положение родоначальника.
theological_decisions:
- issue: Основание величия Мелхиседека
  choice: Величие Мелхиседека подчёркнуто тем, что ему отдал десятую часть даже Авраам, названный патриархом.
  alternative: Явно сформулировать превосходство Мелхиседека над Авраамом.
  rationale: Стих подводит читателя к такому выводу, однако перевод не должен выражать полнее то богословское заключение, которое развивается в последующем контексте.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и умеренно торжественным звучанием. Частица «даже» естественно выделяет риторически значимый титул Авраама, стоящий в греческом в конце предложения, не меняя логики аргумента.
