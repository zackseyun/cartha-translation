reference: Hebrews 10:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Σκιὰν γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε ⸀δύναται τοὺς προσερχομένους τελειῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/001.yaml
  text: For since the law has only a shadow of the good things to come[a], not the very form of the realities, it can never, by the same sacrifices that they continually offer year after year[c][b], perfect those who draw near.
translation:
  language: ru
  text: Ведь закон имеет лишь тень грядущих благ, а не сам образ реальностей; он никогда не может одними и теми же жертвами, которые постоянно приносят из года в год, сделать совершенными тех, кто приближается к Богу.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «довести до совершенства»; здесь речь идёт о достижении предназначенной цели, в особенности о полном доступе к Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тех, кто приближается»; имеется в виду приближение к Богу в поклонении.'
    reason: cultural_note
lexical_decisions:
- source_word: Σκιὰν
  choice: тень
  rationale: 'Сохраняет буквальную метафору σκιά и её противопоставление εἰκών: закон представляет предварительное очертание, а не полноту реальности.'
- source_word: τῶν μελλόντων ἀγαθῶν
  choice: грядущих благ
  rationale: Кратко и естественно передаёт будущую направленность причастия μέλλω, не уточняя спорные временные или эсхатологические детали.
- source_word: οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων
  choice: а не сам образ этих реальностей
  rationale: «Сам образ» сохраняет эмфатическую силу αὐτήν и лексику εἰκών; «реальности» ясно выражает соответствие между тенью и действительными благами, не превращая образ в саму сущность.
- source_word: κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις
  choice: одними и теми же жертвами, которые из года в год приносят
  rationale: Передаёт инструментальный дательный, тождественность повторяемых жертв и ежегодный характер действия.
- source_word: εἰς τὸ διηνεκές
  choice: непрестанно
  rationale: Сохраняет смысл продолжающегося, неизменно повторяемого принесения; вместе с «из года в год» подчёркивает устойчивость ежегодного обряда.
- source_word: οὐδέποτε δύναται
  choice: никогда не может
  rationale: Естественно передаёт абсолютное отрицание οὐδέποτε и модальное значение δύναται.
- source_word: τοὺς προσερχομένους
  choice: тех, кто приближается к Богу
  rationale: В контексте Послания глагол обозначает культовое приближение к Богу. Добавление «к Богу» проясняет подразумеваемую цель без конфессионального истолкования.
- source_word: τελειῶσαι
  choice: сделать совершенными
  rationale: Сохраняет ключевой для Послания термин τελειόω и его смысл доведения до предназначенной цели, особенно в отношении доступа к Богу.
theological_decisions:
- issue: Противопоставление тени и образа в богословии закона
  choice: Закон имеет тень грядущих благ, но не сам их образ.
  alternative: Закон является символическим прообразом будущих благ или противопоставляется непосредственно самой реальности.
  rationale: Греческий текст прямо различает σκιά и εἰκών. Перевод сохраняет это различие и не отождествляет εἰκών безоговорочно с самой сущностью πραγμάτων.
- issue: Значение τελειῶσαι в жертвенном контексте
  choice: сделать совершенными
  alternative: довести до совершенства; привести к цели; сделать вполне пригодными для доступа к Богу
  rationale: Формулировка сохраняет повторяющийся термин Послания и его богословскую напряжённость, не сводя его исключительно к нравственной безгрешности.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис следует логике греческого предложения, но причинная связь γάρ естественно передана словом «поэтому» во второй части. Термин «образ» сохранён ради точного различения σκιά и εἰκών; «реальности» передаёт контекстуальный смысл πραγμάτων.
