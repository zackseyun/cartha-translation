  text: ἀνώτερον λέγων ὅτι ⸂Θυσίας καὶ προσφορὰς⸃ καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ ⸀νόμον προσφέρονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/008.yaml
  text: After saying above[a], “Sacrifices and offerings and whole burnt offerings and sin offerings you did not desire[c][b], nor did you delight in”—which are offered according to the law—
translation:
  language: ru
  text: 'Выше сказав: «Жертв и приношений, всесожжений[a] и жертв за грех[b] Ты не пожелал и не одобрил», — которые приносятся по закону[c], —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертв, целиком сжигаемых на жертвеннике».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «приношений за грех».'
    reason: lexical_alternative
  - marker: c
    text: То есть согласно предписаниям Моисеева закона.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνώτερον λέγων
  choice: Сказав прежде
  rationale: Естественно передаёт причастную конструкцию и отсылает к приведённым выше словам; временная последовательность сохраняется без тяжеловесности.
- source_word: Θυσίας καὶ προσφορὰς
  choice: Жертв и приношений
  rationale: Сохраняет два культовых термина и их различение в перечне.
- source_word: ὁλοκαυτώματα
  choice: всесожжений
  rationale: Устоявшийся русский термин обозначает жертвы, целиком сжигаемые на жертвеннике.
- source_word: περὶ ἁμαρτίας
  choice: жертв за грех
  rationale: В данном культовом контексте эллиптическое выражение обозначает приношения, связанные с грехом; формулировка сохраняет смысл, не чрезмерно унифицируя терминологию.
- source_word: οὐκ ἠθέλησας
  choice: Ты не пожелал
  rationale: Передаёт волю или желание Бога, сохраняя риторическую силу цитаты.
- source_word: οὐδὲ εὐδόκησας
  choice: и не одобрил
  rationale: Передаёт отсутствие благоволения или одобрения и не требует добавлять отсутствующее в греческом местоимение «их».
- source_word: αἵτινες κατὰ νόμον προσφέρονται
  choice: хотя они приносятся по закону
  rationale: Относительное предложение относится ко всему перечню; «хотя» естественно выявляет контраст, подразумеваемый контекстом, а настоящее страдательное передано буквально и ясно.
theological_decisions:
- issue: Отрицательное отношение Бога к перечисленным жертвам при том, что они предписаны законом
  choice: Сохранить прямое «не пожелал и не одобрил», добавив поясняющее противопоставление «хотя они приносятся по закону»
  alternative: Смягчить до «не предпочёл» или истолковать как отрицание лишь недостаточности жертв
  rationale: Греческий текст формулирует отрицание резко и одновременно отмечает законный статус жертв. Перевод сохраняет это богословское напряжение, не объясняя его заранее.
- issue: Культовое значение περὶ ἁμαρτίας
  choice: жертв за грех
  alternative: приношений за грех; о грехе
  rationale: Контекст перечня жертвенных категорий поддерживает культовое понимание, однако выражение передано достаточно прозрачно и без привнесения последующей доктринальной схемы.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Устоявшееся «всесожжение» сохранено как точный культовый термин и разъяснено в сноске. Конечные тире отражают незавершённый синтаксис стиха, продолжающийся в следующем предложении.
