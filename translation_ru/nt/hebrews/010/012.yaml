  - marker: b
    text: Слова «по правую руку Бога» перекликаются с Пс 109:1 (110:1), ключевым для Послания к евреям текстом о возвышении Мессии.
    reason: cross_reference
lexical_decisions:
- source_word: οὗτος δὲ
  choice: А Он
  rationale: Передаёт выраженное δὲ противопоставление священникам из предыдущего стиха и выделяющую силу указательного οὗτος; по-русски это звучит естественнее, чем буквальное «этот же».
- source_word: μίαν ... θυσίαν
  choice: одну жертву
  rationale: Сохраняет подчёркнутую единственность жертвы в противоположность многократно приносимым жертвам из контекста.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: за грехи
  rationale: Естественное русское выражение для жертвенного приношения ради устранения грехов; множественное число соответствует греческому тексту.
- source_word: προσενέγκας
  choice: принеся
  rationale: Деепричастие сохраняет форму и предшествование действия по отношению к главному глаголу ἐκάθισεν.
- source_word: εἰς τὸ διηνεκές
  choice: на все времена
  rationale: Передаёт непреходящую силу единственной жертвы и при этом не использует тяжеловесное «непрерывно»; возможная иная синтаксическая связь отмечена в сноске.
- source_word: ἐκάθισεν
  choice: воссел
  rationale: Достоинству контекста возвышения соответствует современное, но торжественное «воссел»; совершенный вид передаёт завершённое действие.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: по правую руку Бога
  rationale: Устойчивое и понятное выражение, сохраняющее связь с формулировкой Псалма 109:1 (110:1).
theological_decisions:
- issue: Синтаксическая связь εἰς τὸ διηνεκές
  choice: Фраза «на все времена» поставлена при «одну жертву за грехи», подчёркивая непреходящую действенность единственной жертвы.
  alternative: 'Фразу можно связать с главным глаголом: «навсегда воссел по правую руку Бога».'
  rationale: Порядок слов допускает обе связи. Контраст с повторяющимися жертвами в Евр 10:11 и дальнейшее упоминание единственного приношения в 10:14 поддерживают выбранное прочтение, однако синтаксическая неоднозначность не снимается и потому отражена в сноске.
- issue: Мессианский смысл выражения «по правую руку Бога»
  choice: Сохранена формула без поясняющего добавления в основном тексте.
  alternative: Можно было явно добавить указание на царское возвышение Мессии.
  rationale: Аллюзия на Псалом 109:1 (110:1) существенна для богословия Послания к евреям, но подобное пояснение было бы толкованием, поэтому оно вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «А Он» естественно выражает контраст, а «воссел» уместно передаёт царственное возвышение. Заглавная буква в «Он» указывает на уже названного в контексте Христа, не добавляя имени в текст.
