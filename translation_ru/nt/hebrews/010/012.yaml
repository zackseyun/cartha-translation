  text: But this one[a], after offering one sacrifice for sins for all time, sat down at the right hand of God[b],
translation:
  language: ru
  text: А Он, принеся одну жертву за грехи на все времена[a], воссел по правую руку Бога[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принеся навсегда одну жертву за грехи». Греческие слова, переведённые как «на все времена», можно теснее связать с действием принесения жертвы; выбранный перевод подчёркивает её непреходящую действенность.'
