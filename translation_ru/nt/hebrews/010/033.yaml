  yaml_path: translation/nt/hebrews/010/033.yaml
  text: sometimes being publicly exposed to insults and afflictions[b][a], and at other times becoming partners with those who were treated that way.
translation:
  language: ru
  text: то, подвергаясь оскорблениям и притеснениям, становились предметом всеобщего посмеяния[a], то разделяя участь тех, с кем обращались так же[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее и образнее: «становясь публичным зрелищем».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «разделяя участь тех, кто так жил (или вёл себя)»; греческое причастие допускает такое значение, хотя контекст гонений скорее указывает на то, как с этими людьми обращались.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μὲν ... τοῦτο δὲ
  choice: то ... то
  rationale: Русская соотносительная конструкция естественно передаёт две чередующиеся или взаимодополняющие стороны прежних испытаний адресатов.
- source_word: ὀνειδισμοῖς
  choice: оскорблений
  rationale: Слово обозначает хулу, поношение и словесное унижение; «оскорбления» ясно и современно передаёт этот смысл.
- source_word: θλίψεσιν
  choice: притеснений
  rationale: В контексте гонений речь идёт о давлении, бедствиях и угнетении; «притеснения» сохраняет как тяжесть страданий, так и их внешнюю обусловленность.
- source_word: θεατριζόμενοι
  choice: публично выставляемые на позор
  rationale: Глагол создаёт образ человека, выставленного перед публикой как зрелище. Формулировка передаёт и публичность, и унизительный характер происходящего.
- source_word: κοινωνοὶ
  choice: разделяя участь
  rationale: Здесь имеется в виду действенная солидарность и участие в положении других. «Разделяя участь» звучит естественнее, чем потенциально отрицательно окрашенное «соучастники».
- source_word: τῶν οὕτως ἀναστρεφομένων
  choice: тех, с кем обращались так же
  rationale: Хотя причастие может относиться к образу жизни или поведению, контекст оскорблений и притеснений поддерживает значение того, как с этими людьми обходились.
- source_word: γενηθέντες
  choice: разделяя
  rationale: Аористное причастие выражает то, что адресаты стали причастны участи гонимых; в русском деепричастная конструкция плавно связывает вторую часть с первой.
theological_decisions:
- issue: Значение ἀναστρεφομένων в данном контексте
  choice: относится к людям, с которыми обращались таким же образом
  alternative: относится к людям, которые так жили или вели себя
  rationale: Ближайший контекст посвящён публичному унижению, притеснениям и солидарности с гонимыми, поэтому значение «с кем обращались так же» вероятнее. Подлинная лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Сохранена незавершённая синтаксическая форма стиха, поскольку он продолжает предыдущее предложение; избегнуты архаизмы и конфессионально окрашенные термины.
