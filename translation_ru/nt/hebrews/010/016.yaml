  rationale: 'Исправлены две безопасные языковые проблемы: совершенное деепричастие заменено параллельным будущим глаголом, а неестественное «в их разуме» — нормативным «в их умах». Примечание сохраняет информацию о греческой причастной форме и имеет корректную привязку [a].'
