  source_fidelity: 'Основной смысл передан верно: διαθήκη — «завет», διαθήσομαι — «заключу», πρὸς αὐτούς — «с ними», а νόμους и αὐτούς сохранены во множественном числе. Однако деепричастие совершенного вида «вложив» в сочетании с будущим «напишу» по-русски обычно выражает предшествующее действие и тем самым неудачно передаёт греческое настоящее причастие διδοὺς. Сглаживание в два будущих глагола не меняет содержания обещания. «В их умах» — естественный русский способ передать образ записи в διάνοια; множественное число здесь distributively относится к людям, хотя греческое существительное формально единственное.'
  naturalness: «Вложив мои законы в их сердца, я напишу их в их разуме» звучит синтаксически и лексически неестественно. В частности, «написать в разуме» не является обычной современной русской сочетаемостью. Два параллельных будущих глагола и «в их умах» дают ясную литературную фразу.
  terminology: «Завет», «заключу», «Господь» и «законы» уместны и сохраняют межтекстовую связь с цитатой из Иеремии. Прописное «Я» в прямой речи Бога соответствует распространённой русской библейской издательской норме; оно не вносит смыслового уточнения.
