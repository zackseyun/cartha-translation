source:
  edition: SBLGNT
  text: Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ ⸂τὴν διάνοιαν⸃ αὐτῶν ἐπιγράψω αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/016.yaml
  text: 'This is the covenant that I will make with them after those days[a], says the Lord: putting my laws upon their hearts, and I will write them on their minds,'
translation:
  language: ru
  text: '«Вот завет, который Я заключу с ними после тех дней, — говорит Господь: Я вложу Мои законы в их сердца[a] и напишу их в их умах».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в греческом тексте: «вкладывая Мои законы в их сердца…»; далее следует «Я напишу их…». В переводе конструкция передана двумя будущими глаголами ради естественности русского синтаксиса.'
    reason: Греческое причастие διδοὺς сохраняет синтаксическую особенность цитаты; примечание отмечает её, не создавая в основном тексте неестественное или временно смещённое деепричастное значение.
lexical_decisions:
- source_word: διαθήκη
  choice: завет
  rationale: В Послании к евреям слово связано с обещанием нового завета у Иеремии; «завет» сохраняет этот межтекстовый и богословский смысл.
- source_word: διαθήσομαι
  choice: заключу
  rationale: В сочетании с «завет» глагол διατίθεμαι естественно передаётся по-русски устойчивым выражением «заключить завет».
- source_word: πρὸς αὐτούς
  choice: с ними
  rationale: В контексте заключения завета πρὸς обозначает участников отношений; буквальное «к ним» по-русски здесь неестественно.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: после тех дней
  rationale: Передаёт временную формулу буквально и ясно, без добавочного толкования.
- source_word: κύριος
  choice: Господь
  rationale: Обычный русский эквивалент κύριος в формуле «говорит Господь»; прописная буква соответствует нормативному написанию именования Бога.
- source_word: διδοὺς
  choice: вложив
  rationale: В данном образном сочетании «вложив ... в сердца» естественнее буквального «дав» и сохраняет греческую причастную, а в русском — деепричастную конструкцию.
- source_word: νόμους
  choice: законы
  rationale: Сохраняется явно выраженное в греческом тексте множественное число и связь с лексемой νόμος.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: в их сердца
  rationale: Русское «вложить в сердца» естественно передаёт метафору помещения законов во внутреннюю жизнь людей; множественное καρδίας сохранено.
- source_word: διάνοιαν
  choice: разум
  rationale: «Разум» передаёт способность мыслить и понимать, обозначенную διάνοια, и сохраняет единственное число греческого существительного.
- source_word: ἐπιγράψω
  choice: напишу
  rationale: Ясно передаёт значение нанесения письмен и сохраняет параллель с образом законов, записанных внутри человека.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение отсылает к «моим законам»; русское «их» сохраняет эту анафору без ненужного повтора.
theological_decisions:
- issue: Синтаксис цитаты из Иеремии внутри Послания к евреям
  choice: 'Сохранить нефинитную конструкцию: «вложив ... я напишу»'
  alternative: 'Сгладить в два личных глагола: «я вложу ... и напишу»'
  rationale: Греческий текст Евреям использует διδοὺς, а затем личную будущую форму ἐπιγράψω. Деепричастие сохраняет особенность переданной в Евреям формы цитаты, не гармонизируя её молча с более привычным синтаксисом.
- issue: Расположение законов «на» или «в» сердце и разуме
  choice: «в их сердца» и «в их разуме»
  alternative: «на их сердцах» и «на их разуме»
  rationale: ἐπί допускает пространственно-метафорическое понимание, однако по-русски образ внутреннего написания естественно выражается предлогом «в». Это не уточняет механизм исполнения обещания и сохраняет параллель сердца и разума.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Устойчивое «заключить завет» и формула «говорит Господь» обеспечивают ясность без архаизации. Местоимения, относящиеся к Богу, набраны со строчной буквы по нейтральной современной издательской норме; именование «Господь» — с прописной.
