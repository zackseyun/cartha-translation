reference: Hebrews 10:34
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ γὰρ τοῖς ⸀δεσμίοις συνεπαθήσατε, καὶ τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε, γινώσκοντες ἔχειν ⸀ἑαυτοὺς κρείττονα ⸀ὕπαρξιν καὶ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/034.yaml
  text: For you also suffered together with the prisoners[a], and you accepted with joy the plundering of your possessions[b], knowing that you yourselves have a better and lasting possession.
translation:
  language: ru
  text: Ведь вы разделили страдания с узниками[a] и с радостью приняли разграбление своего имущества, зная, что у вас самих есть лучшее и непреходящее достояние[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сострадали узникам». Греческий глагол может обозначать сострадание, но здесь, вероятно, подразумевается и участие в их страданиях.'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях: «зная, что у вас самих на небесах есть лучшее и непреходящее достояние».'
    reason: textual_variant
lexical_decisions:
- source_word: δεσμίοις
  choice: узников
  rationale: Слово обозначает людей, находящихся в узах или заключении. «Узники» — краткий и уместный в контексте гонений литературный эквивалент.
- source_word: συνεπαθήσατε
  choice: разделили страдания
  rationale: Глагол может означать как сострадание, так и соучастие в чужом страдании. В контексте преследований выражение «разделили страдания» передаёт деятельную солидарность, не сводя смысл к одному лишь чувству жалости.
- source_word: ἁρπαγήν
  choice: разграбление
  rationale: Слово указывает на насильственное и неправомерное отнятие. «Разграбление» сохраняет эту силу лучше, чем более административное «конфискация».
- source_word: τῶν ὑπαρχόντων ὑμῶν
  choice: своего имущества
  rationale: Субстантивированное причастие обозначает принадлежащие адресатам вещи, имущество. Русское «своего имущества» естественно соотносит утраченное с подлежащим «вы».
- source_word: μετὰ χαρᾶς
  choice: с радостью
  rationale: Прямо передаёт греческий предложный оборот и сохраняет его смысловой акцент.
- source_word: προσεδέξασθε
  choice: приняли
  rationale: В данном контексте глагол выражает сознательное принятие постигшей утраты, не подразумевая одобрения самой несправедливости.
- source_word: γινώσκοντες
  choice: зная
  rationale: Деепричастная конструкция сохраняет форму и допускает присущий контексту причинный оттенок без его излишнего усиления.
- source_word: ἑαυτοὺς ἔχειν
  choice: у вас самих есть
  rationale: Оборот естественно передаёт по-русски обладание, а слово «самих» сохраняет эмфатическую силу возвратного местоимения.
- source_word: κρείττονα
  choice: лучшее
  rationale: «Лучшее» сохраняет повторяющуюся в Послании к евреям сравнительную тему и не усиливает её до более отвлечённого «превосходящее».
- source_word: ὕπαρξιν
  choice: достояние
  rationale: Существительное означает имущество или владение; здесь земному имуществу противопоставлено лучшее достояние. Этот выбор передаёт контраст и допускает как конкретный, так и более широкий смысл.
- source_word: μένουσαν
  choice: непреходящее
  rationale: Слово подчёркивает постоянство и сохранность достояния. «Непреходящее» звучит естественно в современном литературном русском и ясно противопоставлено разграбленному имуществу.
theological_decisions:
- issue: Характер солидарности с заключёнными верующими
  choice: Текст передан как деятельное разделение страданий узников.
  alternative: «Вы сострадали узникам».
  rationale: Глагол допускает значение сочувствия или сострадания, однако приставка συν- и контекст преследований в Евр. 10:32–34 позволяют подчеркнуть сопричастность их страданиям. Альтернатива отмечена в сноске, чтобы сохранить лексическую широту.
- issue: Природа «лучшего и непреходящего достояния»
  choice: Оставлено общее обозначение лучшего и непреходящего достояния без уточнения его местонахождения или догматического содержания.
  alternative: «Лучшее и непреходящее достояние на небесах».
  rationale: В представленном тексте SBLGNT слов «на небесах» нет. Поэтому основной текст не конкретизирует, идёт ли речь о небесной награде, наследии или ином эсхатологическом благе; вариант рукописей приведён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Узники» и «достояние» сохраняют достоинство стиля, оставаясь понятными; синтаксис сделан плавным и близким к структуре греческого текста.
