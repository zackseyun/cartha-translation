  source_fidelity: 'Греческое συνεπαθήσατε с дательным δεσμίοις выражает солидарность/сопереживание заключённым. Вариант «разделили страдания узников» в целом возможен, но добавление «с узниками» точнее передаёт отношение, выраженное дательным падежом, и снимает оттенок простого описания страданий, принадлежащих узникам. Остальные смысловые компоненты переданы верно: насильственное отнятие имущества, радостное принятие утраты и лучшее, непреходящее достояние без внесения слова «небеса» в основной текст.'
  naturalness: Исправленный оборот «разделили страдания с узниками» естественен для современного литературного русского и сохраняет сдержанно возвышенный библейский регистр. «Разграбление имущества» и «непреходящее достояние» стилистически уместны.
  terminology: '«Узники», «разграбление», «имущество» и «достояние» выбраны удачно. «Достояние» позволяет сохранить общий характер ὕπαρξις и не предрешает, является ли оно имуществом, наследием или наградой. Сноски правильно привязаны: лексическая — к «узникам», текстологическая — к заключительной части стиха.'
