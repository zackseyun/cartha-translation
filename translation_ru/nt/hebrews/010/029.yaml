id: HEB.10.29
reference: Hebrews 10:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/029.yaml
  text: How much worse punishment do you think will be deserved by the one who has trampled underfoot the Son of God[a], and has regarded the blood of the covenant by which he was sanctified as common[c][b], and has insulted the Spirit of grace?
translation:
  language: ru
  text: Как вы думаете, насколько более сурового наказания заслужит тот, кто попрал Сына Божьего, счёл обыкновенной[a] кровь завета, которой был освящён[b], и оскорбил Духа благодати[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечистой»; или: «несвятой».'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте слова «которой был освящён» синтаксически связаны с описываемым человеком; однако их референт понимают по-разному. Перевод сохраняет неоднозначность и не разрешает богословский спор.
    reason: alternative_reading
  - marker: c
    text: 'Или: «надругался над Духом благодати».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ ... χείρονος
  choice: насколько более сурового
  rationale: Передаёт сравнительную силу риторического вопроса естественным русским оборотом; «сурового» ясно соотносится с наказанием.
- source_word: ἀξιωθήσεται τιμωρίας
  choice: наказания заслужит
  rationale: Естественно передаёт пассивное «будет признан достойным наказания», сохраняя судебный смысл.
- source_word: καταπατήσας
  choice: попрал
  rationale: Сохраняет яркую метафору презрительного попрания и соответствует возвышенному регистру.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: Сына Божьего
  rationale: Точная и общепринятая передача христологического титула.
- source_word: κοινὸν ἡγησάμενος
  choice: счёл обыкновенной
  rationale: «Обыкновенной» сохраняет основное противопоставление святому, не сводя значение однозначно к ритуальной нечистоте или профанации.
- source_word: τὸ αἷμα τῆς διαθήκης
  choice: кровь завета
  rationale: Сохраняет библейскую заветную и жертвенную формулу.
- source_word: ἐν ᾧ ἡγιάσθη
  choice: которой был освящён
  rationale: Творительно-инструментальное прочтение естественно в контексте; форма сохраняет неопределённый субъект греческого пассива.
- source_word: ἐνυβρίσας
  choice: оскорбил
  rationale: Передаёт дерзкое и презрительное обращение ясным современным словом; более сильный оттенок отмечен в сноске.
- source_word: τὸ πνεῦμα τῆς χάριτος
  choice: Духа благодати
  rationale: Формально и естественно сохраняет значимое богословское словосочетание.
theological_decisions:
- issue: К кому относится «был освящён» (ἐν ᾧ ἡγιάσθη)
  choice: Сохранена прямая синтаксическая связь с описываемым нарушителем без добавления явного местоимения.
  alternative: Понимать освящённым Христа, кровь либо общину завета.
  rationale: Ближайший грамматический референт — человек, описанный причастиями, однако вопрос богословски спорен. Русская формулировка следует греческому синтаксису и не разрешает спор сверх сказанного в тексте.
- issue: Значение κοινόν применительно к крови завета
  choice: обыкновенной
  alternative: нечистой; несвятой; осквернённой
  rationale: Основное противопоставление — между обычным и святым. Выбранный вариант сохраняет святотатственный смысл, не навязывая более узкого ритуального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и риторической силой оригинала. «Попрал» и «кровь завета» сохраняют библейскую образность, тогда как структура вопроса остаётся понятной обычному читателю.
