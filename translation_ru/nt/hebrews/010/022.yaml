reference: Hebrews 10:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: προσερχώμεθα μετὰ ἀληθινῆς καρδίας ἐν πληροφορίᾳ πίστεως, ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς καὶ λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/022.yaml
  text: let us draw near with a true heart in full assurance of faith[d][c][b][a], with our hearts sprinkled clean from an evil conscience and our bodies washed with pure water.
translation:
  language: ru
  text: будем приближаться с истинным сердцем[a], в полной уверенности веры, с сердцами, очищенными через окропление от порочной совести[b][d], и с телами, омытыми чистой водой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с искренним сердцем».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от совести, отягощённой виной».'
    reason: lexical_alternative
  - marker: c
    text: Эти образы могут напоминать язык обрядового очищения; некоторые читатели также видят здесь отзвук крещения, однако сам стих прямо не отождествляет с ним омовение.
    reason: cultural_note
  - marker: d
    text: 'Буквально: «с сердцами, окроплёнными от порочной совести». В переводе явно выражен подразумеваемый результат окропления — очищение.'
    reason: translation_note
lexical_decisions:
- source_word: προσερχώμεθα
  choice: будем приближаться
  rationale: Увещевательное сослагательное наклонение первого лица множественного числа передано естественным русским призывом; глагол сохраняет тему приближения к Богу, важную для Послания к евреям.
- source_word: ἀληθινῆς καρδίας
  choice: с истинным сердцем
  rationale: «Истинное» сохраняет широту ἀληθινός — подлинное, настоящее, искреннее — и не сводит выражение только к субъективной искренности.
- source_word: ἐν πληροφορίᾳ πίστεως
  choice: в полной уверенности веры
  rationale: Передаёт полноту и твёрдость уверенности, выраженную πληροφορία, сохраняя связь этой уверенности с верой.
- source_word: ῥεραντισμένοι τὰς καρδίας
  choice: с сердцами, очищенными через окропление
  rationale: Русская формулировка сохраняет образ окропления и ясно выражает состояние очищенности, подразумеваемое контекстом и конструкцией с ἀπό.
- source_word: ἀπὸ συνειδήσεως πονηρᾶς
  choice: от порочной совести
  rationale: «Порочная» сохраняет нравственную широту πονηρός и не сужает смысл до одного лишь чувства вины.
- source_word: λελουσμένοι τὸ σῶμα
  choice: с телами, омытыми
  rationale: Совершенное причастие передано как достигнутое состояние; греческое единственное число имеет распределительное значение, поэтому по-русски естественно множественное «телами».
- source_word: ὕδατι καθαρῷ
  choice: чистой водой
  rationale: «Чистая» естественно передаёт καθαρός и сохраняет как обычный, так и обрядовый оттенок очищения.
theological_decisions:
- issue: Следует ли прямо отождествить омовение с христианским крещением
  choice: Сохранить образы окропления и омовения, не называя их прямо крещением
  alternative: Передать выражение как явную ссылку на крещение либо истолковать его исключительно как внутреннее очищение
  rationale: Стих использует язык обрядового очищения, который может вызывать ассоциацию с крещением, левитскими очищениями или обоими образами, но сам текст не устанавливает однозначного отождествления.
- issue: Следует ли передать πονηρᾶς как указание именно на чувство вины
  choice: порочной совести
  alternative: виновной совести / совести, отягощённой виной
  rationale: Греческое слово означает зло или порочность шире, чем психологическое переживание виновности; выбранный вариант сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Синтаксический параллелизм двух совершенных причастий сохранён конструкциями «с сердцами…» и «с телами…»; культовая образность не устранена и не получила конфессионально узкого толкования.
