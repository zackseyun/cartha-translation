  source_fidelity: Перевод точно передаёт увещевательное προσερχώμεθα («будем приближаться»), качества сердца и уверенности веры, а также параллельные совершенные состояния очищения сердца и омовения тела. «Очищенными через окропление от порочной совести» эксплицирует очистительный результат образа ῥεραντισμένοι … ἀπό, не отождествляя омовение с крещением.
  naturalness: Современный литературный русский звучит естественно и сохраняет уместно возвышенный библейский регистр. Синтаксический параллелизм «с сердцами… и с телами…» ясен; множественное число «сердцами/телами» естественно при обращении к группе.
  terminology: «Истинным сердцем», «полной уверенности веры», «порочной совести», «окропление» и «омытыми чистой водой» адекватно сохраняют лексику и образность оригинала. «Порочная» не сужает πονηρά до психологического чувства вины. Сноска о возможной связи с крещением сформулирована нейтрально и не навязывает конфессионального вывода.
