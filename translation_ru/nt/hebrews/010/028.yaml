  text: ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/028.yaml
  text: Anyone who has set aside the law of Moses dies without mercy on the testimony of two or three witnesses[a].
translation:
  language: ru
  text: Кто отверг закон Моисея, тот без милосердия умирает на основании показаний двух или трёх свидетелей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предаётся смерти». Буквально в греческом тексте — «умирает», но речь идёт о смертной казни по закону Моисея.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετήσας
  choice: отверг
  rationale: Глагол ἀθετέω здесь выражает отвержение или пренебрежение обязательной силой закона. «Отверг» естественно по-русски и не сужает смысл до отдельного нарушения.
- source_word: τις
  choice: кто … тот
  rationale: Неопределённое местоимение имеет обобщающий смысл; русская конструкция «кто … тот» ясно передаёт его и сохраняет форму общего правового положения.
- source_word: νόμον Μωϋσέως
  choice: закон Моисея
  rationale: Прямое и общепонятное соответствие греческой родительной конструкции.
- source_word: χωρὶς οἰκτιρμῶν
  choice: без милосердия
  rationale: Хотя οἰκτιρμῶν стоит во множественном числе, по-русски здесь естественно отвлечённое существительное в единственном числе; выражение соответствует судебному контексту.
- source_word: ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν
  choice: на основании показаний двух или трёх свидетелей
  rationale: ἐπί с дательным обозначает основание решения. Добавление «показаний» естественно раскрывает подразумеваемый юридический смысл, не изменяя содержания.
- source_word: ἀποθνῄσκει
  choice: умирает
  rationale: Настоящее время выражает общее правовое следствие. «Умирает» формально сохраняет значение греческого глагола, тогда как судебная казнь следует из контекста.
theological_decisions:
- issue: Следует ли прямо выражать судебную казнь в переводе ἀποθνῄσκει
  choice: В основном тексте оставить «умирает».
  alternative: «предаётся смерти» или «должен быть предан смерти»
  rationale: Контекст закона Моисея подразумевает смертную казнь, однако сам греческий глагол буквально означает «умирает». Основной текст сохраняет сдержанность источника, а примечание сообщает допустимое контекстуальное прочтение.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет достоинство и юридический оттенок оригинала. Конструкция «кто … тот» делает обобщённое положение естественным и ясным.
