  source_fidelity: Перевод верно передаёт противопоставление ἀλλ’, отсылку αὐταῖς к ранее упомянутым жертвам, смысл ἀνάμνησις как напоминания о грехах и ежегодную повторяемость κατ’ ἐνιαυτόν. Активная русская перестройка («жертвы… напоминают») естественно выражает смысл греческой локативной конструкции «в них — напоминание» и не вносит нового содержания.
  naturalness: «Но эти жертвы из года в год напоминают о грехах» — краткая, ясная и литературно естественная фраза современного русского языка. Порядок слов и оборот «из года в год» звучат уместно в контексте аргумента Послания.
  terminology: «Жертвы» точно передаёт подразумеваемый референт αὐταῖς; «грехи» и «напоминают о» являются нейтральными и общеупотребительными соответствиями. Не навязывается специфическое богословское толкование или конкретизация обряда.
