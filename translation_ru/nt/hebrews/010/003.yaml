  text: ἀλλ’ ἐν αὐταῖς ἀνάμνησις ἁμαρτιῶν κατ’ ἐνιαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/003.yaml
  text: But in these sacrifices there is a reminder of sins year after year,[a]
translation:
  language: ru
  text: Но эти жертвы из года в год напоминают о грехах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждый год».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Но
  rationale: 'Передаёт противопоставление предыдущему утверждению: жертвы не могут сделать приходящих совершенными, но служат напоминанием о грехах.'
- source_word: ἐν αὐταῖς
  choice: эти жертвы
  rationale: Местоимение женского рода множественного числа отсылает к жертвам из предыдущего контекста. В русском естественнее выразить это как подлежащее «эти жертвы» при глаголе «напоминают».
- source_word: ἀνάμνησις
  choice: напоминают
  rationale: Существительное означает напоминание, приведение на память. Глагольная перестройка создаёт естественную русскую фразу, сохраняя смысл.
- source_word: ἁμαρτιῶν
  choice: о грехах
  rationale: При русском глаголе «напоминать» содержание воспоминания естественно оформляется предложным сочетанием «о грехах».
- source_word: κατ’ ἐνιαυτόν
  choice: из года в год
  rationale: Передаёт ежегодную повторяемость и подчёркивает продолжающийся характер жертвоприношений в рассуждении Послания.
theological_decisions:
- issue: Референт αὐταῖς
  choice: Явно назвать «эти жертвы».
  alternative: 'Сохранить местоименное выражение: «в них».'
  rationale: Ближайший контекст говорит о постоянно приносимых жертвах. Экспликация референта устраняет неясность русского местоимения, не добавляя нового богословского содержания.
- issue: Синтаксическая роль жертв в напоминании
  choice: 'Передать конструкцию естественной активной фразой: «эти жертвы… напоминают».'
  alternative: 'Формально сохранить именную конструкцию: «в этих жертвах — напоминание о грехах».'
  rationale: Греческое ἐν αὐταῖς допускает буквальную локативную передачу, однако активная русская конструкция ясно выражает ту же функцию жертв и не утверждает, что они являются единственным действующим субъектом обряда.
- issue: Сила κατ’ ἐνιαυτόν
  choice: «из года в год» — повторяющееся ежегодное напоминание.
  alternative: «каждый год» или «ежегодно».
  rationale: Выбранный оборот подчёркивает повторяемость, существенную для аргумента автора, не уточняя сверх текста конкретный праздник или обряд.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Глагольная перестройка делает стих естественным по-русски, а сноска сохраняет более нейтральную временную альтернативу.
