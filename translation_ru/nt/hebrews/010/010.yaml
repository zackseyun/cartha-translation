  yaml_path: translation/nt/hebrews/010/010.yaml
  text: By that will we have been sanctified through the offering of the body of Jesus the Messiah once for all[a][b].
translation:
  language: ru
  text: По этой воле мы освящены через принесение в жертву тела Иисуса, Мессии, раз и навсегда[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «в этой воле». Речь идёт о Божьей воле, упомянутой выше.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Иисуса Христа». Греческое Χριστός означает «Мессия» и здесь может пониматься как титул.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ θελήματι
  choice: По этой воле
  rationale: Оборот отсылает к Божьей воле, упомянутой выше. «По этой воле» естественно по-русски передаёт основание или определяющую волю, сохраняя связь с контекстом; более буквальное «в этой воле» возможно, но менее ясно.
- source_word: ἡγιασμένοι ἐσμὲν
  choice: мы освящены
  rationale: Перифрастический перфект обозначает совершившееся освящение с сохраняющимся результатом. Русская краткая форма «освящены» естественно выражает нынешнее состояние как результат действия, не превращая его в продолжающийся процесс.
- source_word: διὰ τῆς προσφορᾶς
  choice: принесением
  rationale: διά с родительным указывает на средство, а προσφορά — на приношение. Творительный падеж кратко и естественно передаёт инструментальное значение всего оборота.
- source_word: τοῦ σώματος
  choice: тела
  rationale: Сохранена явная ссылка на тело, конкретность телесного самоприношения Иисуса и структура зависимых родительных падежей.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь сохраняет смысл титула «Мессия». Русское сочетание без добавленного артикля естественно и непосредственно передаёт греческую форму имени и титула.
- source_word: ἐφάπαξ
  choice: раз и навсегда
  rationale: Выражение передаёт однократный, окончательный и неповторимый характер принесения; по-русски это яснее, чем одно «однажды».
theological_decisions:
- issue: Вид и богословская сила освящения
  choice: «мы освящены» — совершившееся действие с сохраняющимся результатом
  alternative: «мы освящаемся» или «мы были освящены»
  rationale: Греческий перифрастический перфект не обозначает продолжающийся процесс. Краткое страдательное причастие сохраняет результирующее состояние, не навязывая частной доктринальной схемы.
- issue: Значение Χριστός
  choice: «Мессия» как титул
  alternative: «Христос»
  rationale: Перевод титула раскрывает его исходное значение. В сноске указана традиционная русская форма, поскольку в данном сочетании возможна и более именная интерпретация.
- issue: Сила ἐφάπαξ
  choice: «раз и навсегда»
  alternative: «однажды»
  rationale: Выбранная формулировка сохраняет подчёркнутую окончательность и неповторимость принесения, не добавляя объяснения сверх значения наречия.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно высоким библейским регистром. Формулировка краткая и пригодна для публичного чтения; термин «освящены» сохраняет богословскую лексику, оставаясь понятным в контексте.
