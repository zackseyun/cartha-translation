  text: φοβερὰ δέ τις ἐκδοχὴ κρίσεως καὶ πυρὸς ζῆλος ἐσθίειν μέλλοντος τοὺς ὑπεναντίους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/027.yaml
  text: but a fearful expectation of judgment[a], and a fury of fire about to consume the adversaries.
translation:
  language: ru
  text: но страшное ожидание суда и ярость огня, готовая поглотить противников.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, при другом синтаксическом соотнесении: «ярость огня, которому предстоит поглотить противников». Греческая форма «готовая/которому предстоит» может относиться к «ярости» или к «огню».'
    reason: Лексическая и синтаксическая неоднозначность выражения πυρὸς ζῆλος … μέλλοντος.
lexical_decisions:
- source_word: φοβερὰ
  choice: страшное
  rationale: Передаёт предикативное определение к ἐκδοχή и суровый тон предупреждения без усиления до более толковательного «ужасающее».
- source_word: δέ
  choice: но
  rationale: Выражает противопоставление отрицанию предыдущего стиха.
- source_word: τις
  choice: некое
  rationale: Сохраняет неопределённость местоимения; в сочетании «некое страшное ожидание» звучит литературно и естественно.
- source_word: ἐκδοχὴ κρίσεως
  choice: ожидание суда
  rationale: Прямо передаёт ожидание предстоящего судебного решения, не сужая κρίσις до заранее истолкованного «осуждения».
- source_word: πυρὸς ζῆλος
  choice: огненная ярость
  rationale: Естественно передаёт образ неистового, пожирающего огня; буквальная «ревность огня» в современном русском затемнила бы смысл.
- source_word: ἐσθίειν
  choice: поглотить
  rationale: Сохраняет образ уничтожающего действия огня и звучит естественнее буквального «съесть».
- source_word: μέλλοντος
  choice: готовая
  rationale: Передаёт направленность к предстоящему действию и его близость, не вводя идеи предопределённости.
- source_word: τοὺς ὑπεναντίους
  choice: противников
  rationale: Сохраняет формальный смысл тех, кто находится в противостоянии, не уточняя в самом переводе объект их вражды.
theological_decisions:
- issue: Характер образа суда
  choice: Сохранён образ огненной ярости, которая поглотит противников, без пояснения продолжительности или окончательного характера наказания.
  alternative: Истолковать образ как прямое указание на вечное наказание либо ослабить его до общей метафоры бедствия.
  rationale: Стих говорит о грозном Божьем суде, но сам по себе не определяет всех его догматических подробностей.
- issue: Связь причастия μέλλοντος
  choice: «готовая» согласовано со всей естественной русской формулировкой «огненная ярость».
  alternative: 'Понимать причастие как относящееся непосредственно к «огню»: «огня, готового поглотить».'
  rationale: В греческом родительный падеж допускает формальную связь как с ζῆλος, так и с πυρός; выбранная формулировка сохраняет цельность образа, а примечание отмечает альтернативную синтаксическую передачу.
translation_notes:
  register: Современный литературный русский язык с торжественным и грозным звучанием. «Некоe» сохраняет неопределённость τις, а «огненная ярость» делает сжатый греческий образ понятным без его богословского расширения.
