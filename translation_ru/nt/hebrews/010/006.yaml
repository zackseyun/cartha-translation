  text: всесожжения и жертвы за грех Тебе не были угодны[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всесожжения и приношения за грех не доставляли Тебе удовольствия». Греческое выражение «за грех» — устойчивое жертвенное обозначение приношения, совершаемого за грех.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁλοκαυτώματα
  choice: всесожжения
  rationale: Устоявшийся русский библейский термин для жертв, целиком сжигавшихся на жертвеннике; точно передаёт особую категорию жертвоприношения.
- source_word: καὶ
  choice: и
  rationale: Простой сочинительный союз, связывающий две категории жертв.
- source_word: περὶ ἁμαρτίας
  choice: жертвы за грех
  rationale: В жертвенном контексте это идиоматическое обозначение приношений за грех. Слово «жертвы» добавлено для ясности и естественности по-русски.
- source_word: οὐκ εὐδόκησας
  choice: Тебе не были угодны
  rationale: Передаёт отрицание и оценочно-волевой смысл εὐδοκέω, сохраняя обращение к Богу во втором лице; форма множественного числа естественно согласуется с названными видами жертв.
theological_decisions:
- issue: Передача жертвенной терминологии в цитате из Псалма 39 по Септуагинте
  choice: 'Сохранить конкретные категории: «всесожжения» и «жертвы за грех»'
  alternative: «всесожжения и приношения за грех»
  rationale: Конкретная терминология позволяет проследить аргумент Послания к евреям о различных видах жертв, не сводя их к общему слову «жертвы» и не добавляя богословского истолкования.
- issue: Смысл οὐκ εὐδόκησας
  choice: «Тебе не были угодны»
  alternative: «Ты не благоволил к ним» / «Ты не находил в них удовольствия»
  rationale: 'Выбранный вариант естественен для современного литературного русского и сохраняет напряжение текста: говорится о Божьем неблаговолении к этим жертвам в контексте цитаты, без пояснения причин или абсолютной отмены их прежнего установления.'
translation_notes:
  register: Современный литературный русский с сохранением традиционного и точного культового термина «всесожжение». Прописная буква в «Тебе» отмечает обращение к Богу в рамках принятой русской библейской стилистики.
