  text: ὁ δὲ δίκαιός ⸀μου ἐκ πίστεως ζήσεται, καὶ ἐὰν ὑποστείληται, οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
translation:
  language: ru
  text: Но мой[b] праведник будет жить верой[a]; и если он[c] отступит, моя душа не благоволит к нему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верностью» или «доверием». Греческое слово πίστις допускает эти значения; в основном тексте оно передано словом «вера».'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях: «праведник» — без слова «мой».'
    reason: textual_variant
  - marker: c
    text: Мужской род и единственное число («праведник», «он», «нему») передают грамматику греческого текста и употреблены в представительном, а не обязательно исключительно мужском смысле.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ δίκαιός μου
  choice: Но Мой праведник
  rationale: Субстантивированное прилагательное передано существительным «праведник»; местоимение μου сохранено согласно тексту SBLGNT. «Но» естественно передаёт δέ и связь с предшествующим контекстом.
- source_word: ἐκ πίστεως
  choice: верой
  rationale: Творительный падеж естественно выражает основание или средство жизни. «Вера» сохраняет основное значение πίστις, а возможные значения «верность» и «доверие» отмечены в сноске.
- source_word: ζήσεται
  choice: будет жить
  rationale: Прямая передача формы будущего времени ζάω современным русским выражением.
- source_word: ὑποστείληται
  choice: отступит
  rationale: В данном предостерегающем контексте глагол означает попятиться, уклониться или отступить под давлением. «Отступит» звучит естественно и не добавляет причины отступления.
- source_word: οὐκ εὐδοκεῖ
  choice: не благоволит
  rationale: Глагол означает «не испытывает благоволения, не находит удовольствия». «Не благоволит» сохраняет личный и возвышенный характер цитаты, оставаясь понятным в современном литературном русском.
- source_word: ἡ ψυχή μου
  choice: душа Моя
  rationale: Буквальный образ исходного текста сохранён, а не сглажен до простого «Я».
- source_word: ἐν αὐτῷ
  choice: к нему
  rationale: При русском глаголе «благоволить» нормативно управление «к кому»; это естественная передача греческого ἐν αὐτῷ в данном сочетании.
theological_decisions:
- issue: Значение πίστις в выражении ἐκ πίστεως
  choice: вера
  alternative: верность; доверие
  rationale: Основной текст сохраняет обычное богословски нейтральное соответствие «вера», не исключая засвидетельствованных контекстуальных оттенков, вынесенных в сноску.
- issue: Субъект выражения «если он отступит»
  choice: грамматически соотнести «он» с названным ранее праведником
  alternative: 'понимать как неопределённое другое лицо: «если кто отступит»'
  rationale: Греческий текст продолжает речь в единственном числе и явно не вводит нового субъекта. Перевод сохраняет возникающее богословское напряжение и не смягчает предостережение.
- issue: Мужской род как представительная форма
  choice: сохранить формы «праведник», «он», «к нему»
  alternative: использовать обобщённую конструкцию без указания рода
  rationale: Формы мужского рода соответствуют греческой грамматике и в данном изречении имеют обобщающее значение; отдельная культурная сноска в русском тексте не требуется.
- issue: Текстовый вариант при μου
  choice: Мой праведник
  alternative: праведник
  rationale: Принято чтение SBLGNT с μου; вариант без местоимения документирован в сноске, не смешиваясь с основным текстом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Инверсия «душа Моя» сохраняет формулу цитируемого Писания; остальной синтаксис остаётся ясным и естественным.
