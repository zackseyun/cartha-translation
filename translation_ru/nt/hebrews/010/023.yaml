  source_fidelity: «Будем непоколебимо держаться исповедания нашей надежды» точно передаёт увещевательное κατέχωμεν, объект ὁμολογίαν, добавленный оттенок твёрдости ἀκλινῆ и τῆς ἐλπίδος. «Нашей» отсутствует в греческом, но допустимо как естественное уточнение для адресованной общине речи и надлежащим образом оговорено в сноске. «Верен тот, кто обещал» сохраняет неявное обозначение субъекта и смысл πιστός + ὁ ἐπαγγειλάμενος.
