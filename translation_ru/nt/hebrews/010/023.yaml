  text: κατέχωμεν τὴν ὁμολογίαν τῆς ἐλπίδος ἀκλινῆ, πιστὸς γὰρ ὁ ἐπαγγειλάμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/023.yaml
  text: Let us hold fast the confession of our hope without wavering[a], for the one who promised is faithful.
translation:
  language: ru
  text: Будем непоколебимо держаться исповедания нашей надежды[a], ведь верен тот, кто обещал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исповедания надежды». В греческом тексте слово «нашей» прямо не выражено.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέχωμεν
  choice: будем держаться
  rationale: Форма настоящего сослагательного наклонения первого лица множественного числа выражает совместное побуждение; «будем держаться» естественно передаёт призыв сохранять твёрдую приверженность.
- source_word: ὁμολογίαν
  choice: исповедания
  rationale: Слово обозначает открытое признание или провозглашение веры; «исповедание» сохраняет этот публичный и религиозный оттенок.
- source_word: τῆς ἐλπίδος
  choice: нашей надежды
  rationale: В греческом притяжательное местоимение отсутствует, но в русском контексте общего призыва «нашей» естественно указывает на надежду, которую исповедует община; буквальная возможность отмечена в сноске.
- source_word: ἀκλινῆ
  choice: непоколебимо
  rationale: Передаёт отсутствие уклонения или колебания и в русском естественно относится к призыву твёрдо держаться исповедания.
- source_word: πιστὸς
  choice: верен
  rationale: Сохраняет смысл надёжности и верности обещанию, а также богословскую выразительность исходного слова.
- source_word: ὁ ἐπαγγειλάμενος
  choice: тот, кто обещал
  rationale: Субстантивированное причастие указывает на давшего обещание. Перевод оставляет его личность не названной прямо, как и греческий текст.
theological_decisions:
- issue: Кто именно назван «тем, кто обещал»
  choice: Референт, подразумеваемый как Бог, не назван прямо.
  alternative: «Бог, который обещал»
  rationale: Контекст указывает на Бога, однако исходный текст не называет его непосредственно; сохранение неявного референта предотвращает излишнее истолковательное расширение.
- issue: Притяжательное местоимение при слове «надежда»
  choice: В основном тексте добавлено «нашей» ради естественного русского выражения.
  alternative: «исповедания надежды»
  rationale: Общий призыв ясно относится к надежде адресатов, но греческий текст формально не содержит местоимения; поэтому буквальная форма сохранена как вариант в сноске.
translation_notes:
  register: Современный литературный русский язык; тон увещевательный и достойный, без архаизации. Строчная буква в выражении «тот, кто обещал» сохраняет неявность референта исходного текста.
