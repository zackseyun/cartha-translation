lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Кратко и естественно передаёт временное наречие, вводящее ответ в цитате.
- source_word: εἶπον
  choice: я сказал
  rationale: Обычный повествовательный эквивалент аориста λέγω в формуле, вводящей прямую речь.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Сохраняет указательную и торжественную силу слова, оставаясь естественным для современного русского языка.
- source_word: ἥκω
  choice: я пришёл
  rationale: Хотя форма настоящего времени, глагол обозначает состоявшееся прибытие с актуальным результатом; русское прошедшее совершенного вида передаёт это естественно.
- source_word: ἐν κεφαλίδι βιβλίου
  choice: в свитке книги
  rationale: Передаёт древний книжный свиток, а не заголовок или современную переплетённую книгу; сохраняет оба элемента греческого выражения.
- source_word: γέγραπται
  choice: написано
  rationale: Естественная русская формула для перфекта страдательного залога, указывающая на текст, который остаётся написанным.
- source_word: περὶ ἐμοῦ
  choice: обо мне
  rationale: Прямой и современный эквивалент περί с родительным падежом.
- source_word: τοῦ ποιῆσαι
  choice: чтобы исполнить
  rationale: Передаёт целевое значение артиклевого инфинитива; «исполнить волю» — естественное русское сочетание, соответствующее значению ποιέω в данном контексте.
- source_word: ὁ θεός
  choice: Боже
  rationale: Номинатив имеет функцию обращения; русский звательный остаток «Боже» ясно и торжественно передаёт прямое обращение.
- source_word: τὸ θέλημά σου
  choice: Твою волю
  rationale: Сохраняет ключевое понятие θέλημα и прямое обращение к Богу; прописная буква соответствует принятому благоговейному библейскому регистру.
theological_decisions:
- issue: Мессианское самоотнесение цитаты из Псалма в Послании к евреям
  choice: Сохранить речь от первого лица без добавочного обозначения говорящего как Мессии или Христа.
  alternative: Явно назвать говорящего Мессией в основном тексте.
  rationale: Контекст Послания относит эти слова к Сыну, однако сам стих содержит только заявление от первого лица. Перевод не должен вносить в цитату пояснение, которое даёт окружающий контекст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Вот» сохраняет отмеченную указательность Ἰδοὺ, а тире передают вставной характер слов о свитке. Божественные местоимения написаны с прописной буквы в соответствии с благоговейным русским библейским регистром.
