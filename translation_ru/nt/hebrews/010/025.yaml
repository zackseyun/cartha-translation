  text: μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ παρακαλοῦντες, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/025.yaml
  text: not neglecting our own gathering together[a], as is the habit of some[b], but encouraging one another—and all the more as you see the Day drawing near.
translation:
  language: ru
  text: не пренебрегая нашим собранием[a], как это вошло в привычку у некоторых, но ободряя друг друга — и тем более по мере того, как вы видите приближение Дня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не оставляя» или «не покидая нашего собрания».'
    reason: lexical_alternative
  - marker: b
    text: «День», вероятно, означает грядущий День Господень или день окончательного суда.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγκαταλείποντες
  choice: не пренебрегая
  rationale: Причастие с μή продолжает увещание предыдущего стиха и обозначает отказ поддерживать сложившуюся практику либо её оставление. «Не пренебрегая» естественно звучит по-русски и не сводит смысл непременно к окончательному отпадению; более сильная возможность отражена в сноске.
- source_word: τὴν ἐπισυναγωγὴν ἑαυτῶν
  choice: нашими общими собраниями
  rationale: Существительное обозначает совместное собирание верующих, а возвратное местоимение подчёркивает принадлежность к общине адресатов. Русское множественное число идиоматично передаёт регулярные собрания и не привносит более позднего институционального понятия «богослужение».
- source_word: καθὼς ἔθος τισίν
  choice: как это вошло в привычку у некоторых
  rationale: ἔθος означает обычай или привычку. Формулировка сохраняет мягкий, но ясный укор автора и звучит естественно в современном русском языке.
- source_word: παρακαλοῦντες
  choice: ободряя друг друга
  rationale: Глагол может означать увещевание, ободрение или утешение. В контексте взаимного укрепления общины «ободряя» передаёт широкий смысл; взаимный объект, хотя и не выражен отдельно в греческом, очевиден из контекста.
- source_word: τοσούτῳ μᾶλλον ὅσῳ
  choice: и тем усерднее, чем ближе
  rationale: Соотносительная конструкция усиливает призыв по мере приближения Дня. «Тем усерднее, чем ближе» естественно передаёт пропорциональное нарастание, при этом наречие относится к ободрению друг друга.
- source_word: βλέπετε ἐγγίζουσαν τὴν ἡμέραν
  choice: чем ближе, как вы видите, тот День
  rationale: Формулировка сохраняет прямое утверждение адресатам о воспринимаемом ими приближении определённого Дня, не уточняя, какие именно признаки они видят.
theological_decisions:
- issue: Эсхатологическое значение выражения τὴν ἡμέραν
  choice: «тот День» с прописной буквы
  alternative: «день»; «День Господень»; «день суда»
  rationale: Определённость выражения и контекст стойкости указывают на известный читателям грядущий эсхатологический День. Прописная буква и указательное «тот» помогают передать эту узнаваемость, не добавляя отсутствующих в греческом слов «Господень» или «суда».
- issue: Взаимный объект при παρακαλοῦντες
  choice: «ободряя друг друга»
  alternative: «ободряя» без выраженного объекта; «увещевая друг друга»
  rationale: Взаимность подразумевается общинным контекстом и противопоставлением пренебрежению совместными собраниями. Её явное выражение необходимо для ясного и естественного русского текста, но не добавляет особого вероучительного положения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранена причастная форма, связывающая стих с предшествующим увещанием. «Общие собрания» избегает конфессионально и институционально нагруженных обозначений; тире перед усилением передаёт риторический акцент оригинала.
