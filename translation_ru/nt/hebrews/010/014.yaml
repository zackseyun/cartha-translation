  yaml_path: translation/nt/hebrews/010/014.yaml
  text: For by one offering he has perfected for all time those who are being sanctified[a].
translation:
  language: ru
  text: Ибо одним приношением Он навсегда сделал совершенными тех, кто освящается.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μιᾷ
  choice: одним
  rationale: Дательный падеж женского рода от εἷς согласуется с προσφορᾷ и подчёркивает единственность приношения.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительно-обосновывающую связь с предшествующим рассуждением и естественно звучит по-русски.
- source_word: προσφορᾷ
  choice: приношением
  rationale: Сохраняет широкое значение дара, принесённого Богу, не заменяя его более толковательным словом «жертва».
- source_word: τετελείωκεν
  choice: сделал совершенными
  rationale: Перфект указывает на завершённое действие с сохраняющимся результатом; формулировка сохраняет связь с лексикой совершенства в Послании к евреям.
- source_word: εἰς τὸ διηνεκές
  choice: навсегда
  rationale: Естественно передаёт непреходящую силу и длительный результат единственного приношения.
- source_word: τοὺς ἁγιαζομένους
  choice: тех, кого освящает
  rationale: Настоящее пассивное причастие передано естественной русской конструкцией с продолжающимся действием; подразумеваемый деятель — Бог, что соответствует богословскому пассиву.
theological_decisions:
- issue: Соотношение завершённого совершенствования и продолжающегося освящения
  choice: 'Сохранить обе стороны: «сделал совершенными» и «кого освящает».'
  alternative: Истолковать обе формы только как уже завершённое положение либо ослабить завершённый результат ради исключительно постепенного процесса.
  rationale: Греческий текст намеренно соединяет завершённое действие с непреходящим результатом (τετελείωκεν) и настоящее пассивное причастие (ἁγιαζομένους). Перевод не устраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык; достоинство и ясность сочетаются с сохранением ключевой лексики Послания к евреям. Местоимение «Он» написано с прописной буквы как указание на Христа в ближайшем контексте.
