review_pass:
  verdict: revise
  source_fidelity: 'Основная передача верна: «одним приношением», завершённый результат «сделал совершенными» и длительность «навсегда» адекватно отражают μιᾷ προσφορᾷ, τετελείωκεν и εἰς τὸ διηνεκές. Однако τοὺς ἁγιαζομένους — настоящее страдательное причастие без названного деятеля. Формулировка «тех, кого освящает» вводит в основной текст подразумеваемого деятеля и превращает пассивную форму в активную конструкцию.'
  naturalness: «Ибо» уместно в современном литературном переводе Послания к евреям и яснее передаёт аргументативную функцию γάρ, чем несколько разговорное «ведь». «Тех, кто освящается» естественно, компактно и сохраняет продолжающийся характер причастия.
  terminology: «Приношение» удачно сохраняет термин προσφορά, не сужая его заранее до «жертвы». «Сделал совершенными» сохраняет связь с τελειόω. «Освящается» передаёт ἁγιάζω и не навязывает эксплицитного деятеля.
  issues:
  - severity: medium
    issue: В основном тексте пассивное причастие передано активной относительной конструкцией с подразумеваемым деятелем.
    rationale: «Тех, кого освящает» предполагает, что освящающий — Он/Бог; это вероятно по контексту, но в греческой форме деятель не выражен. Прямой пассив «тех, кто освящается» точнее сохраняет грамматику и оставляет требуемую неоднозначность.
  - severity: low
    issue: Союз «Ведь» несколько снижает регистр аргументативного перехода.
    rationale: γάρ вводит обоснование. «Ибо» является естественным литературным соответствием в данном жанре, не меняя смысла.
  revised_text: Ибо одним приношением Он навсегда сделал совершенными тех, кто освящается.
