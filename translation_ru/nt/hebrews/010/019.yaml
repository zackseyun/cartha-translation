source:
  edition: SBLGNT
  text: Ἔχοντες οὖν, ἀδελφοί, παρρησίαν εἰς τὴν εἴσοδον τῶν ἁγίων ἐν τῷ αἵματι Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/019.yaml
  text: Therefore, brothers, since we have boldness to enter the holy places by the blood of Jesus,
translation:
  language: ru
  text: Итак, братья[a], имея дерзновение входить во святилище[b] благодаря крови Иисуса,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; греческое слово буквально означает «братья» и здесь может представительно обращаться ко всей общине.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в святые места»; в образности скинии речь идёт о святом пространстве Божьего присутствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: Итак, … имея
  rationale: Причастная конструкция сохранена, поскольку стих продолжается в следующем контексте и называет основание последующего призыва; «итак» передаёт вывод из предшествующего рассуждения.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужскую форму обращения в греческом тексте; возможное обращение ко всей общине пояснено в сноске.
- source_word: παρρησίαν
  choice: дерзновение
  rationale: Передаёт уверенную и свободную смелость приближения к Богу; это слово сохраняет сильный оттенок исходного термина и уместно в возвышенном библейском регистре.
- source_word: εἰς τὴν εἴσοδον
  choice: входить
  rationale: Естественно по-русски передаёт буквальное «для входа / вхождения», не превращая доступ лишь в отвлечённое понятие.
- source_word: τῶν ἁγίων
  choice: во святилище
  rationale: В контексте храмовой и скинийной образности Послания речь идёт о святом пространстве Божьего присутствия. Русское единственное число естественно обозначает священную область, не сужая значение непременно до Святого святых.
- source_word: ἐν τῷ αἵματι Ἰησοῦ
  choice: благодаря крови Иисуса
  rationale: Передаёт кровь Иисуса как основание и средство доступа; «благодаря» звучит естественно и не устраняет жертвенный смысл выражения.
theological_decisions:
- issue: Значение τῶν ἁγίων
  choice: пространственное и культовое обозначение святилища Божьего присутствия
  alternative: «святые места»; более узкое «Святое святых»; вне контекста возможно «святые»
  rationale: Последовательная образность скинии в Послании к евреям указывает на святилище. «Святое святых» было бы более узким толкованием, чем требует данное выражение.
- issue: Кого охватывает обращение ἀδελφοί
  choice: «братья» в основном тексте с пояснением в сноске
  alternative: «братья и сёстры»
  rationale: Основной текст сохраняет форму оригинала, а сноска сообщает вероятную представительную обращённость ко всей общине.
- issue: Смысл ἐν в выражении о крови Иисуса
  choice: основание или средство доступа — «благодаря крови Иисуса»
  alternative: буквальное «в крови Иисуса»; «через кровь Иисуса»
  rationale: Контекст связывает возможность входа с жертвенной смертью Иисуса. Формулировка сохраняет причинно-инструментальную широту и не добавляет отдельной доктринальной схемы.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранена незавершённость синтаксиса стиха: причастный оборот ведёт к дальнейшему призыву в стихах 22–23. «Дерзновение» выбрано как понятное в церковно-библейском контексте и более сильное, чем нейтральная «уверенность».'
