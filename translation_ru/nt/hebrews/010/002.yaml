base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
translation:
  language: ru
  text: Иначе[a] разве не перестали бы их приносить, потому что поклоняющиеся, однажды очищенные[b], уже не имели бы никакого сознания грехов?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Ведь тогда». Здесь греческое слово вводит предполагаемое следствие: если бы жертвы действительно очищали совесть, их перестали бы приносить.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «раз и навсегда очищенные». Греческое слово может подчёркивать окончательный, неповторимый характер очищения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Иначе
  rationale: В данном контексте вводит контрфактическое следствие из предыдущего стиха; «иначе» естественно передаёт ход рассуждения.
- source_word: οὐκ ἂν ἐπαύσαντο προσφερόμεναι
  choice: разве не перестали бы их приносить?
  rationale: Сочетание οὐκ ἄν с аористом образует контрфактический риторический вопрос; местоимение «их» относится к жертвам из предыдущего стиха, а активная русская конструкция естественно передаёт греческий пассив.
- source_word: διὰ τὸ μηδεμίαν ἔχειν ἔτι
  choice: Ведь тогда ... больше не было бы
  rationale: Оборот с διά и артиклевым инфинитивом указывает причину; «ведь тогда» ясно связывает её с предполагаемым прекращением жертвоприношений, а «больше не» передаёт ἔτι при отрицании.
- source_word: συνείδησιν ἁμαρτιῶν
  choice: сознания грехов
  rationale: συνείδησις допускает значения «совесть», «сознание» и «осознание». Здесь речь идёт о сохраняющемся сознании грехов и вины перед Богом, а не об исчезновении нравственной восприимчивости.
- source_word: τοὺς λατρεύοντας
  choice: у совершающих богослужение
  rationale: Субстантивированное причастие обозначает людей, участвующих в культовом служении; этот вариант сохраняет глагольный оттенок λατρεύω и звучит достойно и понятно.
- source_word: ἅπαξ κεκαθαρισμένους
  choice: однажды очищенных
  rationale: Перфектное страдательное причастие обозначает совершившееся очищение с сохраняющимся результатом; ἅπαξ передано нейтрально как «однажды», без обязательного усиления «раз и навсегда» в основном тексте.
theological_decisions:
- issue: Значение συνείδησιν ἁμαρτιῶν после очищения поклоняющихся
  choice: «сознания грехов» — продолжающегося осознания греховности и вины перед Богом
  alternative: «совести, отягощённой грехами» или «осознания грехов»
  rationale: Так сохраняется аргумент автора о действенном очищении без утверждения, будто очищенные утрачивают нравственную совесть или способность распознавать грех.
- issue: Сила ἅπαξ
  choice: «однажды» в основном тексте
  alternative: «раз и навсегда»
  rationale: Контекст допускает окончательный и неповторимый характер очищения, однако само наречие здесь не требует безусловно выражать усиленный смысл; неоднозначность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Риторический вопрос и логическая связь с предыдущим стихом сохранены; синтаксис сделан естественным для русского языка без устранения лексической неоднозначности.
