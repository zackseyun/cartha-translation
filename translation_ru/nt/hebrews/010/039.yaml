source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς εἰς ἀπώλειαν, ἀλλὰ πίστεως εἰς περιποίησιν ψυχῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
translation:
  language: ru
  text: Мы же не из тех, кто отступает к погибели,[a] а из тех, чья вера[b] ведёт к сохранению души.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уклоняется», «идёт на попятную». Греческое слово обозначает отход или отступление; некоторые понимают его здесь в более сильном смысле — как отступничество от веры.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «верность». Здесь вера может включать стойкость и верность до конца.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «к обретению души», «к сохранению жизни». Греческое выражение может говорить о сохранении или обретении жизни, самого себя, а не только «души» в узком современном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Мы же
  rationale: Сохраняет подчёркнутое местоимение и противопоставление предыдущему предостережению; по-русски звучит естественно и достойно.
- source_word: οὐκ ἐσμὲν ὑποστολῆς
  choice: не из тех, кто отступает
  rationale: Родительный падеж категории передан естественной русской конструкцией «не из тех». «Отступает» выражает отход или попятное движение, не предрешая, что речь непременно идёт о полном вероотступничестве.
- source_word: εἰς ἀπώλειαν
  choice: к погибели
  rationale: Передаёт направленность или итог, выраженный εἰς, и сохраняет серьёзность исхода.
- source_word: ἀλλὰ πίστεως
  choice: а из тех, чья вера
  rationale: Сохраняет резкое противопоставление двух групп. Основным соответствием πίστις выбрана «вера», а возможный оттенок верности отмечен в сноске.
- source_word: εἰς περιποίησιν
  choice: ведёт к сохранению
  rationale: Добавление «ведёт» делает эллиптическую греческую конструкцию понятной по-русски, сохраняя направленность εἰς. «Сохранение» лучше всего соответствует контрасту с погибелью, хотя существительное допускает также смысл обретения или приобретения.
- source_word: ψυχῆς
  choice: души
  rationale: Традиционное и богословски весомое соответствие; более широкий смысл «жизнь», «сам человек» пояснён в сноске.
theological_decisions:
- issue: Значение πίστις в противопоставлении ὑποστολή
  choice: вера
  alternative: верность, стойкость в вере
  rationale: Контекст включает persevering доверие и верность, но не требует заменять основное значение «вера» более узким толкованием.
- issue: Значение περιποίησις ψυχῆς
  choice: сохранение души
  alternative: обретение души; сохранение жизни или самого себя
  rationale: Контраст с ἀπώλεια благоприятствует значению сохранения, однако лексическая неоднозначность существительного и широкий смысл ψυχή сохранены в примечании.
- issue: Степень отступления в ὑποστολή
  choice: отступает
  alternative: отступается от веры
  rationale: Греческое слово обозначает отход или уклонение; более сильное понимание как окончательного вероотступничества возможно, но не должно безоговорочно вноситься в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Конструкция «не из тех… а из тех…» естественно раскрывает греческие родительные падежи категории; добавленное «ведёт» проясняет параллельные обороты с εἰς, не устраняя смысловую неоднозначность, которая вынесена в сноски.
