lexical_decisions:
- source_word: μὴ ἀποβάλητε
  choice: не оставляйте
  rationale: Запрет с μή и аористным сослагательным наклонением предостерегает от сознательного отказа. «Не оставляйте» естественно по-русски и передаёт намеренное отвержение, а не случайную утрату.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего наставления и сохраняет логическую связь.
- source_word: τὴν παρρησίαν ὑμῶν
  choice: вашей уверенности
  rationale: В Послании к евреям παρρησία обозначает свободную, смелую уверенность перед Богом и стойкость в исповедании. «Уверенность» звучит естественно и не сводит значение только к манере речи; оттенок дерзновения отмечен в сноске.
- source_word: ἥτις ἔχει μεγάλην μισθαποδοσίαν
  choice: за неё полагается великая награда
  rationale: Греческая конструкция буквально говорит, что уверенность «имеет великую награду». Русская формулировка ясно и естественно передаёт связь, не уточняя сверх текста ни время, ни механизм воздаяния.
theological_decisions:
- issue: Значение παρρησία в Евр 10:35
  choice: уверенность, включающая свободу и смелость перед Богом и стойкость в исповедании
  alternative: дерзновение
  rationale: Контекст допускает как внутреннюю уверенность, так и её открытое, мужественное выражение. Основной текст сохраняет широкое значение, а сноска указывает важный оттенок, не ограничивая смысл одной конфессиональной трактовкой.
- issue: Характер μισθαποδοσία
  choice: великая награда
  alternative: великое воздаяние
  rationale: Положительный контекст поддерживает значение награды. Перевод не конкретизирует её содержание и тем самым сохраняет эсхатологическую открытость текста.
