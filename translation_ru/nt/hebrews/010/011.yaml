id: HEB.10.11
reference: Hebrews 10:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ πᾶς μὲν ἱερεὺς ἕστηκεν καθ’ ἡμέραν λειτουργῶν καὶ τὰς αὐτὰς πολλάκις προσφέρων θυσίας, αἵτινες οὐδέποτε δύνανται περιελεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/011.yaml
  text: And every priest stands day after day ministering and offering the same sacrifices again and again[a], which can never take away sins.
translation:
  language: ru
  text: И каждый священник изо дня в день стоит, совершая служение и снова и снова принося одни и те же жертвы, которые никогда не могут устранить грехи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «удалить грехи».'
    reason: Лексическая альтернатива для περιελεῖν; оба варианта передают удаление грехов.
lexical_decisions:
- source_word: πᾶς ... ἱερεὺς
  choice: каждый священник
  rationale: Сочетание πᾶς с существительным в единственном числе имеет распределительное значение и относится к каждому священнику левитского порядка; ἱερεύς не означает здесь первосвященника.
- source_word: ἕστηκεν
  choice: стоит
  rationale: Перфект ἵστημι обозначает сохраняющееся положение стоя. Настоящее время по-русски естественно передаёт это состояние и сохраняет контраст с тем, что Мессия в следующем стихе воссел.
- source_word: καθ’ ἡμέραν
  choice: изо дня в день
  rationale: Оборот выражает ежедневно повторяющееся действие; «изо дня в день» подчёркивает его непрерывную повторяемость.
- source_word: λειτουργῶν
  choice: совершая служение
  rationale: Причастие обозначает священническое, богослужебное служение. Выбранная формулировка сохраняет культовый оттенок и остаётся понятной современному читателю.
- source_word: τὰς αὐτὰς ... θυσίας
  choice: одни и те же жертвы
  rationale: Формулировка прямо передаёт тождественность и повторяемость приносимых жертв.
- source_word: πολλάκις
  choice: снова и снова
  rationale: Выражение естественно и выразительно передаёт многократное повторение.
- source_word: προσφέρων
  choice: принося
  rationale: В контексте жертвоприношения προσφέρω обычно означает «приносить в жертву»; наличие слова «жертвы» делает более краткое «принося» однозначным.
- source_word: αἵτινες
  choice: которые
  rationale: Относительное местоимение связывает пояснительное утверждение с жертвами, не добавляя толкования.
- source_word: οὐδέποτε δύνανται
  choice: никогда не могут
  rationale: Сочетание выражает абсолютную неспособность; перевод сохраняет его полную силу.
- source_word: περιελεῖν ἁμαρτίας
  choice: устранить грехи
  rationale: περιαιρέω означает удалить, убрать или устранить. «Устранить грехи» естественно передаёт окончательное удаление, не вводя дополнительного технического смысла.
theological_decisions:
- issue: Роль положения священника стоя в аргументации Евр 10
  choice: Сохранено прямое «стоит», чтобы передать продолжающееся служение и контраст с воссевшим Мессией в стихе 12.
  alternative: «Находится стоя» или аспектуально буквальное «встал и стоит», без столь естественного литературного контраста.
  rationale: Непосредственный контекст намеренно противопоставляет продолжающееся служение священников завершённости единственной жертвы Мессии; перевод сохраняет этот контраст, не разъясняя его внутри стиха.
- issue: Степень неспособности повторяющихся жертв устранить грехи
  choice: «Никогда не могут устранить грехи» — без смягчения абсолютного утверждения.
  alternative: «Не могут полностью справиться с грехами».
  rationale: Греческое οὐδέποτε δύνανται выражает безусловную неспособность в рамках аргумента автора; добавление «полностью» сузило бы или истолковало утверждение.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Повторы «изо дня в день», «снова и снова» и «одни и те же» намеренно сохранены как часть риторического нажима оригинала; причастные конструкции не перегружают предложение и отражают синтаксическую связь действий.
