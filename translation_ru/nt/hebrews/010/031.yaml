  text: φοβερὸν τὸ ἐμπεσεῖν εἰς χεῖρας θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/031.yaml
  text: It is a fearful thing to fall into the hands of the living God[a].
translation:
  language: ru
  text: Страшно впасть в руки живого Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ужасно впасть в руки живого Бога».'
    reason: 'Лексическая альтернатива для φοβερὸν: «ужасно» сильнее подчёркивает внушаемый ужас.'
lexical_decisions:
- source_word: φοβερὸν
  choice: страшно
  rationale: Предикативное прилагательное выражает то, что внушает страх и ужас. Безличное «страшно» естественно передаёт греческую конструкцию и сохраняет краткость и суровую торжественность высказывания.
- source_word: τὸ ἐμπεσεῖν
  choice: впасть
  rationale: Субстантивированный аористный инфинитив обозначает «впасть, попасть». В сочетании с «в руки» глагол «впасть» сохраняет резкость образа и его традиционное библейское звучание.
- source_word: εἰς χεῖρας
  choice: в руки
  rationale: Выражение означает оказаться во власти или под судом кого-либо. Сохранение образа рук передаёт греческую идиому и её межтекстовые связи, не добавляя слова «суд», которого в тексте нет.
- source_word: θεοῦ
  choice: Бога
  rationale: Родительный падеж зависит от слова «руки»; прямое и естественное соответствие греческому θεοῦ.
- source_word: ζῶντος
  choice: живого
  rationale: Причастие атрибутивно характеризует Бога. Устойчивое выражение «живой Бог» подчёркивает Его реальность и действенное присутствие, не расширяя смысл.
theological_decisions:
- issue: Смысл и сила предостережения
  choice: Общее торжественное утверждение об ужасе оказаться во власти живого Бога в контексте Его суда
  alternative: Только временное наказание либо экзистенциальный страх без судебного смысла
  rationale: Контекст завершает суровое предостережение, а идиома «впасть в руки» подразумевает власть и суд. Перевод сохраняет эту напряжённость, но не вводит прямо слово «суд», отсутствующее в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и предостерегающим звучанием. Традиционный библейский образ «впасть в руки» сохранён как понятный и выразительный.
