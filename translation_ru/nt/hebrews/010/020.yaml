lexical_decisions:
- source_word: ἣν
  choice: который
  rationale: Относительное местоимение согласовано с ближайшим смысловым определяемым словом «путь» и сохраняет связь с предыдущим стихом.
- source_word: ἐνεκαίνισεν
  choice: открыл
  rationale: В контексте пути передаёт введение нового пути в употребление; это естественнее по-русски, чем «инаугурировал», и не утрачивает значения нового установления.
- source_word: ἡμῖν
  choice: для нас
  rationale: 'Передаёт дательный пользы: путь открыт в нашу пользу.'
- source_word: ὁδὸν
  choice: путь
  rationale: Обычное русское соответствие, сохраняющее буквальный и метафорический смысл.
- source_word: πρόσφατον καὶ ζῶσαν
  choice: новый и живой
  rationale: «Новый» естественно передаёт недавно установленный, прежде не существовавший путь, а «живой» сохраняет образный язык оригинала без истолковывающего расширения «животворящий».
- source_word: διὰ τοῦ καταπετάσματος
  choice: через завесу
  rationale: «Завеса» — понятное и укоренившееся обозначение внутренней завесы святилища; предлог «через» точно передаёт διά с родительным падежом.
- source_word: τοῦτ’ ἔστιν
  choice: то есть
  rationale: Стандартная русская пояснительная формула, сохраняющая явное соотнесение последующей фразы с образом завесы.
- source_word: τῆς σαρκὸς αὐτοῦ
  choice: Его плоть
  rationale: «Плоть» текстуально прозрачно передаёт σάρξ. Родительный падеж греческой аппозиции по-русски естественно раскрывается именительным после «то есть», без добавления второго «через».
theological_decisions:
- issue: Соотнесение завесы с плотью Иисуса
  choice: «через завесу, то есть Его плоть»
  alternative: «через завесу, то есть через Его плоть»
  rationale: Греческое пояснение непосредственно соотносит завесу с Его плотью. Вариант без повторного «через» ближе сохраняет грамматическую форму и не снимает возможного напряжения в трактовке связи между «путём», «завесой» и «плотью».
- issue: Передача σάρξ
  choice: «плоть»
  alternative: «тело»
  rationale: Здесь речь идёт о телесной плоти Христа, а не о греховной природе; «плоть» сохраняет исходный термин и богословскую образность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. «Завеса» сохраняет храмовую образность, а «открыл путь» звучит естественно для широкого читателя. Маркеры сносок [a] и [b] размещены непосредственно в основном тексте.
