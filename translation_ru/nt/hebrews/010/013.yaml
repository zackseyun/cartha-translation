lexical_decisions:
- source_word: τὸ λοιπὸν
  choice: с тех пор
  rationale: Субстантивированное выражение среднего рода употреблено наречно и обозначает время после принесения жертвы и восседания, описанных в предыдущем стихе.
- source_word: ἐκδεχόμενος
  choice: ожидает
  rationale: Причастие передаёт продолжающееся ожидание, в котором присутствует уверенная направленность к будущему событию; «ожидает» естественно и не вносит оттенка сомнения.
- source_word: ἕως
  choice: пока… не
  rationale: Обычная современная русская конструкция для обозначения временного предела ожидания.
- source_word: τεθῶσιν
  choice: не будут положены
  rationale: Форма аориста пассивного залога сохраняется пассивной конструкцией; она не называет прямо совершающего действие и согласуется с образом подножия.
- source_word: οἱ ἐχθροὶ αὐτοῦ
  choice: враги Его
  rationale: Прямо передаёт определённую именную группу и местоименную принадлежность.
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: как подножие для ног Его
  rationale: Сохраняет конкретный образ Псалма 109:1 и естественно звучит по-русски; «как» обозначает предикативную роль врагов, не превращая их буквально в предмет.
theological_decisions:
- issue: Мессианский образ воцарения из Псалма 109:1
  choice: Сохранён конкретный образ врагов, положенных как подножие для ног.
  alternative: «пока враги Его не будут побеждены» или «не окажутся под Его ногами»
  rationale: Автор намеренно воспроизводит язык псалма; конкретный образ передаёт межтекстовую и богословскую силу высказывания без пояснительного перефразирования.
- issue: Кто подчиняет врагов
  choice: Сохранён пассив «будут положены» без названного деятеля.
  alternative: «пока Бог не положит врагов Его»
  rationale: Греческий текст использует пассив и в самом стихе не называет совершающего действие; перевод не должен устранять эту формальную неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «враги Его», «ног Его» помогает сохранить связь с цитатой из псалма, не прибегая к архаическим формам.
