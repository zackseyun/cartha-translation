id: HEB.10.36
reference: Hebrews 10:36
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὑπομονῆς γὰρ ἔχετε χρείαν ἵνα τὸ θέλημα τοῦ θεοῦ ποιήσαντες κομίσησθε τὴν ἐπαγγελίαν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/036.yaml
  text: For you have need of endurance[a], so that after doing the will of God you may receive the promise.
translation:
  language: ru
  text: Вам ведь нужна стойкость, чтобы, исполнив волю Бога, вы получили обещание[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «получили обещанное».'
    reason: Лексема ἐπαγγελία может в данном сочетании обозначать не только само обещание, но и обещанное благо или его исполнение.
lexical_decisions:
- source_word: ὑπομονῆς
  choice: стойкость
  rationale: Слово обозначает постоянство и способность не отступать под давлением. «Стойкость» естественно звучит по-русски и передаёт упорное терпение в испытаниях.
- source_word: γὰρ
  choice: ведь
  rationale: Частица связывает стих с предшествующим наставлением и вводит обоснование; «ведь» естественно передаёт эту пояснительную связь.
- source_word: χρείαν ἔχετε
  choice: вам нужна
  rationale: Греческое устойчивое сочетание означает «нуждаться». Прямая русская конструкция ясна и не утяжеляет фразу.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз выражает цель или ожидаемый результат; «чтобы» сохраняет обе близкие смысловые возможности.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: волю Бога
  rationale: Прямо передаёт родительную конструкцию и сохраняет традиционное библейское выражение в современном русском языке.
- source_word: ποιήσαντες
  choice: исполнив
  rationale: Аористное причастие указывает на действие, предшествующее получению. В сочетании со словом «воля» глагол «исполнить» звучит естественнее буквального «сделать».
- source_word: κομίσησθε
  choice: вы получили
  rationale: В данном контексте глагол означает получить или обрести то, что обещано. Форма с личным местоимением делает синтаксис русского предложения ясным.
- source_word: τὴν ἐπαγγελίαν
  choice: обещание
  rationale: Буквальное значение существительного — «обещание», хотя сочетание с κομίσησθε может подразумевать получение обещанного блага. Основной текст сохраняет формулировку и напряжение оригинала, а идиоматическое понимание дано в сноске.
theological_decisions:
- issue: Означает ли ἐπαγγελία само обещание или обещанное благо и исполнение обещания
  choice: обещание
  alternative: обещанное
  rationale: Греческий текст прямо говорит «обещание», но в сочетании с глаголом «получить» существительное может метонимически означать то, что было обещано. Буквальная формулировка оставлена в основном тексте, а более идиоматический вариант вынесен в сноску, чтобы не устранять смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сдержанным, достойным библейским звучанием. Частица «ведь» сохраняет связь с предыдущей мыслью; деепричастие «исполнив» передаёт предшествование действия без громоздкой придаточной конструкции.
