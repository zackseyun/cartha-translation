  text: οἴδαμεν γὰρ τὸν εἰπόντα· Ἐμοὶ ἐκδίκησις, ἐγὼ ⸀ἀνταποδώσω· καὶ πάλιν· ⸂Κρινεῖ κύριος⸃ τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
translation:
  language: ru
  text: 'Ведь мы знаем Того, Кто сказал: «Мне принадлежит отмщение, Я воздам», и ещё: «Господь будет судить Свой народ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цитаты перекликаются со Второзаконием 32:35–36. В исходном контексте «судить» может включать и наказание, и защиту или оправдание; здесь, в контексте предостережения, особенно подчёркнут Божий суд.
    reason: cross_reference
lexical_decisions:
- source_word: οἴδαμεν γὰρ
  choice: Ведь мы знаем
  rationale: οἶδα имеет настоящее значение, а γάρ поясняет предыдущее утверждение; «ведь» естественно передаёт эту связь по-русски.
- source_word: τὸν εἰπόντα
  choice: Того, Кто сказал
  rationale: Субстантивированное причастие указывает на Бога как личного автора цитируемых слов; прописные буквы соответствуют русской библейской традиции, не добавляя имени в текст.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: Мне принадлежит отмщение
  rationale: Эллиптическая греческая конструкция буквально связывает отмщение с говорящим. «Принадлежит» ясно раскрывает её смысл, а «отмщение» сохраняет торжественный судебный оттенок.
- source_word: ἀνταποδώσω
  choice: Я воздам
  rationale: Будущая форма означает ответное воздаяние; «воздам» кратко, естественно для торжественной цитаты и сохраняет судебно-ретрибутивный смысл.
- source_word: καὶ πάλιν
  choice: и ещё
  rationale: Естественная русская формула введения второй цитаты без добавления отсутствующего в греческом глагола речи.
- source_word: Κρινεῖ κύριος
  choice: Господь будет судить
  rationale: Передаёт будущее время и широкий судебный смысл κρίνω, не сужая его исключительно до наказания или оправдания.
- source_word: τὸν λαὸν αὐτοῦ
  choice: Свой народ
  rationale: Возвратное притяжательное местоимение — наиболее естественный русский эквивалент при подлежащем «Господь» и сохраняет заветный оттенок выражения.
theological_decisions:
- issue: Смысл судебных слов в цитате из Второзакония
  choice: «Мне принадлежит отмщение, Я воздам» и «Господь будет судить Свой народ»
  alternative: «Мне отмщение»; «Господь оправдает Свой народ»
  rationale: Контекст предупреждения в Евреям подчёркивает реальность Божьего суда. Вместе с тем «судить» сохраняет присущую κρίνω и контексту Второзакония широту, которая может включать как наказание, так и защиту или оправдание, и потому не устраняет напряжение текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром, уместным для цитаты из Писания. Синтаксис ясен для широкого читателя; архаизирующее «Мне отмщение» заменено прозрачным «Мне принадлежит отмщение».
