  yaml_path: translation/nt/hebrews/010/037.yaml
  text: For yet a very little while[b][a], the one who is coming will come and will not delay.
translation:
  language: ru
  text: Ведь ещё совсем немного времени[b] — и Грядущий[a] придёт и не замедлит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тот, кто приходит». Греческое выражение можно понять более обобщённо, однако «Грядущий», вероятно, сохраняет здесь силу мессианского наименования.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «малое, сколько-сколько» — греческая идиома со значением «совсем немного времени».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι γὰρ
  choice: Ведь ещё
  rationale: «Ведь» естественно передаёт пояснительную связь γάρ с предыдущим увещанием, а «ещё» сохраняет временное значение ἔτι.
- source_word: μικρὸν ὅσον ὅσον
  choice: совсем немного времени
  rationale: Повтор ὅσον ὅσον усиливает μικρόν и образует идиому, обозначающую крайне краткий промежуток; выбранная формулировка передаёт усиление естественным современным русским языком.
- source_word: ὁ ἐρχόμενος
  choice: Грядущий
  rationale: Артиклированное причастие употреблено субстантивно. «Грядущий» сохраняет возможную силу мессианского наименования и вместе с тем остаётся буквальным обозначением того, кто приходит.
- source_word: ἥξει
  choice: придёт
  rationale: Будущее время имеет прямое предсказательное значение; «придёт» также сохраняет корневой смысловой повтор с ὁ ἐρχόμενος.
- source_word: οὐ χρονίσει
  choice: не замедлит
  rationale: χρονίζω здесь означает медлить, задерживаться. «Не замедлит» ясно и достойно передаёт смысл без излишней архаичности.
theological_decisions:
- issue: Передавать ли ὁ ἐρχόμενος как мессианское наименование или как нейтральный причастный оборот
  choice: 'В основном тексте: «Грядущий»'
  alternative: «тот, кто идёт» или «тот, кто должен прийти»
  rationale: Контекст Писания и христологическое употребление в Послании к евреям позволяют услышать здесь мессианское наименование, однако греческая форма сама по себе допускает и более общее прочтение. Это различие сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Тире естественно выражает переход от краткого ожидания к приходу Грядущего; все примечания отмечены в основном тексте.
