  text: ὅπου δὲ ἄφεσις τούτων, οὐκέτι προσφορὰ περὶ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/018.yaml
  text: Where there is forgiveness of these[a], there is no longer any offering for sin.
translation:
  language: ru
  text: А где есть прощение всего этого[a], там уже нет приношения за грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «этих»; имеется в виду прощение грехов и беззаконий, упомянутых в предыдущем стихе.'
    reason: Лексическая альтернатива и пояснение отсылки указательного местоимения.
lexical_decisions:
- source_word: ὅπου
  choice: где
  rationale: Передаёт сферу или условие, в котором верно последующее утверждение; естественно продолжает ход мысли.
- source_word: δὲ
  choice: а
  rationale: Мягко обозначает переход к выводу, не создавая сильного противопоставления.
- source_word: ἄφεσις
  choice: прощение
  rationale: В контексте грехов и жертв означает прощение, отпущение; «прощение» ясно и естественно для современного читателя.
- source_word: τούτων
  choice: всего этого
  rationale: Указание отсылает к грехам и беззакониям предыдущего стиха. Такая формулировка звучит естественно по-русски и не вставляет существительное, отсутствующее в греческом тексте.
- source_word: οὐκέτι
  choice: уже нет
  rationale: Точно выражает прекращение существования или необходимости дальнейшего приношения в данном контексте.
- source_word: προσφορὰ
  choice: приношение
  rationale: Сохраняет общий культовый термин и не сужает его до более специального слова «жертва».
- source_word: περὶ ἁμαρτίας
  choice: за грех
  rationale: Естественно передаёт жертвенный смысл оборота, не уточняя его как специальный термин «жертва за грех».
theological_decisions:
- issue: Окончательность жертвы Христа
  choice: При наличии прощения больше нет приношения за грех.
  alternative: Стих отменяет любые виды приношений вообще; либо говорит лишь об ограниченной обрядовой отмене левитских жертв.
  rationale: Перевод сохраняет непосредственный вывод текста о прекращении приношений за грех, не расширяя и не сужая его богословский смысл сверх контекста.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, торжественная и понятная. Повтор «где… там» естественно передаёт греческую логическую конструкцию.
