lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Начальный союз сохранён, поскольку фраза продолжает предшествующую цитату.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: их грехов
  rationale: Прямой и естественный перевод множественного числа ἁμαρτία с местоимением αὐτῶν.
- source_word: καὶ τῶν ἀνομιῶν αὐτῶν
  choice: и беззаконных дел
  rationale: ἀνομία обозначает беззаконие, нарушение закона; во множественном числе выражение «беззаконные дела» ясно передаёт конкретные поступки и звучит естественно по-русски.
- source_word: οὐ μὴ μνησθήσομαι
  choice: не вспомню
  rationale: Сохранён библейски значимый образ Божьего невоспоминания; сочетание οὐ μή с будущим временем выражает решительное отрицание.
- source_word: ἔτι
  choice: больше
  rationale: В сочетании с отрицанием передаёт значение «уже не, больше не» и естественно располагается перед глаголом в русском языке.
theological_decisions:
- issue: Божье невоспоминание грехов
  choice: «больше не вспомню»
  alternative: «никогда больше не вспомню»; «уже не буду помнить»
  rationale: Перевод сохраняет образ «вспоминать», не истолковывая его ни как буквальную утрату знания, ни как явное «не вменю». Тем самым сохраняется богословская напряжённость заветного обещания. Решительность οὐ μή пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и понятная формулировка. Начальное «и» сохранено как связь с продолжающейся цитатой. Порядок дополнений перед глаголом отражает греческую структуру и остаётся естественным по-русски.
