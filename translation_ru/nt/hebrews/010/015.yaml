  yaml_path: translation/nt/hebrews/010/015.yaml
  text: And the Holy Spirit also testifies to us[a]; for after saying,
translation:
  language: ru
  text: 'И Святой Дух также свидетельствует нам[a], ибо после того, как Святой Дух сказал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «даёт нам свидетельство».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: свидетельствует
  rationale: Настоящее время действительного залога передаёт продолжающееся действие; «свидетельствует» естественно по-русски и сохраняет смысл свидетельского подтверждения.
- source_word: δὲ
  choice: И
  rationale: Здесь частица служит мягкой связкой и развивает мысль, не обозначая резкого противопоставления.
- source_word: ἡμῖν
  choice: нам
  rationale: 'Дательный падеж при μαρτυρέω естественно передаётся адресатным «нам»: Дух свидетельствует автору и его слушателям.'
- source_word: καὶ
  choice: также
  rationale: 'Передаёт добавочное значение: наряду с предшествующим доводом свидетельствует и Святой Дух.'
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Святой Дух
  rationale: Общепринятое современное русское наименование; конструкция с артиклем указывает именно на Святого Духа.
- source_word: μετὰ γὰρ τὸ εἰρηκέναι
  choice: ибо после того, как Он сказал
  rationale: Субстантивированный инфинитив с μετά выражает временную последовательность. В русском нужен субъект; местоимение «Он» естественно относится к Святому Духу из предыдущей части и сохраняет Его личное действие.
theological_decisions:
- issue: Личное действие Святого Духа как свидетеля
  choice: Святой Дух также свидетельствует нам
  alternative: Святой Дух также подтверждает нам
  rationale: Греческий синтаксис представляет Святого Духа действующим свидетелем. Перевод сохраняет это, не добавляя сверх текста конфессиональных уточнений.
- issue: Подразумеваемый субъект εἰρηκέναι
  choice: после того, как Он сказал
  alternative: после сказанного
  rationale: Наиболее естественный референт подразумеваемого субъекта — Святой Дух. Явное «Он» требуется нормами русского языка и согласуется с последующей цитатой, но прописная буква является редакционным способом обозначить референт, а не отдельным значением греческой формы.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. «Ибо» сохраняет причинную связь γάρ и уместно в библейском регистре; двоеточие показывает, что далее следует цитата.
