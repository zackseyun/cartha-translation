source:
  edition: SBLGNT
  text: τότε εἴρηκεν· Ἰδοὺ ἥκω τοῦ ⸀ποιῆσαι τὸ θέλημά σου· ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/009.yaml
  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
translation:
  language: ru
  text: 'Тогда Он сказал: «Вот, Я пришёл исполнить Твою волю». Он устраняет первое, чтобы утвердить второе.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Первое» и «второе», вероятно, означают соответственно прежний порядок жертвоприношений и новую реальность исполнения Божьей воли в жертве Мессии. Возможно также более узкое указание на две части приведённой цитаты или более широкое — на прежний и новый заветы.
    reason: Сохраняет неоднозначность кратких выражений оригинала и сообщает основные контекстуальные варианты их понимания.
lexical_decisions:
- source_word: τότε
  choice: тогда
  rationale: Передаёт последовательность в развитии цитаты и рассуждения автора.
- source_word: εἴρηκεν
  choice: сказал
  rationale: Русское совершенное прошедшее естественно передаёт уже произнесённые слова, сохраняющие значение в настоящем контексте; буквальная передача греческого перфекта была бы тяжеловесной.
- source_word: Ἰδοὺ
  choice: вот
  rationale: Естественный современный русский эквивалент указательного возгласа с сохранением возвышенного библейского звучания.
- source_word: ἥκω
  choice: Я пришёл
  rationale: Передаёт совершившееся прибытие и наличное присутствие, выраженные глаголом ἥκω.
- source_word: τοῦ ποιῆσαι
  choice: исполнить
  rationale: Целевой инфинитив передан естественно; в сочетании с «волей» глагол «исполнить» по-русски точнее и благозвучнее буквального «сделать».
- source_word: τὸ θέλημά σου
  choice: Твою волю
  rationale: Сохраняет ключевое понятие Божьей воли без поясняющего расширения.
- source_word: ἀναιρεῖ
  choice: устраняет
  rationale: Передаёт отмену или удаление первого, не усиливая значение до формально-юридического «упраздняет» и не уточняя его подразумеваемый предмет.
- source_word: τὸ πρῶτον
  choice: первое
  rationale: Сохраняет субстантивированное прилагательное и лаконичность греческого текста, не подставляя толкование в основной текст.
- source_word: ἵνα
  choice: чтобы
  rationale: Ясно выражает целевую связь между устранением первого и утверждением второго.
- source_word: τὸ δεύτερον
  choice: второе
  rationale: Сохраняет точный риторический параллелизм с «первым» и не разрешает неоднозначность референта.
- source_word: στήσῃ
  choice: утвердить
  rationale: Передаёт установление и придание действенной силы; соответствует контрасту с «устраняет».
theological_decisions:
- issue: К чему относятся «первое» и «второе»
  choice: В основном тексте сохранены краткие и неоднозначные обозначения «первое» и «второе».
  alternative: Раскрыть их как первый порядок жертвоприношений и исполнение Божьей воли в жертве Мессии либо шире как ветхий и новый заветы.
  rationale: Непосредственный контекст Евр 10:8–10 противопоставляет жертвы и приношения исполнению Божьей воли, однако сам стих не называет предметы этого противопоставления. Сохранение формы оригинала не превращает вероятное толкование в часть перевода.
- issue: Субъект глаголов «сказал» и «устраняет»
  choice: Местоимение «Он» сохранено без поясняющего имени.
  alternative: Назвать субъекта «Христом» или «Богом».
  rationale: В греческом тексте субъект подразумевается и устанавливается из контекста. Подстановка имени могла бы преждевременно снять синтаксическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Вот» сохраняет маркированное введение цитаты без архаичного «се»; «исполнить Твою волю» звучит естественно и точно. Заглавные местоимения в обращении к Богу и при указании на Мессию соответствуют принятому русскому библейскому регистру.
