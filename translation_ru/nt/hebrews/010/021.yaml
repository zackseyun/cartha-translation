lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Сочинительный союз связывает эту фразу с предшествующей конструкцией стихов 19–21.
- source_word: ἱερέα
  choice: Священника
  rationale: ἱερεύς означает «священник»; заглавная буква уместна как обозначение Иисуса в данном контексте, но не превращает слово в отсутствующий в греческом технический титул ἀρχιερεύς.
- source_word: μέγαν
  choice: великого
  rationale: Передаёт величие и выдающееся положение Священника, сохраняя отличие сочетания ἱερεύς + μέγας от технического титула «Первосвященник».
- source_word: ἐπὶ
  choice: над
  rationale: С винительным падежом здесь выражает власть и попечение над домом Божьим.
- source_word: τὸν οἶκον
  choice: домом
  rationale: Сохраняет библейский образ дома; в контексте слово может обозначать также Божье семейство, то есть Его народ.
- source_word: τοῦ θεοῦ
  choice: Божьим
  rationale: Естественно и кратко передаёт родительный оборот, указывающий на принадлежность дома Богу.
theological_decisions:
- issue: Следует ли переводить ἱερέα μέγαν техническим титулом «Первосвященник»
  choice: великий Священник
  alternative: Первосвященник
  rationale: Хотя Послание к евреям неоднократно называет Иисуса Первосвященником, здесь употреблено не ἀρχιερεύς, а ἱερεύς с прилагательным μέγας. Основной текст сохраняет это различие и не вносит технический титул из более широкого контекста.
- issue: Смысл выражения «дом Божий»
  choice: сохранить образ «дом»
  alternative: семья Божья / народ Божий
  rationale: οἶκος допускает как значение дома, так и значение домочадцев или сообщества. Образ сохранён в тексте, а его общинный смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного библейского регистра. Порядок маркеров приведён к последовательному [a][b]. Форма «Божьим» звучит естественнее буквального «Бога», не устраняя метафору дома.
