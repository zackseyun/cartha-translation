  text: и великого священника над домом Божьим[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «первосвященника». В Послании к евреям Иисус часто представлен как первосвященник, однако буквально здесь сказано: «великий священник».'
    reason: alternative_reading
