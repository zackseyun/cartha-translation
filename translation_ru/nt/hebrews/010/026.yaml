  text: Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/026.yaml
  text: For if we go on sinning deliberately after receiving the knowledge of the truth[a], there no longer remains a sacrifice for sins,
translation:
  language: ru
  text: Ведь если мы продолжаем намеренно грешить после того, как получили познание истины[a], то жертвы за грехи больше не остаётся,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полное познание истины». Греческое слово может подразумевать более полное или глубокое знание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑκουσίως
  choice: намеренно
  rationale: Передаёт осознанный, добровольный характер действия современным и нейтральным по стилю словом, без архаического или чрезмерно юридического оттенка.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно передаёт пояснительную связь стиха с предшествующим рассуждением.
- source_word: ἁμαρτανόντων ἡμῶν
  choice: если мы продолжаем ... грешить
  rationale: Условная конструкция естественно передаёт генитив абсолютный, а «продолжаем» отражает длительный или повторяющийся характер настоящего причастия, не сводя предупреждение к одному поступку.
- source_word: μετὰ τὸ λαβεῖν
  choice: после того, как получили
  rationale: Передаёт временную последовательность и завершённость получения знания до описываемого продолжающегося действия.
- source_word: ἐπίγνωσιν
  choice: познание
  rationale: «Познание» естественно в данном высоком, но современном регистре и допускает оттенок более полного или определённого знания, не навязывая его как единственно возможный.
- source_word: τῆς ἀληθείας
  choice: истины
  rationale: Точно и естественно передаёт родительный оборот; контекстуальное отнесение к евангельской истине не добавляется в основной текст.
- source_word: οὐκέτι
  choice: больше не
  rationale: Ясно указывает, что отныне жертвы не остаётся.
- source_word: περὶ ἁμαρτιῶν
  choice: за грехи
  rationale: В жертвенном контексте «за грехи» — естественный русский эквивалент конструкции περὶ с родительным падежом.
- source_word: ἀπολείπεται
  choice: не остаётся
  rationale: Сохраняет безлично-пассивный смысл греческой формы и естественно звучит по-русски.
- source_word: θυσία
  choice: жертвы
  rationale: Стандартное обозначение жертвы в контексте Послания к Евреям; родительный падеж обусловлен русской отрицательной конструкцией.
theological_decisions:
- issue: Видо-временная и пастырско-богословская сила ἁμαρτανόντων
  choice: «если мы продолжаем намеренно грешить» — продолжающееся действие
  alternative: «если мы намеренно согрешим» или «если мы грешим по своей воле»
  rationale: Настоящее причастие естественно допускает длительное или устойчивое действие. Перевод сохраняет серьёзность предупреждения, но не представляет его как однозначное утверждение о любом единичном сознательном грехе.
- issue: Смысл ἐπίγνωσις в контексте предупреждения
  choice: «познание истины» без определения его спасительного или возрождающего характера
  alternative: «полное познание истины» или «спасительное познание истины»
  rationale: Греческий текст говорит о получении познания истины, но сам по себе не разрешает спор о духовном статусе адресатов. Перевод сохраняет эту богословскую напряжённость.
- issue: Смысл отсутствия жертвы
  choice: Сохранено прямое утверждение «жертвы за грехи больше не остаётся»
  alternative: Пояснить как отсутствие иной или повторной жертвы
  rationale: Контекст Послания к Евреям может прояснять смысл, однако сам стих не содержит слов «иной» или «повторной»; они не внесены в перевод.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Конструкция ясна обычному читателю; сохранены пояснительное «ведь», длительность греховного действия и богословическая неоднозначность выражения «познание истины».
