    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναμιμνῄσκεσθε
  choice: вспомните
  rationale: Настоящее повелительное наклонение обращено ко множеству адресатов. «Вспомните» естественно передаёт призыв; длительный оттенок настоящего времени не требуется выражать отдельно.
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает переход с лёгким противопоставлением предшествующему предостережению.
- source_word: τὰς πρότερον ἡμέρας
  choice: прежние дни
  rationale: Прямое и естественное обозначение более раннего периода в жизни читателей.
- source_word: ἐν αἷς
  choice: когда
  rationale: Буквально «в которые»; в данном контексте оборот имеет временное значение, которое по-русски естественно передаётся союзом «когда».
- source_word: φωτισθέντες
  choice: получив просвещение
  rationale: Аористное страдательное причастие сохраняет метафору света и допускает предшествование по отношению к основной ситуации. Такая формулировка звучит естественнее буквального «будучи просвещены» и не уточняет, какое именно событие имеется в виду.
- source_word: πολλὴν ἄθλησιν
  choice: тяжёлую борьбу
  rationale: ἄθλησις обозначает напряжённую борьбу или состязание; «тяжёлая борьба» естественно передаёт как образ, так и усиление πολλήν.
- source_word: ὑπεμείνατε
  choice: вы выдержали
  rationale: Глагол означает стойко перенести или выдержать испытание; выбранный вариант хорошо сочетается с образом борьбы.
- source_word: παθημάτων
  choice: полную страданий
  rationale: Родительный падеж указывает, чем характеризовалась борьба. Русская конструкция «борьбу, полную страданий» ясна и сохраняет широкий смысл пережитых бедствий.
theological_decisions:
- issue: Значение φωτισθέντες в контексте увещания
  choice: Сохранить метафору духовного просвещения, не связывая её однозначно с конкретным обрядом или этапом обращения.
  alternative: «После обращения», «после крещения» или «после наставления в вере».
  rationale: Сам стих говорит о полученном просвещении, но не определяет его точный церковный или духовно-опытный референт. Нейтральная передача сохраняет богословскую многозначность.
- issue: Временное отношение φωτισθέντες к ὑπεμείνατε
  choice: 'Передать как действие, предшествующее пережитой борьбе: «получив просвещение».'
  alternative: 'Одновременное или обобщённо-временное прочтение: «когда вы были просвещены».'
  rationale: Аористное причастие естественно допускает предшествование, однако грамматика не исключает более широкого временного соотношения; альтернативу отмечает сноска.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского увещания. Синтаксис упрощён без утраты метафоры просвещения и образа напряжённой борьбы; конфессионально специфические толкования исключены.
