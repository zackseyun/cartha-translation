  text: διὸ εἰσερχόμενος εἰς τὸν κόσμον λέγει· Θυσίαν καὶ προσφορὰν οὐκ ἠθέλησας, σῶμα δὲ κατηρτίσω μοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/005.yaml
  text: 'Therefore[a], when he comes into the world, he says: “Sacrifice and offering you did not desire, but a body you prepared for me.”'
translation:
  language: ru
  text: 'Поэтому, входя в мир, Он говорит: «Жертвы и приношения Ты не пожелал, но приготовил Мне тело».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Здесь Послание к евреям следует греческой формулировке Псалма 39:7 (в иной нумерации — 40:6): «приготовил Мне тело». В еврейском тексте псалма сказано: «Ты открыл Мне уши».'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения и сохраняет логическую связь.
- source_word: εἰσερχόμενος εἰς τὸν κόσμον
  choice: входя в мир
  rationale: Естественно передаёт греческое причастие настоящего времени, не уточняя время сверх текста и сохраняя живой характер цитирования.
- source_word: λέγει
  choice: Он говорит
  rationale: Настоящее время сохранено как характерная для Писания форма введения цитаты; местоимение указывает на Сына из контекста, не называя Его прямо.
- source_word: Θυσίαν καὶ προσφορὰν
  choice: Жертвы и приношения
  rationale: Сохраняет различие двух культовых терминов; формы родительного падежа после отрицания естественны в современном русском языке и допускают обобщённое значение.
- source_word: οὐκ ἠθέλησας
  choice: Ты не пожелал
  rationale: Передаёт значение желания или воли; «не пожелал» звучит достойно и уместно в контексте жертвоприношений.
- source_word: σῶμα δὲ κατηρτίσω μοι
  choice: но приготовил Мне тело
  rationale: «Но» передаёт противопоставление δέ, «приготовил» — значение καταρτίζω, а «Мне» — дательный μοι; русский порядок слов естественен и сохраняет акцент на теле.
theological_decisions:
- issue: Формулировка цитаты из Псалма 39:7 в Послании к евреям отличается от еврейского текста псалма.
  choice: 'В основном тексте переведено греческое σῶμα: «приготовил Мне тело».'
  alternative: 'Еврейский текст псалма: «Ты открыл Мне уши» (буквально также понимается как «выкопал Мне уши»).'
  rationale: Перевод следует греческому тексту данного стиха Послания к евреям и не гармонизирует его с еврейским текстом псалма; значимое расхождение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные «Он», «Ты», «Мне» применены в цитате по отношению к Сыну и Богу; синтаксис остаётся ясным и не снимает присущую тексту богословскую напряжённость.
