  text: ἀδύνατον γὰρ αἷμα ταύρων καὶ τράγων ἀφαιρεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/004.yaml
  text: For it is impossible for the blood of bulls and goats to take away sins[a].
translation:
  language: ru
  text: Ведь кровь быков и козлов не может устранить грехи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «удалить грехи».'
    reason: 'Лексическая альтернатива: ἀφαιρεῖν может означать устранить, удалить или отнять.'
lexical_decisions:
- source_word: ἀδύνατον
  choice: не может
  rationale: Предикативное ἀδύνατον с инфинитивом выражает невозможность действия. Русская конструкция «кровь… не может устранить» естественна и сохраняет категоричность утверждения.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит обоснование предшествующей мысли; «ведь» кратко и естественно передаёт пояснительную связь.
- source_word: αἷμα
  choice: кровь
  rationale: Сохранён буквальный жертвенный термин, значимый для аргументации Послания к евреям.
- source_word: ταύρων
  choice: быков
  rationale: Родительный падеж множественного числа естественно зависит от слова «кровь» и точно передаёт название жертвенных животных.
- source_word: τράγων
  choice: козлов
  rationale: Греческое слово обозначает самцов коз; русское «козлов» точно и естественно в контексте жертвоприношений.
- source_word: ἀφαιρεῖν
  choice: устранить
  rationale: Глагол означает убрать, удалить, отнять. «Устранить грехи» передаёт результативное удаление, не добавляя объяснения механизма прощения.
- source_word: ἁμαρτίας
  choice: грехи
  rationale: Сохранено явно выраженное в греческом тексте множественное число.
theological_decisions:
- issue: Действенность крови животных в отношении грехов
  choice: Основной текст утверждает невозможность устранения грехов кровью животных, не уточняя здесь характер или пределы ветхозаветного очищения.
  alternative: Пояснить, что жертвы давали временное покрытие или обрядовое очищение, но не окончательное устранение грехов.
  rationale: Такие пояснения выходят за пределы формулировки стиха. Перевод сохраняет напряжение контекста и не вносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Ведь» естественно связывает стих с предыдущим рассуждением; порядок слов сохраняет акцент на крови жертвенных животных.
