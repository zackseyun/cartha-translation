base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
translation:
  language: ru
  text: Верой он совершил Пасху и окропление кровью[a], чтобы истребитель первенцев не коснулся их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нанесение крови». Греческое слово обозначает ритуальное нанесение крови; «окропление» — традиционная культовая передача, тогда как «нанесение» может точнее отражать пасхальный контекст.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Верой
  rationale: Творительный падеж передаёт значение средства; формула сохраняет повторяющийся ритм Евр. 11 и обычное значение πίστις в этой главе.
- source_word: πεποίηκεν
  choice: совершил
  rationale: Перфект ποιέω в данном контексте обозначает исполнение пасхального установления. «Совершил Пасху» естественно для возвышенного современного русского и не сужает смысл до одной трапезы.
- source_word: τὸ πάσχα
  choice: Пасху
  rationale: Передаёт пасхальное соблюдение в целом, не уточняя сверх текста, идёт ли речь только о трапезе, празднике или обряде.
- source_word: τὴν πρόσχυσιν τοῦ αἵματος
  choice: окропление кровью
  rationale: Традиционное культовое выражение, обозначающее ритуальное нанесение крови. В пасхальном контексте возможно более конкретное «нанесение крови», поэтому оно вынесено в сноску.
- source_word: ἵνα μὴ
  choice: чтобы ... не
  rationale: Естественно передаёт целевое придаточное с μή и сослагательным наклонением.
- source_word: ὁ ὀλοθρεύων
  choice: истребитель
  rationale: Передаёт субстантивированное причастие без добавления отсутствующего в греческом слова «ангел».
- source_word: τὰ πρωτότοκα
  choice: первенцев
  rationale: Субстантивированное прилагательное во множественном числе; русское слово сохраняет широкий референциальный охват исходного выражения.
- source_word: θίγῃ
  choice: не коснулся
  rationale: Сохраняет буквальное значение «касаться» и аллюзию на повествование Исхода, не заменяя его истолкованием «поразить» или «погубить».
- source_word: αὐτῶν
  choice: их
  rationale: Сохраняет краткую местоименную отсылку греческого текста и не вводит прямо не названное существительное.
theological_decisions:
- issue: Подразумеваемое подлежащее πεποίηκεν
  choice: Местоимение «он», относящееся в контексте к Моисею
  alternative: Явно назвать Моисея
  rationale: Контекст Евр. 11:23–29 однозначно указывает на Моисея, однако сохранение местоимения ближе к форме греческого текста.
- issue: Передача πίστις
  choice: вера
  alternative: доверие; верность
  rationale: Повторяющаяся формула и тема Евр. 11 поддерживают значение «вера», тогда как «верность» здесь менее вероятна.
- issue: Идентичность ὁ ὀλοθρεύων
  choice: истребитель
  alternative: ангел-истребитель
  rationale: Греческий текст не называет истребителя ангелом; нейтральное обозначение сохраняет недосказанность и не вносит интерпретацию в основной текст.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Сохранены краткость, повторяющаяся формула «Верой» и намеренная неопределённость обозначения истребителя; архаизмы и конфессионально окрашенные добавления исключены.
