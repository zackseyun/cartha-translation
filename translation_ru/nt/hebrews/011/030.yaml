base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/030.yaml
  text: By faith the walls of Jericho fell after they had been encircled for seven days[a].
translation:
  language: ru
  text: Верой пали стены Иерихона после того, как вокруг них ходили семь дней[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Благодаря вере». Греческая форма может указывать как на средство, так и на образ действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Верой
  rationale: Творительный падеж естественно передаёт инструментальный или образно-модальный оттенок греческого дательного и сохраняет повторяющуюся формулу Евреям 11.
- source_word: τὰ τείχη Ἰεριχὼ
  choice: стены Иерихона
  rationale: τεῖχος обозначает прежде всего городскую стену; множественное число и принадлежность городу естественно переданы русским родительным падежом.
- source_word: ἔπεσαν
  choice: пали
  rationale: Точно передаёт аорист πίπτω и звучит естественно в возвышенном, но понятном повествовании; вариант «рухнули» был бы несколько конкретнее и выразительнее оригинала.
- source_word: κυκλωθέντα
  choice: после того, как вокруг них ходили
  rationale: Аористное страдательное причастие указывает на предшествующее действие вокруг стен. Русская конструкция сохраняет образ обхода и не создаёт ошибочного впечатления, будто стены были лишь окружены неподвижным кольцом.
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: семь дней
  rationale: ἐπί с винительным выражает продолжительность времени; по-русски длительность достаточно ясно передана формой «семь дней» при глаголе несовершенного вида.
theological_decisions:
- issue: Передача πίστις в формуле Евреям 11:30
  choice: вера
  alternative: верность; доверие
  rationale: В контексте перечня примеров Евреям 11 существительное означает веру; выбор не превращает её ни в человеческую заслугу, ни в отдельное понятие верности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Верой пали» сохраняет ритм повторяющейся формулы главы; «вокруг них ходили» понятно передаёт исторический образ, не называя участников, которых греческий текст прямо не называет.
