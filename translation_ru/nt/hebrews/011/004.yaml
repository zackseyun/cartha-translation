source:
  edition: SBLGNT
  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
translation:
  language: ru
  text: Верой Авель принёс Богу жертву лучше, чем ту, которую принёс Каин[a]. Через неё он получил свидетельство, что праведен[b], — Бог свидетельствовал о его дарах. И через неё[c] он, хотя и умер, всё ещё говорит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертву бо́льшую, чем ту, которую принёс Каин». Сравнительная форма может указывать либо на качество жертвы, либо на её величину.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «о нём было засвидетельствовано, что он праведен». Возможен также перевод: «он был признан праведным».'
    reason: lexical_alternative
  - marker: c
    text: Слова «через неё» могут относиться либо к вере Авеля, либо к принесённой им жертве; греческий текст допускает оба понимания.
    reason: alternative_reading
lexical_decisions:
- source_word: Πίστει
  choice: Верой
  rationale: Творительный падеж передаёт значение средства или основания действия; в контексте Евр 11 πίστις обозначает веру человека.
- source_word: πλείονα θυσίαν
  choice: лучшую жертву
  rationale: Сравнительная форма может означать как качественное превосходство, так и большую величину. В данном контексте «лучшую» естественно передаёт сопоставление жертв, не добавляя отсутствующего в тексте слова «угодную».
- source_word: παρὰ Κάϊν
  choice: чем Каин
  rationale: 'παρά при сравнительной форме указывает на объект сравнения. Русская конструкция намеренно кратка, как и греческая: подразумевается жертва, принесённая Каином.'
- source_word: προσήνεγκεν τῷ θεῷ
  choice: принёс Богу
  rationale: В жертвенном контексте προσφέρω означает принесение жертвы; сочетание «принёс Богу жертву» естественно для современного русского языка.
- source_word: δι’ ἧς
  choice: Через неё
  rationale: Женское относительное местоимение грамматически относится к θυσίαν, «жертве». Русское местоимение сохраняет эту связь без тяжеловесного повтора.
- source_word: ἐμαρτυρήθη εἶναι δίκαιος
  choice: он получил свидетельство, что праведен
  rationale: Формулировка сохраняет мотив свидетельства, важный для главы, но избегает неестественной русской кальки «о нём было засвидетельствовано быть праведным».
- source_word: μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ
  choice: Бог свидетельствовал о его дарах
  rationale: Генитивная абсолютная конструкция передана самостоятельным пояснением; ἐπί с дательным понимается как «о, относительно», а δῶρα — как «дары» в жертвенном контексте.
- source_word: δι’ αὐτῆς
  choice: через неё
  rationale: Местоимение женского рода может указывать либо на веру, либо на жертву. В русском обе эти лексемы женского рода, поэтому исходная неоднозначность удачно сохраняется.
- source_word: ἀποθανὼν ἔτι λαλεῖ
  choice: хотя и умер, всё ещё говорит
  rationale: Уступительная конструкция естественно выражает контраст между смертью Авеля и продолжающимся свидетельством; настоящее время передано словами «всё ещё говорит».
theological_decisions:
- issue: К чему относится δι’ αὐτῆς в заключительной части стиха
  choice: 'Оставлено неоднозначным: «через неё»'
  alternative: «через веру» или «через жертву»
  rationale: Тематическая рамка главы допускает отсылку к вере, а ближайшее подходящее существительное — «жертва». Греческий текст не разрешает вопрос однозначно, и русский род местоимения позволяет сохранить эту напряжённость.
- issue: Значение ἐμαρτυρήθη применительно к праведности Авеля
  choice: «получил свидетельство, что праведен»
  alternative: «было засвидетельствовано, что он праведен» или «был признан праведным»
  rationale: Выбранный вариант сохраняет лексику свидетельства и не превращает её без необходимости в формальное объявление или юридическое признание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранён повтор слов со значением свидетельства и намеренно не устранена неоднозначность последнего местоимения. Пунктуация показывает, что слова о Божьем свидетельстве поясняют предыдущее утверждение.
