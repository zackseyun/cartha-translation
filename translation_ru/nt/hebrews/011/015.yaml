  source_fidelity: «И если бы они вспоминали ту землю, из которой вышли, у них была бы возможность вернуться» точно передаёт нереальное условие (εἰ ... / εἶχον ἂν), продолжающуюся направленность памяти (μνημονεύουσιν), оставленную земную страну и возможность возврата. «Вышли» сохраняет конкретный оттенок ἐξέβησαν.
