  text: καὶ εἰ μὲν ἐκείνης ⸀μνημονεύουσιν ἀφ’ ἧς ⸀ἐξέβησαν, εἶχον ἂν καιρὸν ἀνακάμψαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/015.yaml
  text: And if they had been remembering that land from which they had gone out[a], they would have had opportunity to return.
translation:
  language: ru
  text: И если бы они вспоминали ту землю, из которой вышли[a], у них была бы возможность вернуться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ту страну, из которой ушли»; возможно также: «ту родину, которую покинули». Греческий текст указывает на земное место, оставленное ими.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύουσιν
  choice: вспоминали
  rationale: В нереальном условном периоде настоящее изъявительное передаёт продолжающуюся направленность мысли в прошлом; русская форма «если бы… вспоминали» естественно выражает этот смысл, не добавляя оттенка ностальгии.
- source_word: ἐκείνης
  choice: ту землю
  rationale: Указательное местоимение женского рода отсылает к ранее упомянутой земной родине (ст. 14). Существительное «землю» делает подразумеваемый референт явным и сохраняет пространственный образ.
- source_word: ἀφ’ ἧς
  choice: из которой
  rationale: Передаёт исходную точку движения и согласуется с глаголом «вышли».
- source_word: ἐξέβησαν
  choice: вышли
  rationale: Прямо передаёт значение ἐκβαίνω — выйти; сохраняет образ оставления прежней земли, не сводя его к нейтральному «покинули».
- source_word: εἶχον ἂν
  choice: у них была бы
  rationale: Имперфект с ἄν образует следствие нереального условия; русское сослагательное наклонение передаёт эту контрфактическую конструкцию.
- source_word: καιρὸν
  choice: возможность
  rationale: Здесь слово обозначает подходящий случай или реальную возможность, а не просто отрезок времени.
- source_word: ἀνακάμψαι
  choice: вернуться
  rationale: Кратко и естественно передаёт возвращение назад к оставленной земле.
- source_word: καὶ εἰ μὲν
  choice: И если бы
  rationale: «И» сохраняет связь с предыдущей мыслью; μέν выполняет структурную функцию, которая по-русски естественно выражается самой условной конструкцией без отдельного соответствия.
theological_decisions:
- issue: Что подразумевается под землёй, которую они могли вспоминать
  choice: Земная родина, ранее ими оставленная и в контексте противопоставленная лучшей, небесной родине.
  alternative: Прежний образ жизни вообще, понимаемый не как буквальная родина.
  rationale: В Евр 11:13–16 речь идёт о странниках, ищущих родину, и о лучшей, небесной родине. Поэтому сохранён конкретный пространственный образ без его аллегоризации.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясен для широкого читателя и сохраняет достоинство библейского повествования. Контрфактический смысл передан парой «если бы… была бы».
