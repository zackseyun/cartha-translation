  terminology: «Земля» уместно эксплицирует подразумеваемую χώρα из контекста; сноска корректно предлагает «страна» и «родина» как варианты. «Возможность вернуться» точно передаёт καιρὸν ἀνακάμψαι без богословской интерпретации.
