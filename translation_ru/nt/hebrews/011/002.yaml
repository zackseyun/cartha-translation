  yaml_path: translation/nt/hebrews/011/002.yaml
  text: For by this the elders received approval[a][b][c].
translation:
  language: ru
  text: Ведь благодаря ей люди древности получили доброе свидетельство[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были одобрены»; «о них было дано доброе свидетельство». Греческий глагол означает получение благоприятного свидетельства.'
    reason: lexical_alternative
  - marker: b
    text: То есть благодаря вере, описанной в предыдущем стихе.
    reason: cross_reference
  - marker: c
    text: 'Буквально: «старшие»; здесь имеются в виду древние, люди прежних поколений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύτῃ
  choice: благодаря ей
  rationale: Оборот естественно отсылает к слову «вера» в предыдущем стихе и выражает средство или основание. Русское «благодаря ей» ясно передаёт эту связь, не повторяя существительное в основном тексте.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит пояснение к сказанному ранее. «Ведь» кратко и естественно сохраняет пояснительную связь.
- source_word: ἐμαρτυρήθησαν
  choice: получили доброе свидетельство
  rationale: Пассивная форма означает, что о людях было дано благоприятное свидетельство. Такая передача сохраняет мотив свидетельства, важный в контексте главы, и не добавляет прямо не названного деятеля.
- source_word: οἱ πρεσβύτεροι
  choice: люди древности
  rationale: В данном контексте слово обозначает не церковных пресвитеров, а верных людей прежних поколений, перечисляемых далее. «Люди древности» точно и понятно передаёт контекстуальный смысл.
theological_decisions:
- issue: К чему относится ταύτῃ
  choice: Местоимение «ей» относится к вере из Евр 11:1.
  alternative: Оно может относиться шире ко всей только что описанной реальности веры.
  rationale: Женский род и единственное число естественно согласуются с πίστις («вера»), а ход рассуждения связывает свидетельство о древних с верой. Местоименная передача сохраняет связь и не делает формулировку излишне разъяснительной.
- issue: Источник доброго свидетельства
  choice: Не называть Бога прямо в основном тексте.
  alternative: «Получили одобрение от Бога».
  rationale: Контекст главы подразумевает Божье одобрение, однако в самом стихе деятель пассивной конструкции не назван. Перевод сохраняет эту сдержанность исходного текста.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная. «Доброе свидетельство» сохраняет ключевой греческий образ, а «люди древности» предотвращает ошибочное понимание οἱ πρεσβύτεροι как церковной должности.
