  source_fidelity: Текст точно передаёт сравнительный выбор (μᾶλλον ἑλόμενος), солидарное претерпевание дурного обращения с Божьим народом (συγκακουχεῖσθαι τῷ λαῷ τοῦ θεοῦ) и противопоставленное ему ограниченное во времени наслаждение, связанное с грехом (πρόσκαιρον ἔχειν ἁμαρτίας ἀπόλαυσιν). Неопределённость относительно конкретного содержания «греха» сохранена.
  naturalness: «Предпочтя вместе с народом Божьим терпеть жестокое обращение, нежели иметь временное наслаждение грехом» — грамматически корректное, связное продолжение предыдущего стиха и уместно литературное по регистру. Оборот «иметь ... наслаждение» несколько буквальный, но допустим в библейском литературном стиле и обоснован простым ἔχειν; исправление не требуется.
  terminology: «Народ Божий» — устоявшееся и точное соответствие; «жестокое обращение» удачно передаёт именно дурное обращение, не сужая его до физического страдания. «Временное наслаждение грехом» сохраняет широту генитива ἁμαρτίας и кратковременность πρόσκαιρον. Сноска даёт допустимую лексическую альтернативу без изменения смысла.
