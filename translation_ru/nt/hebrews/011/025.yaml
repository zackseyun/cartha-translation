source:
  edition: SBLGNT
  text: μᾶλλον ἑλόμενος συγκακουχεῖσθαι τῷ λαῷ τοῦ θεοῦ ἢ πρόσκαιρον ἔχειν ἁμαρτίας ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/025.yaml
  text: choosing rather to be mistreated with the people of God than to have the temporary enjoyment of sin,[a]
translation:
  language: ru
  text: предпочтя вместе с народом Божьим терпеть жестокое обращение, нежели иметь временное наслаждение грехом,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мимолётное удовольствие от греха».'
    reason: 'Лексическая альтернатива для πρόσκαιρον и ἀπόλαυσις: она подчёркивает кратковременность и передаёт существительное как «удовольствие».'
lexical_decisions:
- source_word: μᾶλλον ἑλόμενος
  choice: предпочтя
  rationale: Сочетание сравнительного наречия с аористным причастием выражает сознательный выбор одной возможности вместо другой. «Предпочтя» естественно передаёт эту связь и сохраняет зависимость от Моисея в предыдущем стихе.
- source_word: συγκακουχεῖσθαι
  choice: вместе … терпеть жестокое обращение
  rationale: Передаёт как совместность, выраженную приставкой συν-, так и страдательное значение дурного, жестокого обращения; не сводит смысл лишь к физическому страданию.
- source_word: τῷ λαῷ τοῦ θεοῦ
  choice: с народом Божьим
  rationale: Естественное для современного литературного русского языка обозначение народа, принадлежащего Богу, с сохранением торжественного библейского регистра.
- source_word: ἢ
  choice: нежели
  rationale: Ясно вводит вторую часть сопоставления после «предпочтя» и поддерживает dignified literary register.
- source_word: πρόσκαιρον
  choice: временное
  rationale: Обозначает ограниченное по времени, недолговечное наслаждение. «Временное» прямо передаёт смысл, не усиливая образность сверх греческого текста.
- source_word: ἔχειν
  choice: иметь
  rationale: Сохраняет простое значение греческого глагола; идея наслаждения уже заключена в существительном ἀπόλαυσις.
- source_word: ἁμαρτίας ἀπόλαυσιν
  choice: наслаждение грехом
  rationale: Естественно передаёт наслаждение, связанное с грехом, не уточняя, какие именно греховные поступки или преимущества имеются в виду.
theological_decisions:
- issue: Содержание греховного наслаждения, от которого отказался Моисей
  choice: 'Оставить выражение широким: «наслаждение грехом».'
  alternative: Конкретизировать его как привилегии и компромиссы при дворе фараона либо как греховные удовольствия Египта.
  rationale: Греческий текст противопоставляет солидарность с Божьим народом временному наслаждению грехом, но не определяет конкретное содержание греха; перевод не должен устранять эту открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Жестокое обращение» сохраняет идею притеснения, а не общего жизненного страдания; «нежели» уместно в ритмически связном продолжении предыдущего стиха. Маркер [a] присутствует в основном тексте.
