base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
translation:
  language: ru
  text: Верой Иаков, умирая, благословил каждого из сыновей Иосифа и поклонился, опершись на верхушку своего посоха.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте Бытия 47:31: «и склонился в поклонении у изголовья своей постели». В греческом тексте Евр 11:21 стоит слово «посох».'
    reason: textual_variant
  - marker: b
    text: 'Или: «и поклонился в сторону верхушки своего посоха». Вероятнее всего, эти слова описывают позу Иакова, а не предмет его поклонения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Верой
  rationale: 'Дательный падеж имеет обстоятельственное или инструментальное значение: поступок Иакова совершён верой. Это также сохраняет повторяющуюся формулу 11-й главы.'
- source_word: ἀποθνῄσκων
  choice: умирая
  rationale: Причастие настоящего времени обозначает действие, одновременное с основными глаголами, и естественно передаётся русским деепричастием с оттенком продолжающегося процесса.
- source_word: ἕκαστον τῶν υἱῶν Ἰωσήφ
  choice: каждого из сыновей Иосифа
  rationale: Сочетание ἕκαστον с родительным разделительным подчёркивает, что благословение получил каждый сын по отдельности.
- source_word: εὐλόγησεν
  choice: благословил
  rationale: Обычный и точный эквивалент, естественно связывающий стих с повествованием Бытия и не ослабляющий значимость благословения.
- source_word: προσεκύνησεν
  choice: поклонился
  rationale: Глагол обозначает благоговейное поклонение, выраженное телесным поклоном. Русское «поклонился» сохраняет и религиозный смысл, и физический образ, не добавляя отсутствующего в греческом тексте прямого дополнения «Богу».
- source_word: ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ
  choice: опершись на верхушку своего посоха
  rationale: Так передаётся наиболее вероятное описание позы Иакова и устраняется ненамеренное впечатление, будто посох был предметом поклонения. Более буквальная синтаксическая возможность приведена в примечании.
theological_decisions:
- issue: Связь поклонения Иакова с посохом в заключительной фразе
  choice: Иаков поклонился, опершись на верхушку своего посоха
  alternative: Иаков поклонился в сторону верхушки своего посоха; в еврейском тексте Бытия 47:31 — склонился в поклонении у изголовья постели
  rationale: Греческий текст Послания к евреям прямо говорит о «посохе», следуя форме текста, представленной в Септуагинте. Конструкция с «опершись» естественно описывает позу, но поскольку предлог ἐπί допускает и иное понимание, оно отмечено в сноске. Отличающееся чтение еврейского текста Бытия также сохранено как важная межтекстовая особенность.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ритмичная и достойная публичного чтения. Сохранены повторная формула «Верой», индивидуальный характер благословения и неоднозначность заключительной греческой конструкции.
