lexical_decisions:
- source_word: πίστει
  choice: Верой
  rationale: Дательный падеж выражает средство или основание действия; повторяющаяся формула 11-й главы естественно передаётся по-русски словом «верой».
- source_word: Μωϋσῆς
  choice: Моисей
  rationale: Устоявшаяся русская форма личного имени.
- source_word: μέγας γενόμενος
  choice: когда вырос
  rationale: В данном контексте оборот означает достижение зрелого возраста, а не приобретение величия или высокого положения.
- source_word: ἠρνήσατο
  choice: отказался
  rationale: Глагол обозначает сознательный отказ принять обозначенную далее идентичность; возвратная форма естественна перед инфинитивом «называться».
- source_word: λέγεσθαι
  choice: называться
  rationale: Пассивный инфинитив прямо и естественно передаёт значение «быть называемым».
- source_word: υἱὸς θυγατρὸς Φαραώ
  choice: сыном дочери фараона
  rationale: Творительный падеж обусловлен глаголом «называться»; выражение указывает на конкретный статус Моисея.
- source_word: Φαραώ
  choice: фараона
  rationale: Устоявшаяся русская форма титула; со строчной буквы как обозначение правителя.
theological_decisions:
- issue: Передача πίστις в повторяющейся формуле Евреям 11
  choice: вера
  alternative: верность; доверие
  rationale: Контекст главы подчёркивает поступки, совершаемые верой, поэтому основной текст сохраняет традиционную и естественную формулу «Верой». Допустимые смысловые оттенки отмечены в сноске без устранения лексической широты греческого слова.
