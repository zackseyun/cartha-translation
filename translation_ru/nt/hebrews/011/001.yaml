  yaml_path: translation/nt/hebrews/011/001.yaml
  text: Faith is the assurance of things hoped for[b][a], the proof of things not seen.
translation:
  language: ru
  text: Вера же — это уверенность в том, на что надеются,[a] доказательство того, чего не видят.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «основание того, на что надеются»; «сущность того, на что надеются»; «реальность того, на что надеются».'
