    reason: lexical_alternative
lexical_decisions:
- source_word: πίστις
  choice: вера
  rationale: В данном контексте речь идёт о доверии Богу и его обещаниям; «вера» — естественный и богословски нейтральный русский эквивалент.
- source_word: δὲ
  choice: же
  rationale: Частица обозначает мягкий переход и связь с предшествующим рассуждением, не выражая ни времени, ни сильного противопоставления.
- source_word: ἐλπιζομένων
  choice: того, на что надеются
  rationale: Субстантивированное причастие указывает на содержание надежды; такая формулировка естественна в современном русском языке.
- source_word: ὑπόστασις
  choice: уверенность
  rationale: Слово допускает значения «основание», «сущность», «реальность» и «уверенность». Здесь «уверенность» хорошо передаёт практический смысл в увещевательном контексте, не превращая фразу в однозначное метафизическое определение.
- source_word: πραγμάτων
  choice: того
  rationale: Обобщающее местоимение естественно передаёт широкий смысл «вещей, дел, реальностей» и позволяет сохранить параллелизм двух частей.
- source_word: ἔλεγχος
  choice: доказательство
  rationale: Передаёт объективно-свидетельствующий оттенок слова, которое также может обозначать свидетельство или убеждённость.
- source_word: οὐ βλεπομένων
  choice: чего не видят
  rationale: Прямо передаёт отрицательное причастие настоящего времени и сохраняет отсылку к невидимой в настоящее время реальности.
theological_decisions:
- issue: Значение ὑπόστασις в Евр 11:1
  choice: уверенность
  alternative: основание; сущность; реальность
  rationale: Контекст главы показывает действенное доверие Божьим обещаниям. Основной вариант не навязывает позднейшего технического метафизического смысла, а подлинная лексическая неоднозначность отмечена в сноске.
- issue: Значение ἔλεγχος в Евр 11:1
  choice: доказательство
  alternative: свидетельство; убеждённость
  rationale: Выбран объективный доказательный оттенок, однако греческое слово может также указывать на порождённую свидетельством внутреннюю убеждённость; это сохранено в сноске.
- issue: Значение πίστις
  choice: вера
  alternative: доверие; верность
  rationale: Без генитивной конструкции или иного указания на верность субъекта здесь наиболее естественно понимать слово как доверяющую веру.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранена мягкая связующая функция δέ посредством «же». Две параллельные именные части переданы симметрично; спорные оттенки ὑπόστασις и ἔλεγχος не разрешены догматически и вынесены в сноски.
