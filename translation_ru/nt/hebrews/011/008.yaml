id: HEB.11.8
reference: Hebrews 11:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/008.yaml
  text: By faith Abraham[a], when called, obeyed to go out to a place that he was going to receive as an inheritance, and he went out not knowing where he was going.
translation:
  language: ru
  text: Верой Авраам, когда был призван, послушался и вышел в место, которое ему предстояло получить в наследство. Он вышел, не зная, куда идёт.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: Верой
  rationale: Дательный падеж выражает средство или основание действия; «верой» — точная и естественная передача πίστις в контексте доверительного отклика Авраама.
- source_word: καλούμενος
  choice: когда был призван
  rationale: Передаёт обстоятельственное значение причастия настоящего времени страдательного залога, не уточняя излишне временную последовательность.
- source_word: ὑπήκουσεν ἐξελθεῖν
  choice: послушался и вышел
  rationale: По-русски сочетание «послушался выйти» неестественно. Сочинительная конструкция ясно передаёт, что послушание выразилось в выходе, и позволяет сохранить последующий повтор глагола.
- source_word: τόπον
  choice: в место
  rationale: Сохраняет неопределённость пункта назначения и не заменяет более общее «место» конкретизирующим «земля».
- source_word: ἤμελλεν λαμβάνειν
  choice: ему предстояло получить
  rationale: Передаёт значение будущего действия у μέλλω с инфинитивом, не добавляя идеи предопределения.
- source_word: εἰς κληρονομίαν
  choice: в наследство
  rationale: Естественно передаёт статус места как будущего наследственного владения.
- source_word: ἐξῆλθεν
  choice: Он вышел
  rationale: Сохраняет авторский повтор корня ἐξέρχομαι после ἐξελθεῖν и подчёркивает совершённый поступок.
- source_word: μὴ ἐπιστάμενος
  choice: не зная
  rationale: Кратко и точно передаёт отрицательное обстоятельственное причастие.
- source_word: ποῦ ἔρχεται
  choice: куда идёт
  rationale: Настоящее время греческого глагола сохранено; в русском «идёт» естественно выражает движение к неизвестному месту назначения.
theological_decisions:
- issue: Значение πίστις в описании поступка Авраама
  choice: вера
  alternative: доверие; верность
  rationale: Контекст говорит о доверительном отклике Авраама на Божий призыв; «вера» сохраняет ключевой термин главы, не сводя его только к субъективному доверию или к верности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Намеренный повтор «вышел» сохранён. Формулировка «в место» несколько приподнята, но позволяет не конкретизировать τόπος как «землю» и сохраняет неопределённость назначения.
