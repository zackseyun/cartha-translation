  text: ἔσβεσαν δύναμιν πυρός, ἔφυγον στόματα ⸀μαχαίρης, ⸀ἐδυναμώθησαν ἀπὸ ἀσθενείας, ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ, παρεμβολὰς ἔκλιναν ἀλλοτρίων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/034.yaml
  text: quenched the power of fire[a], escaped the edge of the sword, were made strong out of weakness, became mighty in battle[b], put foreign armies to flight.
translation:
  language: ru
  text: погасили силу огня, избежали лезвия меча, обрели силу, выйдя из немощи, стали сильными в бою, обратили в бегство чужеземные войска.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσβεσαν
  choice: угашали
  rationale: Передаёт буквальное значение σβέννυμι и сохраняет яркий образ; несовершенный вид естественен в русском перечислении повторяющихся деяний героев веры.
- source_word: δύναμιν πυρός
  choice: силу огня
  rationale: Сохраняет выражение с δύναμις, не сводя его просто к слову «огонь».
- source_word: ἔφυγον στόματα μαχαίρης
  choice: избегали острия меча
  rationale: ἔφυγον в данном контексте означает успешное избавление; στόματα μαχαίρης — образное выражение, буквально «уста меча», обозначающее его режущую кромку.
- source_word: ἐδυναμώθησαν ἀπὸ ἀσθενείας
  choice: обретали силу после немощи
  rationale: Передаёт переход из состояния немощи к полученной силе и сохраняет пассивный смысл формы ἐδυναμώθησαν без неестественной русской конструкции.
- source_word: ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ
  choice: становились могучими в бою
  rationale: Передаёт наступление нового состояния и конкретный военный контекст; «могучими» позволяет избежать монотонного повтора слова «сила».
- source_word: παρεμβολὰς ἔκλιναν ἀλλοτρίων
  choice: обращали в бегство чужеземные войска
  rationale: παρεμβολή буквально означает лагерь или стан, но здесь метонимически указывает на расположенные лагерем военные силы; ἔκλιναν в контексте означает заставить отступить.
theological_decisions:
- issue: Степень буквальности в перечне избавлений и побед, совершённых верой
  choice: Сохранить конкретные исторические и военные образы без их спиритуализации
  alternative: Обобщить как победу над опасностями и врагами
  rationale: Автор перечисляет конкретные деяния, связанные с историей Израиля и стойкостью верных; физические образы огня, меча, немощи, боя и чужеземных войск следует сохранить.
translation_notes:
  register: Современный литературный русский язык; торжественный, но понятный ритм перечисления. Формы несовершенного вида согласованы с продолжающейся в контексте цепью характерных деяний множественных героев веры.
