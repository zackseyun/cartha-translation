  text: Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαὰκ πειραζόμενος, καὶ τὸν μονογενῆ προσέφερεν ὁ τὰς ἐπαγγελίας ἀναδεξάμενος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/017.yaml
  text: By faith Abraham[a], when he was being tested, offered up Isaac, and the one who had received the promises was offering up his one and only son,
translation:
  language: ru
  text: Верой Авраам, подвергаясь испытанию, принёс Исаака в жертву; и тот, кто получил обещания, приносил в жертву своего единственного[a] сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «единственного в своём роде». Греческое слово подчёркивает уникальность Исаака; традиционный перевод — «единородного».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Верой
  rationale: Творительный падеж естественно передаёт дательный средства и сохраняет повторяющуюся формулу главы.
- source_word: προσενήνοχεν
  choice: принёс в жертву
  rationale: Перфект προσφέρω здесь описывает совершённое в рамках испытания жертвенное действие; русское прошедшее время звучит естественно, а «в жертву» сохраняет жертвенный смысл.
- source_word: πειραζόμενος
  choice: подвергаясь испытанию
  rationale: Передаёт настоящее страдательное причастие и не привносит значения склонения ко греху, возможного у слова «искушение».
- source_word: μονογενῆ
  choice: единственного
  rationale: Передаёт уникальное положение Исаака как сына обетования, не утверждая с излишней прямотой, будто у Авраама не было другого биологического сына.
- source_word: προσέφερεν
  choice: приносил в жертву
  rationale: Несовершенный вид передаёт имперфект и отличает разворачивающееся действие от предшествующего перфекта.
- source_word: ἀναδεξάμενος
  choice: получивший
  rationale: Естественно передаёт аористное причастие и связь Авраама с данными ему обещаниями.
- source_word: ἐπαγγελίας
  choice: обещания
  rationale: Сохранено множественное число; современное «обещания» понятно широкому читателю и не требует церковной лексики.
- source_word: καὶ
  choice: ;
  rationale: Связь двух частей сохранена русским бессоюзным продолжением через точку с запятой, что избегает тяжеловесного повторного «и» при сохранении смыслового усиления.
theological_decisions:
- issue: Значение μονογενής применительно к Исааку, который не был единственным биологическим сыном Авраама
  choice: единственного с поясняющей сноской об уникальности
  alternative: единственного в своём роде; единородного
  rationale: Формулировка сохраняет напряжение исходного текста и подчёркивает уникальный статус Исаака как сына обетования, не привнося позднейшие христологические ассоциации традиционного «единородный».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксический параллелизм двух форм προσφέρω сохранён сочетанием «принёс» и «приносил», а двусмысленность μονογενής вынесена в сноску.
