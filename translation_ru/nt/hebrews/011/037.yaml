  yaml_path: translation/nt/hebrews/011/037.yaml
  text: They were stoned[a], they were sawn in two, they died by the sword; they went about in sheepskins, in goatskins, destitute, afflicted, mistreated—
translation:
  language: ru
  text: Их побивали камнями, распиливали надвое; они умерли от меча[a], скитались в овечьих и козьих шкурах, терпя нужду, притеснения и жестокое обращение, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте употреблено слово φόνος («убийство», «насильственное лишение жизни»), усиливающее указание на смерть от меча; возможный более выразительный перевод: «пали от меча».'
    reason: лексический оттенок φόνος
lexical_decisions:
- source_word: ἐλιθάσθησαν
  choice: их побивали камнями
  rationale: Передаёт аорист страдательного залога от λιθάζω без добавления прямо не выраженного глагола «убивали»; форма естественна для перечня мучений и казней.
- source_word: ἐπρίσθησαν
  choice: распиливали надвое
  rationale: πρίζω означает «пилить»; «надвое» естественно выражает подразумеваемое расчленение и сохраняет традиционно понимаемый смысл.
- source_word: ἐν φόνῳ μαχαίρης ἀπέθανον
  choice: они погибали от меча[a]
  rationale: «Погибали» естественно передаёт насильственную смерть, а «от меча» — образ орудия; примечание сохраняет более сильный оттенок φόνος, не создавая неестественной русской конструкции.
- source_word: περιῆλθον
  choice: скитались
  rationale: В данном контексте περιέρχομαι обозначает переходы с места на место; «скитались» также передаёт лишённость пристанища, подразумеваемую контекстом.
- source_word: ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν
  choice: в овечьих и козьих шкурах
  rationale: Сохраняет параллельные греческие предложные обороты и ясно указывает на одежду из шкур.
- source_word: ὑστερούμενοι
  choice: терпя нужду
  rationale: Причастие обозначает недостаток необходимого; сочетание современно, понятно и передаёт тяжесть положения.
- source_word: θλιβόμενοι
  choice: терпя притеснения
  rationale: Страдательное причастие θλίβω здесь обозначает давление и угнетение; «притеснения» хорошо соответствует контексту преследования.
- source_word: κακουχούμενοι
  choice: жестокое обращение
  rationale: Передаёт дурное, мучительное обращение без неоправданного сужения смысла до какого-либо одного вида насилия.
theological_decisions:
- issue: Степень выраженности насильственного оттенка в ἐν φόνῳ μαχαίρης
  choice: В основном тексте — «погибали от меча», с примечанием об усилительном значении φόνος.
  alternative: «умерли при кровавой расправе мечом» или буквально «умерли в убийстве меча»
  rationale: Греческое φόνος усиливает картину насильственной смерти, однако буквальное воспроизведение сочетания в русском звучит неестественно. «Погибали» сохраняет насильственный характер смерти, а примечание не позволяет утратить лексический оттенок.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Однородный перечень сохранён; формы множественного числа понимаются распределительно, относя разные страдания к разным людям. Конечное тире показывает, что предложение продолжается в следующем стихе.
