  source_fidelity: 'Смысл в целом передан верно: πίστει — «верой», συναπώλετο — «не погибла вместе», а деепричастие «приняв» удачно сохраняет неуточнённую обстоятельственную связь. Однако «непокорные» менее точно передаёт аористное причастие τοῖς ἀπειθήσασιν, обозначающее людей, которые не повиновались. «Блудница» в современном русском шире и может обозначать сексуальную распущенность вообще, тогда как πόρνη конкретно означает проститутку.'
