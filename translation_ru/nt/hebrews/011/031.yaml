  text: πίστει Ῥαὰβ ἡ πόρνη οὐ συναπώλετο τοῖς ἀπειθήσασιν, δεξαμένη τοὺς κατασκόπους μετ’ εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/031.yaml
  text: By faith Rahab the prostitute did not perish with those who were disobedient[b][a], because she had welcomed the spies in peace.
translation:
  language: ru
  text: Верой Раав, проститутка, не погибла вместе с теми, кто не повиновался[a], мирно приняв разведчиков[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вместе с ослушавшимися».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «приняв разведчиков с миром».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Верой
  rationale: Творительный падеж передаёт значение средства или основания и сохраняет повторяющуюся формулу главы 11.
- source_word: Ῥαὰβ ἡ πόρνη
  choice: блудница Раав
  rationale: Имя передано в принятой русской форме «Раав»; «блудница» прямо передаёт πόρνη, сохраняя смысл без эвфемизма и оставаясь понятным в литературном русском.
- source_word: οὐ συναπώλετο
  choice: не погибла вместе
  rationale: Сочетание передаёт заложенную в составном глаголе мысль о совместной гибели.
- source_word: τοῖς ἀπειθήσασιν
  choice: с непокорными
  rationale: Причастие ἀπειθήσασιν обозначает тех, кто не подчинился или не послушался; «непокорные» сохраняет нравственно-волевой оттенок, не сводя выражение только к интеллектуальному неверию.
- source_word: δεξαμένη
  choice: приняв
  rationale: Деепричастие естественно передаёт аористное причастие и сохраняет некоторую открытость его обстоятельственной связи с главным глаголом, не усиливая её до явно причинного «потому что».
- source_word: τοὺς κατασκόπους
  choice: разведчиков
  rationale: В контексте Иисуса Навина речь идёт о людях, тайно обследовавших землю; «разведчики» — ясный и естественный современный эквивалент, тогда как «соглядатаи» архаично.
- source_word: μετ’ εἰρήνης
  choice: с миром
  rationale: Сохраняет образную форму греческого выражения и указывает на мирный, доброжелательный приём; более явный вариант дан в сноске.
theological_decisions:
- issue: Значение πίστις в формуле с примером веры в Евреям 11
  choice: вера
  alternative: доверие; верность
  rationale: В данном контексте πίστει вводит поступок Раав как пример веры. «Вера» естественно сохраняет ключевой термин и связь со всей главой, не подменяя его более узким толкованием.
- issue: 'Оттенок ἀπειθέω: неповиновение или неверие'
  choice: непокорные
  alternative: не поверившие
  rationale: Греческое слово может связывать неверие с отказом повиноваться. Основной текст сохраняет оттенок неповиновения, не исключая лежащего за ним неверия.
translation_notes:
  register: Современный литературный русский с умеренно библейской выразительностью. Порядок «блудница Раав» следует структуре исходного текста; деепричастный оборот сохраняет лаконичность и не делает причинную связь более определённой, чем в греческом.
