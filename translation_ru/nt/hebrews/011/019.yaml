  text: λογισάμενος ὅτι καὶ ἐκ νεκρῶν ἐγείρειν δυνατὸς ὁ θεός· ὅθεν αὐτὸν καὶ ἐν παραβολῇ ἐκομίσατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/019.yaml
  text: having considered that God is able even to raise from the dead[a], from where, in a figure[b], he also received him back.
translation:
  language: ru
  text: Он рассудил, что Бог силён даже воскресить из мёртвых; поэтому[a] он, образно говоря,[b] получил его обратно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «откуда», то есть из области мёртвых.'
    reason: Лексема ὅθεν может вводить вывод («поэтому») или указывать на исходную точку («откуда»).
  - marker: b
    text: 'Буквально: «в притче». Возможное толковательное понимание: «как прообраз».'
    reason: Выражение ἐν παραβολῇ передаёт образный, уподобительный характер возвращения Исаака; типологическое понимание возможно, но не должно выдаваться за единственно необходимое значение.
lexical_decisions:
- source_word: λογισάμενος
  choice: рассудил
  rationale: Передаёт внутреннее обдумывание и вывод Авраама; форма естественна для современного русского повествования.
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Устоявшееся русское выражение для воскресения, сохраняющее множественное число греческого оборота.
- source_word: ἐγείρειν
  choice: воскресить
  rationale: В данном контексте глагол относится к возвращению умершего к жизни; «воскресить» яснее русского буквального «поднять».
- source_word: δυνατὸς ὁ θεός
  choice: Бог силен
  rationale: Сохраняет настоящее значение греческой конструкции и выражает способность Бога без добавочного пояснения.
- source_word: ὅθεν
  choice: оттуда
  rationale: Сохраняет относительное значение «откуда/оттуда» и связь с областью мёртвых, не сводя слово исключительно к логическому «поэтому».
- source_word: ἐν παραβολῇ
  choice: образно говоря
  rationale: Естественно передаёт, что Исаак был возвращён не посредством буквального воскресения; буквальное «в притче» в современном русском здесь могло бы быть непонятно.
- source_word: ἐκομίσατο
  choice: получил его обратно
  rationale: Передаёт контекстуальный смысл возвращения Исаака Аврааму после угрозы жертвоприношения.
- source_word: καὶ ἐκ νεκρῶν
  choice: даже воскресить из мёртвых
  rationale: 'Первое καί имеет усилительное значение: Бог способен даже на воскресение.'
- source_word: καὶ ἐν παραβολῇ ἐκομίσατο
  choice: он, образно говоря, и получил его обратно
  rationale: Частица «и» естественно передаёт второе καί как добавочное и результативное.
theological_decisions:
- issue: Характер возвращения Исаака
  choice: Возвращение описано образно, по аналогии с воскресением, а не как буквальное воскресение.
  alternative: «Получил его обратно как прообраз» — с более явным указанием на типологический смысл.
  rationale: Оборот ἐν παραβολῇ обозначает образное или уподобительное значение, но сам по себе не требует уточнять конкретную типологию; перевод сохраняет эту открытость.
- issue: Значение ὅθεν
  choice: «оттуда» — с указанием на образное возвращение из области мёртвых.
  alternative: «поэтому» — как указание на следствие из рассуждения Авраама.
  rationale: Греческое наречие допускает как исходное/относительное, так и выводное понимание. Основной текст сохраняет более буквальную пространственную связь, а альтернативу отмечает сноска.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет ход рассуждения оригинала; местоимение «его» не заменено именем Исаака, поскольку референт ясен из контекста. Буква «ё» последовательно употреблена в слове «мёртвых».
