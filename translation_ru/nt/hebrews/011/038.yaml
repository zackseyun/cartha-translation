  text: ὧν οὐκ ἦν ἄξιος ὁ κόσμος ⸀ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσι καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/038.yaml
  text: —of whom the world was not worthy—wandering in deserts and mountains[b][a], and caves and holes in the ground.
translation:
  language: ru
  text: — те, которых мир не был достоин, — скитались по пустыням[a] и горам, по пещерам и отверстиям земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по безлюдным местам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: те, которых
  rationale: Родительное множественного числа относительного местоимения отсылает к ранее названным страдальцам за веру. Конструкция «те, которых» естественно вводит оценочное замечание по-русски и сохраняет связь с контекстом.
- source_word: ἄξιος
  choice: достоин
  rationale: Прямой и естественный эквивалент оценочного значения ἄξιος; сохраняет нравственное противопоставление между миром и верными.
- source_word: κόσμος
  choice: мир
  rationale: Здесь слово обозначает человеческий мир, общество, отвергшее этих людей. «Мир» сохраняет широту и богословскую напряжённость греческого выражения.
- source_word: ἐπὶ ἐρημίαις
  choice: по пустыням
  rationale: Предлог ἐπί с дательным при глаголе движения допускает обозначение мест, по которым скитались. «По пустыням» естественно сочетается со «скитались»; более широкое значение «по безлюдным местам» вынесено в сноску.
- source_word: πλανώμενοι
  choice: скитались
  rationale: Передаёт продолжительное, бесприютное перемещение и положение изгнанников точнее, чем нейтральное «бродили».
- source_word: ὄρεσι
  choice: горам
  rationale: Обычное значение ὄρος; форма с предлогом «по» естественно продолжает перечень мест скитаний.
- source_word: σπηλαίοις
  choice: пещерам
  rationale: Прямой, современный и общепонятный эквивалент.
- source_word: ὀπαῖς τῆς γῆς
  choice: расселинам земли
  rationale: ὀπή означает отверстие, щель или расщелину. «Расселины земли» сохраняют конкретный образ естественных укрытий и звучат по-русски достойно; более буквальное выражение приведено в сноске.
theological_decisions:
- issue: Смысл слов «мир не был достоин»
  choice: Сохранена сильная нравственная оценка мира в противопоставлении верным страдальцам.
  alternative: Нейтральное указание на несовместимость верных с окружающим миром.
  rationale: Греческий текст прямо говорит о недостоинстве мира, а не только о социальной отчуждённости; перевод не ослабляет и не развивает эту оценку в отдельное доктринальное утверждение.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Парные тире сохраняют вставной характер оценки «которых мир не был достоин». Повтор предлога «по» перед второй частью перечня обеспечивает естественный русский ритм, не меняя синтаксической связи греческого текста.
