  text: ⸀καὶ πάντες μαρτυρηθέντες διὰ τῆς πίστεως οὐκ ἐκομίσαντο τὴν ἐπαγγελίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/039.yaml
  text: And all these[a], though commended through faith, did not receive the promise[b],
translation:
  language: ru
  text: И все они, получив одобрение благодаря вере[a], не получили обещания[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о них благодаря вере было дано доброе свидетельство»; также возможно: «будучи засвидетельствованы благодаря вере». Греческое причастие означает, что они получили благоприятное свидетельство или одобрение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не обрели обещания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз связывает итог с предшествующим перечнем людей веры, не добавляя явно не выраженного противопоставления.
- source_word: πάντες
  choice: все они
  rationale: Местоимение естественно передаёт отсылку ко всем людям, перечисленным выше в главе.
- source_word: μαρτυρηθέντες
  choice: получив одобрение
  rationale: Страдательное причастие указывает на данное им благоприятное свидетельство; выбранная формулировка естественна по-русски и не называет подразумеваемого, но прямо не указанного деятеля.
- source_word: διὰ τῆς πίστεως
  choice: благодаря вере
  rationale: διά с родительным падежом выражает средство или основание; формулировка ясно связывает полученное одобрение с верой.
- source_word: πίστεως
  choice: вере
  rationale: В контексте Евр 11 речь идёт о вере и доверии Богу; «вера» сохраняет ключевой термин главы.
- source_word: οὐκ ἐκομίσαντο
  choice: не получили
  rationale: Средний залог κομίζω здесь имеет значение получения или обретения обещанного; «не получили» точно и естественно передаёт смысл.
- source_word: τὴν ἐπαγγελίαν
  choice: обещания
  rationale: Существительное в единственном числе сохранено без поясняющего расширения, чтобы не сводить его заранее к исполнению, наследию или благословению.
theological_decisions:
- issue: Смысл выражения «обещание» в контексте
  choice: обещания
  alternative: обещанного; исполнения обещания; обещанного наследия или благословения
  rationale: Греческий текст сохраняет краткость и напряжение между данным обещанием и его ещё не состоявшимся получением; стих 40 продолжает и поясняет эту мысль. Расширение в основном тексте преждевременно закрепило бы одно толкование.
- issue: Источник благоприятного свидетельства
  choice: Не называть прямо того, кто дал одобрение
  alternative: получив одобрение от Бога
  rationale: В контексте главы одобрение подразумевается как Божье, однако в самом причастии деятель прямо не назван; перевод сохраняет эту грамматическую сдержанность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Обещание» предпочтено более церковному «обетование» ради понятности обычному читателю; синтаксис сохраняет компактность и богословскую недосказанность оригинала.
