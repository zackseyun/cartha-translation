source:
  edition: SBLGNT
  text: πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι’ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/007.yaml
  text: By faith Noah[a], having been warned about things not yet seen, in reverent fear constructed an ark for the salvation of his household[d][c][b], through which he condemned the world and became heir of the righteousness according to faith.
translation:
  language: ru
  text: Верой Ной, получив предупреждение[a] о том, чего ещё не было видно, исполнился благоговейного страха[b] и построил ковчег для спасения своих домашних. Через него[c] он осудил мир и стал наследником праведности по вере[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «получив указание свыше» или «получив Божье предупреждение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «движимый благоговением».'
    reason: lexical_alternative
  - marker: c
    text: 'Слова «через него» естественнее всего относятся к ковчегу; возможно и более широкое понимание: через веру Ноя или через его послушный отклик.'
    reason: alternative_reading
  - marker: d
    text: Возможный перевод слова «праведность» — «справедливость», однако здесь контекст благоприятствует значению праведности, связанной с верой.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Верой
  rationale: Творительный падеж передаёт средство или основание действия и сохраняет повторяющуюся формулу 11-й главы Послания к евреям.
- source_word: χρηματισθεὶς
  choice: получив предупреждение
  rationale: Страдательное причастие обозначает получение авторитетного, в данном контексте божественного сообщения или предупреждения. Основной текст не называет Бога прямо, поскольку в греческом Он лишь подразумевается.
- source_word: περὶ τῶν μηδέπω βλεπομένων
  choice: о том, чего ещё не было видно
  rationale: Формулировка сохраняет временное значение μηδέπω и не уточняет сверх текста, что именно подразумевается под ещё невидимым.
- source_word: εὐλαβηθεὶς
  choice: исполнился благоговейного страха
  rationale: Передаёт одновременно страх, почтение и благочестивую осторожность, а не один лишь испуг.
- source_word: κατεσκεύασεν
  choice: построил
  rationale: В контексте ковчега это наиболее естественный современный русский глагол, передающий целенаправленное сооружение.
- source_word: κιβωτὸν
  choice: ковчег
  rationale: Устоявшееся и контекстуально точное обозначение Ноева судна.
- source_word: εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ
  choice: для спасения своей семьи
  rationale: σωτηρία здесь включает конкретное избавление от потопа, а οἶκος обозначает домашних Ноя; «семья» естественнее современному читателю, чем двусмысленное «дом».
- source_word: δι’ ἧς
  choice: Через него
  rationale: Относительное местоимение женского рода в греческом наиболее естественно относится к κιβωτός; в русском род местоимения согласован со словом «ковчег».
- source_word: κατέκρινεν τὸν κόσμον
  choice: он осудил мир
  rationale: 'Прямо передаёт глагол κατακρίνω и сохраняет напряжение мысли: послушание Ноя стало осуждением неверующего мира.'
- source_word: τῆς κατὰ πίστιν δικαιοσύνης
  choice: праведности по вере
  rationale: Устойчивая и ёмкая русская формулировка, сохраняющая связь праведности с верой и не подменяющая κατά более узким причинным толкованием.
- source_word: ἐγένετο κληρονόμος
  choice: стал наследником
  rationale: Естественно передаёт приобретённый статус, выраженный сочетанием ἐγένετο с именной частью сказуемого.
theological_decisions:
- issue: Источник предупреждения в χρηματισθεὶς
  choice: 'В основном тексте источник оставлен подразумеваемым: «получив предупреждение»'
  alternative: «получив Божье предупреждение» или «получив указание свыше»
  rationale: Контекст Ноя ясно предполагает Бога как источник, однако в самой греческой форме Он прямо не назван; сноска сохраняет подразумеваемый божественный характер сообщения.
- issue: Оттенок εὐλαβηθεὶς
  choice: «исполнился благоговейного страха»
  alternative: «движимый благоговением»
  rationale: Выбор сохраняет сочетание страха и почтения и не сводит реакцию Ноя ни к панике, ни к отвлечённому уважению.
- issue: Антецедент δι’ ἧς
  choice: «Через него» — через ковчег
  alternative: Через веру Ноя или через его послушный отклик
  rationale: Ближайший и грамматически согласованный греческий антецедент — κιβωτός, хотя широкий контекст позволяет понимать выражение как относящееся ко всему поступку веры.
- issue: Значение δικαιοσύνη
  choice: «праведность»
  alternative: «справедливость»
  rationale: Наследование и связь с верой указывают здесь прежде всего на статус или качество праведности, а не на общественно-судебную справедливость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; богословски значимые неоднозначности вынесены в сноски, а не устранены из перевода.
