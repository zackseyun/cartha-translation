review_pass:
  verdict: revise
  source_fidelity: 'Смысл передан в целом верно: речь о стремлении патриархов к лучшей, небесной родине и о приготовленном Богом городе. Однако сочетание «не стыдится их, называясь их Богом» неточно передаёт конструкцию ἐπικαλεῖσθαι: здесь речь о том, что Бога называют их Богом, а не о том, что Он Сам Себя так называет. Кроме того, исходное «не стыдится их» следует сохранить без неестественной деепричастной связи.'
  naturalness: «На деле же», «стремятся к лучшей родине — небесной» и «приготовил для них город» звучат естественно в современном литературном русском. Вторая часть исходного варианта синтаксически тяжеловесна и допускает неверное прочтение действия «называясь».
  terminology: «Родина» допустимо и хорошо отражает подразумеваемое πατρίς; «небесной» корректно сохраняет эллиптическое согласование. Формулу «их Богом» необходимо оставить, но передать её как именование Бога другими, а не как самоназвание.
  issues:
  - severity: medium
    issue: «называясь их Богом» меняет направленность ἐπικαλεῖσθαι
    rationale: Инфинитив передаёт «быть называемым их Богом». Русское деепричастие «называясь» обычно означает, что субъект сам принимает или употребляет это наименование; это не тот же смысл.
  - severity: low
    issue: Деепричастная конструкция с «не стыдится их» неестественна
    rationale: Вариант «не стыдится их, называясь их Богом» неясно связывает два элемента греческой конструкции. Более прямое «не стыдится того, что Его называют их Богом» естественно и сохраняет именование, хотя явное дополнение αὐτούς выражено в русском притяжательным «их».
  revised_text: На деле же они стремятся к лучшей родине[a] — небесной. Поэтому Бог не стыдится того, что Его называют их Богом, ведь Он приготовил для них город.
