base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/016.yaml
  text: But as it is[a], they long for a better country—that is, a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.
translation:
  language: ru
  text: На деле же они стремятся к лучшей родине[a] — небесной. Поэтому Бог не стыдится того, что Его называют их Богом, ведь Он приготовил для них город.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте существительное здесь не повторено; прилагательные женского рода отсылают к слову «родина» в ближайшем контексте. Возможен также перевод: «страна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: На деле же
  rationale: Оборот вводит действительное положение вещей в противопоставление предположению предыдущего стиха; такой перевод не сводит νῦν к чисто временному «теперь».
- source_word: κρείττονος ... ἐπουρανίου
  choice: к лучшей родине — небесной
  rationale: Формы женского рода предполагают существительное πατρίς из ближайшего контекста. «Родина» естественно передаёт это понятие и сохраняет согласование обоих прилагательных.
- source_word: ὀρέγονται
  choice: стремятся
  rationale: Глагол выражает направленное, сильное желание и устремлённость; «стремятся» естественно передаёт оба оттенка.
- source_word: οὐκ ἐπαισχύνεται αὐτοὺς
  choice: не стыдится их
  rationale: Сохранено прямо выраженное дополнение αὐτούς, которое иногда исчезает в более сглаженных переводах.
- source_word: θεὸς ἐπικαλεῖσθαι αὐτῶν
  choice: называясь их Богом
  rationale: Передана формула именования и отношений без расширения до утверждений, прямо не выраженных в тексте.
- source_word: ἡτοίμασεν ... πόλιν
  choice: приготовил для них город
  rationale: Аорист передан завершённым действием; неопределённый, конкретный образ города сохранён без добавочного толкования.
theological_decisions:
- issue: Подразумеваемое существительное при κρείττονος и ἐπουρανίου
  choice: Восстановить «родина» из контекста стиха 14
  alternative: «страна» или формально бессубстантивное «к лучшему, то есть небесному»
  rationale: Греческий род указывает на подразумеваемое πατρίς. Русское «родина» точно соответствует контексту и позволяет ясно передать эллипсис, не превращая выражение в отвлечённое «нечто лучшее».
- issue: Связь αὐτούς с формулой «называться их Богом»
  choice: 'Сохранить и «их», и формулу именования: «не стыдится их, называясь их Богом»'
  alternative: «не стыдится называться их Богом»
  rationale: Выбранный вариант сохраняет явное αὐτούς и одновременно не расширяет заветную формулу до парафраза вроде «признаёт их Своим народом».
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским регистром. «На деле же» передаёт логическое противопоставление, а не только временную последовательность; синтаксис второй фразы намеренно сохраняет явно выраженное «их».
