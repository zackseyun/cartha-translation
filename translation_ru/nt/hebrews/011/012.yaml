  source_fidelity: В целом переданы выводное διό, указание на Авраама в ἀφ’ ἑνός, множественность потомков и оба ветхозаветных образа. Однако «к тому же уже почти омертвевшего» неестественно в современном русском и слишком буквально-корпоративно описывает Авраама; νενεκρωμένου здесь образно характеризует его как уже почти мёртвого в контексте преклонного возраста.
  naturalness: «Произошло потомство» возможно, но звучит канцелярски и менее прямо, чем «родилось потомство». Формула «хотя он уже был почти мёртв» естественна, сохраняет намеренно сильную метафору оригинала и не утверждает буквальную смерть.
  terminology: '«Потомство», «звёзды на небе», «неисчислимый песок» уместны для современного литературного библейского регистра. Уточнение «человека» допустимо: мужская форма и контекст относят выражение к Аврааму. Сноска корректно отмечает, что в греческом существительное не названо.'
