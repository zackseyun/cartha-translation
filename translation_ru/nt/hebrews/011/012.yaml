reference: Hebrews 11:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὸ καὶ ἀφ’ ἑνὸς ἐγεννήθησαν, καὶ ταῦτα νενεκρωμένου, καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει καὶ ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
translation:
  language: ru
  text: Поэтому от одного человека[a], хотя он уже был почти мёртв, родилось потомство — столь же многочисленное, как звёзды на небе и как неисчислимый песок у края моря.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от одного»; речь идёт об Аврааме.'
    reason: Уточнение подразумеваемого референта при сохранении более буквальной формы.
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт вывод из сказанного ранее о вере и рождении обещанного потомка.
- source_word: ἀφ’ ἑνὸς
  choice: от одного человека
  rationale: Мужской род и контекст указывают на Авраама; слово «человека» естественно проясняет подразумеваемый референт.
- source_word: ἐγεννήθησαν
  choice: произошло потомство
  rationale: Греческая форма буквально означает «родились», но по-русски единственное собирательное «потомство произошло» естественно выражает появление множества потомков.
- source_word: καὶ ταῦτα νενεκρωμένου
  choice: к тому же уже почти омертвевшего
  rationale: Сохраняет сильную метафору совершенного причастия, не создавая впечатления, будто Авраам был буквально мёртв; по контексту речь о его угасшей способности к деторождению.
- source_word: καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: столь многочисленное, как звёзды на небе
  rationale: Естественно передаёт сравнение и явное указание на многочисленность.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος
  choice: как неисчислимый песок у края моря
  rationale: Сохраняет образ песка возле «края» моря и значение невозможности сосчитать.
theological_decisions:
- issue: Кого обозначает выражение «от одного»
  choice: В основном тексте подразумеваемый референт передан как «один человек», то есть Авраам.
  alternative: Сохранить только «от одного», не уточняя подразумеваемое существительное.
  rationale: Мужской род ἑνός и ближайший контекст указывают на Авраама; уточнение не добавляет отдельного вероучительного положения.
- issue: Смысл νενεκρωμένου
  choice: Метафорическое указание на почти угасшую из-за возраста способность Авраама к деторождению.
  alternative: Передать как буквальную физическую смерть или просто как «мёртвого».
  rationale: Авраам не был буквально мёртв; контекст подчёркивает чудесное появление потомства вопреки преклонному возрасту.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены образы звёзд и песка, а также напряжённая метафора о почти омертвевшем Аврааме; избегнуты архаизмы вроде «породились» и конфессионально окрашенные уточнения.
