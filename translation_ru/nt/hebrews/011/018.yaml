    reason: Сохраняет более буквальные соответствия ἐν, κληθήσεται и собирательному единственному σπέρμα.
lexical_decisions:
- source_word: πρὸς ὃν
  choice: которому
  rationale: Сочетание πρὸς с относительным местоимением при пассивном глаголе естественно обозначает адресата сказанного; форма также сохраняет связь с предшествующим контекстом.
- source_word: ἐλαλήθη
  choice: было сказано
  rationale: Безличная пассивная конструкция близко передаёт аорист страдательного залога, не уточняя говорящего.
- source_word: ὅτι
  choice: двоеточие перед прямой речью
  rationale: Содержание сказанного в современном русском естественно вводится двоеточием и кавычками; отдельный союз не требуется.
- source_word: Ἐν Ἰσαὰκ
  choice: через Исаака
  rationale: В цитате ἐν указывает на Исаака как на линию, через которую будет определяться обещанное потомство; буквальное «в Исааке» в современном русском может ошибочно восприниматься пространственно.
- source_word: κληθήσεταί
  choice: будут называться твоими
  rationale: Передаёт будущее страдательное значение καλέω и контекст признания потомков принадлежащими к обещанной линии, не сводя смысл к простому присвоению имени.
- source_word: σοι
  choice: твоими
  rationale: Дательный местоимения выражает отнесённость потомства к Аврааму; по-русски это естественно передаётся притяжательной формой.
- source_word: σπέρμα
  choice: потомки
  rationale: В данном контексте слово имеет собирательное значение. Множественное «потомки» ясно для современного читателя, хотя грамматический образ единственного собирательного слова отражён в сноске.
theological_decisions:
- issue: Смысл цитаты о линии обещанного потомства
  choice: «Через Исаака будут называться твоими потомки»
  alternative: «В Исааке будет названо тебе семя»
  rationale: Основной текст ясно выражает определение потомства Авраама через Исаака, сохраняя мотив называния, а сноска показывает буквальную форму и не устраняет возможный оттенок признания или исчисления потомства.
translation_notes:
  register: Современный литературный русский; формулировка ясная и достойная, без архаичного «наречётся». Синтаксис оставлен как часть более длинного предложения, соответствующего контексту Послания к евреям 11:17–18.
