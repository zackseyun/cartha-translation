  text: Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς ⸀γῆς, ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπόθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/029.yaml
  text: By faith they crossed the Red Sea as through dry land[a], of which the Egyptians, when they attempted it, were swallowed up.
translation:
  language: ru
  text: Верой они перешли Красное море, как по сухой земле[a]; египтяне же, попытавшись сделать то же, были поглощены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тростниковое море». В греческом тексте стоит «Красное море» (Ἐρυθρὰ Θάλασσα), тогда как древнееврейское название моря в книге Исход иногда понимают как «Море тростника».'
    reason: Лексическая альтернатива и пояснение различия между греческим названием в данном стихе и возможным значением древнееврейского топонима.
lexical_decisions:
- source_word: Πίστει
  choice: Верой
  rationale: Творительный падеж передаёт дательный средства; повторяющаяся формула главы 11 естественно и последовательно переводится словом «вера».
- source_word: διέβησαν
  choice: перешли
  rationale: Глагол обозначает переход с одной стороны на другую; «перешли» ясно и естественно передаёт завершённое действие.
- source_word: τὴν Ἐρυθρὰν Θάλασσαν
  choice: Красное море
  rationale: Греческий текст прямо называет Ἐρυθρὰ Θάλασσα — «Красное море»; возможная связь исходного еврейского названия с «морем тростника» отмечена в сноске.
- source_word: ὡς διὰ ξηρᾶς γῆς
  choice: словно по суше
  rationale: «Словно» сохраняет сравнительное ὡς, а «по суше» естественно передаёт движение через сухую землю.
- source_word: ἧς πεῖραν λαβόντες
  choice: когда же египтяне попытались сделать то же
  rationale: Идиома πεῖραν λαμβάνειν означает «попытаться». «Сделать то же» сохраняет отнесение ἧς к тому же переходу, избегая неестественной русской конструкции с относительным местоимением.
- source_word: οἱ Αἰγύπτιοι
  choice: египтяне
  rationale: Прямое обозначение египтян, преследовавших израильтян.
- source_word: κατεπόθησαν
  choice: море поглотило их
  rationale: Глагол καταπίνω буквально означает «поглощать». Активная русская конструкция с восстановленным из контекста субъектом «море» сохраняет яркий образ и звучит естественнее буквального пассива «были поглощены».
theological_decisions:
- issue: Передача πίστις в программной формуле Евреям 11
  choice: вера
  alternative: доверие; верность
  rationale: В контексте перечня примеров в Евреям 11 речь идёт о вере как основании действия. «Доверие» передаёт один из смысловых оттенков, а «верность» здесь менее вероятна и могла бы сместить акцент.
- issue: Субъект при κατεπόθησαν
  choice: море поглотило их
  alternative: они были поглощены
  rationale: Греческий пассив не называет действующего субъекта, однако контекст однозначно указывает на море. Русская активная формулировка не добавляет богословского толкования и сохраняет образ поглощения.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Синтаксис сделан естественным для русского при сохранении сравнения, последовательности событий и яркого образа «поглощения».
