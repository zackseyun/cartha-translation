  text: μείζονα πλοῦτον ἡγησάμενος τῶν Αἰγύπτου θησαυρῶν τὸν ὀνειδισμὸν τοῦ Χριστοῦ, ἀπέβλεπεν γὰρ εἰς τὴν μισθαποδοσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/026.yaml
  text: He considered the reproach of Messiah greater wealth than the treasures of Egypt[b][a], for he was looking to the reward.
translation:
  language: ru
  text: Он счёл поношение Мессии[a][b] бо́льшим богатством, чем сокровища Египта, потому что устремлял взор к награде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поношение Христа». Греческий титул Χριστός можно передать как «Христос»; здесь употреблено «Мессия», поскольку слово функционирует как титул.'
    reason: alternative_reading
  - marker: b
    text: Выражение «поношение Мессии» может означать поношение, переносимое ради Мессии, поношение, разделённое с Божьим Помазанником, или поношение, которое, согласно Посланию к евреям, находит исполнение в Мессии. Перевод сохраняет греческую формулировку, не ограничивая её одним толкованием.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα πλοῦτον
  choice: бо́льшим богатством
  rationale: Сравнительная конструкция выражает более высокую ценность по сравнению с сокровищами Египта. Ударение помогает отличить сравнительную форму «бо́льшим» от творительного падежа слова «большой» при чтении вслух.
- source_word: ἡγησάμενος
  choice: Он счёл
  rationale: Причастие от ἡγέομαι передаёт обдуманную оценку. Личная форма естественна по-русски и сохраняет смысл «посчитал, расценил».
- source_word: τῶν Αἰγύπτου θησαυρῶν
  choice: сокровища Египта
  rationale: Прямо и естественно передаёт греческую генитивную конструкцию и сохраняет контраст с истинным богатством.
- source_word: τὸν ὀνειδισμὸν
  choice: поношение
  rationale: Слово передаёт публичное бесчестие, оскорбления и позор, переносимые из-за связи с кем-либо; оно также сохраняет библейскую смысловую окраску.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь функционирует как титул. «Мессия» передаёт титульный характер слова, не превращая его в собственное имя.
- source_word: ἀπέβλεπεν
  choice: держал взор устремлённым
  rationale: Имперфект указывает на продолжительную, устойчивую направленность внимания; выбранная формулировка естественно передаёт эту длительность.
- source_word: μισθαποδοσίαν
  choice: награде
  rationale: В данном контексте слово обозначает положительное воздаяние. «Награда» яснее для современного читателя, чем более книжное «мздовоздаяние».
theological_decisions:
- issue: Связь «поношения Мессии» с Моисеем
  choice: Сохранена генитивная конструкция «поношение Мессии» без поясняющего расширения.
  alternative: поношение ради Мессии; поношение, разделённое с Божьим Помазанником; поношение, которое находит исполнение в Мессии
  rationale: Греческий генитив допускает несколько смысловых отношений. Перевод не сужает их до одного толкования и сохраняет христологическое напряжение текста.
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В этом месте слово имеет отчётливую функцию титула; вариант «Мессия» делает это прозрачным, а традиционный вариант указан в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Поношение» и «держал взор устремлённым» dignified и понятны, не прибегая к архаизмам вроде «мздовоздаяние».
