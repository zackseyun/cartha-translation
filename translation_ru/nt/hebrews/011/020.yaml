  text: By faith Isaac blessed Jacob and Esau, even concerning things to come.
translation:
  language: ru
  text: Верой Исаак благословил Иакова и Исава также относительно будущего.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: Верой
  rationale: Творительный падеж естественно передаёт средство или основание действия и сохраняет повторяющуюся формулу главы.
- source_word: καὶ περὶ μελλόντων
  choice: и в том, что относилось к будущему
  rationale: Καί имеет усилительно-добавочный оттенок, а нейтральное множественное μελλόντων обозначает предстоящие события или обстоятельства без излишней конкретизации.
- source_word: εὐλόγησεν
  choice: благословил
  rationale: Обычный и богословски нейтральный эквивалент для εὐλογέω в контексте патриархального благословения.
theological_decisions:
- issue: Связь веры Исаака с будущим содержанием благословений
  choice: и в том, что относилось к будущему
  alternative: относительно будущего
  rationale: Формулировка сохраняет мысль, что благословение касалось грядущего, но не уточняет сверх текста, шла ли речь только о пророчествах, об обещаниях или о конкретных событиях.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная формулировка. Тире проясняет присоединительный акцент καί, не превращая его в отдельное утверждение.
