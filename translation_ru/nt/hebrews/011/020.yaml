  source_fidelity: Πίστει correctly appears as «Верой», εὐλόγησεν as «благословил», and both names are transmitted correctly. However, «в том, что относилось к будущему» recasts περὶ μελλόντων (‘concerning things to come/the future’) as a relative clause about matters that were related to the future. A more direct rendering preserves the Greek’s concise, deliberately non-specific reference.
