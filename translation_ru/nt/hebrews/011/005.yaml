  source_fidelity: 'Перевод точно передаёт основные элементы греческого текста: инструментальное Πίστει («Верой»), пассивное μετετέθη («был взят»), цель/результат τοῦ μὴ ἰδεῖν θάνατον («чтобы не увидеть смерти»), имперфект οὐχ ηὑρίσκετο («его не находили»), причинное пояснение о действии Бога и предшествующее свидетельство об угождении Богу. Не добавляются ни место, ни механизм взятия Еноха.'
