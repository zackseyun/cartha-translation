id: HEB.11.5
reference: Hebrews 11:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Πίστει Ἑνὼχ μετετέθη τοῦ μὴ ἰδεῖν θάνατον, καὶ οὐχ ηὑρίσκετο διότι μετέθηκεν αὐτὸν ὁ θεός· πρὸ γὰρ τῆς ⸀μεταθέσεως μεμαρτύρηται εὐαρεστηκέναι τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/005.yaml
  text: By faith Enoch was taken away so that he should not see death[a], and he was not found because God had taken him away. For before his being taken away, he had been commended as having pleased God[c][b],
translation:
  language: ru
  text: Верой Енох был взят, чтобы не увидеть смерти[a], и его не находили, потому что Бог взял его. Ведь ещё до того, как он был взят, он получил свидетельство, что угодил Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть не испытать смерти, не умереть.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Верой
  rationale: 'Творительный падеж естественно передаёт инструментальное или сопутствующее значение дательного: вера была определяющим основанием жизни Еноха.'
- source_word: μετετέθη / μετέθηκεν / μεταθέσεως
  choice: был взят / взял / был взят
  rationale: Глагольная формулировка ясна современному читателю, сохраняет повтор одного смыслового корня и не добавляет отсутствующего в стихе уточнения о месте или способе перенесения.
- source_word: τοῦ μὴ ἰδεῖν θάνατον
  choice: чтобы не увидеть смерти
  rationale: Сохраняет прозрачный греческий идиом и допускаемую конструкцией оттеночную связь цели и результата.
- source_word: οὐχ ηὑρίσκετο
  choice: его не находили
  rationale: Передаёт имперфект как продолжавшееся положение дел и не называет тех, кто его искал, поскольку они не названы в греческом тексте.
- source_word: μεμαρτύρηται
  choice: он получил свидетельство
  rationale: Передаёт пассивную форму μαρτυρέω и характерный для Евреям мотив данного Еноху свидетельства, не сужая смысл до простой человеческой похвалы.
- source_word: εὐαρεστηκέναι τῷ θεῷ
  choice: что угодил Богу
  rationale: Естественно по-русски передаёт перфектный инфинитив как предшествующее свидетельству состояние или действие.
theological_decisions:
- issue: Смысл удаления Еноха
  choice: «был взят» без пояснения, куда и каким образом
  alternative: «был взят на небо» или традиционное «переселён»
  rationale: Стих утверждает действие Бога и то, что Енох не увидел смерти, но не раскрывает здесь механизм и место его удаления.
- issue: Значение выражения «увидеть смерть»
  choice: Сохранить идиом в основном тексте
  alternative: 'Передать толковательно: «испытать смерть» или «умереть»'
  rationale: Русское выражение понятно и сохраняет образность оригинала; смысл поясняется в сноске.
- issue: Смысл μεμαρτύρηται
  choice: «получил свидетельство»
  alternative: «был одобрен» или «о нём было засвидетельствовано»
  rationale: Формулировка сохраняет богословски значимую тему свидетельства в Евр 11 и не определяет сверх текста, кто именно непосредственно выступает свидетелем — Бог или Писание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для широкого читателя; идиом «увидеть смерть» сохранён ради образности оригинала и снабжён кратким пояснением.
