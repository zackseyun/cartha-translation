    rationale: Хотя подразумевается, что воскресшими были умершие, конструкция с тире звучит тяжеловесно и может быть воспринята как слишком свободная перестройка. «Благодаря воскресению» ясно передаёт ἐξ ἀναστάσεως как основание/результат возвращения.
  - severity: low
