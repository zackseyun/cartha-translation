  verdict: revise
  source_fidelity: 'Нужна небольшая правка: аорист ἔλαβον лучше передать совершенным видом («получили»), а связь ἐξ ἀναστάσεως с возвращением умерших следует выразить без потенциально двусмысленного «— воскресшими». Остальная смысловая структура стиха передана верно: противопоставление сохранено, отказ от предложенного освобождения и цель обрести лучшее воскресение не искажены.'
  naturalness: Исправленный вариант звучит естественно на современном литературном русском. Формулировка «благодаря воскресению» ясно относится к возвращению умерших, а «были подвергнуты пыткам» не утверждает сверх текста, что все они умерли от пыток.
  terminology: «Воскресение», «освобождение» и «обрести лучшее воскресение» точны и стилистически уместны. «Освобождение» в основном тексте не навязывает богословское значение ἀπολύτρωσις; пояснение в сноске сохраняет контекстуальный смысл. Примечание к ἐτυμπανίσθησαν корректно отмечает неопределённость конкретного способа истязания.
