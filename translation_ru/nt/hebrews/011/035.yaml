  text: ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν· ἄλλοι δὲ ἐτυμπανίσθησαν, οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν, ἵνα κρείττονος ἀναστάσεως τύχωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/035.yaml
  text: Women received back their dead by resurrection[a]; but others were tortured, not accepting release[c][b], so that they might obtain a better resurrection.
translation:
  language: ru
  text: Женщины получили обратно своих умерших благодаря воскресению[a]; другие же были подвергнуты пыткам[b], отказавшись от освобождения[c], чтобы обрести лучшее воскресение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из воскресения». Смысл в том, что умершие вернулись к этим женщинам живыми.'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол обозначает тяжёлое телесное истязание и, возможно, связан с избиением на раме или барабаноподобном орудии; точный способ пытки неясен.
    reason: cultural_note
  - marker: c
    text: «Освобождение» можно также перевести как «избавление». Здесь имеется в виду освобождение от пыток или смерти, а не обязательно искупление в богословском смысле.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: получали обратно
  rationale: В сочетании с «своих умерших» и «воскресшими» глагол обозначает возвращение прежде умерших близких.
- source_word: γυναῖκες
  choice: женщины
  rationale: Обычное значение множественного числа; контекст не требует сужать его до «жён».
- source_word: ἐξ ἀναστάσεως
  choice: воскресшими
  rationale: Естественно передаёт результат и способ возвращения умерших к женщинам, не вводя неясного буквального оборота «из воскресения».
- source_word: τοὺς νεκροὺς αὐτῶν
  choice: своих умерших
  rationale: Естественная русская передача субстантивированного прилагательного с притяжательным местоимением; речь об умерших близких.
- source_word: ἄλλοι δὲ
  choice: другие же
  rationale: Частица δέ обозначает контраст между теми, кто пережил избавление, и теми, кто остался верен среди страданий.
- source_word: ἐτυμπανίσθησαν
  choice: подвергались жестоким пыткам
  rationale: Передаёт достоверное ядро значения, не уточняя спорный способ истязания, возможно связанный с рамой или барабаноподобным орудием.
- source_word: οὐ προσδεξάμενοι
  choice: отказывались от
  rationale: Причастие указывает не просто на неполучение, а на сознательное непринятие предложенного освобождения.
- source_word: τὴν ἀπολύτρωσιν
  choice: освобождения
  rationale: В данном контексте речь об избавлении от пыток или смерти, а не обязательно об искуплении в богословском смысле.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно выражает цель их отказа.
- source_word: κρείττονος ἀναστάσεως
  choice: лучшее воскресение
  rationale: Сохраняет характерное для Послания к евреям сравнительное значение κρείττων и контраст с возвращением к земной смертной жизни.
- source_word: τύχωσιν
  choice: обрести
  rationale: Естественный русский эквивалент значения «получить, достичь» при дополнении «воскресение».
theological_decisions:
- issue: Значение ἀπολύτρωσιν в контексте
  choice: освобождение от пыток или смерти
  alternative: искупление в широком богословском смысле
  rationale: Ближайший контекст говорит о страдальцах, отвергших предложенный выход ради верности. «Освобождение» сохраняет повествовательный смысл и не привносит отсутствующее здесь утверждение об искуплении.
- issue: Смысл выражения «лучшее воскресение»
  choice: воскресение, превосходящее временное возвращение к смертной жизни
  alternative: просто более благоприятное воскресение без явного сопоставления с первой половиной стиха
  rationale: Структура стиха противопоставляет возвращение умерших к нынешней жизни надежде мучеников за пределами смерти, но не уточняет механизм или все особенности этого воскресения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Конструкция разделена точкой с запятой для сохранения резкого смыслового контраста. Все примечания привязаны к соответствующим местам текста.
