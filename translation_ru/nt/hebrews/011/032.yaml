base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/032.yaml
  text: And what more shall I say? For time would fail me if I were telling about Gideon[a], Barak, Samson, Jephthah, David, and also Samuel and the prophets,
translation:
  language: ru
  text: И что ещё мне сказать? Ведь мне не хватит времени, если я буду рассказывать[a] о Гедеоне, Вараке, Самсоне, Иеффае, Давиде, а также о Самуиле и пророках.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь мне не хватит времени, чтобы рассказывать…»'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τί ἔτι λέγω;
  choice: И что ещё мне сказать?
  rationale: Естественный русский риторический вопрос сохраняет побуждающую силу греческого τί ἔτι λέγω и вводит дальнейшие примеры.
- source_word: ἐπιλείψει με γὰρ ὁ χρόνος
  choice: Ведь мне не хватит времени
  rationale: Глагол ἐπιλείψει буквально описывает время, которого говорящему недостанет; эта русская идиома естественно передаёт пояснительную силу γάρ и риторическое употребление будущего времени.
- source_word: διηγούμενον
  choice: если я стану рассказывать
  rationale: Причастие согласуется с με и обозначает продолжающееся действие, при котором автору не хватило бы времени. Условная формулировка естественна по-русски и не превращает оборот в буквальное утверждение о полном отсутствии времени.
- source_word: περὶ
  choice: о
  rationale: Предлог περί с родительным падежом вводит тему повествования; русское «о» точно и естественно в данном контексте.
- source_word: Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουὴλ
  choice: Гедеоне, Вараке, Самсоне, Иеффае, Давиде, Самуиле
  rationale: Использованы закрепившиеся в русской библейской традиции формы личных имён, поставленные в требуемом предлогом «о» падеже.
- source_word: τε καὶ
  choice: а также
  rationale: Сочетание сохраняет добавочный оттенок τε καὶ и слегка выделяет переход от Давида к Самуилу, не придавая связи лишнего богословского значения.
- source_word: τῶν προφητῶν
  choice: пророках
  rationale: Прямой и естественный перевод названия группы; определённость в русском языке понятна из контекста без отдельного артикля.
theological_decisions:
- issue: Риторический смысл указания на нехватку времени
  choice: «мне не хватит времени, если я стану рассказывать»
  alternative: 'Более буквальное: «время не позволит мне, рассказывающему…»'
  rationale: Греческая конструкция служит риторическим объяснением краткости дальнейшего перечисления. Русская условная форма передаёт эту функцию, не утверждая, будто у автора буквально совсем нет времени.
- issue: Связь Давида, Самуила и пророков
  choice: «Давиде, а также о Самуиле и пророках»
  alternative: «Давиде, Самуиле и пророках»
  rationale: «А также» передаёт добавочный оттенок τε καὶ, при этом Самуил остаётся назван отдельно от общей группы пророков, как и в греческом синтаксисе.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Риторический вопрос сохранён; тяжеловесная буквальная конструкция с причастием заменена естественным условным оборотом. Имена даны в традиционных русских формах.
