  yaml_path: translation/nt/hebrews/011/003.yaml
  text: By faith we understand that the ages were framed by the word of God[a], so that what is seen did not come into being from things that are visible.
translation:
  language: ru
  text: Верой мы понимаем, что века[a] были устроены словом Бога, так что видимое возникло не из видимого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «миры» или «мироздание»; буквально по-гречески — «века»: это слово может обозначать мировой порядок во всей его временной протяжённости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Верой
  rationale: 'Творительный падеж передаёт инструментальное значение дательного: понимание достигается верой. Краткая формула также соответствует повторяющемуся построению главы.'
- source_word: νοοῦμεν
  choice: мы понимаем
  rationale: Глагол обозначает умственное постижение, а не чувственное восприятие; «понимаем» естественно передаёт этот смысл.
- source_word: κατηρτίσθαι
  choice: были устроены
  rationale: Перфектный пассивный инфинитив выражает совершённое Богом упорядочение и установление целого; «устроены» не сужает смысл до одного лишь изготовления материи.
- source_word: τοὺς αἰῶνας
  choice: века
  rationale: Буквальное значение множественного αἰῶνες сохраняет временную широту выражения; в данном контексте оно может охватывать мироздание во всём ходе времени, что поясняется в сноске.
- source_word: ῥήματι θεοῦ
  choice: словом Бога
  rationale: Творительный падеж передаёт средство действия, а «слово» естественно выражает здесь произнесённое Божье повеление, не перегружая текст пояснением.
- source_word: εἰς τὸ μὴ ... γεγονέναι
  choice: так что ... произошло не
  rationale: Оборот передаёт следствие; «произошло» сохраняет значение возникновения, не вводя более сильной метафизической формулировки.
- source_word: ἐκ φαινομένων
  choice: из того, что можно видеть
  rationale: Формулировка ясно передаёт множественное субстантивированное причастие со значением видимого или являющегося зрению и избегает тяжёлого повтора слова «видимое».
- source_word: τὸ βλεπόμενον
  choice: видимое
  rationale: Единственное число имеет собирательный смысл и обозначает весь наблюдаемый порядок; русское субстантивированное прилагательное передаёт это естественно.
theological_decisions:
- issue: Объём значения αἰῶνες в связи с творением
  choice: В основном тексте сохранено «века».
  alternative: «миры» или «мироздание»
  rationale: Греческое слово может обозначать не только пространственный космос, но и мировой порядок в его временной протяжённости. Буквальный вариант сохраняет эту временно-космическую широту, а сноска сообщает читателю более привычные контекстуальные варианты.
- issue: Связь стиха с учением о творении из ничего
  choice: Текст утверждает, что видимое произошло не из того, что можно видеть, без прямого добавления формулы «из ничего».
  alternative: Явно перевести как утверждение о сотворении из ничего.
  rationale: Такое учение согласуется со стихом, однако греческая формулировка непосредственно противопоставляет видимое его возможному происхождению из видимого. Перевод не расширяет утверждение сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Сохранена необычная, но содержательно значимая лексема «века»; её контекстуальный смысл раскрыт в сноске. Формулировка последней части остаётся ясной и не устраняет заложенное в греческом тексте богословское напряжение.
