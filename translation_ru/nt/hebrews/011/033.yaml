  text: οἳ διὰ πίστεως κατηγωνίσαντο βασιλείας, εἰργάσαντο δικαιοσύνην, ἐπέτυχον ἐπαγγελιῶν, ἔφραξαν στόματα λεόντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/033.yaml
  text: who through faith conquered kingdoms[a], worked righteousness, obtained promises, shut the mouths of lions[b],
translation:
  language: ru
  text: которые верой покорили царства, совершали праведные дела[a], обретали обещанное[b], заградили львиные пасти,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осуществляли справедливость». Греческое слово может означать как праведность, так и справедливость; здесь речь может идти о праведных делах или о справедливом правлении.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «достигали обещаний». То есть они видели исполнение отдельных Божьих обещаний; это не обязательно означает окончательное получение всего обещанного Богом (ср. ст. 39).'
    reason: ambiguity
lexical_decisions:
- source_word: διὰ πίστεως
  choice: верой
  rationale: 'Творительный падеж естественно передаёт средство действия: они совершали это посредством веры. Такой выбор сохраняет ключевую тему всей главы и звучит по-русски естественнее, чем буквальное «через веру».'
- source_word: κατηγωνίσαντο βασιλείας
  choice: покоряли царства
  rationale: Глагол обозначает победу или одоление в борьбе; «покоряли» сохраняет военно-политический смысл и хорошо сочетается с «царствами».
- source_word: εἰργάσαντο δικαιοσύνην
  choice: творили праведное
  rationale: Выражение передаёт деятельный характер ἐργάζομαι и широкий моральный смысл δικαιοσύνη, избегая неестественного русского сочетания «совершали праведность».
- source_word: ἐπέτυχον ἐπαγγελιῶν
  choice: получали обещанное
  rationale: В данном сочетании множественное ἐπαγγελιῶν может обозначать исполнение отдельных Божьих обещаний. «Получали обещанное» естественно по-русски и не утверждает, будто герои уже обрели окончательное исполнение всех обетований.
- source_word: ἔφραξαν στόματα λεόντων
  choice: заграждали пасти львам
  rationale: «Заграждали» передаёт прекращение действия, выраженное φράσσω, а «пасти» является естественным русским обозначением ртов хищных зверей и сохраняет яркий образ.
theological_decisions:
- issue: Значение πίστις в перечне деяний Евреям 11
  choice: вера
  alternative: доверие; верность
  rationale: Контекст главы описывает поступки, совершённые в уповании на Бога. «Вера» сохраняет центральный термин автора, тогда как «доверие» поясняет лишь одну сторону значения, а «верность» здесь менее вероятна.
- issue: Значение δικαιοσύνη в непавловском контексте
  choice: праведное
  alternative: справедливость
  rationale: Здесь речь, вероятнее всего, о праведных поступках или осуществлении того, что правильно. Основной текст сохраняет широкий нравственный смысл, а возможный оттенок справедливого правления отмечен в сноске.
- issue: Соотношение полученных обещаний с ещё не исполненным окончательным обетованием
  choice: получали обещанное
  alternative: обретали обещания
  rationale: Формулировка допускает исполнение конкретных обещаний и не снимает напряжения с Евреям 11:39, где сказано, что перечисленные свидетели не получили обещанного в окончательном смысле.
translation_notes:
  register: Современный литературный русский язык с приподнятым, но не архаичным ритмом. Повтор несовершенного вида («покоряли», «творили», «получали», «заграждали») передаёт перечисление различных деяний многих героев веры. Все сноски отмечены в основном тексте.
