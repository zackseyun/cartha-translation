source:
  edition: SBLGNT
  text: Πίστει Μωϋσῆς γεννηθεὶς ἐκρύβη τρίμηνον ὑπὸ τῶν πατέρων αὐτοῦ, διότι εἶδον ἀστεῖον τὸ παιδίον καὶ οὐκ ἐφοβήθησαν τὸ διάταγμα τοῦ βασιλέως.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/023.yaml
  text: By faith Moses[a], when he was born, was hidden for three months by his parents, because they saw that the child was beautiful, and they were not afraid of the king’s edict.
translation:
  language: ru
  text: Верой родители Моисея, когда он родился, три месяца скрывали его, потому что увидели, что ребёнок прекрасен[a], и не испугались царского указа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «красив», «миловиден» или «необыкновенен». Греческое слово ἀστεῖον перекликается с Исх. 2:2 и Деян. 7:20.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Верой
  rationale: Творительный падеж передаёт значение средства и сохраняет повторяющийся мотив 11-й главы.
- source_word: Μωϋσῆς γεννηθεὶς ἐκρύβη
  choice: родители Моисея, когда он родился, ... скрывали его
  rationale: Греческая пассивная конструкция буквально говорит, что Моисей после рождения был скрываем родителями. Активная русская конструкция естественнее, ясно называет действующих лиц и не меняет смысла.
- source_word: τρίμηνον
  choice: три месяца
  rationale: Винительный длительности естественно передаётся по-русски без предлога.
- source_word: ὑπὸ τῶν πατέρων αὐτοῦ
  choice: родители Моисея
  rationale: Хотя πατέρων буквально означает «отцы», здесь слово обозначает родителей в совокупности; это соответствует контексту Исхода и формам множественного числа далее.
- source_word: διότι εἶδον
  choice: потому что увидели
  rationale: Прямо сохраняет причинную связь и конкретное зрительное восприятие.
- source_word: ἀστεῖον τὸ παιδίον
  choice: ребёнок прекрасен
  rationale: ἀστεῖος может означать красивого, миловидного, замечательного или необыкновенного ребёнка. «Прекрасен» естественно звучит в современном литературном русском и не сводит смысл только к внешней красоте.
- source_word: οὐκ ἐφοβήθησαν
  choice: не испугались
  rationale: Естественная русская передача аориста, сохраняющая противопоставление веры и страха.
- source_word: τὸ διάταγμα τοῦ βασιλέως
  choice: царского указа
  rationale: «Указ» передаёт официальный и властный характер διάταγμα; «царский» соответствует τοῦ βασιλέως и естественен в данном повествовательном контексте.
theological_decisions:
- issue: Мотивация родителей Моисея
  choice: 'Сохранены оба элемента текста: они увидели, что ребёнок прекрасен, и не испугались царского указа; всё действие вводится словами «Верой».'
  alternative: Понимать красоту ребёнка либо как единственную причину поступка, либо как особый сверхъестественный знак.
  rationale: Греческий текст связывает поступок родителей и с восприятием ребёнка, и с отсутствием страха, но не поясняет, была ли его необычность божественным знамением. Перевод не устраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык, понятный широкому кругу читателей. Активная конструкция выбрана ради естественности, при этом участники действия и временная связь исходного текста сохранены.
