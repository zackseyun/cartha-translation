id: HEB.11.6
reference: Hebrews 11:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/006.yaml
  text: And without faith it is impossible to please him[c][b][a], for the one who comes to God must believe that he exists and that he is a rewarder of those who diligently seek him.
translation:
  language: ru
  text: А без веры[a] невозможно угодить Богу, ведь тот, кто приходит к Богу, должен верить, что Он существует[b] и что Он вознаграждает[c] тех, кто настойчиво ищет Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доверия». В иных контекстах πίστις может означать также «верность», но здесь последующее пояснение сосредоточено на вере Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «что Он есть». Греческое выражение кратко и допускает такой более буквальный перевод.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «что Он — Воздаятель» либо «что Он оказывается Воздаятелем». В греческом тексте употреблён глагол «становится», который здесь описывает, кем Бог оказывается для ищущих Его, а не обязательно изменение Его природы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πίστεως
  choice: А без веры
  rationale: χωρίς выражает отсутствие необходимого условия, δέ служит мягкой связкой с предыдущей мыслью, а πίστις здесь поясняется глаголом πιστεῦσαι и потому естественно передаётся словом «вера».
- source_word: ἀδύνατον εὐαρεστῆσαι
  choice: невозможно угодить Богу
  rationale: Безличная конструкция с инфинитивом естественно передаётся по-русски словом «невозможно». Объект «Богу» ясен из следующей части стиха и делает русский текст недвусмысленным.
- source_word: πιστεῦσαι γὰρ δεῖ
  choice: ведь ... должен верить
  rationale: γάρ вводит основание предыдущего утверждения, а δεῖ выражает необходимость; «ведь ... должен» сохраняет обе функции и звучит естественно.
- source_word: τὸν προσερχόμενον τῷ θεῷ
  choice: тот, кто приходит к Богу
  rationale: Причастие προσερχόμενον обозначает приближение или обращение к Богу. «Приходит к Богу» понятно современному читателю и не усиливает без необходимости культовый оттенок.
- source_word: ὅτι ἔστιν
  choice: что Он существует
  rationale: Краткое греческое выражение буквально допускает «что Он есть», но в данном контексте утверждает реальность бытия Бога; «существует» ясно передаёт этот смысл.
- source_word: τοῖς ἐκζητοῦσιν αὐτόν
  choice: тех, кто настойчиво ищет Его
  rationale: ἐκζητέω сильнее простого ζητέω и указывает на усердный, настойчивый поиск; наречие «настойчиво» передаёт эту усиленность без архаизма.
- source_word: μισθαποδότης γίνεται
  choice: Он вознаграждает
  rationale: μισθαποδότης обозначает того, кто даёт награду или воздаяние, а γίνεται в этой предикативной конструкции выражает, кем Бог оказывается для ищущих Его. Глагольное русское выражение естественно передаёт действие; форма греческого выражения отмечена в сноске.
theological_decisions:
- issue: Смысл πίστις в богословски значимом контексте
  choice: вера
  alternative: доверие; верность
  rationale: Непосредственное пояснение через πιστεῦσαι указывает здесь прежде всего на веру и доверие Богу, а не на человеческую верность. Слово «вера» сохраняет устойчивый термин, не сводя его к конфессионально узкому определению.
- issue: Значение ὅτι ἔστιν
  choice: что Он существует
  alternative: что Он есть
  rationale: Основной текст делает понятным утверждение о реальности Бога, а более краткая и неоднозначная форма греческого выражения сохраняется в сноске.
- issue: Сила γίνεται в выражении о Божьем воздаянии
  choice: Он вознаграждает
  alternative: Он — Воздаятель; Он оказывается Воздаятелем; Он становится Воздаятелем
  rationale: Буквальное «становится» по-русски может ошибочно подразумевать изменение Божьей природы. В контексте говорится о том, кем Бог является или оказывается для ищущих Его; основной вариант передаёт это естественно, а формальная особенность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра, без архаизмов. Повтор слова «Бог» сохранён ради ясности логики стиха. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
