  text: πίστει παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/009.yaml
  text: By faith he lived as a foreigner in the land of promise[a], as in a foreign land, dwelling in tents with Isaac and Jacob, fellow heirs of the same promise.
translation:
  language: ru
  text: Верой Авраам жил как пришелец в земле обетованной, словно в чужой земле, живя в шатрах с Исааком и Иаковом, сонаследниками того же обетования.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστει
  choice: Верой
  rationale: Дательный падеж выражает средство или основание действия; в контексте Евр 11 естественно и последовательно передаётся как «верой».
- source_word: παρῴκησεν
  choice: поселился … как в чужой
  rationale: Глагол обозначает проживание не на правах коренного жителя, а как пришелец; сочетание с ὡς ἀλλοτρίαν естественно передаёт этот оттенок по-русски.
- source_word: εἰς γῆν τῆς ἐπαγγελίας
  choice: в земле обетованной
  rationale: При глаголе проживания εἰς допускает локативное понимание. «Земля обетованная» — ясное и укоренённое в русском библейском языке выражение, означающее землю, данную в обетовании.
- source_word: ὡς ἀλλοτρίαν
  choice: как в чужой
  rationale: Прилагательное относится к земле и указывает, что Авраам жил в ней как в принадлежащей другим, не как в собственном владении.
- source_word: ἐν σκηναῖς κατοικήσας
  choice: живя в шатрах
  rationale: Причастие описывает сопутствующий образ жизни; «шатры» сохраняют конкретный образ временного жилища и соответствуют достойному современному регистру.
- source_word: μετὰ Ἰσαὰκ καὶ Ἰακὼβ
  choice: вместе с Исааком и Иаковом
  rationale: μετά с родительным падежом прямо означает совместность; добавление «вместе» звучит естественно и ясно.
- source_word: τῶν συγκληρονόμων
  choice: сонаследниками
  rationale: Слово обозначает тех, кто совместно получает одно наследие; «сонаследники» точно и достаточно понятно передаёт составное греческое понятие.
- source_word: τῆς ἐπαγγελίας τῆς αὐτῆς
  choice: того же обетования
  rationale: 'Оборот подчёркивает тождество обетования: Исаак и Иаков разделяли именно то обетование, которое было дано Аврааму.'
- source_word: implied subject
  choice: Авраам
  rationale: Подлежащее подразумевается и продолжается из Евр 11:8; его явное называние необходимо для самостоятельной ясности русского стиха.
theological_decisions:
- issue: Подразумеваемое подлежащее
  choice: Авраам назван явно
  alternative: 'Сохранить местоименное или нулевое подлежащее: «Верой он поселился…»'
  rationale: Контекст предыдущего стиха однозначно указывает на Авраама; явное имя делает отдельный стих понятным, не добавляя спорного толкования.
- issue: Статус Авраама в обещанной земле
  choice: «поселился … как в чужой»
  alternative: «жил там как чужеземец»
  rationale: Греческий текст допускает акцент и на статусе пришельца, и на восприятии земли как чужой. Выбранная формулировка сохраняет сравнение ὡς и непосредственную связь ἀλλοτρίαν с γῆν, не устраняя напряжение между обетованием земли и отсутствием владения ею.
translation_notes:
  register: Современный литературный русский с умеренно библейской лексикой («обетованная», «шатры», «сонаследники»). Синтаксис сделан плавным и понятным; подлинное напряжение между обещанной и всё ещё чужой землёй сохранено.
