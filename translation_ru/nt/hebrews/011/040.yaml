  text: since God had provided something better for us[b][a], so that they would not be made perfect apart from us.
translation:
  language: ru
  text: потому что Бог предусмотрел для нас нечто лучшее[a], чтобы они не были доведены до совершенства без нас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заранее приготовил для нас нечто лучшее»; возможно также: «предвидел нечто лучшее для нас». Греческое слово может обозначать как предварительное видение, так и заблаговременное устроение; контекст скорее указывает на Божий замысел и обеспечение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «без нас не достигли совершенства»; возможно также: «не достигли полноты без нас».'
    reason: alternative_reading
lexical_decisions:
- source_word: προβλεψαμένου
  choice: предусмотрел
  rationale: Глагол может указывать и на предвидение, и на заблаговременное устроение. «Предусмотрел» естественно передаёт Божий предварительный замысел и обеспечение, не сводя значение лишь к мысленному предвидению.
- source_word: κρεῖττόν τι
  choice: нечто лучшее
  rationale: Сохраняет неопределённость τι и важную для Послания к евреям повторяющуюся тему «лучшего».
- source_word: περὶ ἡμῶν
  choice: для нас
  rationale: В сочетании с προβλεψαμένου оборот указывает на то, что Божье решение было принято с нами в виду; «для нас» естественно выражает это по-русски.
- source_word: ἵνα μὴ
  choice: чтобы ... не
  rationale: Передаёт целевое или результативное значение греческой конструкции без искусственного уточнения.
- source_word: χωρὶς ἡμῶν
  choice: отдельно от нас
  rationale: Передаёт мысль, что завершение их пути не происходит обособленно от нас; вариант «без нас» дан в примечании.
- source_word: τελειωθῶσιν
  choice: достигли совершенства
  rationale: Сохраняет богословскую насыщенность τελειόω — доведение до полноты и совершенства — и не ограничивает смысл лишь нравственной безупречностью или временным завершением.
- source_word: τοῦ θεοῦ
  choice: Бог
  rationale: 'Генитивная абсолютная конструкция естественно передана придаточным причины: «потому что Бог предусмотрел».'
theological_decisions:
- issue: Значение τελειωθῶσιν в контексте истории спасения в Послании к евреям
  choice: достигли совершенства
  alternative: были доведены до совершенства; достигли полноты
  rationale: Формулировка удерживает одновременно значения совершенства, завершения и достижения предназначенной полноты, не сводя слово только к нравственному совершенствованию или хронологическому окончанию.
- issue: Характер Божьего действия в προβλεψαμένου
  choice: предусмотрел
  alternative: предвидел; заранее приготовил
  rationale: «Предусмотрел» сохраняет возможный оттенок предварительного видения, но в данном контексте также указывает на Божий замысел и устроение, не навязывая более узкой доктринальной трактовки.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет связь с предыдущим стихом через «потому что». Формулировка намеренно удерживает неоднозначность προβλέπω и богословское напряжение τελειόω.
