  text: πίστει καὶ ⸂αὐτῇ Σάρρᾳ⸃ δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν καὶ παρὰ καιρὸν ⸀ἡλικίας, ἐπεὶ πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/011.yaml
  text: By faith even Sarah herself received power to conceive offspring[a], even beyond the proper time of life, because she considered the one who had promised to be faithful.
translation:
  language: ru
  text: Верой даже сама Сарра получила силу зачать потомство[a], несмотря на то что она уже вышла из соответствующего возраста, потому что считала давшего обещание верным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «получила силу для положения семени». Греческое выражение необычно; в данном контексте оно означает способность произвести потомство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Верой
  rationale: Творительный падеж передаёт значение средства в повторяющейся формуле Евр. 11 и сохраняет ключевой термин главы.
- source_word: καὶ αὐτῇ Σάρρᾳ
  choice: и сама Сарра
  rationale: Сочетание καί с усилительным αὐτῇ выделяет Сарру как ещё один пример; русское «и сама Сарра» естественно передаёт это усиление без излишнего оттенка неожиданности.
- source_word: δύναμιν ... ἔλαβεν
  choice: получила силу
  rationale: Передаёт как значение существительного δύναμις, так и активную форму ἔλαβεν, сохраняя образ дарованной способности.
- source_word: εἰς καταβολὴν σπέρματος
  choice: зачать потомство
  rationale: Необычное греческое выражение в данном контексте означает обретение способности произвести потомство. Основной текст передаёт смысл естественно по-русски, а буквальная форма отмечена в сноске.
- source_word: καὶ παρὰ καιρὸν ἡλικίας
  choice: хотя уже миновало подобающее для этого время её жизни
  rationale: Передаёт выход за пределы надлежащего времени, связанного с возрастом, но не вносит в основной текст более узкое пояснение «детородный возраст», которого буквально нет в греческом.
- source_word: ἐπεὶ
  choice: потому что
  rationale: Ясно вводит основание, по которому Сарра получила силу.
- source_word: πιστὸν
  choice: верным
  rationale: Сохраняет значение надёжности и верности давшего обещание, а также богословскую насыщенность греческого слова.
- source_word: ἡγήσατο
  choice: сочла
  rationale: Кратко и естественно выражает осознанную оценку или убеждение.
- source_word: τὸν ἐπαγγειλάμενον
  choice: того, кто дал обещание
  rationale: Передаёт субстантивированное причастие ясно и без добавления имени Бога, прямо отсутствующего в стихе.
theological_decisions:
- issue: Кто является субъектом и что означает действие в синтаксически трудной части стиха
  choice: 'Сарра — субъект: она получила силу зачать потомство.'
  alternative: Выражение может пониматься с подразумеваемым участием Авраама либо как получение силы для основания рода.
  rationale: 'В данной форме греческого текста αὐτῇ Σάρρᾳ естественнее всего указывает на Сарру как субъект ἔλαβεν. При этом необычная формула καταβολὴ σπέρματος не сглаживается полностью: её буквальный облик и трудность отражены в сноске.'
- issue: Передача πιστός применительно к давшему обещание
  choice: верным
  alternative: надёжным; достойным доверия
  rationale: «Верным» передаёт как надёжность обещавшего, так и более широкий смысл его постоянства, не добавляя учения сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан доступным для обычного читателя; необычность исходной идиомы сохранена в сноске, а неоднозначность не разрешена добавлением конфессиональных толкований.
