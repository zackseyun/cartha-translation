  source_fidelity: 'Текст точно передаёт греческий оригинал: πίστει — «Верой»; κατέλιπεν Αἴγυπτον — «покинул Египет»; μὴ φοβηθεὶς — «не испугавшись»; τὸν θυμὸν τοῦ βασιλέως — «гнева царя». Финальное «потому что оставался стойким, словно видел Невидимого» адекватно выражает ἐκαρτέρησεν и сравнительный оборот ὡς ὁρῶν τὸν ἀόρατον. Неоднозначность исторического эпизода не снимается.'
