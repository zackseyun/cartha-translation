  terminology: «Верой» согласуется с устойчивой формулой Евр. 11. Прописная буква в «Невидимого» уместно отражает личный божественный референт, не добавляя в основной текст имени, которого в греческом нет. «Царь» соответствует βασιλεύς и не подменяет слово интерпретирующим «фараон».
