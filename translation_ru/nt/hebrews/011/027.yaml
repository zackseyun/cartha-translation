id: HEB.11.27
reference: Hebrews 11:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
translation:
  language: ru
  text: Верой он покинул Египет[a], не испугавшись гнева царя, потому что оставался стойким, словно видел Невидимого[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возможно, здесь имеется в виду либо бегство Моисея от фараона (Исх. 2), либо исход Израиля из Египта под предводительством Моисея (Исх. 12–14). Греческий текст не уточняет, о каком эпизоде идёт речь.
    reason: cross_reference
  - marker: b
    text: 'Или: «Того, Кто невидим»; возможно также: «Незримого».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Верой
  rationale: 'Творительный падеж передаёт инструментально-модальное значение дательного: Моисей поступил так благодаря вере и в вере. Это также сохраняет повторяющуюся формулу главы 11.'
- source_word: κατέλιπεν Αἴγυπτον
  choice: покинул Египет
  rationale: Нейтрально и естественно передаёт факт ухода, не усиливая значение до «оставил навсегда» или «бросил» и не уточняя, какой именно эпизод книги Исход имеется в виду.
- source_word: μὴ φοβηθεὶς
  choice: не испугавшись
  rationale: Деепричастная конструкция естественно передаёт отрицательное причастие и его связь с основным действием.
- source_word: τὸν θυμὸν τοῦ βασιλέως
  choice: гнева царя
  rationale: «Гнев» передаёт сильный θυμός в достойном современном регистре; «ярость» могла бы неоправданно усилить выражение.
- source_word: τὸν ἀόρατον
  choice: Невидимого
  rationale: Субстантивированное прилагательное обозначает личного Референта. Краткая форма сохраняет парадокс видения Невидимого; прописная буква естественно указывает на Бога без добавления имени в текст.
- source_word: ὡς ὁρῶν
  choice: словно видел
  rationale: 'Передаёт сравнительную силу ὡς и сохраняет образное напряжение: вера соотнесена с видением Того, Кто невидим.'
- source_word: ἐκαρτέρησεν
  choice: оставался стойким
  rationale: Глагол обозначает твёрдость, выдержку и упорное продолжение. Эта формулировка естественнее буквального «вытерпел» и не требует вводить в текст конкретное не названное испытание.
theological_decisions:
- issue: Какой уход Моисея из Египта подразумевается
  choice: Основной текст не уточняет, идёт ли речь о бегстве Моисея или об исходе Израиля под его предводительством.
  alternative: Прямо отнести слова либо к Исх. 2, либо к Исх. 12–14.
  rationale: Греческое κατέλιπεν Αἴγυπτον само по себе не определяет эпизод. Уточнение в основном тексте устранило бы подлинную интерпретационную неоднозначность.
- issue: Личный и божественный референт τὸν ἀόρατον
  choice: «Невидимого» с прописной буквы
  alternative: «Того, Кто невидим» или «невидимого» со строчной буквы
  rationale: Артикль превращает прилагательное в личное обозначение, а контекст веры Моисея указывает на Бога. При этом имя Бога не добавляется, и образная формулировка оригинала сохраняется.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Синтаксис остаётся компактным, а неоднозначность исторического эпизода и парадокс видения Невидимого сохранены.
