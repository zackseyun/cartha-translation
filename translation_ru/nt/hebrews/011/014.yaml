  text: Ведь те, кто говорит подобное, ясно показывают, что ищут родину[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свою страну» или «родную землю». Следующий стих поясняет, что искомая родина в конечном счёте небесная.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Ведь
  rationale: Сохраняет пояснительную связь с предыдущим стихом и естественно звучит в современном русском языке.
- source_word: τοιαῦτα
  choice: так
  rationale: В сочетании «говорит так» естественно и кратко отсылает к словам, приведённым выше.
- source_word: λέγοντες
  choice: те, кто говорит
  rationale: Причастная конструкция передана придаточным определительным для ясности; настоящее время сохраняет общий, продолжающийся характер речи.
- source_word: ἐμφανίζουσιν
  choice: ясно показывают
  rationale: Передаёт значение «делать очевидным, являть» и вывод, следующий из сказанных ими слов.
- source_word: ὅτι
  choice: что
  rationale: Вводит изъяснительное придаточное, сообщающее содержание того, что становится очевидным.
- source_word: πατρίδα
  choice: родину
  rationale: Естественный русский эквивалент со значением родной страны или земли; отсутствие артикля в греческом не требует в русском неопределённого показателя.
- source_word: ἐπιζητοῦσιν
  choice: ищут
  rationale: Сохраняет основное значение настойчивого или направленного поиска; форма настоящего времени передаёт продолжающееся стремление.
theological_decisions:
- issue: Как понимать искомую πατρίδα в контексте праотцов
  choice: В основном тексте оставлено общее «родину» без уточнения, земная она или небесная.
  alternative: 'Сразу уточнить: «небесную родину».'
  rationale: Сам этот стих говорит лишь о поиске родины; следующий стих раскрывает её как лучшую, то есть небесную. Перевод не предваряет это контекстуальное уточнение.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, без архаизма «отечество» и без преждевременного богословского уточнения.
