id: HEB.11.22
reference: Hebrews 11:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/022.yaml
  text: By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the sons of Israel and gave instructions concerning his bones.
translation:
  language: ru
  text: Верой Иосиф, умирая[a], упомянул об исходе сынов Израиля[b] и дал распоряжение о своих костях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда приближался конец его жизни».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «детей Израиля»; то есть израильского народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Верой
  rationale: 'Сохраняет повторяющуюся формулу 11-й главы и передаёт инструментальный дательный: Иосиф поступил так верой.'
- source_word: τελευτῶν
  choice: умирая
  rationale: Прямо и естественно передаёт причастие со значением «умирая, находясь при конце жизни».
- source_word: περὶ τῆς ἐξόδου
  choice: об исходе
  rationale: В данном контексте речь идёт о будущем выходе Израиля из Египта; «исход» точно передаёт существительное и узнаваемую историческую отсылку.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: сынов Израиля
  rationale: Сохраняет явный семейно-родовой образ греческого текста, не заменяя его обобщённым «израильтян».
- source_word: ἐμνημόνευσεν
  choice: упомянул
  rationale: С конструкцией περὶ глагол означает «упомянуть, сказать о», а не только внутренне вспомнить.
- source_word: ἐνετείλατο
  choice: дал распоряжение
  rationale: Передаёт намеренное повеление Иосифа естественным современным русским выражением.
- source_word: περὶ τῶν ὀστέων αὐτοῦ
  choice: о своих костях
  rationale: Сохраняет конкретное слово «кости» и естественно указывает, что речь идёт о костях самого Иосифа.
theological_decisions:
- issue: Передача πίστις в Евр 11
  choice: вера
  alternative: верность; доверие
  rationale: Повторяющаяся формула главы указывает на веру как основание поступка; вариант не вносит дополнительного конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранены краткость греческого предложения, повтор формулы «Верой» и конкретное слово «кости».
