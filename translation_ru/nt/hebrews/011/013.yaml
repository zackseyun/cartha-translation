language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ ⸀λαβόντες τὰς ἐπαγγελίας, ἀλλὰ πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/013.yaml
  text: All these died in faith[a], not having received the promises, but having seen them from afar and greeted them[c][b], and having confessed that they are strangers and exiles on the earth.
translation:
  language: ru
  text: Все они умерли в вере, не получив обещаний, но увидев их издали и приветствовав их, признав, что они чужеземцы и временные жители на земле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ πίστιν
  choice: в вере
  rationale: Передаёт состояние и стойкую установку веры, в которой умерли названные люди; выражение естественно по-русски и сохраняет значение κατά с винительным.
- source_word: μὴ λαβόντες τὰς ἐπαγγελίας
  choice: не получив обещанного
  rationale: Русское «обещанного» естественно обозначает содержание данных обещаний; множественное число греческого существительного отмечено в сноске, поскольку буквальное «обещания» здесь может ошибочно звучать как получение самих слов, а не их исполнения.
- source_word: πόρρωθεν αὐτὰς ἰδόντες
  choice: увидев его издали
  rationale: 'Сохраняет пространственную метафору: исполнение обещанного видится на расстоянии.'
- source_word: ἀσπασάμενοι
  choice: приветствовали
  rationale: Ближайшее значение глагола — приветствовать, радушно встречать; при неодушевлённом объекте сохраняется намеренная образность греческого текста без её истолкования как фактического получения.
- source_word: ὁμολογήσαντες
  choice: признали
  rationale: Передаёт открытое признание своего положения; в данном русском контексте естественнее конфессионально окрашенного «исповедали».
- source_word: ξένοι
  choice: чужеземцы
  rationale: Обозначает людей, не принадлежащих к месту своего проживания; сохраняет социально-пространственный смысл слова.
- source_word: παρεπίδημοί
  choice: временные жители
  rationale: Передаёт проживание без окончательной оседлости и полного статуса принадлежности, не добавляя обязательной идеи насильственного изгнания.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: В контексте страннического человеческого существования γῆ имеет широкое значение земли, а не конкретной территории.
theological_decisions:
- issue: Значение πίστις в выражении Κατὰ πίστιν
  choice: в вере
  alternative: по вере; веря
  rationale: Основной текст сохраняет богословски ёмкое понятие веры и подчёркивает состояние, в котором они умерли, не сводя его только к средству действия.
- issue: Объект λαβόντες и местоимений αὐτάς
  choice: обещанное / его
  alternative: обещания / их
  rationale: Греческий текст буквально говорит об «обещаниях» во множественном числе, но по смыслу речь идёт о получении обещанного. Основной вариант звучит естественно и не утверждает, будто они не получили самих слов обещания; формальная особенность сохранена в сноске.
- issue: Образность ἀσπασάμενοι
  choice: приветствовали
  alternative: радушно встретили; приняли; обняли
  rationale: «Приветствовали» сохраняет персонифицирующий образ и не разрешает напряжение между непринятым исполнением и положительным откликом веры.
- issue: Соотношение ξένοι и παρεπίδημοί
  choice: чужеземцы и временные жители
  alternative: странники и пришельцы; чужеземцы и изгнанники
  rationale: Выбранная пара различает непринадлежность и временность проживания, не внося отсутствующую в παρεπίδημος обязательную идею изгнания.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизмов. Цепочка греческих причастий передана деепричастными конструкциями и личным сказуемым; намеренная образность приветствия обещанного сохранена.
