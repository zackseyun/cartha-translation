  text: ἐξεδέχετο γὰρ τὴν τοὺς θεμελίους ἔχουσαν πόλιν, ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/010.yaml
  text: For he was waiting for the city that has foundations[b][a], whose architect and builder is God.
translation:
  language: ru
  text: Ведь он ожидал города, у которого есть основания[a], архитектор и строитель которого — Бог.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «города, имеющего основания». Множественное число может подчёркивать его прочность и постоянство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «проектировщик и создатель которого — Бог».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδέχετο
  choice: ожидал
  rationale: Имперфект передаёт продолжительное ожидание в прошлом; «ожидал» естественно звучит по-русски и не добавляет отсутствующего в тексте объекта надежды.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предыдущим стихом естественнее для современного русского повествования, чем начальное «ибо».
- source_word: τὴν τοὺς θεμελίους ἔχουσαν πόλιν
  choice: города, имеющего основания
  rationale: Сохраняет определённость города, причастную конструкцию и значимое множественное число «основания», противопоставленное временным шатрам контекста.
- source_word: θεμελίους
  choice: основания
  rationale: Буквально и без истолковывающего добавления передаёт множественное число греческого слова; оно может подразумевать прочность и постоянство.
- source_word: πόλιν
  choice: города
  rationale: Обычное и контекстуально точное соответствие πόλις.
- source_word: ἧς
  choice: которого
  rationale: Родительное относительное местоимение отнесено к слову «город» и естественно выражает связь города с его зодчим и строителем.
- source_word: τεχνίτης
  choice: зодчий
  rationale: В сочетании с δημιουργός обозначает искусного проектировщика; «зодчий» сохраняет архитектурный образ и достойный библейский регистр.
- source_word: δημιουργός
  choice: строитель
  rationale: В контексте города передаёт осуществление постройки и ясно отличается от роли зодчего; более широкое значение «создатель» отмечено в сноске.
- source_word: ὁ θεός
  choice: Бог
  rationale: Стандартная передача подлежащего с сохранением его смыслового акцента в конце фразы.
theological_decisions:
- issue: Природа ожидаемого города
  choice: «города, имеющего основания» без уточнения «небесного» или «Нового Иерусалима»
  alternative: «небесного города»; «города с вечными основаниями»
  rationale: Сам стих не называет город небесным и не отождествляет его прямо с Новым Иерусалимом; перевод сохраняет образ и не вносит богословское уточнение из более широкого контекста.
- issue: Соотношение τεχνίτης и δημιουργός
  choice: «зодчий и строитель»
  alternative: «проектировщик и создатель»
  rationale: Выбранная пара сохраняет различие между замыслом и осуществлением, не утверждая более жёсткого метафизического различия, чем допускают греческие слова.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Ведь» избегает архаичности «ибо», а «зодчий» сохраняет достоинство и архитектурную образность. Все смысловые добавления, прямо отсутствующие в греческом тексте, исключены.
