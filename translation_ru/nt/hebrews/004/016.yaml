  source_fidelity: 'Основной текст в целом точно передаёт греческий оригинал: побудительное προσερχώμεθα, выводное οὖν, образ «престола благодати», различие «получить милость» / «обрести благодать» и целевое εἰς εὔκαιρον βοήθειαν сохранены. Однако «с дерзновением» в современном русском может сильнее, чем παρρησία здесь, ассоциироваться с вызывающей смелостью; «с уверенностью» естественнее передаёт свободный, непринуждённый доступ, оставляя оттенок смелости в сноске.'
