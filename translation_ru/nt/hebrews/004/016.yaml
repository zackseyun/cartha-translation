base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/016.yaml
  text: Therefore[a], let us approach the throne of grace with boldness[b], so that we may receive mercy and find grace for timely help.
translation:
  language: ru
  text: Поэтому[a] будем с уверенностью[b] приближаться к престолу благодати, чтобы получить милость и обрести благодать для своевременной помощи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «итак». Греческое слово вводит вывод из предшествующего рассуждения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «смело». Греческое слово может обозначать уверенность, смелость и свободу в речи или приближении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: будем приближаться
  rationale: Настоящее сослагательное имеет побудительное значение. «Будем приближаться» естественно передаёт совместный призыв и допускает оттенок продолжающегося действия.
- source_word: οὖν
  choice: итак
  rationale: Выражает вывод из предшествующего рассуждения об Иисусе как великом Первосвященнике.
- source_word: μετὰ παρρησίας
  choice: с дерзновением
  rationale: παρρησία обозначает свободу, открытость и смелую уверенность при обращении или приближении. «С дерзновением» сохраняет сильный оттенок свободного доступа, не подразумевая самонадеянности.
- source_word: τῷ θρόνῳ τῆς χάριτος
  choice: к престолу благодати
  rationale: Сохраняется образ престола и формально неоднозначная родительная конструкция, без сведения её к одному толкованию вроде «благодатный престол».
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно и точно передаёт значение цели.
- source_word: λάβωμεν ἔλεος
  choice: получить милость
  rationale: Передаёт обычное значение λαμβάνω и сохраняет самостоятельное выражение «получить милость».
- source_word: χάριν εὕρωμεν
  choice: обрести благодать
  rationale: 'Сохраняет отличие от предыдущего глагола: милость получают, а благодать обретают. «Благодать» передаёт богословски значимую лексику χάρις, не выходя за смысл контекста.'
- source_word: εἰς εὔκαιρον βοήθειαν
  choice: для своевременной помощи
  rationale: εὔκαιρος характеризует помощь как приходящую в подходящее время. Формулировка близка к греческому тексту и не подменяет этот акцент исключительно идеей времени нужды.
theological_decisions:
- issue: Оттенок παρρησία при приближении к Богу
  choice: с дерзновением
  alternative: с уверенностью
  rationale: Выбор сохраняет сильный смысл свободного и открытого доступа к Богу благодаря первосвященническому служению Иисуса. Сноска показывает, что речь не обязательно о вызывающей смелости или самонадеянности.
- issue: Передача χάρις во второй части стиха
  choice: благодать
  alternative: благоволение
  rationale: «Благодать» точно передаёт даруемое Богом благо и сохраняет связь с «престолом благодати», не навязывая более узкого конфессионального толкования.
- issue: Характер своевременности помощи
  choice: для своевременной помощи
  alternative: для помощи во время нужды
  rationale: Основной текст сохраняет характеристику помощи как уместной и приходящей вовремя; традиционное прочтение о времени нужды отмечено как допустимый смысловой вариант.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Престол благодати», «милость» и «благодать» сохраняют ключевые образы и лексику оригинала; синтаксис остаётся ясным для обычного читателя.
