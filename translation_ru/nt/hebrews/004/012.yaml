id: HEB.4.12
reference: Hebrews 4:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον καὶ διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς ⸀καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν, καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν καρδίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: ru
  text: 'Ведь слово Божье живо и действенно, острее всякого обоюдоострого меча: оно проникает вплоть до разделения души и духа, суставов и костного мозга[a] и судит помышления и намерения сердца.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «душа и дух» здесь не обязательно описывают отдельные составные части человека. Весь образ подчёркивает, что слово Божье достигает самых сокровенных глубин и распознаёт внутреннее.
    reason: alternative_reading
lexical_decisions:
- source_word: Ζῶν
  choice: живо
  rationale: Предикативное определение к «слово»; передаёт присущую Божьему слову жизнь и естественно сочетается с «действенно».
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительно-обосновывающую связь с предшествующим призывом и звучит естественно по-русски.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: слово Божье
  rationale: Сохраняет широту греческого выражения, не сводя его исключительно к Писанию, проповеди или личному Логосу.
- source_word: ἐνεργὴς
  choice: действенно
  rationale: Передаёт не только активность, но и совершаемое действие; при этом не добавляет прямо не выраженной идеи всемогущества.
- source_word: τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον
  choice: острее всякого обоюдоострого меча
  rationale: Прямо и естественно сохраняет сравнительную конструкцию и образ клинка с двумя лезвиями.
- source_word: διϊκνούμενος
  choice: проникает
  rationale: Передаёт достижение глубин и поддерживает образ меча, не ограничивая значение физическим прокалыванием.
- source_word: ἄχρι μερισμοῦ
  choice: вплоть до разделения
  rationale: «Вплоть до» точно выражает предел или глубину проникновения, а «разделения» сохраняет существительное μερισμός.
- source_word: ψυχῆς καὶ πνεύματος
  choice: души и духа
  rationale: Лексически прозрачная передача, не утверждающая определённой схемы состава человека.
- source_word: ἁρμῶν τε καὶ μυελῶν
  choice: суставов и костного мозга
  rationale: Сохраняет телесную пару образов; «костный мозг» в современном русском точнее и понятнее, чем неоднозначное «мозг».
- source_word: κριτικὸς
  choice: судит
  rationale: Передаёт способность оценивать и выносить суждение; в русском предикативный глагол естественнее конструкции «способно судить».
- source_word: ἐνθυμήσεων
  choice: помышления
  rationale: Передаёт внутренние размышления и рассуждения, сохраняя возвышенный, но понятный библейский регистр.
- source_word: ἐννοιῶν
  choice: намерения
  rationale: Отличает внутренние цели и замыслы от мыслительной деятельности, обозначенной предыдущим существительным.
theological_decisions:
- issue: Референт выражения «слово Божье»
  choice: Оставлено общее выражение «слово Божье».
  alternative: Писание; возвещённое Божье обещание или предостережение; Сын как личное Слово.
  rationale: Контекст подчёркивает действенность Божьей речи, но греческий текст не требует здесь однозначного сужения референта.
- issue: Антропологический смысл слов «душа и дух»
  choice: Пара сохранена без поясняющего догматического истолкования.
  alternative: Техническое обозначение отдельных составных частей человека; риторическое обозначение глубочайшей внутренней жизни.
  rationale: Метафора говорит прежде всего о предельной глубине проникновения Божьего слова и сама по себе не устанавливает конкретную антропологическую систему.
- issue: Связь «разделения» с парными существительными
  choice: Сохранена грамматическая возможность понимать речь как проникновение до разделения души и духа, суставов и костного мозга.
  alternative: Понимать пары исключительно как совокупное обозначение глубочайших областей человеческого существа, без мысли об отделении одного элемента от другого.
  rationale: Формулировка воспроизводит напряжение исходного образа и не объясняет сверх текста, как именно соотносятся перечисленные пары.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Ведь» ясно связывает стих с контекстом; «обоюдоострый», «помышления» сохраняют возвышенный оттенок, оставаясь понятными. Пунктуация делает последующие образы пояснением действенности и остроты слова.
