    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: Итак, имея
  rationale: Сохраняет причастную конструкцию и выводное значение οὖν, связывая увещание с предшествующим рассуждением.
- source_word: ἀρχιερέα μέγαν
  choice: великого Первосвященника
  rationale: Естественно передаёт качественное ударение на величии Иисуса как первосвященника; прописная буква уместна для титула в данном христологическом контексте.
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: прошедшего через небеса
  rationale: Передаёт совершённое действие с сохраняющимся результатом, сохраняет значение прохождения через и множественное число слова «небеса».
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: Иисуса, Сына Божьего
  rationale: Сохраняет уточняющее именование и формальный христологический титул без парафраза.
- source_word: κρατῶμεν
  choice: будем твёрдо держаться
  rationale: Передаёт увещательный сослагательный смысл и призыв к продолжающейся стойкости на естественном современном русском языке.
- source_word: τῆς ὁμολογίας
  choice: нашего исповедания
  rationale: «Исповедание» передаёт публично признаваемую веру; «нашего» ясно выражает подразумеваемую принадлежность исповедания общине, хотя в греческом стоит артикль, а не притяжательное местоимение.
theological_decisions:
- issue: Передача титула υἱὸς τοῦ θεοῦ
  choice: Сына Божьего
  alternative: Сына Бога
  rationale: Традиционная и современно понятная форма сохраняет титульный характер выражения и его христологический вес.
- issue: Передача множественного числа τοὺς οὐρανούς
  choice: через небеса
  alternative: на небо
  rationale: Сохраняется множественное число и образ прохождения через небеса без сведения выражения к одному месту назначения.
- issue: Смысл ὁμολογία
  choice: исповедание
  alternative: то, что мы исповедуем
  rationale: Существительное сохраняет богословскую и общинную насыщенность исходного слова, не уточняя содержание исповедания сверх текста.
