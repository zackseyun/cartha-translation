source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ, πρὸς ὃν ἡμῖν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: ru
  text: И ничто сотворённое не скрыто от Его взора, но всё обнажено и открыто перед Его глазами[b] — Ему мы должны дать отчёт.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «к Кому у нас слово»; выражение можно также понять как «с Кем мы имеем дело» или «к Кому обращено наше дело/слово».'
    reason: alternative_reading
  - marker: b
    text: Слово, переведённое как «открыто», образовано от редкого глагола, который может вызывать образ обнажённой или отогнутой назад шеи, подчёркивая полную открытость перед Богом.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτίσις
  choice: ничто сотворённое
  rationale: Единственное число употреблено обобщённо. Такая передача ясно выражает сотворённость и охватывает всякое существо или предмет, не используя слово «тварь», которое в современном русском часто звучит уничижительно.
- source_word: ἀφανὴς
  choice: скрыто
  rationale: В контексте речь идёт не о метафизической невидимости, а о невозможности укрыться от Божьего видения.
- source_word: ἐνώπιον αὐτοῦ
  choice: от Его взора
  rationale: Буквальное «перед Ним» здесь естественно передано через образ видения, который продолжается в словах «перед Его глазами».
- source_word: πάντα
  choice: всё
  rationale: Средний род множественного числа имеет всеохватное значение; русское «всё» передаёт его кратко и естественно.
- source_word: γυμνὰ
  choice: обнажено
  rationale: Сохраняет яркую метафору полной незащищённости и открытости.
- source_word: τετραχηλισμένα
  choice: открыто
  rationale: Редкое причастие обозначает состояние полной выставленности на обозрение и, возможно, содержит образ обнажённой или отогнутой назад шеи. Основной текст передаёт несомненный смысл, а спорный образ отмечен в сноске.
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: перед Его глазами
  rationale: Естественная русская конструкция, непосредственно сохраняющая греческий образ глаз и божественного видения.
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: Ему мы должны дать отчёт
  rationale: Сжатое греческое выражение допускает несколько оттенков. В контексте Божьего всеведения и суда эта передача ясно выражает ответственность человека, не скрывая буквальные варианты, приведённые в сноске.
theological_decisions:
- issue: Толкование πρὸς ὃν ἡμῖν ὁ λόγος
  choice: Ему мы должны дать отчёт
  alternative: '«с Кем мы имеем дело»; буквальнее: «к Кому у нас слово» или «к Кому обращено наше дело/слово»'
  rationale: Ближайший контекст подчёркивает проницательное Божье знание и предстоящую ответственность. Основной вариант сохраняет предостерегающую силу фразы, а сноска оставляет видимой её подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным звучанием. Формулировка «ничто сотворённое» избегает уничижительных ассоциаций современного слова «тварь». Заглавные буквы в местоимениях, относящихся к Богу, поддерживают привычный для русского библейского текста благоговейный регистр.
