  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰσερχόμεθα γὰρ ⸀εἰς κατάπαυσιν οἱ πιστεύσαντες, καθὼς εἴρηκεν· Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: ru
  text: 'Ведь мы, уверовавшие, входим в покой, как Он и сказал: «Как поклялся Я в гневе Моём: „Не войдут они в Мой покой!“»[a] — хотя дела Его были завершены ещё при основании мира.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «Если они войдут в Мой покой». Это клятвенная формула, означающая: «Они ни в коем случае не войдут в Мой покой» или «Они никогда не войдут в Мой покой».'
    reason: Сохранение буквальной формы и разъяснение семитской клятвенной идиомы.
  - marker: b
    text: 'Или: «хотя дела Его были завершены от основания мира».'
    reason: Лексико-синтаксический вариант передачи ἀπὸ καταβολῆς κόσμου и генитивной абсолютной конструкции.
lexical_decisions:
- source_word: εἰσερχόμεθα
  choice: входим
  rationale: Настоящее время передаёт нынешнюю, обобщённо действительную реальность вхождения верующих в Божий покой, не сводя мысль исключительно к будущему.
- source_word: οἱ πιστεύσαντες
  choice: мы, уверовавшие
  rationale: Субстантивированное причастие аориста соотнесено с глаголом первого лица множественного числа; перевод сохраняет совершившийся аспект веры и самоотнесение автора.
- source_word: κατάπαυσιν
  choice: в покой
  rationale: В контексте речь идёт об определённом Божьем покое; русская конструкция естественно выражает это без обязательного указательного определения.
- source_word: καθὼς εἴρηκεν
  choice: как Он и сказал
  rationale: Частица «и» передаёт усиление καθὼς, а совершенная форма εἴρηκεν указывает на сохраняющую силу сказанного; в русском цитатная формула естественно звучит в прошедшем времени.
- source_word: Ὡς ὤμοσα ἐν τῇ ὀργῇ μου
  choice: Как поклялся Я в гневе Моём
  rationale: Сохраняется торжественная формула клятвы и сильное, судебное звучание ὀργή.
- source_word: Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου
  choice: Не войдут они в Мой покой!
  rationale: Условная форма εἰ с будущим временем воспроизводит семитскую формулу клятвы и по смыслу выражает категорическое отрицание; буквальная форма поясняется в сноске.
- source_word: καίτοι
  choice: хотя
  rationale: Передаёт уступительное отношение к последующей генитивной абсолютной конструкции.
- source_word: τῶν ἔργων ... γενηθέντων
  choice: дела Его были завершены
  rationale: Генитивная абсолютная конструкция указывает на уже состоявшееся завершение Божьих дел; местоимение восстановлено из контекста.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: ещё при основании мира
  rationale: Передаёт исходный временной момент — основание или сотворение мира — естественным современным русским выражением.
theological_decisions:
- issue: Смысл клятвенной формулы из Псалма 94:11
  choice: 'Передать её смысл категорическим отрицанием: «Не войдут они в Мой покой!»'
  alternative: 'Сохранить поверхностную условную форму: «Если они войдут в Мой покой»'
  rationale: Греческий текст следует семитской неполной формуле клятвы, которая в контексте означает решительное недопущение. Основной текст сообщает понятный смысл, а сноска сохраняет буквальную форму и её неоднозначность.
- issue: Временная перспектива вхождения верующих в покой
  choice: 'Настоящее время: «входим»'
  alternative: Будущее «войдём» или процессуальное «вступаем»
  rationale: Настоящее εἰσερχόμεθα утверждает действительность вхождения для уверовавших и сохраняет напряжение между уже доступным покоем и его дальнейшим исполнением.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные местоимения в отношении Бога употреблены в цитате и повествовании согласно принятой русской библейской традиции; синтаксис остаётся доступным, а тире проясняет связь уступительного оборота с предшествующей цитатой.
