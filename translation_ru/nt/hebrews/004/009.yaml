  text: So then[a], a Sabbath rest remains for the people of God.
translation:
  language: ru
  text: Итак, для народа Божьего остаётся субботний покой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соблюдение субботы». Греческое слово σαββατισμός встречается редко и явно отсылает к субботе; здесь оно может обозначать подобный субботе покой, остающийся для народа Божьего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Итак
  rationale: Выводная частица связывает стих с предшествующим рассуждением; «итак» естественно и ясно передаёт заключение.
- source_word: ἀπολείπεται
  choice: ещё остаётся
  rationale: Форма настоящего времени указывает, что этот покой по-прежнему сохраняется и доступен; «ещё» естественно подчёркивает продолжающееся состояние.
- source_word: σαββατισμός
  choice: субботний покой
  rationale: Редкое существительное явно отсылает к субботе и в контексте Евр 3–4 обозначает подобный субботе покой. Перевод сохраняет как субботнее звучание, так и контекстуальную тему покоя.
- source_word: τῷ λαῷ
  choice: для народа
  rationale: 'Дательный падеж здесь естественно выражает предназначение или пользу: покой остаётся для Божьего народа.'
- source_word: τοῦ θεοῦ
  choice: Божьего
  rationale: Притяжательное прилагательное естественно передаёт родительный принадлежности и сохраняет смысл народа, принадлежащего Богу.
theological_decisions:
- issue: Значение σαββατισμός в Евр 4:9
  choice: Сохраняющийся для Божьего народа субботоподобный покой, переданный как «субботний покой».
  alternative: Буквальное соблюдение субботы; либо исключительно метафорический духовный покой без связи с субботой.
  rationale: Сам термин явно вызывает ассоциацию с субботой, а ближайший контекст связывает Божий покой, седьмой день и обещанный народу покой. Формулировка не сводит смысл ни к одному лишь еженедельному обряду, ни к отвлечённому покою без субботнего оттенка.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. «Субботний покой» сохраняет редкую лексическую связь с субботой, а порядок слов естественно выделяет адресата обещания.
