    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκεν
  choice: сказано
  rationale: Греческий перфект указывает на произнесённое в прошлом слово, сохраняющее силу в настоящем. Русская безличная формула «сказано» естественна при введении цитаты из Писания и передаёт эту продолжающуюся значимость.
- source_word: γάρ
  choice: ведь
  rationale: Союз вводит обоснование предшествующей мысли; «ведь» естественно выражает пояснительно-доказательную связь в современном русском языке.
- source_word: που
  choice: где-то
  rationale: Сохраняет намеренно неконкретное указание на место Писания и не означает сомнения в авторитетности цитаты.
- source_word: περὶ τῆς ἑβδόμης
  choice: о седьмом дне
  rationale: Существительное «день» подразумевается греческой формой прилагательного и восполняется по контексту для ясности.
- source_word: οὕτως
  choice: так
  rationale: Естественная русская формула, непосредственно вводящая текст цитаты.
- source_word: Καὶ
  choice: И
  rationale: Союз сохранён как часть цитаты из Бытия.
- source_word: κατέπαυσεν
  choice: почил
  rationale: Передаёт прекращение Богом Своих дел и сохраняет устойчивую библейскую связь с темой Божьего покоя в Евр 3–4, не подразумевая усталости.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Прямое соответствие подлежащему греческого текста.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ
  choice: в седьмой день
  rationale: Нормальное русское обозначение времени, точно передающее греческую конструкцию.
- source_word: ἀπὸ πάντων τῶν ἔργων αὐτοῦ
  choice: от всех дел Своих
  rationale: Сохраняет множественное число ἔργων и значение отделения или прекращения, выраженное ἀπό. Возвратное «Своих» ясно соотносит дела с подлежащим «Бог».
theological_decisions:
- issue: Передача прекращения Божьих дел в связи с богословской темой покоя в Послании к евреям
  choice: почил
  alternative: перестал трудиться; прекратил все Свои дела
  rationale: «Почил» сохраняет лексическую и каноническую связь цитаты из Быт 2:2 с развиваемой в Евр 3–4 темой Божьего покоя. В контексте речь идёт не об усталости Бога, а о завершении Его дел; это уточняется в сноске без снятия смыслового напряжения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Почил» несколько традиционно, но широко понятно и важно для сквозной темы покоя; остальной синтаксис прост и естественен.
