id: HEB.4.15
reference: Hebrews 4:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ἀρχιερέα μὴ δυνάμενον συμπαθῆσαι ταῖς ἀσθενείαις ἡμῶν, ⸀πεπειρασμένον δὲ κατὰ πάντα καθ’ ὁμοιότητα χωρὶς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/015.yaml
  text: For we do not have a high priest unable to sympathize with our weaknesses, but one who has been tested in every way according to likeness, yet without sin.
translation:
  language: ru
  text: Ведь у нас не такой Первосвященник, который не способен сострадать нашим слабостям, но такой, который во всём был испытан, подобно нам,[b] однако без греха.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был искушён».'
    reason: Лексема πειράζω допускает значения как испытания, так и искушения.
  - marker: b
    text: 'Буквально: «согласно подобию»; греческий текст выражает подобие, но прямо не называет вторую сторону сравнения.'
    reason: Сохраняет отмеченную в оригинале синтаксическую сжатость, тогда как основной текст естественно выражает подразумеваемое в контексте сравнение.
lexical_decisions:
- source_word: ἀρχιερέα
  choice: Первосвященник
  rationale: Точный и общепринятый термин для первосвященнического служения; в Послании к евреям это ключевой титул Иисуса.
- source_word: μὴ δυνάμενον συμπαθῆσαι
  choice: не способен сострадать
  rationale: Сохраняет литоту греческого οὐ ... μὴ δυνάμενον и передаёт συμπαθέω как участие в человеческой немощи, а не просто жалость.
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: нашим слабостям
  rationale: Обозначает человеческую немощь и уязвимость шире, чем физические болезни; формулировка естественна для современного русского языка.
- source_word: πεπειρασμένον
  choice: был испытан
  rationale: Передаёт допустимое значение πειράζω — подвергать испытанию — не устраняя другого возможного значения «искушать», которое отмечено в сноске.
- source_word: κατὰ πάντα
  choice: во всём
  rationale: Кратко и естественно выражает всеохватность испытания.
- source_word: καθ’ ὁμοιότητα
  choice: подобно нам
  rationale: Естественно передаёт буквально выраженную идею подобия и проясняет подразумеваемый в контексте объект сравнения; буквальная форма приведена в сноске.
- source_word: χωρὶς ἁμαρτίας
  choice: однако остался без греха
  rationale: 'Ясно выражает решающее исключение: испытание было реальным, но не привело ко греху. Глагол «остался» является контекстуальным уточнением результата.'
theological_decisions:
- issue: Значение πεπειρασμένον применительно к безгрешности Христа
  choice: был испытан
  alternative: был искушён
  rationale: Основной вариант подчёркивает реальность испытаний, не внушая идеи внутренней греховной склонности; при этом лексически возможное и традиционное «искушён» сохранено в сноске.
- issue: Степень эксплицитности καθ’ ὁμοιότητα
  choice: подобно нам
  alternative: согласно подобию
  rationale: Контекстуально подразумеваемое сравнение с людьми сделано явным ради естественного русского синтаксиса, но буквальная и несколько неоднозначная формулировка сохранена в сноске.
- issue: Связь χωρὶς ἁμαρτίας с предшествующим испытанием
  choice: однако остался без греха
  alternative: но без греха / кроме греха
  rationale: Формулировка передаёт контраст и безгрешность Христа, не истолковывая грех как ещё одну разновидность испытания.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранена греческая литота «не такой… который не способен», а тяжеловесное буквальное «согласно подобию» вынесено в сноску. Заглавная буква в слове «Первосвященник» указывает на употребление титула применительно к Иисусу.
