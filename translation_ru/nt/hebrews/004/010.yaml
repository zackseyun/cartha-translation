source:
  edition: SBLGNT
  text: ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/010.yaml
  text: For the one who has entered his rest has himself also rested from his works[b][a], just as God did from his own.
translation:
  language: ru
  text: Ведь тот, кто вошёл в его покой[a], и сам отдохнул от своих дел[b], как и Бог — от своих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в свой покой». В контексте Евр 3–4 местоимение «его», вероятнее всего, указывает на Бога.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «перестал делать свои дела». Греческий глагол связан с существительным «покой» в этом отрывке; основной текст сохраняет тему покоя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... εἰσελθὼν
  choice: тот, кто вошёл
  rationale: Субстантивированное причастие аориста обозначает человека, уже вошедшего в покой; русский оборот сохраняет обобщённое единственное число и завершённость действия.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит обоснование предыдущего утверждения; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: κατάπαυσιν
  choice: покой
  rationale: Ключевое слово Евр 3–4 связано с Божьим покоем и отсылкой к Быт 2; «покой» сохраняет эту тематическую связь.
- source_word: αὐτοῦ (после κατάπαυσιν)
  choice: Его
  rationale: Местоимение формально допускает неоднозначность, но в контексте вероятнее всего относится к Богу. Местоименная передача не подставляет имя непосредственно в основной текст.
- source_word: καὶ αὐτὸς
  choice: и сам
  rationale: «И» передаёт добавочное καί, а «сам» — эмфатическое αὐτός.
- source_word: κατέπαυσεν
  choice: обрёл покой
  rationale: Выражение сохраняет однокоренную связь с κατάπαυσις и естественно сочетается по-русски с «от своих дел»; возможное значение прекращения отмечено в сноске.
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: от своих дел
  rationale: «Дела» прямо и достаточно широко передаёт ἔργα, не сужая смысл до заслуг или физического труда; возвратное «своих» ясно соотносится с субъектом.
- source_word: ὥσπερ
  choice: как и
  rationale: Оборот естественно выражает прямое сопоставление покоя вошедшего с покоем Бога.
- source_word: ἀπὸ τῶν ἰδίων
  choice: от Своих
  rationale: 'Сохраняется греческий эллипсис: подразумеваются собственные дела Бога, уже названные в первой части предложения.'
- source_word: ὁ θεός
  choice: Бог
  rationale: Стандартная передача θεός; субъект назван явно, как и в греческом тексте.
theological_decisions:
- issue: К кому относится αὐτοῦ в выражении «в Его покой»
  choice: 'Наиболее вероятно, местоимение относится к Богу: человек входит в Божий покой.'
  alternative: 'Местоимение может относиться к вошедшему человеку: «в свой покой».'
  rationale: На протяжении Евр 3–4 речь идёт прежде всего о Божьем покое, основанном на Божьем покое после творения. Однако основной текст сохраняет местоимение, а сноска прямо отмечает грамматическую альтернативу.
- issue: Характер «дел», от которых человек обрёл покой
  choice: Оставлено широкое «свои дела» без догматического уточнения.
  alternative: Понимать как дела закона, попытки заслужить спасение или земные труды.
  rationale: Сам стих не конкретизирует природу дел; перевод не должен вносить более узкое конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Сохранены торжественная сдержанность, ключевая лексика покоя и сопоставление с Божьим покоем; заглавные буквы в местоимениях о Боге соответствуют принятому русскому библейскому регистру.
