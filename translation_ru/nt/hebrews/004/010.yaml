  to: Ведь тот, кто вошёл в его покой[a], и сам отдохнул от своих дел[b], как и Бог — от своих.
  rationale: Заменено «обрёл покой» на «отдохнул», чтобы точнее передать κατέπαυσεν ἀπό («отдохнул/прекратил [дела]») и не представить покой только как обретённое состояние. Местоимения в основном тексте приведены к строчному написанию, чтобы не разрешать формальную неоднозначность αὐτοῦ сверх того, что допускает оригинал. Сноска b исправлена стилистически и содержательно.
