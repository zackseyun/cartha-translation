  source_fidelity: 'Основной смысл передан верно: речь о вошедшем в покой, который, подобно Богу, прекратил/оставил свои дела. Однако «обрёл покой от своих дел» может означать лишь получение отдыха после дел и не вполне передаёт κατέπαυσεν ἀπό — прекращение деятельности, сопоставленное с Божьим покоем. Заглавное «Его» в основном тексте также преждевременно снимает формальную неоднозначность αὐτοῦ.'
  naturalness: «Ведь тот, кто вошёл в его покой, и сам отдохнул от своих дел, как и Бог — от своих» — современный литературный и плавный русский текст. «Отдохнул от своих дел» естественно выражает как отдых, так и прекращение труда; эллипсис после «Бог» понятен.
  terminology: «Покой» удачно сохраняет ключевой термин κατάπαυσις в Евр 3–4. «Отдохнул» передаёт κατέπαυσεν без неестественного для современного регистра «почил», а сноска отмечает более буквальный аспект прекращения. Строчные местоимения сохраняют неоднозначность греческого αὐτοῦ, не отрицая контекстуальной вероятности отнесения к Богу.
