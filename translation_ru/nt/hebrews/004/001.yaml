  text: Φοβηθῶμεν οὖν μήποτε καταλειπομένης ἐπαγγελίας εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ δοκῇ τις ἐξ ὑμῶν ὑστερηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/001.yaml
  text: Therefore[a], let us fear lest, while the promise of entering his rest still remains[c][b], any one of you should seem to have fallen short.
translation:
  language: ru
  text: Итак, будем бояться[a], как бы, пока ещё остаётся обещание войти в Его покой[b], не оказалось, что кто-нибудь из вас не достиг его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будем страшиться». Греческий глагол сильнее, чем простой призыв быть осторожными.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «поскольку остаётся обещание войти в Его покой» или, более буквально, «при остающемся обещании войти в Его покой». Греческий оборот допускает обстоятельственный оттенок времени или основания.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «как бы не вышло, что кто-нибудь из вас не достиг его»; возможно также: «не оказался не достигшим его». Греческое выражение сохраняет оттенок видимости, оценки или обнаружившегося положения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φοβηθῶμεν
  choice: будем бояться
  rationale: Увещательное сослагательное наклонение передаёт прямой совместный призыв. «Будем бояться» сохраняет силу предупреждения и не смягчает её до простой осторожности.
- source_word: οὖν
  choice: итак
  rationale: Связывает призыв с предшествующим рассуждением о тех, кто не вошёл в покой, и естественно выражает вывод в современном русском языке.
- source_word: μήποτε
  choice: чтобы … не
  rationale: Обычная русская конструкция для серьёзного предостережения после глагола страха; передаёт отрицательную направленность μήποτε.
- source_word: καταλειπομένης ἐπαγγελίας
  choice: пока ещё остаётся обещание
  rationale: Передаёт обстоятельственное значение родительного самостоятельного оборота и подчёркивает, что обещание продолжает оставаться в силе.
- source_word: ἐπαγγελίας εἰσελθεῖν
  choice: обещание войти
  rationale: Естественно передаёт связь существительного с инфинитивом, не уточняя сверх текста, обещан ли сам вход или сохраняется обещание о возможности войти.
- source_word: τὴν κατάπαυσιν αὐτοῦ
  choice: в Его покой
  rationale: «Покой» сохраняет ключевой термин рассуждения в Евр 3–4, а местоимение «Его» следует греческому тексту без поясняющей замены на «Божий».
- source_word: δοκῇ
  choice: не оказалось, что
  rationale: В данном контексте эта естественная русская формулировка сохраняет оттенок выявления или оценки, не решая однозначно, идёт ли речь о видимости или окончательном суждении.
- source_word: τις ἐξ ὑμῶν
  choice: кто-нибудь из вас
  rationale: Передаёт неопределённое местоимение в единственном числе и сохраняет обращённость предупреждения к каждому отдельному слушателю.
- source_word: ὑστερηκέναι
  choice: не достиг
  rationale: В контексте входа в обещанный покой глагол означает не достичь цели; результативный оттенок перфектного инфинитива естественно выражен формой совершенного вида.
theological_decisions:
- issue: Следует ли смягчать призыв к страху до осторожности
  choice: Сохранить прямое «будем бояться»
  alternative: «Будем осторожны» или «будем внимательны»
  rationale: Φοβηθῶμεν прямо обозначает страх. Перевод сохраняет серьёзность предупреждения, не вводя богословского решения относительно стойкости верующих или возможности отпадения.
- issue: Следует ли прямо истолковывать «Его покой» как Божий эсхатологический или субботний покой
  choice: Оставить «Его покой»
  alternative: «Божий покой» или «Его субботний покой»
  rationale: Греческий текст употребляет местоимение, а содержание понятия развивается далее в главе. Более развёрнутая формулировка преждевременно сузила бы смысл.
- issue: Означает ли δοκῇ лишь кажущуюся неудачу или оценку реального положения
  choice: 'Передать нейтрально: «не оказалось, что»'
  alternative: «не показалось, будто» или «не был признан»
  rationale: Так сохраняется смысловая напряжённость глагола δοκέω между видимостью, оценкой и обнаружившимся положением без навязывания одного богословского прочтения.
translation_notes:
  register: Современный литературный русский язык с серьёзным, увещательным тоном. Синтаксис сделан ясным для обычного читателя, но сохранены ключевые повторы и неоднозначность греческого текста. Местоимение «Его» написано с прописной буквы по принятой русской библейской традиции; «его» в конце относится к покою и потому написано со строчной.
