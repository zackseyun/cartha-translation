  text: εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν, οὐκ ἂν περὶ ἄλλης ἐλάλει μετὰ ταῦτα ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/008.yaml
  text: For if Joshua had given them rest[a], he would not have spoken later about another day.
translation:
  language: ru
  text: Ведь если бы Иисус Навин дал им покой[a], то после этого не говорилось бы о другом дне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'По-гречески: «Иисус». Форма Ἰησοῦς может обозначать и Иисуса, и Иисуса Навина; здесь контекст указывает на Иисуса Навина, сына Нуна.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Иисус Навин
  rationale: Греческая форма имени может обозначать как Иисуса, так и Иисуса Навина; контекст вступления Израиля в землю и последующего обетования покоя указывает здесь на Иисуса Навина.
- source_word: κατέπαυσεν
  choice: дал им покой
  rationale: Передаёт каузативный смысл глагола — дать покой, привести к покою — и сохраняет ключевую для отрывка лексику покоя.
- source_word: οὐκ ἂν ... ἐλάλει
  choice: не говорилось бы
  rationale: Передаёт контрфактическое следствие. Безличная конструкция сохраняет невыраженность говорящего в греческом тексте и естественно звучит по-русски.
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: о другом дне
  rationale: Прямо и естественно передаёт указание на иной, последующий день в развитии рассуждения.
- source_word: μετὰ ταῦτα
  choice: после этого
  rationale: Сохраняет явное временное значение греческого выражения и связь с событиями времён Иисуса Навина.
- source_word: γὰρ
  choice: Ведь
  rationale: Естественно вводит пояснение и обоснование предыдущего утверждения в современном литературном русском языке.
theological_decisions:
- issue: Кого обозначает Ἰησοῦς в Евреям 4:8
  choice: Иисус Навин
  alternative: Иисус
  rationale: Рассуждение касается того, дал ли Израилю окончательный покой предводитель, введший народ в Ханаан. Поэтому в основном тексте назван Иисус Навин; совпадение греческих форм имён отмечено в сноске.
- issue: Неявный субъект ἐλάλει
  choice: Безличное «не говорилось бы»
  alternative: «Он не говорил бы» или «Бог не говорил бы»
  rationale: Греческая глагольная форма не называет субъект прямо. Безличная русская конструкция не добавляет имени Бога и не вынуждает читателя однозначно определять местоименный референт.
translation_notes:
  register: Современный литературный русский язык; связка «Ведь если бы… то…» ясно передаёт пояснительный и контрфактический ход мысли. Ключевое слово «покой» согласовано с терминологией окружающего отрывка.
