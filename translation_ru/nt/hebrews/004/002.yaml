base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: ru
  text: Ведь и нам была возвещена благая весть, так же, как и им; но услышанное слово не принесло им пользы, потому что они не соединились верой с теми, кто услышал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В ряде рукописей заключительные слова допускают перевод: «потому что услышанное слово не соединилось с верой у тех, кто услышал».'
    reason: textual_variant
lexical_decisions:
- source_word: εὐηγγελισμένοι
  choice: была возвещена благая весть
  rationale: Перифрастический перфект ἐσμεν εὐηγγελισμένοι указывает на совершившееся возвещение, сохраняющее значение для адресатов. Формулировка передаёт глагольную идею и естественно применима также к поколению пустыни.
- source_word: καθάπερ κἀκεῖνοι
  choice: как и им
  rationale: Кратко и естественно выражает сопоставление адресатов с ранее упомянутым поколением пустыни.
- source_word: ὁ λόγος τῆς ἀκοῆς
  choice: услышанное слово
  rationale: Передаёт λόγος как содержание возвещения, а ἀκοή — как услышанное; сохраняет характерный для библейского текста образ «слова», не прибегая к неестественному буквальному обороту «слово слышания».
- source_word: ὠφέλησεν
  choice: не принесло им пользы
  rationale: Естественная современная формулировка, точно передающая отсутствие благотворного результата.
- source_word: συγκεκερασμένους
  choice: не соединились
  rationale: Чтение SBLGNT имеет форму мужского рода винительного падежа, согласующуюся с ἐκείνους; поэтому причастие отнесено к людям. «Соединились» передаёт метафорическое значение смешения или объединения.
- source_word: πίστει
  choice: верой
  rationale: Творительный падеж естественно передаёт дательный способа или сферы; «вера» сохраняет основной смысл πίστις в контексте противопоставления слышания и верующего отклика.
- source_word: τοῖς ἀκούσασιν
  choice: с теми, кто услышал
  rationale: Близко передаёт субстантивированное причастие ἀκούσασιν и сохраняет неоднозначность того, подразумевается ли простое слышание или восприимчивое слушание.
theological_decisions:
- issue: Значение πίστις
  choice: вера
  alternative: доверие
  rationale: В контексте речь идёт об отклике на услышанное Божье слово. «Вера» является точным и привычным соответствием, не уточняющим сверх текста характер этого отклика.
- issue: Синтаксис заключительной части стиха
  choice: люди не соединились верой с теми, кто услышал
  alternative: услышанное слово не смешалось с верой в слышавших
  rationale: Основной текст следует форме συγκεκερασμένους в предоставленном SBLGNT, которая естественно согласуется с ἐκείνους. Известное вариантное чтение допускает традиционное толкование со «словом» как подразумеваемым субъектом; оно сохранено в примечании.
translation_notes:
  register: 'Современный литературный русский язык, ясный и достойный по тону. Сохранены библейские выражения «благая весть», «слово» и «вера», а трудность заключительной конструкции не сглажена: основной текст следует данной форме SBLGNT, вариант отражён в примечании.'
