  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: ru
  text: 'Вновь Он назначает некий день — «Сегодня», — говоря через Давида[a] спустя столь долгое время, как уже было сказано: «Сегодня, если услышите Его голос, не ожесточайте сердца ваши».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говоря в Давиде», то есть в тексте или псалме, связанном с Давидом.'
    reason: Сохраняет возможное понимание ἐν Δαυὶδ как ссылки на текст, связанный с Давидом, наряду с основным переводом «через Давида».
lexical_decisions:
- source_word: πάλιν
  choice: вновь
  rationale: 'Передаёт возобновление аргумента: Бог снова обозначает день, остающийся возможностью откликнуться.'
- source_word: τινὰ ἡμέραν
  choice: определённый день
  rationale: Сохраняет значение конкретного, но пока не названного дня; далее он определяется словом «сегодня».
- source_word: ὁρίζει
  choice: назначает
  rationale: Передаёт властное установление или обозначение дня и естественно звучит по-русски в данном контексте.
- source_word: Σήμερον
  choice: сегодня
  rationale: Сохранено как наименование назначенного дня и ключевое слово цитаты из псалма, без сведения его смысла только к календарной дате.
- source_word: ἐν Δαυὶδ λέγων
  choice: говоря через Давида
  rationale: Естественно передаёт Давида как посредника речи Бога, не усиливая утверждение об авторстве псалма сверх формулировки текста.
- source_word: μετὰ τοσοῦτον χρόνον
  choice: спустя столь долгое время
  rationale: Сохраняет акцент на большом временном промежутке после поколения пустыни.
- source_word: καθὼς προείρηται
  choice: как уже было сказано
  rationale: Передаёт предшествующее высказывание, сохраняющее актуальность в настоящем рассуждении.
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: если услышите Его голос
  rationale: Сохраняет условную конструкцию и библейский образ слышания голоса, не подменяя его толкованием «послушаетесь».
- source_word: μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: не ожесточайте ваших сердец
  rationale: Точно сохраняет предупреждение против сознательного упорства и традиционный антропологический образ сердца.
theological_decisions:
- issue: Смысл слова «сегодня» в рассуждении о Божьем покое
  choice: Передать «сегодня» как вновь назначенную Богом возможность откликнуться, не ограничивая её только историческим днём произнесения псалма.
  alternative: Понимать «сегодня» исключительно как исторический день псалмопевца либо исключительно как эсхатологический день.
  rationale: Автор подчёркивает, что спустя долгое время Бог всё ещё называет день для отклика. Перевод сохраняет эту временную и богословскую напряжённость, не систематизируя её сверх текста.
- issue: Значение ἐν Δαυὶδ
  choice: говоря через Давида
  alternative: говоря «у Давида», то есть в псалме, связанном с Давидом
  rationale: Основной текст ясно передаёт опосредованную речь Бога; сноска сохраняет возможное понимание оборота как ссылки на место в Давидовом псалме.
- issue: Неявное подлежащее при ὁρίζει и λέγων
  choice: Сохранить местоимение «Он» в соответствии с ближайшим контекстом, где действующим лицом является Бог.
  alternative: Явно поставить имя «Бог».
  rationale: Местоимение сохраняет связность с контекстом и не добавляет имени, отсутствующего в самом стихе, хотя его референт контекстуально ясен.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Тире выделяют приложение «сегодня», а прописная буква в местоимении «Его» следует принятой русской библейской издательской норме.
