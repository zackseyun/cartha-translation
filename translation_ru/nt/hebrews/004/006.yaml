  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: ru
  text: Итак, поскольку некоторым всё ещё остаётся возможность войти в него, а те, кому прежде была возвещена благая весть, не вошли из-за непослушания[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за неверия». Греческое слово может обозначать отказ поверить, выражающийся в непослушании.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: Итак, поскольку
  rationale: Сочетание одновременно передаёт вывод из предыдущего рассуждения (οὖν) и основание для последующего утверждения (ἐπεί).
- source_word: ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν
  choice: некоторым ещё остаётся войти в него
  rationale: Настоящее время ἀπολείπεται указывает, что возможность войти по-прежнему сохраняется; «ещё» естественно выражает эту продолжающуюся открытость. Местоимение «него» согласовано по-русски с ранее упомянутым «покоем».
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: те, кому прежде была возвещена благая весть
  rationale: 'Передана пассивная форма εὐαγγελισθέντες: этим людям благую весть возвестили. Формулировка современна и не использует узкоцерковное «евангелизированы».'
- source_word: οὐκ εἰσῆλθον
  choice: не вошли
  rationale: Прямо передаёт отрицание и аорист исходного текста без дополнительного смыслового оттенка неудачной попытки.
- source_word: δι’ ἀπείθειαν
  choice: из-за непослушания
  rationale: ἀπείθεια прежде всего обозначает непослушание, хотя в данном контексте тесно связано с неверием и отказом довериться Божьему слову.
theological_decisions:
- issue: Значение ἀπείθεια в предостережении о вхождении в Божий покой
  choice: из-за непослушания
  alternative: из-за неверия
  rationale: Основной текст сохраняет прямое значение «непослушание», не сводя его лишь к интеллектуальному неверию; подлинное смысловое пересечение неверия и непослушания отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Синтаксис сохраняет связь с продолжающимся предложением и аргументацией соседних стихов; поэтому в конце оставлена запятая, как в исходном фрагменте.
