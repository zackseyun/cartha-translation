  text: σπουδάσωμεν οὖν εἰσελθεῖν εἰς ἐκείνην τὴν κατάπαυσιν, ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/011.yaml
  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: ru
  text: Итак, постараемся войти в тот покой, чтобы никто не пал по тому же примеру непослушания.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не пал по тому же примеру неверия». Речь идёт о поколении израильтян в пустыне, отказавшемся довериться Богу, хотя греческое слово непосредственно означает «непослушание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: постараемся
  rationale: Увещательное сослагательное наклонение призывает к усердному, деятельному стремлению; «постараемся» естественно передаёт это в современном русском языке.
- source_word: οὖν
  choice: итак
  rationale: Выражает вывод из предшествующего рассуждения о Божьем покое и падении поколения пустыни.
- source_word: εἰσελθεῖν
  choice: войти
  rationale: Прямо и естественно передаёт инфинитив, дополняющий призыв.
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: тот покой
  rationale: Сохраняет указательное значение и связь с покоем, о котором говорится выше, не уточняя его природу сверх текста.
- source_word: ἵνα μὴ ... τις
  choice: чтобы никто не
  rationale: Естественно передаёт отрицательную цель и предупреждение.
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: последовав тому же примеру
  rationale: Передаёт ὑπόδειγμα как предостерегающий пример поколения пустыни и естественно выражает по-русски смысл конструкции с ἐν.
- source_word: πέσῃ
  choice: не пал
  rationale: Сохраняет образ падения и серьёзный характер предупреждения.
- source_word: τῆς ἀπειθείας
  choice: непослушания
  rationale: Это прямое лексическое значение ἀπείθεια; родительный падеж сохраняет связь с «примером».
theological_decisions:
- issue: Связь ἀπείθεια с неверием поколения пустыни
  choice: В основном тексте — «непослушание»
  alternative: «неверие»
  rationale: В Послании к евреям неверие и непослушание тесно связаны, однако непосредственное значение ἀπείθεια — «непослушание». Примечание сохраняет контекстуальную возможность, не подменяя ею лексику оригинала.
translation_notes:
  register: Современный литературный русский язык; тон увещательный и торжественный, но доступный. Формулировка сохраняет образ «войти в покой» и не конкретизирует богословское содержание этого покоя сверх контекста.
