  text: διδαχαῖς ποικίλαις καὶ ξέναις μὴ παραφέρεσθε· καλὸν γὰρ χάριτι βεβαιοῦσθαι τὴν καρδίαν, οὐ βρώμασιν, ἐν οἷς οὐκ ὠφελήθησαν οἱ ⸀περιπατοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/009.yaml
  text: Do not be carried away by various and strange teachings[a], for it is good for the heart to be strengthened by grace, not by foods[c][b], by which those who occupied themselves with them were not benefited.
translation:
  language: ru
  text: Не увлекайтесь разными и чуждыми учениями, ведь хорошо, чтобы сердце укреплялось благодатью[a], а не пищей[b], от которой не получили пользы те, чья жизнь была с ней связана[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы сердце утверждалось благодатью». Глагол может означать «укреплять», «утверждать», «делать твёрдым».'
    reason: lexical_alternative
  - marker: b
    text: Под «пищей» могут подразумеваться пищевые обряды или связанные с пищей установления, однако по-гречески сказано просто «пищами».
    reason: cultural_note
  - marker: c
    text: 'Буквально: «те, кто ходил в них»; возможный смысл: «те, кто жил по ним» или «занимался этим».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διδαχαῖς ποικίλαις καὶ ξέναις
  choice: разными и чуждыми учениями
  rationale: «Разными» передаёт ποικίλαις, а «чуждыми» — ξέναις в значении учений, не принадлежащих принятой вести; формулировка сохраняет предостерегающий тон, не связывая их с этнической чужеземностью.
- source_word: μὴ παραφέρεσθε
  choice: не увлекайтесь
  rationale: Настоящее пассивное запрещение описывает опасность быть унесёнными в сторону. Русское «не увлекайтесь» естественно передаёт как продолжающееся предостережение, так и образ отклонения под воздействием учений.
- source_word: καλὸν γὰρ
  choice: ведь хорошо
  rationale: Передаёт положительную оценку καλόν и причинную связь γάρ с предыдущим предостережением.
- source_word: χάριτι
  choice: благодатью
  rationale: Творительный падеж естественно выражает средство укрепления и сохраняет богословски значимый термин без поясняющего расширения.
- source_word: βεβαιοῦσθαι τὴν καρδίαν
  choice: чтобы сердце укреплялось
  rationale: «Укреплялось» передаёт смысл утверждения и придания твёрдости; «сердце» сохранено как библейское обозначение внутреннего человека.
- source_word: οὐ βρώμασιν
  choice: а не пищей
  rationale: βρώμασιν означает пищу или пищевые продукты. Единственное собирательное «пищей» естественнее по-русски и не добавляет в основной текст конкретного толкования о предписаниях.
- source_word: ἐν οἷς οἱ περιπατοῦντες
  choice: тем, кто придерживался связанных с ней обычаев
  rationale: Буквально выражение говорит о «ходивших в них», однако применительно к пище это метафора образа поведения. Перевод раскрывает идиоматический смысл, а сноска сохраняет буквальный образ и более широкие варианты понимания.
- source_word: οὐκ ὠφελήθησαν
  choice: не принесла пользы
  rationale: Естественная русская конструкция передаёт отсутствие пользы для практиков, хотя ради идиоматичности меняет греческую пассивную конструкцию на активную.
theological_decisions:
- issue: Значение «пищи» и её противопоставление благодати
  choice: В основном тексте сохранено общее слово «пища», а вероятная связь с пищевыми обрядами отмечена в сноске.
  alternative: Прямо перевести как «пищевые предписания» либо сузить значение до жертвенных трапез.
  rationale: βρώμασιν само по себе означает «пища». Контекст допускает обрядовые и культовые ассоциации, но не требует выбирать одну конкретную систему.
- issue: Метафорическое значение «сердца»
  choice: Сохранено слово «сердце».
  alternative: Передать как «внутренний человек», «душа» или «ум».
  rationale: καρδία обозначает центр внутренней жизни и сохраняет важный библейский образ; парафраз излишне сужал бы значение.
- issue: Характер пользы от пищевых практик
  choice: Текст утверждает лишь, что такие практики не принесли пользы тем, кто им следовал.
  alternative: Уточнить, что речь идёт об оправдании, спасении или освящении.
  rationale: Греческий текст не называет конкретный вид пользы, поэтому богословское уточнение не внесено.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис упрощён для ясного чтения, при этом сохранены ключевые образы «сердца» и «благодати». Все три сноски отмечены в основном тексте.
