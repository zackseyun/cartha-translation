  source_fidelity: 'Перевод точно передаёт синтаксические связи и основные значения греческого текста: животные соотносятся и с их кровью, и с их телами; внесение крови связано с первосвященником, целью «за грех» и святилищем; тела сжигаются вне стана. Активное «первосвященник вносит» и неопределённо-личное «сжигают» являются естественными русскими способами передать греческие пассивные формы без смысловой утраты.'
