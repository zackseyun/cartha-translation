id: HEB.13.11
reference: Hebrews 13:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὧν γὰρ εἰσφέρεται ζῴων τὸ αἷμα περὶ ἁμαρτίας εἰς τὰ ἅγια διὰ τοῦ ἀρχιερέως, τούτων τὰ σώματα κατακαίεται ἔξω τῆς παρεμβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/011.yaml
  text: For the bodies of those animals whose blood is brought into the holy places for sin by the high priest are burned outside the camp[a][b].
translation:
  language: ru
  text: Ведь тела тех животных, чью кровь первосвященник вносит за грех в святилище[a], сжигают вне стана[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во святые места»; речь идёт о священной области святилища.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сжигают дотла». Греческий глагол может подчёркивать полное сожжение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ... ζῴων / τούτων τὰ σώματα
  choice: тела тех животных, чью кровь
  rationale: Русская конструкция естественно передаёт соотнесённые относительное и указательное местоимения греческого текста и ясно связывает кровь с жертвенными животными.
- source_word: γὰρ
  choice: ведь
  rationale: «Ведь» естественно вводит пояснение к предыдущей мысли и сохраняет обосновывающую функцию частицы.
- source_word: εἰσφέρεται
  choice: вносит
  rationale: Настоящее время и ритуальное внесение крови переданы обычным для русского культового контекста глаголом; активная конструкция естественнее пассивной, а действующее лицо прямо названо далее.
- source_word: τὸ αἷμα
  choice: кровь
  rationale: Прямое соответствие жертвенному термину без парафраза.
- source_word: περὶ ἁμαρτίας
  choice: за грех
  rationale: Формула сохраняет связь жертвенного действия с грехом, не сужая выражение до однозначного названия «жертва за грех».
- source_word: εἰς τὰ ἅγια
  choice: в святилище
  rationale: В современном русском «святилище» естественно обозначает священную храмовую область; буквальное множественное «во святые места» здесь звучало бы неидиоматично. Возможная более буквальная передача отмечена в сноске.
- source_word: διὰ τοῦ ἀρχιερέως
  choice: первосвященник
  rationale: Греческая конструкция выражает деятеля. В русском активная форма «первосвященник вносит» точно и естественно передаёт эту роль.
- source_word: κατακαίεται
  choice: сжигают
  rationale: Неопределённо-личная конструкция естественно передаёт греческий пассив и ритуальное действие. Усилительный оттенок полного сожжения сохранён в сноске.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: вне стана
  rationale: «Стан» — понятный и укоренённый русский термин для израильского лагеря в библейском повествовании; «вне» сохраняет dignified cultic register.
theological_decisions:
- issue: Объём значения εἰς τὰ ἅγια
  choice: «в святилище» без уточнения его внутренней части
  alternative: «во святые места» или «в Святое святых»
  rationale: Форма τὰ ἅγια в Послании к евреям может обозначать священную область святилища с некоторой гибкостью. Перевод не отождествляет её прямо со Святым святых и тем самым не вносит отсутствующую в данной фразе степень конкретизации.
- issue: Значение περὶ ἁμαρτίας
  choice: «за грех»
  alternative: «как кровь жертвы за грех»
  rationale: Выбранная формулировка сохраняет культовую связь с грехом, но не превращает более широкое греческое выражение в строгое наименование разновидности жертвы.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Первосвященник», «святилище» и «вне стана» сохраняют культовый контекст, оставаясь понятными обычному читателю. Все сноски обозначены в основном тексте.
