lexical_decisions:
- source_word: ἡ χάρις
  choice: Благодать
  rationale: В заключительном благословении χάρις означает Божью благодать. В русском языке артикль отдельно не передаётся; существительное естественно употребляется без определения.
- source_word: μετὰ
  choice: да будет с
  rationale: Предлог μετά с родительным падежом означает «с». Эллиптическая благословительная формула по-русски естественно передаётся с пожелательным «да будет», не добавляющим нового богословского содержания.
- source_word: πάντων ὑμῶν
  choice: со всеми вами
  rationale: Передаёт явное πάντων и подчёркивает, что благословение обращено ко всем адресатам.
