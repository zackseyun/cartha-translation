  text: ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους. ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/024.yaml
  text: Greet all your leaders and all the saints[a]. Those from Italy greet you.
translation:
  language: ru
  text: Приветствуйте всех ваших руководителей и всех святых. Те, кто из Италии, приветствуют вас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Те, кто в Италии, приветствуют вас». Греческое выражение может обозначать как выходцев из Италии, так и людей, находящихся там.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Приветствуйте
  rationale: Аорист, средний залог, повелительное наклонение от ἀσπάζομαι. В эпистолярном контексте это естественная передача приветствия с сохранением повелительной силы.
- source_word: πάντας
  choice: всех
  rationale: Прямо передаёт значение всей совокупности в обеих однородных группах.
- source_word: τοὺς ἡγουμένους ὑμῶν
  choice: ваших руководителей
  rationale: Причастие обозначает тех, кто ведёт общину. «Руководители» ясно и современно передаёт роль, не придавая ей политического смысла слова «правители» и не сужая её до наставничества.
- source_word: τοὺς ἁγίους
  choice: святых
  rationale: Сохраняет обычное новозаветное обозначение верующих как освящённого народа и не заменяет его более истолковывающим выражением «народ Божий».
- source_word: ἀσπάζονται
  choice: приветствуют
  rationale: Настоящее время, средний залог, изъявительное наклонение; «приветствуют» естественно для заключительной формулы письма и лексически соответствует первому глаголу стиха.
- source_word: οἱ ἀπὸ τῆς Ἰταλίας
  choice: те, кто из Италии
  rationale: Предлог ἀπό с родительным падежом прежде всего указывает на происхождение или исходный пункт. Такая формулировка сохраняет буквальный смысл и не добавляет отсутствующего в греческом тексте существительного.
theological_decisions:
- issue: Кого обозначает οἱ ἀπὸ τῆς Ἰταλίας
  choice: те, кто из Италии
  alternative: те, кто в Италии
  rationale: Основной текст следует обычному значению ἀπό — происхождению из Италии. Однако выражение может пониматься как указание на людей, находящихся в Италии; поскольку это влияет на реконструкцию места написания, но не может быть решено с полной уверенностью, вариант сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным эпистолярным звучанием. Слово «святые» сохранено как значимый новозаветный термин; «руководители» выбрано как понятное современному читателю обозначение признанных ведущих общины.
