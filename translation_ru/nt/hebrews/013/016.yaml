  text: τῆς δὲ εὐποιΐας καὶ κοινωνίας μὴ ἐπιλανθάνεσθε, τοιαύταις γὰρ θυσίαις εὐαρεστεῖται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
translation:
  language: ru
  text: Не забывайте[a] также делать добро и делиться с другими[b], потому что такие жертвы угодны Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не пренебрегайте». Буквально греческий глагол означает «не забывайте», но здесь подразумевается также, что эти дела нельзя оставлять без исполнения.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «делиться с другими» может также означать «проявлять участие», «общение» или «быть щедрыми»; в данном контексте, вероятно, имеется в виду практическая готовность делиться с другими своими средствами.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐποιΐας
  choice: делать добро
  rationale: Передаёт деятельное благодеяние естественным современным русским выражением, сохраняя смысл отвлечённого существительного.
- source_word: κοινωνίας
  choice: делиться с другими
  rationale: В сочетании с εὐποιΐας и упоминанием жертв слово, вероятнее всего, обозначает практическое участие и готовность делиться, в том числе материальными средствами; формулировка не сужает смысл до одного лишь пожертвования.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: не забывайте
  rationale: Сохраняет прямое значение греческого глагола и естественно выражает увещание не оставлять эти дела без исполнения.
- source_word: τοιαύταις ... θυσίαις
  choice: такие жертвы
  rationale: Сохраняет явную жертвенную метафору и соотносит её с названными делами добра и взаимного участия.
- source_word: εὐαρεστεῖται
  choice: угодны
  rationale: Русская конструкция «угодны Богу» естественно передаёт смысл Божьего благоволения к таким жертвам.
- source_word: ὁ θεός
  choice: Богу
  rationale: Стандартная передача слова θεός; дательный падеж обусловлен русской конструкцией «угодны Богу».
- source_word: δὲ
  choice: также
  rationale: Мягко связывает увещание с предыдущим контекстом без внесения сильного противопоставления.
theological_decisions:
- issue: Характер «жертв» в стихе
  choice: Метафорическое обозначение дел добра и готовности делиться как жертв, угодных Богу
  alternative: Понимание исключительно как милостыни либо устранение жертвенного оттенка в пользу общего нравственного поведения
  rationale: Греческий текст прямо называет эти поступки жертвами. Перевод сохраняет культовую метафору, не сводя её только к материальной милостыне и не устраняя её богословского напряжения.
translation_notes:
  register: Современный литературный русский язык; ясный, достоинственный увещательный тон. Прямое «не забывайте» сохраняет образ исходного глагола, а «делиться с другими» естественно передаёт широкий практический смысл κοινωνία. Маркеры сносок размещены после соответствующих выражений.
