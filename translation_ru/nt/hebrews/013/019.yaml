  text: περισσοτέρως δὲ παρακαλῶ τοῦτο ποιῆσαι ἵνα τάχιον ἀποκατασταθῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/019.yaml
  text: And I urge you all the more to do this[a], so that I may be restored to you sooner.
translation:
  language: ru
  text: И ещё настойчивее прошу вас делать это, чтобы я скорее был возвращён к вам[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «снова оказался среди вас». Греческое выражение говорит о возвращении автора к читателям, не уточняя конкретных обстоятельств.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσοτέρως
  choice: ещё настойчивее
  rationale: Сравнительное наречие усиливает просьбу по отношению к предыдущему призыву. «Ещё настойчивее» естественно передаёт и сравнительную силу, и серьёзность обращения.
- source_word: δὲ
  choice: и
  rationale: Здесь частица служит мягкой связкой с предыдущей мыслью, а не выражает резкое противопоставление.
- source_word: παρακαλῶ
  choice: прошу
  rationale: В данном контексте глагол обозначает настоятельную просьбу. Её усиленный характер уже выражен словами «ещё настойчивее».
- source_word: τοῦτο ποιῆσαι
  choice: делать это
  rationale: Указательное местоимение отсылает к непосредственно предшествующей просьбе молиться; формулировка сохраняет эту анафорическую связь.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз естественно передаёт целевое значение греческого ἵνα.
- source_word: τάχιον
  choice: скорее
  rationale: Сравнительное наречие означает «быстрее, раньше»; в данном контексте естественнее русское «скорее».
- source_word: ἀποκατασταθῶ
  choice: был возвращён
  rationale: Пассивная форма сохранена и не уточняет, какие именно обстоятельства препятствуют возвращению автора к адресатам.
- source_word: ὑμῖν
  choice: к вам
  rationale: Дательный падеж выражает направленность возвращения к адресатам; русский предлог «к» передаёт её естественно.
theological_decisions:
- issue: Обстоятельства предполагаемого возвращения автора
  choice: Общее указание на то, что автор будет возвращён к адресатам, без уточнения причины его отсутствия.
  alternative: Освобождение из заключения, возвращение из путешествия либо восстановление служения среди адресатов.
  rationale: Греческое ἀποκατασταθῶ ὑμῖν не называет обстоятельств разлуки. Перевод не связывает слова автора с конкретным историческим сценарием и сохраняет неопределённость исходного текста.
translation_notes:
  register: Современный литературный русский язык с уважительным, но не архаичным звучанием. Сочетание «ещё настойчивее прошу» передаёт усиленную просьбу, а пассивное «был возвращён» сохраняет форму и неопределённость греческого текста.
