  text: τοίνυν ἐξερχώμεθα πρὸς αὐτὸν ἔξω τῆς παρεμβολῆς, τὸν ὀνειδισμὸν αὐτοῦ φέροντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/013.yaml
  text: Therefore[a], let us go out to him outside the camp, bearing his reproach.
translation:
  language: ru
  text: Итак, выйдем к нему за пределы стана[a], неся его поношение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «за пределы лагеря». Этот оборот отсылает к образу жертвоприношения в Лев 16 и к тому, что Иисус был отвергнут и пострадал вне города.
    reason: Лексическая альтернатива и пояснение ветхозаветного образа.
lexical_decisions:
- source_word: τοίνυν
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения, особенно из Евр 13:11–12, и естественно звучит в современном русском языке.
- source_word: ἐξερχώμεθα
  choice: выйдем
  rationale: Форма первого лица множественного числа имеет побудительное значение; «выйдем» ясно и без архаизации передаёт совместный призыв.
- source_word: πρὸς αὐτὸν
  choice: к нему
  rationale: Предлог πρός с винительным обозначает движение к лицу. Местоимение сохранено, как в греческом тексте; из ближайшего контекста ясно, что речь об Иисусе.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: за пределы стана
  rationale: «Стан» сохраняет культовый и библейский образ лагеря из контекста жертвоприношений, а выражение «за пределы» естественно передаёт пространственное значение ἔξω.
- source_word: τὸν ὀνειδισμὸν αὐτοῦ
  choice: его поругание
  rationale: «Поругание» передаёт публичное унижение, оскорбление и позор, связанные с отвержением Иисуса, не устраняя возможную смысловую ёмкость притяжательного местоимения.
- source_word: φέροντες
  choice: неся
  rationale: Причастие выражает сопутствующее и продолжающееся действие. «Неся» сохраняет образ бремени и не подменяет его более толковательным «терпя».
theological_decisions:
- issue: К кому относится местоимение «нему»
  choice: Сохранить местоимение; в контексте оно относится к Иисусу из Евр 13:12.
  alternative: Заменить местоимение именем «Иисусу».
  rationale: Греческий текст употребляет местоимение, а ближайший контекст достаточно ясно указывает на Иисуса. Замена именем сделала бы перевод более явным, чем источник.
- issue: Смысл выражения «за пределы стана»
  choice: Сохранить культовый и пространственный образ стана.
  alternative: 'Передать толкованием: «за пределы религиозного сообщества» или «прочь от общества».'
  rationale: Образ связан с левитской практикой вынесения жертвенных останков и с отвержением Иисуса вне городских ворот. Толковательный парафраз сузил бы многослойный смысл текста.
- issue: Смысл выражения «его поругание»
  choice: Сохранить притяжательную конструкцию и её смысловую ёмкость.
  alternative: 'Уточнить: «поругание за верность ему» или «то же поругание, которое понёс он».'
  rationale: 'Обе уточняющие формулировки возможны по смыслу, но каждая разрешает связь, которую греческая конструкция оставляет компактной: верующие разделяют позор, связанный с отверженным Иисусом.'
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. Слово «стан» сохранено ради межтекстовой связи, но архаичные синтаксические обороты не используются. Местоимения, относящиеся к Иисусу, даны со строчной буквы в соответствии с обычной современной орфографией и формой исходного текста.
