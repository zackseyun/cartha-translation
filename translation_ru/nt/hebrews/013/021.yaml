  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus the Messiah, to whom be the glory forever and ever. Amen.
translation:
  language: ru
  text: да подготовит вас ко всякому доброму делу, чтобы вы исполняли Его волю, совершая в нас угодное Ему через Иисуса, Мессию. Ему[a] слава во веки веков. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «Ему» может относиться непосредственно к Иисусу, Мессии; некоторые понимают его как относящееся к Богу мира, к Которому обращена эта молитва.
    reason: alternative_reading
lexical_decisions:
- source_word: καταρτίσαι
  choice: да подготовит
  rationale: Аорист оптатива выражает молитвенное пожелание. «Подготовит» передаёт наделение верующих всем необходимым и приведение их в состояние готовности к исполнению Божьей воли, не внося оттенка восстановления, которого контекст прямо не требует.
- source_word: ἐν παντὶ ἀγαθῷ
  choice: ко всему доброму
  rationale: Формулировка сохраняет широкое значение греческого выражения — всякое доброе дело или всё доброе, — не ограничивая его только предметами, которыми Бог снабжает верующих.
- source_word: εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ
  choice: чтобы вы исполняли Его волю
  rationale: Оборот с артиклевым инфинитивом имеет значение цели. «Исполняли» естественно сочетается в современном русском языке со словом «воля».
- source_word: ποιῶν ἐν ἡμῖν
  choice: совершая в нас
  rationale: Причастие описывает действие Бога, благодаря которому в верующих возникает угодное Ему. «В нас» сохраняет наиболее вероятное внутреннее значение ἐν ἡμῖν, хотя теоретически возможно и коллективное «среди нас».
- source_word: τὸ εὐάρεστον ἐνώπιον αὐτοῦ
  choice: угодное Ему
  rationale: Естественная русская передача субстантивированного прилагательного и выражения Божьей оценки; смысл «перед Ним / в Его глазах» передан без тяжеловесного буквального оборота.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: через Иисуса Мессию
  rationale: Предлог передаёт посредство. Χριστός сохранено как титул «Мессия», а не превращено без пояснения в имя-подобное «Христос».
- source_word: ᾧ ἡ δόξα
  choice: Ему слава
  rationale: Краткая русская доксологическая формула сохраняет местоименную отсылку греческого текста и не называет её референта прямо.
- source_word: εἰς τοὺς αἰῶνας
  choice: во веки веков
  rationale: Устойчивая и понятная русская формула для неограниченной длительности, уместная в торжественном завершении благословения.
theological_decisions:
- issue: К кому относится местоимение ᾧ в славословии
  choice: Сохранено местоименное «Ему» без прямого указания референта.
  alternative: Славословие можно понимать как обращённое либо к Иисусу Мессии, ближайшему предшествующему имени, либо к Богу мира, Который остаётся главным действующим лицом молитвы.
  rationale: Греческая конструкция допускает оба понимания. Перевод не устраняет богословскую и синтаксическую неоднозначность, а поясняет её в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным молитвенно-доксологическим звучанием. Синтаксис остаётся ясным для обычного читателя; традиционная формула «во веки веков» сохранена как живая и общеупотребительная в библейском регистре.
