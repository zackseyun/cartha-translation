  naturalness: Предлагаемая редакция устраняет не вполне естественное «ко всему доброму» и сохраняет современный литературный, молитвенно-торжественный регистр. «Во веки веков» уместно в доксологии.
  terminology: '«Иисус Мессия» следует заменить на «Иисус, Мессия»: в русском приложении титул после личного имени требует интонационного и пунктуационного обособления. Сноска корректно сохраняет неоднозначность ᾧ и не навязывает её разрешения.'
