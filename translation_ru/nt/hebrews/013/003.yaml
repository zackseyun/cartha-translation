  text: μιμνῄσκεσθε τῶν δεσμίων ὡς συνδεδεμένοι, τῶν κακουχουμένων ὡς καὶ αὐτοὶ ὄντες ἐν σώματι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
translation:
  language: ru
  text: Помните тех, кто в заключении, словно вы вместе с ними в узах[a], и тех, с кем жестоко обращаются, ведь и вы сами находитесь в теле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как связанные вместе с ними». Греческое выражение сохраняет образ общих уз с заключёнными.'
    reason: lexical_alternative
  - marker: b
    text: 'Вероятнее всего, речь идёт об общей человеческой телесности и уязвимости перед страданием. Возможно также понимание: принадлежность к телу Христову.'
    reason: alternative_reading
lexical_decisions:
- source_word: μιμνῄσκεσθε
  choice: Помните
  rationale: Настоящее повелительное наклонение призывает постоянно помнить и проявлять деятельную заботу; в современном русском «помните» естественно передаёт это продолжительное наставление без избыточного уточнения.
- source_word: τῶν δεσμίων
  choice: тех, кто в заключении
  rationale: δέσμιος обозначает человека в узах, то есть заключённого. Выбранная формулировка естественна по-русски, а образ уз сохранён в следующей части стиха.
- source_word: ὡς συνδεδεμένοι
  choice: словно вы вместе с ними в узах
  rationale: Причастие συνδεδεμένοι буквально передаёт совместную связанность узами и призывает отождествить себя с заключёнными. Формулировка сохраняет этот образ и звучит естественно.
- source_word: τῶν κακουχουμένων
  choice: тех, с кем жестоко обращаются
  rationale: κακουχέομαι означает терпеть дурное или жестокое обращение, притеснение. Перевод сохраняет пассивный смысл страдания, причиняемого другими.
- source_word: ὡς καὶ αὐτοὶ ὄντες ἐν σώματι
  choice: ведь и вы сами находитесь в теле
  rationale: Буквальное «в теле» сохраняет открытость выражения, а «ведь» естественно передаёт его мотивирующую функцию в контексте.
theological_decisions:
- issue: Смысл выражения ἐν σώματι («в теле»)
  choice: Общая телесная человеческая уязвимость перед страданием
  alternative: Принадлежность к телу Христову
  rationale: Контекст прежде всего призывает сострадать заключённым и терпящим жестокое обращение на основании общей телесной уязвимости. Однако буквальная формулировка «в теле» не устраняет возможный отзвук общего пребывания в теле Христовом.
translation_notes:
  register: Современный литературный русский язык; ясная и достойная форма наставления. Образ уз сохранён без архаизации, а выражение «в теле» оставлено намеренно открытым для присущей оригиналу смысловой напряжённости.
