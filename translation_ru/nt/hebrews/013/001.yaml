translation:
  language: ru
  text: Пусть братская любовь сохраняется[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «любовь к другим верующим». Греческое слово означает семейную привязанность внутри христианской общины и относится не только к мужчинам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλαδελφία
  choice: братская любовь
  rationale: Существительное обозначает родственную любовь между братьями и сёстрами, а в раннехристианском употреблении — семейную привязанность между верующими. «Братская любовь» сохраняет семейную метафору греческого слова; примечание поясняет, что речь не только о мужчинах.
- source_word: μενέτω
  choice: пусть … сохраняется
  rationale: Настоящее повелительное наклонение глагола μένω призывает поддерживать уже существующее состояние. Такая передача естественно выражает как побуждение, так и продолжительный характер действия.
- source_word: Ἡ
  choice: отдельно не передано
  rationale: Артикль представляет братскую любовь как известную адресатам добродетель. В русском языке перед существительным в этом увещании отдельного соответствия артиклю не требуется.
theological_decisions:
- issue: Объём значения φιλαδελφία и гендерно маркированная семейная метафора
  choice: 'В основном тексте: «братская любовь» с пояснением в сноске.'
  alternative: «любовь к другим верующим»; «взаимная любовь»; «любовь братьев и сестёр»
  rationale: Выбранный вариант сохраняет семейный образ исходного слова и традиционно понятен по-русски. При этом сноска предотвращает ошибочное ограничение смысла любовью только между мужчинами и указывает на всю общину верующих.
translation_notes:
  register: Современный литературный русский язык; краткое увещание передано ясно и достойно. Формула «пусть … сохраняется» избегает архаичного «да пребывает» и не добавляет отсутствующей в оригинале метафоры угасания.
