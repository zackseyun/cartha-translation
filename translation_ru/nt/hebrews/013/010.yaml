base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/010.yaml
  text: We have an altar from which those who serve at the tabernacle have no right to eat[a][b].
translation:
  language: ru
  text: У нас есть жертвенник, от которого не имеют права вкушать те, кто служит при скинии[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, точнее: «те, кто совершает служение в скинии». Речь идёт о людях, занятых служением в святилище прежнего завета.'
    reason: lexical_alternative
  - marker: b
    text: '«Жертвенник» понимают по-разному: как самого Христа, крест, небесный жертвенник или блага, дарованные жертвой Христа. Здесь греческий текст не уточняет этот образ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχομεν
  choice: У нас есть
  rationale: Простой настоящий глагол сохраняет включение автора и его читателей в общее обладание или доступ.
- source_word: θυσιαστήριον
  choice: жертвенник
  rationale: Обычный русский библейский эквивалент конкретного культового термина; он сохраняет образ и не подменяет его толкованием вроде «крест» или «жертва».
- source_word: ἐξ οὗ
  choice: от которого
  rationale: Предлог ἐκ с относительным местоимением указывает на источник; формулировка естественно передаёт образ вкушения от жертвенника.
- source_word: φαγεῖν
  choice: есть
  rationale: Инфинитив передан прямо и естественно в сочетании «не имеют права есть».
- source_word: οὐκ ἔχουσιν ἐξουσίαν
  choice: не имеют права
  rationale: В данном культовом контексте выражение обозначает отсутствие законного или дозволенного права участвовать в трапезе; вариант не сводит смысл лишь к способности.
- source_word: οἱ τῇ σκηνῇ λατρεύοντες
  choice: те, кто служит при скинии
  rationale: λατρεύω здесь означает культовое служение, а не поклонение вообще. «При скинии» естественно передаёт дательный оборот и связь со служением в ветхозаветном святилище.
theological_decisions:
- issue: К чему относится образ «жертвенника» в Евреям 13:10
  choice: Оставить слово «жертвенник» без уточнения его референта в основном тексте.
  alternative: Сам Христос; крест; небесный жертвенник; жертвенные блага приношения Христа.
  rationale: Греческий текст прямо не поясняет образ. Его конкретизация в переводе устранила бы подлинную богословскую неоднозначность и внесла бы в основной текст одно из конкурирующих толкований.
translation_notes:
  register: Современный литературный русский язык с сохранением привычной библейской культовой лексики. Формулировка краткая и dignified; «скиния» сохранена как устоявшийся термин, а её значение пояснено в сноске.
