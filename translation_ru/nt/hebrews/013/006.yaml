  text: ὥστε θαρροῦντας ἡμᾶς λέγειν· Κύριος ἐμοὶ βοηθός, ⸀οὐ φοβηθήσομαι· τί ποιήσει μοι ἄνθρωπος;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/006.yaml
  text: so that we confidently say[a], “The Lord is my helper; I will not be afraid[b]. What can man do to me?”
translation:
  language: ru
  text: 'так что мы с уверенностью говорим: «Господь — мой помощник, и я не убоюсь. Что сделает мне человек?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: так что
  rationale: Передаёт результативно-следственную связь с предшествующим утверждением и естественно вводит последующую речь.
- source_word: θαρροῦντας ἡμᾶς λέγειν
  choice: мы с уверенностью говорим
  rationale: Причастие θαρροῦντας выражает смелость и уверенность; конструкция передана естественно, без добавления модального значения «можем».
- source_word: Κύριος
  choice: Господь
  rationale: Обычное и контекстуально уместное русское соответствие титулу κύριος в цитате из Писания.
- source_word: ἐμοὶ βοηθός
  choice: мой помощник
  rationale: Дательный ἐμοὶ при существительном βοηθός естественно передаётся русской притяжательной конструкцией, сохраняющей личный характер помощи.
- source_word: οὐ φοβηθήσομαι
  choice: я не убоюсь
  rationale: Будущая форма сохранена. «Не убоюсь» — понятная литературная и цитатно-псалмическая формулировка, соответствующая торжественному регистру.
- source_word: τί ποιήσει μοι ἄνθρωπος
  choice: Что сделает мне человек?
  rationale: Формально сохраняет будущее время ποιήσει и риторический характер вопроса; ἄνθρωπος передан собирательно-родовым словом «человек», которое в русском естественно включает любого человека.
theological_decisions:
- issue: Родовое значение ἄνθρωπος
  choice: человек
  alternative: кто-либо; человеческое существо
  rationale: Русское «человек» естественно передаёт единичное родовое значение без указания исключительно на мужчину и не требует пояснительной сноски.
- issue: Значение риторического будущего ποιήσει
  choice: Что сделает мне человек?
  alternative: Что может сделать мне человек?
  rationale: Основной текст сохраняет грамматическое будущее исходника и присущую вопросу риторическую силу, не заменяя её явно выраженной модальностью возможности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, цитатно-псалмическим звучанием. Формула «не убоюсь» сохраняет достоинство и связь с ветхозаветной цитатой, оставаясь понятной современному читателю.
