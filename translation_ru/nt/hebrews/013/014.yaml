revisions:
- from: Ведь здесь у нас нет города, который пребывает, но мы ищем грядущий.[a]
  to: Ибо нет у нас здесь постоянного города, но мы ищем будущий.[a]
  rationale: «Постоянного» передаёт длительно-пребывающий характер μένουσαν без неестественной двусмысленности «который пребывает». «Будущий» сохраняет отсылку τὴν μέλλουσαν к πόλιν, не уточняя образ города богословским истолкованием. Сноска исправлена для естественного русского употребления и сохранения буквальной альтернативы.
