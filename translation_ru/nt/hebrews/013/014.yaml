  text: οὐ γὰρ ἔχομεν ὧδε μένουσαν πόλιν, ἀλλὰ τὴν μέλλουσαν ἐπιζητοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/014.yaml
  text: For we do not have a lasting city here[a], but we seek the one that is to come.
translation:
  language: ru
  text: Ибо нет у нас здесь постоянного города, но мы ищем будущий.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грядущий город»; буквально: «город, который придёт».'
    reason: Лексическая альтернатива для τὴν μέλλουσαν; в греческом подразумевается ранее названное слово «город».
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Ведь ... нет
  rationale: «Ведь» естественно передаёт пояснительную связь γάρ с предшествующим призывом; отрицание οὐ выражено конструкцией «нет».
- source_word: ἔχομεν
  choice: у нас ... нет
  rationale: Русская конструкция «у нас нет» естественно передаёт отрицательное οὐ ἔχομεν («мы не имеем»), не меняя смысла.
- source_word: ὧδε
  choice: здесь
  rationale: Сохраняется непосредственное указательное значение наречия; вариант «на земле» был бы более толковательным.
- source_word: μένουσαν
  choice: который пребывает
  rationale: Причастие настоящего времени описывает город как остающийся, устойчивый, непреходящий. «Пребывает» сохраняет длительный смысл и достойный библейский регистр.
- source_word: πόλιν
  choice: города
  rationale: Конкретный образ города сохранён без замены толкованиями вроде «родина» или «небеса».
- source_word: ἀλλὰ
  choice: но
  rationale: Передаёт прямое противопоставление нынешнего отсутствия пребывающего города и устремлённости к грядущему.
- source_word: τὴν μέλλουσαν
  choice: грядущий
  rationale: Субстантивированное причастие женского рода отсылает к πόλιν. В русском повтор подразумеваемого слова естественно передаётся согласованным прилагательным «грядущий», сохраняя будущую направленность.
- source_word: ἐπιζητοῦμεν
  choice: мы ищем
  rationale: «Ищем» ясно и естественно передаёт целенаправленное стремление; более сильное «усердно ищем» возможно, но добавило бы явное наречие.
theological_decisions:
- issue: Характер образа «города»
  choice: Сохранить слово «город» и противопоставление пребывающего здесь города грядущему.
  alternative: Передать как «небеса», «небесный город» или «небесный Иерусалим».
  rationale: Сам стих не называет город небесами или Иерусалимом. Буквенный образ сохраняет связь с более широким богословием Послания к Евреям, не подменяя перевод его истолкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Пребывает» выбрано вместо разговорного «остаётся навсегда», чтобы сохранить лаконизм и аспектуальную открытость греческого причастия; «грядущий» понятно в религиозном контексте и создаёт точный контраст.
