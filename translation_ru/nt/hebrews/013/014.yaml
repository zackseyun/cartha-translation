    rationale: Формально она отражает значение μέλλουσαν, но русское выражение создаёт неудачный образ города, который сам должен прийти. Лучше дать «грядущий город» и «город, который придёт» как буквальные альтернативы.
  revised_text: Ибо нет у нас здесь постоянного города, но мы ищем будущий.[a]
