  source_fidelity: 'Смысловая структура оригинала передана верно: пояснительное γάρ, отрицание наличия постоянного города «здесь», контраст ἀλλά и поиск будущего города сохранены. Однако «город, который пребывает» в русском может обозначать город, который где-то находится или проживает, и неясно выражает значение μένουσαν — «постоянный, пребывающий, непреходящий».'
  naturalness: Предлагаемая замена делает фразу естественной для современного литературного русского и сохраняет сдержанно библейский регистр. Конструкция «нет у нас здесь постоянного города» ясна и не перегружена относительным придаточным.
  terminology: «Город» точно передаёт πόλις и не подменяет образ словами «небо» или «Иерусалим». «Будущий» естественно передаёт субстантивированное τὴν μέλλουσαν с подразумеваемым «город»; сноска отмечает допустимые более буквальные варианты.
