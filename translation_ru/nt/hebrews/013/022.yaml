source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως, καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/022.yaml
  text: I urge you[a], brothers, bear with this word of exhortation[b], for I have written to you briefly.
translation:
  language: ru
  text: Прошу вас, братья[a], отнеситесь с терпением к этому слову увещания[b], ведь я написал вам кратко.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; греческое слово буквально означает «братья», но может включать всю общину.'
    reason: lexical_alternative
  - marker: b
    text: «Слово увещания» можно также перевести как «слово ободрения».
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Прошу
  rationale: В данном личном обращении глагол выражает настоятельную просьбу; «прошу» естественно звучит по-русски и не придаёт фразе излишне властного тона.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Частица обозначает мягкий переход к заключительной просьбе; в современном русском такой переход естественно передаётся самим построением фразы, без добавления «теперь» или сильного противопоставления.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохранена грамматически мужская форма обращения; возможное включение всей общины пояснено в сноске.
- source_word: ἀνέχεσθε
  choice: терпеливо примите
  rationale: Глагол призывает снисходительно и терпеливо отнестись к сказанному. Такое сочетание передаёт принятие послания и звучит естественнее, чем буквальное «терпите».
- source_word: τοῦ λόγου τῆς παρακλήσεως
  choice: это слово увещания
  rationale: λόγος обозначает высказанное послание, а παράκλησις сочетает оттенки увещания, призыва и ободрения. «Это» естественно указывает на настоящее послание, хотя отдельного указательного местоимения в греческом нет.
- source_word: καὶ γὰρ
  choice: ведь
  rationale: Сочетание вводит обоснование просьбы; русское «ведь» кратко и естественно передаёт объяснительную силу частиц.
- source_word: διὰ βραχέων
  choice: кратко
  rationale: Идиома означает «кратко», «в немногих словах».
- source_word: ἐπέστειλα ὑμῖν
  choice: я написал вам
  rationale: В эпистолярном контексте глагол обозначает письменное обращение к адресатам; русский совершенный вид естественно передаёт аорист.
theological_decisions:
- issue: Состав адресатов обращения ἀδελφοί
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет выраженную в греческом мужскую форму, не исключая возможного обращения ко всей смешанной общине; инклюзивное понимание отмечено в сноске.
- issue: Смысл παράκλησις
  choice: увещание
  alternative: ободрение
  rationale: Контекст допускает как призыв и наставление, так и ободрение. Основной текст выбирает традиционно понятное «увещание», а смысловая широта сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык; тон уважительный, тёплый и настоятельный. Синтаксис сохраняет последовательность личной просьбы и её краткого обоснования.
