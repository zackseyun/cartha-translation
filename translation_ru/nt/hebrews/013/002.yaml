  text: τῆς φιλοξενίας μὴ ἐπιλανθάνεσθε, διὰ ταύτης γὰρ ἔλαθόν τινες ξενίσαντες ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/002.yaml
  text: Do not neglect hospitality[a], for through it some have entertained angels without knowing it.
translation:
  language: ru
  text: Не забывайте о гостеприимстве, ведь некоторые, проявив его, сами того не зная, приняли у себя ангелов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приняли у себя посланников, сами того не зная». Греческое слово может означать как «ангелов», так и «посланников», однако вероятная отсылка к повествованиям об Аврааме и Лоте (Быт. 18–19) лучше согласуется со значением «ангелы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοξενίας
  choice: гостеприимстве к незнакомым людям
  rationale: Существительное обозначает радушный приём чужих или незнакомых людей. Уточнение сохраняет смысловой компонент ξένος, который в одном слове «гостеприимство» может быть не вполне заметен.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: Не забывайте
  rationale: Настоящий императив с отрицанием призывает постоянно помнить об этой обязанности и не оставлять её без исполнения. Естественная русская формулировка сохраняет как прямое значение «забывать», так и практический оттенок пренебрежения.
- source_word: διὰ ταύτης
  choice: благодаря ему
  rationale: Местоимение относится к гостеприимству, а διά с родительным падежом обозначает средство или обстоятельство, посредством которого произошло последующее.
- source_word: ἔλαθόν ... ξενίσαντες
  choice: сами того не зная, приняли у себя
  rationale: Конструкция λανθάνω с причастием означает совершить действие, не осознавая его. «Приняли у себя» естественно передаёт размещение и радушный приём гостей, не создавая современного значения слова «развлекали».
- source_word: τινες
  choice: некоторые
  rationale: Точно и естественно передаёт неопределённое местоимение во множественном числе.
- source_word: ἀγγέλους
  choice: ангелов
  rationale: Хотя слово может означать также посланников, вероятная отсылка к повествованиям Бытия 18–19 указывает здесь на небесных вестников; лексическая альтернатива сохранена в сноске.
theological_decisions:
- issue: Значение ἀγγέλους
  choice: ангелов в сверхъестественном смысле
  alternative: человеческих посланников
  rationale: Вероятная отсылка к Аврааму и Лоту, принимавшим небесных посетителей, делает «ангелов» наиболее уместным основным вариантом. Поскольку само греческое слово допускает значение «посланники», эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным увещательным тоном. Формулировка «гостеприимство к незнакомым людям» раскрывает заложенную в φιλοξενία направленность на чужих и странников; «приняли у себя» избегает двусмысленного современного значения «развлекали».
