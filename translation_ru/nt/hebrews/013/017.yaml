source:
  edition: SBLGNT
  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
translation:
  language: ru
  text: Прислушивайтесь[a] к своим руководителям и уступайте им, ведь они бодрствуют, заботясь о ваших душах, как те, кому предстоит дать отчёт, чтобы они делали это с радостью, а не со стоном, ибо это было бы вам неполезно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Повинуйтесь своим руководителям». Греческое Πείθεσθε может означать «повинуйтесь», но буквально связано со значением «быть убеждаемыми», «позволять себя убеждать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πείθεσθε
  choice: Прислушивайтесь
  rationale: Форма может означать как готовность быть убеждёнными и доверительно внимать, так и, в расширенном смысле, повиноваться. «Прислушивайтесь» передаёт отзывчивое доверие, не сводя призыв к безусловному исполнению приказов; традиционное «повинуйтесь» сохранено в сноске.
- source_word: ἡγουμένοις
  choice: руководителям
  rationale: Причастие обозначает признанных руководителей общины. Современное «руководители» естественно передаёт их роль, не усиливая властный оттенок.
- source_word: ὑπείκετε
  choice: уступайте им
  rationale: Глагол означает уступать, давать дорогу, проявлять готовность подчиниться. «Уступайте» сохраняет отличие от Πείθεσθε и не сливает два призыва в один.
- source_word: ἀγρυπνοῦσιν
  choice: бодрствуют
  rationale: Слово буквально связано с неусыпной бдительностью. «Бодрствуют» сохраняет образ внимательного надзора и заботы.
- source_word: ὑπὲρ τῶν ψυχῶν ὑμῶν
  choice: ради ваших душ
  rationale: ψυχή может обозначать душу, жизнь или самого человека. «Души» сохраняет духовную значимость выражения, а ὑπέρ передано как «ради», указывая, в чьих интересах совершается бдение.
- source_word: ὡς λόγον ἀποδώσοντες
  choice: как те, кому предстоит дать отчёт
  rationale: Передана будущая ответственность руководителей; формулировка сохраняет сравнительно-характеризующее ὡς и не добавляет прямо не названного адресата отчёта.
- source_word: μετὰ χαρᾶς
  choice: с радостью
  rationale: Прямое и естественное соответствие греческому предложному обороту.
- source_word: στενάζοντες
  choice: стеная
  rationale: Сохраняется конкретный образ стенания или тяжёлых вздохов, а не более отвлечённое понятие печали.
- source_word: ἀλυσιτελὲς
  choice: не будет пользы
  rationale: Прилагательное означает «невыгодное, бесполезное, не приносящее пользы». Русская конструкция естественна и не усиливает смысл до прямого вреда.
theological_decisions:
- issue: Характер призыва по отношению к руководителям общины
  choice: Призыв к доверительной восприимчивости и готовности уступать признанным руководителям, которые сами подотчётны.
  alternative: Категорическое или безусловное повиновение руководителям.
  rationale: Сочетание Πείθεσθε и ὑπείκετε требует реального отклика и уступчивости, однако не обязывает усиливать текст до абсолютного повиновения. Основанием призыва служит бдительная забота руководителей и предстоящий им отчёт.
- issue: Неявный адресат будущего отчёта
  choice: 'Не называть адресата прямо: «кому предстоит дать отчёт».'
  alternative: Добавить «Богу».
  rationale: Ответственность перед Богом естественно подразумевается контекстом, но в самом греческом предложении адресат отчёта не выражен; перевод сохраняет эту формальную сдержанность.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизмов. «Бодрствуют» и «души» сохраняют библейскую образность, оставаясь понятными; «не будет пользы» звучит естественнее буквального «невыгодно».
