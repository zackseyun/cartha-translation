  text: τίμιος ὁ γάμος ἐν πᾶσιν καὶ ἡ κοίτη ἀμίαντος, πόρνους ⸀γὰρ καὶ μοιχοὺς κρινεῖ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
translation:
  language: ru
  text: Брак да будет у всех в чести[a][b], и супружеское ложе — неосквернённым, потому что Бог будет судить тех, кто предаётся половой распущенности, и прелюбодеев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Брак у всех в чести». В первой части греческого предложения нет явно выраженного глагола, поэтому её можно понимать и как призыв, и как утверждение.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «всеми» вместо «у всех».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμιος
  choice: в чести
  rationale: Передаёт значение почитаемого и ценного, сохраняя оттенок общественного уважения и естественно сочетаясь с увещательной конструкцией «да будет».
- source_word: γάμος
  choice: брак
  rationale: Здесь речь идёт о браке как союзе и состоянии, а не о свадебном торжестве.
- source_word: ἐν πᾶσιν
  choice: у всех
  rationale: Форма допускает понимание «среди всех» или «всеми». Выражение «у всех в чести» естественно по-русски передаёт широкий круг людей, не сужая его до отдельной группы; вариант с явным значением действующего лица дан в сноске.
- source_word: κοίτη
  choice: супружеское ложе
  rationale: Буквально означает «ложе» и метонимически указывает на половые отношения; связь с браком делает «супружеское ложе» ясным и уместным торжественному регистру.
- source_word: ἀμίαντος
  choice: неосквернённым
  rationale: Сохраняет нравственный и сакральный оттенок значения «незапятнанный, чистый».
- source_word: πόρνους
  choice: тех, кто предаётся половой распущенности
  rationale: Передаёт широкую категорию недозволенного полового поведения, не сужая её до одного конкретного проступка и избегая архаичного или неоднозначного существительного.
- source_word: μοιχούς
  choice: прелюбодеев
  rationale: Точно обозначает тех, кто нарушает супружескую верность, и сохраняет различие с более широким πόρνους.
- source_word: κρινεῖ
  choice: будет судить
  rationale: Будущее время сохранено; перевод не усиливает κρίνω до «осудит», поскольку исход суда самим глаголом прямо не выражен.
- source_word: γάρ
  choice: потому что
  rationale: Ясно передаёт обоснование предшествующего увещания в естественной современной русской речи.
theological_decisions:
- issue: Понимать ли начальную безглагольную конструкцию как утверждение или как увещание
  choice: 'Увещание: «Брак да будет у всех в чести»'
  alternative: 'Утверждение: «Брак у всех в чести»'
  rationale: В греческом тексте нет выраженной формы глагола, поэтому грамматически возможны оба прочтения. Последовательность кратких нравственных наставлений в Евр 13 поддерживает увещательное понимание; подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим наставительному тону Послания. Конструкция «да будет» несколько возвышенна, но общеупотребительна и позволяет передать подразумеваемое увещание; выражение «половая распущенность» ясно современному читателю и сохраняет широту исходного понятия.
