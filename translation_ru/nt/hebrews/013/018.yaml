  text: Προσεύχεσθε περὶ ἡμῶν, ⸀πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/018.yaml
  text: Pray for us[a], for we are convinced that we have a good conscience[c][b], since we want to conduct ourselves well in everything.
translation:
  language: ru
  text: Молитесь о нас, ведь мы убеждены, что у нас добрая совесть, желая во всём вести себя достойно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь мы уверены, что у нас чистая совесть, поскольку хотим во всём поступать хорошо».'
    reason: Передаёт допустимые оттенки πειθόμεθα, καλὴν συνείδησιν и возможное причинное понимание причастия θέλοντες.
lexical_decisions:
- source_word: Προσεύχεσθε
  choice: Молитесь
  rationale: Настоящее повелительное наклонение во 2-м лице множественного числа естественно передаётся русским «молитесь»; длительность действия возможна по виду, но не требует добавления «постоянно».
- source_word: περὶ ἡμῶν
  choice: о нас
  rationale: При глаголе молитвы περί с родительным естественно означает предмет молитвы; по-русски нормативно «молиться о ком-либо».
- source_word: πειθόμεθα
  choice: мы убеждены
  rationale: Передаёт когнитивную силу формы и устойчивую уверенность авторов, не сводя её к простому субъективному чувству.
- source_word: καλὴν συνείδησιν
  choice: добрая совесть
  rationale: Близко сохраняет широкое значение прилагательного καλός; «чистая совесть» было бы более узким истолкованием.
- source_word: ἐν πᾶσιν
  choice: во всём
  rationale: Естественное современное русское наречное выражение, сохраняющее всеохватность греческой фразы.
- source_word: καλῶς
  choice: достойно
  rationale: В этическом контексте передаёт не просто умелое, а хорошее, надлежащее поведение; буквальное «хорошо» по-русски менее выразительно.
- source_word: θέλοντες
  choice: мы хотим
  rationale: Передаёт продолжающееся намерение или желание авторов; личная конструкция звучит естественно в современном русском.
- source_word: ἀναστρέφεσθαι
  choice: вести себя
  rationale: Обычное современное выражение для образа поведения; сохраняет этическую направленность глагола без архаичного «поступать» в узком смысле отдельных действий.
theological_decisions:
- issue: Связь заключительного причастного оборота с утверждением о доброй совести
  choice: 'Соединено через «и что»: «убеждены, что у нас добрая совесть и что мы хотим…»'
  alternative: 'Причинное прочтение: «поскольку хотим во всём вести себя достойно»'
  rationale: Греческое θέλοντες формально не обозначает однозначно причинную связь. Координированная русская конструкция сохраняет смысловую близость намерения и доброй совести, но не утверждает, что одно непременно служит причиной или доказательством другого.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Добрая совесть» сохраняет формальную близость оригиналу, а «вести себя достойно» естественно выражает этический смысл καλῶς ἀναστρέφεσθαι. Сноска отмечена в основном тексте.
