  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
translation:
  language: ru
  text: Помните ваших руководителей, которые возвещали вам слово Божье. Размышляя об итоге их образа жизни[b], подражайте их вере[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верности». Греческое слово может означать как веру, так и верность; в основном тексте оно передано принятым в проекте словом «вера».'
    reason: alternative_reading
  - marker: b
    text: «Итог» можно также перевести как «конец» или «исход»; согласно некоторым толкованиям, речь может идти о том, как они умерли.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: Помните
  rationale: Настоящее повелительное наклонение предполагает продолжающееся памятование; русское «помните» естественно передаёт призыв постоянно держать их в памяти.
- source_word: τῶν ἡγουμένων ὑμῶν
  choice: ваших наставников
  rationale: Выражение обозначает признанных руководителей общины. «Наставники» естественно в данном контексте, подчёркивает их духовно-учительную роль и не придаёт слову политического оттенка.
- source_word: οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  choice: которые говорили вам слово Божье
  rationale: Сохраняет прямое значение λαλέω и привычное библейское выражение «слово Божье», не усиливая глагол до более узкого «проповедовали».
- source_word: ἀναθεωροῦντες
  choice: Вдумываясь
  rationale: Причастие передаёт внимательное наблюдение и осмысление, а не беглый взгляд; деепричастная форма сохраняет связь с главным повелением.
- source_word: τὴν ἔκβασιν
  choice: итог
  rationale: «Итог» охватывает результат или завершение жизненного пути, не утверждая однозначно, что речь именно о смерти или мученичестве.
- source_word: τῆς ἀναστροφῆς
  choice: их жизни
  rationale: В сочетании с ἔκβασις слово означает образ или течение жизни. Краткое русское выражение «итог их жизни» естественно и включает как поведение, так и жизненный путь.
- source_word: μιμεῖσθε
  choice: подражайте
  rationale: Прямо и ясно передаёт повелительное наклонение и идею следования примеру.
- source_word: τὴν πίστιν
  choice: их вере
  rationale: Основное значение передано как «вера» согласно проектному подходу; возможное значение «верность» сохранено в примечании.
theological_decisions:
- issue: Значение πίστις применительно к качеству, которому следует подражать
  choice: вера
  alternative: верность
  rationale: Оба значения допустимы в контексте. Основной текст сохраняет обычную передачу πίστις как «вера», а примечание не устраняет возможного смысла «верность».
- issue: Указывает ли ἔκβασις именно на смерть или мученичество наставников
  choice: итог
  alternative: конец; в некоторых толкованиях — то, как они умерли
  rationale: Греческое слово может обозначать итог, исход или завершение. Нейтральное «итог» не вносит в текст конкретного исторического утверждения о мученической смерти.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Формулировка лаконична и понятна широкому читателю; двусмысленность πίστις и широта значения ἔκβασις сохранены посредством примечаний.
