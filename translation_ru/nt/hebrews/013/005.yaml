  text: ἀφιλάργυρος ὁ τρόπος· ἀρκούμενοι τοῖς παροῦσιν· αὐτὸς γὰρ εἴρηκεν· Οὐ μή σε ἀνῶ οὐδ’ οὐ μή σε ⸀ἐγκαταλίπω·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/005.yaml
  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
translation:
  language: ru
  text: 'Пусть ваш образ жизни будет свободен от любви к деньгам; довольствуйтесь тем, что у вас есть.[a] Ведь Он Сам сказал: «Я никогда не оставлю тебя[b] и ни за что тебя не покину».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «довольствуясь тем, что есть налицо». Речь может идти как о нынешнем имуществе, так и о данных обстоятельствах.'
    reason: lexical_alternative
  - marker: b
    text: Эти слова перекликаются с ветхозаветными заверениями Божьей верности, особенно со Второзаконием 31:6, 8 и Иисусом Навином 1:5.
    reason: cross_reference
lexical_decisions:
- source_word: ἀφιλάργυρος
  choice: свободен от любви к деньгам
  rationale: Передаёт конкретное значение прилагательного — отсутствие привязанности к деньгам, не расширяя его до жадности вообще.
- source_word: ὁ τρόπος
  choice: ваш образ жизни
  rationale: В данном контексте τρόπος означает образ жизни или поведение; притяжательное «ваш» естественно выражает обращённое к читателям наставление.
- source_word: ἀρκούμενοι
  choice: довольствуйтесь
  rationale: Причастие имеет увещательный оттенок и описывает устойчивое довольство; повелительная форма звучит естественно по-русски и сохраняет связь с первым наставлением.
- source_word: τοῖς παροῦσιν
  choice: тем, что у вас есть
  rationale: Идиоматично передаёт буквально «наличное, присутствующее», включая нынешние средства и обстоятельства, без неестественного буквализма.
- source_word: αὐτὸς γὰρ εἴρηκεν
  choice: Ведь Он Сам сказал
  rationale: «Сам» сохраняет эмфазу αὐτός, а форма «сказал» в русском естественно выражает сохраняющую силу приведённого обещания. Местоимение оставлено без вставки отсутствующего в греческом слова «Бог».
- source_word: Οὐ μή σε ἀνῶ
  choice: Я никогда не оставлю тебя
  rationale: Сильное отрицание οὐ μή передано словом «никогда»; «оставлю» естественно для данного обетования.
- source_word: οὐδ’ οὐ μή σε ἐγκαταλίπω
  choice: и ни за что тебя не покину
  rationale: «Ни за что» передаёт усиленное отрицание, а «покину» — значение оставления или оставления на произвол судьбы; различие с первым глаголом частично сохранено.
theological_decisions:
- issue: Кто говорит в цитате
  choice: Сохранить местоимение «Он Сам», не добавляя в основной текст слово «Бог».
  alternative: «Ведь Сам Бог сказал»
  rationale: Из контекста ясно, что говорящий — Бог, однако в греческом стоит αὐτός, а не θεός. Местоимение сохраняет формальную особенность источника и не делает неявное явным.
- issue: Усиленные отрицания в обетовании
  choice: «Я никогда не оставлю тебя и ни за что тебя не покину»
  alternative: «Я не оставлю тебя и не покину»
  rationale: Две конструкции οὐ μή выражают особо сильное заверение. «Никогда» и «ни за что» передают эту силу естественным современным русским языком без искусственного повторения отрицаний.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Синтаксис упрощён до двух согласованных увещаний; прописное «Он» служит ясности референции, не вставляя имени говорящего. Все маркеры сносок присутствуют в основном тексте.
