  text: δι’ αὐτοῦ ⸀οὖν ἀναφέρωμεν θυσίαν αἰνέσεως διὰ παντὸς τῷ θεῷ, τοῦτ’ ἔστιν καρπὸν χειλέων ὁμολογούντων τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/015.yaml
  text: Therefore[a], through him let us continually offer up to God a sacrifice of praise—that is[c][b], the fruit of lips confessing his name.
translation:
  language: ru
  text: Итак, будем через Него непрестанно[a] приносить Богу жертву хвалы, то есть плод уст[b], исповедующих[c] Его имя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «постоянно»; «во всякое время».'
    reason: lexical_alternative
  - marker: b
    text: 'Некоторые переводы: «плод наших уст»; слово «наших» в греческом тексте прямо не выражено.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «признающих». Греческий глагол может обозначать открытое исповедание или признание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: через Него
  rationale: Предлог διά с родительным падежом выражает посредство или средство. Формулировка сохраняет контекстуальный смысл принесения хвалы Богу через Христа, не заменяя местоимение поясняющим именем.
- source_word: οὖν
  choice: итак
  rationale: Частица вводит вывод из предшествующего рассуждения; «итак» естественно передаёт эту логическую связь.
- source_word: ἀναφέρωμεν
  choice: будем ... приносить
  rationale: Побудительный конъюнктив первого лица множественного числа передан совместным призывом. Глагол «приносить» сохраняет связь с языком жертвоприношения.
- source_word: θυσίαν αἰνέσεως
  choice: жертву хвалы
  rationale: Сохраняет жертвенный образ и ветхозаветную словесную связь, оставаясь естественным выражением на русском языке.
- source_word: διὰ παντός
  choice: непрестанно
  rationale: Передаёт значение постоянства действия — «постоянно, во всякое время» — и хорошо сочетается с призывом.
- source_word: τῷ θεῷ
  choice: Богу
  rationale: Дательный падеж обозначает получателя приношения; русская беспредложная форма естественна при глаголе «приносить».
- source_word: τοῦτ’ ἔστιν
  choice: то есть
  rationale: Вводит пояснение того, в чём состоит названная жертва хвалы.
- source_word: καρπὸν χειλέων
  choice: плод уст
  rationale: Сохраняет метафору и её библейский фон. Притяжательное «наших» не добавлено, поскольку в греческом тексте его нет.
- source_word: ὁμολογούντων
  choice: исповедующих
  rationale: Причастие обозначает открытое исповедание или признание. «Исповедующих» сохраняет смысл публичного признания и не сужает его до благодарения или восхваления.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: Его имя
  rationale: После русского глагола «исповедовать» винительный падеж звучит естественно и передаёт смысл открытого признания Божьего имени.
theological_decisions:
- issue: К кому относится местоимение в δι’ αὐτοῦ
  choice: Местоимение сохранено как «через Него»; в контексте оно относится к Христу и выражает Его посредничество.
  alternative: 'Прямо уточнить: «через Иисуса» или «через Христа».'
  rationale: Ближайший контекст указывает на Иисуса, однако сам стих употребляет местоимение. Его сохранение передаёт посреднический смысл, не добавляя отсутствующего в данной фразе имени.
- issue: Сила жертвенной образности
  choice: Сохранены выражения «приносить» и «жертву хвалы».
  alternative: 'Передать обобщённо: «будем хвалить Бога».'
  rationale: Автор намеренно описывает хвалу языком жертвоприношения. Сохранение образа поддерживает связь с предшествующей темой жертвы, не вводя дополнительных конфессиональных толкований.
- issue: Значение ὁμολογούντων
  choice: «исповедующих» — открыто признающих Его имя.
  alternative: «признающих», «прославляющих» или «благодарящих».
  rationale: Греческое слово допускает оттенок признания, но не требует сводить действие только к прославлению или благодарению. Основной текст сохраняет традиционно понятный и достаточно широкий глагол, а альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и библейской жертвенной образности. Порядок слов сделан естественным для русского языка; выражение «плод уст» сохранено как намеренная поэтическая метафора. Все сноски привязаны к соответствующим словам основного текста.
