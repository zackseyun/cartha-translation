  footnotes:
  - marker: a
    text: 'Или: «Иисус Христос вчера и сегодня тот же — и вовеки». Греческий титул Χριστός можно передать как «Христос» или перевести как «Мессия».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Традиционная и общепринятая русская форма личного имени.
- source_word: Χριστὸς
  choice: Мессия
  rationale: Передано значение греческого титула, соответствующего «Помазаннику»; вариант «Христос» отмечен в сноске как традиционная транслитерационная форма.
- source_word: ἐχθὲς
  choice: вчера
  rationale: Прямое соответствие временному наречию, сохраняющее ритмический ряд.
- source_word: σήμερον
  choice: сегодня
  rationale: Прямое соответствие временному наречию в параллели со «вчера» и «вовеки».
- source_word: ὁ αὐτός
  choice: тот же
  rationale: Естественная русская передача греческого выражения неизменной тождественности; связка настоящего времени в русском не требуется.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Краткая, литературная и устойчивая русская передача значения «навсегда, во все века», сохраняющая торжественный регистр.
- source_word: καὶ ... καὶ ... καὶ
  choice: и ... и ... — и
  rationale: Повтор союзов в основном сохранён; тире естественно выделяет заключительный, неограниченный временной горизонт.
theological_decisions:
- issue: Христологический смысл утверждения о постоянстве Иисуса
  choice: 'Передать утверждение прямо: Иисус Мессия остаётся тем же вчера, сегодня и вовеки.'
  alternative: Развернуть фразу в явное учение о неизменности или божественности Христа.
  rationale: Греческий текст утверждает постоянство личности Иисуса во времени, но не формулирует здесь расширенного догматического объяснения.
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: «Мессия» раскрывает титульное значение слова, не превращая его в подобие фамилии; традиционный вариант «Христос» сохранён в сноске.
translation_notes:
  register: Современный литературный русский с кратким, возвышенным ритмом. Нулевая связка в настоящем времени естественна для русского языка; «вовеки» сохраняет достоинство и лаконизм исходной формулы.
