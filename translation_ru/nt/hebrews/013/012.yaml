  text: διὸ καὶ Ἰησοῦς, ἵνα ἁγιάσῃ διὰ τοῦ ἰδίου αἵματος τὸν λαόν, ἔξω τῆς πύλης ἔπαθεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/012.yaml
  text: Therefore Jesus also suffered outside the gate[b][a], so that he might sanctify the people through his own blood.
translation:
  language: ru
  text: Поэтому и Иисус, чтобы освятить народ собственной кровью, пострадал за воротами[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделать святым»; или: «посвятить Богу».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «за воротами», вероятно, указывает на место вне Иерусалима, где пострадал Иисус, и перекликается с предшествующим упоминанием о сожжении останков жертвенных животных вне стана.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт вывод, следующий из предшествующего рассуждения о жертвенных останках, выносимых за стан.
- source_word: καὶ
  choice: и
  rationale: Связывает страдание Иисуса с только что упомянутым жертвенным прообразом; русское «и» естественно передаёт присоединительно-сопоставительное значение.
- source_word: ἵνα ἁγιάσῃ
  choice: чтобы освятить
  rationale: Передаёт целевое значение ἵνα с аористом сослагательного наклонения и сохраняет культово-богословский смысл глагола ἁγιάζω.
- source_word: διὰ τοῦ ἰδίου αἵματος
  choice: Своей собственной кровью
  rationale: Творительный падеж естественно выражает средство действия в русском языке, а «собственной» сохраняет усилительное значение ἰδίου.
- source_word: τὸν λαόν
  choice: народ
  rationale: Сохраняет определённое, но не развёрнутое обозначение народа, не добавляя отсутствующего в греческом тексте уточнения «Божий».
- source_word: ἔξω τῆς πύλης
  choice: за воротами
  rationale: Естественное русское обозначение места вне городских ворот; множественное число нормативно для русского слова «ворота», хотя греческое πύλη стоит в единственном числе.
- source_word: ἔπαθεν
  choice: пострадал
  rationale: Прямо и лаконично передаёт аорист πάσχω и сохраняет связь со страданиями Иисуса.
theological_decisions:
- issue: Передача ἁγιάζω в жертвенном контексте
  choice: освятить
  alternative: сделать святым; посвятить Богу
  rationale: «Освятить» сохраняет культовый и заветный оттенок Послания к евреям, не сводя смысл только к нравственному изменению и не закрепляя узкое конфессиональное толкование.
- issue: Объём значения τὸν λαόν
  choice: народ
  alternative: народ Божий
  rationale: Контекст подразумевает Божий народ, однако в греческом тексте нет слова «Божий», поэтому это уточнение не внесено в основной текст.
- issue: Связь крови и страдания
  choice: чтобы освятить народ Своей собственной кровью, пострадал
  alternative: пострадал, чтобы Своей собственной кровью освятить народ
  rationale: Порядок компонентов близок к греческому и ясно связывает кровь со средством освящения, а страдание — с целью; при этом не уточняется сверх текста, каким именно образом кровь соотносится со страданием.
translation_notes:
  register: Современный литературный русский язык с достоинством богословского текста. «Своей» написано с прописной буквы согласно распространённой русской библейской традиции уважительного обозначения Иисуса. Порядок маркеров [b][a] сохранён в соответствии с предоставленным английским консультационным слоем; оба маркера присутствуют в основном тексте.
