  text: γινώσκετε τὸν ἀδελφὸν ⸀ἡμῶν Τιμόθεον ἀπολελυμένον, μεθ’ οὗ ἐὰν τάχιον ἔρχηται ὄψομαι ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/023.yaml
  text: Know that our brother Timothy has been released[a], with whom I will see you if he comes soon.
translation:
  language: ru
  text: Знайте, что наш брат Тимофей освобождён[a]. Если он вскоре придёт, я увижу вас вместе с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отпущен». Возможно, речь идёт об освобождении из заключения; глагол может также означать, что Тимофея «отправили» или «отпустили».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: Знайте
  rationale: Настоящее повелительное наклонение во множественном числе передаёт прямое уведомление адресатов; «Знайте» кратко и сохраняет побудительную силу.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: наш брат
  rationale: Естественное для раннехристианского общения семейное обозначение; здесь относится непосредственно к Тимофею.
- source_word: Τιμόθεον
  choice: Тимофей
  rationale: Традиционная и общеупотребительная русская форма личного имени.
- source_word: ἀπολελυμένον
  choice: освобождён
  rationale: Перфектное страдательное причастие указывает на завершившееся действие с сохраняющимся результатом. В данном контексте вероятнее всего имеется в виду освобождение из-под стражи, но лексически возможны и другие значения, отмеченные в сноске.
- source_word: μεθ’ οὗ
  choice: вместе с ним
  rationale: Русская конструкция естественно связывает предполагаемое прибытие Тимофея с будущей встречей автора и адресатов.
- source_word: ἐὰν τάχιον ἔρχηται
  choice: если он вскоре придёт
  rationale: Передаёт условность ἐάν с сослагательным наклонением и контекстуальное значение сравнительной формы τάχιον — «скоро, достаточно скоро».
- source_word: ὄψομαι ὑμᾶς
  choice: я увижу вас
  rationale: Прямо передаёт будущее значение ὁράω, не заменяя его более толковательным «навещу».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным эпистолярным тоном. Разделение на два предложения устраняет тяжеловесность греческой конструкции, не меняя её логики. Подлежащее условной части («он») однозначно указывает на Тимофея.
