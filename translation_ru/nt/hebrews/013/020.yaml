  - severity: low
    issue: Формулировка альтернативы в сноске
    rationale: «В силу крови» несколько истолковывает значение и создаёт впечатление отдельного, более определённого варианта. Сноска должна нейтрально описывать две возможные синтаксические связи без подмены оборота.
  - severity: low
