  text: Ὁ δὲ θεὸς τῆς εἰρήνης, ὁ ἀναγαγὼν ἐκ νεκρῶν τὸν ποιμένα τῶν προβάτων τὸν μέγαν ἐν αἵματι διαθήκης αἰωνίου, τὸν κύριον ἡμῶν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/020.yaml
  text: May the God of peace[a], who brought up from the dead our Lord Jesus, the great shepherd of the sheep, by the blood of an eternal covenant,
translation:
  language: ru
  text: Пусть Бог мира, который воскресил из мёртвых великого пастыря овец — нашего Господа Иисуса — через кровь вечного завета,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий оборот допускает несколько синтаксических связей. Его можно отнести к действию Бога: «воскресил из мёртвых ... через кровь вечного завета», либо теснее связать со словами «великий пастырь овец».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ δὲ θεὸς τῆς εἰρήνης
  choice: Пусть Бог мира
  rationale: δέ обозначает переход к заключительной молитве и не требует отдельного русского союза. «Пусть» естественно вводит пожелание, сказуемое которого следует в ст. 21. «Бог мира» сохраняет обычную генитивную конструкцию.
- source_word: ὁ ἀναγαγὼν ἐκ νεκρῶν
  choice: Который воскресил из мёртвых
  rationale: В контексте ἀνάγω обозначает возвращение Иисуса из состояния смерти. «Воскресил из мёртвых» ясно и естественно передаёт смысл, хотя не воспроизводит буквально пространственный образ «вывел/поднял».
- source_word: τὸν ποιμένα τῶν προβάτων τὸν μέγαν
  choice: великого Пастыря овец
  rationale: Сохранены пастырская метафора, прямое упоминание овец и усилительное определение «великий».
- source_word: ἐν αἵματι
  choice: через кровь
  rationale: ἐν допускает инструментальное или связующее понимание. «Через кровь» естественно выражает средство или основание, не уточняя механизм действия.
- source_word: διαθήκης αἰωνίου
  choice: вечного завета
  rationale: В Послании к евреям διαθήκη последовательно относится к завету; αἰώνιος означает непреходящий, вечный характер этого завета. Русский язык не требует выражать отсутствие артикля неопределённостью.
- source_word: τὸν κύριον ἡμῶν Ἰησοῦν
  choice: нашего Господа Иисуса
  rationale: Приложение прямо отождествляет великого Пастыря с Иисусом, нашим Господом.
theological_decisions:
- issue: Связь оборота ἐν αἵματι διαθήκης αἰωνίου с остальной частью предложения
  choice: 'Оборот отнесён к действию Бога: «через кровь вечного завета воскресил»'
  alternative: 'Оборот можно теснее связать с «великим Пастырем овец»: «великого Пастыря овец в силу крови вечного завета»'
  rationale: Порядок слов и синтаксис греческого допускают оба понимания. Основной текст передаёт наиболее естественную инструментальную связь с воскресением, а примечание сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного благословения. «Пусть» показывает, что предложение продолжается в ст. 21; тире выделяют приложение «нашего Господа Иисуса». Заглавная буква в слове «Пастырь» подчёркивает титульное употребление без добавления отдельного богословского толкования.
