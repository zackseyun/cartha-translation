  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
translation:
  language: ru
  text: и не посредством крови козлов и телят, но посредством Своей собственной крови раз и навсегда вошёл во святилище[a], обретя вечное искупление.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в святые места». Греческое выражение во множественном числе может обозначать святилище; перевод «в Святое святых» был бы более истолковывающим, чем требует сам текст.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: и не
  rationale: Передаёт продолжение мысли предыдущего стиха и отрицание, не превращая связку в самостоятельное «ни».
- source_word: δι’ αἵματος τράγων καὶ μόσχων
  choice: посредством крови козлов и телят
  rationale: διά с родительным выражает средство; «посредством» сохраняет эту связь и не создаёт впечатления, будто речь обязательно идёт о буквальном внесении крови. μόσχων естественно передано как «телят».
- source_word: διὰ δὲ τοῦ ἰδίου αἵματος
  choice: но посредством Своей собственной крови
  rationale: Повтор «посредством» отражает повтор διά и подчёркивает противопоставление крови животных собственной крови Христа; «собственной» передаёт усилительное ἰδίου.
- source_word: ἐφάπαξ
  choice: раз и навсегда
  rationale: Передаёт однократность, окончательность и неповторимость действия в контексте Послания к евреям.
- source_word: εἰς τὰ ἅγια
  choice: во святилище
  rationale: В русском культовом контексте это естественная передача субстантивированного множественного τὰ ἅγια; она не конкретизирует выражение до «Святого святых». Буквальная форма отмечена в сноске.
- source_word: αἰωνίαν λύτρωσιν
  choice: вечное искупление
  rationale: Точно и привычно передаёт искупление, имеющее непреходящую силу.
- source_word: εὑράμενος
  choice: обретя
  rationale: Сохраняет образ исходного глагола «найти/обрести» и причастную связь с главным действием, не добавляя прямо не выраженного получателя искупления.
theological_decisions:
- issue: Значение вхождения Христа посредством собственной крови
  choice: Сохранено инструментальное «посредством собственной крови» без уточнения механизма небесного жертвенного действия.
  alternative: «С собственной кровью», что может подразумевать её буквальное внесение; либо «после пролития крови», что ослабляет значение διά.
  rationale: Повтор διά с родительным создаёт прямое сопоставление крови животных и собственной крови Христа. Перевод сохраняет это сопоставление, не навязывая более подробной модели, чем даёт греческий текст.
- issue: Объём значения τὰ ἅγια
  choice: «во святилище» с указанием буквальной формы в сноске
  alternative: «в святые места» или более узкое «в Святое святых»
  rationale: Греческая форма множественного числа может служить культовым обозначением святилища. «Святое святых» чрезмерно сужает смысл, а буквальное «святые места» звучит по-русски менее естественно и может ошибочно предполагать несколько отдельных мест.
- issue: Отношение Христа к вечному искуплению в εὑράμενος
  choice: «обретя вечное искупление» без добавления получателя
  alternative: «добыв нам вечное искупление» или «совершив вечное искупление»
  rationale: Греческий текст не содержит местоимения «нам» и использует глагол «обрести/получить», а не прямо «совершить». Выбранная формулировка сохраняет эту лаконичность и возможную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством и сохранением культовой лексики. Синтаксис следует греческому противопоставлению, но остаётся понятным обычному читателю; прописное «Своей» употреблено как традиционный русский способ обозначить отнесённость местоимения ко Христу.
