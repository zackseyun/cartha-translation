  text: εἰς δὲ τὴν δευτέραν ἅπαξ τοῦ ἐνιαυτοῦ μόνος ὁ ἀρχιερεύς, οὐ χωρὶς αἵματος, ὃ προσφέρει ὑπὲρ ἑαυτοῦ καὶ τῶν τοῦ λαοῦ ἀγνοημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/007.yaml
  text: But into the second room only the high priest enters once a year[a], and not without blood[b], which he offers for himself and for the people's sins committed in ignorance.
translation:
  language: ru
  text: А во второе отделение[a] раз в год входит один лишь первосвященник — и не без крови, которую он приносит за себя и за грехи народа, совершённые по неведению[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во вторую часть скинии»; речь идёт о внутреннем отделении скинии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «за непреднамеренные грехи народа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν δευτέραν
  choice: а во второе отделение
  rationale: Греческое выражение эллиптично и отсылает ко второй части скинии, названной в ближайшем контексте. «Отделение» естественно передаёт пространственное противопоставление, не уточняя устройство сверх сказанного в тексте.
- source_word: ἅπαξ τοῦ ἐνιαυτοῦ
  choice: раз в год
  rationale: Естественное современное русское соответствие, точно передающее ежегодную периодичность.
- source_word: μόνος ὁ ἀρχιερεύς
  choice: один лишь первосвященник
  rationale: 'Ясно передаёт исключительность: вход разрешён только первосвященнику.'
- source_word: οὐ χωρὶς αἵματος
  choice: и не без крови
  rationale: Сохраняет литоту и явный жертвенный образ исходного текста, не заменяя кровь пояснительным выражением «кровавая жертва».
- source_word: ὃ προσφέρει
  choice: которую он приносит
  rationale: Глагол употреблён в жертвенном смысле; «приносит» естественно звучит по-русски и сохраняет культовый контекст.
- source_word: ὑπὲρ ἑαυτοῦ
  choice: за себя
  rationale: Краткое и естественное русское выражение для жертвенного действия в чью-либо пользу или от чьего-либо имени.
- source_word: τῶν τοῦ λαοῦ ἀγνοημάτων
  choice: за грехи народа, совершённые по неведению
  rationale: ἀγνοήματα обозначает проступки, обусловленные неведением или непреднамеренностью. Перевод сохраняет нравственную характеристику поступков, не сводя их к простому недостатку знаний.
theological_decisions:
- issue: Характер ἀγνοήματα в жертвенном контексте
  choice: грехи народа, совершённые по неведению
  alternative: непреднамеренные грехи народа
  rationale: Формулировка передаёт виновные проступки, связанные с неведением, и сохраняет возможную смысловую широту между незнанием и отсутствием намерения, не вводя более поздних догматических разграничений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет контраст греческого текста, а тире подчёркивает обязательность крови без излишней архаизации.
