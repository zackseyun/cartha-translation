  text: οὐδ’ ἵνα πολλάκις προσφέρῃ ἑαυτόν, ὥσπερ ὁ ἀρχιερεὺς εἰσέρχεται εἰς τὰ ἅγια κατ’ ἐνιαυτὸν ἐν αἵματι ἀλλοτρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/025.yaml
  text: Nor was it so that he might offer himself many times[a], just as the high priest enters the holy places year by year with blood not his own,
translation:
  language: ru
  text: и не для того, чтобы многократно приносить Себя в жертву, как первосвященник из года в год входит во святилище[a] с чужой кровью,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в святые места». В данном культовом контексте выражение может обозначать святилище в целом или, более конкретно, Святое святых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ἵνα
  choice: и не для того, чтобы
  rationale: Естественно продолжает отрицательную целевую конструкцию предыдущего стиха и сохраняет связь с контекстом.
- source_word: πολλάκις
  choice: многократно
  rationale: Передаёт повторяемость действия и подготавливает контраст с ежегодным служением первосвященника.
- source_word: προσφέρῃ ἑαυτόν
  choice: приносить Себя в жертву
  rationale: Явно передаёт жертвенный смысл προσφέρω и возвратное ἑαυτόν; инфинитив естественно зависит от «для того, чтобы».
- source_word: ὥσπερ
  choice: как
  rationale: Кратко и естественно вводит прямое сравнение с первосвященником.
- source_word: ὁ ἀρχιερεὺς
  choice: первосвященник
  rationale: Устоявшееся и точное обозначение этой культовой должности.
- source_word: εἰσέρχεται
  choice: входит
  rationale: Сохраняет настоящее время, обозначающее обычное, регулярно повторяющееся действие.
- source_word: εἰς τὰ ἅγια
  choice: во святилище
  rationale: В данном культовом контексте это естественная русская передача субстантивированного множественного τὰ ἅγια без чрезмерного уточнения как «Святое святых».
- source_word: κατ’ ἐνιαυτὸν
  choice: из года в год
  rationale: Естественно передаёт ежегодную повторяемость действия.
- source_word: ἐν αἵματι ἀλλοτρίῳ
  choice: с не своей кровью
  rationale: Передаёт инструментальное значение ἐν и подчёркивает, что первосвященник входит с кровью, которая ему не принадлежит, в отличие от самоприношения Христа.
theological_decisions:
- issue: Сопоставление Христа и ветхозаветного первосвященника
  choice: Текст противопоставляет многократному ежегодному входу первосвященника с не своей кровью самоприношение Христа, которое не совершается многократно.
  alternative: Можно конкретизировать место входа как «Святое святых», однако это сужает значение греческого выражения.
  rationale: Перевод сохраняет заложенный в контексте контраст, не добавляя последующих богословских формулировок и не устраняя лексическую широту τὰ ἅγια.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства культовой речи. Начальная строчная буква и конечная запятая отражают синтаксическую зависимость стиха от ближайшего контекста. Местоимение «Себя» написано с прописной буквы по принятой русской библейской традиции.
