- from: Они касаются только пищи, напитков и различных омовений — предписаний для плоти, установленных до времени исправления.
  to: Они относятся лишь к пище, напиткам и различным омовениям — к телесным предписаниям, возложенным до времени исправления.
  rationale: Перестроена фраза, чтобы «телесные предписания» ясно характеризовали перечисленные установления, а не выглядели несогласованным пояснением. «Возложенным» непосредственно передаёт ἐπικείμενα как обязательные требования; смысл и намеренная неопределённость «времени исправления» сохранены.
