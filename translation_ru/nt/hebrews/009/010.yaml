review_pass:
  verdict: revise
  source_fidelity: 'Смысл исходного текста в целом передан верно: речь идёт о предписаниях, относящихся к пище, напиткам и различным омовениям и действующих до обозначенного времени. Однако в текущей русской фразе тире присоединяет родительный оборот «предписаний для плоти» к конструкции «касаются только...», отчего синтаксическая связь и предикативная роль δικαιώματα σαρκὸς выражены неясно.'
  naturalness: '«Они касаются только пищи, напитков и различных омовений — предписаний для плоти...» звучит синтаксически сбивчиво: неясно, что именно является предписаниями. «Телесные предписания» естественно передаёт внешнюю, телесно-ритуальную сферу без обязательной нравственно отрицательной окраски.'
  terminology: '«Омовения» удачно отличает βαπτισμοί от христианского крещения. «Телесные предписания» точнее и яснее, чем «предписания для плоти»: σαρκὸς характеризует сами установления как относящиеся к плоти/внешней сфере. «Время исправления» сохранено как намеренно неуточнённое соответствие διορθώσεως.'
  issues:
  - severity: medium
    issue: Неясная синтаксическая связь «предписаний для плоти»
    rationale: В оригинале δικαιώματα σαρκὸς — самостоятельное именное определение того, что действует лишь в сфере пищи, напитков и омовений. В черновике этот оборот после тире грамматически присоединён неясно и может читаться как объект слова «касаются».
  - severity: low
    issue: «Для плоти» неточно передаёт функцию родительного σαρκὸς
    rationale: Формулировка может означать предписания, предназначенные для плоти, тогда как исходный текст характеризует их как телесные, внешние установления.
  revised_text: Они относятся лишь к пище, напиткам и различным омовениям — к телесным предписаниям, возложенным до времени исправления.
