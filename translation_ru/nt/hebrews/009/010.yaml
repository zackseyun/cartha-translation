  text: μόνον ἐπὶ βρώμασιν καὶ πόμασιν καὶ διαφόροις βαπτισμοῖς, ⸀δικαιώματα σαρκὸς μέχρι καιροῦ διορθώσεως ἐπικείμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/010.yaml
  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: ru
  text: Они относятся лишь к пище, напиткам и различным омовениям — к телесным предписаниям, возложенным до времени исправления.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρώμασιν καὶ πόμασιν
  choice: пищи, напитков
  rationale: Прямо и естественно передаёт ритуальные предписания о еде и питье.
- source_word: διαφόροις βαπτισμοῖς
  choice: различных омовений
  rationale: Во множественном числе βαπτισμοί здесь обозначает разнообразные обрядовые омовения, а не христианское крещение.
- source_word: δικαιώματα σαρκὸς
  choice: предписаний для плоти
  rationale: Сохраняет значение δικαιώματα как установлений или требований и неоднозначность родительного σαρκὸς, не усиливая его до нравственно отрицательного «плотских».
- source_word: καιροῦ διορθώσεως
  choice: времени исправления
  rationale: Буквально сохраняет образ приведения в должный порядок; выражение допускает эсхатологическое и заветно-историческое понимание.
- source_word: ἐπικείμενα
  choice: установленных
  rationale: В данном контексте причастие означает возложенные как обязательные предписания; «установленных» звучит естественно и не добавляет субъекта действия.
theological_decisions:
- issue: Связь «для плоти» с предписаниями
  choice: предписаний для плоти
  alternative: плотских предписаний
  rationale: Выбранный вариант сохраняет возможный смысл предписаний, относящихся к телесной, внешней сфере, не приписывая им автоматически греховный характер.
- issue: Значение διορθώσεως
  choice: исправления
  alternative: установления нового порядка
  rationale: «Исправления» ближе к форме исходного слова и не конкретизирует сверх текста, в чём именно состоит грядущее приведение в порядок.
translation_notes:
  register: Современный литературный русский язык; достоинство и компактность оригинала сохранены. Начальное «Они» связывает стих с дарами и жертвами предыдущего контекста. Тире ясно показывает, что пища, напитки и омовения являются предписаниями для плоти.
