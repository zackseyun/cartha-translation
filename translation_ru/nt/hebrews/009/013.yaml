  source_fidelity: Перевод точно передаёт условно-обосновывающую конструкцию εἰ γὰρ и намеренно сохраняет незавершённость предложения перед продолжением в ст. 14. «Кровь козлов и быков», «пепел телицы», ритуальное окропление осквернённых и цель «для очищения плоти» соответствуют греческому тексту. «Их» в русском предложении ясно отсылает к осквернённым и не вносит нового смысла.
