  terminology: «Телица», «осквернённые», «освящают» и «плоть» удачно сохраняют жертвенно-ритуальную и богословскую лексику. Сноска к «осквернённым» корректно уточняет ритуальный характер нечистоты, а примечания к очищению плоти и Числам 19 не навязывают конфессионального толкования.
