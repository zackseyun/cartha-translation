id: HEB.9.13
reference: Hebrews 9:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ γὰρ τὸ αἷμα ⸂τράγων καὶ ταύρων⸃ καὶ σποδὸς δαμάλεως ῥαντίζουσα τοὺς κεκοινωμένους ἁγιάζει πρὸς τὴν τῆς σαρκὸς καθαρότητα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/013.yaml
  text: For if the blood of goats and bulls[a], and the ashes of a heifer that sprinkle those who have been defiled, sanctify for the purification of the flesh[d][c][b],
translation:
  language: ru
  text: Ибо если кровь козлов и быков и пепел телицы, которым окропляют осквернённых[a], освящают их для очищения плоти[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть ритуально нечистых.
    reason: lexical_alternative
  - marker: b
    text: Речь идёт о внешнем, телесном очищении по установлениям прежнего завета.
    reason: cultural_note
  - marker: c
    text: См. обряд очищения водой с пеплом телицы в Чис. 19.
    reason: cross_reference
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Ибо если
  rationale: Сохраняет обосновывающую частицу и условную конструкцию, продолжение которой следует в стихе 14.
- source_word: τὸ αἷμα τράγων καὶ ταύρων
  choice: кровь козлов и быков
  rationale: Точная и естественная передача жертвенной терминологии; родительный падеж выражает принадлежность крови животным.
- source_word: σποδὸς δαμάλεως
  choice: пепел телицы
  rationale: Сохраняет прямую отсылку к обряду очищения с пеплом телицы в Числах 19.
- source_word: ῥαντίζουσα
  choice: которым окропляют
  rationale: Передаёт действие причастия естественной русской конструкцией и ясно показывает, что пепел используется при окроплении, а не что телица совершает действие.
- source_word: τοὺς κεκοινωμένους
  choice: осквернённых
  rationale: Передаёт состояние ритуального осквернения; совершенный вид греческого причастия отражён результативным русским причастием.
- source_word: ἁγιάζει
  choice: освящают
  rationale: Сохраняет культовый и богословский регистр глагола; множественное число согласовано с однородными подлежащими «кровь» и «пепел».
- source_word: πρὸς τὴν τῆς σαρκὸς καθαρότητα
  choice: для очищения плоти
  rationale: Близко передаёт целевую конструкцию и сохраняет слово «плоть», необходимое для противопоставления очищению совести в следующем стихе.
theological_decisions:
- issue: Характер освящения посредством ветхозаветных обрядов
  choice: Ритуальное освящение, относящееся к внешнему очищению
  alternative: Внутреннее нравственное или всеобъемлющее духовное освящение
  rationale: Оборот «для очищения плоти» и противопоставление очищению совести в стихе 14 указывают на культовую сферу, не отрицая при этом реально приписанной обрядам действенности.
- issue: Значение σάρξ
  choice: «плоть» в телесном, внешнем смысле
  alternative: «Греховная природа»
  rationale: Контекст посвящён обрядовой нечистоте и телесному очищению; метафорический смысл греховной природы здесь неуместен.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного библейского регистра. Предложение намеренно заканчивается запятой, поскольку условная конструкция завершается в стихе 14. Формула «которым окропляют» устраняет синтаксическую двусмысленность и остаётся естественной для обычного читателя.
