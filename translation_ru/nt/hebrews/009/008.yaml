  source_fidelity: Нужна безопасная смысловая правка двух мест. «Ещё не открыт» передаёт доступность пути, тогда как πεφανερῶσθαι означает «ещё не явлен / не сделан явным». «Остаётся в силе» чрезмерно акцентирует юридическую действительность; ἐχούσης στάσιν допускает продолжающееся существование, положение или статус первой скинии.
  naturalness: «Тем самым Святой Дух показывает» и «путь ... ещё не явлен» — современный литературный русский с достаточно ясной связью с контекстом. «Всё ещё существует» естественно и менее доктринально нагружено, чем «остаётся в силе».
  terminology: «Святой Дух» и «скиния» точны и соответствуют традиционной новозаветной культовой терминологии. Единственное «святилище» — естественный собирательный русский эквивалент греческого культового множественного числа; примечание сохраняет возможность более буквального понимания.
