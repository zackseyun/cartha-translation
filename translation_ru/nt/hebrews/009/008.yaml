  rationale: Правка восстанавливает прямое значение πεφανερῶσθαι («явлен», а не «открыт») и заменяет статусно-юридически окрашенное «остаётся в силе» нейтральным «существует». Примечание b сохраняет пространственный и статусный оттенки στάσις без преждевременного выбора между ними. Все исходные якоря примечаний сохранены и стоят непосредственно после соответствующих выражений.
