source:
  edition: SBLGNT
  text: τοῦτο δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου, μήπω πεφανερῶσθαι τὴν τῶν ἁγίων ὁδὸν ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/008.yaml
  text: By this the Holy Spirit is indicating that the way into the holy places has not yet been revealed while the first tabernacle still has standing,
translation:
  language: ru
  text: Тем самым Святой Дух показывает, что путь в святилище[a] ещё не явлен, пока первая скиния всё ещё существует[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «путь в священные места»; возможно также: «путь во Святое святых». Греческое выражение может обозначать священное пространство в целом, но некоторые понимают его как указание именно на внутреннее святилище.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «пока первая скиния ещё стоит». Выражение может указывать как на её продолжающееся существование, так и на сохраняющееся положение или статус.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλοῦντος
  choice: показывает
  rationale: Причастие настоящего времени в родительном самостоятельном обороте выражает разъясняющее действие Святого Духа; личная форма естественна по-русски и сохраняет смысл «даёт понять, указывает».
- source_word: πνεύματος τοῦ ἁγίου
  choice: Святой Дух
  rationale: Устойчивое и ясное русское обозначение личного референта в новозаветном контексте.
- source_word: μήπω πεφανερῶσθαι
  choice: ещё не открыт
  rationale: 'Перфектный пассивный инфинитив обозначает сохраняющееся состояние: путь ещё не сделан явным и доступным. «Не открыт» естественно сочетается со словом «путь» и передаёт пассивное значение.'
- source_word: τὴν τῶν ἁγίων ὁδὸν
  choice: путь в святилище
  rationale: В контексте устройства скинии речь идёт о доступе к священному пространству. Единственное собирательное «святилище» по-русски естественнее буквального «святые места», не сужая основной текст до Святого святых.
- source_word: πρώτης σκηνῆς
  choice: первая скиния
  rationale: «Скиния» сохраняет культовый контекст Послания к евреям, а «первая» следует пространственному различению в ближайшем контексте.
- source_word: ἐχούσης στάσιν
  choice: остаётся в силе
  rationale: Оборот указывает на продолжающееся существование или действующий статус первой скинии. «Остаётся в силе» передаёт этот статус естественным современным русским языком; буквальная пространственная возможность сохранена в примечании.
- source_word: ἔτι
  choice: ещё
  rationale: Наречие подчёркивает продолжительность состояния и естественно передаётся словом «ещё».
theological_decisions:
- issue: Референт τῶν ἁγίων
  choice: доступ в святилище, то есть в священное пространство
  alternative: путь святых
  rationale: Непосредственный контекст посвящён устройству скинии и священническому доступу, поэтому выражение имеет пространственно-культовый, а не экклезиологический смысл.
- issue: Степень конкретности τῶν ἁγίων
  choice: святилище без уточнения его внутренней части
  alternative: Святое святых
  rationale: Контекст допускает особое указание на внутреннее святилище, однако греческая субстантивированная форма множественного числа сама по себе шире. Перевод не устраняет эту подлинную неоднозначность.
- issue: Смысл существования первой скинии
  choice: продолжающийся действующий статус
  alternative: физическое пребывание скинии в стоячем положении
  rationale: ἐχούσης στάσιν может обозначать сохранение положения, существования или силы. Основной текст передаёт статусный оттенок, а примечание сохраняет буквальную пространственную возможность.
translation_notes:
  register: Современный литературный русский язык с традиционной культовой лексемой «скиния». Синтаксис сделан ясным и естественным, при этом сохранены неоднозначность обозначения святилища и возможные статусный и пространственный оттенки заключительного оборота.
