base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/002.yaml
  text: For a first tabernacle was prepared[a], in which were the lampstand and the table and the bread of the Presence[b], which is called the Holy Place.
translation:
  language: ru
  text: Ибо была устроена первая часть скинии, в которой находились светильник, стол и хлебы предложения[a], которая называется Святым[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «выставление хлебов» или «возложение хлебов». Выражение может обозначать хлебы, выставленные перед Богом; также: «хлебы Присутствия».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово имеет форму множественного числа — буквально «Святые места», — но здесь обозначает первое отделение скинии, то есть Святое.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνὴ ... ἡ πρώτη
  choice: первая часть скинии
  rationale: В контексте речь идёт о первом отделении скинии, противопоставленном второму в следующем стихе. Добавление «часть» естественно передаёт подразумеваемое пространственное значение и не создаёт впечатления, будто существовали две отдельные скинии.
- source_word: κατεσκευάσθη
  choice: была устроена
  rationale: Глагол может обозначать приготовление, устройство или оснащение. «Была устроена» охватывает создание священного пространства вместе с его обстановкой и звучит естественно по-русски.
- source_word: λυχνία
  choice: светильник
  rationale: Обозначает культовую подставку с масляными лампадами; традиционное русское «светильник» не вызывает неверной ассоциации со свечами.
- source_word: τράπεζα
  choice: стол
  rationale: Прямое и естественное обозначение священного стола.
- source_word: ἡ πρόθεσις τῶν ἄρτων
  choice: хлебы предложения
  rationale: Устойчивое русское библейское наименование хлебов, регулярно полагавшихся перед Богом; сохраняет связь с идеей выставления или возложения хлебов. Более прозрачная смысловая передача дана в примечании.
- source_word: ἥτις λέγεται Ἅγια
  choice: она называется Святым
  rationale: Относительное местоимение соотнесено с «первой частью». Субстантивированное множественное Ἅγια в данном контексте обозначает внешнее священное отделение; «Святое» сохраняет его традиционное название и отличие от Святого святых.
theological_decisions:
- issue: К чему относится ἥτις и как обозначено первое отделение
  choice: «она называется Святым» — первое отделение скинии
  alternative: «которая называется святилищем» или буквально «святыми местами»
  rationale: Ближайший контекст различает первое и второе отделения. «Святое» передаёт пространственное противопоставление, не добавляя богословских выводов; примечание сохраняет сведения о грамматическом множественном числе греческой формы.
- issue: Значение ἡ πρόθεσις τῶν ἄρτων
  choice: «хлебы предложения»
  alternative: «хлебы Присутствия» или «предложение хлебов»
  rationale: Греческая конструкция буквально указывает на выставление или возложение хлебов и может пониматься как название самих хлебов либо их размещения. Основной текст использует узнаваемое русское обозначение, а примечание раскрывает исходный образ.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской терминологией. Синтаксис упрощён для ясности, но сохранены причинное «ибо», перечисление предметов и культовое различие между отделениями скинии.
