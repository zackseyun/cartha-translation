  text: А за второй завесой была скиния, называемая «Святое святых».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ... τὸ δεύτερον καταπέτασμα
  choice: за второй завесой
  rationale: Μετά с винительным падежом здесь выражает пространственное отношение. «За» естественно передаёт расположение внутреннего отделения; «завеса» сохраняет культовый смысл καταπέτασμα и остаётся понятной современному читателю.
- source_word: δὲ
  choice: А
  rationale: Частица δέ мягко продвигает описание и сопоставляет второе отделение с первым, не выражая сильного противопоставления.
- source_word: σκηνή
  choice: скиния
  rationale: В Евр 9 σκηνή обозначает скинию и её отделения. Традиционный культовый термин точнее сохраняет образ переносного святилища, чем более общее «шатёр» или пояснительное «помещение».
- source_word: ἡ λεγομένη
  choice: называемая
  rationale: Причастный оборот передан близко к форме оригинала и естественно звучит по-русски.
- source_word: Ἅγια Ἁγίων
  choice: «Святое святых»
  rationale: Устоявшееся русское библейское выражение передаёт семитский способ обозначения высшей степени святости и ясно указывает на внутреннее святилище.
theological_decisions:
- issue: Передача названия Ἅγια Ἁγίων
  choice: «Святое святых»
  alternative: «Самое святое место»
  rationale: «Святое святых» одновременно понятно русскому читателю, сохраняет культовое название внутреннего отделения и ближе к форме исходного выражения. Более пояснительный вариант устранил бы его традиционную образность.
translation_notes:
  register: Современный литературный русский с сохранением уместных библейско-культовых терминов «завеса», «скиния» и «Святое святых». Порядок слов сделан естественным для русского языка, без добавления слова «отделение» или «помещение», отсутствующего в греческом тексте.
