  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λαληθείσης γὰρ πάσης ἐντολῆς κατὰ ⸀τὸν νόμον ὑπὸ Μωϋσέως παντὶ τῷ λαῷ, λαβὼν τὸ αἷμα τῶν ⸀μόσχων μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν ἐράντισεν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/019.yaml
  text: For when every commandment according to the law had been spoken by Moses to all the people[a], he took the blood of the calves with water and scarlet wool and hyssop, and sprinkled both the scroll itself and all the people,
translation:
  language: ru
  text: Ибо после того, как Моисей возвестил всему народу каждую заповедь согласно Закону, он взял кровь телят[a] с водой, алой шерстью и иссопом и окропил как сам свиток, так и весь народ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молодых быков». Греческое слово μόσχων в контексте жертвоприношения может обозначать телят или молодых быков.'
    reason: Лексическая альтернатива
lexical_decisions:
- source_word: λαληθείσης γὰρ πάσης ἐντολῆς
  choice: Ибо после того, как ... возвестил ... каждую заповедь
  rationale: Генитив абсолютный передан временной конструкцией; активная форма с Моисеем как подлежащим естественна по-русски. «Каждую заповедь» сохраняет распределительное значение πάσης и конкретный смысл ἐντολῆς.
- source_word: κατὰ τὸν νόμον
  choice: согласно Закону
  rationale: Передаёт значение соответствия у κατά с винительным падежом; прописная буква указывает на Моисеев Закон в данном контексте.
- source_word: ὑπὸ Μωϋσέως παντὶ τῷ λαῷ
  choice: Моисей возвестил всему народу
  rationale: Агент пассивной конструкции сделан подлежащим для естественного русского синтаксиса, а παντί передано как полнота охвата народа.
- source_word: λαβὼν
  choice: он взял
  rationale: Аористное причастие передано личной формой, сохраняющей последовательность повествовательных действий.
- source_word: τὸ αἷμα τῶν μόσχων
  choice: кровь телят[a]
  rationale: «Телята» — прямое значение μόσχοι; в жертвенном контексте возможен также перевод «молодые быки», отмеченный в сноске.
- source_word: μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου
  choice: с водой, алой шерстью и иссопом
  rationale: Сохраняются все три элемента обряда; «алая шерсть» естественно передаёт ἐρίου κοκκίνου, а «иссоп» является устоявшимся русским названием растения.
- source_word: αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν
  choice: как сам свиток, так и весь народ
  rationale: Парная конструкция «как ... так и» передаёт τε ... καί, «сам» сохраняет эмфазу αὐτό, а «свиток» отражает форму древнего письменного документа.
- source_word: ἐράντισεν
  choice: окропил
  rationale: Точный и понятный русский глагол для ритуального кропления.
theological_decisions:
- issue: Соотношение с повествованием Исхода 24 и значение μόσχων
  choice: Перевести формулировку Послания к евреям без согласования или дополнения по тексту Исхода; в основном тексте употребить «телят».
  alternative: Перевести «молодых быков» либо расширить текст пояснением об обряде.
  rationale: Сжатое изложение автора должно сохраняться в собственном виде. Лексически допустимая альтернатива вынесена в сноску, без гармонизации с ветхозаветным повествованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён за счёт активной временной конструкции, но последовательность и все ритуальные детали греческого текста сохранены. Конечная запятая оставлена, поскольку предложение продолжается в следующем стихе.
