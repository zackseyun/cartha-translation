    text: 'Или: «вечным духом». Греческое выражение допускает более общее понимание, хотя в основном тексте оно принято как указание на Святого Духа.'
    reason: alternative_reading
lexical_decisions:
- source_word: πόσῳ μᾶλλον
  choice: то тем более
  rationale: Естественно продолжает начатое в предыдущем стихе доказательство от меньшего к большему и сохраняет его риторическую силу.
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: кровь Мессии
  rationale: «Кровь» сохраняет жертвенный образ, а Χριστός передано как титул «Мессия».
- source_word: διὰ πνεύματος αἰωνίου
  choice: вечным Духом
  rationale: Творительный падеж естественно передаёт греческое διά с родительным в значении посредства; прописная буква отражает вероятное указание на Святого Духа, а неоднозначность отмечена в сноске.
- source_word: ἑαυτὸν προσήνεγκεν
  choice: принёс Себя
  rationale: Глагол сохраняет культово-жертвенный смысл и возвратную направленность действия.
- source_word: ἄμωμον
  choice: непорочным
  rationale: Слово передаёт отсутствие изъяна у жертвы и вместе с тем применимо лично к Мессии.
- source_word: καθαριεῖ τὴν συνείδησιν ἡμῶν
  choice: очистит нашу совесть
  rationale: Сохранены будущее время, образ очищения и чтение ἡμῶν, засвидетельствованное данным текстом SBLGNT.
- source_word: ἀπὸ νεκρῶν ἔργων
  choice: от мёртвых дел
  rationale: Буквальная формулировка сохраняет богословскую ёмкость выражения и связь с Евр 6:1.
- source_word: εἰς τὸ λατρεύειν θεῷ ζῶντι
  choice: чтобы мы служили живому Богу
  rationale: Целевая конструкция передана придаточным предложением; «служили» сохраняет как общее, так и богослужебное значение λατρεύω.
theological_decisions:
- issue: К кому или чему относится πνεύματος αἰωνίου
  choice: «вечным Духом» — вероятное указание на Святого Духа
  alternative: «вечным духом» — возможно, собственным вечным духом Христа или в духовном, вечном качестве
  rationale: Безартиклевая греческая конструкция допускает более общее понимание. Основной текст отражает наиболее вероятное личное понимание, а подлинная неоднозначность сохранена в сноске.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном контексте слово сохраняет силу титула Помазанника; «Мессия» делает значение титула прозрачным и не меняет его референта.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского регистра. Синтаксис сделан естественным для русского: целевой оборот раскрыт как «чтобы мы служили», а начальное «то тем более» сохраняет связь с предыдущим стихом.'
