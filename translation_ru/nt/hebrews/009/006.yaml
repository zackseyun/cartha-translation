  - marker: b
    text: 'Или: «исполняя обрядовые обязанности»; «совершая священные служения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων δὲ οὕτως κατεσκευασμένων
  choice: Когда всё это устроено таким образом
  rationale: Генитив абсолютный задаёт обстоятельство последующего действия. «Устроено» естественно охватывает как устройство скинии, так и размещение перечисленных предметов, не сужая смысл до одного лишь изготовления.
- source_word: εἰς μὲν τὴν πρώτην σκηνὴν
  choice: в первое отделение скинии
  rationale: В контексте σκηνή обозначает первую часть святилища. Такое выражение ясно передаёт пространственный контраст со вторым отделением в следующем стихе и сохраняет связь с ветхозаветной скинией.
- source_word: διὰ παντὸς
  choice: постоянно
  rationale: Оборот обозначает регулярный, непрестанно повторяющийся порядок служения, а не непрерывное физическое пребывание священников внутри.
- source_word: εἰσίασιν
  choice: входят
  rationale: Настоящее время передаёт обычное, многократно повторяющееся действие.
- source_word: οἱ ἱερεῖς
  choice: священники
  rationale: Речь об обычных священниках, противопоставленных первосвященнику в следующем стихе.
- source_word: τὰς λατρείας ἐπιτελοῦντες
  choice: совершая богослужение
  rationale: λατρεῖαι здесь означает предписанные священные служения; русский собирательный единственный оборот звучит естественно и сохраняет культовый смысл.
theological_decisions:
- issue: Значение σκηνή применительно к первой части святилища
  choice: первое отделение скинии
  alternative: первая скиния; первая палатка
  rationale: Контекст описывает две части одной скинии. Выбранный вариант не создаёт впечатления двух самостоятельных скиний и сохраняет ветхозаветный культовый фон.
- issue: Сила выражения διὰ παντός
  choice: постоянно
  alternative: всегда; регулярно
  rationale: «Постоянно» сохраняет контраст между многократным доступом священников в первое отделение и ежегодным входом первосвященника во второе, не подразумевая непрерывного присутствия.
- issue: Характер τὰς λατρείας
  choice: богослужение
  alternative: служения; обрядовые обязанности
  rationale: Выбранное слово обозначает служение Богу в святилище, не уточняя сверх текста отдельные обряды или обязанности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Отделение скинии» понятно обычному читателю и точно выражает архитектурный контекст; «богослужение» употреблено в его широком культовом смысле.
