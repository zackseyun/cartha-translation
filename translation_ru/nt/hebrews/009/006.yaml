  text: При таком устройстве всего этого священники постоянно входят в первое отделение скинии[a], совершая предписанные служения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в первую скинию». Здесь греческое слово «скиния» может обозначать её первое отделение.'
