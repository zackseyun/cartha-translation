  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: ru
  text: Но Мессия пришёл как Первосвященник наступивших благ — через скинию более великую и более совершенную, нерукотворную, то есть не от этого творения, —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χριστὸς
  choice: Мессия
  rationale: Здесь слово употреблено как титул; «Мессия» ясно передаёт его смысл и сохраняет связь с ожиданием Помазанника.
- source_word: δὲ
  choice: Но
  rationale: Обозначает контраст с предшествующим описанием земной скинии и её служения.
- source_word: παραγενόμενος
  choice: пришёл
  rationale: Передаёт явление и вступление Мессии в первосвященническое служение без излишнего уточнения характера этого пришествия.
- source_word: ἀρχιερεὺς
  choice: Первосвященник
  rationale: Точный традиционный термин для названной должности; прописная буква указывает на титульное употребление по отношению к Мессии.
- source_word: τῶν γενομένων ἀγαθῶν
  choice: уже явившихся благ
  rationale: Следует чтению γενομένων в SBLGNT и естественно по-русски выражает блага, которые уже наступили; «уже» делает результативный смысл причастия ясным, не определяя сами блага.
- source_word: διὰ τῆς ... σκηνῆς
  choice: через ... скинию
  rationale: Сохраняет культовый образ скинии и синтаксическую незавершённость, которая продолжается в стихе 12.
- source_word: μείζονος καὶ τελειοτέρας
  choice: более великую и совершенную
  rationale: Передаёт сравнительную степень и тематически важный для Послания язык совершенства; русское согласование позволяет естественно избежать неуклюжего «более совершенную» при сохранении смысла.
- source_word: οὐ χειροποιήτου
  choice: нерукотворную
  rationale: Устоявшийся и ёмкий библейский эквивалент, обозначающий не созданное человеческими руками.
- source_word: τοῦτ’ ἔστιν
  choice: то есть
  rationale: Естественно вводит пояснение.
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: не принадлежащую этому творению
  rationale: Ясно передаёт родительный принадлежности и не сужает κτίσις до отдельного сотворённого предмета.
theological_decisions:
- issue: Текстовый вариант τῶν γενομένων ἀγαθῶν
  choice: уже явившихся благ
  alternative: будущих благ
  rationale: Основной текст следует SBLGNT с γενομένων, а хорошо засвидетельствованный вариант μελλόντων сохраняется в примечании, чтобы не скрывать текстологическую и богословскую напряжённость.
- issue: Синтаксическая связь διὰ τῆς ... σκηνῆς
  choice: Сохранить оборот «через… скинию» как продолжение незавершённого предложения, ведущего к стиху 12
  alternative: Связать оборот непосредственно с «пришёл»
  rationale: В контексте оборот естественнее относится к последующему εἰσῆλθεν («вошёл») в стихе 12. Тире и завершающее тире предупреждают ложное впечатление, будто Мессия пришёл посредством скинии, не перестраивая греческий период полностью.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Термины «Первосвященник», «скиния» и «нерукотворная» сохранены ради культовой и межтекстовой точности. Конечное тире намеренно показывает, что греческое предложение продолжается в следующем стихе.
