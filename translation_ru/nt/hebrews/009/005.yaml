  text: ὑπεράνω δὲ αὐτῆς Χερουβὶν δόξης κατασκιάζοντα τὸ ἱλαστήριον· περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: ru
  text: А над ним были херувимы славы, осенявшие крышку ковчега[a]. Об этом сейчас невозможно говорить подробно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. ἱλαστήριον. Так в греческом переводе Ветхого Завета называется крышка ковчега; традиционный перевод — «очистилище». Возможен также перевод: «место умилостивления».'
    reason: Термин обозначает конкретную крышку ковчега, но имеет культовое значение и допускает традиционные альтернативные передачи.
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: А над ним
  rationale: Оборот указывает на положение над ковчегом, упомянутым ранее. В русском местоимение согласовано со словом «ковчег».
- source_word: Χερουβὶν δόξης
  choice: херувимы славы
  rationale: 'Сохранена краткая и допускающая разные смысловые оттенки конструкция с родительным падежом: херувимы связаны с явлением Божьей славы, но характер этой связи не уточняется.'
- source_word: κατασκιάζοντα
  choice: осенявшие
  rationale: «Осенять» точно передаёт положение распростёртых крыльев над крышкой и сохраняет возвышенный, но понятный библейский регистр.
- source_word: τὸ ἱλαστήριον
  choice: крышку искупления
  rationale: В данном описании святилища слово обозначает конкретную крышку ковчега, связанную с обрядом искупления. Перевод одновременно обозначает предмет и сохраняет богословскую составляющую термина, не превращая сам предмет в «жертву».
- source_word: περὶ ὧν
  choice: Об этом
  rationale: Естественная русская передача ссылки на перечисленные предметы и связанные с ними подробности.
- source_word: οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: сейчас невозможно говорить подробно
  rationale: Передаёт временную неуместность или невозможность подробного, поэлементного рассмотрения, не уточняя причину.
theological_decisions:
- issue: Значение ἱλαστήριον в контексте устройства святилища
  choice: крышка искупления
  alternative: очистилище; место умилостивления; умилостивительная крышка
  rationale: Контекст однозначно указывает на крышку ковчега, которую осеняли херувимы. При этом компонент «искупления» сохраняет культово-богословскую функцию предмета. Традиционное «очистилище» может быть ошибочно понято современным читателем как загробное место очищения, а абстрактные «умилостивление» или «искупительная жертва» здесь затемняют предметный референт.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Херувимы славы» и «осенявшие» сохраняют достоинство и компактность оригинала; синтаксис упрощён до естественной русской фразы без устранения смысловой неоднозначности.
