  text: И первый завет имел предписания для богослужения и земное святилище[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, букв.: «первая»; вероятно, подразумевается первый завет. Некоторые понимают выражение шире: «первое установление».'
    reason: alternative_reading
  - marker: b
