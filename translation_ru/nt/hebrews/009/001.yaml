    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶχε
  choice: имел
  rationale: Имперфект ἔχω вводит описание прежнего устройства; простое «имел» естественно передаёт значение обладания.
- source_word: μὲν οὖν
  choice: И
  rationale: Сочетание служит переходом и связывает стих с предыдущим рассуждением. В современном русском начальное «И» естественно передаёт продолжение, тогда как буквальное «итак, действительно» звучало бы тяжеловесно.
- source_word: ἡ πρώτη
  choice: первый завет
  rationale: Субстантивированное прилагательное женского рода отсылает к первому завету из ближайшего контекста (Евр. 8:13). Слово «завет» восполнено для ясности.
- source_word: δικαιώματα
  choice: предписания
  rationale: В культовом контексте слово обозначает установленные нормы, регулирующие богослужение. «Предписания» сохраняет нормативный смысл и звучит современно.
- source_word: λατρείας
  choice: для богослужения
  rationale: Передаёт назначение предписаний и культовый смысл λατρεία естественным русским выражением.
- source_word: τό τε ἅγιον
  choice: святилище
  rationale: Обозначает освящённое место в целом; следующие стихи уточняют его устройство, поэтому более узкое «Святое» здесь преждевременно.
- source_word: κοσμικόν
  choice: земное
  rationale: В контексте противопоставлено небесной реальности. «Земное» передаёт пространственно-порядковый контраст без нравственно отрицательного оттенка слова «мирское».
theological_decisions:
- issue: Подразумеваемое существительное при ἡ πρώτη
  choice: первый завет
  alternative: «первое установление» или просто «первое»
  rationale: Ближайший контекст противопоставляет первый и новый заветы. Восполнение слова «завет» делает русскую фразу понятной, но альтернативная возможность отмечена в сноске.
- issue: Значение κοσμικόν
  choice: земное
  alternative: мирское
  rationale: Речь идёт прежде всего о противопоставлении земного святилища небесным реалиям, а не о его нравственной порочности.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранена краткость греческой фразы; специальная культовая лексика ограничена общеупотребительными словами «богослужение» и «святилище».
