review_pass:
  verdict: revise
  source_fidelity: 'Основная передача διαθήκη как «завет» допустима при явно сохранённой в сноске юридической альтернативе. «Того, кто его установил» удовлетворительно передаёт τοῦ διαθεμένου без преждевременного выбора «завещатель». Однако «необходимо представить смерть» в русском языке семантически и синтаксически неудачно: смерть нельзя естественно «представить». Пассивное φέρεσθαι в данном спорном юридико-аргументативном контексте безопаснее передать как необходимость засвидетельствования смерти, не сводя его только к наступлению смерти.'
  naturalness: Фраза «должна быть засвидетельствована смерть» естественна для современного литературного русского и сохраняет сжатый, формальный регистр аргумента. Она лучше, чем намеренно необычное «представить смерть», не создаёт ложного образа физического предъявления смерти.
  terminology: «Завет» согласуется с преобладающей терминологией ближайшего контекста Послания к Евреям. Сноска с «завещанием» и «завещателем» необходима, поскольку в стт. 16–17 διαθήκη и διαθέμενος многими понимаются в юридическом смысле. «Засвидетельствована» не навязывает конфессионального толкования и уместна как в основном, так и в альтернативном юридическом прочтении.
  issues:
  - severity: medium
    issue: Неестественное сочетание «представить смерть».
    rationale: Русское «представить» обычно требует представления лица, предмета, документа, доказательства или сообщения; сочетание со «смертью» без уточнения звучит как калька и затемняет смысл φέρεσθαι.
  - severity: low
    issue: Сноска повторяет неудачную конструкцию основного текста.
    rationale: В юридической альтернативе также следует заменить «представить смерть завещателя» на естественное «должна быть засвидетельствована смерть завещателя».
  revised_text: Ведь где есть завет[a], там смерть того, кто его установил, должна быть засвидетельствована.
