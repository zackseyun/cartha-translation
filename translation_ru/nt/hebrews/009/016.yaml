  text: ὅπου γὰρ διαθήκη, θάνατον ἀνάγκη φέρεσθαι τοῦ διαθεμένου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/016.yaml
  text: For where there is a covenant[a], it is necessary for the death of the one who made it to be brought forward.
translation:
  language: ru
  text: Ведь где есть завет[a], там смерть того, кто его установил, должна быть засвидетельствована.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь где есть завещание, там смерть завещателя должна быть засвидетельствована». Греческое слово διαθήκη может означать как «завет», так и «завещание»; многие понимают стихи 16–17 здесь в юридическом смысле.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκη
  choice: завет
  rationale: В Послании к Евреям 8–10 преобладает тема завета, связанная с Иеремией 31 и его введением в силу посредством жертвы. При этом возможное юридическое значение «завещание» сохранено в сноске.
- source_word: θάνατον
  choice: смерть
  rationale: Прямое соответствие греческому слову; речь идёт о смерти как необходимом условии в ходе аргументации.
- source_word: ἀνάγκη
  choice: необходимо
  rationale: Естественно передаёт выраженную в греческом тексте необходимость.
- source_word: φέρεσθαι
  choice: представить
  rationale: Пассивный инфинитив буквально означает «быть принесённым/предъявленным»; безличная русская конструкция «необходимо представить» естественно передаёт выдвижение смерти как требуемого факта, не усиливая смысл до «доказать» или «установить факт».
- source_word: τοῦ διαθεμένου
  choice: того, кто его установил
  rationale: Причастие обозначает лицо, установившее или распорядившееся относительно διαθήκη. Формулировка сохраняет связь с «заветом» и не вводит узкий термин «завещатель» в основной текст.
- source_word: ὅπου γὰρ
  choice: Ведь где… там
  rationale: «Ведь» передаёт пояснительную функцию γάρ, а соотносительная конструкция «где… там» звучит естественно по-русски.
theological_decisions:
- issue: Передавать ли διαθήκη в Евреям 9:16 как «завет» или как «завещание»
  choice: В основном тексте — «завет», с указанием «завещание» в сноске.
  alternative: «Ведь где есть завещание, необходимо представить смерть завещателя».
  rationale: Ближайшие стихи допускают юридическое значение, однако более широкий контекст Евреям 8–10 последовательно посвящён завету. Сноска сохраняет реальную лексическую и истолковательную неоднозначность.
- issue: Смысл φέρεσθαι применительно к смерти установившего завет
  choice: «представить смерть»
  alternative: «подтвердить смерть»; «смерть должна наступить»
  rationale: Выбранная формулировка близка к образу принесения или предъявления, заложенному в φέρω, и не превращает текст ни в однозначное требование юридического доказательства смерти, ни в утверждение только о её наступлении.
translation_notes:
  register: Современный литературный русский язык; достоинство и краткость оригинала сохранены. Конструкция «представить смерть» несколько необычна, но намеренно удерживает образ греческого φέρεσθαι и неоднозначность аргумента.
