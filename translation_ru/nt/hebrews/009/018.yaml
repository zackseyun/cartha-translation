  text: Therefore not even the first covenant was inaugurated without blood[a].
translation:
  language: ru
  text: Поэтому даже первый завет не был введён в силу без крови[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «первая»; подразумевается первый завет. Возможен перевод: «первое завещание».'
    reason: Уточнение подразумеваемого существительного и сохранение лексической неоднозначности контекста.
lexical_decisions:
- source_word: ὅθεν
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения о завете, смерти и крови.
- source_word: οὐδὲ
  choice: и … не
  rationale: В сочетании с контекстом естественно выражает усилительное значение «не был исключением и первый»; более буквальное «даже … не» по-русски здесь звучит тяжелее.
- source_word: ἡ πρώτη
  choice: первый завет
  rationale: Существительное подразумевается формой женского рода и контекстом; «завет» ясно обозначает отсылку, не добавляя нового смысла.
- source_word: χωρὶς αἵματος
  choice: не без крови
  rationale: Сохраняет отрицательную форму оригинала и его культово-заветный образ.
- source_word: ἐγκεκαίνισται
  choice: был введён в силу
  rationale: Передаёт совершившееся учреждение и начало действия завета; не сужает значение до одного лишь освящения или юридической ратификации.
theological_decisions:
- issue: Референт выражения ἡ πρώτη («первый/первая»)
  choice: первый завет
  alternative: «первое» без пояснения; «первое завещание»; первое устройство святилища
  rationale: Контекст Евр 9 и аллюзия на Исх 24 указывают на первый завет. Слово «завет» также сохраняет связь с окроплением кровью, тогда как «завещание» здесь чрезмерно сужает многозначность ближайшего контекста.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и торжественно-нейтральная. Выражение «введён в силу» естественно для завета и передаёт ἐγκαινίζω без конфессионального уточнения.
