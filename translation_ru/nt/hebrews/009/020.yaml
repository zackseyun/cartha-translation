  text: 'говоря: «Это кровь завета, который Бог вам заповедал[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это кровь завета, который Бог предписал для вас». Греческое выражение дословно сохраняет необычную связь: Бог «повелел» завет по отношению к адресатам; подразумеваемое действие не названо.'
    reason: Лексико-синтаксическая альтернатива для ἧς ἐνετείλατο πρὸς ὑμᾶς; сноска не добавляет отсутствующее в оригинале «соблюдать».
lexical_decisions:
- source_word: λέγων
  choice: говоря
  rationale: Причастие настоящего времени вводит цитату и сохраняет синтаксическую связь с предыдущим стихом; русское «говоря» передаёт эту форму без превращения её в самостоятельный глагол.
- source_word: Τοῦτο
  choice: Это
  rationale: В греческом связка подразумевается; в русском именная конструкция «Это кровь...» естественна и не требует явного «есть».
- source_word: αἷμα
  choice: кровь
  rationale: Прямой конкретный эквивалент; контекст жертвенной крови не следует заменять толкованием.
- source_word: διαθήκης
  choice: завета
  rationale: В аллюзии на Исход 24 речь идёт о соглашении Бога с народом, поэтому «завет» точнее, чем завещательно-правовые варианты.
- source_word: ἧς
  choice: который
  rationale: Относительное местоимение грамматически относится к «завету». Русская конструкция сохраняет эту связь, хотя необычное сочетание «заповедал завет» нуждается в пояснении альтернативы.
- source_word: ἐνετείλατο
  choice: заповедал
  rationale: Глагол означает повелеть или предписать. «Заповедал» сохраняет библейский оттенок, оставаясь понятным в современном литературном русском.
- source_word: πρὸς ὑμᾶς
  choice: вам
  rationale: Передаёт направленность Божьего повеления к народу и естественно сочетается с «заповедал»; более буквальная пространственная конструкция по-русски была бы неестественна.
- source_word: ὁ θεός
  choice: Бог
  rationale: Стандартный русский эквивалент без ненужного расширения титула.
theological_decisions:
- issue: Передача διαθήκη в контексте утверждения отношений между Богом и народом посредством крови
  choice: завет
  alternative: завещание
  rationale: Стих отсылает к Исходу 24:8 и Моисееву завету; «завещание» внесло бы не соответствующий непосредственному контексту юридический смысл.
- issue: Подразумеваемая связка после Τοῦτο
  choice: «Это кровь завета» без явного глагола «есть»
  alternative: «Это есть кровь завета»
  rationale: Русское именное предложение без связки в настоящем времени грамматически полно и естественно; оно передаёт подразумеваемую греческую предикацию без архаизации.
- issue: Необычная связь относительного местоимения с «заветом»
  choice: сохранить «завета, который Бог заповедал вам»
  alternative: «кровь завета, которую Бог повелел вам принести»
  rationale: Греческое ἧς относится к διαθήκης, а текст не называет кровь объектом повеления. Сохранение этой структуры не добавляет отсутствующего в оригинале объекта и оставляет напряжение формулировки открытым.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Сохранено причастие «говоря» и ключевой термин «завет»; опущена ненужная в современном русском связка «есть». Сноска отмечена в основном тексте.
