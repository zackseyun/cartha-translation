  text: ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου· ⸀νυνὶ δὲ ἅπαξ ἐπὶ συντελείᾳ τῶν αἰώνων εἰς ἀθέτησιν ⸀ἁμαρτίας διὰ τῆς θυσίας αὐτοῦ πεφανέρωται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/026.yaml
  text: Otherwise[a], he would have had to suffer many times since the foundation of the world. But as it is[c][b], he has appeared once for all at the consummation of the ages to put away sin through the sacrifice of himself.
translation:
  language: ru
  text: Иначе ему пришлось бы многократно страдать от основания мира. Теперь же, при завершении веков[a], он явился один раз и навсегда, чтобы устранить грех[b] посредством его жертвы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в конце веков».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы упразднить грех»; «для устранения греха».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «через его жертву». С учётом ближайшего контекста возможно также: «посредством принесения им самого себя в жертву».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: иначе
  rationale: В контексте слово вводит следствие из отвергнутого предположения о многократном принесении Христа в жертву.
- source_word: ἔδει αὐτὸν πολλάκις παθεῖν
  choice: ему пришлось бы многократно страдать
  rationale: Условная форма по-русски передаёт гипотетическую необходимость; «многократно» подчёркивает контраст с ἅπαξ.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: от основания мира
  rationale: Сохраняет традиционный и понятный образ начала, или основания, мира и исходную предложную конструкцию.
- source_word: νυνὶ δὲ
  choice: теперь же
  rationale: Передаёт и временное значение νυνί, и резкий переход от гипотетического положения к действительному.
- source_word: ἅπαξ
  choice: один раз и навсегда
  rationale: Выражает как однократность, так и решающий, неповторимый характер явления и жертвы в данном контексте.
- source_word: ἐπὶ συντελείᾳ τῶν αἰώνων
  choice: при завершении веков
  rationale: Сохраняет множественное число «веков» и значение кульминации или завершения, не сводя выражение к «концу мира».
- source_word: εἰς ἀθέτησιν ἁμαρτίας
  choice: чтобы устранить грех
  rationale: Передаёт цель и сильное значение ἀθέτησις — отмену, упразднение или устранение; единственное число представляет грех как целостную реальность.
- source_word: διὰ τῆς θυσίας αὐτοῦ
  choice: принеся в жертву самого себя
  rationale: Естественно по-русски выражает средство и самоотдачу Христа, подразумеваемую сочетанием «жертва его» в ближайшем контексте.
- source_word: πεφανέρωται
  choice: он явился
  rationale: Передаёт совершившееся явление Христа; русское прошедшее совершенного вида естественно выражает завершённое событие с сохраняющимся значением.
theological_decisions:
- issue: Смысл ἅπαξ применительно к жертве Христа
  choice: «один раз и навсегда»
  alternative: «однажды» или «один раз»
  rationale: Контраст с «многократно» и ход рассуждения подчёркивают не только однократность, но и неповторимость события.
- issue: Число и объём значения ἁμαρτίας
  choice: единственное число «грех»
  alternative: множественное число «грехи»
  rationale: Сохранено греческое единственное число, позволяющее понимать грех как реальность в целом, не исключая отдельных грехов.
- issue: Отношение αὐτοῦ к θυσίας
  choice: 'жертвой является сам Христос: «принеся в жертву самого себя»'
  alternative: «посредством его жертвы»
  rationale: Ближайший контекст говорит о принесении Христом самого себя; при этом примечание сохраняет грамматически менее явный вариант притяжательного прочтения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для широкого читателя; местоимения, относящиеся к Христу, даны со строчной буквы как обычная современная издательская норма и во избежание внесения отсутствующего в греческом тексте графического различия.
