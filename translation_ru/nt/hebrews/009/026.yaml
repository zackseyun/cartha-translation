  terminology: «Основание мира», «завершение веков», «грех» и «жертва» уместны. Единственное число «грех» верно сохраняет ἁμαρτίας. Для διὰ τῆς θυσίας αὐτοῦ предпочтительно основное нейтральное «посредством его жертвы»; контекстуальное понимание жертвы как принесения Христом самого себя следует вынести в примечание, а не утверждать как буквальное значение формы αὐτοῦ.
