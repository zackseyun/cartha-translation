  source_fidelity: 'Основной смысл передан точно: гипотетическая необходимость многократного страдания противопоставлена единственному явлению Христа при завершении веков для устранения греха. Однако «принеся в жертву самого себя» разворачивает греческое διὰ τῆς θυσίας αὐτοῦ («посредством его жертвы») в более определённую конструкцию и заменяет обозначение средства деепричастным действием. Контекст 9:26–28 поддерживает мысль о самоотдаче Христа, но сама генитивная конструкция может быть передана без такого разворачивания.'
