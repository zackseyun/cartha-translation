review_pass:
  verdict: revise
  source_fidelity: Основная заветная терминология передана верно, и примечание корректно сохраняет релевантную для ближайшего контекста возможность «завещание». Однако «после того, как совершилась смерть» излишне сводит генитив абсолютный θανάτου γενομένου к последовательности во времени и звучит по-русски неестественно. Кроме того, «получили обещанное вечное наследие» заменяет прямое дополнение τὴν ἐπαγγελίαν («обещание») на его предполагаемое содержание.
  naturalness: Текст в целом литературный, но выражение «совершилась смерть» не является естественным современным русским сочетанием. Перестановка придаточных делает причинно-целевую связь яснее.
  terminology: «Посредник», «новый завет», «искупление», «призванные» и «вечное наследие» уместны. «Обещание вечного наследия» точнее сохраняет структуру греческого текста без догматического уточнения.
  issues:
