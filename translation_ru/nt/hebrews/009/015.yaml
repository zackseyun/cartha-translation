    issue: Передача θανάτου γενομένου как «после того, как совершилась смерть».
    rationale: Генитив абсолютный обозначает состоявшееся событие как основание или условие; «после того, как» неоправданно акцентирует лишь временную последовательность, а «совершилась смерть» неестественно.
  - severity: medium
    issue: «Получили обещанное вечное наследие» вместо τὴν ἐπαγγελίαν ... τῆς αἰωνίου κληρονομίας.
    rationale: В оригинале получают именно «обещание», определённое генитивом «вечного наследия». Перевод должен не подменять обещание самим наследием.
