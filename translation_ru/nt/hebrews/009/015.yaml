- from: И потому Он — посредник нового завета[a], чтобы после того, как совершилась смерть ради искупления преступлений, совершённых при первом завете, призванные получили обещанное вечное наследие.
  to: И потому Он — посредник нового завета[a], чтобы призванные получили обещание вечного наследия, поскольку смерть наступила ради искупления преступлений, совершённых при первом завете.
