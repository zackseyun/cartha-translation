id: HEB.9.15
reference: Hebrews 9:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ διὰ τοῦτο διαθήκης καινῆς μεσίτης ἐστίν, ὅπως θανάτου γενομένου εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων τὴν ἐπαγγελίαν λάβωσιν οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/015.yaml
  text: And for this reason he is the mediator of a new covenant[a], so that, since a death has occurred for the redemption of the transgressions committed under the first covenant, those who have been called may receive the promise of the eternal inheritance.
translation:
  language: ru
  text: И потому Он — посредник нового завета[a], чтобы призванные получили обещание вечного наследия, поскольку смерть наступила ради искупления преступлений, совершённых при первом завете.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нового завещания». Греческое слово διαθήκη может означать и «завет», и «завещание»; в Евр. 9:16–17 обыгрывается это смысловое пересечение, однако здесь противопоставление первому завету поддерживает перевод «завет».'
    reason: Альтернативное значение, существенное для хода рассуждения в ближайшем контексте.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: И потому
  rationale: Естественно связывает стих с предшествующим рассуждением и сохраняет причинно-следственную силу выражения.
- source_word: διαθήκης καινῆς
  choice: нового завета
  rationale: В контексте противопоставления первому завету основным является значение «завет», хотя дальнейшие стихи используют смысловое пересечение со значением «завещание».
- source_word: μεσίτης
  choice: посредник
  rationale: Точный и общепонятный термин для того, кто устанавливает отношения между сторонами; соответствует заветному контексту.
- source_word: ὅπως
  choice: чтобы
  rationale: Передаёт целевое и результативное значение союза без искусственной тяжеловесности.
- source_word: θανάτου γενομένου
  choice: после того, как совершилась смерть
  rationale: Передаёт генитив абсолютный как наступившее событие, создающее основание для последующего результата; слово «смерть» сохранено без добавления имени субъекта.
- source_word: ἀπολύτρωσιν
  choice: искупления
  rationale: Сохраняет смысл освобождения ценой выкупа и уместно в жертвенном контексте Послания к евреям.
- source_word: τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων
  choice: преступлений, совершённых при первом завете
  rationale: «При первом завете» естественно передаёт временную и сферическую связь ἐπί с дательным; «совершённых» делает эту связь ясной по-русски.
- source_word: τὴν ἐπαγγελίαν ... τῆς αἰωνίου κληρονομίας
  choice: обещанное вечное наследие
  rationale: Естественная русская конструкция передаёт обещание как его обещанное содержание; связь обещания с вечным наследием сохраняется.
- source_word: λάβωσιν
  choice: получили
  rationale: Сослагательная форма после «чтобы» естественно выражает предполагаемый целью результат аористного конъюнктива.
- source_word: οἱ κεκλημένοι
  choice: призванные
  rationale: Кратко и точно передаёт субстантивированное перфектное пассивное причастие и состояние людей, уже получивших призвание.
- source_word: τῆς αἰωνίου κληρονομίας
  choice: вечное наследие
  rationale: Сохраняет идею непреходящего наследия и контраст временного с вечным в послании.
theological_decisions:
- issue: Подразумеваемое подлежащее при ἐστίν
  choice: Введено местоимение «Он», относящееся к Христу из ближайшего контекста.
  alternative: Оставить связку без выраженного подлежащего.
  rationale: Русское предложение требует ясного подлежащего; ближайший контекст однозначно указывает на Христа. Прописная буква соответствует принятому русскому библейскому регистру, не добавляя имени в текст.
- issue: Значение διαθήκη
  choice: В основном тексте — «завет».
  alternative: «Завещание».
  rationale: Противопоставление нового и первого заветов определяет основной смысл в этом стихе, но смысловая возможность «завещания», развиваемая в 9:16–17, сохранена в примечании.
- issue: Отношение «обещания» к «вечному наследию»
  choice: Передано как «получили обещанное вечное наследие».
  alternative: «Получили обещание вечного наследия».
  rationale: Греческая конструкция допускает понимание наследия как содержания обещания. Выбранный вариант звучит естественно и не означает, что призванные получают лишь словесное обещание, однако формально более близкий вариант также возможен.
- issue: Смерть как основание искупления
  choice: 'Сохранена без прямо названного субъекта: «совершилась смерть ради искупления».'
  alternative: «Христос умер ради искупления».
  rationale: Контекст указывает на смерть Христа, но греческий текст выражает это абстрактной конструкцией θανάτου γενομένου; перевод не делает подразумеваемое имя явным и сохраняет форму аргумента.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Синтаксис сделан плавным и доступным; сохранены причинная связь, целевая конструкция и богословски значимая неоднозначность слова διαθήκη. Единственный маркер [a] присутствует в основном тексте.
