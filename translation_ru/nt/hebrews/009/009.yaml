source:
  edition: SBLGNT
  text: ἥτις παραβολὴ εἰς τὸν καιρὸν τὸν ἐνεστηκότα, καθ’ ⸀ἣν δῶρά τε καὶ θυσίαι προσφέρονται μὴ δυνάμεναι κατὰ συνείδησιν τελειῶσαι τὸν λατρεύοντα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/009.yaml
  text: which is a parable for the present time[a], according to which both gifts and sacrifices are offered that are not able to perfect the worshiper with respect to conscience,
translation:
  language: ru
  text: 'Она служит образом для настоящего времени[a]: в соответствии с ним приносятся и дары, и жертвы, которые не способны привести поклоняющегося к совершенству в том, что касается совести.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «притчей»; или: «символом».'
    reason: Слово παραβολή может обозначать притчу, образное сопоставление или символ; в данном культовом контексте возможны разные русские соответствия.
lexical_decisions:
- source_word: ἥτις
  choice: Она
  rationale: Местоимение отсылает к ранее упомянутой скинии; самостоятельное «она» естественно продолжает мысль по-русски, не уточняя сверх греческого текста характер связи.
- source_word: παραβολὴ
  choice: образом
  rationale: В данном культовом контексте слово обозначает наглядное образное соответствие. «Образ» понятнее современному русскому читателю, чем «притча», которая обычно воспринимается как рассказ; буквальная альтернатива сохранена в сноске.
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: для настоящего времени
  rationale: Передаёт временную отнесённость образа и сохраняет возможное указание на действующий в рассуждении автора период, не превращая его явно в «век» или эпоху.
- source_word: καθ’ ἣν
  choice: в соответствии с ним
  rationale: Передаёт связь между описанным образом/установлением и совершаемым принесением даров и жертв; мужской род согласован с русским словом «образ».
- source_word: δῶρά τε καὶ θυσίαι
  choice: и дары, и жертвы
  rationale: Сохраняет оба культовых термина и парную конструкцию τε καὶ.
- source_word: προσφέρονται
  choice: приносятся
  rationale: Естественный русский культовый эквивалент настоящего страдательного залога, допускающий продолжающееся действие.
- source_word: μὴ δυνάμεναι
  choice: не способны
  rationale: Передаёт именно неспособность даров и жертв достичь названного результата и естественно сочетается с инфинитивом.
- source_word: κατὰ συνείδησιν
  choice: в том, что касается совести
  rationale: Ограничивает сферу недостижимого совершенства совестью, не подменяя объект глагола и не сводя смысл к субъективной искренности.
- source_word: τελειῶσαι
  choice: привести … к совершенству
  rationale: Сохраняет важную для Послания к евреям идею достижения предназначенной полноты или пригодности, не ослабляя её до простого улучшения.
- source_word: τὸν λατρεύοντα
  choice: поклоняющегося
  rationale: Передаёт субстантивированное причастие в единственном числе и культовый контекст служения Богу.
theological_decisions:
- issue: Значение παραβολή применительно к земной скинии
  choice: образ
  alternative: притча; прообраз
  rationale: «Образ» сохраняет фигуральное соответствие, не представляя скинию повествовательной притчей и не навязывая более узкую типологическую схему. Возможные лексические оттенки указаны в сноске.
- issue: Объект и сфера действия τελειῶσαι
  choice: поклоняющийся приводится к совершенству в том, что касается совести
  alternative: совесть поклоняющегося делается совершенной
  rationale: Греческий прямой объект — сам поклоняющийся, тогда как κατὰ συνείδησιν обозначает сферу или отношение. Перевод сохраняет эту грамматическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Формулировка сохраняет культовые термины «дары» и «жертвы», а также богословски значимое «привести к совершенству», но избегает архаизмов и трудной кальки «по совести».
