  text: καὶ σχεδὸν ἐν αἵματι πάντα καθαρίζεται κατὰ τὸν νόμον, καὶ χωρὶς αἱματεκχυσίας οὐ γίνεται ἄφεσις.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/022.yaml
  text: And according to the law[a], almost everything is cleansed with blood, and without the shedding of blood there is no forgiveness.
translation:
  language: ru
  text: И по закону почти всё очищается кровью, и без пролития крови не бывает прощения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отпущения». Греческое слово может обозначать освобождение или прощение; здесь имеется в виду прощение грехов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σχεδόν
  choice: почти
  rationale: 'Наречие ограничивает обобщение: не всякое очищение по закону совершалось посредством крови. «Почти» точно и естественно передаёт эту оговорку.'
- source_word: ἐν αἵματι
  choice: кровью
  rationale: Предлог ἐν здесь имеет инструментальное значение. Русский творительный падеж ясно передаёт средство ритуального очищения.
- source_word: πάντα
  choice: всё
  rationale: Субстантивированное среднее множественного числа охватывает предметы и обрядовые случаи, о которых идёт речь. В сочетании с «почти» форма «всё» звучит естественно и сохраняет широту обобщения.
- source_word: καθαρίζεται
  choice: очищается
  rationale: Настоящее время пассивного залога выражает обычный порядок, установленный законом. «Очищается» сохраняет ритуальный смысл и понятно современному читателю.
- source_word: κατὰ τὸν νόμον
  choice: по закону
  rationale: Оборот указывает на соответствие предписаниям Моисеева закона. «По закону» кратко и естественно передаёт этот смысл без дополнительного толкования.
- source_word: χωρὶς
  choice: без
  rationale: Прямо передаёт значение отсутствия необходимого условия.
- source_word: αἱματεκχυσίας
  choice: пролития крови
  rationale: Сложное существительное обозначает излияние или пролитие крови и в контексте сохраняет жертвенный оттенок.
- source_word: οὐ γίνεται
  choice: не бывает
  rationale: В сочетании с отвлечённым существительным оборот означает, что прощение не происходит. «Не бывает» сохраняет динамический оттенок γίνεται и звучит как обобщающий принцип.
- source_word: ἄφεσις
  choice: прощения
  rationale: В данном жертвенном контексте слово означает прощение, то есть отпущение грехов. «Прощение» — ясный современный эквивалент, тогда как «отпущение» более традиционно и может быть менее прозрачным.
theological_decisions:
- issue: Значение ἄφεσις в контексте жертвоприношений
  choice: прощение
  alternative: отпущение
  rationale: Контекст рассуждения Послания к евреям связывает кровь с устранением вины греха. «Прощение» ясно выражает этот смысл, не привязывая стих к узкой конфессиональной формулировке; возможное «отпущение» отмечено в сноске.
- issue: Объём утверждения о кровном очищении
  choice: сохранить ограничение «почти»
  alternative: передать как безусловное «всё очищается кровью»
  rationale: Слово σχεδόν прямо ограничивает утверждение автора. Его нельзя опускать или превращать в абсолютное правило.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной и легко воспринимаемой синтаксической формой. Сохранены параллелизм двух частей стиха, ритуальная лексика и авторская оговорка «почти».
