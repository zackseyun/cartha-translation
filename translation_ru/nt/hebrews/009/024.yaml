revisions:
- from: Ведь Мессия вошёл не в рукотворные святыни, образы истинных святынь[a], а в само небо, чтобы теперь предстать перед лицом Бога ради нас.
  to: Ибо Мессия вошёл не в рукотворные святыни — подобия подлинных, — а в само небо, чтобы теперь предстать перед лицом Бога за нас.
  rationale: Исправлены начальный союз, передача ἀντίτυπα τῶν ἀληθινῶν и ὑπὲρ ἡμῶν. Сохранены множественное число «святыни», титульное «Мессия», усиление «само небо» и буквальный образ «перед лицом Бога». Сноска продолжает быть привязана к выражению «подобия подлинных» (маркер [a] следует поставить после этого выражения).
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:51:04Z'
review_pass:
  verdict: revise
  source_fidelity: В целом переданы противопоставление рукотворного и небесного, усиление «само небо», временное «теперь» и цель явления перед Богом. Однако «ради нас» преимущественно выражает действие ради чьей-либо пользы или по причине кого-либо и слабее передаёт представительское «ὑπὲρ ἡμῶν». «За нас» в данном контексте точнее и не навязывает частную догматическую интерпретацию. Формула «истинных святынь» допустима контекстуально, но уточняет субстантивированное τῶν ἀληθινῶν; лучше сохранить его эллиптичность.
  naturalness: «Ведь» возможно, но начальное «Ибо» естественнее в связном библейском рассуждении и точнее передаёт γάρ. Оборот «подобия подлинных» литературен и ясен в непосредственной связи со словом «святыни»; он также избегает ненужного добавления существительного в греческом тексте.
  terminology: «Мессия», «рукотворные святыни», «само небо» и «перед лицом Бога» удачны. Для ἀντίτυπα предпочтено «подобия», поскольку оно естественно выражает соответствие земного небесному, не утверждая механического копирования. Сноска поясняет эллиптическое «подлинных» и возможные лексические оттенки.
  issues:
  - severity: medium
    issue: «ради нас» для ὑπὲρ ἡμῶν
    rationale: Выражение передаёт общую направленность действия на благо людей, но недостаточно ясно сохраняет значение действия «за нас», от лица людей, которое существенно в контексте явления Мессии перед Богом.
  - severity: low
    issue: Уточнение «истинных святынь»
    rationale: Греческое τῶν ἀληθινῶν субстантивировано и не повторяет «святыни». Добавление слова «святынь» контекстуально понятно, но несколько сужает оставленную автором формулировку.
  revised_text: Ибо Мессия вошёл не в рукотворные святыни — подобия подлинных, — а в само небо, чтобы теперь предстать перед лицом Бога за нас.
  revised_footnotes:
