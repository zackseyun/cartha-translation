source:
  edition: SBLGNT
  text: οὐ γὰρ εἰς χειροποίητα ⸂εἰσῆλθεν ἅγια⸃ Χριστός, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ’ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/024.yaml
  text: For Messiah did not enter into holy places made by hands[a], copies of the true things, but into heaven itself[c][b], now to appear in the presence of God on our behalf.
translation:
  language: ru
  text: Ибо Мессия вошёл не в рукотворные святыни — подобия подлинных, — а в само небо, чтобы теперь предстать перед лицом Бога за нас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χριστός
  choice: Мессия
  rationale: Передаёт значение титула, актуальное в рассуждении о мессианском первосвященническом служении; не превращает титул в простое личное имя.
- source_word: χειροποίητα ἅγια
  choice: рукотворные святыни
  rationale: «Рукотворные» сохраняет противопоставление созданного людьми земного святилища небесной реальности, а множественное «святыни» отражает форму ἅγια без сужения до одного отделения скинии.
- source_word: ἀντίτυπα τῶν ἀληθινῶν
  choice: образы истинных святынь
  rationale: «Образы» естественно выражает соответствие земных святынь подлинной небесной реальности. Слово «святынь» восстановлено из контекста ἅγια; буквальная субстантивированная форма отмечена в сноске.
- source_word: αὐτὸν τὸν οὐρανόν
  choice: само небо
  rationale: Усилительное αὐτό передано словом «само», подчёркивающим вход не в земное подобие, а непосредственно в небесную реальность.
- source_word: νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ
  choice: чтобы теперь предстать перед лицом Бога
  rationale: Инфинитив передан как цель входа; «перед лицом Бога» сохраняет конкретный библейский образ и остаётся естественным для современного литературного русского языка.
- source_word: ὑπὲρ ἡμῶν
  choice: ради нас
  rationale: Выражает действие в нашу пользу и от нашего имени, не сужая смысл до одной конкретной теории искупления.
theological_decisions:
- issue: Культовое значение ἅγια
  choice: святыни
  alternative: святилище; Святое святых
  rationale: Множественное число сохранено, чтобы не определять без необходимости, идёт ли речь о святилище в целом или об одном его отделении.
- issue: Титул Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном аргументе действует титульный смысл слова; «Мессия» прямо передаёт его значение и сохраняет мессианскую направленность текста.
- issue: Значение ὑπὲρ ἡμῶν
  choice: ради нас
  alternative: за нас; от нашего имени
  rationale: Формулировка сохраняет представительское и благотворное для людей действие Мессии, не добавляя более узкого догматического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Сохранены культовая лексика, множественное число ἅγια и выражение «перед лицом Бога»; синтаксис упрощён лишь настолько, чтобы стих звучал ясно и естественно.
