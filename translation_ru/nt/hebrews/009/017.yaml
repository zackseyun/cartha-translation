  text: διαθήκη γὰρ ἐπὶ νεκροῖς βεβαία, ἐπεὶ ⸀μήποτε ἰσχύει ὅτε ζῇ ὁ διαθέμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
translation:
  language: ru
  text: Ибо завет[a] действителен при смерти[b], поскольку он не имеет силы, пока жив тот, кто его установил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ибо завещание действительно при смерти, поскольку оно не имеет силы, пока жив тот, кто его составил». Греческое слово может означать как «завет», так и «завещание».'
    reason: alternative_reading
  - marker: b
    text: 'Греческое выражение передано сжато и допускает разные понимания: оно может относиться к смерти завещателя в смысле завещания либо к смерти, связанной с утверждением завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: завет
  rationale: В Евр. 8–10 преобладает контекст завета, особенно тема первого и нового заветов и их утверждения кровью. При этом возможное значение «завещание» сохранено в примечании.
- source_word: ἐπὶ νεκροῖς
  choice: над умершими
  rationale: 'Буквально и сжато передаёт греческое выражение, не снимая его неоднозначности: речь может идти либо об умерших лицах в контексте завещания, либо о смерти, связанной с утверждением завета.'
- source_word: βεβαία
  choice: обретает силу
  rationale: Передаёт действенность и обязательную силу завета или завещания; по-русски естественнее, чем буквальное «прочен».
- source_word: ἐπεὶ
  choice: поскольку
  rationale: Сохраняет причинно-пояснительную связь между частями стиха.
- source_word: μήποτε
  choice: никогда не
  rationale: В сочетании с ἰσχύει здесь означает отсутствие силы в любое время при указанном условии.
- source_word: ἰσχύει
  choice: действует
  rationale: В данном контексте обозначает вступление юридического или заветного установления в действие.
- source_word: ὅτε ζῇ
  choice: пока жив
  rationale: Естественно передаёт временное противопоставление смерти продолжающейся жизни.
- source_word: ὁ διαθέμενος
  choice: тот, кто его установил
  rationale: Формулировка применима как к установившему завет, так и к составившему завещание и потому сохраняет смысловую открытость греческого причастия.
theological_decisions:
- issue: Передавать ли διαθήκη как «завет» или как «завещание».
  choice: В основном тексте — «завет», с вариантом «завещание» в примечании.
  alternative: «Ведь завещание действительно лишь после смерти, поскольку оно никогда не действует, пока жив тот, кто его составил».
  rationale: Широкий контекст Послания к евреям имеет заветный характер, однако в 9:16–17 возможен юридический смысл завещания. Примечание сохраняет эту реальную неоднозначность.
- issue: Как передать неоднозначное ἐπὶ νεκροῖς.
  choice: Сохранить открытую формулировку «над умершими».
  alternative: «после смерти» или «при наличии умерших».
  rationale: Греческая фраза сжата и допускает связь как со смертью завещателя, так и со смертью жертв при утверждении завета; основной текст не должен без необходимости выбирать одно толкование.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный регистр. Необычность выражения «над умершими» намеренно сохранена ради смысловой неоднозначности оригинала; порядок маркеров [b][a] соответствует местам, к которым относятся примечания.
