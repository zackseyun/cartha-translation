- from: Ведь завет обретает силу над умершими[b][a], поскольку он никогда не действует, пока жив тот, кто его установил.
  to: Ибо завет[a] действителен при смерти[b], поскольку он не имеет силы, пока жив тот, кто его установил.
  rationale: Исправление заменяет непригодную для современного русского кальку «над умершими» на «при смерти». Эта формулировка остаётся краткой и не определяет, идёт ли речь о смерти составившего завещание или о смерти, связанной с заветным утверждением. Перестановка маркеров обеспечивает точную привязку обеих сносок.
  reviewer_model: gpt-5.6-terra
