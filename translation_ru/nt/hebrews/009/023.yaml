  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
translation:
  language: ru
  text: Итак, образы[a] того, что находится на небесах, необходимо было очищать[b] этим, а само небесное — жертвами[c], лучшими, чем эти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «копии», «отображения».
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол означает «очищать»; здесь он принадлежит языку обрядового очищения.
    reason: lexical_alternative
  - marker: c
    text: 'В греческом тексте стоит множественное число: «жертвами», хотя в контексте Послания речь сосредоточена на однократном приношении Мессии.'
    reason: theological_tension
lexical_decisions:
- source_word: Ἀνάγκη οὖν
  choice: Итак, … необходимо было
  rationale: «Итак» передаёт вывод из предшествующего рассуждения, а прошедшее время естественно соответствует ретроспективному объяснению обрядов скинии.
- source_word: τὰ ὑποδείγματα
  choice: копии
  rationale: Слово обозначает земные соответствия небесному; «копии» ясно сохраняет противопоставление небесному оригиналу, не превращая их в «прообразы», что по-русски может означать оригинал или предвосхищение.
- source_word: τῶν ἐν τοῖς οὐρανοῖς
  choice: того, что на небесах
  rationale: Сохраняется предложная конструкция и множественное число οὐρανοῖς, без отождествления этой фразы с последующим субстантивированным прилагательным.
- source_word: τούτοις καθαρίζεσθαι
  choice: очищать этими жертвами
  rationale: Русская неопределённо-личная конструкция естественно передаёт греческий пассивный инфинитив. Слово «жертвами» восполняет очевидный из контекста подразумеваемый элемент при указательном местоимении.
- source_word: αὐτὰ δὲ τὰ ἐπουράνια
  choice: а само небесное
  rationale: Субстантивированное «небесное» сохраняет обобщённость греческого выражения и усиление αὐτά, не уточняя толковательно, идёт ли речь о святилище, реалиях или людях.
- source_word: κρείττοσι θυσίαις παρὰ ταύτας
  choice: жертвами, лучшими, чем эти
  rationale: Сохранены сравнительная конструкция и множественное число «жертвами», несмотря на то что далее Послание подчёркивает однократность жертвы Мессии.
theological_decisions:
- issue: Что именно представляет собой «небесное» и почему оно нуждается в очищении
  choice: Сохранить выражение «само небесное» и язык очищения без поясняющего перефразирования.
  alternative: Уточнить как «небесное святилище», «небесные реалии» или принадлежащих небесному миру людей.
  rationale: Греческий текст прямо противопоставляет копии самому небесному и говорит об очищении обоих. Перевод сохраняет эту богословскую напряжённость.
- issue: Множественное число θυσίαις при однократной жертве Мессии
  choice: Передать множественным числом «жертвами».
  alternative: Согласовать с более широким контекстом и перевести единственным числом «жертвой».
  rationale: Оригинал употребляет множественное число; его нельзя молча гармонизировать с учением Послания об однократном приношении.
translation_notes:
  register: Современный литературный русский язык; синтаксис сделан естественным без утраты логического противопоставления. Оборот «само небесное» намеренно остаётся широким и несколько необычным, поскольку более конкретная формулировка разрешила бы неоднозначность оригинала.
