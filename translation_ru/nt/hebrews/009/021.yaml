base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/021.yaml
  text: And likewise he sprinkled with the blood both the tabernacle and all the vessels of the ministry[a][b].
translation:
  language: ru
  text: Также он окропил кровью и скинию[a], и всю богослужебную утварь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шатёр». Здесь имеется в виду священная скиния.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все предметы служения»; «всю утварь служения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνή
  choice: скиния
  rationale: В контексте Послания к евреям слово обозначает священную походную скинию, а не обычный шатёр; традиционный русский термин точно передаёт культовое значение.
- source_word: σκεύη
  choice: принадлежности
  rationale: Слово охватывает различные предметы и орудия, употреблявшиеся при служении. «Принадлежности» естественно звучит по-русски и не сужает значение до сосудов в буквальном смысле.
- source_word: λειτουργία
  choice: служение
  rationale: Здесь имеется в виду священническое богослужебное служение; «служение» сохраняет культовый смысл без излишней технической окраски.
- source_word: αἷμα
  choice: кровь
  rationale: Прямое обозначение жертвенной крови в обрядовом контексте.
- source_word: ὁμοίως
  choice: также
  rationale: Связывает действие с описанным в предыдущем стихе окроплением и естественно передаёт значение «подобным образом».
- source_word: ῥαντίζω
  choice: окропил
  rationale: Обычный и точный русский глагол для обрядового нанесения крови посредством кропления.
- source_word: καὶ ... δὲ καὶ
  choice: и скинию, и все принадлежности
  rationale: Парная конструкция «и … и …» передаёт охват обоих объектов, не придавая δέ неуместного противительного значения.
theological_decisions:
- issue: Связь стиха с описанием Моисеева обряда в Исходе
  choice: Передать стих как краткое утверждение об окроплении скинии и всех принадлежностей для служения, не добавляя согласующих пояснений.
  alternative: Расширить перевод объяснением исторического фона или предполагаемых расхождений с повествованием Исхода.
  rationale: Автор сам даёт обобщённое описание обряда; перевод должен сохранить формулировку и возможное межтекстовое напряжение, а не разрешать его посредством добавлений.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Термин «скиния» сохранён как точное и общеупотребительное обозначение святилища; менее понятное «сосуды служения» заменено естественным и более широким выражением «принадлежности для служения».
