  text: χρυσοῦν ἔχουσα θυμιατήριον καὶ τὴν κιβωτὸν τῆς διαθήκης περικεκαλυμμένην πάντοθεν χρυσίῳ, ἐν ᾗ στάμνος χρυσῆ ἔχουσα τὸ μάννα καὶ ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα καὶ αἱ πλάκες τῆς διαθήκης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/004.yaml
  text: having the golden censer[a], and the ark of the covenant covered on all sides with gold, in which were a golden jar holding the manna, Aaron’s staff that budded, and the tablets of the covenant,
translation:
  language: ru
  text: где находились золотой жертвенник для благовоний[a] и ковчег завета, со всех сторон обложенный золотом. В нём были золотой сосуд с манной, посох Аарона, давший побеги, и скрижали завета.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «золотая кадильница». Греческое слово может обозначать как жертвенник для воскурения благовоний, так и кадильницу; его значение здесь остаётся спорным.'
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσοῦν ἔχουσα θυμιατήριον
  choice: где находились золотой жертвенник для благовоний
  rationale: Причастный оборот продолжает описание Святого святых из предыдущего стиха. θυμιατήριον допускает значения жертвенника для воскурения и кадильницы; в основном тексте выбран естественный для описания устройства скинии референт, а подлинная неоднозначность отмечена в сноске.
- source_word: τὴν κιβωτὸν τῆς διαθήκης
  choice: ковчег завета
  rationale: Устоявшееся и точное русское наименование священного ларца; «завет» соответствует διαθήκη в данном контексте.
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: со всех сторон обложенный золотом
  rationale: Передаёт результат совершённого покрытия и усиление πάντοθεν — «со всех сторон»; «обложенный золотом» естественно для культового предмета.
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: золотой сосуд с манной
  rationale: στάμνος обозначает сосуд или кувшин; нейтральное «сосуд» понятно и не уточняет форму сверх текста. Оборот «с манной» естественно передаёт содержимое.
- source_word: ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: расцветший посох Аарона
  rationale: ῥάβδος здесь естественно передаётся словом «посох», а βλαστήσασα указывает на известное чудесное произрастание; «расцветший» звучит кратко и современно.
- source_word: αἱ πλάκες τῆς διαθήκης
  choice: скрижали завета
  rationale: «Скрижали» — общепонятный и укоренившийся русский библейский термин; материал в стихе прямо не назван.
theological_decisions:
- issue: Значение θυμιατήριον в описании Святого святых
  choice: жертвенник для благовоний
  alternative: золотая кадильница
  rationale: 'Слово может обозначать предмет для воскурения или жертвенник благовоний. Основной текст выбирает жертвенник как вероятный культовый референт, но не устраняет давний лексический и исторический вопрос: вариант «кадильница» сохранён в сноске.'
- issue: Связь ἔχουσα с предыдущим контекстом
  choice: где находились
  alternative: имевшее
  rationale: Форма женского рода относится к «скинии» в стихе 3, а не к отдельному предмету. Русское придаточное естественно сохраняет продолжение синтаксиса и не создаёт ложной связи.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой («ковчег», «скрижали»). Синтаксис сделан ясным и пригодным для чтения вслух; запятая исходного фрагмента завершена точкой, поскольку русский текст представлен как самостоятельный стих.
