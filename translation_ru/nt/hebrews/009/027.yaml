id: HEB.9.27
reference: Hebrews 9:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ καθ’ ὅσον ἀπόκειται τοῖς ἀνθρώποις ἅπαξ ἀποθανεῖν, μετὰ δὲ τοῦτο κρίσις,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/027.yaml
  text: And just as it is appointed for men to die once[a], and after this, judgment,
translation:
  language: ru
  text: И как людям определено однажды умереть, а после этого — суд,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὅσον
  choice: как
  rationale: Оборот вводит сопоставление, которое завершается в следующем стихе; русское «как» естественно подготавливает соответствующее «так и» в Евр. 9:28.
- source_word: ἀπόκειται
  choice: определено
  rationale: В сочетании с дательным падежом и инфинитивом глагол выражает установленный или предназначенный удел; «определено» точно и естественно передаёт этот смысл.
- source_word: τοῖς ἀνθρώποις
  choice: людям
  rationale: Греческое существительное во множественном числе имеет здесь обобщающее значение и относится ко всему человечеству, а не только к мужчинам.
- source_word: ἅπαξ
  choice: однажды
  rationale: Наречие указывает на однократность смерти. «Однажды» сохраняет смысл, не добавляя усиленного значения «раз и навсегда».
- source_word: ἀποθανεῖν
  choice: умереть
  rationale: Прямое и естественное соответствие инфинитиву.
- source_word: μετὰ δὲ τοῦτο
  choice: а после этого
  rationale: Оборот обозначает последовательность; союз «а» сохраняет лёгкое противопоставление и естественно связывает смерть с последующим судом.
- source_word: κρίσις
  choice: суд
  rationale: Слово обозначает судебное решение или разбирательство вообще. «Суд» сохраняет широту значения и не сужает его до осуждения.
theological_decisions:
- issue: Обобщающее значение τοῖς ἀνθρώποις
  choice: Передано словом «людям», относящимся ко всему человечеству
  alternative: мужчинам; человекам
  rationale: Контекст ясно указывает на человечество в целом. Современное русское «людям» точно передаёт эту общую референцию без ложного ограничения по полу.
- issue: Смысл κρίσις после смерти
  choice: Передано просто как «суд»
  alternative: осуждение; последний суд
  rationale: Сам стих утверждает, что после смерти следует суд, но не уточняет здесь его исход и не излагает подробную эсхатологическую схему.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и лаконичной структуры оригинала. Начальное «И как» намеренно оставляет предложение открытым к продолжению сравнения в Евр. 9:28. Тире перед «суд» естественно передаёт эллиптическую конструкцию оригинала, где сказуемое подразумевается.
