  source_fidelity: Текст точно передаёт греческую конструкцию сопоставления καθ’ ὅσον («И как»), установленность смерти для людей (ἀπόκειται τοῖς ἀνθρώποις), её однократность (ἅπαξ) и последующий суд (μετὰ δὲ τοῦτο κρίσις). Открытая сравнительная конструкция уместна, поскольку завершается в следующем стихе.
