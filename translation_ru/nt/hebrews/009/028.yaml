source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/028.yaml
  text: so also the Messiah[a], having been offered once to bear the sins of many, will appear a second time, apart from sin, to those who eagerly await him, for salvation.
translation:
  language: ru
  text: Так и Христос, однажды принесённый в жертву, чтобы понести грехи многих, явится во второй раз — без связи с грехом[a] — тем, кто с нетерпением ожидает Его, для спасения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не для того, чтобы снова понести грех», как при первом принесении в жертву.'
    reason: Сноска сохраняет контекстуально вероятное пояснение выражения «без связи с грехом», не превращая его в единственно возможную формулировку основного текста.
lexical_decisions:
- source_word: οὕτως καὶ
  choice: так и
  rationale: Передаёт сопоставление с участью людей в предыдущем стихе и естественно звучит по-русски.
- source_word: ὁ Χριστός
  choice: Христос
  rationale: В современном русском библейском употреблении «Христос» естественно сохраняет значение мессианского титула и не сводится здесь к простому личному имени.
- source_word: ἅπαξ
  choice: однажды
  rationale: Точно передаёт однократность события, не добавляя отсутствующего в самом слове уточнения «раз и навсегда».
- source_word: προσενεχθεὶς
  choice: принесённый в жертву
  rationale: Сохраняет пассивную форму аористного причастия; добавление «в жертву» естественно выражает жертвенный смысл глагола в контексте, не вводя прямо не выраженного возвратного «принёс Себя».
- source_word: εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας
  choice: чтобы понести грехи многих
  rationale: Передаёт цель и сохраняет жертвенно-искупительное звучание ἀναφέρω, а также вероятную связь с Ис 53.
- source_word: ἐκ δευτέρου
  choice: во второй раз
  rationale: Ясно выражает второе явление и сохраняет противопоставление первому пришествию и жертвоприношению.
- source_word: χωρὶς ἁμαρτίας
  choice: уже без связи с грехом
  rationale: Сохраняет краткость и некоторую неоднозначность греческой фразы, одновременно избегая возможного ошибочного понимания русского «без греха» как утверждения лишь о личной безгрешности Христа.
- source_word: ὀφθήσεται
  choice: явится
  rationale: Идиоматично передаёт эсхатологическое употребление будущей пассивной формы ὁράω.
- source_word: τοῖς αὐτὸν ἀπεκδεχομένοις
  choice: тем, кто с нетерпением ожидает Его
  rationale: Выражает напряжённое, исполненное надежды ожидание, заключённое в ἀπεκδέχομαι.
- source_word: εἰς σωτηρίαν
  choice: для спасения
  rationale: Кратко и естественно передаёт направленность или цель, не уточняя сверх текста, чьё именно спасение имеется в виду.
theological_decisions:
- issue: Смысл выражения χωρὶς ἁμαρτίας при втором явлении Христа
  choice: «уже без связи с грехом» — формулировка оставлена сдержанной и близкой к греческой.
  alternative: «не для того, чтобы снова понести грех» или «не для решения вопроса греха».
  rationale: Контекст указывает, что второе явление, в отличие от первого принесения в жертву, не связано с несением грехов. Однако пояснительный смысл не подменяет краткую и допускающую оттенки формулировку оригинала в основном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Синтаксис сохраняет развернутое противопоставление первого принесения Христа в жертву и Его второго явления; тире выделяют богословски значимую фразу, не нарушая читаемости.
