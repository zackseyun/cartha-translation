lexical_decisions:
- source_word: Διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения о стойкости в испытаниях и Божьем воспитании.
- source_word: τὰς παρειμένας χεῖρας
  choice: опустившиеся руки
  rationale: Сохраняет телесный образ рук, бессильно опущенных от усталости или уныния; притяжательное местоимение в русском не требуется.
- source_word: τὰ παραλελυμένα γόνατα
  choice: ослабевшие колени
  rationale: Передаёт состояние наступившей слабости, выраженное перфектным причастием, не создавая неуместного клинического смысла паралича.
- source_word: ἀνορθώσατε
  choice: укрепите
  rationale: В данном призыве глагол означает восстановить силу и способность держаться прямо; «укрепите» естественно выражает смысл, тогда как телесный образ сохраняют упомянутые руки и колени.
theological_decisions:
- issue: Метафорический призыв, выраженный образом телесной слабости
  choice: Передать повеление как призыв вновь обрести силу и стойкость, сохранив образы рук и коленей.
  alternative: 'Более формально: «поднимите опущенные руки и распрямите ослабевшие колени».'
  rationale: Контекст говорит о стойкости, воспитании и продолжении пути. Формулировка перекликается с Ис 35:3 в греческой традиции и не сводится лишь к указанию принять определённую позу.
translation_notes:
  register: Современный литературный русский язык; краткий и торжественный призыв. Сохранены телесные образы и логическая связь с предыдущим отрывком, при этом метафора звучит естественно для обычного читателя.
