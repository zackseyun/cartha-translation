  text: И выравнивайте прямые пути для своих ног[a], чтобы хромлющее не уклонилось[b], а, напротив, исцелилось.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эти слова перекликаются с Притчами 4:26 и продолжают образ упорядоченного движения по жизненному пути.
    reason: cross_reference
  - marker: b
    text: 'Или: «не было вывихнуто». В рамках телесного образа греческий глагол может иметь более выраженный медицинский оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχιὰς
  choice: пути
  rationale: Слово может обозначать колеи или следы, но в данном наставлении «пути» естественно передаёт образ жизненного движения и сохраняет связь с Притчами 4:26.
- source_word: ὀρθὰς
  choice: прямые
  rationale: Определение указывает на прямой, правильно направленный путь; «прямые» точно и естественно сохраняет образ.
- source_word: ποιεῖτε
  choice: прокладывайте
  rationale: Настоящее повелительное наклонение выражает продолжающееся действие. «Прокладывайте» естественно сочетается с «путями» и передаёт деятельный смысл ποιεῖτε.
- source_word: τοῖς ποσὶν ὑμῶν
  choice: для своих ног
  rationale: 'Дательный падеж лучше всего выражает предназначение: пути следует прокладывать для собственных ног. Возвратное «своих» естественно по-русски при подлежащем во втором лице множественного числа.'
- source_word: τὸ χωλὸν
  choice: хромое
  rationale: Субстантивированное прилагательное среднего рода оставлено без уточняющего существительного, чтобы не ограничивать образ ни буквальной хромотой, ни духовной слабостью.
- source_word: ἐκτραπῇ
  choice: не уклонилось
  rationale: Глагол может означать уклонение в сторону, а в телесном образе — вывих. Основной текст сохраняет широкий смысл, медицинский оттенок отмечен в сноске.
- source_word: ἰαθῇ
  choice: исцелилось
  rationale: Глагол обычно означает исцеление; перевод сохраняет телесный и восстановительный образ.
- source_word: μᾶλλον
  choice: а, напротив
  rationale: 'Оборот ясно передаёт противопоставление двух исходов: не уклонение, а исцеление.'
theological_decisions:
- issue: Буквальный или метафорический смысл телесного образа
  choice: Сохранить в основном тексте телесную образность, не уточняя, обозначает ли «хромое» физическую немощь, духовную слабость или уязвимого человека в общине.
  alternative: Передать как «духовно слабый» либо прямо назвать хромую ногу.
  rationale: Греческий текст оставляет референт обобщённым, а контекст наставления допускает одновременно телесную и нравственно-духовную образность; уточнение неоправданно снимало бы эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным библейским звучанием. Необычная форма «хромое» намеренно сохраняет обобщённость греческого среднего рода и не разрешает образ преждевременно.
