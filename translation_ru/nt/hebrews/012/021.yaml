  text: καί, οὕτω φοβερὸν ἦν τὸ φανταζόμενον, Μωϋσῆς εἶπεν· Ἔκφοβός εἰμι καὶ ἔντρομος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/021.yaml
  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
translation:
  language: ru
  text: 'И столь устрашающим было это зрелище, что Моисей сказал[a][b]: «Я объят страхом и трепещу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что являлось» либо «видимое явление». Греческое выражение указывает на видимое проявление на Синае.'
    reason: lexical_alternative
  - marker: b
    text: Эти слова не являются дословной цитатой из Ветхого Завета, но отражают страх Моисея, связанный с событиями у Синая; ср. Втор. 9:19.
    reason: cross_reference
lexical_decisions:
- source_word: καί
  choice: И
  rationale: Связывает стих с предшествующим описанием Синая; простой союз естественно продолжает повествование.
- source_word: οὕτω φοβερὸν ἦν
  choice: столь устрашающим было
  rationale: Передаёт усилительную силу οὕτω и вызывающий страх характер явления без архаичной тяжеловесности.
- source_word: τὸ φανταζόμενον
  choice: это зрелище
  rationale: Обозначает видимое явление на Синае; «зрелище» естественно передаёт воспринимаемую глазами картину, а возможная буквальная альтернатива отмечена в сноске.
- source_word: Μωϋσῆς εἶπεν
  choice: Моисей сказал
  rationale: Прямое и общепринятое соответствие имени и повествовательного глагола.
- source_word: Ἔκφοβός εἰμι
  choice: Я объят страхом
  rationale: Передаёт сильный страх, выраженный прилагательным ἔκφοβος, и сохраняет его отдельно от последующего упоминания дрожи.
- source_word: καὶ ἔντρομος
  choice: и трепещу
  rationale: Передаёт физическую дрожь от страха и сохраняет координацию двух греческих характеристик.
theological_decisions:
- issue: Связь слов Моисея с ветхозаветным повествованием о Синае
  choice: В основном тексте прямо сохранить утверждение, что Моисей произнёс эти слова в связи с устрашающим явлением.
  alternative: Истолковать фразу в тексте как свободное обобщение реакции Моисея или как дословную цитату конкретного ветхозаветного стиха.
  rationale: Греческий текст прямо вводит речь Моисея, но её формулировка не является дословной цитатой сохранившегося текста Ветхого Завета; это напряжение следует сохранить, пояснив его в сноске, а не гармонизируя в переводе.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Формулировка «объят страхом и трепещу» сохраняет два отдельных элемента греческого текста — сильный страх и дрожь — без конфессионального истолкования.
