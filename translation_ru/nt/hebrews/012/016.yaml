source:
  edition: SBLGNT
  text: μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ, ὃς ἀντὶ βρώσεως μιᾶς ἀπέδετο τὰ πρωτοτόκια ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/016.yaml
  text: that no one be sexually immoral or godless like Esau, who sold his own birthright for a single meal.
translation:
  language: ru
  text: чтобы никто не был сексуально безнравственным или человеком, не чтущим святыни, подобно Исаву, который за одну трапезу продал свои права первенца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρνος
  choice: блудник
  rationale: Обозначает человека, предающегося половой распущенности; «блудник» кратко и прямо передаёт нравственно-религиозный смысл в данном перечне.
- source_word: βέβηλος
  choice: человек, пренебрегающий святыней
  rationale: Слово буквально противопоставляет обыденное или несвященное святому и здесь характеризует человека, который не ценит священного. Такое выражение яснее современному читателю, чем малопонятное «нечестивый», и точнее, чем более широкое «безбожный».
- source_word: ἀντὶ βρώσεως μιᾶς
  choice: за одну порцию еды
  rationale: Передаёт обмен первородства на единственный приём или порцию пищи; сохраняет акцент на ничтожности немедленной выгоды.
- source_word: ἀπέδετο
  choice: продал
  rationale: Обычное значение глагола — «продал»; в контексте Бытия это естественное обозначение сделки.
- source_word: τὰ πρωτοτόκια ἑαυτοῦ
  choice: своё первородство
  rationale: Речь идёт о правах и преимуществах первенца, а не просто о порядке рождения.
theological_decisions:
- issue: Относится ли определение «блудник» непосредственно к Исаву
  choice: Сохранить синтаксическую возможность связи обоих определений с Исавом, не утверждая её отдельно
  alternative: Поставить знак или перестроить фразу так, чтобы Исав был примером лишь пренебрежения святыней
  rationale: Греческая конструкция допускает чтение, при котором ὡς Ἠσαῦ соотносится с обоими обозначениями либо прежде всего с ближайшим βέβηλος. Перевод не должен искусственно устранять эту неоднозначность.
- issue: Смысл βέβηλος
  choice: человек, пренебрегающий святыней
  alternative: безбожный
  rationale: Контекст продажи первородства подчёркивает презрение к священной ценности и привилегии, тогда как «безбожный» может ошибочно звучать как прямое утверждение атеизма.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского увещания. Синтаксис продолжает зависимую конструкцию предыдущего контекста («чтобы не было…»). «Блудник» сохраняет традиционную библейскую ёмкость, а описательная передача βέβηλος обеспечивает ясность без конфессионального сужения.
