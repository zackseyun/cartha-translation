review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: πόρνος — сексуально безнравственный человек, βέβηλος характеризует пренебрежение священным, а Исав продал принадлежащие ему права первенца за одну трапезу. Однако «ни … ни» меняет греческое разделительное ἢ («или»), а «порция еды» уже, чем βρῶσις («еда, трапеза»).'
  naturalness: Исходная фраза понятна, но «человека, пренебрегающего святыней» несколько тяжеловесно, а «порция еды» разговорно-конкретно. Предлагаемая формулировка сохраняет литературный, увещевательный регистр и звучит естественнее.
  terminology: «Блудник» допустим в библейском регистре, но «сексуально безнравственный» яснее современному читателю и не ограничивает термин определённой разновидностью проступка. «Человек, не чтущий святыни» передаёт βέβηλος без ложного оттенка атеизма, который может вызывать «безбожный». «Права первенца» раскрывает τὰ πρωτοτόκια как статусные права, а не факт рождения.
  issues:
  - severity: medium
    issue: Разделительный союз ἢ передан соединением «ни … ни».
    rationale: В греческом тексте сказано «блудник или βέβηλος», а не два независимо запрещённых класса, соединённых русской отрицательной парой. Следует сохранить разделительную конструкцию.
  - severity: low
    issue: «За одну порцию еды» чрезмерно конкретизирует βρώσεως μιᾶς.
    rationale: βρῶσις означает еду или трапезу; «порция» может обозначать количество пищи и не обязательно единственный приём пищи. «За одну трапезу» ближе к исходному выражению и к контексту Бытия.
  - severity: low
    issue: Позиция «подобного Исаву» синтаксически привязывает сравнение прежде всего ко второму определению.
    rationale: Греческое ὡς Ἠσαῦ после обоих определений допускает спорную сферу действия; русскую фразу лучше построить так, чтобы не утверждать, будто Исав однозначно назван именно блудником.
  revised_text: чтобы никто не был сексуально безнравственным или человеком, не чтущим святыни, подобно Исаву, который за одну трапезу продал свои права первенца.
