revisions:
- from: чтобы не было среди вас ни блудника, ни человека, пренебрегающего святыней, подобного Исаву, который за одну порцию еды продал своё первородство.
  to: чтобы никто не был сексуально безнравственным или человеком, не чтущим святыни, подобно Исаву, который за одну трапезу продал свои права первенца.
  rationale: Исправлены союзная связь и излишняя конкретизация «порции». Формулировка «человеком, не чтущим святыни, подобно Исаву» передаёт βέβηλος как отношение к священному и не навязывает решения спорного вопроса о том, относится ли сравнение с Исавом также к первому определению.
