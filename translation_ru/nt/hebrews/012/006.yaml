base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/006.yaml
  text: For the Lord disciplines the one he loves[b][a], and he scourges every son whom he receives.
translation:
  language: ru
  text: Ибо кого Господь любит, того воспитывает и бичует[a] всякого сына[b], которого принимает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бьёт бичом», «подвергает бичеванию». Греческий глагол имеет сильное значение и изображает суровое наказание.'
    reason: lexical_alternative
  - marker: b
    text: «Всякого сына» — буквальная форма греческого выражения; в этом контексте она имеет представительный смысл и относится ко всем, кого Бог признаёт Своими детьми.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: кого … того; которого
  rationale: Первое относительное местоимение передано естественной для русского обобщающей конструкцией «кого … того», второе — «которого»; личный характер обоих высказываний сохранён.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит основание предшествующего наставления; «ведь» естественно и ясно передаёт пояснительно-причинную связь.
- source_word: ἀγαπᾷ
  choice: любит
  rationale: Прямое и современное соответствие глаголу ἀγαπάω.
- source_word: κύριος
  choice: Господь
  rationale: Сохранён титул κύριος; в русском библейском употреблении он естественно оформляется как «Господь».
- source_word: παιδεύει
  choice: наставляет
  rationale: В контексте отцовского воспитания глагол означает формирующее обучение и исправление. «Наставляет» сохраняет педагогическую сторону слова, не сводя его лишь к наказанию.
- source_word: μαστιγοῖ
  choice: бичует
  rationale: Сильный глагол обозначает избиение бичом; «бичует» сохраняет суровость образа и не смягчает напряжение текста.
- source_word: δὲ
  choice: и
  rationale: Здесь частица продолжает и усиливает мысль, а не вводит явное противопоставление.
- source_word: πάντα υἱὸν
  choice: всякого сына
  rationale: Сохранены мужской род, единственное число и образ сыновства, важный для ближайшего контекста; представительный смысл пояснён в примечании.
- source_word: παραδέχεται
  choice: принимает
  rationale: Передаёт принятие и признание сына без добавления не выраженных в тексте оттенков.
theological_decisions:
- issue: Передача υἱός в контексте Божьего отцовства и воспитания
  choice: всякого сына
  alternative: каждого ребёнка
  rationale: Греческий текст прямо говорит о «сыне», а контекст Евр 12 развивает именно образ сыновства. Основной текст сохраняет этот образ, тогда как представительный охват всех Божьих детей отмечен в сноске.
- issue: Сила образа μαστιγοῖ применительно к Божьему воспитанию
  choice: бичует
  alternative: строго наказывает
  rationale: Исходный глагол намеренно суров. Перевод не смягчает образ и сохраняет напряжение между любовью Господа и болезненным воспитанием.
- issue: Смысл παιδεύει рядом с μαστιγοῖ
  choice: наставляет
  alternative: наказывает; воспитывает
  rationale: «Наставляет» передаёт формирующую и исправительную направленность παιδεύω, тогда как следующий сильный глагол уже выражает суровую сторону дисциплины.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Параллелизм двух частей сохранён; «бичует» намеренно оставлено сильным, а «наставляет» передаёт воспитательно-исправительный оттенок первой части.
