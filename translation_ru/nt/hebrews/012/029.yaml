translation:
  language: ru
  text: Ведь наш Бог — пожирающий огонь[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Отсылка ко Второзаконию 4:24, где Бог назван «пожирающим огнём».
    reason: cross_reference
  - marker: b
    text: 'Или: «огонь, который пожирает».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Ведь
  rationale: Сочетание связывает стих с предшествующим предостережением и указывает на основание сказанного. «Ведь» естественно передаёт пояснительно-причинный смысл γάρ, включая усилительный оттенок καί.
- source_word: ὁ θεὸς ἡμῶν
  choice: Бог наш
  rationale: Такой порядок слов естественен для возвышенного, но современного русского библейского стиля и сохраняет общинно-заветный смысл местоимения «наш».
- source_word: πῦρ
  choice: огонь
  rationale: Прямой перевод именной части сказуемого сохраняет метафору и отсылку ко Второзаконию 4:24.
- source_word: καταναλίσκον
  choice: пожирающий
  rationale: Причастие передаёт активное действие огня и соответствует значению «полностью поглощать, истреблять». В основном тексте выбран ёмкий образный эквивалент; более структурно буквальный вариант дан в сноске.
theological_decisions:
- issue: Метафорическое описание Бога как огня
  choice: 'Сохранить прямую метафору: «Бог наш — огонь пожирающий»'
  alternative: «Бог наш подобен пожирающему огню»
  rationale: В греческом тексте именная конструкция без показателя сравнения. Прямая метафора сохраняет силу предостережения и не превращает утверждение в ослабленное сравнение.
- issue: Смысл причастия καταναλίσκον
  choice: Не уточнять в основном тексте, что именно или кого именно пожирает огонь
  alternative: «огонь, истребляющий нечестивых»
  rationale: Объект действия в стихе не назван. Его добавление неоправданно снимало бы образную широту и богословское напряжение текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «Бог наш» и постановка определения после существительного поддерживают достоинство и афористическую силу фразы, оставаясь понятными современному читателю.
