  verdict: revise
  source_fidelity: 'Основной смысл передан точно: ἀφορῶντες выражено как устойчиво направленный взгляд, ἀρχηγός и τελειωτής сохранены как парные обозначения Иисуса, τῆς πίστεως не расширено местоимением «нашей», а ἀντί передано в контекстуально вероятном мотивационном значении. «По правую сторону Божьего престола» адекватно передаёт ἐν δεξιᾷ ... τοῦ θρόνου τοῦ θεοῦ. Однако точка после «веры» искусственно разрывает греческую конструкцию и оставляет начальное деепричастие без грамматической опоры в пределах стиха.'
