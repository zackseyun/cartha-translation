  terminology: «Зачинатель и совершитель веры» допустимо сохраняет компактность оригинала и не навязывает конкретное толкование генитива. Альтернативы «верности» и «нашей веры» обоснованно оставлены в сноске. Термин «позор» уместно передаёт αἰσχύνη как общественное бесчестье распятия.
