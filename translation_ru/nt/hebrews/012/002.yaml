id: HEB.12.2
reference: Hebrews 12:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
translation:
  language: ru
  text: Будем не сводить глаз с Иисуса[a] — зачинателя и совершителя веры, который ради предстоящей Ему радости претерпел крест, не считаясь с позором[b], и воссел по правую сторону Божьего престола.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зачинателя и совершителя верности»; или: «зачинателя и совершителя нашей веры». Греческое выражение сжато: слово πίστις может означать также «верность» либо относиться именно к вере верующих.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «не придав значения позору». То есть Он не позволил позору крестной смерти стать решающим препятствием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορῶντες
  choice: не сводя глаз с
  rationale: Передаёт сосредоточенный и устойчивый взгляд на одном предмете, а также естественно продолжает образ забега из контекста.
- source_word: ἀρχηγὸν
  choice: зачинателя
  rationale: Слово обозначает того, кто начинает дело и прокладывает путь; «зачинатель» сохраняет эту инициативную роль без сведения смысла лишь к литературному «автору».
- source_word: τελειωτὴν
  choice: совершителя
  rationale: Передаёт того, кто доводит до намеченной полноты и завершения, и образует естественную смысловую пару с «зачинателем».
- source_word: τῆς πίστεως
  choice: веры
  rationale: Сохраняет компактность и отсутствие местоимения «нашей» в греческом; возможные значения «верности» и «нашей веры» отмечены в сноске.
- source_word: ἀντὶ
  choice: ради
  rationale: В данном контексте выражает направляющую цель и мотив — предстоящую радость, ради которой Иисус вынес страдание; буквальное «вместо» здесь менее вероятно.
- source_word: προκειμένης αὐτῷ χαρᾶς
  choice: предлежавшей Ему радости
  rationale: Сохраняет образ цели, находящейся впереди, и связь с образом забега, оставаясь в dignified современном библейском регистре.
- source_word: ὑπέμεινεν
  choice: претерпел
  rationale: Выражает стойкое перенесение тяжёлого испытания и соответствует теме терпения в главе.
- source_word: σταυρὸν
  choice: крест
  rationale: Контекст однозначно указывает на распятие Иисуса; русский язык естественно допускает здесь форму без определителя.
- source_word: αἰσχύνης καταφρονήσας
  choice: пренебрегши позором
  rationale: Передаёт отношение к бесчестью как к тому, что не имеет решающей силы; не предполагает одобрения самого позора.
- source_word: ἐν δεξιᾷ ... τοῦ θρόνου τοῦ θεοῦ
  choice: по правую сторону Божьего престола
  rationale: Ясно передаёт место высшей чести и власти и избегает возможной для современного читателя неясности выражения «одесную престола».
- source_word: κεκάθικεν
  choice: воссел
  rationale: Обозначает завершённое восшествие на почётное место с сохраняющимся результатом; возвышенный глагол уместен для образа воцарения.
theological_decisions:
- issue: Значение τῆς πίστεως при ἀρχηγὸν καὶ τελειωτὴν
  choice: Иисус назван «зачинателем и совершителем веры», без добавления отсутствующего в греческом местоимения.
  alternative: «зачинателем и совершителем верности» или «зачинателем и совершителем нашей веры»
  rationale: Греческое выражение сжато и допускает отнесение как к вере верующих, так и к верной стойкости, явленной Иисусом. Основной текст не разрешает эту неоднозначность догматически, а варианты сохранены в сноске.
- issue: Сила ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: Предстоявшая радость представлена как цель и мотив, ради которых Иисус претерпел крест.
  alternative: Иисус избрал крест «вместо» доступной Ему радости.
  rationale: Хотя ἀντί способно означать «вместо», контекст забега, стойкости и предстоящей цели лучше поддерживает значение направляющего мотива, не требуя предположения об отвергнутой настоящей радости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет движение греческой фразы и связь с образом забега. Формы «предлежавшей», «претерпел» и «воссел» выбраны как понятные в контексте и торжественные, но не архаичные; богословская неоднозначность слова πίστις вынесена в сноску.
