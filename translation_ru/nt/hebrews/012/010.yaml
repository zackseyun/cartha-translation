id: HEB.12.10
reference: Hebrews 12:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ μὲν γὰρ πρὸς ὀλίγας ἡμέρας κατὰ τὸ δοκοῦν αὐτοῖς ἐπαίδευον, ὁ δὲ ἐπὶ τὸ συμφέρον εἰς τὸ μεταλαβεῖν τῆς ἁγιότητος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
translation:
  language: ru
  text: Ведь они воспитывали нас лишь недолгое время[a], как считали нужным, а Он — ради нашей пользы, чтобы мы стали причастны Его святости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на несколько дней». Здесь выражение подчёркивает ограниченную продолжительность воспитания земными отцами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὀλίγας ἡμέρας
  choice: лишь недолгое время
  rationale: Греческое выражение буквально означает «на несколько дней», но здесь идиоматически подчёркивает ограниченную продолжительность воспитания земными отцами. Русское «лишь недолгое время» естественно передаёт этот временной контраст.
- source_word: κατὰ τὸ δοκοῦν αὐτοῖς
  choice: как считали нужным
  rationale: Оборот указывает на субъективное суждение земных отцов о том, что было правильным или уместным; перевод не утверждает, что их решение всегда было безошибочным.
- source_word: ἐπαίδευον
  choice: воспитывали
  rationale: Глагол обозначает родительское воспитание, включающее наставление, исправление и дисциплину, а не только наказание. «Воспитывали» сохраняет эту широту значения и естественно звучит по-русски.
- source_word: ὁ δὲ
  choice: а Он
  rationale: Единственное число противопоставляет земных отцов Богу, подразумеваемому из контекста. Местоименная передача сохраняет неявно названного субъекта греческого текста.
- source_word: ἐπὶ τὸ συμφέρον
  choice: ради нашей пользы
  rationale: Оборот выражает целенаправленность Божьего воспитания на то, что действительно служит благу людей.
- source_word: εἰς τὸ μεταλαβεῖν
  choice: чтобы мы стали причастны
  rationale: Конструкция выражает цель, а μεταλαμβάνω — участие или приобщение. Формулировка передаёт как целевое значение, так и весомость участия.
- source_word: τῆς ἁγιότητος αὐτοῦ
  choice: Его святости
  rationale: ἁγιότης обозначает святость как качество Бога; местоимение сохраняет форму оригинала и ясную связь с подразумеваемым Богом.
theological_decisions:
- issue: К кому относится противопоставленное ὁ δὲ
  choice: Бог обозначен местоимением «Он», без добавления имени в текст.
  alternative: 'Явно перевести: «а Бог».'
  rationale: Контекст Евр 12:5–11 ясно противопоставляет земных отцов Богу как Отцу. Местоимение сохраняет эллиптичность оригинала, оставаясь понятным в контексте.
- issue: Смысл причастности Божьей святости
  choice: Передано как становление причастными Его святости без уточнения механизма или этапа освящения.
  alternative: Истолковать выражение исключительно как уже данный статус либо исключительно как постепенное нравственное освящение.
  rationale: Текст называет участие в Божьей святости целью Его воспитания, но не ограничивает смысл одной конфессиональной моделью освящения.
- issue: Характер воспитания земных отцов
  choice: Фраза «как считали нужным» сохраняет ограниченность их собственного суждения, не объявляя их воспитание ни непременно верным, ни непременно ошибочным.
  alternative: 'Перевести оценочно: «как им было угодно» или «как было правильно».'
  rationale: κατὰ τὸ δοκοῦν αὐτοῖς передаёт то, что представлялось им надлежащим; этическую оценку их решений оригинал прямо не устанавливает.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Воспитывали» выбрано вместо более узкого «наказывали», чтобы сохранить широкий смысл παιδεύω. Заглавное «Он» помогает читателю распознать Бога как подразумеваемого субъекта, не вводя Его имя непосредственно в текст.
