  text: Οὐ γὰρ προσεληλύθατε ⸀ψηλαφωμένῳ καὶ κεκαυμένῳ πυρὶ καὶ γνόφῳ καὶ ⸀ζόφῳ καὶ θυέλλῃ
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/018.yaml
  text: For you have not come to what can be touched[a], and to a blazing fire, and to darkness and gloom and storm[b],
translation:
  language: ru
  text: Ибо вы не приблизились ни к тому, чего можно коснуться[a], ни к пылающему огню, ни к мгле, ни к мраку, ни к буре,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к горе, которой можно коснуться». Из контекста подразумевается Синай, но слово «гора» в греческом тексте этого стиха прямо не употреблено.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Ведь ... не
  rationale: «Ведь» естественно передаёт пояснительную силу γάρ и связывает стих с предшествующим рассуждением; отрицание οὐ относится к глаголу и всему последующему ряду.
- source_word: προσεληλύθατε
  choice: вы приблизились
  rationale: Перфект обозначает совершившееся приближение с сохраняющимся результатом. «Приблизились» передаёт образ доступа и приближения к святыне, оставаясь естественным для современного русского языка.
- source_word: ψηλαφωμένῳ
  choice: к чему-то осязаемому
  rationale: Причастие означает нечто доступное прикосновению, осязаемое. В греческом тексте существительное «гора» отсутствует, поэтому неопределённый предмет не конкретизируется в основном тексте.
- source_word: κεκαυμένῳ πυρί
  choice: к пылающему огню
  rationale: Перфектное причастие описывает огонь в состоянии горения; «пылающий огонь» ясно и выразительно передаёт этот смысл.
- source_word: γνόφῳ
  choice: к мгле
  rationale: Слово обозначает густую тьму. «Мгла» позволяет отличить его от следующего близкого по значению ζόφος и сохранить накопительный ряд образов.
- source_word: ζόφῳ
  choice: мраку
  rationale: «Мрак» передаёт густую, зловещую темноту и в сочетании с «мглой» сохраняет смысловое наложение двух греческих слов.
- source_word: θυέλλῃ
  choice: буре
  rationale: Слово обозначает сильную бурю или вихрь; «буря» — ясный и литературно нейтральный современный эквивалент.
theological_decisions:
- issue: Следует ли добавлять слово «гора» как объект приближения
  choice: Не добавлять «гора» в основной текст, а передать ψηλαφωμένῳ как неопределённое «что-то осязаемое».
  alternative: «Вы приблизились не к осязаемой горе...»
  rationale: Из контекста подразумевается Синай, однако в греческом тексте этого стиха слова ὄρος («гора») нет. Основной текст сохраняет исходную неопределённость, а контекстуальное понимание отмечается в сноске.
- issue: Область действия начального отрицания в перечислении с повторяющимся καί
  choice: В русском тексте повторить «не к», чтобы отрицание однозначно охватывало элементы перечисления.
  alternative: Формально воспроизвести повторяющееся καί как «и к... и к...», оставив отрицание только перед первым элементом.
  rationale: В греческом начальное οὐ управляет всем рядом, соединённым καί. Буквальное русское повторение «и к» могло бы ошибочно создать впечатление, что отрицается лишь первый элемент; повтор «не к» сохраняет смысл отрицательной конструкции.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием без архаизмов. «Приблизились» сохраняет культовый и пространственный образ доступа. Повторение «не к» выбрано ради ясной области отрицания, тогда как накопительный ритм исходного перечисления частично сохранён. Конечная запятая показывает, что синтаксическое предложение продолжается в следующем стихе.
