  text: καὶ ἐκκλησίᾳ πρωτοτόκων ⸂ἀπογεγραμμένων ἐν οὐρανοῖς⸃, καὶ κριτῇ θεῷ πάντων, καὶ πνεύμασι δικαίων τετελειωμένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/023.yaml
  text: and to the assembly of the firstborn who are enrolled in the heavens[a], and to God, the judge of all, and to the spirits of righteous people made perfect,
translation:
  language: ru
  text: и к собранию первенцев, записанных на небесах[a], и к Богу, Судье всех, и к духам праведников, приведённых к совершенству,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на небесах»; греческое слово стоит во множественном числе. Возможный перевод по обычному русскому употреблению: «на небе».'
    reason: лексическая альтернатива и сохранение числа оригинала
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: собранию
  rationale: Передаёт основное значение собравшегося сообщества и не привносит более поздних институциональных оттенков слова «церковь»; дательный падеж продолжает конструкцию «вы приступили» из контекста.
- source_word: πρωτοτόκων
  choice: первенцев
  rationale: Сохраняет субстантивированное множественное число и представление о статусе и наследственных правах первенца, не добавляя отсутствующего в греческом слова «сыновья».
- source_word: ἀπογεγραμμένων
  choice: записанных
  rationale: 'Естественно передаёт совершенное страдательное причастие: они внесены в список, и эта запись сохраняет силу.'
- source_word: ἐν οὐρανοῖς
  choice: на небесах
  rationale: Сохраняет множественное число греческого выражения и звучит естественно в современном литературном русском.
- source_word: κριτῇ θεῷ πάντων
  choice: к Богу, Судье всех
  rationale: Аппозиция ясно отождествляет Бога с Судьёй всех и сохраняет продолжение ряда дательных форм.
- source_word: πνεύμασι δικαίων
  choice: к духам праведников
  rationale: Буквально и естественно передаёт человеческий референт, не ограничивая его мужчинами и не добавляя подробностей о состоянии умерших.
- source_word: τετελειωμένων
  choice: достигших совершенства
  rationale: Передаёт совершенный результат τελειόω и важную для Послания тему доведения до совершенства; такая формулировка естественнее по-русски, чем «сделанных совершенными», при сохранении контекстуального смысла.
theological_decisions:
- issue: Кого обозначают «первенцы»
  choice: Собирательное обозначение людей, обладающих статусом первенцев
  alternative: Христос как единственный Первенец и собрание, принадлежащее Ему
  rationale: Множественное число πρωτοτόκων непосредственно указывает на коллективный референт; перевод не добавляет отсутствующей в тексте притяжательной связи.
- issue: Кого обозначают «духи праведников, достигших совершенства»
  choice: Духи праведных людей, доведённых до совершенного состояния
  alternative: Все праведники вообще, независимо от телесного состояния
  rationale: Слово πνεύμασι естественно указывает здесь на человеческие духи, однако перевод не разворачивает это в подробное учение о промежуточном состоянии и сохраняет сжатость оригинала.
- issue: Залог τετελειωμένων
  choice: «достигших совершенства» как естественное русское выражение результата доведения до совершенства
  alternative: «сделанных совершенными» с явным выражением страдательного залога
  rationale: Греческая форма страдательная, но по-русски буквальная калька тяжеловесна. Контекст сохраняет смысл достигнутого состояния, не называя действующего лица прямо.
translation_notes:
  register: Современный литературный русский с достоинством и ритмической параллельностью перечисления. Сохранены неоднозначность выражения о первенцах и богословски значимое понятие совершенства; избегнуты конфессионально нагруженные уточнения.
