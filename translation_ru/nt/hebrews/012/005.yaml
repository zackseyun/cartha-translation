id: HEB.12.5
reference: Hebrews 12:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐκλέλησθε τῆς παρακλήσεως, ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται, Υἱέ μου, μὴ ὀλιγώρει παιδείας κυρίου, μηδὲ ἐκλύου ὑπ’ αὐτοῦ ἐλεγχόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/005.yaml
  text: 'And you have forgotten the exhortation that addresses you as sons: “My son[a], do not regard lightly the Lord’s discipline[c][b], nor lose heart when you are reproved by him.”'
translation:
  language: ru
  text: 'И вы забыли увещевание, обращённое к вам как к сыновьям: «Сын мой[a], не пренебрегай воспитанием от Господа[b][c] и не падай духом, когда Он обличает тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дитя моё». В греческом тексте буквально: «Сын мой»; это воспроизводит формулировку Притч и соответствует теме сыновства в данном отрывке. Обращение охватывает всех Божьих детей.'
    reason: lexical_alternative
  - marker: b
    text: «Воспитание» здесь может включать обучение, приучение и исправление, а не только наказание.
    reason: lexical_alternative
  - marker: c
    text: Цитата из Притч 3:11.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκλέλησθε
  choice: вы забыли
  rationale: Перфект указывает на сохраняющееся состояние как результат забвения; русское «вы забыли» естественно передаёт и результат, и укор.
- source_word: παρακλήσεως
  choice: наставление
  rationale: В данном контексте слово вводит увещевание из Притч; «наставление» сочетает побуждение и поддержку, не сводя смысл только к утешению.
- source_word: ἥτις … διαλέγεται
  choice: которое обращается
  rationale: Оборот представляет слова Писания как непосредственно обращённые к читателям; такая формулировка естественна по-русски и сохраняет олицетворённую речь наставления.
- source_word: ὡς υἱοῖς
  choice: как к сыновьям
  rationale: Сохраняется явно выраженная сыновняя лексика греческого текста, важная и для цитаты из Притч, и для последующего рассуждения Послания.
- source_word: Υἱέ μου
  choice: Сын мой
  rationale: Точно передаёт звательный оборот единственного числа и сохраняет связь с Притчами 3:11.
- source_word: ὀλιγώρει
  choice: не относись пренебрежительно
  rationale: Глагол означает считать неважным, пренебрегать; выбранное выражение передаёт предостережение без чрезмерно сильного оттенка слова «презирать».
- source_word: παιδείας
  choice: воспитанию
  rationale: «Воспитание» охватывает как формирование и обучение, так и исправительную меру, сохраняя широту παιδεία в контексте отношений Отца и сыновей.
- source_word: κυρίου
  choice: Господа
  rationale: Родительный падеж естественно передаёт принадлежность и источник воспитания.
- source_word: ἐκλύου
  choice: не падай духом
  rationale: Идиоматично передаёт внутреннее изнеможение и утрату мужества под воздействием исправления.
- source_word: ἐλεγχόμενος
  choice: когда Он обличает тебя
  rationale: «Обличает» сохраняет значение выявления неправоты и укоряющего исправления; временное придаточное естественно передаёт причастную конструкцию.
theological_decisions:
- issue: Сыновняя лексика в обращении
  choice: Сохранить «к сыновьям» и «Сын мой» в основном тексте
  alternative: «к детям» и «Дитя моё»
  rationale: Мужская сыновняя лексика намеренно восходит к Притчам и связана с аргументацией о сыновстве в ближайшем контексте. Примечание поясняет её представительный охват, не стирая форму исходного текста.
- issue: Значение παιδεία в отношениях Бога и людей
  choice: «воспитание»
  alternative: «наказание», «наставление», «исправление»
  rationale: Термин включает формирующее обучение и болезненное исправление. «Воспитание» сохраняет эту смысловую и богословскую напряжённость, не сводя действие Господа лишь к наказанию.
- issue: Действующий субъект в ὑπ’ αὐτοῦ ἐλεγχόμενος
  choice: «когда Он обличает тебя»
  alternative: «когда ты обличаем Им»
  rationale: Местоимение отсылает к Господу; явное «Он» делает русскую фразу естественной, не меняя богословского содержания и не уточняя сверх текста способ обличения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского увещевания. Синтаксис остаётся ясным для широкого читателя; сыновняя лексика и прямое обращение цитаты сохранены, а смысловая широта παιδεία пояснена в сноске.
