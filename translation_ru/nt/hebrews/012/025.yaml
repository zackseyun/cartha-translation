source:
  edition: SBLGNT
  text: Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα· εἰ γὰρ ἐκεῖνοι οὐκ ⸀ἐξέφυγον ⸂ἐπὶ γῆς παραιτησάμενοι τὸν⸃ χρηματίζοντα, ⸀πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ’ οὐρανῶν ἀποστρεφόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/025.yaml
  text: See to it that you do not refuse the one who is speaking[a]. For if those did not escape when they refused the one who warned them on earth[b], much less will we if we turn away from the one who warns from heaven.
translation:
  language: ru
  text: Смотрите, не отвергните того, кто говорит. Ведь если те, кто отверг предостерегавшего их на земле[a], не избежали, то тем более не избежим мы, если отвернёмся от того, кто говорит с небес[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол может обозначать данное Богом наставление или предупреждение.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тем более мы, отворачивающиеся от Того, Кто с небес»; глагол «избежать» и действие «говорит» подразумеваются из предыдущей части стиха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: Смотрите
  rationale: Форма повелительного наклонения во множественном числе вводит настойчивое предостережение; «смотрите» естественно передаёт эту функцию в современном русском языке.
- source_word: μὴ παραιτήσησθε / παραιτησάμενοι
  choice: не отвергните / отверг
  rationale: Повтор одного русского корня сохраняет лексическую связь между двумя употреблениями παραιτέομαι и передаёт сознательный отказ слушать говорящего.
- source_word: τὸν λαλοῦντα
  choice: Того, Кто говорит
  rationale: Настоящее причастие обозначает продолжающуюся речь; формулировка сохраняет непосредственность обращения и не уточняет личность говорящего сверх текста.
- source_word: ἐξέφυγον
  choice: не избежали наказания
  rationale: Глагол означает «избежать, спастись от последствий». Дополнение «наказания» имплицитно в контексте суда и необходимо для естественной русской фразы.
- source_word: ἐπὶ γῆς
  choice: на земле
  rationale: Сохраняется пространственное противопоставление выражению ἀπ’ οὐρανῶν — «с небес», без внесения прямого упоминания Синая.
- source_word: χρηματίζοντα
  choice: предостерегавшего их
  rationale: Глагол может обозначать сообщение Божьего повеления или предупреждения; в данном контексте «предостерегавшего» передаёт его увещевательно-судебный оттенок. Местоимение «их» восполняет подразумеваемый объект.
- source_word: πολὺ μᾶλλον
  choice: тем более
  rationale: Так естественно передаётся усиленный вывод от меньшего к большему в отрицательном предупреждении.
- source_word: ἀποστρεφόμενοι
  choice: если отвернёмся
  rationale: Условная формулировка естественно раскрывает смысл причастной конструкции, не превращая предупреждение в утверждение о неизбежном поступке адресатов.
- source_word: τὸν ἀπ’ οὐρανῶν
  choice: Того, Кто говорит с небес
  rationale: В греческом буквально стоит «Того, Кто с небес», а действие подразумевается из контекста. Повтор глагола «говорит» делает русскую фразу ясной и сохраняет связь с началом стиха.
theological_decisions:
- issue: Личность говорящего
  choice: Оставить описательное обозначение «Тот, Кто говорит», не называя прямо Бога или Христа.
  alternative: Назвать говорящего Богом либо Христом.
  rationale: Контекст указывает на Божественную речь, однако сам стих не употребляет имени или титула. Описательная передача сохраняет намеренную недосказанность текста.
- issue: Подразумеваемый глагол во второй части сравнения
  choice: 'Восполнить: «тем более не избежим мы».'
  alternative: 'Буквально сохранить эллипсис: «тем более мы, отворачивающиеся…».'
  rationale: Греческий текст подразумевает повтор ἐξέφυγον из первой части. Восполнение необходимо для ясного современного русского синтаксиса и не меняет смысла.
- issue: Объект глагола «избежать»
  choice: Указать «наказания».
  alternative: 'Оставить глагол без дополнения: «не избежали».'
  rationale: Судебное последствие подразумевается контекстом; в русском языке абсолютное употребление здесь звучит неполно. Формулировка не уточняет вид или меру наказания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского предостережения. Заглавное «Того» используется как уважительное контекстуальное обозначение, но личность говорящего не конкретизируется. Повтор «отверг / отвернёмся» отражает смену греческих глаголов и усиливает движение от отказа слушать к отворачиванию.
