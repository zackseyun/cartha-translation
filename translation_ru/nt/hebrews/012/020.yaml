base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/020.yaml
  text: 'For they could not endure what was being commanded: “If even an animal touches the mountain[a], it will be stoned.”'
translation:
  language: ru
  text: 'Потому что они не могли вынести того, что им было велено: «Если даже животное прикоснётся к горе[a], оно будет побито камнями».'
  philosophy: optimal-equivalence
  footnotes:
