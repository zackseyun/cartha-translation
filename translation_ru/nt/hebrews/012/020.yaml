lexical_decisions:
- source_word: οὐκ ἔφερον
  choice: они не могли вынести
  rationale: Отрицательная форма φέρω здесь означает неспособность вынести или стерпеть услышанное требование; этот вариант естественен в современном русском языке.
- source_word: γὰρ
  choice: потому что
  rationale: γάρ объясняет предыдущее высказывание; «потому что» ясно передаёт причинно-пояснительную связь.
- source_word: τὸ διαστελλόμενον
  choice: того, что было повелено
  rationale: Субстантивированное причастие обозначает властное предписание. Формулировка сохраняет его словесный характер и не конкретизирует больше, чем греческий текст.
- source_word: Κἂν
  choice: Если даже
  rationale: 'κἄν вводит условие с усилительным оттенком: запрет распространялся даже на животное.'
- source_word: θηρίον
  choice: животное
  rationale: В данном контексте θηρίον обозначает животное вообще; нейтральное современное слово не сужает значение до дикого зверя.
- source_word: θίγῃ
  choice: прикоснётся
  rationale: Аорист конъюнктива в условном обороте естественно передаётся русским будущим совершенного вида.
- source_word: τοῦ ὄρους
  choice: к горе
  rationale: Перевод сохраняет прямое обозначение «гора», не вставляя имя Синай, которого в этом стихе нет.
- source_word: λιθοβοληθήσεται
  choice: оно будет побито камнями
  rationale: Форма будущего пассивного залога передана буквально и понятно, с явным местоимением, относящимся к животному.
theological_decisions:
- issue: Связь цитаты с повелением у Синая
  choice: 'Переведён только текст цитаты, засвидетельствованный в SBLGNT: животное будет побито камнями.'
  alternative: Добавить «или поражено стрелой» в основной текст по некоторым рукописям и Исходу 19:12–13.
  rationale: Основной перевод следует предоставленному греческому тексту и не гармонизирует его с расширенным вариантом; разночтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет пояснительную связь с предыдущим стихом. Формулировка торжественная, но без архаизмов.
