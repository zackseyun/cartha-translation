  terminology: «Иисус», «посредник», «новый завет» и «кровь окропления» терминологически уместны и выдержаны в библейском регистре. «Кровь окропления» особенно удачно сохраняет культовую образность, не сводя выражение к простому описанию «окроплённой крови».
