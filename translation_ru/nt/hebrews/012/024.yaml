  source_fidelity: 'Текст точно передаёт дательные дополнения, зависящие от подразумеваемого в контексте «вы приступили»: «к Иисусу… и к крови». «Посреднику нового завета» адекватно передаёт μεσίτῃ διαθήκης νέας, а «крови окропления» сохраняет родительный ритуальный оборот αἵματι ῥαντισμοῦ. Формула «которая говорит лучше, чем Авель» намеренно сохраняет эллиптическое παρὰ τὸν Ἅβελ, не подменяя Авеля в основном тексте его кровью.'
