id: HEB.12.24
reference: Hebrews 12:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
translation:
  language: ru
  text: и к Иисусу, посреднику нового завета, и к крови окропления[a], которая говорит лучше, чем Авель[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Кровь окропления» — жертвенная кровь, которой совершали окропление; выражение напоминает об утверждении завета и ритуальном очищении.
    reason: cultural_note
  - marker: b
    text: 'Или: «чем кровь Авеля». По-гречески сказано просто «чем Авель»; вероятно, это отсылка к крови Авеля, взывавшей от земли (Быт. 4:10).'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκης νέας
  choice: нового завета
  rationale: «Завет» передаёт библейский смысл διαθήκη как установленного Богом союза; отсутствие артикля естественно отражается конструкцией без указательного уточнения.
- source_word: μεσίτῃ
  choice: посреднику
  rationale: Точный и общепонятный термин для того, кто соединяет стороны и обеспечивает отношения завета.
- source_word: Ἰησοῦ
  choice: Иисусу
  rationale: Стандартная русская форма имени; дательный падеж сохраняет зависимость от подразумеваемого «вы приступили» в предыдущем контексте.
- source_word: αἵματι ῥαντισμοῦ
  choice: к крови окропления
  rationale: Сохраняет ветхозаветный ритуально-жертвенный образ крови, применяемой посредством окропления, не сводя выражение лишь к состоянию самой крови.
- source_word: κρεῖττον
  choice: лучше
  rationale: Сохраняет характерную для Послания к евреям лексику превосходства и сравнительную форму наречия.
- source_word: λαλοῦντι
  choice: которая говорит
  rationale: Относительное придаточное естественно по-русски передаёт причастие настоящего времени и олицетворение крови.
- source_word: παρὰ τὸν Ἅβελ
  choice: чем Авель
  rationale: Греческий текст прямо называет Авеля, а не его кровь. Краткая формулировка сохраняет эллипсис и не закрепляет в основном тексте только одно толкование.
theological_decisions:
- issue: С чем сопоставляется говорящая кровь при упоминании Авеля
  choice: «говорит лучше, чем Авель»
  alternative: «говорит лучше, чем кровь Авеля»; «говорит о лучшем, чем кровь Авеля»
  rationale: Контекст вызывает в памяти кровь Авеля, взывающую от земли (Быт. 4:10), однако греческий текст говорит буквально «чем Авель». Основной текст сохраняет эту сжатость и богословское напряжение, а примечание поясняет вероятную аллюзию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Начальное «и к» сохранено, поскольку стих является продолжением длинного перечня в контексте. Формулировка «кровь окропления» намеренно сохраняет культовый образ и более точно соответствует родительному обороту исходного текста.
