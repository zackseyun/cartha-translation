  source_fidelity: 'Текст точно передаёт греческий ряд дательных дополнений: сильное противопоставление («Но»), перфект προσεληλύθατε («вы приступили»), гору Сион, город живого Бога как небесный Иерусалим и множество ангелов. «Несметное множество» правомерно передаёт неопределённо-великое значение μυριάσιν; буквальный оттенок отражён в сноске. Связь πανηγύρει с ангелами передана допустимо, а реальная синтаксическая альтернатива не скрыта.'
