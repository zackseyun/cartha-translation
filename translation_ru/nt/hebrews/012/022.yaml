id: HEB.12.22
reference: Hebrews 12:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/022.yaml
  text: But you have come to Mount Zion and to the city of the living God[a], the heavenly Jerusalem, and to myriads of angels in festal gathering[b],
translation:
  language: ru
  text: Но вы приступили к горе Сиону и к городу живого Бога — небесному Иерусалиму, и к несметному множеству[b] ангелов на торжественном собрании[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «и к несметному множеству ангелов, к торжественному собранию». Греческий синтаксис позволяет связывать «торжественное собрание» с ангелами или понимать его как отдельный член перечисления.'
    reason: alternative_reading
  - marker: b
    text: Греческое слово может означать буквально «десятки тысяч», а в более широком смысле — неисчислимое множество.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт сильное противопоставление горе Синай и описанному ранее переживанию, естественно связывая стих с предшествующим контекстом.
- source_word: προσεληλύθατε
  choice: вы приступили
  rationale: Совершенный вид передаёт состоявшееся приближение с сохраняющимся результатом; «приступили» естественно для возвышенного, но современного библейского регистра.
- source_word: Σιὼν ὄρει
  choice: к горе Сиону
  rationale: Сохраняет образ горы, собственное имя и управление дательного падежа после глагола приближения.
- source_word: πόλει θεοῦ ζῶντος
  choice: к городу живого Бога
  rationale: Родительный падеж естественно выражает принадлежность, а «живого» сохраняет значимое определение Бога без дополнительного толкования.
- source_word: Ἰερουσαλὴμ ἐπουρανίῳ
  choice: небесному Иерусалиму
  rationale: Передаёт приложение к «городу живого Бога» и прямо воспроизводит значение прилагательного ἐπουράνιος.
- source_word: μυριάσιν ἀγγέλων
  choice: к несметному множеству ангелов
  rationale: В данном контексте μυριάσιν обозначает огромное, практически неисчислимое число; формулировка понятна современному читателю, а буквальный числовой оттенок отмечен в сноске.
- source_word: πανηγύρει
  choice: на торжественном собрании
  rationale: Передаёт праздничный, общенародно-торжественный характер собрания и в основном тексте связывается с непосредственно предшествующим множеством ангелов.
theological_decisions:
- issue: Синтаксическая связь πανηγύρει
  choice: Отнести «на торжественном собрании» к множеству ангелов.
  alternative: 'Считать «торжественное собрание» отдельным членом перечисления: «и к несметному множеству ангелов, к торжественному собранию».'
  rationale: Дательный ряд допускает оба разбора. Связь с непосредственно предшествующими ангелами даёт цельный образ празднующего небесного воинства, но подлинная синтаксическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Тире подчёркивает приложение «небесному Иерусалиму». Конечная запятая сохранена, поскольку синтаксическое перечисление продолжается в Евр. 12:23.
