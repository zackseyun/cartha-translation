  source_fidelity: 'Текст точно передаёт структуру и смысл греческого оригинала: πᾶσα παιδεία — «всякое воспитание», временное противопоставление «в данный момент ... впоследствии», субъективный оттенок δοκεῖ («кажется»), контраст радости и печали, а также результат для тех, кто сформирован этим воспитанием. «Мирный плод праведности» сохраняет синтаксическую связь εἰρηνικός с «плодом» и генитив δικαιοσύνης.'
  naturalness: Русская фраза звучит естественно в современном литературном и библейском регистре. Порядок слов прозрачно выделяет контраст между настоящей печалью и последующим плодом. Формула «тем, кто им воспитан» несколько книжная, но допустима и уместна для данного регистра.
  terminology: «Воспитание» удачно передаёт широкое значение παιδεία в контексте Евр. 12, не сводя его к карательному наказанию. «Праведность» — обоснованный основной эквивалент δικαιοσύνη; сноска надлежащим образом сохраняет альтернативу «справедливость». Сноска не навязывает доктринального вывода и корректно указывает контекстуально вероятный смысл.
