source:
  edition: SBLGNT
  text: πᾶσα ⸀δὲ παιδεία πρὸς μὲν τὸ παρὸν οὐ δοκεῖ χαρᾶς εἶναι ἀλλὰ λύπης, ὕστερον δὲ καρπὸν εἰρηνικὸν τοῖς δι’ αὐτῆς γεγυμνασμένοις ἀποδίδωσιν δικαιοσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/011.yaml
  text: All discipline seems for the present to be not joy but sorrow[a]; yet later it yields the peaceful fruit of righteousness to those who have been trained by it.
translation:
  language: ru
  text: Всякое воспитание в данный момент кажется не радостью, а печалью; но впоследствии тем, кто им воспитан, оно приносит мирный плод праведности[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливости». Греческое слово может означать как праведность, так и справедливость; здесь, вероятнее всего, имеется в виду праведная жизнь, которую формирует Божье воспитание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεία
  choice: воспитание
  rationale: В контексте Евр. 12 речь идёт о Божьем отцовском воздействии, которое включает обучение, исправление и формирование, а не только наказание. «Воспитание» сохраняет эту широту и естественно связывается с образом отца и детей.
- source_word: πρὸς μὲν τὸ παρόν
  choice: в данный момент
  rationale: Передаёт временную перспективу переживаемого опыта и сохраняет противопоставление последующему результату.
- source_word: οὐ δοκεῖ
  choice: кажется
  rationale: Сохраняет значение воспринимаемой видимости, не превращая высказывание в безусловное определение воспитания.
- source_word: χαρᾶς ... ἀλλὰ λύπης
  choice: не радостью, а печалью
  rationale: Сохраняет греческие существительные и противопоставление, не сужая λύπη до одной лишь физической боли.
- source_word: ὕστερον
  choice: впоследствии
  rationale: Ясно обозначает более поздний результат и соответствует достоинству литературного регистра.
- source_word: καρπὸν εἰρηνικὸν
  choice: мирный плод
  rationale: Сохраняет прямую связь прилагательного «мирный» с существительным «плод», не решая за читателя, характеризуется ли плод миром или приносит его.
- source_word: γεγυμνασμένοις
  choice: тем, кто им воспитан
  rationale: Передаёт совершившийся формирующий результат продолжительного упражнения; в русском контексте повтор корня связывает результат именно с παιδεία, хотя спортивный оттенок остаётся фоновым.
- source_word: ἀποδίδωσιν
  choice: приносит
  rationale: Естественно сочетается со словом «плод» и передаёт произведённый впоследствии результат.
- source_word: δικαιοσύνης
  choice: праведности
  rationale: В данном контексте обозначает нравственную прямоту и верную жизнь как плод Божьего воспитания; возможное значение «справедливость» сохранено в сноске.
theological_decisions:
- issue: Значение παιδεία применительно к действию Бога
  choice: формирующее отцовское воспитание, включающее исправление и обучение
  alternative: наказание; одно лишь наставление
  rationale: Контекст Евр. 12:5–10 описывает отношения Отца и детей и цель достижения святости. «Воспитание» сохраняет как заботу, так и болезненность исправления, не сводя действие Бога к возмездию.
- issue: Значение δικαιοσύνης
  choice: праведность
  alternative: справедливость
  rationale: В контексте наиболее вероятен нравственный и духовный плод воспитания. Лексическая возможность значения «справедливость» не исключена и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Синтаксис сохраняет контраст между нынешней печалью и последующим плодом. «Воспитание» выбрано вместо более узкого и карательно окрашенного «наказания».
