  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
translation:
  language: ru
  text: 'Переносите ради воспитания[a]: Бог относится к вам как к сыновьям[b]. Ведь какой сын, которого отец не воспитывает?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Переносите это как воспитание». Греческий текст можно понять и как призыв стойко переносить ради воспитания, и как призыв воспринимать то, что приходится переносить, как воспитание.'
    reason: alternative_reading
  - marker: b
    text: Греч. «сыновьями». Здесь сохраняется образ отношений отца и сыновей, на котором строится рассуждение; сказанное относится не только к мужчинам.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παιδείαν
  choice: ради воспитания
  rationale: Передаёт возможное целевое значение εἰς и сохраняет связь с последующим παιδεύει. Слово «воспитание» включает формирование и исправление, не сводя смысл только к наказанию.
- source_word: ὑπομένετε
  choice: переносите всё
  rationale: Форма допускает изъявительное или повелительное понимание; контекст поддерживает увещевание. «Всё» естественно восполняет подразумеваемый объект по-русски, не отождествляя его с каким-либо одним конкретным бедствием.
- source_word: ὡς υἱοῖς
  choice: как с сыновьями
  rationale: 'Сохраняет сравнительный и реляционный смысл: Бог обращается с адресатами так, как отец — с сыновьями.'
- source_word: προσφέρεται
  choice: обращается с вами
  rationale: Идиоматично передаёт контекстуальное значение отношения и поведения Бога по отношению к адресатам.
- source_word: τίς γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ
  choice: Ведь есть ли сын, которого отец не воспитывает?
  rationale: Естественный русский риторический вопрос; повтор «воспитывает» сохраняет лексическую связь с παιδεία.
theological_decisions:
- issue: Гендерно маркированный образ отца и сыновей
  choice: Сохранить «сыновьями» и «сын» в основном тексте
  alternative: «детьми» и «ребёнок»
  rationale: Аргумент оригинала построен на конкретном образе отношений отца и сыновей. При этом примечание поясняет, что обращение относится ко всей общине, а не только к мужчинам.
- issue: Смысл εἰς παιδείαν
  choice: «ради воспитания»
  alternative: «как воспитание» / «принимайте это как воспитание»
  rationale: Греческое выражение допускает целевое прочтение и прочтение переживаемого как воспитания; неоднозначность отмечена в сноске, а не устранена молча.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Воспитание» выбрано вместо более узкого «наказание», чтобы сохранить формирующий и исправляющий диапазон παιδεία/παιδεύω. Лексический повтор поддержан в обеих частях стиха.
