  rationale: Исправление устраняет невыраженное в оригинале «всё» и делает пояснение альтернативного прочтения εἰς παιδείαν нейтральным по отношению к неназванному объекту ὑπομένετε. Образ отца и сыновей, лексическая связь «воспитания/воспитывает» и двусмысленность начального выражения сохранены.
