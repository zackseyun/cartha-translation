  source_fidelity: 'Основной смысл передан верно: παιδεία/παιδεύει последовательно переданы как «воспитание/воспитывает», сохранён образ «отец—сыновья», а риторический вопрос не ослаблен. Однако добавление «всё» к ὑπομένετε вносит не выраженное в греческом тексте обобщение. Его следует убрать. Сноска к εἰς παιδείαν должна описывать альтернативу без введения «испытаний», которых в данном стихе нет.'
  naturalness: «Бог обращается с вами как с сыновьями» литературно и понятно, но «Бог относится к вам как к сыновьям» несколько естественнее для современного русского. «Переносите ради воспитания» сохраняет краткость оригинала; отсутствие дополнения лучше, чем добавление «всё».
