base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/026.yaml
  text: whose voice shook the earth then[a], but now he has promised, saying[b], “Yet once more I will shake not only the earth but also the heaven.”
translation:
  language: ru
  text: 'Его голос тогда поколебал землю, а теперь Он обещал, сказав: «Ещё раз Я потрясу не только землю, но и небо[b]»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цитата из Аггея 2:6.
    reason: cross_reference
  - marker: b
    text: 'В греческом тексте стоит единственное число: «небо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ ἡ φωνὴ
  choice: Его голос
  rationale: Родительное относительное местоимение связывает стих с Богом, упомянутым в предыдущем контексте. В русском продолжение «Его голос» естественнее буквального «чей голос» и сохраняет эту связь.
- source_word: ἐσάλευσεν
  choice: поколебал
  rationale: Глагол передаёт сильное сотрясение земли; «поколебал» сохраняет возвышенный библейский регистр и перекликается с последующим «потрясу» без ненужного полного повтора.
- source_word: τὴν γῆν
  choice: землю
  rationale: В противопоставлении небу речь идёт о земле как части мироздания, а не о местной территории или почве.
- source_word: τότε, νῦν δὲ
  choice: тогда, а теперь
  rationale: Формулировка ясно и естественно передаёт временное противопоставление.
- source_word: ἐπήγγελται
  choice: обещал
  rationale: Перфект указывает на данное Богом обещание, сохраняющее силу; русский совершенный вид передаёт состоявшийся акт обещания, а контекст — его актуальность.
- source_word: Ἔτι ἅπαξ
  choice: Ещё раз
  rationale: Естественно передаёт единичность предстоящего повторного потрясения без добавочного толкования.
- source_word: σείσω
  choice: потрясу
  rationale: Будущая форма и образ вселенского потрясения переданы прямо и выразительно.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: не только ... но и
  rationale: Стандартная русская конструкция точно воспроизводит греческое сопоставление.
- source_word: τὸν οὐρανόν
  choice: небо
  rationale: Единственное число с артиклем обозначает небо как космическую область в паре «земля — небо»; русское «небо» естественно сохраняет это значение.
theological_decisions:
- issue: К кому относится местоимение и кто дал обещание
  choice: Местоимения «Его», «Он» и «Я» относятся к Богу, чей голос поколебал землю и кто обещает новое потрясение.
  alternative: Сохранить менее личную или синтаксически неясную формулировку.
  rationale: Предшествующий контекст и цитата из Аггея указывают на Бога как на говорящего; перевод не добавляет к этому дальнейших богословских уточнений.
- issue: Масштаб слов «земля» и «небо»
  choice: Передать их как всеохватную космическую пару.
  alternative: Перевести как «страна» и «небосвод».
  rationale: Противопоставление и дальнейшее объяснение автора требуют широкого смысла, но перевод не конкретизирует природу будущего потрясения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан естественным для русского продолжения мысли; прописные местоимения помогают ясно обозначить божественного Говорящего.
