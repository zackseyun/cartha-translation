  text: εἶτα τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας εἴχομεν παιδευτὰς καὶ ἐνετρεπόμεθα· οὐ ⸀πολὺ μᾶλλον ὑποταγησόμεθα τῷ πατρὶ τῶν πνευμάτων καὶ ζήσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/009.yaml
  text: Furthermore[a], we had our earthly fathers as disciplinarians, and we respected them[c][b]. Shall we not much more submit to the Father of spirits and live?
translation:
  language: ru
  text: Кроме того, у нас были земные отцы[a], которые нас воспитывали[b], и мы почитали их. Разве не тем более покоримся Отцу духов[c] и будем жить?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отцы нашей плоти»; также возможно: «наши отцы по плоти».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которые подвергали нас дисциплине».'
    reason: lexical_alternative
  - marker: c
    text: Выражение «Отец духов» может здесь означать, в частности, Отца наших духов в противопоставлении земным отцам, однако греческий текст сохраняет более широкий смысл.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: Кроме того
  rationale: Здесь слово вводит следующий, усиливающий довод, а не просто обозначает временную последовательность.
- source_word: τῆς σαρκὸς ἡμῶν πατέρας
  choice: земные отцы
  rationale: Выражение буквально указывает на отцов нашей плоти и противопоставляет человеческих отцов Отцу духов. «Земные отцы» естественно передаёт этот смысл и не приписывает слову σάρξ значения греховной природы.
- source_word: παιδευτὰς
  choice: которые нас воспитывали
  rationale: Слово обозначает тех, кто воспитывает посредством наставления и дисциплины. Глагольная конструкция звучит по-русски естественнее, чем отвлечённое существительное.
- source_word: ἐνετρεπόμεθα
  choice: мы почитали их
  rationale: В данном контексте глагол выражает почтительное отношение к родителям, подвергавшим детей воспитательной дисциплине.
- source_word: οὐ πολὺ μᾶλλον
  choice: Разве не тем более
  rationale: Сохраняет риторический вопрос и аргумент от меньшего к большему.
- source_word: ὑποταγησόμεθα
  choice: нам следует покориться
  rationale: Передаёт подразумеваемый призыв добровольно признать власть Бога; модальная русская конструкция естественно выражает силу греческого риторического вопроса.
- source_word: τῷ πατρὶ τῶν πνευμάτων
  choice: Отцу духов
  rationale: Близко передаёт широкую греческую конструкцию, не сужая её до «Отца наших духов» или только до Отца духовных существ.
- source_word: ζήσομεν
  choice: и жить
  rationale: Сохраняет тесную связь жизни с покорностью Богу в рамках одного риторического вопроса; русская инфинитивная конструкция соответствует форме «нам следует покориться».
theological_decisions:
- issue: Значение выражения «Отец духов»
  choice: Оставить широкое выражение «Отец духов»
  alternative: «Отец наших духов» или «Отец духовных существ»
  rationale: Непосредственный контраст с земными отцами допускает указание на Бога как Отца человеческих духов, однако греческий текст не содержит местоимения «наших» и может иметь более широкий смысл. Перевод не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Формулировка сохраняет риторический ход от человеческого родительского воспитания к покорности Богу, избегает архаизма «плотские отцы» и не сужает богословски неоднозначное выражение «Отец духов».
