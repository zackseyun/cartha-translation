  source_fidelity: 'Текст точно передаёт греческую структуру увещевания: ἐπισκοποῦντες передано как общинно направленное «Внимательно следите»; две придаточные части с μή τις сохранены; «корень горечи», его прорастание, причиняемое им беспокойство и осквернение многих воспроизведены без существенной потери смысла. «Чтобы никто не остался без Божьей благодати» удачно сохраняет предостерегающую неоднозначность ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, не навязывая вывод об утрате уже полученной благодати.'
