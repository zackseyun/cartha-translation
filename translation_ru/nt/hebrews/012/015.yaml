reference: Hebrews 12:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐπισκοποῦντες μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ καὶ ⸂δι’ αὐτῆς⸃ μιανθῶσιν ⸀πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
translation:
  language: ru
  text: Внимательно следите, чтобы никто не остался без Божьей благодати[a], чтобы никакой корень горечи, прорастая, не причинил беды и через него не осквернились многие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не лишился Божьей благодати». Греческое выражение может обозначать как недостижение предложенного, так и отставание от него или лишение его.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «корень горечи», вероятно, перекликается со Второзаконием 29:18, где ядовитый корень служит образом неверности завету, распространяющейся внутри общины.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκοποῦντες
  choice: Внимательно следите
  rationale: Причастие настоящего времени выражает деятельную и постоянную бдительность; русский императив естественно передаёт его увещевательную силу в связи с контекстом.
- source_word: μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ
  choice: чтобы никто не остался без Божьей благодати
  rationale: Оборот с ὑστερέω и ἀπό допускает значения недостатка, отставания и недостижения. Формулировка сохраняет серьёзность предостережения, не решая, идёт ли речь об утрате уже полученного или о недостижении предложенного.
- source_word: χάριτος
  choice: благодати
  rationale: «Благодать» — общепринятый русский библейский эквивалент, сохраняющий богословскую и заветную насыщенность слова.
- source_word: ῥίζα πικρίας
  choice: корень горечи
  rationale: Близко передаёт греческую конструкцию и сохраняет вероятную отсылку к Второзаконию 29:18.
- source_word: ἄνω φύουσα
  choice: прорастая
  rationale: Передаёт образ появляющегося и растущего корня естественным современным русским языком.
- source_word: ἐνοχλῇ
  choice: не причинил беды
  rationale: Глагол обозначает причинение беспокойства или trouble; выбранная формулировка подчёркивает вред для общины и согласуется с единственным числом подлежащего.
- source_word: δι’ αὐτῆς
  choice: через него
  rationale: Местоимение естественнее всего относится к «корню»; в русском род изменён в соответствии с родом существительного. «Через» сохраняет инструментальное значение διά.
- source_word: μιανθῶσιν πολλοί
  choice: не осквернились многие
  rationale: «Осквернились» сохраняет нравственно-культовую силу μιαίνω, а «многие» прямо передаёт πολλοί.
theological_decisions:
- issue: Следует ли понимать предупреждение как утрату спасения, неполучение благодати или отпадение от жизни общины
  choice: Нейтральное «не остался без Божьей благодати» с пояснением в сноске
  alternative: «не лишился Божьей благодати» или «не достиг Божьей благодати»
  rationale: Греческий оборот допускает более одного оттенка и сам по себе не разрешает последующие богословские споры об отступничестве и стойкости; перевод сохраняет эту напряжённость.
- issue: Следует ли ослабить «осквернились» до обозначения лишь общественного беспокойства
  choice: Сохранено «осквернились»
  alternative: «заразились» или «испортились»
  rationale: Глагол μιαίνω выражает более сильное нравственное или культовое осквернение, а не просто неудобство или разлад.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Внимательно следите» ясно выражает общинную ответственность; метафоры корня и осквернения сохранены без конфессионального истолкования.
