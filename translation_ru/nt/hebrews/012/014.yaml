source:
  edition: SBLGNT
  text: Εἰρήνην διώκετε μετὰ πάντων, καὶ τὸν ἁγιασμόν, οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/014.yaml
  text: Pursue peace with everyone[a], and the holiness without which no one will see the Lord.
translation:
  language: ru
  text: Стремитесь к миру со всеми и к святости[a], без которой никто не увидит Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к освящению». Греческое слово может означать как святость — качество и состояние жизни, так и освящение — процесс становления святым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνην
  choice: миру
  rationale: «Мир» передаёт здесь не только внутреннее спокойствие, но прежде всего мирные отношения с другими, на что указывает сочетание μετὰ πάντων — «со всеми».
- source_word: διώκετε
  choice: стремитесь
  rationale: Глагол выражает настойчивое, деятельное устремление. «Стремитесь» естественно звучит в современном русском увещевании и сохраняет идею целенаправленного усилия.
- source_word: μετὰ πάντων
  choice: со всеми
  rationale: Кратко и естественно передаёт универсальный охват греческого выражения, подразумевающего всех людей.
- source_word: τὸν ἁγιασμόν
  choice: к святости
  rationale: ἁγιασμός может обозначать святость как качество и состояние жизни, а также освящение как процесс. В данном призыве «святость» ясно передаёт нравственно-религиозную реальность, не превращая выражение в специальный богословский термин.
- source_word: οὗ χωρὶς
  choice: без которой
  rationale: Относительное местоимение мужского рода в греческом согласуется с ἁγιασμός; в русском род определяется словом «святость», поэтому естественно «без которой».
- source_word: οὐδεὶς ὄψεται
  choice: никто не увидит
  rationale: Прямо сохраняет абсолютное отрицание и будущую форму глагола зрения.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Передаёт титул κύριος традиционным и понятным русским соответствием, не уточняя референта сверх исходного текста.
theological_decisions:
- issue: Значение ἁγιασμός в контексте увещевания
  choice: святость
  alternative: освящение
  rationale: «Святость» естественно обозначает требуемый образ и состояние жизни, тогда как «освящение» может восприниматься преимущественно как специальный термин. Возможное процессуальное значение сохранено в сноске.
- issue: Референт титула τὸν κύριον
  choice: Господь, без дополнительного уточнения
  alternative: Бог; Господь Иисус
  rationale: Греческий текст не уточняет референта, поэтому перевод сохраняет содержательную открытость титула и не разрешает богословское напряжение за автора.
translation_notes:
  register: Современный литературный русский язык; тон краткий, увещевательный и достойный. Синтаксический параллелизм «к миру… и к святости» сохраняет структуру оригинала, а формулировка избегает конфессионально окрашенной терминологии.
