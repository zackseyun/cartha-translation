id: HEB.12.28
reference: Hebrews 12:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες ἔχωμεν χάριν, δι’ ἧς ⸀λατρεύωμεν εὐαρέστως τῷ θεῷ μετὰ ⸂εὐλαβείας καὶ δέους⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/028.yaml
  text: Therefore[a], since we are receiving an unshakable kingdom, let us have grace, through which we may serve God acceptably with reverence and awe,
translation:
  language: ru
  text: Итак, поскольку мы принимаем непоколебимое царство, да будет у нас благодать[a], посредством которой будем служить Богу так, как Ему угодно, с благоговением и трепетом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будем благодарны». Греческое выражение ἔχωμεν χάριν может означать как «да будет у нас благодать», так и, идиоматически, «будем благодарны».'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения о потрясении и устранении сотворённого.
- source_word: βασιλείαν ἀσάλευτον
  choice: непоколебимое царство
  rationale: Сохраняет образ царства, которое невозможно поколебать, и прямой контраст с колеблемым миропорядком в контексте.
- source_word: παραλαμβάνοντες
  choice: поскольку мы принимаем
  rationale: Настоящее причастие передано как обстоятельство причины с продолжающимся значением, относящееся к последующему призыву.
- source_word: ἔχωμεν χάριν
  choice: да будет у нас благодать
  rationale: Передаёт увещательное наклонение и основное лексическое значение χάρις, не добавляя идеи «держаться», которой нет в глаголе ἔχω. Возможное идиоматическое значение благодарности отмечено в сноске.
- source_word: δι’ ἧς
  choice: посредством которой
  rationale: Сохраняет инструментальное значение διά с родительным падежом и явную грамматическую связь относительного местоимения с «благодатью».
- source_word: λατρεύωμεν
  choice: будем служить
  rationale: Передаёт религиозное служение Богу, не сужая его до внутреннего поклонения или только обрядового действия.
- source_word: εὐαρέστως τῷ θεῷ
  choice: Богу так, как Ему угодно
  rationale: Естественно по-русски выражает служение, приемлемое и угодное Богу.
- source_word: μετὰ εὐλαβείας καὶ δέους
  choice: с благоговением и трепетом
  rationale: Различает почтительное благоговение и охватывающий человека трепет перед святостью Бога, не сводя второе слово ни к одному лишь ужасу, ни к ослабленному восхищению.
theological_decisions:
- issue: Значение χάριν в выражении ἔχωμεν χάριν
  choice: благодать
  alternative: благодарность; «будем благодарны»
  rationale: Последующее δι’ ἧς естественно указывает на благодать как средство, посредством которого совершается угодное Богу служение. Вместе с тем идиоматическое понимание как благодарности остаётся грамматически и лексически возможным, поэтому оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным, но понятным регистром. Формулировка «да будет у нас благодать» несколько возвышенна, однако ясна и позволяет сохранить подлинную смысловую неоднозначность. Слова «благоговение и трепет» удерживают торжественную серьёзность контекста.
