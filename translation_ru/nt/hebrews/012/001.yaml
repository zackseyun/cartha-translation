  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τοιγαροῦν καὶ ἡμεῖς, τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι’ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/001.yaml
  text: Therefore[a], since we also have so great a cloud of witnesses surrounding us, laying aside every weight and the sin that so easily entangles, let us run with endurance the race set before us,
translation:
  language: ru
  text: Итак, и мы, окружённые таким великим облаком свидетелей, сбросив с себя всякое бремя и грех, который так легко опутывает нас[a], будем с терпением бежать предстоящий нам забег,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грех, который тесно прилепляется»; или: «грех, который легко улавливает». Греческое прилагательное встречается редко и может указывать на то, что грех опутывает, легко улавливает или тесно прилепляется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιγαροῦν
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения, прежде всего из примеров веры в 11-й главе.
- source_word: τοσοῦτον ... νέφος μαρτύρων
  choice: такое великое облако свидетелей
  rationale: Сохраняет образ облака как огромного множества и усилительное значение τοσοῦτον.
- source_word: περικείμενον ἡμῖν
  choice: окружённые
  rationale: Естественно передаёт пространственный образ множества, расположенного вокруг нас.
- source_word: μαρτύρων
  choice: свидетелей
  rationale: Сохраняет возможность понимать названных в 11-й главе как свидетельствующих своей верой, не утверждая однозначно, что они лишь зрители состязания.
- source_word: ὄγκον ... πάντα
  choice: всякое бремя
  rationale: Передаёт тяжесть или обременение, мешающее бегущему, и сохраняет метафорическую широту выражения.
- source_word: ἀποθέμενοι
  choice: сбросив с себя
  rationale: Выражает решительное устранение того, что мешает, и естественно сочетается с образом бегуна.
- source_word: τὴν εὐπερίστατον ἁμαρτίαν
  choice: грех, который так легко опутывает нас
  rationale: В контексте бега ясно передаёт опасность помехи, но редкость и неоднозначность прилагательного отмечены в сноске.
- source_word: δι’ ὑπομονῆς
  choice: стойко
  rationale: Передаёт терпеливую выносливость и упорство в трудностях естественным современным русским наречием.
- source_word: τρέχωμεν
  choice: будем ... бежать
  rationale: Передаёт увещевательное сослагательное наклонение первого лица множественного числа.
- source_word: τὸν προκείμενον ἡμῖν ἀγῶνα
  choice: дистанцию, которая нам предстоит
  rationale: Контекст глагола «бежать» поддерживает образ забега; «дистанция» естественно обозначает назначенный бегуну путь, тогда как ἀγών также может означать состязание или борьбу.
theological_decisions:
- issue: Значение «свидетелей» по отношению к героям веры из 11-й главы
  choice: Люди, чья жизнь свидетельствует о вере, при сохранении образа окружающего множества
  alternative: Небесные зрители, непосредственно наблюдающие за бегом верующих
  rationale: Контекст прежде всего указывает на примеры веры из 11-й главы. Слово «свидетели» сохраняет образ и не снимает полностью возможность зрительской ассоциации, но перевод не превращает её в однозначное богословское утверждение.
- issue: Определённость выражения τὴν ... ἁμαρτίαν
  choice: «грех» как конкретно представленная общая сила или помеха
  alternative: Один определённый, но не названный грех
  rationale: Артикль сохранён синтаксической конкретностью конструкции, однако перевод не называет какой-либо особый грех и не навязывает его отождествление.
translation_notes:
  register: Современный литературный русский язык с достоинством увещевательной речи. Образ бега сохранён без архаизмов; финальная запятая отражает продолжение предложения в следующем стихе.
