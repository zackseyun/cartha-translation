  to: Итак, и мы, окружённые таким великим облаком свидетелей, сбросив с себя всякое бремя и грех, который так легко опутывает нас[a], будем с терпением бежать предстоящий нам забег,
  rationale: 'Исправлены только две формулировки, где требовались более точная передача греческого текста и более естественный русский: δι’ ὑπομονῆς передано как «с терпением», а ἀγών в контексте τρέχωμεν — как «забег». Образ «облака свидетелей», синтаксическое развитие фразы и финальная запятая, обусловленная продолжением в следующем стихе, сохранены. Сноска продолжает отмечать реальную лексическую неоднозначность εὐπερίστατον.'
