  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
translation:
  language: ru
  text: и к звуку трубы, и к голосу, произносившему слова[a][b]. Услышавшие этот голос просили, чтобы к ним больше не было обращено ни слова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «услышавшие всё это просили, чтобы к ним больше не было обращено ни слова», если относить местоимение шире — ко всему синайскому явлению, а не только к голосу.'
    reason: alternative_reading
  - marker: b
    text: См. Исход 20:18–19 и Второзаконие 5:23–27, где израильтяне просят, чтобы Бог больше не говорил с ними напрямую.
    reason: cross_reference
lexical_decisions:
- source_word: σάλπιγγος ἤχῳ
  choice: к звуку трубы
  rationale: Сочетание передаёт конкретный слуховой образ Синая и близко соответствует значению ἦχος, не усиливая его до «трубного грохота» или непременно «трубного сигнала».
- source_word: φωνῇ ῥημάτων
  choice: к голосу, звучавшему словами
  rationale: Формулировка сохраняет необычный образ членораздельного голоса, а не простого шума. Буквальное «голосу слов» в современном русском звучит неясно, тогда как выбранный оборот естественнее и не уточняет содержание речи.
- source_word: ἧς οἱ ἀκούσαντες
  choice: услышавшие этот голос
  rationale: Ближайший грамматический антецедент ἧς — φωνῇ. В русском после перестройки фразы указание «этот голос» ясно сохраняет данную связь; более широкое отнесение ко всему синайскому явлению отмечено в сноске.
- source_word: παρῃτήσαντο
  choice: просили
  rationale: В контексте глагол означает настойчивую просьбу избавить их от дальнейшего прямого обращения. «Просили» естественно по-русски и не превращает просьбу в простой отказ.
- source_word: μὴ προστεθῆναι αὐτοῖς λόγον
  choice: чтобы к ним больше не было обращено ни слова
  rationale: Передан отрицательный инфинитив содержания просьбы, значение дальнейшего добавления в προστίθημι и пассивная направленность речи к слушателям. «Ни слова» естественно передаёт λόγον в данном контексте.
theological_decisions:
- issue: К чему относится относительное местоимение ἧς
  choice: В основном тексте просьба непосредственно связана с голосом, звучавшим словами.
  alternative: Относительное местоимение может шире отсылать ко всему предшествующему синайскому проявлению, включая звук трубы и голос.
  rationale: Женский род и единственное число ἧς наиболее прямо соотносятся с ближайшим существительным φωνῇ, однако контекст позволяет видеть причиной просьбы всё устрашающее явление. Основной текст следует ближайшей грамматической связи, а сноска сохраняет более широкую возможность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической структурой. Повтор «и к… и к…» сохраняет риторическое перечисление контекста. Необычность φωνῇ ῥημάτων умеренно сохранена выражением «голосу, звучавшему словами» без архаизма «глас глаголов».
