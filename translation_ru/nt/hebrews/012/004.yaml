lexical_decisions:
- source_word: οὔπω
  choice: ещё не
  rationale: 'Естественно передаёт временное значение: указанный предел пока не достигнут.'
- source_word: μέχρις αἵματος
  choice: до крови
  rationale: Сохраняет краткий и выразительный греческий оборот, обозначающий сопротивление вплоть до кровопролития, тяжёлого ранения или смерти; его смысл пояснён в сноске.
- source_word: ἀντικατέστητε
  choice: сопротивлялись
  rationale: Передаёт активное противостояние и согласуется с образом борьбы в причастном обороте.
- source_word: πρὸς τὴν ἁμαρτίαν
  choice: против греха
  rationale: Предлог выражает направленное противодействие; формулировка не сужает значение греха до одной конкретной разновидности.
- source_word: ἀνταγωνιζόμενοι
  choice: борясь
  rationale: Настоящее причастие описывает продолжающуюся борьбу, в ходе которой происходит сопротивление; краткая форма естественна для современного русского языка.
theological_decisions:
- issue: К чему именно относится «грех» в контексте
  choice: Передать обобщённо как «грех», не уточняя референт.
  alternative: Греховное противодействие гонителей; грех вообще; искушение отступить от веры.
  rationale: Сам стих не ограничивает значение слова одной из этих возможностей. Обобщённый перевод сохраняет заложенную в тексте смысловую напряжённость.
- issue: Степень сопротивления, выраженная оборотом μέχρις αἵματος
  choice: Сохранить «до крови» и пояснить диапазон значения в сноске.
  alternative: Эксплицировать в тексте как «до пролития собственной крови» или «до смерти».
  rationale: Греческий оборот указывает на предел кровопролития, но сам по себе не уточняет, идёт ли речь исключительно о мученической смерти или также о тяжёлом физическом страдании.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, энергичная и достойная. Слово «грех» намеренно оставлено без поясняющего уточнения.
