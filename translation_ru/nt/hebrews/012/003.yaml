    rationale: γάρ в данном контексте вводит основание для предшествующего увещания. «Ибо» передаёт эту связь точнее.
  - severity: medium
    issue: Неудачная синтаксическая привязка «обращённое против них самих»
    rationale: Причастный оборот после «со стороны грешников» читается тяжело и не вполне ясно. Прямое «противодействие грешников против самих себя» лучше сохраняет намеренно трудную направленность чтения SBLGNT.
  - severity: low
