  text: Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/003.yaml
  text: For consider the one who endured such opposition from sinners against himself[a], so that you may not grow weary[b], becoming discouraged in your souls.
translation:
  language: ru
  text: Ибо подумайте о Том, Кто претерпел такое противодействие грешников против самих себя[a], чтобы вы не изнемогли, падая духом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Некоторые рукописи читают: «против Него Самого». В тексте SBLGNT стоит форма множественного числа: «против самих себя». По контексту речь идёт о противодействии, которое претерпел Иисус.'
    reason: textual_variant
  - marker: b
    text: 'Или: «ослабевая в ваших душах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναλογίσασθε
  choice: Вдумайтесь
  rationale: Аористный императив призывает к сосредоточенному и тщательному размышлению. «Вдумайтесь» естественно передаёт и побудительную силу, и идею внимательного рассмотрения.
- source_word: τὸν ... ὑπομεμενηκότα
  choice: в Того, Кто претерпел
  rationale: Субстантивированное причастие указывает на Иисуса из непосредственного контекста (12:2), не называя Его здесь по имени. «Претерпел» передаёт стойкое перенесение враждебного отношения; прописная буква помогает обозначить ясный контекстуальный референт, не добавляя имени в текст.
- source_word: τοιαύτην ... ἀντιλογίαν
  choice: такое противодействие
  rationale: τοιαύτην характеризует противодействие как подобное уже описанному или столь значительное, не уточняя исключительно степень. ἀντιλογία здесь шире словесного «пререкания» и обозначает враждебное сопротивление.
- source_word: ὑπὸ τῶν ἁμαρτωλῶν
  choice: со стороны грешников
  rationale: Оборот с ὑπό обозначает источник действия. «Грешники» прямо сохраняет нравственную характеристику исходного текста.
- source_word: εἰς ἑαυτοὺς
  choice: обращённое против них самих
  rationale: Основной текст следует форме множественного числа ἑαυτούς в SBLGNT, хотя она создаёт смысловое напряжение в контексте. Более понятное контекстуальное чтение единственного числа отмечено в сноске.
- source_word: κάμητε
  choice: вам не изнемочь
  rationale: Глагол обозначает утомление и утрату сил. «Изнемочь» сохраняет серьёзность предостережения и подходит к образу стойкости в контексте.
- source_word: ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι
  choice: ослабевая душой
  rationale: Причастие описывает внутреннее ослабление, сопровождающее изнеможение. Единственное число «душой» естественно в русском распределительном употреблении, тогда как греческий текст имеет множественное число.
theological_decisions:
- issue: Кого обозначает «Тот, Кто претерпел»
  choice: Иисус, названный в непосредственном контексте, но без повторения имени в этом стихе
  alternative: Явно вставить имя «Иисус»
  rationale: Евр 12:2 прямо называет Иисуса, поэтому референт ясен. Сохранение описательной формы исходного текста избегает ненужного добавления.
- issue: Направленность противодействия в εἰς ἑαυτούς
  choice: 'В основном тексте сохранено чтение SBLGNT: «против них самих»'
  alternative: «Против Него Самого», согласно варианту ἑαυτόν и очевидному контекстуальному смыслу
  rationale: Форма SBLGNT во множественном числе не должна молча исправляться ради более гладкого богословского смысла. Вариант единственного числа, относящий противодействие к Иисусу, указан в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным наставительным тоном. Синтаксис сохраняет тесную связь между изнеможением и внутренним ослаблением; трудное чтение SBLGNT не сглажено и пояснено сноской.
