  source_fidelity: Основная смысловая структура передана верно, включая трудное чтение SBLGNT εἰς ἑαυτούς («против самих себя») и вариант единственного числа в сноске. Однако «же» не передаёт причинный γάρ достаточно ясно, а сочетание «противодействие ..., обращённое...» синтаксически тяжеловесно и может создать впечатление, будто «обращённое» относится к грешникам, а не к противодействию.
  naturalness: Предлагаемая редакция сохраняет современный литературный и наставительный регистр. «Ибо подумайте о Том» естественно передаёт призыв к внимательному рассмотрению; «не изнемогли, падая духом» ясно выражает связь между утомлением и внутренним упадком.
  terminology: «Грешники», «претерпел» и «противодействие» уместны и сохраняют нравственную характеристику, выносливость и широкое значение ἀντιλογία. Трудное «против самих себя» оставлено в основном тексте без догматического сглаживания.
