source:
  edition: SBLGNT
  text: τὸ δὲ Ἔτι ἅπαξ δηλοῖ ⸂τῶν σαλευομένων⸃ μετάθεσιν ὡς πεποιημένων, ἵνα μείνῃ τὰ μὴ σαλευόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/027.yaml
  text: This phrase, “Yet once more,” indicates the removal of the things being shaken—as things that have been made—so that the things not being shaken may remain.
translation:
  language: ru
  text: Выражение «ещё раз» указывает на устранение колеблемого как сотворённого[a], чтобы осталось неколеблемое[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как сделанных»; возможный перевод: «как созданного».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «то, что нельзя поколебать» или «непоколебимое».'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ δὲ Ἔτι ἅπαξ
  choice: А слова «ещё раз»
  rationale: Артикль субстантивирует цитируемое выражение, поэтому по-русски естественно назвать его «словами»; δέ передано мягким связующим «а».
- source_word: δηλοῖ
  choice: указывают
  rationale: Передаёт пояснительно-выводное значение глагола в современном литературном русском.
- source_word: τῶν σαλευομένων
  choice: колеблемого
  rationale: Субстантивированное причастие сохраняет обобщённый характер греческого выражения и его связь с образом потрясения.
- source_word: μετάθεσιν
  choice: устранение
  rationale: В контексте речь идёт об удалении, а не просто об изменении; «устранение» естественно сочетается с абстрактным собирательным «колеблемое».
- source_word: ὡς πεποιημένων
  choice: как сотворённого
  rationale: 'Сохраняет ὡς и смысл совершенного страдательного причастия: речь о том, что относится к созданному; вариант не уточняет сверх текста, кем именно оно сотворено.'
- source_word: ἵνα μείνῃ
  choice: чтобы осталось
  rationale: Естественно передаёт цель или предполагаемый результат конструкции с ἵνα.
- source_word: τὰ μὴ σαλευόμενα
  choice: неколеблемое
  rationale: Сохраняет параллель с «колеблемым» и не усиливает отрицание до явной невозможности быть поколебленным.
theological_decisions:
- issue: Следует ли передавать τὰ μὴ σαλευόμενα как фактически не колеблемое или как принципиально непоколебимое
  choice: неколеблемое
  alternative: то, что нельзя поколебать / непоколебимое
  rationale: В стихе стоит отрицание μή при причастии, а не прямое выражение невозможности. Выбранная формулировка сохраняет контраст греческих причастий и не переносит преждевременно формулировку о непоколебимом царстве из следующего стиха.
- issue: Как понимать ὡς πεποιημένων
  choice: как сотворённого
  alternative: то есть сотворённого
  rationale: '«Как» сохраняет формальную неоднозначность ὡς: выражение может характеризовать колеблемое в качестве созданного, не превращая связь в однозначное пояснительное отождествление.'
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Собирательные формы «колеблемое» и «неколеблемое» воспроизводят симметрию исходного текста; архаичное «поколеблемое» не используется.
