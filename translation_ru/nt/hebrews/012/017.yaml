  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
translation:
  language: ru
  text: Ведь вы знаете, что позднее, когда он захотел унаследовать благословение, он был отвергнут, потому что не нашёл возможности для покаяния[a], хотя со слезами добивался этого[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не нашёл места для покаяния». Это может означать, что он не нашёл возможности изменить исход происшедшего или добиться от Исаака перемены решения; возможно и понимание, что речь идёт о его собственном покаянии.'
    reason: alternative_reading
  - marker: b
    text: «Этого» может относиться к благословению или к покаянию; греческий текст оставляет референт неоднозначным.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε γὰρ
  choice: Ведь вы знаете
  rationale: ἴστε имеет настоящее значение «вы знаете», а γάρ вводит основание предшествующего предостережения; «ведь» естественно передаёт эту связь.
- source_word: καὶ μετέπειτα
  choice: и впоследствии
  rationale: 'καί здесь усиливает временной поворот: даже позднее, после прежнего поступка; «и впоследствии» сохраняет этот оттенок без тяжеловесности.'
- source_word: θέλων κληρονομῆσαι τὴν εὐλογίαν
  choice: когда он захотел унаследовать благословение
  rationale: Причастие θέλων естественно передано временным придаточным; κληρονομῆσαι сохраняет образ получения по наследству, связанный с рассказом об Исаве.
- source_word: ἀπεδοκιμάσθη
  choice: он был отвергнут
  rationale: Пассивная форма означает отказ или отвержение после рассмотрения; формулировка не привносит специального смысла вечного осуждения.
- source_word: μετανοίας ... τόπον οὐχ εὗρεν
  choice: не нашёл возможности для перемены решения
  rationale: Буквально «не нашёл места для перемены ума/решения». В данном контексте речь может идти как о невозможности изменить исход, так и о невозможности добиться перемены решения Исаака; нейтральная формулировка сохраняет обе возможности.
- source_word: καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν
  choice: хотя со слезами добивался этого
  rationale: καίπερ выражает уступку, μετὰ δακρύων — образ действия, а «добивался» передаёт настойчивость ἐκζητέω. Средний род «этого» позволяет не определять однозначно, относится ли местоимение к благословению или к перемене решения.
theological_decisions:
- issue: Значение μετανοίας и лицо, чьё решение должно было перемениться
  choice: «возможности для перемены решения» с пояснением в сноске
  alternative: «возможности для покаяния» или «места для раскаяния»
  rationale: μετάνοια может означать перемену ума или решения и в новозаветном употреблении часто означает покаяние. Однако повествовательный фон Бытия допускает понимание как невозможности обратить последствия, так и отказа Исаака изменить решение. Основной текст не должен сводить фразу исключительно к внутреннему покаянию Исава.
- issue: Референт αὐτήν
  choice: «этого», с сохранением неоднозначности
  alternative: «благословения» либо «перемены решения»
  rationale: Греческое местоимение женского рода грамматически может относиться как к εὐλογίαν («благословение»), так и к μετάνοιας («перемена ума/решения»). Русское «этого» сохраняет референциальную открытость.
translation_notes:
  register: Современный литературный русский, торжественный, но понятный. Синтаксис сохраняет причинно-уступительную структуру греческого текста. Сноски отмечены в основном тексте как [a] и [b].
