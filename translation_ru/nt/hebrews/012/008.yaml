source:
  edition: SBLGNT
  text: εἰ δὲ χωρίς ἐστε παιδείας ἧς μέτοχοι γεγόνασι πάντες, ἄρα νόθοι ⸂καὶ οὐχ υἱοί ἐστε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/008.yaml
  text: But if you are without discipline, of which all have become sharers, then you are illegitimate children and not sons.
translation:
  language: ru
  text: Если же вы без воспитания, к которому причастны все, то вы — незаконнорождённые, а не сыновья.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείας
  choice: наставляющего наказания
  rationale: В контексте отрывка слово обозначает отцовское воспитание, включающее исправление и наказание; сочетание сохраняет обе стороны значения.
- source_word: μέτοχοι γεγόνασι
  choice: подверглись
  rationale: По-русски естественно сочетается с «наставляющим наказанием» и передаёт участие в нём, хотя формальный образ «стали причастны» выражен менее буквально.
- source_word: νόθοι
  choice: незаконнорождённые дети
  rationale: Передаёт противопоставление детям, признанным законными сыновьями и наследниками, без грубой или устаревшей лексики.
- source_word: υἱοί
  choice: сыновья
  rationale: Сохраняет мужской род и связанный с ним в древнем контексте оттенок признанного сыновства и наследственного положения.
theological_decisions:
- issue: Охват слова πάντες («все»)
  choice: «все» оставлено без уточнения
  alternative: «все Божьи дети» или «все сыновья»
  rationale: Греческий текст не называет группу прямо; перевод сохраняет эту контекстуальную неоднозначность.
- issue: Характер παιδεία
  choice: «наставляющее наказание»
  alternative: «воспитание», «наказание» или «дисциплина»
  rationale: Контекст Евреям 12 соединяет формирование ребёнка с болезненным исправлением; выбранное выражение не сводит смысл лишь к каре или лишь к обучению.
translation_notes:
  register: Современный литературный русский язык; тон прямой и назидательный. «Незаконнорождённые» точно, но без излишней резкости передаёт социально-правовой образ оригинала.
