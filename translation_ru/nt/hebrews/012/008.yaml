- from: Если же вы остаётесь без наставляющего наказания, которому подверглись все, то вы незаконнорождённые дети, а не сыновья.
  to: Если же вы без воспитания, к которому причастны все, то вы — незаконнорождённые, а не сыновья.
  rationale: Текст исправлен для более точной передачи греческих εἰ ... ἐστε, μέτοχοι γεγόνασι и παιδεία при сохранении современного литературного регистра и прямоты исходного образа.
  reviewer_model: gpt-5.6-terra
