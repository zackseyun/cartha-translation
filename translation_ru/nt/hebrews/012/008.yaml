review_pass:
  verdict: revise
  source_fidelity: «Остаётесь» не выражено в греческом тексте; εἰ ... ἐστε означает «если вы без / не имеете». «Подверглись» сужает μέτοχοι γεγόνασι («стали причастны, сделались участниками») до претерпевания. Исправленный текст сохраняет условие, всеобщность πάντες и резкое противопоставление νόθοι ... οὐχ υἱοί.
  naturalness: «Воспитание» — естественное современное слово для παιδεία в образе отцовского отношения; контекст ближайших стихов позволяет ему включать исправление и наказание. «К которому причастны все» литературно и ясно. Убрано неестественное тяжеловесное сочетание «наставляющее наказание».
  terminology: «Незаконнорождённые» точно передаёт νόθοι в его социально-правовом образе и не добавляет толкования. «Сыновья» сохраняет υἱοί и намеренное противопоставление оригинала.
  issues:
  - severity: medium
    issue: Добавлено значение длительного пребывания
    rationale: «Остаётесь без» привносит аспект длительности, которого в εἰ ... ἐστε нет.
  - severity: medium
    issue: Сужено значение μέτοχοι γεγόνασι
    rationale: «Которому подверглись» представляет всех лишь как претерпевших наказание, тогда как оригинал говорит об их причастности к παιδεία.
  - severity: low
    issue: Неудачно передано παιδεία
    rationale: «Наставляющее наказание» не является естественным современным русским сочетанием и чрезмерно выдвигает карательный аспект; «воспитание» сохраняет широкий смысл слова.
  revised_text: Если же вы без воспитания, к которому причастны все, то вы — незаконнорождённые, а не сыновья.
