  yaml_path: translation/nt/hebrews/003/011.yaml
  text: as I swore in my wrath[a], ‘They shall never enter my rest.’
translation:
  language: ru
  text: 'как Я поклялся в гневе Моём: «Не войдут они в Мой покой».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «Если они войдут в Мой покой» — клятвенная формула со значением: «Они ни за что не войдут в Мой покой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: как
  rationale: Естественно вводит продолжение цитаты и сохраняет сравнительно-повествовательную связь с предшествующим контекстом.
- source_word: ὤμοσα
  choice: Я поклялся
  rationale: Прямо передаёт аорист ὀμνύω и торжественный характер клятвы.
- source_word: ἐν τῇ ὀργῇ μου
  choice: в гневе Моём
  rationale: «Гнев» сохраняет серьёзность Божьего суда; порядок слов придаёт цитате dignified, библейски узнаваемое, но понятное современному читателю звучание.
- source_word: Εἰ εἰσελεύσονται
  choice: Не войдут они
  rationale: Конструкция εἰ с будущим временем представляет семитскую клятвенную формулу, по смыслу выражающую решительное отрицание, а не обычное условие.
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: в Мой покой
  rationale: «Покой» сохраняет ключевой мотив Послания к евреям и не сужает значение до земли, небес или внутреннего умиротворения.
theological_decisions:
- issue: Передача клятвенной формулы Εἰ εἰσελεύσονται
  choice: «Не войдут они в Мой покой»
  alternative: «Если они войдут в Мой покой»
  rationale: Буквальная условная форма по-русски была бы понята неверно. Явное отрицание передаёт силу греко-семитской формулы, не добавляя богословского толкования.
- issue: Значение κατάπαυσις
  choice: «покой»
  alternative: «место покоя»
  rationale: «Покой» сохраняет межтекстовую связь с Псалмом 94 и развиваемую в Послании богословскую многозначность.
translation_notes:
  register: Современный литературный русский с торжественным, но ясным строем. Местоимения, относящиеся к Богу, написаны с прописной буквы; инверсия «в гневе Моём» поддерживает достоинство прямой божественной речи без архаизации.
