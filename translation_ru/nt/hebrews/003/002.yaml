translation:
  language: ru
  text: Он был верен Тому, кто назначил Его[a], как и Моисей был верен в Его доме[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сотворил Его». Греческий глагол может означать «сделать, сотворить», но здесь, вероятно, имеет смысл «назначить».'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях: «во всём Его доме», что ближе к формулировке Чисел 12:7. Вероятно, имеется в виду Божий дом.'
    reason: textual_variant
lexical_decisions:
- source_word: πιστὸν ὄντα
  choice: Он был верен
  rationale: Причастный оборот относится к Иисусу, названному в предыдущем стихе. В русском языке личная конструкция звучит естественно; «верен» здесь означает надёжность и преданность порученному делу, а не наличие веры.
- source_word: τῷ ποιήσαντι αὐτὸν
  choice: Тому, Кто поставил Его
  rationale: В данном контексте ποιέω наиболее естественно передаёт назначение или поставление на служение. При этом буквальное значение «сделал/сотворил» сохраняется в сноске как подлинная лексическая возможность.
- source_word: ὡς καὶ
  choice: как и
  rationale: Кратко и естественно передаёт сопоставление верности Иисуса и Моисея.
- source_word: Μωϋσῆς
  choice: Моисей
  rationale: Общепринятая русская форма имени.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: в Его доме
  rationale: Перевод следует представленному тексту SBLGNT без слова «всём». Слово «дом» сохраняет образ, развиваемый в следующих стихах; местоимение не заменено словом «Божьем», чтобы не устранять выраженную в греческом тексте референциальную неоднозначность.
theological_decisions:
- issue: Значение ποιήσαντι применительно к Сыну
  choice: поставил
  alternative: 'сотворил (буквально также: сделал)'
  rationale: Контекст говорит о поручении и верности в служении, поэтому «поставил» передаёт вероятный смысл глагола, не превращая возможную лексическую двусмысленность в утверждение о сотворённости Сына. Альтернатива отмечена в сноске.
- issue: К кому относится αὐτοῦ в выражении «в Его доме»
  choice: Сохранено местоимение «Его»; вероятный смысл — дом Бога
  alternative: дом Моисея
  rationale: Аллюзия на Числа 12:7 и ход рассуждения указывают на Божий дом, однако местоименная форма оригинала сохранена, чтобы не делать неявный референт явным в основном тексте.
- issue: Наличие слова «всём» перед «доме»
  choice: Основной текст без «всём»
  alternative: «во всём Его доме»
  rationale: Предоставленный текст SBLGNT читает ἐν τῷ οἴκῳ αὐτοῦ, тогда как ряд рукописей содержит расширенное чтение, сближающее стих с Числами 12:7. Вариант вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизмов. Заглавные буквы в местоимениях «Тому», «Кто», «Его» помогают проследить отсылки к Богу и Иисусу, однако выражение «в Его доме» формально сохраняет местоимение оригинала. Тире обозначает естественный эллипсис сказуемого во второй части сравнения.
