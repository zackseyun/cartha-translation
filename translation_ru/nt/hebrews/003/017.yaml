lexical_decisions:
- source_word: προσώχθισεν
  choice: гневался
  rationale: Глагол обозначает гнев или негодование по отношению к кому-либо. «Гневался» естественно звучит по-русски и сохраняет смысл риторического вопроса.
- source_word: τεσσεράκοντα ἔτη
  choice: сорок лет
  rationale: Винительный падеж выражает продолжительность времени; в русском языке длительность здесь естественно передаётся без предлога.
- source_word: ἁμαρτήσασιν
  choice: тем, кто согрешил
  rationale: Аористное причастие указывает на согрешивших людей поколения, странствовавшего по пустыне. Формулировка ясна и близка к структуре исходного текста.
- source_word: κῶλα
  choice: тела
  rationale: Буквально слово может обозначать члены тела, но в данном контексте — тела погибших. «Тела» передаёт смысл естественно, не ослабляя связи с гибелью в пустыне; буквальная окраска отмечена в сноске.
- source_word: ἔπεσεν
  choice: пали
  rationale: Глагол сохраняет образ падения и в контексте подразумевает смерть, не добавляя прямо отсутствующего в нём слова «замертво».
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: Выражение отсылает к странствованию Израиля по пустыне; «пустыня» — привычное и точное библейское обозначение этого места.
theological_decisions:
- issue: Подразумеваемое подлежащее при προσώχθισεν
  choice: Он, то есть Бог
  alternative: повторить имя «Бог»
  rationale: В греческом тексте подлежащее подразумевается из контекста. Русское «Он» делает вопрос естественным, сохраняя контекстуальную отсылку к Богу и не вводя нового утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены два риторических вопроса, противопоставление через «же» и образ тел, павших в пустыне. Местоимение «Он» написано с прописной буквы как отсылка к Богу.
