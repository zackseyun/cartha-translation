  text: καὶ βλέπομεν ὅτι οὐκ ἠδυνήθησαν εἰσελθεῖν δι’ ἀπιστίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/019.yaml
  text: And we see that they were not able to enter because of unbelief[a].
translation:
  language: ru
  text: И мы видим, что они не смогли войти из-за неверия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за неверности». Греческое слово может обозначать не только отсутствие веры, но и неверность — отказ довериться.'
    reason: Лексическая альтернатива, сохраняющая смысловой диапазон ἀπιστία.
lexical_decisions:
- source_word: καὶ
  choice: Итак
  rationale: В данном заключительном предложении καί связывает вывод с предшествующим рассуждением; «итак» естественно передаёт эту связь по-русски, не меняя содержания вывода.
- source_word: βλέπομεν
  choice: мы видим
  rationale: Настоящее время и первое лицо множественного числа сохранены, благодаря чему вывод звучит непосредственно и выразительно.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание того, что автор и читатели видят.
- source_word: οὐκ ἠδυνήθησαν
  choice: они не смогли
  rationale: Естественная современная русская передача невозможности, выраженной формой δύναμαι.
- source_word: εἰσελθεῖν
  choice: войти
  rationale: Инфинитив точно передаёт действие; его предмет определяется контекстом — речь идёт о вхождении в обещанное Богом.
- source_word: δι’
  choice: из-за
  rationale: διά с винительным падежом обозначает причину; «из-за» ясно и естественно выражает причинную связь.
- source_word: ἀπιστίαν
  choice: неверия
  rationale: «Неверие» непосредственно передаёт отсутствие веры и отказ довериться Божьему слову; возможный оттенок неверности сохранён в сноске.
theological_decisions:
- issue: Передача ἀπιστία в связи с многозначностью πίστις
  choice: неверие
  alternative: неверность
  rationale: Ближайший контекст подчёркивает отказ Израиля поверить Божьему обещанию и довериться ему, поэтому «неверие» наиболее ясно для основного текста. «Неверность» сохраняет оттенок нелояльности и отказа доверять и указана в сноске, чтобы не устранять смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка сохраняет выводный характер стиха и его прямую риторическую форму.
