  text: πλείονος γὰρ ⸂οὗτος δόξης⸃ παρὰ Μωϋσῆν ἠξίωται καθ’ ὅσον πλείονα τιμὴν ἔχει τοῦ οἴκου ὁ κατασκευάσας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: ru
  text: Ибо Он удостоен большей славы, чем Моисей, поскольку тот, кто построил дом, пользуется большей честью, чем сам дом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Он
  rationale: Указательное местоимение относится к Иисусу из предыдущего контекста; прописная буква естественно обозначает этот референт в русском библейском тексте, не добавляя имени.
- source_word: ἠξίωται
  choice: удостоен
  rationale: Передаёт перфектную пассивную форму со значением признания или наделения достойным большей славы.
- source_word: καθ’ ὅσον
  choice: поскольку
  rationale: 'Сохраняет сравнительно-обосновывающую связь: превосходство славы объясняется аналогией со строителем и домом.'
- source_word: ὁ κατασκευάσας
  choice: строитель
  rationale: Естественно по-русски выражает субстантивированное причастие «тот, кто устроил/построил» в образе дома.
- source_word: τιμήν
  choice: честь
  rationale: Отличает τιμή от предшествующего δόξα «слава» и сохраняет лексическое различие оригинала.
theological_decisions:
- issue: Кто удостоил Иисуса большей славы
  choice: Сохранена пассивная конструкция «Он удостоен» без указания действующего лица.
  alternative: «Бог удостоил Его» или «Он заслуживает».
  rationale: Греческий текст использует пассив ἠξίωται и не называет деятеля; активная формулировка либо добавила бы Бога, либо изменила оттенок смысла.
- issue: Соотношение Иисуса, строителя и дома
  choice: Аналогия сохранена без прямого отождествления Иисуса со строителем внутри данного стиха.
  alternative: «Потому что Иисус, построивший дом…»
  rationale: Такое отождествление вытекает из хода рассуждения, но не выражено здесь грамматически как отдельное прямое утверждение; перевод не должен преждевременно снимать риторическое напряжение.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная. «Сам дом» ясно передаёт αὐτόν и избегает неясного местоименного отнесения.
