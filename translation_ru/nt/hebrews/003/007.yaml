lexical_decisions:
- source_word: Διό
  choice: Поэтому
  rationale: Передаёт выводное значение союза и связывает увещание с предшествующим рассуждением.
- source_word: καθὼς
  choice: как
  rationale: Естественно вводит цитату и сохраняет сопоставительную связь без избыточного усиления.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет непосредственное и продолжающее звучание Писания.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Святой Дух
  rationale: Стандартная и точная передача определённого греческого словосочетания без добавочного акцента.
- source_word: Σήμερον
  choice: Сегодня
  rationale: Прямая передача временного наречия в начале цитаты.
- source_word: ἐὰν
  choice: если
  rationale: Прямо и естественно вводит условную часть высказывания.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: Его голос
  rationale: Родительный падеж при ἀκούω естественно передаётся в русском винительным; «голос» сохраняет личный характер обращения.
- source_word: ἀκούσητε
  choice: услышите
  rationale: Сохраняет основное значение глагола и условную форму, не добавляя толкования «послушаетесь».
theological_decisions:
- issue: Кому приписаны слова цитируемого псалма
  choice: Цитата прямо вводится как речь Святого Духа.
  alternative: Святой Дух говорит через Писание или псалмопевца.
  rationale: 'Греческий текст прямо говорит: «говорит Святой Дух». Перевод сохраняет эту атрибуцию, не развивая её в отдельное учение о богодухновенности.'
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизмов. Конечная запятая оставлена внутри незавершённой цитаты, которая продолжается в следующем стихе.
