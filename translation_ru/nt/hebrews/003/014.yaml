source:
  edition: SBLGNT
  text: μέτοχοι γὰρ ⸂τοῦ Χριστοῦ γεγόναμεν⸃, ἐάνπερ τὴν ἀρχὴν τῆς ὑποστάσεως μέχρι τέλους βεβαίαν κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: ru
  text: Ведь мы стали сопричастниками Мессии[a], если только до конца твёрдо сохраним ту уверенность, которая была у нас вначале[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соучастниками Мессии»; возможно также: «имеющими долю в Мессии».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «начало уверенности». Слово, переведённое как «уверенность», может также означать «основание», а в иных контекстах — «сущность» или «реальность».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέτοχοι
  choice: сопричастниками
  rationale: Передаёт участие и общность с кем-либо; управление родительным падежом естественно соответствует μέτοχοι τοῦ Χριστοῦ и сохраняет богословскую насыщенность без архаизма «причастники».
- source_word: γὰρ
  choice: ведь
  rationale: Связывает стих с предшествующим увещанием как его обоснование; в современном русском «ведь» естественнее начального «ибо».
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь имеет титульное значение; «Мессия» ясно передаёт исходный смысл титула.
- source_word: γεγόναμεν
  choice: стали
  rationale: Перфект обозначает наступившее в прошлом состояние, сохраняющееся в настоящем; русский совершенный вид передаёт результативность.
- source_word: ἐάνπερ
  choice: если только
  rationale: Сохраняет усиленный характер условия, выраженный частицей -περ, не превращая его в безусловное утверждение.
- source_word: τὴν ἀρχὴν τῆς ὑποστάσεως
  choice: ту уверенность, которая была у нас вначале
  rationale: Греческое сочетание буквально необычно для русского («начало уверенности»). Развёрнутая формулировка естественно передаёт уверенность, имевшуюся с самого начала, не меняя отношения между ἀρχή и ὑπόστασις.
- source_word: ὑποστάσεως
  choice: уверенность
  rationale: В данном контексте слово вероятнее обозначает уверенный внутренний настрой или основание доверия, а не метафизическую «сущность»; примечание сохраняет смысловую широту.
- source_word: μέχρι τέλους
  choice: до конца
  rationale: Точно и идиоматично передаёт временной предел требуемой стойкости.
- source_word: βεβαίαν κατάσχωμεν
  choice: твёрдо сохраним
  rationale: Передаёт удержание и неизменную прочность; наречная конструкция звучит по-русски естественнее буквального «сохраним твёрдой».
theological_decisions:
- issue: Условие и стойкость до конца
  choice: 'Сохранено реальное усиленное условие: «если только... сохраним».'
  alternative: Истолковать стойкость исключительно как доказательство уже состоявшейся причастности либо как средство её сохранения.
  rationale: Греческий текст формулирует условие, но сам по себе не разрешает позднейший богословский спор о том, является ли стойкость свидетельством участия или условием его продолжения.
- issue: Характер причастности Мессии
  choice: «Сопричастниками Мессии» без уточнения механизма этой причастности.
  alternative: «Соучастниками Мессии», «имеющими долю во Христе» или формулировка, явно определяющая союз с ним.
  rationale: Генитив после μέτοχοι допускает оттенки участия, общей доли и сопричастности; перевод не конкретизирует их сверх текста.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью. «Ведь» предпочтено архаизирующему «ибо»; «Мессия» сохраняет титульное значение Χριστός. Греческая сжатая конструкция τὴν ἀρχὴν τῆς ὑποστάσεως раскрыта минимально ради естественного русского синтаксиса.
