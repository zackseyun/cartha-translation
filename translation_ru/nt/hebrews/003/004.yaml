base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/004.yaml
  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: ru
  text: Ведь всякий дом строится кем-то, а тот, кто устроил всё, — Бог.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς
  choice: всякий
  rationale: 'При существительном οἶκος в единственном числе слово имеет распределительное значение: «всякий дом».'
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительное обоснование предыдущей мысли естественным современным русским союзом.
- source_word: οἶκος
  choice: дом
  rationale: Сохраняет конкретный образ дома и контекстуальную игру между буквальным и переносным значениями.
- source_word: κατασκευάζεται
  choice: строится
  rationale: Естественно передаёт настоящее страдательного залога и архитектурный образ.
- source_word: ὑπό τινος
  choice: кем-то
  rationale: Предлог с родительным обозначает действующее лицо, а неопределённое местоимение — неизвестного или неуказанного строителя.
- source_word: ὁ δὲ
  choice: а Тот, кто
  rationale: Сохраняет умеренное противопоставление и субстантивированную силу причастной конструкции; прописная буква помогает естественно отнести выражение к Богу без добавления нового содержания.
- source_word: πάντα
  choice: всё
  rationale: Передаёт всеобъемлющий средний род множественного числа без сужения до одной только вселенной.
- source_word: κατασκευάσας
  choice: устроил
  rationale: В отношении «всего» русское «устроил» естественнее буквального «построил» и сохраняет широкий смысл создания и приведения в порядок, хотя лексическая связь с «строится» становится менее явной.
- source_word: θεός
  choice: Бог
  rationale: Прямо сохраняет отождествление устроителя всего с Богом.
theological_decisions:
- issue: Синтаксическое отождествление устроившего всё с Богом
  choice: «а Тот, кто устроил всё, — Бог»
  alternative: «а Бог — Тот, кто устроил всё»
  rationale: Порядок слов следует греческой конструкции и сохраняет кульминационное положение слова θεός, не ослабляя прямого отождествления.
- issue: Объём πάντα
  choice: «всё»
  alternative: «всё существующее»
  rationale: «Всё» сохраняет широту и некоторую лаконичность греческого выражения, не добавляя метафизического уточнения.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. «Ведь» ясно связывает стих с предыдущим доводом; тире естественно оформляет именную часть сказуемого и сохраняет акцент на слове «Бог».
