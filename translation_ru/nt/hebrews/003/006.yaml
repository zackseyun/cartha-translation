  text: Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· ⸀ὃς οἶκός ἐσμεν ἡμεῖς, ⸀ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ⸀ἐλπίδος κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/006.yaml
  text: But the Messiah was faithful as a Son over his house[a], whose house we are[c][b], if we hold fast our boldness and the boast of our hope.
translation:
  language: ru
  text: А Мессия — как Сын над Его домом[a]. Этот дом — мы, если твёрдо держимся дерзновения[b] и похвалы, основанной на надежде[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое Χριστός может употребляться как титул «Мессия» и как ставшее именем обозначение «Христос».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «уверенности». Греческое слово может означать открытость, свободу речи или смелую уверенность.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «уверенности, которую даёт надежда», «повода для похвалы в надежде» или «торжества надежды». Греческое слово может обозначать похвалу, основание для похвалы или торжествующую уверенность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Мессия
  rationale: В сопоставлении с Моисеем слово сохраняет силу титула; вариант «Христос» указан в примечании.
- source_word: δὲ
  choice: А
  rationale: Передаёт противопоставление Моисею из предыдущего стиха естественнее для современного русского синтаксиса.
- source_word: ὡς υἱὸς
  choice: как Сын
  rationale: Сохраняет сравнительно-качественную силу ὡς и христологический референт, не добавляя отсутствующего артикля.
- source_word: ἐπὶ τὸν οἶκον αὐτοῦ
  choice: над Его домом
  rationale: «Над» выражает власть и попечение, а «дом» сохраняет сквозную метафору. Местоимение оставляет открытым, относится ли дом прежде всего к Богу или к Сыну.
- source_word: ὃς οἶκός ἐσμεν ἡμεῖς
  choice: Этот дом — мы
  rationale: Естественно по-русски передаёт относительную конструкцию и сохраняет метафорическое отождествление общины с домом.
- source_word: ἐὰν
  choice: если
  rationale: Передаёт реальное условие, не усиливая и не ослабляя его богословски.
- source_word: παρρησίαν
  choice: дерзновение
  rationale: Сохраняет оттенки открытой, смелой уверенности; хотя слово несколько возвышенное, оно понятно в библейском литературном регистре.
- source_word: καύχημα
  choice: похвала
  rationale: Передаёт предмет или основание для торжества и хваления без негативного оттенка русского «хвастовство».
- source_word: τῆς ἐλπίδος
  choice: надеждой
  rationale: Творительный падеж естественно выражает то, чем хвалятся; греческий родительный допускает также «похвалу надежды», поэтому неоднозначность отмечена в сноске.
- source_word: κατάσχωμεν
  choice: твёрдо держимся
  rationale: Передаёт удержание и стойкость условного высказывания; настоящее время естественно в русском общем условии.
theological_decisions:
- issue: Титульное или ставшее именем употребление Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Контекст сопоставления с Моисеем поддерживает титульную силу, но допустимый традиционный вариант сохранён в примечании.
- issue: Референт αὐτοῦ в выражении «над Его домом»
  choice: Сохранить местоименную неоднозначность
  alternative: Явно указать «над Божьим домом» или «над Своим домом»
  rationale: Ближайший контекст связывает дом с Богом, однако синтаксис допускает соотнесение с Сыном; перевод не разрешает это напряжение за автора.
- issue: Сила условия ἐὰν ... κατάσχωμεν
  choice: если твёрдо держимся
  alternative: при условии, что твёрдо держимся
  rationale: Простое «если» сохраняет условность и тему стойкости, не вводя определённой доктрины о спасении или отпадении.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Сохранена метафора дома и условная конструкция; избегнуто негативно окрашенное «хвастовство». Все маркеры примечаний помещены непосредственно при соответствующих выражениях.
