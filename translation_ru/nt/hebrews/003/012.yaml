base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/012.yaml
  text: Watch out[a], brothers[c][b], lest there be in any of you an evil heart of unbelief in turning away from the living God.
translation:
  language: ru
  text: Берегитесь, братья[a], чтобы ни у кого из вас не оказалось злого, неверующего сердца[b], отступающего от живого Бога[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово «братья» стоит в форме мужского рода, но в таком обращении может обозначать всю общину верующих — мужчин и женщин.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «злого сердца, исполненного неверия»; возможно также: «злого, неверного Богу сердца».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «отворачивающегося от живого Бога»; также возможно: «отпадающего» или «удаляющегося от живого Бога».'
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε
  choice: Смотрите
  rationale: Настоящее повелительное наклонение выражает продолжающееся предостережение. «Смотрите» естественно вводит предупреждение и сохраняет образ внимательности.
- source_word: ἀδελφοί
  choice: братья
  rationale: Форма мужского рода во множественном числе сохранена прямо; в данном обращении она может включать всю общину верующих, что пояснено в сноске.
- source_word: μήποτε ἔσται ἔν τινι ὑμῶν
  choice: чтобы ни у кого из вас не оказалось
  rationale: Оборот естественно передаёт предупреждение о возможном нежелательном состоянии у любого из адресатов.
- source_word: καρδία πονηρὰ ἀπιστίας
  choice: злого сердца, исполненного неверия
  rationale: «Сердце» сохраняет библейское обозначение внутреннего центра мысли, воли и желаний; описательный оборот естественно передаёт генитив ἀπιστίας, не исключая оттенка неверности.
- source_word: ἐν τῷ ἀποστῆναι
  choice: которое отступает
  rationale: Причастно-определительная передача по-русски ясно связывает отступление с состоянием злого и неверующего сердца, однако смысловая связь греческого оборота допускает и иные формулировки, отмеченные в сноске.
- source_word: ἀπὸ θεοῦ ζῶντος
  choice: от живого Бога
  rationale: Сохраняется устойчивое библейское выражение, подчёркивающее реальность и действенность Бога.
theological_decisions:
- issue: Передача ἀπιστίας как неверия или неверности
  choice: неверия
  alternative: неверности; неверующего
  rationale: Контекст Евр 3 подчёркивает отказ поверить Божьему слову, поэтому «неверие» наиболее уместно, хотя слово может включать нравственный оттенок неверности.
- issue: Степень терминологической силы ἀποστῆναι
  choice: отступает
  alternative: отворачивается; отпадает; удаляется
  rationale: «Отступает» серьёзно и ясно передаёт удаление от Бога, не превращая глагол в более поздний технический термин и не разрешая спор о характере такого отступления.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясным предостерегающим тоном. Синтаксис слегка разглажен ради естественности, при этом сохранены ключевые образы «сердца», «неверия» и «живого Бога»; богословская неоднозначность ἀπιστίας и ἀποστῆναι вынесена в сноски.
