id: HEB.3.18
reference: Hebrews 3:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τίσιν δὲ ὤμοσεν μὴ εἰσελεύσεσθαι εἰς τὴν κατάπαυσιν αὐτοῦ εἰ μὴ τοῖς ἀπειθήσασιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/018.yaml
  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: ru
  text: И кому он поклялся, что они не войдут в его покой, как не тем, кто не повиновался?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто отказался повиноваться». В данном контексте неповиновение тесно связано с неверием (ср. Евр. 3:19).'
    reason: Лексическая альтернатива поясняет оттенок сознательного отказа в ἀπειθήσασιν, не смешивая его напрямую с обозначением неверия.
lexical_decisions:
- source_word: τίσιν
  choice: кому
  rationale: Дательный падеж множественного числа вопросительного местоимения относится к людям; «кому» естественно передаёт риторический вопрос.
- source_word: δὲ
  choice: и
  rationale: Частица продолжает последовательность риторических вопросов и здесь не требует усиленного противопоставления.
- source_word: ὤμοσεν
  choice: поклялся
  rationale: Аорист ὀμνύω обозначает принесение клятвы; совершенный вид передаёт конкретное действие в прошлом и его торжественный характер.
- source_word: μὴ εἰσελεύσεσθαι
  choice: что они не войдут
  rationale: Инфинитивный оборот после глагола клятвы выражает содержание клятвы; придаточное предложение естественно по-русски.
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: в его покой
  rationale: «Покой» сохраняет ключевой для Послания к евреям тематический смысл κατάπαυσις, а предлог «в» передаёт направленность εἰς.
- source_word: εἰ μὴ
  choice: как не
  rationale: В риторическом вопросе оборот вводит единственно ожидаемый ответ; русское «как не» сохраняет вопросительную форму и звучит естественно.
- source_word: τοῖς ἀπειθήσασιν
  choice: тем, кто не повиновался
  rationale: Аористное причастие от ἀπειθέω указывает на проявленное неповиновение. Формулировка сохраняет отличие от прямого обозначения неверия в следующем стихе.
theological_decisions:
- issue: Значение ἀπειθήσασιν в контексте предостережения
  choice: кто не повиновался
  alternative: кто не поверил
  rationale: В стихе употреблён глагол ἀπειθέω, а не ἀπιστέω. Контекст тесно связывает неповиновение с неверием, однако перевод не должен устранять лексическое различие между стихами 18 и 19.
- issue: Значение κατάπαυσις
  choice: его покой
  alternative: место его покоя
  rationale: '«Покой» сохраняет богословски значимую многозначность образа: речь не сводится явно ни к месту, ни только к состоянию.'
translation_notes:
  register: Современный литературный русский язык с краткой и торжественной риторической формой. Местоимения, относящиеся к Богу, оставлены со строчной буквы в соответствии с обычной современной издательской практикой и греческим текстом; это не отрицает их референта.
