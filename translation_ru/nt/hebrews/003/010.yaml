  text: τεσσεράκοντα ἔτη· διὸ προσώχθισα τῇ γενεᾷ ⸀ταύτῃ καὶ εἶπον· Ἀεὶ πλανῶνται τῇ καρδίᾳ· αὐτοὶ δὲ οὐκ ἔγνωσαν τὰς ὁδούς μου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/010.yaml
  text: For forty years[a], therefore, I was provoked with this generation, and said, ‘They always go astray in their hearts[b], but they have not known my ways.’
translation:
  language: ru
  text: 'Поэтому Я сорок лет негодовал[a] на это поколение и сказал: «Они всегда заблуждаются сердцем[b], но не познали Моих путей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был возмущён этим поколением»; греческий глагол выражает сильное недовольство и может включать оттенок отвращения.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое выражение буквально: «в сердце» — в единственном числе; возможно, поколение представлено как единое целое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσεράκοντα ἔτη
  choice: сорок лет
  rationale: Винительный продолжительности передан естественным русским оборотом без предлога; выражение указывает на длительность Божьего негодования.
- source_word: διὸ
  choice: поэтому
  rationale: Сохраняет выводное, следственное значение союза и связь с предшествующим описанием непослушания.
- source_word: προσώχθισα
  choice: Я негодовал
  rationale: «Негодовал» выражает сильное неодобрение и возмущение, не сводя значение лишь к гневу и не усиливая его до однозначного «возненавидел» или «испытывал отвращение».
- source_word: τῇ γενεᾷ ταύτῃ
  choice: на это поколение
  rationale: Управление «негодовать на кого-либо» естественно для современного русского языка и точно обозначает объект Божьего недовольства.
- source_word: καὶ εἶπον
  choice: и сказал
  rationale: Лицо говорящего ясно из формы предыдущего глагола и из прямой речи; русское предложение не требует повторять местоимение.
- source_word: Ἀεὶ πλανῶνται
  choice: они всегда заблуждаются
  rationale: Передаёт постоянный характер их уклонения; «заблуждаются» сохраняет нравственно-духовный смысл, не уточняя сверх текста, были ли они введены в заблуждение или уклонялись сами.
- source_word: τῇ καρδίᾳ
  choice: сердцем
  rationale: Творительный сферы звучит по-русски сжато и достойно, сохраняя единственное число греческого существительного и образ внутреннего центра воли и мысли.
- source_word: αὐτοὶ δὲ οὐκ ἔγνωσαν
  choice: и не познали
  rationale: В данном параллельном высказывании δέ допускает продолжение мысли через «и»; «не познали» сохраняет завершённый аорист и более широкое, в том числе опытно-отношенческое, значение γινώσκω.
- source_word: τὰς ὁδούς μου
  choice: Моих путей
  rationale: Устоявшаяся и точная библейская метафора Божьих действий и предписанного Им образа жизни.
theological_decisions:
- issue: Сила выражения Божьего недовольства в προσώχθισα
  choice: Я негодовал
  alternative: Я гневался; Я испытывал отвращение
  rationale: Перевод сохраняет реальность и силу Божьего ответа на упорное неверие, но не сводит многозначный глагол к одной более узкой эмоциональной формулировке.
- issue: Единственное число в τῇ καρδίᾳ
  choice: заблуждаются сердцем
  alternative: заблуждаются в своих сердцах
  rationale: Единственное число может представлять всё поколение как одно целое. Русская формулировка позволяет сохранить это число без неестественного согласования.
- issue: Отношение δέ между двумя частями прямой речи
  choice: и не познали
  alternative: но не познали
  rationale: δέ может быть как слабосоединительным, так и противительным. Здесь «и» сохраняет возможное простое продолжение обвинения и не навязывает более резкого противопоставления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксис прямой речи остаётся ясным и доступным, а два примечания сохраняют значимые оттенки греческого текста.
