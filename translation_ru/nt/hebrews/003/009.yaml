lexical_decisions:
- source_word: οὗ
  choice: где
  rationale: Относительное наречие указывает на место в пустыне, упомянутое в предшествующем контексте. Временное «когда» возможно по смыслу, но пространственное «где» точнее сохраняет греческую форму.
- source_word: ἐπείρασαν
  choice: испытывали
  rationale: Глагол обозначает испытание Бога с оттенком вызова или проверки; «испытывали» передаёт это без избыточного истолкования.
- source_word: οἱ πατέρες ὑμῶν
  choice: ваши отцы
  rationale: Прямой перевод сохраняет историко-заветный строй цитаты; «ваши предки» было бы более пояснительным вариантом.
- source_word: ἐν δοκιμασίᾳ
  choice: подвергая испытанию
  rationale: Оборот синтаксически труден и может выражать образ действия или средство. Деепричастная конструкция по-русски естественно сохраняет дополнительное понятие испытания, не сливая его полностью с ἐπείρασαν.
- source_word: καὶ εἶδον
  choice: и видели
  rationale: Передано простое сочинение с καί. Уступительный смысл «хотя видели» возможен из контекста, но не выражен союзом прямо.
- source_word: τὰ ἔργα μου
  choice: мои дела
  rationale: «Дела» естественно и точно обозначает Божьи деяния в пустыне и сохраняет библейское звучание.
theological_decisions:
- issue: Подразумеваемое дополнение при ἐπείρασαν
  choice: испытывали меня
  alternative: испытывали
  rationale: Хотя отдельное местоименное дополнение в данной греческой форме стиха отсутствует, говорящий Бог является ясным объектом по контексту псаломной цитаты. В русском языке дополнение делает фразу ясной и естественной, не добавляя нового богословского содержания.
- issue: Связь между испытанием и видением Божьих дел
  choice: и видели
  alternative: хотя видели / и всё же видели
  rationale: Сохранено простое καί, чтобы не превращать подразумеваемое контекстом противопоставление в явно выраженную уступительную связь.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Строчная буква в местоимениях, относящихся к Богу, не вносит в текст отсутствующего в греческом оригинале типографского истолкования. Намеренная близость слов «испытывали» и «испытанию» отражает лексическую напряжённость источника; сноска отмечает другие возможные способы понимания.
