source:
  edition: SBLGNT
  text: Ὅθεν, ἀδελφοὶ ἅγιοι, κλήσεως ἐπουρανίου μέτοχοι, κατανοήσατε τὸν ἀπόστολον καὶ ἀρχιερέα τῆς ὁμολογίας ἡμῶν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/001.yaml
  text: Therefore[a], holy brothers, sharers in a heavenly calling, consider Jesus, the apostle and high priest of our confession[c][b],
translation:
  language: ru
  text: Итак, святые братья[a], участники небесного призвания[b], внимательно рассмотрите Иисуса — Апостола и Первосвященника нашего исповедания[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «братья» здесь обращено ко всей общине верующих, включая женщин.
    reason: cultural_note
  - marker: b
    text: 'Или: «причастники небесного призвания».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «внимательно рассмотрите Иисуса, Которого мы исповедуем Апостолом и Первосвященником».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения, особенно из 2:17–18, и естественно звучит по-русски.
- source_word: ἀδελφοὶ ἅγιοι
  choice: святые братья
  rationale: Сохраняет грамматически мужскую форму обращения и смысл посвящённости Богу; охват всей общины пояснён в сноске.
- source_word: κλήσεως ἐπουρανίου μέτοχοι
  choice: участники небесного призвания
  rationale: «Участники» естественно передаёт реальную причастность, а «небесное призвание» сохраняет возможный смысл происхождения и характера призвания.
- source_word: κατανοήσατε
  choice: устремите внимание
  rationale: Передаёт повеление сосредоточенно и вдумчиво обратить внимание, не сводя глагол к простому зрительному действию.
- source_word: ἀπόστολον
  choice: Посланника
  rationale: В данном уникальном применении к Иисусу передаёт основной смысл «посланный, уполномоченный» и избегает возможного ошибочного восприятия Иисуса как одного из Двенадцати.
- source_word: ἀρχιερέα
  choice: Первосвященника
  rationale: Устоявшееся и точное обозначение иудейского первосвященнического служения, ключевого для Послания к евреям.
- source_word: τῆς ὁμολογίας ἡμῶν
  choice: нашего исповедания
  rationale: Сохраняет генитивную конструкцию и её возможную связь с обоими титулами, не сужая ὁμολογία до субъективной веры.
- source_word: Ἰησοῦν
  choice: Иисуса
  rationale: Устоявшаяся русская форма имени; винительный падеж обусловлен глаголом κατανοήσατε.
theological_decisions:
- issue: Охват обращения ἀδελφοὶ
  choice: «братья» в основном тексте с пояснением об обращении ко всей общине
  alternative: «братья и сёстры»
  rationale: Греческая форма мужского рода сохранена, а её представительный, общинный характер не скрыт и пояснён в сноске.
- issue: Значение ἀπόστολον применительно к Иисусу
  choice: «Посланник»
  alternative: «Апостол»
  rationale: Оба варианта лексически возможны; «Посланник» яснее выражает здесь посланничество Иисуса от Бога и не навязывает более позднее техническое понимание церковной должности.
- issue: Связь τῆς ὁμολογίας ἡμῶν
  choice: Сохранить формулу «Посланника и Первосвященника нашего исповедания»
  alternative: «Иисуса, которого мы исповедуем Посланником и Первосвященником»
  rationale: Греческая конструкция допускает различное понимание связи генитива. Основной текст формально сохраняет её, а более эксплицитное прочтение дано в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Заглавные буквы в функциональных наименованиях «Посланник» и «Первосвященник» подчёркивают их применение к Иисусу, не добавляя отдельного догматического утверждения.
