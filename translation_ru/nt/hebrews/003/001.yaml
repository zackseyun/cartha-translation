  source_fidelity: 'Основной смысл передан верно: сохранены выводная связь, обращение, участие в небесном призвании, повеление сосредоточиться на Иисусе и оба его обозначения. Однако ἀπόστολον в данном контексте следует передать как «Апостола», а не заменять его толковательным «Посланника»: греческий текст использует именно титул ἀπόστολος, уникально применённый к Иисусу.'
  naturalness: «Устремите внимание на» менее естественно для современного литературного русского, чем «внимательно рассмотрите». «Святые братья» и «участники небесного призвания» допустимы в достойном библейском регистре.
  terminology: «Первосвященник» и «исповедание» точны и сохраняют важную лексику Послания. «Апостол» необходим для сохранения терминологической и межтекстовой связи оригинала; его не следует избегать из-за возможных позднейших ассоциаций.
