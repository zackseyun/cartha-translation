  text: καὶ Μωϋσῆς μὲν πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ὡς θεράπων εἰς μαρτύριον τῶν λαληθησομένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/005.yaml
  text: And Moses indeed was faithful in all his house as a servant[a], for a testimony of the things that would be spoken later[b],
translation:
  language: ru
  text: И Моисей был верен во всём его доме[a] как служитель — во свидетельство о том, что должно было быть сказано впоследствии[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во всём его домашнем круге». Греческий текст сохраняет образ «дома», который развивается в следующих стихах.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «о том, чему предстояло быть сказанным». Греческая форма указывает на то, о чём будет сказано впоследствии, не называя здесь прямо говорящего.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ … μὲν
  choice: И Моисей был
  rationale: Союз καὶ сохраняет связь с предыдущим стихом. Частица μὲν подготавливает противопоставление с δέ в следующем стихе; по-русски это противопоставление естественно раскрывается контекстом, без тяжеловесного «с одной стороны».
- source_word: πιστός
  choice: верен
  rationale: Передаёт надёжность и преданность Моисея в порученном ему служении и сохраняет связь с тем же словом в предыдущем контексте.
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: во всём его доме
  rationale: Сохраняет образ «дома», восходящий к Числам 12:7 и продолжающийся в следующих стихах. Строчная буква в местоимении не устраняет формальную неоднозначность его отнесения.
- source_word: ὡς θεράπων
  choice: как служитель
  rationale: θεράπων обозначает почётное служение и не тождественно δοῦλος («раб»). «Служитель» естественно передаёт достоинство положения Моисея и поддерживает контраст с Сыном в следующем стихе.
- source_word: εἰς μαρτύριον
  choice: во свидетельство
  rationale: Передаёт целевое или результативное значение оборота, не уточняя сверх текста, кому именно предназначено свидетельство.
- source_word: τῶν λαληθησομένων
  choice: о том, что должно было быть сказано впоследствии
  rationale: Будущее страдательное причастие указывает на последующее возвещение, при этом перевод не добавляет прямо не названного в стихе говорящего и не сводит содержание к одной конкретной теме.
theological_decisions:
- issue: К кому относится местоимение αὐτοῦ («его»)
  choice: Сохранено «его» со строчной буквы без прямого уточнения владельца дома.
  alternative: «Его» с прописной буквы как явное указание на Бога; либо «Божьем доме».
  rationale: В контексте речь идёт о Божьем доме, однако сама форма местоимения не называет Бога прямо. Сохранение местоимения позволяет не устранять грамматическую неоднозначность, тогда как образ раскрывается ближайшим контекстом.
- issue: Образ οἶκος
  choice: Сохранено буквальное «дом».
  alternative: «Домочадцы», «семья» или «народ Божий».
  rationale: Автор развивает образ дома в стихах 3–6 и опирается на Числа 12:7. Более пояснительный перевод преждевременно сузил бы многослойную метафору.
- issue: Статус Моисея в слове θεράπων
  choice: «служитель»
  alternative: «слуга» или «раб».
  rationale: Слово имеет почётный оттенок служения и участвует в противопоставлении Моисея как служителя Христу как Сыну; «раб» мог бы внести более сильный оттенок зависимости, выражаемый иным греческим словом.
- issue: Содержание будущего возвещения
  choice: Оставлено обобщённое «то, что должно было быть сказано впоследствии».
  alternative: 'Прямо уточнить: последующее Божье откровение или свидетельство о Христе.'
  rationale: Контекст допускает связь с последующим откровением, сосредоточенным на Сыне, но стих не формулирует это уточнение прямо. Перевод сохраняет широту выражения.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис сохраняет образность и незавершённость фразы перед противопоставлением в следующем стихе; тире помогает ясно связать служение Моисея со свидетельством.
