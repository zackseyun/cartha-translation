  text: μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ, κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/008.yaml
  text: do not harden your hearts as in the rebellion[a], as on the day of testing in the wilderness,
translation:
  language: ru
  text: не ожесточайте своих сердец, как во время мятежа[a], как в день испытания в пустыне,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, если следовать еврейским географическим названиям, лежащим в основе Псалма 94:8: «как в Мериве, как в день Массы в пустыне».'
    reason: Альтернативная передача, отражающая еврейский текст псалма и игру между топонимами и значениями «мятеж»/«испытание».
lexical_decisions:
- source_word: μὴ σκληρύνητε
  choice: не ожесточайте
  rationale: Аорист активного сослагательного наклонения с μή выражает прямой запрет. Активная форма сохраняет ответственность адресатов за их отклик.
- source_word: τὰς καρδίας ὑμῶν
  choice: своих сердец
  rationale: «Сердца» обозначают внутреннего человека — волю, мысли и расположение, а не только чувства. Возвратное «своих» естественно передаёт принадлежность при обращении ко множеству адресатов.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: как во время мятежа
  rationale: παραπικρασμός означает вызывающее противление, непокорность или мятеж. «Во время мятежа» ясно передаёт историческое событие и его нравственный смысл, не подменяя греческое нарицательное слово еврейским топонимом.
- source_word: κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ
  choice: как в день испытания
  rationale: κατά с винительным здесь соотносит нынешнее предостережение с прежним событием; повтор «как» сохраняет параллелизм. πειρασμός в данном контексте означает испытание, а не внутреннее искушение ко греху.
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: Устоявшееся и естественное обозначение пустыни, по которой странствовал Израиль; сохраняет библейский исторический фон.
theological_decisions:
- issue: Передача исторической отсылки к Псалму 94(95):8
  choice: 'В основном тексте перевести греческие нарицательные слова описательно: «во время мятежа» и «в день испытания».'
  alternative: «как в Мериве, как в день Массы в пустыне»
  rationale: Послание к Евреям цитирует греческую форму псалма, где еврейские топонимы переданы смысловыми существительными. Приоритет исходного греческого текста требует сохранить их описательный смысл в основном тексте, а важный древнееврейский фон указать в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Прямой запрет и параллельное повторение «как» сохранены; формулировка понятна без специальной богословской подготовки.
