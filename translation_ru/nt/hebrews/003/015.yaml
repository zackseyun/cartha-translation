lexical_decisions:
- source_word: ἐν τῷ λέγεσθαι
  choice: пока говорится
  rationale: Конструкция ἐν с субстантивированным инфинитивом имеет временно-обстоятельственное значение, а настоящее время и пассивный залог передают продолжающееся звучание цитаты.
- source_word: Σήμερον
  choice: Сегодня
  rationale: Естественно передаёт временное наречие и сохраняет настоятельность призыва.
- source_word: ἐὰν ... ἀκούσητε
  choice: если услышите
  rationale: Условная конструкция с аористом сослагательного наклонения естественно передаётся по-русски будущим совершенного вида после «если»; смысл допускает как услышать, так и внять голосу.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: Его голос
  rationale: Прямо и естественно передаёт родительную конструкцию; прописная буква указывает на Бога по норме русского библейского регистра.
- source_word: Μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: не ожесточайте сердец ваших
  rationale: Сохраняет образ сердца как внутреннего человека и форму запрета; родительный падеж при отрицании естественен для возвышенного современного русского регистра.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: как во время мятежа
  rationale: παραπικρασμός обозначает вызывающее противление Израиля Богу в пустыне. «Мятеж» ясно выражает сознательное неповиновение, а временная формулировка передаёт отсылку к событию.
theological_decisions:
- issue: Значение παραπικρασμός в цитате из Псалма 94(95)
  choice: мятеж
  alternative: возмущение; непокорность; провокация
  rationale: «Мятеж» передаёт нравственную и заветную тяжесть противления Богу, не сводя слово к эмоциональному раздражению. Традиционные и более буквальные варианты указаны в примечании.
- issue: Связь начального ἐν τῷ λέγεσθαι с контекстом
  choice: пока говорится
  alternative: когда сказано; как сказано
  rationale: Формулировка сохраняет грамматическую незавершённость и временно-обстоятельственную связь стиха с предшествующим рассуждением, не добавляя отсутствующего в греческом главного предложения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксическая зависимость начальной фразы от контекста сохранена; цитата передана ясно, без конфессиональных уточнений.
