base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/016.yaml
  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: ru
  text: Ведь кто, услышав, восстал?[a] Не все ли те, кто вышел из Египта под предводительством Моисея?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «огорчил» или «вызвал раздражение». Греческий глагол допускает более буквальную передачу, но здесь речь идёт о непокорности Израиля Богу в пустыне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  choice: кто
  rationale: Вопросительное местоимение вводит риторический вопрос об участниках непокорности; русское «кто» естественно передаёт и вопрос, и подразумеваемую множественность.
- source_word: γὰρ
  choice: ведь
  rationale: Частица поясняет и подкрепляет предшествующее рассуждение; «ведь» естественно выражает эту связь по-русски.
- source_word: ἀκούσαντες
  choice: услышав
  rationale: Деепричастие сохраняет предшествование действия главному глаголу и краткость греческого аористного причастия.
- source_word: παρεπίκραναν
  choice: проявил непокорность
  rationale: В контексте странствия Израиля глагол обозначает мятежное непослушание, которым народ вызвал Божий гнев. Этот вариант понятен современному читателю и не требует добавлять отсутствующий в греческом тексте объект.
- source_word: ἀλλ’ οὐ πάντες
  choice: Не все ли
  rationale: Передаёт ожидающий утвердительного ответа риторический вопрос; отдельное «но» в русском здесь было бы тяжеловесным.
- source_word: οἱ ἐξελθόντες
  choice: вышедшие
  rationale: Субстантивированное причастие естественно и близко передаётся русским причастием.
- source_word: ἐξ Αἰγύπτου
  choice: из Египта
  rationale: Точно передаёт исходную точку движения и устойчиво связано с библейским рассказом об исходе.
- source_word: διὰ Μωϋσέως
  choice: под предводительством Моисея
  rationale: διά с родительным обозначает посредничество или участие Моисея как вождя исхода; этот вариант естественнее буквального, но двусмысленного по-русски «через Моисея».
theological_decisions:
- issue: Значение παραπικραίνω применительно к поколению пустыни
  choice: проявил непокорность
  alternative: вызвал негодование; огорчил; восстал
  rationale: Контекст говорит о непослушании Израиля Богу. Основной текст передаёт смысл поступка, а более буквальные значения, сохраняющие идею вызванного раздражения или огорчения, отмечены в сноске без навязывания дополнительного толкования.
- issue: Обобщающее «все» в риторическом вопросе
  choice: сохранить «Не все ли» без поясняющего исключения
  alternative: добавить исключение для Иисуса Навина и Халева
  rationale: Греческий текст формулирует риторическое обобщение и сам не называет исключений; перевод не должен молча уточнять его на основании дальнейшего контекста.
translation_notes:
  register: Современный литературный русский язык; риторическая структура и пояснительная связь сохранены. Формулировка остаётся понятной обычному читателю, избегая как архаизма, так и разговорной резкости.
