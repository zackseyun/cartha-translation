  text: ἀλλὰ παρακαλεῖτε ἑαυτοὺς καθ’ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ ⸂τις ἐξ ὑμῶν⸃ ἀπάτῃ τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/013.yaml
  text: But encourage one another every day[b][a], as long as it is called “Today,” so that none of you may be hardened by the deceitfulness of sin.
translation:
  language: ru
  text: Но каждый день ободряйте друг друга[b], пока ещё звучит «сегодня»[a], чтобы никто из вас не ожесточился обманом греха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сегодня» перекликается с Псалмом 94(95) и означает нынешнее время, когда необходимо ответить на Божий призыв.
    reason: cross_reference
  - marker: b
    text: 'Или: «увещевайте друг друга». Греческий глагол в зависимости от контекста может означать «ободрять», «увещевать», «призывать» или «утешать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт сильное противопоставление предшествующему предостережению и естественно звучит по-русски.
- source_word: παρακαλεῖτε
  choice: ободряйте
  rationale: Глагол охватывает ободрение, увещание и призыв. В контексте взаимной поддержки в верности «ободряйте» ясно передаёт укрепляющую функцию, а альтернативный оттенок отмечен в сноске.
- source_word: ἑαυτοὺς
  choice: друг друга
  rationale: При повелительном глаголе во множественном числе возвратное местоимение имеет взаимное значение; русский эквивалент естественно выражает общинную взаимность.
- source_word: καθ’ ἑκάστην ἡμέραν
  choice: каждый день
  rationale: Точно и естественно передаёт ежедневную повторяемость действия.
- source_word: ἄχρις οὗ
  choice: пока ещё
  rationale: Передаёт продолжающийся период возможности откликнуться; частица «ещё» подчёркивает ограниченность этого времени, не превращая выражение в указание на конкретную конечную дату.
- source_word: τὸ Σήμερον καλεῖται
  choice: звучит «сегодня»
  rationale: Идиоматически передаёт мысль о том, что библейский призыв продолжает называться и провозглашаться «сегодня», сохраняя аллюзию на Псалом 94(95).
- source_word: ἵνα μὴ σκληρυνθῇ τις ἐξ ὑμῶν
  choice: чтобы никто из вас не ожесточился
  rationale: Естественно передаёт отрицательную цель и охватывает каждого члена общины; «ожесточился» сохраняет образ отвердения сердца из ближайшего контекста.
- source_word: ἀπάτῃ τῆς ἁμαρτίας
  choice: обманутый грехом
  rationale: Передаёт инструментальный смысл дательного падежа и персонифицированную обманчивую силу греха в естественной русской конструкции.
theological_decisions:
- issue: Взаимность призыва
  choice: «ободряйте друг друга»
  alternative: «ободряйте самих себя»
  rationale: 'Множественное ἑαυτούς в данном контексте имеет взаимное значение: речь идёт не об изолированном самоободрении, а о взаимной ответственности общины.'
- issue: Значение τὸ Σήμερον
  choice: «сегодня» как продолжающее звучать время Божьего призыва
  alternative: обычное календарное «сегодня»
  rationale: Кавычки и сноска сохраняют связь с Псалмом 94(95) и богословскую срочность настоящего отклика, не перегружая основной текст толкованием.
- issue: Действие греха при ожесточении
  choice: «ожесточился, обманутый грехом»
  alternative: «был ожесточён обманчивостью греха»
  rationale: Русская конструкция сохраняет грех как средство обмана и не определяет однозначно конечного деятеля ожесточения; тем самым не устраняется напряжение греческого пассива.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис рассчитан на обычного читателя; кавычки отмечают библейски значимое «сегодня». Маркеры сносок стоят непосредственно после соответствующих выражений.
