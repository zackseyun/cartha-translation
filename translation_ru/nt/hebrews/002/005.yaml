  text: Οὐ γὰρ ἀγγέλοις ὑπέταξεν τὴν οἰκουμένην τὴν μέλλουσαν, περὶ ἧς λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/005.yaml
  text: For he did not subject the world to come to angels[a], about which we are speaking.
translation:
  language: ru
  text: Ведь не ангелам Бог подчинил будущий мир[a], о котором мы говорим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грядущий обитаемый мир».'
    reason: Лексическая альтернатива для οἰκουμένη, буквально связанного с обитаемым миром.
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Ведь не
  rationale: «Ведь» естественно передаёт пояснительную связь γάρ с предыдущим рассуждением, а «не» сохраняет прямое отрицание.
- source_word: ἀγγέλοις
  choice: ангелам
  rationale: В непосредственном контексте Послания к евреям речь идёт о небесных ангелах, а не о человеческих вестниках.
- source_word: ὑπέταξεν
  choice: Бог подчинил
  rationale: Глагол означает поставить под власть или управление. Подлежащее подразумевается формой глагола; «Бог» ясно из контекста и необходимо для естественной русской фразы.
- source_word: τὴν οἰκουμένην
  choice: мир
  rationale: Здесь слово обозначает обитаемый мир или мировой порядок; «мир» звучит естественно и не сужает значение до одной территории.
- source_word: τὴν μέλλουσαν
  choice: будущий
  rationale: Причастие выражает предстоящее, эсхатологическое состояние мира; «будущий мир» — ясное и естественное русское сочетание.
- source_word: περὶ ἧς λαλοῦμεν
  choice: о котором мы говорим
  rationale: Сохраняет настоящее время и авторскую отсылку к продолжающемуся рассуждению.
theological_decisions:
- issue: Значение выражения «будущий мир»
  choice: Грядущий эсхатологический мир или миропорядок
  alternative: Населённая земля вообще либо исключительно нынешняя евангельская эпоха
  rationale: Сочетание τὴν οἰκουμένην τὴν μέλλουσαν естественно указывает на мир, которому предстоит наступить. Перевод сохраняет широту выражения и не уточняет сверх текста характер этого мира.
- issue: Подлежащее глагола ὑπέταξεν
  choice: Бог
  alternative: Оставить подлежащее невыраженным
  rationale: Греческий текст допускает подразумеваемое подлежащее, но по контексту действие приписано Богу. В русском явное подлежащее делает предложение естественным, не внося конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, dignified и доступная. Порядок слов подчёркивает противопоставление ангелам, как и греческий оригинал.
