  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: ru
  text: Но мы видим Иисуса, ненадолго поставленного ниже ангелов и увенчанного славой и честью за страдание смерти, чтобы без Бога[a] вкусить смерть за каждого[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых древних рукописях: «по благодати Бога».'
    reason: textual_variant
  - marker: b
    text: 'Или: «за всё».'
    reason: translation_alternative
lexical_decisions:
- source_word: βραχύ τι
  choice: ненадолго
  rationale: 'В контексте цитаты из Псалма 8 выражение естественнее понимать во временном смысле: положение ниже ангелов продолжалось ограниченное время. Наречие «ненадолго» передаёт это кратко и естественно.'
- source_word: παρ’ ἀγγέλους ἠλαττωμένον
  choice: поставленного ниже ангелов
  rationale: После сравнительного глагола παρά с винительным падежом означает «ниже, чем». Страдательная форма сохранена без сведения смысла лишь к внутреннему унижению.
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: за то, что Он претерпел смерть
  rationale: διά с винительным падежом здесь наиболее естественно выражает причину увенчания. Такая формулировка передаёт страдание, состоявшее в прохождении через смерть, и звучит естественнее буквального «за страдание смерти».
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: увенчанного славой и честью
  rationale: Сохранён образ венца и две отдельные характеристики возвышения Иисуса.
- source_word: ὅπως
  choice: чтобы
  rationale: Союз сохраняет целевую, а возможно и результативную, связь с предшествующим высказыванием.
- source_word: χωρὶς θεοῦ
  choice: без Бога
  rationale: Основной текст следует непосредственно предоставленному тексту SBLGNT. Значимый вариант χάριτι θεοῦ вынесен в примечание, а не подменяет чтение исходного издания.
- source_word: ὑπὲρ παντός
  choice: за каждого
  rationale: ὑπέρ передаёт заместительное действие «за, ради», а единственное παντός имеет распределительный смысл. Личное понимание наиболее естественно в контексте, но грамматически возможное «за всё» отмечено в примечании.
- source_word: γεύσηται θανάτου
  choice: вкусить смерть
  rationale: Сохранена понятная по-русски метафора греческого выражения, а не заменена более общим «испытать смерть».
theological_decisions:
- issue: Разночтение χωρὶς θεοῦ / χάριτι θεοῦ
  choice: без Бога
  alternative: по благодати Бога
  rationale: Предоставленный исходный текст SBLGNT содержит χωρὶς θεοῦ, поэтому именно это чтение стоит в основном тексте. Древнее и широко засвидетельствованное χάριτι θεοῦ существенно меняет смысл и потому явно сохранено в примечании без попытки устранить богословское напряжение.
- issue: Объём значения ὑπὲρ παντός
  choice: за каждого
  alternative: за всё
  rationale: Контекст смерти Иисуса за людей поддерживает личное распределительное понимание, однако форма среднего рода допускает более широкий охват всего творения; эта неоднозначность отмечена в примечании.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного библейского образа «вкусить смерть». Причастная конструкция удерживает композицию греческого предложения, но причинный оборот передан придаточным для ясности. Местоимение «Он» написано с прописной буквы по устойчивой русской библейской издательской традиции, без добавления толковательного содержания.
