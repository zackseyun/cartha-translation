  terminology: «Слава и честь», «ангелы» и «вкусить смерть» уместны. «Без Бога» намеренно сохраняет резкость и не заменяется богословски более гладким вариантом. Примечание к παντός оставлено, поскольку «за каждого» выбирает личное распределительное понимание, тогда как форма допускает более широкий охват.
