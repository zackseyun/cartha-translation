  edition: SBLGNT
  text: Ἐπεὶ οὖν τὰ παιδία κεκοινώνηκεν ⸂αἵματος καὶ σαρκός⸃, καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν, ἵνα διὰ τοῦ θανάτου καταργήσῃ τὸν τὸ κράτος ἔχοντα τοῦ θανάτου, τοῦτ’ ἔστι τὸν διάβολον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/014.yaml
  text: Therefore[a], since the children share in flesh and blood, he himself likewise partook of the same things, so that through death he might nullify the one who has the power of death—that is, the devil[b],
translation:
  language: ru
  text: Итак, поскольку дети причастны крови и плоти[a], то и Он Сам подобным образом стал причастен тому же, чтобы посредством смерти лишить силы[b] того, кто обладает властью смерти, то есть дьявола,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В привычном русском порядке можно перевести: «плоти и крови». Буквально по-гречески: «крови и плоти».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «упразднить»; греческий глагол может означать «сделать бессильным», «лишить действия» или «устранить», не обязательно подразумевая уничтожение.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: А поскольку … то
  rationale: Передаёт причинное значение ἐπεί и логическую связь οὖν с предшествующим рассуждением; русская парная конструкция «поскольку … то» звучит естественно.
- source_word: τὰ παιδία
  choice: дети
  rationale: Прямое и контекстуально уместное обозначение детей, о которых говорится в ближайшем контексте.
- source_word: κεκοινώνηκεν
  choice: причастны
  rationale: Передаёт устойчивое состояние участия, выраженное перфектом κοινωνέω, без неестественного буквального воспроизведения греческого времени.
- source_word: αἵματος καὶ σαρκός
  choice: крови и плоти
  rationale: Сохраняет порядок греческого текста и буквальный антропологический смысл σάρξ; речь не идёт о метафорической «греховной природе».
- source_word: καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν
  choice: то и Он Сам подобным образом стал причастен тому же
  rationale: Сохраняет усиленное «Он Сам», близкое подобие, выраженное παραπλησίως, и реальное участие в том же; «стал причастен» естественно передаёт аорист μετέσχεν.
- source_word: ἵνα διὰ τοῦ θανάτου
  choice: чтобы посредством смерти
  rationale: Ясно выражает цель и инструментальное значение διά с родительным падежом.
- source_word: καταργήσῃ
  choice: лишить силы
  rationale: Передаёт значение устранения действенной силы или влияния, не подразумевая прекращения существования дьявола.
- source_word: τὸν τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: того, кто обладает властью смерти
  rationale: Кράτος здесь означает силу или власть; данная формулировка точна и естественна по-русски.
- source_word: τοῦτ’ ἔστι τὸν διάβολον
  choice: то есть дьявола
  rationale: Сохраняет прямое пояснительное отождествление, выраженное τοῦτ’ ἔστι.
theological_decisions:
- issue: Участие Христа в человеческой природе
  choice: «Он Сам подобным образом стал причастен тому же»
  alternative: «Он также разделил их человеческую природу»
  rationale: Выбранный вариант утверждает действительное участие Христа в крови и плоти, но сохраняет различие глаголов κοινωνέω и μετέχω и осторожную формулировку παραπλησίως, не добавляя позднейших догматических терминов.
- issue: Значение καταργήσῃ применительно к дьяволу
  choice: «лишить силы»
  alternative: «упразднить» или «уничтожить»
  rationale: Так передаётся лишение действенной власти без однозначного утверждения об уничтожении или прекращении существования; допустимые более традиционные варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет причинно-целевую структуру греческого предложения; прописное «Он» служит ясности референции и соответствует распространённой русской библейской норме. Конечная запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
