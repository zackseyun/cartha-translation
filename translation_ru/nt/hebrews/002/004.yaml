  text: при этом и Бог свидетельствовал знамениями и чудесами, различными проявлениями силы[a] и раздаяниями Святого Духа[b] по своей воле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «различными чудесами» или «различными могущественными деяниями». Греческое слово может обозначать проявления силы, а в данном контексте — чудесные деяния.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «уделениями» или «долями Святого Духа». В греческом тексте слово «дары» прямо не употреблено.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπιμαρτυροῦντος τοῦ θεοῦ
  choice: при этом и Бог свидетельствовал
  rationale: Причастный оборот обозначает сопутствующее действие, связанное с предыдущим стихом. Частица «и» передаёт добавочное значение συν-, не вынуждая понимать его буквально как «совместно».
- source_word: σημείοις
  choice: знамениями
  rationale: Творительный падеж передаёт средство, посредством которого Бог свидетельствовал; «знамения» сохраняет указующую и удостоверяющую функцию этих событий.
- source_word: τέρασιν
  choice: дивными явлениями
  rationale: Передаёт вызывающие изумление сверхъестественные явления и естественно сочетается со «знамениями», не смешиваясь с последующим δυνάμεσιν.
- source_word: ποικίλαις δυνάμεσιν
  choice: различными чудесами
  rationale: В данном контексте δύναμις обозначает проявления силы в чудесных деяниях; «различными» передаёт ποικίλαις. В сноске сохранены более буквальные варианты.
- source_word: πνεύματος ἁγίου
  choice: Святого Духа
  rationale: Стандартное русское соответствие личному божественному наименованию без дополнительного догматического разъяснения.
- source_word: μερισμοῖς
  choice: раздаяниями
  rationale: Слово обозначает распределения или уделения. Не добавлено отсутствующее в греческом тексте слово «дары»; несколько непривычная, но понятная форма сохраняет исходную неоднозначность.
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: по своей воле
  rationale: Передаёт соответствие воле действующего субъекта; возвратное местоимение естественно соотносит оборот с Богом.
theological_decisions:
- issue: К кому относится αὐτοῦ во фразе «по своей воле»
  choice: К Богу, субъекту причастия συνεπιμαρτυροῦντος
  alternative: Более свободное соотнесение со Святым Духом
  rationale: Синтаксически управляющим субъектом перечисленных способов свидетельства является Бог. Перевод сохраняет это наиболее естественное прочтение, не развивая его в отдельное богословское утверждение.
- issue: Смысл μερισμοῖς πνεύματος ἁγίου
  choice: «раздаяниями Святого Духа» без добавления слова «дары»
  alternative: «дарами Святого Духа» или «распределением даров Святого Духа»
  rationale: Греческий текст прямо не называет даров. Более буквальная конструкция сохраняет возможность понимать выражение как раздаяния, уделения или доли, связанные со Святым Духом.
translation_notes:
  register: 'Современный литературный русский язык с торжественным, но понятным библейским звучанием. Оборот начинается со строчной буквы, поскольку стих синтаксически продолжает предыдущую фразу. Различены три элемента ряда: знамения, вызывающие изумление явления и чудесные проявления силы.'
