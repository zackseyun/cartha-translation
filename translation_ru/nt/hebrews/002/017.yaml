language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅθεν ὤφειλεν κατὰ πάντα τοῖς ἀδελφοῖς ὁμοιωθῆναι, ἵνα ἐλεήμων γένηται καὶ πιστὸς ἀρχιερεὺς τὰ πρὸς τὸν θεόν, εἰς τὸ ἱλάσκεσθαι τὰς ἁμαρτίας τοῦ λαοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/017.yaml
  text: Therefore he had to become like his brothers in every respect[a], so that he might become a merciful and faithful high priest in the things pertaining to God[b], to make atonement for the sins of the people.
translation:
  language: ru
  text: Поэтому Он должен был во всём уподобиться Своим братьям[a], чтобы стать милосердным и верным Первосвященником в том, что относится к Богу, и искупить грехи народа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своим братьям и сёстрам». В греческом тексте стоит слово «братья» — родственное обозначение мужского рода во множественном числе, которое в данном контексте может охватывать всю семью верующих.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «совершить очищение от грехов народа»; возможно также: «совершить умилостивление за грехи народа». Греческий глагол допускает связанные оттенки очищения и умилостивления.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: Поэтому
  rationale: Передаёт логический вывод из предшествующего рассуждения и естественно звучит по-русски.
- source_word: ὤφειλεν
  choice: должен был
  rationale: Сохраняет значение необходимости, обусловленной спасительным замыслом, не добавляя идеи внешнего принуждения.
- source_word: κατὰ πάντα
  choice: во всём
  rationale: Кратко и естественно передаёт всеохватность уподобления.
- source_word: τοῖς ἀδελφοῖς
  choice: Своим братьям
  rationale: Сохраняет мужскую форму родственного обозначения в греческом тексте; возможный широкий, включающий смысл пояснён в сноске.
- source_word: ὁμοιωθῆναι
  choice: уподобиться
  rationale: Точно передаёт становление подобным и соответствует возвышенному, но современному библейскому регистру.
- source_word: ἵνα ... γένηται
  choice: чтобы стать
  rationale: Ясно выражает цель и передаёт значение становления.
- source_word: ἐλεήμων
  choice: милосердным
  rationale: Стандартно и точно передаёт качество сострадания в священническом контексте.
- source_word: πιστὸς
  choice: верным
  rationale: Сохраняет возможные оттенки верности и надёжности, не сужая их до одного.
- source_word: ἀρχιερεὺς
  choice: Первосвященником
  rationale: Прямой и общепринятый русский эквивалент культового титула.
- source_word: τὰ πρὸς τὸν θεόν
  choice: в служении Богу
  rationale: Естественно передаёт сферу священнических дел, относящихся к Богу, без тяжеловесной кальки.
- source_word: εἰς τὸ ἱλάσκεσθαι
  choice: и совершить искупление за
  rationale: Доступно передаёт священническое действие по отношению к грехам, не разрешая однозначно спор между оттенками умилостивления и очищения; они отмечены в сноске.
- source_word: τὰς ἁμαρτίας τοῦ λαοῦ
  choice: грехи народа
  rationale: Естественно и точно обозначает объект искупительного действия.
theological_decisions:
- issue: Значение ἱλάσκεσθαι в контексте искупления
  choice: совершить искупление за грехи народа
  alternative: умилостивить Бога за грехи народа; очистить народ от грехов
  rationale: Основной вариант доступен современному читателю и сохраняет широкий священнический смысл; сноска удерживает подлинную лексико-богословскую напряжённость между умилостивлением и очищением.
- issue: Объём значения ἀδελφοῖς
  choice: Своим братьям
  alternative: Своим братьям и сёстрам
  rationale: Основной текст сохраняет грамматически мужское родственное обозначение оригинала, тогда как сноска сообщает, что в контексте оно может охватывать всю семью верующих.
- issue: Отношение выражения τὰ πρὸς τὸν θεόν к служению первосвященника
  choice: в служении Богу
  alternative: в делах, относящихся к Богу
  rationale: Выбран естественный русский оборот, обозначающий область священнического служения перед Богом и не вводящий дополнительной конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Синтаксис сделан плавным и понятным; местоимения, относящиеся ко Христу, написаны с прописной буквы согласно распространённой русской библейской традиции. Формулировка избегает узкоконфессионального толкования искупления.
