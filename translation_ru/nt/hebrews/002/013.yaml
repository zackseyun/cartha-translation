  - marker: b
    text: В греческом тексте этого стиха говорящий прямо не назван; в контексте Послания к Евреям эти цитаты относятся к Сыну.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: И ещё
  rationale: Краткая формула вводит следующую цитату; глагол речи в греческом тексте отсутствует, поэтому он не добавлен.
- source_word: Ἐγὼ
  choice: Я
  rationale: Явное местоимение сохранено как часть подчёркнутой речи от первого лица.
- source_word: ἔσομαι πεποιθὼς
  choice: буду уповать
  rationale: Перифрастическая конструкция выражает устойчивое доверие; «уповать» естественно сочетается с «на» и сохраняет возвышенный, но понятный регистр цитаты.
- source_word: ἐπ’ αὐτῷ
  choice: на Него
  rationale: Русское управление «уповать на» точно и естественно передаёт греческое сочетание.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Сохраняет указательную и риторическую силу ἰδού, оставаясь естественным для современного русского языка.
- source_word: τὰ παιδία
  choice: дети
  rationale: Передаёт родственное обозначение без излишнего уменьшительного оттенка.
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: которых дал Мне Бог
  rationale: Одушевлённое «которых» естественно в русском; аорист ἔδωκεν передан простым прошедшим «дал» без навязывания результативного оттенка.
- source_word: ὁ θεός
  choice: Бог
  rationale: Стандартная передача θεός в данном определённом употреблении.
theological_decisions:
- issue: Голос ветхозаветных цитат и их христологическое применение
  choice: Оставить цитаты речью от первого лица, не называя говорящего в основном тексте.
  alternative: Добавить «Он говорит» или «Мессия говорит».
  rationale: В самом греческом стихе говорящий прямо не назван, хотя в контексте Послания цитаты относятся к Сыну. Перевод сохраняет эту структуру и не вносит толкование в основной текст.
- issue: Написание местоимений, относящихся к Богу и говорящему
  choice: «Него» и «Мне» с прописной буквы.
  alternative: «него» и «мне» со строчной буквы.
  rationale: Прописная буква соответствует принятому благоговейному русскому библейскому регистру; при этом примечание сохраняет формальную неназванность говорящего в греческом тексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным цитатным регистром. «Вот» предпочтено архаичному «се»; «буду уповать» сохраняет достоинство и устойчивый оттенок доверия. Пунктуация ясно отделяет две цитаты.
