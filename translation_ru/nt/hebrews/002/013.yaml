base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/013.yaml
  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: ru
  text: 'И ещё: «Я буду уповать на него».[a] И ещё: «Вот я и дети, которых дал мне Бог».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Я буду полагаться на него» или «Я буду уверен в нём».'
