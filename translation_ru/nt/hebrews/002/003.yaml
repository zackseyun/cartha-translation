reference: Hebrews 2:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: ru
  text: как избежим мы, если пренебрежём столь великим спасением? Оно[a], возвещённое вначале через Господа, было подтверждено нам теми, кто слышал его,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которое, будучи вначале возвещено через Господа, было подтверждено нам теми, кто слышал его».'
    reason: Синтаксический вариант передачи относительного местоимения ἥτις и единого сложного предложения.
lexical_decisions:
- source_word: πῶς ἡμεῖς ἐκφευξόμεθα
  choice: как избежим мы
  rationale: Сохраняет форму риторического вопроса и будущее значение глагола, не превращая подразумеваемую невозможность избежать наказания в прямое утверждение.
- source_word: τηλικαύτης ἀμελήσαντες σωτηρίας
  choice: если пренебрежём столь великим спасением
  rationale: Условная передача аористного причастия естественна для русского предупреждения; «столь великим» сохраняет усиление τηλικαύτης, а «спасением» — религиозно-эсхатологический смысл σωτηρία.
- source_word: ἥτις
  choice: Оно
  rationale: Местоимение ясно отсылает к спасению и естественно вводит пояснение, не перегружая русский текст повтором существительного.
- source_word: ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: возвещённое вначале
  rationale: Передаёт идиоматическое начало провозглашения и пассив λαλεῖσθαι. «Возвещённое» в данном контексте естественнее буквального «сказанное» и сохраняет смысл устного объявления вести.
- source_word: διὰ τοῦ κυρίου
  choice: через Господа
  rationale: «Через» сохраняет значение посредничества или действующего лица у διά с родительным; титул κύριος передан традиционным и христологически уместным словом «Господь».
- source_word: ὑπὸ τῶν ἀκουσάντων
  choice: теми, кто слышал его
  rationale: Сохраняет агентную конструкцию и обозначает непосредственных слушателей Господа; дополнение «его» восстанавливается из ближайшего контекста.
- source_word: εἰς ἡμᾶς ἐβεβαιώθη
  choice: было подтверждено нам
  rationale: Естественно передаёт направленность свидетельства к адресатам и значение удостоверения или подтверждения.
theological_decisions:
- issue: К кому относится титул τοῦ κυρίου
  choice: К Иисусу как Господу, через которого первоначально было возвещено спасение
  alternative: Общее обозначение Бога как Господа
  rationale: Упоминание тех, кто слышал его и затем подтвердил весть адресатам, в ближайшем контексте указывает на земное возвещение Иисуса, но перевод сохраняет титул и не вставляет имя.
- issue: Сила предостерегающего вопроса
  choice: Сохранён риторический вопрос
  alternative: Утвердительное «мы непременно не избежим»
  rationale: Греческий текст задаёт вопрос в будущем времени; вопросительная форма сохраняет напряжение и не делает подразумеваемый вывод более явным, чем в источнике.
- issue: Грамматическое отнесение ἥτις
  choice: Относится к «спасению» и вводит его дальнейшее описание
  alternative: 'Перевод одним относительным предложением: «которое, будучи вначале возвещено…»'
  rationale: Оба построения передают одну синтаксическую связь; местоименное членение выбрано ради ясного и естественного русского чтения.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Риторический порядок «как избежим мы» подчёркивает предупреждение, оставаясь понятным. Строчная буква в начале обусловлена тем, что стих синтаксически продолжает предшествующий контекст; конечная запятая отражает продолжение предложения в следующем стихе.
