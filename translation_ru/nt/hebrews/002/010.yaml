base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory[d][c][b][a], to perfect the pioneer of their salvation through sufferings.
translation:
  language: ru
  text: Ибо Ему — ради Которого существует всё и через Которого существует всё — подобало через страдания довести до совершенства Предводителя их спасения, Который привёл многих сыновей[a] к славе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Многих сыновей» сохраняет греческую формулировку и её смысловой акцент на сыновстве и наследии; здесь выражение охватывает всех Божьих детей, а не только мужчин.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔπρεπεν γὰρ αὐτῷ
  choice: Ибо ему… подобало
  rationale: «Подобало» передаёт нравственную и замыслительную уместность, выраженную безличным ἔπρεπεν, а местоимение сохраняет форму греческого текста; его референтом в контексте является Бог.
- source_word: δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα
  choice: ради которого существует всё и через которого всё существует
  rationale: «Ради которого» передаёт направленность всего к нему как к конечной цели, а «через которого» — посредство или действие. Глагол «существует» добавлен для естественности русского синтаксиса.
- source_word: πολλοὺς υἱοὺς
  choice: многих сыновей
  rationale: Сохраняется буквальное значение υἱούς и связанный с сыновством и наследованием смысл; охват выражения пояснён в сноске.
- source_word: εἰς δόξαν
  choice: к славе
  rationale: Предлог «к» естественно передаёт движение к состоянию или уделу славы.
- source_word: ἀγαγόντα
  choice: приводя
  rationale: Деепричастие сохраняет связь причастного оборота с тем же субъектом — Богом — и не превращает его без достаточных оснований в однозначную конструкцию цели.
- source_word: ἀρχηγὸν
  choice: Начинателя
  rationale: Слово выражает того, кто полагает начало и ведёт за собой. «Начинатель» сохраняет обе смысловые стороны лучше, чем варианты, передающие только авторство или руководство.
- source_word: τῆς σωτηρίας αὐτῶν
  choice: их спасения
  rationale: Естественная передача греческой родительной конструкции.
- source_word: διὰ παθημάτων
  choice: через страдания
  rationale: Сохранено множественное число, указывающее на пережитые страдания, а не только на отвлечённое понятие страдания.
- source_word: τελειῶσαι
  choice: довести до совершенства
  rationale: Передаёт достижение предназначенной цели и полноты, не подразумевая исправления нравственного недостатка.
theological_decisions:
- issue: Значение τελειῶσαι применительно к Начинателю спасения
  choice: довести до совершенства
  alternative: довести до завершения; сделать совершенным
  rationale: В контексте Послания речь идёт о достижении предназначенной полноты и завершённости пути через страдания, а не об устранении нравственного изъяна. Формулировка сохраняет важную для Послания лексику совершенства, а сноска предотвращает неверное прочтение.
- issue: Передача πολλοὺς υἱοὺς
  choice: многих сыновей
  alternative: многих детей
  rationale: Мужская форма оригинала и её ассоциации с сыновством и наследованием сохранены в основном тексте; при этом сноска уточняет, что выражение не ограничивает круг спасаемых мужчинами.
- issue: Связь ἀγαγόντα с τελειῶσαι
  choice: приводя… подобало… довести
  alternative: чтобы привести… подобало… довести
  rationale: Греческое причастие допускает обстоятельственный оттенок, тогда как явное придаточное цели сильнее фиксировало бы спорное логическое отношение. Основной текст сохраняет структуру и напряжение оригинала, а сноска указывает возможный вариант.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Подобало» и «Начинатель» несколько возвышенны, но понятны и уместны; синтаксис с парными относительными оборотами сохраняет риторическую плотность оригинала.
