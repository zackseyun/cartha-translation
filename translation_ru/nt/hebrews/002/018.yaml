  text: ἐν ᾧ γὰρ πέπονθεν αὐτὸς πειρασθείς, δύναται τοῖς πειραζομένοις βοηθῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/018.yaml
  text: For because he himself suffered when he was tempted[a], he is able to help those who are being tempted.
translation:
  language: ru
  text: Ведь Он Сам пострадал, подвергшись искушению[a], и потому может помочь тем, кто подвергается искушению.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «испытанию» в обоих случаях: «Ведь Он Сам пострадал, подвергшись испытанию, и потому может помочь тем, кто подвергается испытанию». Греческий глагол в зависимости от контекста может означать как «искушать», так и «испытывать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: поскольку
  rationale: Оборот имеет здесь причинное значение и вводит основание способности Сына помогать; буквальное пространственное «в чём» затемнило бы ход мысли.
- source_word: γὰρ
  choice: ибо
  rationale: Союз связывает стих с предшествующим утверждением и вводит пояснение; сочетание «Ибо, поскольку» естественно передаёт как пояснительную, так и причинную связь.
- source_word: πέπονθεν
  choice: пострадал
  rationale: Глагол обозначает реально пережитое страдание с сохраняющейся значимостью; русское прошедшее время естественно выражает завершённый опыт в данном контексте.
- source_word: αὐτὸς
  choice: Он Сам
  rationale: Сохраняется эмфатическое указание на то, что Сын лично прошёл через это страдание.
- source_word: πειρασθείς
  choice: подвергшись искушению
  rationale: Причастная конструкция передаёт предшествующее или сопутствующее переживание и сохраняет основной контекстуальный смысл πειράζω — «искушать»; возможное значение «испытывать» отмечено в сноске.
- source_word: δύναται
  choice: может
  rationale: Ясно и естественно передаёт способность оказать помощь без смыслового ослабления.
- source_word: τοῖς πειραζομένοις
  choice: тем, кто подвергается искушению
  rationale: Настоящее причастие указывает на людей, которые сейчас переживают искушение или испытание; формулировка сохраняет продолжающийся характер действия.
- source_word: βοηθῆσαι
  choice: помочь
  rationale: Прямой и понятный русский эквивалент, включающий контекстуальный оттенок оказания помощи нуждающемуся.
theological_decisions:
- issue: Значение πειράζω применительно к Иисусу и верующим
  choice: искушение
  alternative: испытание
  rationale: «Искушение» сохраняет распространённый новозаветный смысл и связь с Евр 4:15, не подразумевая, что Иисус поддался греху. Поскольку греческий глагол может также означать испытание, этот вариант сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Эмфаза αὐτός передана сочетанием «Он Сам»; двусмысленность πειράζω не устранена, а документирована в сноске.
