  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: ru
  text: «Всё Ты подчинил под ноги его»[a]. Ибо, подчинив ему всё, Он не оставил ничего, не подчинённого ему[b]. Но сейчас мы ещё не видим всё подчинённым ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимения «его» и «ему» отсылают к Псалму 8. В исходном контексте псалма они могут относиться к человеку, то есть к человечеству, а в применении Послания к евреям — к Иисусу.
    reason: cross_reference
  - marker: b
    text: 'Или: «Ибо, когда Он подчинил ему всё, Он не оставил ничего, не подчинённого ему». Греческую конструкцию можно понимать более явно во временном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: всё
  rationale: Передаёт всеохватность среднего рода множественного числа естественным русским собирательным местоимением.
- source_word: ὑπέταξας
  choice: Ты подчинил
  rationale: Сохраняет обращение к Богу во втором лице и повтор корня ὑποτάσσω на протяжении стиха.
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: под ноги его
  rationale: Естественная библейская идиома господства; порядок слов поддерживает возвышенный регистр цитаты и не уточняет референта местоимения.
- source_word: ἐν τῷ ... ὑποτάξαι
  choice: подчинив
  rationale: Деепричастный оборот естественно передаёт обстоятельственную конструкцию, сохраняя возможный смысл действия, из которого выводится последующее утверждение.
- source_word: γὰρ
  choice: ведь
  rationale: Ясно вводит пояснение к приведённой цитате и звучит естественно в современном русском.
- source_word: οὐδὲν ἀφῆκεν ... ἀνυπότακτον
  choice: Он не оставил ничего ... не подчинённым
  rationale: Близко воспроизводит греческую формулировку и её абсолютное утверждение, сохраняя повтор лексики подчинения.
- source_word: νῦν δὲ οὔπω ὁρῶμεν
  choice: Но сейчас мы ещё не видим
  rationale: Передаёт контраст δέ и аспект ещё не наступившей видимой полноты посредством «ещё не».
- source_word: ὑποτεταγμένα
  choice: чтобы всё было ему подчинено
  rationale: Конструкция после «видим» естественна по-русски и выражает результирующее состояние перфектного пассивного причастия.
theological_decisions:
- issue: Референт αὐτοῦ / αὐτῷ
  choice: Сохранены местоимения «его/ему» без прямого называния референта.
  alternative: Уточнить как «человеку/людям» либо «Иисусу».
  rationale: Псалом 8 в исходном контексте говорит о человеке и человечестве, тогда как Послание к евреям применяет его к Иисусу. Местоименная передача сохраняет движение аргумента и его богословское напряжение.
- issue: Субъект ἀφῆκεν
  choice: «Он» — Бог, без добавления имени.
  alternative: 'Эксплицировать: «Бог не оставил».'
  rationale: Греческий текст имеет подразумеваемый субъект. Местоимение делает русскую фразу ясной, не добавляя отсутствующего в тексте существительного.
- issue: Соотношение провозглашённого подчинения и нынешнего наблюдения
  choice: Сохранён контраст между всеобщим подчинением и тем, что оно ещё не видно.
  alternative: Объяснить это как будущее исполнение непосредственно в тексте.
  rationale: Автор сам оставляет эсхатологическое напряжение между утверждением Писания и настоящим опытом; перевод не должен заранее истолковывать его.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным регистром в цитате. Повтор форм «подчинил / подчинённым / подчинено» намеренно сохраняет сквозную греческую лексику. Заглавные «Ты/Он» обозначают Бога в соответствии с русской библейской традицией, не меняя содержания исходного текста.
