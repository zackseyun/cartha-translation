  source_fidelity: 'Смысл и синтаксическое движение греческого текста в целом переданы верно: сохранены цитата из Псалма 8, всеохватность πάντα, повтор лексики подчинения и контраст между провозглашённым подчинением и тем, что оно ещё не наблюдается. Однако сочетание «ничего ему не подчинённым» в современном русском синтаксически тяжеловесно и допускает ненужную кратковременную неоднозначность. Более естественная причастная конструкция точнее показывает, что «ничего» является тем, что не оставлено вне подчинения.'
