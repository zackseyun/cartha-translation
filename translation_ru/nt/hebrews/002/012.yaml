  text: λέγων· Ἀπαγγελῶ τὸ ὄνομά σου τοῖς ἀδελφοῖς μου, ἐν μέσῳ ἐκκλησίας ὑμνήσω σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/012.yaml
  text: saying[a], “I will proclaim your name to my brothers[b]; in the midst of the assembly I will sing praise to you.”
translation:
  language: ru
  text: 'говоря: «Возвещу имя твоё братьям моим[a], посреди собрания[b] воспою тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или по смыслу: «братьям и сёстрам»; греческий текст буквально говорит «братьям», но в данном семейном контексте слово может охватывать всех верующих.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «общины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: говоря
  rationale: Причастие настоящего времени вводит цитату; буквальное «говоря» естественно связывает её с предшествующим контекстом.
- source_word: Ἀπαγγελῶ
  choice: возвещу
  rationale: Будущее время глагола со значением открыто объявить или провозгласить; «возвещу» сохраняет публичный и торжественный характер речи.
- source_word: τὸ ὄνομά σου
  choice: имя твоё
  rationale: Сохранено буквальное обозначение; библейское понятие имени может включать явленную личность и характер, но перевод не разворачивает этот смысл в толкование.
- source_word: τοῖς ἀδελφοῖς μου
  choice: братьям моим
  rationale: Мужская форма множественного числа передана прямо; в контексте она может обозначать всю семью верующих, что отмечено в сноске.
- source_word: ἐν μέσῳ
  choice: посреди
  rationale: Кратко и естественно передаёт пространственный образ и сохраняет возвышенный поэтический строй цитаты.
- source_word: ἐκκλησίας
  choice: собрания
  rationale: В ветхозаветной цитате речь идёт о собравшемся народе, а не обязательно о позднейшем институциональном значении слова «церковь».
- source_word: ὑμνήσω
  choice: воспою
  rationale: Глагол обозначает хвалу, выраженную в пении; «воспою» передаёт и музыкальный оттенок, и будущее время.
- source_word: σε
  choice: тебя
  rationale: Прямое дополнение к «воспою» передано естественной русской конструкцией.
theological_decisions:
- issue: Представительное семейное значение ἀδελφοῖς
  choice: братьям
  alternative: братьям и сёстрам; братьям и сестрам по вере
  rationale: Основной текст сохраняет мужскую форму источника, не исключая возможного отнесения ко всем верующим; инклюзивный объём значения поясняется в сноске.
- issue: Значение ἐκκλησία в цитате из Псалма 21:23 (22:22 в иной нумерации)
  choice: собрание
  alternative: община; церковь
  rationale: «Собрание» передаёт образ собравшегося народа Божьего и не привносит в древнюю цитату более поздние институциональные ассоциации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием, соответствующим цитате из псалма. Местоимения, относящиеся к Богу, даны со строчной буквы как нейтральная современная орфографическая практика. Маркеры сносок поставлены при словах, которые они поясняют.
