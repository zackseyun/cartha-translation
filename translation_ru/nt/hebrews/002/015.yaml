  text: καὶ ἀπαλλάξῃ τούτους, ὅσοι φόβῳ θανάτου διὰ παντὸς τοῦ ζῆν ἔνοχοι ἦσαν δουλείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/015.yaml
  text: and free those who[a], through fear of death, were subject to slavery all their lives.
translation:
  language: ru
  text: и освободить тех, кто из страха смерти всю свою жизнь был в рабстве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всю свою жизнь был подчинён рабству»; возможно также: «страх смерти всю жизнь удерживал его в рабстве».'
    reason: Лексико-синтаксическая альтернатива для ἔνοχοι ἦσαν δουλείας и причинно-инструментального оттенка φόβῳ.
lexical_decisions:
- source_word: ἀπαλλάξῃ
  choice: освободить
  rationale: Глагол означает избавить или высвободить из определённого состояния. «Освободить» естественно сочетается с последующим образом рабства и не добавляет специального богословского оттенка.
- source_word: τούτους, ὅσοι
  choice: тех, кто
  rationale: Так естественно по-русски передаётся указательное местоимение с относительной конструкцией, обозначающей весь описываемый круг людей.
- source_word: φόβῳ θανάτου
  choice: из страха перед смертью
  rationale: Дательный падеж может выражать причину или обусловливающую силу. Русское «из страха перед смертью» ясно передаёт причинный оттенок, не исключая мысли о страхе как порабощающей силе.
- source_word: διὰ παντὸς τοῦ ζῆν
  choice: всю жизнь
  rationale: Идиома указывает на всю продолжительность жизни; краткое русское выражение точно и естественно передаёт этот смысл.
- source_word: ἔνοχοι ἦσαν δουλείας
  choice: оставался в рабстве
  rationale: ἔνοχος с родительным падежом обозначает состояние подчинённости или связанности. «Оставался в рабстве» передаёт реальное и продолжительное состояние, а не только юридическую возможность попасть в него.
- source_word: δουλείας
  choice: рабстве
  rationale: «Рабство» сохраняет конкретную силу греческого образа лучше, чем более отвлечённые варианты «зависимость» или «порабощение».
- source_word: καὶ
  choice: и
  rationale: Союз непосредственно связывает эту цель с предшествующим высказыванием стиха 14.
theological_decisions:
- issue: Характер рабства, связанного со страхом смерти
  choice: Сохранить общее указание на реальное рабство, обусловленное страхом смерти, не уточняя его механизм.
  alternative: Прямо назвать это рабством дьяволу, греху либо смертности.
  rationale: Хотя в ближайшем контексте упомянут дьявол, обладающий властью смерти, сам стих 15 не называет здесь господина или точный механизм рабства. Перевод сохраняет эту богословскую открытость.
- issue: Отношение страха смерти к рабству
  choice: 'Передать φόβῳ причинно: «из страха перед смертью».'
  alternative: 'Передать инструментально: «страхом смерти удерживался в рабстве».'
  rationale: Греческий дательный допускает причинно-инструментальный оттенок. Основной текст выбирает естественную русскую причинную формулировку, а сноска сохраняет возможный оттенок удерживания.
translation_notes:
  register: Современный литературный русский язык; фраза проста и достойна по тону. Единственное число «оставался» согласовано с относительным «кто», хотя «тех» обозначает множество. Образ рабства сохранён без конфессионального уточнения.
