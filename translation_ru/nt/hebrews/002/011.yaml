id: HEB.2.11
reference: Hebrews 2:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅ τε γὰρ ἁγιάζων καὶ οἱ ἁγιαζόμενοι ἐξ ἑνὸς πάντες· δι’ ἣν αἰτίαν οὐκ ἐπαισχύνεται ἀδελφοὺς αὐτοὺς καλεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/011.yaml
  text: For both the one who sanctifies and those who are being sanctified are all from one[a]; for this reason he is not ashamed to call them brothers[b],
translation:
  language: ru
  text: Ведь и освящающий, и освящаемые — все от одного[a]; поэтому он не стыдится называть их братьями[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от одного Отца», «из одного источника» или «от одного предка». В греческом тексте не уточняется, кто или что подразумевается под словом «одного».'
    reason: alternative_reading
  - marker: b
    text: В греческом тексте стоит существительное мужского рода во множественном числе; в данном контексте слово «братья» может обозначать всю семью верующих, включая женщин.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἁγιάζων
  choice: освящающий
  rationale: Субстантивированное причастие настоящего времени сохраняет активное действие и повтор корня ἁγιάζω; привычный русский богословский термин остаётся понятным в контексте.
- source_word: οἱ ἁγιαζόμενοι
  choice: освящаемые
  rationale: Причастие настоящего времени в страдательном залоге передаёт совершающееся освящение и сохраняет лексическую связь с «освящающий».
- source_word: ἐξ ἑνὸς
  choice: от одного
  rationale: В греческом тексте не названо, кто или что подразумевается под «одним»; краткая формулировка сохраняет эту намеренную неопределённость.
- source_word: πάντες
  choice: все
  rationale: Подчёркивает, что сказанное относится и к освящающему, и к освящаемым; подразумеваемая связка естественно передана тире.
- source_word: δι’ ἣν αἰτίαν
  choice: поэтому
  rationale: Естественно и точно выражает следствие из предыдущего утверждения.
- source_word: οὐκ ἐπαισχύνεται
  choice: не стыдится
  rationale: Передаёт обычное значение формы и сохраняет присутствующий в выражении оттенок чести и стыда без разъясняющего пересказа.
- source_word: ἀδελφοὺς
  choice: братьями
  rationale: Сохраняет мужскую форму множественного числа и образ родства в исходном тексте; возможный охват всей общины поясняется в сноске.
- source_word: καλεῖν
  choice: называть
  rationale: Естественный русский инфинитив после «не стыдится», точно передающий значение глагола в данном контексте.
theological_decisions:
- issue: Кого обозначает подразумеваемое «он» и к кому или чему относится «от одного»
  choice: Местоимение «он» контекстуально указывает на освящающего Сына, а выражение «от одного» оставлено без уточнения, как в греческом тексте.
  alternative: «от одного Отца», «из одного источника» или «от одного предка»
  rationale: Ближайший контекст позволяет узнать в освящающем Сына/Иисуса, однако ἐξ ἑνὸς само по себе не называет «одного». Уточнение в основном тексте преждевременно устранило бы подлинную богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Параллелизм «и освящающий, и освящаемые» сохраняет структуру оригинала, а тире позволяет естественно передать подразумеваемую связку. Строчные буквы в местоимении «он» следуют современной нейтральной орфографической практике и не вносят дополнительного конфессионального оттенка.
