id: HEB.2.7
reference: Hebrews 2:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἠλάττωσας αὐτὸν βραχύ τι παρ’ ἀγγέλους, δόξῃ καὶ τιμῇ ἐστεφάνωσας ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/007.yaml
  text: You made him lower than the angels for a little while[a]; you crowned him with glory and honor.
translation:
  language: ru
  text: Ты на короткое время поставил его ниже ангелов[a]; славой и честью увенчал его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты поставил его немного ниже ангелов». Греческий оборот может указывать не на продолжительность, а на степень.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάττωσας
  choice: поставил ... ниже
  rationale: Каузативно-сравнительное значение ἐλαττόω естественно передаётся по-русски как «поставил ниже»; это яснее и современнее, чем буквальное «умалил».
- source_word: αὐτὸν
  choice: его
  rationale: Местоимение мужского рода и единственного числа сохранено без добавления отсутствующего в данной строке существительного.
- source_word: βραχύ τι
  choice: на короткое время
  rationale: Оборот допускает временное и степенное понимание. В контексте Евр 2 временное значение особенно уместно, а подлинная неоднозначность сохранена в сноске.
- source_word: παρ’ ἀγγέλους
  choice: ниже ангелов
  rationale: После ἐλαττόω конструкция παρά с винительным выражает сравнение; по-русски оно естественно передаётся сочетанием «ниже ангелов».
- source_word: δόξῃ
  choice: славой
  rationale: Дательный падеж указывает, чем увенчан человек; русский творительный точно и естественно передаёт эту функцию.
- source_word: τιμῇ
  choice: честью
  rationale: В паре с δόξα слово τιμή обозначает дарованную честь и высокий статус; традиционное сочетание «славой и честью» остаётся точным и понятным.
- source_word: ἐστεφάνωσας
  choice: увенчал
  rationale: Глагол сохраняет образ возложения венца и хорошо соответствует форме аориста, переданной русским прошедшим временем.
- source_word: αὐτόν
  choice: его
  rationale: Повторное местоимение сохранено, чтобы следовать структуре греческого текста и ясно обозначить объект действия.
theological_decisions:
- issue: Значение βραχύ τι в цитате из Псалма 8, применённой в Послании к евреям
  choice: 'временное: «на короткое время»'
  alternative: 'степенное: «немного ниже»'
  rationale: Греческий оборот допускает оба прочтения. В ближайшем контексте Послания к евреям временное прочтение согласуется с временным унижением Иисуса перед прославлением, однако степенное прочтение не исключено и поэтому вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. «Поставил ниже» выбрано вместо архаичного «умалил»; пара «славой и честью» сохранена как точная, ясная и естественная.
