  text: διεμαρτύρατο δέ πού τις λέγων· Τί ἐστιν ἄνθρωπος ὅτι μιμνῄσκῃ αὐτοῦ, ἢ υἱὸς ἀνθρώπου ὅτι ἐπισκέπτῃ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/006.yaml
  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: ru
  text: 'Но кто-то где-то засвидетельствовал: «Что такое человек, что Ты помнишь о нём, или сын человеческий[b], что Ты заботишься о нём?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что Ты посещаешь его?» Греческий глагол может обозначать посещение, выражающее внимательное попечение и заботу.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «сын человеческий» здесь отсылает к Псалму 8:4, где оно служит поэтическим обозначением человека. В более широком контексте Послания этот текст также приобретает значение в связи с Иисусом.
    reason: cross_reference
lexical_decisions:
- source_word: διεμαρτύρατο
  choice: засвидетельствовал
  rationale: Передаёт значение торжественного или настойчивого свидетельства и естественно вводит цитату Писания.
- source_word: δέ
  choice: но
  rationale: Обозначает мягкий переход с оттенком противопоставления предыдущему рассуждению об ангелах.
- source_word: πού τις
  choice: некто где-то
  rationale: Сохраняет намеренно неопределённую формулу греческого текста; она вводит известную цитату, не называя её места и человеческого автора.
- source_word: Τί ἐστιν ἄνθρωπος
  choice: Что такое человек
  rationale: Сохраняет поэтический вопрос и собирательно-представительное значение единственного числа.
- source_word: μιμνῄσκῃ αὐτοῦ
  choice: Ты помнишь о нём
  rationale: Современная и точная передача значения «помнить, держать в памяти», без архаичного оборота.
- source_word: υἱὸς ἀνθρώπου
  choice: сын человеческий
  rationale: 'Сохраняет форму цитаты из Псалма 8 и её смысловую напряжённость: в псалме это поэтическое обозначение человека, тогда как контекст Послания к евреям связывает текст с Иисусом.'
- source_word: ἐπισκέπτῃ αὐτόν
  choice: Ты заботишься о нём
  rationale: Передаёт внимательное попечение, подразумеваемое глаголом; буквальное «посещаешь» в современном русском может неоправданно сузить смысл.
theological_decisions:
- issue: Следует ли явно представить «сына человеческого» как мессианский титул
  choice: Сохранить «сын человеческий» со строчной буквы, не делая титульное значение явным в основном тексте.
  alternative: Передать обобщённо как «человеческое дитя» либо написать «Сын Человеческий» с прописных букв.
  rationale: В исходном контексте Псалма 8 выражение поэтически параллельно слову «человек». Дальнейший контекст Послания применяет этот отрывок ко Христу, но сам стих сохраняет напряжение между человечеством вообще и исполнением сказанного в Иисусе.
translation_notes:
  register: Современный литературный русский с сохранением возвышенного поэтического строя цитаты. Местоимение «Ты» в обращении к Богу дано с прописной буквы по устойчивой русской библейской традиции. Неопределённая вводная формула сохранена без попытки назвать автора или место цитаты.
