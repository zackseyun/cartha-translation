- from: Поэтому нам нужно быть особенно внимательными к тому, что мы услышали, чтобы не уклониться от него.[a]
  to: Поэтому нам необходимо с ещё большим вниманием относиться к услышанному, чтобы не уплыть в сторону.[a]
