  text: Διὰ τοῦτο δεῖ περισσοτέρως ⸂προσέχειν ἡμᾶς⸃ τοῖς ἀκουσθεῖσιν, μήποτε παραρυῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/001.yaml
  text: For this reason[a], we must pay much closer attention to what we have heard, lest we drift away.
translation:
  language: ru
  text: Поэтому нам необходимо с ещё большим вниманием относиться к услышанному, чтобы не уплыть в сторону.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы не проплыть мимо»; возможно также: «чтобы услышанное не ускользнуло от нас». Греческий глагол παραρρέω вызывает образ дрейфа, скольжения или течения мимо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Поэтому
  rationale: Естественно и кратко передаёт вывод из предшествующего рассуждения.
- source_word: δεῖ
  choice: нам нужно
  rationale: Передаёт необходимость, сохраняя явное включение автора и читателей в ἡμᾶς.
- source_word: περισσοτέρως
  choice: особенно
  rationale: Передаёт усилительный сравнительный смысл — необходимость повышенного внимания — естественным современным русским языком.
- source_word: προσέχειν ἡμᾶς
  choice: нам нужно быть ... внимательными
  rationale: Точно выражает направленное и постоянное внимание к услышанному без архаичного «внимать».
- source_word: τοῖς ἀκουσθεῖσιν
  choice: к тому, что мы услышали
  rationale: Сохраняет неопределённость субстантивированного причастия и не добавляет прямо отсутствующее слово «весть».
- source_word: μήποτε
  choice: чтобы не
  rationale: Естественно вводит предостережение о возможном нежелательном результате.
- source_word: παραρυῶμεν
  choice: не уклониться от него
  rationale: Передаёт опасность постепенного ухода от услышанного; образ скольжения или дрейфа и альтернативное направление метафоры отмечены в сноске.
theological_decisions:
- issue: Направление метафоры παραρυῶμεν
  choice: Слушающие уклоняются от услышанного
  alternative: Мы проходим мимо услышанного; услышанное ускользает от нас
  rationale: Форма первого лица множественного числа представляет субъектом слушающих, но редкий глагол допускает разные пространственные оттенки. Основной текст не определяет механизм отпадения и не привносит конфессионального учения; альтернативы сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Формулировка избегает как разговорности, так и архаичного «внимать»; местоимение «него» относится к услышанному как к содержанию вести.
