  text: εἰ γὰρ ὁ δι’ ἀγγέλων λαληθεὶς λόγος ἐγένετο βέβαιος, καὶ πᾶσα παράβασις καὶ παρακοὴ ἔλαβεν ἔνδικον μισθαποδοσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/002.yaml
  text: For if the message spoken through angels proved firm[a], and every transgression and disobedience received a just penalty[b],
translation:
  language: ru
  text: Ведь если слово, возвещённое через ангелов, оказалось непреложным[a] и за всякое нарушение и непослушание полагалось справедливое воздаяние[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вероятно, имеется в виду Закон, который, согласно иудейской традиции, был передан при посредстве ангелов; ср. Деян. 7:53; Гал. 3:19.
    reason: cross_reference
  - marker: b
    text: 'Или: «справедливое наказание»; также: «заслуженная отплата».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δι’ ἀγγέλων λαληθεὶς λόγος
  choice: слово, возвещённое через ангелов
  rationale: «Слово» естественно обозначает здесь сообщённое Богом установление или весть, не подменяя вероятную отсылку прямым словом «Закон». «Через ангелов» точно сохраняет посредническое значение διά с родительным падежом; «возвещённое» передаёт λαληθείς в современном возвышенном регистре.
- source_word: ἀγγέλων
  choice: ангелов
  rationale: В контексте Послания к евреям речь, вероятнее всего, идёт о небесных ангелах, связанных в иудейской традиции с передачей Закона, а не о человеческих посланниках.
- source_word: ἐγένετο βέβαιος
  choice: оказалось непреложным
  rationale: Оборот выражает подтверждённую силу и обязательность сказанного. «Оказалось непреложным» сохраняет результативный оттенок и не сводит смысл лишь к надёжности сообщения.
- source_word: πᾶσα παράβασις
  choice: всякое преступление
  rationale: παράβασις означает переход установленной границы, нарушение заповеди. «Преступление» передаёт юридическую и нравственную весомость слова, хотя не обязательно подразумевает состав преступления в современном уголовно-правовом смысле.
- source_word: παρακοὴ
  choice: непослушание
  rationale: παρακοή обозначает неприслушивание и вытекающее из него неповиновение. «Непослушание» естественно передаёт нравственно-правовой смысл в паре с παράβασις.
- source_word: ἔλαβεν
  choice: получало
  rationale: Имперфективная русская форма согласуется с обобщающим «всякое» и передаёт закономерное получение воздаяния каждым нарушением, не меняя синтаксический субъект.
- source_word: ἔνδικον μισθαποδοσίαν
  choice: справедливое воздаяние
  rationale: μισθαποδοσία буквально указывает на отплату или возмещение, а ἔνδικος — на её справедливость и заслуженность. «Воздаяние» сохраняет более широкую судебную семантику греческого выражения, не сужая её до одного лишь наказания.
theological_decisions:
- issue: Что означает «слово, возвещённое через ангелов»
  choice: Вероятная отсылка к Закону, переданному при посредстве ангелов, без явного внесения слова «Закон» в основной текст.
  alternative: Более общее Божье послание, переданное ангелами.
  rationale: Контекст и параллельные новозаветные тексты указывают на Синайский Закон, однако греческий текст говорит буквально о «слове». Сохранение этой формулировки не устраняет допустимую смысловую открытость.
- issue: Характер μισθαποδοσία
  choice: «Справедливое воздаяние» — заслуженная судебная отплата, в данном контексте имеющая карательный смысл.
  alternative: «Справедливое наказание» — более явная, но более узкая передача.
  rationale: Контекст нарушений предполагает наказание, однако существительное само по себе шире и обозначает воздаяние или отплату. Основной текст сохраняет эту широту, а сноска поясняет альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Непреложным» и «воздаяние» сохраняют достоинство и юридико-богословскую весомость фразы, оставаясь понятными широкому читателю. Синтаксис сохраняет незавершённость условного придаточного, поскольку предложение продолжается в следующем стихе.
