  text: οὐ γὰρ δήπου ἀγγέλων ἐπιλαμβάνεται, ἀλλὰ σπέρματος Ἀβραὰμ ἐπιλαμβάνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/016.yaml
  text: For surely it is not angels that he helps[a], but the offspring of Abraham.
translation:
  language: ru
  text: Ведь, конечно же, он помогает[a] не ангелам, а потомству Авраама.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «берётся за», «схватывает». Греческий глагол буквально может означать «схватить, взяться за», но здесь, вероятно, имеет смысл «помочь» или «прийти на помощь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δήπου
  choice: конечно же
  rationale: Частица придаёт утверждению подчёркнутый характер очевидного вывода; «конечно же» естественно передаёт эту силу по-русски, не превращая её в абсолютную формулу.
- source_word: ἀγγέλων
  choice: ангелам
  rationale: Родительный падеж при ἐπιλαμβάνεται обозначает группу, с которой сопоставляется потомство Авраама; при русском «помогает» требуется дательный падеж.
- source_word: ἐπιλαμβάνεται
  choice: помогает
  rationale: Хотя основное буквальное значение глагола связано с тем, чтобы схватить или взяться за кого-либо, в данном контексте оно, вероятнее всего, означает оказание помощи или приход на помощь. «Помогает» ясно и естественно передаёт этот смысл; буквальная возможность отмечена в сноске.
- source_word: σπέρματος Ἀβραὰμ
  choice: потомству Авраама
  rationale: «Потомство» сохраняет собирательную форму единственного числа у σπέρμα и звучит в современном русском естественнее, чем буквальное «семя», не сводя выражение однозначно к множественному «потомкам».
- source_word: οὐ γὰρ ... ἀλλὰ
  choice: Ведь ... не ... а ...
  rationale: Конструкция передаёт обоснование и резкое противопоставление двух групп. Русская модель «ведь… не…, а…» сохраняет и логическую связь, и акцент.
theological_decisions:
- issue: Значение ἐπιλαμβάνεται применительно к спасительному действию Христа
  choice: Стих говорит, что он помогает потомству Авраама, а не ангелам.
  alternative: Стих говорит, что он «берётся за» потомство Авраама или «принимает» его, что традиционно связывали с восприятием человеческой природы.
  rationale: Ближайший контекст подчёркивает солидарность Сына с людьми и его спасительную помощь. Идиоматическое значение «помогать, приходить на помощь» лучше соответствует ходу мысли, однако буквальное значение «схватить, взяться за» и связанное с ним традиционное прочтение не исключаются молча, а сохраняются в сноске.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная без архаизмов. Местоимение «он» дано со строчной буквы по общим современным нормам, поскольку имя субъекта в самом стихе отсутствует. «Потомство» сохраняет собирательность исходного выражения.
