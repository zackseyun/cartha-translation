  text: 'Вот что показал мне Господь Яхве: вот корзина летних плодов[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «корзина спелых плодов». Буквально: «корзина летних плодов». Это выражение подготавливает звуковую игру со словом «конец» в следующем стихе: по-еврейски «кайиц» — «летние плоды», «кец» — «конец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: Вот что
  rationale: Естественно вводит сообщение о видении и сохраняет указательное значение еврейского выражения.
- source_word: הִרְאַנִי
  choice: показал мне
  rationale: Форма хифиль от ראה означает «дать увидеть, показать»; выбран ясный и естественный русский эквивалент.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» сохраняет личное имя יהוה, не сливая два различных элемента сочетания.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Передаёт внезапное предъявление увиденного и сохраняет живость пророческого видения без архаичного «се».
- source_word: כְּלוּב
  choice: корзина
  rationale: Хотя слово может обозначать клетку или плетёную ёмкость, сочетание с плодами однозначно указывает здесь на корзину.
- source_word: קָיִץ
  choice: летних плодов
  rationale: Буквально обозначает плоды, собираемые летом. Дословная передача сохраняет основу для звуковой игры с קֵץ («конец») в следующем стихе.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה, прямо присутствующее в еврейском тексте, и избегает неясного отождествления имени с нарицательным титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Вот» сохраняет зрительную непосредственность видения, а «се» отвергнуто как излишне архаичное.
