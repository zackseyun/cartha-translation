  text: In that day the beautiful virgins and the young men will faint from thirst[a].
translation:
  language: ru
  text: В тот день прекрасные девственницы и юноши будут падать в обморок от жажды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут изнемогать от жажды».'
    reason: 'Лексическая альтернатива: תִּתְעַלַּפְנָה может описывать как собственно обморок, так и состояние крайнего изнеможения.'
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Сохранена обычная пророческая формула времени и указательное значение еврейского выражения.
- source_word: תִּתְעַלַּפְנָה
  choice: будут падать в обморок
  rationale: Форма хитпаэль глагола עלף обозначает наступление обморочного состояния или потерю сознания от слабости; такой перевод естественен в современном русском языке.
- source_word: הַבְּתוּלֹת
  choice: девушки
  rationale: В данном параллелизме с юношами слово обозначает молодых незамужних женщин; «девушки» естественно передаёт это значение, не внося в русский текст излишне клинического оттенка слова «девственницы».
- source_word: הַיָּפוֹת
  choice: красивые
  rationale: Прямо и современно передаёт определение, относящееся к девушкам.
- source_word: וְהַבַּחוּרִים
  choice: и юноши
  rationale: בָּחוּר обозначает молодых мужчин в расцвете сил; «юноши» кратко и естественно сохраняет противопоставленную пару.
- source_word: בַּצָּמָא
  choice: от жажды
  rationale: Предлог ב здесь выражает причину обморока; русское «от жажды» идиоматично и точно.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая пророческая фраза сохранена без архаизмов. Сочетание «красивые девушки и юноши» подчёркивает, что даже молодые и сильные не выдержат жажды.
