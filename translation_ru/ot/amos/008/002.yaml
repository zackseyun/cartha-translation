base_translation:
  language: en
  yaml_path: translation/ot/amos/008/002.yaml
  text: And he said[a], “What do you see, Amos?” And I said, “A basket of summer fruit.” Then Yahweh said to me, “The end has come upon my people Israel[b]; I will not again pass by them.”
translation:
  language: ru
  text: 'И Он сказал: «Что ты видишь, Амос?» И я сказал: «Корзину с летними плодами».[a] Тогда Яхве сказал мне: «Моему народу Израилю настал конец; Я больше не пройду мимо него».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейские слова «летние плоды» (ка́йиц) и «конец» (кец) созвучны; это игра слов, связывающая видение с возвещением о конце.
    reason: cultural_note
  - marker: b
    text: 'Или: «Я больше не буду щадить его»; возможно также: «Я больше не пройду над ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אַתָּה רֹאֶה
  choice: Что ты видишь
  rationale: Настоящее время естественно передаёт причастие רֹאֶה и непосредственность вопроса о видении.
- source_word: כְּלוּב קָיִץ
  choice: корзину летних плодов
  rationale: כְּלוּב обозначает корзину или сходное плетёное вместилище, а קָיִץ — летние, созревшие плоды. Формулировка сохраняет конкретный образ, хотя еврейская игра слов по-русски не воспроизводится.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: בָּא הַקֵּץ
  choice: настал конец
  rationale: Совершенный вид בָּא представляет конец как уже наступивший в пророческом возвещении; русское «настал» звучит естественнее буквального «пришёл».
- source_word: אֶל עַמִּי יִשְׂרָאֵל
  choice: Моему народу Израилю
  rationale: Дательный оборот после «настал конец» естественно передаёт направленность возвещённого суда на Израиль.
- source_word: לֹא אוֹסִיף עוֹד עֲבוֹר לוֹ
  choice: Я больше не пройду мимо него
  rationale: Сохраняется образ глагола עבר и коллективное единственное число, относящееся к народу; вероятный смысл прекращения пощады указан в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Смысл עֲבוֹר לוֹ в контексте суда
  choice: Я больше не пройду мимо него
  alternative: Я больше не буду щадить его / оставлять его без наказания
  rationale: Основной текст сохраняет метафору и неоднозначность идиомы, а сноска поясняет наиболее вероятный смысл — прекращение Божьего снисхождения.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным ритмом. Прямая речь оформлена естественно; местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
