  terminology: «Яхве», «Амос», «летние плоды» и «конец» выбраны удачно. «Корзина с летними плодами» естественнее по-русски, чем «корзина летних плодов», и сохраняет термин, необходимый для пояснения игры слов. Сноску b следует ограничить действительно лексическими альтернативами, не добавляя пояснительного «оставлять без наказания» в качестве варианта перевода.
