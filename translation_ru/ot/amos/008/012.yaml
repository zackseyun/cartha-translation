base_translation:
  language: en
  yaml_path: translation/ot/amos/008/012.yaml
  text: They will wander from sea to sea[a], and from north to east; they will roam about seeking the word of Yahweh[b], but they will not find it.
translation:
  language: ru
  text: Они будут скитаться от моря до моря и от севера до востока; будут метаться[a] в поисках слова Яхве[b], но не найдут его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут бегать туда и сюда».'
    reason: lexical_alternative
  - marker: b
    text: То есть божественное послание или откровение.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָעוּ
  choice: будут скитаться
  rationale: Глагол נוּעַ может описывать как странствование, так и шатание. В контексте безуспешных поисков по разным землям «будут скитаться» естественно передаёт беспокойное движение, не вводя излишне конкретный образ опьянения.
- source_word: מִיָּם עַד יָם
  choice: от моря до моря
  rationale: Прямо сохраняет широкое географическое выражение оригинала, не уточняя, какие именно моря имеются в виду.
- source_word: וּמִצָּפוֹן וְעַד מִזְרָח
  choice: от севера до востока
  rationale: מִזְרָח буквально связано с восходом солнца и обычно обозначает восток; выбран ясный современный русский эквивалент с сохранением необычной направленности оригинала.
- source_word: יְשׁוֹטְטוּ
  choice: будут метаться
  rationale: Глагол выражает беспокойное движение туда и сюда. «Будут метаться» естественно передаёт напряжённость и безуспешность поисков; более буквальная альтернатива дана в сноске.
- source_word: לְבַקֵּשׁ
  choice: в поисках
  rationale: Передаёт целевое значение инфинитива и естественно сочетается по-русски с «будут метаться».
- source_word: דְּבַר יְהוָה
  choice: слова Яхве
  rationale: Сохраняет традиционную для пророческой речи формулу «слово Яхве», которая здесь означает послание или откровение от Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וְלֹא יִמְצָאוּ
  choice: но не найдут его
  rationale: «Но» естественно подчёркивает противопоставленный результат поисков; местоимение «его» восполняет подразумеваемое в еврейском тексте дополнение и относится к слову Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит тетраграмматон, личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Значение דְּבַר יְהוָה
  choice: слово Яхве
  alternative: весть от Яхве
  rationale: Формальная передача сохраняет устойчивую пророческую формулу и её смысловую широту; сноска поясняет, что речь идёт о божественном послании или откровении.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет географический размах и нарастающее отчаяние оригинала; подлинная неоднозначность глаголов движения отражена в основном тексте и сноске.
