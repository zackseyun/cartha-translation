source:
  edition: WLC
  text: הַ/נִּשְׁבָּעִים֙ בְּ/אַשְׁמַ֣ת שֹֽׁמְר֔וֹן וְ/אָמְר֗וּ חֵ֤י אֱלֹהֶ֨י/ךָ֙ דָּ֔ן וְ/חֵ֖י דֶּ֣רֶךְ בְּאֵֽר שָׁ֑בַע וְ/נָפְל֖וּ וְ/לֹא יָק֥וּמוּ עֽוֹד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/014.yaml
  text: Those who swear by the guilt of Samaria and say[a], ‘As your god, Dan, lives,’ and[c][b], ‘As the way of Beer-sheba lives,’ will fall and never rise again.
translation:
  language: ru
  text: 'Те, кто клянутся виной Самарии[a] и говорят: «Жив твой бог, Дан!»[b] — и: «Жив путь Вирсавии!»[c], — падут и больше не встанут.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грехом Самарии»; некоторые видят здесь указание на идола или божество, связанное с Самарией.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Жив твой бог Дана!»'
    reason: lexical_alternative
  - marker: c
    text: «Путь Вирсавии» может означать паломническую дорогу в Вирсавию или связанный с ней культовый обычай.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנִּשְׁבָּעִים
  choice: Те, кто клянётся
  rationale: Субстантивированное причастие естественно передано по-русски определительным оборотом, обозначающим людей, над которыми произносится суд.
- source_word: בְּאַשְׁמַת שֹׁמְרוֹן
  choice: виной Самарии
  rationale: אַשְׁמָה обычно означает вину или виновность; здесь выражение, вероятно, метонимически указывает на виновный идолопоклоннический культ Самарии, но основной текст не уточняет это сверх еврейского.
- source_word: חֵי
  choice: Жив…!
  rationale: Передаёт обычную древнееврейскую формулу клятвы и сохраняет её намеренно необычное применение как к богу, так и к «пути».
- source_word: אֱלֹהֶיךָ דָּן
  choice: твой бог, Дан
  rationale: Сжатый синтаксис оригинала сохранён без окончательного устранения неоднозначности; Дан может пониматься как обращение или как указание на место, с которым связан бог.
- source_word: דֶּרֶךְ בְּאֵר שָׁבַע
  choice: путь Вирсавии
  rationale: Буквальное значение דֶּרֶךְ — «путь»; такая передача сохраняет возможность понимать выражение как дорогу паломничества либо как культовый обычай Вирсавии.
- source_word: וְנָפְלוּ
  choice: падут
  rationale: Форма пророческого суда естественно передана русским будущим временем.
- source_word: וְלֹא יָקוּמוּ עוֹד
  choice: и больше не встанут
  rationale: Сохраняет окончательность выражения לֹא … עוֹד в естественной современной русской форме.
theological_decisions:
- issue: Природа «вины Самарии»
  choice: Сохранить общее значение «вина», допускающее метонимическую отсылку к виновному идолопоклонническому культу Самарии.
  alternative: «грех Самарии» либо понимание выражения как названия идола или божества.
  rationale: Такой перевод следует обычному значению אַשְׁמָה и не превращает возможную культовую отсылку в однозначное имя собственного.
- issue: Значение выражения «путь Вирсавии»
  choice: Сохранить буквальное выражение в основном тексте.
  alternative: Паломническая дорога в Вирсавию либо связанный с Вирсавией культовый обычай.
  rationale: Контекст культовый, однако еврейское דֶּרֶךְ само по себе не устраняет неоднозначность.
- issue: Синтаксис выражения אֱלֹהֶיךָ דָּן
  choice: «твой бог, Дан»
  alternative: «твой бог Дана» или «бог твой, о Дан»
  rationale: Сжатая конструкция допускает более одного синтаксического понимания; основной текст близко воспроизводит её, а примечание сообщает главный альтернативный вариант.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной интонацией пророческого суда. Традиционная русская форма топонима «Вирсавия» употреблена ради узнаваемости; необычные клятвенные формулы и смысловая напряжённость оригинала намеренно сохранены.
