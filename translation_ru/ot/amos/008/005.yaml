  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לֵ/אמֹ֗ר מָתַ֞י יַעֲבֹ֤ר הַ/חֹ֨דֶשׁ֙ וְ/נַשְׁבִּ֣ירָה שֶּׁ֔בֶר וְ/הַ/שַּׁבָּ֖ת וְ/נִפְתְּחָה בָּ֑ר לְ/הַקְטִ֤ין אֵיפָה֙ וּ/לְ/הַגְדִּ֣יל שֶׁ֔קֶל וּ/לְ/עַוֵּ֖ת מֹאזְנֵ֥י מִרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/005.yaml
  text: saying[a], “When will the new moon be over, so that we may sell grain, and the Sabbath, so that we may offer wheat for sale—making the ephah small and the shekel large[b], and distorting deceitful scales?”
translation:
  language: ru
  text: 'говоря: «Когда же пройдут новомесячие[a] и суббота, чтобы мы могли продавать зерно и открыть закрома с пшеницей для продажи, — уменьшая ефу и увеличивая сикль[b], и кривя весы для обмана?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «месяц»; здесь контекст указывает скорее на праздник новомесячия, чем на календарный месяц.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «уменьшая ефу и увеличивая сикль», то есть отпуская меньше товара и требуя больше платы.'
    reason: cultural_note
lexical_decisions:
- source_word: הַחֹדֶשׁ
  choice: новомесячие
  rationale: В данном торгово-религиозном контексте имеется в виду праздник новомесячия, окончание которого торговцы ждут, чтобы возобновить торговлю, а не просто календарный месяц.
- source_word: וְנַשְׁבִּירָה שֶּׁבֶר
  choice: чтобы нам продавать зерно
  rationale: Порода hифиль глагола שׁבר здесь означает продажу зерна или припасов; формулировка естественна для рыночного контекста.
- source_word: וְהַשַּׁבָּת
  choice: и суббота
  rationale: Сохранено обозначение еженедельного священного дня, ограничения которого алчные торговцы воспринимают как помеху.
- source_word: וְנִפְתְּחָה בָּר
  choice: чтобы выставить пшеницу на продажу
  rationale: Сочетание פתח с בָּר передаёт открытие запасов или мешков для торговли; «выставить на продажу» естественно выражает смысл, а «пшеница» сохраняет возможную конкретность בָּר и отличие от предыдущего שֶׁבֶר.
- source_word: לְהַקְטִין אֵיפָה
  choice: уменьшая ефу
  rationale: 'Сохранена конкретная древняя мера сыпучих тел и параллелизм мошеннических действий: покупателю недодают товар.'
- source_word: וּלְהַגְדִּיל שֶׁקֶל
  choice: и увеличивая сикль
  rationale: Сикль выступает как весовой или денежный стандарт; буквальный образ передаёт требование завышенной платы и сохраняет параллелизм с уменьшением ефы.
- source_word: וּלְעַוֵּת מֹאזְנֵי מִרְמָה
  choice: и кривя весы для обмана
  rationale: «Кривя» сохраняет физический образ искривления или порчи весов, заложенный в עוה, а «для обмана» ясно и естественно передаёт מִרְמָה без неуклюжего сочетания «обманные весы».
theological_decisions:
- issue: Передача священных времён в обличении экономической алчности
  choice: «новомесячие» и «суббота» как религиозные установления
  alternative: Понять חֹדֶשׁ как чисто календарный «месяц»
  rationale: Пророк обличает людей, которым священные дни мешают извлекать прибыль. Культовый смысл обоих терминов следует сохранить, не добавляя конфессионального толкования.
- issue: Целевая или сопутствующая функция мошеннических действий
  choice: Деепричастная конструкция «уменьшая… увеличивая… кривя…»
  alternative: 'Передать все три инфинитива как отдельные цели: «чтобы уменьшить… увеличить… искривить…»'
  rationale: Еврейские формы допускают целевое прочтение, но в русском деепричастная цепочка естественно связывает способы предполагаемой торговли с предыдущими целями, не устраняя смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Частица «же» естественно передаёт нетерпеливое недовольство торговцев. Термины «ефа» и «сикль» сохранены ради конкретного древнего образа и пояснены сноской.
