  text: הַ֤/עַל זֹאת֙ לֹֽא תִרְגַּ֣ז הָ/אָ֔רֶץ וְ/אָבַ֖ל כָּל יוֹשֵׁ֣ב בָּ֑/הּ וְ/עָלְתָ֤ה כָ/אֹר֙ כֻּלָּ֔/הּ וְ/נִגְרְשָׁ֥ה ו/נשקה כִּ/יא֥וֹר מִצְרָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/008.yaml
  text: Because of this[a], will not the land tremble, and every one who dwells in it mourn? All of it will rise like the Nile[b]; it will be driven along and sink like the Nile of Egypt.
translation:
  language: ru
  text: Не содрогнётся ли от этого земля[a] и не будут ли скорбеть все, кто живёт на ней? Вся она поднимется, как Нил[b], всколыхнётся и опустится, как египетский Нил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страна». Еврейское אֶרֶץ может означать как землю, так и страну; в этом контексте возможны оба оттенка.'
    reason: lexical_alternative
  - marker: b
    text: Сравнение отсылает к ежегодному подъёму и спаду вод Нила и изображает всеобщее потрясение.
    reason: cultural_note
lexical_decisions:
- source_word: הַעַל זֹאת
  choice: от этого
  rationale: Кратко и естественно передаёт причинное значение עַל с указательным местоимением в риторическом вопросе.
- source_word: תִרְגַּז
  choice: содрогнётся
  rationale: Передаёт и физическое колебание земли, и тревожный оттенок глагола רגז в контексте суда.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Русское «земля» естественно обозначает и территорию, и землю как мир; локальный смысл здесь определяется упоминанием живущих на ней.
- source_word: וְאָבַל
  choice: будут ... скорбеть
  rationale: Глагол אבל обозначает траур и скорбь; множественное число естественно согласует сказуемое с русским «все».
- source_word: כָּל יוֹשֵׁב בָּהּ
  choice: все, кто живёт на ней
  rationale: Современная и ясная передача собирательно-дистрибутивного выражения «всякий живущий на ней».
- source_word: וְעָלְתָה כָאֹר כֻּלָּהּ
  choice: Вся она поднимется, как Нил
  rationale: Женский суффикс отсылает к земле; «Нил» проясняет образ, подтверждённый последующим упоминанием Египта.
- source_word: וְנִגְרְשָׁה
  choice: всколыхнётся
  rationale: В контексте разлива передаёт бурное движение и вздымание, сохраняя образ земли, уподобленной речным водам.
- source_word: וְנשקה
  choice: и опустится
  rationale: По контексту противопоставлено подъёму Нила и выражает спад воды; чтение и значение формы текстуально затруднены, что отмечено в примечании.
- source_word: כִּיאוֹר מִצְרָיִם
  choice: как египетский Нил
  rationale: Естественная русская передача еврейской конструкции, прямо называющая реку, чей разлив служит сравнением.
