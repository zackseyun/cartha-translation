  register: Современный литературный русский язык с торжественной пророческой интонацией. Риторический вопрос сохранён; синтаксис сделан естественным для русского, а образ подъёма и спада Нила оставлен явным. Подлинная неопределённость формы וְנשקה не скрыта, но основной текст передаёт наиболее вероятный контекстуальный смысл.
