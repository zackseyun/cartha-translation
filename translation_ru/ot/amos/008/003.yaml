base_translation:
  language: en
  yaml_path: translation/ot/amos/008/003.yaml
  text: And the songs of the palace will become wailing in that day[a], declares the Lord GOD. Many will be the corpses[b]; in every place they will throw them out—silence!
translation:
  language: ru
  text: И песни дворца станут плачем в тот день[a], — возвещает Владыка Яхве. — Трупов будет множество; повсюду их будут выбрасывать — тише![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «песни храма станут плачем». Еврейское הֵיכָל может означать и «дворец», и «храм».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Молчать!» Еврейское הָס — резкий призыв к тишине, вероятно выражающий ужас или оцепенение перед лицом множества мёртвых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵילִילוּ
  choice: обратятся в рыдание
  rationale: Форма от ילל при подлежащем «песни» передаёт превращение песен в плач; такой перевод сохраняет образ и естественно звучит по-русски.
- source_word: שִׁירוֹת
  choice: песни
  rationale: Конкретное значение существительного сохранено без обобщения до «музыки» или «пения».
- source_word: הֵיכָל
  choice: дворца
  rationale: Слово может обозначать дворец или храм. В контексте суда над общественной жизнью Израиля выбран «дворец», а реальная лексическая неоднозначность отмечена в сноске.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Сохранена обычная пророческая временная формула.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передано естественной для пророческой речи формулой «возвещает»; составной титул сохраняет значение אֲדֹנָי и личное имя יהוה без неестественного повтора «Господь ГОСПОДЬ».
- source_word: רַב הַפֶּגֶר
  choice: много будет трупов
  rationale: Количественное сказуемое רַב передано естественной русской конструкцией, а פגר — прямым и выразительным словом «труп».
- source_word: בְּכָל מָקוֹם
  choice: повсюду
  rationale: Идиоматичный русский эквивалент сохраняет распределительное значение «в каждом месте».
- source_word: הִשְׁלִיךְ
  choice: их станут бросать
  rationale: Единственное число глагола понято безлично-коллективно; местоимение «их» восполняет подразумеваемый объект — трупы.
- source_word: הָס
  choice: Тише!
  rationale: Краткое резкое междометие передаёт требование молчания и сохраняет внезапность еврейского текста.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Передача «Владыка Яхве» различает титул אֲדֹנָי и личное имя יהוה, не создавая повтора и не скрывая имя описательным титулом.
- issue: Референт הֵיכָל
  choice: дворец в основном тексте с вариантом «храм» в сноске
  alternative: храм
  rationale: Оба значения лексически возможны; контекст не позволяет превращать один вариант в бесспорное богословское утверждение, поэтому неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Резкие переходы и финальный призыв к молчанию сохранены; пунктуация помогает передать смену голоса внутри пророческого изречения.
