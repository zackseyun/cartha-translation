  text: נִשְׁבַּ֥ע יְהוָ֖ה בִּ/גְא֣וֹן יַעֲקֹ֑ב אִם אֶשְׁכַּ֥ח לָ/נֶ֖צַח כָּל מַעֲשֵׂי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/007.yaml
  text: 'Yahweh has sworn by the pride of Jacob: Surely I will never forget any of their deeds[a][b].'
translation:
  language: ru
  text: 'Яхве поклялся гордостью Иакова: «Никогда не забуду ни одного из их дел[a][b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «славой Иакова»; или: «величием Иакова». Древнееврейское выражение может иронически указывать на то, чем гордится Иаков, либо, возможно, на Бога как истинную славу Иакова.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «если навсегда забуду хоть одно из их дел». Это формула клятвы, означающая: «никогда не забуду ни одного из их дел».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: поклялся
  rationale: Нифаль глагола שׁבע выражает принесение клятвы. Русское совершенное прошедшее передаёт торжественно провозглашаемый совершившийся акт.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не заменено титулом «Господь».
- source_word: בִּגְאוֹן
  choice: гордостью
  rationale: גָּאוֹן может означать гордость, славу, величие или превосходство. «Гордостью» наиболее прямо сохраняет возможный иронический оттенок и не исключает более возвышенного понимания оборота.
- source_word: יַעֲקֹב
  choice: Иакова
  rationale: Сохранено собственное имя, которое здесь также обозначает народ завета; замена на «Израиль» устранила бы особенность пророческой речи.
- source_word: אִם אֶשְׁכַּח לָנֶצַח
  choice: Никогда не забуду
  rationale: 'После формулы клятвы אִם вводит эллиптическое самоусловное проклятие: буквально «если забуду навсегда», то есть решительное «никогда не забуду». Перевод передаёт функцию древнееврейской формулы естественным русским выражением.'
- source_word: כָּל מַעֲשֵׂיהֶם
  choice: ни одного из их дел
  rationale: В отрицательной конструкции сочетание «ни одного из» естественно передаёт всеохватность כָּל, а «дел» сохраняет нравственно значимый, но достаточно широкий смысл מַעֲשֶׂה.
theological_decisions:
- issue: Смысл выражения «гордость Иакова» в формуле клятвы
  choice: Оставить выражение «гордостью Иакова» без поясняющего истолкования в основном тексте.
  alternative: Передать как «славой Иакова» и понимать как наименование Бога либо как «величием Иакова» применительно к достоинству, положению или земле Израиля.
  rationale: Древнееврейский оборот допускает и ироническое указание на предмет гордости Израиля, и понимание Бога как истинной славы Иакова. Буквальная формулировка сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной пророческой интонацией. Синтаксис краток и естественен; архаическая формула клятвы раскрыта в сноске, а в основном тексте передан её смысл.
