source:
  edition: WLC
  text: וְ/הָפַכְתִּ֨י חַגֵּי/כֶ֜ם לְ/אֵ֗בֶל וְ/כָל שִֽׁירֵי/כֶם֙ לְ/קִינָ֔ה וְ/הַעֲלֵיתִ֤י עַל כָּל מָתְנַ֨יִם֙ שָׂ֔ק וְ/עַל כָּל רֹ֖אשׁ קָרְחָ֑ה וְ/שַׂמְתִּ֨י/הָ֙ כְּ/אֵ֣בֶל יָחִ֔יד וְ/אַחֲרִיתָ֖/הּ כְּ/י֥וֹם מָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/010.yaml
  text: I will turn your feasts into mourning[a], and all your songs into lamentation; I will bring sackcloth on every waist and baldness on every head; I will make it like mourning for an only son[d][c][b], and its end like a bitter day.
translation:
  language: ru
  text: 'Я обращу ваши праздники в траур[a],

    а все ваши песни — в плач;

    Я возложу на все чресла вретище

    и наведу лысину на каждую голову.

    Я уподоблю всё это трауру по единственному сыну[b],

    а конец всего этого будет как горький день[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваши праздничные торжества».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «трауру по единственному»; обычно подразумевается единственный сын.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «как день горечи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָפַכְתִּי
  choice: Я обращу
  rationale: Глагол обозначает превращение одного состояния в другое; «обращу … в» естественно передаёт резкий переход от праздника к трауру.
- source_word: חַגֵּיכֶם
  choice: ваши праздники
  rationale: חַג обозначает праздничные, нередко религиозные торжества; «праздники» понятно современному читателю и не сужает значение до застолья.
- source_word: לְאֵבֶל
  choice: в траур
  rationale: אֵבֶל — скорбь и обрядовое состояние по умершему; «траур» сохраняет одновременно эмоциональный и общественно-ритуальный оттенки.
- source_word: וְכָל שִׁירֵיכֶם לְקִינָה
  choice: а все ваши песни — в погребальный плач
  rationale: קִינָה — формальный плач, особенно по умершему; сочетание «погребальный плач» ясно отличает его от общего сетования.
- source_word: וְהַעֲלֵיתִי עַל כָּל מָתְנַיִם שָׂק
  choice: Я возложу на каждую талию вретище
  rationale: Каузативная форма עלה буквально описывает возложение/помещение вретища на область бёдер или талии. «Вретище» сохраняет библейский образ траура, а «талия» передаёт анатомический смысл без архаического «чресла».
- source_word: וְעַל כָּל רֹאשׁ קָרְחָה
  choice: и сделаю каждую голову лысой
  rationale: Эллиптическая еврейская конструкция означает появление лысины на каждой голове как знака траура; глагольная передача звучит по-русски естественнее буквального «лысина на каждой голове».
- source_word: וְשַׂמְתִּיהָ
  choice: Я уподоблю всё это
  rationale: Женский суффикс имеет не вполне определённый референт. «Всё это» указывает на описанное состояние в целом, не отождествляя его прямо с землёй, городом или праздником.
- source_word: כְּאֵבֶל יָחִיד
  choice: трауру по единственному сыну
  rationale: יָחִיד буквально значит «единственный»; в данной устойчивой картине скорби обычно подразумевается единственный сын, однако буквальная неопределённость отмечена в сноске.
- source_word: וְאַחֲרִיתָהּ
  choice: а конец этого
  rationale: אַחֲרִית обозначает конец или исход. Формулировка сохраняет связь с неопределённым референтом женского суффикса, не конкретизируя его сверх текста.
- source_word: כְּיוֹם מָר
  choice: как горький день
  rationale: Буквальное и естественное сравнение с днём, отмеченным горечью и тяжёлой скорбью.
theological_decisions:
- issue: Референт женских суффиксов в וְשַׂמְתִּיהָ и וְאַחֲרִיתָהּ
  choice: «всё это» / «конец этого» — общее указание на предстоящее состояние траура и суда
  alternative: «её» — о земле или городе; либо «его» — о празднике
  rationale: Еврейские суффиксы женского рода допускают несколько подразумеваемых референтов. Нейтральная формулировка сохраняет эту неоднозначность и не вводит отсутствующего в стихе существительного.
- issue: Значение יָחִיד в образе траура
  choice: В основном тексте — «единственный сын», с указанием буквального значения в сноске
  alternative: «единственный ребёнок» или «единственный»
  rationale: Контекстуальный образ традиционно относится к смерти единственного сына, но само слово не выражает «сын» явно; сноска сохраняет формальную широту оригинала.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Параллелизм передан строками и синтаксическим повтором. «Вретище» оставлено как узнаваемый библейский термин, тогда как архаические «чресла» и тяжеловесное «плешь на всякой голове» заменены понятными современными выражениями.
