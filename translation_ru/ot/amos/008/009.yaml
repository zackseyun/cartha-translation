  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הֵבֵאתִ֥י הַ/שֶּׁ֖מֶשׁ בַּֽ/צָּהֳרָ֑יִם וְ/הַחֲשַׁכְתִּ֥י לָ/אָ֖רֶץ בְּ/י֥וֹם אֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/009.yaml
  text: And it shall happen in that day[a], declares the Lord GOD, that I will make the sun go down at noon, and I will darken the earth in broad daylight.
translation:
  language: ru
  text: «И будет в тот день, — возвещает Господь Яхве, — я заставлю солнце зайти в полдень и погружу землю[a] во тьму среди бела дня».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страну». Еврейское אֶרֶץ может означать как землю вообще, так и определённую страну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Передаёт пророческую формулу будущего события кратко, торжественно и естественно для современного литературного русского языка.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Сохраняет устойчивое пророческое выражение и его временную, не обязательно строго эсхатологическую, открытость.
- source_word: נְאֻם
  choice: возвещает
  rationale: Передаёт формулу пророческого изречения как авторитетное объявление; звучит dignified and natural in Russian without the bureaucratic shade of «заявляет».
- source_word: אֲדֹנָי יְהוִה
  choice: Господь Яхве
  rationale: Различает титул אֲדֹנָי и личное имя יהוה, избегая тавтологии «Господь Господь» и не скрывая присутствующее в еврейском тексте имя.
- source_word: וְהֵבֵאתִי הַשֶּׁמֶשׁ
  choice: Я заставлю солнце зайти
  rationale: Каузативная форма глагола בוא с солнцем означает, что Бог заставит солнце зайти; русский оборот ясно сохраняет божественное действие.
- source_word: בַּצָּהֳרָיִם
  choice: в полдень
  rationale: Точное и обычное русское обозначение середины дня.
- source_word: וְהַחֲשַׁכְתִּי לָאָרֶץ
  choice: и погружу землю во тьму
  rationale: Естественно передаёт каузативное «сделаю тёмной», сохраняя выразительный образ внезапной тьмы.
- source_word: בְּיוֹם אוֹר
  choice: среди бела дня
  rationale: Русский идиоматический оборот передаёт усиление буквального «в день света» и подчёркивает противоестественность наступления тьмы.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Господь Яхве
  alternative: Господь Бог
  rationale: В исходном тексте стоит титул אֲדֹנָי и тетраграмматон יהוה. Передача «Господь Яхве» сохраняет это различие и явное употребление личного имени, не навязывая дополнительного толкования.
- issue: Характер потемнения солнца
  choice: Сохранён прямой космический образ без пояснения его механизма или степени буквальности
  alternative: Истолковать как затмение либо исключительно как метафору суда
  rationale: Текст описывает действие Бога образным пророческим языком, но сам не уточняет, идёт ли речь о затмении, сверхъестественном событии или символическом изображении суда; перевод не должен снимать эту напряжённость.
translation_notes:
  register: Современный литературный русский с кратким пророческим ритмом и умеренно торжественной интонацией. Идиома «среди бела дня» естественно подчёркивает резкий контраст света и тьмы; архаизмы и конфессионально маркированные формулы избегаются.
