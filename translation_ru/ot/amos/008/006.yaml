    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְנוֹת
  choice: покупать
  rationale: Инфинитив породы qal выражает цель намерений торговцев, продолжая мысль предыдущего стиха. Прямое значение «покупать» соответствует экономическому контексту и, вероятно, подразумевает обращение должников в рабство.
- source_word: בַּכֶּסֶף
  choice: за серебро
  rationale: Предлог обозначает цену. «За серебро» сохраняет конкретный образ еврейского текста и его пророческое звучание.
- source_word: דַּלִּים
  choice: бедных
  rationale: דַּל обозначает бедных либо социально слабых; в контексте экономического угнетения естественно «бедных».
- source_word: וְאֶבְיוֹן
  choice: а нуждающихся
  rationale: אֶבְיוֹן близко по смыслу к דַּל, но не тождественно ему. «Нуждающихся» сохраняет различие между параллельными словами.
- source_word: בַּעֲבוּר נַעֲלָיִם
  choice: за пару сандалий
  rationale: Оборот указывает на ничтожную цену, за которую порабощают нуждающегося. Двойственное число נַעֲלָיִם естественно передаётся как «пара сандалий».
- source_word: וּמַפַּל בַּר
  choice: и зерновые отбросы
  rationale: מַפַּל — то, что упало или было отброшено; вместе с בַּר («зерно») выражение обозначает низкокачественные остатки зерна. «Зерновые отбросы» ясно и ёмко передают предмет мошеннической продажи, не сужая значение до пшеницы.
- source_word: נַשְׁבִּיר
  choice: продавать
  rationale: Hiphil глагола שׁבר в торговом контексте означает продавать зерно. Несовершенный вид согласован с инфинитивной конструкцией цели «чтобы покупать... и продавать».
