lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  choice: Выслушайте это
  rationale: Множественное повелительное наклонение и указательное местоимение переданы как прямой пророческий призыв внимательно принять сказанное.
- source_word: הַשֹּׁאֲפִים
  choice: попирающие
  rationale: Причастие от שאף допускает образы жадного преследования, заглатывания или сокрушения. В контексте экономического угнетения «попирающие» ясно передаёт насильственную эксплуатацию, а неоднозначность образа отмечена в сноске.
- source_word: אֶבְיוֹן
  choice: бедняка
  rationale: Единственное число оригинала сохранено; слово обозначает человека, испытывающего нужду. Выбор также позволяет отличить его от следующего ענוי.
- source_word: וְלַשְׁבִּית
  choice: и стремящиеся истребить
  rationale: Инфинитив породы hифиль от שבת выражает прекращение существования или деятельности. В сочетании с причастием конструкция естественно передана как целенаправленное действие угнетателей; «истребить» сохраняет силу контекста.
- source_word: ענוי אָרֶץ
  choice: нуждающихся в этой земле
  rationale: Кетив ענוי в данном социальном контексте понимается как бедные или угнетённые жители страны. «В этой земле» передаёт локальный, общественно-политический смысл אָרֶץ.
