base_translation:
  language: en
  yaml_path: translation/ot/amos/008/011.yaml
  text: Behold[a], days are coming, declares the Lord GOD, when I will send a famine on the land—not a famine for bread, nor a thirst for water, but for hearing the words of Yahweh.
translation:
  language: ru
  text: «Вот, наступают дни, — возвещает Господь Яхве, — когда Я пошлю на землю голод — не голод по хлебу и не жажду воды, а голод по слышанию слов Яхве[a].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «…а (голод) слышать слова Яхве». Еврейский инфинитив можно передать более непосредственно; основной вариант лучше сохраняет параллель с выражениями «по хлебу» и «воды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт привлекающее внимание вступление к торжественному пророческому возвещению и естественно звучит в современном русском языке.
- source_word: יָמִים בָּאִים
  choice: наступают дни
  rationale: Сохраняет обычную пророческую формулу о приближающемся времени суда.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: «Возвещает» естественно передаёт формулу божественного изречения נְאֻם, а «Владыка Яхве» различает титул אֲדֹנָי и личное имя יהוה.
- source_word: וְהִשְׁלַחְתִּי
  choice: когда Я пошлю
  rationale: Связывает действие с наступающими днями, сохраняя личное действие Бога и естественную русскую синтаксическую связь.
- source_word: רָעָב
  choice: голод
  rationale: В контексте обозначает бедствие, голод в земле, а не только субъективное чувство отдельного человека.
- source_word: בָּאָרֶץ
  choice: на эту землю
  rationale: אֶרֶץ в контексте суда у Амоса естественнее понимать как землю, находящуюся под судом, а не весь мир; указательное «эту» делает подразумеваемую контекстом землю ясной по-русски.
- source_word: לֹא רָעָב לַלֶּחֶם
  choice: не голод по хлебу
  rationale: Сохраняет образ хлеба и параллельное управление с последующим метафорическим объектом голода.
- source_word: וְלֹא צָמָא לַמַּיִם
  choice: и не жажду воды
  rationale: Естественно передаёт параллельную отрицательную конструкцию, не устраняя различия между голодом и жаждой.
- source_word: כִּי אִם
  choice: а
  rationale: Кратко и естественно выражает резкое противопоставление буквальной нехватке хлеба и воды.
- source_word: לִשְׁמֹעַ
  choice: по тому, чтобы слышать
  rationale: Передаёт объект метафорического голода и сохраняет значение процесса или возможности слышать, не сужая его до однократного услышанного сообщения.
- source_word: דִּבְרֵי יְהוָה
  choice: слова Яхве
  rationale: Сохраняет грамматическое множественное число דִּבְרֵי и передаёт יהוה личным именем «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве; в сочетании אֲדֹנָי יְהוִה — «Владыка Яхве»
  alternative: ГОСПОДЬ; «Господь БОГ»
  rationale: Транслитерация сохраняет личное заветное имя, а «Владыка» отдельно передаёт предшествующий титул אֲדֹנָי и избегает искусственного удвоения «Господь ГОСПОДЬ».
- issue: Характер возвещённого голода
  choice: нехватка возможности слышать слова Яхве
  alternative: буквальный голод, сопровождаемый духовной нуждой
  rationale: Сам стих прямо отрицает голод по хлебу и жажду воды, после чего называет истинный предмет голода; перевод не добавляет объяснения о причине или механизме этой нехватки.
- issue: Значение לִשְׁמֹעַ
  choice: «чтобы слышать»
  alternative: «чтобы услышать»
  rationale: Несовершенный вид лучше сохраняет возможное значение продолжающегося слушания или доступа к Божьим словам, тогда как совершенный вид может представить действие как однократное и завершённое.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. «Вот» и вставная формула «возвещает Владыка Яхве» поддерживают возвышенный регистр, а синтаксис и лексика остаются понятными обычному читателю. Маркер сноски помещён при фразе, к которой относится вариант перевода.
