id: AMO.6.1
reference: Amos 6:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: ה֚וֹי הַ/שַּׁאֲנַנִּ֣ים בְּ/צִיּ֔וֹן וְ/הַ/בֹּטְחִ֖ים בְּ/הַ֣ר שֹׁמְר֑וֹן נְקֻבֵי֙ רֵאשִׁ֣ית הַ/גּוֹיִ֔ם וּ/בָ֥אוּ לָ/הֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/001.yaml
  text: Woe to those who are at ease in Zion[a], and to those who feel secure on the mountain of Samaria, the distinguished men of the foremost of the nations[c][b], to whom the house of Israel comes.
translation:
  language: ru
  text: Горе живущим беспечно на Сионе и чувствующим себя в безопасности на горе Самарии — именитым людям[a] первейшего из народов[b], к которым приходит дом Израиля![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «названным» или «отмеченным»; вероятно, имеются в виду видные, известные люди.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «первого из народов»; возможен также смысл «главного среди народов».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейская фраза предельно сжата; буквально: «и приходит к ним дом Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Пророческое восклицание одновременно выражает скорбь, осуждение и угрозу грядущего бедствия; «горе» сохраняет все эти оттенки.
- source_word: הַשַּׁאֲנַנִּים
  choice: живущим беспечно
  rationale: Причастная форма от שׁאנן обозначает безмятежность и самодовольную беспечность. Такой перевод передаёт как состояние покоя, так и отрицательную оценку контекста.
- source_word: בְּצִיּוֹן
  choice: на Сионе
  rationale: Предлог имеет локативное значение; традиционное и естественное русское обозначение местности — «на Сионе».
- source_word: וְהַבֹּטְחִים
  choice: и чувствующим себя в безопасности
  rationale: בטח может означать доверие или ощущение защищённости. Здесь параллелизм с беспечностью указывает на ложную уверенность, поэтому положительно окрашенное «уповающим» не выбрано.
- source_word: בְּהַר שֹׁמְרוֹן
  choice: на горе Самарии
  rationale: Близко передана географическая конструкция без превращения её в не засвидетельствованное здесь собственное имя «гора Самария».
- source_word: נְקֻבֵי
  choice: именитым людям
  rationale: Буквальное значение связано с теми, кто назван или особо отмечен; в контексте речь идёт о видных, известных представителях общества. «Именитым» естественно передаёт эту социальную заметность.
- source_word: רֵאשִׁית הַגּוֹיִם
  choice: первейшего из народов
  rationale: Конструкция допускает оттенки первенства, главенства или превосходства. «Первейшего» сохраняет сжатость и оценочную неоднозначность оригинала.
- source_word: וּבָאוּ לָהֶם
  choice: к которым приходит
  rationale: Сжатая еврейская конструкция передана относительным оборотом, ясно связывающим приход дома Израиля с упомянутыми именитыми людьми, без добавления причины или цели прихода.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранено библейское национально-родовое выражение, а не заменено более общим «народ Израиля».
theological_decisions:
- issue: К кому обращено обличение при упоминании Сиона и Самарии
  choice: Текст прямо сохраняет оба центра и тем самым допускает обращение к беспечным влиятельным людям как Иудеи, так и северного Израиля.
  alternative: Считать адресатами только северных вождей, а Сион — риторическим либо текстуально спорным упоминанием.
  rationale: Параллельное построение еврейского текста естественно соединяет Сион и гору Самарии; перевод не сужает круг адресатов сверх сказанного в источнике.
- issue: Кого обозначает выражение «первейший из народов»
  choice: Референт оставлен в той же сжатой и не вполне определённой форме, что и в еврейском тексте.
  alternative: Явно отнести выражение к Израилю либо понимать его как характеристику избранных вождей среди главных народов.
  rationale: Еврейский синтаксис допускает разное соотнесение выражения; уточнение референта в основном тексте преждевременно разрешило бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой торжественности. Причастные обороты передают параллелизм оригинала; «именитым» понятно современному читателю и не звучит разговорно. Формула «дом Израиля» сохранена как значимое библейское выражение.
