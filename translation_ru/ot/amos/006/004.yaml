  - marker: b
    text: 'Или: «из стойла для откорма»; речь о животных, которых специально откармливали для богатого застолья.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁכְבִים
  choice: те, кто лежит
  rationale: Субстантивированное причастие продолжает начатое ранее описание тех, кому возвещено горе; настоящее время передаёт привычный образ жизни.
- source_word: מִטּוֹת שֵׁן
  choice: ложах из слоновой кости
  rationale: Сохраняет краткий образ еврейского текста; речь, вероятно, о роскошных ложах, отделанных слоновой костью, а не обязательно целиком изготовленных из неё.
- source_word: וּסְרֻחִים
  choice: и развалился
  rationale: Передаёт непринуждённо-роскошное, самодовольное расположение тела; форма согласована с русской конструкцией «те, кто».
- source_word: עַל עַרְשׂוֹתָם
  choice: на своих кушетках
  rationale: «Кушетки» естественно передают עֶרֶשׂ и позволяют сохранить отличие от уже упомянутых מִטּוֹת — «лож».
- source_word: וְאֹכְלִים
  choice: кто ест
  rationale: Настоящее время сохраняет характеристику постоянного, привычного поведения и параллелизм причастной цепочки.
- source_word: כָּרִים
  choice: ягнят
  rationale: Понятный современный эквивалент для молодых овец, отбираемых для пиршества; контекст сам указывает на изысканность пищи.
- source_word: מִצֹּאן
  choice: из стада
  rationale: Прямо сохраняет образ отбора животных из овечьего стада.
- source_word: וַעֲגָלִים
  choice: и телят
  rationale: Прямой и естественный русский эквивалент.
- source_word: מִתּוֹךְ מַרְבֵּק
  choice: из стойла
  rationale: Кратко передаёт место содержания скота; возможный оттенок специального откорма вынесен в примечание.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Ложа» и «кушетки» сохраняют различие двух еврейских существительных; «развалился» выражает осуждаемую праздную роскошь без дополнительного богословского истолкования. Конечное тире показывает продолжение предложения в следующем стихе.
