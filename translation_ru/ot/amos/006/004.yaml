  text: those who lie on beds of ivory and sprawl on their couches[b][a], and eat lambs from the flock and calves from the stall—
translation:
  language: ru
  text: те, кто лежат на ложах из слоновой кости и разваливаются на своих кушетках[a], кто ест ягнят из стада и телят из стойла[b], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «растягиваются» либо «нежатся на своих кушетках».'
