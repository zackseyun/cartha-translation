  text: הַ/יְרֻצ֤וּ/ן בַּ/סֶּ֨לַע֙ סוּסִ֔ים אִֽם יַחֲר֖וֹשׁ בַּ/בְּקָרִ֑ים כִּֽי הֲפַכְתֶּ֤ם לְ/רֹאשׁ֙ מִשְׁפָּ֔ט וּ/פְרִ֥י צְדָקָ֖ה לְ/לַעֲנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/012.yaml
  text: Do horses run on rock? Does one plow there with oxen? Yet you have turned justice into poison[c][b][a], and the fruit of righteousness into wormwood.
translation:
  language: ru
  text: Бегают ли кони по скале? Пашут ли там волами? А вы превратили правосудие в яд[a], а плод праведности[c] — в полынь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в горечь»; еврейское слово может обозначать ядовитое или горькое вещество либо растение.'
    reason: lexical_alternative
  - marker: b
    text: Полынь — растение с очень горьким вкусом; здесь это образ нравственного извращения и его горьких последствий.
    reason: cultural_note
  - marker: c
    text: 'Или: «плод справедливости»; еврейское слово может иметь как нравственный, так и общественно-правовой оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְרֻצוּן
  choice: Бегают ли
  rationale: Вопросительная форма с имперфектом выражает риторический вопрос о нелепом или невозможном; настоящее время естественно передаёт общеистинный, почти пословичный характер высказывания.
- source_word: בַּסֶּלַע
  choice: по скале
  rationale: סֶלַע означает скалу или каменистую поверхность; сочетание «по скале» сохраняет конкретный образ и естественно сочетается с глаголом движения.
- source_word: סוּסִים
  choice: кони
  rationale: Прямое соответствие множественному числу; «кони» уместно в возвышенной, но понятной пророческой речи.
- source_word: אִם יַחֲרוֹשׁ
  choice: Пашут ли
  rationale: אִם вводит второй параллельный риторический вопрос, а не обычное условие; неопределённо-личная форма по-русски естественно сохраняет отсутствие названного деятеля.
- source_word: בַּבְּקָרִים
  choice: волами
  rationale: בקר может обозначать крупный рогатый скот, но в контексте пахоты точнее и естественнее «волами».
- source_word: כִּי
  choice: А
  rationale: Здесь частица вводит обвинение, объясняющее применимость абсурдных сравнений. Противительно-сопоставительное «А» сохраняет резкий переход, не превращая связь в однозначно причинную.
- source_word: הֲפַכְתֶּם
  choice: вы превратили
  rationale: Перфект 2-го лица множественного числа передаёт совершённое действие с сохраняющимся результатом; русское прошедшее совершенного вида выражает это естественно.
- source_word: מִשְׁפָּט
  choice: правосудие
  rationale: В пророческом общественно-судебном контексте слово обозначает справедливый суд и установленный правовой порядок; «правосудие» передаёт этот публично-юридический оттенок.
- source_word: לְרֹאשׁ
  choice: в яд
  rationale: רֹאשׁ обозначает ядовитое или крайне горькое вещество либо растение. «Яд» ясно передаёт разрушительную силу метафоры; растительно-горький оттенок отмечен в сноске.
- source_word: וּפְרִי צְדָקָה
  choice: а плод праведности
  rationale: Сохраняется конкретная метафора плода. «Праведность» передаёт моральный смысл צְדָקָה, при этом возможный общественно-правовой оттенок указан в сноске.
- source_word: לְלַעֲנָה
  choice: в полынь
  rationale: לַעֲנָה — горькое растение, служащее образом нравственного извращения и горьких последствий; конкретный библейский образ сохранён.
theological_decisions:
- issue: Соотношение מִשְׁפָּט и צְדָקָה
  choice: «правосудие» и «праведность»
  alternative: «справедливость» и «правосудие» либо повтор близких юридических понятий
  rationale: Перевод сохраняет различие между публично-судебным מִשְׁפָּט и более широким нравственным צְדָקָה, не отрицая их смыслового пересечения; альтернативный юридический оттенок второго слова вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык с лаконичным пророческим ритмом. Два параллельных риторических вопроса сохранены; добавленное «там» естественно связывает пахоту со скалой, не вводя нового смыслового объекта. Конкретные образы яда, плода и полыни сохранены.
