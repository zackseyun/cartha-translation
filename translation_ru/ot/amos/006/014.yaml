id: AMO.6.14
reference: Amos 6:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֡י הִנְ/נִי֩ מֵקִ֨ים עֲלֵי/כֶ֜ם בֵּ֣ית יִשְׂרָאֵ֗ל נְאֻם יְהוָ֛ה אֱלֹהֵ֥י הַ/צְּבָא֖וֹת גּ֑וֹי וְ/לָחֲצ֥וּ אֶתְ/כֶ֛ם מִ/לְּב֥וֹא חֲמָ֖ת עַד נַ֥חַל הָ/עֲרָבָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/014.yaml
  text: For behold[a], I am raising up against you a nation, O house of Israel, declares Yahweh, the God of hosts[b], and they will oppress you from Lebo-hamath to the Wadi of the Arabah.
translation:
  language: ru
  text: Ибо вот, Я подниму против вас, дом Израиля, народ, — возвещает Яхве, Бог Воинств, — и он будет теснить вас от Лево-Хамата[a] до потока Аравы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от входа в Хамат». Еврейское выражение можно понимать как название места Лево-Хамат или как описательное обозначение границы.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «до русла Аравы». Еврейское слово может обозначать поток, речную долину или сезонно наполняющееся русло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Сохраняет причинно-пояснительную связь с предшествующим провозглашением суда.
- source_word: הִנְנִי
  choice: вот, Я
  rationale: Передаёт формулу привлечения внимания и близость объявленного Божьего действия в естественной пророческой речи.
- source_word: מֵקִים
  choice: подниму
  rationale: Каузативная форма от קום означает, что Бог вызовет народ к действию и выведет его против Израиля.
- source_word: עֲלֵיכֶם
  choice: против вас
  rationale: В военном и судебном контексте предлог имеет враждебную направленность.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет библейское собирательное обозначение народа и прямое обращение без искусственного междометия.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественно и понятно передаёт устойчивую пророческую формулу.
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: Бог Воинств
  rationale: Сохраняет возможную военную и небесно-космическую широту צבאות, не ограничивая выражение только земными армиями.
- source_word: גּוֹי
  choice: народ
  rationale: В контексте означает чужую национальную силу; «народ» естественно по-русски и не уточняет политическую форму этой силы.
- source_word: וְלָחֲצוּ
  choice: и он будет теснить вас
  rationale: Еврейское сказуемое стоит во множественном числе при собирательном גוי; русский единственный субъект «народ» требует единственного числа. «Теснить» сохраняет смысл сильного давления и военного притеснения.
- source_word: מִלְּבוֹא חֲמָת
  choice: от Лево-Хамата
  rationale: Передано как известное географическое название; неоднозначность между топонимом и описательным выражением отмечена в сноске.
- source_word: נַחַל הָעֲרָבָה
  choice: до потока Аравы
  rationale: נחל может обозначать русло или сезонный водоток; «поток» понятно широкому читателю, а Арава сохранена как название области.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация передаёт личное Божье имя и следует заявленному решению проекта, не подменяя его титулом.
- issue: Значение אֱלֹהֵי הַצְּבָאוֹת
  choice: Бог Воинств
  alternative: Бог Саваоф; Бог небесных воинств; Бог армий
  rationale: Формулировка сохраняет намеренную широту образа и не решает без достаточных оснований, имеются ли в виду земные армии, небесные силы или вся совокупность воинств.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сохраняет прямое обращение и вставную формулу Божьего речения; архаизмы сведены к умеренному «ибо», уместному для причинной связи и высокого регистра.
