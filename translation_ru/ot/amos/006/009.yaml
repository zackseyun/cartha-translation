  text: וְ/הָיָ֗ה אִם יִוָּ֨תְר֜וּ עֲשָׂרָ֧ה אֲנָשִׁ֛ים בְּ/בַ֥יִת אֶחָ֖ד וָ/מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/009.yaml
  text: And it will happen that if ten men remain in one house[a], they will die.
translation:
  language: ru
  text: 'И будет: если в одном доме останутся десять мужчин[a], они умрут.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут оставлены». Еврейский глагол означает, что кто-либо остался после того, как другие ушли или погибли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сочетание союза с формой היה вводит будущую ситуацию; краткая формула естественна для возвышенного повествовательного и пророческого регистра.
- source_word: אִם
  choice: если
  rationale: Частица естественнее всего вводит условие; перевод «когда» сделал бы выраженную синтаксисом определённость сильнее.
- source_word: יִוָּתְרוּ
  choice: останутся
  rationale: Нифаль глагола יתר означает «остаться, быть оставленным после ухода или гибели других». «Останутся» сохраняет лексическую широту и не добавляет идеи окончательного спасения.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: десять мужчин
  rationale: Существительное имеет явно мужское значение; «мужчин» точнее, чем нейтральное «человек».
- source_word: בְּבַיִת אֶחָד
  choice: в одном доме
  rationale: Прямой пространственный перевод сохраняет конкретный образ здания; «в одной семье» неоправданно сместило бы смысл к домочадцам.
- source_word: וָמֵתוּ
  choice: они умрут
  rationale: Форма продолжает описание будущего результата. Русское предложение ясно передаёт следствие без добавления отсутствующего в тексте пояснения.
