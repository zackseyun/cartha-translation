  text: you who put far away the evil day and bring near the seat of violence[a][b].
translation:
  language: ru
  text: Вы, отдаляющие день бедствия[a] и приближающие место насилия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «откладывающие день беды».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обитель насилия»; возможно также: «власть насилия» или «господство насилия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְנַדִּים
  choice: отдаляющие
  rationale: Причастная форма обращена к слушателям и выражает активное устранение или отодвигание; «отдаляющие» сохраняет пространственный образ и обвинительный тон.
- source_word: לְיוֹם רָע
  choice: день бедствия
  rationale: Выражение обозначает грядущий день беды или суда. «День бедствия» естественно звучит по-русски и не ограничивает смысл только нравственным злом.
- source_word: וַתַּגִּישׁוּן
  choice: и приближающие
  rationale: Каузативная форма от נגשׁ означает «приближать». Параллель «отдаляющие — приближающие» передаёт резкую иронию оригинала.
- source_word: שֶׁבֶת
  choice: престол
  rationale: В данном сочетании слово может обозначать место пребывания, сиденье или средоточие власти. «Престол» ёмко передаёт образ утвердившегося господства, при этом другие возможности отмечены в сноске.
- source_word: חָמָס
  choice: насилие
  rationale: חָמָס обозначает насилие, жестокое беззаконие или угнетение; «насилие» — наиболее прямой и подходящий к контексту Амоса эквивалент.
theological_decisions:
- issue: Ироническая связь между днём бедствия и престолом насилия
  choice: 'Сохранить сжатое противопоставление: адресаты отдаляют день бедствия, но приближают установление насилия.'
  alternative: Они считают, что откладывают суд, но своими действиями приближают день насильственного возмездия.
  rationale: Еврейский текст не уточняет однозначно, означает ли вторая половина общественное господство насилия или бедствие, которое оно навлекает. Перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с пророческой торжественностью. Причастная конструкция сохраняет прямое обличение и симметрию еврейской строки; восклицательный знак передаёт её обвинительный характер.
