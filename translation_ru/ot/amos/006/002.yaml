source:
  edition: WLC
  text: עִבְר֤וּ כַֽלְנֵה֙ וּ/רְא֔וּ וּ/לְכ֥וּ מִ/שָּׁ֖ם חֲמַ֣ת רַבָּ֑ה וּ/רְד֣וּ גַת פְּלִשְׁתּ֗ים הֲ/טוֹבִים֙ מִן הַ/מַּמְלָכ֣וֹת הָ/אֵ֔לֶּה אִם רַ֥ב גְּבוּלָ֖/ם מִ/גְּבֻלְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/002.yaml
  text: Cross over to Calneh and see[a]; and from there go to Hamath the great; then go down to Gath of the Philistines[b]. Are they better than these kingdoms? Or is their territory greater than your territory?
translation:
  language: ru
  text: Перейдите в Калне[b] и посмотрите; и оттуда идите в великий Хамат, затем спуститесь в Гат филистимлян. Лучше ли они, чем эти царства?[a] Или их территория больше вашей?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Разве вы лучше этих царств?» В еврейском тексте у слова «лучше» нет явно названного подлежащего, поэтому речь может идти либо о перечисленных городах и царствах, либо о людях, к которым обращён пророк.'
    reason: alternative_reading
  - marker: b
    text: Калне — название города. Его связывают с разными местами в Северной Сирии или Месопотамии, но точное отождествление остаётся неясным.
    reason: cultural_note
lexical_decisions:
- source_word: עִבְרוּ
  choice: Перейдите
  rationale: Повелительная форма глагола עבר обозначает переход или движение через некоторое пространство; «перейдите» естественно передаёт направленное движение.
- source_word: כַלְנֵה
  choice: Калне
  rationale: Географическое название передано транслитерацией; точное местоположение города остаётся спорным.
- source_word: וּרְאוּ
  choice: и посмотрите
  rationale: Повелительная форма ראה прямо призывает адресатов осмотреть названное место.
- source_word: וּלְכוּ מִשָּׁם
  choice: оттуда идите
  rationale: Передана последовательность движения и исходная точка, выраженная מִשָּׁם.
- source_word: חֲמַת רַבָּה
  choice: Хамат Великий
  rationale: Название транслитерировано, а определение רַבָּה («великий, большой») переведено и согласовано с традиционным русским родом топонима.
- source_word: וּרְדוּ
  choice: затем спуститесь
  rationale: Глагол ירד обозначает движение вниз; «затем» естественно выражает последовательность повелений.
- source_word: גַת פְּלִשְׁתִּים
  choice: Гат филистимлян
  rationale: Конструкция принадлежности буквально связывает город Гат с филистимлянами.
- source_word: הֲטוֹבִים מִן הַמַּמְלָכוֹת הָאֵלֶּה
  choice: Лучше ли они, чем эти царства?
  rationale: Сравнительное значение מן передано оборотом «чем»; местоимение «они» восполняет отсутствующее в еврейском тексте явное подлежащее, при этом альтернативное понимание отмечено в сноске.
- source_word: אִם
  choice: Или
  rationale: В паре риторических вопросов אִם вводит вторую альтернативу.
- source_word: רַב גְּבוּלָם מִגְּבֻלְכֶם
  choice: их территория больше вашей
  rationale: גְּבוּל здесь означает не только пограничную линию, но и территориальные владения; сравнительная конструкция передана естественным современным русским языком.
theological_decisions:
- issue: Неявное подлежащее при הֲטוֹבִים
  choice: 'В основном тексте подлежащим названы ранее упомянутые города или царства: «они».'
  alternative: 'Вопрос может быть обращён непосредственно к адресатам: «Разве вы лучше этих царств?»'
  rationale: Прилагательное мужского рода во множественном числе употреблено без выраженного подлежащего. Ближайший контекст поддерживает отсылку к названным политическим центрам, однако грамматика допускает отсылку к слушателям, поэтому неоднозначность не устраняется молча.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной риторикой пророческой речи. Повеления переданы последовательно и без архаизмов; географические названия сохранены, а подлинная синтаксическая неоднозначность отмечена сноской.
