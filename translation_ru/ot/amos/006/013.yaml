  text: you who rejoice over nothing[a], who say[b], “Have we not by our own strength taken horns for ourselves?”
translation:
  language: ru
  text: 'вы, радующиеся ничтожному[a], говорите: «Разве не своей силой мы приобрели себе рога[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение, переведённое как «ничтожному», может также перекликаться с названием города Ло-Девар, создавая игру слов: ликование связано с городом, название которого созвучно словам «ничто» или «не вещь».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «Разве не своей силой мы приобрели себе Карнаим?» Еврейское слово, переведённое как «рога», может одновременно отсылать к названию города Карнаим; это, вероятно, игра слов, связывающая военную силу с завоеванием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: вы, радующиеся
  rationale: Причастие мужского рода множественного числа продолжает прямое обличительное обращение; местоимение «вы» ясно передаёт его адресный характер.
- source_word: לְלֹא דָבָר
  choice: ничтожеству
  rationale: Буквально выражение означает «тому, что ничто / не вещь». «Ничтожество» сохраняет обвинение в пустоте и малоценности предмета ликования, не устраняя возможной игры с названием Ло-Девар.
- source_word: הָאֹמְרִים
  choice: которые говорят
  rationale: Второе причастие параллельно первому и вводит хвастливые слова адресатов.
- source_word: הֲלוֹא
  choice: Не ... ли
  rationale: Передаёт риторический вопрос, предполагающий самоуверенный утвердительный ответ.
- source_word: בְחָזְקֵנוּ
  choice: своей силой
  rationale: Передаёт существительное «сила, мощь» с местоименным суффиксом первого лица множественного числа и подчёркивает самонадеянность говорящих.
- source_word: לָקַחְנוּ
  choice: приобрели
  rationale: Глагол רחב по смыслу охватывает взятие, получение или приобретение. Здесь «приобрели» естественно сочетается с «себе» и не исключает военного захвата, важного для возможной игры слов.
- source_word: קַרְנָיִם
  choice: рога
  rationale: Форма означает «рога» и служит образом силы; одновременно она может отсылать к названию Карнаим. Основной текст сохраняет буквальный образ, а примечание — географическую игру слов.
