source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה יְהוָה֙ מְצַוֶּ֔ה וְ/הִכָּ֛ה הַ/בַּ֥יִת הַ/גָּד֖וֹל רְסִיסִ֑ים וְ/הַ/בַּ֥יִת הַ/קָּטֹ֖ן בְּקִעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/011.yaml
  text: For behold[a], Yahweh commands, and the great house will be struck into fragments, and the small house into pieces.
translation:
  language: ru
  text: 'Ибо вот, Яхве повелевает: большой дом будет разбит вдребезги, а малый — расколот на части[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «и он поразит большой дом, превратив его в обломки, а малый дом — в трещины, расколы или части». В еврейском тексте глагол стоит в активной форме; непосредственный исполнитель удара не назван явно.'
    reason: Уточняет активную форму וְהִכָּה и передаёт возможные значения בְּקִעִים; анкер относится к обоим образам разрушения.
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Ибо вот
  rationale: כִּי связывает стих с предшествующим как объяснение или основание, а הִנֵּה привлекает внимание к близкому и неотвратимому действию. Сочетание «ибо вот» сохраняет пророческую выразительность и логическую связь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, прямо стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: מְצַוֶּה
  choice: повелевает
  rationale: Причастие выражает властное и актуальное распоряжение; настоящее время по-русски естественно передаёт близость и несомненность действия.
- source_word: וְהִכָּה
  choice: будет разбит / расколот
  rationale: Еврейский глагол имеет активную форму 3-го лица мужского рода, но непосредственный исполнитель удара явно не назван. Русская страдательная конструкция сохраняет результат Божьего повеления, не уточняя исполнителя сверх текста.
- source_word: הַבַּיִת הַגָּדוֹל
  choice: большой дом
  rationale: «Дом» сохраняет прямое значение существительного, а «большой» может указывать как на размер, так и на значительность, не сужая смысл до дворца.
- source_word: רְסִיסִים
  choice: вдребезги
  rationale: Передаёт разрушение на множество мелких обломков и естественно звучит в современном русском языке.
- source_word: הַבַּיִת הַקָּטֹן
  choice: малый
  rationale: Сохраняет параллельное противопоставление большому дому; повтор слова «дом» допустимо опустить по нормам русского синтаксиса без потери смысла.
- source_word: בְּקִעִים
  choice: расколот на части
  rationale: Слово обозначает трещины, расколы или отделившиеся части. Перевод сохраняет образ разрушительного раскалывания и отличие от רְסִיסִים.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не подменяет его титулом.
- issue: Кто наносит удар в וְהִכָּה
  choice: Исполнитель не назван; дома описаны как подвергающиеся разрушению
  alternative: Яхве сам поразит дома; некий посланник поразит дома
  rationale: Форма глагола активна, однако после слов о повелении Яхве синтаксис не позволяет с полной уверенностью определить непосредственного исполнителя. Страдательная конструкция сохраняет эту неопределённость, одновременно оставляя суд следствием повеления Яхве.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. «Ибо вот» сохраняет риторическую силу оригинала; остальная фраза ясна обычному читателю. Двоеточие естественно связывает Божье повеление с последующим разрушением.
