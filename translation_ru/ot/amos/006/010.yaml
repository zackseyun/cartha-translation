  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: родственник (дядя) и «тот, кто сжигает его», вынесение костей из дома, человек во внутренней/отдалённой части дома, вопрос о том, остался ли кто-либо, ответ אָפֶס («Никого»), призыв к молчанию и запретительное/необходимостное по смыслу выражение о произнесении имени Яхве. Необычность образа сожжения сохранена без неоправданного толкования.'
