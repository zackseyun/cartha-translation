source:
  edition: WLC
  text: וּ/נְשָׂא֞/וֹ דּוֹד֣/וֹ וּ/מְסָרְפ֗/וֹ לְ/הוֹצִ֣יא עֲצָמִים֮ מִן הַ/בַּיִת֒ וְ/אָמַ֞ר לַ/אֲשֶׁ֨ר בְּ/יַרְכְּתֵ֥י הַ/בַּ֛יִת הַ/ע֥וֹד עִמָּ֖/ךְ וְ/אָמַ֣ר אָ֑פֶס וְ/אָמַ֣ר הָ֔ס כִּ֛י לֹ֥א לְ/הַזְכִּ֖יר בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/010.yaml
  text: Then his uncle[a], the one who burns him, will carry him out to bring the bones out of the house, and he will say to the one who is in the innermost part of the house, “Is there still anyone with you?” And he will say, “No one.” Then he will say[c][b], “Hush! For we must not mention the name of Yahweh.”
translation:
  language: ru
  text: 'И понесёт его дядя[a], тот, кто сжигает его[b], чтобы вынести кости из дома. Он спросит того, кто находится в глубине дома: «Есть ли ещё кто-нибудь с тобой?» Тот ответит: «Никого». Тогда он скажет: «Тише! Ведь нельзя упоминать имя Яхве»[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его родственник». Еврейское слово может обозначать близкого родственника-мужчину, хотя здесь вероятно значение «дядя».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тот, кто сжигает его». Необычное выражение, возможно, указывает на сжигание, связанное с удалением тел во время суда.'
    reason: cultural_note
  - marker: c
    text: 'Или: «Не упоминай имени Яхве». Краткое еврейское выражение можно понять и как прямой запрет, и как указание на необходимость этого не делать.'
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: его дядя
  rationale: В контексте обязанности вынести тело דּוֹד обозначает близкого родственника-мужчину; «дядя» передаёт наиболее вероятное конкретное значение, а более широкая возможность отмечена в сноске.
- source_word: וּמְסָרְפוֹ
  choice: тот, кто сжигает его
  rationale: Причастие от שׂרף прямо связано со сжиганием. Необычный образ сохранён без замены на более общее «готовит к погребению».
- source_word: לְהוֹצִיא עֲצָמִים
  choice: чтобы вынести кости
  rationale: עֲצָמִים буквально означает «кости»; конкретный образ сохранён.
- source_word: בְּיַרְכְּתֵי הַבַּיִת
  choice: в глубине дома
  rationale: Выражение указывает на удалённую внутреннюю часть дома; этот перевод естественен по-русски и сохраняет пространственный смысл.
- source_word: הַעוֹד עִמָּךְ
  choice: Есть ли ещё кто-нибудь с тобой?
  rationale: Вопрос эллиптически выясняет, остался ли рядом ещё человек; «кто-нибудь» необходимо для естественного русского синтаксиса.
- source_word: אָפֶס
  choice: Никого
  rationale: Краткое отрицание в данном диалоге означает, что больше никого нет.
- source_word: הָס
  choice: Тише!
  rationale: Резкое междометие требует молчания и передаёт тревожный тон сцены.
- source_word: לֹא לְהַזְכִּיר בְּשֵׁם יְהוָה
  choice: нельзя упоминать имя Яхве
  rationale: Эллиптическая инфинитивная конструкция выражает запрет или необходимость воздержаться; безличное «нельзя» сохраняет эту сжатость, не уточняя основание запрета.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, а не заменяющий его титул.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; транслитерация сохраняет личное имя.
- issue: Сила выражения כִּי לֹא לְהַזְכִּיר בְּשֵׁם יְהוָה
  choice: Ведь нельзя упоминать имя Яхве
  alternative: Не упоминай имени Яхве; имя Яхве не должно быть упомянуто
  rationale: Еврейская формулировка кратка и допускает понимание как прямого запрета либо как утверждения о необходимости молчать. Безличная конструкция сохраняет эту напряжённость и не добавляет причины.
translation_notes:
  register: Современный литературный русский язык с краткими, напряжёнными репликами. Конкретные и необычные образы еврейского текста сохранены; синтаксис слегка разгружен делением на предложения ради ясности.
