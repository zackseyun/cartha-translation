  yaml_path: translation/ot/amos/006/005.yaml
  text: who strum on the mouth of the harp, and like David invent for themselves instruments of song—
translation:
  language: ru
  text: вы, перебирающие струны арфы и, подобно Давиду, изобретающие для себя музыкальные инструменты, —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפֹּרְטִים
  choice: бренчащие
  rationale: Причастие от פרט здесь обозначает игру перебором струн; «бренчащие» естественно передаёт как действие, так и неодобрительный тон пророческого контекста.
- source_word: עַל־פִּי הַנָּבֶל
  choice: под звуки арфы
  rationale: Буквально «при устах/звуке נבל». Оборот עַל־פִּי передаёт сопровождение или звучание; «под звуки» по-русски естественнее буквального «на устах». נבל — струнный инструмент, здесь традиционно и понятно передан как «арфа».
- source_word: חָשְׁבוּ לָהֶם
  choice: придумывающие себе
  rationale: חשב может означать «задумывать, изобретать, придумывать»; выражение сохраняет направленность действия на самих участников пира.
- source_word: כְּלֵי שִׁיר
  choice: музыкальные инструменты
  rationale: Буквально «инструменты песни/музыки»; современное русское выражение ясно передаёт смысл.
theological_decisions:
- issue: Сопоставление с Давидом
  choice: подобно Давиду
  alternative: как Давид
  rationale: Сохранено прямое сравнение без уточнения, одобряет ли пророк музыкальное творчество Давида или иронически обличает подражающих ему беспечных вельмож; это определяется контекстом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Начальное «вы» поддерживает обращение, продолжающее перечень в Ам 6:4–6; финальное тире показывает незавершённость синтаксической цепи.
