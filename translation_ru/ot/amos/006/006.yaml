  text: הַ/שֹּׁתִ֤ים בְּ/מִזְרְקֵי֙ יַ֔יִן וְ/רֵאשִׁ֥ית שְׁמָנִ֖ים יִמְשָׁ֑חוּ וְ/לֹ֥א נֶחְל֖וּ עַל שֵׁ֥בֶר יוֹסֵֽף־
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/006.yaml
  text: who drink wine from bowls and anoint themselves with the finest oils[b][a], but are not grieved over the ruin of Joseph—
translation:
  language: ru
  text: 'те, кто пьют вино из чаш

    и умащают себя лучшими маслами[a],

    но не скорбят[c] о бедствии Иосифа[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отборными маслами»; буквально: «первыми из масел».'
    reason: lexical_alternative
  - marker: b
    text: «Иосиф» здесь — поэтическое обозначение народа Израиля, особенно северного царства.
    reason: cultural_note
  - marker: c
    text: Буквально глагол может означать, что они не слабеют или не заболевают от горя.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁתִים
  choice: те, кто пьют
  rationale: Причастие с артиклем продолжает начатое ранее описание людей, которым возвещено горе; относительная конструкция естественна по-русски.
- source_word: בְּמִזְרְקֵי יַיִן
  choice: пьют вино из чаш
  rationale: מִזְרָק обозначает чашу или сосуд, нередко крупный и употребляемый в культовом контексте. «Из чаш» сохраняет образ расточительного пиршества, не добавляя прямо не выраженного определения.
- source_word: וְרֵאשִׁית שְׁמָנִים
  choice: лучшими маслами
  rationale: רֵאשִׁית буквально означает «начало, первое, главное», а здесь — отборную, лучшую часть. Такой перевод естественно передаёт роскошь и сохраняет смысл еврейского оборота.
- source_word: יִמְשָׁחוּ
  choice: умащают себя
  rationale: Глагол משׁח означает «мазать, помазывать». В данном контексте речь идёт не о ритуальном посвящении, а о щедром употреблении масла для ухода за собой; возвратное значение выражено явно.
- source_word: וְלֹא נֶחְלוּ
  choice: но не скорбят
  rationale: Нифаль глагола חלה может означать физическую слабость или болезнь, а здесь образно передаёт мучительную боль и скорбь. Основной текст выражает нравственно-эмоциональный смысл, а буквальный оттенок отмечен в сноске.
- source_word: עַל שֵׁבֶר יוֹסֵף
  choice: о гибели Иосифа
  rationale: שֵׁבֶר буквально означает «разлом, сокрушение» и употребляется о бедствии, крушении или гибели. «Гибель» естественно передаёт масштаб катастрофы, сохраняя пророческую силу образа.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Собственное имя сохранено как в еврейском тексте; его поэтический собирательный смысл поясняется в сноске, а не заменяется толкованием в основном тексте.
theological_decisions:
- issue: Метафорическое употребление имени «Иосиф»
  choice: Сохранить «Иосиф» в основном тексте как поэтическое обозначение народа Израиля, прежде всего северного царства.
  alternative: 'Передать истолковательно: «Израиля» или «дома Иосифа».'
  rationale: Сохранение имени удерживает пророческий образ и межплеменные, заветные ассоциации исходного текста, не сужая их скрытым толкованием.
- issue: Эмоциональный и телесный оттенки וְלֹא נֶחְלוּ
  choice: В основном тексте передать «не скорбят», сохранив телесный образ в сноске.
  alternative: Перевести буквально «не изнемогают» или «не заболевают».
  rationale: Контекст обличает равнодушие к бедствию народа, однако необычная глагольная форма сохраняет образ скорби, от которой человек слабеет или заболевает; сноска удерживает эту смысловую напряжённость.
translation_notes:
  register: 'Современный литературный русский язык с кратким пророческим ритмом. Сохранены синтаксическая незавершённость отрывка и конечное тире, поскольку стих продолжает описание из предыдущего контекста. Лексика dignified, но понятная: «умащают» сохраняет библейскую образность без ритуализации контекста.'
