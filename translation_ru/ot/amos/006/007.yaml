- source_word: לָכֵן עַתָּה
  choice: Поэтому теперь
  rationale: Сохраняет причинно-следственную связь с предшествующим обличением и временной акцент близкого суда.
- source_word: יִגְלוּ בְּרֹאשׁ גֹּלִים
  choice: они первыми пойдут в изгнание среди изгнанников
  rationale: 'Передаёт игру однокоренных форм גלה и смысл בְּרֹאשׁ как первенства: прежде занимавшие первое место первыми будут уведены.'
- source_word: וְסָר
  choice: и прекратится
  rationale: В контексте пира глагол סור означает удаление или прекращение; русский глагол ясно и естественно передаёт конец празднества.
- source_word: מִרְזַח
  choice: пиршество
  rationale: Слово обозначает пирующее собрание или разгульный пир; «пиршество» сохраняет предметный смысл и обличительный контекст без излишнего усиления.
- source_word: סְרוּחִים
  choice: возлежащих
  rationale: Причастие отсылает к праздно растянувшимся на ложах в предыдущем стихе; «возлежащих» сохраняет эту связь и уместно для сцены пира.
