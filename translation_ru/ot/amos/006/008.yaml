  text: נִשְׁבַּע֩ אֲדֹנָ֨/י יְהוִ֜ה בְּ/נַפְשׁ֗/וֹ נְאֻם יְהוָה֙ אֱלֹהֵ֣י צְבָא֔וֹת מְתָאֵ֤ב אָֽנֹכִי֙ אֶת גְּא֣וֹן יַֽעֲקֹ֔ב וְ/אַרְמְנֹתָ֖י/ו שָׂנֵ֑אתִי וְ/הִסְגַּרְתִּ֖י עִ֥יר וּ/מְלֹאָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/008.yaml
  text: 'The Lord GOD has sworn by himself—oracle of Yahweh[a], the God of Armies: I abhor the pride of Jacob, and I hate his citadels[c][b]; and I will hand over the city and all that fills it.'
translation:
  language: ru
  text: 'Владыка Яхве поклялся Самим Собой — таково слово Яхве, Бога Воинств[c]:


    «Я гнушаюсь гордыней Иакова[a]

    и ненавижу его дворцы[b].

    Я отдам город

    и всё, что его наполняет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «величия Иакова». Еврейское слово может обозначать как возвышенное величие, так и надменную гордость; контекст суда указывает скорее на отрицательный смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «цитадели». Еврейское слово может обозначать дворцы, в том числе укреплённые дворцовые сооружения.'
    reason: lexical_alternative
  - marker: c
    text: 'Традиционно: «Бога Саваофа». Еврейское צְבָאוֹת означает «воинства» или «армии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Сочетание сохраняет различие между титулом אֲדֹנָי и личным именем יהוה. «Владыка» звучит весомо и естественно по-русски, не создавая неуклюжего повтора «Господь Господь».
- source_word: נִשְׁבַּע ... בְּנַפְשׁוֹ
  choice: поклялся Самим Собой
  rationale: Буквально речь идёт о клятве «своей душой/жизнью», но это еврейская идиома клятвы самим собой. Русская формулировка передаёт смысл и торжественность самообязующей клятвы.
- source_word: נְאֻם יְהוָה
  choice: таково слово Яхве
  rationale: Пророческая формула נְאֻם обозначает торжественное изречение или возвещение. Выбранная формулировка естественна в современном литературном русском и сохраняет её весомость.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Бога Воинств
  rationale: צְבָאוֹת означает «воинства, армии». Перевод сохраняет образ Божьего верховного владычества над небесными и земными силами; традиционный вариант отмечен в сноске.
- source_word: מְתָאֵב
  choice: Я гнушаюсь
  rationale: Причастная форма выражает сильное и устойчивое отвращение. «Гнушаюсь» точно передаёт эту силу, оставаясь понятным и достойным по стилю.
- source_word: גְּאוֹן יַעֲקֹב
  choice: гордыни Иакова
  rationale: גָּאוֹן допускает значения как надменной гордости, так и величия. В контексте суда и отвращения вероятнее отрицательное значение, а реальная неоднозначность сохранена в сноске.
- source_word: אַרְמְנֹתָיו
  choice: его дворцы-крепости
  rationale: אַרְמוֹן может обозначать дворец, укреплённый дворцовый комплекс или цитадель. Составное обозначение передаёт одновременно роскошь и оборонительный характер этих сооружений.
- source_word: וְהִסְגַּרְתִּי
  choice: Я предам
  rationale: Hiphil от סגר в контексте суда означает отдать или предать город во власть неприятеля. Простой союз не превращён в явно причинную связку.
- source_word: עִיר וּמְלֹאָהּ
  choice: город со всем, что его наполняет
  rationale: 'Формулировка близко передаёт собирательное מְלֹא — всё находящееся в городе: жителей, имущество и богатства, — не сужая его значения.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом. Это также позволяет ясно воспроизвести сочетание אֲדֹנָי יְהוִה как «Владыка Яхве».
- issue: Значение גְּאוֹן יַעֲקֹב
  choice: гордыня Иакова
  alternative: величие Иакова
  rationale: Контекст осуждения и параллель с ненавистью к укреплённым дворцам поддерживает отрицательный смысл, однако положительное значение лексемы возможно и вынесено в сноску.
- issue: Объём выражения עִיר וּמְלֹאָהּ
  choice: город со всем, что его наполняет
  alternative: город и всё, что в нём
  rationale: Более буквальная образность не определяет искусственно, идёт ли речь только о жителях, имуществе либо обо всём вместе.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис остаётся ясным для обычного читателя; переносы строк подчёркивают структуру судебного изречения. Архаизмы сведены к минимуму, а неоднозначные образы исходного текста не сужены без сносок.
