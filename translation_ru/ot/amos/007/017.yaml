base_translation:
  language: en
  yaml_path: translation/ot/amos/007/017.yaml
  text: 'Therefore[a], this is what Yahweh says: ‘Your wife will prostitute herself in the city, and your sons and your daughters will fall by the sword, and your land will be divided by measuring line; and you yourself will die on unclean land[c][b], and Israel will surely go into exile from its land.’'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве: «Твоя жена будет заниматься проституцией[a] в городе, твои сыновья и дочери падут от меча, твою землю разделят мерной верёвкой[b]; а ты сам умрёшь на нечистой земле, и Израиль непременно уйдёт в изгнание со своей земли[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет блудодействовать». Еврейский глагол не уточняет обстоятельств, при которых это произойдёт.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будет разделена верёвкой» — то есть мерной верёвкой, которой отмеряли участки земли.'
    reason: lexical_alternative
  - marker: c
    text: Еврейская конструкция с повторением глагольной основы подчёркивает несомненность изгнания.
    reason: source_emphasis
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и судебное следствие противодействия Амасии.
- source_word: כֹּה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохраняет традиционную пророческую формулу в естественном современном русском языке и передаёт личное имя יהוה как «Яхве».
- source_word: תִּזְנֶה
  choice: станет блудницей
  rationale: Глагол זנה обозначает занятие проституцией или блуд; формулировка сохраняет резкость пророческого приговора и естественно звучит по-русски.
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: твои сыновья и дочери
  rationale: Сохраняется явное упоминание обеих групп без обобщения словом «дети».
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: падут от меча
  rationale: Сохраняет распространённую библейскую идиому насильственной смерти на войне.
- source_word: בַּחֶבֶל תְּחֻלָּק
  choice: разделят мерной верёвкой
  rationale: חבל здесь обозначает шнур или верёвку для измерения и распределения захваченной земли; русский пассив естественно преобразован в неопределённо-личную конструкцию.
- source_word: וְאַתָּה
  choice: а ты сам
  rationale: Слово «сам» отражает подчёркнутое отдельным местоимением обращение к Амасии; союз «а» естественно передаёт переход к его личной участи.
- source_word: עַל אֲדָמָה טְמֵאָה
  choice: на нечистой земле
  rationale: Близко передаёт предлог עַל и сохраняет ритуально-богословскую характеристику чужой земли без её истолкования в основном тексте.
- source_word: גָּלֹה יִגְלֶה
  choice: непременно будет изгнан
  rationale: Сочетание абсолютного инфинитива с личной формой глагола выражает усиление и несомненность изгнания.
- source_word: מֵעַל אַדְמָתוֹ
  choice: со своей земли
  rationale: Естественно и точно передаёт удаление Израиля с принадлежащей ему земли.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация «Яхве» сохраняет личное заветное имя в соответствии с проектным решением и не заменяет его титулом.
- issue: Смысл выражения «нечистая земля»
  choice: Сохранить буквальное «на нечистой земле»
  alternative: На чужой земле; в земле язычников
  rationale: В контексте, вероятно, имеется в виду чужая земля изгнания, воспринимаемая как ритуально нечистая, однако основной текст не устраняет заложенную в еврейском выражении богословскую напряжённость.
- issue: Характер участи жены Амасии
  choice: станет блудницей
  alternative: будет блудодействовать; будет вынуждена заниматься проституцией
  rationale: Еврейский текст утверждает факт, но прямо не уточняет, добровольно ли это произойдёт или вследствие завоевания и нужды; перевод не добавляет причины.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранены резкость судебного пророчества, библейская идиома «падут от меча» и богословски значимое выражение «нечистая земля»; синтаксис сделан естественным для современного читателя.
