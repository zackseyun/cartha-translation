  text: וּ/בֵֽית אֵ֔ל לֹֽא תוֹסִ֥יף ע֖וֹד לְ/הִנָּבֵ֑א כִּ֤י מִקְדַּשׁ מֶ֨לֶךְ֙ ה֔וּא וּ/בֵ֥ית מַמְלָכָ֖ה הֽוּא־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/013.yaml
  text: But at Bethel you must not prophesy any longer[a], for it is the king’s sanctuary[b], and it is a royal house.
translation:
  language: ru
  text: Но в Вефиле больше не пророчествуй[a], потому что это святилище царя и царский дом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не пророчествуй снова»; еврейское выражение буквально означает «не добавляй больше пророчествовать».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дом царства». Вероятно, Вефиль назван учреждением, связанным с царской властью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֵֽית אֵ֔ל
  choice: Но в Вефиле
  rationale: 'Союз ו продолжает речь Амасии, но после повеления уйти в Иудею естественно получает противительный оттенок: «но». Предлог ב передаёт местное значение: «в Вефиле».'
- source_word: לֹֽא תוֹסִ֥יף ע֖וֹד לְ/הִנָּבֵ֑א
  choice: больше не пророчествуй
  rationale: Сочетание יסף в породе hифиль с עוד и инфинитивом выражает прекращение дальнейшего или повторного действия. Русское «больше не пророчествуй» естественно передаёт запрет, не устраняя возможного оттенка «снова».
- source_word: כִּ֤י
  choice: потому что
  rationale: Вводит основание запрета; «потому что» ясно и естественно связывает обе части высказывания.
- source_word: מִקְדַּשׁ מֶ֨לֶךְ֙
  choice: святилище царя
  rationale: Конструкция сопряжённого состояния прямо указывает на принадлежность или тесную связь святилища с царём. Формулировка сохраняет как религиозный, так и политический смысл.
- source_word: וּ/בֵ֥ית מַמְלָכָ֖ה
  choice: и царский дом
  rationale: Буквально — «дом царства/царской власти». «Царский дом» сохраняет метафору и институционально-политический оттенок, не вводя более узкого толкования «государственный храм».
- source_word: הוּא ... הוּא
  choice: это ... [и] ...
  rationale: В русском единая связочная конструкция с двумя именными частями сказуемого звучит естественнее буквального повтора «это ... и это ...»; смысл обеих подчёркнутых характеристик Вефиля сохранён.
theological_decisions:
- issue: Характер названий Вефиля в речи Амасии
  choice: Передать слова описательно как «святилище царя» и «царский дом», не выражая одобрения законности совершаемого там поклонения.
  alternative: «царское святилище» и «дом царства» либо более толковательное «государственный храм»
  rationale: Текст сообщает политико-религиозное обоснование Амасии, а не даёт богословскую оценку Вефиля. Выбранный перевод сохраняет заявление персонажа и не привносит конфессионального вывода.
translation_notes:
  register: Современный литературный русский язык; речь краткая, властная и достойная по тону. «Вефиль» соответствует принятой русской библейской передаче топонима. Подлинная неоднозначность выражений о повторном пророчестве и «доме царства» вынесена в сноски.
