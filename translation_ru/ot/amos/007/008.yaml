  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י מָֽה אַתָּ֤ה רֹאֶה֙ עָמ֔וֹס וָ/אֹמַ֖ר אֲנָ֑ךְ וַ/יֹּ֣אמֶר אֲדֹנָ֗/י הִנְ/נִ֨י שָׂ֤ם אֲנָךְ֙ בְּ/קֶ֨רֶב֙ עַמִּ֣/י יִשְׂרָאֵ֔ל לֹֽא אוֹסִ֥יף ע֖וֹד עֲב֥וֹר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/008.yaml
  text: And Yahweh said to me[a], “What do you see, Amos?” And I said, “A plumb line.” Then the Lord said, “Look, I am setting a plumb line in the midst of my people Israel[b]; I will not again pass by them.”
translation:
  language: ru
  text: 'И сказал мне Яхве: «Что ты видишь, Амос?» Я ответил: «Отвес[a]». Тогда Господь сказал: «Вот, Я устанавливаю отвес посреди Моего народа Израиля; больше Я не стану проходить мимо него[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «олово», «свинец» или «грузик отвеса». Точное значение еврейского слова неясно; вероятно, оно обозначает измерительный инструмент либо связанный с ним материал.'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение «больше не стану проходить мимо него», вероятно, означает: «больше не буду щадить его» или «больше не буду оставлять его грех без наказания».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога и сохраняет его отличие от титула אֲדֹנָי далее в стихе.
- source_word: מָה אַתָּה רֹאֶה
  choice: Что ты видишь
  rationale: Естественный русский вопрос в настоящем времени, соответствующий причастной форме רֹאֶה в контексте видения.
- source_word: אֲנָךְ
  choice: отвес
  rationale: В контексте Ам 7:7–8 речь, вероятнее всего, идёт об инструменте для проверки вертикальности; точное лексическое значение спорно, поэтому альтернативы указаны в сноске.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Естественно передаёт обращённый к Богу титул и при этом отличается от личного имени Яхве в первой части стиха.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сохраняет указательно-привлекающую внимание силу выражения без архаического русского оборота.
- source_word: שָׂם
  choice: устанавливаю
  rationale: Передаёт причастную форму как происходящее действие и хорошо сочетается с образом отвеса как мерила.
- source_word: בְּקֶרֶב
  choice: посреди
  rationale: Сохраняет пространственный образ помещения отвеса внутрь самого народа Израиля.
- source_word: לֹא אוֹסִיף עוֹד עֲבוֹר לוֹ
  choice: больше Я не стану проходить мимо него
  rationale: Сохраняет образный еврейский оборот, не подменяя его сразу толкованием «щадить»; местоимение оставлено в единственном числе в соответствии с собирательным «народом» и формой суффикса לוֹ.
theological_decisions:
- issue: Различение имени и титула Бога
  choice: יְהוָה передано как «Яхве», а אֲדֹנָי — как «Господь»
  alternative: Передать оба слова как «Господь»
  rationale: Различение сохраняет нюанс исходного текста, где употреблены личное имя и отдельный титул.
- issue: Смысл выражения о прохождении мимо
  choice: Сохранить в основном тексте образ «не стану проходить мимо»
  alternative: «Больше не буду щадить его» или «больше не буду закрывать глаза на его грех»
  rationale: Контекст указывает на прекращение долготерпения и наступление суда, однако буквальный образ допускает смысловую напряжённость и потому сохранён, а подразумеваемый смысл пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм исходного повествования в основном сохранён; спорные образы не заменены однозначным толкованием. Прописные буквы в местоимениях, относящихся к Богу, использованы как уважительная издательская норма.
