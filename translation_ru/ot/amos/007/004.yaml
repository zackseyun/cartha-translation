  source_fidelity: 'Основной образ передан верно: Яхве призывает к юридически окрашенному действию огнём; огонь поглощает великую бездну и затем обращается на «удел». Однако в исходном тексте не выражено וְהִנֵּה («и вот»). Формулировка «призывал вступить в тяжбу» также неудачна: она подразумевает призыв некоторому лицу вступить в спор, тогда как еврейский инфинитив не называет такого адресата и связывает тяжбу с огнём.'
