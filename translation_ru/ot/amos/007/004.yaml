  text: כֹּ֤ה הִרְאַ֨/נִי֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הִנֵּ֥ה קֹרֵ֛א לָ/רִ֥ב בָּ/אֵ֖שׁ אֲדֹנָ֣/י יְהוִ֑ה וַ/תֹּ֨אכַל֙ אֶת תְּה֣וֹם רַבָּ֔ה וְ/אָכְלָ֖ה אֶת הַ/חֵֽלֶק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/004.yaml
  text: 'This is what the Lord GOD showed me: behold[a], the Lord GOD was calling for a judgment by fire[b], and it consumed the great deep and was consuming the land.'
translation:
  language: ru
  text: 'Вот что показал мне Владыка Яхве: и вот, Владыка Яхве призывал к тяжбе огнём[a]. Огонь поглотил великую бездну и стал пожирать удел[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призывал к суду огнём»; еврейское выражение может означать тяжбу, спор или судебное разбирательство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «землю», «территорию»; буквально — «удел», то есть выделенную долю или область.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה הִרְאַנִי
  choice: Вот что показал мне
  rationale: Естественно передаёт формулу введения пророческого видения и указательную силу כֹּה.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт оба элемента составного божественного титула и избегает неестественного повтора «Господь Господь».
- source_word: וְהִנֵּה
  choice: не выражено отдельным словом
  rationale: Зрительная непосредственность וְהִנֵּה естественно передана вводной конструкцией «Вот что…»; дополнительное «и вот» по-русски перегружало бы фразу.
- source_word: קֹרֵא לָרִב בָּאֵשׁ
  choice: призывал вступить в тяжбу посредством огня
  rationale: Сохраняет процессуальный оттенок причастия קֹרֵא и судебно-спорное значение ריב, не сводя его без пояснения к общему «суду».
- source_word: וַתֹּאכַל
  choice: Огонь поглотил
  rationale: Женская форма глагола соотносится с אֵשׁ; явное повторение «огонь» устраняет неясность местоимения в русском тексте.
- source_word: תְּהוֹם רַבָּה
  choice: великую бездну
  rationale: Сохраняет библейский образ огромной водной глубины без позднейших спекулятивных оттенков.
- source_word: וְאָכְלָה
  choice: и стал пожирать
  rationale: Передаёт разворачивающееся вслед за первым действием уничтожение и сохраняет образную силу глагола «есть, пожирать».
- source_word: הַחֵלֶק
  choice: удел
  rationale: «Удел» точно сохраняет значение части, доли или выделенной территории и не сужает неоднозначное слово до общего «земля».
theological_decisions:
- issue: Передача составного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь ГОСПОДЬ
  rationale: Форма сохраняет личное имя Яхве и отдельное значение титула אֲדֹנָי, не создавая тавтологии.
- issue: Характер действия, выраженного לָרִב
  choice: вступить в тяжбу
  alternative: совершить суд; судиться
  rationale: ריב содержит юридические оттенки спора, тяжбы или обвинительного разбирательства; перевод не определяет точнее, чем позволяет контекст, является ли огонь самой тяжбой, её средством или судебной карой.
- issue: Референт הַחֵלֶק
  choice: удел
  alternative: земля; территория
  rationale: Контекст допускает понимание как земли или выделенной территории, однако буквальное «удел» сохраняет богословски и образно значимую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Владыка» употреблено как естественное различение אֲדֹנָי от имени Яхве; «тяжба» и «удел» сохраняют юридическую и территориальную неоднозначность оригинала, а сноски дают более прозрачные варианты.
