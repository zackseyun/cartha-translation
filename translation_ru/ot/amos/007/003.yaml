lexical_decisions:
- source_word: נִחַם
  choice: отменил это решение
  rationale: В данном контексте форма нифаль глагола נחם обозначает отказ от объявленного суда после заступничества Амоса. Такая передача естественна по-русски, выражает изменение намеченного действия и не предполагает нравственной ошибки.
- source_word: יְהוָה
  choice: Иегова
  rationale: Тетраграмматон передан личным именем «Иегова», а не заменён титулом «Господь».
- source_word: עַל זֹאת
  choice: это решение
  rationale: Сочетание указывает на только что описанный замысел суда; в русском переводе связь выражена объектом глагола. Слово «решение» добавлено для ясности как подразумеваемое содержание, а не как отдельная лексема еврейского текста.
- source_word: לֹא תִהְיֶה
  choice: Этого не будет
  rationale: Форма женского рода указывает на подразумеваемое бедствие или событие. Русская безличная формулировка сохраняет предсказательное отрицание и звучит современно.
- source_word: אָמַר יְהוָה
  choice: сказал Иегова
  rationale: Простая форма глагола אמר прямо передана глаголом «сказал», без усиления до формульного «возвещает».
theological_decisions:
- issue: Антропопатическое описание Бога в נִחַם יְהוָה
  choice: «Иегова отменил это решение» — сохранить изображённый в тексте отказ Бога от объявленного суда в ответ на заступничество.
  alternative: «Иегова передумал»; «Иегова пожалел об этом»; «Иегова смилостивился»
  rationale: Выбранная передача сохраняет богословское напряжение текста и изменение намеченного действия, но не внушает, будто Бог раскаялся в нравственном проступке. Возможные оттенки еврейского глагола отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная пророческая речь. Сохранено повторение личного имени. Маркер сноски поставлен после всего предложения, как в консультационном тексте.
