  text: וָ/אֹמַ֗ר אֲדֹנָ֤/י יְהוִה֙ חֲדַל נָ֔א מִ֥י יָק֖וּם יַעֲקֹ֑ב כִּ֥י קָטֹ֖ן הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/005.yaml
  text: Then I said[a], “Lord GOD, please cease[b]. How can Jacob stand? For he is small.”
translation:
  language: ru
  text: 'И я сказал: «Владыка Яхве[a], прошу, прекрати! Как устоит Иаков[b]? Ведь он мал».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Владыка Яхве» (אֲדֹנָי יְהוִה); здесь соединены титул и личное имя Бога.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза кратка и допускает также понимание: «Кто поднимет Иакова?»; основной текст передаёт её как вопрос о том, сможет ли Иаков выдержать бедствие.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: И я сказал
  rationale: Последовательная форма с וַ־ продолжает повествование; русское «И я сказал» естественно передаёт связь с предшествующим видением.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Переданы оба элемента составного титула: אֲדֹנָי как «Владыка» и личное имя יהוה как «Яхве», без неестественного повтора «Господь Господь».'
- source_word: חֲדַל נָא
  choice: прошу, прекрати
  rationale: Императив חֲדַל означает прекращение действия, а частица נָא придаёт просьбе умоляющий характер. «Прошу, прекрати» звучит ясно и естественно, не добавляя отсутствующего в тексте дополнения.
- source_word: מִי יָקוּם יַעֲקֹב
  choice: Как устоит Иаков?
  rationale: В контексте ходатайства фраза выражает сомнение в способности Иакова пережить суд. Такой перевод естественен по-русски, тогда как буквальная синтаксическая форма допускает и иные толкования, отмеченные в сноске.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Сохранено прямо названное в еврейском тексте имя, употреблённое как обозначение народа Израиля.
- source_word: כִּי קָטֹן הוּא
  choice: Ведь он мал
  rationale: כִּי вводит основание просьбы, а קָטֹן буквально указывает на малость. Мужской род сохраняет олицетворение народа именем Иаков; перевод «слаб» был бы более толковательным.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: «Владыка Яхве» сохраняет как титул אֲדֹנָי, так и личное заветное имя יהוה, избегая смешения двух разных элементов и неуклюжего повтора.
- issue: Смысл риторического вопроса מִי יָקוּם יַעֲקֹב
  choice: Как устоит Иаков?
  alternative: Кто поднимет Иакова?; Кто устоит — Иаков?
  rationale: Контекст представляет Иакова малым и неспособным самостоятельно выдержать бедствие. Основной текст передаёт этот смысл, а неоднозначность краткой еврейской конструкции сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой молитвы. Краткие фразы сохраняют настойчивость ходатайства; архаизмы и добавление подразумеваемого объекта после «прекрати» исключены.
