  text: כֹּ֣ה הִרְאַ֔/נִי וְ/הִנֵּ֧ה אֲדֹנָ֛/י נִצָּ֖ב עַל חוֹמַ֣ת אֲנָ֑ךְ וּ/בְ/יָד֖/וֹ אֲנָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/007.yaml
  text: 'This is what he showed me: behold[a], the Lord was standing by a wall made with a plumb line, with a plumb line in his hand.'
translation:
  language: ru
  text: 'Вот что Он показал мне: и вот, Господь стоял у стены, возведённой по отвесу[a], и в руке у Него был отвес.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «на стене, выверенной по отвесу» или буквально: «на стене отвеса». Еврейское выражение неясно. Слово אֲנָךְ, вероятно, означает отвес или грузик отвеса; предлагались также значения «свинец» и «олово».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: Вот что
  rationale: Естественно вводит описание видения и сохраняет указательное значение еврейского выражения.
- source_word: הִרְאַנִי
  choice: Он показал мне
  rationale: Каузативная форма глагола ראה здесь означает «показал».
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Передаёт внезапное предъявление картины в видении и сохраняет торжественный, но понятный современному читателю тон.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Переводит божественный титул, не смешивая его с личным именем Бога.
- source_word: נִצָּב
  choice: стоял
  rationale: Причастие изображает продолжающееся положение в разворачивающейся сцене; русский несовершенный вид это естественно передаёт.
- source_word: עַל
  choice: у
  rationale: В данном контексте допускает пространственный смысл «у, возле»; буквальное «на» возможно, но создаёт более определённый образ, чем позволяет контекст.
- source_word: חוֹמַת אֲנָךְ
  choice: стены, возведённой по отвесу
  rationale: 'Передаёт вероятный смысл трудного сочетания: стена была выстроена и выверена с помощью отвеса, без неестественного русского оборота «стена отвеса».'
- source_word: אֲנָךְ
  choice: отвес
  rationale: По контексту это, вероятнее всего, строительный инструмент для проверки вертикали; предложенные значения материала «свинец» или «олово» отмечены в сноске.
- source_word: וּבְיָדוֹ אֲנָךְ
  choice: и в руке у Него был отвес
  rationale: Сохраняет порядок и наглядность еврейского образа, звуча естественно по-русски.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — естественный и устойчивый русский эквивалент этого божественного титула; он не подменяет титул тетраграмматоном.
- issue: Положение Господа относительно стены
  choice: у стены
  alternative: на стене
  rationale: Предлог עַל допускает оба понимания. Контекст проверки стены отвесом благоприятствует значению «у стены», однако грамматическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством пророческого видения. Конструкция «и вот» сохраняет библейскую зрительную непосредственность, не становясь архаичной. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской религиозной издательской норме.
