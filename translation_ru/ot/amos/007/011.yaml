  text: כִּי כֹה֙ אָמַ֣ר עָמ֔וֹס בַּ/חֶ֖רֶב יָמ֣וּת יָרָבְעָ֑ם וְ/יִ֨שְׂרָאֵ֔ל גָּלֹ֥ה יִגְלֶ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/011.yaml
  text: 'For this is what Amos has said: ‘Jeroboam will die by the sword[a], and Israel will surely go into exile from its land.’'
translation:
  language: ru
  text: 'Ибо так сказал Амос: «Иеровоам умрёт от меча, а Израиль непременно уйдёт в изгнание[a] из своей земли».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непременно будет изгнан»; возможно также: «непременно будет уведён в плен». В еврейском тексте абсолютный инфинитив сочетается с личной формой глагола, усиливая утверждение.'
    reason: Сноска фиксирует возможные русские способы передачи גָּלֹה יִגְלֶה и поясняет эмфатическую еврейскую конструкцию.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание обвинения, высказанного Амасией в предыдущем стихе; «ибо» естественно связывает фразы и сохраняет причинно-пояснительную функцию.
- source_word: כֹה אָמַר
  choice: так сказал
  rationale: Устойчивая формула передачи высказывания; прошедшее время соответствует тому, что Амасия сообщает о ранее произнесённых словах Амоса.
- source_word: עָמוֹס
  choice: Амос
  rationale: Традиционная русская передача имени.
- source_word: בַּחֶרֶב יָמוּת
  choice: умрёт от меча
  rationale: Естественная русская формула насильственной смерти, сохраняющая инструментальный образ меча.
- source_word: יָרָבְעָם
  choice: Иеровоам
  rationale: Традиционная русская передача имени царя.
- source_word: וְיִשְׂרָאֵל
  choice: а Израиль
  rationale: «Израиль» обозначает северное царство как собирательное целое; противительно-присоединительное «а» естественно соединяет два предсказания.
- source_word: גָּלֹה יִגְלֶה
  choice: непременно будет изгнан
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает утверждение; «непременно» передаёт эмфазу, а «будет изгнан» ясно выражает переселение в изгнание.
- source_word: מֵעַל אַדְמָתוֹ
  choice: из своей земли
  rationale: В данном контексте אַדָמָה означает землю страны, а местоимение «своей» естественно соотносится с собирательным наименованием «Израиль».
theological_decisions:
- issue: Значение «Израиля» и притяжательного суффикса в מֵעַל אַדְמָתוֹ
  choice: 'Израиль как единое царство/народ: «из своей земли»'
  alternative: «народ Израиля… из их земли»
  rationale: Еврейский текст грамматически представляет Израиль как единое собирательное целое. Русское «из своей земли» сохраняет эту связь, не уточняя сверх текста, идёт ли речь преимущественно о государстве или народе.
- issue: Залог и оттенок глагольного сочетания גָּלֹה יִגְלֶה
  choice: «непременно будет изгнан»
  alternative: «непременно уйдёт в изгнание»
  rationale: Форма допускает передачу как самого ухода в изгнание, так и принудительного переселения. Основной текст выбирает естественную для контекста угрозы формулировку, а сноска сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной интонацией пророческой речи. Традиционные формы библейских имён сохранены; архаическая синтаксическая калька избегается.
