source:
  edition: WLC
  text: כֹּ֤ה הִרְאַ֨/נִי֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הִנֵּה֙ יוֹצֵ֣ר גֹּבַ֔י בִּ/תְחִלַּ֖ת עֲל֣וֹת הַ/לָּ֑קֶשׁ וְ/הִ֨נֵּה לֶ֔קֶשׁ אַחַ֖ר גִּזֵּ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/001.yaml
  text: 'This is what the Lord GOD showed me: behold[a], he was forming locusts at the beginning of the spring crop''s coming up, and behold[b], it was the spring crop after the king''s mowings.'
translation:
  language: ru
  text: 'Вот что показал мне Владыка Яхве: вот, Он создавал саранчу в самом начале всхода поздней поросли[a]; и вот — поздняя поросль после царских покосов[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поздние всходы», «отава». Еврейское слово обозначает более поздний рост растительности после первого среза.'
    reason: lexical_alternative
  - marker: b
    text: «Царские покосы», вероятно, означают первый срез травы или корма, который полагался царю; после него вырастала поздняя поросль.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה הִרְאַנִי
  choice: Вот что показал мне
  rationale: Естественно передаёт формулу введения пророческого видения и сохраняет указательную силу כֹּה.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт оба элемента составного Божественного титула и сохраняет личное имя יהוה, не создавая неестественного сочетания «Господь Господь».
- source_word: וְהִנֵּה
  choice: Он… как раз тогда / И вот
  rationale: Первое употребление передано средствами живого зрительного представления без тяжеловесного повтора; второе сохранено как «И вот», отмечающее новый элемент видения.
- source_word: יוֹצֵר
  choice: создавал
  rationale: Причастная форма изображает разворачивающееся перед глазами пророка действие; несовершенный вид сохраняет эту длительность.
- source_word: גֹּבַי
  choice: саранчу
  rationale: В контексте сельскохозяйственного бедствия речь идёт о пожирающей растительность саранче; русское собирательное единственное число здесь естественно.
- source_word: בִּתְחִלַּת עֲלוֹת
  choice: когда начинала всходить
  rationale: Сохраняет временное значение выражения и начало процесса появления растительности.
- source_word: הַלָּקֶשׁ / לֶקֶשׁ
  choice: поздняя поросль / поросль
  rationale: Термин обозначает более поздний рост растительности после первого среза. «Поросль» понятно современному читателю, а повтор корня связывает обе части стиха.
- source_word: גִּזֵּי הַמֶּלֶךְ
  choice: царских покосов
  rationale: Передаёт срезание травы или корма, принадлежавшего царю либо взимавшегося в его пользу; множественное число соответствует форме источника.
theological_decisions:
- issue: Передача составного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Выбор сохраняет как титул владычества, так и личное имя Бога, не отождествляя יהוה с обычным нарицательным обозначением.
- issue: Кто создаёт саранчу
  choice: Бог — подразумеваемый субъект «Он создавал»
  alternative: Безличное «образовывалась саранча»
  rationale: Мужское причастие יוֹצֵר естественно соотносится с непосредственно названным Владыкой Яхве; перевод не устраняет образ Бога как действующего лица видения.
translation_notes:
  register: Современный литературный русский язык с торжественностью, уместной для пророческого видения. Синтаксис сделан ясным для широкого читателя; редкий сельскохозяйственный термин не внесён в основной текст, но указан в примечании. Маркеры [a] и [b] поставлены непосредственно после выражений, которые поясняют.
