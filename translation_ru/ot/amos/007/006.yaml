    reason: lexical_alternative
lexical_decisions:
- source_word: נִחַם
  choice: передумал
  rationale: Форма нифаль глагола נחם здесь обозначает изменение объявленного решения в ответ на ходатайство Амоса. «Передумал» прямо и естественно передаёт антропопатический язык еврейского текста, не подменяя его толкованием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: עַל זֹאת
  choice: об этом
  rationale: Предлог עַל с указательным местоимением обозначает предмет, которого касается решение, — показанное в видении бедствие.
- source_word: גַּם הִיא
  choice: и этого
  rationale: Сохраняет присоединительное значение גַּם и соотносит местоимение с бедствием, показанным во втором видении.
- source_word: לֹא תִהְיֶה
  choice: не будет
  rationale: Буквальное и естественное русское выражение, которое в контексте означает, что показанное бедствие не осуществится.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Различает титул אֲדֹנָי и личное имя יְהוָה, сохраняя оба элемента сочетания без пояснительного расширения.
theological_decisions:
- issue: Антропопатический язык о Боге в נִחַם
  choice: Сохранить прямую формулировку «Яхве передумал».
  alternative: «Яхве отменил это» или «Яхве сжалился»
  rationale: Еврейский текст представляет Бога отвечающим на пророческое ходатайство. Прямая передача сохраняет богословское напряжение и не объясняет его через привнесённое учение; примечание указывает на допустимый менее прямой вариант.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем. «Передумал» намеренно сохраняет прямоту и богословское напряжение оригинала; «Владыка Яхве» ясно передаёт сочетание титула и имени.
