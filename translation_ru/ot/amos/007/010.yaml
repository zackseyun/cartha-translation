  text: וַ/יִּשְׁלַ֗ח אֲמַצְיָה֙ כֹּהֵ֣ן בֵּֽית אֵ֔ל אֶל יָרָבְעָ֥ם מֶֽלֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר קָשַׁ֨ר עָלֶ֜י/ךָ עָמ֗וֹס בְּ/קֶ֨רֶב֙ בֵּ֣ית יִשְׂרָאֵ֔ל לֹא תוּכַ֣ל הָ/אָ֔רֶץ לְ/הָכִ֖יל אֶת כָּל דְּבָרָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/010.yaml
  text: Then Amaziah[a], the priest of Bethel, sent word to Jeroboam king of Israel, saying, “Amos has conspired against you in the midst of the house of Israel[c][b]; the land is not able to bear all his words.”
translation:
  language: ru
  text: 'И послал Амасия, священник Вефиля, весть Иеровоаму, царю Израиля: «Амос составил против тебя заговор в самой среде дома Израиля[a]. Земля не может вынести всех его слов[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди дома Израиля».'
    reason: Сочетание בְּקֶרֶב обозначает нахождение внутри, в среде; возможна как более буквальная, так и более плавная социально-пространственная передача.
  - marker: b
    text: 'Или: «не может вместить (стерпеть) всех его слов».'
    reason: Еврейский глагол может обозначать как вмещение, так и способность выдерживать или терпеть.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Глагол передаёт отправку сообщения; адресат и последующее לֵאמֹר позволяют естественно понять подразумеваемого посланца или весть без добавления объекта.
- source_word: כֹּהֵן בֵּית אֵל
  choice: священник Вефиля
  rationale: Сохраняет конструкцию принадлежности и связь Амасии с культовым центром в Вефиле.
- source_word: קָשַׁר עָלֶיךָ
  choice: составил против тебя заговор
  rationale: В политическом контексте קָשַׁר обозначает заговор или участие в нём, а עַל указывает на его цель.
- source_word: בְּקֶרֶב בֵּית יִשְׂרָאֵל
  choice: среди дома Израиля
  rationale: «Среди» естественно передаёт социально-пространственный смысл בְּקֶרֶב, а традиционное пророческое выражение «дом Израиля» сохранено.
- source_word: הָאָרֶץ
  choice: земля
  rationale: По контексту имеется в виду земля, то есть страна Израиля, а не весь мир.
- source_word: לְהָכִיל
  choice: вынести
  rationale: В данном высказывании глагол выражает неспособность выдержать или терпеть слова Амоса; «вынести» сохраняет образ ёмкости и риторическую силу жалобы.
- source_word: כָּל דְּבָרָיו
  choice: всех его слов
  rationale: Близко передаёт множественное число и всеохватность כָּל.
theological_decisions:
- issue: Характер обвинения Амоса Амасией
  choice: «Амос составил против тебя заговор» как передача политического обвинения
  alternative: «Амос злоумышляет против тебя»
  rationale: Текст сообщает враждебное обвинение Амасии, но не подтверждает от лица повествователя, что Амос действительно совершил измену.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Синтаксис слегка формальный, но понятный; сохранено устойчивое библейское выражение «дом Израиля». Имена переданы в принятой русской библейской форме.
