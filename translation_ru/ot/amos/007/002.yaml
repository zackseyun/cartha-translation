  text: וְ/הָיָ֗ה אִם כִּלָּה֙ לֶֽ/אֱכוֹל֙ אֶת עֵ֣שֶׂב הָ/אָ֔רֶץ וָ/אֹמַ֗ר אֲדֹנָ֤/י יְהוִה֙ סְֽלַֽח נָ֔א מִ֥י יָק֖וּם יַֽעֲקֹ֑ב כִּ֥י קָטֹ֖ן הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/002.yaml
  text: And when it had finished eating the vegetation of the land[a], I said, “Lord GOD, please forgive! How can Jacob stand? For he is small.”
translation:
  language: ru
  text: 'И когда саранча объела растительность земли, я сказал: «Владыка Яхве, прости, прошу! Как устоит Иаков?[a] Ибо он мал».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто поднимет Иакова?»'
    reason: Еврейское выражение допускает восстановительное понимание глагола קום; этот вариант сохраняет подлинную неоднозначность текста.
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: И когда
  rationale: Оборот вводит следующий момент видения; אִם здесь имеет временное значение. Русское «и когда» естественно продолжает повествование.
- source_word: כִּלָּה לֶאֱכוֹל
  choice: она доела
  rationale: Конструкция כלה с инфинитивом обозначает завершение действия. Местоимение относится к саранче из предыдущего стиха, представленной как собирательное существительное женского рода в русском языке.
- source_word: עֵשֶׂב הָאָרֶץ
  choice: растительность этой земли
  rationale: עֵשֶׂב обозначает траву и растительность в широком смысле, а הָאָרֶץ в контексте видения указывает на землю страны, а не на весь земной шар.
- source_word: וָאֹמַר
  choice: я сказал
  rationale: Прямая и естественная передача повествовательной формы.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Господь» — традиционное русское обозначение имени יהוה; сочетание сохраняет оба элемента и не создаёт неестественного повтора.
- source_word: סְלַח נָא
  choice: прости, прошу
  rationale: Сохраняет прямую просьбу о прощении и настойчиво-молительный оттенок частицы נָא.
- source_word: מִי יָקוּם יַעֲקֹב
  choice: Как устоит Иаков?
  rationale: В контексте заступничества вопрос выражает неспособность Иакова пережить суд или удержаться после него. Более буквальное восстановительное понимание глагола сохранено в сноске.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Сохранено употреблённое в еврейском тексте заветное имя народа, без замены толкованием «Израиль».
- source_word: כִּי קָטֹן הוּא
  choice: Ведь он мал
  rationale: '«Мал» сохраняет смысловую широту קָטֹן: малочисленность, слабость и незначительность, не сводя образ к одному толкованию.'
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Господь
  alternative: Владыка Яхве
  rationale: Основной текст следует укоренённой русской традиции передачи тетраграмматона словом «Господь», при этом титул אֲדֹנָי передан отдельно словом «Владыка», чтобы оба элемента исходного выражения оставались видимыми.
- issue: Смысл מִי יָקוּם יַעֲקֹב
  choice: Как устоит Иаков?
  alternative: Кто поднимет Иакова?
  rationale: Основной вариант передаёт наиболее естественный в данном контексте вопрос о выживании слабого народа. Возможный смысл восстановления не устранён, а приведён в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и эмоционально напряжённым звучанием пророческого заступничества. Архаические обороты исключены; образ «мал» намеренно сохранён без поясняющего сужения.
