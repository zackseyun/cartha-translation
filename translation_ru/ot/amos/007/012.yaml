base_translation:
  language: en
  yaml_path: translation/ot/amos/007/012.yaml
  text: Then Amaziah said to Amos[a], “Seer, go, flee away to the land of Judah, and eat bread there, and prophesy there.”
translation:
  language: ru
  text: 'И сказал Амасия Амосу: «Провидец, ступай, беги в землю Иудеи; там ешь хлеб[a] и там пророчествуй».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зарабатывай там себе на хлеб», «там добывай себе пропитание»; выражение «есть хлеб» здесь, вероятно, означает обеспечивать себя средствами к жизни.'
    reason: 'Лексико-контекстуальная альтернатива: буквальный образ может иметь идиоматический смысл заработка.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма продолжает повествовательную последовательность; традиционная и естественная русская конструкция сохраняет связь с предыдущим контекстом.
- source_word: חֹזֶה
  choice: Провидец
  rationale: Передаёт специальное обозначение человека, получающего видения, и не смешивает его с более общим словом «пророк».
- source_word: לֵךְ בְּרַח לְךָ
  choice: Ступай, беги
  rationale: Сохраняет два повеления и настойчивость речи; «ступай» звучит естественнее простого «иди» в приказе покинуть место, а «беги» передаёт ברח. Возвратное לְךָ понимается идиоматически и отдельно не воспроизводится.
- source_word: אֶרֶץ יְהוּדָה
  choice: землю Иудейскую
  rationale: Сохраняет значение אֶרֶץ и географически-политическое наименование территории Иуды в естественной библейской русской форме.
- source_word: וֶאֱכָל שָׁם לֶחֶם
  choice: там ешь хлеб
  rationale: Основной текст сохраняет буквальный образ исходного выражения, не делая явным вероятный подразумеваемый смысл заработка пророчеством.
- source_word: תִּנָּבֵא
  choice: пророчествуй
  rationale: Прямо и естественно передаёт стандартный еврейский глагол пророческой речи.
theological_decisions:
- issue: Следует ли явно передать намёк Амасии на заработок пророчеством
  choice: Сохранить в основном тексте выражение «ешь хлеб»
  alternative: «зарабатывай там себе на хлеб» или «там добывай себе пропитание»
  rationale: Контекст допускает и, вероятно, предполагает презрительный намёк на профессионального пророка, живущего своим ремеслом. Однако еврейский текст буквально говорит «ешь хлеб», поэтому образ сохранён, а вероятный идиоматический смысл вынесен в сноску.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Повелительная последовательность сохранена без тире; повтор «там» воспроизводит риторическую структуру еврейского текста.
