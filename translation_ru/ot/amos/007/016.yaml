base_translation:
  language: en
  yaml_path: translation/ot/amos/007/016.yaml
  text: 'And now[a], hear the word of Yahweh: You say, ‘Do not prophesy against Israel, and do not preach against the house of Isaac.’'
translation:
  language: ru
  text: 'А теперь выслушай слово Яхве. Ты говоришь: «Не пророчествуй против Израиля и не проповедуй[a] против дома Исаака».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не изливай слов против дома Исаака». Еврейский глагол буквально означает «капать» и употребляется здесь как образное обозначение пророческой речи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сохраняет соединительный элемент и непосредственный переход к ответу Амоса, естественно звуча по-русски.
- source_word: שְׁמַע
  choice: выслушай
  rationale: Императив единственного числа обращён к Амасии; «выслушай» передаёт требование принять к сведению последующее слово.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Сохраняет устойчивую пророческую формулу и личное имя יְהוָה.
- source_word: אַתָּה אֹמֵר
  choice: Ты говоришь
  rationale: Личное местоимение сохраняет эмфатическое обращение, а настоящее время естественно передаёт причастную конструкцию.
- source_word: לֹא תִנָּבֵא עַל יִשְׂרָאֵל
  choice: Не пророчествуй против Израиля
  rationale: Отрицательная форма передаёт запрет, а «против» соответствует враждебной направленности пророчества в данном контексте.
- source_word: וְלֹא תַטִּיף
  choice: и не изрекай речей[a]
  rationale: Глагол נטף буквально связан с капанием или истечением и идиоматически обозначает пророческую речь. «Изрекай речей» передаёт торжественную речевую функцию, не отождествляя этот глагол полностью с предыдущим «пророчествуй»; буквальный образ отмечен в сноске.
- source_word: עַל בֵּית יִשְׂחָק
  choice: против дома Исаака
  rationale: «Дом Исаака» сохраняет поэтическое обозначение Израиля, а повтор «против» поддерживает параллелизм и направленность обличения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано собственное заветное имя, непосредственно присутствующее в еврейском тексте, без замены титулом.
- issue: Направленность пророчества, выраженная עַל
  choice: против Израиля / против дома Исаака
  alternative: Израилю / дому Исаака; об Израиле / о доме Исаака
  rationale: В контексте Амасия запрещает обличительное пророчество; «против» сохраняет конфронтационную силу, не добавляя нового богословского содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным и прямым; сохранены формула «слово Яхве», поэтическое выражение «дом Исаака» и различие между двумя еврейскими глаголами речи.
