base_translation:
  language: en
  yaml_path: translation/ot/amos/007/014.yaml
  text: Then Amos answered and said to Amaziah[a], “I am not a prophet, nor am I a son of a prophet; rather[b], I am a herdsman and a dresser of sycamore figs.”
translation:
  language: ru
  text: 'И ответил Амос, и сказал Амасии: «Я не пророк и не сын пророка[a]; я скотовод и обрабатываю плоды сикомора[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «сын пророка» может означать не буквального сына, а члена сообщества пророков.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «надрезаю плоды сикомора»; редкий еврейский глагол, вероятно, обозначает уход за этими плодами или их надрезание для созревания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: И ответил ... и сказал
  rationale: Сохранена обычная древнееврейская повествовательная формула с двумя глаголами; по-русски она звучит возвышенно, но понятно.
- source_word: לֹא נָבִיא אָנֹכִי
  choice: Я не пророк
  rationale: Прямо передаёт именную конструкцию и не устраняет напряжение между отрицанием Амоса и его пророческим служением.
- source_word: וְלֹא בֶן נָבִיא אָנֹכִי
  choice: и не сын пророка
  rationale: Сохранён еврейский оборот, который может обозначать как буквальное родство, так и принадлежность к пророческому сообществу.
- source_word: כִּי
  choice: ; я
  rationale: В данном контексте частица вводит противопоставленное самоописание. В русском это естественно выражается бессоюзным переходом после точки с запятой без навязывания узкого значения «но» или «ведь».
- source_word: בוֹקֵר
  choice: скотовод
  rationale: Слово связано с уходом за крупным скотом или стадами; «скотовод» точнее, чем специфическое «пастух», и естественно в современном русском.
- source_word: וּבוֹלֵס שִׁקְמִים
  choice: и выращиваю плоды сикомора
  rationale: Передаёт сельскохозяйственное занятие без чрезмерно уверенного уточнения спорного действия בולס, которое могло включать надрезание или иную обработку плодов.
theological_decisions:
- issue: Отрицает ли Амос пророческое призвание вообще или лишь профессиональный либо общинный статус
  choice: Сохранено буквальное «Я не пророк и не сын пророка»
  alternative: «Я не был ни пророком, ни учеником пророка» или «Я не профессиональный пророк»
  rationale: Контекст показывает, что Амос возвещает Божье слово, однако еврейский текст не объясняет отрицание. Перевод сохраняет это богословское и временно-смысловое напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Название дерева передано как «сикомор», чтобы не смешивать его с обычным клёном-явором; уточнение «плоды» делает сельскохозяйственный смысл ясным.
