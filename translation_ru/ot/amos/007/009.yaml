  text: וְ/נָשַׁ֨מּוּ֙ בָּמ֣וֹת יִשְׂחָ֔ק וּ/מִקְדְּשֵׁ֥י יִשְׂרָאֵ֖ל יֶחֱרָ֑בוּ וְ/קַמְתִּ֛י עַל בֵּ֥ית יָרָבְעָ֖ם בֶּ/חָֽרֶב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/009.yaml
  text: The high places of Isaac will be made desolate[a], and the sanctuaries of Israel will be laid waste[c][b]; and I will rise against the house of Jeroboam with the sword.
translation:
  language: ru
  text: И опустеют высоты Исаака[a], и святилища Израиля будут разорены; и Я восстану с мечом против дома Иеровоама.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут опустошены». Имя «Исаак» здесь поэтически обозначает Израиль.'
    reason: Лексическая альтернатива и нейтральное пояснение поэтического обозначения.
lexical_decisions:
- source_word: וְנָשַׁמּוּ
  choice: и опустеют
  rationale: Нифаль от שׁמם обозначает переход в состояние запустения или разорение; «опустеют» естественно передаёт результативное значение, не уточняя искусственно деятеля.
- source_word: בָּמוֹת
  choice: высоты
  rationale: В данном пророческом контексте слово обозначает культовые места, обычно располагавшиеся на возвышенностях; традиционное «высоты» сохраняет ёмкость древнееврейского термина.
- source_word: יִשְׂחָק
  choice: Исаака
  rationale: Сохранено прямо названное в еврейском тексте имя; здесь оно поэтически обозначает северный народ завета.
- source_word: וּמִקְדְּשֵׁי
  choice: и святилища
  rationale: מִקְדָּשׁ — священное, культовое место; «святилища» точно и естественно передаёт религиозный смысл.
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Сохранено имя «Израиль», в контексте относящееся к северному царству.
- source_word: יֶחֱרָבוּ
  choice: будут разорены
  rationale: Форма от חרב выражает разрушение и запустение; «будут разорены» передаёт силу провозглашаемого суда и различает формулировки двух параллельных строк.
- source_word: וְקַמְתִּי עַל
  choice: и Я восстану ... против
  rationale: 'Сочетание קום с עַל имеет здесь враждебно-судебный смысл: Бог лично выступает против дома Иеровоама.'
- source_word: בֵּית יָרָבְעָם
  choice: дома Иеровоама
  rationale: Сохранена библейская династическая метафора «дом», которая может охватывать семью и царскую династию.
- source_word: בֶּחָרֶב
  choice: с мечом
  rationale: Предлог בְּ допускает инструментальное выражение; «с мечом» естественно передаёт образ насильственного суда, не устраняя возможный оттенок «посредством меча».
theological_decisions:
- issue: Кого обозначает «Исаак»
  choice: Сохранить «Исаак» в основном тексте как поэтическое обозначение северного народа завета.
  alternative: Заменить на «Израиль» ради немедленной ясности.
  rationale: Еврейский текст намеренно употребляет имя Исаака. Замена сгладила бы литературную и заветную образность исходного текста.
- issue: Характер Божьего действия во фразе «Я восстану ... против»
  choice: Передать прямое личное противостояние и суд Бога.
  alternative: Ослабить до «Я выступлю против» или «Я буду действовать против».
  rationale: Оборот сохраняет сильный судебно-военный образ исходного текста; более слабая формулировка уменьшила бы его напряжение.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Параллелизм двух первых частей сохранён, но близкие еврейские глаголы разведены как «опустеют» и «будут разорены». Заглавная «Я» обозначает говорящего Бога. «Дом Иеровоама» сохраняет династическую метафору исходного текста.
