base_translation:
  language: en
  yaml_path: translation/ot/amos/007/015.yaml
  text: But Yahweh took me from following the flock[a], and Yahweh said to me, “Go[b], prophesy to my people Israel.”
translation:
  language: ru
  text: 'Но Яхве взял меня от стада[a], за которым я ходил, и Яхве сказал мне: «Иди, пророчествуй Моему народу Израилю[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из-за стада» или «вслед за стадом»; еврейское выражение рисует пастуха, идущего позади животных.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к Моему народу Израилю». В контексте пророчество включает суд, однако в самом стихе не сказано «против Моего народа».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחֵנִי
  choice: взял меня
  rationale: Обычное значение לקח — «брать, взять». Эта формулировка прямо описывает призвание Амоса, не усиливая глагол до «схватил» или «увёл силой».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста и не заменяет имя титулом «Господь».
- source_word: מֵאַחֲרֵי הַצֹּאן
  choice: от стада
  rationale: Краткая и естественная русская формулировка передаёт, что Яхве отозвал Амоса от его прежнего пастушеского занятия; более буквальный пространственный образ указан в сноске.
- source_word: הַצֹּאן
  choice: стадо
  rationale: צאן обозначает мелкий домашний скот как совокупность; «стадо» сохраняет собирательный смысл, не ограничивая его только овцами.
- source_word: וַיֹּאמֶר אֵלַי
  choice: сказал мне
  rationale: Прямая и стилистически нейтральная передача אמר с אֶל.
- source_word: לֵךְ
  choice: иди
  rationale: Простой императив точно сохраняет силу повеления и естественно звучит в речи призвания.
- source_word: הִנָּבֵא
  choice: пророчествуй
  rationale: Стандартный русский глагол точно передаёт повелительную форму נבא в нифале и не добавляет содержания пророчества.
- source_word: אֶל עַמִּי יִשְׂרָאֵל
  choice: Моему народу Израилю
  rationale: Предлог אֶל здесь обозначает адресата пророческой речи — «к, для»; дательный падеж естественно передаёт это по-русски. Формулировка сохраняет и Божье «Моему», и имя народа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, поэтому личное имя сохраняется, а не заменяется титулом.
- issue: Направленность пророческого поручения
  choice: Моему народу Израилю
  alternative: против Моего народа Израиля
  rationale: אֶל обычно означает движение или обращение «к» кому-либо. Хотя окружающий контекст включает суд, сам этот стих не говорит «против», поэтому такой оттенок не внесён в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис краткий и прямой; повтор имени Яхве снят как необязательный для естественного русского повествования, при этом субъект второй части остаётся однозначным. Заглавная буква в «Моему» отмечает речь Бога без добавления толкования.
