base_translation:
  language: en
  yaml_path: translation/ot/amos/002/001.yaml
  text: 'Thus says Yahweh: “For three transgressions of Moab[a], and for four, I will not revoke it[b], because he burned the bones of the king of Edom to lime.”'
translation:
  language: ru
  text: 'Так говорит Яхве:


    «За три преступления Моава

    и за четыре

    Я не отменю этого[a],

    потому что он сжёг кости царя Эдома,

    превратив их в известь[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не обращу этого назад». Вероятно, речь идёт о том, что Яхве не отменит объявленный суд.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «в штукатурный материал». Еврейское выражение указывает на то, что кости были сожжены настолько полно, что превратились в известь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняет обычную пророческую формулу посланника и передаёт личное имя יְהוָה как «Яхве».
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי מוֹאָב וְעַל אַרְבָּעָה
  choice: За три преступления Моава и за четыре
  rationale: Сохраняет характерную для Амоса числовую формулу нарастания. «Преступления» естественно передаёт нравственный смысл и оттенок мятежа в פֶּשַׁע.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: Я не отменю этого
  rationale: Естественно передаёт идиому «не обращу это назад», сохраняя неопределённое местоименное дополнение и не уточняя в основном тексте, что именно не будет отменено.
- source_word: עַל שָׂרְפוֹ
  choice: потому что он сжёг
  rationale: עַל указывает на основание суда, а суффикс при инфинитиве имеет единственное число; «он» представляет Моав как единое, персонифицированное целое.
- source_word: עַצְמוֹת מֶלֶךְ אֱדוֹם
  choice: кости царя Эдома
  rationale: Прямо и ясно передаёт еврейскую сопряжённую конструкцию и объект надругательства.
- source_word: לַשִּׂיד
  choice: превратив их в известь
  rationale: שִׂיד означает известь или штукатурный материал, а не просто пепел. Формулировка поясняет результат столь полного сожжения костей и естественно звучит по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Неопределённый объект в לֹא אֲשִׁיבֶנּוּ
  choice: не отменю этого
  alternative: не отвращу наказания; не отменю приговора
  rationale: Еврейский текст содержит местоименное «это», но прямо не называет ни наказание, ни приговор. Перевод сохраняет эту неоднозначность, а вероятный смысл поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Строки разбиты по смысловым единицам еврейского речения; числовая формула и корпоративное единственное число сохранены.
