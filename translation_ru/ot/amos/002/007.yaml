  text: הַ/שֹּׁאֲפִ֤ים עַל עֲפַר אֶ֨רֶץ֙ בְּ/רֹ֣אשׁ דַּלִּ֔ים וְ/דֶ֥רֶךְ עֲנָוִ֖ים יַטּ֑וּ וְ/אִ֣ישׁ וְ/אָבִ֗י/ו יֵֽלְכוּ֙ אֶל הַֽ/נַּעֲרָ֔ה לְמַ֥עַן חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/007.yaml
  text: those who trample the head of the poor into the dust of the earth[a], and turn aside the way of the humble; and a man and his father go in to the same girl[d][c][b], so as to profane my holy name.
translation:
  language: ru
  text: тех, кто втаптывает головы бедняков в земную пыль[a] и сбивает смиренных с пути[b]; и мужчина, и его отец вступают в связь с одной и той же девушкой[c][d], тем самым оскверняя Моё святое имя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жадно стремятся к земной пыли на головах бедняков». Еврейский глагол буквально может обозначать сильное, жадное стремление, но в данном контексте, вероятно, описывает безжалостное угнетение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «искажает путь угнетённых» или «оттесняет кротких с их пути».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «идут к девушке»; это эвфемизм, обозначающий половую связь. Слово «девушка» можно также перевести как «молодая женщина».'
    reason: lexical_alternative
  - marker: d
    text: В стихе не сказано прямо, что девушка была культовой проституткой, рабыней или служанкой, хотя некоторые толкователи видят в контексте подобную эксплуатацию.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֹּׁאֲפִים עַל עֲפַר אֶרֶץ בְּרֹאשׁ דַּלִּים
  choice: втаптывает головы бедняков в земную пыль
  rationale: Глагол שׁאף буквально может передавать жадное стремление или тяжёлое дыхание, однако в данном контексте образ направлен на жестокое унижение и угнетение бедных. «Втаптывает» естественно передаёт этот образ по-русски, а сноска сохраняет более буквальную возможность.
- source_word: דַּלִּים
  choice: бедняков
  rationale: Слово обозначает бедных, слабых и беспомощных; «бедняки» ясно выражает социальную уязвимость в контексте обличения несправедливости.
- source_word: וְדֶרֶךְ עֲנָוִים יַטּוּ
  choice: сбивает смиренных с пути
  rationale: Передаёт метафору пути естественным современным русским языком. ענוים допускает значения «смиренные», «кроткие» и «угнетённые», поэтому альтернативы отмечены в сноске.
- source_word: וְאִישׁ וְאָבִיו
  choice: и мужчина, и его отец
  rationale: Сохраняются единственное число и семейная связь; перевод не добавляет указания на одновременность действий.
- source_word: יֵלְכוּ אֶל הַנַּעֲרָה
  choice: вступают в связь с одной и той же девушкой
  rationale: В контексте выражение служит сексуальным эвфемизмом. «Вступают в связь» ясно и невульгарно передаёт смысл; «одной и той же» делает по-русски явной соотнесённость обоих мужчин с определённой девушкой, не уточняя её положения.
- source_word: לְמַעַן חַלֵּל
  choice: тем самым оскверняя
  rationale: Конструкция может обозначать цель или следствие. В русском контексте такая формулировка естественно связывает поступок с осквернением имени Бога, не приписывая действующим лицам обязательно сформулированного намерения.
- source_word: אֶת שֵׁם קָדְשִׁי
  choice: Моё святое имя
  rationale: Естественная русская передача еврейского выражения, сохраняющая его богословскую и заветную значимость.
theological_decisions:
- issue: Характер проступка в וְאִישׁ וְאָבִיו יֵלְכוּ אֶל הַנַּעֲרָה
  choice: Мужчина и его отец вступают в половую связь с одной и той же девушкой, чем оскверняют святое имя Бога.
  alternative: Возможен намёк на культовую проституцию либо эксплуатацию рабыни или служанки; проступок также может подчёркивать нарушение семейной чести, близкое к запретам кровосмешения.
  rationale: Еврейский текст прямо говорит лишь о мужчине, его отце и определённой девушке. Он не называет её ни культовой проституткой, ни рабыней, поэтому такие уточнения не внесены в основной текст.
- issue: Цель или следствие в לְמַעַן חַלֵּל
  choice: «тем самым оскверняя» передаёт поступок как ведущий к осквернению Божьего имени.
  alternative: «чтобы осквернить» может быть понято как указание на намеренную цель.
  rationale: למען допускает целевой или результативный оттенок. Контекст не требует утверждать, что сознательной целью мужчин было осквернение Божьего имени.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Конкретный образ пыли и головы сохранён, но непрозрачный буквальный глагол передан контекстуально. Сексуальный смысл выражен ясно и сдержанно, без грубости и без добавления не названного в тексте социального или культового статуса девушки.
