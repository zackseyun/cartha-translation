source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י יִשְׂרָאֵ֔ל וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל מִכְרָ֤/ם בַּ/כֶּ֨סֶף֙ צַדִּ֔יק וְ/אֶבְי֖וֹן בַּ/עֲב֥וּר נַעֲלָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/006.yaml
  text: 'Thus says Yahweh: “For three transgressions of Israel[a], and for four, I will not revoke the punishment, because they sell the righteous for silver, and the needy for a pair of sandals.”'
translation:
  language: ru
  text: 'Так говорит Яхве: «За три преступления Израиля и за четыре не отменю этого[a], потому что они продают праведника за серебро, а бедняка — за пару сандалий».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не отвращу этого»; речь идёт о возвещённом суде, который Яхве не отменит.'
    reason: Еврейская фраза буквально говорит о том, что Яхве не обратит «этого» назад, но не называет подразумеваемый объект прямо.
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена формула пророческого вестника и передано личное имя Бога, стоящее в еврейском тексте.
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי יִשְׂרָאֵל וְעַל אַרְבָּעָה
  choice: За три преступления Израиля и за четыре
  rationale: Формула числового нарастания сохранена без поясняющего перефразирования; «преступления» передаёт бунтарский и нравственно-правовой оттенок פֶּשַׁע.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: не отменю этого
  rationale: Фраза передаёт окончательность решения, но местоименное «этого» сохраняет эллиптичность еврейского текста и не называет подразумеваемый суд прямо.
- source_word: מִכְרָם
  choice: потому что они продают
  rationale: Инфинитивная конструкция указывает на основание суда; личная форма естественна по-русски.
- source_word: בַּכֶּסֶף
  choice: за серебро
  rationale: Сохранено конкретное значение כֶּסֶף, не сведённое к более общему слову «деньги».
- source_word: צַדִּיק
  choice: праведника
  rationale: Сохраняет основное значение слова и связь с библейской лексикой праведности; в данном судебно-социальном контексте может также подразумеваться человек, который прав или невиновен.
- source_word: אֶבְיוֹן
  choice: бедняка
  rationale: Естественно и ясно обозначает неимущего, нуждающегося человека.
- source_word: בַּעֲבוּר נַעֲלָיִם
  choice: за пару сандалий
  rationale: Двойственное число передано словом «пара»; выражение сохраняет образ ничтожной цены человеческой жизни или свободы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Передано личное имя, непосредственно присутствующее в исходном тексте, без замены титулом.
- issue: Смысл לֹא אֲשִׁיבֶנּוּ
  choice: не отменю этого
  alternative: не отвращу этого
  rationale: Объект действия в еврейском тексте выражен местоименно и остаётся неуточнённым. Основной текст звучит естественно, не вставляя слова «наказание» или «суд», а более буквальная возможность отмечена в сноске.
- issue: Значение צַדִּיק в социально-судебном контексте
  choice: праведника
  alternative: невиновного
  rationale: «Праведника» сохраняет более широкий нравственный смысл и лексическую связь с праведностью, не исключая контекстуального значения человека, правого в судебном деле.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Синтаксический параллелизм и краткость обвинения сохранены; архаизмы и конфессионально маркированные толкования не добавлялись.
