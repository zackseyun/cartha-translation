reference: Amos 2:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י יְהוּדָ֔ה וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַֽל מָאֳסָ֞/ם אֶת תּוֹרַ֣ת יְהוָ֗ה וְ/חֻקָּי/ו֙ לֹ֣א שָׁמָ֔רוּ וַ/יַּתְעוּ/ם֙ כִּזְבֵי/הֶ֔ם אֲשֶׁר הָלְכ֥וּ אֲבוֹתָ֖/ם אַחֲרֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/004.yaml
  text: 'Thus says Yahweh: “For three transgressions of Judah[a], and for four, I will not turn it back, because they have rejected the law of Yahweh and have not kept his statutes; and their lies have led them astray[c][b], after which their fathers walked.”'
translation:
  language: ru
  text: 'Так говорит Яхве: «За три преступления Иуды и за четыре не возьму этого назад[a], потому что они отвергли закон[b] Яхве и не соблюдали его установлений. Их ложь[c] ввела их в заблуждение — за ней следовали и их предки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не отменю этого»; возможно, подразумевается объявленный приговор или наказание.'
    reason: Личный суффикс у глагола указывает на объект, однако сам объект в еврейском тексте прямо не назван.
  - marker: b
    text: 'Или: «наставление».'
    reason: Еврейское תּוֹרָה означает не только закон в узком смысле, но также учение или наставление.
  - marker: c
    text: «Их ложь» может подразумевать ложных богов, идолов или обманчивые формы поклонения, которым следовали их предки.
    reason: В пророческом употреблении слово «ложь» нередко имеет культовый оттенок, но здесь сохраняется более широкое буквальное значение.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: פִּשְׁעֵי
  choice: преступления
  rationale: Слово передаёт тяжесть нравственных и заветных нарушений и естественно звучит в повторяющейся формуле Амоса.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: не отменю этого
  rationale: Краткая формулировка сохраняет невыраженный прямо объект местоименного суффикса; по контексту подразумевается объявленный приговор или наказание.
- source_word: מָאֳסָם
  choice: они отвергли
  rationale: Глагол выражает сознательное неприятие наставления Яхве; «отвергли» ясно и не усиливает значение без необходимости.
- source_word: תּוֹרַת יְהוָה
  choice: закон Яхве
  rationale: В контексте заветных обязательств «закон» является естественной и узнаваемой передачей תּוֹרָה, хотя более широкое значение «наставление» отмечено в сноске.
- source_word: חֻקָּיו
  choice: его установления
  rationale: «Установления» передаёт нормативный, заветно-правовой смысл слова и остаётся понятным современному читателю.
- source_word: שָׁמָרוּ
  choice: не соблюдали
  rationale: В сочетании с установлениями «соблюдали» естественно выражает требуемую верность и послушание.
- source_word: וַיַּתְעוּם
  choice: ввела их в заблуждение
  rationale: Каузативное значение глагола передано как действие, заставившее людей сбиться с верного пути.
- source_word: כִּזְבֵיהֶם
  choice: их ложь
  rationale: Сохранено прямое значение «ложь, обман» без подстановки более узкого толкования «идолы» или «ложные боги».
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם אַחֲרֵיהֶם
  choice: за ней следовали и их предки
  rationale: Оборот «идти вслед за» естественно передан глаголом «следовать»; местоимение связывает придаточную часть с предшествующей «ложью».
theological_decisions:
- issue: Значение формулы לֹא אֲשִׁיבֶנּוּ
  choice: «не отменю этого» без уточнения объекта
  alternative: «не отменю наказания»; «не отведу его»; «не отступлю»
  rationale: 'Еврейская формула эллиптична: местоименный объект присутствует, но его содержание прямо не названо. Перевод не вводит «наказание» в основной текст, хотя контекст делает такое понимание вероятным.'
- issue: Референт כִּזְבֵיהֶם
  choice: буквальное «их ложь»
  alternative: «их ложные боги»; «их идолы»
  rationale: В пророческой речи «ложь» может обозначать ложных богов или обманчивое идолопоклонство, однако само слово не называет идолов прямо. Более узкое культовое понимание вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Синтаксис формулы «за три… и за четыре» сохранён как характерный риторический приём Амоса. Формы понятны обычному читателю, при этом эллиптичность формулы суда и возможный культовый смысл слова «ложь» не устранены.
