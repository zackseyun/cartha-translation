base_translation:
  language: en
  yaml_path: translation/ot/amos/002/015.yaml
  text: And the one who grasps the bow will not stand[a], and the swift of foot will not escape[c][b], and the rider of the horse will not save his life.
translation:
  language: ru
  text: И держащий лук не устоит[a], и быстроногий не спасётся[b], и всадник на коне не спасёт свою жизнь[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лучник не устоит»; или: «не удержит своих позиций».'
    reason: «Держащий лук» — буквальное причастное выражение, которое может обозначать лучника; «не устоит» в военном контексте может означать неспособность удержать позицию.
  - marker: b
    text: 'Или: «не убежит».'
    reason: Глагол מלט допускает более конкретное контекстуальное понимание бегства от опасности.
  - marker: c
    text: 'Или: «не спасётся».'
    reason: Выражение «спасти свою жизнь» может быть передано возвратной формой без изменения основного смысла.
lexical_decisions:
- source_word: תֹפֵשׂ הַקֶּשֶׁת
  choice: держащий лук
  rationale: Причастное выражение буквально обозначает «держащего лук» и в данном военном контексте — лучника. Выбранный вариант сохраняет конкретный образ еврейского текста, не заменяя его названием воина.
- source_word: לֹא יַעֲמֹד
  choice: не устоит
  rationale: Глагол עמד означает «стоять»; в контексте поражения форма «не устоит» естественно передаёт как буквальный образ, так и неспособность удержаться перед натиском.
- source_word: קַל בְּרַגְלָיו
  choice: быстроногий
  rationale: Краткое и естественное русское соответствие выражению «быстрый ногами», обозначающему человека, способного быстро бежать.
- source_word: לֹא יְמַלֵּט
  choice: не спасётся
  rationale: В средней строке глагол מלט употреблён без выраженного дополнения и означает, что быстроногий не сумеет избежать опасности или спастись.
- source_word: רֹכֵב הַסּוּס
  choice: всадник
  rationale: Идиоматичное русское обозначение человека, едущего верхом на коне; сохраняет военный смысл и единственное число исходного текста.
- source_word: לֹא יְמַלֵּט נַפְשׁוֹ
  choice: не спасёт своей жизни
  rationale: נפשׁ здесь означает жизнь человека, а сочетание с מלט — сохранение или спасение жизни. Формулировка близка к структуре еврейского текста и ясна по-русски.
