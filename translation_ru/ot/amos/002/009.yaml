source:
  edition: WLC
  text: וְ/אָ֨נֹכִ֜י הִשְׁמַ֤דְתִּי אֶת הָֽ/אֱמֹרִי֙ מִ/פְּנֵי/הֶ֔ם אֲשֶׁ֨ר כְּ/גֹ֤בַהּ אֲרָזִים֙ גָּבְה֔/וֹ וְ/חָסֹ֥ן ה֖וּא כָּֽ/אַלּוֹנִ֑ים וָ/אַשְׁמִ֤יד פִּרְי/וֹ֙ מִ/מַּ֔עַל וְ/שָׁרָשָׁ֖י/ו מִ/תָּֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/009.yaml
  text: Yet I destroyed the Amorite before them[a], whose height was like the height of cedars, and he was strong like the oaks[b]; I destroyed his fruit above and his roots beneath.
translation:
  language: ru
  text: А ведь Я истребил перед ними аморея[a], который был высок, как кедры, и крепок, как дубы. Я истребил его плод наверху и его корни внизу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «амореев». В еврейском тексте стоит единственное число «аморей», собирательно обозначающее весь народ.'
    reason: lexical_alternative
  - marker: b
    text: «Плод» и «корни» продолжают образ дерева и указывают на полное уничтожение — сверху донизу.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: А ведь Я
  rationale: Сочетание союза с подчёркнутым местоимением выражает контраст и усиление; «А ведь Я» естественно передаёт оба оттенка в современном русском языке.
- source_word: הִשְׁמַדְתִּי / וָאַשְׁמִיד
  choice: истребил / Я истребил
  rationale: Каузативная форма глагола שׁמד означает уничтожение. Повтор одного русского глагола сохраняет риторический повтор еврейского текста.
- source_word: הָאֱמֹרִי
  choice: аморея
  rationale: Сохранено собирательное единственное число оригинала, представляющее весь народ как одного исполинского противника.
- source_word: מִפְּנֵיהֶם
  choice: перед ними
  rationale: 'Сохранён пространственный образ еврейской идиомы: Бог устранил аморея с пути и из присутствия Израиля.'
- source_word: אֲשֶׁר כְּגֹבַהּ אֲרָזִים גָּבְהוֹ
  choice: который был высок, как кедры
  rationale: Естественная русская формулировка ясно передаёт сравнение необычайного роста с высотой кедров, не воспроизводя тяжеловесно повтор слова «высота».
- source_word: וְחָסֹן הוּא כָּאַלּוֹנִים
  choice: и крепок, как дубы
  rationale: חָסֹן обозначает силу и прочность; «крепок» поддерживает образ могучего дерева. אַלּוֹנִים здесь передано традиционным и понятным словом «дубы».
- source_word: פִּרְיוֹ מִמַּעַל וְשָׁרָשָׁיו מִתָּחַת
  choice: его плод наверху и его корни внизу
  rationale: Буквальные элементы древесного образа сохранены; противопоставление верха и низа выражает полноту уничтожения.
theological_decisions:
- issue: Собирательное единственное число в обозначении амореев
  choice: 'Сохранить формы единственного числа: «аморея, который… его».'
  alternative: 'Передать множественным числом: «амореев, которые… их».'
  rationale: Еврейский текст олицетворяет народ в образе одного могучего дерева. Единственное число сохраняет эту яркую риторику, а примечание предотвращает ошибочное понимание как указания на одного человека.
- issue: Смысл плода и корней
  choice: Сохранить древесную метафору без истолкования в основном тексте.
  alternative: Передать «потомков» или непосредственно пояснить полное истребление.
  rationale: Оригинал намеренно продолжает образ дерева. Перевод не должен преждевременно сводить многозначный образ к одному истолкованию; его общий смысл пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Конструкция «А ведь Я» передаёт контрастное ударение; краткие формы «высок» и «крепок» делают параллелизм ясным. Собирательное единственное число и древесная образность оригинала сохранены.
