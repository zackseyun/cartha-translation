  text: וַ/תַּשְׁק֥וּ אֶת הַ/נְּזִרִ֖ים יָ֑יִן וְ/עַל הַ/נְּבִיאִים֙ צִוִּיתֶ֣ם לֵ/אמֹ֔ר לֹ֖א תִּנָּבְאֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/012.yaml
  text: But you made the Nazirites drink wine[a], and you commanded the prophets, saying[b], ‘Do not prophesy.’
translation:
  language: ru
  text: 'А вы поили назореев вином[a] и приказывали пророкам: «Не пророчествуйте»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «давали назореям пить вино». Назореи были людьми, особо посвящёнными Богу по обету, который включал воздержание от вина.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «Вы не должны пророчествовать».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּשְׁקוּ
  choice: вы поили
  rationale: Каузативная форма שׁקה означает «давать пить, поить». В современном русском «поили ... вином» естественно передаёт действие, не уточняя сверх текста, было ли применено принуждение.
- source_word: הַנְּזִרִים
  choice: назореев
  rationale: Традиционный русский термин сохраняет особую библейскую категорию людей, посвящённых Богу по обету, а не сводит её к общему обозначению посвящённых.
- source_word: יָיִן
  choice: вином
  rationale: Прямое значение слова; творительный падеж естественно сочетается с русским глаголом «поить».
- source_word: וְעַל הַנְּבִיאִים צִוִּיתֶם
  choice: и приказывали пророкам
  rationale: При צוה предлог עַל отмечает лиц, на которых распространяется приказ. Русский дательный передаёт конструкцию естественно и точно.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: В этой формуле инфинитив вводит содержание приказа; в современном русском его естественно передать пунктуационно, без тяжеловесного «говоря».
- source_word: לֹא תִּנָּבְאוּ
  choice: Не пророчествуйте
  rationale: Отрицание с формой второго лица множественного числа в контексте приказа выражает прямой запрет; русский отрицательный императив передаёт это ясно и лаконично.
theological_decisions:
- issue: Передача הַנְּזִרִים с сохранением религиозно-культурной конкретики
  choice: назореев
  alternative: посвящённых
  rationale: «Назореи» сохраняет указание на людей, особо посвящённых Богу и обязанных воздерживаться от вина; обобщённое «посвящённые» ослабило бы связь проступка с их обетом.
- issue: Степень принуждения в וַתַּשְׁקוּ
  choice: поили
  alternative: заставляли пить
  rationale: Каузатив допускает значение «давали пить/поили» и сам по себе не требует физического принуждения. Выбор сохраняет обвинительный смысл, не усиливая его сверх еврейского текста.
translation_notes:
  register: Современный литературный русский, простой и достойный по тону. Начальное «А» передаёт контраст וַ־ с предшествующим Божьим даром назореев и пророков. Технический библейский термин «назареи» сохранён с пояснением в сноске; формула לֵאמֹר передана естественным русским оформлением прямой речи.
