  yaml_path: translation/ot/amos/002/003.yaml
  text: And I will cut off the judge from her midst[a], and I will kill all her officials with him,” says Yahweh.
translation:
  language: ru
  text: И истреблю правителя из её среды[a], и вместе с ним умерщвлю всех её сановников, — говорит Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «судью». Еврейское слово может обозначать как судебное должностное лицо, так и, в данном контексте, правителя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: И истреблю
  rationale: Порода hифиль глагола כרת выражает решительное устранение, вплоть до уничтожения. «Истреблю» естественно передаёт угрозу суда и соответствует последующему «умерщвлю».
- source_word: שׁוֹפֵט
  choice: правителя
  rationale: Существительное буквально может означать судью, но в контексте политического руководства Моава и параллели с שָׂרֶיהָ обозначает верховного правителя; неоднозначность отмечена в сноске.
- source_word: מִקִּרְבָּהּ
  choice: из среды её
  rationale: Форма означает удаление изнутри Моава; женский суффикс сохраняет олицетворение страны. Такой порядок слов придаёт фразе dignified biblical register without obscuring meaning.
- source_word: וְכָל שָׂרֶיהָ
  choice: всех её вождей
  rationale: שׂרים — представители правящей знати или руководители. «Вожди» передаёт политико-военное руководство, не сужая значение до современных чиновников и не предполагая наследных князей.
- source_word: אֶהֱרֹג עִמּוֹ
  choice: вместе с ним умерщвлю
  rationale: הרג прямо означает лишить жизни, а עִמּוֹ связывает судьбу руководителей с единственным названным правителем. «Умерщвлю» сохраняет прямоту при достойном пророческом регистре.
- source_word: אָמַר יְהוָה
  choice: говорит Яхве
  rationale: Пророческая формула естественно передана настоящим временем; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон как собственное имя; «Яхве» сохраняет это различие и не заменяет имя титулом.
- issue: Статус שׁוֹפֵט
  choice: правитель
  alternative: судья
  rationale: В данном контексте речь, вероятнее всего, о главе Моава, однако буквальное судебное значение действительно возможно и поэтому сохранено в сноске, а не исключено.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Женское олицетворение Моава сохранено в выражениях «из среды её» и «её вождей».
