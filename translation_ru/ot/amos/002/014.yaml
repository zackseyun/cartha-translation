  text: וְ/אָבַ֤ד מָנוֹס֙ מִ/קָּ֔ל וְ/חָזָ֖ק לֹא יְאַמֵּ֣ץ כֹּח֑/וֹ וְ/גִבּ֖וֹר לֹא יְמַלֵּ֥ט נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/014.yaml
  text: Flight will perish from the swift[a], and the strong will not strengthen his power[d][c][b], and the warrior will not save his life.
translation:
  language: ru
  text: И у быстрого не останется пути к бегству[a], сильный не сможет собрать свои силы[b], и воин не спасёт своей жизни[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у быстрого исчезнет бегство»; также возможно: «у быстрого не будет спасения бегством».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сильный не укрепит своей силы»; также возможно: «не сможет воспользоваться своей силой».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское נֶפֶשׁ здесь означает «жизнь» или «самого себя», а не обязательно «душу».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבַד מָנוֹס מִקָּל
  choice: у быстрого не останется пути к бегству
  rationale: Оборот означает полную утрату возможности бежать. По-русски эта формулировка естественнее буквального «бегство исчезнет у быстрого» и сохраняет значение отделения, выраженное предлогом מִן.
- source_word: חָזָק
  choice: сильный
  rationale: Прилагательное употреблено субстантивированно и обозначает физически сильного человека; это также позволяет отличить его от следующего גִּבּוֹר.
- source_word: יְאַמֵּץ כֹּחוֹ
  choice: не сможет собрать свои силы
  rationale: Пиэль глагола אמץ с כֹּח выражает укрепление или мобилизацию собственной силы. Русский оборот «собрать силы» естественно передаёт неспособность воспользоваться своей мощью, не воспроизводя неуклюжую тавтологию.
- source_word: גִּבּוֹר
  choice: воин
  rationale: В контексте суда и военного поражения слово обозначает могучего бойца; «воин» естественно передаёт этот оттенок.
- source_word: יְמַלֵּט נַפְשׁוֹ
  choice: не спасёт своей жизни
  rationale: Здесь נפש означает жизнь или самого человека перед лицом смерти, а מלט в пиэле — спасти, избавить от опасности.
theological_decisions:
- issue: Значение נֶפֶשׁ
  choice: жизнь
  alternative: душа; самого себя
  rationale: В данном контексте речь идёт о сохранении жизни при бедствии, а не о противопоставлении материального тела нематериальной душе.
translation_notes:
  register: Современный литературный русский язык с пророческой торжественностью. Три параллельные части сохранены; буквальные еврейские обороты переданы естественными русскими выражениями без устранения смысловых альтернатив.
