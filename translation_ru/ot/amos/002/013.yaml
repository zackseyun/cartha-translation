base_translation:
  language: en
  yaml_path: translation/ot/amos/002/013.yaml
  text: Look[a], I am pressing down beneath you[b], as a cart presses down when it is full of sheaves.
translation:
  language: ru
  text: Вот, Я давлю под вами[a], как давит повозка, нагруженная снопами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейскую фразу можно также понять: «Я придавлю вас на вашем месте» или «Я отягощу вас». Форма глагола может обозначать как совершающееся действие, так и близкое будущее: «Я надавлю под вами».'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательно-эмфатическое введение пророческого объявления естественным современным русским словом.
- source_word: אָנֹכִי
  choice: Я
  rationale: Самостоятельное местоимение подчёркивает действующего; в русском это подчёркивание поддерживается порядком слов после «Вот» и прописной буквой в речи Бога.
- source_word: מֵעִיק
  choice: давлю
  rationale: Редкий глагол выражает давление или отягощение. «Давлю» сохраняет связь с образом тяжело нагруженной повозки и длительно-наступающий характер формы.
- source_word: תַּחְתֵּיכֶם
  choice: под вами
  rationale: Сохраняет прямое пространственное значение предлога и не устраняет необычность еврейского образа посредством вставки невыраженного дополнения «вас».
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Кратко и естественно вводит сравнение.
- source_word: תָּעִיק
  choice: давит
  rationale: Повтор того же русского корня передаёт повтор еврейского глагола в обеих частях стиха.
- source_word: הָעֲגָלָה
  choice: повозка
  rationale: Нейтральное современное обозначение сельскохозяйственного колёсного средства; в родовом сравнении определённый артикль по-русски отдельно не выражается.
- source_word: הַמְלֵאָה לָהּ
  choice: нагруженная
  rationale: Естественно передаёт состояние наполненной грузом повозки; местоименный дательный элемент не требует буквального воспроизведения.
- source_word: עָמִיר
  choice: снопами
  rationale: Обозначает собранные в связки стебли зерновых и точно соответствует земледельческому образу.
theological_decisions:
- issue: Кого или что Бог подвергает давлению
  choice: Сохранено пространственное «давлю под вами» без добавления прямого дополнения.
  alternative: «Придавлю вас на вашем месте» или «отягчу вас».
  rationale: В еврейском тексте нет явно выраженного дополнения «вас», а תַּחְתֵּיכֶם буквально означает «под вами». Необычность образа сохранена, а возможное идиоматическое понимание вынесено в примечание, чтобы не предрешать смысл.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис намеренно сохраняет необычный пространственный образ оригинала; примечание раскрывает основные допустимые варианты без конфессионального толкования.
