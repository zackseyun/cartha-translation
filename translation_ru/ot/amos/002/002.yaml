lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: И пошлю
  rationale: Союз сохраняет связь с предшествующим приговором, а форма первого лица прямо передаёт действие Бога.
- source_word: אֵשׁ בְּמוֹאָב
  choice: огонь на Моав
  rationale: Естественная русская конструкция, передающая направленное против Моава действие суда.
- source_word: וְאָכְלָה
  choice: и пожрёт он
  rationale: Глагол буквально описывает огонь как пожирающий; местоимение ясно указывает на огонь и сохраняет образную силу.
- source_word: אַרְמְנוֹת
  choice: твердыни
  rationale: Слово обозначает укреплённые дворцовые сооружения; «твердыни» передаёт их оборонительный характер, не сужая значение до обычных дворцов.
- source_word: הַקְּרִיּוֹת
  choice: Кериота
  rationale: В контексте наиболее вероятно географическое название; форма родительного падежа естественна после «твердыни».
- source_word: וּמֵת מוֹאָב
  choice: И погибнет Моав
  rationale: Будущее значение пророческой последовательности сохранено; «погибнет» естественно применяется к олицетворённому народу и не ослабляет приговор.
- source_word: בְּשָׁאוֹן
  choice: среди грохота
  rationale: Передаёт шум и смятение разрушения; «грохот» конкретнее и естественнее в военном контексте.
- source_word: בִּתְרוּעָה
  choice: под боевой клич
  rationale: В данном военном контексте слово, вероятно, означает воинственный крик; перевод отличает его от следующего звука рога.
- source_word: בְּקוֹל שׁוֹפָר
  choice: под звук рога
  rationale: Шофар — сигнальный рог; «рог» сохраняет историческую конкретность предмета, а не представляет его современной трубой.
