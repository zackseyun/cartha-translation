  yaml_path: translation/ot/amos/002/005.yaml
  text: So I will send fire upon Judah[a], and it will devour the citadels of Jerusalem.
translation:
  language: ru
  text: И пошлю огонь на Иудею, и он пожрёт твердыни[a] Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дворцы» или «крепости». Еврейское слово может обозначать укреплённые дворцовые сооружения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: И пошлю
  rationale: Союз ו связывает этот приговор с предыдущим контекстом, а форма глагола передаёт действие Бога в будущем. Простое «И» сохраняет структуру еврейской пророческой формулы без добавления явно не выраженного причинно-следственного оттенка.
- source_word: אֵשׁ
  choice: огонь
  rationale: Прямое соответствие еврейскому אֵשׁ; перевод не уточняет, является ли огонь буквальным, образным или связанным с военным разорением.
- source_word: בִּיהוּדָה
  choice: на Иудею
  rationale: В формуле суда с глаголом «послать» предлог ב естественно передаётся по-русски как «на», выражая направленность бедствия против Иудеи.
- source_word: וְאָכְלָה
  choice: и он пожрёт
  rationale: Глагол אכל буквально означает «есть», а при огне как подлежащем образно значит «пожирать». «Пожрёт» сохраняет яркость метафоры и возвышенный пророческий регистр.
- source_word: אַרְמְנוֹת
  choice: твердыни
  rationale: Слово может обозначать укреплённые дворцовые сооружения или крепости. «Твердыни» передаёт оборонительный характер объектов, а сноска сохраняет возможный дворцовый оттенок.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалима
  rationale: Общепринятая русская форма названия города, поставленная в родительном падеже после «твердыни».
theological_decisions:
- issue: Характер посылаемого огня
  choice: Сохранить прямой образ Божьего суда, не уточняя способ его осуществления.
  alternative: Истолковать огонь исключительно как буквальный пожар либо прямо назвать его образом военного нашествия.
  rationale: Сам стих возвещает, что Бог пошлёт огонь, который пожрёт твердыни Иерусалима, но не определяет точный механизм суда. Перевод сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. «Пожрёт» и «твердыни» уместны в возвышенном библейском контексте и при этом остаются понятными современному читателю.
