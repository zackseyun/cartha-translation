reference: Amos 2:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וָ/אָקִ֤ים מִ/בְּנֵי/כֶם֙ לִ/נְבִיאִ֔ים וּ/מִ/בַּחוּרֵי/כֶ֖ם לִ/נְזִרִ֑ים הַ/אַ֥ף אֵֽין זֹ֛את בְּנֵ֥י יִשְׂרָאֵ֖ל נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/011.yaml
  text: And I raised up some of your sons to be prophets[a], and some of your young men to be Nazirites. Is this not so[b], O sons of Israel? declares Yahweh.
translation:
  language: ru
  text: И Я поставил некоторых из ваших сыновей пророками, а некоторых из ваших юношей — назореями[a]. Разве это не так, сыны Израиля[b]? — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Назореи — люди, особо посвящённые Богу и связанные назорейским обетом; возможный описательный перевод: «посвящённые».'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «сыновья Израиля»; обращение относится к народу Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָקִים
  choice: И Я поставил
  rationale: Хифиль глагола קום означает «воздвигнуть, поставить, вызвать к служению». «Поставил» естественно передаёт Божье назначение на определённое служение.
- source_word: מִבְּנֵיכֶם לִנְבִיאִים
  choice: некоторых из ваших сыновей пророками
  rationale: Предлог מִן имеет партитивный смысл («из числа»), а לְ обозначает роль или результат назначения.
- source_word: וּמִבַּחוּרֵיכֶם
  choice: а некоторых из ваших юношей
  rationale: בָּחוּר обозначает молодых мужчин; партитивное «некоторых из» сохраняет параллелизм с первой частью стиха.
- source_word: לִנְזִרִים
  choice: назореями
  rationale: נָזִיר — техническое обозначение человека, особо посвящённого Богу по обету; традиционный русский термин «назорей» сохраняет конкретную израильскую институцию.
- source_word: הַאַף אֵין זֹאת
  choice: Разве это не так
  rationale: Риторический вопрос предполагает утвердительный ответ; «это» передаёт указательное זֹאת.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально соответствует мужскому множественному «сыновья Израиля» и сохраняет торжественное заветное обращение ко всему народу.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: נְאֻם вводит авторитетное пророческое изречение, а личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; передача личным именем сохраняет его отличие от титула «Господь».
- issue: Передача נְזִרִים
  choice: назореями
  alternative: посвящёнными
  rationale: Технический термин не сводится к общему понятию посвящённости; пояснение вынесено в сноску.
- issue: Передача обращения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: народ Израиля
  rationale: Сохранён мужской образ исходного текста и традиционное заветное наименование, при этом сноска разъясняет национальный охват обращения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. «Сыны Израиля» сознательно сохраняет заветную формулу оригинала; тире перед заключительной формулой ясно отделяет слова Яхве от авторского указания.
