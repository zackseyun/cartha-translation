base_translation:
  language: en
  yaml_path: translation/ot/amos/002/010.yaml
  text: Yet I brought you up from the land of Egypt[a], and I led you in the wilderness forty years, to take possession of the land of the Amorites.
translation:
  language: ru
  text: А ведь это Я вывел вас из земли Египта и сорок лет водил вас по пустыне, чтобы вы овладели землёй амореев.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «землёй аморея»; в еврейском единственное число употреблено в собирательном значении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: А ведь это Я
  rationale: Самостоятельное местоимение אָנֹכִי при союзе подчёркивает действующего и в контексте противопоставляет Божьи благодеяния неверности Израиля. Оборот «А ведь это Я» естественно передаёт и связь с предыдущей речью, и риторическое ударение.
- source_word: הֶעֱלֵיתִי
  choice: вывел
  rationale: Каузатив глагола עלה буквально содержит идею движения вверх, но в русском повествовании об исходе устойчивое и ясное соответствие — «вывел». Оно точно обозначает избавление из Египта без неестественного оборота «поднял вас».
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из Египетской земли
  rationale: Сохранено явно выраженное אֶרֶץ («земля, страна»); форма «Египетская земля» звучит естественно и достойно в библейском историческом контексте.
- source_word: וָאוֹלֵךְ אֶתְכֶם
  choice: водил вас
  rationale: Hiphil глагола הלך означает «вести, направлять». Несовершенный по смыслу русский глагол «водил» уместно выражает длительное Божье водительство на протяжении сорока лет.
- source_word: בַּמִּדְבָּר
  choice: по пустыне
  rationale: מִדְבָּר обозначает пустынную, необитаемую местность. Русское «по пустыне» естественно сочетается с глаголом движения и не добавляет идеи прямого прохождения насквозь.
- source_word: אַרְבָּעִים שָׁנָה
  choice: сорок лет
  rationale: Прямое и идиоматичное соответствие числовому выражению.
- source_word: לָרֶשֶׁת
  choice: чтобы вы овладели
  rationale: Инфинитив ירשׁ здесь выражает цель и активное вступление во владение землёй. «Овладели» сохраняет этот смысл, не сводя его к отвлечённому обладанию и не внося дополнительной богословской окраски слова «унаследовали».
- source_word: אֶרֶץ הָאֱמֹרִי
  choice: землёй амореев
  rationale: Еврейское הָאֱמֹרִי стоит в единственном числе, но употреблено собирательно. Русское множественное «амореев» ясно и естественно передаёт народ как совокупность; форма оригинала отмечена в сноске.
theological_decisions:
- issue: Собирательное единственное число הָאֱמֹרִי
  choice: 'В основном тексте: «землёй амореев»'
  alternative: 'Буквально: «землёй аморея»'
  rationale: Единственное число в еврейском имеет собирательное значение и обозначает народ. Русское «земля аморея» может ошибочно восприниматься как владение одного человека, поэтому естественное множественное число вынесено в текст, а формальная особенность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Эмфаза исходного местоимения передана оборотом «А ведь это Я»; синтаксис сделан плавным и понятным для обычного читателя.
