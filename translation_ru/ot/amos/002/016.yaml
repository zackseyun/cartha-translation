  text: וְ/אַמִּ֥יץ לִבּ֖/וֹ בַּ/גִּבּוֹרִ֑ים עָר֛וֹם יָנ֥וּס בַּ/יּוֹם הַ/ה֖וּא נְאֻם יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/016.yaml
  text: Even the stouthearted among the warriors will flee naked on that day,” declares Yahweh[a].
translation:
  language: ru
  text: «Даже храбрец среди воинов убежит нагим в тот день», — возвещает Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַמִּיץ לִבּוֹ
  choice: самый отважный
  rationale: 'Сочетание буквально означает «крепкий/сильный сердцем» и обозначает человека храброго и решительного. В данном контексте конструкция передаёт превосходную степень по смыслу: даже наиболее отважный воин обратится в бегство.'
- source_word: בַּגִּבּוֹרִים
  choice: среди воинов
  rationale: Слово обозначает сильных бойцов; «воины» естественно и ясно сохраняет военный смысл контекста.
- source_word: עָרוֹם
  choice: нагим
  rationale: Прямое значение — «нагой». Эта передача сохраняет резкий образ панического бегства, не уточняя без основания, был ли человек раздет или лишился одежды при бегстве.
- source_word: יָנוּס
  choice: убежит
  rationale: Глагол означает бегство от опасности; «убежит» прямо и естественно передаёт будущность и стремительность действия.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Устоявшееся и естественное русское соответствие пророческой временной формуле.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: נְאֻם — торжественная формула пророческого изречения; «возвещает» передаёт её весомость, а имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация «Яхве» сохраняет его как имя и согласуется с предоставленным богословским решением.
- issue: Характер наготы при бегстве
  choice: нагим
  alternative: раздетым / без одежды
  rationale: Текст прямо говорит о наготе, но не объясняет её причину. Нейтральное «нагим» сохраняет смысл и не добавляет предположения, что одежду сорвали или бросили.
translation_notes:
  register: 'Современный литературный русский язык с кратким, торжественным ритмом пророческого суда. Сохранён резкий контраст: даже наиболее храбрый воин в панике бежит нагим.'
