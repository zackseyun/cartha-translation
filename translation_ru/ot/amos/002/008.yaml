  text: וְ/עַל בְּגָדִ֤ים חֲבֻלִים֙ יַטּ֔וּ אֵ֖צֶל כָּל מִזְבֵּ֑חַ וְ/יֵ֤ין עֲנוּשִׁים֙ יִשְׁתּ֔וּ בֵּ֖ית אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/008.yaml
  text: And on garments taken in pledge they stretch themselves out beside every altar[c][b][a], and in the house of their God they drink the wine of those they have fined.
translation:
  language: ru
  text: На одеждах, взятых в залог, они возлежат у каждого жертвенника[a] и в доме своего Бога[c] пьют вино тех, кого оштрафовали[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они растягиваются у каждого жертвенника».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вино оштрафованных» или «вино наказанных». Возможно также: «вино, полученное в виде штрафа».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «в доме своих богов». Слово אֱלֹהִים имеет форму множественного числа, но часто обозначает единого Бога; в данном сочетании возможны оба понимания.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגָדִים חֲבֻלִים
  choice: одежды, взятые в залог
  rationale: בְּגָדִים — общее обозначение предметов одежды, а пассивное причастие חֲבֻלִים указывает на одежду, удерживаемую как залог. Формулировка сохраняет юридический и социальный смысл обвинения.
- source_word: יַטּוּ
  choice: возлежат
  rationale: Глагольная форма передаёт образ людей, растянувшихся или расположившихся лёжа. «Возлежат» естественно сочетается с пиршественно-культовой обстановкой и сохраняет оттенок самодовольного отдыха.
- source_word: אֵצֶל כָּל מִזְבֵּחַ
  choice: у каждого жертвенника
  rationale: 'אֵצֶל обозначает близость, а сочетание כָּל с существительным в единственном числе имеет распределительное значение: «у каждого».'
- source_word: יֵין עֲנוּשִׁים
  choice: вино тех, кого оштрафовали
  rationale: עֲנוּשִׁים связано с наложением наказания или денежного взыскания. Перевод сохраняет конструкцию принадлежности и не уточняет сверх текста, было ли вино непосредственно изъято как штраф или куплено на взысканные средства.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: в доме своего Бога
  rationale: Форма אֱלֹהִים морфологически множественна, но регулярно обозначает единого Бога и с местоименным суффиксом может означать «их Бог». В контексте пророческого обличения Израиля это чтение естественно, тогда как возможное множественное понимание отмечено в сноске.
theological_decisions:
- issue: Следует ли передать אֱלֹהֵיהֶם как «своего Бога» или «своих богов»
  choice: своего Бога
  alternative: своих богов
  rationale: Само окончание допускает морфологически множественное понимание, однако אֱלֹהִים часто употребляется как обозначение Бога Израиля. Обличение может быть намеренно направлено на нечестие, совершаемое в месте поклонения их же Богу. Альтернативное множественное прочтение сохраняется в сноске, чтобы не устранять реальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Возлежат» сохраняет культово-пиршественный образ, не становясь архаичным настолько, чтобы затруднить понимание. Порядок частей следует еврейскому параллелизму, а явные причинно-правовые уточнения, отсутствующие в источнике, вынесены в сноски.
