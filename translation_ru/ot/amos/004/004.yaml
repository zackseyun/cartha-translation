  text: בֹּ֤אוּ בֵֽית אֵל֙ וּ/פִשְׁע֔וּ הַ/גִּלְגָּ֖ל הַרְבּ֣וּ לִ/פְשֹׁ֑עַ וְ/הָבִ֤יאוּ לַ/בֹּ֨קֶר֙ זִבְחֵי/כֶ֔ם לִ/שְׁלֹ֥שֶׁת יָמִ֖ים מַעְשְׂרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/004.yaml
  text: Come to Bethel—and transgress; to Gilgal—and multiply transgression. Bring your sacrifices every morning[a], your tithes every three days,
translation:
  language: ru
  text: Идите в Вефиль — и грешите; в Галгал — и умножайте преступления! Приносите каждое утро ваши жертвы, каждые три дня[a] — ваши десятины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на третий день»; или: «через три дня».'
    reason: Неоднозначность временного выражения לִשְׁלֹשֶׁת יָמִים.
lexical_decisions:
- source_word: בֹּאוּ
  choice: Идите
  rationale: Императив множественного числа со значением движения к названным святилищам; по-русски «идите в» естественнее передаёт направление, чем буквальное «придите» без обозначенной точки речи.
- source_word: בֵית אֵל
  choice: Вефиль
  rationale: Устоявшаяся русская библейская передача названия места; значение «дом Бога» в основном тексте не раскрывается.
- source_word: וּפִשְׁעוּ
  choice: и преступайте
  rationale: פשע обозначает преступление, мятежное нарушение; глагольная форма сохраняет прямой и иронический императив оригинала.
- source_word: הַגִּלְגָּל
  choice: в Галгал
  rationale: Название места; направление восстанавливается из параллелизма с «идите в Вефиль».
- source_word: הַרְבּוּ לִפְשֹׁעַ
  choice: и умножайте преступления
  rationale: Каузативный императив с инфинитивом выражает наращивание проступков; формулировка сохраняет компактность и пророческую иронию.
- source_word: וְהָבִיאוּ
  choice: Приносите
  rationale: Императив продолжает иронический призыв; русский вид передаёт повторяющееся культовое действие в сочетании с временными выражениями.
- source_word: לַבֹּקֶר
  choice: каждое утро
  rationale: В контексте вероятно дистрибутивное значение, подчёркивающее усердную регулярность обрядов.
- source_word: זִבְחֵיכֶם
  choice: ваши жертвы
  rationale: Естественный и традиционный русский эквивалент культового זבח.
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: каждые три дня
  rationale: Выбрано вероятное дистрибутивное понимание в сатирическом описании частого принесения даров; реальная временная неоднозначность сохранена в сноске.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: ваши десятины
  rationale: Устоявшийся точный термин для культовых даров в размере десятой части.
theological_decisions:
- issue: Пророческая ирония в императивах
  choice: 'Сохранить прямые повелительные формы: «Идите… преступайте… умножайте… приносите».'
  alternative: Явно обозначить сарказм словами вроде «ступайте же» или «продолжайте грешить».
  rationale: Оригинал выражает насмешливое обличение посредством настоящих императивов; явное пояснение сарказма чрезмерно истолковало бы текст.
- issue: Временное выражение לִשְׁלֹשֶׁת יָמִים
  choice: 'В основном тексте: «каждые три дня».'
  alternative: «на третий день» или «через три дня».
  rationale: Выбранное чтение хорошо соответствует сатире на ритуальное усердие, но грамматически возможные альтернативы вынесены в сноску, чтобы не устранять неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллелизм и резкость иронических повелений сохранены; названия мест переданы в устоявшейся русской библейской форме.
