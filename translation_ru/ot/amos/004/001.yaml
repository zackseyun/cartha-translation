  source_fidelity: 'В целом перевод точно передаёт обращение, женский род адресатов, образ «коров Васана», социальное насилие и неоднозначное אֲדֹנֵיהֶם. Однако «и мы будем пить» в русском преимущественно звучит как простое последующее будущее действие, тогда как וְנִשְׁתֶּה после повеления здесь естественно выражает цель/ожидаемый результат: «чтобы мы пили».'
