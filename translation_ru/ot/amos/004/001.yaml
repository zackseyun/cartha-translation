language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שִׁמְע֞וּ הַ/דָּבָ֣ר הַ/זֶּ֗ה פָּר֤וֹת הַ/בָּשָׁן֙ אֲשֶׁר֙ בְּ/הַ֣ר שֹֽׁמְר֔וֹן הָ/עֹשְׁק֣וֹת דַּלִּ֔ים הָ/רֹצְצ֖וֹת אֶבְיוֹנִ֑ים הָ/אֹמְרֹ֥ת לַ/אֲדֹֽנֵי/הֶ֖ם הָבִ֥יאָ/ה וְ/נִשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/001.yaml
  text: Hear this word[a], you cows of Bashan, who are on the mountain of Samaria, who oppress the poor, who crush the needy, who say to their masters, “Bring[b], that we may drink.”
translation:
  language: ru
  text: 'Слушайте это слово, коровы Васана[a], живущие на горе Самарии! Вы притесняете бедняков, сокрушаете нуждающихся и говорите своим господам[b]: «Принеси, чтобы мы пили!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Васан — плодородная область к востоку от Иордана, славившаяся откормленным скотом. Здесь этот образ служит резким оскорблением роскошествующих притеснительниц.
    reason: cultural_note
  - marker: b
    text: 'Или: «своим мужьям». Еврейское слово אֲדֹנֵיהֶם в зависимости от контекста может означать господ, владык или мужей.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Форма повелительного наклонения во множественном числе вводит пророческое обращение. «Слушайте» естественно и точно передаёт призыв обратить внимание.
- source_word: הַדָּבָר הַזֶּה
  choice: это слово
  rationale: В пророческом контексте דָּבָר обозначает возвещаемое слово или весть; буквальное «слово» сохраняет характер пророческой формулы.
- source_word: פָּרוֹת הַבָּשָׁן
  choice: коровы васанские
  rationale: פָּרוֹת означает именно коров, то есть самок крупного рогатого скота. Прямой и резкий образ сохранён; прилагательное «васанские» звучит по-русски естественнее родительного оборота.
- source_word: בְּהַר שֹׁמְרוֹן
  choice: на горе Самарии
  rationale: הַר в единственном числе означает гору или возвышенность; перевод сохраняет форму и географическую привязку исходного текста.
- source_word: הָעֹשְׁקוֹת דַּלִּים
  choice: Вы притесняете бедняков
  rationale: עשׁק обозначает притеснение и эксплуатацию, нередко социально-экономическую. Переход к личной форме делает продолжение обращения естественным по-русски, не меняя его смысла.
- source_word: הָרֹצְצוֹת אֶבְיוֹנִים
  choice: сокрушаете нуждающихся
  rationale: רצץ несёт сильный образ сокрушения или раздавливания. «Сокрушаете» сохраняет насильственную метафору, а «нуждающихся» отличает אֶבְיוֹנִים от предшествующего דַּלִּים.
- source_word: הָאֹמְרֹת לַאֲדֹנֵיהֶם
  choice: говорите своим господам
  rationale: אֲדֹנִים может обозначать господ, владык или мужей. Основной текст сохраняет более широкое лексическое значение, а возможный брачный смысл отмечен в сноске.
- source_word: הָבִיאָה
  choice: Принеси
  rationale: 'Побудительная форма глагола בוא употреблена каузативно: «принеси». В еврейском тексте дополнение не названо, поэтому оно не добавлено и в переводе.'
- source_word: וְנִשְׁתֶּה
  choice: и мы будем пить
  rationale: Форма первого лица множественного числа после повеления естественно передаётся как последующее желаемое действие. Союз «и» сохраняет простую связь исходного текста без излишнего уточнения цели.
theological_decisions:
- issue: К кому относится женское обращение «коровы васанские»
  choice: К богатым женщинам Самарии, представленным как изнеженные и притесняющие других «коровы васанские».
  alternative: К роскошествующей верхушке Самарии в более широком смысле, не только к женщинам.
  rationale: Женский род и множественное число причастий последовательно поддерживают прямое обращение к женщинам. Перевод сохраняет обличительный образ, не смягчая его и не расширяя явно круг адресатов.
- issue: Значение לַאֲדֹנֵיהֶם
  choice: своим господам
  alternative: своим мужьям
  rationale: Существительное допускает оба значения. Более широкое «господам» оставлено в основном тексте, а контекстуально вероятное «мужьям» указано в сноске, чтобы не устранять неоднозначность.
translation_notes:
  register: 'Современный литературный русский язык с достоинством пророческой речи. Синтаксис слегка перестроен: еврейские женские причастия переданы личными глаголами второго лица, чтобы прямое обличение звучало ясно и естественно. Резкая метафора и неопределённый объект глагола «принеси» сохранены.'
