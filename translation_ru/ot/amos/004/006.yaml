base_translation:
  language: en
  yaml_path: translation/ot/amos/004/006.yaml
  text: And I also gave you cleanness of teeth in all your cities[a], and lack of bread in all your places; yet you did not return to me, declares Yahweh.
translation:
  language: ru
  text: «И Я также дал вам чистоту зубов во всех ваших городах[a] и недостаток хлеба во всех ваших местах. Но вы так и не вернулись ко Мне», — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чистоту зубов» — образное выражение, означающее, что людям нечего было есть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: И Я тоже
  rationale: Передаёт добавочное значение וְגַם и подчёркивает явно выраженное местоимение אֲנִי, сохраняя естественный русский порядок слов.
- source_word: נָתַתִּי לָכֶם
  choice: дал вам
  rationale: Простое прошедшее время соответствует рассказу о уже посланном бедствии; прямое значение глагола сохранено без лишнего истолкования.
- source_word: נִקְיוֹן שִׁנַּיִם
  choice: чистоту зубов
  rationale: 'Буквально сохраняет яркий еврейский образ: из-за отсутствия пищи зубы остаются чистыми. Его смысл пояснён сноской и параллельной фразой о хлебе.'
- source_word: בְּכָל עָרֵיכֶם
  choice: во всех ваших городах
  rationale: Прямо передаёт местное значение оборота и обычное значение עָרִים.
- source_word: וְחֹסֶר לֶחֶם
  choice: и оставил вас без хлеба
  rationale: Естественно по-русски передаёт конкретное значение «нехватка хлеба», а также сохраняет смысловой параллелизм с предшествующим образом голода.
- source_word: בְּכֹל מְקוֹמֹתֵיכֶם
  choice: во всех ваших селениях
  rationale: Слово «селения» естественнее буквального «места» и обозначает населённые места шире, чем только города.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Но вы так и не вернулись ко Мне
  rationale: «Вернулись» сохраняет основное пространственно-заветное значение שׁוּב, не сужая его до внутреннего раскаяния; «так и не» естественно подчёркивает безрезультатность бедствия.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт устойчивую пророческую формулу и воспроизводит личное имя יהוה как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон, поэтому личное заветное имя передано транслитерацией, а не заменено титулом.
- issue: Степень истолкования выражения נִקְיוֹן שִׁנַּיִם
  choice: Сохранить буквальный образ «чистота зубов» в основном тексте
  alternative: голод; нечего было есть
  rationale: Буквальный образ сохраняет риторическую силу пророчества; его значение становится понятным благодаря сноске и следующей фразе об отсутствии хлеба.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Необычный исходный образ намеренно сохранён и пояснён; синтаксис и формулировка второй параллельной строки сделаны естественными для современного читателя.
