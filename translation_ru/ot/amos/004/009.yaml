base_translation:
  language: en
  yaml_path: translation/ot/amos/004/009.yaml
  text: I struck you with blight and mildew; your many gardens and your vineyards[a], your fig trees and your olive trees, the locust devoured; yet you did not return to me, declares Yahweh.
translation:
  language: ru
  text: Я поразил вас суховеем и ржавчиной; ваши многочисленные сады и виноградники, смоковницы и маслины уничтожила саранча[a]. Но вы так и не вернулись ко Мне, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стригущая» или «грызущая» саранча. Еврейское слово обозначает вредителя, пожирающего посевы, которого традиционно считают разновидностью саранчи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכֵּיתִי
  choice: Я поражал
  rationale: Глагол נכה в породе hифиль означает «ударить, поразить». Несовершенный вид по-русски естественно передаёт одно из повторяющихся бедствий в контексте и сохраняет прямое действие Бога.
- source_word: בַּשִּׁדָּפוֹן וּבַיֵּרָקוֹן
  choice: суховеем и ржой
  rationale: שִׁדָּפוֹן обозначает иссушающее поражение посевов, вероятно связанное с палящим ветром, а יֵרָקוֹן — пожелтение или болезненное поражение растений. «Суховей и ржа» — понятная современному читателю сельскохозяйственная пара, сохраняющая различие двух бедствий.
- source_word: הַרְבּוֹת גַּנּוֹתֵיכֶם וְכַרְמֵיכֶם
  choice: множество ваших садов и виноградников
  rationale: הַרְבּוֹת выражает многочисленность или изобилие. Формулировка близка к порядку и количественному смыслу еврейского текста, хотя синтаксис этой формы допускает нюансы.
- source_word: תְאֵנֵיכֶם וְזֵיתֵיכֶם
  choice: ваши смоковницы и маслины
  rationale: Названия плодов в данном перечне обозначают соответствующие деревья. «Смоковницы» и «маслины» — точные, литературные и общеупотребительные библейские наименования.
- source_word: יֹאכַל הַגָּזָם
  choice: пожирала саранча
  rationale: Несовершенная форма יֹאכַל может описывать продолжавшееся или характерное действие в ретроспективном ряду. גָּזָם — вредитель, традиционно понимаемый как разновидность саранчи; более узкая идентификация остаётся неуверенной и вынесена в сноску.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Но вы так и не вернулись ко Мне
  rationale: שׁוּב с עַד выражает обращение и возвращение к Богу. «Вернулись ко Мне» сохраняет как направленность, так и широкий заветный смысл, не сводя его только к внутреннему раскаянию; «так и не» естественно передаёт контраст после бедствий.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: נְאֻם — торжественная пророческая формула, указывающая на авторитет источника речи. «Возвещает» сохраняет её формальность лучше нейтрального «говорит».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит тетраграмматон. «Яхве» передаёт личное заветное имя, не заменяя его титулом и не прибегая к менее обоснованной форме «Иегова».
- issue: Смысл שַׁבְתֶּם עָדַי в пророческом контексте
  choice: вы не вернулись ко Мне
  alternative: вы не обратились ко Мне; вы не покаялись предо Мною
  rationale: «Вернулись» сохраняет образ движения обратно к Богу и включает покаяние, восстановление верности и отношений, не сужая выражение до одного богословского аспекта.
translation_notes:
  register: Современный литературный русский язык с торжественностью пророческой речи. Сохранены активное Божье действие, сельскохозяйственная образность и последовательность основных членов еврейской фразы; несколько необычный вынос объектов перед сказуемым передаёт акцент исходного текста, оставаясь допустимым в русском.
