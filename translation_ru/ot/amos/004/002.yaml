source:
  edition: WLC
  text: נִשְׁבַּ֨ע אֲדֹנָ֤/י יְהוִה֙ בְּ/קָדְשׁ֔/וֹ כִּ֛י הִנֵּ֥ה יָמִ֖ים בָּאִ֣ים עֲלֵי/כֶ֑ם וְ/נִשָּׂ֤א אֶתְ/כֶם֙ בְּ/צִנּ֔וֹת וְ/אַחֲרִיתְ/כֶ֖ן בְּ/סִיר֥וֹת דּוּגָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/002.yaml
  text: 'The Lord GOD has sworn by his holiness: For behold[a], days are coming upon you when they will lift you away with hooks[b], and your posterity with fishhooks.'
translation:
  language: ru
  text: 'Владыка Яхве поклялся Своей святостью: «Вот, наступают для вас дни, когда вас утащат крюками, а последних из вас[a] — рыболовными крючьями[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово может означать «конец», «будущее», «остаток» или тех, кто останется последним; возможен перевод: «а ваш остаток».'
    reason: lexical_alternative
  - marker: b
    text: Точные значения еврейских слов, переведённых как «крюки» и «рыболовные крючья», неясны; возможно, речь в целом идёт об острых приспособлениях, подобных рыболовным снастям, которыми пленников уводят прочь.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт оба элемента составного божественного титула и сохраняет личное имя יהוה, не создавая неестественного повторения «Господь Господь».
- source_word: נִשְׁבַּע
  choice: поклялся
  rationale: Совершенный вид естественно передаёт состоявшуюся торжественную клятву, сохраняющую силу в момент пророческого возвещения.
- source_word: בְּקָדְשׁוֹ
  choice: Своей святостью
  rationale: Здесь קֹדֶשׁ естественнее означает Божью святость как основание клятвы, а не святилище.
- source_word: כִּי הִנֵּה
  choice: Вот
  rationale: Кратко и естественно сохраняет указательную силу и настоятельность пророческого объявления; отдельная передача כי в русском здесь не обязательна.
- source_word: יָמִים בָּאִים עֲלֵיכֶם
  choice: наступают для вас дни
  rationale: Передаёт формулу приближающегося суда и её угрожающий контекст без неестественной буквальности.
- source_word: וְנִשָּׂא אֶתְכֶם
  choice: вас утащат
  rationale: Форма единственного числа допускает неопределённого действующего; русская неопределённо-личная конструкция естественно передаёт насильственное удаление и не вводит не названного в тексте субъекта.
- source_word: בְּצִנּוֹת
  choice: крюками
  rationale: В контексте суда и параллели с рыболовными орудиями слово вероятнее всего обозначает крюки или зазубренные приспособления, хотя точное значение спорно.
- source_word: וְאַחֲרִיתְכֶן
  choice: последних из вас
  rationale: В контексте полного увода выражение вероятнее обозначает тех, кто останется напоследок, а не потомство; формулировка сохраняет коллективную направленность к женщинам Самарии.
- source_word: בְּסִירוֹת דּוּגָה
  choice: рыболовными крючьями
  rationale: Трудное выражение передано по параллелизму как рыболовные орудия, которыми пленников образно утаскивают.
theological_decisions:
- issue: Передача имени יהוה в составе אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Владыка Господь
  rationale: Текст содержит личное имя יהוה; транслитерация «Яхве» сохраняет различие между титулом אֲדֹנָי и божественным именем.
- issue: Кем совершается увод
  choice: неопределённо-личное «вас утащат»
  alternative: «Он утащит вас»
  rationale: Грамматическое единственное число не требует отождествлять действующего непосредственно с Богом; неопределённая конструкция сохраняет пророческую угрозу, не снимая вопрос о непосредственном исполнителе суда.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным пророческим звучанием. «Вот» сохраняет риторическую настоятельность без устаревшего «се»; «утащат» подчёркивает насильственный характер образа.
