base_translation:
  language: en
  yaml_path: translation/ot/amos/004/012.yaml
  text: Therefore[a], thus I will do to you, Israel; because I will do this to you, prepare to meet your God, Israel.
translation:
  language: ru
  text: Поэтому так Я поступлю с тобой, Израиль; ибо Я сделаю это с тобой — приготовься встретить своего Бога, Израиль![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приготовься столкнуться со своим Богом». В данном контексте эта встреча означает грозное противостояние после объявленного суда.'
    reason: Лексическая альтернатива для לִקְרַאת и пояснение контекстуального тона без внесения его в основной текст.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из перечисленных ранее судов и естественно вводит пророческое заключение.
- source_word: כֹּה אֶעֱשֶׂה לְּךָ
  choice: так Я поступлю с тобой
  rationale: Сохраняет указательное значение כֹּה и широкую семантику עשה, не конкретизируя не названное прямо действие, при этом контекст сообщает ему угрожающий оттенок.
- source_word: עֵקֶב כִּי
  choice: и поскольку
  rationale: Передаёт основание последующего повеления; союз «и» помогает сохранить плотную связь частей еврейской фразы.
- source_word: זֹאת אֶעֱשֶׂה לָּךְ
  choice: Я так поступлю с тобой
  rationale: Естественно по-русски передаёт указание на объявленное действие; «с тобой», а не «для тебя», соответствует контексту суда.
- source_word: הִכּוֹן
  choice: приготовься
  rationale: Точно и идиоматично передаёт повеление быть готовым.
- source_word: לִקְרַאת
  choice: встретить
  rationale: Передаёт движение навстречу и сохраняет допустимую в самом выражении смысловую широту встречи или столкновения.
- source_word: אֱלֹהֶיךָ
  choice: своего Бога
  rationale: Возвратное притяжательное местоимение естественно для русского при обращении к Израилю и сохраняет значение еврейского суффикса второго лица.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Традиционная русская форма имени; оба обращения сохранены.
theological_decisions:
- issue: Характер встречи с Богом
  choice: Зловещее предупреждение о предстоящей встрече с Богом в контексте суда
  alternative: Нейтральный или обнадёживающий призыв к поклонению либо покаянию
  rationale: Предшествующий контекст перечисляет кары и обещает дальнейшее Божье действие. Однако основной текст не добавляет слова «на суд», чтобы не устранять присущую формулировке смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык, торжественный и прямой пророческий тон. Повтор исходной формулы и двойное обращение «Израиль» сохранены; пунктуация разделяет тяжёлую еврейскую конструкцию на два предложения для ясности.
