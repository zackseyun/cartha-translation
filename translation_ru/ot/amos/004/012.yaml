  source_fidelity: 'В целом перевод точно передаёт все основные элементы: выводное «поэтому», указательное «так», два обращения «Израиль», широкое «поступлю/сделаю с тобой», повеление приготовиться и «своего Бога». Однако «И поскольку» добавляет координирующий союз, которого нет в еврейском тексте, и в начале нового предложения звучит по-русски синтаксически неудачно. Второе זֹאת лучше передать как «это», а не повторным «так».'
