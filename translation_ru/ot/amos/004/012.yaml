  to: Поэтому так Я поступлю с тобой, Израиль; ибо Я сделаю это с тобой — приготовься встретить своего Бога, Израиль![a]
  rationale: Исправлена только русская синтаксическая связь причинного оборота и восстановлено различие между כֹּה («так») и זֹאת («это»). Тире перед повелением ясно оформляет его как следствие названного Божьего действия, не добавляя к тексту конкретизации характера этого действия.
