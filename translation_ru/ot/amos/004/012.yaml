  terminology: «Израиль» и «Бог» переданы нормативно. «Своего Бога» — естественное русское соответствие суффиксу второго лица. Примечание верно сохраняет лексическую альтернативу «столкнуться» и не вносит в основной текст невыраженное уточнение о суде.
