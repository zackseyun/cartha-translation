  text: וְ/קַטֵּ֤ר מֵֽ/חָמֵץ֙ תּוֹדָ֔ה וְ/קִרְא֥וּ נְדָב֖וֹת הַשְׁמִ֑יעוּ כִּ֣י כֵ֤ן אֲהַבְתֶּם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/005.yaml
  text: And burn a thank offering from leavened bread[a], and proclaim freewill offerings—announce them! For this is what you have loved, O sons of Israel[b], declares the Lord GOD.
translation:
  language: ru
  text: Возжигайте благодарственную жертву с квасным хлебом[a], провозглашайте добровольные приношения, объявляйте о них! Ибо так вы любите, сыны Израиля[b], — возвещает Господь Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из квасного» или «с закваской»; еврейское выражение связывает квасное с благодарственной жертвой, не уточняя характера этой связи.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сыны Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַטֵּר
  choice: Возжигайте
  rationale: Пиэль повелительного наклонения от קטר обозначает сожжение жертвы на алтаре, при котором дым восходит вверх. «Возжигайте» передаёт культовое действие и сохраняет иронический призыв пророка.
- source_word: מֵחָמֵץ
  choice: из квасного
  rationale: חָמֵץ может обозначать закваску либо заквашенный продукт. Предлог מ־ здесь допускает связь состава или материала; формулировка «из квасного» сохраняет эту смысловую широту и не уточняет сверх еврейского текста, идёт ли речь именно о хлебе.
- source_word: תּוֹדָה
  choice: благодарственную жертву
  rationale: В жертвенном контексте תּוֹדָה — техническое обозначение благодарственной жертвы, а не только чувства благодарности.
- source_word: וְקִרְאוּ נְדָבוֹת הַשְׁמִיעוּ
  choice: провозглашайте добровольные приношения, объявляйте о них
  rationale: קרא и каузатив от שמע подчёркивают публичное оглашение. «Добровольные приношения» точно передаёт культовый термин נְדָבוֹת, а местоимение «о них» естественно обозначает названные приношения.
- source_word: כִּי כֵן אֲהַבְתֶּם
  choice: Ведь это вы любите
  rationale: Выражение объясняет иронические повеления и обличает устойчивое пристрастие адресатов. Настоящее время естественно передаёт в русском результативное значение перфекта, не ослабляя обвинительного тона.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняется буквальный мужской образ еврейского обращения и его торжественно-пророческий регистр.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передан формулой пророческого изречения «возвещает». «Владыка» передаёт אֲדֹנָי, а «Яхве» — личное имя יהוה, сохраняя различие двух элементов титула.
theological_decisions:
- issue: Квасное в благодарственной жертве и возможное нарушение культовой нормы
  choice: Сохранить прямой и вызывающий образ возжигания жертвы «из квасного»
  alternative: Сгладить смысл как принесение благодарственной жертвы вместе с квасным хлебом
  rationale: Конструкция допускает связь квасного с благодарственной жертвой, но не разъясняет её точный характер. В контексте саркастического обличения возможное напряжение с запретом возжигать квасное на алтаре не следует устранять пояснительным переводом.
- issue: Передача אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Передача личного имени как «Яхве» отличает его от титула אֲדֹנָי и непосредственно отражает два разных элемента еврейского сочетания, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим звучанием. Повелительные формы сохраняют резкую саркастическую интонацию контекста; культовые термины переданы понятно, но без устранения подлинной неоднозначности.
