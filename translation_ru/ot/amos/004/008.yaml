base_translation:
  language: en
  yaml_path: translation/ot/amos/004/008.yaml
  text: So two or three cities staggered to one city to drink water[a], but they were not satisfied; yet you did not return to me[b], declares Yahweh.
translation:
  language: ru
  text: И два-три города брели[a] к одному городу, чтобы напиться воды, но не напивались досыта. Однако вы не вернулись ко Мне[b], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скитались» или «шатаясь шли». Еврейский глагол может обозначать движение туда и сюда либо неуверенное движение в поисках воды.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не обратились ко Мне». В книге Амоса «вернуться» подразумевает возвращение к Богу и верности Ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָעוּ
  choice: брели
  rationale: Глагол נוע передаёт движение туда и сюда, иногда неуверенное или шаткое. «Брели» естественно выражает изнурённое передвижение жителей в поисках воды, не сводя значение только к буквальному шатанию.
- source_word: שְׁתַּיִם שָׁלֹשׁ עָרִים
  choice: два-три города
  rationale: Парное числовое выражение обозначает небольшое неопределённое число; русское «два-три» передаёт эту идиому естественно и кратко.
- source_word: אֶל עִיר אַחַת
  choice: к одному городу
  rationale: Сохраняется направительное значение и картина жителей нескольких городов, сходящихся в одном месте.
- source_word: לִשְׁתּוֹת מַיִם
  choice: чтобы напиться воды
  rationale: Инфинитив выражает цель. «Напиться воды» звучит естественнее буквального «пить воду» в контексте жажды.
- source_word: וְלֹא יִשְׂבָּעוּ
  choice: но не могли напиться досыта
  rationale: שׂבע означает насытиться, получить достаточно. В отношении воды русское «напиться досыта» ясно передаёт недостаточность воды и сохраняет образ насыщения.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: однако вы не вернулись ко Мне
  rationale: שׁוב сохраняет одновременно обычный смысл возвращения и пророческий призыв вновь обратиться к Богу; «вернулись ко Мне» не устраняет эту смысловую напряжённость.
- source_word: נְאֻם יְהוָה
  choice: говорит Яхве
  rationale: Естественная и торжественная русская передача устойчивой пророческой формулы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
theological_decisions:
- issue: Смысл покаяния в שׁוב
  choice: не вернулись ко Мне
  alternative: не обратились ко Мне
  rationale: Контекст предполагает возвращение к Богу в смысле покаяния и восстановления верности, но выбранная формулировка сохраняет как буквальный, так и заветный оттенок еврейского глагола.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно транслитерировано, а не заменено титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим тоном. Метафора городов как их жителей сохранена. Заглавная буква в «Мне» отражает русскую библейскую издательскую традицию, не добавляя нового содержания.
