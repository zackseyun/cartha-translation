base_translation:
  language: en
  yaml_path: translation/ot/amos/004/003.yaml
  text: And through the breaches you will go out[a], each woman straight ahead of her[b], and you will be cast out toward Harmon,” declares Yahweh.
translation:
  language: ru
  text: И вы выйдете через проломы, каждая — прямо перед собой[a], и будете выброшены к Хармону[b], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «женщина перед нею»; вероятный смысл: каждая женщина выйдет прямо через пролом перед ней.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст здесь неясен. Слово הַהַרְמוֹנָה может обозначать Хармон; возможны также понимания «к крепости» или «к Хермону». Глагольная форма перед ним трудна и формально допускает активное понимание: «и вы бросите их».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּפְרָצִים
  choice: через проломы
  rationale: Существительное פְּרָצִים обозначает проломы, вероятно в городской стене; предлог «через» естественно передаёт подразумеваемое движение сквозь них.
- source_word: תֵּצֶאנָה
  choice: вы выйдете
  rationale: Qal, 2-е лицо женского рода множественного числа от יצא имеет обычное активное значение «выходить»; вынужденный характер выхода следует из контекста, но не вносится в сам глагол.
- source_word: אִשָּׁה נֶגְדָּהּ
  choice: каждая прямо перед собой
  rationale: אִשָּׁה употреблено дистрибутивно, а נֶגְדָּהּ указывает на пространство непосредственно перед каждой женщиной; перевод передаёт выход через ближайший пролом без отклонения в сторону.
- source_word: וְהִשְׁלַכְתֶּנָה
  choice: и будете выброшены
  rationale: Форма трудна и формально допускает активное понимание, однако отсутствие выраженного дополнения и контекст насильственного изгнания поддерживают пассивно-безличное прочтение; неопределённость отмечена в сноске.
- source_word: הַהַרְמוֹנָה
  choice: по направлению к Хармону
  rationale: Слово неясно; транслитерация как вероятного топонима не создаёт ложной определённости, а конечное ה передаёт направленность движения.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана современно и торжественно; личное имя יהוה сохранено как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; передача «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Характер изгнания женщин
  choice: будете выброшены
  alternative: вы бросите
  rationale: Пассивное прочтение соответствует сцене насильственного увода, но морфологическая трудность формы не скрывается и оговорена в сноске.
translation_notes:
  register: Современный литературный русский язык с сдержанным пророческим звучанием. Женский род множественного числа выражен контекстным словом «каждая»; порядок фраз сохраняет резкое движение от проломов к изгнанию.
