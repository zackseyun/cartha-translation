  source_fidelity: 'Основной смысл передан верно: активное «выйдете» сохраняет форму תֵּצֶאנָה; «проломы» адекватно פְּרָצִים; Яхве верно передаёт יהוה. Однако «по направлению к» неоправданно ослабляет направительное значение конечного -ָה в הַהַרְמוֹנָה; предпочтительно простое «к». Трудная форма וְהִשְׁלַכְתֶּנָה может отражать изгнание/бросание, но активная альтернатива в сноске должна быть сформулирована точнее, без добавления неопределённого «что-либо».'
