source:
  edition: WLC
  text: וְ/גַ֣ם אָנֹכִי֩ מָנַ֨עְתִּי מִ/כֶּ֜ם אֶת הַ/גֶּ֗שֶׁם בְּ/ע֨וֹד שְׁלֹשָׁ֤ה חֳדָשִׁים֙ לַ/קָּצִ֔יר וְ/הִמְטַרְתִּי֙ עַל עִ֣יר אֶחָ֔ת וְ/עַל עִ֥יר אַחַ֖ת לֹ֣א אַמְטִ֑יר חֶלְקָ֤ה אַחַת֙ תִּמָּטֵ֔ר וְ/חֶלְקָ֛ה אֲשֶֽׁר לֹֽא תַמְטִ֥יר עָלֶ֖י/הָ תִּיבָֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/007.yaml
  text: And I also withheld the rain from you when there were still three months until the harvest; and I caused it to rain on one city[a], but on another city I did not cause it to rain. One field received rain, but the field on which it did not rain dried up.
translation:
  language: ru
  text: И Я также удержал от вас дождь, когда до жатвы оставалось ещё три месяца. Я послал дождь на один город, а на другой город не послал. На один участок земли выпадал дождь, а участок, на который дождь не выпадал, засох.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם אָנֹכִי
  choice: И Я также
  rationale: Сохраняет присоединительное значение גַם и подчёркнутое независимым местоимением אָנֹכִי Божье «Я», не утяжеляя современную русскую фразу.
- source_word: מָנַעְתִּי מִכֶּם אֶת־הַגֶּשֶׁם
  choice: удерживал от вас дождь
  rationale: Передаёт конструкцию מנע с מן как намеренное лишение дождя и сохраняет прямое указание на действующего Бога.
- source_word: בְּעוֹד שְׁלֹשָׁה חֳדָשִׁים לַקָּצִיר
  choice: когда до жатвы оставалось ещё три месяца
  rationale: Естественно передаёт оставшийся промежуток времени и важность дождя в период перед жатвой.
- source_word: וְהִמְטַרְתִּי
  choice: Я посылал дождь
  rationale: Естественная русская передача каузативной формы глагола מטר; субъект и намеренная Божья деятельность выражены прямо.
- source_word: עַל עִיר אֶחָת ... וְעַל עִיר אַחַת לֹא אַמְטִיר
  choice: на один город, а на другой город не посылал
  rationale: Сохраняет контраст избирательного выпадения дождя и повтор слова «город», соответствующий еврейскому параллелизму.
- source_word: חֶלְקָה אַחַת
  choice: один участок земли
  rationale: חֶלְקָה обозначает отдельный земельный надел или участок; такая передача точна и понятна без неоправданного уточнения вида угодья.
- source_word: תִּמָּטֵר
  choice: получал дождь
  rationale: 'Идиоматически передаёт пассивное значение формы: участок оказывался орошаем дождём.'
- source_word: וְחֶלְקָה אֲשֶׁר לֹא תַמְטִיר עָלֶיהָ
  choice: а участок, на который дождь не выпадал
  rationale: Естественно передаёт смысл относительной конструкции, не навязывая спорного грамматического субъекта внутри неё.
- source_word: תִּיבָשׁ
  choice: засыхал
  rationale: Передаёт постепенный и наблюдаемый результат отсутствия дождя применительно к земельному участку и его растительности.
theological_decisions:
- issue: Божье действие в избирательном ниспослании дождя и засухи
  choice: 'Сохранить первое лицо и прямое Божье действие: «Я ... удерживал», «Я посылал ... не посылал»'
  alternative: 'Передать явления безлично: «дождя не было», «дождь выпадал»'
  rationale: Еврейский текст подчёркивает, что говорящий Бог непосредственно распоряжается дождём как судом; безличная формулировка ослабила бы эту смысловую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет трёхчастное развитие еврейского текста и его контрасты, но избегает неестественного буквального оборота «вызывал дождь».
