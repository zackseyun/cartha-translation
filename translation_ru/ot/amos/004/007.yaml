    rationale: «Удерживал» и «посылал» допускают значение длительного или регулярного действия. Формы «удержал», «послал», «не послал» точнее передают ряд совершённых действий, выраженный еврейскими перфектными формами.
  - severity: low
    issue: Не вполне естественное сочетание «участок получал дождь»
    rationale: Оно понятно, но для современного русского естественнее сказать, что дождь выпадал на участок. Такая замена сохраняет пассивный смысл תִּמָּטֵר и контраст с участком без дождя.
