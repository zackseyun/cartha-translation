  text: שִׁלַּ֨חְתִּי בָ/כֶ֥ם דֶּ֨בֶר֙ בְּ/דֶ֣רֶךְ מִצְרַ֔יִם הָרַ֤גְתִּי בַ/חֶ֨רֶב֙ בַּח֣וּרֵי/כֶ֔ם עִ֖ם שְׁבִ֣י סֽוּסֵי/כֶ֑ם וָ/אַעֲלֶ֞ה בְּאֹ֤שׁ מַחֲנֵי/כֶם֙ וּֽ/בְ/אַפְּ/כֶ֔ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/010.yaml
  text: I sent among you a plague in the manner of Egypt[a]; I killed your young men with the sword, along with your captured horses, and I made the stench of your camps rise even into your nostrils; yet you did not return to me[b], declares Yahweh.
translation:
  language: ru
  text: Я послал на вас мор, как в Египте[a]; мечом Я убил ваших юношей и захватил в плен ваших коней[b]. Я заставил смрад ваших станов подняться в ваши ноздри. Но вы не вернулись ко Мне, — говорит Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по примеру Египта». Вероятно, это отсылка к казням и судам, постигшим Египет, а не указание на дорогу в Египет.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вместе с пленением ваших коней». Сжатая еврейская фраза, вероятно, описывает военное поражение, при котором коней захватывали в плен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁלַּחְתִּי בָכֶם
  choice: Я посылал на вас
  rationale: Глагол передаёт намеренное ниспослание бедствия, а предлог ב при слове о бедствии допускает значение «на/среди». «На вас» естественно по-русски выражает направленность суда, не добавляя нового содержания.
- source_word: דֶּבֶר
  choice: моровую язву
  rationale: דֶּבֶר обозначает смертоносную эпидемию. Сочетание «моровая язва» понятно в библейско-пророческом контексте, сохраняет тяжесть образа и звучит более определённо, чем общее «бедствие».
- source_word: בְּדֶרֶךְ מִצְרַיִם
  choice: как в Египте
  rationale: Буквально оборот связан с «путём/образом Египта», но, вероятнее всего, отсылает к египетским казням, а не к дороге в Египет. Краткое «как в Египте» сохраняет аллюзию; неоднозначность пояснена в сноске.
- source_word: הָרַגְתִּי בַחֶרֶב בַּחוּרֵיכֶם
  choice: Я убивал мечом ваших юношей
  rationale: Прямо передаёт действие הרג, военный образ меча и основное значение בַּחוּרִים — молодые мужчины в расцвете сил, которые в данном контексте могли быть воинами.
- source_word: עִם שְׁבִי סוּסֵיכֶם
  choice: а ваших коней уводили в плен
  rationale: Еврейская фраза сжата и буквально говорит о «пленении/плене ваших коней». Русская формулировка естественно описывает сопутствующий военный разгром, не утверждая, что кони были убиты вместе с юношами.
- source_word: וָאַעֲלֶה בְּאֹשׁ מַחֲנֵיכֶם וּבְאַפְּכֶם
  choice: Я заставлял смрад ваших станов подниматься к самым вашим ноздрям
  rationale: Сохраняются каузативное движение вверх, резкое слово «смрад», множественное число «станов» и буквальный телесный образ ноздрей. «К самым» естественно усиливает непосредственность запаха.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Но вы не вернулись ко Мне
  rationale: שוב в заветном контексте подразумевает покаяние, однако буквально означает возвращение. Перевод сохраняет этот богословски насыщенный образ без разъясняющей вставки.
- source_word: נְאֻם יְהוָה
  choice: говорит Яхве
  rationale: Обычная формула пророческого изречения; личное имя יְהוָה передано транслитерацией «Яхве», а не заменено титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя Бога. «Яхве» сохраняет различие между именем и титулом.
- issue: Значение וְלֹא שַׁבְתֶּם עָדַי
  choice: вы не вернулись ко Мне
  alternative: вы не покаялись передо Мной
  rationale: Глагол שוב в этом контексте несёт покаянный смысл, но выражает его через образ возвращения. Прямая передача сохраняет и образ, и богословское напряжение.
- issue: Действие с конями в עִם שְׁבִי סוּסֵיכֶם
  choice: коней уводили в плен
  alternative: вместе с пленением ваших коней
  rationale: Оборот описывает военное поражение и захват коней, но его синтаксис сжат. Выбранный вариант не приписывает коням смерть от меча и оставляет исполнителей захвата неназванными.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой интонацией. Сохранены резкие образы суда — меч, плен, смрад и ноздри. Повтор «Я» передаёт настойчивую последовательность действий Яхве; противопоставление «Но вы не вернулись» подчёркивает цель перечисленных наказаний.
