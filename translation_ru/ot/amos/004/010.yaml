  verdict: revise
  source_fidelity: Драфт в целом точно передаёт последовательность бедствий и финальное «не вернулись ко Мне». Однако русские несовершенные формы «посылал», «убивал», «заставлял» ослабляют конкретные завершённые действия, выраженные в еврейском перфекте. Кроме того, «а ваших коней уводили в плен» меняет конструкцию עִם («вместе с») на самостоятельное пассивное предложение и оставляет деятеля неопределённым, хотя во всём перечислении действует Яхве.
  naturalness: «Моровая язва» допустима в библейском регистре, но для современного литературного русского «мор» короче и естественнее. «К самым вашим ноздрям» передаёт приближение, тогда как בְּאַפְּכֶם рисует проникновение запаха в ноздри; «в ваши ноздри» точнее и звучит естественно.
  terminology: «Яхве» корректно передаёт יְהוָה. «Вернулись ко Мне» удачно сохраняет образ שוב без доктринального расширения. «Юноши», «меч», «смрад» и «станы» соответствуют исходному тексту и пророческому регистру.
