source:
  edition: WLC
  text: כִּ֡י הִנֵּה֩ יוֹצֵ֨ר הָרִ֜ים וּ/בֹרֵ֣א ר֗וּחַ וּ/מַגִּ֤יד לְ/אָדָם֙ מַה שֵּׂח֔/וֹ עֹשֵׂ֥ה שַׁ֨חַר֙ עֵיפָ֔ה וְ/דֹרֵ֖ךְ עַל בָּ֣מֳתֵי אָ֑רֶץ יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת שְׁמֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/013.yaml
  text: For behold[a], the one who forms the mountains and creates the wind, and declares to man what his thought is, who makes the dawn darkness and treads on the heights of the earth—Yahweh, the God of hosts[c][b], is his name.
translation:
  language: ru
  text: Ибо вот Тот, Кто образует горы и творит ветер[a], открывает человеку[b], каковы его помыслы[c], превращает зарю во мрак и ступает по высотам земли, — Яхве, Бог Воинств, — имя Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух» или «дыхание»; еврейское רוּחַ имеет все эти значения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «людям»; в еврейском тексте употреблено собирательное единственное число אָדָם — «человек».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «какова его мысль (или: дума)». Местоимение, вероятнее всего, относится к человеку; возможно также понимание: «открывает человеку Свой замысел».'
    reason: ambiguity
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Ибо вот
  rationale: «Ибо» связывает стих с предшествующим предупреждением как его основание, а «вот» сохраняет выразительную указательную силу הִנֵּה.
- source_word: יוֹצֵר הָרִים
  choice: образует горы
  rationale: Причастие от יצר обозначает намеренное придание формы; «образует» передаёт образ Творца, формирующего горы.
- source_word: וּבֹרֵא רוּחַ
  choice: и творит ветер
  rationale: В ряду космических деяний רוּחַ естественнее понимать как «ветер», однако многозначность слова сохранена в примечании.
- source_word: וּמַגִּיד לְאָדָם מַה שֵּׂחוֹ
  choice: открывает человеку, что у него на мысли
  rationale: מגיד передаёт сообщение или обнаружение, а שֵׂחַ — внутреннюю мысль, раздумье или помысел. Русская формулировка естественна и сохраняет направленность действия к отдельному человеку.
- source_word: עֹשֵׂה שַׁחַר עֵיפָה
  choice: превращает зарю во мрак
  rationale: Буквальная конструкция «делает зарю мраком» по-русски естественно передаётся глаголом «превращает» и выражает властное обращение света во тьму.
- source_word: וְדֹרֵךְ עַל בָּמֳתֵי אָרֶץ
  choice: и шествует по высотам земли
  rationale: דרך על описывает ступание или шествие поверх чего-либо; «высоты земли» передают топографическое значение בָּמוֹת без культового уточнения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Бог Воинств
  rationale: Формулировка сохраняет буквальный образ צְבָאוֹת как многочисленных небесных или воинских сил и остаётся понятной современному читателю.
- source_word: שְׁמוֹ
  choice: имя Его
  rationale: Краткая именная формула сохраняет торжественное кульминационное именование в конце стиха.
theological_decisions:
- issue: Значение רוּחַ в описании творения
  choice: ветер
  alternative: дух или дыхание
  rationale: Окружение говорит о горах, заре и высотах земли, поэтому природное значение «ветер» наиболее вероятно; иные значения слова не исключены и отмечены в сноске.
- issue: Референт местоименного суффикса в שֵּׂחוֹ
  choice: мысль человека
  alternative: Божий замысел, сообщаемый человеку
  rationale: Ближайший референт — אָדָם, поэтому основной текст говорит о человеческой мысли; грамматически возможное отнесение суффикса к Богу сохранено в примечании.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация отличает его от титула אֲדֹנָי.
- issue: Значение אֱלֹהֵי צְבָאוֹת
  choice: Бог Воинств
  alternative: Бог Саваоф
  rationale: Смысловой перевод раскрывает образ воинств и не ограничивает его одной конфессионально привычной формулой.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Заглавные буквы в «Тот, Кто» и местоимениях, относящихся к Богу, поддерживают достоинство стиля; синтаксис остаётся ясным для обычного читателя. «Бог Воинств» выбран вместо менее прозрачного традиционного «Саваоф».
