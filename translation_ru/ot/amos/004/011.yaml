  text: הָפַ֣כְתִּי בָ/כֶ֗ם כְּ/מַהְפֵּכַ֤ת אֱלֹהִים֙ אֶת סְדֹ֣ם וְ/אֶת עֲמֹרָ֔ה וַ/תִּהְי֕וּ כְּ/א֖וּד מֻצָּ֣ל מִ/שְׂרֵפָ֑ה וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/011.yaml
  text: I overthrew some among you as God overthrew Sodom and Gomorrah[a], and you became like a brand snatched from the burning; yet you did not return to me[c][b], declares Yahweh.
translation:
  language: ru
  text: Я сокрушил некоторых из вас[a], подобно тому как Бог ниспроверг Содом и Гоморру[b]. Вы стали словно головня, выхваченная из пожара[c], но так и не вернулись ко Мне, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я произвёл ниспровержение среди вас»; еврейский предлог допускает перевод без явного указания на часть народа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «подобно Божьему ниспровержению Содома и Гоморры».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «обгоревшее полено, спасённое из пламени».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפַכְתִּי
  choice: Я сокрушил
  rationale: В контексте суда глагол הפך обозначает ниспровержение, катастрофическое уничтожение. «Сокрушил» естественно сочетается с одушевлённым дополнением и сохраняет силу образа, не сводя его к полному истреблению.
- source_word: בָכֶם
  choice: некоторых из вас
  rationale: 'Предлог ב с местоименным суффиксом здесь естественно допускает партитивное понимание: суд постиг часть народа. Подлинная неоднозначность отмечена в сноске.'
- source_word: כְּמַהְפֵּכַת אֱלֹהִים אֶת סְדֹם וְאֶת עֲמֹרָה
  choice: подобно тому как Бог ниспроверг Содом и Гоморру
  rationale: Еврейская именная конструкция передана естественной русской глагольной фразой. «Ниспроверг» передаёт катастрофический суд и сохраняет явную отсылку к Содому и Гоморре.
- source_word: וַתִּהְיוּ
  choice: Вы стали
  rationale: Форма описывает состояние, наступившее в результате суда, поэтому «стали» точнее простого «были».
- source_word: כְּאוּד מֻצָּל מִשְּׂרֵפָה
  choice: словно головня, выхваченная из пожара
  rationale: אוּד — обгоревшее полено или головня; пассивная форма מֻצָּל передаёт избавление из опасности. «Выхваченная» ярко и естественно воспроизводит образ внезапного спасения из огня.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: но так и не вернулись ко Мне
  rationale: שׁוב с עַד выражает возвращение к Богу в широком смысле — перемену пути, верность и восстановление отношений. Частица «так и» естественно подчёркивает отсутствие ожидаемого ответа после пережитого суда.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана торжественно и понятно; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит личное заветное имя יהוה; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Значение שׁוב в пророческом призыве
  choice: вернулись ко Мне
  alternative: покаялись передо Мной
  rationale: «Вернулись» сохраняет пространственно-реляционную метафору еврейского глагола и не сужает её до одного внутреннего переживания раскаяния.
- issue: Упоминание Бога в сравнительной формуле
  choice: как Бог ниспроверг
  alternative: как при Божьем ниспровержении
  rationale: Сохранено прямое упоминание Бога в третьем лице, присутствующее в древней формуле сравнения, хотя говорящий — сам Яхве.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Образность исходного текста сохранена без архаизации; синтаксис сделан ясным для обычного читателя.
