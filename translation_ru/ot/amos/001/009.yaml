  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵי צֹ֔ר וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַֽל הַסְגִּירָ֞/ם גָּל֤וּת שְׁלֵמָה֙ לֶ/אֱד֔וֹם וְ/לֹ֥א זָכְר֖וּ בְּרִ֥ית אַחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/009.yaml
  text: 'Thus says Yahweh: “For three transgressions of Tyre[a], and for four, I will not revoke its punishment[c][b], because they delivered up an entire population of exiles to Edom and did not remember a covenant of brotherhood.”'
translation:
  language: ru
  text: 'Так говорит Яхве: «За три преступления Тира и за четыре не отменю ему приговора[a], потому что они выдали Эдому всю общину пленных[b] и не вспомнили о братском союзе[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не обращу этого назад»; объект действия в еврейском тексте прямо не назван. По смыслу речь идёт о том, что объявленный суд не будет отменён.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «целую общину изгнанников»; также возможно: «полное пленение». Еврейское выражение обозначает передачу целой группы пленных или изгнанников.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «союзе братьев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняется стандартная пророческая формула; тетраграмматон передан личным именем «Яхве».
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי צֹר וְעַל אַרְבָּעָה
  choice: За три преступления Тира и за четыре
  rationale: Сохранена характерная для Амоса формула числового нарастания; «преступления» передаёт нравственную и правовую тяжесть פְּשָׁעִים.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: не отменю ему приговора
  rationale: В еврейском буквально сказано «не возвращу/не обращу это», причём подразумеваемый объект не назван. Основной текст естественно выражает судебный смысл, а сноска сохраняет исходную неоднозначность.
- source_word: הַסְגִּירָם
  choice: они выдали
  rationale: Форма породы hифиль от סגר обозначает передачу людей в руки другой стороны; «выдали» звучит естественно и сохраняет обвинительный оттенок.
- source_word: גָּלוּת שְׁלֵמָה
  choice: всех пленных
  rationale: Сочетание обозначает всю совокупность пленённых или изгнанных людей. Краткая русская формулировка естественно передаёт коллективность и полноту, не уточняя сверх текста, были ли они первоначально жителями одной местности.
- source_word: לֶאֱדוֹם
  choice: Эдому
  rationale: Дательный падеж естественно передаёт направление передачи людей.
- source_word: וְלֹא זָכְרוּ
  choice: и не вспомнили
  rationale: Сохранено прямое значение זכר; в контексте оно подразумевает, что они не приняли союз во внимание и не поступили согласно ему.
- source_word: בְּרִית אַחִים
  choice: братский союз
  rationale: Передаёт буквальную идею «союза братьев» естественным современным русским языком, не сводя её к простой дружбе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Неназванный объект в לֹא אֲשִׁיבֶנּוּ
  choice: не отменю ему приговора
  alternative: не обращу этого назад; не отменю этого
  rationale: Контекст формулы у Амоса указывает на неотвратимость объявленного суда, однако буквальная неопределённость отмечена в сноске и не представлена как однозначно выраженное в еврейском слово «приговор».
- issue: Характер בְּרִית אַחִים
  choice: братский союз
  alternative: завет братьев; братский завет
  rationale: Русское «союз» здесь ясно обозначает обязательственное соглашение и не навязывает конкретной реконструкции того, какие именно народы или правители считались братьями.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Числовая формула сохранена без поясняющего перефразирования; синтаксис сделан естественным для русского текста.
