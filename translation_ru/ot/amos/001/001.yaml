  text: דִּבְרֵ֣י עָמ֔וֹס אֲשֶׁר הָיָ֥ה בַ/נֹּקְדִ֖ים מִ/תְּק֑וֹעַ אֲשֶׁר֩ חָזָ֨ה עַל יִשְׂרָאֵ֜ל בִּ/ימֵ֣י עֻזִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה וּ/בִ/ימֵ֞י יָרָבְעָ֤ם בֶּן יוֹאָשׁ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל שְׁנָתַ֖יִם לִ/פְנֵ֥י הָ/רָֽעַשׁ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/001.yaml
  text: The words of Amos[a], who was among the shepherds from Tekoa, which he saw concerning Israel in the days of Uzziah king of Judah and in the days of Jeroboam son of Joash, king of Israel[b], two years before the earthquake.
translation:
  language: ru
  text: Слова Амоса, одного из овцеводов[a] из Фекои, — то, что он видел об Израиле[b] во дни Озии, царя Иудеи, и во дни Иеровоама, сына Иоаса, царя Израиля, за два года до землетрясения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пастухов». Еврейское слово, вероятно, обозначает точнее тех, кто разводил или содержал овец, а не пастухов вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «против Израиля». В пророческом контексте еврейский предлог допускает оба значения; в основном тексте выбрано более широкое «об».'
    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Слова
  rationale: Форма сопряжённого множественного числа от דָּבָר вводит пророческую книгу; «слова» естественно и без сужения смысла передаёт заглавную формулу.
- source_word: עָמוֹס
  choice: Амос
  rationale: Традиционная русская передача личного имени.
- source_word: בַנֹּקְדִים
  choice: одного из овцеводов
  rationale: Предлог ב указывает на принадлежность к группе, а נֹקֵד обозначает человека, занимающегося разведением или содержанием мелкого скота, вероятнее всего овец; «овцеводов» точнее общего «пастухов».
- source_word: מִתְּקוֹעַ
  choice: из Фекои
  rationale: Предлог מִן обозначает происхождение; использована традиционная русская форма географического названия.
- source_word: חָזָה
  choice: видел
  rationale: Сохранён обычный пророческий глагол «видеть», не развёрнутый в пояснительное «получил в видении».
- source_word: עַל יִשְׂרָאֵל
  choice: об Израиле
  rationale: Предлог עַל в пророческом контексте допускает значения «об, относительно» и «против»; более широкое «об» не предрешает направленность всего пророчества.
- source_word: בִּימֵי ... וּבִימֵי
  choice: во дни ... и во дни
  rationale: Формула близко передаёт еврейское временное выражение и сохраняет уместный для библейского заглавия возвышенный, но понятный регистр.
- source_word: שְׁנָתַיִם לִפְנֵי הָרָעַשׁ
  choice: за два года до землетрясения
  rationale: Прямая и естественная передача временного выражения; определённость указывает на известное адресатам событие.
theological_decisions:
- issue: Связь оборота «которые он видел» со «словами» в пророческом заглавии
  choice: 'Сохранено: «Слова ... которые он видел».'
  alternative: Перестроить как «видение Амоса» или «слова, полученные им в видении».
  rationale: В еврейском тексте объектом глагола חָזָה формально выступают «слова». Эта напряжённая связь объединяет словесное провозглашение и зрительное пророческое откровение; её не следует сглаживать без необходимости.
- issue: Значение עַל при указании предмета пророчества
  choice: «об Израиле»
  alternative: «против Израиля»
  rationale: Оба значения возможны, однако нейтральное «об» лучше подходит для заглавия всей книги и не превращает каждую её часть заранее в обвинение.
translation_notes:
  register: Современный литературный русский с умеренно традиционной формулой «во дни», уместной в заглавии пророческой книги. Синтаксическая необычность сочетания «слова, которые он видел» намеренно сохранена как особенность исходного текста.
