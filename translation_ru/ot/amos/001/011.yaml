  naturalness: «Его гнев непрестанно терзал» намеренно образно, но приемлемо в современном литературном русском и соответствует пророческой поэтике. «Ярость его сохранялась вечно» естественнее, чем приписывать действие глагола «сохранил» самому Эдому.
  terminology: «Яхве», «преступления», «наказание», «брат», «сострадание», «гнев» и «ярость» уместны и последовательно передают ключевые слова. «Терзал» хорошо удерживает хищнический оттенок טרף.
