  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י אֱד֔וֹם וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל רָדְפ֨/וֹ בַ/חֶ֤רֶב אָחִי/ו֙ וְ/שִׁחֵ֣ת רַחֲמָ֔י/ו וַ/יִּטְרֹ֤ף לָ/עַד֙ אַפּ֔/וֹ וְ/עֶבְרָת֖/וֹ שְׁמָ֥רָ/ה נֶֽצַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/011.yaml
  text: 'Thus says Yahweh: “For three transgressions of Edom[a], and for four, I will not revoke its punishment, because he pursued his brother with the sword and destroyed his compassion; his anger tore continually[c][b], and he kept his wrath forever.”'
translation:
  language: ru
  text: 'Так говорит Яхве: «За три преступления Эдома и за четыре не отменю наказания[a], потому что он преследовал с мечом своего брата[b], заглушил в себе сострадание; его гнев непрестанно терзал[c], и ярость его сохранялась вечно».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не возвращу его (или этого) назад», то есть не отменю объявленного суда.'
    reason: lexical_alternative
  - marker: b
    text: Слово «брат», вероятно, напоминает о родстве Эдома и Израиля через Исава и Иакова.
    reason: cross_reference
  - marker: c
    text: Глагол передаёт образ хищника, разрывающего добычу. В еврейском тексте «гнев» — грамматический субъект этого глагола.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: פִּשְׁעֵי
  choice: преступления
  rationale: Обозначает тяжкие проступки и мятежные деяния; в современной русской речи естественно для пророческого обвинения.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: не отменю наказания
  rationale: 'Ясно передаёт эллиптическую формулу: Яхве не отвратит и не отменит объявленную кару; буквальная альтернатива вынесена в примечание.'
- source_word: רָדְפוֹ בַחֶרֶב אָחִיו
  choice: он преследовал с мечом своего брата
  rationale: Сохраняет олицетворение Эдома в мужском единственном числе, семейную лексику и образ вооружённого преследования.
- source_word: שִׁחֵת רַחֲמָיו
  choice: заглушил в себе сострадание
  rationale: Передаёт намеренное подавление естественной жалости более идиоматично по-русски, чем буквальное «погубил своё сострадание».
- source_word: וַיִּטְרֹף לָעַד אַפּוֹ
  choice: непрестанно терзал в гневе
  rationale: Сохраняет хищнический образ глагола «терзать» и допускаемую синтаксическую связь гнева с действующим Эдомом; альтернативный разбор отмечен в сноске.
- source_word: וְעֶבְרָתוֹ שְׁמָרָה נֶצַח
  choice: и навеки сохранил свою ярость
  rationale: Передаёт длительное удерживание непримиримой ярости; грамматически женская форма глагола в еврейском допускает «ярость» как подлежащее, что отражено в примечании к неоднозначности.
theological_decisions:
- issue: Связь Эдома с «братом»
  choice: Сохранено буквальное «своего брата»
  alternative: «родственный ему народ» или прямое указание на Израиль
  rationale: Текст намеренно использует родственную лексику, вероятно вызывая в памяти отношения Исава и Иакова; перевод не делает подразумеваемую идентификацию частью основного текста.
- issue: Олицетворение Эдома
  choice: 'Мужское единственное число: «он», «своего»'
  alternative: Средний род по слову «государство» или множественное число «эдомитяне»
  rationale: Еврейский текст олицетворяет Эдом формами мужского единственного числа; это также поддерживает образ брата.
- issue: Синтаксис заключительных строк об anger/wrath
  choice: Эдом непрестанно терзает в гневе и навеки хранит ярость
  alternative: «его гнев непрестанно терзал, и ярость его сохранялась вечно»
  rationale: Еврейская поэтическая конструкция допускает различное распределение субъекта и дополнения. Основной вариант естественен по-русски и сохраняет образ хищного терзания, а альтернативная персонификация чувств указана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формула «за три… и за четыре» сохранена. «Преступления» понятно широкой аудитории; «терзал» удерживает выразительную хищническую метафору. Все примечания имеют маркеры в основном тексте.
