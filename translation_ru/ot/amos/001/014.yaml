  yaml_path: translation/ot/amos/001/014.yaml
  text: I will kindle a fire in the wall of Rabbah[a], and it will consume her citadels, with a battle cry on the day of war[c][b], with a storm on the day of tempest.
translation:
  language: ru
  text: И Я зажгу огонь в стенах Раввы, и он пожрёт её чертоги[a] с боевым кличем[b] в день войны, в вихре в день бури[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её дворцы»; возможно также: «её крепости».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать громкий тревожный крик или сигнал, в том числе трубный.
    reason: lexical_alternative
  - marker: c
    text: Образы вихря и бури могут указывать на суд Господа, выступающего как небесный Воитель, и в то же время остаются частью картины военного разорения.
    reason: cross_reference
lexical_decisions:
- source_word: וְהִצַּתִּי
  choice: И Я зажгу
  rationale: 'Хифиль с пророческим значением будущего передаёт причинное действие: говорящий зажжёт огонь. Заглавное «Я» указывает на Господа как говорящего в контексте пророчества.'
- source_word: אֵשׁ
  choice: огонь
  rationale: Прямое обозначение огня как орудия суда; неопределённый артикль в русском не требуется.
- source_word: בְּחוֹמַת רַבָּה
  choice: в стенах Раввы
  rationale: Предлог ב передан как «в». Единственное число חוֹמָה имеет собирательный смысл городской стены; русское множественное «в стенах» естественно обозначает систему городских укреплений. Название аммонитской столицы передано традиционной русской формой «Равва».
- source_word: וְאָכְלָה
  choice: и он пожрёт
  rationale: Глагол буквально означает «есть, пожирать» и при подлежащем «огонь» создаёт выразительный образ полного уничтожения; местоимение «он» согласовано с русским словом «огонь».
- source_word: אַרְמְנוֹתֶיהָ
  choice: её чертоги
  rationale: אַרְמוֹן может означать дворец либо укреплённое значительное здание. «Чертоги» сохраняют возвышенный поэтический регистр и не сводят значение исключительно к крепостям; женский суффикс передан как «её» и относится к Равве.
- source_word: בִּתְרוּעָה
  choice: под боевой клич
  rationale: תְּרוּעָה обозначает громкий крик, сигнал тревоги или трубный звук. В сочетании с «днём войны» наиболее естественно «боевой клич», при этом возможная сигнальная окраска отмечена в сноске.
- source_word: בְּיוֹם מִלְחָמָה
  choice: в день войны
  rationale: Прямой перевод временного оборота, сохраняющий более широкое значение מִלְחָמָה — «война», а не только отдельное сражение.
- source_word: בְּסַעַר
  choice: среди бури
  rationale: סַעַר означает бурю, шторм или яростный ветер. «Среди бури» естественно передаёт сопутствующее обстоятельство и сохраняет образ стихийного неистовства.
- source_word: בְּיוֹם סוּפָה
  choice: в день урагана
  rationale: סוּפָה означает бурю, вихрь, ураган. «Ураган» сохраняет поэтическое усиление после слова «буря» и не создаёт в русском дословного повтора.
theological_decisions:
- issue: Характер образов суда
  choice: Текст изображает военное разорение посредством огня и бурной стихии, не уточняя, является ли буря буквальным явлением, метафорой натиска или образом явления Господа как воина.
  alternative: Истолковать бурю исключительно как прямую теофанию либо исключительно как метафору военного нападения.
  rationale: Сочетание «боевого клича» и «дня войны» с бурей и ураганом допускает одновременно военный и богословский уровни образа. Перевод сохраняет эту напряжённость, не разрешая её за читателя.
- issue: Женский суффикс в אַרְמְנוֹתֶיהָ
  choice: Передать как «её», относя местоимение к городу Равве.
  alternative: 'Передать обезличенно: «его чертоги» либо «чертоги города».'
  rationale: В древнееврейском город представлен в женском роде. Русская форма «её» сохраняет олицетворение, хотя собственное имя «Равва» само по себе также грамматически допускает женский род.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой образностью. «Пожрёт» и «чертоги» сохраняют силу и поэтичность оригинала, не делая синтаксис архаичным. Все сноски обозначены в основном тексте.
