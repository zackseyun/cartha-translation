  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י דַמֶּ֔שֶׂק וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל דּוּשָׁ֛/ם בַּ/חֲרֻצ֥וֹת הַ/בַּרְזֶ֖ל אֶת הַ/גִּלְעָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/003.yaml
  text: 'Thus says Yahweh: “For three transgressions of Damascus[a], and for four, I will not revoke it, because they threshed Gilead with threshing sledges of iron.”'
translation:
  language: ru
  text: 'Так говорит Яхве:


    «За три преступления Дамаска

    и за четыре Я не отменю его[a],

    потому что они молотили Галаад

    железными молотильными санями».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не обращу его вспять»; то есть не отменю вынесенного приговора.'
    reason: Еврейское выражение допускает более буквальную передачу и содержит местоименный суффикс мужского рода; примечание поясняет эллиптическую судебную формулу, не уточняя её референт в основном тексте.
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена стандартная формула пророческого посланника; личное имя יְהוָה передано как «Яхве».
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי דַמֶּשֶׂק וְעַל אַרְבָּעָה
  choice: За три преступления Дамаска, и за четыре
  rationale: Сохранена характерная для Амоса числовая формула нарастания. «Преступления» естественно передаёт פְּשָׁעִים как тяжкие мятежные проступки, не ограничивая значение только религиозной сферой.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: Я не отменю этого
  rationale: Еврейское выражение буквально означает «не обращу/не поверну этого назад» и оставляет предмет местоимения неуточнённым. Перевод сохраняет местоименную неопределённость и передаёт смысл неотменимости решения.
- source_word: עַל דּוּשָׁם
  choice: потому что они молотили
  rationale: Второе עַל имеет причинное значение, а דושׁ обозначает молотьбу; буквальный образ намеренно сохранён.
- source_word: בַּחֲרֻצוֹת הַבַּרְזֶל
  choice: железными молотильными санями
  rationale: חֲרֻצוֹת — снабжённые режущими элементами молотильные орудия, обычно сани или доски; выбран понятный русский технический эквивалент.
- source_word: אֶת הַגִּלְעָד
  choice: Галаад
  rationale: Сохранено традиционное русское название области; в контексте область метонимически включает её жителей.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и соответствует современному научному произношению.
- issue: Неуказанный объект в לֹא אֲשִׁיבֶנּוּ
  choice: Я не отменю этого
  alternative: Я не отменю наказания; Я не отвращу его; Я не отступлю
  rationale: Местоименный суффикс присутствует, но его референт прямо не назван. Основной текст не добавляет «наказание» и тем самым сохраняет лаконичность и неоднозначность еврейской формулы.
- issue: Объект насилия в образе молотьбы
  choice: молотили Галаад
  alternative: молотили жителей Галаада
  rationale: Еврейский текст называет сам Галаад. Перевод сохраняет метонимию и не вводит прямо не названных «жителей».
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Параллелизм и числовое нарастание сохранены; редкий предметный термин «молотильные сани» необходим для точности жестокого образа.
