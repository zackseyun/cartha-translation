  source_fidelity: 'Смысл в целом передан верно: сохранены суд, параллельные фигуры «жителя» и «держащего скипетр», образ руки, а также гибель остатка филистимлян. Однако מִן при названиях городов точнее передать как «из», а не «в». Глагол וַהֲשִׁיבוֹתִי допускает оттенок повторного обращения руки; его не следует утверждать в основном тексте, но можно сохранить как вариант в сноске.'
  naturalness: «Живущего в Ашдоде» и особенно «держащего скипетр — в Ашкелоне» звучат несколько тяжеловесно. «Жителя Ашдода» и «того, кто держит скипетр, из Ашкелона» естественнее в современном литературном русском и сохраняют репрезентативное единственное число.
  terminology: Составной титул אֲדֹנָי יְהוִה следует передать как «Владыка Яхве», чтобы различить титул и личное имя и соблюсти указанное в аудиторском следе решение передавать יהוה как «Яхве». «Владыка ГОСПОДЬ» менее естественно по-русски и не согласуется с этим решением.
  issues:
