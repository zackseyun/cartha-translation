base_translation:
  language: en
  yaml_path: translation/ot/amos/001/008.yaml
  text: And I will cut off the inhabitant from Ashdod[a], and the one who holds the scepter from Ashkelon; I will turn my hand against Ekron[b], and the remnant of the Philistines shall perish,” says the Lord GOD.
translation:
  language: ru
  text: 'Я истреблю жителя Ашдода

    и того, кто держит скипетр, — из Ашкелона.

    Я обращу руку Мою против Экрона[b],

    и погибнет остаток филистимлян, —

    говорит Владыка Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Возможный перевод: «Я вновь обращу руку Мою против Экрона». Еврейский оборот выражает направленное против него действие суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: Я истреблю
  rationale: Порода hифиль глагола כרת означает устранить, отсечь или истребить. Буквальное «отсеку» по-русски здесь звучало бы неестественно и могло бы создать ошибочный телесный образ; «истреблю» ясно передаёт смысл суда.
- source_word: יוֹשֵׁב מֵאַשְׁדּוֹד
  choice: живущего в Ашдоде
  rationale: Причастие יוֹשֵׁב буквально обозначает живущего, обитателя. Единственное число сохранено как собирательное или репрезентативное и не истолковано однозначно как указание на правителя.
- source_word: וְתוֹמֵךְ שֵׁבֶט מֵאַשְׁקְלוֹן
  choice: и держащего скипетр — в Ашкелоне
  rationale: Сохранён образ человека, держащего жезл власти; «скипетр» естественно передаёт שֵׁבֶט в данном контексте. Тире делает параллельную конструкцию ясной без сведения выражения просто к слову «правитель».
- source_word: וַהֲשִׁיבוֹתִי יָדִי עַל
  choice: Я обращу Свою руку против
  rationale: Передан еврейский образ направленной карающей силы. «Обращу руку против» естественно по-русски и ближе к формулировке источника, чем «простру руку», соответствующее иному устойчивому обороту.
- source_word: וְאָבְדוּ שְׁאֵרִית פְּלִשְׁתִּים
  choice: и погибнет остаток филистимлян
  rationale: Глагол אבד имеет непереходное значение «погибнуть, исчезнуть», а שְׁאֵרִית обозначает оставшуюся часть народа. Формулировка сохраняет и грамматическую направленность, и тему полного суда над уцелевшими.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  rationale: «Владыка» передаёт אֲדֹנָי, а написание «ГОСПОДЬ» обозначает заветное имя יהוה и позволяет сохранить оба элемента составного титула, не заменяя второй словом «Бог», которого в еврейском тексте нет.
theological_decisions:
- issue: Значение единственного числа יוֹשֵׁב в пророчестве о городе
  choice: живущего в Ашдоде
  alternative: правителя Ашдода; жителей Ашдода
  rationale: Форма буквально означает «живущий/обитатель» и может собирательно представлять население. Перевод сохраняет единственное число и не ограничивает смысл только правителем или только множеством жителей.
- issue: Передача титула אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  alternative: Владыка Яхве; Господь Бог
  rationale: Выбранная форма различает общий титул אֲדֹנָי и личное заветное имя יהוה. Она не вводит слово «Бог», отсутствующее в исходной фразе, при этом следует узнаваемой русской традиции обозначения тетраграмматона.
translation_notes:
  register: Современный литературный русский язык с торжественным ритмом пророческой речи. Сохранены параллелизм, образ скипетра, метафора Божьей руки и репрезентативное единственное число; архаизмы сведены к минимуму. Названия филистимских городов даны в общепринятых русских формах.
