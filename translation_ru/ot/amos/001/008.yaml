    rationale: В тексте стоят מֵאַשְׁדּוֹד и מֵאַשְׁקְלוֹן, буквально «из Ашдода» и «из Ашкелона». Русское «житель Ашдода» передаёт первую конструкцию естественно; во второй необходимо сохранить «из Ашкелона».
  - severity: medium
