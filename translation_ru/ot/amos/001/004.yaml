  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/בֵ֣ית חֲזָאֵ֑ל וְ/אָכְלָ֖ה אַרְמְנ֥וֹת בֶּן הֲדָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/004.yaml
  text: So I will send fire upon the house of Hazael[a], and it will consume the citadels of Ben-hadad.
translation:
  language: ru
  text: И пошлю огонь на дом Азаила, и он пожрёт крепости Венадада[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дворцы»; еврейское слово может обозначать дворцовые здания или укреплённые твердыни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: И пошлю
  rationale: Порода пиэль глагола שׁלח означает «посылать»; начальный союз וְ передан как «и», сохраняя связь с предшествующим пророческим приговором без добавления более узкого причинно-следственного оттенка.
- source_word: אֵשׁ
  choice: огонь
  rationale: Сохранён конкретный образ огня, который в контексте несёт смысл разрушительного суда, но не заменён истолковывающей перифразой.
- source_word: בְּבֵית חֲזָאֵל
  choice: на дом Азаила
  rationale: Предлог בְּ при глаголе «послать» и слове «огонь» обозначает цель поражения. «Дом» сохраняет возможные значения царского рода, владения и здания.
- source_word: וְאָכְלָה
  choice: и он пожрёт
  rationale: Глагол אכל буквально связан с поеданием, а при огне идиоматически означает уничтожение. «Пожрёт» естественно для русского образа огня и сохраняет выразительность оригинала.
- source_word: אַרְמְנוֹת
  choice: крепости
  rationale: Слово может обозначать укреплённые дворцы, цитадели или твердыни. «Крепости» ясно передаёт оборонительный аспект, а более широкий диапазон отмечен в сноске.
- source_word: חֲזָאֵל
  choice: Азаил
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: בֶּן הֲדָד
  choice: Венадад
  rationale: Использована устоявшаяся русская библейская форма царского имени или династического титула.
theological_decisions:
- issue: Значение выражения «дом Азаила»
  choice: Сохранено широкое выражение «дом Азаила», допускающее указание на царский дом или династию.
  alternative: Передать только как буквальный дворец или здание Азаила.
  rationale: Пророческая речь может подразумевать правящий род и его владения, тогда как оригинал не требует ограничивать смысл одним зданием.
- issue: Образ огня
  choice: Огонь сохранён как конкретный образ пророческого суда.
  alternative: Заменить образ прямым указанием на войну, разрушение или Божий суд.
  rationale: Буквальная образность исходного текста выразительна и не вынуждает переводчика заранее определять способ исполнения суда.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом пророческого изречения. «Пожрёт» сохраняет яркую библейскую метафору, оставаясь понятным современному читателю; имена даны в традиционных русских библейских формах.
