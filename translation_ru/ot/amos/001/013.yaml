  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י בְנֵֽי עַמּ֔וֹן וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל בִּקְעָ/ם֙ הָר֣וֹת הַ/גִּלְעָ֔ד לְמַ֖עַן הַרְחִ֥יב אֶת גְּבוּלָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/013.yaml
  text: 'Thus says Yahweh: “For three transgressions of the sons of Ammon[a], and for four, I will not revoke it[b], because they ripped open the pregnant women of Gilead in order to enlarge their border.”'
translation:
  language: ru
  text: 'Так говорит Яхве: «За три преступления сыновей Аммона[a] и за четыре Я не отменю приговора[b], потому что они вспороли беременных женщин Галаада, чтобы расширить свои границы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «аммонитян».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «не обращу его вспять»; то есть не отменю возвещённый приговор.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена устойчивая пророческая формула в естественной для современного русского языка форме; личное имя Бога передано транслитерацией.
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי ... וְעַל אַרְבָּעָה
  choice: За три преступления… и за четыре
  rationale: Сохраняет характерную для Амоса числовую формулу нарастания и нравственно-бунтарский оттенок פֶּשַׁע.
- source_word: בְנֵי עַמּוֹן
  choice: сыновей Аммона
  rationale: Формально передаёт еврейское выражение и остаётся понятным по-русски; более естественное этническое обозначение указано в сноске.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: не отменю этого
  rationale: Не добавляет отсутствующего в еврейском тексте существительного «наказание» и сохраняет неявный референт местоименного суффикса; по контексту речь идёт о возвещённом приговоре.
- source_word: בִּקְעָם
  choice: они вспарывали
  rationale: Передаёт жестокий и конкретный характер действия без смягчающего эвфемизма.
- source_word: הָרוֹת הַגִּלְעָד
  choice: беременных женщин Галаада
  rationale: Субстантивированное прилагательное естественно раскрыто словом «женщин», а связь с Галаадом сохранена без превращения её исключительно в указание места.
- source_word: לְמַעַן הַרְחִיב אֶת גְּבוּלָם
  choice: чтобы расширить свои границы
  rationale: Ясно выражает цель; множественное «границы» идиоматично по-русски при обозначении территориального расширения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога, явно присутствующее в исходном тексте, и не подменяет его титулом.
- issue: Неявный объект в לֹא אֲשִׁיבֶנּוּ
  choice: не отменю этого
  alternative: не отменю наказания; не отвращу этого
  rationale: Выбранный вариант не конкретизирует сверх текста, что именно Бог не возвратит или не отменит, сохраняя исходную неоднозначность при приемлемом русском синтаксисе.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Числовая формула и резкое описание злодеяния сохранены; неявный объект глагола не раскрыт как «наказание» в основном тексте.
