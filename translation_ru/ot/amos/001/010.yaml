  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/ח֣וֹמַת צֹ֑ר וְ/אָכְלָ֖ה אַרְמְנֹתֶֽי/הָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/010.yaml
  text: So I will send fire upon the wall of Tyre[a], and it will consume her citadels.
translation:
  language: ru
  text: И пошлю огонь на стену Тира, и он поглотит его крепости[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дворцы». Еврейское слово может обозначать как дворцовые здания, так и укреплённые твердыни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: И пошлю
  rationale: Союз וְ сохраняет связь с предшествующим приговором, а форма первого лица передана будущим временем как пророческое возвещение.
- source_word: אֵשׁ
  choice: огонь
  rationale: Прямое соответствие еврейскому слову; образ суда сохранён без уточнения его конкретного механизма.
- source_word: בְּחוֹמַת צֹר
  choice: на стену Тира
  rationale: Предлог בְּ в формуле суда естественно передаётся как «на»; единственное число «стена» соответствует исходному тексту.
- source_word: וְאָכְלָה
  choice: и он поглотит
  rationale: Глагол буквально означает «есть, пожирать» и обычно описывает уничтожающее действие огня; «поглотит» звучит естественно и сохраняет силу образа.
- source_word: אַרְמְנֹתֶיהָ
  choice: его крепости
  rationale: אַרְמוֹן может обозначать дворец или укреплённое здание. В контексте стены осаждаемого города «крепости» передаёт фортификационный оттенок; местоимение согласовано с русским названием «Тир».
theological_decisions:
- issue: Природа огня как орудия Божьего суда
  choice: Сохранён образ посланного огня без уточнения, является ли он буквальным пожаром, военным разорением или метафорой.
  alternative: Истолковать огонь прямо как буквальное возгорание либо как образ вторжения.
  rationale: Исходный текст называет огонь и его разрушительное действие, но не определяет механизм исполнения пророчества.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная пророческая формула сохранена без архаизации.
