  source_fidelity: 'Текст точно передаёт еврейскую формулу: первое лицо будущего времени («пошлю»), огонь, направленный на стену Тира, и последующее уничтожение городских אַרְמְנוֹת. Единственное число «стену» соответствует חוֹמַת. Мужской род в «он поглотит» нормативно соотнесён с русским словом «огонь»; «его» естественно соотносится с названием «Тир», хотя в еврейском суффикс женского рода согласован с городом.'
