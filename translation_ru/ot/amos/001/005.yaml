source:
  edition: WLC
  text: וְ/שָֽׁבַרְתִּי֙ בְּרִ֣יחַ דַּמֶּ֔שֶׂק וְ/הִכְרַתִּ֤י יוֹשֵׁב֙ מִ/בִּקְעַת אָ֔וֶן וְ/תוֹמֵ֥ךְ שֵׁ֖בֶט מִ/בֵּ֣ית עֶ֑דֶן וְ/גָל֧וּ עַם אֲרָ֛ם קִ֖ירָ/ה אָמַ֥ר יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/005.yaml
  text: I will break the gate-bar of Damascus[a], and I will cut off the inhabitant from the Valley of Aven and the one who holds the scepter from Beth-eden[b]; and the people of Aram will go into exile to Kir,” says Yahweh.
translation:
  language: ru
  text: Я сломаю засов ворот Дамаска и истреблю обитателей долины Авен[a], а того, кто держит скипетр, — из Бет-Эдена[b]. Народ Арама пойдёт в изгнание в Кир, — говорит Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Авен» созвучно еврейскому слову со значением «зло» или «беда»; здесь это, вероятно, географическое название с возможной пророческой игрой слов.
    reason: lexical_alternative
  - marker: b
    text: «Бет-Эден» можно буквально перевести как «дом Эдена»; это место иногда отождествляют с историческим Бит-Адини.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: Я сломаю
  rationale: Пророческий перфект в данном контексте передаёт будущее действие; «сломаю» естественно сохраняет образ разрушения городской защиты.
- source_word: בְּרִיחַ דַּמֶּשֶׂק
  choice: засов ворот Дамаска
  rationale: בְּרִיחַ обозначает брус или засов, запиравший ворота; добавление «ворот» ясно передаёт фортификационный образ, подразумеваемый исходным словом.
- source_word: וְהִכְרַתִּי
  choice: истреблю
  rationale: Глагол означает решительно устранить или отсечь и в контексте суда может подразумевать уничтожение. «Истреблю» звучит естественно в русском пророческом регистре.
- source_word: יוֹשֵׁב
  choice: жителя
  rationale: Причастие в единственном числе может иметь собирательное или репрезентативное значение. Буквальное «жителя» сохраняет эту особенность и не подменяет его словом «правитель».
- source_word: מִבִּקְעַת אָוֶן
  choice: из долины Авен
  rationale: בִּקְעָה — долина или равнина; אָוֶן здесь, вероятно, топоним с возможной игрой на значении «зло, беда». В основном тексте сохранено название места.
- source_word: וְתוֹמֵךְ שֵׁבֶט
  choice: того, кто держит скипетр
  rationale: Фраза буквально сохраняет образ держателя правительского жезла и указывает на носителя власти, не заменяя метафору толкованием.
- source_word: מִבֵּית עֶדֶן
  choice: из Бет-Эдена
  rationale: Сочетание передано как географическое название; буквальное значение и возможная историческая идентификация отмечены в сноске.
- source_word: וְגָלוּ
  choice: пойдёт в изгнание
  rationale: Глагол обозначает уход или переселение в изгнание. Формулировка не вводит прямо не названного деятеля депортации.
- source_word: עַם אֲרָם
  choice: народ Арама
  rationale: Сохранено древнееврейское этногеографическое название, без замены более поздним «Сирия».
- source_word: קִירָה
  choice: в Кир
  rationale: Направительный суффикс указывает на движение к месту; «в Кир» естественно передаёт это по-русски.
- source_word: אָמַר יְהוָה
  choice: говорит Яхве
  rationale: Настоящее время соответствует устойчивой формуле пророческой речи; личное имя Бога передано транслитерацией «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит Тетраграмматон — личное имя Бога. «Яхве» непосредственно передаёт его и не заменяет титулом.
- issue: Значение יוֹשֵׁב в параллелизме с держателем скипетра
  choice: жителя
  alternative: правителя
  rationale: Хотя параллелизм допускает политический оттенок, слово само по себе означает «живущий, житель». Перевод сохраняет лексическую форму и не устраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм сохранён; топонимы переданы транслитерацией, а подлинные лексические и исторические альтернативы вынесены в сноски.
