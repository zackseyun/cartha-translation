source:
  edition: WLC
  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/תֵימָ֑ן וְ/אָכְלָ֖ה אַרְמְנ֥וֹת בָּצְרָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/012.yaml
  text: So I will send fire upon Teman[a], and it will consume the citadels of Bozrah.
translation:
  language: ru
  text: И пошлю огонь на Теман, и он пожрёт крепости[a] Боцры.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дворцы». Еврейское слово может обозначать дворцовые здания или укреплённые твердыни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שִׁלַּחְתִּי
  choice: И пошлю
  rationale: Форма глагола означает «пошлю», а союз וְ естественно передаётся как «и», сохраняя связь с предшествующим приговором.
- source_word: אֵשׁ
  choice: огонь
  rationale: Прямое значение слова и устойчивый образ Божьего суда в пророческих речениях; конкретный образ не следует заменять отвлечённым понятием разрушения.
- source_word: בְּ/תֵימָן
  choice: на Теман
  rationale: Теман — географическое название. В сочетании с глаголом «послать» и образом направленного суда предлог בְ естественно передаётся по-русски как «на».
- source_word: וְ/אָכְלָה
  choice: и он пожрёт
  rationale: Глагол אָכַל буквально означает «есть», а при огне — «пожирать». Такой перевод естественен по-русски, сохраняет олицетворённый образ огня и силу исходного выражения.
- source_word: אַרְמְנוֹת
  choice: крепости
  rationale: Слово может обозначать как дворцовые здания, так и укреплённые твердыни. «Крепости» ясно передаёт оборонительный характер объектов; значение «дворцы» сохранено в сноске.
- source_word: בָּצְרָה
  choice: Боцры
  rationale: Боцра — географическое название; родительный падеж естественно передаёт конструкцию «крепости Боцры».
theological_decisions:
- issue: Формула пророческого суда
  choice: Сохранить прямое возвещение о том, что Бог пошлёт огонь
  alternative: Передать огонь отвлечённо как общее разрушение
  rationale: Еврейский текст использует конкретный и богословски весомый образ непосредственного Божьего суда; перевод не смягчает и не истолковывает его вместо читателя.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и торжественной силы пророческого речения. Использованы формы географических названий «Теман» и «Боцра», близкие к еврейскому звучанию; глагол «пожрёт» сохраняет яркую библейскую образность, оставаясь понятным современному читателю.
