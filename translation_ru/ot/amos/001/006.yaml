  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י עַזָּ֔ה וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל הַגְלוֹתָ֛/ם גָּל֥וּת שְׁלֵמָ֖ה לְ/הַסְגִּ֥יר לֶ/אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/006.yaml
  text: 'Thus says Yahweh: “For three transgressions of Gaza[a], and for four, I will not revoke its punishment[b], because they carried away an entire population into exile to hand them over to Edom.”'
translation:
  language: ru
  text: 'Так говорит Яхве: «За три преступления Газы и за четыре не отменю ей наказания[a], потому что они угнали в плен весь народ[b], чтобы выдать его Эдому».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не обращу этого назад»; в этой формуле суда подразумевается, что Яхве не отменит объявленного наказания.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «они увели в плен всех пленников, чтобы выдать их Эдому». Еврейское выражение подчёркивает полноту уведённой группы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, в принятой современной русской транслитерации.
- source_word: פִּשְׁעֵי
  choice: преступления
  rationale: Сохраняет нравственно-правовой смысл פשע в контексте суда над народами; «мятежи» здесь могло бы неоправданно сузить значение.
- source_word: עַל שְׁלֹשָׁה ... וְעַל אַרְבָּעָה
  choice: за три… и за четыре
  rationale: Сохраняет характерную для Амоса формулу числового нарастания, указывающую на переполнение меры вины, а не обязательно на буквальный подсчёт.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: не отменю ей наказания
  rationale: Буквально выражение означает «не возвращу/не обращу этого назад»; в формуле суда подразумевается объявленное Газе наказание. Местоимение «ей» соотнесено с Газой как коллективным субъектом.
- source_word: הַגְלוֹתָם גָּלוּת שְׁלֵמָה
  choice: они угнали в плен весь народ
  rationale: Передаёт насильственное перемещение и полноту охваченной пленением группы естественным русским языком, не превращая пророческую речь в бюрократическое описание депортации.
- source_word: לְהַסְגִּיר
  choice: чтобы выдать его
  rationale: Передаёт передачу пленников под власть другой стороны; местоимение согласовано с собирательным существительным «народ».
- source_word: לֶאֱדוֹם
  choice: Эдому
  rationale: Нормативная русская форма названия народа и страны в дательном падеже после «выдать».
theological_decisions:
- issue: Не выраженный явно объект в לֹא אֲשִׁיבֶנּוּ
  choice: «не отменю ей наказания» — объект раскрыт по контексту формулы суда
  alternative: «не обращу этого назад» или «не отступлю» с сохранением неуточнённого объекта
  rationale: Еврейская формула буквально оставляет содержание местоимения контексту, однако в Ам 1–2 речь идёт о неотвратимости объявленного суда. Добавление «наказания» ясно передаёт смысл, а сноска сохраняет формальную неоднозначность.
- issue: Объём значения גָּלוּת שְׁלֵמָה
  choice: полное пленение народа или сообщества
  alternative: «всех пленников» либо «целую толпу пленников»
  rationale: Выражение подчёркивает всеохватность увода в плен, но само по себе не требует понимать под ним абсолютно всё население города; сноска отражает возможную более формальную передачу.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной пророческой интонацией. Сохранены формула «за три… и за четыре» и имя «Яхве». «Угнали в плен» выбрано как живое и серьёзное обозначение насильственного массового увода; неоднозначности формулы суда и выражения о полноте плена вынесены в сноски.
