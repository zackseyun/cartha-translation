  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/חוֹמַ֣ת עַזָּ֑ה וְ/אָכְלָ֖ה אַרְמְנֹתֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/007.yaml
  text: So I will send fire upon the wall of Gaza[a], and it will consume her citadels.
translation:
  language: ru
  text: И пошлю огонь на стену Газы, и он пожрёт её цитадели[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дворцы». Еврейское слово может обозначать дворцовые здания, часто укреплённые или связанные с городской знатью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: И пошлю
  rationale: Пиэль глагола שׁלח с формой первого лица единственного числа выражает прямое действие Бога; союз וְ сохранён как «и», связывая приговор с предыдущим пророчеством.
- source_word: אֵשׁ
  choice: огонь
  rationale: Прямое и естественное соответствие, сохраняющее образ огненного суда.
- source_word: בְּחוֹמַת
  choice: на стену
  rationale: 'Предлог בְּ при глаголе «послать» и существительном «огонь» естественно передаётся по-русски как направление разрушительного воздействия: «послать огонь на стену».'
- source_word: עַזָּה
  choice: Газы
  rationale: Принятая русская форма топонима Газа в родительном падеже.
- source_word: וְאָכְלָה
  choice: и он пожрёт
  rationale: Глагол אכל буквально означает «есть, пожирать» и применительно к огню ярко передаёт полное уничтожение; будущее время отражает значение пророческого перфекта, а местоимение относится к огню.
- source_word: אַרְמְנֹתֶיהָ
  choice: её цитадели
  rationale: אַרְמוֹן обозначает дворцовые, нередко укреплённые здания. «Цитадели» сохраняет оборонительный и элитарный оттенок в контексте суда над городом; женское местоимение передаёт отнесённость к Газе.
theological_decisions:
- issue: Женский местоименный суффикс при названии города
  choice: её цитадели
  alternative: цитадели города
  rationale: Еврейский суффикс женского рода относится к Газе. Русское «её» естественно сохраняет грамматический род и лёгкую персонификацию города, не добавляя богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краток и близок к еврейскому оригиналу; «пожрёт» сохраняет традиционный, но понятный образ уничтожающего огня.
