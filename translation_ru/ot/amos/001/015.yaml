  text: וְ/הָלַ֥ךְ מַלְכָּ֖/ם בַּ/גּוֹלָ֑ה ה֧וּא וְ/שָׂרָ֛י/ו יַחְדָּ֖ו אָמַ֥ר יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/015.yaml
  text: And their king shall go into exile[a], he and his officials together, says Yahweh.
translation:
  language: ru
  text: И их царь пойдёт в изгнание[a] — он и его сановники вместе, — говорит Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Милком» — аммонитский бог; некоторые понимают эти слова так, что бог Аммона уйдёт в изгнание вместе со своими жрецами или сановниками.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָלַךְ
  choice: пойдёт
  rationale: Перфект с союзом в пророческом возвещении выражает будущее событие; форма «пойдёт» естественна по-русски и сохраняет тон приговора.
- source_word: מַלְכָּם
  choice: их царь
  rationale: Масоретская огласовка и местоименный суффикс дают значение «их царь», согласующееся с последующим упоминанием его сановников; возможное прочтение как имени божества сохранено в сноске.
- source_word: בַּגּוֹלָה
  choice: в изгнание
  rationale: Сочетание обозначает отправление в изгнание вследствие завоевания; русская конструкция с глаголом движения передаёт направленность.
- source_word: הוּא
  choice: он
  rationale: Самостоятельное местоимение выделяет царя и естественно вводит присоединительную конструкцию «он и его сановники».
- source_word: וְשָׂרָיו
  choice: и его сановники
  rationale: שָׂרִים обозначает высокопоставленных правителей или должностных лиц; «сановники» соответствует царскому окружению и сохраняет достоинство регистра.
- source_word: יַחְדָּו
  choice: вместе
  rationale: Непосредственно передаёт совместное изгнание царя и его сановников.
- source_word: אָמַר יְהוָה
  choice: говорит Яхве
  rationale: Настоящее время естественно передаёт пророческую формулу, а личное имя יהוה транслитерируется как «Яхве».
theological_decisions:
- issue: Относится ли מַלְכָּם к человеческому царю или к аммонитскому божеству Милкому
  choice: 'человеческий правитель: «их царь»'
  alternative: «Милком» — имя аммонитского бога; в таком случае речь может идти о его изгнании вместе со служителями или сановниками
  rationale: Масоретская огласовка и ближайший синтаксический контекст поддерживают значение «их царь», однако согласный текст допускает значимое альтернативное прочтение «Милком», поэтому неоднозначность отмечена, а не устранена.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Тире перед присоединительной конструкцией помогает передать акцент еврейского самостоятельного местоимения. Имя יהוה передано как «Яхве».
