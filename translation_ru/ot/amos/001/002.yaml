  text: וַ/יֹּאמַ֓ר יְהוָה֙ מִ/צִיּ֣וֹן יִשְׁאָ֔ג וּ/מִ/ירוּשָׁלִַ֖ם יִתֵּ֣ן קוֹל֑/וֹ וְ/אָֽבְלוּ֙ נְא֣וֹת הָ/רֹעִ֔ים וְ/יָבֵ֖שׁ רֹ֥אשׁ הַ/כַּרְמֶֽל׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/002.yaml
  text: 'And he said: Yahweh roars from Zion and gives his voice from Jerusalem[a]; the pastures of the shepherds mourn[c][b], and the summit of Carmel dries up.'
translation:
  language: ru
  text: 'И сказал он:


    «Яхве рычит с Сиона

    и подаёт Свой голос из Иерусалима[a];

    скорбят пастбища пастухов[b],

    и засыхает вершина Кармила[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «даёт Свой голос»; возможный перевод: «возвышает Свой голос».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «луга пастухов».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «голова Кармила», то есть его вершина, самая высокая часть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо стоящее в еврейском тексте, а не заменяет его титулом «Господь».
- source_word: יִשְׁאָג
  choice: рычит
  rationale: Глагол обозначает рёв или рычание льва; «рычит» естественно сохраняет образ близкой угрозы и хорошо сочетается с исходным предлогом «с Сиона».
- source_word: יִתֵּן קוֹלוֹ
  choice: подаёт Свой голос
  rationale: Сравнительно буквально передаёт еврейскую идиому «даёт Свой голос» и сохраняет параллелизм с «рычит»; более истолковывающее «гремит» не внесено в основной текст.
- source_word: נְאוֹת הָרֹעִים
  choice: пастбища пастухов
  rationale: В контексте поражённой земли נְאוֹת означает места выпаса; буквальная связь с пасущими стада сохранена.
- source_word: וְאָבְלוּ
  choice: скорбят
  rationale: Сохраняет олицетворение земли и основной смысл глагола «скорбеть, быть в трауре», не сводя образ к одному лишь физическому увяданию.
- source_word: רֹאשׁ הַכַּרְמֶל
  choice: вершина Кармила
  rationale: רֹאשׁ буквально означает «голова», но применительно к возвышенности естественно передаётся как «вершина»; название Кармил не расширено добавлением отсутствующего в тексте слова «гора».
- source_word: וַיֹּאמַר
  choice: И сказал он
  rationale: Сохранены соединительный ход повествования и местоименная отсылка к Амосу из предыдущего стиха.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя. Транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
- issue: Временная форма пророческих глаголов יִשְׁאָג и יִתֵּן
  choice: 'настоящее время: «рычит… подаёт»'
  alternative: 'будущее время: «будет рычать… подаст»'
  rationale: Еврейские формы допускают перспективное прочтение, но здесь изречение представляет действие Яхве как живую и непосредственную пророческую реальность; настоящее время сохраняет афористическую силу, не отрицая будущего исполнения.
translation_notes:
  register: Современный литературный русский язык с краткими поэтическими строками. Сохранены образ львиного рычания, олицетворение пастбищ и параллелизм исходного текста. Заглавное «Свой» употреблено как почтительное издательское оформление местоимения, относящегося к Богу.
