  text: כִּ֤י יָדַ֨עְתִּי֙ רַבִּ֣ים פִּשְׁעֵי/כֶ֔ם וַ/עֲצֻמִ֖ים חַטֹּֽאתֵי/כֶ֑ם צֹרְרֵ֤י צַדִּיק֙ לֹ֣קְחֵי כֹ֔פֶר וְ/אֶבְיוֹנִ֖ים בַּ/שַּׁ֥עַר הִטּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/012.yaml
  text: For I know how many your transgressions are, and how great your sins are—oppressors of the righteous[a], takers of a bribe[b], and those who turn aside the needy in the gate.
translation:
  language: ru
  text: 'Ибо Я знаю, как многочисленны ваши преступления и как тяжки ваши грехи: вы притесняете праведника, берёте взятки[a] и лишаете бедняков правосудия у городских ворот[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать также «выкуп» или «плату»; здесь, в контексте неправедного суда, речь идёт о взятке.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «отклоняете бедняков у ворот». У городских ворот обычно разбирали судебные дела и принимали общественные решения; поэтому выражение означает отказ беднякам в правосудии.'
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего предостережения; «ибо» сохраняет пояснительную связь и соответствует возвышенному, но понятному регистру.
- source_word: יָדַעְתִּי
  choice: Я знаю
  rationale: Перфект глагола ידע здесь выражает твёрдое и актуальное знание Бога; настоящее время естественно передаёт эту силу по-русски.
- source_word: רַבִּים פִּשְׁעֵיכֶם
  choice: как многочисленны ваши преступления
  rationale: Сохраняется вынесенное вперёд определение «многочисленны» и усилительная конструкция; «преступления» передаёт פשׁע как сознательные нарушения и мятежные проступки.
- source_word: וַעֲצֻמִים חַטֹּאתֵיכֶם
  choice: и как тяжки ваши грехи
  rationale: «Тяжки» передаёт силу, вес и серьёзность עֲצֻמִים, не сводя значение лишь к численности.
- source_word: צֹרְרֵי צַדִּיק
  choice: вы притесняете праведника
  rationale: Причастная характеристика передана личной глагольной формой для естественного русского синтаксиса. צרר обозначает враждебное притеснение, а צַדִּיק оставлено в единственном числе как обобщённое обозначение праведного или правого человека.
- source_word: לֹקְחֵי כֹפֶר
  choice: берёте взятки
  rationale: В судебном контексте כֹפֶר обозначает плату, которой добиваются неправого решения; «взятки» ясно передаёт контекстуальный смысл, а более широкое значение отмечено в сноске.
- source_word: וְאֶבְיוֹנִים
  choice: бедняков
  rationale: אֶבְיוֹן обозначает бедного, нуждающегося и социально уязвимого человека; «бедняков» естественно в данном общественно-судебном контексте.
- source_word: בַּשַּׁעַר
  choice: у городских ворот
  rationale: Добавление «городских» раскрывает культурно подразумеваемое место суда и общественных решений, не изменяя референта.
- source_word: הִטּוּ
  choice: лишаете … правосудия
  rationale: Hiphil от נטה буквально выражает отклонение или отстранение; в судебном контексте речь идёт об отказе бедным в справедливом разбирательстве. Более буквальная возможность сохранена в сноске.
theological_decisions:
- issue: Значение צַדִּיק в пророческом обличении общественной несправедливости
  choice: праведника
  alternative: невиновного; того, кто прав в суде
  rationale: «Праведник» сохраняет широкий нравственно-правовой смысл слова и не ограничивает его исключительно судебной невиновностью.
- issue: Степень экспликации הִטּוּ в судебном контексте
  choice: лишаете бедняков правосудия
  alternative: отстраняете (отклоняете) бедняков у ворот
  rationale: Контекст городских ворот указывает на судебное разбирательство, поэтому основной текст передаёт подразумеваемый результат действия; буквальная образность и неоднозначность отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Начальное «Ибо» сохраняет связь с контекстом; параллелизм «как многочисленны… как тяжки…» отражает усиленную структуру еврейского текста. Причастные обороты источника преобразованы в параллельные личные формы ради ясности и естественности русского обращения.
