  source_fidelity: Первая часть точно передаёт שָׂנְאוּ ... מוֹכִיחַ и общественно-судебный контекст בַּשַּׁעַר. Настоящее время уместно для характеристики устойчивого поведения. Во второй части «питают отвращение» хорошо передаёт интенсивность יְתָעֵבוּ. Однако «говорит непорочно» в современном русском неестественно и может создавать несвойственную оригиналу ассоциацию с ритуальной или сексуальной непорочностью. תָּמִים здесь характеризует честность, цельность или безупречность речи/говорящего; «говорит честно» передаёт основной смысл без излишнего догматического уточнения.
  naturalness: «Того, кто обличает у городских ворот» и «питают отвращение к тому» звучат литературно и ясно. Замена «говорит непорочно» на «говорит честно» устраняет неидиоматичность, сохраняя пророческий регистр и параллелизм.
