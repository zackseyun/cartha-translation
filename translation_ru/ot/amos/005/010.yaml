  text: שָׂנְא֥וּ בַ/שַּׁ֖עַר מוֹכִ֑יחַ וְ/דֹבֵ֥ר תָּמִ֖ים יְתָעֵֽבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/010.yaml
  text: They hate the one who reproves in the gate[b][a], and they abhor the one who speaks with integrity.
translation:
  language: ru
  text: Они ненавидят того, кто обличает у городских ворот[a], и питают отвращение к тому, кто говорит честно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Городские ворота служили обычным местом судебных разбирательств и вынесения общественных решений.
    reason: cultural_note
  - marker: b
    text: 'Или: «говорит безупречно»; возможно также: «говорит то, что безупречно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנְאוּ
  choice: они ненавидят
  rationale: Перфект qal 3-го лица множественного числа здесь описывает устойчивое поведение; настоящее время естественно передаёт постоянную общественную практику.
- source_word: בַשַּׁעַר
  choice: у городских ворот
  rationale: Речь идёт о городских воротах как обычном месте суда и общественного разбирательства. Уточнение «городских» делает древнюю реалия понятной современному читателю.
- source_word: מוֹכִיחַ
  choice: того, кто обличает
  rationale: Причастие от יכח обозначает человека, который исправляет, обличает или предъявляет обвинение; формулировка сохраняет как нравственный, так и судебный оттенок.
- source_word: וְדֹבֵר
  choice: и ... к тому, кто говорит
  rationale: Причастная конструкция передана параллельно первой половине стиха.
- source_word: תָּמִים
  choice: непорочно
  rationale: Слово может характеризовать речь как безупречную или говорящего как честного и цельного. Наречие «непорочно» сохраняет близкую связь с глаголом «говорит», не сводя смысл исключительно к правдивости.
- source_word: יְתָעֵבוּ
  choice: питают отвращение
  rationale: Форма piel выражает сильное неприятие. Эта формулировка сохраняет интенсивность и отличает вторую характеристику от простого «ненавидят».
theological_decisions:
- issue: Отнесение תָּמִים к содержанию речи или нравственному качеству говорящего
  choice: «говорит непорочно» с лексической сноской
  alternative: «говорит правду» / «говорит честно» / «говорит безупречное»
  rationale: Еврейская конструкция допускает оттенки безупречной, честной речи и нравственной цельности. Основной текст сохраняет формальную неоднозначность, а сноска обозначает естественные варианты.
translation_notes:
  register: Современный литературный русский язык с dignified пророческим тоном. Параллелизм двух частей сохранён; древняя судебно-общественная реалия пояснена без конфессионального истолкования.
