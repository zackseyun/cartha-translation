base_translation:
  language: en
  yaml_path: translation/ot/amos/005/018.yaml
  text: Woe to those who long for the day of Yahweh! Why would you have the day of Yahweh? It is darkness[a], and not light.
translation:
  language: ru
  text: Горе тем, кто жаждет дня Яхве! Зачем вам день Яхве?[a] Он — тьма, а не свет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Для чего это вам — день Яхве?» Еврейская фраза эллиптична и имеет силу риторического вопроса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Пророческое восклицание одновременно выражает скорбь и возвещает бедствие; «горе» сохраняет обе стороны смысла.
- source_word: הַמִּתְאַוִּים
  choice: тем, кто жаждет
  rationale: Причастие породы хитпаэль описывает людей, которым свойственно сильное, настойчивое желание; «жаждет» естественно передаёт эту напряжённость и иронию обличения.
- source_word: יוֹם יְהוָה
  choice: день Яхве
  rationale: Сохранён устойчивый пророческий образ «дня Яхве» и личное Божье имя, представленное тетраграмматоном.
- source_word: לָמָּה זֶּה לָכֶם
  choice: Зачем вам
  rationale: 'Кратко и естественно передаёт эллиптический риторический вопрос: этот день не принесёт слушателям ожидаемой пользы.'
- source_word: הוּא חֹשֶׁךְ וְלֹא אוֹר
  choice: Он — тьма, а не свет
  rationale: Местоимение сохранено как подлежащее, а буквальная антитеза тьмы и света передаёт центральный пророческий образ без истолковывающего расширения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; форма «Яхве» сохраняет его как имя и соответствует наиболее принятой научной реконструкции произношения.
- issue: Характер «дня Яхве» для адресатов
  choice: Он — тьма, а не свет
  alternative: Он принесёт бедствие, а не спасение
  rationale: 'Сохранена образность и богословское напряжение оригинала: ожидаемый адресатами день не объясняется перифразом, а прямо назван тьмой.'
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Риторическая резкость и параллельная антитеза оригинала сохранены.
