base_translation:
  language: en
  yaml_path: translation/ot/amos/005/027.yaml
  text: Therefore I will send you into exile beyond Damascus,” says Yahweh[a], whose name is the God of hosts.
translation:
  language: ru
  text: '«Поэтому Я отправлю вас в изгнание[a] за Дамаск, — говорит Яхве, Бог Воинств — имя Его».


    [a] Или: «Я переселю вас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я переселю вас».'
    reason: 'Лексическая альтернатива: hifil глагола גלה можно передать одним глаголом «переселю», подразумевающим насильственное изгнание.'
lexical_decisions:
- source_word: וְהִגְלֵיתִי
  choice: Поэтому Я отправлю вас в изгнание
  rationale: Глагол גלה в породе hifil означает «отправить/увести в изгнание». Союз וְ с учётом связи с предшествующим приговором передан как «поэтому».
- source_word: אֶתְכֶם
  choice: вас
  rationale: Показатель прямого дополнения с суффиксом 2-го лица мужского рода множественного числа; в русском естественно передаётся местоимением «вас».
- source_word: מֵהָלְאָה לְדַמָּשֶׂק
  choice: за Дамаск
  rationale: Сочетание указывает на перемещение дальше Дамаска; краткое русское «за Дамаск» сохраняет пространственный смысл.
- source_word: אָמַר
  choice: говорит
  rationale: В пророческой речевой формуле форма qatal естественно передаётся настоящим временем, сохраняющим непосредственность изречения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Бог Воинств
  rationale: «Воинства» сохраняет широту значения צְבָאוֹת и не уточняет без основания, земные это войска или небесные силы.
- source_word: שְׁמוֹ
  choice: чьё имя
  rationale: Явно сохранено еврейское именное предложение «его имя», при этом относительная конструкция делает фразу естественной по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога; «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение צְבָאוֹת в божественном титуле
  choice: Воинств
  alternative: войск; небесных воинств
  rationale: Выбор сохраняет возможную смысловую широту исходного слова и не ограничивает его одним видом воинства.
- issue: Связь אֱלֹהֵי צְבָאוֹת שְׁמוֹ
  choice: чьё имя — Бог Воинств
  alternative: Бог Воинств — имя Его
  rationale: Относительная конструкция ясно передаёт именное предложение и сохраняет утверждение текста о Божьем имени, не устраняя присущего формулировке напряжения между именем Яхве и титулом «Бог Воинств».
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Местоимение «Я» применительно к Богу написано с прописной буквы; божественное имя передано как «Яхве». Прямая речь и краткая формула «говорит Яхве» сохраняют ритм пророческого изречения.
