  text: Приносили ли вы Мне в течение сорока лет в пустыне жертвы и хлебное приношение[a], дом Израиля?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы и приношение». Еврейское слово может обозначать дар или приношение вообще, а в богослужебном контексте — приношение из зерна или муки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזְּבָחִים
  choice: жертвы
  rationale: זֶבַח обозначает жертву, обычно связанную с закланием; «жертвы» — естественный и достаточно точный русский эквивалент.
- source_word: וּמִנְחָה
  choice: и хлебные приношения
  rationale: В культовом контексте מִנְחָה обычно обозначает приношение из зерна или муки. Русское «хлебные приношения» сохраняет эту конкретику и привычный библейский регистр; более общее значение отмечено в сноске.
- source_word: הִגַּשְׁתֶּם
  choice: приносили ли вы
  rationale: Hiphil глагола נגשׁ здесь означает приносить или представлять приношение. «Приносили» естественно сочетается с обоими объектами и передаёт длительное действие в течение названного периода.
- source_word: לִי
  choice: Мне
  rationale: Дательный падеж естественно передаёт адресата при глаголе «приносить».
- source_word: בַמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר в данном контексте обозначает пустыню, по которой Израиль странствовал после исхода; это традиционный и понятный русский эквивалент.
- source_word: אַרְבָּעִים שָׁנָה
  choice: сорок лет
  rationale: В русском языке длительность при глаголе несовершенного вида естественно выражается винительным падежом времени без предлога.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Буквальное устойчивое пророческое обращение сохраняет собирательный смысл и торжественный регистр оригинала.
theological_decisions:
- issue: Риторическая сила вопроса
  choice: Сохранён прямой вопрос, подразумевающий отрицательный или обличительный ответ, но сам ответ не добавлен.
  alternative: 'Передать как нейтральный вопрос либо развернуть смысл: «Вы ведь не приносили Мне…»'
  rationale: Вопросительная частица הֲ и контекст обличения создают риторический вызов. Явное отрицание сняло бы сохраняемое древнееврейским текстом напряжение.
- issue: Возможный смысл вопроса о жертвах в пустыне
  choice: Текст не уточняет, отрицается ли сам факт принесения жертв, их постоянство или их истинная направленность Богу.
  alternative: Истолковать вопрос как безусловное утверждение, что Израиль вовсе не совершал жертвоприношений в пустыне.
  rationale: Стих допускает контекстуально обсуждаемые оттенки, но формулировка оригинала их не разрешает; перевод не должен вводить уточнение.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Инверсия сведена к минимуму; обращение «дом Израиля» сохранено как узнаваемая библейская формула. Прописное «Мне» следует принятому русскому религиозному употреблению при обозначении Бога.
