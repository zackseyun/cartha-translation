  to: 'Поэтому так говорит Яхве, Бог Воинств, Владыка:


    «На всех площадях раздастся плач,

    и на всех улицах будут восклицать: „Увы! Увы!“[a]


    Земледельца призовут к скорби,

    а умеющих причитать[b] — к плачу».'
  rationale: Исправлена только финальная параллельная конструкция, чтобы по-русски ясно передать призыв земледельца к скорби и опытных причитальщиков к плачу. «Будут кричать» заменено на более точное «будут восклицать». Поэтическая форма, порядок титулов, повтор скорбного возгласа и оба примечания сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:55:07Z'
