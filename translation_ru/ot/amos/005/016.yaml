base_translation:
  language: en
  yaml_path: translation/ot/amos/005/016.yaml
  text: 'Therefore[a], thus says Yahweh, the God of hosts, the Lord: In all the squares there will be wailing, and in all the streets they will say, “Alas! Alas!” They will call the farmer to mourning[b], and those who know lamentation to wailing.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве, Бог Воинств, Владыка:


    «На всех площадях раздастся плач,

    и на всех улицах будут восклицать: „Увы! Увы!“[a]


    Земледельца призовут к скорби,

    а умеющих причитать[b] — к плачу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод возгласа: «Горе! Горе!» Еврейское הוֹ הוֹ здесь выражает скорбь; вариант «Увы! Увы!» подчёркивает плач, а не возвещение суда.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «знающих причитание»; вероятно, имеются в виду умелые или профессиональные плакальщики.'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего обличения и сохраняет логическую связь пророческой речи.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественная для современного русского языка и вместе с тем торжественная формула пророческого вестника.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Бог Воинств
  rationale: Сохраняет широту слова צְבָאוֹת и не уточняет без достаточных оснований, земные или небесные воинства имеются в виду.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Передаёт божественный титул и позволяет отличить его от личного имени Яхве; слово уместно в торжественной пророческой речи.
- source_word: בְּכָל רְחֹבוֹת
  choice: на всех площадях
  rationale: רְחֹבוֹת обозначает широкие общественные пространства города; «площади» ясно передаёт эту реалию.
- source_word: מִסְפֵּד
  choice: плач / оплакивать
  rationale: В данном контексте слово обозначает слышимое публичное выражение скорби; формы выбраны по требованиям русского синтаксиса в двух параллельных строках.
- source_word: בְכָל חוּצוֹת
  choice: на всех улицах
  rationale: Передаёт городские открытые пространства и дороги, создавая естественную пару с площадями.
- source_word: הוֹ הוֹ
  choice: Увы! Увы!
  rationale: Это возглас скорби; «увы» передаёт оплакивание, не превращая его в самостоятельное пророческое возвещение бедствия.
- source_word: וְקָרְאוּ
  choice: призовут
  rationale: Глагол означает, что людей зовут участвовать в обрядовом плаче; «призовут» передаёт намеренный созыв.
- source_word: אִכָּר
  choice: земледельца
  rationale: Современное и точное обозначение человека, занятого обработкой земли; единственное число оригинала сохранено.
- source_word: יֹדְעֵי נֶהִי
  choice: умеющих причитать
  rationale: Буквально это люди, «знающие причитание»; выбранная формулировка сохраняет смысл навыка и не утверждает в основном тексте однозначно, что это профессиональные плакальщики.
theological_decisions:
- issue: Передача сочетания יְהוָה אֱלֹהֵי צְבָאוֹת אֲדֹנָי
  choice: Яхве, Бог Воинств, Владыка
  alternative: Господь, Бог Воинств, Владыка
  rationale: Личное имя יְהוָה передано непосредственно как «Яхве», а следующий за ним титул אֲדֹנָי — отдельно как «Владыка»; так сохраняются все три элемента еврейского текста без их слияния.
- issue: Статус יֹדְעֵי נֶהִי
  choice: умеющие причитать
  alternative: профессиональные плакальщики
  rationale: Еврейское выражение подчёркивает знание или умение исполнять причитания и, вероятно, указывает на опытных либо профессиональных участников траура. Основной текст сохраняет некоторую неопределённость, а вероятная культурная конкретизация вынесена в примечание.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Поэтическая разбивка отражает параллелизм оригинала. Сохранены личное имя Бога, последовательность божественных титулов и неоднозначность выражения о людях, умеющих исполнять погребальные причитания.
