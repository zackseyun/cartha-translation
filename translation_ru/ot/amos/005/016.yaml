  source_fidelity: 'В целом переданы все основные элементы еврейского текста: логический вывод, тройной ряд божественных имён/титулов, публичные пространства, возглас скорби и призыв земледельца вместе с людьми, умеющими исполнять причитания. Однако заключительное «а умеющих причитать — оплакивать» неудачно: «оплакивать» обычно требует прямого дополнения и не передаёт конструкцию призыва к плачу. Уместнее сохранить эллиптический параллелизм: «а умеющих причитать — к плачу».'
