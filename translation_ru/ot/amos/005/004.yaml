  yaml_path: translation/ot/amos/005/004.yaml
  text: 'For thus says Yahweh to the house of Israel: Seek me and live[a].'
translation:
  language: ru
  text: 'Ибо так говорит Яхве дому Израиля: «Ищите Меня и живите[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «Ищите Меня, чтобы жить» или «Ищите Меня — и будете жить». Еврейский текст можно понимать как настоятельный призыв с обещанным результатом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание или пояснение к предшествующему пророческому плачу; «ибо» сохраняет связующую силу и возвышенный, но понятный регистр.
- source_word: כֹה אָמַר
  choice: так говорит
  rationale: Устойчивая пророческая формула естественно передаётся настоящим временем и сохраняет торжественный характер речи вестника.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: дому Израиля
  rationale: Сохраняет корпоративное и заветное выражение «дом Израиля»; дательный падеж передаёт адресата речи.
- source_word: דִּרְשׁוּנִי
  choice: Ищите Меня
  rationale: В данном пророческом контексте глагол означает обращение к Яхве и стремление к Нему, а не просто запрос сведений.
- source_word: וִחְיוּ
  choice: и живите
  rationale: Сохраняет форму второго повеления и не сужает возможный оттенок результата или обещания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблён тетраграмматон; транслитерация сохраняет личное заветное имя.
- issue: Смысл призыва «Ищите Меня и живите»
  choice: Прямой призыв, в котором жизнь связана с поиском Яхве, без уточнения её полного объёма
  alternative: «Ищите Меня, чтобы жить»; «Ищите Меня — и будете жить»
  rationale: Еврейская последовательность повелительных форм допускает как призыв к жизни, так и понимание жизни в качестве результата или обещания. Основной текст сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Местоимение «Меня» написано с прописной буквы по принятой русской библейской традиции; синтаксис остаётся ясным для широкого читателя.
