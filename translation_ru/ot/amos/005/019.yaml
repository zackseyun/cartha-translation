  yaml_path: translation/ot/amos/005/019.yaml
  text: It will be as when a man flees from before the lion[a], and the bear meets him; then he enters the house and leans his hand on the wall[b], and the snake bites him.
translation:
  language: ru
  text: Как если бы человек убежал от льва, а навстречу ему встретился медведь; вошёл бы он в дом, опёрся рукой о стену — и змея укусила бы его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: как если бы
  rationale: Передаёт сравнительный оборот, связанный с описанием дня Господня в предыдущем стихе, и естественно вводит наглядный пример.
- source_word: יָנוּס
  choice: убежал
  rationale: Глагол обозначает бегство от опасности; совершенный вид по-русски естественно передаёт действие внутри образного сценария.
- source_word: אִישׁ
  choice: человек
  rationale: В данном сравнении слово имеет обобщённое значение; «человек» точно и естественно передаёт его без ненужного сужения смысла.
- source_word: מִפְּנֵי הָאֲרִי
  choice: от льва
  rationale: Русское «убежать от льва» естественно передаёт смысл буквального еврейского выражения «от лица льва».
- source_word: וּפְגָעוֹ הַדֹּב
  choice: а навстречу ему попался медведь
  rationale: פגע допускает значения встречи, столкновения и нападения. Формулировка сохраняет лексическую широту, тогда как угроза ясна из контекста.
- source_word: וּבָא הַבַּיִת
  choice: или вошёл бы он в дом
  rationale: בוא при слове «дом» здесь означает войти внутрь. Союз «или» естественно показывает второй, параллельный эпизод сравнения и соответствует синтаксической функции последовательности в контексте.
- source_word: וְסָמַךְ יָדוֹ עַל הַקִּיר
  choice: опёрся рукой о стену
  rationale: 'Идиоматическое русское выражение точно передаёт действие סמך и предлог עַל: человек ищет опоры в месте кажущейся безопасности.'
- source_word: וּנְשָׁכוֹ הַנָּחָשׁ
  choice: и его ужалила бы змея
  rationale: Для укуса змеи современное русское «ужалила» звучит естественно, хотя еврейский глагол буквально означает «укусила»; внезапность развязки сохранена.
theological_decisions:
- issue: Связь сравнения с днём Господним в предыдущем стихе
  choice: Не добавлять в стих явного упоминания дня Господня
  alternative: «День Господень будет подобен тому, как…»
  rationale: Еврейский текст стиха начинается непосредственно со сравнительного כַּאֲשֶׁר; явное дополнение сняло бы зависимость от предыдущего стиха и внесло бы отсутствующие слова.
translation_notes:
  register: Современный литературный русский язык с живым, но достойным повествовательным ритмом. Параллельные опасности переданы как два образных сценария; тире перед последней угрозой подчёркивает внезапность, не добавляя нового смысла.
