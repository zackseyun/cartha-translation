revisions:
- from: Как если бы человек убежал от льва, а навстречу ему попался медведь; или вошёл бы он в дом, опёрся рукой о стену — и его ужалила бы змея.
  to: Как если бы человек убежал от льва, а навстречу ему встретился медведь; вошёл бы он в дом, опёрся рукой о стену — и змея укусила бы его.
  rationale: 'Исправлена структурно значимая связь между частями сравнения: вместо альтернативного «или» сохранена единая последовательность событий. Также слегка уточнены формулировки для более близкой передачи פגע и נשך при сохранении современного литературного русского языка.'
  reviewer_model: gpt-5.6-terra
