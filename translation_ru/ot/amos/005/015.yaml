source:
  edition: WLC
  text: שִׂנְאוּ רָע֙ וְ/אֶ֣הֱבוּ ט֔וֹב וְ/הַצִּ֥יגוּ בַ/שַּׁ֖עַר מִשְׁפָּ֑ט אוּלַ֗י יֶֽחֱנַ֛ן יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת שְׁאֵרִ֥ית יוֹסֵֽף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/015.yaml
  text: Hate evil[a], and love good, and establish justice in the gate; perhaps Yahweh, the God of hosts[c][b], will be gracious to the remnant of Joseph.
translation:
  language: ru
  text: Ненавидьте зло и любите добро, утвердите правосудие у городских ворот[a]. Быть может, Яхве, Бог Воинств[b], будет милостив к остатку Иосифа[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У городских ворот старейшины и должностные лица разбирали судебные дела и отправляли правосудие.
    reason: cultural_note
  - marker: b
    text: 'Или: «Бог Небесных Воинств». Еврейское слово может обозначать многочисленные силы или воинства; титул не уточняет здесь, о каких именно воинствах идёт речь.'
    reason: lexical_alternative
  - marker: c
    text: Иосиф здесь — собирательное обозначение его потомков, прежде всего жителей северного царства; «остаток Иосифа» — те, кто уцелел после суда.
    reason: cross_reference
lexical_decisions:
- source_word: שִׂנְאוּ רָע
  choice: Ненавидьте зло
  rationale: Сильный императив שׂנא передан прямо, без смягчения до «отвергайте»; רָע употреблено субстантивно и обозначает нравственное зло.
- source_word: וְאֶהֱבוּ טוֹב
  choice: и любите добро
  rationale: Сохраняется краткая антитеза «ненавидьте… любите» и этическое противопоставление зла и добра.
- source_word: וְהַצִּיגוּ ... מִשְׁפָּט
  choice: утвердите правосудие
  rationale: Каузативный императив выражает требование сделать правосудие прочной нормой общественной жизни; «утвердите» естественно передаёт образ поставленного и прочно стоящего суда.
- source_word: בַשַּׁעַר
  choice: у городских ворот
  rationale: Ворота древнего города были местом судебных разбирательств и общественного управления. Добавление «городских» делает идиому понятной современному читателю, не меняя её смысла.
- source_word: אוּלַי
  choice: Быть может
  rationale: Сохраняет надежду без уверенности и не превращает призыв к покаянию в обещание гарантированного результата.
- source_word: יֶחֱנַן
  choice: будет милостив к
  rationale: Передаёт значение глагола חנן — благосклонно явить милость — и сохраняет направленность милости к остатку.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Бог Воинств
  rationale: Сохраняет традиционную широту титула צְבָאוֹת и не ограничивает его значение только земными армиями или только небесными существами.
- source_word: שְׁאֵרִית יוֹסֵף
  choice: остаток Иосифа
  rationale: «Остаток» сохраняет важный пророческий образ тех, кто уцелел после суда; «Иосиф» здесь является собирательным обозначением потомков Иосифа, прежде всего северного царства.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит тетраграмматон, личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Сочетание אוּלַי с יֶחֱנַן
  choice: Быть может… будет милостив
  alternative: чтобы… помиловал
  rationale: Формулировка сохраняет выраженную в еврейском тексте надежду без гарантии и не устраняет пророческое напряжение.
- issue: Значение «остатка Иосифа»
  choice: остаток Иосифа
  alternative: уцелевшие потомки Иосифа
  rationale: Буквальная образность сохранена в основном тексте, а собирательный исторический смысл пояснён в сноске без сведения выражения только к отдельным выжившим.
translation_notes:
  register: Современный литературный русский язык с кратким, властным ритмом пророческого призыва. «Правосудие» подчёркивает общественно-судебный смысл מִשְׁפָּט; «у городских ворот» естественно раскрывает древнюю идиому. Заглавные буквы в титуле «Бог Воинств» подчёркивают его функцию как устойчивого божественного наименования.
