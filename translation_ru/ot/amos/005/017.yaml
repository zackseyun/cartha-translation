  yaml_path: translation/ot/amos/005/017.yaml
  text: And in all the vineyards there will be wailing[b][a], for I will pass through your midst," says Yahweh.
translation:
  language: ru
  text: И во всех виноградниках будет плач[a], потому что Я пройду среди тебя[b], — говорит Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скорбь», «оплакивание». Еврейское слово обозначает публичное выражение горя, часто громкое.'
    reason: lexical_alternative
  - marker: b
    text: Слова «Я пройду среди тебя», возможно, отзываются языком более раннего повествования о Божьем прохождении в суде; ср. Исх. 12:12. Сам стих не обозначает эту связь прямо.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְכָל כְּרָמִים
  choice: И во всех виноградниках
  rationale: Сочетание союза, предлога и квантификатора продолжает перечень мест, охваченных скорбью; множественное «виноградниках» передаёт כְּרָמִים без сглаживания.
- source_word: מִסְפֵּד
  choice: будет плач
  rationale: Существительное обозначает публичное оплакивание, нередко выражаемое вслух. Связка «будет» добавлена по нормам русского языка для передачи еврейского безглагольного предложения.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину плача и естественно передаётся причинной конструкцией.
- source_word: אֶעֱבֹר בְּקִרְבְּךָ
  choice: Я пройду среди тебя
  rationale: Глагол עבר с בְּקֶרֶב выражает движение через внутреннее пространство сообщества. Единственное число «тебя» сохраняет коллективное обращение к Израилю и не устраняет возможный отзвук языка суда в Исходе.
- source_word: אָמַר יְהוָה
  choice: говорит Яхве
  rationale: Настоящее время естественно передаёт устойчивую пророческую формулу, а личное имя יְהוָה транслитерируется как «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблён тетраграмматон; форма «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Смысл Божьего прохождения среди народа
  choice: Я пройду среди тебя
  alternative: Я пройду посреди тебя; Я пройду через тебя
  rationale: Выбранная формулировка сохраняет образ Божьего присутствия и движения в суде, не превращая возможную перекличку с Исх. 12:12 в явное утверждение.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Сохранены коллективное обращение в единственном числе и краткость исходной формулы.
