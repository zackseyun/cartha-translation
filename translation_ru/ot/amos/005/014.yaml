  yaml_path: translation/ot/amos/005/014.yaml
  text: Seek good and not evil[a], so that you may live; and so Yahweh, the God of hosts, will be with you, as you have said.
translation:
  language: ru
  text: Ищите добра, а не зла, чтобы вы жили. Тогда Яхве, Бог Воинств, будет с вами, как вы и говорили.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как вы говорите». Еврейская форма глагола может отсылать к ранее высказанному утверждению народа о присутствии Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Ищите
  rationale: Глагол דרשׁ означает «искать», «стремиться к». В пророческом призыве «ищите» сохраняет и нравственную, и заветную силу выражения.
- source_word: טוֹב וְאַל רָע
  choice: добра, а не зла
  rationale: Субстантивированные прилагательные образуют краткую нравственную антитезу; союз «а» естественно передаёт противопоставление в современном русском языке.
- source_word: לְמַעַן תִּחְיוּ
  choice: чтобы вам жить
  rationale: למען обозначает цель или результат. Формулировка сохраняет простое «жить», не сужая его до физического выживания и не разворачивая в толкование о благополучии.
- source_word: וִיהִי כֵן
  choice: Тогда ... будет
  rationale: Форма с כֵן указывает на желаемое или последующее положение дел. «Тогда» ясно связывает Божье присутствие с предшествующим призывом искать добра.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Бог Воинств
  rationale: «Воинства» сохраняют широту צבאות, которое может обозначать небесные и земные силы, не ограничивая смысл только человеческими армиями.
- source_word: אִתְּכֶם
  choice: с вами
  rationale: Предлог с местоименным суффиксом прямо выражает присутствие рядом или вместе с адресатами.
- source_word: כַּאֲשֶׁר אֲמַרְתֶּם
  choice: как вы и говорили
  rationale: Перфект указывает на ранее высказанное утверждение адресатов. Частица «и» естественно подчёркивает отсылку к их собственным словам, не добавляя оценки вроде «утверждали» или «притязали».
theological_decisions:
- issue: Является ли обещание присутствия Яхве безусловным или следствием поиска добра
  choice: «Тогда ... будет с вами» — как следствие отклика на призыв
  alternative: 'Стативное или безусловное: «и Яхве ... с вами»'
  rationale: Контекст Амоса связывает жизнь и Божье присутствие с покаянием. При этом заключительные слова сохраняют напряжение между обещанием и прежним заявлением народа о Божьем присутствии.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом пророческого призыва. Сохранены антитеза «добра — зла», личное имя Яхве и широкое значение титула «Бог Воинств».
