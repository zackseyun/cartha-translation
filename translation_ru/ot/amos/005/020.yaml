base_translation:
  language: en
  yaml_path: translation/ot/amos/005/020.yaml
  text: Is not the day of Yahweh darkness[a], and not light, and gloom with no brightness in it?
translation:
  language: ru
  text: Разве день Яхве не будет тьмой, а не светом, мраком без сияния?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и мрак, и нет в нём сияния».'
    reason: Передаёт более формальное членение заключительной еврейской фразы и сохраняет возможный вариант передачи נֹגַהּ — «сияние, блеск».
lexical_decisions:
- source_word: הֲלֹא
  choice: Разве… не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, не превращая его в прямое утверждение.
- source_word: חֹשֶׁךְ
  choice: тьма
  rationale: Точно передаёт существительное и сохраняет резкое противопоставление свету.
- source_word: יוֹם יְהוָה
  choice: день Яхве
  rationale: Сохраняет устойчивое пророческое выражение и передаёт тетраграмматон личным именем, а не титулом.
- source_word: וְלֹא אוֹר
  choice: а не свет
  rationale: В русском противопоставительное «а» естественно выражает антитезу тьмы и света, сохраняя повторное отрицание.
- source_word: וְאָפֵל
  choice: не мрак
  rationale: Повтор отрицательной конструкции в русском объединяет вторую пару образов и сохраняет нарастание от тьмы к мраку.
- source_word: וְלֹא נֹגַהּ לוֹ
  choice: без единого проблеска
  rationale: Естественно передаёт полное отсутствие сияния или света в этом дне; «единого» эксплицирует абсолютную силу отрицания, не меняя смысла.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; «Яхве» сохраняет это отличие от титула.
- issue: Характер дня Яхве
  choice: Риторический вопрос с безусловно мрачной образностью
  alternative: Утвердительная перефразировка
  rationale: 'Сохранена вопросительная форма оригинала и его богословское напряжение: ожидаемый народом день представлен как суд, лишённый света.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллелизм передан компактно; тяжеловесное буквальное «и не свет» заменено естественным русским противопоставлением. Маркер сноски поставлен после всего стиха.
