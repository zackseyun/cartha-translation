  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Форма повелительного наклонения множественного числа передаёт прямой пророческий призыв; «слушайте» естественно и ясно в современном русском языке.
- source_word: הַדָּבָר הַזֶּה
  choice: это слово
  rationale: Сохраняет характерную пророческую формулу и не сужает значение до простого сообщения или дела.
- source_word: אֲשֶׁר אָנֹכִי נֹשֵׂא
  choice: которое я произношу
  rationale: В сочетании с קִינָה глагол נשא обозначает начало или исполнение плача. Буквальное «поднимаю» в современном русском здесь не передаёт идиоматического смысла.
- source_word: עֲלֵיכֶם
  choice: о вас
  rationale: Предлог על при плачевной песне указывает, над кем или о ком совершается плач. «О вас» звучит естественно и не усиливает выражение до однозначного «против вас».
- source_word: קִינָה
  choice: как плачевную песнь
  rationale: קִינָה — скорбный плач, часто погребального характера. «Плачевная песнь» сохраняет жанровый оттенок и торжественный регистр.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет библейское собирательное обозначение народа; отсутствие частицы «о» соответствует естественному современному русскому обращению.
