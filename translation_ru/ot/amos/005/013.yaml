  variant: modern literary Russian
source:
  edition: WLC
  text: לָ/כֵ֗ן הַ/מַּשְׂכִּ֛יל בָּ/עֵ֥ת הַ/הִ֖יא יִדֹּ֑ם כִּ֛י עֵ֥ת רָעָ֖ה הִֽיא׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/013.yaml
  text: Therefore the prudent man keeps silent at that time[a], for it is an evil time.
translation:
  language: ru
  text: Поэтому благоразумный[a] в то время молчит, потому что это злое время.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «понимающий», «рассудительный человек». В еврейском тексте употреблена форма мужского рода единственного числа, здесь имеющая обобщающее значение.'
    reason: Лексическая альтернатива и пояснение представительного употребления грамматического мужского рода.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего обличения и ясно сохраняет причинно-логическую связь.
- source_word: הַמַּשְׂכִּיל
  choice: благоразумный
  rationale: Причастие породы хифиль от שכל обозначает человека, который понимает происходящее и действует рассудительно; субстантивированное прилагательное естественно звучит по-русски и сохраняет мужской род единственного числа.
- source_word: בָּעֵת הַהִיא
  choice: в то время
  rationale: Естественно передаёт указание на конкретное время, о котором идёт речь.
- source_word: יִדֹּם
  choice: молчит
  rationale: Глагол דמם означает молчать или хранить молчание; форма настоящего времени в русском передаёт обобщённое действие несовершенного вида.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит причину такого молчания и естественно звучит в современной русской речи.
- source_word: עֵת רָעָה
  choice: злое время
  rationale: Сохраняет как нравственную окраску רָעָה, так и смысл времени, отмеченного бедствием; более нейтральное «плохое время» ослабило бы выражение.
- source_word: הִיא
  choice: это
  rationale: Местоимение женского рода соотносится с עֵת; по-русски связка «это злое время» естественно передаёт данную отсылку.
theological_decisions:
- issue: Род и обобщающее значение הַמַּשְׂכִּיל
  choice: благоразумный
  alternative: благоразумный человек; тот, кто понимает
  rationale: Мужской род единственного числа сохранён, но русское субстантивированное прилагательное допускает характерное для контекста обобщающее значение. Сноска предотвращает неоправданное ограничение смысла только мужчинами.
- issue: Характер молчания
  choice: молчит
  alternative: хранит молчание; вынужден молчать
  rationale: Исходный текст утверждает молчание благоразумного, но прямо не уточняет, является ли оно осторожностью, вынужденной реакцией или нравственной оценкой обстановки; перевод не разрешает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, весомым пророческим звучанием. Синтаксис близок к еврейскому оригиналу, но естественен для русского читателя; сохранены нравственная сила выражения «злое время» и неопределённость мотивов молчания.
