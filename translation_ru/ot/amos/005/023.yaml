base_translation:
  language: en
  yaml_path: translation/ot/amos/005/023.yaml
  text: Take away from me the noise of your songs[a], and I will not listen to the melody of your harps.
translation:
  language: ru
  text: Удали от Меня шум твоих песен! Музыку твоих арф[a] Я слушать не стану.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лир»; еврейское слово обозначает древний струнный инструмент, точное современное соответствие которого неизвестно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  choice: Удали
  rationale: Повелительная форма выражает прямое требование убрать прочь; «удали» точно и достойно передаёт силу приказа.
- source_word: מֵעָלַי
  choice: от Меня
  rationale: Буквально «с Меня / от того, что надо Мной»; в данном контексте естественное русское соответствие — «от Меня», выражающее личное отвержение.
- source_word: הֲמוֹן
  choice: шум
  rationale: В контексте отвергнутого богослужения слово обозначает громкий, назойливый звук; «шум» сохраняет отрицательную окраску, не усиливая её до отсутствующего в тексте оскорбления.
- source_word: שִׁרֶיךָ
  choice: твоих песен
  rationale: Прямое соответствие форме множественного числа с местоименным суффиксом второго лица единственного числа.
- source_word: וְזִמְרַת
  choice: Звучания
  rationale: Существительное может обозначать музыку, мелодию или музыкальное звучание. «Звучание» естественно сочетается с названием инструмента и не повторяет уже употреблённое слово «песни».
- source_word: נְבָלֶיךָ
  choice: твоих арф
  rationale: נבל — древний струнный инструмент, точное современное соответствие которого неизвестно. «Арфа» — понятное и традиционное русское обозначение; неопределённость отмечена в сноске.
- source_word: לֹא אֶשְׁמָע
  choice: Я слушать не стану
  rationale: Отрицание с имперфектом здесь выражает сознательный отказ внимать музыке. Такая формулировка передаёт волевой оттенок яснее, чем нейтральное «не услышу».
theological_decisions:
- issue: Тон Божьего отвержения богослужения
  choice: 'Сохранено резкое, прямое отвержение: «шум» и «слушать не стану».'
  alternative: Смягчить הֲמוֹן до «звучания», а לֹא אֶשְׁמָע передать как «не услышу».
  rationale: Контекст Ам 5 противопоставляет культовую практику отсутствию правосудия. Резкость принадлежит самому пророческому высказыванию; перевод сохраняет её, не добавляя объяснения причин внутрь стиха.
translation_notes:
  register: Современный литературный русский язык с кратким, повелительным и пророчески резким строем. Заглавное «Меня» отражает традиционное русское оформление речи Бога, не изменяя смысла оригинала.
