  text: הַ/הֹפְכִ֥ים לְ/לַעֲנָ֖ה מִשְׁפָּ֑ט וּ/צְדָקָ֖ה לָ/אָ֥רֶץ הִנִּֽיחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/007.yaml
  text: you who turn justice into wormwood and cast righteousness down to the earth:[a][b]
translation:
  language: ru
  text: вы, превращающие правосудие в полынь[a] и повергающие праведность на землю![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в горечь». В еврейском тексте названо горькое растение — полынь, употреблённое здесь как образ.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и повергающие справедливость наземь»: еврейское слово, переведённое как «праведность», может также означать «справедливость».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַהֹפְכִים
  choice: вы, превращающие
  rationale: Причастие с артиклем в данном контексте имеет обращённую к адресатам силу; второе лицо сохраняет прямоту пророческого обличения.
- source_word: לַעֲנָה
  choice: в полынь
  rationale: Еврейское слово обозначает горькое растение и здесь метафорически передаёт горечь; конкретный образ сохранён в основном тексте.
- source_word: מִשְׁפָּט
  choice: правосудие
  rationale: В социально-правовом контексте речь идёт о справедливом суде и общественном порядке; «правосудие» естественно передаёт этот аспект и позволяет отличить термин от צדקה.
- source_word: וּצְדָקָה
  choice: праведность
  rationale: Слово охватывает праведность и справедливость. В паре с משפט перевод «праведность» сохраняет два взаимосвязанных, но не тождественных понятия.
- source_word: לָאָרֶץ
  choice: на землю
  rationale: Передаёт пространственный образ унижения и низвержения; по-русски естественно сочетается с глаголом «повергать».
- source_word: הִנִּיחוּ
  choice: повергающие
  rationale: Каузативная форма נוח означает положить или поместить; в данном отрицательном контексте «повергать» ясно выражает низведение праведности на землю, не переходя к более толковательному «оставлять».
theological_decisions:
- issue: Передача צדקה в пророческом этическом контексте
  choice: праведность
  alternative: справедливость
  rationale: В пророческой речи термин может означать также справедливость, однако рядом с משפט важно не сводить оба слова к одному понятию. Основной текст сохраняет «праведность», а семантическая альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Причастная конструкция сохраняет прямое обращение и параллелизм оригинала; конкретный образ полыни оставлен без смыслового сглаживания.
