source:
  edition: WLC
  text: וּ/נְשָׂאתֶ֗ם אֵ֚ת סִכּ֣וּת מַלְכְּ/כֶ֔ם וְ/אֵ֖ת כִּיּ֣וּן צַלְמֵי/כֶ֑ם כּוֹכַב֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר עֲשִׂיתֶ֖ם לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/026.yaml
  text: And you carried Sikkuth your king[a], and Kiyyun your images, the star of your god[c][b], which you made for yourselves.
translation:
  language: ru
  text: И вы носили Сиккута, вашего царя[a], и Кийюна[b], ваши изображения, звезду вашего бога[c] — всё это вы сделали для себя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вашего Молоха». В еврейском тексте буквально: «вашего царя», однако многие толкователи видят здесь указание на божество Молоха; такое понимание отражено и в Деян 7:43.'
    reason: alternative_reading
  - marker: b
    text: Сиккут и Кийюн — редкие имена, вероятно связанные с почитанием небесных светил; точная идентификация остаётся неясной.
    reason: cultural_note
  - marker: c
    text: 'Возможно также: «звезду ваших богов», хотя масоретская огласовка допускает понимание в единственном числе: «вашего бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשָׂאתֶם
  choice: И вы носили
  rationale: Форма Qal, 2-е лицо множественного числа, описывает ношение культовых предметов. Несовершенный вид «носили» естественно передаёт повторяющееся действие в прошлом и не навязывает будущего значения.
- source_word: סִכּוּת
  choice: Сиккута
  rationale: Редкое и не вполне ясное слово, вероятно имя собственное. Транслитерация сохраняет неопределённость исходного текста; винительный падеж необходим по русскому синтаксису.
- source_word: מַלְכְּכֶם
  choice: вашего царя
  rationale: Масоретский текст буквально означает «вашего царя». Возможное понимание как имени божества Молох вынесено в сноску.
- source_word: כִּיּוּן
  choice: Кийюна
  rationale: Редкое имя, вероятно связанное с астральным культом. Транслитерация предпочтительнее спорной идентификации.
- source_word: צַלְמֵיכֶם
  choice: ваши изображения
  rationale: צֶלֶם означает изображение или изваяние. Нейтральное «изображения» точнее, чем интерпретирующее «идолы».
- source_word: כּוֹכַב אֱלֹהֵיכֶם
  choice: звезду вашего бога
  rationale: Сохранена конструкция сопряжённого состояния и единственное число согласно масоретской огласовке.
- source_word: אֲשֶׁר עֲשִׂיתֶם לָכֶם
  choice: которую вы сделали для себя
  rationale: Относительное предложение передано в согласовании с ближайшим существительным «звезду»; «для себя» сохраняет значение לָכֶם и подчёркивает, что предмет культа был изготовлен самими людьми.
theological_decisions:
- issue: Следует ли понимать מַלְכְּכֶם как нарицательное «вашего царя» или как имя божества Молоха
  choice: вашего царя
  alternative: вашего Молоха; Молоха, вашего царя
  rationale: Масоретский текст прямо читается как «вашего царя» и здесь не содержит недвусмысленного написания имени Молоха. Традиционное толкование, отражённое также в Деян 7:43, сохранено в сноске.
- issue: Следует ли истолковать סִכּוּת и כִּיּוּן или передать их как имена
  choice: транслитерировать как «Сиккут» и «Кийюн»
  alternative: понять סִכּוּת как «святилище» либо прямо отождествить оба слова с конкретными астральными божествами
  rationale: Оба слова редки, а их точное значение и идентификация спорны. Транслитерация не создаёт ложной определённости.
- issue: Число в выражении אֱלֹהֵיכֶם
  choice: вашего бога
  alternative: ваших богов
  rationale: Масоретская огласовка поддерживает единственное число, хотя форма без огласовки допускает обсуждение иного понимания; альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Редкие культовые имена транслитерированы, а не истолкованы. Тире поясняет вероятное приложительное отношение, не превращая его в окончательную идентификацию.
