lexical_decisions:
- source_word: הַמַּבְלִיג
  choice: Он внезапно обрушивает
  rationale: Причастие породы хифиль употреблено субстантивно и в контексте указывает на Бога. Редкий и трудный глагол, вероятнее всего, передаёт внезапное, стремительное наведение бедствия; «внезапно обрушивает» естественно выражает это по-русски, не скрывая сложности слова.
- source_word: שֹׁד
  choice: разорение
  rationale: Существительное обозначает насильственное опустошение, разрушение или разграбление. «Разорение» сохраняет как разрушительный, так и опустошительный оттенок и подходит к обеим строкам.
- source_word: עַל
  choice: на
  rationale: Предлог в обоих случаях отмечает цель разрушительного действия; русское «на» естественно передаёт направленность бедствия.
- source_word: עָז
  choice: сильного
  rationale: Прилагательное употреблено как существительное и может обозначать сильного человека либо могущественную силу. Единственное число сохраняет форму еврейского текста и его обобщённость.
- source_word: וְשֹׁד
  choice: и разорение
  rationale: Союз передан формально как «и», без добавления однозначно результативного значения, которого сама форма не требует.
- source_word: מִבְצָר
  choice: крепость
  rationale: Слово обозначает укреплённое место или оплот. «Крепость» — ясный современный эквивалент, сохраняющий военный образ.
- source_word: יָבוֹא
  choice: приходит
  rationale: Сохранено простое значение глагола «приходить». В сочетании с разорением это создаёт олицетворённый поэтический образ оригинала.
theological_decisions:
- issue: Определение субъекта
  choice: Местоимение «Он» оставлено без добавления имени, но по ближайшему контексту относится к Господу.
  alternative: Безличная сила, вызывающая разорение; либо буквальное «Тот, кто…».
  rationale: Ам 5:8–9 продолжает описание действий Господа. «Он» естественно связывает стих с предыдущим контекстом, не добавляя в сам стих отсутствующего имени.
- issue: Связь между двумя частями стиха
  choice: Сохранено сочинительное «и».
  alternative: Результативное «так что».
  rationale: Еврейский וְ допускает разные смысловые связи. Простое «и» сохраняет неоднозначность и не навязывает причинно-следовательное толкование.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным пророческим ритмом. Повтор «разорение» намеренно сохранён ради параллелизма оригинала; редкость ключевого глагола отмечена в сноске.
