base_translation:
  language: en
  yaml_path: translation/ot/amos/005/005.yaml
  text: But do not seek Bethel[a], and do not enter Gilgal, and do not cross over to Beersheba; for Gilgal will surely go into exile, and Bethel will become nothingness.
translation:
  language: ru
  text: Но не ищите Вефиля[a], не ходите в Галгал и не отправляйтесь в Вирсавию, потому что Галгал непременно пойдёт в изгнание, а Вефиль превратится в ничто.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Вефиль станет Беф-Авеном». Здесь может быть игра еврейских слов: название «Вефиль» означает «дом Бога», а авен — «ничтожество», «зло» или «бедствие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּדְרְשׁוּ
  choice: не ищите
  rationale: Глагол דרשׁ означает «искать, обращаться, вопрошать». Здесь объектом названа святыня, поэтому «не ищите Вефиля» сохраняет религиозный смысл обращения к культовому месту и перекличку с призывом искать Господа.
- source_word: בֵּית אֵל
  choice: Вефиль
  rationale: Название города и святилища передано в принятой русской библейской форме, а не переведено буквально как «дом Бога».
- source_word: תָבֹאוּ
  choice: не ходите
  rationale: В сочетании с названием места форма בוא выражает прибытие туда. Русское «не ходите в Галгал» естественно передаёт запрет посещать культовый центр.
- source_word: הַגִּלְגָּל
  choice: Галгал
  rationale: Географическое название передано в традиционной русской библейской форме.
- source_word: תַעֲבֹרוּ
  choice: не переходите в
  rationale: עבר буквально означает «переходить, переправляться». Формулировка сохраняет конкретный образ пути к отдалённой Вирсавии, не сводя его к общему «не ходите».
- source_word: בְאֵר שֶׁבַע
  choice: Вирсавия
  rationale: Географическое название передано в принятой русской библейской форме.
- source_word: גָּלֹה יִגְלֶה
  choice: непременно пойдёт в изгнание
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает уверенность предсказания. «Непременно» передаёт эмфазу, а «пойдёт в изгнание» сохраняет мотив изгнания и словесное созвучие оригинала между Галгалом и глаголом גלה лишь в той мере, в какой это возможно по-русски.
- source_word: יִהְיֶה לְאָוֶן
  choice: обратится в ничто
  rationale: Слово אָוֶן допускает значения «ничтожество, зло, бедствие». В этом контексте «обратится в ничто» естественно выражает полное крушение святилища, не устраняя многозначность; возможная игра слов пояснена в сноске.
theological_decisions:
- issue: Смысл לְאָוֶן в предсказании о Вефиле
  choice: Вефиль обратится в ничто
  alternative: Вефиль станет местом зла / бедствием / Бет-Авеном
  rationale: Еврейское אָוֶן может обозначать ничтожество, зло или бедствие и, вероятно, полемически переиначивает название Вефиля как Бет-Авен. Основной текст сохраняет ясный образ уничтожения, а сноска — неоднозначность и игру слов.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены традиционные русские формы библейских топонимов; синтаксис сделан ясным для широкого читателя. Частица וְ в начале стиха не передана отдельным «но», поскольку непосредственный контекст противопоставления в предоставленном фрагменте отсутствует, а союз может выполнять связующую функцию.
