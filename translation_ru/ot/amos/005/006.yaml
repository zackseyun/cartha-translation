revisions:
- from: Ищите Яхве — и живите,[a] чтобы Он не вспыхнул, словно огонь, среди дома Иосифа и не пожрал его; и некому будет погасить огонь в Вефиле.[b]
  to: Ищите Яхве — и живите,[a] чтобы Он не вспыхнул, словно огонь, в доме Иосифа, чтобы огонь не пожрал его и некому было его погасить для Вефиля.[b]
  rationale: 'Перевод уточнён ради естественного русского синтаксиса и более точной передачи образа: Яхве является наиболее вероятным, но не выраженным субъектом «вспыхнуть», тогда как последующее «пожрёт» относится к огню. Формулировка «для Вефиля» намеренно сохраняет трудность еврейского לְבֵית־אֵל, не навязывая локативное толкование.'
