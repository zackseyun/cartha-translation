reference: Amos 5:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: דִּרְשׁ֥וּ אֶת יְהוָ֖ה וִֽ/חְי֑וּ פֶּן יִצְלַ֤ח כָּ/אֵשׁ֙ בֵּ֣ית יוֹסֵ֔ף וְ/אָכְלָ֥ה וְ/אֵין מְכַבֶּ֖ה לְ/בֵֽית אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/006.yaml
  text: Seek Yahweh and live[a], lest he break out like fire in the house of Joseph, and it consume[b], with no one to quench it for Bethel.
translation:
  language: ru
  text: Ищите Яхве — и живите,[a] чтобы Он не вспыхнул, словно огонь, в доме Иосифа, чтобы огонь не пожрал его и некому было его погасить для Вефиля.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ищите Яхве — и будете жить».'
    reason: Вторая повелительная форма может передавать как призыв, так и обещанный результат.
  - marker: b
    text: 'В еврейском тексте субъект глагола «вспыхнуть» прямо не назван; возможен перевод: «чтобы огонь не вспыхнул в доме Иосифа». Буквально далее: «и нет гасящего для Вефиля»; значение предлога «для» в этом трудном обороте не вполне ясно. Вефиль был одним из главных святилищ северного царства.'
    reason: Сохраняет грамматическую неоднозначность подразумеваемого субъекта, объясняет связь женской формы следующего глагола с огнём и не сглаживает трудность предлога при топониме.
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Ищите
  rationale: Множественное число повелительного наклонения; в пророческом контексте означает деятельно обращаться к Богу и искать Его, а не просто спрашивать о Нём.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: וִחְיוּ
  choice: и живите
  rationale: 'Сохраняет краткость двух последовательных повелительных форм и допускает оттенок результата: «ищите — и будете жить».'
- source_word: פֶּן
  choice: чтобы… не
  rationale: Естественно вводит по-русски предостережение о нежелательном последствии.
- source_word: יִצְלַח
  choice: Он не вспыхнул
  rationale: В сочетании с образом огня глагол обозначает внезапно вырваться, вспыхнуть. Местоимение указывает на Яхве как наиболее вероятный подразумеваемый субъект, но неоднозначность отмечена в сноске.
- source_word: כָּאֵשׁ
  choice: словно огонь
  rationale: Естественно и точно передаёт сравнительный оборот.
- source_word: בֵּית יוֹסֵף
  choice: дом Иосифа
  rationale: Сохраняет традиционное пророческое обозначение северного царства, прежде всего племён, связанных с Иосифом.
- source_word: וְאָכְלָה
  choice: и не пожрал его
  rationale: Женская форма глагола соотносится с «огнём»; подразумеваемый объект — дом Иосифа — выражен местоимением ради ясности русского текста.
- source_word: וְאֵין מְכַבֶּה
  choice: и некому будет погасить огонь
  rationale: Передаёт отсутствие того, кто мог бы потушить пожар; дополнение «огонь» естественно восстанавливает подразумеваемый объект.
- source_word: לְבֵית אֵל
  choice: в Вефиле
  rationale: Вефиль здесь — название важного святилища северного царства. Русское «в Вефиле» естественно выражает локальный смысл трудного еврейского оборота, тогда как буквальное «для Вефиля» звучит неясно.
theological_decisions:
- issue: Подразумеваемый субъект глагола יִצְלַח
  choice: 'Яхве: «Он не вспыхнул»'
  alternative: 'Огонь или безлично развивающееся бедствие: «не вспыхнул огонь»'
  rationale: Яхве — ближайший названный референт, а образ Бога, являющегося огнём суда, соответствует пророческой речи. Поскольку в еврейском субъект прямо не назван, альтернатива сохранена в сноске.
- issue: Значение בֵּית אֵל
  choice: Географическое название «Вефиль»
  alternative: Нарицательное «дом Бога»
  rationale: В книге Амоса Вефиль — конкретный религиозный центр северного царства; контекст требует топонима.
translation_notes:
  register: Современный литературный русский с лаконичным, торжественным пророческим звучанием. Тире подчёркивает связь между поиском Яхве и жизнью; образ огня сохранён без конфессионального истолкования.
