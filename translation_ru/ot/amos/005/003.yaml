  rationale: 'Исправлена область действия заключительного «для дома Израиля»: тире отделяет итоговое указание, относящееся ко всему пророческому сообщению. Устранены асимметрия «сотню/десятерых» и неясная эллиптическая конструкция; настоящее причастие точнее передаёт форму оригинала. Сноска сохраняет буквальное значение глагола и отмечает, что военная интерпретация контекстуальна.'
