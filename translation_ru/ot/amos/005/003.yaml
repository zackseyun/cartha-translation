base_translation:
  language: en
  yaml_path: translation/ot/amos/005/003.yaml
  text: 'For thus says the Lord GOD: The city that marches out a thousand will have a hundred left[a], and the one that marches out a hundred will have ten left, for the house of Israel.'
translation:
  language: ru
  text: 'Ибо так говорит Владыка Яхве: «Город, выступающий в поход тысячей, оставит сто, а город, выступающий сотней, оставит десять — для дома Израиля».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Ибо так говорит
  rationale: Сохранена стандартная пророческая формула и связующая функция כִּי; настоящее время естественно передаёт торжественное Божье провозглашение.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי как титул верховной власти, а «Яхве» сохраняет личное заветное имя יהוה и избегает неестественного сочетания «Господь Господь».
- source_word: הָעִיר
  choice: Город
  rationale: Определённая форма существительного обозначает город как общину, выставляющую воинский отряд.
- source_word: הַיֹּצֵאת
  choice: выступавший в поход
  rationale: Буквально причастие означает «выходящий»; при указании численности контекст, вероятнее всего, военный. Формулировка естественно выражает этот смысл, не добавляя конкретного исхода сражения.
- source_word: אֶלֶף / מֵאָה / עֲשָׂרָה
  choice: тысячей / сотню / десятерых
  rationale: Числительные сохранены точно; творительный «тысячей» передаёт выступление отряда такой численности, а форма «десятерых» ясно указывает на оставшихся людей.
- source_word: תַּשְׁאִיר
  choice: оставит лишь
  rationale: Каузативная форма שׁאר означает «оставить, дать остаться». «Лишь» естественно подчёркивает резкое сокращение, выраженное соотношением чисел.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: для дома Израиля
  rationale: Сохранены отношение, выраженное לְ, и библейское национально-заветное обозначение «дом Израиля».
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул אֲדֹנָי и собственное имя יהוה, сохраняя оба элемента исходного текста без их слияния в общее обозначение Бога.
- issue: Военный смысл הַיֹּצֵאת
  choice: выступавший в поход
  alternative: выходивший
  rationale: Упоминание тысяч и сотен, от которых остаётся десятая часть, указывает на военный набор или выход на битву; при этом буквальный вариант отмечен в сноске, поскольку сам глагол прямо не называет войну.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис краток и ритмичен; конструкция «выступавший…» относится к городу как к общине, выставляющей войско. Архаизмы сведены к традиционному и смыслово значимому выражению «дом Израиля».
