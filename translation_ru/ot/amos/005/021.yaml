lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Ненавижу
  rationale: Форма перфекта 1-го лица единственного числа выражает решительное личное отвращение Господа; настоящее время естественно передаёт силу пророческого заявления по-русски.
- source_word: מָאַסְתִּי
  choice: отвергаю
  rationale: Глагол означает отказ принять нечто как неприемлемое. «Отвергаю» сохраняет волевой оттенок, не дублируя полностью эмоциональную силу предшествующего «ненавижу».
- source_word: חַגֵּיכֶם
  choice: ваши праздники
  rationale: Слово обозначает религиозные празднества, в том числе паломнические; «праздники» — ясное и достаточно широкое современное соответствие.
- source_word: אָרִיחַ
  choice: не буду благоволить
  rationale: Буквально глагол связан с обонянием, а в культовом контексте — с принятием и удовольствием от благоухания приношения. Поскольку здесь речь непосредственно о собраниях, перевод передаёт смысл идиомы, а буквальный образ сохраняется в сноске.
- source_word: בְּעַצְּרֹתֵיכֶם
  choice: к вашим торжественным собраниям
  rationale: Существительное обозначает торжественное религиозное собрание. Предлог «к» обусловлен естественным русским управлением глагола «благоволить».
theological_decisions:
- issue: Антропоморфный культовый образ обоняния как выражение Божьего принятия
  choice: В основном тексте передать смысл словами «не буду благоволить», сохранив буквальный образ в сноске
  alternative: 'Перевести буквально: «не буду обонять на ваших торжественных собраниях»'
  rationale: Буквальный оборот с обонянием собраний по-русски неясен и может создать ложное впечатление. Выбранный вариант передаёт непринятие Богом богослужения, не добавляя в текст отсутствующего прямого упоминания жертв.
translation_notes:
  register: Современный литературный русский язык с кратким, резким пророческим ритмом. Повтор «ненавижу, отвергаю» сохранён; выражение «торжественные собрания» удерживает религиозный и официальный характер исходного слова.
