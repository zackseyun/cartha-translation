  text: וְ/יִגַּ֥ל כַּ/מַּ֖יִם מִשְׁפָּ֑ט וּ/צְדָקָ֖ה כְּ/נַ֥חַל אֵיתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/024.yaml
  text: But let justice roll down like waters[b][a], and righteousness like an ever-flowing stream.
translation:
  language: ru
  text: Пусть же правосудие катится, как воды, и праведность — как неиссякающий поток.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как постоянный поток». Еврейское выражение обозначает устойчивый водный поток, который не пересыхает.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגַּל
  choice: Пусть же … катится
  rationale: Форма выражает призыв или настойчивое пожелание. «Катится» сохраняет яркий образ движущейся, неудержимой воды; частица «же» передаёт противопоставление предшествующему контексту.
- source_word: כַּמַּיִם
  choice: как воды
  rationale: Сохранено грамматическое множественное число еврейского слова, естественное для возвышенной русской речи и подчёркивающее обилие и движение воды.
- source_word: מִשְׁפָּט
  choice: правосудие
  rationale: В пророческом контексте речь идёт не об отдельном приговоре, а о справедливом общественном и судебном порядке. «Правосудие» сохраняет правовой оттенок и отличается от следующего понятия.
- source_word: וּצְדָקָה
  choice: и праведность
  rationale: «Праведность» передаёт нравственную и заветную сторону צְדָקָה, не сливая её с מִשְׁפָּט в одно русское слово.
- source_word: כְּנַחַל
  choice: как … поток
  rationale: נַחַל может обозначать русло, сезонный водоток или поток. Общепонятное «поток» хорошо соответствует водному образу и не вносит излишне технического термина.
- source_word: אֵיתָן
  choice: неиссякающий
  rationale: В сочетании с נַחַל слово указывает на постоянный, устойчивый поток, который не пересыхает. «Неиссякающий» естественно и образно выражает эту мысль.
theological_decisions:
- issue: Передача пары מִשְׁפָּט / צְדָקָה
  choice: правосудие … праведность
  alternative: справедливость … правда
  rationale: Выбранная пара сохраняет различие между общественно-правовым порядком и нравственной верностью, не сводя оба еврейских понятия к одному значению и не навязывая узкой конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой образностью. Параллелизм и лаконичность еврейской строки сохранены; добавлено только тире, естественное для русского именного параллелизма.
