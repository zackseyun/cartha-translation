lexical_decisions:
- source_word: נָפְלָה
  choice: Пала
  rationale: Форма qal perfect 3-го лица женского рода от נפל обозначает совершившееся падение. Краткое начальное «Пала» сохраняет резкость и плачевный строй еврейской строки.
- source_word: לֹא תוֹסִיף קוּם
  choice: и больше не встанет
  rationale: Сочетание hiphil יסף с инфинитивом קום при отрицании означает «не встанет снова / больше не встанет». Такой перевод естественен по-русски и передаёт окончательность изображённого падения.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: дева Израиля
  rationale: Конструкция буквально означает «дева Израиля» и служит поэтическим олицетворением народа. «Дева» сохраняет пророческий образ и звучит достоинственно в современном литературном русском.
- source_word: נִטְּשָׁה
  choice: покинута
  rationale: Niphal perfect от נטש выражает состояние оставленности или покинутости. «Покинута» ясно передаёт беспомощность персонифицированного Израиля.
- source_word: עַל אַדְמָתָהּ
  choice: на своей земле
  rationale: אַדָמָה может означать почву, землю или страну; притяжательный суффикс и национальный контекст поддерживают «на своей земле».
- source_word: אֵין מְקִימָהּ
  choice: и некому поднять её
  rationale: Экзистенциальное אֵין с hiphil-причастием от קום и объектным суффиксом означает отсутствие того, кто мог бы её поднять. Перевод сохраняет словесную связь с предшествующим «встанет».
theological_decisions:
- issue: Метафорическое именование Израиля «девой» в пророчестве о суде
  choice: Сохранить прямой образ «дева Израиля».
  alternative: «юная дочь Израиля» или истолковательный перевод без метафоры
  rationale: Это поэтическое олицетворение народа, а не утверждение о буквальном половом статусе. Сохранение образа не привносит дополнительных конфессиональных толкований.
- issue: Окончательность суда в לֹא תוֹסִיף קוּם
  choice: «больше не встанет»
  alternative: «не встанет снова»
  rationale: Оба варианта возможны, но выбранный естественно передаёт решительность пророческого плача, не выходя за пределы еврейской идиомы.
translation_notes:
  register: Современный литературный русский с сохранением краткости, параллелизма и торжественно-трагического тона пророческого плача. Тире подчёркивают обрывистое начало и окончательность падения.
