  yaml_path: translation/ot/amos/005/002.yaml
  text: Fallen[a], virgin Israel will not rise again; abandoned on her own land[b], she has no one to raise her up.
translation:
  language: ru
  text: Пала дева Израиля[a] — больше она не встанет; оставлена на своей земле — некому её поднять.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дева Израиля» — поэтическое олицетворение народа, а не указание на буквальный половой статус.
