source:
  edition: WLC
  text: לָ֠/כֵן יַ֣עַן בּוֹשַׁסְ/כֶ֞ם עַל דָּ֗ל וּ/מַשְׂאַת בַּר֙ תִּקְח֣וּ מִמֶּ֔/נּוּ בָּתֵּ֥י גָזִ֛ית בְּנִיתֶ֖ם וְ/לֹא תֵ֣שְׁבוּ בָ֑/ם כַּרְמֵי חֶ֣מֶד נְטַעְתֶּ֔ם וְ/לֹ֥א תִשְׁתּ֖וּ אֶת יֵינָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/011.yaml
  text: Therefore[a], because you trample on the poor and take a grain tax from him, you have built houses of cut stone, but you will not live in them; you have planted delightful vineyards[c][b], but you will not drink their wine.
translation:
  language: ru
  text: Поэтому, поскольку вы попираете бедняка и взимаете с него зерновой побор[a], вы построили дома из тёсаного камня[b], но жить в них не будете; вы насадили прекрасные виноградники[c], но вина из них пить не будете.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взимаете с него побор зерном». Еврейское выражение обозначает наложенную повинность или сбор, выплачиваемый зерном.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дома из отёсанного камня».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «желанные виноградники»; возможны также значения «приятные» или «отборные».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן יַעַן
  choice: Итак, за то, что
  rationale: Передаёт одновременно следственный смысл לָכֵן и причинное основание суда, вводимое יַעַן, естественно для современного русского пророческого текста.
- source_word: בּוֹשַׁסְכֶם עַל דָּל
  choice: вы попираете бедняка
  rationale: Сохраняет сильную конкретную метафору подавления и единственное число דָּל, представляющее угнетаемого бедного человека.
- source_word: וּמַשְׂאַת בַּר תִּקְחוּ מִמֶּנּוּ
  choice: и взимаете с него дань зерном
  rationale: מַשְׂאַת בַּר обозначает наложенную повинность или побор зерном; «дань зерном» сохраняет характер принудительного изъятия без чрезмерной административной конкретизации слова «налог».
- source_word: בָּתֵּי גָזִית
  choice: дома из тёсаного камня
  rationale: Точно передаёт дорогой обработанный камень, не добавляя отсутствующего в тексте значения «дворцы».
- source_word: וְלֹא תֵשְׁבוּ בָם
  choice: но жить в них не будете
  rationale: В контексте домов יָשַׁב естественно означает жить; формулировка современна и сохраняет прямой приговор.
- source_word: כַּרְמֵי חֶמֶד
  choice: прекрасные виноградники
  rationale: חֶמֶד выражает желанность, привлекательность и ценность; «прекрасные» звучит естественно и не сужает смысл до одного лишь хозяйственного качества.
- source_word: וְלֹא תִשְׁתּוּ אֶת יֵינָם
  choice: но вина из них пить не будете
  rationale: Естественно по-русски связывает вино с упомянутыми виноградниками и сохраняет иронию лишения плодов труда.
theological_decisions:
- issue: Характер возвещённого суда
  choice: 'Прямое пророческое возвещение: нажитым посредством угнетения богатством воспользоваться не удастся'
  alternative: Общее нравственное изречение о последствиях несправедливости
  rationale: Второе лицо и конкретные будущие лишения указывают на судебное пророчество, а не на отвлечённую пословицу; перевод не смягчает эту направленность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Конкретные образы попирания, зерновой дани, тёсаного камня и недоступного вина сохранены; синтаксис сделан ясным для обычного читателя.
