base_translation:
  language: en
  yaml_path: translation/ot/amos/005/022.yaml
  text: For even if you offer up to me burnt offerings and your grain offerings[a], I will not accept them; and I will not look upon the peace offerings of your fattened animals.
translation:
  language: ru
  text: Ведь даже если вы вознесёте Мне всесожжения и ваши приношения из зерна, Я их не приму; и на ваши мирные жертвы[a] из откормленного скота не взгляну.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения». Еврейское слово обозначает особую категорию жертв, связанную с благополучием, миром и совместной трапезой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Ведь даже если
  rationale: Сочетание связывает стих с предшествующим обличением и в данном контексте имеет уступительный оттенок. «Ведь даже если» передаёт и связующую, и уступительную функцию.
- source_word: תַּעֲלוּ לִי
  choice: вы возносите Мне
  rationale: Порода hифиль глагола עלה с названиями жертв означает жертвенное вознесение на алтаре; «возносите» сохраняет этот культовый образ.
- source_word: עֹלוֹת
  choice: всесожжения
  rationale: Это установленное обозначение жертв, целиком сжигавшихся на алтаре; оно точно и достаточно понятно в библейском контексте.
- source_word: וּמִנְחֹתֵיכֶם
  choice: и ваши приношения из зерна
  rationale: В жертвенном контексте מִנְחָה обозначает приношение из продуктов земледелия, прежде всего муки или зерна. Такая формулировка конкретнее общего «дары» и понятнее менее современного «хлебные приношения».
- source_word: לֹא אֶרְצֶה
  choice: Я их не приму
  rationale: Здесь רצה означает благосклонно принять жертву. Местоимение «их» добавлено по-русски для ясной связи с перечисленными приношениями.
- source_word: וְשֶׁלֶם
  choice: и на ваши мирные жертвы
  rationale: Термин обозначает особую категорию жертв, связанную с благополучием и общением. Традиционное «мирные жертвы» сохраняет связь с системой ветхозаветных жертвоприношений; возможная смысловая альтернатива вынесена в сноску.
- source_word: מְרִיאֵיכֶם
  choice: из откормленного скота
  rationale: Слово обозначает откормленных домашних животных. Перевод точен, современен и не ограничивает значение одним видом скота.
- source_word: לֹא אַבִּיט
  choice: не взгляну
  rationale: Перевод сохраняет зрительный образ глагола נבט и одновременно передаёт отказ Бога обратить на жертвы благосклонное внимание.
theological_decisions:
- issue: Сохранение конкретных категорий израильских жертв без привнесения позднейшего конфессионального толкования
  choice: 'Сохранены отдельные названия: «всесожжения», «приношения из зерна» и «мирные жертвы».'
  alternative: Обобщить их как «жертвы» или «приношения».
  rationale: 'Пророк называет конкретные установленные виды жертв. Их разграничение усиливает смысл обличения: отвергается не неопределённая религиозность, а совершаемое Израилем культовое служение, неугодное Богу в данном контексте.'
translation_notes:
  register: Современный литературный русский язык с умеренно сохранённой библейской культовой лексикой. Синтаксис торжественный, но не архаичный; местоимение «Мне» написано с прописной буквы согласно принятой русской религиозной издательской норме.
