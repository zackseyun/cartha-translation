  text: עֹשֵׂ֨ה כִימָ֜ה וּ/כְסִ֗יל וְ/הֹפֵ֤ךְ לַ/בֹּ֨קֶר֙ צַלְמָ֔וֶת וְ/י֖וֹם לַ֣יְלָה הֶחְשִׁ֑יךְ הַ/קּוֹרֵ֣א לְ/מֵֽי הַ/יָּ֗ם וַֽ/יִּשְׁפְּכֵ֛/ם עַל פְּנֵ֥י הָ/אָ֖רֶץ יְהוָ֥ה שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/008.yaml
  text: He who made the Pleiades and Orion[a], and turns deep darkness into morning, and darkens day into night[b], who calls for the waters of the sea and pours them out over the face of the earth—Yahweh is his name.
translation:
  language: ru
  text: Тот, кто сотворил Плеяды и Орион, кто обращает глубокую тьму[b] в утро и день — в ночь, кто призывает воды моря и изливает их на поверхность земли, — Яхве[a] имя Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское имя записано четырьмя согласными: יהוה (YHWH). «Яхве» — распространённая современная передача; традиционный русский вариант — «Иегова».'
    reason: Передача божественного имени и вариант транслитерации.
  - marker: b
    text: 'Или: «тень смерти».'
    reason: Лексическая альтернатива для צַלְמָוֶת.
lexical_decisions:
- source_word: עֹשֵׂה
  choice: Тот, кто создал
  rationale: Субстантивированное причастие мужского рода вводит описание Бога. Русская относительная конструкция звучит естественно; совершенный вид уместен при упоминании сотворения созвездий.
- source_word: כִימָה וּכְסִיל
  choice: Плеяды и Орион
  rationale: В астрономическом контексте эти названия традиционно и правдоподобно обозначают звёздное скопление Плеяды и созвездие Орион; перевод названий понятнее транслитерации Кима и Кесиль.
- source_word: וְהֹפֵךְ לַבֹּקֶר צַלְמָוֶת
  choice: обращает глубокую тьму в утро
  rationale: «Обращает… в» передаёт преобразование, а «глубокая тьма» соответствует космическому противопоставлению утра и ночи, не исключая традиционного понимания как «тени смерти».
- source_word: וְיוֹם לַיְלָה הֶחְשִׁיךְ
  choice: а день омрачает до ночи
  rationale: Глагол в породе Hiphil выражает причинение темноты. Формулировка сохраняет образ затемнения дня и его перехода к ночи, не сводя строку к простому «превращает день в ночь».
- source_word: הַקּוֹרֵא לְמֵי הַיָּם
  choice: кто призывает воды моря
  rationale: «Призывает» передаёт властное вызывание вод по Божьему повелению и поддерживает возвышенный поэтический строй.
- source_word: וַיִּשְׁפְּכֵם עַל־פְּנֵי הָאָרֶץ
  choice: и изливает их на поверхность земли
  rationale: Местоимение отнесено к водам; «изливает» точно передаёт действие глагола, а «поверхность земли» естественно выражает еврейскую идиому «лицо земли».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон, то есть личное имя, а не титул. «Яхве» непосредственно передаёт имя и является наиболее обоснованной современной реконструкцией произношения; примечание сохраняет сведения о еврейском написании.
- issue: Значение צַלְמָוֶת
  choice: глубокая тьма
  alternative: тень смерти
  rationale: В параллелизме утра, дня и ночи прежде всего изображена непроглядная тьма. Традиционный вариант «тень смерти» сохранён в примечании, чтобы не устранить возможный оттенок смертного мрака.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим ритмом. Параллельные действия Бога соединены в одну протяжённую фразу; сохранены космические образы и заключительная формула имени.
