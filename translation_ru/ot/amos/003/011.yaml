base_translation:
  language: en
  yaml_path: translation/ot/amos/003/011.yaml
  text: 'Therefore[a], thus says the Lord GOD: An adversary shall surround the land, and he shall bring down your strength from you[b], and your citadels shall be plundered.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве:


    «Враг окружит страну,


    лишит тебя силы,


    и твои крепости[a] будут разграблены».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дворцы». Еврейское слово может обозначать дворцы, укреплённые резиденции или цитадели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Сочетание сохраняет двойной божественный титул: אֲדֹנָי передано как «Владыка», а личное имя יהוה — как «Яхве», без неестественного повтора «Господь Господь».'
- source_word: צַר וּסְבִיב הָאָרֶץ
  choice: Враг окружит эту землю
  rationale: צַר здесь обозначает враждебного нападающего, а краткая эллиптическая фраза וּסְבִיב הָאָרֶץ в контексте угрозы естественно выражает окружение страны. Указательное «эту» уточняет, что речь идёт о земле Израиля, а не обо всей земле.
- source_word: וְהוֹרִיד מִמֵּךְ עֻזֵּךְ
  choice: лишит тебя силы
  rationale: Хифиль от ירד буквально означает «низведёт», а עֹז — «сила, мощь». Русское «лишит тебя силы» естественно передаёт устранение военной и государственной мощи, не сводя образ к разрушению одной крепости.
- source_word: וְנָבֹזּוּ
  choice: будут разграблены
  rationale: Нифаль выражает действие, которому подвергнутся укреплённые здания; «будут разграблены» точно соответствует контексту вражеского нашествия.
- source_word: אַרְמְנוֹתָיִךְ
  choice: твои крепости
  rationale: אַרְמוֹן может обозначать как дворец, так и укреплённую резиденцию или цитадель. «Крепости» хорошо соответствует осадному контексту, а альтернативное значение сохранено в сноске.
theological_decisions:
- issue: Передача составного божественного наименования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Передача имени יהוה как «Яхве» сохраняет его характер личного заветного имени, а «Владыка» передаёт אֲדֹנָי и позволяет избежать двусмысленного или повторного «Господь».
- issue: Определённость личности врага
  choice: Враг
  alternative: противник / притеснение
  rationale: Еврейское צַר стоит в единственном числе и допускает конкретного, хотя и не названного нападающего. Перевод не отождествляет его с какой-либо державой и тем самым сохраняет неопределённость текста.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Стих разбит на строки по смысловым частям. Формы второго лица единственного числа женского рода в еврейском тексте относятся к земле/стране или Самарии; по-русски это естественно сохраняется в обращении «тебя» и притяжательном «твои».
