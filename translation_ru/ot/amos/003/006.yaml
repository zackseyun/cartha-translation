base_translation:
  language: en
  yaml_path: translation/ot/amos/003/006.yaml
  text: If a trumpet is blown in a city[a], do not the people tremble? If disaster happens in a city, has not Yahweh done it?
translation:
  language: ru
  text: Если в городе затрубят в рог, разве народ не содрогнётся? Если в городе случится бедствие[a], разве ГОСПОДЬ не совершил этого?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также означать «несчастье» или «зло»; здесь речь идёт о бедствии, а не о нравственном зле.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתָּקַע שׁוֹפָר
  choice: трубят в рог
  rationale: שׁוֹפָר — сигнальный рог, которым подавали тревогу. Русское «трубят в рог» естественно передаёт и сам инструмент, и публичный тревожный сигнал; неопределённо-личная конструкция уместно отражает еврейскую форму без указания действующего лица.
- source_word: בְּעִיר
  choice: в городе
  rationale: עִיר обозначает город или поселение; «в городе» сохраняет повтор и параллелизм обеих частей стиха.
- source_word: וְעָם
  choice: народ
  rationale: В данном контексте עָם — жители города, услышавшие сигнал тревоги. «Народ» кратко и естественно соответствует риторическому строю фразы.
- source_word: יֶחֱרָדוּ
  choice: содрогнётся
  rationale: חרד выражает испуганную дрожь и тревогу. «Содрогнётся» сохраняет как телесный, так и эмоциональный оттенок.
- source_word: רָעָה
  choice: бедствие
  rationale: רָעָה может означать зло, вред или бедствие. Здесь, в контексте пророческого суда и городской тревоги, речь идёт о бедствии, а не о нравственном зле.
- source_word: תִּהְיֶה
  choice: случается
  rationale: Форма глагола היה в сочетании с רָעָה описывает наступление или возникновение бедствия. Настоящее время поддерживает характер общей риторической закономерности в этом ряду вопросов.
- source_word: וַיהוָה
  choice: ГОСПОДЬ
  rationale: Написание прописными буквами следует принятому русскому способу обозначать тетраграмматон יהוה и отличает личное Божье имя от обычного титула.
- source_word: עָשָׂה
  choice: совершает это
  rationale: עשה — широкий глагол «делать, совершать». Такой перевод сохраняет прямое приписывание действия ГОСПОДУ и не смягчает его до простого допущения бедствия.
theological_decisions:
- issue: Значение רָעָה применительно к действию ГОСПОДА
  choice: бедствие
  alternative: зло; несчастье; calamity
  rationale: Контекст тревожного сигнала и пророческого суда указывает на губительное бедствие, а не на нравственное зло. Этот выбор не приписывает Богу злодейства, но сохраняет утверждение о Его суде.
- issue: Божественная причинность во второй части стиха
  choice: разве не ГОСПОДЬ совершает это?
  alternative: разве не ГОСПОДЬ допустил это?; разве не ГОСПОДЬ навёл его?
  rationale: Еврейский текст прямо употребляет עשה и связывает бедствие с действием ГОСПОДА. «Совершает это» сохраняет резкость и богословское напряжение исходного текста, не ослабляя действие до простого позволения и не конкретизируя его сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным риторическим строем. Повтор «Если в городе» и параллельные вопросы сохранены. «Рог» передаёт древний шофар понятнее и конкретнее, чем обобщённая «труба».
