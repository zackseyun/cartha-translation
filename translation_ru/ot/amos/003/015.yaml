base_translation:
  language: en
  yaml_path: translation/ot/amos/003/015.yaml
  text: And I will strike the winter house along with the summer house[a], and the houses of ivory will perish, and many houses will come to an end," declares Yahweh.
translation:
  language: ru
  text: И поражу зимний дом вместе с летним домом; исчезнут дома из слоновой кости[a], и многим домам придёт конец, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более явно: «дома, отделанные слоновой костью». Вероятно, речь идёт не о домах, буквально построенных из слоновой кости, а о роскошных жилищах, украшенных вставками из неё.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: И поражу
  rationale: Глагол נכה передаёт нанесение удара; «поражу» сохраняет силу Божьего суда и звучит естественно в возвышенной современной русской речи.
- source_word: בֵית הַחֹרֶף עַל בֵּית הַקָּיִץ
  choice: зимний дом вместе с летним домом
  rationale: Названия сезонных резиденций переданы параллельно, а עַל в данном сочетании обозначает совместную участь обоих домов под судом.
- source_word: וְאָבְדוּ
  choice: исчезнут
  rationale: אבד допускает значения гибели, исчезновения и утраты; «исчезнут» сохраняет непереходный характер формы и не уточняет способ разрушения.
- source_word: בָּתֵּי הַשֵּׁן
  choice: дома из слоновой кости
  rationale: Буквально это «дома слоновой кости». Образ сохранён в тексте, а вероятный смысл — роскошные дома с отделкой из слоновой кости — разъяснён в сноске.
- source_word: וְסָפוּ
  choice: придёт конец
  rationale: Форма от סוף выражает прекращение существования; русская конструкция ясна и не привносит конкретного механизма уничтожения.
- source_word: בָּתִּים רַבִּים
  choice: многим домам
  rationale: רַבִּים естественнее всего понимать количественно — «многие», без контекстуального переосмысления как «величественные» или «богатые».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт весомую пророческую формулу, сохраняя личное имя Бога.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, поэтому личное имя передано транслитерацией, а не заменено титулом.
- issue: Характер суда над роскошными жилищами
  choice: Сохранить конкретные образы сезонных домов и слоновой кости
  alternative: Обобщить как уничтожение богатых домов
  rationale: Конкретные социальные образы существенны для пророческого обличения; обобщение ослабило бы текст и внесло бы лишнее толкование.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксический параллелизм сохранён; лексика понятна без архаизмов. Формула «возвещает Яхве» отделена тире как заключительное пророческое удостоверение.
