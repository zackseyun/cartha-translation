  text: הַשְׁמִ֨יעוּ֙ עַל אַרְמְנ֣וֹת בְּ/אַשְׁדּ֔וֹד וְ/עַֽל אַרְמְנ֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אִמְר֗וּ הֵאָֽסְפוּ֙ עַל הָרֵ֣י שֹׁמְר֔וֹן וּ/רְא֞וּ מְהוּמֹ֤ת רַבּוֹת֙ בְּ/תוֹכָ֔/הּ וַ/עֲשׁוּקִ֖ים בְּ/קִרְבָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/009.yaml
  text: Proclaim to the citadels of Ashdod and to the citadels in the land of Egypt[a], and say, “Assemble on the mountains of Samaria, and see the many tumults within her[d][c][b], and the oppressed in her midst.”
translation:
  language: ru
  text: 'Возвестите во дворцах Ашдода и во дворцах в земле Египта[a] и скажите: «Соберитесь на горах Самарии[b] и посмотрите на многочисленные смуты в ней[c] и на угнетённых в её среде[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в укреплённых дворцах». Еврейское слово может обозначать величественные укреплённые резиденции.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на холмах Самарии».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможны также переводы: «великая смута» или «многочисленные волнения».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «проявления угнетения». По форме еврейское слово естественнее понимать как обозначение угнетённых людей, но возможно и более отвлечённое прочтение.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְׁמִיעוּ
  choice: Возвестите
  rationale: Форма повелительного наклонения породы hифиль от שׁמע здесь означает публично объявить или провозгласить; «возвестите» сохраняет торжественный пророческий регистр.
- source_word: אַרְמְנוֹת
  choice: дворцах
  rationale: Слово обозначает величественные укреплённые резиденции. «Дворцы» естественно по-русски и сохраняет значение мест пребывания знати; возможный оттенок укреплённости отмечен в сноске.
- source_word: בְּאַשְׁדּוֹד
  choice: в Ашдоде
  rationale: Предлог ב передаёт местонахождение; русское «во дворцах Ашдода» звучало бы естественно, но могло бы слабее отражать локативную конструкцию. В основном тексте выбран ясный локативный смысл внутри общей фразы «во дворцах Ашдода»? Для публикационного текста фактически употреблено «во дворцах Ашдода», где родительный падеж идиоматично связывает дворцы с городом и не меняет референцию.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: земли Египетской
  rationale: Сохранена полная формула «земля Египетская», а не сокращённое «Египет», ради соответствия еврейской фразе и пророческой ритмике.
- source_word: הֵאָסְפוּ
  choice: Соберитесь
  rationale: Нифаль, повелительное наклонение, выражает призыв собраться в качестве свидетелей происходящего.
- source_word: הָרֵי שֹׁמְרוֹן
  choice: горах Самарии
  rationale: הַר может обозначать как гору, так и возвышенность или холм. Прямое соответствие «горы» сохраняет образ высокой точки наблюдения; вариант отмечен в сноске.
- source_word: מְהוּמוֹת רַבּוֹת
  choice: какой великий беспорядок царит
  rationale: Фраза описывает сильную смуту, сумятицу и общественные волнения. Русская конструкция естественно передаёт интенсивность, хотя число оригинала допускает «много беспорядков»; это отмечено в сноске.
- source_word: בְּתוֹכָהּ
  choice: в ней
  rationale: Местоименная форма относится к Самарии как к городу женского рода. Краткое «в ней» естественно передаёт внутреннее пространство города.
- source_word: עֲשׁוּקִים
  choice: угнетённых
  rationale: Форма лучше всего понимается как субстантивированное пассивное причастие — люди, подвергшиеся угнетению. Неопределённость между людьми и явлениями угнетения отражена в сноске.
- source_word: בְּקִרְבָּהּ
  choice: в ней
  rationale: Означает «посреди неё, внутри неё». Повтор «в ней» в сочетании «сколько в ней угнетённых» естественен по-русски и сохраняет пространственный смысл.
theological_decisions:
- issue: Что именно наблюдатели должны увидеть в Самарии
  choice: Общественный беспорядок и угнетённых людей
  alternative: Многочисленные волнения и проявления угнетения как отвлечённые явления
  rationale: עֲשׁוּקִים по форме наиболее естественно означает угнетённых людей, что выдвигает на первый план жертв несправедливости. Однако возможное отвлечённое прочтение не устранено и приведено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Императивы переданы прямо, без архаических синтаксических оборотов. Для естественности множественное מְהוּמוֹת רַבּוֹת передано собирательным выражением, а буквальная множественность сохранена в сноске.
