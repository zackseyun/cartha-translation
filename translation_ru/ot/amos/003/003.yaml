  rationale: Краткий и прямой эквивалент наречия со значением совместного действия.
- source_word: בִּלְתִּי אִם
  choice: если не
  rationale: В русском риторическом вопросе это наиболее естественная передача исключительного условия; по смыслу соответствует «если только не».
- source_word: נוֹעָדוּ
  choice: условились встретиться
  rationale: Нифаль глагола יעד может обозначать взаимную предварительную договорённость о встрече; перевод сохраняет как взаимность, так и связь с совместным путём.
