  text: For the Lord GOD does nothing unless he reveals his secret to his servants the prophets[a].
translation:
  language: ru
  text: Ибо Владыка Яхве ничего не делает, не открыв Своей тайны[a] Своим слугам — пророкам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своего сокровенного замысла», «Своего тайного совета». Еврейское слово может обозначать тайну, доверительный совет или замысел, известный близким и посвящённым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего утверждения; «ибо» естественно передаёт пояснительно-причинную связь и сохраняет возвышенный, но современный регистр.
- source_word: לֹא ... כִּי אִם
  choice: ничего не делает, не открыв
  rationale: Отрицательно-исключительная конструкция означает, что действие Яхве не совершается без указанного откровения. Русский деепричастный оборот кратко и естественно передаёт эту зависимость, не превращая её в условное предположение.
- source_word: יַעֲשֶׂה ... דָּבָר
  choice: ничего не делает
  rationale: Буквально сочетание означает «не делает дела/чего-либо»; в русском отрицательное местоимение даёт точную и естественную формулировку.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» сохраняет личное имя יהוה и не сливает два элемента сочетания в повтор «Господь Господь».
- source_word: גָּלָה
  choice: открыв
  rationale: Глагол означает «открывать, раскрывать, обнаруживать». Совершенный вид в деепричастной форме передаёт откровение, предшествующее действию, без излишнего уточнения его способа.
- source_word: סוֹדוֹ
  choice: Своей тайны
  rationale: סוֹד охватывает тайну, доверительный совет и сокровенный замысел. «Тайна» сохраняет широкое значение и не сводит слово только к заранее составленному плану.
- source_word: אֶל עֲבָדָיו
  choice: Своим слугам
  rationale: В данном контексте עֲבָדִים — состоящие на Божьем служении и исполняющие Его поручение. «Слуги» понятно современному читателю и не вносит неуместного акцента на рабском статусе.
- source_word: הַנְּבִיאִים
  choice: пророкам
  rationale: Определённое приложение уточняет, кто здесь назван слугами; тире ясно выражает эту связь по-русски.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант сохраняет и титул, и явленное личное имя, не заменяя имя общим обозначением и не создавая повтора «Господь Господь».
- issue: Смысл слова סוֹד
  choice: тайна
  alternative: тайный замысел
  rationale: «Тайна» оставляет открытыми присутствующие в еврейском слове оттенки доверительного совета, сокровенного замысла и скрытого дела, не навязывая более узкого богословского толкования.
- issue: Соотношение Божьего действия и откровения пророкам
  choice: ничего не делает, не открыв
  alternative: ничего не сделает, если не откроет
  rationale: Формулировка передаёт общее утверждение текста и естественную предшествующую связь откровения с действием, не утверждая сверх текста, что пророкам раскрывается абсолютно всякое Божье действие во всех возможных смыслах.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Порядок слов и деепричастная конструкция делают афористическое утверждение кратким и ясным; тире показывает, что пророки названы слугами Яхве.
