  source_fidelity: 'Перевод точно передаёт основные элементы еврейского текста: нравственную неспособность/неумение поступать правильно, пророческую формулу נְאֻם יְהוָה, характеристику людей как накапливающих насилие и שֹׁד, а также локатив «в своих ...». «Не умеют поступать справедливо» хорошо передаёт ידע с инфинитивом как укоренённую практическую нравственную несостоятельность, не навязывая более сильного догматического вывода. «Разорение» является допустимым эквивалентом שֹׁד; вариант, связанный с грабежом, надлежащим образом сохранён в сноске. «Крепости» допустимо отражает укреплённый аспект אַרְמְנוֹת, при этом вариант «дворцы» отмечен.'
