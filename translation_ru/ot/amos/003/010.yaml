id: AMO.3.10
reference: Amos 3:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/לֹֽא יָדְע֥וּ עֲשׂוֹת נְכֹחָ֖ה נְאֻם יְהוָ֑ה הָ/אֽוֹצְרִ֛ים חָמָ֥ס וָ/שֹׁ֖ד בְּ/אַרְמְנֽוֹתֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/010.yaml
  text: They do not know how to do what is right—oracle of Yahweh—those who store up violence and destruction in their citadels[a][b].
translation:
  language: ru
  text: Они не умеют поступать справедливо, — возвещает Яхве, — те, кто копит насилие и разорение в своих крепостях[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «награбленное» вместо «разорение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дворцах» вместо «крепостях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדְעוּ
  choice: не умеют
  rationale: В сочетании с инфинитивом עֲשׂוֹת глагол ידע означает не просто отсутствие сведений, а отсутствие усвоенной способности поступать должным образом; «не умеют» естественно передаёт этот нравственный укор, не превращая его в утверждение о полной метафизической неспособности.
- source_word: עֲשׂוֹת נְכֹחָה
  choice: поступать справедливо
  rationale: נְכֹחָה обозначает прямоту, правильность и праведное поведение. В контексте обличения общественного насилия «поступать справедливо» ясно и естественно выражает нравственно-социальный смысл.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: נְאֻם — торжественная пророческая формула, удостоверяющая Божье слово. «Возвещает» сохраняет возвышенный пророческий регистр, а личное имя יהוה передано как «Яхве».
- source_word: הָאֹצְרִים
  choice: те, кто копит
  rationale: Причастие от אצר характеризует людей, постоянно накапливающих названное далее; «копит» передаёт как накопление, так и его предосудительный характер.
- source_word: חָמָס
  choice: насилие
  rationale: חָמָס часто обозначает насилие, притеснение и сопряжённую с ними неправду; «насилие» — прямой и уместный эквивалент в пророческом обличении.
- source_word: שֹׁד
  choice: разорение
  rationale: שֹׁד может означать разорение, опустошение или грабёж. «Разорение» сохраняет разрушительный смысл и допускает понимание накопленного богатства как плода разорения других; вариант «награбленное» отмечен в сноске.
- source_word: בְּאַרְמְנוֹתֵיהֶם
  choice: в своих крепостях
  rationale: אַרְמוֹן обозначает укреплённое дворцовое сооружение, дворец или цитадель. «Крепости» подчёркивает защищённые резиденции властной знати; «дворцы» остаётся вероятным вариантом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо содержит тетраграмматон. Транслитерация «Яхве» сохраняет личное Божье имя, не заменяя его титулом.
- issue: Нравственное неведение или неспособность в לֹא יָדְעוּ עֲשׂוֹת נְכֹחָה
  choice: не умеют поступать справедливо
  alternative: не знают, как поступать справедливо
  rationale: Еврейское выражение обличает настолько укоренившуюся порочность, что справедливое поведение не входит в усвоенный образ действий этих людей. «Не умеют» передаёт практическую нравственную неспособность, не утверждая, что они вовсе не осознают различия между добром и злом.
- issue: Предмет накопления в חָמָס וָשֹׁד
  choice: насилие и разорение
  alternative: насилие и награбленное
  rationale: Грамматика представляет оба существительных как то, что они накапливают, создавая напряжённый образ накопленного зла и его плодов. Основной текст сохраняет абстрактную формулировку оригинала, а возможный конкретный смысл «награбленное» вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Вставная формула «возвещает Яхве» выделена тире. Лексика понятна широкому читателю, но сохраняет достоинство и образность исходного текста.
