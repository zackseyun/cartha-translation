source:
  edition: WLC
  text: שִׁמְע֥וּ וְ/הָעִ֖ידוּ בְּ/בֵ֣ית יַֽעֲקֹ֑ב נְאֻם אֲדֹנָ֥/י יְהוִ֖ה אֱלֹהֵ֥י הַ/צְּבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/013.yaml
  text: Hear and testify against the house of Jacob[a], declares the Lord GOD[b], the God of hosts.
translation:
  language: ru
  text: Слушайте и свидетельствуйте против дома Иакова[a], — возвещает Господь Яхве[b], Бог Воинств.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свидетельствуйте в доме Иакова»; еврейское выражение допускает такое понимание, хотя в контексте суда вероятнее значение «против дома Иакова».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский составной титул: «Адонай Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Форма повелительного наклонения во множественном числе передаёт обращённый к нескольким слушателям торжественный пророческий призыв.
- source_word: וְהָעִידוּ
  choice: свидетельствуйте против
  rationale: 'Hифиль повелительного наклонения от עוד здесь имеет судебный оттенок: дать свидетельство, обличающее обвиняемую сторону.'
- source_word: בְּבֵית יַעֲקֹב
  choice: против дома Иакова
  rationale: Предлог בְּ допускает несколько отношений, однако в контексте суда и при глаголе свидетельствования естественно выражает направленность свидетельства против дома Иакова; неоднозначность отмечена в сноске.
- source_word: נְאֻם
  choice: возвещает
  rationale: Устойчивая пророческая формула, вводящая авторитетное Божье изречение; «возвещает» звучит торжественно и естественно в современном литературном русском языке.
- source_word: אֲדֹנָי יְהוִה
  choice: Господь Яхве
  rationale: 'Переданы оба элемента составного титула: אֲדֹנָי как «Господь», а тетраграмматон — как личное имя «Яхве», без смешения двух разных слов.'
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: Бог Воинств
  rationale: Сохраняет широту и традиционную весомость צְבָאוֹת, не уточняя без достаточных оснований, земные это или небесные воинства.
theological_decisions:
- issue: Передача составного Божьего титула אֲדֹנָי יְהוִה
  choice: Господь Яхве
  alternative: Владыка Господь; Господь Бог
  rationale: Форма «Господь Яхве» прозрачно сохраняет различие между титулом אֲדֹנָי и личным именем יהוה и не скрывает присутствие тетраграмматона.
- issue: Референт צְבָאוֹת
  choice: Воинств
  alternative: небесных воинств; войск
  rationale: Исходное слово может охватывать различные воинства; перевод намеренно не сужает его значение.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Судебная образность сохранена, а подлинная неоднозначность предлога при «доме Иакова» вынесена в сноску.
