  yaml_path: translation/ot/amos/003/004.yaml
  text: Does a lion roar in the forest when it has no prey? Does a young lion raise its voice from its den unless it has caught something?[a][b]
translation:
  language: ru
  text: Ревёт ли лев в лесу, когда у него нет добычи? Подаёт ли молодой лев голос из своего логова, если не поймал добычу?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если не поймал». Дополнение «добычу» подразумевается по контексту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁאַג
  choice: рычит
  rationale: Глагол обозначает громкий рёв льва; «рычит» естественно передаёт действие в русском вопросительном предложении.
- source_word: אַרְיֵה
  choice: лев
  rationale: Прямое и контекстуально точное соответствие названию животного.
- source_word: בַּיַּעַר
  choice: в лесу
  rationale: יַעַר обычно означает лес или лесистую местность; «в лесу» ясно и естественно по-русски.
- source_word: טֶרֶף
  choice: добыча
  rationale: Существительное обозначает пойманную или растерзанную добычу; этот вариант сохраняет охотничий образ.
- source_word: אֵין לוֹ
  choice: у него нет
  rationale: Еврейская конструкция отсутствия естественно передаётся русским оборотом обладания «у него нет».
- source_word: יִתֵּן קוֹלוֹ
  choice: подаёт голос
  rationale: Буквально «даёт свой голос»; русский идиоматический оборот «подаёт голос» сохраняет образ и не звучит искусственно.
- source_word: כְּפִיר
  choice: молодой лев
  rationale: Слово обозначает молодого, уже сильного льва, а не обязательно маленького львёнка.
- source_word: מִמְּעֹנָתוֹ
  choice: из своего логова
  rationale: מְעוֹנָה здесь обозначает место обитания зверя; «логово» наиболее естественно в отношении льва.
- source_word: בִּלְתִּי אִם
  choice: если не
  rationale: Сочетание вводит исключительное условие; в русском риторическом вопросе «если не» звучит естественно и точно.
- source_word: לָכָד
  choice: не поймал добычу
  rationale: Глагол означает «поймать, захватить»; объект добавлен из непосредственного контекста для ясности по-русски и отмечен сноской.
