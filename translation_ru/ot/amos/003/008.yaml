  text: אַרְיֵ֥ה שָׁאָ֖ג מִ֣י לֹ֣א יִירָ֑א אֲדֹנָ֤/י יְהוִה֙ דִּבֶּ֔ר מִ֖י לֹ֥א יִנָּבֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/008.yaml
  text: A lion has roared—who will not fear? The Lord GOD has spoken—who will not prophesy?[a][b]
translation:
  language: ru
  text: Лев зарычал — кто не испугается? Владыка Яхве сказал — кто не станет пророчествовать?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «кто может не пророчествовать?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְיֵה
  choice: лев
  rationale: Обычное обозначение льва; в русском языке при обобщённо-образном употреблении естественна форма без неопределённого артикля.
- source_word: שָׁאָג
  choice: зарычал
  rationale: Qal perfect 3 м. р. ед. ч. от глагола «рычать». Совершенный вид передаёт уже раздавшийся рёв и вызванную им неизбежную реакцию.
- source_word: מִי לֹא יִירָא
  choice: кто не испугается?
  rationale: Риторический вопрос с отрицанием предполагает всеобщую и неизбежную реакцию. Будущее совершенного вида естественно передаёт значение древнееврейского имперфекта в данном контексте.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт и титул אֲדֹנָי, и личное имя יהוה, не создавая неестественного сочетания «Господь Господь» и не скрывая различия между ними.
- source_word: דִּבֶּר
  choice: сказал
  rationale: Piel perfect 3 м. р. ед. ч.; совершенный вид сохраняет тесный параллелизм с «зарычал» и представляет речь Бога как уже прозвучавшую причину пророческого ответа.
- source_word: מִי לֹא יִנָּבֵא
  choice: кто не станет пророчествовать?
  rationale: Прямо сохраняет риторическую форму и глагол «пророчествовать». Оборот «не может не пророчествовать» яснее выражал бы вынужденность, но добавлял бы модальность, не выраженную отдельным словом в древнееврейском тексте.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Транслитерация «Яхве» сохраняет личное имя в исходном тексте, а «Владыка» различает его с титулом אֲדֹנָי. Традиционное «Господь Бог» более привычно, но скрывает присутствие Тетраграмматона.
- issue: Степень неизбежности пророческого ответа
  choice: кто не станет пророчествовать?
  alternative: кто может не пророчествовать?
  rationale: Основной текст сохраняет грамматический параллелизм двух риторических вопросов, не превращая его явно в утверждение о непреодолимом принуждении; более идиоматический вариант приведён в примечании.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Два параллельных риторических вопроса и причинно-следственная напряжённость оригинала сохранены; архаизмы и конфессионально маркированные формулы по возможности не использованы.
