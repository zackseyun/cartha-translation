base_translation:
  language: en
  yaml_path: translation/ot/amos/003/012.yaml
  text: 'Thus says Yahweh: As the shepherd rescues from the mouth of the lion two legs or a piece of an ear[b][a], so will the sons of Israel who dwell in Samaria be rescued—with the corner of a bed and the cover of a couch.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Как пастух вырывает из пасти льва две ноги или кусочек уха, так будут спасены сыны Израиля[a], живущие в Самарии, — у края постели и на ложе в Дамаске[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Конец стиха труден для перевода. Еврейский текст буквально содержит: «у края постели и в Дамаске — ложе». Неясно, как эти слова синтаксически связаны с предыдущим предложением. Возможны понимания: «на ложе в Дамаске» или, при ином понимании слова «Дамаск», «на дамасском ложе».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: как… так
  rationale: Сохраняет явную сравнительную конструкцию еврейского текста.
- source_word: יַצִּיל / יִנָּצְלוּ
  choice: вырывает / будут спасены
  rationale: Глагол «вырывает» естественно передаёт конкретное действие пастуха, а «будут спасены» сохраняет страдательную форму и пророческую направленность второй части.
- source_word: הָרֹעֶה
  choice: пастух
  rationale: В обобщающем сравнении русский язык естественно допускает существительное без определённого артикля.
- source_word: מִפִּי הָאֲרִי
  choice: из пасти льва
  rationale: Естественная русская передача буквального образа «изо рта льва» применительно к зверю.
- source_word: שְׁתֵּי כְרָעַיִם
  choice: две голени
  rationale: כְרָעַיִם обозначает нижние части ног животного; «голени» точнее, чем общее «ноги», и сохраняет образ жалких останков.
- source_word: בְדַל אֹזֶן
  choice: клочок уха
  rationale: Передаёт небольшой оторванный фрагмент и сохраняет резкость образа.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет традиционную формальную конструкцию исходного текста; современная национальная формулировка указана в сноске.
- source_word: הַיֹּשְׁבִים בְּשֹׁמְרוֹן
  choice: живущие в Самарии
  rationale: Естественно передаёт субстантивированное причастие без ненужного буквального «сидящие».
- source_word: בִּפְאַת מִטָּה
  choice: с краем постели
  rationale: Связывает предмет с образом ничтожных остатков, но не разворачивает неясную синтаксическую связь в подробное толкование.
- source_word: וּבִדְמֶשֶׁק עָרֶשׂ
  choice: и с ложем в Дамаске
  rationale: Сохраняет масоретское чтение דמשק как название Дамаска и различает עָרֶשׂ «ложе» и מִטָּה «постель»; неясность конструкции отмечена в сноске.
theological_decisions:
- issue: Представляет ли сравнение обещание значительного избавления или иронический образ ничтожного остатка
  choice: Сохранён резкий образ спасения лишь жалких останков
  alternative: Обобщить смысл как выживание после суда, не подчёркивая малочисленность спасшихся
  rationale: Пастух извлекает из львиной пасти только две голени и клочок уха; это образ крайне малого остатка, а не торжественного избавления.
- issue: Как передать неясное окончание стиха
  choice: В основном тексте сохранено масоретское чтение с Дамаском, а неоднозначность раскрыта в сноске
  alternative: Перевести как «с дамасским ложем», «с ложем, покрытым узорной тканью» или «на ложе в Дамаске»
  rationale: Синтаксис и значение фразы спорны; ни одно толкование не следует выдавать за несомненное.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сравнительно формальный, но понятный; конкретный и суровый образ суда не смягчён. Архаизирующее «сыны Израиля» сохранено как маркированная формула и пояснено в сноске.
