lexical_decisions:
- source_word: רַק
  choice: только
  rationale: 'Передаёт вынесенное вперёд эмфатическое ограничение: особые отношения Бога из всех земных племён связывали именно с Израилем.'
- source_word: יָדַעְתִּי
  choice: Я знал
  rationale: 'Сохраняет прямое значение еврейского ידע и его намеренную многозначность: здесь речь не просто об осведомлённости, а об особом признании и отношениях завета. Возможные уточняющие переводы вынесены в сноску.'
- source_word: מִכֹּל מִשְׁפְּחֹות הָאֲדָמָה
  choice: среди всех племён земли
  rationale: «Племена» естественно обозначает здесь родовые и этнические сообщества, а «земли» относится ко всему человеческому миру, а не только к определённой стране.
- source_word: עַל־כֵּן
  choice: поэтому
  rationale: 'Ясно сохраняет причинно-следственную связь: именно особые отношения завета становятся основанием особой ответственности.'
- source_word: אֶפְקֹד עֲלֵיכֶם
  choice: Я накажу вас
  rationale: В контексте суда פקד означает привлечение к ответу и наказание. Такой перевод прямо и естественно передаёт смысл современному читателю; более буквальный оборот пояснён в сноске.
- source_word: עֲוֺנֹתֵיכֶם
  choice: все ваши беззакония
  rationale: «Беззакония» сохраняет нравственную и судебную весомость עָוֹן, которое может обозначать как преступный поступок, так и связанную с ним вину.
theological_decisions:
- issue: Заветный оттенок יָדַע («знать»)
  choice: В основном тексте сохранено «знал», а заветный смысл обозначен в сноске.
  alternative: Перевести непосредственно как «избрал» или «признал».
  rationale: Глагол указывает на исключительные отношения Господа с Израилем, однако буквально означает «знать». Сохранение этого слова не сужает смысл до одной богословской формулы и удерживает напряжение между избранием, близостью и ответственностью.
- issue: Судебное значение פקד
  choice: Переведено «накажу вас».
  alternative: «Взыщу с вас» или буквальное «посещу на вас».
  rationale: В сочетании с беззакониями глагол выражает действие суда. «Накажу» ясно передаёт этот смысл без неестественного для современного русского языка буквального оборота.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным синтаксисом. Инверсия «Только вас Я знал» сохраняет начальное смысловое ударение оригинала. Местоимение «Я» написано с прописной буквы как прямая речь Бога.
