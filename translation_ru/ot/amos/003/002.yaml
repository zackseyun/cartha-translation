  text: Только вас Я знал[a] из всех родов земли; поэтому Я накажу вас[b] за все ваши беззакония.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Только вас Я избрал (признал) из всех родов земли». Еврейское «знал» здесь может указывать на особые отношения завета.'
