id: AMO.3.1
reference: Amos 3:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שִׁמְע֞וּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה עֲלֵי/כֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל עַ֚ל כָּל הַ/מִּשְׁפָּחָ֔ה אֲשֶׁ֧ר הֶעֱלֵ֛יתִי מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/001.yaml
  text: 'Hear this word that Yahweh has spoken against you[a], sons of Israel, against the whole family that I brought up from the land of Egypt, saying:'
translation:
  language: ru
  text: 'Слушайте это слово, которое Яхве изрёк против вас, сыны Израиля, — против всего семейства, которое Я вывел из земли Египта, говоря:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Форма повелительного наклонения во множественном числе вводит пророческое обращение. «Слушайте» естественно в современном русском и сохраняет призыв внимательно принять сказанное.
- source_word: הַדָּבָר הַזֶּה
  choice: слово
  rationale: В пророческом контексте דָּבָר обозначает возвещаемое Божье слово. Русское «слово» сохраняет традиционный образ божественного речения без пояснительной замены на «весть».
- source_word: דִּבֶּר יְהוָה
  choice: Яхве изрёк
  rationale: Глагол «изрёк» передаёт завершённое властное высказывание, сила которого определяет последующую речь; имя יהוה передано транслитерацией «Яхве».
- source_word: עֲלֵיכֶם
  choice: против вас
  rationale: В контексте обвинительного пророчества предлог עַל имеет неблагоприятную, судебно-обличительную направленность. «Против вас» сохраняет эту силу, не смягчая её до «о вас».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Буквальное родственное обозначение сохраняет мужскую форму и образ народа как заветной семьи. «Сыны» уместно в dignified biblical register, а более идиоматичные варианты вынесены в сноску.
- source_word: עַל כָּל הַמִּשְׁפָּחָה
  choice: против всего семейства
  rationale: מִשְׁפָּחָה представляет весь вышедший из Египта народ как единую родственную общность. «Семейство» сохраняет этот образ, а повтор «против» воспроизводит обвинительную структуру еврейской фразы.
- source_word: הֶעֱלֵיתִי מֵאֶרֶץ מִצְרַיִם
  choice: Я вывел из земли Египетской
  rationale: Хотя каузатив עָלָה буквально выражает движение вверх, в формуле исхода естественный русский эквивалент — «вывел». Он ясно передаёт освобождение и сохраняет устойчивую библейскую формулу.
- source_word: לֵאמֹר
  choice: 'говоря:'
  rationale: Стандартная формула введения прямой речи; двоеточие показывает, что содержание продолжается в следующем стихе.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное заветное имя, а не титул. «Яхве» прямо передаёт тетраграмматон и не подменяет его словом «Господь».
- issue: Обвинительное или нейтральное значение עַל
  choice: против вас / против всего семейства
  alternative: о вас / обо всём семействе
  rationale: Последующий контекст возвещает суд, поэтому «против» лучше сохраняет обличительную направленность. При этом перевод не добавляет конкретного обвинения, которого в самом стихе ещё нет.
- issue: Родственное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: дети Израиля; народ Израиля
  rationale: Форма источника буквально означает «сыны Израиля» и несёт корпоративный семейно-заветный смысл. Основной текст сохраняет эту форму, не сводя обращение только к непосредственным сыновьям патриарха; смысловые варианты отмечены в сноске.
- issue: Смена третьего лица на первое в речи
  choice: «Яхве изрёк… которое Я вывел»
  alternative: «Яхве… которое Он вывел»
  rationale: Еврейский текст переходит от упоминания Яхве в третьем лице к Божьему «Я». Эта резкая смена сохранена как особенность пророческой речи, а не сглажена.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Формы «изрёк», «сыны Израиля» и «земля Египетская» поддерживают достоинство библейской речи, но синтаксис остаётся ясным. Сохранены повтор «против» и неожиданная смена третьего лица на первое.
