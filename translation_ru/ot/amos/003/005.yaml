  yaml_path: translation/ot/amos/003/005.yaml
  text: Does a bird fall into a trap on the ground when there is no snare for it? Does a trap spring up from the ground when it has caught nothing at all?[a][b]
translation:
  language: ru
  text: Разве птица попадёт в ловушку на земле, если для неё нет силка?[a] Разве ловушка подскочит с земли, ничего не поймав?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если для неё нет приманки (или спускового механизма)»; еврейское слово, переведённое как «силок», может обозначать более конкретно то, что приманивает птицу или приводит ловушку в действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и поймать не поймает» — усилительная еврейская конструкция со смыслом «совсем ничего не поймав» или «не поймав ничего».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִפֹּל
  choice: попадёт
  rationale: Основное значение — «падать», но по-русски естественное выражение «попасть в ловушку» сохраняет образ и не сводит глагол прямо к «быть пойманной».
- source_word: צִפּוֹר
  choice: птица
  rationale: Общее обозначение птицы без указания конкретного вида.
- source_word: פַּח
  choice: ловушка
  rationale: Обозначает приспособление для ловли птиц или животных; современное и ясное русское слово, пригодное для обоих употреблений.
- source_word: הָאָרֶץ / הָאֲדָמָה
  choice: на земле / от земли
  rationale: В конкретном образе охоты речь идёт о поверхности земли; различие предлогов отражает местонахождение ловушки и её движение вверх.
- source_word: מוֹקֵשׁ
  choice: силок
  rationale: Сохраняет отличие от פַּח («ловушка»), не исключая более узких значений «приманка» или «спусковой механизм», вынесенных в сноску.
- source_word: אֵין לָהּ
  choice: для неё нет силка
  rationale: Передаёт отрицание наличия средства, предназначенного для поимки птицы, и сохраняет местоименный суффикс.
- source_word: יַעֲלֶה
  choice: подскочит
  rationale: Глагол означает движение вверх; применительно к сработавшей ловушке «подскочит» звучит естественно и наглядно.
- source_word: וְלָכוֹד לֹא יִלְכּוֹד
  choice: ничего не поймав
  rationale: 'Передаёт смысл усилительной конструкции: ловушка не срабатывает, не совершив поимки; эмфатический оттенок пояснён в сноске.'
