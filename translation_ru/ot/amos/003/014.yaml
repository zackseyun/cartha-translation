  terminology: «Вефиль», «жертвенники» и буквальное «рога жертвенника» выбраны удачно. Сноска b корректно поясняет культовую деталь. Сноску a следует слегка уточнить, чтобы она говорила о значении еврейского глагола, а не о неестественном русском «посещении».
