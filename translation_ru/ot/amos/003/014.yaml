  text: כִּ֗י בְּ/י֛וֹם פָּקְדִ֥/י פִשְׁעֵֽי יִשְׂרָאֵ֖ל עָלָ֑י/ו וּ/פָֽקַדְתִּי֙ עַל מִזְבְּח֣וֹת בֵּֽית אֵ֔ל וְ/נִגְדְּעוּ֙ קַרְנ֣וֹת הַ/מִּזְבֵּ֔חַ וְ/נָפְל֖וּ לָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/014.yaml
  text: For on the day when I punish Israel for his transgressions[a], I will also punish the altars of Bethel[b]; the horns of the altar will be cut off and fall to the ground.
translation:
  language: ru
  text: Ибо в тот день, когда Я взыщу с Израиля за его преступления[a], Я совершу суд и над жертвенниками Вефиля; рога жертвенника[b] будут отсечены и упадут на землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Я призову Израиль к ответу за его мятежи». Буквально: «когда Я посещу Израиль»; еврейский глагол в данном контексте означает призвать к ответу или наказать, а слово «преступления» также имеет оттенок мятежа.'
    reason: lexical_alternative
  - marker: b
    text: «Рога» — рогообразные выступы по углам жертвенника, связанные с его священным и обрядовым назначением.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание или пояснение к предшествующему пророческому высказыванию; «ибо» сохраняет причинно-пояснительную связь и соответствует торжественному регистру.
- source_word: בְּיוֹם
  choice: в тот день, когда
  rationale: Еврейская временная формула естественно передаётся по-русски конструкцией «в тот день, когда», связывающей её с последующим действием.
- source_word: פָּקְדִי ... וּפָקַדְתִּי עַל
  choice: когда Я взыщу ... Я взыщу и с
  rationale: פקד в контексте суда означает призвать к ответу, подвергнуть взысканию или наказать. Повтор «взыщу» сохраняет лексическую связь двух частей стиха, а «и» передаёт присоединительное значение союза.
- source_word: פִשְׁעֵי
  choice: преступления
  rationale: פשע обозначает сознательные нарушения, имеющие оттенок восстания против законной власти. «Преступления» ясно передаёт судебно-нравственный смысл, а оттенок мятежа отмечен в сноске.
- source_word: יִשְׂרָאֵל עָלָיו
  choice: с Израиля за его преступления
  rationale: Местоименный суффикс единственного числа относится к собирательному имени «Израиль». Русское мужское местоимение естественно сохраняет личностное изображение народа.
- source_word: מִזְבְּחוֹת בֵּית אֵל
  choice: жертвенников Вефиля
  rationale: Конструкция обозначает жертвенники, находящиеся в Вефиле или принадлежащие его святилищу. Традиционная русская форма топонима «Вефиль» понятна и уместна в библейском тексте.
- source_word: וְנִגְדְּעוּ
  choice: будут отсечены
  rationale: Глагол גדע выражает насильственное отсечение или срубание; «будут отсечены» точно передаёт пассивный результат действия.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: рога жертвенника
  rationale: Сохранено буквальное культовое обозначение рогообразных выступов по углам жертвенника, без замены образа пояснительной перифразой.
- source_word: וְנָפְלוּ לָאָרֶץ
  choice: и упадут на землю
  rationale: Прямо и естественно передаёт физический результат отсечения рогов.
theological_decisions:
- issue: Передача Израиля как единого личностно изображённого народа
  choice: с Израиля за его преступления
  alternative: с Израиля за преступления народа
  rationale: Еврейский текст использует суффикс мужского рода единственного числа. Русское «его» сохраняет грамматику и личностно-заветный характер пророческой речи, не вводя дополнительного толкования.
- issue: Сохранение культового образа рогов жертвенника
  choice: рога жертвенника
  alternative: угловые выступы жертвенника
  rationale: Речь идёт о реальной и символически значимой детали жертвенника. Буквальная передача сохраняет образ разрушения священного сооружения, а культурное пояснение вынесено в сноску.
- issue: Смысл повторённого глагола פקד
  choice: взыщу ... взыщу и с
  alternative: накажу ... покараю также
  rationale: «Взыщу» удерживает судебный смысл призвания к ответу, не сводя многозначный глагол только к исполнению наказания, и позволяет воспроизвести намеренный повтор оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «взыщу» воспроизводит риторическую связь оригинала; синтаксис остаётся ясным для обычного читателя. Заглавная «Я» отражает речь Бога. Традиционный топоним «Вефиль» сохранён как устоявшаяся русская библейская форма.
