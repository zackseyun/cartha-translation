  text: הִנֵּ֞ה עֵינֵ֣י אֲדֹנָ֣/י יְהוִ֗ה בַּ/מַּמְלָכָה֙ הַֽ/חַטָּאָ֔ה וְ/הִשְׁמַדְתִּ֣י אֹתָ֔/הּ מֵ/עַ֖ל פְּנֵ֣י הָ/אֲדָמָ֑ה אֶ֗פֶס כִּ֠י לֹ֣א הַשְׁמֵ֥יד אַשְׁמִ֛יד אֶת בֵּ֥ית יַעֲקֹ֖ב נְאֻם יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/008.yaml
  text: Look[a], the eyes of the Lord GOD are on the sinful kingdom, and I will destroy it from the face of the earth. Yet I will not utterly destroy the house of Jacob," declares Yahweh.
translation:
  language: ru
  text: Вот, глаза Владыки Яхве обращены на грешное царство, и Я уничтожу его с лица земли. Но дом Иакова Я не уничтожу полностью, — возвещает Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание и вводит торжественное пророческое возвещение; «вот» естественно и достойно звучит в современном литературном русском.
- source_word: עֵינֵי אֲדֹנָי יְהוִה
  choice: взор Владыки Яхве
  rationale: Собирательное «взор» естественно передаёт еврейский образ направленных глаз и сосредоточенного внимания, не устраняя контекст суда; составной титул сохраняет различие между אֲדֹנָי и именем יהוה.
- source_word: בַּמַּמְלָכָה הַחַטָּאָה
  choice: обращён на грешное царство
  rationale: Предлог при образе глаз указывает на направленность внимания; «грешное царство» кратко и точно передаёт определительное прилагательное.
- source_word: וְהִשְׁמַדְתִּי אֹתָהּ
  choice: и Я уничтожу его
  rationale: Каузативная форма שׁמד обозначает полное разрушение или устранение; «уничтожу» сохраняет силу выражения без уточнения способа.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: с лица земли
  rationale: Устойчивый русский библейский оборот точно передаёт еврейскую пространственную идиому.
- source_word: אֶפֶס כִּי
  choice: Но
  rationale: Сочетание вводит сильное ограничение предшествующего объявления о суде; «но» ясно и естественно выражает этот поворот.
- source_word: לֹא הַשְׁמֵיד אַשְׁמִיד
  choice: Я не уничтожу полностью
  rationale: Инфинитив абсолютный при личной форме усиливает глагольное понятие; под отрицанием речь идёт об отказе от полного истребления, что естественно передано наречием «полностью».
- source_word: אֶת בֵּית יַעֲקֹב
  choice: дом Иакова
  rationale: Традиционное национально-родовое обозначение потомков Иакова сохраняет межтекстовые связи.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Пророческая формула передана современным торжественным глаголом; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה в составном титуле и пророческой формуле
  choice: «Владыка Яхве» и «возвещает Яхве»
  alternative: «Господь Бог» и «говорит Господь»
  rationale: Передача «Яхве» сохраняет личное заветное имя, а «Владыка» отдельно отражает אֲדֹנָי и избегает сочетания «Господь Господь».
- issue: Соотношение суда над царством и сохранения дома Иакова
  choice: Уничтожение грешного царства, но не полное уничтожение дома Иакова
  alternative: Смягчённый суд над домом Иакова без явного отрицания его полного уничтожения
  rationale: Еврейский текст резко сопоставляет объявленное уничтожение царства с отрицанием полного истребления дома Иакова; перевод сохраняет как строгость суда, так и предел этого суда.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис остаётся ясным для широкого читателя; традиционные обороты «с лица земли» и «дом Иакова» сохранены ради достоинства стиля и межтекстовой узнаваемости.
