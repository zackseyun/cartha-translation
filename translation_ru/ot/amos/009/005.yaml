base_translation:
  language: en
  yaml_path: translation/ot/amos/009/005.yaml
  text: And the Lord GOD of hosts is the one who touches the earth[a], and it melts, and all who dwell in it mourn; and all of it rises like the Nile and sinks like the Nile of Egypt.
translation:
  language: ru
  text: Владыка Яхве воинств — Он касается земли[a], и она тает; скорбят все живущие на ней, и вся она поднимается, словно Нил, и опускается, словно египетский Нил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Владыка Яхве воинств касается земли». «Яхве» передаёт личное имя Бога יהוה.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: אֲדֹנָי передано как «Владыка», а личное имя יְהוָה — как «Яхве». Это различает оба элемента составного титула и избегает неясного повторения «Господь ГОСПОДЬ».
- source_word: הַצְּבָאוֹת
  choice: воинств
  rationale: Слово сохраняет широту традиционного библейского титула, не ограничивая его только земными армиями.
- source_word: הַנּוֹגֵעַ
  choice: Он касается
  rationale: Причастие описывает характерное действие Бога. «Касается» передаёт прямое значение נגע, не усиливая его до «поражает»; разрушительное последствие выражено следующим глаголом.
- source_word: בָּאָרֶץ
  choice: земли
  rationale: В контексте теофании и всех живущих на земле אֶרֶץ естественно понимать в широком смысле как «землю», а не только отдельную страну.
- source_word: וַתָּמוֹג
  choice: она тает
  rationale: «Тает» сохраняет яркую метафору распада и утраты устойчивости, присущую מוּג.
- source_word: וְאָבְלוּ
  choice: скорбят
  rationale: Глагол אבל обозначает скорбь и траур вследствие бедствия; «скорбят» звучит естественно и не усиливает значение до вопля.
- source_word: יֹשְׁבֵי בָהּ
  choice: все живущие на ней
  rationale: Формулировка сохраняет глагольный оттенок причастия «живущие» и ясно соотносит местоимение с землёй.
- source_word: וְעָלְתָה כַיְאֹר כֻּלָּהּ
  choice: Вся она поднимается, словно Нил
  rationale: Женский род глагола и местоимения продолжает указывать на землю; יְאֹר в египетском сравнении обозначает Нил.
- source_word: וְשָׁקְעָה
  choice: и опускается
  rationale: «Опускается» сохраняет образ движения вниз и параллель с подъёмом, не сводя значение лишь к сезонному спаду воды.
- source_word: כִּיאֹר מִצְרָיִם
  choice: словно египетский Нил
  rationale: Так ясно обозначен конкретный Нил, связанный с Египтом, при естественном русском порядке слов.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: Транслитерация сохраняет личное заветное имя и позволяет отличить его от предшествующего титула אֲדֹנָי («Владыка»), не создавая повторения двух одинаковых слов.
- issue: Масштаб слова אֶרֶץ
  choice: земля
  alternative: страна
  rationale: Образ всеобщего потрясения, охватывающего всех живущих на ней, допускает и поддерживает космический смысл; при этом исходная образность не конкретизируется сверх текста.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Сохранены повторяющиеся союзы, образ тающей земли и параллельные движения Нила; составной Божий титул передан без конфессионально окрашенного толкования.
