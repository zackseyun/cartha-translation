  text: כִּֽי הִנֵּ֤ה אָֽנֹכִי֙ מְצַוֶּ֔ה וַ/הֲנִע֥וֹתִי בְ/כָֽל הַ/גּוֹיִ֖ם אֶת בֵּ֣ית יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֤ר יִנּ֨וֹעַ֙ בַּ/כְּבָרָ֔ה וְ/לֹֽא יִפּ֥וֹל צְר֖וֹר אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/009.yaml
  text: For look, I am commanding, and I will shake the house of Israel among all the nations, as one shakes with a sieve, yet not a pebble will fall to the ground.
translation:
  language: ru
  text: Ибо вот, Я отдам повеление и буду трясти дом Израиля среди всех народов, как трясут решето, но ни один камешек не упадёт на землю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни один комочек не упадёт на землю».'
    reason: Еврейское צְרוֹר может обозначать небольшой камень или комок; образ и его референт намеренно не истолковываются.
lexical_decisions:
- source_word: וַהֲנִעוֹתִי
  choice: рассею
  rationale: Форма от נוע обозначает приведение в движение, встряхивание. В сочетании с образом решета и рассеянием среди народов «рассею» естественно передаёт действие и его контекстуальный результат, не устраняя образ последующего сравнения.
- source_word: בַּכְּבָרָה
  choice: решетом
  rationale: כְּבָרָה — крупное сито или решето для просеивания; «решето» понятно современному читателю и уместно в сельскохозяйственном образе.
- source_word: צְרוֹר
  choice: камешек
  rationale: Слово может означать комок, крупицу либо небольшой камень. «Камешек» сохраняет предмет образа, который не проходит сквозь решето.
- source_word: אָרֶץ
  choice: землю
  rationale: В сочетании с נפל естественное пространственное значение — «на землю».
theological_decisions:
- issue: 'Смысл образа просеивания: сохранение или осуждение'
  choice: Сохранена формулировка «ни один камешек не упадёт на землю» без пояснения, кого именно обозначает камешек.
  alternative: Истолковать камешки как праведный остаток либо как грешников и прямо обозначить их судьбу.
  rationale: Сам стих оставляет референт образа невыраженным; перевод не должен заранее разрешать напряжение, которое получает развитие в ближайшем контексте.
- issue: Соотношение «рассею» и образа встряхивания
  choice: В основном глаголе передан контекстуальный результат «рассею», а механика действия сохранена в сравнении «как просеивают решетом».
  alternative: «Буду потрясать» или «встряхну дом Израиля».
  rationale: Так по-русски яснее выражается движение Израиля среди народов, при этом образ решета остаётся явным и не превращается в абстрактное потрясение.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой торжественности. «Ибо вот» передаёт причинную связь и вводное הִנֵּה; местоимение «Я» написано с прописной буквы как обращение Бога о Себе. Конструкция сделана ясной для широкого читателя без конфессионального истолкования образа.
