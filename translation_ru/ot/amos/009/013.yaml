base_translation:
  language: en
  yaml_path: translation/ot/amos/009/013.yaml
  text: Behold[a], days are coming, declares Yahweh, when the plowman will overtake the reaper, and the one who treads grapes the one who sows the seed; the mountains will drip sweet wine[c][b], and all the hills will melt.
translation:
  language: ru
  text: Вот, наступают дни, — возвещает Яхве, — когда пахарь настигнет жнеца, а топчущий виноград — сеющего семена[a]. Горы будут источать сладкое вино[b], и все холмы растают[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тянущего (или выводящего) семя»; вероятно, это выражение означает того, кто сеет.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «молодое вино», «свежее вино».'
    reason: lexical_alternative
  - marker: c
    text: Так изображено столь великое изобилие, что одна пора земледельческих работ наступает ещё до окончания предыдущей; «растают» сохраняет необычную метафору еврейского текста.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет пророческий призыв к вниманию и естественно звучит в современном литературном русском.
- source_word: יָמִים בָּאִים
  choice: наступают дни
  rationale: Естественная русская передача устойчивой пророческой формулы о грядущем времени.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт торжественную формулу נְאֻם и сохраняет личное имя יהוה.
- source_word: וְנִגַּשׁ
  choice: настигнет
  rationale: 'В контексте необычайного изобилия выражает наложение земледельческих сезонов: следующая работа начинается прежде завершения предыдущей.'
- source_word: חוֹרֵשׁ ... בַּקֹּצֵר
  choice: пахарь ... жнеца
  rationale: Краткие и конкретные русские обозначения участников сельскохозяйственных работ.
- source_word: וְדֹרֵךְ עֲנָבִים
  choice: топчущий виноград
  rationale: Сохраняет яркий древний образ выжимания винограда ногами.
- source_word: בְּמֹשֵׁךְ הַזָּרַע
  choice: сеющего семена
  rationale: Контекстуально ясная передача буквального «тянущего/выводящего семя», вероятно идиомы посева; буквальность отмечена в сноске.
- source_word: וְהִטִּיפוּ
  choice: будут источать
  rationale: Передаёт образ капания или истечения и по-русски сочетается с поэтическим образом гор.
- source_word: עָסִיס
  choice: молодое вино
  rationale: Обозначает свежий, насыщенный виноградный напиток; сохраняет винодельческий контекст, не сводя значение к простому соку.
- source_word: תִּתְמוֹגַגְנָה
  choice: растают
  rationale: Сохраняет буквальный и намеренно необычный поэтический образ еврейского текста.
theological_decisions:
- issue: Образ грядущего восстановления и изобилия
  choice: Сохранить конкретные гиперболические образы необычайного сельскохозяйственного изобилия.
  alternative: Истолковать их в переводе как исключительно буквальное земледельческое предсказание либо исключительно духовное благословение.
  rationale: Еврейский текст оставляет масштаб и способ исполнения образа открытыми; перевод не должен заранее разрешать этот богословский вопрос.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис остаётся ясным для широкого читателя; личное имя Яхве передано транслитерацией. Поэтическая напряжённость образов «горы источают» и «холмы растают» сохранена без конфессионального истолкования.
