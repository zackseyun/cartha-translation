base_translation:
  language: en
  yaml_path: translation/ot/amos/009/001.yaml
  text: 'I saw the Lord standing beside the altar[a], and he said: Strike the capital, so that the thresholds may shake; shatter them on the heads of all of them. And I will kill their survivors with the sword; not one who flees among them will get away[d][c][b], and not one who escapes among them will be delivered.'
translation:
  language: ru
  text: 'Я видел Господа, стоящего у жертвенника[a], и Он сказал:


    «Ударь по капители[b],

    чтобы задрожали пороги;

    разбей их о головы всех[c].


    А их уцелевших[d]

    Я убью мечом.

    Никто из них не спасётся бегством,

    никто из них не уцелеет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на жертвеннике». Еврейский предлог допускает такое значение; сцена также может изображать Господа стоящим у жертвенника, готовым совершить суд.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть по верхней архитектурной детали; возможные переводы: «по навершию» или «по верху колонны».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейский текст труден; буквально приблизительно: «разбей (или отсеки) их о головы всех». По смыслу части разрушающегося здания поражают находящихся внутри людей.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «их остаток». В данном контексте имеются в виду уцелевшие после первоначального разрушения, а не остаток, которому обещано спасение.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Передаёт божественный титул אֲדֹנָי естественным для русского библейского стиля словом, не смешивая его с особым написанием имени YHWH.
- source_word: נִצָּב עַל הַמִּזְבֵּחַ
  choice: стоящий у жертвенника
  rationale: Причастие обозначает неподвижное положение, а עַל допускает пространственное значение «у, при»; вариант естественен для сцены суда, при этом буквальная альтернатива отмечена в сноске.
- source_word: הַךְ הַכַּפְתּוֹר
  choice: ударь по капители
  rationale: Повеление הַךְ передано энергичным современным глаголом; כַּפְתּוֹר здесь, вероятнее всего, обозначает верхнюю архитектурную деталь святилища.
- source_word: הַסִּפִּים
  choice: пороги
  rationale: Обычное значение существительного; оно сохраняет архитектурный образ сотрясения здания.
- source_word: וּבְצַעַם בְּרֹאשׁ כֻּלָּם
  choice: разбей их над головами у всех
  rationale: Сохраняет трудную конкретную образность еврейского текста — разрушение архитектурных частей над людьми — без молчаливого уточнения того, к чему именно относится местоимение.
- source_word: וְאַחֲרִיתָם
  choice: оставшихся
  rationale: В контексте всеобщего суда речь идёт о тех, кто останется в живых после первоначального разрушения; перевод не придаёт слову положительного богословского оттенка «остатка».
- source_word: לֹא יָנוּס לָהֶם נָס וְלֹא יִמָּלֵט לָהֶם פָּלִיט
  choice: Никто из них не убежит, ни один из них не ускользнёт
  rationale: Передаёт параллелизм и настойчивое отрицание любой возможности бегства естественными русскими выражениями.
theological_decisions:
- issue: Божественный титул в пророческом видении
  choice: Господь
  alternative: Владыка
  rationale: אֲדֹנָי представляет Бога как полновластного Судью. «Господь» — естественное русское соответствие титулу; оно не оформлено как особая передача тетраграмматона.
- issue: Значение «оставшихся» в сцене суда
  choice: оставшиеся в живых после обрушения
  alternative: остаток как богословски положительная группа
  rationale: Непосредственный контекст говорит об их гибели от меча, поэтому здесь слово не следует наделять надеждой или значением спасённого остатка.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным пророческим звучанием. Поэтическая разбивка сохраняет параллелизм речи суда. Термины «жертвенник», «капитель» и «пороги» удерживают архитектурную конкретность; более понятные варианты для редкого слова «капитель» даны в сноске.
