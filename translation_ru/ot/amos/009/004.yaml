  yaml_path: translation/ot/amos/009/004.yaml
  text: And if they go into captivity before their enemies[a], from there I will command the sword, and it will kill them; and I will set my eyes on them for harm and not for good.
translation:
  language: ru
  text: И если они пойдут в плен к своим врагам, то и оттуда Я повелю мечу, и он убьёт их. Я устремлю на них Свой взор во вред им, а не во благо им[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к беде, а не ко благу». Еврейское רָעָה здесь означает беду, пагубу или карающее бедствие, а не нравственное зло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: И если
  rationale: Сохраняет соединительную силу וְ и вводит очередное условие в последовательности неотвратимых судов.
- source_word: יֵלְכוּ בַשְּׁבִי
  choice: они пойдут в плен
  rationale: Передаёт глагол движения הלך и состояние плена, не заменяя активную форму источника пассивным «будут уведены».
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: перед своими врагами
  rationale: Сохраняет пространственно-властный образ нахождения перед лицом врагов; возвратное «своими» естественно передаёт притяжательный суффикс.
- source_word: מִשָּׁם
  choice: и оттуда
  rationale: Указывает, что даже место плена не укрывает их от суда; частица «и» естественно передаёт контекстуальное усиление.
- source_word: אֲצַוֶּה אֶת־הַחֶרֶב
  choice: Я повелю мечу
  rationale: Сохраняет олицетворение меча как исполнителя Божьего повеления и звучит естественно по-русски.
- source_word: וַהֲרָגָתַם
  choice: и он убьёт их
  rationale: Форма женского рода в еврейском согласуется с существительным «меч»; русское местоимение явно сохраняет меч как действующее лицо образа.
- source_word: וְשַׂמְתִּי עֵינִי עֲלֵיהֶם
  choice: Я обращу на них Свой взор
  rationale: Естественно и образно передаёт направленное Божье внимание, не сводя идиому сразу к отвлечённому понятию суда.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: им во вред, а не во благо
  rationale: Передаёт контраст неблагоприятного суда и благополучия, избегая ложного впечатления, будто речь идёт о нравственном зле со стороны Бога.
theological_decisions:
- issue: Значение רָעָה применительно к Божьему действию
  choice: им во вред
  alternative: на бедствие; во зло
  rationale: В данном контексте слово обозначает пагубное последствие или карающее бедствие, а не нравственное зло. Выбранная формулировка сохраняет суровый смысл суда, не внося неуместного богословского вывода.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Олицетворение меча и образ обращённого взора сохранены; архаизмы и конфессионально окрашенные уточнения не вводились.
