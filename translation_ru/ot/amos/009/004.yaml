  source_fidelity: 'В целом смысл передан точно: сохранены условная конструкция, плен, продолжающееся из плена действие суда, олицетворённый меч и направленный на них взгляд для бедствия, а не блага. Однако «перед своими врагами» в данном русском контексте звучит как пространственное расположение и неестественно передаёт идиому לִפְנֵי אֹיְבֵיהֶם; «к своим врагам» яснее выражает пленение врагами, не добавляя нового смысла.'
