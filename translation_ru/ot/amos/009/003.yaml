  text: וְ/אִם יֵחָֽבְאוּ֙ בְּ/רֹ֣אשׁ הַ/כַּרְמֶ֔ל מִ/שָּׁ֥ם אֲחַפֵּ֖שׂ וּ/לְקַחְתִּ֑י/ם וְ/אִם יִסָּ֨תְר֜וּ מִ/נֶּ֤גֶד עֵינַ/י֙ בְּ/קַרְקַ֣ע הַ/יָּ֔ם מִ/שָּׁ֛ם אֲצַוֶּ֥ה אֶת הַ/נָּחָ֖שׁ וּ/נְשָׁכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/003.yaml
  text: And if they hide themselves on the summit of Carmel[a], from there I will search them out and take them; and if they conceal themselves from before my eyes on the floor of the sea, from there I will command the serpent[b], and it will bite them.
translation:
  language: ru
  text: И если они спрячутся на вершине Кармила, оттуда Я разыщу их и возьму; и если они укроются от Моих глаз на дне моря[a], оттуда Я прикажу змею[b], и он укусит их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на почве (грунте) моря».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «змее». Еврейское слово может быть передано как «змей» или «змея».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵחָבְאוּ
  choice: спрячутся
  rationale: Нифаль от חבא в данном контексте передаёт намеренную попытку скрыться; возвратный русский глагол выражает это естественно.
- source_word: בְּרֹאשׁ הַכַּרְמֶל
  choice: на вершине Кармила
  rationale: רֹאשׁ здесь обозначает верхнюю точку; «вершина» сохраняет пространственный образ, а топоним передан без добавления отсутствующего в еврейском тексте слова «гора».
- source_word: אֲחַפֵּשׂ
  choice: разыщу
  rationale: Пиэль от חפשׂ указывает на тщательный поиск; «разыщу» передаёт не только поиски, но и их неизбежный результат в контексте суда.
- source_word: וּלְקַחְתִּים
  choice: и возьму
  rationale: לקח имеет широкое значение «брать». Буквально широкая передача не уточняет способ задержания сверх исходного текста.
- source_word: יִסָּתְרוּ
  choice: укроются
  rationale: Выбор сохраняет смысл סתר и одновременно различает два близких глагола сокрытия в стихе.
- source_word: מִנֶּגֶד עֵינַי
  choice: от Моих глаз
  rationale: Естественное русское выражение сохраняет конкретный антропоморфный образ Божьих глаз, не превращая его в отвлечённое пояснение.
- source_word: בְּקַרְקַע הַיָּם
  choice: на дне моря
  rationale: קַרְקַע обозначает почву, грунт или нижнюю поверхность; «дно моря» естественно передаёт местный образ по-русски.
- source_word: אֲצַוֶּה
  choice: Я прикажу
  rationale: Точно передаёт צוה и прямое утверждение власти Говорящего над существом.
- source_word: הַנָּחָשׁ
  choice: змею
  rationale: נחשׁ может обозначать змею или змея; форма «змей» поддерживает возвышенный пророческий регистр и согласуется с последующим местоимением мужского рода.
- source_word: וּנְשָׁכָם
  choice: и он ужалит их
  rationale: נשׁך означает укус змеи; «ужалит» — обычное современное русское обозначение такого нападения, а «он» ясно указывает на единственное число подлежащего.
theological_decisions:
- issue: Божественное всеведение и неотвратимость суда, выраженные антропоморфно
  choice: Сохранить конкретное выражение «от Моих глаз».
  alternative: 'Передать отвлечённо: «из виду» или «от Моего взора».'
  rationale: Так сохраняется образность еврейского текста и утверждение, что никакое место не находится вне Божьего поиска и суда, без добавления богословских пояснений.
- issue: Продолжение прямой Божьей речи без названия Говорящего в самом стихе
  choice: Оставить формы первого лица «Я разыщу», «возьму», «Я прикажу».
  alternative: Добавить для ясности «Господь».
  rationale: Еврейский стих продолжает речь из контекста, но сам не повторяет Божье имя; его добавление вышло бы за пределы текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм двух условных конструкций сохранён. Заглавные буквы в местоимениях первого лица отмечают божественного Говорящего по принятой русской библейской традиции, не добавляя Его имени.
