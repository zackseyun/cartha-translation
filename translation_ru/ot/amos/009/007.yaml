source:
  edition: WLC
  text: הֲ/ל֣וֹא כִ/בְנֵי֩ כֻשִׁיִּ֨ים אַתֶּ֥ם לִ֛/י בְּנֵ֥י יִשְׂרָאֵ֖ל נְאֻם יְהוָ֑ה הֲ/ל֣וֹא אֶת יִשְׂרָאֵ֗ל הֶעֱלֵ֨יתִי֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/פְלִשְׁתִּיִּ֥ים מִ/כַּפְתּ֖וֹר וַ/אֲרָ֥ם מִ/קִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/007.yaml
  text: Are you not like the Cushites to me[a], O sons of Israel? declares Yahweh. Did I not bring up Israel from the land of Egypt, and the Philistines from Caphtor[c][b], and Aram from Kir?
translation:
  language: ru
  text: «Разве вы для Меня не как кушиты,[a] сыны Израиля? — возвещает Яхве. — Разве не Я вывел Израиль из земли Египта, филистимлян — из Кафтора,[b] арамеев — из Кира?»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как эфиопы». Буквально в еврейском тексте — «кушиты», то есть народ Куша.'
    reason: lexical_alternative
  - marker: b
    text: Кафтор — географическое название, которое многие традиционно связывают с Критом, хотя его точное местонахождение остаётся предметом споров.
    reason: cultural_note
lexical_decisions:
- source_word: הֲלוֹא
  choice: Не таковы ли / Не Я ли
  rationale: Риторический вопрос предполагает утвердительный ответ; русские конструкции сохраняют его прямоту и естественное звучание.
- source_word: כִבְנֵי כֻשִׁיִּים
  choice: как кушиты
  rationale: כ выражает сравнение, а בְּנֵי перед этнонимом обозначает представителей народа. «Кушиты» непосредственно передаёт древний этногеографический термин, не отождествляя его безоговорочно с поздней Эфиопией.
- source_word: אַתֶּם לִי
  choice: вы для Меня
  rationale: Дательный לִי передаёт отношение с точки зрения Яхве; буквальная и естественная русская формулировка не сужает смысл до одного лишь «в Моих глазах».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранены обращение, национальное обозначение и грамматически мужская форма исходного текста.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная современная передача устойчивой пророческой формулы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией.
- source_word: הֶעֱלֵיתִי
  choice: вывел
  rationale: В контексте переселения народов каузатив глагола עלה естественно передаётся по-русски как «вывел»; форма применяется ко всем трём параллельным сообщениям.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохранено прямо названное в еврейском тексте слово «земля» и торжественный библейский регистр без архаической грамматики.
- source_word: פְלִשְׁתִּיִּים
  choice: филистимлян
  rationale: Общепринятый русский этноним.
- source_word: כַּפְתּוֹר
  choice: Кафтор
  rationale: Топоним транслитерирован, поскольку его точное отождествление остаётся спорным.
- source_word: אֲרָם
  choice: арамеев
  rationale: В синтаксическом параллелизме с Израилем и филистимлянами здесь естественно понимать название как обозначение народа; возможная передача названием страны отмечена в решениях.
- source_word: קִיר
  choice: Кир
  rationale: Собственное географическое название передано транслитерацией.
theological_decisions:
- issue: Смысл сопоставления Израиля с кушитами
  choice: 'Сравнение оставлено прямым: перед Яхве Израиль сопоставлен с другим народом, а последующие примеры распространяют Его владычество над переселениями на другие народы.'
  alternative: Понимать сравнение исключительно как указание на географическое переселение, не затрагивающее особого положения Израиля.
  rationale: Риторический вопрос о кушитах и параллельный ряд исходов разных народов намеренно создают богословское напряжение. Перевод не снимает его пояснением или смягчением.
- issue: Референт אֲרָם
  choice: арамеев
  alternative: Арам
  rationale: Хотя форма может называть и страну, и народ, параллель с «Израиль» и «филистимляне» поддерживает обозначение народа. При этом перевод не вводит более позднее название «Сирия».
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: народ Израиля / дети Израиля
  rationale: Сохранены мужская форма и обращение исходного текста; национальный смысл остаётся понятным из контекста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм трёх народов сохранён с помощью тире и подразумеваемого глагола «вывел». Личное имя передано как «Яхве». Все подстрочные маркеры присутствуют в основном тексте и расположены при соответствующих словам.
