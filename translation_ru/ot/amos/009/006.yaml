base_translation:
  language: en
  yaml_path: translation/ot/amos/009/006.yaml
  text: He who builds his upper chambers in the heavens[a], and has founded his vault upon the earth[b], who calls for the waters of the sea and pours them out upon the face of the earth—Yahweh is his name.
translation:
  language: ru
  text: 'Он возводит в небесах Свои чертоги[a]

    и утверждает Свой свод на земле[b];

    Он призывает воды моря

    и изливает их на поверхность земли —

    Яхве — имя Его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Свои восхождения» или «Свои ступени». Еврейское слово может обозначать высоты, лестницы, ступени или верхние помещения; здесь оно, вероятно, относится к возвышенным небесным сооружениям.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Свою связку», «Свою конструкцию» или «Свой купол». Еврейское слово обозначает нечто связанное или скреплённое воедино и здесь употреблено в образе устройства мира.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנֶה
  choice: Он возводит
  rationale: Субстантивированное причастие qal описывает Яхве через характерное для Него действие. Настоящее время естественно передаёт причастную форму и сохраняет торжественное описание.
- source_word: מַעֲלוֹתָיו
  choice: Свои горние чертоги
  rationale: Слово может обозначать подъёмы, ступени или верхние помещения. В данном космологическом и архитектурном образе «горние чертоги» естественно указывает на возвышенные небесные сооружения, не устраняя лексической неоднозначности, отмеченной в сноске.
- source_word: וַאֲגֻדָּתוֹ
  choice: Свой свод
  rationale: Существительное связано с представлением о чём-либо связанном или скреплённом воедино. В космической архитектурной образности «свод» передаёт цельную конструкцию, не превращая образ в современное научное описание.
- source_word: יְסָדָהּ
  choice: основывает
  rationale: Глагол יסד означает «основывать, закладывать основание, утверждать». В русском настоящем времени он согласован с окружающими причастными описаниями; объектом по грамматическому роду служит «связка/конструкция» (אֲגֻדָּה), переданная словом «свод».
- source_word: הַקֹּרֵא לְמֵי הַיָּם
  choice: Он призывает воды моря
  rationale: Причастие с לְ выражает властный призыв вод к действию. «Призывает» сохраняет прямой образ и звучит естественно и достойно.
- source_word: וַיִּשְׁפְּכֵם
  choice: и изливает их
  rationale: שפך значит «лить, изливать». «Изливает» сохраняет интенсивный образ и возвышенный регистр.
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: на поверхность земли
  rationale: Естественная русская передача еврейской идиомы «на лицо земли», сохраняющая пространственный смысл без неестественной буквальности.
- source_word: יְהוָה שְׁמוֹ
  choice: Яхве имя Ему
  rationale: Личное имя יהוה передано русской формой «Яхве», а именная конструкция сохранена как кульминационное провозглашение в торжественном порядке слов.
theological_decisions:
- issue: Космологическая образность מַעֲלוֹתָיו и אֲגֻדָּתוֹ
  choice: 'Сохранить архитектурно-космические образы: «горние чертоги» и «свод».'
  alternative: Передать буквально как «ступени/восхождения» и «связка» либо истолковательно как «небесный дворец» и «купол».
  rationale: Стих прославляет Бога как Творца и Владыку мира посредством древней архитектурной образности. Перевод не подменяет её ни деревянной буквальностью, ни современной космологией; реальные лексические альтернативы вынесены в сноски.
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя יהוה. Транслитерационная форма «Яхве» сохраняет личное заветное имя, а не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным поэтическим звучанием. Параллельные строки отражают синтаксический ритм еврейского текста. Заглавные местоимения при обращении к Богу поддерживают принятый в русском библейском стиле уважительный регистр; тире выделяет заключительное провозглашение имени.
