  text: בַּ/חֶ֣רֶב יָמ֔וּתוּ כֹּ֖ל חַטָּאֵ֣י עַמִּ֑/י הָ/אֹמְרִ֗ים לֹֽא תַגִּ֧ישׁ וְ/תַקְדִּ֛ים בַּעֲדֵ֖י/נוּ הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/010.yaml
  text: By the sword all the sinners of my people will die—those who say, ‘The disaster will not overtake us or come against us.’
translation:
  language: ru
  text: 'От меча погибнут все грешники моего народа — те, кто говорит: «Бедствие не постигнет нас и не обрушится на нас».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּחֶרֶב
  choice: От меча
  rationale: Естественная русская передача орудия или причины насильственной смерти; сохраняет образ суда через меч.
- source_word: יָמוּתוּ
  choice: погибнут
  rationale: В данном контексте смерти от меча глагол «погибнут» звучит естественно и точно.
- source_word: כֹּל חַטָּאֵי עַמִּי
  choice: все грешники Моего народа
  rationale: Сохраняет всеобщность כֹּל, нравственно-религиозный смысл חַטָּאֵי и принадлежность народа говорящему Богу.
- source_word: תַגִּישׁ
  choice: настигнет
  rationale: Передаёт приближение бедствия вплотную и его достижение адресатов; согласуется с отрицательной самоуверенностью говорящих.
- source_word: וְתַקְדִּים בַּעֲדֵינוּ
  choice: и не приблизится к нам
  rationale: Передаёт трудное сочетание глагола со значением предварения/выхода навстречу и предлога בַּעֲדֵינוּ без излишне узкого толкования.
- source_word: הָרָעָה
  choice: Беда
  rationale: В пророческом контексте обозначает надвигающееся бедствие, а не нравственное зло.
theological_decisions:
- issue: Кого обозначают «грешники Моего народа»
  choice: Сохранено прямое обозначение части Божьего народа как грешников
  alternative: «грешные среди Моего народа»
  rationale: Еврейская конструкция непосредственно говорит «все грешники Моего народа» и подчёркивает, что принадлежность к народу не устраняет ответственности.
- issue: Уверенность грешников в недосягаемости суда
  choice: 'Сохранены два параллельных глагольных выражения: «не настигнет» и «не приблизится»'
  alternative: 'Свести их к одному: «не постигнет нас»'
  rationale: Двойная формулировка оригинала усиливает самоуверенное отрицание приближающегося бедствия и не должна сглаживаться.
translation_notes:
  register: Современный литературный русский язык с пророческой торжественностью. Синтаксис краткий и выразительный; прямая речь и образ меча сохранены. Заглавная буква в «Моего» указывает на речь Бога и соответствует принятой русской библейской типографике.
