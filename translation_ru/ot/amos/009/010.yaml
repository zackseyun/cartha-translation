    rationale: '«Не приблизится к нам» выражает лишь приближение, тогда как וְתַקְדִּים בַּעֲדֵינוּ в данном контексте имеет направленный против адресатов оттенок: бедствие не придёт/не выступит против них. Нужна передача, сохраняющая этот оттенок без чрезмерного толкования.'
  - severity: low
    issue: «Беда» менее терминологически точна, чем «бедствие»
    rationale: הָרָעָה здесь обозначает грядущее несчастье/суд, а не бытовую неприятность; «бедствие» лучше выдерживает пророческий регистр.
  - severity: low
