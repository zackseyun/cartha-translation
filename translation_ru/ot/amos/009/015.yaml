  text: וּ/נְטַעְתִּ֖י/ם עַל אַדְמָתָ֑/ם וְ/לֹ֨א יִנָּתְשׁ֜וּ ע֗וֹד מֵ/עַ֤ל אַדְמָתָ/ם֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם אָמַ֖ר יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/015.yaml
  text: I will plant them on their land[a], and they will never again be uprooted from the land that I have given them, says Yahweh your God.
translation:
  language: ru
  text: Я посажу их на их земле, и больше их не вырвут с земли, которую Я дал им, — говорит Яхве, твой Бог.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «твой Бог» (единственное число); это можно понимать как обращение к Израилю как к единому народу. Вариант «их Бог» сглаживает смену числа.
    reason: alternative_reading
lexical_decisions:
- source_word: וּנְטַעְתִּים
  choice: Я посажу их
  rationale: Сохраняет буквальный образ насаждения, который далее продолжается глаголом «вырваны» и выражает прочность восстановления.
- source_word: עַל אַדְמָתָם
  choice: на их земле
  rationale: אַדָמָה может означать почву, землю или территорию; здесь «земля» естественно передаёт контекст возвращения и сохраняет притяжательный суффикс.
- source_word: וְלֹא יִנָּתְשׁוּ עוֹד
  choice: и уже не будут они вырваны
  rationale: Страдательная форма נתש означает «быть вырванным, искоренённым»; «вырваны» сохраняет связь с образом насаждения и не добавляет отсутствующего в тексте усиления «никогда».
- source_word: מֵעַל אַדְמָתָם
  choice: из своей земли
  rationale: Русское «из земли» идиоматично передаёт מֵעַל в сочетании с глаголом удаления; возвратное «своей» естественно соотносит землю с подлежащим во множественном числе.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: которую Я дал им
  rationale: Еврейский перфект естественно передаётся русским прошедшим временем; фраза сохраняет прямое указание на дар Бога.
- source_word: אָמַר יְהוָה
  choice: говорит Яхве
  rationale: Настоящее время естественно для русской пророческой формулы, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Масоретский текст содержит суффикс второго лица мужского рода единственного числа. Смена числа сохранена, а не сглажена до «их Бог».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: Текст содержит собственное заветное имя Бога; «Яхве» прямо его передаёт, не заменяя титулом.
- issue: Число местоимения в אֱלֹהֶיךָ
  choice: твой Бог
  alternative: их Бог
  rationale: Несмотря на формы множественного числа ранее в стихе, еврейский текст здесь обращается во втором лице единственного числа. Эта напряжённость сохранена; возможное понимание как обращения к Израилю как единому народу поясняется в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Синтаксическая инверсия «не будут они» поддерживает достоинство формулы и ясность отрицательного обещания; метафора насаждения и вырывания сохранена.
