id: AMO.9.14
reference: Amos 9:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/שַׁבְתִּי֮ אֶת שְׁב֣וּת עַמִּ֣/י יִשְׂרָאֵל֒ וּ/בָנ֞וּ עָרִ֤ים נְשַׁמּוֹת֙ וְ/יָשָׁ֔בוּ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/שָׁת֖וּ אֶת יֵינָ֑/ם וְ/עָשׂ֣וּ גַנּ֔וֹת וְ/אָכְל֖וּ אֶת פְּרִי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/014.yaml
  text: I will restore the fortunes of my people Israel[a], and they will rebuild ruined cities and inhabit them; they will plant vineyards and drink their wine; they will make gardens and eat their fruit.
translation:
  language: ru
  text: Я восстановлю благополучие моего народа Израиля[a], и они отстроят опустошённые города и поселятся в них, насадят виноградники и будут пить вино из своих виноградников, разведут сады и будут есть их плоды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верну пленных из моего народа Израиля»; возможно также: «восстановлю пленение моего народа Израиля». Еврейское выражение может означать как возвращение из плена, так и более широкое избавление от бедствия и восстановление благополучия.'
    reason: Сохраняет смысловую широту еврейской формулы שׁוּב שְׁבוּת и её возможный оттенок возвращения из плена, не выдавая один из вариантов за несомненный смысл.
lexical_decisions:
- source_word: וְשַׁבְתִּי אֶת שְׁבוּת
  choice: Я восстановлю благополучие
  rationale: Устойчивое выражение שׁוּב שְׁבוּת обозначает перемену бедственного положения и может также подразумевать возвращение из плена. «Восстановлю благополучие» естественно передаёт широкий смысл последующего восстановления, не устраняя более узкий оттенок, отмеченный в сноске.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: Моего народа Израиля
  rationale: Сохраняет заветное обозначение и естественно передаёт приложение без искусственной пунктуационной паузы.
- source_word: וּבָנוּ עָרִים נְשַׁמּוֹת
  choice: Они отстроят опустошённые города
  rationale: Хотя בנה буквально означает «строить», контекст уже разрушенных городов требует естественного русского «отстроят». נְשַׁמּוֹת передано как «опустошённые», что сохраняет образ мест, приведённых в запустение.
- source_word: וְיָשָׁבוּ
  choice: поселятся в них
  rationale: ישׁב здесь означает жить, обитать. «Поселятся» естественно сочетается с восстановленными городами и передаёт возобновление постоянной жизни в них.
- source_word: וְנָטְעוּ כְרָמִים
  choice: насадят виноградники
  rationale: Традиционное и при этом понятное современному читателю сочетание для посадки виноградников; сохраняет возвышенный библейский регистр.
- source_word: וְשָׁתוּ אֶת יֵינָם
  choice: будут пить вино из них
  rationale: Суффикс относится к виноградникам. Русское «вино из них» яснее, чем формально возможное «их вино», и передаёт пользование плодами своего труда.
- source_word: וְעָשׂוּ גַנּוֹת
  choice: разведут сады
  rationale: עשה буквально «сделают», но по-русски сады естественно «разводят»; это точно передаёт создание и возделывание садов.
- source_word: וְאָכְלוּ אֶת פְּרִיהֶם
  choice: будут есть их плоды
  rationale: Суффикс относится к садам; «плоды» прямо и естественно передаёт פְּרִי и сохраняет параллель с виноградниками.
theological_decisions:
- issue: Передача формулы восстановления שׁוּב שְׁבוּת
  choice: восстановлю благополучие
  alternative: верну пленников / возвращу из плена
  rationale: Еврейская формула допускает как широкое изменение бедственного положения, так и конкретный мотив возвращения из плена. Контекст восстановления городов и земледельческой жизни поддерживает широкое основное прочтение; возможный мотив плена сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет последовательность образов восстановления, а лексика остаётся понятной обычному читателю.
