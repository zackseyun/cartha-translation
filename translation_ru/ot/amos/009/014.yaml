  source_fidelity: 'Основной смысл передан точно: Бог обещает изменить бедственное положение Израиля, после чего народ восстановит опустошённые города, будет жить в них и пользоваться плодами виноградников и садов. «Восстановлю благополучие» приемлемо передаёт широкое значение формулы שׁוּב שְׁבוּת; сноска обоснованно сохраняет возможный смысл возвращения из плена.'
