  terminology: «Опустошённые города», «насадят виноградники», «разведут сады» и «плоды» уместны. В сноске альтернативу следует сформулировать так, чтобы она действительно отражала варианты еврейской формулы, не создавая впечатления, что в тексте прямо названо возвращение всего народа.
