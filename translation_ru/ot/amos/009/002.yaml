source:
  edition: WLC
  text: אִם יַחְתְּר֣וּ בִ/שְׁא֔וֹל מִ/שָּׁ֖ם יָדִ֣/י תִקָּחֵ֑/ם וְ/אִֽם יַעֲלוּ֙ הַ/שָּׁמַ֔יִם מִ/שָּׁ֖ם אוֹרִידֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/002.yaml
  text: Though they dig into Sheol[a], from there my hand will take them; and though they climb up to the heavens, from there I will bring them down.
translation:
  language: ru
  text: Даже если они прокопают ход в Шеол[a], оттуда моя рука возьмёт их; и даже если они взойдут на небеса, оттуда я спущу их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могилу» или «мир мёртвых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְתְּרוּ
  choice: пророются
  rationale: Глагол חתר обозначает рытьё или прокладывание пути подкопом. «Пророются» сохраняет конкретный образ намеренной попытки проникнуть в недоступную глубину.
- source_word: בִשְׁאוֹל
  choice: в Шеол
  rationale: Транслитерация сохраняет особое древнееврейское обозначение мира мёртвых и не сужает его до отдельной могилы.
- source_word: יָדִי
  choice: моя рука
  rationale: Буквальный образ передаёт неотвратимую досягаемость и силу Бога, не заменяя антропоморфизм отвлечённым объяснением.
- source_word: תִּקָּחֵם
  choice: возьмёт их
  rationale: Нейтрально и прямо передаёт широкий смысл לקח, сохраняя при этом грозный контекст Божьего суда без усиления до «схватит».
- source_word: יַעֲלוּ
  choice: взойдут
  rationale: Передаёт направленное движение вверх и подходит к возвышенному поэтическому контексту, не добавляя отсутствующего в оригинале способа подъёма.
- source_word: הַשָּׁמַיִם
  choice: небеса
  rationale: Естественное русское соответствие еврейской форме и космическая противоположность Шеолу.
- source_word: אוֹרִידֵם
  choice: я спущу их
  rationale: Передаёт каузативное значение формы от ירד — заставить спуститься, привести вниз — без добавочного оттенка насильственного низвержения.
- source_word: אִם ... וְאִם
  choice: даже если ... и даже если
  rationale: В контексте это уступительные условия, подчёркивающие бесполезность любой попытки скрыться, а не нейтральные предположения.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: Шеол
  alternative: могила; мир мёртвых
  rationale: Шеол и небеса образуют космические крайности, показывающие невозможность уйти от Божьего суда. Транслитерация не сводит понятие к месту погребения и не наполняет его более поздним догматическим содержанием.
translation_notes:
  register: Современный литературный русский с сохранением лаконичной пророческой поэзии и параллелизма. Местоимения, относящиеся к Богу, даны со строчной буквы согласно обычной современной издательской норме; «Шеол» оставлен как транслитерированный термин и пояснён в сноске.
