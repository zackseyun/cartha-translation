  text: בַּ/יּ֣וֹם הַ/ה֔וּא אָקִ֛ים אֶת סֻכַּ֥ת דָּוִ֖יד הַ/נֹּפֶ֑לֶת וְ/גָדַרְתִּ֣י אֶת פִּרְצֵי/הֶ֗ן וַ/הֲרִֽסֹתָי/ו֙ אָקִ֔ים וּ/בְנִיתִ֖י/הָ כִּ/ימֵ֥י עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/011.yaml
  text: In that day I will raise up the fallen shelter of David[a], and I will wall up its breaches[c][b], and I will raise up its ruins and rebuild it as in the days of old.
translation:
  language: ru
  text: В тот день Я воздвигну павший шатёр Давида[a], заделаю его проломы[b], подниму его развалины и отстрою его, как в древние дни[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шалаш Давида»; традиционно: «скиния Давида». Еврейское слово обозначает временное укрытие и здесь образно представляет павший дом или династию Давида.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «закрою его бреши», «восстановлю разрушенные места». В еврейском тексте местоименный суффикс буквально имеет форму «их», но по смыслу относится к разрушенному сооружению.'
    reason: textual_ambiguity
  - marker: c
    text: То есть как в прежние, давние времена; слово עוֹלָם здесь не обязательно означает вечность в отвлечённом смысле.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Устойчивое пророческое указание на время; сохраняет торжественный регистр, не уточняя сроки сверх сказанного в тексте.
- source_word: אָקִים
  choice: Я воздвигну / подниму
  rationale: Каузативная форма от קום передаёт действие «поставить, поднять, воздвигнуть». Разные русские соответствия позволяют сохранить конкретный образ и естественность при повторении глагола.
- source_word: סֻכַּת דָּוִיד
  choice: шатёр Давида
  rationale: סֻכָּה — шалаш, хижина или временное укрытие. «Шатёр» сохраняет образ непрочного сооружения и при этом звучит естественно и достойно; «скиния» могла бы привнести культовые ассоциации, а «дом Давида» был бы истолковывающей заменой метафоры.
- source_word: הַנֹּפֶלֶת
  choice: павший
  rationale: Причастие буквально может означать «падающий», но в контексте последующего восстановления естественно описывает уже обрушившееся состояние сооружения.
- source_word: וְגָדַרְתִּי
  choice: заделаю
  rationale: Глагол גדר означает ограждать, огораживать или закрывать стеной. С дополнением «проломы» русское «заделаю» естественно передаёт восстановление разрушенных участков, сохраняя строительный образ.
- source_word: פִּרְצֵיהֶן
  choice: его проломы
  rationale: פֶּרֶץ обозначает пролом или брешь. В еврейском местоименный суффикс имеет форму множественного числа женского рода, однако по смыслу речь идёт о проломах разрушенного сооружения; в русском связь передана естественным единственным числом.
- source_word: וַהֲרִסֹתָיו
  choice: его развалины
  rationale: Существительное обозначает разрушенные места или руины. «Развалины» ясно и естественно продолжает образ восстановления.
- source_word: וּבְנִיתִיהָ
  choice: и отстрою его
  rationale: Буквально — «и построю её», но контекст разрушения требует по-русски значения повторного строительства. Мужской род обусловлен выбранным словом «шатёр».
- source_word: כִּימֵי עוֹלָם
  choice: как в древние дни
  rationale: עוֹלָם здесь указывает на давнее прошлое, а не обязательно на абстрактную вечность. Перевод сохраняет сравнение с прежними временами.
theological_decisions:
- issue: К чему относится образ «шатра Давида»
  choice: Сохранён конкретный образ павшего шатра, подразумевающий униженное и разрушенное состояние Давидова царского дома или правления.
  alternative: Передать прямо как «династия Давида», понимать как буквальный культовый шатёр либо обобщить до всего Израиля.
  rationale: Текст связывает обещанное восстановление с Давидом, но выражает это метафорой непрочного сооружения. Перевод не превращает метафору в готовое династическое, культовое или мессианское толкование.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранены строительная метафора, повтор действия «поднять/воздвигнуть» и отсылка к древнему прошлому; избегается культово окрашенное «скиния» в основном тексте.
