  text: so that they may possess the remnant of Edom and all the nations who are called by my name,” declares Yahweh[b][a], who does this.
translation:
  language: ru
  text: чтобы они овладели остатком Эдома и всеми народами, названными Моим именем[a], — возвещает Яхве, совершающий это.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «над которыми названо Моё имя». Эта еврейская идиома выражает принадлежность Яхве или то, что Он заявляет на них Своё право.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая форма этого стиха, приведённая в Деян 15:17, заметно отличается: «чтобы остальные люди взыскали Господа, и все народы, над которыми названо Моё имя» (приблизительная передача).'
    reason: textual_variant
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое или результативное значение союза и естественно связывает стих с обещанным восстановлением в предыдущем контексте.
- source_word: יִירְשׁוּ
  choice: овладели
  rationale: Глагол ירשׁ обозначает вступление во владение или обладание. «Овладели» естественно сочетается с Эдомом и народами и сохраняет оттенок завладения, не сводя выражение к имущественному наследованию.
- source_word: שְׁאֵרִית
  choice: остатком
  rationale: Сохраняет важный для пророческой речи образ того, что осталось после суда.
- source_word: אֱדוֹם
  choice: Эдома
  rationale: Устоявшаяся русская форма названия народа и страны; родительный падеж обусловлен управлением слова «остаток».
- source_word: וְכָל הַגּוֹיִם
  choice: и всеми народами
  rationale: גּוֹיִם означает народы за пределами Израиля; «народы» шире и нейтральнее конфессионально окрашенного «язычники».
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  choice: названными Моим именем
  rationale: Естественно передаёт еврейскую пассивную идиому принадлежности и притязания Яхве, а её буквальный пространственный образ сохранён в примечании.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Ясная и достойная передача пророческой формулы; личное имя יהוה передано как «Яхве», а не заменено титулом.
- source_word: עֹשֶׂה זֹּאת
  choice: совершающий это
  rationale: Причастная конструкция представляет Яхве как Того, Кто осуществляет обещанное; русский оборот сохраняет активную и декларативную силу оригинала без навязывания временного уточнения.
theological_decisions:
- issue: Отношение восстановленного Израиля к Эдому и другим народам
  choice: 'Сохранить прямую формулировку масоретского текста: «овладели остатком Эдома и всеми народами».'
  alternative: 'Передать стих в соответствии с греческой формой, отражённой в Деян 15:17: «чтобы остальные люди взыскали Господа».'
  rationale: Еврейский текст WLC прямо говорит об овладении остатком Эдома и народами, названными именем Яхве. Основной текст не следует гармонизировать с греческой традицией; различие отмечено в сноске, благодаря чему сохраняется напряжение между судом, восстановлением и включением народов.
- issue: Смысл выражения о народах, над которыми названо имя Яхве
  choice: 'Передать идиоматически: «названными Моим именем».'
  alternative: 'Буквально: «над которыми названо Моё имя».'
  rationale: Идиома указывает на принадлежность Яхве или на то, что Он заявляет на них Своё право. Перевод не уточняет далее характер этой принадлежности и тем самым не вносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краток и ясен; слово «остаток» сохраняет библейскую образность. Личное имя יהוה последовательно передано как «Яхве». Заглавная буква в «Моим» указывает на речь Бога, не изменяя смысла оригинала.
