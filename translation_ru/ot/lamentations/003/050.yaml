lexical_decisions:
- source_word: עַד
  choice: пока не
  rationale: Передаёт временной предел продолжающегося состояния, описанного в предыдущем стихе, и естественно сочетается с русским отрицанием при обозначении ожидаемого события.
- source_word: יַשְׁקִיף
  choice: взглянет вниз
  rationale: Глагол в породе hифиль обозначает взгляд с высоты вниз; перевод сохраняет вертикальный образ, поддержанный словами «с небес».
- source_word: וְיֵרֶא
  choice: и не увидит
  rationale: Сохраняет отдельный глагол ראה и парную конструкцию исходного текста, не сводя два действия к одному.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: מִשָּׁמָיִם
  choice: с небес
  rationale: Естественно передаёт еврейское שָׁמַיִם и сохраняет образ небес как места, откуда Яхве смотрит вниз.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо употреблён тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
