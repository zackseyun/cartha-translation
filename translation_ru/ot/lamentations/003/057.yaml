  yaml_path: translation/ot/lamentations/003/057.yaml
  text: You came near on the day I called to you; you said[a], “Do not fear.”
translation:
  language: ru
  text: 'Ты приблизился в тот день, когда я воззвал к Тебе; Ты сказал: «Не бойся».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרַבְתָּ
  choice: Ты приблизился
  rationale: Форма qal perfect, 2-е лицо мужского рода единственного числа, обращённая в контексте к Богу. «Приблизился» естественно передаёт конкретный образ близости, не уточняя его сверх текста.
- source_word: בְּיוֹם
  choice: в тот день, когда
  rationale: Предлог ב с יוֹם имеет временное значение. Русская конструкция «в тот день, когда» сохраняет образ дня и при этом ясно связывает его с последующим призывом.
- source_word: אֶקְרָאֶךָּ
  choice: я воззвал к Тебе
  rationale: Форма от קרא, 1-е лицо единственного числа с суффиксом 2-го лица мужского рода. В молитвенно-поэтическом контексте «воззвал» естественно выражает обращённый к Богу призыв; прошедшее время согласовано с повествованием о пережитом.
- source_word: אָמַרְתָּ
  choice: Ты сказал
  rationale: Прямое и обычное соответствие глаголу אמר, сохраняющее переход к прямой речи.
- source_word: אַל
  choice: не
  rationale: Запретительная частица перед формой imperfect/jussive; в русском повелительном обороте передаётся отрицанием «не».
- source_word: תִּירָא
  choice: бойся
  rationale: Форма 2-го лица мужского рода единственного числа от ירא после אַל. Оборот «Не бойся» кратко и точно передаёт запрет или ободрение без усиления.
theological_decisions:
- issue: Адресат и говорящий
  choice: 'Стих передан как прямое обращение к Богу: «Ты приблизился… Ты сказал».'
  alternative: Безличное или неопределённо-личное понимание («кто-то приблизился») грамматически менее вероятно в данном контексте.
  rationale: Формы глаголов 2-го лица мужского рода единственного числа ясно указывают на одного адресата; в окружающей молитве им является Бог. Перевод сохраняет непосредственность обращения, не добавляя иных богословских утверждений.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Заглавная буква в местоимении «Тебе/Ты» служит принятой русской формой почтительного обращения к Богу. Точка с запятой сохраняет две тесно связанные части стиха; прямая речь оформлена современными русскими кавычками.
