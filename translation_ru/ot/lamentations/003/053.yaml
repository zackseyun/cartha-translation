  text: צָֽמְת֤וּ בַ/בּוֹר֙ חַיָּ֔/י וַ/יַּדּוּ אֶ֖בֶן בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/053.yaml
  text: They silenced my life in the pit[a], and threw a stone at me.
translation:
  language: ru
  text: Они погубили мою жизнь в яме[a] и бросили в меня камень.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и бросили на меня камень»; возможно, имеется в виду, что яму закрыли камнем, а не просто бросили камень в узника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָמְתוּ
  choice: погубили
  rationale: Глагол обозначает прекращение, уничтожение или отсечение. В сочетании с «мою жизнь» русское «погубили» естественно передаёт угрозу смерти, не утверждая непременно, что смерть уже наступила.
- source_word: בַבּוֹר
  choice: в яме
  rationale: בּוֹר может означать яму, водосборник или темничную яму. Общее «яма» сохраняет образ и не навязывает более узкого архитектурного значения.
- source_word: חַיַּי
  choice: мою жизнь
  rationale: Форма множественного числа с суффиксом первого лица идиоматически означает «моя жизнь».
- source_word: וַיַּדּוּ
  choice: бросили
  rationale: Глагол означает «бросать, метать»; «бросили» ясно и естественно в современном русском языке.
- source_word: אֶבֶן
  choice: камень
  rationale: Единственное число передано прямо; в русском после глагола неопределённость не требует отдельного показателя.
- source_word: בִּי
  choice: в меня
  rationale: Предлог ב может обозначать направленное враждебное действие или соприкосновение. «Бросили в меня камень» — естественное русское выражение; возможность значения «на меня/надо мной» сохранена в примечании.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым ритмом плача. Выражение «погубили мою жизнь» сохраняет смысл прекращения жизни и не вводит неестественную для русского буквальность вроде «заставили умолкнуть мою жизнь».
