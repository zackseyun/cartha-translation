lexical_decisions:
- source_word: לְעַוֵּת
  choice: лишать… правосудия
  rationale: Пиэль от עוה означает искажать, извращать правое; в сочетании с упоминанием судебной тяжбы современное русское юридическое выражение ясно передаёт смысл.
- source_word: אָדָם
  choice: человека
  rationale: Существительное обозначает отдельного человека, участвующего в разбирательстве; русское «человека» естественно и не вносит лишнего уточнения пола.
- source_word: בְּרִיבוֹ
  choice: в его тяжбе
  rationale: רִיב здесь имеет юридический смысл спора, тяжбы или судебного дела; «в его тяжбе» сохраняет и правовой оттенок, и местоименную связь.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Обычная русская передача божественного титула אֲדֹנָי.
- source_word: לֹא רָאָה
  choice: не видит
  rationale: Сохранён прямой смысл глагола ראה и значение общего утверждения в данном контексте; возможный переносный смысл неодобрения указан в примечании.
theological_decisions:
- issue: Означает ли לֹא רָאָה отсутствие восприятия или неодобрение
  choice: 'Сохранить буквальную зрительную идиому: «Господь этого не видит».'
  alternative: «Господь этого не одобряет» или «неужели Господь этого не видит?»
  rationale: В еврейском тексте стоит глагол «видеть». Ближайший контекст допускает смысл «смотреть с одобрением», однако явное внесение этого толкования в основной текст устранило бы смысловое и богословское напряжение. Вопросительная интерпретация также возможна по контексту, но формально не обозначена.
translation_notes:
  register: Современный литературный русский язык; судебная лексика ясна и dignified, а буквальная идиома «не видит» сохранена с пояснением возможного переносного смысла.
