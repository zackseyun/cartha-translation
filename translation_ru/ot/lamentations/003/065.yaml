  yaml_path: translation/ot/lamentations/003/065.yaml
  text: You will give them hardness of heart[b][a]; your curse will be upon them.
translation:
  language: ru
  text: Ты дашь им ожесточение сердца[a][b]; Твоё проклятие будет на них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дай им ожесточение сердца — Твоё проклятие им». Еврейская форма глагола может выражать здесь молитвенное пожелание.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «покрытие (или щит) сердца». Выражение редкое; «ожесточение сердца» передаёт его вероятный смысл в данном контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתֵּן
  choice: Ты дашь
  rationale: Форма qal imperfect 2-го лица мужского рода единственного числа от נתן обращена к Богу. Будущее время сохраняет как предсказательный, так и молитвенно-заклинательный оттенок контекста.
- source_word: מְגִנַּת לֵב
  choice: ожесточение сердца
  rationale: Редкое и трудное выражение, буквально связанное с образом покрытия или щита сердца. В данном контексте оно, вероятнее всего, обозначает отрицательное внутреннее состояние — нечувствительность или ожесточённость; выбранный вариант естественен по-русски и соответствует параллели с проклятием.
- source_word: תַּאֲלָתְךָ
  choice: Твоё проклятие
  rationale: Слово обозначает проклятие, в том числе проклятие, связанное с клятвой. «Проклятие» — ясный и точный современный русский эквивалент.
- source_word: לָהֶם ... לָהֶם
  choice: им ... на них
  rationale: Повтор предлога указывает на одних и тех же получателей суда. Во второй части «на них» естественно сочетается с русским выражением «проклятие будет на них».
theological_decisions:
- issue: Молитвенное пожелание или предсказание
  choice: Ты дашь им… Твоё проклятие будет на них
  alternative: Дай им ожесточение сердца — Твоё проклятие им
  rationale: Еврейский имперфект допускает и будущее утверждение, и пожелание в молитве о суде. Основной текст сохраняет торжественную форму будущего времени, а альтернативная молитвенная сила отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем плача-молитвы. Местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксически необходимая связка «будет» добавлена во второй части для естественности русского текста.
