  text: גַּ֣ם כִּ֤י אֶזְעַק֙ וַ/אֲשַׁוֵּ֔עַ שָׂתַ֖ם תְּפִלָּתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/008.yaml
  text: Even when I cry out and call for help[a], he shuts out my prayer.
translation:
  language: ru
  text: Даже когда я взываю и молю о помощи, он преграждает моей молитве путь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Хотя я взываю и кричу о помощи, он не пропускает моей молитвы».'
    reason: 'Лексико-синтаксическая альтернатива: גַּם כִּי допускает уступительное «хотя», שׁוע — «кричу о помощи», а שׂתם может быть передано как «не пропускает», то есть препятствует молитве.'
lexical_decisions:
- source_word: גַּם כִּי
  choice: Даже когда
  rationale: 'Сочетание имеет уступительный оттенок: несмотря на вопль говорящего, молитва остаётся преграждённой. «Даже когда» естественно передаёт этот смысл по-русски, не исключая возможного перевода «хотя».'
- source_word: אֶזְעַק
  choice: я взываю
  rationale: Глагол обозначает сильный крик в бедствии; «взываю» сохраняет напряжённость и уместно в контексте молитвенного плача.
- source_word: וַאֲשַׁוֵּעַ
  choice: и молю о помощи
  rationale: Форма глагола שׁוע выражает настойчивую просьбу о помощи. Такой перевод отличает его от предшествующего זעק и сохраняет параллелизм.
- source_word: שָׂתַם
  choice: преграждает путь
  rationale: Глагол значит «затыкать, перекрывать, преграждать». В сочетании с молитвой выражение «преграждает путь» естественно передаёт образ препятствия, не утверждая сверх текста, что молитва не услышана.
- source_word: תְּפִלָּתִי
  choice: моей молитве
  rationale: Существительное прямо означает «молитва»; дательный падеж обусловлен естественным русским сочетанием «преграждать путь чему-либо».
theological_decisions:
- issue: Неявное подлежащее при שָׂתַם
  choice: Сохранить местоимение «он», не добавляя «Бог» или «Господь».
  alternative: Явно назвать Бога либо употребить безличную/страдательную конструкцию.
  rationale: В еврейском тексте стоит глагол 3-го лица мужского рода единственного числа без названного подлежащего. Контекст указывает на референта, но сохранение «он» передаёт лаконичность стиха и не вносит отсутствующего здесь божественного имени.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для плача. «Взываю» сохраняет возвышенно-молитвенный оттенок, а «молю о помощи» остаётся понятным современному читателю. Образ преграждённого пути передаёт конкретность еврейского שׂתם.
