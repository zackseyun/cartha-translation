  text: אוֹתִ֥/י נָהַ֛ג וַ/יֹּלַ֖ךְ חֹ֥שֶׁךְ וְ/לֹא אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/002.yaml
  text: He has driven me and made me walk in darkness and not light[a].
translation:
  language: ru
  text: Он погнал меня и заставил идти во тьме, а не в свете.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он вёл меня и заставил идти во тьме, а не в свете».'
    reason: 'Лексическая альтернатива: נָהַג может означать как «гнать», так и более нейтральное «вести».'
lexical_decisions:
- source_word: אוֹתִי
  choice: меня
  rationale: Частица прямого дополнения с суффиксом первого лица единственного числа естественно передаётся русским местоимением «меня».
- source_word: נָהַג
  choice: гнал
  rationale: Глагол может означать «вести», «гнать», «направлять»; в контексте плача «гнал» передаёт принуждение и тяжесть переживаемого действия, сохраняя при этом возможную альтернативу в сноске.
- source_word: וַיֹּלַךְ
  choice: заставлял идти
  rationale: Каузативная форма от הלך указывает на побуждение или принуждение к движению; «заставлял идти» ясно сохраняет эту каузативность.
- source_word: חֹשֶׁךְ
  choice: во тьме
  rationale: Существительное означает «тьма»; предложная форма естественна по-русски и соответствует обстоятельственному употреблению в строке.
- source_word: וְלֹא אוֹר
  choice: а не в свете
  rationale: Противительный союз «а» естественно выражает резкий контраст между тьмой и светом; повтор предлога нужен для ясности русского синтаксиса, хотя в еврейском выражение эллиптично.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным, мрачным поэтическим ритмом. Несовершенный вид «гнал… заставлял» представляет действия как разворачивающийся опыт страдания; явный субъект «Он» сохраняет связь с контекстом. Контраст «во тьме, а не в свете» передан естественно, без устранения образной напряжённости оригинала.
