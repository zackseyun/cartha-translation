  text: It is good for a man that he bear the yoke in his youth[a][b].
translation:
  language: ru
  text: Благо человеку нести ярмо в юности[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мужчине»; здесь еврейское слово мужского рода употреблено в обобщающем смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «взять на себя ярмо»; образ означает принятие и перенесение бремени или дисциплины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Благо
  rationale: Кратко и достойно передаёт начальную предикативную оценку «хорошо / благо», сохраняя поэтический строй плача.
- source_word: לַגֶּבֶר
  choice: человеку
  rationale: גֶּבֶר обозначает мужчину, нередко с оттенком зрелости или силы, но здесь изречение имеет обобщающий смысл. Русское «человеку» естественно передаёт родовое употребление; буквальная форма отмечена в сноске.
- source_word: כִּי
  choice: не выражено отдельным словом
  rationale: כִּי вводит содержание того, что является благом. Русская конструкция «благо человеку нести» естественно передаёт эту синтаксическую связь без отдельного союза.
- source_word: יִשָּׂא
  choice: нести
  rationale: נשא значит «поднимать, нести, переносить». В сочетании с «ярмом» глагол «нести» сохраняет как предметный образ, так и смысл принятия и выдерживания бремени.
- source_word: עֹל
  choice: ярмо
  rationale: Сохраняется конкретная метафора עֹל, а не заменяется более общим словом «бремя».
- source_word: בִּנְעוּרָיו
  choice: в юности
  rationale: Форма обозначает период молодости; «в юности» — точное, краткое и естественное русское соответствие.
theological_decisions:
- issue: Обобщающее мужское обозначение
  choice: человеку ... в юности
  alternative: мужчине ... в его юности
  rationale: Еврейский текст имеет существительное мужского рода גֶּבֶר и местоименный суффикс 3-го лица мужского рода, однако сентенция контекстуально носит общий характер. Основной текст передаёт этот общий смысл естественным русским языком, а формальная мужская маркировка сохраняется в сноске.
- issue: Смысл образа ярма
  choice: сохранить метафору без уточнения её содержания
  alternative: нести бремя наказания или воспитания
  rationale: Сам стих не определяет ярмо однозначно как наказание, страдание, труд или дисциплину. Перевод сохраняет богословскую и образную открытость исходного текста.
translation_notes:
  register: Современный литературный русский с краткой, афористичной и поэтически достойной формой. «Благо» соответствует высокому, но понятному регистру книги; «ярмо» сохраняет традиционный и прозрачный библейский образ.
