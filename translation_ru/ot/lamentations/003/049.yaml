lexical_decisions:
- source_word: עֵינִי
  choice: Глаз мой
  rationale: Сохранены единственное число и суффикс первого лица; поэтический образ глаза как источника плача естественен и понятен по-русски.
- source_word: נִגְּרָה
  choice: источает слёзы
  rationale: Глагол נגר передаёт течение или струение вниз. Добавление слова «слёзы», подразумеваемого контекстом, позволяет естественно передать образ по-русски, поскольку буквальное «глаз течёт» звучало бы неестественно.
- source_word: וְלֹא תִדְמֶה
  choice: и не унимается
  rationale: דמה здесь может означать «затихать», «останавливаться», «переставать». «Не унимается» сохраняет образ непрекращающегося плача и отчасти оттенок отсутствия покоя.
- source_word: מֵאֵין הֲפֻגוֹת
  choice: без передышки
  rationale: Оборот указывает на полное отсутствие паузы, ослабления или облегчения. Единственное число в русском устойчивом выражении естественно передаёт смысл еврейской формы множественного числа.
