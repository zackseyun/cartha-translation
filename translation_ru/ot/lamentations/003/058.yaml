  text: Ты вступился за меня[a], Господи; Ты искупил мою жизнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к буквальному: «Ты отстоял дело моей души»; возможно также: «Ты отстоял мою жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבְתָּ
  choice: отстоял
  rationale: Форма от ריב в сочетании с רִיבֵי передаёт ведение судебного спора или защиту чьего-либо дела. «Отстоял» естественно выражает успешное заступничество в юридическом образе и соответствует завершённому действию.
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Божественный титул передан русской звательной формой «Господи», поскольку в еврейском тексте это прямое обращение.
- source_word: רִיבֵי
  choice: дело
  rationale: 'Множественное число от רִיב здесь имеет собирательный смысл: тяжбы, спорное дело, притязания говорящего. В современном русском естественно единственное число «дело».'
- source_word: נַפְשִׁי
  choice: моё
  rationale: נֶפֶשׁ может означать душу, жизнь, самого человека. В выражении о судебном деле естественное русское «моё дело» передаёт принадлежность дела говорящему, а буквальный образ отмечен в сноске; перевод «жизнь» здесь также стирал бы различие со вторым полустишием.
- source_word: גָּאַלְתָּ
  choice: искупил
  rationale: 'גאל означает действие избавителя или родственника-искупителя: выкупить, вернуть, освободить. «Искупил» сохраняет образ искупления и не сводит его к общему «спас».'
- source_word: חַיָּי
  choice: мою жизнь
  rationale: Форма множественного числа идиоматически обозначает жизнь. В русском языке естественный эквивалент — «мою жизнь».
theological_decisions:
- issue: Сохранение разных образов в двух полустишиях
  choice: В первом полустишии сохранён судебный образ («отстоял моё дело»), во втором — образ искупления («искупил мою жизнь»).
  alternative: 'Передать оба действия общими словами об избавлении, например: «защитил меня и спас мою жизнь».'
  rationale: В еврейском тексте употреблены разные корни — ריב и גאל. Их разграничение сохраняет поэтическое и богословское напряжение текста, не уточняя сверх сказанного, каким именно образом совершено искупление.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным звучанием. Форма «Господи» естественно передаёт прямое обращение; параллелизм и различие судебного и искупительного образов сохранены.
