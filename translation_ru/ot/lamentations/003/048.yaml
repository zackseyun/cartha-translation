  text: 'Потоки вод текут из глаз моих

    из-за разорения дочери народа моего[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гибели», «разрушения» или «крушения».'
    reason: lexical_alternative
  - marker: b
    text: «Дочь народа моего» — древнееврейское поэтическое выражение, олицетворяющее народ, нередко Сион или Иудею, как дочь.
    reason: cultural_note
lexical_decisions:
- source_word: פַּלְגֵי מַיִם
  choice: потоки вод
  rationale: Сохраняет яркую поэтическую метафору обильных слёз и передаёт значение русел или потоков без усиления до «бурных потоков».
- source_word: תֵּרַד
  choice: льются
  rationale: Форма глагола ירד буквально обозначает движение вниз; применительно к слезам естественное русское «льются» передаёт и направление, и непрерывность плача.
- source_word: עֵינִי
  choice: из глаз моих
  rationale: Хотя еврейская форма морфологически единственного числа, здесь она естественно понимается собирательно; множественное число соответствует русскому словоупотреблению.
- source_word: עַל
  choice: из-за
  rationale: Предлог обозначает причину плача. «Из-за» ясно выражает причинную связь, не добавляя идеи обвинения.
- source_word: שֶׁבֶר
  choice: сокрушение
  rationale: Слово может обозначать разрушение, крушение или бедствие. «Сокрушение» сохраняет образ сломанности и допускает как гибельное разорение, так и состояние народа после катастрофы.
- source_word: בַּת עַמִּי
  choice: дочери народа моего
  rationale: Буквально сохраняет древнееврейское поэтическое олицетворение общины как дочери и не сводит его без необходимости только к городу или территории.
theological_decisions:
- issue: Кого обозначает выражение «дочь народа моего»
  choice: Сохранено поэтическое выражение без уточнения конкретного референта.
  alternative: Передать как «мой народ», «Сион» или «Иудея».
  rationale: Контекст допускает олицетворение народа, а также связанного с ним Сиона/Иудеи; явное уточнение устранило бы подлинную образность и неоднозначность текста.
translation_notes:
  register: Современный литературный русский с сохранением возвышенного плачевого параллелизма. Инверсия «из глаз моих» и «народа моего» придаёт строке достоинство и поэтическую цельность, оставаясь понятной современному читателю.
