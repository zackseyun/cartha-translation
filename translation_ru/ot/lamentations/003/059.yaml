lexical_decisions:
- source_word: רָאִיתָה
  choice: Ты видел
  rationale: Форма Qal перфекта, 2-е лицо мужского рода единственного числа, прямо обращённая к Богу. Прошедшее время сохраняет грамматический вид исходного текста и подразумевает, что увиденное по-прежнему имеет значение для нынешней мольбы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул. Форма «Яхве» общепонятна в современной русской библейской речи.
- source_word: עַוָּתָתִי
  choice: какую несправедливость мне причинили
  rationale: Существительное обозначает искажение, неправду или несправедливость. Контекст судебной мольбы показывает, что речь идёт не о проступке говорящего, а о причинённой ему несправедливости.
- source_word: שָׁפְטָה
  choice: рассуди
  rationale: Повелительная форма от שׁפט выражает просьбу к Богу выступить судьёй. «Рассуди» естественно передаёт судебный образ, не предрешая явно благоприятный исход.
- source_word: מִשְׁפָּטִי
  choice: моё дело
  rationale: מִשְׁפָּט здесь обозначает судебное дело, тяжбу или притязание. Сочетание «рассуди моё дело» естественно для современного русского языка и сохраняет юридический смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Значение עַוָּתָתִי
  choice: несправедливость, причинённая говорящему
  alternative: моя неправда
  rationale: 'Контекст жалобы на притеснителей и последующая просьба рассудить дело поддерживают объектное значение: говорящий претерпел несправедливость. Вариант «моя неправда» мог бы ошибочно прозвучать как признание собственной вины.'
- issue: Судебный смысл שָׁפְטָה מִשְׁפָּטִי
  choice: рассуди моё дело
  alternative: защити мою правоту
  rationale: Основной вариант сохраняет юридическую метафору и не делает явным тот благоприятный приговор, которого просит говорящий; альтернативный вариант передаёт подразумеваемую просьбу об оправдании, но более истолкователен.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной интонацией молитвенного обращения. Судебная образность оригинала сохранена без архаизмов; обращение «Яхве» выделено запятыми.
