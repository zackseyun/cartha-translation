lexical_decisions:
- source_word: הֵבִיא
  choice: вонзил
  rationale: Каузативная форма глагола בוא буквально означает «ввёл, заставил войти». В образе стрел, проникающих в тело, «вонзил» естественно и точно передаёт направленное насильственное действие.
- source_word: בְּכִלְיוֹתָי
  choice: мне в почки
  rationale: כִּלְיָה буквально означает «почка» и может обозначать внутреннее существо человека. Здесь телесный образ поражения стрелами делает конкретное анатомическое значение наиболее вероятным; конструкция «мне в почки» естественна по-русски.
- source_word: בְּנֵי אַשְׁפָּתוֹ
  choice: стрелы из своего колчана
  rationale: Буквально выражение означает «сыновья его колчана», то есть находящиеся в колчане стрелы. В основном тексте смысл передан ясным современным русским выражением, а необычная еврейская метафора сохранена в сноске.
theological_decisions:
- issue: Написание местоимения, относящегося к Богу
  choice: своего — со строчной буквы
  alternative: Своего — с прописной буквы
  rationale: В еврейском тексте особого графического почтительного выделения нет. Строчная буква соответствует нормам современного литературного русского языка и не добавляет к исходному тексту конфессиональной типографической традиции.
translation_notes:
  register: Современный литературный русский язык с сохранением резкого телесного образа оригинала. Необычный еврейский оборот разъяснён в сноске, чтобы основной текст оставался понятным и поэтически выразительным.
