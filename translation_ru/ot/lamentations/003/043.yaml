  text: Ты окутал Себя гневом[a] и преследовал нас; Ты убил и не пощадил[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально употреблено слово «нос», которое в древнееврейском языке служит устойчивым обозначением гнева. Возможный перевод: «во гневе».'
    reason: lexical_alternative
