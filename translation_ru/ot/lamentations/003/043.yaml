lexical_decisions:
- source_word: סַכֹּתָה
  choice: окутал Себя
  rationale: Глагол סכך означает «покрывать, укрывать». Возвратное по смыслу «окутал Себя» сохраняет образ окружающего покрова и соответствует ближайшему контексту.
- source_word: בָאַף
  choice: гневом
  rationale: אַף буквально означает «нос», но устойчиво употребляется в значении «гнев». Творительный падеж естественно передаёт здесь то, чем говорящий окутал Себя.
- source_word: וַתִּרְדְּפֵנוּ
  choice: и преследовал нас
  rationale: רדף обычно означает настойчиво гнаться или преследовать. «Преследовал нас» прямо передаёт смысл без привнесения более узкого значения религиозного гонения.
- source_word: הָרַגְתָּ
  choice: Ты убивал
  rationale: הרג — обычный глагол со значением «убивать». Несовершенный вид по-русски естественно описывает действие суда над народом и позволяет сохранить краткость фразы без искусственного объекта.
- source_word: לֹא חָמָלְתָּ
  choice: не щадя
  rationale: חמל может означать «щадить» или «проявлять сострадание». Деепричастный оборот «не щадя» кратко и выразительно передаёт сопутствующий характер действия.
theological_decisions:
- issue: Прямое обращение к Богу в плаче, приписывающее Ему преследование и убийство
  choice: Сохранить резкое обращение во втором лице без смягчения
  alternative: «Ты допустил, чтобы нас преследовали» или «казалось, Ты убивал без жалости»
  rationale: Еврейский текст прямо приписывает действия адресату. Жанр плача допускает столь смелую речь к Богу; перевод не должен устранять заложенное в тексте богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтической краткости и резкости плача. Местоимение «Себя» написано с прописной буквы как относящееся к Богу; синтаксис остаётся ясным для широкого круга читателей.
