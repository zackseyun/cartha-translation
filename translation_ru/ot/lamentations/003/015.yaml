  yaml_path: translation/ot/lamentations/003/015.yaml
  text: He has filled me with bitterness[a]; he has made me drink wormwood.
translation:
  language: ru
  text: Он насытил меня горечью, напоил меня полынью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׂבִּיעַנִי
  choice: насытил меня
  rationale: 'Порода hiphil глагола שׂבע означает «насытить, дать вдоволь». Русское «насытил» естественно передаёт полноту и в данном контексте не устраняет мрачной иронии: человека насытили горечью.'
- source_word: בַמְּרוֹרִים
  choice: горечью
  rationale: Форма множественного числа от מרור обозначает горькое, горести или горечь. Собирательное «горечью» звучит по-русски естественно и сохраняет метафору тяжёлого страдания, не сужая её до конкретных горьких трав.
- source_word: הִרְוַנִי
  choice: напоил меня
  rationale: Порода hiphil глагола רוה может означать «напоить вдоволь», «пропитать», «оросить». При дополнении «полынью» вариант «напоил меня» сохраняет конкретный образ питья и хорошо соответствует параллельной первой строке.
- source_word: לַעֲנָה
  choice: полынью
  rationale: לענה — полынь, растение с резко горьким вкусом, служащее образом мучительной горечи. Буквальный образ сохранён вместо обобщающих «горечь» или «желчь».
