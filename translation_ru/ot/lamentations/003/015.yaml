  source_fidelity: «Он насытил меня горечью, напоил меня полынью» точно передаёт оба глагола Hiphil и образный параллелизм еврейского текста. «Насытил ... горечью» уместно передаёт הִשְׂבִּיעַנִי בַמְּרוֹרִים, а «напоил ... полынью» сохраняет конкретный растительный образ לַעֲנָה и допустимый смысл הִרְוַנִי («напоил вдоволь; пропитал»).
