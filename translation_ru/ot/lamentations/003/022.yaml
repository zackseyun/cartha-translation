  text: По милости Господа мы не погибли[a], ибо Его милости не иссякли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Некоторые еврейские рукописи и древние переводы поддерживают иной вариант: «Милость Господа не прекращается». При таком чтении подлежащим является «милость», а первый глагол читается иначе.'
    reason: textual_alternative
lexical_decisions:
- source_word: חַסְדֵי יְהוָה
  choice: милости Господа
  rationale: Множественная форма может обозначать многократные проявления верной, неизменной любви; русское «милости» естественно передаёт как расположение, так и его конкретные проявления. Имя יהוה по принятой русской библейской традиции передано как «Господь».
- source_word: כִּי לֹא תָמְנוּ
  choice: мы не погибли
  rationale: В огласованном масоретском тексте תָמְנוּ — форма первого лица множественного числа. «Не погибли» естественно выражает здесь мысль о том, что говорящие не были окончательно уничтожены, не устраняя отмеченную в сноске текстуальную альтернативу.
- source_word: כִּי לֹא כָלוּ
  choice: потому что ... не иссякает
  rationale: Второе כִּי вводит основание предыдущего утверждения, а отрицательная форма глагола говорит, что сострадание Господа не истощилось и не прекратилось.
- source_word: רַחֲמָיו
  choice: Его сострадание
  rationale: Еврейская множественная форма выражает полноту и повторяемость милосердных проявлений; собирательное русское единственное число «сострадание» звучит естественно и сохраняет смысл.
theological_decisions:
- issue: Подлежащее и синтаксис первой части стиха
  choice: По милости Господа мы не погибли.
  alternative: Милость Господа не прекращается.
  rationale: Главный текст следует огласованной масоретской форме תָמְנוּ, то есть первому лицу множественного числа. Засвидетельствованное рядом рукописей и древними переводами чтение, при котором подлежащим становится милость Господа, сохранено в сноске как значимая текстуальная альтернатива.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным поэтическим звучанием. Синтаксис сохраняет две причинные связи еврейского текста; значимая текстуальная неоднозначность вынесена в сноску.
