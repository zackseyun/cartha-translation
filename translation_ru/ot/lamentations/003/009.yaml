  text: גָּדַ֤ר דְּרָכַ/י֙ בְּ/גָזִ֔ית נְתִיבֹתַ֖/י עִוָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/009.yaml
  text: He has walled in my ways with hewn stone[c][b][a]; he has made my paths crooked.
translation:
  language: ru
  text: Он заградил мои пути тёсаным камнем[a], искривил мои тропы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обработанным камнем».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «исказил мои тропы» или «сделал мои тропы кривыми».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַר
  choice: заградил
  rationale: Глагол означает «ограждать, обносить стеной, преграждать». «Заградил» естественно сочетается с тёсаным камнем и передаёт образ намеренно возведённой преграды, не сужая его до буквального окружения стеной.
- source_word: דְּרָכַי
  choice: мои пути
  rationale: «Пути» сохраняет как пространственный, так и переносный смысл существительного и поддерживает поэтический параллелизм со словом «тропы».
- source_word: בְּגָזִית
  choice: тёсаным камнем
  rationale: גָּזִית обозначает обработанный, обтёсанный камень. Этот вариант ясен современному читателю и подчёркивает прочность и преднамеренность преграды.
- source_word: נְתִיבֹתַי
  choice: мои тропы
  rationale: Существительное обозначает тропу или стезю; «тропы» звучит естественно и сохраняет отличие от более широкого «пути» в первой строке.
- source_word: עִוָּה
  choice: искривил
  rationale: Глагол означает «искривлять, изгибать, искажать». «Искривил» сохраняет конкретный образ нарушенного пути и не привносит нравственного смысла.
