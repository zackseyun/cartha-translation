  text: יֵשֵׁ֤ב בָּדָד֙ וְ/יִדֹּ֔ם כִּ֥י נָטַ֖ל עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/028.yaml
  text: Let him sit alone and be silent[a], for he has laid it on him.
translation:
  language: ru
  text: Пусть он сидит в одиночестве и молчит, ибо он возложил это на него[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо это было возложено на него». В еврейском тексте прямо не выражены ни субъект действия, ни предмет, который был возложен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: Пусть он сидит
  rationale: Форма имперфекта в контексте последовательности наставлений имеет побудительное значение; конструкция «пусть он сидит» естественно передаёт этот оттенок.
- source_word: בָּדָד
  choice: один
  rationale: Передаёт состояние уединения и одиночества просто, естественно и без излишней книжности.
- source_word: וְיִדֹּם
  choice: и молчит
  rationale: Глагол דמם может означать молчание или неподвижность; в данном контексте «молчит» ясно выражает спокойное принятие страдания, не исключая оттенка безмолвной неподвижности.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для предшествующего наставления; «потому что» ясно передаёт причинную связь.
- source_word: נָטַל עָלָיו
  choice: это возложено на него
  rationale: Активная еврейская конструкция буквально указывает, что некто возложил нечто на него, однако подлежащее и прямое дополнение не названы. Русская безлично-пассивная формулировка сохраняет эту недосказанность и остаётся естественной.
theological_decisions:
- issue: Неявные субъект и объект при נָטַל
  choice: «это возложено на него» — деятель не назван, а возложенное обозначено нейтральным «это»
  alternative: «Господь возложил это на него»; «он возложил на него бремя»; «он несёт это на себе»
  rationale: В еврейском тексте деятель и предмет возложения прямо не названы. Перевод не отождествляет деятеля с Господом и не уточняет, что именно было возложено, сохраняя смысловую и богословскую напряжённость оригинала.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная и достойная формулировка. Пассивная конструкция выбрана не для ослабления действия, а для сохранения подлинной неопределённости еврейского текста.
