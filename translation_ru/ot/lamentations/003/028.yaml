revisions:
- from: Пусть он сидит один и молчит, потому что это возложено на него[a].
  to: Пусть он сидит в одиночестве и молчит, ибо он возложил это на него[a].
  rationale: 'Правка восстанавливает активный характер еврейского глагола при сохранении намеренной неопределённости: местоимения «он» и «это» не отождествляют деятеля и возложенное с какими-либо конкретными лицом или обстоятельством. Сноска фиксирует возможную русскую пассивную передачу, но не вносит слово «бремя» и не подменяет невыраженный субъект словом «некто».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:20:24Z'
review_pass:
  verdict: revise
  source_fidelity: Начальная побудительная конструкция точно передаёт два последовательных еврейских имперфекта/юссива. Однако «это возложено на него» заменяет активную глагольную форму נָטַל («он возложил / положил») пассивной статической конструкцией и тем самым несколько ослабляет действие оригинала. Русское «он возложил это на него» позволяет сохранить активный залог, не называя референта субъекта и предмет возложения.
  naturalness: «Пусть он сидит в одиночестве и молчит» — естественная современная литературная формулировка. «Ибо он возложил это на него» также естественно звучит в сдержанном библейском регистре.
  terminology: «В одиночестве» адекватно передаёт בָּדָד. «Возложил» уместно для נָטַל עַל в данном контексте и не конкретизирует характер возложенного. В сноске не следует добавлять «бремя» как будто это выражено в еврейском тексте.
  issues:
  - severity: medium
    issue: Активная форма נָטַל передана пассивной конструкцией «это возложено на него».
    rationale: Хотя пассив помогает не называть деятеля, в оригинале стоит активный глагол с невыраженным субъектом. Активная русская конструкция с местоимением сохраняет и действие, и неопределённость референтов.
  - severity: medium
    issue: Сноска предлагает «некто возложил на него бремя».
    rationale: «Некто» излишне сужает невыраженный субъект, а «бремя» добавляет объект, которого в еврейской фразе нет. Альтернативная формулировка должна отмечать невыраженность обоих элементов, а не заполнять их.
  revised_text: Пусть он сидит в одиночестве и молчит, ибо он возложил это на него[a].
