  text: Да, он весь день снова и снова обращает против меня свою руку[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поистине, против меня он вновь обращает свою руку весь день». В еврейском тексте стоят два следующих друг за другом глагола со значениями «возвращаться» и «поворачивать/обращать»; их можно передать более буквально или как указание на повторяющееся действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Только
  rationale: В начале стиха частица подчёркивает исключительную направленность враждебного действия на говорящего; в связи с בִּי естественно передаётся сочетанием «Только на меня». Возможен и усилительный смысл «Поистине», отражённый в сноске.
- source_word: בִּי
  choice: на меня
  rationale: Предлог ב с местоименным суффиксом при описании враждебного действия указывает на его направленность против говорящего; по-русски метафора «обращает руку на меня» естественно сохраняет этот смысл.
- source_word: יָשֻׁב יַהֲפֹךְ
  choice: снова и снова обращает
  rationale: Последовательность двух глаголов со значениями возвращения и поворачивания допускает итеративное понимание. Русское «снова и снова обращает» передаёт повторяемость, сохраняя образ следующего существительного «рука».
- source_word: יָדוֹ
  choice: свою руку
  rationale: Сохраняется конкретный древнееврейский образ руки как орудия действия и силы; возвратное «свою» естественно для русского языка при подлежащем «он».
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Естественная современная русская формулировка, передающая непрерывную длительность действия.
theological_decisions:
- issue: К кому относится местоимение «он»
  choice: Сохранить местоимение без явного называния Бога
  alternative: Передать как «Бог» или «Господь»
  rationale: В ближайшем контексте субъект подразумевается, но в самом стихе не назван. Сохранение местоимения следует исходному тексту и не устраняет его литературную связность с предыдущими стихами.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического образа руки. Формулировка краткая и ритмичная; двусмысленность частицы אַךְ и сочетания двух глаголов отмечена в сноске.
