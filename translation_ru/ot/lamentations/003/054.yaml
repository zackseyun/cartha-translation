lexical_decisions:
- source_word: צָפוּ
  choice: поднялись выше
  rationale: В данном контексте глагол описывает воду, поднявшуюся над говорящим и поглотившую его. «Поднялись выше» естественно по-русски передаёт направление и сохраняет образ утопления; возможны также «сомкнулись над» и «покрыли».
- source_word: מַיִם
  choice: воды
  rationale: Множественное число сохраняет поэтическую форму еврейского текста и уместно в возвышенной речи плача.
- source_word: עַל רֹאשִׁי
  choice: выше моей головы
  rationale: Передаёт конкретный образ воды, поднявшейся над головой; буквальнее возможно «над моей головой».
- source_word: אָמַרְתִּי
  choice: я сказал
  rationale: Прямое соответствие обычному значению אמר; контекст допускает как произнесённые слова, так и внутреннюю речь, не требуя перевода «я подумал».
- source_word: נִגְזָרְתִּי
  choice: я отрезан
  rationale: Сохраняет метафору Niphal от גזר — быть отсечённым, отрезанным, вероятно от жизни, избавления или надежды, не сводя её к толкованию «я погиб».
theological_decisions:
- issue: Смысл נִגְזָרְתִּי
  choice: Сохранена метафора «я отрезан».
  alternative: «Я погиб», «мне конец» или «я обречён».
  rationale: Еврейская формулировка допускает смысл окончательной гибели, но выражает его образом отсечения. Перевод не уточняет без необходимости, от чего именно герой отрезан.
translation_notes:
  register: Современный литературный русский с сохранением краткости и напряжённой образности еврейской поэзии. «Воды» придают строке уместное поэтическое звучание, а «я отрезан» намеренно сохраняет необычную исходную метафору; её смысл пояснён в сноске.
