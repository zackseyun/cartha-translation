  yaml_path: translation/ot/lamentations/003/042.yaml
  text: We have transgressed and rebelled[a]; you have not forgiven.
translation:
  language: ru
  text: 'Мы преступили и восстали,

    а Ты не простил[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не даровал прощения». Еврейский глагол обычно обозначает Божье прощение.'
    reason: Лексическая альтернатива для סלח; сохраняет специфическое значение прощения, не подменяя его более широким понятием милости.
lexical_decisions:
- source_word: נַחְנוּ
  choice: Мы
  rationale: 'Самостоятельное местоимение первого лица множественного числа передано явно, чтобы сохранить смысловое ударение и противопоставление: «мы… а Ты…».'
- source_word: פָשַׁעְנוּ
  choice: творили беззаконие
  rationale: Глагол פשע обозначает преступление нравственной и заветной границы, а также непокорность. Выражение «творили беззаконие» естественно по-русски без добавления не названного в еврейском тексте объекта и сохраняет отличие от следующего глагола «восставали».
- source_word: וּמָרִינוּ
  choice: и восставали
  rationale: Глагол מרה означает мятежное неповиновение, сопротивление или бунт. «Восставали» сохраняет усиление первой части и звучит естественно в поэтической исповеди.
- source_word: אַתָּה
  choice: а Ты
  rationale: Явное местоимение сохранено ради заложенного в еврейском тексте контраста между поступками народа и ответом Бога; союз «а» естественно выражает этот контраст по-русски.
- source_word: לֹא סָלָחְתָּ
  choice: нас не простил
  rationale: סלח — обычный глагол со значением «прощать», особенно о Божьем прощении. Местоимение «нас» восполняет очевидный из контекста объект и делает русскую фразу естественной, не меняя смысла.
theological_decisions:
- issue: Отсутствие Божьего прощения в плаче
  choice: Ты нас не простил
  alternative: Ты нас не помиловал
  rationale: Прямое утверждение текста сохранено без смягчения и без богословского объяснения, которое устранило бы напряжение. «Простил» наиболее точно передаёт обычное значение סלח.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. Параллелизм двух глаголов и контраст «Мы… а Ты…» сохранены; формулировка не сглаживает резкость заключительной строки.
