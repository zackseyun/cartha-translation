  text: חֶלְקִ֤/י יְהוָה֙ אָמְרָ֣ה נַפְשִׁ֔/י עַל כֵּ֖ן אוֹחִ֥יל לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/024.yaml
  text: “Yahweh is my portion,” says my soul[b][a]; “therefore I will hope in him.”
translation:
  language: ru
  text: «Яхве — моя доля[a], — говорит моя душа, — поэтому я буду надеяться на него[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мой удел»; или: «моё наследие».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «буду ждать его»; или: «буду с надеждой ожидать его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְקִי
  choice: моя доля
  rationale: חֵלֶק означает долю, удел или доставшуюся часть. «Моя доля» естественно звучит по-русски и сохраняет поэтический и заветный оттенок, не сводя образ только к юридическому наследству.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אָמְרָה נַפְשִׁי
  choice: говорит моя душа
  rationale: Хотя אָמְרָה морфологически является формой перфекта, в обрамлении прямой речи она может выражать актуальное исповедание. נֶפֶשׁ здесь обозначает внутреннее «я» говорящего; «моя душа» сохраняет поэтический строй исходного текста.
- source_word: עַל־כֵּן
  choice: поэтому
  rationale: 'Идиома вводит следствие: надежда говорящего основана на исповедании, что Яхве — его доля.'
- source_word: אוֹחִיל לוֹ
  choice: я буду надеяться на него
  rationale: Форма от יחל соединяет ожидание с надеждой. Основной текст передаёт направленное на Яхве упование, а оттенок терпеливого ожидания отмечен в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя יהוה. Транслитерация «Яхве» сохраняет имя, не заменяя его титулом.
- issue: Значение образа חֶלְקִי
  choice: моя доля
  alternative: мой удел; моё наследие
  rationale: 'Формулировка сохраняет широту образа: Яхве представлен как принадлежащая говорящему доля и основание его упования, без искусственного ограничения смысла юридическим наследованием.'
- issue: Соотношение надежды и ожидания в אוֹחִיל
  choice: буду надеяться на него
  alternative: буду ждать его; буду с надеждой ожидать его
  rationale: Глагол допускает оба взаимосвязанных оттенка. В основном тексте выбран естественный русский эквивалент, выражающий упование, а неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным поэтическим звучанием. Порядок слов «Яхве — моя доля» естественно оформляет именную часть высказывания и подчёркивает исповедание. Местоимение «него» оставлено со строчной буквы по нормам современного общего издания; грамматический род в русском относится к лицу, обозначенному именем Яхве.
