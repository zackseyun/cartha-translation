- source_word: גָּדַר
  choice: окружил … стеной
  rationale: Глагол обозначает огораживание или заключение за преградой. Перевод сохраняет конкретный образ стены и по-русски ясно передаёт заточение.
- source_word: בַּעֲדִי
  choice: меня
  rationale: В сочетании с גָּדַר форма указывает на преграду, возведённую вокруг говорящего; по-русски это естественно выражается конструкцией «окружил меня стеной».
- source_word: וְלֹא אֵצֵא
  choice: мне не выйти
  rationale: Краткая русская конструкция сохраняет оттенок невозможности выйти и поэтическую напряжённость еврейского текста.
- source_word: הִכְבִּיד
  choice: отяжелил
  rationale: Каузативная форма буквально означает «сделал тяжёлым». «Отяжелил» сохраняет конкретность образа и подходит возвышенному поэтическому регистру.
- source_word: נְחָשְׁתִּי
  choice: мои оковы
  rationale: Слово связано с бронзой или медью и в контексте, вероятно, метонимически обозначает металлическое средство заключения. «Оковы» естественно передают образ, а материальная и предметная неоднозначность отмечена в сноске.
