  yaml_path: translation/ot/lamentations/003/012.yaml
  text: He bent his bow and set me up as a target for the arrow[a].
translation:
  language: ru
  text: 'Он натянул Свой лук

    и поставил меня мишенью для стрелы.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он согнул Свой лук и поставил меня словно мишень для стрелы».'
    reason: Лексически допустимы «согнул» для דָּרַךְ и более явная передача сравнительного כְּ словом «словно».
lexical_decisions:
- source_word: דָּרַךְ
  choice: натянул
  rationale: В сочетании со словом «лук» глагол означает подготовить лук к выстрелу — натянуть его; это естественно передаёт образ и не использует здесь общее значение «ступать, попирать».
- source_word: קַשְׁתּוֹ
  choice: Свой лук
  rationale: Суффикс 3-го лица мужского рода единственного числа передан притяжательным местоимением «Свой», относящимся к действующему лицу.
- source_word: וַיַּצִּיבֵנִי
  choice: и поставил меня
  rationale: Форма от יצב означает «поставить, расположить». Русское «поставил меня» сохраняет конкретность образа и звучит естественно.
- source_word: כַּמַּטָּרָא
  choice: мишенью
  rationale: Префикс כ выражает уподобление или назначение в данном образе; творительный предикативный оборот «поставил меня мишенью» естественно передаёт «поставил меня как мишень».
- source_word: לַחֵץ
  choice: для стрелы
  rationale: Сохранено единственное число еврейского חֵץ и значение отношения или назначения, выраженное предлогом ל.
