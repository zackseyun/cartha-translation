  text: Let us examine our ways and search them out[b][a], and let us return to Yahweh.
translation:
  language: ru
  text: Рассмотрим свои пути, исследуем их и возвратимся к Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обратимся к Яхве»; глагол означает «повернуться, возвратиться» и в данном контексте также подразумевает покаяние.'
    reason: alternative_reading
lexical_decisions:
- source_word: נַחְפְּשָׂה
  choice: Рассмотрим
  rationale: Когортатив первого лица множественного числа передаёт совместный призыв. «Рассмотрим» естественно выражает тщательное нравственное самоисследование и не дублирует следующий глагол буквально.
- source_word: דְרָכֵינוּ
  choice: свои пути
  rationale: «Пути» сохраняет еврейскую метафору образа жизни и поступков; возвратное «свои» естественно для русского языка при подлежащем «мы».
- source_word: וְנַחְקֹרָה
  choice: и исследуем их
  rationale: Глагол обозначает тщательное разыскание, исследование и проверку. Местоимение «их» восполняет подразумеваемый объект — «пути».
- source_word: וְנָשׁוּבָה
  choice: и возвратимся
  rationale: «Возвратимся» сохраняет основное пространственно-реляционное значение שׁוּב и подразумеваемое в контексте покаяние, не сводя смысл только к внутреннему раскаянию.
- source_word: עַד
  choice: к
  rationale: В сочетании с глаголом возвращения предлог естественно передаёт направленность движения к восстановлению отношений.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
theological_decisions:
- issue: Передача שׁוּב в призыве вернуться к Богу
  choice: возвратимся
  alternative: обратимся / покаемся
  rationale: «Возвратимся» сохраняет метафору ухода и возвращения, а также её заветный и реляционный смысл; покаяние подразумевается, но не подставляется как единственное значение.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет это различие.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным призывным звучанием. Метафора «пути» сохранена; тире подчёркивает переход от самоисследования к возвращению к Богу.
