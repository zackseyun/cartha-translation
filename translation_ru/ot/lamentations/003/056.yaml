lexical_decisions:
- source_word: קוֹלִי
  choice: мой голос
  rationale: Обычное значение קוֹל — «голос»; в контексте личной молитвы это естественно и точно.
- source_word: שָׁמָעְתָּ
  choice: Ты слышал
  rationale: Форма qal perfect 2 м. ед. ч. прямо указывает на совершившееся восприятие; простое прошедшее время сохраняет поэтическое воспоминание.
- source_word: אַל תַּעְלֵם אָזְנְךָ
  choice: не закрывай уха Твоего
  rationale: Буквально глагол עלם в породе hifil означает «скрывать», однако по-русски применительно к уху естественный библейско-поэтический образ — «не закрывай уха»; он не сводит выражение к отвлечённому «не игнорируй».
- source_word: לְרַוְחָתִי
  choice: для моей мольбы об облегчении
  rationale: רַוְחָה может означать облегчение, передышку, простор для дыхания. Сочетание трудно и эллиптично; в контексте параллелизма передаётся как просьба об облегчении, к которой Бог не должен закрывать ухо.
- source_word: לְשַׁוְעָתִי
  choice: для моего вопля о помощи
  rationale: שַׁוְעָה обозначает настойчивый вопль или крик о помощи. «Вопль о помощи» передаёт срочность и хорошо сочетается с образом открытого уха.
