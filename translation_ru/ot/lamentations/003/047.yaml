  source_fidelity: Первая пара в еврейском тексте — «ужас и яма» (פַּחַד וָפַחַת). «Западня» передаёт общий образ опасности, но отходит от конкретного образа ямы. Глагольное «постигли» естественно выражает הָיָה לָנוּ («были/случились нам»). Вторая пара, «опустошение и гибель», приемлемо передаёт הַשֵּׁאת וְהַשָּׁבֶר и сохраняет сжатый параллелизм.
