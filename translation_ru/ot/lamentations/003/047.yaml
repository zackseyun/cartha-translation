  text: Нас постигли ужас и яма, опустошение и гибель.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּחַד
  choice: ужас
  rationale: Передаёт сильный страх и сохраняет возвышенную, но понятную современную речь.
- source_word: פַחַת
  choice: западня
  rationale: Еврейское слово буквально обозначает яму и в данном сочетании подразумевает смертельную ловушку; «западня» естественно передаёт образ бедствия, внезапно настигшего людей.
- source_word: הַשֵּׁאת
  choice: опустошение
  rationale: Редкое существительное связано с разорением и запустением; перевод сохраняет масштаб общественного бедствия.
- source_word: הַשָּׁבֶר
  choice: гибель
  rationale: Слово обозначает сокрушение, крушение или разрушение; здесь «гибель» естественно завершает парное описание катастрофы, не сводя его к буквальному физическому разлому.
