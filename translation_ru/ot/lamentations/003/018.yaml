base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/018.yaml
  text: So I said[a], “My endurance has perished[b], and my hope from Yahweh.”
translation:
  language: ru
  text: 'И я сказал: «Исчезла моя стойкость[a] и моя надежда от Яхве[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моё великолепие», если נִצְחִי понимать как величие или славу, а не как стойкость.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «моя надежда от Яхве». Сжатый еврейский оборот может означать надежду, исходящую от Яхве, или надежду, возлагаемую на Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: И я сказал
  rationale: Последовательная форма с ו передаёт продолжение речи и подводит итог предшествующему переживанию; русское «И я сказал» естественно сохраняет эту связь.
- source_word: אָבַד
  choice: исчезла
  rationale: Глагол означает погибнуть, пропасть, исчезнуть. Здесь «исчезла» естественно сочетается с отвлечёнными существительными и сохраняет силу полной утраты.
- source_word: נִצְחִי
  choice: моя стойкость
  rationale: נֵצַח может обозначать длительность, неизменность или способность держаться; в контексте внутреннего истощения «стойкость» передаёт способность продолжать, не сводя смысл лишь к физической силе.
- source_word: וְתוֹחַלְתִּי
  choice: и моя надежда
  rationale: תּוֹחֶלֶת означает надежду или ожидание; «надежда» наиболее естественна в контексте плача.
- source_word: מֵיְהוָה
  choice: от Яхве
  rationale: 'Предлог מִן прежде всего означает «от, из». Буквальный оборот сохраняет сжатость и неоднозначность: речь может идти о надежде, исходящей от Яхве, либо, эллиптически, о надежде, возлагаемой на Него.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а не заменено титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; «Яхве» непосредственно передаёт тетраграмматон без замены титулом.
- issue: Смысл נִצְחִי
  choice: моя стойкость
  alternative: моё великолепие; моя сила; моя неизменность
  rationale: Контекст говорит о крушении способности говорящего держаться и надеяться. «Стойкость» сохраняет этот смысл, тогда как «сила» несколько сужает его; возможное значение «великолепие» отмечено в сноске.
- issue: Связь надежды с Яхве в מֵיְהוָה
  choice: сохранить буквальное «от Яхве»
  alternative: надежда на Яхве; надежда, данная Яхве
  rationale: Сжатый еврейский оборот допускает понимание как источника надежды, так и её направленности; основной текст не устраняет эту богословски значимую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством плача; сохранены лаконичность оригинала, личное имя Яхве и неоднозначность оборота «от Яхве». Все маркеры сносок стоят непосредственно после соответствующих выражений.
