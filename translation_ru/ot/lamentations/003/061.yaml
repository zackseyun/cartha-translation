  text: שָׁמַ֤עְתָּ חֶרְפָּתָ/ם֙ יְהוָ֔ה כָּל מַחְשְׁבֹתָ֖/ם עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/061.yaml
  text: You have heard their reproach[a], O Yahweh, all their schemes against me.
translation:
  language: ru
  text: Ты слышал их поношение, Яхве, все их замыслы против меня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все их мысли обо мне». Еврейское слово может означать как «мысли», так и «замыслы»; в данном контексте, вероятно, имеются в виду враждебные планы.'
    reason: Лексическая неоднозначность מַחְשְׁבֹתָם и контекстуальное значение עָלָי.
lexical_decisions:
- source_word: שָׁמַעְתָּ
  choice: Ты слышал
  rationale: Форма Qal перфекта, 2-е лицо мужского рода единственного числа. Русское прошедшее время естественно передаёт совершившееся действие, сохраняющее значение для настоящей молитвы.
- source_word: חֶרְפָּתָם
  choice: их поношения
  rationale: חֶרְפָּה обозначает поношение, поругание или оскорбительную насмешку. «Поношения» сохраняет как речевой, так и постыдный оттенок слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: כָּל
  choice: все
  rationale: Прямое соответствие כָּל при существительном во множественном числе.
- source_word: מַחְשְׁבֹתָם
  choice: их замыслы
  rationale: Существительное может обозначать мысли, намерения или планы; в контексте вражды «замыслы» естественно передаёт вероятный оттенок злонамеренного планирования, не делая его чрезмерно конкретным.
- source_word: עָלָי
  choice: против меня
  rationale: Предлог עַל в сочетании с враждебными намерениями естественно получает противительное значение; возможное более нейтральное понимание отражено в примечании.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное Божье имя и не подменяет его титулом.
- issue: Характер מַחְשְׁבֹתָם и значение עָלָי
  choice: все их замыслы против меня
  alternative: все их мысли обо мне
  rationale: В контексте преследования вероятнее речь идёт о враждебных планах, однако еврейская формулировка допускает и более нейтральное лексическое прочтение, поэтому оно сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической сдержанностью. Обращение «Яхве» выделено запятыми; порядок фразы близок к еврейскому, но остаётся естественным по-русски.
