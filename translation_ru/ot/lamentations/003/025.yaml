  text: ט֤וֹב יְהוָה֙ לְ/קוָֹ֔/ו לְ/נֶ֖פֶשׁ תִּדְרְשֶֽׁ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/025.yaml
  text: Yahweh is good to those who wait for him[a], to the soul that seeks him.
translation:
  language: ru
  text: Яхве добр к тем, кто ждёт Его[a], к душе, которая ищет Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «надеется на Него»; еврейский глагол означает ожидание, исполненное надежды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Благ
  rationale: Кратко и прямо передаёт предикативное значение прилагательного и сохраняет возвышенный поэтический регистр; не сужает смысл до одной лишь доброты.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לְקֹוָו
  choice: к тем, кто ждёт Его
  rationale: Глагол קוה выражает ожидание, проникнутое надеждой. Формулировка естественно передаёт терпеливое ожидание, а оттенок надежды отмечен в сноске.
- source_word: לְנֶפֶשׁ
  choice: к душе
  rationale: Сохраняет еврейский поэтический образ и параллелизм, не навязывая технического учения о составе человека.
- source_word: תִּדְרְשֶׁנּוּ
  choice: которая ищет Его
  rationale: דרש при Боге как объекте естественно означает устремлённо искать Его; форма женского рода согласована со словом «душа».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его и не подменяет титулом.
- issue: Смысловой оттенок קוה
  choice: ждёт Его
  alternative: надеется на Него
  rationale: Контекст плача подчёркивает терпеливое ожидание среди страдания, но глагол одновременно включает надежду; эта неоднозначность сохранена с помощью сноски.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно поэтическим строем. Инверсия «Благ Яхве» сохраняет краткость и торжественность оригинала; повтор «Его» поддерживает параллелизм.
