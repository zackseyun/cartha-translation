  text: יִתֵּ֤ן בֶּֽ/עָפָר֙ פִּ֔י/הוּ אוּלַ֖י יֵ֥שׁ תִּקְוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/029.yaml
  text: Let him put his mouth in the dust—perhaps there is hope[a].
translation:
  language: ru
  text: Пусть он прижмёт уста к праху — быть может, есть надежда.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «пусть положит свои уста в прах»; этот образ может выражать глубокое смирение, унижение или безмолвную покорность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן
  choice: Пусть он прижмёт
  rationale: Форма yiqtol в последовательности наставлений имеет побудительное значение. Глагол נתן буквально означает «дать, положить, поместить»; в русском сочетании с «устами» и «прахом» естественное «прижмёт» ясно передаёт изображённую позу, не устраняя образ.
- source_word: בֶּעָפָר
  choice: к праху
  rationale: עָפָר обозначает пыль, прах, рыхлую землю. Русское «прах» сохраняет возвышенно-библейскую окраску, а предлог «к» естественно описывает склонение лица до земли.
- source_word: פִּיהוּ
  choice: уста
  rationale: Буквально «его рот». «Уста» сохраняет конкретный телесный образ и соответствует достоинству поэтической речи; притяжательность в русском ясна из подлежащего и возвратного отношения действия.
- source_word: אוּלַי
  choice: быть может
  rationale: Передаёт возможность и сдержанную, неуверенную надежду; звучит естественно в современной литературной и поэтической русской речи.
- source_word: יֵשׁ
  choice: есть
  rationale: Экзистенциальная частица прямо обозначает наличие или существование; оттенок неопределённости уже выражен словами «быть может».
- source_word: תִּקְוָה
  choice: надежда
  rationale: Обычное и контекстуально точное соответствие תִּקְוָה, сохраняющее тему возможного избавления.
theological_decisions:
- issue: Образ смирения и покорности
  choice: Сохранить конкретный образ прикосновения уст к праху.
  alternative: 'Передать толкованием: «пусть смирится» или «пусть молча покорится».'
  rationale: Еврейский текст изображает телесную позу, которая может подразумевать глубокое смирение, унижение или безмолвную покорность. Конкретный образ сохраняет эту смысловую многозначность и не навязывает одно толкование.
- issue: Неопределённость надежды
  choice: «быть может, ещё есть надежда»
  alternative: «тогда появится надежда» или «может быть надежда»
  rationale: אוּלַי сохраняет подлинную неуверенность ожидания, а יֵשׁ утверждает возможное наличие надежды, не обещая исхода. «Ещё» естественно выражает сохраняющуюся возможность, не превращая её в гарантию.
translation_notes:
  register: Современный литературный русский с достоинством плачевой поэзии. «Уста» и «прах» слегка возвышенны, но общеупотребительны в библейском контексте. Тире сохраняет резкий переход от позы крайнего смирения к осторожной надежде.
