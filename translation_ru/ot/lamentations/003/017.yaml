lexical_decisions:
- source_word: וַתִּזְנַח ... נַפְשִׁי
  choice: Моя душа лишилась
  rationale: Форма וַתִּזְנַח допускает разбор как 3-е лицо женского рода, согласованное с נַפְשִׁי («моя душа»). Русское «лишилась» естественно передаёт удаление из состояния мира и благополучия, не делая фразу тяжеловесной.
- source_word: מִשָּׁלוֹם
  choice: покоя
  rationale: שָׁלוֹם охватывает мир, целостность и благополучие. В контексте личного плача «покой» звучит естественно, но более широкий смысл отмечен в сноске.
- source_word: נַפְשִׁי
  choice: моя душа
  rationale: Сохранён поэтический образ נֶפֶשׁ; здесь слово обозначает самого человека, его жизнь и внутреннее существо.
- source_word: נָשִׁיתִי
  choice: я забыл
  rationale: 'Перфект 1-го лица единственного числа от נשׁה прямо выражает завершившееся состояние: «я забыл».'
- source_word: טוֹבָה
  choice: о благе
  rationale: טוֹבָה может означать благо, добро, благополучие или счастье. «Благо» сохраняет широту слова и поэтический регистр, не сводя смысл только к материальному достатку.
theological_decisions:
- issue: Кто является подлежащим при וַתִּזְנַח
  choice: «Моя душа лишилась» — נַפְשִׁי понимается как подлежащее при форме 3-го лица женского рода
  alternative: «Ты отверг мою душу, удалив её от покоя» — форма может быть понята как 2-е лицо мужского рода с подразумеваемым обращением к Богу
  rationale: Обе формы морфологически совпадают. Основной текст следует ближайшему явно названному существительному и сохраняет плач как описание пережитого состояния; альтернативное прямое обращение к Богу дано в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным плачевным звучанием. «Душа» и «благо» сохраняют поэтичность оригинала, а синтаксис остаётся понятным обычному читателю.
