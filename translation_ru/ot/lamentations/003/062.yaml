lexical_decisions:
- source_word: שִׂפְתֵי
  choice: уста
  rationale: Сохраняет конкретный образ еврейского текста, где «губы/уста» метонимически обозначают речь; «уста» уместны в современном литературном библейском регистре.
- source_word: קָמַי
  choice: восстающих против меня
  rationale: Передаёт причастное значение от קום с суффиксом 1-го лица и не сводит выражение к более общему «враги».
- source_word: הֶגְיוֹנָם
  choice: их непрестанное бормотание
  rationale: Враждебный контекст поддерживает значение тихой, продолжающейся речи; «бормотание» не усиливает смысл до явно выраженного заговора. Непрерывность, выраженная כָּל הַיּוֹם, естественно передана определением «непрестанное».
- source_word: עָלַי
  choice: против меня
  rationale: В контексте враждебной речи предлог имеет направленно-враждебный смысл, а не просто «обо мне».
- source_word: כָּל הַיּוֹם
  choice: непрестанное
  rationale: Функционально передаёт буквальное «весь день» как постоянное, не прекращающееся действие; буквальная временная формулировка отмечена в сноске.
