lexical_decisions:
- source_word: כִּי
  choice: Потому что
  rationale: Союз вводит основание для мысли в ближайшем контексте. «Потому что» естественно передаёт причинно-пояснительную связь, не добавляя нового содержания.
- source_word: לֹא
  choice: не
  rationale: Прямое отрицание сказуемого; расширение не требуется.
- source_word: יִזְנַח
  choice: отвергнет
  rationale: Глагол זנח может означать «отвергать», «оставлять», «отбрасывать». «Отвергнет» ясно передаёт здесь действие Господа в отношении человека, сохраняя широту значения.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: В сочетании с отрицанием выражает мысль о том, что отвержение не будет постоянным. «Навеки» кратко и естественно передаёт временное значение.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Это божественный титул «Господь», а не тетраграмматон; он переводится обычным русским титулом с прописной буквы.
theological_decisions:
- issue: Передача божественного титула
  choice: Господь
  alternative: Владыка
  rationale: В еврейском тексте стоит אֲדֹנָי — божественный титул. «Господь» является естественным и традиционно узнаваемым русским соответствием, не подменяя титул личным именем.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка сохраняет поэтический характер Плача. Причинная связь с контекстом выражена союзом «потому что».
