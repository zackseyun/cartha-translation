  text: Он раздробил мои зубы мелкими камнями[a], поверг меня в пепел[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «истёр мои зубы гравием».'
    reason: lexical_alternative
  - marker: b
