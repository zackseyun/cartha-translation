lexical_decisions:
- source_word: וַיַּגְרֵס
  choice: раздробил
  rationale: Глагол передаёт раздавливание или размалывание. «Раздробил» естественно сочетается с «зубы» и сохраняет жестокую телесную образность; возможен также образ истирания.
- source_word: בֶּחָצָץ
  choice: щебнем
  rationale: חָצָץ обозначает мелкие камни, гравий или щебень. «Щебнем» кратко и выразительно передаёт твёрдый абразивный материал и инструментальное значение предлога בְּ.
- source_word: שִׁנָּי
  choice: мои зубы
  rationale: Форма представляет собой множественное число с суффиксом первого лица единственного числа.
- source_word: הִכְפִּישַׁנִי
  choice: поверг меня
  rationale: Редкий глагол в данном контексте выражает унижение и принудительное низведение. «Поверг меня» сохраняет физический и унизительный оттенки, не сводя образ только к одному возможному толкованию.
- source_word: בָּאֵפֶר
  choice: в пепел
  rationale: אֵפֶר означает «пепел», а не просто «пыль». После «поверг» предлог передан направительным оборотом «в пепел».
