base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/023.yaml
  text: They are new every morning[a]; great is your faithfulness.
translation:
  language: ru
  text: Каждое утро они новы[a]; велика Твоя верность!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Она нова каждое утро», если подразумеваемое подлежащее из предыдущей строки понимать собирательно.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲדָשִׁים
  choice: обновляются
  rationale: Форма множественного числа означает «новые, свежие». В связи с подразумеваемым antecedent из 3:22 естественное русское «обновляются» передаёт, что милости Божьи вновь явлены каждое утро, не меняя множественного числа.
- source_word: לַבְּקָרִים
  choice: каждое утро
  rationale: Предлог ל при множественном בְּקָרִים выражает повторяющееся время; «каждое утро» естественно передаёт итеративный смысл.
- source_word: רַבָּה
  choice: велика
  rationale: При абстрактном существительном אֱמוּנָה женская форма רַבָּה естественно передаётся предикативным «велика».
- source_word: אֱמוּנָתֶךָ
  choice: Твоя верность
  rationale: אֱמוּנָה здесь обозначает надёжность, постоянство и верность Бога. «Верность» сохраняет этот широкий смысл и не сводит слово к субъективной вере.
theological_decisions:
- issue: Подразумеваемое подлежащее, перенесённое из предыдущего стиха
  choice: Они обновляются каждое утро
  alternative: Она обновляется каждое утро
  rationale: Еврейский стих начинается с прилагательного мужского рода множественного числа без явного подлежащего. Наиболее естественный antecedent в 3:22 — множественное רַחֲמָיו («Его милости/сострадания»), поэтому сохранено множественное «они». В сноске отмечено возможное собирательное понимание.
translation_notes:
  register: Современный литературный русский язык с краткой, возвышенной ритмикой. Прописные местоимения при обращении к Богу использованы как традиционный русский издательский знак почтительности; они не добавляют смыслового различия, отсутствующего в еврейском тексте.
