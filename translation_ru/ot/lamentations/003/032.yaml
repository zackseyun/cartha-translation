base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/032.yaml
  text: For if he causes grief[b][a], he will also show compassion according to the abundance of his steadfast love.
translation:
  language: ru
  text: Ибо если Он причиняет скорбь[a], то и проявит сострадание по обилию Своей неизменной любви[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Хотя Он причиняет скорбь, всё же проявит сострадание по обилию Своей неизменной любви». В данном контексте еврейское выражение может иметь уступительный оттенок.'
    reason: alternative_reading
  - marker: b
    text: Еврейское хесед также можно передать как «верная любовь», «заветная любовь» или «милость».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Ибо если
  rationale: Сохраняет пояснительную силу כִּי и условное значение אִם, не устраняя возможного уступительного оттенка, отмеченного в сноске.
- source_word: הוֹגָה
  choice: Он причиняет скорбь
  rationale: Каузативная форма передаёт действие, вызывающее скорбь или страдание; «причиняет скорбь» естественно звучит в контексте плача и сохраняет эмоциональную окраску.
- source_word: וְרִחַם
  choice: то и проявит сострадание
  rationale: Глагол רחם обозначает сострадание и милосердие. Будущее время и конструкция «то и» естественно передают соотношение частей условного высказывания и соединительную функцию וְ.
- source_word: כְּרֹב
  choice: так велика
  rationale: Выражение указывает на меру или соответствие. Такая формулировка передаёт, что сострадание соразмерно изобилию любви, и при этом звучит естественно по-русски.
- source_word: חסדו
  choice: Его неизменная любовь
  rationale: חסד включает верность, постоянство, любовь и милость. «Неизменная любовь» сохраняет отличие от רחם и не сужает значение исключительно до милосердия.
theological_decisions:
- issue: Передача חסד в соотношении с רחם
  choice: Различать רחם как «проявит сострадание» и חסד как «неизменная любовь».
  alternative: 'Передать оба слова лексикой милости: «помилует» / «по множеству милостей».'
  rationale: В еврейском тексте сочетаются два близких, но не тождественных понятия. Их различение сохраняет мысль о том, что сострадательное действие Бога соответствует изобилию Его постоянной, верной любви.
- issue: Условный или уступительный смысл כִּי אִם
  choice: В основном тексте сохранить условное «ибо если».
  alternative: «Хотя Он причиняет скорбь, всё же проявит сострадание».
  rationale: Грамматика допускает условное прочтение, а контекст придаёт ему уступительный оттенок. Основной текст не усиливает этот оттенок сверх формы оригинала; вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Заглавные местоимения о Боге использованы в соответствии с принятой русской библейской традицией. Тире помогает ясно выразить меру сострадания, не превращая связь между частями в причинное толкование.
