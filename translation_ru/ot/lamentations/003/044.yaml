lexical_decisions:
- source_word: סַכּוֹתָה
  choice: Ты закрыл Себя
  rationale: Форма qal, перфект 2 м. ед. ч., обращена к Богу; сочетание с לָךְ естественно передаётся возвратной конструкцией. Прошедшее совершенного вида соответствует завершённому действию в контексте плача.
- source_word: בֶעָנָן
  choice: облаком
  rationale: Предлог ב обозначает здесь средство или окутывающую среду. Единственное число еврейского существительного сохранено.
- source_word: לָךְ
  choice: Себя
  rationale: Формально «для Себя / Себе», но при סַכּוֹתָה это местоимение придаёт выражению возвратно-бенефактивный смысл, который по-русски естественно передать как «закрыл Себя».
- source_word: מֵעֲבוֹר
  choice: чтобы … не могла пройти
  rationale: Предлог מִן с инфинитивом конструкта עבר выражает недопущение прохождения. Придаточное цели или результата естественно передаёт смысл препятствия, не устраняя возможный оттенок результата.
- source_word: תְּפִלָּה
  choice: молитва
  rationale: Существительное в единственном числе имеет обобщённое значение; русский вариант без неопределённого артикля сохраняет его естественным образом.
theological_decisions:
- issue: Антропоморфный образ Бога, преграждающего путь молитве
  choice: Сохранено прямое обращение к Богу и образ облака, через которое молитва не может пройти.
  alternative: «Ты скрылся в облаке» или безличное описание преграды для молитвы.
  rationale: Еврейский текст прямо обращён к Богу и намеренно создаёт напряжённый образ Его сокрытия и суда; перевод не смягчает и не разрешает это напряжение.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная, но понятная. Заглавная буква в «Себя» обозначает обращение к Богу согласно распространённой русской библейской издательской практике.
