  text: ט֤וֹב וְ/יָחִיל֙ וְ/דוּמָ֔ם לִ/תְשׁוּעַ֖ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/026.yaml
  text: It is good to wait quietly for the salvation of Yahweh[a].
translation:
  language: ru
  text: Благо молча надеяться на спасение от Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Благо спокойно ждать спасения Яхве». Еврейский глагол может означать исполненное надежды ожидание, а слово, переведённое как «молча», — также спокойствие или безмолвие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Благо
  rationale: 'Предикативное прилагательное в безглагольной конструкции передано кратко и возвышенно, но понятно: речь о том, что такая надежда благотворна и подобающа.'
- source_word: יָחִיל
  choice: надеяться
  rationale: Глагол יחל сочетает значения надежды и ожидающего упования. «Надеяться» естественно сочетается со спасением и сохраняет положительное ожидание, не сводя смысл к простому промедлению.
- source_word: וְדוּמָם
  choice: молча
  rationale: Наречие обозначает безмолвие или спокойную неподвижность. «Молча» непосредственно сохраняет образ молчаливого ожидания; союз וְ осмыслен как соединение обстоятельства с глагольным действием.
- source_word: לִתְשׁוּעַת
  choice: на спасение от
  rationale: תְּשׁוּעָה означает спасение или избавление. Предлог לְ указывает на предмет ожидания, а естественная русская конструкция уточняет Яхве как источник спасения, не исключая того, что это спасение принадлежит Ему и совершается Им.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер ожидания спасения
  choice: надеяться
  alternative: ждать
  rationale: Форма от יחל допускает и надежду, и ожидающее упование. Основной текст подчёркивает надежду, а примечание сохраняет возможную передачу через «ждать».
translation_notes:
  register: Современный литературный русский с лаконичным, поэтически достойным строем. «Благо» сохраняет афористичность еврейской строки; вариант с «ждать» и оттенок спокойствия вынесены в примечание для сохранения лексической неоднозначности.
