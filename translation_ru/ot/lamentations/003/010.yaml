  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֹּב
  choice: медведь
  rationale: Существительное прямо обозначает медведя; в именной поэтической конструкции неопределённость естественно передаётся без артикля.
- source_word: אֹרֵב
  choice: подстерегающий добычу
  rationale: Причастие от ארב описывает хищника, сидящего в засаде и ожидающего нападения. Добавление «добычу» делает образ естественным по-русски, не меняя того, что целью назван сам говорящий.
- source_word: הוּא
  choice: Он
  rationale: Самостоятельное местоимение выражено явно и сохранено как подлежащее именной конструкции.
- source_word: לִי
  choice: для меня
  rationale: Предлог обозначает направленность засады на говорящего. Оборот сохраняет формальную двусмысленность, а контекст ясно придаёт ему враждебный смысл.
- source_word: אריה
  choice: лев
  rationale: Существительное обозначает льва и образует параллель к «медведю».
- source_word: בְּמִסְתָּרִים
  choice: притаившийся в укрытии
  rationale: Форма во множественном числе обозначает скрытые места. По-русски собирательное «в укрытии» естественно передаёт сцену засады; «притаившийся» восполняет подразумеваемую во второй параллельной строке хищную скрытность.
theological_decisions:
- issue: Образ Бога как враждебно подстерегающего хищника
  choice: Сохранить прямое сравнение с медведем и львом
  alternative: Смягчить образ, представив его лишь описанием переживаний говорящего
  rationale: Еврейский текст намеренно выражает резкое восприятие говорящего и не снабжает его богословским пояснением; напряжение следует сохранить.
translation_notes:
  register: Современный литературный русский язык с кратким, выразительным поэтическим параллелизмом. Тире подчёркивает именную конструкцию. Образы засады и укрытия переданы естественно и без конфессионального толкования.
