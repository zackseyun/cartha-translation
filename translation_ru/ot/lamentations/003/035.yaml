  language: ru
  text: нарушать право человека пред лицом Всевышнего —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַטּוֹת מִשְׁפַּט
  choice: отказывать… в правосудии
  rationale: Идиома буквально говорит об отклонении или извращении суда; выбранная формулировка естественно передаёт лишение человека справедливого судебного решения, не сводя смысл лишь к ошибочному приговору.
- source_word: גָּבֶר
  choice: человеку
  rationale: В данном общем нравственном высказывании слово обозначает отдельного человека; «мужу» в современном русском звучало бы архаично и могло бы неоправданно сузить смысл.
- source_word: נֶגֶד פְּנֵי
  choice: пред лицом
  rationale: Сохранён выразительный пространственный образ исходного текста и его торжественный регистр.
- source_word: עֶלְיוֹן
  choice: Всевышнего
  rationale: Традиционный и точный русский эквивалент божественного титула «Высочайший».
theological_decisions:
- issue: Отношение несправедливого суда к Божьему присутствию и ведению
  choice: пред лицом Всевышнего
  alternative: на глазах у Всевышнего
  rationale: Более буквально сохранён образ Божьего лица; формулировка не уточняет сверх текста, означает ли она прежде всего присутствие, наблюдение или суд Всевышнего.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оборотом «пред лицом». Инфинитив и завершающее тире сохранены, поскольку стих синтаксически продолжается в соседнем контексте.
