  yaml_path: translation/ot/lamentations/003/004.yaml
  text: He has worn away my flesh and my skin[a]; he has broken my bones.
translation:
  language: ru
  text: Он изнурил мою плоть и мою кожу[a], сокрушил мои кости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «истощил мою плоть и мою кожу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלָּה
  choice: изнурил
  rationale: Пиэль глагола בלה означает доведение до износа или истощения. «Изнурил» естественно передаёт причинённое телесное истощение, не ослабляя образ и не добавляя идеи полного уничтожения.
- source_word: בְשָׂרִי
  choice: мою плоть
  rationale: «Плоть» прямо передаёт בשר и сохраняет телесную, поэтическую образность древнееврейского текста.
- source_word: וְעוֹרִי
  choice: и мою кожу
  rationale: «Кожа» является прямым современным соответствием עור и сохраняет параллелизм с «плотью».
- source_word: שִׁבַּר
  choice: сокрушил
  rationale: В данном поэтическом контексте «сокрушил» естественно передаёт интенсивное «сломал, разбил» и сочетается с образом костей.
- source_word: עַצְמוֹתָי
  choice: мои кости
  rationale: Прямой перевод, сохраняющий конкретный телесный образ и силу плача.
