  text: יִתֵּ֧ן לְ/מַכֵּ֛/הוּ לֶ֖חִי יִשְׂבַּ֥ע בְּ/חֶרְפָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/030.yaml
  text: Let him give his cheek to the one who strikes him[a]; let him be filled with reproach.
translation:
  language: ru
  text: Пусть он подставит щёку тому, кто его бьёт; пусть насытится поношением.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть вдоволь претерпит позор (оскорбления)». Буквально еврейский текст говорит: «пусть насытится поношением».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן
  choice: Пусть он подставит
  rationale: Форма yiqtol в ряду наставлений имеет побудительный оттенок. В сочетании со словом «щека» естественное русское «подставит» передаёт подразумеваемое действие точнее, чем буквальное «даст».
- source_word: לְמַכֵּהוּ
  choice: тому, кто его бьёт
  rationale: Предлог לְ с причастием Hiphil от נכה и суффиксом 3-го лица мужского рода обозначает человека, наносящего ему удар; формулировка сохраняет причастное значение и звучит современно.
- source_word: לֶחִי
  choice: щёку
  rationale: לֶחִי обозначает щёку или область челюсти. «Щёку» естественно передаёт образ добровольного принятия удара и унижения.
- source_word: יִשְׂבַּע
  choice: пусть насытится
  rationale: Глагол שבע буквально означает «насытиться, быть наполненным». Выбор сохраняет намеренно резкую метафору еврейского текста, не сводя её к более общему «перенесёт».
- source_word: בְּחֶרְפָּה
  choice: поношением
  rationale: חֶרְפָּה охватывает значения поношения, позора и оскорбления. «Поношение» сохраняет общественно-нравственный оттенок унижения и соответствует возвышенному, но понятному регистру Плача.
