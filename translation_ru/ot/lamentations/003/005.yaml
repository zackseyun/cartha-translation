lexical_decisions:
- source_word: בָּנָה עָלַי
  choice: воздвиг против меня осадные укрепления
  rationale: Глагол буквально означает «строить, возводить», а עָלַי в данном враждебном контексте — «против меня». Добавлен подразумеваемый объект «осадные укрепления», чтобы по-русски естественно передать образ строительства осадных сооружений, не заменяя его полностью глаголом «осадил».
- source_word: וַיַּקַּף
  choice: окружил меня
  rationale: Глагол обозначает окружение или охватывание; местоименное дополнение восстановлено из контекста, где говорящий остаётся объектом действия.
- source_word: רֹאשׁ
  choice: горечью
  rationale: Слово может обозначать горькое или ядовитое вещество. «Горечь» естественно звучит в русской поэзии плача и сохраняет переносный смысл; конкретное значение «яд» отмечено в сноске.
- source_word: וּתְלָאָה
  choice: и тяготой
  rationale: Существительное выражает тягость, изнурение, бедствие или мучение. «Тягота» передаёт и бремя страдания, и изнуряющее бедствие, сохраняя поэтический регистр.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным, dignified поэтическим ритмом. Образ осады выражен явно ради естественности русского синтаксиса, а буквальная формулировка сохранена в сноске. Сочетание «горечью и тяготой» удерживает семантическую неоднозначность и параллелизм исходного стиха.
