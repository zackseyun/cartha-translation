  text: Кто сказал — и это произошло[a], если Господь не повелел?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорит — и это происходит»; в еврейском стоят формы прошедшего времени, употреблённые в риторическом высказывании общей истины.'
