lexical_decisions:
- source_word: מִי זֶה
  choice: Кто это
  rationale: Сочетание вопросительного מִי с указательным זֶה образует усиленный риторический вопрос; «Кто это» естественно передаёт его силу по-русски.
- source_word: אָמַר
  choice: говорит
  rationale: Хотя в еврейском употреблена форма прошедшего времени, риторическое высказывание выражает общую истину, поэтому настоящее время естественно в современном русском.
- source_word: וַתֶּהִי
  choice: и сбывается
  rationale: Форма от היה обозначает наступление или осуществление подразумеваемого события. «Сбывается» ясно передаёт связь между произнесённым словом и его осуществлением, не добавляя явного объекта.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: אֲדֹנָי здесь является божественным титулом; традиционное и естественное русское соответствие — «Господь».
- source_word: לֹא צִוָּה
  choice: не повелел
  rationale: צוה буквально означает «повелевать, приказывать». Выбран близкий к оригиналу глагол без усиления до богословски более нагруженных «предопределил» или «постановил».
theological_decisions:
- issue: Язык Божьего владычества в צוה
  choice: не повелел
  alternative: не постановил / не предопределил
  rationale: Основной текст сохраняет прямое лексическое значение צוה и утверждаемую стихом зависимость происходящего от Господнего повеления, не вводя более сильного систематико-богословского термина.
- issue: Логическая связь отрицания с риторическим вопросом
  choice: если Господь не повелел?
  alternative: если только Господь не повелел / без повеления Господа
  rationale: Русская конструкция с «если ... не» сохраняет форму и напряжение еврейского риторического вопроса, не превращая его в разъясняющее утверждение.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная риторическая формулировка. Тире подчёркивает связь между человеческим высказыванием и осуществлением события. Все примечания обозначены в основном тексте.
