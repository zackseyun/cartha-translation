lexical_decisions:
- source_word: זְכָר
  choice: Вспомни
  rationale: Императив породы qal, 2-е лицо мужского рода единственного числа; передаёт прямую просьбу без добавления адресата.
- source_word: עָנְיִי
  choice: моё бедствие
  rationale: Обозначает тяжёлое положение, страдание или несчастье; «бедствие» сохраняет широкий и весомый смысл.
- source_word: מְרוּדִי
  choice: мои скитания
  rationale: Слово указывает на бесприютное, неустроенное странствие; «скитания» сохраняют образ движения и не сужают его до буквальной бездомности.
- source_word: לַעֲנָה
  choice: полынь
  rationale: Конкретное название горького растения, которое в поэзии служит образом мучительной горечи; предметный образ сохранён.
- source_word: רֹאשׁ
  choice: яд
  rationale: В данном сочетании обозначает ядовитое вещество или растение; «яд» естественно передаёт опасность и горечь, не привязывая слово к одному спорному виду растения.
theological_decisions:
- issue: К кому обращён императив «Вспомни»
  choice: Адресат в переводе не назван.
  alternative: Явно добавить «Господи» или понять форму как обращение говорящего к самому себе.
  rationale: В самом стихе адресат грамматически не выражен; его уточнение сняло бы сохраняющуюся в еврейском тексте неоднозначность.
translation_notes:
  register: Современный литературный русский язык с лаконичной поэтической интонацией. Сохранены императив, параллельные существительные и конкретные образы оригинала; тире естественно оформляет пояснительное присоединение.
