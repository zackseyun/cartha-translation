  yaml_path: translation/ot/lamentations/003/006.yaml
  text: He has made me dwell in darkness like those long dead[a].
translation:
  language: ru
  text: 'Он поселил меня во тьме,

    словно одного из давно умерших.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он усадил меня в тёмных местах, словно одного из умерших в давние времена».'
    reason: 'Лексические варианты: הוֹשִׁיבַנִי может буквально означать «усадил», בְּמַחֲשַׁכִּים — «в тёмных местах», а עוֹלָם — «в давние времена».'
lexical_decisions:
- source_word: בְּמַחֲשַׁכִּים
  choice: во тьме
  rationale: Форма множественного числа с предлогом בְּ обозначает пребывание во мраке или тёмных местах. Русское собирательное «во тьме» естественно передаёт этот образ, не сужая его до отдельных помещений.
- source_word: הוֹשִׁיבַנִי
  choice: Он поселил меня
  rationale: Каузативная порода глагола ישׁב с суффиксом 1-го лица означает «заставил сидеть/обитать, поместил». «Поселил меня» естественно выражает навязанное длительное пребывание, сохраняя каузативный смысл.
- source_word: כְּמֵתֵי
  choice: словно умерших
  rationale: Предлог сравнения כְּ и конструктивное множественное число от «мёртвый» вводят уподобление умершим. «Словно» в данном поэтическом контексте звучит естественно и ясно.
- source_word: עוֹלָם
  choice: давным-давно
  rationale: Здесь עוֹלָם, вероятнее всего, указывает на отдалённое прошлое — на тех, кто умер очень давно, — а не утверждает вечность смерти. Наречная передача сохраняет естественность русского выражения.
