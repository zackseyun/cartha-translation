  text: Why should a living man complain, a man, about his sins?
translation:
  language: ru
  text: Зачем живому человеку жаловаться на свои грехи?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: кере «на его грехи»; кетив «на его грех».'
    reason: Отмечает масоретский вариант числа, при этом основной перевод следует кере.
lexical_decisions:
- source_word: מַה יִּתְאוֹנֵן
  choice: Зачем… жаловаться
  rationale: Вопросительное מַה с имперфектом здесь естественно передаёт риторическое «зачем / почему должен». Глагол התאנן означает «жаловаться, сетовать».
- source_word: אָדָם חָי
  choice: живому человеку
  rationale: Сохраняется буквальный смысл «живой человек»; дательный падеж обусловлен русской безлично-инфинитивной конструкцией.
- source_word: גֶּבֶר
  choice: человеку
  rationale: Повторное обозначение человека сохранено как пояснительное приложение; перевод «мужчина» здесь был бы неоправданно узким.
- source_word: עַל חטאיו
  choice: на свои грехи
  rationale: Предлог עַל допускает значение предмета жалобы — «о / на / по поводу». Суффикс третьего лица множественного числа передан возвратным «свои».
theological_decisions:
- issue: Отношение жалобы к грехам
  choice: на свои грехи
  alternative: из-за своих грехов / за свои грехи
  rationale: Формулировка не уточняет сверх текста, жалуется ли человек на сами грехи или на их последствия; сохраняется неоднозначность עַל.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Тире сохраняет резкое пояснительное повторение אָדָם… גֶּבֶר и напряжённую краткость еврейской строки.
