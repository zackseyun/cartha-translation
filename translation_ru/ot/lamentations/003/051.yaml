  yaml_path: translation/ot/lamentations/003/051.yaml
  text: My eye causes grief to my soul because of all the daughters of my city.
translation:
  language: ru
  text: Мой глаз причиняет моей душе боль из-за всех дочерей моего города.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при виде всех дочерей моего города». «Дочери города» могут означать женщин или девушек, живущих в нём.'
    reason: Предлог מִן допускает причинное прочтение «из-за», тогда как контекст зрения позволяет понимать выражение как указание на увиденное; образ «дочерей» также намеренно оставлен широким.
lexical_decisions:
- source_word: עֵינִי
  choice: мой глаз
  rationale: Сохранён конкретный образ и единственное число еврейского текста; речь идёт о страдании, которое вызывают увиденные бедствия.
- source_word: עוֹלְלָה
  choice: причиняет боль
  rationale: Форма глагола выражает причинение тяжкого страдания или жестокое воздействие; этот вариант естественен по-русски и сохраняет причинную связь между глазом и душой.
- source_word: לְנַפְשִׁי
  choice: моей душе
  rationale: Передаёт נֶפֶשׁ без неоправданного сужения до «сердца» или «чувств» и сохраняет поэтическое напряжение оригинала.
- source_word: בְּנוֹת עִירִי
  choice: дочерей моего города
  rationale: Буквальный поэтический образ сохранён; он может обозначать женщин или девушек города, но перевод не устраняет эту смысловую широту.
theological_decisions:
- issue: Связь страдания души с увиденным и с «дочерьми города»
  choice: Сохранить формулировку «мой глаз причиняет боль моей душе из-за всех дочерей моего города»
  alternative: «При виде всех дочерей моего города душа моя терзается»
  rationale: Выбранный вариант точнее сохраняет необычную грамматическую образность оригинала, где «мой глаз» выступает подлежащим, и не уточняет сверх текста, что именно произошло с дочерьми города.
translation_notes:
  register: Современный литературный русский с сохранением лаконичной, необычной поэтической конструкции еврейского оригинала. Формулировка понятна обычному читателю, но не сглаживает образ, в котором глаз причиняет страдание душе.
