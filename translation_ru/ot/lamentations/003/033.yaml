lexical_decisions:
- source_word: כִּי
  choice: Потому что
  rationale: Союз вводит основание предыдущего утверждения; «потому что» естественно передаёт причинно-пояснительную связь.
- source_word: לֹא עִנָּה
  choice: не… причиняет страдание
  rationale: Глагол обозначает причинение тяготы, бедствия или страдания. Эта формулировка понятна современному читателю и сохраняет широкий смысл без сужения до угнетения или смирения.
- source_word: מִלִּבּוֹ
  choice: не от сердца Своего
  rationale: Сохранён конкретный еврейский образ, говорящий о внутреннем расположении Бога; инверсия позволяет естественно включить его в русскую фразу.
- source_word: וַיַּגֶּה
  choice: и огорчает
  rationale: Глагол передаёт причинение скорби или печали. «Огорчает» отличает его от предшествующего ענה и сохраняет смысловой параллелизм.
- source_word: בְנֵי אִישׁ
  choice: сынов человеческих
  rationale: Традиционно понятная и достойная русская формула сохраняет образ «сынов» и одновременно ясно обозначает людей как человеческий род.
theological_decisions:
- issue: Антропоморфное описание Божьего внутреннего расположения
  choice: не от сердца Своего
  alternative: не по Своей воле; неохотно
  rationale: Буквальный образ сохраняет напряжение между Божьим действием и тем, что причинение страдания не исходит из Его внутреннего расположения; перевод не сводит высказывание к одной абстрактной трактовке.
- issue: Обобщающее мужское выражение
  choice: сынов человеческих
  alternative: людей; человеческих существ
  rationale: Формулировка сохраняет образность еврейского выражения, а сноска поясняет его обобщающий смысл без внесения конфессиональной интерпретации.
- issue: Связь двух глаголов
  choice: и огорчает
  alternative: или огорчает
  rationale: Еврейский ו обычно соединяет однородные действия союзом «и». Здесь отрицание по смыслу охватывает составное высказывание, поэтому «и» точнее отражает синтаксис оригинала, не разделяя действия как альтернативы.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Сохранён библейский образ «от сердца» без обязательной сноски, поскольку он прозрачен по-русски; местоимение «Своего» написано с прописной буквы как традиционное обозначение Бога. Маркер [a] присутствует в основном тексте.
