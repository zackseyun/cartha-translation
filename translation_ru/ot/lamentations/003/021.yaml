  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: Вот что
  rationale: Указательное местоимение оставляет открытой связь с последующим содержанием, а русское «вот что» естественно вводит вспоминаемую мысль.
- source_word: אָשִׁיב
  choice: возвращаю
  rationale: Форма Hiphil от שוב буквально выражает действие «возвращать»; в сочетании с «в сердце» речь идёт о сознательном возвращении мысли.
- source_word: אֶל לִבִּי
  choice: в своё сердце
  rationale: Сохраняет древнееврейский антропологический образ сердца как средоточия мысли, памяти и внутреннего решения; возвратное «своё» естественно по-русски при подлежащем первого лица.
- source_word: עַל כֵּן
  choice: и потому
  rationale: Передаёт вывод или следствие, связывая припоминание с надеждой.
- source_word: אוֹחִיל
  choice: надеюсь
  rationale: Hiphil от יחל означает надеяться или ожидать с упованием. «Надеюсь» кратко и естественно передаёт этот смысл, не устраняя оттенка ожидания.
theological_decisions:
- issue: Образ לֵב («сердце») как место мысли и памяти
  choice: Сохранено «в своё сердце» с пояснением идиоматического смысла в сноске.
  alternative: «Вот что я вспоминаю — и потому надеюсь».
  rationale: Буквальный образ важен для поэтической и антропологической выразительности текста, однако современный читатель может понять «сердце» лишь эмоционально; сноска сохраняет и образ, и когнитивный смысл.
- issue: Оттенок надежды и ожидающего упования в אוֹחִיל
  choice: «надеюсь»
  alternative: «буду ждать с надеждой» или «уповаю»
  rationale: Контекст допускает надежду и ожидающее упование. Нейтральное «надеюсь» не сужает значение до конфессионально окрашенного «уповаю» и не усиливает явно временной аспект.
translation_notes:
  register: Современный литературный русский с сохранением поэтического образа оригинала. Двоеточие отражает направленность указательного выражения к следующим стихам; при понимании ссылки как преимущественно обратной возможно завершение точкой.
