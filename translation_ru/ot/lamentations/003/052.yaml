lexical_decisions:
- source_word: צוֹד צָדוּנִי
  choice: упорно охотились на меня
  rationale: Корень צוד передаёт образ охоты или ловли добычи, а сочетание инфинитива абсолютного с личной формой глагола усиливает действие. «Упорно охотились» естественно передаёт и образ преследования, и это усиление.
- source_word: כַּצִּפּוֹר
  choice: словно на птицу
  rationale: צִפּוֹר — общее обозначение птицы, без указания на конкретный вид. Русская конструкция «охотились на меня, словно на птицу» сохраняет образ уязвимой добычи.
- source_word: אֹיְבַי
  choice: враги мои
  rationale: Прямое и литературно уместное соответствие существительному «враги». Порядок слов придаёт строке достоинство, не делая её архаичной.
- source_word: חִנָּם
  choice: без причины
  rationale: В данном контексте слово указывает на необоснованность и несправедливость вражды, а не на отсутствие платы.
