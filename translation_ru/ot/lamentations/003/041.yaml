base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/041.yaml
  text: Let us lift up our hearts with our hands to God in heaven.
translation:
  language: ru
  text: Вознесём к Богу, пребывающему на небесах, наши сердца вместе с руками.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשָּׂא
  choice: Вознесём
  rationale: Когортативная форма выражает совместный призыв; «вознесём» сохраняет возвышенный, но понятный русский регистр.
- source_word: לְבָבֵנוּ
  choice: наши сердца
  rationale: Буквально передаёт множественное число и образ внутреннего обращения к Богу.
- source_word: אֶל־כַּפָּיִם
  choice: вместе с руками
  rationale: Предлог אֶל здесь связывает поднятие сердца с поднятыми руками. «Вместе с» сохраняет необычный образ и не превращает сердце и руки в два полностью независимых дополнения.
- source_word: אֶל־אֵל בַּשָּׁמָיִם
  choice: к Богу на небесах
  rationale: Естественно и близко передаёт направление к Богу, пребывающему на небесах.
theological_decisions:
- issue: Соотношение сердца и рук в молитвенном жесте
  choice: «сердца вместе с руками»
  alternative: «сердца в руках» / «сердца и руки»
  rationale: Масоретский текст допускает трудность в понимании אֶל־כַּפָּיִם. Выбранный вариант сохраняет единство внутреннего обращения и внешнего жеста, не вводя идею буквального помещения сердец в руки и не сглаживая конструкцию до простого «и».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формула краткая, призывная и пригодная для публичного чтения.
