lexical_decisions:
- source_word: תִּרְדֹּף
  choice: Ты будешь преследовать
  rationale: Форма qal imperfect 2-го лица мужского рода единственного числа обращена к Богу. Будущее время сохраняет прямой характер молитвенного обращения, а возможный оттенок просьбы отмечен в сноске.
- source_word: בְּאַף
  choice: в гневе
  rationale: אַף буквально означает «нос», а идиоматически — «гнев»; предлог בְּ указывает на образ действия или сопутствующее состояние.
- source_word: וְתַשְׁמִידֵם
  choice: и истребишь их
  rationale: Hiphil imperfect от שׁמד с местоименным суффиксом 3-го лица множественного числа выражает полное уничтожение. «Истребишь» естественно передаёт силу глагола в возвышенной поэтической речи.
- source_word: מִתַּחַת
  choice: из-под
  rationale: Сохраняется пространственный образ удаления «из-под, из-под пространства под» небес.
- source_word: שְׁמֵי
  choice: небес
  rationale: Форма сопряжённого состояния множественного числа передана словом «небес», что сохраняет возвышенный поэтический регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени Бога, а не заменён титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя; «Яхве» непосредственно передаёт тетраграмматон и не подменяет его титулом.
- issue: Модальная сила форм imperfect в молитвенном контексте
  choice: 'будущее время: «Ты будешь… и истребишь…»'
  alternative: 'пожелание-просьба: «Преследуй… и истреби…» или «Да будешь Ты преследовать…»'
  rationale: Формы допускают как уверенно высказанное будущее, так и волитивную молитвенную просьбу. Основной текст сохраняет формальную неоднозначность будущего, а молитвенный оттенок указан в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Сохранены прямое обращение к Богу, сильная лексика суда и пространственный образ еврейского текста.
