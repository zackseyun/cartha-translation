  text: You will pursue them in anger and destroy them from under the heavens of Yahweh[a][b].
translation:
  language: ru
  text: Преследуй их в гневе и уничтожь их из-под небес Яхве[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты будешь преследовать их в гневе и уничтожишь их»; еврейские формы глаголов могут также выражать будущее действие.'
