  text: קָרָ֤אתִי שִׁמְ/ךָ֙ יְהוָ֔ה מִ/בּ֖וֹר תַּחְתִּיּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/055.yaml
  text: I called on your name[a], O Yahweh, from the depths of the pit.
translation:
  language: ru
  text: 'Я призвал Твоё имя, Яхве,

    из глубин ямы.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из нижних мест ямы»; возможно также: «из самой глубокой ямы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרָאתִי
  choice: Я призвал
  rationale: Форма qal, перфект, 1-е лицо единственного числа от קרא. При дополнении «Твоё имя» выражение означает обращение к Богу с призывом; буквальная конструкция естественно сохраняется по-русски.
- source_word: שִׁמְךָ
  choice: Твоё имя
  rationale: Буквально передаёт еврейское выражение, в котором призывание имени означает обращение к самой названной Личности; замена на простое «Тебя» устранила бы исходный образ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом «Господь».
- source_word: מִבּוֹר
  choice: из… ямы
  rationale: בּוֹר может обозначать яму, водосборник или темницу в виде ямы. «Яма» сохраняет широкий буквальный и метафорический смысл в данном контексте.
- source_word: תַּחְתִּיּוֹת
  choice: из глубин
  rationale: Множественная форма от תחת обозначает нижние или самые низкие места. Сочетание «из глубин ямы» звучит естественно и передаёт образ крайней глубины.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Смысл выражения «призвать имя»
  choice: сохранить буквальную идиому «призвал Твоё имя»
  alternative: воззвал к Тебе
  rationale: Еврейская конструкция подразумевает молитвенное обращение к Богу, но буквальная передача сохраняет значимый библейский образ имени, не сводя его к поясняющему пересказу.
translation_notes:
  register: Современный литературный русский язык с кратким, молитвенно-поэтическим строем. Местоимение обращения к Богу написано с прописной буквы согласно распространённой русской религиозно-литературной норме.
