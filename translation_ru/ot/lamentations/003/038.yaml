  yaml_path: translation/ot/lamentations/003/038.yaml
  text: Do not both calamities and good come from the mouth of the Most High?[a]
translation:
  language: ru
  text: Не из уст ли Всевышнего исходят бедствия[a] и благо?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зло» или «несчастья»; еврейское слово רָעוֹת широко обозначает пагубное, тяжёлое или неблагоприятное. Здесь выбрано «бедствия», чтобы не создавать впечатления, будто непременно имеется в виду нравственное зло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפִּי
  choice: из уст
  rationale: Сохраняет буквальный древнееврейский образ уст как источника изречения или повеления и естественно звучит по-русски.
- source_word: עֶלְיוֹן
  choice: Всевышнего
  rationale: Устоявшаяся и понятная передача божественного титула עֶלְיוֹן, выражающего высшее положение Бога.
- source_word: לֹא
  choice: не… ли
  rationale: В данном контексте отрицание естественно передаётся как риторический вопрос; русская конструкция «не… ли» сохраняет и отрицательную форму, и ожидаемый утвердительный ответ.
- source_word: תֵצֵא
  choice: исходят
  rationale: Глагол буквально означает «выходить, исходить»; вместе с «из уст» эта передача сохраняет образ оригинала без неестественной буквальности.
- source_word: הָרָעוֹת
  choice: бедствия
  rationale: В контексте слово обозначает пагубные, тяжёлые события или несчастья; «бедствия» не сужает значение до нравственного зла.
- source_word: וְהַטּוֹב
  choice: и благо
  rationale: Субстантивированное прилагательное в единственном числе передано существительным «благо», что сохраняет широкое значение благоприятного или доброго удела и числовую асимметрию оригинала.
theological_decisions:
- issue: Следует ли передавать רָעוֹת как нравственное зло или как тяжёлые, пагубные события
  choice: «бедствия»
  alternative: «зло», «несчастья»
  rationale: Контекст говорит о неблагоприятном и благоприятном, находящемся под властью Всевышнего. «Бедствия» сохраняет утверждение текста, но не навязывает вывод, будто речь непременно идёт о происхождении нравственного зла.
- issue: Следует ли понимать стих как риторический вопрос или как прямое отрицательное утверждение
  choice: 'Риторический вопрос: «Не из уст ли…?»'
  alternative: «Из уст Всевышнего не исходят бедствия и благо»
  rationale: 'Связь со стихами 37–39 указывает на ожидаемый утвердительный ответ: происходящее не бывает независимо от Божьего повеления. Конструкция «не… ли» ясно передаёт эту риторическую функцию, не устраняя формального отрицания.'
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены поэтический образ «из уст», божественный титул «Всевышний», риторическая форма вопроса и противопоставление множественного «бедствия» единственному «благо».
