source:
  edition: WLC
  text: תָּשִׁ֨יב לָ/הֶ֥ם גְּמ֛וּל יְהוָ֖ה כְּ/מַעֲשֵׂ֥ה יְדֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/064.yaml
  text: You will repay them[a], O Yahweh[b], according to the work of their hands.
translation:
  language: ru
  text: Ты воздашь им[a], Яхве, по делам их рук[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Воздай им, Яхве». Еврейскую глагольную форму можно понять и как молитвенную просьбу, и как уверенное утверждение.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «по делу их рук» — то есть сообразно тому, что они сделали.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב לָהֶם גְּמוּל
  choice: Ты воздашь им
  rationale: Глагол שוב в породе хифиль означает «вернуть, обратить обратно», а в сочетании с גְּמוּל выражает воздаяние за содеянное. Русское «воздашь им» естественно передаёт этот смысл, не создавая тяжеловесного сочетания вроде «вернёшь им воздаяние».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул «Господь».
- source_word: כְּמַעֲשֵׂה יְדֵיהֶם
  choice: по делам их рук
  rationale: 'Предлог כְּ указывает на соответствие: воздаяние сообразно содеянному. Образ «рук» сохранён как еврейская метонимия человеческих поступков; множественное «делам» звучит по-русски естественно при собирательном значении еврейского единственного числа.'
theological_decisions:
- issue: Наклонение תָּשִׁיב в контексте молитвы
  choice: Ты воздашь им
  alternative: Воздай им
  rationale: Форма йиктоль допускает как уверенное утверждение о будущем, так и молитвенное пожелание. Основной текст сохраняет оттенок уверенности, а возможное молитвенное прочтение отмечено в сноске.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с лаконичным, молитвенно-поэтическим строем. Местоимение «Ты» передаёт прямое обращение; образ рук сохранён, но фраза оформлена естественно для русского читателя.
