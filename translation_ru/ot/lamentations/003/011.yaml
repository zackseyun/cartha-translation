    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכַי
  choice: мои пути
  rationale: Сохранены множественное число и конкретный образ путей, обозначающих жизненный ход говорящего.
- source_word: סוֹרֵר
  choice: отвёл ... в сторону
  rationale: Передаёт направительное значение отклонения или увода в сторону, не заменяя образ путей более отвлечённым выражением.
- source_word: וַיְפַשְּׁחֵנִי
  choice: растерзал меня
  rationale: Редкий глагол обозначает насильственное разрывание; выбор естественен по-русски и допускает образ нападения хищника из ближайшего контекста, не утверждая его однозначно.
- source_word: שָׂמַנִי
  choice: оставил меня
  rationale: В сочетании с обозначением итогового состояния передаёт результативную силу глагола שׂים более естественно, чем буквальное «сделал меня».
- source_word: שֹׁמֵם
  choice: опустошённым
  rationale: Передаёт состояние разорения и внутренней опустошённости, сохраняя образ полного разрушения.
