    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָה
  choice: Ты видел
  rationale: Форма qal perfect 2 м. ед. обращена к Богу. В русском контексте плача естественно простое прошедшее время, при этом результат увиденного сохраняет актуальность.
- source_word: כָּל
  choice: всю / все
  rationale: Дважды выражает полноту; род и число русской формы согласованы с соответствующими существительными.
- source_word: נִקְמָתָם
  choice: всю их мстительность
  rationale: Существительное נְקָמָה обозначает месть или мстительное действие. «Мстительность» естественно передаёт направленную против говорящего враждебность и не требует добавлять слово «акты».
- source_word: מַחְשְׁבֹתָם
  choice: все их замыслы
  rationale: מַחֲשָׁבוֹת может означать мысли, планы или замыслы; в данном враждебном контексте «замыслы» передаёт возможный злой умысел, не делая его чрезмерно явным.
- source_word: לִי
  choice: против меня
  rationale: Предлог לְ может выражать отношение или направленность. Контекст мести и вражеских замыслов поддерживает значение «против меня», хотя грамматически возможно более нейтральное понимание.
