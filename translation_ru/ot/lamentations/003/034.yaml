lexical_decisions:
- source_word: לְדַכֵּא
  choice: сокрушать
  rationale: Инфинитив с לְ продолжает перечень неправедных действий в стихах 34–36. Глагол דכא передаёт идею сокрушения, подавления; «сокрушать» сохраняет конкретный и сильный образ исходного текста.
- source_word: תַּחַת
  choice: под
  rationale: 'Пространственное значение предлога непосредственно передаёт образ: узников сокрушают «под ногами».'
- source_word: רַגְלָיו
  choice: его ногами
  rationale: Еврейская форма — множественное число с местоименным суффиксом 3-го лица мужского рода единственного числа. Русское «его ногами» естественно в данном обороте.
- source_word: כֹּל
  choice: всех
  rationale: Форма «всех» точно передаёт совокупный охват перед существительным во множественном числе.
- source_word: אֲסִירֵי
  choice: узников
  rationale: Слово обозначает заключённых или пленников. «Узники» подходит поэтическому регистру Плача и контексту несправедливого угнетения, оставаясь понятным современному читателю.
- source_word: אָרֶץ
  choice: земли
  rationale: Слово אֶרֶץ может означать как всю землю, так и определённую страну или землю. Русское «земли» естественно сохраняет широкий поэтический смысл, а более узкое прочтение отмечено в сноске.
