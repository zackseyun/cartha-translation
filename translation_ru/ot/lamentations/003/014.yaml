lexical_decisions:
- source_word: הָיִיתִי
  choice: Я стал
  rationale: Перфект Qal 1-го лица ед. числа от היה обозначает наступившее состояние; «стал» естественно передаёт результат пережитого и не исключает его продолжения.
- source_word: שְּׂחֹק
  choice: посмешищем
  rationale: Существительное обозначает насмешку или того, над кем смеются; русское «посмешище» точно и идиоматично в конструкции со «стал».
- source_word: לְכָל עַמִּי
  choice: для всего моего народа
  rationale: Предлог לְ указывает на отношение к тем, для кого говорящий сделался предметом насмешек; перевод сохраняет прямое значение עַמִּי без добавочного усиления «собственного».
- source_word: נְגִינָתָם
  choice: их песней
  rationale: Слово может означать песню, музыку или насмешливую песню. Основной текст сохраняет более широкое «песня», а контекст и сноска передают вероятный издевательский оттенок.
- source_word: כָּל הַיּוֹם
  choice: на весь день
  rationale: 'В сочетании с «их песней» эта формулировка естественно передаёт непрерывность: говорящий постоянно служит темой их песни.'
