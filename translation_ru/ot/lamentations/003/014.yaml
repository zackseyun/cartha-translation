translation_notes:
  register: Современный литературный русский язык; сохранён сжатый поэтический параллелизм и двусмысленность נְגִינָתָם. Маркер сноски поставлен после «народа», по модели консультационного текста, хотя сноска поясняет последующее выражение «их песней».
