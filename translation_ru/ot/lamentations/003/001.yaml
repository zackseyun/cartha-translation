lexical_decisions:
- source_word: אֲנִי הַגֶּבֶר
  choice: Я — тот человек
  rationale: Начальная самостоятельная форма местоимения имеет эмфатическую силу, а определённый артикль при גֶּבֶר указывает на конкретное самообозначение. Конструкция с тире и «тот» естественно передаёт это по-русски.
- source_word: רָאָה
  choice: увидел
  rationale: Сохранено прямое значение глагола «видеть». В данном поэтическом контексте оно также допускает смысл пережитого на собственном опыте, но этот смысл не подставлен вместо образа исходного текста.
- source_word: עֳנִי
  choice: бедствие
  rationale: Слово обозначает тяжёлое несчастье, угнетение или страдание. «Бедствие» сохраняет широту значения и не сужает его до материальной бедности.
- source_word: בְּשֵׁבֶט
  choice: под жезлом
  rationale: שֵׁבֶט — жезл, посох или розга; здесь это орудие карающей силы. «Под жезлом» сохраняет образ и передаёт подчинённость удару, не устраняя неоднозначность предлога בְּ.
- source_word: עֶבְרָתוֹ
  choice: его ярости
  rationale: עֶבְרָה выражает сильный, бурный гнев. «Ярость» передаёт интенсивность и соответствует возвышенному, скорбному регистру; местоименный суффикс сохранён без явного добавления имени Бога.
theological_decisions:
- issue: К кому относится местоимение в выражении «его ярости»
  choice: Сохранить местоимение «его», не добавляя в основной текст «Бога» или «Господа».
  alternative: «ярости Господа»; «Божьей ярости»
  rationale: В еврейском стихе стоит только местоименный суффикс третьего лица мужского рода. Контекст указывает на Бога, однако явное называние референта сняло бы литературную недосказанность оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством плача. Синтаксис остаётся ясным для широкого читателя; поэтические образы «увидел» и «жезл» сохранены, а неоднозначность предлога и местоименного референта не устранена.
