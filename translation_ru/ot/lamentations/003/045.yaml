lexical_decisions:
- source_word: סְחִי
  choice: отбросами
  rationale: Редкое существительное обозначает нечто грязное, низкое или соскобленное и выброшенное. «Отбросами» естественно и выразительно передаёт унижение, не прибегая к архаизму.
- source_word: וּמָאוֹס
  choice: и мерзостью
  rationale: Слово связано с отвержением и отвращением и может обозначать нечто презираемое, гнусное. «Мерзостью» сохраняет оттенок омерзения и образует сильную смысловую пару с «отбросами».
- source_word: תְּשִׂימֵנוּ
  choice: Ты сделал нас
  rationale: 'Глагол שׂים буквально значит «помещать, ставить», но в данной конструкции выражает приведение в состояние: «сделать кем-либо/чем-либо». Перфект передан прошедшим временем.'
- source_word: בְּקֶרֶב
  choice: среди
  rationale: Предлог с существительным буквально выражает нахождение «в середине»; в данном социальном контексте современное русское «среди» точно и естественно.
- source_word: הָעַמִּים
  choice: народов
  rationale: Множественное число עַמִּים прежде всего означает «народы»; контекст допускает также политико-этническое понимание «народы мира / языческие народы», традиционно передаваемое как «племена» или «народы».
