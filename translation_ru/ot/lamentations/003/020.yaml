lexical_decisions:
- source_word: זָכוֹר תִּזְכּוֹר
  choice: всё вспоминает
  rationale: Сочетание инфинитива абсолютного с личной формой того же корня усиливает действие. «Всё вспоминает» естественно передаёт настойчивое, непрекращающееся воспоминание, не превращая оборот в повеление.
- source_word: וְתָשִׁיחַ
  choice: поникает
  rationale: Форма передаёт состояние униженности, подавленности или склонённости вниз. «Поникает» сохраняет образ движения вниз и звучит естественно в поэтической речи.
- source_word: עָלַי
  choice: во мне
  rationale: Буквально предлог означает «на мне/надо мной», однако в сочетании с «душа моя» речь идёт о внутреннем угнетении; по-русски это естественно выражается словами «во мне».
- source_word: נַפְשִׁי
  choice: Душа моя
  rationale: Сохраняет поэтический и антропологический образ еврейского נֶפֶשׁ, которое здесь может обозначать внутреннее существо или самого говорящего.
