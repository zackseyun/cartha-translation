  yaml_path: translation/ot/lamentations/003/046.yaml
  text: All our enemies have opened their mouths against us[a].
translation:
  language: ru
  text: Все наши враги разинули рты против нас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «открыли рты против нас»; этот оборот может подразумевать враждебную насмешку или злорадство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצוּ
  choice: разинули
  rationale: Форма qal perfect 3-го лица множественного числа от פצה означает «открыли»; в сочетании со словом «рот» глагол передаёт широкое открывание рта, нередко с оттенком враждебной насмешки или злорадства. «Разинули» естественно воспроизводит образ, не уточняя содержание речи.
- source_word: עָלֵינוּ
  choice: против нас
  rationale: Предлог עַל в контексте враждебного действия имеет направленно-противительный смысл; «против нас» точнее пространственного «над нами».
- source_word: פִּיהֶם
  choice: рты
  rationale: В еврейском тексте буквально употреблено единственное число «их рот», но при множественном субъекте это распределительное выражение; по-русски естественно множественное «рты».
- source_word: כָּל
  choice: Все
  rationale: Перед «нашими врагами» слово имеет собирательное значение и естественно передаётся как «все».
- source_word: אֹיְבֵינוּ
  choice: наши враги
  rationale: Прямой и контекстуально уместный перевод существительного אֹיֵב с суффиксом первого лица множественного числа.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением яркого поэтического образа. «Разинули рты» звучит сильнее нейтрального «открыли рты» и передаёт значение פצה, при этом возможный оттенок насмешки оставлен в примечании, а не внесён однозначно в основной текст.
