source:
  edition: WLC
  text: קַלִּ֤ים הָיוּ֙ רֹדְפֵ֔י/נוּ מִ/נִּשְׁרֵ֖י שָׁמָ֑יִם עַל הֶ/הָרִ֣ים דְּלָקֻ֔/נוּ בַּ/מִּדְבָּ֖ר אָ֥רְבוּ לָֽ/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/019.yaml
  text: Our pursuers were swifter than the eagles of the heavens[a]; on the mountains they pursued us; in the wilderness they lay in wait for us.
translation:
  language: ru
  text: Преследователи наши были быстрее орлов небесных[a]; по горам они гнались за нами, в пустыне подстерегали нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «небесных грифов»; еврейское слово נֶשֶׁר может обозначать как орла, так и крупного грифа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלִּים
  choice: быстрее
  rationale: Предлог מִן задаёт сравнительный смысл; «быстрее» естественно передаёт его по-русски и сохраняет поэтическую силу образа.
- source_word: רֹדְפֵינוּ
  choice: преследователи наши
  rationale: Прямое именное соответствие причастной форме от רדף («преследовать, гнаться»); инверсия сохраняет dignified поэтический регистр без архаизации.
- source_word: מִנִּשְׁרֵי שָׁמָיִם
  choice: орлов небесных
  rationale: נשר может обозначать орла либо крупного грифа; «орлы» наиболее естественно передают здесь образ стремительности, а «небесных» сохраняет еврейскую конструкцию и возвышенный стиль.
- source_word: עַל הֶהָרִים
  choice: по горам
  rationale: В контексте погони עַל естественно обозначает пространство движения; «по горам» по-русски точнее и естественнее, чем статическое «на горах».
- source_word: דְּלָקֻנוּ
  choice: они гнались за нами
  rationale: דלק обозначает энергичное, неотступное преследование. «Гнались за нами» передаёт динамику и избегает тяжёлого повтора существительного «преследователи» глаголом «преследовали».
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר — пустынная, безлюдная местность или степь; «пустыня» является обычным и понятным библейским соответствием в современном русском.
- source_word: אָרְבוּ לָנוּ
  choice: подстерегали нас
  rationale: Передаёт выжидательную засаду и незавершённо-длительный характер действия естественнее, чем событийное «устроили нам засаду».
