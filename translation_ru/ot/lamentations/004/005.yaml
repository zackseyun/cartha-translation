lexical_decisions:
- source_word: הָאֹכְלִים לְמַעֲדַנִּים
  choice: те, кто прежде питался деликатесами
  rationale: Субстантивированное причастие обозначает людей, для которых изысканная пища была привычной прежде; «прежде» естественно передаёт подразумеваемый контекстом перелом их положения.
- source_word: נָשַׁמּוּ
  choice: теперь изнывают
  rationale: Глагол выражает состояние опустошённости, разорения или оцепенения. Применительно к голодающим людям «изнывают» звучит естественно по-русски и передаёт их нынешнее бедственное состояние, не превращая образ в описание безлюдного места.
- source_word: בַּחוּצוֹת
  choice: на улицах
  rationale: Слово обозначает открытые общественные пространства города; «на улицах» — наиболее естественный современный русский эквивалент.
- source_word: הָאֱמֻנִים
  choice: выросшие
  rationale: Пассивное причастие от אמן здесь означает воспитанных, взращённых или окружённых заботой, а не «верных»; краткое «выросшие» ясно передаёт прежние условия жизни.
- source_word: עֲלֵי תוֹלָע
  choice: на багрянице
  rationale: תוֹלָע метонимически обозначает дорогую багряную ткань, окрашенную красителем из червеца. «На багрянице» сохраняет предлог и образ роскошного воспитания без технического пояснения в основном тексте.
- source_word: חִבְּקוּ
  choice: обнимают
  rationale: Буквальное значение глагола усиливает горький контраст между прежней роскошью и нынешним унижением.
- source_word: אַשְׁפַּתּוֹת
  choice: кучи отбросов
  rationale: Существительное обозначает места, куда сваливали отходы, включая золу и навоз. «Кучи отбросов» ясно выражает основной образ и не сужает значение исключительно до золы.
