source:
  edition: WLC
  text: פְּנֵ֤י יְהוָה֙ חִלְּקָ֔/ם לֹ֥א יוֹסִ֖יף לְ/הַבִּיטָ֑/ם פְּנֵ֤י כֹהֲנִים֙ לֹ֣א נָשָׂ֔אוּ זקנים לֹ֥א חָנָֽנוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/016.yaml
  text: The face of Yahweh has scattered them[a]; he will no longer look on them. They showed no regard for priests[c][b]; they showed no favor to elders.
translation:
  language: ru
  text: Лик Яхве рассеял их[a]; Он больше не взглянет на них. Они[d] не оказали почтения священникам[b] и не проявили милости к старейшинам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Присутствие Яхве разделило (рассеяло) их».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не подняли лица священников» — идиома, означающая, что им не оказали уважения или расположения.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «к пожилым людям»; также возможно: «не оказали благоволения старейшинам».'
    reason: lexical_alternative
  - marker: d
    text: К кому относится «они», в этом стихе прямо не указано.
    reason: textual_ambiguity
lexical_decisions:
- source_word: פְּנֵי יְהוָה
  choice: Лик Яхве
  rationale: פְּנֵי буквально означает «лицо, лик», а идиоматически может обозначать присутствие. «Лик» сохраняет конкретный поэтический образ и антропоморфный язык еврейского текста; личное имя יהוה передано как «Яхве».
- source_word: חִלְּקָם
  choice: рассеял их
  rationale: Пиэль глагола חלק может означать «разделить, распределить, рассеять». В контексте суда и изгнания «рассеял» естественно передаёт разобщение людей, не исключая основного образа разделения.
- source_word: לֹא יוֹסִיף לְהַבִּיטָם
  choice: Он больше не взглянет на них
  rationale: 'Сочетание יסף с инфинитивом при отрицании означает прекращение или неповторение действия: «больше не». Глагол נבט передан конкретным «взглянет», без истолкования как окончательного отвержения.'
- source_word: פְּנֵי כֹהֲנִים לֹא נָשָׂאוּ
  choice: не оказали почтения священникам
  rationale: Буквально выражение означает «не подняли лица священников», но נשא פנים является идиомой оказания расположения, уважения или предпочтения. В данном контексте «оказали почтение» ясно передаёт общественное неуважение и не вносит идею неправомерного лицеприятия.
- source_word: זקנים
  choice: старейшинам
  rationale: Слово может обозначать как старейшин общины, так и пожилых людей. Параллель со священниками поддерживает общественную роль «старейшин», тогда как альтернативное возрастное значение отмечено в сноске.
- source_word: לֹא חָנָנוּ
  choice: не проявили милости к
  rationale: חנן охватывает значения «быть милостивым, проявлять благоволение, щадить». «Не проявили милости» сохраняет смысл милосердия и естественно звучит по-русски.
theological_decisions:
- issue: Антропоморфный образ Божьего лика
  choice: Сохранить выражение «Лик Яхве рассеял их»
  alternative: «Присутствие Яхве рассеяло их» или «Сам Яхве рассеял их»
  rationale: Еврейский текст использует конкретный образ лица/лика. Его сохранение передаёт поэтическую силу и не требует буквального учения о телесности Бога.
- issue: Неявный субъект глаголов во второй половине стиха
  choice: Сохранить местоимение «они», не называя действующих лиц
  alternative: Уточнить субъект как врагов, народы или рассеянных жителей Иерусалима
  rationale: Формы глаголов стоят во множественном числе, но сам стих прямо не называет их субъект. Конкретизация устранила бы подлинную неоднозначность исходного текста.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической окраской. «Лик» выбран ради образности Плача, тогда как синтаксис остальных частей сделан ясным и естественным. Резкая смена единственного числа «Он» на множественное «они» сохранена как особенность исходного текста.
