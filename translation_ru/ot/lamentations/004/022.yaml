  text: תַּם עֲוֺנֵ/ךְ֙ בַּת צִיּ֔וֹן לֹ֥א יוֹסִ֖יף לְ/הַגְלוֹתֵ֑/ךְ פָּקַ֤ד עֲוֺנֵ/ךְ֙ בַּת אֱד֔וֹם גִּלָּ֖ה עַל חַטֹּאתָֽיִ/ךְ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/022.yaml
  text: Your punishment is finished[a], daughter Zion; he will not exile you again. He has punished your iniquity, daughter Edom[c][b]; he has uncovered your sins.
translation:
  language: ru
  text: Твоё наказание окончено[a], дочь Сиона; он больше не отправит тебя в изгнание. Он наказал тебя за твоё беззаконие[b], дочь Эдома; он раскрыл твои грехи[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоё беззаконие окончено»; или: «Твоя вина окончилась». Еврейское слово может обозначать беззаконие, вину либо наказание, которое они повлекли.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, буквально: «Он посетил твоё беззаконие», то есть призвал за него к ответу и подверг суду.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Он раскрыл твои грехи»; «Он выставил твои грехи напоказ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּם עֲוֺנֵךְ
  choice: Исчерпано наказание твоё
  rationale: תַּם выражает завершение, а עָוֹן может обозначать беззаконие, вину или следующее за ними наказание. Упоминание прекращения изгнания поддерживает здесь значение наказания. Инверсия сохраняет поэтическую выразительность без архаизации.
- source_word: בַּת צִיּוֹן
  choice: дочь Сиона
  rationale: Сохранена еврейская поэтическая персонификация города и народа Сиона.
- source_word: לֹא יוֹסִיף לְהַגְלוֹתֵךְ
  choice: Он больше не отправит тебя в изгнание
  rationale: Конструкция יסף с инфинитивом означает, что действие больше не повторится или не продолжится. Русская формулировка передаёт это естественно.
- source_word: פָּקַד עֲוֺנֵךְ
  choice: Он взыскал с тебя за беззаконие
  rationale: В контексте суда פקד означает призвать к ответу, подвергнуть взысканию. Формулировка сохраняет судебный смысл и отличает беззаконие от наказания в первой строке.
- source_word: בַּת אֱדוֹם
  choice: дочь Эдома
  rationale: Сохранена параллельная поэтическая персонификация Эдома.
- source_word: גִּלָּה עַל חַטֹּאתָיִךְ
  choice: Он обнажил твои грехи
  rationale: Пиэль גלה передаёт раскрытие или выставление скрытого напоказ. «Обнажил» сохраняет образность исходного текста.
theological_decisions:
- issue: Смысл עָוֹן в первой строке
  choice: «наказание»
  alternative: «беззаконие» или «вина»
  rationale: Связь со следующим обещанием не отправлять Сион снова в изгнание указывает на завершение кары, однако многозначность отмечена в сноске.
- issue: Неявный субъект יוֹסִיף, פָּקַד и גִּלָּה
  choice: «Он»
  alternative: «Господь»
  rationale: В еврейском стихе субъект не назван. Местоимение позволяет сохранить подразумеваемого деятеля, не добавляя прямо отсутствующее в стихе имя.
- issue: Суд над Эдомом
  choice: «взыскал с тебя за беззаконие»
  alternative: «посетил твоё беззаконие» или «наказал за твоё беззаконие»
  rationale: Выбранная формулировка ясно передаёт судебный смысл פקד, не делая значение шире исходного.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Сохранены обращения «дочь Сиона» и «дочь Эдома», образ обнажения грехов и неявность божественного субъекта. Все смысловые альтернативы, существенные для многозначных עָוֹן, פקד и גלה, вынесены в сноски.
