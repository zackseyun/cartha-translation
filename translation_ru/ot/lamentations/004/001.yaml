source:
  edition: WLC
  text: אֵיכָה֙ יוּעַ֣ם זָהָ֔ב יִשְׁנֶ֖א הַ/כֶּ֣תֶם הַ/טּ֑וֹב תִּשְׁתַּפֵּ֨כְנָה֙ אַבְנֵי קֹ֔דֶשׁ בְּ/רֹ֖אשׁ כָּל חוּצֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/001.yaml
  text: How the gold has grown dim[b][a], how the fine gold has changed! The holy stones are poured out at the head of every street.
translation:
  language: ru
  text: Как потускнело золото, как изменилось чистое золото! Священные камни[a] рассыпаны у начала каждой улицы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «камни святилища», «посвящённые камни». Еврейское выражение может обозначать храмовые камни, священные драгоценности или употребляться как поэтический образ.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «у головы каждой улицы»; возможно, имеются в виду начала улиц, входы на них или перекрёстки.'
    reason: cultural_note
lexical_decisions:
- source_word: אֵיכָה
  choice: Как
  rationale: Передаёт скорбное восклицание плача без добавления отсутствующего в тексте междометия; повтор «как» во второй части естественно воспроизводит поэтический параллелизм.
- source_word: יוּעַם
  choice: потускнело
  rationale: Хофаль выражает утрату света или блеска; «потускнело» естественно сочетается с золотом и не сводит образ к химическому повреждению.
- source_word: זָהָב
  choice: золото
  rationale: Прямой и обычный русский эквивалент.
- source_word: יִשְׁנֶא
  choice: изменилось
  rationale: Сохраняет общее значение перемены состояния или вида, не уточняя её характер сверх еврейского текста.
- source_word: הַכֶּתֶם הַטּוֹב
  choice: чистое золото
  rationale: Передаёт высокое качество драгоценного золота и сохраняет отличие от общего זָהָב; «чистое» звучит естественно в русском поэтическом контексте.
- source_word: תִּשְׁתַּפֵּכְנָה
  choice: рассыпаны
  rationale: Буквальный образ «излиты» по-русски плохо сочетается с камнями; «рассыпаны» естественно передаёт их множество, выброшенное и разметанное по городским улицам.
- source_word: אַבְנֵי קֹדֶשׁ
  choice: священные камни
  rationale: 'Близко передаёт «камни святости» и сохраняет неоднозначность: это могут быть камни святилища, посвящённые драгоценные камни либо поэтический образ людей.'
- source_word: בְּרֹאשׁ
  choice: у начала
  rationale: Сохраняет пространственный образ «у головы/начала», не закрепляя возможное контекстуальное толкование как перекрёстка или входа.
- source_word: כָּל חוּצוֹת
  choice: каждой улицы
  rationale: Передаёт распределительное значение כָּל и обычное городское значение חוּצוֹת.
theological_decisions:
- issue: Кого или что обозначают «священные камни»
  choice: Фраза переведена буквально, без определения конкретного референта.
  alternative: Камни святилища; священные драгоценности; в поэтическом смысле — жители или сыновья Сиона.
  rationale: Контекст допускает несколько образных прочтений, а следующий стих может побуждать видеть здесь людей; перевод не должен преждевременно устранять эту литературную и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественно-скорбным ритмом. Повтор «как» подчёркивает плачевное изумление; буквальная неоднозначность ключевого образа сохранена, а непривычные пространственные и предметные образы пояснены в сносках.
