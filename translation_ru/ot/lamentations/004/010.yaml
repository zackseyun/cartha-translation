id: LAM.4.10
reference: Lamentations 4:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יְדֵ֗י נָשִׁים֙ רַחֲמָ֣נִיּ֔וֹת בִּשְּׁל֖וּ יַלְדֵי/הֶ֑ן הָי֤וּ לְ/בָרוֹת֙ לָ֔/מוֹ בְּ/שֶׁ֖בֶר בַּת עַמִּֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/010.yaml
  text: The hands of compassionate women cooked their own children[b][a]; they became food for them in the destruction of the daughter of my people.
translation:
  language: ru
  text: Руки сострадательных женщин варили собственных детей[a]; те стали для них пищей при гибели дочери моего народа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «готовили собственных детей». Еврейский глагол означает приготовление пищи, нередко посредством варки.'
    reason: lexical_alternative
  - marker: b
    text: «Дочь моего народа» — еврейское поэтическое олицетворение народа, особенно Иерусалима или Сиона, постигнутого разорением.
    reason: cultural_note
lexical_decisions:
- source_word: יְדֵי נָשִׁים רַחֲמָנִיּוֹת
  choice: Руки сострадательных женщин
  rationale: Сохранён конкретный и резкий образ рук, а прилагательное передаёт трагический контраст между обычным состраданием этих женщин и поступком, к которому их привело бедствие.
- source_word: בִּשְּׁלוּ
  choice: варили
  rationale: Глагол означает приготовление пищи, часто варку; «варили» естественно по-русски и передаёт наиболее вероятный конкретный смысл.
- source_word: יַלְדֵיהֶן
  choice: собственных детей
  rationale: Притяжательный суффикс передан с естественным русским усилением «собственных», подчёркивающим ужас происходящего без добавления нового смысла.
- source_word: הָיוּ לְבָרוֹת לָמוֹ
  choice: те стали для них пищей
  rationale: Местоимение «те» ясно отсылает к детям, а конструкция сохраняет результирующий смысл и указывает, что пищей они стали для самих женщин.
- source_word: בְּשֶׁבֶר
  choice: при гибели
  rationale: Существительное обозначает сокрушение, крушение, разрушение; «гибель» здесь ёмко передаёт катастрофу народа и города.
- source_word: בַּת עַמִּי
  choice: дочери моего народа
  rationale: Буквально сохранено пророческое поэтическое олицетворение народа, особенно Иерусалима/Сиона, без сведения его к простой ссылке на «мой народ».
theological_decisions:
- issue: Сохранение образа בַּת עַמִּי
  choice: дочери моего народа
  alternative: моего народа
  rationale: Буквальный образ сохраняет поэтическое олицетворение и напряжённость плача, не навязывая единственного толкования того, относится ли выражение прежде всего к народу, Иерусалиму или Сиону.
- issue: Степень прямоты при описании людоедства
  choice: варили собственных детей; те стали для них пищей
  alternative: готовили своих детей; они служили им пищей
  rationale: Еврейский текст намеренно суров. Перевод не смягчает его и одновременно не добавляет деталей сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и резкой образности древнееврейского плача. Синтаксис сделан ясным для обычного читателя; метафора «дочь моего народа» сохранена и пояснена в сноске.
