base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/021.yaml
  text: Rejoice and be glad[a], daughter of Edom, you who dwell in the land of Uz[b]; the cup will also pass to you—you will become drunk and strip yourself bare.
translation:
  language: ru
  text: 'Ликуй и радуйся, дочь Эдома, живущая в земле Уц; также и до тебя дойдёт чаша[a]: ты опьянеешь и обнажишься[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чаша перейдёт и к тебе». Имеется в виду чаша суда.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «и будешь выставлена нагой». Еврейское выражение передаёт постыдное обнажение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂישִׂי וְשִׂמְחִי
  choice: Ликуй и радуйся
  rationale: Два повелительных глагола женского рода передают усиленный призыв к торжеству; сочетание естественно по-русски и сохраняет параллелизм.
- source_word: בַּת אֱדוֹם
  choice: дочь Эдома
  rationale: Сохранено пророческое олицетворение народа в образе дочери и согласование в женском роде.
- source_word: יושבתי בְּאֶרֶץ עוּץ
  choice: живущая в земле Уц
  rationale: Причастная форма передаёт постоянное проживание; «земля Уц» — ясное географическое обозначение.
- source_word: גַּם עָלַיִךְ תַּעֲבָר כּוֹס
  choice: И до тебя дойдёт чаша
  rationale: Передано значение приближения и достижения адресата, при этом сохранён образ чаши; גַּם отражено сочетанием «и до тебя».
- source_word: תִּשְׁכְּרִי
  choice: ты опьянеешь
  rationale: Глагол обозначает наступление опьянения и естественно продолжает образ выпитой чаши.
- source_word: וְתִתְעָרִי
  choice: и обнажишься
  rationale: Возвратная форма сохраняет значение обнажения и связанную с ним картину позора, не уточняя сверх текста, добровольно оно или вынужденно.
theological_decisions:
- issue: Образ чаши
  choice: Сохранить «чашу» как метафору суда
  alternative: 'Передать смысл прямо: «кара постигнет и тебя»'
  rationale: Образ чаши значим в пророческой речи и в библейских взаимосвязях; его устранение обеднило бы литературный и богословский смысл.
- issue: Характер начальных повелений
  choice: Сохранить прямую форму «Ликуй и радуйся» без пояснения иронии
  alternative: Явно обозначить насмешливый смысл
  rationale: Контекст показывает угрожающий поворот, однако сам стих не маркирует иронию отдельным словом; перевод не должен устранять эту риторическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Восклицательный знак после обращения подчёркивает резкий переход от призыва к ликованию к угрозе суда; двоеточие показывает последствия чаши. Все местоимения и формы согласованы с олицетворённой «дочерью Эдома».
