  text: וַ/יִּגְדַּל֙ עֲוֺ֣ן בַּת עַמִּ֔/י מֵֽ/חַטַּ֖את סְדֹ֑ם הַֽ/הֲפוּכָ֣ה כְמוֹ רָ֔גַע וְ/לֹא חָ֥לוּ בָ֖/הּ יָדָֽיִם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/006.yaml
  text: For the iniquity of the daughter of my people has grown greater than the sin of Sodom[a], which was overthrown in a moment[b], though no hands labored against her.
translation:
  language: ru
  text: Беззаконие дочери моего народа стало больше греха Содома[a], который был низвергнут в одно мгновение, и над ним не трудились ничьи руки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вина дочери моего народа стала больше вины Содома»; еврейское слово может означать беззаконие, вину или наказание за него.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная фраза на еврейском неясна. Возможные переводы: «и не заламывали над ним рук» или «и никакие руки не коснулись его». Вероятно, смысл в том, что Содом погиб внезапно, без длительного человеческого нападения.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: стало больше
  rationale: Форма от גדל передаёт становление или возрастание; «стало больше» естественно выражает сравнение, не превращая глагол в простую связку.
- source_word: עֲוֺן
  choice: беззаконие
  rationale: עָוֹן может обозначать беззаконие, вину или кару за него. Сопоставление с «грехом Содома» прежде всего поддерживает нравственный смысл, а возможное значение вины или наказания отмечено в сноске.
- source_word: בַּת עַמִּי
  choice: дочь моего народа
  rationale: Сохранена традиционная поэтическая персонификация Иерусалима и Иудеи, существенная для языка Плача.
- source_word: מֵחַטַּאת סְדֹם
  choice: больше греха Содома
  rationale: Предлог מִן выражает сравнение, а חַטָּאת в данном контексте естественнее всего означает «грех».
- source_word: הַהֲפוּכָה
  choice: он был низвергнут
  rationale: «Низвергнут» сохраняет отзвук повествования Бытия о ниспровержении Содома и точнее, чем общее «уничтожен», передаёт הפך.
- source_word: כְמוֹ רָגַע
  choice: в одно мгновение
  rationale: Идиоматически передаёт внезапность и краткость действия.
- source_word: וְלֹא חָלוּ בָהּ יָדָיִם
  choice: и руки над ним не трудились
  rationale: Сжатая и трудная еврейская фраза передана сравнительно буквально, сохраняя вероятный контраст между мгновенным падением Содома и длительными человеческими усилиями при осаде Иерусалима, но не устраняя неоднозначность.
theological_decisions:
- issue: Значение עָוֹן при сравнении с Содомом
  choice: нравственное беззаконие
  alternative: вина или наказание за беззаконие
  rationale: Непосредственное сопоставление с חַטַּאת, «грехом» Содома, благоприятствует нравственному смыслу. Однако семантика עָוֹן допускает также вину и её последствия, поэтому альтернатива сохранена в сноске.
- issue: Смысл заключительной фразы
  choice: Содом пал внезапно, без продолжительных усилий рук против него
  alternative: руки не заламывали над ним; руки не коснулись его
  rationale: Еврейский оборот необычен и допускает разные толкования. Основной текст сохраняет образ рук и вероятный контраст с долгой осадой Иерусалима, а сноска прямо сообщает о неуверенности.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической интонацией. Сохранены библейская персонификация «дочь моего народа» и намеренно необычный образ рук; двусмысленность трудной заключительной фразы не сглажена.
