source:
  edition: WLC
  text: ר֤וּחַ אַפֵּ֨י/נוּ֙ מְשִׁ֣יחַ יְהוָ֔ה נִלְכַּ֖ד בִּ/שְׁחִיתוֹתָ֑/ם אֲשֶׁ֣ר אָמַ֔רְנוּ בְּ/צִלּ֖/וֹ נִֽחְיֶ֥ה בַ/גּוֹיִֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/020.yaml
  text: The breath of our nostrils[a], Yahweh’s anointed, was captured in their pits—he of whom we said, “Under his shadow we will live among the nations.”
translation:
  language: ru
  text: 'Дыхание наших ноздрей — помазанник Яхве — был пойман в их ямах[a] — тот, о ком мы говорили: «Под его тенью мы будем жить среди народов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в их ловушках»; или: «в их западнях».'
    reason: Еврейское слово может обозначать как ямы, так и губительные ловушки или западни.
lexical_decisions:
- source_word: רוּחַ אַפֵּינוּ
  choice: дыхание наших ноздрей
  rationale: Сохраняет конкретный еврейский образ жизненного дыхания и передаёт глубокую зависимость народа от царя, не заменяя метафору толкованием «наша жизнь».
- source_word: מְשִׁיחַ יְהוָה
  choice: помазанник Яхве
  rationale: Передаёт царский титул буквально и естественно; в данном контексте речь идёт об историческом царе из дома Давида, а не прямо об эсхатологическом Мессии.
- source_word: נִלְכַּד
  choice: был пойман
  rationale: Форма нифаль обозначает, что он был пойман или захвачен; «пойман» также согласуется с последующим образом ям-ловушек.
- source_word: בִּשְׁחִיתוֹתָם
  choice: в их ямах
  rationale: Существительное допускает значение выкопанных ям, служащих ловушками. Конкретный образ сохранён в тексте, а смысловые варианты вынесены в примечание.
- source_word: אֲשֶׁר אָמַרְנוּ
  choice: тот, о ком мы говорили
  rationale: Ясно связывает относительное предложение с помазанником и естественно звучит по-русски.
- source_word: בְּצִלּוֹ
  choice: под его тенью
  rationale: Сохраняет исходную метафору защиты и политического покровительства, не подменяя её объяснением.
- source_word: נִחְיֶה
  choice: мы будем жить
  rationale: Прямо передаёт значение глагола «жить»; возможный оттенок выживания остаётся обусловлен контекстом.
- source_word: בַגּוֹיִם
  choice: среди народов
  rationale: Обозначает окружающие чужеземные народы; формулировка естественна и не вносит новозаветного оттенка слова «язычники».
theological_decisions:
- issue: Следует ли передавать מְשִׁיחַ יְהוָה так, чтобы прямо указывать на Мессию/Христа
  choice: «помазанник Яхве» как обозначение исторического царя из дома Давида
  alternative: «Мессия Яхве»
  rationale: Хотя מָשִׁיחַ является тем же словом, которое употребляется в значении «Мессия», непосредственный контекст говорит о пленении царя Иудеи. Перевод сохраняет богословски значимый титул, но не превращает стих в прямое мессианское пророчество.
translation_notes:
  register: Современный литературный русский язык с сохранением высокой поэтической образности Плача. Телесная метафора «дыхание наших ноздрей» и образ «под его тенью» намеренно не сглажены. Имя יהוה передано как «Яхве» в соответствии с консультационным слоем POB.
