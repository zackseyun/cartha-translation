base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/015.yaml
  text: “Turn aside! Unclean!” they cried to them[a]. “Turn aside, turn aside, do not touch!” For they have fled; they have even wandered. Among the nations they said[b], “They will stay no longer.”
translation:
  language: ru
  text: '«Прочь! Нечистые!» — кричали им. «Прочь, прочь! Не прикасайтесь!» Ибо они бежали[a] и скитались. Среди народов говорили: «Они больше не будут жить как пришельцы»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их прогнали». Значение редкого еврейского глагола נָצוּ в этом контексте спорно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Они больше не будут оставаться». Еврейский глагол לָגוּר означает жить в качестве пришельца, не у себя дома.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ
  choice: Прочь
  rationale: Краткий выкрик естественно передаёт повторённое повеление от סור отойти в сторону и держаться подальше, не уточняя, идёт ли речь об окончательном изгнании.
- source_word: טָמֵא
  choice: Нечистые
  rationale: Передаёт культовую и общественную нечистоту; форма множественного числа по-русски согласована с теми, к кому обращён возглас.
- source_word: קָרְאוּ לָמוֹ
  choice: кричали им
  rationale: Передаёт направленный к людям настойчивый публичный возглас.
- source_word: אַל תִּגָּעוּ
  choice: Не прикасайтесь
  rationale: Сохраняет прямое значение נגע и подразумеваемый запрет оскверняющего контакта.
- source_word: כִּי
  choice: И вот
  rationale: В данном поэтическом контексте частица может вводить последующее описание; перевод не навязывает строго причинной связи, которая по-русски звучала бы неясно.
- source_word: נָצוּ
  choice: они бежали
  rationale: Редкий глагол допускает значение бегства либо изгнания; основной текст выбирает естественное контекстуальное значение, а неоднозначность отмечена в сноске.
- source_word: גַּם נָעוּ
  choice: скитались
  rationale: נוע здесь естественно обозначает бесприютное перемещение; גַּם передаётся на уровне соединительной усилительной последовательности без тяжеловесного «даже».
- source_word: אָמְרוּ בַּגּוֹיִם
  choice: Среди народов говорили
  rationale: Безличная русская конструкция сохраняет вероятный смысл высказывания, звучавшего среди народов, и не делает изгнанников его говорящими.
- source_word: לֹא יוֹסִיפוּ לָגוּר
  choice: Им больше нельзя здесь жить
  rationale: גור обозначает проживание в качестве пришельцев. Контекст допускает модальное решение народов не позволять им оставаться; альтернативное, более нейтральное прочтение приведено в сноске.
theological_decisions:
- issue: Кто произносит заключительные слова и что они означают
  choice: 'Среди народов говорили: «Им больше нельзя здесь жить»'
  alternative: 'Среди народов они говорили: «Они больше не будут жить [там]»'
  rationale: Неогласованный субъект אָמְרוּ допускает разные соотнесения. Контекст изгнания поддерживает понимание, при котором народы отказывают беглецам в проживании, но местоименная неоднозначность не должна превращаться в богословски нагруженное утверждение.
translation_notes:
  register: Современный литературный русский язык с краткими, резкими возгласами, сохраняющими поэтическое повторение. Пунктуация разграничивает крики толпы, повествовательное описание и речь среди народов. Формулировки сносок сохраняют реальные лексические и синтаксические неоднозначности еврейского текста.
