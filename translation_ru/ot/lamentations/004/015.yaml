  naturalness: Краткие возгласы «Прочь!» и «Не прикасайтесь!» естественны и сохраняют напряжённый поэтический регистр. «Ибо они бежали и скитались» литературно и ясно; заключительная фраза с «жить как пришельцы» передаёт смысл без искусственной архаизации.
