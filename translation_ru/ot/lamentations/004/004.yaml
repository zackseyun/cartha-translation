  yaml_path: translation/ot/lamentations/004/004.yaml
  text: The tongue of the nursing infant sticks to the roof of his mouth because of thirst[a]; children ask for bread[b], but no one breaks it for them.
translation:
  language: ru
  text: Язык грудного младенца от жажды прилипает к его нёбу; малые дети просят хлеба, но некому разломить его для них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нет для них разламывающего». Разламывание хлеба здесь подразумевает, что его дают или раздают детям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבַק
  choice: прилипает
  rationale: Глагол обозначает плотное прилегание или прилипание; настоящее время сохраняет непосредственность поэтической картины.
- source_word: יוֹנֵק
  choice: грудной младенец
  rationale: Слово указывает на ребёнка, который ещё питается грудью; выбранное выражение кратко и ясно передаёт возраст и беспомощность.
- source_word: אֶל חִכּוֹ
  choice: к нёбу
  rationale: חֵךְ означает нёбо, внутреннюю верхнюю часть рта; русский эквивалент точен и естественен.
- source_word: בַּצָּמָא
  choice: от жажды
  rationale: Предлог здесь выражает причину или сопутствующее состояние; «от жажды» естественно передаёт причинный смысл.
- source_word: עוֹלָלִים
  choice: малые дети
  rationale: Существительное обозначает маленьких детей; определение «малые» сохраняет указание на их ранний возраст и уязвимость.
- source_word: שָׁאֲלוּ
  choice: просят
  rationale: Основное значение — просить; контекст передаёт отчаяние без усиления глагола до «умоляют».
- source_word: לֶחֶם
  choice: хлеб
  rationale: Сохранён конкретный образ хлеба, а не обобщённое «пища».
- source_word: פֹּרֵשׂ
  choice: разломить
  rationale: В данном контексте причастие описывает разламывание хлеба для последующей передачи или раздачи; конкретный образ сохранён в основном тексте.
- source_word: אֵין לָהֶם
  choice: некому ... для них
  rationale: Безличная русская конструкция естественно передаёт еврейское «нет для них [того, кто]».
