base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/013.yaml
  text: Because of the sins of her prophets[a], the iniquities of her priests, who poured out in her midst the blood of the righteous[b],
translation:
  language: ru
  text: 'За грехи её пророков,

    за беззакония её священников —

    пророков и священников, проливавших[a] в её среде кровь праведников.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское причастие может относиться к пророкам и священникам вместе; возможно и более узкое понимание: «за грехи её пророков, за беззакония её священников, проливавших в её среде кровь праведников».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: מֵחַטֹּאת
  choice: За грехи
  rationale: Предлог מִן здесь выражает причину бедствия. Русское «за грехи» естественно передаёт причинно-возмездный смысл, не добавляя отсутствующего в тексте сказуемого.
- source_word: נְבִיאֶיהָ
  choice: её пророков
  rationale: Форма с суффиксом 3-го лица женского рода относится к городу; притяжательное «её» сохраняет эту связь.
- source_word: עֲוֺנוֹת
  choice: беззакония
  rationale: עָוֹן обозначает нравственную порочность и вину; «беззакония» сохраняет вес слова и отличает его от חַטֹּאת «грехи» в первой строке.
- source_word: כֹּהֲנֶיהָ
  choice: её священников
  rationale: Прямое современное соответствие форме с притяжательным суффиксом.
- source_word: הַשֹּׁפְכִים
  choice: проливавших
  rationale: Причастие относится одновременно к пророкам и священникам. Русское «проливать кровь» — естественное устойчивое выражение, точно передающее שפך в данном контексте.
- source_word: בְּקִרְבָּהּ
  choice: среди неё
  rationale: Передаёт совершение кровопролития внутри олицетворённого города и сохраняет местоименную отсылку к нему.
- source_word: דַּם
  choice: кровь
  rationale: Прямое соответствие еврейскому существительному и объект глагольного действия.
- source_word: צַדִּיקִים
  choice: праведников
  rationale: Сохраняет выраженную в еврейском тексте нравственную категорию и не сужает её до одной лишь юридической невиновности.
theological_decisions:
- issue: Передавать ли צַדִּיקִים как нравственную категорию или только как судебную невиновность
  choice: праведников
  alternative: невинных
  rationale: «Праведников» точнее сохраняет этическое и богословское содержание צַדִּיקִים; «невинных» возможно по контексту, но оно уже по значению.
- issue: К кому относится причастие הַשֹּׁפְכִים
  choice: к пророкам и священникам вместе
  alternative: только к священникам
  rationale: Множественное причастие после двух параллельных групп естественно характеризует обе группы. Синтаксис теоретически допускает более узкую привязку к ближайшему существительному, поэтому это отмечено в сноске.
translation_notes:
  register: Современный литературный русский с поэтическим членением на параллельные строки. Сохранены незавершённость фразы в пределах стиха и олицетворение Иерусалима посредством местоимения «её».
