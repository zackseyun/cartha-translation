  text: כִּלָּ֤ה יְהוָה֙ אֶת חֲמָת֔/וֹ שָׁפַ֖ךְ חֲר֣וֹן אַפּ֑/וֹ וַ/יַּצֶּת אֵ֣שׁ בְּ/צִיּ֔וֹן וַ/תֹּ֖אכַל יְסוֹדֹתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/011.yaml
  text: Yahweh has exhausted his wrath[a]; he has poured out his burning anger. He kindled a fire in Zion[b], and it consumed her foundations.
translation:
  language: ru
  text: Яхве исчерпал Свою ярость[a], излил Свой пылающий гнев[b]. Он разжёг огонь на Сионе, и он поглотил основания Сиона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «довёл Свою ярость до конца»; также возможно: «полностью израсходовал Свою ярость».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «жар Своего гнева» или «пыл Своего гнева».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּלָּה
  choice: исчерпал
  rationale: Глагол означает доведение до конца или полное израсходование; «исчерпал» естественно передаёт мысль о ярости, проявленной во всей полноте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму, прямо представленную в еврейском тексте.
- source_word: חֲמָתוֹ
  choice: Свою ярость
  rationale: חֵמָה обозначает сильный гнев или ярость; «ярость» сохраняет вес и отличает это слово от следующего выражения חֲרוֹן אַפּוֹ.
- source_word: שָׁפַךְ
  choice: излил
  rationale: Сохранён образ буквального излияния, устойчивый и естественный в русском языке применительно к гневу.
- source_word: חֲרוֹן אַפּוֹ
  choice: Свой пылающий гнев
  rationale: Выражение передаёт жар и силу гнева; «пылающий гнев» сохраняет тепловой образ без неестественного буквализма.
- source_word: וַיַּצֶּת אֵשׁ
  choice: Он разжёг огонь
  rationale: Передаёт значение зажечь, разжечь или воспламенить, сохраняя образ огня.
- source_word: בְּצִיּוֹן
  choice: на Сионе
  rationale: Для русского названия возвышенности и города сочетание «на Сионе» естественно передаёт локативное בְּ.
- source_word: וַתֹּאכַל
  choice: тот поглотил
  rationale: «Поглотил» естественно описывает разрушительное действие огня; местоимение «тот» однозначно отсылает к огню.
- source_word: יְסוֹדֹתֶיהָ
  choice: основания Сиона
  rationale: Еврейский суффикс женского рода относится к олицетворённому Сиону. Повтор имени позволяет сохранить референт без грамматически неестественного русского «её» при существительном мужского рода «Сион».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя; транслитерация «Яхве» сохраняет его и не заменяет титулом.
- issue: Два параллельных обозначения Божьего гнева
  choice: «ярость» и «пылающий гнев» сохранены как разные выражения
  alternative: Свести оба выражения к одному слову «гнев»
  rationale: Еврейский текст использует חֵמָה и חֲרוֹן אַף. Их различение сохраняет поэтическое усиление и образ жара, не устраняя напряжённость картины суда.
- issue: Полнота совершившегося суда в כִּלָּה
  choice: «исчерпал»
  alternative: «довёл до конца»; «полностью израсходовал»
  rationale: Формулировка передаёт полноту проявления ярости, не добавляя вывода о том, что всякий возможный Божий гнев окончательно прекратился.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Сохранены параллелизм, метафоры излияния и огня и различие двух обозначений гнева. Повтор «Сиона» выбран ради ясности и грамматической естественности русского текста.
