  text: לֹ֤א הֶאֱמִ֨ינוּ֙ מַלְכֵי אֶ֔רֶץ ו/כל יֹשְׁבֵ֣י תֵבֵ֑ל כִּ֤י יָבֹא֙ צַ֣ר וְ/אוֹיֵ֔ב בְּ/שַׁעֲרֵ֖י יְרוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/012.yaml
  text: The kings of the earth did not believe[a], nor did any of the inhabitants of the world, that an adversary and an enemy would enter the gates of Jerusalem.
translation:
  language: ru
  text: Цари земли и все жители мира не верили, что в ворота Иерусалима войдёт враг, неприятель.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶאֱמִינוּ
  choice: не верили
  rationale: Hiphil от אמן здесь означает считать сообщаемое достоверным; прямое «не верили» естественно вводит последующее изъяснительное предложение.
- source_word: מַלְכֵי אֶרֶץ
  choice: цари земли
  rationale: В параллели со «всеми жителями мира» אֶרֶץ имеет широкий, вселенский смысл; выражение сохраняет возвышенный поэтический строй.
- source_word: וְכָל יֹשְׁבֵי תֵבֵל
  choice: и все жители мира
  rationale: Отрицание при общем сказуемом распространяется на оба однородных подлежащих. תֵבֵל обозначает обитаемый мир.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, чему не верили, а не причинное пояснение.
- source_word: יָבֹא
  choice: войдут
  rationale: Простой глагол означает «прийти», но при сочетании с вратами подразумевает проникновение в город. Будущее «войдут» сохраняет ожидаемое событие, не добавляя модальности возможности.
- source_word: צַר וְאוֹיֵב
  choice: враг и неприятель
  rationale: Два близких, но разных русских слова сохраняют усилительную парность еврейских существительных, не превращая их в повтор одного слова.
- source_word: בְּשַׁעֲרֵי יְרוּשָׁלִָם
  choice: во врата Иерусалима
  rationale: После глагола движения предлог ב указывает на вход через городские ворота; «врата» поддерживает поэтический регистр Плача, оставаясь понятным современному читателю.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической лексикой. Инверсия «Не верили цари земли» передаёт торжественно-плачевный ритм, не затрудняя понимания. Подлежащее «враг и неприятель» осмыслено как парное обозначение захватчиков, поэтому употреблено множественное «войдут»; форма сохраняет внутреннее напряжение образа и не вводит дополнительной модальности.
