  source_fidelity: Еврейский глагол יָבֹא стоит в единственном числе; два близких существительных צַר וְאוֹיֵב, вероятно, совместно характеризуют одного враждебного захватчика. Будущее «войдёт» точно передаёт ожидаемое событие без добавления модальности. «В ворота Иерусалима» адекватно выражает движение через/в городские ворота.
