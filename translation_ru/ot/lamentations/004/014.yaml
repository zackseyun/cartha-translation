  text: Слепые, они бродили по улицам,[a] осквернённые кровью,[b] так что никто не мог прикоснуться к их одежде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слепые». Выражение может описывать их образно — как людей, бродящих вслепую; в еврейском тексте нет слова «словно».'
    reason: alternative_reading
  - marker: b
