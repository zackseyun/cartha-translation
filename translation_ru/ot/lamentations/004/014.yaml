    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: נָעוּ
  choice: бродили
  rationale: Глагол נוע передаёт неуверенное, бесцельное или пошатывающееся движение; «бродили» естественно звучит по-русски и сохраняет образ дезориентации.
- source_word: עִוְרִים
  choice: словно слепые
  rationale: Буквально — «слепые». Хотя сравнительной частицы в еврейском нет, в данном контексте выражение естественно понимать как образ движения вслепую; прямое «слепыми» остаётся возможным и отмечено в сноске.
- source_word: בַּחוּצוֹת
  choice: по улицам
  rationale: חוּצוֹת обозначает городские улицы или открытые места; предлог и глагол движения естественно передаются сочетанием «по улицам».
- source_word: נְגֹאֲלוּ
  choice: осквернённые
  rationale: Нифаль глагола גאל здесь выражает загрязнение или осквернение, вероятно с оттенком ритуальной нечистоты, а не только внешние пятна.
- source_word: בַּדָּם
  choice: кровью
  rationale: Предлог ב указывает на вещество или средство осквернения; русский творительный падеж точно и естественно передаёт эту связь.
- source_word: בְּלֹא יוּכְלוּ
  choice: так что никто не мог
  rationale: Сжатая еврейская конструкция не называет однозначно субъекта следующего действия. По контексту вероятен смысл невозможности или запрета для окружающих прикасаться к осквернённым одеждам; неоднозначность отмечена в сноске.
- source_word: יִגְּעוּ
  choice: прикоснуться
  rationale: נגע обычно означает «касаться»; здесь это соответствует контексту нечистоты, передаваемой через соприкосновение.
- source_word: בִּלְבֻשֵׁיהֶם
  choice: к их одеждам
  rationale: Слово обозначает одежду, одеяния. Множественное «одеждам» сохраняет форму исходного текста и уместный возвышенный регистр.
theological_decisions:
- issue: Субъект глагола יִגְּעוּ («прикоснуться»)
  choice: 'Окружающие: «никто не мог прикоснуться»'
  alternative: 'Те же лица: «они не могли прикоснуться к своим одеждам»'
  rationale: Субъект в сжатом еврейском синтаксисе прямо не выражен. Контекст кровяного осквернения и последующее отстранение нечистых поддерживают безлично-обобщённое понимание, но альтернативу нельзя исключить, поэтому она вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сохранены краткость и мрачная образность плача; синтаксическая неоднозначность исходного текста не скрыта, а обозначена в сносках.
