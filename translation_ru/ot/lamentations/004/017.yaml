  yaml_path: translation/ot/lamentations/004/017.yaml
  text: Still our eyes failed[a], looking in vain for our help; in our watching we watched for a nation that could not save.
translation:
  language: ru
  text: Наши глаза всё ещё изнемогали в тщетном ожидании помощи; мы всё высматривали народ, который не мог спасти[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который не спас». Еврейскую фразу можно понять и как указание на неспособность спасти, и как констатацию того, что спасения не произошло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶינָה
  choice: всё ещё
  rationale: Частица выражает продолжающееся состояние; «всё ещё» естественно передаёт длительность ожидания.
- source_word: תִּכְלֶינָה
  choice: изнемогают
  rationale: Глагол כלה применительно к глазам описывает их истощение от долгого напряжённого ожидания. «Изнемогают» сохраняет телесный и поэтический образ.
- source_word: עֵינֵינוּ
  choice: наши глаза
  rationale: Буквальный образ сохранён как центральный для стиха.
- source_word: אֶל־עֶזְרָתֵנוּ הָבֶל
  choice: тщетно ожидая помощи
  rationale: Сжатая еврейская конструкция связывает направленность взгляда к ожидаемой помощи с её тщетностью. Русская формулировка естественно передаёт оба смысла, не превращая הבל в характеристику самой помощи как предмета.
- source_word: בְּצִפִּיָּתֵנוּ צִפִּינוּ
  choice: мы всё высматривали
  rationale: Сочетание существительного и однокоренного глагола выражает напряжённое, продолжительное всматривание в ожидании. Частица «всё» передаёт усиление, а «высматривали» — образ сторожевого наблюдения.
- source_word: גּוֹי
  choice: народ
  rationale: В контексте имеется в виду чужая политическая сила, от которой ожидали избавления; «народ» сохраняет обычное широкое значение גּוֹי и естественно звучит по-русски.
- source_word: לֹא יוֹשִׁעַ
  choice: не мог спасти
  rationale: Hiphil глагола ישׁע означает «спасти, избавить». Контекст несбывшейся надежды допускает понимание практической неспособности принести спасение.
theological_decisions:
- issue: 'Значение לֹא יוֹשִׁעַ: неспособность или фактическое отсутствие спасения'
  choice: который не мог спасти
  alternative: который не спас
  rationale: Еврейская форма прямо отрицает действие, но в контексте может указывать как на неспособность, так и на несостоявшееся спасение. Основной текст следует контексту практической неспособности, а примечание сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский с сохранением поэтического образа изнемогающих глаз и напряжённого ожидания. Синтаксис сделан ясным, но смысловая сжатость и неоднозначность заключительной фразы сохранены.
