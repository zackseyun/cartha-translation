  yaml_path: translation/ot/lamentations/004/009.yaml
  text: Better were those slain by the sword than those slain by hunger[a], who waste away, pierced through for lack of the produce of the field.
translation:
  language: ru
  text: 'Лучше участь тех, кто пал от меча, чем тех, кто гибнет от голода[a]: они угасают, пронзённые из-за отсутствия плодов полей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…чем тех, кто гибнет от голода: они истекают (или: изнемогают), пронзённые из-за отсутствия плодов полей». Еврейский текст этой части стиха труден: значение глагола, переданного словом «угасают», и смысл предлога перед выражением «плоды полей» не вполне ясны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבִים הָיוּ
  choice: Лучше тем
  rationale: Сравнительное употребление טוֹבִים с היה говорит не о нравственной доброте, а об относительно менее тяжёлой участи; краткая русская конструкция сохраняет скорбную поэтичность.
- source_word: חַלְלֵי חֶרֶב
  choice: кто погиб от меча
  rationale: חָלָל обозначает убитого, а конструкция с חֶרֶב указывает на орудие смерти. Формулировка естественна для современного русского языка.
- source_word: מֵחַלְלֵי רָעָב
  choice: чем тем, кто погиб от голода
  rationale: Префикс מ־ выражает сравнение. רָעָב допускает значения «голод» и «голодное бедствие»; здесь личное переживание мучительной смерти от голода наиболее непосредственно противопоставлено смерти от меча.
- source_word: שֶׁהֵם
  choice: они
  rationale: Сочетание относительной частицы с местоимением вводит пояснение о погибающих от голода; после двоеточия русское «они» ясно и естественно передаёт эту связь.
- source_word: יָזוּבוּ
  choice: медленно угасают
  rationale: Значение глагола в данном месте неясно и связано с образом истекания, иссякания или постепенного изнеможения. «Медленно угасают» передаёт длительность смерти от голода, не навязывая буквального образа текущей жидкости.
- source_word: מְדֻקָּרִים
  choice: пронзённые
  rationale: Причастие от דקר буквально означает «пронзённые». Сохранён яркий образ, сопоставляющий муки голода с раной.
- source_word: מִתְּנוּבֹת שָׂדָי
  choice: нехваткой плодов земли
  rationale: 'מ־ в контексте понято как указывающее на лишение или причину: люди гибнут из-за отсутствия урожая. תְּנוּבוֹת שָׂדָי обозначает плоды, урожай земли; «плоды земли» сохраняет поэтический регистр.'
