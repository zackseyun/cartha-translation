  source_fidelity: 'Начальное «Лучше тем» передаёт сравнительную оценку, но «кто погиб от голода» вступает в смысловое напряжение с последующим «они медленно угасают»: еврейская строка изображает жертв голода в процессе мучительного угасания. Кроме того, «пронзённые нехваткой» слишком прямо превращает нехватку в орудие пронзания; заключительная конструкция остаётся трудной и требует более осторожной причинно-лишительной передачи.'
