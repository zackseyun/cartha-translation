base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/008.yaml
  text: Their appearance is darker than soot[a]; they are not recognized in the streets. Their skin has shriveled on their bones[b]; it has become dry like wood.
translation:
  language: ru
  text: Их облик чернее сажи[a], на улицах их не узнают. Кожа у них стянулась на костях[b], стала сухой, как дерево.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чернее самой черноты». Еврейское слово может обозначать черноту вообще; «сажа» выбрана ради конкретного образа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кожа у них прилипла к костям». Еврейский глагол может описывать кожу, которая от истощения стянулась и плотно прилегла к костям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׁךְ מִשְּׁחוֹר
  choice: чернее сажи
  rationale: Еврейская сравнительная конструкция передаёт крайнюю степень потемнения. «Сажа» создаёт конкретный и естественный по-русски образ, тогда как слово שׁחור может обозначать также черноту вообще.
- source_word: תָּאֳרָם
  choice: их облик
  rationale: תאר обозначает вид, форму или внешность; «облик» кратко и достойно передаёт видимый внешний образ.
- source_word: לֹא נִכְּרוּ
  choice: их не узнают
  rationale: Нифаль от נכר указывает на неузнаваемость. Неопределённо-личная русская конструкция естественно передаёт пассивный смысл.
- source_word: בַּחוּצוֹת
  choice: на улицах
  rationale: חוּצוֹת здесь обозначает городские улицы или публичные места; «на улицах» — ясный современный эквивалент.
- source_word: צָפַד עוֹרָם עַל עַצְמָם
  choice: кожа у них съёжилась на костях
  rationale: Редкий глагол צָפַד описывает стягивание или сморщивание кожи от истощения. Формулировка сохраняет образ кожи, плотно стянувшейся поверх костей.
- source_word: יָבֵשׁ הָיָה כָעֵץ
  choice: стала сухой, как дерево
  rationale: Форма выражает наступившее состояние сухости; עֵץ в сравнении указывает на сухую, безжизненную древесину, однако русское «как дерево» ближе к форме исходного текста и естественно в данном образе.
