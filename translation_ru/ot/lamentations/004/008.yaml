  source_fidelity: 'Первое предложение верно передаёт сравнительную конструкцию и неузнаваемость. Во второй части «съёжилась на костях» неточно по-русски: «съёжиться» обычно относится к человеку/животному, принимающему сжатую позу, тогда как צָפַד в данном контексте описывает иссохшую, стянутую к костям кожу. «Стянулась на костях» сохраняет образ и не снимает лексической неоднозначности.'
