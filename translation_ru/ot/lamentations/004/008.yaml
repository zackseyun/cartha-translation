  terminology: '«Облик», «сажа», «улицы», «кожа» и «кости» удачны. «Как дерево» допустимо: в контексте речь идёт о сухости и одеревенении кожи; не следует уточнять образ как «древесина», поскольку еврейское עֵץ допускает более широкое «дерево/дерево́».'
