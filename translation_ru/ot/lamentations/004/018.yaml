base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/018.yaml
  text: They hunted our steps[a], so that we could not walk in our streets. Our end drew near; our days were fulfilled[c][b], for our end had come.
translation:
  language: ru
  text: Каждый наш шаг выслеживали[a], так что мы не могли ходить по нашим улицам. Наш конец приблизился; наши дни истекли[b], потому что настал наш конец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «За каждым нашим шагом следили» или «За нашими шагами охотились». Еврейский глагол передаёт враждебное выслеживание или преследование.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «наши дни наполнились», то есть отпущенное нам время завершилось.'
    reason: cultural_note
lexical_decisions:
- source_word: צָדוּ
  choice: охотились
  rationale: Глагол передаёт враждебное выслеживание или преследование; «охотились» сохраняет хищный образ исходного текста.
- source_word: צְעָדֵינוּ
  choice: за каждым нашим шагом
  rationale: Буквально — «наши шаги». Русская конструкция с «за» естественно выражает слежку, а «каждым» раскрывает охват движения, не устраняя конкретный образ шагов.
- source_word: מִלֶּכֶת
  choice: так что мы не могли ходить
  rationale: Предлог מִן при инфинитиве выражает воспрепятствование; явная конструкция результата естественна по-русски.
- source_word: בִּרְחֹבֹתֵינוּ
  choice: по своим улицам
  rationale: רְחֹבוֹת обозначает городские улицы, площади или открытые места; «улицы» наиболее естественно в данном контексте, а «своим» соотносит их с подлежащим.
- source_word: קָרַב קִצֵּינוּ
  choice: наш конец приблизился
  rationale: Сохраняет значение קרב и зловещую, но не истолкованную сверх текста формулировку קֵץ — «конец».
- source_word: מָלְאוּ יָמֵינוּ
  choice: наши дни истекли
  rationale: Буквально «наши дни наполнились» — идиома завершившегося отпущенного срока. «Истекли» естественно передаёт смысл по-русски; буквальный образ пояснён в примечании.
- source_word: כִּי בָא קִצֵּינוּ
  choice: потому что настал наш конец
  rationale: כִּי вводит основание, а повтор слова «конец» сохраняет риторический повтор קִצֵּינוּ.
theological_decisions:
- issue: Значение קֵץ в контексте гибели Иерусалима
  choice: конец
  alternative: гибель
  rationale: «Конец» непосредственно передаёт лексическое значение и сохраняет смысловую открытость; разрушительный оттенок достаточно ясен из контекста, поэтому его не следует вносить в перевод как однозначное толкование.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтической сжатости и повтора «наш конец». Формулировки понятны широкому читателю; архаизмы и конфессионально окрашенная терминология не используются.
