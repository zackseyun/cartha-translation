  source_fidelity: 'Смысл в целом передан верно: враждебное преследование, невозможность свободно ходить по городским улицам, приближение конца и завершение отпущенного времени сохранены. Однако оборот «За каждым нашим шагом охотились» по-русски неестественен и несколько размывает объект действия: в еврейском буквально преследуются/выслеживаются «наши шаги».'
