base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/002.yaml
  text: The precious sons of Zion[a], weighed out against fine gold—how they are regarded as clay jars[b], the work of a potter’s hands.
translation:
  language: ru
  text: Драгоценные сыны Сиона, сравненные с чистым золотом[a], — как же их считают глиняными сосудами[b], изделиями рук горшечника!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ценимые как чистое золото», «равные по ценности чистому золоту» или «взвешенные с чистым золотом». Еврейское выражение может указывать прежде всего на оценку, а не на буквальное взвешивание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «глиняными кувшинами» или «сосудами из обожжённой глины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי צִיּוֹן
  choice: сыны Сиона
  rationale: Буквально передаёт мужскую поэтическую форму «сыны»; в контексте она может обозначать жителей Сиона в более широком смысле.
- source_word: הַיְקָרִים
  choice: драгоценные
  rationale: Сохраняет значение высокой ценности и эмоциональную силу плача.
- source_word: הַמְסֻלָּאִים בַּפָּז
  choice: ценимые на вес чистого золота
  rationale: Естественно по-русски сочетает значение высокой оценки с возможным конкретным образом взвешивания по отношению к золоту.
- source_word: פָּז
  choice: чистое золото
  rationale: Обозначает золото высокого качества; это выражение понятно современному читателю и соответствует возвышенному поэтическому регистру.
- source_word: אֵיכָה
  choice: как же
  rationale: Передаёт не только вопрос, но и скорбное изумление, характерное для плача.
- source_word: נֶחְשְׁבוּ
  choice: их стали считать
  rationale: Передаёт нифаль глагола חשׁב в значении «быть сочтённым, считаться» и совершенный аспект еврейской формы.
- source_word: לְנִבְלֵי חֶרֶשׂ
  choice: глиняными сосудами
  rationale: Сохраняет противопоставление золоту и не сужает широкий термин «сосуды» до одного определённого вида керамической ёмкости.
- source_word: מַעֲשֵׂה יְדֵי יוֹצֵר
  choice: делом рук горшечника
  rationale: Сохраняет конкретный образ рук мастера и подчёркивает обычный, изготовленный характер глиняной посуды.
