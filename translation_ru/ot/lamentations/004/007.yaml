base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/007.yaml
  text: Her princes were purer than snow[a], whiter than milk; their bodies were more ruddy than corals[c][b], their form was like sapphire.
translation:
  language: ru
  text: Её князья[a] были чище снега, белее молока; их тела были румянее кораллов[b], их облик — словно сапфир[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её назореи» или «её посвящённые». Еврейское слово может обозначать людей, отделённых для Бога обетом, но здесь, возможно, имеются в виду знатные и выдающиеся жители Иерусалима.'
    reason: alternative_reading
  - marker: b
    text: Точное значение еврейского слова неизвестно; оно может обозначать также рубины, жемчуг или другой драгоценный материал красного либо блестящего цвета.
    reason: lexical_alternative
  - marker: c
    text: В древности словом, переведённым как «сапфир», могли называть лазурит, а не камень, который сегодня называется сапфиром.
    reason: cultural_note
lexical_decisions:
- source_word: נְזִירֶיהָ
  choice: её князья
  rationale: Слово может обозначать назореев или посвящённых, буквально отделённых, однако в контексте прежнего великолепия выдающихся жителей Иерусалима вероятен смысл «князья, знатные люди». Спорное буквальное значение сохранено в сноске.
- source_word: זַכּוּ
  choice: были чище
  rationale: Глагол выражает чистоту; сравнительная конструкция «чище снега» естественно передаёт еврейский поэтический образ.
- source_word: צַחוּ
  choice: белее
  rationale: Глагол обозначает светлую белизну или сияние; в сравнении с молоком уместно «белее».
- source_word: עֶצֶם
  choice: тела
  rationale: Основное значение — «кость», но здесь слово метонимически описывает телесный облик или сложение; буквальное «кости» в сочетании с румяностью по-русски создало бы неуместно анатомическое впечатление.
- source_word: אָדְמוּ
  choice: были румянее
  rationale: Глагол означает «быть красным, багряным»; «румянее» передаёт здоровый красноватый цвет в описании человеческой красоты.
- source_word: פְּנִינִים
  choice: кораллов
  rationale: Точное значение названия драгоценного материала не установлено. «Кораллы» хорошо согласуются с упоминанием красного, румяного цвета; другие возможности отмечены в сноске.
- source_word: גִּזְרָתָם
  choice: их облик
  rationale: Существительное обозначает форму, очертания или вид; «облик» сохраняет поэтический характер описания и не сужает его до телосложения.
- source_word: סַפִּיר
  choice: сапфир
  rationale: Сохранено традиционное название драгоценного камня; возможное отождествление с лазуритом поясняется в сноске.
theological_decisions:
- issue: Кого обозначает נְזִירֶיהָ
  choice: князья как вероятное контекстуальное обозначение знатных и выдающихся людей Иерусалима
  alternative: назореи; посвящённые
  rationale: Контекст противопоставляет прежнее великолепие городской знати её нынешнему унижению, но лексическая неоднозначность реальна и потому не устранена, а вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным поэтическим ритмом. Сравнительные образы оригинала сохранены; эллиптическая последняя часть передана естественной именной конструкцией с тире.
