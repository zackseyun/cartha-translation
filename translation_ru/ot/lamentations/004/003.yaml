  yaml_path: translation/ot/lamentations/004/003.yaml
  text: Even jackals offer the breast[a]; they nurse their young. The daughter of my people has become cruel[b], like ostriches in the wilderness.
translation:
  language: ru
  text: Даже шакалы дают грудь и кормят своих детёнышей; а дочь моего народа стала жестокой, как страусы в пустыне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «как совы в пустыне». Еврейское ענים традиционно понимают как «страусы», особенно в свете Иов 39:13–17.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תנין
  choice: шакалы
  rationale: В контексте кормления детёнышей речь, вероятнее всего, идёт о наземных млекопитающих; «шакалы» передаёт признанное контекстуальное значение слова, хотя его обычное значение шире и спорно.
- source_word: חָלְצוּ שַׁד
  choice: подставляют грудь
  rationale: Сочетание описывает предоставление или обнажение груди для кормления; «подставляют грудь» естественно передаёт материнское действие по-русски.
- source_word: הֵינִיקוּ
  choice: кормят
  rationale: Каузативная форма от ינק означает давать сосать, то есть кормить молоком; в непосредственном сочетании с «грудью» краткое «кормят» ясно и естественно.
- source_word: גּוּרֵיהֶן
  choice: своих детёнышей
  rationale: Общее обозначение потомства животных сохраняет применимость независимо от спорного определения вида.
- source_word: בַּת עַמִּי
  choice: дочь народа моего
  rationale: Сохранена традиционная поэтическая персонификация общины и её эмоциональная выразительность.
- source_word: לְאַכְזָר
  choice: стала жестокой
  rationale: Конструкция с לְ передаёт наступившее состояние и подчёркивает перемену поведения в условиях бедствия.
- source_word: כי ענים
  choice: как страусы
  rationale: Несмотря на текстовую и лексическую трудность, традиционное понимание как страусов хорошо соответствует образу пустыни и библейскому представлению об их суровом отношении к потомству.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: В данном образе «пустыня» естественно и конкретно передаёт безлюдную засушливую местность.
