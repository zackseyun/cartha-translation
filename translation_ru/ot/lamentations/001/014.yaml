  text: נִשְׂקַד֩ עֹ֨ל פְּשָׁעַ֜/י בְּ/יָד֗/וֹ יִשְׂתָּֽרְג֛וּ עָל֥וּ עַל צַוָּארִ֖/י הִכְשִׁ֣יל כֹּחִ֑/י נְתָנַ֣/נִי אֲדֹנָ֔/י בִּ/ידֵ֖י לֹא אוּכַ֥ל קֽוּם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/014.yaml
  text: The yoke of my transgressions is bound by his hand[a]; they are woven together, they have come up upon my neck; he has made my strength fail[c][b]. The Lord has given me into hands from which I cannot rise.
translation:
  language: ru
  text: Его рукой закреплено ярмо моих преступлений[a]; они переплелись[b] и поднялись на мою шею. Он подорвал мои силы. Господь отдал меня в руки, из которых я не могу подняться[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «находится под его надзором». Еврейский глагол редок и труден для понимания; образ ярма позволяет также понимать его как «связано» или «закреплено».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сплелись», «скрутились вместе».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в руки — не могу встать». Обладатели этих рук в еврейском тексте не названы; возможен оттенок: «не могу оправиться» или «не могу подняться вновь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׂקַד
  choice: связано
  rationale: Редкий и трудный глагол. В сочетании с образом ярма и последующим упоминанием шеи значение закрепления или связывания наиболее естественно, хотя возможно и значение «находится под надзором».
- source_word: עֹל
  choice: ярмо
  rationale: Сохраняет центральный образ тяжёлого бремени и подчинения.
- source_word: פְּשָׁעַי
  choice: моих преступлений
  rationale: Передаёт нравственную тяжесть פשע — нарушения и мятежа против законной власти; в современном русском «преступления» здесь естественнее, чем архаичное «прегрешения».
- source_word: בְּיָדוֹ
  choice: его рукой
  rationale: Передаёт и образ руки, и значение действующего лица, не называя его раньше, чем это делает еврейский текст.
- source_word: יִשְׂתָּרְגוּ
  choice: они сплелись
  rationale: Редкий глагол, вероятно, обозначает переплетение или скручивание; форма множественного числа сохранена и отнесена к преступлениям.
- source_word: עָלוּ עַל צַוָּארִי
  choice: поднялись на мою шею
  rationale: Сохраняет направление движения и физический образ ярма, оказывающегося на шее.
- source_word: הִכְשִׁיל כֹּחִי
  choice: лишил меня сил
  rationale: Буквально речь о том, что сила была заставлена споткнуться; русский идиоматический оборот ясно передаёт её крушение без неестественного олицетворения.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Передаёт божественный титул אֲדֹנָי и отличает его от личного имени YHWH, сохраняя достоинство и естественность русского текста.
- source_word: בִּידֵי לֹא אוּכַל קוּם
  choice: в руки, перед которыми я не могу устоять
  rationale: Конструкция оставляет обладателей рук неназванными, а קום в данном контексте означает способность встать против них, сопротивляться или устоять.
theological_decisions:
- issue: К кому относятся местоимения мужского рода единственного числа
  choice: Они переданы как относящиеся к Богу — Владыке, действующему как Судья.
  alternative: Начальное местоимение можно понимать менее определённо, не отождествляя действующего прямо с Богом до второй половины стиха.
  rationale: Заключительная фраза прямо называет Владыку тем, кто отдаёт говорящую в чужие руки; контекст главы также связывает бедствие Иерусалима с Божьим судом. При этом перевод не добавляет имени Бога там, где в начале стиха стоит лишь местоимение.
- issue: Смысл выражения לֹא אוּכַל קוּם после «в руки»
  choice: Неспособность устоять перед неназванными противниками.
  alternative: Неспособность подняться или оправиться после попадания в их руки.
  rationale: Оба оттенка возможны, но קום при противостоянии естественно выражает способность встать против кого-либо и устоять. Формулировка сохраняет неопределённость самих угнетателей.
translation_notes:
  register: Современный литературный русский с сохранением поэтических образов ярма, руки и шеи. Синтаксический переход от единственного числа «ярмо» к множественному «они» сохранён как особенность еврейского текста; местоимение относится к преступлениям. Тон торжественный, но без устаревших слов и конфессионально маркированной терминологии.
