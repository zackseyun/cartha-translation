base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/002.yaml
  text: She weeps bitterly in the night[a], with her tears on her cheeks; among all her lovers she has no comforter. All her companions have dealt treacherously with her[b]; they have become her enemies.
translation:
  language: ru
  text: 'Горько плачет она ночью,

    и слёзы её на щеках.

    Нет у неё утешителя

    среди всех её возлюбленных.[a]

    Все её друзья вероломно поступили с ней;[b]

    они стали ей врагами.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди всех её союзников». Слово «возлюбленные» сохраняет олицетворение города как женщины и может также подразумевать политических союзников.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Все её товарищи»; возможно также: «Все её союзники».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּכוֹ תִבְכֶּה
  choice: горько плачет
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает действие. «Горько плачет» естественно передаёт настойчивый, мучительный плач, не превращая усиление в отдельное действие.
- source_word: בַּלַּיְלָה
  choice: ночью
  rationale: Краткое и естественное временное обозначение, сохраняющее поэтический строй.
- source_word: וְדִמְעָתָהּ עַל לֶחֱיָהּ
  choice: и слёзы её на щеках
  rationale: Еврейские формы стоят в единственном числе, но имеют собирательное значение; русский множественный образ звучит естественно и сохраняет наглядность оригинала.
- source_word: אֵין לָהּ מְנַחֵם
  choice: нет у неё утешителя
  rationale: Сохраняет экзистенциальную конструкцию и именную силу причастия מְנַחֵם, а также повторяющийся в книге мотив отсутствия утешителя.
- source_word: מִכָּל אֹהֲבֶיהָ
  choice: среди всех её возлюбленных
  rationale: 'Предлог מִן при отрицательной экзистенциальной конструкции естественно передаётся как «среди»: ни один из её возлюбленных не утешает её. «Возлюбленные» сохраняет олицетворение города как женщины и возможный намёк на политических союзников.'
- source_word: כָּל רֵעֶיהָ
  choice: все её близкие
  rationale: רֵעַ допускает значения друга, товарища или союзника. «Близкие» естественно в русском поэтическом контексте и не сужает смысл исключительно до личной дружбы либо политики.
- source_word: בָּגְדוּ בָהּ
  choice: вероломно поступили с ней
  rationale: Передаёт не просто единичную измену, но вероломство и нарушение отношений, заключённые в корне בגד.
- source_word: הָיוּ לָהּ לְאֹיְבִים
  choice: они стали ей врагами
  rationale: Конструкция указывает на перемену отношений; «стали ей врагами» близко к форме оригинала и естественно по-русски.
theological_decisions:
- issue: Олицетворение Иерусалима как женщины и обозначение אֹהֲבֶיהָ
  choice: Сохранено «возлюбленные»
  alternative: «союзники» или «друзья»
  rationale: Оригинал поддерживает женское олицетворение города и допускает одновременно интимно-нравственный и политический подтекст. Замена на «союзники» разрешила бы эту напряжённость в пользу только политического смысла.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим синтаксисом. Сохранены параллелизм, женское олицетворение города, образ слёз на щеках и повтор местоименных форм. Маркеры сносок размещены непосредственно после соответствующих выражений.
