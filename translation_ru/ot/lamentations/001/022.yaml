  text: תָּבֹ֨א כָל רָעָתָ֤/ם לְ/פָנֶ֨י/ךָ֙ וְ/עוֹלֵ֣ל לָ֔/מוֹ כַּ/אֲשֶׁ֥ר עוֹלַ֛לְתָּ לִ֖/י עַ֣ל כָּל פְּשָׁעָ֑/י כִּֽי רַבּ֥וֹת אַנְחֹתַ֖/י וְ/לִבִּ֥/י דַוָּֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/022.yaml
  text: Let all their evil come before you[a], and deal with them as you have dealt with me because of all my transgressions; for my groans are many[c][b], and my heart is sick.
translation:
  language: ru
  text: Пусть всё их зло предстанет пред Тобой[a], и поступи с ними так же, как Ты поступил со мной за все мои преступления[b], ведь многочисленны мои стоны[c], и сердце моё изнемогает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё их нечестие». Слово רָעָה может также означать «бедствие», но здесь, вероятнее всего, речь идёт о виновном зле.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально также возможно: «и сделай с ними, как Ты сделал со мной». В еврейском тексте в обеих частях повторён один глагол.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «мои вздохи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבֹא
  choice: Пусть … предстанет
  rationale: Имперфект в молитвенном контексте имеет пожелательно-просительную силу. «Пусть … предстанет» естественно передаёт и движение в Божье присутствие, и оттенок судебного рассмотрения.
- source_word: רָעָתָם
  choice: всё их зло
  rationale: רָעָה может означать как нравственное зло, так и бедствие; сопоставление с преступлениями Сиона указывает здесь прежде всего на виновное зло врагов.
- source_word: לְפָנֶיךָ
  choice: пред Тобой
  rationale: Устойчивое выражение обозначает пребывание перед лицом Бога, в Его присутствии; в данном контексте сохраняется также судебный оттенок.
- source_word: וְעוֹלֵל לָמוֹ / כַּאֲשֶׁר עוֹלַלְתָּ לִי
  choice: и поступи с ними так же, как Ты поступил со мной
  rationale: Повтор одного и того же русского глагола отражает повтор עלל в еврейском тексте. «Поступить с кем-либо» естественно передаёт действие, здесь суровое, не добавляя отсутствующей в тексте конкретики.
- source_word: עַל כָּל פְּשָׁעָי
  choice: за все мои преступления
  rationale: פשע обозначает преступление, мятеж или сознательное нарушение. «Преступления» сохраняет нравственную тяжесть и естественно сочетается с Божьим судом.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание или подтверждение мольбы; «ведь» ясно и естественно связывает заключительную жалобу с предшествующим прошением.
- source_word: רַבּוֹת אַנְחֹתַי
  choice: многочисленны мои стоны
  rationale: אַנְחָה означает стон или тяжёлый вздох от скорби. «Стоны» передаёт интенсивность плача, а инверсия сохраняет поэтическое достоинство.
- source_word: לִבִּי דַוָּי
  choice: сердце моё изнемогает
  rationale: דַוָּי выражает болезненность, слабость и страдание. «Изнемогает» естественно передаёт внутреннюю поражённость сердца, не сводя образ только к физической болезни.
theological_decisions:
- issue: Характер просьбы о суде над врагами
  choice: Сохранена прямая молитвенная просьба к Богу рассмотреть зло врагов и поступить с ними так же, как Он поступил с Сионом.
  alternative: Можно усилить смысл до явной просьбы о возмездии либо ослабить его до просьбы лишь заметить их зло.
  rationale: Еврейский текст представляет судебное обращение к Богу и сопоставляет ожидаемое действие над врагами с уже совершившимся судом над Сионом. Перевод не усиливает и не смягчает эту напряжённость.
- issue: Признание вины говорящей стороны
  choice: Фраза «за все мои преступления» сохранена как признание справедливого основания пережитого суда.
  alternative: «За все мои мятежи» сильнее подчёркивает сознательное восстание против Бога.
  rationale: Перевод сохраняет покаянное признание, не внося дополнительной конфессиональной трактовки природы греха.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенно-поэтическим строем. Прописные местоимения обращения к Богу применены последовательно. Лексический повтор еврейского עלל сохранён через «поступи / поступил»; подлинная неоднозначность רָעָה и אַנְחָה вынесена в примечания.
