  source_fidelity: В целом последовательность образов и неявный мужской субъект переданы верно. Однако «тот одолел их» в русском создаёт ненужную указательную конструкцию и не вполне ясно соотносится с огнём; явное повторение «огонь» точнее передаёт отношение глагола וַיִּרְדֶּנָּה к «костям». «Мне под ноги» точнее, чем «у моих ног», выражает образ поставленной ловушки.
  naturalness: Исправленный вариант сохраняет современный литературный и поэтический строй, но делает связи между образами яснее. Запятая перед «изнемогающей весь день» отделяет второе результирующее состояние, не заставляя «весь день» неясно относиться также к «опустошённой».
