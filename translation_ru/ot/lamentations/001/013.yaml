base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/013.yaml
  text: From on high he sent fire into my bones[a], and it prevailed against them; he spread a net for my feet; he turned me back; he made me desolate[b], faint all day long.
translation:
  language: ru
  text: С высоты он послал огонь в мои кости, и огонь овладел ими[a]. Он раскинул сеть мне под ноги, обратил меня вспять, сделал меня опустошённой, изнемогающей весь день[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и огонь подчинил их себе»; еврейский глагол может означать «господствовать», «подчинять» или «одолеть».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «болеющей весь день» или «чахнущей весь день».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּרוֹם
  choice: С высоты
  rationale: Передаёт образ возвышенного места, откуда исходит действие, не конкретизируя его как «небо», поскольку этого слова в еврейском тексте нет.
- source_word: שָׁלַח אֵשׁ
  choice: послал огонь
  rationale: Прямо и естественно сохраняет яркий образ огня и действующего лица.
- source_word: בְּעַצְמֹתַי
  choice: в мои кости
  rationale: Сохраняет телесный образ и передаёт проникновение губительного огня внутрь.
- source_word: וַיִּרְדֶּנָּה
  choice: и тот одолел их
  rationale: Глагол רדה может обозначать господство, подчинение или преодоление. «Одолел» естественно выражает власть огня над костями, не устраняя лексической многозначности, отмеченной в сноске.
- source_word: פָּרַשׂ רֶשֶׁת לְרַגְלַי
  choice: раскинул сеть у моих ног
  rationale: Сохраняет образ ловушки и телесную образность оригинала; по-русски сочетание звучит естественно.
- source_word: הֱשִׁיבַנִי אָחוֹר
  choice: обратил меня вспять
  rationale: Передаёт понудительное значение породы хифиль и поэтический образ вынужденного отступления.
- source_word: נְתָנַנִי שֹׁמֵמָה
  choice: сделал меня опустошённой
  rationale: Сохраняет результативное значение выражения и женский род олицетворённого города-говорящего.
- source_word: כָּל־הַיּוֹם דָּוָה
  choice: весь день изнемогающей
  rationale: דָּוָה обозначает болезненную слабость, недуг или угасание сил. «Изнемогающей» передаёт длительное состояние и хорошо сочетается с «весь день».
theological_decisions:
- issue: Неявный субъект последовательности глаголов
  choice: Передать субъект местоимением «он», не называя его прямо
  alternative: Добавить «Господь» либо использовать прописное «Он»
  rationale: В еврейском стихе стоит подразумеваемый субъект мужского рода, который из контекста можно соотнести с Богом, однако божественное имя в самом стихе отсутствует. Строчное «он» сохраняет контекстуальную связь, не внося отсутствующего уточнения.
translation_notes:
  register: Современный литературный русский с достоинством поэтического плача. Женские формы сохраняют олицетворение Иерусалима. Синтаксический параллелизм и последовательность образов — огонь, сеть, вынужденное отступление, опустошение и изнеможение — сохранены.
