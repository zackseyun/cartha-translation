base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/006.yaml
  text: From daughter Zion all her splendor has departed[a]; her princes have become like deer that find no pasture[b]; they went without strength before the pursuer.
translation:
  language: ru
  text: Всё её великолепие покинуло дочь Сиона[a]. Её князья стали словно олени, не нашедшие пастбища[b]; обессиленные, они шли перед преследователем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вся её слава» или «вся её краса ушла от дочери Сиона».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «словно олени, не находящие пастбища»; возможно также: «словно самцы оленей, не нашедшие пастбища».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מִן בַּת־צִיּוֹן כָּל הֲדָרָהּ
  choice: И покинул дочь Сиона весь её блеск
  rationale: Сохраняет образ дочери Сиона и передаёт буквальное движение «вышел» естественным русским глаголом утраты; порядок слов поддерживает поэтический акцент.
- source_word: כָּל הֲדָרָהּ
  choice: весь её блеск
  rationale: הדר может обозначать великолепие, величие или красоту; «блеск» естественно охватывает видимое великолепие и былое достоинство города.
- source_word: שָׂרֶיהָ
  choice: её князья
  rationale: Передаёт правителей и знатных руководителей в царственно-национальном контексте, сохраняя возвышенный поэтический регистр.
- source_word: כְּאַיָּלִים
  choice: словно олени
  rationale: אַיָּל обозначает оленя, нередко самца; общее «олени» звучит естественно и не устраняет возможную видовую неопределённость.
- source_word: לֹא מָצְאוּ מִרְעֶה
  choice: не нашедшие пастбища
  rationale: Сохраняет прошедшее время еврейского глагола и ясно связывает отсутствие корма с истощением животных.
- source_word: וַיֵּלְכוּ בְלֹא כֹחַ
  choice: обессиленные, они шли
  rationale: Естественно передаёт буквальное «шли без силы», сохраняя физическое истощение без добавления прямо не выраженного бегства.
- source_word: לִפְנֵי רוֹדֵף
  choice: впереди преследователя
  rationale: В контексте погони לִפְנֵי изображает их движущимися перед тем, кто гонится за ними; единственное число исходного текста сохранено.
