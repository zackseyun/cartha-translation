  text: כָּל עַמָּ֤/הּ נֶאֱנָחִים֙ מְבַקְּשִׁ֣ים לֶ֔חֶם נָתְנ֧וּ מחמודי/הם בְּ/אֹ֖כֶל לְ/הָשִׁ֣יב נָ֑פֶשׁ רְאֵ֤ה יְהוָה֙ וְֽ/הַבִּ֔יטָ/ה כִּ֥י הָיִ֖יתִי זוֹלֵלָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/011.yaml
  text: All her people groan[a], seeking bread; they have given their precious things for food to restore life. Look, O Yahweh, and see[c][b], for I have become despised.
translation:
  language: ru
  text: Весь её народ стонет, ища хлеба; они отдали свои драгоценности[a] за пищу, чтобы вернуть себе силы.[b] Взгляни, Яхве, и посмотри, ведь я стала презренной.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свои сокровища», «всё самое дорогое».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы возвратить жизнь»; то есть подкрепиться, восстановить жизненные силы.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ничтожной», «достойной презрения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱנָחִים
  choice: стонет
  rationale: Передаёт слышимое выражение тяжёлого страдания; единственное число согласовано с собирательным «народ».
- source_word: מְבַקְּשִׁים לֶחֶם
  choice: ища хлеба
  rationale: Сохраняет образ хлеба как основной пищи и естественно передаёт продолжающиеся поиски пропитания.
- source_word: מחמודיהם
  choice: свои драгоценности
  rationale: Обозначает дорогие и желанные вещи без неоправданного сужения значения до денег или украшений.
- source_word: בְּאֹכֶל
  choice: за пищу
  rationale: 'Предлог в данном контексте выражает обмен: ценные вещи отдаются в обмен на еду.'
- source_word: לְהָשִׁיב נָפֶשׁ
  choice: чтобы вернуть себе силы
  rationale: Контекстуально передаёт идиому о восстановлении жизненных сил, не сводя נֶפֶשׁ к нематериальной душе.
- source_word: רְאֵה ... וְהַבִּיטָה
  choice: Взгляни ... и посмотри
  rationale: Сохраняет два настойчивых повеления, которыми говорящая призывает Бога обратить внимание на её бедствие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога принятой современной русской транслитерацией.
- source_word: זוֹלֵלָה
  choice: презренной
  rationale: В контексте плача слово выражает состояние той, которую считают ничтожной и достойной презрения, а не буквальную прожорливость.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в основном тексте, не подменяя его титулом и не вводя конфессионально окрашенную форму.
- issue: Значение נֶפֶשׁ в выражении לְהָשִׁיב נָפֶשׁ
  choice: жизненные силы человека
  alternative: душа как нематериальная часть человека
  rationale: В условиях голода выражение говорит о физическом подкреплении и сохранении жизни; перевод не навязывает более узкое антропологическое толкование.
translation_notes:
  register: Современный литературный русский язык с кратким, скорбным ритмом. Собирательное «народ» оформлено в единственном числе, а переход к «я» сохранён как олицетворённая речь Иерусалима. Парные повеления и образ хлеба удержаны близко к еврейскому тексту.
