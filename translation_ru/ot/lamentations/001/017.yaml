base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/017.yaml
  text: Zion has spread out her hands; there is no one to comfort her[a]. Yahweh has commanded concerning Jacob that his enemies surround him; Jerusalem has become an unclean thing among them.
translation:
  language: ru
  text: Сион простёр свои руки — некому утешить её. Яхве повелел, чтобы враги окружили Иакова со всех сторон; Иерусалим стал среди них нечистотой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, конкретнее: «как женщина в состоянии менструальной нечистоты» либо «менструальной нечистотой»; еврейское слово связано с образом ритуальной нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֵּרְשָׂה צִיּוֹן בְּיָדֶיהָ
  choice: Сион простёр руки
  rationale: Глагол פרשׂ означает «распростирать, протягивать»; форма совершенного вида передаёт жест отчаянной мольбы, не уточняя, была ли это именно молитва. В русском названия «Сион» и «Иерусалим» грамматически мужского рода, поэтому согласование дано по нормам современного языка.
- source_word: אֵין מְנַחֵם לָהּ
  choice: некому утешить его
  rationale: Естественно передаёт еврейскую конструкцию отсутствия утешителя и сохраняет сквозной для Плача мотив утешения.
- source_word: צִוָּה יְהוָה לְיַעֲקֹב סְבִיבָיו צָרָיו
  choice: Яхве повелел, чтобы Иаков был окружён врагами
  rationale: Передаёт явное действие Бога и враждебное окружение Иакова. Пассивная конструкция позволяет естественно выразить по-русски сжатую еврейскую фразу, где לְיַעֲקֹב может обозначать того, кого касается повеление.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное covenantal имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: הָיְתָה יְרוּשָׁלִַם לְנִדָּה בֵּינֵיהֶם
  choice: Иерусалим стал среди них нечистотой
  rationale: «Стал» выражает переход в униженное состояние; «нечистотой» сохраняет ритуальную и социальную образность נִדָּה, а её более конкретный оттенок поясняется в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога; транслитерация сохраняет его отличие от титула.
- issue: Степень конкретизации נִדָּה
  choice: нечистотой
  alternative: женщиной во время месячных; менструальной нечистотой; отверженной
  rationale: Слово вызывает образ ритуальной нечистоты и отвращения. Основной текст сохраняет эту силу без чрезмерно узкого толкования, а конкретный телесно-ритуальный оттенок отмечен в сноске.
- issue: Синтаксис повеления об Иакове
  choice: чтобы Иаков был окружён врагами
  alternative: 'об Иакове: окружающие его — его враги; против Иакова'
  rationale: Предлог לְ допускает более широкое значение «относительно/касательно» и в данном контексте может иметь неблагоприятный оттенок. Выбранная формулировка ясно передаёт бедствие, не утверждая отдельно, что все прежние соседи именно превратились во врагов.
translation_notes:
  register: Современный литературный русский язык с достоинством плача. Краткие параллельные фразы и тире сохраняют поэтическую сжатость. Грамматический род русских названий «Сион» и «Иерусалим» принят во внимание без утраты их олицетворения.
