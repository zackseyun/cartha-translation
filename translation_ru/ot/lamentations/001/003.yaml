  text: גָּֽלְתָ֨ה יְהוּדָ֤ה מֵ/עֹ֨נִי֙ וּ/מֵ/רֹ֣ב עֲבֹדָ֔ה הִ֚יא יָשְׁבָ֣ה בַ/גּוֹיִ֔ם לֹ֥א מָצְאָ֖ה מָנ֑וֹחַ כָּל רֹדְפֶ֥י/הָ הִשִּׂיג֖וּ/הָ בֵּ֥ין הַ/מְּצָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/003.yaml
  text: Judah has gone into exile because of affliction and because of great servitude; she dwells among the nations and finds no rest[a]. All her pursuers have overtaken her in the narrow places.
translation:
  language: ru
  text: Иудея ушла в изгнание из-за страданий и тяжкой неволи; она живёт среди народов и не находит покоя. Все её преследователи настигли её в теснинах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «между тесными местами»; выражение может также вызывать представление о бедствии и безвыходном положении.'
    reason: Сохраняется пространственный образ еврейского выражения בֵּין הַמְּצָרִים и отмечается его возможный дополнительный оттенок.
lexical_decisions:
- source_word: גָּלְתָה
  choice: ушла в изгнание
  rationale: Форма Qal от גלה обозначает уход или переселение в изгнание. Такой перевод сохраняет залог исходного текста и не представляет изгнание как добровольный отъезд.
- source_word: יְהוּדָה
  choice: Иудея
  rationale: В данном плаче Иуда как народ и земля олицетворена в женском роде. Русское «Иудея» естественно поддерживает это олицетворение и последующие формы женского рода.
- source_word: מֵעֹנִי
  choice: из-за страданий
  rationale: Предлог מִן здесь естественно понимать причинно, а עֹנִי означает бедствие, угнетение или страдание. Множественное «страдания» передаёт совокупность пережитых бед, не сводя смысл к одной лишь бедности.
- source_word: וּמֵרֹב עֲבֹדָה
  choice: и тяжкой неволи
  rationale: רֹב выражает большую степень или обилие, а עֲבֹדָה в этом контексте указывает на тягостную подневольную службу. «Тяжкая неволя» передаёт принуждение и угнетение, не ограничивая смысл юридически точным понятием рабства.
- source_word: הִיא יָשְׁבָה בַגּוֹיִם
  choice: она живёт среди народов
  rationale: ישׁב может означать сидеть, жить или обитать. «Живёт» естественно по-русски передаёт продолжающееся пребывание изгнанницы среди чужих народов.
- source_word: לֹא מָצְאָה מָנוֹחַ
  choice: не находит покоя
  rationale: מָנוֹחַ обозначает покой либо место отдыха. Формулировка сохраняет как физический, так и внутренний оттенок отсутствия покоя.
- source_word: כָּל רֹדְפֶיהָ הִשִּׂיגוּהָ
  choice: Все её преследователи настигли её
  rationale: Причастие от רדף сохраняет образ погони, а Hiphil от נשׂג означает настичь или догнать.
- source_word: בֵּין הַמְּצָרִים
  choice: в теснинах
  rationale: Буквально выражение указывает на узкие, стеснённые места, где бегущая оказывается пойманной; одновременно оно допускает смысловой отзвук бедствия и безвыходности.
