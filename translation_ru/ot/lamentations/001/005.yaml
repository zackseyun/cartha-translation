  text: הָי֨וּ צָרֶ֤י/הָ לְ/רֹאשׁ֙ אֹיְבֶ֣י/הָ שָׁל֔וּ כִּֽי יְהוָ֥ה הוֹגָ֖/הּ עַ֣ל רֹב פְּשָׁעֶ֑י/הָ עוֹלָלֶ֛י/הָ הָלְכ֥וּ שְׁבִ֖י לִ/פְנֵי צָֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/005.yaml
  text: Her foes have become the head[a]; her enemies prosper, because Yahweh has afflicted her for the multitude of her transgressions[b]. Her children have gone away into captivity before the foe.
translation:
  language: ru
  text: 'Враги её стали во главе,

    неприятели её благоденствуют,

    потому что Яхве причинил ей скорбь

    за множество её преступлений.

    Её малые дети[a] пошли в плен

    перед врагом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её младенцы». Еврейское слово обозначает маленьких детей и подчёркивает их беззащитность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרֶיהָ
  choice: враги её
  rationale: צַר обозначает враждебных противников; «враги» естественно по-русски и сохраняет параллелизм с «неприятелями».
- source_word: לְרֹאשׁ
  choice: стали во главе
  rationale: Сохранён еврейский образ «стать головой», выражающий господство и возвышение врагов.
- source_word: אֹיְבֶיהָ
  choice: неприятели её
  rationale: Передаёт обычное значение אֹיֵב и позволяет избежать неуклюжего повтора слова «враги» в параллельных строках.
- source_word: שָׁלוּ
  choice: благоденствуют
  rationale: Глагол выражает состояние покоя, безопасности или процветания; «благоденствуют» естественно передаёт благополучие неприятелей в контексте переворота участи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: הוֹגָהּ
  choice: причинил ей скорбь
  rationale: Каузативная форма יגה означает причинить скорбь или страдание; формулировка сохраняет прямую божественную субъектность и звучит естественно в современной русской речи.
- source_word: עַל רֹב פְּשָׁעֶיהָ
  choice: за множество её преступлений
  rationale: רֹב передаёт многочисленность, а פֶּשַׁע — преступление, нарушение или мятеж; выбранная формулировка сохраняет вес вины без конфессионального уточнения.
- source_word: עוֹלָלֶיהָ
  choice: её малые дети
  rationale: עוֹלָל обозначает маленьких детей и подчёркивает их уязвимость; «малые дети» точнее общего «дети», не ограничивая значение только младенцами.
- source_word: שְׁבִי
  choice: в плен
  rationale: Краткая и естественная русская передача состояния пленения при глаголе движения.
- source_word: לִפְנֵי צָר
  choice: перед врагом
  rationale: Буквально сохраняет пространственный образ шествия пленников перед противником, не добавляя прямо не выраженного действия конвоирования.
theological_decisions:
- issue: Божественная причинность страданий Иерусалима
  choice: потому что Яхве причинил ей скорбь за множество её преступлений
  alternative: потому что Яхве поразил её из-за множества её мятежей
  rationale: Еврейский текст прямо называет Яхве субъектом причинённой скорби и связывает её с преступлениями города; перевод сохраняет как божественное действие, так и человеческую ответственность, не смягчая напряжение между ними.
translation_notes:
  register: Современный литературный русский с достоинством поэтического плача. Порядок «враги её» и краткие параллельные строки поддерживают возвышенный ритм; при этом синтаксис остаётся понятным обычному читателю. Маркер [a] помещён непосредственно после соответствующего выражения.
