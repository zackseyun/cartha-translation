base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/019.yaml
  text: I called to my lovers[a]; they deceived me[b]. My priests and my elders perished in the city while they sought food for themselves to restore their lives.
translation:
  language: ru
  text: Я звала моих возлюбленных[a]; они обманули меня. Мои священники и старейшины погибли в городе, ища[b] себе пищу, чтобы вернуть себе жизнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Возлюбленные» — метафорическое обозначение; вероятно, имеются в виду политические союзники Иерусалима или другие предметы ложной надежды.
    reason: cultural_note
  - marker: b
    text: 'Или: «потому что искали себе пищу». Еврейский союз может иметь более явно выраженный причинный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרָאתִי
  choice: Я звала
  rationale: Форма означает «звать, призывать». Женский род в русском соответствует олицетворённому Иерусалиму, говорящему в контексте плача.
- source_word: לַמְאַהֲבַי
  choice: моих возлюбленных
  rationale: Сохраняет конкретную метафору еврейского текста, не сводя её сразу к политическим союзникам.
- source_word: הֵמָּה רִמּוּנִי
  choice: но они обманули меня
  rationale: Пиэль רמה обычно передаёт обман. Союз «но» естественно выражает резкий контраст между обращением за помощью и ответом возлюбленных.
- source_word: כֹּהֲנַי וּזְקֵנַי
  choice: Мои священники и старейшины
  rationale: Прямо передаёт обе группы; «старейшины» здесь обозначает признанных руководителей общины, а не просто пожилых людей.
- source_word: בָּעִיר גָּוָעוּ
  choice: погибли в городе
  rationale: גוע обозначает смерть, угасание жизни; «погибли» соответствует поэтическому регистру и контексту бедствия.
- source_word: כִּי בִקְשׁוּ אֹכֶל לָמוֹ
  choice: ища себе пищу
  rationale: 'Деепричастный оборот естественно передаёт обстоятельственный смысл: они умерли в то время, когда искали пищу. Возможный причинный оттенок כִּי сохранён в примечании.'
- source_word: וְיָשִׁיבוּ אֶת נַפְשָׁם
  choice: чтобы вернуть себе жизнь
  rationale: Передаёт целевой смысл конструкции и образное сочетание שוב с נפש, где נפש означает жизнь или самого человека, а не отвлечённую нематериальную душу.
