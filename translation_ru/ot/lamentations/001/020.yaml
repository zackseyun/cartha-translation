id: LAM.1.20
reference: Lamentations 1:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: רְאֵ֨ה יְהוָ֤ה כִּֽי צַר לִ/י֙ מֵעַ֣/י חֳמַרְמָ֔רוּ נֶהְפַּ֤ךְ לִבִּ/י֙ בְּ/קִרְבִּ֔/י כִּ֥י מָר֖וֹ מָרִ֑יתִי מִ/ח֥וּץ שִׁכְּלָה חֶ֖רֶב בַּ/בַּ֥יִת כַּ/מָּֽוֶת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/020.yaml
  text: Look[a], O Yahweh, for I am in distress; my inward parts are churning; my heart is overturned within me, because I have been very rebellious[b]. Outside the sword bereaves[c]; inside the house it is like death.
translation:
  language: ru
  text: Взгляни, Яхве, как мне тяжко! Всё внутри меня бурлит[a], сердце моё перевернулось во мне, потому что я упорно восставала[b]. Снаружи меч отнимает детей, а в доме — словно смерть[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мои внутренности бурлят» — телесный образ глубокого душевного мучения.'
    reason: cultural_note
  - marker: b
    text: 'Еврейский текст усиливает глагол «восставать» однокоренной формой; возможно также: «я тяжко восстала».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейская строка предельно кратка; возможно также понять: «а в доме — смерть», хотя приставка כְּ обычно выражает сравнение: «словно смерть».'
    reason: alternative_reading
lexical_decisions:
- source_word: רְאֵה
  choice: Взгляни
  rationale: Повелительная форма выражает прямую мольбу к Богу. «Взгляни» естественно для современного литературного русского и сохраняет настойчивость обращения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: צַר לִי
  choice: как мне тяжко
  rationale: Идиоматично передаёт состояние тесноты, бедствия и глубокой скорби; частица «как» усиливает эмоциональность мольбы без добавления нового смысла.
- source_word: מֵעַי חֳמַרְמָרוּ
  choice: всё внутри меня бурлит
  rationale: Передаёт телесный образ сильнейшего внутреннего смятения естественным современным русским языком; буквальное «мои внутренности» было бы менее естественно и могло бы отвлекать читателя.
- source_word: נֶהְפַּךְ לִבִּי בְּקִרְבִּי
  choice: сердце моё перевернулось во мне
  rationale: Сохраняет конкретную метафору внутреннего переворота, не сводя её к общему «сердце в смятении».
- source_word: כִּי מָרוֹ מָרִיתִי
  choice: потому что я упорно восставала
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает значение глагола. «Упорно восставала» ясно передаёт усиленную, сознательную непокорность; женский род соответствует персонифицированному Сиону, говорящему в контексте главы.
- source_word: מִחוּץ
  choice: снаружи
  rationale: Кратко сохраняет пространственное противопоставление выражению «в доме».
- source_word: שִׁכְּלָה חֶרֶב
  choice: меч отнимает детей
  rationale: Глагол обозначает лишение детей, утрату потомства. Такая формулировка естественнее по-русски, чем буквальное «меч делает бездетной», и сохраняет образ меча как причины утраты.
- source_word: בַּבַּיִת כַּמָּוֶת
  choice: а в доме — словно смерть
  rationale: Сохраняет краткость и эллиптичность еврейской строки, а также сравнительное значение приставки כְּ.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблено личное имя Бога. «Яхве» передаёт тетраграмматон как имя и не заменяет его титулом.
- issue: Характер признания вины в כִּי מָרוֹ מָרִיתִי
  choice: я упорно восставала
  alternative: я тяжко согрешила; я горько восстала
  rationale: Сохранена конкретная идея мятежа и непокорности, а не заменена более общим понятием греха. Усилительная конструкция отражена наречием «упорно», без уточнения, которого нет в исходном тексте.
translation_notes:
  register: Современный литературный русский с поэтической сжатостью и достоинством. Сохранены прямое обращение, телесные метафоры, пространственный параллелизм и резкий финальный эллипсис. Женский род речи обусловлен образом персонифицированного Сиона в контексте Плача 1.
