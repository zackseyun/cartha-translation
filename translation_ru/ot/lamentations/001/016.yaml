base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/016.yaml
  text: For these things I am weeping; my eye[a], my eye runs down with water, because the comforter who restores my soul is far from me. My children have become desolate, because the enemy has prevailed.
translation:
  language: ru
  text: Об этом я плачу; мой глаз, мой глаз проливает воду, потому что далеко от меня утешитель, возвращающий мне жизнь.[a] Дети мои опустошены, потому что враг одолел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвращающий меня», «возвращающий мне душу» или «оживляющий меня». Еврейское нефеш может означать жизнь, самого человека или душу — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אֵלֶּה
  choice: Об этом
  rationale: Сочетание указывает на предмет и причину плача; «об этом» естественно по-русски и не уточняет причинную связь сверх еврейского текста.
- source_word: בוֹכִיָּה
  choice: я плачу
  rationale: Форма женского рода относится к олицетворённому Сиону; настоящее время передаёт продолжающийся плач.
- source_word: עֵינִי עֵינִי
  choice: мой глаз, мой глаз
  rationale: Сохранены единственное число и повтор, создающий поэтическое усиление в еврейском тексте.
- source_word: יֹרְדָה מַּיִם
  choice: истекает водой
  rationale: Передан буквальный образ воды, а не подставлено толкование «слёзы»; выражение остаётся понятным как язык плача.
- source_word: מְנַחֵם
  choice: утешитель
  rationale: Субстантивированное причастие обозначает того, кто мог бы утешить; контекст позволяет определённое по смыслу обозначение.
- source_word: מֵשִׁיב נַפְשִׁי
  choice: возвращающий мне силы
  rationale: Идиоматично передаёт восстановление всего человека в контексте изнеможения и утешения, не сводя נֶפֶשׁ к позднейшему узкому представлению о нематериальной душе.
- source_word: רָחַק מִמֶּנִּי
  choice: далеко от меня
  rationale: Прямая и естественная передача отсутствия и удалённости утешителя.
- source_word: בָנַי
  choice: Дети мои
  rationale: Хотя форма буквально означает «сыновья мои», в речи олицетворённого Сиона она собирательно обозначает его народ и жителей.
- source_word: שׁוֹמֵמִים
  choice: опустошены
  rationale: Слово описывает состояние разорения и запустения; перевод сохраняет характерную для Плача лексику опустошения.
- source_word: גָבַר אוֹיֵב
  choice: враг одолел
  rationale: Глагол выражает превосходство и торжество врага; «одолел» кратко и естественно передаёт результат.
theological_decisions:
- issue: Значение נַפְשִׁי в контексте плача
  choice: мне силы
  alternative: мою душу; мою жизнь; меня
  rationale: Здесь נֶפֶשׁ обозначает жизнь или самого человека, нуждающегося в восстановлении. Русское «возвращающий мне силы» естественно передаёт оживление и подкрепление, не навязывая дуалистической антропологии; варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением высокой поэтической интонации. Повтор «мой глаз, мой глаз» и образ воды намеренно не сглажены; синтаксис остаётся ясным для обычного читателя.
