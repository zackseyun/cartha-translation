  variant: modern literary Russian
source:
  edition: WLC
  text: סִלָּ֨ה כָל אַבִּירַ֤/י אֲדֹנָ/י֙ בְּ/קִרְבִּ֔/י קָרָ֥א עָלַ֛/י מוֹעֵ֖ד לִ/שְׁבֹּ֣ר בַּחוּרָ֑/י גַּ֚ת דָּרַ֣ךְ אֲדֹנָ֔/י לִ/בְתוּלַ֖ת בַּת יְהוּדָֽה־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/015.yaml
  text: The Lord has rejected all my mighty men in my midst[a]; he has summoned an appointed time against me to crush my young men[b]. The Lord has trodden the winepress for the virgin daughter of Judah.
translation:
  language: ru
  text: Владыка отверг всех моих могучих внутри меня. Он созвал против меня назначенное собрание[a], чтобы сокрушить моих юношей. Владыка топтал давильню[b] для девы — дочери Иуды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «назначил против меня срок». Еврейское מוֹעֵד может означать как назначенное собрание, так и назначенное время.'
    reason: lexical_alternative
  - marker: b
    text: Топтание винограда в давильне служит здесь образом сурового Божьего суда.
    reason: cultural_note
lexical_decisions:
- source_word: סִלָּה
  choice: отверг
  rationale: Пиэль здесь выражает решительное отвержение или устранение; в контексте военного поражения «отверг» передаёт смысл естественно и без лишнего уточнения.
- source_word: אַבִּירַי
  choice: всех сильных воинов
  rationale: Слово обозначает сильных, могучих людей; контекст гибели юношей придаёт ему военный оттенок, явно переданный словом «воинов».
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: В еврейском стоит божественный титул אֲדֹנָי, а не тетраграмматон. «Владыка» сохраняет отличие этого титула от имени יהוה и уместно в современном литературном русском.
- source_word: בְּקִרְבִּי
  choice: среди меня
  rationale: Персонифицированный город говорит о находящихся внутри него людях; выражение сохраняет пространственно-общинный смысл и необычную образность оригинала.
- source_word: קָרָא עָלַי מוֹעֵד
  choice: назначил против меня срок
  rationale: מוֹעֵד может означать назначенное время или назначенное собрание. В основном тексте выбран естественный русский эквивалент временного значения, а подлинная неоднозначность отмечена в сноске.
- source_word: לִשְׁבֹּר
  choice: чтобы сокрушить
  rationale: Буквально «сломить/разбить»; «сокрушить» передаёт насильственное уничтожение в контексте суда и поражения.
- source_word: בַּחוּרַי
  choice: моих юношей
  rationale: Речь о молодых мужчинах в расцвете сил, вероятно способных сражаться; «юношей» сохраняет возрастной смысл, не делая военную функцию обязательной.
- source_word: גַּת דָּרַךְ
  choice: топтал в давильне
  rationale: Еврейское выражение буквально описывает топтание виноградной давильни и метафорически изображает суровый суд. Русская конструкция делает образ ясным, не заменяя его толкованием.
- source_word: לִבְתוּלַת בַּת יְהוּדָה
  choice: деву — дочь Иуды
  rationale: Сохраняется женская персонификация Иуды. Тире ясно показывает приложение, а не двух разных участников образа.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Владыка
  alternative: Господь
  rationale: «Владыка» точно передаёт титул אֲדֹנָי и позволяет не смешивать его с обычной русской передачей имени יהוה как «Господь»; особая типографическая маркировка имени здесь неуместна.
- issue: Образ давильни как действие Божьего суда
  choice: сохранить метафору без пояснения в основном тексте
  alternative: передать смысл прямо как уничтожение Иуды
  rationale: Оригинал намеренно использует жестокий образ топтания винограда; его следует сохранить, а значение объяснить в примечании, не ослабляя богословского напряжения текста.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным звучанием. Сохранены плачевная персонификация города, повтор божественного титула и резкий образ давильни; неоднозначность מוֹעֵד вынесена в сноску.
