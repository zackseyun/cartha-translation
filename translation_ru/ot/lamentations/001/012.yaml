  text: ל֣וֹא אֲלֵי/כֶם֮ כָּל עֹ֣בְרֵי דֶרֶךְ֒ הַבִּ֣יטוּ וּ/רְא֗וּ אִם יֵ֤שׁ מַכְאוֹב֙ כְּ/מַכְאֹבִ֔/י אֲשֶׁ֥ר עוֹלַ֖ל לִ֑/י אֲשֶׁר֙ הוֹגָ֣ה יְהוָ֔ה בְּ/י֖וֹם חֲר֥וֹן אַפּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/012.yaml
  text: Is it nothing to you[a], all you who pass by on the road? Look and see whether there is any sorrow like my sorrow, which was dealt to me[b], with which Yahweh afflicted me in the day of his fierce anger.
translation:
  language: ru
  text: Неужели вам всё равно[a], все, кто проходит по дороге? Взгляните и посмотрите, есть ли боль[b], подобная моей боли, причинённой мне, — той боли, которой Яхве подверг меня в день своего яростного гнева.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве вас это не касается, все, кто проходит по дороге?» Еврейское начало эллиптично, буквально: «не вам».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «скорбь» или «страдание».
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹוא אֲלֵיכֶם
  choice: Неужели вам всё равно
  rationale: Еврейское начало эллиптично, буквально «не вам». В контексте это обращённый к прохожим призыв обратить внимание и проявить участие; вопросительная формулировка сохраняет недосказанность и риторическую силу.
- source_word: כָּל עֹבְרֵי דֶרֶךְ
  choice: все, кто проходит по дороге
  rationale: Передаёт и причастное значение «проходящие», и конкретный образ дороги, оставаясь естественным для современного русского языка.
- source_word: הַבִּיטוּ וּרְאוּ
  choice: Взгляните и посмотрите
  rationale: Два последовательных повелительных глагола сохранены, чтобы передать настойчивость обращения.
- source_word: מַכְאוֹב ... כְּמַכְאֹבִי
  choice: боль ... подобная моей боли
  rationale: מַכְאוֹב охватывает физическую и душевную боль. Повтор ключевого слова сохранён, как в еврейском тексте.
- source_word: אֲשֶׁר עוֹלַל לִי
  choice: она была причинена мне
  rationale: Пассивная конструкция удерживает внимание на пережитом страдании и не вводит подлежащее раньше следующей части, где прямо назван Яхве.
- source_word: אֲשֶׁר הוֹגָה יְהוָה
  choice: ею Яхве поразил меня
  rationale: Каузативная форма יגה означает причинить скорбь или подвергнуть страданию. «Поразил меня» естественно передаёт тяжесть действия, а местоимение «ею» сохраняет связь с упомянутой болью.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: בְּיוֹם חֲרוֹן אַפּוֹ
  choice: в день своего яростного гнева
  rationale: Идиома חֲרוֹן אַף выражает пылающий, сильный гнев; выбранная формулировка передаёт интенсивность естественным современным русским языком.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В стихе непосредственно употреблён тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Яхве как деятель, причиняющий страдание
  choice: Яхве поразил меня
  alternative: Меня постигло страдание
  rationale: Еврейский текст прямо называет Яхве субъектом глагола הוֹגָה. Перевод не смягчает эту богословскую напряжённость и не превращает действие в безличное событие.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной интонацией плача. Сохранены прямое обращение, повтор слова «боль» и резкое утверждение о действии Яхве; архаизмы и конфессионально окрашенные замены избегаются.
