  yaml_path: translation/ot/lamentations/001/001.yaml
  text: How she sits alone[a], the city once full of people! She has become like a widow, she who was great among the nations, a princess among the provinces; she has become subject to forced labor.
translation:
  language: ru
  text: 'Как одиноко сидит город, некогда многолюдный!


    Он стал словно вдова —

    некогда великая среди народов,

    княгиня среди областей;

    теперь он несёт трудовую повинность[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «платит дань». Еврейское מַס может означать как дань, наложенную завоевателем, так и принудительную трудовую повинность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: Как
  rationale: Передаёт начальную формулу плача — скорбное восклицание и потрясение, а не обычный вопрос.
- source_word: יָשְׁבָה בָדָד
  choice: одиноко сидит
  rationale: Сохраняет образ города, который в нынешнем запустении сидит в одиночестве; настоящее время придаёт плачу наглядность.
- source_word: הָעִיר
  choice: город
  rationale: В еврейском тексте город не назван; указание на Иерусалим не добавляется, хотя оно ясно из контекста книги.
- source_word: רַבָּתִי עָם
  choice: некогда многолюдный
  rationale: Кратко и естественно передаёт прежнюю многочисленность населения и подчёркивает контраст с нынешним одиночеством.
- source_word: הָיְתָה כְּאַלְמָנָה
  choice: стал он словно вдова
  rationale: «Словно» сохраняет сравнительную силу כְּ и не превращает поэтическое уподобление в буквальное отождествление.
- source_word: רַבָּתִי בַגּוֹיִם
  choice: та, что была великой среди народов
  rationale: Сохраняет представление о прежнем величии города и параллель с последующей строкой.
- source_word: שָׂרָתִי בַּמְּדִינוֹת
  choice: княгиня среди областей
  rationale: «Княгиня» передаёт женский образ особы высокого правящего ранга; «области» обозначают административные территории.
- source_word: לָמַס
  choice: теперь трудится подневольно
  rationale: Передаёт вероятное значение принудительной трудовой повинности и резкий переход от положения княгини к подчинению; «теперь» ясно выражает контраст, заложенный в повторе הָיְתָה.
