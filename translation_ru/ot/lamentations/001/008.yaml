source:
  edition: WLC
  text: חֵ֤טְא חָֽטְאָה֙ יְר֣וּשָׁלִַ֔ם עַל כֵּ֖ן לְ/נִידָ֣ה הָיָ֑תָה כָּֽל מְכַבְּדֶ֤י/הָ הִזִּיל֨וּ/הָ֙ כִּי רָא֣וּ עֶרְוָתָ֔/הּ גַּם הִ֥יא נֶאֶנְחָ֖ה וַ/תָּ֥שָׁב אָחֽוֹר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/008.yaml
  text: Jerusalem has sinned grievously[a]; therefore she has become unclean. All who honored her despise her, because they have seen her nakedness[c][b]. She herself also groans and turns backward.
translation:
  language: ru
  text: Тяжко согрешила Иерусалим; поэтому она стала нечистой[a]. Все, кто почитал её, теперь презирают её, потому что увидели её наготу. И она стонет и поворачивается назад[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стала как женщина во время менструации»; или: «стала нечистотой». Еврейское слово обозначает ритуальную нечистоту и связанную с ней отделённость.'
    reason: Лексическая неоднозначность образа נִדָּה.
  - marker: b
    text: 'Буквально: «поворачивается назад» или «возвращается назад»; возможно, «отступает назад».'
    reason: Сохранение буквального пространственного смысла וַתָּשָׁב אָחוֹר.
lexical_decisions:
- source_word: חֵטְא חָטְאָה
  choice: тяжко согрешил
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает высказывание. «Тяжко согрешил» естественно передаёт и усиление, и серьёзность греха.
- source_word: לְנִידָה
  choice: стал нечистым
  rationale: נִדָּה обозначает ритуальную нечистоту, особенно связанную с менструацией, а также состояние отделённости и отверженности. Основной вариант сохраняет образ осквернения и понятен современному читателю; конкретный оттенок указан в сноске.
- source_word: מְכַבְּדֶיהָ
  choice: все, кто почитал его
  rationale: Причастие от כבד здесь означает тех, кто прежде оказывал Иерусалиму почёт и уважение. Русское местоимение согласовано с грамматическим родом названия «Иерусалим».
- source_word: הִזִּילוּהָ
  choice: теперь презирают его
  rationale: Форма передаёт отношение к кому-либо как к ничтожному, достойному презрения. «Теперь» явно выражает подразумеваемый контраст с прежним почётом, не меняя смысла.
- source_word: עֶרְוָתָהּ
  choice: его наготу
  rationale: Сохранён буквальный образ обнажённости, несущий также смысл публичного позора и унижения.
- source_word: נֶאֶנְחָה
  choice: стонет
  rationale: Глагол описывает слышимое выражение тяжёлого страдания; «стонет» передаёт его сильнее и точнее, чем нейтральное «вздыхает».
- source_word: וַתָּשָׁב אָחוֹר
  choice: отворачивается
  rationale: Буквально выражение означает движение или поворот назад. В контексте позора «отворачивается» звучит естественно, а буквальная пространственная формулировка сохранена в сноске.
theological_decisions:
- issue: Образ нечистоты как следствия суда над Иерусалимом
  choice: «стал нечистым» в основном тексте
  alternative: «стал как женщина во время месячных» или «стал скверной»
  rationale: Текст соединяет ритуальную нечистоту с общественным отвержением и позором Иерусалима. Выбранный вариант сохраняет эту связь, не сводя образ только к физиологической детали; более конкретные значения приведены в сноске.
- issue: Грамматический род олицетворённого Иерусалима
  choice: 'Мужской род по норме русского языка: «он», «его», «сам»'
  alternative: 'Женский род по древнееврейскому олицетворению: «она», «её», «сама»'
  rationale: В древнееврейском Иерусалим представлен в женском роде, но в современном русском название города грамматически мужского рода. Мужское согласование обеспечивает естественность без устранения образов наготы, стона и позора.
translation_notes:
  register: 'Современный литературный русский язык с кратким, скорбным ритмом плача. Синтаксис сохраняет последовательность: грех — нечистота — презрение — обнажение — стон и отступление. Название «Иерусалим» согласовано в мужском роде согласно русской норме; одушевлённое олицетворение при этом сохранено.'
