  text: דַּרְכֵ֨י צִיּ֜וֹן אֲבֵל֗וֹת מִ/בְּלִי֙ בָּאֵ֣י מוֹעֵ֔ד כָּל שְׁעָרֶ֨י/הָ֙ שֽׁוֹמֵמִ֔ין כֹּהֲנֶ֖י/הָ נֶאֱנָחִ֑ים בְּתוּלֹתֶ֥י/הָ נּוּג֖וֹת וְ/הִ֥יא מַר לָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/004.yaml
  text: The roads of Zion mourn[a], because no one comes to the appointed feast; all her gates are desolate, her priests groan, her virgins grieve[b], and she herself is bitter.
translation:
  language: ru
  text: Дороги Сиона скорбят, потому что никто не приходит на праздничное собрание[a]. Все её ворота опустели, её священники стонут, её девушки печалятся[b], а ей самой горько.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на праздник»; еврейское слово может также означать «назначенное время».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «девственницы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵי צִיּוֹן
  choice: Дороги Сиона
  rationale: Множественное число דֶּרֶךְ здесь конкретно обозначает пути, по которым прежде шли паломники; «дороги» сохраняет зримый образ и поэтическое олицетворение.
- source_word: אֲבֵלוֹת
  choice: скорбят
  rationale: Форма описывает дороги как пребывающие в трауре или скорби. Глагол «скорбят» естественно передаёт олицетворение и тон плача.
- source_word: מִבְּלִי בָּאֵי מוֹעֵד
  choice: потому что никто не приходит на установленный праздник[a]
  rationale: מִבְּלִי выражает отсутствие или лишённость, בָּאֵי — приходящих, а מוֹעֵד в храмовом контексте, вероятнее всего, указывает на установленный праздник. Сноска сохраняет более широкую семантику слова.
- source_word: כָּל שְׁעָרֶיהָ שׁוֹמֵמִין
  choice: Все её ворота опустели
  rationale: שׁוֹמֵמִין передаёт запустение и безлюдность. «Опустели» звучит естественно и связывается с отсутствием приходящих, не устраняя мотива разорения.
- source_word: כֹּהֲנֶיהָ נֶאֱנָחִים
  choice: её священники стонут
  rationale: נֶאֱנָחִים обозначает тяжёлые вздохи или стоны; «стонут» передаёт силу страдания в погребальном плаче.
- source_word: בְּתוּלֹתֶיהָ נּוּגוֹת
  choice: её девушки печалятся[b]
  rationale: בְּתוּלָה может обозначать девушку или девственницу. Современное «девушки» естественно в русском тексте, а более узкое значение сохранено в сноске. נּוּגוֹת выражает скорбь или удручённость.
- source_word: וְהִיא מַר לָהּ
  choice: а ей самой горько
  rationale: Русская безличная конструкция точно и естественно передаёт идиому מַר לָהּ («горько ей»), а «самой» сохраняет эмфатическое וְהִיא.
theological_decisions:
- issue: Женское олицетворение Сиона/Иерусалима
  choice: Сохранить женские местоимения «её» и «ей самой», понимая Сион как олицетворённый город-женщину.
  alternative: 'Согласовать местоимения с грамматически мужским русским словом «Сион»: «его», «ему самому».'
  rationale: В еврейском тексте последовательно употреблены формы женского рода; женское олицетворение существенно для риторики всей главы. Небуквальное с точки зрения русского грамматического рода согласование намеренно указывает на Сион как на олицетворённую женщину и город.
translation_notes:
  register: Современный литературный русский с достоинством поэтического плача. Короткие глагольные формы поддерживают ритм и последовательность образов. Женские местоимения после грамматически мужского «Сион» представляют собой осознанную поэтическую маркировку исходного олицетворения.
