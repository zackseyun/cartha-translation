  text: זָֽכְרָ֣ה יְרוּשָׁלִַ֗ם יְמֵ֤י עָנְיָ/הּ֙ וּ/מְרוּדֶ֔י/הָ כֹּ֚ל מַחֲמֻדֶ֔י/הָ אֲשֶׁ֥ר הָי֖וּ מִ֣/ימֵי קֶ֑דֶם בִּ/נְפֹ֧ל עַמָּ֣/הּ בְּ/יַד צָ֗ר וְ/אֵ֤ין עוֹזֵר֙ לָ֔/הּ רָא֣וּ/הָ צָרִ֔ים שָׂחֲק֖וּ עַ֥ל מִשְׁבַּתֶּֽ/הָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/007.yaml
  text: Jerusalem remembered in the days of her affliction and her wanderings all her precious things that were from days of old[a]. When her people fell into the hand of the foe, and there was no one to help her, foes saw her[b]; they laughed at her ruin.
translation:
  language: ru
  text: В дни своего бедствия и скитаний[a] Иерусалим вспоминал обо всём дорогом, что было у него с давних времён. Когда его народ попал в руки врага и никто не помог ему, враги увидели его и смеялись над его разорением[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бесприютности». Древнееврейское слово редко встречается, и его значение спорно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «падением»; древнееврейское существительное может указывать на крушение Иерусалима или на его опустошённое состояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה
  choice: вспоминал
  rationale: Форма Qal perfect 3-го лица женского рода относится к олицетворённому Иерусалиму. В русском название города грамматически мужского рода, поэтому употреблена естественная форма «вспоминал»; прошедшее время соответствует контексту плача.
- source_word: יְמֵי עָנְיָהּ
  choice: в дни своего бедствия
  rationale: עֳנִי обозначает бедствие, страдание или унижение. «Бедствие» сохраняет тяжесть смысла и естественно звучит в современном литературном русском.
- source_word: וּמְרוּדֶיהָ
  choice: и скитаний
  rationale: Редкое и спорное слово, вероятно связанное со скитанием или бесприютностью. «Скитания» передают конкретный образ изгнания, а иной возможный смысл отмечен в сноске.
- source_word: כֹּל מַחֲמֻדֶיהָ אֲשֶׁר הָיוּ מִימֵי קֶדֶם
  choice: всё дорогое, что было у него с давних времён
  rationale: מַחֲמֻדִים может обозначать как ценные вещи, так и всё желанное и дорогое. Формулировка не ограничивает смысл материальными сокровищами и сохраняет временную перспективу מִימֵי קֶדֶם.
- source_word: בִּנְפֹל עַמָּהּ בְּיַד צָר
  choice: когда его народ попал в руки врага
  rationale: Инфинитив с בְּ выражает время или обстоятельство. Русская идиома «попал в руки» естественно передаёт древнееврейский образ подчинения чужой власти.
- source_word: וְאֵין עוֹזֵר לָהּ
  choice: и никто не помог ему
  rationale: Кратко и естественно передаёт полное отсутствие помощи Иерусалиму, не добавляя личности или причины.
- source_word: רָאוּהָ צָרִים
  choice: враги смотрели на него
  rationale: Глагол ראה здесь допускает не только факт зрительного восприятия, но и взгляд на поверженный город. «Смотрели на него» сохраняет сцену вражеского злорадства без внесения самого злорадства в этот глагол.
- source_word: שָׂחֲקוּ עַל מִשְׁבַּתֶּהָ
  choice: смеялись над его разорением
  rationale: שׂחק передаёт насмешливый смех. Редкое מִשְׁבָּת обозначает прекращение, крушение или опустошённое состояние; «разорение» хорошо соответствует контексту разрушенного города, а неоднозначность отмечена в сноске.
