source:
  edition: WLC
  text: יָד/וֹ֙ פָּ֣רַשׂ צָ֔ר עַ֖ל כָּל מַחֲמַדֶּ֑י/הָ כִּֽי רָאֲתָ֤ה גוֹיִם֙ בָּ֣אוּ מִקְדָּשָׁ֔/הּ אֲשֶׁ֣ר צִוִּ֔יתָה לֹא יָבֹ֥אוּ בַ/קָּהָ֖ל לָֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/010.yaml
  text: The enemy has stretched out his hand over all her precious things[c][b][a], for she has seen nations enter her sanctuary—those whom you commanded not to enter your assembly.
translation:
  language: ru
  text: Враг простёр руку над всеми её драгоценностями[a], ибо она видела, как народы[b] вошли в её святилище — народы, которым Ты повелел не входить в Твоё собрание[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её сокровища», «всё, что было ей дорого».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чужие народы»; речь идёт о народах, вторгшихся в священное место.'
    reason: lexical_alternative
  - marker: c
    text: 'Ср. Втор. 23: некоторые народы не должны были входить в собрание Господа.'
    reason: cross_reference
lexical_decisions:
- source_word: יָדוֹ ... פָּרַשׂ
  choice: простёр руку
  rationale: Сохраняет еврейский образ враждебного посягательства и захвата и естественно звучит в достойном русском регистре.
- source_word: צָר
  choice: враг
  rationale: В контексте разорения Иерусалима обозначает враждебного притеснителя; это ясный и широкий русский эквивалент.
- source_word: מַחֲמַדֶּיהָ
  choice: все её драгоценности
  rationale: Слово охватывает всё ценное и желанное, не ограничиваясь денежными сокровищами.
- source_word: כִּי
  choice: Она увидела
  rationale: Связь с предыдущим утверждением передана последовательностью предложений; в данном контексте כִּי может вводить пояснение или основание, но буквальное «ибо» по-русски создаёт не вполне ясную причинную связь.
- source_word: רָאֲתָה
  choice: увидела
  rationale: Еврейский перфект естественно передаётся русским прошедшим временем; событие представлено как пережитое осквернение.
- source_word: גוֹיִם
  choice: народы
  rationale: Прямо передаёт множественное число и не привносит более поздний религиозный оттенок слова «язычники».
- source_word: בָּאוּ מִקְדָּשָׁהּ
  choice: вошли в её святилище
  rationale: Передаёт вторжение чужих народов в освящённое пространство Иерусалима.
- source_word: אֲשֶׁר צִוִּיתָה
  choice: те, о которых Ты повелел
  rationale: Относительное местоимение может относиться к упомянутым народам; «о которых» ясно показывает, что повеление касалось их допуска.
- source_word: לֹא יָבֹאוּ
  choice: Пусть они не входят
  rationale: Передаёт запрет в форме прямого Божьего повеления, не превращая его в простое описание.
- source_word: בַקָּהָל לָךְ
  choice: в Твоё собрание
  rationale: קָהָל обозначает собранное сообщество; «собрание» сохраняет широту значения и не привносит церковно-конфессиональной терминологии.
theological_decisions:
- issue: К кому обращено второе лицо в צִוִּיתָה и לָךְ
  choice: 'Прямое обращение к Богу: «Ты повелел», «Твоё собрание»'
  alternative: Безличная ссылка на установленный запрет
  rationale: Формы второго лица естественнее всего понимать как обращение к Богу внутри плача. Несогласование грамматического рода в масоретском тексте не устраняется и не используется для смены адресата.
- issue: Характер запрета на вхождение в собрание
  choice: Передан как Божье повеление без уточнения конкретных народов
  alternative: Прямо назвать аммонитян и моавитян по Второзаконию 23
  rationale: Сам стих не называет эти народы; конкретизация осталась в перекрёстной ссылке, чтобы не добавлять её в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным плачевным тоном. Образ «простёр руку» сохранён; синтаксис разделён на два предложения ради ясности. Прописные местоимения при обращении к Богу соответствуют принятому русскому библейскому регистру.
