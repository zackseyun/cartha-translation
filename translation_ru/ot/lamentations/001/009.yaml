  text: טֻמְאָתָ֣/הּ בְּ/שׁוּלֶ֗י/הָ לֹ֤א זָֽכְרָה֙ אַחֲרִיתָ֔/הּ וַ/תֵּ֣רֶד פְּלָאִ֔ים אֵ֥ין מְנַחֵ֖ם לָ֑/הּ רְאֵ֤ה יְהוָה֙ אֶת עָנְיִ֔/י כִּ֥י הִגְדִּ֖יל אוֹיֵֽב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/009.yaml
  text: Her uncleanness was in her skirts[a]; she did not remember her end. So she came down astonishingly; there was no comforter for her. Look, O Yahweh, my affliction[c][b], for the enemy has magnified himself.
translation:
  language: ru
  text: Нечистота её — на её подоле; она не помышляла о своём конце.[a] И опустилась она поразительно;[b] нет у неё утешителя. Взгляни, Яхве, на моё бедствие, ведь враг превознёс себя.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не думала о своём будущем»; «не задумывалась, чем всё кончится».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сошла (опустилась) необычайно»; речь о потрясающем, небывалом падении.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ведь враг возвеличил себя»; возможен также смысл: «враг проявил могущество».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתָהּ
  choice: нечистота её
  rationale: Сохраняет широкий смысл ритуальной и нравственной нечистоты, не сводя образ лишь к физической грязи.
- source_word: בְּשׁוּלֶיהָ
  choice: на её подоле
  rationale: Естественно передаёт нижний край одежды и сохраняет образ явной, приставшей к одежде нечистоты.
- source_word: לֹא זָכְרָה אַחֲרִיתָהּ
  choice: она не помышляла о своём конце
  rationale: '«Конец» сохраняет краткость и многозначность אַחֲרִית: конечный исход, последствия или будущее.'
- source_word: וַתֵּרֶד פְּלָאִים
  choice: и низверглась она — неслыханно
  rationale: «Низверглась» удерживает образ движения вниз и унижения, а «неслыханно» передаёт чрезвычайный, потрясающий характер падения без положительного оттенка слова «чудесно».
- source_word: אֵין מְנַחֵם לָהּ
  choice: нет у неё утешителя
  rationale: Сохраняет существительное и повторяющийся в книге Плача мотив отсутствующего утешителя.
- source_word: רְאֵה יְהוָה אֶת עָנְיִי
  choice: Взгляни, Яхве, на моё бедствие
  rationale: Передаёт настойчивую просьбу о Божьем внимании; «бедствие» естественно охватывает страдание и униженное положение.
- source_word: כִּי הִגְדִּיל אוֹיֵב
  choice: ведь враг вознёсся
  rationale: Передаёт возвышение и торжествующую самонадеянность врага, сохраняя возможную смысловую напряжённость выражения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- issue: Характер нечистоты Иерусалима
  choice: обобщённое «нечистота»
  alternative: скверна; грязь
  rationale: Текст допускает ритуальные, телесные и нравственные ассоциации; перевод не ограничивает образ одной из них.
- issue: Значение возвышения врага
  choice: враг вознёсся
  alternative: враг проявил могущество; враг превознёс себя
  rationale: Форма הִגְדִּיל допускает акцент как на возвеличивании и торжестве врага, так и на его самопревозношении; основной текст сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно поэтическим строем, соответствующим плачу. Инверсия «низверглась она» и слово «утешитель» сохраняют возвышенный ритм и повторяющиеся мотивы книги, оставаясь понятными современному читателю.
