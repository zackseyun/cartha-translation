  source_fidelity: В целом переданы образ нечистоты на подоле, отсутствие предусмотренного исхода, потрясающее нисхождение, отсутствие утешителя, обращение к Яхве и торжество врага. Однако «низверглась» добавляет оттенок внешнего насильственного свержения, которого в וַתֵּרֶד («сошла/опустилась») нет. В последней строке «враг вознёсся» может означать просто повышение статуса; еврейский хифиль הִגְדִּיל естественнее передать как «враг превознёс себя» (либо «возвеличился»).
  naturalness: Текст литературен и в целом естественен. «Нечистота её — на её подоле» и «нет у неё утешителя» хорошо сохраняют поэтическую сжатость. «И низверглась она — неслыханно» звучит несколько тяжеловесно, а наречие «неслыханно» менее точно связано с образом удивительного падения, чем «поразительно».
  terminology: '«Нечистота», «подол», «утешитель» и «Яхве» уместны. «Бедствие» допустимо для עָנְיִי, хотя «страдание» ближе к личному состоянию угнетения; менять его не обязательно. Кавычки вокруг прямого обращения не требуются: речь продолжается от первого лица в рамках поэтической персонификации.'
