- from: Нечистота её — на её подоле; она не помышляла о своём конце.[a] И низверглась она — неслыханно;[b] нет у неё утешителя. «Взгляни, Яхве, на моё бедствие, ведь враг вознёсся!»[c]
  to: Нечистота её — на её подоле; она не помышляла о своём конце.[a] И опустилась она поразительно;[b] нет у неё утешителя. Взгляни, Яхве, на моё бедствие, ведь враг превознёс себя.[c]
  rationale: Исправлено чрезмерно сильное «низверглась» на «опустилась», что точнее сохраняет основной образ ירד и не добавляет идеи насильственного свержения. «Поразительно» естественнее передаёт контекстуально отрицательную необычайность פְּלָאִים. «Превознёс себя» яснее отражает хифиль גדל и вражеское торжествующее самовозвеличивание. Кавычки сняты как не обусловленные исходным текстом.
