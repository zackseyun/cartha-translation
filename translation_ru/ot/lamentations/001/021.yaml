  terminology: «Бедствие», «утешить», «возвестил» и прямое «Ты» удачны для современного литературного библейского регистра. «Бедствие» корректно передаёт רָעָה как постигшую Иерусалим катастрофу, не подразумевая нравственное зло. Неоднозначность финального имперфекта сохранена в сноске.
