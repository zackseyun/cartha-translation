source:
  edition: WLC
  text: שָׁמְע֞וּ כִּ֧י נֶאֱנָחָ֣ה אָ֗נִי אֵ֤ין מְנַחֵם֙ לִ֔/י כָּל אֹ֨יְבַ֜/י שָׁמְע֤וּ רָֽעָתִ/י֙ שָׂ֔שׂוּ כִּ֥י אַתָּ֖ה עָשִׂ֑יתָ הֵבֵ֥אתָ יוֹם קָרָ֖אתָ וְ/יִֽהְי֥וּ כָמֽוֹ/נִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/021.yaml
  text: They have heard that I groan[a]; there is no one to comfort me. All my enemies have heard of my trouble; they rejoice that you have done it. You have brought the day you proclaimed[c][b]; let them become like me.
translation:
  language: ru
  text: Они услышали, что я стону; некому утешить меня. Все мои враги услышали о моём бедствии[a] и радуются тому, что это сделал Ты. Ты привёл день, о наступлении которого Ты возвестил[b]; пусть они станут такими, как я[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о моём несчастье» либо «о моём горе». Еврейское слово может обозначать бедствие, несчастье или страдание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Ты привёл день, о наступлении которого Ты объявил».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «и они станут такими, как я». Еврейскую форму можно понять как пожелание или как утверждение о будущем; контекст плача хорошо согласуется с пожеланием.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְעוּ כִּי נֶאֱנָחָה אָנִי
  choice: Они услышали, как я стону
  rationale: Перфект שָׁמְעוּ передан прошедшим временем, естественным для русского повествования, а כִּי вводит содержание услышанного. נֶאֱנָחָה выражает продолжающийся стон в страдании.
- source_word: אֵין מְנַחֵם לִי
  choice: некому утешить меня
  rationale: Краткая и естественная русская конструкция точно передаёт отсутствие всякого утешителя.
- source_word: רָעָתִי
  choice: о моём бедствии
  rationale: В данном контексте רָעָה означает постигшее говорящую несчастье или бедствие, а не нравственное зло.
- source_word: שָׂשׂוּ כִּי אַתָּה עָשִׂיתָ
  choice: и радуются тому, что это сделал Ты
  rationale: Сохраняются активная радость врагов и прямое приписывание случившегося Богу; подразумеваемое дополнение передано местоимением «это».
- source_word: הֵבֵאתָ יוֹם קָרָאתָ
  choice: Ты привёл день, о котором возвестил
  rationale: Оборот сохраняет образ наступившего назначенного дня, а קרא в контексте пророческого суда естественно передаётся как «возвестить».
- source_word: וְיִהְיוּ כָמוֹנִי
  choice: пусть и они станут такими, как я
  rationale: Имперфект контекстуально понят как пожелание или мольба; «станут» передаёт переход врагов в такое же бедственное состояние.
theological_decisions:
- issue: Божественное действие в бедствии Иерусалима
  choice: «это сделал Ты» и «Ты привёл день»
  alternative: Смягчить или оставить неясной роль Бога в бедствии
  rationale: Еврейский текст прямо обращается к Богу во втором лице и приписывает Ему как случившееся бедствие, так и наступление возвещённого дня; эта напряжённость сохранена.
- issue: Пожелание суда врагам
  choice: «пусть и они станут такими, как я»
  alternative: «и они станут такими, как я»
  rationale: Контекст плача поддерживает юссивное, молитвенно-пожелательное прочтение, однако грамматически возможно и простое утверждение о будущем, что отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. Синтаксис сделан ясным для широкого читателя, при этом сохранены прямое обращение к Богу, образ возвещённого дня и неоднозначность заключительного глагола.
