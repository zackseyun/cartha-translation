  source_fidelity: 'Основной смысл передан верно: услышанный стон, отсутствие утешителя, злорадство врагов, прямое приписывание действия Богу, возвещённый день и заключительное пожелание сохранены. Однако כִּי в первом предложении точнее передать союзом «что», а не «как»: речь идёт о содержании услышанного. Для הֵבֵאתָ יוֹם קָרָאתָ требуется более ясная русская конструкция, выражающая, что Бог прежде возвестил наступление этого дня.'
