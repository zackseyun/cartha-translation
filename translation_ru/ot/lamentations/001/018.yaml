source:
  edition: WLC
  text: צַדִּ֥יק ה֛וּא יְהוָ֖ה כִּ֣י פִ֣י/הוּ מָרִ֑יתִי שִׁמְעוּ נָ֣א כָל עמים וּ/רְאוּ֙ מַכְאֹבִ֔/י בְּתוּלֹתַ֥/י וּ/בַחוּרַ֖/י הָלְכ֥וּ בַ/שֶּֽׁבִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/018.yaml
  text: 'Yahweh is righteous[a], for I have rebelled against his word. Hear, please, all peoples[b], and see my pain: my virgins and my young men have gone into captivity.'
translation:
  language: ru
  text: 'Праведен Яхве[a], ибо я восстала против Его слова[b]. Послушайте же, все народы, и взгляните на мою боль: мои девушки[c] и юноши ушли в плен.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедлив Яхве».'
    reason: 'Лексическая альтернатива для צַדִּיק: слово выражает как праведность, так и справедливость Его суда.'
  - marker: b
    text: 'Буквально: «против Его рта»; то есть против того, что Он сказал или повелел.'
    reason: Поясняет буквальный образ и метонимическое значение פִיהוּ.
  - marker: c
    text: 'Или: «мои девственницы»; также возможно: «мои молодые женщины» или «мои девы».'
    reason: Поясняет диапазон значения בְּתוּלֹתַי, сохраняя естественный современный вариант в основном тексте.
lexical_decisions:
- source_word: צַדִּיק
  choice: праведен
  rationale: Предикативное прилагательное выражает нравственную правоту Яхве в Его суде; «праведен» сохраняет богословскую ёмкость исходного слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: כִּי
  choice: ибо
  rationale: Вводит основание признания праведности Яхве и соответствует возвышенному поэтическому регистру плача.
- source_word: פִיהוּ
  choice: сказанного Им
  rationale: Буквально «Его уст»; это метонимия речи, повеления или слова Яхве. Выбран естественный русский оборот без устранения смысловой широты.
- source_word: מָרִיתִי
  choice: я восстала против
  rationale: Глагол выражает непокорность и мятеж против власти. Женский род обусловлен персонифицированным Иерусалимом, говорящим в контексте главы.
- source_word: שִׁמְעוּ נָא
  choice: послушайте же
  rationale: Передаёт повеление и усиленную частицей נָא настоятельную просьбу; по-русски естественнее, чем буквальное «услышьте, пожалуйста».
- source_word: כָל עַמִּים
  choice: все народы
  rationale: עַמִּים обозначает народы или этнические общности; «все народы» естественно в данном обращении.
- source_word: וּרְאוּ
  choice: и взгляните
  rationale: Императив образует параллель с «послушайте»; «взгляните» передаёт призыв обратить внимание на страдание.
- source_word: מַכְאֹבִי
  choice: мою боль
  rationale: Сохраняет конкретное и широкое значение физической либо душевной боли.
- source_word: בְּתוּלֹתַי
  choice: мои девушки
  rationale: בְּתוּלוֹת может обозначать девственниц или незамужних молодых женщин; «девушки» звучит естественно и не навязывает контексту спорный акцент на физиологическом статусе.
- source_word: וּבַחוּרַי
  choice: и юноши
  rationale: В параллели с молодыми женщинами слово обозначает молодых мужчин; «юноши» кратко и поэтично.
- source_word: הָלְכוּ בַשֶּׁבִי
  choice: ушли в плен
  rationale: Сохраняет простой, некаузативный глагол «ушли» и устойчиво передаёт בַשֶּׁבִי как пленение или неволю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя; транслитерация сохраняет его отличие от титула.
- issue: Метонимия פִיהוּ, буквально «Его уст»
  choice: сказанного Им
  alternative: Его слова / Его повеления / Его уст
  rationale: Формулировка естественна по-русски и сохраняет возможность понимать выражение как речь или повеление Бога, не сводя его к одному частному виду высказывания.
- issue: Грамматический род говорящей
  choice: я восстала
  alternative: я восстал
  rationale: В контексте говорит персонифицированная дочь Сиона/Иерусалим; русский язык требует обозначить женский род, хотя еврейская глагольная форма первого лица сама рода не выражает.
translation_notes:
  register: Современный литературный русский с достоинством плачевой поэзии. Частица «же» передаёт настоятельность נָא без неестественного «пожалуйста». Женский род говорящей раскрывает контекстуальную персонификацию Иерусалима. Все маркеры сносок [a], [b] присутствуют в основном тексте.
