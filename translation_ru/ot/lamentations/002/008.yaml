source:
  edition: WLC
  text: חָשַׁ֨ב יְהוָ֤ה לְ/הַשְׁחִית֙ חוֹמַ֣ת בַּת צִיּ֔וֹן נָ֣טָה קָ֔ו לֹא הֵשִׁ֥יב יָד֖/וֹ מִ/בַּלֵּ֑עַ וַ/יַּֽאֲבֶל חֵ֥ל וְ/חוֹמָ֖ה יַחְדָּ֥ו אֻמְלָֽלוּ׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/008.yaml
  text: Yahweh determined to destroy the wall of daughter Zion[a]; he stretched out a measuring line; he did not hold back his hand from swallowing up, and he made rampart and wall mourn[b]; together they languish.
translation:
  language: ru
  text: Яхве решил разрушить стену дочери Сиона[a]. Он протянул мерный шнур и не отвёл руки, чтобы не поглощать[b]. Он заставил вал и стену скорбеть; вместе они изнемогают.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «дочь Сиона» олицетворяет Сион, то есть Иерусалим, как дочь.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не отвратил руки от поглощения». Буквально в еврейском тексте — «от поглощать»; это яркий образ полного уничтожения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׁב
  choice: решил
  rationale: В данном контексте глагол обозначает обдуманное и твёрдое намерение; «решил» естественно передаёт эту целенаправленность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: לְהַשְׁחִית
  choice: разрушить
  rationale: Форма породы хифиль обозначает активное причинение гибели или разрушения; применительно к стене наиболее естественно «разрушить».
- source_word: חוֹמַת בַּת צִיּוֹן
  choice: стену дочери Сиона
  rationale: Сохранён поэтический образ Сиона/Иерусалима как дочери, без замены его простым географическим названием.
- source_word: נָטָה קָו
  choice: протянул мерный шнур
  rationale: Сочетание передаёт образ намеренно отмеренного действия; «мерный шнур» ясно обозначает древний измерительный инструмент.
- source_word: לֹא הֵשִׁיב יָדוֹ מִבַּלֵּעַ
  choice: не отвёл руки от поглощения
  rationale: Сохранены как идиома неудержимого действия, так и яркая метафора поглощения, обозначающая полное уничтожение.
- source_word: וַיַּאֲבֶל
  choice: заставил ... скорбеть
  rationale: Каузативный смысл формы передан явно, а олицетворение оборонительных сооружений сохранено.
- source_word: חֵל
  choice: вал
  rationale: Слово обозначает внешнее оборонительное сооружение, отличное от основной стены; «вал» краток и понятен современному читателю.
- source_word: וְחוֹמָה
  choice: стена
  rationale: Прямой эквивалент сохраняет поэтическую пару «вал и стена».
- source_word: יַחְדָּו
  choice: вместе
  rationale: Передаёт общее состояние обоих олицетворённых укреплений.
- source_word: אֻמְלָלוּ
  choice: изнемогают
  rationale: Глагол выражает ослабление и угасание; настоящее время по-русски передаёт возникшее вследствие разрушения состояние и поддерживает образ скорбящих укреплений.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно употреблено личное имя Бога; транслитерация сохраняет отличие имени от титула.
- issue: Образ действия Божьей руки
  choice: не отвёл руки от поглощения
  alternative: не удержал руки от истребления
  rationale: Основной вариант сохраняет напряжённую метафору еврейского текста и не смягчает изображение суда более общим словом «истребление».
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического олицетворения и суровой образности плача. Синтаксис сделан ясным для обычного читателя, но мерный шнур, действующая рука и скорбящие укрепления сохранены как значимые образы исходного текста.
