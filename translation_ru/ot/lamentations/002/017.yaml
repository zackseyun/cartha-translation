source:
  edition: WLC
  text: עָשָׂ֨ה יְהוָ֜ה אֲשֶׁ֣ר זָמָ֗ם בִּצַּ֤ע אֶמְרָת/וֹ֙ אֲשֶׁ֣ר צִוָּ֣ה מִֽ/ימֵי קֶ֔דֶם הָרַ֖ס וְ/לֹ֣א חָמָ֑ל וַ/יְשַׂמַּ֤ח עָלַ֨יִ/ךְ֙ אוֹיֵ֔ב הֵרִ֖ים קֶ֥רֶן צָרָֽיִ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/017.yaml
  text: Yahweh has done what he planned[a]; he has fulfilled his word, which he commanded from days of old. He has torn down and has not shown pity; he has made the enemy rejoice over you[c][b]; he has exalted the horn of your foes.
translation:
  language: ru
  text: Яхве сделал то, что задумал; Он исполнил[a] Своё слово, которое повелел исполнить ещё в древние дни[b]. Он разрушил и не пощадил; Он заставил врага торжествовать над тобой и возвысил рог[c] твоих противников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осуществил», «привёл в исполнение».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от дней древности», то есть с давних времён.'
    reason: lexical_alternative
  - marker: c
    text: «Рог» в Библии служит образом силы, могущества или чести.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: זָמָם
  choice: задумал
  rationale: Выражает обдуманное намерение, которое Яхве осуществил.
- source_word: בִּצַּע אֶמְרָתוֹ
  choice: исполнил Своё слово
  rationale: Естественно передаёт доведение прежде произнесённого слова до исполнения; сноска сохраняет более буквальные оттенки осуществления и приведения в исполнение.
- source_word: אֲשֶׁר צִוָּה מִימֵי קֶדֶם
  choice: которое заповедал ещё в древние дни
  rationale: Сохраняет значение глагола «повелевать, заповедовать» и поэтическую временную формулу, не сводя её просто к «давно».
- source_word: הָרַס וְלֹא חָמָל
  choice: разрушил и не пощадил
  rationale: Передаёт образ уничтожения и отсутствие жалости краткой, сильной формулировкой, подходящей плачу.
- source_word: וַיְשַׂמַּח עָלַיִךְ אוֹיֵב
  choice: сделал так, что враг торжествовал над тобой
  rationale: Сохраняет каузативную роль Яхве и вражеское торжество над Сионом, к которому обращаются во втором лице единственного числа.
- source_word: הֵרִים קֶרֶן צָרָיִךְ
  choice: возвысил рог твоих противников
  rationale: Сохраняет библейский образ рога как силы, власти и чести, а также множественное число «противников».
theological_decisions:
- issue: Участие Бога в разрушении Иерусалима
  choice: Яхве прямо назван Тем, Кто задумал, исполнил, разрушил, не пощадил, вызвал торжество врага и возвысил силу противников.
  alternative: Смягчить причинность, представив действия Бога лишь как пассивное допущение.
  rationale: Все основные глаголы еврейского текста называют Яхве действующим субъектом. Перевод сохраняет эту богословскую напряжённость и не подменяет прямое действие простым позволением.
translation_notes:
  register: Современный литературный русский язык с поэтической краткостью, соответствующей жанру плача. Синтаксический параллелизм и образ «рога» сохранены; архаизмы сведены к минимуму. Заглавные местоимения при обращении к Богу использованы в соответствии с принятой русской библейской издательской традицией.
