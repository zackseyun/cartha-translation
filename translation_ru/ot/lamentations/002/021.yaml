base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/021.yaml
  text: Young and old lie on the ground in the streets[a]; my virgins and my young men have fallen by the sword. You killed them in the day of your anger[b]; you slaughtered without pity.
translation:
  language: ru
  text: На земле, на улицах лежат юноша и старик; мои девушки[a] и мои юноши пали от меча. Ты убил их в день Своего гнева, заколол, не пощадив[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мои девственницы»; также возможно: «мои девы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не пожалев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכְבוּ לָאָרֶץ חוּצוֹת
  choice: На земле, на улицах, лежат
  rationale: Совершенный вид описывает наступившее состояние погибших; настоящее «лежат» живо передаёт картину. «На земле» естественно выражает положение тел, а «на улицах» — городские общественные пространства.
- source_word: נַעַר וְזָקֵן
  choice: юноша и старик
  rationale: Сохранена конкретная парная формула еврейского текста, которая охватывает разные поколения.
- source_word: בְּתוּלֹתַי
  choice: мои девушки
  rationale: В данном плаче речь идёт о молодых незамужних женщинах Иерусалима; «девушки» естественно для современного русского, а более буквальное значение отмечено в сноске.
- source_word: וּבַחוּרַי
  choice: мои юноши
  rationale: Слово обозначает молодых мужчин в расцвете сил; «юноши» сохраняет торжественный, но понятный регистр.
- source_word: נָפְלוּ בֶחָרֶב
  choice: пали от меча
  rationale: Сохранён традиционный и прозрачный образ насильственной смерти от оружия без расширения до «пали в бою».
- source_word: הָרַגְתָּ
  choice: Ты убил их
  rationale: Сохранено прямое обращение к Богу во втором лице; местоимение «их» восполняется из непосредственного контекста.
- source_word: בְּיוֹם אַפֶּךָ
  choice: в день Своего гнева
  rationale: «Гнев» точно и понятно передаёт переносное значение אַף; прописная буква в «Своего» соответствует принятому русскому благоговейному оформлению обращения к Богу.
- source_word: טָבַחְתָּ
  choice: заколол
  rationale: Глагол сильнее הָרַגְתָּ и несёт образ массового заклания; «заколол» сохраняет этот резкий образ и достоинство библейской речи.
- source_word: לֹא חָמָלְתָּ
  choice: не пощадив
  rationale: Деепричастная конструкция естественно соединяет заключительную оговорку с предыдущим глаголом и точно передаёт отсутствие пощады.
theological_decisions:
- issue: Прямое приписывание гибели жителей Богу
  choice: «Ты убил их… заколол»
  alternative: Безличная или страдательная конструкция, смягчающая указание на деятеля
  rationale: Еврейский текст прямо обращается к Богу как к действующему лицу. Эта трудная богословская напряжённость сохранена без смягчения.
translation_notes:
  register: Современный литературный русский с достоинством поэтического плача. Параллелизм и резкое прямое обращение сохранены; устаревшие слова сведены к минимуму.
