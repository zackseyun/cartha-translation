id: LAM.2.6
reference: Lamentations 2:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יַּחְמֹ֤ס כַּ/גַּן֙ שֻׂכּ֔/וֹ שִׁחֵ֖ת מוֹעֲד֑/וֹ שִׁכַּ֨ח יְהוָ֤ה בְּ/צִיּוֹן֙ מוֹעֵ֣ד וְ/שַׁבָּ֔ת וַ/יִּנְאַ֥ץ בְּ/זַֽעַם אַפּ֖/וֹ מֶ֥לֶךְ וְ/כֹהֵֽן׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/006.yaml
  text: He has laid waste his shelter like a garden[a]; he has destroyed his appointed meeting place. Yahweh has caused appointed feast and Sabbath to be forgotten in Zion[c][b], and in the indignation of his anger he has spurned king and priest.
translation:
  language: ru
  text: Он разорил, словно сад, Своё укрытие[a], уничтожил Своё место собрания[b]. Яхве предал забвению на Сионе праздник[c] и субботу; в пылу Своего гнева Он отверг царя и священника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Свою кущу», «Свой шалаш». Точное значение образа спорно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Своё назначенное место встречи»; возможно: «Свою скинию собрания». Еврейское слово родственно слову, далее переведённому как «праздник».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «назначенное время», «праздничное собрание». В сочетании с субботой речь, вероятнее всего, идёт об установленном празднике.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹס
  choice: разорил
  rationale: Пиэль глагола חמס здесь передаёт насильственное опустошение; «разорил» естественно и ёмко выражает разрушительное действие.
- source_word: כַּגַּן
  choice: словно сад
  rationale: Сохраняет явное сравнение оригинала, не пытаясь разрешить трудность поэтического образа.
- source_word: שֻׂכּוֹ
  choice: Своё укрытие
  rationale: Широкое значение существительного допускает укрытие, шалаш или кущу; «укрытие» не привносит специального значения скинии.
- source_word: שִׁחֵת
  choice: уничтожил
  rationale: В контексте разорения Сиона глагол обозначает конкретное разрушение.
- source_word: מוֹעֲדוֹ
  choice: Своё место собрания
  rationale: После глагола «уничтожил» вероятнее пространственное значение — место назначенной встречи или собрания; при этом примечание сохраняет культовую альтернативу.
- source_word: שִׁכַּח
  choice: предал забвению
  rationale: 'Передаёт каузативный смысл: Яхве сделал так, что праздник и суббота были забыты или прекратились.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: מוֹעֵד
  choice: праздник
  rationale: В паре с субботой слово, вероятнее всего, означает установленное праздничное время; примечание сохраняет более широкие варианты.
- source_word: וְשַׁבָּת
  choice: и субботу
  rationale: Прямой и естественный перевод в составе однородной пары.
- source_word: וַיִּנְאַץ
  choice: отверг
  rationale: Передаёт презрительное отвержение; более нейтрально и естественно для современного русского, чем архаичное «презрел».
- source_word: בְּזַעַם אַפּוֹ
  choice: в пылу Своего гнева
  rationale: Естественно передаёт усиленную еврейскую формулу яростного гнева, не воспроизводя тяжеловесное удвоение буквально.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон, поэтому сохранено личное имя в общепринятой научной транслитерации.
- issue: Значение первого מוֹעֲדוֹ
  choice: 'пространственное: «Своё место собрания»'
  alternative: 'временное: «Свой праздник»; культовое: «Свою скинию собрания»'
  rationale: Сочетание с «уничтожил» благоприятствует пространственному смыслу, тогда как следующее מוֹעֵד в паре с субботой имеет празднично-временной смысл. Различие сохраняет возможную игру значений.
- issue: Антропоморфное выражение о гневе Бога
  choice: «в пылу Своего гнева»
  alternative: «в ярости гнева Своего»
  rationale: Сохранена напряжённость изображения Божьего суда без смягчения, но выражение дано естественным современным русским языком.
translation_notes:
  register: Современный литературный русский с достоинством плача и умеренно возвышенной лексикой. Заглавные местоимения относятся к Яхве. Параллелизм двух полустиший сохранён; неоднозначные культовые термины не конкретизированы без оговорки.
