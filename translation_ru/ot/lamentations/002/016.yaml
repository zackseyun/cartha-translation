  text: פָּצ֨וּ עָלַ֤יִ/ךְ פִּי/הֶם֙ כָּל א֣וֹיְבַ֔יִ/ךְ שָֽׁרְקוּ֙ וַ/יַּֽחַרְקוּ שֵׁ֔ן אָמְר֖וּ בִּלָּ֑עְנוּ אַ֣ךְ זֶ֥ה הַ/יּ֛וֹם שֶׁ/קִּוִּינֻ֖/הוּ מָצָ֥אנוּ רָאִֽינוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/016.yaml
  text: All your enemies open their mouths against you[a]; they hiss and gnash their teeth. They say, “We have swallowed you up! Surely this is the day we hoped for; we have found it[b], we have seen it.”
translation:
  language: ru
  text: 'Все твои враги разинули на тебя рты; засвистели[a] и заскрежетали зубами. Они сказали: «Мы поглотили её[b]! Вот день, которого мы ждали; мы нашли его, мы увидели!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол может означать «свистеть» или «шипеть»; здесь он выражает враждебную насмешку.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Мы поглотили». Дополнение в еврейском тексте не выражено; по контексту речь идёт об олицетворённом Сионе. Возможен также перевод без дополнения: «Мы поглотили».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: פָּצוּ עָלַיִךְ פִּיהֶם
  choice: разинули на тебя рты
  rationale: Передаёт широкое раскрытие рта и направленную против Сиона враждебность; «разинули» сохраняет резкую образность еврейского выражения.
- source_word: כָּל אֹיְבַיִךְ
  choice: все твои враги
  rationale: Прямо и естественно передаёт совокупность врагов и сохраняет обращение во втором лице к олицетворённому Сиону.
- source_word: שָׁרְקוּ
  choice: свистят с насмешкой
  rationale: Глагол обозначает свист или шипение как знак издевательства либо изумления; контекст требует явно передать насмешливую враждебность, не сводя значение только к «шипят».
- source_word: וַיַּחַרְקוּ שֵׁן
  choice: скрежещут зубами
  rationale: Устойчивое русское выражение передаёт ярость и злобу исходного оборота.
- source_word: בִּלָּעְנוּ
  choice: мы поглотили её
  rationale: Сохраняет метафору полного уничтожения. В масоретском тексте у глагола нет выраженного дополнения; «её» естественно отсылает к олицетворённой дочери Сиона, хотя предшествующее обращение дано во втором лице.
- source_word: אַךְ זֶה הַיּוֹם
  choice: вот он, день
  rationale: Передаёт торжествующее эмфатическое утверждение אַךְ и указательное выделение долгожданного дня.
- source_word: שֶׁקִּוִּינֻהוּ
  choice: которого мы ждали
  rationale: קוה сочетает ожидание с надеждой; в речи врагов «ждали» естественно выражает предвкушение, не придавая ему положительной окраски русского слова «надеялись».
- source_word: מָצָאנוּ רָאִינוּ
  choice: мы дождались его, мы увидели
  rationale: Буквально מָצָאנוּ — «мы нашли», но без выраженного объекта и после «дня, которого ждали» русское «дождались его» естественно передаёт наступление ожидаемого дня; «увидели» сохраняет простой и кульминационный параллелизм.
theological_decisions:
- issue: Лицо подразумеваемого дополнения при בִּלָּעְנוּ
  choice: «мы поглотили её»
  alternative: '«мы поглотили тебя» или без дополнения: «мы поглотили»'
  rationale: Еврейская форма не содержит объектного суффикса. Контекст допускает отсылку к олицетворённой дочери Сиона в третьем лице внутри прямой речи, тогда как «тебя» продолжает внешнее обращение. Перевод выбирает естественную контекстуальную отсылку, а примечание сохраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской образностью. Сохранены прямое обращение к Сиону, вражеская насмешка и метафора поглощения; архаизмы по возможности исключены.
