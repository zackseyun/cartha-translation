  text: ק֣וּמִי רֹ֣נִּי ב/ליל לְ/רֹאשׁ֙ אַשְׁמֻר֔וֹת שִׁפְכִ֤י כַ/מַּ֨יִם֙ לִבֵּ֔/ךְ נֹ֖כַח פְּנֵ֣י אֲדֹנָ֑/י שְׂאִ֧י אֵלָ֣י/ו כַּפַּ֗יִ/ךְ עַל נֶ֨פֶשׁ֙ עֽוֹלָלַ֔יִ/ךְ הָ/עֲטוּפִ֥ים בְּ/רָעָ֖ב בְּ/רֹ֥אשׁ כָּל חוּצֽוֹת׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/019.yaml
  text: Rise[a], cry out in the night, at the beginning of the watches; pour out your heart like water before the face of the Lord. Lift up your hands to him for the lives of your little children, who are faint with hunger at the head of every street.
translation:
  language: ru
  text: Встань, взывай в ночи, в начале ночных страж; излей, как воду, своё сердце пред лицом Господа. Подними к Нему руки за жизнь своих маленьких детей, изнемогающих от голода на углу каждой улицы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в голове (или в начале) каждой улицы»; выражение может обозначать углы улиц или перекрёстки.'
    reason: Еврейская пространственная идиома
lexical_decisions:
- source_word: ק֣וּמִי
  choice: Встань
  rationale: Повелительная форма женского рода обращена к олицетворённой дочери Сиона; «встань» естественно передаёт срочный призыв.
- source_word: רֹ֣נִּי
  choice: взывай
  rationale: Глагол обозначает громкий, звучный крик; в контексте плача «взывай» передаёт скорбный призыв, не придавая ему оттенка радостного пения.
- source_word: לְ/רֹאשׁ אַשְׁמֻר֔וֹת
  choice: в начале ночных страж
  rationale: רֹאשׁ здесь означает начало, а אַשְׁמֻרוֹת — периоды, на которые делилась ночь. Добавление «ночных» проясняет смысл в русском контексте.
- source_word: שִׁפְכִ֤י כַ/מַּ֨יִם֙ לִבֵּ֔/ךְ
  choice: излей, как воду, своё сердце
  rationale: Сохранены метафора полного внутреннего излияния и явное сравнение с водой.
- source_word: נֹ֖כַח פְּנֵ֣י אֲדֹנָ֑/י
  choice: пред лицом Господа
  rationale: Формулировка сохраняет конкретный еврейский образ непосредственного пребывания перед Господом и остаётся понятной в современном литературном русском.
- source_word: שְׂאִ֧י אֵלָ֣י/ו כַּפַּ֗יִ/ךְ
  choice: Подними к Нему руки
  rationale: Естественное русское выражение для молитвенного жеста с сохранением направленности к Богу.
- source_word: עַל נֶ֨פֶשׁ֙ עֽוֹלָלַ֔יִ/ךְ
  choice: ради жизни своих малых детей
  rationale: נֶפֶשׁ в данном контексте означает жизнь, а не отвлечённую «душу»; עוֹלָלִים указывает на совсем маленьких детей.
- source_word: הָ/עֲטוּפִ֥ים בְּ/רָעָ֖ב
  choice: изнемогающих от голода
  rationale: Причастие описывает детей, ослабевших и почти лишающихся сил от голода; «изнемогающих» передаёт это без излишней конкретизации.
- source_word: בְּ/רֹ֥אשׁ כָּל חוּצֽוֹת
  choice: в начале каждой улицы
  rationale: Основной текст близко сохраняет пространственный образ «у головы/начала каждой улицы», а более идиоматичное понимание вынесено в примечание.
theological_decisions:
- issue: Передача אֲדֹנָי
  choice: Господь
  alternative: Владыка; мой Господь
  rationale: В данном месте стоит титул אֲדֹנָי, а не тетраграмматон. «Господь» — естественная и нейтральная русская передача божественного титула, не отождествляющая написание с именем YHWH.
translation_notes:
  register: Современный литературный русский с достоинством поэтического плача. Формы женского рода сохраняют обращение к олицетворённому Сиону. Образность оригинала сохранена там, где она понятна по-русски; пространственная идиома пояснена примечанием.
