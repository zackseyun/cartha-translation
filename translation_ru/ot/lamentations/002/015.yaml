  text: סָֽפְק֨וּ עָלַ֤יִ/ךְ כַּפַּ֨יִם֙ כָּל עֹ֣בְרֵי דֶ֔רֶךְ שָֽׁרְקוּ֙ וַ/יָּנִ֣עוּ רֹאשָׁ֔/ם עַל בַּ֖ת יְרוּשָׁלִָ֑ם הֲ/זֹ֣את הָ/עִ֗יר שֶׁ/יֹּֽאמְרוּ֙ כְּלִ֣ילַת יֹ֔פִי מָשׂ֖וֹשׂ לְ/כָל הָ/אָֽרֶץ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/015.yaml
  text: 'All who pass along the road clap their hands at you[a]; they hiss and shake their heads over daughter Jerusalem: “Is this the city that they called the perfection of beauty[c][b], the joy of all the earth?”'
translation:
  language: ru
  text: 'Все, кто проходит по дороге, хлопают в ладоши над тобой; свистят[a] и качают головами над дочерью Иерусалима[b]: «Это ли тот город, который называли совершенством красоты[c], радостью всей земли?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шипят»; еврейский глагол может обозначать резкий звук насмешки — свист или шипение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дочь Иерусалим» — поэтическое олицетворение города.'
    reason: cultural_note
  - marker: c
    text: 'Или: «совершенный по красоте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָפְקוּ ... כַּפַּיִם
  choice: хлопают в ладоши
  rationale: Еврейское выражение обозначает ударение ладонями друг о друга; в данном контексте это жест злорадства и насмешки. Русское «хлопают в ладоши» естественно передаёт сам жест.
- source_word: עָלַיִךְ
  choice: глядя на тебя
  rationale: Предлог направляет враждебный жест на олицетворённый город. Такая передача естественна по-русски и сохраняет обращение во втором лице.
- source_word: כָּל עֹבְרֵי דֶרֶךְ
  choice: Все, кто проходит по дороге
  rationale: Перевод явно передаёт как проходящих мимо людей, так и упомянутую в еврейском тексте дорогу.
- source_word: שָׁרְקוּ
  choice: свистят
  rationale: Глагол может обозначать свист или шипение как выражение презрения. В русском контексте публичного осмеяния «свистят» звучит наиболее естественно; неоднозначность отмечена в сноске.
- source_word: וַיָּנִעוּ רֹאשָׁם
  choice: качают головами
  rationale: Это понятный современному читателю жест насмешки, презрения или поражённого недоверия.
- source_word: עַל בַּת יְרוּשָׁלָם
  choice: при виде дочери Иерусалима
  rationale: Оборот сохраняет поэтическое олицетворение города, но избегает неестественной русской конструкции с буквальным «над».
- source_word: הֲזֹאת הָעִיר
  choice: Неужели это тот город
  rationale: Частица вводит риторический вопрос с оттенком насмешливого недоверия; «неужели» делает этот оттенок явным без изменения смысла.
- source_word: שֶׁיֹּאמְרוּ
  choice: который называли
  rationale: Форма указывает на прежнюю, устойчивую славу города; русский глагол «называли» кратко и естественно передаёт эту характеристику.
- source_word: כְּלִילַת יֹפִי
  choice: совершенством красоты
  rationale: Сочетание выражает полноту или совершенство красоты. Номинальная форма сохраняет возвышенный поэтический строй и не вводит образ «венца», который лексически не обязателен.
- source_word: מָשׂוֹשׂ לְכָל הָאָרֶץ
  choice: радостью всей земли
  rationale: Перевод сохраняет широкую сферу выражения — «вся земля» — и лаконичную поэтическую характеристику Иерусалима.
