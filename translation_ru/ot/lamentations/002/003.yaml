  text: גָּדַ֣ע בָּֽ/חֳרִי אַ֗ף כֹּ֚ל קֶ֣רֶן יִשְׂרָאֵ֔ל הֵשִׁ֥יב אָח֛וֹר יְמִינ֖/וֹ מִ/פְּנֵ֣י אוֹיֵ֑ב וַ/יִּבְעַ֤ר בְּ/יַעֲקֹב֙ כְּ/אֵ֣שׁ לֶֽהָבָ֔ה אָכְלָ֖ה סָבִֽיב׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/003.yaml
  text: In burning anger he has cut down every horn of Israel[a]; he has drawn back his right hand from before the enemy[b], and he has burned in Jacob like a flaming fire that devours all around.
translation:
  language: ru
  text: В пылу гнева Он отсёк всякий рог Израиля[a], отвёл назад Свою правую руку перед лицом врага[b] и запылал в Иакове, словно пламенный огонь, пожирающий всё вокруг.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Рог» — древнееврейский образ силы, могущества или возвышенного положения.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отвёл назад Свою правую руку от лица врага». Образ может указывать на отнятие силы или защиты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַע
  choice: отсёк
  rationale: Глагол обозначает решительное отсечение или срубание. «Отсёк» естественно сочетается с образом рога и сохраняет резкость действия.
- source_word: בָּחֳרִי אַף
  choice: в пылу гнева
  rationale: Сочетание חֳרִי («жар, пыл») и אַף («гнев») выражает раскалённый гнев; формулировка также поддерживает последующий образ огня.
- source_word: כֹּל קֶרֶן יִשְׂרָאֵל
  choice: всякий рог Израиля
  rationale: Сохранена еврейская метафора рога как силы, могущества или возвышенного положения; её смысл пояснён в сноске.
- source_word: הֵשִׁיב אָחוֹר יְמִינוֹ
  choice: отвёл Свою правую руку
  rationale: Фраза изображает намеренное отведение Божьей силы или защиты; метафора сохранена без истолкования в основном тексте.
- source_word: מִפְּנֵי אוֹיֵב
  choice: перед врагом
  rationale: Передаёт пространственный образ действия в присутствии врага, не устраняя возможного оттенка отступления или лишения защиты.
- source_word: וַיִּבְעַר בְּיַעֲקֹב
  choice: запылал в Иакове
  rationale: Глагол בער и предлог בְּ рисуют огонь, действующий внутри Иакова; «запылал» естественно вводит последующее сравнение.
- source_word: כְּאֵשׁ לֶהָבָה
  choice: словно пламенный огонь
  rationale: Формулировка сохраняет усиленное сочетание образов огня и пламени и звучит по-русски литературно.
- source_word: אָכְלָה סָבִיב
  choice: пожирающий всё вокруг
  rationale: Причастная конструкция сохраняет одушевлённо-разрушительный образ огня и всеохватность סָבִיב.
theological_decisions:
- issue: Метафорический язык Божьего суда
  choice: Сохранить образы «рога», «правой руки» и пожирающего огня.
  alternative: Заменить их толкованиями «сила», «защита» и «уничтожение».
  rationale: Исходный текст раскрывает суд через несколько взаимосвязанных образов. Их сохранение передаёт поэтическую и богословскую напряжённость, не сводя метафоры к одному истолкованию.
- issue: Отведение правой руки перед врагом
  choice: 'Передать буквально-образно: «отвёл Свою правую руку перед врагом».'
  alternative: «Лишил Израиль Своей защиты перед врагом».
  rationale: Контекст допускает понимание как отнятие силы или защиты, однако перевод не должен молча выбирать только одно из этих толкований.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтической возвышенности плача. Заглавные местоимения, относящиеся к Богу, использованы согласно принятой русской библейской традиции. Синтаксис остаётся ясным, а ключевые древнееврейские метафоры не заменены отвлечёнными пояснениями.
