source:
  edition: WLC
  text: זָנַ֨ח אֲדֹנָ֤/י מִזְבְּח/וֹ֙ נִאֵ֣ר מִקְדָּשׁ֔/וֹ הִסְגִּיר֙ בְּ/יַד אוֹיֵ֔ב חוֹמֹ֖ת אַרְמְנוֹתֶ֑י/הָ ק֛וֹל נָתְנ֥וּ בְּ/בֵית יְהוָ֖ה כְּ/י֥וֹם מוֹעֵֽד׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/007.yaml
  text: The Lord has rejected his altar[a]; he has abandoned his sanctuary. He has given the walls of her palaces into the hand of the enemy[c][b]. They raised a shout in the house of Yahweh as on the day of an appointed feast.
translation:
  language: ru
  text: Господь отверг Свой жертвенник, с презрением отринул Своё святилище.[a] Он предал стены её дворцов в руки врага.[b] Они подняли крик в доме Яхве, словно в день назначенного праздника.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский глагол здесь сильнее предыдущего: возможный перевод — «возгнушался Своим святилищем».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «предал в руку врага», то есть отдал под его власть.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «словно в праздничный день»; слово может обозначать назначенное время, собрание или установленный праздник.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנַח
  choice: отверг
  rationale: Передаёт решительное отвержение жертвенника в контексте суда, не усиливая значение до полного и окончательного оставления.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Естественная русская передача божественного титула אֲדֹנָי; отличается от личного имени Яхве далее в стихе.
- source_word: מִזְבְּחוֹ
  choice: Свой жертвенник
  rationale: Прямая передача единственного числа и местоименного суффикса; возвратное «Свой» естественно соотносится с подлежащим «Господь».
- source_word: נִאֵר
  choice: с презрением отринул
  rationale: Сохраняет усиление по отношению к זָנַח и оттенок пренебрежения или отвращения, не сводя два разных еврейских глагола к одному русскому.
- source_word: מִקְדָּשׁוֹ
  choice: Своё святилище
  rationale: «Святилище» точно и естественно обозначает священное место в храмовом контексте.
- source_word: הִסְגִּיר בְּיַד אוֹיֵב
  choice: предал ... в руки врага
  rationale: Русский библейский и общеупотребительный оборот сохраняет образ еврейского выражения и ясно означает передачу под власть врага.
- source_word: חוֹמֹת אַרְמְנוֹתֶיהָ
  choice: стены её дворцов
  rationale: Сохраняет конструкцию оригинала и женский суффикс, относящийся к олицетворённому городу; «дворцы» оставляет возможный оттенок укреплённых представительных зданий.
- source_word: קוֹל נָתְנוּ
  choice: Они подняли крик
  rationale: Идиоматичная русская передача буквального «дали голос/звук», соответствующая вражескому шуму.
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: Сохраняет образ «дома» и передаёт тетраграмматон как личное имя Яхве, отличая его от титула אֲדֹנָי.
- source_word: כְּיוֹם מוֹעֵד
  choice: словно в день назначенного праздника
  rationale: Передаёт מוֹעֵד как установленное, назначенное праздничное время и сохраняет горькое сопоставление вражеского крика с храмовым празднованием.
theological_decisions:
- issue: Передача אֲדֹנָי и יְהוָה в одном стихе
  choice: «Господь» для אֲדֹנָי и «Яхве» для יְהוָה
  alternative: Передать оба обозначения как «Господь» либо заменить Яхве традиционным «Господь»
  rationale: Оригинал употребляет сначала титул, затем личное имя. Различная передача сохраняет это намеренное лексическое различие без добавления богословского толкования.
- issue: Соотношение זָנַח и נִאֵר
  choice: «отверг» / «с презрением отринул»
  alternative: Употребить один и тот же глагол либо перевести נִאֵר нейтральным «оставил»
  rationale: Два разных глагола образуют поэтическое усиление; второй, по-видимому, несёт более резкий оттенок презрения или отвращения. Перевод сохраняет напряжение, не утверждая большего, чем позволяет лексика.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским регистром. Синтаксический параллелизм оригинала сохранён. Формы «Свой/Своё» написаны с прописной буквы как уважительное обозначение принадлежности Богу; «её» относится к олицетворённой дочери Сиона/городу. Маркеры сносок поставлены непосредственно после соответствующих выражений и расположены в последовательности [a], [b], [c].
