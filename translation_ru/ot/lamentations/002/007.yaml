  source_fidelity: 'Перевод точно передаёт четыре смысловых движения стиха: Господь отвергает жертвенник, более резко отстраняет святилище, предаёт стены дворцов врагу, а затем враги поднимают крик в доме Яхве. Сохранены единственное число «жертвенник», женский суффикс в «её дворцов» и образная формула передачи во власть врага. Различение «Господь» (אֲדֹנָי) и «Яхве» (יהוה) верно отражает различие еврейских обозначений.'
