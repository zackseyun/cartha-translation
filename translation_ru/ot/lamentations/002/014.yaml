source:
  edition: WLC
  text: נְבִיאַ֗יִ/ךְ חָ֤זוּ לָ/ךְ֙ שָׁ֣וְא וְ/תָפֵ֔ל וְ/לֹֽא גִלּ֥וּ עַל עֲוֺנֵ֖/ךְ לְ/הָשִׁ֣יב שבית/ך וַ/יֶּ֣חֱזוּ לָ֔/ךְ מַשְׂא֥וֹת שָׁ֖וְא וּ/מַדּוּחִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/014.yaml
  text: Your prophets saw for you falsehood and folly[a], and they did not uncover your iniquity to restore your fortunes; instead[b], they saw for you false oracles and delusions.
translation:
  language: ru
  text: Твои пророки видели для тебя ложь и нелепость[a]; они не раскрывали твоей вины, чтобы восстановить твоё благополучие[b], а вместо этого видели для тебя ложные пророческие изречения[c] и то, что вводит в заблуждение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ложь и пустоту». Слово, переведённое как «нелепость», буквально может обозначать нечто безвкусное, пустое или негодное.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, ближе к буквальному: «чтобы вернуть тебя из плена» или «чтобы возвратить твоих пленников». Еврейская формула может обозначать возвращение из плена либо, шире, восстановление после бедствия.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально также возможно: «ложные бремена». Еврейское слово «бремя» употребляется и как обозначение пророческого изречения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאַיִךְ
  choice: твои пророки
  rationale: Форма с суффиксом 2-го лица женского рода единственного числа обращена к Иерусалиму; существительное естественно передаётся общим обозначением «пророки».
- source_word: חָזוּ / וַיֶּחֱזוּ
  choice: видели / возвещали
  rationale: В первом случае сохранён образ пророческого видения; во втором по-русски естественно выражено сообщение пророческих изречений без неуклюжего повтора.
- source_word: שָׁוְא וְתָפֵל
  choice: ложь и пустое
  rationale: שָׁוְא обозначает ложное и обманчивое, а редкое תָפֵל — нечто пустое, безвкусное или нелепое. Сочетание сохраняет смысловую напряжённость и не сужает второе слово до одной интерпретации.
- source_word: גִלּוּ עַל עֲוֺנֵךְ
  choice: не обнажали твоей вины
  rationale: Передан конкретный образ раскрытия или обнажения проступка; «вина» сохраняет как нравственную виновность, так и последствия греха.
- source_word: לְהָשִׁיב שְׁבִיתֵךְ
  choice: чтобы восстановить твою участь
  rationale: Устойчивое выражение может относиться к возвращению из плена или шире — к обращению бедственного положения вспять. «Восстановить участь» сохраняет эту широту.
- source_word: מַשְׂאוֹת שָׁוְא
  choice: ложные пророчества
  rationale: מַשָּׂא в пророческой речи означает изречение или пророчество, хотя буквально может значить «бремя». Основной текст ясно передаёт жанр.
- source_word: מַדּוּחִים
  choice: обман, уводящий с пути
  rationale: Слово связано с уведением или совращением с пути; развёрнутая формулировка передаёт не только ложность, но и дезориентирующее действие.
theological_decisions:
- issue: Значение לְהָשִׁיב שְׁבִיתֵךְ
  choice: восстановить твою участь
  alternative: вернуть тебя из плена / возвратить твоих пленников
  rationale: Контекст допускает буквальную связь с пленом, но еврейская формула также обозначает общее восстановление после бедствия. Основной вариант не решает эту неоднозначность слишком узко.
- issue: Передача מַשְׂאוֹת
  choice: пророчества
  alternative: бремена / пророческие изречения
  rationale: «Пророчества» понятно современному читателю и соответствует контексту; буквальное «бремена» сохранено в примечании как традиционная лексическая возможность.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической обличительной речи. Женский род местоимений обусловлен обращением к персонифицированному Иерусалиму. Синтаксис сохранён компактным, с явным противопоставлением истинного обличения и ложного пророчества.
