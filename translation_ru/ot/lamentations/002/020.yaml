  text: רְאֵ֤ה יְהוָה֙ וְֽ/הַבִּ֔יטָ/ה לְ/מִ֖י עוֹלַ֣לְתָּ כֹּ֑ה אִם תֹּאכַ֨לְנָה נָשִׁ֤ים פִּרְיָ/ם֙ עֹלֲלֵ֣י טִפֻּחִ֔ים אִם יֵהָרֵ֛ג בְּ/מִקְדַּ֥שׁ אֲדֹנָ֖/י כֹּהֵ֥ן וְ/נָבִֽיא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/020.yaml
  text: Look[a], O Yahweh, and see—to whom have you done this? Should women eat their offspring[b], the children they have cared for? Should priest and prophet be killed in the sanctuary of the Lord?
translation:
  language: ru
  text: 'Взгляни, Яхве, и посмотри: с кем Ты совершил такое? Неужели женщины едят собственных детей[a] — малышей, которых они растили[b]? Неужели во святилище Владыки убивают священника и пророка?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свой плод», то есть собственное потомство.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «взлелеянных детей» или «малышей, которых нежили».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה ... וְהַבִּיטָה
  choice: Взгляни ... и посмотри
  rationale: Два повелительных глагола переданы раздельно, чтобы сохранить настойчивость и параллелизм мольбы; формулировка естественна для современного русского языка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; звательная интонация выражена пунктуацией.
- source_word: לְמִי עוֹלַלְתָּ כֹּה
  choice: с кем Ты так поступил
  rationale: Идиоматичная русская передача вопроса о тех, против кого было направлено действие. Она сохраняет прямое обращение к Богу и напряжённость плача.
- source_word: אִם ... תֹּאכַלְנָה / אִם יֵהָרֵג
  choice: Неужели ... будут есть / Неужели ... будут убиты
  rationale: Оба оборота поняты как потрясённые риторические вопросы, а не как условные придаточные.
- source_word: פִּרְיָם
  choice: собственных детей
  rationale: В контексте «их плод» означает потомство. Основной текст передаёт смысл ясно и естественно, а буквальный образ сохранён в сноске.
- source_word: עֹלֲלֵי טִפֻּחִים
  choice: малышей, которых они растили
  rationale: Переданы и малый возраст детей, и оттенок заботливого взращивания; более конкретный образ ношения или качания оставлен в сноске как возможная передача.
- source_word: בְּמִקְדַּשׁ אֲדֹנָי
  choice: во святилище Владыки
  rationale: מִקְדָּשׁ передано как священное место, а אֲדֹנָי — как титул «Владыка», чтобы отличить его от имени Яхве в первой части стиха.
theological_decisions:
- issue: Различение יְהוָה и אֲדֹנָי в одном стихе
  choice: יְהוָה — «Яхве»; אֲדֹנָי — «Владыка»
  alternative: Оба обозначения передать словом «Господь»
  rationale: Разные формы исходного текста намеренно сохранены как личное имя и титул, без их сглаживания.
- issue: Прямое приписывание бедствия Богу в вопросе плача
  choice: «с кем Ты так поступил»
  alternative: Безличная формулировка, ослабляющая прямое обращение
  rationale: Еврейский текст прямо обращает вопрос к Яхве. Перевод сохраняет эту трудную богословскую напряжённость и не объясняет её за автора.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной интонацией. Повтор риторического «Неужели» передаёт ужас плача; прямое обращение к Богу и резкие образы исходного текста не смягчены.
