  - severity: low
    issue: Будущее время в риторических вопросах
    rationale: «Будут есть / будут убиты» может звучать как вопрос о будущем. Настоящее «едят / убивают» лучше выражает ужас перед совершающимся в описываемой катастрофе и остаётся допустимым отражением еврейского имперфекта.
  - severity: low
