base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/004.yaml
  text: He bent his bow like an enemy; his right hand stood ready like a foe[a], and he killed all who were pleasing to the eye in the tent of daughter Zion; he poured out his wrath like fire.
translation:
  language: ru
  text: 'Он натянул свой лук, как враг;

    его правая рука стояла наготове, словно враг.


    Он убил всех, кто был отрадой для глаз[a],

    в шатре дочери Сиона;

    словно огонь, излил свою ярость.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё, что радовало глаз». Еврейское выражение может обозначать прекрасных или дорогих людей, а также шире — всё прекрасное и драгоценное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּרַךְ קַשְׁתּוֹ
  choice: натянул свой лук
  rationale: Сочетание глагола דָּרַךְ со словом «лук» обозначает приведение лука в готовность к выстрелу. «Натянул свой лук» естественно передаёт военный образ, не уточняя сверх текста отдельную стадию действия.
- source_word: כְּאוֹיֵב
  choice: как враг
  rationale: Префикс כְּ выражает сравнение. Прямой перевод сохраняет резкий образ Бога, действующего против Сиона подобно врагу.
- source_word: נִצָּב יְמִינוֹ
  choice: его правая рука была наготове
  rationale: נִצָּב передаёт положение стоящего или поставленного в боевую готовность. Русское «была наготове» естественно выражает готовность правой руки нанести удар, не конкретизируя оружие.
- source_word: כְּצָר
  choice: как у противника
  rationale: צָר означает противника или врага. Оборот «как у противника» согласован с упоминанием правой руки и сохраняет второе сравнение, не повторяя слово «враг».
- source_word: וַיַּהֲרֹג
  choice: он убил
  rationale: Обычный глагол со значением лишения жизни; «убил» ясно и современно, без архаического оттенка.
- source_word: מַחֲמַדֵּי עָיִן
  choice: всех, кто был отрадой для глаз
  rationale: Буквально выражение относится к желанному, прекрасному или драгоценному для глаз. Согласование с глаголом «убил» поддерживает личное прочтение, а образная формулировка и примечание сохраняют возможность более широкого понимания.
- source_word: בְּאֹהֶל בַּת־צִיּוֹן
  choice: в шатре дочери Сиона
  rationale: Сохранены и буквальный образ шатра, и поэтическая персонификация Сиона как дочери; выражение не сведено просто к Иерусалиму.
- source_word: שָׁפַךְ
  choice: излил
  rationale: Устойчивый русский эквивалент глагола «лить, изливать» при слове, обозначающем ярость.
- source_word: כָּאֵשׁ
  choice: словно огонь
  rationale: Сохраняет прямое сравнение и огненный образ суда.
- source_word: חֲמָתוֹ
  choice: свою ярость
  rationale: חֵמָה обозначает сильный, пылающий гнев. «Ярость» передаёт интенсивность и естественно сочетается с образом огня.
theological_decisions:
- issue: Бог изображён действующим «как враг» по отношению к Сиону
  choice: Сравнения «как враг» и «как у противника» сохранены прямо, без смягчения.
  alternative: Передать как «напал по-вражески» или «казался врагом».
  rationale: Еврейский текст дважды использует явное сравнение. Прямая передача сохраняет богословское напряжение плача и не превращает сравнение ни в утверждение, что Бог буквально стал врагом, ни в субъективную видимость.
- issue: Передача בַּת־צִיּוֹן
  choice: дочь Сиона
  alternative: Сион; дочь Сионова
  rationale: Персонификация важна для поэтики и богословия Плача. Современное «дочь Сиона» сохраняет образ и звучит понятнее, чем традиционное «дочь Сионова».
- issue: Личный или предметный смысл מַחֲמַדֵּי עָיִן
  choice: 'Основной текст передаёт выражение лично: «всех, кто был отрадой для глаз», при этом более широкое прочтение вынесено в примечание.'
  alternative: «всё, что радовало глаз» или «все услады глаз».
  rationale: Глагол וַיַּהֲרֹג обычно говорит об убийстве живых существ, что поддерживает личный смысл; однако само именное выражение способно обозначать всё прекрасное или драгоценное, поэтому неоднозначность не устранена молча.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным звучанием. Сохранены параллелизм, военная образность и персонификация «дочери Сиона». Строки разбиты по смысловым поэтическим членам; местоимения, относящиеся к Богу, даны со строчной буквы согласно обычной современной издательской практике.
