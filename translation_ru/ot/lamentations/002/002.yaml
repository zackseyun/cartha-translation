id: LAM.2.2
reference: Lamentations 2:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בִּלַּ֨ע אֲדֹנָ֜/י לא חָמַ֗ל אֵ֚ת כָּל נְא֣וֹת יַעֲקֹ֔ב הָרַ֧ס בְּ/עֶבְרָת֛/וֹ מִבְצְרֵ֥י בַת יְהוּדָ֖ה הִגִּ֣יעַ לָ/אָ֑רֶץ חִלֵּ֥ל מַמְלָכָ֖ה וְ/שָׂרֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/002.yaml
  text: The Lord has swallowed up[a], without pity, all the pastures of Jacob; in his wrath he has torn down the strongholds of daughter Judah; he has brought them down to the ground[c][b]; he has defiled the kingdom and its princes.
translation:
  language: ru
  text: Господь поглотил, не пощадив, все жилища Иакова[a]. В гневе Своём Он разрушил крепости дочери Иуды[b], поверг их на землю и осквернил царство и его князей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все пастбища Иакова» или «все селения Иакова». Еврейское слово может обозначать как места обитания, так и пастбища.'
    reason: lexical_alternative
  - marker: b
    text: «Дочь Иуды» — поэтическое олицетворение Иуды, то есть её народа и земли.
    reason: cultural_note
  - marker: c
    text: 'Или: «обесчестил царство и его князей»; еврейский глагол может выражать осквернение, профанацию или поругание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלַּע
  choice: поглотил
  rationale: Сохраняет яркую метафору пожирания или проглатывания, а не заменяет её общим словом «уничтожил».
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Передаёт божественный титул Адонай; в исходном тексте здесь не тетраграмматон.
- source_word: לֹא חָמַל
  choice: не пощадив
  rationale: Естественно по-русски выражает отсутствие жалости и пощады, сохраняя суровый тон плача.
- source_word: נְאוֹת יַעֲקֹב
  choice: жилища Иакова
  rationale: В данном контексте речь вероятнее всего идёт о местах проживания и поселениях; возможное значение «пастбища» сохранено в примечании.
- source_word: הָרַס
  choice: разрушил
  rationale: Точно передаёт снос и уничтожение укреплений без ненужного расширения смысла.
- source_word: בְּעֶבְרָתוֹ
  choice: в гневе Своём
  rationale: Передаёт сильный божественный гнев в естественном и достойном русском регистре.
- source_word: מִבְצְרֵי
  choice: крепости
  rationale: Сохраняет конкретный военный смысл укреплённых мест.
- source_word: בַת יְהוּדָה
  choice: дочери Иуды
  rationale: Сохраняет еврейскую поэтическую персонификацию Иуды и звучит естественно по-русски.
- source_word: הִגִּיעַ לָאָרֶץ
  choice: поверг их на землю
  rationale: Каузативная форма описывает низведение крепостей до земли; местоимение явно отсылает к крепостям.
- source_word: חִלֵּל
  choice: осквернил
  rationale: Передаёт смысл профанации, поругания и лишения священного достоинства.
- source_word: מַמְלָכָה וְשָׂרֶיהָ
  choice: царство и его князей
  rationale: Сохраняет политический и монархический образ; «князья» соответствует возвышенному значению שׂרים.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Господь
  alternative: Владыка
  rationale: Источник употребляет титул Адонай, а не имя YHWH. «Господь» — общепонятная и традиционная передача титула, не смешивающая его с особым обозначением тетраграмматона.
- issue: Субъект разрушения и осквернения
  choice: Прямо сохранено, что эти действия совершает Господь в Своём гневе
  alternative: Смягчить формулировку, представив разрушение лишь как допущенное Богом
  rationale: Еврейский текст грамматически прямо приписывает Господу действия בלע, הרס, הגיע и חלל; богословское напряжение нельзя устранять пояснительным смягчением.
translation_notes:
  register: Современный литературный русский язык с достоинством плачевной поэзии. Сохранены метафора поглощения, олицетворение «дочери Иуды» и прямое приписывание суда Господу; синтаксис сделан ясным для обычного читателя.
