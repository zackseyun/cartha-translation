  text: כָּל֨וּ בַ/דְּמָע֤וֹת עֵינַ/י֙ חֳמַרְמְר֣וּ מֵעַ֔/י נִשְׁפַּ֤ךְ לָ/אָ֨רֶץ֙ כְּבֵדִ֔/י עַל שֶׁ֖בֶר בַּת עַמִּ֑/י בֵּֽ/עָטֵ֤ף עוֹלֵל֙ וְ/יוֹנֵ֔ק בִּ/רְחֹב֖וֹת קִרְיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/011.yaml
  text: My eyes are spent with tears[a]; my inward parts churn; my liver is poured out to the earth because of the destruction of the daughter of my people[d][c][b], because infant and nursing child faint in the streets of the city.
translation:
  language: ru
  text: Мои глаза изнемогли от слёз; всё внутри у меня содрогается; печень моя излилась на землю из-за разрушения дочери моего народа[a], потому что младенцы и грудные дети лишаются сил на улицах города.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дочь моего народа» — древнееврейское поэтическое олицетворение народа или города.
    reason: cultural_note
lexical_decisions:
- source_word: כָּלוּ בַדְּמָעוֹת עֵינַי
  choice: Мои глаза изнемогли от слёз
  rationale: Глагол כּלה передаёт истощение, а сочетание «от слёз» естественно выражает причину и сохраняет телесный образ.
- source_word: חֳמַרְמְרוּ מֵעַי
  choice: всё внутри у меня содрогается
  rationale: Редкий глагол обозначает сильное внутреннее волнение; перевод сохраняет висцеральный образ, не используя в современном русском отвлекающее буквальное «внутренности».
- source_word: נִשְׁפַּךְ לָאָרֶץ כְּבֵדִי
  choice: печень моя излилась на землю
  rationale: 'Буквальный необычный образ намеренно сохранён: печень в древнееврейской поэтической антропологии связана с глубочайшим переживанием.'
- source_word: עַל שֶׁבֶר
  choice: из-за сокрушения
  rationale: שֶׁבֶר может обозначать как разрушение, так и слом, сокрушение; выбранное слово сохраняет поэтическую телесность и масштаб бедствия.
- source_word: בַּת עַמִּי
  choice: дочери моего народа
  rationale: Сохранена древнееврейская поэтическая персонификация народа или города.
- source_word: בְּעָטֵף
  choice: потому что ... лишаются сил
  rationale: В контексте голода глагол описывает ослабление и обморочное состояние; причинная связь соответствует плачу о бедствии.
- source_word: עוֹלֵל וְיוֹנֵק
  choice: младенцы и грудные дети
  rationale: Различены очень маленький ребёнок и ребёнок, который ещё питается грудным молоком.
- source_word: בִּרְחֹבוֹת קִרְיָה
  choice: на улицах города
  rationale: Естественный современный русский эквивалент, точно передающий публичное городское пространство.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтической интонации и необычной телесной образности оригинала. Буквальное «печень моя» оставлено сознательно; более идиоматичное «всё внутри у меня» передаёт מֵעַי без архаичного или физиологически отвлекающего звучания.
