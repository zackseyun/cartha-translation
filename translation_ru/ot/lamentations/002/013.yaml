base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/013.yaml
  text: What can I testify for you? What can I compare you to[a], daughter Jerusalem? What can I liken to you, so that I may comfort you, virgin daughter Zion? For your fracture is as great as the sea[b]; who can heal you?
translation:
  language: ru
  text: Какое свидетельство привести о тебе?[a] С чем сравнить тебя, дочь Иерусалима? Чему уподобить тебя, чтобы утешить тебя, дева, дочь Сиона? Ведь сокрушение твоё велико, как море[b]; кто исцелит тебя?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что засвидетельствовать тебе?» Еврейское выражение трудно для истолкования; глагол связан со свидетельством, но в данном контексте его можно понимать шире: «Что сказать о тебе?»'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «разрушение твоё», «надлом твой» или «рана твоя». Еврейское слово обозначает слом, сокрушение, разрушение или тяжёлое повреждение; здесь «сокрушение» согласуется с последующим образом исцеления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֲעִידֵךְ
  choice: Какое свидетельство привести о тебе?
  rationale: Глагол, вероятно, сохраняет значение свидетельства, хотя еврейское выражение трудно для однозначного истолкования. Русская формулировка передаёт этот оттенок и остаётся понятной; более широкое контекстуальное понимание отмечено в сноске.
- source_word: מָה אֲדַמֶּה לָּךְ
  choice: С чем сравнить тебя
  rationale: Передаёт обычное сравнительное значение דמה и естественно звучит по-русски.
- source_word: הַבַּת יְרוּשָׁלִַם
  choice: дочь Иерусалима
  rationale: Сохраняет олицетворение города как дочери без добавления отсутствующих в оригинале характеристик.
- source_word: מָה אַשְׁוֶה לָּךְ
  choice: Чему уподобить тебя
  rationale: Сохраняет близкий по смыслу, но отдельный глагол второй сравнительной строки, поддерживая риторическое нагнетание.
- source_word: וַאֲנַחֲמֵךְ
  choice: чтобы утешить тебя
  rationale: 'Передаёт целевую или результативную связь: найденное уподобление могло бы послужить утешению.'
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: дева, дочь Сиона
  rationale: Передаёт בתולה словом «дева» и сохраняет традиционное олицетворённое обращение к Сиону; пунктуация делает сочетание ясным и естественным по-русски.
- source_word: שִׁבְרֵךְ
  choice: сокрушение твоё
  rationale: Слово שבר обозначает слом, сокрушение, разрушение или тяжёлое повреждение. «Сокрушение» сохраняет образ слома и допускает последующий образ исцеления, не сводя бедствие только к телесной ране.
- source_word: גָדוֹל כַּיָּם
  choice: велико, как море
  rationale: Сохраняет простой образ огромного масштаба бедствия без усиления, отсутствующего в оригинале.
- source_word: מִי יִרְפָּא לָךְ
  choice: кто исцелит тебя?
  rationale: Глагол רפא прямо означает «исцелять». Настояще-будущая форма русского глагола уместна в риторическом вопросе о возможности исцеления.
