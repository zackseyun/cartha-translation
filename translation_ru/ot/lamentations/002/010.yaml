base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/010.yaml
  text: The elders of daughter Zion sit on the ground in silence[a]; they have thrown dust on their heads and put on sackcloth[b]; the virgins of Jerusalem have bowed their heads to the ground.
translation:
  language: ru
  text: Старейшины Дочери Сиона сидят на земле безмолвно; они посыпали головы прахом и опоясались вретищем[a]. Девы Иерусалима склонили головы до земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вретище — грубая одежда, которую надевали в знак скорби и унижения.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «девственницы Иерусалима». В этом поэтическом контексте термин обозначает особую группу молодых незамужних женщин, скорбящих вместе с городом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשְׁבוּ לָאָרֶץ יִדְּמוּ
  choice: сидят на земле безмолвно
  rationale: Сохраняет конкретную позу скорби и значение молчания/неподвижности; «безмолвно» естественно и достойно звучит в поэтическом русском.
- source_word: זִקְנֵי בַת צִיּוֹן
  choice: старейшины дочери Сиона
  rationale: «Старейшины» передаёт возраст и общественный статус; образ «дочери Сиона» сохранён как еврейская поэтическая персонификация.
- source_word: הֶעֱלוּ עָפָר עַל רֹאשָׁם
  choice: посыпали головы прахом
  rationale: Естественно передаёт традиционный жест траура, сохраняя образ праха и головы.
- source_word: חָגְרוּ שַׂקִּים
  choice: опоясались вретищем
  rationale: Глагол сохраняет буквальный образ опоясывания, а «вретище» — устоявшееся и понятное библейское обозначение грубой траурной одежды; пояснение дано в сноске.
- source_word: בְּתוּלֹת יְרוּשָׁלִָם
  choice: девы Иерусалима
  rationale: «Девы» сохраняет специфическое указание на девственниц/незамужних молодых женщин и соответствует поэтическому регистру, не прибегая к архаичному «девицы».
- source_word: הוֹרִידוּ לָאָרֶץ רֹאשָׁן
  choice: склонили головы до земли
  rationale: Передаёт направленное движение вниз и телесный образ крайней скорби и унижения без добавочного толкования.
theological_decisions:
- issue: Персонификация Сиона
  choice: дочь Сиона
  alternative: жители Сиона / Сион
  rationale: Сохранён поэтический женский образ оригинала, чтобы не устранять его напряжение и связь с последующим упоминанием дев Иерусалима.
- issue: Значение בְּתוּלֹת
  choice: девы
  alternative: молодые женщины
  rationale: Более широкое «молодые женщины» ослабляет прямое лексическое значение; «девы» сохраняет его, не превращая стих в утверждение, выходящее за пределы поэтической социальной группы.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Синтаксический параллелизм и конкретные жесты траура сохранены. Умеренно традиционные слова «прах», «вретище» и «девы» поддерживают поэтический регистр; менее прозрачное «вретище» пояснено в сноске.
