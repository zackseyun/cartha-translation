  text: צָעַ֥ק לִבָּ֖/ם אֶל אֲדֹנָ֑/י חוֹמַ֣ת בַּת צִ֠יּוֹן הוֹרִ֨ידִי כַ/נַּ֤חַל דִּמְעָה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אַֽל תִּתְּנִ֤י פוּגַת֙ לָ֔/ךְ אַל תִּדֹּ֖ם בַּת עֵינֵֽ/ךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/018.yaml
  text: 'Their heart cried out to the Lord[a], O wall of daughter Zion: let tears run down like a stream day and night; give yourself no relief[c][b]; let not the apple of your eye rest.'
translation:
  language: ru
  text: Их сердце воззвало к Господу[a]. О стена дочери Сиона, лей слёзы, словно поток[b], день и ночь; не давай себе передышки; пусть зрачок твой не знает покоя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «их сердца воззвали к Господу». В еврейском тексте стоит единственное число «сердце» с суффиксом множественного числа; вероятно, это собирательное выражение.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово נחל может обозначать поток, водоток или русло сезонной реки; возможный перевод: «пусть слёзы текут, как поток».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «пусть дочь твоего глаза не будет неподвижна (или: не умолкает)». Это поэтическое обозначение зрачка или глаза и образ непрестанного плача.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָעַק לִבָּם
  choice: их сердце воззвало
  rationale: Сохраняется необычное еврейское единственное число «сердце» с суффиксом множественного числа, выражающее общий вопль народа; «воззвало» передаёт напряжённость глагола צעק и соответствует возвышенному, но понятному регистру плача.
- source_word: אֶל אֲדֹנָי
  choice: к Господу
  rationale: אֲדֹנָי здесь является обращённым к Богу титулом; «Господь» — естественное и традиционное русское соответствие без добавления местоимения «мой».
- source_word: חוֹמַת בַּת צִיּוֹן
  choice: О стена дочери Сиона
  rationale: Сочетание понято как прямое обращение. «Стена» передаёт חוֹמָה буквально, а «дочь Сиона» сохраняет олицетворение города.
- source_word: הוֹרִידִי ... דִּמְעָה
  choice: лей слёзы
  rationale: Повелительная форма женского рода обращена к олицетворённой стене/дочери Сиона. Русское «лей слёзы» естественно выражает буквальное «заставляй слезу сходить»; единственное собирательное «слеза» передано обычным русским множественным числом.
- source_word: כַנַּחַל
  choice: словно поток
  rationale: נחל может обозначать поток, водоток или русло сезонной реки. «Поток» сохраняет образ обильных, непрерывно льющихся слёз и не требует географического пояснения в основном тексте.
- source_word: יוֹמָם וָלַיְלָה
  choice: день и ночь
  rationale: Естественный русский меризм, обозначающий непрерывность.
- source_word: אַל תִּתְּנִי פוּגַת לָךְ
  choice: не давай себе передышки
  rationale: פוּגָה означает перерыв, облегчение или передышку. Выбор не сужает смысл до сна или физического отдыха.
- source_word: אַל תִּדֹּם בַּת עֵינֵךְ
  choice: пусть зеница ока твоего не знает покоя
  rationale: Сохраняется телесный образ «дочери глаза» и значение непрекращающегося плача. Выражение «не знает покоя» естественно передаёт запрет быть неподвижной или умолкнуть, не устраняя поэтической напряжённости.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Господь
  alternative: мой Владыка
  rationale: В контексте плача титул обозначает Бога Израиля. «Господь» не вводит отсутствующий в согласном тексте акцент на личном притяжательном местоимении и соответствует принятому русскому обозначению божественного титула.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского плача. Сохранены коллективное единственное число «сердце», прямое обращение к стене, олицетворение «дочери Сиона» и непривычный образ глаза; синтаксис слегка сглажен ради ясности, но поэтическая неоднозначность не устранена.
