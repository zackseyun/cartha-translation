base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/012.yaml
  text: They say to their mothers[a], “Where are grain and wine?” as they faint like the wounded in the streets of the city[c][b], as their life is poured out into their mothers’ bosom.
translation:
  language: ru
  text: 'Они говорят своим матерям:


    «Где зерно и вино?» —


    и изнемогают, словно сражённые[a],


    на улицах города,


    когда жизнь[b] их изливается


    в лоно матерей[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно убитые» либо «словно смертельно раненные». Еврейское חָלָל может обозначать убитого, пронзённого или смертельно раненного; дети представлены падающими, как жертвы сражения.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское נֶפֶשׁ, часто переводимое как «душа», здесь, вероятнее всего, означает жизнь, которая угасает.
    reason: lexical_alternative
  - marker: c
    text: 'Возможные переводы: «на груди у матерей» или «на коленях у матерей». Еврейское חֵיק обозначает лоно, грудь или складки одежды и создаёт глубоко личный образ ребёнка, умирающего в материнских объятиях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִמֹּתָם
  choice: своим матерям
  rationale: Предлог לְ обозначает адресата речи, а форма с суффиксом 3-го лица множественного числа — принадлежность. «Своим матерям» естественно по-русски и сохраняет личную, семейную окраску.
- source_word: יֹאמְרוּ
  choice: говорят
  rationale: Имперфект в этом описании передаёт разворачивающуюся перед глазами картину. Настоящее время усиливает непосредственность плача.
- source_word: דָּגָן וָיָיִן
  choice: зерно и вино
  rationale: דָּגָן обозначает зерно, хлебные злаки или урожай зерновых. Конкретное «зерно» сохраняет образ основных припасов и не обобщает его до «пищи».
- source_word: בְּהִתְעַטְּפָם
  choice: изнемогают
  rationale: Форма глагола עטף в контексте плача описывает ослабевание и состояние, близкое к обмороку. «Изнемогают» понятно современному читателю и подходит к постепенному угасанию детей.
- source_word: כֶּחָלָל
  choice: словно сражённые
  rationale: חָלָל может обозначать убитого, пронзённого или смертельно раненного. «Сражённые» сохраняет намеренно военный и трагический образ, не утверждая однозначно, что дети уже мертвы.
- source_word: בִּרְחֹבוֹת עִיר
  choice: на улицах города
  rationale: רְחֹבוֹת — широкие улицы, открытые места или площади. «На улицах города» естественно и сохраняет публичность происходящего.
- source_word: בְּהִשְׁתַּפֵּךְ נַפְשָׁם
  choice: когда жизнь их истекает
  rationale: נֶפֶשׁ здесь обозначает жизнь, которая покидает человека. Глагол שׁפך буквально передаёт излияние; «жизнь истекает» сохраняет метафору и звучит естественнее буквального «изливается».
- source_word: אֶל חֵיק אִמֹּתָם
  choice: на груди у матерей
  rationale: חֵיק может означать грудь, лоно или колени. Выражение «на груди у матерей» передаёт близость умирающих детей к матери и сохраняет телесный, интимный образ.
