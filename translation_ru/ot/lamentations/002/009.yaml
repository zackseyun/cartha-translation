  variant: modern literary Russian
source:
  edition: WLC
  text: טָבְע֤וּ בָ/אָ֨רֶץ֙ שְׁעָרֶ֔י/הָ אִבַּ֥ד וְ/שִׁבַּ֖ר בְּרִיחֶ֑י/הָ מַלְכָּ֨/הּ וְ/שָׂרֶ֤י/הָ בַ/גּוֹיִם֙ אֵ֣ין תּוֹרָ֔ה גַּם נְבִיאֶ֕י/הָ לֹא מָצְא֥וּ חָז֖וֹן מֵ/יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/009.yaml
  text: Her gates have sunk into the earth; he has destroyed and broken her bars[a]. Her king and her princes are among the nations; there is no law. Even her prophets have found no vision from Yahweh.
translation:
  language: ru
  text: 'Ворота её погрузились в землю;

    он уничтожил и сокрушил её засовы.

    Царь её и князья её — среди народов;

    закона[a] нет.

    Даже пророки её

    не обрели видения от Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставления»; еврейское слово тора может означать закон, наставление или учение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבְעוּ בָאָרֶץ
  choice: погрузились в землю
  rationale: Сохраняет конкретный поэтический образ ворот, ушедших в землю; русский глагол естественно передаёт достигнутое состояние после разрушения.
- source_word: שְׁעָרֶיהָ
  choice: ворота её
  rationale: Обычное обозначение городских ворот; женский суффикс относится к олицетворённому городу. Постпозиция местоимения поддерживает возвышенный поэтический строй без архаизации.
- source_word: אִבַּד וְשִׁבַּר
  choice: уничтожил и сокрушил
  rationale: Передаёт сочетание общего уничтожения и физического разрушения, сохраняя интенсивность параллельных глаголов.
- source_word: בְּרִיחֶיהָ
  choice: её засовы
  rationale: Речь о запирающих брусьях городских ворот; «засовы» понятно современному читателю и сохраняет конкретный образ.
- source_word: מַלְכָּהּ וְשָׂרֶיהָ
  choice: царь её и князья её
  rationale: «Князья» сохраняет политико-знатный смысл שׂרים точнее, чем более общее «правители» или административное «чиновники».
- source_word: בַגּוֹיִם
  choice: среди народов
  rationale: Передаёт обычное ветхозаветное значение גוים и не добавляет прямо не выраженного слова «в изгнании».
- source_word: אֵין תּוֹרָה
  choice: закона нет
  rationale: «Закон» кратко передаёт תּוֹרָה в контексте крушения заветного и общественного порядка; более широкое значение «наставление» отмечено в сноске.
- source_word: גַּם נְבִיאֶיהָ
  choice: даже пророки её
  rationale: '«Даже» выражает кульминацию: к политическому краху прибавилось отсутствие пророческого откровения.'
- source_word: לֹא מָצְאוּ חָזוֹן
  choice: не обрели видения
  rationale: «Обрели» естественно сочетается с религиозно-поэтическим «видением» и передаёт отсутствие полученного пророческого откровения.
- source_word: מֵיְהוָה
  choice: от Яхве
  rationale: Предлог передаёт источник видения, а личное имя «Яхве» сохраняет представленное в еврейском тексте имя Бога, не заменяя его титулом.
theological_decisions:
- issue: Не названный прямо субъект глаголов אִבַּד и וְשִׁבַּר
  choice: Оставить субъект в виде местоимения «он», не подставляя имя Яхве.
  alternative: «Яхве уничтожил и сокрушил»
  rationale: В еврейской строке стоит форма третьего лица единственного числа без прямо названного субъекта. Контекст указывает на Яхве, однако местоимение сохраняет формальную неоднозначность исходного текста.
- issue: Значение תּוֹרָה в данном контексте
  choice: В основном тексте употребить «закон».
  alternative: «наставление» или «Тора»
  rationale: Здесь слово может охватывать и закон, и данное Богом наставление. «Закон» уместен в плаче о разрушении заветного порядка, а семантическая широта сохранена в сноске.
- issue: Передача тетраграмматона יהוה
  choice: «Яхве»
  alternative: «Господь»
  rationale: Исходный текст употребляет личное имя Бога. Транслитерация сохраняет это различие и не превращает имя в титул.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным поэтическим строем. Построчное оформление отражает параллелизм плача. Местоимение «он» намеренно написано со строчной буквы: это не отрицает божественного референта, но не добавляет к еврейскому тексту типографического толкования. Маркер сноски поставлен непосредственно после слова «закона», к которому относится примечание.'
