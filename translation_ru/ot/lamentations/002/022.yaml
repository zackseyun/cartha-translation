base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/022.yaml
  text: You summoned my terrors from every side as on an appointed day[a], and on the day of Yahweh’s anger there was no survivor or remnant. Those whom I nurtured and raised[b], my enemy destroyed them.
translation:
  language: ru
  text: Ты созвал со всех сторон мои ужасы, словно на праздник[a]. В день гнева Яхве не было ни спасшегося, ни уцелевшего. Тех, кого я лелеяла и растила, враг мой погубил[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно в назначенный день». Еврейское слово может обозначать назначенное время, а также установленный праздник, когда люди собирались вместе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Тех, кто со всех сторон наводит на меня ужас». Еврейское выражение допускает понимание как самих ужасов, так и вызывающих их врагов.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: תִּקְרָא
  choice: Ты созвал
  rationale: Форма 2-го лица ед. числа обращена к Яхве; «созвал» передаёт не просто зов, а собирание ужасов, уподобленное праздничному собранию.
- source_word: כְיוֹם מוֹעֵד
  choice: словно в день праздника
  rationale: מוֹעֵד обозначает назначенное время и, в частности, установленный праздник; перевод сохраняет горькую иронию образа собрания.
- source_word: מְגוּרַי מִסָּבִיב
  choice: ужасы мои со всех сторон
  rationale: מְגוּרַי в данном контексте естественно понимать как «мои ужасы, предметы моего страха»; מִסָּבִיב передаёт окружение со всех сторон. Возможное личное понимание отмечено в сноске.
- source_word: בְּיוֹם אַף יְהוָה
  choice: В день гнева Яхве
  rationale: אַף здесь означает гнев, а имя יהוה передано как «Яхве».
- source_word: פָּלִיט וְשָׂרִיד
  choice: никто не спасся и не уцелел
  rationale: Две близкие по смыслу категории переданы двумя глаголами, чтобы сохранить усиление картины полного уничтожения.
- source_word: טִפַּחְתִּי וְרִבִּיתִי
  choice: я лелеяла и растила
  rationale: Сочетание описывает нежную заботу и воспитание детей; русская пара передаёт и привязанность, и длительное взращивание.
- source_word: אֹיְבִי כִלָּם
  choice: враг мой погубил
  rationale: Сохранено единственное число «враг мой»; כִלָּם в породе Piel означает довести до конца, истребить, погубить, причём местоименный объект в русском выражен словом «тех» в начале предложения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога, поэтому оно передано непосредственно, без замены титулом.
- issue: Кто говорит в словах «я лелеяла и растила»
  choice: Сохранено первое лицо без поясняющей вставки
  alternative: 'Уточнить в тексте: «я, дочь Сиона»'
  rationale: Контекст персонифицирует Сион как женщину и мать, но в самом стихе говорящая не названа; добавлять толкование в основной текст не следует.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией плача. Синтаксис сохраняет прямое обращение к Богу и резкий переход от всеобщей гибели к личной утрате. Повтор «не спасся и не уцелел» намеренно сохраняет усиление еврейской парной формулы.
