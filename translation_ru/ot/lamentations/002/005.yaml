  text: הָיָ֨ה אֲדֹנָ֤/י כְּ/אוֹיֵב֙ בִּלַּ֣ע יִשְׂרָאֵ֔ל בִּלַּע֙ כָּל אַרְמְנוֹתֶ֔י/הָ שִׁחֵ֖ת מִבְצָרָ֑י/ו וַ/יֶּ֨רֶב֙ בְּ/בַת יְהוּדָ֔ה תַּאֲנִיָּ֖ה וַ/אֲנִיָּֽה׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/005.yaml
  text: The Lord became like an enemy; he swallowed up Israel. He swallowed up all her palaces; he destroyed his strongholds[a], and he multiplied mourning and lamentation in Daughter Judah.
translation:
  language: ru
  text: 'Господь стал подобен врагу: Он поглотил Израиль, поглотил все её дворцы, разрушил его твердыни[a] и умножил плач и стенание у Дочери Иуды.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его твердыни». В масоретском тексте стоит суффикс мужского рода единственного числа; некоторые переводы согласуют его с предшествующим выражением и передают: «её твердыни».'
    reason: textual_variant
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Обычное и естественное русское соответствие божественному титулу; здесь речь идёт о Боге, совершающем суд.
- source_word: הָיָה ... כְּאוֹיֵב
  choice: стал подобен врагу
  rationale: Сохраняет как оттенок перемены в описываемом отношении, так и явно выраженное частицей כ сравнение, не превращая его в утверждение о сущности Бога.
- source_word: בִּלַּע
  choice: поглотил
  rationale: Передаёт яркий образ полного уничтожения и естественно звучит в современном литературном русском.
- source_word: כָּל אַרְמְנוֹתֶיהָ
  choice: все её дворцы
  rationale: Передаёт обычное значение אַרְמוֹן и сохраняет женский суффикс, относящийся к персонифицированному Израилю или городу.
- source_word: שִׁחֵת
  choice: разрушил
  rationale: Ясно и выразительно передаёт уничтожение укреплений.
- source_word: מִבְצָרָיו
  choice: его твердыни
  rationale: Сохраняет мужской суффикс единственного числа масоретского текста, не сглаживая смену рода после «её дворцы».
- source_word: וַיֶּרֶב
  choice: умножил
  rationale: 'Сохраняет каузативный смысл формы: Господь сделал плач и стенание многочисленными.'
- source_word: בְּבַת יְהוּדָה
  choice: у Дочери Иуды
  rationale: Сохраняет поэтическую персонификацию; предлог «у» естественно обозначает наличие и распространение скорби среди персонифицированной Иуды.
- source_word: תַּאֲנִיָּה וַאֲנִיָּה
  choice: плач и стенание
  rationale: Сохраняет усилительную пару близких по смыслу существительных и её скорбное поэтическое звучание.
theological_decisions:
- issue: Передавать ли сравнение как тождество («Господь стал врагом») или как уподобление
  choice: Господь стал подобен врагу
  alternative: Господь стал врагом; Господь был подобен врагу
  rationale: В еврейском тексте стоит сравнительная частица כ («как, подобно»). Перевод сохраняет богословское напряжение между Божьим судом и образом врага, не устраняя и не усиливая его.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Повтор «поглотил» и персонификация «Дочь Иуды» сохранены; неоднозначная смена рода в суффиксах не сглажена.
