id: LAM.2.1
reference: Lamentations 2:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֵיכָה֩ יָעִ֨יב בְּ/אַפּ֤/וֹ אֲדֹנָ/י֙ אֶת בַּת צִיּ֔וֹן הִשְׁלִ֤יךְ מִ/שָּׁמַ֨יִם֙ אֶ֔רֶץ תִּפְאֶ֖רֶת יִשְׂרָאֵ֑ל וְ/לֹא זָכַ֥ר הֲדֹם רַגְלָ֖י/ו בְּ/י֥וֹם אַפּֽ/וֹ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/001.yaml
  text: How the Lord in his anger has clouded over daughter Zion! He has cast from heaven to earth the beauty of Israel[c][b][a], and he did not remember his footstool in the day of his anger.
translation:
  language: ru
  text: Как Владыка в гневе Своём окутал тучей дочь Сиона![a] Он низверг с небес на землю красу Израиля[b] и в день Своего гнева не вспомнил о подножии Своих ног.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помрачил»; возможен также смысл «покрыл облаком». Еврейский глагол создаёт образ тучи, закрывающей Сион.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «славу Израиля» или «великолепие Израиля».'
    reason: lexical_alternative
  - marker: c
    text: «Подножие Своих ног» может обозначать Сион, храм или ковчег как место, связанное с земным присутствием Бога.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיכָה
  choice: Как
  rationale: Вводит скорбное восклицание, а не вопрос; «Как» сохраняет лаконизм и поэтическую силу плача.
- source_word: יָעִיב
  choice: окутал тучей
  rationale: Передаёт образ затягивающей тучи или облака и не заменяет его более толковательным выражением.
- source_word: בְּאַפּוֹ
  choice: в гневе Своём
  rationale: אַף в данном контексте идиоматически означает гнев; перевод естественен по-русски и сохраняет повтор мотива в конце стиха.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Передаёт божественный титул אֲדֹנָי и отличает его от имени יהוה, сохраняя торжественный регистр.
- source_word: בַּת צִיּוֹן
  choice: дочь Сиона
  rationale: Сохраняет олицетворение города и народа, а также компактность еврейского поэтического выражения.
- source_word: הִשְׁלִיךְ
  choice: низверг
  rationale: Сильный глагол передаёт резкое низведение с небес на землю и соответствует возвышенному поэтическому контексту.
- source_word: מִשָּׁמַיִם אֶרֶץ
  choice: с небес на землю
  rationale: Естественно передаёт пространственный контраст между возвышением и унижением.
- source_word: תִּפְאֶרֶת יִשְׂרָאֵל
  choice: красу Израиля
  rationale: «Краса» сохраняет поэтическую многозначность תִּפְאֶרֶת — красоту, великолепие и славу — не уточняя референт.
- source_word: וְלֹא זָכַר
  choice: не вспомнил
  rationale: Прямо передаёт זכר и сохраняет возможный заветный оттенок «помнить», не подменяя его истолкованием «не пощадил» или «не принял во внимание».
- source_word: הֲדֹם רַגְלָיו
  choice: подножие Своих ног
  rationale: Сохраняет исходную метафору и не отождествляет её в основном тексте с храмом, Сионом или ковчегом.
- source_word: בְּיוֹם אַפּוֹ
  choice: в день Своего гнева
  rationale: Сохраняет временную формулу и намеренный повтор слова «гнев».
theological_decisions:
- issue: К чему относится «подножие Своих ног»
  choice: Образ сохранён без уточнения референта
  alternative: Храм, Сион/Иерусалим или ковчег как место земного присутствия Бога
  rationale: Сам стих не требует единственного отождествления; конкретизация в основном тексте устранила бы подлинную неоднозначность.
- issue: К чему относится «краса Израиля»
  choice: Сохранено широкое поэтическое выражение
  alternative: Иерусалим, храм или почётное положение Израиля
  rationale: תִּפְאֶרֶת допускает несколько оттенков и референтов, поэтому перевод не закрепляет одно богословское толкование.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием. Архаизирующая «краса» употреблена точечно ради образности; синтаксис остаётся ясным. Прописные буквы в местоимениях, относящихся к Богу, поддерживают принятый русский библейский регистр, не меняя смысла текста.
