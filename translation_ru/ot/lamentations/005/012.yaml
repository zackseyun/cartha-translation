    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִים
  choice: князья
  rationale: Слово обозначает правителей, сановников или людей высокого положения. «Князья» сохраняет указание на высокий общественный статус и торжественный тон плача.
- source_word: בְּיָדָם
  choice: за руки
  rationale: Предлог ב при слове «рука» здесь наиболее естественно указывает, за какую часть тела их подвесили. Множественное число «руки» соответствует русскому словоупотреблению при описании нескольких людей и не приписывает им самим действие.
- source_word: נִתְלוּ
  choice: были подвешены
  rationale: Форма нифаля означает, что их повесили или подвесили. «Были подвешены» передаёт насильственное подвешивание, не утверждая сверх текста, что речь непременно идёт о казни через повешение за шею.
- source_word: פְּנֵי זְקֵנִים
  choice: старцам
  rationale: Буквально сказано «лица старцев», но это еврейский метонимический оборот, относящийся к самим старцам и подобающему им достоинству. В основном тексте выбран естественный русский эквивалент, а буквальный образ сохранён в сноске.
- source_word: לֹא נֶהְדָּרוּ
  choice: не оказывали почтения
  rationale: Глагол в пассивной форме выражает отсутствие оказываемых чести, уважения и достоинства. Русский оборот естественно передаёт смысл, не ослабляя публичного унижения старейшин.
