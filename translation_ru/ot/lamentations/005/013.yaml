lexical_decisions:
- source_word: בַּחוּרִים
  choice: юноши
  rationale: Обозначает молодых мужчин в расцвете сил; «юноши» естественно по-русски и сохраняет возрастное отличие от следующего נְעָרִים.
- source_word: טְחוֹן
  choice: жернова
  rationale: Слово связано с молотьбой и в сочетании с נָשָׂאוּ, вероятно, обозначает тяжёлое мельничное приспособление или связанную с ним ношу; конкретное «жернова» сохраняет образ принудительного тяжёлого труда, а неоднозначность отмечена в сноске.
- source_word: נָשָׂאוּ
  choice: носили
  rationale: Глагол означает «поднимать, нести, носить». Прошедшее время соответствует форме древнееврейского повествования и контексту перечисления пережитых бедствий.
- source_word: וּנְעָרִים
  choice: и мальчики
  rationale: Слово может обозначать детей или молодых людей; «мальчики» отличает их от בַּחוּרִים и усиливает трагический образ непосильного труда, не прибегая к архаичному «отроки».
- source_word: בָּעֵץ
  choice: под тяжестью дров
  rationale: Буквально конструкция допускает «при/с деревом»; по контексту речь, вероятнее всего, о ноше из дров. Формулировка естественна по-русски, а более буквальные варианты приведены в сноске.
- source_word: כָּשָׁלוּ
  choice: спотыкались
  rationale: Глагол передаёт потерю устойчивости, преткновение или изнеможение. «Спотыкались» сохраняет конкретный образ и не усиливает его до полного падения или гибели.
