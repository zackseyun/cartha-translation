source:
  edition: WLC
  text: הֲשִׁיבֵ֨/נוּ יְהוָ֤ה אֵלֶ֨י/ךָ֙ ו/נשוב חַדֵּ֥שׁ יָמֵ֖י/נוּ כְּ/קֶֽדֶם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/021.yaml
  text: Restore us to yourself[a], O Yahweh, that we may return[b]; renew our days as of old.
translation:
  language: ru
  text: Обрати нас к Себе, Яхве, и мы обратимся[a]; обнови наши дни, как прежде[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «чтобы мы обратились» или «и тогда мы вернёмся».'
    reason: Союз וְ после повелительной формы может выражать простое следование, результат или цель.
  - marker: b
    text: 'Или: «как в прежние времена».'
    reason: Лексический вариант передачи כְּקֶדֶם.
lexical_decisions:
- source_word: הֲשִׁיבֵנוּ
  choice: Обрати нас
  rationale: Побудительная форма глагола שׁוב с суффиксом 1-го лица множественного числа означает «сделай так, чтобы мы вернулись», «верни нас», «обрати нас». Выбор сохраняет повтор того же корня в следующей части стиха и уместен для молитвы о возвращении к Богу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: אֵלֶיךָ
  choice: к Себе
  rationale: Буквально «к Тебе». В сочетании «обрати нас» русское «к Себе» естественно выражает направленность возвращения к тому, к кому обращена молитва.
- source_word: וְנָשׁוּב
  choice: и мы обратимся
  rationale: Форма одного корня с הֲשִׁיבֵנוּ передана тем же русским глаголом. Союз «и» сохраняет еврейское сочинение и не устраняет неоднозначность между следствием, обещанием и целью.
- source_word: חַדֵּשׁ
  choice: обнови
  rationale: Побудительная форма породы piel от חדש непосредственно означает «обнови», «сделай новым».
- source_word: יָמֵינוּ
  choice: наши дни
  rationale: Сохранён конкретный образ исходного текста; «дни» могут обозначать состояние и уклад жизни народа.
- source_word: כְּקֶדֶם
  choice: как прежде
  rationale: Кратко и естественно передаёт значение «как раньше», «как в прежние времена» и соответствует поэтическому регистру плача.
theological_decisions:
- issue: Соотношение Божьего действия и человеческого возвращения в וְנָשׁוּב
  choice: и мы обратимся
  alternative: чтобы мы обратились; и тогда мы вернёмся
  rationale: Еврейское сочинительное построение допускает оттенок результата или цели после повелительной формы. Основной текст сохраняет простую связь через «и», не превращая её однозначно ни в условие, ни в догматическое утверждение; целевое понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Повтор «обрати — обратимся» намеренно воспроизводит повтор корня שׁוב; прописная буква в «Себе» служит традиционной русской формой почтительного местоименного обозначения Бога.
