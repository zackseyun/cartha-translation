lexical_decisions:
- source_word: בְּנַפְשֵׁנוּ
  choice: Рискуя жизнью
  rationale: Буквально «с нашей жизнью / душой»; в данном контексте оборот указывает на смертельную опасность. Русское деепричастное выражение естественно и точно передаёт этот смысл.
- source_word: נָבִיא
  choice: мы добываем
  rationale: Форма породы хифиль от בוא буквально может означать «приносим», но в сочетании с хлебом здесь допускает более общее значение «достаём, добываем». Выбор сохраняет контекст поиска пропитания и не исключает его доставки.
- source_word: לַחְמֵנוּ
  choice: себе хлеб
  rationale: «Хлеб» буквально передаёт конкретный образ и одновременно обозначает основное пропитание. Местоименный суффикс естественно выражен по-русски возвратным местоимением «себе».
- source_word: מִפְּנֵי
  choice: из-за
  rationale: Предлог здесь обозначает причину — опасность, вызванную мечом. «Из-за» кратко и естественно передаёт причинное значение.
- source_word: חֶרֶב
  choice: меча
  rationale: Сохранён буквальный и яркий образ вооружённого насилия без поясняющего добавления «угрозы» в основном тексте.
- source_word: הַמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, необжитую местность. Сочетание допускает понимание «меч в пустыне» либо более тесное «меч пустыни»; основной текст выбирает естественный русский синтаксис, а неоднозначность отмечена в сноске.
