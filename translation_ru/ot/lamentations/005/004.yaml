  text: מֵימֵ֨י/נוּ֙ בְּ/כֶ֣סֶף שָׁתִ֔ינוּ עֵצֵ֖י/נוּ בִּ/מְחִ֥יר יָבֹֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/004.yaml
  text: We drink our water for silver[b][a]; our wood comes at a price.
translation:
  language: ru
  text: Свою воду мы пьём за серебро[a]; наши дрова достаются нам за плату[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за деньги». В еврейском тексте буквально сказано «за/посредством серебра», поскольку серебро служило средством платежа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «наши деревья (или: наша древесина) приходят за плату». Вероятно, имеются в виду дрова, которые теперь можно получить только за деньги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵימֵינוּ
  choice: свою воду
  rationale: Форма с суффиксом 1-го лица множественного числа буквально означает «наши воды». Русское «свою воду» естественно передаёт принадлежность и подчёркивает горечь того, что приходится платить даже за собственную воду.
- source_word: בְּכֶסֶף
  choice: за серебро
  rationale: Предлог ב здесь обозначает средство или цену платежа, а כֶּסֶף буквально значит «серебро» и может обозначать деньги. «За серебро» сохраняет конкретный образ исходного текста, не уточняя форму денег.
- source_word: שָׁתִינוּ
  choice: мы пьём
  rationale: Хотя употреблена форма qatal, в контексте плача она описывает переживаемое, продолжающееся положение; настоящее время естественно передаёт непосредственность жалобы.
- source_word: עֵצֵינוּ
  choice: наши дрова
  rationale: עֵץ может означать дерево или древесину; в данном бытовом контексте речь, вероятнее всего, о топливе. «Дрова» естественнее по-русски, при этом более широкое «дерево/древесина» остаётся возможным.
- source_word: בִּמְחִיר
  choice: за плату
  rationale: Сочетание означает получение чего-либо по цене, за оплату. «За плату» ясно и естественно выражает вынужденную необходимость платить.
- source_word: יָבֹאוּ
  choice: достаются нам
  rationale: 'Глагол буквально стоит во множественном числе: «приходят». В сочетании с русским «дрова» множественное число сохраняется по смыслу; «достаются нам» естественно передаёт, что их можно получить лишь за плату, хотя местоименный объект «нам» в еврейском подразумевается контекстом.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным, скорбным звучанием. Параллелизм двух полустиший сохранён; конкретное «серебро» оставлено в основном тексте, а неоднозначность עֵץ и буквальная конструкция с יָבֹאוּ отмечены в сноске.
