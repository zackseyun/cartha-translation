  source_fidelity: 'Перевод точно передаёт обе части стиха: מים с суффиксом — «свою воду», בְּכֶסֶף — «за серебро», а עֵצֵינוּ ... בִּמְחִיר יָבֹאוּ — получение дров лишь за плату. Настоящее время уместно передаёт продолжающееся бедственное положение в плаче. Добавленное «нам» в «достаются нам» не меняет смысла и естественно выражает подразумеваемую направленность «приходят [к нам]».'
