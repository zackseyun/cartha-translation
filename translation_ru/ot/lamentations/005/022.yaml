  text: כִּ֚י אִם מָאֹ֣ס מְאַסְתָּ֔/נוּ קָצַ֥פְתָּ עָלֵ֖י/נוּ עַד מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/022.yaml
  text: unless you have utterly rejected us and are exceedingly angry with us[a][b].
translation:
  language: ru
  text: если только Ты не совсем отверг нас и не разгневался на нас безмерно[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но Ты совсем отверг нас и безмерно разгневался на нас», если понимать эту строку как самостоятельное утверждение, а не как исключение из просьбы предыдущего стиха.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «разгневался на нас»; также возможно: «против нас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: если только… не
  rationale: В связи с просьбой предыдущего стиха оборот естественно передаёт исключение — «если только не», сохраняя открытый и напряжённый финал плача.
- source_word: מָאֹס מְאַסְתָּנוּ
  choice: Ты не отверг нас окончательно
  rationale: Сочетание абсолютного инфинитива с личной формой того же корня усиливает действие. «Отверг окончательно» передаёт и значение מאס, и эмфазу конструкции, не сводя её лишь к эмоциональному «презрел».
- source_word: קָצַפְתָּ
  choice: не разгневался
  rationale: Перфектная форма обозначает наступивший гнев; русский глагол совершенного вида естественно передаёт это значение и допускает сохраняющийся результат.
- source_word: עָלֵינוּ
  choice: на нас
  rationale: При глаголе гнева русское «разгневаться на кого-либо» идиоматично и близко соответствует конструкции с עַל.
- source_word: עַד מְאֹד
  choice: безмерно
  rationale: Наречие передаёт сильную степень гнева и поэтическую выразительность оборота без тяжеловесной буквальности.
theological_decisions:
- issue: Связан ли стих с просьбой предыдущего стиха как исключение или представляет собой самостоятельное утверждение?
  choice: 'Исключительное условие: «если только Ты не отверг нас…»'
  alternative: 'Самостоятельное утверждение: «Ибо Ты окончательно отверг нас и безмерно разгневался на нас»'
  rationale: Оборот כִּי אִם допускает исключительное понимание и в данном контексте продолжает просьбу ст. 21. Такое прочтение сохраняет намеренно неразрешённое напряжение финала книги и не превращает сомнение плачущих в однозначное богословское заключение.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным звучанием плача. Заглавная буква в местоимении «Ты» соблюдает принятую в русском библейском стиле форму обращения к Богу; синтаксическая незавершённость в начале стиха намеренно связывает его с предыдущей просьбой.
