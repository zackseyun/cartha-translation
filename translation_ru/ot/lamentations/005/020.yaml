  yaml_path: translation/ot/lamentations/005/020.yaml
  text: Why do you forget us forever? Why do you abandon us for so many days?[a]
translation:
  language: ru
  text: Почему Ты навеки забываешь нас и оставляешь нас так надолго?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на продолжительность дней»; то есть «надолго» или «на многие дни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Почему
  rationale: Вопросительное наречие вводит обращённый к Богу вопрос-плач.
- source_word: לָנֶצַח
  choice: навеки
  rationale: Передаёт продолжительность без конца и сохраняет напряжённую силу сетования.
- source_word: תִּשְׁכָּחֵנוּ
  choice: Ты навеки забываешь нас
  rationale: Имперфект в контексте плача естественно передан настоящим временем как жалоба на продолжающееся действие; местоимение «Ты» делает обращение ясным.
- source_word: תַּעַזְבֵנוּ
  choice: оставляешь нас
  rationale: Глагол עזב означает «оставлять, покидать». «Оставляешь» естественно в современном русском и сохраняет серьёзность жалобы без стилистической архаики.
- source_word: לְאֹרֶךְ יָמִים
  choice: на долгие дни
  rationale: Буквально «на/в продолжительность дней»; выражение обозначает длительное время, при этом перевод сохраняет конкретный образ дней.
theological_decisions:
- issue: Видимое утверждение, что Бог забывает и оставляет народ
  choice: Сохранён прямой риторический вопрос-плач без богословского смягчения
  alternative: «Почему кажется, что Ты забыл нас?»
  rationale: В еврейском тексте нет слов «кажется»; поэтическое сетование следует сохранить как непосредственное обращение, не превращая его в доктринальное утверждение.
translation_notes:
  register: Современный литературный русский с достоинством библейского плача. Два еврейских имперфекта объединены в один естественный русский вопрос; «навеки» и «на долгие дни» сохраняют параллелизм и нарастание жалобы.
