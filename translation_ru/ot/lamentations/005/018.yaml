- source_word: עַל
  choice: из-за того, что
  rationale: В контексте עַל указывает на причину плача в предыдущем стихе; причинное выражение естественно связывает этот стих с предшествующим.
- source_word: הַר צִיּוֹן
  choice: гора Сион
  rationale: Естественная русская передача названия при сохранении образа горы.
- source_word: שֶׁשָּׁמֵם
  choice: опустела
  rationale: Глагольная форма описывает нынешнее запустение Сиона; «опустела» передаёт состояние разорённого, оставленного места без избыточного уточнения.
- source_word: שׁוּעָלִים
  choice: лисицы
  rationale: Основное и традиционное значение слова; возможна более широкая отсылка к диким псовым, что отмечено в сноске.
- source_word: הִלְּכוּ
  choice: ходят
  rationale: Прямо передаёт обычное значение глагола движения, не добавляя оттенков «рыщут» или «бродят», отсутствующих в исходном слове.
- source_word: בוֹ
  choice: по ней
  rationale: Местоимение относится к горе Сион; при глаголе движения русское «по ней» естественно передаёт перемещение по этому месту.
