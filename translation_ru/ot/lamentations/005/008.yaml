  text: עֲבָדִים֙ מָ֣שְׁלוּ בָ֔/נוּ פֹּרֵ֖ק אֵ֥ין מִ/יָּדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/008.yaml
  text: Servants rule over us[b][a]; there is no one to rescue us from their hand.
translation:
  language: ru
  text: Рабы[a] господствуют над нами; некому избавить нас от их руки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуги». Еврейское слово עֲבָדִים может обозначать как рабов, так и слуг; вариант «рабы» острее передаёт унижение, о котором говорится в плаче.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «от их руки» означает «из-под их власти».
    reason: idiom_explanation
lexical_decisions:
- source_word: עֲבָדִים
  choice: рабы
  rationale: Множественное число עֶבֶד может означать рабов или слуг. В контексте плача «рабы» яснее передаёт унизительный общественный переворот и не смягчает положение названных людей.
- source_word: מָשְׁלוּ בָנוּ
  choice: господствуют над нами
  rationale: Глагол משל с предлогом ב выражает власть над кем-либо. «Господствуют над нами» естественно и передаёт тягостный характер этой власти.
- source_word: פֹּרֵק אֵין
  choice: некому избавить
  rationale: Причастие от פרק употреблено субстантивно — «тот, кто избавляет», а אֵין отрицает наличие такого человека. Безличная конструкция «некому избавить» кратко и естественно воспроизводит смысл.
- source_word: מִיָּדָם
  choice: от их руки
  rationale: Сохранён образ руки как власти и контроля; в русском библейском и литературном употреблении выражение понятно, а значение пояснено в сноске.
