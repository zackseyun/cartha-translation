  text: אֲבֹתֵ֤י/נוּ חָֽטְאוּ֙ אינ/ם אנחנו עֲוֺנֹתֵי/הֶ֥ם סָבָֽלְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/007.yaml
  text: Our fathers sinned[a], and they are no more; but we bear their iniquities.
translation:
  language: ru
  text: Наши отцы согрешили — их уже нет, а мы несём их беззакония.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несём наказание за их беззакония» / «несём последствия их беззаконий». Еврейское слово может обозначать само беззаконие, вину или вызванное ими бремя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבֹתֵינוּ
  choice: наши отцы
  rationale: Слово אָבוֹת буквально означает «отцы» и может охватывать предков. «Наши отцы» сохраняет прямую родственную и заветную окраску еврейского выражения.
- source_word: חָטְאוּ
  choice: согрешили
  rationale: Форма глагола חטא обозначает совершённый грех; русское прошедшее время естественно передаёт ретроспективное утверждение плача.
- source_word: אֵינָם
  choice: их уже нет
  rationale: Буквально выражение означает «их нет»; в контексте это указывает, что отцов больше нет в живых. Добавление «уже» естественно передаёт временной смысл.
- source_word: אֲנַחְנוּ
  choice: мы
  rationale: Самостоятельное местоимение подчёркивает противопоставление отцам; в русском оно сохранено и усилено союзом «а».
- source_word: עֲוֺנֹתֵיהֶם
  choice: их беззакония
  rationale: עָוֹן может обозначать беззаконие, вину либо наказание и последствия вины. Основной текст сохраняет формально близкое «беззакония», а более широкий смысл отмечен в сноске.
- source_word: סָבָלְנוּ
  choice: несём
  rationale: Глагол סבל означает нести, переносить или выдерживать бремя. «Несём» сохраняет образ тяжести и не сводит смысл только к страданию.
theological_decisions:
- issue: Говорит ли стих о непосредственном наследовании вины или о несении последствий грехов прежних поколений
  choice: мы несём их беззакония
  alternative: мы несём наказание за их беззакония; мы страдаем из-за их грехов
  rationale: Слово עָוֹן может охватывать сам грех, вину и вызванное ими наказание или бремя. Перевод сохраняет напряжение и не закрепляет одну доктринальную трактовку.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной лексикой. Тире передаёт резкий переход от греха отцов к их отсутствию, а союз «а» сохраняет подчёркнутое противопоставление поколений.
