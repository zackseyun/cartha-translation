id: LAM.5.1
reference: Lamentations 5:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: זְכֹ֤ר יְהוָה֙ מֶֽה הָ֣יָה לָ֔/נוּ הביט וּ/רְאֵ֥ה אֶת חֶרְפָּתֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/001.yaml
  text: Remember[a], O Yahweh, what has happened to us; look, and see our disgrace.
translation:
  language: ru
  text: Вспомни, Яхве, что с нами случилось; взгляни и увидь наше бесчестье[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наше поношение»; также возможно: «наш позор».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Вспомни
  rationale: Повелительная форма 2-го лица мужского рода единственного числа от זכר. «Вспомни» естественно передаёт молитвенный призыв к Богу обратить действенное внимание на бедствие народа, не сводя глагол к простому мысленному припоминанию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога сохраняет прямое обращение еврейского текста и не заменяет имя титулом.
- source_word: מֶה הָיָה לָנוּ
  choice: что с нами случилось
  rationale: Оборот естественно передаёт постигшее народ бедствие. Формулировка современна и сохраняет направленность вопросительного местоимения מֶה на произошедшее или сложившееся положение.
- source_word: הביט
  choice: взгляни
  rationale: Повелительный призыв от נבט передан отдельным глаголом, чтобы сохранить параллельную пару «взгляни и увидь», не сливая два еврейских глагола.
- source_word: וּרְאֵה
  choice: и увидь
  rationale: Повелительная форма от ראה с союзом ו передана буквально и естественно; она усиливает просьбу не только обратить взор, но и заметить бедствие.
- source_word: אֶת חֶרְפָּתֵנוּ
  choice: наше бесчестье
  rationale: חֶרְפָּה обозначает поношение, позор и унизительное положение перед другими. «Бесчестье» сохраняет общественный аспект унижения и звучит понятно в современном литературном русском языке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, то есть личное имя Бога. «Яхве» передаёт его как имя, не подменяя титулом; форма «Иегова» опирается на более позднее смешение согласных тетраграмматона с подсказывающими гласными.
- issue: Смысл призыва זְכֹר, обращённого к Богу
  choice: Вспомни
  alternative: Помяни; обрати внимание
  rationale: 'Сохранён прямой образ исходного текста и его молитвенно-заветный оттенок: говорящие просят Бога помнить о них действенно. Перевод не утверждает, будто Бог буквально забыл их положение.'
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным молитвенным ритмом. Два последовательных повелительных глагола «взгляни и увидь» сохраняют еврейский параллелизм и настойчивость просьбы.
