lexical_decisions:
- source_word: מִצְרַיִם
  choice: Египту
  rationale: Название страны передано в дательном падеже, поскольку образ «протянуть руку кому-либо» естественно выражает направленность действия по-русски.
- source_word: נָתַנּוּ
  choice: мы протянули
  rationale: Форма Qal perfect 1-го лица множественного числа обозначает совершённое действие. В сочетании с יָד буквальное «дали руку» естественно передаётся как «протянули руку», сохраняя образ и не фиксируя однозначно подчинение, союз или просьбу о помощи.
- source_word: יָד
  choice: руку
  rationale: Сохранён конкретный еврейский образ. Возможные идиоматические значения — подчинение, поиск союза или обращение за помощью — вынесены в примечание, чтобы не устранять смысловую неоднозначность.
- source_word: אַשּׁוּר
  choice: Ассирии
  rationale: Обычное русское название страны; дательный падеж соответствует конструкции «протянуть руку».
- source_word: לִשְׂבֹּעַ
  choice: чтобы досыта есть
  rationale: Инфинитив שבע выражает цель и означает насыщение, получение достаточного количества пищи. «Досыта есть» звучит естественно и непосредственно связано с хлебом.
- source_word: לָחֶם
  choice: хлеб
  rationale: Сохранено конкретное значение существительного; хотя слово может обозначать пищу вообще, образ хлеба особенно уместен в контексте голода.
