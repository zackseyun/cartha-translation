  choice: В основном тексте сохранён образ «протянули руку».
  alternative: «Подчинились», «вступили в союз» или «обратились за помощью».
  rationale: Контекст допускает несколько взаимосвязанных оттенков, и выбор одного из них необоснованно снял бы присущую оригиналу неоднозначность.
