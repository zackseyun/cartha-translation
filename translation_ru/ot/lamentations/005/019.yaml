  yaml_path: translation/ot/lamentations/005/019.yaml
  text: But you[a], O Yahweh, sit enthroned forever; your throne is from generation to generation.
translation:
  language: ru
  text: 'Но ты, Яхве, восседаешь[a] вовеки;

    твой престол — на все поколения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пребываешь вовеки». Еврейский глагол буквально означает «сидишь», но упоминание престола придаёт ему здесь смысл царского восседания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה
  choice: ты
  rationale: Самостоятельное местоимение вынесено в начало и сохраняет эмфатическое противопоставление Богу изменчивой участи народа, описанной выше.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул.
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Выражает непрерывную, неограниченную временем длительность; «вовеки» естественно для возвышенной русской поэзии и понятно современному читателю.
- source_word: תֵּשֵׁב
  choice: восседаешь
  rationale: Глагол буквально означает «сидеть», а упоминание престола в параллельной строке придаёт ему царский смысл. «Восседаешь» передаёт этот смысл, не добавляя отдельного утверждения о царствовании.
- source_word: כִּסְאֲךָ
  choice: твой престол
  rationale: Прямо передаёт существительное «престол» с местоименным суффиксом второго лица единственного числа.
- source_word: לְדֹר וָדֹר
  choice: из поколения в поколение
  rationale: Сохраняет еврейскую формулу непрерывности на протяжении всех последовательных поколений.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Царский оттенок глагола ישׁב
  choice: восседаешь
  alternative: сидишь; пребываешь
  rationale: Параллельное упоминание престола указывает на царское восседание. При этом сноска сохраняет буквальное значение и возможный оттенок неизменного пребывания.
- issue: Отсутствие выраженного глагола во второй строке
  choice: твой престол — из поколения в поколение
  alternative: твой престол пребывает из поколения в поколение
  rationale: Именная конструкция с тире не вводит отсутствующего в еврейском тексте отдельного глагола «пребывает» и сохраняет лаконизм поэзии.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской. Строчная форма местоимения «ты» соответствует современной неритуальной орфографии; параллелизм исходного стиха сохранён делением на две строки.
