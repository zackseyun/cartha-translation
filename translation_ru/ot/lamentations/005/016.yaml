source:
  edition: WLC
  text: נָֽפְלָה֙ עֲטֶ֣רֶת רֹאשֵׁ֔/נוּ אֽוֹי נָ֥א לָ֖/נוּ כִּ֥י חָטָֽאנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/016.yaml
  text: The crown has fallen from our head[a]. Woe to us[b], for we have sinned.
translation:
  language: ru
  text: Упал венец с нашей головы[a]. Горе нам[b], потому что мы согрешили!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Упал венец нашей головы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Увы нам». Это усиленный возглас плача.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָפְלָה
  choice: упал
  rationale: Форма qal, перфект 3-го лица женского рода единственного числа, согласована с עֲטֶרֶת. Русский глагол совершенного вида естественно передаёт завершившееся падение и сохраняет его значимость для настоящего плача.
- source_word: עֲטֶרֶת רֹאשֵׁנוּ
  choice: венец с нашей головы
  rationale: Конструкционная цепь буквально означает «венец нашей головы». Оборот «упал ... с нашей головы» естественен по-русски и сохраняет собирательное единственное число и образ утраченных чести, достоинства или царственного положения, не сводя его к одному толкованию.
- source_word: אוֹי נָא לָנוּ
  choice: Горе нам
  rationale: אוֹי — возглас плача, а נָא здесь усиливает его. «Горе нам» кратко и ясно передаёт скорбный возглас; усиление поддержано восклицательной интонацией.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину бедствия и плача. «Потому что» недвусмысленно сохраняет причинную связь.
- source_word: חָטָאנוּ
  choice: мы согрешили
  rationale: Форма qal, перфект 1-го лица множественного числа от חטא, прямо выражает общее признание греха. Совершенный вид естественно передаёт совершённое действие.
theological_decisions:
- issue: Общинное исповедание вины и причинная связь
  choice: «потому что мы согрешили»
  alternative: Передать строку как общий плач о бедствии, ослабив причинную связь с признанием греха
  rationale: Еврейский текст прямо называет грех общины причиной возгласа «горе нам». Перевод сохраняет эту связь, но не уточняет сверх текста характер венца, наказания или конкретных грехов.
- issue: Значение образа венца
  choice: Сохранить многозначный поэтический образ «венца»
  alternative: Истолковать венец исключительно как царскую власть, славу или храмовое достоинство
  rationale: Контекст допускает связь венца с честью, славой и общественным достоинством, однако сам стих не ограничивает метафору одним референтом.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной интонацией плача. «Венец» выбран вместо более бытового «корона», чтобы сохранить поэтическую широту образа; архаические синтаксические обороты не используются.
