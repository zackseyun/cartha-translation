lexical_decisions:
- source_word: עַל זֶה
  choice: От этого
  rationale: Предлог עַל с указательным местоимением выражает здесь причину; «от этого» естественно передаёт причинную связь и сохраняет краткость поэтической строки.
- source_word: הָיָה דָוֶה
  choice: изнемогло
  rationale: Сочетание היה с דוה обозначает наступившее болезненное, ослабленное состояние. «Изнемогло» сохраняет телесно-душевную метафору применительно к сердцу, не сводя её только к болезни или печали.
- source_word: לִבֵּנוּ
  choice: наше сердце
  rationale: Буквальный образ понятен по-русски и обозначает внутреннее состояние народа; единственное число сохранено вслед за еврейским текстом.
- source_word: עַל אֵלֶּה
  choice: из-за всего этого
  rationale: Повтор причинной конструкции передан сходным оборотом; «всего» естественно указывает на совокупность перечисленных бед, не добавляя нового предметного содержания.
- source_word: חָשְׁכוּ
  choice: померкли
  rationale: Глагол буквально означает «стали тёмными». «Померкли» идиоматично сочетается с глазами и сохраняет образ потускневшего зрения вследствие скорби и истощения.
- source_word: עֵינֵינוּ
  choice: наши глаза
  rationale: Прямой перевод сохраняет параллельную телесную образность стиха.
