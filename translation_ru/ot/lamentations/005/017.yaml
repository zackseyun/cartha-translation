  source_fidelity: «От этого изнемогло наше сердце, из-за всего этого померкли наши глаза» точно передаёт два причинных оборота עַל־זֶה / עַל־אֵלֶּה, единственное «сердце» и множественное «глаза». «Изнемогло» удачно сохраняет болезненно-ослабленное, не только эмоциональное значение דָוֶה; «померкли» передаёт образное «стали тёмными» (חָשְׁכוּ). Различие между единичным «этим» и совокупностью «всего этого» в русском достаточно различимо и соответствует контексту ранее перечисленных бедствий.
