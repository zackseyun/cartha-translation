  terminology: «Сердце» и «глаза» сохранены буквально и уместно в библейском поэтическом регистре. Выбор «изнемогло» не навязывает конфессионального или психологизирующего толкования. Сноска корректно отмечает лексическую вариативность; её якорь [a] расположен непосредственно после соответствующего слова.
