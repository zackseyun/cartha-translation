lexical_decisions:
- source_word: זְקֵנִים
  choice: старейшины
  rationale: В данном общественном контексте слово обозначает не просто пожилых мужчин, а старших членов общины, связанных с жизнью и судом у городских ворот.
- source_word: מִשַּׁעַר
  choice: у ворот
  rationale: Буквально предлог указывает на удаление «от ворот», однако по-русски при глаголе прекращения естественнее выразить исчезновение старейшин из их обычного места формулой «больше не сидят у ворот». Само сидение подразумевается контекстом, но не выражено в еврейском тексте.
- source_word: שָׁבָתוּ
  choice: больше не сидят / больше не играют
  rationale: Глагол означает «прекратили, перестали». Повтор «больше не» естественно передаёт его действие в обеих параллельных строках.
- source_word: בַּחוּרִים
  choice: юноши
  rationale: Слово обозначает молодых мужчин в расцвете сил; «юноши» сохраняет краткость и поэтический параллелизм.
- source_word: מִנְּגִינָתָם
  choice: играют музыку
  rationale: נְגִינָה может обозначать музыку, песню или музыкальное исполнение, особенно инструментальное. Глагольная передача естественна по-русски и сохраняет открытую семантику слова.
