lexical_decisions:
- source_word: עוֹרֵנוּ
  choice: Кожа наша
  rationale: עוֹר в отношении людей естественно передаётся словом «кожа»; порядок слов сохраняет возвышенный поэтический строй плача.
- source_word: כְתַנּוּר
  choice: как печь
  rationale: Предлог כְּ выражает сравнение; образ печи сохранён прямо и естественно по-русски.
- source_word: נִכְמָרוּ
  choice: раскалилась
  rationale: Редкий глагол כמר в нифале здесь указывает на сильный жар или обжигание; «раскалилась» сочетается с образом печи, не добавляя идеи изменения цвета кожи.
- source_word: מִפְּנֵי
  choice: от
  rationale: В данном контексте оборот обозначает причину; краткое русское «от» естественно связывает телесное состояние с голодом.
- source_word: זַלְעֲפוֹת
  choice: палящего зноя
  rationale: Редкое слово допускает значения сильного, обжигающего жара и лихорадочного жжения; «палящий зной» передаёт интенсивность, не сужая смысл до медицинской лихорадки.
- source_word: רָעָב
  choice: голода
  rationale: רָעָב может обозначать как голод, так и голодное бедствие; в русском «голод» естественно охватывает и состояние людей, и общую катастрофу.
