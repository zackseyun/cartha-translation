  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Наша кожа стала как печь от жгучего жара голода». Еврейские слова, переданные как «раскалилась» и «жгучий жар», редки; они могут обозначать обжигающий жар, а возможно, лихорадочное жжение.'
