lexical_decisions:
- source_word: עַל צַוָּארֵינוּ
  choice: наступая нам на пятки
  rationale: Буквальный образ «на наших шеях» обозначает преследователей, которые неотступно теснят сзади. Русская идиома естественно передаёт эту ситуацию, а сноска сохраняет конкретный образ еврейского текста.
- source_word: נִרְדָּפְנוּ
  choice: нас преследуют
  rationale: Нифаль от רדף здесь означает подвергаться погоне или преследованию; настоящее время естественно передаёт продолжающееся бедствие.
- source_word: יָגַעְנוּ
  choice: мы изнемогли
  rationale: Глагол выражает усталость и истощение от тяжёлого напряжения. «Изнемогли» сохраняет интенсивность плача, не усиливая её до полного физического изнеможения без остатка.
- source_word: לֹא הוּנַח לָנוּ
  choice: нам не дают передышки
  rationale: 'Хофаль от נוח имеет каузативно-пассивный смысл: им не позволено отдохнуть, им не предоставлен покой. В контексте непрерывной погони «не дают передышки» звучит естественно и точно.'
