  text: יְתוֹמִ֤ים הָיִ֨ינוּ֙ אין אָ֔ב אִמֹּתֵ֖י/נוּ כְּ/אַלְמָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/003.yaml
  text: We have become orphans[a], without a father; our mothers are like widows.
translation:
  language: ru
  text: 'Мы стали сиротами[a]: у нас нет отцов; наши матери — словно вдовы.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишёнными отцов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְתוֹמִים
  choice: сиротами
  rationale: Слово обозначает детей, лишённых родителя, а в библейском употреблении нередко прежде всего отцовской защиты. «Сиротами» — естественный современный русский эквивалент; более узкое значение отмечено в сноске.
- source_word: הָיִינוּ
  choice: стали
  rationale: Перфект היה в контексте постигшей народ катастрофы выражает наступившее состояние; «стали» передаёт переход к нему лучше, чем статическое «были».
- source_word: אֵין אָב
  choice: без отцов
  rationale: 'Буквально: «нет отца». Русская формулировка «без отцов» естественно передаёт отсутствие отцов у говорящих во множественном числе и сохраняет акцент оригинала.'
- source_word: אִמֹּתֵינוּ
  choice: наши матери
  rationale: Прямой эквивалент формы множественного числа с притяжательным суффиксом первого лица множественного числа.
- source_word: כְּאַלְמָנוֹת
  choice: словно вдовы
  rationale: Префикс כְּ выражает сравнение. «Словно вдовы» сохраняет образ, не утверждая, что все матери буквально овдовели.
theological_decisions:
- issue: Сила сравнения в выражении об овдовевших матерях
  choice: 'Сохранить сравнение: «словно вдовы».'
  alternative: «наши матери — вдовы»
  rationale: В еврейском тексте стоит сравнительный префикс כְּ («как, словно»). Его сохранение не превращает образ социальной незащищённости в более категоричное историческое утверждение.
translation_notes:
  register: Современный литературный русский язык с лаконичным, скорбным звучанием. «Без отцов» выбрано вместо менее естественного единственного числа «без отца» с учётом коллективного субъекта; тире подчёркивает параллелизм двух строк.
