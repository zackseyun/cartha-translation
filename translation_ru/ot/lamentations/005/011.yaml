base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/011.yaml
  text: Women in Zion were violated[a], virgins in the cities of Judah.
translation:
  language: ru
  text: Женщин на Сионе насиловали[a], девственниц — в городах Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «унижали» или «притесняли». Еврейский глагол может шире означать унижение или причинение страдания, но в данном контексте, где речь идёт о женщинах и девственницах, вероятнее всего имеется в виду сексуальное насилие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁים
  choice: женщин
  rationale: Обычное значение — «женщины» или, по контексту, «жёны». Параллель с девушками указывает здесь на общую категорию пострадавших женщин, а не только на замужних.
- source_word: בְּצִיּוֹן
  choice: на Сионе
  rationale: Предлог ב обозначает место. В современном русском библейском употреблении естественно сказать «на Сионе».
- source_word: עִנּוּ
  choice: насиловали
  rationale: Форма пиэль глагола ענה может обозначать унижение, жестокое обращение или причинение страдания, а применительно к женщинам нередко указывает на сексуальное насилие. Контекст женщин и девушек делает это значение наиболее вероятным; несовершенный вид естественно передаёт происходившее насилие без уточнения его кратности.
- source_word: בְּתֻלֹת
  choice: девушек
  rationale: Существительное обозначает девственниц или незамужних молодых женщин. «Девушек» звучит естественно и достойно по-русски, не устраняя подразумеваемого указания на их девственность, которое отмечено в сноске.
- source_word: בְּעָרֵי יְהוּדָה
  choice: в городах Иудеи
  rationale: Точное и естественное воспроизведение конструкции со значением места, сохраняющее географический параллелизм стиха.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткий, тяжёлый и прямой тон плача сохранён. Тире во второй части естественно передаёт эллипсис еврейского параллелизма. Прямое «насиловали» выбрано ради ясности наиболее вероятного смысла, а более широкая лексическая возможность сохранена в сноске.
