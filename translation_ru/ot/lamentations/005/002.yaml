  source_fidelity: «Наше наследие передано чужим, наши дома — иноземцам» точно передаёт два параллельных члена еврейского текста. «Передано» обоснованно выражает в контексте утраты владения результативный смысл נֶהֶפְכָה, не вводя лишней конкретики о способе передачи.
  naturalness: Перевод звучит естественно на современном литературном русском языке и сохраняет сжатый, скорбный параллелизм оригинала. Тире во втором члене удачно передаёт подразумеваемое сказуемое.
  terminology: «Наследие» уместно для נַחֲלָה и сохраняет земельно-наследственный оттенок. Различение «чужим» (זָרִים) и «иноземцам» (נָכְרִים) допустимо и стилистически понятно; «иноземцам» несколько книжно, но соответствует поэтическому регистру Плача. Примечание корректно отмечает более буквальную возможность и контекстуальный смысл перехода владения.
