base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/002.yaml
  text: Our inheritance has been turned over to strangers[a], our houses to foreigners.
translation:
  language: ru
  text: Наше наследие передано чужим[a], наши дома — иноземцам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Наше наследие досталось чужим». Буквально еврейский глагол означает «обратилось», «перешло»; здесь, вероятно, имеется в виду переход владения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָתֵנוּ
  choice: наше наследие
  rationale: «Наследие» сохраняет как конкретный смысл унаследованного земельного владения, так и его заветный оттенок; «достояние» было бы менее конкретным.
- source_word: נֶהֶפְכָה
  choice: передано
  rationale: Нифаль глагола הפך буквально указывает на поворот или перемену состояния. В контексте утраты земли естественное русское «передано» выражает переход владения, а более буквальный вариант сохранён в примечании.
- source_word: לְזָרִים
  choice: чужим
  rationale: זָרִים обозначает людей, не принадлежащих к своей общине или родству. «Чужим» естественно передаёт это противопоставление и не смешивается с обозначением иноземцев во второй строке.
- source_word: בָּתֵּינוּ
  choice: наши дома
  rationale: «Дома» прямо передаёт значение физических жилищ и сохраняет предметный параллелизм с наследием.
- source_word: לְנָכְרִים
  choice: иноземцам
  rationale: נָכְרִים подчёркивает чужеземное происхождение. «Иноземцам» сохраняет различие с זָרִים («чужим») и соответствует возвышенному, но понятному регистру плача.
