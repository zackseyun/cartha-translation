  text: Умолкла радость нашего сердца; танец наш обратился в скорбь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁבַת
  choice: умолкла
  rationale: Глагол в форме qal perfect обозначает прекращение. «Умолкла» естественно сочетается с «радостью», передаёт наступивший результат и сохраняет поэтический тон.
- source_word: מְשׂוֹשׂ
  choice: радость
  rationale: Существительное означает радость, веселье или ликование; «радость» ясно и естественно передаёт смысл в контексте плача.
- source_word: לִבֵּנוּ
  choice: нашего сердца
  rationale: Сохранено еврейское собирательное единственное число, подчёркивающее общее внутреннее состояние народа.
- source_word: נֶהְפַּךְ
  choice: сменился
  rationale: Niphal perfect выражает совершившуюся перемену состояния. «Сменился» по-русски естественно передаёт переход от праздничного хоровода к плачу.
- source_word: לְאֵבֶל
  choice: плачем
  rationale: אֵבֶל обозначает траур, скорбь и сопровождающий их плач. В данной поэтической паре «плачем» конкретно и выразительно противопоставлен праздничному хороводу.
- source_word: מְחֹלֵנוּ
  choice: наш хоровод
  rationale: Слово обозначает праздничный танец, нередко групповой или хороводный. «Хоровод» сохраняет предметный образ и возвышенно-поэтический регистр.
