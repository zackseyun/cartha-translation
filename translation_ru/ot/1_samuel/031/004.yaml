base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and thrust me through and mistreat me.” But his armor-bearer was not willing, because he was very afraid. So Saul took the sword and fell on it.
translation:
  language: ru
  text: 'Тогда Саул сказал своему оруженосцу: «Обнажи свой меч и пронзи меня им, чтобы не пришли эти необрезанные, не пронзили меня и не обошлись со мной унизительно[a]». Но оруженосец не захотел, потому что очень боялся. Тогда Саул взял меч и пал на него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не издевались надо мной», «не надругались надо мной» или «не обошлись со мной позорно».'
    reason: Еврейский глагол допускает несколько близких оттенков унизительного и жестокого обращения, не уточняя его форму.
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: своему оруженосцу
  rationale: Устойчивое и естественное русское обозначение военного слуги, носившего оружие и снаряжение воина.
- source_word: שְׁלֹף
  choice: Обнажи
  rationale: В военном контексте точно и лаконично передаёт извлечение меча из ножен.
- source_word: וְדָקְרֵנִי בָהּ / וּדְקָרֻנִי
  choice: пронзи меня им / не пронзили меня
  rationale: Сохраняет повтор одного и того же еврейского глагола и передаёт нанесение смертельного колющего удара.
- source_word: פֶּן
  choice: чтобы не
  rationale: Естественно вводит опасение и нежелательный исход в современном русском языке.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: эти необрезанные
  rationale: Сохраняет буквальное уничижительное обозначение с его заветным и культурным оттенком, не заменяя его пояснительным «филистимляне».
- source_word: וְהִתְעַלְּלוּ בִי
  choice: не надругались надо мной
  rationale: Передаёт унизительное и жестокое обращение, не уточняя его конкретную форму; варианты значения отмечены в сноске.
- source_word: וְלֹא אָבָה
  choice: не захотел
  rationale: Прямо и естественно передаёт нежелание оруженосца исполнить приказ.
- source_word: כִּי יָרֵא מְאֹד
  choice: потому что очень боялся
  rationale: Сохраняет причинную связь и усилитель מְאֹד без стилистического преувеличения.
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: пал на него
  rationale: Близко следует образу исходного текста; местоимение согласовано с русским словом «меч».
theological_decisions:
- issue: Неопределённый характер угрожавшего Саулу унижения
  choice: не надругались надо мной
  alternative: не издевались надо мной; не подвергли меня унижению; не обошлись со мной позорно
  rationale: Глагол указывает на унизительное, жестокое обращение, но не определяет точно, шла ли речь о пытке, насмешке, надругательстве иного рода или их сочетании. Основной текст и сноска сохраняют эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной повествовательной интонацией. Повтор глагола «пронзить» сохранён; синтаксис речи Саула сделан естественным для русского языка без устранения смысловой напряжённости.
