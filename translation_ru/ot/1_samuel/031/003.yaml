  text: And the battle grew heavy against Saul[a], and the archers found him[b], and he was greatly wounded by the archers.
translation:
  language: ru
  text: Сражение всё сильнее теснило Саула. Его настигли лучники, и он тяжело страдал из-за лучников[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он был тяжело ранен лучниками»; возможно также: «он сильно дрожал из-за лучников». Еврейский глагол может обозначать тяжёлую боль, мучение, дрожь или сильное смятение и не обязательно прямо называет физическое ранение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד הַמִּלְחָמָה אֶל שָׁאוּל
  choice: Сражение всё сильнее теснило Саула
  rationale: כבד буквально передаёт идею тяжести, а в военном контексте — усиливающегося натиска. «Всё сильнее теснило» естественно выражает направленное против Саула давление боя.
- source_word: וַיִּמְצָאֻהוּ
  choice: его настигли
  rationale: Буквальное «нашли его» в русском может звучать как результат поисков; в боевом повествовании глагол означает, что лучники добрались до Саула или настигли его.
- source_word: הַמּוֹרִים אֲנָשִׁים בַּקָּשֶׁת
  choice: лучники
  rationale: Еврейское пояснительное сочетание буквально означает «стрелки, люди с луком». Одно слово «лучники» полно и естественно передаёт его смысл по-русски.
- source_word: וַיָּחֶל מְאֹד מֵהַמּוֹרִים
  choice: он тяжело страдал из-за их стрел
  rationale: Редкая и трудная глагольная форма может указывать на тяжёлую боль, мучение, дрожь или ранение. Обобщённое «тяжело страдал» сохраняет неопределённость между физическим ранением и сильнейшим мучительным состоянием; «из-за их стрел» естественно передаёт причинную связь с лучниками.
theological_decisions:
- issue: Обозначает ли וַיָּחֶל физическое ранение или сильное мучение/ужас
  choice: Тяжело страдал
  alternative: Был тяжело ранен; сильно затрепетал; пришёл в сильное смятение
  rationale: Сам еврейский глагол допускает несколько близких толкований, а древние версии и современные переводы расходятся. Основной текст не должен без необходимости устранять эту подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский с кратким, напряжённым повествовательным ритмом. «Теснило» сохраняет образ усиливающегося натиска, а «настигли» естественнее буквального «нашли» в контексте боя.
