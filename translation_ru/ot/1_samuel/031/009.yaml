- from: Они отсекли ему голову, сняли с него боевое снаряжение[a] и разослали всё это[b] по всей земле филистимлян, чтобы возвестить радостную весть дому их идолов[c] и народу.
  to: Они отсекли ему голову, сняли с него военное снаряжение[a] и разослали вестников по всей земле филистимлян, чтобы возвестить радостную весть в храме своих идолов[b] и народу.
  rationale: Исправление устраняет безосновательное предметное дополнение «всё это» и передаёт контекстуально подразумеваемую посылку вестников. Культовое выражение передано естественным современным русским языком, при этом буквальная форма и связанная с ней синтаксическая неоднозначность сохранены в примечании. Смысловой объём כֵּלָיו сохранён широким.
