  text: וַֽ/יִּכְרְתוּ֙ אֶת רֹאשׁ֔/וֹ וַ/יַּפְשִׁ֖יטוּ אֶת כֵּלָ֑י/ו וַ/יְשַׁלְּח֨וּ בְ/אֶֽרֶץ פְּלִשְׁתִּ֜ים סָבִ֗יב לְ/בַשֵּׂ֛ר בֵּ֥ית עֲצַבֵּי/הֶ֖ם וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/009.yaml
  text: They cut off his head and stripped off his armor[a], and sent messengers throughout the land of the Philistines all around[b], to proclaim the good news to the house of their idols and to the people.
translation:
  language: ru
  text: Они отсекли ему голову, сняли с него военное снаряжение[a] и разослали вестников по всей земле филистимлян, чтобы возвестить радостную весть в храме своих идолов[b] и народу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доспехи»; или: «оружие».'
    reason: Еврейское כֵּלָיו в военном контексте может обозначать доспехи, оружие или военное снаряжение в целом.
  - marker: b
    text: 'Буквально: «дому их идолов».'
    reason: בֵּית буквально означает «дом»; в данном культовом контексте вероятно значение «храм». Синтаксис допускает понимание как места возвещения либо как обозначения культового учреждения.
lexical_decisions:
- source_word: וַיִּכְרְתוּ אֶת־רֹאשׁוֹ
  choice: отсекли ему голову
  rationale: При существительном «голова» глагол כרת означает отсечение; местоименный суффикс относится к Саулу.
- source_word: וַיַּפְשִׁיטוּ אֶת־כֵּלָיו
  choice: сняли с него боевое снаряжение
  rationale: פשׁט в данной конструкции означает снять или совлечь, а כֵּלִים в военном контексте охватывает доспехи, оружие и прочее снаряжение. Более широкое «боевое снаряжение» не сужает значение до одних доспехов.
- source_word: וַיְשַׁלְּחוּ
  choice: разослали всё это
  rationale: Глагол буквально означает «послали/разослали» и не имеет выраженного дополнения. По ближайшему контексту естественно подразумевать голову и снаряжение, но возможно и понимание «разослали вестников», поэтому альтернатива вынесена в примечание.
- source_word: בְאֶרֶץ פְּלִשְׁתִּים סָבִיב
  choice: по всей земле филистимлян
  rationale: סָבִיב здесь передаёт широкое распространение по филистимской территории; русское «по всей» естественно выражает этот распределительный смысл.
- source_word: לְבַשֵּׂר
  choice: возвестить радостную весть
  rationale: Глагол בשׂר обозначает принесение или возвещение доброй, радостной вести; здесь речь о победной вести с точки зрения филистимлян, без нравственного одобрения рассказчиком.
- source_word: בֵּית עֲצַבֵּיהֶם
  choice: дому их идолов
  rationale: בֵּית буквально значит «дом», а в культовом контексте может обозначать храм; עֲצַבִּים — идолы или изваяния. Основной текст сохраняет необычную еврейскую конструкцию и возможную метонимию, а более идиоматичное культовое понимание дано в примечании.
- source_word: וְאֶת הָעָם
  choice: и народу
  rationale: 'Маркер прямого дополнения связывает «народ» с глаголом возвещения: весть возвещается народу. Дательный падеж естественно передаёт адресата по-русски.'
theological_decisions:
- issue: Обозначение филистимского культового места и его объектов
  choice: дому их идолов
  alternative: в храме их идолов
  rationale: Перевод не признаёт идолов действительными богами и сохраняет лексику исходного текста. Буквальное «дом» оставляет открытым, имеется ли в виду храм как место возвещения или его служители как адресаты.
- issue: Что именно филистимляне разослали
  choice: голову и боевое снаряжение, обозначенные словами «всё это»
  alternative: вестников
  rationale: В еврейском тексте после «разослали» дополнение не названо. Ближайшие названные предметы поддерживают основной вариант, но контекст публичного объявления допускает подразумеваемых вестников; неоднозначность отмечена, а не устранена.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Отсекли», «возвестить» и «радостная весть» сохраняют торжественно-летописный оттенок без архаической грамматики. Необычное «дому их идолов» намеренно удерживает синтаксико-смысловую напряжённость исходного текста и поясняется примечанием.
