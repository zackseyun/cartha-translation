    rationale: Оригинал не называет отправляемые предметы. Указательное «всё это» в русском тексте конкретизирует их как только что названные голову и снаряжение, хотя контекст цели «чтобы возвестить» поддерживает подразумеваемых вестников.
  - severity: medium
    issue: Неестественное «дому их идолов»
    rationale: Буквальное воспроизведение конструкции не функционирует естественно в современном русском и затемняет культовое значение בֵּית. «В храме своих идолов» передаёт контекстуально вероятный смысл, а буквальный вариант следует сохранить в примечании.
  - severity: low
    issue: Сужение כֵּלָיו в примечании и выборе
    rationale: '«Доспехи» и «оружие» возможны, но основной вариант должен оставаться широким: речь может включать воинское имущество в целом.'
