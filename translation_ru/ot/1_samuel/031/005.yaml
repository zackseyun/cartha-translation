lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: оруженосец Саула
  rationale: Сочетание буквально обозначает человека, носившего его оружие или снаряжение. «Оруженосец» — естественное и точное русское наименование этой военной роли; имя Саула вместо местоимения устраняет неясность в начале отдельного стиха.
- source_word: כִּי
  choice: что
  rationale: 'Союз вводит содержание увиденного: оруженосец увидел, что Саул мёртв.'
- source_word: מֵת
  choice: мёртв
  rationale: Форма допускает описание состояния «мёртв» и прочтение завершившегося события «умер». В основном тексте естественно передано наблюдаемое состояние, а вариант отмечен в сноске.
- source_word: גַּם הוּא
  choice: он тоже
  rationale: 'Передаёт добавочное значение: оруженосец поступил так же, как Саул.'
- source_word: עַל חַרְבּוֹ
  choice: бросился на свой меч
  rationale: Русское выражение естественно передаёт намеренное падение на меч; возвратное «свой» ясно относит меч к оруженосцу.
- source_word: וַיָּמָת עִמּוֹ
  choice: и умер вместе с ним
  rationale: Прямо передаёт совместность смерти, не добавляя отсутствующей в еврейском тексте пространственной подробности.
- source_word: וַיַּרְא
  choice: Когда ... увидел
  rationale: Придаточное времени естественно связывает наблюдение с последовавшим действием и сохраняет ход повествования.
