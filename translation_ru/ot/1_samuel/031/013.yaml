base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/013.yaml
  text: They took their bones and buried them under the tamarisk tree in Jabesh[b][a], and they fasted seven days.
translation:
  language: ru
  text: Они взяли их кости, похоронили под тамариском в Иавеше[a] и постились семь дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в Иавеш-Галааде, упомянутом в предыдущем стихе.
    reason: cross_reference
lexical_decisions:
- source_word: עַצְמֹתֵיהֶם
  choice: их кости
  rationale: Существительное עֶצֶם буквально означает «кость»; после сожжения тел в ст. 12 конкретный смысл следует сохранить, не обобщая до «останков».
- source_word: וַיִּקְבְּרוּ
  choice: похоронили
  rationale: Обычный русский глагол точно передаёт стандартное значение קבר и соответствует простому повествовательному стилю.
- source_word: תַחַת הָאֶשֶׁל
  choice: под тамариском
  rationale: תַחַת означает «под», а אֶשֶׁל обозначает тамариск. В русском языке название дерева естественно употребляется без добавления слова «дерево».
- source_word: בְּיָבֵשָׁה
  choice: в Иавеше
  rationale: Предлог בְּ имеет здесь местное значение; Иавеш — сокращённое наименование Иавеш-Галаада из ближайшего контекста.
- source_word: וַיָּצֻמוּ
  choice: и постились
  rationale: Глагол צום прямо означает «поститься»; простая глагольная форма сохраняет последовательность еврейского повествования.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: Прямое и естественное соответствие числовому выражению.
- source_word: וַיִּקְחוּ
  choice: Они взяли
  rationale: לקח означает «брать, взять»; простое прошедшее время естественно передаёт повествовательную форму wayyiqtol.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткий, конкретный и достойный повествовательный стиль. Буквальное «кости» сохранено, а топонимическое сокращение пояснено в сноске.
