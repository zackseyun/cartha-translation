base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/012.yaml
  text: Then all the valiant men arose and went all night[a], and they took the body of Saul and the bodies of his sons from the wall of Beth-shan[b], and they came to Jabesh and burned them there.
translation:
  language: ru
  text: Тогда все храбрые воины поднялись и шли всю ночь; они взяли тело Саула и тела его сыновей[a] со стены Беф-Сана, пришли в Иавис[b] и сожгли их там.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «труп Саула и трупы его сыновей». Еврейское слово обозначает именно мёртвое тело.'
    reason: lexical_alternative
  - marker: b
    text: В данном контексте Иавис — это Иавис Галаадский.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: все отважные воины
  rationale: Еврейское сочетание обозначает доблестных, способных к военному делу мужчин; в данном контексте речь идёт о воинах, предпринявших опасный поход.
- source_word: וַיָּק֜וּמוּ
  choice: поднялись
  rationale: Сохраняет прямое значение глагола и последовательность повествовательных действий, оставаясь естественным для современного русского языка.
- source_word: וַיֵּלְכ֣וּ כָל הַלַּיְלָה
  choice: шли всю ночь
  rationale: Передаёт непрерывное передвижение на протяжении ночи, не уточняя сверх текста способ передвижения.
- source_word: גְּוִיַּת ... גְּוִיֹּת
  choice: тело ... тела
  rationale: Слова относятся именно к мёртвым телам. «Тело/тела» звучит естественно и достойно; более резкое «труп/трупы» отмечено в сноске как возможная передача.
- source_word: מֵחוֹמַת
  choice: со стены
  rationale: Предлог и существительное указывают на снятие тел со стены; русская конструкция естественно передаёт это пространственное отношение.
- source_word: בֵּית שָׁן
  choice: Беф-Сан
  rationale: Использована укоренившаяся в русской библейской традиции форма названия города.
- source_word: יָבֵשָׁה
  choice: в Иавис
  rationale: Направительный суффикс обозначает движение к Иавису. Полное отождествление с Иависом Галаадским дано в сноске, а не внесено в основной текст.
- source_word: וַיִּשְׂרְפ֥וּ אֹתָ֖ם שָׁם
  choice: и там сожгли
  rationale: Прямо передаёт значение глагола «сжечь» и местоименный объект, понятный из предыдущей части предложения; перестановка наречия естественна по-русски.
theological_decisions:
- issue: Передача собирательного выражения мужского рода о спасательной группе
  choice: все отважные воины
  alternative: все храбрецы
  rationale: Грамматические формы и военный контекст указывают на мужчин-воинов; нейтрализация этого смысла ослабила бы конкретность исходного текста.
- issue: Характер сожжения тел
  choice: там сожгли
  alternative: там кремировали
  rationale: Еврейский глагол сообщает о сожжении, но сам по себе не требует специального термина «кремировали». Буквальная формулировка сохраняет возможную историко-ритуальную напряжённость, не объясняя её сверх текста.
translation_notes:
  register: 'Современный литературный русский язык с достойным повествовательным тоном. Синтаксис сохраняет быструю последовательность действий исходного текста. Имена переданы в привычных русских библейских формах: Саул, Беф-Сан, Иавис.'
