revisions:
- from: Когда израильтяне, жившие по ту сторону долины[a] и по ту сторону Иордана, увидели, что воины Израиля бежали, а Саул и его сыновья погибли, они оставили города и бежали. Тогда филистимляне пришли и поселились в них.[b]
  to: Когда израильтяне, находившиеся по ту сторону долины[a] и по ту сторону Иордана, увидели, что израильтяне бежали, а Саул и его сыновья мертвы, они оставили города и бежали. Тогда филистимляне пришли и поселились в них.[b]
  rationale: Устранены два смысловых добавления («жившие» и «воины»), сохранён повтор исходного обозначения людей Израиля и уточнена передача смерти Саула и его сыновей без указания на её способ. Сноски структурно корректны и привязаны к соответствующим выражениям; они не воспроизводят ошибочную перестановку в английском аудиторском слое.
