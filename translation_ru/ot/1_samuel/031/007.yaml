  text: וַ/יִּרְא֣וּ אַנְשֵֽׁי יִ֠שְׂרָאֵל אֲשֶׁר בְּ/עֵ֨בֶר הָ/עֵ֜מֶק וַ/אֲשֶׁ֣ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן כִּֽי נָ֨סוּ֙ אַנְשֵׁ֣י יִשְׂרָאֵ֔ל וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ אֶת הֶֽ/עָרִים֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּֽשְׁב֖וּ בָּ/הֶֽן־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/007.yaml
  text: When the men of Israel who were on the other side of the valley[a], and those on the other side of the Jordan, saw that the men of Israel had fled and that Saul and his sons were dead, they abandoned the cities and fled[b]; and the Philistines came and lived in them.
translation:
  language: ru
  text: Когда израильтяне, находившиеся по ту сторону долины[a] и по ту сторону Иордана, увидели, что израильтяне бежали, а Саул и его сыновья мертвы, они оставили города и бежали. Тогда филистимляне пришли и поселились в них.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за долиной». Еврейское выражение обозначает местность по другую, дальнюю сторону относительно точки отсчёта.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стали жить в них». Еврейский глагол может означать как проживание, так и поселение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: увидели
  rationale: Сохраняет конкретное повествовательное значение ראה и не усиливает его до «поняли».
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: израильтяне / воины Израиля
  rationale: В первой позиции речь, судя по указанию местности и оставленным городам, идёт о местных израильтянах; во второй военный контекст позволяет естественно уточнить «воины Израиля», не смешивая их с жителями упомянутых областей.
- source_word: בְּעֵבֶר הָעֵמֶק
  choice: по ту сторону долины
  rationale: Передаёт пространственное значение עֵבֶר, сохраняя зависимость точки отсчёта от контекста.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: по ту сторону Иордана
  rationale: Сохраняет повтор той же еврейской пространственной конструкции и естественно звучит по-русски.
- source_word: כִּי נָסוּ
  choice: что ... бежали
  rationale: Передаёт содержание увиденного; русская последовательность времён не требует формы давнопрошедшего времени.
- source_word: מֵתוּ
  choice: погибли
  rationale: В военном повествовании естественно передаёт смерть Саула и его сыновей, не добавляя в этой фразе конкретного способа смерти.
- source_word: וַיַּעַזְבוּ אֶת־הֶעָרִים
  choice: оставили города
  rationale: Точно и естественно передаёт оставление населённых мест; контекст бегства ясно показывает вынужденность.
- source_word: וַיָּנֻסוּ
  choice: и бежали
  rationale: Стандартное соответствие глаголу נוס, сохраняющее повтор мотива бегства.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: Тогда филистимляне пришли
  rationale: Передаёт последовательность повествования без необязательного уточнения направления движения.
- source_word: וַיֵּשְׁבוּ בָּהֶן
  choice: поселились в них
  rationale: В контексте занятия покинутых городов ישב естественно означает поселение; вариант «стали жить» также возможен.
