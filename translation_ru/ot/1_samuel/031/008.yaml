    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: На следующий день
  rationale: Естественно передаёт временной оборот, указывающий на день после только что описанной битвы.
- source_word: לְפַשֵּׁט
  choice: снять всё с
  rationale: В данном военном контексте глагол означает снимать с погибших одежду, доспехи и иные ценные вещи; формулировка понятна современному читателю без излишнего уточнения в основном тексте.
- source_word: הַחֲלָלִים
  choice: убитых
  rationale: Обозначает павших в бою; «убитых» естественно и ясно сохраняет военный контекст.
- source_word: וַיִּמְצְאוּ
  choice: нашли
  rationale: Прямо передаёт простой последовательный повествовательный глагол.
- source_word: נֹפְלִים
  choice: павшими
  rationale: Сохраняет буквальный образ еврейского причастия и его обычный военный смысл, не сводя выражение просто к слову «мёртвыми».
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: на горе Гелвуй
  rationale: Традиционная и узнаваемая русская форма данного библейского топонима; предлог естественно передаёт местонахождение на горе.
- source_word: שְׁלֹשֶׁת בָּנָיו
  choice: трёх его сыновей
  rationale: Естественно передаёт конструкцию принадлежности и сохраняет указание на всех трёх сыновей Саула.
