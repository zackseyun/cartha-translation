revisions:
- from: На следующий день[a] филистимляне пришли снять всё с убитых и нашли Саула и трёх его сыновей павшими на горе Гелвуй.
  to: На следующий день[a] филистимляне пришли снимать с убитых одежду и нашли Саула и трёх его сыновей, павшими на горе Гелвуй.
  rationale: Убрано добавленное «всё» и не подтверждённое текстом упоминание ценных вещей. Основной текст прямо передаёт действие, а сноска сохраняет более широкую контекстуальную возможность, связанную с воинским снаряжением. Запятая перед «павшими» делает русскую синтаксическую связь определения с Саулом и его сыновьями более ясной.
