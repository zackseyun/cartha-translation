  text: וּ/פְלִשְׁתִּ֖ים נִלְחָמִ֣ים בְּ/יִשְׂרָאֵ֑ל וַ/יָּנֻ֜סוּ אַנְשֵׁ֤י יִשְׂרָאֵל֙ מִ/פְּנֵ֣י פְלִשְׁתִּ֔ים וַ/יִּפְּל֥וּ חֲלָלִ֖ים בְּ/הַ֥ר הַ/גִּלְבֹּֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/001.yaml
  text: The Philistines were fighting against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: ru
  text: Филистимляне сражались с Израилем, а израильтяне бежали от них и пали убитыми на горе Гелвуй.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Филистимляне
  rationale: Начальный союз ו связывает повествование с предыдущим контекстом, но в современном русском его необязательно передавать отдельным «и»; название народа передано в принятой русской форме.
- source_word: נִלְחָמִים בְּיִשְׂרָאֵל
  choice: сражались с Израилем
  rationale: Причастная форма обозначает продолжавшееся, фоновое действие. При глаголе לחם предлог ב имеет значение направленности против противника; по-русски естественно «сражаться с».
- source_word: וַיָּנֻסוּ
  choice: бежали
  rationale: Глагол נוּס в военном контексте означает бегство с поля боя; «бежали» кратко и точно передаёт это значение.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: израильтяне
  rationale: Буквальное «мужи Израиля» в современном русском звучит архаично, а «мужчины Израиля» может ошибочно подразумевать всё мужское население. В данном военном контексте «израильтяне» естественно обозначает участников сражения.
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: от них
  rationale: Еврейская идиома буквально означает удаление «от лица/присутствия» филистимлян, то есть бегство от них. Местоимение устраняет тяжёлый повтор, не меняя референта.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: пали убитыми
  rationale: Сочетание описывает павших в бою, а не просто упавших или умерших. Формулировка сохраняет военную образность оригинала.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: на горе Гелвуй
  rationale: הַר с географическим названием обозначает гору; «Гелвуй» — закрепившаяся в русской библейской традиции форма топонима Gilboa.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования; избегнуты как архаизмы («мужи»), так и разговорные обороты. Продолженный характер первой ситуации и последовательность последующих событий сохранены.
