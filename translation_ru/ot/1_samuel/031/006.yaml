  text: So Saul died[a], and his three sons, and his armor-bearer, and all his men[b], together on that day.
translation:
  language: ru
  text: В тот день вместе погибли Саул, три его сына, его оруженосец и все его люди[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все его воины». Буквально в еврейском тексте: «все его люди»; в контексте сражения, вероятно, имеются в виду воины или приближённые Саула, а не все связанные с ним люди.'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых греческих рукописях: «всё его оружие» вместо «все его люди». Еврейский текст поддерживает чтение «все его люди».'
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: погибли
  rationale: Форма продвигает повествование и буквально говорит о смерти Саула; в русском языке сказуемое поставлено во множественном числе, поскольку далее перечислены все погибшие.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Традиционная русская форма библейского имени.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: три его сына
  rationale: Естественная русская передача числительного, существительного и местоименного суффикса.
- source_word: וְנֹשֵׂא כֵלָיו
  choice: его оруженосец
  rationale: Устойчивое и точное обозначение человека, носившего оружие и воинское снаряжение царя.
- source_word: גַּם
  choice: и
  rationale: В данном перечислении присоединительное значение естественно выражается союзом «и»; отдельное усилительное слово могло бы создать в русском тексте избыточный акцент.
- source_word: כָּל אֲנָשָׁיו
  choice: все его люди
  rationale: Сохраняет широту еврейского выражения, не подменяя его более узким толкованием «воины», хотя военный контекст делает такое понимание вероятным.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Обычная и ясная передача временного оборота.
- source_word: יַחְדָּו
  choice: вместе
  rationale: Передаёт совместность перечисленных смертей в один и тот же день.
