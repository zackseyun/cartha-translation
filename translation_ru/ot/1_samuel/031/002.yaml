  text: The Philistines overtook Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua[b], the sons of Saul.
translation:
  language: ru
  text: Филистимляне настигли Саула и его сыновей[a] и поразили Ионафана, Авинадава и Малхисуа[b], сыновей Саула.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «догнали Саула и его сыновей»; возможно также: «неотступно преследовали Саула и его сыновей». Еврейский глагол передаёт тесное преследование, достигающее цели.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «убили Ионафана, Авинадава и Малхисуа». Еврейский глагол буквально означает «поразили», но в данном контексте сражения, вероятно, подразумевает смерть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ
  choice: настигли
  rationale: В данном военном контексте глагол דבק обозначает неотступное преследование, достигшее цели. «Настигли» естественно и ёмко передаёт этот смысл.
- source_word: פְלִשְׁתִּים
  choice: филистимляне
  rationale: Устоявшееся русское название этого народа.
- source_word: אֶת שָׁאוּל וְאֶת בָּנָיו
  choice: Саула и его сыновей
  rationale: בָּנָיו здесь означает именно сыновей, что подтверждается перечислением мужских имён далее.
- source_word: וַיַּכּוּ
  choice: сразили
  rationale: Глагол נכה имеет широкий смысл «ударить, поразить», однако в рассказе о сражении и названных погибших подразумевает смертельное поражение. «Сразили» сохраняет образ действия, не сводя его прямо к более толковательному «убили».
- source_word: יְהוֹנָתָן
  choice: Ионафана
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: אֲבִינָדָב
  choice: Авинадава
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: מַלְכִּי שׁוּעַ
  choice: Малхисуа
  rationale: Устоявшаяся русская библейская передача составного личного имени.
- source_word: בְּנֵי שָׁאוּל
  choice: сыновей Саула
  rationale: Сохранено приложение, отождествляющее трёх названных мужчин с сыновьями Саула.
