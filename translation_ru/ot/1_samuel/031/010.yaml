  text: They put his armor in the house of the Ashtaroths[c][b][a], and they fastened his body to the wall of Beth-shan.
translation:
  language: ru
  text: Они положили его воинское снаряжение[a] в храме Астарт[b], а его тело прикрепили[c] к стене Беф-Сана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его оружие», «его доспехи». Еврейское слово может широко обозначать воинское снаряжение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в доме Астарт». Слово «дом» в этом культовом контексте может означать храм или святилище. Имя в еврейском тексте имеет форму множественного числа; возможно также понимание: «в храме Астарты».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно: «пригвоздили» или «насадили его тело на стену». Еврейский глагол может означать «вбить», «вонзить» или «закрепить», поэтому точный способ выставления тела неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: они положили
  rationale: Глагол שׂוּם обычно означает «класть, помещать, ставить»; «положили» естественно передаёт простое повествовательное действие.
- source_word: כֵּלָיו
  choice: его воинское снаряжение
  rationale: כְּלִי имеет широкий диапазон значений — от предметов и орудий до оружия и боевого снаряжения. Контекст требует военного смысла, а «воинское снаряжение» не сужает значение исключительно до оружия или доспехов.
- source_word: בֵּית עַשְׁתָּרוֹת
  choice: в храме Астарт
  rationale: בֵּית буквально значит «дом», но в данном культовом контексте обозначает храм. Форма עַשְׁתָּרוֹת морфологически множественная, поэтому передана как «Астарт», без молчаливого сведения к единственному числу.
- source_word: גְּוִיָּתוֹ
  choice: тело его
  rationale: Существительное обозначает тело, в данном контексте — мёртвое тело. Из повествования уже ясно, что Саул погиб, поэтому нет необходимости усиливать выражение словом «труп».
- source_word: תָּקְעוּ
  choice: прикрепили
  rationale: תקע может означать «вбивать», «вонзать», «закреплять». «Прикрепили» передаёт результат действия, не уточняя способ выставления тела, который еврейский текст не определяет однозначно.
- source_word: בְּחוֹמַת
  choice: к стене
  rationale: При сочетании с תקע предлог ב естественно передаётся по-русски как «к», указывая на закрепление тела на стене.
- source_word: בֵּית שָׁן
  choice: Беф-Сана
  rationale: Использована укоренившаяся в русской библейской традиции форма географического названия.
