  text: Then Saul said to David[a], “Blessed are you, my son David. You will surely do, and you will surely prevail.” Then David went on his way, and Saul returned to his place.
translation:
  language: ru
  text: 'И сказал Саул Давиду: «Благословен ты, сын мой Давид! Ты непременно будешь действовать и непременно преуспеешь».[a] И пошёл Давид своей дорогой, а Саул возвратился на своё место.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «делать будешь делать, и мочь будешь мочь». Две еврейские конструкции с абсолютным инфинитивом усиливают уверенность в будущих действиях и успехе Давида.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ אַתָּה
  choice: Благословен ты
  rationale: Декларативная формула благословения с пассивным причастием; перевод сохраняет её прямую силу, не превращая в пожелание.
- source_word: בְּנִי דָוִד
  choice: сын мой Давид
  rationale: Сохраняет родственное или покровительственное обращение Саула и естественно звучит в современной литературной русской речи.
- source_word: גַּם עָשֹׂה תַעֲשֶׂה
  choice: ты непременно совершишь задуманное
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает уверенность высказывания. Дополнение «задуманное» не называет конкретного дела, но позволяет естественно передать непереходное в данном контексте «делать/совершать» без добавления отсутствующих в тексте «великих дел».
- source_word: וְגַם יָכֹל תּוּכָל
  choice: и непременно добьёшься успеха
  rationale: Повторная усилительная конструкция буквально означает «быть в силах — будешь в силах»; по контексту выражает уверенность, что Давид сумеет осуществить дело и одолеет препятствия.
- source_word: וַיֵּלֶךְ דָּוִד לְדַרְכּוֹ
  choice: И пошёл Давид своей дорогой
  rationale: Естественная русская передача еврейской идиомы ухода, сохраняющая образ пути.
- source_word: וְשָׁאוּל שָׁב לִמְקוֹמוֹ
  choice: а Саул возвратился к себе
  rationale: Передаёт возвращение Саула в своё место, не конкретизируя его как дом, чего еврейский текст не утверждает.
theological_decisions:
- issue: Характер слов Саула о будущем Давида
  choice: Передать как уверенное предсказание успешного действия
  alternative: Передать как пожелание или как обещание конкретных великих дел
  rationale: Еврейские усилительные конструкции выражают уверенность, но не уточняют ни конкретного дела, ни богословского основания успеха; перевод не должен добавлять их.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Инверсия «Благословен ты» сохраняет достоинство формулы; повествовательные фразы просты и понятны. Смысл двух нарочито повторных еврейских конструкций вынесен в сноску.
