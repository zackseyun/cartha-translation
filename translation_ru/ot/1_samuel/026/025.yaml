    rationale: В עָשֹׂה תַעֲשֶׂה нет ни существительного «замысел», ни иного дополнения. Добавление сужает открытую формулировку оригинала и затем повторяется в сноске как интерпретация.
  - severity: low
    issue: «Возвратился к себе» ослабляет значение «на своё место».
    rationale: Еврейское לִמְקוֹמוֹ говорит о возвращении в его место; «к себе» звучит естественно, но может пониматься как «домой» или просто «к своим».
  - severity: low
