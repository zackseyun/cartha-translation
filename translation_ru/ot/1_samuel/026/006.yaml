base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/006.yaml
  text: Then David answered and said to Ahimelech the Hittite and to Abishai son of Zeruiah[a], Joab’s brother, “Who will go down with me to Saul, to the camp?” And Abishai said, “I will go down with you.”
translation:
  language: ru
  text: 'Тогда Давид обратился к Ахимелеху, хеттеянину, и к Авессе, сыну Саруи, брату Иоава, и спросил: «Кто спустится со мной к Саулу, в лагерь[a]?» Авесса ответил: «Я спущусь с тобой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «Кто спустится со мной к Саулу в лагерь?» В еврейском тексте предлог «к» повторён перед словами «Саулу» и «лагерь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן דָּוִד וַיֹּאמֶר
  choice: Тогда Давид обратился… и спросил
  rationale: Буквальное «ответил и сказал» в данном контексте по-русски тяжеловесно, особенно когда ранее не приведён вопрос. «Обратился… и спросил» естественно передаёт формулу введения речи и вопросительный характер прямой речи.
- source_word: אֲחִימֶלֶךְ הַחִתִּי
  choice: Ахимелеху-хеттеянину
  rationale: Имя транслитерировано в принятой русской библейской форме; этническое определение передано существительным-приложением.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: Авессе, сыну Саруи, брату Иоава
  rationale: Сохранены все родственные обозначения и традиционные русские формы имён; приложение «брату Иоава» оставлено грамматически соотнесённым с Авессой.
- source_word: מִי יֵרֵד אִתִּי
  choice: Кто спустится со мной
  rationale: Глагол «спустится» сохраняет направительное значение ירד и звучит естественно в повествовательном контексте.
- source_word: אֶל שָׁאוּל אֶל הַמַּחֲנֶה
  choice: к Саулу, в стан
  rationale: Повтор еврейского אֶל передан двумя русскими предложными группами. «В стан» ясно выражает движение внутрь лагеря, тогда как «к стану» могло бы означать лишь приближение к нему.
- source_word: הַמַּחֲנֶה
  choice: стан
  rationale: «Стан» — понятное литературное обозначение военного лагеря, уместное для исторического повествования и более компактное, чем «военный лагерь».
- source_word: אֲנִי אֵרֵד עִמָּךְ
  choice: Я спущусь с тобой
  rationale: Повторён тот же направительный глагол, что и в вопросе Давида, благодаря чему сохраняется словесная связь реплик.
