base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/018.yaml
  text: And he said[a], “Why is my lord pursuing his servant like this? For what have I done[b], and what evil is in my hand?”
translation:
  language: ru
  text: 'И сказал он: «Почему мой господин так преследует своего слугу[a]? Ведь что я сделал и какое зло в моей руке[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его слугу». В прямом обращении ожидалось бы «твоего слугу», но в масоретском тексте стоит форма третьего лица.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «в моей руке». Это еврейское выражение может указывать на вину, злой умысел или возможность причинить зло.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал он
  rationale: Стандартная передача повествовательной формы wayyiqtol; сохраняет связь с предшествующим рассказом.
- source_word: לָמָּה זֶּה
  choice: почему… так
  rationale: Сочетание выражает усиленное «почему это / почему так»; такой порядок естественен для современного русского языка.
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Почтительное обращение к земному правителю, Саулу; речь не идёт о божественном титуле.
- source_word: רֹדֵף אַחֲרֵי
  choice: преследует
  rationale: Передаёт направленную и враждебную погоню, не добавляя иных смысловых оттенков.
- source_word: עַבְדּוֹ
  choice: своего слугу
  rationale: Сохранено местоимение третьего лица масоретского текста; «слуга» здесь служит почтительным самообозначением Давида.
- source_word: כִּי מֶה עָשִׂיתִי
  choice: Что я сделал
  rationale: כִּי вводит обосновывающий риторический вопрос, но в русском отдельная частица причинности была бы тяжеловесной; связь передаётся последовательностью вопросов.
- source_word: וּמַה בְּיָדִי רָעָה
  choice: и какое зло за мной
  rationale: Русское «за мной» естественно передаёт вопрос о вине или совершённом зле, тогда как буквальное «в моей руке» здесь могло бы ошибочно пониматься как физический предмет.
