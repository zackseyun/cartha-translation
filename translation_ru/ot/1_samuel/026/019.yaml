revisions:
- from: 'И теперь прошу: пусть господин мой царь выслушает слова своего слуги. Если ГОСПОДЬ побудил тебя выступить против меня, пусть Он примет приношение[a]. Если же это сделали люди, то прокляты они пред ГОСПОДОМ, потому что сегодня изгнали меня, лишив меня доли в наследии ГОСПОДА[b], говоря: «Ступай, служи другим богам!»'
  to: 'И ныне, прошу, пусть мой господин, царь, выслушает слова своего слуги. Если ГОСПОДЬ побудил тебя действовать против меня, пусть Он примет приношение[a]; если же это люди, то прокляты они пред ГОСПОДОМ, ибо они сегодня изгнали меня, не давая мне принадлежать наследию ГОСПОДА[b], как бы говоря: «Ступай, служи другим богам!»'
  rationale: Исправления минимальны и не меняют смысл отрывка. Они улучшают современную русскую синтаксическую естественность, устраняют излишнюю конкретизацию действия Саула, точнее передают образ принадлежности к наследию ГОСПОДА и сохраняют неоднозначность заключительного לֵאמֹר без доктринального или интерпретационного уточнения.
  reviewer_model: gpt-5.6-terra
