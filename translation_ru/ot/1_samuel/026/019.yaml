  text: וְ/עַתָּ֗ה יִֽשְׁמַֽע נָא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֵ֖ת דִּבְרֵ֣י עַבְדּ֑/וֹ אִם יְהוָ֞ה הֱסִֽיתְ/ךָ֥ בִ/י֙ יָרַ֣ח מִנְחָ֔ה וְ/אִ֣ם בְּנֵ֣י הָ/אָדָ֗ם אֲרוּרִ֥ים הֵם֙ לִ/פְנֵ֣י יְהוָ֔ה כִּֽי גֵרְשׁ֣וּ/נִי הַ/יּ֗וֹם מֵ/הִסְתַּפֵּ֜חַ בְּ/נַחֲלַ֤ת יְהוָה֙ לֵ/אמֹ֔ר לֵ֥ךְ עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/019.yaml
  text: And now[a], please let my lord the king hear the words of his servant. If Yahweh has stirred you up against me, may he accept an offering; but if it is men, they are cursed before Yahweh, because they have driven me out today from having a share in Yahweh’s inheritance, saying, ‘Go[b], serve other gods.’
translation:
  language: ru
  text: 'И ныне, прошу, пусть мой господин, царь, выслушает слова своего слуги. Если ГОСПОДЬ побудил тебя действовать против меня, пусть Он примет приношение[a]; если же это люди, то прокляты они пред ГОСПОДОМ, ибо они сегодня изгнали меня, не давая мне принадлежать наследию ГОСПОДА[b], как бы говоря: «Ступай, служи другим богам!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть Он обоняет приношение» — образное выражение, означающее принятие жертвы или дара.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не давая мне присоединиться к наследию ГОСПОДА». Еврейское выражение может подчёркивать принадлежность к народу и земле, данным ГОСПОДОМ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет и связующий союз, и переход к непосредственной просьбе Давида.
- source_word: יִשְׁמַע נָא
  choice: 'прошу: пусть … выслушает'
  rationale: Передаёт почтительную просьбу, выраженную юссивом с частицей נָא, а не резкое повеление.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господин мой царь
  rationale: Сохраняет придворное, почтительное обращение к Саулу без религиозного смысла слова «господин».
- source_word: דִּבְרֵי עַבְדּוֹ
  choice: слова своего слуги
  rationale: В русском возвратное местоимение естественно передаёт буквальное «слова его слуги» и сохраняет самоуничижительную придворную речь Давида от третьего лица.
- source_word: אִם יְהוָה הֱסִיתְךָ בִי
  choice: Если ГОСПОДЬ побудил тебя выступить против меня
  rationale: «Побудил» сохраняет каузативный смысл הסית, не уточняя нравственный характер действия; «выступить против» естественно раскрывает בִי в данном контексте.
- source_word: יָרַח מִנְחָה
  choice: пусть Он примет приношение
  rationale: Передаёт смысл жертвенной идиомы понятным современным языком; буквальный образ обоняния отмечен в сноске.
- source_word: וְאִם בְּנֵי הָאָדָם
  choice: Если же это сделали люди
  rationale: Контрастирует человеческих виновников с ГОСПОДОМ и естественно восполняет подразумеваемое действие из предыдущей части фразы.
- source_word: אֲרוּרִים הֵם לִפְנֵי יְהוָה
  choice: то прокляты они пред ГОСПОДОМ
  rationale: Сохраняет форму утверждения, а не превращает её в пожелание, и удерживает судебно-заветный оттенок выражения «пред ГОСПОДОМ».
- source_word: גֵרְשׁוּנִי
  choice: изгнали меня
  rationale: Точно передаёт насильственное удаление Давида из земли и общины.
- source_word: מֵהִסְתַּפֵּחַ
  choice: лишив меня доли
  rationale: В контексте наследия ясно передаёт исключение Давида из участия в нём; более буквальное значение присоединения сохранено в сноске.
- source_word: בְּנַחֲלַת יְהוָה
  choice: в наследии ГОСПОДА
  rationale: Сохраняет широкое значение удела, включающее землю и принадлежащий ГОСПОДУ народ, не сужая выражение до одной географии.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Сохраняет формальный ввод последующей прямой речи и допускает, что слова выражают смысл поступка гонителей.
- source_word: לֵךְ עֲבֹד אֱלֹהִים אֲחֵרִים
  choice: Ступай, служи другим богам!
  rationale: Передаёт два повеления кратко и энергично; «ступай» естественно отражает приказ покинуть место.
theological_decisions:
- issue: Утверждение о том, что ГОСПОДЬ побудил Саула выступить против Давида
  choice: Условная формулировка сохранена без объяснения характера Божьего причинного участия.
  alternative: Истолковать это либо как прямое подстрекательство, либо только как попущение.
  rationale: Еврейский текст не разрешает соотношение Божьего действия и человеческой ответственности; перевод не должен устранять эту напряжённость.
- issue: Смысл «наследия ГОСПОДА»
  choice: Сохранено широкое выражение об участии в наследии ГОСПОДА.
  alternative: Ограничить смысл только территорией Израиля или только доступом к богослужению.
  rationale: Контекст допускает одновременно территориальное, общинное и религиозное измерения, поэтому сужение было бы неоправданным.
- issue: Высказывание «служи другим богам»
  choice: Сохранено как смысл изгнания Давида, представленный прямой речью.
  alternative: Передать так, будто гонители обязательно произнесли эти слова буквально.
  rationale: לֵאמֹר может вводить фактическую речь или выражать практическое следствие действий; перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Почтительная речь Давида передана без архаизации; форма «пред ГОСПОДОМ» сохранена как уместный возвышенный оборот. Тетраграмматон передан традиционным издательским обозначением «ГОСПОДЬ».
