translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным строем. Начальное «И сказал» сохраняет древнееврейскую последовательность рассказа; обращения и повтор титулов не сглажены. Имя אַבְנֵר передано в традиционной русской библейской форме «Авенир».
