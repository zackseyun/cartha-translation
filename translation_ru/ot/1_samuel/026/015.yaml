base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/015.yaml
  text: David said to Abner[b][a], “Are you not a man? And who is like you in Israel? Why then have you not kept watch over your lord the king? For one of the people came to destroy the king your lord.”
translation:
  language: ru
  text: 'И сказал Давид Авениру: «Разве ты не мужчина? И кто подобен тебе в Израиле?[a] Почему же ты не охранял своего господина, царя? Ведь один из народа[b] пришёл, чтобы погубить царя, твоего господина».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И кто равен тебе в Израиле?»'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «один из народа», то есть один человек из находившихся в стане.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִישׁ אַתָּה
  choice: Разве ты не мужчина?
  rationale: Существительное אִישׁ буквально означает «мужчина». Риторический вопрос передаёт укор Давида, не добавляя отсутствующего в еврейском тексте определения вроде «храбрый».
- source_word: וּמִי כָמוֹךָ בְּיִשְׂרָאֵל
  choice: И кто подобен тебе в Израиле?
  rationale: Сохранена сравнительная форма כָמוֹךָ — «подобен тебе»; она естественно выражает мысль о выдающемся положении Авенира, не устраняя риторическую неоднозначность.
- source_word: וְלָמָּה לֹא שָׁמַרְתָּ אֶל
  choice: Почему же ты не охранял
  rationale: שׁמר в данном военном контексте обозначает охрану и бдительное наблюдение. «Охранял» естественно передаёт защитную обязанность Авенира, а частица «же» отражает связующий и укоризненный оттенок וְלָמָּה.
- source_word: אֲדֹנֶיךָ הַמֶּלֶךְ
  choice: своего господина, царя
  rationale: 'אדון передано как «господин», поскольку речь идёт о политическом и военном начальнике Авенира. Запятая показывает приложение: его господин — это царь.'
- source_word: כִּי בָא אַחַד הָעָם
  choice: Ведь один из народа приходил
  rationale: Сочетание אַחַד הָעָם буквально означает «один из народа». Форма «приходил» в русском повествовании указывает на совершившееся проникновение в стан, не уточняя сверх текста, был ли этот человек воином.
- source_word: לְהַשְׁחִית
  choice: чтобы погубить
  rationale: Hiphil глагола שׁחת означает «погубить, уничтожить». В отношении человека «погубить» звучит естественно и сохраняет более широкий образ, не сводя его без необходимости к прямому «убить».
- source_word: הַמֶּלֶךְ אֲדֹנֶיךָ
  choice: царя, твоего господина
  rationale: Сохранены повторное именование и порядок смысловых компонентов, подчёркивающие вину Авенира; русское приложение оформлено запятой.
