  text: וַ/יִּ֨חַן שָׁא֜וּל בְּ/גִבְעַ֣ת הַ/חֲכִילָ֗ה אֲשֶׁ֛ר עַל פְּנֵ֥י הַ/יְשִׁימֹ֖ן עַל הַ/דָּ֑רֶךְ וְ/דָוִד֙ יֹשֵׁ֣ב בַּ/מִּדְבָּ֔ר וַ/יַּ֕רְא כִּ֣י בָ֥א שָׁא֛וּל אַחֲרָ֖י/ו הַ/מִּדְבָּֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/003.yaml
  text: And Saul camped on the hill of Hachilah[a], which is opposite Jeshimon, by the road. But David was staying in the wilderness, and he saw that Saul had come after him into the wilderness.
translation:
  language: ru
  text: Саул расположился лагерем на холме Хахила, напротив Иешимона[a], у дороги. Давид же оставался в пустыне и увидел, что Саул пришёл за ним в пустыню.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Название «Иешимон» можно также понимать как нарицательное: «пустошь» или «пустыня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַן
  choice: расположился лагерем
  rationale: Глагол חנה в контексте передвижения войска означает остановиться и разбить лагерь; выбран естественный современный русский оборот.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: на холме Хахила
  rationale: גִּבְעָה передано как нарицательное «холм», а חֲכִילָה — как географическое название; предлог «на» соответствует рельефу местности.
- source_word: אֲשֶׁר עַל פְּנֵי הַיְשִׁימֹן
  choice: напротив Иешимона
  rationale: עַל־פְּנֵי здесь выражает расположение напротив или перед чем-либо; הַיְשִׁימֹן сохранено как вероятное географическое название, а его возможное нарицательное понимание отмечено в сноске.
- source_word: עַל הַדָּרֶךְ
  choice: у дороги
  rationale: В описании местоположения עַל естественно передать как близость к дороге, не утверждая, что лагерь стоял непосредственно на ней.
- source_word: יֹשֵׁב
  choice: оставался
  rationale: Причастная форма от ישב обозначает продолжающееся пребывание; «оставался» естественно передаёт этот длительный фон повествования.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, необжитую местность; «пустыня» — ясный и привычный русский эквивалент в данном географическом контексте.
- source_word: וַיַּרְא כִּי בָא שָׁאוּל אַחֲרָיו
  choice: и увидел, что Саул пришёл за ним
  rationale: Формулировка сохраняет конкретные значения глаголов «увидел» и «пришёл», а выражение «за ним» передаёт контекст преследования, не заменяя его более узким толкованием.
- source_word: הַמִּדְבָּרָה
  choice: в пустыню
  rationale: Направительный суффикс -ה указывает на движение в сторону пустыни или внутрь неё; русское «в пустыню» передаёт направление.
