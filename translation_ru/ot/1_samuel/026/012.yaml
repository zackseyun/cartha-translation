base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/012.yaml
  text: So David took the spear and the jar of water from beside Saul’s head[a], and they went away. No one saw it, and no one knew it, and no one awoke, for they were all sleeping[b], because a deep sleep from Yahweh had fallen on them.
translation:
  language: ru
  text: 'И взял Давид копьё и кувшин с водой у изголовья Саула[a], и они ушли. Никто не видел, никто не заметил, никто не проснулся, потому что все спали: глубокий сон от Яхве пал на них[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от изголовья Саула»; речь идёт о месте возле его головы, где он лежал.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «глубокий сон Яхве пал на них». Оборот указывает, что этот сон был вызван действием Яхве.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲנִית
  choice: копьё
  rationale: Обычное современное русское обозначение колющего древкового оружия; точно соответствует повествовательному контексту.
- source_word: צַפַּחַת הַמַּיִם
  choice: кувшин с водой
  rationale: צַפַּחַת обозначает небольшой сосуд, флягу или кувшин; выбран естественный и конкретный русский эквивалент.
- source_word: מֵרַאֲשֹׁתֵי שָׁאוּל
  choice: у изголовья Саула
  rationale: Форма указывает на место возле головы лежащего Саула, а не на предметы, находившиеся буквально на его голове.
- source_word: וַיֵּלְכוּ לָהֶם
  choice: и они ушли
  rationale: Множественное число относится к Давиду и Авессе; оборот естественно передаёт их удаление.
- source_word: וְאֵין רֹאֶה וְאֵין יוֹדֵעַ וְאֵין מֵקִיץ
  choice: Никто не видел, никто не заметил, никто не проснулся
  rationale: Повтор отрицательной конструкции сохранён. В данном контексте יֹדֵעַ означает осознание происходящего; «не заметил» звучит по-русски естественно и не дублирует буквально «не видел».
- source_word: תַּרְדֵּמַת יְהוָה
  choice: глубокий сон от Яхве
  rationale: תַּרְדֵּמָה — необычайно глубокий сон; генитив с божественным именем допускает понимание источника или действия, которое здесь передано без превращения именной фразы в явное каузативное предложение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: נָפְלָה עֲלֵיהֶם
  choice: объял их
  rationale: Естественный русский способ передать состояние, которое «пало на» людей, сохраняя образ внезапно охватившего их глубокого сна.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное божественное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Божественная причастность в תַּרְדֵּמַת יְהוָה
  choice: глубокий сон от Яхве объял их
  alternative: Яхве навёл на них глубокий сон
  rationale: Выбранная формулировка передаёт исходящую от Яхве причину, но не делает грамматически неявную каузацию более прямой, чем в еврейской именной конструкции.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тройной повтор «никто» сохраняет риторику еврейского текста; синтаксис остаётся ясным для обычного читателя.
