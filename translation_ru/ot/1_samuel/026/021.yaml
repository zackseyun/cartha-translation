  source_fidelity: 'Основной смысл передан точно: Саул признаёт грех, призывает Давида вернуться, обещает более не причинять ему зла и объясняет это тем, что Давид пощадил его жизнь. «Жизнь» для נֶפֶשׁ в данном контексте оправданно. Однако וָאֶשְׁגֶּה в сочетании с предшествующим признанием лучше передать совершенным действием, а не несовершенным «заблуждался».'
