  text: וַ/יֹּאמֶר֩ שָׁא֨וּל חָטָ֜אתִי שׁ֣וּב בְּנִֽ/י דָוִ֗ד כִּ֠י לֹֽא אָרַ֤ע לְ/ךָ֙ ע֔וֹד תַּ֠חַת אֲשֶׁ֨ר יָקְרָ֥ה נַפְשִׁ֛/י בְּ/עֵינֶ֖י/ךָ הַ/יּ֣וֹם הַ/זֶּ֑ה הִנֵּ֥ה הִסְכַּ֛לְתִּי וָ/אֶשְׁגֶּ֖ה הַרְבֵּ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/021.yaml
  text: Then Saul said[a], “I have sinned. Return, my son David, for I will not harm you again, because my life was precious in your eyes this day. Look[b], I have acted foolishly and have gone badly astray.”
translation:
  language: ru
  text: 'Тогда Саул сказал: «Я согрешил. Вернись, сын мой Давид! Я больше не причиню тебе зла, потому что сегодня моя жизнь[a] была драгоценна в твоих глазах. Вот, я поступил безрассудно и сильно ошибся[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моя душа была драгоценна в твоих глазах»; здесь «душа» означает жизнь или самого человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и весьма ошибся»; глагол также может передавать образ уклонения с пути.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Я согрешил
  rationale: Форма qal perfect 1-го лица ед. числа выражает прямое признание совершённого греха; русский совершенный вид естественно передаёт это признание.
- source_word: שׁוּב
  choice: Вернись
  rationale: Императив сохраняет прямой призыв Саула, не уточняя сверх текста, куда именно должен вернуться Давид.
- source_word: בְּנִי דָוִד
  choice: сын мой Давид
  rationale: Сохранены и обращение, выражающее отношения, и личное имя; порядок слов соответствует достоинству повествовательной речи.
- source_word: לֹא אָרַע לְךָ עוֹד
  choice: Я больше не причиню тебе зла
  rationale: Hiphil глагола רעע означает причинить зло или вред. Такая формулировка естественна по-русски и сохраняет нравственную окраску еврейского слова.
- source_word: תַּחַת אֲשֶׁר
  choice: потому что
  rationale: В данном контексте оборот вводит основание обещания Саула.
- source_word: יָקְרָה נַפְשִׁי בְּעֵינֶיךָ
  choice: моя жизнь была драгоценна в твоих глазах
  rationale: נֶפֶשׁ здесь обозначает жизнь Саула, которую Давид пощадил; образное выражение «в твоих глазах» сохранено.
- source_word: הַיּוֹם הַזֶּה
  choice: сегодня
  rationale: Естественная современная передача еврейского выражения «в этот день» без утраты временного значения.
- source_word: הִנֵּה
  choice: Вот
  rationale: Современный русский указательный дискурсивный маркер, привлекающий внимание к заключительному признанию Саула.
- source_word: הִסְכַּלְתִּי
  choice: я поступил безрассудно
  rationale: Hiphil выражает не просто недостаток понимания, а безрассудное поведение.
- source_word: וָאֶשְׁגֶּה הַרְבֵּה מְאֹד
  choice: и очень сильно заблуждался
  rationale: שגה передаёт ошибочное уклонение или заблуждение, а הַרְבֵּה מְאֹד усиливает степень; русский оборот сохраняет интенсивность без добавления нового образа направления.
theological_decisions:
- issue: Значение נֶפֶשׁ в признании Саула
  choice: моя жизнь
  alternative: моя душа
  rationale: В повествовательном контексте Давид пощадил физическую жизнь Саула. Перевод «жизнь» передаёт конкретный смысл и не превращает стих в утверждение о природе души.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранены прямота признания Саула и образ «драгоценна в твоих глазах»; архаизмы и конфессионально окрашенные формулы не использованы.
