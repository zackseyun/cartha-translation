base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/014.yaml
  text: Then David called to the troops and to Abner son of Ner, saying, “Will you not answer, Abner?” Abner answered and said, “Who are you, calling to the king?”
translation:
  language: ru
  text: 'И крикнул Давид воинам и Авениру, сыну Нира: «Что же ты не отвечаешь, Авенир?» Авенир ответил: «Кто ты, что кричишь царю?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם
  choice: воинам
  rationale: В данном военном контексте слово обозначает людей Саула, то есть его воинов; это естественнее русского «народу» и соответствует контексту лагеря.
- source_word: וַיִּקְרָא ... אֶל
  choice: крикнул ... / кричишь
  rationale: Давид обращается с расстояния к находящимся в лагере, поэтому «крикнул» естественно передаёт громкий зов; повтор корня сохранён в реплике Авенира.
- source_word: הֲלוֹא תַעֲנֶה
  choice: Что же ты не отвечаешь
  rationale: Риторический вопрос с הֲלוֹא передан естественной русской конструкцией, выражающей требование откликнуться.
- source_word: קָרָאתָ אֶל הַמֶּלֶךְ
  choice: кричишь царю
  rationale: Сохраняется направленность обращения к царю без добавления отсутствующего в еврейском тексте значения «беспокоишь» или «зовёшь по имени».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование звучит ясно и достойно. Устранено тяжеловесное буквальное «ответил и сказал», поскольку по-русски одного «ответил» достаточно, а смысл полностью сохраняется.
