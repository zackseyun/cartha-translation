  source_fidelity: 'Текст точно передаёт еврейский оригинал: Давид обращается к людям в лагере и к Авениру, задаёт риторический вопрос о том, почему тот не отвечает; затем Авенир спрашивает, кто зовёт царя. «Воинам» оправдано ближайшим военным контекстом и соответствует английскому audit trail («troops»).'
