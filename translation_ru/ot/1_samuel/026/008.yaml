base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/008.yaml
  text: Then Abishai said to David[a], “God has delivered your enemy into your hand today. So now, please let me pin him to the earth with the spear in one blow[c][b], and I will not strike him a second time.”
translation:
  language: ru
  text: 'Авесса сказал Давиду: «Сегодня Бог отдал твоего врага в твои руки. Теперь позволь мне копьём пригвоздить его к земле одним ударом[a], и я не стану бить его второй раз».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поражу его копьём и в землю, один раз»; речь идёт об ударе, которым он будет пронзён и пригвождён к земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סִגַּר
  choice: отдал
  rationale: В данном военном контексте глагол означает, что Бог отдал врага во власть Давида. Русское «отдал» ясно передаёт смысл, не прибегая к неестественному буквальному «запер».
- source_word: בְּיָדֶךָ
  choice: в твои руки
  rationale: Это естественная русская идиома со значением «в твою власть»; множественное число нормативно для русского выражения, хотя в еврейском стоит единственное число.
- source_word: אַכֶּנּוּ נָא
  choice: позволь мне… пригвоздить его
  rationale: Частица נָא и волевая форма выражают просьбу Авессы. В сочетании с последующими словами о копье и земле глагол естественно передан как «пригвоздить», то есть пронзить и прижать к земле.
- source_word: בַּחֲנִית וּבָאָרֶץ
  choice: копьём к земле
  rationale: Буквальное сочетание «копьём и в землю» описывает удар, которым человека пронзают до земли. Выбранная формулировка передаёт этот образ ясно и естественно.
- source_word: פַּעַם אַחַת
  choice: одним ударом
  rationale: В контексте речь не просто об однократности действия, а о том, что одного удара будет достаточно.
- source_word: וְלֹא אֶשְׁנֶה לוֹ
  choice: второго удара не понадобится
  rationale: Еврейское выражение буквально означает «и я не повторю ему». Русская формулировка естественно восполняет подразумеваемое действие и передаёт уверенность Авессы, что повторный удар не потребуется.
theological_decisions:
- issue: Божье действие и предложение убить Саула
  choice: Сегодня Бог отдал твоего врага в твои руки
  alternative: Сегодня Бог предал твоего врага в твою власть
  rationale: Перевод сохраняет слова Авессы о Божьем промысле как мнение самого говорящего и не добавляет утверждения, будто Бог одобряет предложенное убийство.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. «Авесса» соответствует традиционной русской библейской форме имени. Конструкция «в твои руки» сохраняет знакомый библейский образ, оставаясь понятной современному читателю.
