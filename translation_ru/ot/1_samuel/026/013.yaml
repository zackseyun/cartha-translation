  text: וַ/יַּעֲבֹ֤ר דָּוִד֙ הָ/עֵ֔בֶר וַ/יַּעֲמֹ֥ד עַל רֹאשׁ הָ/הָ֖ר מֵֽ/רָחֹ֑ק רַ֥ב הַ/מָּק֖וֹם בֵּינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/013.yaml
  text: Then David crossed over to the other side and stood on the top of the mountain at a distance[a]; there was a great space between them.
translation:
  language: ru
  text: Давид перешёл на другую сторону и встал на вершине горы вдали; между ними было большое расстояние.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: перешёл
  rationale: Глагол עבר обозначает переход с одной стороны на другую; «перешёл» естественно передаёт направленность действия.
- source_word: הָעֵבֶר
  choice: на другую сторону
  rationale: Сочетание указывает на противоположную, дальнюю сторону; по-русски естественно «перешёл на другую сторону».
- source_word: וַיַּעֲמֹד
  choice: встал
  rationale: Базовое значение — «встать, стать»; форма передаёт последовательное действие, а не только состояние.
- source_word: עַל רֹאשׁ הָהָר
  choice: на вершине горы
  rationale: ראשׁ в топографическом употреблении означает вершину; הַר передано обычным соответствием «гора».
- source_word: מֵרָחֹק
  choice: вдали
  rationale: Наречное «вдали» кратко и естественно передаёт пространственную удалённость.
- source_word: רַב הַמָּקוֹם בֵּינֵיהֶם
  choice: между ними было большое расстояние
  rationale: 'Буквально: «велико было место/пространство между ними». В контексте מָקוֹם обозначает разделяющее их пространство; «большое расстояние» ясно передаёт смысл без изменения степени удалённости.'
theological_decisions: []
