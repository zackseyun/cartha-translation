  source_fidelity: 'Перевод точно передаёт основные элементы еврейского текста: воздаяние Яхве каждому сообразно его праведности и верности, предоставление Саула в руки Давида и отказ Давида поднять руку на помазанника Яхве. «Воздаст каждому за его праведность и верность» является естественной русской передачей идиоматического смысла יָשִׁיב ... אֶת־צִדְקָתוֹ וְאֶת־אֱמֻנָתוֹ. Связка «ведь» обоснованно выражает пояснительную связь относительной конструкции в данном контексте. Неявное в еврейском, но необходимое по-русски «мои» корректно восстановлено из речи Давида.'
