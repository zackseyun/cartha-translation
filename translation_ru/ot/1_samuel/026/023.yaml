  text: וַֽ/יהוָה֙ יָשִׁ֣יב לָ/אִ֔ישׁ אֶת צִדְקָת֖/וֹ וְ/אֶת אֱמֻנָת֑/וֹ אֲשֶׁר֩ נְתָנְ/ךָ֨ יְהוָ֤ה הַ/יּוֹם֙ בְּ/יָ֔ד וְ/לֹ֣א אָבִ֔יתִי לִ/שְׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֥יחַ יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/023.yaml
  text: And Yahweh will repay each man for his righteousness and his faithfulness[a], because Yahweh gave you into my hand today[b], but I was not willing to stretch out my hand against Yahweh’s anointed.
translation:
  language: ru
  text: И Яхве воздаст каждому за его праведность и верность[a], ведь сегодня Яхве отдал тебя в мои руки, но я не захотел поднять руку на помазанника Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возвратит каждому его праведность и верность».'
    reason: lexical_alternative
  - marker: b
    text: То есть царя, помазанного Яхве; здесь речь идёт о Сауле.
    reason: cultural_note
lexical_decisions:
- source_word: וַיהוָה
  choice: И Яхве
  rationale: Союз ו передан простым связующим «И». Имя יהוה транслитерировано как «Яхве», что сохраняет личное заветное имя Бога.
- source_word: יָשִׁיב לָאִישׁ
  choice: воздаст каждому
  rationale: Каузативная форма שוב здесь выражает возвращение человеку должного по его поступкам, то есть воздаяние. Обобщённое לָאִישׁ естественно передаётся словом «каждому» без устранения индивидуального смысла.
- source_word: אֶת־צִדְקָתוֹ וְאֶת־אֱמֻנָתוֹ
  choice: за его праведность и верность
  rationale: צְדָקָה обозначает нравственную правоту, а אֱמוּנָה — надёжность и верность, проявленную в поступках. Предлог «за» естественно сочетается по-русски с глаголом «воздаст».
- source_word: אֲשֶׁר נְתָנְךָ יְהוָה הַיּוֹם בְּיָד
  choice: ведь сегодня Яхве отдал тебя в мои руки
  rationale: Относительная частица вводит пояснение того, в чём проявились праведность и верность Давида; «ведь» естественно выражает эту связь. Местоимение «мои» восстановлено из контекста, а идиома «дать в руку» передана обычным русским оборотом «отдать в руки».
- source_word: וְלֹא אָבִיתִי
  choice: но я не захотел
  rationale: אבה означает желание или готовность; отрицательная форма передана без усиления как «не захотел». Союз «но» ясно выражает контраст между предоставленной возможностью и отказом ею воспользоваться.
- source_word: לִשְׁלֹחַ יָדִי
  choice: поднять руку
  rationale: Еврейская идиома означает совершить насилие или нанести удар. Русское «поднять руку на» сохраняет образ руки и точно передаёт значение.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: на помазанника Яхве
  rationale: מָשִׁיחַ буквально означает помазанного. В данном историческом контексте речь идёт о Сауле как о царе, помазанном Яхве; «помазанник» сохраняет исходный образ без преждевременного превращения слова в собственный мессианский титул.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога, поэтому транслитерация «Яхве» сохраняет его отличие от титула «Господь».
- issue: Смысл воздаяния в יָשִׁיב
  choice: воздаст каждому за его праведность и верность
  alternative: возвратит каждому его праведность и верность
  rationale: Контекст указывает на ответ Бога на нравственное поведение человека. При этом буквальный образ возвращения отмечен в сноске, чтобы не скрывать лексическую особенность.
- issue: Значение מְשִׁיחַ применительно к Саулу
  choice: помазанник Яхве
  alternative: Мессия Яхве
  rationale: Здесь слово является царским обозначением Саула, а не прямым указанием на позднейший мессианский титул. Перевод «помазанник» сохраняет исторический смысл и возможные канонические связи без их навязывания.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Выражения «воздаст каждому», «отдал тебя в мои руки» и «поднять руку на» понятны широкому читателю и сохраняют ключевые образы еврейского текста.
