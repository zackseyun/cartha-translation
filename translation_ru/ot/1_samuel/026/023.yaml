  terminology: «Яхве» последовательно передаёт тетраграмматон. «Праведность», «верность» и «помазанник Яхве» точны по смыслу и не вносят позднейшей мессианской или конфессиональной конкретизации. Сноска b корректно разъясняет историческую референцию без изменения значения текста.
