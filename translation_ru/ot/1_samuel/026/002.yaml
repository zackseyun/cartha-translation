base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/002.yaml
  text: Then Saul arose and went down to the wilderness of Ziph[a], and with him were three thousand chosen men of Israel, to seek David in the wilderness of Ziph.
translation:
  language: ru
  text: Тогда Саул встал и спустился в пустынную местность Зиф с тремя тысячами отборных людей Израиля, чтобы искать Давида в пустынной местности Зиф.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Глагол קום в повествовательной последовательности обозначает начало решительного действия. «Встал» сохраняет древнееврейский образ и естественно сочетается с последующим глаголом.
- source_word: וַיֵּרֶד
  choice: спустился
  rationale: Передаёт направленное движение вниз, выраженное глаголом ירד, не сводя его к общему «отправился».
- source_word: מִדְבַּר זִיף
  choice: пустыня Зиф
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность, не обязательно песчаную пустыню. Топоним передан традиционной русской формой «Зиф»; повтор названия сохранён вслед за исходным текстом.
- source_word: וְאִתּוֹ
  choice: с ним были
  rationale: Передаёт обстоятельственное указание на сопровождавших Саула и позволяет построить естественную русскую фразу.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ בְּחוּרֵי יִשְׂרָאֵל
  choice: три тысячи отборных воинов Израиля
  rationale: בְּחוּרֵי указывает на избранных, отборных людей; в данном военном контексте «воины» естественно передаёт подразумеваемую функцию, а «отборные» сохраняет смысл их отбора.
- source_word: לְבַקֵּשׁ אֶת דָּוִד
  choice: искать Давида
  rationale: Инфинитив בקש выражает цель похода — разыскать Давида. В русском языке «искать» точно и непосредственно передаёт этот смысл.
