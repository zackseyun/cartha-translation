  text: וַ/יֹּ֤אמֶר דָּוִד֙ חַי יְהוָ֔ה כִּ֥י אִם יְהוָ֖ה יִגָּפֶ֑/נּוּ אֽוֹ יוֹמ֤/וֹ יָבוֹא֙ וָ/מֵ֔ת א֧וֹ בַ/מִּלְחָמָ֛ה יֵרֵ֖ד וְ/נִסְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/010.yaml
  text: And David said[a], “As Yahweh lives, surely Yahweh will strike him, or his day will come to die[c][b], or he will go down into battle and perish.”
translation:
  language: ru
  text: 'И сказал Давид: «Жив Яхве! Непременно Яхве поразит его, или придёт его день[a] — и он умрёт, или он спустится в сражение[b] и погибнет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «настанет его срок».'
    reason: Слово יוֹם буквально означает «день», но здесь может обозначать назначенное время смерти.
  - marker: b
    text: 'Буквально: «сойдёт в сражение».'
    reason: Глагол יָרַד означает «спускаться, сходить»; в данном контексте он описывает выход на битву.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Жив Яхве!
  rationale: Сохранена обычная древнееврейская формула клятвы; по-русски она звучит кратко, торжественно и понятно.
- source_word: כִּי אִם
  choice: непременно
  rationale: В контексте клятвы сочетание вводит решительное, усиленное утверждение, а не обычное условие или исключение.
- source_word: יִגָּפֶנּוּ
  choice: поразит его
  rationale: Глагол נָגַף обозначает нанесение поражающего удара; перевод не уточняет способ Божьего действия, которого еврейский текст также не называет.
- source_word: יוֹמוֹ יָבוֹא
  choice: придёт его день
  rationale: Сохранён зловещий образ наступающего дня, то есть срока смерти, без его полного разъяснения в основном тексте.
- source_word: וָמֵת
  choice: и он умрёт
  rationale: Явно выраженный субъект необходим для естественного русского синтаксиса и верно передаёт последовательность еврейского текста.
- source_word: בַמִּלְחָמָה יֵרֵד
  choice: он вступит в сражение
  rationale: Естественная русская военная формулировка передаёт движение на битву; буквальный образ «сойти» отмечен в сноске.
- source_word: וְנִסְּפָה
  choice: и погибнет
  rationale: «Погибнет» сохраняет отличие от предшествующего «умрёт» и уместно передаёт гибель в сражении.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное божественное имя — тетраграмматон; транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Соотношение Божьего действия и возможных обстоятельств смерти Саула
  choice: Сохранены три параллельные возможности без их богословского согласования
  alternative: Истолковать все три варианта как непосредственные способы Божьего поражения
  rationale: Еврейский текст ставит рядом прямое поражение Яхве, наступление дня смерти и гибель в бою; перевод не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественностью, соответствующей клятве. Порядок трёх возможных исходов сохранён; формулировки не архаизированы сверх необходимого.
