base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/009.yaml
  text: But David said to Abishai[a], “Do not destroy him, for who can stretch out his hand against Yahweh’s anointed and remain guiltless?”
translation:
  language: ru
  text: 'Но Давид сказал Авишаю: «Не губи его! Ведь кто поднимет руку на помазанника[a] Яхве и останется невиновным?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «помазанник» в еврейском тексте принадлежит к тому же семейству слов, с которым связан титул «Мессия». Здесь оно относится к Саулу как к царю, помазанному Яхве.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но Давид сказал
  rationale: Последовательный вав продолжает повествование, а союз «но» естественно передаёт контекстуальное противопоставление намерению Авессы убить Саула.
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: Не убивай его
  rationale: Каузативная форма שׁחת буквально может означать «не погуби его», но в непосредственном контексте речь идёт о смертельном ударе; «не убивай» ясно и естественно передаёт смысл по-русски.
- source_word: שָׁלַח יָדוֹ
  choice: поднимет руку
  rationale: Русское устойчивое выражение «поднять руку на кого-либо» точно передаёт еврейскую идиому, обозначающую насильственное выступление против человека.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: на помазанника Яхве
  rationale: Слово מָשִׁיחַ здесь обозначает Саула как царя, помазанного Яхве. «Помазанник» сохраняет связь с тем же семейством слов, которое позднее связано с титулом «Мессия».
- source_word: וְנִקָּה
  choice: и останется невиновным
  rationale: Форма נקה выражает свободу от вины или ответственности. Этот вариант сохраняет нравственно-юридический смысл, не сводя его только к отсутствию наказания.
theological_decisions:
- issue: Передача מְשִׁיחַ применительно к Саулу
  choice: помазанник Яхве
  alternative: Мессия Яхве
  rationale: В данном историческом контексте речь идёт о Сауле как о царе, помазанном Яхве, а не непосредственно об эсхатологическом Мессии. При этом примечание сохраняет важную лексическую связь.
- issue: Смысл риторического вопроса
  choice: кто поднимет руку… и останется невиновным?
  alternative: кто может поднять руку… и остаться невиновным?
  rationale: В еврейском тексте нет отдельного глагола «мочь». Более формальная русская конструкция сохраняет риторическую силу и не добавляет модальности сверх оригинала.
translation_notes:
  register: Современный литературный русский язык; речь Давида передана ясно и достойно. Идиома שׁלח יד передана естественным русским выражением «поднять руку». Имя יהוה транслитерировано как «Яхве».
