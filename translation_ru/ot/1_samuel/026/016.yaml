  text: לֹא ט֞וֹב הַ/דָּבָ֣ר הַ/זֶּה֮ אֲשֶׁ֣ר עָשִׂיתָ֒ חַי יְהוָ֗ה כִּ֤י בְנֵי מָ֨וֶת֙ אַתֶּ֔ם אֲשֶׁ֧ר לֹֽא שְׁמַרְתֶּ֛ם עַל אֲדֹנֵי/כֶ֖ם עַל מְשִׁ֣יחַ יְהוָ֑ה וְ/עַתָּ֣ה רְאֵ֗ה אֵֽי חֲנִ֥ית הַ/מֶּ֛לֶךְ וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם אֲשֶׁ֥ר מראשת/ו־־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/016.yaml
  text: This thing that you have done is not good. As Yahweh lives[a], you are sons of death, because you did not keep watch over your master, over Yahweh’s anointed. And now, look—where are the king’s spear and the water jar that were by his head?
translation:
  language: ru
  text: 'Нехорошо ты поступил. Жив Яхве: вы — сыны смерти[a], потому что не стерегли своего господина, помазанника Яхве. А теперь посмотри: где царское копьё и кувшин с водой, стоявший у его изголовья?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны смерти»; древнееврейский оборот означает, что они заслуживают смерти или подлежат смертной казни.'
    reason: Пояснение непрозрачного древнееврейского идиоматического выражения.
lexical_decisions:
- source_word: לֹא טוֹב הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָ
  choice: Нехорошо ты поступил
  rationale: Естественно передаёт отрицательную оценку поступка и сохраняет обращение к одному человеку, выраженное формой единственного числа עָשִׂיתָ.
- source_word: חַי יְהוָה
  choice: Жив Яхве
  rationale: Традиционная и краткая русская форма древнееврейской клятвенной формулы; личное имя יְהוָה передано как «Яхве».
- source_word: בְנֵי מָוֶת אַתֶּם
  choice: вы — сыны смерти
  rationale: Сохраняет выразительный древнееврейский оборот и множественное число; его судебно-карательный смысл пояснён в сноске.
- source_word: שְׁמַרְתֶּם עַל אֲדֹנֵיכֶם
  choice: не стерегли своего господина
  rationale: В военном контексте שׁמר על обозначает обязанность охранять и нести стражу; «господин» передаёт отношение подчинённых к царю и не смешивается с именем Бога.
- source_word: מְשִׁיחַ יְהוָה
  choice: помазанника Яхве
  rationale: Сохраняет царский сакральный титул Саула, не превращая нарицательное обозначение в имя или позднейший мессианский титул.
- source_word: צַפַּחַת הַמַּיִם
  choice: кувшин с водой
  rationale: Понятное современному читателю обозначение небольшого сосуда для воды.
- source_word: מראשתו
  choice: у его изголовья
  rationale: Передаёт местонахождение предмета возле головы спящего Саула естественным литературным русским выражением.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное заветное имя; транслитерация сохраняет различие между יְהוָה и אֲדֹנֵיכֶם («ваш господин»).
- issue: Смысл выражения מְשִׁיחַ יְהוָה
  choice: помазанник Яхве
  alternative: Мессия Яхве
  rationale: В непосредственном контексте речь о помазанном на царство Сауле. Нарицательное «помазанник» сохраняет этот смысл без неоправданного отождествления с позднейшим титулом Мессии.
- issue: Степень буквальности בְנֵי מָוֶת
  choice: сыны смерти
  alternative: вы заслуживаете смерти
  rationale: Буквальный образ сохраняет суровую судебную риторику Давида, а сноска раскрывает идиоматический смысл, не устраняя образ из основного текста.
translation_notes:
  register: 'Современный литературный русский язык с торжественной, но понятной формой клятвы. Различие числа сохранено: сначала Давид обращается лично к Авениру («ты поступил», «посмотри»), затем обвиняет всех стражников («вы», «не стерегли»). Тире перед приложением «помазанника Яхве» показывает, что речь идёт об одном и том же лице — Сауле.'
