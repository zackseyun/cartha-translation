  yaml_path: translation/ot/1_samuel/026/017.yaml
  text: Then Saul recognized David’s voice and said, “Is this your voice, my son David?” And David said, “It is my voice, my lord the king.”
translation:
  language: ru
  text: 'Саул узнал голос Давида и сказал: «Твой ли это голос, сын мой Давид?» Давид ответил: «Это мой голос, господин мой, царь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: узнал
  rationale: 'В данном контексте נכר означает распознать по восприятию: Саул узнаёт голос Давида. «Узнал» естественно передаёт это значение по-русски.'
- source_word: קוֹל
  choice: голос
  rationale: Здесь речь идёт именно о голосе говорящего, а не о звуке вообще; повтор слова в вопросе и ответе сохранён.
- source_word: הֲקוֹלְךָ זֶה
  choice: Твой ли это голос
  rationale: Конструкция с вопросительной частицей и указательным местоимением передана естественным русским вопросом с частицей «ли», без добавления толкования.
- source_word: בְּנִי
  choice: сын мой
  rationale: 'Сохранено буквальное мужское и родственное обращение, важное для напряжения повествования: Саул так называет Давида, несмотря на враждебность к нему.'
- source_word: קוֹלִי
  choice: Мой голос
  rationale: Сохранён краткий именной ответ древнееврейского текста и его лексический акцент на «голосе»; русская фраза естественна в непосредственном ответе на вопрос.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господин мой царь
  rationale: אֲדֹנִי здесь является почтительным обращением к человеку, а не Божьим титулом. Формулировка сохраняет и почтение, и царский титул.
- source_word: דָּוִד / שָׁאוּל
  choice: Давид / Саул
  rationale: Использованы традиционные русские формы библейских имён.
theological_decisions:
- issue: Родственное обращение בְּנִי в речи Саула
  choice: сын мой
  alternative: дитя моё
  rationale: 'Буквальная передача сохраняет мужскую форму и повествовательное напряжение: Саул употребляет родственное обращение к Давиду, хотя преследует его.'
- issue: Значение אֲדֹנִי в ответе Давида
  choice: господин мой
  alternative: Господь мой
  rationale: Контекст однозначно указывает на почтительное обращение Давида к царю Саулу, а не на Божье имя или титул.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Порядок «сын мой Давид» и «господин мой царь» сохраняет торжественный библейский оттенок, оставаясь понятным современному читателю. Повтор слова «голос» намеренно сохранён.
