  yaml_path: translation/ot/1_samuel/026/004.yaml
  text: So David sent out scouts[a], and he learned that Saul had indeed come.
translation:
  language: ru
  text: И послал Давид разведчиков и узнал, что Саул действительно пришёл.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и удостоверился, что Саул пришёл». Последнее еврейское слово, вероятно, подчёркивает достоверность или подтверждение известия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычное значение глагола שׁלח; в повествовательной последовательности естественно передаётся прошедшим временем.
- source_word: מְרַגְּלִים
  choice: разведчиков
  rationale: Форма от רגל обозначает людей, ведущих разведку; современное «разведчики» естественно соответствует военному контексту и не вносит политических оттенков слова «шпионы».
- source_word: וַיֵּדַע
  choice: узнал
  rationale: После отправки разведчиков ידע обозначает получение подтверждённой информации, поэтому «узнал» здесь естественнее буквального «знал».
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что Давид узнал.
- source_word: בָא
  choice: пришёл
  rationale: Перфект представляет прибытие Саула как совершившийся факт; русское прошедшее время ясно передаёт это соотношение без необходимости в специальной форме предпрошедшего времени.
- source_word: אֶל נָכוֹן
  choice: действительно
  rationale: Трудное сочетание, вероятнее всего, имеет наречный смысл подтверждения или достоверности; «действительно» передаёт этот оттенок естественным современным русским языком.
- source_word: דָּוִד
  choice: Давид
  rationale: Традиционная русская форма имени.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Традиционная русская форма имени.
