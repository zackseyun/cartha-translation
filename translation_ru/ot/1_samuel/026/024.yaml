  text: וְ/הִנֵּ֗ה כַּ/אֲשֶׁ֨ר גָּדְלָ֧ה נַפְשְׁ/ךָ֛ הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/עֵינָ֑/י כֵּ֣ן תִּגְדַּ֤ל נַפְשִׁ/י֙ בְּ/עֵינֵ֣י יְהוָ֔ה וְ/יַצִּלֵ֖/נִי מִ/כָּל צָרָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/024.yaml
  text: And look[a], just as your life was precious in my eyes this day, so may my life be precious in the eyes of Yahweh, and may he deliver me from all distress.
translation:
  language: ru
  text: И вот, как дорога была сегодня твоя жизнь в моих глазах, так пусть и моя жизнь будет дорога в глазах Яхве, и пусть Он избавит меня от всякой беды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как велика была сегодня твоя жизнь в моих глазах, так пусть велика будет моя жизнь в глазах Яхве». В этом еврейском обороте слово «велика» выражает высокую ценность: «дорога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт указательно-усилительную функцию оборота естественно для современного литературного русского языка.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: как ... так
  rationale: Ясно сохраняет сравнительную конструкцию между поступком Давида и его пожеланием о Божьем отношении к нему.
- source_word: גָּדְלָה ... נַפְשְׁךָ ... בְּעֵינַי
  choice: дорога была ... твоя жизнь в моих глазах
  rationale: Буквально глагол означает «была велика», но в данном сочетании выражает высокую ценность; речь идёт о сохранённой жизни Саула.
- source_word: נֶפֶשׁ
  choice: жизнь
  rationale: В контексте сохранения от смерти и избавления от беды слово обозначает жизнь человека, а не отдельно мыслимую нематериальную душу.
- source_word: הַיּוֹם הַזֶּה
  choice: сегодня
  rationale: Естественно и точно передаёт временное указание без излишне архаичной формы «в сей день».
- source_word: תִּגְדַּל ... נַפְשִׁי ... בְּעֵינֵי יְהוָה
  choice: пусть и моя жизнь будет дорога в глазах Яхве
  rationale: Форма передана как пожелание; повтор лексики сохраняет смысловую параллель с первой частью стиха.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное Божье имя, представленное тетраграмматоном в еврейском тексте.
- source_word: וְיַצִּלֵנִי
  choice: и пусть Он избавит меня
  rationale: Hифиль נצל выражает избавление или спасение от опасности; конструкция продолжает пожелание.
- source_word: מִכָּל צָרָה
  choice: от всякой беды
  rationale: Сохраняет распределительное значение כָּל и широкий смысл צָרָה — беды, тяготы или опасности.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет различие между собственным именем и титулом.
- issue: Характер высказывания во второй части стиха
  choice: 'пожелание: «пусть ... будет ... и пусть ... избавит»'
  alternative: 'утверждение о будущем: «будет ... и избавит»'
  rationale: Еврейские имперфекты допускают контекстуальное прочтение как надежду или пожелание. Здесь речь Давида естественнее звучит как упование, а не как безусловное предсказание.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной библейской речи. Синтаксический параллелизм оригинала сохранён; архаизмы «се», «душа» в значении жизни и «скорбь» для всякой беды не использованы.
