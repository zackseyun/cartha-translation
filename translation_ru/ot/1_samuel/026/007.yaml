base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/007.yaml
  text: So David and Abishai came to the troops by night[a], and behold, Saul was lying asleep within the encampment, with his spear stuck in the ground at his head, and Abner and the troops were lying around him.
translation:
  language: ru
  text: И пришли Давид и Авесса ночью к войску. И вот, Саул лежал и спал внутри лагеря[a]; его копьё было воткнуто в землю у изголовья, а Авенир и воины лежали вокруг него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в кругу»; еврейское слово, вероятно, указывает на круговое расположение лагеря.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: войско / воины
  rationale: В военном контексте слово обозначает людей Саула как вооружённый отряд; «войско» естественно при первом упоминании, а «воины» — при описании спящих людей.
- source_word: לַיְלָה
  choice: ночью
  rationale: Наречное употребление указывает на время действия; это краткий и естественный русский эквивалент.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет наглядность еврейского повествовательного маркера и обращает внимание на открывшуюся Давиду картину.
- source_word: שֹׁכֵב יָשֵׁן
  choice: лежал и спал
  rationale: Передаёт и положение тела, и состояние сна, сохраняя сочетание двух еврейских форм.
- source_word: בַּמַּעְגָּל
  choice: посреди лагеря
  rationale: В данном контексте מַעְגָּל, вероятно, обозначает круговое расположение лагеря или защищённое место внутри него; «посреди лагеря» естественно передаёт пространственный смысл, не перегружая основной текст.
- source_word: חֲנִיתוֹ
  choice: его копьё
  rationale: Обычное современное обозначение оружия Саула в этом повествовании.
- source_word: מְעוּכָה בָאָרֶץ
  choice: было воткнуто в землю
  rationale: Причастие описывает копьё, вдавленное или укреплённое в земле; выбранная формулировка точна и естественна по-русски.
- source_word: מראשתו
  choice: у его изголовья
  rationale: Еврейская идиома обозначает место возле головы лежащего человека; «у изголовья» точно и литературно передаёт её.
- source_word: סביבתו
  choice: вокруг него
  rationale: Передаёт расположение Авенира и воинов со всех сторон вокруг Саула.
