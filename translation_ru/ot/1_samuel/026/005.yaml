  source_fidelity: 'В черновике не вполне точно передана синтаксическая связь второй части первого предложения: еврейский текст говорит, что Давид увидел место, где лежал Саул, и Авенира, сына Нира. Формулировка «где лежали Саул и Авенир» присоединяет Авенира к относительному глаголу и тем самым утверждает то, что в данном стихе выражено не столь прямо. Исправление сохраняет координацию и не снимает возможной синтаксической неоднозначности источника.'
  naturalness: После исправления падежного согласования приложение к имени Авенира и вся фраза звучат естественно на современном литературном русском. «Стоял лагерем» точно и ясно передаёт лагерное значение חנה; «стояли лагерем вокруг него» передаёт длительное/состоянийное значение причастия.
