base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/005.yaml
  text: Then David arose and came to the place where Saul had camped[a], and David saw the place where Saul lay, and Abner son of Ner, the commander of his army. Saul was lying within the encampment, and the people were camped around him.
translation:
  language: ru
  text: Тогда Давид встал и пришёл к месту, где Саул стоял лагерем. Давид увидел место, где лежал Саул, и Авенира, сына Нира, начальника его войска. Саул лежал внутри лагеря[a], а люди стояли лагерем вокруг него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в круге»; вероятно, имеется в виду внутренний круг или центральная часть лагеря.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Обычное повествовательное употребление קום отмечает переход к следующему действию; «встал» сохраняет последовательность и не добавляет лишнего значения движения.
- source_word: וַיָּבֹא אֶל־הַמָּקוֹם
  choice: пришёл к месту
  rationale: בוא с אֶל обозначает движение к месту; это прямой и естественный русский эквивалент.
- source_word: חָנָה
  choice: расположился
  rationale: Глагол означает расположиться лагерем. В данном военном контексте краткое «расположился» звучит естественно, а значение лагерной стоянки ясно из дальнейшего описания.
- source_word: וַיַּרְא ... אֶת־הַמָּקוֹם
  choice: увидел место
  rationale: ראה здесь передаёт зрительное обнаружение расположения Саула и Авенира; «увидел» сохраняет простоту еврейского выражения.
- source_word: שָׁכַב ... שֹׁכֵב
  choice: лежали ... лежал
  rationale: Первая форма определяет место, где находились лежащие Саул и Авенир, а причастие затем описывает положение Саула; повтор корня сохранён естественным русским повтором.
- source_word: וְאַבְנֵר בֶּן־נֵר שַׂר צְבָאוֹ
  choice: и Авенир, сын Нира, начальник его войска
  rationale: Союзная конструкция естественно связывает Авенира с Саулом как находившегося в том же месте. שַׂר צְבָאוֹ передано современным и понятным выражением «начальник его войска».
- source_word: בַּמַּעְגָּל
  choice: внутри лагеря
  rationale: מַעְגָּל буквально связано с кругом и здесь, вероятно, обозначает внутреннюю часть кругового лагерного расположения. Основной текст передаёт пространственный смысл ясно, а буквальный образ отмечен в сноске.
- source_word: חֹנִים סְבִיבֹתָיו
  choice: расположились вокруг него
  rationale: Причастие חֹנִים описывает стоящих лагерем людей, окружавших Саула; русский вариант сохраняет пространственную деталь без тяжеловесного повтора слова «лагерь».
