  text: וְ/עַתָּ֗ה אַל יִפֹּ֤ל דָּֽמִ/י֙ אַ֔רְצָ/ה מִ/נֶּ֖גֶד פְּנֵ֣י יְהוָ֑ה כִּֽי יָצָ֞א מֶ֣לֶךְ יִשְׂרָאֵ֗ל לְ/בַקֵּשׁ֙ אֶת פַּרְעֹ֣שׁ אֶחָ֔ד כַּ/אֲשֶׁ֛ר יִרְדֹּ֥ף הַ/קֹּרֵ֖א בֶּ/הָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/020.yaml
  text: So now[a], do not let my blood fall to the ground away from the presence of Yahweh, for the king of Israel has come out to seek a single flea[b], as one hunts a partridge in the mountains.
translation:
  language: ru
  text: И теперь пусть моя кровь не прольётся на землю вдали от присутствия Яхве[a], ведь царь Израиля вышел искать одну-единственную блоху, как охотятся на куропатку в горах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вдали от лица Яхве». Возможно, подразумевается смерть за пределами земли Израиля, откуда Давид был вынужден уйти.'
    reason: Сохраняет буквальный образ «лица» и отмечает вероятный контекстуальный подтекст, не превращая его в единственное толкование.
  - marker: b
    text: Точное определение названной здесь птицы не вполне достоверно; традиционный перевод — «куропатка».
    reason: Отмечает лексическую неопределённость древнееврейского названия птицы.
lexical_decisions:
- source_word: דָּמִי ... יִפֹּל ... אַרְצָה
  choice: моя кровь не прольётся на землю
  rationale: Сохраняет конкретный образ насильственной смерти и пролитой крови; русское «прольётся» естественнее буквального «упадёт», не сводя образ к отвлечённому «жизнь».
- source_word: מִנֶּגֶד פְּנֵי יְהוָה
  choice: вдали от присутствия Яхве
  rationale: Передаёт пространственный смысл удаления от Божьего присутствия; оборот также может подразумевать изгнание из земли, связанной с присутствием Яхве, но перевод не делает этот подтекст явным.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: יָצָא ... לְבַקֵּשׁ
  choice: вышел искать
  rationale: Близко передаёт глаголы движения и поиска, не усиливая их до интерпретирующего «вышел выследить».
- source_word: פַּרְעֹשׁ אֶחָד
  choice: одну-единственную блоху
  rationale: Сохраняет самоуничижительную метафору Давида и подчёркнутое אֶחָד «одну».
- source_word: הַקֹּרֵא
  choice: куропатку
  rationale: Традиционное и контекстуально уместное обозначение птицы; точная зоологическая идентификация древнееврейского слова не вполне достоверна.
- source_word: כַּאֲשֶׁר יִרְדֹּף ... בֶּהָרִים
  choice: как охотятся ... в горах
  rationale: Естественная русская передача неопределённого субъекта сравнения и картины преследования птицы в горной местности.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл удаления от присутствия Яхве
  choice: вдали от присутствия Яхве
  alternative: вдали от лица Яхве
  rationale: Основной текст передаёт еврейскую идиому естественно по-русски, не утверждая сверх текста, идёт ли речь прежде всего о земле Израиля, святилище или Божьем присутствии в более широком смысле.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся ясным и устным по звучанию; метафоры крови, блохи и охоты сохранены без конфессионального толкования.
