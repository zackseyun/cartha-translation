  yaml_path: translation/ot/1_samuel/026/001.yaml
  text: Then the Ziphites came to Saul at Gibeah[a], saying, “Is not David hiding on the hill of Hachilah, which is before the wasteland?”
translation:
  language: ru
  text: 'Тогда жители Зифа пришли в Гиву к Саулу и сказали: «Не скрывается ли Давид на холме Хахила, напротив пустоши[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напротив Иешимона». Еврейское слово может обозначать пустынную, безлюдную местность или служить названием области — Иешимон.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Тогда … пришли
  rationale: Форма wayyiqtol продолжает повествование; «тогда» естественно передаёт последовательность событий, а «пришли» сохраняет основное значение глагола בוא.
- source_word: הַזִּפִים
  choice: зифеи
  rationale: Форма обозначает жителей Зифа; «зифеи» — краткое и естественное русское наименование жителей этой местности.
- source_word: הַגִּבְעָתָה
  choice: в Гиву
  rationale: Направительный ה указывает на движение к Гиве; русская конструкция «пришли к Саулу в Гиву» сохраняет это направление.
- source_word: לֵאמֹר
  choice: и сказали
  rationale: Инфинитив вводит прямую речь; в современном русском повествовании «и сказали» звучит естественнее буквального «говоря».
- source_word: הֲלוֹא
  choice: Не … ли
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ; русская конструкция «не … ли» сохраняет эту силу.
- source_word: מִסְתַּתֵּר
  choice: скрывается
  rationale: Причастие породы hitpael от סתר описывает продолжающееся действие — Давид держится в укрытии; «скрывается» передаёт возвратный оттенок и аспект.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: на холме Хахила
  rationale: גבעה обычно означает «холм», а предлог ב здесь естественно передаётся как «на».
- source_word: עַל פְּנֵי הַיְשִׁימֹן
  choice: напротив пустоши
  rationale: Географическое выражение עַל־פְּנֵי может означать «перед, напротив»; такой перевод не добавляет более узкое направление «к востоку». הַיְשִׁימֹן допускает понимание как нарицательного обозначения безлюдной пустынной местности.
