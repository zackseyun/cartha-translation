  text: חָלִ֤ילָ/ה לִּ/י֙ מֵֽ/יהוָ֔ה מִ/שְּׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֣יחַ יְהוָ֑ה וְ֠/עַתָּה קַח נָ֨א אֶֽת הַ/חֲנִ֜ית אֲשֶׁ֧ר מראשת/ו וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם וְ/נֵ֥לֲכָה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/011.yaml
  text: Far be it from me[a], by Yahweh, to stretch out my hand against Yahweh’s anointed. But now, please take the spear that is at his head, and the jar of water[c][b], and let us go.
translation:
  language: ru
  text: Да не допустит Яхве[a], чтобы я поднял руку на помазанника Яхве[b]! А теперь возьми, пожалуйста, копьё, которое у его изголовья, и кувшин с водой — и уйдём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «далеко от меня от Яхве». Это устойчивое выражение решительного отказа; предлог может передавать обращение к Яхве, апелляцию к Нему или мысль о том, что такой поступок недопустим перед Ним.'
    reason: lexical_alternative
  - marker: b
    text: То есть Саул как царь, помазанный Яхве. Еврейское слово связано со словом «Мессия», но здесь не является прямым обозначением Мессии.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיהוָה
  choice: Да не допущу я перед Яхве
  rationale: Сильная формула отвращения и решительного отказа. Русское «да не допущу я» естественно передаёт категоричность, а «перед Яхве» сохраняет возможную связь запрета с Божьим присутствием, не превращая оборот однозначно в клятву.
- source_word: מִשְּׁלֹחַ יָדִי
  choice: поднять руку
  rationale: Обычный русский идиом для враждебного действия или покушения; передаёт смысл еврейского «простереть/послать руку» без ненужной буквальности.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: на помазанника Яхве
  rationale: «Помазанник» сохраняет связь с מָשִׁיחַ, но в данном повествовании обозначает помазанного царя Саула, а не прямо мессианский титул.
- source_word: קַח נָא
  choice: возьми, пожалуйста
  rationale: Частица נָא смягчает повеление; современная русская формула сохраняет эту учтивую настойчивость.
- source_word: הַחֲנִית אֲשֶׁר מראשתו
  choice: копьё, которое у его изголовья
  rationale: Передаёт положение копья возле головы спящего Саула; «у изголовья» естественно и точно в данном контексте.
- source_word: צַפַּחַת הַמַּיִם
  choice: кувшин с водой
  rationale: Понятное современное обозначение небольшого сосуда, содержащего воду.
- source_word: וְנֵלֲכָה לָּנוּ
  choice: и уйдём
  rationale: Когортатив выражает совместное предложение покинуть место; «уйдём» лучше передаёт направленность прочь, чем нейтральное «пойдём».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет собственное имя в исходном тексте и соответствует предоставленному проектному решению.
- issue: Смысл מֵיהוָה в формуле חָלִילָה לִּי מֵיהוָה
  choice: перед Яхве
  alternative: Яхве свидетель / ради Яхве / да сохранит меня Яхве
  rationale: Синтаксис допускает оттенок обращения к Яхве, происхождения запрета от Него или оценки действия в Его присутствии. Основной текст сохраняет торжественную религиозную отнесённость, а примечание отмечает неоднозначность.
- issue: Передача מָשִׁיחַ применительно к Саулу
  choice: помазанник
  alternative: Мессия
  rationale: Здесь речь о царе, помазанном Яхве. «Помазанник» сохраняет богословски значимую лексику, не отождествляя Саула с позднейшим титулом Мессии.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной библейской речи. Категоричность первой фразы усилена восклицательным знаком; архаизирующие обороты сведены к минимуму. Все маркеры примечаний размещены непосредственно при соответствующих выражениях.
