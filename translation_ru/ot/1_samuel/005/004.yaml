  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּקֶר֮ מִֽ/מָּחֳרָת֒ וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וְ/רֹ֨אשׁ דָּג֜וֹן וּ/שְׁתֵּ֣י כַּפּ֣וֹת יָדָ֗י/ו כְּרֻתוֹת֙ אֶל הַ/מִּפְתָּ֔ן רַ֥ק דָּג֖וֹן נִשְׁאַ֥ר עָלָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/004.yaml
  text: When they rose early the next morning[a], behold, Dagon had fallen facedown on the ground before the ark of Yahweh, and the head of Dagon and both the palms of his hands were cut off on the threshold; only Dagon was left on him.
translation:
  language: ru
  text: 'На следующее утро они встали рано — и вот: Дагон лежал ничком на земле перед ковчегом Яхве, а голова Дагона и ладони обеих его рук были отсечены и лежали на пороге. Остался только Дагон[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «только Дагон остался на нём (или: у него)». Необычная еврейская фраза, вероятно, означает, что после отсечения головы и ладоней осталась лишь основная часть, или туловище, идола.'
    reason: Сохраняет необычную и неоднозначную форму еврейского заключительного выражения, объясняя вероятный смысл без внесения слова «туловище» в основной текст.
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר מִמָּחֳרָת
  choice: На следующее утро они встали рано
  rationale: Сочетание глагола «вставать рано» с двумя временными выражениями естественно передаётся по-русски как ранний подъём на следующее утро.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет повествовательный сигнал внезапного и поразительного зрелища, оставаясь естественным для современного литературного русского языка.
- source_word: נֹפֵל לְפָנָיו אַרְצָה
  choice: лежит ничком на земле
  rationale: Причастие описывает обнаруженное состояние идола; «ничком» естественно передаёт падение лицом к земле, а настоящее историческое усиливает наглядность сцены.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: перед ковчегом Яхве
  rationale: Прямо передаёт пространственное отношение и сохраняет личное имя יהוה в форме «Яхве».
- source_word: וְרֹאשׁ דָּגוֹן וּשְׁתֵּי כַּפּוֹת יָדָיו
  choice: голова Дагона и ладони обеих его рук
  rationale: «Ладони» сохраняет более точное значение כַּפּוֹת, а конструкция «обеих его рук» ясно передаёт двойственное число.
- source_word: כְּרֻתוֹת אֶל הַמִּפְתָּן
  choice: отсечены и лежат на пороге
  rationale: Пассивное причастие обозначает состояние отсечённых частей; их нахождение на пороге выражено в естественной русской форме. Глагол «лежат» эксплицирует подразумеваемое расположение.
- source_word: רַק דָּגוֹן נִשְׁאַר עָלָיו
  choice: От Дагона осталось только туловище
  rationale: Контекст после отсечения головы и ладоней указывает на оставшуюся основную часть статуи. Поскольку буквальная еврейская формулировка необычна и допускает обсуждение, её форма отмечена в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога; форма «Яхве» непосредственно отличает его от титула «Господь» без привнесения конфессионального толкования.
- issue: Смысл заключительной фразы о Дагоне
  choice: От Дагона осталось только туловище
  alternative: На нём остался только Дагон
  rationale: Контекст поддерживает понимание оставшейся части как туловища идола, однако необычная буквальная конструкция не позволяет представить это как бесспорное значение; неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Оборот «и вот» сохраняет драматическую внезапность; синтаксис сделан ясным для обычного читателя без устранения отмеченной в сноске неоднозначности.
