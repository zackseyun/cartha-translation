base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/003.yaml
  text: When the Ashdodites rose early the next day, behold, Dagon had fallen facedown on the ground before the ark of Yahweh. So they took Dagon and put him back in his place.
translation:
  language: ru
  text: На следующий день жители Ашдода встали рано утром — и вот, Дагон лежал ничком на земле перед ковчегом Яхве. Они взяли Дагона и вернули его на место.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: встали рано утром
  rationale: Порода hифиль глагола שׁכם означает ранний подъём. Выражение естественно для современного русского языка и сохраняет временной акцент.
- source_word: אַשְׁדּוֹדִים
  choice: жители Ашдода
  rationale: Форма обозначает жителей города Ашдода. Описательный вариант понятнее и естественнее по-русски, чем искусственно образованный этноним.
- source_word: מִמָּחֳרָת
  choice: на следующий день
  rationale: Обычное временное выражение со значением следующего дня.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет повествовательный сигнал внезапного, поразительного зрелища без архаичного оттенка.
- source_word: נֹפֵל
  choice: лежит
  rationale: Причастие описывает обнаруженное состояние Дагона. Настоящее повествовательное «лежит» непосредственно передаёт открывшуюся жителям картину; результат падения ясен из контекста и позы.
- source_word: לְפָנָיו אַרְצָה
  choice: ничком на земле
  rationale: Краткое и наглядное русское выражение точно передаёт положение лицом к земле и унизительную поверженность идола.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: перед ковчегом Яхве
  rationale: לִפְנֵי здесь имеет пространственное значение; «перед» передаёт его прямо и естественно.
- source_word: וַיִּקְחוּ אֶת־דָּגוֹן
  choice: они взяли Дагона
  rationale: Прямое соответствие обычному значению לקח; конкретный способ поднятия текста не уточняет.
- source_word: וַיָּשִׁבוּ אֹתוֹ לִמְקוֹמוֹ
  choice: вернули его на место
  rationale: Hифиль глагола שׁוב означает побудить вернуться или возвратить. Формулировка не добавляет отсутствующей в тексте детали о постаменте и сохраняет мужской род местоимения.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, тетраграмматон. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Поза Дагона перед ковчегом
  choice: лежит ничком на земле перед ковчегом
  alternative: пал ниц перед ковчегом
  rationale: Выбранная формулировка передаёт физическое положение, не превращая его явно в сознательный акт поклонения; вместе с тем образ вынужденного унижения перед Яхве сохраняется.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Тире после обстоятельства помогает естественно передать резкий переход וְהִנֵּה к неожиданному зрелищу. Название города передано как «Ашдод» по еврейской форме, а не традиционным греко-славянским «Азот».
