base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/008.yaml
  text: So they sent and gathered all the lords of the Philistines to themselves[a], and said, “What shall we do with the ark of the God of Israel?” And they said, “Let the ark of the God of Israel be brought around to Gath.” So they brought the ark of the God of Israel around.
translation:
  language: ru
  text: 'Тогда они послали за всеми правителями филистимлян и собрали их у себя. Они спросили: «Что нам делать с ковчегом Бога Израиля?» Те ответили: «Пусть ковчег Бога Израиля перенесут в Гат[a]». И они перенесли ковчег Бога Израиля.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть ковчег Бога Израиля отправится в Гат». Глагол подчёркивает перемещение ковчега, не уточняя способ его перевозки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיַּאַסְפוּ
  choice: они послали за… и собрали
  rationale: 'Сочетание глаголов описывает созыв правителей: сначала за ними послали, затем собрали. Такая передача ясна и естественна по-русски.'
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: правителями филистимлян
  rationale: Слово סֶרֶן обозначает особый титул правителей филистимских городов. «Правители» точно передаёт функцию, не создавая ассоциаций с наследственными князьями или феодальными владыками.
- source_word: אֲלֵיהֶם
  choice: у себя
  rationale: Выражение указывает, что правителей собрали к тем, кто их созывал, то есть в их месте или присутствии.
- source_word: מַה נַּעֲשֶׂה לַאֲרוֹן
  choice: Что нам делать с ковчегом
  rationale: Форма глагола выражает совместное обсуждение, а предлог ל в данном вопросе естественно передаётся русским «с».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямая передача еврейского сочетания в сопряжённой конструкции.
- source_word: גַּת
  choice: Гат
  rationale: Традиционная русская передача названия филистимского города.
- source_word: יִסֹּב / וַיַּסֵּבּוּ
  choice: перенесут / перенесли
  rationale: Корень סבב обозначает поворот или перемещение по кругу/дальше, а каузативная форма — побуждение к такому перемещению. В контексте ковчег передают из одного города в другой; «перенести» естественно передаёт действие, не уточняя способ транспортировки.
