  text: וַ/יְהִ֞י אַחֲרֵ֣י הֵסַ֣בּוּ אֹת֗/וֹ וַ/תְּהִ֨י יַד יְהוָ֤ה בָּ/עִיר֙ מְהוּמָה֙ גְּדוֹלָ֣ה מְאֹ֔ד וַ/יַּךְ֙ אֶת אַנְשֵׁ֣י הָ/עִ֔יר מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּשָּׂתְר֥וּ לָ/הֶ֖ם עפלים׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/009.yaml
  text: And after they had moved it around[a], the hand of Yahweh was against the city, causing a very great panic; and he struck the men of the city, from small to great, and tumors broke out on them.
translation:
  language: ru
  text: И после того как они перенесли его, рука Яхве была против этого города, вызвав в нём чрезвычайно сильную панику. Он поразил мужчин города, от малого до великого, и у них появились опухоли[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и они покрылись опухолями». Редкое еврейское выражение описывает появление или высыпание телесных вздутий; точный медицинский диагноз не указан.'
    reason: Лексическая неоднозначность редкого глагольно-именного сочетания.
lexical_decisions:
- source_word: הֵסַבּוּ אֹתוֹ
  choice: они перенесли его
  rationale: Порода hифиль глагола סבב с местоименным дополнением здесь обозначает перемещение ковчега в другое место. «Перенесли его» естественно по-русски и не добавляет неуказанного направления.
- source_word: יַד יְהוָה
  choice: рука Яхве
  rationale: Сохранена еврейская метафора действенной силы и суда Бога, а не заменена отвлечённым описанием действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное божественное имя, прямо стоящее в еврейском тексте.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: чрезвычайно сильная паника
  rationale: מְהוּמָה может обозначать смятение, переполох или панику; в контексте Божьего поражения города «паника» наиболее ясно передаёт вызванный ужас.
- source_word: וַיַּךְ
  choice: Он поразил
  rationale: Единственное число указывает на Яхве как действующее лицо; «поразил» сохраняет силу глагола נכה и подходит современному литературному регистру.
- source_word: אַנְשֵׁי הָעִיר
  choice: мужчин города
  rationale: Еврейское выражение конкретно называет мужчин, а не жителей вообще, поэтому родовое значение не расширено.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: от малого до великого
  rationale: Близкая к форме оригинала идиома охватывает всех затронутых, оставляя открытым, идёт ли речь о возрасте, положении или значимости.
- source_word: וַיִּשָּׂתְרוּ לָהֶם עפלים
  choice: у них появились опухоли
  rationale: Редкое сочетание описывает появление или высыпание телесных вздутий. «Опухоли» ясно передаёт общий смысл, не навязывая более узкий медицинский диагноз.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит тетраграмматон — собственное имя Бога; транслитерация сохраняет это различие.
- issue: Образ руки Яхве как орудия суда
  choice: рука Яхве была против этого города
  alternative: Яхве обрушил кару на город
  rationale: Сохранение образа «руки» передаёт конкретную метафору оригинала и не ослабляет прямую связь бедствия с действием Яхве.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены метафора «рука Яхве» и идиома «от малого до великого»; архаизмы и чрезмерно конкретный медицинский термин исключены.
