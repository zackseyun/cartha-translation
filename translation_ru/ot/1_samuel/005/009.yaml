  source_fidelity: 'Перевод точно передаёт основные элементы еврейского текста: перемещение ковчега, направленную против города «руку Яхве», чрезвычайно сильную панику, поражение мужчин города во всём диапазоне «от малого до великого» и появление опухолей. Причинная связь между рукой Яхве, паникой и поражением сохранена. Медицинская природа affalim не конкретизируется сверх данных текста.'
