base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/006.yaml
  text: And the hand of Yahweh was heavy against the people of Ashdod[a], and he devastated them and struck them with tumors, Ashdod and its territory.
translation:
  language: ru
  text: 'И рука Яхве тяжело легла на жителей Аздота: Он опустошил их и поразил их опухолями[a] — в Аздоте и его области.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вздутиями»; традиционно это слово иногда понимают более конкретно — как геморрой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד יַד יְהוָה
  choice: И тяжела была рука Яхве
  rationale: Сохранены конкретный образ «руки» и метафора тяжести, выражающие могущественное и карающее действие Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом.
- source_word: אֶל הָאַשְׁדּוֹדִים
  choice: над жителями Аздота
  rationale: Форма обозначает жителей города; предлог «над» естественно сочетается по-русски с идиомой о тяжёлой руке и передаёт направленное против них действие.
- source_word: וַיְשִׁמֵּם
  choice: Он опустошил их
  rationale: Глагол передаёт причинение разорения и гибельного опустошения; выбран сильный, но не чрезмерно конкретный русский эквивалент.
- source_word: וַיַּךְ אֹתָם
  choice: поразил
  rationale: Обычный библейский глагол суда и кары; «поразил» естественно вводит указание на телесное бедствие.
- source_word: בָּעֳפָלִים
  choice: опухолями
  rationale: Широкая и осторожная передача телесных наростов или вздутий без неоправданного уточнения их медицинской природы.
- source_word: אֶת אַשְׁדּוֹד וְאֶת גְּבוּלֶיהָ
  choice: Аздот и его окрестности
  rationale: 'Фраза уточняет территориальный охват бедствия: сам город и подвластную или прилегающую к нему область. «Окрестности» звучит естественно и не сводит значение к линии границы.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Сохраняется личное имя Бога Израиля, присутствующее в еврейском тексте, без замены титулом.
- issue: Характер поражения בָּעֳפָלִים
  choice: опухолями
  alternative: вздутиями; геморроем
  rationale: Еврейское слово допускает общее обозначение опухолей или вздутий; более узкое традиционное понимание не вносится в основной текст и отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «тяжела была рука» сохраняет образность оригинала, оставаясь понятной; архаизмы и излишне медицинская конкретизация исключены.
