    text: 'Или: «вздутиями»; традиционно это слово иногда понимают более конкретно — как геморрой.'
    reason: lexical_alternative
  revision_rationale: Редакция сохраняет метафору «руки» и «тяжести», личное имя Яхве, два глагола бедствия и осторожное обозначение поражения. Повтор «их» соответствует явному еврейскому дополнению при «поразил», а оборот «в Аздоте и его области» передаёт заключительное территориальное уточнение, не превращая топонимы в медицински поражаемые предметы.
