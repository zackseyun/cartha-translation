- from: 'И тяжела была рука Яхве над жителями Аздота: Он опустошил их и поразил опухолями[a] Аздот и его окрестности.'
  to: 'И рука Яхве тяжело легла на жителей Аздота: Он опустошил их и поразил их опухолями[a] — в Аздоте и его области.'
  rationale: Редакция сохраняет метафору «руки» и «тяжести», личное имя Яхве, два глагола бедствия и осторожное обозначение поражения. Повтор «их» соответствует явному еврейскому дополнению при «поразил», а оборот «в Аздоте и его области» передаёт заключительное территориальное уточнение, не превращая топонимы в медицински поражаемые предметы.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:40:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: тяжёлая рука Яхве направлена против жителей Аздота; следуют разорение и телесное поражение. Однако в нынешней русской синтаксической связи «поразил опухолями Аздот и его окрестности» прямым объектом глагола становятся город и окрестности, тогда как в еврейском тексте непосредственно сказано, что поражены «они», то есть жители. Заключительное «Аздот и его область» уточняет географический охват бедствия и требует более ясного оформления.'
  naturalness: «И тяжела была рука» допустимо, но «тяжело легла рука» естественнее в современном литературном русском и сохраняет образ оригинала. Предложенная редакция устраняет двусмысленную связь дополнения «опухолями» с топонимами.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Опухоли» — осторожный общий эквивалент עֳפָלִים; сноска удачно сохраняет варианты «вздутия» и традиционное более узкое понимание. «Область» точнее, чем «окрестности», передаёт גְּבוּלֶיהָ как зависимую от города территорию, не только ближайшие места вокруг него.
  issues:
  - severity: medium
    issue: Неясная синтаксическая роль «Аздот и его окрестности».
    rationale: В исходной фразе «Он опустошил их и поразил опухолями Аздот и его окрестности» естественное русское прочтение делает Аздот и окрестности объектом «поразил», а «их» относится лишь к «опустошил». Еврейский текст сначала прямо указывает объект «их» при «поразил», а затем называет Аздот и его область как охват действия. Повтор местоимения и ввод «в» делают это соотношение ясным без изменения смысла.
  - severity: low
    issue: «Окрестности» несколько сужает территориальное значение.
    rationale: גְּבוּלֶיהָ обозначает границы, пределы или зависимую территорию города; «его область» сохраняет этот административно-территориальный охват лучше, чем только прилегающие окрестности.
  revised_text: 'И рука Яхве тяжело легла на жителей Аздота: Он опустошил их и поразил их опухолями[a] — в Аздоте и его области.'
  revised_footnotes:
