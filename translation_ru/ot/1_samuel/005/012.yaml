  text: А мужчины, которые не умерли, были поражены опухолями[a], и вопль города поднялся до небес.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вздутиями». Еврейское слово обозначает телесную опухоль или вздутие; в традиционных переводах иногда уточняется: «геморроем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים אֲשֶׁר לֹא מֵתוּ
  choice: А те, кто не умер
  rationale: Существительное אֲנָשִׁים буквально означает «мужчины, люди», однако по-русски «те» естественно обозначает оставшихся жителей в противопоставлении умершим и не добавляет уточнения «горожане», которого нет в тексте.
- source_word: הֻכּוּ
  choice: были поражены
  rationale: Пассивная форма глагола נכה передаёт постигшее людей бедствие; «были поражены» сохраняет библейскую образность и естественно сочетается с обозначением болезни.
- source_word: בָעֳפָלִים
  choice: опухолями
  rationale: Редкое слово обозначает телесные опухоли или вздутия, но точный диагноз неясен; общий медицинский термин не сужает значение до геморроя.
- source_word: וַתַּעַל
  choice: поднялся
  rationale: Глагол עלה выражает движение вверх; этот образ сохранён в естественной русской формулировке.
- source_word: שַׁוְעַת הָעִיר
  choice: вопль города
  rationale: שַׁוְעָה — громкий крик бедствия или о помощи; конструкция буквально представляет город как единое целое, издающее вопль.
- source_word: הַשָּׁמָיִם
  choice: до небес
  rationale: Формально множественное שָׁמַיִם в данном образном выражении естественно передаётся русским «небеса»; предлог «до» ясно выражает достигнутый предел движения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Вопль» сохраняет силу שַׁוְעָה, а «до небес» — пространственный образ оригинала. Маркер сноски помещён непосредственно после спорного термина.
