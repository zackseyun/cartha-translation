base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/011.yaml
  text: So they sent and gathered all the lords of the Philistines[a], and they said, “Send away the ark of the God of Israel, and let it return to its place, so that it may not kill us and our people.” For there was a deadly panic throughout the whole city[b]; the hand of God was very heavy there.
translation:
  language: ru
  text: 'Тогда они послали за всеми правителями филистимлян и собрали их. Они сказали: «Отошлите ковчег Бога Израиля; пусть он вернётся на своё место, чтобы не умертвить меня и мой народ». Ведь весь город охватила смертельная паника[a]; рука Бога там была чрезвычайно тяжела[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «смертный ужас», «смертоносное смятение» или «смертельная суматоха».'
    reason: lexical_alternative
  - marker: b
    text: «Рука Бога» — библейский образ действенной Божьей силы; здесь он указывает на суровое Божье поражение.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: правителей
  rationale: Термин обозначает правителей пяти филистимских городов; «правители» ясно передаёт их политический статус в современном русском языке.
- source_word: שַׁלְּחוּ
  choice: Отошлите
  rationale: Повелительная форма требует удалить ковчег из города; «отошлите» естественно передаёт это значение.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: ковчег Бога Израиля
  rationale: Сохраняет генитивную конструкцию и связь ковчега с Богом Израиля.
- source_word: וְיָשֹׁב לִמְקֹמוֹ
  choice: пусть он вернётся на своё место
  rationale: Передаёт побудительное значение формы после повеления и сохраняет указание на надлежащее место ковчега.
- source_word: וְלֹא יָמִית אֹתִי וְאֶת עַמִּי
  choice: и не умертвит меня и мой народ
  rationale: Сохраняет каузативное значение глагола מות и примечательное единственное число местоимений в масоретском тексте.
- source_word: מְהוּמַת מָוֶת
  choice: смертельная паника
  rationale: Выражение сочетает ужас и смертоносное бедствие; этот вариант естественен по-русски и сохраняет оба оттенка.
- source_word: בְּכָל הָעִיר
  choice: весь город охватила
  rationale: Естественно передаёт распространение бедствия по всему городу.
- source_word: כָּבְדָה מְאֹד יַד הָאֱלֹהִים
  choice: рука Бога тяжело тяготела
  rationale: Сохраняет библейскую метафору «руки» как деятельной силы Бога и передаёт интенсивность כָּבְדָה מְאֹד.
- source_word: הָאֱלֹהִים
  choice: Бога
  rationale: В контексте речь идёт о ранее названном Боге Израиля, поэтому используется имя нарицательное с прописной буквы.
theological_decisions:
- issue: Сохранять ли антропоморфную метафору «рука Бога»
  choice: 'Сохранить: «рука Бога тяжело тяготела там»'
  alternative: «Бог жестоко поразил то место»
  rationale: В еврейском тексте прямо употреблена «рука» — важная библейская метафора Божьего действия и суда; её истолковывающая замена обеднила бы межтекстовые связи.
- issue: Число местоимений в прямой речи
  choice: 'Сохранить единственное число: «меня и мой народ»'
  alternative: «нас и наш народ»
  rationale: Масоретский текст содержит формы единственного числа, вероятно передающие речь представителя города; контекстуальное сглаживание до множественного числа устранило бы подлинную особенность текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан ясным для широкого читателя; сохранены метафора «рука Бога» и единственное число в прямой речи.
