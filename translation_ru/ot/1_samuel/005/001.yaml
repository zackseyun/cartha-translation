  text: Филистимляне взяли ковчег Божий и принесли его из Эвен-Эзера в Ашдод.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Филистимляне
  rationale: 'Название народа передано в принятой русской библейской форме. Начальный союз ו не выражен отдельно: здесь он связывает повествование, а в русском начале нового эпизода его опущение звучит естественно и не меняет смысла.'
- source_word: לָקְחוּ
  choice: захватили
  rationale: Форма Qal перфекта от לקח означает «взяли». В контексте военной добычи «захватили» естественно передаёт действие; русский совершенный вид также позволяет понять его как предшествующее последующему переносу без искусственного плюсквамперфекта.
- source_word: אֵת
  choice: '[показатель прямого дополнения не переводится]'
  rationale: У еврейского показателя определённого прямого дополнения нет отдельного русского соответствия.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ковчег Божий
  rationale: Сохраняется конструкция принадлежности и традиционное, понятное русское обозначение священного ковчега.
- source_word: וַיְבִאֻהוּ
  choice: и перенесли его
  rationale: Hiphil от בוא с местоименным суффиксом означает «и принесли/доставили его». «Перенесли» естественно описывает перемещение ковчега из одного места в другое, не добавляя способ перевозки.
- source_word: מֵאֶבֶן הָעֵזֶר
  choice: из Эвен-Эзера
  rationale: Предлог מן передан как «из», поскольку речь идёт об отправной точке — населённом месте. Топоним транслитерирован с сохранением его составной формы.
- source_word: אַשְׁדּוֹדָה
  choice: в Ашдод
  rationale: Направительный ה указывает движение к Ашдоду; по-русски это естественно выражается предлогом «в» с винительным падежом.
