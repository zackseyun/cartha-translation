base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/002.yaml
  text: So the Philistines took the ark of God and brought it into the house of Dagon[a], and set it beside Dagon.
translation:
  language: ru
  text: Филистимляне взяли ковчег Божий, принесли его в дом Дагона[a] и поставили рядом с Дагоном.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в храм Дагона». Буквально: «в дом Дагона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: взяли
  rationale: Обычное значение לקח в повествовательной последовательности; перевод не добавляет оттенка насильственного захвата, прямо не выраженного глаголом.
- source_word: פְלִשְׁתִּים
  choice: филистимляне
  rationale: Устоявшееся русское название этого народа.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ковчег Божий
  rationale: «Ковчег» — традиционный и понятный термин для священного ларя; הָאֱלֹהִים означает здесь Бога Израиля, а имя יהוה в стихе не употреблено.
- source_word: וַיָּבִיאוּ אֹתוֹ
  choice: принесли его
  rationale: Каузативная форма בוא обычно означает «принести»; местоимение относится к ковчегу. Русский мужской род обусловлен словом «ковчег».
- source_word: בֵּית דָּגוֹן
  choice: дом Дагона
  rationale: Сохраняет буквальный образ еврейского בית; по контексту речь идёт о храме или святилище Дагона, что отмечено в сноске.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: поставили
  rationale: Глагол יצג в породе hифиль означает поставить или поместить; «поставили» естественно описывает размещение ковчега.
- source_word: אֵצֶל דָּגוֹן
  choice: рядом с Дагоном
  rationale: אֵצֶל выражает близкое пространственное расположение. Вероятно, подразумевается изваяние Дагона, однако исходный текст говорит просто «Дагон», поэтому уточнение не внесено.
theological_decisions:
- issue: Божественное обозначение в выражении «ковчег Божий»
  choice: Божий
  alternative: Господень
  rationale: В еврейском тексте стоит הָאֱלֹהִים, а не имя יהוה; перевод сохраняет употреблённое в данном стихе обозначение и не гармонизирует его с другими местами.
- issue: Референт имени «Дагон» после глагола «поставили»
  choice: с Дагоном
  alternative: со статуей Дагона
  rationale: В храмовом контексте, вероятно, имеется в виду культовое изображение, но еврейский текст не называет его статуей. Перевод сохраняет лаконичность и возможную персонификацию оригинала.
translation_notes:
  register: Современный литературный русский язык с привычной библейской терминологией. Синтаксис простой и повествовательный; повтор имени «Дагон» сохранён вслед за оригиналом.
