  text: וַ/יִּרְא֥וּ אַנְשֵֽׁי אַשְׁדּ֖וֹד כִּֽי כֵ֑ן וְ/אָמְר֗וּ לֹֽא יֵשֵׁ֞ב אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ עִמָּ֔/נוּ כִּֽי קָשְׁתָ֤ה יָד/וֹ֙ עָלֵ֔י/נוּ וְ/עַ֖ל דָּג֥וֹן אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/007.yaml
  text: When the men of Ashdod saw that it was so[a], they said, “The ark of the God of Israel must not remain with us[b], because his hand is heavy against us and against Dagon our god.”
translation:
  language: ru
  text: 'Когда люди Азота увидели, что дело обстоит так, они сказали: «Пусть ковчег Бога Израиля не остаётся у нас[a], ибо Его рука тяжело легла[b] на нас и на Дагона, нашего бога».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не пребывает у нас». Еврейский глагол может означать «сидеть», «жить», «пребывать» или «оставаться».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Его рука была тяжела против нас» — образ сурового воздействия или суда.'
    reason: idiom
lexical_decisions:
- source_word: וַיִּרְאוּ אַנְשֵׁי אַשְׁדּוֹד
  choice: Когда жители Азота увидели
  rationale: Последовательная форма глагола продолжает повествование и здесь естественно передаётся временным придаточным. אַנְשֵׁי буквально означает «мужи», но в данном контексте обозначает жителей или представителей города; «жители» звучит естественно и не утверждает без достаточных оснований, что речь только о мужчинах или правителях.
- source_word: כִּי כֵן
  choice: что дело обстоит так
  rationale: Устойчивое выражение отсылает к происходящему, описанному ранее; русский оборот сохраняет эту отсылку и звучит естественно.
- source_word: לֹא יֵשֵׁב
  choice: Пусть ... не остаётся
  rationale: יָשַׁב имеет значения «сидеть, жить, пребывать, оставаться». При ковчеге как подлежащем «не остаётся» точно передаёт требование прекратить его пребывание в городе, а конструкция с «пусть» сохраняет волевое значение высказывания.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: ковчег Бога Израиля
  rationale: Близкая к форме оригинала передача сохраняет противопоставление между Богом Израиля и «Дагоном, нашим богом».
- source_word: עִמָּנוּ
  choice: у нас
  rationale: В русском контексте пребывания предмета «у нас» естественнее буквального «с нами» и передаёт нахождение ковчега среди жителей Азота.
- source_word: קָשְׁתָה יָדוֹ
  choice: Его рука тяжело поразила
  rationale: Буквально выражение означает, что Его рука «стала тяжела» или «была тяжела». Русская формулировка сохраняет образ руки, но ясно передаёт пагубное действие; сноска сообщает буквальную форму идиомы.
- source_word: עָלֵינוּ וְעַל דָּגוֹן אֱלֹהֵינוּ
  choice: и нас, и Дагона, нашего бога
  rationale: Повторная конструкция עַל ... וְעַל охватывает обе цели Божьего действия. «Нашего бога» сохраняет точку зрения говорящих, не добавляя авторской оценки.
theological_decisions:
- issue: Антропоморфный образ Божьей руки в קָשְׁתָה יָדוֹ
  choice: 'сохранить образ: «Его рука тяжело поразила»'
  alternative: «Его рука тяжела против нас»; «Он сурово покарал нас»
  rationale: Выбор сохраняет библейский образ руки как выражение действенной силы Бога и одновременно остаётся ясным на современном русском; буквальная идиома приведена в сноске.
- issue: Название Дагона «нашим богом»
  choice: передать слова филистимлян без поясняющей оговорки в основном тексте
  alternative: «нашего идола»; «наше божество»
  rationale: Оригинал передаёт взгляд говорящих. Замена на «идола» внесла бы в их речь оценку, которой в этой фразе нет.
translation_notes:
  register: Современный литературный русский с ясным повествовательным синтаксисом и умеренно возвышенной библейской лексикой. Топоним передан в традиционной русской библейской форме «Азот». Все сноски имеют соответствующие маркеры в основном тексте.
