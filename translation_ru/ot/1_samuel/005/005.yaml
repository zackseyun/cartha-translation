base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/005.yaml
  text: Therefore, to this day the priests of Dagon and all who enter Dagon's temple in Ashdod do not step on Dagon's threshold[a][b].
translation:
  language: ru
  text: Поэтому до сего дня священники Дагона и все, кто входит в храм Дагона[b] в Ашдоде, не ступают[a] на порог Дагона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «не попирают порог Дагона».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в дом Дагона»; здесь имеется в виду языческий храм.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим событием естественным современным русским союзным наречием.
- source_word: לֹא יִדְרְכוּ
  choice: не ступают
  rationale: Глагол דרך означает «ступать, попирать». Настоящее время естественно описывает обычай, сохраняющийся «до сего дня».
- source_word: כֹהֲנֵי דָגוֹן
  choice: священники Дагона
  rationale: Прямо и ясно передаёт древнееврейскую конструкцию принадлежности и культовую роль.
- source_word: וְכָל הַבָּאִים בֵּית דָּגוֹן
  choice: и все, кто входит в храм Дагона
  rationale: בוא с בית в данном контексте обозначает вход в культовое здание; «храм» яснее для современного читателя, чем буквальное «дом».
- source_word: עַל מִפְתַּן דָּגוֹן
  choice: на порог Дагона
  rationale: מִפְתָּן точно означает «порог»; повтор имени Дагона сохраняет заметную формулировку оригинала и возможную связь порога с самим божеством.
- source_word: בְּאַשְׁדּוֹד
  choice: в Ашдоде
  rationale: Естественная русская передача указания места.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивое, dignified выражение, передающее продолжение обычая до времени повествователя.
