base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/010.yaml
  text: So they sent the ark of God to Ekron. But when the ark of God came to Ekron, the Ekronites cried out, saying, “They have brought around to me the ark of the God of Israel, to kill me and my people!”
translation:
  language: ru
  text: 'И послали они ковчег Божий в Экрон. Но когда ковчег Божий прибыл в Экрон, экронитяне закричали: «Они принесли ко мне ковчег Бога Израиля, чтобы погубить меня и мой народ!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: И послали они
  rationale: Передаёт последовательность повествования и значение глагола שלח; порядок слов сохраняет умеренно библейскую торжественность без архаизма.
- source_word: עֶקְרוֹן
  choice: Экрон
  rationale: Устоявшаяся русская форма библейского топонима.
- source_word: וַיִּזְעֲקוּ
  choice: закричали
  rationale: Глагол обозначает громкий, тревожный возглас; по контексту естественнее «закричали», чем более нейтральное «воззвали».
- source_word: הֵסַבּוּ אֵלַי
  choice: принесли к нам
  rationale: הֵסַבּוּ буквально указывает на перемещение или направление ковчега сюда; «принесли» естественно по-русски. Масоретский текст имеет единственное число «ко мне», но коллективный говорящий город по смыслу соответствует русскому «к нам»; расхождение отмечено сноской.
- source_word: לַהֲמִיתֵנִי וְאֶת־עַמִּי
  choice: чтобы умертвить нас и наш народ
  rationale: 'Инфинитив цели передан конструкцией «чтобы». В еврейском стоят формы единственного числа: «меня и мой народ»; в прямой речи множества жителей по-русски естественно множественное число, при сохранении исходной формы в сноске.'
theological_decisions:
- issue: Наименование ковчега и Бога Израиля
  choice: «ковчег Божий» и «ковчег Бога Израиля»
  alternative: «Божий ковчег» / «ковчег Израилева Бога»
  rationale: 'Сохраняется различие двух еврейских выражений: אֲרוֹן הָאֱלֹהִים и אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל, без добавления конфессиональной интерпретации.'
- issue: Единственное число в коллективной речи экронитян
  choice: В основном тексте множественное число с текстологической сноской
  alternative: 'Буквально: «ко мне… умертвить меня и мой народ»'
  rationale: Еврейский текст неожиданно переходит к единственному числу, вероятно представляя Экрон как коллективное лицо. Русское множественное число делает реплику жителей естественной, а сноска сохраняет подлинную грамматическую напряжённость и возможную персонификацию города.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным ритмом. Архаизмы вроде «возопили» и «дабы» исключены; повтор «ковчег Божий» сохранён как значимый элемент исходного текста.
