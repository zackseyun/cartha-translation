base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/015.yaml
  text: So all the people went to Gilgal[a], and there they made Saul king before Yahweh at Gilgal. There they sacrificed peace offerings before Yahweh, and there Saul and all the men of Israel rejoiced greatly.
translation:
  language: ru
  text: Весь народ пошёл в Галгал, и там, в Галгале, они поставили Саула царём перед Яхве. Там они принесли перед Яхве мирные жертвы[a], и Саул и все израильтяне очень радовались.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения»; также: «жертвы благополучия». Еврейский термин обозначает категорию жертв, связанную с благополучием, целостностью и совместным праздничным пиром.'
    reason: Передаёт альтернативные значения שְׁלָמִים и поясняет культурно-ритуальную категорию, не навязывая узкого толкования.
lexical_decisions:
- source_word: וַיֵּלְכוּ כָל הָעָם
  choice: И пошёл весь народ
  rationale: Еврейский глагол стоит во множественном числе, однако в современном русском собирательное «народ» естественно требует единственного числа; значение всеобщего движения сохранено словом «весь».
- source_word: הַגִּלְגָּל / בַּגִּלְגָּל
  choice: Галгал / в Галгале
  rationale: Топоним передан принятой русской библейской транслитерацией; повторение названия места сохранено вслед за еврейским текстом.
- source_word: וַיַּמְלִכוּ ... אֶת שָׁאוּל
  choice: они поставили Саула царём
  rationale: Каузативная форма от מלך означает сделать или поставить царём. Перевод не добавляет помазания или провозглашения, которых данный текст прямо не называет.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Выражение передаёт действие в присутствии Бога, имеющее публичный и богослужебный характер; краткая форма «пред» соответствует достоинству повествования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: וַיִּזְבְּחוּ ... זְבָחִים שְׁלָמִים
  choice: они принесли ... мирные жертвы
  rationale: По-русски естественнее говорить «принести жертвы», чем буквально «заколоть жертвы»; традиционное «мирные жертвы» сохраняет связь термина שְׁלָמִים с миром, целостностью и совместной трапезой.
- source_word: וַיִּשְׂמַח ... עַד מְאֹד
  choice: весьма радовались
  rationale: Русское множественное число согласовано с составным подлежащим «Саул и все мужчины Израиля», а наречие «весьма» передаёт сильную степень радости.
- source_word: וְכָל אַנְשֵׁי יִשְׂרָאֵל
  choice: и все мужчины Израиля
  rationale: Существительное אַנְשֵׁי буквально обозначает мужчин; перевод сохраняет явно мужское выражение и не заменяет его нейтральным «израильтяне».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст дважды употребляет тетраграмматон как личное имя. Транслитерация «Яхве» сохраняет это отличие от титула.
- issue: Значение воцарения Саула
  choice: поставили Саула царём
  alternative: провозгласили Саула царём; помазали Саула на царство
  rationale: Форма וַיַּמְלִכוּ выражает наделение царской властью, но не уточняет обряд. Поэтому перевод не вводит отсутствующее здесь помазание и не сужает действие до одного провозглашения.
- issue: Гендерная определённость אַנְשֵׁי יִשְׂרָאֵל
  choice: все мужчины Израиля
  alternative: все израильтяне; весь народ Израиля
  rationale: Еврейское выражение лексически мужское. Его буквальная особенность сохранена, хотя в более широком контексте группа могла представлять Израиль как народ.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Союзное повествование еврейского текста сохранено, но синтаксис сделан естественным для русского. Формы «пред» и «весьма» выбраны как понятные и достойные, без излишней архаизации.
