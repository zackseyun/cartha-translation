  yaml_path: translation/ot/1_samuel/011/005.yaml
  text: And behold[a], Saul was coming from the field behind the cattle, and Saul said, “What is wrong with the people[b], that they are weeping?” And they told him the words of the men of Jabesh.
translation:
  language: ru
  text: 'И вот Саул шёл с поля вслед за скотом[a]. Саул спросил: «Что случилось с народом? Почему они плачут?» Они рассказали ему слова людей Иависа[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «следуя за волами». Еврейское выражение может обозначать, что Саул шёл с поля вслед за крупным рогатым скотом.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «весть от людей Иависа». Буквально: «слова людей Иависа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет функцию смены сцены и повествовательную живость הִנֵּה; это естественный и понятный оборот в современном русском.
- source_word: בָּא
  choice: шёл
  rationale: Причастная форма изображает продолжающееся действие. «Шёл» естественно передаёт этот фоновый процесс, не добавляя явно не выраженной идеи возвращения.
- source_word: אַחֲרֵי הַבָּקָר
  choice: позади скота
  rationale: Передаёт пространственное значение אַחֲרֵי и широкое значение בָּקָר — крупный рогатый скот, а не обязательно только волы.
- source_word: מִן הַשָּׂדֶה
  choice: с поля
  rationale: Точно и естественно обозначает исходную точку движения Саула.
- source_word: מַה לָעָם כִּי יִבְכּוּ
  choice: Что случилось с народом? Почему они плачут?
  rationale: Еврейский идиоматический вопрос естественно разделён в русском на два тесно связанных вопроса; сохраняется продолжающийся характер плача.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: Ему передали
  rationale: В контексте речь идёт о сообщении Саулу услышанных слов; «передали» звучит естественно и сохраняет значение сообщения.
- source_word: דִּבְרֵי אַנְשֵׁי יָבֵישׁ
  choice: слова жителей Иависа
  rationale: «Слова» формально сохраняет דִּבְרֵי, а «жители Иависа» естественно передаёт конструкцию אַנְשֵׁי יָבֵישׁ в данном контексте, не прибегая к архаичному «мужи».
