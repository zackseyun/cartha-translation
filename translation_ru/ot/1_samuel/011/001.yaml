  source_fidelity: 'Основной текст в целом точно передаёт последовательность действий, военный смысл «расположился лагерем против», мужчин Явеша и обещание служить Нахашу. «Союз» допустим для בְּרִית в данном политическом контексте. Однако примечание передаёт буквальный идиоматический глагол неточно и неясно: «разруби союз» в русском скорее означает уничтожить союз, а не еврейское ритуально-идиоматическое «рассечь/заключить завет».'
