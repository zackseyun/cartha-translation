base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/001.yaml
  text: Then Nahash the Ammonite went up and encamped against Jabesh-gilead. And all the men of Jabesh said to Nahash[a], “Make a covenant with us, and we will serve you.”
translation:
  language: ru
  text: 'И пошёл аммонитянин Нахаш и расположился лагерем против Явеша Галаадского. А все мужчины Явеша сказали Нахашу: «Заключи с нами союз[a], и мы будем служить тебе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «рассеки для нас завет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: пошёл
  rationale: В повествовательном военном контексте עלה обозначает движение к месту, нередко с оттенком подъёма или выступления. «Пошёл» естественно по-русски и не уточняет направление сверх исходного текста.
- source_word: נָחָשׁ הָעַמּוֹנִי
  choice: аммонитянин Нахаш
  rationale: Этноним передан обычным русским существительным, личное имя — традиционной транслитерацией.
- source_word: וַיִּחַן עַל
  choice: расположился лагерем против
  rationale: Сочетание חנה с עַל в военном контексте означает размещение лагеря против города; перевод не усиливает смысл до прямо не выраженной осады.
- source_word: יָבֵשׁ גִּלְעָד
  choice: Явеш Галаадский
  rationale: Естественная русская форма топонима, показывающая связь Явеша с областью Галаад.
- source_word: כָּל אַנְשֵׁי יָבֵישׁ
  choice: все мужчины Явеша
  rationale: Сохраняет выраженное словом אַנְשֵׁי указание на мужчин, существенное в контексте общественно-военных переговоров.
- source_word: כְּרָת לָנוּ בְרִית
  choice: заключи с нами союз
  rationale: ברית в данном политико-военном контексте естественно передаётся словом «союз»; буквальный образ «разрубить союз» вынесен в примечание.
- source_word: וְנַעַבְדֶךָּ
  choice: и мы будем служить тебе
  rationale: Прямо передаёт значение עבד с личным объектом, не добавляя формального статуса рабов или более общего понятия подчинения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан ясным и естественным; военная ситуация не усилена до явно не названной осады. Маркер [a] помещён непосредственно после выражения, к которому относится примечание.
