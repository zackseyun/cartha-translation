base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/012.yaml
  text: Then the people said to Samuel[a], “Who is it that said, ‘Shall Saul reign over us?’ Hand over the men, and we will put them to death.”
translation:
  language: ru
  text: 'Тогда народ сказал Самуилу: «Кто сказал: „Будет ли Саул царствовать над нами?“[a] Выдайте этих людей, и мы предадим их смерти».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Саул будет царствовать над нами». Еврейский имперфект может быть понят как вопрос о будущем или, менее вероятно в этом контексте, как утверждение.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Вав-последовательный продвигает повествование; «тогда» естественно передаёт последовательность событий по-русски.
- source_word: הָעָם
  choice: народ
  rationale: Обычное соответствие собирательному עָם; здесь речь об израильтянах, присутствовавших при событии.
- source_word: אֶל שְׁמוּאֵל
  choice: Самуилу
  rationale: Предлог אֶל при глаголе речи указывает адресата; дательный падеж естественен в русском языке.
- source_word: מִי הָאֹמֵר
  choice: Кто говорил
  rationale: Артикль с причастием обозначает того, кто произносил эти слова; русское «кто говорил» сохраняет требование назвать противников Саула и не перегружает фразу.
- source_word: שָׁאוּל יִמְלֹךְ עָלֵינוּ
  choice: Неужели Саул будет царствовать над нами?
  rationale: Имперфект допускает вопросительное прочтение; «неужели» естественно выражает прежнее недоверчивое возражение, а «царствовать над нами» сохраняет царский смысл מלך.
- source_word: תְּנוּ הָאֲנָשִׁים
  choice: Выдайте этих людей
  rationale: Императив требует передать названных противников для расправы; «выдайте» точнее контекстуального смысла, чем буквальное «дайте», а указательное «этих» делает референцию естественной по-русски.
- source_word: וּנְמִיתֵם
  choice: и мы предадим их смерти
  rationale: Каузативная форма от מות означает причинить смерть; выражение передаёт намеренное приведение смертного приговора в исполнение и сохраняет возвышенный повествовательный регистр.
theological_decisions:
- issue: Модальность слов о царствовании Саула
  choice: 'Передать как недоверчивый вопрос: «Неужели Саул будет царствовать над нами?»'
  alternative: «Саул будет царствовать над нами» как утверждение либо «Будет ли Саул царствовать над нами?» как нейтральный вопрос
  rationale: Контекст напоминает о прежнем неприятии Саула (1 Цар. 10:27), поэтому вопросительное прочтение наиболее вероятно; при этом смысл не превращён в богословски более определённое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис простой и понятный; сохранены коллективное «народ», царская лексика и судебно-исполнительный оттенок заключительной угрозы.
