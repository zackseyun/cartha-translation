  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו זִקְנֵ֣י יָבֵ֗ישׁ הֶ֤רֶף לָ֨/נוּ֙ שִׁבְעַ֣ת יָמִ֔ים וְ/נִשְׁלְחָה֙ מַלְאָכִ֔ים בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/אִם אֵ֥ין מוֹשִׁ֛יעַ אֹתָ֖/נוּ וְ/יָצָ֥אנוּ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/003.yaml
  text: The elders of Jabesh said to him, “Leave us alone for seven days, and we will send messengers throughout all the territory of Israel. Then, if there is no one to save us, we will come out to you.”
translation:
  language: ru
  text: 'Старейшины Иависа сказали ему: «Дай нам семь дней отсрочки, и мы разошлём посланников по всей земле Израиля. Если никто не спасёт нас, мы выйдем к тебе».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶרֶף לָנוּ
  choice: Дай нам … отсрочки
  rationale: Идиома буквально означает «оставь нас / ослабь для нас»; в контексте просьбы отложить капитуляцию естественная русская передача — «дай нам отсрочку».
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: по всей земле Израиля
  rationale: גְּבוּל может обозначать границу, пределы или территорию; здесь посланников рассылают по всей территории Израиля, что по-русски естественно передаётся как «по всей земле Израиля».
- source_word: מוֹשִׁיעַ
  choice: никто не спасёт нас
  rationale: Причастие в конструкции אֵין מוֹשִׁיעַ выражает отсутствие спасителя/избавителя; личная глагольная формулировка сохраняет смысл и звучит естественно.
- source_word: וְיָצָאנוּ אֵלֶיךָ
  choice: мы выйдем к тебе
  rationale: Сохранён буквальный образ выхода из города к осаждающему, который в контексте означает сдачу, без явного внесения этого толкования в текст.
theological_decisions:
- issue: Значение «спасителя» в מוֹשִׁיעַ
  choice: 'Передать действием: «никто не спасёт нас»'
  alternative: «не найдётся у нас избавителя»
  rationale: Контекст говорит о возможной военной помощи от Израиля; формулировка не придаёт слову более узкий богословский смысл, чем допускает данный стих.
- issue: Подразумеваемая капитуляция в «выйдем к тебе»
  choice: Сохранить выражение «выйдем к тебе»
  alternative: «сдадимся тебе»
  rationale: Исходный текст выражает капитуляцию косвенно. Сохранение образа не устраняет эту смысловую напряжённость и не делает подразумеваемое явным без необходимости.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. Синтаксис прямой; исторический колорит сохранён без архаизмов.
