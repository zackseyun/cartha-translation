base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/008.yaml
  text: He mustered them at Bezek[a], and the sons of Israel were three hundred thousand, and the men of Judah thirty thousand.
translation:
  language: ru
  text: Он произвёл смотр в Везеке, и сынов Израиля[a] насчитывалось триста тысяч, а людей Иуды — тридцать тысяч.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян». Буквально: «сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקְדֵם
  choice: Он провёл им смотр
  rationale: Глагол פקד в военном контексте обозначает учёт и смотр собранного войска, а не просто отвлечённый подсчёт. Выражение «провёл им смотр» естественно передаёт военный смысл.
- source_word: בְּבָזֶק
  choice: в Везеке
  rationale: בָזֶק — географическое название; предлог ב указывает здесь на место сбора. Русская форма «в Везеке» соответствует обычному употреблению названий населённых пунктов.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Буквальное родовое выражение сохранено, поскольку оно прозрачно по-русски и подчёркивает проведённое в стихе различие между Израилем и Иудой.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: триста тысяч
  rationale: Прямая передача еврейского количественного выражения.
- source_word: וְאִישׁ יְהוּדָה
  choice: мужей Иуды
  rationale: Единственное число אִישׁ употреблено собирательно и обозначает мужчин Иуды; множественное «мужей» естественно передаёт этот смысл и сохраняет параллель с первой группой.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: тридцать тысяч
  rationale: Прямая передача еврейского количественного выражения.
theological_decisions:
- issue: Передача родового и корпоративного выражения בְנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян
  rationale: Выражение не требует конфессионального толкования. Буквальная форма сохраняет мужское родовое обозначение исходного текста и литературное разграничение между Израилем и Иудой, тогда как более естественный вариант указан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конструкция «оказалось» позволяет естественно представить итоги военного смотра, не добавляя отсутствующего в еврейском тексте существительного «воинов».
