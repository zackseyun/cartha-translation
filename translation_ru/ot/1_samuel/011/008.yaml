  to: Он произвёл смотр в Везеке, и сынов Израиля[a] насчитывалось триста тысяч, а людей Иуды — тридцать тысяч.
  rationale: Исправление сохраняет военный смысл глагола פקד, место и все количественные данные, но заменяет менее точное «оказалось» на нейтральное «насчитывалось» и устраняет архаичное, потенциально двусмысленное «мужей Иуды».
