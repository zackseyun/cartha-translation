  source_fidelity: 'В целом перевод точно передаёт построение войска, время нападения, разгром аммонитян и полное рассеяние уцелевших. Однако «до наступления дневного зноя» меняет временную границу: такая формулировка может означать, что избиение прекратилось до начала зноя, тогда как עַד חֹם הַיּוֹם означает «до зноя дня / пока не стало жарко». «Проникли» несколько усиливает значение בוא («вошли, пришли») не обусловленной текстом идеей скрытного проникновения.'
  naturalness: Текст написан естественным современным литературным русским языком. «Вошли в самую середину лагеря» точнее и нейтральнее, чем «проникли в середину лагеря»; «до дневного зноя» сохраняет образ оригинала без ложного оттенка предварительности.
  terminology: '«Саул», «аммонитяне», «утренняя стража», «отряда» и «уцелевшие» уместны. Сноску a следует грамматически уточнить: три подразделения, или отряда.'
