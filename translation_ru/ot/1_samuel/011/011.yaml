  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּ֨שֶׂם שָׁא֣וּל אֶת הָ/עָם֮ שְׁלֹשָׁ֣ה רָאשִׁים֒ וַ/יָּבֹ֤אוּ בְ/תוֹךְ הַֽ/מַּחֲנֶה֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּכּ֥וּ אֶת עַמּ֖וֹן עַד חֹ֣ם הַ/יּ֑וֹם וַ/יְהִ֤י הַ/נִּשְׁאָרִים֙ וַ/יָּפֻ֔צוּ וְ/לֹ֥א נִשְׁאֲרוּ בָ֖/ם שְׁנַ֥יִם יָֽחַד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/011.yaml
  text: And it happened on the next day that Saul set the people in three groups[a], and they came into the midst of the camp during the morning watch and struck Ammon until the heat of the day. And it happened that the survivors were scattered[c][b], so that no two of them were left together.
translation:
  language: ru
  text: На следующий день Саул разделил народ на три отряда[a]. Во время утренней стражи[b] они вошли в самую середину лагеря и поражали аммонитян до дневного зноя[c]. Уцелевшие рассеялись, так что среди них не осталось и двух вместе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «три головы»; это идиома, означающая три подразделения, или отряда.'
    reason: lexical_alternative
  - marker: b
    text: Утренняя стража — последний период ночной стражи, перед рассветом или около рассвета.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «до зноя дня»; вероятно, имеется в виду время ближе к полудню.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: на следующий день
  rationale: Естественно передаёт временную последовательность событий в современном русском языке.
- source_word: וַיָּשֶׂם ... שְׁלֹשָׁה רָאשִׁים
  choice: разделил народ на три отряда
  rationale: Буквально «поставил народ тремя головами»; в данном военном контексте רָאשִׁים обозначает подразделения. «Отряды» ясно передаёт смысл идиомы.
- source_word: בְתוֹךְ הַמַּחֲנֶה
  choice: проникли в середину лагеря
  rationale: Передаёт направленность движения внутрь неприятельского лагеря, подразумеваемую глаголом בוא с предложной конструкцией.
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: во время утренней стражи
  rationale: Сохраняет древнее обозначение части ночи или раннего утра, не сводя его к неточному современному часу.
- source_word: וַיַּכּוּ אֶת עַמּוֹן
  choice: поражали аммонитян
  rationale: «Аммон» употреблён метонимически о войске аммонитян; несовершенный вид естественно выражает продолжавшееся до дневного зноя избиение.
- source_word: עַד חֹם הַיּוֹם
  choice: до наступления дневного зноя
  rationale: Сохраняет образ буквального «зноя дня» и не превращает приблизительное указание времени в точное «до полудня».
- source_word: הַנִּשְׁאָרִים
  choice: уцелевшие
  rationale: В военном контексте обозначает тех, кто остался в живых или избежал поражения.
- source_word: וַיָּפֻצוּ
  choice: рассеялись
  rationale: Естественно передаёт распад и бегство разгромленного войска без добавления отсутствующего в тексте направления.
- source_word: וְלֹא נִשְׁאֲרוּ בָם שְׁנַיִם יָחַד
  choice: так что среди них не осталось и двух вместе
  rationale: Сохраняет выразительный еврейский образ полного рассеяния и звучит естественно по-русски.
