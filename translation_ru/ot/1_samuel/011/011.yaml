translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Повтор וַיְהִי не воспроизведён механически, поскольку в русском он утяжелил бы фразу; последовательность и результат событий переданы синтаксисом. Военная терминология ясна обычному читателю, а древние реалии пояснены в сносках.
