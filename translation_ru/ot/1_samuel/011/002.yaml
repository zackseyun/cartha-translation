  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם נָחָשׁ֙ הָ/עַמּוֹנִ֔י בְּ/זֹאת֙ אֶכְרֹ֣ת לָ/כֶ֔ם בִּ/נְק֥וֹר לָ/כֶ֖ם כָּל עֵ֣ין יָמִ֑ין וְ/שַׂמְתִּ֥י/הָ חֶרְפָּ֖ה עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/002.yaml
  text: 'Nahash the Ammonite said to them, “On this condition I will make a treaty with you: that every right eye of yours be gouged out, and I will make it a disgrace upon all Israel.”'
translation:
  language: ru
  text: 'Аммонитянин Нахаш сказал им: «Я заключу с вами договор только при таком условии: я выколю каждому из вас правый глаз и тем покрою позором весь Израиль».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּזֹאת אֶכְרֹת לָכֶם
  choice: Я заключу с вами договор только при таком условии
  rationale: Передаёт идиому «при этом/на этом заключу вам» естественным русским выражением и ясно сохраняет условный характер договора.
- source_word: בִּנְקוֹר לָכֶם כָּל־עֵין יָמִין
  choice: я выколю каждому из вас правый глаз
  rationale: Еврейская конструкция буквально говорит о выкалывании «вам всякого правого глаза»; личная активная форма естественна по-русски и соответствует субъекту Нахашу.
- source_word: וְשַׂמְתִּיהָ חֶרְפָּה עַל כָּל־יִשְׂרָאֵל
  choice: и тем покрою позором весь Израиль
  rationale: Сохраняет причинно-присоединительную связь и передаёт חֶרְפָּה как публичный позор, лежащий на всём Израиле.
theological_decisions:
- issue: К кому относится местоименный суффикс женского рода в וְשַׂמְתִּיהָ
  choice: «тем покрою позором» — увечье представлено причиной позора
  alternative: «сделаю это позором для всего Израиля»
  rationale: Референт суффикса не выражен однозначным существительным; русский оборот сохраняет смысловую связь с предшествующим действием, не вводя искусственно уточнённого референта.
translation_notes:
  register: Современный литературный русский язык; речь угрожающая и прямая, без архаизмов. Имя נָחָשׁ передано в принятой русской библейской форме «Нахаш», этноним — «аммонитянин».
