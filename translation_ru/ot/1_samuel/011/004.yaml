source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ הַ/מַּלְאָכִים֙ גִּבְעַ֣ת שָׁא֔וּל וַ/יְדַבְּר֥וּ הַ/דְּבָרִ֖ים בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יִּשְׂא֧וּ כָל הָ/עָ֛ם אֶת קוֹלָ֖/ם וַ/יִּבְכּֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/004.yaml
  text: When the messengers came to Gibeah of Saul and spoke these words in the hearing of the people[a], all the people lifted up their voices and wept.
translation:
  language: ru
  text: Когда посланцы пришли в Гиву Саулову и передали эти слова народу, весь народ возвысил голос и заплакал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: посланцы
  rationale: В данном человеческом контексте מַלְאָךְ означает людей, отправленных с вестью; «посланцы» ясно передаёт этот смысл и исключает ангельское значение.
- source_word: גִּבְעַת שָׁאוּל
  choice: Гива Саулова
  rationale: Сохраняет конструкцию принадлежности или связи с Саулом и соответствует естественной для русского библейского повествования форме топонима.
- source_word: וַיְדַבְּרוּ הַדְּבָרִים בְּאָזְנֵי הָעָם
  choice: передали эти слова народу
  rationale: Еврейское выражение буквально говорит о произнесении слов «в уши народа»; русский оборот передаёт публичное сообщение, не воспроизводя неестественную кальку.
- source_word: וַיִּשְׂאוּ ... אֶת קוֹלָם
  choice: возвысил голос
  rationale: Сохранён образ еврейской идиомы «поднять свой голос»; единственное число естественно согласуется с русским собирательным существительным «народ».
- source_word: וַיִּבְכּוּ
  choice: и заплакал
  rationale: Глагол обозначает плач от горя; «заплакал» естественно выражает начало общего плача.
- source_word: כָל הָעָם
  choice: весь народ
  rationale: Прямо и естественно передаёт сочетание כָל с собирательным существительным.
