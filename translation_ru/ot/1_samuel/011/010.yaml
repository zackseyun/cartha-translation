lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И сказали
  rationale: Последовательный вав продолжает повествование; русское «И сказали» естественно передаёт связь и ход событий.
- source_word: אַנְשֵׁי יָבֵישׁ
  choice: жители Иависа
  rationale: Буквально — «мужи Иависа». В современном русском при обозначении представителей города «жители» звучит естественнее и не меняет референцию; полное название «Иавис Галаадский» в этом стихе отсутствует.
- source_word: מָחָר
  choice: Завтра
  rationale: Прямое соответствие временному наречию.
- source_word: נֵצֵא אֲלֵיכֶם
  choice: мы выйдем к вам
  rationale: Глагол יצא означает «выйти». Контекст подразумевает подчинение или сдачу, но в еврейском тексте это прямо не названо, поэтому образ сохранён.
- source_word: וַעֲשִׂיתֶם לָּנוּ
  choice: и вы сделаете с нами
  rationale: Форма описывает то, что адресаты смогут или будут вправе сделать после выхода жителей; русское будущее время сохраняет прямоту речи без добавления явного модального глагола.
- source_word: כְּכָל הַטּוֹב בְּעֵינֵיכֶם
  choice: всё, что будет угодно вам
  rationale: Еврейская идиома буквально означает «всё доброе в ваших глазах», то есть всё, что адресаты сочтут правильным или желательным. Выбран естественный русский идиоматический эквивалент.
