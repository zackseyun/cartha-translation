source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל הָ/עָ֔ם לְכ֖וּ וְ/נֵלְכָ֣ה הַ/גִּלְגָּ֑ל וּ/נְחַדֵּ֥שׁ שָׁ֖ם הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/014.yaml
  text: Then Samuel said to the people[a], “Come, let us go to Gilgal, and there renew the kingship.”
translation:
  language: ru
  text: 'Тогда Самуил сказал народу: «Пойдём в Галгал и там обновим царскую власть[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заново утвердим царскую власть»; возможно также: «обновим царство».'
    reason: лексические варианты для וּנְחַדֵּשׁ הַמְּלוּכָה, сохраняющие значения подтверждения царского правления и обновления царства
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Форма с последовательным וַ продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: שְׁמוּאֵל
  choice: Самуил
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: אֶל הָעָם
  choice: народу
  rationale: עָם здесь обозначает собравшийся народ Израиля; контекст не требует сужать значение до войска.
- source_word: לְכוּ וְנֵלְכָה
  choice: Пойдём
  rationale: Сочетание повелительного множественного числа и когортатива представляет собой призыв к совместному действию. Русское «пойдём» естественно передаёт приглашение, не воспроизводя неестественное буквальное «идите, и пойдём».
- source_word: הַגִּלְגָּל
  choice: Галгал
  rationale: Традиционная русская передача географического названия; еврейский артикль отдельно не передаётся.
- source_word: וּנְחַדֵּשׁ
  choice: обновим
  rationale: Порода piel глагола חדש означает «обновить, сделать новым вновь». Выбор сохраняет открытую формулировку оригинала, не сводя её исключительно к подтверждению уже существующей власти.
- source_word: שָׁם
  choice: там
  rationale: Прямо передаёт указание на Галгал как место предстоящего действия.
- source_word: הַמְּלוּכָה
  choice: царскую власть
  rationale: מְלוּכָה может обозначать царское правление, царское достоинство или царство. В данном контексте «царская власть» естественно указывает на царское правление Саула, не отождествляя его однозначно с территорией государства.
theological_decisions:
- issue: Смысл обновления הַמְּלוּכָה
  choice: «обновим царскую власть» — формулировка, сохраняющая возможность публичного возобновления или подтверждения царского правления Саула
  alternative: «заново утвердим царскую власть» или «обновим царство»
  rationale: После победы Саула речь, вероятно, идёт о всенародном подтверждении его царского положения, однако сам еврейский текст не уточняет обряд и допускает более широкий смысл обновления царства или монархии. Поэтому основной текст сохраняет эту смысловую напряжённость, а варианты вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным строем и умеренно торжественной прямой речью. «Пойдём» звучит естественно как совместный призыв, а «царская власть» понятнее современному читателю, чем отвлечённое «царствование», при этом не сужает значение до территории царства.
