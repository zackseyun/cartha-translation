base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/009.yaml
  text: 'They said to the messengers who were coming[a], “Thus you shall say to the men of Jabesh-gilead: Tomorrow, by the heat of the sun, you will have deliverance.” So the messengers came and told the men of Jabesh[b], and they rejoiced.'
translation:
  language: ru
  text: 'Они сказали прибывшим посланцам: «Вот что скажите жителям Явеш-Гилеада[a]: „Завтра, в солнечный зной[b], к вам придёт избавление“». Посланцы пришли и передали это жителям Явеша, и те обрадовались.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «жителю Явеш-Гилеада»; единственное число, вероятно, употреблено собирательно — о жителях города.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в жар солнца»; возможно, имеется в виду самая жаркая пора дня.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים הַבָּאִים
  choice: прибывшим посланцам
  rationale: מַלְאָכִים в данном повествовании — люди, доставляющие весть. Причастие הַבָּאִים обозначает пришедших к Саулу посланцев; русское «прибывшим» естественно передаёт эту ситуацию.
- source_word: כֹּה תֹאמְרוּן
  choice: Вот что скажите
  rationale: Современная и ясная русская передача формулы, вводящей прямую речь, без излишне архаичного «так скажите».
- source_word: לְאִישׁ יָבֵישׁ גִּלְעָד
  choice: жителям Явеш-Гилеада
  rationale: Единственное число אִישׁ здесь имеет собирательное значение и относится к населению осаждённого города; «жителям» естественно выражает это по-русски.
- source_word: תִּהְיֶה לָכֶם תְּשׁוּעָה
  choice: к вам придёт избавление
  rationale: תְּשׁוּעָה в военном контексте означает избавление, спасение от врага. Формулировка сохраняет безлично-экзистенциальную конструкцию и не подменяет её более узким словом «победа».
- source_word: בְּחֹם הַשָּׁמֶשׁ
  choice: когда солнце станет припекать
  rationale: Естественная русская передача временного смысла выражения, буквально связанного с жаром солнца; точная временная граница остаётся открытой.
- source_word: וַיַּגִּידוּ
  choice: передали это
  rationale: В контексте посланцы сообщают жителям полученный ответ; «передали это» ясно и идиоматично передаёт действие.
- source_word: לְאַנְשֵׁי יָבֵישׁ
  choice: жителям Явеша
  rationale: Сочетание означает людей или жителей города. «Жителям» звучит современно и точно обозначает адресатов вести.
- source_word: וַיִּשְׂמָחוּ
  choice: обрадовались
  rationale: Передаёт наступившую радость жителей в естественном русском повествовательном стиле.
theological_decisions:
- issue: Значение תְּשׁוּעָה
  choice: избавление
  alternative: спасение; победа
  rationale: В стихе речь идёт о конкретном избавлении города от военной угрозы. «Избавление» сохраняет широту слова и не навязывает ни исключительно духовного смысла, ни непременно итоговой военной победы.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Название города передано как «Явеш-Гилеад», ближе к еврейской форме; синтаксис прямой речи упрощён для ясного чтения. Все примечания поставлены непосредственно при выражениях, к которым относятся.
