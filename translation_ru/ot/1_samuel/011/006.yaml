lexical_decisions:
- source_word: וַתִּצְלַח
  choice: мощно сошёл
  rationale: В сочетании с Духом и человеком глагол צלח обозначает не просто приближение, а внезапное и действенное нисхождение, наделяющее силой. Русское «мощно сошёл» передаёт силу действия без излишне буквального образа натиска.
- source_word: רוּחַ אֱלֹהִים
  choice: Дух Божий
  rationale: Сочетание естественно обозначает Божий Дух; традиционная и понятная русская форма сохраняет богословскую значимость выражения.
- source_word: עַל שָׁאוּל
  choice: на него
  rationale: Предлог עַל при глаголе нисхождения естественно передаётся русским «на»; местоимение устраняет тяжеловесное повторение имени Саула.
- source_word: בְּשָׁמְעוֹ
  choice: когда Саул услышал
  rationale: Предлог ב с инфинитивом и местоименным суффиксом имеет временное значение. Такая конструкция ясна и естественна по-русски.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: В непосредственном контексте услышанного сообщения דְּבָרִים уместнее передать как «слова», сохранив близость к лексической форме.
- source_word: וַיִּחַר אַפּוֹ
  choice: гнев его сильно разгорелся
  rationale: Еврейская идиома буквально говорит о воспламенившемся носе, то есть о сильном гневе. «Гнев разгорелся» сохраняет метафору огня и звучит естественно в современном литературном русском.
- source_word: מְאֹד
  choice: сильно
  rationale: Наречие усиливает выражение гнева; «сильно разгорелся» естественнее по-русски, чем буквальное «разгорелся весьма».
theological_decisions:
- issue: Характер רוּחַ אֱלֹהִים в повествовании
  choice: Божий Дух действенно нисходит на Саула
  alternative: дух от Бога
  rationale: Контекст призвания к избавлению и употребление выражения в повествовании о Сауле указывают на Божий Дух, наделяющий его силой. Перевод не уточняет механизм действия сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Порядок придаточного и главного предложений сделан естественным для русского языка; огненная метафора гнева сохранена. Все сноски отмечены в основном тексте.
