  text: וַ/יֹּ֣אמֶר שָׁא֔וּל לֹֽא יוּמַ֥ת אִ֖ישׁ בַּ/יּ֣וֹם הַ/זֶּ֑ה כִּ֥י הַ/יּ֛וֹם עָשָֽׂה יְהוָ֥ה תְּשׁוּעָ֖ה בְּ/יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/013.yaml
  text: But Saul said[a], “Not a man shall be put to death on this day, for today Yahweh has brought salvation in Israel.”
translation:
  language: ru
  text: 'Но Саул сказал: «В этот день никто не будет предан смерти, потому что сегодня Яхве даровал Израилю избавление[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «совершил спасение в Израиле». Возможны также переводы: «даровал Израилю спасение» или «даровал Израилю победу».'
    reason: Сочетание עָשָׂה תְּשׁוּעָה означает осуществить избавление; в военном контексте возможна также «победа». Предлог ב может сохранять локативный оттенок («в Израиле») либо естественно передаваться по-русски указанием на получателя («Израилю»).
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но Саул сказал
  rationale: Последовательная форма продолжает повествование, а союз «но» естественно передаёт противопоставление предложению народа казнить противников Саула в предыдущем стихе.
- source_word: לֹא יוּמַת אִישׁ
  choice: никто не будет предан смерти
  rationale: Пассивная каузативная форма от מות обозначает намеренное предание смерти, а אִישׁ употреблено в обобщённо-распределительном смысле. Формулировка сохраняет юридический оттенок и звучит естественно по-русски.
- source_word: בַּיּוֹם הַזֶּה
  choice: в этот день
  rationale: Сохраняет полную временную формулу исходного текста и позволяет отдельно передать последующее הַיּוֹם словом «сегодня».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание решения Саула никого не казнить.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Естественно передаёт наречное временное значение и сохраняет повтор указания на этот день.
- source_word: עָשָׂה יְהוָה תְּשׁוּעָה
  choice: Яхве совершил спасение
  rationale: Сочетание עשה с תְּשׁוּעָה означает осуществить спасение или избавление. «Совершил спасение» сохраняет божественную инициативу и более широкий смысл слова, не сводя его только к военной победе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Прямо сохраняет локативную силу предлога ב; понимание «для Израиля» возможно по контексту, но менее буквально.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение תְּשׁוּעָה в военном контексте
  choice: спасение
  alternative: избавление; победа
  rationale: Контекст допускает значения «избавление» и «победа», однако «спасение» сохраняет смысловую широту еврейского слова и подчёркивает, что исход события приписан Яхве.
- issue: Отношение בְּיִשְׂרָאֵל к спасению
  choice: в Израиле
  alternative: для Израиля; Израилю
  rationale: Выбрано прямое локативное прочтение предлога ב, при этом контекстуально возможный смысл получателя не исключается и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Юридическая формула «предан смерти» и выражение «совершил спасение» сохраняют оттенки исходного текста, не становясь архаичными.
