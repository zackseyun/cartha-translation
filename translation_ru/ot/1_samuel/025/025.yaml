  text: אַל נָ֣א יָשִׂ֣ים אֲדֹנִ֣/י אֶת לִבּ֡/וֹ אֶל אִישׁ֩ הַ/בְּלִיַּ֨עַל הַ/זֶּ֜ה עַל נָבָ֗ל כִּ֤י כִ/שְׁמ/וֹ֙ כֶּן ה֔וּא נָבָ֣ל שְׁמ֔/וֹ וּ/נְבָלָ֖ה עִמּ֑/וֹ וַֽ/אֲנִי֙ אֲמָ֣תְ/ךָ֔ לֹ֥א רָאִ֛יתִי אֶת נַעֲרֵ֥י אֲדֹנִ֖/י אֲשֶׁ֥ר שָׁלָֽחְתָּ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/025.yaml
  text: 'Please[a], my lord, do not set your heart on this worthless man, on Nabal, for as his name is, so is he: Nabal is his name, and folly is with him. But I, your servant, did not see the young men of my lord whom you sent.'
translation:
  language: ru
  text: 'Пусть господин мой не обращает внимания на этого негодного человека, на Навала, ведь как имя его, таков и он: имя его — Навал[a], и глупость с ним. А я, твоя раба, не видела юношей господина моего, которых ты послал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Навал» созвучно еврейскому слову со значением «глупец» или «глупость»; Авигея намеренно обыгрывает его имя.
    reason: Игра слов в еврейском тексте не воспроизводится напрямую в русском переводе.
lexical_decisions:
- source_word: אַל נָא יָשִׂים אֲדֹנִי אֶת לִבּוֹ אֶל
  choice: Пусть господин мой не принимает близко к сердцу поступок
  rationale: Еврейский оборот буквально говорит о направлении сердца к кому-либо; русская идиома «принимать близко к сердцу» естественно передаёт серьёзное внимание и внутреннюю озабоченность. Добавление «поступок» устраняет неестественное русское «принимать человека близко к сердцу», не меняя контекстуального смысла.
- source_word: אִישׁ הַבְּלִיַּעַל
  choice: негодного человека
  rationale: В данном контексте בְּלִיַּעַל — нравственная характеристика низкого, негодного человека, а не имя собственное. «Негодный» сохраняет резкость оценки и звучит естественно по-русски.
- source_word: נָבָל
  choice: Навал
  rationale: Личное имя передано традиционной русской транслитерацией; связанная с ним игра слов пояснена в сноске.
- source_word: כִּי כִשְׁמוֹ כֶּן הוּא
  choice: ведь каково его имя, таков и он сам
  rationale: Сохранены параллельная, почти пословичная форма и явная связь имени с характером.
- source_word: וּנְבָלָה עִמּוֹ
  choice: и безумие при нём
  rationale: נְבָלָה допускает значения безумия, глупости и постыдного поведения. «Безумие» сохраняет словесную связь с именем Навал и намеренно несколько необычную конструкцию עִמּוֹ — «при нём».
- source_word: אֲמָתְךָ
  choice: твоя раба
  rationale: Слово обозначает женщину-рабыню или служанку и здесь служит формулой смиренного самоназвания. «Твоя раба» точно передаёт род и социальную окраску без архаического «рабыня твоя».
- source_word: נַעֲרֵי אֲדֹנִי
  choice: людей господина моего
  rationale: נְעָרִים может обозначать молодых людей или состоящих при ком-либо слуг. В контексте это посланцы Давида; «людей» естественно в русском повествовании и не навязывает их точный возраст.
