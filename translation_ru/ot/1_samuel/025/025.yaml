  source_fidelity: 'В первой части черновик меняет объект еврейского оборота: אֶל־אִישׁ («на/о человеке») передано как «поступок этого человека». Это сужает и несколько изменяет смысл: Авигея просит Давида не обращать внимания на самого Навала. נַעֲרֵי следует передать более определённо, чем нейтральное «люди»; «юноши» сохраняет исходную лексику и не исключает их роли посланцев. В остальных строках структура, обращение и словесная игра переданы верно.'
  naturalness: «Не обращать внимания на» — естественный современный русский эквивалент идиомы «не полагать сердце на». Формулы «господин мой» и «твоя раба» уместны в уважительной речи Авигеи и понятны современному читателю. «Глупость с ним» намеренно сохраняет необычную, но ясную краткость исходного выражения.
  terminology: «Негодный человек» адекватно передаёт אִישׁ הַבְּלִיַּעַל без превращения характеристики в собственное имя или излишней догматизации. Имя «Навал» сохранено. «Глупость» лучше поддерживает игру с именем, чем «безумие»; сноска объясняет не воспроизводимую в русском этимологическую связь.
