base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/042.yaml
  text: Abigail quickly got up and rode on the donkey, with five of her young women going after her; she went after David's messengers and became his wife.
translation:
  language: ru
  text: Авигея поспешно встала, села на осла и отправилась вслед за посланниками Давида; её сопровождали пять служанок, шедших за ней. И стала она его женой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּמַהֵר וַתָּקָם
  choice: поспешно встала
  rationale: Передаёт как поспешность действия, так и самостоятельный глагол «встала», сохраняя последовательность еврейского повествования.
- source_word: נַעֲרֹתֶיהָ
  choice: её ... служанок
  rationale: В данном повествовательном контексте נַעֲרוֹת обозначает молодых женщин из её прислуги; «служанки» естественнее и точнее по функции, чем нейтральное «девушки».
- source_word: הַהֹלְכוֹת לְרַגְלָהּ
  choice: шедших за ней
  rationale: Идиома буквально связана с движением «у её ног», но по смыслу означает сопровождение следом; русский оборот сохраняет пространственное отношение без неестественного буквализма.
- source_word: וַתֵּלֶךְ אַחֲרֵי מַלְאֲכֵי דָוִד
  choice: отправилась вслед за посланниками Давида
  rationale: מַלְאָכִים здесь — человеческие посланники; «вслед за» ясно передаёт אַחֲרֵי и отличает их положение впереди от служанок, шедших позади Авигеи.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: И стала она его женой
  rationale: Прямо и естественно передаёт брачную формулу, не добавляя отсутствующих в стихе подробностей о церемонии.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Порядок средней части слегка перестроен для ясности: Авигея следует за посланниками Давида, а пять служанок — за ней. Имя передано в принятой русской библейской форме «Авигея».'
