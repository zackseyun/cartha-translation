  text: She rose and bowed with her face to the ground and said[a], “Behold[b], your servant is a maidservant to wash the feet of the servants of my lord.”
translation:
  language: ru
  text: 'Встав, она пала лицом на землю[a] и сказала: «Вот, твоя рабыня — служанка[b] для омовения ног слуг моего господина».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поклонилась лицом к земле»; то есть совершила глубокий земной поклон. Возможный перевод: «простёрлась ниц».'
    reason: lexical_alternative
  - marker: b
    text: В выражении «твоя рабыня — служанка» употреблены два близких еврейских слова, обозначающих женщину-служанку или рабыню. Их точное смысловое различие здесь не вполне ясно.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Она встала
  rationale: Форма от קום продолжает последовательность повествования; «встала» — прямой и естественный современный эквивалент.
- source_word: וַתִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: поклонилась до земли, склонив лицо
  rationale: Передаёт глубокое почтительное склонение и сохраняет указание на лицо и землю, не ограничивая выражение более специальным словом «простёрлась».
- source_word: הִנֵּה
  choice: Вот
  rationale: Современное и достаточно торжественное указательное слово, вводящее самоуничижительное заявление Авигеи.
- source_word: אֲמָתְךָ
  choice: твоя раба
  rationale: Существительное אָמָה обозначает женщину в подчинённом, служебном положении; «раба» сохраняет женский род и социальную зависимость.
- source_word: לְשִׁפְחָה
  choice: служанка
  rationale: שִׁפְחָה — близкое обозначение женщины-служанки или рабыни. Отличный от «раба» перевод сохраняет смену еврейских терминов и остаётся естественным по-русски.
- source_word: לִרְחֹץ רַגְלֵי
  choice: чтобы омывать ноги
  rationale: Инфинитив с לְ выражает назначение или цель; «омыть/омывать ноги» точно передаёт унизительную домашнюю услугу.
- source_word: עַבְדֵי אֲדֹנִי
  choice: слуг моего господина
  rationale: עֶבֶד здесь относится к людям из окружения Давида; «слуги» естественно в данном придворно-бытовом контексте, а «мой господин» сохраняет почтительное обращение.
theological_decisions:
- issue: Соотношение женских обозначений служебного положения אָמָה и שִׁפְחָה
  choice: Различить их как «раба» и «служанка»
  alternative: 'Передать оба слова одинаково: «раба» или «служанка»'
  rationale: В еврейском тексте стоят два близких, но разных слова. Их различение сохраняет риторическое самоуничижение Авигеи, не утверждая чрезмерно точной иерархии между терминами.
- issue: Подразумеваемая связка в הִנֵּה אֲמָתְךָ לְשִׁפְחָה
  choice: 'Сохранить сжатую именную конструкцию: «твоя раба — служанка, чтобы…»'
  alternative: «Твоя раба готова стать служанкой, чтобы…»
  rationale: В оригинале нет явного глагола «готова» или «стать». Сжатая русская конструкция сохраняет эту неоднозначность, хотя смысл готовности принять самое низкое служение очевиден из контекста.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Почтительное «мой господин» сохранено как социальное обращение к Давиду; синтаксис реплики намеренно остаётся несколько сжатым, отражая еврейский оригинал.
