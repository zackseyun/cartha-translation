  text: וַ/יִּשְׁמַ֣ע דָּוִד֮ כִּ֣י מֵ֣ת נָבָל֒ וַ/יֹּ֡אמֶר בָּר֣וּךְ יְהוָ֡ה אֲשֶׁ֣ר רָב֩ אֶת רִ֨יב חֶרְפָּתִ֜/י מִ/יַּ֣ד נָבָ֗ל וְ/אֶת עַבְדּ/וֹ֙ חָשַׂ֣ךְ מֵֽ/רָעָ֔ה וְ/אֵת֙ רָעַ֣ת נָבָ֔ל הֵשִׁ֥יב יְהוָ֖ה בְּ/רֹאשׁ֑/וֹ וַ/יִּשְׁלַ֤ח דָּוִד֙ וַ/יְדַבֵּ֣ר בַּ/אֲבִיגַ֔יִל לְ/קַחְתָּ֥/הּ ל֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/039.yaml
  text: When David heard that Nabal was dead[a], he said, “Blessed be Yahweh, who has pleaded the case of my reproach from the hand of Nabal, and has kept his servant back from evil. Yahweh has returned Nabal’s evil on his own head.” Then David sent and spoke to Abigail[e][d][c][b], to take her as his wife.
translation:
  language: ru
  text: 'Когда Давид услышал, что Навал умер, он сказал: «Благословен Яхве, Который вступился за меня в тяжбе с Навалом из-за нанесённого мне оскорбления,[a] и удержал Своего слугу от зла.[b] Яхве обратил зло Навала на его же голову».[c] Затем Давид послал людей поговорить с Авигеей, чтобы взять её себе в жёны.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Который вёл тяжбу моего оскорбления от руки Навала»; также возможно: «Который отомстил за нанесённое мне Навалом оскорбление». Здесь употреблён язык судебной тяжбы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «удержал Своего слугу от причинения зла».'
    reason: lexical_alternative
  - marker: c
    text: «Обратил зло… на его же голову» — образное выражение о воздаянии, постигающем самого виновника.
    reason: cultural_note
  - marker: d
    text: То есть чтобы жениться на ней. Еврейский текст буквально говорит, что Давид послал и говорил с Авигеей, чтобы взять её себе в жёны; разговор происходил через посланников.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  choice: Благословен Яхве
  rationale: Сохраняет обычную древнееврейскую формулу благословения и передаёт יהוה личным именем, а не титулом.
- source_word: רָב אֶת רִיב חֶרְפָּתִי
  choice: вступился за меня в деле оскорбления
  rationale: Глагол и существительное от ריב создают юридический образ ведения тяжбы; русское «вступился… в деле» сохраняет этот оттенок, не становясь чрезмерно буквальным.
- source_word: מִיַּד נָבָל
  choice: нанесённого мне Навалом
  rationale: Естественно передаёт еврейское указание на источник и виновника оскорбления; буквальное «из руки Навала» здесь было бы неясно по-русски.
- source_word: וְאֶת עַבְדּוֹ חָשַׂךְ מֵרָעָה
  choice: и удержал Своего слугу от зла
  rationale: Сохраняет значение сдерживания и нравственную многозначность רָעָה; «Своего слугу» — смиренное самообозначение Давида.
- source_word: וְאֵת רָעַת נָבָל הֵשִׁיב יְהוָה בְּרֹאשׁוֹ
  choice: Яхве обратил зло Навала на его же голову
  rationale: Сохраняет образ воздаяния, при котором зло возвращается к совершившему его.
- source_word: וַיִּשְׁלַח דָּוִד וַיְדַבֵּר בַּאֲבִיגַיִל
  choice: Давид послал людей поговорить с Авигеей
  rationale: Подлежащее последующего разговора подразумевается через посланников. Формулировка естественна по-русски и не заменяет нейтральное «говорить» более узким «сделать предложение».
- source_word: לְקַחְתָּהּ לוֹ לְאִשָּׁה
  choice: чтобы взять её себе в жёны
  rationale: Близко передаёт стандартное древнееврейское выражение о заключении брака и остаётся понятно современному читателю.
theological_decisions:
- issue: Божественный суд и провидение в смерти Навала
  choice: 'Передать слова как истолкование Давидом случившегося: Яхве защитил его дело и обратил зло Навала на самого Навала.'
  alternative: Прямо пояснить, что Бог казнил Навала, либо ослабить язык воздаяния.
  rationale: Текст явно приписывает Яхве защиту и воздаяние, но не формулирует общее учение о причинах всякой смерти или страдания.
- issue: Нравственный смысл רָעָה в отношении намерения Давида
  choice: «удержал Своего слугу от зла»
  alternative: «удержал Своего слугу от причинения вреда» или «от мести»
  rationale: «Зло» сохраняет нравственную силу и многозначность исходного слова, не сводя его только к физическому вреду или к одному мотиву мести.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Судебная метафора сохранена в понятной форме; архаичные обороты сведены к минимуму. Имя יהוה передано как «Яхве». Все примечания отмечены в основном тексте.
