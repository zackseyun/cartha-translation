  text: וַ/יְהִ֖י כַּ/עֲשֶׂ֣רֶת הַ/יָּמִ֑ים וַ/יִּגֹּ֧ף יְהוָ֛ה אֶת נָבָ֖ל וַ/יָּמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/038.yaml
  text: And about ten days later[a], Yahweh struck Nabal, and he died.
translation:
  language: ru
  text: Примерно через десять дней[a] Яхве поразил Навала, и тот умер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Спустя примерно десять дней». Еврейское выражение обозначает приблизительный срок в десять дней.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: через … дней
  rationale: Формула вводит следующее событие повествования; по-русски временная последовательность естественно передаётся без буквального «и было».
- source_word: כַּעֲשֶׂרֶת הַיָּמִים
  choice: примерно через десять дней
  rationale: Префикс כְּ выражает приблизительность, а оборот в контексте указывает на истечение приблизительно десяти дней.
- source_word: וַיִּגֹּף
  choice: поразил
  rationale: Глагол נָגַף обозначает нанесение поражающего удара; «поразил» сохраняет прямоту исходного текста, не уточняя способ действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано общепринятой русской транслитерацией, а не заменено титулом.
- source_word: אֶת נָבָל
  choice: Навала
  rationale: Показатель прямого дополнения отдельно не переводится; имя נָבָל передано как «Навал» и поставлено в винительный падеж.
- source_word: וַיָּמֹת
  choice: и тот умер
  rationale: Сохранена последовательность двух самостоятельных действий. Местоимение «тот» ясно указывает на Навала и избегает возможной двусмысленности русского «он» после упоминания Яхве.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя; его транслитерация сохраняет это различие и не заменяет имя титулом.
- issue: Степень причинной связи между Божьим ударом и смертью Навала
  choice: Яхве поразил Навала, и тот умер
  alternative: Яхве поразил Навала насмерть; Яхве поразил Навала так, что он умер
  rationale: В еврейском тексте стоят два последовательных глагола. Перевод утверждает Божье действие и последующую смерть, не сводя их в более истолковывающую причинную конструкцию.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и торжественное. Слово «поразил» сохраняет библейскую весомость, оставаясь понятным современному читателю.
