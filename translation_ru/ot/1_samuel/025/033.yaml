base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/033.yaml
  text: And blessed be your judgment[a], and blessed be you[c][b], who have kept me this day from coming into bloodshed and from saving myself by my own hand.
translation:
  language: ru
  text: И благословенно твоё благоразумие[a], и благословенна ты, удержавшая меня сегодня от кровопролития[b] и от того, чтобы отомстить за себя собственной рукой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рассудительность» или «здравое суждение».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от прихода с кровью»; выражение может также подразумевать вину за пролитую кровь.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «спасти мою руку для меня»; то есть самому добиться себе избавления. В данном контексте: «отомстить за себя собственной рукой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ טַעְמֵךְ
  choice: И благословенно твоё благоразумие
  rationale: טַעַם здесь обозначает здравое суждение, рассудительность и способность принять верное решение. «Благоразумие» естественно по-русски передаёт похвалу Давида мудрому совету Авигеи, не сводя смысл лишь к интеллектуальной проницательности.
- source_word: וּבְרוּכָה אָתְּ
  choice: и благословенна ты
  rationale: Сохранена параллельная формула благословения и прямое обращение к женщине.
- source_word: אֲשֶׁר כְּלִתִנִי
  choice: удержавшая меня
  rationale: В данном контексте форма глагола כלה выражает предотвращение или удержание от задуманного поступка. Причастный оборот естественно связывает благословение Авигеи с её действием.
- source_word: הַיּוֹם הַזֶּה
  choice: сегодня
  rationale: Передаёт усиленное временное указание современным и естественным русским словом.
- source_word: מִבּוֹא בְדָמִים
  choice: от кровопролития
  rationale: Буквально выражение говорит о «вхождении в кровь/крови», но в данном контексте означает участие в кровопролитии; буквальное воспроизведение было бы неестественно по-русски. Возможный оттенок вины за пролитую кровь сохранён в сноске.
- source_word: וְהֹשֵׁעַ יָדִי לִי
  choice: и от того, чтобы спасти самого себя собственной рукой
  rationale: Сохранено основное значение ישׁע «спасать, избавлять» и подчёркнутое указание на собственную руку. Контекстуальное значение личного отмщения указано в сноске, а не подставлено в основной текст.
theological_decisions:
- issue: 'Значение множественного דָּמִים: кровопролитие или вина за кровь'
  choice: кровопролитие
  alternative: вина за пролитую кровь
  rationale: Непосредственно речь идёт о предотвращённом убийстве Навала и его людей, однако еврейское выражение может включать нравственно-правовой оттенок виновности; эта напряжённость сохранена в сноске.
- issue: 'Значение וְהֹשֵׁעַ יָדִי לִי: спасение или отмщение собственной рукой'
  choice: спасти самого себя собственной рукой
  alternative: отомстить за себя собственной рукой
  rationale: Основной текст сохраняет лексическое значение глагола «спасать/избавлять» и некоторую неоднозначность формулировки. Повествовательный контекст позволяет понимать это как самостоятельное достижение возмездия или оправдания, что отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Параллелизм двух благословений сохранён; синтаксис слегка разглажен ради естественности. Неоднозначность выражений о крови и спасении собственной рукой не устранена, а пояснена в сносках.
