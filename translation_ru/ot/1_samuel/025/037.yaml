  text: And in the morning[a], when the wine had gone out of Nabal, his wife told him these things, and his heart died within him[b], and he became like a stone.
translation:
  language: ru
  text: Наутро, когда вино вышло из Навала[a], его жена рассказала ему обо всём этом. Тогда сердце его замерло[b], и он стал как камень.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда вино вышло из Навала», то есть когда он протрезвел и действие вина прошло.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сердце его умерло внутри него». Еврейский текст использует яркий образ, не называя конкретного медицинского состояния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַבֹּקֶר
  choice: наутро
  rationale: Естественное русское повествовательное обозначение следующего утра; точно передаёт временное значение еврейского выражения.
- source_word: בְּצֵאת הַיַּיִן מִנָּבָל
  choice: когда вино вышло из Навала
  rationale: 'Сохранён конкретный и выразительный образ оригинала: буквально вино «вышло» из Навала, то есть опьянение прошло. Смысл пояснён в сноске без замены образа толкованием в основном тексте.'
- source_word: וַתַּגֶּד לוֹ אִשְׁתּוֹ
  choice: жена рассказала ему
  rationale: Глагол נגד в породе хифиль здесь означает сообщить или рассказать; выбран естественный для современного русского повествования вариант.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: обо всём этом
  rationale: דברים может обозначать как слова, так и дела или обстоятельства. В данном контексте жена сообщает о происшедшем, поэтому широкий русский оборот сохраняет контекстуальный смысл.
- source_word: וַיָּמָת לִבּוֹ בְּקִרְבּוֹ
  choice: сердце его умерло в нём
  rationale: Сохранён яркий образ еврейского текста без сведения его к определённому медицинскому диагнозу. Несколько необычный русский оборот передаёт намеренную выразительность оригинала.
- source_word: וְהוּא הָיָה לְאָבֶן
  choice: он стал как камень
  rationale: Естественно передаёт сравнение оригинала и не уточняет, означало ли оно оцепенение, неподвижность или иное физическое состояние.
theological_decisions:
- issue: Следует ли определять состояние Навала как конкретный медицинский приступ
  choice: 'Сохранить образы оригинала: «сердце его умерло в нём» и «он стал как камень»'
  alternative: Передать как сердечный приступ, инсульт, паралич или потерю чувств
  rationale: Еврейский текст описывает состояние Навала образным повествовательным языком и не даёт технического диагноза. Перевод сохраняет эту неопределённость и не привносит отсутствующих в тексте утверждений.
translation_notes:
  register: Современный литературный русский с сохранением лаконичного, выразительного строя древнееврейского повествования. Необычные образы оригинала оставлены в основном тексте и кратко пояснены в сносках.
