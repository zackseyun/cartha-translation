  yaml_path: translation/ot/1_samuel/025/044.yaml
  text: Saul had given Michal his daughter[a], David’s wife, to Palti son of Laish, who was from Gallim.
translation:
  language: ru
  text: А Саул отдал свою дочь Михаль, жену Давида, Палти[a], сыну Лаиша из Галлима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В традиционных русских переводах имя передаётся как «Фалтий» (в этом стихе: «Фалтию»); здесь оно передано по древнееврейской форме: Палти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁאוּל
  choice: А Саул
  rationale: 'Союз ו передан русским «а»: он естественно связывает фразу с предшествующим повествованием, не добавляя временного значения.'
- source_word: נָתַן
  choice: отдал
  rationale: Совершенный вид передаёт завершённое действие. Древнееврейская форма сама по себе не требует плюсквамперфекта, поэтому временное соотношение оставлено контексту.
- source_word: מִיכַל בִּתּוֹ
  choice: свою дочь Михаль
  rationale: Естественный русский порядок слов ясно обозначает Михаль как дочь Саула; имя передано непосредственно с древнееврейского.
- source_word: אֵשֶׁת דָּוִד
  choice: жену Давида
  rationale: Сохранено приложение, согласно которому Михаль названа женой Давида, несмотря на действие Саула.
- source_word: לְפַלְטִי
  choice: Палти
  rationale: Имя транслитерировано по древнееврейской форме פלטי; дательный падеж передаёт направленность действия.
- source_word: בֶן לַיִשׁ
  choice: сыну Лаиша
  rationale: Обычная передача древнееврейского патронимического оборота.
- source_word: אֲשֶׁר מִ/גַּלִּים
  choice: родом из Галлима
  rationale: Оборот естественно выражает происхождение из названного места и относится к представляемому здесь Палти.
theological_decisions:
- issue: Продолжающееся обозначение Михаль как жены Давида
  choice: Сохранено прямое «жену Давида».
  alternative: Не уточнять её отношение к Давиду или переформулировать как «бывшую жену».
  rationale: В источнике стоит אֵשֶׁת דָּוִד без слова «бывшая»; перевод сохраняет юридическую и повествовательную напряжённость, не разрешая её толкованием.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и повествовательный. Имена в основном переданы непосредственно с древнееврейского, а традиционный вариант существенного имени отмечен в сноске.
