  text: שָׂ֥א נָ֖א לְ/פֶ֣שַׁע אֲמָתֶ֑/ךָ כִּ֣י עָשֹֽׂה יַעֲשֶׂה֩ יְהוָ֨ה לַֽ/אדֹנִ֜/י בַּ֣יִת נֶאֱמָ֗ן כִּי מִלְחֲמ֤וֹת יְהוָה֙ אֲדֹנִ֣/י נִלְחָ֔ם וְ/רָעָ֛ה לֹא תִמָּצֵ֥א בְ/ךָ֖ מִ/יָּמֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/028.yaml
  text: Please forgive the transgression of your servant[a], for Yahweh will surely make my lord a lasting house, because my lord fights Yahweh’s battles, and evil will not be found in you all your days.
translation:
  language: ru
  text: Прости, прошу, проступок твоей рабы, ибо Яхве непременно создаст для моего господина прочный дом[a], потому что мой господин ведёт войны Яхве, и во все дни твоей жизни не найдётся в тебе зла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть устойчивый род или долговечная династия; слово «дом» здесь обозначает не жилой дом, а линию потомков.
    reason: Лексико-контекстуальное пояснение метафорического значения בַּיִת נֶאֱמָן.
lexical_decisions:
- source_word: שָׂא נָא לְפֶשַׁע
  choice: Прости, прошу, проступок
  rationale: Еврейская идиома буквально говорит о несении проступка, но в данном обращении означает прощение; «прошу» передаёт силу частицы נָא.
- source_word: אֲמָתֶךָ
  choice: твоей рабы
  rationale: Сохраняет женский род и самоуничижительную форму обращения Авигеи; в современном литературном русском звучит естественнее, чем «служанки» в этой торжественной речи.
- source_word: עָשֹׂה יַעֲשֶׂה
  choice: непременно утвердит
  rationale: Конструкция с абсолютным инфинитивом усиливает уверенность высказывания. «Утвердит» естественно выражает создание устойчивого династического дома, хотя буквально глагол означает «сделает».
- source_word: בַּיִת נֶאֱמָן
  choice: прочный дом
  rationale: Сохраняется библейская метафора дома как устойчивого рода или династии; «прочный» передаёт надёжность и долговечность נֶאֱמָן.
- source_word: מִלְחֲמוֹת יְהוָה ... נִלְחָם
  choice: ведёт войны Яхве
  rationale: Передаёт устойчивую или продолжающуюся деятельность, выраженную причастием; «войны» точнее соответствует множественному מִלְחָמוֹת.
- source_word: וְרָעָה
  choice: зла
  rationale: Сохраняет широкое значение רָעָה — нравственное зло, дурной поступок или беда — не сводя его только к одной стороне смысла.
- source_word: לֹא תִמָּצֵא בְךָ מִיָּמֶיךָ
  choice: во все дни твои не найдётся в тебе
  rationale: Сохраняет образное выражение «не найдётся в тебе» и передаёт מִיָּמֶיךָ как охват всей жизни.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Династический смысл слова «дом»
  choice: прочный дом
  alternative: устойчивую династию; верный дом
  rationale: Контекст указывает на продолжительный род Давида, однако сохранение слова «дом» удерживает библейскую метафору и её межтекстовые связи, не превращая подразумеваемую династию в явное толкование.
- issue: Смысл רָעָה применительно к Давиду
  choice: зло не найдётся в тебе
  alternative: беда не постигнет тебя; за тобой не найдётся злодеяния
  rationale: Фраза допускает оттенки нравственного зла и бедствия. Основной текст сохраняет широкую формулировку и не решает однозначно, говорит ли Авигея прежде всего о характере, вине или несчастье.
translation_notes:
  register: Современный литературный русский с достойным, слегка торжественным строем речи. Инверсия «во все дни твои» сохраняет библейскую возвышенность, оставаясь понятной современному читателю.
