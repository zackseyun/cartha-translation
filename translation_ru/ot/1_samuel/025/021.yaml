  text: וְ/דָוִ֣ד אָמַ֗ר אַךְ֩ לַ/שֶּׁ֨קֶר שָׁמַ֜רְתִּי אֶֽת כָּל אֲשֶׁ֤ר לָ/זֶה֙ בַּ/מִּדְבָּ֔ר וְ/לֹא נִפְקַ֥ד מִ/כָּל אֲשֶׁר ל֖/וֹ מְא֑וּמָה וַ/יָּֽשֶׁב לִ֥/י רָעָ֖ה תַּ֥חַת טוֹבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/021.yaml
  text: David had said, “Surely I have guarded all that belongs to this man in the wilderness for nothing, so that not a thing of all that belonged to him was missing; and he has repaid me evil for good.”
translation:
  language: ru
  text: 'Давид сказал: «Напрасно я оберегал в пустыне всё, что принадлежало этому человеку, и из всего, что принадлежало ему, ничего не пропало, а он отплатил мне злом за добро».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַר
  choice: говорил
  rationale: Форма qatal в данном повествовательном контексте передаёт предшествующую или продолжающуюся внутреннюю речь Давида; русское «говорил» естественно связывает стих с разворачивающимся эпизодом, не добавляя отдельного временного наречия.
- source_word: אַךְ לַשֶּׁקֶר
  choice: напрасно
  rationale: Сочетание выражает мысль о бесполезности и отсутствии ожидаемой отдачи; «напрасно» естественно и точно передаёт жалобу Давида.
- source_word: שָׁמַרְתִּי
  choice: я оберегал
  rationale: Глагол обозначает охрану и сохранение имущества Навала; «оберегал» передаёт активную защиту без излишне официального оттенка.
- source_word: כָּל אֲשֶׁר לָזֶה
  choice: всё, что принадлежит этому человеку
  rationale: Сохранено указательное, слегка отчуждённое обозначение Навала — «этому человеку».
- source_word: וְלֹא נִפְקַד ... מְאוּמָה
  choice: из всего его имущества ничего не пропало
  rationale: Идиома буквально говорит, что ничто не оказалось недостающим; русский оборот ясно передаёт отсутствие какой-либо потери.
- source_word: וַיָּשֶׁב לִי רָעָה תַּחַת טוֹבָה
  choice: а он отплатил мне злом за добро
  rationale: Устойчивое русское выражение точно воспроизводит противопоставление зла и добра и идею воздаяния.
theological_decisions:
- issue: Оценка притязаний Давида на вознаграждение
  choice: Передать слова как прямую жалобу Давида без авторского одобрения или осуждения
  alternative: Уточнить, что Давид действительно заслуживал плату, либо осудить его ожидания
  rationale: Еврейский текст сообщает субъективную речь Давида и сохраняет повествовательное напряжение; перевод не должен заранее разрешать нравственную оценку его намерений.
translation_notes:
  register: Современный литературный русский язык; речь выразительная, но не архаичная. Порядок фраз слегка упорядочен ради естественного русского синтаксиса при сохранении всех смысловых компонентов оригинала.
