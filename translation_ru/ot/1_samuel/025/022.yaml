  text: כֹּה יַעֲשֶׂ֧ה אֱלֹהִ֛ים לְ/אֹיְבֵ֥י דָוִ֖ד וְ/כֹ֣ה יֹסִ֑יף אִם אַשְׁאִ֧יר מִ/כָּל אֲשֶׁר ל֛/וֹ עַד הַ/בֹּ֖קֶר מַשְׁתִּ֥ין בְּ/קִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/022.yaml
  text: May God do so to David’s enemies[a], and more also[b], if by morning I leave so much as one male of all who belong to him.
translation:
  language: ru
  text: Пусть Бог так поступит с врагами Давида[a] и ещё больше сделает, если к утру я оставлю хотя бы одного мужчину[b] из всех, кто ему принадлежит!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые толкователи считают слова «врагами Давида» писцовой заменой слов «Давидом» или «мной», поскольку такая клятва обычно призывает проклятие на самого говорящего.
    reason: textual_variant
  - marker: b
    text: 'Буквально: «мочащегося к стене» — грубоватое древнееврейское выражение, обозначающее мужчину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה ... וְכֹה יֹסִיף
  choice: Пусть Бог так поступит ... и ещё больше сделает
  rationale: Передаёт обычную древнееврейскую формулу клятвы-проклятия, сохраняя её усиление и не уточняя содержание подразумеваемой кары.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на грамматическую форму множественного числа, согласование и контекст указывают на единственного Бога.
- source_word: לְאֹיְבֵי דָוִד
  choice: с врагами Давида
  rationale: Сохраняется трудное масоретское чтение без молчаливого исправления на «с Давидом» или «со мной».
- source_word: אִם
  choice: если
  rationale: В формуле клятвы вводит условие, при нарушении которого на говорящего должна пасть подразумеваемая кара.
- source_word: אַשְׁאִיר
  choice: оставлю
  rationale: Передаёт каузативное значение «оставить, позволить остаться» без дополнительного истолкования словом «пощажу».
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: из всех, кто ему принадлежит
  rationale: Контекст и следующая идиома указывают на людей; личная конструкция естественна по-русски.
- source_word: עַד הַבֹּקֶר
  choice: к утру
  rationale: Естественно выражает предельный срок действия.
- source_word: מַשְׁתִּין בְּקִיר
  choice: хотя бы одного мужчину
  rationale: Грубоватая буквальная идиома обозначает мужчину; «хотя бы одного» передаёт смысл угрозы не оставить ни одного, а буквальная форма вынесена в сноску.
theological_decisions:
- issue: Масоретское чтение «врагами Давида» в формуле клятвы
  choice: Сохранить «с врагами Давида» в основном тексте
  alternative: Передать «с Давидом» или «со мной», считая масоретскую форму благочестивой писцовой заменой
  rationale: Предоставленный еврейский текст прямо говорит о врагах Давида. Необычность самопроклятия сохраняется, а вероятное объяснение сообщается в сноске без молчаливой правки текста.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией клятвы. Необычное масоретское чтение и грубая исходная идиома не сглажены без пояснения; сноски стоят непосредственно при соответствующих выражениях.
