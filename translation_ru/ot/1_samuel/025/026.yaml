  text: וְ/עַתָּ֣ה אֲדֹנִ֗/י חַי יְהוָ֤ה וְ/חֵֽי נַפְשְׁ/ךָ֙ אֲשֶׁ֨ר מְנָעֲ/ךָ֤ יְהוָה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הוֹשֵׁ֥עַ יָדְ/ךָ֖ לָ֑/ךְ וְ/עַתָּ֗ה יִֽהְי֤וּ כְ/נָבָל֙ אֹיְבֶ֔י/ךָ וְ/הַֽ/מְבַקְשִׁ֥ים אֶל אֲדֹנִ֖/י רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/026.yaml
  text: '[A], my lord, as Yahweh lives and as you yourself live, since Yahweh has kept you from bloodguilt and from saving yourself by your own hand[b], now let your enemies and those who seek evil against my lord be like Nabal.'
translation:
  language: ru
  text: И теперь, господин мой, — жив Яхве и жив ты сам! — поскольку Яхве не дал тебе навлечь на себя вину за пролитую кровь и спасти себя собственной рукой[a], пусть теперь твои враги и те, кто замышляет зло против господина моего, будут как Навал[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу контекста: «отомстить за себя собственной рукой».'
    reason: lexical_alternative
  - marker: b
    text: Здесь имеется в виду человек по имени Навал; вместе с тем это имя перекликается с еврейским словом «глупец».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь / пусть теперь
  rationale: 'Оба употребления וְעַתָּה переданы явно: первое продолжает речь Авигеи, второе вводит её пожелание.'
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Почтительное обращение Авигеи к Давиду; оно не обозначает здесь божество.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: жив Яхве и жив ты сам
  rationale: Передаёт формулу клятвы и идиоматическое значение נֶפֶשׁ как самой личности адресата, не превращая выражение в утверждение исключительно о душе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: מְנָעֲךָ
  choice: не дал тебе
  rationale: Естественно передаёт значение предотвращения или удерживания в данном контексте.
- source_word: מִבּוֹא בְדָמִים
  choice: навлечь на себя вину за пролитую кровь
  rationale: 'Сохраняет нравственно-правовой оттенок множественного דָּמִים: речь не только о кровопролитии, но и о возникающей из-за него виновности.'
- source_word: וְהוֹשֵׁעַ יָדְךָ לָךְ
  choice: спасти себя собственной рукой
  rationale: Следует основному значению корня ישׁע и сохраняет трудность идиомы; контекстуальное значение мести пояснено в сноске.
- source_word: יִהְיוּ כְנָבָל
  choice: станут как Навал
  rationale: В непосредственном контексте נָבָל прежде всего имя мужа Авигеи; созвучное значение «глупец» отмечено в сноске.
- source_word: הַמְבַקְשִׁים אֶל אֲדֹנִי רָעָה
  choice: те, кто замышляет зло против господина моего
  rationale: Естественная русская передача устойчивого выражения о намерении причинить зло или вред.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя Бога, не подменяя его титулом.
- issue: Смысл предотвращённого поступка Давида
  choice: Яхве не дал Давиду навлечь на себя вину за кровопролитие и спасти себя собственной рукой.
  alternative: Яхве удержал Давида от кровопролития и от мести собственной рукой.
  rationale: Основной текст сохраняет значение «спасать» у ישׁע и одновременно выражает виновность, подразумеваемую בְדָמִים; более явное контекстуальное понимание как личной мести вынесено в сноску.
- issue: Значение נֶפֶשׁ в формуле клятвы
  choice: жив ты сам
  alternative: жива душа твоя
  rationale: В этой формуле נֶפֶשׁ обозначает жизнь или самого человека; выбранный вариант понятен современному читателю и не навязывает антропологического противопоставления души и тела.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной речи. Формула клятвы слегка приподнята, но остаётся понятной; оба явных וְעַתָּה сохранены. Тире выделяют клятвенную вставку и облегчают восприятие длинного предложения.
