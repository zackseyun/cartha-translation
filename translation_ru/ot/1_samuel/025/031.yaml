base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/031.yaml
  text: 'And this will not be a cause of grief to you or a stumbling block of heart to my lord: either that you have shed blood without cause or that my lord has avenged himself[a]. And when Yahweh has dealt well with my lord[d][c][b], then remember your servant.'
translation:
  language: ru
  text: И это не станет для господина моего причиной мучительного сожаления[a] и преткновением для сердца[b] из-за того, что господин мой прольёт кровь без причины и сам себя избавит[c]. А когда Яхве облагодетельствует господина моего, вспомни о своей рабыне[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Редкое еврейское слово может означать причину потрясения, преткновения или мучительного раскаяния.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «преткновением сердца»; то есть внутренним нравственным бременем или угрызением совести.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «господин мой спасёт (или избавит) себя». В данном контексте это, вероятно, относится к тому, что Давид самовольно добьётся возмездия за себя.'
    reason: lexical_alternative
  - marker: d
    text: Еврейское слово означает «твоя рабыня» и является смиренным самообозначением Авигеи.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפוּקָה
  choice: причиной мучительного сожаления
  rationale: Редкое существительное обозначает нечто вызывающее потрясение, спотыкание или позднее болезненное раскаяние. В контексте речь о будущем нравственном сожалении Давида; перевод передаёт вероятный смысл, не сводя его просто к печали.
- source_word: מִכְשׁוֹל לֵב
  choice: преткновением для сердца
  rationale: Сохранён конкретный образ «препятствия/преткновения сердца», указывающий на внутреннее нравственное бремя или угрызения совести.
- source_word: לַאדֹנִי / אֲדֹנִי
  choice: господина моего / господин мой
  rationale: Почтительное обращение Авигеи к Давиду; в данном контексте слово не обозначает божество.
- source_word: לִשְׁפָּךְ דָּם חִנָּם
  choice: безвинно пролил кровь
  rationale: חִנָּם здесь означает кровопролитие без достаточного основания, то есть невинную или неоправданную кровь, а не действие «даром».
- source_word: לְהוֹשִׁיעַ ... לוֹ
  choice: сам добился для себя избавления
  rationale: Буквально глагол связан со спасением или избавлением. Формулировка сохраняет эту лексику и рефлексивность выражения, тогда как контекст указывает на самостоятельную насильственную расправу; это пояснено в сноске.
- source_word: וְהֵיטִב יְהוָה
  choice: когда Яхве облагодетельствует
  rationale: Последовательная форма в речи Авигеи имеет будущее временное значение. «Облагодетельствует» естественно передаёт благотворное действие Бога по отношению к Давиду.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֲמָתֶךָ
  choice: своей рабыне
  rationale: Слово явно женского рода и служит смиренным самообозначением Авигеи; русский перевод сохраняет и пол, и социально-речевой оттенок.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте употреблено собственное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Значение לְהוֹשִׁיעַ ... לוֹ в контексте мести
  choice: сам добился для себя избавления
  alternative: сам отомстил за себя
  rationale: Основное значение ישׁע — «спасать, избавлять». Контекст допускает смысл самовольной мести, однако перевод сохраняет необычную исходную формулировку и выносит контекстуальное толкование в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Почтительное «господин мой» сохраняет социальную дистанцию и настойчивую учтивость Авигеи. Редкие и неоднозначные образы исходного текста сохранены в основном тексте и пояснены сносками.
