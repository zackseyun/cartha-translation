base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/006.yaml
  text: 'And say this: ‘To the living one: Peace to you[a], peace to your house[b], and peace to all that is yours.’'
translation:
  language: ru
  text: 'И скажите ему: «Долгой тебе жизни![a] Мир тебе[b], мир твоему дому и мир всему, что у тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально означает «к жизни»; возможно также понимание «живущему». Вероятно, это приветствие или благопожелание; возможны переводы: «Живи долго!», «Привет!» или «Живущему».'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово «шалом» означает не только мир, но также благополучие, целость и процветание.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם כֹּה
  choice: И скажите ему так
  rationale: Вав с перфектом продолжает повеление Давида; русское «скажите» естественно передаёт директивную силу. Местоимение «ему» проясняет подразумеваемого адресата, а «так» вводит прямую речь.
- source_word: לֶחָי
  choice: Живи долго!
  rationale: Буквально трудное «к жизни / живущему» в данном контексте, вероятнее всего, представляет собой приветствие или благопожелание. «Живи долго!» сохраняет оттенок пожелания жизни и звучит естественно по-русски; неоднозначность отмечена в сноске.
- source_word: וְאַתָּה שָׁלוֹם
  choice: Мир тебе
  rationale: Краткая безглагольная формула передаёт пожелание благополучия и сохраняет обращение во втором лице.
- source_word: וּבֵיתְךָ שָׁלוֹם
  choice: мир твоему дому
  rationale: «Дом» сохраняет еврейский образ и в контексте охватывает семью и домочадцев.
- source_word: וְכֹל אֲשֶׁר לְךָ שָׁלוֹם
  choice: и мир всему, что у тебя
  rationale: Формулировка достаточно широка, чтобы включать всё принадлежащее Навалу и находящееся под его попечением, и сохраняет троекратное повторение слова «мир».
- source_word: שָׁלוֹם
  choice: мир
  rationale: Традиционное и лаконичное соответствие, сохраняющее повтор в исходном тексте; более широкий смысл благополучия, целости и процветания пояснён в сноске.
