base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/009.yaml
  text: When David’s young men came[a], they spoke to Nabal all these words in David’s name, and then they rested.
translation:
  language: ru
  text: Когда люди Давида пришли, они сказали Навалу от имени Давида все эти слова и умолкли[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остановились»; возможно также: «стали ждать». Еврейский глагол обычно означает «покоиться, останавливаться» и здесь, вероятно, указывает, что посланцы закончили говорить и ожидали ответа Навала.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי
  choice: люди
  rationale: В данном контексте נַעַר обозначает посланцев и приближённых Давида, а не обязательно юношей; «люди Давида» естественно и без возрастного сужения передаёт смысл.
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: Прямое и естественное соответствие обычному глаголу בוא в последовательном повествовании.
- source_word: וַיְדַבְּרוּ אֶל
  choice: передали Навалу
  rationale: Хотя буквально это «сказали Навалу», в контексте посольства глагол передаёт сообщение; «передали» естественно связывается со словами, произнесёнными от имени Давида.
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: Сохраняет словесную конкретность דְּבָרִים и указывает, что посланцы точно изложили предшествующее обращение.
- source_word: בְּשֵׁם דָּוִד
  choice: от имени Давида
  rationale: Передаёт значение представительства и полномочия в естественной современной русской форме.
- source_word: וַיָּנוּחוּ
  choice: умолкли
  rationale: Основное значение נוח связано с покоем или прекращением действия; после передачи речи контекстуально вероятен смысл «перестали говорить, замолчали», без добавления прямо не выраженного ожидания ответа.
