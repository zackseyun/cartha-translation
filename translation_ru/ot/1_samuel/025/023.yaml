  text: וַ/תֵּ֤רֶא אֲבִיגַ֨יִל֙ אֶת דָּוִ֔ד וַ/תְּמַהֵ֕ר וַ/תֵּ֖רֶד מֵ/עַ֣ל הַ/חֲמ֑וֹר וַ/תִּפֹּ֞ל לְ/אַפֵּ֤י דָוִד֙ עַל פָּנֶ֔י/הָ וַ/תִּשְׁתַּ֖חוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/023.yaml
  text: When Abigail saw David[a], she hurried and got down from the donkey, and fell before David on her face and bowed to the ground.
translation:
  language: ru
  text: Увидев Давида, Авигея поспешно сошла с осла, пала ниц перед Давидом и поклонилась до земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёрлась на земле». Еврейский глагол может обозначать глубокий поклон или простирание ниц; здесь речь идёт о почтении перед Давидом, а не обязательно о религиозном поклонении.'
    reason: Лексическая альтернатива сохраняет диапазон значения שׁחה в контексте почтения человеку.
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: увидев
  rationale: Обычное значение ראה — «видеть». Деепричастие естественно связывает первое действие с последующей поспешной реакцией, сохраняя последовательность повествования.
- source_word: וַתְּמַהֵר
  choice: поспешно
  rationale: מהר передаёт быстрое, безотлагательное действие; «поспешно» звучит естественно и сохраняет напряжённый темп рассказа.
- source_word: וַתֵּרֶד מֵעַל הַחֲמוֹר
  choice: сошла с осла
  rationale: ירד буквально означает движение вниз; в контексте езды на животном современное русское «сошла с осла» точно и естественно.
- source_word: וַתִּפֹּל לְאַפֵּי דָוִד עַל פָּנֶיהָ
  choice: пала ниц перед Давидом
  rationale: Формула передаёт и положение перед Давидом, и падение лицом вниз, не добавляя отсутствующего в еврейском тексте упоминания ног.
- source_word: וַתִּשְׁתַּחוּ אָרֶץ
  choice: поклонилась до земли
  rationale: Встреча с человеком требует значения почтительного земного поклона, а не обязательного религиозного поклонения; выражение сохраняет направленность жеста к земле.
theological_decisions:
- issue: Значение שׁחה при обращении к человеку
  choice: поклонилась до земли
  alternative: простёрлась на земле; поклонилась
  rationale: Здесь жест обращён к Давиду и выражает глубокое почтение и покорность. Перевод не вводит идею богопоклонения, но сохраняет возможность понимать действие как полный земной поклон.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной повествовательной интонацией. «Пала ниц» — понятное устойчивое выражение, точно передающее телесную позу; имена даны в традиционной русской библейской форме.
