  text: וְ/הָ֣/אֲנָשִׁ֔ים טֹבִ֥ים לָ֖/נוּ מְאֹ֑ד וְ/לֹ֤א הָכְלַ֨מְנוּ֙ וְ/לֹֽא פָקַ֣דְנוּ מְא֔וּמָה כָּל יְמֵי֙ הִתְהַלַּ֣כְנוּ אִתָּ֔/ם בִּֽ/הְיוֹתֵ֖/נוּ בַּ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/015.yaml
  text: Yet the men were very good to us[a], and we were not mistreated[b], nor did we miss anything all the days we went about with them while we were in the field.
translation:
  language: ru
  text: 'А те люди были очень добры к нам: нас не унижали[a], и у нас ничего не пропало[b] за всё время, пока мы ходили с ними, находясь в поле.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нас не позорили»; «нас не оскорбляли».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мы ничего не лишились»; «у нас ничего не недоставало».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: А те люди
  rationale: Существительное означает «люди, мужчины»; союз וְ передан как «а», поскольку речь противопоставляет свидетельство слуг враждебной оценке Навала.
- source_word: טֹבִים לָנוּ מְאֹד
  choice: были очень добры к нам
  rationale: Конструкция טוֹב с לְ описывает доброе, благожелательное отношение; «очень добры к нам» естественно звучит по-русски и сохраняет усиление מְאֹד.
- source_word: וְלֹא הָכְלַמְנוּ
  choice: нас не унижали
  rationale: 'Хофаль глагола כלם имеет пассивный смысл: их не подвергали унижению, не позорили и не оскорбляли. Формулировка сохраняет этот смысл без более общего «не обижали».'
- source_word: וְלֹא פָקַדְנוּ מְאוּמָה
  choice: и у нас ничего не пропало
  rationale: В данном контексте отрицательная конструкция с פקד указывает, что никакой утраты не обнаружилось; речь, вероятно, об имуществе или стаде.
- source_word: כָּל יְמֵי
  choice: за всё время
  rationale: Естественный русский эквивалент временного выражения, обозначающего весь период.
- source_word: הִתְהַלַּכְנוּ אִתָּם
  choice: пока мы ходили с ними
  rationale: Хитпаэль от הלך передаёт продолжительное или повторяющееся передвижение и пребывание рядом; «ходили с ними» сохраняет этот оттенок.
- source_word: בִּהְיוֹתֵנוּ בַּשָּׂדֶה
  choice: находясь в поле
  rationale: Временная конструкция указывает на пребывание в поле или открытой местности; выбран буквальный и понятный русский вариант.
