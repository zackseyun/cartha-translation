  yaml_path: translation/ot/1_samuel/025/030.yaml
  text: And when Yahweh has done for my lord according to all the good that he spoke concerning you[a], and has appointed you ruler over Israel[b],
translation:
  language: ru
  text: И когда Яхве сделает для моего господина всё доброе, что Он сказал о тебе[a], и поставит тебя правителем над Израилем[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё доброе, которое Он обещал тебе». Буквально в еврейском тексте говорится о «добре», которое Яхве сказал о Давиде.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «повелит тебе быть вождём над Израилем» или «поручит тебе быть вождём над Израилем». Употреблённый глагол обычно означает «повелевать», но здесь может иметь смысл назначения или уполномочивания на правление.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Естественно передаёт еврейский оборот, вводящий ожидаемое будущее событие, и сохраняет связь с продолжением речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לַאדֹנִי
  choice: для моего господина
  rationale: Сохраняет почтительное обращение Авигеи к Давиду; «господин» уместнее в данном повествовательном и социальном контексте, чем «господин-хозяин» или «владыка».
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר אֶת הַטּוֹבָה עָלֶיךָ
  choice: всё то доброе, что Он говорил о тебе
  rationale: Сохраняет глагол «говорить», не превращая его без пояснения в более определённое «обещать»; выражение относится к благу, возвещённому Богом о Давиде.
- source_word: וְצִוְּךָ
  choice: и поставит тебя
  rationale: В сочетании с обозначением руководящей должности глагол выражает назначение или уполномочивание, хотя его обычное значение — «повелевать».
- source_word: לְנָגִיד
  choice: правителем
  rationale: Передаёт человека, поставленного во главе народа, ясным современным словом без излишне архаичного оттенка.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог обозначает власть и руководство по отношению к Израилю.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Характер сказанного Богом о Давиде
  choice: что Он говорил о тебе
  alternative: что Он обещал тебе
  rationale: Основной текст сохраняет лексическую неопределённость глагола דבר «говорить», тогда как контекст позволяет понимать сказанное как благоприятное обещание; это отражено в сноске.
- issue: Значение וְצִוְּךָ перед לְנָגִיד
  choice: и поставит тебя правителем
  alternative: и повелит тебе быть правителем; и уполномочит тебя как вождя
  rationale: Контекст должности поддерживает значение назначения или уполномочивания, но обычное значение глагола «повелевать» не скрыто и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Сохранено почтительное «мой господин» и незавершённое синтаксическое продолжение стиха, отмеченное конечной запятой. Местоимение «Он» написано с прописной буквы по традиции русского библейского стиля, без добавления конфессионально специфической терминологии.
