lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал
  rationale: Форма с последовательным вавом передаёт простое событие прошлого; «услышал» прямо и естественно соответствует שׁמע, не добавляя оттенка «узнал».
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает необжитую, пустынную местность, не обязательно песчаную пустыню; выражение также естественно указывает, где находился Давид, когда получил известие.
- source_word: כִּי
  choice: что
  rationale: Здесь כִּי вводит содержание услышанного.
- source_word: גֹזֵז
  choice: стрижёт
  rationale: Причастие выражает продолжающееся в тот момент действие. Русское настоящее время после глагола прошедшего времени естественно передаёт одновременность в придаточном изъяснительном.
- source_word: נָבָל
  choice: Навал
  rationale: Имя передано традиционной русской библейской транслитерацией.
- source_word: אֶת צֹאנוֹ
  choice: своих овец
  rationale: צֹאן может собирательно обозначать мелкий скот, включая овец и коз, но в контексте стрижки наиболее естественно и конкретно «овец». Возвратное «своих» ясно соотносит стадо с Навалом.
