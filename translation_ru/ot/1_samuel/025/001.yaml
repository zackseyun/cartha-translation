base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/001.yaml
  text: Samuel died[a], and all Israel gathered and mourned for him, and they buried him at his house in Ramah. Then David arose and went down to the wilderness of Paran.
translation:
  language: ru
  text: Самуил умер, и весь Израиль собрался, оплакал его[a] и похоронил при его доме в Раме. Затем Давид встал и спустился в пустыню Фаран.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершал по нему погребальный плач». Еврейский глагол относится к траурному оплакиванию умершего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת שְׁמוּאֵל
  choice: Самуил умер
  rationale: Прямо передаёт смерть Самуила; начальный повествовательный союз не требует отдельного русского слова.
- source_word: וַיִּקָּבְצוּ כָל יִשְׂרָאֵל
  choice: весь Израиль собрался
  rationale: Сохраняет коллективное национальное выражение כָל יִשְׂרָאֵל и естественно согласует его с глаголом в русском языке.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: оплакивал его
  rationale: Глагол обозначает траурный плач и обряды скорби по умершему; «оплакивал» ясно и естественно передаёт основной смысл.
- source_word: וַיִּקְבְּרֻהוּ
  choice: похоронил
  rationale: Прямо передаёт действие с Самуилом как объектом; единственное число согласовано с коллективным «весь Израиль».
- source_word: בְּבֵיתוֹ
  choice: у его дома
  rationale: Сохраняет связь погребения с домом или семейным владением Самуила, не утверждая однозначно, что тело было погребено внутри жилого здания.
- source_word: בָּרָמָה
  choice: в Раме
  rationale: Естественная русская локативная форма традиционной передачи топонима רָמָה.
- source_word: וַיָּקָם דָּוִד
  choice: Затем Давид встал
  rationale: Передаёт и повествовательный переход, и буквальное движение, выраженное глаголом קום.
- source_word: וַיֵּרֶד אֶל מִדְבַּר פָּארָן
  choice: спустился в пустыню Фаран
  rationale: Сохраняет топографическое значение ירד «спускаться» и конструкцию «пустыня Фаран».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным ритмом. Коллективное выражение «весь Израиль» сохранено; глаголы согласованы с ним в единственном числе. Формулировка «у его дома» оставляет открытым, идёт ли речь о самом доме или о принадлежавшем Самуилу семейном владении.
