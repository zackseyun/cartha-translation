  yaml_path: translation/ot/1_samuel/025/024.yaml
  text: She fell at his feet and said[a], “On me, my lord, be the guilt. Please let your servant speak in your hearing[b], and hear the words of your servant.”
translation:
  language: ru
  text: 'Она пала к его ногам и сказала: «На мне, господин мой, вина! Прошу, дай твоей рабыне сказать в твоём присутствии и выслушай слова твоей рабыни».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּפֹּל עַל־רַגְלָיו
  choice: Она пала к его ногам
  rationale: Передаёт буквальный образ и обычный жест мольбы и покорности; «пала» сохраняет достоинство повествовательного стиля.
- source_word: בִּי אֲנִי אֲדֹנִי הֶעָוֹן
  choice: На мне, господин мой, вина!
  rationale: Сохраняет сжатую конструкцию принятия вины на себя и порядок ключевых элементов еврейской фразы, оставаясь понятной по-русски.
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Здесь это почтительное обращение Авигеи к Давиду, а не божественный титул; такой порядок слов соответствует возвышенной просительной речи.
- source_word: וּתְדַבֶּר־נָא
  choice: Позволь же ... говорить
  rationale: Передаёт вежливую настойчивую просьбу, выраженную частицей נָא и формой глагола.
- source_word: אֲמָתְךָ / אֲמָתֶךָ
  choice: твоя рабыня / твоей рабыни
  rationale: Еврейское слово имеет женский род и служит формулой самоуничижительного обращения; «рабыня» естественно сохраняет этот оттенок и повтор оригинала.
- source_word: בְּאָזְנֶיךָ
  choice: тебе
  rationale: Буквально «в твои уши»; по-русски «говорить тебе» естественно передаёт идиому непосредственного обращения без неуместного буквализма.
- source_word: וּשְׁמַע אֵת דִּבְרֵי
  choice: и выслушай слова
  rationale: «Выслушай» в контексте просьбы точнее обычного «услышь» выражает просьбу внимательно принять речь, а «слова» сохраняет формулировку оригинала.
