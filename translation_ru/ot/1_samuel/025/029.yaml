base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/029.yaml
  text: Though a man has risen to pursue you and to seek your life[a], yet the life of my lord shall be bound in the bundle of the living with Yahweh your God[b], and the lives of your enemies he shall sling out from the hollow of the sling.
translation:
  language: ru
  text: Хотя человек и восстал, чтобы преследовать тебя и искать твоей жизни, жизнь моего господина будет завязана в узле живых[a] у Яхве, Бога твоего, а жизни твоих врагов Он метнёт из чаши пращи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будет завязана в узле живых». Это образ жизни, надёжно связанной и хранимой у Бога.'
    reason: Поясняет необычную еврейскую метафору, не приписывая ей учения о загробной жизни.
  - marker: b
    text: 'Буквально: «Он метнёт их из середины чаши пращи». Еврейский глагол означает метание пращой и намеренно противопоставлен образу надёжно завязанного узла.'
    reason: Передаёт значение глагола и словесный контраст без добавления не названного в оригинале камня.
lexical_decisions:
- source_word: וַיָּקָם אָדָם
  choice: Хотя человек и восстал
  rationale: В данном контексте waw + qatal вводит уступительное обстоятельство. Единственное число и мужской род אָדָם сохранены словом «человек»; в контексте подразумевается конкретный преследователь.
- source_word: לִרְדָפְךָ וּלְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: чтобы преследовать тебя и искать твоей жизни
  rationale: רדף передаёт враждебное преследование, а נֶפֶשׁ здесь означает жизнь, которой хотят лишить человека. Оборот «искать чьей-либо жизни» уместен в возвышенной библейской речи.
- source_word: נֶפֶשׁ אֲדֹנִי
  choice: жизнь господина моего
  rationale: נֶפֶשׁ означает жизнь или самого человека; формула «господина моего» сохраняет почтительное обращение Авигеи к Давиду.
- source_word: צְרוּרָה בִּצְרוֹר הַחַיִּים
  choice: будет завязана в узле живых
  rationale: Сохранён конкретный образ чего-то связанного и надёжно хранимого. «Живых» отражает форму הַחַיִּים и не превращает метафору в явное учение о загробной жизни.
- source_word: אֵת יְהוָה אֱלֹהֶיךָ
  choice: у Яхве, Бога твоего
  rationale: אֵת выражает пребывание при Боге или в Его хранении. Русское «у» естественно передаёт близость и сохранность, не добавляя отсутствующего в тексте пояснения.
- source_word: וְאֵת נֶפֶשׁ אֹיְבֶיךָ
  choice: а жизни врагов твоих
  rationale: Единственное נֶפֶשׁ имеет собирательное значение при существительном во множественном числе; по-русски естественнее множественное «жизни». Союз «а» ясно выражает контраст.
- source_word: יְקַלְּעֶנָּה בְּתוֹךְ כַּף הַקָּלַע
  choice: Он выбросит, как камень из пращи
  rationale: Глагол קלע прямо вызывает образ метания пращой. Сравнение с камнем естественно раскрывает эллиптический образ по-русски, сохраняя намеренный контраст между надёжно завязанной жизнью Давида и отброшенными жизнями врагов.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
theological_decisions:
- issue: «Узел живых» и возможное указание на загробную жизнь
  choice: Сохранить конкретную метафору надёжного хранения жизни у Бога без догматического уточнения.
  alternative: Истолковать выражение как прямое обещание вечной жизни.
  rationale: Еврейский текст говорит о Божьем сохранении Давида посредством образа завязанного узла, но сам по себе не формулирует развитого учения о посмертной участи.
- issue: Контраст участи Давида и его врагов
  choice: Сохранить противопоставление связанного для хранения и выброшенного из пращи.
  alternative: Передать обобщённо как защиту Давида и поражение врагов.
  rationale: Предметная образность существенна для смысла стиха и, вероятно, особенно выразительна в обращении к Давиду, известному применением пращи.
- issue: Неявное подлежащее יְקַלְּעֶנָּה
  choice: «Он» с прописной буквы, относящееся к Яхве.
  alternative: Повторить «Яхве выбросит» или оставить без явно названного деятеля.
  rationale: Из ближайшего контекста субъектом действия является Яхве; местоимение сохраняет связность и не перегружает фразу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским строем. Инверсия «господина моего», «Бога твоего» и оборот «искать твоей жизни» сохраняют достоинство речи Авигеи, оставаясь понятными. Образы узла и пращи сохранены; наиболее трудный эллиптический оборот пращи слегка прояснён в основном тексте и буквально представлен в сноске.
