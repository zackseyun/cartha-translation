  source_fidelity: 'Начало стиха и образ сохранения жизни переданы в целом точно: уступительное «Хотя ... восстал», «искать твоей жизни», «жизнь моего господина», «узел живых» и связь с Яхве отражают еврейский текст без догматического расширения. Однако «выбросит, как камень из пращи» добавляет отсутствующее в оригинале слово «камень» и превращает образ действия пращой в сравнение. Следует передать само пращевое метание врагов.'
