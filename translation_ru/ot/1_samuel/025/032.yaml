  text: וַ/יֹּ֥אמֶר דָּוִ֖ד לַ/אֲבִיגַ֑ל בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֧ר שְׁלָחֵ֛/ךְ הַ/יּ֥וֹם הַ/זֶּ֖ה לִ/קְרָאתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/032.yaml
  text: David said to Abigail[a], “Blessed be Yahweh, the God of Israel, who sent you this day to meet me.”
translation:
  language: ru
  text: 'Давид сказал Авигее: «Благословен Яхве, Бог Израиля, который послал тебя сегодня[a] мне навстречу!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в этот день».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Последовательная форма глагола продолжает повествование; в современном русском повторяющийся союз «и» перед глаголом речи можно естественно опустить.
- source_word: לַאֲבִיגַל
  choice: Авигее
  rationale: Предлог ל обозначает адресата речи; дательный падеж естественно передаёт это значение по-русски. Использована традиционная русская форма имени.
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Страдательное причастие входит в формулу прославления; краткая форма «благословен» сохраняет торжественный библейский регистр и остаётся понятной.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Сопряжённая конструкция прямо определяет Яхве как Бога Израиля.
- source_word: אֲשֶׁר
  choice: который
  rationale: Относительное местоимение вводит определительное придаточное, относящееся к Яхве.
- source_word: שְׁלָחֵךְ
  choice: послал тебя
  rationale: Перфект обозначает совершившееся действие, а суффикс второго лица женского рода относится к Авигее.
- source_word: הַיּוֹם הַזֶּה
  choice: сегодня
  rationale: Выражение буквально означает «этот день» и в данном контексте естественно передаётся современным русским наречием «сегодня»; буквальная форма отмечена в сноске.
- source_word: לִקְרָאתִי
  choice: мне навстречу
  rationale: Конструкция обозначает движение к встрече с Давидом; «мне навстречу» точно и естественно передаёт образ исходного текста.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием прямой речи. Синтаксис сделан естественным для русского повествования, при этом сохранены формула благословения и личное Божье имя.
