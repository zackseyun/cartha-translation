base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/011.yaml
  text: Should I take my bread and my water and my meat that I have slaughtered for my shearers[b][a], and give it to men whom I do not know where they are from?
translation:
  language: ru
  text: Неужели я возьму свой хлеб, свою воду и мясо животных, которых я заколол для тех, кто стрижёт у меня овец[b], и отдам всё это[a] людям, о которых я и не знаю — откуда они?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «и я возьму… и отдам»; в еврейском тексте употреблены формы совершенного вида в риторическом вопросе.'
    reason: lexical_alternative
  - marker: b
    text: То есть работников, занятых стрижкой овец.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Неужели я возьму
  rationale: Форма qatal 1-го лица ед. числа с союзом в контексте возмущённого риторического вопроса передана естественной русской конструкцией с «неужели», сохраняющей будущую направленность и негодование Навала.
- source_word: לַחְמִי
  choice: свой хлеб
  rationale: Сохранён конкретный образ хлеба, а не обобщённое «пища»; возвратное «свой» естественно передаёт принадлежность при подлежащем первого лица.
- source_word: מֵימַי
  choice: свою воду
  rationale: Буквальное конкретное значение поддерживает перечисление запасов и подчёркнутую Навалом принадлежность.
- source_word: טִבְחָתִי ... טָבַחְתִּי
  choice: мясо животных, которых я заколол
  rationale: Так по-русски естественно передаётся приготовленное после заклания мясо и сохраняется конкретное значение корня טבח; буквальное «мясо, которое я заколол» звучало бы ненормативно.
- source_word: לְגֹזְזָי
  choice: для тех, кто стрижёт у меня овец
  rationale: Причастие обозначает работников, занятых стрижкой; упоминание овец делает культурно-контекстуальный смысл ясным современному читателю.
- source_word: וְנָתַתִּי
  choice: и отдам всё это
  rationale: Объект естественно восполнен из предшествующего перечня; «всё это» охватывает хлеб, воду и мясо.
- source_word: לָאֲנָשִׁים
  choice: людям
  rationale: Передаёт обычное значение существительного во множественном числе без ненужного усиления указательностью.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  choice: о которых я не знаю
  rationale: Сохраняет заявление Навала о незнании этих людей и естественно соединяется с последующим вопросом об их происхождении.
- source_word: אֵי מִזֶּה הֵמָּה
  choice: откуда они
  rationale: Кратко и идиоматично передаёт вопрос о происхождении людей.
