base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/036.yaml
  text: When Abigail came to Nabal[a], behold, he was holding a feast in his house like the feast of a king, and Nabal’s heart was merry within him, and he was very drunk. So she told him nothing at all, small or great[b], until the light of morning.
translation:
  language: ru
  text: Когда Авигея пришла к Навалу, она застала у него в доме пир — как у царя. Навал был весел и очень пьян. Поэтому она ничего ему не сказала — ни малого, ни великого[a] — до утреннего света[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не сказала ему ни малого, ни великого»; это выражение означает, что она не сказала вообще ничего.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «до рассвета».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא אֲבִיגַיִל אֶל נָבָל וְהִנֵּה
  choice: Когда Авигея пришла к Навалу, то увидела
  rationale: Последовательность повествования передана временной конструкцией, а וְהִנֵּה — естественным русским обозначением внезапно открывшейся перед ней картины.
- source_word: מִשְׁתֶּה
  choice: пир
  rationale: Слово обозначает пир или праздничное застолье, часто сопровождаемое обильным питьём; дальнейшее упоминание опьянения делает добавочное уточнение ненужным.
- source_word: כְּמִשְׁתֵּה הַמֶּלֶךְ
  choice: словно царский
  rationale: Краткая русская формулировка сохраняет сравнение с роскошным пиром царя, не вводя конкретного царя.
- source_word: לֵב נָבָל טוֹב עָלָיו
  choice: Сердце Навала было весело
  rationale: Сохранён образ сердца как средоточия внутреннего состояния; формулировка остаётся понятной и не сводит выражение только к вызванному вином настроению.
- source_word: שִׁכֹּר עַד מְאֹד
  choice: очень пьян
  rationale: Прямо и естественно передаёт высокую степень опьянения.
- source_word: דָּבָר קָטֹן וְגָדוֹל
  choice: ничего… ни малого ни великого
  rationale: Основной смысл меризма разъяснён словом «ничего», а образная еврейская пара сохранена.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: до утреннего света
  rationale: Сохранён буквальный образ света утра; более идиоматичное «до рассвета» отмечено в сноске.
