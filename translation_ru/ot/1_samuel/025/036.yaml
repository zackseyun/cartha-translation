revisions:
- from: 'Когда Авигея пришла к Навалу, то увидела: у него в доме был пир, словно царский. Сердце Навала было весело, а сам он был очень пьян. Поэтому она ничего ему не сказала — ни малого ни великого[a] — до утреннего света[b].'
  to: Когда Авигея пришла к Навалу, она застала у него в доме пир — как у царя. Навал был весел и очень пьян. Поэтому она ничего ему не сказала — ни малого, ни великого[a] — до утреннего света[b].
  rationale: Правка устраняет излишнее превращение частицы «вот» в глагол «увидела», делает русский синтаксис и идиоматику естественнее и сохраняет все смысловые компоненты оригинала, включая меризм и образ утреннего света.
