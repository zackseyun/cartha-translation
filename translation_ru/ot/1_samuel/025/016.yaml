  text: Они были стеной вокруг нас и ночью, и днём[a] во все те дни, когда мы были с ними и пасли стадо[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «стеной над нами»; по смыслу речь идёт об их постоянном защитном присутствии вокруг нас.'
    reason: lexical_alternative
