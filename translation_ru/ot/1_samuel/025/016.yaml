lexical_decisions:
- source_word: חוֹמָה
  choice: стеной
  rationale: Сохраняет конкретный и яркий образ защитной стены, не заменяя метафору отвлечённым словом «защита».
- source_word: הָיוּ
  choice: были
  rationale: Простая связочная форма прошедшего времени естественно передаёт продолжительную роль этих людей.
- source_word: עָלֵינוּ
  choice: вокруг нас
  rationale: Хотя предлог буквально может означать «над нами» или «на нас», при слове «стена» контекст указывает на защитное окружение; русский оборот «стеной вокруг нас» передаёт этот смысл естественно.
- source_word: גַּם לַיְלָה גַּם יוֹמָם
  choice: и ночью, и днём
  rationale: Парная конструкция גם...גם подчёркивает непрерывность защиты на протяжении суток; русский повтор «и... и...» сохраняет это ударение.
- source_word: כָּל יְמֵי
  choice: во все те дни
  rationale: Формально близко сохраняет временное выражение и связывает его с последующим придаточным.
- source_word: הֱיוֹתֵנוּ עִמָּם
  choice: когда мы ... с ними
  rationale: Инфинитивная конструкция с местоименным суффиксом задаёт временные рамки; придаточное с «когда» ясно и естественно по-русски.
- source_word: רֹעִים
  choice: пасли
  rationale: Причастие от רעה обозначает пастьбу или присмотр за скотом; глагол «пасли» точно и естественно передаёт занятие.
- source_word: הַצֹּאן
  choice: стадо
  rationale: צאן — собирательное обозначение мелкого скота, включая овец и коз; «стадо» не сужает значение до одних овец.
