base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/018.yaml
  text: Then Abigail hurried and took two hundred loaves of bread[a], two skins of wine, five sheep already prepared, five seahs of roasted grain, a hundred clusters of raisins, and two hundred cakes of figs, and put them on the donkeys.
translation:
  language: ru
  text: Тогда Авигея поспешила взять двести хлебов, два бурдюка вина, пять приготовленных овец, пять сей обжаренного зерна, сто гроздьев изюма и двести лепёшек из инжира и навьючила всё это на ослов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: Тогда Авигея поспешила
  rationale: Глагол передаёт поспешность, а «тогда» естественно выражает последовательность повествования.
- source_word: וַתִּקַּח
  choice: взять
  rationale: Прямое значение לקח; инфинитив после «поспешила» создаёт естественную русскую конструкцию.
- source_word: מָאתַיִם לֶחֶם
  choice: двести хлебов
  rationale: В русском «хлеб» может обозначать отдельную буханку или каравай и естественно употребляется при счёте в таком контексте.
- source_word: שְׁנַיִם נִבְלֵי יַיִן
  choice: два бурдюка вина
  rationale: נֵבֶל здесь обозначает древний сосуд для жидкости, вероятнее всего кожаный бурдюк; перевод избегает анахроничного «бутылки».
- source_word: חָמֵשׁ צֹאן עֲשׂוּיוֹת
  choice: пять приготовленных овец
  rationale: Причастие указывает, что овцы были подготовлены для еды, не уточняя способ или стадию приготовления.
- source_word: חָמֵשׁ סְאִים קָלִי
  choice: пять се жареного зерна
  rationale: Сея — конкретная древняя мера сыпучих тел; קָלִי означает обжаренное или прокалённое зерно.
- source_word: מֵאָה צִמֻּקִים
  choice: сто связок изюма
  rationale: צִמֻּקִים обозначает сушёный виноград; счётное количество, вероятно, подразумевает спрессованные связки или порции, но точная форма в еврейском тексте не названа.
- source_word: מָאתַיִם דְּבֵלִים
  choice: двести лепёшек из инжира
  rationale: דְּבֵלָה — спрессованная масса сушёного инжира, сформованная в лепёшку.
- source_word: וַתָּשֶׂם עַל הַחֲמֹרִים
  choice: навьючила всё это на ослов
  rationale: Буквально «положила на ослов»; «навьючила» естественно и точно передаёт действие в данном контексте.
theological_decisions: []
