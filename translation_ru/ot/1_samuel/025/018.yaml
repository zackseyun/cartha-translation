  source_fidelity: 'Перевод в целом верно передаёт последовательность действий, количества и характер припасов. Однако форма «пять се» неверна: название меры в этой позиции должно быть «пять сей». Для צִמֻּקִים предпочтительнее «гроздья изюма», что согласуется с возможным значением счётных связок сушёного винограда и английским audit trail; «связки» несколько более неопределённо и менее естественно.'
