base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/014.yaml
  text: But one of the young men told Abigail[a], Nabal’s wife, saying, “Look, David sent messengers from the wilderness to greet our master[b], and he shouted at them.”
translation:
  language: ru
  text: 'Но один из слуг сообщил Авигее, жене Навала: «Вот, Давид послал из пустыни вестников приветствовать[a] нашего господина, а тот набросился на них[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благословить». Древнееврейский глагол обычно означает «благословлять», но здесь, вероятно, речь идёт об учтивом приветствии или пожелании благополучия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обрушился на них с бранью». Древнееврейский глагол выражает стремительное, агрессивное нападение или резкий выпад; в данном контексте, вероятно, имеется в виду грубая словесная реакция.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲבִיגַיִל
  choice: Но ... Авигее
  rationale: Союз продолжает повествование и одновременно обозначает контраст с грубым отказом Навала в предыдущем контексте; «но» естественно передаёт этот поворот.
- source_word: אֵשֶׁת נָבָל
  choice: жене Навала
  rationale: Естественная русская передача конструкции принадлежности, идентифицирующей Авигею.
- source_word: הִגִּיד
  choice: сообщил
  rationale: Форма породы hифиль означает «сообщить, рассказать»; «сообщил» уместно для донесения о случившемся.
- source_word: נַעַר אֶחָד מֵהַנְּעָרִים
  choice: один из слуг
  rationale: נַעַר может обозначать молодого человека или слугу; в доме Навала речь идёт о его работниках. «Один из слуг» естественно и ясно передаёт контекст, не делая возраст главным смыслом.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Стандартный древнееврейский ввод прямой речи естественно передан средствами современной русской пунктуации без буквального «говоря».
- source_word: הִנֵּה
  choice: не выражено отдельным словом
  rationale: Частица привлекает внимание к сообщению; в современной русской прямой речи её функция достаточно выражена самим началом срочного доклада. «Вот» здесь звучало бы несколько искусственно.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В данном человеческом и дипломатическом контексте слово обозначает посланцев, а не ангелов.
- source_word: מֵהַמִּדְבָּר
  choice: из пустыни
  rationale: מִדְבָּר обозначает необжитую пустынную местность, где находился Давид; «из пустыни» — привычная и ясная русская передача.
- source_word: לְבָרֵךְ
  choice: приветствовать
  rationale: Хотя корень обычно означает «благословлять», в ситуации учтивого обращения он может обозначать приветствие или пожелание благополучия. Контекст стихов 6–8 поддерживает «приветствовать»; буквальная возможность отмечена в сноске.
- source_word: אֶת אֲדֹנֵינוּ
  choice: нашего господина
  rationale: Слуги говорят о хозяине дома. «Господин» сохраняет социальное значение слова и не превращает его в божественный титул.
- source_word: וַיָּעַט בָּהֶם
  choice: а тот набросился на них
  rationale: Редкий и выразительный глагол рисует резкое, агрессивное нападение или выпад. «Набросился на них» сохраняет образность и допускает подразумеваемый здесь словесный характер вспышки, не сводя значение только к крику.
