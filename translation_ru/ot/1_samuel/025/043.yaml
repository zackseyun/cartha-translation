  text: David also took Ahinoam of Jezreel[b][a], and both of them became his wives.
translation:
  language: ru
  text: Давид также взял Ахиноаму из Изрееля, и обе они стали его жёнами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָקַח
  choice: взял
  rationale: Сохраняет прямое значение еврейского глагола; брачный смысл ясно выражен последующей фразой «стали его жёнами».
- source_word: אֲחִינֹעַם
  choice: Ахиноам
  rationale: Традиционная русская передача личного имени.
- source_word: מִיִּזְרְעֶאל
  choice: из Изрееля
  rationale: 'Предлог מִן перед названием места прямо указывает на происхождение: «из Изрееля».'
- source_word: גַּם
  choice: также
  rationale: 'Передаёт добавочное значение частицы: кроме Авигеи, Давид взял и Ахиноам.'
- source_word: וַתִּהְיֶיןָ גַּם שְׁתֵּיהֶן לּוֹ לְנָשִׁים
  choice: и обе они стали его жёнами
  rationale: Естественно по-русски передаёт женский двойной охват «обе они» и идиоматическое לּוֹ לְנָשִׁים — «ему жёнами».
theological_decisions:
- issue: Описание многожёнства Давида
  choice: Прямо сказано, что обе женщины стали его жёнами.
  alternative: Смягчить или завуалировать упоминание нескольких жён.
  rationale: Еврейский текст описывает положение дел, не давая здесь нравственной оценки; перевод не должен ни скрывать его, ни добавлять такую оценку.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза сохраняет порядок мысли и ясный смысл еврейского текста.
