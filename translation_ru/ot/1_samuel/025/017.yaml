  source_fidelity: 'Основной смысл передан верно: обращение к Авигее остаётся в женском роде, מַה תַּעֲשִׂי естественно передано как «что тебе делать», а בֶּן־בְּלִיַּעַל — как характеристика Навала, а не имя демонического персонажа. Однако «беда уже решена для» звучит по-русски неестественно и недостаточно ясно передаёт установленность грядущей беды, направленной на господина и его дом.'
