  text: וְ/עַתָּ֗ה דְּעִ֤י וּ/רְאִי֙ מַֽה תַּעֲשִׂ֔י כִּֽי כָלְתָ֧ה הָ/רָעָ֛ה אֶל אֲדֹנֵ֖י/נוּ וְ/עַ֣ל כָּל בֵּית֑/וֹ וְ/הוּא֙ בֶּן בְּלִיַּ֔עַל מִ/דַּבֵּ֖ר אֵלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/017.yaml
  text: Now know this and consider what you should do[a], for disaster has been determined against our master and against all his household, and he is such a worthless man that one cannot speak to him.
translation:
  language: ru
  text: Теперь знай и подумай, что тебе делать, ибо беда уже предрешена для нашего господина и всего его дома. А он такой негодный человек, что с ним невозможно говорить.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сын негодности»; традиционно: «сын Велиала». Идиома, обозначающая негодного человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Теперь
  rationale: Передаёт срочный переход к призыву действовать; начальное «и» в современном русском необязательно.
- source_word: דְּעִי וּרְאִי
  choice: знай и подумай
  rationale: Обе формы — повелительные женского рода, обращённые к Авигее. «Подумай» естественно передаёт переносное, совещательное значение «увидь/рассмотри».
- source_word: מַה תַּעֲשִׂי
  choice: что тебе делать
  rationale: Естественная русская конструкция для обдумываемого действия; не усиливает модальность до прямого «ты должна».
- source_word: כָלְתָה הָרָעָה
  choice: беда уже решена
  rationale: Идиома указывает, что пагубный исход предрешён или стал неизбежным. «Беда» передаёт грозящее несчастье, а «решена» сохраняет оттенок установленного исхода.
- source_word: אֶל אֲדֹנֵינוּ וְעַל כָּל בֵּיתוֹ
  choice: для нашего господина и всего его дома
  rationale: «Для» выражает направленность грозящей беды без неестественного «против»; «дом» сохраняет ёмкость еврейского понятия, охватывающего домашних и хозяйство.
- source_word: בֶּן בְּלִיַּעַל
  choice: человек негодный
  rationale: Передаёт идиоматический смысл морально низкого, непригодного человека, не превращая בְּלִיַּעַל в имя собственное.
- source_word: מִדַּבֵּר אֵלָיו
  choice: с ним невозможно говорить
  rationale: Естественно передаёт невозможность вразумительно обратиться к Навалу из-за его нрава.
theological_decisions:
- issue: Значение идиомы בֶּן בְּלִיַּעַל
  choice: человек негодный
  alternative: сын негодности; сын Велиала
  rationale: Здесь выражение характеризует Навала как нравственно низкого и неразумного человека. Контекст не требует позднейшего понимания «Велиал» как собственного имени.
- issue: Степень предрешённости беды в כָלְתָה הָרָעָה
  choice: беда уже решена
  alternative: беда неизбежна; зло окончательно определено
  rationale: Формулировка сохраняет напряжение между уже принятым Давидом решением и ещё возможным вмешательством Авигеи, не утверждая абсолютной богословской неизменности исхода.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Сохранены срочность обращения слуги, прямота оценки Навала и неоднозначность образа «дома» как семьи и хозяйства.
