base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/020.yaml
  text: And as she was riding on the donkey and going down under cover of the mountain[a], behold, David and his men were coming down to meet her, and she met them.
translation:
  language: ru
  text: Когда она ехала на осле и спускалась под прикрытием горы[a], вот, Давид и его люди спускались ей навстречу, и она встретила их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по скрытой стороне горы». Еврейское выражение обозначает скрытое или укрытое место у горы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הִיא
  choice: И вот, когда она
  rationale: Сочетание с היה вводит обстоятельства новой сцены; оборот передаёт повествовательную и временную функцию естественным современным русским языком.
- source_word: רֹכֶבֶת עַל הַחֲמוֹר
  choice: ехала на осле
  rationale: רכב обозначает езду верхом, а חמור — осла; формулировка естественна для русского повествования.
- source_word: וְיֹרֶדֶת
  choice: и спускалась
  rationale: Причастие описывает продолжающееся действие и согласуется с предшествующим «ехала».
- source_word: בְּסֵתֶר הָהָר
  choice: под прикрытием горы
  rationale: סתר выражает укрытие или скрытость; перевод сохраняет неоднозначный топографический образ, а альтернативное понимание вынесено в сноску.
- source_word: וְהִנֵּה
  choice: навстречу ей
  rationale: Отдельное «вот» при וְהִנֵּה не повторено, поскольку вводное «И вот» уже передаёт внезапное обнаружение в сцене; порядок слов делает появление Давида и его людей заметным.
- source_word: יֹרְדִים לִקְרָאתָהּ
  choice: навстречу ей спускались
  rationale: ירד передано как движение вниз, а לקראת — как направленность навстречу ей, без излишне сильного утверждения о намеренной встрече.
- source_word: וַתִּפְגֹּשׁ אֹתָם
  choice: и она встретилась с ними
  rationale: פגש означает встретить или повстречаться; возвратная форма по-русски естественно описывает взаимное столкновение путников.
