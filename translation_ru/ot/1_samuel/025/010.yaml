  source_fidelity: 'Основной смысл передан верно: Навал презрительно отзывается о Давиде и Иессее и обобщённо говорит о множестве слуг, покидающих своих господ. Однако «бегут» несколько сужает הַמִּתְפָּרְצִים до физического бегства; глагол передаёт прорыв/самовольное освобождение, то есть уход с оттенком резкого разрыва. Распределительное «каждый» также следует синтаксически яснее связать со «слугами».'
  naturalness: «Которые бегут каждый от своего господина» звучит в современном литературном русском шероховато. Формула «каждый из которых сбегает от своего господина» естественна, сохраняет распределительность еврейского אִישׁ и презрительный оттенок реплики. Сноска в исходном варианте содержит не вполне естественное «вырываются каждый» и добавляет «из-под власти», чего в тексте прямо нет.
