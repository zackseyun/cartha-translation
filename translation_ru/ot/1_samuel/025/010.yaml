base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/010.yaml
  text: Nabal answered David’s servants and said[a], “Who is David? And who is the son of Jesse? These days many servants are breaking away, each man from before his master.”
translation:
  language: ru
  text: 'Навал ответил слугам Давида: «Кто такой Давид и кто такой сын Иессея? В наши дни стало много слуг, каждый из которых сбегает от своего господина».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В наши дни умножились слуги, каждый из которых вырывается от своего господина».'
    reason: Передаёт возможную более буквальную динамику глагола רַבּוּ («умножились») и более сильный образ резкого отделения в הַמִּתְפָּרְצִים, не добавляя толкование «из-под власти». Выражение מִפְּנֵי в контексте передано естественным русским «от».
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ответил
  rationale: Обычная древнееврейская повествовательная формула введения прямой речи; по-русски одного глагола «ответил» достаточно, чтобы естественно передать оба элемента.
- source_word: עַבְדֵי דָוִד
  choice: слугам Давида
  rationale: В данном контексте это посланники или люди Давида; «слуги» сохраняет прямое лексическое значение, не усиливая его до «рабов».
- source_word: מִי דָוִד וּמִי בֶן יִשָׁי
  choice: Кто такой Давид и кто такой сын Иессея?
  rationale: Повтор вопросительного местоимения передаёт презрительную риторику Навала, а обозначение «сын Иессея» сохраняет форму оригинала.
- source_word: הַיּוֹם
  choice: В наши дни
  rationale: Здесь слово обозначает современное говорящему время в общем суждении, а не одни конкретные сутки.
- source_word: רַבּוּ עֲבָדִים
  choice: стало много слуг
  rationale: Глагол רבה буквально выражает увеличение числа; конструкция «стало много» сохраняет эту динамику естественным русским языком.
- source_word: הַמִּתְפָּרְצִים
  choice: бегут
  rationale: В породе hitpael глагол передаёт резкое отделение или вырыванием прочь; в контексте ухода от господина «бегут» естественно выражает это, не вводя прямо понятие мятежа.
- source_word: אִישׁ מִפְּנֵי אֲדֹנָיו
  choice: каждый от своего господина
  rationale: איש употреблено распределительно — «каждый»; מִפְּנֵי здесь идиоматически означает удаление от лица или присутствия господина. Буквальная пространственная калька по-русски была бы неестественна.
