translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Реплика Навала звучит пренебрежительно, но без добавления прямо не выраженных обвинений. Термин «господин» выбран для человеческого социального начальника; контекст исключает богословское значение.
