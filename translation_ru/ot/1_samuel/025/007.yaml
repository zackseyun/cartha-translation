  yaml_path: translation/ot/1_samuel/025/007.yaml
  text: And now I have heard that you have shearers. Now your shepherds[a], who were with us, we did not mistreat, and nothing of theirs was missing all the days they were in Carmel.
translation:
  language: ru
  text: И вот, я услышал, что у тебя стригут овец. Теперь пастухи твои были с нами; мы не обижали их, и у них ничего не пропало за всё время, пока они были в Кармиле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не посрамили их». В данном контексте еврейский глагол может подразумевать, что с пастухами Навала не обращались дурно и не причиняли им вреда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה שָׁמַעְתִּי
  choice: И теперь я услышал
  rationale: Сохраняет соединительный переход וְעַתָּה и совершённое действие שָׁמַעְתִּי; в русском контексте естественно простое прошедшее время.
- source_word: כִּי גֹזְזִים לָךְ
  choice: что у тебя стригут овец
  rationale: Причастие גֹזְזִים обозначает происходящую стрижку; объект «овец» ясен из пастушеского контекста и необходим для естественного русского выражения.
- source_word: עַתָּה הָרֹעִים אֲשֶׁר לְךָ
  choice: А пастухов твоих
  rationale: Второе עַתָּה выполняет переходную риторическую функцию; русское «а» естественно вводит следующий довод, не создавая неуклюжего повторения «теперь».
- source_word: הָיוּ עִמָּנוּ
  choice: которые были с нами
  rationale: Прямо передаёт пространственно-реляционное значение עִם, не добавляя идеи проживания или службы.
- source_word: לֹא הֶכְלַמְנוּם
  choice: мы не притесняли
  rationale: Hiphil глагола כלם буквально связан с посрамлением, но в данном контексте описывает отсутствие дурного обращения с пастухами. «Не притесняли» передаёт практический смысл, а буквальный оттенок сохраняется в сноске.
- source_word: וְלֹא נִפְקַד לָהֶם מְאוּמָה
  choice: и ничего у них не пропало
  rationale: Нифаль נפקד означает отсутствие или недостачу. Русская конструкция ясно указывает, что имущество пастухов не понесло ущерба.
- source_word: כָּל יְמֵי הֱיוֹתָם
  choice: за всё время, пока они были
  rationale: Естественно передаёт еврейский временной оборот «все дни их пребывания», сохраняя полноту указанного периода.
- source_word: בַּכַּרְמֶל
  choice: в Кармиле
  rationale: Передано как географическое название Кармил в Иудее, а не как нарицательное обозначение плодородной земли.
