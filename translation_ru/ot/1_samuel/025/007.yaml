- from: И теперь я услышал, что у тебя стригут овец. А пастухов твоих, которые были с нами, мы не притесняли[a], и ничего у них не пропало за всё время, пока они были в Кармиле.
  to: И вот, я услышал, что у тебя стригут овец. Теперь пастухи твои были с нами; мы не обижали их, и у них ничего не пропало за всё время, пока они были в Кармиле.[a]
  rationale: Заменено «не притесняли» на более широкий и контекстуально точный вариант «не обижали»; синтаксис второй фразы упрощён, а второе «теперь» сохранено как риторический переход. Сноска удерживает буквальный смысл глагола, не сводя его к одному практическому значению.
