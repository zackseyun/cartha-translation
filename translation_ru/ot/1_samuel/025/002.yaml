base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/002.yaml
  text: There was a man in Maon whose business was in Carmel[a]. The man was very wealthy, and he had three thousand sheep and a thousand goats[b]. He was shearing his sheep in Carmel.
translation:
  language: ru
  text: 'В Маоне жил один человек, а его хозяйство находилось в Кармиле[a]. Он был очень богат: у него было три тысячи овец и тысяча коз[b]. Он стриг своих овец в Кармиле.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его дела»; «его владения». Древнееврейское слово может обозначать работу, занятия, дела или имущество человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «этот человек был весьма велик», то есть обладал большим богатством или высоким общественным положением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּמָעוֹן
  choice: В Маоне жил один человек
  rationale: Естественная для русского повествования передача неопределённого введения нового лица; «жил» ясно выражает связь человека с Маоном, не добавляя лишней конкретики.
- source_word: מַעֲשֵׂהוּ
  choice: его хозяйство
  rationale: Слово допускает значения дела, работа, занятие или имущество. В контексте крупного скотовладельца «хозяйство» естественно охватывает его производственную деятельность и владения.
- source_word: בַכַּרְמֶל
  choice: в Кармиле
  rationale: Это топоним Кармил, а не нарицательное обозначение сада или плодородной земли.
- source_word: הָאִישׁ גָּדוֹל מְאֹד
  choice: он был очень богат
  rationale: Буквально «человек был весьма велик»; последующий перечень стад указывает прежде всего на значительное имущественное положение.
- source_word: וְלוֹ צֹאן שְׁלֹשֶׁת אֲלָפִים וְאֶלֶף עִזִּים
  choice: у него было три тысячи овец и тысяча коз
  rationale: Естественная русская передача древнееврейской конструкции принадлежности с сохранением чисел и видов скота.
- source_word: וַיְהִי בִּגְזֹז אֶת־צֹאנוֹ
  choice: В то время он стриг своих овец
  rationale: Конструкция вводит происходящее в тот момент обстоятельство. Русское «в то время» передаёт временную функцию, а несовершенный вид сохраняет длительность действия.
