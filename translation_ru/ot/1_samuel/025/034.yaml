    rationale: Еврейское חַי יְהוָה в этой конструкции означает «как жив Яхве» / «клянусь жизнью Яхве», а не просто сообщение о том, что Яхве жив. Добавление «как» необходимо для ясного сохранения функции формулы.
  - severity: low
    issue: «К утреннему свету» несколько тяжеловесно.
    rationale: «К рассвету» естественно для современного литературного русского и передаёт עַד אוֹר הַבֹּקֶר без смысловой потери.
