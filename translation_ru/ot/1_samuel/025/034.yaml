  source_fidelity: 'Смысл в целом передан точно: сохранены клятвенная формула, обращение к Авигее в женском роде, контрфактическое условие, временной предел и значение грубой идиомы как обозначения мужчин. Однако «жив Яхве» без союза «как» в данном синтаксисе может читаться как простое утверждение, тогда как חַי יְהוָה — формула клятвы «как жив Яхве».'
  naturalness: Текст в целом современный и литературный. «Как жив Яхве» делает начало одновременно естественнее по-русски и точнее передаёт торжественную присяжную формулу. «К рассвету» — более естественное современное соответствие выражению «до света утра», чем «к утреннему свету».
  terminology: «Яхве» последовательно передаёт тетраграмматон; «Бог Израиля» точно. «Причинить тебе зло» допустимо и сохраняет намеренно широкое מֵהָרַע. Сноска уместно раскрывает грубую идиому, не вводя её в основной литературный текст.
