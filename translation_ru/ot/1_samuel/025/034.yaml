base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/034.yaml
  text: But as Yahweh[a], the God of Israel, lives, who has kept me from harming you, if you had not hurried and come to meet me, surely by the light of morning not one male would have been left to Nabal.
translation:
  language: ru
  text: 'Но, как жив Яхве, Бог Израиля, удержавший меня от того, чтобы причинить тебе зло: если бы ты не поспешила и не вышла мне навстречу, то к рассвету у Навала не осталось бы ни одного мужчины[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мочащегося на стену» — грубое древнееврейское выражение, обозначающее любого мужчину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Но
  rationale: Передаёт противительный переход к торжественному заверению Давида.
- source_word: חַי יְהוָה
  choice: жив Яхве
  rationale: Сохраняет обычную древнееврейскую формулу клятвы и естественно звучит в торжественной русской речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֲשֶׁר מְנָעַנִי
  choice: который удержал меня
  rationale: Глагол обозначает сдерживание или предотвращение действия.
- source_word: מֵהָרַע אֹתָךְ
  choice: от того, чтобы причинить тебе зло
  rationale: Близко передаёт буквальное «сделать тебе зло», сохраняя нравственную оценку задуманного насилия.
- source_word: כִּי לוּלֵי מִהַרְתְּ וַתָּבֹאתִי לִקְרָאתִי
  choice: Если бы ты не поспешила и не вышла мне навстречу
  rationale: Передаёт контрфактическое условие и женский род обращения к Авигее; «вышла навстречу» естественно выражает еврейскую идиому.
- source_word: כִּי אִם נוֹתַר לְנָבָל
  choice: то ... у Навала не осталось бы
  rationale: Русская условная конструкция ясно передаёт неизбежный, но не осуществившийся результат; לְ выражено как принадлежность к дому Навала.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: к утреннему свету
  rationale: Сохраняет образ света наступающего утра.
- source_word: מַשְׁתִּין בְּקִיר
  choice: ни одного мужчины
  rationale: Грубая буквальная идиома «мочащийся на стену» в контексте означает лицо мужского пола; смысл дан в тексте, а образ сохранён в примечании.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Нравственный смысл מֵהָרַע אֹתָךְ
  choice: причинить тебе зло
  alternative: навредить тебе
  rationale: «Причинить зло» сохраняет как конкретную угрозу вреда, так и нравственную напряжённость высказывания, не сводя его только к физическому ущербу.
translation_notes:
  register: Современный литературный русский язык с торжественным оттенком клятвенной формулы. Обращение к Авигее последовательно передано в женском роде; грубая идиома разъяснена в сноске, а в основном тексте дан её контекстуальный смысл.
