source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לִ/נְעָרֶ֨י/הָ֙ עִבְר֣וּ לְ/פָנַ֔/י הִנְ/נִ֖י אַחֲרֵי/כֶ֣ם בָּאָ֑ה וּ/לְ/אִישָׁ֥/הּ נָבָ֖ל לֹ֥א הִגִּֽידָה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/019.yaml
  text: She said to her young men[a], “Go on ahead of me. Look, I am coming behind you.” But she did not tell her husband Nabal.
translation:
  language: ru
  text: 'Она сказала своим слугам[a]: «Идите впереди меня. Вот, я иду следом за вами». Но своему мужу Навалу она ничего не сказала.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своим молодым людям».'
    reason: Нַעַר может обозначать как молодого человека, так и слугу или сопровождающего.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Она сказала
  rationale: Форма wayyiqtol продолжает последовательность повествовательных действий; в естественном русском отдельный союз не требуется.
- source_word: לִנְעָרֶיהָ
  choice: своим слугам
  rationale: נַעַר может обозначать юношу, слугу или сопровождающего. Здесь речь о людях Авигеи, несущих припасы; «слуги» естественно передаёт их роль, а лексическая альтернатива отмечена в сноске.
- source_word: עִבְרוּ לְפָנַי
  choice: Идите впереди меня
  rationale: В данном контексте עבר означает двигаться вперёд, а לְפָנַי — находиться впереди говорящей.
- source_word: הִנְנִי
  choice: Вот, я
  rationale: Указательная частица привлекает внимание к намерению говорящей; «вот» сохраняет её дискурсивную функцию без архаического оттенка.
- source_word: אַחֲרֵיכֶם בָּאָה
  choice: иду следом за вами
  rationale: Причастная форма выражает начатое или намеченное движение; «следом за вами» естественно передаёт пространственное значение אַחֲרֵי.
- source_word: וּלְאִישָׁהּ
  choice: Но своему мужу
  rationale: אִישׁ с суффиксом в этом семейном контексте означает мужа; союз передан как «но», поскольку подчёркнут контраст между сказанным слугам и скрытым от Навала.
- source_word: נָבָל
  choice: Навалу
  rationale: Имя собственное передано в принятой русской библейской форме и поставлено в дательном падеже по синтаксису предложения.
- source_word: לֹא הִגִּידָה
  choice: она ничего не сказала
  rationale: Hiphil глагола נגד означает сообщить или рассказать; русская конструкция «ничего не сказала» естественно выражает полное отсутствие сообщения.
