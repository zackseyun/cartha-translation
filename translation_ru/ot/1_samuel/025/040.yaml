  text: וַ/יָּבֹ֜אוּ עַבְדֵ֥י דָוִ֛ד אֶל אֲבִיגַ֖יִל הַ/כַּרְמֶ֑לָ/ה וַ/יְדַבְּר֤וּ אֵלֶ֨י/הָ֙ לֵ/אמֹ֔ר דָּוִד֙ שְׁלָחָ֣/נוּ אֵלַ֔יִ/ךְ לְ/קַחְתֵּ֥/ךְ ל֖/וֹ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/040.yaml
  text: So David’s servants came to Abigail at Carmel and spoke to her[a], saying, “David has sent us to you to take you for himself as a wife.”
translation:
  language: ru
  text: 'И пришли слуги Давида к Авигее в Кармил и сказали ей: «Давид послал нас к тебе, чтобы взять тебя себе в жёны[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы жениться на тебе»; буквально: «чтобы взять тебя себе в жёны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: Глагол בוא может означать движение «идти/приходить» в зависимости от точки зрения; здесь повествование направлено к месту, где находилась Авигея, поэтому естественно «пришли».
- source_word: עַבְדֵי דָוִד
  choice: слуги Давида
  rationale: עֶבֶד в данном контексте обозначает людей Давида, посланных им с поручением, без акцента на рабском статусе.
- source_word: הַכַּרְמֶלָה
  choice: в Кармил
  rationale: Направительное окончание указывает на движение к Кармилу; после глагола прибытия русское «пришли ... в Кармил» точно и естественно передаёт смысл.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ לֵאמֹר
  choice: сказали ей
  rationale: Стандартная древнееврейская формула введения прямой речи передана естественным современным русским выражением без избыточного буквального «говорили ей, говоря».
- source_word: שְׁלָחָנוּ
  choice: послал нас
  rationale: Завершённое действие ясно из контекста поручения; русское прошедшее время естественно передаёт форму перфекта.
- source_word: לְקַחְתֵּךְ ... לְאִשָּׁה
  choice: взять тебя ... в жёны
  rationale: Это устойчивое брачное выражение. Формулировка сохраняет образ исходного текста и ясно обозначает намерение вступить в брак.
- source_word: לוֹ
  choice: себе
  rationale: Возвратное местоимение естественно указывает на Давида как на того, кто намерен взять Авигею в жёны.
