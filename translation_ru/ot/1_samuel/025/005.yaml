base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/005.yaml
  text: So David sent ten young men[a], and David said to the young men, “Go up to Carmel, and go to Nabal, and greet him in my name with peace.”
translation:
  language: ru
  text: 'И послал Давид десять молодых людей и сказал им: «Поднимитесь в Кармил, придите к Навалу и справьтесь от моего имени о его благополучии[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поприветствуйте его от моего имени, пожелав ему мира».'
    reason: Выражение וּשְׁאֶלְתֶּם לוֹ ... לְשָׁלוֹם — формула приветствия, буквально предполагающая осведомление о благополучии; возможна передача как приветственного пожелания мира.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычное повествовательное значение глагола שלח; естественно и точно передаёт действие.
- source_word: עֲשָׂרָה נְעָרִים
  choice: десять молодых людей
  rationale: נְעָרִים может обозначать молодых людей или слуг. Выбран вариант, сохраняющий основной возрастной смысл без уточнения их положения.
- source_word: עֲלוּ כַרְמֶלָה
  choice: поднимитесь в Кармил
  rationale: עלה передаёт движение вверх, а направительный суффикс в כַרְמֶלָה — движение к Кармилу; русский глагол «поднимитесь» уместен в данном географическом контексте.
- source_word: וּבָאתֶם אֶל נָבָל
  choice: придите к Навалу
  rationale: Сохраняет значение בוא и естественно звучит в русском наставлении о прибытии к человеку.
- source_word: בִשְׁמִי
  choice: от моего имени
  rationale: Естественный русский эквивалент буквального «в моё имя», выражающий представительство Давида.
- source_word: וּשְׁאֶלְתֶּם לוֹ ... לְשָׁלוֹם
  choice: пожелайте ему мира
  rationale: Передаёт формулу приветствия и пожелания благополучия; примечание сохраняет возможное более буквальное понимание как вопрос о благополучии.
