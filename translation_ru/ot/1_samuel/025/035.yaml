base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/035.yaml
  text: So David took from her hand what she had brought him[a], and he said to her, “Go up in peace to your house. See, I have listened to your voice and accepted you.”
translation:
  language: ru
  text: 'И взял Давид из её рук то, что она принесла ему, и сказал ей: «Возвращайся с миром в свой дом. Знай: я внял твоим словам и оказал тебе благосклонность[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принял тебя»; буквально: «поднял твоё лицо».'
    reason: Передаёт варианты значения еврейской идиомы וָאֶשָּׂא פָּנָיִךְ и сохраняет её буквальный образ, не подменяя её смыслом «исполнил твою просьбу».
lexical_decisions:
- source_word: וַיִּקַּח ... מִיָּדָהּ
  choice: взял ... из её рук
  rationale: Сохраняет конкретное действие и образ руки в еврейском тексте; множественное число «из рук» естественно по-русски при получении принесённых даров.
- source_word: אֵת אֲשֶׁר הֵבִיאָה לוֹ
  choice: то, что она принесла ему
  rationale: Прямо и естественно передаёт относительную конструкцию и сохраняет адресата принесённого.
- source_word: עֲלִי לְשָׁלוֹם לְבֵיתֵךְ
  choice: Возвращайся с миром в свой дом
  rationale: Глагол עלה буквально означает «поднимайся/иди вверх», однако здесь обозначает уход Авигеи домой; «возвращайся» естественно выражает контекстуальное направление, а «с миром» сохраняет устойчивую формулу безопасного отпущения.
- source_word: רְאִי
  choice: Знай
  rationale: Императив служит для привлечения внимания и подтверждения последующего заверения. Русское «знай» передаёт эту прагматическую функцию естественнее буквального «смотри».
- source_word: שָׁמַעְתִּי בְקוֹלֵךְ
  choice: я послушался тебя
  rationale: Оборот буквально означает «я услышал/послушал твой голос», а в контексте — Давид внял словам Авигеи и согласился с её увещанием.
- source_word: וָאֶשָּׂא פָּנָיִךְ
  choice: исполнил твою просьбу
  rationale: Идиома буквально говорит о «поднятии лица» и в данном контексте означает благосклонное принятие человека и удовлетворение его просьбы. Выбранный вариант ясно выражает непосредственный результат обращения Авигеи.
theological_decisions:
- issue: Значение идиомы וָאֶשָּׂא פָּנָיִךְ
  choice: исполнил твою просьбу
  alternative: оказал тебе благосклонность; принял тебя; поднял твоё лицо
  rationale: Контекст связывает благосклонное принятие Авигеи с удовлетворением её ходатайства. Основной текст передаёт смысл естественным русским выражением, а примечание сохраняет образ и допустимые оттенки исходной идиомы без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся близким к еврейскому повествованию, но буквальные идиомы переданы понятными русскими соответствиями; исходный образ спорной идиомы сохранён в сноске.
