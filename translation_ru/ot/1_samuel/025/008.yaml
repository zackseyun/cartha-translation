base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/008.yaml
  text: Ask your young men[a], and they will tell you. So let the young men find favor in your eyes, for we have come on a festive day[b]. Please give whatever your hand finds to your servants and to your son David.
translation:
  language: ru
  text: Спроси своих молодых людей, и они расскажут тебе. Пусть молодые люди найдут благосклонность в твоих глазах, ведь мы пришли в праздничный день[a]. Дай, пожалуйста, твоим слугам и твоему сыну Давиду всё, что найдётся у тебя под рукой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в хороший день». В контексте стрижки овец это был день угощения и празднования.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «то, что найдёт твоя рука», то есть что ты можешь дать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל אֶת־נְעָרֶיךָ
  choice: Спроси своих молодых людей
  rationale: Повелительная форма передана прямо. Сочетание «молодые люди» сохраняет основной смысл נַעַר и его повтор далее в стихе, не уточняя без необходимости служебный статус.
- source_word: וְיַגִּידוּ לָךְ
  choice: и они расскажут тебе
  rationale: Естественно передаёт каузативную форму נגד в значении «сообщить, рассказать».
- source_word: וְיִמְצְאוּ הַנְּעָרִים חֵן בְּעֵינֶיךָ
  choice: Так пусть же эти молодые люди найдут благосклонность в твоих глазах
  rationale: Сохранены побудительно-пожелательный оттенок формы, связь с предыдущей фразой и образность еврейской идиомы «найти благосклонность в глазах».
- source_word: כִּי עַל יוֹם טוֹב בָּאנוּ
  choice: ведь мы пришли в праздничный день
  rationale: יוֹם טוֹב буквально означает «хороший день», но в контексте стрижки овец обозначает радостный, праздничный случай. Предлог עַל здесь естественно передан временным оборотом.
- source_word: תְּנָה־נָּא
  choice: Дай, пожалуйста
  rationale: Частица נָא смягчает повеление и выражает вежливую просьбу.
- source_word: אֵת אֲשֶׁר תִּמְצָא יָדְךָ
  choice: всё, что найдётся у тебя под рукой
  rationale: Передаёт смысл доступного для дарения и сохраняет образ руки в естественной русской идиоме; буквальная форма отмечена в сноске.
- source_word: לַעֲבָדֶיךָ
  choice: своим слугам
  rationale: В этой почтительной просьбе עֶבֶד служит самоуничижительным обозначением людей Давида, а не уточнением их юридического положения.
- source_word: וּלְבִנְךָ לְדָוִד
  choice: и своему сыну Давиду
  rationale: Сохранено смиренное, почтительное самообозначение Давида; речь не утверждает буквального родства.
theological_decisions: []
