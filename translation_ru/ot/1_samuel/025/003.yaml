base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/003.yaml
  text: The man's name was Nabal[a], and his wife's name was Abigail. The woman was intelligent and beautiful in appearance, but the man was harsh and evil in his dealings; he was a Calebite.
translation:
  language: ru
  text: Имя этого человека было Навал, а имя его жены — Авигея. Женщина была умна и красива, а мужчина — суров и дурно поступал; он был калевитянином[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переданное как «калевитянин», в письменной форме необычно. Традиционное чтение понимает его как «калевитянин», то есть человек из рода Калева; эту форму возможно прочитать и иначе.
    reason: textual_variant
lexical_decisions:
- source_word: נָבָל
  choice: Навал
  rationale: Личное имя передано в традиционной русской библейской форме.
- source_word: אֲבִגָיִל
  choice: Авигея
  rationale: Личное имя передано в традиционной русской библейской форме.
- source_word: טוֹבַת שֶׂכֶל
  choice: умна
  rationale: Выражение буквально означает «хорошего разумения» и характеризует ум и рассудительность женщины; краткое «умна» естественно по-русски.
- source_word: וִיפַת תֹּאַר
  choice: красива
  rationale: Конструкция указывает на привлекательную внешность; в русском контексте «красива» ясно и естественно передаёт этот смысл.
- source_word: קָשֶׁה
  choice: суров
  rationale: Слово характеризует тяжёлый, жёсткий нрав Навала; «суров» сохраняет эту межличностную окраску.
- source_word: רַע מַעֲלָלִים
  choice: зол в своих поступках
  rationale: מַעֲלָלִים обозначает поступки или образ действий; перевод сохраняет нравственную оценку поведения, не сужая её только до деловых отношений.
- source_word: כלבו
  choice: калевитянином
  rationale: Традиционное чтение понимает необычную форму как обозначение принадлежности к роду Калева; текстовая неясность отмечена в сноске.
theological_decisions:
- issue: Толкование וְהוּא כלבו
  choice: он был калевитянином
  alternative: письменную форму можно прочитать иначе; возможно также «из рода Калева»
  rationale: Это текстологический и лексический, а не собственно догматический вопрос. Родовое обозначение лучше всего согласуется с контекстом и традиционным чтением, но необычность письменной формы не скрыта.
translation_notes:
  register: Современный литературный русский язык с естественным синтаксисом и умеренно торжественным библейским регистром. Противопоставление характеров Авигеи и Навала сохранено союзом «а».
