    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַפְכוּ
  choice: повернули обратно
  rationale: В контексте движения форма от הפך означает перемену направления; сочетание естественно передаёт возвращение назад.
- source_word: נַעֲרֵי דָוִד
  choice: люди Давида
  rationale: נַעַר может обозначать молодого человека, слугу или сопровождающего. Здесь речь о посланцах Давида; «люди Давида» естественно в русском повествовании и не уточняет без необходимости ни возраст, ни зависимый статус.
- source_word: לְדַרְכָּם
  choice: на свой путь
  rationale: Буквально «к своему пути»; выражение указывает, что они развернулись и отправились обратным маршрутом.
- source_word: וַיָּשֻׁבוּ
  choice: возвратились
  rationale: Сохранён отдельный глагол возвращения, несмотря на частичную смысловую избыточность, поскольку еврейский текст выстраивает последовательную цепь действий.
- source_word: וַיָּבֹאוּ
  choice: пришли к нему
  rationale: Местоимение «к нему» естественно связывает приход с последующим сообщением Давиду; в еврейском оно формально относится к וַיַּגִּדוּ, но адресат обоих действий ясен из контекста.
- source_word: וַיַּגִּדוּ לוֹ
  choice: пересказали ему
  rationale: נגד здесь означает сообщить или передать услышанное; «пересказали» точно соответствует сообщению ответа Навала.
- source_word: כְּכֹל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: דְּבָרִים допускает значения «слова» и «дела/обстоятельства». Здесь сообщается устный ответ Навала, поэтому предпочтено «слова», при сохранении альтернативы в сноске.
