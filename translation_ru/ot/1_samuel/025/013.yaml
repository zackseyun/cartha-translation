  text: וַ/יֹּאמֶר֩ דָּוִ֨ד לַ/אֲנָשָׁ֜י/ו חִגְר֣וּ אִ֣ישׁ אֶת חַרְבּ֗/וֹ וַֽ/יַּחְגְּרוּ֙ אִ֣ישׁ אֶת חַרְבּ֔/וֹ וַ/יַּחְגֹּ֥ר גַּם דָּוִ֖ד אֶת חַרְבּ֑/וֹ וַֽ/יַּעֲל֣וּ אַחֲרֵ֣י דָוִ֗ד כְּ/אַרְבַּ֤ע מֵאוֹת֙ אִ֔ישׁ וּ/מָאתַ֖יִם יָשְׁב֥וּ עַל הַ/כֵּלִֽים׀־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/013.yaml
  text: Then David said to his men[a], “Each man strap on his sword.” So each man strapped on his sword, and David also strapped on his sword. About four hundred men went up after David, while two hundred stayed with the supplies.
translation:
  language: ru
  text: 'Тогда Давид сказал своим людям: «Каждый пусть опояшется своим мечом». И каждый опоясался своим мечом, и Давид тоже опоясался своим мечом. Около четырёхсот человек поднялись вслед за Давидом, а двести остались с поклажей.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со снаряжением»; возможны также значения «с вещами» или «при обозе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִגְרוּ / וַיַּחְגְּרוּ / וַיַּחְגֹּר
  choice: препояшется / препоясался
  rationale: Глагол חגר в военном контексте означает закрепить на поясе, надеть меч. «Препоясаться мечом» — точная и понятная библейская формула, сохраняющая конкретный образ исходного текста.
- source_word: אִישׁ אֶת־חַרְבּוֹ
  choice: каждый ... мечом
  rationale: 'Передана распределительная конструкция: приказ и его исполнение относятся к каждому человеку отдельно. В русском возвратный глагол естественно выражает принадлежность собственного меча без тяжеловесного «своим мечом».'
- source_word: חַרְבּוֹ
  choice: мечом
  rationale: חֶרֶב обозначает именно меч, поэтому более общее «оружие» не используется.
- source_word: גַּם
  choice: и Давид
  rationale: Частица подчёркивает, что Давид вооружился вместе со своими людьми; русская конструкция с присоединительным «и» естественно передаёт это значение.
- source_word: וַיַּעֲלוּ אַחֲרֵי דָוִד
  choice: пошли вслед за Давидом
  rationale: Сохранено значение следования за Давидом. Отдельное указание движения вверх по местности в русском здесь звучало бы неестественно и несущественно для сцены.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: около четырёхсот человек
  rationale: Префикс כְּ перед числом передаёт приблизительность.
- source_word: יָשְׁבוּ
  choice: остались
  rationale: В повествовательном контексте глагол означает, что двести человек не пошли с Давидом, а остались позади; буквальное «сидели» вводило бы нежелательный оттенок.
- source_word: עַל־הַכֵּלִים
  choice: при поклаже
  rationale: כֵּלִים здесь обозначает перевозимое имущество, снаряжение или обоз. «При поклаже» кратко передаёт, что люди остались охранять имущество, не делая эту функцию явной сверх текста.
- source_word: לַאֲנָשָׁיו
  choice: своим людям
  rationale: В данном военном окружении речь идёт о людях Давида; «слугам» было бы уже по смыслу, а «мужам» звучало бы архаично.
