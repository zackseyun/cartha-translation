revisions:
- from: 'Тогда Давид сказал своим людям: «Пусть каждый препояшется мечом». И каждый препоясался мечом; препоясался мечом и Давид. Около четырёхсот человек пошли вслед за Давидом, а двести остались при поклаже.[a]'
  to: 'Тогда Давид сказал своим людям: «Каждый пусть опояшется своим мечом». И каждый опоясался своим мечом, и Давид тоже опоясался своим мечом. Около четырёхсот человек поднялись вслед за Давидом, а двести остались с поклажей.[a]'
  rationale: Исправлена форма приказа для более точной передачи еврейского императива и распределительного значения. «Опоясаться своим мечом» сохраняет конкретное действие חגר и остаётся понятным современному читателю. «Поднялись вслед за Давидом» передаёт וַיַּעֲלוּ אַחֲרֵי דָוִד, а «остались с поклажей» — естественный русский эквивалент контекстуального значения עַל־הַכֵּלִים. Сноска сохраняет лексическую неопределённость слова כֵּלִים.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:44:23Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан точно: приказ вооружиться, повторное вооружение людей и Давида, приблизительное число и оставление двухсот у имущества сохранены. Однако «Пусть каждый препояшется» менее прямо передаёт еврейский императив множественного числа, а «при поклаже» звучит не вполне естественно в современном литературном русском. Также безопасно сохранить в повествовании оттенок «поднялись» (וַיַּעֲלוּ).'
  naturalness: «Препоясаться» допустимо, но имеет заметно архаизирующий библейский оттенок; «опоясаться» сохраняет образ и лучше соответствует современному литературному регистру. «Остались с поклажей» естественно выражает нахождение при перевозимом имуществе, не добавляя функции охраны.
  terminology: «Меч» передаёт חֶרֶב точно. «Своим людям» уместно в данном военном контексте. Для הַכֵּלִים выбрано «поклажа» с подстрочным указанием альтернатив «снаряжение», «вещи», «обоз»; это сохраняет широкую семантику исходного слова.
  issues:
  - severity: medium
    issue: Форма приказа «Пусть каждый препояшется мечом»
    rationale: Еврейское חִגְרוּ — прямой императив множественного числа. Русское «Каждый пусть опояшется своим мечом» сохраняет распределительное «каждый» и звучит как прямой приказ группе, избегая менее естественной формы «препояшется».
  - severity: low
    issue: «При поклаже»
    rationale: Сочетание возможно, но для современного литературного русского менее естественно, чем «с поклажей». Последний вариант передаёт, что двести остались при перевозимом имуществе, не уточняя их задачу.
  - severity: low
    issue: Не отражено «взошли/поднялись» в וַיַּעֲלוּ
    rationale: «Пошли вслед» передаёт следование, но опускает глагол движения вверх. «Поднялись вслед за Давидом» сохраняет оба компонента без неестественной тяжеловесности.
