source:
  edition: WLC
  text: וְ/לָ/שׂ֣וּם ל֔/וֹ שָׂרֵ֥י אֲלָפִ֖ים וְ/שָׂרֵ֣י חֲמִשִּׁ֑ים וְ/לַ/חֲרֹ֤שׁ חֲרִישׁ/וֹ֙ וְ/לִ/קְצֹ֣ר קְצִיר֔/וֹ וְ/לַ/עֲשׂ֥וֹת כְּלֵֽי מִלְחַמְתּ֖/וֹ וּ/כְלֵ֥י רִכְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/012.yaml
  text: He will appoint for himself commanders of thousands and commanders of fifties[a], and some to plow his ground and reap his harvest[c][b], and to make his weapons of war and the equipment of his chariots.
translation:
  language: ru
  text: И назначит он себе тысяченачальников и пятидесятников[a], а одних заставит пахать его пашню и убирать его урожай[b], других — делать его воинское снаряжение[c] и снаряжение для его колесниц.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «начальников тысяч и начальников пятидесятков».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пахать его пахоту и жать его жатву»; однокоренные конструкции подчеркивают труд, выполняемый для царя.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «его боевые орудия»; еврейское слово может обозначать как оружие, так и воинское снаряжение вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָשׂוּם לוֹ
  choice: И назначит он себе
  rationale: Инфинитив с союзом продолжает перечень действий царя из предыдущего стиха; в русском естественно передать его личной формой будущего времени. «Себе» сохраняет значение царской пользы и службы.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי חֲמִשִּׁים
  choice: тысяченачальников и пятидесятников
  rationale: Традиционные, понятные в библейском контексте названия начальников подразделений в тысячу и пятьдесят человек; они компактно сохраняют числовую организацию еврейского текста.
- source_word: וְלַחֲרֹשׁ חֲרִישׁוֹ
  choice: пахать его пашню
  rationale: Еврейская однокоренная конструкция буквально означает «пахать его пахоту». Русское «пахать его пашню» сохраняет и смысл земледельческого труда, и легкий стилистический акцент исходной конструкции.
- source_word: וְלִקְצֹר קְצִירוֹ
  choice: убирать его урожай
  rationale: Передает уборку созревшего урожая естественным современным русским выражением и сохраняет указание на труд ради царя.
- source_word: וְלַעֲשׂוֹת כְּלֵי מִלְחַמְתּוֹ
  choice: делать его воинское снаряжение
  rationale: כְּלִי — широкое обозначение предметов, орудий или снаряжения. «Воинское снаряжение» сохраняет эту широту и не сужает смысл исключительно до оружия.
- source_word: וּכְלֵי רִכְבּוֹ
  choice: и снаряжение для его колесниц
  rationale: רֶכֶב может обозначать колесницы или колесничное войско; по контексту речь идет о предметах, относящихся к царским колесницам. Русская конструкция «для его колесниц» звучит естественно, не устраняя лексической широты.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Термины «тысяченачальники» и «пятидесятники» сохранены ради точности древней военно-административной структуры; принудительный характер службы выражен глаголом «заставит», который естественно раскрывает зависимость инфинитивов от описания царских повинностей в контексте.
