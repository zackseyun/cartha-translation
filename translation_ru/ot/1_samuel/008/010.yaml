- source_word: וַיֹּאמֶר
  choice: передал
  rationale: Формально глагол означает «сказал», но в сочетании со «всеми словами Яхве» русское «передал» естественно выражает сообщение народу всей данной Богом речи.
- source_word: אֵת כָּל דִּבְרֵי יְהוָה
  choice: все слова Яхве
  rationale: Формальная конструкция сохраняет акцент на полноте возвещённого Самуилом Божьего послания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֶל הָעָם
  choice: народу
  rationale: Дательный падеж после «передал» естественно передаёт адресата, обозначенного предлогом אֶל; добавление «Израиля» в еврейском тексте отсутствует.
- source_word: הַשֹּׁאֲלִים מֵאִתּוֹ מֶלֶךְ
  choice: просившему у него царя
  rationale: Причастный оборот естественен по-русски и сохраняет возможную характеристику народа через его просьбу; מֵאִתּוֹ передано словами «у него».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. «Яхве» передаёт его как имя, не заменяя титулом и не вводя позднюю традиционную форму.
- issue: Временной оттенок причастия הַשֹּׁאֲלִים
  choice: просившему
  alternative: который просил; который продолжал просить
  rationale: Еврейское причастие допускает как актуально продолжающуюся просьбу, так и характеристику народа как просившего царя. Русское причастие сохраняет эту неоднозначность, не уточняя аспект без достаточных оснований.
