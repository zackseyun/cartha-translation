  text: So now[a], listen to their voice; only, you must solemnly warn them and tell them the justice of the king who will reign over them.
translation:
  language: ru
  text: Итак, послушай их. Но непременно предостереги их и скажи им, каков будет обычай[a] царя, который будет царствовать над ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «право царя» или «образ действий царя». Еврейское מִשְׁפָּט может также означать судебное решение, законное право или обычную практику.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע בְּקוֹלָם
  choice: послушай их
  rationale: Еврейская идиома означает услышать, внять или послушаться. В данном контексте речь идёт о согласии исполнить просьбу народа; русский вариант естественен и не подразумевает одобрения этой просьбы.
- source_word: אַךְ כִּי
  choice: но
  rationale: Сочетание вводит сильное ограничение к предшествующему повелению; противопоставительный союз естественно передаёт эту функцию в русском контексте.
- source_word: הָעֵד תָּעִיד
  choice: непременно предостереги
  rationale: Инфинитив абсолютный с личной формой усиливает действие, а порода Hiphil корня עוּד здесь выражает настойчивое официальное предупреждение. «Непременно предостереги» передаёт и усиление, и серьёзность.
- source_word: וְהִגַּדְתָּ לָהֶם
  choice: и объясни им
  rationale: Глагол в Hiphil означает сообщить, объявить или дать знать. «Объясни им» естественно вводит последующее подробное описание царских действий.
- source_word: מִשְׁפַּט הַמֶּלֶךְ
  choice: порядки царя
  rationale: מִשְׁפָּט может обозначать суд, право, установленный порядок или обычную практику. В последующих стихах описано, как царь будет поступать и чего требовать; «порядки» сохраняет описательный и предостерегающий характер, не утверждая безусловной законности этих притязаний.
- source_word: אֲשֶׁר יִמְלֹךְ עֲלֵיהֶם
  choice: который станет царствовать над ними
  rationale: Глагол מלך обозначает именно царствование; «станет царствовать» передаёт будущность действия и сохраняет царскую лексику оригинала.
theological_decisions:
- issue: Следует ли понимать מִשְׁפַּט הַמֶּלֶךְ как законное право царя или как описание его установившейся практики
  choice: «порядки царя» — описание того, как будущий царь будет действовать и чего требовать
  alternative: «право царя» или «образ действий царя»
  rationale: Дальнейший текст перечисляет тяжёлые царские повинности и изъятия. Слово «право» могло бы заранее придать им нравственную или божественную санкцию, которой сам стих однозначно не формулирует. Основной текст оставляет предупреждающий оттенок, а сноска сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сдержанно возвышенным библейским звучанием. Разделение на два предложения делает сильное ограничение после разрешения особенно ясным; архаизмы и конфессионально окрашенные формулы не используются.
