lexical_decisions:
- source_word: וְהָיִינוּ
  choice: чтобы и мы были
  rationale: В данном контексте форма продолжает выражение цели, ради которой народ просит царя. Такая передача естественна по-русски, при этом возможное буквальное будущее отмечено в сноске.
- source_word: גַם אֲנַחְנוּ
  choice: и мы
  rationale: Сочетание подчёркивает желание Израиля уподобиться другим народам; русское «и мы» естественно передаёт это включительное ударение.
- source_word: כְּכָל הַגּוֹיִם
  choice: как все народы
  rationale: В контексте речь идёт об окружающих народах, а не о позднейшем специальном значении слова «язычники».
- source_word: וּשְׁפָטָנוּ
  choice: судил нас
  rationale: Глагол שׁפט может охватывать суд, управление и осуществление власти. «Судил нас» сохраняет прямое значение и связь с темой судей в книге, а более широкое значение поясняется в сноске.
- source_word: מַלְכֵּנוּ
  choice: наш царь
  rationale: Прямая передача существительного с притяжательным суффиксом сохраняет ясно выраженное желание народа иметь собственную монархическую власть.
- source_word: וְיָצָא לְפָנֵינוּ
  choice: выступал впереди нас
  rationale: Передаёт образ царя, выходящего перед народом, особенно как военного предводителя, и звучит естественно в современном русском языке.
- source_word: וְנִלְחַם אֶת מִלְחֲמֹתֵינוּ
  choice: вёл наши войны
  rationale: Естественная русская передача еврейской однокоренной конструкции «воевать наши войны», сохраняющая военный смысл без лишнего истолкования.
theological_decisions:
- issue: Передача גּוֹיִם в просьбе Израиля о царе
  choice: народы
  alternative: язычники
  rationale: Здесь Израиль сопоставляет своё политическое устройство с устройством окружающих народов. «Народы» сохраняет контекстуальный смысл и не привносит более позднее специальное употребление слова «язычники».
- issue: Значение царского действия שׁפט
  choice: судил нас
  alternative: управлял нами
  rationale: Буквальная передача сохраняет связь с предшествующим устройством Израиля при судьях и одновременно не исключает более широкого смысла правления, указанного в сноске.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Синтаксис сохраняет целевую направленность просьбы народа; военный образ передан ясно и без архаизации.
