  source_fidelity: 'Смысл в целом передан верно: царь заберёт дочерей народа для придворных работ. Однако לְרַקָּחוֹת — существительное со значением «мастерицы по приготовлению благовоний/мазей», а не просто действие «готовили благовония»; «благовония» в русском может обозначать уже готовые ароматические вещества и несколько сужает ремесленный смысл. «Варили пищу» допустимо, но טַבָּחוֹת шире: «кухарки/поварихи», то есть приготовляющие пищу, не только варящие. Добавление «хлеб» к אֹפוֹת не требуется и сужает «пекущие».'
