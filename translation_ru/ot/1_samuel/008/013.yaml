lexical_decisions:
- source_word: וְאֶת
  choice: '[отдельно не переводится]'
  rationale: Показатель прямого дополнения; в русском языке отдельного соответствия не требует.
- source_word: בְּנוֹתֵיכֶם
  choice: ваших дочерей
  rationale: Форма множественного числа слова «дочь» с суффиксом 2-го лица множественного числа; семейное значение здесь первично.
- source_word: יִקָּח
  choice: он возьмёт
  rationale: Имперфект имеет будущее значение в предупреждении о действиях царя; «возьмёт» сохраняет оттенок принудительного привлечения к службе.
- source_word: לְרַקָּחוֹת
  choice: чтобы они готовили благовония
  rationale: Еврейское слово обозначает женщин, составляющих ароматические смеси — благовония, притирания или мази. Глагольная передача естественна по-русски и сохраняет широту значения.
- source_word: וּלְטַבָּחוֹת
  choice: варили пищу
  rationale: Форма женского рода обозначает женщин, занятых приготовлением еды; при общем дополнении «дочерей» отдельное указание рода не требуется.
- source_word: וּלְאֹפוֹת
  choice: пекли хлеб
  rationale: Субстантивированная форма женского рода от глагола «печь»; добавление «хлеб» естественно выражает подразумеваемый предмет выпечки.
