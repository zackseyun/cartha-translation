base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/005.yaml
  text: They said to him[a], “Look, you have grown old, and your sons have not walked in your ways. Now appoint for us a king to judge us, like all the nations.”
translation:
  language: ru
  text: 'Они сказали ему: «Вот, ты состарился, а твои сыновья не ходили твоими путями. Теперь назначь нам царя, чтобы он судил[a] нас, как у всех народов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «управлял нами» или «правил нами»; еврейский глагол «судить» в этом контексте может обозначать более широкую власть правителя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественный современный указательный маркер, сохраняющий акцент еврейского текста без архаизации.
- source_word: זָקַנְתָּ
  choice: ты состарился
  rationale: Передаёт совершившийся процесс и его нынешний результат, а не только констатацию возраста.
- source_word: הָלְכוּ בִּדְרָכֶיךָ
  choice: не ходят твоими путями
  rationale: Сохраняет библейскую этическую метафору хождения путями и естественно обозначает продолжающийся образ жизни сыновей.
- source_word: שִׂימָה לָּנוּ
  choice: поставь нам
  rationale: В данном политическом контексте глагол означает установление или назначение царя; выражение естественно по-русски и не добавляет отсутствующего в тексте «над нами».
- source_word: מֶלֶךְ
  choice: царя
  rationale: Прямое и контекстуально точное обозначение монарха.
- source_word: לְשָׁפְטֵנוּ
  choice: чтобы он судил нас
  rationale: Сохраняет основное значение корня שׁפט и одновременно допускает присущий контексту более широкий смысл управления.
- source_word: כְּכָל הַגּוֹיִם
  choice: как у всех народов
  rationale: Передаёт сравнение с окружающими народами и избегает более поздней конфессионально окрашенной лексемы «язычники».
theological_decisions:
- issue: Просьба о монархии по образцу окружающих народов
  choice: как у всех народов
  alternative: как у всех язычников
  rationale: Слово «народы» сохраняет политическое и заветное противопоставление, не привнося более поздних ассоциаций слова «язычники».
- issue: Объём власти, выраженный глаголом שׁפט
  choice: судил нас
  alternative: управлял нами / правил нами
  rationale: Основное значение «судить» оставлено в тексте, а более широкий политический смысл не исключён и указан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. Сохранена метафора «ходить путями»; синтаксис сделан ясным для обычного читателя без устранения смысловой широты глагола «судить».
