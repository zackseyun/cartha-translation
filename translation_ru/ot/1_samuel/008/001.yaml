lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Когда
  rationale: Древнееврейская повествовательная формула вводит временное обстоятельство; простое «когда» естественно передаёт её функцию в современном русском языке.
- source_word: זָקֵן
  choice: состарился
  rationale: Глагол обозначает наступление старости, а не только статическое состояние; «состарился» сохраняет это значение.
- source_word: שְׁמוּאֵל
  choice: Самуил
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: וַיָּשֶׂם
  choice: поставил
  rationale: Буквально глагол означает «поставил»; в сочетании с названием должности это естественно выражает назначение на служение и сохраняет образ исходного слова.
- source_word: אֶת בָּנָיו
  choice: своих сыновей
  rationale: Древнееврейское слово конкретно обозначает сыновей; возвратное «своих» естественно указывает на Самуила как на их отца.
- source_word: שֹׁפְטִים
  choice: судьями
  rationale: Слово обозначает исполняющих судебно-управленческую роль; «судьями» сохраняет принятую терминологию книги.
- source_word: לְיִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог может выражать отношение служения или сферу власти; в данном контексте «над Израилем» ясно передаёт осуществление судейских полномочий, не устраняя возможную альтернативу.
