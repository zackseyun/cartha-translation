  text: וְ/אֶת שְׂ֠דֽוֹתֵי/כֶם וְ/אֶת כַּרְמֵי/כֶ֧ם וְ/זֵיתֵי/כֶ֛ם הַ/טּוֹבִ֖ים יִקָּ֑ח וְ/נָתַ֖ן לַ/עֲבָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/014.yaml
  text: He will take your fields[a], your vineyards, and your best olive groves[b], and give them to his servants.
translation:
  language: ru
  text: Он заберёт ваши поля, виноградники и лучшие оливковые рощи[a] и отдаст их своим слугам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оливковые деревья» либо «оливковые сады»; еврейское слово здесь, вероятно, обозначает оливковые насаждения как сельскохозяйственное владение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рабам»; еврейское слово может означать как слуг, так и рабов — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֹתֵיכֶם
  choice: ваши поля
  rationale: שָׂדֶה обычно обозначает поле или возделываемый участок земли; «поля» прямо и естественно передаёт смысл в перечне сельскохозяйственных владений.
- source_word: כַּרְמֵיכֶם
  choice: виноградники
  rationale: כֶּרֶם обычно означает виноградник; это точное и привычное русское соответствие.
- source_word: זֵיתֵיכֶם
  choice: оливковые рощи
  rationale: זַיִת может обозначать как оливковые деревья, так и их насаждения в совокупности. Параллелизм с полями и виноградниками указывает здесь на сельскохозяйственные владения.
- source_word: הַטּוֹבִים
  choice: лучшие
  rationale: Хотя טוֹב буквально значит «хороший», в контексте изъятия имущества форма с артиклем естественно указывает на наиболее ценные, отборные насаждения.
- source_word: יִקָּח
  choice: заберёт
  rationale: לָקַח — обычный глагол «брать». «Заберёт» сохраняет его простоту и при этом естественно передаёт принудительный характер действия в данном контексте, не усиливая его до «захватит».
- source_word: וְנָתַן
  choice: и отдаст
  rationale: נָתַן означает «дать». После «заберёт» русское «отдаст» ясно передаёт переход имущества к другим лицам и сохраняет простой ритм предупреждения.
- source_word: לַעֲבָדָיו
  choice: своим слугам
  rationale: עֶבֶד может означать слугу, раба или царского служащего. Здесь речь, вероятно, о людях царя, получающих от него изъятое имущество; «слугам» сохраняет контекстуальную широту, а вариант «рабам» отмечен в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная фраза сохраняет последовательность древнееврейского перечня. «Оливковые рощи» понятно обычному читателю и передаёт имущественный масштаб; «слуги» не устраняет лексическую неоднозначность, которая вынесена в сноску.
