base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/003.yaml
  text: But his sons did not walk in his ways[a]; they turned aside after dishonest gain, took bribes[b], and perverted justice.
translation:
  language: ru
  text: 'Но его сыновья не шли его путём: они уклонились ради нечестной наживы[a], брали взятки и извращали правосудие[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради неправедной выгоды»; возможно также: «из корысти». Еврейское слово обозначает прибыль, к которой стремятся неправедным или хищническим путём.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «отклоняли суд», то есть искажали судебные решения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ ... בְּדַרְכּוֹ
  choice: не шли его путём
  rationale: Сочетание הלך с בְּדֶּרֶךְ описывает образ жизни и поведение. Русское «идти чьим-либо путём» сохраняет исходную метафору и ясно передаёт смысл следования примеру.
- source_word: וַיִּטּוּ
  choice: они уклонились
  rationale: Глагол נטה здесь означает отклонение от правильного нравственного и судебного пути. «Уклонились» естественно связывается с предшествующим образом пути.
- source_word: אַחֲרֵי הַבָּצַע
  choice: ради нечестной наживы
  rationale: בצע обозначает выгоду, добываемую неправедным или корыстным путём. «Нечестная нажива» передаёт и материальную заинтересованность, и незаконный характер такой выгоды; «ради» естественно выражает направленность их действий.
- source_word: וַיִּקְחוּ שֹׁחַד
  choice: брали взятки
  rationale: שֹׁחַד — взятка, особенно в судебном контексте. Несовершенный вид «брали» передаёт описываемую практику, а не единичный случай.
- source_word: וַיַּטּוּ מִשְׁפָּט
  choice: извращали правосудие
  rationale: Буквально выражение говорит об отклонении судебного решения; по смыслу это искажение справедливого суда. «Извращали правосудие» сохраняет юридическую конкретность и звучит естественно по-русски.
- source_word: בָּנָיו
  choice: его сыновья
  rationale: Мужской род и семейное отношение переданы прямо и точно.
theological_decisions:
- issue: Нравственно-правовая характеристика сыновей Самуила
  choice: 'Передать стих как прямое обвинение в судебной коррупции, сохранив последовательность: нечестная нажива, взятки, извращение правосудия.'
  alternative: Обобщить обвинение словами «они были корыстны» или «поступали несправедливо».
  rationale: Еврейский текст намеренно использует ряд конкретных выражений, относящихся к корысти и неправедному суду. Обобщение ослабило бы юридическую направленность обвинения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Метафора пути сохранена, а термины судебной коррупции переданы ясно и без конфессиональных добавлений. Двоеточие подчёркивает, что последующие действия раскрывают, в чём сыновья не следовали пути отца.
