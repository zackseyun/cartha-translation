  source_fidelity: 'Русский текст точно передаёт все элементы еврейского оригинала: сыновья Самуила не следовали его пути, уклонились к неправедной выгоде, брали взятки и искажали суд. «Ради нечестной наживы» адекватно передаёт אַחֲרֵי הַבָּצַע в контексте судебной коррупции, хотя несколько сильнее выражает мотив; существенного смыслового сдвига нет.'
