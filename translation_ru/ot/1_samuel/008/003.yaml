  terminology: Термины «нечестная нажива», «взятки» и «правосудие» удачно передают морально-правовую лексику исходного текста без конфессиональных добавлений. Сноска a уместно отмечена после «наживы», а сноска b — после выражения, соответствующего וַיַּטּוּ מִשְׁפָּט. В английском audit trail сноска b прикреплена к слову «bribes», хотя её содержание относится к заключительному выражению о суде; русский проект этого ошибочного размещения не повторяет.
