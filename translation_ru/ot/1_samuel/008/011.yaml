base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/011.yaml
  text: 'He said[a], “This will be the custom of the king who will reign over you: he will take your sons and assign them to his chariots and among his horsemen[c][b], and they will run before his chariots.”'
translation:
  language: ru
  text: 'Он сказал: «Вот как будет поступать[a] царь, который станет царствовать над вами: он будет брать ваших сыновей и назначать их служить при своих колесницах и среди своих всадников, и они будут бежать перед его колесницей[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот каково будет право царя, который станет царствовать над вами». Еврейское слово мишпат может означать обычный порядок действий, законное притязание или правовую норму; здесь оно описывает, как царь будет обращаться с народом.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово, переведённое «колесница», в обоих употреблениях стоит в единственном числе. В первом случае оно может иметь собирательное значение: «колесницы» или «колесничное войско»; в заключительной фразе буквально сказано: «перед его колесницей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: как будет поступать
  rationale: В данном контексте слово обозначает установленный образ действий или притязания царя, а не судебный приговор. Такая передача естественна по-русски и не утверждает однозначно, что эти действия законны.
- source_word: הַמֶּלֶךְ אֲשֶׁר יִמְלֹךְ עֲלֵיכֶם
  choice: царь, который станет царствовать над вами
  rationale: Сохраняет царскую семантику корня מלך и значение власти над народом.
- source_word: אֶת־בְּנֵיכֶם יִקָּח
  choice: он будет брать ваших сыновей
  rationale: בנים здесь означает именно сыновей; контекст дальнейших стихов связан с мужской военной и царской службой.
- source_word: וְשָׂם לוֹ
  choice: назначать их служить
  rationale: Передаёт не просто размещение, а определение сыновей на службу царю; значение לוֹ выражено через «служить» и последующее описание царских подразделений.
- source_word: בְּמֶרְכַּבְתּוֹ
  choice: при своих колесницах
  rationale: Единственное число может иметь собирательное значение. «При своих колесницах» естественно обозначает назначение в колесничное подразделение, не заставляя понимать, будто все сыновья помещены в одну колесницу.
- source_word: וּבְפָרָשָׁיו
  choice: среди своих всадников
  rationale: פָרָשִׁים обозначает всадников или конницу; формулировка сохраняет образ людей, назначенных в соответствующее воинское подразделение.
- source_word: וְרָצוּ לִפְנֵי מֶרְכַּבְתּוֹ
  choice: и они будут бежать перед его колесницей
  rationale: Буквально сохраняет единственное число в заключительной фразе и передаёт функцию царских скороходов, бежавших впереди царской колесницы.
theological_decisions:
- issue: Нормативность царского מִשְׁפַּט
  choice: описательное «как будет поступать»
  alternative: «право царя»
  rationale: Еврейское слово допускает значение права, нормы или обычая, но контекст предупреждения описывает действия царя. Основной текст не должен без необходимости объявлять эти действия законным правом; возможное юридическое понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Будущее повторяющееся действие передано формами «будет брать», «назначать», «будут бежать». Сохранены конкретные «сыновья» и образ царской колесницы; неоднозначность מִשְׁפַּט вынесена в сноску.
