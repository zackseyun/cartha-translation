base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/006.yaml
  text: But the matter was displeasing in Samuel’s eyes when they said[b][a], “Give us a king to judge us.” And Samuel prayed to Yahweh.
translation:
  language: ru
  text: 'Но Самуил счёл это дурным, когда они сказали: «Дай нам царя, чтобы он судил нас[a]». И Самуил помолился Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы он управлял нами». Еврейский глагол может обозначать как совершение суда, так и управление народом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע ... בְּעֵינֵי שְׁמוּאֵל
  choice: показалось Самуилу дурным
  rationale: Передаёт оценочную силу глагола רעע и одновременно естественно выражает еврейскую идиому «в глазах Самуила» по-русски; речь не только об эмоции, но и об отрицательной оценке.
- source_word: הַדָּבָר
  choice: это требование
  rationale: דבר широко означает «слово, дело, обстоятельство»; в данном контексте оно непосредственно отсылает к требованию старейшин дать им царя. Указательное «это» сохраняет анафорическую связь.
- source_word: כַּאֲשֶׁר אָמְרוּ
  choice: когда они сказали
  rationale: כאשׁר здесь естественно понимать во временном значении, не усиливая причинную связь до «потому что».
- source_word: תְּנָה לָּנוּ מֶלֶךְ
  choice: Дай нам царя
  rationale: Сохраняет прямоту императива נתן и обычное значение מלך.
- source_word: לְשָׁפְטֵנוּ
  choice: чтобы он судил нас
  rationale: Сохраняет лексическую связь שׁפט с темой судей в книге, хотя в данном контексте слово включает управление народом.
- source_word: וַיִּתְפַּלֵּל
  choice: помолился
  rationale: Обычное и точное соответствие hitpael глагола פלל; «ходатайствовал» было бы чрезмерно конкретным.
- source_word: אֶל יְהוָה
  choice: Яхве
  rationale: Предлог естественно включён в русское управление «помолился Яхве»; тетраграмматон передан личным именем «Яхве» согласно проектной установке.
theological_decisions:
- issue: Сила отрицательной оценки וַיֵּרַע
  choice: показалось Самуилу дурным
  alternative: не понравилось Самуилу / огорчило Самуила
  rationale: Выбор сохраняет морально-оценочный оттенок корня רעע и не сводит реакцию Самуила лишь к неудовольствию или огорчению; при этом ясно, что это оценка Самуила.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: «Яхве» передаёт личное имя и соответствует указанной установке проекта, не заменяя его титулом.
- issue: Значение לְשָׁפְטֵנוּ
  choice: чтобы он судил нас
  alternative: чтобы он управлял нами
  rationale: Буквальное «судил» сохраняет связь с институтом судей и допускает более широкий смысл правления, отмеченный в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Конструкция «показалось Самуилу дурным» звучит естественнее буквального «было злом в глазах Самуила», но сохраняет сильную отрицательную оценку. Требование старейшин передано прямой речью без смягчения.
