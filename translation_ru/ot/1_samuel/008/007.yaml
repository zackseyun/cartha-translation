  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל שְׁמוּאֵ֔ל שְׁמַע֙ בְּ/ק֣וֹל הָ/עָ֔ם לְ/כֹ֥ל אֲשֶׁר יֹאמְר֖וּ אֵלֶ֑י/ךָ כִּ֣י לֹ֤א אֹֽתְ/ךָ֙ מָאָ֔סוּ כִּֽי אֹתִ֥/י מָאֲס֖וּ מִ/מְּלֹ֥ךְ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/007.yaml
  text: And Yahweh said to Samuel[a], “Listen to the voice of the people in all that they say to you, for they have not rejected you, but they have rejected me from being king over them.”
translation:
  language: ru
  text: 'И сказал Яхве Самуилу: «Послушайся народа во всём, что они говорят тебе, потому что не тебя они отвергли, а Меня отвергли как своего царя».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а Меня отвергли, чтобы Я не царствовал над ними».'
    reason: Буквально еврейская конструкция выражает отвержение Яхве в отношении Его царствования над народом; основной текст передаёт это естественным русским выражением «как своего царя».
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: שְׁמַע בְּקוֹל הָעָם
  choice: Послушайся народа
  rationale: Еврейская идиома «слушать голос» здесь означает не только услышать, но и внять просьбе, то есть поступить согласно ей; современное русское «послушайся» естественно передаёт смысл контекста.
- source_word: לְכֹל אֲשֶׁר יֹאמְרוּ אֵלֶיךָ
  choice: во всём, что они говорят тебе
  rationale: Сохраняет всеохватность לְכֹל и близко передаёт структуру исходного выражения.
- source_word: מָאַס
  choice: отвергли
  rationale: Глагол выражает отказ от кого-либо или неприятие; «отвергли» одинаково уместно в обеих контрастных частях.
- source_word: כִּי לֹא אֹתְךָ מָאָסוּ כִּי אֹתִי מָאֲסוּ
  choice: потому что не тебя они отвергли, а Меня отвергли
  rationale: Сохраняет контраст и эмфатическое вынесение объектов «тебя» и «Меня», а также повтор глагола исходного текста.
- source_word: מִמְּלֹךְ עֲלֵיהֶם
  choice: чтобы Я не царствовал над ними
  rationale: В контексте после глагола отвержения конструкция с מִן и инфинитивом указывает, что народ отвергает царствование Яхве. Русская целевая конструкция ясно и естественно передаёт этот смысл, сохраняя глагольную идею царствования.
theological_decisions:
- issue: Божественное царствование и просьба Израиля о человеческом царе
  choice: Просьба народа представлена как отвержение царствования Яхве над ним.
  alternative: Народ отверг лишь руководство Самуила, а не самого Яхве.
  rationale: Еврейский текст прямо противопоставляет Самуила Яхве и называет глубинным смыслом поступка народа отвержение Божьего царствования; перевод не добавляет последующих богословских выводов.
- issue: Синтаксическое отношение מִמְּלֹךְ к מָאֲסוּ
  choice: «отвергли, чтобы Я не царствовал над ними»
  alternative: «отвергли Меня как своего царя»
  rationale: Выбранный вариант сохраняет глагольную форму инфинитива מלך и не превращает её в именное обозначение, хотя альтернативный вариант передаёт близкий смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Инверсия «не тебя… а Меня» сохраняет акцент оригинала. Местоимение «Меня» написано с прописной буквы как общепринятая русская почтительная норма при прямой речи Бога.
