source:
  edition: WLC
  text: וּ/זְעַקְתֶּם֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִ/לִּ/פְנֵ֣י מַלְכְּ/כֶ֔ם אֲשֶׁ֥ר בְּחַרְתֶּ֖ם לָ/כֶ֑ם וְ/לֹֽא יַעֲנֶ֧ה יְהוָ֛ה אֶתְ/כֶ֖ם בַּ/יּ֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/018.yaml
  text: And in that day you will cry out because of your king, whom you have chosen for yourselves, but Yahweh will not answer you in that day.
translation:
  language: ru
  text: И в тот день вы будете взывать из-за вашего царя, которого избрали себе, но Яхве не ответит вам в тот день.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּזְעַקְתֶּם
  choice: вы будете взывать
  rationale: Глагол זעק обозначает сильный крик в бедствии, нередко призыв о помощи. «Будете взывать» передаёт напряжённость и подразумеваемую мольбу, не добавляя прямо не названного дополнения.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественное русское соответствие устойчивому обстоятельству времени; повтор выражения сохранён ради смыслового акцента и торжественного звучания.
- source_word: מִלִּפְנֵי
  choice: из-за
  rationale: 'Хотя буквально оборот связан со значением «от лица / от присутствия», здесь он выражает причину бедствия: народ станет взывать из-за своего царя.'
- source_word: מַלְכְּכֶם
  choice: вашего царя
  rationale: Прямо передаёт существительное с местоименным суффиксом второго лица множественного числа.
- source_word: אֲשֶׁר בְּחַרְתֶּם לָכֶם
  choice: которого избрали себе
  rationale: Сохраняет относительное предложение, совершённость выбора и оттенок личной ответственности народа, выраженный לָכֶם.
- source_word: וְלֹא יַעֲנֶה
  choice: но … не ответит
  rationale: Союз וְ может означать простое присоединение, однако контраст между взыванием народа и отсутствием ответа естественно передаётся русским «но».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶתְכֶם
  choice: вам
  rationale: 'При русском глаголе «ответить» нормативно употребляется дательный падеж: «ответить вам».'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יְהוָה. Форма «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер отсутствия ответа Бога
  choice: не ответит
  alternative: не откликнется; не услышит
  rationale: Глагол ענה означает «отвечать». Перевод не уточняет, означает ли это отказ избавить, отказ удовлетворить просьбу или отсутствие иного отклика, тем самым сохраняя смысловую напряжённость исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Архаическое «возопиете» не использовано; повтор «в тот день» сохранён вслед за еврейским текстом.
