  text: He will take a tenth of your seed and your vineyards and give it to his officials and his servants[a].
translation:
  language: ru
  text: Он будет брать десятую часть ваших посевов и ваших виноградников и отдавать её своим придворным[a] и слугам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «евнухам»; еврейское слово סָרִיסָיו может обозначать как евнухов, так и, шире, царских придворных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעֵיכֶם
  choice: ваших посевов
  rationale: זֶרַע буквально означает «семя», но в сельскохозяйственном контексте может обозначать посевы или урожай. «Посевов» естественно передаёт смысл того, с чего царь будет брать десятую часть, не сужая значение до одного лишь зерна.
- source_word: כַרְמֵיכֶם
  choice: ваших виноградников
  rationale: כֶּרֶם обычно означает «виноградник». Прямой перевод сохраняет параллель с посевами; из глагола «брать десятую часть» понятно, что имеется в виду доход или продукция виноградников.
- source_word: יַעְשֹׂר
  choice: будет брать десятую часть
  rationale: Hифиль глагола עשר здесь обозначает взимание десятой части. Такая формулировка ясно передаёт царскую поборную практику и избегает преимущественно культового оттенка слова «десятина».
- source_word: וְנָתַן
  choice: и отдавать её
  rationale: Форма с последовательным ו продолжает описание будущих действий царя. Несовершенный вид «отдавать» естественно согласуется с «будет брать», а местоимение «её» ясно относится к десятой части.
- source_word: לְסָרִיסָיו
  choice: своим придворным
  rationale: סָרִיס может означать как евнуха, так и царского придворного или чиновника. В данном административном контексте «придворным» передаёт функцию, не утверждая физический статус; альтернативное значение сохранено в сноске.
- source_word: וְלַעֲבָדָיו
  choice: и слугам
  rationale: עֶבֶד охватывает значения «слуга» и «раб». Здесь речь идёт о людях царя в широком смысле, поэтому «слугам» звучит естественно и не уточняет степень их несвободы, которой сам контекст не определяет.
