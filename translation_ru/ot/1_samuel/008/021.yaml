  text: וַ/יִּשְׁמַ֣ע שְׁמוּאֵ֔ל אֵ֖ת כָּל דִּבְרֵ֣י הָ/עָ֑ם וַֽ/יְדַבְּרֵ֖/ם בְּ/אָזְנֵ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/021.yaml
  text: Samuel heard all the words of the people[b][a], and he spoke them in the ears of Yahweh.
translation:
  language: ru
  text: Самуил выслушал всё, что сказал народ, и пересказал это пред Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «произнёс их в уши Яхве», то есть сказал так, чтобы Яхве услышал, или сказал это перед Ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: выслушал
  rationale: В данном контексте שׁמע обозначает внимательное восприятие сказанного; «выслушал» естественно передаёт завершённое действие в русском повествовании.
- source_word: כָּל דִּבְרֵי הָעָם
  choice: всё, что сказал народ
  rationale: Динамически и точно передаёт буквальное «все слова народа», сохраняя значение полноты без неестественной русской формулировки.
- source_word: וַיְדַבְּרֵם
  choice: пересказал это
  rationale: Местоименный суффикс отсылает к словам народа. «Пересказал» ясно передаёт, что Самуил изложил услышанное Яхве, не добавляя идеи дословного цитирования.
- source_word: בְּאָזְנֵי
  choice: пред
  rationale: Еврейская идиома буквально означает «в уши» и указывает на произнесение в чьём-либо присутствии или слухе. Русское «пред» сохраняет торжественный регистр и смысл присутствия; буквальный образ пояснён в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: שְׁמוּאֵל
  choice: Самуил
  rationale: Использована устоявшаяся русская библейская форма имени.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, а не титул; форма «Яхве» делает это явным, не устраняя традиционную альтернативу из рассмотрения.
- issue: Характер речи Самуила перед Яхве
  choice: пересказал это пред Яхве
  alternative: произнёс их в уши Яхве
  rationale: Выбран естественный русский эквивалент еврейской конструкции. Он не уточняет, была ли речь молитвой, докладом или дословным повторением, и тем самым сохраняет неопределённость исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским оттенком. Формулировка естественна для обычного читателя; еврейский образ речи «в уши» сохранён в сноске.
