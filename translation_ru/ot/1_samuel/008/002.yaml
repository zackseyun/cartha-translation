lexical_decisions:
- source_word: וַיְהִי שֶׁם
  choice: имя … было
  rationale: В формуле наречения וַיְהִי выполняет связочную функцию; по-русски естественно передать конструкцией «имя … было».
- source_word: בְּנוֹ הַבְּכוֹר
  choice: его первенца
  rationale: Сохраняет значение «его первородный [сын]» без избыточного повторения слова «сын»; принадлежность к мужскому полу ясна из контекста и личного имени.
- source_word: יוֹאֵל
  choice: Иоиль
  rationale: Традиционная русская библейская форма еврейского личного имени יוֹאֵל.
- source_word: מִשְׁנֵהוּ
  choice: второго
  rationale: Передаёт порядковое значение «его второй»; слово «сын» естественно подразумевается из параллельной конструкции.
- source_word: אֲבִיָּה
  choice: Авия
  rationale: Традиционная русская библейская форма еврейского личного имени אֲבִיָּה.
- source_word: שֹׁפְטִים
  choice: они были судьями
  rationale: Множественное причастие обозначает постоянную роль обоих сыновей; формулировка ясна и сохраняет служебное значение слова.
- source_word: בִּבְאֵר שָׁבַע
  choice: в Вирсавии
  rationale: Устоявшаяся русская библейская форма географического названия с естественным обозначением места.
