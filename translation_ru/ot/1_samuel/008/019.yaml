  text: But the people refused to listen to the voice of Samuel[a], and they said, “No, but there shall be a king over us.”
translation:
  language: ru
  text: 'Но народ отказался слушаться Самуила[a] и сказал: «Нет, над нами будет царь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слушать голос Самуила»; еврейский оборот может означать также «внимать Самуилу» или «повиноваться ему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ
  choice: отказался
  rationale: Глагол מאן выражает сознательный отказ или нежелание; единственное число естественно согласуется с собирательным существительным «народ».
- source_word: הָעָם
  choice: народ
  rationale: עם обозначает здесь израильский народ как единое целое.
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: слушаться
  rationale: Оборот שמע בקול означает не просто слышать голос, а внимать сказанному и повиноваться; русское «слушаться» естественно передаёт эту идиому. Буквальный образ отмечен в сноске.
- source_word: שְׁמוּאֵל
  choice: Самуила
  rationale: Использована традиционная русская форма имени; родительный падеж обусловлен управлением глагола «слушаться».
- source_word: וַיֹּאמְרוּ
  choice: и сказал
  rationale: Форма множественного числа в еврейском относится к людям, составляющим народ; в русском при собирательном подлежащем «народ» нормативно единственное число.
- source_word: לֹא
  choice: Нет!
  rationale: Отдельно стоящее отрицание выражает решительное неприятие слов Самуила; восклицательный знак передаёт его эмфатическую силу.
- source_word: כִּי אִם
  choice: Пусть
  rationale: После категорического לֹא сочетание כִּי אִם вводит противопоставленное требование. В русском отдельное «но» после «Нет!» звучало бы тяжеловесно, а конструкция с «пусть» естественно передаёт настойчивое волеизъявление.
- source_word: מֶלֶךְ יִהְיֶה עָלֵינוּ
  choice: Пусть над нами будет царь
  rationale: Порядок слов сохраняет отношение власти, выраженное עָלֵינוּ, а юссивно-волитивное прочтение формы יִהְיֶה подходит контексту настойчивого требования народа.
theological_decisions:
- issue: Степень обязательности требования о царе
  choice: «Пусть над нами будет царь»
  alternative: «Над нами будет царь»
  rationale: Форма יִהְיֶה допускает утверждение будущего, однако после решительного «Нет!» контекст поддерживает волитивный оттенок. Перевод не уточняет нравственную или богословскую оценку требования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены краткость, решительность ответа народа и выражение царской власти «над нами».
