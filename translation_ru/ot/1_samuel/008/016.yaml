  text: He will take your male servants[a], your female servants, your best young men, and your donkeys, and use them for his work.
translation:
  language: ru
  text: Он заберёт ваших рабов[a] и рабынь, лучших из ваших юношей и ваших ослов и будет использовать их для своей работы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуг… служанок». Еврейские слова могут обозначать слуг в более широком смысле, однако контекст принудительного изъятия царём говорит в пользу перевода «рабы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵיכֶם
  choice: ваших рабов
  rationale: עֶבֶד может означать как раба, так и слугу; в контексте насильственного присвоения людей царём «рабов» яснее передаёт зависимое положение и образует естественную пару с «рабынь».
- source_word: שִׁפְחוֹתֵיכֶם
  choice: рабынь
  rationale: שִׁפְחָה обозначает рабыню или служанку; «рабынь» сохраняет параллель с עַבְדֵיכֶם и соответствует контексту принудительного царского труда.
- source_word: בַּחוּרֵיכֶם הַטּוֹבִים
  choice: лучших из ваших юношей
  rationale: בָּחוּר обозначает молодого мужчину в расцвете сил, а הַטּוֹבִים выделяет лучших; конструкция «лучших из ваших юношей» естественна по-русски и сохраняет оба оттенка.
- source_word: חֲמוֹרֵיכֶם
  choice: ваших ослов
  rationale: Прямое и современное соответствие обычному значению חֲמוֹר.
- source_word: יִקָּח
  choice: заберёт
  rationale: לקח значит «брать, забирать»; «заберёт» передаёт предсказываемое присвоение царём, не усиливая глагол до явно насильственного «отнимет».
- source_word: וְעָשָׂה לִמְלַאכְתּוֹ
  choice: и будет использовать их для своих работ
  rationale: Оборот означает, что царь направит перечисленных людей и животных на выполнение собственных работ; выбранная формулировка естественна в современном русском и сохраняет присваивающий характер действия.
