  source_fidelity: 'Текст точно передаёт два последовательных действия: старейшины Израиля собрались и пришли к Самуилу. «Все старейшины Израиля» соответствует כֹּל זִקְנֵי יִשְׂרָאֵל; «в Раму» адекватно передаёт направительное הָרָמָתָה. Сноска корректно отмечает буквальное направительное значение и не устраняет его неоднозначность в основном тексте.'
