  text: Then all the elders of Israel gathered together and came to Samuel at Ramah[a].
translation:
  language: ru
  text: Тогда собрались все старейшины Израиля и пришли к Самуилу в Раму[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в Раму», то есть по направлению к Раме, где находился Самуил.'
    reason: Уточнение направительного значения формы הָרָמָתָה и связи места назначения с Самуилом.
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: собрались
  rationale: Форма хитпаэль от קבץ передаёт совместное собирание группы; русское «собрались» естественно выражает это значение без избыточного «вместе».
- source_word: כֹּל
  choice: все
  rationale: Передаёт полноту представительной группы старейшин.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: старейшины Израиля
  rationale: Устоявшееся и понятное обозначение старших общественно-политических представителей Израиля.
- source_word: וַיָּבֹאוּ אֶל
  choice: пришли к
  rationale: Естественно передаёт בוא с אֶל и последовательность повествовательных действий.
- source_word: שְׁמוּאֵל
  choice: Самуил
  rationale: Использована традиционная русская форма библейского имени.
- source_word: הָרָמָתָה
  choice: в Раму
  rationale: Направительный суффикс ה выражает движение к Раме; винительный падеж с «в» естественно сохраняет значение направления в русском языке.
