base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/008.yaml
  text: According to all the deeds that they have done from the day I brought them up out of Egypt to this day[a], forsaking me and serving other gods[b], so they are also doing to you.
translation:
  language: ru
  text: Так же, как они поступали с того дня, когда Я вывел их из Египта, и до сего дня[a] — оставляли Меня и служили другим богам[b], — так они поступают и с тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вплоть до нынешнего дня».'
    reason: lexical_alternative
  - marker: b
    text: «Служили другим богам» можно также передать как «поклонялись другим богам»; буквально употреблён глагол «служить».
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכָל הַמַּעֲשִׂים אֲשֶׁר עָשׂוּ
  choice: Каковы были все их дела
  rationale: כְּכָל вводит сопоставление всего прежнего поведения Израиля с нынешним отношением к Самуилу. Такая формулировка передаёт сравнительную связь и избегает ненормативного русского оборота «согласно всем делам».
- source_word: מִיּוֹם הַעֲלֹתִי אֹתָם מִמִּצְרַיִם
  choice: с того дня, когда Я вывел их из Египта
  rationale: Каузатив עלה в устойчивой формуле исхода означает «вывести»; русское выражение естественно и точно передаёт избавление из Египта.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: и до этого дня
  rationale: Сохраняет обе границы временного отрезка, выраженные מִן…וְעַד, и близко следует еврейской формулировке.
- source_word: וַיַּעַזְבֻנִי
  choice: они оставляли Меня
  rationale: Прошедший несовершенный вид по-русски передаёт повторяющийся образ действий на протяжении названного периода; «оставляли» сохраняет смысл отказа от верности Богу.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: и служили другим богам
  rationale: «Служили» непосредственно передаёт עבד и сохраняет возможный спектр религиозного служения и поклонения.
- source_word: כֵּן הֵמָּה עֹשִׂים גַּם לָךְ
  choice: Так они поступают и с тобой
  rationale: Сохраняет аналогию, актуальное настоящее время причастия עֹשִׂים и намеренно не уточняет, в чём именно состоит действие по отношению к Самуилу.
theological_decisions:
- issue: Соотношение отвержения Самуила и прежней неверности Израиля Господу
  choice: Сохранена аналогия между прежним поведением народа перед Богом и нынешним отношением к Самуилу без дополнительного истолкования.
  alternative: «Они восстают против тебя так же, как восставали против Меня».
  rationale: Еврейский текст говорит, что народ оставлял Господа и служил другим богам, а теперь «так» поступает с Самуилом; он не называет нынешнее действие прямо «восстанием».
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Заглавные местоимения в речи Бога следуют принятой русской издательской традиции. Двоеточие делает явным пояснительный характер следующих глаголов, не превращая его в богословскую интерпретацию.
