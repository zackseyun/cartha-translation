  text: צֹאנְ/כֶ֖ם יַעְשֹׂ֑ר וְ/אַתֶּ֖ם תִּֽהְיוּ ל֥/וֹ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/017.yaml
  text: He will take a tenth of your flocks[a], and you will become his servants.
translation:
  language: ru
  text: Он будет брать десятую часть вашего мелкого скота, а вы станете его рабами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугами». Еврейское слово может обозначать как рабов, так и людей на службе; здесь контекст царских поборов и утраты свободы указывает на рабское подчинение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאנְכֶם
  choice: вашего мелкого скота
  rationale: צֹאן обозначает мелкий домашний скот, прежде всего овец и коз; такой перевод точнее, чем более узкое «ваших овец».
- source_word: יַעְשֹׂר
  choice: будет брать десятую часть
  rationale: В контексте царских поборов глагол означает взимание десятой доли; формулировка не создаёт культовой или добровольной окраски, возможной у слова «десятина».
- source_word: וְאַתֶּם תִּהְיוּ לוֹ
  choice: а вы станете его
  rationale: Глагол «быть» здесь описывает итог царских притязаний; «станете» естественно передаёт результирующий оттенок, не меняя смысла.
- source_word: לַעֲבָדִים
  choice: рабами
  rationale: עֲבָדִים может означать рабов или слуг; в предупреждении о царском произволе и утрате свободы «рабами» лучше передаёт суровость подчинения.
theological_decisions:
- issue: Передача עֲבָדִים в контексте подчинения царю
  choice: рабами
  alternative: слугами
  rationale: Контекст перечисляет принудительные царские изъятия и завершается утратой народом свободы. «Рабами» сохраняет силу предупреждения, тогда как «слугами» может восприниматься как обычная добровольная служба; лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и dignified, без архаизмов. «Мелкий скот» точно охватывает овец и коз, а «брать десятую часть» ясно передаёт принудительный характер царского побора.
