  source_fidelity: 'Смысл передан верно: Яхве велит Самуилу уступить требованию народа и поставить им царя, после чего Самуил отпускает собравшихся по их городам. Однако «послушай их голоса» в современном русском воспринимается как призыв услышать звуки голосов, тогда как еврейский идиом שׁמע בקול означает в данном контексте «послушай их / внемли их просьбе, уступи ей».'
