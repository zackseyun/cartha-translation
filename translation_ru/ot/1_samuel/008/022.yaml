base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/022.yaml
  text: And Yahweh said to Samuel[a], “Listen to their voice and make a king for them.” Then Samuel said to the men of Israel, “Go[b], each man to his city.”
translation:
  language: ru
  text: 'И сказал Яхве Самуилу: «Послушай их[a] и поставь им царя». Тогда Самуил сказал мужчинам Израиля: «Идите, каждый — в свой город»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «послушай их голос». Этот еврейский оборот может означать «прислушайся к ним, исполни их просьбу».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мужчинам Израиля». Это выражение может обозначать собравшихся израильтян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом «Господь».
- source_word: שְׁמַע בְּקוֹלָם
  choice: Послушай их голоса
  rationale: Сохранён еврейский оборот, который в данном контексте означает не только выслушать, но и удовлетворить просьбу.
- source_word: וְהִמְלַכְתָּ לָהֶם מֶלֶךְ
  choice: поставь им царя
  rationale: Каузативная форма глагола מלך обозначает возведение или назначение человека царём; «поставь» естественно передаёт это по-русски.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: мужам Израиля
  rationale: Сохранено явно мужское обозначение собравшихся представителей Израиля.
- source_word: לְכוּ
  choice: Идите
  rationale: Прямое и естественное соответствие повелительной форме множественного числа.
- source_word: אִישׁ לְעִירוֹ
  choice: каждый в свой город
  rationale: Распределительное אִישׁ естественно передано словом «каждый»; притяжательное «свой» ясно выражает еврейский суффикс.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя Бога; форма «Яхве» передаёт тетраграмматон как имя и не заменяет его титулом.
- issue: Мужская форма в אַנְשֵׁי יִשְׂרָאֵל
  choice: мужам Израиля
  alternative: израильтянам; народу Израиля
  rationale: Еврейское выражение явно говорит о мужчинах, вероятно представляющих собравшийся народ, поэтому мужская форма сохранена.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Союзное начало «И сказал» сохраняет повествовательную связь с предыдущим контекстом; инверсия не используется сверх необходимого. Маркер [b] поставлен после всего высказывания, поскольку примечание относится к обозначению адресатов, а не к повелению «Идите».
