  terminology: «Яхве» последовательно передаёт тетраграмматон как личное имя. «Поставь им царя» точно и естественно передаёт каузативное הִמְלַכְתָּ. «Мужчинам Израиля» сохраняет явно мужское обозначение אַנְשֵׁי; «каждый» передаёт распределительное אִישׁ без неестественного утяжеления фразы.
