    reason: lexical_alternative
  - marker: b
    text: Еврейское слово «минха», переведённое как «приношение», нередко означает именно хлебное приношение.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и следствие из предшествующего объявления суда.
- source_word: נִשְׁבַּעְתִּי
  choice: Я поклялся
  rationale: Совершенный вид выражает состоявшуюся и сохраняющую силу торжественную клятву.
- source_word: לְבֵית עֵלִי
  choice: о доме Илия
  rationale: Предлог ל обозначает объект, которого касается клятва; по-русски «о доме» естественнее, чем буквальное «дому», и не усиливает враждебную направленность сверх текста.
- source_word: אִם
  choice: никогда не
  rationale: После глагола клятвы אִם входит в формулу решительного отрицания; вместе с עַד עוֹלָם естественно передаётся как «никогда не».
- source_word: יִתְכַּפֵּר
  choice: будет искуплена
  rationale: Форма имеет пассивно-рефлексивное значение устранения вины посредством искупления; русский богословски ёмкий и понятный эквивалент — «будет искуплена».
- source_word: עֲוֺן
  choice: вина
  rationale: עָוֹן может обозначать как беззаконие, так и возникшую вследствие него виновность; при глаголе искупления «вина» звучит естественно и сохраняет судебно-жертвенный смысл.
- source_word: בֵּית עֵלִי
  choice: дом Илия
  rationale: Сохраняет семейно-династическое значение древнееврейского выражения.
- source_word: בְּזֶבַח
  choice: жертвой
  rationale: Предлог обозначает средство, а творительный падеж естественно передаёт его по-русски.
- source_word: וּבְמִנְחָה
  choice: ни приношением
  rationale: В отрицательной конструкции парное «ни… ни…» естественно; «приношение» сохраняет более широкий смысл מִנְחָה, а конкретизация отмечена в сноске.
- source_word: עַד עוֹלָם
  choice: никогда
  rationale: В сочетании с отрицательной клятвенной формулой подчёркивает окончательность невозможности искупления указанными средствами.
theological_decisions:
- issue: Характер суда над домом Илия
  choice: Текст утверждает, что вина дома Илия не будет искуплена жертвой или приношением.
  alternative: 'Можно понимать это уже: исключены именно названные культовые средства, но стих сам по себе не формулирует общего учения о невозможности всякого Божьего прощения.'
  rationale: Перевод сохраняет прямое утверждение о бессилии жертвенных средств в данном случае, не расширяя его до более общего догматического вывода.
- issue: Клятвенная формула с אִם
  choice: Передать как решительное отрицание «никогда не».
  alternative: 'Более формально: «поистине не будет искуплена».'
  rationale: В древнееврейской клятвенной формуле אִם после «Я поклялся» не вводит обычное условие, а выражает усиленное отрицание; с עַד עוֹלָם естественный русский эквивалент — «никогда не».
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Заглавная буква в «Я» указывает на говорящего Бога по русской издательской традиции. Конструкция «ни жертвой, ни приношением» естественно передаёт два названных культовых средства.
