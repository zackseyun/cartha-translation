  text: On that day I will carry out against Eli all that I have spoken concerning his house[b][a], from beginning to end.
translation:
  language: ru
  text: В тот день Я приведу в исполнение против Илия[b] всё, что Я сказал о его доме[a], от начала до конца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
