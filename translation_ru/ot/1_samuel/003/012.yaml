lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Естественная русская передача указательного оборота, обозначающего определённое будущее время.
- source_word: אָקִים
  choice: Я исполню
  rationale: Порода hифиль глагола קום при дополнении «всё, что говорил» означает сделать сказанное действительным, привести его в исполнение.
- source_word: אֶל עֵלִי
  choice: над Илием
  rationale: В контексте объявленного суда предлог אֶל передаёт неблагоприятную направленность действия. Формулировка «исполню над Илием» естественна для возвышенного современного русского языка, а буквальная возможность иной связи отмечена в сноске.
- source_word: אֵת כָּל אֲשֶׁר דִּבַּרְתִּי
  choice: всё, что говорил
  rationale: Сохраняет полноту כָּל אֲשֶׁר и отсылку к ранее произнесённому Божьему слову без ненужного уточнения времени.
- source_word: אֶל בֵּיתוֹ
  choice: о его доме
  rationale: При глаголе речи אֶל может указывать предмет сказанного; «о его доме» точно и естественно передаёт эту связь.
- source_word: בֵּיתוֹ
  choice: его доме
  rationale: 'Слово «дом» сохраняет широту еврейского בַּיִת: семью, род и в данном контексте священнический дом.'
- source_word: הָחֵל וְכַלֵּה
  choice: от начала до конца
  rationale: 'Идиоматично передаёт парное выражение полноты: всё объявленное будет исполнено целиком.'
theological_decisions:
- issue: Объём суда над Илием и его домом
  choice: Сохранено широкое слово «дом», не ограниченное только ближайшими родственниками Илия.
  alternative: Передать как «семья», «род» или «священнический дом».
  rationale: בֵּיתוֹ допускает все эти взаимосвязанные значения; основной текст не должен искусственно сужать или расширять их.
- issue: Направленность исполнения сказанного
  choice: «исполню над Илием» передаёт контекст суда.
  alternative: «исполню для Илия» или «исполню по отношению к Илию».
  rationale: Контекст ясно неблагоприятен для Илия, однако формальная многозначность предлога אֶל сохранена в сноске, чтобы не скрывать языковую альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краткий и ясный; формула «от начала до конца» естественно выражает полноту исполнения.
