base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/008.yaml
  text: And Yahweh called Samuel again a third time. So he got up and went to Eli and said, “Here I am, for you called me.” Then Eli understood that Yahweh was calling the boy.
translation:
  language: ru
  text: 'И Яхве[a] снова позвал Самуила — в третий раз. Самуил встал, пошёл к Илию и сказал: «Вот я: ты позвал меня». Тогда Илий понял, что Яхве зовёт мальчика.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога, переданное в еврейском тексте буквами יהוה.
    reason: Поясняет непривычную для части русскоязычных читателей передачу тетраграмматона и устраняет смешение кириллицы с латиницей.
lexical_decisions:
- source_word: וַיֹּסֶף ... קְרֹא
  choice: снова позвал
  rationale: Сочетание יָסַף с инфинитивом передаёт повторение действия. «Снова позвал» естественно выражает это по-русски, не воспроизводя буквально неидиоматичное «добавил звать».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя Бога, а не заменено титулом «Господь».
- source_word: בַּשְּׁלִשִׁית
  choice: в третий раз
  rationale: Точно обозначает третье повторение призыва; тире позволяет естественно соединить это уточнение со словом «снова».
- source_word: וַיָּקָם וַיֵּלֶךְ אֶל־עֵלִי
  choice: Самуил встал, пошёл к Илию
  rationale: Имя повторено вместо местоимения для ясности в русском повествовании; глаголы передают последовательность действий без архаизации.
- source_word: הִנְנִי
  choice: Вот я
  rationale: Устойчивый и понятный русский ответ на зов, передающий присутствие и готовность откликнуться.
- source_word: כִּי קָרָאתָ לִי
  choice: ведь ты звал меня
  rationale: כִּי указывает причину прихода Самуила. Частица «ведь» естественна в прямой речи и передаёт его уверенность в том, что звал Илий.
- source_word: וַיָּבֶן
  choice: понял
  rationale: Передаёт наступившее осознание Илием происходящего без усиления значения до особого духовного прозрения.
- source_word: קֹרֵא
  choice: зовёт
  rationale: Причастная форма представляет действие как происходящее; настоящее время по-русски сохраняет этот аспект.
- source_word: לַנָּעַר
  choice: мальчика
  rationale: נַעַר допускает значения от мальчика до юноши; в контексте юного Самуила под опекой Илия слово «мальчик» наиболее уместно и современно.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом, не привнося конфессиональной замены.
translation_notes:
  register: 'Современный литературный русский язык с простым, достойным повествовательным стилем. Имена переданы в традиционной русской библейской форме: Самуил, Илий. Архаизмы «отрок», «вот, я» и тяжёлый буквализм устранены; повторность и аспект еврейских форм сохранены.'
