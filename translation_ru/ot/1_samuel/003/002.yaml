lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: В русском повествовании временное обстоятельство естественно вводит сцену без архаичного «и было». Указательное значение הַהוּא сохранено словом «тот».
- source_word: שֹׁכֵב
  choice: лежал
  rationale: Причастие обозначает продолжающееся состояние Илия; русский глагол несовершенного вида передаёт его естественно.
- source_word: בִּמְקֹמוֹ
  choice: на своём месте
  rationale: Сохраняет общее значение מָקוֹם и не уточняет место как комнату, чего еврейский текст прямо не говорит.
- source_word: וְעֵינוֹ
  choice: его глаза
  rationale: Форма «глаз» может обозначать зрение в целом; по-русски при описании ослабления зрения естественно употребить множественное число. Неоднозначность отмечена в сноске.
- source_word: הֵחֵלּוּ כֵהוֹת
  choice: уже начали тускнеть
  rationale: Передаёт начинательность הֵחֵלּוּ и постепенное ослабление зрения; «уже» естественно показывает, что процесс к этому моменту начался, не утверждая его завершённости.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: он не мог видеть
  rationale: Прямо и естественно передаёт неспособность видеть в данном повествовательном контексте.
