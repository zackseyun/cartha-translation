  text: Then Yahweh called to Samuel[a], and he said, “Here I am.”
translation:
  language: ru
  text: 'И воззвал Яхве[a] к Самуилу, а тот сказал: «Вот я».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: יהוה (YHWH); также передаётся «Иегова».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: воззвал
  rationale: Форма wayyiqtol от קרא продолжает повествовательную последовательность; «воззвал» естественно передаёт слышимый зов и сохраняет достойный библейский регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: אֶל שְׁמוּאֵל
  choice: к Самуилу
  rationale: Предлог אֶל обозначает адресата зова; по-русски нормативно «воззвал к Самуилу».
- source_word: וַיֹּאמֶר
  choice: и тот ответил
  rationale: Формально глагол означает «и сказал», однако контекст показывает, что говорит Самуил в ответ на зов. Местоимение «тот» устраняет возможную неясность субъекта, а «ответил» естественно передаёт функцию реплики.
- source_word: הִנֵּנִי
  choice: Вот я
  rationale: Устойчивая формула отклика, выражающая присутствие и готовность; «Вот я» кратко и идиоматично передаёт её по-русски.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В еврейском тексте прямо стоит тетраграмматон. «Яхве» передаёт личное имя, тогда как «ГОСПОДЬ» заменяет его титулом; вариант «Иегова» отмечен в сноске как традиционная альтернативная форма.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным оттенком. Союз «и» сохранён для передачи последовательности древнееврейского рассказа; реплика звучит естественно и ясно.
