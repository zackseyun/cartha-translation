base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/021.yaml
  text: And Yahweh continued to appear at Shiloh[a], for Yahweh revealed himself to Samuel at Shiloh by the word of Yahweh.
translation:
  language: ru
  text: И Яхве продолжал являться в Силоме, ибо Яхве открылся Самуилу в Силоме словом Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через слово Яхве»; возможно также: «в слове Яхве».'
    reason: Предлог ב в בִּדְבַר допускает инструментальное понимание («словом», «через слово»), а также более буквальную локативно-сферическую передачу («в слове»).
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: продолжал
  rationale: Сочетание יָסַף с инфинитивом выражает продолжение или повторение действия; «продолжал» естественно передаёт устойчивый характер явлений.
- source_word: לְהֵרָאֹה
  choice: являться
  rationale: Нифаль глагола ראה здесь обозначает явление, при котором Бог даёт Себя увидеть; «являться» уместно для описания божественного проявления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בְשִׁלֹה / בְשִׁלוֹ
  choice: в Силоме
  rationale: Предлог ב употреблён локативно; русское «в Силоме» естественно обозначает место действия.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание или пояснение предыдущего утверждения; «потому что» ясно сохраняет эту связь.
- source_word: נִגְלָה
  choice: открывался
  rationale: Нифаль от גלה передаёт самораскрытие или явление. «Открывался» сохраняет отличие от предшествующего לְהֵרָאֹה и не уточняет способ откровения сверх текста.
- source_word: אֶל שְׁמוּאֵל
  choice: Самуилу
  rationale: Дательный падеж естественно передаёт направленность божественного откровения к Самуилу.
- source_word: בִּדְבַר יְהוָה
  choice: через слово Яхве
  rationale: 'Предлог ב можно понимать инструментально: слово Яхве служит средством откровения. Формулировка остаётся естественной и сохраняет тесную связь явления с Божьим словом.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Характер божественного явления
  choice: Сохранены оба выражения — «являться» и «открываться… через слово» — без уточнения точного способа проявления
  alternative: Истолковать событие исключительно как видение либо как телесное явление
  rationale: Текст утверждает реальное самораскрытие Яхве, но не определяет его точную форму; перевод не снимает эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с простым, dignified библейским ритмом. Повтор имени «Яхве» сохранён вслед за еврейским текстом; архаизмы и конфессионально окрашенные уточнения не вводятся.
