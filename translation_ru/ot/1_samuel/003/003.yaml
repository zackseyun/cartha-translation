base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/003.yaml
  text: And the lamp of God had not yet gone out[a], and Samuel was lying down in the temple of Yahweh, where the ark of God was.
translation:
  language: ru
  text: Светильник Божий ещё не погас, и Самуил лежал в храме Яхве[a], где находился ковчег Божий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в святилище Яхве». Еврейское слово הֵיכַל может означать храм или святилище; здесь имеется в виду место пребывания Яхве в Силоме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵר אֱלֹהִים
  choice: светильник Божий
  rationale: נֵר обозначает именно светильник, а не свет вообще. Сочетание с אֱלֹהִים передано естественной для русского языка конструкцией с прилагательным, сохраняющей связь светильника с Богом и богослужением.
- source_word: טֶרֶם יִכְבֶּה
  choice: ещё не погас
  rationale: טֶרֶם указывает, что действие пока не совершилось, а כבה применительно к светильнику естественно передаётся глаголом «погаснуть». Формулировка не уточняет, погас ли он позднее и почему.
- source_word: שֹׁכֵב
  choice: лежал
  rationale: Причастная форма описывает положение Самуила. Перевод «спал» внёс бы смысл, который здесь прямо не выражен.
- source_word: הֵיכַל יְהוָה
  choice: храм Яхве
  rationale: הֵיכַל может означать храм, святилище или дворец. В данном культовом контексте «храм» является прямым и понятным соответствием; возможность перевода «святилище» отмечена в сноске, поскольку речь идёт о святилище в Силоме, а не о позднейшем храме Соломона.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией «Яхве», а не заменено титулом «Господь».
- source_word: אֲשֶׁר שָׁם אֲרוֹן אֱלֹהִים
  choice: где находился ковчег Божий
  rationale: Придаточное предложение естественно передаёт указание на место через שָׁם и сохраняет связь ковчега с Богом.
theological_decisions:
- issue: Значение הֵיכַל יְהוָה в контексте святилища до эпохи монархии
  choice: храм Яхве
  alternative: святилище Яхве
  rationale: Слово הֵיכַל допускает оба перевода. «Храм» сохраняет обычное лексическое значение, но не должно пониматься как указание на храм Соломона; исторически имеется в виду место пребывания Яхве в Силоме. Альтернатива сохранена в сноске.
- issue: Положение Самуила по отношению к ковчегу
  choice: сохранить прямую пространственную формулировку текста
  alternative: уточнить, что Самуил лежал в примыкающем помещении
  rationale: Еврейский текст говорит, что Самуил лежал в הֵיכַל, где находился ковчег. Уточнение о другом помещении отсутствует в стихе и потому не внесено.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис оставлен ясным и близким к последовательности еврейского текста; имя Яхве и культовые термины переданы последовательно.
