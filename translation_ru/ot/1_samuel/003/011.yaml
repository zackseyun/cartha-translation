base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/011.yaml
  text: Then the LORD said to Samuel, "Look, I am about to do a thing in Israel that will make both ears of everyone who hears of it tingle."
translation:
  language: ru
  text: 'И сказал Господь Самуилу: «Вот, Я сделаю в Израиле такое, что у всякого, кто об этом услышит, зазвенит в обоих ушах».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона; написание с прописной буквы обозначает имя Бога без неестественного для основного текста транслитерирования.
- source_word: הִנֵּה אָנֹכִי עֹשֶׂה דָבָר
  choice: Вот, Я совершу… такое
  rationale: הִנֵּה сохраняется как привлекающее внимание «вот»; причастная конструкция с אָנֹכִי в данном пророческом контексте естественно передаётся будущим временем, а דָבָר — нейтральным «такое», не уточняющим заранее характер события.
- source_word: תְּצִלֶּינָה שְׁתֵּי אָזְנָיו
  choice: зазвенит в обоих ушах
  rationale: Сохраняется яркая телесная идиома исходного текста и указание на оба уха; русское выражение понятно как образ потрясения от услышанного.
theological_decisions:
- issue: Временной оттенок עֹשֶׂה в речи о предстоящем Божьем действии
  choice: Я совершу
  alternative: Я совершаю / Я собираюсь совершить
  rationale: Контекст последующего объявления суда указывает на ещё предстоящее действие. Будущее время естественно по-русски и не добавляет более узкого оттенка намерения, который несёт оборот «собираюсь».
- issue: Передача Божьего имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Выбрана общепринятая русская библейская традиция, узнаваемая широкой аудиторией; при этом перевод не вводит конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной библейской интонацией. Порядок фразы естественен для русской речи; образ звона в обоих ушах сохранён без поясняющего расширения.
