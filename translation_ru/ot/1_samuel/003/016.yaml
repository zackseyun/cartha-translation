  yaml_path: translation/ot/1_samuel/003/016.yaml
  text: Then Eli called Samuel and said, “Samuel, my son.” And he said, “Here I am.”
translation:
  language: ru
  text: 'Тогда Илий позвал Самуила и сказал: «Самуил, сын мой!» Тот ответил: «Вот я».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: позвал
  rationale: В данном повествовательном контексте קרא означает, что Илий голосом зовёт Самуила; «позвал» естественно по-русски и не привносит оттенка официального призыва.
- source_word: עֵלִי
  choice: Илий
  rationale: Использована традиционная русская библейская форма личного имени.
- source_word: אֶת שְׁמוּאֵל
  choice: Самуила
  rationale: Показатель прямого дополнения אֶת отдельно не переводится; имя поставлено в требуемом русском винительном падеже и передано в традиционной форме.
- source_word: וַיֹּאמֶר
  choice: сказал / ответил
  rationale: אמר — обычный глагол речи. В первой реплике передан как «сказал», а во второй как естественное для русского диалога «ответил»; содержание и последовательность речи сохранены.
- source_word: שְׁמוּאֵל בְּנִי
  choice: Самуил, сын мой
  rationale: בְּנִי буквально означает «сын мой» и здесь служит тёплым обращением Илия к юному Самуилу; порядок слов сохраняет достойный библейский регистр и остаётся понятным современному читателю.
- source_word: הִנֵּנִי
  choice: Вот я
  rationale: Устойчивый еврейский ответ выражает присутствие и готовность откликнуться. «Вот я» точно и естественно передаёт эту формулу, не сводя её к разговорному «Да?».
- source_word: וַ
  choice: Тогда / связность повествования
  rationale: Последовательная конструкция с waw продвигает рассказ. В начале «щов? «Тогда» ясно обозначает последовательность; перед ответом связь естественно выражена синтаксисом русского диалога без отдельного союза.
