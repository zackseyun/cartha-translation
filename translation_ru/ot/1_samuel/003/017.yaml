base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/017.yaml
  text: And he said[a], “What is the word that he spoke to you? Please do not hide it from me. May God do so to you, and more also, if you hide from me a word of all the word that he spoke to you.”
translation:
  language: ru
  text: 'Он сказал: «Какое слово он сказал тебе? Прошу, не скрывай этого от меня. Пусть Бог сделает с тобой то же и ещё больше, если ты утаишь от меня хоть что-нибудь из всего, что он сказал тебе[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если ты утаишь от меня слово из всего слова, которое он сказал тебе». Повторение слова דָּבָר подчёркивает, что нельзя утаить ни одной части сказанного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הַדָּבָר
  choice: Что это за слово
  rationale: Сохраняет ключевое דָּבָר как «слово» и его связь с Божьей речью, оставаясь естественным вопросом по-русски.
- source_word: דִּבֶּר אֵלֶיךָ
  choice: он говорил тебе
  rationale: Глагол «говорил» передаёт דבר и сохраняет связь между «словом» и речью; несовершенный вид естественно указывает на состоявшееся обращение в повествовательном контексте.
- source_word: אַל נָא תְכַחֵד מִמֶּנִּי
  choice: Прошу, не скрывай его от меня
  rationale: «Прошу» передаёт частицу настоятельной просьбы נָא, а «скрывай» — значение כחד. Местоимение «его» естественно отсылает к слову.
- source_word: כֹּה יַעֲשֶׂה לְּךָ אֱלֹהִים וְכֹה יוֹסִיף
  choice: Пусть Бог сделает с тобой то же и ещё больше
  rationale: Передаёт традиционную клятвенно-проклятийную формулу без искусственной буквальности; «то же» сохраняет намеренную неопределённость угрозы.
- source_word: אִם
  choice: если
  rationale: Сохраняет условную форму древнееврейской клятвенной конструкции, в которой последствие уже выражено предшествующим проклятием.
- source_word: תְּכַחֵד מִמֶּנִּי דָּבָר מִכָּל הַדָּבָר
  choice: ты скроешь от меня хоть что-нибудь из всего
  rationale: 'Естественно передаёт смысл: не утаить ни одной части сообщения. Буквальное повторение единственного דָּבָר по-русски звучало бы неясно и тяжеловесно; оно отмечено в сноске.'
theological_decisions:
- issue: Значение אֱלֹהִים в формуле клятвы
  choice: Бог
  alternative: боги
  rationale: В контексте Илий призывает Бога Израиля как свидетеля клятвы; грамматическая форма אֱלֹהִים здесь обычно обозначает единого Бога, а перевод «боги» внёс бы отсутствующий в контексте политеистический смысл.
- issue: Прописная или строчная буква в местоимении, относящемся к Богу
  choice: он
  alternative: Он
  rationale: Строчная буква соответствует нейтральной современной издательской практике и не добавляет к древнееврейскому тексту конфессионально обусловленного графического почтения; референт определяется контекстом.
translation_notes:
  register: Современный литературный русский язык с торжественностью, уместной для клятвенной формулы. Синтаксис сделан естественным для обычного читателя, при этом ключевое «слово» в первом вопросе и неопределённость формулы проклятия сохранены.
