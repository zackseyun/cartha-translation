base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/009.yaml
  text: Then Eli said to Samuel[a], “Go, lie down, and if he calls to you, you shall say, ‘Speak, Yahweh, for your servant is listening.’” So Samuel went and lay down in his place.
translation:
  language: ru
  text: 'И сказал Илий Самуилу: «Ступай, ложись. И если он позовёт тебя, скажи: „Говори, Яхве[a], ибо Твой слуга слушает“». И Самуил пошёл и лёг на своё место.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Божественное имя יהוה (ЙХВХ) традиционно передают словом «Господь».
    reason: Указывает традиционный вариант передачи тетраграмматона и поясняет выбор формы «Яхве».
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма продвигает повествование; русский союз «и» естественно сохраняет связь с предшествующим рассказом.
- source_word: לֵךְ שְׁכָב
  choice: Ступай, ложись
  rationale: Два повелительных глагола переданы прямо и естественно, без добавления отсутствующего в тексте указания «спать».
- source_word: וְהָיָה אִם
  choice: И если
  rationale: Сохраняется условный смысл конструкции; перевод «когда» неоправданно усилил бы уверенность в наступлении события.
- source_word: יִקְרָא אֵלֶיךָ
  choice: он позовёт тебя
  rationale: Глагол имеет подразумеваемое подлежащее мужского рода; местоимение сохраняет контекстуальную отсылку к Яхве, не называя Его там, где имя в еврейском тексте не повторено.
- source_word: וְאָמַרְתָּ
  choice: скажи
  rationale: В условной конструкции форма выражает последующее предписание; русское повелительное наклонение передаёт его ясно и естественно.
- source_word: דַּבֵּר
  choice: Говори
  rationale: Прямая передача повелительной формы без смысловых добавлений.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное божественное имя, стоящее в исходном тексте, а не заменяющий его титул.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание просьбы; «ибо» уместно в краткой торжественной прямой речи и остаётся понятным современному читателю.
- source_word: שֹׁמֵעַ
  choice: слушает
  rationale: Причастие обозначает продолжающееся внимательное восприятие; «слушает» лучше выражает готовность внимать, чем простое «слышит».
- source_word: עַבְדֶּךָ
  choice: Твой слуга
  rationale: В данном обращении слово выражает смиренное самообозначение перед Богом; «слуга» естественнее контекстуально, чем «раб», которое сильнее подчёркивает правовой статус.
- source_word: וַיֵּלֶךְ ... וַיִּשְׁכַּב
  choice: И Самуил пошёл и лёг
  rationale: Последовательность двух повествовательных форм сохранена простым русским изложением.
- source_word: בִּמְקוֹמוֹ
  choice: на своё место
  rationale: Естественная русская передача обозначенного для Самуила места без добавления предположения, что оно было обычным или постоянным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В стихе непосредственно употреблено личное имя Бога; транслитерация сохраняет отличие имени от титула, а традиционный вариант указан в примечании.
- issue: Подразумеваемое подлежащее יִקְרָא
  choice: он позовёт тебя
  alternative: кто-нибудь позовёт тебя
  rationale: Непосредственный контекст показывает, что Илий распознал в зовущем Яхве. Вместе с тем строчная буква и местоимение не вносят в эту часть фразы отсутствующего имени.
- issue: Самообозначение עַבְדֶּךָ
  choice: Твой слуга
  alternative: Твой раб
  rationale: Фраза выражает покорность и готовность слушать Бога, не требуя акцента на социально-правовом рабском положении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным оттенком прямой речи. Синтаксис остаётся простым и доступным; условность и подразумеваемое подлежащее исходного текста сохранены.
