  yaml_path: translation/ot/1_samuel/003/020.yaml
  text: And all Israel from Dan to Beer-sheba knew that Samuel was established as a prophet of Yahweh[a].
translation:
  language: ru
  text: И весь Израиль, от Дана до Вирсавии, узнал, что Самуил был признан пророком Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Самуил был утверждён как пророк Яхве». Еврейское слово может означать, что он оказался верным и надёжным, либо что его пророческий статус был утверждён или подтверждён.'
    reason: Сохраняет смысловой диапазон נֶאֱמָן и уточняет, что в контексте речь идёт о пророческом статусе.
lexical_decisions:
- source_word: וַיֵּדַע
  choice: узнал
  rationale: Глагол ידע здесь обозначает ставшее общим достоянием знание и признание; «узнал» естественно передаёт наступивший результат.
- source_word: כָּל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Сохранено собирательное обозначение народа, обычное и понятное в современном русском языке.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: от Дана до Вирсавии
  rationale: Сохранён географический меризм, обозначающий всю страну с севера на юг; употреблены традиционные русские формы топонимов.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что стало известно всему Израилю.
- source_word: נֶאֱמָן
  choice: утверждён
  rationale: Форма нифаль от אמן передаёт мысль о подтверждённости, надёжности или прочном установлении статуса Самуила. «Утверждён» сохраняет связь с удостоверением его пророческого служения, не сводя смысл лишь к нравственной верности.
- source_word: לְנָבִיא
  choice: как пророк
  rationale: Предлог ל обозначает роль или статус; по-русски это естественно передаётся оборотом «как пророк».
- source_word: לַיהוָה
  choice: Яхве
  rationale: 'Предлог выражает принадлежность и отношение: Самуил — пророк Яхве. Личное имя יהוה передано как «Яхве».'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное заветное имя Бога; его передача как «Яхве» сохраняет различие между именем и титулом.
- issue: Смысл נֶאֱמָן применительно к пророческому статусу Самуила
  choice: утверждён как пророк
  alternative: верен как пророк; признан пророком; поставлен пророком
  rationale: Контекст предыдущего стиха подчёркивает, что слова Самуила исполнялись и тем самым его пророческий статус был подтверждён. Выбор не привносит технического представления о рукоположении и сохраняет смысловую напряжённость между надёжностью и утверждённостью.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Географическая формула и имя Яхве сохранены; синтаксис сделан ясным для обычного читателя.
