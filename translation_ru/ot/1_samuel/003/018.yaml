base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/018.yaml
  text: So Samuel told him all the words and hid nothing from him[a]. And he said, “He is Yahweh[b]; let him do what is good in his eyes.”
translation:
  language: ru
  text: 'И Самуил рассказал ему всё, ничего от него не утаив. Илий сказал: «Он — Яхве; пусть он делает[a] то, что хорошо в его глазах[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он сделает то, что хорошо в его глазах». Еврейская форма может выражать как покорное пожелание («пусть делает»), так и простое будущее.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «в его глазах»; еврейская идиома означает «по его собственному суждению» или «как ему угодно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד לוֹ שְׁמוּאֵל
  choice: Самуил рассказал ему
  rationale: Hифиль глагола נגד означает «сообщить, рассказать, дать знать»; «рассказал» естественно передаёт личное сообщение Самуила Илию.
- source_word: אֶת כָּל הַדְּבָרִים
  choice: всё
  rationale: דברים может обозначать как слова, так и то, о чём говорится. В данном контексте русское «всё» естественно выражает полноту раскрытого сообщения, не вынуждая выбирать между «всеми словами» и «всеми обстоятельствами».
- source_word: וְלֹא כִחֵד מִמֶּנּוּ
  choice: ничего от него не утаив
  rationale: כחד означает скрывать или утаивать. Деепричастный оборот сохраняет тесную связь с первым действием и подчёркивает, что Самуил сообщил всё без исключения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: יְהוָה הוּא
  choice: Это Яхве
  rationale: Краткая именная конструкция передаёт признание Илием того, что сказанное исходит от Яхве. Буквальное «Яхве — он» по-русски неестественно.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: то, что хорошо в его глазах
  rationale: 'Сохранён образ еврейской идиомы и её смысл: то, что сам Яхве считает хорошим или правильным.'
- source_word: יַעֲשֶׂה
  choice: пусть он делает
  rationale: Имперфект здесь естественно понимать как уступительно-пожелательное выражение покорности Илию перед решением Яхве; возможность простого будущего сохранена в примечании.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Сила формы יַעֲשֶׂה в заключительной реплике Илия
  choice: Пожелательно-уступительное «пусть он делает»
  alternative: Будущее «он сделает»
  rationale: Контекст поддерживает смиренное принятие объявленного суда, однако форма допускает и простое будущее, поэтому альтернативное понимание отмечено отдельно.
- issue: Смысл выражения יְהוָה הוּא
  choice: «Это Яхве» как признание источника сказанного и власти Яхве
  alternative: Более формальное «Он — Яхве»
  rationale: Русская формулировка не разворачивает краткую еврейскую фразу в дополнительное богословское утверждение и естественно связывает её с услышанным пророчеством.
translation_notes:
  register: Современный литературный русский язык с кратким, сдержанным библейским звучанием. Имя «Яхве» передано прямо; местоимения, относящиеся к Богу, оставлены со строчной буквы по общей современной орфографической норме. Имя «Илий» добавлено вместо местоимения в начале второй реплики для ясности по-русски.
