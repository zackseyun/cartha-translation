base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/001.yaml
  text: The boy Samuel was ministering to Yahweh before Eli[a], and the word of Yahweh was rare in those days; visions were not widespread.
translation:
  language: ru
  text: Самуил, ещё мальчик, служил Яхве при Илии; в те дни слово Яхве было редким, и видения случались нечасто.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не было распространённого видения». Буквально: «не было видения, прорывавшегося [наружу]». Еврейское «видение» здесь может употребляться собирательно; смысл в том, что пророческие видения не были обычным или широко распространённым явлением.'
    reason: Сохранение смыслового диапазона выражения אֵין חָזוֹן נִפְרָץ и уточнение его отрицательной конструкции.
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: Отрок
  rationale: הַנַּעַר обозначает мальчика или юношу. «Отрок» здесь звучит достойно и уместно для юного Самуила, не делая его ни маленьким ребёнком, ни взрослым юношей; начальный וְ не передан отдельным союзом, поскольку в русском начале сцены он не требуется.
- source_word: מְשָׁרֵת אֶת־יְהוָה
  choice: служил Яхве
  rationale: Причастие выражает продолжающееся служение; глагол «служил» естественно передаёт как длительность по контексту, так и религиозный характер служения.
- source_word: לִפְנֵי עֵלִי
  choice: под надзором Илия
  rationale: Буквально לִפְנֵי значит «перед, в присутствии». В данном контексте речь о служении при Илии и под его руководством; буквальное «перед Илием» по-русски могло бы ошибочно означать лишь пространственное положение.
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранён устойчивый библейский оборот, обозначающий данное Богом откровение.
- source_word: יָקָר
  choice: редким
  rationale: Хотя יָקָר может значить «драгоценный», последующая оговорка о видениях указывает здесь на редкость и недостаток откровения.
- source_word: אֵין חָזוֹן נִפְרָץ
  choice: видения случались нечасто
  rationale: חָזוֹן обозначает пророческое видение, а נִפְרָץ буквально связано с прорывом или распространением. В контексте идиома означает, что откровения через видения не были обычным явлением.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное заветное имя, прямо стоящее в еврейском тексте, без замены титулом.
- issue: Характер служения Самуила при Илии
  choice: под надзором Илия
  alternative: перед Илием; в присутствии Илия
  rationale: Формулировка отражает контекст наставничества и надзора, не утверждая большего, чем предполагает לִפְנֵי в повествовании.
- issue: Связь редкости слова Яхве с видениями
  choice: два согласованных утверждения о редкости откровения
  alternative: отождествить слово Яхве исключительно с видениями
  rationale: Текст сополагает редкость слова Яхве и отсутствие распространённых видений, но не требует полного отождествления этих понятий.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Отрок» выбрано как понятное традиционное обозначение юного Самуила; синтаксис упрощён до двух предложений ради ясности.
