  yaml_path: translation/ot/1_samuel/003/010.yaml
  text: Then Yahweh came and stood there[a], and called as at the other times, “Samuel, Samuel!” And Samuel said, “Speak, for your servant is listening.”
translation:
  language: ru
  text: 'И пришёл Яхве, и встал, и позвал, как и в прежние разы[a]: «Самуил, Самуил!» Самуил сказал: «Говори, потому что раб Твой слушает».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как и прежде». Еврейский оборот буквально сопоставляет этот зов с прежними случаями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, не заменяя его нарицательным титулом «Господь».
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Прямо и естественно передаёт повествовательное значение глагола בוא — приход или приближение.
- source_word: וַיִּתְיַצַּב
  choice: встал
  rationale: 'Сохраняет конкретный образ: Яхве занял место и стоял; перевод не заменяет это действие более отвлечённым «явился».'
- source_word: וַיִּקְרָא
  choice: позвал
  rationale: В данном контексте קרא обозначает обращённый к Самуилу зов; «позвал» звучит естественно и не придаёт голосу излишней громкости.
- source_word: כְפַעַם בְּפַעַם
  choice: как и в прежние разы
  rationale: Еврейский оборот сопоставляет этот зов с несколькими предшествующими зовами; русский перевод сохраняет повторность и естественно связывает фразу с контекстом.
- source_word: שְׁמוּאֵל שְׁמוּאֵל
  choice: Самуил! Самуил!
  rationale: Повтор имени сохранён как настойчивое личное обращение; в русском он естественно оформлен двумя восклицательными предложениями.
- source_word: דַּבֵּר
  choice: Говори
  rationale: Простой императив передан прямо, без добавления смысловых оттенков.
- source_word: כִּי
  choice: потому что
  rationale: Ясно выражает основание готовности Самуила внимать, сохраняя причинную связь исходного текста.
- source_word: שֹׁמֵעַ
  choice: слушает
  rationale: Причастная форма в контексте означает деятельную внимательность и готовность услышать, а не просто способность воспринимать звук.
- source_word: עַבְדֶּךָ
  choice: раб Твой
  rationale: Сохраняет традиционную и контекстуально уместную формулу смиренного подчинения; «слуга» ослабило бы выраженную словом עבד зависимость.
theological_decisions:
- issue: Антропоморфное описание явления Яхве
  choice: Сохранить конкретные действия «пришёл» и «встал»
  alternative: Сгладить образ, переведя «явился» или «дал почувствовать Своё присутствие»
  rationale: Еврейский текст описывает действия Яхве конкретно и лично; перевод не устраняет эту богословскую напряжённость поясняющей перефразировкой.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация показывает, что в исходном тексте стоит личное имя Бога, а не титул, и не вводит позднюю форму «Иегова».
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксический повтор «и… и…» частично сохранён ради последовательности еврейского повествования; реплики остаются простыми и непосредственными. Прописная буква в «Твой» служит принятой в русском религиозном письме формой почтительного обращения и не меняет смысла исходного текста.
