base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/015.yaml
  text: Samuel lay down until morning; then he opened the doors of the house of Yahweh[a]. But Samuel was afraid to tell the vision to Eli.
translation:
  language: ru
  text: Самуил лежал до утра, а потом открыл двери дома Яхве. Но Самуил боялся рассказать Илию о видении[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «о явлении». Еврейское слово мар’а́ может означать явление или откровение, воспринимаемое в видении. Здесь «видение» лучше соответствует контексту ночного откровения Самуилу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: лежал
  rationale: Глагол שׁכב означает «лечь, лежать». Перевод не добавляет отсутствующего в тексте утверждения, что Самуил спал.
- source_word: עַד הַבֹּקֶר
  choice: до утра
  rationale: Естественная русская передача временного оборота.
- source_word: וַיִּפְתַּח
  choice: а потом открыл
  rationale: Передаёт последовательность повествовательных форм, не добавляя не выраженного в еврейском тексте движения.
- source_word: דַּלְתוֹת
  choice: двери
  rationale: Прямой эквивалент формы множественного числа; более конкретное «створки» здесь не требуется.
- source_word: בֵּית יְהוָה
  choice: дома Яхве
  rationale: Сохраняет обычное выражение «дом Яхве» и не вводит потенциально анахроничное уточнение «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте.
- source_word: יָרֵא
  choice: боялся
  rationale: Естественно и точно выражает страх Самуила.
- source_word: מֵהַגִּיד
  choice: рассказать
  rationale: После глагола страха конструкция מן с инфинитивом естественно передаётся по-русски сочетанием «боялся рассказать».
- source_word: הַמַּרְאָה
  choice: видении
  rationale: В данном повествовательном контексте слово обозначает полученное ночью откровение; при этом возможное значение «явление» отмечено в сноске.
- source_word: אֶל עֵלִי
  choice: Илию
  rationale: При русском глаголе «рассказать» адресат естественно ставится в дательном падеже.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно употреблён тетраграмматон; форма «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Характер ночного откровения הַמַּרְאָה
  choice: видение
  alternative: явление; откровение
  rationale: «Видение» лучше всего соответствует контексту призвания Самуила, но сноска сохраняет лексическую возможность значения «явление» и не устраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с простым, повествовательным синтаксисом. Повтор имени Самуила сохранён вслед за еврейским текстом; «лежал», а не «спал», позволяет избежать смыслового добавления.
