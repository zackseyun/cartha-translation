base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/013.yaml
  text: And I have declared to him that I am judging his house forever for the iniquity that he knew[a], because his sons were cursing God, and he did not restrain them.
translation:
  language: ru
  text: 'И Я объявил ему, что вершу суд над его домом навеки за беззаконие, о котором он знал: его сыновья навлекали на себя проклятие[a], а он не удержал их.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Согласно иному чтению, отражённому в некоторых древних свидетелях и во многих переводах: «проклинали Бога» или «богохульствовали».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגַּדְתִּי
  choice: И Я объявил ему
  rationale: Порода hифиль глагола נגד означает «сообщить, объявить». Прошедшее совершенного вида естественно передаёт уже данное торжественное извещение.
- source_word: שֹׁפֵט אֲנִי
  choice: осуждаю
  rationale: Причастие с явно выраженным местоимением подчёркивает совершающийся или неотвратимо предстоящий суд. «Осуждаю» звучит естественно по-русски и сохраняет непосредственность приговора.
- source_word: בֵּיתוֹ
  choice: его дом
  rationale: Библейский образ «дом» может охватывать и семейство, и родовую линию; перевод не сужает значение до одного из этих смыслов.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Передаёт длительный, непрекращающийся характер приговора и соответствует торжественному регистру.
- source_word: בַּעֲוֺן אֲשֶׁר יָדַע
  choice: за известное ему беззаконие
  rationale: Сжатая русская формулировка сохраняет значение עָוֹן как тяжкого нравственного проступка и прямо указывает на осведомлённость Илия.
- source_word: מְקַלְלִים לָהֶם
  choice: навлекали на себя проклятие
  rationale: Следует масоретскому тексту, где местоименная форма לָהֶם допускает смысл действия, обращённого на самих сыновей. Такая передача естественнее буквального «проклинали себя» и не подменяет основной текст вариантом древних свидетелей.
- source_word: וְלֹא כִהָה בָּם
  choice: а он их не обуздал
  rationale: כּהה может обозначать ослабление или пресечение. В контексте речь о том, что Илий не остановил и не сдержал сыновей; «не обуздал» ясно передаёт эту мысль.
theological_decisions:
- issue: Читается ли проступок сыновей как навлечение проклятия на себя или как проклятие Бога
  choice: 'Основной текст следует масоретскому чтению: «навлекали на себя проклятие».'
  alternative: «проклинали Бога» или «богохульствовали»
  rationale: Еврейский масоретский текст поддерживает возвратное по смыслу прочтение, тогда как ряд древних свидетелей отражает прямое упоминание Бога. Основной текст сохраняет приоритет исходного еврейского свидетельства, а значимый вариант приводится в сноске.
- issue: Объём понятия «его дом»
  choice: Сохранён образ «его дом» без уточнения.
  alternative: «его семейство» или «его род»
  rationale: Еврейская идиома может относиться как к ближайшему семейству, так и к продолжающейся родовой линии; уточнение неоправданно устранило бы эту широту.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Двоеточие делает явным пояснительный характер следующей части стиха, не добавляя нового смыслового содержания.
