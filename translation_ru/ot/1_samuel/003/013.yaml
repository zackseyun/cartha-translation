  source_fidelity: 'В целом основной текст верно следует масоретскому чтению трудного выражения מְקַלְלִים לָהֶם: «навлекали на себя проклятие» передаёт его без преждевременной подмены вариантом «проклинали Бога». Сноска надлежащим образом отмечает значимое альтернативное чтение. Однако «осуждаю его дом» несколько сужает שֹׁפֵט до вынесения обвинительного приговора, тогда как глагол означает совершение суда; «вершу суд над его домом» точнее передаёт судебное действие и сохраняет аспект причастия.'
  naturalness: Текст литературный и понятный. Замена «осуждаю его дом» на «вершу суд над его домом» также естественна для современного торжественного библейского регистра. Перестановка «а он их не обуздал» в «а он не удержал их» делает фразу несколько более нейтральной и современной, не меняя смысла.
  terminology: «Дом» удачно сохраняет библейскую широту בֵּיתוֹ. «Беззаконие» адекватно передаёт עָוֹן. «Навеки» соответствует עַד עוֹלָם. Альтернативы «проклинали Бога» и «богохульствовали» в сноске переданы корректно и не навязываются основному тексту.
