base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/006.yaml
  text: Then the LORD called Samuel again. Samuel got up and went to Eli and said, “Here I am, because you called me.” But he said, “I did not call, my son. Go back; lie down.”
translation:
  language: ru
  text: 'И снова Господь позвал Самуила. Самуил встал, пошёл к Илию и сказал: «Вот я: ты звал меня». Но Илий сказал: «Я не звал тебя, сын мой. Вернись и ложись».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף יְהוָה קְרֹא עוֹד
  choice: И снова Господь позвал
  rationale: Сочетание יסף с инфинитивом и наречием עוד передаёт повторность действия; естественное русское «снова» сохраняет этот смысл без тяжеловесного удвоения. Тетраграмматон передан традиционным «Господь».
- source_word: הִנְנִי
  choice: Вот я
  rationale: Устойчивая краткая формула отклика и готовности, естественно звучащая по-русски.
- source_word: כִּי קָרָאתָ לִי
  choice: ведь ты звал меня
  rationale: כִּי здесь указывает основание прихода Самуила; «ведь» естественно передаёт причинно-пояснительный оттенок.
- source_word: בְנִי
  choice: сын мой
  rationale: Сохранено ласковое обращение Илия, не обязательно обозначающее биологическое родство.
- source_word: שׁוּב שְׁכָב
  choice: Вернись и ложись
  rationale: Два повеления переданы прямо и естественно; «вернись» в контексте означает возвращение на прежнее место.
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Выбрана укоренённая в русской библейской речи передача, понятная широкому читателю; она не добавляет конфессионального толкования.
- issue: Явное указание имени Самуила как содержания зова
  choice: «Самуил!» оформлено как прямая речь
  alternative: Господь снова позвал Самуила
  rationale: 'В еврейском тексте имя שְׁמוּאֵל может синтаксически пониматься как обращение — «позвал снова: Самуил!» — либо как дополнение. Контекст стихов 4 и 10 поддерживает слышимый зов по имени; оформление прямой речью делает сцену ясной, не меняя её богословского содержания.'
translation_notes:
  register: Современный литературный русский язык, простой и dignified повествовательный стиль. Сохранены повторность зова, почтительный отклик Самуила и тёплое обращение Илия. Архаизмы и канцелярские обороты избегались.
