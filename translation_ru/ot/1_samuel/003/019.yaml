base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/019.yaml
  text: And Samuel grew[a], and Yahweh was with him and let none of his words fall to the ground.
translation:
  language: ru
  text: Самуил рос, и Яхве был с ним и не дал упасть на землю ни одному из его слов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не дал ни одному из его слов оказаться тщетным». Буквально по-еврейски: «не дал ни одному из его слов упасть на землю».'
    reason: Поясняет еврейское образное выражение, сохраняя в основном тексте его буквальный образ и не ограничивая смысл одними предсказаниями.
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: рос
  rationale: Глагол גדל обозначает рост и взросление Самуила. «Рос» сохраняет краткость оригинала и не сводит смысл ни только к физическому взрослению, ни к возвышению его положения.
- source_word: שְׁמוּאֵל
  choice: Самуил
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом.
- source_word: הָיָה עִמּוֹ
  choice: был с ним
  rationale: Прямая и естественная передача еврейского оборота, выражающего присутствие и благоволение Яхве.
- source_word: וְלֹא הִפִּיל
  choice: и не давал … упасть
  rationale: Каузативная форма глагола נפל с отрицанием означает, что Яхве не позволял словам Самуила остаться без исполнения; сохранён образ исходного текста.
- source_word: מִכָּל דְּבָרָיו
  choice: ни одному его слову
  rationale: Еврейское выражение буквально означает «из всех его слов» и в отрицательной конструкции естественно передаётся по-русски как «ни одному его слову». Более узкое толкование «пророчеству» в текст не внесено.
- source_word: אָרְצָה
  choice: на землю
  rationale: Направительная форма слова «земля» входит в образный оборот «упасть на землю», означающий, что слово не осталось тщетным и не оказалось несбывшимся.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале непосредственно употреблён тетраграмматон. Форма «Яхве» сохраняет личное имя, не заменяя его титулом.
- issue: Образ «не дать словам упасть на землю»
  choice: Сохранить еврейский образ в основном тексте и пояснить его смысл в сноске.
  alternative: Не давал ни одному его слову остаться без исполнения.
  rationale: Контекст говорит о признании Самуила пророком, однако оригинал использует более широкий и выразительный оборот. Его сохранение передаёт литературную форму и не сужает слова до одних предсказаний.
translation_notes:
  register: Современный литературный русский язык с кратким повествовательным синтаксисом. Союзы сохранены настолько, насколько это естественно по-русски; начальное «и» опущено как избыточное вне более широкого контекста. Яркий еврейский образ оставлен в основном тексте, а его идиоматический смысл раскрыт в сноске.
