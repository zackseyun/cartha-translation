  text: 'And David’s two wives had been taken captive: Ahinoam the Jezreelitess and Abigail[b][a], the wife of Nabal the Carmelite.'
translation:
  language: ru
  text: 'И обе жены Давида были взяты в плен: Ахиноама из Изрееля и Авигея, жена Навала из Кармила.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁתֵּי נְשֵׁי דָוִד
  choice: И обе жены Давида
  rationale: Союз ו связывает стих с предыдущим повествованием. Хотя שְׁתֵּי буквально означает «две», в данном контексте естественное русское «обе» точно передаёт, что в плен попали две упомянутые жены Давида.
- source_word: נִשְׁבּוּ
  choice: были взяты в плен
  rationale: Нифаль перфекта от שׁבה обозначает захват в качестве пленников. Русская форма сохраняет страдательное значение и естественно звучит в повествовании.
- source_word: אֲחִינֹעַם הַ/יִּזְרְעֵלִית
  choice: Ахиноам из Изрееля
  rationale: Женская форма этнохоронима указывает на происхождение Ахиноам. Описательное «из Изрееля» современнее и яснее, чем искусственное русское образование «изреелитянка».
- source_word: וַ/אֲבִיגַיִל
  choice: и Авигея
  rationale: Имя передано в укоренившейся русской библейской форме, а союз сохраняет координацию двух имён.
- source_word: אֵשֶׁת נָבָל הַֽ/כַּרְמְלִי
  choice: жена Навала из Кармила
  rationale: Сочетание прямо определяет Авигею через её брак с Навалом, а мужская форма הַכַּרְמְלִי указывает, что Навал был из Кармила. Такая передача ясна и не вызывает ложной ассоциации с более поздним религиозным орденом.
