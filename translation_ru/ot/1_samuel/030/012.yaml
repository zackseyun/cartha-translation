base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/012.yaml
  text: They gave him a piece of fig cake and two clusters of raisins[a], and he ate, and his spirit returned to him[c][b], for he had not eaten bread or drunk water for three days and three nights.
translation:
  language: ru
  text: Они дали ему кусок инжирной лепёшки[a] и две связки изюма[b]. Он поел, и дух вернулся к нему[c], потому что три дня и три ночи он не ел хлеба и не пил воды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имеется в виду лепёшка из спрессованного сушёного инжира.
    reason: cultural_note
  - marker: b
    text: 'Возможно: «две лепёшки из изюма».'
    reason: lexical_alternative
  - marker: c
    text: 'То есть к нему вернулись силы, он ожил; буквально: «его дух вернулся к нему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶלַח דְּבֵלָה
  choice: кусок инжирной лепёшки
  rationale: פֶלַח означает кусок или ломоть, а דְּבֵלָה — спрессованную массу сушёного инжира. «Инжирная лепёшка» естественно обозначает такой древний пищевой продукт; пояснение о прессовании вынесено в сноску.
- source_word: שְׁנֵי צִמֻּקִים
  choice: две связки изюма
  rationale: צִמֻּקִים означает изюм, а числительное указывает на две отдельные единицы. «Связки» сохраняет неопределённость формы и звучит естественнее буквального «два изюма»; возможное понимание как лепёшек отмечено в сноске.
- source_word: וַתָּשָׁב רוּחוֹ אֵלָיו
  choice: дух вернулся к нему
  rationale: Буквальный образ еврейского текста сохранён, поскольку он понятен по-русски и не сводит выражение только к восстановлению физических сил.
- source_word: לֶחֶם
  choice: хлеба
  rationale: Сохранено конкретное значение «хлеб», хотя слово может шире обозначать пищу; в паре с водой буквальная передача естественна.
- source_word: שָׁתָה מַיִם
  choice: не пил воды
  rationale: Передано конкретное упоминание воды, а не обобщённое «ничего не пил».
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: три дня и три ночи
  rationale: Прямое и естественное соответствие еврейскому временному выражению.
theological_decisions:
- issue: Значение выражения о возвращении духа
  choice: дух вернулся к нему
  alternative: к нему вернулись силы; он ожил
  rationale: Буквальная формулировка сохраняет образ и смысловую широту исходного текста, не решая без необходимости, идёт ли речь прежде всего о сознании, жизни или физических силах.
translation_notes:
  register: Современный литературный русский язык с простым, повествовательным синтаксисом. Конкретные слова «хлеб» и «вода» сохранены; культурно неочевидные названия пищи пояснены в сносках.
