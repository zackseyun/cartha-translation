  text: Давид отбил всё, что захватили амаликитяне[a], и вызволил двух своих жён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В обеих частях употреблён один и тот же еврейский глагол со значением «избавить, спасти, вызволить»; по-русски он передан как «отбил» и «вызволил» в соответствии с разными дополнениями.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל / הִצִּיל (נצל)
  choice: отбил / вызволил
  rationale: Обе формы восходят к одному еврейскому корню со значением избавления или отнятия у захватчика. В первом контексте естественно «отбил» — вернул захваченное силой; применительно к жёнам естественнее «вызволил». Различие обусловлено русской сочетаемостью, а не различием еврейских глаголов.
- source_word: כָּל אֲשֶׁר לָקְחוּ עֲמָלֵק
  choice: всё, что захватил Амалик
  rationale: «Всё, что» прямо передаёт כָּל אֲשֶׁר. «Захватил» ясно выражает контекст военного набега и по-русски естественнее простого «взял».
- source_word: עֲמָלֵק
  choice: Амалик
  rationale: Сохранено собственное имя в единственном числе, которое в еврейском тексте собирательно обозначает амаликитян.
- source_word: שְׁתֵּי נָשָׁיו
  choice: двух своих жён
  rationale: Переданы и числительное «две», и принадлежность Давиду; возвратное «своих» естественно в русском предложении с Давидом как действующим лицом.
- source_word: דָּוִד ... דָּוִד
  choice: Давид ... [не повторено]
  rationale: 'Второе имя опущено ради естественного русского синтаксиса: обе части имеют одного явно названного деятеля. Еврейский повтор усиливает завершённость высказывания, но дословное повторение здесь звучало бы тяжеловесно.'
