  source_fidelity: В первом придаточном еврейское עֲמָלֵק («Амалик») выступает собирательным обозначением народа, однако глагол לָקְחוּ стоит во множественном числе. Русское «Амалик захватил» выглядит как действие одного носителя собственного имени и не передаёт этого коллективного референта. «Отбил» и «вызволил» уместно передают контекстуальные оттенки одного и того же корня נצל; числительное и принадлежность жён сохранены.
