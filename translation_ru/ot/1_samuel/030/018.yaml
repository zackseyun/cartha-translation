  terminology: '«Амаликитяне» точно обозначает коллективный субъект, подразумеваемый названием «Амалик» в данном контексте. Примечание корректно объясняет контекстуальную передачу одного еврейского глагола, но формулировку следует сделать точнее: корень означает избавление/спасение, а не обязательно «отнять у захватчика».'
