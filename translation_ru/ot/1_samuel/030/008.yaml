base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/008.yaml
  text: And David inquired of the LORD, saying, “Should I pursue this raiding party? Will I overtake them?” And he said to him, “Pursue, for you will surely overtake them, and you will surely rescue.”
translation:
  language: ru
  text: 'И вопросил Давид Господа: «Преследовать ли мне этот отряд? Настигну ли я его?» Господь ответил ему: «Преследуй, потому что непременно настигнешь и непременно спасёшь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל דָּוִד בַּיהוָה
  choice: И вопросил Давид Господа
  rationale: Оборот означает обращение к Богу за указанием. Традиционное «вопросил Господа» точно и уместно в литературном библейском русском.
- source_word: הַגְּדוּד
  choice: этот отряд
  rationale: В данном контексте речь идёт о совершившем набег отряде; нейтральное «отряд» сохраняет значение, не добавляя характеристики, прямо отсутствующей в слове.
- source_word: הַאַשִּׂגֶנּוּ / הַשֵּׂג תַּשִּׂיג
  choice: Настигну ли я его? / непременно настигнешь
  rationale: 'Глагол נשׂג означает настичь или догнать. Конструкция с абсолютным инфинитивом усиливает уверенность: «непременно настигнешь».'
- source_word: וְהַצֵּל תַּצִּיל
  choice: и непременно спасёшь пленников
  rationale: Усилительная конструкция передаёт гарантированное избавление. Объект в еврейском тексте не выражен; «пленников» естественно восстанавливается из ближайшего контекста, но отмечается сноской.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: Господь
  alternative: Яхве
  rationale: «Господь» соответствует устойчивой русской библейской традиции и не вводит конфессионально специфического акцента.
- issue: Неуказанный субъект ответа в וַיֹּאמֶר לוֹ
  choice: Господь ответил ему
  alternative: Он ответил ему
  rationale: По синтаксису и контексту отвечает Господь; явное называние устраняет неестественную для русского двусмысленность местоимения без изменения смысла.
- issue: Неуказанный объект глагола «спасти»
  choice: пленников с примечанием
  alternative: непременно спасёшь
  rationale: Контекст указывает на захваченных людей, однако в самом стихе объект отсутствует. Сноска сохраняет осведомлённость читателя об этой особенности оригинала.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской окраской. Повтор усилительных конструкций сохранён словом «непременно». Формулировки ясны обычному читателю, при этом лаконизм и торжественность исходного повествования не утрачены.
