base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/015.yaml
  text: David said to him[a], “Will you lead me down to this raiding party?” He said, “Swear to me by God that you will not kill me or hand me over into the hand of my master, and I will lead you down to this raiding party.”
translation:
  language: ru
  text: 'Давид спросил его: «Сведёшь ли ты меня к этому отряду[a]?» Тот ответил: «Поклянись мне Богом, что не убьёшь меня и не выдашь меня в руки моего господина, и я сведу тебя к этому отряду».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к этой шайке налётчиков». Еврейское слово обозначает вооружённый отряд, совершающий набеги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתוֹרִדֵנִי / וְאוֹרִדְךָ
  choice: сведёшь ли ты меня / я сведу тебя
  rationale: Каузативная форма глагола ירד буквально указывает на движение вниз, совершаемое при чьём-либо содействии. «Свести» естественно передаёт и направление, и роль проводника.
- source_word: הַגְּדוּד
  choice: отряд
  rationale: גדוד обозначает вооружённую группу, здесь — амаликитян, совершивших набег. «Отряд» звучит естественно по-русски; возможный смысл «отряд налётчиков» отмечен в сноске.
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  choice: Поклянись мне Богом
  rationale: Прямая и естественная формулировка сохраняет торжественный характер клятвы и явное призывание Бога.
- source_word: אִם תְּמִיתֵנִי
  choice: что не убьёшь меня
  rationale: В формуле клятвы אִם эллиптически выражает отрицательное условие. В русском отрицание необходимо обозначить явно.
- source_word: תַּסְגִּרֵנִי בְּיַד אֲדֹנִי
  choice: не выдашь меня в руки моего господина
  rationale: «Выдать» передаёт значение Hiphil סגר — отдать во власть, а выражение «в руки» сохраняет еврейский образ власти и контроля.
- source_word: אֲדֹנִי
  choice: моего господина
  rationale: Речь идёт о хозяине египетского раба. «Господин» в данном контексте естественно обозначает человеческого владельца и сохраняет социальное отношение исходного текста.
