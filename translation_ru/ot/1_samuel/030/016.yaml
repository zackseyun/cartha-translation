  text: וַ/יֹּ֣רִדֵ֔/הוּ וְ/הִנֵּ֥ה נְטֻשִׁ֖ים עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ אֹכְלִ֤ים וְ/שֹׁתִים֙ וְ/חֹ֣גְגִ֔ים בְּ/כֹל֙ הַ/שָּׁלָ֣ל הַ/גָּד֔וֹל אֲשֶׁ֥ר לָקְח֛וּ מֵ/אֶ֥רֶץ פְּלִשְׁתִּ֖ים וּ/מֵ/אֶ֥רֶץ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/016.yaml
  text: When he had led him down[a], behold, they were spread out over the face of all the land[b], eating and drinking and celebrating over all the great spoil that they had taken from the land of the Philistines and from the land of Judah.
translation:
  language: ru
  text: 'Он повёл его вниз, и вот: они были рассеяны по всей местности[a], ели, пили и веселились, радуясь всей огромной добыче[b], которую захватили из земли филистимлян и из земли Иуды.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были широко разбросаны по всей местности». Еврейское причастие может подчёркивать как разбросанность, так и широкое распространение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «веселились по случаю всей огромной добычи». Еврейский предлог может обозначать повод или основание их веселья.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרִדֵהוּ
  choice: Он привёл его вниз
  rationale: Порода хифиль глагола ירד означает «заставить спуститься, привести вниз». Формулировка сохраняет направленность действия и местоименную неоднозначность оригинала.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Частица הִנֵּה живо вводит открывшуюся перед Давидом картину; современное русское «вот» передаёт эту повествовательную функцию без излишней архаики.
- source_word: נְטֻשִׁים עַל־פְּנֵי כָל־הָאָרֶץ
  choice: расположились по всей местности
  rationale: Страдательное причастие נְטֻשִׁים описывает людей, широко разместившихся или рассеявшихся. «По всей местности» естественно передаёт локальный смысл הָאָרֶץ и не создаёт впечатления, будто речь идёт обо всей земле как мире.
- source_word: אֹכְלִים וְשֹׁתִים וְחֹגְגִים
  choice: ели, пили и веселились
  rationale: Три русских глагола сохраняют последовательность трёх еврейских причастий и изображают продолжающееся пиршество; «веселились» передаёт חֹגְגִים, не дублируя уже названные еду и питьё.
- source_word: בְּכֹל הַשָּׁלָל הַגָּדוֹל
  choice: радуясь всей огромной добыче
  rationale: Предлог בְּ обозначает здесь повод или основание веселья. Деепричастная конструкция звучит по-русски естественнее буквального «из-за добычи», сохраняя причинно-обстоятельственный смысл; возможное более прямое понимание отмечено в сноске.
- source_word: אֲשֶׁר לָקְחוּ
  choice: которую захватили
  rationale: Глагол לקח в контексте набега естественно передаётся как «захватили»; предшествование захвата веселью ясно из контекста и не требует тяжеловесной конструкции.
- source_word: מֵאֶרֶץ פְּלִשְׁתִּים וּמֵאֶרֶץ יְהוּדָה
  choice: в земле филистимлян и в земле Иуды
  rationale: Предлог מִן при глаголе захвата указывает на место, откуда была взята добыча. Повтор «в земле» сохраняет параллелизм двух территориальных обозначений и естественен при русском «захватили».
