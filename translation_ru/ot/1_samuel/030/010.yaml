  source_fidelity: 'Смысл передан в целом точно: Давид продолжает погоню с четырьмястами, тогда как двести не идут дальше из-за изнеможения и не переходят Бесор. Однако «остановились» слабее контекстуального значения וַיַּעַמְדוּ и не столь ясно обозначает, что эти двести остались позади. «Остались» точнее и естественнее. «Воинами» допустимо по контексту, но אִישׁ в счётной формуле означает «человек»; нейтральное «человек» сохраняет формулировку исходного текста.'
  naturalness: Предлагаемая редакция звучит как современное литературное повествование. Тире и повтор слова «человек» ясно организуют две группы, не добавляя смысловых деталей.
  terminology: «Поток Бесор» — приемлемая передача נַחַל הַבְּשׂוֹר; примечание надлежащим образом отмечает, что נַחַל может означать также вади или сезонное русло. Имя «Бесор» передано последовательно. Богословски нагруженных терминов в стихе нет.
