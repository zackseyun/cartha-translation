    rationale: В данном контексте עמד обозначает, что двести человек не продолжили путь с Давидом и остались позади. Русское «остановились» может описывать лишь временную остановку и не выражает этого повествовательного результата достаточно ясно.
  - severity: low
    issue: «Воинами» несколько конкретизирует אִישׁ.
    rationale: Военный контекст делает такое слово понятным, но в еврейской счётной формуле буквально сказано «четыреста человек». Нейтральное соответствие лучше сохраняет лексику источника.
  - severity: low
