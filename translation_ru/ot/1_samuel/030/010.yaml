lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: продолжил погоню
  rationale: Глагол רדף означает «преследовать, гнаться». В данном контексте погоня уже началась (ст. 8–9), поэтому «продолжил погоню» естественно передаёт развитие повествования.
- source_word: הוּא וְאַרְבַּע מֵאוֹת אִישׁ
  choice: с четырьмястами воинами
  rationale: Конструкция буквально означает «он и четыреста мужчин». Предлог «с» естественно выражает совместное действие, а «воинами» соответствует военному контексту.
- source_word: וַיַּעַמְדוּ
  choice: остановились
  rationale: Основное значение עמד — «стоять, остановиться». Здесь двести человек прекратили движение и не продолжили погоню; «остановились» сохраняет конкретность еврейского выражения.
- source_word: אֲשֶׁר פִּגְּרוּ מֵעֲבֹר
  choice: потому что выбились из сил и не могли перейти
  rationale: Редкий глагол פגר здесь указывает на изнеможение или отставание вследствие усталости. Формулировка передаёт как их состояние, так и невозможность продолжить переправу, не сводя значение только к одному оттенку.
- source_word: נַחַל הַבְּשׂוֹר
  choice: поток Бесор
  rationale: נחל может обозначать поток, вади или сезонное русло. «Поток» читается естественно по-русски, а примечание сохраняет географическую неоднозначность термина.
