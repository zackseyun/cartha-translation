base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/010.yaml
  text: So David pursued[a], he and four hundred men, while two hundred men stayed behind[b], who were too exhausted to cross the Brook Besor.
translation:
  language: ru
  text: Давид продолжил погоню — он и четыреста человек; двести же остались, потому что выбились из сил и не могли перейти поток Бесор[b].[a]
  philosophy: optimal-equivalence
