revisions:
- from: Давид продолжил погоню с четырьмястами воинами, а двести остановились[a], потому что выбились из сил и не могли перейти поток Бесор[b].
  to: Давид продолжил погоню — он и четыреста человек; двести же остались, потому что выбились из сил и не могли перейти поток Бесор[b].[a]
  rationale: Заменено «остановились» на «остались», чтобы передать роль двухсот человек как оставшихся позади, а не просто прекративших движение. «Воинами» заменено на «человек» как более прямое соответствие אִישׁ в числовой формуле. Сноска a перенесена к сообщению об изнеможении, к которому она относится; сноска b остаётся при названии водотока. Основной текст сохраняет естественное контекстуальное понимание конструкции «выбились из сил и не могли перейти», не утверждая больше, чем позволяет еврейское выражение.
