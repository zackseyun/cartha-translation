base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/026.yaml
  text: When David came to Ziklag[a], he sent some of the plunder to the elders of Judah, his friends, saying, “Look, here is a gift for you from the plunder of the enemies of Yahweh.”
translation:
  language: ru
  text: 'Когда Давид пришёл в Секелаг, он послал часть добычи старейшинам Иудеи, своим друзьям, со словами: «Вот вам дар[a] из добычи врагов Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благословение». Еврейское слово означает «благословение», но здесь обозначает материальный дар из добычи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Когда Давид пришёл
  rationale: Вав-последовательный продолжает повествование; придаточное с «когда» естественно связывает прибытие Давида с последующим действием, сохраняя временную последовательность.
- source_word: צִקְלַג
  choice: Секелаг
  rationale: Устоявшаяся русская библейская форма географического названия.
- source_word: וַיְשַׁלַּח מֵהַשָּׁלָל
  choice: он послал часть добычи
  rationale: Предлог מִן указывает, что послано не всё захваченное, а некоторая часть; «добыча» естественно передаёт военный контекст שׁלל.
- source_word: לְזִקְנֵי יְהוּדָה
  choice: старейшинам Иудеи
  rationale: Старейшины — признанные руководители родов и общин Иудеи.
- source_word: לְרֵעֵהוּ
  choice: своим друзьям
  rationale: רֵעַ допускает значения «друг», «ближний», «товарищ»; здесь речь о благосклонно расположенных к Давиду старейшинах, поэтому «друзьям» сохраняет естественную широту отношения.
- source_word: הִנֵּה לָכֶם
  choice: Вот вам
  rationale: Краткая современная формула сохраняет указательно-презентативную силу הִנֵּה без архаического «вот, се».
- source_word: בְּרָכָה
  choice: дар
  rationale: Буквально слово означает «благословение», но в данном контексте обозначает материальный подарок из добычи; буквальный оттенок сохранён в сноске.
- source_word: מִשְּׁלַל
  choice: из добычи, взятой у
  rationale: Формулировка ясно передаёт происхождение дара и естественно связывает добычу с побеждёнными врагами.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму и функцию имени в еврейском тексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное Божье имя, не заменяя его титулом.
- issue: Значение בְּרָכָה в контексте распределения добычи
  choice: дар
  alternative: благословение
  rationale: Непосредственно имеется в виду материальный дар, однако буквальное «благословение» несёт значимый положительный оттенок и потому указано в сноске.
- issue: Выражение אֹיְבֵי יְהוָה
  choice: врагов Яхве
  alternative: врагов народа Яхве
  rationale: 'Сохранена прямая конструкция исходного текста: Давид богословски представляет побеждённых как врагов самого Яхве; уточнение «народа» отсутствует в еврейском.'
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Вот вам» передаёт הִנֵּה естественно и без архаизации; «добыча» употреблена последовательно для שׁלל. Синтаксис сохраняет связь прибытия Давида с отправкой дара.
