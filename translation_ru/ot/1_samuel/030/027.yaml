base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/027.yaml
  text: to those in Bethel[a], to those in Ramoth-negeb, and to those in Jattir—
translation:
  language: ru
  text: тем, кто в Вефиле, тем, кто в Рамоф-Негеве[a], и тем, кто в Иаттире, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Рамофе Негева», то есть «в Южном Рамофе».'
    reason: Сочетание רָמוֹת נֶגֶב допускает передачу как составного топонима либо как названия с географическим уточнением.
lexical_decisions:
- source_word: לַאֲשֶׁר
  choice: тем, кто
  rationale: Сочетание предлога ל с относительным אֲשֶׁר в перечне получателей естественно передаётся по-русски как «тем, кто»; дательный смысл определяется контекстом предыдущего стиха.
- source_word: בְּבֵית אֵל
  choice: в Вефиле
  rationale: בֵית אֵל здесь является названием места, а не нарицательным выражением «дом Бога»; предлог בְּ передан естественным русским «в».
- source_word: בְּרָמוֹת נֶגֶב
  choice: в Рамоф-Негеве
  rationale: Выражение передано как составной топоним, что сохраняет смысловую неопределённость роли נֶגֶב и не навязывает толкование «южный» или «Негева».
- source_word: בְּיַתִּר
  choice: в Иаттире
  rationale: Название места передано принятой русской библейской формой; בְּ естественно выражено предлогом «в».
- source_word: וְ
  choice: и
  rationale: Простой соединительный союз связывает последний элемент перечня.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением ритма перечня. Повтор «тем, кто» отражает повторяющееся לַאֲשֶׁר в еврейском тексте. Конечное тире показывает, что список продолжается в следующем стихе.
