lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: и тем, кто жил
  rationale: Повторяющееся сочетание союза, предлога и относительной частицы обозначает адресатов даров, находившихся в перечисленных местах. Добавление «жил» естественно передаёт подразумеваемое местонахождение людей по-русски.
- source_word: בְּרָכָל
  choice: в Рахале
  rationale: Топоним רָכָל передан транслитерацией; русское «Рахал» отражает еврейскую согласную כ в позиции после гласной.
- source_word: בְּעָרֵי
  choice: в городах
  rationale: עִיר может обозначать город или селение. Нейтральное «города» сохраняет обычное библейское обозначение населённых пунктов без необоснованного уточнения их размера.
- source_word: הַיְּרַחְמְאֵלִי
  choice: иерахмеильтян
  rationale: Форма единственного числа с артиклем имеет собирательное значение и после «городах» естественно передаётся русским названием народа во множественном числе.
- source_word: הַקֵּינִי
  choice: кенеев
  rationale: Гентилик в единственном числе употреблён собирательно; русское множественное число обозначает народ, которому принадлежали эти города.
