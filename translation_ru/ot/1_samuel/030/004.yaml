lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־קוֹלָם
  choice: возвысили голос
  rationale: Устойчивое и уместное для торжественного повествования русское выражение передаёт еврейскую идиому «поднять голос»; единственное число «голос» сохраняет форму собирательного выражения.
- source_word: וַיִּבְכּוּ
  choice: плакали
  rationale: Передаёт продолжительное рыдание в контексте скорби и позволяет сохранить повтор корня далее в стихе.
- source_word: עַד אֲשֶׁר אֵין בָּהֶם כֹּחַ
  choice: пока у них не осталось сил
  rationale: Естественно по-русски выражает полное физическое изнеможение, буквально описанное как отсутствие силы в них.
- source_word: לִבְכּוֹת
  choice: плакать
  rationale: Сохраняет намеренный лексический повтор еврейского корня בכה.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: люди, бывшие с ним
  rationale: Не сужает широкое значение עָם до «воинов» или «мужчин», хотя по контексту речь идёт о сопровождавшем Давида отряде.
