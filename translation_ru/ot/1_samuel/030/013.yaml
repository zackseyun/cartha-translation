base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/013.yaml
  text: David said to him, “Whose are you, and where are you from?” He said, “I am an Egyptian young man, a servant of an Amalekite man, and my master abandoned me because I became sick three days ago.”
translation:
  language: ru
  text: 'Давид спросил его: «Чей ты и откуда?» Тот ответил: «Я молодой египтянин, раб одного амаликитянина. Мой господин бросил меня, потому что три дня назад я заболел».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִי אַתָּה
  choice: «Чей ты?»
  rationale: Кратко и естественно передаёт вопрос о принадлежности человека хозяину, сохраняя социальный контекст рассказа.
- source_word: נַעַר מִצְרִי
  choice: «молодой египтянин»
  rationale: Передаёт возрастно-социальное значение נַעַר естественным современным русским выражением.
- source_word: עֶבֶד
  choice: «раб»
  rationale: В данном контексте человек принадлежит хозяину, который затем его бросает; «раб» точнее передаёт עֶבֶד, чем более широкое «слуга».
- source_word: אֲדֹנִי
  choice: «мой господин»
  rationale: Сохраняет обозначение хозяина раба и не смешивает его с божественным титулом.
- source_word: כִּי חָלִיתִי הַיּוֹם שְׁלֹשָׁה
  choice: «потому что три дня назад я заболел»
  rationale: Передаёт идиоматическое временное выражение הַיּוֹם שְׁלֹשָׁה и начавшееся заболевание ясным русским языком.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; речь краткая, повествовательная и dignified. Для смены говорящего употреблено «тот ответил», чтобы избежать тяжёлого повторения. «Одного амаликитянина» естественно передаёт неопределённость לְאִישׁ עֲמָלֵקִי.
