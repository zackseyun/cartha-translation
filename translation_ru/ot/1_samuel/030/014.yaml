  text: אֲנַ֡חְנוּ פָּשַׁ֜טְנוּ נֶ֧גֶב הַ/כְּרֵתִ֛י וְ/עַל אֲשֶׁ֥ר לִֽ/יהוּדָ֖ה וְ/עַל נֶ֣גֶב כָּלֵ֑ב וְ/אֶת צִקְלַ֖ג שָׂרַ֥פְנוּ בָ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/014.yaml
  text: We raided the Negev of the Kerethites[a], and the territory that belongs to Judah, and the Negev of Caleb; and we burned Ziklag with fire.
translation:
  language: ru
  text: Мы совершили набег на Негев[a] керетян[b], на землю, принадлежащую Иуде, и на Негев Халева, а Циклаг сожгли огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «южную область»; то же ниже в этом стихе.'
    reason: Слово נֶגֶב может быть географическим названием Негева либо обозначать южную область.
  - marker: b
    text: 'Возможная передача названия: «херетян».'
    reason: Вариант русской транслитерации названия народа.
lexical_decisions:
- source_word: פָּשַׁטְנוּ
  choice: совершили набег
  rationale: В военном контексте глагол обозначает грабительское вторжение. Выражение «совершили набег» точно передаёт характер действия, не сводя его ни к простому нападению, ни к одному лишь разграблению.
- source_word: נֶגֶב
  choice: Негев
  rationale: Здесь слово, вероятнее всего, называет южную засушливую область, а не только направление. Географическое название сохранено в обоих случаях; возможное нарицательное значение отмечено в сноске.
- source_word: הַכְּרֵתִי
  choice: керетян
  rationale: Еврейское слово является названием народа. Форма «керетяне» близко передаёт еврейские согласные и естественно склоняется по-русски; традиционная передача через начальное «х» дана как вариант.
- source_word: וְעַל אֲשֶׁר לִיהוּדָה
  choice: на землю, принадлежащую Иуде
  rationale: Предлог продолжает перечень областей, подвергшихся набегу, а относительная конструкция выражает принадлежность Иуде. Слово «землю» добавлено по смыслу, чтобы избежать неестественного «на то, что принадлежит Иуде».
- source_word: נֶגֶב כָּלֵב
  choice: Негев Халева
  rationale: Сочетание обозначает южную область, связанную с Халевом или его родом. Сохранена краткая и допускающая эту смысловую широту еврейская конструкция.
- source_word: שָׂרַפְנוּ בָאֵשׁ
  choice: сожгли огнём
  rationale: Сохранены и глагол «сжечь», и прямо названное средство — огонь. Хотя по-русски это несколько избыточно, повторение передаёт выразительность исходного текста.
- source_word: צִקְלַג
  choice: Циклаг
  rationale: Передача топонима непосредственно с древнееврейского; она сохраняет начальный и конечный согласные исходной формы.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. Параллельное построение перечня сохранено, но громоздкое буквальное «на то, что принадлежит Иуде» естественно раскрыто как «на землю, принадлежащую Иуде».
