base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/019.yaml
  text: Nothing of theirs was missing[a], from small to great, sons and daughters, spoil, or anything that had been taken from them[b]; David brought back everything.
translation:
  language: ru
  text: 'У них не пропало ничего[a]: ни малого, ни великого, ни сыновей, ни дочерей, ни добычи, ни всего, что они забрали себе[b]. Всё возвратил Давид.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «У них ничего не недоставало».'
    reason: 'Лексическая альтернатива: נֶעְדַּר означает «отсутствовать», «недоставать», «пропасть».'
  - marker: b
    text: 'Буквально: «всего, что они взяли себе». Из контекста следует, что речь идёт об амаликитянах и о захваченном ими.'
    reason: Сохраняет буквальную форму еврейского выражения и поясняет контекстуального субъекта, не добавляя его в основной текст.
lexical_decisions:
- source_word: נֶעְדַּר לָהֶם
  choice: никого у них не недосчитались / ничего …
  rationale: Нифаль глагола עדר означает отсутствие или недостачу. По-русски конструкция «не недосчитались» естественно передаёт, что среди возвращённых людей никто не пропал; последующее «ничего» охватывает имущество.
- source_word: מִן הַקָּטֹן וְעַד הַגָּדוֹל
  choice: ни малого, ни великого
  rationale: Сохраняет меризм и допускает понимание как возраста, так и положения, не устраняя присущую выражению широту.
- source_word: בָּנִים וּבָנוֹת
  choice: сыновей, ни дочерей
  rationale: Передаёт оба прямо названных в еврейском тексте слова, не обобщая их словом «дети».
- source_word: מִשָּׁלָל
  choice: из добычи
  rationale: «Добыча» — естественное и точное обозначение имущества, захваченного во время набега.
- source_word: כָּל אֲשֶׁר לָקְחוּ לָהֶם
  choice: из всего, что амаликитяне забрали себе
  rationale: Близко передаёт буквальное «всё, что они взяли себе»; субъект «амаликитяне» восстановлен из ближайшего контекста во избежание неясного местоимения.
- source_word: הַכֹּל הֵשִׁיב דָּוִד
  choice: Всё возвратил Давид
  rationale: Сохраняет смысл каузативной формы שוב — возвратить захваченное — и эмфатическое начальное «всё».
