translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Парная конструкция «ни малого, ни великого» сохраняет библейский меризм, а повтор «ни» делает длинное перечисление ясным. Инверсия «Всё возвратил Давид» подчёркивает полноту возвращения, как и еврейский порядок слов.
