lexical_decisions:
- source_word: וְהִנֵּה
  choice: они увидели, что
  rationale: В повествовательном контексте передаёт внезапно открывшуюся им картину естественным современным русским языком, не утрачивая функции еврейского указательного оборота.
- source_word: שְׂרוּפָה בָּאֵשׁ
  choice: сожжён
  rationale: Еврейское выражение буквально означает «сожжён огнём»; по-русски упоминание огня избыточно, а краткое страдательное причастие сохраняет состояние как результат предшествующего действия.
- source_word: נִשְׁבּוּ
  choice: уведены в плен
  rationale: Форма обозначает захват в плен; «уведены в плен» естественно описывает судьбу отсутствующих жителей и сохраняет страдательное значение.
