revisions:
- from: Когда Давид и его люди на третий день пришли в Секелаг, амаликитяне уже совершили набег на Негев[a] и Секелаг, разгромили Секелаг и сожгли его.
  to: Когда Давид и его люди на третий день пришли в Секелаг, амаликитяне уже совершили набег на Негев[a] и Секелаг, напали на Секелаг и предали его огню.
  rationale: Заменено чрезмерно определённое «разгромили» на нейтральное «напали», соответствующее широкой семантике נכה. «Предали его огню» естественно для современного литературного русского и сохраняет подчёркнутое в еврейском тексте сожжение огнём. Примечание исправлено для ясного и грамматически корректного отражения альтернативного значения נֶגֶב.
