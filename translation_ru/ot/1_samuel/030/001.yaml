base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/001.yaml
  text: When David and his men came to Ziklag on the third day[a], the Amalekites had made a raid against the Negev and against Ziklag, and they had struck Ziklag and burned it with fire.
translation:
  language: ru
  text: Когда Давид и его люди на третий день пришли в Секелаг, амаликитяне уже совершили набег на Негев[a] и Секелаг, напали на Секелаг и предали его огню.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на юг» или «в южную область». Еврейское слово «негев» может обозначать юг или южную область вообще, а также конкретную область Негев.'
    reason: Сохранена лексико-географическая неоднозначность еврейского נֶגֶב.
lexical_decisions:
- source_word: וַיְהִי בְּבֹא
  choice: Когда … пришли
  rationale: Оборот задаёт временную рамку повествования. Русское придаточное с «когда» естественно передаёт эту функцию без архаичного «и было».
- source_word: וַאֲנָשָׁיו
  choice: и его люди
  rationale: В данном контексте речь идёт о людях из отряда Давида; выражение сохраняет смысл и звучит естественно по-русски.
- source_word: צִקְלַג
  choice: Секелаг
  rationale: Использована традиционно закрепившаяся в русской библейской культуре форма географического названия.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: на третий день
  rationale: Прямой и привычный русский эквивалент временного выражения.
- source_word: וַעֲמָלֵקִי
  choice: амаликитяне
  rationale: Хотя еврейская форма внешне единственного числа, согласование с глаголами во множественном числе указывает на собирательное обозначение народа.
- source_word: פָשְׁטוּ
  choice: уже совершили набег
  rationale: В военном контексте глагол означает набег. «Уже» ясно показывает, что нападение произошло до возвращения Давида, не меняя последовательности событий.
- source_word: אֶל נֶגֶב
  choice: на Негев
  rationale: נֶגֶב может обозначать юг вообще или конкретную южную область. В основном тексте выбрано географическое название, а неоднозначность отражена в примечании.
- source_word: וַיַּכּוּ אֶת צִקְלַג
  choice: разгромили Секелаг
  rationale: נכה имеет широкий смысл «поразить, ударить, напасть». В описании военного нападения «разгромили» естественно выражает результативное поражение города.
- source_word: וַיִּשְׂרְפוּ אֹתָהּ בָּאֵשׁ
  choice: и сожгли его
  rationale: Русский глагол «сожгли» сам по себе передаёт действие огнём; буквальное добавление «огнём» было бы ненужным повтором. Местоимение мужского рода согласовано с русским названием города.
