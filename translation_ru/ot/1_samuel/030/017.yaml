base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/017.yaml
  text: David struck them down from the twilight until the evening of the next day[a], and not a man of them escaped, except four hundred young men who rode on the camels and fled.
translation:
  language: ru
  text: Давид поражал их от сумерек до вечера следующего дня[a]. Никто из них не спасся, кроме четырёхсот молодых людей, которые, сев на верблюдов, бежали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от рассвета»; еврейское слово может обозначать сумерки как на исходе дня, так и перед восходом солнца. Некоторые понимают его здесь как утренние сумерки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: поражал их
  rationale: Глагол נכה в военном контексте означает наносить удары и поражать противника. «Поражал их» передаёт силу действия, не прибегая к архаичному «разил» и не сужая значение до одного лишь «напал».
- source_word: מֵהַנֶּשֶׁף
  choice: от сумерек
  rationale: נשף обозначает сумеречное время и может относиться как к вечеру, так и к рассвету. Основной текст сохраняет эту лексическую неоднозначность, а примечание указывает альтернативное понимание.
- source_word: וְעַד הָעֶרֶב לְמָחֳרָתָם
  choice: до вечера следующего дня
  rationale: Естественная русская формулировка передаёт продолжительность действия вплоть до вечера последующего дня.
- source_word: וְלֹא נִמְלַט מֵהֶם אִישׁ
  choice: Никто из них не спасся
  rationale: Еврейское единственное число אִישׁ употреблено дистрибутивно. По-русски всеобщность отрицания естественно и точно выражается словом «никто».
- source_word: כִּי אִם
  choice: кроме
  rationale: Оборот вводит исключение из предшествующего всеобщего утверждения; «кроме» ясно и современно передаёт эту функцию.
- source_word: אַרְבַּע מֵאוֹת אִישׁ נַעַר
  choice: четырёхсот молодых людей
  rationale: נַעַר может означать юношу, молодого человека или слугу. Контекст не требует значения «слуги», а «молодые люди» не создаёт впечатления, будто речь идёт о детях.
- source_word: אֲשֶׁר רָכְבוּ עַל הַגְּמַלִּים
  choice: которые, сев на верблюдов
  rationale: Деепричастный оборот естественно передаёт по-русски, что именно верблюды позволили этим людям обратиться в бегство, сохраняя явное указание на верховую езду.
- source_word: וַיָּנֻסוּ
  choice: бежали
  rationale: נס означает спасаться бегством. «Бежали» сохраняет отличие этого глагола от предшествующего נמלט — «спастись».
