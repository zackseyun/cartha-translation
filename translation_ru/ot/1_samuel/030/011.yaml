base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/011.yaml
  text: They found an Egyptian man in the field and brought him to David[a]. They gave him bread, and he ate[c][b], and they gave him water to drink.
translation:
  language: ru
  text: Они нашли в поле египтянина и привели его к Давиду. Ему дали хлеба, и он поел; дали ему и воды напиться.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: Они нашли
  rationale: Повествовательная форма wayyiqtol естественно передаётся русским прошедшим временем; начальное «и» не требуется для связности современного русского рассказа.
- source_word: אִישׁ מִצְרִי
  choice: египтянина
  rationale: Русское субстантивированное обозначение национальности естественно передаёт сочетание «мужчина-египтянин»; слово «мужчину» было бы избыточным.
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: Прямое и естественное соответствие שָׂדֶה; контекст не требует уточнений «в открытом поле» или «в сельской местности».
- source_word: וַיִּקְחוּ אֹתוֹ אֶל דָּוִד
  choice: и привели его к Давиду
  rationale: לקח при обозначенном направлении допускает значение «отвести/привести»; «привели» естественно при движении человека к Давиду и не предполагает принуждения.
- source_word: וַיִּתְּנוּ לוֹ לֶחֶם
  choice: Ему дали хлеба
  rationale: Сохраняется конкретное значение לֶחֶם «хлеб»; родительный партитивный «хлеба» естественен при неопределённом количестве.
- source_word: וַיֹּאכַל
  choice: и он поел
  rationale: Глагол передан без добавления прямого дополнения, как и в еврейском тексте; «поел» идиоматично выражает принятие данной пищи.
- source_word: וַיַּשְׁקֻהוּ מָיִם
  choice: дали ему и воды напиться
  rationale: Передаёт каузативный смысл Hiphil от שׁקה — «дать пить, напоить» — естественным современным русским выражением без оттенка принуждения, возможного у «заставили пить».
