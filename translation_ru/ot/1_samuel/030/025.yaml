  text: 'And it was so from that day onward: he made it a statute and an ordinance for Israel to this day[a].'
translation:
  language: ru
  text: 'И с того дня так и повелось: Давид установил это как закон и правило для Израиля — до сего дня.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давид сделал это установлением и судебным порядком для Израиля».'
    reason: Слова חֹק и מִשְׁפָּט могут соответственно передаваться как «установление» и «судебный порядок»; примечание сохраняет юридический оттенок второго слова.
lexical_decisions:
- source_word: וַיְהִי
  choice: так и повелось
  rationale: В данном контексте оборот вводит устойчивый порядок, установленный с этого момента; русский идиоматический эквивалент передаёт не просто событие, а продолжающееся положение дел.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: с того дня
  rationale: В сочетании с «так и повелось» естественно выражает начало действия нормы и её дальнейшее продолжение.
- source_word: וַיְשִׂמֶהָ
  choice: Давид установил это
  rationale: Глагол שׂים здесь означает введение или установление нормы. Имя «Давид» восстанавливает ясного субъекта из контекста, избегая неясного русского «он».
- source_word: לְחֹק
  choice: как закон
  rationale: חֹק обозначает установленное, обязательное предписание; «закон» сохраняет формальный нормативный смысл и понятно современному читателю.
- source_word: וּלְמִשְׁפָּט
  choice: и правило
  rationale: מִשְׁפָּט имеет широкий диапазон значений, включая судебное решение и обязательный порядок. В паре с חֹק слово «правило» естественно передаёт действующую норму, не сводя её только к отдельному судебному приговору.
- source_word: לְיִשְׂרָאֵל
  choice: для Израиля
  rationale: Предлог ל обозначает народ, для которого установлена эта норма.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Традиционный, достоинственный и понятный русский эквивалент, указывающий на сохранение нормы до времени рассказчика.
