    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/אֲשֶׁר בְּ/חֶבְר֑וֹן
  choice: и жителям Хеврона
  rationale: Сочетание предлога с относительной частицей продолжает перечень получателей. По-русски подразумеваемое «тем, кто находился в Хевроне» естественно и кратко передаётся словом «жителям».
- source_word: וּֽ/לְ/כָל הַ/מְּקֹמ֛וֹת
  choice: и во все места
  rationale: Сохраняется прямое упоминание всех мест как пунктов, куда были посланы дары; такая формулировка естественна в контексте предыдущего стиха.
- source_word: אֲשֶֽׁר ... שָׁ֥ם
  choice: где
  rationale: Русское относительное наречие «где» естественно объединяет значение אֲשֶׁר с локативным שָׁם, не создавая избыточного «где… там».
- source_word: הִתְהַלֶּךְ
  choice: странствовали
  rationale: Форма хитпаэль обозначает продолжительное или неоднократное передвижение по разным местам. «Странствовали» передаёт этот смысл лучше, чем нейтральное «ходили».
- source_word: דָּוִד הוּא וַ/אֲנָשָׁיו
  choice: Давид и его люди
  rationale: Местоимение הוּא здесь возобновляет подлежащее перед сочетанием «и его люди»; отдельное «сам» могло бы придать не требуемое контекстом противопоставительное ударение. אֲנָשָׁיו обозначает людей из отряда Давида.
