source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ דָּוִ֗ד ה֚וּא וְ/שֵׁשׁ מֵא֥וֹת אִישׁ֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יָּבֹ֖אוּ עַד נַ֣חַל הַ/בְּשׂ֑וֹר וְ/הַ/נּֽוֹתָרִ֖ים עָמָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/009.yaml
  text: So David went[a], he and the six hundred men who were with him, and they came to the Brook Besor[b], where those who were left behind stayed.
translation:
  language: ru
  text: И пошёл Давид — он и шестьсот человек, бывших с ним, — и дошли они до потока Бесор[a], а оставшиеся остановились[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать также сезонный водный поток, его русло или ущелье; поэтому возможен перевод «вади Бесор».
    reason: cultural_note
  - marker: b
    text: 'Буквально: «встали». Возможен перевод: «остались».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד
  choice: И пошёл Давид
  rationale: Форма wayyiqtol продвигает повествование; союз «и» сохраняет обычную для еврейского рассказа последовательность событий и естественно звучит по-русски.
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר אִתּוֹ
  choice: он и шестьсот человек, бывших с ним
  rationale: Самостоятельное местоимение הוּא сохранено как «он» в пояснительной конструкции. אִישׁ при числительном обозначает людей, в данном контексте — мужчин из отряда Давида; нейтральное «человек» естественно сочетается с числительным.
- source_word: וַיָּבֹאוּ
  choice: и дошли они
  rationale: Множественное число охватывает Давида и его людей. В контексте движения к определённому месту «дошли» естественнее русского «пришли» и передаёт достижение рубежа без добавления мысли о конечной цели похода.
- source_word: עַד נַחַל הַבְּשׂוֹר
  choice: до потока Бесор
  rationale: עַד передаёт движение вплоть до указанного места. נַחַל может означать поток, русло сезонной реки или ущелье; «поток» понятно широкому читателю, а природная реалия поясняется в сноске.
- source_word: וְהַנּוֹתָרִים
  choice: а оставшиеся
  rationale: Субстантивированное причастие обозначает тех, кто остался или был оставлен. Формулировка сохраняет лаконичность и не уточняет на основании следующего стиха, почему и каким образом они отделились от остальных.
- source_word: עָמָדוּ
  choice: остановились
  rationale: Основное значение глагола — «стоять», но при описании пути он означает прекращение движения. «Остановились» передаёт контекстуальный смысл, не утверждая сверх текста, как долго они там оставались.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Пояснительная конструкция с тире сохраняет подчёркнутое еврейское «Давид — он и…». Финальная фраза намеренно не отождествляет «оставшихся» более подробно до пояснения в следующем стихе.
