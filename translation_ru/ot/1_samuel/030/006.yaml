  text: וַ/תֵּ֨צֶר לְ/דָוִ֜ד מְאֹ֗ד כִּֽי אָמְר֤וּ הָ/עָם֙ לְ/סָקְל֔/וֹ כִּֽי מָ֨רָה֙ נֶ֣פֶשׁ כָּל הָ/עָ֔ם אִ֖ישׁ עַל בנ/ו וְ/עַל בְּנֹתָ֑י/ו וַ/יִּתְחַזֵּ֣ק דָּוִ֔ד בַּ/יהוָ֖ה אֱלֹהָֽי/ו־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/006.yaml
  text: And David was greatly distressed[a], because the people spoke of stoning him, for the soul of all the people was bitter, each man because of his sons and his daughters. But David strengthened himself in Yahweh his God.
translation:
  language: ru
  text: 'Давиду стало очень тяжело, потому что народ говорил о том, чтобы побить его камнями: всех охватила горечь[a], каждого — из-за его сыновей и дочерей. Но Давид укрепился в Яхве, своём Боге.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «душа всего народа была горькой».'
    reason: Сноска сохраняет конкретный образ и коллективную форму еврейской идиомы; в основном тексте она передана естественным русским выражением.
lexical_decisions:
- source_word: וַתֵּצֶר לְדָוִד מְאֹד
  choice: Давиду стало очень тяжело
  rationale: Безличная конструкция с לְדָוִד описывает крайне тяжёлое, бедственное положение Давида; русский оборот естественно передаёт и конструкцию, и усиление מְאֹד.
- source_word: הָעָם
  choice: народ
  rationale: Сохранено общее обозначение исходного текста, хотя по контексту речь идёт о людях из отряда Давида.
- source_word: אָמְרוּ הָעָם לְסָקְלוֹ
  choice: народ говорил, что его надо побить камнями
  rationale: Инфинитив после אָמְרוּ выражает обсуждаемое намерение; формулировка передаёт замысел, не представляя побиение уже начавшимся.
- source_word: מָרָה נֶפֶשׁ כָּל הָעָם
  choice: весь народ был глубоко ожесточён
  rationale: Естественный русский эквивалент еврейской идиомы о «горькой душе»; наречие «глубоко» передаёт силу общего горя и озлобления, а буквальный образ сохранён в сноске.
- source_word: אִישׁ עַל בָּנָיו וְעַל בְּנֹתָיו
  choice: каждый из-за своих сыновей и дочерей
  rationale: אִישׁ употреблено распределительно; עַל указывает на причину горечи каждого человека.
- source_word: וַיִּתְחַזֵּק
  choice: укрепился
  rationale: Возвратно-среднее значение хитпаэля сохранено без уточнения способа, которым Давид обрёл силу.
- source_word: בַּיהוָה אֱלֹהָיו
  choice: в Яхве, своём Боге
  rationale: Предлог ב передан как «в», а притяжательное отношение — естественным русским «своём Боге».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте прямо стоит тетраграмматон; транслитерация сохраняет личное заветное имя и не заменяет его титулом.
- issue: Источник укрепления Давида
  choice: укрепился в Яхве
  alternative: обрёл силу у Яхве
  rationale: Формулировка сохраняет как активную/возвратную форму וַיִּתְחַזֵּק, так и предлог ב, не устраняя напряжение между действием Давида и Богом как основанием его силы.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет последовательность причин и контраст заключительной фразы; архаизмы и конфессионально окрашенные пояснения не добавлены.
