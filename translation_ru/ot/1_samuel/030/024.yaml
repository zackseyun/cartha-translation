base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/024.yaml
  text: And who will listen to you in this matter? For as is the share of the one who goes down into the battle[a], so is the share of the one who stays by the supplies[b]; together they shall divide.
translation:
  language: ru
  text: 'И кто послушает вас в этом деле? Ведь доля того, кто идёт в бой, будет такой же, как доля того, кто остаётся при снаряжении[a]: они будут делить поровну.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при вещах», «при обозе». Еврейское слово может обозначать вещи, утварь, снаряжение или поклажу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי
  choice: И кто
  rationale: Союз и вопросительное местоимение вводят риторическое возражение Давида; «И кто» сохраняет связь с предыдущей речью и естественно звучит по-русски.
- source_word: יִשְׁמַע לָכֶם
  choice: послушает вас
  rationale: שׁמע с ל может означать «слушать», «внимать» или «повиноваться». В данном контексте речь о том, кто согласится принять предложенное ими решение; «послушает вас» сохраняет широту выражения.
- source_word: לַדָּבָר הַזֶּה
  choice: в этом деле
  rationale: דבר здесь обозначает обсуждаемый вопрос или предложение, а не просто отдельное слово.
- source_word: כְּחֵלֶק ... וּכְחֵלֶק
  choice: доля ... должна быть такой же, как доля
  rationale: Повтор כְּחֵלֶק устанавливает равенство долей. Русская сравнительная конструкция ясно передаёт это соотношение без излишнего буквализма.
- source_word: הַיֹּרֵד בַּמִּלְחָמָה
  choice: того, кто идёт в бой
  rationale: Причастная конструкция буквально описывает «идущего/спускающегося в сражение». По-русски «идёт в бой» естественно передаёт участие в боевых действиях, не сводя выражение к существительному «воин».
- source_word: הַיֹּשֵׁב עַל הַכֵּלִים
  choice: того, кто остаётся при снаряжении
  rationale: יֹשֵׁב в контексте означает остающегося на месте, а כֵּלִים охватывает вещи, утварь, снаряжение или обоз. Выбор передаёт охрану оставленного имущества и сохраняет широкий смысл существительного.
- source_word: יַחְדָּו יַחֲלֹקוּ
  choice: делить они будут поровну
  rationale: יַחְדָּו буквально значит «вместе», но в параллельной конструкции о равных долях выражает совместное и равное участие в разделе. «Поровну» делает подразумеваемое равенство ясным по-русски.
