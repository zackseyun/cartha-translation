base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/020.yaml
  text: David took all the flocks and the herds[a]. They drove them ahead of the other livestock, and said[b], “This is David’s spoil.”
translation:
  language: ru
  text: 'Давид взял весь мелкий и крупный скот[a]. Его погнали перед тем скотом и сказали[b]: «Это добыча Давида».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех овец, коз и весь крупный рогатый скот».'
    reason: Лексически צאן — собирательное обозначение мелкого скота, прежде всего овец и коз, а בקר — крупного рогатого скота.
  - marker: b
    text: По-видимому, только что захваченный скот гнали перед ранее возвращённым скотом, выставляя его напоказ и объявляя добычей Давида. Еврейский текст прямо не называет тех, кто гнал скот и произносил эти слова.
    reason: Поясняет вероятную картину происходящего и сохраняет неопределённость субъекта глаголов во множественном числе.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное повествовательное значение לקח; перевод не усиливает явно не выраженную идею насильственного захвата.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: мелкий и крупный скот
  rationale: צאן обозначает главным образом овец и коз, а בקר — крупный рогатый скот; русское сочетание естественно и сохраняет различие категорий.
- source_word: נָהֲגוּ
  choice: погнали
  rationale: В данном контексте נהג означает гнать животных вперед.
- source_word: לִפְנֵי הַמִּקְנֶה הַהוּא
  choice: впереди того стада
  rationale: Сохраняет пространственное значение לִפְנֵי и указательное הַהוּא. Собирательное «стадо» естественно передает מקנה как совокупность скота.
- source_word: וַיֹּאמְרוּ
  choice: и говорили
  rationale: Множественное число сохранено, а несовершенный вид по-русски допускает понимание повторяемого или сопровождавшего шествие возгласа, не устраняя возможной неоднозначности субъекта.
- source_word: זֶה שְׁלַל דָּוִד
  choice: Это добыча Давида
  rationale: «Добыча» естественно передает военный трофейный смысл שׁלל; единственное «это» соответствует זֶה и относится ко всей совокупности добытого.
