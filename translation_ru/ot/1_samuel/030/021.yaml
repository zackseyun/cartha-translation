base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/021.yaml
  text: David came to the two hundred men who had become too exhausted to follow after David[a], and whom they had left at the Brook Besor. They came out to meet David and to meet the people who were with him[b], and David approached the people and asked them how they were.
translation:
  language: ru
  text: Давид пришёл к тем двумстам людям, которые выбились из сил и не смогли дальше идти за ним[a] и которых оставили у потока Бесор. Они вышли навстречу Давиду и людям, бывшим с ним. Давид подошёл к этим людям и спросил, всё ли у них благополучно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол можно также понять как «отстали» или «не смогли идти дальше из-за усталости».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «спросил их о благополучии (мире)». Это еврейский оборот, обозначающий вопрос о самочувствии и состоянии человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּגְּרוּ מִלֶּכֶת אַחֲרֵי דָוִד
  choice: выбились из сил и не смогли дальше идти за ним
  rationale: Редкий глагол פּגר в данном контексте указывает на изнеможение или отставание, из-за которого двести человек не продолжили путь. Перевод естественно передаёт и состояние, и его следствие, сохраняя идею движения вслед за Давидом.
- source_word: וַיֹּשִׁיבֻם
  choice: которых оставили
  rationale: Порода Hiphil глагола ישׁב означает «заставить остаться», «посадить», «разместить». Неопределённо-личная русская конструкция передаёт множественное число сказуемого, не вводя не названного в тексте субъекта.
- source_word: בְּנַחַל הַבְּשׂוֹר
  choice: у потока Бесор
  rationale: נחל может обозначать поток, русло или вади. «Поток Бесор» — понятное и нейтральное обозначение места, не преувеличивающее постоянство водотока.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: людям, бывшим с ним
  rationale: עָם здесь обозначает сопровождавший Давида отряд. «Люди» сохраняет широту еврейского слова, не сужая его до строго военного термина.
- source_word: וַיִּגַּשׁ דָּוִד אֶת הָעָם
  choice: Давид подошёл к ним
  rationale: נגשׁ означает приблизиться или подойти. Местоимение естественно отсылает к двумстам людям, не повторяя существительное и не смешивая приближение с последующим приветствием.
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: спросил, всё ли у них благополучно
  rationale: Еврейский оборот буквально говорит о расспросе относительно мира или благополучия. Русская формулировка естественно передаёт заботливый вопрос о состоянии людей.
