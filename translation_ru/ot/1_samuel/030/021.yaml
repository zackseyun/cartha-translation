  source_fidelity: В целом перевод точно передаёт изнеможение двухсот и их оставление у Бесора, выход навстречу Давиду и сопровождавшим его людям, а также идиому вопроса о благополучии. Однако «воинам» сужает еврейское אֲנָשִׁים («людям, мужчинам»), тогда как исходный текст не называет их здесь воинами. Кроме того, «к ним» после упоминания и Давида, и людей с ним создаёт в русском тексте ненужную неясность, хотя еврейское הָעָם относится именно к двумстам оставленным людям.
  naturalness: Текст в целом современный и литературный. Замена «воинам» на «людям» сохраняет естественность и снимает неоправданное уточнение. Повтор «к этим людям» в третьем предложении лучше проясняет смену референта, чем местоимение «к ним».
