translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Слово «воины» уточняет подразумеваемую контекстом принадлежность двухсот человек к отряду Давида; последующее «люди» сохраняет более широкое значение עָם. Повтор имени Давида в обороте «идти за Давидом» заменён местоимением ради естественности русского текста без утраты референции.
