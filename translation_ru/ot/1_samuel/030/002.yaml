  source_fidelity: 'Перевод точно передаёт последовательность и основные значения еврейского текста: военный захват в плен, женщин, находившихся в городе, всеохватную идиому «от мала до велика», отсутствие убийств, принудительное уведение пленников и уход нападавших своим путём. «Никого» корректно передаёт неопределённое אִישׁ, не ограничивая смысл взрослыми мужчинами.'
