base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/002.yaml
  text: They took captive the women who were in it[a], from small to great. They did not kill anyone, but led them away and went on their way.
translation:
  language: ru
  text: Они взяли в плен женщин, находившихся в ней, — от мала до велика[a]. Никого они не убили, а увели их и отправились своим путём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от младшего до старшего». Еврейское выражение «от малого до великого» может обозначать всех без исключения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: взяли в плен
  rationale: Глагол שׁבה обозначает захват людей в плен во время военных действий; выбранное выражение естественно по-русски и сохраняет этот смысл.
- source_word: הַנָּשִׁים
  choice: женщин
  rationale: Обычное значение существительного — «женщины». Хотя в контексте среди них были жёны жителей Секелага, более узкое «жёны» не передаёт всей широты еврейского слова.
- source_word: אֲשֶׁר בָּהּ
  choice: находившихся в ней
  rationale: Местоимение женского рода отсылает к упомянутому в предыдущем стихе городу; русский женский род сохраняет эту отсылку.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: от мала до велика
  rationale: Устойчивое русское выражение близко еврейской идиоме и передаёт полный охват без исключения, не сводя смысл однозначно только к возрасту.
- source_word: לֹא הֵמִיתוּ אִישׁ
  choice: Никого они не убили
  rationale: אִישׁ употреблено в неопределённом смысле «кто-либо», а не исключительно об adult мужчине; «никого» точно и естественно передаёт эту функцию.
- source_word: וַיִּנְהֲגוּ
  choice: увели их
  rationale: נהג означает вести или гнать; контекст пленения указывает на принудительное перемещение, а местоимение восполняет подразумеваемое дополнение.
- source_word: וַיֵּלְכוּ לְדַרְכָּם
  choice: отправились своим путём
  rationale: Выражение передаёт еврейскую идиому об уходе и продолжении пути на современном литературном русском языке.
