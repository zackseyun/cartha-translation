  text: и тем, кто в Ароэре, и тем, кто в Сифмофе, и тем, кто в Ештемоа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: и тем, кто
  rationale: Повторяющееся сочетание союза, предлога и относительной частицы буквально указывает на отдельных получателей. В данном перечне естественная русская передача — «и тем, кто», причём местонахождение выражено следующим оборотом с названием города.
- source_word: בַּעֲרֹעֵר
  choice: в Ароэре
  rationale: Предлог בְּ имеет здесь местное значение; название города передано транслитерацией и поставлено в предложный падеж.
- source_word: בְּשִׂפְמוֹת
  choice: в Сифмофе
  rationale: Название места שִׂפְמוֹת передано русской библейской транслитерацией «Сифмоф»; предлог выражает местонахождение.
- source_word: בְּאֶשְׁתְּמֹעַ
  choice: в Эштемоа
  rationale: Название места транслитерировано как «Эштемоа»; несклоняемая форма сохраняет узнаваемость еврейского топонима, а предлог передаёт местное значение.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением троекратного параллельного оборота оригинала. Повтор «и тем, кто» не сглажен, поскольку он выделяет получателей в каждом отдельном городе.
