  text: וַ/יַּ֜עַן כָּל אִֽישׁ רָ֣ע וּ/בְלִיַּ֗עַל מֵֽ/הָ/אֲנָשִׁים֮ אֲשֶׁ֣ר הָלְכ֣וּ עִם דָּוִד֒ וַ/יֹּאמְר֗וּ יַ֚עַן אֲשֶׁ֣ר לֹֽא הָלְכ֣וּ עִמִּ֔/י לֹֽא נִתֵּ֣ן לָ/הֶ֔ם מֵ/הַ/שָּׁלָ֖ל אֲשֶׁ֣ר הִצַּ֑לְנוּ כִּֽי אִם אִ֤ישׁ אֶת אִשְׁתּ/וֹ֙ וְ/אֶת בָּנָ֔י/ו וְ/יִנְהֲג֖וּ וְ/יֵלֵֽכוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/022.yaml
  text: Then every wicked and worthless man from among the men who had gone with David answered and said[a], “Because they did not go with me, we will not give them any of the spoil that we recovered[c][b], except that each man may take his wife and his children and lead them away and go.”
translation:
  language: ru
  text: 'Тогда все злые и негодные[a] люди из числа ходивших с Давидом возразили: «Поскольку они не пошли со мной[b], мы не дадим им ничего из добычи[c], которую мы отбили. Разве что каждый заберёт свою жену и детей, уведёт их и уйдёт».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беззаконные». Еврейское слово здесь служит отрицательной характеристикой, а не именем собственным «Велиал».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «со мной». Хотя говорит группа, в еврейском тексте здесь стоит единственное число, а далее — «мы не дадим».'
    reason: source_ambiguity
  - marker: c
    text: 'Или: «из награбленного».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: возразили
  rationale: В данном контексте сочетание глаголов вводит реплику несогласия. Русское «возразили» естественно передаёт её функцию, не воспроизводя тяжеловесное «ответили и сказали».
- source_word: כָּל אִישׁ רָע וּבְלִיַּעַל
  choice: все злые и негодные люди
  rationale: רָע указывает на нравственную порочность, а בְלִיַּעַל здесь характеризует людей как негодных, низких; это не имя собственное.
- source_word: מֵהָאֲנָשִׁים אֲשֶׁר הָלְכוּ עִם דָּוִד
  choice: из числа ходивших с Давидом
  rationale: Передаёт партитивное значение מִן и принадлежность говоривших к отряду Давида естественным русским оборотом.
- source_word: יַעַן אֲשֶׁר
  choice: за то, что
  rationale: Выражает названное говорившими основание отказа и в прямой речи звучит естественнее буквального «поскольку».
- source_word: לֹא הָלְכוּ עִמִּי
  choice: они не пошли со мной
  rationale: Сохранено первое лицо единственного числа еврейского текста, несмотря на то что далее говорящие употребляют множественное число.
- source_word: לֹא נִתֵּן לָהֶם מֵהַשָּׁלָל
  choice: мы не дадим им ничего из добычи
  rationale: Отрицательная конструкция с партитивным מִן естественно передана как «ничего из»; שָׁלָל означает военную добычу.
- source_word: אֲשֶׁר הִצַּלְנוּ
  choice: которую мы отбили
  rationale: В контексте возвращения имущества, захваченного налётчиками, «отбили» точно передаёт результат действия נצל в породе hифиль.
- source_word: כִּי אִם
  choice: разве что
  rationale: Сочетание вводит единственное исключение из отказа.
- source_word: אִישׁ אֶת אִשְׁתּוֹ וְאֶת בָּנָיו
  choice: каждый заберёт свою жену и детей
  rationale: אִישׁ употреблено распределительно; בָּנָיו в семейном контексте естественно передаётся обобщающим «детей». Глагол «заберёт» восполнен по смыслу следующего נהג.
- source_word: וְיִנְהֲגוּ וְיֵלֵכוּ
  choice: уведёт их и уйдёт
  rationale: 'Сохранены оба действия: увести освобождённых членов семьи и покинуть место.'
theological_decisions:
- issue: Значение בְלִיַּעַל
  choice: негодные
  alternative: беззаконные; Велиар
  rationale: Здесь слово является нарицательной отрицательной характеристикой людей. Передача именем «Велиар» неоправданно привнесла бы более позднюю персонификацию, а «беззаконные» чрезмерно сужает возможный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Прямая речь звучит резко и естественно; еврейское чередование единственного и множественного лица сохранено и пояснено сноской.
