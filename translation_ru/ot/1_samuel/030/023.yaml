  text: וַ/יֹּ֣אמֶר דָּוִ֔ד לֹֽא תַעֲשׂ֥וּ כֵ֖ן אֶחָ֑/י אֵ֠ת אֲשֶׁר נָתַ֨ן יְהוָ֥ה לָ֨/נוּ֙ וַ/יִּשְׁמֹ֣ר אֹתָ֔/נוּ וַ/יִּתֵּ֗ן אֶֽת הַ/גְּד֛וּד הַ/בָּ֥א עָלֵ֖י/נוּ בְּ/יָדֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/023.yaml
  text: But David said[a], “You must not do so, my brothers, with what Yahweh has given us[c][b]. He has preserved us and has given into our hand the raiding band that came against us.”
translation:
  language: ru
  text: 'Но Давид сказал: «Не поступайте так, братья мои, с тем, что дал нам Яхве. Он сохранил нас и отдал в наши руки отряд, выступивший против нас».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ כֵן
  choice: Не поступайте так
  rationale: Прямая форма запрета во множественном числе естественно и точно передаётся современным русским императивом.
- source_word: אֶחָי
  choice: братья мои
  rationale: Сохранено буквальное братское обращение Давида к своим воинам; порядок слов поддерживает достойный библейский регистр без архаизации.
- source_word: אֵת אֲשֶׁר נָתַן יְהוָה לָנוּ
  choice: с тем, что дал нам Яхве
  rationale: Сжатая еврейская конструкция вводит предмет обсуждаемого поступка — дарованную Богом добычу. Русское «с тем, что» сохраняет эту связь, не конкретизируя её сверх текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: וַיִּשְׁמֹר אֹתָנוּ
  choice: Он сохранил нас
  rationale: Глагол שׁמר здесь означает охрану, благодаря которой люди остались невредимы; «сохранил» передаёт как защиту, так и её результат.
- source_word: וַיִּתֵּן
  choice: отдал
  rationale: В сочетании с «в наши руки» глагол естественно выражает передачу врага под власть Давида и его людей.
- source_word: הַגְּדוּד
  choice: отряд
  rationale: В контексте речь идёт о вражеском отряде налётчиков. Краткое «отряд» звучит естественно, тогда как характер его действий уже известен из контекста главы.
- source_word: הַבָּא עָלֵינוּ
  choice: выступивший против нас
  rationale: Передаёт враждебную направленность выражения בוא על, не сводя его лишь к факту нападения.
- source_word: בְּיָדֵנוּ
  choice: в наши руки
  rationale: Русский устойчивый оборот сохраняет еврейский образ руки как власти и контроля; множественное число естественно при местоимении «наши».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Божье участие в победе
  choice: «сохранил нас и отдал в наши руки»
  alternative: «защитил нас и предал нам»
  rationale: 'Формулировка сохраняет два отдельных утверждения Давида: Бог уберёг людей и дал им власть над вражеским отрядом, не усиливая и не ослабляя богословский акцент.'
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Сохранены братское обращение, личное имя Яхве и образ передачи врага «в руки»; устранены ненужные архаизмы.
