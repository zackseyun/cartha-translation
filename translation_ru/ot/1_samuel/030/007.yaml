base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/007.yaml
  text: Then David said to Abiathar the priest[a], the son of Ahimelech[b], “Please bring me the ephod.” So Abiathar brought the ephod to David.
translation:
  language: ru
  text: 'Тогда Давид сказал священнику Авиафару, сыну Ахимелеха: «Принеси мне, пожалуйста, эфод[a]». И Авиафар принёс эфод Давиду.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфод — особый священнический предмет или облачение, использовавшийся в богослужении Израиля.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: הַכֹּהֵן
  choice: священнику
  rationale: Определённое наименование служения Авиафара естественно передаётся русским словом «священник».
- source_word: בֶּן אֲחִימֶלֶךְ
  choice: сыну Ахимелеха
  rationale: Сопряжённая конструкция обозначает родство; форма дательного падежа согласована с приложением «священнику Авиафару».
- source_word: הַגִּישָׁה נָּא לִי
  choice: Принеси, пожалуйста, мне
  rationale: Побудительная порода глагола נגשׁ означает «поднести, принести», а частица נָא смягчает просьбу; такой порядок слов сохраняет акцент на адресате לִי и звучит естественно.
- source_word: הָאֵפֹד
  choice: эфод
  rationale: Специфический израильский культовый термин не имеет точного русского эквивалента, поэтому сохранена традиционная транслитерация.
- source_word: וַיַּגֵּשׁ
  choice: И ... принёс
  rationale: Форма того же корня обозначает исполнение просьбы; «принёс» ясно и естественно передаёт действие в данном контексте.
- source_word: אֶל דָּוִד
  choice: Давиду
  rationale: Предлог обозначает направленность к Давиду; русский дательный падеж передаёт её без тяжеловесного «к Давиду».
theological_decisions:
- issue: Значение אֵפוֹד как священного предмета, связанного со священническим служением и последующим вопрошанием Бога
  choice: Сохранить термин «эфод» в основном тексте
  alternative: священническое облачение; священный предмет
  rationale: Точная форма и функция предмета в этом стихе не разъясняются. Транслитерация сохраняет историко-религиозную конкретность и не сводит эфод исключительно к одежде или орудию вопрошания.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Просительная частица передана вежливым «пожалуйста»; специфический культовый термин сохранён и кратко пояснён в сноске.
