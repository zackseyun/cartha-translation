  yaml_path: translation/ot/1_samuel/030/030.yaml
  text: and to those in Hormah[a], and to those in Bor-ashan, and to those in Athach.
translation:
  language: ru
  text: и тем, кто в Хорме, и тем, кто в Бор-Ашане[a], и тем, кто в Атахе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Бор-Ашан — название места; буквально его части могут означать «колодец (или яма) дыма».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: и тем, кто
  rationale: Сочетание союза ו, предлога ל и относительного אֲשֶׁר в перечне получателей естественно передаётся как «и тем, кто»; дательный смысл и относительная конструкция сохранены.
- source_word: בְּחָרְמָה
  choice: в Хорме
  rationale: Топоним חָרְמָה передан транслитерацией, а предлог ב — русским локативным «в».
- source_word: בְּבוֹר עָשָׁן
  choice: в Бор-Ашане
  rationale: Двухчастный топоним передан транслитерацией и оформлен через дефис как единое название; буквальное значение компонентов не подставляется в основной текст.
- source_word: בַּעֲתָךְ
  choice: в Атахе
  rationale: Топоним עֲתָךְ передан транслитерацией; предлог ב выражен локативным «в», а окончание адаптировано к русскому склонению.
