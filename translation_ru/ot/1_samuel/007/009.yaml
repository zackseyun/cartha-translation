base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/009.yaml
  text: So Samuel took one nursing lamb and offered it as a whole burnt offering to Yahweh. And Samuel cried out to Yahweh on behalf of Israel[a], and Yahweh answered him.
translation:
  language: ru
  text: И взял Самуил одного ягнёнка, ещё питавшегося молоком[a], и принёс его Яхве во всесожжение целиком. Затем Самуил воззвал к Яхве за Израиль, и Яхве ответил ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одного молочного ягнёнка»; имеется в виду ягнёнок, который ещё кормился молоком.'
    reason: Уточняет буквальный образ еврейского выражения и возраст жертвенного животного.
lexical_decisions:
- source_word: טְלֵה חָלָב אֶחָד
  choice: одного ягнёнка, ещё питавшегося молоком
  rationale: Передаёт значение молодого ягнёнка, который всё ещё кормится молоком, ясно и естественно для современного русского читателя.
- source_word: וַיַּעֲלֵה
  choice: принёс
  rationale: 'В породе гифиль глагол עלה здесь является обычным жертвенным термином: принести жертву; контекст всесожжения делает значение однозначным.'
- source_word: עוֹלָה כָּלִיל
  choice: как жертву всесожжения, сжигаемую целиком
  rationale: «Жертва всесожжения» передаёт устойчивое культовое значение עוֹלָה, а «сжигаемую целиком» отдельно сохраняет усиление כָּלִיל.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя יְהוָה передано транслитерацией «Яхве», а дательный смысл предлога ל выражен русской конструкцией «принёс Яхве».
- source_word: וַיִּזְעַק
  choice: воззвал
  rationale: Глагол זעק обозначает настойчивый, исполненный нужды призыв; «воззвал» сохраняет силу выражения и соответствует возвышенному повествовательному регистру.
- source_word: בְּעַד יִשְׂרָאֵל
  choice: за Израиль
  rationale: Кратко и естественно передаёт ходатайственное значение בְּעַד, не добавляя в основной текст прямого обозначения молитвы.
- source_word: וַיַּעֲנֵהוּ יְהוָה
  choice: и Яхве ответил ему
  rationale: Сохраняет явное местоименное дополнение еврейского текста и последовательность повествования.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное заветное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Характер обращения Самуила
  choice: воззвал к Яхве за Израиль
  alternative: помолился Яхве за Израиль
  rationale: «Воззвал» точнее сохраняет интенсивность זעק и не сводит более широкий глагол обращения за помощью к пояснительному «помолился».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис сделан естественным для русского повествования; культовые термины сохранены без конфессиональных добавлений.
