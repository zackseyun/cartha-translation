  text: וַ/יִּקָּבְצ֣וּ הַ֠/מִּצְפָּתָ/ה וַ/יִּֽשְׁאֲבוּ מַ֜יִם וַֽ/יִּשְׁפְּכ֣וּ לִ/פְנֵ֣י יְהוָ֗ה וַ/יָּצ֨וּמוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא וַ/יֹּ֣אמְרוּ שָׁ֔ם חָטָ֖אנוּ לַ/יהוָ֑ה וַ/יִּשְׁפֹּ֧ט שְׁמוּאֵ֛ל אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/מִּצְפָּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/006.yaml
  text: So they gathered at Mizpah[a], drew water, and poured it out before Yahweh. They fasted on that day and said there[c][b], “We have sinned against Yahweh.” And Samuel judged the sons of Israel at Mizpah.
translation:
  language: ru
  text: 'И собрались они в Мицпе[a], зачерпнули воды и вылили её перед Яхве[b]. В тот день они постились и говорили там: «Мы согрешили против Яхве». И Самуил судил израильтян[c] в Мицпе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В первом упоминании еврейская форма имеет направительное окончание; возможно: «собрались в Мицпу».'
    reason: lexical_alternative
  - marker: b
    text: Выливание воды перед Яхве — обрядовое действие, вероятно связанное с покаянием или плачем, однако сам текст прямо не объясняет его символику.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: собрались
  rationale: Форма нифаль передаёт самостоятельное совместное собирание людей; «собрались» естественно и точно выражает это значение.
- source_word: הַמִּצְפָּתָה / בַּמִּצְפָּה
  choice: в Мицпе
  rationale: Название передано близко к еврейскому произношению. В первом случае направительный суффикс допускает перевод «в Мицпу», однако по-русски после «собрались» естественно обозначить место собрания; заключительная форма прямо означает пребывание в Мицпе.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: зачерпнули воды
  rationale: Глагол שׁאב обычно означает черпать воду. Родительный формы «воды» естественен при обозначении некоторого количества.
- source_word: וַיִּשְׁפְּכוּ לִפְנֵי יְהוָה
  choice: вылили её перед Яхве
  rationale: Местоимение «её» восполняет явно подразумеваемый объект — воду; לִפְנֵי буквально обозначает действие перед лицом или в присутствии Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: וַיָּצוּמוּ בַּיּוֹם הַהוּא
  choice: В тот день они постились
  rationale: Прямой и естественный перевод глагола צום и временного оборота.
- source_word: חָטָאנוּ לַיהוָה
  choice: Мы согрешили против Яхве
  rationale: Глагол חטא с ל здесь выражает грех, совершённый против кого-либо; прошедшее время естественно для исповедания совершённого проступка.
- source_word: וַיִּשְׁפֹּט
  choice: судил
  rationale: Сохраняет широкий смысл שׁפט — вершить суд и исполнять обязанности судьи или правителя, не сводя действие лишь к управлению.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: израильтян
  rationale: Буквально «сынов Израиля», но в данном контексте выражение коллективно обозначает народ; «израильтян» понятно современному русскому читателю и не ограничивает референт мужчинами.
theological_decisions:
- issue: Значение обряда выливания воды
  choice: Передать действие буквально, не объясняя его символику в основном тексте.
  alternative: Истолковать его как знак покаяния, плача либо самоотречения.
  rationale: Сам стих не объясняет значения обряда; конкретное толкование в основном тексте устранило бы сохранённую источником неоднозначность.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, представленное в еврейском тексте, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся простым и повествовательным; архаизмы вроде «пред» и чрезмерно буквальное «сыны Израиля» в основном тексте не используются. Имя Мицпа передано ближе к еврейской форме, а не в традиционной русской форме «Массифа».
