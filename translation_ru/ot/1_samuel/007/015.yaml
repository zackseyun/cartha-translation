  text: И Самуил судил Израиль во все дни своей жизни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был судьёй Израиля», «управлял Израилем» или «руководил Израилем как судья»; еврейский глагол включает судебный и управленческий оттенки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: был судьёй
  rationale: Глагол שׁפט в данном контексте обозначает исполнение обязанностей судьи, включая судебное руководство народом. Такое соответствие сохраняет характерную для книги Судей и 1 Царств роль, не сужая смысл до отдельных судебных решений и не заменяя его более общим «управлял».
- source_word: שְׁמוּאֵל
  choice: Самуил
  rationale: Традиционная и общепринятая русская форма библейского имени.
- source_word: אֶת יִשְׂרָאֵל
  choice: Израиля
  rationale: Еврейский показатель прямого дополнения отдельно не переводится; при конструкции «был судьёй» объект естественно передаётся родительным падежом.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: во все дни своей жизни
  rationale: Передаёт весь период жизни Самуила и сохраняет образность еврейского выражения; возвратное местоимение «своей» естественно соотносит жизнь с подлежащим.
theological_decisions:
- issue: Объём значения судейства Самуила
  choice: был судьёй Израиля
  alternative: судил Израиль; управлял Израилем; руководил Израилем как судья
  rationale: Формулировка сохраняет судебный и правительственный оттенки роли שׁפט, не сводя её ни только к вынесению решений, ни только к политическому управлению.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской ритмикой. Выражение «во все дни своей жизни» намеренно сохраняет форму исходного текста, оставаясь понятным современному читателю.
