base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/001.yaml
  text: Then the men of Kiriath-jearim came and brought up the ark of Yahweh[a], and they brought it into the house of Abinadab on the hill[b]. And they consecrated Eleazar his son to keep the ark of Yahweh.
translation:
  language: ru
  text: Мужчины из Кириаф-Иарима пришли, подняли ковчег Яхве[a] и внесли его в дом Авинадава на холме[b]. Его сына Елеазара они посвятили охранять ковчег Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит Божье имя יהוה (YHWH), переданное как «Яхве»; во многих переводах — «Господь».
    reason: lexical_alternative
  - marker: b
    text: 'Или, если בַּגִּבְעָה понимать как название места: «в Гиве».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ אַנְשֵׁי קִרְיַת יְעָרִים
  choice: Жители Кириаф-Иарима пришли
  rationale: Сочетание אַנְשֵׁי с названием города обозначает мужчин, принадлежавших к его общине; в современном русском «жители» естественно передаёт эту группу без архаичного «мужи». Глагол בוא сохраняет обычное повествовательное значение «пришли».
- source_word: וַיַּעֲלוּ
  choice: подняли
  rationale: Форма от עלה выражает движение вверх или перенос на возвышенное место. «Подняли» сохраняет направительный оттенок, который исчез бы при нейтральном «перенесли».
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: אֲרוֹן в данном священном контексте традиционно и точно передаётся словом «ковчег»; личное имя יהוה транслитерировано как «Яхве».
- source_word: וַיָּבִאוּ אֹתוֹ אֶל בֵּית אֲבִינָדָב
  choice: и внесли его в дом Авинадава
  rationale: Глагол בוא в каузативной форме означает «принести/внести», а אֶל указывает место назначения. «Внесли ... в дом» естественно выражает перемещение внутрь.
- source_word: בַּגִּבְעָה
  choice: на холме
  rationale: Форма с артиклем наиболее прямо читается как нарицательное «на холме», хотя возможно понимание Гива как названия места.
- source_word: וְאֶת אֶלְעָזָר בְּנוֹ קִדְּשׁוּ
  choice: А его сына Елеазара они посвятили
  rationale: Местоимение «его» сохраняет структуру еврейского текста и естественно относится к Авинадаву. «Посвятили» передаёт קדשׁ как отделение человека для священного служения.
- source_word: לִשְׁמֹר
  choice: чтобы он охранял
  rationale: שׁמר здесь означает хранить и оберегать ковчег. «Охранял» яснее современному читателю передаёт порученную Елеазару обязанность, чем двусмысленное «хранил».
theological_decisions:
- issue: Передача личного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация «Яхве» показывает, что в еврейском тексте стоит собственное имя Бога, и не подменяет его титулом. В примечании указана распространённая переводческая передача.
- issue: 'Статус בַּגִּבְעָה: нарицательное слово или топоним'
  choice: на холме
  alternative: в Гиве
  rationale: Наличие артикля и обычное значение גִּבְעָה поддерживают нарицательное понимание. Возможное топонимическое прочтение сохранено в примечании без навязывания географической идентификации.
- issue: Характер посвящения Елеазара
  choice: посвятили
  alternative: отделили; освятили
  rationale: Глагол קדשׁ обозначает отделение для священной обязанности. «Посвятили» сохраняет культовый смысл, не уточняя не названный в тексте обряд или священнический статус.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для широкого читателя; при этом сохранены движение вверх, повтор названия ковчега и неоднозначность слова בַּגִּבְעָה.
