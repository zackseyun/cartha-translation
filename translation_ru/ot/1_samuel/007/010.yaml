source:
  edition: WLC
  text: וַ/יְהִ֤י שְׁמוּאֵל֙ מַעֲלֶ֣ה הָ/עוֹלָ֔ה וּ/פְלִשְׁתִּ֣ים נִגְּשׁ֔וּ לַ/מִּלְחָמָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יַּרְעֵ֣ם יְהוָ֣ה בְּ/קוֹל גָּ֠דוֹל בַּ/יּ֨וֹם הַ/ה֤וּא עַל פְּלִשְׁתִּים֙ וַ/יְהֻמֵּ֔/ם וַ/יִּנָּגְפ֖וּ לִ/פְנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/010.yaml
  text: And as Samuel was offering up the burnt offering[a], the Philistines drew near for battle against Israel. But Yahweh thundered with a great sound on that day against the Philistines and threw them into confusion, and they were defeated before Israel.
translation:
  language: ru
  text: Пока Самуил возносил всесожжение, филистимляне приблизились, чтобы вступить в бой против Израиля. Но в тот день Яхве обрушил на филистимлян сильный гром[a], привёл их в смятение, и они были разбиты перед Израилем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «великим звуком»; возможно также: «мощным громом» или «великим шумом».'
    reason: Лексема קוֹל может означать голос, звук или шум; в сочетании с глаголом רעם контекст указывает на гром, однако буквальное выражение несколько шире.
lexical_decisions:
- source_word: מַעֲלֶה
  choice: возносил
  rationale: Причастие породы hифиль от עלה обозначает совершавшееся в тот момент принесение жертвы; несовершенный вид передаёт длительность действия и сохраняет связь с традиционным русским выражением «возносить жертву».
- source_word: הָעוֹלָה
  choice: всесожжение
  rationale: עֹלָה — установленное обозначение жертвы, целиком сжигаемой на жертвеннике; «всесожжение» точно и привычно передаёт эту жертвенную категорию.
- source_word: נִגְּשׁוּ לַמִּלְחָמָה
  choice: приблизились, чтобы вступить в бой
  rationale: Сочетание глагола приближения с לַמִּלְחָמָה выражает военное намерение. Развёрнутая формулировка звучит естественно по-русски.
- source_word: בְּיִשְׂרָאֵל
  choice: с Израилем
  rationale: Предлог ב в данном военном контексте обозначает противостоящую сторону; русское «вступить в бой с Израилем» естественно выражает враждебный смысл.
- source_word: וַיַּרְעֵם
  choice: прогремел
  rationale: Глагол רעם означает греметь, как гром. «Прогремел» прямо передаёт внезапное Божье действие в повествовании.
- source_word: בְּקוֹל גָּדוֹל
  choice: могучим громом
  rationale: Буквально выражение означает «великим/сильным звуком». В сочетании с רעם контекстуальное «могучим громом» естественно по-русски, а буквальная широта отмечена в сноске.
- source_word: וַיְהֻמֵּם
  choice: привёл их в смятение
  rationale: Каузативная форма от המם описывает вызванные Богом панику и дезорганизацию. Этот перевод не смешивает смятение с последующим поражением.
- source_word: וַיִּנָּגְפוּ
  choice: они были разбиты
  rationale: Нифаль от נגף в военном контексте означает потерпеть поражение; «были разбиты» передаёт результат, не утверждая полного истребления.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: перед Израилем
  rationale: Сохранён древнееврейский военный оборот, обозначающий поражение перед лицом противника; он понятен и приемлем в литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога, записанное тетраграмматоном, передано распространённой русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. «Яхве» сохраняет его как имя и отражает наиболее принятую научную реконструкцию произношения, не подменяя имя титулом.
- issue: Характер Божьего воздействия на филистимлян
  choice: Яхве вызвал смятение громом, после чего филистимляне были разбиты
  alternative: Яхве непосредственно истребил или полностью разгромил их
  rationale: В тексте различены причинённое Богом смятение (וַיְהֻמֵּם) и последовавшее поражение (וַיִּנָּגְפוּ). Перевод сохраняет эту последовательность и не усиливает степень поражения.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис упрощён без утраты последовательности действий; устаревшие формы избегаются. Маркер сноски поставлен при выражении בְּקוֹל גָּדוֹל, к которому она относится.
