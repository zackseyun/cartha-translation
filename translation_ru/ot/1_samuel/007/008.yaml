base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/008.yaml
  text: Then the sons of Israel said to Samuel[a], “Do not be silent for us from crying out to Yahweh our God, that he may save us from the hand of the Philistines.”
translation:
  language: ru
  text: 'И сказали израильтяне Самуилу: «Не умолкай[a], взывая за нас к Яхве, нашему Богу, чтобы Он спас нас из рук филистимлян».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв. еврейский оборот: «не молчи для нас от взывания к Яхве, Богу нашему». По смыслу: «Не переставай взывать за нас к Яхве, нашему Богу».'
    reason: Еврейское выражение сохраняет образ молчания; в данном контексте это просьба не прекращать ходатайственное взывание.
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: израильтяне
  rationale: Естественная современная передача устойчивого еврейского обозначения народа Израиля; буквальное «сыны Израиля» в современном русском звучит архаично и может быть понято как указание только на мужчин.
- source_word: אַל תַּחֲרֵשׁ
  choice: Не умолкай
  rationale: Сохраняет образ молчания, выраженный глаголом חרשׁ, и при этом естественно вводит просьбу продолжать молитвенное взывание.
- source_word: מִמֶּנּוּ
  choice: за нас
  rationale: Передаёт смысл ходатайства от имени и ради израильтян; пространственное «от нас» здесь не соответствует контексту.
- source_word: מִזְּעֹק
  choice: взывая
  rationale: זעק обозначает настойчивый крик о помощи; «взывать» сохраняет интенсивность и подходит к молитвенному обращению к Богу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵינוּ
  choice: нашему Богу
  rationale: Прямая передача формы с местоименным суффиксом, сохраняющая обращение к Богу Израиля как к «нашему Богу».
- source_word: וְיֹשִׁעֵנוּ
  choice: чтобы Он спас нас
  rationale: В данном контексте союз и глагольная форма выражают ожидаемую цель или результат взывания Самуила.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: из рук филистимлян
  rationale: Сохраняет еврейский образ руки как власти и силы; русское множественное «из рук» идиоматично при обозначении группы людей.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; «Яхве» сохраняет его как имя, тогда как «Господь» является традиционной заменой титулом.
- issue: Связь спасения с ходатайством Самуила
  choice: «чтобы Он спас нас» как цель или ожидаемый результат взывания
  alternative: «и Он спасёт нас» как прямое обещание результата
  rationale: Еврейская форма допускает целевое или результативное понимание, но не требует превращать просьбу израильтян в безусловное утверждение о будущем.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Израильтяне» выбрано вместо архаичного «сыны Израиля»; «не умолкай, взывая» сохраняет исходный образ без неестественной русской конструкции. Местоимение «Он» написано с прописной буквы как издательская норма благоговейного регистра, не меняющая смысла текста.
