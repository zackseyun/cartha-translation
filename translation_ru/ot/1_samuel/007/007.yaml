base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/007.yaml
  text: When the Philistines heard that the sons of Israel had gathered at Mizpah[a], the rulers of the Philistines went up against Israel. When the sons of Israel heard it[b], they were afraid because of the Philistines.
translation:
  language: ru
  text: Когда филистимляне услышали, что сыны Израиля собрались в Мицпе[a], правители филистимлян выступили против Израиля. Услышав об этом, сыны Израиля испугались филистимлян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собрались в Мицпу». Еврейская форма названия содержит окончание, указывающее направление, хотя по контексту народ уже собрался там.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: услышали / услышав об этом
  rationale: Обычное повествовательное значение שׁמע. Во втором случае подразумеваемое известие о выступлении филистимлян выражено местоимением «об этом» ради естественности русского синтаксиса.
- source_word: הִתְקַבְּצוּ
  choice: собрались
  rationale: Возвратная форма точно и естественно передаёт хитпаэль со значением совместного собирания.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет устойчивое образное обозначение народа и формальную связь с еврейским выражением, оставаясь понятным в библейском литературном регистре.
- source_word: הַמִּצְפָּתָה
  choice: в Мицпе
  rationale: Направительное окончание допускает значение движения «в Мицпу», однако при глаголе собрания контекст естественно указывает на место, где собрался народ.
- source_word: וַיַּעֲלוּ
  choice: выступили
  rationale: В военном контексте עלה обозначает движение войска против противника; «выступили» передаёт это естественно, не добавляя указания на конкретный способ наступления.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: правители филистимлян
  rationale: Термин обозначает особых политико-военных властителей филистимских городов; нейтральное «правители» понятно современному читателю.
- source_word: אֶל יִשְׂרָאֵל
  choice: против Израиля
  rationale: Предлог אֶל буквально указывает направление, но при военном выступлении выражает враждебное движение против Израиля.
- source_word: וַיִּירְאוּ מִפְּנֵי פְלִשְׁתִּים
  choice: испугались филистимлян
  rationale: Естественно передаёт страх, вызванный филистимлянами, без буквального воспроизведения еврейской идиомы «от лица».
