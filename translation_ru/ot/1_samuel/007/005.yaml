  text: Then Samuel said[a], “Gather all Israel to Mizpah, and I will pray to Yahweh on your behalf.”
translation:
  language: ru
  text: 'Тогда Самуил сказал: «Соберите весь Израиль в Мицпу, и я помолюсь за вас Яхве».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Форма с повествовательным וַ־ продвигает рассказ; «тогда» естественно передаёт последовательность событий.
- source_word: שְׁמוּאֵל
  choice: Самуил
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: קִבְצוּ
  choice: Соберите
  rationale: Повелительная форма множественного числа означает созыв народа в одно место; «соберите» ясно и естественно передаёт этот смысл.
- source_word: כָּל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Сохранено собирательное обозначение всего народа.
- source_word: הַמִּצְפָּתָה
  choice: в Мицпе
  rationale: Направительный суффикс указывает на движение к месту. После русского «соберите» направление естественно выражается конструкцией «в Мицпе», то есть собрать людей туда.
- source_word: וְאֶתְפַּלֵּל
  choice: и я помолюсь
  rationale: Имперфект первого лица после повеления выражает последующее намерение Самуила.
- source_word: בַּעַדְכֶם
  choice: за вас
  rationale: Краткое и естественное русское выражение ходатайственной молитвы от имени и ради других.
- source_word: אֶל יְהוָה
  choice: Яхве
  rationale: 'Предлог אֶל при глаголе молитвы в русском передаётся управлением без отдельного предлога: «помолюсь Яхве». Имя יהוה передано как «Яхве», сохраняя личное Божье имя исходного текста.'
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: В еврейском тексте прямо стоит тетраграмматон, поэтому транслитерация «Яхве» сохраняет различие между личным именем и титулом «Господь», не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксис краткий и доступный; обращение Самуила передано прямой речью.
