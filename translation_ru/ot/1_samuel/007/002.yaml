  text: וַ/יְהִ֗י מִ/יּ֞וֹם שֶׁ֤בֶת הָֽ/אָרוֹן֙ בְּ/קִרְיַ֣ת יְעָרִ֔ים וַ/יִּרְבּוּ֙ הַ/יָּמִ֔ים וַ/יִּֽהְי֖וּ עֶשְׂרִ֣ים שָׁנָ֑ה וַ/יִּנָּה֛וּ כָּל בֵּ֥ית יִשְׂרָאֵ֖ל אַחֲרֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/002.yaml
  text: From the day the ark remained at Kiriath-jearim[a], the days became many, and they were twenty years[b]; and all the house of Israel lamented after Yahweh.
translation:
  language: ru
  text: С того дня, как ковчег остался в Кириат-Иариме, прошло много времени — двадцать лет. И весь дом Израиля скорбел по Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение буквально означает «скорбел (или стенал) вслед за Яхве»; оно может передавать также тоску по Яхве или скорбное обращение к нему.
    reason: Сохранение неоднозначности редкого глагола נהה и сочетания с אַחֲרֵי.
lexical_decisions:
- source_word: שֶׁבֶת הָאָרוֹן
  choice: ковчег остался
  rationale: Инфинитив от ישׁב при ковчеге обозначает его продолжительное пребывание в данном месте. «Остался» естественно передаёт это по-русски, не приписывая предмету буквального «жительства».
- source_word: בְּקִרְיַת יְעָרִים
  choice: в Кириат-Иариме
  rationale: Название места передано принятой русской транслитерацией; предлог ב обозначает местонахождение.
- source_word: וַיִּרְבּוּ הַיָּמִים וַיִּהְיוּ עֶשְׂרִים שָׁנָה
  choice: прошло много времени — двадцать лет
  rationale: Буквальный образ «дни умножились, и их стало двадцать лет» является еврейским способом обозначить длительное течение времени. Русская формулировка сохраняет усиление и прямо указывает названный срок.
- source_word: וַיִּנָּהוּ
  choice: скорбел
  rationale: Редкий глагол נהה выражает скорбь, плач или стенание. «Скорбел» передаёт основное значение, не сводя его ни только к желанию, ни к уже завершившемуся покаянию.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: весь дом Израиля
  rationale: Сохранён библейский собирательный образ народа как «дома Израиля», а не заменён более общим «весь Израиль».
- source_word: אַחֲרֵי יְהוָה
  choice: по Яхве
  rationale: Сочетание буквально содержит «вслед за / после Яхве», но в данном контексте может выражать скорбное стремление к нему. Русское «скорбел по Яхве» сохраняет связь скорби с тоской и направленностью к Богу, а неоднозначность разъяснена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
theological_decisions:
- issue: Значение выражения וַיִּנָּהוּ ... אַחֲרֵי יְהוָה
  choice: «скорбел по Яхве» — скорбь, соединённая с устремлением к нему
  alternative: «тосковал по Яхве»; «со скорбью обратился к Яхве»; «оплакивал перед Яхве»
  rationale: Глагол указывает на скорбь или стенание, а אַחֲרֵי придаёт направленность «вслед за» Яхве. Контекст следующего стиха допускает покаянное обращение, однако сам стих 7:2 не формулирует полного покаяния; поэтому перевод сохраняет смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис упрощён ради ясности, но выражение «дом Израиля» и личное имя «Яхве» сохранены. Маркер сноски поставлен непосредственно после неоднозначной фразы.
