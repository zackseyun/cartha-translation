  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל אֶל כָּל בֵּ֣ית יִשְׂרָאֵל֮ לֵ/אמֹר֒ אִם בְּ/כָל לְבַבְ/כֶ֗ם אַתֶּ֤ם שָׁבִים֙ אֶל יְהוָ֔ה הָסִ֜ירוּ אֶת אֱלֹהֵ֧י הַ/נֵּכָ֛ר מִ/תּוֹכְ/כֶ֖ם וְ/הָ/עַשְׁתָּר֑וֹת וְ/הָכִ֨ינוּ לְבַבְ/כֶ֤ם אֶל יְהוָה֙ וְ/עִבְדֻ֣/הוּ לְ/בַדּ֔/וֹ וְ/יַצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/003.yaml
  text: Then Samuel said to all the house of Israel[a], “If you are returning to Yahweh with all your heart, remove the foreign gods and the Ashtaroths from among you, and direct your heart to Yahweh and serve him alone[d][c][b], and he will deliver you from the hand of the Philistines.”
translation:
  language: ru
  text: 'Тогда Самуил сказал всему дому Израиля: «Если вы всем сердцем возвращаетесь к Яхве[a], удалите из своей среды чужих богов и Астарты[b], направьте свои сердца к Яхве[c] и служите Ему одному. Тогда Он избавит вас от власти филистимлян[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Если вы всем сердцем обращаетесь к Яхве». Древнееврейский глагол буквально выражает возвращение или поворот назад.'
    reason: lexical_alternative
  - marker: b
    text: В древнееврейском тексте стоит множественная форма «Астарты»; вероятно, имеются в виду изображения, местные проявления или культовые формы богини Астарты (Ашторет).
    reason: cultural_note
  - marker: c
    text: 'Возможный перевод: «приготовьте свои сердца для Яхве» или «утвердите свои сердца в Яхве».'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «из руки филистимлян» — древнееврейский оборот, означающий избавление от их власти.'
    reason: idiom_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда Самуил сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: всему дому Израиля
  rationale: Сохранён корпоративный образ «дома», обозначающий весь народ как единую общину.
- source_word: אִם בְּכָל לְבַבְכֶם אַתֶּם שָׁבִים אֶל יְהוָה
  choice: Если вы всем сердцем возвращаетесь к Яхве
  rationale: Причастная форма שָׁבִים передаёт совершаемое возвращение, а «всем сердцем» сохраняет древнееврейский образ полной и искренней преданности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано транслитерацией, а не заменено титулом.
- source_word: הָסִירוּ
  choice: удалите
  rationale: Ясный современный императив, охватывающий устранение идолов и связанных с ними культовых предметов из общины.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: чужих богов
  rationale: «Чужие боги» естественно обозначает божеств, не принадлежащих вере и заветной верности Израиля; это не значит просто «странные».
- source_word: מִתּוֹכְכֶם
  choice: из своей среды
  rationale: Передаёт удаление изнутри самой общины и относится как к чужим богам, так и к Астартам.
- source_word: וְהָעַשְׁתָּרֹת
  choice: и Астарт
  rationale: Сохранено множественное число имени посредством русской формы родительного/винительного множественного числа; пояснение не внесено непосредственно в текст.
- source_word: וְהָכִינוּ לְבַבְכֶם אֶל יְהוָה
  choice: направьте свои сердца к Яхве
  rationale: כּוּן в сочетании с «сердцем» выражает твёрдую внутреннюю направленность; множественное «сердца» естественно согласуется в русском с обращением ко всему народу.
- source_word: וְעִבְדֻהוּ לְבַדּוֹ
  choice: и служите Ему одному
  rationale: '«Служите» сохраняет широкий смысл עבד: поклонение, верность и послушание, не ограничивая его только обрядом.'
- source_word: וְיַצֵּל אֶתְכֶם מִיַּד פְּלִשְׁתִּים
  choice: Тогда Он избавит вас от власти филистимлян
  rationale: Глагол נצל означает избавление или спасение, а идиома «из руки» естественно передана как освобождение от власти; «тогда» ясно выражает ожидаемое следствие призыва.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер действия שָׁבִים
  choice: возвращаетесь к Яхве
  alternative: обращаетесь к Яхве
  rationale: «Возвращаетесь» сохраняет исходный образ возвращения и идею восстановления верности, не сводя его к более поздней богословской терминологии.
- issue: Значение עבד в призыве к исключительной верности
  choice: служите Ему одному
  alternative: поклоняйтесь только Ему
  rationale: «Служить» включает поклонение, послушание и исключительную преданность, сохраняя полноту древнееврейского глагола.
- issue: Связь избавления с призывом Самуила
  choice: Тогда Он избавит вас
  alternative: и да избавит Он вас
  rationale: Последовательность повелений и глагольной формы допускает понимание избавления как обещанного результата; русский текст не превращает его в безусловное обещание вне поставленного условия.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены корпоративный образ «дом Израиля», личное имя Яхве и ключевые образы возвращения, сердца и служения; непрозрачная для современного читателя идиома «из руки» раскрыта в основном тексте и отмечена в сноске.
