base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/016.yaml
  text: And he would go year by year and make the circuit of Bethel[a], Gilgal, and Mizpah[b], and he judged Israel in all these places.
translation:
  language: ru
  text: Из года в год Самуил совершал обход, проходя через Вефиль, Галгал и Массифу, и судил Израиль во всех этих местах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָלַךְ
  choice: Самуил обходил
  rationale: Имя восстановлено из ближайшего контекста ради ясности; форма глагола вместе с указанием времени выражает обычное, повторявшееся действие в прошлом.
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: из года в год
  rationale: Естественный русский оборот, передающий регулярную ежегодную повторяемость и ритм еврейского выражения.
- source_word: וְסָבַב
  choice: обходил по кругу
  rationale: Передаёт движение по постоянному маршруту между названными городами, не уточняя сверх текста порядок или административный характер поездок.
- source_word: בֵּית אֵל
  choice: Вефиль
  rationale: Традиционная и общеупотребительная русская форма библейского топонима.
- source_word: הַגִּלְגָּל
  choice: Галгал
  rationale: Традиционная русская передача данного топонима.
- source_word: הַמִּצְפָּה
  choice: Массифа
  rationale: Традиционная русская форма библейского топонима Мицпа.
- source_word: וְשָׁפַט
  choice: судил
  rationale: Сохраняет прямое значение корня שׁפט и допускает подразумеваемый контекстом более широкий смысл руководства, не подменяя его толкованием.
- source_word: אֶת יִשְׂרָאֵל
  choice: Израиль
  rationale: Обозначает народ Израиля как объект судебной деятельности Самуила.
- source_word: אֵת כָּל הַמְּקוֹמוֹת הָאֵלֶּה
  choice: во всех этих местах
  rationale: В данном контексте оборот функционирует как обстоятельство места и указывает, где Самуил судил Израиль.
