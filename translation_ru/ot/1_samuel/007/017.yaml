  terminology: «Рама», «Израиль», «жертвенник» и «Яхве» переданы последовательно и точно. «Судил Израиль» сохраняет традиционную и достаточно широкую функцию שׁפט, не сужая её до судебных процессов. Имя יהוה корректно передано как «Яхве».
