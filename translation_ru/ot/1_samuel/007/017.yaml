base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/017.yaml
  text: Then he would return to Ramah[a], for his house was there, and there he judged Israel. He built there an altar to Yahweh.
translation:
  language: ru
  text: А возвращался он в Раму[a], потому что там был его дом; там он судил Израиль. И построил он там жертвенник Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «И возвращение его — в Раму».'
    reason: Сноска сохраняет именную конструкцию оригинала, тогда как основной текст естественно передаёт обусловленное контекстом повторявшееся действие.
lexical_decisions:
- source_word: וּתְשֻׁבָתוֹ
  choice: А возвращался он
  rationale: Еврейское существительное буквально означает «его возвращение», но в контексте ежегодного обхода Самуила естественная русская передача выражает повторявшееся действие глаголом несовершенного вида. Частица «а» передаёт переход и сопоставление с предыдущим маршрутом.
- source_word: הָרָמָתָה
  choice: в Раму
  rationale: Направительный суффикс при названии места указывает на движение к Раме; по-русски это естественно передаётся винительным падежом с предлогом «в».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину возвращения Самуила в Раму.
- source_word: בֵּיתוֹ
  choice: его дом
  rationale: Сохраняется конкретное пространственное значение בַּיִת; в данном контексте «дом» звучит естественно и точно.
- source_word: וְשָׁם
  choice: там
  rationale: Повтор наречия שָׁם сохранён, поскольку он подчёркивает Раму как место жительства и служения Самуила.
- source_word: שָׁפַט אֶת־יִשְׂרָאֵל
  choice: он судил Израиль
  rationale: Глагол שׁפט обозначает деятельность Самуила как судьи и руководителя народа. Традиционная формула «судил Израиль» сохраняет широту значения, не сводя его роль только к судебным разбирательствам.
- source_word: וַיִּבֶן
  choice: И построил он
  rationale: Последовательная форма глагола продолжает повествование. Союз «и» передаёт еврейское waw без добавления отсутствующего в оригинале значения «также».
- source_word: מִזְבֵּחַ
  choice: жертвенник
  rationale: Обычный и точный русский эквивалент названия сооружения для принесения жертв.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог указывает, кому посвящён жертвенник; личное имя יהוה передано русской транслитерацией «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте непосредственно употреблено личное имя Бога, поэтому транслитерация сохраняет различие между именем יהוה и титулом אֲדֹנָי.
- issue: Значение שׁפט применительно к Самуилу
  choice: судил Израиль
  alternative: управлял Израилем
  rationale: «Судил» сохраняет связь с ролью судьи в книге и не устраняет возможную широту понятия, включающего руководство и отправление правосудия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Инверсия «возвращался он» и «построил он» умеренно сохраняет повествовательный ритм оригинала; точка с запятой связывает два утверждения о Раме, не перегружая фразу.
