base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/012.yaml
  text: Then Samuel took one stone and set it between Mizpah and Shen, and he called its name Ebenezer, for he said, “Up to this point the LORD has helped us.”
translation:
  language: ru
  text: 'Тогда Самуил взял один камень, поставил его между Мицпой и Шеном и назвал его Эвен-Эзер[a], сказав: «До этого места помог нам Господь[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Эвен-Эзер» означает «камень помощи».
    reason: Поясняет смысл названия, на котором строится высказывание Самуила.
  - marker: b
    text: В еврейском тексте здесь стоит личное имя Бога — יהוה (ЙХВХ), традиционно передаваемое словом «Господь».
    reason: Делает прозрачным важное различие между собственным именем Бога и титулом в переводе.
lexical_decisions:
- source_word: אֶבֶן אַחַת
  choice: один камень
  rationale: Сохранено явное числительное «один», которое выделяет этот камень как установленный Самуилом памятный знак.
- source_word: אֶבֶן הָעָזֶר
  choice: Эвен-Эзер
  rationale: Название передано транслитерацией с пояснением его прозрачного древнееврейского значения в сноске.
- source_word: עַד הֵנָּה
  choice: до этого места
  rationale: Передаёт пространственный оттенок הֵנָּה в контексте установленного камня, не исключая значения достигнутого к тому времени рубежа.
- source_word: עֲזָרָנוּ
  choice: помог нам
  rationale: Совершенный вид естественно выражает уже оказанную помощь, о которой свидетельствует памятный камень.
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Традиционная и понятная русская передача тетраграмматона; сноска открыто указывает форму исходного текста, не навязывая реконструированное произношение.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной библейской интонацией. Формула «до этого места» намеренно сохраняет пространственно-временную многозначность древнееврейского выражения.
