lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: удалили
  rationale: Порода хифиль глагола סור здесь означает устранить, убрать; «удалили» ясно передаёт сознательный отказ от языческих культов.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранено буквальное и традиционно понятное обозначение народа как заветной общности; в русском библейском повествовании оно звучит естественно и торжественно.
- source_word: הַבְּעָלִים
  choice: Ваалов
  rationale: Множественное число сохранено без уточнения, идёт ли речь о местных проявлениях божества или его изображениях.
- source_word: הָעַשְׁתָּרֹת
  choice: Астарт
  rationale: Передано как множественное число имени Астарта в форме родительного падежа; это сохраняет конкретную культовую отсылку и естественно звучит по-русски.
- source_word: וַיַּעַבְדוּ
  choice: стали служить
  rationale: Глагол עבד при Боге как объекте может означать и служение, и поклонение. «Стали служить» сохраняет основной лексический смысл и подчёркивает перемену верности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: לְבַדּוֹ
  choice: одному
  rationale: 'В сочетании «служить одному Яхве» естественно выражает исключительность преданности: никому иному.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Значение עבד в отношении Бога
  choice: служить одному Яхве
  alternative: поклоняться одному Яхве
  rationale: «Служить» точнее сохраняет широту еврейского глагола, охватывающего как культовое поклонение, так и заветную верность; культовый оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сделан плавным; союз в начале сохраняет повествовательную связь с предыдущим стихом. Формы «сыны Израиля», «Ваалов» и «Астарт» сохраняют особенности исходного текста без пояснительных добавлений.
