  text: וַ/יִּכָּֽנְעוּ֙ הַ/פְּלִשְׁתִּ֔ים וְ/לֹא יָסְפ֣וּ ע֔וֹד לָ/ב֖וֹא בִּ/גְב֣וּל יִשְׂרָאֵ֑ל וַ/תְּהִ֤י יַד יְהוָה֙ בַּ/פְּלִשְׁתִּ֔ים כֹּ֖ל יְמֵ֥י שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/013.yaml
  text: So the Philistines were subdued and did not again come into the territory of Israel[a]. And the hand of Yahweh was against the Philistines all the days of Samuel.
translation:
  language: ru
  text: Итак, филистимляне были усмирены и больше не входили в пределы Израиля. И рука Яхве была против филистимлян во все дни Самуила.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: были усмирены
  rationale: Нифаль глагола כנע обозначает приведение в подчинение после поражения. «Были усмирены» сохраняет страдательно-результативный смысл и естественно звучит в военно-политическом контексте.
- source_word: וְלֹא יָסְפוּ עוֹד לָבוֹא
  choice: больше не входили
  rationale: Сочетание יסף + עוד отрицает повторение или продолжение действия. В данном контексте לָבוֹא בִּגְבוּל означает вступать на израильскую землю; «больше не входили» передаёт это кратко и естественно.
- source_word: בִּגְבוּל יִשְׂרָאֵל
  choice: в пределы Израиля
  rationale: גְּבוּל может обозначать границу или ограниченную ею территорию. «В пределы Израиля» сохраняет пространственно-политический смысл, не сводя выражение к линии границы.
- source_word: וַתְּהִי יַד יְהוָה
  choice: И рука Яхве была
  rationale: Сохранена библейская метафора руки как деятельной силы Бога, поскольку она понятна по контексту и не требует разворачивания в парафраз.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: בַּפְּלִשְׁתִּים
  choice: против филистимлян
  rationale: Предлог ב в сочетании с идиомой о руке Яхве здесь имеет враждебную направленность; «против» ясно выражает контекстуальный смысл.
- source_word: כֹּל יְמֵי שְׁמוּאֵל
  choice: во все дни Самуила
  rationale: Формулировка близка к еврейскому временному выражению и сохраняет возможную смысловую широту, не уточняя сверх текста, идёт ли речь строго о всей жизни Самуила или о времени его служения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Направленность выражения «рука Яхве была на филистимлянах»
  choice: рука Яхве была против филистимлян
  alternative: рука Яхве была на филистимлянах
  rationale: Буквальное «на» сохраняет форму идиомы, но в современном русском неясно передаёт её враждебный смысл. Контекст поражения филистимлян указывает на активное противодействие Яхве.
- issue: Временной охват כֹּל יְמֵי שְׁמוּאֵל
  choice: во все дни Самуила
  alternative: всю жизнь Самуила; пока был жив Самуил
  rationale: Более буквальная формулировка не снимает возможной неоднозначности выражения и не утверждает прямо, что речь непременно обо всей биологической жизни Самуила.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционной библейской метафоры «рука Яхве». Синтаксис достоинственный, но понятный; архаизмы и избыточные пояснения устранены.
