source:
  edition: WLC
  text: וַ/תָּשֹׁ֣בְנָה הֶ/עָרִ֡ים אֲשֶׁ֣ר לָֽקְחוּ פְלִשְׁתִּים֩ מֵ/אֵ֨ת יִשְׂרָאֵ֤ל לְ/יִשְׂרָאֵל֙ מֵ/עֶקְר֣וֹן וְ/עַד גַּ֔ת וְ/אֶ֨ת גְּבוּלָ֔/ן הִצִּ֥יל יִשְׂרָאֵ֖ל מִ/יַּ֣ד פְּלִשְׁתִּ֑ים וַ/יְהִ֣י שָׁל֔וֹם בֵּ֥ין יִשְׂרָאֵ֖ל וּ/בֵ֥ין הָ/אֱמֹרִֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/014.yaml
  text: And the cities that the Philistines had taken from Israel were restored to Israel[a], from Ekron to Gath; and Israel delivered its territory from the hand of the Philistines. And there was peace between Israel and the Amorites.
translation:
  language: ru
  text: И города, которые филистимляне отняли у Израиля, вернулись к Израилю — от Екрона до Гата; и земли этих городов Израиль освободил из-под власти филистимлян. И был мир между Израилем и амореями[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ханаанеями», если слово «амореи» здесь употреблено как более широкое обозначение народов этой земли.'
    reason: Альтернативное понимание собирательного этнонима הָאֱמֹרִי.
lexical_decisions:
- source_word: וַתָּשֹׁבְנָה
  choice: вернулись
  rationale: Форма от שׁוב описывает возвращение городов под власть Израиля. Активное «вернулись» сохраняет грамматический образ еврейского текста и естественно звучит по-русски.
- source_word: הֶעָרִים
  choice: города
  rationale: Обычное соответствие ערים, уместное в контексте территориального контроля.
- source_word: אֲשֶׁר לָקְחוּ פְלִשְׁתִּים מֵאֵת יִשְׂרָאֵל
  choice: которые филистимляне отняли у Израиля
  rationale: «Отняли» передаёт захват и последующее удержание городов, а контекст ясно указывает, что это произошло прежде их возвращения.
- source_word: מֵעֶקְרוֹן וְעַד גַּת
  choice: от Екрона до Гата
  rationale: Прямо передаёт обозначенный в тексте географический диапазон.
- source_word: וְאֶת גְּבוּלָן
  choice: и земли этих городов
  rationale: Суффикс женского множественного числа соотносится с «городами», а גְּבוּל здесь означает принадлежащую им территорию, не только линию границы. Явное «этих городов» устраняет неясность русского местоимения без изменения референции.
- source_word: הִצִּיל
  choice: освободил
  rationale: Hiphil глагола נצל означает избавление или освобождение из-под чужой власти; выбранный вариант естественен для возвращения территории.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: из-под власти филистимлян
  rationale: Передаёт смысл еврейской идиомы «из руки» как освобождение от вражеского контроля, не воспроизводя неестественную для современного русского кальку.
- source_word: וַיְהִי שָׁלוֹם
  choice: И был мир
  rationale: Кратко и близко к форме исходного текста передаёт прекращение вражды и мирные отношения.
- source_word: הָאֱמֹרִי
  choice: амореями
  rationale: Основной текст сохраняет конкретный этноним еврейского источника, где употреблена форма единственного числа с собирательным значением.
theological_decisions:
- issue: Значение этнонима הָאֱמֹרִי в конце стиха
  choice: амореями
  alternative: ханаанеями
  rationale: Еврейский текст прямо называет амореев. Возможное более широкое употребление названия для народов Ханаана не принимается молча, а отмечается в сноске, чтобы сохранить историко-интерпретационную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис остаётся ясным для широкого читателя; тире помогает естественно присоединить географический диапазон. Сноска помещена непосредственно после слова «амореями», к которому она относится.
