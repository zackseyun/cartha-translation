  text: וַ/יֵּ֨צְא֜וּ אַנְשֵׁ֤י יִשְׂרָאֵל֙ מִן הַ/מִּצְפָּ֔ה וַֽ/יִּרְדְּפ֖וּ אֶת פְּלִשְׁתִּ֑ים וַ/יַּכּ֕וּ/ם עַד מִ/תַּ֖חַת לְ/בֵ֥ית כָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/011.yaml
  text: Then the men of Israel went out from Mizpah[a], pursued the Philistines[b], and struck them down as far as below Beth-car.
translation:
  language: ru
  text: Тогда из Мицпы вышли израильские воины, погнались за филистимлянами и поражали их[a] до места ниже Бейт-Кара[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разгромили их». Еврейский глагол может обозначать как нанесение ударов в бою, так и поражение противника.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ниже Бейт-Кара»; вероятно, имеется в виду место, расположенное ниже Бейт-Кара по высоте.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: вышли
  rationale: Обычный повествовательный глагол движения; «вышли» естественно передаёт отправление из Мицпы без добавочного оттенка организованного марша.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: израильские воины
  rationale: Буквально «мужчины Израиля»; в данном военном контексте «воины» естественно по-русски сохраняет указание на мужчин, участвующих в сражении, не превращая выражение в общее «израильтяне».
- source_word: מִן הַמִּצְפָּה
  choice: из Мицпы
  rationale: Название места передано транслитерацией с еврейского; предлог «из» соответствует исходному пункту движения.
- source_word: וַיִּרְדְּפוּ
  choice: погнались за
  rationale: В военном контексте רדף означает преследование; «погнались за» звучит естественно и передаёт начало погони в последовательности событий.
- source_word: פְּלִשְׁתִּים
  choice: филистимлянами
  rationale: Устоявшееся русское название этого народа.
- source_word: וַיַּכּוּם
  choice: поражали их
  rationale: נכה в описании битвы может означать наносить удары, разить или побеждать. «Поражали» сохраняет военную силу глагола, не утверждая, что каждый преследуемый был убит.
- source_word: עַד
  choice: до места
  rationale: Перед обозначением местности עַד указывает предел преследования; добавление «места» делает по-русски ясной топографическую функцию последующего выражения.
- source_word: מִתַּחַת
  choice: ниже
  rationale: Выражение обозначает положение ниже по высоте, а не буквально под каким-либо предметом.
- source_word: לְבֵית כָּר
  choice: Бейт-Кара
  rationale: Топоним передан транслитерацией, а не переводом предполагаемого значения его частей.
