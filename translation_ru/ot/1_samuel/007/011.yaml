translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Избегаются архаизмы «мужи» и «доколе», а также чрезмерно разговорное «гнались». Названия Мицпа и Бейт-Кар переданы непосредственно с еврейского.
