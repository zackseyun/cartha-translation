base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/021.yaml
  text: So they sent messengers to the inhabitants of Kiriath-jearim[a], saying, “The Philistines have returned the ark of Yahweh. Come down; bring it up to yourselves.”
translation:
  language: ru
  text: 'И они послали вестников к жителям Кириат-Иеарима с таким сообщением: «Филистимляне возвратили ковчег Яхве. Спуститесь[a] и поднимите его к себе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В древнееврейском тексте употреблены топографические глаголы движения: «спуститесь» и «поднимите». Они, вероятно, отражают рельеф между Бет-Шемешем и Кириат-Иеаримом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: И послали они
  rationale: Повествовательная форма wayyiqtol продолжает последовательность событий; русский союз «и» естественно сохраняет эту связь.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В данном контексте речь идёт о людях, передающих сообщение; «вестники» точно и ясно передаёт смысл.
- source_word: יוֹשְׁבֵי קִרְיַת יְעָרִים
  choice: к жителям Кириат-Иеарима
  rationale: Причастная конструкция означает жителей данного города; название передано транслитерацией с древнееврейского.
- source_word: הֵשִׁבוּ פְלִשְׁתִּים
  choice: Филистимляне возвратили
  rationale: Hiphil глагола שוב означает «заставить вернуться, возвратить»; завершённое действие естественно передано русским прошедшим временем.
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: Сопряжённое сочетание передано прямо, а тетраграмматон — личным именем «Яхве».
- source_word: רְדוּ
  choice: Сойдите
  rationale: Императив ירד буквально обозначает движение вниз; «сойдите» сохраняет топографический образ, не уточняя без необходимости «придите» или «пойдите».
- source_word: הַעֲלוּ אֹתוֹ אֲלֵיכֶם
  choice: поднимите его к себе
  rationale: Hiphil עלה означает «поднять, доставить наверх», а אֲלֵיכֶם — «к вам, к себе»; перевод сохраняет и направление движения, и получение ковчега адресатами.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога, поэтому транслитерация «Яхве» сохраняет его функцию и не заменяет титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены краткость прямой речи и топографическая образность оригинала.
