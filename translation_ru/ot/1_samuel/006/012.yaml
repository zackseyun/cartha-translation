  text: וַ/יִשַּׁ֨רְנָה הַ/פָּר֜וֹת בַּ/דֶּ֗רֶךְ עַל דֶּ֨רֶךְ֙ בֵּ֣ית שֶׁ֔מֶשׁ בִּ/מְסִלָּ֣ה אַחַ֗ת הָלְכ֤וּ הָלֹךְ֙ וְ/גָע֔וֹ וְ/לֹא סָ֖רוּ יָמִ֣ין וּ/שְׂמֹ֑אול וְ/סַרְנֵ֤י פְלִשְׁתִּים֙ הֹלְכִ֣ים אַחֲרֵי/הֶ֔ם עַד גְּב֖וּל בֵּ֥ית שָֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/012.yaml
  text: And the cows went straight on the road toward Beth-shemesh[a], along one highway; they went on, lowing as they went, and did not turn aside to the right or to the left[c][b]. And the lords of the Philistines were walking behind them as far as the border of Beth-shemesh.
translation:
  language: ru
  text: Коровы пошли прямо по дороге к Бейт-Шемешу, держась одной дороги[a]. Они всё шли, мыча на ходу[b], и не сворачивали ни вправо, ни влево. А правители филистимлян[c] шли за ними до границы Бейт-Шемеша.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по одной-единственной дороге». Еврейский текст подчёркивает, что коровы не меняли выбранного пути.'
    reason: lexical_alternative
  - marker: b
    text: То есть издавая характерный голос коров; они продолжали мычать во время пути.
    reason: cultural_note
  - marker: c
    text: 'Или: «владыки филистимлян». Это титул правителей филистимских городов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִשַּׁרְנָה
  choice: пошли прямо
  rationale: Передаёт прямое, неуклонное движение, выраженное глаголом от корня ישר, и естественно звучит в русском повествовании.
- source_word: הַפָּרוֹת
  choice: коровы
  rationale: В ближайшем контексте речь идёт о дойных коровах, запряжённых в повозку; «коровы» точнее и естественнее, чем «телицы».
- source_word: בַּדֶּרֶךְ עַל דֶּרֶךְ בֵּית שֶׁמֶשׁ
  choice: по дороге к Бейт-Шемешу
  rationale: Сохраняет конкретный маршрут и указанное направление; повтор דרך в русском передано вместе с последующим уточнением о единственной дороге.
- source_word: בִּמְסִלָּה אַחַת
  choice: держась одной дороги
  rationale: Передаёт акцент на одном неизменном маршруте, не вызывая современного образа автомагистрали, который могло бы создать буквальное «по одному шоссе».
- source_word: הָלְכוּ הָלוֹךְ
  choice: они всё шли
  rationale: Конструкция с абсолютным инфинитивом имеет продолжительное или усилительное значение; «всё шли» естественно передаёт непрерывность движения.
- source_word: וְגָעוֹ
  choice: мыча на ходу
  rationale: Глагол обозначает голос коров; оборот показывает, что они продолжали мычать во время движения.
- source_word: וְלֹא סָרוּ יָמִין וּשְׂמֹאול
  choice: не сворачивали ни вправо, ни влево
  rationale: Точно и идиоматично передаёт отсутствие отклонения от пути.
- source_word: וְסַרְנֵי פְלִשְׁתִּים
  choice: правители филистимлян
  rationale: סְרָנִים — особый титул правителей филистимских городов; «правители» ясно передаёт политическую функцию без привнесения феодальных ассоциаций слова «владыки».
- source_word: הֹלְכִים אַחֲרֵיהֶם
  choice: шли за ними
  rationale: Русская форма передаёт продолжающееся сопровождающее действие причастной конструкции.
- source_word: עַד גְּבוּל בֵּית שָׁמֶשׁ
  choice: до самой границы Бейт-Шемеша
  rationale: גְּבוּל здесь обозначает границу области; частица «самой» естественно подчёркивает предел движения, выраженный עַד.
