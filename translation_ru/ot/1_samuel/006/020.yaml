base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/020.yaml
  text: Then the men of Beth-shemesh said[a], “Who is able to stand before Yahweh, this holy God? And to whom shall he go up from us?”
translation:
  language: ru
  text: 'Тогда мужи Бет-Шемеша сказали: «Кто способен устоять перед Яхве, этим святым Богом? И к кому он поднимется от нас?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Вероятно, речь идёт о ковчеге Яхве: «И к кому ковчег поднимется от нас?»'
    reason: В еврейском тексте подлежащее последнего глагола не названо; контекст указывает на ковчег.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Тогда ... сказали
  rationale: Последовательная форма глагола продолжает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: אַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: жители Бет-Шемеша
  rationale: Буквально — «мужи Бет-Шемеша», но в данном повествовательном контексте выражение обозначает жителей или представителей города; современное русское «жители» звучит естественно и не меняет смысла.
- source_word: מִי יוּכַל
  choice: Кто способен
  rationale: Передаёт вопрос о способности выдержать присутствие святого Бога и несколько полнее, чем простое «кто может», выражает осознанное людьми бессилие.
- source_word: לַעֲמֹד לִפְנֵי
  choice: устоять перед
  rationale: Глагол может означать «стоять», но после только что совершившегося суда речь идёт не просто о положении тела, а о способности оставаться и выдержать Божье присутствие; «устоять перед» сохраняет образ и смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: הָאֱלֹהִים הַקָּדוֹשׁ הַזֶּה
  choice: этим святым Богом
  rationale: Сохраняются определение «святой» и указательное местоимение, подчёркивающее непосредственность пережитого суда.
- source_word: וְאֶל מִי
  choice: И к кому
  rationale: Прямо и естественно передаёт предлог с вопросительным местоимением.
- source_word: יַעֲלֶה
  choice: он уйдёт
  rationale: У глагола мужской род и нет явно названного подлежащего. «Он» сохраняет эту формальную неопределённость, а «уйдёт» естественно передаёт в контексте движение от одного места к другому, не перегружая русский текст буквальным «поднимется».
- source_word: מֵעָלֵינוּ
  choice: от нас
  rationale: Кратко и естественно выражает удаление из их среды.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет это различие.
- issue: Неявное подлежащее יַעֲלֶה
  choice: он уйдёт
  alternative: ковчег уйдёт
  rationale: Еврейский текст не называет подлежащее. По контексту почти наверняка подразумевается ковчег, однако местоимение в основном тексте сохраняет формальную неоднозначность, а примечание поясняет вероятный референт.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Формула «устоять перед» сохраняет смысловое напряжение между Божьей святостью и человеческой неспособностью выдержать Его присутствие.
