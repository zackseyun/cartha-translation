base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/013.yaml
  text: The people of Beth-shemesh were reaping the wheat harvest in the valley[a], and they lifted up their eyes and saw the ark, and they rejoiced to see it.
translation:
  language: ru
  text: Жители Бет-Шемеша жали пшеницу в долине. Они подняли глаза[a], увидели ковчег и обрадовались, увидев его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «подняли свои глаза» — древнееврейский оборот со значением «посмотрели вверх».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית שֶׁמֶשׁ
  choice: Жители Бет-Шемеша
  rationale: 'Название города употреблено метонимически: последующие причастие и глаголы стоят во множественном числе и относятся к его жителям. «Жители» передаёт это без ненужного указания на пол.'
- source_word: קֹצְרִים קְצִיר חִטִּים
  choice: жали пшеницу
  rationale: Причастие обозначает продолжавшееся фоновое действие. Естественное русское сочетание «жали пшеницу» точно передаёт уборку урожая без тяжеловесного повтора «жали жатву».
- source_word: בָּעֵמֶק
  choice: в долине
  rationale: עֵמֶק обозначает долину или широкую низменную местность; «долина» — прямой и естественный эквивалент.
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: Они подняли глаза
  rationale: Сохранён образный древнееврейский оборот, который понятен и естественен по-русски; сноска поясняет его идиоматическое значение.
- source_word: וַיִּרְאוּ אֶת הָאָרוֹן
  choice: увидели ковчег
  rationale: В контексте 1 Царств 4–6 определённое הָאָרוֹן означает уже известный читателю ковчег Божий; краткое «ковчег» сохраняет связность повествования.
- source_word: וַיִּשְׂמְחוּ לִרְאוֹת
  choice: обрадовались, увидев его
  rationale: Инфинитив указывает на причину или повод радости. Местоимение «его», подразумеваемое в еврейском тексте, естественно отсылает к ковчегу.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранён образ исходного текста «подняли глаза», а название Бет-Шемеш передано транслитерацией с древнееврейского. Первый союз וּ не развёрнут в отдельное вводное слово, поскольку явного временного маркера в источнике нет.
