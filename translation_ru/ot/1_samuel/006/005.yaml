base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/005.yaml
  text: So make images of your tumors and images of your mice that are ravaging the land[a], and give glory to the God of Israel. Perhaps he will lighten his hand from upon you, and from upon your gods, and from upon your land.
translation:
  language: ru
  text: Итак, сделайте изображения ваших опухолей[a] и изображения ваших мышей, разоряющих землю, и воздайте славу Богу Израиля. Быть может, Он облегчит Свою руку над вами, над вашими богами и над вашей землёй.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваших геморроидальных шишек». Еврейское слово обозначает телесные вздутия или опухоли; более узкий традиционный перевод возможен, но не вполне достоверен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Итак, сделайте
  rationale: Последовательная глагольная форма в данном контексте передаёт указание, вытекающее из предшествующих слов; «итак» естественно выражает эту связь.
- source_word: צַלְמֵי
  choice: изображения
  rationale: צֶלֶם обозначает образ или материальное подобие; «изображения» прямо и естественно передаёт смысл изготовленных воспроизведений.
- source_word: עפלי/כם
  choice: ваших опухолей
  rationale: Слово обозначает болезненные телесные вздутия или опухоли, но не позволяет с уверенностью установить более точный диагноз.
- source_word: וְצַלְמֵי עַכְבְּרֵי/כֶם
  choice: и изображения мышей
  rationale: עַכְבָּר обозначает мышь, а в более широком употреблении — мелкого грызуна; «мыши» соответствует обычному и контекстуально вероятному пониманию.
- source_word: הַמַּשְׁחִיתִם אֶת הָאָרֶץ
  choice: разоряющих землю
  rationale: Причастие передаёт продолжающееся разрушительное действие; «разоряющих» естественно описывает опустошение земли грызунами.
- source_word: וּנְתַתֶּם ... כָּבוֹד
  choice: и воздайте славу
  rationale: Устойчивое русское библейское выражение сохраняет смысл признания власти и величия Бога Израиля.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: Богу Израиля
  rationale: Прямо передаёт конструкцию принадлежности и определённый референт в контексте.
- source_word: אוּלַי
  choice: Быть может
  rationale: Передаёт надежду или возможность, не превращая её в уверенное утверждение; соответствует достоинству литературного регистра.
- source_word: יָקֵל אֶת יָדוֹ
  choice: Он ослабит Свою руку
  rationale: Hiphil от קלל здесь означает сделать легче или ослабить. Формулировка сохраняет образ Божьей руки как действующей силы, оставаясь понятной по-русски.
- source_word: מֵעֲלֵיכֶם וּמֵעַל אֱלֹהֵיכֶם וּמֵעַל אַרְצְכֶם
  choice: над вами, вашими богами и вашей землёй
  rationale: Повторяющийся предлог описывает руку, тяготеющую над всеми тремя объектами; русская однородная конструкция сохраняет этот образ без неестественного троекратного повтора.
theological_decisions:
- issue: Характер болезни, обозначенной словом עפלים
  choice: опухоли
  alternative: геморроидальные шишки; геморрой; нарывы
  rationale: Еврейское слово указывает на телесные опухоли или вздутия, но само по себе не требует узкого анатомического толкования. Более конкретный традиционный вариант сохранён в сноске.
- issue: Антропоморфный образ Божьей руки
  choice: Он ослабит Свою руку над вами
  alternative: Он облегчит ваше наказание; Он перестанет поражать вас
  rationale: Сохранение образа руки передаёт язык исходного текста и подчёркивает непосредственное действие Бога, не сводя многозначную метафору к одному истолкованию.
- issue: Упоминание богов филистимлян под рукой Бога Израиля
  choice: над ... вашими богами
  alternative: против ваших богов
  rationale: Текст прямо включает богов адресатов в перечень тех, над кем тяготеет рука Бога Израиля; перевод сохраняет это утверждение, не объясняя дополнительно его богословский смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены ключевые образы исходного текста — «воздать славу» и Божья «рука», — но синтаксис сделан естественным для современного читателя.
