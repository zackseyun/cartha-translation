  text: וּ/רְאִיתֶ֗ם אִם דֶּ֨רֶךְ גְּבוּל֤/וֹ יַֽעֲלֶה֙ בֵּ֣ית שֶׁ֔מֶשׁ ה֚וּא עָ֣שָׂה לָ֔/נוּ אֶת הָ/רָעָ֥ה הַ/גְּדוֹלָ֖ה הַ/זֹּ֑את וְ/אִם לֹ֗א וְ/יָדַ֨עְנוּ֙ כִּ֣י לֹ֤א יָד/וֹ֙ נָ֣גְעָה בָּ֔/נוּ מִקְרֶ֥ה ה֖וּא הָ֥יָה לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/009.yaml
  text: 'And watch: if it goes up by the way of its territory to Beth-shemesh[a], then he is the one who has done this great harm to us; but if not, then we will know that it was not his hand that struck us[b]; it happened to us by chance.'
translation:
  language: ru
  text: 'И посмотрите: если ковчег пойдёт по дороге, ведущей к его пределам, к Бет-Шемешу, значит, это Он причинил нам это великое бедствие[a]. Если же нет, то мы узнаем, что не Его рука поразила нас: это случилось с нами случайно[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это великое несчастье» или «этот великий вред». Еврейское слово может обозначать тяжёлое бедствие или причинённый вред, не обязательно нравственное зло.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «это было для нас случайным происшествием».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: И посмотрите
  rationale: Форма повелительного наклонения во множественном числе вводит наблюдение, по результату которого филистимляне намерены сделать вывод.
- source_word: דֶּרֶךְ גְּבוּלוֹ
  choice: по дороге к своей земле
  rationale: דֶּרֶךְ обозначает дорогу или путь, а גְּבוּל — границу либо территорию. В данном контексте речь идёт о направлении в принадлежащую Богу Израиля землю; русское «к своей земле» естественно передаёт это значение, не перегружая фразу.
- source_word: יַעֲלֶה
  choice: пойдёт
  rationale: Хотя עלה буквально может означать «подниматься», здесь глагол описывает движение повозки к месту назначения; нейтральное «пойдёт» естественно по-русски.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Бет-Шемеш
  rationale: Название места передано принятой русской транслитерацией с дефисом.
- source_word: הוּא עָשָׂה לָנוּ
  choice: значит, это Он причинил нам
  rationale: Самостоятельное местоимение הוּא несёт эмфатическое значение. Конструкция «это Он» сохраняет противопоставление Божьего действия случайности.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: это великое бедствие
  rationale: רָעָה здесь обозначает тяжёлое бедствие или несчастье, а не обязательно нравственное зло. «Бедствие» точно соответствует контексту поражения.
- source_word: וְאִם לֹא וְיָדַעְנוּ
  choice: Если же нет, то мы узнаем
  rationale: Русская условно-следственная конструкция ясно и естественно передаёт противоположный исход испытания.
- source_word: יָדוֹ נָגְעָה בָּנוּ
  choice: Его рука поразила нас
  rationale: Образ руки указывает на действенную силу, а נגע в этом контексте — на причинение поражения; «поразила» сохраняет и образ, и силу выражения.
- source_word: מִקְרֶה הוּא הָיָה לָנוּ
  choice: всё это случилось с нами по воле случая
  rationale: מִקְרֶה обозначает случайное происшествие. Формулировка сохраняет приписываемое говорящими противопоставление между сознательным Божьим действием и случайностью.
theological_decisions:
- issue: Значение רָעָה применительно к предполагаемому действию Бога
  choice: великое бедствие
  alternative: великое зло; великий вред; великое несчастье
  rationale: Контекст требует обозначения тяжёлого поражения, но не утверждает нравственного зла в Боге. «Бедствие» сохраняет суровость события и не снимает приписываемой Богу ответственности за суд.
- issue: Противопоставление Божьей руки и случая
  choice: 'сохранить речь филистимлян как условный вывод: «это Он» либо «по воле случая»'
  alternative: переформулировать так, чтобы заранее подтвердить Божье действие
  rationale: Стих передаёт рассуждение персонажей и их способ проверки. Перевод не должен заранее разрешать сохраняемую повествованием на этом этапе эпистемическую развилку.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимения, относящиеся к Богу в прямом контексте, написаны с прописной буквы. Синтаксис сделан естественным для устной инструкции, при этом сохранены эмфаза «это Он», образ Божьей руки и неразрешённое для говорящих противопоставление намеренного действия и случая.
