  text: וְ/עַכְבְּרֵ֣י הַ/זָּהָ֗ב מִסְפַּ֞ר כָּל עָרֵ֤י פְלִשְׁתִּים֙ לַ/חֲמֵ֣שֶׁת הַ/סְּרָנִ֔ים מֵ/עִ֣יר מִבְצָ֔ר וְ/עַ֖ד כֹּ֣פֶר הַ/פְּרָזִ֑י וְ/עַ֣ד אָבֵ֣ל הַ/גְּדוֹלָ֗ה אֲשֶׁ֨ר הִנִּ֤יחוּ עָלֶ֨י/הָ֙ אֵ֚ת אֲר֣וֹן יְהוָ֔ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה בִּ/שְׂדֵ֥ה יְהוֹשֻׁ֖עַ בֵּֽית הַשִּׁמְשִֽׁי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/018.yaml
  text: and the golden mice[a], according to the number of all the cities of the Philistines belonging to the five rulers, from fortified city to unwalled village, and as far as the great stone on which they set down the ark of Yahweh, which remains to this day in the field of Joshua the Beth-shemite.
translation:
  language: ru
  text: А золотых мышей — по числу всех филистимских городов, принадлежавших пяти правителям, от укреплённого города до неукреплённого селения, — и до великого камня[a], на который положили ковчег Яхве. Этот камень и по сей день находится на поле Иисуса из Бет-Шемеша.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и до Великой Авелы» — если понимать еврейское выражение как название места, а не как «великий камень».'
    reason: alternative_reading
lexical_decisions:
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: золотых мышей
  rationale: עַכְבָּר обозначает мышь или крысу; традиционное «мыши» остаётся достаточно широким и естественным обозначением изображений, а сочетание с זָהָב по-русски передаётся прилагательным «золотые».
- source_word: מִסְפַּר כָּל עָרֵי פְלִשְׁתִּים
  choice: по числу всех филистимских городов
  rationale: מִסְפַּר выражает количественное соответствие; «по числу» точно и естественно передаёт эту конструкцию.
- source_word: לַחֲמֵשֶׁת הַסְּרָנִים
  choice: принадлежавших пяти правителям
  rationale: סְרָנִים — особый титул пяти филистимских властителей. «Правители» понятно современному читателю и не привносит феодальных ассоциаций слова «владыки».
- source_word: מֵעִיר מִבְצָר וְעַד כֹּפֶר הַפְּרָזִי
  choice: от укреплённого города до неограждённого селения
  rationale: Фраза охватывает весь диапазон поселений и сохраняет противопоставление укреплённого города открытому, не защищённому стенами селению.
- source_word: וְעַד אָבֵל הַגְּדוֹלָה
  choice: и до великого камня
  rationale: В масоретском тексте буквально стоит «до великой Авел», что допускает топоним, однако последующее «на который поставили ковчег» и контекст стиха 14 поддерживают понимание предмета как большого камня; текстовая неоднозначность сохранена в сноске.
- source_word: אֲשֶׁר הִנִּיחוּ עָלֶיהָ אֵת אֲרוֹן יְהוָה
  choice: на который поставили ковчег Яхве
  rationale: הִנִּיחוּ здесь означает «поставили, положили»; «поставили ковчег» естественно описывает действие. Местоимение согласовано по смыслу со словом «камень».
- source_word: עַד הַיּוֹם הַזֶּה
  choice: и по сей день находится
  rationale: Идиома указывает на сохранение предмета ко времени повествователя; добавленный глагол делает русскую фразу ясной, не меняя смысла.
- source_word: בִּשְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: на поле Иисуса из Бет-Шемеша
  rationale: בֵּית הַשִּׁמְשִׁי — обозначение жителя Бет-Шемеша. Оборот «из Бет-Шемеша» в современном русском естественнее искусственного этнохоронима.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон. «Яхве» передаёт личное имя Бога и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Сохранено синтаксическое продолжение предыдущего стиха посредством начального «и»; длинная перечислительная конструкция разделена пунктуационно и на два предложения ради ясности.
