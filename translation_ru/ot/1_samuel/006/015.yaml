  text: וְ/הַ/לְוִיִּ֞ם הוֹרִ֣ידוּ אֶת אֲר֣וֹן יְהוָ֗ה וְ/אֶת הָ/אַרְגַּ֤ז אֲשֶׁר אִתּ/וֹ֙ אֲשֶׁר בּ֣/וֹ כְלֵֽי זָהָ֔ב וַ/יָּשִׂ֖מוּ אֶל הָ/אֶ֣בֶן הַ/גְּדוֹלָ֑ה וְ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ הֶעֱל֨וּ עֹל֜וֹת וַֽ/יִּזְבְּח֧וּ זְבָחִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא לַֽ/יהוָֽה׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/015.yaml
  text: And the Levites took down the ark of Yahweh[a], and the box that was with it, in which were the gold objects, and set them on the great stone[c][b]. And the men of Beth-shemesh offered burnt offerings and sacrificed sacrifices on that day to Yahweh.
translation:
  language: ru
  text: Левиты сняли ковчег Яхве[a] и ларец, который был при нём и в котором находились золотые предметы[b], и поставили их на большой камень[c]. А жители Бет-Шемеша в тот день принесли Яхве всесожжения и совершили жертвоприношения[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. YHWH (יהוה), личное имя Бога; традиционно переводится «ГОСПОДЬ».
    reason: alternative_reading
  - marker: b
    text: Еврейское слово может означать предметы, изделия, принадлежности или сосуды из золота.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «у большого камня». Предлог может обозначать направление или расположение при камне; по контексту вероятнее «на камень».'
    reason: textual_ambiguity
  - marker: d
    text: 'Буквально: «закололи жертвы» — в еврейском употреблены однокоренные глагол и существительное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם הוֹרִידוּ
  choice: Левиты сняли
  rationale: Форма Hiphil глагола ירד обозначает снятие ковчега и ларца с повозки; «сняли» естественно и конкретно передаёт действие.
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: אֲרוֹן в данном культовом контексте — «ковчег», а личное имя יהוה передано как «Яхве» с пояснением традиционного варианта в сноске.
- source_word: הָאַרְגַּז אֲשֶׁר אִתּוֹ
  choice: ларец, который был при нём
  rationale: הָאַרְגַּז обозначает отдельный сопровождающий ковчег ящик или ларец. «Ларец» достаточно точно отличает его от ковчега, а «был при нём» сохраняет простое пространственное отношение.
- source_word: אֲשֶׁר בּוֹ כְלֵי זָהָב
  choice: в котором находились золотые предметы
  rationale: כְּלִי — широкое обозначение предмета, утвари или изделия; нейтральное «предметы» не уточняет их вид сверх исходного текста.
- source_word: וַיָּשִׂמוּ אֶל הָאֶבֶן הַגְּדוֹלָה
  choice: и поставили их на большой камень
  rationale: Сочетание שׂים с אֶל здесь по контексту означает помещение предметов на камень; «большой» — современный естественный эквивалент הַגְּדוֹלָה.
- source_word: וְאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: А жители Бет-Шемеша
  rationale: Буквально אַנְשֵׁי — «мужи/люди», но в названии сообщества конструкция естественно обозначает жителей города. Русское «жители» сохраняет собирательный смысл без ненужной архаизации и без утверждения, что участвовали только мужчины.
- source_word: הֶעֱלוּ עֹלוֹת
  choice: принесли всесожжения
  rationale: Это устойчивое обозначение принесения жертв, целиком сжигаемых на жертвеннике; «всесожжения» сохраняет специальный культовый термин.
- source_word: וַיִּזְבְּחוּ זְבָחִים
  choice: совершили жертвоприношения
  rationale: Естественная русская передача этимологической фигуры «закололи жертвы»; буквальная конструкция отмечена в сноске.
- source_word: בַּיּוֹם הַהוּא לַיהוָה
  choice: в тот день принесли Яхве
  rationale: Временная фраза передана прямо, а לְ указывает на Яхве как адресата жертв.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: Исходный текст содержит личное имя Бога — тетраграмматон. «Яхве» передаёт его как имя, а традиционная замена «ГОСПОДЬ» указана в сноске.
- issue: Гендерное значение אַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: жители Бет-Шемеша
  alternative: мужчины Бет-Шемеша
  rationale: Хотя форма морфологически мужская и буквально может означать «мужи», в конструкции с названием города она способна обозначать его население или представителей. Контекст не доказывает, что автор намеренно исключает женщин, поэтому естественное собирательное «жители» сохраняет эту неоднозначность.
- issue: Соотношение всесожжений и прочих жертв
  choice: принесли всесожжения и совершили жертвоприношения
  alternative: вознесли всесожжения и закололи жертвы
  rationale: Два еврейских выражения сохранены как два координированных действия, без сведения их к одному общему акту; при этом русская формулировка избегает неестественного повтора.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис ясен для обычного читателя; специальные культовые термины сохранены там, где они несут смысловую нагрузку. Топоним передан как «Бет-Шемеш», личное имя יהוה — как «Яхве».
