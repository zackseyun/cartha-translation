  to: 'Они сказали: «Если вы отсылаете ковчег Бога Израиля, не отсылайте его пустым: непременно возвратите его с приношением за вину[a]. Тогда вы исцелитесь, и вам станет известно, почему его рука[b] не отступает от вас».'
  rationale: Правка сохраняет смысл требования отправить ковчег не без приношения за вину, но устраняет необоснованную в русском основном тексте догматизацию спорного референта суффикса לּוֹ. Вариант «возвратите его с приношением» естественен по-русски и соответствует контекстуальному смыслу; буквальный личный вариант и его неоднозначность отражены в сноске. Строчная буква в «его рука» также не навязывает типографическое богословское решение, тогда как контекст и сноска делают референт понятным.
