  text: וַ/יֹּאמְר֗וּ אִֽם מְשַׁלְּחִ֞ים אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ אַל תְּשַׁלְּח֤וּ אֹת/וֹ֙ רֵיקָ֔ם כִּֽי הָשֵׁ֥ב תָּשִׁ֛יבוּ ל֖/וֹ אָשָׁ֑ם אָ֤ז תֵּרָֽפְאוּ֙ וְ/נוֹדַ֣ע לָ/כֶ֔ם לָ֛/מָּה לֹא תָס֥וּר יָד֖/וֹ מִ/כֶּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/003.yaml
  text: And they said[a], “If you are sending away the ark of the God of Israel, do not send it away empty, for you must surely return to him a guilt offering. Then you will be healed[b], and it will be made known to you why his hand has not turned away from you.”
translation:
  language: ru
  text: 'Они сказали: «Если вы отсылаете ковчег Бога Израиля, не отсылайте его пустым: непременно возвратите его с приношением за вину[a]. Тогда вы исцелитесь, и вам станет известно, почему его рука[b] не отступает от вас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непременно возвратите ему приношение за вину»; «ему» может относиться к Богу Израиля или к ковчегу. Также: «возместительное приношение»; традиционно: «жертва повинности».'
    reason: lexical_alternative
  - marker: b
    text: «Рука» — распространённый в еврейской Библии образ Божьей силы, в данном случае действующей в суде.
    reason: cultural_note
lexical_decisions:
- source_word: מְשַׁלְּחִים / תְּשַׁלְּחוּ
  choice: отсылаете / не отсылайте
  rationale: В данном контексте שלח означает отпустить и отправить ковчег обратно из филистимского владения. «Отсылать» естественно передаёт это значение и сохраняет повтор исходного текста.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: ковчег Бога Израиля
  rationale: Прямая передача конструкции принадлежности; выражение «ковчег завета» не вводится, поскольку его нет в данном стихе.
- source_word: רֵיקָם
  choice: пустым
  rationale: Сохраняется образ ковчега, отсылаемого без сопровождающего дара; «с пустыми руками» относилось бы прежде всего к человеку и изменило бы образ.
- source_word: הָשֵׁב תָּשִׁיבוּ
  choice: непременно возвратите
  rationale: Сочетание абсолютного инфинитива с личной формой глагола выражает усиление и обязательность. «Непременно» передаёт это подчёркивание.
- source_word: לּוֹ
  choice: Ему
  rationale: Местоименный суффикс мужского рода естественнее всего относится к Богу Израиля, а не к ковчегу; прописная буква ясно передаёт выбранный референт в русском тексте.
- source_word: אָשָׁם
  choice: приношение за вину
  rationale: Термин обозначает приношение, связанное с виной и возмещением ущерба. Эта формулировка понятна современному читателю и не использует архаичное конфессиональное наименование.
- source_word: תֵּרָפְאוּ
  choice: вы исцелитесь
  rationale: Нифаль глагола רפא передаёт избавление от постигшего филистимлян поражения; возвратная русская форма сохраняет результирующий смысл.
- source_word: וְנוֹדַע לָכֶם
  choice: вам станет известно
  rationale: Безличная конструкция естественно передаёт пассивное значение нифаля, не превращая его в активное «вы узнаете».
- source_word: לָמָּה לֹא תָסוּר יָדוֹ מִכֶּם
  choice: почему Его рука не отступает от вас
  rationale: Метафора божественной руки сохранена, а форма «не отступает» передаёт продолжающееся действие несовершенного вида в контексте бедствия.
theological_decisions:
- issue: К кому относится местоимение לּוֹ
  choice: Приношение возвращают «Ему», то есть Богу Израиля.
  alternative: Приношение возвращают «к нему», то есть к ковчегу, или отправляют вместе с ним.
  rationale: Упоминание Бога Израиля и культово-возместительное значение אָשָׁם делают личный божественный референт наиболее вероятным, хотя грамматическая форма сама по себе допускает соотнесение с ковчегом.
- issue: Значение выражения «Его рука»
  choice: Сохранена буквальная метафора Божьей силы, действующей в суде.
  alternative: 'Передать толковательно: «Его кара» или «посланное Им бедствие».'
  rationale: Образ руки значим и распространён в еврейской Библии. Его сохранение не сводит выражение к одному виду наказания и не устраняет богословскую образность.
- issue: Временной оттенок לֹא תָסוּר
  choice: «не отступает» — продолжающееся настоящее действие.
  alternative: «не отступила» или «не отступит».
  rationale: Еврейский имперфект допускает контекстуальные оттенки. Настоящее время естественно описывает всё ещё продолжающееся поражение и сохраняет открытость вопроса о его прекращении.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис сохраняет повтор «отсылаете — не отсылайте» и ключевой образ руки, избегая как разговорности, так и излишне церковнославянской лексики.
