base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/014.yaml
  text: The cart came into the field of Joshua the Beth-shemite and stopped there[a], where there was a large stone[c][b]. Then they split up the wood of the cart and offered up the cows as a burnt offering to Yahweh.
translation:
  language: ru
  text: Повозка въехала на поле Иисуса, жителя Вефсамиса, и остановилась там, где был большой камень. Тогда деревянные части повозки раскололи, а коров принесли во всесожжение Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲגָלָה
  choice: повозка
  rationale: В данном повествовании слово обозначает колёсное транспортное средство, на котором везли ковчег; «повозка» естественно и точно передаёт смысл.
- source_word: שְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: поле Иисуса, жителя Вефсамиса
  rationale: Еврейское определение связывает Иисуса с Вефсамисом; описательный оборот звучит по-русски естественнее искусственного этнонима.
- source_word: וַתַּעֲמֹד שָׁם
  choice: и остановилась там
  rationale: Глагол буквально означает «стала», но применительно к движущейся повозке передаёт её остановку.
- source_word: וְשָׁם אֶבֶן גְּדוֹלָה
  choice: возле большого камня
  rationale: Краткая русская формулировка сохраняет указание на находившийся там большой камень и естественно связывает его с местом остановки.
- source_word: וַיְבַקְּעוּ אֶת עֲצֵי הָעֲגָלָה
  choice: повозку разобрали на дрова
  rationale: בקע означает раскалывать; по контексту деревянные части повозки были расщеплены и использованы как топливо для жертвы.
- source_word: הַפָּרוֹת
  choice: коров
  rationale: Форма обозначает взрослых самок крупного рогатого скота; контекст с телятами подтверждает перевод «коровы», а не «тёлки».
- source_word: הֶעֱלוּ עֹלָה
  choice: принесли во всесожжение
  rationale: Устойчивый жертвенный оборот передаёт как принесение животных, так и вид жертвы, сжигавшейся целиком.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передача личного имени יהוה как «Яхве» сохраняет его статус имени, а не заменяет титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; транслитерация «Яхве» сохраняет это различие без внесения конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой («всесожжение»). Синтаксис сделан ясным и повествовательным; имя יְהוֹשֻׁעַ передано принятой для ветхозаветного персонажа формой «Иисус», а בֵּית שֶׁמֶשׁ — традиционной русской формой «Вефсамис».
