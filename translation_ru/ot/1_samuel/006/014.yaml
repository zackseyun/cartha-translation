revisions:
- from: Повозка въехала на поле Иисуса, жителя Вефсамиса, и остановилась там, возле большого камня. Тогда повозку разобрали на дрова, а коров принесли во всесожжение Яхве.
  to: Повозка въехала на поле Иисуса, жителя Вефсамиса, и остановилась там, где был большой камень. Тогда деревянные части повозки раскололи, а коров принесли во всесожжение Яхве.
  rationale: 'Заменено «возле большого камня» на «там, где был большой камень», чтобы не добавлять неуказанную близость повозки к камню. «Повозку разобрали на дрова» заменено на более буквальное «деревянные части повозки раскололи»: еврейский текст говорит о расщеплении древесины/деревянных частей повозки, а не прямо о разборке всей повозки.'
