  source_fidelity: 'В целом перевод точно передаёт последовательность действий и жертвенную терминологию. Однако «возле большого камня» уточняет пространственную связь, которой в еврейском тексте нет: сказано лишь, что там находился большой камень.'
  naturalness: Текст звучит естественно на современном литературном русском. Формулировка «там, где был большой камень» столь же ясна и точнее отражает исходный текст.
  terminology: «Повозка», «коровы», «всесожжение» и «Яхве» уместны. «Иисус, житель Вефсамиса» корректно передаёт имя и обозначение происхождения, не смешивая этого человека с Иисусом Навином.
