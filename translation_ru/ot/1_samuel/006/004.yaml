  text: וַ/יֹּאמְר֗וּ מָ֣ה הָ/אָשָׁם֮ אֲשֶׁ֣ר נָשִׁ֣יב ל/וֹ֒ וַ/יֹּאמְר֗וּ מִסְפַּר֙ סַרְנֵ֣י פְלִשְׁתִּ֔ים חֲמִשָּׁה֙ עפלי זָהָ֔ב וַ/חֲמִשָּׁ֖ה עַכְבְּרֵ֣י זָהָ֑ב כִּֽי מַגֵּפָ֥ה אַחַ֛ת לְ/כֻלָּ֖/ם וּ/לְ/סַרְנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/004.yaml
  text: 'And they said[a], “What is the guilt offering that we should return to him?” They said, “According to the number of the Philistine rulers: five golden tumors and five golden mice[c][b], for one plague was on all of them and on your rulers.”'
translation:
  language: ru
  text: 'Они спросили: «Какую повинную жертву[a] нам возвратить Ему?» Им ответили: «По числу правителей[b] филистимлян: пять золотых опухолей[c] и пять золотых мышей, ибо одна язва постигла всех их и ваших правителей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертву за вину»; возможен также смысл жертвы возмещения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «владетелей» — особый титул правителей пяти филистимских городов.'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейское слово, вероятно, обозначает вызванные язвой опухоли; иногда его переводят более конкретно: «геморроидальные шишки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָשָׁם
  choice: повинную жертву
  rationale: В данном культовом и возместительном контексте אָשָׁם обозначает жертву, приносимую в связи с виной и необходимостью возмещения. «Повинная жертва» — понятный и укоренившийся русский эквивалент.
- source_word: נָשִׁיב לוֹ
  choice: нам возвратить Ему
  rationale: Каузативная форма שוב означает «возвратить». Местоимение мужского рода единственного числа естественно отнесено к Богу Израиля; прописная буква помогает передать этот референт по-русски, не заменяя местоимение пояснительным существительным.
- source_word: מִסְפַּר סַרְנֵי פְלִשְׁתִּים
  choice: по числу правителей филистимлян
  rationale: Оборот выражает соответствие количества даров числу филистимских правителей. Предлог «по» естественно и кратко передаёт это отношение.
- source_word: סַרְנֵי
  choice: правителей
  rationale: Это особый титул глав пяти филистимских городов. «Правители» ясно передаёт политическую власть и не вносит феодальных ассоциаций слова «лорды».
- source_word: עפלי זָהָב
  choice: золотых опухолей
  rationale: Существительное, вероятно, обозначает болезненные опухоли или вздутия, связанные с бедствием. Общее слово «опухоли» сохраняет неопределённость локализации и характера болезни.
- source_word: עַכְבְּרֵי זָהָב
  choice: золотых мышей
  rationale: Прямой и естественный перевод конкретного образа.
- source_word: מַגֵּפָה אַחַת
  choice: одна и та же язва
  rationale: Числительное אַחַת подчёркивает общность бедствия для всех. «Одна и та же» естественно выражает это по-русски, а «язва» соответствует контексту ниспосланного поражения.
- source_word: לְכֻלָּם וּלְסַרְנֵיכֶם
  choice: постигла их всех и ваших правителей
  rationale: Формулировка сохраняет переход от местоимения третьего лица «их всех» к прямому обращению «ваших», присутствующий в еврейском тексте, не подменяя его уточняющими группами.
theological_decisions:
- issue: К кому относится местоимение לוֹ в вопросе о жертве
  choice: «Ему» — Богу Израиля
  alternative: «ему/ему же» — ковчегу как грамматически возможному референту
  rationale: Логика возмещения за проступок направляет жертву Богу Израиля, с Чьим ковчегом связано бедствие. При этом перевод сохраняет местоименную форму и не вставляет имя Бога в основной текст.
- issue: Характер выражения מַגֵּפָה אַחַת
  choice: «одна и та же язва» как общее поражение
  alternative: «одна язва» как строго буквальное числовое выражение
  rationale: Контекст подчёркивает, что одно общее бедствие лежит на всех и на правителях; перевод не уточняет медицинскую природу поражения и сохраняет богословское напряжение повествования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Диалог передан естественно; сохранены лаконичность ответа, неоднозначность названия болезни и необычная смена третьего лица на второе в заключительной фразе.
