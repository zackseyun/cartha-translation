  - marker: b
    text: 'Или: «держали их телят взаперти в доме». В еврейском тексте телята буквально названы «их сыновьями», то есть потомством коров.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ הָאֲנָשִׁים כֵּן
  choice: И люди так и сделали
  rationale: Устойчивое еврейское выражение передаёт исполнение только что данных указаний; «так и сделали» естественно звучит по-русски и сохраняет лаконизм повествования.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: двух дойных коров
  rationale: Сочетание обозначает коров, дающих молоко и имеющих зависимых от них телят. «Дойные коровы» кратко и ясно передаёт основной смысл; уточнение дано в сноске.
- source_word: וַיַּאַסְרוּם בָּעֲגָלָה
  choice: запрягли их в повозку
  rationale: Глагол буквально связан со связыванием, но в контексте тягловых животных означает их присоединение к повозке; «запрягли» — точный и естественный русский эквивалент.
- source_word: וְאֶת בְּנֵיהֶם
  choice: а телят их
  rationale: Буквально «их сыновей/детей», но применительно к коровам естественное видовое обозначение потомства — «телята».
- source_word: כָּלוּ בַבָּיִת
  choice: заперли в доме
  rationale: Глагол выражает удержание взаперти, а בַּבָּיִת буквально означает «в доме». Перевод не заменяет этот образ предположительным «стойлом».
