  yaml_path: translation/ot/1_samuel/006/010.yaml
  text: 'So the men did so: they took two milk cows and harnessed them to the cart[b][a], and shut up their calves in the house.'
translation:
  language: ru
  text: 'И люди так и сделали: взяли двух дойных коров[a], впрягли их в повозку, а их телят заперли в доме[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «двух кормящих коров». Еврейское выражение описывает коров, которые давали молоко и имели телят.'
