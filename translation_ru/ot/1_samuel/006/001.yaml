lexical_decisions:
- source_word: וַיְהִי
  choice: пробыл
  rationale: Повествовательная форма וַיְהִי продолжает рассказ и вместе с обстоятельством времени естественно передаётся русским «пробыл» без тяжеловесного «и было».
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: Конструкция принадлежности передана прямо; «ковчег» — устоявшееся обозначение אֲרוֹן в данном культовом контексте, а личное имя יהוה транслитерировано как «Яхве».
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: во владениях филистимлян
  rationale: שָׂדֶה буквально означает «поле», но здесь в сочетании с названием народа имеет расширенное географическое значение — страна, область или территория под его властью. «Во владениях» естественно передаёт этот смысл и не создаёт впечатления одного буквального поля.
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: семь месяцев
  rationale: Прямое и естественное соответствие древнееврейскому числовому выражению.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Сохранено личное имя Бога посредством общепринятой научной транслитерации «Яхве», без замены имени титулом и без внесения дополнительных богословских утверждений.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Глагол «пробыл» делает фразу естественной и ясно связывает нахождение ковчега с указанной продолжительностью; сноска сохраняет буквальный образ еврейского текста.
