  text: וּ/לְקַחְתֶּ֞ם אֶת אֲר֣וֹן יְהוָ֗ה וּ/נְתַתֶּ֤ם אֹת/וֹ֙ אֶל הָ֣/עֲגָלָ֔ה וְ/אֵ֣ת כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר הֲשֵׁבֹתֶ֥ם ל/וֹ֙ אָשָׁ֔ם תָּשִׂ֥ימוּ בָ/אַרְגַּ֖ז מִ/צִּדּ֑/וֹ וְ/שִׁלַּחְתֶּ֥ם אֹת֖/וֹ וְ/הָלָֽךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/008.yaml
  text: Then take the ark of Yahweh and place it on the cart[a], and put the gold objects that you are returning to him as a guilt offering in a box beside it. Then send it away[c][b], and let it go.
translation:
  language: ru
  text: Возьмите ковчег Яхве и поставьте его на повозку, а золотые предметы, которые вы возвращаете Ему как жертву повинности, положите в ящик рядом с ним. Затем отпустите повозку и пустите её в путь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отправьте его, и он пойдёт». В еврейском тексте употреблены формы мужского рода; они могут относиться к ковчегу или ко всему отправляемому грузу. По контексту повеление означает отправить повозку с ковчегом в путь.'
    reason: Сохранение грамматической неоднозначности и пояснение буквальной формы.
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: אֲרוֹן обозначает священный ковчег, а имя יְהוָה передано транслитерацией «Яхве», что сохраняет личное Божье имя исходного текста.
- source_word: הָעֲגָלָה
  choice: повозку
  rationale: עֲגָלָה — повозка или телега; «повозка» естественно звучит в повествовании и соответствует предмету, запряжённому коровами.
- source_word: כְּלֵי הַזָּהָב
  choice: золотые предметы
  rationale: כְּלִי — широкое обозначение предмета, изделия или сосуда. В контексте речь идёт о золотых изображениях, поэтому нейтральное «предметы» не сужает значения.
- source_word: הֲשֵׁבֹתֶם לוֹ
  choice: которые вы возвращаете Ему
  rationale: Хифиль שוב означает «возвращать, отсылать обратно»; настоящее время уместно в последовательности указаний. Местоимение отнесено к Яхве.
- source_word: אָשָׁם
  choice: как жертву повинности
  rationale: אָשָׁם — культовый термин «жертва повинности»; его следует сохранить и в филистимском контексте, поскольку именно такую лексику использует еврейский рассказчик.
- source_word: בָאַרְגַּז מִצִּדּוֹ
  choice: в ящик рядом с ним
  rationale: אַרְגָּז означает ящик или сундук, а מִצִּדּוֹ — «сбоку от него, рядом с ним»; ближайший естественный референт местоимения — ковчег.
- source_word: וְשִׁלַּחְתֶּם אֹתוֹ וְהָלָךְ
  choice: Затем отпустите его, и пусть он идёт
  rationale: שׁלח здесь означает отпустить или отправить, а формальное «и он пойдёт» после повеления допускает в контексте разрешительно-результативное прочтение «и пусть он идёт». Местоименная двусмысленность исходного текста сохранена.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя, явно присутствующее в еврейском тексте, не подменяя его титулом.
- issue: Значение культового термина אָשָׁם у филистимлян
  choice: жертва повинности
  alternative: выкупная жертва; приношение за вину
  rationale: «Жертва повинности» сохраняет связь со стандартной культовой терминологией еврейского текста, не утверждая при этом, что филистимский обряд полностью совпадал с израильским.
- issue: Референт местоимений в заключительной фразе
  choice: сохранить форму «его / он» без явного уточнения
  alternative: 'уточнить: «отпустите повозку, и пусть она едет»'
  rationale: Еврейское אֹתוֹ и последующий глагол мужского рода формально не совпадают с женским עֲגָלָה «повозка» и могут отсылать к ковчегу либо ко всему отправляемому грузу. Уточнение устранило бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским регистром. Использованы общеупотребительные «повозка», «золотые предметы» и «ящик»; культовый термин «жертва повинности» сохранён. Заглавная буква в «Ему» служит русской традиции почтительного обозначения Бога, тогда как местоимения, относящиеся к неоднозначному предметному референту, написаны со строчной.
