  text: וַ/יִּקְרְא֣וּ פְלִשְׁתִּ֗ים לַ/כֹּהֲנִ֤ים וְ/לַ/קֹּֽסְמִים֙ לֵ/אמֹ֔ר מַֽה נַּעֲשֶׂ֖ה לַ/אֲר֣וֹן יְהוָ֑ה הוֹדִעֻ֕/נוּ בַּ/מֶּ֖ה נְשַׁלְּחֶ֥/נּוּ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/002.yaml
  text: So the Philistines called for the priests and the diviners[a], saying, “What shall we do with the ark of Yahweh? Tell us with what we should send it to its place.”
translation:
  language: ru
  text: 'Тогда филистимляне позвали жрецов и прорицателей и спросили: «Что нам делать с ковчегом Яхве? Скажите нам, с чем[a] отправить его на своё место?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каким образом»; буквально: «с чем» или «посредством чего».'
    reason: Сочетание בַּמֶּה может обозначать как средство отправки, так и то, с чем следует отправить ковчег; дальнейший контекст говорит о сопровождающем даре.
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: позвали
  rationale: Глагол קרא в данном контексте означает призвать специалистов для совета; «позвали» естественно передаёт это в современном русском повествовании.
- source_word: לַכֹּהֲנִים
  choice: жрецов
  rationale: Речь идёт о филистимских культовых служителях. В русском «жрецы» ясно обозначает служителей языческого культа, не добавляя отсутствующей в тексте конфессиональной характеристики.
- source_word: וְלַקֹּסְמִים
  choice: прорицателей
  rationale: קֹסְמִים — люди, занимающиеся гаданием и предсказанием посредством особых практик. «Прорицатели» точно и литературно передаёт значение, не смешивая их с библейскими пророками.
- source_word: מַה נַּעֲשֶׂה לַאֲרוֹן
  choice: Что нам делать с ковчегом
  rationale: Естественная русская передача совещательного вопроса первого лица множественного числа и предлога ל в данном обороте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: הוֹדִיעֻנוּ
  choice: Скажите нам
  rationale: Естественная передача каузативного императива ידע — «дайте нам знать, сообщите нам».
- source_word: בַּמֶּה
  choice: с чем
  rationale: 'Буквально выражение указывает на средство или сопровождающий предмет: «с чем / посредством чего». В ближайшем контексте вопрос относится к тому, что должно сопровождать ковчег при отправке.'
- source_word: נְשַׁלְּחֶנּוּ
  choice: отправить его
  rationale: Форма выражает предполагаемое действие, о котором филистимляне спрашивают совета; местоименный суффикс относится к ковчегу.
- source_word: לִמְקוֹמוֹ
  choice: на его место
  rationale: Сохраняет местоименный суффикс еврейского текста и не добавляет прямо не выраженного наречия «обратно».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте употреблено собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Обозначение филистимских культовых служителей
  choice: жрецы
  alternative: священники
  rationale: «Жрецы» в современном русском ясно указывает на служителей филистимского культа, тогда как «священники» может непреднамеренно вызвать ассоциацию с израильским священством.
translation_notes:
  register: Современный литературный русский язык с ясной повествовательной интонацией. Прямая речь передана естественно, при этом сохранены конкретность выражения «с чем» и намеренная краткость еврейского текста.
