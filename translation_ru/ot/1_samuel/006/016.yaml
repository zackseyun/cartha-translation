  text: וַ/חֲמִשָּׁ֥ה סַרְנֵֽי פְלִשְׁתִּ֖ים רָא֑וּ וַ/יָּשֻׁ֥בוּ עֶקְר֖וֹן בַּ/יּ֥וֹם הַ/הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/016.yaml
  text: When the five rulers of the Philistines saw it[b][a], they returned to Ekron that same day.
translation:
  language: ru
  text: Пять правителей[b] филистимлян увидели это и в тот же день[a] вернулись в Экрон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в тот день».'
    reason: lexical_alternative
  - marker: b
    text: Филистимский титул סֶרֶן также переводят как «владыка».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲמִשָּׁה
  choice: Пять
  rationale: Числительное относится к известным из контекста пяти филистимским правителям; в русском языке определённость не требует отдельного показателя.
- source_word: סַרְנֵי
  choice: правителей
  rationale: Сֶרֶן — особый титул правителей пяти филистимских городов. Слово «правители» ясно передаёт политическую власть и звучит естественно в современном русском языке.
- source_word: פְלִשְׁתִּים
  choice: филистимлян
  rationale: 'Родительный падеж передаёт конструкцию принадлежности: правители филистимлян.'
- source_word: רָאוּ
  choice: увидели это
  rationale: В еврейском тексте объект прямо не назван, но подразумевается из ближайшего контекста; русское «это» естественно отсылает к только что описанным событиям, не уточняя их сверх источника.
- source_word: וַיָּשֻׁבוּ
  choice: вернулись
  rationale: Последовательная повествовательная форма глагола שׁוּב обозначает возвращение; «вернулись» кратко и естественно передаёт смысл.
- source_word: עֶקְרוֹן
  choice: в Экрон
  rationale: При глаголе движения русский язык требует предлога «в»; название города передано современной транслитерацией.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот же день
  rationale: 'Буквально: «в тот день». Частица «же» естественно подчёркивает непосредственную временную связь с описанными событиями; буквальный вариант сохранён в сноске.'
