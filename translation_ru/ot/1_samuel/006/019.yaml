base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/019.yaml
  text: And he struck down some of the men of Beth-shemesh because they had looked into the ark of Yahweh[a]. He struck down seventy men among the people, fifty thousand men[b], and the people mourned because Yahweh had struck the people with a great blow.
translation:
  language: ru
  text: И Он поразил некоторых жителей Беф-Шемеша за то, что они заглянули в ковчег Яхве[a]. Он поразил в народе семьдесят человек — пятьдесят тысяч человек[b]. И народ скорбел, потому что Яхве нанёс народу тяжкий удар.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смотрели на ковчег Яхве». Еврейский предлог допускает более общее значение, хотя в данном контексте вероятно, что речь идёт о заглядывании внутрь ковчега.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально в еврейском тексте: «семьдесят человек, пятьдесят тысяч человек». Эта трудная формулировка может пониматься как «семьдесят человек из пятидесяти тысяч» или «пятьдесят тысяч семьдесят человек»; возможно также повреждение текста. Некоторые древние свидетели текста указывают на значительно меньшее число.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  choice: поразил
  rationale: Глагол נכה означает «ударить, поразить»; в данном контексте речь идёт о смертельной Божьей каре. Русское «поразил» сохраняет повтор корня по смыслу и не звучит архаично.
- source_word: בְּאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: некоторых жителей Беф-Шемеша
  rationale: 'Предлог בְּ допускает партитивное понимание: поражение постигло часть людей этого города. «Жители» естественнее по-русски, чем буквальное «мужи», и не утверждает, что погибли все жители.'
- source_word: כִּי רָאוּ בַּאֲרוֹן יְהוָה
  choice: за то, что они заглядывали в ковчег Яхве
  rationale: Сочетание ראה с בְּ может означать как взгляд на предмет, так и взгляд внутрь него. Контекст нарушения святости ковчега делает «заглядывали в» вероятным, а более общее прочтение отмечено в сноске.
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: Конструктивное сочетание передано прямо; личное имя יהוה транслитерировано как «Яхве».
- source_word: שִׁבְעִים אִישׁ חֲמִשִּׁים אֶלֶף אִישׁ
  choice: семьдесят человек — пятьдесят тысяч человек
  rationale: Масоретская последовательность чисел трудна. Тире передаёт их резкое соположение, не добавляя отсутствующего в еврейском тексте союза или предлога и не снимая неоднозначности.
- source_word: וַיִּתְאַבְּלוּ
  choice: скорбел
  rationale: Hitpael глагола אבל обозначает траур и скорбь после смерти или бедствия; «народ скорбел» естественно и достойно звучит в современном русском языке.
- source_word: מַכָּה גְדוֹלָה
  choice: великим поражением
  rationale: Существительное מַכָּה может обозначать удар, поражение или бедствие. «Великим поражением» сохраняет связь с повторяющимся глаголом «поразил» и не уточняет без основания, было ли это избиением или эпидемией.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. «Яхве» сохраняет его как имя и соответствует принятой русской научной транслитерации, не заменяя его титулом.
- issue: 'Причина кары: взгляд внутрь ковчега или на ковчег'
  choice: заглядывали в ковчег
  alternative: смотрели на ковчег
  rationale: Предлог допускает оба понимания. Основной текст следует наиболее вероятному в повествовательном контексте прочтению, но сноска сохраняет подлинную лексическую неоднозначность.
- issue: Трудная последовательность чисел погибших
  choice: сохранить масоретскую формулировку «семьдесят человек — пятьдесят тысяч человек»
  alternative: семьдесят из пятидесяти тысяч; пятьдесят тысяч семьдесят; только семьдесят
  rationale: Еврейский текст синтаксически труден, а текстовая традиция неоднородна. Перевод не должен без достаточных оснований выбирать одно согласованное число и скрывать проблему.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Избегаются устаревшие «мужи», «воззрел» и «кара великая». Начальное «И» сохраняет повествовательную связь стиха. Местоимение «Он» указывает на подразумеваемого в первой части Яхве; прописная буква служит ясности, не добавляя нового наименования.
