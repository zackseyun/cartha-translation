source:
  edition: WLC
  text: וַ/יָּשִׂ֛מוּ אֶת אֲר֥וֹן יְהוָ֖ה אֶל הָ/עֲגָלָ֑ה וְ/אֵ֣ת הָ/אַרְגַּ֗ז וְ/אֵת֙ עַכְבְּרֵ֣י הַ/זָּהָ֔ב וְ/אֵ֖ת צַלְמֵ֥י טְחֹרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/011.yaml
  text: Then they put the ark of Yahweh on the cart[a], along with the box and the gold mice and the images of their tumors.
translation:
  language: ru
  text: Затем они поставили на повозку ковчег Яхве, а также ящик, золотых мышей и изображения своих опухолей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «наростов»; возможно, «геморроидальных шишек».
    reason: Лексическое значение טְחֹרִים и точная природа обозначенного недуга остаются спорными.
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: Затем они поставили
  rationale: Форма wayyiqtol продолжает последовательность событий; «затем» естественно передаёт ход повествования, а «поставили» подходит для размещения предметов на повозке.
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: В данном культовом контексте אֲרוֹן обозначает ковчег, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: אֶל הָעֲגָלָה
  choice: на повозку
  rationale: Предлог אֶל при глаголе помещения указывает на направленное перемещение; по-русски применительно к повозке естественно сказать «поставили на повозку».
- source_word: הָאַרְגַּז
  choice: ящик
  rationale: Слово обозначает отдельный сосуд для предметов приношения; «ящик» ясно отличает его от ковчега.
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: золотых мышей
  rationale: Буквально «мышей из золота»; русское «золотых мышей» естественно обозначает материал изготовленных фигур.
- source_word: צַלְמֵי
  choice: изображения
  rationale: צֶלֶם обозначает образ или изготовленное подобие; «изображения» сохраняет общий смысл без излишней конкретизации формы предметов.
- source_word: טְחֹרֵיהֶם
  choice: своих опухолей
  rationale: Точный характер недуга остаётся спорным. «Опухоли» — достаточно широкое и понятное обозначение; возвратное «своих» естественно связывает их с действующими лицами.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה, а не титул. «Яхве» передаёт его как имя, не заменяя титулом.
- issue: Точная природа недуга טְחֹרִים
  choice: опухоли
  alternative: наросты; геморроидальные шишки
  rationale: Контекст описывает телесное поражение, однако еврейский термин не позволяет бесспорно установить точный медицинский диагноз; основной текст сохраняет более широкое значение, а варианты вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык; повествовательная фраза ясная и сдержанная. Повтор служебных конструкций еврейского оригинала сглажен, при этом полный перечень предметов сохранён. Маркер примечания поставлен непосредственно после спорного слова, к которому он относится.
