base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/017.yaml
  text: 'And these are the golden tumors that the Philistines returned as a guilt offering to Yahweh: one for Ashdod[a], one for Gaza, one for Ashkelon, one for Gath, one for Ekron.'
translation:
  language: ru
  text: 'И вот золотые опухоли[a], которые филистимляне возвратили Яхве в качестве жертвы за вину: по одной от Азота, от Газы, от Аскалона, от Гефа и от Екрона.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «золотые нарывы»; еврейское слово обозначает телесное поражение, изображённое в этих посвятительных дарах; традиционно его передают более конкретно: «геморрой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Сочетание союза с указательным местоимением вводит поясняющий перечень; «вот» естественно связывает его с предшествующим контекстом.
- source_word: טְחֹרֵי הַזָּהָב
  choice: золотые опухоли
  rationale: Существительное обозначает телесные поражения, изображения которых были изготовлены из золота. «Опухоли» передаёт смысл, не сужая его до традиционного, но более конкретного толкования «геморрой».
- source_word: אֲשֶׁר הֵשִׁיבוּ
  choice: которые ... принесли
  rationale: Каузативная форма שוב допускает значения «вернули» и «отослали обратно». Здесь золотые изображения не были прежде собственностью Яхве, поэтому в естественном русском контекстуальное «принесли ... как жертву» точнее передаёт их передачу вместе с возвращением ковчега.
- source_word: פְלִשְׁתִּים
  choice: филистимляне
  rationale: Устоявшееся русское наименование народа.
- source_word: אָשָׁם
  choice: как жертву повинности
  rationale: Термин обозначает жертву, связанную с виной и возмещением ущерба. «Жертва повинности» — понятный и укоренившийся русский библейский эквивалент.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога, не заменяя его титулом.
- source_word: לְאַשְׁדּוֹד אֶחָד ... לְעֶקְרוֹן אֶחָד
  choice: одну — за Азот ... одну — за Екрон
  rationale: Повторяющийся предлог לְ указывает на соответствие одного предмета каждому городу. Женский род числительного согласован с русским словом «опухоль»; «за» естественно выражает представительство города в составе возместительного дара.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе стоит тетраграмматон, поэтому личное имя сохранено в форме «Яхве», а не заменено титулом.
- issue: Характер אָשָׁם
  choice: жертва повинности
  alternative: жертва за вину; возместительная жертва
  rationale: Выбран традиционно узнаваемый термин, который сохраняет связь и с виной, и с обязанностью возмещения, не превращая жертву лишь в денежную компенсацию.
translation_notes:
  register: 'Современный литературный русский с библейски достойным, но ясным синтаксисом. Топонимы переданы в традиционных русских библейских формах: Азот, Газа, Аскалон, Геф, Екрон.'
