base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/006.yaml
  text: Why then do you harden your hearts[a], as Egypt and Pharaoh hardened their hearts? Was it not when he dealt harshly with them that they sent them away[b], and they went?
translation:
  language: ru
  text: Почему же вы ожесточаете свои сердца[a], как ожесточили свои сердца Египет и фараон? Разве не тогда, когда Он сурово обошёлся с ними, они отпустили их[b], и те ушли?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «делаете свои сердца тяжёлыми»; еврейский оборот означает упорство и ожесточение сердца.'
    reason: lexical_alternative
  - marker: b
    text: В выражении «обошёлся с ними» речь идёт о Египте и фараоне, а местоимения «их» и «те» относятся к израильтянам.
    reason: cross_reference
lexical_decisions:
- source_word: תְכַבְּדוּ / כִּבְּדוּ
  choice: ожесточаете / ожесточили
  rationale: Порода piel корня כבד в сочетании с «сердцем» означает буквально «делать тяжёлым», то есть делать упорным, невосприимчивым. «Ожесточать сердце» естественно передаёт этот библейский образ по-русски.
- source_word: לְבַבְכֶם / לִבָּם
  choice: свои сердца
  rationale: Слово обозначает внутренний центр воли и мышления. Множественное число естественно согласуется с обращением к нескольким людям и коллективными субъектами.
- source_word: מִצְרַיִם וּפַרְעֹה
  choice: Египет и фараон
  rationale: Сохранена метонимия исходного текста, где «Египет» обозначает египтян или египетскую власть как единое целое.
- source_word: הִתְעַלֵּל
  choice: сурово обошёлся
  rationale: В данном контексте глагол обозначает жёсткое, карающее действие против Египта. Формулировка передаёт силу выражения, не уточняя сверх текста конкретный способ действия.
- source_word: וַיְשַׁלְּחוּם
  choice: они отпустили их
  rationale: שלח здесь означает отпустить или отослать. Местоимения сохраняют лаконичность еврейского текста; их референты пояснены в сноске.
- source_word: וַיֵּלֵכוּ
  choice: те ушли
  rationale: הלך передано простым глаголом «ушли». Указательное местоимение «те» по-русски позволяет различить сменившийся субъект и избежать ошибочного отнесения действия к египтянам.
theological_decisions:
- issue: Невыраженное подлежащее при הִתְעַלֵּל
  choice: «Он» — подразумевается Бог
  alternative: 'Безличное понимание: «когда им пришлось тяжело»'
  rationale: Контекст исхода указывает на Бога, поразившего Египет, однако имя Бога в самой фразе не названо. Местоимение с прописной буквы даёт необходимое русское подлежащее, не добавляя имени.
- issue: Смена референтов местоимений во второй половине стиха
  choice: «с ними» относится к Египту и фараону; «их» и «те» — к израильтянам
  alternative: Оставить все местоименные связи полностью неразличёнными
  rationale: 'Такова последовательность исходного повествования: Бог карает Египет, египтяне отпускают Израиль, и Израиль уходит. Сноска делает смену референта явной, не перегружая основной текст.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся близким к краткой риторической структуре еврейского текста; лексическая двусмысленность образа «тяжёлого сердца» вынесена в сноску.
