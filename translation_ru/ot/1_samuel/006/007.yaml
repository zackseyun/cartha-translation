base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/007.yaml
  text: Now then[a], take and make one new cart, and two nursing cows on which no yoke has come, and hitch the cows to the cart[b], but take their calves away from them to the house.
translation:
  language: ru
  text: Итак, возьмите и сделайте одну новую повозку, а затем возьмите двух дойных коров[a], на которых никогда не надевали ярма. Запрягите коров в повозку, а их телят отведите от них в дом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «двух кормящих коров», то есть коров, у которых есть телята и которые дают молоко.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт переход к следующему практическому указанию; в современном русском естественнее, чем буквальное «и теперь».
- source_word: קְחוּ וַעֲשׂוּ
  choice: возьмите и сделайте
  rationale: Сохраняет два отдельных повеления исходного текста.
- source_word: עֲגָלָה חֲדָשָׁה אֶחָת
  choice: одну новую повозку
  rationale: Передаёт и числительное, и определение; «повозка» уместно для транспортного средства, в которое запрягают коров.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: двух дойных коров
  rationale: עָלוֹת обозначает коров, дающих молоко, что предполагает наличие телят и согласуется с последующей фразой.
- source_word: אֲשֶׁר לֹא עָלָה עֲלֵיהֶם עֹל
  choice: на которых ещё не надевали ярма
  rationale: 'Естественно передаёт еврейскую идиому «на которых не поднималось ярмо» и смысл: коров прежде не использовали как тягловых животных.'
- source_word: וַאֲסַרְתֶּם אֶת־הַפָּרוֹת בָּעֲגָלָה
  choice: Запрягите коров в повозку
  rationale: Контекстуально точное и современное русское обозначение присоединения тягловых животных к повозке.
- source_word: וַהֲשֵׁיבֹתֶם בְּנֵיהֶם מֵאַחֲרֵיהֶם הַבָּיְתָה
  choice: а их телят уведите от них домой
  rationale: Каузатив שוב передан глаголом «уведите»; בְּנֵיהֶם применительно к коровам означает «телят», а הַבָּיְתָה — направление домой.
