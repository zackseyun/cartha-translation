base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/007.yaml
  text: Now therefore[a], stand here[b], and I will contend with you before Yahweh concerning all the righteous acts of Yahweh that he did for you and for your fathers.
translation:
  language: ru
  text: Итак, предстаньте, и я вступлю с вами в разбирательство[a] перед Яхве обо всех праведных деяниях Яхве[b], которые Он совершил для вас и для ваших отцов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение имеет судебный оттенок и может также означать: «буду судить вас», «буду судиться с вами» или «стану разбирать с вами дело».'
    reason: lexical_alternative
  - marker: b
    text: «Праведные деяния» — справедливые и верные завету дела Яхве ради Своего народа.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт переход к следующей части речи и логический вывод, а не только временное «теперь».
- source_word: הִתְיַצְּבוּ
  choice: предстаньте
  rationale: Форма повелительного наклонения во множественном числе призывает слушателей занять место для формального разбирательства; «предстаньте» естественно передаёт этот оттенок.
- source_word: וְאִשָּׁפְטָה אִתְּכֶם
  choice: и я вступлю с вами в разбирательство
  rationale: Глагольная конструкция имеет судебно-процессуальный оттенок. Перевод сохраняет идею рассмотрения дела, не утверждая однозначно, что Самуил уже выносит народу приговор.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Передаёт судебное и заветное выражение «в присутствии Яхве» и сохраняет личное имя Бога.
- source_word: אֵת כָּל צִדְקוֹת יְהוָה
  choice: обо всех праведных деяниях Яхве
  rationale: Множественное צִדְקוֹת обозначает конкретные дела, являющие праведность и верность Яхве; «праведные деяния» не сужает смысл до одних лишь спасительных действий.
- source_word: אֲשֶׁר עָשָׂה אִתְּכֶם וְאֶת אֲבוֹתֵיכֶם
  choice: которые Он совершил для вас и для ваших отцов
  rationale: В данном контексте действия Яхве направлены на благо Израиля, поэтому «для» естественнее буквального «с»; «отцов» сохраняет образ исходного текста и его значение предков.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя, не подменяя его титулом.
- issue: Смысл צִדְקוֹת יְהוָה
  choice: праведные деяния Яхве
  alternative: благодеяния Яхве; спасительные дела Яхве
  rationale: Фраза указывает на исторические дела, в которых проявились праведность и верность Яхве. Выбранный вариант сохраняет смысловую связь с праведностью и не устраняет заветный и спасительный оттенки.
- issue: Роль Самуила в выражении וְאִשָּׁפְטָה אִתְּכֶם
  choice: вступлю с вами в разбирательство
  alternative: буду судить вас; буду судиться с вами; стану рассуждать с вами
  rationale: 'Формулировка сохраняет судебную образность и неоднозначность: Самуил может вести дело, разбирать его с народом или обличать народ перед Яхве, но текст не требует представлять его только как выносящего приговор судью.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Предстаньте» и «разбирательство» сохраняют формально-судебную обстановку, а повтор имени «Яхве» следует исходному тексту. Местоимение «Он» написано с прописной буквы по принятой русской религиозно-литературной норме.
