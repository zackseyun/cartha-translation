  text: וְ/עַתָּ֗ה הִנֵּ֥ה הַ/מֶּ֛לֶךְ אֲשֶׁ֥ר בְּחַרְתֶּ֖ם אֲשֶׁ֣ר שְׁאֶלְתֶּ֑ם וְ/הִנֵּ֨ה נָתַ֧ן יְהוָ֛ה עֲלֵי/כֶ֖ם מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/013.yaml
  text: And now[a], here is the king whom you have chosen, whom you have asked for; and look, Yahweh has set a king over you.
translation:
  language: ru
  text: А теперь вот царь, которого вы избрали, которого вы просили; и вот, Яхве поставил над вами царя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Яхве дал вам царя».'
    reason: Сохраняет более буквальное значение נָתַן как лексическую альтернативу к контекстуальному «поставил».
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сохраняет как связующий союз וְ, так и временно-дискурсивное עַתָּה, вводя итог слов Самуила.
- source_word: הִנֵּה
  choice: вот
  rationale: Естественно и выразительно привлекает внимание к присутствующему перед народом царю.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённость передаётся контекстом и указательной конструкцией «вот царь».
- source_word: אֲשֶׁר בְּחַרְתֶּם
  choice: которого вы избрали
  rationale: Передаёт завершённое действие народа; «избрали» уместно для выбора правителя и сохраняет достоинство регистра.
- source_word: אֲשֶׁר שְׁאֶלְתֶּם
  choice: которого вы просили
  rationale: В данном контексте שׁאל означает просить себе царя; русская конструкция естественна без добавления объекта просьбы.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет повтор частицы הִנֵּה и её функцию привлечения внимания, не создавая неестественности по-русски.
- source_word: נָתַן יְהוָה
  choice: Яхве поставил
  rationale: Буквально נָתַן — «дал», но в конструкции с עַל и царём выражает поставление над народом; основной текст передаёт контекстуальный смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно личное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: עֲלֵיכֶם
  choice: над вами
  rationale: В сочетании с царём обозначает власть правителя над народом.
- source_word: מֶלֶךְ
  choice: царя
  rationale: После «поставил над вами» винительный падеж естественно передаёт неопределённое еврейское существительное; речь идёт о том же царе.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Отношение человеческого выбора к Божьему поставлению царя
  choice: 'Сохранены оба утверждения: народ избрал и просил царя, а Яхве поставил его над народом'
  alternative: Сгладить напряжение, представив царя исключительно человеческим либо исключительно Божьим выбором
  rationale: Еврейский текст намеренно ставит рядом ответственность народа и верховное действие Яхве; перевод не должен устранять это богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной пророческой речи. Повтор «которого» и двукратное «вот» сохранены ради риторической структуры еврейского текста; архаичное «се» не используется.
