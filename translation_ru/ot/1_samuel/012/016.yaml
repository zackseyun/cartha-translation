base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/016.yaml
  text: Now then[a], stand still and see this great thing that Yahweh is doing before your eyes.
translation:
  language: ru
  text: Теперь же стойте и смотрите на это великое дело, которое Яхве[a] совершает у вас на глазах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «YHWH» (יהוה); традиционная передача: «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Итак
  rationale: Сочетание служит переходом к торжественному призыву. «Итак» естественно передаёт связующую и побудительную силу выражения; буквальное «и теперь» здесь менее естественно.
- source_word: הִתְיַצְּבוּ
  choice: встаньте
  rationale: Возвратная порода повелительной формы призывает слушателей занять место и приготовиться наблюдать. В данном контексте «встаньте» ясно и естественно; добавление «неподвижно» было бы излишним уточнением.
- source_word: וּרְאוּ
  choice: и посмотрите
  rationale: Повелительная форма приглашает непосредственно увидеть предстоящее знамение. «Посмотрите» в современном русском естественно выражает направленное внимание.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: это великое дело
  rationale: דבר допускает значения «слово», «дело», «событие». Здесь речь идёт о совершаемом Богом знамении, поэтому «дело» сохраняет достаточную широту и при этом звучит естественно.
- source_word: אֲשֶׁר יְהוָה עֹשֶׂה
  choice: которое Яхве совершает
  rationale: Причастие עֹשֶׂה представляет действие как происходящее или непосредственно начинающееся. Настоящее время сохраняет эту живость, не заменяя её однозначным будущим.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста, а не заменяет её титулом.
- source_word: לְעֵינֵיכֶם
  choice: у вас на глазах
  rationale: Русская идиома точно передаёт видимый, публичный характер Божьего действия и звучит естественнее буквального «перед вашими глазами».
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. «Яхве» сохраняет личное имя, а традиционная передача «Господь» указана в примечании как широко употребительная замена.
- issue: Временная отнесённость עֹשֶׂה
  choice: совершает
  alternative: совершит
  rationale: Еврейское причастие допускает действие, уже разворачивающееся или непосредственно предстоящее. Настоящее время сохраняет форму и риторическую непосредственность, не устраняя контекстуальную близость будущего события.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным призывом. Синтаксис краток и соответствует публичной речи Самуила; сохранена непосредственность наблюдаемого знамения.
