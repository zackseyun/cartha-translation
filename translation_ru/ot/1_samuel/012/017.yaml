reference: 1 Samuel 12:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הֲ/ל֤וֹא קְצִיר חִטִּים֙ הַ/יּ֔וֹם אֶקְרָא֙ אֶל יְהוָ֔ה וְ/יִתֵּ֥ן קֹל֖וֹת וּ/מָטָ֑ר וּ/דְע֣וּ וּ/רְא֗וּ כִּֽי רָעַתְ/כֶ֤ם רַבָּה֙ אֲשֶׁ֤ר עֲשִׂיתֶם֙ בְּ/עֵינֵ֣י יְהוָ֔ה לִ/שְׁא֥וֹל לָ/כֶ֖ם מֶֽלֶךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/017.yaml
  text: Is it not wheat harvest today? I will call to Yahweh[a], and he will send thunder and rain, so that you may know and see that your wickedness is great[b], which you have done in the sight of Yahweh by asking for yourselves a king.
translation:
  language: ru
  text: Разве сейчас не жатва пшеницы? Я воззову к Яхве, и Он пошлёт[a] гром[b] и дождь. Тогда вы узнаете и увидите, как велико зло, которое вы совершили в глазах Яхве, попросив себе царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «даст».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «голоса»; в данном контексте имеются в виду раскаты грома.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא קְצִיר חִטִּים הַיּוֹם
  choice: Разве сейчас не жатва пшеницы?
  rationale: Сохраняет риторический вопрос, ожидающий согласия, и передаёт הַיּוֹם естественным русским «сейчас» в смысле текущего времени жатвы.
- source_word: אֶקְרָא אֶל יְהוָה
  choice: Я воззову к Яхве
  rationale: «Воззову» естественно и торжественно передаёт обращение к Богу; предлог «к» отражает направленность אל.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: וְיִתֵּן
  choice: Он пошлёт
  rationale: Буквально глагол означает «даст», но применительно к грому и дождю русское «пошлёт» звучит естественнее и сохраняет смысл божественного действия.
- source_word: קֹלוֹת
  choice: гром
  rationale: Буквально форма означает «голоса/звуки», однако в метеорологическом контексте обозначает гром.
- source_word: וּדְעוּ וּרְאוּ
  choice: Тогда вы узнаете и увидите
  rationale: «Тогда» ясно передаёт следствие знамения, не устраняя сочетание двух глаголов восприятия.
- source_word: רָעַתְכֶם רַבָּה
  choice: как велико зло
  rationale: Передаёт нравственную оценку רָעָה и усиление רַבָּה; притяжательность раскрывается последующим относительным предложением о совершённом ими зле.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет образное выражение оригинала и его смысл — Божью нравственную оценку.
- source_word: לִשְׁאֹל לָכֶם מֶלֶךְ
  choice: попросив себе царя
  rationale: Естественно передаёт обстоятельство, в чём именно состоял осуждаемый поступок народа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит личное имя Бога. Форма «Яхве» сохраняет это различие и не подменяет имя титулом.
- issue: Нравственная оценка просьбы о царе
  choice: «зло, которое вы совершили… попросив себе царя»
  alternative: Смягчённое «неправильно поступили»
  rationale: Сохраняется сильная нравственная формулировка רָעָה и прямая связь зла с просьбой народа о царе, без добавления конфессионального объяснения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; образ «в глазах Яхве» сохранён из оригинала.
