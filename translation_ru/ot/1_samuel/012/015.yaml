  text: וְ/אִם לֹ֤א תִשְׁמְעוּ֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/מְרִיתֶ֖ם אֶת פִּ֣י יְהוָ֑ה וְ/הָיְתָ֧ה יַד יְהוָ֛ה בָּ/כֶ֖ם וּ/בַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/015.yaml
  text: But if you do not listen to the voice of Yahweh and rebel against the command of Yahweh[a], then the hand of Yahweh will be against you and against your fathers.
translation:
  language: ru
  text: Но если вы не будете слушаться голоса Яхве и восстанете против повеления Яхве, то рука Яхве будет против вас и против ваших отцов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский масоретский текст: «ваших отцов». В некоторых древних переводах стоит «вашего царя»; это чтение соответствует ближайшему контексту, где Самуил предостерегает и народ, и его царя.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Союз вводит условие, противопоставленное сказанному в предыдущем стихе; «но если» естественно передаёт и связь, и контраст.
- source_word: לֹא תִשְׁמְעוּ בְּקוֹל יְהוָה
  choice: вы не будете слушаться голоса Яхве
  rationale: Оборот שׁמע בְּקוֹל обозначает слушание, ведущее к послушанию. «Слушаться голоса» сохраняет еврейский образ и ясно выражает подразумеваемое повиновение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: וּמְרִיתֶם
  choice: и восстанете против
  rationale: Глагол מרה выражает сопротивление и мятеж, а не просто невыполнение; выбранная формулировка сохраняет серьёзность заветного неповиновения.
- source_word: אֶת פִּי יְהוָה
  choice: против повеления Яхве
  rationale: Буквально «уста Яхве» — идиома, обозначающая высказанное им повеление. Буквальная передача была бы неясна по-русски.
- source_word: וְהָיְתָה יַד יְהוָה
  choice: то рука Яхве будет
  rationale: Сохранён библейский образ руки как деятельной силы, здесь проявляющейся в суде; «то» ясно вводит следствие условия.
- source_word: בָּכֶם
  choice: против вас
  rationale: В контексте предупреждения предлог выражает враждебно направленное действие суда.
- source_word: וּבַאֲבֹתֵיכֶם
  choice: и против ваших отцов
  rationale: Основной текст WLC/масоретская традиция читают «ваших отцов». Необычность фразы и древнее чтение «вашего царя» отмечены в сноске, но основной текст следует предоставленному еврейскому источнику.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет различие между личным именем Бога и титулом, не привнося конфессионального истолкования.
- issue: Чтение заключительной фразы וּבַאֲבֹתֵיכֶם
  choice: и против ваших отцов
  alternative: и против вашего царя
  rationale: Основной текст следует масоретскому чтению «ваших отцов». Вариант «вашего царя» хорошо соответствует ближайшему контексту, где предупреждение относится к народу и царю, поэтому он сохранён в сноске без подмены исходного текста.
translation_notes:
  register: Современный литературный русский язык с сохранением ключевых библейских образов. Формулировка «слушаться голоса» звучит естественно и одновременно удерживает еврейскую метафору; синтаксис условного предложения сделан ясным посредством конструкции «если… то…».
