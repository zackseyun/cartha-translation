  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֤ל אֶל הָ/עָם֙ אַל תִּירָ֔אוּ אַתֶּ֣ם עֲשִׂיתֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּ֑את אַ֗ךְ אַל תָּס֨וּרוּ֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וַ/עֲבַדְתֶּ֥ם אֶת יְהוָ֖ה בְּ/כָל לְבַבְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/020.yaml
  text: And Samuel said to the people[a], “Do not be afraid. You have done all this evil. Yet do not turn aside from following Yahweh[b], but serve Yahweh with all your heart.”
translation:
  language: ru
  text: 'И сказал Самуил народу: «Не бойтесь. Вы сделали всё это зло. Но не переставайте следовать за Яхве[a], а служите Яхве всем сердцем».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Яхве — передача еврейского имени Бога יהוה (YHWH). Буквально: «не сворачивайте от следования за Яхве», то есть не переставайте следовать за Ним.'
    reason: Уточняет личное имя Бога и образный смысл еврейского выражения מֵאַחֲרֵי יהוה.
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל אֶל־הָעָם
  choice: И сказал Самуил народу
  rationale: Стандартная повествовательная формула; союз «и» сохраняет связь с предшествующим контекстом, а הָעָם обозначает собравшийся народ Израиля.
- source_word: אַל־תִּירָאוּ
  choice: Не бойтесь
  rationale: Естественный современный русский эквивалент запрета от ירא, сохраняющий прямую побудительную силу.
- source_word: אַתֶּם עֲשִׂיתֶם אֵת כָּל־הָרָעָה הַזֹּאת
  choice: Вы сделали всё это зло
  rationale: Местоимение «вы» передаёт выраженное в еврейском подлежащем акцентирование ответственности; «зло» сохраняет нравственную тяжесть רָעָה.
- source_word: אַךְ
  choice: Но
  rationale: 'В данном контексте частица вводит сильное противопоставление: совершённое зло не должно вести к дальнейшему отступлению.'
- source_word: אַל־תָּסוּרוּ מֵאַחֲרֵי יְהוָה
  choice: не отступайте от Господа
  rationale: Естественно передаёт еврейскую идиому букв. «не сворачивайте из-за/вслед за YHWH», то есть не прекращайте следовать за Ним; образ следования отмечен в сноске.
- source_word: יְהוָה
  choice: Господь
  rationale: В русском библейском регистре традиционная передача тетраграмматона титулом «Господь» наиболее узнаваема и благозвучна; сноска указывает, что в еврейском стоит личное имя YHWH.
- source_word: וַעֲבַדְתֶּם אֶת־יְהוָה
  choice: и служите Господу
  rationale: עבד в заветном контексте означает служение, включающее поклонение и верность; «служите» не сужает смысл до одного богослужебного действия.
- source_word: בְּכָל־לְבַבְכֶם
  choice: всем сердцем
  rationale: Устойчивый и естественный русский эквивалент еврейской идиомы полной внутренней преданности.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Господь с пояснением в сноске
  alternative: Яхве
  rationale: Сохраняется привычный современному русскому читателю высокий библейский регистр, при этом сноска делает исходное личное имя прозрачным и не превращает титул в скрытую замену.
- issue: Нравственный смысл רָעָה
  choice: зло
  alternative: неправда; злодеяние
  rationale: «Зло» прямо сохраняет нравственную оценку поступка народа, не ослабляя её до ошибки и не усиливая до конкретного преступления.
- issue: Связь между признанием греха и призывом к верности
  choice: Но не отступайте… и служите
  alternative: Только не отступайте… но служите
  rationale: '«Но» ясно передаёт напряжение частицы אַךְ: тяжесть уже совершённого зла признаётся, однако народ призывается не продолжать отступление, а служить Богу.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис краткий и прямой; лексика общепонятна. Формулировка сохраняет как серьёзность признанного зла, так и немедленный призыв к дальнейшей верности.
