base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/019.yaml
  text: 'Then all the people said to Samuel[a], “Pray to Yahweh your God for your servants, and do not let us die, for we have added to all our sins this evil: to ask for a king for ourselves.”'
translation:
  language: ru
  text: 'Тогда весь народ сказал Самуилу: «Помолись Яхве, Богу твоему, за рабов твоих, чтобы мы не умерли, ведь ко всем нашим грехам мы прибавили ещё и это зло: попросить себе царя».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְפַּלֵּל בְּעַד עֲבָדֶיךָ
  choice: Помолись о рабах твоих
  rationale: Императив התפלל естественно передаётся как «помолись», а בְּעַד явно придаёт молитве ходатайственный смысл. «Рабы твои» сохраняет почтительное самоназвание народа без лишнего истолкования.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, Богу твоему
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а суффикс второго лица в אֱלֹהֶיךָ сохранён как «твоему», не снимая напряжения в обращении народа к Самуилу.
- source_word: וְאַל נָמוּת
  choice: чтобы нам не умереть
  rationale: Отрицательная форма с אַל выражает желаемый исход ходатайственной молитвы. Русское «чтобы нам не умереть» естественно связывает просьбу о молитве с её целью.
- source_word: כִּי יָסַפְנוּ עַל כָּל חַטֹּאתֵינוּ רָעָה
  choice: ведь ко всем нашим грехам мы прибавили ещё и это зло
  rationale: Конструкция יסף על передаёт добавление нового проступка к уже имеющимся; «ещё и» ясно выражает накопительный смысл, а «это зло» сохраняет нравственную весомость רָעָה.
- source_word: לִשְׁאֹל לָנוּ מֶלֶךְ
  choice: попросили себе царя
  rationale: Инфинитив называет содержание признанного зла. По-русски личная форма после двоеточия звучит естественно, а «себе» точно передаёт לָנוּ.
theological_decisions:
- issue: Выражение «Яхве, Богу твоему» в просьбе народа к Самуилу
  choice: 'Сохранить второе лицо: «Богу твоему»'
  alternative: «Богу нашему» либо пояснительное расширение
  rationale: Еврейский текст подчёркивает обращение к Самуилу как ходатаю. Сохранение «твоему» удерживает риторическое и духовное напряжение, не утверждая при этом, будто Яхве не является Богом Израиля.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для обычного читателя; архаические формы избегаются, кроме уместного почтительного оборота «рабы твои».
