base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/018.yaml
  text: Then Samuel called to Yahweh[a], and Yahweh sent thunder and rain that day; and all the people greatly feared Yahweh and Samuel.
translation:
  language: ru
  text: И воззвал Самуил к Яхве, и Яхве послал в тот день гром[a] и дождь. И весь народ сильно убоялся Яхве и Самуила.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «голоса»; в контексте бури имеются в виду раскаты грома.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: воззвал
  rationale: В сочетании с אֶל־יְהוָה глагол обозначает обращение к Богу с призывом или молитвой; «воззвал» сохраняет прямоту и торжественный библейский регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וַיִּתֵּן
  choice: послал
  rationale: Буквально «дал»; применительно к грому и дождю естественное русское соответствие «послал» передаёт причиняющее действие Бога.
- source_word: קֹלֹת
  choice: гром
  rationale: Буквально множественное число «голоса, звуки», но в контексте бури и вместе с дождём слово обозначает гром; примечание сохраняет буквальную образность.
- source_word: וּמָטָר
  choice: и дождь
  rationale: Прямое соответствие существительному מָטָר без добавления невыраженной интенсивности.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественно и точно передаёт временное указание.
- source_word: וַיִּירָא ... מְאֹד
  choice: сильно убоялся
  rationale: Сохраняет значение страха и усилитель מְאֹד; форма единственного числа согласуется с собирательным «народ».
- source_word: כָל הָעָם
  choice: весь народ
  rationale: Естественное русское обозначение полной совокупности народа.
- source_word: אֶת יְהוָה וְאֶת שְׁמוּאֵל
  choice: Яхве и Самуила
  rationale: Один и тот же глагол относится к обоим объектам, как в еврейском тексте; перевод не разделяет страх перед Богом и почтение к пророку.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя.
- issue: Страх перед Яхве и Самуилом
  choice: убоялся Яхве и Самуила
  alternative: убоялся Яхве и проникся почтением к Самуилу
  rationale: Еврейский текст употребляет один глагол ירא по отношению к обоим и тем самым оставляет смысловое напряжение; перевод его не устраняет и не уравнивает их статус пояснением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Воззвал» и «убоялся» выбраны ради достоинства и смысловой ёмкости; синтаксис разделён на два предложения для ясности.
