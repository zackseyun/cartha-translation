id: 1SA.12.25
reference: 1 Samuel 12:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִם הָרֵ֖עַ תָּרֵ֑עוּ גַּם אַתֶּ֥ם גַּֽם מַלְכְּ/כֶ֖ם תִּסָּפֽוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/025.yaml
  text: But if you persist in doing evil[b][a], both you and your king will be swept away.
translation:
  language: ru
  text: Но если вы и впредь будете делать зло[a], то и вы, и ваш царь погибнете[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будете поступать нечестиво». В еврейском тексте действие усилено сочетанием абсолютного инфинитива с личной формой глагола.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будете уничтожены»; «будете сметены».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Союз вводит условие, противопоставленное предшествующему обещанию; «но если» естественно передаёт этот контраст по-русски.
- source_word: הָרֵעַ תָּרֵעוּ
  choice: вы и впредь будете делать зло
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает действие. «И впредь будете» в данном контексте естественно передаёт настойчивое продолжение зла, не воспроизводя неестественный для русского языка повтор.
- source_word: גַּם אַתֶּם גַּם מַלְכְּכֶם
  choice: и вы, и ваш царь
  rationale: Повтор גַּם включает в предупреждение обе стороны; парная русская конструкция сохраняет это распределительное ударение.
- source_word: תִּסָּפוּ
  choice: погибнете
  rationale: Нифаль глагола ספה обозначает гибель, уничтожение или устранение под судом. «Погибнете» ясно и естественно передаёт итог, не уточняя способ суда.
theological_decisions:
- issue: Характер объявленного суда над народом и царём
  choice: Общее предупреждение о гибели, относящееся и к народу, и к царю
  alternative: Только военное поражение; только духовная гибель; буквальное «будете сметены»
  rationale: Сам стих не уточняет форму суда. Формулировка «погибнете» сохраняет серьёзность предупреждения, не сужая его до конкретного вида наказания.
translation_notes:
  register: Современный литературный русский язык; тон краткий, торжественный и предостерегающий. Синтаксис сохраняет условие и подчёркнутое включение как народа, так и царя.
