  text: וַ/יֹּ֣אמְר֔וּ לֹ֥א עֲשַׁקְתָּ֖/נוּ וְ/לֹ֣א רַצּוֹתָ֑/נוּ וְ/לֹֽא לָקַ֥חְתָּ מִ/יַּד אִ֖ישׁ מְאֽוּמָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/004.yaml
  text: And they said[a], “You have not oppressed us, and you have not mistreated us, and you have not taken anything from any man's hand.”
translation:
  language: ru
  text: 'И они сказали: «Ты не притеснял нас, не обращался с нами жестоко и ничего ни у кого не брал[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не брал ничего из руки какого-либо человека». Возможно, имеются в виду плата, подарок или взятка.'
    reason: Сноска сохраняет конкретную еврейскую идиому и отмечает вероятный смысл, не превращая его в однозначное утверждение основного текста.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И они сказали
  rationale: Последовательная форма wayyiqtol продолжает повествование; союз «и» естественно передаёт связь с предыдущей репликой.
- source_word: עֲשַׁקְתָּנוּ
  choice: ты не притеснял нас
  rationale: Глагол עשׁק обозначает притеснение, эксплуатацию или вымогательство посредством власти; «притеснял» сохраняет широкий общественно-правовой смысл.
- source_word: רַצּוֹתָנוּ
  choice: не обращался с нами жестоко
  rationale: Глагол רצץ буквально связан с сокрушением, а здесь метафорически указывает на жестокое, подавляющее обращение. Такой перевод сохраняет силу образа без неестественного для данного контекста буквального «не сокрушал нас».
- source_word: לָקַחְתָּ מִיַּד אִישׁ מְאוּמָה
  choice: ничего ни у кого не брал
  rationale: Выражение буквально говорит о взятии чего-либо «из руки» человека. В русском эта идиома естественно передаётся как «брать у кого-либо»; конкретный предмет намеренно не назван.
- source_word: אִישׁ
  choice: ни у кого
  rationale: В отрицательной конструкции это естественный русский эквивалент неопределённого אִישׁ со значением «у какого-либо человека».
- source_word: מְאוּמָה
  choice: ничего
  rationale: В отрицательном предложении מְאוּמָה означает «что-либо вообще»; нормативный русский эквивалент — «ничего».
