source:
  edition: WLC
  text: כִּ֠י לֹֽא יִטֹּ֤שׁ יְהוָה֙ אֶת עַמּ֔/וֹ בַּ/עֲב֖וּר שְׁמ֣/וֹ הַ/גָּד֑וֹל כִּ֚י הוֹאִ֣יל יְהוָ֔ה לַ/עֲשׂ֥וֹת אֶתְ/כֶ֛ם ל֖/וֹ לְ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/022.yaml
  text: For Yahweh will not forsake his people[a], for the sake of his great name[b], because Yahweh has been pleased to make you his people.
translation:
  language: ru
  text: Ведь Яхве не оставит Свой народ[a] ради Своего великого имени, потому что Яхве благоволил сделать вас Своим народом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не покинет»; «не отвергнет».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «сделать вас народом для Себя».'
    reason: literal_rendering
lexical_decisions:
- source_word: יִטֹּשׁ
  choice: не оставит
  rationale: Глагол נטש здесь означает оставить или покинуть; «не оставит» естественно звучит по-русски и сохраняет вес заветного обещания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: עַמּוֹ
  choice: Свой народ
  rationale: עַם обозначает народ как общность, в данном контексте принадлежащую Яхве; возвратное притяжательное «Свой» естественно соотносится с подлежащим.
- source_word: בַּעֲבוּר שְׁמוֹ הַגָּדוֹל
  choice: ради Своего великого имени
  rationale: «Ради» ясно передаёт значение основания или мотива, а «великое имя» сохраняет еврейский образ Божьего имени, то есть Его явленной чести и славы.
- source_word: הוֹאִיל
  choice: благоволил
  rationale: В этой конструкции глагол выражает добровольное, благосклонное решение; «благоволил» сохраняет этот оттенок, не сводя его просто к выбору.
- source_word: לַעֲשׂוֹת אֶתְכֶם לוֹ לְעָם
  choice: сделать вас Своим народом
  rationale: Формулировка прямо передаёт действие, которым Израиль становится народом, принадлежащим Яхве, и естественно выражает לוֹ.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога; «Яхве» сохраняет личное заветное имя, не подменяя его титулом.
- issue: Оттенок הוֹאִיל как основания Божьей верности
  choice: благоволил
  alternative: решил; избрал; пожелал
  rationale: Форма указывает на добровольное и благосклонное решение Яхве. «Благоволил» сохраняет эту богословскую напряжённость, не вводя более узкого учения об избрании.
- issue: Связь Божьей верности с Его великим именем
  choice: ради Своего великого имени
  alternative: из-за Своего великого имени
  rationale: Выражение сохраняет утверждение текста, что Божье действие обусловлено заботой о Его имени, не уточняя сверх текста, как именно имя служит основанием.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским регистром. «Благоволил» употреблено осознанно: слово понятно в религиозно-литературной речи и точнее нейтрального «решил» передаёт добровольную благосклонность. Прописные буквы в «Свой/Своего» следуют принятому русскому благоговейному оформлению местоимений, относящихся к Богу.'
