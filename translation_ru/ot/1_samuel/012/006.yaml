base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/006.yaml
  text: Then Samuel said to the people[b][a], “Yahweh is the one who appointed Moses and Aaron and who brought your fathers up from the land of Egypt.”
translation:
  language: ru
  text: 'Тогда Самуил сказал народу: «Яхве — тот, кто поставил[a] Моисея и Аарона и вывел ваших отцов[b] из земли Египта».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделал Моисея и Аарона». Здесь еврейский глагол, вероятно, означает, что Яхве поставил или утвердил их в порученном им служении.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ваших предков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда Самуил сказал
  rationale: Последовательный вав продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: אֶל הָעָם
  choice: народу
  rationale: Прямой и естественный перевод предложного сочетания с определённым существительным.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֲשֶׁר עָשָׂה אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Тот, Кто поставил Моисея и Аарона
  rationale: Буквальное «сделал Моисея и Аарона» по-русски может быть ошибочно понято как указание на их сотворение. В данном историческом контексте глагол обозначает установление их в порученном служении; «поставил» сохраняет эту мысль.
- source_word: וַאֲשֶׁר הֶעֱלָה
  choice: и вывел
  rationale: Каузативная форма עלה буквально означает «поднял/вывел»; в контексте исхода естественное русское соответствие — «вывел».
- source_word: אֶת אֲבֹתֵיכֶם
  choice: ваших отцов
  rationale: Сохраняет конкретную мужскую форму исходного текста; в контексте слово может обозначать предков в более широком смысле.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Сохраняет упоминание «земли» и традиционную, понятную русскую форму выражения исхода.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» позволяет не подменять его титулом.
- issue: Значение עָשָׂה применительно к Моисею и Аарону
  choice: поставил Моисея и Аарона
  alternative: сделал Моисея и Аарона
  rationale: Контекст говорит о Божьем действии, которым Моисей и Аарон были утверждены как вожди Израиля, а не об их сотворении; при этом буквальная возможность отмечена в сноске.
- issue: Безглагольная конструкция יְהוָה אֲשֶׁר
  choice: Яхве — Тот, Кто…
  alternative: Яхве, Который…
  rationale: Такая формулировка естественно передаёт отождествительно-эмфатическую силу еврейской конструкции, не добавляя отдельного смыслового действия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конструкция «Яхве — Тот, Кто» передаёт акцент безглагольной еврейской фразы; оборот «из земли Египетской» сохраняет торжественную формулу исхода и остаётся понятным современному читателю.
