base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/003.yaml
  text: 'Here I am[a]; testify against me before Yahweh and before his anointed: whose ox have I taken, or whose donkey have I taken? Whom have I oppressed? Whom have I mistreated? From whose hand have I taken a bribe[b], that I should hide my eyes with it? I will restore it to you.'
translation:
  language: ru
  text: 'Вот я. Свидетельствуйте против меня перед Яхве и перед Его помазанником: чьего быка я взял? Чьего осла я взял? Кого я притеснял? Кого я сокрушал[a]? У кого я взял взятку[b], чтобы за неё закрыть глаза? Я возмещу вам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский глагол имеет неясное значение; возможны переводы: «с кем я поступил жестоко?» или «кого я обидел?»'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «взятка», может также означать «выкуп» или «плату»; образ закрытых глаз указывает здесь на подкуп, заставляющий не замечать неправды.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Вот я
  rationale: Естественная русская формула публичного самопредъявления, сохраняющая готовность Самуила ответить на обвинения.
- source_word: עֲנוּ בִי
  choice: Свидетельствуйте против меня
  rationale: В публично-судебном контексте глагол означает выступить с ответом или свидетельством против говорящего.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: מְשִׁיחוֹ
  choice: Его помазанником
  rationale: В данном историческом контексте речь идёт о помазанном царе; перевод сохраняет титул, не превращая его в прямое мессианское обозначение.
- source_word: עָשַׁקְתִּי
  choice: я притеснял
  rationale: Передаёт социальное и имущественное угнетение, не сужая значение до одного лишь мошенничества или вымогательства.
- source_word: רַצּוֹתִי
  choice: я сокрушал
  rationale: Сохраняет вероятный образ жестокого подавления и отличает трудный глагол от предшествующего עָשַׁקְתִּי; неопределённость пояснена в сноске.
- source_word: כֹפֶר
  choice: взятку
  rationale: Хотя слово может означать выкуп или плату, упоминание закрытых глаз указывает здесь на платёж, побуждающий не замечать неправды.
- source_word: וְאַעְלִים עֵינַי בּוֹ
  choice: чтобы из-за неё закрыть глаза
  rationale: Сохраняет образ закрытых глаз и естественно выражает мысль о намеренном игнорировании неправды вследствие полученной платы.
- source_word: וְאָשִׁיב לָכֶם
  choice: Я возмещу вам
  rationale: Непереходное по форме обещание в контексте предполагает возвращение или возмещение незаконно взятого; русский перевод естественно сохраняет неуказанный предмет.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя; «Яхве» передаёт его непосредственно, не заменяя титулом.
- issue: Значение מְשִׁיחוֹ
  choice: Его помазанником
  alternative: Его Мессией
  rationale: Непосредственный референт — помазанный царь Саул. Нарицательное «помазанник» сохраняет исторический смысл и связь с мессианской лексикой без преждевременного отождествления.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной судебной речи. Повтор риторических вопросов сохранён; архаизмы и конфессионально окрашенные подстановки устранены.
