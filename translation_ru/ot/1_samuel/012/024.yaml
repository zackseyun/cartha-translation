    issue: Передача עִמָּכֶם как «для вас» в основном тексте
    rationale: «Для вас» — допустимое контекстуальное истолкование, но оно не сохраняет исходное «с вами» и снимает лексическую особенность, которую английский POB оставляет в основном тексте. Основной текст следует привести к еврейской формулировке; «для вас» указать как контекстуальную альтернативу в примечании.
  - severity: low
    issue: Связка «ведь посмотрите»
    rationale: Она понятна, но «ибо посмотрите» лучше передаёт объяснительное כִּי в возвышенном литературном регистре.
