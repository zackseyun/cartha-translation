base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/024.yaml
  text: Only fear Yahweh and serve him faithfully with all your heart[a], for consider what great things he has done with you.
translation:
  language: ru
  text: Только бойтесь Яхве и верно служите Ему всем сердцем, ибо посмотрите, какие великие дела Он совершил с вами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для вас»; буквально: «с вами».'
    reason: Предлог עִם буквально означает «с»; в этом контексте он может также передавать смысл Божьих деяний ради народа.
lexical_decisions:
- source_word: אַךְ
  choice: Только
  rationale: Частица ограничивает и подчёркивает единственно должный ответ народа после предшествующего предостережения.
- source_word: יְרָאוּ
  choice: бойтесь
  rationale: Сохраняет библейский образ страха перед Богом, включающий благоговение и послушание, не сводя его лишь к почтению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: и служите Ему
  rationale: Глагол עבד означает «служить» и здесь охватывает поклонение и верное исполнение обязательств перед Богом.
- source_word: בֶּאֱמֶת
  choice: верно
  rationale: В данном призыве אֱמֶת выражает искреннюю и стойкую верность; «верно» естественно передаёт это значение по-русски.
- source_word: בְּכָל לְבַבְכֶם
  choice: всем сердцем
  rationale: Естественная русская передача еврейской идиомы полной внутренней преданности.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание для предшествующего призыва.
- source_word: רְאוּ
  choice: посмотрите
  rationale: Сохраняет повелительную форму и образ «увидеть», подразумевающий осознанное рассмотрение Божьих деяний.
- source_word: אֵת אֲשֶׁר הִגְדִּל
  choice: какие великие дела Он совершил
  rationale: Идиоматически передаёт каузативную форму גדל, обозначающую совершение великого.
- source_word: עִמָּכֶם
  choice: для вас
  rationale: В контексте Божьих благодеяний это естественная русская передача смысла; буквальное «с вами» сохранено в примечании как подлинная лексическая возможность.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; форма «Яхве» прямо передаёт тетраграмматон и не подменяет его титулом.
- issue: Смысл страха перед Богом
  choice: бойтесь
  alternative: благоговейте
  rationale: «Бойтесь» сохраняет напряжение исходного выражения и его традиционный библейский образ, тогда как «благоговейте» могло бы чрезмерно смягчить значение.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и слегка возвышенным библейским звучанием. Порядок слов сделан естественным для русского, при этом сохранены повелительные формы, личное имя Яхве и богословски значимый образ страха перед Богом.
