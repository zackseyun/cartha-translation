revisions:
- from: Только бойтесь Яхве и верно служите Ему всем сердцем, ведь посмотрите, какие великие дела Он совершил для вас[a].
  to: Только бойтесь Яхве и верно служите Ему всем сердцем, ибо посмотрите, какие великие дела Он совершил с вами[a].
  rationale: Исправление возвращает в основной текст соответствие еврейскому עִמָּכֶם («с вами»), сохраняя естественную, хотя и слегка возвышенную библейскую русскую фразу. Альтернативное контекстуальное понимание «для вас» перенесено в примечание. «Ведь» заменено на «ибо» для более точной и стилистически цельной передачи כִּי.
