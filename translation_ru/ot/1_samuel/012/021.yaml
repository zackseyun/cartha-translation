  text: וְ/לֹ֖א תָּס֑וּרוּ כִּ֣י אַחֲרֵ֣י הַ/תֹּ֗הוּ אֲשֶׁ֧ר לֹֽא יוֹעִ֛ילוּ וְ/לֹ֥א יַצִּ֖ילוּ כִּי תֹ֥הוּ הֵֽמָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/021.yaml
  text: And do not turn aside after worthless things that cannot profit or deliver[b][a], for they are worthless.
translation:
  language: ru
  text: И не уклоняйтесь, следуя за пустыми вещами[a], которые не могут ни принести пользы, ни избавить[b], ибо они — пустота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за тщетными вещами», «за ничтожными вещами»; вероятно, имеются в виду идолы или другие ложные предметы упования. Еврейское слово означает пустоту, тщетность или нечто лишённое содержания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «спасти», «выручить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּסוּרוּ
  choice: уклоняйтесь
  rationale: Глагол סור означает отклоняться, отходить или сворачивать; «уклоняться» сохраняет образ отступления от верного пути и верности Господу.
- source_word: אַחֲרֵי
  choice: вслед за
  rationale: Передаёт буквальное значение «за, вслед за» и в данном контексте выражает следование за ложным предметом упования.
- source_word: הַתֹּהוּ / תֹהוּ
  choice: то, что пусто / пустота
  rationale: תֹהוּ обозначает пустоту, тщетность и нечто лишённое реального содержания или пользы. Абстрактная формулировка сохраняет широту еврейского слова и его повтор, не сужая значение до одних лишь идолов.
- source_word: אֲשֶׁר לֹא יוֹעִילוּ
  choice: не может ни принести пользы
  rationale: Передаёт практическую бесполезность названного «пустого»; модальная конструкция естественно выражает его неспособность помочь.
- source_word: וְלֹא יַצִּילוּ
  choice: ни избавить
  rationale: В породе хифиль נצל обычно означает избавлять или спасать от опасности; «избавить» хорошо соответствует ветхозаветному контексту освобождения.
- source_word: הֵמָּה
  choice: оно
  rationale: Еврейское местоимение имеет форму множественного числа и соотносится с подразумеваемыми пустыми предметами; в русском согласование в единственном числе обусловлено собирательной конструкцией «то, что пусто», без изменения смысла.
theological_decisions:
- issue: К чему относится «пустое»
  choice: Сохранена общая ссылка на всё пустое и тщетное как на ложный предмет упования.
  alternative: Передать конкретно как «идолы» или «ложные боги».
  rationale: Контекст позволяет понимать идолов, однако תֹהוּ — более широкое слово. Неспецифический перевод не вносит в текст отсутствующего в нём уточнения.
- issue: Число подразумеваемого предмета
  choice: Еврейское множественное число передано русской собирательной конструкцией единственного числа.
  alternative: «Пустые вещи, которые… потому что они пусты».
  rationale: Так по-русски естественнее выражается абстрактное תֹהוּ, при этом сохраняются его собирательный смысл и повтор в конце стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «пусто — пустота» намеренно воспроизводит повтор תֹהוּ; конструкция остаётся понятной без конфессионального уточнения «идолы».
