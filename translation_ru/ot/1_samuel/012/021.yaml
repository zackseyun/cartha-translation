  naturalness: «То, что пусто» и «оно — пустота» понятны, но звучат несколько тяжеловесно и создают менее ясную отсылку, чем естественное «пустые вещи... они — пустота». Конструкция с множественным числом современна и литературна.
  terminology: «Пустые вещи» сохраняет намеренную неспецифичность תֹהוּ и не подменяет его более узким «идолы». «Избавить» уместно для נצל; «польза» хорошо передаёт יעל. Примечание следует согласовать с множественным числом основного текста.
