  text: גַּ֣ם אָנֹכִ֗י חָלִ֤ילָ/ה לִּ/י֙ מֵ/חֲטֹ֣א לַֽ/יהוָ֔ה מֵ/חֲדֹ֖ל לְ/הִתְפַּלֵּ֣ל בַּעַדְ/כֶ֑ם וְ/הוֹרֵיתִ֣י אֶתְ/כֶ֔ם בְּ/דֶ֥רֶךְ הַ/טּוֹבָ֖ה וְ/הַ/יְשָׁרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/023.yaml
  text: As for me[a], far be it from me that I should sin against Yahweh by ceasing to pray for you[c][b]; and I will instruct you in the good and upright way.
translation:
  language: ru
  text: А что до меня — да не будет того, чтобы я согрешил против Яхве, перестав молиться за вас! Я буду наставлять вас на добрый и прямой путь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «учить вас доброму и прямому пути». Еврейский глагол может означать как обучение, так и руководство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: А что до меня
  rationale: Передаёт подчёркнутое противопоставление Самуила народу и естественно звучит по-русски.
- source_word: חָלִילָה לִּי
  choice: да не будет того
  rationale: Выражает сильное отвержение самой мысли о таком поступке, сохраняя возвышенный, но понятный регистр.
- source_word: מֵחֲטֹא לַיהוָה
  choice: чтобы я согрешил против Яхве
  rationale: Прямо сохраняет представленное в еврейском тексте понимание этого отказа как греха против Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное божественное имя, а не заменяет его титулом.
- source_word: מֵחֲדֹל לְהִתְפַּלֵּל בַּעַדְכֶם
  choice: перестав молиться за вас
  rationale: Точно выражает прекращение ходатайственной молитвы за народ.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: Я буду наставлять вас
  rationale: Глагол в породе хифиль охватывает обучение и направление; «наставлять» естественно соединяет оба оттенка.
- source_word: בְּדֶרֶךְ הַטּוֹבָה וְהַיְשָׁרָה
  choice: на добрый и прямой путь
  rationale: Русское управление «наставлять на путь» естественно; «прямой» сохраняет образ пути и одновременно нравственный смысл יָשָׁר.
theological_decisions:
- issue: Представлен ли отказ Самуила от ходатайства лишь как неисполнение обязанности или как грех против Бога
  choice: Как грех против Яхве
  alternative: Как простое неисполнение обязанности вождя
  rationale: Еврейский текст прямо говорит о грехе против Яхве, поэтому эту богословскую тяжесть нельзя смягчать.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Образ нравственного пути в הַטּוֹבָה וְהַיְשָׁרָה
  choice: добрый и прямой путь
  alternative: добрый и правильный путь
  rationale: «Прямой» сохраняет метафору нравственной прямоты, не устраняя образность исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией. Восклицание передаёт силу идиомы חָלִילָה לִּי; архаические обороты сведены к минимуму. Маркер сноски поставлен после всего смыслового оборота, к которому относится лексическая альтернатива.
