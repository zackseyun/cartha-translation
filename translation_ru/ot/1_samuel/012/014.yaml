base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/014.yaml
  text: If you fear Yahweh and serve him and listen to his voice and do not rebel against the command of Yahweh[b][a], then both you and the king who reigns over you will follow Yahweh your God.
translation:
  language: ru
  text: Если вы будете бояться Яхве, служить Ему, слушать Его голос[b] и не восставать против повеления Яхве, то и вы, и царь, который царствует над вами, будете следовать за Яхве, вашим Богом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и будете и вы, и царь, который царствует над вами, за Яхве, вашим Богом». Смысл, по-видимому, в том, что и народ, и царь останутся верны Яхве и будут следовать за Ним.'
    reason: alternative_reading
  - marker: b
    text: 'Выражение «слушать Его голос» может также означать «слушаться Его голоса»: в еврейском языке такое слушание часто подразумевает послушание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Союз вводит реальное условие в рамках заветного увещевания.
- source_word: תִּירְאוּ אֶת־יְהוָה
  choice: будете бояться Яхве
  rationale: Глагол ירא здесь выражает благоговейный страх перед Богом; «бояться» сохраняет силу и традиционную библейскую образность исходного слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: служить Ему
  rationale: עבד применительно к Богу включает поклонение, но «служить» точнее сохраняет широкий смысл еврейского глагола.
- source_word: וּשְׁמַעְתֶּם בְּקֹלוֹ
  choice: слушать Его голос
  rationale: Сохранён образ слышания голоса; в данном обороте слушание подразумевает также послушание, что отмечено в сноске.
- source_word: וְלֹא תַמְרוּ אֶת־פִּי יְהוָה
  choice: не восставать против повеления Яхве
  rationale: מרה обозначает мятежное противление, а буквально «уста Яхве» по контексту означает высказанное Им повеление.
- source_word: גַּם אַתֶּם וְגַם הַמֶּלֶךְ
  choice: и вы, и царь
  rationale: Парная конструкция גַּם ... וְגַם естественно передаётся русским «и ... и».
- source_word: אֲשֶׁר מָלַךְ עֲלֵיכֶם
  choice: который царствует над вами
  rationale: Форма перфекта обозначает вступившего на престол и ныне правящего царя; настоящее время естественно передаёт его положение.
- source_word: וִהְיִתֶם ... אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: то ... будете следовать за Яхве, вашим Богом
  rationale: Буквальное «будете ... за Яхве» по-русски неясно; «следовать за» передаёт верность и приверженность, обычно выражаемые сочетанием אַחַר с лицом.
theological_decisions:
- issue: Смысл заключительной фразы וִהְיִיתֶם ... אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: «то и вы, и царь ... будете следовать за Яхве, вашим Богом»
  alternative: 'Буквально: «и будете и вы, и царь ... за Яхве, вашим Богом»; точная синтаксическая связь в масоретском тексте остаётся несколько неясной.'
  rationale: Положительное понимание как продолжения верности Яхве соответствует употреблению אַחַר в значении следования за кем-либо, однако сноска сохраняет необычность и неоднозначность буквальной конструкции.
- issue: Передача имени יהוה
  choice: «Яхве»
  alternative: «Господь»
  rationale: Текст содержит личное имя Бога; транслитерация отличает имя от титула и не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского увещевания. Синтаксис условия сделан ясным посредством «если ... то», при этом образность «слушать голос» и необычность заключительной еврейской конструкции сохранены в основном тексте и сносках.
