base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/008.yaml
  text: When Jacob came into Egypt[a], your fathers cried out to Yahweh, and Yahweh sent Moses and Aaron[b], and they brought your fathers out of Egypt and settled them in this place.
translation:
  language: ru
  text: Когда Иаков пришёл в Египет, ваши отцы[a] воззвали к Яхве, и Яхве послал Моисея и Аарона. Они вывели ваших отцов из Египта и поселили их в этом месте[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваши предки».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дали им поселиться здесь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר בָּא יַעֲקֹב מִצְרָיִם
  choice: Когда Иаков пришёл в Египет
  rationale: כַּאֲשֶׁר вводит временное придаточное; «когда» естественно передаёт его функцию. בָּא означает прибытие или вхождение, а русское «пришёл в Египет» сохраняет направленность движения.
- source_word: וַיִּזְעֲקוּ
  choice: воззвали
  rationale: זעק обозначает настойчивый крик о помощи. «Воззвали» передаёт одновременно бедственное положение и обращение к Богу, сохраняя достойный библейский регистр.
- source_word: אֲבוֹתֵיכֶם
  choice: ваши отцы
  rationale: Буквальное значение — «ваши отцы». Оно сохраняет историко-заветную риторику речи Самуила; более обобщённое «ваши предки» указано в примечании.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя Бога, стоящее в еврейском тексте, а не заменено титулом.
- source_word: וַיּוֹצִיאוּ
  choice: они вывели
  rationale: Каузативная форма יצא означает «вывести». Подлежащими множественного числа естественно выступают Моисей и Аарон, названные непосредственно перед этим.
- source_word: וַיֹּשִׁבוּם בַּמָּקוֹם הַזֶּה
  choice: поселили их на этом месте
  rationale: Каузативная форма ישׁב означает «дать жить, поселить». Формулировка сохраняет указательное выражение «это место», не сводя его просто к наречию «здесь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В стихе дважды употреблено собственное заветное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Деятели исхода в форме וַיּוֹצִיאוּ
  choice: 'Моисей и Аарон как непосредственные деятели: «они вывели»'
  alternative: Бог как подразумеваемый главный Избавитель
  rationale: 'Грамматически глагол стоит во множественном числе и отсылает к Моисею и Аарону. При этом контекст сохраняет первенство Божьего действия: Яхве послал их; перевод не устраняет эту богословскую взаимосвязь.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Воззвали» уместно передаёт настойчивую мольбу, не становясь архаизмом; синтаксис разделён на два предложения для ясности. Все местоименные связи оставлены прозрачными.
