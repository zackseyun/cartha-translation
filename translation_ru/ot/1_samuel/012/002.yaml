  yaml_path: translation/ot/1_samuel/012/002.yaml
  text: And now[a], look, the king is walking before you, and I have grown old and gray, and here are my sons with you[c][b]. And I have walked before you from my youth until this day.
translation:
  language: ru
  text: 'И теперь[a] вот: царь ходит перед вами, и я состарился и поседел[b]; и вот, мои сыновья с вами. И я ходил перед вами[c] от юности моей до этого дня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А теперь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «я состарился и стал седым».'
    reason: lexical_alternative
  - marker: c
    text: Выражение «ходить перед вами» может обозначать публичное руководство народом. Здесь Самуил намеренно описывает свою роль теми же словами, что и роль царя.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет как соединительную силу ו, так и переход к нынешнему положению дел.
- source_word: הִנֵּה
  choice: вот
  rationale: Современное и естественное указательное слово, привлекающее внимание без архаического оттенка.
- source_word: מִתְהַלֵּךְ לִפְנֵיכֶם
  choice: ходит перед вами
  rationale: Сохраняет образное еврейское выражение и форму причастия, обозначающую нынешнюю продолжающуюся общественную роль царя.
- source_word: זָקַנְתִּי וָשַׂבְתִּי
  choice: я состарился и поседел
  rationale: Передаёт достигнутое состояние и прямо сохраняет образ седины.
- source_word: וּבָנַי הִנָּם אִתְּכֶם
  choice: вот и сыновья мои — с вами
  rationale: Частица הִנָּם имеет презентационную силу; конструкция естественно подчёркивает присутствие сыновей среди народа.
- source_word: הִתְהַלַּכְתִּי לִפְנֵיכֶם
  choice: Я же ходил перед вами
  rationale: Повтор того же выражения сохраняет намеренную параллель между общественным служением Самуила и нынешней ролью царя.
- source_word: מִנְּעֻרַי עַד הַיּוֹם הַזֶּה
  choice: от юности моей до этого дня
  rationale: Точно передаёт временной промежуток от ранних лет Самуила до момента речи и сохраняет достоинство библейского регистра.
theological_decisions:
- issue: Значение выражения «ходить перед» применительно к царю и Самуилу
  choice: Сохранено буквальное образное выражение «ходить перед вами»
  alternative: «вести вас» / «быть вашим предводителем»
  rationale: Идиома может указывать на публичное руководство, но буквальная передача сохраняет многозначность и риторическую параллель, не сводя роль Самуила и царя к одному узкому определению.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены координация исходного текста, образ «ходить перед» и риторическая параллель; архаизмы вроде «се» не используются.
