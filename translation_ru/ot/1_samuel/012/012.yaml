base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/012.yaml
  text: When you saw that Nahash king of the Ammonites was coming against you[a], you said to me, ‘No, but a king shall reign over us’—though Yahweh your God was your king.
translation:
  language: ru
  text: 'Когда вы увидели, что Наас, царь аммонитян, идёт против вас, вы сказали мне: «Нет, пусть над нами царствует царь», — хотя Господь, ваш Бог, был вашим Царём[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь, ваш Бог, — ваш Царь». В еврейском тексте в этой части предложения нет выраженного глагола, поэтому из контекста можно подразумевать как прошедшее, так и настоящее время.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ
  choice: Когда вы увидели
  rationale: Последовательная форма с ראה здесь вводит обстоятельство, побудившее народ потребовать царя; временная связь естественно передаётся союзом «когда».
- source_word: נָחָשׁ
  choice: Наас
  rationale: Употреблена традиционная русская библейская форма имени, остающаяся узнаваемой для широкого читателя.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: царь аммонитян
  rationale: Естественная русская передача этнического обозначения в сопряжённой конструкции.
- source_word: בָּא עֲלֵיכֶם
  choice: идёт против вас
  rationale: Сочетание בוא с עַל в военном контексте обозначает враждебное наступление; форма настоящего времени передаёт происходившее на глазах приближение.
- source_word: לֹא כִּי
  choice: Нет, пусть
  rationale: «Нет» сохраняет решительное возражение, а последующая конструкция с «пусть» естественно выражает настойчивое требование народа.
- source_word: מֶלֶךְ יִמְלֹךְ עָלֵינוּ
  choice: пусть над нами царствует царь
  rationale: Сохраняются однокоренные существительное и глагол оригинала, а также волевая сила требования.
- source_word: יהוה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона в основном тексте.
- source_word: מַלְכְּכֶם
  choice: был вашим Царём
  rationale: Прошедшее время соответствует ретроспективному контексту речи Самуила; именная еврейская фраза сама по себе времени не указывает.
theological_decisions:
- issue: Временное значение безглагольной фразы וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם
  choice: Господь, ваш Бог, был вашим Царём
  alternative: Господь, ваш Бог, — ваш Царь
  rationale: Прошедшее время лучше связано с моментом, когда Израиль потребовал земного царя, но еврейская именная фраза допускает и утверждение продолжающейся реальности; альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет ход мысли и укор Самуила; традиционные формы «Наас» и «Господь» обеспечивают узнаваемость. Заглавная буква в «Царём» подчёркивает титульное употребление по отношению к Богу, не добавляя нового содержания.
