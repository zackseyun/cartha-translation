base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/010.yaml
  text: Then they cried out to the LORD and said, “We have sinned, because we have forsaken the LORD and have served the Baals and the Ashtaroths. But now, deliver us from the hand of our enemies, and we will serve you.”
translation:
  language: ru
  text: 'Тогда они воззвали к ГОСПОДУ и сказали: «Мы согрешили, потому что оставили ГОСПОДА и служили Ваалам и Астартам. Но теперь избавь нас от руки наших врагов, и мы будем служить Тебе».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: воззвали
  rationale: Передаёт настойчивое обращение за помощью и сохраняет достойный библейский регистр.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона с типографическим выделением.
- source_word: הַבְּעָלִים
  choice: Ваалам
  rationale: Сохраняет форму множественного числа и обозначение местных проявлений или культов Ваала.
- source_word: הָעַשְׁתָּרוֹת
  choice: Астартам
  rationale: Передаёт женское множественное число имени языческого божества в принятой русской форме.
- source_word: מִיַּד אֹיְבֵינוּ
  choice: от руки наших врагов
  rationale: Сохраняет конкретную древнееврейскую метафору власти и притеснения, понятную в контексте.
theological_decisions:
- issue: Связь признания греха с оставлением ГОСПОДА
  choice: «потому что оставили»
  alternative: «ибо оставили»
  rationale: כִּי здесь естественно выражает основание признания; выбранная формулировка ясна современному читателю и не меняет богословской логики.
- issue: Обещание дальнейшего служения
  choice: «мы будем служить Тебе»
  alternative: «станем служить Тебе»
  rationale: Сохраняет прямое обещание народа без добавления условий или оценки искренности покаяния.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Сохранены параллелизм, прямая речь и образ «руки врагов»; архаические формы по возможности не использованы.
