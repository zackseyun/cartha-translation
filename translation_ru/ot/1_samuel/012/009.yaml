  - severity: low
    issue: Сноска поясняет продажу как суд именно «за нарушение завета».
    rationale: Контекст и идиома допускают заветно-судебный смысл, но в самом стихе причина не названа. Лучше описать это как выражение заветного суда, не формулируя дополнительное причинное утверждение.
  revised_text: Но они забыли Яхве, своего Бога, и Он продал[a] их в руки Сисары, начальника войска Хацора, в руки филистимлян и в руки царя Моава, и те воевали против них.
