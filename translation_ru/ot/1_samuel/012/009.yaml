  to: Но они забыли Яхве, своего Бога, и Он продал[a] их в руки Сисары, начальника войска Хацора, в руки филистимлян и в руки царя Моава, и те воевали против них.
  rationale: Исправлено название города на «Хацор» как прямое соответствие еврейскому חָצוֹר. Сноска сохранена, но её причинная формулировка смягчена, чтобы не добавлять к стиху явно не выраженное утверждение. Остальной текст не требует изменений.
