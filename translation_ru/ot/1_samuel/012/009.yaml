base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/009.yaml
  text: But they forgot Yahweh their God[a], and he sold them into the hand of Sisera, commander of the army of Hazor, and into the hand of the Philistines, and into the hand of the king of Moab; and they fought against them.
translation:
  language: ru
  text: Но они забыли Яхве, своего Бога, и Он продал[a] их в руки Сисары, начальника войска Хацора, в руки филистимлян и в руки царя Моава, и те воевали против них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предал их». Буквально в еврейском тексте: «продал их» — образное выражение о передаче народа под власть врагов в контексте заветного суда.'
    reason: Лексическая альтернатива и пояснение древнееврейской метафоры без добавления прямо не названной в стихе причины суда.
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: забыли
  rationale: Передаёт прямое значение שׁכח и сохраняет подразумеваемый контекстом оттенок заветной неверности, не усиливая его до «оставили» или «отвергли».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵיהֶם
  choice: своего Бога
  rationale: Возвратное «своего» естественно по-русски соотносит Бога с подлежащим «они» и сохраняет указание на отношения Израиля со своим Богом.
- source_word: וַיִּמְכֹּר
  choice: продал
  rationale: Сохраняет буквальную метафору מכר; в данном контексте она означает передачу народа под власть врагов как суд.
- source_word: בְּיַד
  choice: в руки
  rationale: Сохраняет еврейский образ передачи под чужую власть и остаётся понятным в современном русском языке.
- source_word: שַׂר צְבָא חָצוֹר
  choice: начальника войска Асора
  rationale: Точно передаёт военную должность и конструктивную связь с Асором без архаичного «воевода».
- source_word: וַיִּלָּחֲמוּ בָם
  choice: и те воевали против них
  rationale: «Те» естественно отсылает к только что названным вражеским силам; «против них» передаёт значение לחם с предлогом ב.
theological_decisions:
- issue: Подлежащее при «продал»
  choice: Подразумеваемое подлежащее — Яхве; в русском тексте оно выражено местоимением «Он».
  alternative: 'Безличная или страдательная передача: «они были отданы».'
  rationale: Единственное число еврейского глагола естественно продолжает упоминание Яхве в предыдущей части фразы. Такое чтение сохраняет представленное в тексте действие Бога как заветный суд.
- issue: Смысл выражения «забыли Яхве»
  choice: Сохранено буквальное «забыли», допускающее контекстуальный оттенок неверности завету.
  alternative: Истолковывающие варианты «оставили Яхве» или «пренебрегли Яхве».
  rationale: Исходный глагол прямо означает «забыть». Более сильная формулировка заранее истолковала бы то, что еврейский текст оставляет выраженным через контекст.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. Сохранены личное имя «Яхве», метафора «продал» и оборот «в руки»; синтаксис сделан плавным и понятным без конфессиональных добавлений.
