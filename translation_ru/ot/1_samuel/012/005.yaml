  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם עֵ֧ד יְהוָ֣ה בָּ/כֶ֗ם וְ/עֵ֤ד מְשִׁיח/וֹ֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כִּ֣י לֹ֧א מְצָאתֶ֛ם בְּ/יָדִ֖/י מְא֑וּמָה וַ/יֹּ֖אמֶר עֵֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/005.yaml
  text: And he said to them[a], “Yahweh is witness against you, and his anointed is witness this day, that you have found nothing in my hand.” And they said[c][b], “He is witness.”
translation:
  language: ru
  text: 'И сказал им: «Сегодня Яхве и Его помазанник — свидетели против вас[a] в том, что вы ничего не нашли у меня». И они сказали[c]: «Он свидетель».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее также возможно: «Яхве — свидетель среди вас» или «при вас». В данном контексте выражение имеет судебный оттенок: Яхве выступает свидетелем в разбирательстве, касающемся народа.'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте глагол стоит в единственном числе: «и сказал». По контексту это общий ответ народа, поэтому в переводе: «они сказали».'
    reason: textual_note
lexical_decisions:
- source_word: עֵד
  choice: свидетель
  rationale: Существительное обозначает свидетеля в судебном или договорном разбирательстве; это значение соответствует публичному оправданию Самуила.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: בָּכֶם
  choice: против вас
  rationale: 'При עֵד предлог получает судебный смысл: Яхве выступает свидетелем в деле, касающемся народа. Более буквальные варианты отмечены в сноске.'
- source_word: מְשִׁיחוֹ
  choice: Его помазанник
  rationale: Слово означает поставленного через помазание царя — здесь Саула. «Помазанник» сохраняет исходный образ, не превращая слово в собственное мессианское имя.
- source_word: הַיּוֹם הַזֶּה
  choice: сегодня
  rationale: Естественная современная русская передача временного выражения в торжественном публичном заявлении.
- source_word: מְצָאתֶם
  choice: вы не нашли
  rationale: Совершенный вид передаёт завершённую проверку поведения Самуила к моменту его заявления.
- source_word: בְּיָדִי
  choice: у меня
  rationale: Еврейское «в моей руке» является идиомой обладания; «у меня» естественно передаёт её смысл по-русски.
- source_word: מְאוּמָה
  choice: ничего
  rationale: В сочетании с отрицанием слово означает «ничего, ни одной вещи».
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: сказал ... они сказали
  rationale: Первый глагол относится к Самуилу. Последний имеет форму единственного числа, однако по контексту выражает общий ответ народа; это отражено в тексте и оговорено в сноске.
theological_decisions:
- issue: Значение מְשִׁיחוֹ в данном царском контексте
  choice: Его помазанник
  alternative: Его Мессия; Его царь
  rationale: Здесь речь идёт о недавно поставленном царе Сауле. Перевод «помазанник» сохраняет связь с обрядом помазания, но не навязывает непосредственного указания на грядущего Мессию.
- issue: Судебная направленность выражения עֵד יְהוָה בָּכֶם
  choice: Яхве — свидетель против вас
  alternative: Яхве — свидетель среди вас; Яхве — свидетель при вас
  rationale: Контекст публичного разбирательства поддерживает судебное понимание, однако пространственно-социальная неоднозначность предлога ב сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного судебного тона. Идиома בְּיָדִי передана естественным выражением «у меня»; личное имя Яхве и термин «помазанник» сохранены. Все существенные неоднозначности вынесены в сноски.
