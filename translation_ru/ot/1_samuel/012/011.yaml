base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/011.yaml
  text: And Yahweh sent Jerubbaal and Bedan and Jephthah and Samuel[a], and he delivered you from the hand of your enemies all around[b], and you lived in safety.
translation:
  language: ru
  text: И послал Яхве Иероваала[a], Бедана[b], Иеффая и Самуила, и избавил вас от руки ваших врагов со всех сторон, и вы жили в безопасности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Иероваал — другое имя Гедеона (см. Суд. 6:32; 7:1).
    reason: cross_reference
  - marker: b
    text: Евр. «Бедан». Личность Бедана не установлена; некоторые толкователи видят здесь Варака, реже — Авдона.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, не заменяя его титулом «Господь».
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Прямое и естественное соответствие глаголу שׁלח в данном контексте.
- source_word: יְרֻבַּעַל
  choice: Иероваал
  rationale: Сохраняет названное в еврейском тексте второе имя Гедеона; отождествление поясняется в сноске.
- source_word: בְּדָן
  choice: Бедан
  rationale: Сохраняет чтение масоретского текста, не подменяя спорное имя предполагаемым отождествлением.
- source_word: יִפְתָּח
  choice: Иеффай
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: שְׁמוּאֵל
  choice: Самуил
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: וַיַּצֵּל
  choice: избавил
  rationale: Точно передаёт спасение от опасности и естественно сочетается в русском языке с оборотом «от руки врагов».
- source_word: מִיַּד אֹיְבֵיכֶם
  choice: от руки ... врагов
  rationale: Сохраняет ясный древнееврейский образ руки как власти и силы.
- source_word: מִסָּבִיב
  choice: окружавших вас
  rationale: 'Естественно передаёт пространственный смысл: враги находились вокруг Израиля.'
- source_word: וַתֵּשְׁבוּ בֶּטַח
  choice: вы жили в безопасности
  rationale: Передаёт устойчивую, безопасную жизнь без архаичного русского оборота.
theological_decisions:
- issue: Личность Бедана (בְּדָן)
  choice: В основном тексте сохранено имя «Бедан» по масоретскому тексту.
  alternative: Варак; реже — Авдон.
  rationale: Недостаточно оснований молча исправлять исходное чтение или согласовывать его с иными преданиями; неопределённость отмечена в сноске.
- issue: Упоминание Самуилом самого себя в перечне посланных избавителей
  choice: Имя «Самуил» сохранено без поясняющей перефразировки.
  alternative: Неявно отнести имя к другому лицу или исправить текст.
  rationale: Масоретский текст прямо называет Самуила; перевод не должен устранять возникающее повествовательное напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены сочинительные связи исходного текста и образ «от руки врагов»; спорные имена не гармонизированы.
