  text: Then Samuel said to all Israel, “Look, I have listened to your voice in all that you have said to me, and I have made a king reign over you.”
translation:
  language: ru
  text: 'И сказал Самуил всему Израилю: «Вот, я внял вашему голосу во всём, что вы сказали мне, и поставил над вами царя».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתִּי בְקֹלְכֶם
  choice: я послушался вас
  rationale: Еврейское выражение буквально означает «услышал ваш голос», но в данном контексте передаёт не просто восприятие речи, а согласие исполнить просьбу; современное русское «послушался вас» естественно выражает этот смысл.
- source_word: לְכֹל אֲשֶׁר אֲמַרְתֶּם לִי
  choice: во всём, что вы сказали мне
  rationale: Сохраняет обобщающий охват לְכֹל и прямую связь с обращёнными к Самуилу словами Израиля.
- source_word: וָאַמְלִיךְ עֲלֵיכֶם מֶלֶךְ
  choice: и поставил над вами царя
  rationale: Каузативная форма глагола מלך означает назначить или воцарить царя. Русское выражение «поставил над вами царя» ясно передаёт действие Самуила как установление царской власти и избегает неестественного «воцарил царя».
theological_decisions:
- issue: Соотношение просьбы народа и действия Самуила
  choice: 'Сохранено прямое утверждение Самуила: «я послушался… и поставил»'
  alternative: Ослабить его участие формулировкой «у вас воцарился царь»
  rationale: Еврейский текст прямо приписывает Самуилу согласие с требованием народа и действие по воцарению; перевод не переносит агентность исключительно на Бога и не устраняет напряжение повествования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Вот» сохраняет дискурсивное הִנֵּה, а синтаксис остаётся ясным для обычного читателя.
