base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/006.yaml
  text: Then Achish called David and said to him[a], “As Yahweh lives, you are upright, and your going out and your coming in with me in the camp is good in my sight; for I have not found any evil in you from the day of your coming to me to this day. But in the eyes of the lords of the Philistines[c][b], you are not good.”
translation:
  language: ru
  text: 'Тогда Ахиш позвал Давида и сказал ему: «Жив Яхве! Ты честен, и мне по душе, как ты выходишь и входишь вместе со мной в лагере[a], потому что я не находил в тебе ничего дурного с того дня, как ты пришёл ко мне, и доныне. Но правителям филистимлян[b] ты неугоден[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твой выход и твой вход со мной в лагере»; это выражение может означать поведение или всю деятельность человека.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово «сераним» — особый титул правителей филистимлян.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «ты нехорош»; по смыслу: «ты для них неприемлем».'
    reason: alternative_reading
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Жив Яхве!
  rationale: Сохранена обычная еврейская формула клятвы и личное имя Бога; в русском языке такая краткая форма звучит торжественно и естественно.
- source_word: יָשָׁר
  choice: честен
  rationale: В данном обращении слово обозначает порядочность и благонадёжность Давида; «честен» естественнее современного «праведен» и не сужает смысл до культовой праведности.
- source_word: טוֹב בְּעֵינַי
  choice: мне по душе
  rationale: Передаёт положительную оценку Ахиша естественным современным русским выражением, не делая фразу канцелярской.
- source_word: צֵאתְךָ וּבֹאֲךָ אִתִּי בַּמַּחֲנֶה
  choice: как ты выходишь и входишь вместе со мной в стане
  rationale: Сохраняет конкретную еврейскую парную формулу и военный контекст; идиоматическое значение поведения отмечено в сноске.
- source_word: לֹא מָצָאתִי בְךָ רָעָה
  choice: я не находил в тебе ничего дурного
  rationale: Передаёт отсутствие проступка или зла, сохраняя образ обнаружения чего-либо дурного в человеке.
- source_word: מִיּוֹם בֹּאֲךָ אֵלַי עַד הַיּוֹם הַזֶּה
  choice: с того дня, как ты пришёл ко мне, и доныне
  rationale: Естественная русская передача временной конструкции без утраты её начальной и конечной точек.
- source_word: הַסְּרָנִים
  choice: правителям филистимлян
  rationale: Особый титул руководителей филистимского союза передан понятным функциональным словом; титульная особенность отмечена в сноске.
- source_word: לֹא טוֹב אָתָּה
  choice: ты неугоден
  rationale: Передаёт эллиптическое «ты не хорош» как отрицательную оценку и неприемлемость Давида для филистимских правителей, не подразумевая объективного нравственного порока.
theological_decisions:
- issue: Передача имени יְהוָה в клятве филистимского царя
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо употреблён тетраграмматон; транслитерация сохраняет личное имя и примечательную особенность речи Ахиша, не объясняя, почему он употребляет это имя.
- issue: Нравственная или прагматическая оценка в לֹא טוֹב אָתָּה
  choice: ты неугоден
  alternative: ты нехорош
  rationale: Контекст говорит об отношении филистимских правителей и приемлемости Давида для похода, а не о прямом авторском приговоре его нравственности.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Стан» поддерживает военный и древний колорит, оставаясь понятным; синтаксис упрощён там, где буквальное калькирование было бы тяжеловесным. Все смысловые альтернативы, существенно связанные с еврейской идиоматикой, вынесены в сноски.
