  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אָכִ֗ישׁ כִּ֣י מֶ֤ה עָשִׂ֨יתִי֙ וּ/מַה מָּצָ֣אתָ בְ/עַבְדְּ/ךָ֔ מִ/יּוֹם֙ אֲשֶׁ֣ר הָיִ֣יתִי לְ/פָנֶ֔י/ךָ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י לֹ֤א אָבוֹא֙ וְ/נִלְחַ֔מְתִּי בְּ/אֹיְבֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/008.yaml
  text: David said to Achish[a], “But what have I done? And what have you found against your servant from the day I entered your service until this day[b], that I should not go and fight against the enemies of my lord the king?”
translation:
  language: ru
  text: 'Давид сказал Ахишу: «Но что я сделал? Какую вину ты нашёл в твоём слуге с того дня, как я поступил к тебе на службу, и доныне, почему мне нельзя идти и сражаться с врагами моего господина, царя[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Давид не уточняет, кого именно он называет «моим господином, царём». Эти слова могут прямо относиться к Ахишу, но в контексте повествования могут звучать намеренно двусмысленно.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי מֶה עָשִׂיתִי
  choice: Но что я сделал?
  rationale: Частица כִּי вводит возражение Давида; «но» естественно передаёт этот дискурсивный поворот по-русски.
- source_word: וּמַה מָּצָאתָ בְעַבְדְּךָ
  choice: Какую вину ты нашёл за своим слугой
  rationale: Сочетание מצא с ב здесь подразумевает обнаружение проступка или основания для обвинения. Русская формулировка ясно передаёт этот смысл, сохраняя придворное самообозначение «твой слуга».
- source_word: מִיּוֹם אֲשֶׁר הָיִיתִי לְפָנֶיךָ עַד הַיּוֹם הַזֶּה
  choice: с того дня, как я поступил к тебе на службу, и доныне
  rationale: 'Буквально: «с того дня, как я был перед тобой». В контексте выражение обозначает время пребывания Давида на службе у Ахиша; выбран естественный русский эквивалент.'
- source_word: כִּי לֹא אָבוֹא וְנִלְחַמְתִּי
  choice: что мне нельзя идти и сражаться
  rationale: Придаточное выражает суть протеста Давида — его не допускают к сражению. Такая конструкция естественна в современном русском языке.
- source_word: בְּאֹיְבֵי אֲדֹנִי הַמֶּלֶךְ
  choice: с врагами моего господина царя
  rationale: При נלחם предлог ב обозначает противника; по-русски «сражаться с врагами» передаёт это нормативно. «Мой господин царь» сохраняет человеческий титул почтительного обращения и не уточняет референта сверх текста.
theological_decisions:
- issue: Кого Давид называет «моим господином царём» и какова риторическая сила этих слов
  choice: Сохранить выражение без прямого отождествления его референта.
  alternative: Понимать его однозначно как искреннее обозначение Ахиша либо как намеренную отсылку к другому царю.
  rationale: Еврейский текст не объясняет намерения Давида. Неуточнённая формулировка сохраняет возможную повествовательную двусмысленность и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством придворной речи. Синтаксис сделан естественным для устного возражения, а титул и неясность последней фразы сохранены.
