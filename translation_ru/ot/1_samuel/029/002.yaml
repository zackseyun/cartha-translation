base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/002.yaml
  text: And the lords of the Philistines were passing by by hundreds and by thousands[a], and David and his men were passing by at the rear with Achish.
translation:
  language: ru
  text: Правители филистимлян проходили сотнями и тысячами[a], а Давид и его люди шли последними вместе с Ахишем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по сотням и тысячам»; возможно, речь идёт о воинских подразделениях, построенных группами по сто и по тысяче человек.'
    reason: Сочетание לְמֵאוֹת וְלַאֲלָפִים допускает как общее указание на движение сотнями и тысячами, так и более специальное указание на организацию войска по подразделениям.
lexical_decisions:
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: правители филистимлян
  rationale: Слово סֶרֶן обозначает высших правителей филистимских городов-государств; «правители» естественно звучит по-русски и передаёт их политико-военный статус без архаизации.
- source_word: עֹבְרִים
  choice: проходили / шли
  rationale: Причастная форма рисует продолжающееся движение строя. В первой части выбрано «проходили», а во второй — естественное русское «шли», чтобы избежать тяжеловесного повтора без изменения смысла.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: сотнями и тысячами
  rationale: Формулировка близка к еврейскому тексту и сохраняет возможность понимать числа как численность либо как обозначение воинских подразделений.
- source_word: אֲנָשָׁיו
  choice: его люди
  rationale: Речь идёт о людях Давида, составлявших его вооружённый отряд; «его люди» не сужает значение исключительно до регулярных воинов.
- source_word: בָּאַחֲרֹנָה
  choice: позади
  rationale: Передаёт положение в задней части шествия просто и естественно, без более специального термина «арьергард».
- source_word: עִם אָכִישׁ
  choice: вместе с Анхусом
  rationale: Передаёт простое значение совместного следования; «Анхус» — укоренившаяся русская форма имени אָכִישׁ.
