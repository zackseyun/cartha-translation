  text: וַ/יִּקְצְפ֨וּ עָלָ֜י/ו שָׂרֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֣אמְרוּ ל/וֹ֩ שָׂרֵ֨י פְלִשְׁתִּ֜ים הָשֵׁ֣ב אֶת הָ/אִ֗ישׁ וְ/יָשֹׁב֙ אֶל מְקוֹמ/וֹ֙ אֲשֶׁ֣ר הִפְקַדְתּ֣/וֹ שָׁ֔ם וְ/לֹֽא יֵרֵ֤ד עִמָּ֨/נוּ֙ בַּ/מִּלְחָמָ֔ה וְ/לֹא יִֽהְיֶה לָּ֥/נוּ לְ/שָׂטָ֖ן בַּ/מִּלְחָמָ֑ה וּ/בַ/מֶּ֗ה יִתְרַצֶּ֥ה זֶה֙ אֶל אֲדֹנָ֔י/ו הֲ/ל֕וֹא בְּ/רָאשֵׁ֖י הָ/אֲנָשִׁ֥ים הָ/הֵֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/004.yaml
  text: But the Philistine commanders were angry with him[a], and the Philistine commanders said to him, “Send the man back, so that he may return to his place where you assigned him, and let him not go down with us into battle, lest he become an adversary to us in the battle[b]. For with what could this man reconcile himself to his lord? Would it not be with the heads of those men?”
translation:
  language: ru
  text: 'Но филистимские военачальники разгневались на него и сказали ему: «Отправь этого человека назад. Пусть он вернётся на то место, куда ты его определил. Пусть он не идёт с нами в сражение, чтобы не стать нам противником в сражении[a]. Ведь чем этот человек сможет вновь снискать расположение своего господина[b]? Не головами ли тех людей?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово שָׂטָן здесь означает «противник» или «неприятель», а не имя «Сатана».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «примириться со своим господином». Еврейское выражение означает вновь стать угодным своему властителю, вернуть его расположение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצְפוּ עָלָיו
  choice: разгневались на него
  rationale: Передаёт сильный гнев, выраженный глаголом קצף, естественно и без неоправданного усиления.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: филистимские военачальники
  rationale: В контексте военного похода שָׂרִים обозначает руководителей войска; «военачальники» точнее контекстуального смысла, чем архаичное «князья».
- source_word: הָשֵׁב אֶת הָאִישׁ
  choice: Отправь этого человека назад
  rationale: Каузативная форма שוב требует смысла «заставить/велеть вернуться»; выбранная формулировка естественна по-русски и сохраняет повелительную силу.
- source_word: וְיָשֹׁב אֶל מְקוֹמוֹ
  choice: Пусть он вернётся на своё место
  rationale: Сохраняет волитивный оттенок еврейской формы и ясно выражает требуемый результат приказа.
- source_word: אֲשֶׁר הִפְקַדְתּוֹ שָׁם
  choice: куда ты его назначил
  rationale: הפקיד может означать назначение или определение на место. «Назначил» оставляет открытым точный характер поручения.
- source_word: וְלֹא יֵרֵד עִמָּנוּ בַּמִּלְחָמָה
  choice: Не позволяй ему идти с нами на битву
  rationale: Русская формулировка естественно передаёт запрет присоединяться к походу. Буквальное «спускаться» здесь звучало бы неясно без дополнительного географического контекста.
- source_word: וְלֹא יִהְיֶה לָּנוּ לְשָׂטָן
  choice: чтобы во время битвы он не стал нашим противником
  rationale: שָׂטָן употреблено как нарицательное существительное «противник, неприятель», а не как имя собственное.
- source_word: יִתְרַצֶּה זֶה אֶל אֲדֹנָיו
  choice: этот человек сможет вновь снискать расположение своего господина
  rationale: Hitpael глагола רצה здесь означает вновь стать угодным вышестоящему лицу, вернуть его благосклонность. Формулировка передаёт практический смысл, не делая «примирение» более взаимным, чем в источнике.
- source_word: אֲדֹנָיו
  choice: своего господина
  rationale: Обозначает властителя Давида, Саула; «господин» сохраняет политическую и иерархическую связь без чрезмерно бытового оттенка.
- source_word: הֲלוֹא בְּרָאשֵׁי הָאֲנָשִׁים הָהֵם
  choice: Не головами ли этих людей?
  rationale: 'Сохраняет резкую эллиптическую риторику источника: подразумевается, что Давид мог бы вернуть расположение Саула, убив филистимлян.'
theological_decisions:
- issue: Значение שָׂטָן
  choice: нарицательное «противник»
  alternative: имя собственное «Сатана»
  rationale: В данном историко-военном контексте слово означает человеческого противника. Передача его именем «Сатана» внесла бы отсутствующее в тексте демонологическое толкование.
- issue: Смысл יִתְרַצֶּה אֶל אֲדֹנָיו
  choice: вновь снискать расположение своего господина
  alternative: примириться со своим господином
  rationale: Контекст говорит о возвращении благосклонности Саула посредством военной измены. Выбранный вариант сохраняет направленность действия на вышестоящего, не предполагая равноправного взаимного примирения.
