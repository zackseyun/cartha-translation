base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/010.yaml
  text: Now rise early in the morning[a], you and your master's servants who came with you. When you rise early in the morning and it is light for you, go.
translation:
  language: ru
  text: Теперь встань рано утром — ты и слуги твоего господина, пришедшие с тобой. Когда вы встанете рано утром и рассветёт[a], уходите.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и будет светло для вас»; возможный перевод: «когда для вас станет светло».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Теперь
  rationale: Дискурсивный переход к непосредственному распоряжению; «теперь» естественно передаёт временной и логический оттенок.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: встань рано утром
  rationale: Побудительная форма שׁכם обозначает ранний подъём или раннее начало пути; сочетание сохраняет и действие, и указание на утро.
- source_word: וְעַבְדֵי אֲדֹנֶיךָ
  choice: ты и слуги твоего господина
  rationale: Слуги включены в круг тех, кому надлежит подняться; אֲדֹנֶיךָ здесь обозначает человеческого господина, а не Божье имя или титул.
- source_word: אֲשֶׁר בָּאוּ אִתָּךְ
  choice: пришедшие с тобой
  rationale: Естественное русское определение точно обозначает сопровождавших Давида слуг.
- source_word: וְהִשְׁכַּמְתֶּם בַּבֹּקֶר
  choice: Когда вы встанете рано утром
  rationale: Множественное число отражено местоимением «вы». В контексте форма продолжает распоряжение и естественно понимается как временное условие перед уходом.
- source_word: וְאוֹר לָכֶם
  choice: и рассветёт
  rationale: Краткая естественная передача наступления света; необычная буквальная конструкция и возможный вариант «когда станет светло» сохранены в сноске.
- source_word: וָלֵכוּ
  choice: уходите
  rationale: Императив הלך в данном контексте означает отправиться прочь; «уходите» по-русски яснее передаёт требуемое отбытие, чем общее «идите».
