base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/009.yaml
  text: Achish answered and said to David[a], “I know that you are good in my eyes, like an angel of God. Yet the commanders of the Philistines have said, ‘He must not go up with us into battle.’”
translation:
  language: ru
  text: 'Ахиш ответил Давиду: «Я знаю, что ты хорош в моих глазах, словно ангел Божий[a]. Но военачальники филистимлян сказали: „Он не должен идти с нами в бой“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно вестник Божий». Еврейское слово מַלְאָךְ может означать как «вестник», так и «ангел», хотя в этом выражении значение «ангел Божий» более естественно.'
    reason: Лексическая неоднозначность слова מַלְאָךְ.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ответил
  rationale: Два еврейских глагола образуют обычную повествовательную формулу введения ответа. В современном русском одного глагола «ответил» достаточно; буквальное «ответил и сказал» звучало бы избыточно.
- source_word: יָדַעְתִּי
  choice: Я знаю
  rationale: Перфект выражает сложившееся и сохраняющееся суждение Ахиша; настоящее время естественно передаёт его в русской прямой речи.
- source_word: טוֹב אַתָּה בְּעֵינַי
  choice: ты в моих глазах хорош
  rationale: Сохраняется образное выражение «в моих глазах» и широкое значение положительной оценки, без сужения до одной лишь верности или нравственной доброты.
- source_word: כְּמַלְאַךְ אֱלֹהִים
  choice: словно ангел Божий
  rationale: В устойчивом сочетании מַלְאַךְ אֱלֹהִים наиболее естественно сверхъестественное значение «ангел Божий»; «словно» ясно обозначает сравнение. Возможное значение «вестник» сохранено в сноске.
- source_word: אַךְ
  choice: Но
  rationale: Союз передаёт противопоставление личной оценки Ахиша решению филистимских военачальников; «но» естественно для современной русской речи.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: военачальники филистимлян
  rationale: В военном контексте שָׂרִים обозначает руководителей и командующих; «военачальники» точнее, чем архаичное «князья».
- source_word: לֹא יַעֲלֶה עִמָּנוּ בַּמִּלְחָמָה
  choice: Он не должен идти с нами в бой
  rationale: Отрицательный имперфект в переданной речи выражает запрет или принятое решение. «Не должен» сохраняет эту модальную силу, а «идти с нами в бой» естественно передаёт военный контекст глагола עלה и существительного מִלְחָמָה.
theological_decisions:
- issue: Значение מַלְאַךְ אֱלֹהִים в сравнении Ахиша
  choice: «словно ангел Божий» — риторическое сравнение, выражающее исключительно высокую оценку Давида
  alternative: «словно вестник Божий»
  rationale: Сочетание допускает лексическое значение «вестник», однако в этой формуле значение «ангел Божий» естественнее. Сравнительная конструкция не утверждает, что Давид является ангелом, и не требует дополнительных богословских выводов.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис прямой речи упрощён по нормам русского языка, но образность и смысловые противопоставления еврейского текста сохранены.
