base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/011.yaml
  text: So David rose early[a], he and his men, to leave in the morning and return to the land of the Philistines[b]. And the Philistines went up to Jezreel.
translation:
  language: ru
  text: Давид и его люди встали рано, чтобы утром отправиться в путь и возвратиться в землю филистимлян. А филистимляне двинулись к Изреелю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднялись к Изреелю». Глагол может указывать на движение вверх по местности или употребляться в связи с выступлением войска.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: встали рано
  rationale: Каузативная порода глагола שׁכם в этом употреблении означает ранний подъём или раннее начало пути. В русском составное подлежащее «Давид и его люди» естественно требует множественного числа.
- source_word: הוּא וַאֲנָשָׁיו
  choice: Давид и его люди
  rationale: Сочетание местоимения с именной группой подчёркивает, что речь идёт о самом Давиде и сопровождавших его мужчинах; «люди» не сужает значение до слуг или воинов.
- source_word: לָלֶכֶת בַּבֹּקֶר לָשׁוּב
  choice: чтобы утром отправиться в путь и возвратиться
  rationale: Переданы оба инфинитива — «идти» и «возвратиться» — и отдельное указание времени בַּבֹּקֶר, несмотря на близкое по смыслу «встали рано».
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: в землю филистимлян
  rationale: Сохранён конкретный образ «земли» и этническое наименование; выражение обозначает филистимскую территорию в целом.
- source_word: עָלוּ יִזְרְעֶאל
  choice: двинулись к Изреелю
  rationale: В контексте передвижения войска «двинулись» естественно передаёт направленное движение, а буквальное значение «поднялись» отмечено в сноске.
