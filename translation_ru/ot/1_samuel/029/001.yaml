  text: וַ/יִּקְבְּצ֧וּ פְלִשְׁתִּ֛ים אֶת כָּל מַחֲנֵי/הֶ֖ם אֲפֵ֑קָ/ה וְ/יִשְׂרָאֵ֣ל חֹנִ֔ים בַּ/עַ֖יִן אֲשֶׁ֥ר בְּ/יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/001.yaml
  text: The Philistines gathered all their camps at Aphek[b][a], while Israel was encamped by the spring that is in Jezreel.
translation:
  language: ru
  text: Филистимляне собрали все свои войска[a] в Афеке, а Израиль стоял лагерем у источника[b], что в Изрееле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все свои лагеря» или «все свои станы»; буквально в еврейском тексте — «все свои лагеря».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у родника»; еврейское слово может обозначать источник или родник.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּצוּ
  choice: собрали
  rationale: Глагол קבץ означает «собирать, созывать». «Собрали» естественно передаёт завершённое действие в повествовании, не добавляя отсутствующего в еврейском тексте временного маркера.
- source_word: פְלִשְׁתִּים
  choice: филистимляне
  rationale: Традиционное и общепонятное русское название этого народа.
- source_word: כָּל מַחֲנֵיהֶם
  choice: все свои войска[a]
  rationale: Буквально מַחֲנֶה означает «лагерь, стан», но во множественном числе в данном военном контексте выражение обозначает совокупность расположенных лагерями воинских сил. «Войска» естественно по-русски передаёт контекст, а буквальный образ сохранён в сноске.
- source_word: אֲפֵקָה
  choice: в Афеке
  rationale: Направительный суффикс при топониме в контексте сбора войск идиоматично передан как указание места — «в Афеке».
- source_word: וְיִשְׂרָאֵל
  choice: а Израиль
  rationale: Союз ו связывает одновременные и сопоставленные положения двух армий; русское «а» ясно выражает это сопоставление без усиления противопоставления.
- source_word: חֹנִים
  choice: стоял лагерем
  rationale: Причастие חנה описывает пребывание лагерем. Единственное число согласовано с собирательным названием «Израиль» и естественно в русском языке.
- source_word: בַּעַיִן
  choice: у источника[b]
  rationale: עַיִן здесь обозначает естественный водный источник; «у источника» является ясным современным географическим выражением.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: что в Изрееле
  rationale: Краткая относительная конструкция сохраняет прямое указание на местонахождение источника.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Военная обстановка передана естественно, а буквальное значение многозначного מַחֲנֶה вынесено в сноску. Все маркеры сносок стоят непосредственно после соответствующих выражений.
