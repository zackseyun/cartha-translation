base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/005.yaml
  text: Is this not David[a], of whom they sang to one another in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: ru
  text: 'Не тот ли это Давид, о котором пели друг другу во время плясок[a]: «Саул сразил тысячи, а Давид — десятки тысяч[b]»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ему отвечали (пели) во время плясок»; в этом выражении речь идёт об ответном, перекликающемся пении в честь Давида, то есть о нём.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово означает «десять тысяч» и может также употребляться в более общем смысле: «мириады», «несметное множество».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא זֶה דָוִד
  choice: Не тот ли это Давид
  rationale: Сохраняет форму риторического вопроса, предполагающего утвердительный ответ, и подчёркнутое узнавание Давида.
- source_word: אֲשֶׁר יַעֲנוּ לוֹ
  choice: о котором пели друг другу
  rationale: Глагол ענה в данном праздничном контексте обозначает ответное, перекликающееся пение; выражение «о котором» естественно передаёт לוֹ как указание на того, кому посвящена песня.
- source_word: בַּמְּחֹלוֹת
  choice: во время плясок
  rationale: מְחֹלוֹת обозначает праздничные пляски или хороводные танцы; выбранное выражение естественно описывает обстановку исполнения песни.
- source_word: הִכָּה
  choice: сразил
  rationale: В воинском контексте глагол означает нанесение поражения, нередко со смертельным исходом; «сразил» сохраняет образность и не перегружает строку.
- source_word: בַּאֲלָפָיו
  choice: тысячи
  rationale: Предлог и местоименный суффикс входят в идиоматическое обозначение числа побеждённых, приписываемого Саулу; по-русски притяжательное «свои» здесь избыточно и неестественно.
- source_word: בְרִבְבֹתָיו
  choice: десятки тысяч
  rationale: רבבה буквально обозначает десять тысяч и также может иметь более общее значение несметного множества; «десятки тысяч» сохраняет числовое усиление в параллелизме.
