base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/003.yaml
  text: Then the Philistine commanders said[a], “What are these Hebrews?” And Achish said to the Philistine commanders, “Is this not David, the servant of Saul king of Israel, who has been with me these days or these years? And I have found nothing against him from the day of his defecting until this very day.”
translation:
  language: ru
  text: 'Тогда филистимские военачальники спросили: «Что это за евреи?» Ахиш ответил филистимским военачальникам: «Разве это не Давид, слуга Саула, царя Израиля, который находится у меня все эти дни или годы? Со дня его перехода[a] доныне я не нашёл за ним ничего дурного».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со дня его падения». В данном военно-политическом контексте это может означать переход на другую сторону или бегство к противнику.'
    reason: Сохраняет буквальный образ глагола נפל и его возможный политический смысл, не приписывая суффиксу несуществующую неоднозначность «к нему/ко мне».
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: филистимские военачальники
  rationale: В военном контексте שָׂרִים обозначает высокопоставленных предводителей; «военачальники» естественно передаёт их роль и не вносит монархического оттенка слова «князья».
- source_word: מָה הָעִבְרִים הָאֵלֶּה
  choice: Что здесь делают эти евреи?
  rationale: 'Еврейская фраза эллиптична буквально: «Что [это за] евреи?» В русском контексте вопрос естественно выражает недоумение по поводу их присутствия; добавленное «здесь делают» передаёт подразумеваемый прагматический смысл.'
- source_word: הָעִבְרִים
  choice: евреи
  rationale: Сохранено этническое обозначение עִבְרִים и филистимская перспектива, без замены на «израильтяне».
- source_word: הֲלוֹא
  choice: Разве это не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: עֶבֶד
  choice: слуга
  rationale: Здесь слово описывает прежнее придворно-политическое отношение Давида к Саулу, а не подчёркивает рабский статус.
- source_word: זֶה יָמִים אוֹ זֶה שָׁנִים
  choice: уже не первый день и даже не первый год
  rationale: Естественная русская идиома, сохраняющая неопределённость и усиление исходного выражения «дни или годы».
- source_word: מְאוּמָה
  choice: не нашёл за ним ничего дурного
  rationale: В контексте означает отсутствие проступка или основания для обвинения; русское выражение передаёт этот смысл естественно.
- source_word: מִיּוֹם נָפְלוֹ
  choice: со дня его перехода на мою сторону
  rationale: נפל в военно-политическом контексте может обозначать переход или бегство на чью-либо сторону. Формулировка ясна по-русски и не утверждает больше, чем допускает контекст.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: доныне
  rationale: Кратко и литературно передаёт устойчивое временное выражение «до этого дня».
- source_word: אָכִישׁ
  choice: Ахиш
  rationale: Традиционная русская библейская передача имени.
- source_word: דָוִד
  choice: Давид
  rationale: Традиционная русская библейская передача имени.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Традиционная русская библейская передача имени.
