theological_decisions:
- issue: Характер «зла» в оценке филистимских правителей
  choice: 'Сохранить указание на их оценку: «что … сочтут злом»'
  alternative: «не делай зла» как безусловное нравственное суждение
  rationale: Оборот בְּעֵינֵי допускает значение того, что эти правители сочтут дурным или неприемлемым; перевод не должен без необходимости превращать их оценку в абсолютное нравственное определение.
translation_notes:
