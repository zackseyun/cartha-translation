base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/007.yaml
  text: But Yahweh said to Samuel[a], “Do not look at his appearance or at the height of his stature, because I have rejected him. For not as man sees does God see, for man sees what is before the eyes[c][b], but Yahweh sees the heart.”
translation:
  language: ru
  text: 'Но Яхве сказал Самуилу: «Не смотри на его внешность и высокий рост, потому что Я отверг его. Ведь Яхве видит не так, как человек:[a] человек видит то, что перед глазами, а Яхве видит сердце».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ведь не то, что видит человек»; еврейская фраза эллиптична и противопоставляет Божье видение человеческому.'
    reason: Сохранение синтаксической неоднозначности оригинала при ясном основном тексте.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: תַּבֵּט
  choice: не смотри
  rationale: Естественно передаёт запрет судить о кандидате, сосредоточившись на его внешних признаках.
- source_word: מַרְאֵהוּ
  choice: его внешность
  rationale: Современное и точное обозначение видимого облика человека.
- source_word: גְּבֹהַּ קוֹמָתוֹ
  choice: высокий рост
  rationale: Передаёт физическую рослость без неестественного для русского языка оборота «высота его стана».
- source_word: מְאַסְתִּיהוּ
  choice: Я отверг его
  rationale: В контексте избрания царя глагол означает отказ признать данного человека подходящим избранником.
- source_word: הָאָדָם
  choice: человек
  rationale: 'Сохраняет обобщённое единственное число: речь идёт о свойственном людям способе восприятия.'
- source_word: לַעֵינַיִם
  choice: на то, что перед глазами
  rationale: Сохраняет образ исходного текста и обозначает внешне видимое, не сводя выражение к абстрактному толкованию.
- source_word: לַלֵּבָב
  choice: на сердце
  rationale: «Сердце» сохраняет библейский образ внутреннего центра мыслей, воли и расположения человека.
theological_decisions:
- issue: Эллиптическое противопоставление человеческого и Божьего видения
  choice: «Яхве видит не так, как человек» с примечанием о буквальной форме
  alternative: «Ведь не так, как видит человек»
  rationale: В еврейском тексте первая часть противопоставления эллиптична. Упоминание Яхве восполняется из непосредственного контекста и делает русскую фразу ясной, а примечание сохраняет осведомлённость читателя о неоднозначной синтаксической форме.
- issue: Значение «сердца»
  choice: сохранить слово «сердце»
  alternative: «внутреннего человека» или «мысли»
  rationale: Исходное слово охватывает внутреннюю жизнь, включая мысли, волю и расположение; «сердце» сохраняет широту и богословское напряжение образа, не ограничивая его одной способностью.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для широкого читателя; образ «перед глазами» и ключевое слово «сердце» сохранены.
