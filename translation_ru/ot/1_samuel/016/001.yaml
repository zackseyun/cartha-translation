source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל עַד מָתַי֙ אַתָּה֙ מִתְאַבֵּ֣ל אֶל שָׁא֔וּל וַ/אֲנִ֣י מְאַסְתִּ֔י/ו מִ/מְּלֹ֖ךְ עַל יִשְׂרָאֵ֑ל מַלֵּ֨א קַרְנְ/ךָ֜ שֶׁ֗מֶן וְ/לֵ֤ךְ אֶֽשְׁלָחֲ/ךָ֙ אֶל יִשַׁ֣י בֵּֽית הַלַּחְמִ֔י כִּֽי רָאִ֧יתִי בְּ/בָנָ֛י/ו לִ֖/י מֶֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/001.yaml
  text: And Yahweh said to Samuel[a], “How long will you grieve over Saul, since I have rejected him from being king over Israel? Fill your horn with oil and go; I am sending you to Jesse the Bethlehemite, for I have provided for myself a king among his sons.”
translation:
  language: ru
  text: 'И сказал Яхве Самуилу: «Долго ли ты будешь скорбеть о Сауле? Ведь Я отверг его как царя над Израилем. Наполни свой рог маслом и иди. Я посылаю тебя к Иессею из Вифлеема, потому что среди его сыновей Я усмотрел Себе царя[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «увидел Себе царя». В данном контексте это может означать: «выбрал Себе» или «предусмотрел Себе» царя.'
    reason: 'Лексическая многозначность глагола ראה: его основное значение — «видеть», но здесь выражение может подразумевать избрание или обеспечение.'
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул «Господь».
- source_word: מִתְאַבֵּל
  choice: скорбеть
  rationale: Глагол означает скорбеть, оплакивать; «скорбеть» естественно передаёт продолжающееся переживание Самуила, не ограничивая его формальным трауром.
- source_word: מְאַסְתִּיו
  choice: Я отверг его
  rationale: Глагол מאס здесь обозначает отвержение Саула именно как царя и не расширяет утверждение до вопроса о его окончательной духовной участи.
- source_word: מִמְּלֹךְ עַל־יִשְׂרָאֵל
  choice: чтобы он больше не царствовал над Израилем
  rationale: Оборот с מן и инфинитивом выражает отстранение от царствования; «больше» ясно передаёт прекращение уже осуществлявшегося правления.
- source_word: מַלֵּא קַרְנְךָ שֶׁמֶן
  choice: Наполни свой рог маслом
  rationale: Сохранён конкретный образ рога как сосуда для масла помазания.
- source_word: אֶשְׁלָחֲךָ
  choice: Я посылаю тебя
  rationale: Форма выражает непосредственное и решительное поручение Бога.
- source_word: יִשַׁי בֵּית הַלַּחְמִי
  choice: Иессею из Вифлеема
  rationale: Современная естественная передача обозначения происхождения Иессея; буквальное «вифлеемлянину» в современном русском звучит менее обычно.
- source_word: רָאִיתִי
  choice: усмотрел
  rationale: «Усмотрел» сохраняет образ глагола ראה «видеть» и одновременно допускает контекстуальный смысл избрания или определения, не сводя многозначность к одному толкованию.
- source_word: בְּבָנָיו
  choice: среди его сыновей
  rationale: Предлог ב указывает на одного человека внутри группы сыновей Иессея.
- source_word: לִי
  choice: Себе
  rationale: Возвратное местоимение естественно передаёт личную заинтересованность и принадлежность, выраженную дательным местоимением.
- source_word: מֶלֶךְ
  choice: царя
  rationale: Неопределённый по форме существительный оборот обозначает ещё не названного царя из числа сыновей Иессея.
theological_decisions:
- issue: Объём Божьего отвержения Саула
  choice: Я отверг его, чтобы он больше не царствовал над Израилем
  alternative: Я отверг его как царя над Израилем
  rationale: Формулировка ограничивает прямое утверждение текста царским служением Саула и не делает дополнительных выводов о его окончательной участи.
- issue: Значение רָאִיתִי לִי в выборе будущего царя
  choice: Я усмотрел Себе царя
  alternative: Я выбрал Себе царя / Я предусмотрел Себе царя
  rationale: Основной текст сохраняет метафору видения и её возможный смысл избрания или обеспечения; сноска открыто указывает на диапазон значений.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис прямой и понятный; сохранены конкретные образы исходного текста и личное имя Яхве. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно устойчивой русской библейской традиции.
