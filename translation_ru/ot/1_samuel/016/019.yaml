  text: So Saul sent messengers to Jesse and said[a], “Send me your son David, who is with the flock.”
translation:
  language: ru
  text: 'И послал Саул вестников к Иессею и сказал: «Пришли ко мне своего сына Давида, который находится при стаде[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди стада».'
    reason: Еврейское בַּצֹּאן допускает понимание местонахождения как рядом со стадом или среди него.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Форма wayyiqtol обозначает последовательное действие в повествовании; «послал» естественно передаёт простое прошедшее действие.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В данном человеческом контексте слово означает посланцев или вестников, а не ангелов; «вестников» сохраняет повествовательный библейский регистр без излишне дипломатического оттенка.
- source_word: אֶל יִשָׁי
  choice: к Иессею
  rationale: Предлог указывает направление, а традиционная русская форма имени «Иессей» здесь поставлена в дательном падеже.
- source_word: וַיֹּאמֶר
  choice: и сказал
  rationale: Глагол вводит прямую речь; буквальная конструкция сохраняет последовательность еврейского повествования.
- source_word: שִׁלְחָה אֵלַי
  choice: пришли ко мне
  rationale: Повелительная форма שׁלח и направительное אֵלַי естественно передаются русским «пришли ко мне».
- source_word: אֶת דָּוִד בִּנְךָ
  choice: своего сына Давида
  rationale: Русский порядок слов естественно передаёт приложение «Давида, сына твоего», а возвратное «своего» однозначно соотносит сына с адресатом, Иессеем.
- source_word: אֲשֶׁר בַּצֹּאן
  choice: который при стаде
  rationale: 'Краткое «при стаде» сохраняет пространственную широту בַּצֹּאן: Давид находится со стадом или среди него, без добавления прямо не названного действия «пасёт».'
