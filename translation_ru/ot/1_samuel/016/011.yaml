  to: 'Тогда Самуил спросил Иессея: «Это все юноши?» Тот ответил: «Остался ещё младший, а он пасёт овец[a]». Самуил сказал Иессею: «Пошли за ним и приведи его, потому что мы не сядем[b], пока он не придёт сюда».'
  rationale: 'Устранены две небольшие, но существенные конкретизации: «сыновья» заменено на соответствующее исходному тексту «юноши», а «сейчас» удалено, поскольку оно не соответствует וְהִנֵּה. Остальные решения верны: «младший», «пасёт овец», повеление привести его и «не сядем» адекватно передают еврейский текст и его вероятный контекст. Сноска к «не сядем» сохраняет осторожность в отношении значения לֹא נָסֹב.'
