base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/011.yaml
  text: Then Samuel said to Jesse[a], “Are these all the young men?” And he said, “The youngest still remains, and behold, he is shepherding the flock.” Then Samuel said to Jesse, “Send and bring him[b], for we will not sit down until he comes here.”
translation:
  language: ru
  text: 'Тогда Самуил спросил Иессея: «Это все юноши?» Тот ответил: «Остался ещё младший, а он пасёт овец[a]». Самуил сказал Иессею: «Пошли за ним и приведи его, потому что мы не сядем[b], пока он не придёт сюда».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пасёт стадо».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не займём своих мест»; вероятно, имеется в виду, что собравшиеся не начнут трапезу или торжественное собрание до его прихода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַמּוּ הַנְּעָרִים
  choice: Это все твои сыновья?
  rationale: תמם выражает полноту состава, а הַנְּעָרִים в данном семейном контексте обозначает представленных сыновей Иессея. Такая формулировка естественно передаёт смысл вопроса по-русски.
- source_word: עוֹד שָׁאַר הַקָּטָן
  choice: Остался ещё младший
  rationale: Сочетание עוֹד с שׁאר подчёркивает, что один не был представлен; הַקָּטָן в семье естественно означает младшего сына.
- source_word: וְהִנֵּה
  choice: сейчас
  rationale: Частица вводит примечательное пояснение о местонахождении младшего. В естественной русской речи её дейктическая функция здесь передана наречием «сейчас», без архаичного «вот» или «се».
- source_word: רֹעֶה בַּצֹּאן
  choice: пасёт овец
  rationale: Причастие передаёт продолжающееся действие, а צֹאן — мелкий скот или стадо. «Пасёт овец» — ясный и естественный контекстуальный перевод; буквальная образность отмечена в сноске.
- source_word: שִׁלְחָה וְקָחֶנּוּ
  choice: Пошли за ним и приведи его
  rationale: Сохранены оба элемента повеления — послать и доставить юношу, при этом русское «пошли за ним» ясно передаёт подразумеваемую цель посылки.
- source_word: לֹא נָסֹב
  choice: мы не сядем
  rationale: Контекстуально оборот, вероятно, означает не занимать места и не начинать собрание или трапезу. Краткий перевод сохраняет эту естественную для сцены двусмысленность, разъяснённую в сноске.
- source_word: עַד בֹּאוֹ פֹה
  choice: пока он не придёт сюда
  rationale: Естественная русская временная конструкция точно передаёт предел ожидания.
