  text: וַ/יַּעֲבֵ֥ר יִשַׁ֛י שִׁבְעַ֥ת בָּנָ֖י/ו לִ/פְנֵ֣י שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל יִשַׁ֔י לֹא בָחַ֥ר יְהוָ֖ה בָּ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/010.yaml
  text: So Jesse had seven of his sons pass before Samuel, and Samuel said to Jesse, “Yahweh has not chosen any of these.”
translation:
  language: ru
  text: 'Иессей провёл перед Самуилом семерых своих сыновей, и Самуил сказал Иессею: «Яхве не избрал никого из них».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: провёл
  rationale: 'Порода хифиль выражает каузативное действие: Иессей сделал так, чтобы сыновья прошли перед Самуилом. Русское «провёл» естественно передаёт это значение.'
- source_word: שִׁבְעַת בָּנָיו
  choice: семерых своих сыновей
  rationale: Конструкция обозначает семерых сыновей Иессея и в данном контексте не утверждает, что это все его сыновья.
- source_word: לִפְנֵי
  choice: перед
  rationale: 'Обычное пространственно-реляционное значение: сыновья были поочерёдно представлены Самуилу.'
- source_word: לֹא בָחַר
  choice: не избрал
  rationale: Глагол בחר означает «выбирать, избирать»; «избрал» сохраняет весомый оттенок Божьего выбора и естественно звучит по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: בָּאֵלֶּה
  choice: не их
  rationale: Предлог ב с указательным местоимением здесь указывает на выбор из числа представленных сыновей. Отрицательная конструкция «не их избрал» кратко и естественно означает, что ни один из них не был избран.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Смысл отрицания в לֹא בָחַר יְהוָה בָּאֵלֶּה
  choice: «Не их избрал Яхве»
  alternative: «Никого из них не избрал Яхве»
  rationale: Выбранный вариант сохраняет компактность и порядок смысловых компонентов оригинала; в русском контексте он ясно исключает всех семерых, не усиливая формулировку сверх еврейского текста.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Союз «но» естественно обозначает переход к отрицательному итогу осмотра кандидатов; пунктуация и синтаксис рассчитаны на ясное чтение вслух.
