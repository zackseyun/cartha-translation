base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/013.yaml
  text: Then Samuel took the horn of oil and anointed him in the midst of his brothers[a]. And the Spirit of Yahweh rushed upon David from that day onward[b]. Then Samuel rose and went to Ramah.
translation:
  language: ru
  text: Тогда Самуил взял рог с маслом и помазал Давида среди его братьев. И с того дня и впредь Дух Яхве с силой сошёл на Давида[a][b]. Затем Самуил встал и пошёл в Раму.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могущественно действовал на Давида». Древнееврейский глагол может обозначать сильное, наделяющее силой действие Духа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дух Яхве с силой сошёл на Давида». В древнееврейском тексте прописные и строчные буквы не различаются; написание «Дух» отражает понимание переводчика.'
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: рог с маслом
  rationale: Сохраняет конкретный образ рога животного, служившего сосудом, а русская конструкция естественно передаёт еврейское сочетание.
- source_word: וַיִּמְשַׁח
  choice: помазал
  rationale: Стандартно передаёт как физическое действие с маслом, так и его царское и богословское значение.
- source_word: בְּקֶרֶב אֶחָיו
  choice: среди его братьев
  rationale: Точно и естественно передаёт действие, совершённое посреди братьев Давида, не добавляя предположений о степени публичности.
- source_word: וַתִּצְלַח רוּחַ יְהוָה אֶל דָּוִד
  choice: Дух Яхве с силой сошёл на Давида
  rationale: Выражение «с силой сошёл» передаёт резкое, действенное и наделяющее силой наступление, выраженное глаголом צלח, без сглаживания образа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: с того дня
  rationale: В сочетании с контекстом естественно обозначает начало продолжительного действия; значение дальнейшей длительности разъяснено формой всей фразы.
- source_word: וַיָּקָם
  choice: встал
  rationale: Краткий и естественный русский эквивалент повествовательного употребления קום.
- source_word: הָרָמָתָה
  choice: в Раму
  rationale: Передаёт направительный суффикс и использует принятую русскую форму топонима.
theological_decisions:
- issue: Передача רוּחַ יְהוָה
  choice: Дух Яхве
  alternative: дух Яхве
  rationale: Контекст указывает на действенное Божье присутствие, наделяющее Давида силой, поэтому выбрана прописная буква; при этом древнееврейское письмо само по себе такого различия не обозначает, и возможность строчной буквы отмечена в сноске.
- issue: Характер сошествия Духа на Давида
  choice: с силой сошёл на Давида
  alternative: могущественно действовал на Давида; овладел Давидом
  rationale: Сохраняет интенсивность צלח и не сводит выражение ни только к внутреннему переживанию, ни к позднейшей систематической формулировке.
- issue: Обстановка помазания Давида
  choice: среди его братьев
  alternative: в присутствии его братьев
  rationale: Перевод прямо сохраняет указанное текстом семейное окружение, не делая дополнительных выводов о более широкой публичности события.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и ясный; сохранены конкретный образ рога, личное имя Яхве и интенсивность действия Духа. Имя «Давида» повторено вместо местоимения в первом предложении ради ясности по-русски.
