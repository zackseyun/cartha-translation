  yaml_path: translation/ot/1_samuel/016/014.yaml
  text: The Spirit of Yahweh had departed from Saul[a], and an evil spirit from Yahweh terrified him.
translation:
  language: ru
  text: Дух Господа отошёл от Саула, и злой дух[a] от Господа наводил на него ужас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вредоносный дух» или «дух, причиняющий бедствие». Еврейское прилагательное может обозначать как зло, так и нечто вредоносное или бедственное по своему действию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: Дух Господа
  rationale: רוּחַ может означать «дух», «ветер» или «дыхание», но здесь речь идёт о Божьем Духе, прежде сошедшем на Саула и наделившем его силой. Прописная буква указывает на этот личный божественный референт. Имя יהוה передано традиционным русским соответствием «Господь».
- source_word: סָרָה מֵעִם
  choice: отошёл от
  rationale: Глагол סוּר означает «отойти», «удалиться», а сочетание с מֵעִם выражает прекращение пребывания с кем-либо. «Отошёл от» точно и естественно передаёт эту мысль.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Устоявшаяся русская форма личного имени.
- source_word: וּבִעֲתַתּוּ
  choice: стал наводить на него ужас
  rationale: Глагол בעת обозначает внезапный сильный страх, ужас. Такая формулировка сохраняет его основное значение и естественно звучит по-русски; «мучил» было бы более широким и менее точным толкованием.
- source_word: רוּחַ רָעָה
  choice: злой дух
  rationale: Прилагательное רָעָה может обозначать нравственное зло, а также нечто вредоносное или бедственное. «Злой дух» — прямой и традиционно понятный перевод; возможные оттенки отмечены в сноске.
- source_word: מֵאֵת יְהוָה
  choice: от Господа
  rationale: מֵאֵת прямо указывает на источник или происхождение. Перевод «посланный Господом» был бы возможным толкованием, но добавлял бы отсутствующий в еврейском тексте глагол.
theological_decisions:
- issue: Как передать происхождение духа, наводившего ужас на Саула, не смягчая и не истолковывая заранее еврейский текст
  choice: злой дух от Господа
  alternative: вредоносный / губительный дух от Господа; злой дух, посланный Господом
  rationale: Еврейский текст недвусмысленно связывает происхождение этого духа с Господом, но не поясняет механизм и не содержит глагола «послал». Перевод сохраняет эту богословскую напряжённость. Семантическая широта רָעָה отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским регистром. Союз וְ передан связью предложений без добавления временного «теперь». Форма «стал наводить на него ужас» передаёт начало повторяющегося или продолжающегося устрашающего воздействия, не вводя более широкого значения «мучить».
