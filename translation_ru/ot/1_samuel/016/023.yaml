base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/023.yaml
  text: And whenever the spirit of God came upon Saul[a], David would take the lyre and play it with his hand; then Saul found relief, and it was well with him[c][b], and the harmful spirit departed from him.
translation:
  language: ru
  text: И всякий раз, когда дух Божий нисходил на Саула, Давид брал лиру[a] и играл на ней; тогда Саулу становилось легче, и ему было хорошо, а мучительный дух[b] отступал от него.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «арфу». Еврейское слово «киннор» обозначает древний струнный инструмент, вероятно, больше похожий на лиру, чем на современную арфу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «злой дух». Еврейское слово может означать как нравственное зло, так и нечто вредоносное или причиняющее бедствие; здесь перевод подчёркивает мучительное воздействие на Саула.'
    reason: lexical_alternative
  - marker: c
    text: В начале стиха по-еврейски сказано «дух Божий», а в конце — «мучительный дух». Перевод сохраняет это различие и не согласует два выражения между собой.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בִּהְיוֹת
  choice: И всякий раз, когда
  rationale: Конструкция היה с инфинитивом в данном повествовательном контексте обозначает повторяющееся обстоятельство; «всякий раз» естественно передаёт итеративность.
- source_word: רוּחַ אֱלֹהִים
  choice: дух Божий
  rationale: Еврейский текст в первой части стиха говорит именно «дух Божий», не добавляя определения «злой» или «мучительный».
- source_word: אֶל שָׁאוּל
  choice: находил на Саула
  rationale: Так передаётся наступление состояния, вызванного духом, при сохранении возвышенного повествовательного регистра.
- source_word: הַכִּנּוֹר
  choice: лиру
  rationale: Киннор — древний струнный инструмент, по устройству, вероятно, ближе к лире, чем к современной арфе.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: играл на ней
  rationale: Глагол означает игру на струнном инструменте. Упоминание руки в русском здесь избыточно и звучало бы неестественно; смысл выражения передан идиоматически.
- source_word: וְרָוַח לְשָׁאוּל וְטוֹב לוֹ
  choice: тогда Саулу становилось легче и лучше
  rationale: Фраза передаёт облегчение и улучшение состояния Саула; русская формулировка естественна и сохраняет оба элемента оригинала.
- source_word: רוּחַ הָרָעָה
  choice: мучительный дух
  rationale: רָעָה может означать зло либо причинение вреда и бедствия. В данном контексте «мучительный» подчёркивает воздействие на Саула, не предрешая вопрос о нравственной природе духа.
- source_word: וְסָרָה מֵעָלָיו
  choice: отступал от него
  rationale: Глагол סור обозначает удаление или прекращение присутствия; несовершенный вид соответствует повторяющемуся действию.
theological_decisions:
- issue: Соотношение רוּחַ אֱלֹהִים в начале стиха и רוּחַ הָרָעָה в конце
  choice: 'Сохранить различие: «дух Божий» и «мучительный дух»'
  alternative: Согласовать выражения как «мучительный дух от Бога» либо перевести второе как «злой дух»
  rationale: В самом еврейском стихе употреблены разные выражения. Их различие сохранено, чтобы не вносить в перевод контекстуальное или богословское истолкование и не устранять напряжение текста.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным повествовательным тоном. Синтаксис сделан естественным для обычного читателя; повторяемость происходящего передана формами «всякий раз», «становилось» и «отступал».
