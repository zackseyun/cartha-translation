revisions:
- from: И всякий раз, когда дух Божий находил на Саула, Давид брал лиру[a] и играл на ней; тогда Саулу становилось легче и лучше, и мучительный дух[b] отступал от него.[c]
  to: И всякий раз, когда дух Божий нисходил на Саула, Давид брал лиру[a] и играл на ней; тогда Саулу становилось легче, и ему было хорошо, а мучительный дух[b] отступал от него.[c]
  rationale: Исправлено неудачное «находил на Саула» на «нисходил на Саула», которое естественно передаёт действие רוח с предлогом אל в данном повествовательном контексте. Также уточнена передача «становилось легче и лучше», чтобы раздельно и естественно выразить облегчение и улучшение состояния. Сноски сохранены по содержанию и привязкам; текст не гармонизирует два различных еврейских обозначения духа.
