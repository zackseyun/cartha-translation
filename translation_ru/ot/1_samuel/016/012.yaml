base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/012.yaml
  text: So he sent and brought him in. Now he was ruddy[a], with beautiful eyes and a handsome appearance. And Yahweh said, “Rise, anoint him, for this is he.”
translation:
  language: ru
  text: 'Тогда он послал за ним и привёл его. Он был румяным[a], с красивыми глазами и хорош собой. И Яхве сказал: «Встань, помажь его, потому что это он».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «красноватым»; еврейское слово указывает на красноватую окраску внешности, не уточняя её точную особенность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח וַיְבִיאֵהוּ
  choice: Тогда он послал за ним, и его привели
  rationale: Последовательные формы продвигают повествование. Такая формулировка естественна по-русски и передаёт, что за Давидом послали и доставили его к Самуилу, не утверждая сверх текста, что Иессей лично ходил за ним.
- source_word: אַדְמוֹנִי
  choice: румяным
  rationale: Слово описывает красноватый оттенок внешности. «Румяным» естественно в русском описании человека и не сводит значение исключительно к цвету волос; лексическая неоднозначность отмечена в сноске.
- source_word: עִם יְפֵה עֵינַיִם
  choice: с красивыми глазами
  rationale: Прямо и естественно передаёт буквальное описание глаз Давида без добавочного толкования.
- source_word: וְטוֹב רֹאִי
  choice: и приятной внешностью
  rationale: Передаёт привлекательность наружности, сохраняя отличие этой общей характеристики от предшествующего упоминания глаз.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: קוּם מְשָׁחֵהוּ
  choice: Встань, помажь его
  rationale: Сохраняет два кратких повеления и обычный для царского избрания глагол «помазать».
- source_word: כִּי זֶה הוּא
  choice: потому что это он
  rationale: Сохраняет краткое и emphатическое отождествление избранника, не расширяя его до пояснительного выражения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Описание внешности Давида
  choice: Сохранить физическое описание без символического или нравственного истолкования
  alternative: Истолковать румянец, глаза или внешность как указание на нравственные качества
  rationale: Стих прямо описывает наружность Давида. Контекстуальное напряжение между человеческим взглядом и Божьим избранием следует сохранить, не приписывая деталям невыраженного символизма.
- issue: Краткая формула כִּי זֶה הוּא
  choice: потому что это он
  alternative: потому что это тот, кого Я избрал
  rationale: Расширенный вариант проясняет смысл, но добавляет слова и явно формулирует то, что еврейский текст оставляет в кратком указании.
translation_notes:
  register: Современный литературный русский язык с краткой, dignified повествовательной интонацией. Синтаксис прямой и доступный; архаизмы устранены, а традиционные библейские термины «Яхве» и «помажь» сохранены ради точности.
