  text: So Jesse took a donkey[a], bread, a skin of wine, and one young goat[b], and sent them by the hand of David his son to Saul.
translation:
  language: ru
  text: Иессей взял осла, навьюченного хлебом, бурдюк вина и одного козлёнка и отправил всё это Саулу через своего сына Давида.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Иессей взял
  rationale: Форма wayyiqtol продолжает повествование; в русском связка «и» между двумя однородными сказуемыми естественно передаёт последовательность действий.
- source_word: חֲמוֹר לֶחֶם
  choice: осла, навьюченного хлебом
  rationale: Дословное соседство «осёл, хлеб» обозначает осла, несущего хлеб. Русский требует явно выразить эту смысловую связь; «навьюченного» точно соответствует использованию осла как вьючного животного.
- source_word: נֹאד יַיִן
  choice: бурдюк вина
  rationale: נֹאד — кожаный сосуд, в данном случае для вина; «бурдюк вина» — краткое и понятное русское соответствие.
- source_word: גְּדִי עִזִּים אֶחָד
  choice: одного козлёнка
  rationale: Сочетание обозначает одну молодую особь козы; русский термин «козлёнок» естественно передаёт вид и возраст.
- source_word: וַיִּשְׁלַח
  choice: и послал всё это
  rationale: Объект глагола подразумевается перечисленными дарами. «Всё это» естественно восполняет его в русском и не создаёт впечатления, будто к Саулу послали также осла как самостоятельный дар.
- source_word: בְּיַד
  choice: со своим сыном Давидом
  rationale: Идиома «рукой Давида» выражает посредничество и доставку. В современном русском «послал ... с Давидом» ясно передаёт функцию Давида как доставившего припасы.
- source_word: דָּוִד בְּנוֹ
  choice: со своим сыном Давидом
  rationale: Такой порядок слов естественен для современного русского и ясно относит «сын» к Иессею.
- source_word: אֶל שָׁאוּל
  choice: к Саулу
  rationale: Предлог אֶל обозначает направление к лицу; нормативное русское соответствие — «к Саулу».
