  source_fidelity: 'В целом перечень даров передан точно: осёл понимается как вьючное животное, хлеб, бурдюк вина и один козлёнок сохранены. Идиома בְּיַד («рукой», то есть через/посредством) требует более однозначно выразить, что Давид является доставляющим дары.'
