  terminology: Имена «Иессей», «Давид» и «Саул» нормативны для русского библейского употребления. «Бурдюк вина» и «козлёнок» удачны. «Навьюченного хлебом» — оправданное эксплицирование синтаксически подразумеваемой связи «осёл — хлеб».
