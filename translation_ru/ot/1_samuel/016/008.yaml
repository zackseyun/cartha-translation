base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/008.yaml
  text: Then Jesse called Abinadab and made him pass before Samuel. And he said[a], “Yahweh has not chosen this one either.”
translation:
  language: ru
  text: 'Иессей позвал Авинадава и велел ему пройти перед Самуилом. И он сказал: «Яхве не избрал и этого».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא יִשַׁי אֶל־אֲבִינָדָב
  choice: Иессей позвал Авинадава
  rationale: Глагол קרא здесь означает «позвать, вызвать». В русском языке переходная конструкция «позвал Авинадава» естественно передаёт смысл еврейского выражения с אֶל.
- source_word: וַיַּעֲבִרֵהוּ לִפְנֵי שְׁמוּאֵל
  choice: велел ему пройти перед Самуилом
  rationale: Каузативная порода глагола עבר указывает, что Иессей распорядился, чтобы Авинадав прошёл перед Самуилом. Такая формулировка сохраняет каузативность и звучит естественнее, чем буквальное «провёл его».
- source_word: וַיֹּאמֶר
  choice: И он сказал
  rationale: В еврейском тексте субъект не назван. Местоименная формулировка сохраняет эту грамматическую неявность; из контекста наиболее вероятным говорящим является Самуил.
- source_word: גַּם בָּזֶה
  choice: и этого
  rationale: 'Частица גַּם имеет добавочное значение: после отклонения Елиава не избран также и Авинадав. Русское «не избрал и этого» кратко и идиоматично передаёт данный смысл.'
- source_word: לֹא בָחַר
  choice: не избрал
  rationale: Перфект בחר обозначает состоявшийся выбор с актуальным результатом. В русском повествовании совершенный вид «не избрал» естественно передаёт эту оценку.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не замещающий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Кто произносит заключительную реплику
  choice: И он сказал
  alternative: И Самуил сказал
  rationale: Контекст указывает на Самуила, однако еврейский текст прямо не называет субъекта. Местоимение сохраняет формальную неоднозначность, не мешая пониманию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся простым и последовательным; каузативная конструкция передана ясно, а неявный субъект заключительной реплики не уточнён сверх исходного текста.
