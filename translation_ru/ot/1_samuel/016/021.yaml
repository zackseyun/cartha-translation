  text: So David came to Saul and stood before him[a], and Saul loved him greatly, and he became his armor-bearer.
translation:
  language: ru
  text: И пришёл Давид к Саулу и стал перед ним[a]. Саул очень полюбил его, и Давид стал его оруженосцем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стал перед ним». Это выражение может обозначать служение при царе или пребывание в его свите.'
    reason: Сохраняет буквальный образ еврейского выражения עמד לפני и поясняет возможный служебный оттенок, не навязывая его в основном тексте.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Глагол בוא с אֶל обозначает движение к Саулу; «пришёл к Саулу» естественно передаёт повествовательную форму, не добавляя идеи входа в конкретное помещение.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: стал служить при нём
  rationale: Идиома עמד לפני буквально говорит о стоянии перед вышестоящим, но в придворном контексте означает пребывание при нём в качестве слуги. Перевод передаёт служебный смысл; буквальный образ сохранён в сноске.
- source_word: וַיֶּאֱהָבֵהוּ מְאֹד
  choice: Саул очень полюбил его
  rationale: Подлежащее, подразумеваемое глагольной формой, уточнено из ближайшего контекста во избежание двусмысленности. «Очень полюбил» передаёт усиление מְאֹד и сильное личное расположение.
- source_word: וַיְהִי לוֹ
  choice: стал его
  rationale: Конструкция выражает возникшее состояние или назначение; «стал его» естественно связывает её с названием должности.
- source_word: נֹשֵׂא כֵלִים
  choice: оруженосцем
  rationale: Буквально — «носящий снаряжение/оружие». «Оруженосец» является ясным и традиционным русским названием военного служителя, носившего вооружение господина.
