  text: When they came in[a], he saw Eliab and said, “Surely Yahweh’s anointed is before Yahweh.”
translation:
  language: ru
  text: 'Когда они вошли, Самуил увидел Елиава и сказал: «Несомненно, перед Яхве — его помазанник[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его Мессия». Еврейское слово מָשִׁיחַ означает «помазанник» и позднее употребляется как титул «Мессия»; здесь Самуил имеет в виду того, кого он считает избранным Яхве для царского помазания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאָם
  choice: Когда они вошли
  rationale: Вводная повествовательная конструкция с בְּ и инфинитивом передаёт время следующего действия. Современное русское «когда они вошли» естественно выражает этот смысл без архаичного «и было».
- source_word: וַיַּרְא אֶת־אֱלִיאָב
  choice: Самуил увидел Елиава
  rationale: Глагол ראה передан прямо как «увидел». Имя Самуила восстановлено вместо местоимения ради ясности русского повествования; Елиав — принятая русская передача имени אֱלִיאָב.
- source_word: וַיֹּאמֶר
  choice: и сказал
  rationale: אמר обычно означает «сказал». Хотя это могли быть невысказанные мысли Самуила, исходный текст прямо не обозначает внутреннюю речь, поэтому интерпретирующее «подумал» не вводится.
- source_word: אַךְ
  choice: Несомненно
  rationale: В данном контексте частица выражает уверенное заключение Самуила при виде Елиава.
- source_word: נֶגֶד יְהוָה
  choice: перед Яхве
  rationale: נֶגֶד означает «перед, в присутствии», а יְהוָה — явно названный участник конструкции. Формулировка сохраняет краткость и некоторую напряжённость еврейской безглагольной фразы.
- source_word: מְשִׁיחוֹ
  choice: Его помазанник
  rationale: Существительное מָשִׁיחַ с местоименным суффиксом означает «его помазанник». Здесь речь идёт о человеке, которого Яхве избрал для царского помазания; прописная буква в «Его» ясно относит суффикс к Яхве, не превращая выражение в позднейший титул.
theological_decisions:
- issue: Передача מְשִׁיחוֹ в рассказе об избрании царя
  choice: Его помазанник
  alternative: Его Мессия
  rationale: В непосредственном контексте Самуил ошибочно принимает Елиава за избранного Яхве будущего царя. «Помазанник» сохраняет исторический смысл, тогда как «Мессия» могло бы неоправданно навязать позднейшую титульную и христологическую конкретизацию. Лексическая связь отмечена в сноске.
- issue: Синтаксическое понимание נֶגֶד יְהוָה מְשִׁיחוֹ
  choice: перед Яхве — Его помазанник
  alternative: перед Ним — помазанник Яхве
  rationale: Еврейский текст буквально ставит «перед Яхве» рядом с «Его помазанник» без выраженной связки. Выбранный вариант сохраняет прямое упоминание имени Яхве и не устраняет лаконичность исходной фразы.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Имя Яхве передано транслитерацией. Тире воспроизводит сжатую безглагольную структуру заключительной фразы; восклицательный знак передаёт уверенность Самуила. Маркер сноски поставлен непосредственно после слова, к которому относится.
