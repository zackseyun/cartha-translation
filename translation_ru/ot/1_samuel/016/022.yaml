lexical_decisions:
- source_word: וַיִּשְׁלַח שָׁאוּל אֶל יִשַׁי לֵאמֹר
  choice: Тогда Саул послал сказать Иессею
  rationale: Форма wayyiqtol продвигает повествование; «тогда» естественно передаёт последовательность. Сочетание «послал сказать» ясно выражает отправку сообщения, вводимого לֵאמֹר.
- source_word: יַעֲמָד נָא דָוִד לְפָנַי
  choice: Пусть Давид останется у меня на службе
  rationale: Юссив עמד с נָא выражает вежливую просьбу. В придворном контексте לְפָנַי означает постоянное пребывание при царе и служение ему; буквальное «стоит передо мной» по-русски могло бы ошибочно обозначать лишь положение тела.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину просьбы Саула.
- source_word: מָצָא חֵן בְּעֵינָי
  choice: он обрёл моё расположение
  rationale: Еврейская идиома буквально говорит о нахождении благоволения «в моих глазах». «Обрёл моё расположение» естественно передаёт здесь личное одобрение царя без неуместного богословского оттенка слова «благодать».
- source_word: דָוִד / שָׁאוּל / יִשַׁי
  choice: Давид / Саул / Иессей
  rationale: Использованы укоренившиеся в русской библейской традиции формы личных имён.
