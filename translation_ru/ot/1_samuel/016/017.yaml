lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда Саул сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: עֲבָדָיו
  choice: своим слугам
  rationale: עֶבֶד означает «слуга»; в данном контексте речь идёт о людях при царском дворе, но более конкретное «придворным» в самом слове не выражено.
- source_word: רְאוּ נָא
  choice: Найдите, пожалуйста
  rationale: Императив ראה с частицей вежливой просьбы נָא здесь идиоматически означает разыскать или подобрать нужного человека.
- source_word: לִי
  choice: для меня
  rationale: Предлог обозначает лицо, в чьих интересах совершается действие.
- source_word: אִישׁ
  choice: человека
  rationale: В современном русском «человека» естественно передаёт אִישׁ в значении искомого лица; мужской род сохраняется также последующим местоимением «его».
- source_word: מֵיטִיב לְנַגֵּן
  choice: который хорошо играет
  rationale: Выражение буквально описывает того, кто «хорошо делает, играя», то есть искусно играет на музыкальном инструменте; вид инструмента в стихе не назван.
- source_word: וַהֲבִיאוֹתֶם אֵלָי
  choice: и приведите его ко мне
  rationale: Передан обращённый к нескольким слугам приказ привести найденного человека к Саулу.
