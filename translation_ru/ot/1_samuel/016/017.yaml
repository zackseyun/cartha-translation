  yaml_path: translation/ot/1_samuel/016/017.yaml
  text: Then Saul said to his servants[a], “Please find for me a man who can play well, and bring him to me.”
translation:
  language: ru
  text: 'Тогда Саул сказал своим слугам: «Найдите, пожалуйста, для меня мужчину, который искусно играет[a], и приведите его ко мне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хорошо играющего»; то есть играющего искусно.'
