  text: Then Jesse made Shammah pass by, and he said, “Yahweh has not chosen this one either.”
translation:
  language: ru
  text: 'Иессей велел Шамме пройти, и Самуил сказал: «И этого Яхве не избрал».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: велел пройти перед Самуилом
  rationale: 'Порода hифиль придаёт глаголу עבר каузативное значение: Иессей побудил Шамму пройти перед тем, кто рассматривал сыновей. Дополнение «перед Самуилом» ясно из ближайшего контекста и делает фразу естественной по-русски.'
- source_word: יִשַׁי
  choice: Иессей
  rationale: Традиционная и узнаваемая русская форма библейского имени.
- source_word: שַׁמָּה
  choice: Шамме
  rationale: Передача имени Шамма в дательном падеже после «велел»; форма основы следует еврейскому произношению точнее, чем традиционное «Самма».
- source_word: וַיֹּאמֶר
  choice: Но тот сказал
  rationale: Еврейский текст буквально оставляет говорящего выраженным только глагольной формой; по контексту это Самуил. Местоимение «тот» сохраняет отсутствие повторного называния и устраняет возможное ошибочное отнесение слов к Иессею.
- source_word: גַּם בָּזֶה
  choice: и этого
  rationale: В отрицательной фразе גַּם имеет присоединительное значение «также, тоже»; по-русски естественно передаётся конструкцией «и этого … не».
- source_word: לֹא בָחַר
  choice: не избрал
  rationale: בחר означает «выбирать, избирать». «Не избрал» соответствует контексту Божьего выбора будущего царя и сохраняет лаконичность исходного текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога, обозначенное тетраграмматоном, передано транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. «Яхве» сохраняет его как имя и отражает наиболее общепринятую научную реконструкцию произношения.
- issue: Смысл глагола בחר в контексте помазания царя
  choice: избрал
  alternative: выбрал
  rationale: «Избрал» естественно передаёт целенаправленный Божий выбор, не добавляя утверждений о природе или последствиях этого избрания.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сделан естественным для обычного читателя; явное «перед Самуилом» восполняет подразумеваемого участника действия из непосредственного контекста.
