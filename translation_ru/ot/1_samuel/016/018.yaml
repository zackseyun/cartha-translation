  text: וַ/יַּעַן֩ אֶחָ֨ד מֵ/הַ/נְּעָרִ֜ים וַ/יֹּ֗אמֶר הִנֵּ֨ה רָאִ֜יתִי בֵּ֣ן לְ/יִשַׁי֮ בֵּ֣ית הַלַּחְמִי֒ יֹדֵ֣עַ נַ֠גֵּן וְ/גִבּ֨וֹר חַ֜יִל וְ/אִ֧ישׁ מִלְחָמָ֛ה וּ/נְב֥וֹן דָּבָ֖ר וְ/אִ֣ישׁ תֹּ֑אַר וַ/יהוָ֖ה עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/018.yaml
  text: Then one of the young men answered and said[a], “Look, I have seen a son of Jesse the Bethlehemite who is skillful in playing, a mighty man of valor, a man of war, prudent in speech, and a handsome man[d][c][b], and Yahweh is with him.”
translation:
  language: ru
  text: 'Тогда один из слуг ответил: «Вот, я видел сына Иессея, жителя Вифлеема: он искусно играет, он сильный и храбрый человек, воин, рассудителен в речах и красив собой; и Яхве с ним».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «знающий играть». Музыкальный инструмент в этом стихе не назван.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן אֶחָד מֵהַנְּעָרִים וַיֹּאמֶר
  choice: Тогда один из слуг сказал
  rationale: ענה ויאמר — обычная формула введения реплики; по-русски сочетание «ответил и сказал» избыточно. В придворном контексте נְעָרִים естественно означает слуг или приближённых.
- source_word: הִנֵּה רָאִיתִי
  choice: Я видел
  rationale: הִנֵּה привлекает внимание к сообщению, но отдельное «вот» в современной русской реплике необязательно; перфект ראיתי естественно передан прошедшим временем.
- source_word: בֵּן לְיִשַׁי בֵּית הַלַּחְמִי
  choice: одного из сыновей Иессея, вифлеемлянина
  rationale: Неопределённый בֵּן передан как «одного из сыновей»; грамматически форма «вифлеемлянин» может относиться к Иессею либо его сыну, поэтому двусмысленность отмечена в сноске.
- source_word: יֹדֵעַ נַגֵּן
  choice: он умеет играть
  rationale: Конструкция обозначает умение играть на музыкальном инструменте; сам инструмент в стихе не назван.
- source_word: גִּבּוֹר חַיִל
  choice: человек доблестный
  rationale: Сохраняет широкую хвалебную характеристику силы, отваги и состоятельности, не сводя её исключительно к воинскому званию.
- source_word: אִישׁ מִלְחָמָה
  choice: воин
  rationale: Естественный и точный русский эквивалент устойчивого выражения «человек войны».
- source_word: נְבוֹן דָּבָר
  choice: рассудительный в речах
  rationale: Передаёт как разумность и проницательность, так и вероятную связь דָּבָר с речью; более широкое понимание отмечено в сноске.
- source_word: אִישׁ תֹּאַר
  choice: красивый собой
  rationale: Естественная русская характеристика привлекательной внешности.
- source_word: וַיהוָה עִמּוֹ
  choice: И Яхве с ним
  rationale: Имя יהוה передано как «Яхве»; именная фраза сохраняет краткую, торжественную форму оригинала.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо употребляет личное имя Бога; транслитерация сохраняет различие между יהוה и титулом אֲדֹנָי.
- issue: Смысл формулы «Яхве с ним»
  choice: Сохранена без поясняющего расширения
  alternative: Яхве помогает ему / благоволит ему
  rationale: Формула может подразумевать присутствие, помощь и благоволение Бога; перевод не устраняет эту смысловую ёмкость.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Придворное נְעָרִים передано как «слуги», а не буквально «юноши». Перечень качеств сохранён ритмичным и понятным, без добавления не названного в стихе музыкального инструмента.
