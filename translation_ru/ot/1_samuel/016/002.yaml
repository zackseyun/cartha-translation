base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/002.yaml
  text: Samuel said[a], “How can I go? If Saul hears, he will kill me.” And Yahweh said, “Take a heifer with you and say, ‘I have come to sacrifice to Yahweh.’”
translation:
  language: ru
  text: 'Самуил сказал: «Как я могу пойти? Если Саул услышит, он убьёт меня». Яхве сказал: «Возьми с собой молодую корову[a] и скажи: „Я пришёл принести жертву Яхве“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «телицу»; молодую самку крупного рогатого скота.'
    reason: 'Лексическое уточнение к עֶגְלַת בָּקָר: основной текст использует нейтральное современное выражение, а сноска сохраняет более точное традиционное обозначение.'
lexical_decisions:
- source_word: אֵיךְ אֵלֵךְ
  choice: Как мне идти?
  rationale: Вопрос выражает не поиск дороги, а практическую невозможность или опасность поручения. Русская конструкция естественно передаёт эту озабоченность, не добавляя отсутствующего в тексте значения.
- source_word: וְשָׁמַע שָׁאוּל
  choice: Если Саул услышит
  rationale: Хотя формально употреблён союз וְ, в контексте возражения Самуила фраза имеет условный смысл, который по-русски естественно выражается союзом «если».
- source_word: וַהֲרָגַנִי
  choice: он убьёт меня
  rationale: Передаёт ожидаемое последствие в реальной условной ситуации и сохраняет непосредственность угрозы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не замещающий его титул.
- source_word: עֶגְלַת בָּקָר
  choice: тёлку
  rationale: Сочетание обозначает молодую самку крупного рогатого скота. «Тёлка» — точный и достаточно понятный русский эквивалент.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: Возьми с собой
  rationale: Буквальное «возьми в руку твою» является еврейским идиоматическим оборотом; «возьми с собой» естественно передаёт его смысл.
- source_word: לִזְבֹּחַ לַיהוָה בָּאתִי
  choice: Я пришёл принести жертву Яхве
  rationale: Сохраняет цель прихода и культовое значение глагола זבח; совершенный вид «пришёл» естественен в объявлении цели по прибытии.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация сохраняет отличие имени от титула.
- issue: Слова Самуила о цели прихода
  choice: Сохранено прямое утверждение без пояснения его нравственной оценки
  alternative: Добавить объяснение, что это была лишь часть цели или средство сокрытия
  rationale: Сам стих не разъясняет соотношение жертвоприношения и помазания Давида. Перевод сохраняет присущее повествованию напряжение и не вводит богословского оправдания в основной текст.
translation_notes:
  register: Современный литературный русский язык; речь краткая и естественная, при этом сохранены повествовательная серьёзность, прямота угрозы и личное имя Яхве.
