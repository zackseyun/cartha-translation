base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/003.yaml
  text: Invite Jesse to the sacrifice[a], and I will make known to you what you shall do[c][b]; and you shall anoint for me the one whom I tell you.
translation:
  language: ru
  text: Пригласи Иессея на жертвоприношение[a], а Я дам тебе знать, что ты должен делать[b]. И помажь для Меня того, о ком Я тебе скажу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «позови Иессея к жертве».'
    reason: 'Лексическая альтернатива: קרא может означать как приглашение, так и призыв, а זבח — жертву или событие жертвоприношения.'
  - marker: b
    text: 'Или: «что тебе делать».'
    reason: Более краткая передача אֲשֶׁר תַּעֲשֶׂה, в которой обязательность действия выражается контекстом.
  - marker: c
    text: 'Или: «того, на кого Я тебе укажу».'
    reason: Контекстуально ясная передача выражения אֲשֶׁר אֹמַר אֵלֶיךָ; основной текст ближе сохраняет глагол «сказать».
lexical_decisions:
- source_word: וְקָרָאתָ לְיִשַׁי
  choice: Пригласи Иессея
  rationale: В сочетании с указанием на жертвоприношение глагол קרא означает приглашение или призыв принять участие; «пригласи» естественно передаёт смысл в данном контексте. Имя יִשַׁי передано в принятой русской библейской форме «Иессей».
- source_word: בַּזָּבַח
  choice: на жертвоприношение
  rationale: זבח обозначает жертву, жертвоприношение или связанное с ним торжество. Здесь речь идёт о событии, на которое следует пригласить Иессея; «на жертвоприношение» сохраняет культовый смысл, не добавляя прямо не названного пиршества.
- source_word: וְאָנֹכִי אוֹדִיעֲךָ
  choice: а Я дам тебе знать
  rationale: Самостоятельное местоимение אָנֹכִי подчёркивает действующего — Бога; русское «а Я» передаёт это выделение. Каузативная форма ידע означает «дать знать, известить».
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: что ты должен делать
  rationale: Оборот указывает на действие, которое Самуилу надлежит совершить по Божьему указанию. «Должен» естественно выражает предписывающий оттенок, не превращая фразу в отдельный категорический приказ.
- source_word: וּמָשַׁחְתָּ לִי
  choice: И помажь для Меня
  rationale: משׁח — обычный глагол для ритуального помазания. לִי указывает, что помазание совершается для Бога, по Его избранию и поручению.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: того, о ком Я скажу тебе
  rationale: Формулировка близко следует еврейскому глаголу אמר («сказать»), сохраняя подразумеваемого человека как объект помазания и не добавляя более конкретного «назову» или «укажу» в основном тексте.
theological_decisions:
- issue: Назначение помазания
  choice: Сохранено общее «помажь», без добавления царского титула.
  alternative: «Помажь в цари».
  rationale: Контекст указывает на царское помазание, но сам стих не называет должность; перевод оставляет это уточнение повествовательному контексту.
- issue: Смысл выражения לִי
  choice: «для Меня»
  alternative: «Мне» или «от Моего имени».
  rationale: «Для Меня» сохраняет принадлежность Божьему замыслу и поручению, не сужая значение до одного лишь представительства.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис разделён на два предложения ради ясности; обращения Бога переданы с традиционным прописным «Я».
