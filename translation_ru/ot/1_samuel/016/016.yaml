source:
  edition: WLC
  text: יֹאמַר נָ֤א אֲדֹנֵ֨/נוּ֙ עֲבָדֶ֣י/ךָ לְ/פָנֶ֔י/ךָ יְבַקְשׁ֕וּ אִ֕ישׁ יֹדֵ֖עַ מְנַגֵּ֣ן בַּ/כִּנּ֑וֹר וְ/הָיָ֗ה בִּֽ/הְי֨וֹת עָלֶ֤י/ךָ רֽוּחַ אֱלֹהִים֙ רָעָ֔ה וְ/נִגֵּ֥ן בְּ/יָד֖/וֹ וְ/ט֥וֹב לָֽ/ךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/016.yaml
  text: Please let our lord say to your servants before you that they should seek out a man who knows how to play the lyre; and when a harmful spirit from God is upon you[a], he will play with his hand, and it will be well for you.
translation:
  language: ru
  text: Пусть наш господин прикажет своим слугам, стоящим перед ним, найти человека, умеющего играть на лире. И когда на тебя сойдёт злой дух от Бога[a], тот человек станет играть, и тебе будет хорошо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «губительный дух от Бога». Еврейское выражение допускает значения «злой» и «приносящий бедствие, вред»; связь с Богом можно также передать как «Божий».'
    reason: Сохраняется лексическая и синтаксическая неоднозначность выражения רוּחַ אֱלֹהִים רָעָה.
lexical_decisions:
- source_word: יֹאמַר נָא אֲדֹנֵינוּ
  choice: Пусть господин наш велит
  rationale: Форма с נָא выражает почтительную просьбу. В данном контексте יֹאמַר вводит распоряжение Саула слугам; «велит» естественно передаёт это значение по-русски.
- source_word: עֲבָדֶיךָ לְפָנֶיךָ
  choice: своим слугам, стоящим перед тобой
  rationale: 'Сохраняет обращение во втором лице и поясняет придворный смысл пространственного оборота: речь идёт о слугах, находящихся при царе.'
- source_word: יְבַקְשׁוּ אִישׁ
  choice: найти человека
  rationale: В контексте поручения поиск направлен на обнаружение подходящего человека; инфинитив естественно зависит от «велит».
- source_word: יֹדֵעַ מְנַגֵּן
  choice: умеющего играть
  rationale: Причастная конструкция обозначает приобретённое умение или компетентность.
- source_word: כִּנּוֹר
  choice: лира
  rationale: Древний щипковый струнный инструмент точнее соотносится с лирой, чем с современной арфой.
- source_word: וְהָיָה בִּהְיוֹת
  choice: И когда
  rationale: Естественно передаёт временную конструкцию без тяжеловесного буквального оборота.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: злой дух от Бога
  rationale: Сохраняет прямое значение רָעָה и явную связь духа с Богом, не объясняя дополнительно природу этой связи. Возможное значение «губительный» отмечено в сноске.
- source_word: עָלֶיךָ
  choice: на тебя сойдёт
  rationale: Передаёт воздействие духа, приходящего на Саула; в русском это естественнее статического «будет на тебе».
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: тот человек станет играть
  rationale: Русский глагол «играть» уже предполагает действие рукой на инструменте; буквальное «играть своей рукой» звучало бы неестественно. Подлежащее уточнено для ясности.
- source_word: וְטוֹב לָךְ
  choice: и тебе станет лучше
  rationale: Передаёт ожидаемое облегчение в данном контексте, не уточняя, будет ли оно только душевным или также телесным.
theological_decisions:
- issue: Как передать רוּחַ אֱלֹהִים רָעָה, сохранив связь духа с Богом и диапазон значения רָעָה
  choice: злой дух от Бога
  alternative: губительный дух от Бога; злой Божий дух
  rationale: «От Бога» сохраняет наиболее вероятное указание на источник, не называя Бога злым. «Злой» прямо передаёт основное лексическое значение прилагательного, а сноска сохраняет возможный акцент на причиняемом вреде. Формулировка не снимает богословское напряжение текста.
translation_notes:
  register: Современный литературный русский язык с уважительным придворным обращением. Синтаксис сделан естественным для русского читателя, при этом сохранены обращение к Саулу, древний инструмент и богословски напряжённое указание на происхождение духа.
