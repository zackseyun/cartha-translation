source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁמוּאֵ֗ל אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה וַ/יָּבֹ֖א בֵּ֣ית לָ֑חֶם וַ/יֶּחֶרְד֞וּ זִקְנֵ֤י הָ/עִיר֙ לִ/קְרָאת֔/וֹ וַ/יֹּ֖אמֶר שָׁלֹ֥ם בּוֹאֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/004.yaml
  text: So Samuel did what Yahweh had spoken and came to Bethlehem. The elders of the city trembled at his coming and said[a], “Do you come in peace?”
translation:
  language: ru
  text: 'Самуил сделал то, что сказал Яхве, и пришёл в Вифлеем. Старейшины города, дрожа, вышли ему навстречу и спросили: «С миром ли ты пришёл?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Прямое и естественное соответствие глаголу עשה в повествовательной последовательности; передаёт исполнение сказанного без добавления значения «повелел».
- source_word: אֵת אֲשֶׁר דִּבֶּר יְהוָה
  choice: то, что сказал Яхве
  rationale: Сохраняет обычное значение דִּבֶּר «сказал/говорил» и не усиливает его до «повелел»; по-русски прошедшее время естественно соотносит речь с последующим действием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וַיָּבֹא בֵּית לָחֶם
  choice: пришёл в Вифлеем
  rationale: Естественная русская передача глагола בוא и направления движения; название города дано в принятой русской библейской форме.
- source_word: וַיֶּחֶרְדוּ
  choice: дрожа
  rationale: Сохраняет яркое значение חרד — телесную дрожь, вызванную страхом или сильной тревогой.
- source_word: זִקְנֵי הָעִיר
  choice: старейшины города
  rationale: Точно и естественно обозначает признанных руководителей городской общины.
- source_word: לִקְרָאתוֹ
  choice: вышли ему навстречу
  rationale: Передаёт направленность לִקְרָאתוֹ и в русском естественно описывает встречу прибывшего; глагол «вышли» контекстуально подразумевается, но не меняет события.
- source_word: שָׁלוֹם בּוֹאֶךָ
  choice: С миром ли ты пришёл?
  rationale: Сохраняет краткую именную конструкцию и традиционно понятный русский вопрос о мирном характере прихода.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
- issue: Характер слов Яхве Самуилу
  choice: что сказал Яхве
  alternative: что повелел Яхве
  rationale: Форма דִּבֶּר прямо означает речь; хотя контекст предполагает поручение, перевод не должен превращать подразумеваемое повеление в явное.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным регистром. Оборот «С миром ли ты пришёл?» слегка возвышен, но понятен и близко передаёт лаконизм еврейского вопроса. Неоднозначность связи וַיֶּחֶרְדוּ ... לִקְרָאתוֹ передана конструкцией «дрожа, вышли ему навстречу», которая естественно связывает дрожь с самой встречей.
