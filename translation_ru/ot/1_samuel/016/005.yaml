base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/005.yaml
  text: He said[a], “Peace. I have come to sacrifice to Yahweh. Consecrate yourselves, and come with me to the sacrifice.” And he consecrated Jesse and his sons and invited them to the sacrifice.
translation:
  language: ru
  text: 'Он ответил: «С миром.[a] Я пришёл принести жертву Яхве. Освятитесь и пойдите со мной на жертвоприношение». Затем он освятил Иессея и его сыновей и пригласил их на жертвоприношение.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё благополучно»; «Я пришёл с миром». По-еврейски буквально: «Мир» — заверение в том, что приход Самуила не враждебен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: С миром
  rationale: Краткое именное высказывание отвечает на вопрос старейшин о мирном характере прихода Самуила. Русское «С миром» сохраняет идиоматический смысл и лаконичность еврейского текста.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: принести жертву Яхве
  rationale: Инфинитив указывает на цель прихода. Выражение «принести жертву» естественно в современном русском и точно передаёт культовое действие.
- source_word: הִתְקַדְּשׁוּ
  choice: освятитесь
  rationale: Возвратная форма обозначает ритуальную подготовку и посвящение себя для участия в жертвоприношении; «освятитесь» сохраняет культовый смысл, не сводя его лишь к очищению.
- source_word: וּבָאתֶם אִתִּי בַּזָּבַח
  choice: и пойдите со мной на жертвоприношение
  rationale: В данном контексте форма продолжает приглашение-повеление. «Пойдите со мной» естественнее по-русски при обращении к находящимся рядом людям и передаёт совместное участие.
- source_word: וַיְקַדֵּשׁ
  choice: он освятил
  rationale: Порода piel обозначает, что Самуил ритуально подготовил или посвятил Иессея и его сыновей к священному событию; повтор корня קדשׁ сохранён в переводе.
- source_word: וַיִּקְרָא לָהֶם לַזָּבַח
  choice: пригласил их на жертвоприношение
  rationale: В контексте קרא с предлогом ל выражает приглашение к участию, а не обязательно властный вызов.
- source_word: יִשַׁי
  choice: Иессей
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: בָּנָיו
  choice: его сыновей
  rationale: Еврейский текст прямо обозначает сыновей мужского пола, что существенно для дальнейшего повествования.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон; форма «Яхве» передаёт личное заветное имя и соответствует указанному в консультационном слое решению.
- issue: Значение освящения Иессея и его сыновей
  choice: ритуальная подготовка/посвящение к жертвоприношению
  alternative: нравственное очищение или сообщение внутренней святости
  rationale: Контекст жертвоприношения указывает прежде всего на культовую готовность. Перевод не уточняет способ освящения, поскольку еврейский текст его не называет.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Сохранена краткость ответа Самуила и повтор корня «освят-». «Жертвоприношение» выбрано для обозначения события, к которому присоединяются участники.
