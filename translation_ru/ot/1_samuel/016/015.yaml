  choice: злой дух от Бога
  alternative: вредоносный (или мучительный) дух от Бога
  rationale: 'Еврейский текст связывает духа с Богом, но не уточняет природу этой связи. «От Бога» сохраняет это утверждение, не отождествляя духа с собственным Духом Бога. Значение רָעָה не сужено окончательно до нравственного зла: контекстуальная возможность вреда или мучения вынесена в сноску.'
