    text: 'Или: «мучительный дух от Яхве». Древнееврейское слово может означать как нравственно злое, так и губительное, вредоносное или причиняющее страдание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «играл рукой». В этом стихе инструмент прямо не назван; из ближайшего контекста можно заключить, что Давид играл на струнном инструменте.'
    reason: contextual_clarification
lexical_decisions:
- source_word: וַתְּהִי ... אֶל שָׁאוּל
  choice: напал на Саула
  rationale: Конструкция описывает наступление мучительного состояния; «напал на» естественно передаёт направленность אֶל и враждебный характер воздействия, не сводя выражение к статичному «был у».
- source_word: רוּחַ יְהוָה רָעָה
  choice: злой дух от Яхве
  rationale: רוּחַ передано как «дух», רָעָה — прямым соответствием «злой», а отношение к имени Яхве — предлогом «от», обозначающим источник и не приписывающим зла самому Богу. Возможный смысл «губительный/мучительный» сохранён в сноске.
- source_word: בְּבֵיתוֹ יֹשֵׁב
  choice: когда тот сидел у себя дома
  rationale: 'Причастие יֹשֵׁב задаёт фоновое продолжающееся действие. Местоимение «тот» устраняет возможную неясность русского предложения: в доме сидел Саул.'
- source_word: וַחֲנִיתוֹ בְּיָדוֹ
  choice: с копьём в руке
  rationale: Естественная русская передача безглагольного оборота, описывающего положение Саула.
- source_word: מְנַגֵּן בְּיָד
  choice: играл на лире
  rationale: Причастие от נגן означает игру на музыкальном инструменте. Название инструмента восстановлено из ближайшего контекста для естественности русского текста; буквальное «играл рукой» и отсутствие названия инструмента в данном стихе отмечены в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Связь злого или мучительного духа с Яхве
  choice: злой дух от Яхве
  alternative: мучительный дух от Яхве
  rationale: Формулировка сохраняет прямое и богословски напряжённое свидетельство древнееврейского текста о происхождении духа, не объясняя сверх сказанного характер Божьего участия. Семантическая неоднозначность רָעָה отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранены библейская серьёзность, личное имя Яхве и богословская неоднозначность выражения о духе; неестественное по-русски «играл рукой» вынесено в сноску.
