  text: וַ/יִּשְׁלַח֩ שָׁא֨וּל מַלְאָכִ֜ים אֶל בֵּ֤ית דָּוִד֙ לְ/שָׁמְר֔/וֹ וְ/לַ/הֲמִית֖/וֹ בַּ/בֹּ֑קֶר וַ/תַּגֵּ֣ד לְ/דָוִ֗ד מִיכַ֤ל אִשְׁתּ/וֹ֙ לֵ/אמֹ֔ר אִם אֵ֨ינְ/ךָ֜ מְמַלֵּ֤ט אֶֽת נַפְשְׁ/ךָ֙ הַ/לַּ֔יְלָה מָחָ֖ר אַתָּ֥ה מוּמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/011.yaml
  text: Then Saul sent messengers to David’s house to watch him and to kill him in the morning. And Michal his wife told David[a], saying, “If you do not save your life tonight, tomorrow you will be put to death.”
translation:
  language: ru
  text: 'И послал Саул посланцев к дому Давида, чтобы стеречь его и утром убить. И Мелхола, его жена, предупредила Давида: «Если ты этой ночью не спасёшь свою жизнь[a], завтра тебя убьют».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если этой ночью не спасёшься бегством, завтра тебя убьют».'
    reason: 'Лексическая альтернатива: מְמַלֵּט אֶת־נַפְשְׁךָ буквально означает «избавишь свою жизнь/самого себя» и в контексте может быть передано как «спасёшься бегством».'
lexical_decisions:
- source_word: מַלְאָכִים
  choice: людей
  rationale: В данном повествовании речь идёт о посланных Саулом людях, а не об ангелах; русское «людей» естественно передаёт смысл, хотя менее буквально, чем «посланников».
- source_word: לְשָׁמְרוֹ
  choice: стеречь его
  rationale: Глагол обозначает враждебное наблюдение у дома с целью не дать Давиду уйти; «стеречь» передаёт это лучше, чем защитное по оттенку «охранять».
- source_word: וְלַהֲמִיתוֹ
  choice: убить
  rationale: Порода hифиль от מות выражает причинение смерти; прямое «убить» ясно и естественно в контексте заговора.
- source_word: בַּבֹּקֶר
  choice: утром
  rationale: Обычное и точное обозначение намеченного времени убийства.
- source_word: וַתַּגֵּד
  choice: предупредила
  rationale: Буквально глагол означает «сообщила», но содержание речи является срочным предупреждением; выбранный вариант естественно передаёт функцию высказывания.
- source_word: מִיכַל אִשְׁתּוֹ
  choice: Мелхола, жена Давида
  rationale: Сохраняется пояснительное определение её отношения к Давиду; традиционная русская форма имени — «Мелхола».
- source_word: מְמַלֵּט אֶת־נַפְשְׁךָ
  choice: спасёшь свою жизнь
  rationale: Еврейская идиома буквально говорит об избавлении своей жизни/самого себя; этот вариант понятен, краток и сохраняет смертельную угрозу.
- source_word: הַלַּיְלָה
  choice: этой ночью
  rationale: Передаёт указание на текущую ночь и звучит естественно в современной русской речи.
- source_word: מוּמָת
  choice: тебя убьют
  rationale: Пассивная форма указывает на смерть от рук людей; неопределённо-личная русская конструкция ясно сохраняет это значение.
