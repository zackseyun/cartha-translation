translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Начальное «И» сохраняет последовательность еврейского рассказа; перед предупреждением употреблено естественное контрастное «Но», поскольку действия Мелхолы противостоят замыслу Саула.
