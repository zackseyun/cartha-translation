source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ שָׁ֔ם אֶל נוית בָּ/רָמָ֑ה וַ/תְּהִי֩ עָלָ֨י/ו גַּם ה֜וּא ר֣וּחַ אֱלֹהִ֗ים וַ/יֵּ֤לֶךְ הָלוֹךְ֙ וַ/יִּתְנַבֵּ֔א עַד בֹּא֖/וֹ ב/נוית בָּ/רָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/023.yaml
  text: So he went there[a], to Naioth in Ramah, and the Spirit of God came upon him also; and he went on, prophesying[b], until he came to Naioth in Ramah.
translation:
  language: ru
  text: И он пошёл туда, в Найот, что в Раме[a]. Дух Божий сошёл и на него, и он шёл, пророчествуя[b], пока не пришёл в Найот, что в Раме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Найот при Раме».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ведя себя как пророк». Текст не уточняет, как именно проявлялось это пророчествование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוית בָּרָמָה
  choice: Найот, что в Раме
  rationale: Название места передано транслитерацией с древнееврейского; оборот с ב при «Раме» естественно выражен по-русски как указание на местонахождение.
- source_word: וַתְּהִי עָלָיו גַּם הוּא רוּחַ אֱלֹהִים
  choice: Дух Божий сошёл и на него
  rationale: Конструкция היה על с רוּחַ описывает нисхождение или пребывание Божьего Духа на человеке. «И на него» сохраняет указание, что Саул испытал то же, что и посланные прежде люди.
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: он шёл
  rationale: Сочетание личной формы глагола с абсолютным инфинитивом передаёт продолжающееся движение; простая русская форма в данном контексте сохраняет длительность без тяжеловесного буквализма.
- source_word: וַיִּתְנַבֵּא
  choice: пророчествуя
  rationale: Форма глагола נבא обозначает пророческую речь или поведение под Божьим воздействием, не уточняя его внешнего проявления. «Пророчествуя» сохраняет эту широту.
- source_word: עַד בֹּאוֹ
  choice: пока не пришёл
  rationale: Инфинитивная конструкция естественно передана временным придаточным предложением.
theological_decisions:
- issue: Следует ли понимать רוּחַ אֱלֹהִים как личного Божьего Духа или неопределённый дух от Бога
  choice: Дух Божий
  alternative: дух от Бога
  rationale: В ближайшем повествовательном контексте выражение обозначает Божье воздействие, охватившее прежде посланцев Саула, а затем и самого Саула. Традиционное написание с прописной буквы уместно, но перевод не уточняет природу этого воздействия сверх сказанного в тексте.
- issue: Как описать пророческую деятельность Саула
  choice: пророчествуя
  alternative: ведя себя как пророк
  rationale: Текст не сообщает, в чём именно выражалось пророчествование. Выбранный вариант не сводит его ни к речи, ни к экстатическому поведению.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Повтор названия места сохранён вслед за древнееврейским текстом. Формулировка остаётся торжественной, но понятной обычному читателю.
