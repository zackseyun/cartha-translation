base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/018.yaml
  text: David fled and escaped[a], and he came to Samuel at Ramah and told him all that Saul had done to him. Then he and Samuel went and stayed at Naioth.
translation:
  language: ru
  text: Давид убежал и спасся. Он пришёл к Самуилу в Раму и рассказал ему обо всём, что Саул сделал с ним. Затем Давид и Самуил пошли и поселились в Найоте[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Найот — еврейское название места, вероятно связанное со значением «жилища» или с поселением близ Рамы.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרַח וַיִּמָּלֵט
  choice: бежал и сумел спастись
  rationale: Два глагола передают как бегство от опасности, так и его успешный исход. «Сумел спастись» сохраняет результативность формы וַיִּמָּלֵט, не утверждая прямо о сверхъестественном избавлении.
- source_word: הָרָמָתָה
  choice: в Раму
  rationale: Направительное окончание указывает на движение к Раме; сочетание «пришёл к Самуилу в Раму» естественно передаёт и адресата, и место.
- source_word: וַיַּגֶּד לוֹ
  choice: рассказал ему
  rationale: Обычное повествовательное значение — сообщить или рассказать; современное русское выражение не требует более торжественного «возвестил».
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לוֹ שָׁאוּל
  choice: обо всём, что сделал с ним Саул
  rationale: Передаёт полноту כָּל и сохраняет личную направленность действий Саула против Давида.
- source_word: וַיֵּלֶךְ הוּא וּשְׁמוּאֵל
  choice: затем он вместе с Самуилом пошёл
  rationale: Явное местоимение הוּא и имя Самуила сохранены как совместный субъект; «затем» естественно обозначает последовательность повествования.
- source_word: וַיֵּשְׁבוּ
  choice: они поселились
  rationale: В данном контексте ישב означает пребывание или проживание в месте, а не буквальное сидение. «Поселились» передаёт это значение естественным современным языком.
- source_word: בְנוית
  choice: в Найоте
  rationale: Название места передано транслитерацией; предлог «в» подходит для поселения или группы жилищ.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Повтор двух глаголов бегства сохранён ради смыслового различия между попыткой уйти и успешным спасением. Топоним передан транслитерацией и пояснён в сноске.
