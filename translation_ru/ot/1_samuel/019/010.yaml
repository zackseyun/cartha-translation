base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/010.yaml
  text: Saul sought to pin David to the wall with the spear, but he slipped away from Saul’s presence, and he drove the spear into the wall. Then David fled and escaped that night.
translation:
  language: ru
  text: Саул попытался пригвоздить Давида копьём к стене, но Давид увернулся от Саула, и Саул вонзил копьё в стену. Давид же убежал и спасся в ту ночь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַכּוֹת בַּחֲנִית בְּדָוִד וּבַקִּיר
  choice: пригвоздить Давида копьём к стене
  rationale: Буквальная конструкция допускает смысл «поразить Давида копьём и стену»; в контексте естественно передаётся намерение пронзить Давида и прижать его копьём к стене.
- source_word: וַיִּפְטַר מִפְּנֵי שָׁאוּל
  choice: но тот уклонился от Са́ула
  rationale: Глагол обозначает выскальзывание или уклонение; местоимение «тот» ясно указывает на Давида и не перегружает фразу повтором имени.
- source_word: וַיַּךְ אֶת־הַחֲנִית בַּקִּיר
  choice: и копьё вонзилось в стену
  rationale: Грамматически подлежащее — Саул («он ударил копьём в стену»), но по-русски результативная конструкция естественно и ясно описывает попадание копья в стену, не создавая впечатления намеренного удара по стене.
- source_word: נָס וַיִּמָּלֵט
  choice: убежал и спасся
  rationale: 'Сохранены оба последовательных глагола: бегство и успешное избавление.'
theological_decisions: []
