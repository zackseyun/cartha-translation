base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/024.yaml
  text: He too stripped off his clothes[a], and he too prophesied before Samuel. He lay naked all that day and all that night. Therefore they say[b], “Is Saul also among the prophets?”
translation:
  language: ru
  text: 'Он тоже снял с себя одежду и тоже пророчествовал перед Самуилом. И пролежал он нагим[a] весь тот день и всю ту ночь. Поэтому говорят: «Неужели и Саул среди пророков?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать полную наготу или состояние без верхней одежды; точнее здесь не уточняется.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁט ... בְּגָדָיו
  choice: снял с себя одежды
  rationale: Глагол פשט с בגד обозначает снятие одежды. «Снял с себя одежды» точно передаёт действие и звучит естественно и достойно по-русски.
- source_word: גַּם הוּא
  choice: он тоже / тоже
  rationale: Повтор подчёркивает, что и сам Саул, подобно посланникам до него, оказался охвачен пророческим действием; повтор «тоже» сохранён.
- source_word: וַיִּתְנַבֵּא
  choice: пророчествовал
  rationale: Стандартный и наименее истолковывающий эквивалент сохраняет неопределённость относительно того, шла ли речь о речи, экстатическом поведении или о том и другом.
- source_word: לִפְנֵי שְׁמוּאֵל
  choice: перед Самуилом
  rationale: Кратко и точно передаёт значение присутствия перед Самуилом.
- source_word: וַיִּפֹּל עָרֹם
  choice: пролежал он нагим
  rationale: Хотя נפל буквально значит «упал», последующее указание длительности показывает продолжительное положение; «пролежал» естественно передаёт смысл по-русски. עָרֹם прямо передано словом «нагим» без смягчения.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: весь тот день и всю ту ночь
  rationale: Сохраняет полноту и выразительный параллелизм указания времени.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: поэтому и говорят
  rationale: Вводит общеизвестное, пословичное изречение и естественно звучит в современном русском языке.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִם
  choice: Неужели и Саул среди пророков?
  rationale: Частица הֲגַם передаёт удивление вопросом «неужели и»; «среди пророков» буквально и идиоматично отражает בַּנְּבִיאִם.
theological_decisions:
- issue: Значение наготы Саула (עָרֹם)
  choice: Передать прямо как «нагим», не добавляя нравственного или богословского объяснения.
  alternative: «Раздетым», то есть без верхних одежд.
  rationale: Еврейское слово обычно означает наготу, но контекст не уточняет её степень. Основной текст сохраняет прямой смысл, а примечание — реальную возможность частичной раздетости.
- issue: Характер пророческого действия Саула
  choice: «пророчествовал» без уточнения формы этого действия.
  alternative: «находился в пророческом исступлении» или «вёл себя как пророк».
  rationale: Стих не определяет, было ли это предсказанием, вдохновенной речью, экстатическим поведением или их сочетанием; нейтральный глагол сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «тоже» сохранён ради акцента оригинала; инверсия «пролежал он» поддерживает повествовательный ритм.
