base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/017.yaml
  text: Then Saul said to Michal[a], “Why have you deceived me like this and sent away my enemy, so that he escaped?” And Michal said to Saul, “He said to me, ‘Let me go. Why should I kill you?’”
translation:
  language: ru
  text: 'Тогда Саул сказал Михаль: «Почему ты так обманула меня и отпустила моего врага, так что он спасся?» Михаль ответила Саулу: «Он сказал мне: „Отпусти меня. Зачем мне убивать тебя?“»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с передачей подразумеваемой угрозы: «Отпусти меня, иначе я убью тебя». Буквально в еврейском тексте: «Отпусти меня. Зачем мне убивать тебя?»'
    reason: alternative_reading
lexical_decisions:
- source_word: רִמִּיתִנִי
  choice: обманула меня
  rationale: Глагол רמה обозначает обман; это естественная современная передача обвинения Саула без усиления до «предала».
- source_word: כָּכָה
  choice: так
  rationale: 'Кратко и естественно передаёт указание на образ действия: «таким образом».'
- source_word: וַתְּשַׁלְּחִי
  choice: отпустила
  rationale: В данном контексте Мелхола дала Давиду уйти. «Отпустила» естественно по-русски и сохраняет связь с тем же корнем в последующей цитате.
- source_word: אֹיְבִי
  choice: моего врага
  rationale: Сохраняет прямое и в контексте ироничное обозначение Давида Саулом.
- source_word: וַיִּמָּלֵט
  choice: и он спасся
  rationale: Нифаль глагола מלט означает спастись, ускользнуть. Сочинительная связь сохраняет простую синтаксическую последовательность еврейского текста.
- source_word: שַׁלְּחִנִי
  choice: Отпусти меня
  rationale: Естественная русская передача императива שלח с местоименным суффиксом; повтор «отпустила / отпусти» отражает повтор одного еврейского корня.
- source_word: לָמָה אֲמִיתֵךְ
  choice: Зачем мне убивать тебя?
  rationale: Буквально сохраняет вопросительную форму и первое лицо, не добавляя отсутствующего в тексте союза «иначе».
- source_word: מִיכַל
  choice: Мелхола
  rationale: Использована устоявшаяся русская библейская форма имени, понятная читателю литературного русского языка.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Использована устоявшаяся русская библейская форма имени.
theological_decisions:
- issue: Переданная Мелхолой речь Давида может подразумевать угрозу
  choice: «Отпусти меня. Зачем мне убивать тебя?»
  alternative: «Отпусти меня, иначе я убью тебя»
  rationale: В еврейском тексте стоят повеление и затем вопрос с לָמָה; явного «иначе» нет. Основной текст сохраняет формальную неоднозначность, а вероятный угрожающий смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Прямая речь звучит естественно, при этом необычная форма предполагаемой угрозы сохранена, а не истолкована в основном тексте.
