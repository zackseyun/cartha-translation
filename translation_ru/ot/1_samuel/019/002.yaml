base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/002.yaml
  text: Jonathan told David[a], saying, “Saul my father is seeking to kill you. So now, please be on your guard in the morning, and stay in a secret place and hide yourself.”
translation:
  language: ru
  text: 'Ионафан сообщил Давиду: «Саул, мой отец, стремится убить тебя. Поэтому утром, прошу тебя, будь настороже, оставайся в укромном месте и спрячься».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: сообщил
  rationale: Порода hифиль глагола נגד означает «сообщить, рассказать». «Сообщил» естественно передаёт целенаправленное предупреждение.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейская формула введения прямой речи естественно передана двоеточием; отдельное «сказав» по-русски было бы тяжеловесно.
- source_word: מְבַקֵּשׁ
  choice: хочет
  rationale: Причастие выражает нынешнее намерение Саула. В сочетании с инфинитивом по-русски естественно «хочет убить», без добавления уже начавшейся попытки.
- source_word: לַהֲמִיתֶךָ
  choice: убить тебя
  rationale: Hифиль מות здесь означает причинить смерть; «убить» точно и не привносит оттенка официальной казни.
- source_word: הִשָּׁמֶר נָא
  choice: прошу тебя, будь настороже
  rationale: Возвратный императив передаёт требование беречься, а נָא смягчает просьбу. Эта формулировка сохраняет и срочность, и личную настойчивость.
- source_word: בַבֹּקֶר
  choice: утром
  rationale: Прямое временное значение сохранено без уточнения «завтра», которого в еврейском тексте нет.
- source_word: וְיָשַׁבְתָּ
  choice: оставайся
  rationale: В данном контексте ישב означает не буквальное сидение, а пребывание на месте.
- source_word: בַסֵּתֶר
  choice: в укромном месте
  rationale: סֵתֶר может обозначать тайное, скрытое место. «Укромное место» естественно передаёт локативный смысл в контексте укрытия.
- source_word: וְנַחְבֵּאתָ
  choice: и спрячься
  rationale: Глагол חבא означает скрыться, спрятаться. Формулировка сохраняет возвратный смысл и усиление предыдущего указания.
- source_word: יְהוֹנָתָן ... לְדָוִד ... שָׁאוּל אָבִי
  choice: Ионафан ... Давиду ... мой отец Саул
  rationale: Использованы традиционные русские формы библейских имён. Притяжательное «мой отец» сохранено, а русский порядок слов звучит естественно и удерживает личное напряжение реплики.
