base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/021.yaml
  text: When they told Saul[a], he sent other messengers, and they also prophesied. Then Saul again sent a third group of messengers[b], and they also prophesied.
translation:
  language: ru
  text: Когда Саулу донесли, он послал других вестников, и они тоже пророчествовали. Затем Саул снова послал вестников — в третий раз[a], — и они тоже пророчествовали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «третьих вестников»; то есть Саул послал вестников в третий раз.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: Когда донесли Саулу
  rationale: Форма Hифиль глагола נגד означает «сообщить, донести». В контексте неопределённое «донесли» естественно передаёт еврейскую конструкцию без добавления неуказанного субъекта, а «когда» выражает связь сообщения с последующим действием Саула.
- source_word: מַלְאָכִים אֲחֵרִים
  choice: других вестников
  rationale: מַלְאָכִים здесь обозначает посланных Саулом людей, поэтому «вестники», а не «ангелы»; אֲחֵרִים — согласованное с ним множественное «других».
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: но и они стали пророчествовать
  rationale: Hitpael от נבא обозначает вхождение в пророческое состояние или проявление пророческой деятельности. «Стали пророчествовать» сохраняет широту выражения, а «и они» передаёт усиление גַּם הֵמָּה; «но» естественно выявляет контраст с намерением Саула, не меняя события.
- source_word: וַיֹּסֶף שָׁאוּל וַיִּשְׁלַח
  choice: Тогда Саул снова послал
  rationale: Конструкция с יסף выражает повторение действия; по-русски это естественно передаётся наречием «снова».
- source_word: מַלְאָכִים שְׁלִשִׁים
  choice: вестников — уже в третий раз
  rationale: שְׁלִשִׁים в данном контексте понимается как «третьих» или как указание на третью отправку, а не как числительное «тридцать». Перевод ясно передаёт последовательность попыток, не вводя явно названную в еврейском тексте «группу».
theological_decisions:
- issue: Характер пророческой деятельности посланцев Саула
  choice: стали пророчествовать
  alternative: впали в пророческий экстаз; стали вести себя как пророки
  rationale: Стих сообщает о пророческом проявлении, но не определяет его конкретную форму. Нейтральное библейское выражение сохраняет эту неопределённость и не навязывает психологического или конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «но и они стали пророчествовать» намеренно сохранён как важная повествовательная и смысловая параллель.
