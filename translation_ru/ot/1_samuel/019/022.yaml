base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/022.yaml
  text: He too went to Ramah[a], and he came as far as the great well that is at Seku. He asked and said, “Where are Samuel and David?” And one said, “Look[b], they are at Naioth in Ramah.”
translation:
  language: ru
  text: 'Он тоже пошёл в Раму и дошёл до большого колодца[a], что в Сеху. Он спросил: «Где Самуил и Давид?» Ему ответили[b]: «Вот, они в Найоте, в Раме».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «большого водосборника»; или: «большой ямы».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «И он сказал»; кто именно ответил, в еврейском тексте не уточняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָמָתָה
  choice: в Раму
  rationale: Направительное окончание указывает на движение к Раме; по-русски естественно «пошёл в Раму».
- source_word: בּוֹר הַגָּדוֹל
  choice: большой колодец
  rationale: בּוֹר может обозначать яму, водосборник или колодец. Здесь это известный ориентир; «колодец» естественно в контексте, а иные значения сохранены в сноске.
- source_word: בַּשֶּׂכוּ
  choice: в Сеху
  rationale: Название места передано транслитерацией; предлог выражает местонахождение ориентира.
- source_word: וַיִּשְׁאַל וַיֹּאמֶר
  choice: Он спросил
  rationale: Сочетание букв. «спросил и сказал» вводит прямой вопрос; в современном русском один глагол «спросил» естественно передаёт обе функции без потери содержания.
- source_word: אֵיפֹה
  choice: Где
  rationale: Прямое соответствие вопросительному наречию; составное подлежащее не требует выражения числа в русском сказуемом.
- source_word: הִנֵּה
  choice: не выражено отдельно
  rationale: הִנֵּה вводит указательный ответ. В данном кратком русском ответе отдельное «вот» звучало бы неестественно; дейктическая функция передана непосредственным сообщением местонахождения.
- source_word: בנוית
  choice: в Найоте
  rationale: Топоним передан транслитерацией; форма с «в» естественна для обозначения местонахождения.
- source_word: בָּרָמָה
  choice: в Раме
  rationale: Местное уточнение показывает, что Найот находится в Раме или относится к ней.
- source_word: וַיֹּאמֶר
  choice: Ему ответили
  rationale: Еврейская форма буквально означает «и он сказал», но субъект не назван. Русская неопределённо-личная конструкция сохраняет эту неопределённость и ясно обозначает реплику как ответ.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с умеренно формальным, повествовательным регистром. Имена переданы в привычных русских формах: Рама, Самуил, Давид; менее известные топонимы транслитерированы как Сеху и Найот. Повтор еврейского «сказал» сокращён там, где русская идиоматика требует «спросил» и «ответили».'
