base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/004.yaml
  text: Jonathan spoke well of David to Saul his father[a], and said to him, “Let not the king sin against his servant David, because he has not sinned against you[b], and because his deeds have been very good for you.”
translation:
  language: ru
  text: 'Ионафан хорошо отзывался о Давиде в разговоре со своим отцом Саулом[a] и сказал ему: «Пусть царь не грешит против своего слуги, против Давида[b], потому что он не согрешил против тебя и потому что его дела очень полезны тебе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорил доброе о Давиде». Буквально еврейский оборот означает «говорил доброе о Давиде».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте объект повторён для усиления: «против своего слуги, против Давида».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... בְּדָוִד טוֹב
  choice: говорил ... доброе о Давиде
  rationale: Передаёт еврейский оборот со значением благожелательно говорить о ком-либо, сохраняя как положительную оценку, так и обращённость речи к Саулу.
- source_word: אֶל שָׁאוּל אָבִיו
  choice: своему отцу Саулу
  rationale: Естественный русский порядок слов ясно обозначает родство Ионафана и Саула, не создавая двусмысленности.
- source_word: אַל יֶחֱטָא הַמֶּלֶךְ
  choice: Пусть царь не грешит
  rationale: Конструкция с «пусть» передаёт запретительный юссив и уважительное обращение к царю в третьем лице.
- source_word: בְּעַבְדּוֹ בְדָוִד
  choice: против своего слуги, против Давида
  rationale: Повтор предлога сохранён, чтобы отразить эмфатическую аппозицию оригинала, где Давид уточняет, кто именно назван слугой.
- source_word: כִּי לֹא חָטָא לָךְ
  choice: потому что он не согрешил против тебя
  rationale: 'Сохранён корень «грешить» и тем самым риторический контраст: Саул не должен грешить против Давида, поскольку Давид не согрешил против Саула.'
- source_word: וְכִי מַעֲשָׂיו טוֹב לְךָ מְאֹד
  choice: и потому что его дела были весьма полезны тебе
  rationale: Повтор «потому что» ясно представляет второй довод Ионафана; «весьма полезны» естественно передаёт смысл добра, принесённого действиями Давида Саулу.
theological_decisions:
- issue: Нравственное значение חטא в обоих предложениях
  choice: В обоих случаях переведено одним корнем «грешить/согрешить»
  alternative: «Поступить несправедливо» или «причинить зло»
  rationale: Повтор одного корня в оригинале создаёт важный нравственный и риторический контраст, который не следует ослаблять разными русскими словами.
translation_notes:
  register: Современный литературный русский с умеренно торжественным придворным оттенком. Уважительное именование Саула «царь» в третьем лице и повтор «против своего слуги, против Давида» сохранены; синтаксис при этом остаётся понятным обычному читателю.
