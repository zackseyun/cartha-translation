  to: 'Ионафан хорошо отзывался о Давиде в разговоре со своим отцом Саулом[a] и сказал ему: «Пусть царь не грешит против своего слуги, против Давида[b], потому что он не согрешил против тебя и потому что его дела очень полезны тебе».'
  rationale: Заменено тяжеловесное «говорил ... доброе» на естественное русское «хорошо отзывался», при этом сноска сохраняет буквальный оборот. Добавление «в разговоре с» естественно выражает адресата речи без ложного оттенка публичного выступления. Настоящее «полезны» не ограничивает смысл прошедшим временем, которого в исходной безглагольной конструкции нет. Повтор «против» и богословски значимый повтор корня «грешить» сохранены.
