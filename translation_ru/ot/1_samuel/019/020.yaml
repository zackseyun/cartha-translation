source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח שָׁא֣וּל מַלְאָכִים֮ לָ/קַ֣חַת אֶת דָּוִד֒ וַ/יַּ֗רְא אֶֽת לַהֲקַ֤ת הַ/נְּבִיאִים֙ נִבְּאִ֔ים וּ/שְׁמוּאֵ֕ל עֹמֵ֥ד נִצָּ֖ב עֲלֵי/הֶ֑ם וַ/תְּהִ֞י עַֽל מַלְאֲכֵ֤י שָׁאוּל֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/020.yaml
  text: Then Saul sent messengers to seize David[a]. When they saw the company of prophets prophesying, with Samuel standing over them, the Spirit of God came upon Saul’s messengers[b], and they also prophesied.
translation:
  language: ru
  text: Тогда Саул послал людей схватить Давида. Увидев группу пророков[a], которые пророчествовали, и Самуила, стоявшего над ними[b], посланцы Саула увидели, что на них сошёл Дух Божий, и тоже стали пророчествовать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собрание пророков»; еврейское слово обозначает собравшуюся вместе группу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «среди них»; выражение может также указывать, что Самуил занимал руководящее или надзирающее положение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים / מַלְאֲכֵי
  choice: послал людей / посланцы
  rationale: В данном повествовании речь идёт о людях, которых Саул отправил исполнить его приказ, а не об ангелах. В первом упоминании естественное русское «послал людей» избегает тяжеловесного повтора, а далее «посланцы» ясно обозначает ту же группу.
- source_word: לָקַחַת
  choice: схватить
  rationale: Хотя основное значение глагола — «взять», здесь люди Саула должны силой захватить Давида; «схватить» естественно передаёт враждебное намерение.
- source_word: לַהֲקַת הַנְּבִיאִים
  choice: группу пророков
  rationale: Редкое существительное обозначает собравшуюся группу. «Группа» понятно современному читателю и не привносит оттенков военного отряда или формально учреждённого собрания.
- source_word: נִבְּאִים / וַיִּתְנַבְּאוּ
  choice: пророчествовали / стали пророчествовать
  rationale: Повтор однокоренного глагола сохраняет связь между деятельностью пророков и тем, что затем произошло с посланцами; «стали» передаёт начало вызванного Духом действия.
- source_word: עֹמֵד נִצָּב עֲלֵיהֶם
  choice: стоявшего над ними
  rationale: Перевод сохраняет пространственный образ и возможный оттенок руководящего или надзирающего положения Самуила, не сводя выражение однозначно только к лидерству.
- source_word: רוּחַ אֱלֹהִים
  choice: Дух Божий
  rationale: В контексте выражение обозначает исходящее от Бога духовное воздействие, вызывающее пророчество. Традиционное и естественное русское сочетание сохраняет личностно-богословскую силу текста без избыточного уточнения.
- source_word: וַתְּהִי עַל
  choice: ощутили на себе
  rationale: Еврейский оборот буквально сообщает, что Дух Божий оказался «на» посланцах. Русская формулировка передаёт наступившее воздействие и сохраняет образ направленного на них действия, оставаясь естественной.
- source_word: גַּם הֵמָּה
  choice: тоже
  rationale: 'Слово подчёркивает неожиданный факт: посланцы Саула присоединились к пророческой деятельности.'
theological_decisions:
- issue: Характер רוּחַ אֱלֹהִים в повествовании
  choice: «Дух Божий» как действующая божественная сила, охватившая посланцев
  alternative: «дух от Бога» как менее личностное обозначение воздействия
  rationale: В книгах Самуила это сочетание обычно обозначает Божий Дух, могущественно действующий в истории. Перевод сохраняет божественную инициативу, не внося в стих более поздних догматических уточнений.
- issue: Характер пророчества посланцев Саула
  choice: Передать только факт, что они стали пророчествовать
  alternative: Уточнить содержание или духовную ценность их пророчества
  rationale: Текст сообщает вызванное Духом пророческое действие, но не раскрывает его содержания и не утверждает, что посланцы сделались постоянными пророками; перевод не разрешает эту напряжённость за автора.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Синтаксис упрощён ради ясности, но последовательность событий и повтор глагола «пророчествовать» сохранены. Все сноски поставлены непосредственно после относящихся к ним выражений.
