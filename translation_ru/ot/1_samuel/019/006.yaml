  text: וַ/יִּשְׁמַ֥ע שָׁא֖וּל בְּ/ק֣וֹל יְהוֹנָתָ֑ן וַ/יִּשָּׁבַ֣ע שָׁא֔וּל חַי יְהוָ֖ה אִם יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/006.yaml
  text: Saul listened to Jonathan’s voice[a], and Saul swore, “As Yahweh lives, he shall not be put to death.”
translation:
  language: ru
  text: 'Саул послушал Ионафана и поклялся: «Жив Яхве, Давид не будет предан смерти»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Жив Яхве, если он будет предан смерти…» В этой клятвенной формуле условная частица «если» вводит подразумеваемое самопроклятие и выражает решительное отрицание: «он ни в коем случае не будет предан смерти».'
    reason: Сохраняет особенность древнееврейской эллиптической формулы клятвы, не делая основной текст неясным.
lexical_decisions:
- source_word: וַיִּשְׁמַע ... בְּקוֹל יְהוֹנָתָן
  choice: Саул послушал Ионафана
  rationale: Оборот שׁמע בקול означает не просто услышать голос, а прислушаться и внять сказанному. Русское «послушал Ионафана» естественно передаёт ответную реакцию Саула.
- source_word: וַיִּשָּׁבַע
  choice: поклялся
  rationale: Глагол обозначает принесение клятвы; «поклялся» кратко и естественно вводит её содержание.
- source_word: חַי יְהוָה
  choice: Жив Яхве
  rationale: Сохранена торжественная древнееврейская формула клятвы и личное имя Бога, выраженное тетраграмматоном.
- source_word: אִם יוּמָת
  choice: Давид не будет предан смерти
  rationale: В формуле клятвы אִם вводит эллиптическое проклятие и выражает решительное отрицание; форма יוּמָת — хофаль, то есть «будет умерщвлён / предан смерти». Имя Давида естественно проясняет подразумеваемого участника из контекста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация «Яхве» сохраняет это различие, не заменяя имя титулом.
- issue: Эллиптическая клятвенная формула אִם יוּמָת
  choice: 'решительное отрицание: «не будет предан смерти»'
  alternative: буквальное «если будет предан смерти»
  rationale: В древнееврейской клятве условие подразумевает опущенное самопроклятие и потому по смыслу означает твёрдое заверение, что названное действие не произойдёт. Сноска сохраняет сведения о буквальной форме.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной интонацией прямой речи. Выражение «предан смерти» сохраняет каузативно-пассивный смысл еврейской формы; «Жив Яхве» передаёт краткость и solemnность формулы клятвы.
