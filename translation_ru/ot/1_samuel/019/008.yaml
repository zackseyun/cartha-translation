base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/008.yaml
  text: And the war broke out again[a], and David went out and fought against the Philistines and struck them with a great blow, so that they fled before him.
translation:
  language: ru
  text: И снова началась война.[a] Давид выступил, сразился с филистимлянами и нанёс им тяжёлое поражение, так что они бежали от него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Война продолжалась»; «И снова была война». Еврейское выражение буквально означает: «война прибавила быть» и может указывать как на возобновление, так и на продолжение военных действий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף הַמִּלְחָמָה לִהְיוֹת
  choice: И снова началась война
  rationale: Еврейская конструкция יסף + инфинитив היה указывает на повторение или возобновление события. Такой перевод естественно передаёт возобновление военных действий, а примечание сохраняет возможность понимать выражение как их продолжение.
- source_word: וַיֵּצֵא דָוִד
  choice: Давид выступил
  rationale: Глагол יצא буквально означает «вышел», но в военном контексте русское «выступил» естественно передаёт выход в поход или на сражение, не добавляя прямо названной воины или цели.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: сразился с филистимлянами
  rationale: Форма глагола לחם с предлогом ב обозначает враждебное боевое столкновение. «Сразился с» ясно и естественно выражает этот смысл по-русски.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: нанёс им тяжёлое поражение
  rationale: Сочетание נכה с מכה означает нанесение сильного удара или крупного поражения. Русское «нанёс им тяжёлое поражение» передаёт военный смысл, не утверждая прямо массового истребления.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: они бежали от него
  rationale: Оборот מפניו буквально связан с удалением «от его лица/присутствия» и здесь означает бегство от наступающего Давида. Современное русское выражение «бежали от него» передаёт смысл ясно и без архаизации.
