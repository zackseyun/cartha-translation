base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/003.yaml
  text: I will go out and stand beside my father in the field where you are[a], and I will speak to my father about you. Then I will see what happens and tell you.
translation:
  language: ru
  text: Я выйду и стану рядом с отцом в поле, где ты находишься. Я поговорю с отцом о тебе, посмотрю, что произойдёт[a], и расскажу тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «увижу что»; это неполное выражение может означать: «посмотрю, что произойдёт» или «выясню, как обстоят дела».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: Я выйду
  rationale: Форма Qal, 1-е лицо единственного числа, выражает намерение Ионафана; «выйду» естественно и сохраняет направительное значение.
- source_word: וְעָמַדְתִּי לְיַד אָבִי
  choice: и встану рядом с отцом
  rationale: Оборот לְיַד означает «рядом, возле»; перевод передаёт последовательность намеченных действий и звучит естественно по-русски.
- source_word: בַּשָּׂדֶה אֲשֶׁר אַתָּה שָׁם
  choice: на поле, где ты будешь
  rationale: Относительное придаточное указывает место, где должен находиться Давид. Будущее время естественно следует из контекста договорённости, хотя древнееврейская конструкция буквально допускает «где ты там».
- source_word: אֲדַבֵּר בְּךָ אֶל אָבִי
  choice: Я поговорю с отцом о тебе
  rationale: Конструкция דבר ב с обозначением лица здесь означает говорить о ком-либо; русский порядок слов ясно передаёт адресата и тему разговора.
- source_word: וְרָאִיתִי מָה
  choice: посмотрю, что произойдёт
  rationale: Древнееврейское выражение эллиптично — буквально «увижу что»; дополнение «произойдёт» естественно передаёт подразумеваемый исход или развитие ситуации.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: и расскажу тебе
  rationale: Hiphil глагола נגד означает сообщить или дать знать; «расскажу тебе» уместно в личной речи и не создаёт излишне официального оттенка.
