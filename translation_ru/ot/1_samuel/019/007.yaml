  yaml_path: translation/ot/1_samuel/019/007.yaml
  text: So Jonathan called David and told him all these things. Then Jonathan brought David to Saul[a], and he was in his presence as before.
translation:
  language: ru
  text: Ионафан позвал Давида и рассказал ему обо всём этом. Затем Ионафан привёл Давида к Саулу, и Давид был при нём, как прежде.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как вчера и третьего дня» — древнееврейское выражение со значением «как прежде», «как раньше».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לְדָוִד
  choice: позвал Давида
  rationale: Конструкция קרא с לְ перед лицом означает позвать или призвать кого-либо. «Позвал» естественно для повествования и не придаёт действию излишне официального характера.
- source_word: וַיַּגֶּד לוֹ ... אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: рассказал ему обо всём этом
  rationale: Глагол נגד в породе hифиль означает сообщить, рассказать; דְּבָרִים может обозначать слова, дела или обстоятельства. Формулировка естественно передаёт весь сообщённый Ионафаном разговор и сохраняет широту выражения.
- source_word: וַיָּבֵא ... אֶל
  choice: привёл ... к
  rationale: Каузативная форма בוא означает привести или доставить. Для человека в данном контексте русское «привёл» звучит естественнее, не уточняя способ сопровождения.
- source_word: וַיְהִי לְפָנָיו
  choice: Давид снова находился при нём
  rationale: Буквально выражение означает «был перед ним» и может указывать как на присутствие, так и на службу при царе. «Находился при нём» сохраняет придворно-служебный оттенок, не сводя смысл исключительно к исполнению обязанностей. Имя «Давид» устраняет возможную для русского читателя неясность местоимения.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: как прежде
  rationale: Это древнееврейское временное выражение, буквально отсылающее ко «вчера и третьему дню», идиоматически означает прежнее положение или обычный порядок.
