    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: посланцы
  rationale: В данном повествовании это люди, посланные Саулом схватить Давида; «посланцы» естественно передаёт человеческих представителей и не вызывает ассоциации с ангелами.
- source_word: וְהִנֵּה
  choice: то увидели
  rationale: В контексте внезапного обнаружения такая конструкция естественно передаёт указательно-эмфатическую силу הִנֵּה, не прибегая к архаичному «вот».
- source_word: הַתְּרָפִים
  choice: терафим
  rationale: Транслитерация сохраняет культурно специфическое название культового домашнего изображения и не уточняет сверх текста его размер или точное назначение.
- source_word: אֶל הַמִּטָּה
  choice: в постели
  rationale: Хотя אֶל обычно выражает направление, здесь контекст обнаружения подставной фигуры требует естественного русского обозначения местонахождения.
- source_word: וּכְבִיר
  choice: покрывало
  rationale: Редкое слово обозначает, вероятно, тканое или плетёное покрытие; «покрывало» передаёт вероятную функцию, а неопределённость отмечена в сноске.
- source_word: הָעִזִּים
  choice: из козьей шерсти
  rationale: По контексту речь, вероятнее всего, идёт о материале предмета, а не просто о его связи с козами.
- source_word: מְרַאֲשֹׁתָיו
  choice: у него в изголовье
  rationale: Передаёт место у головы лежащего терафима и сохраняет мужской род русского заимствованного названия, не создавая впечатления, будто в постели действительно находился человек.
theological_decisions:
- issue: Передача תְּרָפִים — культового предмета, связанного с домашней религиозной практикой
  choice: терафим
  alternative: домашний идол; идол
  rationale: Сам стих называет предмет, но не даёт ему прямой оценки. Транслитерация сохраняет историко-культурную конкретность и не вносит в основной текст более определённого толкования, чем допускает оригинал.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Конструкция «то увидели» естественно передаёт внезапность открытия; специальные реалии и лексическая неопределённость сохранены и пояснены в сносках.
