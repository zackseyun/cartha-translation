translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. «Домашний идол» раскрывает незнакомый термин без конфессиональной конкретизации; «у изголовья» сохраняет референциальную неоднозначность оригинала. Маркеры сносок поставлены непосредственно после соответствующих выражений.
