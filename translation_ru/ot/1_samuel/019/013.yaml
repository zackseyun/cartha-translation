base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/013.yaml
  text: Then Michal took the household idol and laid it on the bed[b][a], and she put a cushion of goats’ hair at its head and covered it with the garment.
translation:
  language: ru
  text: Мелхола взяла домашнего идола[a], положила его на постель, у изголовья поместила предмет из козьей шерсти[b] и накрыла идола одеждой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «терафима», «домашнего божка» или «изваяние». Еврейское слово обозначает домашние культовые предметы; здесь такой предмет, по-видимому, изображает лежащего человека.'
    reason: lexical_alternative
  - marker: b
    text: Точное значение еврейского выражения неизвестно. Возможно, имеется в виду плетёное покрытие, сетка, подушка или другой подобный предмет из козьей шерсти, помещённый у изголовья.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: домашнего идола
  rationale: Слово обозначает домашний культовый предмет или изображение. Хотя еврейская форма морфологически множественная, в этой сцене предмет изображает одного лежащего человека, поэтому по-русски естественно единственное число.
- source_word: אֶל הַמִּטָּה
  choice: на постель
  rationale: В сочетании с глаголом שׂים и по контексту инсценировки выражение означает, что предмет положили на постель.
- source_word: כְּבִיר הָעִזִּים
  choice: козью шерсть
  rationale: Точное значение редкого כְּבִיר неясно; речь, вероятно, о предмете из козьей шерсти — плетёном покрытии, сетке, подушке или похожей вещи. Основной текст не уточняет форму предмета сверх того, что надёжно следует из выражения.
- source_word: מְרַאֲשֹׁתָיו
  choice: у изголовья
  rationale: Передаёт место в головах постели и позволяет не навязывать неоднозначную принадлежность местоимения — голове идола или изображаемого Давида.
- source_word: בַּבָּגֶד
  choice: одеждой
  rationale: בֶּגֶד — общее слово для одежды; определённость еврейской формы в русском контексте не требует обязательного указательного уточнения.
- source_word: וַתְּכַס
  choice: накрыла
  rationale: Конкретно и естественно передаёт действие глагола כסה в контексте постели.
