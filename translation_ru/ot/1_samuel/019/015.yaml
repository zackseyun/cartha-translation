  yaml_path: translation/ot/1_samuel/019/015.yaml
  text: Then Saul sent the messengers to see David[a], saying, “Bring him up to me in the bed, so that I may put him to death.”
translation:
  language: ru
  text: 'Тогда Саул послал посланцев увидеть Давида и приказал: «Принесите его ко мне на постели[a], чтобы я умертвил его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в постели»; возможно также: «вместе с постелью». Еврейский предлог допускает разные понимания; по смыслу Саул, вероятно, велел принести Давида таким, как он лежал.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Тогда Саул послал
  rationale: Форма с последовательным וַ продвигает повествование; «тогда» естественно передаёт очередность событий.
- source_word: הַמַּלְאָכִים
  choice: своих людей
  rationale: Здесь מַלְאָךְ обозначает посланных Саулом людей, а не сверхъестественных ангелов. В данном контексте «своих людей» звучит естественнее, чем формальное «посланцев».
- source_word: לִרְאוֹת אֶת דָּוִד
  choice: посмотреть на Давида
  rationale: Сохраняется основной смысл ראה — «видеть, посмотреть», без уточнения, должны ли они были проверить его присутствие или состояние.
- source_word: לֵאמֹר
  choice: и приказал
  rationale: Буквально конструкция вводит прямую речь словом «говоря», но содержание речи является распоряжением; «и приказал» естественно связывает повествование с повелением.
- source_word: הַעֲלוּ אֹתוֹ
  choice: Принесите его
  rationale: Каузатив от עלה буквально означает «поднимите, доставьте наверх». Русское «принесите» естественно передаёт требование доставить лежащего человека; направление к Саулу выражено словами «ко мне».
- source_word: בַמִּטָּה
  choice: на постели[a]
  rationale: Предлог ב допускает понимание «на постели», «в постели» или инструментально-сопроводительное «вместе с постелью». Основной текст передаёт образ Давида, которого должны принести лежащим на постели, а неоднозначность отмечена в сноске.
- source_word: אֵלַי
  choice: ко мне
  rationale: Прямо передаёт направление движения и желание Саула, чтобы Давида доставили к нему.
- source_word: לַהֲמִתוֹ
  choice: чтобы я умертвил его
  rationale: Инфинитив с ל выражает цель. «Умертвил» сохраняет тяжёлый и несколько официальный тон царского приказа, не смягчая намерение Саула.
