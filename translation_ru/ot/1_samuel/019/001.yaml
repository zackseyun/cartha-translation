  text: Saul spoke to Jonathan his son and to all his servants to put David to death[b][a], but Jonathan son of Saul delighted greatly in David.
translation:
  language: ru
  text: Саул сказал своему сыну Ионафану и всем своим слугам убить Давида[a]. Но Ионафан, сын Саула, очень благоволил Давиду[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предать Давида смерти». Еврейский глагол стоит в каузативной форме и может означать «умертвить», «предать смерти».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «был очень расположен к Давиду»; «находил в Давиде большую радость». Еврейское выражение передаёт сильное благоволение или удовольствие, испытываемое к Давиду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: В повествовательном контексте דבר естественно передаётся глаголом «сказал»; последующий оборот раскрывает содержание сказанного.
- source_word: עֲבָדָיו
  choice: всем своим слугам
  rationale: «Слуги» прозрачно передаёт עֲבָדִים, хотя в царском окружении речь может идти также о придворных или должностных лицах.
- source_word: לְהָמִית אֶת דָּוִד
  choice: чтобы они предали Давида смерти
  rationale: Инфинитив с לְ выражает намерение или содержание речи Саула, а каузативная форма המית буквально указывает на предание смерти. Множественное «они» естественно связывает действие с Ионафаном и слугами, не утверждая, что Саул намеревался лично убить Давида.
- source_word: וִיהוֹנָתָן
  choice: Но Ионафан
  rationale: Союз вводит смысловое противопоставление между намерением Саула и отношением Ионафана к Давиду.
- source_word: חָפֵץ בְּדָוִד מְאֹד
  choice: был очень расположен к Давиду
  rationale: Оборот передаёт сильную благосклонность и привязанность, не отождествляя חפץ без необходимости с более прямым глаголом «любить».
- source_word: בְּנוֹ / בֶּן שָׁאוּל
  choice: своему сыну / сын Саула
  rationale: Оба указания на родство сохранены вслед за еврейским текстом.
