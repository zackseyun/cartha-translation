  text: Then Saul sent messengers to seize David[a], and she said, “He is sick.”
translation:
  language: ru
  text: 'И Саул послал посланцев схватить Давида, и она[a] сказала: «Он болен».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте имя говорящей не названо: буквально — «и она сказала». Из контекста понятно, что это Мелхола.'
    reason: Уточняет подразумеваемый субъект женского рода, сохраняя особенность исходного текста.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал
  rationale: Вав с последовательной глагольной формой продолжает повествование; обычное русское «и» точно передаёт связь событий.
- source_word: מַלְאָכִים
  choice: людей
  rationale: Здесь речь о посланных Саулом людях, а не о небесных существах; в данном контексте естественнее по-русски назвать их людьми.
- source_word: לָקַחַת
  choice: схватить
  rationale: Хотя глагол имеет широкое значение «взять», контекст указывает на насильственное задержание Давида.
- source_word: וַתֹּאמֶר
  choice: но она сказала
  rationale: Форма глагола женского рода указывает на женщину, из контекста — на Мелхолу. Союз «но» естественно выражает фактическое противодействие намерению посланных, не меняя содержания ответа.
- source_word: חֹלֶה הוּא
  choice: Он болен
  rationale: Краткая именная конструкция прямо сообщает о болезни; «болен» соответствует современному литературному русскому языку.
