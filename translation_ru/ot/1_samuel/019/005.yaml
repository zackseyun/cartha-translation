  text: וַ/יָּשֶׂם֩ אֶת נַפְשׁ֨/וֹ בְ/כַפּ֜/וֹ וַ/יַּ֣ךְ אֶת הַ/פְּלִשְׁתִּ֗י וַ/יַּ֨עַשׂ יְהוָ֜ה תְּשׁוּעָ֤ה גְדוֹלָה֙ לְ/כָל יִשְׂרָאֵ֔ל רָאִ֖יתָ וַ/תִּשְׂמָ֑ח וְ/לָ֤/מָּה תֶֽחֱטָא֙ בְּ/דָ֣ם נָקִ֔י לְ/הָמִ֥ית אֶת דָּוִ֖ד חִנָּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/005.yaml
  text: For he put his life in his hand and struck down the Philistine[a], and Yahweh brought about a great salvation for all Israel. You saw it and rejoiced[c][b]. So why should you sin against innocent blood by putting David to death for no reason?
translation:
  language: ru
  text: Ведь он рисковал жизнью[a] и сразил филистимлянина, а Яхве даровал великое избавление[b] всему Израилю. Ты это видел и радовался. Зачем же тебе грешить, проливая невинную кровь и убивая Давида без причины[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «положил свою жизнь на свою ладонь»; то есть подверг её смертельной опасности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «великое спасение»; в данном военном контексте также возможно: «великую победу».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ни за что», «без вины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֶת־נַפְשׁוֹ בְכַפּוֹ
  choice: рисковал жизнью
  rationale: Еврейская идиома буквально означает «положил свою жизнь на ладонь» и выражает смертельный риск. В основном тексте передан её естественный русский смысл, а буквальный образ сохранён в примечании.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי
  choice: сразил филистимлянина
  rationale: Глагол נכה здесь обозначает поражение Голиафа, закончившееся его смертью. «Сразил» сохраняет живость повествования и не сводит действие к нейтральному «убил».
- source_word: וַיַּעַשׂ יְהוָה
  choice: Яхве даровал
  rationale: Сочетание עשה с отвлечённым дополнением указывает на совершённое Богом спасительное действие. «Даровал» естественно передаёт божественную инициативу, не устраняя её.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: великое избавление
  rationale: В военном контексте תְּשׁוּעָה означает избавление или победоносное спасение. «Избавление» естественно по-русски и сохраняет более широкий смысл, чем одна лишь военная победа.
- source_word: לְכָל־יִשְׂרָאֵל
  choice: всему Израилю
  rationale: Предлог ל указывает на пользу для всего народа; дательный падеж передаёт это кратко и естественно.
- source_word: רָאִיתָ וַתִּשְׂמָח
  choice: Ты сам это видел и радовался
  rationale: «Это» восполняет подразумеваемый объект, а «сам» естественно подчёркивает личное свидетельство Саула, выраженное обращением во втором лице.
- source_word: וְלָמָּה תֶחֱטָא
  choice: Зачем же тебе грешить
  rationale: Риторический вопрос увещевает Саула не совершать предполагаемого поступка. Русская конструкция передаёт направленность в будущее без излишне категоричного предсказания.
- source_word: בְּדָם נָקִי
  choice: проливая невинную кровь
  rationale: Еврейское выражение обозначает кровную вину за гибель невиновного. Деепричастный оборот ясно связывает грех с убийством Давида и звучит естественно по-русски.
- source_word: לְהָמִית אֶת־דָּוִד חִנָּם
  choice: убивать Давида без причины
  rationale: Инфинитив поясняет, в чём состоял бы грех, а חִנָּם подчёркивает отсутствие законного основания или вины Давида.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо употреблено личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Смысл תְּשׁוּעָה в военном контексте
  choice: великое избавление
  alternative: великая победа; великое спасение
  rationale: Непосредственный контекст допускает значение победы, однако слово обозначает также спасительное избавление, совершённое Богом. Выбранный вариант сохраняет оба смысловых измерения.
- issue: Правовая и нравственная сила בְּדָם נָקִי
  choice: грешить, проливая невинную кровь
  alternative: согрешить против невинной крови; навлечь на себя вину за невинную кровь
  rationale: Формулировка сохраняет прямое упоминание греха и невинной крови, но избегает неестественного для современного русского оборота «грешить против крови».
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Идиоматические обороты переданы понятно для широкого читателя; буквальная еврейская образность и существенные лексические варианты вынесены в примечания. Частица «же» сохраняет увещевательную связь с предыдущим доводом, а тире делает пояснительный инфинитив естественным по-русски.
