base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/007.yaml
  text: Yahweh makes poor and makes rich[b][a]; he brings low and also lifts up.
translation:
  language: ru
  text: Яхве делает бедным[a] и обогащает, унижает и возвышает[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обедняет»; еврейский глагол может также выражать лишение имущества или владения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поднимает», «возносит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и отличает имя Бога от титула «Господь».
- source_word: מוֹרִישׁ
  choice: разоряет
  rationale: В противопоставлении глаголу «обогащает» каузативная форма выражает доведение до бедности. «Разоряет» естественно по-русски и при этом допускает более широкий оттенок лишения имущества.
- source_word: וּמַעֲשִׁיר
  choice: и обогащает
  rationale: Каузатив от עשׁר означает «делает богатым»; глагол «обогащает» краток и сохраняет поэтическое противопоставление.
- source_word: מַשְׁפִּיל
  choice: унижает
  rationale: Глагол означает «делает низким, низводит». «Унижает» передаёт изменение положения, а пара с «возвышает» сохраняет вертикальную образность.
- source_word: אַף
  choice: и
  rationale: Частица имеет добавочно-усилительное значение. В краткой русской поэтической строке союз «и» естественно передаёт присоединение, не перегружая фразу.
- source_word: מְרוֹמֵם
  choice: возвышает
  rationale: Форма от רום означает «поднимает, делает высоким». «Возвышает» сохраняет как образ высоты, так и возможный смысл повышения положения.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Характер действий Бога в поэтических противопоставлениях
  choice: 'Сохранены прямые каузативные формулировки: «разоряет и обогащает, унижает и возвышает»'
  alternative: 'Смягчить причинность: «допускает бедность…»'
  rationale: Исходные причастные формы прямо приписывают Яхве эти действия; перевод не должен устранять богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим параллелизмом. Сохранены две антитетические пары и прямая причинность еврейского текста.
