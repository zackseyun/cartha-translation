  variant: modern literary Russian
source:
  edition: WLC
  text: אִם יֶחֱטָ֨א אִ֤ישׁ לְ/אִישׁ֙ וּ/פִֽלְל֣/וֹ אֱלֹהִ֔ים וְ/אִ֤ם לַֽ/יהוָה֙ יֶֽחֱטָא אִ֔ישׁ מִ֖י יִתְפַּלֶּל ל֑/וֹ וְ/לֹ֤א יִשְׁמְעוּ֙ לְ/ק֣וֹל אֲבִי/הֶ֔ם כִּֽי חָפֵ֥ץ יְהוָ֖ה לַ/הֲמִיתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/025.yaml
  text: If a man sins against another man[a], God will mediate for him; but if a man sins against Yahweh, who will pray for him? But they would not listen to the voice of their father[b], because Yahweh desired to put them to death.
translation:
  language: ru
  text: Если человек согрешит против другого человека, Бог[a] рассудит его дело; но если человек согрешит против Яхве, кто станет молиться[b] за него? Однако они не слушали голоса своего отца, потому что Яхве желал предать их смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Если человек согрешит против другого человека, судьи рассудят его дело». Еврейское אֱלֹהִים иногда обозначает человеческих судей; здесь перевод «Бог» лучше соответствует противопоставлению с Яхве.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «кто станет ходатайствовать за него?» Еврейский глагол может обозначать молитву или ходатайство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: согрешит
  rationale: Передаёт обычное нравственно-богословское значение глагола חטא, не ослабляя его до общего «поступит неправильно».
- source_word: אִישׁ לְאִישׁ
  choice: человек ... против другого человека
  rationale: Естественно выражает межличностное противопоставление; слово «человек» в современном русском здесь уместнее буквального «мужчина».
- source_word: וּפִלְלוֹ אֱלֹהִים
  choice: Бог рассудит его дело
  rationale: Сохраняет судебно-посреднический оттенок piel от פלל и избегает неестественного «будет посредничать за него»; добавление «дело» делает русскую фразу ясной, не превращая Бога лишь в обвиняющего судью.
- source_word: לַיהוָה
  choice: против Яхве
  rationale: Предлог обозначает того, против кого направлен грех; личное имя יהוה передано транслитерацией «Яхве».
- source_word: מִי יִתְפַּלֶּל לוֹ
  choice: кто станет молиться за него?
  rationale: Hitpael глагола פלל может обозначать молитву или ходатайство; «молиться за него» естественно по-русски и сохраняет риторический вопрос.
- source_word: וְלֹא יִשְׁמְעוּ לְקוֹל אֲבִיהֶם
  choice: Однако они не слушали голоса своего отца
  rationale: Сохраняет еврейский образ «слушать голос» и одновременно передаёт упорное непослушание.
- source_word: כִּי חָפֵץ יְהוָה
  choice: потому что Яхве желал
  rationale: Прямо передаёт значение желания или воли в חפץ, не смягчая богословское напряжение слов о Божьем суде и не приписывая Богу удовольствия от зла.
- source_word: לַהֲמִיתָם
  choice: предать их смерти
  rationale: Передаёт каузативную форму מות dignified и естественным русским выражением.
theological_decisions:
- issue: Значение אֱלֹהִים в первой части стиха
  choice: Бог
  alternative: судьи
  rationale: Контраст с грехом против Яхве поддерживает понимание слова как обозначения Бога, который разбирает спор между людьми. Исторически возможное значение «судьи» сохранено в примечании.
- issue: Связь двух форм корня פלל
  choice: «рассудит его дело» в первой части и «молиться» во второй
  alternative: «выступит посредником» и «будет ходатайствовать»
  rationale: Различные породы глагола и контекст допускают судебный оттенок в первой части и молитвенный во второй. Перевод сохраняет смысловую связь, а альтернативный оттенок второго употребления вынесен в примечание.
- issue: Божественное намерение в כִּי חָפֵץ יְהוָה לַהֲמִיתָם
  choice: потому что Яхве желал предать их смерти
  alternative: потому что Яхве решил предать их смерти
  rationale: Формулировка сохраняет сильное утверждение текста о Божьей воле и суде, не снимая напряжения между этой волей и отказом сыновей слушать отца.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Сохранены риторический вопрос, повтор слова «человек», выражение «голос своего отца» и резкость заключительного утверждения о Божьем суде.
