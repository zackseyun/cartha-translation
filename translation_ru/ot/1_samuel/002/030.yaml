base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/030.yaml
  text: 'Therefore[a], declares Yahweh, the God of Israel: I indeed said that your house and your father’s house would walk before me forever. But now, declares Yahweh: far be it from me! For those who honor me I will honor, but those who despise me will be lightly esteemed.'
translation:
  language: ru
  text: 'Поэтому, — возвещает Яхве, Бог Израиля, — Я действительно сказал: «Твой дом и дом твоего отца будут ходить предо Мною вовеки». Но теперь, — возвещает Яхве, — не бывать этому! Ведь тех, кто чтит Меня, Я почту, а пренебрегающие Мною будут сочтены ничтожными[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут обесчещены»; «будут мало ценимы». Древнееврейский глагол означает стать лёгким, маловажным, не имеющим веса — в противоположность почёту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод, основанный на предшествующем обличении.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Естественно и торжественно передаёт формулу божественного речения; личное имя Яхве сохраняется явно.
- source_word: אָמֹר אָמַרְתִּי
  choice: Я действительно сказал
  rationale: Передаёт усиление, создаваемое сочетанием абсолютного инфинитива с личной формой глагола.
- source_word: בֵּיתְךָ וּבֵית אָבִיךָ
  choice: твой дом и дом твоего отца
  rationale: Сохраняет повтор слова «дом» и его семейно-династический смысл.
- source_word: יִתְהַלְּכוּ לְפָנַי
  choice: будут ходить предо Мною
  rationale: Сохраняет многозначный древнееврейский образ постоянной жизни и служения в Божьем присутствии, не сужая его только до священнического служения.
- source_word: עַד עוֹלָם
  choice: вовеки
  rationale: Кратко и торжественно передаёт длительность обещания.
- source_word: חָלִילָה לִּי
  choice: не бывать этому!
  rationale: Передаёт резкое и категорическое отвержение ранее предполагаемого продолжения обещания, оставаясь естественным по-русски.
- source_word: מְכַבְּדַי אֲכַבֵּד
  choice: тех, кто чтит Меня, Я почту
  rationale: 'Сохраняет корневой повтор и взаимность: «чтит — почту».'
- source_word: וּבֹזַי
  choice: те, кто пренебрегает Мною
  rationale: Передаёт отношение презрения и неуважения без излишнего усиления.
- source_word: יֵקָלּוּ
  choice: сами окажутся в пренебрежении
  rationale: Передаёт значение «быть маловажным, не иметь веса» и сохраняет смысловой контраст с почётом.
theological_decisions:
- issue: Характер прежнего обещания дому Илия
  choice: Предыдущее Божье слово передано как реальное обещание, за которым следует решительный отказ от его предполагаемого безусловного продолжения.
  alternative: С самого начала понимать «вовеки» как гиперболу либо смягчить последующие слова до простого ограничения привилегии.
  rationale: Сам стих резко противопоставляет прежнее заявление словам «но теперь» и «не бывать этому», связывая перемену с отношением людей к Богу. Перевод сохраняет это богословское напряжение, не разрешая его систематически.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формы «предо Мною» и «вовеки» поддерживают достоинство речи, не делая её архаичной; синтаксис остаётся понятным широкому читателю.
