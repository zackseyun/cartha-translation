  source_fidelity: Начало стиха, формула божественного речения, усиленное «Я действительно сказал», образ «ходить предо Мною», временное «вовеки» и контраст «Но теперь» переданы точно. В последней строке «сами окажутся в пренебрежении» несколько размывает пассивное значение יֵקָלּוּ и добавляет оттенок «сами», которого в еврейском тексте нет. Более прямо передать результат утраты чести как «будут сочтены ничтожными».
  naturalness: Текст в целом литературный и естественный. «Возвещает Яхве», «предо Мною» и «вовеки» уместно поддерживают сдержанно-торжественный библейский регистр. Замена заключительной формулы делает фразу яснее и идиоматичнее для современного русского читателя.
