  text: וְ/זֶה לְּ/ךָ֣ הָ/א֗וֹת אֲשֶׁ֤ר יָבֹא֙ אֶל שְׁנֵ֣י בָנֶ֔י/ךָ אֶל חָפְנִ֖י וּ/פִֽינְחָ֑ס בְּ/י֥וֹם אֶחָ֖ד יָמ֥וּתוּ שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/034.yaml
  text: 'And this will be the sign to you that will come upon your two sons[b][a], Hophni and Phinehas: both of them will die on one day.'
translation:
  language: ru
  text: 'И вот знамение для тебя: с твоими двумя сыновьями, Хофни и Финеесом, случится вот что: оба они умрут в один день.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאוֹת
  choice: знамение
  rationale: Слово אוֹת обозначает знак, подтверждающий истинность ранее возвещённого суда; «знамение» естественно для возвышенного повествовательного регистра и не сужает смысл до простого предвестия.
- source_word: אֲשֶׁר יָבֹא אֶל
  choice: в том, что постигнет
  rationale: Буквально оборот говорит о том, что «придёт к» сыновьям; по-русски «постигнет» естественно передаёт наступление предсказанного события или суда.
- source_word: שְׁנֵי בָנֶיךָ
  choice: двух твоих сыновей
  rationale: Сохранены число и прямое обращение к Илию.
- source_word: אֶל חָפְנִי וּפִינְחָס
  choice: Хофни и Финееса
  rationale: Повторный предлог вводит приложение, уточняющее имена двух сыновей; в русском это естественно передаётся без повторения предлога.
- source_word: בְּיוֹם אֶחָד
  choice: в один день
  rationale: Прямо передаёт временную формулу, не заменяя её пояснительным «в один и тот же день».
- source_word: יָמוּתוּ שְׁנֵיהֶם
  choice: оба они умрут
  rationale: Передаёт заключительное смысловое ударение на том, что умрут оба сына.
theological_decisions:
- issue: Характер знамения
  choice: Подтверждающее знамение возвещённого суда над домом Илия
  alternative: Лишь предсказательное предзнаменование без подтверждающей функции
  rationale: В контексте гибель обоих сыновей подтверждает достоверность пророческого слова; основной текст сохраняет широкое слово «знамение», не вводя дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис немного упрощён по сравнению с буквальным еврейским построением, однако сохранены прямая речь, пророческий тон и временная формула «в один день».
