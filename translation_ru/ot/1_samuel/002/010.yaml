  text: יְהוָ֞ה יֵחַ֣תּוּ מריב/ו על/ו בַּ/שָּׁמַ֣יִם יַרְעֵ֔ם יְהוָ֖ה יָדִ֣ין אַפְסֵי אָ֑רֶץ וְ/יִתֶּן עֹ֣ז לְ/מַלְכּ֔/וֹ וְ/יָרֵ֖ם קֶ֥רֶן מְשִׁיחֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/010.yaml
  text: Yahweh’s adversaries will be shattered[a]; he will thunder against them from heaven. Yahweh will judge the ends of the earth[c][b]; he will give strength to his king and lift up the horn of his anointed.
translation:
  language: ru
  text: Противники Яхве будут сокрушены[a]; с небес он прогремит против них[b]. Яхве будет судить землю до самых её краёв; он даст силу своему царю и вознесёт рог своего помазанника[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Те, кто спорит с Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на небесах он прогремит против них».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово означает «его помазанник» — прежде всего помазанный Яхве царь; от этого же слова происходит название «Мессия». «Рог» здесь — образ силы, достоинства и победного возвышения.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, а не заменяет его титулом «Господь».
- source_word: יֵחַתּוּ
  choice: будут сокрушены
  rationale: Нифаль глагола חתת здесь выражает разгром и слом противников, а не только их испуг.
- source_word: מְרִיבָיו
  choice: противники
  rationale: Слово обозначает тех, кто вступает с Яхве в противоборство; естественное русское соответствие сохраняет враждебный смысл.
- source_word: בַּשָּׁמַיִם יַרְעֵם
  choice: с небес он прогремит против них
  rationale: Глагол רעם обозначает гром; «с небес» естественно передаёт источник направленного против врагов Божьего действия.
- source_word: יָדִין אַפְסֵי אָרֶץ
  choice: будет судить землю до самых её краёв
  rationale: Естественно передаёт всеобщий охват суда, выраженный идиомой «края земли», без неясного буквального оборота «судить края».
- source_word: וְיִתֶּן עֹז
  choice: даст силу
  rationale: Прямо передаёт дарование царю силы или могущества.
- source_word: לְמַלְכּוֹ
  choice: своему царю
  rationale: Сохраняет явное царское наименование, хотя песнь относится ко времени до установления монархии в Израиле.
- source_word: וְיָרֵם קֶרֶן
  choice: вознесёт рог
  rationale: Сохраняет ключевой поэтический образ рога как силы, достоинства и победного возвышения.
- source_word: מְשִׁיחוֹ
  choice: своего помазанника
  rationale: Это прямое значение еврейского слова; оно сохраняет непосредственный смысл помазанного царя и не устраняет мессианское звучание.
theological_decisions:
- issue: Передача מְשִׁיחוֹ в царском и потенциально мессианском контексте
  choice: своего помазанника
  alternative: своего Мессию
  rationale: Нарицательное «помазанник» точно сохраняет непосредственный царский смысл и оставляет открытым дальнейший мессианский горизонт текста, не превращая неоднозначное обозначение в однозначный титул.
- issue: Образ «рога»
  choice: вознесёт рог
  alternative: возвысит силу
  rationale: Сохранение метафоры важно для поэтической структуры песни Анны и её библейских перекличек; смысл образа поясняется в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием. Синтаксис сделан ясным для обычного читателя; сохранены имя Яхве, царская терминология и образ рога. Местоимения, относящиеся к Богу, написаны со строчной буквы в соответствии с обычной современной издательской практикой.
