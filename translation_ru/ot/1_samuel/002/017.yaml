base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/017.yaml
  text: So the sin of the young men was very great before Yahweh[c][b][a], because the men despised Yahweh’s offering.
translation:
  language: ru
  text: И грех молодых людей был весьма велик перед Яхве[a], ибо они презрели приношение Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед лицом Яхве»; то есть перед Яхве, в Его присутствии.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может обозначать приношение вообще, а в некоторых контекстах — хлебное приношение.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: грех
  rationale: В данном контексте существительное обозначает проступок сыновей Илия, а не жертву за грех.
- source_word: הַנְּעָרִים
  choice: этих молодых людей
  rationale: נַעַר может означать юношу или служителя; здесь речь о взрослых сыновьях Илия, исполнявших священническое служение. Указательное «этих» естественно связывает стих с предшествующим повествованием.
- source_word: גְּדוֹלָה מְאֹד
  choice: был весьма велик
  rationale: Сохраняет прямое усиление еврейского выражения и звучит достойно в современном литературном русском.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: пред Яхве
  rationale: Буквально «перед лицом Яхве»; краткое русское выражение сохраняет смысл пребывания перед Богом и не превращает его без необходимости в «против Яхве».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя транслитерацией, а не заменяет его титулом.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину данной нравственной оценки.
- source_word: נִאֲצוּ
  choice: пренебрегали
  rationale: Глагол выражает презрение и неуважение. «Пренебрегали» естественно сочетается с приношением и передаёт проявленное к нему презрительное отношение.
- source_word: הָאֲנָשִׁים
  choice: они
  rationale: Местоимение естественно по-русски отсылает к уже названным молодым людям; повтор «люди» был бы тяжеловесным и мог бы создать ложное впечатление о другой группе.
- source_word: מִנְחַת יְהוָה
  choice: приношением Яхве
  rationale: מִנְחָה может обозначать приношение вообще, а в отдельных контекстах — хлебное приношение. Здесь широкое обозначение не сужает смысл повествования.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное имя Бога.
- issue: Значение אֶת־פְּנֵי יְהוָה
  choice: пред Яхве
  alternative: против Яхве; в присутствии Яхве
  rationale: Выбор сохраняет образ исходной идиомы и её возможный оттенок Божьего присутствия, не сводя выражение исключительно к направленности греха против Бога.
- issue: Объём значения מִנְחָה
  choice: приношение
  alternative: хлебное приношение
  rationale: Контекст говорит о жертвенных долях шире, поэтому более общее слово сохраняет диапазон еврейского термина и не вносит неоправданной конкретизации.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Весьма» и «пред Яхве» поддерживают достоинство стиля, оставаясь понятными; синтаксис не перегружен буквальными повторами.
