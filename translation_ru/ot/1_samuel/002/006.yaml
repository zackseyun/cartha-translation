  text: יְהוָ֖ה מֵמִ֣ית וּ/מְחַיֶּ֑ה מוֹרִ֥יד שְׁא֖וֹל וַ/יָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/006.yaml
  text: Yahweh puts to death and makes alive[a]; he brings down to Sheol and raises up.
translation:
  language: ru
  text: Яхве умерщвляет и оживляет; низводит в Шеол[a] и возводит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могилу» или «в мир мёртвых». Еврейское слово «Шеол» обозначает обитель мёртвых; его не следует автоматически понимать как «ад».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: מֵמִית
  choice: умерщвляет
  rationale: Сохраняет каузативное значение формы от מות и поэтически соответствует следующему глаголу «оживляет».
- source_word: וּמְחַיֶּה
  choice: и оживляет
  rationale: Передаёт каузативный смысл формы от חיה, не уточняя, идёт ли речь именно о телесном воскресении.
- source_word: מוֹרִיד
  choice: низводит
  rationale: Передаёт каузативное действие и сохраняет возвышенный поэтический параллелизм с «возводит».
- source_word: שְׁאוֹל
  choice: Шеол
  rationale: Транслитерация сохраняет широту древнееврейского представления об обители мёртвых и не сводит его автоматически ни к могиле, ни к аду.
- source_word: וַיָּעַל
  choice: и возводит
  rationale: Сохраняет направленную противоположность глаголу «низводит» и не добавляет более узкого указания на воскресение, которого сам еврейский текст прямо не выражает.
theological_decisions:
- issue: Следует ли прямо говорить о воскресении из мёртвых
  choice: Сохранить более широкие выражения «оживляет» и «возводит».
  alternative: Передать как «воскрешает» или «поднимает из мёртвых».
  rationale: Стих утверждает власть Яхве над смертью и Шеолом, однако поэтические еврейские выражения шире прямого утверждения о телесном воскресении. Перевод не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим ритмом. Пара «низводит — возводит» отражает антитезу оригинала; точка с запятой обозначает две параллельные строки.
