source:
  edition: WLC
  text: וְ/אִ֗ישׁ לֹֽא אַכְרִ֤ית לְ/ךָ֙ מֵ/עִ֣ם מִזְבְּחִ֔/י לְ/כַלּ֥וֹת אֶת עֵינֶ֖י/ךָ וְ/לַ/אֲדִ֣יב אֶת נַפְשֶׁ֑/ךָ וְ/כָל מַרְבִּ֥ית בֵּיתְ/ךָ֖ יָמ֥וּתוּ אֲנָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/033.yaml
  text: But I will not cut off every man of yours from beside my altar[a], to make your eyes fail and your soul grieve; and all the increase of your house will die by the sword of men.
translation:
  language: ru
  text: Но не всякого мужчину из твоего рода Я отстраню от Моего жертвенника, чтобы истощить твои глаза и причинить страдание твоей душе. А все потомки твоего дома умрут мужчинами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «умрут мужчинами». Вероятный смысл: умрут в зрелом возрасте, в расцвете сил.'
    reason: Еврейское выражение кратко и неоднозначно. Сноска сохраняет буквальную форму и сообщает вероятное идиоматическое значение, не добавляя отсутствующее в тексте упоминание меча.
lexical_decisions:
- source_word: וְאִישׁ לֹא אַכְרִית לְךָ מֵעִם מִזְבְּחִי
  choice: Но не всякого мужчину из твоего рода Я отстраню от Моего жертвенника
  rationale: 'Сочетание существительного с последующим отрицанием передаёт смысл неполного устранения: не все мужчины из рода Илия будут удалены от жертвенника. «Отстраню» естественно выражает כרת в контексте доступа к священническому служению, не утверждая полного истребления рода.'
- source_word: לְכַלּוֹת אֶת עֵינֶיךָ וְלַאֲדִיב אֶת נַפְשֶׁךָ
  choice: оставшиеся будут изнурять твои глаза и терзать твою душу
  rationale: Инфинитивы выражают цель или результат сохранения некоторых потомков. Русская конструкция делает подразумеваемых оставшихся людей явными и сохраняет образы истощённых глаз и страдающей души.
- source_word: וְכָל מַרְבִּית בֵּיתְךָ
  choice: А все потомки твоего дома
  rationale: מַרְבִּית буквально означает «прирост, умножение»; здесь речь идёт о людях, продолжающих род. «Потомки» передаёт контекстуальный смысл яснее, чем неестественное русское «приумножение дома».
- source_word: יָמוּתוּ אֲנָשִׁים
  choice: умрут, став мужчинами
  rationale: Фраза буквально связывает смерть с «мужчинами» и, вероятно, означает смерть в зрелом возрасте или в расцвете сил. Формулировка сохраняет необычность и неоднозначность еврейского выражения; пояснение дано в сноске. Значение «от меча людей» непосредственно в тексте не выражено.
theological_decisions:
- issue: Характер суда над священническим родом Илия
  choice: Не весь род сразу отстраняется от жертвенника; некоторые остаются, но их существование становится источником мучительной скорби.
  alternative: Полное прекращение священнического служения рода либо простое физическое выживание без связи со служением.
  rationale: Отрицательная конструкция указывает, что устранены будут не все, а следующие целевые или результативные обороты представляют оставшихся частью продолжающегося суда. Перевод сохраняет напряжение между сохранением остатка и наказанием.
- issue: Значение заключительного אֲנָשִׁים
  choice: Сохранить буквальный образ смерти после достижения мужского возраста и пояснить вероятный смысл в сноске.
  alternative: Сразу перевести как «умрут в расцвете сил» или неподтверждённо добавить «от меча людей».
  rationale: Краткое еврейское выражение допускает понимание смерти в зрелости или расцвете сил, но само по себе не упоминает меч. Основной текст и сноска вместе сохраняют смысловую неопределённость.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Заглавные местоимения относятся к Богу. Неестественные кальки устранены там, где контекст позволяет передать смысл яснее; необычность последней фразы намеренно сохранена и пояснена сноской.
