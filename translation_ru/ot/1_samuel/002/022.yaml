base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/022.yaml
  text: Eli was very old[a], and he heard all that his sons were doing to all Israel, and that they were lying with the women who served at the entrance to the tent of meeting.
translation:
  language: ru
  text: Илий был очень стар, и он слышал обо всём, что его сыновья делали со всем Израилем, и о том, что они ложились с женщинами, служившими[a] у входа в шатёр встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собиравшимися у входа в шатёр встречи». Еврейское причастие может обозначать как собирание, так и организованное служение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: был уже очень стар
  rationale: Предикативное прилагательное с усилителем естественно передаётся по-русски как «был уже очень стар»; «уже» подчёркивает достигнутую преклонность, не вводя отдельного временного указателя в начале стиха.
- source_word: וְשָׁמַע
  choice: Он слышал
  rationale: Перфект в повествовательном контексте сообщает, что до Илия доходили известия; простая форма прошедшего времени сохраняет это значение без излишнего уточнения повторяемости.
- source_word: כָּל אֲשֶׁר יַעֲשׂוּן
  choice: обо всём, что ... делали
  rationale: Формулировка охватывает продолжающееся поведение сыновей и естественно звучит в современном русском.
- source_word: לְכָל יִשְׂרָאֵל
  choice: со всем Израилем
  rationale: Предлог ל обозначает отношение действий к затронутому ими народу. «Со всем Израилем» по-русски естественнее буквального «всему Израилю» и не усиливает смысл до однозначного «против».
- source_word: יִשְׁכְּבוּן אֶת־הַנָּשִׁים
  choice: ложились с женщинами
  rationale: Глагол שׁכב с обозначением человека служит сексуальным эвфемизмом. «Ложились с» сохраняет эвфемистичность и при этом ясно передаёт смысл в достойном регистре.
- source_word: הַצֹּבְאוֹת
  choice: служившими
  rationale: Причастие от צבא может обозначать организованное служение; в контексте святилища и с учётом Исхода 38:8 это наиболее вероятная передача, хотя значение «собиравшимися» также возможно.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: у входа в шатёр встречи
  rationale: Передача сохраняет пространственное значение «у входа» и смысл культового наименования אֹהֶל מוֹעֵד без архаизации.
theological_decisions:
- issue: Роль женщин при святилище
  choice: женщины, служившие у входа в шатёр встречи
  alternative: женщины, собиравшиеся у входа в шатёр встречи
  rationale: Еврейское причастие допускает как организованное служение, так и собирание. Контекст святилища поддерживает «служившие», но сноска сохраняет подлинную лексическую неоднозначность и не приписывает женщинам позднейшей институциональной должности.
- issue: Степень явности описания половой распущенности
  choice: ложились с женщинами
  alternative: спали с женщинами; вступали в половую связь с женщинами
  rationale: Источник использует обычный сексуальный эвфемизм. Выбранная формулировка не скрывает проступка, но и не делает текст более клиническим или откровенным, чем оригинал.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Длинное еврейское предложение разделено на два русских для ясности; начальный союз не передан отдельным дискурсивным словом. Термин «шатёр встречи» выбран как прозрачная передача культового наименования.
