  text: וּ/בְנֵ֥י עֵלִ֖י בְּנֵ֣י בְלִיָּ֑עַל לֹ֥א יָדְע֖וּ אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/012.yaml
  text: Eli’s sons were worthless men[b][a]; they did not know Yahweh.
translation:
  language: ru
  text: Сыновья Илия были негодными людьми[a]; они не знали Господа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья негодности»; традиционно: «сыновья Велиала».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не признавали Господа»; «не почитали Господа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עֵלִי
  choice: Сыновья Илия
  rationale: בְנֵי — форма сопряжённого множественного числа «сыновья», עֵלִי передано традиционной русской формой имени «Илий». Начальный ו не выражен отдельным союзом, поскольку в русском начале повествовательной единицы связь с контекстом ясна без искусственного «и».
- source_word: בְּנֵי בְלִיָּעַל
  choice: негодными людьми
  rationale: Буквальная идиома «сыновья негодности» характеризует нравственно испорченных, низких людей. Передача «негодные люди» ясно выражает смысл и не превращает בְלִיָּעַל в имя собственного демонического существа.
- source_word: לֹא יָדְעוּ
  choice: не знали
  rationale: Сохранено основное значение глагола יָדַע — «знать». В данном контексте выражение может подразумевать непризнание Господа и отсутствие почтения к Нему, однако буквальная формулировка сохраняет смысловую и богословскую напряжённость.
- source_word: אֶת יְהוָה
  choice: Господа
  rationale: Непереводимый показатель прямого дополнения אֶת опущен; священное имя יהוה передано принятой в русском библейском регистре формой «Господь», здесь в родительном падеже.
theological_decisions:
- issue: Следует ли понимать בְלִיָּעַל как нарицательное обозначение негодности или как имя Велиал
  choice: 'нарицательная идиома: «негодные люди»'
  alternative: «сыновья Велиала»
  rationale: В данном контексте выражение характеризует нравственную испорченность сыновей Илия и не требует понимания Велиала как личного имени.
- issue: Следует ли истолковать «не знали Господа» как «не признавали» или «не почитали Господа»
  choice: сохранить «не знали Господа»
  alternative: «не признавали Господа» / «не почитали Господа»
  rationale: Глагол «знать» способен включать отношения, признание и верность. Его сохранение не сужает многозначность древнееврейского выражения до одного истолкования.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной повествовательной формой. Точка с запятой сохраняет тесную связь между нравственной характеристикой сыновей Илия и их отношением к Господу.
