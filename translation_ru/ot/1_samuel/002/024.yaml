  text: אַ֖ל בָּנָ֑/י כִּ֠י לֽוֹא טוֹבָ֤ה הַ/שְּׁמֻעָה֙ אֲשֶׁ֣ר אָנֹכִ֣י שֹׁמֵ֔עַ מַעֲבִרִ֖ים עַם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/024.yaml
  text: No[a], my sons; for the report that I hear is not good. You are making Yahweh’s people transgress.
translation:
  language: ru
  text: 'Нет, сыновья мои! Нехороша молва, которую я слышу: вы вводите народ Яхве в грех.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Нехороша молва, которую, как я слышу, распространяет народ Яхве».'
    reason: Альтернативное понимание синтаксически трудного оборота מַעֲבִרִים עַם יְהוָה.
lexical_decisions:
- source_word: אַל
  choice: Нет
  rationale: Здесь отрицание выражает резкое неодобрение Илия, а не обычный запрет; «Нет» естественно звучит в прямом увещевании.
- source_word: בָּנָי
  choice: сыновья мои
  rationale: Обращение относится именно к сыновьям Илия и сохраняет личный, отеческий тон.
- source_word: לֹא טוֹבָה הַשְּׁמֻעָה
  choice: нехороша молва
  rationale: «Молва» передаёт распространяющиеся среди народа сведения о поведении сыновей, не привнося оттенка официального донесения.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: которую я слышу
  rationale: Прямая и естественная передача относительного оборота; форма причастия допускает продолжающееся действие, что в русском выражается настоящим временем.
- source_word: מַעֲבִרִים
  choice: вы вводите … в грех
  rationale: Каузативная форма глагола עבר в данном контексте понимается как побуждение народа к нарушению Божьей воли. Формулировка передаёт смысл яснее, чем буквальное «заставляете преступать».
- source_word: עַם יְהוָה
  choice: народ Яхве
  rationale: Сохраняется конструкция принадлежности и личное Божье имя.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, стоящее в еврейском тексте, а не заменяется титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное заветное имя, непосредственно употреблённое в исходном тексте.
- issue: Понимание מַעֲבִרִים עַם יְהוָה
  choice: вы вводите народ Яхве в грех
  alternative: молва, которую, как я слышу, распространяет народ Яхве
  rationale: Основной вариант понимает причастие как каузативное сказуемое с подразумеваемым обращением ко второму лицу; при этом синтаксис еврейской фразы труден и допускает отнесение причастия к распространению молвы, поэтому иной разбор сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой отеческой речи. Восклицание передаёт резкость упрёка; двоеточие связывает дурную молву с проступком сыновей. Подлинная синтаксическая неоднозначность заключительной части сохранена в сноске.
