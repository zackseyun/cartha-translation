base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/001.yaml
  text: 'And Hannah prayed and said: “My heart exults in Yahweh[a]; my horn is lifted high in Yahweh. My mouth is opened wide against my enemies[c][b], because I rejoice in your salvation.”'
translation:
  language: ru
  text: 'Анна помолилась и сказала:


    «Сердце моё ликует в Яхве,

    высоко поднялся мой рог[a] в Яхве.

    Уста мои широко открылись против врагов моих[b],

    потому что я радуюсь Твоему спасению[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Рог — древнееврейский образ силы, достоинства и возвышенного положения.
    reason: cultural_note
  - marker: b
    text: 'Или: «Я смело говорю против моих врагов» или «Я торжествую над моими врагами». Буквально: «уста мои широко открылись против моих врагов».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Твоему избавлению». Еврейское слово может означать как спасение в широком смысле, так и конкретное избавление от беды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפַּלֵּל
  choice: помолилась
  rationale: Порода хитпаэль глагола פלל обычно означает «молиться». Хотя далее следует поэтическая хвала, повествовательная рамка прямо называет её молитвой.
- source_word: וַתֹּאמַר
  choice: сказав
  rationale: В еврейском тексте употреблён обычный глагол «сказать», а не специальный глагол пения; деепричастие естественно связывает его с предшествующим сказуемым в русском синтаксисе.
- source_word: עָלַץ לִבִּי
  choice: Сердце моё ликует
  rationale: עלץ выражает бурную, торжествующую радость. «Ликует» сохраняет поэтическую силу и явный образ сердца.
- source_word: בַּיהוָה
  choice: в Яхве
  rationale: Предлог ב обозначает здесь основание или сферу ликования и возвышения. Буквально близкое «в Яхве» сохраняет повтор и допускаемую оригиналом смысловую многогранность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» является общепринятой научной транслитерацией, адаптированной к русскому языку.
- source_word: רָמָה קַרְנִי
  choice: высоко поднялся мой рог
  rationale: Сохранён древнееврейский поэтический образ рога как силы, достоинства и возвышенного положения. «Высоко поднялся» передаёт значение רמה и звучит яснее, чем буквальное «возвысился».
- source_word: רָחַב פִּי עַל אֹיְבַי
  choice: Широко открылся рот мой против врагов моих
  rationale: 'Формулировка сохраняет телесный образ еврейского оригинала: широко открытый рот означает смелую, торжествующую речь над поверженными противниками.'
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину радости и смелой речи Анны; причинное значение непосредственно выражено по-русски.
- source_word: שָׂמַחְתִּי
  choice: я радуюсь
  rationale: Перфект обозначает достигнутое состояние радости, которое продолжается в момент молитвы; настоящее время естественно передаёт это в русской поэзии.
- source_word: בִּישׁוּעָתֶךָ
  choice: Твоему спасению
  rationale: ישועה может обозначать как спасение вообще, так и конкретное избавление от беды. «Спасение» сохраняет широту слова, не устраняя его непосредственный смысл в переживании Анны.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе дважды стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет имя и не подменяет его титулом; форма «Иегова» основана на более позднем смешении согласных имени с огласовкой заменяющего чтения.
- issue: Смысл יְשׁוּעָה в молитве Анны
  choice: спасение
  alternative: избавление
  rationale: Выбрано более широкое русское соответствие, способное обозначать и конкретную помощь Анне, и спасительное действие Бога вообще. Более узкое «избавление» отмечено в сноске.
translation_notes:
  register: Современный литературный русский с сохранением возвышенного поэтического параллелизма. Инверсия «сердце моё», «рот мой», «врагов моих» придаёт строкам достоинство и ритм, не делая речь чрезмерно архаичной. Метафоры оригинала сохранены, а их смысл пояснён в сносках.
