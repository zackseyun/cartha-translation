  text: Even before they burned the fat[a], the priest’s servant would come and say to the man who was sacrificing, “Give meat for the priest to roast, for he will not take boiled meat from you, but only raw.”
translation:
  language: ru
  text: 'Ещё до того, как сжигали жир, приходил слуга священника[a] и говорил человеку, приносившему жертву: «Дай священнику мяса для жарки: он не возьмёт у тебя варёного мяса, а только сырого».'
  philosophy: optimal-equivalence
  footnotes:
