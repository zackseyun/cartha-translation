    text: 'Или: «помощник священника» или «юноша священника»; еврейское נַעַר может обозначать юношу, слугу или помощника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בְּטֶרֶם
  choice: даже прежде, чем
  rationale: גַּם усиливает описание проступка, а בְּטֶרֶם указывает, что требование предъявлялось до положенного обрядового действия.
- source_word: יַקְטִרוּן אֶת־הַחֵלֶב
  choice: сжигали жир
  rationale: Глагол обозначает ритуальное сожжение жировых частей на жертвеннике; современное «сжигали жир» ясно передаёт действие без излишне специальной лексики.
- source_word: נַעַר הַכֹּהֵן
  choice: слуга священника
  rationale: נַעַר может означать юношу, слугу или помощника; здесь речь идёт о подчинённом, действующем от имени священника. Неоднозначность отмечена в сноске.
- source_word: לָאִישׁ הַזֹּבֵחַ
  choice: человеку, приносившему жертву
  rationale: Причастная конструкция обозначает человека, совершающего жертвоприношение; развёрнутый перевод естественен по-русски.
- source_word: תְּנָה בָשָׂר לִצְלוֹת לַכֹּהֵן
  choice: Дай священнику мяса для жарки
  rationale: Передан резкий императив и назначение мяса. Такая формулировка сохраняет естественную связь לַכֹּהֵן со священником, не уточняя без необходимости, кто именно будет жарить мясо.
- source_word: מְבֻשָּׁל
  choice: варёного
  rationale: Слово обозначает мясо, приготовленное варкой, в противопоставлении сырому; «варёное» точнее общего «приготовленное».
- source_word: כִּי אִם חָי
  choice: а только сырое
  rationale: Исключительно-противительная конструкция естественно передаётся сочетанием «а только», сохраняя контраст с варёным мясом.
