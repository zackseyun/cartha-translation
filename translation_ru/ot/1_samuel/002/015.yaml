  naturalness: «Даже прежде, чем» возможно, но для современного литературного русского несколько тяжеловесно. «Ещё до того, как» естественно и сохраняет усилительное גַּם. Замена «говорил» на «сказал» делает последовательность действий яснее и ближе к еврейскому повествованию. «Мяса для жарки» и «варёного мяса, а только сырого» звучат естественно.
