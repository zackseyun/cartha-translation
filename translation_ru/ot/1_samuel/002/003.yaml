source:
  edition: WLC
  text: אַל תַּרְבּ֤וּ תְדַבְּרוּ֙ גְּבֹהָ֣ה גְבֹהָ֔ה יֵצֵ֥א עָתָ֖ק מִ/פִּי/כֶ֑ם כִּ֣י אֵ֤ל דֵּעוֹת֙ יְהוָ֔ה ו/לא נִתְכְּנ֖וּ עֲלִלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/003.yaml
  text: Do not keep speaking so very proudly; do not let arrogance come out of your mouth[a], for Yahweh is a God of knowledge, and by him actions are weighed.
translation:
  language: ru
  text: 'Не говорите снова и снова так надменно,

    пусть дерзость не исходит из ваших уст,

    ведь Яхве — Бог знания,

    и Им взвешиваются поступки.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'При более строгом следовании согласному тексту возможно: «и поступки не взвешиваются». В основном тексте принято традиционное чтение, согласно которому Яхве оценивает человеческие дела.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּרְבּוּ תְדַבְּרוּ
  choice: Не говорите снова и снова
  rationale: Сочетание רבה с последующим личным глаголом усиливает идею многократного или продолжающегося действия. «Снова и снова» естественно передаёт этот оттенок по-русски и сохраняет запрет.
- source_word: גְּבֹהָה גְבֹהָה
  choice: так надменно
  rationale: Повтор слова со значением высоты усиливает характеристику речи как высокомерной. Русское «так надменно» передаёт эмфазу без неестественного буквального удвоения.
- source_word: יֵצֵא עָתָק מִפִּיכֶם
  choice: пусть дерзость не исходит из ваших уст
  rationale: עָתָק обозначает заносчивость, дерзость или вызывающе-надменную речь. Формулировка сохраняет образ того, что исходит из уст, а отрицание продолжает силу предшествующего запрета.
- source_word: אֵל דֵּעוֹת יְהוָה
  choice: Яхве — Бог знания
  rationale: Конструкция буквально характеризует Яхве как «Бога знаний». Единственное число «знания» естественнее в современном русском и не превращает выражение в более определённое толкование вроде «всеведущий».
- source_word: וְלֹא / וְלוֹ נִתְכְּנוּ עֲלִלוֹת
  choice: и Им взвешиваются поступки
  rationale: Основной текст следует традиционному чтению לוֹ («Им/у Него»), при котором человеческие поступки взвешиваются Богом. Глагол передан как «взвешиваются», чтобы сохранить метафору измерения и оценки.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Чтение וְלֹא / וְלוֹ נִתְכְּנוּ עֲלִלוֹת
  choice: и Им взвешиваются поступки
  alternative: и поступки не взвешиваются
  rationale: 'Традиционное чтение לוֹ даёт связный смысл: Бог знает и оценивает поступки. Согласный текст לא допускает отрицательное прочтение; эта существенная текстовая неоднозначность сохранена в примечании.'
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи; сохранены параллелизм, образ исходящей из уст дерзости и метафора взвешивания поступков. Обращение передано во множественном числе, как в еврейском тексте.
