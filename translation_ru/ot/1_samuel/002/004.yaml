base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/004.yaml
  text: The bows of the mighty are shattered[b][a], but those who stumble are girded with strength.
translation:
  language: ru
  text: 'Луки сильных сокрушены,

    а спотыкающиеся препоясались силой[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сломаны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  choice: луки
  rationale: Существительное стоит в единственном числе, но употреблено собирательно при форме множественного числа חַתִּים; русское множественное «луки» естественно передаёт смысл.
- source_word: גִּבֹּרִים
  choice: сильных
  rationale: Слово может обозначать могучих людей, храбрецов или воинов. «Сильных» сохраняет широкий смысл и поддерживает противопоставление силе, которую обретают спотыкающиеся.
- source_word: חַתִּים
  choice: сокрушены
  rationale: При слове «луки» форма означает физическое разрушение, а не испуг. «Сокрушены» сохраняет яркую поэтическую силу; более буквальное «сломаны» дано в примечании.
- source_word: נִכְשָׁלִים
  choice: спотыкающиеся
  rationale: Причастие буквально описывает тех, кто спотыкается или теряет устойчивость. Перевод сохраняет телесный образ, не заменяя его истолкованием «слабые».
- source_word: אָזְרוּ
  choice: препоясались
  rationale: Активная форма глагола означает «опоясались, препоясались». Возвратная русская форма точно передаёт действие и сохраняет поэтический образ.
- source_word: חָיִל
  choice: силой
  rationale: В данном контексте слово обозначает силу или мощь; «силой» естественно сочетается с «препоясались» и не сужает значение до одной лишь воинской доблести.
theological_decisions:
- issue: Поэтический образ переворота силы и слабости в песне Анны
  choice: Сохранены конкретные образы луков, спотыкания и препоясывания силой.
  alternative: «Оружие воинов сломано, а слабые стали сильными».
  rationale: Абстрактная передача сгладила бы поэтическое и богословское напряжение текста. Конкретные образы показывают переворот человеческой силы и немощи, не добавляя объяснения от переводчика.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим оттенком. Параллелизм двух строк и конкретная образность еврейского текста сохранены; «препоясались» выбрано как понятное библейско-поэтическое слово.
