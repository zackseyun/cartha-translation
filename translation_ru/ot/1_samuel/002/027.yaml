base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/027.yaml
  text: 'And a man of God came to Eli and said to him, “Thus says the LORD: Did I indeed reveal myself to your father''s house when they were in Egypt, belonging to Pharaoh''s house?”'
translation:
  language: ru
  text: 'К Илию пришёл человек Божий и сказал ему: «Так говорит ГОСПОДЬ: разве не открылся Я дому твоего отца, когда они были в Египте, в доме фараона?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «В доме фараона» — то есть под властью фараона; выражение не обязательно подразумевает пребывание в его дворце.
    reason: Поясняет идиоматическое значение בֵּית («дом») и связь с фараоном, не сужая её до службы при дворе.
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: человек Божий
  rationale: Устойчивое и естественное библейское обозначение посланника Бога, формально соответствующее еврейскому выражению.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Передаёт тетраграмматон принятой в русской библейской традиции заменой с прописным начертанием.
- source_word: הֲנִגְלֹה נִגְלֵיתִי
  choice: разве не открылся Я
  rationale: Сохраняет риторический вопрос и передаёт усиленную инфинитивом личную форму естественным русским оборотом.
- source_word: בֵּית אָבִיךָ
  choice: дому твоего отца
  rationale: «Дом» здесь означает род или семейную линию; буквальная формулировка сохраняет эту смысловую ёмкость.
- source_word: לְבֵית פַּרְעֹה
  choice: при доме фараона
  rationale: Предлог לְ допускает связь со служением или принадлежностью дому фараона; «при доме» сохраняет эту неоднозначность лучше, чем однозначное «принадлежа дому».
theological_decisions:
- issue: К кому относится «дом твоего отца»
  choice: Сохранить обобщённое «дом твоего отца»
  alternative: 'Уточнить: «роду Аарона» или «твоим предкам»'
  rationale: Текст прямо не называет Аарона в этом стихе; уточнение преждевременно разрешило бы референцию.
- issue: Смысл לְבֵית פַּרְעֹה
  choice: 'Передать неоднозначно: «при доме фараона»'
  alternative: «принадлежа дому фараона» или «в доме фараона»
  rationale: Еврейское выражение может указывать на связь, подчинение или место служения; выбранный вариант не делает богословски и исторически более узкого утверждения, чем оригинал.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Начальное «И» сохраняет повествовательную связь; формула «Так говорит ГОСПОДЬ» передана традиционно и ясно.
