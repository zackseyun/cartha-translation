base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/005.yaml
  text: Those who were full have hired themselves out for bread[a], but those who were hungry have ceased. Even the barren woman has borne seven[c][b], but she who had many sons has withered away.
translation:
  language: ru
  text: 'Сытые нанимаются за хлеб,

    а голодные больше не голодают.[a]

    Даже бесплодная родила семерых,[b]

    а та, у которой было много сыновей, изнемогла.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «а голодные перестали»; что именно прекратилось, в еврейском тексте не сказано. По смыслу они больше не голодают или не терпят нужды.'
    reason: lexical_alternative
  - marker: b
    text: «Семь» может быть буквальным числом или поэтическим образом полноты.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂבֵעִים
  choice: сытые
  rationale: Субстантивированное прилагательное обозначает людей, прежде живших в достатке; краткое «сытые» сохраняет поэтический параллелизм.
- source_word: בַּלֶּחֶם
  choice: за хлеб
  rationale: Сохраняет конкретный образ хлеба как платы или средства пропитания и естественно сочетается с «нанимаются».
- source_word: נִשְׂכָּרוּ
  choice: нанимаются
  rationale: Нифаль от שׂכר здесь означает поступать в наём; настоящее время по-русски естественно передаёт обобщённую поэтическую картину переворота участи.
- source_word: וּרְעֵבִים חָדֵלּוּ
  choice: а голодные больше не голодают
  rationale: Глагол «перестали» оставляет дополнение невыраженным, но русский текст требует большей ясности; дополнение восстанавливается из непосредственно названного состояния «голодные».
- source_word: עַד
  choice: даже
  rationale: В данном контексте вводит крайнюю степень изображённого переворота, а не временный предел.
- source_word: עֲקָרָה
  choice: бесплодная
  rationale: Субстантивированная форма женского рода; слово точно и лаконично в поэтическом контексте.
- source_word: יָלְדָה שִׁבְעָה
  choice: родила семерых
  rationale: Передаёт краткость еврейского выражения; форма «семерых» естественно подразумевает детей, не добавляя существительного в основной текст.
- source_word: וְרַבַּת בָּנִים
  choice: а многодетная мать
  rationale: Буквально речь идёт о женщине, у которой много сыновей; компактное русское выражение сохраняет противопоставление, а точная лексическая деталь отмечена в сноске.
- source_word: אֻמְלָלָה
  choice: изнемогла
  rationale: Глагол выражает ослабление, упадок и бедственное состояние; «изнемогла» естественно и достойно передаёт этот смысл без добавления образа, отсутствующего в оригинале.
theological_decisions:
- issue: Следует ли истолковывать число שִׁבְעָה («семь») как символ полноты
  choice: Сохранить число «семь» без истолкования в основном тексте
  alternative: Передать как указание на полноту или многочисленность потомства
  rationale: Еврейский текст прямо называет семь и допускает как буквальное, так и символическое звучание; перевод не разрешает эту неоднозначность.
- issue: Следует ли явно передавать בָּנִים как «сыновья»
  choice: Использовать в основном тексте естественное «многодетная мать», уточнив буквальное значение в сноске
  alternative: «Имевшая много сыновей»
  rationale: Русское выражение сохраняет смысловой контраст и поэтическую плавность, а сноска не скрывает мужской род исходного существительного.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим ритмом и параллелизмом. Архаизмы сведены к минимуму; сохранены резкие противопоставления песни Анны и неоднозначность числа семь.
