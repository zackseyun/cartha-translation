  text: Samuel was ministering before Yahweh[a], a boy clothed with a linen ephod.
translation:
  language: ru
  text: А Самуил служил перед Яхве[a], будучи мальчиком, опоясанным льняным эфодом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед лицом Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמוּאֵל
  choice: А Самуил
  rationale: 'Союз ו здесь естественно передаётся как «а»: он связывает стих с контекстом и подчёркивает противопоставление Самуила сыновьям Илия, не вводя отсутствующего в оригинале временного «теперь».'
- source_word: מְשָׁרֵת
  choice: служил
  rationale: Причастная форма обозначает продолжающееся служение; русское прошедшее несовершенного вида естественно передаёт длительный характер действия и уместно в храмовом контексте.
- source_word: אֶת פְּנֵי יְהוָה
  choice: пред Яхве
  rationale: Кратко и естественно передаёт идиому «перед лицом/в присутствии Яхве», сохраняя её смысл служения в Божьем присутствии.
- source_word: נַעַר
  choice: Он был ещё мальчиком
  rationale: Слово указывает на юный возраст Самуила. «Мальчиком» звучит естественно и не приписывает слову дополнительного значения «слуга»; «ещё» по-русски ясно выражает возрастную характеристику в данном контексте.
- source_word: חָגוּר
  choice: носил
  rationale: Буквально форма означает «опоясанный», однако применительно к предмету одежды современное русское «носил» ясно и естественно передаёт состояние, не создавая неясного образа.
- source_word: אֵפוֹד
  choice: эфод
  rationale: Это особое израильское культовое облачение без точного русского соответствия; транслитерация сохраняет предметную и богословскую неопределённость термина.
- source_word: בָּד
  choice: льняной
  rationale: В контексте облачения слово обозначает лён; перевод не добавляет отсутствующего в тексте определения «тонкий».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Характер служения юного Самуила
  choice: служил пред Яхве
  alternative: прислуживал Яхве; совершал священнослужение
  rationale: Нейтральное «служил» сохраняет культовый контекст, но не уточняет полномочия или статус Самуила сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Форма «пред Яхве» сохраняет достоинство и краткость исходной идиомы; разбивка на два предложения устраняет тяжёлую именную конструкцию и делает стих понятным обычному читателю.
