base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/020.yaml
  text: And Eli would bless Elkanah and his wife and say[b][a], “May Yahweh give you offspring by this woman in place of the petition that was asked for Yahweh.” Then they would go to his place.
translation:
  language: ru
  text: 'Илий обычно благословлял Елкану и его жену и говорил: «Да даст тебе Яхве потомство от этой женщины взамен просьбы, с которой обратились к Яхве».[a][b] Затем они уходили домой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение допускает перевод: «взамен просьбы (или испрошенного), с которой обратились к Яхве». Здесь повторяется корень со значением «просить», проходящий через рассказ о рождении Самуила; выражение может отсылать к Самуилу, которого просили у Бога и посвятили Ему.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол «просил» стоит в форме мужского рода единственного числа. Его можно отнести к Елкане; по контексту его также связывают с просьбой Анны о ребёнке (см. 1 Самуила 1:20, 27–28). В основном тексте субъект не назван.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֵרַךְ
  choice: обычно благословлял
  rationale: В контексте ежегодных посещений форма описывает повторяющееся действие; русское «обычно благословлял» ясно передаёт эту итеративность.
- source_word: אֶת אֶלְקָנָה וְאֶת אִשְׁתּוֹ
  choice: Елкану и его жену
  rationale: Сохранено прямое обозначение исходного текста «его жена», без подстановки имени Анны.
- source_word: יָשֵׂם יְהוָה לְךָ
  choice: Да даст тебе Яхве
  rationale: Хотя שׂים буквально означает «положить, назначить», в формуле благословения с потомством естественно означает дарование.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: זֶרַע
  choice: детей
  rationale: Собирательное «потомство» возможно, но в благословении супругам современное русское «детей» звучит естественно и согласуется с последующим исполнением благословения.
- source_word: מִן הָאִשָּׁה הַזֹּאת
  choice: от этой женщины
  rationale: Близко передаёт источник потомства и сохраняет необычную форму обращения Илия.
- source_word: תַּחַת הַשְּׁאֵלָה
  choice: взамен того, о ком она просила
  rationale: Контекстуально речь идёт о Самуиле, испрошенном у Бога и отданном Ему; формулировка сохраняет значение замещения и отзвук корня שאל «просить».
- source_word: וְהָלְכוּ לִמְקֹמוֹ
  choice: После этого они возвращались домой
  rationale: Множественное число относится к Елкане и его жене; идиоматическое «домой» передаёт выражение «к его месту», а несовершенный вид — повторяемость.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя, присутствующее в еврейском тексте, не добавляя конфессионального толкования.
- issue: Субъект שָׁאַל в относительном предложении
  choice: она просила
  alternative: он просил; безличное «было испрошено»
  rationale: Форма глагола имеет мужской род единственного числа, однако повествовательный контекст недвусмысленно связывает просьбу о ребёнке с Анной. Несоответствие отмечено в сноске, а не скрыто.
- issue: Референт הַשְּׁאֵלָה
  choice: тот, о ком она просила
  alternative: просьба; испрошенное
  rationale: В контексте выражение указывает на Самуила, но еврейское слово сохраняет игру значений «просьба/испрошенное»; основной текст делает референт понятным, а сноска документирует лексику.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Итеративный характер сцены передан словами «обычно благословлял» и «возвращались». Формула благословения «Да даст» сохраняет торжественность, оставаясь понятной современному читателю.
