base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/032.yaml
  text: You will look on the distress of the dwelling in all the good that he does for Israel[a], and there will not be an old man in your house all the days.
translation:
  language: ru
  text: И увидишь бедствие обители при всём добре, которое будет оказано Израилю[a]; и во все дни в твоём доме не будет старца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «противника в обители», «бедствие в святилище» и т. п.; еврейское выражение трудно для толкования.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִבַּטְתָּ
  choice: и увидишь
  rationale: Hифиль глагола נבט означает «смотреть, видеть, взирать». Будущее «увидишь» естественно по-русски и не добавляет отсутствующего в тексте эмоционального оттенка.
- source_word: צַר
  choice: бедствие
  rationale: Слово может обозначать как «противника», так и «бедствие, тесноту». В данном контексте «бедствие» передаёт смысл суда, не вводя конкретного противника.
- source_word: מָעוֹן
  choice: Обитель
  rationale: Буквально «жилище, обитель»; в контексте священства подразумевается место Божьего пребывания. «Обитель» сохраняет лексическую широту и возможную отсылку к святилищу.
- source_word: בְּכֹל אֲשֶׁר יֵיטִיב אֶת־יִשְׂרָאֵל
  choice: среди всего того доброго, что Он будет делать Израилю
  rationale: Передаёт широкий смысл благодеяний Израилю. Местоимение «Он» указывает на естественно подразумеваемого Бога, а прописная буква отражает русскую издательскую норму.
- source_word: זָקֵן
  choice: старца
  rationale: Здесь речь идёт о человеке, достигшем преклонного возраста, а не о носителе должности старейшины.
- source_word: בְּבֵיתְךָ
  choice: в твоём доме
  rationale: «Дом» сохраняет обычную библейскую метафору семьи и рода Илия.
- source_word: כָּל הַיָּמִים
  choice: во все дни
  rationale: Формально передаёт еврейское выражение и сохраняет его торжественный ритм, не усиливая его словом «никогда».
theological_decisions:
- issue: Толкование трудного сочетания צַר מָעוֹן
  choice: бедствие у Обители
  alternative: противник в обители; бедствие в святилище; притеснение Обители
  rationale: Еврейское сочетание синтаксически и лексически неоднозначно. Основной текст сохраняет связь бедствия с Божьей Обителью, а сноска сообщает читателю о реальных вариантах, не закрепляя без достаточных оснований конкретного противника или единственный локативный смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к еврейскому, однако остаётся понятным; подлинная неясность первой части стиха сохранена и отмечена сноской.
