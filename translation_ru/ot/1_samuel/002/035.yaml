base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/035.yaml
  text: And I will raise up for myself a faithful priest[a], who will do according to what is in my heart and in my soul. And I will build for him a faithful house[b], and he will walk before my anointed all the days.
translation:
  language: ru
  text: «Я поставлю Себе верного священника, который будет действовать согласно тому, что у Меня в сердце и в душе. Я построю ему прочный дом[a], и он будет ходить пред Моим помазанником[b] во все дни».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «дом» может означать не здание, а прочный род или устойчивую священническую линию.
    reason: lexical_alternative
  - marker: b
    text: «Мой помазанник» можно также передать как «Мой Мессия» или, в данном контексте, «Мой царь».
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲקִימֹתִי
  choice: Я поставлю
  rationale: Глагол означает, что Бог воздвигнет или поставит человека на служение. «Поставлю» естественно передаёт назначение на священническое служение, не уточняя его способ.
- source_word: לִי
  choice: Себе
  rationale: Возвратная форма подчёркивает Божью инициативу и принадлежность священника Богу.
- source_word: כֹּהֵן נֶאֱמָן
  choice: верного священника
  rationale: «Священник» — прямое обозначение служения; «верный» сохраняет значения надёжности и преданности.
- source_word: כַּאֲשֶׁר בִּלְבָבִי וּבְנַפְשִׁי יַעֲשֶׂה
  choice: который будет делать то, что у Меня на сердце и в душе
  rationale: Естественная русская конструкция сохраняет образное упоминание Божьего сердца и души и выражает соответствие священника Божьей воле.
- source_word: וּבָנִיתִי לוֹ
  choice: Я построю ему
  rationale: Сохраняется буквальный образ строительства, который в сочетании со словом «дом» получает переносный смысл.
- source_word: בַּיִת נֶאֱמָן
  choice: верный дом
  rationale: Сохраняются метафора «дома» и повтор прилагательного נֶאֱמָן. Возможное значение прочного, продолжающегося рода пояснено в сноске.
- source_word: וְהִתְהַלֵּךְ לִפְנֵי
  choice: он будет ходить пред
  rationale: «Ходить пред» сохраняет древнееврейскую идиому постоянной жизни или служения в чьём-либо присутствии; форма «пред» поддерживает достойный библейский регистр.
- source_word: מְשִׁיחִי
  choice: Моим помазанником
  rationale: «Помазанник» передаёт основное значение слова, не сужая его заранее до позднейшего титульного употребления «Мессия».
- source_word: כָּל הַיָּמִים
  choice: во все дни
  rationale: Формально близкая передача, обозначающая постоянство или продолжительность служения.
theological_decisions:
- issue: Кого обозначает выражение מְשִׁיחִי («Мой помазанник»)
  choice: Моим помазанником
  alternative: Моим Мессией; Моим царём
  rationale: В ближайшем историческом контексте слово обозначает Божьего помазанного правителя, однако его формулировка допускает более широкое каноническое прочтение. Основной текст сохраняет это напряжение и не навязывает одно толкование.
- issue: Значение обещанного «дома»
  choice: верный дом
  alternative: прочный дом; непреходящий дом; прочный род
  rationale: «Дом» может обозначать не здание, а семью, потомство или служебную линию. Буквальный образ и повтор נֶאֱמָן сохранены в тексте, а вероятный династический смысл указан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены образы сердца, души, строительства дома и хождения перед помазанником; архаизация ограничена формой «пред», уместной в устойчивом сакральном обороте. Маркеры сносок поставлены при тех выражениях, которые они поясняют.
