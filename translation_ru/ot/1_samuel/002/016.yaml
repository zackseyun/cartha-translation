base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/016.yaml
  text: And the man would say to him[a], “Let them first burn the fat today, and then take for yourself whatever your soul desires.” But he would say to him, “No, you must give it now; and if not, I will take it by force.”
translation:
  language: ru
  text: 'И человек говорил ему: «Пусть сначала сожгут жир[a], а потом бери себе всё, что пожелает душа твоя». Но слуга отвечал ему: «Нет, отдай сейчас же, а иначе я возьму силой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Пусть непременно сожгут ныне жир». В еврейском тексте употреблена усилительная глагольная конструкция; слово, переданное здесь смыслом очередности, буквально может означать «ныне» или «сегодня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: тот человек
  rationale: Определённое существительное в единственном числе обозначает приносившего жертву; «тот человек» естественно выделяет его как участника уже описанной сцены.
- source_word: קַטֵּר יַקְטִירוּן
  choice: пусть сначала сожгут
  rationale: Сочетание абсолютного инфинитива с имперфектом усиливает глагол. «Пусть… сожгут» передаёт требование, а «сначала» ясно выражает подразумеваемую контекстом очередность действий.
- source_word: כַּיּוֹם
  choice: не передано отдельным словом
  rationale: Форма необычна и допускает буквальное «как сегодня/ныне». В данном требовании она, вероятно, усиливает непосредственность или относится к принятому в этот день порядку; отдельное «сегодня» по-русски могло бы создать неуместное противопоставление другим дням. Неопределённость отмечена в сноске.
- source_word: הַחֵלֶב
  choice: жир
  rationale: Речь о жировых частях жертвы, предназначенных для сожжения; краткое «жир» точно и понятно в контексте.
- source_word: וְקַח לְךָ
  choice: а потом бери себе
  rationale: Императив обращён к слуге. «Потом» передаёт последовательность, заложенную в протесте приносившего жертву.
- source_word: כַּאֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: сколько душе твоей угодно
  rationale: Естественная русская идиома сохраняет образ «души» и передаёт разрешение взять желаемое количество или долю.
- source_word: וְאָמַר לוֹ
  choice: Но слуга отвечал ему
  rationale: Форма описывает обычный ответ в повторяющейся сцене. Подлежащее восстановлено из контекста ради ясности; «но» передаёт резкое противодействие.
- source_word: כִּי עַתָּה תִתֵּן
  choice: Нет, отдай сейчас же
  rationale: כִּי здесь имеет противительно-утвердительную силу; добавленное «нет» естественно передаёт отказ, а «сейчас же» — настойчивость требования.
- source_word: לָקַחְתִּי בְחָזְקָה
  choice: я возьму силой
  rationale: Перфект в угрозе имеет уверенное будущее значение, а בְחָזְקָה обозначает принудительное изъятие.
theological_decisions:
- issue: Порядок жертвенного действия
  choice: Ясно показать, что жир должен быть сожжён прежде, чем слуга возьмёт мясо.
  alternative: Передать еврейскую конструкцию буквально, не обозначая последовательность словом «сначала».
  rationale: Протест человека основан на нарушении порядка жертвоприношения. Перевод проясняет последовательность, но не добавляет в основной текст богословского объяснения.
- issue: Кто отвечает человеку
  choice: Назвать отвечающего «слугой» по ближайшему контексту.
  alternative: Оставить только местоимение «он», сохранив формальную неявность подлежащего.
  rationale: В самом стихе подлежащее не названо, однако контекст 1 Цар. 2:15 однозначно указывает на слугу священника; явное существительное предотвращает русскую местоименную двусмысленность, не меняя смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Формула «сколько душе твоей угодно» сохраняет образность оригинала, оставаясь естественной; угроза передана кратко и резко.
