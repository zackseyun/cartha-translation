base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/013.yaml
  text: 'The custom of the priests with the people was this: whenever any man was sacrificing a sacrifice[a], the priest’s servant would come while the meat was boiling, with the three-pronged fork in his hand.'
translation:
  language: ru
  text: 'У священников был такой обычай в отношениях с народом: всякий раз, когда кто-либо приносил жертву, слуга священника приходил, когда мясо варилось, с трёхзубой вилкой[a] в руке.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «трёхзубый крюк для мяса»; еврейское слово обозначает вилкообразное орудие, которым доставали мясо из котла.'
    reason: Лексическая альтернатива поясняет назначение редкого культово-бытового орудия.
lexical_decisions:
- source_word: וּמִשְׁפַּט
  choice: Обычай … был таков
  rationale: מִשְׁפָּט может обозначать закон, право, установленный порядок или обычай. Здесь вводится регулярно повторявшаяся практика священников, поэтому «обычай» естественно передаёт смысл, не превращая описание в формальное постановление.
- source_word: הַכֹּהֲנִים אֶת־הָעָם
  choice: священников по отношению к народу
  rationale: Оборот описывает то, как священники поступали с народом; выбранная формулировка сохраняет направленность отношения и не добавляет оценки, прямо не выраженной в словах стиха.
- source_word: כָּל־אִישׁ זֹבֵחַ זֶבַח
  choice: всякий раз, когда кто-либо приносил жертву
  rationale: Конструкция описывает любой отдельный случай жертвоприношения. Русское «приносил жертву» естественно передаёт однокоренную глагольно-именную конструкцию זֹבֵחַ זֶבַח без тяжеловесного повтора.
- source_word: נַעַר הַכֹּהֵן
  choice: слуга священника
  rationale: נַעַר может означать юношу, слугу или помощника. В данном контексте важна служебная роль при священнике, а возраст не уточняется.
- source_word: כְּבַשֵּׁל הַבָּשָׂר
  choice: пока варилось мясо
  rationale: Предлог כ с инфинитивом задаёт одновременность действия; «варилось» уместно для приготовления жертвенного мяса в сосуде и сохраняет незавершённый процесс.
- source_word: הַמַּזְלֵג שְׁלֹשׁ הַשִּׁנַּיִם
  choice: трёхзубую вилку
  rationale: Буквально орудие имеет «три зуба». «Трёхзубая вилка» — ясное современное обозначение вилкообразного приспособления для извлечения мяса.
- source_word: בְּיָדוֹ
  choice: держа в руке
  rationale: 'Русский деепричастный оборот естественно передаёт сопутствующее обстоятельство: слуга приходил с орудием в руке.'
