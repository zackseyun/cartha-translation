  text: 'И сказал он им: «Почему вы так поступаете? Ведь я слышу от всех этих людей о ваших злых делах[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «я слышу от всех этих людей ваши злые слова/дела»; еврейское слово может также означать «вещи, обстоятельства». По контексту речь идёт о сообщениях, доходящих до Илия, о порочном поведении его сыновей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: И сказал он им
  rationale: Сохраняет обычное повествовательное продвижение wayyiqtol и ясно передаёт обращение Илия к сыновьям.
- source_word: לָמָּה תַעֲשׂוּן כַּדְּבָרִים הָאֵלֶּה
  choice: Почему вы так поступаете?
  rationale: Имперфект указывает на продолжающееся или повторяющееся поведение; «так поступаете» естественно передаёт смысл буквально более широкого «делаете такие вещи».
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: я слышу
  rationale: Причастие с самостоятельным местоимением выражает актуальное, продолжающееся получение известий; русское настоящее время передаёт это естественно.
- source_word: אֶת דִּבְרֵיכֶם רָעִים
  choice: о ваших злых делах
  rationale: דְּבָרִים может означать слова, дела или обстоятельства; в контексте речь идёт о дурном поведении сыновей, о котором сообщают люди.
- source_word: מֵאֵת כָּל הָעָם אֵלֶּה
  choice: от всего этого народа
  rationale: Передаёт источник сообщения, собирательное הָעָם и указательное אֵלֶּה без искусственного превращения народа во множество отдельных лиц.
