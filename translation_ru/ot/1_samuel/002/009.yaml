  yaml_path: translation/ot/1_samuel/002/009.yaml
  text: He guards the feet of his faithful ones[a], but the wicked are silenced in darkness[c][b], for not by strength does a man prevail.
translation:
  language: ru
  text: Он хранит стопы Своих верных[a], а нечестивые умолкают во тьме[b], ибо не силой человек одерживает верх[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская текстовая традиция допускает также чтение в единственном числе: «верного Своего». Множественное число принято ввиду поэтического параллелизма и вероятного собирательного смысла.'
    reason: textual_variant
  - marker: b
    text: 'Или: «замирают»; еврейский глагол может обозначать безмолвие или прекращение.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово стоит в мужском роде и единственном числе, но употреблено здесь в общем значении.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵי
  choice: стопы
  rationale: Сохраняет конкретный поэтический образ еврейского текста; «шаги» возможно как идиоматический вариант, но менее буквально.
- source_word: חסידו
  choice: верных Своих
  rationale: Передаёт принятую здесь коллективную трактовку и идею преданности Богу, не привнося позднейших оттенков слова «святые».
- source_word: יִשְׁמֹר
  choice: хранит
  rationale: Естественно передаёт защитное значение глагола שמר и соответствует возвышенному поэтическому регистру.
- source_word: וּרְשָׁעִים
  choice: а нечестивые
  rationale: Союз «а» ясно выражает противопоставление верных и нечестивых.
- source_word: בַּחֹשֶׁךְ
  choice: во тьме
  rationale: Сохраняет образ суда, бессилия и безвестности.
- source_word: יִדָּמּוּ
  choice: умолкают
  rationale: Передаёт основное значение пассивного состояния молчания или прекращения действия, не сужая его до гибели.
- source_word: כִּי
  choice: ибо
  rationale: Вводит основание предшествующего утверждения и уместно в поэтической речи.
- source_word: לֹא בְכֹחַ
  choice: не силой
  rationale: Прямо и кратко передаёт отрицание силы как основания успеха.
- source_word: יִגְבַּר
  choice: одерживает верх
  rationale: Передаёт не простое обладание силой, а достижение превосходства или победы.
- source_word: אִישׁ
  choice: человек
  rationale: В русском языке естественно передаёт родовое значение еврейского мужского единственного числа без ограничения смысла только мужчинами.
theological_decisions:
- issue: Число и смысл חסידו
  choice: 'коллективное множественное: «верных Своих»'
  alternative: 'единственное: «верного Своего»'
  rationale: Масоретская текстовая традиция допускает различие в числе; множественное понимание согласуется с параллельным «нечестивые» и вероятным общим смыслом песни, однако вариант отмечен в сноске.
- issue: Смысл יִדָּמּוּ
  choice: «умолкают»
  alternative: «замирают» / «будут истреблены»
  rationale: Глагол допускает оттенки молчания и прекращения действия. Перевод сохраняет образ принудительного безмолвия, не утверждая однозначно физическую гибель.
- issue: Родовое значение אִישׁ
  choice: «человек»
  alternative: «мужчина» / «никто»
  rationale: Здесь мужское единственное число имеет обобщающий, сентенционный смысл; русское «человек» точно и естественно сохраняет его.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Инверсия «верных Своих» и слово «ибо» поддерживают возвышенный регистр, оставаясь понятными; конкретный образ «стоп» сохранён.
