reference: 1 Samuel 2:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/בָחֹ֣ר אֹ֠ת/וֹ מִ/כָּל שִׁבְטֵ֨י יִשְׂרָאֵ֥ל לִ/י֙ לְ/כֹהֵ֔ן לַ/עֲל֣וֹת עַֽל מִזְבְּחִ֗/י לְ/הַקְטִ֥יר קְטֹ֛רֶת לָ/שֵׂ֥את אֵפ֖וֹד לְ/פָנָ֑/י וָֽ/אֶתְּנָ/ה֙ לְ/בֵ֣ית אָבִ֔י/ךָ אֶת כָּל אִשֵּׁ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/028.yaml
  text: And did I not choose him from all the tribes of Israel to be my priest[a], to go up to my altar, to burn incense, to wear an ephod before me? And I gave to your father's house all the food offerings of the sons of Israel.
translation:
  language: ru
  text: Разве Я не избрал его из всех колен Израиля Себе в священники, чтобы он восходил к Моему жертвеннику, воскурял благовония и носил эфод предо Мной? И Я отдал дому твоего отца все огненные приношения[a] сынов Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все приношения сынов Израиля, совершаемые посредством огня».'
    reason: Поясняет специальный жертвенный термин אִשֵּׁי, сохраняя его связь с огнём и не создавая впечатления, будто каждое приношение целиком сжигалось.
lexical_decisions:
- source_word: וּבָחֹר אֹתוֹ
  choice: Разве Я не избрал его
  rationale: Форма продолжает риторический вопрос из предшествующего контекста и выражает подчёркнутое утверждение; русское «разве… не» естественно передаёт эту силу.
- source_word: מִכָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: из всех колен Израиля
  rationale: Сохраняется значение избрания из числа всех израильских колен.
- source_word: לִי לְכֹהֵן
  choice: Себе в священники
  rationale: Переданы и принадлежность Богу, и назначение на священническое служение.
- source_word: לַעֲלוֹת עַל מִזְבְּחִי
  choice: чтобы он восходил к Моему жертвеннику
  rationale: Сохраняется конкретный образ восхождения к жертвеннику без сведения выражения только к принесению жертвы.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: воскурял благовония
  rationale: Устойчивое и понятное русское обозначение культового действия; «благовония» естественнее здесь, чем буквальное повторение корня.
- source_word: לָשֵׂאת אֵפוֹד לְפָנַי
  choice: носил эфод предо Мной
  rationale: В священническом контексте נשא обозначает ношение культового одеяния; «эфод» сохраняется как специальный предмет без неточного описательного эквивалента.
- source_word: לְבֵית אָבִיךָ
  choice: дому твоего отца
  rationale: Формально и понятно передаёт родовую, священническую линию Илия.
- source_word: אֶת כָּל אִשֵּׁי בְּנֵי יִשְׂרָאֵל
  choice: все огненные приношения сынов Израиля
  rationale: אִשֵּׁי — широкое обозначение жертвенных приношений, предаваемых огню; «огненные приношения» не сужает смысл до жертв всесожжения.
theological_decisions:
- issue: Передача жертвенного термина אִשֵּׁי
  choice: огненные приношения
  alternative: приношения, сжигаемые на огне
  rationale: Основной вариант краток и сохраняет связь обряда с огнём; сноска разъясняет его буквальный ритуальный смысл, не ограничивая термин одним видом жертвы.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне / народ Израиля
  rationale: Сохранена традиционная и формально точная родовая формула исходного текста без нейтрализации её мужского множественного числа.
- issue: Значение לָשֵׂאת אֵפוֹד
  choice: носить эфод
  alternative: нести эфод
  rationale: Контекст перечисляет священнические обязанности, поэтому речь естественно понимается как ношение эфода; при этом само название культового предмета не истолковывается дополнительно.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной культовой лексикой. Местоимения, относящиеся к Богу, написаны с прописной буквы. «Предо Мной» выбрано как умеренно возвышенная и естественная для библейской речи форма; синтаксис риторического вопроса сохранён.
