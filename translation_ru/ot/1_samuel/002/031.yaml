base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/031.yaml
  text: Look[a], days are coming when I will cut off your strength and the strength of your father's house, so that there will not be an old man in your house.
translation:
  language: ru
  text: Вот, наступают дни, когда Я отсеку твою силу[a] и силу[a] дома твоего отца, так что в твоём доме не будет старца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твою руку и руку дома твоего отца». Здесь «рука» — образ силы или могущества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательную силу и торжественный характер пророческого возвещения, оставаясь естественным для современного литературного русского языка.
- source_word: יָמִים בָּאִים
  choice: наступают дни
  rationale: Устойчиво и естественно передаёт пророческую формулу о грядущем суде.
- source_word: וְגָדַעְתִּי
  choice: Я отсеку
  rationale: Передаёт решительное отсечение или устранение; форма будущего времени обусловлена контекстом грядущего суда.
- source_word: זְרֹעֲךָ ... זְרֹעַ בֵּית אָבִיךָ
  choice: твою силу и силу дома твоего отца
  rationale: Буквально «руку»; здесь рука служит образом силы, власти и жизненной крепости рода. Смысловой перевод понятен современному читателю, а буквальный образ отмечен в сноске.
- source_word: בֵּית אָבִיךָ
  choice: дома твоего отца
  rationale: Сохраняет библейское родовое выражение, обозначающее отцовский дом и семейную линию.
- source_word: מִהְיוֹת זָקֵן בְּבֵיתֶךָ
  choice: так что в твоём доме не будет старца
  rationale: 'Передаёт результат отсечения силы: никто из этого дома не достигнет старости.'
- source_word: זָקֵן
  choice: старца
  rationale: В данном контексте обозначает пожилого человека, а не носителя должности; «старец» естественно сочетается с торжественным регистром стиха.
theological_decisions:
- issue: Метафорическое значение слова זְרוֹעַ в пророчестве о суде
  choice: Передать как «сила» в обоих случаях
  alternative: Сохранить буквальное «рука»
  rationale: В еврейском языке «рука» часто обозначает силу или могущество. Здесь последующая фраза об отсутствии старца указывает также на пресечение жизненной крепости и продолжительности рода. Перевод «сила» раскрывает метафорический смысл, не сужая его до одной конкретной доктринальной трактовки.
- issue: Значение זָקֵן
  choice: Пожилой человек — «старец»
  alternative: Должностное значение — «старейшина»
  rationale: Контекст последующих угроз дому Илия касается ранней смерти его потомков, поэтому речь идёт о возрасте, а не об общественной или религиозной должности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. «Вот» и «дом твоего отца» сохраняют библейский регистр без архаизации; местоимение «Я» написано с прописной буквы как прямая речь Бога.
