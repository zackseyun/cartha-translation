base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/021.yaml
  text: For Yahweh visited Hannah[a], and she conceived and bore three sons and two daughters[b]. And the boy Samuel grew before Yahweh.
translation:
  language: ru
  text: 'Ибо Яхве позаботился об Анне[a]: она зачала и родила трёх сыновей и двух дочерей. А мальчик Самуил рос в присутствии Яхве[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обратил благосклонное внимание на Анну». Еврейский глагол может обозначать заботливое, благосклонное вмешательство ради человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с Яхве». По контексту, вероятно, имеется в виду, что Самуил рос в присутствии Яхве при святилище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Сохраняет пояснительно-причинную связь с предшествующим повествованием и соответствует достойному повествовательному регистру.
- source_word: פָקַד
  choice: позаботился
  rationale: В данном контексте глагол обозначает благосклонное вмешательство Яхве, результатом которого стало зачатие. Русское «позаботился» естественно передаёт этот смысл, не сводя действие лишь к тому, что Бог заметил Анну.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: וַתַּהַר וַתֵּלֶד
  choice: она зачала и родила
  rationale: Прямое и естественное соответствие последовательности еврейских глаголов.
- source_word: שְׁלֹשָׁה בָנִים וּשְׁתֵּי בָנוֹת
  choice: трёх сыновей и двух дочерей
  rationale: Точная передача чисел и родственных обозначений с нормативным русским управлением.
- source_word: הַנַּעַר שְׁמוּאֵל
  choice: мальчик Самуил
  rationale: Современное и ясное обозначение ребёнка; сохраняется еврейская конструкция с приложением.
- source_word: וַיִּגְדַּל
  choice: рос
  rationale: В контексте речь идёт о взрослении Самуила; простой несовершенный вид естественно передаёт продолжающийся процесс.
- source_word: עִם יְהוָה
  choice: при Яхве
  rationale: Буквально предлог означает «с», однако здесь речь, вероятнее всего, о том, что Самуил рос в присутствии Яхве при святилище. «При Яхве» сохраняет оттенок близости и присутствия, не подменяя исходный предлог выражением «пред Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл благосклонного действия פָקַד по отношению к Анне
  choice: позаботился об Анне
  alternative: посетил Анну
  rationale: Выбрано значение благосклонного вмешательства, ясное из последующего зачатия. Буквализм «посетил» в современном русском может быть понят как обычный визит или получить нежелательный двусмысленный оттенок.
- issue: Смысл עִם יְהוָה
  choice: рос при Яхве
  alternative: рос с Яхве; рос пред Яхве
  rationale: Фраза описывает взросление Самуила в Божьем присутствии, вероятно в святилище. Формулировка не превращает её в утверждение о мистическом единении и одновременно не скрывает необычность буквального «с Яхве».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. «Ибо» поддерживает связность и достоинство повествования; остальная лексика остаётся доступной обычному читателю. Все примечания отмечены в основном тексте.
