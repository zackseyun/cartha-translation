  source_fidelity: 'В черновике верно переданы ежегодная повторяемость, изготовление одежды для Самуила и ежегодная жертва. Однако дважды утрачивается существенный оттенок עלה («подниматься/восходить»): мать не просто «приходила», а поднималась к месту святилища; одежду она также приносила «туда, наверх» к нему. В исправленном тексте этот оттенок сохранён естественным русским глаголом «поднималась».'
  naturalness: «Маленькая верхняя одежда» понятна, но звучит как общее описание вещи, а не как название предмета одежды. «Небольшое одеяние» естественнее в сдержанном библейском повествовательном регистре и не сужает значение מְעִיל до конкретного типа одежды.
  terminology: «Одеяние» передаёт מְעִיל без неоправданной точности; в сноске сохранены варианты «плащ» и «мантия». «Принести ежегодную жертву» — естественное и точное соответствие לִזְבֹּחַ ... זֶבַח הַיָּמִים. Сноска к «каждый год» поясняет еврейскую идиому, а сноска к «ежегодную жертву» — буквальную форму последнего словосочетания.
