  text: And his mother would make for him a small robe and bring it up to him from year to year[b][a], when she went up with her husband to offer the yearly sacrifice.
translation:
  language: ru
  text: Его мать каждый год шила для него небольшое одеяние[a] и приносила его ему, когда поднималась вместе с мужем, чтобы принести ежегодную жертву[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из дней в дни» — еврейская идиома со значением «из года в год». Или: «небольшой плащ»; «небольшая мантия». Еврейское слово обозначает верхнее одеяние.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «жертву дней», то есть жертву, приносившуюся ежегодно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעִיל קָטֹן
  choice: маленькую верхнюю одежду
  rationale: מְעִיל обозначает верхнюю одежду, подобную одеянию или мантии; сочетание «маленькая верхняя одежда» понятно современному читателю и передаёт размер, соответствующий ребёнку, не навязывая узкой идентификации предмета.
- source_word: תַּעֲשֶׂה
  choice: шила
  rationale: Имперфект в повествовательном контексте выражает повторявшееся в прошлом действие. Для изготовления одежды русское «шила» естественнее общего «делала».
- source_word: וְהַעַלְתָה לּוֹ
  choice: и приносила её ему
  rationale: Глагол עלה буквально указывает на движение вверх, в данном контексте — к святилищу. По-русски «приносила» естественно передаёт доставку одежды; оттенок восхождения отражён далее глаголом «приходила» лишь неявно, поэтому буквальная возможность отмечена в решении, но не вынесена в сноску как малосущественная.
- source_word: מִיָּמִים יָמִימָה
  choice: каждый год
  rationale: Буквально «из дней в дни» — устойчивое выражение ежегодной периодичности. «Каждый год» ясно и естественно передаёт его смысл.
- source_word: בַּעֲלוֹתָהּ אֶת אִישָׁהּ
  choice: когда приходила вместе с мужем
  rationale: Конструкция обозначает время её восхождения с мужем к святилищу. «Приходила вместе с мужем» звучит естественно и сохраняет совместность действия.
- source_word: לִזְבֹּחַ אֶת זֶבַח הַיָּמִים
  choice: принести ежегодную жертву
  rationale: Фраза относится к регулярно совершаемой ежегодной жертве. Русское сочетание «принести жертву» является естественным культовым выражением.
