base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/011.yaml
  text: Then Elkanah went to Ramah[a], to his house; and the boy was ministering to Yahweh before Eli the priest.
translation:
  language: ru
  text: И пошёл Елкана в Раму, к себе домой, а мальчик служил Яхве перед священником Илием.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в присутствии священника Илия». Буквально: «перед лицом священника Илия».'
    reason: Сохраняет буквальный образ еврейского выражения אֶת פְּנֵי и его значение присутствия, не делая вывод о строго определённом характере подчинения Илия.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Глагол הלך в данной повествовательной форме обозначает следующее действие — «пошёл»; значение «вернулся» подсказывается контекстом, но не выражено самим глаголом.
- source_word: הָרָמָתָה
  choice: в Раму
  rationale: Направительный суффикс -ה при названии места указывает на движение к Раме; по-русски естественно «в Раму».
- source_word: עַל בֵּיתוֹ
  choice: к себе домой
  rationale: В этом обороте выражено возвращение к своему дому; «к себе домой» естественно передаёт значение и не создаёт ложного буквального образа «на дом».
- source_word: וְהַנַּעַר
  choice: а мальчик
  rationale: נַעַר может обозначать ребёнка или юношу; на данном этапе повествования Самуил ещё мальчик. Союз передан как «а», естественно отмечающее смену участника и места действия.
- source_word: הָיָה מְשָׁרֵת
  choice: служил
  rationale: Конструкция היה с причастием обозначает продолжительное состояние или действие. Русский несовершенный вид «служил» естественно сохраняет эту длительность.
- source_word: אֶת יְהוָה
  choice: Яхве
  rationale: При שׁרת показатель прямого дополнения вводит того, кому служат. Имя יהוה передано как «Яхве», то есть как личное имя, а не заменено титулом.
- source_word: אֶת פְּנֵי עֵלִי הַכֹּהֵן
  choice: при священнике Илии
  rationale: Оборот «перед лицом Илия» указывает на присутствие или надзор Илия. «При священнике Илии» звучит естественно и сохраняет пространственно-реляционный смысл, не утверждая более строго определённой иерархии.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Характер служения Самуила
  choice: служил Яхве
  alternative: прислуживал Яхве
  rationale: «Служил» передаёт культовое служение без неуместного оттенка низкой бытовой прислуги и не уточняет функции сверх сказанного в тексте.
- issue: Отношение служения Самуила к Илию
  choice: при священнике Илии
  alternative: перед священником Илием
  rationale: Еврейское выражение допускает буквальное пространственное понимание «перед лицом» и более широкое значение служения в присутствии или под надзором Илия. Основной текст использует естественный русский оборот, а сноска сохраняет буквальную альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формы «Елкана», «Рама», «Илий» употреблены в привычной русской библейской традиции; синтаксис упрощён без утраты противопоставления между уходом Елканы и продолжающимся служением мальчика.
