lexical_decisions:
- source_word: וְהִכָּה
  choice: и вонзал её
  rationale: Хифиль глагола נכה здесь описывает многократное погружение орудия в сосуд; «вонзал» естественно передаёт энергичное повторяющееся действие в контексте обычая.
- source_word: בַכִּיּוֹר א֣וֹ בַדּוּד א֤וֹ בַקַּלַּחַת֙ א֣וֹ בַפָּרוּר
  choice: в чан, котёл, кастрюлю или горшок
  rationale: Еврейский текст перечисляет четыре вида ёмкостей для варки, точные различия между которыми не вполне ясны. Русские слова сохраняют разнообразие сосудов, не приписывая им чрезмерно точной формы.
- source_word: כֹּל אֲשֶׁר יַעֲלֶה הַמַּזְלֵג
  choice: Всё, что поднимала вилка
  rationale: Передаёт образ мяса, которое орудие подхватывало и извлекало из сосуда, и близко следует значению עלה.
- source_word: הַמַּזְלֵג
  choice: вилка
  rationale: Современное и понятное обозначение орудия; из предыдущего стиха ясно, что оно имело три зубца. Более специальное «крюк для мяса» возможно, но менее точно передаёт форму.
- source_word: יִקַּח הַכֹּהֵן בּוֹ
  choice: священник забирал с её помощью
  rationale: 'Предлог с местоименным суффиксом естественно понимается инструментально: священник забирал мясо посредством вилки.'
- source_word: כָּכָה יַעֲשׂוּ
  choice: Так они поступали
  rationale: Сохраняет множественное число еврейского глагола и передаёт повторяющуюся практику.
- source_word: לְכָל יִשְׂרָאֵל הַבָּאִים שָׁם בְּשִׁלֹה
  choice: со всеми израильтянами, приходившими туда, в Силом
  rationale: Коллективное «весь Израиль» естественно передано как совокупность приходивших к святилищу израильтян; «туда, в Силом» сохраняет оба обстоятельственных элемента.
theological_decisions:
- issue: Переход от единственного числа к множественному в заключительном обобщении
  choice: Сохранить единственное число в словах о священнике и множественное в «они поступали».
  alternative: 'Согласовать всё в единственном числе: «так поступал священник».'
  rationale: Еврейский текст намеренно переходит от יִקַּח הַכֹּהֵן, где назван один священник как участник типичного действия, к множественному יַעֲשׂוּ, обобщающему практику священнического окружения. Перевод не устраняет этот повествовательный сдвиг.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-повествовательным строем. «Силом» выбран как традиционное русское библейское название Шило. Начальное строчное «и» сохраняет синтаксическую связь стиха с предшествующим контекстом.
