base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/029.yaml
  text: Why do you scorn my sacrifice and my offering[a], which I commanded for the dwelling, and honor your sons above me, fattening yourselves from the first of every offering of Israel[c][b], my people?
translation:
  language: ru
  text: Почему вы попираете Мою жертву и Моё приношение[a], которые Я повелел приносить в жилище[b], и почему ты почитаешь своих сыновей больше Меня, так что вы откармливаетесь первыми, то есть отборными, частями всех приношений Израиля, Моего народа?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лягаете»; то есть относитесь с презрением, попираете.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст краток и допускает также перевод: «которые Я повелел для жилища». Под жилищем, вероятно, подразумевается святилище.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִבְעֲטוּ
  choice: попираете
  rationale: Глагол буквально вызывает образ презрительного удара ногой и здесь означает пренебрежение святыней. «Попираете» естественно передаёт и образ, и обвинительную силу.
- source_word: זִבְחִי וּבְמִנְחָתִי
  choice: Мою жертву и Моё приношение
  rationale: Сохраняется различие между жертвенным закланием и приношением; второе слово в данном контексте не следует без необходимости сужать до хлебного приношения.
- source_word: אֲשֶׁר צִוִּיתִי מָעוֹן
  choice: которые Я повелел приносить в жилище
  rationale: Краткая и трудная еврейская конструкция, вероятнее всего, связывает повеление о жертвах со святилищем как местом Божьего обитания. Добавленное «приносить» делает подразумеваемую связь ясной, не устраняя текстовую неопределённость, отмеченную в сноске.
- source_word: וַתְּכַבֵּד אֶת בָּנֶיךָ מִמֶּנִּי
  choice: Почему ты почитаешь своих сыновей больше Меня
  rationale: Передан переход от множественного числа в первом вопросе к единственному, обращённому лично к Илию, а сравнительное מִמֶּנִּי выражено естественным русским оборотом.
- source_word: לְהַבְרִיאֲכֶם
  choice: откармливая себя
  rationale: Сохраняется конкретный и резкий образ обогащения и насыщения за счёт присвоенных жертвенных долей. Множественный суффикс создаёт грамматическую напряжённость после обращения к Илию; русское возвратное «себя» позволяет не сглаживать её полностью.
- source_word: מֵרֵאשִׁית
  choice: лучшими частями
  rationale: В жертвенном контексте слово обозначает первые и тем самым отборные доли. «Лучшими частями» ясно передаёт смысл; более буквальный вариант отмечен в сноске.
- source_word: כָּל מִנְחַת יִשְׂרָאֵל לְעַמִּי
  choice: всех приношений Моего народа Израиля
  rationale: מִנְחָה понято широко как приношение, а Израиль и «Мой народ» объединены в естественную русскую именную группу без изменения их соотнесённости.
theological_decisions:
- issue: Переход от множественного обращения к единственному
  choice: Первый вопрос обращён к группе («вы»), второй непосредственно к Илию («ты»).
  alternative: Считать всё высказывание обращённым только к Илию либо ко всему его дому без различения.
  rationale: Еврейский текст явно переходит от תִבְעֲטוּ во множественном числе к וַתְּכַבֵּד и בָּנֶיךָ в единственном; перевод сохраняет этот смысловой фокус.
- issue: Смысл обвинения в откармливании
  choice: Илий чтит сыновей выше Бога и сам участвует в выгоде от злоупотребления приношениями.
  alternative: Отнести насыщение исключительно к сыновьям Илия либо передать образ нейтрально как обычное питание.
  rationale: Форма לְהַבְרִיאֲכֶם имеет множественный объект и в контексте несёт обвинительный смысл; перевод не ограничивает участие одним лицом и сохраняет резкость образа.
- issue: Значение מָעוֹן
  choice: Понимать как жилище, то есть святилище, где совершается служение.
  alternative: Понимать конструкцию как «которые Я повелел для жилища» или связывать слово с иной синтаксической частью стиха.
  rationale: Контекст жертв и священнического служения поддерживает значение святилища, однако синтаксическая краткость оригинала требует сноски с альтернативой.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Заглавные местоимения при обращении Бога к Себе использованы согласно распространённой русской библейской традиции. Сохранён переход от «вы» к «ты» и резкий телесный образ обвинения.
