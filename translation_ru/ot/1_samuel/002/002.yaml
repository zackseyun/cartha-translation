id: 1SA.2.2
reference: 1 Samuel 2:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֵין קָד֥וֹשׁ כַּ/יהוָ֖ה כִּ֣י אֵ֣ין בִּלְתֶּ֑/ךָ וְ/אֵ֥ין צ֖וּר כֵּ/אלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/002.yaml
  text: There is none holy like Yahweh[a], for there is none besides you, and there is no rock like our God.
translation:
  language: ru
  text: 'Нет святого, подобного Яхве[a],

    ибо нет никого, кроме тебя;

    нет скалы, подобной нашему Богу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское יהוה — личное имя Бога, переданное здесь как «Яхве».
    reason: Пояснение передачи божественного имени.
lexical_decisions:
- source_word: אֵין
  choice: нет / нет никого
  rationale: Экзистенциальная конструкция естественно передаёт отрицание существования; её повтор сохраняет подчёркнутый параллелизм еврейского стиха.
- source_word: קָדוֹשׁ
  choice: святого
  rationale: «Святой» — прямой и содержательно ёмкий эквивалент, выражающий Божью отделённость и несравненность.
- source_word: כַּיהוָה
  choice: подобного Яхве
  rationale: Предлог כְּ выражает сравнение, а личное имя יהוה передано как «Яхве».
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание предыдущего утверждения; «ибо» сохраняет объяснительную связь и возвышенный поэтический строй.
- source_word: בִּלְתֶּךָ
  choice: кроме тебя
  rationale: Передаёт исключение и сохраняет прямое обращение второго лица, не устраняя переход от упоминания Бога к обращению к Нему.
- source_word: צוּר
  choice: скала
  rationale: Сохраняет конкретную древнееврейскую метафору прочности, устойчивости и защиты, не сужая её до одного значения вроде «убежище».
- source_word: כֵּאלֹהֵינוּ
  choice: подобной нашему Богу
  rationale: כְּ имеет сравнительное значение; אֱלֹהִים с суффиксом здесь обозначает единого Бога Израиля и потому передано формой единственного числа.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и соответствует наиболее принятой научной реконструкции произношения.
- issue: Переход от третьего лица ко второму
  choice: «подобного Яхве… кроме тебя»
  alternative: 'Согласовать всё в третьем лице: «кроме Него»'
  rationale: Резкий переход присутствует в еврейском тексте и отражает живое молитвенное обращение; его не следует сглаживать.
- issue: Метафора צוּר
  choice: скала
  alternative: твердыня; убежище
  rationale: Буквальный образ намеренно сохранён, чтобы не сводить его богословскую ёмкость только к защите или обороне.
translation_notes:
  register: Современный литературный русский с кратким, торжественным поэтическим ритмом. Строчные формы местоимений «тебя» соответствуют современной норме и не вводят в исходный текст дополнительного типографического разграничения.
