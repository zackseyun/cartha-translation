id: 1SA.2.8
reference: 1 Samuel 2:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: מֵקִ֨ים מֵ/עָפָ֜ר דָּ֗ל מֵֽ/אַשְׁפֹּת֙ יָרִ֣ים אֶבְי֔וֹן לְ/הוֹשִׁיב֙ עִם נְדִיבִ֔ים וְ/כִסֵּ֥א כָב֖וֹד יַנְחִלֵ֑/ם כִּ֤י לַֽ/יהוָה֙ מְצֻ֣קֵי אֶ֔רֶץ וַ/יָּ֥שֶׁת עֲלֵי/הֶ֖ם תֵּבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/008.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap, to seat them with nobles and make them inherit a seat of honor. For the pillars of the earth belong to Yahweh[b], and on them he has set the world.
translation:
  language: ru
  text: 'Он поднимает бедного из праха,

    из кучи отбросов возвышает нуждающегося,

    чтобы посадить их рядом со знатными

    и дать им в наследие почётное место[a].

    Ведь опоры земли принадлежат Яхве[b],

    и на них Он утвердил мир.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «престол славы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «основания земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים מֵעָפָר דָּל
  choice: поднимает бедного из праха
  rationale: Причастие породы hифиль от קום выражает действие возвышения человека из униженного положения; «прах» сохраняет конкретный поэтический образ.
- source_word: מֵאַשְׁפֹּת יָרִים אֶבְיוֹן
  choice: из кучи отбросов возвышает нуждающегося
  rationale: אַשְׁפֹּת обозначает место, куда сваливают отходы; «куча отбросов» понятно современному читателю и передаёт образ крайнего унижения. «Нуждающийся» отличает אֶבְיוֹן от параллельного דַּל.
- source_word: לְהוֹשִׁיב עִם נְדִיבִים
  choice: чтобы посадить их рядом со знатными
  rationale: Инфинитив указывает на цель или результат; נְדִיבִים здесь означает людей высокого общественного положения.
- source_word: וְכִסֵּא כָבוֹד יַנְחִלֵם
  choice: и дать им в наследие почётное место
  rationale: יַנְחִלֵם сохраняет мотив получения в наследие. כִּסֵּא может означать как престол, так и место для сидения; в контексте общего возвышения бедных естественное «почётное место» не навязывает им царский статус.
- source_word: מְצֻקֵי אֶרֶץ
  choice: опоры земли
  rationale: Редкое слово обозначает несущие элементы или основания. «Опоры» сохраняет древний поэтический образ и не сужает его до одного конкретного архитектурного предмета.
- source_word: וַיָּשֶׁת עֲלֵיהֶם תֵּבֵל
  choice: и на них Он утвердил мир
  rationale: Глагол שׁית означает помещать или устанавливать; «утвердил» естественно передаёт основание мира на названных опорах. תֵּבֵל — обитаемый, устроенный мир.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передача личного имени יהוה как «Яхве» делает явное присутствие имени в еврейском тексте прозрачным для русского читателя.
theological_decisions:
- issue: Космологический образ מְצֻקֵי אֶרֶץ
  choice: Сохранить образ «опор земли».
  alternative: «основания земли» или более отвлечённое описание Божьей власти над творением
  rationale: Песнь использует древнюю поэтическую картину устройства мира как основание утверждения о власти Яхве. Перевод сохраняет образ, не превращая поэзию в научное утверждение и не устраняя её напряжение.
- issue: Значение כִּסֵּא כָבוֹד
  choice: «почётное место» в основном тексте
  alternative: «престол славы»
  rationale: Сочетание допускает как буквальное царское, так и более широкое статусное понимание. Контекст говорит о возвышении бедных вообще, поэтому основная формулировка остаётся естественной, а более буквальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Параллелизм строк и образы социального переворота сохранены; архаизмы вроде «брение» и разговорные выражения исключены. Местоимение «Он» написано с прописной буквы как издательский выбор для ясного указания на Яхве.
