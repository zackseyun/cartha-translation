  text: וְ/הָיָ֗ה כָּל הַ/נּוֹתָר֙ בְּ/בֵ֣יתְ/ךָ֔ יָבוֹא֙ לְ/הִשְׁתַּחֲוֺ֣ת ל֔/וֹ לַ/אֲג֥וֹרַת כֶּ֖סֶף וְ/כִכַּר לָ֑חֶם וְ/אָמַ֗ר סְפָחֵ֥/נִי נָ֛א אֶל אַחַ֥ת הַ/כְּהֻנּ֖וֹת לֶ/אֱכֹ֥ל פַּת לָֽחֶם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/036.yaml
  text: And everyone left in your house will come to bow down to him for a piece of silver and a loaf of bread[a], and will say, ‘Please attach me to one of the priestly offices[b], so that I may eat a morsel of bread.’
translation:
  language: ru
  text: 'И каждый, кто останется из твоего дома, придёт поклониться ему за мелкую серебряную монету[a] и буханку хлеба и скажет: «Прошу, причисли меня к одному из священнических служений[b], чтобы я мог съесть кусок хлеба».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за кусочек серебра»; еврейское слово обозначает малую денежную единицу или небольшое количество серебра.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поручи мне одну из священнических обязанностей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר בְּבֵיתְךָ
  choice: кто останется из твоего дома
  rationale: Оборот обозначает оставшихся после суда представителей рода Илия; «дом» сохраняет семейно-династический смысл.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: к нему и поклонится
  rationale: Передаёт физический жест смирения и просительный характер действия, не уточняя сверх текста личность того, кому поклонятся.
- source_word: לַאֲגֹרַת כֶּסֶף
  choice: ради мелкой серебряной монеты
  rationale: Редкое אֲגוֹרָה обозначает небольшую денежную единицу или малую долю серебра; основной текст ясно передаёт ничтожность просимого.
- source_word: כִכַּר לָחֶם
  choice: буханки хлеба
  rationale: כִּכָּר здесь означает цельный, вероятно круглый хлеб; «буханка» естественно и понятно современному русскому читателю.
- source_word: סְפָחֵנִי נָא
  choice: Прошу, причисли меня
  rationale: ספח выражает присоединение человека к группе или служению, а נָא — вежливую настойчивую просьбу.
- source_word: אַחַת הַכְּהֻנּוֹת
  choice: к одной из священнических служб
  rationale: Необычное множественное число лучше понимать как различные священнические обязанности или места служения, а не как несколько отдельных священств.
- source_word: לֶאֱכֹל פַּת לָחֶם
  choice: чтобы мне было что поесть
  rationale: Идиоматический русский оборот передаёт цель просьбы и крайнюю нужду; буквальный образ куска хлеба отражён в сноске не требуется, поскольку смысл прозрачен из контекста.
theological_decisions:
- issue: К кому относится местоимение לוֹ («ему»/«к нему»)
  choice: Сохранено неопределённое «к нему» без указания имени или должности.
  alternative: 'Уточнить: «к священнику» или «к тому, кто будет тогда священником».'
  rationale: Еврейский текст оставляет референт местоимения контекстуальным; перевод сохраняет неоднозначность и подчёркивает унижение прежде привилегированного дома Илия.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан естественным для широкой аудитории; редкие еврейские выражения прояснены без устранения смысловой неоднозначности.
