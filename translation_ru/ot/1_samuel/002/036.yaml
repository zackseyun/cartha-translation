  - severity: low
    issue: «Ради мелкой серебряной монеты» не вполне ясно выражает значение ל־ при вознаграждении/средстве пропитания.
    rationale: «За мелкую серебряную монету» естественнее показывает, что униженное обращение совершается ради получения этой малой суммы и хлеба.
