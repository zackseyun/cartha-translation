revisions:
- from: 'И каждый, кто останется из твоего дома, придёт к нему и поклонится ради мелкой серебряной монеты[a] и буханки хлеба. Он скажет: «Прошу, причисли меня к одной из священнических служб[b], чтобы мне было что поесть».'
  to: 'И каждый, кто останется из твоего дома, придёт поклониться ему за мелкую серебряную монету[a] и буханку хлеба и скажет: «Прошу, причисли меня к одному из священнических служений[b], чтобы я мог съесть кусок хлеба».'
