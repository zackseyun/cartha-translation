base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/006.yaml
  text: David answered the priest and said to him[a], “Indeed, women have been kept from us as before, when I went out, and the young men’s vessels are holy, though it is an ordinary journey[d][c][b]. How much more today will it be made holy in the vessel.”
translation:
  language: ru
  text: 'Давид ответил священнику: «Женщины были удержаны от нас уже со вчерашнего и третьего дня[a], когда я выступил в путь; снаряжение юношей свято[b], хотя путь этот обычный[c]. Тем более сегодня это будет освящено в снаряжении[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как вчера, третьего дня». Это еврейская идиома о предшествующих днях; некоторые понимают её точнее как «около трёх дней». Возможные переводы начала фразы: «женщина была удержана от нас» или «мы воздерживались от женщин». Выражение относится к половому воздержанию при подготовке к обращению со святыней.'
    reason: lexical_alternative
  - marker: b
    text: «Снаряжение» передаёт буквальное «вещи, принадлежности». Некоторые понимают это слово эвфемистически — как указание на тела юношей или на них самих.
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово означает «обычный, общий», в противоположность святому; оно не подразумевает нравственной порочности.
    reason: lexical_alternative
  - marker: d
    text: 'Еврейский текст заключительной части стиха труден. Возможный смысл: «хотя путь обычный, сегодня это будет свято (или освящено) в отношении снаряжения». Однозначно определить, что именно имеется в виду и что именно освящается, невозможно.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה עֲצֻרָה לָנוּ
  choice: Женщины и прежде были недоступны нам
  rationale: Передаёт воздержание от половых отношений как условие ритуальной готовности; единственное число אִשָּׁה понято в родовом, собирательном смысле, а пассивная конструкция сохранена.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: и прежде
  rationale: Еврейская временная идиома указывает на предшествующие дни, но не обязательно задаёт точный срок; подробность сохранена в примечании.
- source_word: בְּצֵאתִי
  choice: когда я выступал в путь
  rationale: Естественно передаёт временное значение инфинитивной конструкции и соответствует контексту похода.
- source_word: כְלֵי הַנְּעָרִים
  choice: сосуды слуг
  rationale: 'Буквальное «сосуды» сохраняет неясность: речь может идти о снаряжении или, эвфемистически, о телах самих людей. הַנְּעָרִים в контексте Давида естественно означает его молодых слуг.'
- source_word: קֹדֶשׁ
  choice: святы
  rationale: Прямо обозначает отделённость для священного употребления и не сужает значение до одной лишь ритуальной чистоты.
- source_word: וְהוּא דֶּרֶךְ חֹל
  choice: хотя путь этот обычный
  rationale: חֹל передано как «обычный», то есть несвященный, а не нравственно порочный; уступительное прочтение соответствует контрасту контекста.
- source_word: וְאַף כִּי
  choice: тем более
  rationale: Сохраняет усилительно-умозаключительную силу выражения, хотя синтаксис всей заключительной фразы труден.
- source_word: הַיּוֹם יִקְדַּשׁ
  choice: сегодня он освятится
  rationale: Возвратно-пассивное «освятится» сохраняет глагольную форму и намеренно не превращает её в простое состояние «будет свят».
- source_word: בַּכֶּלִי
  choice: в сосуде
  rationale: Буквальный вариант сохраняет лексическую связь с כְלֵי и не устраняет неясность относительно сосуда, снаряжения или тела.
theological_decisions:
- issue: Ритуальная чистота и святость в связи со священным хлебом
  choice: Передать речь как относящуюся к ритуальной готовности и священному статусу без добавления позднейших богословских категорий.
  alternative: Истолковать слова исключительно как нравственную чистоту либо как бытовую опрятность.
  rationale: Контекст касается допуска к освящённому хлебу, а еврейский текст противопоставляет святое обычному и связывает готовность с половым воздержанием.
- issue: Неясность заключительной фразы
  choice: 'Сохранить буквальную образность и синтаксическую напряжённость: «Тем более сегодня он освятится в сосуде».'
  alternative: Однозначно отнести освящение к хлебу, телу, снаряжению или путешествию.
  rationale: Референты местоимения и слова כֶּלִי в еврейском тексте не вполне ясны; догматически или повествовательно конкретизировать их без достаточных оснований не следует.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис первой части слегка упрощён для ясности, но ключевые культовые термины «святы», «освятится» и намеренно неоднозначное «сосуд» сохранены. Маркеры примечаний размещены при соответствующих выражениях.
