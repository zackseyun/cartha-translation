  yaml_path: translation/ot/1_samuel/021/014.yaml
  text: So he changed his behavior before their eyes and acted like a madman in their hands[b][a]; he made marks on the doors of the gate and let his saliva run down onto his beard.
translation:
  language: ru
  text: И он изменил своё поведение у них на глазах, стал вести себя как безумный[a], находясь в их руках, делал отметины на створках ворот[b], так что слюна стекала на его бороду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «притворился безумным». Еврейский глагол описывает поведение безумца, а из контекста следует, что Давид делал это намеренно.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский глагол здесь труден для точного понимания; возможные значения: «царапал», «делал отметины» или «писал каракули» на створках ворот.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁנּוֹ אֶת־טַעְמוֹ
  choice: изменил своё поведение
  rationale: Буквальное значение טַעַם связано со «вкусом», а переносное — с рассудком, суждением или манерой поведения. В данном повествовательном контексте речь идёт о заметной для окружающих перемене в поведении Давида, без утверждения о действительной утрате рассудка.
- source_word: בְּעֵינֵיהֶם
  choice: у них на глазах
  rationale: Естественно передаёт еврейскую идиому «в их глазах», сохраняя её наглядность.
- source_word: וַיִּתְהֹלֵל
  choice: стал вести себя как безумный
  rationale: Форма hitpael здесь описывает безумное, неистовое поведение. Такая формулировка сохраняет различие между внешним поведением и внутренним состоянием; контекст указывает на намеренное притворство.
- source_word: בְּיָדָם
  choice: находясь в их руках
  rationale: Сохраняет еврейский образ и одновременно естественно выражает нахождение во власти или под контролем филистимлян.
- source_word: ויתו
  choice: чертил что-то
  rationale: Редкая и текстуально трудная глагольная форма обозначает действие на створках ворот, вероятно нанесение черт, царапин или каракулей. Неопределённое «что-то» не создаёт ложной точности.
- source_word: דַּלְתוֹת הַשַּׁעַר
  choice: створках ворот
  rationale: В контексте речь идёт о дверных полотнах, или створках, городских ворот; этот вариант точен и естественен по-русски.
- source_word: וַיּוֹרֶד רִירוֹ אֶל־זְקָנוֹ
  choice: пускал слюну по бороде
  rationale: Передаёт намеренное допущение того, чтобы слюна стекала вниз на бороду, и звучит естественно в современном русском языке.
