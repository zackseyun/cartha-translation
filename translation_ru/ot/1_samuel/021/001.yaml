  text: וַ/יָּ֖קָם וַ/יֵּלַ֑ךְ וִ/יהוֹנָתָ֖ן בָּ֥א הָ/עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/001.yaml
  text: Then he arose and went away[a], and Jonathan entered the city.
translation:
  language: ru
  text: Он встал и ушёл, а Ионафан вошёл в город.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: Он встал
  rationale: 'Форма Qal wayyiqtol от קום передаёт последовательное повествовательное действие: «встал». Местоимение «он» естественно выражает подразумеваемое в еврейском тексте подлежащее, не называя его прямо.'
- source_word: וַיֵּלַךְ
  choice: и ушёл
  rationale: Форма Qal wayyiqtol от הלך в контексте расставания означает, что действующее лицо отправилось прочь; «ушёл» естественнее по-русски, чем нейтральное «пошёл», и не перегружает фразу торжественной лексикой.
- source_word: וִיהוֹנָתָן
  choice: а Ионафан
  rationale: Союз ו здесь соединяет два расходящихся действия участников сцены. Русское «а» ясно и без излишнего усиления передаёт это сопоставление.
- source_word: בָּא
  choice: вошёл
  rationale: Qal perfect от בוא может означать «пришёл» или «вошёл». При прямом дополнении «город» перевод «вошёл в город» естественно передаёт достижение места назначения, не навязывая пространственную точку зрения рассказчика.
- source_word: הָעִיר
  choice: в город
  rationale: Определённая форма עִיר обозначает известный из контекста город. После глагола «вошёл» русский винительный падеж естественно передаёт направление движения; отдельное указательное уточнение не требуется.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным ритмом. Синтаксический контраст между уходом первого участника и возвращением Ионафана в город передан союзом «а». Имя первого участника не добавлено, поскольку в представленном еврейском отрывке оно выражено лишь подразумеваемым подлежащим.
