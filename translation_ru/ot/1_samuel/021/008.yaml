  yaml_path: translation/ot/1_samuel/021/008.yaml
  text: A man of Saul’s servants was there that day[a], detained before Yahweh; his name was Doeg the Edomite, the chief of Saul’s shepherds.
translation:
  language: ru
  text: В тот день там находился один из слуг Саула, задержанный перед Яхве[a]. Его звали Доэг, эдомитянин; он был главой пастухов Саула.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «удерживаемый перед Яхве» или «не выпускаемый перед Яхве». Еврейский текст не уточняет, почему Доэг был задержан.'
    reason: Лексическое значение נֶעְצָר допускает несколько близких вариантов, а причина и обстоятельства удерживания не названы.
lexical_decisions:
- source_word: וְשָׁם
  choice: там находился
  rationale: Естественно вводит присутствующего в данном месте участника повествования; союз וְ передан связностью русского рассказа без добавления отдельного дискурсивного слова.
- source_word: אִישׁ מֵעַבְדֵי שָׁאוּל
  choice: один из слуг Саула
  rationale: 'Передаёт неопределённое אִישׁ и партитивное מִן: речь идёт об одном человеке из числа царских слуг.'
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямое и естественное соответствие обычному еврейскому обозначению времени.
- source_word: נֶעְצָר לִפְנֵי יְהוָה
  choice: задержанный пред Яхве
  rationale: Страдательная форма указывает, что Доэг был удержан или задержан, но причина не названа. «Пред Яхве» сохраняет возможный культовый оттенок присутствия при святилище, не уточняя обстоятельств.
- source_word: וּשְׁמוֹ דֹּאֵג הָאֲדֹמִי
  choice: Его звали Доэг, эдомитянин
  rationale: Естественно передаёт формулу называния имени и этническую принадлежность. Форма «Доэг» ближе к еврейскому דֹּאֵג.
- source_word: אַבִּיר הָרֹעִים אֲשֶׁר לְשָׁאוּל
  choice: главным над пастухами Саула
  rationale: В контексте царского хозяйства אַבִּיר, вероятнее всего, обозначает старшинство или руководящее положение, а относительная конструкция указывает, что пастухи принадлежали Саулу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Смысл נֶעְצָר לִפְנֵי יְהוָה
  choice: задержанный пред Яхве
  alternative: удерживаемый пред Яхве; оставленный пред Яхве
  rationale: Текст не объясняет ни причину, ни характер задержки. Основной перевод и примечание сохраняют эту неопределённость и не вводят конкретного ритуального объяснения.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Оборот «пред Яхве» выбран вместо более разговорного «перед Яхве», поскольку он краток и уместно передаёт формулу нахождения в Божьем присутствии; при этом остальная фраза остаётся понятной обычному читателю.
