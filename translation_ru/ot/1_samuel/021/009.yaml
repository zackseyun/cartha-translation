base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/009.yaml
  text: And David said to Ahimelech[a], “Is there not here under your hand a spear or a sword? For I did not take my sword or my weapons in my hand[c][b], because the king’s matter was urgent.”
translation:
  language: ru
  text: 'И сказал Давид Ахимелеху: «Нет ли здесь у тебя под рукой[a] копья или меча? Ведь я не взял с собой ни меча, ни другого оружия[b], потому что дело царя[c] было неотложным».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «под твоей рукой»; это выражение может означать «в твоём распоряжении» или «у тебя во владении».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ни меча, ни снаряжения». Древнееврейское слово может обозначать различные предметы, принадлежности или снаряжение; здесь, вероятно, имеется в виду оружие.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «поручение царя», «приказ царя». Древнееврейское выражение шире каждого из этих вариантов и может означать слово, дело или поручение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Стандартная передача древнееврейской повествовательной формы wayyiqtol; сохраняет связность рассказа без излишнего уточнения временной последовательности.
- source_word: לַאֲחִימֶלֶךְ
  choice: Ахимелеху
  rationale: Имя передано в принятой русской библейской транслитерации и поставлено в дательном падеже по синтаксису исходного текста.
- source_word: וְאִין יֶשׁ פֹּה
  choice: Нет ли здесь
  rationale: Естественная русская передача идиоматического отрицательного вопроса о наличии чего-либо.
- source_word: תַּחַת יָדְךָ
  choice: у тебя под рукой
  rationale: Сохраняет конкретный образ древнееврейского выражения и естественно означает наличие или доступность предмета.
- source_word: חֲנִית אוֹ חָרֶב
  choice: копья или меча
  rationale: Прямая передача двух названий оружия в единственном числе; родительный падеж обусловлен отрицательной конструкцией.
- source_word: כִּי
  choice: Ведь
  rationale: Вводит объяснение просьбы Давида и естественно звучит в современной русской прямой речи.
- source_word: גַּם חַרְבִּי וְגַם כֵּלַי
  choice: ни меча, ни другого оружия
  rationale: При отрицании повторённое גם естественно передаётся конструкцией «ни… ни…». כְּלִי имеет широкое значение «предмет, снаряжение, орудие»; военный контекст допускает «оружие», а слово «другого» предотвращает восприятие меча как чего-то отдельного от оружия вообще.
- source_word: לֹא לָקַחְתִּי בְיָדִי
  choice: я не взял с собой
  rationale: Естественная русская передача буквального «не взял в руку», означающего, что Давид не захватил эти предметы с собой.
- source_word: דְבַר הַמֶּלֶךְ
  choice: дело царя
  rationale: Сохраняет широту значения דָּבָר — «слово, дело, поручение, обстоятельство» — и не решает без достаточных оснований, идёт ли речь о приказе или порученном деле.
- source_word: נָחוּץ
  choice: неотложным
  rationale: Передаёт значение срочности и настоятельности в ясной современной литературной форме.
