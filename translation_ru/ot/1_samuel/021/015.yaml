  text: וַ/יֹּ֥אמֶר אָכִ֖ישׁ אֶל עֲבָדָ֑י/ו הִנֵּ֤ה תִרְאוּ֙ אִ֣ישׁ מִשְׁתַּגֵּ֔עַ לָ֛/מָּה תָּבִ֥יאוּ אֹת֖/וֹ אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/015.yaml
  text: And Achish said to his servants[a], “Look, you see a man acting like a madman. Why do you bring him to me?”
translation:
  language: ru
  text: 'И сказал Ахиш своим слугам: «Вот, вы видите человека, который ведёт себя как безумный[a]. Зачем вы привели его ко мне?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «безумного человека». Еврейское причастие может обозначать как действительное безумие, так и поведение, выглядящее безумным.'
    reason: Сохранение лексической неоднозначности причастия מִשְׁתַּגֵּעַ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Стандартная повествовательная форма с последовательным вау; союз сохраняет ход еврейского рассказа.
- source_word: אָכִישׁ
  choice: Ахиш
  rationale: Имя передано прямой транслитерацией с древнееврейского, без опоры на вторичную греческую форму.
- source_word: עֲבָדָיו
  choice: своим слугам
  rationale: В контексте царского двора слово обозначает людей на службе у правителя; «слугам» — прямой и естественный русский эквивалент.
- source_word: הִנֵּה תִרְאוּ
  choice: Вот, вы видите
  rationale: Сохраняются и частица, привлекающая внимание, и форма второго лица множественного числа.
- source_word: אִישׁ מִשְׁתַּגֵּעַ
  choice: человека, который ведёт себя как безумный
  rationale: Причастие породы хитпаэль описывает наблюдаемое поведение и в данном контексте допускает как настоящее безумие, так и его изображение.
- source_word: לָמָּה תָּבִיאוּ אֹתוֹ אֵלָי
  choice: Зачем вы привели его ко мне?
  rationale: 'Русское прошедшее время естественно передаёт вопрос о действии, результат которого налицо: человека уже доставили к Ахишу. «Зачем» лучше выражает упрёк и вопрос о цели этого поступка.'
theological_decisions:
- issue: Действительно ли Давид безумен или лишь изображает безумие
  choice: ведёт себя как безумный
  alternative: безумный человек
  rationale: Основной текст передаёт наблюдаемое поведение, не утверждая как факт психическое состояние человека; допустимое более прямое прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной повествовательной интонацией. «Вот» сохраняет указательную силу הִנֵּה без архаичного «се». Имя «Ахиш» передано непосредственно с древнееврейского; традиционная русская форма «Анхус» восходит к иной посредующей традиции.
