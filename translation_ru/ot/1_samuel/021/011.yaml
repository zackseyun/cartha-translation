lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Прямо передаёт значение קום и сохраняет последовательность повествовательных действий, не усиливая смысл до «отправился».
- source_word: וַיִּבְרַח
  choice: бежал
  rationale: Обычное и точное соответствие ברח в контексте бегства от угрозы.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественно и точно передаёт стандартное еврейское обстоятельство времени.
- source_word: מִפְּנֵי שָׁאוּל
  choice: от Саула
  rationale: Идиоматически передаёт буквальное «от лица/присутствия Саула» как бегство от самого Саула.
- source_word: וַיָּבֹא אֶל
  choice: пришёл к
  rationale: Сохраняет обычное значение בוא с אֶל и перспективу еврейского повествования.
- source_word: אָכִישׁ
  choice: Анхус
  rationale: Использована укоренившаяся в русской библейской традиции форма имени, понятная современному читателю.
- source_word: מֶלֶךְ גַּת
  choice: царю Гефа
  rationale: Точно передаёт конструкцию принадлежности и царский титул; «Геф» — принятая русская библейская форма топонима.
