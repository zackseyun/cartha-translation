base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/005.yaml
  text: The priest answered David and said[a], “There is no ordinary bread on hand, but there is holy bread—if the young men have kept themselves from women.”
translation:
  language: ru
  text: 'Священник ответил Давиду: «Обычного хлеба у меня под рукой нет, но есть священный хлеб — только если юноши воздерживались от женщин[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от женщины»; речь идёт о воздержании от половых отношений ради ритуальной чистоты.'
    reason: Лексическая альтернатива и пояснение подразумеваемого в контексте смысла.
lexical_decisions:
- source_word: לֶחֶם חֹל
  choice: обычный хлеб
  rationale: חֹל противопоставлено קֹדֶשׁ и обозначает хлеб, не отделённый для священного употребления; «обычный» естественно передаёт культовое, а не нравственное противопоставление.
- source_word: אֶל תַּחַת יָדִי
  choice: у меня под рукой
  rationale: Еврейское выражение буквально говорит о находящемся «под рукой» и в контексте означает имеющееся в распоряжении; русский оборот сохраняет образ и передаёт смысл наличия.
- source_word: כִּי אִם
  choice: но
  rationale: 'В этой конструкции выражение вводит противопоставление и исключение: обычного хлеба нет, но священный имеется.'
- source_word: לֶחֶם קֹדֶשׁ
  choice: священный хлеб
  rationale: Кֹדֶשׁ указывает на хлеб, отделённый для культового употребления; «священный» прямо и понятно сохраняет противопоставление обычному хлебу.
- source_word: אִם נִשְׁמְרוּ
  choice: если … воздерживались
  rationale: Нифаль глагола שׁמר здесь выражает хранение себя от чего-либо, то есть воздержание; русский вариант естественно раскрывает подразумеваемое действие без добавления оценки.
- source_word: הַנְּעָרִים
  choice: юноши
  rationale: נְעָרִים может обозначать юношей, молодых мужчин или сопровождающих слуг. «Юноши» сохраняет основное лексическое значение, не уточняя их положение сверх текста.
- source_word: אַךְ
  choice: хотя бы
  rationale: Ограничительная частица выделяет минимально необходимое условие — воздержание от женщин. «Хотя бы» сохраняет эту прагматическую силу, не превращая её в более широкое утверждение о чистоте.
- source_word: מֵאִשָּׁה
  choice: от женщин
  rationale: Единственное число после מן может употребляться собирательно. В русском «от женщин» естественно передаёт подразумеваемое половое воздержание; буквальная форма и смысл пояснены в сноске.
theological_decisions:
- issue: Условие ритуальной чистоты для получения священного хлеба
  choice: Доступ к священному хлебу поставлен в зависимость от воздержания юношей от женщин, без расширения формулировки до общего учения о сексуальности.
  alternative: 'Передать условие развёрнуто: «если юноши воздерживались от половых отношений ради ритуальной чистоты».'
  rationale: Стих отражает культовые категории святости и чистоты. Краткая формулировка сохраняет условие исходного текста и его напряжение, а подразумеваемый характер воздержания разъясняется в сноске без внесения конфессиональных выводов.
translation_notes:
  register: Современный литературный русский язык с естественным, но достойным библейским регистром. Синтаксис упрощён за счёт устранения избыточной для русского формулы «ответил… и сказал». Маркер сноски помещён непосредственно после выражения, которое он поясняет.
