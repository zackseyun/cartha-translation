base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/004.yaml
  text: Now then[a], what do you have on hand? Give me five loaves of bread[c][b], or whatever is available.
translation:
  language: ru
  text: А теперь, что у тебя под рукой[a]? Дай мне[b] пять хлебов — или что найдётся[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «что есть под твоей рукой»; то есть что сейчас имеется у тебя в распоряжении.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дай в мою руку».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «или что имеется».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт как переход к следующей мысли, так и непосредственность практической просьбы.
- source_word: מַה יֵּשׁ תַּחַת יָדְךָ
  choice: что у тебя под рукой
  rationale: Естественное русское выражение, близко передающее еврейскую идиому о том, что имеется в распоряжении и доступно сейчас.
- source_word: חֲמִשָּׁה לֶחֶם
  choice: пять хлебов
  rationale: Сохраняет конкретное число и обозначение отдельных хлебов без добавления неуказанной формы выпечки, такой как буханки или лепёшки.
- source_word: תְּנָה בְיָדִי
  choice: дай мне
  rationale: Естественно передаёт повелительную форму и идиоматическое направление передачи «в мою руку».
- source_word: אוֹ הַנִּמְצָא
  choice: или что найдётся
  rationale: 'Сохраняет краткость и некоторую открытость еврейского выражения: речь может идти о любом доступном количестве или припасе.'
