base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/010.yaml
  text: And the priest said[a], “The sword of Goliath the Philistine, whom you struck down in the Valley of Elah—behold, it is wrapped in a cloth behind the ephod. If you will take that for yourself, take it, for there is no other here except it.” And David said, “There is none like it; give it to me.”
translation:
  language: ru
  text: 'Священник сказал: «Меч филистимлянина Голиафа, которого ты сразил в долине Эла, — вот, он завёрнут в верхнюю одежду[a] за эфодом. Если хочешь взять его себе, бери: другого здесь нет». Давид ответил: «Нет ему равного! Дай его мне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в плащ»; еврейское слово может обозначать одежду, верхнее одеяние или плащ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: меч филистимлянина Голиафа
  rationale: Естественно передаёт сопряжённую конструкцию и сохраняет этническое определение Голиафа.
- source_word: הִכִּיתָ
  choice: ты сразил
  rationale: В военном контексте נכה обозначает нанесение поражения, часто со смертельным исходом; «сразил» сохраняет эту силу, не подменяя глагол прямым «убил».
- source_word: בְּעֵמֶק הָאֵלָה
  choice: в долине Эла
  rationale: Передаёт географический термин עֵמֶק современным словом «долина», а Эла — как название места.
- source_word: הִנֵּה הִיא
  choice: Вот … Он
  rationale: «Вот» сохраняет указательную функцию הִנֵּה; отдельное предложение с местоимением естественно звучит по-русски.
- source_word: לוּטָה בַשִּׂמְלָה
  choice: завёрнут в верхнюю одежду
  rationale: לוּטָה выражает состояние обёрнутости, а שִׂמְלָה обычно обозначает одежду, особенно верхнее одеяние; формулировка не превращает её без достаточного основания в отдельный кусок ткани.
- source_word: אַחֲרֵי הָאֵפוֹד
  choice: лежит за эфодом
  rationale: אַחֲרֵי здесь имеет пространственный смысл «за, позади». Добавленное «лежит» естественно связывает указание местонахождения меча с предыдущей фразой.
- source_word: אִם אֹתָהּ תִּקַּח לְךָ קָח
  choice: Если хочешь взять его себе, бери
  rationale: Передаёт условно-разрешительную конструкцию естественным современным русским языком.
- source_word: כִּי אֵין אַחֶרֶת זוּלָתָהּ בָּזֶה
  choice: другого здесь нет
  rationale: 'Смысл исключения уже выражен словом «другого»: в этом месте нет никакого иного меча. Мужской род согласован с русским словом «меч».'
- source_word: אֵין כָּמוֹהָ
  choice: Нет ему равного
  rationale: Идиоматично передаёт утверждение об исключительности или превосходстве меча, не уточняя, в каком именно отношении он не имеет равных.
- source_word: תְּנֶנָּה לִּי
  choice: Дай его мне
  rationale: Суффикс женского рода относится к слову «меч» в иврите; в русском местоимение закономерно согласовано с существительным мужского рода.
