  yaml_path: translation/ot/1_samuel/021/002.yaml
  text: David came to Nob, to Ahimelech the priest. Ahimelech trembled when he met David and said to him, “Why are you alone, and no man is with you?”
translation:
  language: ru
  text: 'Давид пришёл в Номву, к священнику Ахимелеху. Ахимелех задрожал, встретив Давида, и спросил его: «Почему ты один и никого с тобой нет?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱרַד
  choice: задрожал
  rationale: Передаёт сильную испуганную реакцию Ахимелеха, сохраняя конкретный образ еврейского глагола, а не ослабляя его до общего «встревожился».
- source_word: לִקְרַאת דָּוִד
  choice: встретив Давида
  rationale: Естественно передаёт обстоятельство встречи; сочетание с предшествующим глаголом показывает, что Ахимелех задрожал при встрече с Давидом.
- source_word: וְאִישׁ אֵין אִתָּךְ
  choice: и никого с тобой нет
  rationale: Естественная современная русская передача отрицательной конструкции «и нет человека с тобой» без ненужного ограничения значения словом «мужчина».
