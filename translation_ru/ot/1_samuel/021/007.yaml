  text: וַ/יִּתֶּן ל֥/וֹ הַ/כֹּהֵ֖ן קֹ֑דֶשׁ כִּי֩ לֹא הָ֨יָה שָׁ֜ם לֶ֗חֶם כִּֽי אִם לֶ֤חֶם הַ/פָּנִים֙ הַ/מּֽוּסָרִים֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה לָ/שׂוּם֙ לֶ֣חֶם חֹ֔ם בְּ/י֖וֹם הִלָּקְחֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/007.yaml
  text: So the priest gave him holy bread[a], for there was no bread there except the bread of the Presence, which had been removed from before Yahweh, to put hot bread there on the day it was taken away.
translation:
  language: ru
  text: И священник дал ему священный хлеб[a], потому что другого хлеба там не было — только хлеб Присутствия, убранный от лица Яхве, чтобы в день снятия этого хлеба положить там горячий хлеб.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по традиции, «хлеб предложения». Буквально: «хлеб Присутствия».'
    reason: Лексическая альтернатива и пояснение культового термина.
lexical_decisions:
- source_word: קֹדֶשׁ
  choice: священный хлеб
  rationale: Существительное буквально означает «святыня; священное», но в данном контексте прямо обозначает освящённый хлеб. Добавление слова «хлеб» естественно проясняет подразумеваемый предмет.
- source_word: לֶחֶם הַפָּנִים
  choice: хлеб Присутствия
  rationale: Передаёт культовое выражение буквально и прозрачно; традиционный русский термин «хлеб предложения» приведён в сноске.
- source_word: הַמּוּסָרִים
  choice: убранный
  rationale: Пассивное причастие описывает хлеб, снятый с места перед Яхве при установленной замене. В русском согласовано с собирательно употреблённым словом «хлеб».
- source_word: מִלִּפְנֵי יְהוָה
  choice: от лица Яхве
  rationale: 'Сохраняет пространственно-культовый образ еврейского выражения: хлеб находился перед Яхве.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: לָשׂוּם
  choice: положить
  rationale: Естественно передаёт инфинитив цели и действие помещения нового хлеба.
- source_word: לֶחֶם חֹם
  choice: горячий хлеб
  rationale: Сохраняет прямое значение прилагательного חֹם «горячий»; в обрядовом контексте оно также подразумевает свежесть хлеба.
- source_word: בְּיוֹם הִלָּקְחוֹ
  choice: в день, когда его забирали
  rationale: Передаёт временное значение оборота и пассивный смысл инфинитивной конструкции с местоименным суффиксом.
- source_word: כִּי לֹא הָיָה שָׁם לֶחֶם כִּי אִם
  choice: потому что другого хлеба там не было — только
  rationale: Передаёт объяснительную и исключительную функции конструкции естественным современным русским синтаксисом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение לֶחֶם הַפָּנִים
  choice: хлеб Присутствия
  alternative: хлеб предложения
  rationale: Основной вариант сохраняет смысл нахождения хлеба перед Божьим присутствием, не вводя дополнительного богословского толкования; традиционный термин отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис упрощён для ясности, но пространственно-культовый оборот «от лица Яхве» и буквальное «горячий хлеб» сохранены.
