  text: חֲסַ֤ר מְשֻׁגָּעִים֙ אָ֔נִי כִּי הֲבֵאתֶ֣ם אֶת זֶ֔ה לְ/הִשְׁתַּגֵּ֖עַ עָלָ֑/י הֲ/זֶ֖ה יָב֥וֹא אֶל בֵּיתִֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/016.yaml
  text: Do I lack madmen[a], that you have brought this one to act like a madman before me? Shall this one come into my house?
translation:
  language: ru
  text: Разве мне не хватает безумцев, что вы привели этого человека, чтобы он безумствовал передо мной?[a] Неужели он войдёт в мой дом?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы он вёл себя передо мной как безумный». Еврейский инфинитив породы хитпаэль обозначает безумное поведение; из контекста следует, что Давид притворялся безумным.'
    reason: Лексическая альтернатива и сохранение различия между значением глагола и контекстуальным указанием на притворство.
lexical_decisions:
- source_word: חֲסַר מְשֻׁגָּעִים
  choice: мне не хватает безумцев
  rationale: Предикативная конструкция выражает язвительный риторический вопрос. Русское «разве мне не хватает…» естественно передаёт и смысл, и саркастический тон.
- source_word: הֲבֵאתֶם אֶת זֶה
  choice: вы привели ко мне этого человека
  rationale: Указательное «этого» сохраняет пренебрежительный оттенок; слово «человека» добавлено для естественности русского выражения, а «ко мне» передаёт направленность действия, ясную из контекста и следующего עָלָי.
- source_word: לְהִשְׁתַּגֵּעַ
  choice: чтобы он безумствовал
  rationale: Инфинитив породы хитпаэль описывает поведение безумца, не утверждая однозначно ни подлинного безумия, ни сознательной игры.
- source_word: עָלָי
  choice: передо мной
  rationale: В данном контексте предлог указывает на поведение в присутствии царя или направленное к нему; «передо мной» звучит естественно и не вносит лишней идеи нападения.
- source_word: הֲזֶה יָבֹא אֶל־בֵּיתִי
  choice: Неужели он войдёт в мой дом?
  rationale: Второй риторический вопрос передан прямо. «Войдёт» точно выражает движение внутрь дома; местоимение «он» избегает неестественного повтора, тогда как презрительный тон уже задан словом «этого».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с резким, саркастическим тоном речи царя. Стигматизирующее слово «безумцы» сохранено как часть оскорбительной реплики персонажа, а не как нейтральное современное обозначение психического состояния.
