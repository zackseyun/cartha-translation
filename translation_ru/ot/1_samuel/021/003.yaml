base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/003.yaml
  text: David said to Ahimelech the priest[a], “The king has charged me with a matter and said to me[b], ‘Let no man know anything about the matter for which I am sending you and with which I have charged you.’ And I have directed the young men to a certain place.”
translation:
  language: ru
  text: 'Давид сказал священнику Ахимелеху: «Царь поручил мне дело и сказал мне: „Пусть никто ничего не знает о деле, с которым я посылаю тебя и о котором я велел тебе“. Молодым людям же я указал определённое место[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к такому-то, такому-то месту» — устойчивое выражение, обозначающее конкретное, но не названное или не раскрываемое место.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוַּנִי דָבָר
  choice: поручил мне дело
  rationale: Сочетание передаёт царское поручение или повеление относительно определённого дела; русский оборот сохраняет властный оттенок, не утяжеляя фразу.
- source_word: אִישׁ אַל יֵדַע מְאוּמָה
  choice: Пусть никто ничего не знает
  rationale: Хотя אִישׁ буквально означает «мужчина, человек», в отрицательной конструкции оно имеет обобщённое значение; «никто» естественно и точно передаёт смысл по-русски.
- source_word: הַדָּבָר
  choice: дело
  rationale: В контексте слово обозначает поручение или миссию, а не просто слово или предмет.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחֲךָ וַאֲשֶׁר צִוִּיתִךָ
  choice: с которым я посылаю тебя и которое поручил тебе
  rationale: Сохранены обе относительные конструкции и повтор идеи поручения; связь местоимений с «делом» передана без добавочного толкования.
- source_word: וְאֶת־הַנְּעָרִים
  choice: А слугам
  rationale: נְעָרִים может означать молодых людей, слуг или сопровождающих. В рассказе речь идёт о людях Давида; «слуги» естественно передаёт вероятную роль, хотя возрастной оттенок остаётся возможным.
- source_word: יוֹדַעְתִּי אֶל
  choice: я велел быть
  rationale: Форма от ידע буквально связана с сообщением или извещением, но конструкция с направлением к месту здесь подразумевает данное людям указание относительно места встречи.
- source_word: מְקוֹם פְּלֹנִי אַלְמוֹנִי
  choice: в условленном месте
  rationale: Парное идиоматическое выражение указывает на не названное или намеренно не раскрываемое место. «Условленное место» согласуется с тем, что Давид заранее указал его своим людям.
