base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/012.yaml
  text: And the servants of Achish said to him[a], “Is this not David, the king of the land? Is this not the one of whom they sang in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: ru
  text: 'Слуги Анхуса сказали ему: «Не Давид ли это, царь этой земли? Не о нём ли пели во время плясок[a]: „Саул сразил свои тысячи, а Давид — свои десятки тысяч[b]“?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Не о нём ли пели, отвечая друг другу во время плясок?» — то есть пели поочерёдно, перекликаясь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «десять тысяч»; слово может также означать «мириады» или «десятки тысяч».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: слуги
  rationale: Слово обозначает людей, состоящих на службе у Анхуса, в том числе придворных; «слуги» передаёт широкий смысл, не сужая его до «чиновников».
- source_word: הֲלוֹא
  choice: не … ли
  rationale: Русская конструкция сохраняет форму риторического вопроса, предполагающего утвердительный ответ.
- source_word: מֶלֶךְ הָאָרֶץ
  choice: царь этой земли
  rationale: Сохранено прямое обозначение Давида в речи слуг Анхуса; указательное «этой» естественно передаёт определённость земли, о которой идёт речь, не объясняя слова как формальный титул или гиперболу.
- source_word: יַעֲנוּ
  choice: пели
  rationale: В контексте плясок глагол обозначает пение, вероятно ответное; основной текст передаёт ясный смысл, а возможная антифонная форма отмечена в сноске.
- source_word: בַמְּחֹלוֹת
  choice: во время плясок
  rationale: Так естественно по-русски передаётся пение, сопровождавшее праздничные танцы; «пляски» соответствует торжественному повествовательному регистру.
- source_word: הִכָּה
  choice: сразил
  rationale: В победной песне глагол означает поражение врагов в бою; «сразил» ясно передаёт военный и смертельный характер действия без архаической тяжеловесности.
- source_word: באלפו
  choice: свои тысячи
  rationale: Сохранён числовой итог, приписанный Саулу, и местоименный суффикс третьего лица.
- source_word: ברבבתו
  choice: свои десятки тысяч
  rationale: רבבה может означать десять тысяч или множество в десятках тысяч; выбранное выражение сохраняет параллелизм и допускаемый масштаб числа.
theological_decisions:
- issue: Являются ли слова «царь этой земли» объективным титулом Давида или оценкой филистимлян
  choice: царь этой земли
  alternative: тот, кого в этой земле считают царём
  rationale: Еврейский текст не уточняет, буквально ли слуги называют Давида царём или гиперболически говорят о его известности и положении. Прямой перевод сохраняет эту повествовательную напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Риторические вопросы и параллелизм победной песни сохранены; синтаксис сделан естественным для устной речи персонажей.
