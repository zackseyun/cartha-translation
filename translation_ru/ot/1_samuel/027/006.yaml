  text: So Achish gave him Ziklag that day[b][a]. Therefore Ziklag has belonged to the kings of Judah to this day.
translation:
  language: ru
  text: В тот день Ахиш дал ему Циклаг. Поэтому Циклаг принадлежит царям Иудеи по сей день.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֶּן
  choice: дал
  rationale: Обычное значение נתן в данном повествовательном контексте; естественно передаёт передачу города Давиду.
- source_word: לּוֹ
  choice: ему
  rationale: Местоименный суффикс мужского рода единственного числа относится к Давиду в ближайшем контексте.
- source_word: אָכִישׁ
  choice: Ахиш
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Точно и естественно передаёт еврейское обстоятельство времени.
- source_word: צִקְלָג
  choice: Циклаг
  rationale: Традиционная русская форма географического названия.
- source_word: לָכֵן
  choice: Поэтому
  rationale: Сохраняет причинно-следственную связь с передачей города Ахишем.
- source_word: הָיְתָה ... לְמַלְכֵי יְהוּדָה
  choice: принадлежит царям Иудеи
  rationale: В сочетании с «до сего дня» конструкция выражает сохраняющееся владение; настоящее время естественно передаёт результат, продолжающийся до времени рассказчика.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивое, понятное и достойное библейское выражение, указывающее на продолжение положения до времени рассказчика.
theological_decisions:
- issue: Историческая перспектива выражений «до сего дня» и «цари Иудеи»
  choice: Сохранить ретроспективное замечание рассказчика без пояснения истории составления текста.
  alternative: Добавить, что формулировка отражает более позднюю перспективу Иудейского царства.
  rationale: Еврейский текст лишь сообщает исторический факт с позиции рассказчика; перевод не должен привносить теорию авторства или редакции.
translation_notes:
  register: Современный литературный русский с умеренно традиционным библейским оборотом «до сего дня». Синтаксис краткий и ясный; неоднозначность глагола הָיְתָה разрешена контекстуально как продолжающаяся принадлежность без добавления историко-критических пояснений.
