lexical_decisions:
- source_word: וַיְהִי מִסְפַּר הַיָּמִים
  choice: прожил… год и четыре месяца
  rationale: Еврейская формула буквально говорит о «числе дней», но по-русски естественнее передать её прямым указанием продолжительности проживания.
- source_word: אֲשֶׁר יָשַׁב דָּוִד
  choice: Давид прожил
  rationale: В данном контексте יָשַׁב означает длительное пребывание или проживание, а не буквальное сидение.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: в земле филистимлян
  rationale: שָׂדֶה здесь обозначает область или территорию народа; «земля филистимлян» звучит естественно и сохраняет географический смысл.
- source_word: יָמִים וְאַרְבָּעָה חֳדָשִׁים
  choice: год и четыре месяца
  rationale: В формуле продолжительности יָמִים идиоматически означает год; буквальное «дни и четыре месяца» по-русски затемнило бы смысл.
