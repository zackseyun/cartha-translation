  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל לִבּ֔/וֹ עַתָּ֛ה אֶסָּפֶ֥ה יוֹם אֶחָ֖ד בְּ/יַד שָׁא֑וּל אֵֽין לִ֨/י ט֜וֹב כִּ֣י הִמָּלֵ֥ט אִמָּלֵ֣ט אֶל אֶ֣רֶץ פְּלִשְׁתִּ֗ים וְ/נוֹאַ֨שׁ מִמֶּ֤/נִּי שָׁאוּל֙ לְ/בַקְשֵׁ֤/נִי עוֹד֙ בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֔ל וְ/נִמְלַטְתִּ֖י מִ/יָּדֽ/וֹ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/001.yaml
  text: Then David said in his heart[a], “Now I will one day perish by the hand of Saul. There is nothing better for me than that I should surely escape to the land of the Philistines. Then Saul will despair of seeking me any longer in all the territory of Israel[c][b], and I will escape from his hand.”
translation:
  language: ru
  text: 'И сказал Давид в своём сердце[a]: «Когда-нибудь я погибну[b] от руки Саула. Нет для меня ничего лучше, чем непременно бежать в землю филистимлян. Тогда Саул оставит попытки разыскать меня по всей земле Израиля[c], и я ускользну из его рук».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть сказал самому себе, мысленно.
    reason: idiom_clarification
  - marker: b
    text: 'Еврейский глагол можно также передать более образно: «буду сметён» или «буду уничтожен».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «во всех пределах Израиля»; здесь имеются в виду все израильские земли.'
    reason: lexical_clarification
lexical_decisions:
- source_word: אֶל־לִבּוֹ
  choice: в своём сердце
  rationale: Сохранён древнееврейский образ внутренней речи; в данном контексте выражение означает, что Давид сказал это самому себе.
- source_word: אֶסָּפֶה
  choice: погибну
  rationale: Нифаль глагола ספה здесь обозначает гибель, возможно с оттенком того, что человека сметут или уничтожат. «Погибну» естественно передаёт смысл, не устраняя более яркий оттенок, отмеченный в сноске.
- source_word: יוֹם אֶחָד
  choice: когда-нибудь
  rationale: Идиоматическое временное выражение; по-русски «когда-нибудь» естественно передаёт неопределённый будущий день.
- source_word: בְּיַד שָׁאוּל
  choice: от руки Саула
  rationale: Сохранён понятный русский библейский образ руки как орудия и власти действующего лица.
- source_word: אֵין לִי טוֹב כִּי
  choice: нет для меня ничего лучше, как
  rationale: Формулировка близко передаёт сравнительную оценку исходного текста и остаётся естественной для литературного русского языка.
- source_word: הִמָּלֵט אִמָּלֵט
  choice: непременно бежать
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает глагольное действие; наречие «непременно» передаёт это усиление без неестественного повтора.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: в землю филистимлян
  rationale: Прямое и прозрачное географическое обозначение, сохраняющее форму исходного текста.
- source_word: וְנוֹאַשׁ מִמֶּנִּי שָׁאוּל לְבַקְשֵׁנִי עוֹד
  choice: тогда Саул отчается найти меня и больше не станет искать
  rationale: יאש выражает утрату надежды или отказ от дальнейших попыток; продолжение с לְבַקְשֵׁנִי עוֹד уточняет прекращение поисков. Русская формулировка сохраняет оба элемента.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: по всей земле Израиля
  rationale: גְּבוּל здесь обозначает всю территорию в пределах Израиля, а не только пограничную линию.
- source_word: וְנִמְלַטְתִּי מִיָּדוֹ
  choice: а я спасусь от его руки
  rationale: Сохранены повтор мотива избавления и образ руки как власти Саула; союз «а» естественно обозначает ожидаемый результат в противопоставлении дальнейшим поискам.
