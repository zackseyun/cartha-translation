  to: 'И сказал Давид в своём сердце[a]: «Когда-нибудь я погибну[b] от руки Саула. Нет для меня ничего лучше, чем непременно бежать в землю филистимлян. Тогда Саул оставит попытки разыскать меня по всей земле Израиля[c], и я ускользну из его рук».'
