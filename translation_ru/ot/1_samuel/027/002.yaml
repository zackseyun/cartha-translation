  text: So David arose and crossed over, he and the six hundred men who were with him, to Achish son of Maoch, king of Gath.
translation:
  language: ru
  text: И встал Давид, и перешёл к Анхусу, сыну Маоха, царю Гефа, вместе с шестьюстами людьми, бывшими с ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Форма от קום буквально означает «встал» и в повествовании вводит решительное действие; русский библейско-повествовательный оборот сохраняет эту функцию без сведения смысла к «отправился».
- source_word: וַיַּעֲבֹר
  choice: перешёл
  rationale: עבר обозначает переход из одной области в другую; «перешёл» сохраняет направленность движения Давида на филистимскую территорию.
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ
  choice: он и шестьсот человек
  rationale: Самостоятельное местоимение выделяет Давида как участника перехода вместе с известным отрядом; конструкция передана прямо, без добавления отсутствующего в оригинале существительного «воинов».
- source_word: אֲשֶׁר עִמּוֹ
  choice: бывших с ним
  rationale: Причастный оборот естественно и точно передаёт относительное придаточное «которые были с ним» и относится к слову «человек».
- source_word: אֶל אָכִישׁ
  choice: к Анхусу
  rationale: אֶל при глаголе движения указывает направление к человеку; в русском требуется дательный падеж с предлогом «к».
- source_word: בֶּן מָעוֹךְ
  choice: сыну Маоха
  rationale: Патронимическая конструкция передана непосредственно; падеж согласован с именем Анхус.
- source_word: מֶלֶךְ גַּת
  choice: царю Гефа
  rationale: Сопряжённая конструкция обозначает царский статус Анхуса по отношению к городу Гефу; приложение поставлено в дательный падеж.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным ритмом. Имена «Анхус», «Маох» и «Геф» даны в укоренившейся русской библейской форме. Повтор союза «и» сохраняет последовательность еврейского повествования, не делая фразу неестественной.
