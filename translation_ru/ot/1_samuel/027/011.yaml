base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/011.yaml
  text: David left alive neither man nor woman to bring to Gath[a], saying, “Otherwise they might report about us, saying, ‘This is what David did[b], and this was his practice all the days that he lived in the country of the Philistines.’”
translation:
  language: ru
  text: 'Давид не оставлял в живых ни мужчин, ни женщин, чтобы их не могли привести в Геф, говоря: «Иначе они могли бы рассказать о нас: „Вот что делал Давид, и таков был его обычай[a] всё то время, пока он жил в земле филистимлян[b]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «таков был его образ действий». Еврейское слово מִשְׁפָּט может означать также установление, порядок или принятую практику.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в поле филистимлян», то есть на территории или в сельской местности филистимлян.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ וְאִשָּׁה
  choice: ни мужчину, ни женщину
  rationale: Единственное число в парной конструкции имеет распределительное значение и подчёркивает, что в живых не оставляли никого независимо от пола.
- source_word: לֹא יְחַיֶּה
  choice: не оставлял в живых
  rationale: Пиэль глагола חיה здесь означает сохранять кому-либо жизнь, щадить. Несовершенный вид русского глагола передаёт повторявшийся образ действий Давида.
- source_word: לְהָבִיא גַת
  choice: чтобы привести их в Геф
  rationale: Инфинитив выражает цель; местоимение «их» восполняет подразумеваемый в еврейском тексте объект и делает фразу естественной по-русски.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Сохранена еврейская формула введения прямой речи, которая здесь передаёт объяснение мотива Давида.
- source_word: פֶּן
  choice: иначе
  rationale: 'Передаёт предупредительно-предотвратительный смысл частицы: Давид не оставлял свидетелей, чтобы избежать нежелательного сообщения.'
- source_word: יַגִּדוּ עָלֵינוּ
  choice: они могут рассказать о нас
  rationale: Нейтрально передаёт сообщение сведений о Давиде и его людях, не усиливая выражение до более обвинительного «донесут на нас».
- source_word: כֹּה עָשָׂה דָוִד
  choice: вот что делал Давид
  rationale: «Вот что» сохраняет указательное значение כֹּה, а несовершенный вид естественно согласуется с описанием повторявшихся набегов.
- source_word: וְכֹה מִשְׁפָּטוֹ
  choice: и таков был его обычай
  rationale: В данном контексте מִשְׁפָּט обозначает установившийся образ действий, однако его более широкая смысловая область отмечена в сноске.
- source_word: כָּל הַיָּמִים אֲשֶׁר יָשַׁב
  choice: во всё время, пока он жил
  rationale: Естественная современная русская передача идиомы «все дни, которые он жил», обозначающей весь период пребывания.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: в земле филистимлян
  rationale: שָׂדֶה буквально означает «поле», но здесь обозначает область или территорию филистимлян; «земля» передаёт географический смысл без излишней буквальности.
