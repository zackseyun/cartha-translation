base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/010.yaml
  text: Then Achish said[a], “Where have you made a raid today?” And David said, “Against the Negev of Judah, against the Negev of the Jerahmeelites[b], and against the Negev of the Kenites.”
translation:
  language: ru
  text: 'Ахиш спросил[a]: «На кого вы сегодня совершили набег?» Давид ответил: «На юг Иудеи, на юг иерахмеелитян и на юг кенеев»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально можно понять примерно так: «Разве вы не совершали сегодня набега?» Однако по контексту это вопрос о месте или цели набега; такой смысл отражён и в древних переводах.'
    reason: textual_variant
  - marker: b
    text: 'Или: «на Негев Иудеи, на Негев иерахмеелитян и на Негев кенеев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל פְּשַׁטְתֶּם הַיּוֹם
  choice: На кого вы сегодня совершили набег?
  rationale: Масоретское אַל обычно означает отрицание, однако здесь контекст и древние версии указывают на вопрос о цели набега. Формулировка «на кого» естественно согласуется с последующим перечислением предполагаемых целей; множественное число сохраняет форму פְּשַׁטְתֶּם.
- source_word: נֶגֶב
  choice: южная область
  rationale: נֶגֶב может обозначать как юг или южную область, так и конкретный Негев. В сочетании с Иудеей и названиями родовых групп «южная область» сохраняет возможную территориальную связь с каждой из них и звучит естественно по-русски.
- source_word: עַל
  choice: на
  rationale: В контексте военного набега предлог вводит его цель; русское «совершить набег на» точно передаёт враждебную направленность.
- source_word: יְהוּדָה
  choice: Иудея
  rationale: В данном географическом сочетании речь идёт о территории колена Иуды; традиционное русское «Иудея» здесь понятно и естественно.
- source_word: הַיַּרְחְמְאֵלִי
  choice: иерахмеилиты
  rationale: Форма является этнонимом и обозначает род или народ иерахмеилитов.
- source_word: הַקֵּינִי
  choice: кенеи
  rationale: Форма является этнонимом; «кенеи» — традиционная и понятная русская передача.
- source_word: וַיֹּאמֶר
  choice: спросил / ответил
  rationale: 'Буквально глагол означает «сказал», но функции реплик однозначны: Анхус задаёт вопрос, а Давид отвечает. Контекстуальные русские глаголы обеспечивают естественность без изменения смысла.'
