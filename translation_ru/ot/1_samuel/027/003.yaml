  text: וַ/יֵּשֶׁב֩ דָּוִ֨ד עִם אָכִ֥ישׁ בְּ/גַ֛ת ה֥וּא וַ/אֲנָשָׁ֖י/ו אִ֣ישׁ וּ/בֵית֑/וֹ דָּוִד֙ וּ/שְׁתֵּ֣י נָשָׁ֔י/ו אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית וַ/אֲבִיגַ֥יִל אֵֽשֶׁת נָבָ֖ל הַֽ/כַּרְמְלִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/003.yaml
  text: So David stayed with Achish in Gath[a], he and his men, each man with his household—David with his two wives, Ahinoam the Jezreelite and Abigail[b], the wife of Nabal the Carmelite.
translation:
  language: ru
  text: 'И жил Давид у Ахиша в Гате[a], он и его люди, каждый со своими домашними[b]; Давид — со своими двумя жёнами: Ахиноам из Изрееля и Авигеей, женой Навала из Кармила.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оставался у Ахиша в Гате». Еврейский глагол может означать как проживание, так и временное пребывание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каждый и его дом»; это распределительное выражение означает каждого мужчину вместе с людьми его дома.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: жил
  rationale: Глагол ישׁב здесь обозначает проживание или пребывание в определённом месте. «Жил» естественно для русского повествования и не обязательно подразумевает постоянное поселение.
- source_word: עִם אָכִישׁ
  choice: у Ахиша
  rationale: Хотя עִם буквально означает «с», в русском сочетание «жил у Ахиша» естественно передаёт проживание рядом с ним или под его покровительством, не добавляя идеи совместного дома.
- source_word: בְּגַת
  choice: в Гате
  rationale: Предлог בְּ с названием города обозначает местонахождение; нормативная русская форма — «в Гате».
- source_word: הוּא וַאֲנָשָׁיו
  choice: он и его люди
  rationale: «Его люди» сохраняет широкое значение אֲנָשָׁיו; по контексту это вооружённые спутники Давида, но слово не сужено до «воинов».
- source_word: אִישׁ וּבֵיתוֹ
  choice: каждый со своими домашними
  rationale: אִישׁ употреблено дистрибутивно — «каждый», а בַּיִת означает здесь не здание, а людей его дома. «Домашние» понятно передаёт состав домохозяйства и не сужает его до ближайшей семьи.
- source_word: וּשְׁתֵּי נָשָׁיו
  choice: со своими двумя жёнами
  rationale: Фраза уточняет, кто составлял дом Давида; повтор «со своими» делает синтаксическое соответствие с предыдущей частью ясным по-русски.
- source_word: הַיִּזְרְעֵאלִית
  choice: из Изрееля
  rationale: Женская форма нисбы обозначает происхождение Ахиноам. Описательный оборот звучит естественнее современного русского «изреелитянка» и избегает неясности.
- source_word: אֵשֶׁת נָבָל
  choice: женой Навала
  rationale: Прямо передаёт конструкцию «жена Навала»; творительный падеж согласован с приложением «Авигеей».
- source_word: הַכַּרְמְלִית
  choice: из Кармила
  rationale: Нисба указывает на происхождение из библейского Кармила. Оборот исключает возможное смешение со значением «кармелитка» как представительница позднейшего религиозного ордена.
