  text: וְ/הִכָּ֤ה דָוִד֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א יְחַיֶּ֖ה אִ֣ישׁ וְ/אִשָּׁ֑ה וְ/לָקַח֩ צֹ֨אן וּ/בָקָ֜ר וַ/חֲמֹרִ֤ים וּ/גְמַלִּים֙ וּ/בְגָדִ֔ים וַ/יָּ֖שָׁב וַ/יָּבֹ֥א אֶל אָכִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/009.yaml
  text: David struck the land and left alive neither man nor woman[a], and he took sheep, cattle, donkeys, camels, and clothing. Then he returned and came to Achish.
translation:
  language: ru
  text: Давид нападал на эту землю и не оставлял в живых ни мужчин, ни женщин[a]; он забирал овец, крупный рогатый скот, ослов, верблюдов и одежду. Затем он возвращался и приходил к Ахишу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не давал жить ни мужчине, ни женщине».'
    reason: Лексическая альтернатива, более буквально передающая каузативную форму глагола חיה.
lexical_decisions:
- source_word: וְהִכָּה
  choice: разорял
  rationale: В данном контексте многократных набегов форма от נכה описывает опустошительное нападение. «Разорял» естественно по-русски передаёт поражение территории и согласуется с последующим убийством жителей, не добавляя деталей способа нападения.
- source_word: הָאָרֶץ
  choice: ту землю
  rationale: אֶרֶץ здесь означает территорию, на которую совершался набег. Указательное «ту» естественно связывает стих с названными ранее областями.
- source_word: וְלֹא יְחַיֶּה אִישׁ וְאִשָּׁה
  choice: не оставлял в живых ни мужчин, ни женщин
  rationale: Hiphil от חיה означает «сохранять жизнь, оставлять в живых». Русская формулировка прямо и без смягчения передаёт отсутствие выживших среди обоих названных полов; несовершенный вид отражает повторявшийся порядок действий.
- source_word: וְלָקַח
  choice: забирал
  rationale: לקח имеет основное значение «брать». В контексте военной добычи «забирал» звучит естественно и не преувеличивает выраженное в оригинале.
- source_word: צֹאן וּבָקָר
  choice: овец, крупный скот
  rationale: צֹאן обозначает мелкий скот, часто овец и коз, а בָּקָר — крупный рогатый скот. «Овец» сохраняет конкретность традиционного прочтения, а «крупный скот» ясно отличает вторую категорию.
- source_word: חֲמֹרִים וּגְמַלִּים וּבְגָדִים
  choice: ослов, верблюдов и одежду
  rationale: Это прямые современные русские соответствия; «одежда» употреблена как собирательное существительное, как и еврейское בְגָדִים в перечне добычи.
- source_word: וַיָּשָׁב וַיָּבֹא
  choice: Затем он возвращался и приходил
  rationale: Сохранены оба последовательных глагола. Несовершенный вид по-русски передаёт обычный результат повторявшихся набегов, описанных контекстом.
- source_word: אָכִישׁ
  choice: Ахиш
  rationale: Устоявшаяся русская библейская передача имени.
theological_decisions:
- issue: Передача жестокого действия без смягчения и без усиления
  choice: Прямо сказано, что Давид не оставлял в живых ни мужчин, ни женщин.
  alternative: Смягчить до неопределённого «не щадил никого» либо усилить словом «истреблял».
  rationale: Еврейский текст недвусмысленно говорит об отсутствии оставленных в живых, но перевод не должен ни затушёвывать убийство, ни добавлять эмоционально нагруженные характеристики.
- issue: Вид глаголов и повторяемость действий
  choice: 'Использован несовершенный вид: «разорял», «не оставлял», «забирал», «возвращался и приходил».'
  alternative: 'Передать как единичное завершённое событие: «разорил», «не оставил», «забрал», «вернулся и пришёл».'
  rationale: Контекст 1 Царств 27:8–11 описывает привычный образ действий Давида во время серии набегов; формы повествовательной последовательности в этом окружении допускают и поддерживают итеративное прочтение.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным регистром. Формулировка сохраняет суровость исходного сообщения, не архаизирует речь и не вводит богословской оценки поступков Давида.
