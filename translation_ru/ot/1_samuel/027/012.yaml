base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/012.yaml
  text: And Achish trusted David[a], saying, “He has surely made himself stink among his people in Israel[b], so he will be my servant forever.”
translation:
  language: ru
  text: 'И Анхус поверил Давиду, думая: «Он стал совершенно ненавистен своему народу, Израилю[a], поэтому навсегда будет моим слугой[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «он сделал себя зловонным среди своего народа, Израиля». Это древнееврейское выражение означает, что человек стал отвратителен или ненавистен другим.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рабом». В данном контексте, вероятно, имеется в виду постоянная зависимая служба Анхусу, а не обязательно положение раба как собственности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן בְּדָוִד
  choice: Анхус доверял Давиду
  rationale: Глагол אמן в породе хифиль с предлогом ב обозначает доверие или уверенность в ком-либо; русское «доверял Давиду» естественно передаёт межличностный смысл.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Сохранена обычная древнееврейская формула введения речи. В данном контексте она может передавать и внутреннее рассуждение Анхуса, однако перевод не устраняет эту неоднозначность.
- source_word: הַבְאֵשׁ הִבְאִישׁ
  choice: стал совершенно ненавистен
  rationale: Сочетание абсолютного инфинитива со спрягаемой формой усиливает глагол. Буквальный образ зловония здесь идиоматически означает, что Давид стал отвратителен или ненавистен; «совершенно» передаёт усиление, а буквальный образ отмечен в сноске.
- source_word: בְּעַמּוֹ בְיִשְׂרָאֵל
  choice: своему народу в Израиле
  rationale: Дательный после «ненавистен» естественно передаёт отношение Давида к его народу, а «в Израиле» сохраняет национально-географическое уточнение исходного текста.
- source_word: וְהָיָה לִי
  choice: поэтому ... будет моим
  rationale: Союз выражает вывод Анхуса из предполагаемого отчуждения Давида от Израиля; «поэтому» ясно передаёт причинно-следственную связь.
- source_word: לְעֶבֶד
  choice: слугой
  rationale: עֶבֶד может означать как слугу, так и раба. Здесь речь, вероятнее всего, о постоянной зависимой службе Давида царю Анхусу; более жёсткий вариант «рабом» сохранён в сноске как возможный.
- source_word: עוֹלָם
  choice: навсегда
  rationale: Слово обозначает неограниченно долгое будущее; «навсегда» естественно выражает уверенность Анхуса в неизменной преданности Давида.
