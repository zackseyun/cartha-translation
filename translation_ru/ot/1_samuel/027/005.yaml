  to: 'Тогда Давид сказал Ахишу: «Если я обрёл благоволение в твоих глазах, прошу, пусть мне дадут место в одном из городов в сельской местности, и я поселюсь там. Зачем рабу твоему жить вместе с тобой в царском городе[a]?»'
