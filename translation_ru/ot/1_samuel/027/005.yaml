base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/005.yaml
  text: Then David said to Achish[a], “If I have now found favor in your eyes, let them give me a place in one of the towns in the countryside, so that I may live there[c][b]. For why should your servant live with you in the royal city?”
translation:
  language: ru
  text: 'Тогда Давид сказал Ахишу: «Если я обрёл благоволение в твоих глазах, прошу, пусть мне дадут место в одном из городов в сельской местности, и я поселюсь там. Зачем рабу твоему жить вместе с тобой в царском городе[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в городе царства».'
    reason: Сноска сохраняет буквальную форму необычного еврейского выражения.
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: я обрёл благоволение в твоих глазах
  rationale: Сохраняет устойчивую еврейскую идиому и её образность; «благоволение» естественно передаёт одобрение в почтительной речи.
- source_word: נָא
  choice: передано почтительным характером всей просьбы
  rationale: Частица смягчает просьбу; отдельное «пожалуйста» в условной фразе звучало бы по-русски менее естественно.
- source_word: יִתְּנוּ לִי
  choice: пусть мне дадут
  rationale: 'Сохраняет побудительное значение формы и неопределённое множественное число: место должны предоставить люди, находящиеся под властью Ахиша.'
- source_word: בְּאַחַת עָרֵי הַשָּׂדֶה
  choice: в одном из провинциальных городов
  rationale: Передаёт буквальное «в одном из городов поля/открытой местности» как противопоставление царскому городу, не создавая неестественного русского выражения.
- source_word: וְאֵשְׁבָה שָּׁם
  choice: и я поселюсь там
  rationale: Сохраняет сочинительную связь оригинала и обычное здесь значение ישב — постоянно жить, поселиться.
- source_word: עַבְדְּךָ
  choice: рабу твоему
  rationale: Традиционная и понятная русская форма почтительного самоназвания при обращении к правителю; контекст не требует акцента на юридическом рабстве.
- source_word: בְּעִיר הַמַּמְלָכָה
  choice: в царском городе
  rationale: Естественно передаёт буквальное «город царства», то есть город пребывания царя, не уточняя сверх текста, что это столица.
- source_word: עִמָּךְ
  choice: вместе с тобой
  rationale: Ясно передаёт личную близость к Ахишу, которой касается риторический вопрос Давида.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством придворной речи. Инверсия «рабу твоему» сохраняет почтительный библейский оттенок, оставаясь понятной современному читателю.
