base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/008.yaml
  text: Then David and his men went up and made raids against the Geshurites[a], the Girzites, and the Amalekites, for these were the inhabitants of the land from ancient times, as you go to Shur[b], even to the land of Egypt.
translation:
  language: ru
  text: Давид и его люди поднялись и совершили набеги на гессуритян, гирзеев[a] и амаликитян, ибо эти народы издревле населяли землю по пути к Шуру[b], вплоть до земли Египетской.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гезреев». Написание и передача этого названия народа остаются не вполне определёнными.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский оборот буквально: «когда идёшь (приходишь) к Шуру»; это обычное географическое указание направления.'
    reason: translation_clarification
lexical_decisions:
- source_word: וַיַּעַל
  choice: поднимались
  rationale: Сохраняет обычное значение עלה — «подниматься, идти вверх». Множественное число естественно согласует сказуемое с составным подлежащим «Давид и его люди»; в данном контексте форма передаёт повторявшиеся действия.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: совершали набеги на
  rationale: В военном контексте פשט означает предпринимать грабительские набеги, а אֶל при враждебном действии естественно передаётся русским предлогом «на».
- source_word: הַגְּשׁוּרִי
  choice: гессуреев
  rationale: Устоявшаяся русская форма этнонима, обозначающая народ, а не отдельного человека.
- source_word: הגרזי
  choice: гирзеев
  rationale: Передаёт согласный состав данной еврейской формы как название народа; разночтение отражено в примечании.
- source_word: הָעֲמָלֵקִי
  choice: амаликитян
  rationale: Устоявшееся в русском библейском языке название народа, при этом понятное современному читателю.
- source_word: כִּי הֵנָּה יֹשְׁבוֹת הָאָרֶץ
  choice: ведь эти народы … населяли землю
  rationale: «Ведь» передаёт пояснительное כִּי. Указательное местоимение сохранено словом «эти», а подразумеваемое собирательное обозначение групп выражено словом «народы».
- source_word: מֵעוֹלָם
  choice: издревле
  rationale: В контексте указывает на давнее прошлое, а не на метафизическую вечность; «издревле» кратко и достойно передаёт этот смысл.
- source_word: בּוֹאֲךָ שׁוּרָה
  choice: по дороге к Суру
  rationale: Это идиоматическое географическое выражение со значением направления или пути к месту; русский перевод сохраняет ориентир, не воспроизводя неестественно местоименный суффикс второго лица.
- source_word: וְעַד אֶרֶץ מִצְרָיִם
  choice: и вплоть до Египетской земли
  rationale: Передаёт конечную границу описанной области и сохраняет существительное «земля» из еврейского текста.
