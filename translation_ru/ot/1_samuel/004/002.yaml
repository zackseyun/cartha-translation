base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/002.yaml
  text: The Philistines drew up to meet Israel[a], and the battle spread out, and Israel was defeated before the Philistines; and they struck down about four thousand men in the battle line in the field.
translation:
  language: ru
  text: Филистимляне выстроились навстречу Израилю, и сражение развернулось[a]. Израиль потерпел поражение от филистимлян, и филистимляне сразили в боевом строю, на поле около четырёх тысяч человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и войска вступили в бой». Еврейский глагол может описывать как начало сражения, так и его развёртывание.'
    reason: Лексическая неоднозначность редкого оборота וַתִּטֹּשׁ הַמִּלְחָמָה.
lexical_decisions:
- source_word: וַיַּעַרְכוּ
  choice: выстроились
  rationale: Военный контекст глагола ערך указывает на построение войска к сражению; «выстроились» передаёт это ясно и естественно.
- source_word: לִקְרַאת
  choice: навстречу
  rationale: Сочетание обозначает движение или расположение для встречи с противником; в данном контексте враждебный смысл уже задан сражением.
- source_word: וַתִּטֹּשׁ הַמִּלְחָמָה
  choice: сражение развернулось
  rationale: Редкое употребление נטש допускает образ развёртывания или распространения боя; перевод сохраняет этот образ, не исключая смысла начала непосредственного столкновения.
- source_word: וַיִּנָּגֶף ... לִפְנֵי
  choice: потерпел поражение от
  rationale: Нифаль глагола נגף в военном обороте с לפני обозначает поражение перед неприятелем; естественный русский оборот передаёт смысл без смешения с последующим сообщением о потерях.
- source_word: וַיַּכּוּ
  choice: сразили
  rationale: Глагол נכה в контексте подсчёта боевых потерь обозначает поражение людей насмерть; «сразили» сохраняет военную окраску и не звучит архаично.
- source_word: בַמַּעֲרָכָה
  choice: в боевом строю
  rationale: מַעֲרָכָה обозначает боевое построение или линию войск; выбранный вариант сохраняет конкретный военный образ.
- source_word: בַשָּׂדֶה
  choice: на поле
  rationale: Прямое обозначение открытой местности передано без добавочного уточнения «открытом», отсутствующего в еврейском тексте.
- source_word: כְּאַרְבַּעַת אֲלָפִים אִישׁ
  choice: около четырёх тысяч человек
  rationale: Префикс כ־ при числе выражает приблизительность, а איש здесь служит счётным обозначением людей, по контексту — участников боя.
