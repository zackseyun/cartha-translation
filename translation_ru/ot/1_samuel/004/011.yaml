lexical_decisions:
- source_word: אֲרוֹן אֱלֹהִים
  choice: Ковчег Божий
  rationale: Передаёт конструкцию принадлежности буквально и сохраняет торжественное библейское звучание; форма «Божий» естественна для современного литературного русского языка.
- source_word: נִלְקָח
  choice: был захвачен
  rationale: Нифаль выражает пассивное действие, а военный контекст указывает именно на захват неприятелем, а не просто на перемещение.
- source_word: וּשְׁנֵי בְנֵי עֵלִי
  choice: а оба сына Илия
  rationale: Числительное обозначает двух известных из контекста сыновей; русское «оба» естественно передаёт эту определённость. Союз «а» ясно соединяет две части сообщения, не меняя смысла еврейского ו.
- source_word: מֵתוּ
  choice: погибли
  rationale: В данном повествовании речь идёт о смерти в сражении; «погибли» естественно передаёт этот контекст, не добавляя способа смерти.
- source_word: חָפְנִי וּפִינְחָס
  choice: Хофни и Финеес
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён; приложение после слов «оба сына Илия» сохранено.
