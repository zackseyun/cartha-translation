  to: 'Когда народ пришёл в стан, старейшины Израиля сказали: «Почему Яхве сегодня поразил нас перед филистимлянами? Принесём к себе из Силома ковчег завета Яхве; пусть он[a] будет среди нас и спасёт нас из рук наших врагов».'
