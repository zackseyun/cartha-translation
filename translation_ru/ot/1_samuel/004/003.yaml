source:
  edition: WLC
  text: וַ/יָּבֹ֣א הָ/עָם֮ אֶל הַֽ/מַּחֲנֶה֒ וַ/יֹּֽאמְרוּ֙ זִקְנֵ֣י יִשְׂרָאֵ֔ל לָ֣/מָּה נְגָפָ֧/נוּ יְהוָ֛ה הַ/יּ֖וֹם לִ/פְנֵ֣י פְלִשְׁתִּ֑ים נִקְחָ֧ה אֵלֵ֣י/נוּ מִ/שִּׁלֹ֗ה אֶת אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה וְ/יָבֹ֣א בְ/קִרְבֵּ֔/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/כַּ֥ף אֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/003.yaml
  text: When the people came into the camp[a], the elders of Israel said, “Why has Yahweh struck us down today before the Philistines? Let us bring here from Shiloh the ark of the covenant of Yahweh, so that it may come into our midst and save us from the hand of our enemies.”
translation:
  language: ru
  text: 'Когда народ пришёл в стан, старейшины Израиля сказали: «Почему Яхве сегодня поразил нас перед филистимлянами? Принесём к себе из Силома ковчег завета Яхве; пусть он[a] будет среди нас и спасёт нас из рук наших врагов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «он» формально относится к ковчегу как ближайшему названному предмету; его также можно понимать как более непосредственную отсылку к Яхве, чьё присутствие связывали с ковчегом.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: народ
  rationale: Обычное значение существительного; военный контекст уже показывает, что речь идёт об израильском войске, поэтому уточнение «воины» не требуется.
- source_word: הַמַּחֲנֶה
  choice: стан
  rationale: Естественное для библейского повествования обозначение военного лагеря; сохраняет сжатость оригинала.
- source_word: נְגָפָנוּ
  choice: поразил нас
  rationale: Передаёт прямое действие Яхве и смысл поражения в бою, не ослабляя причинную и богословскую напряжённость вопроса.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: перед филистимлянами
  rationale: Близко воспроизводит еврейский предлог и понятно обозначает поражение перед лицом противника.
- source_word: נִקְחָה אֵלֵינוּ
  choice: принесём к себе
  rationale: Передаёт когортативное предложение и направленность движения ковчега из Силома к израильскому стану.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: Точно и естественно передаёт еврейскую сопряжённую конструкцию и её заветное содержание.
- source_word: וְיָבֹא בְקִרְבֵּנוּ
  choice: пусть он придёт к нам
  rationale: Мужской род слова «ковчег» согласуется с глаголом в оригинале, но местоимение также сохраняет возможность соотнести действие с Яхве.
- source_word: וְיֹשִׁעֵנוּ
  choice: и спасёт нас
  rationale: Передаёт каузативную форму корня ישׁע без сведения её значения только к военной победе.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: из рук наших врагов
  rationale: Естественный русский эквивалент еврейской идиомы власти или захвата; множественное «рук» нормативно по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В оригинале стоит личное имя Бога; транслитерация сохраняет его отличие от титула.
- issue: Субъект глаголов וְיָבֹא и וְיֹשִׁעֵנוּ
  choice: «он» — формально ковчег, с сохранением возможной отсылки к Яхве
  alternative: Яхве придёт к нам и спасёт нас
  rationale: Ближайший грамматический референт — ковчег, однако единственное число и связь ковчега с присутствием Яхве допускают более личное понимание. Русская формулировка не устраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно библейской лексикой («стан», «ковчег завета»). Синтаксис остаётся ясным для широкого читателя; подлинная неоднозначность субъекта сохранена.
