base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/006.yaml
  text: When the Philistines heard the sound of the shouting[a], they said[b], “What is this great sound of shouting in the camp of the Hebrews?” And they knew that the ark of Yahweh had come into the camp.
translation:
  language: ru
  text: 'Когда филистимляне услышали громкий крик[a], они спросили: «Что это за громкий крик в стане евреев?» И узнали, что ковчег Яхве[b] прибыл в стан.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крик»; в военном контексте возможно также: «боевой клич».'
    reason: lexical_alternative
  - marker: b
    text: Яхве — передача еврейского имени Бога יהוה; традиционно также передаётся как «Господь».
    reason: alternative_rendering
lexical_decisions:
- source_word: קוֹל הַתְּרוּעָה
  choice: громкие возгласы
  rationale: Сочетание обозначает слышимый громкий крик множества людей. По-русски «громкие возгласы» естественно передаёт смысл, не уточняя его как воинский клич.
- source_word: מֶה קוֹל
  choice: что означают
  rationale: Буквально вопрос звучит как «что [это за] звук», но в данном контексте филистимляне спрашивают о причине или значении шума; выбран естественный русский вопрос.
- source_word: הַגְּדוֹלָה
  choice: громкие
  rationale: Буквально «великие, большие»; применительно к возгласам по-русски естественно передать их силу словом «громкие».
- source_word: מַחֲנֶה
  choice: стан
  rationale: В повествовании речь идёт о военном лагере; «стан» сохраняет библейское достоинство стиля и остаётся понятным современному читателю.
- source_word: הָעִבְרִים
  choice: евреев
  rationale: Сохранён этноним, употреблённый филистимлянами, без замены на «израильтян».
- source_word: וַיֵּדְעוּ
  choice: И узнали
  rationale: В контексте глагол описывает получение новой информации, поэтому «узнали» точнее естественного русского повествования, чем статичное «знали».
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: «Ковчег» — установленное русское обозначение священного ларца; личное имя יהוה передано как «Яхве», а не заменено титулом.
- source_word: בָּא
  choice: прибыл
  rationale: Глагол обозначает уже совершившееся к моменту получения известия прибытие ковчега; «прибыл» естественно выражает это по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон — личное имя Бога. Форма «Яхве» сохраняет различие между именем и титулом, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной повествовательной лексикой. «Стан» и «ковчег» уместны для историко-библейского контекста; синтаксис прямой и доступный.
