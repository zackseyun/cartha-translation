  text: וַ/יַּ֨עַן הַֽ/מְבַשֵּׂ֜ר וַ/יֹּ֗אמֶר נָ֤ס יִשְׂרָאֵל֙ לִ/פְנֵ֣י פְלִשְׁתִּ֔ים וְ/גַ֛ם מַגֵּפָ֥ה גְדוֹלָ֖ה הָיְתָ֣ה בָ/עָ֑ם וְ/גַם שְׁנֵ֨י בָנֶ֜י/ךָ מֵ֗תוּ חָפְנִי֙ וּ/פִ֣ינְחָ֔ס וַ/אֲר֥וֹן הָ/אֱלֹהִ֖ים נִלְקָֽחָה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/017.yaml
  text: The messenger answered and said[a], “Israel has fled before the Philistines, and there has also been a great slaughter among the people; and your two sons also are dead, Hophni and Phinehas[b]; and the ark of God has been taken.”
translation:
  language: ru
  text: 'Вестник ответил: «Израиль бежал от филистимлян, и народ понёс тяжёлые потери[a]. Оба твоих сына, Хофни и Финеес, погибли, а Божий ковчег захвачен[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народ потерпел тяжёлое поражение». Еврейское слово может означать сильный удар, поражение, мор или массовую гибель; здесь речь идёт о потерях в сражении.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «взят».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְבַשֵּׂר
  choice: вестник
  rationale: Причастная форма обозначает человека, принёсшего весть; «вестник» естественно и кратко передаёт эту роль в повествовании.
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ответил
  rationale: В русском повествовании сочетание «ответил и сказал» избыточно; один глагол «ответил» естественно передаёт смысл обоих еврейских глаголов.
- source_word: נָס יִשְׂרָאֵל לִפְנֵי פְלִשְׁתִּים
  choice: Израиль бежал от филистимлян
  rationale: נָס означает «бежать», а сочетание לִפְנֵי с противником описывает бегство перед наступающим врагом; по-русски естественно «бежал от филистимлян».
- source_word: מַגֵּפָה גְדוֹלָה
  choice: тяжёлые потери
  rationale: В военном контексте выражение обозначает сильный удар, разгром или большое число убитых. «Тяжёлые потери» ясно передаёт смысл, не ограничивая его исключительно резнёй.
- source_word: בָעָם
  choice: народ
  rationale: Сохранено прямое значение «народ»; в контексте понятно, что речь идёт об израильтянах, участвовавших в сражении.
- source_word: שְׁנֵי בָנֶיךָ
  choice: оба твоих сына
  rationale: Так по-русски естественно обозначаются два уже известных адресату сына.
- source_word: מֵתוּ
  choice: погибли
  rationale: В сообщении о смерти в бою «погибли» естественнее русского «умерли» и сохраняет значение завершившегося события.
- source_word: חָפְנִי וּפִינְחָס
  choice: Хофни и Финеес
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён, понятные читателю.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: Божий ковчег
  rationale: Естественный русский эквивалент конструкции «ковчег Бога», сохраняющий её значение.
- source_word: נִלְקָחָה
  choice: захвачен
  rationale: Пассивная форма буквально означает «взят»; в контексте военной добычи «захвачен» точно и естественно выражает смысл.
