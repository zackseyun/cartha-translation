base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/008.yaml
  text: Woe to us! Who can deliver us from the hand of these mighty gods? These are the gods who struck Egypt with every plague in the wilderness[a][b].
translation:
  language: ru
  text: Горе нам! Кто избавит нас от руки этих могущественных богов?[a] Это те боги, которые поразили Египет всевозможными казнями в пустыне.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этого могущественного Бога». Филистимляне употребляют формы множественного числа, понимая Бога Израиля в свете собственных многобожных представлений.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по еврейскому тексту: «в пустыне». Выражение трудно объяснить в данном контексте, поскольку бедствия постигли Египет до странствования Израиля по пустыне; перевод следует масоретскому тексту без исправления.'
    reason: textual_variant
lexical_decisions:
- source_word: א֣וֹי לָ֔נוּ
  choice: Горе нам!
  rationale: Устойчиво и точно передаёт возглас страха и ожидания гибели, сохраняя достоинство библейской речи.
- source_word: מִ֣י יַצִּילֵ֔נוּ
  choice: Кто избавит нас
  rationale: Глагол נצל в породе хифиль означает «избавить, спасти, вырвать из опасности»; русский вопрос без добавления «может» сохраняет форму еврейского текста и естественно звучит как отчаянный риторический вопрос.
- source_word: מִיַּד
  choice: от руки
  rationale: Сохранена прозрачная древнееврейская метафора руки как власти и силы.
- source_word: הָאֱלֹהִים הָאַדִּירִים הָאֵלֶּה
  choice: этих могущественных богов
  rationale: Множественные формы прилагательного и указательного слова, а далее причастия, отражают политеистическое восприятие филистимлян. «Могущественных» естественно передаёт אַדִּירִים.
- source_word: אֵלֶּה הֵם הָאֱלֹהִים
  choice: Это те боги
  rationale: Естественная русская отождествительная конструкция, сохраняющая указательный акцент оригинала.
- source_word: הַמַּכִּים אֶת מִצְרַיִם
  choice: которые поразили Египет
  rationale: Причастие передано относительным придаточным о известном прошлом действии; «Египет» может обозначать страну и её народ совокупно.
- source_word: בְּכָל מַכָּה
  choice: всевозможными бедствиями
  rationale: מַכָּה означает удар, поражение или бедствие. Множественное «всевозможными бедствиями» естественно передаёт собирательное כָל מַכָּה и не ограничивает выражение техническим обозначением египетских казней.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Прямо передаёт масоретский текст, не устраняя историко-контекстуальную трудность.
theological_decisions:
- issue: Передача אֱלֹהִים в речи филистимлян
  choice: боги
  alternative: Бог
  rationale: Хотя речь идёт о Боге Израиля, филистимляне говорят о Нём в категориях собственного многобожия; множественные согласованные формы в еврейском тексте поддерживают перевод во множественном числе.
- issue: Трудное выражение בַּמִּדְבָּר
  choice: в пустыне
  alternative: гармонизировать, опустить или переосмыслить выражение
  rationale: Масоретский текст прямо содержит «в пустыне», хотя египетские бедствия предшествовали странствованию Израиля по пустыне. Напряжение сохранено и пояснено в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены эмоциональная сила возгласа, метафора «от руки», перспектива филистимлян и трудность заключительной фразы; архаизмы и конфессионально окрашенная гармонизация исключены.
