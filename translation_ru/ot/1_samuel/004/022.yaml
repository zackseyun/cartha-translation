  text: And she said[a], “The glory has departed from Israel[b], because the ark of God has been taken.”
translation:
  language: ru
  text: 'И она сказала: «Слава отошла[a] от Израиля, потому что ковчег Божий был взят».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Слава ушла из Израиля в изгнание». Еврейский глагол может означать как удаление, так и уход в изгнание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: И сказала она
  rationale: Последовательная форма с וַ продвигает повествование; такой порядок слов сохраняет достоинство библейского рассказа и остаётся естественным по-русски.
- source_word: גָּלָה
  choice: отошла
  rationale: Глагол обозначает удаление, уход, а нередко и уход в изгнание. «Отошла» естественно сочетается со «славой», передаёт совершившуюся утрату и не устраняет более сильный оттенок изгнания, отмеченный в сноске.
- source_word: כָבוֹד
  choice: слава
  rationale: В контексте речь идёт о славе и чести, связанных с Божьим присутствием среди Израиля. Традиционное и точное «слава» сохраняет богословскую насыщенность слова.
- source_word: מִיִּשְׂרָאֵל
  choice: от Израиля
  rationale: Предлог מִן выражает отделение или удаление; по-русски это естественно передаётся сочетанием «от Израиля».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину сказанного. «Потому что» ясно выражает причинную связь, не исключая возможного пояснительного оттенка «ибо».
- source_word: נִלְקַח
  choice: был взят
  rationale: Пассивная форма глагола לקח буквально означает, что ковчег был взят. Это сохраняет широту еврейского выражения; «захвачен» было бы более узким военным истолкованием.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ковчег Божий
  rationale: Так передаётся конструкция принадлежности; выражение естественно для современного литературного русского и сохраняет знакомый библейский регистр.
theological_decisions:
- issue: Связь «славы» Израиля с ковчегом и Божьим присутствием
  choice: Сохранить формулировку «слава отошла», связывая её с утратой ковчега, но не отождествляя прямо славу ни с самим ковчегом, ни с Богом.
  alternative: Понять «славу» только как национальную честь Израиля либо прямо сказать, что Бог покинул Израиль.
  rationale: Контекст придаёт словам богословский смысл, выходящий за рамки военного позора, однако стих не формулирует учение о том, каким образом Божье присутствие связано с ковчегом. Перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Инверсия «сказала она» уместна при вводе прямой речи; выражения «слава» и «ковчег Божий» сохраняют узнаваемую библейскую лексику без архаизации.
