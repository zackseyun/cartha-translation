  text: Then a man of Benjamin ran from the battle line and came to Shiloh that same day[b][a], with his clothes torn and dirt on his head.
translation:
  language: ru
  text: В тот день один человек из колена Вениамина прибежал с поля боя[a] в Силом. Одежда на нём была разорвана, а на голове у него была земля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из боевого строя». Еврейское слово может обозначать боевой строй, линию сражения или само место боя.'
    reason: lexical_alternative
  - marker: b
    text: Разорванная одежда и земля на голове были обычными знаками скорби, бедствия или тяжёлого потрясения.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּרָץ
  choice: прибежал
  rationale: Глагол רוץ обозначает быстрый бег; «прибежал» естественно сочетается с указанным местом назначения и не приписывает человеку мотив бегства.
- source_word: אִישׁ בִּנְיָמִן
  choice: один человек из колена Вениамина
  rationale: Передаёт племенную принадлежность ясно и естественно для современного русского читателя; слово «один» здесь вводит нового участника повествования, а не подчёркивает число.
- source_word: מֵהַמַּעֲרָכָה
  choice: с поля боя
  rationale: מַעֲרָכָה обозначает боевой строй или место боевого столкновения. «С поля боя» звучит естественно по-русски, а более точное значение отмечено в сноске.
- source_word: וַיָּבֹא שִׁלֹה
  choice: прибежал … в Силом
  rationale: Направление движения выражено формой «в Силом»; значение בוא объединено с предшествующим глаголом бега без потери содержания.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямо и без усиления передаёт буквальное временное указание; «в тот же день» возможно по контексту, но частица со значением «же/самый» в еврейском тексте отсутствует.
- source_word: וּמַדָּיו קְרֻעִים
  choice: одежда на нём была разорвана
  rationale: מַדִּים здесь обозначает одежду, а пассивное причастие קְרֻעִים — её разорванное состояние. Формулировка естественна и сохраняет образ знака скорби.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: а голова посыпана землёй
  rationale: אֲדָמָה — «земля, почва», поэтому «землёй» точнее, чем «пеплом» или более узким «пылью». Русская конструкция естественно описывает совершённый обрядовый жест.
