  text: וַ/יִּֽרְאוּ֙ הַ/פְּלִשְׁתִּ֔ים כִּ֣י אָמְר֔וּ בָּ֥א אֱלֹהִ֖ים אֶל הַֽ/מַּחֲנֶ֑ה וַ/יֹּאמְרוּ֙ א֣וֹי לָ֔/נוּ כִּ֣י לֹ֥א הָיְתָ֛ה כָּ/זֹ֖את אֶתְמ֥וֹל שִׁלְשֹֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/007.yaml
  text: The Philistines were afraid[a], for they said, “God has come into the camp.” And they said, “Woe to us! For nothing like this has happened before.”
translation:
  language: ru
  text: 'Филистимляне испугались, ибо сказали: «Бог[a] пришёл в стан». И они сказали: «Горе нам! Прежде такого не бывало».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бог пришёл в стан». Еврейское существительное אֱלֹהִים имеет форму множественного числа, но глагол «пришёл» стоит в единственном числе, что поддерживает основной перевод «Бог».'
    reason: Сохраняет возможное языческое восприятие в речи филистимлян и отмечает морфологическую неоднозначность еврейского слова без утверждения варианта, хуже согласующегося с единственным числом глагола.
lexical_decisions:
- source_word: וַיִּֽרְאוּ
  choice: испугались
  rationale: Форма wayyiqtol от ירא передаёт непосредственную реакцию филистимлян; совершенный вид естественно выражает наступление страха в русском повествовании.
- source_word: הַפְּלִשְׁתִּים
  choice: филистимляне
  rationale: Устоявшееся русское название этого народа.
- source_word: כִּי אָמְרוּ
  choice: потому что говорили
  rationale: כִּי вводит причину их страха, а форма אָמְרוּ сообщает содержание речи; несовершенный вид «говорили» естественно передаёт распространённую среди них реакцию.
- source_word: בָּא אֱלֹהִים
  choice: Бог пришёл
  rationale: Глагол בָּא стоит в единственном числе, поэтому אֱלֹהִים здесь синтаксически понимается как единственное число. Прописная буква соответствует восприятию происходящего как прихода Бога Израиля, но возможное языческое понимание сохранено в сноске.
- source_word: אֶל הַמַּחֲנֶה
  choice: в стан
  rationale: Предлог אֶל обозначает направленность движения; «в стан» кратко и естественно передаёт прибытие в военный лагерь.
- source_word: אוֹי לָנוּ
  choice: Горе нам!
  rationale: Сохраняет силу возгласа бедствия и ожидания гибели, не прибегая к архаичному синтаксису.
- source_word: לֹא הָיְתָה כָּזֹאת
  choice: такого не бывало
  rationale: Естественная русская идиома, точно выражающая отсутствие подобного события.
- source_word: אֶתְמוֹל שִׁלְשֹׁם
  choice: прежде
  rationale: Парное выражение буквально связано со вчерашним и позавчерашним днём, но идиоматически означает прежнее время; «прежде» сохраняет этот смысл без неоправданного ограничения двумя днями.
theological_decisions:
- issue: Передача אֱלֹהִים в речи филистимлян
  choice: Бог
  alternative: бог; боги
  rationale: Единственное число глагола בָּא убедительно поддерживает единственного референта. Контекст указывает на Бога Израиля, с чьим ковчегом филистимляне связывают крик в стане. Однако речь принадлежит язычникам, а форма אֱלֹהִים морфологически множественная, поэтому возможное понимание «бог» отмечено в сноске; вариант «боги» менее согласуется с единственным числом глагола.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским повествовательным регистром. «Стан» сохраняет военный контекст и остаётся понятным; повтор «И сказали они» передаёт еврейскую повествовательную структуру.
