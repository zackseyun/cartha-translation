base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/021.yaml
  text: And she named the boy Ichabod[a], saying, “The glory has departed from Israel,” because the ark of God had been taken, and because of her father-in-law and her husband.
translation:
  language: ru
  text: 'Она назвала мальчика Ихаводом[a], сказав: «Слава отошла от Израиля», потому что ковчег Божий был захвачен, а также из-за её свёкра и мужа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Ихавод» созвучно еврейскому выражению, которое можно понять как «нет славы» или, возможно, «где слава?».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא לַנַּעַר
  choice: назвала она мальчика
  rationale: В контексте наречения имени קרא с ל естественно передаётся глаголом «назвать»; נַעַר здесь обозначает новорождённого мальчика.
- source_word: אִי כָבוֹד
  choice: Ихавод
  rationale: Личное имя передано традиционной русской библейской транслитерацией, а возможные значения отражены в сноске.
- source_word: גָּלָה כָבוֹד מִיִּשְׂרָאֵל
  choice: Отошла слава от Израиля
  rationale: Глагол גלה выражает удаление или уход, иногда изгнание; «отошла» естественно сочетается со «славой» и не устраняет образ удаления.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: потому что ковчег Божий был захвачен
  rationale: Трудное אֶל по контексту понято причинно, а пассивный инфинитив הִלָּקַח передан как завершившееся взятие ковчега врагом.
- source_word: וְאֶל חָמִיהָ וְאִישָׁהּ
  choice: а также из-за её свёкра и мужа
  rationale: Повторяемое אֶל продолжает причинный ряд; איש с суффиксом в данном контексте означает «её муж».
theological_decisions:
- issue: Значение «славы» в отношении Израиля
  choice: слава
  alternative: слава Божья / честь
  rationale: Краткое כָבוֹד может одновременно указывать на явленное присутствие Бога, связанное с ковчегом, и на утраченную честь Израиля. Перевод не сужает эту смысловую напряжённость.
- issue: Связь смерти свёкра и мужа с наречением имени
  choice: сохранить их как дополнительные причины наречения
  alternative: связать объяснение имени только с захватом ковчега
  rationale: Еврейский текст повторяет אֶל перед упоминанием свёкра и мужа, включая их гибель в ряд обстоятельств, хотя в центре объяснения остаётся захват ковчега.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок «назвала она» сохраняет повествовательную торжественность, не создавая архаичной тяжеловесности.
