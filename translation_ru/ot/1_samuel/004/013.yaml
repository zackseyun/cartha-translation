base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/013.yaml
  text: When he came[a], behold, Eli was sitting on the seat by the road, watching, because his heart trembled for the ark of God. And the man came to report it in the city[b], and the whole city cried out.
translation:
  language: ru
  text: Когда он пришёл, Илий сидел у дороги на своём месте и вглядывался вдаль, потому что сердце его трепетало за ковчег Божий. Тот человек пришёл сообщить весть в городе, и весь город поднял крик.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבוֹא וְהִנֵּה
  choice: Когда он пришёл, Илий сидел
  rationale: Последовательность повествования и вводное הִנֵּה естественно переданы через временную конструкцию и непосредственное изображение сцены; отдельное «вот» по-русски здесь звучало бы тяжеловесно.
- source_word: יֹשֵׁב עַל הַכִּסֵּא יַד דֶּרֶךְ
  choice: сидел на сиденье у дороги
  rationale: «Сиденье» сохраняет нейтральное значение כִּסֵּא, а идиома יַד דֶּרֶךְ естественно означает местоположение у дороги.
- source_word: מְצַפֶּה
  choice: всматривался вдаль
  rationale: Причастие выражает напряжённое, ожидающее наблюдение; такой перевод естественно передаёт его в русском контексте.
- source_word: כִּי הָיָה לִבּוֹ חָרֵד עַל אֲרוֹן הָאֱלֹהִים
  choice: потому что сердце его трепетало за ковчег Божий
  rationale: Сохранён конкретный древнееврейский образ трепещущего сердца и направленность тревоги на ковчег, без сведения выражения лишь к отвлечённому беспокойству.
- source_word: וְהָאִישׁ בָּא לְהַגִּיד בָּעִיר
  choice: Тот человек вошёл в город, чтобы сообщить весть
  rationale: «Тот человек» отсылает к ранее упомянутому вестнику. При בָּא לְהַגִּיד בָּעִיר пространственное отношение допускает понимание прибытия и сообщения внутри города; «весть» естественно восполняет подразумеваемый объект.
- source_word: וַתִּזְעַק כָּל הָעִיר
  choice: и весь город поднял крик
  rationale: זעק обозначает громкий крик бедствия или тревоги; метонимия «весь город» сохранена.
theological_decisions:
- issue: Характер тревоги Илия о ковчеге
  choice: сердце его трепетало за ковчег Божий
  alternative: он тревожился о ковчеге Божьем
  rationale: Более буквальный образ сохраняет эмоциональную и богословскую напряжённость исходного текста, не уточняя причины тревоги сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; сохранены метонимия «весь город» и образ трепещущего сердца.
