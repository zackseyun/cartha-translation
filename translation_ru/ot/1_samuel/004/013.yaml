revisions:
- from: Когда он пришёл, Илий сидел на сиденье у дороги и всматривался вдаль, потому что сердце его трепетало за ковчег Божий. Тот человек вошёл в город, чтобы сообщить весть, и весь город поднял крик.
  to: Когда он пришёл, Илий сидел у дороги на своём месте и вглядывался вдаль, потому что сердце его трепетало за ковчег Божий. Тот человек пришёл сообщить весть в городе, и весь город поднял крик.
  rationale: Убрано невыраженное в оригинале «вошёл в город». «На своём месте» естественно передаёт здесь значение כִּסֵּא как места, на котором сидел Илий, не превращая его в бытовой «стул». Сохранены повествовательная связка, тревожное ожидание, образ трепещущего сердца, наименование ковчега и метонимия общего городского крика.
