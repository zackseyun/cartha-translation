source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר שְׁמוּאֵ֖ל לְ/כָל יִשְׂרָאֵ֑ל וַ/יֵּצֵ֣א יִשְׂרָאֵל֩ לִ/קְרַ֨את פְּלִשְׁתִּ֜ים לַ/מִּלְחָמָ֗ה וַֽ/יַּחֲנוּ֙ עַל הָ/אֶ֣בֶן הָעֵ֔זֶר וּ/פְלִשְׁתִּ֖ים חָנ֥וּ בַ/אֲפֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/001.yaml
  text: And the word of Samuel came to all Israel[a]. Then Israel went out to meet the Philistines in battle, and they camped at Ebenezer[b], while the Philistines camped at Aphek.
translation:
  language: ru
  text: И слово Самуила дошло до всего Израиля[a]. Затем Израиль выступил навстречу филистимлянам для битвы. Израильтяне расположились станом у Эвен-Эзера[b], а филистимляне — в Афеке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весть о Самуиле дошла до всего Израиля». Еврейское выражение может означать слово или послание Самуила, а также весть о нём; в данном контексте, вероятно, имеется в виду его пророческое слово.'
    reason: alternative_reading
  - marker: b
    text: Эвен-Эзер означает «камень помощи». Здесь это название места.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר שְׁמוּאֵל לְכָל יִשְׂרָאֵל
  choice: И слово Самуила дошло до всего Израиля
  rationale: Передаёт идиоматический смысл того, что слово или весть Самуила достигли всего народа, и сохраняет существительное «слово», связывающее фразу с пророческим служением Самуила в предшествующем контексте.
- source_word: וַיֵּצֵא יִשְׂרָאֵל
  choice: Израиль выступил
  rationale: Глагол «выступил» естественен в военном повествовании и передаёт יצא без излишней конкретизации способа передвижения.
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: навстречу филистимлянам
  rationale: Сохраняет основное пространственное значение לקראת; в сочетании с последующим указанием на битву враждебный характер встречи понятен из контекста.
- source_word: לַמִּלְחָמָה
  choice: для битвы
  rationale: Ясно выражает цель выступления Израиля и непосредственно соответствует военному значению מִלְחָמָה.
- source_word: וַיַּחֲנוּ
  choice: Израильтяне расположились станом
  rationale: Множественное число глагола относится к собирательному «Израиль». Явное «израильтяне» устраняет неясность русского местоимения, а «расположились станом» естественно передаёт военную стоянку.
- source_word: עַל הָאֶבֶן הָעֵזֶר
  choice: у Эвен-Эзера
  rationale: Сочетание функционирует как географическое название; транслитерация сохраняет имя места, а предлог «у» естественно передаёт расположение лагеря рядом с ним.
- source_word: וּפְלִשְׁתִּים חָנוּ בַאֲפֵק
  choice: а филистимляне — в Афеке
  rationale: Союз «а» естественно сопоставляет расположение двух войск. Пропуск повторного сказуемого допустим и ясен по-русски; «в Афеке» соответствует обычному употреблению русского предлога с названием города или местности.
theological_decisions:
- issue: Означает ли דְבַר שְׁמוּאֵל пророческое слово Самуила или весть о нём
  choice: «слово Самуила» как его слово или послание, достигшее всего Израиля
  alternative: «весть о Самуиле» распространилась по всему Израилю
  rationale: Непосредственный контекст конца 3-й главы связывает Самуила с открываемым через него словом Господа и с признанием его пророком. При этом еврейская конструкция допускает понимание как вести о Самуиле, поэтому альтернативное прочтение отмечено в сноске, а основной текст не уточняет содержание слова.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Формы «выступил» и «расположились станом» поддерживают военный контекст без архаизации; географические названия переданы привычной русской транслитерацией.
