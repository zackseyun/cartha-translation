base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/010.yaml
  text: So the Philistines fought[a], and Israel was defeated, and each man fled to his tent. The slaughter was very great[b], and thirty thousand foot soldiers from Israel fell.
translation:
  language: ru
  text: 'Филистимляне сражались, и Израиль был разбит. Каждый бежал к себе в шатёр[a]. Побоище было огромным[b]: из израильтян пало тридцать тысяч пеших воинов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к себе домой». Буквально в еврейском тексте: «к своему шатру»; это выражение может обозначать место, где человек живёт.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Поражение было чрезвычайно тяжёлым». Еврейское выражение буквально говорит об очень великом «ударе» или «поражении».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ פְלִשְׁתִּים
  choice: Филистимляне вступили в бой
  rationale: Форма глагола לחם обозначает военное сражение; «вступили в бой» естественно передаёт начало следующего этапа повествования.
- source_word: וַיִּנָּגֶף יִשְׂרָאֵל
  choice: Израиль был разбит
  rationale: В контексте битвы נָגַף означает потерпеть поражение; перевод не смешивает само поражение с последующим бегством.
- source_word: וַיָּנֻסוּ אִישׁ לְאֹהָלָיו
  choice: Каждый бежал к своему шатру
  rationale: אִישׁ имеет распределительное значение «каждый», а אֹהֶל буквально означает «шатёр» и здесь может также обозначать жилище.
- source_word: וַתְּהִי הַמַּכָּה גְּדוֹלָה מְאֹד
  choice: Побоище было очень велико
  rationale: מַכָּה буквально означает удар или поражение, а в данном военном контексте, перед подсчётом павших, указывает на массовую гибель. Формулировка сохраняет образ и силу исходного выражения.
- source_word: וַיִּפֹּל מִיִּשְׂרָאֵל
  choice: из израильтян пало
  rationale: נפל применительно к воинам в битве означает погибнуть; русское «пало» сохраняет военный регистр.
- source_word: שְׁלֹשִׁים אֶלֶף רַגְלִי
  choice: тридцать тысяч пеших воинов
  rationale: Число передано прямо, а רַגְלִי обозначает воинов, сражавшихся пешими, в отличие от конных или колесничих.
