  text: וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן בְּרִית יְהוָה֙ אֶל הַֽ/מַּחֲנֶ֔ה וַ/יָּרִ֥עוּ כָל יִשְׂרָאֵ֖ל תְּרוּעָ֣ה גְדוֹלָ֑ה וַ/תֵּהֹ֖ם הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/005.yaml
  text: When the ark of the covenant of Yahweh came into the camp[a], all Israel shouted with a great shout, and the earth resounded.
translation:
  language: ru
  text: Когда ковчег завета Яхве внесли в стан, весь Израиль издал громкий крик, и земля загудела.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земля содрогнулась». Еврейский глагол может обозначать как гул и смятение, так и дрожание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: Когда ... внесли
  rationale: 'Оборот вводит придаточное времени. В русском контексте естественно употребить неопределённо-личную конструкцию «ковчег ... внесли»: неодушевлённый ковчег не приходит сам, а его приносят люди.'
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: Передаёт всю цепочку сопряжённого состояния и сохраняет личное имя Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан распространённой в современной русской библеистике транслитерацией личного имени, а не заменён титулом.
- source_word: הַמַּחֲנֶה
  choice: стан
  rationale: В военном повествовании «стан» — краткое, понятное и стилистически достойное обозначение расположения израильского войска.
- source_word: וַיָּרִיעוּ כָל־יִשְׂרָאֵל תְּרוּעָה גְדוֹלָה
  choice: весь Израиль издал громкий крик
  rationale: Глагол и однокоренное существительное выражают усиленную идею громкого возгласа. Формулировка сохраняет коллективный субъект и силу реакции, не уточняя без основания, был ли это боевой клич или ликование.
- source_word: וַתֵּהֹם
  choice: загудела
  rationale: Глагол допускает шум, гул, смятение или сотрясение. «Загудела» естественно связывает реакцию земли с мощью крика и не утверждает однозначно, что произошло буквальное землетрясение.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Прямой и в данном образе естественный эквивалент; контекст не требует понимать слово как политическую территорию.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Его транслитерация сохраняет различие между именем и титулом, не добавляя конфессионального толкования.
- issue: Характер реакции земли
  choice: земля загудела
  alternative: земля содрогнулась
  rationale: Еврейский глагол допускает как акустический гул и смятение, так и дрожание. Основной текст не превращает образ однозначно в сообщение о землетрясении, а альтернативный смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Стан» уместен в древнем военном контексте; синтаксис краток и удобен для чтения вслух.
