base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/009.yaml
  text: Be strong and be men[a], O Philistines, lest you become servants to the Hebrews as they have been to you[b]. Be men and fight!
translation:
  language: ru
  text: Крепитесь и будьте мужчинами[a], филистимляне, чтобы вам не стать рабами у евреев, как евреи были рабами у вас[b]. Будьте мужчинами и сражайтесь!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покажите себя мужами»; это гендерно маркированный воинский призыв проявить мужество.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как евреи служили вам». Древнееврейский глагол может означать как служение, так и подневольное рабство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַזְּקוּ
  choice: Крепитесь
  rationale: Возвратная порода и повелительное наклонение выражают призыв набраться силы и мужества. «Крепитесь» кратко, естественно и уместно в воинской речи.
- source_word: וִהְיוּ לַאֲנָשִׁים / וִהְיִיתֶם לַאֲנָשִׁים
  choice: будьте мужчинами
  rationale: Дословная передача дважды повторённой гендерно маркированной идиомы сохраняет её риторическую силу; значение призыва к воинской храбрости пояснено в сноске.
- source_word: פְּלִשְׁתִּים
  choice: филистимляне
  rationale: Сохранено прямое обращение к филистимским воинам.
- source_word: פֶּן
  choice: чтобы ... не
  rationale: Естественно передаёт предупреждение о нежелательном исходе.
- source_word: תַּעַבְדוּ
  choice: стать рабами
  rationale: В контексте военного поражения глагол עבד обозначает не добровольную службу, а подчинённое, зависимое положение.
- source_word: לָעִבְרִים
  choice: евреев
  rationale: Передаёт именно עִבְרִים, «евреи», не заменяя его словом «израильтяне».
- source_word: כַּאֲשֶׁר עָבְדוּ לָכֶם
  choice: как они были рабами у вас
  rationale: Явно передаёт прежнюю подчинённость евреев филистимлянам и сохраняет параллель с угрозой рабства.
- source_word: וְנִלְחַמְתֶּם
  choice: и сражайтесь
  rationale: В данном увещевании форма имеет побудительную силу; перевод прям и естественен для речи перед битвой.
theological_decisions:
- issue: Гендерно маркированный призыв לַאֲנָשִׁים
  choice: будьте мужчинами
  alternative: покажите себя мужами; ведите себя как мужчины; будьте храбры
  rationale: Речь обращена к филистимским воинам-мужчинам, а древнееврейское выражение намеренно гендерно маркировано. Нейтральное «будьте храбры» устранило бы эту особенность и ослабило повтор.
- issue: Смысл עבד при военном подчинении
  choice: стать рабами / были рабами
  alternative: служить / служили; быть подвластными
  rationale: Контекст говорит о поражении и принудительном подчинении. «Рабы» передаёт тяжесть угрожающего положения, а сноска сохраняет более широкую лексическую возможность «служить».
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным ритмом воинского призыва. Повтор «будьте мужчинами» сохранён вслед за древнееврейским текстом; архаизирующее «о филистимляне» не добавлено.
