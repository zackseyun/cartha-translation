translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан естественным для широкого читателя; неоднозначность конструкций о захвате ковчега и смерти родственников сохранена в примечаниях. Буквальный образ родовых мук разъяснён, а не механически воспроизведён в основном тексте.
