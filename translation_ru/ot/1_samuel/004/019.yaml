  text: וְ/כַלָּת֣/וֹ אֵֽשֶׁת פִּינְחָס֮ הָרָ֣ה לָ/לַת֒ וַ/תִּשְׁמַ֣ע אֶת הַ/שְּׁמֻעָ֔ה אֶל הִלָּקַח֙ אֲר֣וֹן הָ/אֱלֹהִ֔ים וּ/מֵ֥ת חָמִ֖י/הָ וְ/אִישָׁ֑/הּ וַ/תִּכְרַ֣ע וַ/תֵּ֔לֶד כִּֽי נֶהֶפְכ֥וּ עָלֶ֖י/הָ צִרֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/019.yaml
  text: His daughter-in-law[a], the wife of Phinehas, was pregnant, about to give birth. When she heard the report that the ark of God had been taken, and that her father-in-law and her husband were dead, she bowed down and gave birth[c][b], because her labor pains came upon her.
translation:
  language: ru
  text: А его невестка, жена Финееса, была беременна и уже готова родить. Услышав весть о том, что ковчег Божий захвачен[a] и что её свёкор и муж умерли[b], она согнулась и родила, потому что её внезапно охватили родовые муки[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о захвате ковчега Божьего». Еврейскую конструкцию можно понимать как содержание вести («что ковчег… захвачен») или как указание на её предмет («о захвате ковчега»).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «её свёкор и муж были мертвы». Еврейскую форму можно передать как событие («умерли») либо как наступившее состояние («были мертвы»).'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «её муки обратились на неё» — образное выражение о внезапном начале родовых мук.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַלָּתוֹ
  choice: А его невестка
  rationale: כַּלָּה здесь означает «невестка». Начальное וְ передано союзом «а», естественно связывающим стих с предшествующим повествованием без добавления временного значения.
- source_word: אֵשֶׁת פִּינְחָס
  choice: жена Финееса
  rationale: Приложение, уточняющее, о какой невестке идёт речь; русская форма сохраняет близость к еврейской конструкции.
- source_word: הָרָה לָלַת
  choice: была беременна и уже должна была родить
  rationale: הָרָה обозначает беременность, а לָלַת указывает на близость родов. Формулировка естественна для современного русского языка.
- source_word: וַתִּשְׁמַע אֶת־הַשְּׁמֻעָה
  choice: Услышав весть
  rationale: שְׁמוּעָה означает «весть, известие, сообщение». Деепричастная конструкция ясно передаёт последовательность событий.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: о том, что ковчег Божий захвачен
  rationale: Конструкция с אֶל и инфинитивом может вводить содержание вести либо её предмет. Основной текст передаёт содержание сообщения, сохраняя пассивное значение הִלָּקַח.
- source_word: וּמֵת חָמִיהָ וְאִישָׁהּ
  choice: и что её свёкор и муж умерли
  rationale: Предикативное מֵת допускает как результативное «были мертвы», так и событийное «умерли». В контексте полученной вести естественно русское «умерли».
- source_word: וַתִּכְרַע וַתֵּלֶד
  choice: она склонилась и родила
  rationale: כרע буквально означает согнуться, склониться или опуститься. «Склонилась» сохраняет телесное действие, не уточняя сверх текста, присела ли женщина или упала; ילד передано обычным «родила».
- source_word: כִּי נֶהֶפְכוּ עָלֶיהָ צִרֶיהָ
  choice: потому что её внезапно охватили родовые муки
  rationale: צִרֶיהָ в данном контексте — родовые муки; נֶהֶפְכוּ עָלֶיהָ буквально описывает их как обратившиеся или нахлынувшие на неё. «Внезапно охватили» естественно передаёт идиоматический смысл.
