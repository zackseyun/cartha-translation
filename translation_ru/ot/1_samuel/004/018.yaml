base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/018.yaml
  text: And it happened[a], when he mentioned the ark of God, that Eli fell backward from the seat by the side of the gate, and his neck was broken and he died, for the man was old and heavy[b]. And he had judged Israel forty years.
translation:
  language: ru
  text: Когда вестник упомянул о ковчеге Божьем, Илий упал навзничь со своего сиденья у ворот[a], у него переломилась шея, и он умер, потому что был стар и тяжёл[b]. Он судил Израиль сорок лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение можно также перевести: «возле ворот» или «сбоку от ворот»; буквально: «у руки ворот».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тяжёл». Возможно, имеется в виду, что вес Илия наряду с преклонным возрастом сделал падение смертельным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהַזְכִּירוֹ
  choice: когда тот упомянул
  rationale: Хифиль глагола זכר здесь означает «упомянуть»; местоимение «тот» естественно указывает на вестника из предыдущего контекста и не смешивает его с Илием.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ковчег Божий
  rationale: Прямая и устоявшаяся передача сопряжённой конструкции; в данном повествовании אֱלֹהִים обозначает Бога Израиля.
- source_word: וַיִּפֹּל ... אֲחֹרַנִּית
  choice: упал навзничь
  rationale: Наречие אֲחֹרַנִּית означает падение назад; «навзничь» кратко и естественно передаёт направление падения.
- source_word: הַכִּסֵּא
  choice: своё сиденье
  rationale: כִּסֵּא может обозначать сиденье, кресло или престол. Контекст не царский; притяжательное местоимение по-русски естественно обозначает сиденье, на котором находился Илий.
- source_word: בְּעַד יַד הַשַּׁעַר
  choice: у ворот
  rationale: Необычный еврейский оборот буквально содержит «у/за рукой (стороной) ворот»; «у ворот» сохраняет ясный локативный смысл, а неоднозначность уточняется в сноске.
- source_word: וַתִּשָּׁבֵר מַפְרַקְתּוֹ
  choice: сломал шею
  rationale: מַפְרֶקֶת обозначает шею или затылочную часть. Активная русская конструкция естественно передаёт результат падения, выраженный в еврейском возвратно-пассивной формой.
- source_word: כִּי זָקֵן הָאִישׁ וְכָבֵד
  choice: потому что был стар и тяжёл
  rationale: כָבֵד буквально значит «тяжёл». Формулировка сохраняет исходное объяснение смерти, не заменяя его более узким толкованием «полный» или «тучный».
- source_word: שָׁפַט אֶת יִשְׂרָאֵל
  choice: судил Израиль
  rationale: Глагол שׁפט обозначает исполнение служения судьи и правителя; традиционное русское «судил Израиль» сохраняет связь с институтом судей и не сводит роль только к судебным решениям.
- source_word: אַרְבָּעִים שָׁנָה
  choice: сорок лет
  rationale: Прямая передача числительного и обозначения срока.
theological_decisions:
- issue: Значение אֱלֹהִים в выражении אֲרוֹן הָאֱלֹהִים
  choice: Бог
  alternative: боги
  rationale: Контекст однозначно говорит о ковчеге Бога Израиля; форма אֱלֹהִים здесь имеет единственное значение.
- issue: Значение שׁפט применительно к Илию
  choice: судил Израиль
  alternative: управлял Израилем как судья
  rationale: Более формальная передача сохраняет библейскую категорию судьи, не добавляя толковательного описания его политической функции.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом и умеренно библейской торжественностью. Союзное вводное «И было» опущено как неестественное для современной прозы; последовательность событий сохранена. Маркеры всех сносок включены в основной текст.
