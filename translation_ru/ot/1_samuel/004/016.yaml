base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/016.yaml
  text: The man said to Eli[a], “I am the one who came from the battle line, and I fled from the battle line today.” And he said, “What happened, my son?”
translation:
  language: ru
  text: 'Человек сказал Илию: «Я пришёл с поля боя[a]; сегодня я бежал с поля боя». Илий спросил: «Что случилось, сын мой?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из боевых рядов», «с места сражения»; еврейское слово обозначает боевое построение или поле боя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: Человек
  rationale: Обычное значение существительного — «человек»; контекст показывает, что он принёс весть, но специального слова «вестник» в еврейском тексте нет.
- source_word: הַבָּא מִן הַמַּעֲרָכָה
  choice: пришёл с поля боя
  rationale: Причастная конструкция отождествляет говорящего с тем, кто уже пришёл. מַעֲרָכָה обозначает боевое построение или место сражения; «поле боя» естественно звучит по-русски и сохраняет военный контекст.
- source_word: נַסְתִּי
  choice: я бежал
  rationale: Глагол נוּס прямо означает бегство; перевод не добавляет оттенка благополучного спасения, который могло бы внести «спасся».
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Прямой и естественный современный эквивалент временного указания.
- source_word: מֶה הָיָה הַדָּבָר
  choice: Что случилось
  rationale: 'Буквально: «Что было [за] дело/событие?» Русское «Что случилось?» естественно передаёт вопрос о произошедшем.'
- source_word: בְּנִי
  choice: сын мой
  rationale: Сохраняет явное притяжательное значение и уважительно-ласковое обращение старшего к младшему.
