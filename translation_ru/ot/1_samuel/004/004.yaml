base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/004.yaml
  text: So the people sent to Shiloh[a], and they carried from there the ark of the covenant of Yahweh of hosts, who is enthroned above the cherubim. And the two sons of Eli, Hophni and Phinehas[b], were there with the ark of the covenant of God.
translation:
  language: ru
  text: И народ послал в Силом людей, и оттуда они принесли ковчег завета Яхве Воинств[a], восседающего над херувимами[b]. Там вместе с ковчегом завета Бога были два сына Илия — Офни и Финеес.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве армий»; традиционно: «Господь Саваоф».'
    reason: Лексическая альтернатива для צְבָאוֹת и указание традиционной русской формы титула.
  - marker: b
    text: 'Еврейское выражение можно также передать: «восседающего между херувимами» или «пребывающего среди херувимов».'
    reason: Сохранение пространственной неоднозначности престольной формулы יֹשֵׁב הַכְּרֻבִים.
lexical_decisions:
- source_word: וַיִּשְׁלַח הָעָם
  choice: И народ послал
  rationale: 'Сохранено отсутствие явно названного дополнения: еврейский текст не говорит прямо «людей». Единственное число глагола согласуется с собирательным существительным «народ» и естественно передаётся по-русски.'
- source_word: שִׁלֹה
  choice: Силом
  rationale: Использована устоявшаяся русская библейская форма географического названия.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: и оттуда они принесли
  rationale: Глагол נשׂא включает значение поднятия и перенесения; «принесли» естественно выражает доставку ковчега из Силома к войску.
- source_word: אֲרוֹן בְּרִית
  choice: ковчег завета
  rationale: Прозрачная и устоявшаяся передача сопряжённой конструкции, сохраняющая связь ковчега с заветом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул «Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: «Воинства» сохраняет широту значения множественного числа и не ограничивает выражение исключительно земными армиями.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: восседающего над херувимами
  rationale: «Восседающего» передаёт царственный, престольный оттенок формулы; «над» соответствует образу Божьего присутствия над ковчегом, не вводя более узкое «между» в основной текст.
- source_word: וְשָׁם
  choice: Там же ... были
  rationale: Переданы и местное значение наречия, и связность повествования.
- source_word: שְׁנֵי בְנֵי עֵלִי
  choice: два сына Илия
  rationale: Прямая и естественная русская передача конструкции принадлежности.
- source_word: עִם אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: с ковчегом завета Бога
  rationale: Предлог «с» сохраняет общее значение совместного присутствия, не уточняя пространственное положение сверх текста.
- source_word: חָפְנִי וּפִינְחָס
  choice: Офни и Финеес
  rationale: Использованы устоявшиеся русские библейские формы личных имён.
theological_decisions:
- issue: Передача имени יְהוָה в титуле יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Яхве армий
  rationale: Личное имя сохранено как «Яхве», а צְבָאוֹת передано понятным русским словом без подмены имени титулом и без неоправданного сужения к земным войскам.
- issue: Престольная формула יֹשֵׁב הַכְּרֻבִים
  choice: восседающего над херувимами
  alternative: восседающего между херувимами; пребывающего среди херувимов
  rationale: Выбор сохраняет образ божественного царствования и связь с ковчегом, а пространственная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся близким к еврейской последовательности, но не звучит архаично. Формы «Силом», «Илий», «Офни» и «Финеес» следуют укоренившейся русской библейской традиции; личное имя «Яхве» передаётся явно.
