  source_fidelity: 'Смысл в целом передан точно: народ отправляет посланцев в Силом, откуда ковчег переносят; титул Яхве и связь сыновей Илия с ковчегом сохранены. Однако русское «народ послал в Силом» без дополнения синтаксически неполно. В еврейском дополнение («людей», «посланцев») подразумевается, но в современном русском его безопасно и необходимо эксплицировать. Пространственная неоднозначность формулы יֹשֵׁב הַכְּרֻבִים надлежащим образом оставлена в сноске.'
