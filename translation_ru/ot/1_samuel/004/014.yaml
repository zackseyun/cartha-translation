base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/014.yaml
  text: When Eli heard the sound of the outcry[a], he said, “What is this sound of the uproar?” And the man hurried and came and told Eli.
translation:
  language: ru
  text: 'Когда Илий услышал звук крика[a], он сказал: «Что это за шум, за гомон?» И человек поспешил, пришёл и рассказал Илию.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вопля».'
    reason: Лексема צְעָקָה может обозначать крик или вопль, в том числе тревожный либо вызванный бедствием.
lexical_decisions:
- source_word: קוֹל הַצְּעָקָה
  choice: громкий плач
  rationale: Сочетание буквально означает «звук/голос вопля». В данном контексте צְעָקָה передаёт громкий, исполненный горя общий крик; «громкий плач» естественно звучит по-русски и сохраняет эмоциональную силу выражения.
- source_word: מֶה קוֹל הֶהָמוֹן הַזֶּה
  choice: Что это за шум?
  rationale: Вопрос касается характера слышимого волнения. Современная русская конструкция «Что это за…?» точно и естественно передаёт еврейское מֶה, а «шум» здесь выражает значение הָמוֹן как громкого людского смятения.
- source_word: וְהָאִישׁ
  choice: Тот человек
  rationale: Еврейский текст говорит именно «человек», отсылая к ранее упомянутому вениамитянину. «Тот» делает эту анафорическую связь ясной, не вводя отсутствующего в стихе слова «вестник».
- source_word: מִהַר וַיָּבֹא
  choice: поспешил прийти
  rationale: Сохранены оба еврейских глагола — «поспешил» и «пришёл». Такая формулировка несколько компактнее буквального «поспешил и пришёл» и остаётся естественной для русского повествования.
- source_word: וַיַּגֵּד לְעֵלִי
  choice: всё рассказал Илию
  rationale: Hifil глагола נגד означает сообщить или рассказать. Русское «всё рассказал» идиоматично передаёт подразумеваемое сообщение о случившемся; «всё» контекстуально, но не добавляет конкретного содержания.
- source_word: עֵלִי
  choice: Илий
  rationale: Использована устоявшаяся русская библейская форма имени.
theological_decisions: []
