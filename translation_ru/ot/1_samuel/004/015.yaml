lexical_decisions:
- source_word: בֶּן תִּשְׁעִים וּשְׁמֹנֶה שָׁנָה
  choice: было девяносто восемь лет
  rationale: Еврейская идиома «сын девяноста восьми лет» естественно передаётся по-русски как указание возраста.
- source_word: וְעֵינָיו
  choice: и глаза его
  rationale: Прямая передача существительного во множественном числе с местоименным суффиксом третьего лица мужского рода.
- source_word: קָמָה
  choice: застыли
  rationale: Форма единственного числа при парном обозначении глаз описывает их неподвижное, оцепеневшее состояние. «Застыли» сохраняет конкретный образ и не заменяет его толкованием «померкли».
- source_word: וְלֹא יָכֹל לִרְאוֹת
  choice: так что он не мог видеть
  rationale: Естественно выражает результат описанного состояния глаз, не добавляя нового содержания.
- source_word: וְ
  choice: и
  rationale: Союз связывает сообщение о глазах с указанием возраста; русский текст не нуждается в добавочном временном маркере.
