base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/020.yaml
  text: And about the time of her death[a], the women standing by her said, “Do not fear, for you have borne a son.” But she did not answer, nor did she take it to heart.
translation:
  language: ru
  text: 'Когда она умирала, женщины, стоявшие рядом с ней, сказали: «Не бойся: ты родила сына». Но она не ответила и не обратила на это внимания[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не приняла этого к сердцу»; буквально: «не положила к этому сердца».'
    reason: 'Лексическая альтернатива для идиомы וְלֹא שָׁתָה לִבָּהּ: она означает не обратить внимания, но образ сердца может также передавать отсутствие внутреннего отклика.'
lexical_decisions:
- source_word: וּכְעֵת מוּתָהּ
  choice: Когда она умирала
  rationale: Оборот задаёт время происходящего — в пору её смерти, когда она умирала. Глагольная передача естественна по-русски и сохраняет процессуальный оттенок еврейского инфинитива.
- source_word: וַתְּדַבֵּרְנָה
  choice: сказали
  rationale: Форма женского рода множественного числа вводит обращённую к ней прямую речь; «сказали» здесь наиболее естественно.
- source_word: הַנִּצָּבוֹת עָלֶיהָ
  choice: женщины, стоявшие рядом с ней
  rationale: Субстантивированное причастие женского рода обозначает находившихся при роженице женщин. Перевод сохраняет конкретный образ присутствующих рядом, не уточняя их роль сверх текста.
- source_word: אַל תִּירְאִי
  choice: Не бойся
  rationale: Прямой и естественный русский эквивалент запрета или ободряющего увещания во втором лице женского рода.
- source_word: כִּי בֵן יָלָדְתְּ
  choice: ты родила сына
  rationale: Кратко и точно передаёт причину ободрения; двоеточие естественно выражает пояснительную связь כִּי в русской прямой речи.
- source_word: וְלֹא עָנְתָה
  choice: она не ответила
  rationale: Глагол ענה в данном контексте означает ответить или откликнуться; выбран прямой повествовательный эквивалент.
- source_word: וְלֹא שָׁתָה לִבָּהּ
  choice: не приняла этого к сердцу
  rationale: Русский идиоматический оборот сохраняет образ сердца и передаёт отсутствие внутреннего отклика или внимания, не устраняя возможную смысловую широту еврейского выражения.
