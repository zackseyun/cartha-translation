base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/007.yaml
  text: Then Saul said to his servants who were standing around him, “Listen, please, sons of Benjamin! Will the son of Jesse also give all of you fields and vineyards? Will he make all of you commanders of thousands and commanders of hundreds?”
translation:
  language: ru
  text: 'Тогда Саул сказал своим слугам, стоявшим при нём: «Послушайте, прошу вас, сыны Вениамина! Разве сын Иессея даст всем вам поля и виноградники? Разве всех вас поставит начальниками тысяч и начальниками сотен?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: своим слугам
  rationale: Сохраняет обычное значение עבד в придворном контексте; речь идёт о людях на службе у царя.
- source_word: הַנִּצָּבִים עָלָיו
  choice: стоявшим вокруг него
  rationale: В данном контексте выражение обозначает приближённых, стоящих при Сауле; «вокруг него» естественно передаёт сцену, не добавляя особого должностного статуса.
- source_word: שִׁמְעוּ נָא
  choice: Послушайте, прошу вас
  rationale: Частица נָא придаёт побуждению оттенок настойчивой просьбы; буквальный оттенок сохранён естественной русской формулой.
- source_word: בְּנֵי יְמִינִי
  choice: сыны Вениамина
  rationale: Сохраняет родоплеменное обращение и риторический акцент Саула на общей принадлежности к колену Вениамина.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי מֵאוֹת
  choice: начальниками тысяч и начальниками сотен
  rationale: Передаёт традиционные военно-административные наименования без искусственного уточнения характера должностей.
theological_decisions:
- issue: Риторические вопросы Саула о наградах и назначениях
  choice: Сохранены как два вопроса без поясняющей вставки
  alternative: Передать как утверждение, что Давид не сможет наградить вениамитян
  rationale: Еврейский текст выражает обвинительную мысль посредством вопросов; прямое утверждение устранило бы риторическую напряжённость и добавило толкование.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Форма «сыны Вениамина» намеренно сохранена как родоплеменное обращение; остальной синтаксис сделан ясным и естественным.
