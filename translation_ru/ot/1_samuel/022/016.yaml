  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מ֥וֹת תָּמ֖וּת אֲחִימֶ֑לֶךְ אַתָּ֖ה וְ/כָל בֵּ֥ית אָבִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/016.yaml
  text: But the king said[a], “You shall surely die, Ahimelech[b], you and all your father's house.”
translation:
  language: ru
  text: 'Но царь сказал: «Ты непременно умрёшь, Ахимелех, ты и весь дом твоего отца».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дом твоего отца» — отцовский род, семья или домочадцы.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная передача повествовательной формы глагола אמר в историческом рассказе.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное прямо обозначает говорящего; по-русски в данном контексте артикль отдельно не передаётся.
- source_word: מוֹת תָּמוּת
  choice: ты непременно умрёшь
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает утверждение; «непременно умрёшь» естественно передаёт категоричность и сохраняет возможность понимать слова и как приговор, и как твёрдое предсказание.
- source_word: אֲחִימֶלֶךְ
  choice: Ахимелех
  rationale: Имя транслитерировано в принятой русской библейской форме.
- source_word: אַתָּה
  choice: ты
  rationale: Самостоятельное местоимение выражает акцент и потому сохранено перед продолжением «ты и весь дом…».
- source_word: וְכָל
  choice: и весь
  rationale: При собирательном существительном «дом» сочетание естественно передаётся как «и весь».
- source_word: בֵּית אָבִיךָ
  choice: дом твоего отца
  rationale: Сохранён древнееврейский образ, обозначающий отцовский род, семью или домочадцев; смысл пояснён в сноске.
theological_decisions:
- issue: 'Характер слов מוֹת תָּמוּת: предсказание или судебный приговор'
  choice: ты непременно умрёшь
  alternative: ты должен умереть / тебе надлежит умереть
  rationale: Исходная усилительная конструкция категорична, но сама по себе не требует сводить высказывание только к модальности обязанности. Выбранная формулировка сохраняет судебный контекст и грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной интонацией. Усилительная конструкция передана естественным наречием «непременно»; древнееврейская семейно-родовая идиома сохранена в основном тексте и кратко пояснена.
