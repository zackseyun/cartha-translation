base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/010.yaml
  text: And he inquired of Yahweh for him[a], and gave him provisions, and gave him the sword of Goliath the Philistine.
translation:
  language: ru
  text: Он вопросил Яхве о нём, дал ему припасы и дал ему меч Голиафа-филистимлянина.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обратился к Яхве за ответом о нём».'
    reason: 'Лексическая альтернатива для וַיִּשְׁאַל לוֹ בַּיהוָה: глагол שׁאל с ב имени Бога означает вопрошать Бога, обращаться к нему за ответом; לוֹ в контексте относится к Давиду.'
lexical_decisions:
- source_word: וַיִּשְׁאַל לוֹ בַּיהוָה
  choice: Он вопрошал Яхве для него
  rationale: Сочетание שׁאל с ב и именем Бога обозначает обращение к Богу за ответом или указанием. «Вопрошал Яхве» сохраняет культовый смысл и остаётся понятным в современном литературном русском; לו передано как «для него», то есть в его интересах или от его имени.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а не заменено титулом, поскольку в исходном тексте прямо употреблён тетраграмматон.
- source_word: צֵידָה
  choice: припасы
  rationale: Слово обозначает запас пищи или необходимого для пути; «припасы» передаёт значение шире, чем просто «еда», и естественно звучит в данном повествовании.
- source_word: נָתַן לוֹ
  choice: дал ему
  rationale: Прямой эквивалент глагола נתן с местоименным дополнением. Повтор «дал ему» сохранён в соответствии с повтором исходного текста и ритмом обвинения.
- source_word: וְאֵת חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: и дал ему меч Голиафа, филистимлянина
  rationale: Передаёт цепочку сопряжённых форм в исходном порядке; приложение «филистимлянина» однозначно относится к Голиафу.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; форма «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер обращения к Богу от имени Давида
  choice: вопрошал Яхве для него
  alternative: обратился ради него за ответом к Яхве
  rationale: Основной вариант сохраняет краткость и культовую окраску еврейской конструкции, не уточняя способ получения ответа. Альтернатива яснее раскрывает смысл, но является более разъясняющей.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным глаголом «вопрошал», уместным для официально-культового контекста. Синтаксический повтор «дал ему… и дал ему…» намеренно сохраняет обвинительный ритм еврейского текста.
