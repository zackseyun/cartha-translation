base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/009.yaml
  text: Then Doeg the Edomite[a], who was standing among Saul’s servants, answered and said, “I saw the son of Jesse coming to Nob, to Ahimelech son of Ahitub.”
translation:
  language: ru
  text: 'Тогда Доик, идумеянин, стоявший среди слуг Саула[a], ответил и сказал: «Я видел сына Иессея, направлявшегося в Номву, к Ахимелеху, сыну Ахитува».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поставленный над слугами Саула». Еврейское выражение может означать как то, что Доик находился среди слуг Саула, так и то, что он занимал над ними начальственное положение.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: ответил и сказал
  rationale: Сохранены оба еврейских глагола, образующие обычную повествовательную формулу введения прямой речи.
- source_word: דֹּאֵג הָאֲדֹמִי
  choice: Доик, идумеянин
  rationale: Использованы закрепившиеся в русской библейской традиции формы имени и этнического обозначения; определённый артикль указывает на характеристику названного лица.
- source_word: וְהוּא נִצָּב עַל עַבְדֵי שָׁאוּל
  choice: стоявший среди слуг Саула
  rationale: נִצָּב передаёт положение или назначение, а עַל допускает как пространственное, так и властное понимание. Основной текст естественно передаёт присутствие Доика среди слуг, не приписывая ему бесспорно начальственного положения; иной смысл отмечен в сноске.
- source_word: עַבְדֵי שָׁאוּל
  choice: слуг Саула
  rationale: 'Прямой эквивалент, сохраняющий широкий смысл слова: слуги, придворные или должностные лица.'
- source_word: בֶּן יִשַׁי
  choice: сын Иессея
  rationale: Сохранено намеренное обозначение Давида по отцу вместо замены его личным именем.
- source_word: בָּא נֹבֶה
  choice: пришёл в Номву
  rationale: Причастная форма בָּא после глагола зрительного восприятия естественно передана конструкцией «видел, как ... пришёл»; направительный суффикс в נֹבֶה обозначает движение к Номве.
- source_word: אֶל אֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: к Ахимелеху, сыну Ахитува
  rationale: Предлог אֶל указывает на лицо, к которому направился сын Иессея; имена даны в привычной русской библейской форме.
theological_decisions:
- issue: Положение Доика по отношению к слугам Саула
  choice: стоявший среди слуг Саула
  alternative: поставленный над слугами Саула
  rationale: Еврейское נִצָּב עַל допускает указание как на местонахождение среди придворных, так и на надзорную должность. Контекст не позволяет безоговорочно выбрать начальственный смысл, поэтому неоднозначность сохранена посредством сноски.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повествования. Традиционные формы имён обеспечивают узнаваемость, а синтаксис прямой речи остаётся ясным для современного читателя.
