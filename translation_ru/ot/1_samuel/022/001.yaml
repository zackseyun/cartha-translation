base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/001.yaml
  text: So David went from there and escaped to the cave of Adullam. When his brothers and all his father's household heard[a], they went down there to him.
translation:
  language: ru
  text: И пошёл Давид оттуда и спасся в пещеру Адоллам. Его братья и весь дом его отца услышали об этом и спустились туда, к нему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: И пошёл Давид оттуда
  rationale: Сохраняет простую повествовательную последовательность и исходный пункт движения без излишнего усиления значения.
- source_word: וַיִּמָּלֵט
  choice: спасся
  rationale: Нифаль глагола מלט передаёт успешное избавление от опасности; «спасся» естественно выражает результат, не сводя смысл лишь к бегству.
- source_word: אֶל מְעָרַת עֲדֻלָּם
  choice: в пещере Адоллам
  rationale: После русского «спасся» местонахождение убежища естественно оформляется предложным падежом; сочетание сохраняет традиционное понимание конструктивной цепи как названия пещеры.
- source_word: וַיִּשְׁמְעוּ
  choice: услышали об этом
  rationale: В еврейском тексте объект не назван; «об этом» естественно отсылает к сообщению о местонахождении Давида, не уточняя сверх текста, что именно стало известно.
- source_word: אֶחָיו
  choice: его братья
  rationale: Мужской род множественного числа в данном семейном контексте прямо обозначает братьев Давида.
- source_word: וְכָל בֵּית אָבִיו
  choice: и весь дом его отца
  rationale: «Дом отца» сохраняет древнееврейскую семейно-родовую формулу и её возможную широту, не ограничивая её современным понятием проживающих под одной крышей.
- source_word: וַיֵּרְדוּ
  choice: спустились
  rationale: Передаёт буквальную направленность ירד вниз, вероятно топографическую, и звучит естественно в русском повествовании.
- source_word: אֵלָיו שָׁמָּה
  choice: к нему туда
  rationale: Сохраняет оба элемента исходного выражения — направление к Давиду и указание на место, хотя русский порядок слов слегка маркирован.
