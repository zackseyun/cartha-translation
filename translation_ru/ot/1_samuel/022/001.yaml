  - severity: low
    issue: Сноска конкретизирует невыраженный объект глагола «услышали».
    rationale: 'В оригинале объект не назван. Формулировка «подразумевается, что они узнали, где находится Давид» возможна как контекстуальная догадка, но не должна подаваться как необходимое значение текста. Сноска не нужна: «услышали об этом» достаточно передаёт эллипсис.'
  revised_text: И пошёл Давид оттуда и спасся в пещеру Адоллам. Его братья и весь дом его отца услышали об этом и спустились туда, к нему.
