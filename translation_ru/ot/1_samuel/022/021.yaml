  text: וַ/יַּגֵּ֥ד אֶבְיָתָ֖ר לְ/דָוִ֑ד כִּ֚י הָרַ֣ג שָׁא֔וּל אֵ֖ת כֹּהֲנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/021.yaml
  text: Abiathar told David that Saul had killed the priests of Yahweh.
translation:
  language: ru
  text: Авиафар сообщил Давиду, что Саул убил священников Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: сообщил
  rationale: Порода хифиль глагола נגד означает «дать знать, сообщить». «Сообщил» естественно передаёт донесение важной вести и конструкцию с адресатом.
- source_word: אֶבְיָתָר
  choice: Авиафар
  rationale: Имя передано в принятой русской библейской форме.
- source_word: לְדָוִד
  choice: Давиду
  rationale: Предлог לְ обозначает адресата сообщения; по-русски это естественно выражается дательным падежом.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание сообщения Авиафара.
- source_word: הָרַג
  choice: убил
  rationale: Глагол הרג означает «убить». Предшествование убийства сообщению ясно из смысла и не требует дополнительного показателя в русском языке.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Имя передано в принятой русской библейской форме.
- source_word: כֹּהֲנֵי יְהוָה
  choice: священников Яхве
  rationale: Сопряжённая конструкция буквально обозначает священников, принадлежащих Яхве или служащих Ему; родительный оборот сохраняет эту связь и звучит естественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом, что непосредственно отражает еврейский текст.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя יהוה. Форма «Яхве» сохраняет различие между именем и титулом и не привносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным синтаксисом. «Сообщил» несколько точнее передаёт характер донесения, чем нейтральное «сказал»; традиционные формы имён сохраняют узнаваемость.
