translation_notes:
  register: Современный литературный русский язык с достоинством прямой царской речи. Обвинительный тон Саула сохранён без архаизации; повтор «не сообщает» отражает повтор исходного выражения. Патронимическое «сын Иессея» оставлено в основном тексте как значимая черта речи Саула.
