base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/008.yaml
  text: For all of you have conspired against me[a], and no one informs me when my son makes a covenant with the son of Jesse, and none of you is grieved for me or informs me that my son has stirred up my servant against me to lie in wait[d][c][b], as at this day.
translation:
  language: ru
  text: Ведь все вы сговорились против меня, и никто не сообщает мне[a], когда мой сын заключает союз с сыном Иессея[b]; никто из вас не сочувствует мне[c] и не сообщает, что мой сын поднял моего слугу против меня, чтобы тот подстерегал меня[d], как это происходит сегодня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не открывает моё ухо» — древнееврейская идиома со значением «не сообщает мне» или «не раскрывает мне этого».'
    reason: lexical_alternative
  - marker: b
    text: «Сын Иессея» — Давид. Саул называет его по отцу, не произнося имени.
    reason: cultural_note
  - marker: c
    text: 'Или: «никто из вас не жалеет меня», «никому из вас нет до меня дела».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «поставил моего слугу против меня, чтобы тот устроил засаду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְשַׁרְתֶּם כֻּלְּכֶם עָלַי
  choice: все вы сговорились против меня
  rationale: Глагол קשר в данном контексте обозначает враждебный сговор против Саула. «Сговорились» естественно передаёт обвинительный и политический оттенок.
- source_word: גֹּלֶה אֶת אָזְנִי
  choice: сообщает мне
  rationale: Буквально «открывает моё ухо» — древнееврейская идиома раскрытия сведений. В основном тексте использован ясный современный эквивалент, а буквальный образ отмечен в сноске.
- source_word: בִּכְרָת
  choice: когда … заключает союз
  rationale: Предлог ב при инфинитиве задаёт временное или обстоятельственное значение; ברית в данном выражении подразумевается как заключаемый союз. Настоящее время сохраняет неопределённость формы относительно однократности или продолжающейся ситуации.
- source_word: בְּנִי עִם בֶּן יִשַׁי
  choice: мой сын заключает союз с сыном Иессея
  rationale: Сохранены и указание Саула на Ионафана как на «моего сына», и его намеренно непрямое именование Давида по отцу.
- source_word: חֹלֶה מִכֶּם עָלַי
  choice: никто из вас не сочувствует мне
  rationale: Причастие от חלה здесь выражает болезненное участие, жалость или тревогу за Саула, а не физическую болезнь. «Не сочувствует мне» естественно передаёт этот смысл без чрезмерного толкования.
- source_word: הֵקִים בְּנִי אֶת עַבְדִּי עָלַי
  choice: мой сын поднял против меня моего слугу
  rationale: «Поднял против меня» близко воспроизводит каузативный глагол קום и сохраняет возможность понимать обвинение как подстрекательство или как выставление против Саула.
- source_word: עַבְדִּי
  choice: моего слугу
  rationale: Здесь Давид назван царским подчинённым Саула; «слуга» точнее контекстуально, чем «раб».
- source_word: לְאֹרֵב
  choice: чтобы тот подстерегал меня
  rationale: Форма от ארב обозначает пребывание в засаде или тайное выжидание ради нападения. Глагольная конструкция естественна по-русски и сохраняет направленность против Саула.
- source_word: כַּיּוֹם הַזֶּה
  choice: как это и происходит сегодня
  rationale: Идиома указывает на нынешнее положение дел. Перевод передаёт временную отсылку естественным современным русским языком.
