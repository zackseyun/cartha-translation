review_pass:
  verdict: revise
  source_fidelity: Смысл риторического вопроса и заключительного меризма передан верно. Однако «вопрошал Бога о нём» может означать, что предметом вопроса был Давид, тогда как לּוֹ указывает на действие ради него / в его интересах. Формула «Да не будет этого со мной!» звучит как буквальная калька и по-русски может восприниматься как пожелание, чтобы нечто не случилось с говорящим, а не как категорическое отвержение. Уточнение «в вину» также яснее передаёт обвинительный смысл אַל־יָשֵׂם ... דָּבָר.
  naturalness: Исправленный вариант сохраняет сдержанно библейский, но современный литературный регистр. «Ни в коем случае!» естественно передаёт emphatic repudiation; «ставить в вину» — нормативный русский юридико-обвинительный оборот. Сноска перенесена к началу стиха, к которому она относится.
  terminology: «Вопрошать Бога» сохранено как подходящее для контекста обращения за Божьим ответом. «Дом моего отца» оставлен как прозрачный библейский термин для рода/семейства. «Малого, ни великого» сохраняет меризм оригинала без доктринальных добавлений.
  issues:
