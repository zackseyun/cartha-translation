    issue: «о нём» вместо значения «ради него / для него»
    rationale: Предлог «о» в русском обычно обозначает тему вопроса, тогда как לּוֹ в данном контексте обозначает Давида как того, в чьих интересах совершается вопрошание.
  - severity: medium
