  yaml_path: translation/ot/1_samuel/022/015.yaml
  text: Was today the first time that I inquired of God for him? Far be it from me! Let not the king impute anything to his servant or to all my father’s house[a], for your servant knew nothing of all this, whether small or great.
translation:
  language: ru
  text: Разве я только сегодня начал вопрошать Бога ради него[a]? Ни в коем случае! Пусть царь не ставит в вину ничего ни своему слуге, ни всему дому моего отца, ведь твой слуга ничего не знал обо всём этом — ни малого, ни великого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Сегодня ли я начал вопрошать Бога ради него?» Риторический вопрос подразумевает, что Ахимелех делал это и прежде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַחִלֹּתִי
  choice: Разве сегодня я впервые
  rationale: 'Риторический вопрос передаёт идиоматический смысл буквального «сегодня ли я начал»: Ахимелех отрицает, что сделал это впервые именно теперь.'
- source_word: לִשְׁאוֹל לוֹ בֵאלֹהִים
  choice: вопрошал Бога о нём
  rationale: Оборот означает обращение к Богу за ответом или руководством в интересах Давида; «вопрошал Бога» сохраняет библейский оттенок и остаётся понятным.
- source_word: חָלִילָה לִּי
  choice: Да не будет этого со мной!
  rationale: Сильная формула отвержения обвинения; перевод сохраняет личное местоимение לִי и торжественный регистр.
- source_word: אַל יָשֵׂם ... בְּ
  choice: Пусть царь не вменяет ничего
  rationale: Сочетание выражает возложение обвинения или вины; «вменять» сохраняет юридический оттенок без избыточного уточнения.
- source_word: בְּכָל בֵּית אָבִי
  choice: всему дому моего отца
  rationale: «Дом отца» обозначает весь род или семейство; образ сохранён как понятный библейский оборот.
- source_word: לֹא יָדַע עַבְדְּךָ בְּכָל זֹאת
  choice: твой слуга ничего не знал обо всём этом
  rationale: Естественно передаёт полное отрицание осведомлённости и почтительное самообозначение говорящего.
- source_word: דָּבָר קָטֹן אוֹ גָדוֹל
  choice: ни малого, ни великого
  rationale: Сохраняет еврейский меризм, охватывающий дело целиком, от малейшей детали до главного.
