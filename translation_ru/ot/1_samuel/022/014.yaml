base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/014.yaml
  text: Ahimelech answered the king and said[a], “And who among all your servants is as faithful as David, the king’s son-in-law, who has access to your council[b], and is honored in your house?”
translation:
  language: ru
  text: 'Ахимелех ответил царю: «Кто из всех твоих слуг столь же верен, как Давид — царский зять, повинующийся твоему повелению[a] и почитаемый в твоём доме[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «обращающийся к твоему повелению»; то есть повинующийся тебе или готовый откликнуться на твой приказ.'
    reason: lexical_alternative
  - marker: b
    text: «В твоём доме» может означать царский дом, двор или придворное окружение.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן אֲחִימֶלֶךְ אֶת־הַמֶּלֶךְ וַיֹּאמַר
  choice: Ахимелех ответил царю
  rationale: Обычная древнееврейская повествовательная формула введения прямой речи естественно и без смысловой потери передаётся по-русски одним глаголом «ответил».
- source_word: וּמִי בְכָל־עֲבָדֶיךָ
  choice: Кто из всех твоих слуг
  rationale: Русская партитивная конструкция «из всех» естественно передаёт בְכָל; «слуг» сохраняет широкое значение עֲבָדִים, не сужая его до чиновников или военных.
- source_word: כְּדָוִד נֶאֱמָן
  choice: так верен, как Давид
  rationale: נֶאֱמָן обозначает надёжность и преданность; «верен» уместно передаёт придворную лояльность Давида и сохраняет сопоставительную конструкцию.
- source_word: וַחֲתַן הַמֶּלֶךְ
  choice: царский зять
  rationale: Краткое естественное обозначение родства Давида с царём; определённость титула ясна из контекста обращения к Саулу.
- source_word: וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: готовый исполнить твоё повеление
  rationale: Передаёт сочетание идеи обращения или готовности откликнуться (סָר אֶל) со значением распоряжения и послушания (מִשְׁמַעַת), не делая основной текст неестественно буквальным. Возможная придворная трактовка отмечена в сноске.
- source_word: וְנִכְבָּד בְּבֵיתֶךָ
  choice: и почитаемый в твоём доме
  rationale: «Почитаемый» передаёт статус נִכְבָּד, а «в твоём доме» сохраняет образ исходного текста и его смысловую широту.
theological_decisions:
- issue: Значение וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: готовый исполнить твоё повеление
  alternative: допущенный к твоему совету / имеющий доступ к царю
  rationale: Древнееврейское выражение допускает понимание как готовности повиноваться царскому распоряжению, так и особого доступа к царскому слушанию или совету. Основной текст выбирает контекстуально ясное значение послушания, а сноска сохраняет реальную неоднозначность без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Риторический вопрос и все характеристики Давида сохранены; громоздкое «ответил и сказал» естественно сокращено. Маркеры сносок поставлены непосредственно при неоднозначных выражениях.
