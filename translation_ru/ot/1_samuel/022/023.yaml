  text: שְׁבָ֤/ה אִתִּ/י֙ אַל תִּירָ֔א כִּ֛י אֲשֶׁר יְבַקֵּ֥שׁ אֶת נַפְשִׁ֖/י יְבַקֵּ֣שׁ אֶת נַפְשֶׁ֑/ךָ כִּֽי מִשְׁמֶ֥רֶת אַתָּ֖ה עִמָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/023.yaml
  text: Stay with me[a]; do not be afraid, for he who seeks my life seeks your life also[b], for you are under my protection.
translation:
  language: ru
  text: 'Оставайся со мной и не бойся: тот, кто покушается на мою жизнь[a], покушается и на твою; ведь со мной ты под защитой[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ищет моей жизни». Это еврейский оборот со значением «стремится лишить меня жизни».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально возможна передача: «ты — под охраной (или на сохранении) у меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה אִתִּי
  choice: Оставайся со мной
  rationale: Императив ישׁב в данном контексте означает не «сиди», а «оставайся» в обществе Давида; предлог אִתִּי прямо передан как «со мной».
- source_word: אַל תִּירָא
  choice: не бойся
  rationale: Естественная современная передача еврейской запретительной конструкции.
- source_word: אֲשֶׁר יְבַקֵּשׁ אֶת נַפְשִׁי
  choice: тот, кто покушается на мою жизнь
  rationale: Оборот «искать чью-либо נפש» здесь означает стремиться лишить человека жизни. «Покушаться на жизнь» ясно и идиоматично передаёт смысл, сохраняя упоминание жизни.
- source_word: יְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: покушается и на твою
  rationale: Повтор сказуемого сохранён, а «и» естественно выражает параллель между угрозой Давиду и угрозой Авиафару, хотя отдельной соответствующей частице в еврейском тексте нет.
- source_word: מִשְׁמֶרֶת אַתָּה עִמָּדִי
  choice: со мной ты под защитой
  rationale: Существительное מִשְׁמֶרֶת может обозначать охрану, сохранность или порученное хранение. В контексте Давид заверяет Авиафара, что рядом с ним тот будет защищён; русская формулировка естественна и сохраняет прямое «со мной».
theological_decisions:
- issue: Характер обещанной Давидом безопасности
  choice: со мной ты под защитой
  alternative: ты у меня на сохранении / ты в безопасности со мной
  rationale: Перевод передаёт заверение Давида, не превращая его слова в более сильное богословское утверждение о безусловной гарантии безопасности и не уточняя источник защиты сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный повествовательный регистр. Повтор «покушается» сохраняет параллелизм исходного текста; двоеточие и точка с запятой ясно передают две причинные частицы כִּי.
