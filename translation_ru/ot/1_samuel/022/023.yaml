  terminology: «Оставайся», «не бойся», «покушается на жизнь» и «под защитой» соответствуют повествовательному регистру. Богословски нагруженные термины не добавлены. Имя в самом стихе отсутствует, поэтому его отсутствие в переводе корректно.
