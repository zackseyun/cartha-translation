  text: וַ/יֹּ֤אמֶר אל/ו שָׁא֔וּל לָ֚/מָּה קְשַׁרְתֶּ֣ם עָלַ֔/י אַתָּ֖ה וּ/בֶן יִשָׁ֑י בְּ/תִתְּ/ךָ֨ ל֜/וֹ לֶ֣חֶם וְ/חֶ֗רֶב וְ/שָׁא֥וֹל ל/וֹ֙ בֵּֽ/אלֹהִ֔ים לָ/ק֥וּם אֵלַ֛/י לְ/אֹרֵ֖ב כַּ/יּ֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/013.yaml
  text: Saul said to him[a], “Why have you and the son of Jesse conspired against me, by giving him bread and a sword and by inquiring of God for him, so that he has risen against me to lie in wait[b], as on this day?”
translation:
  language: ru
  text: 'Саул сказал ему: «Почему ты и сын Иессея составили заговор против меня: ты дал ему хлеб и меч, вопросил за него Бога, чтобы он восстал против меня, чтобы устроить мне засаду, как это и есть сегодня?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…так что он восстал против меня, подстерегая меня, как это видно сегодня».'
    reason: Конструкция לָקוּם אֵלַי לְאֹרֵב допускает результативное понимание; לְאֹרֵב может передаваться как продолжающееся действие «подстерегая».
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: сговорились
  rationale: Глагол קשר в речи о царе обозначает заговор или враждебный сговор; «сговорились против меня» естественно передаёт политический смысл обвинения.
- source_word: בֶן־יִשַׁי
  choice: сыном Иессея
  rationale: Сохранено данное Саулом отчуждённое именование Давида по отцу, а не подставлено его имя.
- source_word: בְּתִתְּךָ לוֹ לֶחֶם וְחֶרֶב
  choice: ты дал ему хлеб и меч
  rationale: Инфинитивная конструкция перечисляет действия Ахимелеха, которыми, по обвинению Саула, осуществлялся сговор; в русском самостоятельная личная форма звучит яснее и естественнее.
- source_word: וְשָׁאוֹל לוֹ בֵּאלֹהִים
  choice: и вопросил за него Бога
  rationale: В священническом контексте выражение означает обращение к Богу за указанием для другого человека. «Вопросил Бога» сохраняет религиозный и несколько торжественный оттенок исходной формулы.
- source_word: בֵּאלֹהִים
  choice: Бога
  rationale: В еврейском тексте стоит אֱלֹהִים, а не имя YHWH, поэтому перевод не заменяет его словом «Господь».
- source_word: לָקוּם אֵלַי
  choice: чтобы он восстал против меня
  rationale: Инфинитив допускает оттенок цели или результата. Формулировка сохраняет обвинение Саула, не утверждая от лица повествователя, что Ахимелех действительно преследовал такую цель.
- source_word: לְאֹרֵב
  choice: и устроил засаду
  rationale: Форма от ארב означает подстерегать, находиться в засаде. Русское выражение естественно передаёт приписываемое Давиду враждебное действие.
- source_word: כַּיּוֹם הַזֶּה
  choice: как это и есть сегодня
  rationale: Идиома указывает на нынешнее, по мнению Саула, положение дел; перевод сохраняет акцент на настоящем моменте.
theological_decisions:
- issue: Обозначение Бога в בֵּאלֹהִים
  choice: Бога
  alternative: Господа
  rationale: Источник употребляет אֱלֹהִים, а не тетраграмматон; поэтому сохранено лексическое различие.
- issue: Цель или результат в לָקוּם אֵלַי לְאֹרֵב
  choice: чтобы он восстал против меня и устроил засаду
  alternative: так что он восстал против меня и устроил засаду
  rationale: Конструкция допускает цель и результат. Основной текст передаёт целевое понимание как часть обвинения Саула, а сноска сохраняет результативную возможность.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским оттенком. «Вопросил Бога» выбрано как понятная, но не разговорная формула; патроним «сын Иессея» сохранён ради риторической дистанции в речи Саула.
