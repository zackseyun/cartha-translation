- from: 'Саул сказал ему: «Почему вы с сыном Иессея сговорились против меня? Ты дал ему хлеб и меч и вопросил за него Бога, чтобы он восстал против меня и устроил засаду, как это и есть сегодня».[a]'
  to: 'Саул сказал ему: «Почему ты и сын Иессея составили заговор против меня: ты дал ему хлеб и меч, вопросил за него Бога, чтобы он восстал против меня, чтобы устроить мне засаду, как это и есть сегодня?»[a]'
