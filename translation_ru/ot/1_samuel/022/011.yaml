base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/011.yaml
  text: Then the king sent to summon Ahimelech son of Ahitub the priest[a], and all his father's house, the priests who were at Nob; and they all came to the king.
translation:
  language: ru
  text: Тогда царь послал вызвать священника Ахимелеха, сына Ахитува, и всех священников из дома его отца[a], находившихся в Нове. Все они пришли к царю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дом отца» — более широкий род по отцовской линии, а не только ближайшие родственники.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח ... לִקְרֹא
  choice: послал за
  rationale: В сочетании с инфинитивом קרא глагол שׁלח выражает распоряжение вызвать людей к царю; русское «послал за» естественно передаёт эту конструкцию и официальный контекст.
- source_word: אֲחִימֶלֶךְ בֶּן אֲחִיטוּב הַכֹּהֵן
  choice: священником Ахимелехом, сыном Ахитува
  rationale: Служение Ахимелеха обозначено прямо, а בֶּן передано обычной родословной формулой «сыном Ахитува».
- source_word: כָּל בֵּית אָבִיו
  choice: всем его отцовским домом
  rationale: Сохранён древнееврейский социальный термин, обозначающий более широкое объединение родственников по отцовской линии; сноска предупреждает его ошибочное понимание как здания или только ближайшей семьи.
- source_word: הַכֹּהֲנִים אֲשֶׁר בְּנֹב
  choice: священниками, которые были в Нове
  rationale: Приложение поясняет, кем были представители отцовского дома, и сохраняет прямо выраженное указание на их местонахождение.
- source_word: וַיָּבֹאוּ כֻלָּם אֶל הַמֶּלֶךְ
  choice: И все они пришли к царю
  rationale: «Все они» сохраняет эмфатическую полноту כֻלָּם, а «к царю» непосредственно передаёт направление, выраженное אֶל.
