  register: Современный литературный русский язык с умеренно формальным библейским достоинством. Форма «Нов» выбрана как традиционная русская передача топонима; синтаксис слегка разгружен разделением на два предложения. Маркер [a] помещён непосредственно после поясняемого выражения.
