revisions:
- from: Тогда царь послал за священником Ахимелехом, сыном Ахитува, и за всем его отцовским домом[a] — священниками, которые были в Нове. И все они пришли к царю.
  to: Тогда царь послал вызвать священника Ахимелеха, сына Ахитува, и всех священников из дома его отца[a], находившихся в Нове. Все они пришли к царю.
  rationale: Перевод уточняет значение царского распоряжения («послал вызвать») и перестраивает выражение «дом его отца» в естественный современный русский синтаксис. Сохранены имена, указание на священнический род, местонахождение в Нове и эмфатическое «все они».
