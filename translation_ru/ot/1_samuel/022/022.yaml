base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/022.yaml
  text: David said to Abiathar[a], “I knew on that day, when Doeg the Edomite was there, that he would surely tell Saul[c][b]. I am responsible for all the lives of your father’s house.”
translation:
  language: ru
  text: 'Давид сказал Авиафару: «В тот день я знал, что там был Доик-идумеянин и что он непременно сообщит Саулу.[a] Я виновен в гибели каждого в доме твоего отца».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возвещая, возвестит» — усилительная еврейская конструкция, то есть «непременно сообщит». Первое «что» можно также понимать в значении «когда»: «когда там был Доик-идумеянин».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я стал причиной гибели каждого в доме твоего отца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי בַּיּוֹם הַהוּא
  choice: Я уже тогда знал
  rationale: Перфект ידע и обстоятельство времени переданы естественно по-русски; «уже» уместно выражает осознание Давида в тот конкретный день.
- source_word: כִּי שָׁם דויג הָאֲדֹמִי
  choice: что Доик-идумеянин, находившийся там
  rationale: Первое כִּי понято как вводящее содержание знания, а שָׁם — как обстоятельство присутствия. Формулировка сохраняет связь с последующим сообщением Саулу и избегает двусмысленной цепочки союзов.
- source_word: כִּי הַגֵּד יַגִּיד לְשָׁאוּל
  choice: непременно донесёт Саулу
  rationale: Инфинитив абсолютный при личной форме усиливает глагол; «непременно» передаёт эмфазу. «Донесёт» естественно обозначает сообщение властителю с неблагоприятными последствиями, не добавляя явного объекта.
- source_word: אָנֹכִי סַבֹּתִי
  choice: Я виновен в гибели
  rationale: Редкая форма סַבֹּתִי в контексте выражает признание Давидом собственной причинной ответственности. Русское «виновен в гибели» ясно передаёт это без утверждения, будто Давид лично совершил убийства.
- source_word: בְּכָל נֶפֶשׁ בֵּית אָבִיךָ
  choice: всех в доме твоего отца
  rationale: נֶפֶשׁ здесь означает людей или их жизни, а בֵּית אָבִיךָ — отцовский дом как семью/род. Русская формулировка естественна и в сочетании со словом «гибель» однозначно указывает на погибших людей.
theological_decisions:
- issue: Степень ответственности Давида за гибель священнического дома
  choice: Я виновен в гибели
  alternative: Я стал причиной гибели
  rationale: Текст сохраняет признание вины и причинной ответственности, но не приписывает Давиду непосредственное совершение убийств; фактическим исполнителем в контексте остаётся Доик.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Имя דויג передано в принятой русской библейской форме «Доик», этникон — как «идумеянин». Синтаксис сделан естественным, при этом усиление глагола и неоднозначность первого כִּי отмечены в сноске.
