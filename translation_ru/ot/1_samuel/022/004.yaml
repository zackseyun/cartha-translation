  yaml_path: translation/ot/1_samuel/022/004.yaml
  text: He brought them before the king of Moab[a], and they stayed with him all the days that David was in the stronghold.
translation:
  language: ru
  text: Он привёл их к царю Моава[a], и они оставались у него всё то время, пока Давид находился в крепости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он отвёл их к царю Моава». Еврейский глагол допускает значение сопровождения или приведения кого-либо в присутствие другого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Он привёл их
  rationale: В данном контексте форма с местоименным суффиксом обозначает, что Давид привёл или отвёл родителей к царю Моава. «Привёл их» естественно по-русски и хорошо сочетается с последующим указанием адресата.
- source_word: אֶת־פְּנֵי מֶלֶךְ מוֹאָב
  choice: к царю Моава
  rationale: Буквальное выражение связано с пребыванием «перед лицом» царя, то есть в его присутствии. В современном русском повествовании направление естественно передаётся как «к царю Моава».
- source_word: וַיֵּשְׁבוּ עִמּוֹ
  choice: и они оставались у него
  rationale: ישׁב здесь означает продолжительное пребывание. «Оставались у него» ясно передаёт, что родители Давида жили под покровительством царя, не уточняя сверх текста характер этого пребывания.
- source_word: כָּל־יְמֵי הֱיוֹת דָּוִד
  choice: всё то время, пока Давид находился
  rationale: Еврейский временной оборот буквально охватывает «все дни пребывания Давида»; выбранная формулировка естественна для современного русского языка и сохраняет длительность периода.
- source_word: בַּמְּצוּדָה
  choice: в крепости
  rationale: מְצוּדָה обозначает укреплённое место или опорный пункт, служивший Давиду убежищем. «Крепость» кратко и точно передаёт основной смысл.
theological_decisions: []
