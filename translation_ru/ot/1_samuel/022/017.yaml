  text: וַ/יֹּ֣אמֶר הַ/מֶּ֡לֶךְ לָ/רָצִים֩ הַ/נִּצָּבִ֨ים עָלָ֜י/ו סֹ֥בּוּ וְ/הָמִ֣יתוּ כֹּהֲנֵ֣י יְהוָ֗ה כִּ֤י גַם יָדָ/ם֙ עִם דָּוִ֔ד וְ/כִ֤י יָֽדְעוּ֙ כִּֽי בֹרֵ֣חַ ה֔וּא וְ/לֹ֥א גָל֖וּ אֶת אזנ/ו וְ/לֹֽא אָב֞וּ עַבְדֵ֤י הַ/מֶּ֨לֶךְ֙ לִ/שְׁלֹ֣חַ אֶת יָדָ֔/ם לִ/פְגֹ֖עַ בְּ/כֹהֲנֵ֥י יְהוָֽה׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/017.yaml
  text: Then the king said to the runners who were standing around him[a], “Turn and kill the priests of Yahweh, because their hand also is with David[b], and because they knew that he was fleeing and did not disclose it to me.” But the king’s servants were not willing to put out their hand to strike the priests of Yahweh.
translation:
  language: ru
  text: 'Тогда царь приказал царским скороходам[a], стоявшим вокруг него: «Повернитесь и убейте священников Яхве, потому что и они на стороне Давида[b], потому что знали, что он бежит, а не сообщили мне об этом[c]». Однако слуги царя не захотели поднять руку на священников Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «бегунам» или «скороходам»; при царском дворе так могли называться служители, в том числе выполнявшие охранные обязанности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «их рука также с Давидом», то есть они поддерживают Давида.'
    reason: idiom
  - marker: c
    text: 'Буквально: «не открыли моего уха», то есть не сообщили мне.'
    reason: idiom
lexical_decisions:
- source_word: לָרָצִים
  choice: стражникам
  rationale: Буквально слово обозначает «бегущих, скороходов», но при царском дворе оно могло относиться к царским служителям, выполнявшим функции охраны. В данном контексте приказ совершить убийство лучше всего передаёт значение «стражники»; буквальное обозначение сохранено в сноске.
- source_word: הַנִּצָּבִים עָלָיו
  choice: стоявшим вокруг него
  rationale: Оборот описывает придворных, стоящих рядом с царём или вокруг него; выбран естественный пространственный эквивалент.
- source_word: סֹבּוּ וְהָמִיתוּ
  choice: Повернитесь и убейте
  rationale: Императивы переданы прямо и без добавления юридического оттенка, которого могло бы придать слово «казните».
- source_word: כֹּהֲנֵי יְהוָה
  choice: священников Яхве
  rationale: Конструкция передана непосредственно, а тетраграмматон — личным именем «Яхве».
- source_word: כִּי גַם יָדָם עִם דָּוִד
  choice: потому что и они на стороне Давида
  rationale: Еврейская идиома «их рука с Давидом» означает поддержку Давида или солидарность с ним. Русский перевод передаёт смысл, а образ исходного текста отмечен в сноске.
- source_word: וְכִי יָדְעוּ כִּי בֹרֵחַ הוּא
  choice: они знали, что он бежит
  rationale: Причастие בֹרֵחַ передаёт продолжающееся бегство; настоящее в придаточном при прошедшем «знали» естественно сохраняет эту аспектуальную открытость.
- source_word: וְלֹא גָלוּ אֶת־אָזְנוֹ
  choice: но не сообщили мне об этом
  rationale: Буквальная идиома «не открыли моего уха» в русском неясна; смысл сообщения сведений передан естественно, а буквальный образ дан в сноске.
- source_word: וְלֹא אָבוּ עַבְדֵי הַמֶּלֶךְ
  choice: Однако слуги царя не захотели
  rationale: אבה выражает желание или согласие. Формулировка сохраняет сознательный отказ слуг исполнить приказ.
- source_word: לִשְׁלֹחַ אֶת־יָדָם לִפְגֹעַ
  choice: поднять руку на
  rationale: Два связанных выражения о протягивании руки и нанесении удара естественно объединены русской идиомой «поднять руку на», которая ясно обозначает намеренное насилие и сохраняет образ руки.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте дважды употреблён тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет отличие имени от титула и не добавляет конфессионального толкования.
- issue: Характер обвинения священников
  choice: и они на стороне Давида
  alternative: их рука также с Давидом
  rationale: Слова передают обвинение Саула в поддержке Давида, не подтверждая истинность самого обвинения. Перевод сохраняет его как прямую речь царя.
translation_notes:
  register: Современный литературный русский язык с прямым, сдержанно-трагическим повествованием. «Стражники» понятнее современному читателю, чем архаичное «скороходы»; исходный придворный термин сохранён в сноске. Повтор «священников Яхве» сохранён ради смыслового акцента текста.
