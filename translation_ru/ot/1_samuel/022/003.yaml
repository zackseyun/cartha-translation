base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/003.yaml
  text: Then David went from there to Mizpeh of Moab[a], and he said to the king of Moab[b], “Please let my father and my mother come out and stay with you until I know what God will do for me.”
translation:
  language: ru
  text: 'И пошёл Давид оттуда в Мицпе Моава и сказал царю Моава: «Прошу, позволь моему отцу и матери прийти к вам и остаться у вас[a], пока я не узнаю, что сделает со мной Бог[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть мои отец и мать выйдут к вам» или «уйдут к вам»; по смыслу Давид просит, чтобы они пришли к царю Моава и остались под его защитой.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможны также переводы: «что Бог сделает для меня» или «что Бог мне сделает».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: И пошёл Давид оттуда
  rationale: Последовательная повествовательная форма וַיֵּלֶךְ обозначает простое дальнейшее движение; «пошёл» естественно передаёт её в русском повествовании, а מִשָּׁם — «оттуда».
- source_word: מִצְפֵּה מוֹאָב
  choice: в Мицпе Моава
  rationale: Название передано транслитерацией согласно масоретской огласовке; зависимое «Моава» сохраняет конструкцию, связывающую это место с Моавом.
- source_word: מֶלֶךְ מוֹאָב
  choice: царю Моава
  rationale: Естественная русская передача простой сопряжённой конструкции, обозначающей правителя Моава.
- source_word: יֵצֵא נָא
  choice: Прошу, позволь … уйти
  rationale: יֵצֵא буквально означает «пусть выйдет», а נָא придаёт просьбе вежливый оттенок. В контексте Давид просит отпустить родителей к моавитскому царю; «уйти» сохраняет идею выхода и звучит естественно.
- source_word: אָבִי וְאִמִּי
  choice: моим отцу и матери
  rationale: Сохранено явное упоминание обоих родителей, а не обобщающее «родителям».
- source_word: אִתְּכֶם
  choice: к вам … у вас
  rationale: Местоимение в еврейском тексте имеет множественное число, вероятно включая царя и его окружение. Русское «у вас» естественно сохраняет эту форму; добавленное «остаться» выражает практический смысл просьбы.
- source_word: עַד אֲשֶׁר אֵדַע
  choice: пока я не узнаю
  rationale: Естественная русская временная конструкция, точно обозначающая срок пребывания родителей.
- source_word: מַה יַּעֲשֶׂה לִּי אֱלֹהִים
  choice: что сделает со мной Бог
  rationale: Предлог ל допускает несколько смысловых оттенков. «Со мной» сохраняет открытость ожидаемого исхода и не предполагает заранее, что действие непременно будет благоприятным.
theological_decisions:
- issue: Передача אֱלֹהִים в речи Давида
  choice: Бог
  alternative: бог / боги
  rationale: Несмотря на морфологическую форму множественного числа, согласование с глаголом в единственном числе и контекст ясно указывают на Бога Израиля.
- issue: Направленность Божьего действия в выражении יַּעֲשֶׂה לִּי
  choice: что сделает со мной Бог
  alternative: что сделает для меня Бог / что Бог мне сделает
  rationale: Еврейский предлог לִי допускает значения «для меня», «мне» и по смыслу «со мной». Основной текст не разрешает богословски открытую формулировку в сторону исключительно благоприятного действия.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным повествовательным тоном. Синтаксис просьбы сделан естественным для русского читателя, при этом буквальный образ «выхода» и неоднозначность לִי сохранены в сносках.
