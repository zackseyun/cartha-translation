base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/006.yaml
  text: Saul heard that David and the men who were with him had become known[a]. Now Saul was sitting at Gibeah, under the tamarisk tree on the height, with his spear in his hand[b], and all his servants were standing around him.
translation:
  language: ru
  text: Саул услышал, что стало известно о Давиде и людях, которые были с ним[a]. В это время Саул сидел в Гиве под тамариском на возвышенности[b]; копьё было у него в руке, а все его слуги стояли вокруг него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что Давид и люди, которые были с ним, были обнаружены». Еврейский глагол может означать, что местонахождение Давида стало известно.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «в Раме», если понимать еврейское בָּרָמָה как название места Рама, а не как нарицательное «на возвышенности».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал
  rationale: Передаёт обычное повествовательное значение שׁמע — получение известия — и сохраняет еврейский образ выражения.
- source_word: כִּי נוֹדַע דָּוִד
  choice: что стало известно о Давиде
  rationale: Нифаль נודע допускает значения «стать известным» и «быть обнаруженным». Формулировка сохраняет неопределённость относительно того, стали ли известны местонахождение Давида или сам факт его деятельности.
- source_word: וַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: и людях, которые были с ним
  rationale: Естественно передаёт сопровождавшую Давида группу; согласование с оборотом «стало известно о» делает русскую фразу ясной.
- source_word: יוֹשֵׁב
  choice: сидел
  rationale: Причастие задаёт фоновую, продолжающуюся сцену; русское несовершенное «сидел» естественно передаёт этот аспект.
- source_word: בַּגִּבְעָה
  choice: в Гиве
  rationale: Контекст указывает на топоним Гива; предлог «в» соответствует современной русской норме для названий населённых мест.
- source_word: תַּחַת הָאֶשֶׁל
  choice: под тамариском
  rationale: אשל обычно отождествляется с тамариском. Видовое название понятно и не требует транслитерации.
- source_word: בָּרָמָה
  choice: на возвышенности
  rationale: Артикль и синтаксис поддерживают нарицательное значение «возвышенность», хотя возможно понимание как топонима Рама; неоднозначность отмечена в сноске.
- source_word: וַחֲנִיתוֹ בְיָדוֹ
  choice: копьё было у него в руке
  rationale: Сохраняет самостоятельность безглагольной еврейской конструкции и подчёркнутый образ Саулова копья.
- source_word: וְכָל עֲבָדָיו
  choice: все его слуги
  rationale: עבדים может обозначать слуг, придворных или должностных лиц. «Слуги» — наиболее широкое и близкое к форме оригинала обозначение.
- source_word: נִצָּבִים עָלָיו
  choice: стояли вокруг него
  rationale: Передаёт расположение слуг при Сауле и создаёт естественную для русского читателя придворную сцену.
