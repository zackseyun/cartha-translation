  text: But one son of Ahimelech son of Ahitub escaped[a], and his name was Abiathar, and he fled after David.
translation:
  language: ru
  text: Но один сын Ахимелеха, сына Ахитува, спасся. Его звали Авиафар, и он бежал вслед за Давидом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бежал к Давиду». В еврейском тексте буквально: «бежал вслед за Давидом»; это выражение может означать, что он отправился за Давидом, чтобы присоединиться к нему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵט
  choice: спасся
  rationale: Нифаль глагола מלט здесь обозначает успешное избавление от только что описанной резни; «спасся» естественно передаёт результат и не смешивает этот глагол с последующим וַיִּבְרַח.
- source_word: בֵּן אֶחָד
  choice: один сын
  rationale: Буквально «один сын»; в родословном контексте בֵּן указывает именно на сына, а אֶחָד подчёркивает, что спасся один.
- source_word: לַאֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: Ахимелеха, сына Ахитува
  rationale: Префикс לְ выражает принадлежность или родственную связь; русский родительный падеж естественно передаёт «сын Ахимелеха», а приложение сохраняет родословное уточнение.
- source_word: וּשְׁמוֹ אֶבְיָתָר
  choice: Его звали Авиафар
  rationale: Современная и естественная русская формула именования, точно передающая смысл еврейской именной конструкции.
- source_word: וַיִּבְרַח
  choice: он бежал
  rationale: Глагол ברח означает «бежать, спасаться бегством»; «бежал» сохраняет отличие от предшествующего «спасся».
- source_word: אַחֲרֵי דָוִד
  choice: вслед за Давидом
  rationale: Передаёт буквальное пространственное значение אַחֲרֵי «за, вслед за», не устраняя возможный контекстуальный смысл присоединения к Давиду.
- source_word: אֶבְיָתָר
  choice: Авиафар
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: אֲחִימֶלֶךְ
  choice: Ахимелех
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: אֲחִיטוּב
  choice: Ахитув
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: וַ
  choice: Но
  rationale: 'Начальный союз связывает стих с предшествующей резнёй и в контексте имеет умеренно противительное значение: несмотря на гибель остальных, один сын спасся.'
