base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/018.yaml
  text: Then the king said to Doeg[a], “Turn and strike down the priests.” So Doeg the Edomite turned and struck down the priests, and on that day he put to death eighty-five men who wore a linen ephod.
translation:
  language: ru
  text: 'Тогда царь сказал Доэгу: «Повернись и порази священников[a]». Доэг, идумеянин, повернулся и поразил священников. В тот день он умертвил восемьдесят пять человек, носивших льняной эфод.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напади на священников». Еврейский глагол может обозначать нападение или нанесение удара; «порази» соответствует контексту казни, но не подменяет последующее прямое сообщение об умерщвлении восьмидесяти пяти человек.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סֹב
  choice: повернись
  rationale: Повелительная форма передаёт приказ повернуться к тем, на кого направлено действие; краткая форма сохраняет резкость приказа.
- source_word: וּפְגַע / וַיִּפְגַּע
  choice: порази / поразил
  rationale: Глагол פגע может обозначать встречу, нападение или нанесение удара. В контексте казни «поразить» передаёт насильственное действие, не отождествляя его полностью с последующим итоговым וַיָּמֶת.
- source_word: הַכֹּהֲנִים
  choice: священников
  rationale: Прямой и естественный перевод определённой формы множественного числа.
- source_word: הָאֲדֹמִי
  choice: идумеянин
  rationale: Традиционное и понятное русское обозначение уроженца или представителя Эдома.
- source_word: וַיָּמֶת
  choice: он умертвил
  rationale: Каузативная форма глагола מות обозначает причинение смерти. «Умертвил» сохраняет отличие итогового сообщения от предшествующего «поразил».
- source_word: שְׁמֹנִים וַחֲמִשָּׁה אִישׁ
  choice: восемьдесят пять человек
  rationale: После числительного русское «человек» естественно передаёт איש и не меняет указание контекста на священников-мужчин.
- source_word: נֹשֵׂא אֵפוֹד בָּד
  choice: носивших льняной эфод
  rationale: נשא применительно к предмету одежды естественно означает «носить», а בָּד обозначает лён; причастный оборот ясно характеризует казнённых.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Тогда царь сказал
  rationale: Нарративная форма продвигает последовательность событий; «тогда» естественно передаёт этот переход в современном русском повествовании.
