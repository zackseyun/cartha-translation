  text: And everyone in distress[a], everyone who was in debt, and everyone bitter in soul gathered to him, and he became commander over them[b]. About four hundred men were with him.
translation:
  language: ru
  text: К нему собрались все, кто был в бедственном положении, все, кто был в долгах[a], и все, у кого было горько на душе[b]. Он стал их предводителем. С ним было около четырёхсот человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все, у кого был кредитор (или взыскатель)».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «все горькие душой» — то есть испытывавшие глубокую внутреннюю горечь или душевную муку.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ אֵלָיו
  choice: к нему собрались
  rationale: Передаёт направленное движение людей к Давиду и совместное собирание без добавления смысла «вокруг него».
- source_word: כָּל אִישׁ מָצוֹק
  choice: все, кто оказался в бедственном положении
  rationale: מָצוֹק обозначает стеснённость, бедствие или тяжёлые обстоятельства; русский оборот сохраняет широкий социально-экономический смысл.
- source_word: אֲשֶׁר לוֹ נֹשֶׁא
  choice: кто был в долгах
  rationale: Это естественная русская передача эллиптического еврейского выражения о человеке, у которого есть кредитор или взыскатель; буквальная образность отмечена в сноске.
- source_word: מַר נֶפֶשׁ
  choice: у кого было горько на душе
  rationale: Сохраняет образ внутренней горечи и при этом звучит естественно по-русски; выражение может включать глубокую скорбь, отчаяние или озлобленность, не сводясь только к недовольству.
- source_word: וַיְהִי עֲלֵיהֶם לְשָׂר
  choice: он стал их предводителем
  rationale: שַׂר может обозначать начальника, вождя или военного командира. «Предводитель» естественно соответствует контексту вооружённого отряда, не приписывая Давиду формального воинского звания.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: около четырёхсот человек
  rationale: Префикс כ־ выражает приблизительность; «человек» в данном контексте обозначает мужчин, составлявших отряд, и является обычной русской формой счёта.
