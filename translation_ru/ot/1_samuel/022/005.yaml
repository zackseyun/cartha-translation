  text: וַ/יֹּאמֶר֩ גָּ֨ד הַ/נָּבִ֜יא אֶל דָּוִ֗ד לֹ֤א תֵשֵׁב֙ בַּ/מְּצוּדָ֔ה לֵ֥ךְ וּ/בָֽאתָ לְּ/ךָ֖ אֶ֣רֶץ יְהוּדָ֑ה וַ/יֵּ֣לֶךְ דָּוִ֔ד וַ/יָּבֹ֖א יַ֥עַר חָֽרֶת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/005.yaml
  text: Then Gad the prophet said to David[a], “Do not stay in the stronghold. Go and come for yourself to the land of Judah.” So David went and came to the forest of Hereth.
translation:
  language: ru
  text: 'Тогда пророк Гад сказал Давиду: «Не оставайся в укреплении. Ступай и войди в землю Иуды[a]». Давид пошёл и вошёл в лес Херет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ступай в землю Иуды». Древнееврейский глагол может в зависимости от контекста означать «прийти», «войти» или более обобщённо — направиться куда-либо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  choice: пророк
  rationale: נָבִיא — обычное древнееврейское обозначение пророка; перевод «провидец» здесь соответствовал бы другому термину.
- source_word: לֹא תֵשֵׁב
  choice: не оставайся
  rationale: В данном контексте יָשַׁב означает продолжать находиться в определённом месте; «не оставайся» естественно передаёт практическое повеление.
- source_word: בַּמְּצוּדָה
  choice: в укреплении
  rationale: מְצוּדָה обозначает укреплённое или труднодоступное убежище; «укрепление» сохраняет и оборонительный характер места, и отсутствие указания на конкретный тип сооружения.
- source_word: לֵךְ
  choice: ступай
  rationale: Императив הלך прямо выражает повеление идти; «ступай» звучит естественно и достойно в прямой речи.
- source_word: וּבָאתָ לְּךָ אֶרֶץ יְהוּדָה
  choice: и войди в землю Иуды
  rationale: בוא может означать «прийти» или «войти»; при названии территории «войти» ясно передаёт достижение и пересечение её границы. לְךָ здесь идиоматически усиливает личную направленность действия и не требует отдельного возвратного местоимения в русском.
- source_word: אֶרֶץ יְהוּדָה
  choice: земля Иуды
  rationale: Сочетание אֶרֶץ с названием племени имеет территориальный смысл, который сохраняется словом «земля».
- source_word: יַעַר חָרֶת
  choice: лес Херет
  rationale: יַעַר означает лес или лесистую местность; חָרֶת передано как географическое название «Херет».
- source_word: וַיָּבֹא
  choice: вошёл
  rationale: Перевод сохраняет основное пространственное значение בוא и образ движения в пределы леса, одновременно согласуясь с тем же глаголом в предшествующем повелении.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, повествовательным строем. «Укрепление» выбрано вместо более узкой «крепости», а конструкция «ступай и войди» сохраняет два древнееврейских глагола движения без неестественного буквального «приди себе».
