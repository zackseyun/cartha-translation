  source_fidelity: 'Текст точно передаёт древнееврейский оригинал: Гад назван пророком, запрет оставаться в מְצוּדָה передан как практическое распоряжение, а два глагола движения в повелении и последующем повествовании сохранены. «В землю Иуды» корректно выражает территориальный смысл אֶרֶץ יְהוּדָה. Идиоматическое לְךָ не требует искусственного русского соответствия. Сноска уместно отмечает допустимую широту בוא и не превращает один вариант в догматически обязательный.'
