base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/019.yaml
  text: And Nob[a], the city of the priests, he struck with the edge of the sword, from man to woman, from child to nursing infant, and ox and donkey and sheep, with the edge of the sword.
translation:
  language: ru
  text: 'Город священников Номв он поразил мечом[a]: от мужчины до женщины, от ребёнка до грудного младенца, и вола, и осла, и овцу — мечом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «устами меча»; еврейская идиома, означающая поражение или смерть от меча.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹב
  choice: Номв
  rationale: Собственное название города передано принятой русской библейской транслитерацией.
- source_word: עִיר הַכֹּהֲנִים
  choice: город священников
  rationale: Конструктивное сочетание характеризует Номв как город, связанный со священниками; буквальная и естественная русская формулировка сохраняет эту связь.
- source_word: הִכָּה
  choice: поразил
  rationale: Глагол נכה имеет широкое значение «ударить, поразить»; смертельный характер действия раскрывается последующим оборотом с мечом, поэтому более толковательное «истребил» не внесено в сам глагол.
- source_word: לְפִי חֶרֶב / לְפִי חָרֶב
  choice: остриём меча
  rationale: Идиома буквально говорит об «устах меча» и означает поражение мечом. «Остриём меча» сохраняет конкретный образ и ясно передаёт орудие смертоносного действия.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: от мужчины до женщины
  rationale: Сохранена парная формула полноты и единственное число исходного текста; «женщина», а не «жена», соответствует контексту.
- source_word: מֵעוֹלֵל וְעַד יוֹנֵק
  choice: от ребёнка до грудного младенца
  rationale: עוֹלֵל обозначает малого ребёнка, а יוֹנֵק — младенца, которого кормят грудью. Перевод сохраняет последовательность и подчёркивает неизбирательность расправы.
- source_word: וְשׁוֹר וַחֲמוֹר וָשֶׂה
  choice: и вола, и осла, и овцу
  rationale: Передан перечень домашних животных в единственном числе. שֶׂה может обозначать мелкий скот — овцу или козу; «овца» выбрана как уместный общий эквивалент в данном перечне.
theological_decisions:
- issue: Гендерно маркированные слова в формуле полноты
  choice: от мужчины до женщины
  alternative: всех людей; от мужчин до женщин
  rationale: Еврейские существительные в единственном числе сохранены без нейтрализации. Здесь это меризм, выражающий всеохватность расправы, а не отдельное богословское утверждение о поле.
- issue: Степень формального сохранения формулы массового убийства
  choice: дважды сохранить выражение «остриём меча» и последовательность групп жертв
  alternative: сжать до однократного «предал мечу» или передать как «истребил всех»
  rationale: Повтор и порядок элементов усиливают изображение полного уничтожения. Их сохранение передаёт риторику и тяжесть еврейского текста, не добавляя толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксическое выдвижение «А Номв… он» сохранено ради акцента исходного текста; двоеточие и тире делают длинное перечисление ясным. Повтор мечевой формулы оставлен намеренно.
