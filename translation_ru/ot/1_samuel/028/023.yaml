base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/023.yaml
  text: But he refused and said[a], “I will not eat.” Yet his servants, along with the woman, urged him, and he listened to their voice[c][b]. So he rose from the ground and sat on the bed.
translation:
  language: ru
  text: 'Но он отказался и сказал: «Не буду есть». Тогда его слуги и женщина стали настойчиво его уговаривать[a], и он их послушался[b]. Он поднялся с земли и сел на ложе[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение можно также перевести: «стали настаивать» или «надавили на него»; оно передаёт сильную настойчивость.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «послушал их голоса».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово может обозначать также кровать, кушетку или диван.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: он отказался
  rationale: Глагол מָאֵן прямо выражает отказ или нежелание; «отказался» естественно передаёт его силу в повествовании.
- source_word: לֹא אֹכַל
  choice: Не буду есть
  rationale: Форма אֹכַל после לֹא выражает решительный отказ Саула; дополнение «ничего» в еврейском тексте отсутствует.
- source_word: וַיִּפְרְצוּ בוֹ
  choice: стали настойчиво его уговаривать
  rationale: Сочетание פרץ ב здесь описывает сильное, настойчивое воздействие, а не буквальный прорыв или нападение.
- source_word: עֲבָדָיו
  choice: его слуги
  rationale: В контексте царского окружения речь идёт о людях, служивших Саулу; «слуги» не вносит не удостоверенного здесь акцента на рабском статусе.
- source_word: וְגַם הָאִשָּׁה
  choice: и женщина
  rationale: וְגַם присоединяет женщину к слугам как ещё одну участницу уговоров; в русском перечислении добавочное значение естественно передаётся союзом «и».
- source_word: וַיִּשְׁמַע לְקֹלָם
  choice: он их послушался
  rationale: Еврейская идиома буквально означает «услышал/послушал их голос» и в данном контексте указывает, что Саул уступил их уговорам. Буквальная форма отмечена в сноске.
- source_word: מֵהָאָרֶץ
  choice: с земли
  rationale: אֶרֶץ обозначает здесь поверхность, на которой лежал Саул; «с земли» — ясное и естественное соответствие.
- source_word: וַיֵּשֶׁב אֶל הַמִּטָּה
  choice: сел на ложе
  rationale: מִטָּה может обозначать кровать, ложе или подобие кушетки. «Ложе» сохраняет предметную неопределённость и соответствует достоинству повествовательного регистра.
