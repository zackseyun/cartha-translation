  register: Современный литературный русский язык с ясным повествовательным синтаксисом и умеренно возвышенным словом «ложе». Прямая речь кратка и решительна, как в еврейском тексте; идиоматические обороты переданы естественно, а существенные буквальные и предметные альтернативы сохранены в сносках.
