id: 1SA.28.18
reference: 1 Samuel 28:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר לֹֽא שָׁמַ֨עְתָּ֙ בְּ/ק֣וֹל יְהוָ֔ה וְ/לֹֽא עָשִׂ֥יתָ חֲרוֹן אַפּ֖/וֹ בַּ/עֲמָלֵ֑ק עַל כֵּן֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה עָשָֽׂה לְ/ךָ֥ יְהוָ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/018.yaml
  text: Because you did not obey the voice of Yahweh and did not carry out his burning anger against Amalek[a], therefore Yahweh has done this thing to you today.
translation:
  language: ru
  text: Так как ты не послушался голоса Яхве и не привёл в исполнение Его пылающий гнев против Амалика[a], именно поэтому Яхве так поступил с тобой сегодня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не осуществил Его яростный гнев против Амалика».'
    reason: 'Лексическая альтернатива: חֲרוֹן אַף может быть передано как «пылающий гнев» или более идиоматично как «яростный гнев», а עָשָׂה в этом обороте — как «привести в исполнение» или «осуществить».'
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: так как
  rationale: В данном контексте союз вводит причину суда над Саулом; «так как» естественно передаёт причинное значение.
- source_word: שָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: послушался голоса Яхве
  rationale: Сочетание שׁמע с בְּקוֹל означает не просто услышать, а повиноваться; русское «послушаться голоса» сохраняет и образ, и смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: עָשִׂיתָ חֲרוֹן אַפּוֹ
  choice: привёл в исполнение Его пылающий гнев
  rationale: Буквально выражение говорит о том, чтобы «сделать» пыл Его гнева; выбранная формулировка показывает, что Саул должен был осуществить повеление, в котором проявлялся Божий гнев.
- source_word: חֲרוֹן אַפּוֹ
  choice: Его пылающий гнев
  rationale: «Пылающий» сохраняет присущий еврейскому обороту образ жара гнева и остаётся понятным по-русски.
- source_word: בַּעֲמָלֵק
  choice: против Амалика
  rationale: Предлог обозначает того, против кого должен был быть приведён в исполнение гнев; «Амалик» сохраняет традиционную русскую форму имени.
- source_word: עַל כֵּן
  choice: Яхве и сделал
  rationale: Усилительная частица «и» в русском предложении естественно выражает следствие — «именно поэтому», — избегая тяжёлого сочетания «так как… поэтому».
- source_word: הַדָּבָר הַזֶּה
  choice: это
  rationale: В контексте речь идёт о только что объявленном суде; русское местоимение естественно передаёт הַדָּבָר הַזֶּה без ненужного буквализма «эту вещь».
- source_word: עָשָׂה לְךָ יְהוָה
  choice: Яхве и сделал это с тобой
  rationale: Формулировка сохраняет Яхве как действующее лицо и направленность совершённого суда на Саула.
- source_word: הַיּוֹם הַזֶּה
  choice: сегодня
  rationale: Обычный современный русский эквивалент выражения «в этот день».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Роль Саула в осуществлении Божьего гнева
  choice: не привёл в исполнение Его пылающий гнев
  alternative: не исполнил приговор Его яростного гнева
  rationale: 'Перевод сохраняет напряжение исходного оборота: гнев принадлежит Яхве, но Саул был обязан осуществить данное ему повеление. Слово «приговор» в основной текст не добавлено, поскольку его нет непосредственно в еврейском.'
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной интонацией. Сохранены образ «голоса» и метафора пылающего гнева; причинно-следственная связь передана без стилистически тяжёлого удвоения союзов.
