  source_fidelity: 'Требуется уточнение передачи בָּאוֹב. «Вызывая мёртвых» превращает неоднозначный термин в однозначное описание действия и частично дублирует последующее «подними». Передача «посредством ова» с поясняющей сноской сохраняет спорную семантику термина без преждевременного толкования. Остальные основные соответствия передают еврейский текст точно: намеренная маскировка, смена одежды, два спутника, ночной приход и просьба назвать конкретного человека.'
  naturalness: 'Синтаксис следует немного выровнять: «отправился в путь» добавляет не выраженное в тексте представление о путешествии, а «посредством ова» нуждается в сноске, но оправдано как прозрачное сохранение специального и семантически неустойчивого термина. «Изменил внешность» и «двое мужчин» звучат естественно в современном литературном повествовании.'
  terminology: '«Погадай» удачно передаёт קסם в данном контексте. «Подними для меня» сохраняет образ каузатива עלה и не навязывает объяснения механизма. Термин אוֹב лучше не переводить в основном тексте как «вызывая мёртвых»: сноска должна сообщать его возможные значения — дух/сущность, связанная с некромантией, медиум либо некромантическое средство или практика — не утверждая ни одно из них как окончательное.'
