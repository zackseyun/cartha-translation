base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/020.yaml
  text: Saul immediately fell full length to the ground[a], and he was very afraid because of Samuel’s words. There was no strength in him either, because he had eaten no bread all that day and all that night.
translation:
  language: ru
  text: Саул тотчас упал на землю, растянувшись во весь рост, и очень испугался слов Самуила. К тому же в нём не было сил, потому что он ничего не ел[a] весь тот день и всю ту ночь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не ел хлеба»; еврейское слово «хлеб» может обозначать пищу вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: тотчас
  rationale: Глагол буквально выражает поспешность, но здесь естественно передаёт внезапность и немедленность последовавшего падения.
- source_word: וַיִּפֹּל מְלֹא קוֹמָתוֹ אַרְצָה
  choice: упал на землю, растянувшись во весь рост
  rationale: Сохраняет простой смысл «упал», направление «на землю» и образ падения всем телом; по-русски звучит естественнее буквального «во всю свою высоту».
- source_word: וַיִּרָא מְאֹד מִדִּבְרֵי שְׁמוּאֵל
  choice: очень испугался слов Самуила
  rationale: Передаёт сильный страх и причинный смысл предлога מִן без тяжеловесной конструкции.
- source_word: גַּם כֹּחַ לֹא הָיָה בוֹ
  choice: К тому же в нём не было сил
  rationale: «К тому же» отражает добавочное גַּם, а формулировка не вносит отсутствующего в еврейском тексте значения «сил больше не осталось».
- source_word: לֹא אָכַל לֶחֶם
  choice: он ничего не ел
  rationale: לֶחֶם буквально означает «хлеб», но может обозначать пищу вообще; в контексте полного воздержания от еды естественное русское соответствие — «ничего не ел».
- source_word: כָּל הַיּוֹם וְכָל הַלָּיְלָה
  choice: весь тот день и всю ту ночь
  rationale: Передаёт полноту обоих временных периодов и их определённость в повествовательном контексте.
