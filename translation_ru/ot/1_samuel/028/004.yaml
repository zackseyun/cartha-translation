base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/004.yaml
  text: The Philistines gathered and came and camped at Shunem[a], and Saul gathered all Israel[b], and they camped at Gilboa.
translation:
  language: ru
  text: Филистимляне собрались, пришли и расположились лагерем в Шунеме[a]. Саул собрал весь Израиль, и они расположились лагерем на Гилбоа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разбили лагерь»; так же во втором случае.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у Гилбоа» или «у горы Гилбоа»; название относится к горной местности Гилбоа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: собрались
  rationale: Форма от קבץ обозначает собирание, в данном контексте — войска. Возвратное «собрались» естественно передаёт множественное действие без добавления невыраженного организатора.
- source_word: פְלִשְׁתִּים
  choice: филистимляне
  rationale: Устоявшееся русское название народа.
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: Сохраняет основное значение простого глагола движения בוא и не добавляет военного оттенка вроде «выступили» или «продвинулись».
- source_word: וַיַּחֲנוּ
  choice: расположились лагерем
  rationale: Современное и ясное выражение для חנה; передаёт устройство военного стана без архаичного «стали станом».
- source_word: בְשׁוּנֵם
  choice: у Шунема
  rationale: Предлог ב обозначает место стоянки. «У Шунема» естественно для войска, расположившегося возле населённого пункта, и не утверждает, что лагерь находился внутри города.
- source_word: וַיִּקְבֹּץ
  choice: собрал
  rationale: Сохраняет связь с тем же корнем קבץ в начале стиха и не усиливает военный смысл более узким словом «созвал» или «мобилизовал».
- source_word: כָּל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Формально и естественно сохраняет коллективное обозначение народа, не сужая его прямо до мужчин или воинов.
- source_word: בַּגִּלְבֹּעַ
  choice: у Гилбоа
  rationale: Нейтрально передаёт местонахождение лагеря при топониме и не добавляет отсутствующее в еврейском тексте слово «гора»; топографическая возможность отмечена в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Последовательность коротких еврейских глагольных форм сохранена, но второй союз передан конструкцией «Саул же» для естественной смены действующего лица. Топонимы переданы в формах «Шунем» и «Гилбоа», близких к древнееврейскому звучанию.
