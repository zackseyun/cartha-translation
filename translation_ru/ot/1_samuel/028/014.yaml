base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/014.yaml
  text: He said to her[a], “What is his appearance?” And she said, “An old man is coming up, and he is wrapped in a robe.” Then Saul knew that it was Samuel[c][b], and he bowed with his face to the ground and prostrated himself.
translation:
  language: ru
  text: 'Он спросил её: «Как он выглядит?» Она ответила: «Поднимается[a] старик, укутанный в плащ[b]». Тогда Саул понял, что это Самуил, пал лицом на землю и простёрся перед ним[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «восходит», «поднимается вверх». Еврейское причастие подчёркивает продолжающееся движение вверх.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «одетый в плащ». Еврейское выражение более буквально рисует человека покрытым или окутанным верхней одеждой.'
    reason: lexical_alternative
  - marker: c
    text: Еврейский глагол может также означать «поклонился» и в некоторых контекстах — «совершил поклонение». Здесь он описывает глубокое простирание перед фигурой, которую Саул признал Самуилом.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּאֳרוֹ
  choice: Как он выглядит?
  rationale: Существительное תֹּאַר обозначает видимый облик или наружность. Вопрос «Как он выглядит?» естественно передаёт смысл еврейской именной конструкции в современном русском языке.
- source_word: אִישׁ זָקֵן
  choice: старик
  rationale: Сочетание буквально означает «старый мужчина». «Старик» — краткое, ясное и стилистически уместное соответствие в прямой речи.
- source_word: עֹלֶה
  choice: поднимается
  rationale: Причастие выражает продолжающееся движение вверх. «Поднимается» сохраняет пространственную направленность и не уточняет сверх сказанного, откуда именно появляется фигура.
- source_word: עֹטֶה מְעִיל
  choice: укутанный в плащ
  rationale: עֹטֶה передаёт не просто ношение одежды, а покрывание или окутывание ею; מְעִיל — верхнее одеяние, плащ или мантия. Выбор сохраняет выразительность образа и звучит естественно по-русски.
- source_word: וַיֵּדַע
  choice: Саул понял
  rationale: ידע здесь означает, что Саул по описанию установил, кто перед ним. «Понял» естественно передаёт узнавание, не утверждая, что он сам видел фигуру.
- source_word: כִּי שְׁמוּאֵל הוּא
  choice: что это Самуил
  rationale: Такой оборот естественен по-русски для отождествления описанной фигуры с Самуилом и близко передаёт еврейское «что он — Самуил».
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: пал лицом на землю
  rationale: Еврейский оборот описывает глубокий поклон лицом к земле. «Пал лицом на землю» ясно и сжато передаёт телесную позу.
- source_word: וַיִּשְׁתָּחוּ
  choice: простёрся перед ним
  rationale: Глагол обозначает глубокое склонение или простирание в знак почтения. Этот перевод отличает действие от предшествующего падения лицом на землю и не вводит однозначно культовое значение «поклонился как Богу».
theological_decisions:
- issue: Следует ли передавать жест Саула как поклонение Самуилу в культовом смысле
  choice: простёрся перед ним
  alternative: поклонился; поклонился ему; совершил поклонение
  rationale: Еврейский глагол שׁחה в зависимости от контекста может обозначать как поклонение, так и почтительное земное простирание. Здесь текст непосредственно описывает телесный жест перед фигурой, признанной Самуилом; перевод оставляет богословскую оценку этого действия открытой.
- issue: Утверждает ли рассказ объективную тождественность явившейся фигуры Самуилу
  choice: Саул понял, что это Самуил
  alternative: это был Самуил; Саул признал в нём Самуила
  rationale: 'Синтаксис связывает утверждение с восприятием Саула: וַיֵּדַע שָׁאוּל כִּי. Перевод сохраняет повествовательную формулировку и не усиливает её до отдельного богословского объяснения природы явления.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Прямая речь передана естественно; сохранены последовательность действий, образ движения вверх и неоднозначность последнего жеста. Местоимение «перед ним» эксплицирует естественно подразумеваемый объект простирания без богословского усиления.
