source:
  edition: WLC
  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בַּֽ/יהוָ֔ה וְ/לֹ֥א עָנָ֖/הוּ יְהוָ֑ה גַּ֧ם בַּ/חֲלֹמ֛וֹת גַּ֥ם בָּ/אוּרִ֖ים גַּ֥ם בַּ/נְּבִיאִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/006.yaml
  text: Saul inquired of Yahweh[a], but Yahweh did not answer him[b], either by dreams or by the Urim or by the prophets.
translation:
  language: ru
  text: Саул вопросил Яхве, но Яхве не ответил ему — ни через сны, ни через урим[a], ни через пророков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Урим — священное средство, которым священники обращались к Богу за решением.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: вопросил Яхве
  rationale: Сочетание שׁאל с ב перед именем Бога означает обращение за Божьим решением или указанием, а не просто заданный вопрос. «Вопросил» кратко и уместно передаёт этот смысл в современном литературном библейском регистре.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно стоящее в еврейском тексте, без замены титулом.
- source_word: וְלֹא עָנָהוּ
  choice: но Яхве не ответил ему
  rationale: ענה здесь обозначает ответ на обращение за откровением; прямой перевод сохраняет субъект, повторённый в исходном тексте.
- source_word: גַּם ... גַּם ... גַּם
  choice: ни ... ни ... ни
  rationale: После отрицания повторение גַּם естественно передаётся русской отрицательной перечислительной конструкцией, охватывающей все три способа получения ответа.
- source_word: בַּחֲלֹמוֹת
  choice: через сны
  rationale: Предлог ב обозначает средство или канал получения откровения; «через» ясно и естественно выражает эту функцию.
- source_word: בָּאוּרִים
  choice: через урим
  rationale: Культовый термин אוּרִים сохранён транслитерацией, поскольку его предметное устройство и этимологический перевод не вполне определённы.
- source_word: בַּנְּבִיאִם
  choice: через пророков
  rationale: Пророки названы посредниками Божьего ответа; «через» сохраняет параллелизм трёх каналов откровения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст дважды употребляет тетраграмматон как личное имя; его передача сохраняет это различие и повтор оригинала.
- issue: Причина отсутствия ответа
  choice: Не объяснять, почему Яхве не ответил Саулу
  alternative: Добавить, что Бог отверг Саула или отказался отвечать из-за его непослушания
  rationale: Данный стих сообщает лишь факт отсутствия ответа через перечисленные средства; объяснение причины внесло бы толкование из более широкого контекста.
- issue: Характер перечисленных средств
  choice: Передать их как три канала возможного ответа
  alternative: Понять первое בַּיהוָה как указание, что Саул вопрошал Яхве посредством всех трёх средств
  rationale: Синтаксис ясно перечисляет способы, которыми ответа не последовало, но не требует уточнять точную процедуру первоначального обращения.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. «Вопросил» выбрано вместо разговорного «спросил» и более громоздкого «обратился за указанием». Параллелизм оригинала сохранён тройным «ни через».
