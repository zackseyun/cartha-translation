  language: ru
  text: Она подала еду Саулу и его слугам[a], и они поели. Затем они встали и ушли той ночью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «она поднесла [это] перед Саулом и перед его слугами». Дополнение подразумевается из предыдущего контекста: это приготовленная еда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: Она поставила еду перед
  rationale: В данной породе и контексте глагол означает «поднести, поставить перед кем-либо». Объект подразумевается из предыдущего стиха; в русском естественно назвать его словом «еда».
- source_word: לִפְנֵי
  choice: перед
  rationale: Предлог буквально означает «перед, пред лицом»; при подаче еды естественный русский эквивалент — «перед».
- source_word: עֲבָדָיו
  choice: его слугами
  rationale: עבד может обозначать раба, слугу или состоящего при ком-либо человека. Здесь речь о сопровождавших Саула людях; «слуги» сохраняет прямое значение, не утверждая рабского статуса.
- source_word: וַיֹּאכֵלוּ
  choice: и они поели
  rationale: Глагол означает «есть». Совершенный вид «поели» естественно передаёт завершённое действие в последовательности повествования; объект понятен из контекста.
- source_word: וַיָּקֻמוּ
  choice: Потом они встали
  rationale: «Встали» точно и современно передаёт действие, а «потом» выражает последовательность древнееврейского повествования.
- source_word: וַיֵּלְכוּ
  choice: и ушли
  rationale: הלך означает «идти». В контексте ухода из дома естественный русский эквивалент — «ушли».
- source_word: בַּלַּיְלָה הַהוּא
  choice: в ту же ночь
  rationale: Буквально «в ту ночь». Частица «же» естественно подчёркивает, что они ушли именно той ночью, не добавляя нового временного содержания.
