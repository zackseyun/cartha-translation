  text: Когда Саул увидел стан филистимлян, он испугался, и сердце его сильно задрожало.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Обычное значение ראה в данном повествовательном контексте — зрительное восприятие; «увидел» естественно передаёт последовательность событий.
- source_word: מַחֲנֵה
  choice: стан
  rationale: מַחֲנֶה обозначает военный лагерь или стан. «Стан» сохраняет конкретный военный образ и звучит уместно в литературном библейском повествовании.
- source_word: פְלִשְׁתִּים
  choice: филистимлян
  rationale: Устоявшееся русское наименование этого народа; родительный падеж обусловлен словом «стан».
- source_word: וַיִּרָא
  choice: испугался
  rationale: Форма от ירא выражает возникший страх. «Испугался» естественно передаёт реакцию Саула после увиденного.
- source_word: וַיֶּחֱרַד
  choice: задрожало
  rationale: חרד передаёт дрожь, содрогание или сильное внутреннее волнение. «Задрожало» сохраняет образ, не сводя его лишь к отвлечённому ужасу.
- source_word: לִבּוֹ
  choice: сердце его
  rationale: Сохранён явный древнееврейский образ сердца как средоточия внутреннего состояния; инверсия придаёт фразе достоинство без чрезмерной архаизации.
- source_word: מְאֹד
  choice: сильно
  rationale: מְאֹד усиливает действие; «сильно» естественно сочетается с «задрожало» в современном русском языке.
