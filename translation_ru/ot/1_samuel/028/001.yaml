base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/001.yaml
  text: In those days the Philistines gathered their camps for war[a], to fight against Israel. And Achish said to David, “You surely know that you and your men must go out with me in the camp.”
translation:
  language: ru
  text: 'В те дни филистимляне собрали свои войска, чтобы пойти войной на Израиль. Ахиш сказал Давиду: «Ты, конечно, знаешь: ты и твои люди выступите вместе со мной в составе войска[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в лагере». Еврейское слово может означать как сам лагерь, так и находящееся в нём войско.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: В те дни
  rationale: Естественно передаёт временную формулу, вводящую новую сцену, без избыточного буквального «и было».
- source_word: וַיִּקְבְּצוּ פְלִשְׁתִּים אֶת מַחֲנֵיהֶם לַצָּבָא
  choice: филистимляне собрали свои войска
  rationale: מַחֲנֶה буквально обозначает лагерь или стан, но также воинское соединение; в сочетании с военной целью русское «собрали свои войска» звучит естественно и передаёт контекстуальный смысл.
- source_word: לְהִלָּחֵם בְּיִשְׂרָאֵל
  choice: чтобы пойти войной на Израиль
  rationale: Передаёт целевое значение инфинитива и явно враждебную направленность действия; выражение естественно для современного литературного русского.
- source_word: יָדֹעַ תֵּדַע
  choice: Знай наверняка
  rationale: Инфинитив абсолютный при личной форме усиливает глагол; краткая русская формула сохраняет категоричность слов Ахиша.
- source_word: אִתִּי תֵּצֵא
  choice: выступите вместе со мной
  rationale: Будущее время передаёт твёрдо заявленное ожидание Ахиша, не превращая его без необходимости в прямой приказ или явную модальность долженствования.
- source_word: בַּמַּחֲנֶה
  choice: в составе войска
  rationale: В данном военном контексте слово, буквально означающее «лагерь, стан», может обозначать войско как организованную военную силу; выбран естественный русский эквивалент, а буквальная возможность отмечена в сноске.
- source_word: אַתָּה וַאֲנָשֶׁיךָ
  choice: ты и твои люди
  rationale: Сохраняет отдельное ударение на Давиде и включает его отряд.
- source_word: אָכִישׁ
  choice: Ахиш
  rationale: Транслитерация непосредственно отражает еврейскую форму имени и понятна русскому читателю.
