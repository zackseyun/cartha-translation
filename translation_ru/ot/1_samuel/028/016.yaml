  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל וְ/לָ֖/מָּה תִּשְׁאָלֵ֑/נִי וַ/יהוָ֛ה סָ֥ר מֵ/עָלֶ֖י/ךָ וַ/יְהִ֥י עָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/016.yaml
  text: And Samuel said[a], “Why then do you ask me, since Yahweh has turned away from you and has become your adversary?”
translation:
  language: ru
  text: 'И сказал Самуил: «Зачем же ты спрашиваешь меня, если Яхве отступил от тебя и стал твоим противником[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал твоим врагом».'
    reason: Лексема עָר допускает переводы «противник» и «враг»; второй вариант сильнее подчёркивает враждебность.
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל
  choice: И сказал Самуил
  rationale: Сохраняет обычное для еврейского повествования продвижение рассказа через waw-consecutive и естественно звучит по-русски.
- source_word: וְלָמָּה
  choice: Зачем же
  rationale: Передаёт связующую силу וְ и остроту риторического вопроса; в данном контексте речь идёт о бессмысленности обращения к Самуилу.
- source_word: תִּשְׁאָלֵנִי
  choice: ты спрашиваешь меня
  rationale: Прямой и понятный перевод שאל; более специальное «вопрошаешь меня» было бы излишне архаичным.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: סָר מֵעָלֶיךָ
  choice: отступил от тебя
  rationale: Передаёт завершённое удаление или отстранение; «отступил» сохраняет серьёзный реляционный смысл и естественно сочетается с последующей фразой.
- source_word: וַיְהִי עָרֶךָ
  choice: стал твоим противником
  rationale: עָר обозначает противника или врага. «Противником» точно передаёт активное противостояние, не ослабляя суровость высказывания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблено личное имя Бога; транслитерация «Яхве» сохраняет это различие.
- issue: Характер отношения Яхве к Саулу в выражении וַיְהִי עָרֶךָ
  choice: стал твоим противником
  alternative: стал твоим врагом; выступил против тебя
  rationale: Формулировка сохраняет напряжённое утверждение текста о Божьем активном противостоянии Саулу, не смягчая его до простого неблаговоления.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования; без архаизмов «вопрошать» и «отойти от». Маркер сноски поставлен непосредственно после слова, к которому относится лексическая альтернатива.
