- from: И предаст Господь вместе с тобой и Израиль в руки филистимлян; а завтра ты и твои сыновья будете со мной[a]. И стан Израиля Господь предаст в руки филистимлян[b].
  to: И Господь предаст Израиль вместе с тобой в руки филистимлян; и завтра ты и твои сыновья будете со мной[a]. Также Господь предаст в руки филистимлян лагерь Израиля[b].
  rationale: 'Добавлено «Также» для второго גַּם; «стан» заменён на более современное «лагерь»; примечание к «со мной» приведено к нейтральной формулировке, сохраняющей смысловую и богословскую недосказанность оригинала. Якоря сносок в русском тексте поставлены у соответствующих выражений: a — у «со мной», b — у «лагерь Израиля».'
