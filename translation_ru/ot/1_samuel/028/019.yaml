source:
  edition: WLC
  text: וְ/יִתֵּ֣ן יְ֠הוָה גַּ֣ם אֶת יִשְׂרָאֵ֤ל עִמְּ/ךָ֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/מָחָ֕ר אַתָּ֥ה וּ/בָנֶ֖י/ךָ עִמִּ֑/י גַּ֚ם אֶת מַחֲנֵ֣ה יִשְׂרָאֵ֔ל יִתֵּ֥ן יְהוָ֖ה בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/019.yaml
  text: And Yahweh will also give Israel with you into the hand of the Philistines[a], and tomorrow you and your sons will be with me[b]. Yahweh will also give the camp of Israel into the hand of the Philistines.
translation:
  language: ru
  text: И Господь предаст Израиль вместе с тобой в руки филистимлян; и завтра ты и твои сыновья будете со мной[a]. Также Господь предаст в руки филистимлян лагерь Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со мной в смерти» или «со мной в шеоле». В еврейском тексте сказано только: «со мной».'
    reason: Сохранение неоднозначности краткой фразы עִמִּי.
  - marker: b
    text: 'Или: «войско Израиля». Еврейское слово может означать как военный лагерь, так и расположенное в нём войско.'
    reason: Лексическая альтернатива для מַחֲנֵה.
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и естественная для русского библейского языка передача тетраграмматона; она сохраняет достоинство регистра и не вводит менее привычную русскому читателю транслитерацию.
- source_word: וְיִתֵּן / יִתֵּן
  choice: предаст
  rationale: В сочетании с בְּיַד глагол נתן означает передачу под власть противника. «Предаст в руки» точно и естественно передаёт этот смысл по-русски.
- source_word: גַּם
  choice: и
  rationale: 'В первом высказывании частица имеет присоединительно-усилительный смысл: вместе с Саулом будет отдан также Израиль. Русское «и» в конструкции «вместе с тобой и Израиль» естественно выражает это добавление; во втором случае повторная предстоящая передача передана самой параллельной конструкцией.'
- source_word: עִמְּךָ
  choice: вместе с тобой
  rationale: Ясно показывает, что Израиль разделит участь Саула, не добавляя причинного или пространственного смысла.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: в руки филистимлян
  rationale: Сохраняет образ еврейского оборота и остаётся устойчивым, понятным выражением передачи под чужую власть.
- source_word: וּמָחָר
  choice: а завтра
  rationale: Союз «а» естественно вводит следующий, лично обращённый к Саулу приговор и сохраняет торжественную последовательность речи.
- source_word: וּבָנֶיךָ
  choice: и твои сыновья
  rationale: בנים в данном контексте обозначает именно сыновей Саула, а не детей вообще.
- source_word: עִמִּי
  choice: со мной
  rationale: Буквально сохраняет краткость и неоднозначность еврейского текста, не уточняя, идёт ли речь просто о смерти, шеоле или ином представлении о посмертном состоянии.
- source_word: מַחֲנֵה יִשְׂרָאֵל
  choice: стан Израиля
  rationale: מַחֲנֶה может обозначать лагерь, стан или войско. «Стан Израиля» сохраняет конкретный образ военного лагеря и допускает контекстуальное понимание всего расположенного там войска.
theological_decisions:
- issue: Смысл слов «завтра ты и твои сыновья будете со мной»
  choice: Сохранено буквальное «со мной» без уточнения состояния или места.
  alternative: «Со мной среди мёртвых», «со мной в шеоле» или «со мной в могиле».
  rationale: Контекст предсказывает скорую смерть Саула и его сыновей, однако сама фраза עִמִּי не называет ни шеол, ни могилу, ни точное посмертное состояние. Буквальная передача сохраняет богословскую напряжённость и границы сказанного.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис остаётся близким к еврейской последовательности, но не выглядит архаичным; сохранены образ «в руки» и намеренная недосказанность «со мной».
