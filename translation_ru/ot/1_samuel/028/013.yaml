base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/013.yaml
  text: The king said to her[a], “Do not be afraid. What do you see?” And the woman said to Saul[b], “I see a divine being coming up from the earth.”
translation:
  language: ru
  text: 'Царь сказал ей: «Не бойся. Что ты увидела?[a]» Женщина ответила Саулу: «Я вижу божественное существо[b], поднимающееся из земли».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по форме еврейского глагола: «Что ты увидела?» В контексте возможен и смысл настоящего времени: «Что ты видишь?»'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское אֱלֹהִים имеет форму множественного числа; причастие «поднимающиеся» также стоит во множественном числе. Поэтому возможно буквальное прочтение: «вижу богов, поднимающихся из земли», хотя дальнейшее описание сосредоточено на одном существе.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: В еврейском тексте употреблено нарицательное существительное с определённым артиклем, а не имя Саул; это сохраняет повествовательную форму оригинала.
- source_word: אַל תִּירְאִי
  choice: не бойся
  rationale: Естественная для современного русского языка передача отрицательного повеления с глаголом ירא.
- source_word: כִּי מָה רָאִית
  choice: Что ты увидела?
  rationale: Форма רָאִית — перфект второго лица женского рода. Русское прошедшее время точно передаёт форму и естественно звучит как вопрос о только что возникшем видении; כִּי здесь не требуется передавать отдельным союзом.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: Оригинал называет её просто женщиной; слово «волшебница» или «медиум» было бы контекстуальным пояснением, отсутствующим в данном стихе.
- source_word: אֱלֹהִים
  choice: божественное существо
  rationale: Слово имеет форму множественного числа, но в данном контексте может обозначать сверхъестественное существо. Такая передача не отождествляет явление с Богом и не устраняет необычность формы, отмеченную в сноске.
- source_word: עֹלִים
  choice: поднимающееся
  rationale: Причастие от עלה выражает движение снизу вверх. Единственное число согласовано с контекстуальной передачей אֱלֹהִים; множественная форма оригинала отмечена в сноске.
- source_word: מִן הָאָרֶץ
  choice: из земли
  rationale: Передача сохраняет образ появления снизу и не сужает значение до буквального выхода из грунта.
theological_decisions:
- issue: Передача אֱלֹהִים в рассказе женщины о видении
  choice: божественное существо
  alternative: боги; Бог; дух
  rationale: Высказывание передаёт восприятие женщины, а не прямое богословское утверждение повествователя. Выбранная формулировка сохраняет сверхъестественный смысл, не вводя многобожие и не отождествляя явившегося с Богом; формальная множественность אֱלֹהִים и согласованного причастия сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык, простой и dignified повествовательный стиль. Сохранены краткость диалога, женский род обращённых к женщине форм и богословская неоднозначность описания явления.
