  yaml_path: translation/ot/1_samuel/028/010.yaml
  text: So Saul swore to her by Yahweh[a], saying, “As Yahweh lives, no punishment will come upon you in this matter.”
translation:
  language: ru
  text: 'Саул поклялся ей Яхве, сказав: «Жив Яхве: не постигнет тебя наказание[a] за это дело».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будет на тебе вины за это дело». Еврейское слово может означать беззаконие, вину или наказание как последствие вины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: поклялся
  rationale: Форма нифаля глагола שׁבע означает «клясться, приносить клятву»; «поклялся» естественно и точно передаёт торжественный характер речи.
- source_word: לָהּ
  choice: ей
  rationale: Естественная русская передача косвенного дополнения.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: Предлог указывает, что Саул призывает Яхве как свидетеля и гаранта клятвы; в русском управление глагола «поклялся» позволяет передать это без дополнительного предлога.
- source_word: חַי יְהוָה
  choice: Жив Яхве
  rationale: Сохраняет краткую и торжественную древнееврейскую формулу клятвы, понятную в литературном русском.
- source_word: אִם
  choice: не
  rationale: В формуле клятвы אִם вводит сокращённое самоусловное проклятие и потому имеет силу решительного отрицания.
- source_word: יִקְּרֵךְ
  choice: постигнет тебя
  rationale: Глагол קרא здесь означает, что нечто случится с человеком или постигнет его; выбранный вариант естественен для торжественного обещания.
- source_word: עָוֺן
  choice: наказание
  rationale: В данном контексте слово обозначает последствие вины, то есть грозящее женщине наказание, а не обязательно отрицание нравственной виновности самого поступка.
- source_word: בַּדָּבָר הַזֶּה
  choice: за это дело
  rationale: Контекстуально выражение относится к обсуждаемому поступку; предлог «за» ясно связывает возможное наказание с ним.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Значение עָוֺן в клятве Саула
  choice: наказание
  alternative: вина; беззаконие
  rationale: Саул обещает женщине отсутствие карающих последствий за этот поступок. Такой перевод не превращает его слова в утверждение о нравственной невиновности поступка, однако сноска сохраняет семантическую неоднозначность еврейского слова.
translation_notes:
  register: Современный литературный русский с умеренно торжественным строем, соответствующим клятве. Порядок «И поклялся ей Саул» слегка возвышен, но ясен; формула «Жив Яхве» намеренно сохранена краткой. Маркер сноски поставлен после всей реплики, к которой относится лексическая альтернатива.
