    issue: «его родном городе»
    rationale: Суффикс в בְּעִירוֹ означает «его городе», а не обязательно городе рождения или происхождения. «Родной» в русском обычно вносит дополнительный смысл.
  - severity: medium
    issue: «тех, кто вызывал духов умерших»
    rationale: Это интерпретирующее развёртывание אֹבוֹת. Связь термина с обращением к умершим вероятна в контексте, но точное значение и механизм практики спорны; перевод не должен утверждать их как эксплицитные.
  - severity: medium
    issue: «прорицателей» для יִדְּעֹנִים
    rationale: Слово обозначает слишком общий класс предсказателей и не отражает специфически спорный термин, регулярно парный к אֹבוֹת.
