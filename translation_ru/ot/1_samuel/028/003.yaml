base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/003.yaml
  text: Samuel had died[a], and all Israel had mourned for him and buried him in Ramah, in his own city. And Saul had removed the mediums and the spiritists from the land.
translation:
  language: ru
  text: Самуил уже умер, и весь Израиль оплакал его и похоронил в Раме, его городе. Саул же удалил из страны медиумов и спиритов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейские названия этих двух видов оккультных практиков традиционно передают также как «вызыватели духов и ведуны». Их точное значение и различие между ними неясны.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵת
  choice: уже умер
  rationale: Наречие «уже» передаёт фоновое, предшествующее основному повествованию событие; в русском языке отдельной формы плюсквамперфекта нет.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: оплакал его
  rationale: Глагол ספד обозначает публичный, обычно погребальный плач; «оплакал» естественно и точно передаёт этот смысл.
- source_word: כָּל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Сохранено собирательное обозначение народа, обычное для библейского повествования.
- source_word: וַיִּקְבְּרֻהוּ
  choice: похоронил
  rationale: Прямой современный эквивалент קבר; единственное число согласовано с собирательным выражением «весь Израиль».
- source_word: בָרָמָה וּבְעִירוֹ
  choice: в Раме, его родном городе
  rationale: Вторая предложная группа естественно понята как пояснение к Раме. «Родном» идиоматично выражает принадлежность города Самуилу, не предполагая непременно место его рождения.
- source_word: הֵסִיר
  choice: удалил из страны
  rationale: Сохранён широкий смысл устранения или удаления без уточнения способа — изгнания, запрета либо иной меры.
- source_word: הָאֹבוֹת
  choice: тех, кто вызывал духов умерших
  rationale: אוֹב здесь обозначает людей, посредством которых обращались к умершим. Описательный перевод понятнее современному читателю и не навязывает более позднюю оккультную классификацию.
- source_word: הַיִּדְּעֹנִים
  choice: прорицателей
  rationale: יִדְּעֹנִי — обозначение оккультного практика, часто стоящее рядом с אוֹב; «прорицатели» сохраняет общий смысл сверхъестественного получения тайного знания, хотя точная специализация термина неясна.
- source_word: מֵהָאָרֶץ
  choice: из страны
  rationale: В данном национально-политическом контексте «страна» звучит по-русски естественнее, чем буквальное «земля».
theological_decisions:
- issue: Передача названий оккультных практиков без привнесения позднейших представлений
  choice: тех, кто вызывал духов умерших, и прорицателей
  alternative: медиумов и духовидцев; некромантов и ведунов
  rationale: Еврейские слова обозначают запрещённых оккультных практиков, однако точное различие между двумя категориями не вполне ясно. Описательный перевод первого термина и более общее обозначение второго передают основной смысл, не отождествляя их с персонажами позднего фольклора или современного спиритизма.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис прост и доступен; вводное «теперь» не добавлено, поскольку в еврейском тексте нет соответствующего временного слова. Частица «же» отмечает переход ко второму фоновому обстоятельству.
