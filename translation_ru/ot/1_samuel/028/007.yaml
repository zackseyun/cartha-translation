base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/007.yaml
  text: Then Saul said to his servants, “Find for me a woman who is a medium, so that I may go to her and inquire through her.” And his servants said to him, “Look, there is a woman who is a medium at En-dor.”
translation:
  language: ru
  text: 'Тогда Саул сказал своим слугам: «Найдите мне женщину, вызывающую духов[a], чтобы я пошёл к ней и вопросил через неё». Слуги ответили ему: «Вот, в Эн-Доре есть женщина, вызывающая духов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «женщину — обладательницу ова». Еврейское ов — термин с не вполне ясным значением; он может относиться к духу умершего, к способу гадания или к практике обращения к умершим.'
    reason: Примечание сохраняет неоднозначность אוֹב, не утверждая ни природу предполагаемого духа, ни действительность практики.
lexical_decisions:
- source_word: אֵשֶׁת בַּעֲלַת אוֹב
  choice: женщину, владеющую духом умершего
  rationale: Буквально конструкция описывает женщину — обладательницу אוֹב. В данном контексте אוֹב обозначает дух умершего либо средство обращения к умершим; перевод сохраняет древнее представление, не сводя выражение к современному расплывчатому «медиум».
- source_word: בַּקְּשׁוּ לִי
  choice: Найдите мне
  rationale: В контексте повеление означает разыскать подходящего человека; «найдите» естественно и точно передаёт функцию глагола.
- source_word: וְאֶדְרְשָׁה בָּהּ
  choice: и вопросил через неё
  rationale: 'Предлог ב допускает инструментальное понимание: Саул намерен получить ответ посредством женщины. Формулировка сохраняет отличие между женщиной и тем, к кому фактически обращаются за знанием.'
- source_word: הִנֵּה
  choice: Есть такая женщина
  rationale: В ответе слуг частица вводит указание на доступного человека; по-русски естественнее передать её как сообщение о наличии, без архаического «вот».
- source_word: עֵין דּוֹר
  choice: Эн-Доре
  rationale: Устоявшаяся русская передача топонима Эн-Дор; после «в» употреблён предложный падеж.
theological_decisions:
- issue: Природа אוֹב и посредничества женщины
  choice: дух умершего; вопросить через неё
  alternative: медиум; вопросить у неё
  rationale: Текст описывает запрещённую практику обращения к умершим, но сам этот стих ещё не решает всех вопросов о природе последующего явления. Перевод не утверждает ни действенность, ни иллюзорность практики и не делает женщину конечным источником ответа.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Вопросил» сохранено как понятный высокий глагол, соответствующий серьёзности повествования; синтаксис не перегружен архаизмами.
