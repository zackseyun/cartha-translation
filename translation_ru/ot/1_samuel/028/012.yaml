  text: וַ/תֵּ֤רֶא הָֽ/אִשָּׁה֙ אֶת שְׁמוּאֵ֔ל וַ/תִּזְעַ֖ק בְּ/ק֣וֹל גָּד֑וֹל וַ/תֹּאמֶר֩ הָ/אִשָּׁ֨ה אֶל שָׁא֧וּל לֵ/אמֹ֛ר לָ֥/מָּה רִמִּיתָ֖/נִי וְ/אַתָּ֥ה שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/012.yaml
  text: When the woman saw Samuel[a], she cried out with a loud voice, and the woman said to Saul, “Why have you deceived me? You are Saul!”
translation:
  language: ru
  text: 'Когда женщина увидела Самуила[a], она громко вскрикнула и сказала Саулу: «Зачем ты обманул меня? Ведь ты Саул!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «того, кто казался Самуилом». В еврейском тексте сказано просто «Самуила», без пояснения природы этого явления.'
    reason: Сохраняет прямую формулировку оригинала и одновременно отмечает возможное понимание, не разрешая спорный вопрос в основном тексте.
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: увидела
  rationale: Глагол ראה в последовательной повествовательной форме естественно передаётся как «увидела»; более отвлечённое «восприняла» внесло бы лишнее толкование.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: Здесь употреблено обычное слово «женщина», а не обозначение её занятия; контекстуальную характеристику не следует подставлять в сам стих.
- source_word: אֶת שְׁמוּאֵל
  choice: Самуила
  rationale: Еврейский текст прямо называет Самуила объектом видения, не поясняя природу явления.
- source_word: וַתִּזְעַק בְּקוֹל גָּדוֹל
  choice: громко вскрикнула
  rationale: זעק обозначает сильный крик, а בְּקוֹל גָּדוֹל усиливает его; выражение естественно и ёмко передаёт обе части фразы.
- source_word: וַתֹּאמֶר ... לֵאמֹר
  choice: сказала
  rationale: Русское «сказала» естественно передаёт формулу речи без буквального и тяжеловесного повтора «сказала, говоря».
- source_word: לָמָּה
  choice: зачем
  rationale: В вопросе о совершённом обмане «зачем» звучит естественно и передаёт вопрос о причине или намерении.
- source_word: רִמִּיתָנִי
  choice: ты обманул меня
  rationale: Пиэль глагола רמה означает обман или введение в заблуждение; совершенный вид соответствует уже раскрытому обману Саула.
- source_word: וְאַתָּה שָׁאוּל
  choice: Ведь ты Саул!
  rationale: Союз וְ и отдельное местоимение אַתָּה придают реплике выразительную, разоблачающую силу; «ведь» естественно передаёт внезапное узнавание и связь с предыдущим вопросом.
theological_decisions:
- issue: Следует ли уточнять, что женщина увидела призрак, дух или лишь нечто, казавшееся Самуилом
  choice: Сохранить прямое «увидела Самуила»
  alternative: «увидела того, кто казался Самуилом»; «увидела дух Самуила»; «увидела призрак Самуила»
  rationale: Еврейский рассказ прямо говорит «Самуила» и в этом стихе не определяет природу увиденного. Уточнение в основном тексте разрешило бы богословский вопрос, который сам текст оставляет открытым.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. «Громко вскрикнула» передаёт интенсивность без архаичного «возопила», а реплика сохраняет эмоциональность внезапного узнавания.
