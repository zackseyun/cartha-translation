  source_fidelity: 'Текст точно передаёт повествовательную последовательность еврейского оригинала: женщина увидела Самуила, громко вскрикнула и обратилась к Саулу с вопросом о его обмане и узнаванием его личности. «Громко вскрикнула» адекватно выражает וַתִּזְעַק בְּקוֹל גָּדוֹל; «Ведь ты Саул!» естественно передаёт разоблачающую силу emphatic וְאַתָּה שָׁאוּל, не навязывая дополнительного толкования.'
