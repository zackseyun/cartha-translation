base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/002.yaml
  text: David said to Achish[a], “Then you yourself will know what your servant can do.” And Achish said to David, “Very well[b], I will make you my bodyguard for all your days.”
translation:
  language: ru
  text: 'Давид сказал Анхусу: «Тогда ты сам узнаешь, что сделает твой слуга».[a] Анхус ответил Давиду: «Что ж, я навсегда поставлю тебя своим телохранителем».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слова Давида намеренно двусмысленны: он не говорит, что именно сделает.'
    reason: ambiguity
  - marker: b
    text: 'Буквально: «стражем для моей головы», то есть личным охранником.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Тогда
  rationale: В ответе Давида слово служит связкой с предыдущими словами Анхуса и естественно передаётся как «тогда».
- source_word: אַתָּה תֵדַע
  choice: ты сам узнаешь
  rationale: Отдельное местоимение אַתָּה подчёркивает подлежащее; «сам» естественно сохраняет это смысловое ударение.
- source_word: אֵת אֲשֶׁר יַעֲשֶׂה
  choice: что сделает
  rationale: 'Так буквально и естественно передаётся форма יַעֲשֶׂה. Реплика остаётся намеренно двусмысленной: Давид не уточняет, что именно он сделает и на чьей стороне выступит.'
- source_word: עַבְדֶּךָ
  choice: твой слуга
  rationale: Это принятая почтительная форма самообозначения при обращении к правителю, а не обязательное указание на рабский статус.
- source_word: לָכֵן
  choice: Что ж
  rationale: Во второй реплике слово выражает принятие Анхусом сказанного и переход к сделанному им выводу.
- source_word: שֹׁמֵר לְרֹאשִׁי
  choice: своим телохранителем
  rationale: Буквально «стражем для моей головы»; в данном контексте это идиома, обозначающая личного охранника.
- source_word: אֲשִׂימְךָ
  choice: поставлю тебя
  rationale: Глагол שׂים здесь означает назначение человека на определённую должность или роль.
- source_word: כָּל הַיָּמִים
  choice: навсегда
  rationale: Буквально «на все дни»; в обещании Анхуса выражение естественно означает постоянное, пожизненное назначение.
theological_decisions:
- issue: Намеренная двусмысленность ответа Давида
  choice: Сохранить формулировку «что сделает твой слуга», не уточняя намерений Давида
  alternative: «на что способен твой слуга» или явное указание, что Давид будет сражаться за Анхуса
  rationale: Еврейский текст не раскрывает, какое действие имеет в виду Давид. Контекст создаёт иронию, но перевод не должен разрешать её за читателя.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. «Анхус» соответствует традиционной русской форме имени. Реплики звучат естественно, при этом подчёркивание אַתָּה и двусмысленность обещания Давида сохранены.
