  text: וַ/תֹּ֨אמֶר הָֽ/אִשָּׁ֜ה אֵלָ֗י/ו הִנֵּ֨ה אַתָּ֤ה יָדַ֨עְתָּ֙ אֵ֣ת אֲשֶׁר עָשָׂ֣ה שָׁא֔וּל אֲשֶׁ֥ר הִכְרִ֛ית אֶת הָ/אֹב֥וֹת וְ/אֶת הַ/יִּדְּעֹנִ֖י מִן הָ/אָ֑רֶץ וְ/לָ/מָ֥ה אַתָּ֛ה מִתְנַקֵּ֥שׁ בְּ/נַפְשִׁ֖/י לַ/הֲמִיתֵֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/009.yaml
  text: But the woman said to him[a], “Look, you yourself know what Saul has done, that he has cut off the mediums and the spiritists from the land. So why are you laying a snare for my life, to put me to death?”
translation:
  language: ru
  text: 'Но женщина сказала ему: «Ты ведь сам знаешь, что сделал Саул: он искоренил в стране медиумов и гадателей[a]. Зачем же ты ставишь мне ловушку, чтобы убить меня?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вызывающих духов и ведунов»; традиционно: «обладающих духами и знающих». Точное различие между еврейскими терминами אֹבוֹת и יִדְּעֹנִים не вполне ясно.'
    reason: Сноска отражает лексическую неопределённость и традиционные варианты, не приписывая практике действительный контакт с духами.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Но ... сказала
  rationale: 'Последовательный вав продолжает повествование, а «но» естественно передаёт контраст: женщина с опаской возражает на просьбу незнакомца.'
- source_word: הִנֵּה אַתָּה יָדַעְתָּ
  choice: Ты ведь сам знаешь
  rationale: «Ведь» передаёт побуждение признать очевидный факт, а «сам» сохраняет усиление, выраженное самостоятельным местоимением אַתָּה.
- source_word: אֵת אֲשֶׁר עָשָׂה שָׁאוּל
  choice: что сделал Саул
  rationale: Прямое и естественное соответствие объектному придаточному; дальнейшее пояснение вводится двоеточием.
- source_word: הִכְרִית
  choice: истребил
  rationale: Глагол обозначает решительное устранение или искоренение; «истребил» сохраняет суровость выражения, не уточняя способ исполнения царского указа.
- source_word: הָאֹבוֹת
  choice: вызывающих духов
  rationale: В данном контексте существительное во множественном числе обозначает людей, обращавшихся к духам или умершим. Описательный перевод понятен современному читателю и не утверждает, что практика действительно достигала заявленного результата.
- source_word: הַיִּדְּעֹנִי
  choice: знахарей
  rationale: Термин обозначает практиков оккультного знания или прорицания. «Знахари» сохраняет связь со знанием, хотя возможны и более специальные толкования.
- source_word: מִן הָאָרֶץ
  choice: в стране
  rationale: Речь идёт о подвластной Саулу земле, то есть стране Израиля; русское «истребил в стране» естественнее буквального «истребил из земли».
- source_word: וְלָמָה
  choice: Зачем же
  rationale: Передаёт логический вывод женщины из известной политики Саула и её подозрение относительно намерений собеседника.
- source_word: מִתְנַקֵּשׁ בְּנַפְשִׁי
  choice: расставляешь сеть для моей жизни
  rationale: Сохраняет древнееврейскую метафору западни и прямую направленность угрозы против её жизни.
- source_word: לַהֲמִיתֵנִי
  choice: чтобы погубить меня
  rationale: Инфинитив выражает цель — довести дело до её смерти. «Погубить» звучит естественно и достойно в контексте образа сети.
theological_decisions:
- issue: Передача обозначений запрещённых оккультных практиков без утверждения определённой теории о природе этих явлений
  choice: вызывающих духов и знахарей
  alternative: медиумов и прорицателей; вызывающих мёртвых и ведунов
  rationale: Выбранные слова обозначают заявленный вид деятельности этих людей, не решая вопроса о действительности контакта с духами. Сноска сохраняет более точные современные альтернативы и реальную лексическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Реплика женщины передана живо и настороженно; метафора сети сохранена. Маркер сноски поставлен после слов, к которым относится примечание.
