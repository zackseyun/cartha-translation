- from: 'Но женщина сказала ему[a]: «Ты ведь сам знаешь, что сделал Саул: он истребил в стране вызывающих духов и знахарей. Зачем же ты расставляешь сеть для моей жизни, чтобы погубить меня?»'
  to: 'Но женщина сказала ему: «Ты ведь сам знаешь, что сделал Саул: он искоренил в стране медиумов и гадателей[a]. Зачем же ты ставишь мне ловушку, чтобы убить меня?»'
  rationale: 'Исправлены два смысловых риска: «знахари» заменены на «гадатели», а «истребил» — на «искоренил», что сохраняет решительность действия Саула без утверждения о казни. Метафора западни передана естественной русской конструкцией. Сноска перенесена к разъясняемым терминам и уточнена.'
