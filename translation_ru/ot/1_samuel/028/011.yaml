  text: Then the woman said[a], “Whom shall I bring up for you?” And he said, “Bring up Samuel for me.”
translation:
  language: ru
  text: 'Тогда женщина сказала: «Кого мне поднять для тебя?[a]» И он сказал: «Подними для меня Самуила».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вызвать». Еврейский глагол буквально означает «поднять» или «заставить подняться»; здесь он употреблён в некромантическом контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר הָאִשָּׁה
  choice: Тогда женщина спросила
  rationale: Форма וַתֹּאמֶר продолжает повествование; «тогда» естественно передаёт последовательность. В русском языке перед прямым вопросом «спросила» точнее и естественнее, чем буквальное «сказала», не меняя смысла.
- source_word: אֶת מִי
  choice: кого
  rationale: Частица אֶת отмечает прямое дополнение; русское «кого» точно передаёт объектную форму вопросительного местоимения.
- source_word: אַעֲלֶה
  choice: мне поднять
  rationale: Порода hифиль глагола עלה буквально означает «поднять, заставить подняться». Выбор сохраняет пространственный образ еврейского текста и не объясняет механизм происходящего.
- source_word: לָּךְ
  choice: для тебя
  rationale: Предлог ל здесь имеет значение адресата или лица, в чьих интересах совершается действие; «для тебя» естественно передаёт этот оттенок.
- source_word: וַיֹּאמֶר
  choice: Он ответил
  rationale: В реплике, непосредственно следующей за вопросом, русское «ответил» естественно передаёт функцию глагола אמר в диалоге, хотя буквально он означает «сказал».
- source_word: אֶת שְׁמוּאֵל
  choice: Самуила
  rationale: Частица прямого дополнения отдельно не переводится; имя שְׁמוּאֵל передано в принятой русской библейской форме «Самуил», здесь в винительном падеже.
- source_word: הַעֲלִי לִי
  choice: Подними мне
  rationale: Женский род повелительной формы определяется адресатом и в русском отдельно не выражается. «Подними» сохраняет тот же корень и образ, что и предыдущая форма; «мне» естественно передаёт бенефактивное לִי.
theological_decisions:
- issue: Передача некромантического употребления глагола עלה
  choice: поднять
  alternative: вызвать; заставить подняться
  rationale: Буквальное «поднять» сохраняет образ исходного текста, вероятно связанный с представлением о восхождении умершего, но не утверждает, каким именно образом произошло явление Самуила. «Вызвать» звучит естественнее в данном контексте, однако сильнее истолковывает действие.
translation_notes:
  register: Современный литературный русский язык с простой, достойной повествовательной интонацией. Повтор глагола «поднять» намеренно сохранён ради лексической связи между вопросом женщины и ответом Саула.
