base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/021.yaml
  text: The woman came to Saul[a], and when she saw that he was very terrified, she said to him, “Behold, your servant has obeyed your voice[b], and I have put my life in my hand and listened to your words that you spoke to me.”
translation:
  language: ru
  text: 'Женщина подошла к Саулу и, увидев, что он очень испуган, сказала ему: «Вот, твоя служанка послушалась тебя[a]. Я рисковала жизнью[b] и послушала то, что ты мне сказал».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское: «твоя служанка вняла твоему голосу». Этот оборот означает, что она послушалась Саула и исполнила его просьбу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «я положила свою жизнь на ладонь». Еврейское образное выражение означает: «я рисковала жизнью».'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַתָּבוֹא הָאִשָּׁה אֶל שָׁאוּל
  choice: Женщина подошла к Саулу
  rationale: Глагол движения передаёт приближение женщины к Саулу; «подошла» естественно звучит по-русски и не добавляет характеристику женщины из контекста.
- source_word: וַתֵּרֶא כִּי נִבְהַל מְאֹד
  choice: увидев, что он очень испуган
  rationale: נבהל обозначает сильный испуг или потрясение, а מְאֹד усиливает состояние. Деепричастная конструкция естественно передаёт последовательность еврейского повествования.
- source_word: הִנֵּה
  choice: Вот
  rationale: «Вот» сохраняет функцию частицы, привлекающей внимание к последующему доводу женщины, без излишне архаичного оттенка.
- source_word: שָׁמְעָה שִׁפְחָתְךָ בְּקוֹלֶךָ
  choice: твоя служанка послушалась тебя
  rationale: שִׁפְחָה — женская форма обозначения служанки; здесь это почтительное самонаименование. Оборот שׁמע בְּקוֹל означает не просто услышать, а послушаться или исполнить просьбу.
- source_word: וָאָשִׂים נַפְשִׁי בְּכַפִּי
  choice: Я положила свою жизнь на ладонь
  rationale: Сохранён яркий еврейский образ сознательного риска для жизни; его значение пояснено в сноске.
- source_word: וָאֶשְׁמַע אֶת דְּבָרֶיךָ אֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: и послушала то, что ты мне сказал
  rationale: Формулировка сохраняет значение שׁמע как внимательного и деятельного слушания, не сводя его ни к простому слышанию, ни к более узкому «исполнила приказ».
