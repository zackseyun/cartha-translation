  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לָ֥/מָּה הִרְגַּזְתַּ֖/נִי לְ/הַעֲל֣וֹת אֹתִ֑/י וַ/יֹּ֣אמֶר שָׁ֠אוּל צַר לִ֨/י מְאֹ֜ד וּ/פְלִשְׁתִּ֣ים נִלְחָמִ֣ים בִּ֗/י וֵֽ/אלֹהִ֞ים סָ֤ר מֵֽ/עָלַ/י֙ וְ/לֹֽא עָנָ֣/נִי ע֗וֹד גַּ֤ם בְּ/יַֽד הַ/נְּבִיאִם֙ גַּם בַּ֣/חֲלֹמ֔וֹת וָ/אֶקְרָאֶ֣/ה לְ/ךָ֔ לְ/הוֹדִיעֵ֖/נִי מָ֥ה אֶעֱשֶֽׂה־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/015.yaml
  text: Then Samuel said to Saul[a], “Why have you disturbed me by bringing me up?” Saul answered, “I am in great distress. The Philistines are fighting against me, and God has turned away from me and no longer answers me, either by prophets or by dreams[b]. So I have called you to tell me what I should do.”
translation:
  language: ru
  text: 'Тогда Самуил сказал Саулу: «Зачем ты потревожил меня, вызвав меня наверх[a]?» Саул ответил: «Мне очень тяжело: филистимляне воюют против меня, а Бог отступил от меня и больше не отвечает мне — ни через пророков[b], ни в снах. Поэтому я и позвал тебя, чтобы ты сказал мне, что делать».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы поднять меня»; также: «чтобы вывести меня наверх».'
    reason: Сноска сохраняет пространственный образ еврейского глагола עלה и точно отражает инфинитивную конструкцию лְהַעֲלוֹת אֹתִי.
  - marker: b
    text: 'Буквально: «рукой пророков», то есть через пророков.'
    reason: Поясняется еврейская идиома בְּיַד, обозначающая посредство или средство действия.
lexical_decisions:
- source_word: הִרְגַּזְתַּנִי
  choice: ты потревожил меня
  rationale: Глагол רגז в каузативной форме выражает причинённое беспокойство или нарушение покоя. «Потревожил» естественно по-русски и не уточняет сверх сказанного механизм явления Самуила.
- source_word: לְהַעֲלוֹת אֹתִי
  choice: вызвав меня наверх
  rationale: Сохраняется пространственный образ עלה — движения снизу вверх, а «вызвав» передаёт контекст призывания умершего, не превращая выражение в язык воскресения.
- source_word: צַר לִי מְאֹד
  choice: мне очень тяжело
  rationale: Идиоматично передаёт сильную стеснённость, бедствие и душевную тяжесть Саула; выражение понятно современному читателю.
- source_word: נִלְחָמִים בִּי
  choice: воюют против меня
  rationale: Передаёт направленное против Саула военное действие без усиления до более узкого «нападают».
- source_word: וֵאלֹהִים סָר מֵעָלַי
  choice: Бог отступил от меня
  rationale: «Отступил» достаточно близко передаёт סור מעל — удаление или отход — и сохраняет напряжение текста, не объясняя природу Божьего отсутствия.
- source_word: וְלֹא עָנָנִי עוֹד
  choice: больше не отвечает мне
  rationale: Естественно выражает прекращение ответа, обозначенное עוֹד.
- source_word: גַּם בְּיַד הַנְּבִיאִם
  choice: ни через пророков
  rationale: ביד здесь обозначает посредство или действие через кого-либо. В русском отрицательная конструкция «ни… ни…» естественно передаёт парное גם…גם после отрицания.
- source_word: גַּם בַּחֲלֹמוֹת
  choice: ни в снах
  rationale: Передаёт второй названный способ откровения; предлог «в» естественен для русского библейского повествования и соответствует форме בַּחֲלֹמוֹת.
- source_word: וָאֶקְרָאֶה לְךָ
  choice: поэтому я и позвал тебя
  rationale: קרא с ל допускает значение обращения или призывания. «Позвал» звучит естественно и не добавляет отсутствующего в тексте технического оккультного термина.
- source_word: לְהוֹדִיעֵנִי מָה אֶעֱשֶׂה
  choice: чтобы ты сказал мне, что делать
  rationale: Кратко и естественно передаёт каузатив ידע — «дать знать» — вместе с вопросом о требуемом действии.
theological_decisions:
- issue: Кем является Самуил в повествовании о вызывании умершего
  choice: Перевод прямо называет говорящего Самуилом, как это делает еврейский повествователь.
  alternative: Добавить квалификацию вроде «явление Самуила», «дух, выдававший себя за Самуила» или «тот, кого сочли Самуилом».
  rationale: 'В масоретском тексте прямо сказано: «Самуил сказал Саулу». Перевод сохраняет представленную повествованием картину, не решая за читателя более широкий богословский спор о природе события.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Реплики ясны обычному читателю; пространственный образ «наверх» и прямое именование Самуила сохранены. Слово «филистимляне» написано со строчной буквы как название народа.
