base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/022.yaml
  text: Now then[a], please listen, you also, to the voice of your female servant, and let me set a piece of bread before you. Eat, so that there may be strength in you[c][b], because you must go on your way.
translation:
  language: ru
  text: 'А теперь послушай и ты свою служанку: позволь мне положить перед тобой кусок хлеба. Поешь, чтобы у тебя появились силы, ведь тебе предстоит отправиться в путь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт переход к настоятельной просьбе; союз וְ сохранён естественным для русского повествования оборотом.
- source_word: שְׁמַע נָא
  choice: послушай
  rationale: Императив с נָא выражает смягчённую, настойчивую просьбу. В данном контексте «послушай» естественно включает оттенок «внемли просьбе».
- source_word: גַּם אַתָּה
  choice: и ты
  rationale: 'Сохраняет подчёркнутую взаимность: теперь Саулу следует послушать женщину, как прежде она послушала его.'
- source_word: בְּקוֹל שִׁפְחָתֶךָ
  choice: свою служанку
  rationale: Естественно передаёт еврейскую идиому «слушать голос кого-либо», то есть внимать ему. «Служанка» сохраняет женский род שִׁפְחָה и самоуничижительную форму обращения.
- source_word: וְאָשִׂימָה לְפָנֶיךָ
  choice: позволь мне поставить перед тобой
  rationale: Когортатив первого лица передаёт предложение и просьбу разрешить действие, а не простое сообщение о будущем.
- source_word: פַּת לֶחֶם
  choice: кусок хлеба
  rationale: Прямой и современный эквивалент выражения; сохраняет значение отдельного куска или небольшой порции хлеба без излишне архаичного «ломоть».
- source_word: וֶאֱכֹל
  choice: Поешь
  rationale: Императив в контексте заботливого побуждения естественно передаётся совершенным видом; союз можно не воспроизводить отдельно после точки.
- source_word: וִיהִי בְךָ כֹּחַ
  choice: чтобы у тебя появились силы
  rationale: Передаёт желаемый результат еды и естественно звучит по-русски; множественное «силы» идиоматично обозначает физическую способность продолжить путь.
- source_word: כִּי תֵלֵךְ בַּדָּרֶךְ
  choice: ведь тебе предстоит отправиться в путь
  rationale: כִּי вводит основание просьбы, а имперфект указывает на предстоящее движение. Формулировка не усиливает значение до обязанности, которой глагольная форма прямо не выражает.
