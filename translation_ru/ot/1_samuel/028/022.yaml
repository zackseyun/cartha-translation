translation_notes:
  register: Современный литературный русский язык с уважительным, но не архаичным звучанием. Самоназвание женщины «служанка» сохранено, тогда как буквальная еврейская идиома «слушать голос» передана естественным русским глаголом. Пунктуация делит длинную просьбу на ясные смысловые части.
