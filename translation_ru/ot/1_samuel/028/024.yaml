base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/024.yaml
  text: The woman had a fattened calf in the house[a], and she hurried and slaughtered it. Then she took flour, kneaded it[c][b], and baked unleavened bread.
translation:
  language: ru
  text: У женщины в доме был откормленный телёнок[a]. Она поспешила, заколола его[b], затем взяла муку, замесила тесто и испекла пресные лепёшки[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «телёнок стойлового откорма»; традиционно: «упитанный телёнок».'
    reason: lexical_alternative
  - marker: b
    text: Употреблённый здесь глагол в некоторых контекстах может означать заклание жертвы, но здесь речь идёт об убое животного для еды.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «пресный хлеб».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵגֶל מַרְבֵּק
  choice: откормленный телёнок
  rationale: עֵגֶל обозначает молодое животное крупного рогатого скота, а מַרְבֵּק — животное, откормленное, вероятно, при стойловом содержании. Сочетание «откормленный телёнок» точно и естественно для современного русского языка.
- source_word: בַּבַּיִת
  choice: в доме
  rationale: Сохранено конкретное пространственное значение еврейского выражения, без более общего «у себя».
- source_word: וַתְּמַהֵר
  choice: поспешила
  rationale: Передаёт быстроту и неотложность действия в повествовательной последовательности.
- source_word: וַתִּזְבָּחֵהוּ
  choice: заколола его
  rationale: В данном контексте речь идёт об убое животного для приготовления еды, а не о культовом жертвоприношении. «Заколола» сохраняет конкретность действия и не вносит жертвенного смысла.
- source_word: קֶמַח וַתָּלָשׁ
  choice: взяла муку, замесила тесто
  rationale: Глагол וַתָּלָשׁ означает замешивание. Слово «тесто» добавлено как однозначно подразумеваемый результат действия, поскольку по-русски нельзя естественно сказать «замесила муку».
- source_word: מַצּוֹת
  choice: пресные лепёшки
  rationale: Форма множественного числа обозначает хлебные изделия без закваски. «Пресные лепёшки» естественно передаёт и отсутствие закваски, и множественность; более общее «пресный хлеб» также возможно.
theological_decisions:
- issue: Возможный жертвенный оттенок глагола זבח
  choice: заколола его
  alternative: принесла его в жертву
  rationale: Контекст описывает приготовление еды для Саула и его слуг; признаков культового жертвоприношения нет. Поэтому жертвенное истолкование не вводится в основной текст.
translation_notes:
  register: Современный литературный русский язык с ясной повествовательной последовательностью. Сохранена конкретность бытовой сцены; синтаксис слегка сглажен ради естественности, а подразумеваемое «тесто» выражено явно.
