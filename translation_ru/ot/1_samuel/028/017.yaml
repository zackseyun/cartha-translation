base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/017.yaml
  text: 'And Yahweh has done for you just as he spoke by my hand: Yahweh has torn the kingdom out of your hand and given it to your neighbor[b][a], to David.'
translation:
  language: ru
  text: 'И Яхве сделал для Себя[b] так, как говорил через меня[a]: Яхве вырвал царство из твоей руки и отдал его твоему ближнему — Давиду.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как говорил моей рукой»; то есть «через меня».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте: «для него / для Себя». Многие переводы по контексту передают: «тебе» или «с тобой».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога YHWH транслитерацией, а не заменяет его титулом.
- source_word: וַיַּעַשׂ ... לוֹ
  choice: сделал для Себя
  rationale: Прямо сохраняет масоретское לוֹ («для него / для себя»), не исправляя его по контексту на «для тебя».
- source_word: כַּאֲשֶׁר דִּבֶּר בְּיָדִי
  choice: так, как говорил через меня
  rationale: בְּיַדִי обозначает посредничество говорящего; естественное русское «через меня» передаёт смысл еврейской идиомы.
- source_word: וַיִּקְרַע
  choice: вырвал
  rationale: Сохраняет резкий образ глагола קָרַע («разрывать, отрывать») и естественно сочетается с выражением «из твоей руки».
- source_word: הַמַּמְלָכָה
  choice: царство
  rationale: Естественно обозначает царскую власть и владение Саула, не сужая значение до отвлечённого статуса царя.
- source_word: מִיָּדֶךָ
  choice: из твоей руки
  rationale: Сохраняет еврейский образ удаления из владения и власти Саула.
- source_word: וַיִּתְּנָהּ
  choice: и отдал его
  rationale: Местоимение относится к слову «царство»; русская форма согласована с его грамматическим родом.
- source_word: לְרֵעֲךָ
  choice: твоему ближнему
  rationale: רֵעַ может означать ближнего, товарища или другого близкого человека; дальнейшее уточнение «Давиду» однозначно называет адресата.
- source_word: לְדָוִד
  choice: Давиду
  rationale: Стандартная русская форма библейского личного имени в дательном падеже.
theological_decisions:
- issue: Чтение לוֹ в первой части стиха
  choice: «сделал для Себя»
  alternative: «сделал тебе» / «поступил с тобой»
  rationale: В представленном масоретском тексте стоит לוֹ («ему / для него»), а не לְךָ («тебе / для тебя»). Необычность выражения сохранена, а не устранена молчаливым исправлением по контексту.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Необычное «для Себя» намеренно сохраняет чтение масоретского текста; более буквальная еврейская идиома «моей рукой» вынесена в примечание.
