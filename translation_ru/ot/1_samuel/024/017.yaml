base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/017.yaml
  text: When David had finished speaking these words to Saul[a], Saul said, “Is this your voice, my son David?” Then Saul lifted up his voice and wept.
translation:
  language: ru
  text: 'Когда Давид закончил говорить Саулу эти слова, Саул сказал: «Твой ли это голос, сын мой Давид?» И Саул возвысил голос и заплакал.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת דָּוִד לְדַבֵּר
  choice: Когда Давид закончил говорить
  rationale: Сочетание וַיְהִי с כְּ и инфинитивом образует временную придаточную конструкцию. Такой перевод естественно передаёт завершение речи и последовательность событий.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה אֶל שָׁאוּל
  choice: Саулу эти слова
  rationale: В контексте только что произнесённой речи דְּבָרִים означает именно «слова»; русский порядок слов сохраняет адресата и указание на содержание речи.
- source_word: הֲקֹלְךָ זֶה
  choice: Твой ли это голос
  rationale: קוֹל здесь обозначает узнаваемый голос, а вопросительная частица הֲ передана русской частицей «ли» без добавления ожидания определённого ответа.
- source_word: בְּנִי דָוִד
  choice: сын мой Давид
  rationale: Сохранено обращение с притяжательным местоимением и несколько торжественный порядок слов, соответствующий эмоциональному тону сцены.
- source_word: וַיִּשָּׂא שָׁאוּל קֹלוֹ
  choice: Саул возвысил голос
  rationale: Перевод сохраняет древнееврейский образный оборот и его торжественно-повествовательное звучание, не сводя его преждевременно к следующему глаголу.
- source_word: וַיֵּבְךְּ
  choice: заплакал
  rationale: Глагол прямо обозначает плач; совершенный вид естественно передаёт наступившее действие в русском повествовании.
theological_decisions:
- issue: Обращение Саула к Давиду «сын мой»
  choice: Сохранено как эмоционально-реляционное обращение
  alternative: Истолковать как исключительно политическое обозначение благосклонности или покровительства
  rationale: Еврейский текст прямо употребляет язык сыновства, но контекст не требует понимать его как буквальное утверждение о родстве или придавать ему специальный доктринальный смысл.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Еврейский оборот «возвысил голос» сохранён ради образности и эмоциональной последовательности: Саул возвысил голос и заплакал.'
