  source_fidelity: 'Содержание клятвы передано верно: Саул просит Давида не истреблять его потомство после его смерти и не устранять его имя из отцовского дома. Однако оборот «поклянись мне Яхве» в современном русском синтаксически неясен: из-за неизменяемости имени «Яхве» инструментальное значение предлога בְּ не выражено. «Из дома моего отца» точнее передаёт מִבֵּית אָבִי, чем «в доме моего отца».'
