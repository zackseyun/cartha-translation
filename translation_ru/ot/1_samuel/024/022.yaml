  text: וְ/עַתָּ֗ה הִשָּׁ֤בְעָ/ה לִּ/י֙ בַּֽ/יהוָ֔ה אִם תַּכְרִ֥ית אֶת זַרְעִ֖/י אַֽחֲרָ֑/י וְ/אִם תַּשְׁמִ֥יד אֶת שְׁמִ֖/י מִ/בֵּ֥ית אָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/022.yaml
  text: Now swear to me by Yahweh that you will not cut off my descendants after me[c][b][a], and that you will not wipe out my name from my father's house.
translation:
  language: ru
  text: И теперь поклянись мне именем Яхве, что[a] ты не истребишь моих потомков[b] после моей смерти и не изгладишь моего имени[c] из дома моего отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь буквально стоит «если» — характерная формула клятвы. В данном контексте она вводит содержание обязательства, о котором Саул просит Давида: «что… не».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «моего потомства».'
    reason: lexical_alternative
  - marker: c
    text: «Моё имя» здесь означает сохраняющуюся память о Сауле и продолжение его семейной линии в отцовском доме.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительный элемент и функцию перехода к заключительной просьбе Саула.
- source_word: הִשָּׁבְעָה לִּי
  choice: поклянись мне
  rationale: Прямо и естественно передаёт повелительную форму и косвенное дополнение.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: В формуле клятвы предлог ב указывает, кем клянутся; форма «поклянись мне Яхве» сохраняет прямое употребление личного Божьего имени.
- source_word: אִם ... וְאִם
  choice: что ... и
  rationale: В контексте клятвенной формулы אִם вводит содержание требуемой клятвы; по-русски отрицательное обязательство естественно передаётся конструкцией «что ... не».
- source_word: תַּכְרִית
  choice: не истребишь
  rationale: Hiphil глагола כרת здесь означает устранение или уничтожение потомства; буквальное «не отсечёшь» по-русски менее естественно при таком дополнении.
- source_word: זַרְעִי
  choice: моих потомков
  rationale: Здесь זֶרַע обозначает потомство, а не буквальное семя.
- source_word: אַחֲרָי
  choice: после моей смерти
  rationale: 'Передаёт временной смысл выражения в данном контексте: Саул говорит о судьбе потомков после своего ухода из жизни.'
- source_word: תַּשְׁמִיד
  choice: не уничтожишь
  rationale: Hiphil שמד выражает полное уничтожение; выбран сильный, но литературно нейтральный русский глагол.
- source_word: שְׁמִי
  choice: моё имя
  rationale: Сохранён образ «имени», который включает память о Сауле и продолжение его семейной линии.
- source_word: מִבֵּית אָבִי
  choice: в доме моего отца
  rationale: Предлог מִן при глаголе уничтожения по-русски естественно передаётся местной конструкцией; «дом отца» сохраняет древнееврейское обозначение рода или большой семьи.
theological_decisions:
- issue: Передача имени יהוה в формуле клятвы
  choice: Яхве
  alternative: Господом; Иеговой
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя без замены титулом.
- issue: Отрицание при אִם в клятвенной формуле
  choice: что ты не истребишь ... и не уничтожишь
  alternative: если ты истребишь ... и если уничтожишь
  rationale: Буквальная условная конструкция в русском оставалась бы незавершённой и могла бы исказить просьбу Саула. Отрицательное содержание определяется клятвенной формулой и контекстом, однако особенность еврейского выражения отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Синтаксис остаётся ясным для обычного читателя; древняя родовая терминология сохранена там, где она смыслообразующая.
