base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/003.yaml
  text: Then Saul took three thousand chosen men from all Israel and went to seek David and his men in front of the rocks of the wild goats[a].
translation:
  language: ru
  text: И взял Саул три тысячи отборных воинов из всего Израиля и пошёл искать Давида и его людей напротив скал горных коз[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напротив утёсов диких коз». Вероятно, имеются в виду козероги.'
    reason: צוּרֵי можно передать как «скалы» или «утёсы»; יְעֵלִים обозначает диких горных коз и, вероятно, козерогов.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Прямо передаёт לקח в контексте набора людей для похода; по-русски естественно подразумевает, что Саул взял их с собой.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ בָּחוּר
  choice: три тысячи отборных воинов
  rationale: בָּחוּר обозначает отобранных, лучших людей; «воинов» естественно выражает военный контекст, не меняя количества.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: из всего Израиля
  rationale: Сохраняет указание на отбор людей из всей общности Израиля.
- source_word: וַיֵּלֶךְ לְבַקֵּשׁ
  choice: пошёл искать
  rationale: Естественно и близко к форме оригинала передаёт движение с целью разыскать и преследовать.
- source_word: אֶת דָּוִד וַאֲנָשָׁיו
  choice: Давида и его людей
  rationale: Прямо передаёт Давида и состоявших при нём людей, не уточняя сверх текста их статус.
- source_word: עַל פְּנֵי צוּרֵי הַיְּעֵלִים
  choice: у скал Диких Коз
  rationale: עַל פְּנֵי здесь допускает пространственное значение «у, перед»; «у» звучит естественно и не создаёт сомнительной картины нахождения буквально на поверхности скал. Название местности сохранено в понятной форме.
