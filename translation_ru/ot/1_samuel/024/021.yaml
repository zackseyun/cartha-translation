  yaml_path: translation/ot/1_samuel/024/021.yaml
  text: And now, look, I know that you will surely reign, and the kingdom of Israel will be established in your hand.
translation:
  language: ru
  text: И вот, теперь я знаю, что ты непременно будешь царствовать и царство Израиля утвердится в твоей руке.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: точно
  rationale: В сочетании «вот, я знаю» частица привлекает внимание и усиливает признание; по-русски её функция естественно передана усилением «точно знаю», без тяжеловесного «вот».
- source_word: מָלֹךְ תִּמְלוֹךְ
  choice: непременно будешь царём
  rationale: 'Инфинитив абсолютный при личной форме усиливает уверенность: Саул признаёт неизбежность царствования Давида.'
- source_word: וְקָמָה
  choice: утвердится
  rationale: Форма от קום здесь означает прочное установление или сохранение царства.
- source_word: בְּיָדְךָ
  choice: в твоей руке
  rationale: Сохранён образ руки как обозначение власти и управления, естественный и понятный в контексте.
theological_decisions:
- issue: Степень уверенности в будущем царствовании Давида
  choice: непременно будешь царём
  alternative: будешь царствовать
  rationale: Усилительная конструкция מָלֹךְ תִּמְלוֹךְ выражает не простое предсказание, а твёрдую уверенность; перевод не уточняет источник этой уверенности.
translation_notes:
  register: Современный литературный русский язык; торжественность признания сохранена без архаизмов. Образ «в твоей руке» оставлен как значимая библейская метафора власти.
