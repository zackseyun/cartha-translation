base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/009.yaml
  text: After that David rose and went out of the cave[a], and called after Saul, saying, “My lord the king!” When Saul looked behind him, David bowed with his face to the ground and prostrated himself.
translation:
  language: ru
  text: 'После этого Давид встал, вышел из пещеры и крикнул вслед Саулу: «Господин мой, царь!» Саул оглянулся, а Давид низко поклонился, лицом к земле, и простёрся ниц[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклонился». Еврейский глагол может обозначать глубокое преклонение или выражение почтения; здесь речь идёт о позе Давида перед Саулом, а не о поклонении ему как Богу.'
    reason: Лексическая альтернатива и разъяснение контекстуального значения.
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Глагол קום в данной повествовательной форме означает, что Давид поднялся или встал; «встал» естественно и точно передаёт начало действия.
- source_word: אַחֲרֵי כֵן
  choice: После этого
  rationale: Временное выражение прямо обозначает последовательность событий.
- source_word: וַיֵּצֵא מִן־הַמְּעָרָה
  choice: вышел из пещеры
  rationale: יצא с מן означает выход из какого-либо места; русский оборот точно передаёт направление движения.
- source_word: וַיִּקְרָא אַחֲרֵי שָׁאוּל
  choice: крикнул вслед Саулу
  rationale: קרא с אַחֲרֵי описывает обращение вслед удаляющемуся человеку. «Крикнул вслед» звучит естественно и передаёт необходимость привлечь внимание Саула.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Господин мой царь
  rationale: אֲדֹנִי выражает почтительное обращение, а הַמֶּלֶךְ сохраняет царский титул. Порядок слов придаёт обращению естественный для библейского повествования торжественный оттенок без архаизации.
- source_word: וַיַּבֵּט שָׁאוּל אַחֲרָיו
  choice: Саул оглянулся
  rationale: Буквально Саул «посмотрел назад». Русское «оглянулся» ёмко и естественно выражает это действие.
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: Давид склонился лицом до земли
  rationale: קדד обозначает низкий поклон, а идиома אַפַּיִם אַרְצָה — положение лицом к земле. Формулировка сохраняет телесную конкретность еврейского текста.
- source_word: וַיִּשְׁתָּחוּ
  choice: простёрся перед ним
  rationale: Форма от חוה/שׁחה обозначает глубокое земное преклонение. «Простёрся перед ним» отличает это действие от предшествующего наклона и в данном контексте не подразумевает поклонения Саулу как Богу.
theological_decisions:
- issue: Характер преклонения Давида перед Саулом
  choice: Глубокий телесный знак почтения и подчинения царю
  alternative: «Поклонился» или, вне данного контекста, «поклонился как Богу»
  rationale: Еврейский глагол может описывать как поклонение Богу, так и глубокое почтение человеку. Поскольку здесь действие направлено к Саулу, перевод сохраняет силу жеста, но не приписывает ему смысл богопоклонения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Синтаксис прост и понятен; архаизмы избегаются. Два последовательных еврейских глагола преклонения переданы разными выражениями, чтобы сохранить нарастание и телесную выразительность исходного текста.
