  yaml_path: translation/ot/1_samuel/024/015.yaml
  text: After whom has the king of Israel come out? After whom are you pursuing? After a dead dog[a], after a single flea.
translation:
  language: ru
  text: За кем выступил царь Израиля? За кем ты гонишься? За мёртвым псом[a], за одной-единственной блохой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Против кого выступил царь Израиля? Кого ты преследуешь?» Еврейский текст несколько раз употребляет предлог «за» в значении преследования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי מִי
  choice: за кем
  rationale: Предлог אַחֲרֵי буквально указывает на следование «за» кем-либо, а здесь обозначает преследование. Повтор «за кем» сохраняет риторический строй еврейского текста и естественно звучит по-русски.
- source_word: יָצָא
  choice: выступил
  rationale: Глагол означает «выйти». В данном контексте «выступил» естественно передаёт выход царя для военного преследования, не добавляя конкретной цели, не выраженной прямо.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Прямой перевод сохраняет торжественность титула и подчёркивает контраст между высоким положением Саула и ничтожностью преследуемого им человека.
- source_word: אַתָּה רֹדֵף
  choice: ты гонишься
  rationale: רֹדֵף обозначает продолжающееся преследование. «Гонишься» точно и естественно передаёт этот смысл в прямом обращении.
- source_word: כֶּלֶב מֵת
  choice: мёртвый пёс
  rationale: Буквальный образ служит выражением самоуничижения. Слово «пёс» сохраняет презрительную окраску образа лучше, чем нейтральное «собака».
- source_word: פַּרְעֹשׁ אֶחָד
  choice: одна-единственная блоха
  rationale: אֶחָד подчёркивает ничтожность и единичность объекта преследования. «Одна-единственная» естественно выражает это усиление по-русски.
- source_word: אַחֲרֵי ... אַחֲרֵי ... אַחֲרֵי
  choice: за ... за ... за ...
  rationale: Повтор предлога создаёт риторический ритм и усиливает насмешливый контраст; перевод сохраняет его во всех трёх частях стиха.
