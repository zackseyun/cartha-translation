source:
  edition: WLC
  text: וְ/אָבִ֣/י רְאֵ֔ה גַּ֗ם רְאֵ֛ה אֶת כְּנַ֥ף מְעִילְ/ךָ֖ בְּ/יָדִ֑/י כִּ֡י בְּ/כָרְתִ/י֩ אֶת כְּנַ֨ף מְעִֽילְ/ךָ֜ וְ/לֹ֣א הֲרַגְתִּ֗י/ךָ דַּ֤ע וּ/רְאֵה֙ כִּי֩ אֵ֨ין בְּ/יָדִ֜/י רָעָ֤ה וָ/פֶ֨שַׁע֙ וְ/לֹא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֛ה צֹדֶ֥ה אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/012.yaml
  text: And[a], my father, see—yes, see the corner of your robe in my hand. For when I cut off the corner of your robe[b], I did not kill you. Know and see that there is no evil or transgression in my hand, and I have not sinned against you[c], though you are hunting my life to take it.
translation:
  language: ru
  text: 'Отец мой, посмотри — да, посмотри на край твоей верхней одежды у меня в руке. Ведь когда я отрезал край твоей верхней одежды, я не убил тебя. Знай же и убедись: нет в моей руке ни зла, ни мятежа[a], и я не согрешил против тебя, а ты охотишься за моей жизнью, чтобы отнять её.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни зла, ни преступления»; еврейское слово может обозначать сознательное нарушение, преступление или мятеж.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבִי
  choice: И, отец мой
  rationale: Сохранены соединительный союз и почтительное родственно-политическое обращение Давида к Саулу.
- source_word: רְאֵה גַּם רְאֵה
  choice: посмотри — да, посмотри
  rationale: Повтор с גַּם передаёт настойчивое указание на вещественное доказательство; русская конструкция звучит естественно и выразительно.
- source_word: כְּנַף מְעִילְךָ
  choice: край своей верхней одежды
  rationale: כָּנָף здесь обозначает край или полу одежды, а מְעִיל — верхнюю одежду. «Своей» естественно отражает обращение ко второму лицу.
- source_word: בְּיָדִי
  choice: у меня в руке / в моей руке
  rationale: Буквальный образ руки сохранён как для предъявляемого лоскута, так и для утверждения об отсутствии злого действия или намерения.
- source_word: כִּי בְּכָרְתִי ... וְלֹא הֲרַגְתִּיךָ
  choice: Я отрезал ... но тебя не убил
  rationale: 'Связь между двумя действиями передана естественным русским противопоставлением: Давид мог убить Саула, но ограничился отрезанным краем одежды.'
- source_word: דַּע וּרְאֵה
  choice: Знай же и убедись
  rationale: «Убедись» передаёт требование увидеть доказательство и признать вытекающий из него вывод, не сводя два еврейских глагола к одному.
- source_word: אֵין בְּיָדִי רָעָה וָפֶשַׁע
  choice: нет в моей руке ни зла, ни мятежа
  rationale: Сохранён образ руки как сферы действия. פֶשַׁע допускает значения проступка и мятежа; в обращении к царю «мятеж» уместно передаёт политический оттенок, а альтернатива отмечена в сноске.
- source_word: וְלֹא חָטָאתִי לָךְ
  choice: и я не согрешил против тебя
  rationale: Формулировка сохраняет нравственно-религиозную силу חטא и личную направленность проступка.
- source_word: וְאַתָּה צֹדֶה אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: а ты охотишься за моей жизнью, чтобы отнять её
  rationale: Сохранены охотничья метафора צדה, значение נֶפֶשׁ как жизни в данном контексте и местоименная связь суффикса с «жизнью».
theological_decisions:
- issue: Нравственно-политический оттенок פֶשַׁע в отрицании Давида
  choice: мятеж
  alternative: преступление; проступок; беззаконие
  rationale: Давид говорит с царём и отвергает не только личное зло, но и посягательство на царскую власть. «Мятеж» сохраняет этот контекстуальный оттенок, однако многозначность слова открыто обозначена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Синтаксический параллелизм и повтор исходного текста по возможности сохранены; архаизмы и конфессионально окрашенные уточнения не добавлены.
