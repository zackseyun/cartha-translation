  to: 'Отец мой, посмотри — да, посмотри на край твоей верхней одежды у меня в руке. Ведь когда я отрезал край твоей верхней одежды, я не убил тебя. Знай же и убедись: нет в моей руке ни зла, ни мятежа[a], и я не согрешил против тебя, а ты охотишься за моей жизнью, чтобы отнять её.'
  rationale: Исправлена связь между отрезанием края одежды и отказом убить Саула, чтобы сохранить ход аргумента в еврейском тексте. Убрано неестественное начальное «И», а притяжательное «своей» заменено на ясное «твоей». Сноска сокращена и стилистически выровнена, сохраняя смысловую неоднозначность פשע.
