  source_fidelity: 'В целом перевод точно передаёт обращение Давида, вещественное доказательство, образ «руки», отрицание зла/פשע и охотничий образ преследования жизни. Однако конструкция «Я отрезал..., но тебя не убил» заменяет пояснительную связь כִּי («ибо/ведь, когда я отрезал...») простым противопоставлением и несколько ослабляет аргумент Давида: именно отрезание края одежды служит доказательством того, что он не убил Саула.'
  naturalness: Регистр в целом современный литературный и уместно сдержанно-возвышенный. «И, отец мой» по-русски звучит неестественно; начальный союз здесь можно не воспроизводить. Сочетание «своей верхней одежды» при прямом обращении менее ясно и последовательно, чем «твоей верхней одежды».
  terminology: «Мятеж» допустим как контекстуальная передача פשע в речи перед царём, но не исчерпывает лексическое значение; имеющаяся сноска правильно сохраняет альтернативы. «Согрешил против тебя» точно передаёт חטא с личной направленностью.
