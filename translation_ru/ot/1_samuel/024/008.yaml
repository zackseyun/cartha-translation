  text: David restrained his men with words and did not allow them to rise up against Saul[a]. Then Saul rose from the cave and went on his way.
translation:
  language: ru
  text: Давид удержал своих людей словами и не позволил им подняться против Саула.[a] А Саул встал и вышел из пещеры и пошёл своей дорогой.
