  text: May the LORD be judge and decide between me and you, see and plead my case, and vindicate me from your hand.
translation:
  language: ru
  text: Пусть Господь будет судьёй и рассудит между мной и тобой. Пусть Он увидит, вступится за моё дело и восстановит справедливость для меня, избавив меня от твоей руки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה יְהוָה לְדַיָּן
  choice: Пусть Господь будет судьёй
  rationale: Пожелательная конструкция естественно передана через «пусть»; традиционное «Господь» передаёт тетраграмматон יהוה в русском библейском регистре.
- source_word: וְשָׁפַט בֵּינִי וּבֵינֶךָ
  choice: и рассудит нас с тобой
  rationale: Глагол שפט здесь означает вынести решение в споре между сторонами; «рассудит нас с тобой» звучит естественно и сохраняет судебный образ.
- source_word: וְיֵרֶא
  choice: Пусть Он увидит
  rationale: Сохранено прямое значение ראה и параллельная пожелательная форма.
- source_word: וְיָרֵב אֶת רִיבִי
  choice: вступится за меня
  rationale: Идиома буквально говорит о ведении чьей-либо тяжбы; выбранная формулировка ясно передаёт защиту дела говорящего без тяжеловесного буквализма.
- source_word: וְיִשְׁפְּטֵנִי מִיָּדֶךָ
  choice: и защитит меня от твоей руки
  rationale: В данном контексте שפט с מִן выражает вынесение оправдывающего решения и избавление от власти противника; «защитит» сохраняет судебно-избавительный смысл, а «от твоей руки» — исходный образ.
theological_decisions:
- issue: Роль Господа в споре Давида с Саулом
  choice: Господь представлен как судья, который видит дело, вступается и защищает
  alternative: Передать последнюю фразу только как физическое избавление
  rationale: Последовательность судебной лексики — דַּיָּן, שָׁפַט, רִיב, שָׁפַט — требует сохранить и юридический, и избавительный оттенки, не сводя текст лишь к физическому спасению.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Краткие параллельные пожелательные фразы сохраняют риторическую силу оригинала; архаизмы избегаются, кроме укоренённого титула «Господь» и прозрачного образа «от твоей руки».
