base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/004.yaml
  text: He came to the sheepfolds by the road[a], where there was a cave, and Saul went in to relieve himself. Now David and his men were sitting in the innermost parts of the cave.
translation:
  language: ru
  text: Он дошёл до овечьих загонов у дороги. Там была пещера, и Саул вошёл в неё, чтобы справить нужду.[a] Давид же и его люди сидели в глубине пещеры.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «прикрыть ноги» — еврейский эвфемизм, означающий «справить нужду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּדְרוֹת הַצֹּאן
  choice: овечьи загоны
  rationale: Сочетание обозначает огороженные места для овец; «овечьи загоны» естественно и конкретно передаёт обстановку.
- source_word: עַל הַדֶּרֶךְ
  choice: у дороги
  rationale: Предлог здесь указывает на расположение загонов рядом с дорогой; такой перевод краток и естественен по-русски.
- source_word: מְעָרָה
  choice: пещера
  rationale: Обычное соответствие еврейскому существительному в данном контексте.
- source_word: לְהָסֵךְ אֶת רַגְלָיו
  choice: чтобы справить нужду
  rationale: Это еврейский эвфемистический оборот. Русское выражение ясно передаёт смысл, сохраняя сдержанный тон; буквальный образ приведён в сноске.
- source_word: בְּיַרְכְּתֵי הַמְּעָרָה
  choice: в глубине пещеры
  rationale: Форма указывает на удалённую, внутреннюю часть пещеры. «В глубине пещеры» естественно передаёт пространственный смысл и объясняет, почему Саул не заметил людей.
- source_word: יֹשְׁבִים
  choice: сидели
  rationale: Причастие описывает положение Давида и его людей в тот момент, а не длительное проживание.
- source_word: וַיָּבֹא ... וַיָּבֹא
  choice: Он дошёл ... Саул вошёл
  rationale: Первый глагол передаёт прибытие к загонам, второй — вход Саула в пещеру; выбор разных русских глаголов ясно сохраняет последовательность действий.
