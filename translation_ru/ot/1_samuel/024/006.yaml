  text: וַֽ/יְהִי֙ אַֽחֲרֵי כֵ֔ן וַ/יַּ֥ךְ לֵב דָּוִ֖ד אֹת֑/וֹ עַ֚ל אֲשֶׁ֣ר כָּרַ֔ת אֶת כָּנָ֖ף אֲשֶׁ֥ר לְ/שָׁאֽוּל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/006.yaml
  text: Afterward David’s heart struck him because he had cut off the corner of Saul’s robe[a][b].
translation:
  language: ru
  text: После этого сердце Давида стало укорять его за то, что он отрезал край одежды Саула[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сердце Давида ударило его» — древнееврейский образ, выражающий укоры совести.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «угол» либо «полу одежды Саула»; древнееврейское слово обозначает оконечность одежды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: После этого
  rationale: Естественно передаёт временную последовательность, не воспроизводя дословно древнееврейскую повествовательную формулу «и было».
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: сердце Давида стало укорять его
  rationale: Сохраняет сердце как субъект действия и передаёт смысл образного выражения — внутреннее нравственное обличение, — избегая неестественного и двусмысленного буквального «сердце ударило его».
- source_word: לֵב
  choice: сердце
  rationale: Сохраняет конкретный древнееврейский образ; в данном контексте сердце включает нравственное сознание и совесть.
- source_word: עַל אֲשֶׁר
  choice: за то, что
  rationale: Естественно по-русски обозначает основание внутреннего укора Давида.
- source_word: כָּרַת
  choice: отрезал
  rationale: Передаёт завершённое действие глагола «отрезать, отсекать»; русская последовательность событий ясна без отдельной формы плюсквамперфекта.
- source_word: כָּנָף
  choice: край
  rationale: В применении к одежде слово обозначает её оконечность, край или угол; «край» естественно и не сужает значение до специально обработанной каймы или подола.
- source_word: אֶת כָּנָף אֲשֶׁר לְשָׁאוּל
  choice: край одежды Саула
  rationale: Существительное «одежда» восстанавливается из непосредственного контекста предыдущего стиха и делает выражение ясным по-русски.
