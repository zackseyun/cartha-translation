  source_fidelity: 'Текст точно передаёт еврейскую конструкцию: неопределённое в пределах стиха «он сказал Давиду», сравнительное צַדִּיק ... מִמֶּנִּי («Ты праведнее меня»), причинное כִּי и намеренно повторённый глагол גמל в противопоставлении добра и зла. «Воздал мне добром / воздал тебе злом» сохраняет как взаимность, так и риторический параллелизм исходника.'
