  text: וַ/יֹּ֨אמֶר֙ אֶל דָּוִ֔ד צַדִּ֥יק אַתָּ֖ה מִמֶּ֑/נִּי כִּ֤י אַתָּה֙ גְּמַלְתַּ֣/נִי הַ/טּוֹבָ֔ה וַ/אֲנִ֖י גְּמַלְתִּ֥י/ךָ הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/018.yaml
  text: And he said to David[a], “You are more righteous than I, for you have repaid me with good, while I have repaid you with evil.”
translation:
  language: ru
  text: 'И сказал он Давиду: «Ты праведнее меня[a], потому что ты воздал мне добром, а я воздал тебе злом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты больше прав, чем я».'
    reason: 'Лексическая альтернатива: צַדִּיק может обозначать как праведность, так и правоту в конкретном споре или поступке.'
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל דָּוִד
  choice: И сказал он Давиду
  rationale: Сохранена обычная повествовательная форма; имя говорящего не добавлено, поскольку в самой еврейской фразе стоит местоименное «он».
- source_word: צַדִּיק אַתָּה מִמֶּנִּי
  choice: Ты праведнее меня
  rationale: צַדִּיק выражает нравственную правоту или праведность, а מִן образует сравнительную конструкцию. «Праведнее меня» кратко и естественно сохраняет моральный оттенок.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для признания говорящего; «потому что» ясно передаёт причинно-пояснительную связь.
- source_word: גְּמַלְתַּנִי הַטּוֹבָה
  choice: ты воздал мне добром
  rationale: Глагол גמל может означать соответствующее воздаяние или обхождение. «Воздал мне добром» сохраняет взаимную структуру и широкое противопоставление добра и зла.
- source_word: וַאֲנִי גְּמַלְתִּיךָ הָרָעָה
  choice: а я воздал тебе злом
  rationale: Противительный союз «а» естественно передаёт контраст; повтор «воздал» воспроизводит лексический и риторический параллелизм еврейского текста.
theological_decisions:
- issue: Значение צַדִּיק в признании Саула
  choice: праведнее меня
  alternative: больше прав, чем я
  rationale: Основной текст сохраняет нравственный вес слова, а примечание отражает возможный смысл сравнительной правоты, не устраняя неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм «воздал мне добром — воздал тебе злом» сохранён без конфессионально окрашенных уточнений.
