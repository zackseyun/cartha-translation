  text: וַ/יֹּ֤אמֶר דָּוִד֙ לְ/שָׁא֔וּל לָ֧/מָּה תִשְׁמַ֛ע אֶת דִּבְרֵ֥י אָדָ֖ם לֵ/אמֹ֑ר הִנֵּ֣ה דָוִ֔ד מְבַקֵּ֖שׁ רָעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/010.yaml
  text: And David said to Saul[a], “Why do you listen to the words of a man who says, ‘Look[b], David is seeking your harm’?”
translation:
  language: ru
  text: 'И сказал Давид Саулу: «Зачем ты слушаешь слова человека[a], который говорит: „Вот, Давид ищет тебе зла[b]“?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человеческие речи»; древнееврейское слово стоит в единственном числе, но иногда может иметь обобщённое значение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стремится причинить тебе вред».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד לְשָׁאוּל
  choice: И сказал Давид Саулу
  rationale: Сохраняет последовательное развитие древнееврейского повествования и ясно передаёт адресата речи.
- source_word: לָמָּה תִשְׁמַע
  choice: Зачем ты слушаешь
  rationale: Глагол שׁמע здесь означает не просто слышать, а прислушиваться, принимать сказанное во внимание. «Зачем» естественно передаёт упрёк в данном контексте.
- source_word: אֶת דִּבְרֵי אָדָם
  choice: слова человека
  rationale: Существительное אָדָם стоит в единственном числе; перевод сохраняет эту форму и вероятное указание на некоего клеветника, не исключая более общего понимания.
- source_word: לֵאמֹר
  choice: который говорит
  rationale: Инфинитив вводит содержание чужих слов; относительное предложение звучит естественно по-русски и согласуется с «человека».
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт функцию указательной частицы, привлекающей внимание, без архаического оттенка.
- source_word: מְבַקֵּשׁ רָעָתֶךָ
  choice: ищет тебе зла
  rationale: Русское устойчивое выражение точно передаёт продолжающееся или характерное стремление причинить зло и сохраняет лексему «зло», соответствующую רָעָה.
theological_decisions:
- issue: Значение אָדָם в единственном числе
  choice: человека
  alternative: людей; человеческие речи
  rationale: Контекст допускает обобщённый человеческий смысл, но единственное число и образ конкретного обвинителя лучше всего сохраняются в основном тексте без догматического уточнения.
- issue: Значение רָעָה
  choice: зла
  alternative: вреда; стремится причинить тебе зло
  rationale: «Зло» сохраняет нравственную и событийную широту древнееврейского слова, тогда как «вред» несколько сужает его до причинённого ущерба.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конструкция «ищет тебе зла» естественна, понятна и близка к образности оригинала; архаизмы не используются.
