lexical_decisions:
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Глагол עלה обозначает движение вверх; «поднялся» естественно передаёт направленность движения в данном повествовании.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Точное и естественное соответствие указательному наречию места.
- source_word: וַיֵּשֶׁב
  choice: остановился
  rationale: В контексте перемещения ישב означает временно обосноваться или пребывать; «остановился» не предполагает постоянного поселения.
- source_word: בִּמְצָדוֹת
  choice: в укреплённых местах
  rationale: מְצָדוֹת обозначает защищённые, удобные для обороны места и не обязательно специально построенные крепости; перевод сохраняет эту широту значения.
- source_word: עֵין גֶּדִי
  choice: Эн-Геди
  rationale: Географическое название передано принятой русской библейской транслитерацией.
