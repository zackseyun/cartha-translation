  text: יִשְׁפֹּ֤ט יְהוָה֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ וּ/נְקָמַ֥/נִי יְהוָ֖ה מִמֶּ֑/ךָּ וְ/יָדִ֖/י לֹ֥א תִֽהְיֶה בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/013.yaml
  text: May Yahweh judge between me and you[a], and may Yahweh avenge me on you[c][b]; but my hand will not be against you.
translation:
  language: ru
  text: Пусть Яхве рассудит между мной и тобой, и пусть Яхве отомстит тебе за меня[a], но моя рука не будет против тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершит над тобой возмездие за меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «моя рука не будет против тебя» — еврейский оборот, означающий отказ от враждебных или насильственных действий.'
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: Пусть … рассудит
  rationale: 'Форма yiqtol здесь имеет побудительно-желательное значение: Давид призывает Яхве выступить судьёй, а не просто предсказывает будущее.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: между мной и тобой
  rationale: Сохранена явная судебная формула и личное противопоставление двух сторон.
- source_word: וּנְקָמַנִי … מִמֶּךָּ
  choice: и пусть … отомстит тебе за меня
  rationale: Глагол נקם обозначает месть или возмездие; русский оборот передаёт просьбу Давида к Богу совершить возмездие над Саулом за него.
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: но моя рука не будет против тебя
  rationale: Сохранён образ «руки» как обозначение личного враждебного действия; союз «но» естественно выражает противопоставление Божьего возмездия отказу Давида действовать самому.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте дважды употреблено собственное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Характер просьбы Давида о נקם
  choice: Просьба к Яхве отомстить за Давида
  alternative: Просьба лишь оправдать или защитить Давида на суде
  rationale: 'Значение נקם не смягчено до отвлечённого оправдания. При этом сохранено напряжение: Давид просит Бога о возмездии, но отказывается сам причинять Саулу вред.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным строем. Судебная формула и образ руки сохранены, а необычный оборот пояснён в сноске.
