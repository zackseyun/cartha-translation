  yaml_path: translation/ot/1_samuel/024/002.yaml
  text: When Saul returned from pursuing the Philistines, they told him, saying, “Look, David is in the wilderness of En-gedi.”
translation:
  language: ru
  text: 'Когда Саул возвратился после погони за филистимлянами, ему сообщили: «Вот, Давид находится в пустыне Эн-Геди».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאַחֲרֵי פְּלִשְׁתִּים
  choice: после преследования филистимлян
  rationale: Предлог מֵאַחֲרֵי в данном контексте обозначает возвращение от погони за противником; выбранная формулировка естественна по-русски и точно передаёт ситуацию.
- source_word: וַיַּגִּידוּ לוֹ לֵאמֹר
  choice: ему сообщили
  rationale: Еврейская формула с לֵאמֹר вводит содержание сообщения; в современном русском её естественно передать одним глаголом и двоеточием, не воспроизводя избыточное «сказав».
- source_word: הִנֵּה
  choice: не выражено отдельным словом
  rationale: Здесь частица привлекает внимание к сообщаемому факту. В русском прямом сообщении её функция достаточно передана самой конструкцией; «вот» могло бы звучать как указание на непосредственно видимого Давида.
- source_word: מִדְבַּר עֵין גֶּדִי
  choice: пустыне Эн-Геди
  rationale: מִדְבָּר обозначает безлюдную засушливую местность, а не обязательно песчаную пустыню; традиционное русское «пустыня» сохраняет географический термин. Название передано в принятой форме «Эн-Геди».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование изложено ясно и сдержанно. Библейская формула «сказав» устранена как неестественная для современного русского, без потери содержания.
