base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/011.yaml
  text: Look[a], this day your own eyes have seen that Yahweh gave you today into my hand in the cave, and I said to kill you, but I spared you. I said, ‘I will not stretch out my hand against my lord[b], for he is Yahweh’s anointed.’
translation:
  language: ru
  text: 'Вот, сегодня ты своими глазами видел, что Яхве сегодня отдал тебя в мои руки в пещере, и было сказано убить тебя[a], но я пощадил тебя[b]. Я сказал: «Не подниму руки на моего господина, потому что он — помазанник Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально: «и он сказал убить тебя»; субъект глагола единственного числа не назван. Возможны также переводы: «и кто-то сказал убить тебя» или «и он сказал, чтобы убить тебя».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «но я сжалился над тобой». Еврейский глагол имеет женский род; возможно, подразумевается «мой глаз пощадил тебя». В контексте смысл относится к отказу Давида убить Саула.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Современное русское «вот» естественно привлекает внимание и сохраняет указательно-эмфатическую силу еврейского слова.
- source_word: רָאוּ עֵינֶיךָ
  choice: ты своими глазами видел
  rationale: Передаёт еврейский образ глаз как непосредственных свидетелей и его смысловое усиление.
- source_word: נְתָנְךָ יְהוָה ... בְּיָדִי
  choice: Яхве отдал тебя в мои руки
  rationale: Оборот означает передачу человека во власть другого; русское множественное «в руки» идиоматично и ясно выражает этот смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное заветное имя Бога, а не заменяет его титулом.
- source_word: בַּמְּעָרָה
  choice: там, в пещере
  rationale: Указательное «там» делает русскую фразу естественной и не меняет места действия.
- source_word: וְאָמַר לַהֲרָגֲךָ
  choice: и было сказано убить тебя
  rationale: Безлично-пассивная формулировка сохраняет неопределённость субъекта еврейского глагола и не приписывает эти слова самому Давиду без достаточных оснований.
- source_word: וַתָּחָס עָלֶיךָ
  choice: но я пощадил тебя
  rationale: По контексту Давид говорит о своём отказе убить Саула; «пощадил» естественно передаёт как сохранение жизни, так и возможный оттенок жалости.
- source_word: לֹא אֶשְׁלַח יָדִי
  choice: не подниму руки
  rationale: Русский идиоматический оборот ясно передаёт враждебное действие, обозначенное еврейским «не простру руки».
- source_word: בַּאדֹנִי
  choice: на моего господина
  rationale: Здесь это почтительное обозначение Саула как царя и земного властителя Давида, а не божественный титул.
- source_word: מְשִׁיחַ יְהוָה
  choice: помазанник Яхве
  rationale: В повествовательном контексте речь о царе, посвящённом на служение через помазание; перевод сохраняет и царский, и богословский смысл выражения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не смешивает с титулом.
- issue: Значение מְשִׁיחַ יְהוָה в рассказе о Сауле
  choice: помазанник Яхве
  alternative: Мессия Яхве
  rationale: Здесь выражение непосредственно обозначает помазанного царя Саула. «Помазанник» сохраняет богословскую значимость термина, не превращая его без основания в эсхатологический титул.
- issue: Неопределённый субъект וְאָמַר
  choice: безличное «было сказано» с пояснением в сноске
  alternative: «он сказал»; «кто-то сказал»; «я сказал»
  rationale: Еврейский глагол стоит в единственном числе, но явный субъект отсутствует. Основной текст не отождествляет говорящего с Давидом и не устраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранены повтор «сегодня», образ непосредственного свидетельства глазами, имя Яхве и царский титул «помазанник». Архаичное буквальное «не простру руки» заменено понятным русским оборотом «не подниму руки».
