  terminology: «Яхве» последовательно передаёт יהוה как личное имя. «Воздаст тебе добром» удачно передаёт יְשַׁלֶּמְךָ טוֹבָה и сохраняет благословительную модальность; альтернативное предсказательное прочтение надлежащим образом отмечено. Формулировка «добрым путём» в сноске оправданно обозначена как буквальная, а не предложена в качестве основного русского текста.
