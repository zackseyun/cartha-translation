  text: וְ/כִֽי יִמְצָ֥א אִישׁ֙ אֶת אֹ֣יְב֔/וֹ וְ/שִׁלְּח֖/וֹ בְּ/דֶ֣רֶךְ טוֹבָ֑ה וַֽ/יהוָה֙ יְשַׁלֶּמְ/ךָ֣ טוֹבָ֔ה תַּ֚חַת הַ/יּ֣וֹם הַ/זֶּ֔ה אֲשֶׁ֥ר עָשִׂ֖יתָה לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/020.yaml
  text: For when a man finds his enemy and lets him go on his way safely[b][a], may Yahweh repay you with good for what you have done to me this day.
translation:
  language: ru
  text: Ведь если человек встретит своего врага, разве отпустит его невредимым?[a] Пусть же Яхве воздаст тебе добром за то, что ты сделал для меня сегодня.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и отпустит его добрым путём»; возможно также: «и отпустит его с миром» или «и даст ему уйти в безопасности». Первую часть можно понять и как утверждение: «Ведь когда человек встретит своего врага и отпустит его невредимым…»'
    reason: Сохраняет буквальный образ и синтаксическую неоднозначность еврейской фразы.
  - marker: b
    text: 'Или: «Яхве воздаст тебе добром». Еврейскую форму можно понять и как пожелание, и как предсказание.'
    reason: Отмечает неоднозначную модальность yiqtol.
lexical_decisions:
- source_word: וְכִי יִמְצָא אִישׁ אֶת־אֹיְבוֹ
  choice: Ведь если человек встретит своего врага
  rationale: וְכִי вводит риторический общий случай, объясняющий предшествующее признание Саула. Условная формулировка по-русски естественно передаёт этот смысл; אִישׁ сохраняется как обобщённое «человек».
- source_word: וְשִׁלְּחוֹ בְּדֶרֶךְ טוֹבָה
  choice: разве отпустит его невредимым?
  rationale: В контексте сочетание описывает безопасное освобождение врага, оказавшегося во власти человека. Риторический вопрос естественно выражает подразумеваемое удивление; «невредимым» передаёт идиоматический смысл буквального «добрым путём».
- source_word: וַיהוָה
  choice: Пусть же Яхве
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а וַ связывает благословение с риторическим признанием Саула.
- source_word: יְשַׁלֶּמְךָ טוֹבָה
  choice: воздаст тебе добром
  rationale: Глагол שלם в данной конструкции означает соответствующее воздаяние, а существительное טוֹבָה указывает на благой ответ. Русское «воздать добром» сохраняет и смысл, и лаконичность.
- source_word: תַּחַת הַיּוֹם הַזֶּה אֲשֶׁר עָשִׂיתָה לִי
  choice: за то, что ты сделал для меня сегодня
  rationale: תַּחַת выражает основание или соответствие воздаяния. «Для меня» естественно показывает, что Саул признаёт себя получателем благодеяния Давида.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому оно сохранено как имя, а не заменено титулом.
- issue: Модальность יְשַׁלֶּמְךָ
  choice: Пусть же Яхве воздаст тебе
  alternative: Яхве воздаст тебе
  rationale: Форма yiqtol допускает как пожелание-благословение, так и предсказание. В речи Саула пожелание контекстуально естественно, но альтернативная модальность отмечена в сноске.
- issue: Риторическая сила первой части
  choice: разве отпустит его невредимым?
  alternative: и отпустит его невредимым
  rationale: 'Контекст и традиционное понимание фразы указывают на риторический вопрос: обычный человек не щадит врага, тогда как Давид пощадил Саула. Пунктуация не выражена непосредственно в согласном еврейском тексте, поэтому формальная повествовательная передача остаётся возможной.'
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. «Встретит» здесь означает «найдёт, обнаружит» врага и естественно звучит в русском общем изречении. Порядок сносок приведён в последовательность [a], [b], причём каждый маркер присутствует в основном тексте.
