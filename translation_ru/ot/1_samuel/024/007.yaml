base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/007.yaml
  text: And he said to his men[a], “Far be it from me, because of Yahweh, that I should do this thing to my lord, Yahweh’s anointed, to stretch out my hand against him, for he is Yahweh’s anointed.”
translation:
  language: ru
  text: 'И сказал он своим людям: «Да не допустит Яхве[a], чтобы я поступил так с моим господином, помазанником Яхве, — поднял на него руку, ведь он помазанник Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более буквальной передаче: «Упаси меня Яхве сделать это». Еврейская идиома выражает решительное отвращение к такому поступку в связи с Яхве; традиционно её также передают: «Да не допустит Яхве, чтобы я сделал это».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: Да не допущу я перед Яхве
  rationale: Идиома выражает решительное отвращение и отказ от поступка в отношении Яхве. Русское «да не допущу я» естественно передаёт категорическое отвержение, а «перед Яхве» сохраняет связь отказа с благоговением перед Богом, не превращая оборот в прямое повеление со стороны Яхве.
- source_word: אִם אֶעֱשֶׂה
  choice: сделать
  rationale: После חָלִילָה частица אִם входит в идиоматическую формулу решительного отрицания; инфинитив в русском естественно зависит от «не допущу».
- source_word: הַדָּבָר הַזֶּה
  choice: такое
  rationale: В контексте דָּבָר обозначает задуманный поступок. «Сделать такое» — современный и естественный русский оборот без излишнего уточнения характера действия.
- source_word: לַאדֹנִי
  choice: с моим господином
  rationale: Форма выражает почтительное отношение Давида к Саулу. Предлог «с» естественно сочетается с русским выражением «сделать такое», тогда как враждебная направленность ясно выражена далее.
- source_word: לִמְשִׁיחַ יְהוָה
  choice: помазанником Яхве
  rationale: «Помазанник» передаёт царя, посвящённого Яхве, и не вносит сюда более позднее узкое мессианское значение.
- source_word: לִשְׁלֹחַ יָדִי בּוֹ
  choice: поднять на него руку
  rationale: Это устойчивый русский библейский и общеупотребительный оборот, сохраняющий образ руки и ясно обозначающий насильственное действие.
- source_word: כִּי מְשִׁיחַ יְהוָה הוּא
  choice: ведь он помазанник Яхве
  rationale: «Ведь» естественно вводит основание отказа; повтор титула сохраняет еврейское смысловое ударение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Значение מְשִׁיחַ применительно к Саулу
  choice: помазанник Яхве
  alternative: Мессия Яхве
  rationale: Здесь слово обозначает Саула как царя, посвящённого Яхве. «Мессия» могло бы вызвать не требуемые контекстом позднейшие христологические ассоциации.
- issue: Связь отказа Давида с Яхве в выражении חָלִילָה לִּי מֵיְהוָה
  choice: перед Яхве
  alternative: Яхве да не допустит / из-за Яхве
  rationale: Выбранная формулировка сохраняет религиозную обусловленность отказа и намеренно не решает слишком жёстко, выражает ли מִן источник запрета, основание отказа или действие, немыслимое в отношении Яхве.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Поднять руку» сохраняет исходный образ и звучит естественно; повтор «помазанник Яхве» оставлен ради еврейского акцента. Сноска уточняет неоднозначную идиому.
