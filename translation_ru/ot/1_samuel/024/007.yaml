revisions:
- from: 'И сказал он своим людям: «Да не допущу я перед Яхве сделать такое с моим господином, помазанником Яхве, — поднять на него руку, ведь он помазанник Яхве».[a]'
  to: 'И сказал он своим людям: «Да не допустит Яхве[a], чтобы я поступил так с моим господином, помазанником Яхве, — поднял на него руку, ведь он помазанник Яхве».'
  rationale: Заменена неестественная и неточная формула «Да не допущу я перед Яхве» на нормативное «Да не допустит Яхве, чтобы я…». Это передаёт силу еврейской идиомы, не навязывая догматического истолкования спорного оттенка предлога מִן. «Поступить так с моим господином» естественно воспроизводит широкий характер הַדָּבָר הַזֶּה и направленность действия; последующее «поднять на него руку» сохраняет конкретный образ оригинала. Сноска перенесена к идиоме и переформулирована яснее.
