  text: So David swore to Saul. Then Saul went to his house[a], but David and his men went up to the stronghold.
translation:
  language: ru
  text: И Давид поклялся Саулу. Затем Саул пошёл к себе домой, а Давид и его люди поднялись в крепость.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: поклялся
  rationale: Нифаль глагола שׁבע означает «поклясться, дать клятву»; «поклялся» прямо и естественно передаёт действие в повествовании.
- source_word: לְשָׁאוּל
  choice: Саулу
  rationale: Предлог ל обозначает адресата клятвы; русский дательный падеж естественно передаёт это отношение.
- source_word: וַיֵּלֶךְ שָׁאוּל אֶל בֵּיתוֹ
  choice: Затем Саул пошёл к себе домой
  rationale: בֵּיתוֹ буквально означает «его дом», но в сочетании с глаголом движения современное русское «к себе домой» естественно выражает возвращение Саула к месту его жительства.
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: а Давид и его люди
  rationale: Еврейский союз ו формально значит «и», однако здесь сопоставляет разные направления Саула и Давида. Русское «а» естественно выражает это сопоставление, не усиливая его до резкого противопоставления «но».
- source_word: עָלוּ
  choice: поднялись
  rationale: עלה передаёт движение вверх; «поднялись» сохраняет направленность и естественно звучит по-русски.
- source_word: הַמְּצוּדָה
  choice: укреплённое убежище
  rationale: מְצוּדָה обозначает защищённое, укреплённое место или опорный пункт. «Укреплённое убежище» ясно передаёт как защитную функцию, так и характер места, куда укрылись Давид и его люди.
