base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/019.yaml
  text: 'And you have declared today what good you have done to me: when Yahweh gave me into your hand[b][a], you did not kill me.'
translation:
  language: ru
  text: 'И сегодня ты показал, какое добро сделал мне: когда Яхве отдал меня в твою руку[a], ты не убил меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предал меня в твою власть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגַּדְתָּ
  choice: показал
  rationale: В породе хифиль глагол обычно означает «сообщить, объявить, дать знать», но здесь поступок Давида сделал его доброе отношение явным; «показал» естественно передаёт этот контекстуальный смысл.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Прямой современный эквивалент временного наречия.
- source_word: עָשִׂיתָה אִתִּי טוֹבָה
  choice: как хорошо поступил со мной
  rationale: Естественно передаёт буквальное «какое добро ты сделал со мной», сохраняя акцент на благом поступке Давида.
- source_word: סִגְּרַנִי
  choice: отдал меня
  rationale: В данном контексте סגר означает передачу человека во власть другого; «отдал меня в твою руку» сохраняет смысл и образ еврейского выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией, а не замена его титулом.
- source_word: בְּיָדְךָ
  choice: в твою руку
  rationale: Сохранён понятный библейский образ, обозначающий попадание во власть другого человека.
- source_word: וְלֹא הֲרַגְתָּנִי
  choice: ты не убил меня
  rationale: Прямой, ясный и современный эквивалент еврейского глагола.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; форма «Яхве» сохраняет его как имя, не подменяя титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно сохранённой библейской образностью. Формулировка ясная и достойная, без архаизмов; метафора «в твою руку» сохранена, а её смысл пояснён в сноске.
