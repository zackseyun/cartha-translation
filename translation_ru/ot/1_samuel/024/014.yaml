- source_word: מֵרְשָׁעִים יֵצֵא רֶשַׁע
  choice: От нечестивых исходит нечестие
  rationale: Предлог מִן обозначает источник, а однокоренные русские слова сохраняют выразительную лексическую связь между רְשָׁעִים и רֶשַׁע.
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: Но моя рука не поднимется на тебя
  rationale: Сохранён образ руки как личного насильственного действия; русская идиома «рука не поднимется на» ясно и естественно передаёт враждебную направленность, выраженную בָּךְ.
