- source_word: כַּאֲשֶׁר יֹאמַר
  choice: Как говорит
  rationale: Формула вводит традиционное изречение; настоящее время естественно передаёт обобщённое значение древнееврейского имперфекта.
- source_word: מְשַׁל
  choice: пословица
  rationale: Здесь имеется в виду краткое традиционное нравственное изречение, а не развёрнутая притча.
- source_word: הַקַּדְמֹנִי
