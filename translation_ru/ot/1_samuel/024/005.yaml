  text: וַ/יֹּאמְרוּ֩ אַנְשֵׁ֨י דָוִ֜ד אֵלָ֗י/ו הִנֵּ֨ה הַ/יּ֜וֹם אֲֽשֶׁר אָמַ֧ר יְהוָ֣ה אֵלֶ֗י/ךָ הִנֵּ֨ה אָנֹכִ֜י נֹתֵ֤ן אֶת איבי/ך בְּ/יָדֶ֔/ךָ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֖ר יִטַ֣ב בְּ/עֵינֶ֑י/ךָ וַ/יָּ֣קָם דָּוִ֗ד וַ/יִּכְרֹ֛ת אֶת כְּנַֽף הַ/מְּעִ֥יל אֲשֶׁר לְ/שָׁא֖וּל בַּ/לָּֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/005.yaml
  text: Then David’s men said to him[a], “Look, this is the day of which Yahweh said to you, ‘Look, I am giving your enemy into your hand, and you may do to him as seems good in your eyes.’” Then David arose and secretly cut off the corner of Saul’s robe.
translation:
  language: ru
  text: 'Люди Давида сказали ему: «Вот день, о котором Яхве сказал тебе: „Вот, Я предаю твоего врага в твои руки, и ты можешь поступить с ним, как сочтёшь правильным[a]“». Тогда Давид встал и тайком отрезал край плаща Саула.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как будет хорошо в твоих глазах».'
    reason: Сохраняет древнееврейский образ, лежащий в основе идиоматического перевода «как сочтёшь правильным».
lexical_decisions:
- source_word: וַיֹּאמְרוּ אַנְשֵׁי דָוִד אֵלָיו
  choice: Люди Давида сказали ему
  rationale: Конструкция обозначает последователей Давида; «люди Давида» естественно звучит в современном русском повествовании. Последовательность событий передана порядком фраз без обязательного добавления союза.
- source_word: הִנֵּה הַיּוֹם
  choice: Вот день
  rationale: «Вот» сохраняет указательное и эмфатическое значение הִנֵּה, не прибегая к архаичному «се».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» общепринята в современной русской библеистике.
- source_word: הִנֵּה אָנֹכִי נֹתֵן
  choice: Вот, Я предаю
  rationale: Причастие передаёт живое, непосредственно совершающееся или близкое действие; «предаю» естественно сочетается с идиомой «в руки».
- source_word: אֶת איביך
  choice: твоего врага
  rationale: Контекст и последующие местоимения указывают на одного человека — Саула, поэтому выбрано единственное число.
- source_word: בְּיָדֶךָ
  choice: в твои руки
  rationale: Сохранён понятный по-русски древнееврейский образ передачи человека во власть другого.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: и ты можешь поступить с ним
  rationale: В контексте слова выражают предоставленную возможность, а не повеление убить Саула; модальность передана без усиления утверждения.
- source_word: כַּאֲשֶׁר יִטַב בְּעֵינֶיךָ
  choice: как сочтёшь нужным
  rationale: Это естественная русская передача идиомы «как будет хорошо в твоих глазах»; буквальный образ отмечен в сноске.
- source_word: וַיָּקָם דָּוִד
  choice: Тогда Давид встал
  rationale: «Тогда» ясно передаёт продвижение повествования, а «встал» — обычное значение глагола движения.
- source_word: וַיִּכְרֹת אֶת כְּנַף הַמְּעִיל
  choice: отрезал край плаща
  rationale: כָּנָף здесь обозначает край или полу одежды; «край плаща» ясно и не требует догадки о точной форме одежды.
- source_word: בַּלָּט
  choice: тайком
  rationale: Наречие передаёт скрытый, незаметный характер действия кратко и естественно.
theological_decisions:
- issue: Следует ли считать слова о предании врага подлинным прежним откровением Яхве или истолкованием людей Давида
  choice: Слова сохранены как прямое утверждение людей Давида без дополнительного авторского подтверждения.
  alternative: Дистанцировать их пересказом вроде «вот день, который, как вы считаете, обещал Яхве» либо, напротив, представить как несомненную известную читателю пророческую речь.
  rationale: Древнееврейский текст сообщает только то, что сказали люди Давида. Перевод не должен ни опровергать их понимание, ни придавать ему больший авторитет, чем даёт повествование.
- issue: Являются ли слова וְעָשִׂיתָ לּוֹ повелением расправиться с Саулом
  choice: 'Передана возможность: «ты можешь поступить с ним».'
  alternative: «Поступи с ним» или «ты поступишь с ним».
  rationale: Контекст представляет эти слова как основание для свободы действия, а не как явное повеление убить; выбранная формулировка сохраняет напряжение между возможностью и последующим решением Давида.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Архаизмы («се», «восстал») исключены; синтаксис прямой речи и повтор «Вот» сохраняют выразительность оригинала.
