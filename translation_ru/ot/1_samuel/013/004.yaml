  yaml_path: translation/ot/1_samuel/013/004.yaml
  text: And all Israel heard it said[a], “Saul has struck down the Philistine garrison[c][b], and Israel has also become odious to the Philistines.” Then the people were called out to join Saul at Gilgal.
translation:
  language: ru
  text: 'И весь Израиль услышал весть: «Саул поразил филистимский гарнизон[a], и Израиль стал отвратителен филистимлянам[b]». Тогда народ созвали к Саулу в Галгал[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «филистимского наместника» либо «филистимский сторожевой пост». Еврейское слово может обозначать как должностное лицо, так и военный пост или гарнизон; военный контекст благоприятствует переводу «гарнизон».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Израиль стал зловонием для филистимлян» — идиома, означающая, что Израиль стал им отвратителен, мерзок.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «народ созвали вслед за Саулом, в Галгал». Еврейский оборот, вероятно, описывает сбор народа к Саулу или под его началом для войны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ לֵאמֹר
  choice: услышал весть
  rationale: Оборот вводит передаваемое известие. «Услышал весть» естественно по-русски выражает формулу сообщения, не добавляя того, чего нет в контексте.
- source_word: הִכָּה
  choice: поразил
  rationale: Глагол נכה означает «ударить, поразить»; в военном контексте «поразил» сохраняет силу исходного глагола, не уточняя без необходимости степень уничтожения.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: филистимский гарнизон
  rationale: נְצִיב может обозначать как поставленного начальника, так и размещённый военный пост или гарнизон. Военный контекст благоприятствует значению «гарнизон», однако неоднозначность отмечена в сноске.
- source_word: נִבְאַשׁ
  choice: стал ненавистен
  rationale: Форма Niphal буквально связана с отвратительным запахом и идиоматически означает стать отвратительным или ненавистным для кого-либо. Выбран естественный русский эквивалент, а буквальный образ сохранён в сноске.
- source_word: בַּפְּלִשְׁתִּים
  choice: филистимлянам
  rationale: Предлог при נִבְאַשׁ указывает на тех, для кого Израиль стал отвратителен; дательный падеж передаёт это отношение кратко и естественно.
- source_word: וַיִּצָּעֲקוּ
  choice: созвали
  rationale: Хотя корень обычно значит «кричать, взывать», здесь в военном контексте он выражает созыв или сбор народа. «Созвали» передаёт мобилизационный смысл без излишнего толкования.
- source_word: אַחֲרֵי שָׁאוּל
  choice: вслед за Саулом
  rationale: Буквальное пространственно-лидерское выражение сохранено, поскольку оно может означать сбор под началом Саула или следование за ним.
- source_word: הַגִּלְגָּל
  choice: в Галгал
  rationale: 'При глаголе созыва конечная ה может указывать направление: народ созвали в Галгал. Название передано в принятой русской библейской форме.'
