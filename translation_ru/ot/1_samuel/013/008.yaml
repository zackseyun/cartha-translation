  source_fidelity: 'Русский текст точно передаёт последовательность еврейского повествования: ожидание в течение семи дней, наступление назначенного срока, неприбытие Самуила в Галгал и начавшееся рассеяние народа. Передача эллиптического אֲשֶׁר שְׁמוּאֵל как «о котором говорил Самуил» не приписывает еврейскому тексту отсутствующий глагол и сохраняет его смысловую неопределённость; сноска уместно отмечает альтернативное восполнение.'
