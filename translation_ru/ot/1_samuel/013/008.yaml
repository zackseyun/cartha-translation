  text: ו/ייחל שִׁבְעַ֣ת יָמִ֗ים לַ/מּוֹעֵד֙ אֲשֶׁ֣ר שְׁמוּאֵ֔ל וְ/לֹא בָ֥א שְׁמוּאֵ֖ל הַ/גִּלְגָּ֑ל וַ/יָּ֥פֶץ הָ/עָ֖ם מֵ/עָלָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/008.yaml
  text: He waited seven days[a], until the appointed time that Samuel had set, but Samuel did not come to Gilgal[b], and the people were scattering from him.
translation:
  language: ru
  text: Он ждал семь дней — до назначенного срока, о котором говорил Самуил[a]. Но Самуил не пришёл в Галгал, и народ стал разбегаться от Саула[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение здесь сжато; возможно также: «до назначенного Самуилом срока».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от него»; речь идёт о Сауле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיחֶל
  choice: Он ждал
  rationale: В данном повествовательном контексте глагол означает ожидание в течение определённого времени, а не надежду.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: Прямое обозначение продолжительности ожидания.
- source_word: לַמּוֹעֵד
  choice: до назначенного срока
  rationale: מוֹעֵד обозначает заранее установленное время; предлог ל־ в данном контексте естественно передаётся русским «до».
- source_word: אֲשֶׁר שְׁמוּאֵל
  choice: о котором говорил Самуил
  rationale: Еврейское относительное предложение эллиптично. Такая передача восстанавливает подразумеваемую связь, не утверждая сверх текста, что Самуил лично назначил срок.
- source_word: וְלֹא בָא שְׁמוּאֵל הַגִּלְגָּל
  choice: Но Самуил не пришёл в Галгал
  rationale: «Но» естественно выражает контекстуальное противопоставление, а направительный ה־ при топониме передан как движение в Галгал.
- source_word: וַיָּפֶץ הָעָם
  choice: и народ стал разбегаться
  rationale: Форма описывает начавшееся рассеяние людей; «стал разбегаться» естественно передаёт разворачивающийся процесс.
- source_word: מֵעָלָיו
  choice: от Саула
  rationale: Местоименный суффикс относится к Саулу; явное имя по-русски устраняет возможную двусмысленность после упоминания Самуила.
