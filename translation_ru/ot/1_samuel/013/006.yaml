base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/006.yaml
  text: When the men of Israel saw that they were in trouble[a], because the people were hard pressed, the people hid themselves in caves, in thickets, among rocks, in strongholds[c][b], and in pits.
translation:
  language: ru
  text: Когда израильтяне увидели, что оказались в беде, потому что народ был тесним, они стали прятаться в пещерах, в зарослях[a], среди скал, в убежищах[b] и в ямах[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди колючих кустов». Редкое еврейское слово, вероятно, обозначает колючие заросли.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово имеет неясное значение; возможно: «в подземных помещениях», «в хранилищах», «в норах» или «в укреплениях».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в цистернах» — вырубленных в земле или скале водосборных ямах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: израильтяне
  rationale: Существительное אִישׁ стоит в единственном числе, но в сочетании с «Израиль» и глаголом во множественном числе имеет собирательно-распределительное значение. «Израильтяне» естественно передаёт его по-русски.
- source_word: רָאוּ
  choice: увидели
  rationale: Сохранено основное значение глагола «видеть»; в данном контексте оно также подразумевает осознание положения.
- source_word: כִּי צַר לוֹ
  choice: что оказались в беде
  rationale: Сжатая еврейская конструкция с местоимением единственного числа согласуется по смыслу с собирательным субъектом. Русское множественное число и выражение «оказались в беде» естественно передают состояние опасности и стеснения.
- source_word: כִּי נִגַּשׂ הָעָם
  choice: потому что народ был тесним
  rationale: Нифаль глагола נגשׂ означает, что народ теснили, гнали или притесняли. Пассивная формулировка сохраняет форму и не уточняет не названного здесь деятеля.
- source_word: וַיִּתְחַבְּאוּ הָעָם
  choice: они стали прятаться
  rationale: Возвратный смысл формы передан русским глаголом «прятаться»; местоимение избегает тяжёлого повтора слова «народ», сохраняя тот же коллективный референт.
- source_word: בַּמְּעָרוֹת
  choice: в пещерах
  rationale: Обычное и точное соответствие מְעָרָה.
- source_word: וּבַחֲוָחִים
  choice: в зарослях
  rationale: Редкое слово, вероятно обозначающее колючий кустарник или чащу. Более широкое «заросли» естественно в основном тексте, а конкретизация вынесена в сноску.
- source_word: וּבַסְּלָעִים
  choice: среди скал
  rationale: סֶלַע обозначает скалу, утёс или каменную глыбу; «среди скал» естественно описывает место укрытия и не переуточняет рельеф.
- source_word: וּבַצְּרִחִים
  choice: в подземных укрытиях
  rationale: Редкое и не вполне ясное слово, которое связывают с подземными помещениями, хранилищами или иными скрытыми местами. Выбор сохраняет вероятный смысл и сопровождается сноской.
- source_word: וּבַבֹּרוֹת
  choice: в ямах
  rationale: בּוֹר может обозначать яму, колодец или водосборную цистерну. «Ямы» — наиболее широкое контекстуальное соответствие; вариант «цистерны» отмечен в сноске.
