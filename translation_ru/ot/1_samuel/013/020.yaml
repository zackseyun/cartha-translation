lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: спустились
  rationale: Передаёт направленность движения, выраженную глаголом ירד, и сохраняет повествовательную форму исходного текста.
- source_word: כָל יִשְׂרָאֵל
  choice: все израильтяне
  rationale: Естественно передаёт собирательное обозначение всего народа в современном русском языке.
- source_word: הַפְּלִשְׁתִּים
  choice: к филистимлянам
  rationale: В исходном тексте названа группа людей, а не их земля и не кузнецы; перевод не добавляет подразумеваемых участников.
- source_word: לִלְטוֹשׁ
  choice: наточить
  rationale: В контексте металлических сельскохозяйственных орудий глагол обозначает затачивание; совершенный вид естественен после конструкции цели.
- source_word: אִישׁ
  choice: каждый
  rationale: Передаёт распределительное значение единственного числа после собирательного подлежащего без неестественного повторения слова «мужчина».
- source_word: מַחֲרַשְׁתּוֹ
  choice: свой лемех
  rationale: Термин обозначает пахотное орудие или его режущую металлическую часть; «лемех» точно соответствует контексту затачивания.
- source_word: אֵתוֹ
  choice: мотыгу
  rationale: Существительное את обозначает землекопное или мотыжное орудие; «мотыга» понятно современному читателю и уместно в перечне сельскохозяйственных инструментов.
- source_word: קַרְדֻּמּוֹ
  choice: топор
  rationale: Обычное значение — рубящее орудие, подобное топору; контекст не требует более узкого «тесло».
- source_word: מַחֲרֵשָׁתוֹ
  choice: серп
  rationale: Значение последнего названия орудия неясно. «Серп» даёт осмысленный перечень различных затачиваемых инструментов и не дублирует первый пахотный термин; неопределённость отмечена в сноске.
