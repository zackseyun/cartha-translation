base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/003.yaml
  text: Jonathan struck down the Philistine garrison that was at Geba[a], and the Philistines heard of it. Then Saul blew the ram's horn throughout all the land, saying[b], “Let the Hebrews hear!”
translation:
  language: ru
  text: 'Ионафан разбил филистимский гарнизон[a], стоявший в Геве, и филистимляне услышали об этом. Тогда Саул затрубил в рог[b] по всей земле, говоря: «Пусть услышат евреи!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «филистимского правителя (наместника)». Еврейское слово может обозначать как поставленного должностного правителя, так и военный пост или гарнизон.'
    reason: lexical_alternative
  - marker: b
    text: Шофар — сигнальный рог животного, обычно бараний.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  choice: разбил
  rationale: Глагол נכה обозначает нанесение удара, а в военном контексте — поражение противника. «Разбил» естественно относится к гарнизону и не утверждает полного уничтожения всех находившихся там людей.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: филистимский гарнизон
  rationale: נְצִיב может обозначать поставленного должностного правителя либо военный пост/гарнизон. Военный контекст поддерживает «гарнизон», а подлинная лексическая неоднозначность отмечена в сноске.
- source_word: בְּגֶבַע
  choice: в Геве
  rationale: Передаёт название места גֶּבַע как «Гева» и употребляет естественный русский предлог для населённого пункта.
- source_word: וַיִּשְׁמְעוּ פְּלִשְׁתִּים
  choice: и филистимляне услышали об этом
  rationale: В еврейском тексте буквально сказано «услышали» без выраженного дополнения; «об этом» естественно передаёт подразумеваемое известие.
- source_word: תָּקַע בַּשּׁוֹפָר
  choice: велел трубить в рог
  rationale: 'Форма תָּקַע грамматически может означать, что Саул сам трубил, однако общеземельный масштаб допускает каузативно-поручительное понимание: он распорядился трубить. שׁוֹפָר — именно рог, а не металлическая труба; неоднозначность действия Саула сохранена в богословско-интерпретационных решениях.'
- source_word: בְּכָל הָאָרֶץ
  choice: по всей земле
  rationale: Здесь הָאָרֶץ означает территорию страны, а не всю землю как мир; русская формула кратка и естественна.
- source_word: לֵאמֹר
  choice: провозглашая
  rationale: Инфинитив вводит содержание публичного сообщения. «Провозглашая» естественно связывает трубный сигнал с последующей вестью.
- source_word: יִשְׁמְעוּ הָעִבְרִים
  choice: Пусть услышат евреи!
  rationale: Имперфект имеет побудительно-желательное значение. Сохранено исходное обозначение «евреи», а не заменено на «израильтяне».
theological_decisions:
- issue: Кто непосредственно трубил в рог
  choice: Саул велел трубить
  alternative: Саул трубил
  rationale: Еврейский текст буквально приписывает действие Саулу, но подобная конструкция может описывать действие правителя, выполненное по его приказу. Масштаб «по всей земле» делает поручительное понимание естественным, не меняя того, что инициатором был Саул.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и умеренно торжественным библейским звучанием. Этноним «евреи» сохранён по исходному тексту; спорное значение נְצִיב вынесено в сноску.
