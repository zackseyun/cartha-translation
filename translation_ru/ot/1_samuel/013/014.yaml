  text: וְ/עַתָּ֖ה מַמְלַכְתְּ/ךָ֣ לֹא תָק֑וּם בִּקֵּשׁ֩ יְהוָ֨ה ל֜/וֹ אִ֣ישׁ כִּ/לְבָב֗/וֹ וַ/יְצַוֵּ֨/הוּ יְהוָ֤ה לְ/נָגִיד֙ עַל עַמּ֔/וֹ כִּ֚י לֹ֣א שָׁמַ֔רְתָּ אֵ֥ת אֲשֶֽׁר צִוְּ/ךָ֖ יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/014.yaml
  text: But now your kingdom will not endure[a]. Yahweh has sought for himself a man according to his own heart, and Yahweh has appointed him ruler over his people[c][b], because you have not kept what Yahweh commanded you.
translation:
  language: ru
  text: Но теперь твоё царство не устоит[a]. Яхве подыскал Себе человека по сердцу Своему[b] и поставил его правителем над Своим народом, потому что ты не исполнил того, что повелел тебе Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не продлится».'
    reason: 'Лексическая альтернатива для לֹא תָקוּם: буквально выражение связано со значением «не будет стоять», а в контексте говорит о непрочности и прекращении царства Саула.'
  - marker: b
    text: 'Буквально: «человека согласно Своему сердцу».'
    reason: Примечание сохраняет необычную образность еврейского выражения и не сводит её к одному исчерпывающему толкованию.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Но теперь
  rationale: В контексте выражение вводит резкий переход от обещанной прежде прочности царства к суду над Саулом; «но теперь» естественно передаёт этот контраст.
- source_word: מַמְלַכְתְּךָ לֹא תָקוּם
  choice: твоё царство не устоит
  rationale: תקום буквально связано со значением «стоять», а здесь означает, что царство Саула не сохранит прочности и продолжения. «Не устоит» сохраняет образ оригинала и ясно звучит по-русски.
- source_word: בִּקֵּשׁ יְהוָה לוֹ
  choice: Яхве нашёл Себе
  rationale: В данном повествовательном контексте בקש обозначает совершённое отыскание или избрание; «нашёл Себе» естественно передаёт результат поиска и сохраняет значение לוֹ — «для Себя».
- source_word: אִישׁ כִּלְבָבוֹ
  choice: человека по сердцу Своему
  rationale: Формулировка близко передаёт буквальное «человека согласно Его сердцу», не разворачивая её в дополнительное толкование о качествах или поступках этого человека.
- source_word: וַיְצַוֵּהוּ יְהוָה
  choice: и поставил его Яхве
  rationale: В сочетании с לְנָגִיד глагол имеет смысл назначения на должность, а не просто передачи повеления.
- source_word: לְנָגִיד
  choice: правителем
  rationale: נָגִיד здесь обозначает поставленного руководителя народа. «Правитель» передаёт властное положение без привнесения более поздней титулатуры.
- source_word: עַל עַמּוֹ
  choice: над Своим народом
  rationale: Местоименный суффикс относится к Яхве. Явное «Своим» устраняет возможную для русского читателя двусмысленность, будто речь идёт о народе назначенного человека.
- source_word: לֹא שָׁמַרְתָּ אֵת אֲשֶׁר צִוְּךָ יְהוָה
  choice: ты не исполнил того, что повелел тебе Яхве
  rationale: שמר применительно к повелению означает соблюдать или исполнять его. «Не исполнил» естественно передаёт непослушание, сохраняя отдельное выражение «что повелел» для צוה.
theological_decisions:
- issue: Чьё сердце подразумевается в כִּלְבָבוֹ
  choice: 'Местоимение отнесено к Яхве: «по сердцу Своему».'
  alternative: Понять суффикс как относящийся к найденному человеку либо оставить формулу «по его сердцу» формально двусмысленной.
  rationale: 'Синтаксис и смысл фразы наиболее естественно указывают на сердце Яхве: Он нашёл для Себя человека, соответствующего Его сердцу. Перевод не поясняет сверх текста, в чём именно состоит это соответствие.'
- issue: Значение נָגִיד
  choice: «правитель»
  alternative: «вождь» или «предводитель»
  rationale: Слово означает назначенного Богом руководителя, но само по себе здесь не требует ни специального династического, ни мессианского прочтения.
- issue: Совершённость избрания и назначения преемника
  choice: «нашёл… и поставил»
  alternative: 'Будущее или целевое понимание: «найдёт… и поставит».'
  rationale: Еврейские формы представляют решение Яхве как уже состоявшееся и определённое, даже если его полное историческое осуществление в повествовании последует позже.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранено имя «Яхве» как передача יהוה. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятым благоговейным русским регистром. Синтаксис сделан ясным для обычного читателя, при этом образ «по сердцу» и судебная формула «не устоит» сохранены.
