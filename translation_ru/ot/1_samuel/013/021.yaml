base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/021.yaml
  text: And the charge was a pim for the plowshares[a], for the mattocks, for the three-pronged forks, and for the axes[b], and for setting the goads.
translation:
  language: ru
  text: Плата за заточку[b] составляла один пим[a] — за лемехи, мотыги, трёхзубые вилы и топоры, а также за правку погоняла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Пим — древняя мера веса и, вероятно, соответствующая ей величина платы; обычно её считают равной примерно двум третям шекеля.
    reason: cultural_note
  - marker: b
    text: 'Еврейский текст этого стиха труден. Возможен перевод: «Заточка стоила один пим»; не вполне ясно, обозначает ли редкое слово плату за работу или саму заточку. «Погоняло» — стрекало для управления тягловым животным.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּצִירָה
  choice: плата за заточку
  rationale: Редкое слово в данном контексте, вероятнее всего, обозначает плату, взимавшуюся за заточку или правку орудий; сочетание сохраняет и услугу, и ценовой смысл.
- source_word: פִים
  choice: один пим
  rationale: Название древней меры веса или денежной величины передано транслитерацией, поскольку точный эквивалент не вполне определён; пояснение дано в сноске.
- source_word: מַחֲרֵשֹׁת
  choice: лемехи
  rationale: Речь идёт о железных рабочих частях плуга, которые требовали заточки; «лемехи» — естественное и точное русское название.
- source_word: אֵתִים
  choice: мотыги
  rationale: Слово обозначает земледельческие орудия для копания или рубки; точный вид орудия не вполне ясен, но «мотыги» понятно передаёт вероятный смысл.
- source_word: שְׁלֹשׁ קִלְּשׁוֹן
  choice: трёхзубые вилы
  rationale: Необычное еврейское выражение указывает на орудие с тремя зубьями; перевод сохраняет этот наглядный признак.
- source_word: קַּרְדֻּמִּים
  choice: топоры
  rationale: Обычное значение — рубящие орудия; возможная форма тесла не уточняется без достаточных оснований.
- source_word: לְהַצִּיב הַדָּרְבָן
  choice: за правку погонял для скота
  rationale: Глагол может означать приведение в исправность, установку или насадку; «правка» сохраняет общий смысл обслуживания, не сводя его исключительно к заточке. «Погоняла для скота» ясно передаёт назначение древнего стрекала.
