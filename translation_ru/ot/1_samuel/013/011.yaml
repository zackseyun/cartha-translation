translation_notes:
  register: Современный литературный русский язык с прямой, сдержанной повествовательной интонацией. Сохранена незавершённость перечисления в конце стиха, поскольку речь Саула продолжается в следующем стихе. Ошибочная привязка английской сноски о «собирающихся в Михмасе» к словам «Самуил сказал» не воспроизводится.
