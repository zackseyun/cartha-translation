base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/011.yaml
  text: Then Samuel said[a], “What have you done?” And Saul said, “Because I saw that the people were scattering from me, and you had not come at the appointed time[b], and the Philistines were gathering at Michmash,”
translation:
  language: ru
  text: 'Тогда Самуил сказал: «Что ты сделал?» Саул ответил: «Потому что я увидел, что народ рассеивался от меня, ты не пришёл к назначенному сроку[a], а филистимляне собираются в Михмасе,»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к назначенному времени дней»; вероятно, имеется в виду заранее установленный период ожидания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: Что ты сделал?
  rationale: Естественный русский вопрос с совершенным видом сохраняет резкость упрёка Самуила и указывает на уже совершённый поступок.
- source_word: כִּי רָאִיתִי כִּי
  choice: Я увидел, что
  rationale: Первое כִּי вводит объяснение Саула и по-русски естественно передаётся самим построением ответа; второе вводит содержание увиденного.
- source_word: נָפַץ הָעָם מֵעָלַי
  choice: народ разбегается от меня
  rationale: Глагол описывает распад и рассеяние людей, а מֵעָלַי подчёркивает, что они покидают Саула. Настоящее время передаёт наблюдавшийся им развивающийся процесс.
- source_word: לֹא בָאתָ
  choice: ты не пришёл
  rationale: Прямо передаёт отрицание завершённого действия без излишнего уточнения временных отношений.
- source_word: לְמוֹעֵד הַיָּמִים
  choice: к назначенному сроку
  rationale: Идиоматично передаёт установленный момент или период ожидания, вероятно связанный с ранее названными днями, не устраняя эту связь полностью благодаря сноске.
- source_word: נֶאֱסָפִים
  choice: собираются
  rationale: Причастная форма обозначает продолжающееся сосредоточение филистимлян; настоящее время естественно передаёт ситуацию в речи Саула.
- source_word: מִכְמָשׂ
  choice: в Михмасе
  rationale: Принятая русская библейская передача топонима с естественным предложным управлением.
