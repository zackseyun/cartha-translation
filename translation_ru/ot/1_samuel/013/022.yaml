  yaml_path: translation/ot/1_samuel/013/022.yaml
  text: So on the day of battle[a], not a sword or spear was found in the hand of any of the people who were with Saul and Jonathan; but Saul and his son Jonathan had them.
translation:
  language: ru
  text: И вот, в день битвы ни у кого из людей, бывших с Саулом и Ионафаном, не оказалось ни меча, ни копья[a]; они были лишь у Саула и его сына Ионафана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «меча и копья не нашлось в руке всего народа». Еврейское выражение означает, что такого оружия не было ни у одного из воинов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И
  rationale: Связывает итоговую обстановку с предшествующим повествованием без тяжеловесного буквального оборота «и было».
- source_word: בְּיוֹם מִלְחֶמֶת
  choice: в день битвы
  rationale: Сохраняет конкретное временное выражение с естественным для русского языка обозначением дня сражения.
- source_word: לֹא נִמְצָא
  choice: не оказалось
  rationale: Естественно передаёт безлично-пассивный нифаль מצא и смысл отсутствия оружия у воинов.
- source_word: חֶרֶב וַחֲנִית
  choice: ни меча, ни копья
  rationale: В отрицательной русской конструкции повторяющееся «ни» ясно передаёт, что не было ни одного из двух видов оружия, хотя в еврейском между существительными стоит обычный союз «и».
- source_word: בְּיַד כָּל הָעָם
  choice: ни у кого из народа
  rationale: 'Еврейское «в руке всего народа» обозначает обладание; под отрицанием כָּל получает распределительное значение: такого оружия не было ни у одного человека.'
- source_word: אֲשֶׁר אֶת שָׁאוּל וְאֶת יוֹנָתָן
  choice: бывшего с Саулом и Ионафаном
  rationale: Эллиптическая конструкция с אֶת выражает совместное пребывание или принадлежность к сопровождавшим их людям.
- source_word: וַתִּמָּצֵא לְשָׁאוּל וּלְיוֹנָתָן בְּנוֹ
  choice: они были только у Саула и его сына Ионафана
  rationale: Местоимение «они» естественно отсылает к мечу и копью; לְ передаёт наличие или доступность оружия. «Только» явно выражает противопоставление всему остальному войску, уже заложенное в контексте.
