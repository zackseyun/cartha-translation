base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/001.yaml
  text: Saul was one year old when he became king[a], and he reigned two years over Israel.
translation:
  language: ru
  text: Саулу был один год, когда он стал царём[a], и царствовал он над Израилем два года.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь труден и, вероятно, дошёл до нас не полностью. Буквально: «Саул был сыном одного года, когда воцарился, и два года царствовал над Израилем». В некоторых древних свидетельствах и позднейших реконструкциях предлагаются бо́льшие числа, например тридцать лет для возраста Саула и сорок два года для продолжительности его царствования.'
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שָׁנָה
  choice: был один год
  rationale: Еврейское возрастное выражение буквально означает «был в возрасте одного года». Такой перевод сохраняет чтение масоретского текста, несмотря на очевидную историко-текстологическую трудность.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Устоявшаяся русская форма личного имени.
- source_word: בְּמָלְכוֹ
  choice: когда он стал царём
  rationale: Конструкция обозначает время вступления на царство; естественная русская формула передаёт её смысл без буквального синтаксического калькирования.
- source_word: וּשְׁתֵּי שָׁנִים
  choice: и… два года
  rationale: Число и союз переданы непосредственно согласно масоретскому тексту.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Глагол מלך в породе каль означает «царствовать, быть царём»; «царствовал» естественно для царской хронологической формулы.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Обычная русская передача конструкции с глаголом правления.
theological_decisions:
- issue: Повреждённая или трудная формула о продолжительности царствования в масоретском тексте
  choice: Сохранить в основном тексте числа масоретского текста без предположительного восполнения
  alternative: 'Восполнить возраст и/или срок царствования, например: «Саулу было тридцать лет… и царствовал он сорок два года» либо оставить явные лакуны'
  rationale: Дошедший еврейский текст, по-видимому, неполон или повреждён, однако надёжно восстановить исходные числа невозможно. Поэтому основной текст прозрачно следует WLC, а проблема и варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской формулой «царствовал над Израилем». Неестественная буквальная калька вынесена в сноску; трудность еврейского текста не скрыта.
