  yaml_path: translation/ot/1_samuel/013/010.yaml
  text: And it happened[a], as soon as he had finished offering up the burnt offering, that behold, Samuel came. And Saul went out to meet him, to bless him.
translation:
  language: ru
  text: И вот, едва он закончил приносить всесожжение, пришёл Самуил. Саул вышел ему навстречу, чтобы благословить его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы приветствовать его». Буквально: «чтобы благословить его»; в контексте встречи еврейский глагол может обозначать формальное приветствие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И вот
  rationale: Естественно вводит следующее событие еврейского повествования, не прибегая к архаичному «и было».
- source_word: כְּכַלֹּתוֹ
  choice: едва он закончил
  rationale: Конструкция с כ и инфинитивом указывает на время и в данном контексте подчёркивает непосредственную последовательность событий.
- source_word: לְהַעֲלוֹת
  choice: возносить
  rationale: Hифиль глагола עלה с жертвенным объектом означает принесение жертвы; «возносить» сохраняет образ движения вверх и культовый оттенок.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский термин для жертвы עֹלָה, полностью сжигавшейся на жертвеннике.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Передаёт внезапность и повествовательную выразительность появления Самуила.
- source_word: בָּא
  choice: пришёл
  rationale: Прямо и естественно передаёт завершившееся прибытие Самуила.
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Сохраняет значение движения наружу.
- source_word: לִקְרָאתוֹ
  choice: ему навстречу
  rationale: Естественный русский эквивалент идиомы выхода для встречи с человеком.
- source_word: לְבָרֲכוֹ
  choice: чтобы приветствовать его
  rationale: Хотя ברך буквально значит «благословлять», в контексте встречи глагол может обозначать формальное приветствие; основной текст передаёт вероятную функцию, а буквальное значение сохранено в примечании.
