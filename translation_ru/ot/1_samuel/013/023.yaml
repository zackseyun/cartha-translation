  text: וַ/יֵּצֵא֙ מַצַּ֣ב פְּלִשְׁתִּ֔ים אֶֽל מַעֲבַ֖ר מִכְמָֽשׂ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/023.yaml
  text: And a garrison of the Philistines went out to the pass of Michmash[a].
translation:
  language: ru
  text: А филистимский гарнизон вышел к Михмасскому перевалу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А филистимская застава вышла к переходу у Михмаса».'
    reason: Еврейские слова מַצַּב и מַעֲבַר допускают соответственно значения «застава» и «место перехода».
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Глагол יצא обозначает движение наружу или выступление откуда-либо; «вышел» сохраняет простой смысл без добавления военного оттенка «выдвинулся».
- source_word: מַצַּב
  choice: гарнизон
  rationale: В данном военном контексте слово может обозначать размещённое воинское подразделение либо укреплённый пост. «Гарнизон» кратко и естественно передаёт основной смысл; возможный вариант отражён в сноске.
- source_word: פְּלִשְׁתִּים
  choice: филистимский
  rationale: 'Естественная русская передача отношения принадлежности: буквально «гарнизон филистимлян».'
- source_word: אֶל
  choice: к
  rationale: Предлог выражает направление движения; русское «к» не требует уточнять, достиг ли отряд места.
- source_word: מַעֲבַר
  choice: перевал
  rationale: Существительное обозначает место прохода или перехода. В связи с местностью у Михмаса и военным контекстом «перевал» является естественной передачей, тогда как «переход» остаётся возможным.
- source_word: מִכְמָשׂ
  choice: Михмас
  rationale: Традиционная и узнаваемая русская форма библейского топонима; в основном тексте связь с перевалом естественно выражена прилагательным «Михмасский».
