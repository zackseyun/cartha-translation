  yaml_path: translation/ot/1_samuel/013/018.yaml
  text: and one company turned toward the road to Beth-horon[a], and one company turned toward the road of the border that overlooks the Valley of Zeboim[b], toward the wilderness.
translation:
  language: ru
  text: а другой отряд[a] повернул на дорогу к Бет-Хорону, и ещё один отряд повернул на дорогу к границе, возвышающейся над долиной Цевоим[b], в сторону пустыни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одна голова»; возможно также: «одно подразделение» или «одна группа».'
    reason: lexical_alternative
  - marker: b
    text: «Цевоим», вероятно, название местности; лежащее в его основе слово, возможно, связано с обозначением гиен.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ אֶחָד
  choice: другой отряд / ещё один отряд
  rationale: Буквально «одна голова»; в военном контексте רֹאשׁ обозначает отдельную часть упомянутого выше грабительского подразделения. «Отряд» естественно и точно передаёт смысл. В начале стиха «другой» связывает фразу с первым отрядом из предыдущего стиха.
- source_word: יִפְנֶה
  choice: повернул
  rationale: Глагол פנה выражает поворот или обращение в определённую сторону; здесь речь идёт о направлении движения войск.
- source_word: דֶּרֶךְ
  choice: дорога
  rationale: В данном топографическом описании דֶּרֶךְ означает конкретную дорогу или путь следования.
- source_word: בֵּית חֹרוֹן
  choice: Бет-Хорон
  rationale: Название места передано транслитерацией, с сохранением двухчастной формы имени.
- source_word: הַגְּבוּל
  choice: граница
  rationale: גְּבוּל обозначает границу или пограничную местность; нейтральное «граница» сохраняет топографическую неоднозначность.
- source_word: הַנִּשְׁקָף
  choice: возвышающейся над
  rationale: Причастие породы нифаль от שׁקף описывает объект, выходящий или смотрящий сверху на местность. По-русски применительно к границе или пограничной возвышенности естественно «возвышающейся над».
- source_word: גֵּי הַצְּבֹעִים
  choice: долина Цевоим
  rationale: Сочетание, вероятно, является топонимом. Имя передано транслитерацией, а возможная связь с названием гиен отмечена в сноске.
- source_word: הַמִּדְבָּרָה
  choice: в сторону пустыни
  rationale: Направительный суффикс -ה указывает на движение к пустыне; «в сторону пустыни» явно передаёт эту направленность.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно повествовательным библейским регистром. Синтаксис сохраняет параллельное построение еврейского текста, но начальное וְ передано как «а», поскольку стих продолжает перечисление трёх направлений из предыдущего стиха. Все сноски отмечены в основном тексте.
