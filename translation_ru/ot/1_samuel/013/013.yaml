  text: וַ/יֹּ֧אמֶר שְׁמוּאֵ֛ל אֶל שָׁא֖וּל נִסְכָּ֑לְתָּ לֹ֣א שָׁמַ֗רְתָּ אֶת מִצְוַ֞ת יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֲשֶׁ֣ר צִוָּ֔/ךְ כִּ֣י עַתָּ֗ה הֵכִ֨ין יְהוָ֧ה אֶת מַֽמְלַכְתְּ/ךָ֛ אֶל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/013.yaml
  text: And Samuel said to Saul[a], “You have acted foolishly. You have not kept the command of Yahweh your God, which he commanded you; for now Yahweh would have established your kingdom over Israel forever.”
translation:
  language: ru
  text: 'И сказал Самуил Саулу: «Ты поступил безрассудно[a]: не исполнил повеления Яхве, твоего Бога, которое Он дал тебе. А ведь теперь Яхве утвердил бы твоё царство над Израилем навеки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты сделал глупость».'
    reason: 'Лексическая альтернатива: נִסְכָּלְתָּ может быть передано более буквально как оценка совершённого поступка.'
lexical_decisions:
- source_word: נִסְכָּלְתָּ
  choice: Ты поступил безрассудно
  rationale: Нифаль глагола סכל здесь оценивает поступок и поведение Саула, а не только его внутреннее состояние; формулировка естественна для современного русского языка.
- source_word: לֹא שָׁמַרְתָּ
  choice: не исполнил
  rationale: שׁמר применительно к повелению означает соблюдать или исполнять его. «Не исполнил» ясно передаёт требуемое послушание, не сводя выражение к буквальному «не сохранил».
- source_word: מִצְוַת
  choice: повеления
  rationale: Единственное число указывает на конкретное данное Саулу повеление. «Повеление» звучит естественно и сохраняет властную силу слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога
  rationale: Прямая передача сочетания с притяжательным суффиксом; приложение относится к имени Яхве.
- source_word: צִוָּךְ
  choice: которое Он дал тебе
  rationale: Буквально глагол означает «повелел тебе», но по-русски повтор «повеления… которое повелел» тяжеловесен; «дал тебе» естественно передаёт вручение обязательного повеления.
- source_word: כִּי עַתָּה
  choice: А ведь теперь
  rationale: В контексте частица вводит упущенное следствие послушания. «А ведь» выражает укор и связь с предыдущим утверждением, а «теперь» сохраняет עַתָּה.
- source_word: הֵכִין
  choice: утвердил бы
  rationale: Хотя еврейская форма сама по себе не маркирует сослагательность, контекст представляет не осуществившийся вследствие непослушания исход; русская конструкция с «бы» ясно передаёт эту контрфактическую силу.
- source_word: מַמְלַכְתְּךָ
  choice: твоё царство
  rationale: ממלכה обозначает царство или царскую власть; «твоё царство» прямо и естественно передаёт образ продолжительной династической власти.
- source_word: אֶל יִשְׂרָאֵל
  choice: над Израилем
  rationale: При утверждении царства предлог אֶל по смыслу обозначает область владычества; нормативный русский оборот — «царство над Израилем».
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Краткая литературная передача значения бессрочной, постоянной продолжительности.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя, а не титул. «Яхве» сохраняет это различие и является современной научно обоснованной русской передачей.
- issue: Контрфактическая сила כִּי עַתָּה הֵכִין יְהוָה
  choice: А ведь теперь Яхве утвердил бы
  alternative: Ибо теперь Яхве утвердил / уже утвердил
  rationale: Последующий контекст показывает, что речь идёт об упущенном результате послушания Саула. Сослагательное наклонение передаёт контекстуально обусловленную контрфактичность, не утверждая, будто вечное царство уже было фактически установлено.
- issue: Значение «царства навеки»
  choice: твоё царство над Израилем навеки
  alternative: твоё правление над Израилем навеки
  rationale: Формулировка сохраняет открытым вопрос, относится ли обещанная длительность к личному правлению Саула, его дому или царской власти в более широком смысле; перевод не добавляет слова «династия».
translation_notes:
  register: Современный литературный русский язык с достоинством прямой пророческой речи. Синтаксис слегка приподнят, но понятен обычному читателю; местоимение «Он» написано с прописной буквы согласно распространённой русской библейской традиции.
