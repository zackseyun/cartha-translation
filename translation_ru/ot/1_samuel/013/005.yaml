source:
  edition: WLC
  text: וּ/פְלִשְׁתִּ֞ים נֶאֶסְפ֣וּ לְ/הִלָּחֵ֣ם עִם יִשְׂרָאֵ֗ל שְׁלֹשִׁ֨ים אֶ֤לֶף רֶ֨כֶב֙ וְ/שֵׁ֤שֶׁת אֲלָפִים֙ פָּרָשִׁ֔ים וְ/עָ֕ם כַּ/ח֛וֹל אֲשֶׁ֥ר עַל שְׂפַֽת הַ/יָּ֖ם לָ/רֹ֑ב וַֽ/יַּעֲלוּ֙ וַ/יַּחֲנ֣וּ בְ/מִכְמָ֔שׂ קִדְמַ֖ת בֵּ֥ית אָֽוֶן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/005.yaml
  text: 'And the Philistines gathered to fight against Israel: thirty thousand chariots[a], and six thousand horsemen, and troops as numerous as the sand that is on the seashore. They went up and camped at Mikmash, east of Beth-aven.'
translation:
  language: ru
  text: 'Филистимляне собрались, чтобы сразиться с Израилем: у них было тридцать тысяч колесниц[a], шесть тысяч всадников и войско, многочисленное, как песок на морском берегу. Они поднялись и расположились лагерем в Михмасе, к востоку от Бет-Авена.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «тридцать тысяч колесниц». Некоторые древние свидетели текста и исследователи предлагают меньшее число, например «три тысячи», поскольку тридцать тысяч кажется необычно большим для данного контекста; основной текст следует масоретскому еврейскому тексту.
    reason: textual_variant
lexical_decisions:
- source_word: נֶאֶסְפוּ
  choice: собрались
  rationale: Форма нифаль от אסף здесь означает сбор сил для сражения; «собрались» естественно передаёт это значение без излишнего уточнения.
- source_word: לְהִלָּחֵם עִם
  choice: чтобы сразиться с
  rationale: В данном контексте оборот обозначает враждебное военное столкновение; русский предлог «с» после «сразиться» сохраняет смысл и естественен.
- source_word: שְׁלֹשִׁים אֶלֶף רֶכֶב
  choice: тридцать тысяч колесниц
  rationale: Это прямое соответствие масоретскому тексту; спорное число сохранено в основном тексте, а текстологический вопрос вынесен в сноску.
- source_word: שֵׁשֶׁת אֲלָפִים פָּרָשִׁים
  choice: шесть тысяч всадников
  rationale: פָּרָשִׁים обозначает конных воинов; «всадники» — точное и понятное современному читателю слово.
- source_word: וְעָם
  choice: и войско
  rationale: Буквально «народ», но в описании военного сбора слово относится к массе воинов; «войско» ясно передаёт контекстуальный смысл.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: многочисленное, как песок на морском берегу
  rationale: Сохранён образ неисчислимого множества, а выражение оформлено естественно для современного русского языка.
- source_word: וַיַּעֲלוּ
  choice: они поднялись
  rationale: Сохранено обычное пространственное значение עלה; перевод не заменяет его более толковательным «выступили» или «двинулись».
- source_word: וַיַּחֲנוּ
  choice: расположились лагерем
  rationale: Передаёт значение חנה ясно и естественно в повествовании о военном стане.
- source_word: בְמִכְמָשׂ
  choice: в Михмасе
  rationale: Название места передано принятой русской транслитерацией и грамматически встроено в предложение.
- source_word: קִדְמַת בֵּית אָוֶן
  choice: к востоку от Бет-Авена
  rationale: קִדְמַת указывает на положение с восточной стороны; такой перевод наиболее ясен географически.
