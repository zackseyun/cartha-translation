  yaml_path: translation/ot/1_samuel/013/016.yaml
  text: Saul and Jonathan his son[a], and the people who were with them, were staying in Geba of Benjamin[b], while the Philistines had encamped at Michmash.
translation:
  language: ru
  text: Саул, его сын Ионафан и люди, которые были с ними[a], находились в Геве Вениаминовой[b], а филистимляне расположились лагерем в Михмасе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «люди, находившиеся с ними»; вероятно, имеются в виду те, кто ещё оставался с Саулом и Ионафаном после того, как другие рассеялись.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте здесь названа Гева, а не Гива; в данном повествовании это разные города.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנִּמְצָא עִמָּם
  choice: остававшиеся с ними
  rationale: Буквально оборот означает «находившиеся с ними» или «оказавшиеся с ними». В данном контексте речь идёт о людях, которые всё ещё оставались при Сауле и Ионафане после того, как другие рассеялись; выбранный вариант естественен по-русски и сохраняет этот контекстуальный оттенок.
- source_word: יֹשְׁבִים
  choice: находились
  rationale: Причастие от ישׁב здесь обозначает пребывание в определённом месте, а не физическое сидение. «Находились» естественно передаёт местонахождение военного отряда, не добавляя идеи постоянного проживания.
- source_word: בְּגֶבַע בִּנְיָמִן
  choice: в Геве Вениаминовой
  rationale: Форма גֶּבַע указывает на Геву, а не на отличную от неё Гиву. Определение «Вениаминова» передаёт принадлежность города области или колену Вениамина и соответствует принятому библейскому топонимическому регистру.
- source_word: חָנוּ
  choice: расположились лагерем
  rationale: Глагол חנה является обычным обозначением разбивки военного лагеря. Совершенный вид передаёт состоявшееся размещение филистимлян у Михмаса.
- source_word: בְמִכְמָשׂ
  choice: в Михмасе
  rationale: Предлог בְ допускает локативное «в/у». «В Михмасе» естественно для русского обозначения места стоянки и не требует уточнений, отсутствующих в источнике.
- source_word: וְ
  choice: а
  rationale: Начальный союз отдельно не выражен, чтобы избежать тяжёлого русского зачина; связь с предыдущим повествованием сохраняется контекстом. Союз перед второй частью передан как «а», поскольку он естественно обозначает сопоставление местонахождения двух сторон.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской топонимикой. Синтаксис сделан плавным и понятным; военная обстановка передана без лишних пояснений. Начальный וְ не воспроизведён отдельным союзом, поскольку в русском стих естественно продолжает предшествующее повествование без формального «и».
