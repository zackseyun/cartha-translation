  terminology: «Кузнец» оправдан военным контекстом; «земля Израиля» сохраняет территориальный библейский смысл; «евреи» верно отражает הָעִבְרִים и не подменяет его «израильтянами». «Мечи или копья» естественно передаёт родовое употребление еврейских существительных единственного числа.
