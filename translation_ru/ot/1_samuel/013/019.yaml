  source_fidelity: Перевод точно передаёт отсутствие кузнецов, охват «во всей земле Израиля», причинную связь, этноним «евреи», а также предотвратительное значение פֶּן. Однако еврейская форма אָמַר — завершённое повествовательное «сказали», а не итеративное «говорили»; последнее необоснованно создаёт оттенок постоянно повторяемой реплики или политики.
