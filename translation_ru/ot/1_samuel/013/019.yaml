base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/019.yaml
  text: No blacksmith could be found in all the land of Israel[a], because the Philistines said, “Otherwise the Hebrews will make swords or spears.”
translation:
  language: ru
  text: 'Во всей земле Израиля не нашлось ни одного кузнеца, потому что филистимляне сказали: «Как бы евреи не стали делать мечи или копья».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָרָשׁ
  choice: кузнец
  rationale: В военном контексте речь идёт о мастере по металлу, способном изготавливать оружие и обрабатывать орудия, а не о ремесленнике вообще.
- source_word: יִמָּצֵא
  choice: не нашлось
  rationale: Форма нифаль выражает отсутствие того, кого можно было бы найти; русское «не нашлось» естественно передаёт этот смысл.
- source_word: בְּכֹל אֶרֶץ יִשְׂרָאֵל
  choice: во всей земле Израиля
  rationale: Сохранено территориальное значение и привычное для библейского повествования слово «земля».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину отсутствия кузнецов.
- source_word: אמר
  choice: говорили
  rationale: По смыслу подлежащим являются филистимляне во множественном числе; несовершенный вид естественно передаёт их установку или повторяемое обоснование политики.
- source_word: פֶּן
  choice: как бы … не
  rationale: Русская конструкция естественно выражает опасение и предотвращаемую возможность, не превращая её в категорическое предсказание.
- source_word: הָעִבְרִים
  choice: евреи
  rationale: Сохранено исходное этническое обозначение «евреи», характерное для речи иноплеменников; оно не заменено словом «израильтяне».
- source_word: יַעֲשׂוּ
  choice: не стали делать
  rationale: В сочетании с פֶּן передаёт действие, возможность которого филистимляне стремились предотвратить.
- source_word: חֶרֶב אוֹ חֲנִית
  choice: мечи или копья
  rationale: Единственное число в еврейском употреблено родовым образом; русский множественный ряд ясно передаёт производство таких видов оружия вообще.
