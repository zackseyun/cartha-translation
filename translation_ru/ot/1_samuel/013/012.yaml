base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/012.yaml
  text: So I said[a], ‘Now the Philistines will come down against me at Gilgal[b], and I have not sought the favor of Yahweh.’ So I forced myself and offered up the burnt offering.
translation:
  language: ru
  text: 'И я сказал: «Теперь филистимляне спустятся ко мне в Галгал, а я ещё не испросил благоволения у Яхве[a]». Тогда я пересилил себя[b] и принёс всесожжение.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не умолял лица Яхве»; это выражение означает просить Его о благоволении.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «сдержал себя». Еврейский глагол может означать, что человек овладел собой или заставил себя поступить определённым образом; здесь Саул, по-видимому, говорит, что вынудил себя действовать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: И я сказал
  rationale: Последовательная форма с וַ־ продолжает рассказ Саула; прямое «сказал» сохраняет форму исходного текста, не добавляя «себе».
- source_word: עַתָּה
  choice: Теперь
  rationale: Передаёт временное значение и ощущение наступившей неотложности.
- source_word: יֵרְדוּ פְלִשְׁתִּים אֵלַי
  choice: филистимляне спустятся на меня
  rationale: «Спустятся» сохраняет пространственное значение ירד, а «на меня» естественно выражает враждебное движение в военном контексте.
- source_word: הַגִּלְגָּל
  choice: в Галгал
  rationale: Обычная русская передача топонима; предлог «в» указывает на место ожидаемого нападения.
- source_word: וּפְנֵי יְהוָה לֹא חִלִּיתִי
  choice: а я ещё не испросил благоволения у Яхве
  rationale: Идиома חלה פני означает обратиться с мольбой, добиваясь благосклонности; «испросил благоволения» ясно передаёт смысл, а «ещё» естественно выражает незавершённость, подразумеваемую рассуждением Саула.
- source_word: וָאֶתְאַפַּק
  choice: Тогда я пересилил себя
  rationale: Форма глагола אפק допускает оттенки самообладания, сдерживания и понуждения себя. В контексте оправдания совершённого действия «пересилил себя» передаёт действие вопреки внутренней неготовности, не устраняя лексическую неоднозначность, отмеченную в сноске.
- source_word: וָאַעֲלֶה הָעֹלָה
  choice: и принёс всесожжение
  rationale: Устойчивое и понятное обозначение принесения жертвы всесожжения; сохраняет культовый смысл сочетания עלה и עולה.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Смысл выражения חלה פני יהוה
  choice: испросил благоволения у Яхве
  alternative: умолил лицо Яхве; обратился с мольбой к Яхве
  rationale: Выражение буквально связано с «лицом», но идиоматически означает искать чьей-либо благосклонности посредством мольбы. Выбранная формулировка передаёт идиому без вывода о том, была бы просьба непременно удовлетворена.
- issue: Мотив поступка Саула в וָאֶתְאַפַּק
  choice: пересилил себя
  alternative: сдержал себя
  rationale: Контекст указывает, что Саул объясняет, почему всё же принёс жертву, однако сам глагол может обозначать овладение собой или внутреннее принуждение. Основной текст следует контексту, а сноска сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис прямой и доступный; «всесожжение» сохранено как общепринятый богослужебно-библейский термин. Все сноски привязаны к тем выражениям, которые они поясняют.
