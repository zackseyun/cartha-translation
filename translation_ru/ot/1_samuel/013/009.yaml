source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל הַגִּ֣שׁוּ אֵלַ֔/י הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יַּ֖עַל הָ/עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/009.yaml
  text: So Saul said[b][a], “Bring near to me the burnt offering and the peace offerings.” And he offered up the burnt offering.
translation:
  language: ru
  text: 'Тогда Саул сказал: «Поднесите ко мне всесожжение и мирные жертвы[a]». И он принёс всесожжение[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы благополучия» либо «жертвы общения». Еврейское слово может обозначать жертвы, связанные с миром, благополучием и совместной трапезой.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительную фразу естественнее всего понимать в том смысле, что Саул сам принёс всесожжение. Возможно и менее прямое понимание: он велел принести всесожжение.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда Саул сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию, не добавляя причинного смысла.
- source_word: הַגִּשׁוּ אֵלַי
  choice: Поднесите ко мне
  rationale: Побудительная форма глагола נגשׁ означает «приблизить, поднести»; выбранный вариант сохраняет оттенок ритуального предъявления жертвы.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: עֹלָה — установленное обозначение жертвы, сжигаемой целиком; «всесожжение» является точным и узнаваемым русским термином.
- source_word: וְהַשְּׁלָמִים
  choice: и мирные жертвы
  rationale: שְׁלָמִים обозначает жертвы, связанные с миром, благополучием и совместной трапезой; «мирные жертвы» сохраняет традиционный культовый термин, а иной смысловой оттенок отмечен в сноске.
- source_word: וַיַּעַל
  choice: И он принёс
  rationale: В контексте жертвоприношения עלה означает вознести или принести жертву. «Принёс» звучит естественно по-русски и, при обычном понимании синтаксиса, указывает на действие самого Саула.
theological_decisions:
- issue: Кто совершил действие в заключительной части стиха
  choice: Саул сам принёс всесожжение
  alternative: Саул распорядился, чтобы всесожжение было принесено
  rationale: Ближайший названный субъект единственного числа — Саул, поэтому прямое прочтение состоит в том, что действие совершил он сам; оно также согласуется с последующим упрёком. Однако возможное косвенно-каузативное понимание не исключено и указано в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением узнаваемой библейской и жертвенной терминологии. Синтаксис краткий и повествовательный; архаизмы избегаются.
