base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/002.yaml
  text: And Saul chose for himself three thousand men from Israel[a]. Two thousand were with Saul at Michmash and in the hill country of Bethel, and a thousand were with Jonathan at Gibeah of Benjamin. The rest of the people he sent away[b], each man to his tent.
translation:
  language: ru
  text: Саул выбрал себе из Израиля три тысячи человек. Две тысячи были с Саулом в Михмасе и в нагорье Бет-Эля[a], а тысяча — с Ионафаном в Гиве Вениаминовой. Остальных из народа он отпустил — каждого к своему шатру[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на горе Бет-Эля». Еврейское выражение может обозначать как нагорье вокруг Бет-Эля, так и отдельную возвышенность близ него.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение обычно означает роспуск людей по своим жилищам; буквально: «каждого к своему шатру».'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: выбрал себе
  rationale: Сохраняет основное значение בחר «выбирать» и дательный компонент לוֹ, указывающий, что Саул отобрал людей для себя.
- source_word: שְׁלֹשֶׁת אֲלָפִים מִיִּשְׂרָאֵל
  choice: из Израиля три тысячи человек
  rationale: Предлог מִן обозначает источник отбора; слово «человек» естественно передаёт подразумеваемых воинов, не вводя более узкого слова «солдат».
- source_word: וַיִּהְיוּ עִם שָׁאוּל
  choice: были с Саулом
  rationale: Прямо передаёт распределение отобранных людей, не добавляя значения «остались», которого глагольная форма сама по себе не выражает.
- source_word: בְּמִכְמָשׂ
  choice: в Михмасе
  rationale: Естественная русская локативная конструкция для названия населённого пункта.
- source_word: וּבְהַר בֵּית אֵל
  choice: и на возвышенностях Бет-Эля
  rationale: הַר может обозначать гору, холм или гористую местность. Множественное «возвышенности» естественно выражает вероятный региональный смысл, а сноска сохраняет возможность понимания как отдельной возвышенности.
- source_word: בְּגִבְעַת בִּנְיָמִין
  choice: в Гиве Вениаминовой
  rationale: Масоретская огласовка указывает на Гиву; традиционная русская форма «Вениаминова» кратко отличает этот город по территории колена.
- source_word: וְיֶתֶר הָעָם
  choice: остальных из народа
  rationale: Передаёт יֶתֶר как «остальные», сохраняя буквальное הָעָם «народ» и не сужая его без необходимости до «войска».
- source_word: שִׁלַּח
  choice: отпустил
  rationale: В контексте роспуска людей русское «отпустил» естественно передаёт значение отправления прочь.
- source_word: אִישׁ לְאֹהָלָיו
  choice: каждого к своему шатру
  rationale: Сохраняет конкретный образ шатра и распределительное значение אִישׁ; это также устойчивое обозначение возвращения людей по домам.
