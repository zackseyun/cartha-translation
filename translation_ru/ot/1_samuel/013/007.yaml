base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/007.yaml
  text: And Hebrews crossed over the Jordan into the land of Gad and Gilead[a]. But Saul was still at Gilgal[b], and all the people trembled behind him.
translation:
  language: ru
  text: А евреи перешли Иордан, в землю Гада и Галаад[a]. Саул же всё ещё оставался в Галгале, и весь народ дрожал позади него[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». В еврейском тексте стоит «евреи» — обозначение, которое в этом повествовательном контексте может иметь более выраженный этнический оттенок.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «следуя за ним»; возможен также перевод «за ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִים
  choice: евреи
  rationale: Прямо передаёт этнически маркированное обозначение исходного текста, не заменяя его более толковательным «израильтяне».
- source_word: עָבְרוּ אֶת הַיַּרְדֵּן
  choice: перешли Иордан
  rationale: Естественное русское выражение для перехода через реку; название «Иордан» по-русски может обозначать саму реку без добавления слова «река».
- source_word: אֶרֶץ גָּד וְגִלְעָד
  choice: в землю Гада и Галаад
  rationale: Сохраняет географическую формулировку оригинала и различие между Гадом и Галаадом.
- source_word: עוֹדֶנּוּ בַגִּלְגָּל
  choice: всё ещё оставался в Галгале
  rationale: Форма выражает продолжающееся пребывание Саула в указанном месте; «оставался» делает это естественным по-русски.
- source_word: חָרְדוּ
  choice: дрожал от страха
  rationale: Передаёт не только страх, но и его яркое физическое проявление; единственное число согласовано с собирательным «весь народ».
- source_word: אַחֲרָיו
  choice: шедший за ним
  rationale: В контексте народа при Сауле естественно выражает следование за ним, сохраняя возможный пространственный оттенок «позади него».
