base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/017.yaml
  text: And raiders came out from the camp of the Philistines in three companies[a]. One company turned toward the road to Ophrah[b], toward the land of Shual.
translation:
  language: ru
  text: Из лагеря филистимлян вышли три отряда, совершавших набеги[a][b]. Один из отрядов направился по дороге к Офре, к земле Шуал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «разрушитель» или «разоряющая сила»; здесь это собирательное обозначение отрядов, совершавших набеги из лагеря филистимлян.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «три головы»; это образное обозначение трёх военных подразделений или отрядов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁחִית
  choice: отряд разорителей
  rationale: Существительное в единственном числе с артиклем буквально обозначает «разрушителя» или «разоряющую силу», но в данном военном контексте употреблено собирательно и относится к отряду, вышедшему для набега.
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: разделённый на три группы
  rationale: Буквально «три головы»; здесь это образное обозначение трёх частей или подразделений военного отряда. Перевод передаёт смысл естественным современным русским языком.
- source_word: הָרֹאשׁ אֶחָד
  choice: одна группа
  rationale: Повтор того же образного выражения в единственном числе; последовательный перевод сохраняет связь с тремя группами в предыдущей фразе.
- source_word: יִפְנֶה
  choice: направилась
  rationale: Глагол означает «поворачивать, обращать лицо, направляться». В повествовании речь идёт о направлении движения одной из групп.
- source_word: דֶּרֶךְ עָפְרָה
  choice: по дороге к Офре
  rationale: דֶּרֶךְ означает «путь, дорога»; сочетание указывает на дорогу, ведущую в сторону Офры.
- source_word: אֶרֶץ שׁוּעָל
  choice: к земле Шуал
  rationale: אֶרֶץ может означать землю, область или территорию. «Земля Шуал» сохраняет форму регионального обозначения.
- source_word: פְלִשְׁתִּים
  choice: филистимлян
  rationale: Устоявшееся русское наименование народа.
- source_word: עָפְרָה
  choice: Офра
  rationale: Традиционная русская передача географического названия.
- source_word: שׁוּעָל
  choice: Шуал
  rationale: Транслитерация названия области; значение имени не переводится.
