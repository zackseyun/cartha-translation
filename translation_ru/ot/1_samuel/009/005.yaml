  source_fidelity: 'В целом смысл передан верно: прибытие в область Цуфа, обращение Саула к сопровождающему юноше, побуждение возвратиться и противопоставление заботы об ослицах тревоге о сыне сохранены. Однако «перестанет думать об ослицах» передаёт лишь мыслительную направленность и несколько ослабляет значение חדל מן в данном контексте — прекращение заботы/беспокойства о них.'
  naturalness: Текст естественен для современного литературного русского; «Пойдём, вернёмся» и «а то» уместны в краткой прямой речи. «Перестанет беспокоиться об ослицах» точнее и столь же естественно. Для обеспокоенности о людях нормативно и идиоматично «беспокоиться за нас».
