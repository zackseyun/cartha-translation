base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/005.yaml
  text: When they came into the land of Zuph[a], Saul said to his young man who was with him, “Come, let us return[b], lest my father stop caring about the donkeys and become anxious about us.”
translation:
  language: ru
  text: 'Когда они вошли в землю Цуф, Саул сказал юноше, который был с ним: «Пойдём, вернёмся, а то мой отец перестанет беспокоиться об ослицах[a] и станет тревожиться за нас[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перестанет заботиться об ослицах». Буквально: «перестанет [быть занят] ослицами»; еврейский оборот означает, что они перестанут быть предметом его заботы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «станет беспокоиться о нас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ בְּאֶרֶץ צוּף
  choice: вошли в землю Цуф
  rationale: Глагол בוא с предлогом ב здесь обозначает прибытие в область; «вошли в землю» естественно передаёт направленность движения и сохраняет географическое название.
- source_word: נַעֲרוֹ אֲשֶׁר עִמּוֹ
  choice: юноше, который был с ним
  rationale: נַעַר может означать юношу, слугу или помощника. Основное значение сохранено без излишнего уточнения его общественного положения, а относительная конструкция передаёт אֲשֶׁר עִמּוֹ.
- source_word: לְכָה וְנָשׁוּבָה
  choice: Пойдём, вернёмся
  rationale: Императив с когортативом выражает побуждение к совместному возвращению. Такая формулировка сохраняет оба глагольных элемента и звучит естественно по-русски.
- source_word: פֶּן
  choice: а то
  rationale: פֶּן вводит нежелательное возможное следствие. Разговорно-нейтральное «а то» естественно в прямой речи и не ослабляет предостережения.
- source_word: יֶחְדַּל ... מִן הָאֲתֹנוֹת
  choice: перестанет думать об ослицах
  rationale: Буквально конструкция означает «перестанет/отвлечётся от ослиц»; в контексте речь о прекращении заботы или беспокойства о них. «Перестанет думать» ясно передаёт смену предмета тревоги.
- source_word: וְדָאַג לָנוּ
  choice: и станет тревожиться о нас
  rationale: דאג обозначает тревогу или беспокойство, а לָנוּ указывает на её объект. «Станет тревожиться о нас» передаёт переход от заботы об ослицах к тревоге за отсутствующих людей.
