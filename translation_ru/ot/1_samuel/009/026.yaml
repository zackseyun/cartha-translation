base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/026.yaml
  text: They rose early[a], and when the dawn was breaking, Samuel called to Saul on the roof, saying, “Get up, and I will send you on your way.” So Saul got up, and the two of them, he and Samuel[b], went outside.
translation:
  language: ru
  text: 'Они встали рано, и, когда занялась заря[a], Самуил позвал Саула, находившегося на крыше: «Вставай, я отпущу тебя в путь[b]». Саул встал, и они оба — он и Самуил — вышли наружу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при восхождении зари».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «я отпущу тебя»; еврейский глагол может означать отпустить человека или отправить его в путь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: Они встали рано
  rationale: Глагол שׁכם в данной форме указывает на ранний подъём или раннее начало действия; этот перевод естественно передаёт временной оттенок.
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: когда занялась заря
  rationale: Буквальный образ — «при восхождении зари». Выбранная формулировка сохраняет образ наступающего рассвета и звучит естественно в современном литературном русском.
- source_word: הַגָּג
  choice: на крыше
  rationale: Речь идёт о плоской крыше дома, где, согласно ближайшему контексту, ночевал Саул. Оборот «находившегося на крыше» устраняет поверхностную русскую двусмысленность относительно того, кто был на крыше.
- source_word: קוּמָה
  choice: Вставай
  rationale: Обычная современная форма повеления, точно передающая призыв подняться.
- source_word: וַאֲשַׁלְּחֶךָּ
  choice: я провожу тебя
  rationale: В этом контексте שׁלח означает отпустить или отправить в путь. «Провожу тебя» естественно передаёт учтивое отправление гостя, не придавая словам оттенка изгнания.
- source_word: וַיֵּצְאוּ ... הַחוּצָה
  choice: вышли наружу
  rationale: Сочетание глагола движения с направительным наречием означает выход наружу; перевод не уточняет место назначения сверх сказанного в еврейском тексте.
- source_word: שְׁנֵיהֶם הוּא וּשְׁמוּאֵל
  choice: они оба — он и Самуил
  rationale: Сохранена подчёркнутая аппозиция еврейского текста; местоимение «он» отсылает к Саулу.
