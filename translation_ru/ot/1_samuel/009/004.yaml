  text: וַ/יַּעֲבֹ֧ר בְּ/הַר אֶפְרַ֛יִם וַ/יַּעֲבֹ֥ר בְּ/אֶֽרֶץ שָׁלִ֖שָׁה וְ/לֹ֣א מָצָ֑אוּ וַ/יַּעַבְר֤וּ בְ/אֶֽרֶץ שַׁעֲלִים֙ וָ/אַ֔יִן וַ/יַּעֲבֹ֥ר בְּ/אֶֽרֶץ יְמִינִ֖י וְ/לֹ֥א מָצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/004.yaml
  text: He passed through the hill country of Ephraim and passed through the land of Shalishah[a], but they did not find them. Then they passed through the land of Shaalim, but they were not there. Then he passed through the land of Benjamin[b], but they did not find them.
translation:
  language: ru
  text: Он прошёл по горной области Ефрема и по земле Шалиша, но они их не нашли[a]. Потом они прошли по земле Шаалим, но их там не было[b]. Затем он прошёл по земле Вениамина, но они их не нашли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте объект не назван; «их» относится к пропавшим ослицам, упомянутым в предыдущем стихе.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и не было» или «и ничего не было»; по смыслу речь идёт об ослицах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר / וַיַּעַבְרוּ
  choice: прошёл / прошли по
  rationale: Глагол עבר с предлогом בְ обозначает передвижение по территории или через неё. В данном перечне областей русское «прошёл/прошли по» естественно передаёт последовательное обследование местности и сохраняет смену единственного и множественного числа в еврейском тексте.
- source_word: בְּהַר אֶפְרַיִם
  choice: по горной области Ефрема
  rationale: В географическом сочетании הַר обозначает не одну гору, а гористую область. Такой перевод точен и понятен современному читателю.
- source_word: אֶרֶץ שָׁלִשָׁה
  choice: земле Шалиша
  rationale: אֶרֶץ здесь означает именованную территорию; топоним передан транслитерацией без уточнения её политического статуса.
- source_word: וְלֹא מָצָאוּ
  choice: но они их не нашли
  rationale: Глагол стоит во множественном числе и относится к Саулу и его слуге. Объект в еврейском тексте не назван, но из предыдущего контекста ясно, что речь идёт о пропавших ослицах; местоимение «их» добавлено ради естественного русского синтаксиса.
- source_word: אֶרֶץ שַׁעֲלִים
  choice: земле Шаалим
  rationale: Название территории сохранено как топоним и передано транслитерацией.
- source_word: וָאַיִן
  choice: но их там не было
  rationale: Краткое еврейское выражение буквально означает «и не было» или «и ничего не было». Контекстуальный перевод передаёт подразумеваемое отсутствие разыскиваемых ослиц, а сноска сохраняет буквальную неоднозначность.
- source_word: אֶרֶץ יְמִינִי
  choice: земле Вениамина
  rationale: Форма יְמִינִי связана с Вениамином и в географическом контексте обозначает территорию Вениаминова племени. «Земля Вениамина» — ясная и естественная русская передача.
