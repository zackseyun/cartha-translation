source:
  edition: WLC
  text: לְ/פָנִ֣ים בְּ/יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר הָ/אִישׁ֙ בְּ/לֶכְתּ/וֹ֙ לִ/דְר֣וֹשׁ אֱלֹהִ֔ים לְכ֥וּ וְ/נֵלְכָ֖ה עַד הָ/רֹאֶ֑ה כִּ֤י לַ/נָּבִיא֙ הַ/יּ֔וֹם יִקָּרֵ֥א לְ/פָנִ֖ים הָ/רֹאֶֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/009.yaml
  text: Formerly in Israel[a], when a man went to inquire of God, he would say, “Come, and let us go to the seer,” for the prophet of today was formerly called the seer.
translation:
  language: ru
  text: 'Прежде в Израиле[a], когда человек шёл вопросить Бога, он говорил: «Давайте пойдём к провидцу», — ведь того, кого сегодня называют пророком, прежде называли провидцем.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В прежние времена в Израиле человек, отправляясь искать Бога, говорил: „Давайте пойдём к провидцу“».'
    reason: Лְפָנִים можно развернуть как «в прежние времена», а לִדְרֹשׁ אֱלֹהִים — передать более буквально и широко как «искать Бога».
lexical_decisions:
- source_word: לְפָנִים
  choice: прежде
  rationale: Временное наречие означает «раньше, в прежние времена»; одинаковый перевод в обоих случаях сохраняет явный контраст с «сегодня».
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Прямое обозначение места, где существовал описываемый обычай.
- source_word: כֹּה אָמַר
  choice: он говорил
  rationale: В контексте прошлого обычая форма передаёт повторяющееся действие, поэтому естественное русское несовершенное прошедшее точнее буквального «так сказал».
- source_word: הָאִישׁ
  choice: человек
  rationale: Определённая форма употреблена обобщённо; русское «человек» естественно передаёт единичного типичного участника обычая без привязки к конкретному лицу.
- source_word: בְּלֶכְתּוֹ
  choice: когда человек шёл
  rationale: Инфинитивная конструкция с местоименным суффиксом имеет временное значение.
- source_word: לִדְרֹשׁ אֱלֹהִים
  choice: вопросить Бога
  rationale: В данном контексте דָּרַשׁ означает обратиться за Божьим ответом или руководством, в том числе через пророческого посредника; «вопросить» сохраняет религиозно-консультативный оттенок.
- source_word: לְכוּ וְנֵלְכָה
  choice: давайте пойдём
  rationale: Естественное русское приглашение совместно отправиться куда-либо передаёт сочетание повелительной формы и когортатива без неидиоматичного повтора «идите — и пойдём».
- source_word: עַד הָרֹאֶה
  choice: к провидцу
  rationale: В конструкции движения עַד указывает на цель, а רֹאֶה служит старым наименованием пророческого лица. «Провидец» понятно современному читателю и сохраняет терминологическое отличие от «пророка».
- source_word: לַנָּבִיא
  choice: того, кого … называют пророком
  rationale: Перестройка фразы естественно передаёт определённое наименование и еврейскую конструкцию, объясняющую смену титула.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Слово обозначает время рассказчика и прямо противопоставлено «прежде».
- source_word: יִקָּרֵא
  choice: называют / называли
  rationale: Пассивная форма выражена естественной русской неопределённо-личной конструкцией; настоящее при «сегодня» и прошедшее при «прежде» ясно передают временной контраст.
- source_word: הָרֹאֶה
  choice: провидцем
  rationale: Сохраняется прежний технический титул, противопоставленный более позднему названию «пророк».
theological_decisions:
- issue: Смысл выражения דָּרַשׁ אֱלֹהִים в пророческом контексте
  choice: вопросить Бога
  alternative: искать Бога
  rationale: Речь идёт о получении ответа или руководства через провидца. Выбранный вариант сохраняет консультативный смысл, но не добавляет утверждений о способе или природе пророческого откровения.
- issue: Соотношение титулов נָבִיא и רֹאֶה
  choice: пророк / провидец
  alternative: пророк / прозорливец
  rationale: Два различных русских слова сохраняют историческое пояснение о смене наименования. «Провидец» передаёт связь רֹאֶה с видением, не утверждая, что речь идёт о двух разных служениях.
- issue: Обобщённое הָאִישׁ
  choice: человек
  alternative: мужчина
  rationale: Здесь существительное обозначает типичного участника описываемого обычая, а не подчёркивает его пол; «человек» сохраняет обобщённость без doctrinally значимого расширения смысла.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Вопросить» и «провидец» сохраняют достоинство и историко-религиозный оттенок, а синтаксис остаётся понятным обычному читателю.
