base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/022.yaml
  text: Then Samuel took Saul and his young man and brought them into the hall[a], and gave them a place at the head of those who had been invited[c][b]; and they were about thirty men.
translation:
  language: ru
  text: Самуил взял Саула и его слугу[a], ввёл их в зал[b] и отвёл им почётное место во главе приглашённых; их было около тридцати человек[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его юного спутника»; еврейское слово может обозначать юношу, слугу или сопровождающего.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в комнату». Еврейское слово обозначает отдельное помещение или палату; здесь, по контексту трапезы, вероятно, имеется в виду зал.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «а их было около тридцати человек». Вероятнее всего, речь идёт о приглашённых гостях.'
    reason: referent_ambiguity
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: его слугу
  rationale: В данном повествовательном контексте נַעַר обозначает сопровождающего Саула подчинённого; «слуга» естественно передаёт его роль, не утверждая рабского статуса.
- source_word: לִשְׁכָּתָה
  choice: в зал
  rationale: לִשְׁכָּה может означать комнату, помещение или палату; контекст общей трапезы с примерно тридцатью гостями указывает на достаточно просторный зал.
- source_word: מָקוֹם בְּרֹאשׁ
  choice: почётное место
  rationale: Буквально «место во главе»; в контексте рассадки на трапезе это естественный русский способ обозначить первенствующее, почётное место.
- source_word: הַקְּרוּאִים
  choice: приглашённых
  rationale: Субстантивированное пассивное причастие от קרא в контексте пира означает приглашённых гостей.
- source_word: וְהֵמָּה כִּשְׁלֹשִׁים אִישׁ
  choice: которых было около тридцати человек
  rationale: Местоимение, вероятнее всего, относится к только что упомянутым приглашённым; придаточная конструкция ясно и естественно передаёт эту связь по-русски.
- source_word: וַיִּקַּח
  choice: взял
  rationale: Сохранено обычное значение לקח и последовательность повествования; следующий глагол уточняет направленное движение.
- source_word: וַיְבִיאֵם
  choice: ввёл их
  rationale: Каузативная форма בוא означает «ввести/привести»; поскольку речь идёт о входе в помещение, «ввёл» звучит точно и естественно.
