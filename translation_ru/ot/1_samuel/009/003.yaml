base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/003.yaml
  text: The donkeys belonging to Kish[a], Saul’s father, were lost. So Kish said to Saul his son, “Please take with you one of the young men, and get up, go[b], seek the donkeys.”
translation:
  language: ru
  text: 'Ослицы, принадлежавшие Кису, отцу Саула, пропали. Тогда Кис сказал своему сыну Саулу: «Возьми, пожалуйста, с собой одного из молодых людей[a], встань и иди искать ослиц».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одного из слуг»; еврейское слово может обозначать как молодых людей, так и слуг или сопровождающих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאבַדְנָה
  choice: пропали
  rationale: Глагол אבד здесь означает, что животных не могли найти. «Пропали» естественно передаёт это, не подразумевая их гибели.
- source_word: הָאֲתֹנוֹת
  choice: ослицы
  rationale: Еврейское существительное прямо обозначает самок осла; в русском «ослицы» звучит естественно и сохраняет эту деталь.
- source_word: לְקִישׁ
  choice: принадлежавшие Кису
  rationale: Предлог לְ в данном контексте выражает принадлежность.
- source_word: אֲבִי שָׁאוּל
  choice: отцу Саула
  rationale: 'Конструкция принадлежности передана естественным русским приложением: «Кису, отцу Саула».'
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная передача повествовательной формы глагола אמר.
- source_word: קַח נָא אִתְּךָ
  choice: Возьми, пожалуйста, с собой
  rationale: Частица נָא смягчает повеление и уместно передаётся словом «пожалуйста»; אִתְּךָ сохранено как «с собой».
- source_word: אַחַד מֵהַנְּעָרִים
  choice: одного из молодых людей
  rationale: נְעָרִים может обозначать молодых людей, слуг или сопровождающих. Основной текст сохраняет более буквальное и менее истолковательное значение, а возможная служебная роль отмечена в сноске.
- source_word: וְקוּם לֵךְ
  choice: встань и иди
  rationale: Сохранены оба последовательных повеления, выражающих готовность к немедленному действию.
- source_word: בַּקֵּשׁ
  choice: искать
  rationale: В контексте пропавших животных естественно означает «искать, разыскивать».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. «Тогда» естественно связывает два последовательных события, не вводя отдельного временного значения, отсутствующего в еврейском тексте. Формулировка «встань и иди искать» сохраняет последовательность трёх глагольных действий без архаического оттенка.
