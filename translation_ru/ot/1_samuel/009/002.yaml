base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/002.yaml
  text: And he had a son whose name was Saul[a], a young man and handsome. There was not a man among the sons of Israel more handsome than he[b]; from his shoulders upward he was taller than all the people.
translation:
  language: ru
  text: У него был сын по имени Саул — молодой и красивый. Среди сынов Израиля не было никого красивее его[a]. От плеч и выше он был выше всего народа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не было никого лучше него»; еврейское слово может выражать как красоту, так и более общую положительную оценку.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от плеча своего и выше он был выше всего народа».'
    reason: literal_rendering
lexical_decisions:
- source_word: בֵן
  choice: сын
  rationale: В данном семейном контексте речь идёт о сыне Киса; прямой русский эквивалент точно передаёт значение.
- source_word: וּשְׁמוֹ
  choice: по имени
  rationale: Естественно связывает упоминание сына с его именем, сохраняя смысл еврейского «и имя его».
- source_word: שָׁאוּל
  choice: Саул
  rationale: Употреблена традиционная русская библейская форма имени.
- source_word: בָּחוּר
  choice: молодой
  rationale: В сочетании с описательным прилагательным обозначает молодого мужчину; существительное «сын» позволяет по-русски естественно употребить краткое определение.
- source_word: טוֹב / וָטוֹב
  choice: красивый / красивее
  rationale: В контексте внешнего облика Саула слово указывает на привлекательность; сравнительная форма во втором случае сохраняет повтор исходного корня.
- source_word: וְאֵין אִישׁ מִבְּנֵי יִשְׂרָאֵל
  choice: Среди сынов Израиля не было никого
  rationale: Сохранён исходный образ «сынов Израиля», а отрицательное местоимение делает конструкцию естественной на современном русском.
- source_word: מִשִּׁכְמוֹ וָמַעְלָה
  choice: От плеч и выше
  rationale: Близко передаёт еврейское выражение, описывающее, насколько Саул превосходил остальных ростом.
- source_word: גָּבֹהַּ מִכָּל הָעָם
  choice: он возвышался над всем народом
  rationale: Передаёт сравнение по росту, сохраняя образное выражение оригинала без неестественного русского «был выше от плеч».
theological_decisions:
- issue: Оценочное или физическое значение טוֹב
  choice: красивый
  alternative: хороший / достойный
  rationale: Повторное сравнение и следующее указание на рост создают описание внешности Саула, однако более широкая положительная оценка слова отмечена в сноске.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Сохранено выражение «сыны Израиля» как заметная особенность исходного текста; громоздкая буквальная конструкция о росте передана естественным русским оборотом, а её форма приведена в сноске.
