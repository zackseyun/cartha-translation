  text: וַ/יִּגַּ֥שׁ שָׁא֛וּל אֶת שְׁמוּאֵ֖ל בְּ/ת֣וֹךְ הַ/שָּׁ֑עַר וַ/יֹּ֨אמֶר֙ הַגִּֽידָ/ה נָּ֣א לִ֔/י אֵי זֶ֖ה בֵּ֥ית הָ/רֹאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/018.yaml
  text: Then Saul approached Samuel in the midst of the gate and said[b][a], “Please tell me where the seer’s house is.”
translation:
  language: ru
  text: 'Саул подошёл к Самуилу в городских воротах и спросил: «Скажи мне, пожалуйста, где дом прозорливца[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Прозорливец» — более древнее название того, кого позднее обычно называли пророком; см. 1 Царств 9:9.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: подошёл
  rationale: Глагол נגשׁ обозначает приближение к кому-либо; «подошёл» естественно передаёт направленное движение Саула к Самуилу.
- source_word: בְּתוֹךְ הַשָּׁעַר
  choice: в городских воротах
  rationale: В данном контексте שַׁעַר может обозначать не только створ ворот, но и весь воротный проход или комплекс. Русское «в городских воротах» сохраняет пространственный смысл выражения и не создаёт ошибочного образа нахождения между створками.
- source_word: וַיֹּאמֶר
  choice: спросил
  rationale: Буквально — «сказал», однако последующая прямая речь представляет собой вопрос о местонахождении дома; «спросил» естественно выражает функцию реплики, не изменяя её содержания.
- source_word: הַגִּידָה נָּא לִי
  choice: Скажи мне, пожалуйста
  rationale: Императив הַגִּידָה с частицей вежливой просьбы נָא передаётся современным и учтивым русским оборотом.
- source_word: אֵי זֶה
  choice: где
  rationale: В контексте просьбы указать местонахождение сочетание имеет локативный смысл и естественно переводится вопросительным словом «где».
- source_word: בֵּית הָרֹאֶה
  choice: дом прозорливца
  rationale: רֹאֶה — древнее обозначение человека, получающего откровение от Бога; «прозорливец» сохраняет отличие этого термина от обычного слова «пророк» и соответствует пояснению повествователя в 1 Царств 9:9.
theological_decisions:
- issue: Передача названия רֹאֶה
  choice: прозорливец
  alternative: пророк; провидец
  rationale: Текст намеренно использует более древнее наименование и сам разъясняет его связь со словом «пророк» в 1 Царств 9:9. Поэтому терминологическое различие сохранено без привнесения дополнительных богословских толкований.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Вежливая просьба передана естественно; древний термин רֹאֶה сохранён и кратко пояснён в сноске.
