  text: הֵ֗מָּה עֹלִים֙ בְּ/מַעֲלֵ֣ה הָ/עִ֔יר וְ/הֵ֨מָּה֙ מָצְא֣וּ נְעָר֔וֹת יֹצְא֖וֹת לִ/שְׁאֹ֣ב מָ֑יִם וַ/יֹּאמְר֣וּ לָ/הֶ֔ן הֲ/יֵ֥שׁ בָּ/זֶ֖ה הָ/רֹאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/011.yaml
  text: As they were going up the ascent to the city[a], they found young women coming out to draw water, and they said to them, “Is the seer here?”
translation:
  language: ru
  text: 'Когда они поднимались по дороге к городу, то встретили девушек, вышедших набрать воды, и спросили их: «Есть ли здесь провидец[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пророк». В еврейском тексте буквально «видящий» — старинное название того, кого позднее стали называть пророком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלִים בְּמַעֲלֵה הָעִיר
  choice: поднимались по дороге к городу
  rationale: Причастие передаёт продолжающееся действие, а מַעֲלֶה — подъём или ведущую вверх дорогу. Такой перевод естественно передаёт и движение, и топографию.
- source_word: מָצְאוּ
  choice: встретили
  rationale: Основное значение — «нашли», но в данном дорожном эпизоде речь о встрече; «встретили» точнее и естественнее по-русски.
- source_word: נְעָרוֹת
  choice: девушек
  rationale: Слово обозначает молодых женщин; «девушки» — современное и нейтральное соответствие.
- source_word: יֹצְאוֹת לִשְׁאֹב מָיִם
  choice: вышедших набрать воды
  rationale: Причастие с инфинитивом выражает действие и его цель. «Набрать воды» естественно для ситуации у источника или колодца.
- source_word: הֲיֵשׁ בָּזֶה
  choice: Есть ли здесь
  rationale: Идиоматический вопрос о присутствии человека в данном месте.
- source_word: הָרֹאֶה
  choice: провидец
  rationale: Сохранён специальный старый термин «видящий», обозначающий того, кого позднее называли пророком; «провидец» звучит понятно и достаточно традиционно.
