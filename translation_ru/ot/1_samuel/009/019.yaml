base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/019.yaml
  text: Samuel answered Saul and said[a], “I am the seer. Go up before me to the high place, and eat with me today. In the morning I will send you on your way[b], and I will tell you all that is in your heart.”
translation:
  language: ru
  text: 'Самуил ответил Саулу: «Я и есть провидец[a]. Поднимись впереди меня на высоту. Сегодня вы[b] будете есть со мной. Утром я отпущу тебя в путь и расскажу тебе обо всём, что у тебя на сердце».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пророк». Здесь употреблено старинное название пророка — «провидец»; его поясняет 1 Цар. 9:9.'
    reason: alternative_reading
  - marker: b
    text: 'В еврейском тексте местоимение и глагол стоят во множественном числе: вероятно, речь идёт о Сауле вместе с его слугой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאֶה
  choice: провидец
  rationale: Слово буквально обозначает «видящего» и здесь служит старинным наименованием пророка (ср. 1 Цар. 9:9). «Провидец» сохраняет историческую лексику повествования, не подменяя её более общим словом «пророк».
- source_word: הַבָּמָה
  choice: высота
  rationale: Еврейское слово обозначает возвышенное культовое место. Традиционное библейское «высота» сохраняет пространственный и культовый оттенки, тогда как «святилище» было бы более истолковывающим переводом.
- source_word: עֲלֵה לְפָנַי
  choice: Поднимись впереди меня
  rationale: Передаёт как движение вверх к возвышенному месту, так и указание Саулу идти перед Самуилом, не уточняя сверх текста, должен ли он вести остальных.
- source_word: וַאֲכַלְתֶּם עִמִּי הַיּוֹם
  choice: Сегодня вы будете есть со мной
  rationale: Форма глагола стоит во втором лице множественного числа; русское «вы» ясно сохраняет это число и, вероятно, включает слугу Саула.
- source_word: וְשִׁלַּחְתִּיךָ
  choice: я отпущу тебя в путь
  rationale: В данном контексте глагол означает, что утром Самуил позволит Саулу отправиться дальше. Выражение естественно по-русски и не создаёт оттенка изгнания.
- source_word: וְכֹל אֲשֶׁר בִּלְבָבְךָ
  choice: обо всём, что у тебя на сердце
  rationale: Сохраняет еврейский образ сердца как средоточия мыслей, намерений и забот, не сводя значение только к рассудочной сфере.
- source_word: אַגִּיד לָךְ
  choice: расскажу тебе
  rationale: Естественно передаёт каузативное значение «сообщить, сделать известным» в контексте личной беседы.
theological_decisions:
- issue: Обозначение служения Самуила
  choice: провидец
  alternative: пророк
  rationale: Выбрано исторически маркированное слово самого отрывка; оно сохраняет связь с пояснением в 1 Цар. 9:9 и не вносит конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Реплика звучит естественно, но сохраняет ключевые образы и различие между единственным и множественным числом в обращении.
