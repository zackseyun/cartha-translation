base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/014.yaml
  text: So they went up to the city. As they were entering the city[a], behold, Samuel was coming out to meet them, to go up to the high place.
translation:
  language: ru
  text: Они поднялись к городу. Когда они входили в город[a], и вот, Самуил выходил им навстречу, чтобы подняться на высоту.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «посреди города»; также возможно: «внутри города».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ הָעִיר
  choice: И поднялись они к городу
  rationale: Глагол עלה передаёт движение вверх; «поднялись к городу» естественно сохраняет указание на подъём и направление движения.
- source_word: הֵמָּה בָּאִים
  choice: когда они входили
  rationale: Местоимение с причастием выражает продолжающееся действие; в контексте естественно имеется в виду их вход в город.
- source_word: בְּתוֹךְ הָעִיר
  choice: в город
  rationale: Буквально выражение означает «внутри/посреди города», но в сочетании с глаголом движения идиоматически указывает на вхождение в город; буквальная пространственная формулировка сохранена в сноске как возможная.
- source_word: וְהִנֵּה
  choice: не передано отдельным словом
  rationale: В современном русском «вот» здесь утяжеляло бы фразу; неожиданность встречи достаточно выражена одновременностью действий. Дискурсивная функция частицы передана структурой предложения.
- source_word: יֹצֵא לִקְרָאתָם
  choice: навстречу им выходил Самуил
  rationale: Причастие יֹצֵא обозначает действие в процессе, а לִקְרָאתָם — движение навстречу; русский порядок слов звучит естественно и сохраняет оба компонента.
- source_word: לַעֲלוֹת הַבָּמָה
  choice: чтобы подняться на высоту
  rationale: Инфинитив выражает цель, а במה обозначает культовое возвышенное место. «Высота» — традиционный и достаточно буквальный русский термин, не заменяющий историко-религиозное понятие толкованием.
theological_decisions:
- issue: Передача культового места הַבָּמָה
  choice: на высоту
  alternative: к святилищу на возвышенности
  rationale: «Высота» сохраняет отдельную историко-культовую категорию и не вносит в стих ни позднейшей отрицательной оценки таких мест, ни уточнения о характере сооружения, которого сам текст не даёт.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным тоном. Инверсия «поднялись они» поддерживает библейский ритм, оставаясь понятной; архаизмы и конфессионально окрашенные пояснения не используются.
