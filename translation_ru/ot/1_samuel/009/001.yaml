  yaml_path: translation/ot/1_samuel/009/001.yaml
  text: There was a man of Benjamin[a], and his name was Kish son of Abiel, son of Zeror, son of Becorath, son of Aphiah, son of a Benjaminite, a mighty man of valor.
translation:
  language: ru
  text: Был один человек из колена Вениамина по имени Кис, сын Авиила, сына Церора, сына Бехорафа, сына Афия, сына вениамитянина, человек влиятельный и состоятельный.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доблестный воин», «знатный человек» или «богатый и влиятельный человек». Еврейское выражение может указывать на воинскую доблесть, общественное положение или состоятельность — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Был
  rationale: Форма вводит новый повествовательный эпизод; русское «Был» естественно начинает рассказ без добавления отсутствующего в оригинале временного наречия.
- source_word: אִישׁ מִבֶּן־יָמִין
  choice: один человек из колена Вениамина
  rationale: Оборот указывает на племенную принадлежность. Добавление «колена» делает смысл ясным современному русскому читателю, не меняя содержания.
- source_word: וּשְׁמוֹ קִישׁ
  choice: по имени Кис
  rationale: Естественная русская передача еврейской формулы именования; имя дано в традиционной русской библейской форме.
- source_word: בֶּן ... בֶּן ...
  choice: сын ... сына ...
  rationale: Сохранена цепочка родословия; после первого звена русский родительный падеж ясно связывает каждого названного с предыдущим.
- source_word: אֲבִיאֵל / צְרוֹר / בְּכוֹרַת / אֲפִיחַ
  choice: Авиил / Церор / Бехораф / Афия
  rationale: Имена переданы в формах, согласующихся с устоявшейся русской библейской традицией.
- source_word: בֶּן־אִישׁ יְמִינִי
  choice: вениамитянин
  rationale: Заключительное определение естественно понимать как указание на принадлежность родовой линии к Вениамину; буквальное повторение «сын человека-вениамитянина» по-русски тяжеловесно и может вводить в заблуждение.
- source_word: גִּבּוֹר חָיִל
  choice: человек влиятельный и состоятельный
  rationale: Широкое выражение может обозначать воинскую доблесть, силу, состоятельность или высокое общественное положение. В контексте представления семьи Киса вероятен социально-экономический оттенок, но неоднозначность отмечена в сноске.
