source:
  edition: WLC
  text: כְּ/בֹאֲ/כֶ֣ם הָ/עִ֣יר כֵּ֣ן תִּמְצְא֣וּ/ן אֹת֡/וֹ בְּ/טֶרֶם֩ יַעֲלֶ֨ה הַ/בָּמָ֜תָ/ה לֶ/אֱכֹ֗ל כִּ֠י לֹֽא יֹאכַ֤ל הָ/עָם֙ עַד בֹּא֔/וֹ כִּֽי הוּא֙ יְבָרֵ֣ךְ הַ/זֶּ֔בַח אַחֲרֵי כֵ֖ן יֹאכְל֣וּ הַ/קְּרֻאִ֑ים וְ/עַתָּ֣ה עֲל֔וּ כִּֽי אֹת֥/וֹ כְ/הַ/יּ֖וֹם תִּמְצְא֥וּ/ן אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/013.yaml
  text: As soon as you enter the city[a], you will find him, before he goes up to the high place to eat. For the people will not eat until he comes, because he is the one who blesses the sacrifice; afterward those who are invited eat. So go up now[c][b], for today you will find him.
translation:
  language: ru
  text: 'Как только войдёте в город, вы найдёте его, прежде чем он поднимется на высоту[a], чтобы поесть. Народ не станет есть до его прихода, потому что именно он благословляет жертву[b]; после этого едят приглашённые. А теперь поднимайтесь: сегодня[c] вы его найдёте.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Высота» — возвышенное место поклонения, где приносили жертвы и устраивали жертвенные трапезы.
    reason: cultural_note
  - marker: b
    text: Вероятно, имеется в виду благословение, произносимое перед жертвенной трапезой, после которого приглашённые начинали есть.
    reason: cultural_note
  - marker: c
    text: 'Или: «именно сейчас», «в это время». Еврейское כְהַיּוֹם может здесь подчёркивать непосредственность, а не только календарный день.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹאֲכֶם הָעִיר
  choice: Как только войдёте в город
  rationale: Конструкция с כְּ и инфинитивом выражает время; «как только» естественно передаёт непосредственность, уместную в контексте.
- source_word: כֵּן תִּמְצְאוּן אֹתוֹ
  choice: вы найдёте его
  rationale: כֵּן усиливает уверенность или непосредственность результата; по-русски это достаточно ясно из всей конструкции и не требует отдельного наречия.
- source_word: בְּטֶרֶם יַעֲלֶה הַבָּמָתָה
  choice: прежде чем он поднимется на высоту
  rationale: Сохранены временное значение בטרם, направленность עלה вверх и прямое культовое обозначение במה.
- source_word: לֶאֱכֹל
  choice: чтобы поесть
  rationale: Прямо и естественно передаёт цель восхождения, не сводя значение заранее к ритуальной трапезе.
- source_word: לֹא יֹאכַל הָעָם עַד בֹּאוֹ
  choice: Народ не станет есть до его прихода
  rationale: Будущее ожидание в данном контексте естественно выражается оборотом «не станет есть»; инфинитив с суффиксом передан именным оборотом.
- source_word: כִּי הוּא יְבָרֵךְ הַזֶּבַח
  choice: потому что именно он благословляет жертву
  rationale: «Именно он» сохраняет эмфатическое הוּא, а «благословляет жертву» не устраняет возможную неоднозначность между жертвой и связанной с ней трапезой.
- source_word: אַחֲרֵי כֵן יֹאכְלוּ הַקְּרֻאִים
  choice: после этого едят приглашённые
  rationale: Сохраняются последовательность событий и буквальное значение пассивного причастия «приглашённые».
- source_word: וְעַתָּה עֲלוּ
  choice: А теперь поднимайтесь
  rationale: Передаёт переход к побуждению и сохраняет направленность движения вверх.
- source_word: כְהַיּוֹם תִּמְצְאוּן אֹתוֹ
  choice: именно сейчас вы его найдёте
  rationale: Редкое выражение כְהַיּוֹם в контексте подчёркивает непосредственность встречи; «именно сейчас» сохраняет этот оттенок, а вариант «сегодня» отмечен в сноске.
theological_decisions:
- issue: Характер благословения жертвы
  choice: В основном тексте оставлено «благословляет жертву».
  alternative: «Произносит благословение перед жертвенной трапезой».
  rationale: Еврейский текст прямо говорит о благословении жертвы, тогда как более развёрнутый вариант истолковывает ритуальное действие; пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис сделан ясным для обычного читателя; культовые реалии не заменены конфессионально окрашенными терминами и пояснены в сносках.
