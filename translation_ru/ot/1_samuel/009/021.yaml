  text: וַ/יַּ֨עַן שָׁא֜וּל וַ/יֹּ֗אמֶר הֲ/ל֨וֹא בֶן יְמִינִ֤י אָ֨נֹכִי֙ מִ/קַּטַנֵּי֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וּ/מִשְׁפַּחְתִּ/י֙ הַ/צְּעִרָ֔ה מִ/כָּֽל מִשְׁפְּח֖וֹת שִׁבְטֵ֣י בִנְיָמִ֑ן וְ/לָ֨/מָּה֙ דִּבַּ֣רְתָּ אֵלַ֔/י כַּ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/021.yaml
  text: Saul answered and said[a], “Am I not a Benjaminite, from the smallest of the tribes of Israel? And is not my clan the least of all the clans of the tribe of Benjamin? So why have you spoken to me in this way?”
translation:
  language: ru
  text: 'Саул ответил: «Разве я не вениамит, из одного из самых малых колен Израиля? И разве мой род не самый малый среди всех родов колена Вениамина? Почему же ты сказал мне такое[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Почему же ты сказал мне так?»'
    reason: Выражение כַּדָּבָר הַזֶּה может относиться как к содержанию слов — «сказал такое», так и к способу обращения — «сказал мне так».
lexical_decisions:
- source_word: וַיַּעַן שָׁאוּל וַיֹּאמֶר
  choice: Саул ответил
  rationale: Буквальное сочетание «ответил и сказал» является обычной древнееврейской формулой введения речи; в современном русском её естественно передаёт глагол «ответил».
- source_word: הֲלוֹא בֶן־יְמִינִי אָנֹכִי
  choice: Разве я не вениамит
  rationale: הֲלוֹא вводит риторический вопрос, предполагающий утвердительный ответ, а בֶן־יְמִינִי обозначает принадлежность к колену Вениамина.
- source_word: מִקַּטַנֵּי שִׁבְטֵי יִשְׂרָאֵל
  choice: из одного из самых малых колен Израиля
  rationale: Форма допускает понимание Вениамина как одного из малых колен; такая передача сохраняет оттенок сравнительной малости и не утверждает однозначно, что оно было единственным наименьшим коленом.
- source_word: מִשְׁפַּחְתִּי
  choice: мой род
  rationale: מִשְׁפָּחָה здесь означает родовую группу внутри колена, более широкую, чем отдельная семья; русское «род» естественно передаёт этот общественный уровень.
- source_word: הַצְּעִרָה
  choice: самый малый
  rationale: Прилагательное может обозначать малость как по численности, так и по положению. «Самый малый» сохраняет эту смысловую открытость без добавления явной оценки «незначительный».
- source_word: מִכָּל מִשְׁפְּחוֹת שִׁבְטֵי בִנְיָמִן
  choice: среди всех родов колена Вениамина
  rationale: Хотя в масоретском тексте стоит формально множественное שִׁבְטֵי, по контексту речь идёт о родах внутри одного колена Вениамина; русский перевод устраняет вводящее в заблуждение выражение «колен Вениамина».
- source_word: וְלָמָּה
  choice: Почему же
  rationale: Частица «же» естественно выражает вывод из предшествующих слов Саула о малости его колена и рода.
- source_word: דִּבַּרְתָּ אֵלַי כַּדָּבָר הַזֶּה
  choice: ты сказал мне такое
  rationale: Фраза может указывать на содержание сказанного либо на характер обращения. Основной вариант передаёт содержание удививших Саула слов и звучит естественно по-русски; альтернативный оттенок отмечен в сноске.
