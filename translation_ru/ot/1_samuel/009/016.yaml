base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/016.yaml
  text: About this time tomorrow I will send to you a man from the land of Benjamin[a], and you shall anoint him as ruler over my people Israel. He will save my people from the hand of the Philistines, for I have seen my people[b], because their cry has come to me.
translation:
  language: ru
  text: Завтра, примерно в это время, Я пошлю к тебе человека из земли Вениамина, и ты помажешь его правителем[a] над Моим народом Израилем. Он спасёт Мой народ от руки филистимлян, ибо Я увидел Мой народ, ибо его[b] вопль дошёл до Меня».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское наги́д можно также перевести как «вождь» или, традиционно, «князь». Здесь это поставленный управлять народом человек, а не просто почётная фигура.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально в еврейском тексте: «его вопль»; местоимение в единственном числе относится к собирательному существительному «народ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת מָחָר
  choice: Завтра, примерно в это время
  rationale: Передаёт указание на приблизительно тот же час следующего дня естественным современным русским языком.
- source_word: אֶשְׁלַח אֵלֶיךָ
  choice: Я пошлю к тебе
  rationale: Сохраняет направленность действия, выраженную предлогом אֶל.
- source_word: מֵאֶרֶץ בִּנְיָמִן
  choice: из земли Вениамина
  rationale: Сохраняет географическое значение אֶרֶץ и не сводит выражение только к названию племени.
- source_word: וּמְשַׁחְתּוֹ
  choice: Ты помажешь его
  rationale: В данном божественном обращении форма выражает предписанное Самуилу последующее действие; русское будущее время естественно передаёт и предсказание, и обязательность поручения.
- source_word: לְנָגִיד
  choice: правителем
  rationale: נָגִיד обозначает поставленного управлять и вести народ; «правитель» передаёт властные полномочия, не отождествляя термин безоговорочно с титулом царя.
- source_word: וְהוֹשִׁיעַ
  choice: и он спасёт
  rationale: Передаёт будущее избавление Израиля через назначенного вождя, сохраняя основное значение корня יָשַׁע.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: от руки филистимлян
  rationale: Сохраняет понятный библейский образ руки как власти и силы.
- source_word: כִּי רָאִיתִי אֶת עַמִּי
  choice: Ведь Я увидел Мой народ
  rationale: Сохраняет прямую формулировку масоретского текста и причинную связь, не разворачивая глагол в истолкование вроде «обратил внимание».
- source_word: כִּי בָּאָה צַעֲקָתוֹ אֵלָי
  choice: потому что вопль его дошёл до Меня
  rationale: Сохраняет грамматическое единственное число суффикса, естественно соотнося местоимение с собирательным существительным «народ».
theological_decisions:
- issue: Значение נָגִיד применительно к служению Саула
  choice: правитель
  alternative: вождь; князь; царь
  rationale: «Правитель» отражает данную Богом власть над Израилем, но не вносит в этот термин более узкое обозначение царского титула; «князь» в современном русском способен создать неверное представление о наследственном ранге.
- issue: Грамматическое число в צַעֲקָתוֹ
  choice: вопль его
  alternative: их вопль
  rationale: Единственное число в русском естественно согласуется с собирательным словом «народ» и одновременно сохраняет форму еврейского текста.
- issue: Смысл רָאִיתִי в Божьем ответе на вопль народа
  choice: Я увидел Мой народ
  alternative: Я призрел на Мой народ; Я увидел бедствие Моего народа
  rationale: Перевод сохраняет формальную и богословскую напряжённость исходного выражения и не добавляет отсутствующее в масоретском тексте слово «бедствие».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Заглавные буквы в местоимениях, относящихся к Богу, следуют принятой русской религиозно-издательской практике. Образ «от руки» сохранён как ясная и укоренённая библейская метафора.
