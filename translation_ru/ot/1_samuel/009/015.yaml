lexical_decisions:
- source_word: וַיהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве»; начальный waw не требует отдельного русского союза в данном контексте.
- source_word: גָּלָה אֶת־אֹזֶן שְׁמוּאֵל
  choice: открыл Самуилу
  rationale: Буквально «открыл ухо Самуила» — еврейская идиома со значением сообщить или открыть кому-либо нечто. Естественный русский оборот сохраняет смысл, а буквальный образ отмечен в сноске.
- source_word: יוֹם אֶחָד לִפְנֵי בּוֹא שָׁאוּל
  choice: за день до прихода Саула
  rationale: Русская временная конструкция точно и естественно передаёт сочетание «один день перед приходом Саула».
- source_word: לֵאמֹר
  choice: 'сказав:'
  rationale: Традиционный и ясный способ ввести следующую далее прямую речь.
theological_decisions:
