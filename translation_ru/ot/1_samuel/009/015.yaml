  choice: Яхве
  alternative: Господь
  rationale: Передача «Яхве» сохраняет личное заветное имя, прямо представленное тетраграмматоном в еврейском тексте, и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык; повествовательная фраза построена естественно, при этом переход к прямой речи и исходная идиома сохранены соответственно в тексте и сноске.
