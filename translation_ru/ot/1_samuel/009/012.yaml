base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/012.yaml
  text: They answered them and said[a], “Yes, look—he is just ahead of you. Hurry now, because he came to the city today[b], because today there is a sacrifice for the people at the high place.”
translation:
  language: ru
  text: 'Они ответили им и сказали: «Да, вот он впереди тебя.[a] Поспеши же: ведь он сегодня пришёл в город, потому что сегодня для народа совершается жертвоприношение на высоте[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально сочетание можно передать: «Есть; вот перед тобой». Здесь оно служит утвердительным ответом и указывает, что Самуил находится впереди.'
    reason: lexical_alternative
  - marker: b
    text: «Высота» — местное место поклонения, обычно располагавшееся на возвышенности; здесь там приносили жертву.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעֲנֶינָה אוֹתָם וַתֹּאמַרְנָה
  choice: Они ответили им и сказали
  rationale: Сохранена характерная для еврейского повествования парная формула «ответили… и сказали». Формы глаголов указывают на подлежащее женского рода во множественном числе, но имя «девушки» не внесено из контекста в сам стих.
- source_word: יֵשׁ הִנֵּה לְפָנֶיךָ
  choice: Да, вот он впереди тебя
  rationale: יֵשׁ в ответе выполняет утвердительную функцию, הִנֵּה привлекает внимание, а לְפָנֶיךָ обозначает нахождение впереди собеседника. Единственное число «тебя» отражает форму древнееврейского текста.
- source_word: מַהֵר עַתָּה
  choice: Поспеши же
  rationale: Императив передаёт настоятельность, а частица «же» естественно выражает усиление, заключённое в עַתָּה («теперь, сейчас»), без архаичного оборота.
- source_word: כִּי הַיּוֹם בָּא לָעִיר
  choice: потому что он сегодня пришёл в город
  rationale: Перфект בָּא передан прошедшим временем как совершившееся в этот день прибытие; כִּי сохраняет объяснительную связь с призывом поспешить.
- source_word: כִּי זֶבַח הַיּוֹם לָעָם
  choice: сегодня для народа совершается жертвоприношение
  rationale: זֶבַח обозначает жертву или жертвоприношение. Формулировка не уточняет подразумеваемую совместную трапезу и сохраняет значение לָעָם — «для народа».
- source_word: בַּבָּמָה
  choice: на высоте
  rationale: בָּמָה — возвышенное местное место поклонения. Традиционный русский термин «высота» сохраняет историко-культовое значение и не добавляет отрицательной оценки.
theological_decisions:
- issue: Значение בָּמָה в контексте жертвоприношения до построения храма
  choice: на высоте
  alternative: в святилище на возвышенности
  rationale: Краткий термин сохраняет культурно-религиозную специфику оригинала, не представляя это место ни как непременно осуждаемое языческое капище, ни как более поздний храм.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским достоинством. Сохранены повтор «сегодня» и формула «ответили… и сказали», поскольку они заметны в еврейском тексте; синтаксис слегка упорядочен для естественного русского звучания.
