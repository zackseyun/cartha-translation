  text: וַ/יֹּ֣אמֶר ל֗/וֹ הִנֵּה נָ֤א אִישׁ אֱלֹהִים֙ בָּ/עִ֣יר הַ/זֹּ֔את וְ/הָ/אִ֣ישׁ נִכְבָּ֔ד כֹּ֥ל אֲשֶׁר יְדַבֵּ֖ר בּ֣וֹא יָב֑וֹא עַתָּה֙ נֵ֣לֲכָה שָּׁ֔ם אוּלַי֙ יַגִּ֣יד לָ֔/נוּ אֶת דַּרְכֵּ֖/נוּ אֲשֶׁר הָלַ֥כְנוּ עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/006.yaml
  text: He said to him, “Look now, there is a man of God in this city, and the man is held in honor; everything that he says surely comes to pass. Now let us go there. Perhaps he will tell us the way we should go.”
translation:
  language: ru
  text: 'Он сказал ему: «Вот, в этом городе есть человек Божий. Это уважаемый человек: всё, что он говорит, непременно сбывается. Пойдём теперь туда. Может быть, он укажет нам путь, по которому нам идти».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «расскажет нам о нашем пути, по которому мы пошли». Возможно также: «скажет нам, как продолжить наш путь».'
    reason: Еврейская заключительная фраза содержит форму прошедшего времени и допускает понимание как уже предпринятого пути, так и дальнейшего направления.
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: человек Божий
  rationale: Устойчивое и понятное библейское обозначение пророка или Божьего посланника; сохраняет форму и смысл еврейского выражения.
- source_word: נִכְבָּד
  choice: уважаемый
  rationale: Передаёт значение почитаемого, пользующегося признанием человека естественным современным русским словом.
- source_word: בּוֹא יָבוֹא
  choice: непременно сбывается
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает достоверность исполнения сказанного; «непременно» передаёт это усиление.
- source_word: יַגִּיד לָנוּ אֶת דַּרְכֵּנוּ
  choice: укажет нам путь
  rationale: Глагол буквально означает «сообщит, расскажет», однако в сочетании с «путём» по-русски естественно «укажет путь»; речь идёт о получении направления для дальнейшего пути.
theological_decisions:
- issue: Значение выражения «человек Божий»
  choice: Сохранено традиционное обозначение без пояснения в основном тексте.
  alternative: «Божий пророк»
  rationale: В контексте речь действительно идёт о Самуиле, однако слово «пророк» в этом стихе не употреблено; его добавление сняло бы различие между исходными обозначениями.
- issue: Исполнение слов человека Божьего
  choice: «всё, что он говорит, непременно сбывается»
  alternative: «каждое его слово непременно исполняется»
  rationale: Выбранный вариант точно передаёт утверждение слуги о надёжности слов пророка, не вводя дополнительных богословских пояснений.
- issue: Неясная временная форма в заключительной фразе
  choice: «путь, по которому нам идти» с примечанием
  alternative: Буквальное «наш путь, по которому мы пошли»
  rationale: Еврейская фраза необычна и буквально оглядывается на уже предпринятый путь, но по контексту просьба касается указания, как продолжить поиски. Основной текст передаёт контекстуальный смысл, а примечание сохраняет формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Короткие предложения делают реплику слуги ясной и естественной, а «человек Божий» сохраняет достоинство и терминологическую преемственность.
