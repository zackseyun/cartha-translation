lexical_decisions:
- source_word: טַּבָּח
  choice: повару
  rationale: В контексте жертвенной трапезы речь идёт о человеке, который готовил и подавал мясо; «повар» естественнее русского «мясник» и соответствует непосредственной ситуации.
- source_word: תְּנָה
  choice: Подай
  rationale: Буквально глагол означает «дай», но здесь Самуил велит подать к столу заранее сохранённую часть; «подай» точно и естественно передаёт контекстуальный смысл.
- source_word: הַמָּנָה
  choice: ту часть
  rationale: Слово обозначает выделенную долю еды. «Часть» сохраняет смысл назначенной доли и хорошо согласуется с последующим уточнением.
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: которую я передал тебе
  rationale: «Передал» сохраняет основной смысл נתן и яснее показывает, что Самуил ранее отдал эту часть повару на хранение, а не подарил ему её.
- source_word: אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: о которой сказал
  rationale: Передаёт повторное относительное предложение и его связь с выделенной частью без неестественной для русского речи конструкции.
- source_word: שִׂים אֹתָהּ עִמָּךְ
  choice: Оставь её у себя
  rationale: Еврейское выражение буквально говорит о помещении предмета «при себе»; в данном контексте оно означает сохранить часть до нужного времени. Формулировка сохраняет образ и звучит естественно.
