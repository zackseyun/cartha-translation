  text: Then Samuel said to the cook[a], “Bring the portion that I gave you, of which I said to you, ‘Set it aside with you.’”
translation:
  language: ru
  text: 'Тогда Самуил сказал повару[a]: «Подай ту часть, которую я дал тебе, о которой я сказал тебе: „Оставь её у себя“».'
  philosophy: optimal-equivalence
  footnotes:
