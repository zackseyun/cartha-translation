translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Синтаксис близок к еврейскому оригиналу, но устранена неестественная для русского буквальность. Прямая речь внутри прямой речи оформлена русскими кавычками второго уровня.
