base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/027.yaml
  text: As they were going down to the edge of the city[a], Samuel said to Saul, “Tell the young man to go on ahead of us.” And he went on ahead. “But you, stand here now[b], and I will let you hear the word of God.”
translation:
  language: ru
  text: 'Когда они спускались к краю города, Самуил сказал Саулу: «Скажи слуге[a], чтобы он пошёл впереди нас». И тот пошёл вперёд. «А ты остановись здесь сейчас[b], и я возвещу тебе слово Бога».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «юноше». Еврейское נַעַר может означать юношу, молодого человека, сопровождающего или слугу.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение буквально близко к «стой сейчас» или «стой в это время»; по смыслу Самуил велит Саулу остановиться и пока остаться на месте.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרְדִים
  choice: спускались
  rationale: Причастие описывает продолжающееся действие; несовершенный вид естественно передаёт его в русском повествовании.
- source_word: בִּקְצֵה הָעִיר
  choice: к краю города
  rationale: קָצֶה обозначает край или оконечность; этот вариант точен и менее интерпретативен, чем «к окраине».
- source_word: אֱמֹר לַנַּעַר
  choice: скажи слуге
  rationale: נַעַר может означать юношу, молодого человека или слугу. В данном контексте речь идёт о сопровождающем Саула слуге; неоднозначность отмечена в сноске.
- source_word: וְיַעֲבֹר לְפָנֵינוּ
  choice: чтобы он прошёл вперёд нас
  rationale: Передаёт движение вперёд, перед Самуилом и Саулом, сохраняя образ еврейского выражения.
- source_word: וַיַּעֲבֹר
  choice: и тот прошёл вперёд
  rationale: Последовательная повествовательная форма сообщает об исполнении приказа; местоимение «тот» ясно отсылает к слуге.
- source_word: עֲמֹד כַּיּוֹם
  choice: остановись здесь сейчас
  rationale: Трудное идиоматическое выражение буквально связано с настоящим временем; в контексте это приказ остановиться и ненадолго остаться на месте.
- source_word: וְאַשְׁמִיעֲךָ
  choice: я дам тебе услышать
  rationale: Сохраняет каузативное значение породы hифиль — «сделаю так, чтобы ты услышал», не заменяя его более толковательным «возвещу».
- source_word: דְּבַר אֱלֹהִים
  choice: слово Бога
  rationale: Традиционно и прозрачно передаёт пророческую формулу, сохраняя её вес и не уточняя заранее содержание откровения.
theological_decisions:
- issue: Передача пророческой формулы דְּבַר אֱלֹהִים
  choice: слово Бога
  alternative: весть Бога
  rationale: «Слово Бога» сохраняет богословскую и пророческую насыщенность выражения, тогда как «весть» сильнее сужает значение דָּבָר.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан естественным, но каузативный оттенок «дам тебе услышать» и пророческая формула «слово Бога» сохранены.
