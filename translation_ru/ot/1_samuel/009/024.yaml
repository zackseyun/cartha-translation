base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/024.yaml
  text: So the cook took up the leg and what was on it and set it before Saul[a]. And he said, “Look, what has been kept is set before you. Eat, because it was kept for you for the appointed time, from when I said[d][c][b], ‘I have invited the people.’” So Saul ate with Samuel that day.
translation:
  language: ru
  text: 'Повар взял ногу[a] и то, что было на ней[b], и положил перед Саулом. И он сказал: «Вот то, что было сохранено[c]. Поставь это перед собой и ешь, потому что это сохранили для тебя к назначенному времени, когда я сказал: „Я пригласил народ[d]“». И в тот день Саул ел вместе с Самуилом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедро»; еврейское שׁוֹק обозначает часть ноги животного.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «нога и то, что было на ней». Что именно сопровождало эту часть мяса, в тексте не уточняется.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «то, что осталось». Еврейское слово может означать как остаток, так и специально сохранённую часть; контекст указывает на долю, заранее отложенную для Саула.'
    reason: alternative_reading
  - marker: d
    text: 'Или: «Я созвал народ». В контексте трапезы глагол, вероятно, означает «пригласил».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטַּבָּח
  choice: повар
  rationale: В контексте жертвенной трапезы речь идёт о человеке, который готовит и подаёт мясо; «повар» естественнее русского «мясник».
- source_word: הַשּׁוֹק
  choice: голень
  rationale: Слово обозначает часть ноги животного. «Голень» сохраняет анатомическую конкретность, не отождествляя её без достаточных оснований с бедром.
- source_word: וְהֶעָלֶיהָ
  choice: и то, что было на ней
  rationale: Еврейский текст не называет сопровождавшую голень часть, поэтому перевод не уточняет её предположительный вид.
- source_word: הַנִּשְׁאָר
  choice: часть, которую сохранили
  rationale: Форма может обозначать как оставшуюся, так и специально отложенную часть; контекст поддерживает значение заранее сохранённой доли.
- source_word: שִׂים לְפָנֶיךָ
  choice: она перед тобой
  rationale: Буквально здесь стоит повеление «положи перед собой», но непосредственно перед этим повар уже поставил мясо перед Саулом. Естественная русская формулировка передаёт прагматический смысл приглашения принять поданную часть.
- source_word: לַמּוֹעֵד
  choice: к назначенному времени
  rationale: Перевод сохраняет смысл заранее определённого времени или случая, не превращая слово в специальное обозначение праздника.
- source_word: שָׁמוּר לְךָ
  choice: её сберегли для тебя
  rationale: Страдательное причастие указывает на заранее сохранённую для Саула часть; «сберегли» естественно выражает целенаправленность действия.
- source_word: לֵאמֹר הָעָם קָרָאתִי
  choice: 'с тех пор как я сказал: «Я пригласил народ»'
  rationale: Сжатая еврейская конструкция передана как временная связь с прежним распоряжением; в контексте общей трапезы קרא означает приглашение.
- source_word: עִם שְׁמוּאֵל
  choice: вместе с Самуилом
  rationale: Прямо передаёт совместное участие Саула и Самуила в трапезе.
