  - severity: medium
    issue: «С тех пор как я сказал» искажает временно-целевую связь фразы о сохранённой доле.
    rationale: לַמּוֹעֵד обозначает назначенное время/случай; «с тех пор как» вводит длительность от прошлого момента, которой текст явно не выражает. «К назначенному времени, когда я сказал» передаёт связь без такого добавления.
  - severity: low
