  text: When they came down from the high place into the city[a], he spoke with Saul on the roof.
translation:
  language: ru
  text: Когда они спустились с высоты в город, Самуил разговаривал с Саулом на крыше.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: Когда они спустились
  rationale: Форма продолжает повествовательную последовательность; придаточное с «когда» естественно связывает действие множественного числа с последующим глаголом единственного числа, не устраняя самого перехода.
- source_word: מֵהַבָּמָה
  choice: с высоты
  rationale: בָּמָה обозначает культовую возвышенность, где совершалось жертвоприношение. Традиционное русское «высота» сохраняет пространственный и культовый оттенки без уточнения «святилище», которого прямо нет в тексте.
- source_word: הָעִיר
  choice: в город
  rationale: При глаголе движения сочетание естественно передаёт спуск с высоты в город.
- source_word: וַיְדַבֵּר
  choice: Самуил разговаривал
  rationale: Еврейский глагол стоит в единственном числе; имя Самуила восстановлено из ближайшего контекста ради ясности по-русски. «Разговаривал» в сочетании с עִם передаёт общение с собеседником, а не только одностороннее обращение.
- source_word: עִם שָׁאוּל
  choice: с Саулом
  rationale: Предлог עִם обычно означает «с» и допускает смысл беседы, а не исключительно речи, обращённой к Саулу.
- source_word: עַל הַגָּג
  choice: на крыше
  rationale: גָּג здесь означает плоскую крышу дома; «на крыше» — ясное и естественное современное выражение.
