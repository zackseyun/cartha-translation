source:
  edition: WLC
  text: וְ/לָ/אֲתֹנ֞וֹת הָ/אֹבְד֣וֹת לְ/ךָ֗ הַ/יּוֹם֙ שְׁלֹ֣שֶׁת הַ/יָּמִ֔ים אַל תָּ֧שֶׂם אֶֽת לִבְּ/ךָ֛ לָ/הֶ֖ם כִּ֣י נִמְצָ֑אוּ וּ/לְ/מִי֙ כָּל חֶמְדַּ֣ת יִשְׂרָאֵ֔ל הֲ/ל֣וֹא לְ/ךָ֔ וּ/לְ/כֹ֖ל בֵּ֥ית אָבִֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/020.yaml
  text: And as for the donkeys that were lost to you three days ago[a], do not set your heart on them, for they have been found[b]. And for whom is all the desire of Israel? Is it not for you and for all your father's house?
translation:
  language: ru
  text: 'А об ослицах, которые пропали у тебя три дня назад, не беспокойся: они нашлись. И к кому обращено всё желание Израиля?[a] Не к тебе ли и ко всему дому твоего отца?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «И кому принадлежит всё желанное в Израиле?» Еврейское выражение может означать как то, чего желает Израиль, так и всё ценное, желанное в Израиле.'
    reason: lexical_alternative
  - marker: b
    text: «Дом отца» — родовое обозначение семьи и рода, более широкое, чем ближайшие домашние.
    reason: cultural_note
lexical_decisions:
- source_word: אֲתֹנוֹת
  choice: ослицы
  rationale: Еврейское существительное обозначает именно самок осла; в русском это можно передать естественно и без громоздкости.
- source_word: הָאֹבְדוֹת
  choice: которые пропали
  rationale: Передаёт состояние исчезнувших животных естественным современным русским выражением.
- source_word: הַיּוֹם שְׁלֹשֶׁת הַיָּמִים
  choice: три дня назад
  rationale: Идиоматически передаёт еврейское обозначение времени без буквального и неясного «сегодня три дня».
- source_word: אַל תָּשֶׂם אֶת־לִבְּךָ לָהֶם
  choice: не беспокойся о них
  rationale: Естественно выражает смысл еврейской идиомы «не полагай/направляй к ним своё сердце», то есть не сосредоточивай на них тревожное внимание.
- source_word: נִמְצָאוּ
  choice: они нашлись
  rationale: 'Кратко и естественно передаёт пассивно-результативный смысл: пропавшие ослицы уже найдены.'
- source_word: וּלְמִי כָּל חֶמְדַּת יִשְׂרָאֵל
  choice: И к кому обращено всё желание Израиля?
  rationale: Сохраняет возвышенную риторическую форму и основное прочтение חֶמְדַּת как «желание», не добавляя прямо отсутствующего в стихе слова «царство»; лексическая двусмысленность отмечена в сноске.
- source_word: הֲלוֹא
  choice: Не ... ли
  rationale: Сохраняет риторический вопрос, предполагающий утвердительный ответ.
- source_word: לְךָ וּלְכֹל בֵּית אָבִיךָ
  choice: к тебе ... и ко всему дому твоего отца
  rationale: Сохраняет библейское родовое выражение «дом отца», которое шире современной нуклеарной семьи.
theological_decisions:
- issue: Смысл слов Самуила о «желании Израиля»
  choice: Сохранить возвышенное и неоднозначное указание на Саула и дом его отца как на объект устремлений Израиля.
  alternative: Понять фразу как прямое указание на желанную Израилем царскую власть либо как утверждение, что всё ценное в Израиле предназначено Саулу.
  rationale: В контексте речь подводит к избранию Саула, однако сам стих не называет царскую власть прямо. Перевод не должен устранять заложенную в חֶמְדַּת смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном. Начальное «А об ослицах» естественно передаёт тематическую конструкцию оригинала; буквальная сердечная идиома заменена ясным «не беспокойся». Маркеры сносок поставлены непосредственно при тех выражениях, которые они поясняют.
