  yaml_path: translation/ot/1_samuel/009/017.yaml
  text: When Samuel saw Saul[a], Yahweh answered him, “Look, this is the man of whom I spoke to you. This one shall rule over my people.”
translation:
  language: ru
  text: 'Когда Самуил увидел Саула, Яхве ответил ему: «Вот человек, о котором Я говорил тебе. Именно он будет управлять Моим народом[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Он будет сдерживать (обуздывать) Мой народ». Еврейский глагол может означать «удерживать», «сдерживать», «обуздывать», а в данном контексте — «управлять».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: увидел
  rationale: Обычное значение глагола зрительного восприятия; естественно передаёт последовательность повествования.
- source_word: וַיהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога.
- source_word: עָנָהוּ
  choice: ответил ему
  rationale: Сохраняет основное значение ענה «отвечать, откликаться», хотя непосредственный вопрос в этом стихе не приведён.
- source_word: הִנֵּה
  choice: вот
  rationale: Современный и естественный русский указательный эквивалент, привлекающий внимание к Саулу.
- source_word: הָאִישׁ אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: человек, о котором Я говорил тебе
  rationale: Естественно передаёт определённое существительное и относительное придаточное, отсылающее к прежнему Божьему сообщению.
- source_word: זֶה
  choice: он
  rationale: В отдельном русском предложении местоимение естественно передаёт повторное указание на названного человека; указательная сила уже выражена словом «вот».
- source_word: יַעְצֹר בְּעַמִּי
  choice: будет управлять Моим народом
  rationale: В контексте назначения Саула на царское руководство глагол означает осуществление власти и контроля; более буквальный оттенок удерживания или обуздания сохранён в примечании.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя без замены титулом.
- issue: Значение יַעְצֹר применительно к Саулу
  choice: будет управлять Моим народом
  alternative: будет сдерживать / обуздывать Мой народ
  rationale: Царский контекст указывает на управление и властный контроль, однако присущая глаголу неоднозначность не устраняется и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и достойным библейским регистром. Заглавные буквы в местоимениях Бога следуют принятой русской библейской традиции.
