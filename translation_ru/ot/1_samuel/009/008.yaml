  yaml_path: translation/ot/1_samuel/009/008.yaml
  text: The young man answered Saul again and said[a], “Look, I have in my hand a quarter shekel of silver. I will give it to the man of God, and he will tell us our way.”
translation:
  language: ru
  text: 'Юноша снова ответил Саулу: «Вот, у меня в руке есть четверть сикля серебра. Я отдам её человеку Божьему, и он укажет нам путь[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каким путём нам идти». Буквально в еврейском тексте: «наш путь»; речь может идти как о дальнейшем маршруте, так и о том, что им следует делать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף ... לַעֲנוֹת
  choice: снова ответил
  rationale: Оборот с יסף и инфинитивом передаёт повторение или продолжение действия; здесь юноша вновь отвечает на возражение Саула.
- source_word: הַנַּעַר
  choice: юноша
  rationale: Слово נער может обозначать юношу, слугу или сопровождающего. «Юноша» сохраняет прямое лексическое значение, не исключая известной из контекста роли слуги.
- source_word: הִנֵּה
  choice: вот
  rationale: Частица привлекает внимание к серебру, которое юноша обнаруживает у себя; «вот» естественно передаёт это в современном русском языке.
- source_word: נִמְצָא בְיָדִי
  choice: у меня в руке есть
  rationale: Передаёт значение наличия и сохраняет конкретный образ «в руке», не воспроизводя неестественно для русского языка буквальную пассивную конструкцию «находится в моей руке».
- source_word: רֶבַע שֶׁקֶל כָּסֶף
  choice: четверть сикля серебра
  rationale: Точное обозначение четверти весовой денежной единицы серебра; традиционная форма «сикль» понятна в библейском контексте.
- source_word: וְנָתַתִּי
  choice: я отдам её
  rationale: Перфект выражает намерение в данном контексте. Местоимение «её» естественно отсылает к названной доле серебра.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: человеку Божьему
  rationale: Устойчивый и прозрачный перевод древнееврейского титула пророка или иного уполномоченного Богом человека.
- source_word: וְהִגִּיד לָנוּ אֶת דַּרְכֵּנוּ
  choice: и он укажет нам наш путь
  rationale: Глагол נגד в породе hифиль означает сообщить или дать знать. «Укажет» естественно сочетается с «путём», а выражение «наш путь» сохраняет неоднозначность между маршрутом и необходимым образом действий.
