  text: וַ/יֹּ֨אמֶר שָׁא֜וּל לְ/נַעֲר֗/וֹ וְ/הִנֵּ֣ה נֵלֵךְ֮ וּ/מַה נָּבִ֣יא לָ/אִישׁ֒ כִּ֤י הַ/לֶּ֨חֶם֙ אָזַ֣ל מִ/כֵּלֵ֔י/נוּ וּ/תְשׁוּרָ֥ה אֵין לְ/הָבִ֖יא לְ/אִ֣ישׁ הָ/אֱלֹהִ֑ים מָ֖ה אִתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/007.yaml
  text: Then Saul said to his young man[a], “But look, if we go, what will we bring to the man? For the bread is gone from our bags, and there is no gift to bring to the man of God[b]. What do we have?”
translation:
  language: ru
  text: 'Тогда Саул сказал своему молодому слуге: «Вот мы пойдём, но что принесём этому человеку? Ведь хлеб в наших сумках[a] кончился, и у нас нет подарка[b], который можно было бы принести человеку Божьему. Что у нас есть?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлеб кончился в наших вместилищах»; имеются в виду ёмкости, в которых несли припасы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подношения» — подарка, который приносили уважаемому человеку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: молодой слуга
  rationale: Слово может обозначать юношу или молодого помощника. В данном повествовании этот человек сопровождает Саула и служит ему; сочетание «молодой слуга» передаёт и возрастной оттенок, и роль, не подразумевая рабского положения.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Частица привлекает внимание к практическому возражению Саула. «Вот» сохраняет её указательную силу и естественно сочетается с последующим «но».
- source_word: נֵלֵךְ
  choice: мы пойдём
  rationale: Форма выражает предполагаемое дальнейшее действие. Русское будущее время естественно передаёт эту мысль.
- source_word: נָּבִיא
  choice: принесём
  rationale: Побудительная порода глагола בוא здесь означает принести что-либо человеку.
- source_word: לֶחֶם
  choice: хлеб
  rationale: Сохранено конкретное основное значение слова, хотя в контексте хлеб может представлять дорожные припасы вообще.
- source_word: כְּלִי
  choice: сумки
  rationale: Буквально речь идёт о вместилищах или ёмкостях. В контексте путешествия «сумки» ясно и естественно обозначает то, в чём несли припасы; буквальный образ отмечен в сноске.
- source_word: תְּשׁוּרָה
  choice: подарок
  rationale: Существительное обозначает подарок или подношение, приносимое уважаемому человеку. «Подарок» понятно современному читателю и не вносит обязательного культового оттенка.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохранён традиционный и узнаваемый титул лица, уполномоченного Богом, без замены его более узким словом «пророк».
- source_word: מָה אִתָּנוּ
  choice: Что у нас есть?
  rationale: Так естественно по-русски передаётся идиоматический вопрос о том, что имеется при них и доступно для подарка.
theological_decisions:
- issue: Титул אִישׁ הָאֱלֹהִים
  choice: человек Божий
  alternative: пророк
  rationale: Хотя в контексте речь идёт о пророке, исходный текст употребляет более широкий титул «человек Божий». Его сохранение не устраняет различие между обозначениями.
translation_notes:
  register: Современный литературный русский язык с dignified, но не архаичной библейской интонацией. Реплика Саула передана естественно и разговорно, при этом сохранены конкретный образ хлеба и титул «человек Божий».
