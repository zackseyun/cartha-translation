base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/010.yaml
  text: Then Saul said to his young man[a], “Your word is good. Come[b], let us go.” So they went to the city where the man of God was.
translation:
  language: ru
  text: 'Тогда Саул сказал своему юноше: «Ты хорошо сказал[a]. Пойдём». И они пошли в город, где был человек Божий[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Хорошо твоё слово»; то есть Саул одобряет предложение своего спутника.'
    reason: lexical_alternative
  - marker: b
    text: «Человек Божий» — еврейский титул, которым обычно называли пророка или того, кто говорил от имени Бога.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: юноша
  rationale: Основное значение слова — молодой человек. В данном контексте он сопровождает Саула и находится у него в подчинении, однако перевод «юноша» не сужает значение до формальной роли слуги.
- source_word: טוֹב דְּבָרְךָ
  choice: Ты хорошо сказал
  rationale: Буквально выражение означает «хорошо твоё слово». Здесь Саул одобряет высказанное спутником предложение; выбранный перевод естественно передаёт эту функцию в современном русском языке, а буквальная форма отмечена в сноске.
- source_word: לְכָה נֵלֵכָה
  choice: Пойдём
  rationale: Сочетание побудительной формы с когортативом выражает совместное приглашение или решение отправиться в путь. Русское «Пойдём» кратко и естественно передаёт обе составляющие.
- source_word: הָעִיר
  choice: город
  rationale: עִיר может обозначать город или поселение; традиционное и контекстуально уместное соответствие — «город».
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Прямой перевод сохраняет употреблённый в еврейском тексте титул и его богословское звучание, не заменяя его пояснительным словом «пророк».
- source_word: אֲשֶׁר שָׁם
  choice: где был
  rationale: Относительное местоимение с наречием места естественно передаётся по-русски словом «где»; прошедшее время соответствует повествовательному контексту.
theological_decisions:
- issue: Передача титула אִישׁ הָאֱלֹהִים
  choice: человек Божий
  alternative: пророк
  rationale: Хотя это устойчивое обозначение пророка или Божьего посланника, прямой перевод сохраняет собственную лексику исходного текста и не подменяет титул толкованием.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным стилем. Формулировка «Ты хорошо сказал» звучит естественно, тогда как сноска сохраняет буквальный образ еврейского выражения. Все маркеры сносок поставлены непосредственно при поясняемых выражениях.
