  text: וַ/יּ֤וֹסֶף יְהֽוֹנָתָן֙ לְ/הַשְׁבִּ֣יעַ אֶת דָּוִ֔ד בְּ/אַהֲבָת֖/וֹ אֹת֑/וֹ כִּֽי אַהֲבַ֥ת נַפְשׁ֖/וֹ אֲהֵבֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/017.yaml
  text: And Jonathan made David swear again by his love for him[b][a], for he loved him as his own soul.
translation:
  language: ru
  text: И Ионафан снова взял с Давида клятву[a] из любви к нему, ведь он любил его, как собственную душу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «продолжал брать с Давида клятву»; или: «снова связал Давида клятвой».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «любил его любовью своей души» — выражение глубокой личной преданности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: снова
  rationale: Глагол יסף с последующим инфинитивом указывает на повторение или продолжение действия; «снова» естественно передаёт повторность, а альтернативное понимание отмечено в сноске.
- source_word: לְהַשְׁבִּיעַ אֶת דָּוִד
  choice: взял с Давида клятву
  rationale: Каузативная форма שבע означает побудить человека поклясться или связать его клятвой. Русское выражение «взять с кого-либо клятву» ясно и естественно сохраняет этот смысл.
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: из любви к нему
  rationale: Предлог ב здесь наиболее естественно выражает основание или побуждение поступка. Формулировка также ясно относит любовь к Ионафану, не ослабляя её силы.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит объяснение поступка Ионафана; «ведь» естественно связывает обе части русского предложения.
- source_word: אַהֲבַת נַפְשׁוֹ אֲהֵבוֹ
  choice: он любил его, как собственную душу
  rationale: Оборот буквально говорит о любви его души и выражает глубочайшую личную преданность. «Как собственную душу» сохраняет библейский образ и остаётся понятным современному читателю.
theological_decisions:
- issue: Характер любви Ионафана к Давиду
  choice: Сохранено сильное слово «любил» и образ «как собственную душу» без дальнейшего определения характера этой любви.
  alternative: Назвать её только дружбой либо придать ей романтический или сексуальный смысл.
  rationale: Еврейский текст подчёркивает глубокую личную любовь и преданность, но сам по себе не даёт оснований ни ослаблять их до одной лишь «дружбы», ни конкретизировать их в романтическом или сексуальном ключе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Взял с Давида клятву» передаёт каузатив естественнее буквального «заставил поклясться», а «как собственную душу» сохраняет образность оригинала.
