base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/041.yaml
  text: When the boy had come[a], David rose from beside the south side and fell with his face to the ground and bowed three times. Then they kissed one another and wept with one another[b], until David wept the more.
translation:
  language: ru
  text: Когда юноша пришёл, Давид поднялся с южной стороны[a], пал лицом на землю и трижды поклонился. Затем они поцеловали друг друга и плакали друг с другом, пока Давид не стал плакать сильнее[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от [места] возле юга/южной стороны». Еврейский оборот труден; некоторые связывают его с холмом или камнем возле укрытия Давида.'
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «пока Давид не превзошёл [друга]»; то есть плач Давида стал сильнее плача Ионафана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר בָּא
  choice: Когда юноша пришёл
  rationale: Нַעַר обозначает юношу или слугу; здесь это помощник Ионафана. Бָּא буквально передано как «пришёл», без добавления отсутствующего в стихе пункта назначения.
- source_word: מֵאֵצֶל הַנֶּגֶב
  choice: с южной стороны
  rationale: Нֶגֶב обычно означает «юг, южная сторона». Оборот труден, поэтому основной текст следует масоретскому чтению, а возможная связь с местом укрытия отмечена в сноске.
- source_word: וַיִּפֹּל לְאַפָּיו אַרְצָה
  choice: пал лицом на землю
  rationale: Передаёт буквально выраженную позу и сохраняет естественное, торжественное русское повествование.
- source_word: וַיִּשְׁתַּחוּ שָׁלֹשׁ פְּעָמִים
  choice: и трижды поклонился
  rationale: Глагол означает поклониться или пасть ниц; «поклонился» не навязывает более узкого толкования жеста.
- source_word: וַיִּשְּׁקוּ אִישׁ אֶת רֵעֵהוּ
  choice: они поцеловали друг друга
  rationale: Естественно передаёт взаимную конструкцию и сохраняет буквальное описание прощального знака привязанности.
- source_word: וַיִּבְכּוּ אִישׁ אֶת רֵעֵהוּ
  choice: плакали друг с другом
  rationale: Сохраняет взаимность необычной еврейской конструкции, не добавляя таких деталей, как объятия.
- source_word: עַד דָּוִד הִגְדִּיל
  choice: пока Давид не стал плакать сильнее
  rationale: В контексте плача הִגְדִּיל указывает на усиление или превосходство; дополнение «плакать» восстановлено из ближайшего контекста.
