base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/030.yaml
  text: Then Saul’s anger burned against Jonathan[a], and he said to him, “You son of a perverse, rebellious woman! Do I not know that you have chosen the son of Jesse[c][b], to your own shame and to the shame of your mother’s nakedness?”
translation:
  language: ru
  text: 'Тогда Саул воспылал гневом на Ионафана и сказал ему: «Сын порочной и мятежной женщины![a] Неужели я не знаю, что ты выбрал сына Иессея[b] — себе на позор и на позор наготы твоей матери?[c]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Сын испорченности и мятежа!» Еврейское ругательство трудно для точного понимания и имеет ярко выраженный идиоматический характер.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «что ты встал на сторону сына Иессея».'
    reason: lexical_alternative
  - marker: c
    text: Выражение «позор наготы твоей матери» — крайне резкий древнееврейский оборот, обозначающий бесчестие, навлечённое на семью.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף שָׁאוּל בִּיהוֹנָתָן
  choice: Саул воспылал гневом на Ионафана
  rationale: Еврейская идиома буквально изображает разгорающийся гнев. Русское выражение сохраняет её образность и естественно передаёт направленность гнева на Ионафана.
- source_word: בֶּן נַעֲוַת הַמַּרְדּוּת
  choice: Сын испорченной и мятежной женщины
  rationale: Трудное идиоматическое ругательство связывает идеи нравственной испорченности и мятежности. Слово «женщины» добавлено для ясности конструкции; последующее упоминание матери подтверждает материнскую направленность оскорбления.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: Неужели я не знаю
  rationale: Сохранён резкий риторический вопрос, а не превращён в простое утверждение.
- source_word: בֹחֵר אַתָּה לְבֶן יִשַׁי
  choice: ты выбрал сына Иессея
  rationale: Передано основное значение глагола בחר — «выбирать». Контекст допускает смысл «встал на сторону», поэтому он отмечен в сноске, но не подставлен в основной текст.
- source_word: לְבָשְׁתְּךָ
  choice: себе на позор
  rationale: Естественно передаёт значение стыда или позора и оттенок результата в предлоге לְ.
- source_word: וּלְבֹשֶׁת עֶרְוַת אִמֶּךָ
  choice: и на позор наготе своей матери
  rationale: Слово עֶרְוָה прямо означает «нагота» и несёт сильные ассоциации семейного и полового бесчестия. Необычность и резкость исходного оскорбления намеренно сохранены.
