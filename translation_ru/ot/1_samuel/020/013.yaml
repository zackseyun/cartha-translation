base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/013.yaml
  text: May Yahweh do so to Jonathan[a], and more also, if my father intends evil against you and I do not disclose it to you and send you away, so that you may go in peace. And may Yahweh be with you[c][b], as he has been with my father.
translation:
  language: ru
  text: 'Пусть Яхве так поступит с Ионафаном и ещё больше сделает[a], если моему отцу будет угодно причинить тебе зло[b]: я сообщу тебе об этом[c] и отпущу тебя, чтобы ты ушёл с миром. И да будет Яхве с тобой, как Он был с моим отцом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Это формула клятвы-самопроклятия: Ионафан призывает на себя ещё более суровое наказание, если не исполнит обещанного.'
    reason: cultural_context
  - marker: b
    text: 'Буквально: «если зло против тебя будет хорошо моему отцу», то есть если отец сочтёт угодным причинить тебе зло или решит это сделать.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «открою твоё ухо» — древнееврейская идиома со значением «сообщу тебе» или «поставлю тебя в известность».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִיהוֹנָתָן וְכֹה יֹסִיף
  choice: Пусть Яхве так поступит с Ионафаном и ещё больше сделает
  rationale: Передана обычная древнееврейская формула клятвы-самопроклятия. Третье лицо «с Ионафаном» сохранено вслед за еврейским текстом.
- source_word: כִּי יֵיטִב אֶל אָבִי אֶת הָרָעָה עָלֶיךָ
  choice: если моему отцу будет угодно причинить тебе зло
  rationale: 'Оборот эллиптичен: буквально зло против Давида оказывается «хорошим/угодным» Саулу. Выбранный вариант естественен по-русски и сохраняет оттенок сознательного намерения.'
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: а я не сообщу тебе об этом
  rationale: Буквальное «открою твоё ухо» — идиома со значением «сообщу, поставлю в известность». Отрицание подразумевается сжатой конструкцией клятвы и выражено в переводе для ясности.
- source_word: וְשִׁלַּחְתִּיךָ
  choice: и не отпущу тебя
  rationale: Глагол в породе пиэль означает отослать или отпустить; в контексте Ионафан обещает помочь Давиду беспрепятственно уйти.
- source_word: וְהָלַכְתָּ לְשָׁלוֹם
  choice: чтобы ты ушёл с миром
  rationale: «С миром» сохраняет устойчивое древнееврейское выражение, а целевое «чтобы» естественно связывает уход с предупреждением и освобождением Давида.
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: И да будет Яхве с тобой
  rationale: Форма передаёт пожелание; личное имя יהוה транслитерировано как «Яхве».
- source_word: כַּאֲשֶׁר הָיָה עִם אָבִי
  choice: как Он был с моим отцом
  rationale: Перфект описывает прежнее пребывание Яхве с Саулом; прошедшее время не навязывает вывода о точном моменте прекращения этой поддержки.
theological_decisions:
- issue: Подразумеваемое отрицание в клятве Ионафана
  choice: 'В основном тексте выражено: «а я не сообщу… и не отпущу».'
  alternative: 'Формально оставить глаголы положительными: «то сообщу тебе… и отпущу тебя».'
  rationale: 'Еврейская формула клятвы сжата: названное самопроклятие относится к случаю, если Ионафан, узнав о злом намерении Саула, не предупредит и не отпустит Давида. Явное отрицание делает синтаксис понятным по-русски, а примечание сохраняет сведения о форме оригинала.'
- issue: Сопоставление присутствия Яхве с Давидом и Саулом
  choice: «как Он был с моим отцом»
  alternative: «как Он пребывал с моим отцом» или «как Он был доныне с моим отцом»
  rationale: Перевод сохраняет сравнение, но не уточняет сверх текста, продолжает ли Яхве быть с Саулом в момент речи.
translation_notes:
  register: Современный литературный русский язык с торжественностью, уместной для клятвы. Сохранены личное имя «Яхве», третье лицо «Ионафан», выражение «с миром» и неоднозначность сопоставления с Саулом; непрозрачные еврейские идиомы раскрыты в примечаниях.
