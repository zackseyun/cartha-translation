base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/042.yaml
  text: Jonathan said to David, “Go in peace, because the two of us have sworn in the name of the LORD, saying, ‘May the LORD be between me and you, and between my offspring and your offspring forever.’”
translation:
  language: ru
  text: 'Ионафан сказал Давиду: «Иди с миром. Ведь мы оба поклялись именем Господа, сказав: „Пусть Господь будет между мной и тобой, между моими потомками и твоими потомками навеки“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ לְשָׁלוֹם
  choice: Иди с миром
  rationale: Естественная русская формула прощания, точно передающая пожелание благополучия и мира.
- source_word: אֲשֶׁר
  choice: Ведь
  rationale: Здесь вводит основание для мирного расставания; «ведь» естественно выражает эту связь, не делая её чрезмерно жёсткой.
- source_word: זַרְעִי ... זַרְעֲךָ
  choice: моими потомками ... твоими потомками
  rationale: В контексте завета זרע обозначает последующие поколения; «потомки» ясно и современно передаёт смысл.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Кратко и достойно передаёт идею непрекращающейся длительности.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: Господь
  alternative: Яхве
  rationale: Традиционная и понятная русская передача имени Бога в основном тексте; она сохраняет различие от обычного слова «господин» благодаря контексту и прописной букве.
- issue: Значение формулы «Господь будет между мной и тобой»
  choice: Сохранена буквально как «Пусть Господь будет между мной и тобой»
  alternative: «Пусть Господь будет свидетелем между мной и тобой»
  rationale: В еврейском тексте слово «свидетель» отсутствует. Буквальная формула сохраняет её заветную ёмкость и не сужает роль Бога до одного истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён без утраты повторов и параллелизма исходного текста; прямая речь внутри цитаты оформлена русскими кавычками.
