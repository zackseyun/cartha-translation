  source_fidelity: 'Текст точно передаёт еврейскую последовательность: царь занимает своё место у стены, Ионафан встаёт, Авенир садится рядом с Саулом, а место Давида оказывается пустым. Необычное действие Ионафана сохранено без догадок о его причине. «Как обычно» уместно передаёт כְּפַעַם בְּפַעַם, а «место Давида осталось пустым» естественно выражает контекстуальный смысл וַיִּפָּקֵד מְקוֹם דָּוִד.'
