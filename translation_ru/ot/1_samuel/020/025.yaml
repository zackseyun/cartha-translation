  terminology: Имена «Ионафан», «Авенир», «Саул» нормативны для русской библейской традиции. «Царь» корректно сохраняет титул, употреблённый в еврейском тексте, а не заменяет его именем. Терминологических или богословски нагруженных решений нет.
