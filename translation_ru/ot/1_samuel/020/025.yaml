base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/025.yaml
  text: The king sat in his seat[a], as at other times, by the wall; and Jonathan rose, and Abner sat beside Saul, but David’s place was empty.
translation:
  language: ru
  text: Царь сел на своё место, как обычно, у стены. Ионафан встал, Авенир сел рядом с Саулом, а место Давида осталось пустым[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а Давида на его месте не оказалось».'
    reason: Еврейский оборот допускает смысловой акцент либо на пустовавшем месте, либо на отсутствии Давида, который должен был его занимать.
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Сохранён употреблённый в еврейском тексте титул с определённым артиклем; из контекста ясно, что речь идёт о Сауле.
- source_word: מוֹשָׁבוֹ
  choice: своё место
  rationale: В контексте трапезы слово обозначает место для сидения; русское «своё место» звучит естественно и передаёт закреплённое за царём место.
- source_word: כְּפַעַם בְּפַעַם
  choice: как обычно
  rationale: Идиома указывает на неоднократно повторявшийся порядок, то есть «как в прежние разы».
- source_word: אֶל מוֹשַׁב הַקִּיר
  choice: у стены
  rationale: Оборот локализует место царя возле стены; буквальное упоминание «места стены» по-русски было бы неестественным.
- source_word: וַיָּקָם יְהוֹנָתָן
  choice: Ионафан встал
  rationale: Прямо передаёт повествовательную форму глагола קום, не пытаясь объяснить неуказанную в тексте причину действия.
- source_word: וַיֵּשֶׁב אַבְנֵר מִצַּד שָׁאוּל
  choice: Авенир сел рядом с Саулом
  rationale: מִצַּד обозначает положение сбоку, рядом с кем-либо.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: место Давида осталось пустым
  rationale: В данном контексте пассивная форма פקד означает отсутствие ожидаемого человека на предназначенном ему месте; основной текст естественно передаёт наблюдаемую ситуацию.
