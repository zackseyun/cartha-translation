base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/031.yaml
  text: For as long as the son of Jesse lives on the earth[a], neither you nor your kingdom will be established. So now, send and bring him to me, for he is a son of death.
translation:
  language: ru
  text: Ведь пока сын Иессея живёт на земле, ни ты не утвердишься, ни твоё царство. А теперь пошли за ним и приведи его ко мне, потому что он — сын смерти[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сын смерти»; то есть тот, кто подлежит смерти или обречён умереть.'
    reason: Пояснение еврейского идиоматического выражения и сохранение его смысловой неоднозначности.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт причинно-пояснительную связь с предшествующей речью Саула естественно для современного русского языка.
- source_word: כָל הַיָּמִים אֲשֶׁר
  choice: пока
  rationale: 'Естественно выражает длительность условия: всё то время, пока Давид жив.'
- source_word: בֶּן יִשַׁי
  choice: сын Иессея
  rationale: Сохранено намеренное именование Давида по отцу, передающее отчуждение и презрение Саула.
- source_word: חַי עַל הָאֲדָמָה
  choice: живёт на земле
  rationale: Сохраняет прямой пространственный образ и не сужает значение до конкретной страны или территории.
- source_word: לֹא תִכּוֹן אַתָּה וּמַלְכוּתֶךָ
  choice: не утвердитесь ни ты, ни твоё царство
  rationale: Глагол כון в нифале передан как «утвердиться»; отрицательная координация естественно оформлена конструкцией «ни… ни…», а «царство» сохраняет династически-политический смысл מַלְכוּת.
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт переход от обоснования к настоятельному приказу.
- source_word: שְׁלַח וְקַח אֹתוֹ אֵלַי
  choice: пошли за ним и приведи его ко мне
  rationale: 'Естественно передаёт два связанных повеления: послать людей за Давидом и доставить его к Саулу.'
- source_word: בֶּן מָוֶת הוּא
  choice: он — сын смерти
  rationale: 'Сохранён выразительный еврейский оборот и его смысловая неоднозначность: Давид либо заслуживает смерти, либо обречён умереть; пояснение дано в сноске.'
theological_decisions:
- issue: Смысл выражения בֶּן מָוֶת
  choice: Сохранить образ «сын смерти» в основном тексте.
  alternative: «Он заслуживает смерти» или «он обречён на смерть».
  rationale: Буквальный образ допускает как юридический оттенок подлежащего смертной казни, так и оттенок обречённости; выбор одного толкования преждевременно устранил бы эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для обычного читателя; патронимическое именование и образ «сын смерти» сохранены ради риторической и смысловой точности.
