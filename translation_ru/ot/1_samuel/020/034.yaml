base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/034.yaml
  text: Then Jonathan rose from the table in fierce anger[a], and he ate no food on the second day of the month, because he was grieved over David, because his father had humiliated him.
translation:
  language: ru
  text: 'Ионафан встал из-за стола, охваченный яростным гневом, и во второй день месяца[a] ничего не ел, потому что скорбел о Давиде: отец Ионафана подверг позору его[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во второй день новомесячья». Еврейское חֹדֶשׁ может означать как «месяц», так и «новомесячье»; здесь речь идёт о царской трапезе в честь новомесячья.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть Давида; возможное другое понимание: «подверг позору Ионафана». Еврейское местоимение допускает оба отнесения.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיָּקָם ... מֵעִם הַשֻּׁלְחָן
  choice: встал из-за стола
  rationale: Естественно передаёт движение Ионафана от стола в контексте трапезы.
- source_word: בָּחֳרִי אָף
  choice: пылая гневом
  rationale: Сохраняет образ жара, заложенный в חֳרִי, и силу выражения.
- source_word: וְלֹא אָכַל ... לֶחֶם
  choice: не стал есть
  rationale: В контексте трапезы לֶחֶם обозначает пищу вообще; русское выражение естественно передаёт отказ от еды.
- source_word: בְּיוֹם הַחֹדֶשׁ הַשֵּׁנִי
  choice: во второй день новомесячья
  rationale: Контекст праздничной царской трапезы указывает на новомесячье; порядок слов допускает понимание второго дня празднования.
- source_word: נֶעְצַב אֶל דָּוִד
  choice: скорбел о Давиде
  rationale: Передаёт душевную боль Ионафана из-за того, что произошло с Давидом.
- source_word: הִכְלִמוֹ
  choice: опозорил Давида
  rationale: Hiphil от כלם означает подвергнуть позору или унижению; явное имя устраняет местоименную неоднозначность в русском основном тексте, а примечание сохраняет грамматическую неоднозначность еврейского.
theological_decisions:
- issue: К кому относится местоименный суффикс в הִכְלִמוֹ
  choice: его отец опозорил Давида
  alternative: его отец опозорил его (Ионафана)
  rationale: Ближайший названный мужской референт — Давид, и о нём Ионафан скорбит; однако грамматика сама по себе допускает отнесение суффикса к Ионафану, поэтому альтернатива вынесена в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Образное «пылая гневом» сохраняет еврейскую метафору жара; синтаксис сделан ясным для обычного читателя без устранения подлинной местоименной неоднозначности, отмеченной в сноске.
