  yaml_path: translation/ot/1_samuel/020/020.yaml
  text: And I will shoot the three arrows to the side of it[c][b][a], as though I were shooting for myself at a target.
translation:
  language: ru
  text: А я выпущу три стрелы в сторону, как будто стреляю по мишени[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'Еврейское выражение буквально: «пускать для себя в мишень»; оно, вероятно, описывает видимость обычной стрельбы по мишени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: А я
  rationale: Самостоятельное местоимение выделяет действие Ионафана в изложении плана; «А я» естественно передаёт смену участника действия.
- source_word: שְׁלֹשֶׁת הַחִצִּים
  choice: три стрелы
  rationale: В русском языке определённость обычно выражается контекстом; добавление «те» создало бы отсутствующий в еврейском тексте усилительный оттенок.
- source_word: צִדָּה
  choice: сбоку от него
  rationale: Форма с суффиксом 3-го лица женского рода указывает на предмет, названный в контексте, вероятнее всего на камень или ориентир. Русское местоимение согласовано с предполагаемым словом «камень».
- source_word: אוֹרֶה
  choice: пущу
  rationale: В контексте стрельбы из лука форма глагола ירה означает выпускание стрел; «пущу три стрелы» звучит естественно и сохраняет будущий смысл задуманного действия.
- source_word: לְשַׁלַּח לִי
  choice: будто упражняясь в стрельбе
  rationale: Буквальное «посылая для себя» здесь идиоматически описывает видимость обычной самостоятельной стрельбы; перевод передаёт инсценированную тренировку, не превращая неясное выражение в неестественную русскую фразу.
- source_word: לְמַטָּרָה
  choice: по мишени
  rationale: מַטָּרָה обозначает цель или мишень для стрельбы; «по мишени» — обычное современное русское сочетание.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет форму заранее намеченного сигнала и предполагаемую отсылку местоименного суффикса к камню, а трудную еврейскую идиому передаёт ясно и без разговорной окраски.
