  text: וְ/לֹֽא תַכְרִ֧ת אֶֽת חַסְדְּ/ךָ֛ מֵ/עִ֥ם בֵּיתִ֖/י עַד עוֹלָ֑ם וְ/לֹ֗א בְּ/הַכְרִ֤ת יְהוָה֙ אֶת אֹיְבֵ֣י דָוִ֔ד אִ֕ישׁ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/015.yaml
  text: And you shall not cut off your steadfast love from my house forever[a], not even when Yahweh cuts off David’s enemies, every one of them, from the face of the earth.
translation:
  language: ru
  text: И не лишай мой дом своей верной любви вовеки[a], даже когда Яхве истребит с лица земли всех до единого врагов Давида.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своей заветной верности»; также возможно: «своей преданной любви». Еврейское חֶסֶד часто означает верную любовь и преданность в отношениях завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכְרִת / בְּהַכְרִת (כרת)
  choice: не лишай / истребит
  rationale: В первом контексте буквальное «не отсекай любовь» по-русски неестественно, тогда как «не лишай» точно передаёт просьбу не прекращать верную любовь. Во втором контексте כרת означает полное устранение врагов и естественно передаётся глаголом «истребит». Лексическая игра оригинала ослаблена ради ясного современного русского языка.
- source_word: חַסְדְּךָ
  choice: своей верной любви
  rationale: חסד здесь обозначает неизменную любовь и преданность в рамках заветных отношений, а не просто доброту. «Верная любовь» сохраняет и личный, и заветный оттенок, не превращая выражение в узкий юридический термин.
- source_word: מֵעִם בֵּיתִי
  choice: мой дом
  rationale: '«Дом» сохраняет семейно-династический смысл בית: речь идёт не о здании, а о семье и потомках Ионафана.'
- source_word: עַד עוֹלָם
  choice: вовеки
  rationale: Торжественное и понятное обозначение неограниченной длительности, уместное для заветной просьбы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом.
- source_word: אֹיְבֵי דָוִד אִישׁ
  choice: всех до единого врагов Давида
  rationale: Оборот «всех до единого» естественно выражает распределительное אִישׁ и подчёркивает устранение каждого врага.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: с лица земли
  rationale: Устоявшийся русский эквивалент древнееврейского идиоматического выражения о полном удалении из мира.
- source_word: וְלֹא ... וְלֹא
  choice: И не ... даже когда
  rationale: 'Второе отрицание понято как усиление просьбы: милость к дому Ионафана не должна прекратиться даже во время уничтожения врагов Давида.'
theological_decisions:
- issue: Смысл חסד в контексте завета
  choice: «верная любовь» с оттенком неизменной преданности
  alternative: «заветная верность», «милость», «преданная любовь»
  rationale: Контекст завета между Ионафаном и Давидом придаёт слову смысл устойчивой личной и семейной преданности. Перевод не сужает его до технического договорного термина.
- issue: Связь второй части стиха с просьбой Ионафана
  choice: Просьба сохраняет силу даже тогда, когда Яхве истребит врагов Давида
  alternative: Вторая часть представляет собой относительно самостоятельное или вводное утверждение об истреблении врагов
  rationale: Повтор отрицания и инфинитивная конструкция естественно продолжают и усиливают просьбу, подчёркивая, что дом Ионафана должен быть пощажён при падении противников Давида.
- issue: Распределительное значение אִישׁ
  choice: «всех до единого»
  alternative: «каждого», «всех»
  rationale: Формулировка явно передаёт индивидуализирующую силу слова и при этом звучит естественно по-русски.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Вовеки» поддерживает заветный регистр; порядок слов остаётся ясным для широкого круга читателей. Повтор корня כרת невозможно сохранить без неестественного выражения «отсекать любовь», поэтому в двух контекстах выбраны разные русские глаголы.
