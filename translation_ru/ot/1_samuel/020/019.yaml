  text: On the third day[a], go down quickly and come to the place where you hid yourself on the day of the deed[b], and remain beside the stone Ezel.
translation:
  language: ru
  text: На третий день быстро спустись и приди на то место, где ты прятался в день того дела[a]. Останься у камня Азель[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в день того события» или «в день того обстоятельства». Еврейское выражение допускает несколько значений и, вероятно, отсылает к ранее известному делу или случаю.'
    reason: lexical_alternative
  - marker: b
    text: «Азель», вероятно, название места или устойчивое обозначение камня. Еврейское слово может быть связано со значением «уход» или «отправление», но точный смысл неизвестен.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּשְׁתָּ
  choice: На третий день
  rationale: Пиэль глагола שלשׁ здесь употреблён необычно, но в контексте естественно указывает на третий день условленного плана; перевод сохраняет последовательность повествования без буквального и неясного «сделай в третий раз».
- source_word: תֵּרֵד מְאֹד
  choice: быстро спустись
  rationale: ירד означает «спускаться», а מְאֹד усиливает действие. В данном указании сочетание естественно передаётся наречием «быстро», хотя возможен пространственный оттенок «спустись далеко вниз».
- source_word: וּבָאתָ אֶל הַמָּקוֹם
  choice: и приди на то место
  rationale: בוא обычно означает «приходить, входить»; указательное «то» естественно, поскольку речь идёт об уже известном месте.
- source_word: אֲשֶׁר נִסְתַּרְתָּ שָּׁם
  choice: где ты прятался
  rationale: Нифаль от סתר в контексте обозначает намеренное укрытие Давида; русское «прятался» ясно и естественно передаёт возвратный смысл.
- source_word: בְּיוֹם הַמַּעֲשֶׂה
  choice: в день того дела
  rationale: מַעֲשֶׂה может означать действие, дело или событие. «То дело» сохраняет отсылку к ранее известному обстоятельству и не уточняет неясное выражение сверх текста.
- source_word: וְיָשַׁבְתָּ
  choice: Останься
  rationale: ישׁב буквально может означать «сидеть», но также «оставаться, пребывать»; в указании ждать в укрытии «останься» естественно выражает смысл.
- source_word: אֵצֶל הָאֶבֶן הָאָזֶל
  choice: у камня Азель
  rationale: הָאָזֶל вероятнее всего является именем или устойчивым обозначением камня. Транслитерация сохраняет неопределённость значения вместо сомнительного перевода этимологии.
