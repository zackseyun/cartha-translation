lexical_decisions:
- source_word: וְהַדָּבָר
  choice: А о том
  rationale: דָּבָר здесь указывает на ранее обсуждённое соглашение; русское «о том» естественно вводит эту тему, а начальное «А» передаёт продолжение и тематический переход.
- source_word: אֲשֶׁר דִּבַּרְנוּ
  choice: о чём мы ... говорили
  rationale: Сочетание с «о том» естественно передаёт относительное предложение и отсылает к состоявшемуся разговору, сохраняющему значение в настоящем.
- source_word: אֲנִי וָאָתָּה
  choice: мы с тобой
  rationale: Это естественный современный русский способ передать взаимное «я и ты» без утраты личного характера речи.
- source_word: הִנֵּה
  choice: вот
  rationale: «Вот» привлекает внимание и сохраняет торжественную выразительность маркера הִנֵּה, не прибегая к архаичному «се».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: בֵּינִי וּבֵינְךָ
  choice: между мной и тобой
  rationale: Сохранены еврейский порядок лиц и намеренно не раскрытый прямо смысл Яхве как свидетеля или гаранта соглашения.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Краткое и достойное русское соответствие устойчивому выражению длительности; хорошо подходит торжественному контексту обязательства.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл слов о Яхве «между» двумя людьми
  choice: Сохранить буквальное «Яхве между мной и тобой»
  alternative: 'Разъяснить: «Яхве — свидетель/гарант между нами»'
  rationale: Контекст допускает понимание Яхве как свидетеля и гаранта договора, однако сам стих этого не разворачивает. Буквальная формулировка сохраняет богословскую ёмкость и неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Архаизм «се» заменён естественным «вот»; синтаксис остаётся достаточно близким к еврейскому тексту, но звучит по-русски.
