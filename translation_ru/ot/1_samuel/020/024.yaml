  text: So David hid himself in the field. When the new moon came[a], the king sat down to eat the meal.
translation:
  language: ru
  text: Давид спрятался в поле. Когда наступило новолуние, царь сел поесть[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сел над хлебом, чтобы есть»; слово «хлеб» здесь означает всю трапезу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּתֵר
  choice: спрятался
  rationale: 'Нифаль глагола סתר в данном контексте имеет возвратно-непереходное значение: Давид сам укрылся. «Спрятался» естественно передаёт намеренное действие.'
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: Прямое и обычное соответствие слову שָׂדֶה; контекст не требует расширять значение до «за городом» или «в сельской местности».
- source_word: וַיְהִי הַחֹדֶשׁ
  choice: когда наступило новолуние
  rationale: הַחֹדֶשׁ здесь обозначает новолуние как календарный день и связанное с ним событие. Временная конструкция естественно связывает повествовательные действия.
- source_word: וַיֵּשֶׁב
  choice: сел
  rationale: В контексте еды ישב означает, что царь занял место, чтобы есть; простое «сел» сохраняет образ исходного текста.
- source_word: עַל הַלֶּחֶם לֶאֱכֹל
  choice: поесть
  rationale: Буквальное выражение «сел над хлебом, чтобы есть» означает, что царь сел для приёма пищи. «Сел поесть» кратко и естественно передаёт смысл, а образ хлеба отмечен в сноске.
- source_word: דָּוִד
  choice: Давид
  rationale: Традиционная русская форма библейского личного имени.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Сохранён определённый титул, которым еврейский текст обозначает Саула, без замены его личным именем.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным ритмом. Формулировка «сел поесть» понятна обычному читателю, не привносит отсутствующий в еврейском тексте стол и сопровождается сноской, сохраняющей исходный образ хлеба.
