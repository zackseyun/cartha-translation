base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/007.yaml
  text: If he says[a], ‘Good,’ there will be peace for your servant; but if he becomes very angry, know that evil has been determined by him.
translation:
  language: ru
  text: 'Если он скажет: «Хорошо», — тогда раб твой будет в безопасности; если же он сильно разгневается, знай: он окончательно решил причинить зло[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зло уже окончательно решено им»; то есть Саул твёрдо решил причинить вред.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Хорошо
  rationale: Краткий одобрительный ответ Саула; эллиптическое употребление прилагательного естественно передаётся наречием в прямой речи.
- source_word: שָׁלוֹם לְעַבְדֶּךָ
  choice: тогда раб твой будет в безопасности
  rationale: В данном контексте שָׁלוֹם обозначает благополучие и отсутствие угрозы для Давида. Будущее время передаёт вывод о его дальнейшей безопасности, а выражение «раб твой» сохраняет почтительную форму речи Ионафана.
- source_word: חָרֹה יֶחֱרֶה לוֹ
  choice: он сильно разгневается
  rationale: Сочетание инфинитива абсолютного с личной формой глагола усиливает значение; «сильно разгневается» ясно и естественно передаёт эту интенсивность.
- source_word: דַּע
  choice: знай
  rationale: Прямой императив, побуждающий Давида сделать вывод из реакции Саула.
- source_word: כָלְתָה הָרָעָה מֵעִמּוֹ
  choice: он окончательно решил причинить зло
  rationale: В контексте כָלְתָה указывает на доведённое до окончательности, твёрдо принятое намерение, а מֵעִמּוֹ обозначает его источник — Саула. Формулировка естественна по-русски и сохраняет нравственный вес слова «зло».
theological_decisions:
- issue: Степень определённости злого намерения Саула
  choice: он окончательно решил причинить зло
  alternative: зло с его стороны достигло полноты / окончательно определено
  rationale: Основной текст передаёт контекстуальный смысл твёрдо сложившегося намерения, а примечание сохраняет неоднозначность необычной еврейской конструкции и более буквальную возможность её понимания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Почтительное самоназвание «раб твой» сохранено; буквальная конструкция заключительной фразы разъяснена в сноске.
