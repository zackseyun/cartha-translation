lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: сказал ему
  rationale: Обычная повествовательная формула с косвенным дополнением; естественно передаётся по-русски.
- source_word: יְהוֹנָתָן
  choice: Ионафан
  rationale: Традиционная русская библейская форма имени.
- source_word: מָחָר
  choice: завтра
  rationale: Прямое соответствие временному наречию.
- source_word: חֹדֶשׁ
  choice: новомесячие
  rationale: В данном контексте речь идёт не просто о месяце, а о праздновании новолуния и связанной с ним царской трапезе.
- source_word: וְנִפְקַדְתָּ
  choice: тебя хватятся
  rationale: Нифаль глагола פקד указывает, что отсутствие Давида заметят и обратят на него внимание. Русское выражение естественно передаёт этот смысл.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой отсутствие Давида будет замечено.
- source_word: יִפָּקֵד
  choice: будет пустовать
  rationale: При подлежащем «твоё место» форма פקד означает, что место окажется незанятым; буквальное повторение того же русского глагола невозможно без неестественности.
- source_word: מוֹשָׁבֶךָ
  choice: твоё место
  rationale: В контексте царской трапезы имеется в виду отведённое Давиду место за столом; «место» звучит естественнее и не сужает образ до самого сиденья.
