  text: וַ/יֹּ֡אמֶר שַׁלְּחֵ֣/נִי נָ֡א כִּ֣י זֶבַח֩ מִשְׁפָּחָ֨ה לָ֜/נוּ בָּ/עִ֗יר וְ/ה֤וּא צִוָּֽה לִ/י֙ אָחִ֔/י וְ/עַתָּ֗ה אִם מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אִמָּ֥לְטָה נָּ֖א וְ/אֶרְאֶ֣ה אֶת אֶחָ֑/י עַל כֵּ֣ן לֹא בָ֔א אֶל שֻׁלְחַ֖ן הַ/מֶּֽלֶךְ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/029.yaml
  text: He said[a], ‘Please let me go, because we have a family sacrifice in the city, and my brother himself has commanded me. So now, if I have found favor in your eyes[b], please let me escape and see my brothers.’ Therefore he has not come to the king’s table.
translation:
  language: ru
  text: 'Он сказал: «Прошу, отпусти меня: в городе у нашего рода совершается жертвоприношение, и брат мой сам велел мне прийти. Теперь же, если я обрёл благоволение в твоих глазах, позволь мне ускользнуть[a] и повидаться с моими братьями[b]». Вот почему он не пришёл к царскому столу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «позволь мне спастись (уйти)». Еврейский глагол может означать спасение от опасности, бегство или незаметный уход.'
    reason: lexical_alternative
  - marker: b
    text: Под «братьями» могут подразумеваться как родные братья Давида, так и его близкие родственники-мужчины из более широкого рода.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי נָא
  choice: Прошу, отпусти меня
  rationale: Императив שׁלח с суффиксом первого лица выражает просьбу разрешить уйти; נָא передано вежливым «прошу».
- source_word: זֶבַח מִשְׁפָּחָה
  choice: у нашего рода ... жертвоприношение
  rationale: זֶבַח обозначает именно жертвоприношение, обычно сопровождавшееся общей трапезой; מִשְׁפָּחָה может означать как семью, так и более широкий род. Такая формулировка естественна по-русски и сохраняет культовый смысл.
- source_word: בָּעִיר
  choice: в городе
  rationale: Прямое локативное значение сохранено без уточнения названия города, которого в стихе нет.
- source_word: וְהוּא צִוָּה לִי אָחִי
  choice: и брат мой сам велел мне прийти
  rationale: «Сам» передаёт акцентирующее הוּא; «велел» отражает силу צוה. «Прийти» восполняет подразумеваемое действие, необходимое для естественной русской фразы и ясное из контекста семейного собрания.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: если я обрёл благоволение в твоих глазах
  rationale: Сохранён образ устойчивой еврейской формулы почтительной просьбы; выражение остаётся понятным в современном литературном русском.
- source_word: אִמָּלְטָה נָּא
  choice: позволь мне ускользнуть
  rationale: Когортатив מלט может обозначать спасение, уход или возможность незаметно удалиться. «Ускользнуть» сохраняет эту смысловую напряжённость и подходит к ситуации тайного ухода.
- source_word: וְאֶרְאֶה אֶת אֶחָי
  choice: и повидаться с моими братьями
  rationale: В контексте семейного собрания русское «повидаться» естественно передаёт целенаправленное «увидеть»; «братья» сохраняет буквальное אֶחָי, не исключая более широкого родственного значения.
- source_word: עַל כֵּן לֹא בָא
  choice: Поэтому он не пришёл
  rationale: עַל כֵּן вводит вывод-объяснение, а совершенный вид «не пришёл» естественно передаёт завершённое отсутствие в русском повествовании.
- source_word: אֶל שֻׁלְחַן הַמֶּלֶךְ
  choice: к царскому столу
  rationale: Естественная русская конструкция сохраняет сцену трапезы при царе.
