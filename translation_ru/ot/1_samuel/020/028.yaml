  text: וַ/יַּ֥עַן יְהוֹנָתָ֖ן אֶת שָׁא֑וּל נִשְׁאֹ֨ל נִשְׁאַ֥ל דָּוִ֛ד מֵ/עִמָּדִ֖/י עַד בֵּ֥ית לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/028.yaml
  text: Jonathan answered Saul[a], “David earnestly asked leave of me to go to Bethlehem.”
translation:
  language: ru
  text: 'Ионафан ответил Саулу: «Давид очень просил меня отпустить его в Вифлеем».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давид настойчиво просил у меня разрешения отправиться в Вифлеем». В еврейском тексте абсолютный инфинитив употреблён вместе с личной формой того же глагола для усиления.'
    reason: Сохраняет возможный оттенок настойчивой просьбы и поясняет эмфатическую еврейскую конструкцию, не представляя один оттенок как бесспорный.
lexical_decisions:
- source_word: וַיַּעַן
  choice: ответил
  rationale: Обычная повествовательная форма глагола ענה при передаче диалога; «ответил» естественно и точно передаёт смысл.
- source_word: אֶת שָׁאוּל
  choice: Саулу
  rationale: Показатель прямого дополнения при имени обозначает того, кому отвечает Ионафан; по-русски это естественно передаётся дательным падежом.
- source_word: נִשְׁאֹל נִשְׁאַל
  choice: очень просил
  rationale: Абсолютный инфинитив при личной форме того же глагола усиливает просьбу. «Очень просил» сохраняет эмфатический характер конструкции, не уточняя без достаточных оснований, была ли просьба настойчивой или многократной.
- source_word: מֵעִמָּדִי
  choice: меня отпустить его
  rationale: Предлог указывает на просьбу уйти от Ионафана или получить его разрешение. В русском контексте естественная конструкция «просил меня отпустить его» ясно передаёт подразумеваемое разрешение на уход.
- source_word: עַד בֵּית לָחֶם
  choice: в Вифлеем
  rationale: עַד обозначает предел или направление движения. Поскольку речь идёт о разрешении уйти, русское «в Вифлеем» естественно выражает место назначения.
- source_word: בֵּית לָחֶם
  choice: Вифлеем
  rationale: Традиционная и общепринятая русская форма названия города.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествовательная формула лаконична и dignified. Усиление еврейской конструкции передано естественным выражением «очень просил», а возможный оттенок настойчивости вынесен в примечание.
