  yaml_path: translation/ot/1_samuel/020/004.yaml
  text: Then Jonathan said to David[a], “What does your soul say? I will do it for you.”
translation:
  language: ru
  text: 'Ионафан сказал Давиду: «Чего желает твоя душа? Я сделаю это для тебя».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Что скажет твоя душа? Я сделаю для тебя». По смыслу возможно: «Чего бы ты ни пожелал, я сделаю для тебя».'
    reason: 'Сохраняется неоднозначность древнееврейской идиомы: вопросительное прочтение формы מַה и образное «скажет твоя душа» могут выражать открытое обещание исполнить желание Давида.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Ваййиктоль продолжает повествовательную последовательность; в русском естественный порядок событий передаётся простым прошедшим временем без обязательного отдельного «тогда».
- source_word: יְהוֹנָתָן
  choice: Ионафан
  rationale: Традиционная русская библейская форма личного имени.
- source_word: אֶל דָּוִד
  choice: Давиду
  rationale: Русский дательный падеж естественно обозначает адресата речи; «Давид» передан в традиционной русской форме.
- source_word: מַה תֹּאמַר נַפְשְׁךָ
  choice: Чего желает твоя душа?
  rationale: Буквально выражение близко к «что скажет твоя душа?», однако נֶפֶשׁ здесь может обозначать внутреннее желание человека. Выбранная формулировка сохраняет образ души и передаёт смысл вопроса естественнее по-русски; буквальная возможность дана в сноске.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: Я сделаю это для тебя
  rationale: Глагол עשה прямо передан как «сделаю», а לְ — как указание на действие в пользу Давида. Местоимение «это» восполняет подразумеваемое дополнение и обеспечивает естественную русскую речь.
