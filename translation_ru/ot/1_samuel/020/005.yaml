base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/005.yaml
  text: David said to Jonathan[a], “Look, tomorrow is the new moon, and I am supposed to sit with the king to eat. But let me go[b], so that I may hide myself in the field until the third evening.”
translation:
  language: ru
  text: 'Давид сказал Ионафану: «Вот, завтра новомесячие[b], и мне полагается сидеть с царём за трапезой. Но отпусти меня, и я скроюсь в поле до третьего вечера[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до вечера третьего дня». Еврейское выражение эллиптично.'
    reason: lexical_alternative
  - marker: b
    text: Новомесячие — ежемесячное празднование новолуния, которое нередко сопровождалось особой трапезой.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет функцию привлечения внимания и естественно звучит в современном русском повествовании.
- source_word: חֹדֶשׁ מָחָר
  choice: завтра новомесячие
  rationale: В данном контексте חֹדֶשׁ обозначает не просто новый месяц, а соблюдение новолуния, сопровождавшееся особой трапезой.
- source_word: יָשֹׁב אֵשֵׁב
  choice: мне полагается сидеть
  rationale: Инфинитив абсолютный с личной формой усиливает ожидаемость присутствия Давида. Формулировка передаёт установленное ожидание, не превращая его в утверждение о личном нравственном долге.
- source_word: עִם הַמֶּלֶךְ לֶאֱכֹל
  choice: сидеть с царём за трапезой
  rationale: Естественно передаёт конкретную картину совместного сидения и еды, не устраняя придворный контекст.
- source_word: וְשִׁלַּחְתַּנִי
  choice: но отпусти меня
  rationale: Буквально глагол означает «пошли/отпусти меня»; здесь Давид просит Ионафана разрешить ему уйти и отсутствовать. Противительный союз естественно выражает смысловой поворот.
- source_word: וְנִסְתַּרְתִּי
  choice: и я скроюсь
  rationale: Сохраняет последовательность еврейских глагольных форм и выражает намеренный результат просьбы без излишнего уточнения синтаксической связи.
- source_word: בַשָּׂדֶה
  choice: в поле
  rationale: Прямой и естественный эквивалент единственного числа существительного.
- source_word: עַד הָעֶרֶב הַשְּׁלִשִׁית
  choice: до третьего вечера
  rationale: Сохраняет эллиптичность и необычность еврейского выражения; вероятный смысл пояснён в примечании, а не внесён в основной текст.
