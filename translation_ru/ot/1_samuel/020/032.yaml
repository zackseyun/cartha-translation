lexical_decisions:
- source_word: וַיַּעַן
  choice: ответил
  rationale: Глагол ענה в повествовательной формуле означает ответ на предшествующие слова; «ответил» естественно передаёт диалогический контекст.
- source_word: יְהוֹנָתָן
  choice: Ионафан
  rationale: Традиционная русская форма библейского личного имени.
- source_word: אֶת שָׁאוּל אָבִיו
  choice: своему отцу Саулу
  rationale: Передаёт объект действия и приложение «Саул, его отец» естественным современным русским порядком слов.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: ответил … Саулу
  rationale: Отдельное «и сказал ему» в русском создало бы тяжеловесное дублирование. Адресат сохранён в конструкции с «ответил», а переход к прямой речи выражен двоеточием.
- source_word: לָמָּה
  choice: за что
  rationale: В данном контексте вопрос касается основания для смертного приговора; «за что» естественно связано со следующим вопросом о совершённом поступке, не устраняя значения «почему».
- source_word: יוּמַת
  choice: предавать его смерти
  rationale: Хофаль глагола מות имеет каузативно-пассивное значение «быть преданным смерти», а не просто «умереть». Русский инфинитив в вопросе естественно передаёт обсуждаемую необходимость или намерение.
- source_word: מֶה עָשָׂה
  choice: Что он сделал?
  rationale: Кратко и естественно передаёт вопрос о проступке, который мог бы послужить основанием для казни.
