base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/012.yaml
  text: And Jonathan said to David[a], “As Yahweh, the God of Israel, lives, when I sound out my father about this time tomorrow, or the third day, and behold, if it is favorable toward David[c][b], shall I not then send to you and uncover your ear?"
translation:
  language: ru
  text: 'Ионафан сказал Давиду: «Яхве, Бог Израиля, свидетель[a]: когда я завтра примерно в это время или на третий день[b] выведаю у отца, как он настроен, и окажется, что он благосклонен к Давиду, разве я не пошлю к тебе и не дам тебе знать?[c]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская фраза после имени Бога эллиптична и трудна для синтаксического разбора; по смыслу Ионафан торжественно призывает Яхве в свидетели своего обещания.
    reason: textual_difficulty
  - marker: b
    text: 'Временное выражение в еврейском тексте сжато; возможен также перевод: «завтра примерно в это время, на третий день».'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «и не открою твое ухо» — еврейская идиома со значением «сообщить, открыть кому-либо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом.
- source_word: אֶחְקֹר אֶת אָבִי
  choice: выведаю у отца, как он настроен
  rationale: Глагол обозначает тщательное выяснение; в контексте Ионафан намерен разузнать отношение Саула к Давиду. Добавление «как он настроен» естественно выражает подразумеваемый предмет выяснения.
- source_word: כָּעֵת מָחָר הַשְּׁלִשִׁית
  choice: завтра примерно в это время или на третий день
  rationale: Сжатое еврейское временное выражение допускает не вполне однозначное членение; перевод сохраняет оба временных ориентира и отмечает трудность в сноске.
- source_word: טוֹב אֶל דָּוִד
  choice: он благосклонен к Давиду
  rationale: Сочетание טוֹב с אֶל здесь описывает благоприятное отношение Саула к Давиду, а не просто абстрактное «добро».
- source_word: וְלֹא אָז אֶשְׁלַח אֵלֶיךָ
  choice: разве я не пошлю к тебе
  rationale: Трудная отрицательная конструкция понята как риторическое заверение в рамках торжественного обещания; вопросительная форма сохраняет ее силу, не превращая в простое утверждение.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: и не дам тебе знать
  rationale: Буквальная метафора «открою твое ухо» в современном русском не передает идиоматический смысл достаточно ясно; он выражен естественным эквивалентом, а образ сохранен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, присутствующее в исходном тексте, без подмены его титулом.
- issue: Эллиптическое призывание Бога в начале клятвенного заверения
  choice: «Яхве, Бог Израиля, свидетель»
  alternative: «Жив Яхве, Бог Израиля»; «Яхве, Бог Израиля…» без восполнения
  rationale: После имени Бога еврейская фраза синтаксически сжата. Формула со «свидетелем» ясно передает торжественный характер обещания, не приписывая тексту содержание, выходящее за рамки клятвенного контекста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным тоном. Эллипсис исходного текста умеренно восполнен ради ясности; временная неоднозначность и буквальный образ идиомы вынесены в сноски.
