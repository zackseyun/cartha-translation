  - severity: high
    issue: Риторический вопрос «разве я не пошлю к тебе и не дам тебе знать?»
    rationale: В еврейском тексте нет вопросительной частицы. Отрицание относится к условно-клятвенному протазису, чьё последствие следует в 1 Царств 20:13. Вопрос меняет условие на заверение в противоположном действии.
  - severity: medium
    issue: «Яхве, Бог Израиля, свидетель» подано без оговорки как прямое содержание текста
    rationale: Еврейская формула после божественного имени эллиптична и синтаксически трудна; «свидетель» — традиционное и вероятное восполнение, но не лексически выраженное слово.
  - severity: low
