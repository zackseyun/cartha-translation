  source_fidelity: 'Смысловой каркас передан верно: Давид просит Ионафана о хеседе, ссылается на заключённый ими завет, предлагает тому самому умертвить его при наличии вины и риторически отвергает передачу Саулу. Однако сноска b вводит вариант «в завет перед Яхве», который не является прямым переводом בִּבְרִית יְהוָה и чрезмерно меняет конструкцию. «Вместе с собой» в прямом обращении также менее естественно, чем «вместе с тобой».'
