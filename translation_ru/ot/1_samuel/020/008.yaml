  terminology: «Яхве» последовательно передаёт יהוה. «Раб» оправдан как почтительное самообозначение в данном речевом контексте. «Завет» точно передаёт בְּרִית. Для חֶסֶד уместны «милость», «верная доброта» и «верность» в сноске, без навязывания узкого богословского толкования.
