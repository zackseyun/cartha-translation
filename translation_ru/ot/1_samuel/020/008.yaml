  text: וְ/עָשִׂ֤יתָ חֶ֨סֶד֙ עַל עַבְדֶּ֔/ךָ כִּ֚י בִּ/בְרִ֣ית יְהוָ֔ה הֵבֵ֥אתָ אֶֽת עַבְדְּ/ךָ֖ עִמָּ֑/ךְ וְ/אִם יֶשׁ בִּ֤/י עָוֺן֙ הֲמִיתֵ֣/נִי אַ֔תָּה וְ/עַד אָבִ֖י/ךָ לָ/מָּה זֶּ֥ה תְבִיאֵֽ/נִי־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/008.yaml
  text: So show kindness to your servant[a], for you have brought your servant into the covenant of Yahweh with yourself. But if there is guilt in me, put me to death yourself[b]; why should you bring me to your father?
translation:
  language: ru
  text: Итак, окажи милость своему рабу[a], ведь ты ввёл своего раба вместе с тобой в завет Яхве[b]. Если же во мне есть вина, умертви меня сам; зачем тебе приводить меня к твоему отцу?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «окажи верную доброту своему рабу». Еврейское חֶסֶד может означать милость, преданную доброту и верность, особенно в отношениях, скреплённых заветом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в завет Яхве». Выражение обозначает завет, связанный с Яхве; в данном стихе не уточняется полностью характер этой связи.'
    reason: preserved_ambiguity
lexical_decisions:
- source_word: וְעָשִׂיתָ חֶסֶד עַל עַבְדֶּךָ
  choice: прояви милость к рабу твоему
  rationale: Сочетание עשה חסד обозначает оказание милости, преданной доброты или верности. «Прояви милость» естественно по-русски и сохраняет широкий смысл חֶסֶד, тогда как контекст завета подчёркивает оттенок верности.
- source_word: עַבְדְּךָ
  choice: раб твой
  rationale: Здесь עבד служит почтительным самообозначением Давида в обращении к Ионафану. Традиционная и понятная формула «раб твой» передаёт этот речевой регистр, не сводя слово исключительно к имущественному рабству.
- source_word: בִּבְרִית יְהוָה הֵבֵאתָ אֶת עַבְדְּךָ עִמָּךְ
  choice: ты ввёл раба твоего вместе с собой в завет Яхве
  rationale: Каузативная форма בוא означает «ввести, привести», а עִמָּךְ — «с тобой, вместе с собой». Формулировка сохраняет образ вхождения Давида в заветную связь вместе с Ионафаном и не заменяет исходную конструкцию более определённым толкованием.
- source_word: וְאִם יֶשׁ בִּי עָוֹן
  choice: если же на мне есть вина
  rationale: עָוֹן может обозначать беззаконие, вину или ответственность за проступок. В данном условии речь идёт о действительной виновности Давида; оборот «на мне есть вина» сохраняет предметный характер еврейской формулировки.
- source_word: הֲמִיתֵנִי אַתָּה
  choice: умертви меня сам
  rationale: Глагол передаёт причинение смерти, а отдельное местоимение אַתָּה эмфатично. «Сам» сохраняет противопоставление Ионафана его отцу.
- source_word: וְעַד אָבִיךָ לָמָּה זֶּה תְבִיאֵנִי
  choice: зачем тебе вести меня к твоему отцу?
  rationale: Риторический вопрос противопоставляет непосредственное действие Ионафана передаче Давида Саулу. Русская формулировка ясно передаёт это, а וְעַד в контексте имеет направительный смысл «до, к».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя יהוה, а не титул. Транслитерация «Яхве» сохраняет различие между именем Бога и словом «Господь».
- issue: Характер выражения בִּבְרִית יְהוָה
  choice: завет Яхве
  alternative: завет перед Яхве
  rationale: Родительная конструкция буквально связывает завет с Яхве, но не уточняет исчерпывающе, выступает ли Он его непосредственной стороной, свидетелем или гарантом. Основной текст сохраняет краткость и неоднозначность оригинала, а примечание указывает допустимый оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Почтительное самообозначение «раб твой» сохранено, но синтаксис сделан понятным современному читателю. Союз «итак» передаёт связь просьбы с предшествующим контекстом.
