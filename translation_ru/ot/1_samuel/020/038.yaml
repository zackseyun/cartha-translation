  yaml_path: translation/ot/1_samuel/020/038.yaml
  text: And Jonathan called after the boy[b][a], “Hurry! Be quick! Do not stop!” So Jonathan’s boy gathered up the arrows and came to his master.
translation:
  language: ru
  text: 'Ионафан крикнул вслед своему юному слуге: «Скорее! Поспеши! Не останавливайся!» Юный слуга Ионафана собрал стрелы[a] и пришёл к своему господину.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское написание слова «стрелы» может выглядеть как форма единственного числа, однако контекст ясно указывает на несколько стрел, выпущенных Ионафаном.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אַחֲרֵי הַנַּעַר
  choice: крикнул ... вслед отроку
  rationale: קרא с אַחֲרֵי означает громко окликнуть удаляющегося человека; «крикнул вслед» естественно передаёт ситуацию. נַעַר — юный помощник, поэтому выбрано «отрок», сохраняющее возрастной и служебный оттенок.
- source_word: מְהֵרָה חוּשָׁה
  choice: Скорее! Поспеши!
  rationale: Два отдельных побуждения сохраняют удвоенную срочность еврейского текста, не сливая её в одну команду.
- source_word: אַל תַּעֲמֹד
  choice: Не останавливайся!
  rationale: Буквально «не стой», но в контексте это призыв продолжать двигаться без остановки; русский вариант передаёт контекстуальный смысл.
- source_word: וַיְלַקֵּט
  choice: собрал
  rationale: לקט обозначает собирание предметов по одному; «собрал» естественно описывает поднятие выпущенных стрел.
- source_word: החצי
  choice: стрелы
  rationale: Несмотря на необычное написание формы, повествовательный контекст указывает на несколько стрел, выпущенных Ионафаном.
- source_word: אֶל אֲדֹנָיו
  choice: к своему господину
  rationale: אָדוֹן здесь обозначает человеческого хозяина или начальника отрока — Ионафана; «господин» соответствует социальному отношению без богословского смысла.
