base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/002.yaml
  text: He said to him[a], “Far from it! You will not die. Look, my father does nothing, great or small, without revealing it to me. So why would my father hide this matter from me? It is not so.”
translation:
  language: ru
  text: 'Он сказал ему: «Ни в коем случае! Ты не умрёшь. Ведь мой отец не делает ничего — ни большого, ни малого, — не сообщив мне об этом[a]. Зачем же моему отцу скрывать от меня это дело? Нет, это не так».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не открывает мне ухо»; это еврейская идиома со значением «не сообщает мне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה
  choice: Ни в коем случае!
  rationale: Сильное идиоматическое отрицание. Такой перевод естественен в современном русском языке и не добавляет упоминания Бога, которого нет в еврейском выражении.
- source_word: לֹא תָמוּת
  choice: Ты не умрёшь
  rationale: Прямое заверение Ионафана, переданное ясно и без архаической модальности.
- source_word: הִנֵּה
  choice: Ведь
  rationale: В данном контексте частица привлекает внимание к основанию сказанного; «ведь» естественно вводит последующее объяснение.
- source_word: דָּבָר גָּדוֹל אוֹ דָּבָר קָטֹן
  choice: ничего — ни большого, ни малого
  rationale: Сохранён меризм, обозначающий всё без исключения, а также контраст большого и малого.
- source_word: וְלֹא יִגְלֶה אֶת אָזְנִי
  choice: не открыв этого мне
  rationale: Передан смысл еврейской идиомы — сообщить или открыть кому-либо нечто; буквальный образ вынесен в сноску.
- source_word: יַסְתִּיר
  choice: скрывать
  rationale: Прямой и естественный эквивалент каузативной формы со значением сокрытия.
- source_word: הַדָּבָר הַזֶּה
  choice: это дело
  rationale: דָּבָר здесь обозначает обсуждаемое намерение или обстоятельство, а не только произнесённое слово.
- source_word: אֵין זֹאת
  choice: Нет, это не так
  rationale: Передаёт заключительное решительное отрицание Ионафаном утверждения Давида.
- source_word: אָבִי
  choice: мой отец
  rationale: Повтор существительного с притяжательным суффиксом сохранён для смысловой ясности и акцента.
theological_decisions:
- issue: Характер слов «Ты не умрёшь»
  choice: Сохранено как прямое уверенное заявление Ионафана
  alternative: Передать как обещание или богословски гарантированное пророчество
  rationale: Еврейский текст выражает убеждённое заверение персонажа, но сам по себе не определяет его как божественное обещание или пророчество.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис остаётся доступным, повтор «мой отец» сохранён, а непрозрачная еврейская идиома передана по смыслу и пояснена в сноске.
