  yaml_path: translation/ot/1_samuel/020/011.yaml
  text: Then Jonathan said to David[a], “Come, and let us go out into the field.” So both of them went out into the field.
translation:
  language: ru
  text: 'Тогда Ионафан сказал Давиду: «Пойдём, выйдем в поле». И они оба вышли в поле.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: יְהוֹנָתָן
  choice: Ионафан
  rationale: Традиционная и общепонятная русская форма библейского имени.
- source_word: אֶל דָּוִד
  choice: Давиду
  rationale: Русский дательный падеж после «сказал» естественно передаёт адресата, обозначенного אֶל.
- source_word: לְכָה וְנֵצֵא
  choice: Пойдём, выйдем
  rationale: Императив לְכָה в приглашении к совместному движению и когортатив וְנֵצֵא естественно передаются двумя согласованными формами совместного побуждения.
- source_word: הַשָּׂדֶה
  choice: в поле
  rationale: שׂדה обозначает поле или открытую местность; в данном контексте краткое «в поле» точно и естественно передаёт направление движения.
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: И они оба вышли
  rationale: Сохраняются развитие повествования и подчёркнутое указание на обоих участников.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; простой, повествовательный и достойный регистр. Повтор слова «поле» сохранён вслед за еврейским текстом. Формулировка «Пойдём, выйдем» передаёт приглашение двигаться вместе без ненужной буквальности.
