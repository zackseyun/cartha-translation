  yaml_path: translation/ot/1_samuel/020/039.yaml
  text: But the boy did not know anything[a]; only Jonathan and David knew the matter.
translation:
  language: ru
  text: Но мальчик ничего не знал; только Ионафан и Давид знали об этом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: Но слуга
  rationale: נַעַר может обозначать мальчика, юношу или слугу. В данном контексте речь идёт о юном помощнике Ионафана; «слуга» естественно передаёт его роль. Союз וְ имеет здесь противительное значение, поскольку незнание слуги противопоставлено знанию Ионафана и Давида.
- source_word: לֹא יָדַע מְאוּמָה
  choice: ничего не знал
  rationale: В отрицательной конструкции מְאוּמָה означает «ничего», а יָדַע сохраняет обычное значение «знать».
- source_word: אַךְ
  choice: только
  rationale: 'Частица выражает ограничение: знали лишь Ионафан и Давид.'
- source_word: יְהוֹנָתָן וְדָוִד
  choice: Ионафан и Давид
  rationale: Имена переданы в их устоявшейся русской библейской форме.
- source_word: יָדְעוּ אֶת־הַדָּבָר
  choice: знали, в чём дело
  rationale: דָּבָר здесь обозначает известное Ионафану и Давиду дело или обстоятельство. Русское выражение «знали, в чём дело» естественно передаёт смысл, не уточняя сверх исходного текста характер их договорённости.
