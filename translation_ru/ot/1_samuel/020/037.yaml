base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/037.yaml
  text: When the boy came to the place of the arrow that Jonathan had shot[a], Jonathan called after the boy and said, “Is not the arrow beyond you?”
translation:
  language: ru
  text: 'Когда мальчик дошёл до места, где лежала стрела, которую пустил Ионафан, Ионафан крикнул ему вслед: «Разве стрела не дальше тебя?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве стрела не за тобой?» Буквально: «от тебя и далее».'
    reason: Сноска сохраняет буквальный пространственный образ выражения מִמְּךָ וָהָלְאָה и естественный русский вариант без истолкования условного сигнала.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: дошёл
  rationale: Глагол בוא обозначает прибытие; в сочетании с עַד естественное русское «дошёл до» точно передаёт движение к указанному месту.
- source_word: הַנַּעַר
  choice: мальчик
  rationale: נַעַר может означать юношу, мальчика или молодого слугу; в данном эпизоде речь о юном помощнике Ионафана, и «мальчик» соответствует ближайшему контексту.
- source_word: עַד מְקוֹם הַחֵצִי אֲשֶׁר יָרָה יְהוֹנָתָן
  choice: до того места, куда Ионафан пустил стрелу
  rationale: Русская конструкция естественно выражает место, до которого дошёл мальчик, и предшествующий выстрел; «пустил стрелу» идиоматично передаёт ירה в этом контексте.
- source_word: וַיִּקְרָא ... אַחֲרֵי
  choice: крикнул ему вслед
  rationale: קרא с אַחֲרֵי означает окликнуть движущегося впереди человека; местоимение делает русскую фразу ясной без изменения смысла.
- source_word: הֲלוֹא
  choice: разве ... не
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ; конструкция «разве не» естественна в современном русском.
- source_word: מִמְּךָ וָהָלְאָה
  choice: дальше тебя
  rationale: Буквально выражение означает «от тебя и далее»; «дальше тебя» сохраняет пространственный смысл и не устраняет намеренно подаваемый Давиду условный сигнал.
