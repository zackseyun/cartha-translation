base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/006.yaml
  text: If your father surely notices me[a], then say, ‘David earnestly asked leave of me to run to Bethlehem, his city[d][c][b], because the yearly sacrifice is there for the whole family.’
translation:
  language: ru
  text: 'Если твой отец непременно заметит, что меня нет[a], скажи: «Давид настоятельно просил у меня разрешения поспешить в Вифлеем, свой город[b], потому что там совершается ежегодная жертва для всего рода[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непременно хватится меня». В еврейском тексте глагольная конструкция выражает усиление.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «побежать в Вифлеем, свой город»; по смыслу — поспешно отправиться туда.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «для всей семьи». Еврейское слово может обозначать как семью, так и более широкий род.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקֹד יִפְקְדֵנִי
  choice: непременно заметит, что меня нет
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает глагол. В контексте Саул замечает отсутствие Давида за столом; перевод естественно передаёт и наблюдение, и подразумеваемое отсутствие.
- source_word: נִשְׁאֹל נִשְׁאַל מִמֶּנִּי
  choice: настоятельно просил у меня разрешения
  rationale: Эмфатическая конструкция подчёркивает настойчивость просьбы; контекст требует именно разрешения уйти.
- source_word: לָרוּץ
  choice: поспешить
  rationale: Буквально глагол означает «бежать», но здесь обозначает поспешное отправление в Вифлеем; «поспешить» естественно передаёт смысл по-русски, сохраняя оттенок срочности.
- source_word: בֵּית לֶחֶם עִירוֹ
  choice: Вифлеем, свой город
  rationale: Сохранена аппозиция оригинала и отнесение города к Давиду; более естественное «родной город» возможно, но несколько уточняет смысл.
- source_word: זֶבַח הַיָּמִים
  choice: ежегодная жертва
  rationale: Выражение указывает на регулярно совершаемую, вероятнее всего ежегодную, жертву.
- source_word: לְכָל הַמִּשְׁפָּחָה
  choice: для всего рода
  rationale: מִשְׁפָּחָה может обозначать не только ближайшую семью, но и более широкий родовой круг; в рассказе о жертве в родном городе «род» сохраняет эту широту.
