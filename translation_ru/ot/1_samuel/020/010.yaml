lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Форма с повествовательным וַ продвигает рассказ вперёд; «тогда» естественно передаёт последовательность событий.
- source_word: דָּוִד אֶל־יְהוֹנָתָן
  choice: Давид сказал Ионафану
  rationale: Имена переданы в традиционной русской библейской форме; предлог אֶל при глаголе речи естественно выражен дательным падежом.
- source_word: מִי יַגִּיד לִי
  choice: Кто сообщит мне?
  rationale: Hiphil глагола נגד означает «сообщить, объявить, рассказать». «Сообщит» ясно передаёт получение Давидом известия и сохраняет отдельный вопрос.
- source_word: אוֹ
  choice: Или
  rationale: Сохранено прямое разделительное значение союза, хотя следующая фраза в еврейском тексте синтаксически сжата.
- source_word: מַה יַּעַנְךָ אָבִיךָ קָשָׁה
  choice: что, если твой отец ответит тебе сурово?
  rationale: Формулировка делает понятным вероятный условный смысл сжатой фразы, при этом словом «что» отражает מַה, а «сурово» передаёт наречное употребление קָשָׁה.
