source:
  edition: WLC
  text: וְ/הִנֵּה֙ אֶשְׁלַ֣ח אֶת הַ/נַּ֔עַר לֵ֖ךְ מְצָ֣א אֶת הַ/חִצִּ֑ים אִם אָמֹר֩ אֹמַ֨ר לַ/נַּ֜עַר הִנֵּ֥ה הַ/חִצִּ֣ים מִמְּ/ךָ֣ וָ/הֵ֗נָּה קָחֶ֧/נּוּ וָ/בֹ֛אָ/ה כִּֽי שָׁל֥וֹם לְ/ךָ֛ וְ/אֵ֥ין דָּבָ֖ר חַי יְהוָֽה־־־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/021.yaml
  text: And look[a], I will send the young man, saying, ‘Go, find the arrows.’ If I plainly say to the young man, ‘Behold, the arrows are on this side of you; take them and come,’ then there is peace for you and no danger[b], as Yahweh lives.
translation:
  language: ru
  text: 'И вот, я пошлю юношу и скажу: «Пойди, найди стрелы». Если я прямо скажу юноше: «Вот, стрелы по эту сторону от тебя[a]; возьми их и приходи», — значит, для тебя всё благополучно и никакой опасности нет, жив Яхве[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «стрелы ближе, чем ты». Древнееврейская фраза означает, что стрелы упали, не долетев до юноши, а не за ним.'
    reason: lexical_alternative
  - marker: b
    text: «Жив Яхве» — древнееврейская формула клятвенного заверения, подтверждающая истинность сказанного.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет указательно-презентативную силу הִנֵּה и при этом звучит естественно в современном русском повествовании.
- source_word: אֶשְׁלַח אֶת־הַנַּעַר
  choice: я пошлю юношу
  rationale: נַעַר может обозначать мальчика, юношу или слугу-помощника. «Юноша» сохраняет возрастно-статусную неопределённость, не вводя прямо не названного отношения служения.
- source_word: לֵךְ מְצָא אֶת־הַחִצִּים
  choice: Пойди, найди стрелы
  rationale: Прямая речь естественно передаёт поручение; «найди» непосредственно соответствует מְצָא.
- source_word: אִם אָמֹר אֹמַר
  choice: Если я прямо скажу
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает высказывание. «Прямо скажу» передаёт подчёркнутую ясность условного сигнала без тяжеловесного буквализма.
- source_word: הִנֵּה הַחִצִּים מִמְּךָ וָהֵנָּה
  choice: Вот, стрелы по эту сторону от тебя
  rationale: Фраза указывает, что стрелы лежат ближе к говорящему, не перелетев юношу; перевод сохраняет пространственный сигнал и его противопоставление следующему стиху.
- source_word: קָחֶנּוּ
  choice: возьми их
  rationale: Хотя местоименный суффикс формально стоит в единственном числе, смысловым предшественником являются «стрелы», поэтому в русском требуется множественное число.
- source_word: וָבֹאָה
  choice: и приходи
  rationale: Направительная форма выражает движение обратно к говорящему; «приходи» передаёт это без добавления отсутствующего в тексте дополнения.
- source_word: כִּי שָׁלוֹם לְךָ
  choice: значит, для тебя всё благополучно
  rationale: שָׁלוֹם здесь обозначает безопасность и благополучный исход для Давида. Формулировка сохраняет более широкий смысл слова, не сводя его только к отсутствию нападения.
- source_word: וְאֵין דָּבָר
  choice: и никакой опасности нет
  rationale: Буквально דָּבָר может значить «дело, обстоятельство, нечто»; в данном сигнальном контексте речь идёт об отсутствии угрозы. Перевод ясно выражает прагматический смысл.
- source_word: חַי יְהוָה
  choice: жив Яхве
  rationale: Сохранена краткая древнееврейская формула клятвенного заверения, естественная и узнаваемая в русском библейском регистре.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон. «Яхве» передаёт личное заветное имя, не заменяя его титулом и не навязывая конфессионально особую интерпретацию.
- issue: Сила формулы חַי יְהוָה
  choice: жив Яхве
  alternative: как верно то, что Яхве жив; клянусь живым Яхве
  rationale: Краткая форма сохраняет одновременно буквальный образ и клятвенную функцию, не превращая подразумеваемое заверение в более развёрнутое высказывание основного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для устного сигнала, а пространственная формула оставлена достаточно буквальной, чтобы сохранить её роль в противопоставлении следующему стиху.
