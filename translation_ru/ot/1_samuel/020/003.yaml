base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/003.yaml
  text: But David swore again and said, “Your father certainly knows that I have found favor in your eyes, and he has said, ‘Jonathan must not know this, lest he be grieved.’ But as the LORD lives, and as your soul lives, there is only a step between me and death.”
translation:
  language: ru
  text: 'Но Давид снова поклялся и сказал: «Твой отец прекрасно знает, что я снискал твоё расположение, и сказал: „Пусть Ионафан не узнает об этом, чтобы не огорчился“. Но жив ГОСПОДЬ и жива душа твоя: между мной и смертью — лишь шаг».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדֹעַ יָדַע
  choice: хорошо знает
  rationale: Инфинитив абсолютный с личной формой усиливает утверждение; по-русски естественно передаётся наречием «хорошо», сохраняя смысл несомненного знания.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: я обрёл благосклонность в твоих глазах
  rationale: Сохранена библейская идиома, понятная в современном литературном русском и указывающая на расположение Ионафана к Давиду.
- source_word: אַל יֵדַע זֹאת יְהוֹנָתָן
  choice: Пусть Ионафан не знает об этом
  rationale: Юссивное отрицание передано не как сообщение о факте, а как выражение намерения Саула скрыть дело от Ионафана.
- source_word: חַי יְהוָה וְחֵי נַפְשֶׁךָ
  choice: жив ГОСПОДЬ и жива твоя душа
  rationale: Формула клятвы сохранена близко к еврейскому тексту; имя יהוה передано традиционным обозначением «ГОСПОДЬ».
- source_word: כְפֶשַׂע
  choice: всего один шаг
  rationale: Образ крайне малого расстояния передан естественной русской фразой без ослабления непосредственной угрозы смерти.
theological_decisions:
- issue: Передача имени יהוה в клятвенной формуле
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Традиционная русская передача тетраграмматона сохраняет узнаваемость библейской формулы и не вводит конфессионально специфического решения.
- issue: Логическая связь слов Саула с его знанием о дружбе Давида и Ионафана
  choice: и потому думает
  alternative: и сказал
  rationale: Еврейское וַיֹּאמֶר буквально допускает «и сказал», но в данном внутреннем рассуждении естественно означает «подумал/решил»; «потому» явно выражает контекстуальную причинную связь, не меняя содержания.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Клятвенная формула и образ «между мной и смертью» сохранены, тогда как синтаксис сделан естественным для обычного читателя.
