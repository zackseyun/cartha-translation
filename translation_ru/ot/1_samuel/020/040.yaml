  text: Then Jonathan gave his weapons to the young man who was with him and said to him[a], “Go[c][b], bring them to the city.”
translation:
  language: ru
  text: 'Тогда Ионафан отдал своё оружие юноше, который был при нём[a], и сказал ему: «Иди, отнеси его[b] в город».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своему слуге». Еврейское выражение обозначает юношу, состоявшего при Ионафане.'
