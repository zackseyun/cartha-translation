lexical_decisions:
- source_word: וַיִּתֵּן
  choice: отдал
  rationale: Обычная повествовательная форма от נתן; «отдал» естественно передаёт передачу предметов другому лицу.
- source_word: יְהוֹנָתָן
  choice: Ионафан
  rationale: Традиционная русская библейская форма имени.
- source_word: כֵּלָיו
  choice: своё оружие
  rationale: כְּלִי может означать утварь, снаряжение или оружие; контекст лука и стрел поддерживает значение «оружие». Русское собирательное единственное число сохраняет широкий оттенок исходного слова.
- source_word: הַנַּעַר אֲשֶׁר לוֹ
  choice: юноше, который служил ему
  rationale: נַעַר обозначает юношу или молодого слугу, а אֲשֶׁר לוֹ выражает принадлежность к Ионафану. Такая формулировка естественна по-русски и передаёт роль личного помощника без указания точного служебного статуса.
- source_word: וַיֹּאמֶר לוֹ
  choice: и сказал ему
  rationale: Прямое и нейтральное соответствие обычному глаголу אמר.
- source_word: לֵךְ
  choice: Иди
  rationale: Прямое соответствие повелительной форме הלך.
- source_word: הָבֵיא
  choice: отнеси его
  rationale: Каузативная форма בוא обычно значит «принеси», но при движении от говорящего в город по-русски естественнее «отнеси». Объект, не выраженный в еврейском тексте, восстановлен по слову «оружие».
- source_word: הָעִיר
  choice: в город
  rationale: Определённое הָעִיר буквально означает «город» с артиклем; в русском после глагола движения естественно «в город», без неоправданного уточнения места.
