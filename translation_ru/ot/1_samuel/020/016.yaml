  yaml_path: translation/ot/1_samuel/020/016.yaml
  text: So Jonathan made a covenant with the house of David, and the LORD sought it from the hand of David’s enemies.
translation:
  language: ru
  text: Ионафан заключил завет с домом Давида, и пусть Господь взыщет с врагов Давида![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейскую форму второй части можно также понимать как повествовательную: «и Господь взыскал с врагов Давида». Что именно должно быть взыскано, в тексте прямо не сказано. В контексте завета возможен смысл призыва к Богу потребовать ответа за его нарушение.'
    reason: Сохраняет грамматическую и смысловую неоднозначность формы בִּקֵּשׁ и отсутствие прямо выраженного дополнения, не выдавая один вариант за несомненный.
lexical_decisions:
- source_word: וַיִּכְרֹת ... עִם
  choice: заключил ... завет с
  rationale: Буквально «отсёк/срезал с»; это устойчивое древнееврейское выражение со значением «заключить завет». Слово «завет» подразумевается конструкцией и естественно восполняется по-русски.
- source_word: בֵּית דָּוִד
  choice: домом Давида
  rationale: Сохраняет династический и семейно-родовой смысл выражения, не сужая его до самого Давида.
- source_word: וּבִקֵּשׁ יְהוָה
  choice: Пусть Господь взыщет
  rationale: В контексте заключения завета форма передаёт призыв к Богу потребовать ответа за нарушение обязательства. «Взыщет» сохраняет судебно-заветный оттенок глагола בקש.
- source_word: מִיַּד אֹיְבֵי דָוִד
  choice: с врагов Давида
  rationale: Древнееврейское «из руки врагов Давида» здесь обозначает взыскание ответственности с них; русское «взыскать с» естественно передаёт смысл.
theological_decisions:
- issue: Значение второй части стиха и невыраженное дополнение при בִּקֵּשׁ
  choice: 'Передать как обращённое к Богу заветное пожелание: «Пусть Господь взыщет с врагов Давида!»'
  alternative: «И Господь взыскал это с врагов Давида»
  rationale: Контекст завета и грамматическая возможность волевого оттенка поддерживают понимание как формулы призыва к Божьему суду. При этом еврейский текст не называет прямо, что именно должно быть взыскано, поэтому дополнение «это» в основной текст не внесено, а неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «заключил завет» общеупотребительна и точна; «взыщет» слегка возвышенно, но понятно и уместно для судебно-заветного контекста.
