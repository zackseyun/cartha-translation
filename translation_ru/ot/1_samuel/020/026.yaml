base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/026.yaml
  text: But Saul did not say anything that day[a], for he thought, “Something has happened; he is not clean—surely he is not clean.”
translation:
  language: ru
  text: 'Но в тот день Саул ничего не сказал, потому что подумал: «Что-то случилось; он нечист[a] — наверняка нечист».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть ритуально нечист. В контексте этой трапезы еврейское выражение относится к обрядовой чистоте.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... מְאוּמָה
  choice: ничего не сказал
  rationale: Естественная русская передача сочетания глагола речи с отрицательным местоимением; по смыслу Саул никак не прокомментировал отсутствие Давида.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Стандартное и естественное временное выражение, точно сохраняющее указание еврейского текста.
- source_word: כִּי אָמַר
  choice: потому что подумал
  rationale: Хотя אָמַר буквально означает «сказал», контекст передаёт внутреннее рассуждение Саула; «подумал» естественно выражает это по-русски.
- source_word: מִקְרֶה הוּא
  choice: Что-то случилось
  rationale: מִקְרֶה обозначает происшествие или случай. Безличная формулировка сохраняет отсутствие явного дополнения в еврейском тексте и не добавляет «с ним».
- source_word: בִּלְתִּי טָהוֹר הוּא
  choice: он нечист
  rationale: Кратко и близко передаёт отрицание ритуальной чистоты; конкретный обрядовый смысл пояснён в сноске.
- source_word: כִּי לֹא טָהוֹר
  choice: да, нечист
  rationale: Повтор усиливает уверенность Саула. Частица «да» передаёт подтверждающе-эмфатическую силу, не превращая כִּי в отдельное причинное объяснение.
theological_decisions:
- issue: Характер нечистоты, выраженной словом טָהוֹר
  choice: В основном тексте сохранено общее слово «нечист», а ритуальный смысл пояснён в сноске.
  alternative: «ритуально нечист» непосредственно в основном тексте; либо нравственная нечистота.
  rationale: В контексте трапезы в новомесячие речь естественнее всего идёт об обрядовой нечистоте, препятствующей участию в трапезе. Однако сам еврейский текст использует общее слово, поэтому уточнение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно dignified повествовательным регистром. Повтор «нечист» сохранён как значимый элемент внутреннего рассуждения Саула; тире не вводилось, чтобы не усиливать синтаксическую интерпретацию сверх источника.
