base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/001.yaml
  text: Then David fled from Naioth in Ramah and came before Jonathan and said[a], “What have I done? What is my guilt, and what is my sin before your father, that he is seeking my life?”
translation:
  language: ru
  text: 'Давид убежал из Навиота в Раме[a], пришёл к Ионафану и сказал: «Что я сделал? В чём моя вина? В чём мой грех перед твоим отцом, что он посягает на мою жизнь?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «из Навиота при Раме». Еврейский текст, вероятно, называет известное место Навиот, связанное с Рамой.'
    reason: лексическая альтернатива и неоднозначность пространственной связи
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: бежал
  rationale: Передаёт бегство от опасности кратко и естественно, не уточняя способ бегства.
- source_word: מִנָּוֹת בָּרָמָה
  choice: из Навиота в Раме
  rationale: В контексте נוות понимается как название места; форма «в Раме» сохраняет пространственную связь, выраженную предлогом ב.
- source_word: וַיָּבֹא ... לִפְנֵי יְהוֹנָתָן
  choice: пришёл к Ионафану
  rationale: Естественное русское выражение движения к человеку; значение «в присутствие Ионафана» передаётся контекстом встречи.
- source_word: מֶה עָשִׂיתִי
  choice: Что я сделал?
  rationale: Прямо и естественно передаёт первый риторический вопрос Давида.
- source_word: מֶה עֲוֺנִי
  choice: В чём моя вина?
  rationale: עָוֹן здесь обозначает вину или проступок; вопросительная конструкция звучит по-русски естественно и сохраняет судебно-оправдательный оттенок.
- source_word: וּמֶה חַטָּאתִי
  choice: Чем я согрешил
  rationale: Глагольная формулировка сохраняет нравственный смысл חטא и не смешивает его с предшествующим понятием вины.
- source_word: לִפְנֵי אָבִיךָ
  choice: перед твоим отцом
  rationale: Сохраняет буквальный образ «перед» и допускает значения «в его глазах» и «по отношению к нему», не устраняя неоднозначность.
- source_word: מְבַקֵּשׁ אֶת־נַפְשִׁי
  choice: хочет лишить меня жизни
  rationale: Понятно передаёт еврейскую идиому «ищет моей жизни», то есть стремится убить, без неестественной русской кальки.
theological_decisions: []
