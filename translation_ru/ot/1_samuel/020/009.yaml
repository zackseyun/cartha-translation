  yaml_path: translation/ot/1_samuel/020/009.yaml
  text: Jonathan said[a], “Far be it from you! If I knew for certain that evil had been determined by my father to come upon you, would I not tell you?”
translation:
  language: ru
  text: 'Ионафан сказал: «Ни в коем случае! Если бы я точно узнал, что отец мой окончательно решил причинить тебе зло[a], разве я не сообщил бы тебе об этом?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «что злой замысел против тебя окончательно сложился» или «что зло против тебя уже было решено». Еврейское выражение может означать, что злое намерение Саула стало твёрдым или полностью сформировалось.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לָּךְ
  choice: И думать так не смей!
  rationale: Сильное идиоматическое отрицание с местоимением второго лица. В данном контексте Ионафан решительно отвергает опасение Давида; буквальное «да будет это далеко от тебя» по-русски неестественно.
- source_word: כִּי אִם
  choice: Если бы
  rationale: Вводит условие, связанное с последующим риторическим вопросом; условное наклонение естественно передаёт нереальную для говорящего ситуацию.
- source_word: יָדֹעַ אֵדַע
  choice: я точно узнал
  rationale: Инфинитив абсолютный усиливает личную форму глагола и подчёркивает достоверность знания.
- source_word: כָלְתָה הָרָעָה
  choice: окончательно решил причинить тебе зло
  rationale: Контекстуально выражение указывает на созревшее, твёрдо установившееся злое намерение Саула. Активная русская конструкция ясна, при этом примечание сохраняет более буквальные возможности.
- source_word: מֵעִם אָבִי
  choice: отец мой
  rationale: Предлог указывает на источник намерения; в естественной русской активной конструкции источник передан подлежащим.
- source_word: לָבוֹא עָלֶיךָ
  choice: причинить тебе
  rationale: Передаёт направленность зла против Давида без неоправданного уточнения конкретного способа причинения вреда.
- source_word: וְלֹא אֹתָהּ אַגִּיד לָךְ
  choice: разве я не сообщил бы тебе об этом?
  rationale: Риторический вопрос ожидает утвердительного ответа и сохраняет эмоциональную уверенность Ионафана.
