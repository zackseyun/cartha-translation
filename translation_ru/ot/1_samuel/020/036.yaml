  text: וַ/יֹּ֣אמֶר לְ/נַעֲר֔/וֹ רֻ֗ץ מְצָ֥א נָא֙ אֶת הַ֣/חִצִּ֔ים אֲשֶׁ֥ר אָנֹכִ֖י מוֹרֶ֑ה הַ/נַּ֣עַר רָ֔ץ וְ/הֽוּא יָרָ֥ה הַ/חֵ֖צִי לְ/הַעֲבִרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/036.yaml
  text: He said to his young man[a], “Run, please, find the arrows that I am shooting.” The young man ran, and he shot the arrow beyond him.
translation:
  language: ru
  text: 'Он сказал своему слуге: «Беги, пожалуйста, найди стрелы, которые я пускаю». Слуга побежал, а он пустил стрелу так, что она пролетела дальше него.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мимо него», то есть дальше слуги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ / הַנַּעַר
  choice: своему слуге / слуга
  rationale: נַעַר может обозначать юношу, отрока или слугу-помощника. В данном контексте это сопровождающий Ионафана; «слуга» естественно передаёт его роль, не утверждая рабского положения.
- source_word: רוּץ
  choice: Беги
  rationale: Прямо передаёт повелительную форму глагола רוץ и конкретное действие.
- source_word: מְצָא נָא
  choice: пожалуйста, найди
  rationale: מְצָא означает «найди», а נָא смягчает просьбу или придаёт ей вежливо-настойчивый оттенок.
- source_word: הַחִצִּים
  choice: стрелы
  rationale: Сохраняет множественное число еврейского существительного и его прямое значение.
- source_word: אֲשֶׁר אָנֹכִי מוֹרֶה
  choice: которые я пускаю
  rationale: Причастная форма מוֹרֶה обозначает происходящее или ближайшее действие; о стреле по-русски естественно сказать «пускать стрелу».
- source_word: וְהוּא יָרָה הַחֵצִי
  choice: а он пустил стрелу
  rationale: Союз передан как «а» для естественной смены субъекта. Определённый артикль при единственном числе не требует в русском отдельного выражения; «стрелу» сохраняет единичность действия.
- source_word: לְהַעֲבִירוֹ
  choice: так, что она пролетела дальше него
  rationale: Каузативная форма עבר с местоименным суффиксом указывает, что Ионафан заставил стрелу пройти дальше слуги. Развёрнутая конструкция ясна по-русски и сохраняет направление, важное для условного сигнала.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. «Слуга» выбрано вместо архаичного «отрок»; вежливая частица נָא сохранена словом «пожалуйста».
