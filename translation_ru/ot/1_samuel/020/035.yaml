  yaml_path: translation/ot/1_samuel/020/035.yaml
  text: In the morning[a], Jonathan went out to the field for the appointed meeting with David[b], and a young boy was with him.
translation:
  language: ru
  text: Утром Ионафан вышел в поле на условленную встречу с Давидом[a], и с ним был маленький мальчик[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к назначенному времени, о котором договорились с Давидом». Еврейское מוֹעֵד может означать как назначенное время, так и условленную встречу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «юный слуга». Еврейское נַעַר в зависимости от контекста может обозначать мальчика, юношу или слугу; קָטֹן означает «маленький» или «юный».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Утром
  rationale: Повествовательная формула וַיְהִי вводит следующее событие и в современном русском естественно передаётся временным обстоятельством בַבֹּקֶר без буквального «и было».
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Глагол יצא выражает выход или движение наружу; «вышел» сохраняет эту направленность.
- source_word: יְהוֹנָתָן
  choice: Ионафан
  rationale: Традиционная русская библейская форма имени, соответствующая еврейскому יְהוֹנָתָן.
- source_word: הַשָּׂדֶה
  choice: в поле
  rationale: שָׂדֶה обозначает поле или открытую местность; винительное направление после глагола движения естественно передаётся как «в поле».
- source_word: לְמוֹעֵד דָּוִד
  choice: на условленную встречу с Давидом
  rationale: מוֹעֵד может обозначать назначенное время либо встречу; контекст заранее оговорённого выхода и сигнала поддерживает значение условленной встречи, при этом альтернатива отмечена в сноске.
- source_word: וְנַעַר קָטֹן
  choice: с ним был мальчик
  rationale: נַעַר может означать мальчика, юношу или слугу, а קָטֹן подчёркивает его малый возраст или рост. Русское «мальчик» естественно передаёт сочетание без избыточного «маленький мальчик».
- source_word: עִמּוֹ
  choice: с ним был
  rationale: Предложная форма означает сопровождение; связка «был» добавлена для полноценного и естественного русского предложения.
