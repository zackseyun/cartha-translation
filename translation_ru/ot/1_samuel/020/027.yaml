base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/027.yaml
  text: And it happened on the next day[a], the second day of the new moon, that David’s place was empty. So Saul said to Jonathan his son, “Why has the son of Jesse not come to the meal either yesterday or today?”
translation:
  language: ru
  text: 'На другой день, во второй день новомесячья, место Давида пустовало. Саул спросил своего сына Ионафана: «Почему сын Иессея не пришёл к трапезе ни вчера, ни сегодня?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִמָּחֳרַת
  choice: на другой день
  rationale: Естественно передаёт следующий день после ранее упомянутого события и сохраняет повествовательную последовательность.
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: во второй день новомесячья
  rationale: В контексте царской трапезы חֹדֶשׁ обозначает празднование новолуния; перевод сохраняет культово-календарный смысл без добавления отсутствующего в тексте слова «праздник».
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: место Давида пустовало
  rationale: Нифаль глагола פקד здесь указывает, что место Давида оказалось незанятым; русское «пустовало» естественно описывает место за столом.
- source_word: בְּנוֹ
  choice: своего сына
  rationale: Явное указание на родство сохранено; возвратное местоимение естественно при подлежащем «Саул».
- source_word: מַדּוּעַ
  choice: почему
  rationale: Прямой и современный русский эквивалент вопроса о причине.
- source_word: בֶן יִשַׁי
  choice: сын Иессея
  rationale: Сохранено намеренное именование Давида по отцу, которое может выражать дистанцию или пренебрежение, без явного истолкования оттенка.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: ни вчера, ни сегодня
  rationale: При отрицательном сказуемом это естественная русская передача буквального «и вчера, и сегодня», сохраняющая охват обоих дней.
- source_word: אֶל הַלָּחֶם
  choice: к трапезе
  rationale: Буквально «к хлебу»; здесь «хлеб» метонимически означает совместную еду. «К трапезе» точно и достойно передаёт контекст царского стола.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. Синтаксис ясен для широкого читателя; патроним «сын Иессея» и календарный термин «новомесячье» сохранены ради смысловой и риторической точности.
