- source_word: כָלָה הִיא מֵעִם אָבִיו
  choice: отец твёрдо решил
  rationale: Еврейская идиома выражает завершённость и окончательность решения со стороны отца. Русская формулировка передаёт твёрдую решимость, не превращая оборот в неестественную кальку.
- source_word: לְהָמִית אֶת דָּוִד
