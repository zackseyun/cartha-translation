base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/014.yaml
  text: And if I am still alive[a], will you not show me Yahweh’s covenant faithfulness, so that I may not die?
translation:
  language: ru
  text: И если я ещё буду жив, не проявишь ли ты ко мне милость Яхве[a], чтобы я не умер?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верную любовь Яхве»; «неизменную милость Яхве». Еврейское выражение может означать милость, соответствующую верности Яхве или оказываемую во имя Яхве, либо, более прямо, верную любовь, исходящую от самого Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אִם
  choice: И если
  rationale: В контексте просьбы Ионафана сочетание передаёт условный переход, а не простое «и не если»; по-русски естественно продолжить мысль словами «И если».
- source_word: עוֹדֶנִּי חָי
  choice: я ещё буду жив
  rationale: עוֹד указывает на продолжающееся состояние, а חָי — на жизнь; будущее время естественно в условной просьбе о предстоящих событиях.
- source_word: תַעֲשֶׂה עִמָּדִי
  choice: проявишь … ко мне
  rationale: Буквально «сделаешь со мной»; при חֶסֶד русский глагол «проявить» ясно и естественно передаёт устойчивое сочетание.
- source_word: חֶסֶד
  choice: милость
  rationale: Слово охватывает милость, преданную любовь и верность обязательствам. «Милость» естественна в данном вопросе и не сужает смысл исключительно до формального заветного обязательства; оттенок верности раскрыт в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: וְלֹא אָמוּת
  choice: чтобы мне не умереть
  rationale: Передаёт вероятный целевой или результативный смысл последней отрицательной конструкции, сохраняя связь с просьбой Ионафана.
theological_decisions:
- issue: Смысл сочетания חֶסֶד יְהוָה
  choice: милость Яхве
  alternative: верность завету, проявленная ради Яхве; верная любовь самого Яхве
  rationale: Еврейская родительная конструкция допускает понимание как милости, свойственной Яхве или оказываемой во имя Яхве, так и более прямую отсылку к верной любви Яхве. Основной текст сохраняет краткость, а сноска — смысловую открытость.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и отличает его от титула.
- issue: Связь просьбы с возможной смертью Ионафана
  choice: чтобы мне не умереть
  alternative: и я не умру; иначе я умру
  rationale: Такая передача отражает целевой оттенок וְלֹא אָמוּת, но не объясняет, каким именно образом милость Давида предотвратит смерть Ионафана.
translation_notes:
  register: Современный литературный русский язык; вопросительная форма и несколько шероховатая логическая напряжённость оригинала сохранены без догматического уточнения. «Милость» выбрана как понятное и ёмкое соответствие חֶסֶד, а заветно-реляционный оттенок отмечен в сноске.
