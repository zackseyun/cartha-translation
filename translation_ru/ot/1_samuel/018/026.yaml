base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/026.yaml
  text: So his servants told David these words[a], and the matter seemed right in David’s eyes, to become the king’s son-in-law[c][b]; and the days had not yet been fulfilled.
translation:
  language: ru
  text: Слуги Саула передали Давиду эти слова, и Давиду понравилась мысль стать царским зятем; назначенный срок ещё не истёк.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и дни не исполнились». То есть отведённый срок ещё не закончился.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: передали
  rationale: Порода хифиль глагола נגד означает «сообщить, передать». В данном контексте слуги доводят до Давида предложение Саула.
- source_word: עֲבָדָיו
  choice: слуги Саула
  rationale: Местоименный суффикс по контексту относится к Саулу. Явное имя устраняет возможную русскую двусмысленность, будто речь идёт о слугах Давида.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: דברים может означать и «слова», и «дела/обстоятельства»; здесь слуги передают Давиду устное предложение, поэтому «слова» соответствует ближайшему контексту.
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינֵי דָוִד
  choice: Давиду пришлось по душе
  rationale: Еврейская идиома буквально говорит, что дело было правильным или приятным в глазах Давида. Русское выражение естественно передаёт значение одобрения, не подразумевая объективной нравственной оценки.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: стать царским зятем
  rationale: Форма хитпаэль от חתן обозначает вступление в родство через брак. В повествовательном контексте конкретно имеется в виду, что Давид станет зятем царя.
- source_word: וְלֹא מָלְאוּ הַיָּמִים
  choice: а назначенный срок ещё не истёк
  rationale: Буквально «дни ещё не исполнились». По контексту это период, отведённый для исполнения условия; русский перевод ясно и естественно выражает временной смысл.
