    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסִרֵהוּ
  choice: удалил его
  rationale: Каузативная форма от סוּר означает «удалить, отстранить». Такой перевод передаёт действие, не уточняя без необходимости его мотив или характер.
- source_word: מֵעִמּוֹ
  choice: от себя
  rationale: Буквально «от пребывания с ним»; естественное русское выражение сохраняет смысл удаления из непосредственного окружения Саула.
- source_word: וַיְשִׂמֵהוּ לוֹ
  choice: назначил
  rationale: В данном контексте שׂוּם обозначает поставление на должность; «назначил» ясно передаёт официальный характер действия.
- source_word: שַׂר אָלֶף
  choice: командиром тысячи
  rationale: שַׂר обозначает начальника или командира, а אָלֶף — военное подразделение численностью около тысячи либо именуемое «тысячей». Формулировка не добавляет отсутствующего в тексте слова «воинов».
- source_word: וַיֵּצֵא וַיָּבֹא
  choice: выходил и входил
  rationale: Сохранена образная формула оригинала, которая может обозначать регулярную общественную или военную деятельность и руководство; её значение пояснено в сноске.
- source_word: לִפְנֵי הָעָם
  choice: перед народом
  rationale: Буквальный и допустимый по-русски перевод сохраняет возможность понимать выражение как действие на виду у народа или во главе народа.
