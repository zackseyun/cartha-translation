revisions:
- from: На следующий день злой дух от Бога[a] стремительно овладел Саулом, и тот стал пророчествовать[b] посреди дома. Давид, как и каждый день, играл рукой[c], а в руке у Саула было копьё.
  to: На следующий день злой дух от Бога[a] с силой нахлынул на Саула, и тот пророчествовал[b] в доме. Давид, как и каждый день, играл рукой[c], а в руке у Саула было копьё.
  rationale: 'Исправлены два ненужных смысловых сдвига: пространственное «посреди дома» заменено на точное «в доме», а начинательное «стал пророчествовать» — на нейтральное «пророчествовал». Глагол действия духа передан естественным русским выражением, сохраняющим его силу. Сноска об инструменте уточнена без добавления инструмента в основной текст.'
