base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/010.yaml
  text: And it happened on the next day that an evil spirit from God rushed upon Saul[a], and he prophesied within the house while David was playing with his hand, as day by day[d][c][b]; and the spear was in Saul’s hand.
translation:
  language: ru
  text: На следующий день злой дух от Бога[a] с силой нахлынул на Саула, и тот пророчествовал[b] в доме. Давид, как и каждый день, играл рукой[c], а в руке у Саула было копьё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «губительный дух от Бога»; буквально по-еврейски: «злой дух Божий».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может обозначать пророческую речь или поведение в экстатическом исступлении; в данном контексте возможен смысл «неистовствовал».
    reason: alternative_reading
  - marker: c
    text: Музыкальный инструмент в этом стихе не назван, хотя он упоминается в другом месте повествования.
    reason: cross_reference
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: на следующий день
  rationale: Естественно передаёт временное указание и последовательность повествования.
- source_word: וַתִּצְלַח
  choice: стремительно овладел
  rationale: В сочетании с רוּחַ глагол обозначает сильное, внезапное воздействие; формулировка сохраняет интенсивность действия и естественно звучит по-русски.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: злой дух от Бога
  rationale: «Злой» прямо передаёт רָעָה, а «от Бога» сохраняет обозначенный в еврейском тексте источник или посланничество духа, не превращая выражение в характеристику самого Бога.
- source_word: וַיִּתְנַבֵּא
  choice: стал пророчествовать
  rationale: Сохраняет основное значение глагола и намеренно не снимает неоднозначность между пророческим поведением и экстатическим исступлением; контекстуальный оттенок пояснён в сноске.
- source_word: בְּתוֹךְ הַבַּיִת
  choice: посреди дома
  rationale: Близко передаёт пространственное выражение и соответствует повествовательному регистру.
- source_word: מְנַגֵּן בְּיָדוֹ
  choice: играл рукой
  rationale: Глагол указывает на музыкальную игру, а упоминание руки явно присутствует в еврейском тексте. Инструмент в самом стихе не назван и потому не добавлен.
- source_word: כְּיוֹם בְּיוֹם
  choice: как и каждый день
  rationale: Естественный русский эквивалент идиомы, обозначающей регулярно повторявшееся действие.
- source_word: הַחֲנִית בְּיַד שָׁאוּל
  choice: в руке у Саула было копьё
  rationale: Сохраняет вынесенную в конец стиха зловещую деталь и передаёт её естественным русским порядком слов.
theological_decisions:
- issue: Связь злого духа с Богом в выражении רוּחַ אֱלֹהִים רָעָה
  choice: злой дух от Бога
  alternative: злой дух Божий; губительный дух от Бога
  rationale: Перевод сохраняет напряжение исходного текста, который связывает духа с Богом, но не уточняет механизм Божьего действия и не приписывает зло Божьей природе.
- issue: Характер поведения Саула, выраженный глаголом וַיִּתְנַבֵּא
  choice: стал пророчествовать
  alternative: впал в пророческое исступление; неистовствовал
  rationale: Основной текст сохраняет прямое лексическое значение и неоднозначность. Контекст допускает экстатическое или болезненно-неистовое поведение, однако не требует молча подменять значение «пророчествовать» однозначной интерпретацией.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён до естественной русской последовательности, но сохранены ключевые повторы «рукой — в руке» и неоднозначные богословские формулировки исходного текста.
