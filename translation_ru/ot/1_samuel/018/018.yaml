base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/018.yaml
  text: And David said to Saul[a], “Who am I, and what is my life, or my father’s family in Israel, that I should become the king’s son-in-law?”
translation:
  language: ru
  text: 'И сказал Давид Саулу: «Кто я и что такое моя жизнь[a], род моего отца в Израиле, — чтобы мне стать зятем царя?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение необычно. Буквально: «и кто моя жизнь». Оно может выражать мысль о незначительности Давида; последующие слова «род моего отца в Израиле» могут пояснять его семейное положение. Возможно также понимание: «кто мои родные — род моего отца в Израиле».'
    reason: Сохраняется лексическая и синтаксическая неоднозначность וּמִי חַיַּי и его связи с последующей фразой.
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד אֶל־שָׁאוּל
  choice: И сказал Давид Саулу
  rationale: Форма wayyiqtol продолжает повествование; обычная русская библейская конструкция сохраняет связность и торжественную простоту.
- source_word: מִי אָנֹכִי
  choice: Кто я
  rationale: Прямой и естественный риторический вопрос, выражающий самоуничижение Давида.
- source_word: וּמִי חַיַּי
  choice: и что такое моя жизнь
  rationale: Сохраняется необычная и неоднозначная еврейская формулировка. Русское «что такое моя жизнь» передаёт вопрос о незначительности жизни или положении Давида, не сводя его однозначно к родственникам.
- source_word: מִשְׁפַּחַת אָבִי בְּיִשְׂרָאֵל
  choice: или род моего отца в Израиле
  rationale: «Род» естественно обозначает более широкую отцовскую семью или клан. Союз «или» делает по-русски понятным соотношение двух оснований недостоинства, хотя в еврейском тексте связь выражена неявно.
- source_word: כִּי אֶהְיֶה חָתָן לַמֶּלֶךְ
  choice: чтобы мне стать зятем царя
  rationale: Передаёт предполагаемый будущий статус Давида как мужа царской дочери и риторический оттенок его слов.
