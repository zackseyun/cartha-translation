base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/006.yaml
  text: And it happened[a], as they were coming in, when David returned from striking down the Philistine, that the women came out from all the cities of Israel, singing and dancing, to meet King Saul with tambourines, with joy, and with three-stringed instruments.
translation:
  language: ru
  text: 'И было: когда они пришли, когда Давид возвращался после того, как поразил филистимлянина, женщины вышли из всех городов Израиля с песнями и плясками навстречу царю Саулу — с бубнами, с радостью и с музыкальными инструментами[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Значение еврейского слова שָׁלִשִׁים неясно. Возможно, речь идёт о трёхструнных инструментах, лютнях или другом музыкальном сопровождении.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Передаёт древнееврейскую повествовательную формулу, открывающую новую сцену, в сжатом и достойном русском изложении.
- source_word: בְּבוֹאָם
  choice: когда они возвращались
  rationale: Временная конструкция с суффиксом 3-го лица множественного числа. Местоимение сохраняет неопределённость названного в контексте множественного субъекта; «возвращались» естественно передаёт прибытие назад после похода.
- source_word: בְּשׁוּב דָּוִד
  choice: когда Давид возвращался
  rationale: Сохраняет вторую временную конструкцию и явно названный субъект, не устраняя некоторую неловкость и возможное напряжение исходного синтаксиса.
- source_word: מֵהַכּוֹת אֶת־הַפְּלִשְׁתִּי
  choice: после победы над филистимлянином
  rationale: נכה в данном контексте означает поразить или сразить противника; «после победы над» естественно по-русски передаёт результат, сохраняя единственное число и отсылку к Голиафу.
- source_word: וַתֵּצֶאנָה הַנָּשִׁים
  choice: женщины вышли
  rationale: 'Прямое и естественное соответствие: женщины выходят из городов навстречу возвращающимся.'
- source_word: מִכָּל עָרֵי יִשְׂרָאֵל
  choice: из всех городов Израиля
  rationale: Сохраняет собирательно-распределительное выражение оригинала без ненужного уточнения.
- source_word: לָשׁוּר וְהַמְּחֹלוֹת
  choice: с песнями и плясками
  rationale: Передаёт цель или сопровождающее действие идиоматичной русской парой; существительное מְחֹלוֹת сохранено как «пляски».
- source_word: לִקְרַאת שָׁאוּל הַמֶּלֶךְ
  choice: навстречу царю Саулу
  rationale: Естественный русский порядок слов и точная передача движения навстречу, без добавления значения приветствия.
- source_word: בְּתֻפִּים
  choice: с бубнами
  rationale: תֹּף обозначает ручной рамочный барабан; «бубен» — понятный современному читателю традиционный русский эквивалент.
- source_word: בְּשִׂמְחָה
  choice: с радостью
  rationale: Сохраняет именную форму и отдельное упоминание радостного ликования.
- source_word: וּבְשָׁלִשִׁים
  choice: с музыкальными инструментами[a]
  rationale: Точное устройство или вид обозначенного предмета неясны. Родовое выражение не создаёт ложной уверенности, а варианты вынесены в примечание.
