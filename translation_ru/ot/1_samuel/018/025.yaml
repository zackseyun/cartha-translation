base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/025.yaml
  text: Then Saul said[a], “Thus you shall say to David, ‘The king has no desire for a bride-price except a hundred Philistine foreskins[c][b], to take vengeance on the king’s enemies.’” Now Saul intended to make David fall by the hand of the Philistines.
translation:
  language: ru
  text: 'И Саул сказал: «Так скажите Давиду: „Царь не желает брачного выкупа[a], кроме ста краеобрезаний филистимлян, чтобы отомстить врагам царя“». Саул же замышлял сделать так, чтобы Давид пал от руки филистимлян[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Брачный выкуп — плата, которую жених или его семья давали семье невесты; это не приданое.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «заставить Давида пасть рукой филистимлян». Это выражение, вероятно, подразумевает гибель Давида, но сформулировано менее прямо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹהַר
  choice: брачный выкуп
  rationale: Обозначает плату, которую жених или его семья давали семье невесты; «приданое» передавало бы направление платежа неверно.
- source_word: אֵין חֵפֶץ לַמֶּלֶךְ
  choice: царю не нужен
  rationale: В контексте условий брака естественно выражает отсутствие желания или требования со стороны царя.
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: только сто краеобрезаний филистимлян
  rationale: Прямо сохраняет конкретность и намеренно шокирующий характер еврейского выражения; ב после отрицания имеет исключительное значение.
- source_word: לְהִנָּקֵם בְּאֹיְבֵי הַמֶּלֶךְ
  choice: чтобы отомстить врагам царя
  rationale: Естественный русский способ передать целевое значение инфинитива и значение נקם в данном контексте.
- source_word: חָשַׁב
  choice: замышлял
  rationale: Передаёт не просто мысль, а скрытый злой умысел Саула.
- source_word: לְהַפִּיל אֶת דָּוִד
  choice: погубить Давида
  rationale: В данном контексте каузатив «заставить пасть» означает привести Давида к гибели, что по-русски естественно выражается глаголом «погубить».
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: руками филистимлян
  rationale: Устойчиво и ясно передаёт еврейскую идиому со значением действующей силы или посредника.
theological_decisions:
- issue: Степень явности намерения Саула в לְהַפִּיל
  choice: погубить Давида
  alternative: заставить Давида пасть
  rationale: Контекст смертельно опасного требования ясно указывает на намерение добиться гибели Давида; выбор не вносит конфессионального толкования, но сноска сохраняет образную форму оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Прямая речь сохранена ясной и естественной; грубая конкретность требования не смягчена. Все маркеры сносок помещены в основном тексте.
