  text: וַ/יִּכְרֹ֧ת יְהוֹנָתָ֛ן וְ/דָוִ֖ד בְּרִ֑ית בְּ/אַהֲבָת֥/וֹ אֹת֖/וֹ כְּ/נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/003.yaml
  text: Then Jonathan made a covenant with David[b][a], because he loved him as his own soul.
translation:
  language: ru
  text: И заключил Ионафан с Давидом союз[a], потому что любил его, как самого себя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «разрезал союз» — древнееврейский оборот со значением «заключил союз».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как свою душу». Еврейские местоимения формально неоднозначны, но из контекста следует, что Ионафан любил Давида, как самого себя.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: заключил
  rationale: В устойчивом еврейском выражении כרת ברית глагол буквально означает «разрезал», но по-русски естественным и точным соответствием служит «заключил союз».
- source_word: יְהוֹנָתָן
  choice: Ионафан
  rationale: Традиционная русская форма библейского имени.
- source_word: וְדָוִד
  choice: с Давидом
  rationale: При единственном числе сказуемого Ионафан является подлежащим, а Давид — второй стороной союза; русский оборот «заключить союз с кем-либо» ясно и естественно передаёт эту связь.
- source_word: בְּרִית
  choice: союз
  rationale: Слово обозначает обязывающее соглашение или завет. В межличностном контексте «союз» звучит естественно и сохраняет торжественную силу обязательства.
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: потому что любил его
  rationale: 'Предлог בְּ здесь уместно понимать причинно: заключение союза основано на любви. Контекст указывает на Ионафана как любящего и Давида как объект любви, хотя формы местоимений сами по себе допускают неоднозначность.'
- source_word: כְּנַפְשׁוֹ
  choice: как самого себя
  rationale: נֶפֶשׁ может означать «душа», «жизнь» или «сам человек». Здесь современное русское «как самого себя» естественно передаёт глубину личной привязанности; более буквальный образ отмечен в сноске.
theological_decisions:
- issue: К кому относятся местоимения в выражении בְּאַהֲבָתוֹ אֹתוֹ כְּנַפְשׁוֹ
  choice: Ионафан любил Давида, как самого себя
  alternative: Вне контекста формы третьего лица формально неоднозначны и могли бы быть поняты как относящие любовь к Давиду.
  rationale: Ближайший контекст, особенно 1 Цар 18:1, убедительно указывает на Ионафана как субъект любви и Давида как её объект. Сноска сохраняет сведения о формальной неоднозначности, не приписывая отношениям дополнительного богословского содержания.
translation_notes:
  register: Современный литературный русский язык с традиционными формами библейских имён. Перевод сохраняет начальное повествовательное «И», естественный русский оборот «заключил с Давидом союз» и поясняет буквальную идиому и местоименную неоднозначность в сносках.
