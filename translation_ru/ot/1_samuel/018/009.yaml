lexical_decisions:
- source_word: וַיְהִי
  choice: стал
  rationale: В сочетании с последующим причастным/состоянием передаёт начало продолжающегося отношения Саула к Давиду; по-русски естественно выражается глаголом «стал».
- source_word: שָׁאוּל
  choice: Саул
  rationale: Традиционная русская передача имени.
- source_word: עון
  choice: смотреть ... с подозрением
  rationale: Редкая форма обозначает взгляд, окрашенный неприязнью, завистью или подозрением. Выбранная формулировка передаёт враждебную настороженность, не сводя значение только к зависти.
- source_word: אֶת דָּוִד
  choice: на Давида
  rationale: Прямое дополнение оформлено по нормам русского управления при глаголе «смотреть»; имя передано в традиционной русской форме.
- source_word: מֵהַיּוֹם הַהוּא וָהָלְאָה
  choice: с того дня
  rationale: Естественная русская передача начальной точки продолжающегося состояния; значение «и впредь» уже выражено конструкцией «с того дня» и несовершенным видом инфинитива.
