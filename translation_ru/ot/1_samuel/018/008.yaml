base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/008.yaml
  text: Then Saul became very angry[a], and this matter displeased him. He said, “They have given David ten thousands, but to me they have given the thousands[b]; what more can he have but the kingdom?”
translation:
  language: ru
  text: 'Саул сильно разгневался, и ему это не понравилось. Он сказал: «Давиду они дали десятки тысяч, а мне — тысячи[a]. Ему остаётся только царство[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давиду они приписали десятки тысяч, а мне — тысячи». Речь идёт о подвигах, поставленных каждому в заслугу в песне женщин.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза сжата: буквально «и ещё ему только царство». То есть, по мысли Саула, Давиду осталось получить лишь царскую власть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְשָׁאוּל מְאֹד
  choice: Саул сильно разгневался
  rationale: Глагол передаёт вспыхнувший, буквально «разгоревшийся», гнев, а מְאֹד усиливает его. Выбран естественный для современного русского языка эквивалент без утраты интенсивности.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: были ему неприятны
  rationale: Еврейская идиома буквально означает «было дурно в его глазах». В данном контексте она выражает резкое недовольство Саула услышанными словами.
- source_word: הַדָּבָר הַזֶּה
  choice: эти слова
  rationale: דָּבָר может означать «слово», «дело» или «обстоятельство». Здесь выражение указывает на только что прозвучавшую песню женщин, поэтому контекстуально естественно «эти слова».
- source_word: נָתְנוּ
  choice: дали
  rationale: Сохранено основное значение глагола «давать». По контексту речь идёт о том, какое число побед публично поставили в заслугу Давиду и Саулу; этот оттенок отмечен в сноске.
- source_word: רְבָבוֹת
  choice: десятки тысяч
  rationale: Множественное число обозначает многократные десять тысяч; русский оборот естественен и сохраняет числовое противопоставление тысячам.
- source_word: הָאֲלָפִים
  choice: тысячи
  rationale: Передаёт прямое значение слова и сохраняет риторический контраст с «десятками тысяч».
- source_word: וְעוֹד לוֹ אַךְ הַמְּלוּכָה
  choice: Теперь ему остаётся только царство
  rationale: 'Еврейская фраза предельно сжата: буквально «и ещё ему только царство». Перевод раскрывает подразумеваемую мысль Саула, не добавляя уверенности в том, что Давид действительно получит царскую власть.'
- source_word: הַמְּלוּכָה
  choice: царство
  rationale: Существительное может обозначать царскую власть, царствование или царство. Здесь Саул боится, что Давиду достанется его царская власть; «царство» сохраняет привычную библейскую формулировку и широту значения.
theological_decisions:
- issue: 'Высказывание Саула о царстве: предсказание или боязливый вывод'
  choice: 'Передано как эмоциональный вывод Саула: «Теперь ему остаётся только царство!»'
  alternative: «Чего ещё ему недостаёт, кроме царства?»
  rationale: В еврейском тексте нет явного вопросительного слова, а сама конструкция сжата. Утвердительно-восклицательная передача сохраняет ревнивый страх Саула и не превращает его слова в богословское предсказание.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Реплика Саула звучит эмоционально и естественно, а параллелизм «десятки тысяч — тысячи» сохранён.
