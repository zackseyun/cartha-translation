  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֣ר אֶל שָׁא֔וּל וְ/נֶ֨פֶשׁ֙ יְה֣וֹנָתָ֔ן נִקְשְׁרָ֖ה בְּ/נֶ֣פֶשׁ דָּוִ֑ד ו/יאהבו יְהוֹנָתָ֖ן כְּ/נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/001.yaml
  text: And it happened[a], when he had finished speaking to Saul, that Jonathan’s soul was bound to David’s soul[b], and Jonathan loved him as his own soul.
translation:
  language: ru
  text: 'И когда он закончил говорить с Саулом, душа Ионафана привязалась к душе Давида[a], и Ионафан полюбил его, как собственную душу[b].


    [a] Или: «душа Ионафана была связана с душой Давида».

    [b] В еврейском тексте слово «душа» повторяется в этом стихе трижды: «душа Ионафана… душа Давида… собственная душа».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «душа Ионафана была связана с душой Давида».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте слово «душа» повторяется в этом стихе трижды: «душа Ионафана… душа Давида… собственная душа».'
    reason: lexical_repetition
lexical_decisions:
- source_word: וַיְהִי
  choice: И
  rationale: Еврейская повествовательная формула вводит следующий эпизод. В современном русском естественное соединительное «И» передаёт ход рассказа без архаического «И было».
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: когда он закончил говорить
  rationale: Конструкция с инфинитивом обозначает время и завершённость действия; русский вид глагола естественно выражает эту последовательность.
- source_word: אֶל שָׁאוּל
  choice: с Саулом
  rationale: Хотя предлог אֶל буквально указывает направление «к», при глаголе речи современное русское «говорить с Саулом» звучит естественно и не меняет смысла контекста.
- source_word: נֶפֶשׁ
  choice: душа
  rationale: Слово трижды повторено в стихе. Последовательный перевод «душа» сохраняет лексический повтор и силу личной привязанности.
- source_word: נִקְשְׁרָה
  choice: привязалась
  rationale: Глагол קשר выражает связывание. «Привязалась» сохраняет образ связи и одновременно естественно передаёт глубокую личную привязанность по-русски; более буквальный вариант дан в сноске.
- source_word: בְּנֶפֶשׁ דָּוִד
  choice: к душе Давида
  rationale: Так сохраняются и метафора соединения, и явное повторение слова «душа».
- source_word: וַיֶּאֱהָבוֹ
  choice: Ионафан полюбил его
  rationale: Глагол אהב с объектным суффиксом прямо сообщает о любви Ионафана к Давиду. Имя субъекта повторено для ясности.
- source_word: כְּנַפְשׁוֹ
  choice: как собственную душу
  rationale: Перевод сохраняет третье употребление נֶפֶשׁ и подчёркивает глубину отождествления, не заменяя образ более общим «как самого себя».
theological_decisions:
- issue: Характер любви Ионафана к Давиду
  choice: Передать сильную личную привязанность словами «Ионафан полюбил его, как собственную душу», не уточняя её сверх сказанного в тексте.
  alternative: Истолковать любовь преимущественно как политический союз либо как романтическую или сексуальную связь.
  rationale: Еврейские слова נֶפֶשׁ и אהב выражают глубокую связь и любовь, однако сам стих не определяет её как эротическую и не сводит только к политике. Перевод сохраняет силу и неоднозначность исходного текста.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Архаическая формула «И было» не используется; повтор слова «душа» намеренно сохранён. Местоимение «он» сохраняет форму исходного текста и предполагает Давида из ближайшего контекста.
