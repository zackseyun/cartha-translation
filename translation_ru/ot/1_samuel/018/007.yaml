  text: And the women who were celebrating sang responsively[a], saying, “Saul has struck down his thousands[c][b], and David his tens of thousands.”
translation:
  language: ru
  text: 'И женщины, празднуя, пели друг другу в ответ[a]: «Саул поразил тысячи[b], а Давид — десятки тысяч».'
  philosophy: optimal-equivalence
