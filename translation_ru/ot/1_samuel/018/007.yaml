    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנֶינָה
  choice: пели друг другу в ответ
  rationale: В контексте праздничного исполнения глагол ענה указывает не просто на словесный ответ, а, вероятно, на перекличку или антифонное пение.
- source_word: הַנָּשִׁים
  choice: женщины
  rationale: Прямое соответствие еврейскому существительному во множественном числе.
- source_word: הַמְשַׂחֲקוֹת
  choice: празднуя
  rationale: Причастие от שׂחק в праздничном контексте может охватывать веселье, пляску и игру; «празднуя» естественно передаёт общий смысл, не сужая его до одного действия.
- source_word: וַתֹּאמַרְןָ
  choice: '[пели]'
  rationale: Формула «и сказали» естественно включена в ввод цитируемого припева глаголом «пели», без отдельного тяжеловесного повтора.
- source_word: הִכָּה
  choice: поразил
  rationale: נכה буквально означает «ударить, поразить» и здесь употреблён в военном смысле; «поразил» сохраняет широту значения, включая победу и умерщвление.
- source_word: באלפו
  choice: тысячи свои
  rationale: Предлог с числительным обозначает меру военного успеха; форма с притяжательным суффиксом сохранена в поэтической формуле.
- source_word: בְּרִבְבֹתָיו
  choice: десятки тысяч свои
  rationale: רבבה означает «десять тысяч» или огромное множество; множественное число и притяжательный суффикс переданы, а параллелизм с «тысячами» сохранён.
