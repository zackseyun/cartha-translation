  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «выступали» сохраняет присущую еврейскому тексту повторяемость, а синтаксис не превращает последний союз в явно причинное «так что», поскольку в оригинале стоит обычное וַ.
