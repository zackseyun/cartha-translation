  yaml_path: translation/ot/1_samuel/018/030.yaml
  text: Then the commanders of the Philistines went out[a], and as often as they went out, David acted more wisely than all the servants of Saul[c][b], so that his name was highly esteemed.
translation:
  language: ru
  text: Филистимские военачальники выступили, и всякий раз, когда они выступали, Давид действовал благоразумнее[a] всех слуг Саула, и его имя стало весьма почитаемым[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давид был успешнее». Еврейский глагол может обозначать благоразумные действия, ведущие к успеху.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «его имя стало весьма драгоценным (почётным)», то есть он приобрёл большое уважение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: филистимские военачальники
  rationale: שָׂרִים может обозначать правителей, начальников или военных предводителей; военный контекст поддерживает естественное русское «военачальники».
- source_word: וַיֵּצְאוּ / מִדֵּי צֵאתָם
  choice: выступали в поход / всякий раз, когда они выступали
  rationale: יצא буквально означает «выходить», а конструкция מִדֵּי передаёт повторяемость действия. «Выступали в поход» естественно выражает военное движение, не уточняя его сверх текста.
- source_word: שָׂכַל
  choice: действовал благоразумнее
  rationale: Глагол сочетает значение разумного, осмотрительного поведения с проистекающими из него успехом и благополучием. Основной текст сохраняет акцент на благоразумии, а примечание — смысловую возможность успеха.
- source_word: מִכֹּל עַבְדֵי שָׁאוּל
  choice: всех слуг Саула
  rationale: עֲבָדִים здесь обозначает людей на царской службе, а не обязательно рабов; «слуги Саула» сохраняет широкое значение и традиционную библейскую форму.
- source_word: וַיִּיקַר שְׁמוֹ מְאֹד
  choice: имя его стало весьма почитаемым
  rationale: Оборот буквально говорит о том, что имя Давида стало очень ценным или почитаемым, то есть его репутация приобрела большой вес. Перевод сохраняет образ «имени» и ясно передаёт высокий почёт.
