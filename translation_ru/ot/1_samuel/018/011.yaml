translation:
  language: ru
  text: 'Саул метнул копьё, сказав: «Пригвожду Давида к стене!» Но Давид дважды уклонился от него.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּטֶל
  choice: метнул
  rationale: Глагол в контексте копья означает энергичный бросок; «метнул» естественно и точно передаёт действие.
- source_word: אַכֶּה בְדָוִד וּבַקִּיר
  choice: Пригвожду Давида к стене
  rationale: Буквальная конструкция допускает «ударю Давида и стену», но контекстуальный смысл — пронзить Давида копьём и пригвоздить к стене. Русская формулировка сохраняет образ и намерение Саула.
- source_word: וַיִּסֹּב ... מִפָּנָיו
  choice: уклонился от него
  rationale: Оборот буквально описывает поворот или уход от лица Саула; в сцене нападения «уклонился» ясно передаёт успешное избегание удара.
- source_word: פַּעֲמָיִם
  choice: дважды
  rationale: Прямое соответствие еврейской двойственной форме.
