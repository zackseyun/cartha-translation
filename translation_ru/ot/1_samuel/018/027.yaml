  yaml_path: translation/ot/1_samuel/018/027.yaml
  text: So David arose and went[a], he and his men, and struck down two hundred Philistine men. Then David brought their foreskins, and they counted them out in full to the king, so that he might become the king’s son-in-law. And Saul gave him Michal his daughter as a wife.
translation:
  language: ru
  text: Давид поднялся и пошёл вместе со своими людьми. Он убил двести филистимлян, принёс их крайние плоти, и они предъявили царю всё требуемое количество[a], чтобы Давид стал царским зятем. И Саул отдал ему в жёны свою дочь Мелхолу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и отсчитали их полностью царю». Еврейский глагол в этом месте труден для истолкования и может указывать либо на отсчитывание, либо на предъявление полного требуемого числа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: поднялся
  rationale: Глагол קום в повествовательной последовательности обозначает начало решительного действия; «поднялся» сохраняет этот оттенок и естественно звучит по-русски.
- source_word: וַיֵּלֶךְ הוּא וַאֲנָשָׁיו
  choice: пошёл со своими людьми
  rationale: Передаёт совместное выступление Давида и его отряда; отдельное הוּא подчёркивает Давида, что сохраняется явным называнием его субъектом.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים
  choice: убил ... филистимлян
  rationale: В военном контексте נכה означает нанесение смертельного поражения; последующее снятие крайней плоти подтверждает, что речь идёт об убитых.
- source_word: מָאתַיִם אִישׁ
  choice: двести филистимлян
  rationale: אִישׁ после числительного обозначает людей; принадлежность к филистимлянам ясна из предложной конструкции и естественно выражается по-русски.
- source_word: עָרְלֹתֵיהֶם
  choice: их крайнюю плоть
  rationale: Прямое анатомическое обозначение сохраняет ясный смысл еврейского текста без эвфемизма; в русском собирательное единственное число звучит естественнее буквального множественного.
- source_word: וַיְמַלְאוּם
  choice: всё это отсчитали сполна
  rationale: Трудная форма, вероятно, относится к полному подсчёту или предъявлению требуемого количества. Формулировка передаёт исполнение установленного числа, не скрывая лексической трудности, отмеченной в сноске.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: чтобы Давид стал царским зятем
  rationale: Hitpael глагола חתן означает вступление в брачное родство; в данном контексте точнее всего речь о статусе царского зятя.
- source_word: וַיִּתֶּן לוֹ שָׁאוּל אֶת מִיכַל בִּתּוֹ לְאִשָּׁה
  choice: Саул отдал ему в жёны свою дочь Мелхолу
  rationale: Сохраняется формула передачи дочери в брак, но в естественной современной русской конструкции; употреблена традиционная русская форма имени Мелхола.
