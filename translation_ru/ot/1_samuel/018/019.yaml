  yaml_path: translation/ot/1_samuel/018/019.yaml
  text: But when the time came to give Merab[a], Saul’s daughter, to David, she was given to Adriel the Meholathite as a wife.
translation:
  language: ru
  text: Но когда пришло время отдать Мерав, дочь Саула, Давиду, её отдали в жёны Адриэлу из Мехолы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: Но когда пришло время
  rationale: Передаёт временной переход и контраст с ожидаемым браком Мерав и Давида; по-русски звучит естественно.
- source_word: תֵּת
  choice: отдать
  rationale: В контексте брачного соглашения נתן означает «отдать» женщину замуж; этот выбор естественнее буквального «дать».
- source_word: אֶת מֵרַב בַּת שָׁאוּל לְדָוִד
  choice: Мерав, дочь Саула, Давиду
  rationale: Сохраняет приложение и прямо указывает предполагавшегося жениха.
- source_word: וְהִיא נִתְּנָה
  choice: её отдали
  rationale: Русская неопределённо-личная конструкция естественно передаёт еврейский пассив и сохраняет фокус на неожиданной судьбе Мерав.
- source_word: לְעַדְרִיאֵל הַמְּחֹלָתִי
  choice: Адриэлу из Мехолы
  rationale: Гентилик передан ясным современным обозначением происхождения; форма имени «Адриэл» соответствует русской библейской традиции.
- source_word: לְאִשָּׁה
  choice: в жёны
  rationale: Устойчивое русское выражение точно передаёт древнееврейскую брачную формулу.
