  text: וַ/יַּ֣רְא שָׁא֔וּל אֲשֶׁר ה֖וּא מַשְׂכִּ֣יל מְאֹ֑ד וַ/יָּ֖גָר מִ/פָּנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/015.yaml
  text: When Saul saw that he was very successful[b][a], he was afraid of him.
translation:
  language: ru
  text: Когда Саул увидел, что Давид добивается большого успеха[a], он стал бояться его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступает весьма благоразумно» или «весьма преуспевает». Еврейский глагол может обозначать как благоразумные действия, так и достигаемый благодаря им успех.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «страшился перед ним»; это еврейское выражение означает, что Саул боялся Давида.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא שָׁאוּל
  choice: Когда Саул увидел
  rationale: Последовательная форма с וַ передвигает повествование вперёд, а здесь первая часть предложения естественно выражает обстоятельство, вызвавшее последующую реакцию Саула.
- source_word: אֲשֶׁר הוּא
  choice: что Давид
  rationale: Местоимение относится к Давиду, названному в ближайшем контексте. Повтор имени по-русски устраняет двусмысленность двух мужских местоимений, не меняя смысла.
- source_word: מַשְׂכִּיל מְאֹד
  choice: добивается большого успеха
  rationale: Причастие породы hифиль от שׂכל может обозначать благоразумные действия и обусловленный ими успех. В данном повествовательном контексте на первом плане заметная Саулу успешность Давида; примечание сохраняет другой оттенок.
- source_word: וַיָּגָר מִפָּנָיו
  choice: стал бояться его
  rationale: Глагол גור здесь передаёт страх или опасение, а сочетание с מִפָּנָיו идиоматически означает страх перед человеком. «Стал бояться» естественно выражает наступившую вследствие увиденного реакцию.
