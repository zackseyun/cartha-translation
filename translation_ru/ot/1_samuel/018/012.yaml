base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/012.yaml
  text: Saul was afraid of David[a], because Yahweh was with him and had departed from Saul.
translation:
  language: ru
  text: Саул боялся Давида[a], потому что Яхве был с ним, а от Саула отошёл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «боялся из-перед лица Давида» — еврейский оборот, означающий, что Давид был предметом или причиной страха Саула.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: боялся
  rationale: Глагол ירא обозначает страх; «боялся» естественно передаёт продолжительное состояние Саула в данном повествовательном контексте.
- source_word: מִלִּפְנֵי
  choice: Давида (при глаголе «боялся»)
  rationale: Буквально выражение означает «из-перед лица», но в сочетании с ירא указывает на объект или причину страха; по-русски это естественно выражается родительным падежом после «бояться».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину страха Саула; «потому что» ясно передаёт причинную связь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул.
- source_word: עִמּוֹ
  choice: с ним
  rationale: Местоимение естественно относится к Давиду; сохранена местоименная форма еврейского текста.
- source_word: וּמֵעִם שָׁאוּל סָר
  choice: а от Саула отошёл
  rationale: 'סר означает «отойти, удалиться». Противительный союз «а» естественно подчёркивает контраст: Яхве был с Давидом, но отошёл от Саула; формулировка не уточняет механизм этого ухода сверх сказанного в стихе.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно употреблён тетраграмматон; транслитерация сохраняет личное имя Бога.
- issue: Смысл ухода Яхве от Саула
  choice: «от Саула отошёл» без дальнейшего уточнения
  alternative: «Дух Яхве отошёл от Саула»; «благоволение Яхве оставило Саула»
  rationale: Сам стих говорит именно о Яхве и не упоминает здесь ни Духа, ни благоволения. Перевод сохраняет лаконичность и богословское напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык; краткий повествовательный строй оригинала сохранён. «Отошёл» выбрано как естественное и достаточно буквальное соответствие, без привнесения пояснений из соседних стихов.
