base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/017.yaml
  text: Then Saul said to David, “Look, my older daughter Merab—I will give her to you as a wife. Only be a valiant man for me, and fight the LORD’s battles.” For Saul said, “Let not my hand be against him, but let the hand of the Philistines be against him.”
translation:
  language: ru
  text: 'Тогда Саул сказал Давиду: «Вот моя старшая дочь, Мерав; я отдам её тебе в жёны. Только будь моим доблестным воином и сражайся в битвах Господа». Саул же думал: «Пусть не моя рука будет против него, а рука филистимлян».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: «Вот»
  rationale: Передаёт указательное и привлекающее внимание значение частицы естественным современным русским выражением.
- source_word: הַגְּדוֹלָה
  choice: «старшая»
  rationale: В отношении дочери это контекстуально естественное значение буквального «большая/великая».
- source_word: בֶן חַיִל
  choice: «храбрый воин»
  rationale: Идиома обозначает доблестного, мужественного человека; военный контекст уточняет значение без конфессиональной нагрузки.
- source_word: מִלְחֲמוֹת יְהוָה
  choice: «битвы Господа»
  rationale: Сохраняет представление о сражениях, принадлежащих Господу, и звучит естественнее буквального «войны Господа» при глаголе «сражаться».
- source_word: יְהוָה
  choice: «Господь»
  rationale: Традиционная литературная русская передача тетраграмматона, понятная широкой аудитории.
- source_word: אָמַר
  choice: «говорил себе»
  rationale: Контекст показывает внутренний замысел Саула; добавление «себе» делает это ясным по-русски, не меняя содержания прямой речи.
theological_decisions:
- issue: Характер «битв Господа»
  choice: «сражайся в битвах Господа»
  alternative: «сражайся за Господа»
  rationale: Выбранный вариант сохраняет исходную конструкцию принадлежности и не превращает её в более определённую формулу цели.
- issue: Намерение Саула относительно Давида
  choice: «Пусть не моя рука будет против него»
  alternative: «Пусть не моя рука убьёт его»
  rationale: Сохраняется образная и несколько более широкая формулировка оригинала; намерение погубить Давида ясно из противопоставления руке филистимлян, но не вставляется в текст явно.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис прямой речи упрощён для ясности, при этом сохранены повтор «рука» и напряжение между публичным обещанием Саула и его скрытым намерением.
