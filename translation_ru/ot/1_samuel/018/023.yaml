  to: 'И слуги Саула сказали Давиду эти слова. Давид сказал: «Неужели вам кажется пустяком стать зятем царя? Ведь я человек бедный и незначительный»[a].'
  rationale: Заменены «передали» на более прямое «сказали» и «незнатный» на семантически более широкий и точный эквивалент «незначительный». Сохранены риторическая форма, причинно-пояснительная реплика Давида и конкретное значение брачного родства с царём. Сноска перенесена к слову, которое она поясняет, и фиксирует допустимый социальный оттенок без утверждения его как единственного смысла.
