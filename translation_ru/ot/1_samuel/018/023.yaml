  naturalness: Исправленный текст остаётся современным литературным русским. «Неужели вам кажется пустяком...» удачно передаёт риторический вопрос; «Ведь» естественно выражает поясняющую связь в реплике.
  terminology: «Стать зятем царя» точно и ясно передаёт вступление Давида в брачное родство с царём в данном контексте. Богословски нагруженных терминов нет.
