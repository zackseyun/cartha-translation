base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/023.yaml
  text: So Saul’s servants spoke these words in David’s hearing[a], and David said, “Does it seem to you a small thing to become the king’s son-in-law, when I am a poor and lightly regarded man?”
translation:
  language: ru
  text: 'И слуги Саула сказали Давиду эти слова. Давид сказал: «Неужели вам кажется пустяком стать зятем царя? Ведь я человек бедный и незначительный»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедный и незнатный».'
    reason: נִקְלֶה прежде всего указывает на малую значимость или низкую оценку человека; в контексте брака с царской дочерью возможен социальный оттенок, передаваемый словом «незнатный».
lexical_decisions:
- source_word: וַיְדַבְּרוּ עַבְדֵי שָׁאוּל בְּאָזְנֵי דָוִד
  choice: И передали слуги Саула Давиду
  rationale: Глагол דבר в сочетании с идиомой «в уши Давида» означает, что слуги сообщили ему сказанное; «передали ... Давиду» естественно выражает это по-русски, не придавая речи излишней официальности.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: Прямое и естественное соответствие в контексте передаваемой речи.
- source_word: הַנְקַלָּה בְעֵינֵיכֶם
  choice: Неужели вам кажется пустяком
  rationale: Передаёт риторический вопрос и оценочную идиому «в ваших глазах»; «пустяком» сохраняет значение чего-то малого и незначительного.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: стать зятем царя
  rationale: В данном контексте hitpael глагола חתן означает вступить в брачное родство с царём через брак с его дочерью; русское выражение ясно и кратко передаёт конкретное отношение.
- source_word: וְאָנֹכִי אִישׁ רָשׁ
  choice: Ведь я человек бедный
  rationale: Союз вводит основание для недоумения Давида; «ведь» естественно передаёт причинно-пояснительную связь, а רָשׁ прямо означает бедного или неимущего.
- source_word: וְנִקְלֶה
  choice: и незнатный
  rationale: В контексте брака с царской дочерью слово обозначает низкое общественное положение, малую значимость или отсутствие почёта. «Незнатный» естественно выражает социальный аспект, не усиливая значение до «презираемый».
