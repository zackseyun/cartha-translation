base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/021.yaml
  text: Then Saul said[a], “I will give her to him, so that she may become a snare to him and the hand of the Philistines may be against him.” So Saul said to David, “By the second one you may become my son-in-law today.”
translation:
  language: ru
  text: 'Тогда Саул сказал: «Я отдам её ему, чтобы она стала для него западнёй и пусть рука филистимлян будет против него». И Саул сказал Давиду: «Через вторую[a] ты сегодня станешь моим зятем».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Во второй раз ты сегодня можешь стать моим зятем». Еврейская фраза неполна и может указывать либо на вторую дочь Саула, либо на вторую возможность для Давида породниться с его семьёй.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְּנֶנָּה לּוֹ
  choice: Я отдам её ему
  rationale: Краткая формулировка сохраняет структуру еврейского текста; из контекста ясно, что речь идёт о выдаче дочери замуж.
- source_word: וּתְהִי לוֹ לְמוֹקֵשׁ
  choice: чтобы она стала для него западнёй
  rationale: מוֹקֵשׁ обозначает западню или ловушку. Целевая конструкция естественно передаёт замысел Саула, не устраняя образность оригинала.
- source_word: וּתְהִי בוֹ יַד פְּלִשְׁתִּים
  choice: и рука филистимлян обратилась против него
  rationale: Сохранён еврейский образ «руки» как силы и враждебного действия; глагол «обратилась» делает враждебную направленность ясной по-русски.
- source_word: בִּשְׁתַּיִם
  choice: через вторую
  rationale: Фраза эллиптична. В ближайшем контексте наиболее вероятна отсылка ко второй дочери Саула, через брак с которой Давид должен стать его зятем; возможное значение «во второй раз» вынесено в примечание.
- source_word: תִּתְחַתֵּן בִּי
  choice: ты станешь моим зятем
  rationale: Форма от חתן с предлогом ב обозначает вступление в брачное родство; в данном контексте речь конкретно о том, что Давид станет зятем Саула.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Передаёт обычное значение слова и непосредственность обещания Саула.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Тогда Саул сказал ... И Саул сказал
  rationale: 'Сохранены два речевых введения: первое сообщает замысел Саула, второе вводит его обращение к Давиду.'
theological_decisions: []
