  yaml_path: translation/ot/1_samuel/018/020.yaml
  text: Michal[a], Saul's daughter, loved David, and they told Saul, and the matter pleased him.
translation:
  language: ru
  text: Михаль, дочь Саула, любила Давида. Об этом сообщили Саулу, и это понравилось ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и это было правильным (или: приятным) в его глазах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֶּאֱהַב
  choice: любила
  rationale: Глагол אהב прямо означает любовь. «Любила» точно передаёт форму и не добавляет начинательного оттенка, который присутствовал бы в варианте «влюбилась».
- source_word: מִיכַל
  choice: Мелхола
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: בַּת שָׁאוּל
  choice: дочь Саула
  rationale: Естественная русская передача древнееврейской сопряжённой конструкции с сохранением родственной связи.
- source_word: אֶת דָּוִד
  choice: Давида
  rationale: Показатель прямого дополнения אֶת отдельно не переводится; синтаксическая роль имени выражена русским винительным падежом.
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: Об этом сообщили Саулу
  rationale: Неопределённое множественное подлежащее древнееврейского текста естественно передано русской неопределённо-личной конструкцией; נגד в породе хифиль означает «сообщить, рассказать».
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינָיו
  choice: это пришлось ему по душе
  rationale: Русский идиом естественно передаёт значение «это было угодно/правильно в его глазах», сохраняя положительную оценку Саула.
