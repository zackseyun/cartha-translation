translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Длинная древнееврейская цепочка с союзом ו разделена на два предложения ради естественности; явное временное «теперь» не добавлено. Местоимение «это» относится к сообщению о любви Мелхолы к Давиду.
