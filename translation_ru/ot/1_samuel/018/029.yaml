lexical_decisions:
- source_word: וַיֹּאסֶף ... לֵרֹא
  choice: стал ... бояться ещё больше
  rationale: Сочетание יסף с инфинитивом выражает продолжение или усиление действия; вместе с עוֹד и ближайшим контекстом естественно передаёт возрастание страха.
- source_word: מִפְּנֵי דָוִד
  choice: Давида
  rationale: При глаголе ירא предложное сочетание буквально «от/перед лицом Давида» идиоматически обозначает объект страха.
- source_word: עוֹד
  choice: ещё больше
  rationale: В контексте повторного упоминания страха עוֹד допускает усилительное прочтение, хотя также может означать «по-прежнему» или «впредь».
- source_word: וַיְהִי שָׁאוּל אֹיֵב אֶת דָּוִד
  choice: оставался Саул врагом Давида
  rationale: Конструкция описывает устойчивую враждебность Саула к Давиду; «оставался» естественно связывает это состояние с предшествующим повествованием.
- source_word: כָּל הַיָּמִים
  choice: всё это время
  rationale: Буквально «все дни» может обозначать постоянную продолжительность в рамках описываемого периода и не обязательно всю оставшуюся жизнь Саула.
