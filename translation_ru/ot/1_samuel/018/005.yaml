  text: וַ/יֵּצֵ֨א דָוִ֜ד בְּ/כֹל֩ אֲשֶׁ֨ר יִשְׁלָחֶ֤/נּוּ שָׁאוּל֙ יַשְׂכִּ֔יל וַ/יְשִׂמֵ֣/הוּ שָׁא֔וּל עַ֖ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֑ה וַ/יִּיטַב֙ בְּ/עֵינֵ֣י כָל הָ/עָ֔ם וְ/גַ֕ם בְּ/עֵינֵ֖י עַבְדֵ֥י שָׁאֽוּל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/005.yaml
  text: David went out wherever Saul sent him[a], and he acted wisely. So Saul appointed him over the men of war[b], and this was good in the eyes of all the people and also in the eyes of Saul’s servants.
translation:
  language: ru
  text: Давид отправлялся всюду, куда посылал его Саул, и действовал благоразумно[a]. Поэтому Саул поставил его над воинами, и это было хорошо в глазах всего народа, а также в глазах слуг Саула[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и добивался успеха». Еврейский глагол שׂכל в этой форме может указывать как на благоразумные действия, так и на их успешный результат.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и это понравилось всему народу и слугам Саула». Еврейский текст допускает, что одобрение относится к самому Давиду, к его назначению или ко всей только что описанной ситуации.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: отправлялся
  rationale: В контексте повторяющихся поручений и военных выходов форма естественно передаётся как «отправлялся», сохраняя значение יצא без излишнего уточнения «в поход».
- source_word: בְּכֹל אֲשֶׁר יִשְׁלָחֶנּוּ שָׁאוּל
  choice: всюду, куда посылал его Саул
  rationale: Так передан дистрибутивный смысл фразы применительно к неоднократным поручениям; русская формулировка естественна и не сужает их содержание.
- source_word: יַשְׂכִּיל
  choice: действовал благоразумно
  rationale: Hiphil от שׂכל может обозначать как разумное, осмотрительное поведение, так и сопутствующий ему успех. Основной текст сохраняет смысл благоразумия, а возможный оттенок успеха отмечен в сноске.
- source_word: וַיְשִׂמֵהוּ
  choice: поставил его
  rationale: В сочетании с עַל глагол обозначает назначение над группой людей. «Поставил его над» естественно сохраняет образ и административный смысл еврейской конструкции.
- source_word: עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: над воинами
  rationale: Краткое современное соответствие выражению «люди войны», ясно обозначающее военных и не создающее неестественной русской кальки.
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: это было хорошо в глазах
  rationale: Формулировка сохраняет еврейскую идиому и не определяет однозначно, относится ли одобрение к Давиду, его назначению или всей описанной ситуации.
- source_word: כָל הָעָם
  choice: всего народа
  rationale: עם имеет здесь широкое значение народа; перевод не ограничивает его только войском.
- source_word: עַבְדֵי שָׁאוּל
  choice: слуг Саула
  rationale: Прямое соответствие עבדים, которое может включать придворных и должностных лиц, не сужая понятие до одной категории.
