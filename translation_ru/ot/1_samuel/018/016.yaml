lexical_decisions:
- source_word: וְ/כָל
  choice: Но весь
  rationale: Союз связывает стих с предшествующим рассказом о страхе и враждебности Саула; «но» естественно передаёт контраст, а «весь» сохраняет значение כָל.
- source_word: יִשְׂרָאֵל וִ/יהוּדָה
  choice: Израиль и Иуда
  rationale: Прямое воспроизведение названий сохраняет проведённое в тексте различие между Израилем и Иудой; определение «весь» грамматически относится к сочетанию в целом.
- source_word: אֹהֵב
  choice: любили
  rationale: Причастие обозначает продолжающееся общее отношение. Русское прошедшее время естественно в повествовании; множественное число согласовано с составным подлежащим.
- source_word: אֶת דָּוִד
  choice: Давида
  rationale: Показатель прямого дополнения אֶת отдельно не переводится; имя передано в принятой русской библейской форме.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину любви народа к Давиду.
- source_word: הוּא
  choice: он
  rationale: Сохраняется явно выраженное самостоятельное местоимение.
- source_word: יוֹצֵא וָ/בָא
  choice: выходил и входил
  rationale: Буквально передаёт парную формулу, не добавляя отсутствующего в еврейском тексте прямого дополнения. Возможный смысл руководства народом отмечен в сноске.
- source_word: לִ/פְנֵי/הֶם
  choice: перед ними
  rationale: Формально передаёт לִפְנֵיהֶם и сохраняет возможный оттенок публичного предводительства, не делая его единственным толкованием.
