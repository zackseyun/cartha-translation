translation:
  language: ru
  text: В тот день Саул взял Давида и не позволил ему вернуться в дом своего отца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не разрешил ему вернуться». Еврейский текст буквально говорит: «не дал ему вернуться», употребляя נתן («дать») в значении позволения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: взял Давида к себе
  rationale: Глагол לקח буквально означает «взять». Добавление «к себе» естественно передаёт направленность действия в данном контексте, а имя «Давида» ясно обозначает референта местоименного суффикса.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямое и естественное соответствие еврейскому временному выражению.
- source_word: וְלֹא נְתָנוֹ לָשׁוּב
  choice: и не позволил ему вернуться
  rationale: נתן с инфинитивом употреблено идиоматически в значении разрешения или позволения; буквальное «не дал ему вернуться» возможно по-русски, но здесь менее ясно выражает смысл.
- source_word: בֵּית אָבִיו
  choice: в дом отца
  rationale: Сохраняет образ еврейского выражения и естественно звучит по-русски; речь может идти как о жилище, так и об отцовском доме как семье или хозяйстве.
