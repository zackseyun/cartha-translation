translation_notes:
  register: Современный литературный русский язык с умеренно формальным, повествовательным регистром. Имя «Давида» эксплицировано ради ясности, а «к себе» естественно указывает, что Саул оставил его при своём дворе, не превращая этот контекстуальный смысл в более узкое «взял на службу».
