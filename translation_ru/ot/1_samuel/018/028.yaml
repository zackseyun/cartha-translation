source:
  edition: WLC
  text: וַ/יַּ֤רְא שָׁאוּל֙ וַ/יֵּ֔דַע כִּ֥י יְהוָ֖ה עִם דָּוִ֑ד וּ/מִיכַ֥ל בַּת שָׁא֖וּל אֲהֵבַֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/028.yaml
  text: Saul saw and knew that Yahweh was with David[a], and that Michal the daughter of Saul loved him.
translation:
  language: ru
  text: Саул увидел и понял, что Яхве был с Давидом и что Михаль, дочь Саула, любила его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: 'Сохраняет обычное значение ראה и последовательность повествования: Саул сначала увидел происходящее, а затем осознал его смысл.'
- source_word: וַיֵּדַע
  choice: понял
  rationale: В данном контексте ידע обозначает пришедшее на основании наблюдения твёрдое осознание; «понял» звучит естественнее по-русски, чем буквальное «узнал», и не сливается по смыслу с «увидел».
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что понял Саул.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: עִם דָּוִד
  choice: был с Давидом
  rationale: Естественно передаёт присутствие и поддержку Бога, не добавляя сверх текста более узкого толкования.
- source_word: וּמִיכַל בַּת שָׁאוּל
  choice: и что Михаль, дочь Саула
  rationale: Второе «что» естественно восполняется по-русски, поскольку эта фраза представляет ещё одно содержание осознания Саула. Приложение «дочь Саула» точно и ясно передаёт еврейскую конструкцию.
- source_word: אֲהֵבַתְהוּ
  choice: любила его
  rationale: Причастная форма обозначает продолжающееся состояние; русский глагол прошедшего времени естественно выражает его в повествовательном контексте, не усиливая значения до «влюбилась».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте употреблено личное имя Бога; форма «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл выражения «Яхве был с Давидом»
  choice: сохранить формулировку «был с Давидом»
  alternative: «поддерживал Давида»
  rationale: Буквенная и естественная формулировка сохраняет как идею Божьего присутствия, так и подразумеваемое благоволение, не сводя выражение только к поддержке.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранена последовательность «увидел и понял», но не употреблено неестественное в данном контексте «увидел и узнал». Имя מִיכַל передано близкой к еврейскому звучанию формой «Михаль».
