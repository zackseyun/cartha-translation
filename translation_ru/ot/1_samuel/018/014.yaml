  text: And David was acting wisely in all his ways[a], and Yahweh was with him.
translation:
  language: ru
  text: И во всех своих делах Давид поступал благоразумно[a], и Яхве был с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «добивался успеха», «преуспевал»; еврейское слово может обозначать благоразумные действия, ведущие к успеху.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: поступал
  rationale: Связка вводит продолжающийся образ действий Давида; по-русски естественно передать её вместе с причастным сказуемым как «поступал».
- source_word: דָוִד
  choice: Давид
  rationale: Традиционная русская форма личного имени.
- source_word: לְכָל דָּרְכָו
  choice: во всех своих делах
  rationale: Оборот буквально говорит о «всех его путях», но в данном повествовательном контексте обозначает все действия и начинания Давида; выбран естественный современный русский эквивалент.
- source_word: מַשְׂכִּיל
  choice: благоразумно
  rationale: Причастие породы хифиль от שׂכל может обозначать разумное, осмотрительное поведение и возникающий вследствие него успех. «Поступал благоразумно» сохраняет основной акцент на образе действий.
- source_word: וַיהוָה
  choice: и Яхве
  rationale: Передано собственное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: עִמּוֹ
  choice: был с ним
  rationale: Естественная передача присутствия и поддержки; формулировка не уточняет сверх текста, каким именно образом проявлялось это присутствие.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст употребляет тетраграмматон как личное имя Бога; транслитерация «Яхве» сохраняет это различие и согласуется с предоставленным консультационным слоем.
- issue: Соотношение благоразумия и успеха в מַשְׂכִּיל
  choice: поступал благоразумно
  alternative: имел успех; преуспевал
  rationale: Еврейское слово допускает как смысл разумного поведения, так и обусловленного им успеха. Основной текст передаёт образ действий, а альтернативный оттенок сохранён в примечании, без сведения многозначности лишь к результату.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис простой и ясный; начальное «И» сохраняет повествовательную связь. Формула «во всех своих делах» выбрана вместо более буквального, но менее конкретного «на всех своих путях».
