  text: 'Слуги Саула сообщили ему: «Такие слова сказал Давид».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Давид сказал слова такого рода».'
    reason: Передаёт более формальную структуру еврейского выражения כַּדְּבָרִים הָאֵלֶּה, допускающего оттенки «согласно этим словам» и «подобно этим словам», при этом сохраняет совершенный вид глагола דִּבֶּר.
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: сообщили
  rationale: Глагол в породе хифиль означает «сообщить, передать, доложить». «Сообщили» естественно по-русски и не уточняет без необходимости официальный характер доклада.
- source_word: עַבְדֵי שָׁאוּל
  choice: слуги Саула
  rationale: עֶבֶד может обозначать слуг, придворных или должностных лиц. «Слуги» сохраняет широту исходного обозначения и подходит к царскому окружению.
- source_word: לוֹ
  choice: ему
  rationale: Местоимение относится к Саулу; дательный падеж естественно передаёт адресата сообщения.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Инфинитив вводит содержание сообщения. В современном русском эту функцию естественно выполняют двоеточие и кавычки.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: такие слова
  rationale: Оборот буквально означает «согласно этим словам» или «подобные этим слова». Перевод «такие слова» сохраняет элемент подобия и указывает на содержание ранее приведённого ответа Давида.
- source_word: דִּבֶּר
  choice: сказал
  rationale: Хотя דִּבֵּר буквально соответствует «говорил», в формуле передачи конкретного ответа совершенный вид «сказал» звучит естественнее и точно передаёт завершённое речевое действие.
- source_word: דָּוִד
  choice: Давид
  rationale: Традиционная русская форма имени.
