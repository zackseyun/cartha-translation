base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/022.yaml
  text: So Saul commanded his servants[a], “Speak to David privately, saying, ‘Look, the king delights in you, and all his servants love you[b]. So now become the king’s son-in-law.’”
translation:
  language: ru
  text: 'И повелел Саул своим слугам: «Поговорите с Давидом тайно[a] и скажите ему: „Вот, царь благоволит к тебе, и все его слуги любят тебя. Так стань же теперь зятем царя[b]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тихо».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вступи в брачное родство с царём» или «породнись с царём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: повелел
  rationale: Глагол צוה выражает распоряжение, имеющее силу приказа; «повелел» передаёт это значение и соответствует достоинству повествовательного регистра.
- source_word: עֲבָדוֹ
  choice: своим слугам
  rationale: עבד при царском дворе может обозначать слуг, приближённых или должностных лиц. «Слуги» сохраняет широкое значение слова, не приписывая им определённого чина.
- source_word: דַּבְּרוּ אֶל־דָּוִד
  choice: Поговорите с Давидом
  rationale: Так естественно передаётся повелительное דַּבְּרוּ с предлогом אֶל; формулировка подразумевает обращение к Давиду и последующую передачу слов Саула.
- source_word: בַּלָּט
  choice: наедине
  rationale: Наречие указывает на скрытый, негласный или тихий характер разговора. В данной ситуации «наедине» естественно выражает отсутствие посторонних, не усиливая значение до обязательной тайной интриги.
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание к следующему утверждению; «вот» сохраняет её риторическую функцию в современном русском языке.
- source_word: חָפֵץ בְּךָ
  choice: благоволит к тебе
  rationale: Конструкция חפץ ב выражает удовольствие, расположение или благосклонность к человеку. «Благоволит к тебе» естественно подходит к придворной речи и не создаёт нежелательного романтического оттенка.
- source_word: אֲהֵבוּךָ
  choice: любят тебя
  rationale: Прямое соответствие глаголу אהב; контекст допускает понимание любви как искреннего расположения, но не требует ослаблять её до «хорошо относятся».
- source_word: וְעַתָּה
  choice: Так ... же теперь
  rationale: Сочетание передаёт переход от заявленного расположения царя и слуг к побуждению действовать; частица «же» придаёт фразе естественную увещевательную силу.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: стань зятем царя
  rationale: Hitpael глагола חתן означает вступить в брачное родство. В контексте обращения к Давиду конкретный смысл — стать царским зятем; русский оборот ясно и естественно передаёт это значение.
