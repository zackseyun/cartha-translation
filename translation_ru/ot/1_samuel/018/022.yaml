  terminology: Имена, титул «царь», а также брачно-родственный термин «зять царя» переданы корректно. «Зять царя» — ясная русская экспликация контекстуального смысла הִתְחַתֵּן בַּמֶּלֶךְ и не добавляет богословской интерпретации.
