  source_fidelity: 'Основной смысл передан верно: Саул приказывает своим слугам обратиться к Давиду, сообщает о благоволении царя и слуг и побуждает его вступить в брачное родство с царским домом. Однако «наедине» сужает значение בַּלָּט до разговора без посторонних, тогда как слово прежде всего указывает на тайный/негласный (возможен также тихий) характер обращения. Также конструкция «поговорите ... и скажите» несколько размывает вводящее לֵאמֹר; «скажите ему» яснее передаёт порученное содержание речи.'
