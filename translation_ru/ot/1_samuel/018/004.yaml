  text: Then Jonathan stripped off the robe that was on him and gave it to David[a], along with his armor, and even his sword, his bow, and his belt.
translation:
  language: ru
  text: И снял Ионафан с себя плащ, который был на нём, и отдал его Давиду, а также свои одежды[a] — и даже свой меч, свой лук и свой пояс.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своё воинское (или служебное) облачение»; еврейское слово может обозначать одежды, в том числе официальное или воинское одеяние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּשֵּׁט
  choice: снял с себя
  rationale: Передаёт возвратное значение хитпаэля и естественно звучит по-русски, не создавая впечатления полного обнажения.
- source_word: הַמְּעִיל
  choice: плащ
  rationale: מְעִיל обозначает верхнее одеяние или мантию; «плащ» ясно и естественно передаёт предмет одежды, не усиливая прямо его статусную символику.
- source_word: אֲשֶׁר עָלָיו
  choice: который был на нём
  rationale: Близко следует еврейской относительной конструкции и подчёркивает, что Ионафан отдал именно надетый на нём плащ.
- source_word: וַיִּתְּנֵהוּ לְדָוִד
  choice: и отдал его Давиду
  rationale: Прямо передаёт повествовательное נתן; местоимение относится к плащу.
- source_word: וּמַדָּיו
  choice: а также своё воинское облачение
  rationale: מַדִּים может означать одежду, особенно официальное или воинское одеяние. Контекст меча, лука и пояса поддерживает военное значение, но «облачение» не сужает его до собственно защитных доспехов.
- source_word: וְעַד
  choice: вплоть до
  rationale: Сохраняет буквальный образ расширения перечня посредством עַד и передаёт кульминационный охват последующих предметов.
- source_word: חַרְבּוֹ
  choice: меча
  rationale: Обычный русский эквивалент חֶרֶב; притяжательное значение ясно из «своё» и общего перечня.
- source_word: קַשְׁתּוֹ
  choice: лука
  rationale: Стандартный эквивалент קֶשֶׁת в военном контексте.
- source_word: חֲגֹרוֹ
  choice: пояса
  rationale: Современный и ясный эквивалент предмета, которым опоясывались; избегает архаического «препоясание».
theological_decisions:
- issue: Повествовательное значение даров Ионафана
  choice: Описать поступок без прямого истолкования его символики.
  alternative: Явно представить дары как признание будущего царства Давида или только как знаки дружбы и завета.
  rationale: В данном стихе еврейский текст сообщает действия, но не объясняет их значение; нейтральная передача сохраняет повествовательную и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальное «И» сохраняет связь с предыдущим стихом. Формула «снял с себя» ясна и не подразумевает полного обнажения; «воинское облачение» сохраняет лексическую широту מַדִּים.
