base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/012.yaml
  text: Samuel rose early in the morning to meet Saul[a], and it was reported to Samuel, saying, “Saul came to Carmel, and look, he has set up a monument for himself; then he turned and passed on and went down to Gilgal.”
translation:
  language: ru
  text: 'Самуил встал рано утром, чтобы встретить Саула. Самуилу сообщили: «Саул пришёл в Кармил и вот, поставил себе памятник[a]; затем он повернул, двинулся дальше и спустился в Галгал».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поставил себе руку». Здесь «рука» означает памятный знак или памятник.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: встал рано утром
  rationale: Сочетание глагола в породе hифиль с указанием на утро подчёркивает раннее начало действия; перевод естественен для современного русского повествования.
- source_word: לִקְרַאת שָׁאוּל
  choice: чтобы встретить Саула
  rationale: Предлог ל с инфинитивной конструкцией выражает цель; «чтобы встретить» ясно передаёт её без добавления лишних деталей.
- source_word: וַיֻּגַּד לִשְׁמוּאֵל לֵאמֹר
  choice: Самуилу сообщили
  rationale: Безличная русская конструкция сохраняет отсутствие названного сообщающего; формулу לֵאמֹר естественно передаёт последующая прямая речь.
- source_word: בָּא שָׁאוּל הַכַּרְמֶלָה
  choice: Саул пришёл в Кармил
  rationale: Направительное окончание у названия места обозначает движение к Кармилу; «пришёл в» естественно звучит внутри передаваемого сообщения.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Частица привлекает внимание к следующему факту; «и вот» сохраняет её указательно-повествовательную функцию в современном литературном русском.
- source_word: מַצִּיב לוֹ יָד
  choice: поставил себе памятник
  rationale: Причастие после וְהִנֵּה живо представляет действие и его наличный результат. Здесь יָד буквально означает «рука», но употреблено в значении памятного знака или монумента; возвратное «себе» передаёт לוֹ.
- source_word: וַיִּסֹּב וַיַּעֲבֹר
  choice: затем он повернул, двинулся дальше
  rationale: Последовательность глаголов описывает смену направления и продолжение пути; выбранная формулировка естественна и не уточняет маршрут сверх текста.
- source_word: וַיֵּרֶד הַגִּלְגָּל
  choice: спустился в Галгал
  rationale: ירד обозначает движение вниз, вероятно топографический спуск; «спустился» сохраняет эту пространственную деталь.
