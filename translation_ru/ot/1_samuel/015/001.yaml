  yaml_path: translation/ot/1_samuel/015/001.yaml
  text: Then Samuel said to Saul[a], “Yahweh sent me to anoint you as king over his people, over Israel. So now, listen to the words of Yahweh.”
translation:
  language: ru
  text: 'И сказал Самуил Саулу: «Яхве послал меня помазать тебя царём над Его народом, над Израилем. А теперь внимай словам Яхве[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слушай голос слов Яхве». Древнееврейское выражение призывает не только услышать сказанное, но и отнестись к нему с послушанием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма с повествовательным waw продвигает рассказ; традиционная русская формула «И сказал» здесь естественна и сохраняет связь с предшествующим повествованием.
- source_word: שְׁמוּאֵל ... שָׁאוּל
  choice: Самуил ... Саулу
  rationale: Использованы закрепившиеся в русском библейском употреблении формы имён.
- source_word: אֹתִי שָׁלַח יְהוָה
  choice: Яхве послал меня
  rationale: Естественный русский порядок слов передаёт завершённое поручение; вынесение местоимения в древнееврейском не воспроизводится механически.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: לִמְשָׁחֳךָ לְמֶלֶךְ
  choice: помазать тебя царём
  rationale: Сохраняется термин помазания при поставлении на царское служение; творительный «царём» естественно выражает назначение на должность.
- source_word: עַל עַמּוֹ עַל יִשְׂרָאֵל
  choice: над Его народом, над Израилем
  rationale: Повтор предлога сохранён, чтобы передать царскую власть и поясняющее отождествление народа с Израилем.
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Выражает переход от напоминания о поставлении Саула к непосредственному повелению.
- source_word: שְׁמַע לְקוֹל דִּבְרֵי יְהוָה
  choice: слушайся слов Яхве
  rationale: Глагол «слушайся» естественно передаёт заключённый в שׁמע призыв не только услышать, но и исполнить; буквальная образность отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл повеления שְׁמַע
  choice: слушайся
  alternative: слушай / внимай
  rationale: В данном контексте обращение требует не простого восприятия речи, а послушного исполнения, однако буквальная форма и её оттенок сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для широкого читателя, при этом сохранены повтор «над» и термин «помазать».
