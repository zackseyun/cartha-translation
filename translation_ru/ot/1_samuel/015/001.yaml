    rationale: Глагол שׁמע прежде всего означает слушать, слышать, внимать; в контексте он может подразумевать послушание, но русский глагол «слушайся» делает это подразумевание единственным явным смыслом. Кроме того, по-русски обычно слушаются кого-либо или повелений, а не «слов» в целом.
  - severity: low
