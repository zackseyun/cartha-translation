  source_fidelity: 'Начальное поручение передано точно: Самуил говорит Саулу, что Яхве послал его помазать Саула царём над Своим народом, Израилем. Однако «слушайся слов» чрезмерно прямо превращает призыв слушать/внимать в повеление повиноваться и менее точно отражает שְׁמַע לְקוֹל. «Внимай словам» сохраняет речевую направленность исходного выражения, не исключая контекстуального оттенка послушания. Это также соответствует английскому аудиту: “listen to the words of Yahweh”.'
  naturalness: «Внимай словам Яхве» — естественная, современно-литературная и возвышенная русская формула. Она лучше сочетается со «словами», чем «слушайся слов». Повтор «над» уместно сохраняет структуру оригинала.
  terminology: «Яхве», «помазать» и традиционные русские формы имён «Самуил» и «Саул» сохранены. Место сноски перенесено к заключительному имени «Яхве», поскольку сноска относится именно к заключительному выражению «внимай словам Яхве».
