base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/035.yaml
  text: And Samuel did not see Saul again until the day of his death[a], for Samuel mourned over Saul. And Yahweh regretted that he had made Saul king over Israel.
translation:
  language: ru
  text: И Самуил больше не видел Саула до самого дня своей смерти, потому что скорбел о Сауле. А Яхве сожалел[a] о том, что поставил Саула царём над Израилем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «огорчился» или «изменил решение». В зависимости от контекста еврейский глагол может передавать сожаление, огорчение или изменение решения; здесь он выражает сожаление Яхве о том, что Он поставил Саула царём.'
    reason: Лексическая альтернатива и сохранение смыслового диапазона נִחָם без коннотации нравственной вины.
lexical_decisions:
- source_word: יָסַף ... לִרְאוֹת
  choice: больше не видел
  rationale: Отрицательная конструкция יסף с инфинитивом означает прекращение или неповторение действия; «больше не видел» естественно передаёт еврейскую идиому.
- source_word: לִרְאוֹת אֶת שָׁאוּל
  choice: видел Саула
  rationale: Сохранено обычное значение ראה «видеть»; контекст подразумевает отсутствие дальнейших личных встреч.
- source_word: עַד יוֹם מוֹתוֹ
  choice: до дня своей смерти
  rationale: Возвратное местоимение однозначно связывает смерть с Самуилом, подлежащим предложения, и сохраняет торжественную форму исходного выражения.
- source_word: הִתְאַבֵּל
  choice: скорбел
  rationale: Форма Hitpael глагола אבל обозначает глубокую скорбь или траур; «скорбел» естественно в данном контексте, где Саул ещё жив.
- source_word: אֶל שָׁאוּל
  choice: о Сауле
  rationale: При глаголе скорби русский предлог «о» естественно передаёт направленность переживания на Саула.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: נִחָם
  choice: сожалел
  rationale: В сочетании с придаточным о поставлении Саула царём глагол выражает сожаление и скорбь; перевод не устраняет антропопатическое напряжение текста.
- source_word: הִמְלִיךְ
  choice: поставил ... царём
  rationale: Hiphil от מלך означает сделать кого-либо царём; русское «поставил царём» точно и идиоматично.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Обычное русское обозначение царской власти над народом.
theological_decisions:
- issue: Антропопатический язык о Боге в נִחָם
  choice: сожалел
  alternative: раскаялся; передумал
  rationale: «Сожалел» сохраняет прямо приписанное Яхве личное переживание, не превращая его только в административную перемену решения и не делая более сильного вывода о раскаянии. Богословское напряжение с 1 Царств 15:29 оставлено без искусственного разрешения.
- issue: Чей день смерти назван в עַד יוֹם מוֹתוֹ
  choice: до дня своей [Самуила] смерти
  alternative: до дня смерти Саула
  rationale: Ближайший грамматический субъект — Самуил, а 1 Царств 19:24 показывает, что позднее Саул ещё находился в присутствии Самуила; поэтому речь идёт о смерти Самуила.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис близок к еврейскому, но не буквалистичен; сохранены повтор имени Саула, личное имя Яхве и богословское напряжение глагола נִחָם.
