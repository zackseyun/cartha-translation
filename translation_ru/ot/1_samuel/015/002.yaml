  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת פָּקַ֕דְתִּי אֵ֛ת אֲשֶׁר עָשָׂ֥ה עֲמָלֵ֖ק לְ/יִשְׂרָאֵ֑ל אֲשֶׁר שָׂ֥ם ל/וֹ֙ בַּ/דֶּ֔רֶךְ בַּ/עֲלֹת֖/וֹ מִ/מִּצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/002.yaml
  text: 'Thus says Yahweh of hosts: ‘I have taken note of what Amalek did to Israel[c][b][a], how he opposed him on the way when he came up from Egypt.’'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: «Я обратил внимание на то, что Амалек сделал Израилю, как он выступил против него на пути, когда тот выходил из Египта».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я вспомнил, что Амалек сделал Израилю»; возможно также: «Я взыщу за то, что Амалек сделал Израилю». Еврейский глагол может означать вспомнить о деле, заняться им или подвергнуть суду за него.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как он выступил против него на пути»; возможно: «как он устроил ему засаду на пути». «Ему» и «тот» относятся к Израилю как к единому народу.'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая и естественная по-русски формула пророческой речи, сохраняющая торжественный характер исходного выражения.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יהוה транслитерацией и сохраняет широту традиционного титула צבאות, не ограничивая его только земными войсками.
- source_word: פָּקַדְתִּי
  choice: Я обратил внимание на
  rationale: Глагол פקד здесь означает действенно вспомнить, принять к рассмотрению или посетить судом. Выбранная формулировка сохраняет связь с предстоящим судом, но не выражает наказание раньше следующего стиха.
- source_word: אֵת אֲשֶׁר עָשָׂה עֲמָלֵק לְיִשְׂרָאֵל
  choice: то, что Амалек сделал Израилю
  rationale: Естественно передаёт объектную конструкцию, не конкретизируя в ней характер враждебного действия.
- source_word: אֲשֶׁר שָׂם לוֹ בַּדֶּרֶךְ
  choice: как он преградил ему путь
  rationale: Контекстуально передаёт сжатое еврейское выражение о враждебном выступлении Амалека на пути Израиля; сохраняет образ пути и не сужает действие до засады.
- source_word: בַּעֲלֹתוֹ מִמִּצְרָיִם
  choice: когда тот выходил из Египта
  rationale: Передаёт обычное значение עלה в рассказе об исходе. Указательное местоимение «тот» ясно относит действие к собирательному Израилю и устраняет неестественную для русского языка цепочку местоимений.
theological_decisions:
- issue: Передача Божьего имени и титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Яхве воинств
  rationale: Личное имя сохраняется, а צבאות передаётся широким термином «Воинств», который не ограничивает титул человеческими армиями.
- issue: Оттенок Божьей памяти и суда в פָּקַדְתִּי
  choice: Я обратил внимание на
  alternative: Я вспомнил; Я взыщу за; Я накажу за
  rationale: Выбор сохраняет напряжение между памятованием о прежнем зле и последующим судебным действием, не сводя многозначный глагол только к наказанию.
- issue: Собирательный Израиль в местоименных формах
  choice: ему … тот
  alternative: ему … он; им … они
  rationale: Исходный текст представляет Израиль как собирательное единственное число. Русская формулировка сохраняет это, одновременно делая соотнесение местоимений понятным.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Яхве Воинств» сохраняет узнаваемость Божьего титула; «преградил ему путь» звучит естественно и передаёт враждебное действие без чрезмерной тактической конкретизации.
