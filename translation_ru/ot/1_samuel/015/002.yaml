revisions:
- from: 'Так говорит Яхве Воинств: «Я обратил внимание на то, что Амалек сделал Израилю, как он преградил ему путь, когда тот выходил из Египта».[a][b]'
  to: 'Так говорит Яхве Воинств: «Я обратил внимание на то, что Амалек сделал Израилю, как он выступил против него на пути, когда тот выходил из Египта».[a][b]'
