base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/021.yaml
  text: But the people took from the spoil sheep and cattle[a], the best of what had been devoted to destruction[c][b], to sacrifice to Yahweh your God at Gilgal.
translation:
  language: ru
  text: Но народ взял из добычи овец и крупный скот — лучшее из того, что было предано уничтожению[a], — чтобы принести в жертву ГОСПОДУ, твоему Богу, в Галгале.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лучшее (или: первое) из херема». Херем — то, что было безвозвратно посвящено Богу и потому подлежало уничтожению; речь идёт о животных, которых нельзя было оставлять как добычу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Но … взял
  rationale: Глагол לקח здесь означает «взял»; союз передан как «но», поскольку реплика Саула противопоставлена его предыдущему утверждению. Единственное число сказуемого естественно согласуется с собирательным «народ».
- source_word: הָעָם
  choice: народ
  rationale: Слово עם буквально означает «народ»; в контексте имеются в виду воины Саула, однако буквальный вариант сохраняет его попытку переложить ответственность на народ.
- source_word: מֵהַשָּׁלָל
  choice: из добычи
  rationale: שׁלל обозначает военную добычу; «добыча» — ясный и естественный современный русский эквивалент.
- source_word: צֹאן וּבָקָר
  choice: овец и крупный скот
  rationale: Пара обозначает мелкий и крупный домашний скот. В контексте конкретно взятых животных «овец» естественнее, чем собирательное «мелкий скот».
- source_word: רֵאשִׁית
  choice: лучшее
  rationale: Хотя רֵאשִׁית буквально может значить «начало» или «первое», здесь оно указывает на лучшую, отборную часть захваченных животных.
- source_word: הַחֵרֶם
  choice: из заклятого
  rationale: חֵרֶם обозначает то, что безвозвратно посвящено Богу и в данном повествовании подлежит уничтожению. «Заклятое» сохраняет особый сакрально-судебный смысл термина, а сноска разъясняет его.
- source_word: לִזְבֹּחַ
  choice: чтобы принести в жертву
  rationale: Инфинитив выражает цель; эта формулировка естественна в современном русском языке.
- source_word: לַיהוָה
  choice: ГОСПОДУ
  rationale: Божественное имя יהוה передано традиционным обозначением «ГОСПОДЬ» прописными буквами.
- source_word: אֱלֹהֶיךָ
  choice: твоему Богу
  rationale: 'Сохранено местоимение второго лица единственного числа: Саул говорит Самуилу «твоему Богу», а не «нашему Богу».'
- source_word: בַּגִּלְגָּל
  choice: в Галгале
  rationale: Русское управление с названием этого места естественно передаётся предлогом «в».
theological_decisions:
- issue: Передача חֵרֶם в контексте священной войны
  choice: заклятое
  alternative: то, что было предано уничтожению
  rationale: 'Краткий термин сохраняет богословскую напряжённость: животные были не обычной добычей, а принадлежали к тому, что было безвозвратно посвящено Богу и потому подлежало уничтожению. Сноска предотвращает понимание «заклятого» лишь как проклятого.'
- issue: Передача имени יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Традиционное русское обозначение имени יהוה прописными буквами узнаваемо и отличает его от обычного титула «Господь».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис остаётся ясным; тире выделяют пояснительное приложение. Формулировка сохраняет попытку Саула переложить ответственность на народ и его значимое обращение «твоему Богу».
