  source_fidelity: 'В целом смысл передан точно: Яхве посылает Саула, повелевает предать Амалика уничтожению и сражаться до окончательного уничтожения. Однако «пока они не будут истреблены» заменяет активную конструкцию еврейского текста пассивной и тем самым размывает, что именно адресат должен довести действие до конца. «С поручением» точнее и естественнее передаёт בְּדָרֶךְ после «послал», не превращая посылку в уже выполненное поручение.'
