base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/018.yaml
  text: And Yahweh sent you on a mission and said[a], ‘Go and devote the sinners, the Amalekites, to destruction[b], and fight against them until they are consumed.’
translation:
  language: ru
  text: 'И Яхве послал тебя с поручением и сказал: «Иди и предай полному уничтожению[a] грешников — амаликитян[b]; сражайся с ними, пока не уничтожишь их».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «предай заклятию». Еврейский глагол означает отдать кого-либо или что-либо под заклятие, в данном случае — на уничтожение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «грешников, Амалика»; название «Амалик» поясняет, кого здесь называют грешниками.'
    reason: source_syntax
lexical_decisions:
- source_word: וַיִּשְׁלָחֲךָ יְהוָה בְּדָרֶךְ
  choice: И Яхве послал тебя исполнить поручение
  rationale: После глагола «послал» выражение בְּדָרֶךְ обозначает не просто дорогу, а порученный путь, то есть миссию. Такой перевод естественен по-русски и сохраняет смысл посланничества.
- source_word: לֵךְ
  choice: Иди
  rationale: Прямой и естественный перевод повелительной формы глагола הלך.
- source_word: וְהַחֲרַמְתָּה
  choice: предай полному уничтожению
  rationale: В породе хифиль глагол חרם здесь означает предать кого-либо заклятию, предусматривающему уничтожение. Основной текст передаёт результат понятным современным языком, а примечание сохраняет технический смысл термина.
- source_word: הַחַטָּאִים אֶת עֲמָלֵק
  choice: грешников — амаликитян
  rationale: Слово «грешников» сохраняет нравственную характеристику, а «амаликитян» передаёт собирательное название «Амалик» как приложение, указывающее, кого именно оно обозначает.
- source_word: וְנִלְחַמְתָּ בוֹ
  choice: сражайся с ними
  rationale: Местоименный суффикс в еврейском стоит в единственном числе, поскольку относится к собирательному «Амалик»; русский перевод закономерно использует множественное число применительно к народу.
- source_word: עַד כַּלּוֹתָם אֹתָם
  choice: пока они не будут истреблены
  rationale: Оборот выражает доведение уничтожения до конца. Пассивная формулировка естественна по-русски и не уточняет сверх текста конкретного исполнителя завершающего действия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо стоит тетраграмматон; форма «Яхве» передаёт личное имя и не заменяет его титулом.
- issue: Характер повеления, выраженного глаголом חרם
  choice: предай полному уничтожению
  alternative: предай заклятию
  rationale: Перевод ясно передаёт предусмотренное здесь уничтожение, а примечание сохраняет культово-правовой оттенок посвящения под заклятие, не сводя слово ни к обычной войне, ни только к проклятию.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Техническое значение חרם вынесено в примечание, чтобы основной текст оставался ясным; собирательное «Амалик» естественно передано названием народа во множественном числе.
