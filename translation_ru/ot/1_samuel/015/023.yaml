  source_fidelity: Первая часть верно передаёт параллельное сопоставление מֶרִי с «грехом гадания» и הַפְצַר с «беззаконием и терафимами». Однако «отверг тебя как царя» может означать лишь неприятие Саула в его качестве царя, тогда как מִמֶּלֶךְ выражает отстранение от царствования («чтобы ты не был царём»).
