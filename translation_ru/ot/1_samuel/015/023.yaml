source:
  edition: WLC
  text: כִּ֤י חַטַּאת קֶ֨סֶם֙ מֶ֔רִי וְ/אָ֥וֶן וּ/תְרָפִ֖ים הַפְצַ֑ר יַ֗עַן מָאַ֨סְתָּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֖ מִ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/023.yaml
  text: For rebellion is like the sin of divination[a], and stubbornness is like wickedness and household idols. Because you have rejected the word of Yahweh[c][b], he has also rejected you from being king.
translation:
  language: ru
  text: Ибо непокорность подобна греху гадания, а своеволие — беззаконию и домашним идолам[b]. За то, что ты отверг слово Яхве, Он отверг тебя, чтобы ты не был царём[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Еврейское תְּרָפִים (терафимы) — домашние культовые изображения, или идолы.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «отверг тебя как царя».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Вводит основание предшествующего обличения; «ибо» сохраняет пояснительно-причинную связь и отличается от более конкретного יַעַן далее.
- source_word: חַטַּאת קֶסֶם
  choice: грех гадания
  rationale: Передаёт конструкцию сопряжённого состояния и широкий смысл קֶסֶם — запретное узнавание сокрытого, не сужая его до колдовства.
- source_word: מֶרִי
  choice: непокорность
  rationale: Обозначает сознательное неповиновение власти; в контексте речь идёт об отказе Саула исполнить повеление Яхве.
- source_word: וְאָוֶן
  choice: беззаконие
  rationale: В сочетании с культовыми изображениями слово имеет нравственно-религиозный смысл зла и нечестия, а не просто беды или тщеты.
- source_word: וּתְרָפִים
  choice: домашние идолы
  rationale: Передаёт понятным современному читателю выражением культовые изображения, известные как терафимы; технический термин сохранён в сноске.
- source_word: הַפְצַר
  choice: упрямое своеволие
  rationale: Сочетание передаёт не обычную настойчивость, а упорное, самонадеянное нежелание уступить и повиноваться.
- source_word: יַעַן
  choice: За то, что
  rationale: Ясно вводит конкретное основание приговора и естественно звучит перед симметричными глаголами «отверг — отверг».
- source_word: מָאַסְתָּ אֶת דְּבַר יְהוָה
  choice: ты отверг слово Яхве
  rationale: «Отверг» сохраняет значение מָאַס и намеренный риторический повтор того же корня в следующей части стиха.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: וַיִּמְאָסְךָ מִמֶּלֶךְ
  choice: Он отверг тебя как царя
  rationale: Естественно по-русски выражает отстранение Саула от царского статуса и сохраняет повтор глагола מָאַס; более буквальная передача конструкции с מן дана в сноске.
theological_decisions:
- issue: Сравнительная структура первой половины стиха
  choice: Непокорность сопоставлена с грехом гадания, а упрямое своеволие — с беззаконием и домашними идолами.
  alternative: Непокорность прямо отождествляется с грехом гадания, а своеволие — с беззаконием и терафимами.
  rationale: В еврейском тексте нет отдельного слова «подобно», однако параллелизм позволяет передать подразумеваемое сопоставление оборотом «всё равно что». Это сохраняет силу высказывания, не превращая образное нравственное приравнивание в утверждение о буквальной тождественности действий.
- issue: Смысл отвержения Саула
  choice: Он отвергнут как царь.
  alternative: Он отвергнут от царствования / чтобы не быть царём.
  rationale: Предлог מן допускает понимание удаления от царского положения. Основной текст сохраняет краткость и естественность, а сноска отмечает более буквальную форму и заложенный в ней оттенок лишения царствования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Конструкция «всё равно что» делает подразумеваемое еврейским параллелизмом сравнение понятным без ослабления обвинения. «Упрямое своеволие» точнее простого «упрямства», поскольку подчёркивает сознательное неповиновение. Личное имя передано как «Яхве».
