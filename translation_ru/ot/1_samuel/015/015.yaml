- from: 'И сказал Саул: «Их привели от амаликитян, потому что народ пощадил лучшее из мелкого и крупного скота, чтобы принести в жертву Яхве, Богу твоему; а всё остальное мы предали уничтожению[a]».'
  to: 'И Саул сказал: «Их привели от амаликитян: народ пощадил лучшее из овец и крупного скота, чтобы принести их в жертву Яхве, Богу твоему; а всё остальное мы предали уничтожению[a]».'
  rationale: 'Устранена невыраженная в еврейском тексте причинная связь: пояснение о пощажённом скоте передано без «потому что». Добавлено «их» после «принести в жертву» для явной связи с животными. Уточнены наименования скота и формулировка сноски; смысл и регистр сохранены.'
