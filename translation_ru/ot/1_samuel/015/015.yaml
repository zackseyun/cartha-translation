source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל מֵ/עֲמָלֵקִ֣י הֱבִיא֗וּ/ם אֲשֶׁ֨ר חָמַ֤ל הָ/עָם֙ עַל מֵיטַ֤ב הַ/צֹּאן֙ וְ/הַ/בָּקָ֔ר לְמַ֥עַן זְבֹ֖חַ לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/אֶת הַ/יּוֹתֵ֖ר הֶחֱרַֽמְנוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/015.yaml
  text: And Saul said[a], “They brought them from the Amalekites, because the people spared the best of the sheep and the cattle, in order to sacrifice them to Yahweh your God; but the rest we devoted to destruction.”
translation:
  language: ru
  text: 'И Саул сказал: «Их привели от амаликитян: народ пощадил лучшее из овец и крупного скота, чтобы принести их в жертву Яхве, Богу твоему; а всё остальное мы предали уничтожению[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы полностью уничтожили». В еврейском стоит форма глагола חָרַם — специального термина, означающего предать что-либо под заклятие для уничтожения.'
    reason: Лексическая альтернатива и пояснение технического значения термина.
lexical_decisions:
- source_word: הֱבִיאוּם
  choice: их привели
  rationale: Форма Hifil от בוא с местоименным суффиксом 3-го лица множественного числа означает, что животных доставили; неопределённо-личная русская конструкция естественно передаёт неназванное подлежащее 3-го лица множественного числа.
- source_word: מֵעֲמָלֵקִי
  choice: от амаликитян
  rationale: Форма обозначает народ, а не территорию; «от амаликитян» передаёт происхождение захваченного скота.
- source_word: חָמַל ... עַל
  choice: пощадил
  rationale: В контексте предписанного уничтожения выражение означает, что народ не уничтожил отборный скот; «пощадил» сохраняет и конкретное действие, и оттенок снисхождения.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: лучшее из мелкого и крупного скота
  rationale: מֵיטַב указывает на лучшую, отборную часть; собирательные русские термины точно и естественно передают две категории домашнего скота.
- source_word: לְמַעַן זְבֹחַ
  choice: чтобы принести в жертву
  rationale: לְמַעַן выражает цель, а זבח — жертвоприношение; объект понятен из ближайшего контекста и не нуждается в повторном местоимении.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное заветное имя יהוה, а не заменяющий его титул.
- source_word: אֱלֹהֶיךָ
  choice: Богу твоему
  rationale: 'Сохранён значимый суффикс 2-го лица единственного числа: Саул говорит Самуилу «твоему», риторически дистанцируясь.'
- source_word: הַיּוֹתֵר
  choice: всё остальное
  rationale: Выражение обозначает остаток, противопоставленный пощажённому лучшему скоту; добавление «всё» естественно в русском и соответствует охвату остатка.
- source_word: הֶחֱרַמְנוּ
  choice: мы предали уничтожению
  rationale: Hifil от חרם в данном контексте обозначает посвящение чего-либо безвозвратному уничтожению по заклятию; формулировка сохраняет технический смысл лучше, чем простое «уничтожили».
theological_decisions:
- issue: Передача חרם в контексте священной войны и суда
  choice: предали уничтожению
  alternative: полностью уничтожили; предали заклятию
  rationale: Глагол обозначает не просто физическое уничтожение, а передачу под заклятие для уничтожения. Основной вариант сохраняет этот смысл без малопонятного архаизма; сноска поясняет термин.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; транслитерация «Яхве» отличает его от титула «Господь».
- issue: Фраза Саула «Богу твоему»
  choice: 'сохранено второе лицо: «Богу твоему»'
  alternative: Богу нашему
  rationale: Еврейский суффикс однозначно означает «твоему». Возможное риторическое дистанцирование Саула не следует сглаживать богословски мотивированной заменой.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет последовательность оправдания Саула, а противопоставление «народ пощадил» — «мы предали уничтожению» передано без сглаживания смены лица и распределения ответственности.
