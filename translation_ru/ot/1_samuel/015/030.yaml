  text: וַ/יֹּ֣אמֶר חָטָ֔אתִי עַתָּ֗ה כַּבְּדֵ֥/נִי נָ֛א נֶ֥גֶד זִקְנֵֽי עַמִּ֖/י וְ/נֶ֣גֶד יִשְׂרָאֵ֑ל וְ/שׁ֣וּב עִמִּ֔/י וְ/הִֽשְׁתַּחֲוֵ֖יתִי לַֽ/יהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/030.yaml
  text: And he said[a], “I have sinned. Now please honor me before the elders of my people and before Israel, and return with me, so that I may bow down to Yahweh your God.”
translation:
  language: ru
  text: 'И сказал он: «Я согрешил. Теперь прошу, окажи мне честь перед старейшинами моего народа и перед Израилем, вернись со мной, чтобы я поклонился Яхве, твоему Богу».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и я поклонюсь Яхве, твоему Богу». Еврейскую форму можно понимать либо как указание цели предшествующей просьбы («чтобы я поклонился»), либо как простое продолжение («и я поклонюсь»).'
    reason: Сохранение синтаксической неоднозначности еврейского союза и глагольной формы.
lexical_decisions:
- source_word: חָטָאתִי
  choice: Я согрешил
  rationale: Форма qal perfect, 1-е лицо единственного числа, выражает прямое признание совершённого греха; русское прошедшее время естественно передаёт завершённое действие с актуальным результатом.
- source_word: עַתָּה
  choice: Теперь
  rationale: Наречие обозначает переход от признания к непосредственной просьбе Саула.
- source_word: כַּבְּדֵנִי נָא
  choice: прошу, окажи мне честь
  rationale: Побудительная форма piel от כבד здесь означает публично почтить Саула; נָא передано вежливым «прошу».
- source_word: נֶגֶד זִקְנֵי עַמִּי
  choice: перед старейшинами моего народа
  rationale: נֶגֶד указывает на действие в присутствии и на виду у людей; сохранено политически значимое выражение Саула «моего народа».
- source_word: וְנֶגֶד יִשְׂרָאֵל
  choice: и перед Израилем
  rationale: Перевод сохраняет повтор предлога и не добавляет отсутствующего в еврейском тексте слова «всем».
- source_word: וְשׁוּב עִמִּי
  choice: вернись со мной
  rationale: Императив שׁוב означает возвращение; в контексте Саул просит Самуила снова пойти вместе с ним.
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: чтобы я поклонился
  rationale: Форма от שׁחה обозначает поклон, простирание перед кем-либо; в данном контексте это поклонение Богу. Целевой оборот естественно связывает действие с предшествующей просьбой, при этом возможное сочинительное понимание отмечено в сноске.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а не заменено титулом, чтобы сохранить прямое употребление Божьего имени.
- source_word: אֱלֹהֶיךָ
  choice: твоему Богу
  rationale: 'Сохранён суффикс 2-го лица единственного числа: Саул говорит Самуилу именно «твоему Богу».'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: Исходный текст употребляет личное имя Бога; «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Слова Саула אֱלֹהֶיךָ
  choice: твоему Богу
  alternative: нашему Богу
  rationale: Еврейский текст прямо содержит форму 2-го лица единственного числа. Её сохранение удерживает повествовательное и богословское напряжение, не приписывая Саулу слов «нашему Богу».
- issue: Связь וְהִשְׁתַּחֲוֵיתִי с предшествующей просьбой
  choice: чтобы я поклонился
  alternative: и я поклонюсь
  rationale: Еврейский союз וְ допускает как простое продолжение, так и целевое прочтение после повелительной просьбы. В основном тексте выбран естественный русский целевой оборот, а подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксис сделан понятным для обычного читателя; сохранены публичный смысл просьбы Саула, выражение «моего народа» и отчуждённо звучащее «твоему Богу».
