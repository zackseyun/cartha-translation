  yaml_path: translation/ot/1_samuel/015/005.yaml
  text: Saul came to the city of Amalek and lay in wait in the wadi[a][b][c].
translation:
  language: ru
  text: Саул подошёл к городу Амалека[a] и устроил засаду в русле потока[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к городу амаликитян».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «вступил в борьбу в русле потока». Еврейский глагол здесь труден для понимания: его обычно связывают со значениями «спорить» или «вступать в борьбу», однако контекст и древние переводческие традиции допускают понимание «устроил засаду» или «стал подстерегать».'
    reason: lexical_alternative
  - marker: c
    text: Речь идёт о русле сезонного водотока или об овраге, которые вне сезона дождей могли быть сухими.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: подошёл
  rationale: Глагол בוא обозначает прибытие или движение к цели; «подошёл» естественно сочетается с עַד и передаёт достижение подступов к городу, не утверждая, что Саул вошёл в него.
- source_word: עַד
  choice: к
  rationale: В сочетании с глаголом движения עַד указывает на предел движения — «до, к»; по-русски здесь естественно «подошёл к».
- source_word: עִיר עֲמָלֵק
  choice: город Амалека
  rationale: Сочетание передано близко к форме еврейского сопряжённого оборота. Амалек может обозначать как эпонима, так и народ, поэтому альтернативное понимание отмечено в сноске.
- source_word: וַיָּרֶב
  choice: устроил засаду
  rationale: 'Форма трудна: при обычном понимании корня ריב возможны значения «вступил в спор/борьбу», однако военный контекст и древние интерпретации поддерживают значение тактического расположения в засаде. Перевод не уточняет детали манёвра.'
- source_word: בַּנָּחַל
  choice: в русле потока
  rationale: נחל обозначает сезонный водоток, его русло или ущелье. «Русло потока» понятно современному русскому читателю и не создаёт впечатления постоянно текущей реки.
