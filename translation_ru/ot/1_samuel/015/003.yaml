  text: עַתָּה֩ לֵ֨ךְ וְ/הִכִּֽיתָ֜ה אֶת עֲמָלֵ֗ק וְ/הַֽחֲרַמְתֶּם֙ אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/לֹ֥א תַחְמֹ֖ל עָלָ֑י/ו וְ/הֵמַתָּ֞ה מֵ/אִ֣ישׁ עַד אִשָּׁ֗ה מֵֽ/עֹלֵל֙ וְ/עַד יוֹנֵ֔ק מִ/שּׁ֣וֹר וְ/עַד שֶׂ֔ה מִ/גָּמָ֖ל וְ/עַד חֲמֽוֹר־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/003.yaml
  text: Now go and strike Amalek[a], and devote to destruction all that belongs to him. Do not spare him, but put to death from man to woman, from child to nursing infant, from ox to sheep[b], from camel to donkey.
translation:
  language: ru
  text: 'Теперь иди и порази Амалика[a]; предайте заклятию[b] всё, что у него есть. Не щади его, а предай смерти всех: мужчин и женщин, детей и грудных младенцев, крупный и мелкий скот[c], верблюдов и ослов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Амалик» здесь — собирательное название амаликитян как народа; поэтому далее о нём говорится в единственном числе.
    reason: lexical_alternative
  - marker: b
    text: То есть посвятите необратимому уничтожению в исполнение Божьего суда. Еврейский глагол стоит во множественном числе, тогда как окружающие повеления обращены к одному человеку.
    reason: textual_and_lexical_clarification
  - marker: c
    text: 'Буквально: «от быка до овцы (или козы)»; еврейское שֶׂה обозначает животное из мелкого скота.'
    reason: lexical_clarification
lexical_decisions:
- source_word: עַתָּה לֵךְ
  choice: Теперь иди
  rationale: Сохраняет временно-дискурсивный переход и прямую форму повеления без архаизации.
- source_word: וְהִכִּיתָה אֶת עֲמָלֵק
  choice: и порази Амалика
  rationale: Глагол נכה передан широким военным значением «поразить», а собирательное собственное имя сохранено в единственном числе.
- source_word: וְהַחֲרַמְתֶּם
  choice: предайте заклятию
  rationale: Формула передаёт не просто военное уничтожение, а посвящение необратимому уничтожению в контексте Божьего суда; множественное число повеления сохранено.
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  choice: всё, что у него есть
  rationale: Естественная русская формулировка с сохранением собирательного местоимения единственного числа.
- source_word: וְלֹא תַחְמֹל עָלָיו
  choice: Не щади его
  rationale: Кратко и точно передаёт חמל в контексте запрета оставлять кого-либо или что-либо в живых.
- source_word: וְהֵמַתָּה
  choice: предай смерти
  rationale: Передаёт каузативное значение породы hифиль глагола מות в строгом, но не архаическом регистре.
- source_word: מֵאִישׁ עַד אִשָּׁה מֵעֹלֵל וְעַד יוֹנֵק
  choice: 'всех: мужчин и женщин, детей и грудных младенцев'
  rationale: Русское перечисление естественно выражает всеохватные парные формулы исходного текста и сохраняет различие между малым ребёнком и младенцем у груди.
- source_word: מִשּׁוֹר וְעַד שֶׂה
  choice: крупный и мелкий скот
  rationale: שור обозначает животное из крупного рогатого скота, а שה — отдельное животное из мелкого скота, овцу или козу; категориальная передача сохраняет охват пары.
- source_word: מִגָּמָל וְעַד חֲמוֹר
  choice: верблюдов и ослов
  rationale: Ясная современная передача двух названных категорий домашних животных.
theological_decisions:
- issue: Сакрально-судебное значение חרם
  choice: предайте заклятию
  alternative: полностью уничтожьте
  rationale: Выбранная формула сохраняет культово-судебный оттенок посвящения уничтожению, не сводя выражение к обычному военному действию; смысл пояснён в сноске.
- issue: Собирательное единственное число עֲמָלֵק
  choice: Амалика… у него… его
  alternative: амаликитян… у них… их
  rationale: Сохранена грамматическая форма еврейского текста, где народ представлен как единое собирательное целое; это разъяснено без превращения Амалика в отдельного человека.
- issue: Смена числа в повелениях
  choice: иди… порази; предайте; не щади… предай смерти
  alternative: последовательное единственное число во всех повелениях
  rationale: Сохранён заметный переход от обращения к одному лицу к форме множественного числа וְהַחֲרַמְתֶּם и обратно, без молчаливого выравнивания текста.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Архаические слова избегаются, кроме устоявшейся формулы «предать заклятию», необходимой для передачи особого значения חרם и сразу пояснённой в сноске. Жёсткость исходного повеления не смягчается.
