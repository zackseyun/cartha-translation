base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/024.yaml
  text: Then Saul said to Samuel[a], “I have sinned, for I transgressed the command of Yahweh and your words[b], for I feared the people and listened to their voice.”
translation:
  language: ru
  text: 'Тогда Саул сказал Самуилу: «Я согрешил, ибо нарушил повеление Яхве[a] и твои слова, ибо боялся народа и послушался голоса народа[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «уста Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и послушал их голос»; по смыслу также: «и послушался их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Я согрешил
  rationale: Перфект выражает признание уже совершённого проступка; русская форма прошедшего времени естественно передаёт личную вину Саула.
- source_word: עָבַרְתִּי
  choice: нарушил
  rationale: В контексте неисполненного Божьего предписания глагол означает переступить, нарушить установленное повеление. «Нарушил» ясно и естественно передаёт этот нравственно-правовой смысл.
- source_word: פִּי יְהוָה
  choice: повеление Яхве
  rationale: Буквально «уста Яхве» — идиома, обозначающая высказанное им повеление. Контекст требует именно смысла конкретного приказания, которое Саул не исполнил.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: דְּבָרֶיךָ
  choice: твои слова
  rationale: Сохранено множественное число и прямое обращение к Самуилу без сведения его слов к отдельному от Божьего повеления учению.
- source_word: יָרֵאתִי אֶת הָעָם
  choice: боялся народа
  rationale: Сохраняется обычное значение существительного «народ» и прямой смысл глагола страха; контекст не требует сужать значение до «войска».
- source_word: וָאֶשְׁמַע בְּקוֹלָם
  choice: и послушал их голос
  rationale: Сохранён образ «слушать голос», важный для контраста между голосом Яхве и голосом народа; одновременно по-русски выражение допускает подразумеваемый смысл подчинения их требованиям.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Смысл идиомы פִּי יְהוָה
  choice: повеление Яхве
  alternative: уста Яхве; слово Яхве
  rationale: Буквальный образ отмечен в сноске, а основной текст передаёт его контекстуальный смысл, не усиливая и не ослабляя ответственность Саула.
- issue: Отношение объяснения Саула к его признанию
  choice: 'сохранены обе причинные связки: «ведь… потому что…»'
  alternative: опустить одну из причинных связок или представить вторую фразу как оправдание отдельным предложением
  rationale: Два כִּי показывают, что Саул признаёт грех и одновременно объясняет нарушение страхом перед народом. Перевод сохраняет эту напряжённость, не решая, было ли его раскаяние искренним.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Тогда» передаёт повествовательную последовательность; «ведь» и «потому что» различают две причинные связки и избегают тяжёлого повтора. Все сноски поставлены непосредственно после поясняемых выражений.
