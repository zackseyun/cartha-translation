translation:
  language: ru
  text: Тогда Самуил пошёл в Раму, а Саул поднялся к своему дому в Гиве Саула[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Гиве Сауловой». В еврейском тексте название имеет форму «Гива Саула».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Глагол הלך в повествовательной форме обозначает следующее действие и естественно передаётся простым русским «пошёл».
- source_word: הָרָמָתָה
  choice: в Раму
  rationale: Направительный суффикс при названии места указывает на движение к Раме; в современном русском это естественно выражается конструкцией «в Раму».
- source_word: עָלָה
  choice: поднялся
  rationale: עלה означает «подниматься, идти вверх» и здесь может сохранять топографический оттенок, поэтому он не сводится к нейтральному «пошёл».
- source_word: אֶל בֵּיתוֹ
  choice: к себе домой
  rationale: Буквально — «к своему дому». Русское «к себе домой» естественно передаёт возвращение Саула в собственный дом, не утяжеляя фразу.
- source_word: גִּבְעַת שָׁאוּל
  choice: Гиву Саулову
  rationale: Сохранена форма составного географического названия, буквально «Гива Саула». Традиционная русская модель «Гива Саулова» звучит как название места и не вынуждает однозначно понимать связь как простое владение.
