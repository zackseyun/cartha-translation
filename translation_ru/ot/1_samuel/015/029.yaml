lexical_decisions:
- source_word: וְגַם
  choice: И более того
  rationale: Передаёт соединительное и усилительно-добавочное значение выражения, связывая утверждение с предшествующим обличением.
- source_word: נֵצַח יִשְׂרָאֵל
  choice: Слава Израиля
  rationale: Сохраняет возвышенный характер божественного титула и одно из основных значений נֵצַח, не сводя его широкий смысл исключительно к вечности, силе или победе.
- source_word: יְשַׁקֵּר
  choice: не солжёт
  rationale: Прямо передаёт значение piel глагола שקר — «лгать, поступать ложно» — и подчёркивает Божью верность.
- source_word: וְלֹא יִנָּחֵם
  choice: не передумает
  rationale: В контексте окончательного отвержения Саула обозначает отсутствие отмены уже вынесенного решения; это современное и ясное русское соответствие одному из значений nifal נחם.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит основание предыдущего утверждения.
- source_word: לֹא אָדָם הוּא
  choice: Он не человек
  rationale: Передаёт прямое противопоставление Бога человеку вообще, сохраняя форму и богословское напряжение исходного текста.
- source_word: לְהִנָּחֵם
  choice: чтобы передумать
  rationale: Повтор того же русского глагола сохраняет лексическую связь с יִנָּחֵם и естественно выражает назначение инфинитивной конструкции.
theological_decisions:
- issue: Высказывание о неизменности Божьего решения
  choice: не солжёт и не передумает
  alternative: не солжёт и не смилостивится / не раскается
  rationale: Перевод относится прежде всего к конкретному решению об отвержении Саула и не превращает стих в более широкое философское определение Божьей неизменности. Вариативность נחם отмечена в сноске, что сохраняет напряжение с другими библейскими употреблениями этого глагола.
- issue: Значение божественного титула נֵצַח יִשְׂרָאֵל
  choice: Слава Израиля
  alternative: Вечный Израиля / Сила Израиля / Победа Израиля
  rationale: Основной текст сохраняет возвышенное титульное звучание, а сноска отражает реальную широту и спорность семантического диапазона נֵצַח, не закрепляя единственное богословски нагруженное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Заглавное «Он» использовано как принятое в русском религиозном письме указание на Бога. Формулировка остаётся понятной обычному читателю и сохраняет повтор ключевого глагола.
