lexical_decisions:
- source_word: וַיִּסֹּב
  choice: повернулся
  rationale: Глагол סבב обозначает поворот; следующий инфинитив уточняет, что Самуил повернулся с намерением уйти.
- source_word: לָלֶכֶת
  choice: чтобы уйти
  rationale: Инфинитив הלך здесь выражает намерение покинуть место; по-русски «уйти» естественнее передаёт контекст отъезда, чем буквальное «идти».
- source_word: וַיַּחֲזֵק
  choice: схватил
  rationale: Форма Hiphil от חזק передаёт решительное удерживание или хватание.
- source_word: בִּכְנַף
  choice: за край
  rationale: כָּנָף применительно к одежде означает её оконечность, край или угол; «край» сохраняет необходимую широту значения.
- source_word: מְעִילוֹ
  choice: верхней одежды
  rationale: מְעִיל — верхняя одежда, подобная накидке или одеянию; нейтральное выражение понятно современному читателю и не навязывает более узкую форму одежды.
- source_word: וַיִּקָּרַע
  choice: и она разорвалась
  rationale: 'Niphal допускает событийно-пассивное значение: одежда или её край разорвались. Русская возвратная форма естественно передаёт это, не уточняя сверх текста механизм разрыва.'
theological_decisions:
- issue: Не названный в еврейском тексте субъект глагола «схватил»
  choice: Саул
  alternative: он
  rationale: В непосредственном повествовательном контексте действующим лицом является Саул; явное имя устраняет неестественную для русского двусмысленность после упоминания Самуила, не меняя смысла сцены.
- issue: К чему относится местоименный суффикс в מְעִילוֹ
  choice: к Самуилу
  alternative: к Саулу
  rationale: Синтаксис и традиционное понимание сцены указывают, что Саул схватил край одежды удалявшегося Самуила. В основном тексте это выражено местоимением «его», а субъект назван как Саул.
translation_notes:
  register: Современный литературный русский, сдержанный повествовательный стиль. Союз «но» естественно передаёт контраст между намерением Самуила уйти и попыткой Саула его удержать, хотя в еврейском тексте стоит обычная повествовательная связка.
