base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/020.yaml
  text: Saul said to Samuel[a], “But I did obey the voice of Yahweh, and I went on the way that Yahweh sent me, and I brought Agag king of Amalek[b], and I devoted Amalek to destruction.”
translation:
  language: ru
  text: 'Саул сказал Самуилу: «Но я послушался голоса Яхве[a] и пошёл тем путём, по которому послал меня Яхве. Я привёл Агага, царя Амалика, а народ Амалика предал уничтожению[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «услышал голос Яхве»; в этом обороте глагол означает послушание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «полностью уничтожил»; также возможно: «подверг заклятию». Еврейский глагол означает обречь или посвятить что-либо уничтожению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: послушался голоса
  rationale: Оборот שׁמע בְּקוֹל означает «слушаться, повиноваться», а сохранение слова «голос» передаёт еврейскую идиому. Частица «но» и порядок слов выражают защитное возражение Саула естественными средствами русского языка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, обозначенное тетраграмматоном, а не заменяющий его титул.
- source_word: וָאֵלֵךְ בַּדֶּרֶךְ אֲשֶׁר שְׁלָחַנִי יְהוָה
  choice: пошёл тем путём, которым послал меня Яхве
  rationale: Сохраняется образ пути и относительная связь с поручением; формулировка при этом естественна для современного русского языка.
- source_word: וָאָבִיא
  choice: привёл
  rationale: Порода hифиль глагола בוא выражает побуждение прийти, то есть «привести». Значение «привёл обратно» контекстуально возможно, но в самом глаголе прямо не выражено.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: Агага, царя Амалика
  rationale: Прямо передаёт приложение и сохраняет имя Амалик как обозначение народа.
- source_word: וְאֶת עֲמָלֵק
  choice: а народ Амалика
  rationale: В еврейском стоит собственное имя «Амалик», метонимически обозначающее народ. Добавление слова «народ» делает коллективный смысл ясным по-русски и не смешивает Амалика с отдельно упомянутым царём Агагом.
- source_word: הֶחֱרַמְתִּי
  choice: предал уничтожению
  rationale: Глагол חרם в hифиле обозначает посвящение или обречение на уничтожение. Этот вариант сохраняет особый судебно-сакральный оттенок лучше, чем простое «уничтожил».
theological_decisions:
- issue: Передача חרם в контексте войны, совершавшейся по Божьему повелению
  choice: предал уничтожению
  alternative: полностью уничтожил; подверг заклятию
  rationale: Выбранная формулировка сохраняет идею обречения на уничтожение, не сводя значение только к фактическому истреблению и не вводя в основной текст малопонятный специальный термин.
- issue: Защитное утверждение Саула о своём послушании
  choice: Но я послушался голоса Яхве
  alternative: Я послушался Яхве; Да, я послушался голоса Яхве
  rationale: Контекст требует возражающего, настойчивого тона. «Но» естественно передаёт его, не устраняя напряжения между заявлением Саула и последующим обличением Самуила.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены личное имя «Яхве», образ пути и идиома «послушаться голоса». Коллективное значение имени «Амалик» раскрыто как «народ Амалика» ради ясности. Маркеры сносок помещены при тех выражениях, которые они поясняют.
