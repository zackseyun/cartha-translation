base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/004.yaml
  text: 'So Saul summoned the people and mustered them at Telaim: two hundred thousand foot soldiers[a], and ten thousand men of Judah.'
translation:
  language: ru
  text: 'Саул созвал народ и пересчитал его в Телаиме[a]: двести тысяч пеших воинов и десять тысяч мужей Иуды.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «с ягнятами», если בַּטְּלָאִים понимать буквально, а не как название места Телаим.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: созвал
  rationale: Каузативная форма глагола שמע здесь идиоматически означает призвать или собрать людей; «созвал» естественно передаёт это в военном контексте.
- source_word: הָעָם
  choice: народ
  rationale: Сохранено буквальное значение существительного; из контекста ясно, что речь идёт о людях, собранных для войны, но еврейский текст прямо не говорит «войско».
- source_word: וַיִּפְקְדֵם
  choice: пересчитал его
  rationale: Глагол פקד в военном контексте обозначает учёт или смотр. «Пересчитал» ясно передаёт действие и согласуется с последующими численными итогами.
- source_word: בַּטְּלָאִים
  choice: в Телаиме
  rationale: Форма понята как название места Телаим, что лучше всего соответствует контексту сбора и исчисления войска; буквальное понимание «с ягнятами» сохранено в сноске как реальная лексическая возможность.
- source_word: מָאתַיִם אֶלֶף רַגְלִי
  choice: двести тысяч пеших воинов
  rationale: רַגְלִי указывает на воинов, передвигавшихся и сражавшихся пешими; выражение передано ясно и без добавления технической терминологии.
- source_word: וַעֲשֶׂרֶת אֲלָפִים אֶת אִישׁ יְהוּדָה
  choice: и десять тысяч мужей Иуды
  rationale: אִישׁ употреблено собирательно о мужчинах, принадлежавших к Иуде; традиционное выражение «мужи Иуды» сохраняет племенную принадлежность и достоинство регистра.
