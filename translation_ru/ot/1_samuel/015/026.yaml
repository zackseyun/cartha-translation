source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לֹ֥א אָשׁ֖וּב עִמָּ֑/ךְ כִּ֤י מָאַ֨סְתָּה֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֣ יְהוָ֔ה מִ/הְי֥וֹת מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/026.yaml
  text: And Samuel said to Saul, “I will not return with you, because you have rejected the word of Yahweh, and Yahweh has rejected you from being king over Israel.”
translation:
  language: ru
  text: 'И сказал Самуил Саулу: «Я не возвращусь с тобой, потому что ты отверг слово Яхве[a], и Яхве отверг тебя как царя над Израилем[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога; в еврейском тексте стоит יהוה (ЙХВХ).
    reason: Поясняет непривычную для части русскоязычных читателей передачу тетраграмматона.
  - marker: b
    text: 'Буквально: «от того, чтобы быть царём над Израилем».'
    reason: Показывает более формальную структуру еврейского выражения и сохраняет оттенок лишения царского статуса.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма с повествовательным вававом продолжает последовательность событий; «И сказал» естественно для библейского повествования и сохраняет связь с контекстом.
- source_word: לֹא אָשׁוּב
  choice: Я не возвращусь
  rationale: Глагол שׁוב означает «возвращаться, идти обратно». Настояще-будущая форма по-русски естественно передаёт решительный отказ Самуила сопровождать Саула.
- source_word: עִמָּךְ
  choice: с тобой
  rationale: Прямой и естественный эквивалент совместности.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание отказа Самуила; причинная связь выражена явно и естественно.
- source_word: מָאַסְתָּה
  choice: ты отверг
  rationale: מאס обозначает отвержение или отказ, иногда с оттенком пренебрежения. «Отверг» сохраняет судебно-заветную силу слова без избыточного усиления.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: דבר здесь относится к переданному Богом повелению, но «слово» сохраняет широту исходного выражения и привычную библейскую формулу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: וַיִּמְאָסְךָ
  choice: и Яхве отверг тебя
  rationale: 'Повтор «отверг» воспроизводит намеренное повторение корня מאס: Саул отверг слово Яхве, а Яхве отверг Саула.'
- source_word: מִהְיוֹת מֶלֶךְ עַל יִשְׂרָאֵל
  choice: как царя над Израилем
  rationale: Естественная русская формулировка передаёт устранение Саула от царского статуса; «над Израилем» сохраняет значение предлога עַל и образ правления.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога. Транслитерация «Яхве» отличает имя от титула и следует наиболее распространённой научной реконструкции произношения.
- issue: Взаимное соответствие форм от корня מאס
  choice: В обеих частях употребить «отверг»
  alternative: Передать глаголы разными словами, например «пренебрёг» и «отверг»
  rationale: 'Одинаковая передача сохраняет смысловую взаимность исходного текста: Саул отверг слово Яхве, поэтому Яхве отверг Саула как царя.'
- issue: Характер отвержения Саула
  choice: «отверг тебя как царя»
  alternative: «отверг тебя, чтобы ты не был царём»; буквально «от того, чтобы быть царём»
  rationale: Выбранная формулировка естественна по-русски и указывает именно на царский статус, не утверждая, что Саул немедленно перестал фактически исполнять обязанности царя.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис прост и понятен; намеренный повтор «отверг» сохранён. Формулировка «как царя» выбрана ради естественности, а буквальная конструкция приведена в сноске.
