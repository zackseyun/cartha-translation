  to: 'Но Самуил сказал: «Что же это за звук овец, доносящийся до моих ушей, и звук крупного скота, который я слышу?»'
  rationale: Текст приведён к ясной параллельной конструкции. Повтор «звук» воспроизводит повтор קוֹל, не навязывая конкретный вид звуков животных. «Доносится до моих ушей» естественно передаёт בְּאָזְנָי, а «я слышу» сохраняет явное местоимение и непосредственное свидетельство Самуила. Поскольку лексическая особенность теперь отражена в самом тексте, сноска с маркером [a] удалена.
