  text: But Samuel said[a], “Then what is this sound of sheep in my ears, and the sound of cattle that I hear?”
translation:
  language: ru
  text: 'Но Самуил сказал: «Что же это за звук овец, доносящийся до моих ушей, и звук крупного скота, который я слышу?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но Самуил сказал
  rationale: Последовательная форма продолжает повествование, а союз «но» передаёт контекстуальное противопоставление заявлению Саула о послушании.
- source_word: וּמֶה
  choice: Что же тогда
  rationale: Вопрос требует объяснить слышимые звуки; частицы «же тогда» естественно передают связующую и вызывающую силу еврейского выражения.
- source_word: קוֹל
  choice: блеяние / мычание
  rationale: В данном контексте קוֹל обозначает слышимые звуки животных. Конкретные русские названия этих звуков естественнее общего «звук» и сохраняют очевидный смысл реплики; одинаковое еврейское слово в обоих случаях отмечено в сноске.
- source_word: הַצֹּאן
  choice: овец
  rationale: Коллективное существительное может охватывать мелкий скот, включая овец и коз, однако в сочетании с крупным скотом традиционное и понятное «овец» уместно без излишнего уточнения.
- source_word: הַזֶּה
  choice: за блеяние
  rationale: Русская конструкция «что же это за…» передаётся здесь идиоматически вопросом «что же тогда за…»; указание относится к непосредственно слышимому звуку.
- source_word: בְּאָזְנָי
  choice: доносится до моих ушей
  rationale: Передаёт наглядный образ еврейского «в моих ушах», избегая неестественного для современного русского буквального оборота.
- source_word: וְקוֹל הַבָּקָר
  choice: и за мычание крупного скота
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота; «мычание» естественно обозначает издаваемый им звук.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: я слышу
  rationale: Относительное придаточное указывает на непосредственно воспринимаемое Самуилом свидетельство; явное «я» сохраняет лёгкое ударение местоимения אָנֹכִי.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной риторической резкостью. Образ «в ушах» передан естественным оборотом «доносится до моих ушей»; конкретные «блеяние» и «мычание» делают реплику живой, а сноска сохраняет лексическую особенность оригинала.
