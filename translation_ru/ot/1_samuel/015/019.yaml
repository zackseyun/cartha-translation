  source_fidelity: 'Текст верно передаёт все смысловые элементы масоретского текста: вопросительный упрёк с связующей частицей («Почему же»), повиновение голосу Яхве, устремление к военной добыче и совершение зла в глазах Яхве. «Жадно бросился на» обоснованно передаёт экспрессивный и отрицательно окрашенный глагол וַתַּעַט, не добавляя конкретных деталей события.'
