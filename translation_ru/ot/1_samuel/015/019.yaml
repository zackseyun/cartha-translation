  text: וְ/לָ֥/מָּה לֹא שָׁמַ֖עְתָּ בְּ/ק֣וֹל יְהוָ֑ה וַ/תַּ֨עַט֙ אֶל הַ/שָּׁלָ֔ל וַ/תַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/019.yaml
  text: Why then did you not obey the voice of Yahweh[a], but rush upon the spoil and do what was evil in the eyes of Yahweh?
translation:
  language: ru
  text: Почему же ты не послушался голоса Яхве, а жадно бросился на добычу[a] и сделал зло в глазах Яхве?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «набросился на добычу»; древнееврейский глагол передаёт стремительное и алчное устремление к военной добыче.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: Почему же
  rationale: Частица וְ связывает вопрос с предшествующим упрёком; «же» естественно передаёт эту связь в современном русском языке.
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: послушался голоса
  rationale: В данном контексте оборот означает повиновение сказанному, при этом сохраняется конкретный образ «голоса».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וַתַּעַט אֶל
  choice: жадно бросился на
  rationale: Редкий глагол описывает стремительное, алчное устремление к добыче; формулировка передаёт и движение, и неодобрительную окраску.
- source_word: הַשָּׁלָל
  choice: добычу
  rationale: Естественный русский военный термин для захваченного имущества.
- source_word: וַתַּעַשׂ הָרַע
  choice: сделал зло
  rationale: Прямо и естественно передаёт устойчивый древнееврейский оборот, не конкретизируя зло сверх текста.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет прозрачную древнееврейскую метафору оценки с точки зрения Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение שׁמע בקול
  choice: послушался голоса
  alternative: услышал голос
  rationale: В контексте повеления речь идёт не просто о восприятии речи, а о повиновении, однако образ голоса сохранён.
translation_notes:
  register: Современный литературный русский язык; речь Самуила передана как прямой, выразительный и достойный пророческий упрёк. Сохранены повтор имени Яхве и образ «в глазах».
