  source_fidelity: В целом перевод точно передаёт коллективное обращение к кенеям, троекратную цепочку повелений, предупреждение о совместной гибели, оказанную Израилю חֶסֶד и последующее удаление кенеев. Однако רְדוּ — отдельное повеление со значением «спуститесь/сойдите»; его не следует полностью снимать в переводе. Конструкция «чтобы мне не погубить» менее точно передаёт предупредительное פֶּן («иначе, чтобы не случилось так, что...»).
