  terminology: «Кенеи», «амаликитяне» и «сыны Израиля» переданы последовательно и уместно. «Доброту» выбираем как естественный русский эквивалент חֶסֶד, согласующийся с английским audit trail («kindness») и не навязывающий богословского уточнения.
