source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֣וּל אֶֽל הַ/קֵּינִ֡י לְכוּ֩ סֻּ֨רוּ רְד֜וּ מִ/תּ֣וֹךְ עֲמָלֵקִ֗י פֶּן אֹֽסִפְ/ךָ֙ עִמּ֔/וֹ וְ/אַתָּ֞ה עָשִׂ֤יתָה חֶ֨סֶד֙ עִם כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/עֲלוֹתָ֖/ם מִ/מִּצְרָ֑יִם וַ/יָּ֥סַר קֵינִ֖י מִ/תּ֥וֹךְ עֲמָלֵֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/006.yaml
  text: Then Saul said to the Kenite[a], “Go, turn aside, go down from among the Amalekites, lest I sweep you away with them[c][b]. For you showed kindness to all the sons of Israel when they came up from Egypt.” So the Kenite turned aside from among the Amalekites.
translation:
  language: ru
  text: 'Тогда Саул сказал кенеям: «Идите, отойдите, спуститесь из среды амаликитян, иначе я погублю вас вместе с ними. Ведь вы оказали доброту всем сынам Израиля, когда они вышли из Египта». И кенеи отошли из среды амаликитян.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקֵּינִי / קֵינִי
  choice: кенеям / кенеи
  rationale: Еврейское собирательное единственное обозначает группу. В современном русском множественное число естественно передаёт обращение, выраженное в тексте несколькими формами множественного числа, и последующее действие народа.
- source_word: לְכוּ סֻּרוּ רְדוּ
  choice: идите, отойдите, уйдите
  rationale: Сохранена трёхчастная последовательность повелений. «Уйдите» естественно передаёт ירד в контексте удаления из опасного места, не навязывая сомнительную для русского читателя топографию.
- source_word: מִתּוֹךְ עֲמָלֵקִי / מִתּוֹךְ עֲמָלֵק
  choice: из среды амаликитян
  rationale: Передаёт значение отделения от находящегося вокруг народа и сохраняет повтор выражения в начале и конце стиха.
- source_word: פֶּן אֹסִפְךָ עִמּוֹ
  choice: чтобы мне не погубить вас вместе с ними
  rationale: В контексте суда אסף означает устранить или погубить вместе с обречёнными. Русская конструкция ясно передаёт предупреждение, а множественное число согласуется с коллективным адресатом.
- source_word: חֶסֶד
  choice: милость
  rationale: «Милость» сохраняет ёмкость חסד — благожелательный и верный поступок — и звучит естественно, не утверждая формального заветного статуса кенеев.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: всем сынам Израиля
  rationale: Сохраняет традиционную национальную формулу и явный образ исходного выражения.
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: когда они выходили из Египта
  rationale: В русском это естественное обозначение исхода. Буквальное «поднимались» здесь могло бы ошибочно восприниматься как указание на конкретный рельеф.
theological_decisions:
- issue: Смысл חֶסֶד в отношении кенеев к Израилю
  choice: милость
  alternative: доброта; верность; заветная верность
  rationale: Контекст говорит о благодеянии и лояльном отношении к Израилю, но не сообщает прямо о формальном завете кенеев. «Милость» сохраняет нравственную и реляционную глубину слова без конфессионального уточнения.
- issue: Коллективное единственное הַקֵּינִי
  choice: множественное «кенеи»
  alternative: единственное «кеней»
  rationale: Множественные повелительные формы показывают, что Саул обращается к группе. Выбор множественного числа делает это явным по-русски, не меняя референта.
- issue: Характер угрозы в אֹסִפְךָ
  choice: погубить вместе с ними
  alternative: смести вместе с ними; уничтожить вместе с ними; присоединить к ним
  rationale: В данном судебно-военном контексте речь идёт о гибели кенеев при уничтожении Амалика. Перевод передаёт контекстуальный смысл, не представляя это как нейтральное «собирание».
translation_notes:
  register: Современный литературный русский с достоинством повествовательной прозы. Сохранены повтор формулы «из среды амаликитян» и цепочка из трёх повелений; архаичные или искусственно буквальные обороты сведены к минимуму.
