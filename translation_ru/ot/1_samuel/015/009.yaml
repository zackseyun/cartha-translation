base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/009.yaml
  text: But Saul and the people spared Agag and the best of the sheep and cattle[a], and the fattened calves, and the lambs, and all that was good, and they were not willing to devote them to destruction[b]. But every despised and worthless thing they devoted to destruction.
translation:
  language: ru
  text: Но Саул и народ пощадили Агага, лучшее из овец и крупного скота, откормленных животных[a], ягнят и всё хорошее; они не захотели предать их уничтожению[b]. А всё презренное и негодное они предали уничтожению.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово, переведённое как «откормленные животные», имеет неясное значение; возможно также: «животные второго приплода» или «отборный скот».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально — «предать заклятию»: безвозвратно отдать Богу, в данном случае для полного уничтожения.'
    reason: technical_term
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: пощадили
  rationale: В данном контексте глагол обозначает не только чувство жалости, но прежде всего отказ уничтожить тех, кого было велено уничтожить.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: лучшее из овец и крупного скота
  rationale: Конструкция указывает на лучшую, наиболее ценную часть мелкого и крупного скота; собирательная формулировка естественна по-русски.
- source_word: הַמִּשְׁנִים
  choice: откормленных животных
  rationale: Значение редкого еврейского слова не вполне ясно. Традиционно его связывают с особенно упитанным или отборным скотом; неопределённость и иная этимологическая возможность отмечены в сноске.
- source_word: הַכָּרִים
  choice: баранов
  rationale: Слово обычно обозначает баранов либо молодых самцов овец; «баранов» уместно в перечне скота.
- source_word: כָּל הַטּוֹב
  choice: всё хорошее
  rationale: Сохраняется широкое качественное значение выражения без необоснованного ограничения только скотом.
- source_word: לֹא אָבוּ
  choice: не захотели
  rationale: Форма выражает сознательное нежелание, а не неспособность исполнить повеление.
- source_word: הַחֲרִימָם / הֶחֱרִימוּ
  choice: предать их уничтожению / предали уничтожению
  rationale: В военном контексте חרם означает безвозвратно отдать под заклятие, предполагающее уничтожение. Основной текст передаёт практический смысл, а технический оттенок пояснён в сноске.
- source_word: כָל־הַמְּלָאכָה נְמִבְזָה וְנָמֵס
  choice: всё презренное и негодное
  rationale: Здесь מְלָאכָה обозначает имущество или предметы добычи, а два определения характеризуют то, что считалось ничтожным и не имевшим ценности.
theological_decisions:
- issue: Передача חרם в контексте священной войны
  choice: предать уничтожению
  alternative: предать заклятию; полностью уничтожить
  rationale: Формулировка сохраняет как направленность на уничтожение, так и представление об особом посвящении по приговору Бога; сноска не позволяет свести термин к обычному военному уничтожению.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и сдержанно торжественный. Технический термин חרם раскрыт естественной формулировкой в основном тексте и пояснён в сноске; неопределённость редкого הַמִּשְׁנִים сохранена.
