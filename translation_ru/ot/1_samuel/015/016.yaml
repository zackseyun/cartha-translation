base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/016.yaml
  text: Then Samuel said to Saul[a], “Stop, and I will tell you what Yahweh said to me last night.” And he said to him, “Speak.”
translation:
  language: ru
  text: 'Тогда Самуил сказал Саулу: «Перестань! Я расскажу тебе, что Яхве сказал мне прошлой ночью». Саул ответил: «Говори».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶרֶף
  choice: Перестань!
  rationale: Повелительная форма רפה здесь резко требует прекратить речь или оставить попытки оправдаться. «Перестань!» естественно передаёт краткость и обличительный тон оригинала.
- source_word: וְאַגִּידָה לְּךָ
  choice: Я расскажу тебе
  rationale: Порода hифиль глагола נגד означает «сообщить, рассказать, объявить». Вслед за повелением эта фраза естественно выражает намерение Самуила.
- source_word: אֵת אֲשֶׁר דִּבֶּר
  choice: что … сказал
  rationale: Конструкция вводит содержание речи; русское «что … сказал» точно и естественно передаёт её без излишнего буквализма.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: הַלָּיְלָה
  choice: прошлой ночью
  rationale: При предшествующем глаголе совершенного вида выражение указывает на непосредственно предшествовавшую ночь; «прошлой ночью» ясно передаёт временную перспективу рассказа.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: Тот ответил
  rationale: Письменная форма глагола имеет множественное число («и они сказали»), однако контекст однозначно указывает на единственного собеседника — Саула. «Тот ответил» делает смену говорящего ясной, а текстовая особенность отмечена в сноске.
- source_word: דַּבֵּר
  choice: Говори
  rationale: Краткое повеление приглашает Самуила продолжить; «Говори» сохраняет лаконичность и прямоту еврейского текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» передаёт личное имя транслитерацией, не заменяя его титулом и не добавляя к тексту конфессионального толкования.
- issue: Число глагола וַיֹּאמְרוּ
  choice: 'Единственное число по контексту: «Тот ответил»'
  alternative: 'Формальное множественное число: «они сказали ему»'
  rationale: Множественное число письменной формы создаёт несогласованность с повествованием, где ответить Самуилу может Саул. Перевод следует очевидному контексту, сохраняя разночтение в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, резким повелением Самуила и лаконичным ответом Саула. Местоименное «тот» естественно обозначает смену говорящего и не перегружает фразу повторением имени.
