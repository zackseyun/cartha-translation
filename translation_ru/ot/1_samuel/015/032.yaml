base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/032.yaml
  text: Then Samuel said[a], “Bring Agag king of Amalek to me.” And Agag came to him trembling, and Agag said, “Surely the bitterness of death has turned aside.”
translation:
  language: ru
  text: 'Тогда Самуил сказал: «Приведите ко мне Агага, царя Амалика». Агаг подошёл к нему спокойно[a] и сказал: «Несомненно, горечь смерти отступила».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Значение еврейского слова מַעֲדַנֹּת неясно. Его понимают также как «изысканно» или «в оковах»; согласно другому толкованию, Агаг подошёл дрожа.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּישׁוּ
  choice: Приведите
  rationale: 'Форма повелительного наклонения породы хифиль от נגשׁ обращена к сопровождающим: они должны подвести Агага к Самуилу. «Приведите» естественно передаёт это распоряжение.'
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: Агага, царя Амалика
  rationale: Имя передано традиционной русской транслитерацией; сочетание со статусом сохранено как приложение.
- source_word: וַיֵּלֶךְ אֵלָיו
  choice: подошёл к нему
  rationale: Буквально глагол означает «пошёл», но при движении к уже названному Самуилу русское «подошёл к нему» точнее и естественнее передаёт сцену.
- source_word: מַעֲדַנֹּת
  choice: уверенно
  rationale: Редкое и спорное слово, вероятно, описывает манеру, в которой Агаг подошёл. «Уверенно» согласуется с его последующими словами о миновавшей смерти, но неопределённость значения отмечена в сноске.
- source_word: אָכֵן
  choice: Верно
  rationale: Частица вводит уверенное заключение Агага. «Верно» сохраняет утвердительный оттенок, не усиливая его до безусловной клятвенной формулы.
- source_word: סָר
  choice: минула
  rationale: Совершенный вид глагола סור обозначает удаление или отступление угрозы. В русском выражении о смерти «минула» естественно сохраняет образ прошедшей опасности.
- source_word: מַר הַמָּוֶת
  choice: горечь смерти
  rationale: Передано близко к форме и образу еврейского выражения без сведения его смысла только к страху, угрозе или самому смертному исходу.
