  text: И Самуил возвратился вслед за Саулом, и Саул поклонился[a] Господу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёрся ниц»; в этом контексте поклон выражает почитание Господа. Еврейский глагол может обозначать как телесный поклон, так и поклонение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: возвратился
  rationale: Глагол שוב в последовательном повествовании обозначает возвращение Самуила; выбор передаёт и движение назад, и перемену по сравнению с его прежним отказом идти с Саулом.
- source_word: אַחֲרֵי
  choice: вслед за
  rationale: Предлог буквально означает «за, позади». В данном контексте Самуил идёт вслед за Саулом, тем самым сопровождая его; «вслед за» сохраняет пространственный образ еврейского текста.
- source_word: וַיִּשְׁתַּחוּ
  choice: поклонился
  rationale: Форма от שׁחה может обозначать телесный поклон, простирание ниц или поклонение. Русское «поклонился» естественно передаёт конкретное действие и не устраняет его культового смысла при дополнении «Господу».
- source_word: לַיהוָה
  choice: Господу
  rationale: Тетраграмматон יהוה передан принятой в русской библейской традиции формой «Господь»; дательный падеж выражает направленность действия.
- source_word: שְׁמוּאֵל
  choice: Самуил
  rationale: Традиционная русская форма личного имени.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Традиционная русская форма личного имени.
theological_decisions:
- issue: Следует ли понимать וַיִּשְׁתַּחוּ прежде всего как телесный поклон или прямо обозначить богослужебное поклонение
  choice: 'В основном тексте: «поклонился»'
  alternative: «поклонился в знак почитания»; «простёрся ниц перед Господом»
  rationale: Поскольку Господь прямо назван адресатом действия, религиозное почитание несомненно присутствует, однако сам глагол подчёркивает также телесный жест. «Поклонился» сохраняет оба оттенка, не сводя выражение только к одному из них.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционным библейским звучанием. Синтаксический параллелизм еврейского повествования сохранён, но фраза остаётся естественной и ясной.
