base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/033.yaml
  text: Samuel said[a], “As your sword has made women childless[b], so your mother will be childless among women.” And Samuel hacked Agag to pieces before Yahweh at Gilgal.
translation:
  language: ru
  text: 'Самуил сказал: «Как твой меч сделал женщин бездетными, так и твоя мать станет бездетной среди женщин». [a] И Самуил разрубил Агага на куски[b] перед Яхве в Галгале.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как твой меч лишал женщин детей, так и твоя мать лишится детей среди женщин». В еврейском тексте в обеих частях употреблён один и тот же корень, подчёркивающий соразмерность воздаяния.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рассёк Агага»; традиционно: «изрубил Агага». Еврейский глагол обозначает рассечение или разрубание, а не просто умерщвление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכְּלָה / תִּשְׁכַּל (שׁכל)
  choice: делал женщин бездетными / станет бездетной
  rationale: Корень обозначает утрату детей и в обеих частях изречения создаёт соответствие между преступлением Агага и постигшим его воздаянием. Повтор слова «бездетный» передаёт это соответствие естественным современным русским языком.
- source_word: חַרְבֶּךָ
  choice: твой меч
  rationale: Прямой перевод; меч метонимически обозначает совершённые Агагом насильственные действия, что понятно и по-русски.
- source_word: מִנָּשִׁים
  choice: среди женщин
  rationale: Предлог מִן в данном обороте естественно передаётся как «среди»; более буквальное «из женщин» по-русски звучало бы неясно.
- source_word: וַיְשַׁסֵּף
  choice: разрубил ... на куски
  rationale: Редкий и выразительный глагол указывает на рассечение или разрубание. Такой перевод сохраняет жестокую конкретность текста, не усиливая её добавочными образами и не ослабляя общим «умертвил».
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» естественно передаёт значение присутствия и сохраняет торжественный судебно-сакральный оттенок выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное Божье имя, непосредственно присутствующее в еврейском тексте.
- source_word: בַּגִּלְגָּל
  choice: в Галгале
  rationale: Название места передано в принятой русской библейской форме; предлог «в» естественен при названии населённого места.
theological_decisions:
- issue: Передача суровой казни без смягчения или сенсационности
  choice: Самуил лично «разрубил Агага на куски»
  alternative: «рассёк Агага»; «предал Агага смерти»
  rationale: Еврейский текст прямо называет Самуила исполнителем и употребляет сильный глагол. Выбранная формулировка сохраняет тяжесть события, не добавляя ему богословского оправдания и не скрывая характера действия.
- issue: Передача Божьего имени
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон יהוה; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Мера воздаяния в речи Самуила
  choice: 'Сохранено словесное соответствие: «делал ... бездетными / станет бездетной»'
  alternative: «лишал женщин детей / твоя мать лишится ребёнка»
  rationale: Повтор передаёт выраженный в еврейском тексте принцип соразмерного воздаяния, не уточняя сверх текста, кого именно и сколько детей теряет мать Агага.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской интонацией. Форма «пред Яхве» поддерживает достоинство речи, тогда как «разрубил ... на куски» без архаизации точно сохраняет силу редкого еврейского глагола. Все примечания отмечены в основном тексте непосредственно при соответствующих выражениях.
