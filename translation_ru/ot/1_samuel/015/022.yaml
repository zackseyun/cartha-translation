  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל הַ/חֵ֤פֶץ לַֽ/יהוָה֙ בְּ/עֹל֣וֹת וּ/זְבָחִ֔ים כִּ/שְׁמֹ֖עַ בְּ/ק֣וֹל יְהוָ֑ה הִנֵּ֤ה שְׁמֹ֨עַ֙ מִ/זֶּ֣בַח ט֔וֹב לְ/הַקְשִׁ֖יב מֵ/חֵ֥לֶב אֵילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/022.yaml
  text: And Samuel said, “Does the LORD delight in burnt offerings and sacrifices as much as in obeying the voice of the LORD? Look, to obey is better than sacrifice, and to listen than the fat of rams.”
translation:
  language: ru
  text: 'И сказал Самуил: «Разве всесожжения и жертвы так же приятны ГОСПОДУ, как послушание голосу ГОСПОДА? Вот, послушание лучше жертвы, и внимать — лучше жира баранов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: разве… угодны
  rationale: Передаёт риторический вопрос и значение существительного חֵפֶץ — «желание, удовольствие, благоволение» — естественным современным русским оборотом.
- source_word: כִּשְׁמֹעַ בְּקוֹל יְהוָה
  choice: как послушание гласу ГОСПОДА
  rationale: Инфинитив שְׁמֹעַ в сочетании בְּקוֹל означает не простое слышание, а отклик послушанием; «глас» сохраняет библейское достоинство устойчивого выражения.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет усилительный указательный элемент, вводящий итоговое противопоставление.
- source_word: לְהַקְשִׁיב
  choice: внимание
  rationale: Глагол означает внимательно слушать, внимать; существительная форма создаёт естественный русский параллелизм с «послушанием».
- source_word: מֵחֵלֶב אֵילִים
  choice: тука баранов
  rationale: חֵלֶב обозначает жертвенный жир, считавшийся отборной частью; традиционное «тук» точно и кратко передаёт культовый контекст.
- source_word: יְהוָה
  choice: ГОСПОДЬ / ГОСПОДА
  rationale: Следует принятой русской библейской передаче тетраграмматона титулом, выделенным прописными буквами.
theological_decisions:
- issue: Соотношение жертвоприношения и послушания
  choice: Сохранено сравнительное «лучше», а не абсолютное отрицание жертв
  alternative: Передать так, будто жертвы сами по себе не имеют никакой ценности
  rationale: Еврейский текст противопоставляет приоритет послушания культовой жертве в данном контексте, не формулируя общего запрета установленного жертвоприношения.
- issue: Значение שׁמע
  choice: «послушание» в обеих смысловых позициях
  alternative: «слушать» или «слышать»
  rationale: Контекст неповиновения Саула требует деятельного отклика, хотя исходный глагол сохраняет связь со слушанием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Параллелизм и лаконичность еврейской поэзии сохранены; «глас» и «тук» выбраны как понятные в библейском контексте традиционные термины.
