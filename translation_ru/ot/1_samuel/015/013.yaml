  yaml_path: translation/ot/1_samuel/015/013.yaml
  text: Then Samuel came to Saul[a], and Saul said to him, “Blessed are you to Yahweh[b]; I have carried out the word of Yahweh.”
translation:
  language: ru
  text: 'Самуил пришёл к Саулу, и Саул сказал ему: «Ты благословен Яхве[a]! Я исполнил слово Яхве[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве благословил тебя». Еврейская формула буквально имеет вид: «Благословен ты Яхве»; предлог здесь указывает на Яхве как на источник благословения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я осуществил слово Яхве»; по смыслу также: «Я выполнил повеление Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Глагол בוא обозначает прибытие Самуила к Саулу; «пришёл» естественно передаёт движение к названному лицу в русском повествовании.
- source_word: וַיֹּאמֶר לוֹ
  choice: сказал ему
  rationale: Сохранено явно выраженное в еврейском тексте косвенное дополнение לוֹ.
- source_word: בָּרוּךְ אַתָּה לַיהוָה
  choice: Да благословит тебя Яхве
  rationale: Так естественно передаётся функция еврейской формулы благословения в современном русском языке. Буквальная именная конструкция с לַיהוָה по-русски звучала бы неясно и неестественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом «Господь».
- source_word: הֲקִימֹתִי
  choice: я исполнил
  rationale: Порода hифиль глагола קום в сочетании со «словом Яхве» означает осуществить сказанное, привести его в исполнение. «Исполнил» естественно передаёт заявление Саула о послушании.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: «Слово» сохраняет широту значения דָּבָר, хотя в данном контексте речь идёт о повелении.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет это имя и не подменяет его титулом.
- issue: Форма приветственного благословения
  choice: Да благословит тебя Яхве
  alternative: Благословен ты Яхве; благословен ты у Яхве
  rationale: Выбранная форма ясно выражает благословение и называет Яхве его источником, не создавая в русском тексте неясной синтаксической связи. В сноске сохранена более буквальная альтернатива.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальное «И» сохранено как естественное отражение последовательного повествования. Реплика Саула звучит уверенно и торжественно, без добавленного авторского осуждения или оправдания.
