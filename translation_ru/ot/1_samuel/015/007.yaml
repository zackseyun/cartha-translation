  text: И Саул поразил амаликитян[a] от Хавилы по пути к Шуру, который находится напротив Египта[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Амалика»; имя предка употреблено собирательно для обозначения амаликитян.'
