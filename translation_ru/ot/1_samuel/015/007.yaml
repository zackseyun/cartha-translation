  - marker: b
    text: 'Возможно также: «к востоку от Египта» или «перед Египтом»; еврейское выражение допускает эти пространственные значения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: поразил
  rationale: Глагол נכה означает «ударить, поразить, разгромить». «Поразил» сохраняет конкретную силу глагола, не уточняя сверх текста степень победы.
- source_word: עֲמָלֵק
  choice: амаликитян
  rationale: Имя «Амалик» употреблено собирательно для обозначения народа. По-русски естественнее прямо назвать амаликитян; буквальная форма отмечена в сноске.
- source_word: מֵחֲוִילָה
  choice: от Хавилы
  rationale: Предлог מִן обозначает исходную точку географического диапазона.
- source_word: בּוֹאֲךָ שׁוּר
  choice: до подступов к Шуру
  rationale: Идиоматическое географическое выражение буквально означает «когда идёшь к Шуру». «До подступов к Шуру» естественно передаёт направление и конечную область, не отождествляя её непременно с самим городом.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרָיִם
  choice: что напротив Египта
  rationale: Оборот עַל־פְּנֵי может обозначать положение перед, напротив или к востоку от места. «Напротив Египта» сохраняет пространственную неопределённость исходного выражения.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Общепринятая русская форма личного имени.
