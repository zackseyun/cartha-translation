base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/011.yaml
  text: I regret that I made Saul king[a], because he has turned back from following me and has not carried out my words. And Samuel burned with anger[d][c][b], and he cried out to Yahweh all night.
translation:
  language: ru
  text: «Я сожалею[a] о том, что поставил Саула царём, потому что он отступил от Меня[b] и не исполнил Моих слов[c]». Самуил воспылал гневом[d] и всю ночь взывал к Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Мне жаль» или «Я раскаиваюсь». Еврейское выражение передаёт сожаление и скорбь Яхве о том, что Саул стал царём.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «он повернул назад от следования за Мной»; это образ отказа следовать за Яхве.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «не осуществил Моих слов» или «не послушался Моих слов».'
    reason: lexical_alternative
  - marker: d
    text: Еврейская идиома буквально передаёт мысль о разгоревшемся гневе Самуила. В данном контексте некоторые понимают её как глубокую скорбь или сильное огорчение.
    reason: alternative_reading
lexical_decisions:
- source_word: נִחַמְתִּי
  choice: Я сожалею
  rationale: Форма нифаль глагола נחם здесь выражает подлинное сожаление и скорбь Бога о царствовании Саула. «Сожалею» сохраняет эмоциональную и оценочную силу выражения, не подразумевая нравственной вины или ошибки Бога.
- source_word: הִמְלַכְתִּי אֶת־שָׁאוּל לְמֶלֶךְ
  choice: поставил Саула царём
  rationale: Хифиль глагола מלך обозначает возведение или поставление человека на царство. Эта формулировка естественна для литературного русского языка и передаёт действие Бога.
- source_word: שָׁב מֵאַחֲרַי
  choice: он отступил от Меня
  rationale: Еврейская идиома буквально изображает человека, который повернул назад и перестал следовать за кем-либо. «Отступил от Меня» естественно передаёт отказ Саула следовать за Богом, а образ следования отмечен в сноске.
- source_word: וְאֶת־דְּבָרַי לֹא הֵקִים
  choice: и не исполнил Моих слов
  rationale: Глагол קום в хифиле со словом «слова» означает осуществить или привести сказанное в исполнение. «Не исполнил Моих слов» сохраняет конкретную мысль о невыполнении повеления.
- source_word: וַיִּחַר לִשְׁמוּאֵל
  choice: Самуил воспылал гневом
  rationale: Идиома חרה ל выражает вспыхнувший или разгоревшийся гнев. Образная русская формулировка сохраняет силу еврейского выражения; возможный контекстуальный оттенок глубокой скорби указан в сноске.
- source_word: וַיִּזְעַק אֶל־יְהוָה
  choice: взывал к Яхве
  rationale: Глагол זעק обозначает сильный, настойчивый крик, нередко вызванный бедствием или глубоким переживанием. «Взывал» передаёт интенсивность и подходит достоинству повествования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не заменено титулом.
- source_word: כָּל־הַלַּיְלָה
  choice: всю ночь
  rationale: Естественная русская формулировка точно передаёт непрерывную продолжительность действия.
theological_decisions:
- issue: Божественное נִחַמְתִּי применительно к поставлению Саула царём
  choice: Я сожалею
  alternative: «Я раскаиваюсь», «Мне жаль», «Я решил отменить»
  rationale: Перевод сохраняет реальность выраженных Богом сожаления и скорби, не превращая их ни в признание нравственной вины, ни только в безэмоциональное изменение решения. Богословское напряжение текста не устраняется.
- issue: Эмоциональная реакция Самуила в וַיִּחַר לִשְׁמוּאֵל
  choice: Самуил воспылал гневом
  alternative: «Самуил глубоко опечалился», «Самуил был крайне огорчён»
  rationale: Основное лексическое значение идиомы указывает на гнев. Поскольку контекст допускает также глубокую скорбь или негодование, эта возможность сохранена в сноске, а не подменяет основной смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формы «воспылал гневом» и «взывал» сохраняют образность и торжественность исходного повествования, оставаясь понятными современному читателю. Местоимения, относящиеся к Богу, написаны с прописной буквы в прямой речи.
