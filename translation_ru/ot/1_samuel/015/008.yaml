lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: захватил
  rationale: Глагол означает схватить или взять в плен; «захватил» естественно передаёт военный контекст.
- source_word: אֲגַג
  choice: Агага
  rationale: Личное имя передано принятой русской библейской транслитерацией и поставлено в винительный падеж.
- source_word: מֶלֶךְ עֲמָלֵק
  choice: царя Амалика
  rationale: Сохраняет прямое отношение еврейской сопряжённой конструкции и традиционное русское наименование.
- source_word: חָי
  choice: живым
  rationale: Предикативное прилагательное указывает, что Агаг был захвачен живым, а не убит.
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Сохраняет широкое значение עָם и не сужает его без достаточных оснований до войска или воинов.
- source_word: הֶחֱרִים
  choice: предал заклятию
  rationale: 'Передаёт особый смысл חרם: отдать под заклятие, предполагающее уничтожение, а не просто описать обычное военное убийство.'
- source_word: לְפִי חָרֶב
  choice: истребив остриём меча
  rationale: Еврейская идиома буквально говорит об «устах меча»; «остриём меча» сохраняет образ в понятной русской форме, а деепричастие ясно связывает её с осуществлением заклятия.
theological_decisions:
- issue: Передача военной терминологии חרם
  choice: предал заклятию, истребив остриём меча
  alternative: истребил остриём меча
  rationale: Основной вариант сохраняет богословски значимое понятие посвящения уничтожению и одновременно ясно показывает фактический результат. Более простой вариант возможен по контексту, но сглаживает особую силу еврейского термина.
translation_notes:
  register: Современный литературный русский язык с сохранением уместной библейской торжественности. Термин «предал заклятию» оставлен ради смысловой точности, а его значение прояснено контекстом и сноской.
