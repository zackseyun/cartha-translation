  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל הֲ/ל֗וֹא אִם קָטֹ֤ן אַתָּה֙ בְּ/עֵינֶ֔י/ךָ רֹ֛אשׁ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אָ֑תָּה וַ/יִּמְשָׁחֲ/ךָ֧ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/017.yaml
  text: And Samuel said[a], “Though you were small in your own eyes, were you not the head of the tribes of Israel? And Yahweh anointed you king over Israel.”
translation:
  language: ru
  text: 'Самуил сказал: «Хотя ты был мал в собственных глазах[a], разве не ты был главой колен Израиля? И Яхве помазал тебя царём над Израилем».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Даже если ты был мал в собственных глазах». Еврейскую конструкцию можно понять с несколько иным оттенком; речь идёт о том, что Саул считал себя малым или незначительным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно звучит по-русски.
- source_word: אִם קָטֹן אַתָּה בְּעֵינֶיךָ
  choice: хотя ты был мал в собственных глазах
  rationale: Сохраняет уступительный смысл и образное выражение о прежней самооценке Саула, не сводя его только к смирению или общественному положению.
- source_word: קָטֹן
  choice: мал
  rationale: Прямая передача метафоры малого значения или положения без пояснительного перетолкования как «ничтожен» или «незначителен».
- source_word: בְּעֵינֶיךָ
  choice: в собственных глазах
  rationale: Естественно передаёт еврейскую идиому, обозначающую мнение человека о самом себе.
- source_word: רֹאשׁ שִׁבְטֵי יִשְׂרָאֵל
  choice: главой колен Израиля
  rationale: Слово «глава» сохраняет конкретную метафору רֹאשׁ и одновременно ясно обозначает верховное положение Саула.
- source_word: וַיִּמְשָׁחֲךָ
  choice: помазал тебя
  rationale: Глагол משׁח обозначает именно помазание; это сохраняет царский обряд и его богословскую значимость.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: царём над Израилем
  rationale: Кратко и естественно выражает положение, для которого Саул был помазан.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; форма «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Связь прежней малости Саула с его поставлением во главе Израиля
  choice: уступительная конструкция «хотя… разве не…?»
  alternative: условная конструкция «даже если…»
  rationale: Контекст указывает на контраст между прежней самооценкой Саула и данным ему высоким положением, однако возможный условный оттенок אִם отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой пророческой речи. Сохранены еврейские метафоры «мал в собственных глазах» и «глава колен», а союз перед заключительной фразой передан словом «И».
