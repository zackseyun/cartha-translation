lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Формула естественно вводит новый этап повествования и вместе с דְּבַר передаётся устойчивым библейским оборотом без архаического «и случилось».
- source_word: דְּבַר
  choice: слово
  rationale: В формуле דְּבַר יְהוָה сохраняет прямую связь с пророческим откровением; «весть» возможно, но менее формально соответствует источнику.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֶל
  choice: к
  rationale: Естественно обозначает адресата пришедшего Божьего слова в русском обороте «слово было к».
- source_word: שְׁמוּאֵל
  choice: Самуилу
  rationale: Использована традиционная русская форма имени в дательном падеже после предлога «к».
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив вводит содержание последующей речи; в современном русском это естественно передаётся двоеточием, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя; транслитерация сохраняет его и не подменяет титулом.
translation_notes:
  register: Современный литературный русский с сохранением краткой пророческой формулы. Двоеточие естественно вводит речь следующего стиха; конструкция «слово Яхве» сохраняет формальную связь с еврейским текстом.
