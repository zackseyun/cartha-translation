  text: And Samuel said to him[a], “Yahweh has torn the kingdom of Israel away from you today and has given it to your neighbor[b], who is better than you.”
translation:
  language: ru
  text: 'И Самуил сказал ему: «Сегодня Яхве оторвал от тебя царство Израиля и отдал его твоему ближнему[a], который лучше тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоему товарищу», «твоему собрату». Еврейское רֵעַ может обозначать ближнего, товарища или другого человека, соотнесённого с адресатом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו שְׁמוּאֵל
  choice: И Самуил сказал ему
  rationale: Последовательная форма с וַ־ продолжает повествование; союз «и» естественно передаёт эту связь, не усиливая её до явно временного «тогда».
- source_word: קָרַע
  choice: оторвал
  rationale: Глагол означает «разорвать, оторвать» и перекликается с разрывом края одежды Самуила в предыдущем стихе. «Оторвал от тебя» сохраняет образ и естественно выражает лишение Саула царской власти.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий его титул.
- source_word: מַמְלְכוּת יִשְׂרָאֵל
  choice: царство Израиля
  rationale: מַמְלְכוּת может обозначать как царство, так и царскую власть. В данном контексте обычное выражение «царство Израиля» сохраняет обе смысловые стороны достаточно ясно.
- source_word: מֵעָלֶיךָ
  choice: от тебя
  rationale: Предлог обозначает удаление того, что прежде находилось во владении или под властью Саула.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Современный и точный эквивалент, сохраняющий непосредственность приговора.
- source_word: וּנְתָנָהּ
  choice: и отдал его
  rationale: Совершенная форма представляет передачу царства как уже решённое и совершившееся действие Бога; местоимение согласовано в русском языке со словом «царство».
- source_word: לְרֵעֲךָ
  choice: твоему ближнему
  rationale: רֵעַ обозначает ближнего, товарища или другого человека, находящегося в определённом отношении к Саулу; «ближнему» сохраняет эту относительность, не утверждая близкой дружбы.
- source_word: הַטּוֹב מִמֶּךָּ
  choice: который лучше тебя
  rationale: Сравнительная конструкция буквально характеризует получателя царства как «лучшего, чем ты»; относительное предложение ясно связывает характеристику с «ближним».
theological_decisions:
- issue: Завершённость или будущность Божьего суда
  choice: «оторвал… и отдал» — действия представлены как совершившиеся
  alternative: «оторвёт… и отдаст» — будущие действия
  rationale: Еврейские формы в пророческом приговоре представляют лишение и передачу царства как непреложно совершённое Божье решение, хотя его полное историческое осуществление ещё впереди.
- issue: Значение מַמְלְכוּת
  choice: «царство Израиля»
  alternative: «царскую власть над Израилем»
  rationale: Текст допускает предметно-политический и властный оттенки; традиционно понятное «царство Израиля» не устраняет эту смысловую ёмкость.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой пророческой речи. Сохранены личное имя «Яхве», образ отрывания, связанный с предыдущим стихом, и категоричность совершённых глагольных форм.
