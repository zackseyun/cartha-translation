  text: И все израильтяне, увидев этого человека, побежали от него и очень испугались.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: все израильтяне
  rationale: Еврейское собирательное выражение буквально означает «всякий муж Израиля», но в данном контексте естественно обозначает всех присутствовавших израильских воинов.
- source_word: הָאִישׁ
  choice: этого человека
  rationale: Определённое существительное указывает на уже названного Голиафа; нейтральное «человек» сохраняет лексику источника.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: побежали от него
  rationale: Глагол נוס передаёт бегство, а מִפָּנָיו — удаление от его присутствия; по-русски это естественно выражается как «побежали от него».
- source_word: וַיִּירְאוּ מְאֹד
  choice: очень испугались
  rationale: Передаёт сильный страх простым современным выражением, сохраняя повествовательную форму завершённого действия.
