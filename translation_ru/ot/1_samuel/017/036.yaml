  text: גַּ֧ם אֶֽת הָ/אֲרִ֛י גַּם הַ/דּ֖וֹב הִכָּ֣ה עַבְדֶּ֑/ךָ וְֽ֠/הָיָה הַ/פְּלִשְׁתִּ֨י הֶ/עָרֵ֤ל הַ/זֶּה֙ כְּ/אַחַ֣ד מֵ/הֶ֔ם כִּ֣י חֵרֵ֔ף מַעַרְכֹ֖ת אֱלֹהִ֥ים חַיִּֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/036.yaml
  text: Your servant struck down both the lion and the bear[a], and this uncircumcised Philistine will be like one of them, because he has defied the battle lines of the living God.
translation:
  language: ru
  text: И льва, и медведя поразил твой слуга; и этот необрезанный филистимлянин будет как один из них, потому что он бросил вызов боевым рядам живого Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «войска живого Бога». Еврейское слово может означать «боевые ряды», «боевые порядки» или, шире, «войска».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: убивал
  rationale: В данном рассказе נכה обозначает нанесение смертельного удара хищникам. Русское «убивал» естественно передаёт повторявшиеся победы Давида над львом и медведем, не вводя архаичного «поражал».
- source_word: עַבְדֶּךָ
  choice: твой слуга
  rationale: При обращении к Саулу это почтительное самообозначение. «Слуга» передаёт придворную речевую формулу без неуместного акцента на рабском положении.
- source_word: הָאֲרִי ... הַדּוֹב
  choice: льва ... медведя
  rationale: Определённые формы указывают на названных Давидом хищников; по-русски естественно соединение «и льва, и медведя».
- source_word: וְהָיָה
  choice: будет
  rationale: В контексте форма выражает уверенное предсказание участи филистимлянина.
- source_word: הֶעָרֵל
  choice: необрезанный
  rationale: Сохранено буквальное обозначение телесного знака завета и заложенная в нём оскорбительная, богословская сила.
- source_word: כְּאַחַד מֵהֶם
  choice: как один из них
  rationale: Передаёт прямое сопоставление будущей участи Голиафа с участью льва и медведя.
- source_word: חֵרֵף
  choice: поносил
  rationale: חרף выражает оскорбительное поругание и дерзкое презрение. «Поносил» сохраняет направленность оскорбления на боевые ряды Бога; возможен также оттенок «бросал вызов».
- source_word: מַעַרְכֹת
  choice: боевые ряды
  rationale: Существительное обозначает выстроенные для битвы ряды или боевой строй. «Боевые ряды» сохраняет конкретный военный образ; расширительное «войска» дано в примечании.
- source_word: אֱלֹהִים חַיִּים
  choice: живого Бога
  rationale: Устойчивое еврейское выражение подчёркивает, что Бог действительно жив и действует; по смыслу אֱלֹהִים здесь имеет единственное число.
theological_decisions:
- issue: Заветный смысл определения הֶעָרֵל
  choice: Сохранить в основном тексте буквальное «необрезанный».
  alternative: «Чуждый завету» или «безбожный».
  rationale: Исходный текст использует телесный знак завета как богословски значимое уничижительное определение. Толкующий пересказ ослабил бы образ и сузил его смысл.
- issue: Значение מַעַרְכֹת в отношении живого Бога
  choice: Перевести как «боевые ряды живого Бога».
  alternative: «Войска живого Бога» или «боевые порядки живого Бога».
  rationale: Фраза представляет боевые построения Израиля как принадлежащие Богу. «Боевые ряды» сохраняет конкретный образ и не устраняет возможное расширительное значение «войска».
- issue: Степень утверждения смерти хищников в הִכָּה
  choice: Передать как «убивал».
  alternative: «Поражал» или «сражал».
  rationale: Ближайший контекст говорит об избавлении добычи и последующем смертельном противоборстве; русский глагол ясно выражает подразумеваемый исход. При этом не добавляется способ умерщвления.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Синтаксический параллелизм «и льва, и медведя» сохраняет выразительность еврейского текста. «Филистимлянин» употреблено в нормативной современной форме; архаизмы вроде «сей», «раб твой» и «поносил воинства» устранены.
