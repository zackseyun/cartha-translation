base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/054.yaml
  text: David took the head of the Philistine and brought it to Jerusalem[b][a], and he put his weapons in his tent.
translation:
  language: ru
  text: Давид взял голову филистимлянина и принёс её в Иерусалим[a], и его воинское снаряжение[b] положил в своём шатре.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые читатели усматривают хронологическое напряжение в словах «принёс её в Иерусалим», поскольку в более широком повествовании Иерусалим в это время ещё не был полностью под властью израильтян. Перевод сохраняет формулировку еврейского текста, не устраняя этого возможного напряжения.
    reason: cultural_note
  - marker: b
    text: 'Или: «оружие», «доспехи» или «снаряжение». Еврейское слово имеет широкое значение и может обозначать оружие, доспехи и другие воинские принадлежности. Притяжательные формы в этой части стиха формально допускают разные толкования; здесь снаряжение отнесено к филистимлянину, а шатёр — к Давиду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное повествовательное употребление לקח; нейтральный и естественный русский эквивалент.
- source_word: רֹאשׁ הַפְּלִשְׁתִּי
  choice: голову филистимлянина
  rationale: רֹאשׁ употреблено буквально, а субстантивированное обозначение הַפְּלִשְׁתִּי естественно передаётся родительным падежом.
- source_word: וַיְבִאֵהוּ
  choice: принёс её
  rationale: Местоименный суффикс мужского рода относится к слову רֹאשׁ, но по-русски согласуется с существительным женского рода «голова».
- source_word: יְרוּשָׁלִָם
  choice: Иерусалим
  rationale: Традиционная и общеупотребительная русская форма топонима.
- source_word: כֵּלָיו
  choice: его воинское снаряжение
  rationale: כְּלִי — широкое обозначение предметов, утвари или оснащения; военный контекст уточнён словом «воинское», но значение не сужено до одних лишь оружий.
- source_word: שָׂם
  choice: положил
  rationale: Естественная передача простого глагола помещения предмета в данном контексте.
- source_word: בְּאָהֳלוֹ
  choice: в своём шатре
  rationale: «Шатёр» сохраняет прямое значение אָהֶל; возвратное «своём» ясно относит шатёр к Давиду согласно наиболее естественному контекстуальному прочтению.
theological_decisions:
- issue: Референты притяжательных суффиксов в заключительной части стиха
  choice: Снаряжение принадлежит филистимлянину, а шатёр — Давиду.
  alternative: Оба притяжательных элемента могут быть отнесены к одному лицу либо шатёр может пониматься как общий военный шатёр.
  rationale: 'Контекст описывает трофеи Давида: снаряжение естественно относится к убитому филистимлянину, а место хранения — к Давиду. Сноска отмечает формальную неоднозначность.'
- issue: Хронологическое напряжение в упоминании Иерусалима
  choice: Сохранить прямое утверждение «принёс её в Иерусалим».
  alternative: Передать как «позднее принёс» или «понёс к Иерусалиму».
  rationale: Еврейский текст прямо называет действие и место, не вводя ни будущего времени, ни направления «к». Перевод не гармонизирует возможное хронологическое напряжение.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным строем. Союз «а» служит естественному русскому присоединению второго действия без внесения сильного смыслового противопоставления. «Воинское снаряжение» предпочтено более узкому «оружие», чтобы сохранить широту כְּלִי.
