source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הַ/פְּלִשְׁתִּ֔י אֲנִ֗י חֵרַ֛פְתִּי אֶת מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל הַ/יּ֣וֹם הַ/זֶּ֑ה תְּנוּ לִ֣/י אִ֔ישׁ וְ/נִֽלָּחֲמָ֖ה יָֽחַד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/010.yaml
  text: Then the Philistine said[a], “I have defied the ranks of Israel this day. Give me a man[c][b], and let us fight together.”
translation:
  language: ru
  text: 'И сказал филистимлянин: «Сегодня[c] я бросил вызов[a] боевым рядам[b] Израиля. Дайте мне человека, и мы сразимся друг с другом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «оскорбил», «поносил» или «высмеял». В данном военном контексте речь идёт об оскорбительном вызове.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «боевым порядкам»; в более широком смысле — «войску».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в этот день».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: филистимлянин
  rationale: Слово с определённым артиклем обозначает Голиафа по его народности; добавлять «воин» или «единоборец» здесь не требуется.
- source_word: חֵרַפְתִּי
  choice: я бросил вызов
  rationale: В контексте военного противостояния глагол выражает дерзкое оскорбление и открытый вызов; этот русский оборот естественно передаёт силу реплики, не сводя её лишь к насмешке.
- source_word: מַעַרְכוֹת
  choice: боевым рядам
  rationale: Множественное число указывает на выстроенные боевые порядки; «боевые ряды» точнее, чем более общее «войско».
- source_word: הַיּוֹם הַזֶּה
  choice: сегодня
  rationale: Естественная современная передача буквально более развёрнутого выражения «в этот день».
- source_word: תְּנוּ לִי אִישׁ
  choice: Дайте мне человека
  rationale: Сохранены прямота повеления и буквальный образ представителя, которого Израиль должен выставить на поединок.
- source_word: וְנִלָּחֲמָה
  choice: и мы сразимся
  rationale: Когортативная форма выражает побуждение-вызов к бою, что естественно передаётся русским будущим совершенного вида в сочинённой конструкции.
- source_word: יָחַד
  choice: друг с другом
  rationale: В данном контексте слово обозначает взаимное участие двух противников в поединке; «друг с другом» яснее русского «вместе», которое могло бы ошибочно подразумевать совместное действие.
