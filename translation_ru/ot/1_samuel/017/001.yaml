base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/001.yaml
  text: The Philistines gathered their armies for battle[a], and they assembled at Socoh, which belongs to Judah, and camped between Socoh and Azekah[b], at Ephes-dammim.
translation:
  language: ru
  text: Филистимляне собрали свои войска для битвы[a], собрались в Сохо, принадлежавшем Иуде[b], и расположились станом между Сохо и Азекой, в Ефес-Даммиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свои станы»; еврейское слово может обозначать как военные лагеря, так и войска.'
    reason: lexical_alternative
  - marker: b
    text: Сохо был городом на территории Иуды.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּאַסְפוּ
  choice: собрали
  rationale: Обычное повествовательное значение אָסַף — «собирать»; форма естественно сочетается с военным объектом «войска».
- source_word: פְלִשְׁתִּים
  choice: филистимляне
  rationale: Устоявшееся русское название этого народа.
- source_word: מַחֲנֵיהֶם
  choice: свои войска
  rationale: מַחֲנֶה может обозначать как лагерь, так и находящееся в нём войско. В сочетании «для битвы» контекстуально уместно «войска», а неоднозначность отмечена в сноске.
- source_word: לַמִּלְחָמָה
  choice: для битвы
  rationale: מִלְחָמָה означает «война, битва»; здесь речь идёт о непосредственном развёртывании сил, поэтому выбрано «битва».
- source_word: וַיֵּאָסְפוּ
  choice: сошлись
  rationale: Передаёт повторное употребление אָסַף без тяжеловесного повтора «собрали… собрались» и ясно указывает на прибытие к месту сбора.
- source_word: שֹׂכֹה
  choice: Сохо
  rationale: Традиционная русская передача библейского топонима.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: принадлежавшего Иуде
  rationale: Конструкция с ל выражает территориальную принадлежность; причастная форма согласуется с повествованием о прошлом.
- source_word: וַיַּחֲנוּ
  choice: расположились станом
  rationale: Точно передаёт חנה «становиться лагерем» и сохраняет достойный, понятный библейско-повествовательный регистр.
- source_word: בֵּין ... וּבֵין
  choice: между ... и
  rationale: Прямой и естественный русский пространственный оборот.
- source_word: עֲזֵקָה
  choice: Азека
  rationale: Устоявшаяся русская форма топонима; после «между» употреблён творительный падеж «Азекой».
- source_word: בְּאֶפֶס דַּמִּים
  choice: в Ефес-Даммиме
  rationale: Сочетание понято как географическое название, а не переведено по составляющим; предлог «в» естественен для обозначения местности.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Синтаксис упрощён без утраты последовательности действий; начальное וַ передано ходом повествования без добавления слова «теперь» или «и вот».
