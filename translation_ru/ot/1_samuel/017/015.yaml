  text: David went back and forth from Saul to shepherd his father's flock at Bethlehem[a].
translation:
  language: ru
  text: Давид уходил от Саула и возвращался в Вифлеем, чтобы пасти стадо своего отца[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Давид ходил и возвращался от Саула, чтобы пасти стадо своего отца в Вифлееме».'
    reason: Сноска сохраняет более формальное соответствие выражению הֹלֵךְ וָשָׁב, тогда как основной текст естественно передаёт его повторяющийся характер русскими формами несовершенного вида.
lexical_decisions:
- source_word: הֹלֵךְ וָשָׁב
  choice: уходил… и возвращался
  rationale: Сочетание форм глаголов הלך и שוב в данном повествовательном контексте передаёт повторяющееся, обычное действие. Русское несовершенное прошедшее сохраняет эту многократность, не превращая выражение в сообщение об одной поездке.
- source_word: מֵעַל שָׁאוּל
  choice: от Саула
  rationale: Предлог מֵעַל здесь обозначает уход от Саула, то есть из его присутствия или со службы при нём. Краткое «от Саула» естественно по-русски и не добавляет отсутствующих в тексте подробностей.
- source_word: לִרְעוֹת
  choice: чтобы пасти
  rationale: Инфинитив רעה обозначает занятие пастуха. «Пасти» точно передаёт действие и звучит естественнее, чем более отвлечённое «заботиться».
- source_word: צֹאן
  choice: стадо
  rationale: צֹאן — собирательное обозначение мелкого скота, которое может включать овец и коз. «Стадо» сохраняет эту широту лучше, чем конкретизирующее «овцы».
- source_word: אָבִיו
  choice: своего отца
  rationale: Возвратное притяжательное местоимение естественно указывает, что речь идёт об отце Давида, и соответствует русской норме.
- source_word: בֵּית לָחֶם
  choice: Вифлееме
  rationale: Использована традиционная русская форма библейского топонима; предложный падеж соответствует местному значению конструкции.
- source_word: וְ
  choice: без отдельного союзного соответствия
  rationale: Начальный וְ связывает фразу с контекстом, однако механическое «и» здесь утяжеляло бы современное русское повествование. Отдельного временного слова вроде «тогда» или «между тем» в источнике нет.
