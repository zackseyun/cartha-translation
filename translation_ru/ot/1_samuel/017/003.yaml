base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/003.yaml
  text: The Philistines were standing on the mountain on one side[a], and Israel was standing on the mountain on the other side[b], with the valley between them.
translation:
  language: ru
  text: Филистимляне стояли на горе с одной стороны[a], а израильтяне стояли на горе с другой; между ними была долина[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на холме» или «на возвышенности»; еврейское הַר может обозначать гору, холм или возвышенность. То же относится ко второму употреблению этого слова в стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ущелье»; еврейское גַּיְא может обозначать долину с крутыми склонами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Филистимляне
  rationale: Название народа передано общепринятым русским библейским соответствием; начальный союз не выражен отдельно, поскольку стих продолжает повествование и в русском здесь естествен бессоюзный переход.
- source_word: עֹמְדִים
  choice: стояли
  rationale: Причастная форма описывает продолжающееся положение войск; русское прошедшее несовершенного вида естественно передаёт этот фоновый, длительный характер.
- source_word: אֶל הָהָר מִזֶּה ... אֶל הָהָר מִזֶּה
  choice: на склоне с одной стороны ... на склоне с другой
  rationale: В сочетании с עמד предлог אֶל обозначает пространственное положение. הַר может означать гору или возвышенность; в данной топографической сцене «склон» естественно обозначает расположение противостоящих войск, не преувеличивая высоту местности.
- source_word: וְיִשְׂרָאֵל
  choice: а израильтяне
  rationale: Собирательное «Израиль» здесь обозначает противостоящее войско; «израильтяне» звучит по-русски естественно и позволяет сохранить параллелизм с «филистимлянами». Противительный союз «а» ясно передаёт сопоставление сторон.
- source_word: וְהַגַּיְא בֵּינֵיהֶם
  choice: между ними была долина
  rationale: Глагольная связка добавлена по нормам русского языка. גַּיְא передано доступным словом «долина», а локативное בֵּינֵיהֶם — «между ними».
