  yaml_path: translation/ot/1_samuel/017/031.yaml
  text: When the words that David had spoken were heard[a], they reported them before Saul, and he sent for him.
translation:
  language: ru
  text: Когда услышали слова, сказанные Давидом, их передали Саулу, и тот велел привести его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и он взял его». Вероятно, имеется в виду, что Саул велел привести Давида к себе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְּשָּׁמְעוּ
  choice: когда услышали
  rationale: Форма имеет неопределённое множественное подлежащее. По-русски неопределённо-личная конструкция «услышали» естественно сохраняет эту неопределённость, не вводя отсутствующих в тексте лиц.
- source_word: הַדְּבָרִים אֲשֶׁר דִּבֶּר דָּוִד
  choice: слова, сказанные Давидом
  rationale: דברים здесь обозначает произнесённые Давидом слова; причастный оборот ясно и естественно передаёт относительное придаточное.
- source_word: וַיַּגִּדוּ לִפְנֵי שָׁאוּל
  choice: их передали Саулу
  rationale: נגד означает сообщить или довести до сведения, а לִפְנֵי буквально значит «перед лицом». В данном контексте речь идёт о передаче слов Саулу; буквальное «рассказали перед Саулом» в современном русском звучит неестественно.
- source_word: וַיִּקָּחֵהוּ
  choice: тот велел привести его
  rationale: 'Буквально глагол לקח означает «взял его», однако в придворном контексте наиболее вероятен каузативный по смыслу оборот: Саул распорядился привести Давида. «Тот» однозначно указывает на Саула, не добавляя нового имени.'
