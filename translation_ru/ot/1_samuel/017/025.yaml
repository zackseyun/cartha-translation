  text: וַ/יֹּ֣אמֶר אִ֣ישׁ יִשְׂרָאֵ֗ל הַ/רְּאִיתֶם֙ הָ/אִ֤ישׁ הָֽ/עֹלֶה֙ הַ/זֶּ֔ה כִּ֛י לְ/חָרֵ֥ף אֶת יִשְׂרָאֵ֖ל עֹלֶ֑ה וְֽ֠/הָיָה הָ/אִ֨ישׁ אֲשֶׁר יַכֶּ֜/נּוּ יַעְשְׁרֶ֥/נּוּ הַ/מֶּ֣לֶךְ עֹ֣שֶׁר גָּד֗וֹל וְ/אֶת בִּתּ/וֹ֙ יִתֶּן ל֔/וֹ וְ/אֵת֙ בֵּ֣ית אָבִ֔י/ו יַעֲשֶׂ֥ה חָפְשִׁ֖י בְּ/יִשְׂרָאֵֽל׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/025.yaml
  text: And the men of Israel said[a], “Have you seen this man who is coming up? Surely he is coming up to defy Israel. And it shall be that the man who strikes him down, the king will enrich him with great riches, and will give him his daughter, and will make his father’s house free in Israel.”
translation:
  language: ru
  text: 'И говорили израильтяне[a]: «Видели этого человека, который выходит? Он выходит, чтобы бросить вызов Израилю. Того, кто сразит его, царь щедро обогатит, отдаст ему в жёны свою дочь, а дому его отца дарует свободу в Израиле[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И сказал израильтянин» (дословно — «человек Израиля»). Единственное число в данном контексте, вероятно, имеет собирательный смысл и передаёт слова, повторявшиеся среди воинов.'
    reason: Уточнение грамматической формы еврейского текста и сохранение возможного собирательного значения единственного числа.
  - marker: b
    text: 'Буквально: «сделает дом его отца свободным в Израиле»; вероятно, освободит семью от налогов, работ или иных обязанностей перед царём.'
    reason: Сохранение буквальной неоднозначности חָפְשִׁי в основном тексте с пояснением вероятного административного смысла.
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: израильтяне
  rationale: 'Грамматически единственное число здесь имеет собирательно-обобщающий смысл: речь передаётся как разговор израильских воинов между собой.'
- source_word: הַרְּאִיתֶם
  choice: Видели
  rationale: Вопросительная форма второго лица множественного числа естественно передаётся разговорным русским «Видели?» и соответствует непосредственной обстановке.
- source_word: הָאִישׁ הָעֹלֶה הַזֶּה
  choice: этого человека, который выходит
  rationale: Причастие обозначает происходящее на глазах или повторяющееся действие; «выходит» сохраняет пространственный образ еврейского глагола.
- source_word: כִּי לְחָרֵף אֶת יִשְׂרָאֵל עֹלֶה
  choice: Он выходит, чтобы бросить вызов Израилю
  rationale: כִּי здесь вводит пояснение, которое по-русски естественно передать отдельным утверждением; חרף означает публичное поношение и дерзкий вызов.
- source_word: יַכֶּנּוּ
  choice: сразит его
  rationale: נכה допускает значения «поразить», «сразить» и в контексте «убить». «Сразит» передаёт решительную победу, не устраняя полностью лексическую широту глагола.
- source_word: יַעְשְׁרֶנּוּ ... עֹשֶׁר גָּדוֹל
  choice: щедро обогатит
  rationale: Глагол и однокоренное существительное создают усиление. Русское «щедро обогатит» естественно выражает обещание огромного богатства без тяжеловесного повтора.
- source_word: בִּתּוֹ יִתֶּן לוֹ
  choice: отдаст ему в жёны свою дочь
  rationale: Контекст награды ясно подразумевает брак; добавление «в жёны» делает смысл прозрачным для современного читателя.
- source_word: בֵּית אָבִיו
  choice: дом его отца
  rationale: Сохраняется библейский образ дома как отцовского семейства или хозяйства, а не только здания.
- source_word: יַעֲשֶׂה חָפְשִׁי בְּיִשְׂרָאֵל
  choice: освободит от повинностей в Израиле
  rationale: חָפְשִׁי буквально означает «свободный», но здесь, вероятно, обозначает освобождение семейства от налогов, работ или царской службы. Формулировка сохраняет неопределённость относительно конкретной повинности.
