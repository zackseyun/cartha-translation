  text: 'И народ сказал ему то же самое: «Так будет сделано для человека, который сразит его».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּדָּבָר הַזֶּה
  choice: то же самое
  rationale: В контексте это отсылка к уже названной награде; естественная русская формулировка передаёт смысл буквально выраженного «согласно этому слову/делу».
- source_word: יַכֶּנּוּ
  choice: сразит его
  rationale: Глагол נכה здесь означает нанести поражение, фактически убить Голиафа; «сразит» сохраняет воинский контекст и не перегружает формулировку уточнением.
- source_word: כֹּה יֵעָשֶׂה לָאִישׁ
  choice: Вот что будет сделано для человека
  rationale: Сохраняется пассивная конструкция оригинала и её направленность на награду, предназначенную победителю.
