base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/005.yaml
  text: He had a bronze helmet on his head[a], and he was clothed with a coat of scale armor[b]; and the weight of the coat was five thousand shekels of bronze.
translation:
  language: ru
  text: На голове у него был бронзовый шлем, и одет он был в чешуйчатый панцирь[a]. Вес панциря составлял пять тысяч сиклей бронзы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «панцирь из чешуи». Еврейский текст описывает доспех из перекрывающих друг друга пластин, подобных чешуе.'
    reason: lexical_alternative
  - marker: b
    text: Пять тысяч сиклей — приблизительно 57 килограммов.
    reason: cultural_note
lexical_decisions:
- source_word: כּוֹבַע
  choice: шлем
  rationale: В военном контексте слово обозначает защитный головной убор; «шлем» — ясный и естественный современный эквивалент.
- source_word: נְחֹשֶׁת
  choice: бронза / бронзовый
  rationale: В описаниях древних металлических изделий слово может обозначать медь или бронзу; применительно к вооружению традиционное и контекстуально вероятное значение — «бронза».
- source_word: שִׁרְיוֹן קַשְׂקַשִּׂים
  choice: чешуйчатый панцирь
  rationale: Буквально речь идет о нательной броне из перекрывающих друг друга пластин, подобных чешуе. «Чешуйчатый панцирь» точно и понятно передает вид доспеха, не создавая ошибочной ассоциации с кольчугой.
- source_word: הוּא לָבוּשׁ
  choice: одет он был
  rationale: Сохранено статическое значение конструкции — Голиаф находился облаченным в доспех; инверсия поддерживает естественный торжественно-повествовательный ритм.
- source_word: מִשְׁקַל
  choice: вес
  rationale: Обычный русский эквивалент в описании тяжести предмета.
- source_word: חֲמֵשֶׁת אֲלָפִים שְׁקָלִים
  choice: пять тысяч сиклей
  rationale: Древняя единица измерения сохранена в основном тексте ради точности и прозрачности; приблизительный современный эквивалент дан в сноске.
