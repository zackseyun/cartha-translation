base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/043.yaml
  text: And the Philistine said to David[a], “Am I a dog[b], that you come to me with sticks?” And the Philistine cursed David by his gods.
translation:
  language: ru
  text: 'И сказал филистимлянин Давиду: «Неужели я собака, что ты идёшь ко мне с палками[a]?» И проклял филистимлянин Давида именем своих богов[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с посохами» или «с жезлами». Еврейское слово может обозначать палки, посохи или жезлы; в этой реплике «палки» передаёт презрительный тон филистимлянина.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «своими богами»; также возможно: «своим богом». Еврейский предлог может указывать на средство или на призывание, а форма слова «бог» формально допускает единственное или множественное понимание; в данном контексте наиболее естественно множественное.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: филистимлянин
  rationale: Передаёт этническое обозначение Голиафа без добавочного толкования «воин» и соответствует повествовательному стилю.
- source_word: הֲכֶלֶב אָנֹכִי
  choice: Неужели я собака
  rationale: Сохраняет буквальный и культурно значимый образ, а частица «неужели» естественно выражает возмущённый риторический вопрос.
- source_word: כִּי
  choice: что
  rationale: Вводит основание возмущённого вопроса и естественно связывает его с последующим действием Давида.
- source_word: בָא אֵלַי
  choice: ты идёшь на меня
  rationale: Причастная конструкция описывает происходящее сейчас; «на меня» в контексте поединка естественно передаёт направленность и враждебный характер приближения.
- source_word: בַּמַּקְלוֹת
  choice: с палками
  rationale: מַקֵּל может обозначать палку, посох или жезл. Множественное «палки» сохраняет презрительную гиперболу филистимлянина и не превращает их в полноценное оружие.
- source_word: וַיְקַלֵּל
  choice: проклял
  rationale: Глагол обозначает не просто оскорбление, а произнесение проклятия, здесь связанного с призыванием божеств.
- source_word: בֵּאלֹהָיו
  choice: своими богами
  rationale: Предлог ב указывает на средство или призываемую силу проклятия; «своими» естественно соотносит богов с филистимлянином, а множественное число сохраняет наиболее вероятный смысл контекста.
theological_decisions:
- issue: Число существительного אֱלֹהִים с суффиксом 3-го лица мужского рода в филистимском контексте
  choice: своими богами
  alternative: своим богом
  rationale: Форма אֱלֹהִים допускает как множественное, так и единственное понимание. В контексте филистимлянина множественное число наиболее вероятно и не привносит в его речь предположения о единобожии; возможность единственного числа отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор «филистимлянин» сохранён вслед за еврейским текстом. Буква «ё» последовательно употреблена в форме «идёшь».
