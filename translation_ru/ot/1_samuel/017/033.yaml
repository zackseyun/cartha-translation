base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/033.yaml
  text: Saul said to David[a], “You are not able to go against this Philistine to fight with him, because you are a youth[b], and he has been a man of war from his youth.”
translation:
  language: ru
  text: 'И сказал Саул Давиду: «Не сможешь ты выйти против этого филистимлянина[b] и сразиться с ним, потому что ты юноша[a], а он — воин с юности».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское на́ар может означать юношу, молодого человека, а в некоторых контекстах — мальчика.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Не можешь ты пойти против этого филистимлянина, чтобы сразиться с ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: не сможешь
  rationale: Передаёт выраженную глаголом יכל неспособность, а не запрет; в русском контексте естественнее, чем «ты не способен».
- source_word: לָלֶכֶת אֶל
  choice: выйти против
  rationale: В военном контексте речь идёт не просто о движении к противнику, а о выступлении против него.
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: этого филистимлянина
  rationale: Прямо и естественно передаёт этноним с указательным местоимением.
- source_word: לְהִלָּחֵם עִמּוֹ
  choice: сразиться с ним
  rationale: Естественно передаёт вступление в личный бой; «сражаться с ним» также возможно, но менее точно выражает предстоящее столкновение.
- source_word: כִּי
  choice: потому что
  rationale: Вводит причину высказанной Саулом неспособности Давида.
- source_word: נַעַר
  choice: юноша
  rationale: Сохраняет возрастную неопределённость נַעַר между мальчиком и молодым мужчиной и подходит контексту.
- source_word: אִישׁ מִלְחָמָה
  choice: воин
  rationale: Устойчивое и ясное русское соответствие буквальному «муж войны», обозначающее опытного бойца.
- source_word: מִנְּעֻרָיו
  choice: с юности
  rationale: Передаёт длительность, начавшуюся в юности и продолжающуюся до настоящего момента.
