  text: וַ/יֵּ֨לְכ֜וּ שְׁלֹ֤שֶׁת בְּנֵֽי יִשַׁי֙ הַ/גְּדֹלִ֔ים הָלְכ֥וּ אַחֲרֵי שָׁא֖וּל לַ/מִּלְחָמָ֑ה וְ/שֵׁ֣ם שְׁלֹ֣שֶׁת בָּנָ֗י/ו אֲשֶׁ֤ר הָלְכוּ֙ בַּ/מִּלְחָמָ֔ה אֱלִיאָ֣ב הַ/בְּכ֗וֹר וּ/מִשְׁנֵ֨/הוּ֙ אֲבִ֣ינָדָ֔ב וְ/הַ/שְּׁלִשִׁ֖י שַׁמָּֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/013.yaml
  text: The three oldest sons of Jesse had gone after Saul to the battle. And the names of his three sons who had gone to the battle were Eliab the firstborn[a], his second Abinadab, and the third Shammah.
translation:
  language: ru
  text: 'Три старших сына Иессея отправились вслед за Саулом[a] на войну. Вот имена трёх его сыновей, отправившихся на войну: первенец Елиав, второй за ним — Авинадав, а третий — Шамма.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «вслед за Саулом» можно также понять как «следуя за Саулом».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ / הָלְכוּ
  choice: отправились
  rationale: Формы הלך обозначают уход или отправление вместе с Саулом в военный поход; прошедшее совершенного вида естественно передаёт фоновое действие в русском повествовании.
- source_word: שְׁלֹשֶׁת בְּנֵי יִשַׁי הַגְּדֹלִים
  choice: три старших сына Иессея
  rationale: В семейном контексте הַגְּדֹלִים указывает на старшинство по возрасту, а не на рост или общественное положение.
- source_word: אַחֲרֵי שָׁאוּל
  choice: вслед за Саулом
  rationale: Сохраняет пространственный образ «за/позади» и вместе с тем естественно выражает следование за Саулом в поход.
- source_word: לַמִּלְחָמָה / בַּמִּלְחָמָה
  choice: на войну
  rationale: מִלְחָמָה может обозначать как войну, так и сражение; сочетание «отправиться на войну» здесь естественно передаёт участие в военном походе и одинаково переводит оба повторения.
- source_word: וְשֵׁם
  choice: вот имена
  rationale: Еврейское единственное число входит в формулу представления последующего перечня; по-русски естественно употребить множественное «имена».
- source_word: בָּנָיו
  choice: его сыновей
  rationale: Местоименный суффикс относится к Иессею; близкий контекст позволяет сохранить местоименную связь без повтора имени.
- source_word: הַבְּכוֹר
  choice: первенец
  rationale: בכור обозначает не просто старшего по возрасту, а сына со статусом первенца.
- source_word: וּמִשְׁנֵהוּ
  choice: второй за ним
  rationale: 'Передаёт порядковое значение и местоименный суффикс: Авинадав назван вторым после Елиава.'
- source_word: וְהַשְּׁלִשִׁי
  choice: а третий
  rationale: Сохраняет формальную последовательность перечисления и звучит естественно по-русски.
- source_word: אֱלִיאָב / אֲבִינָדָב / שַׁמָּה
  choice: Елиав / Авинадав / Самма
  rationale: Имена переданы прозрачной русской транслитерацией еврейских форм.
