  text: וַ/יֹּ֨אמֶר יִשַׁ֜י לְ/דָוִ֣ד בְּנ֗/וֹ קַח נָ֤א לְ/אַחֶ֨י/ךָ֙ אֵיפַ֤ת הַ/קָּלִיא֙ הַ/זֶּ֔ה וַ/עֲשָׂרָ֥ה לֶ֖חֶם הַ/זֶּ֑ה וְ/הָרֵ֥ץ הַֽ/מַּחֲנֶ֖ה לְ/אַחֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/017.yaml
  text: And Jesse said to David his son[a], “Please take to your brothers this ephah of roasted grain and these ten loaves[b], and run to the camp to your brothers.”
translation:
  language: ru
  text: 'И сказал Иессей своему сыну Давиду: «Возьми, пожалуйста, для своих братьев эту ефу[a] жареного зерна[b] и эти десять хлебов и беги в лагерь к своим братьям».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ефа — древняя мера сыпучих тел объёмом примерно 22 литра.
    reason: cultural_note
  - marker: b
    text: 'Или: «поджаренного зерна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח נָא
  choice: Возьми, пожалуйста
  rationale: Частица נָא смягчает повеление и передаёт вежливую настойчивость; эта формулировка естественна для современного русского языка.
- source_word: לְאַחֶיךָ
  choice: для своих братьев / к своим братьям
  rationale: В первом случае предлог ל обозначает получателей припасов, а в конце — направление движения; контекстуальное варьирование естественно передаёт обе функции.
- source_word: אֵיפַת
  choice: эту ефу
  rationale: Сохранено конкретное древнее название меры с пояснением в сноске, без замены приблизительным современным объёмом в основном тексте.
- source_word: הַקָּלִיא
  choice: жареного зерна
  rationale: Слово обозначает зерно, приготовленное обжариванием; перевод понятен современному читателю и не уточняет вид зерна, не названный в еврейском тексте.
- source_word: וַעֲשָׂרָה לֶחֶם
  choice: и эти десять хлебов
  rationale: Сочетание числительного с לֶחֶם указывает на отдельные хлебы. Такой вариант сохраняет предметность оригинала, не навязывая неизвестную форму выпечки.
- source_word: וְהָרֵץ
  choice: и беги
  rationale: Повелительная форма каузативной породы от רוץ в данном контексте выражает срочное быстрое движение; буквальное «беги» сохраняет живость речи.
- source_word: הַמַּחֲנֶה
  choice: в лагерь
  rationale: В военном контексте מַחֲנֶה естественно переводится словом «лагерь».
- source_word: בְּנוֹ
  choice: своему сыну
  rationale: Приложение обозначает родство Давида с Иессеем; русская конструкция с притяжательным местоимением естественно передаёт это отношение.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены повтор «братьям» и энергичное повеление «беги». Маркеры сносок размещены при словах, которые они поясняют; их положение исправляет очевидное несоответствие маркеров в английском консультационном тексте.
