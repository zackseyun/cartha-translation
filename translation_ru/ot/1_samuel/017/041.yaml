lexical_decisions:
- source_word: וַיֵּלֶךְ הַפְּלִשְׁתִּי הֹלֵךְ וְקָרֵב
  choice: Филистимлянин всё приближался
  rationale: Сочетание личной формы הלך с причастиями הֹלֵךְ וְקָרֵב изображает продолжающееся движение вперёд и постепенное сокращение расстояния. Частица «всё» естественно передаёт длительность и нарастание действия.
- source_word: אֶל דָּוִד
  choice: к Давиду
