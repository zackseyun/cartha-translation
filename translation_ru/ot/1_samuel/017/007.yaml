base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/007.yaml
  text: The shaft of his spear was like a weaver’s beam[a], and the iron head of his spear weighed six hundred shekels; and the bearer of the shield went before him.
translation:
  language: ru
  text: Древко его копья было как ткацкий навой, а железный наконечник его копья весил шестьсот шекелей; перед ним шёл щитоносец[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать большой, ростовой щит, а не небольшой ручной щит.
    reason: lexical_alternative
lexical_decisions:
- source_word: חץ חֲנִיתוֹ
  choice: древко его копья
  rationale: Хотя חץ обычно означает «стрела», в данном сочетании и при сравнении с ткацким навоем речь идёт о длинном древке копья.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: как ткацкий навой
  rationale: מְנוֹר обозначает деталь ткацкого станка, вероятнее всего навой — массивный вал, с которым сравнивается древко; образ оригинала сохранён.
- source_word: לַהֶבֶת חֲנִיתוֹ
  choice: наконечник копья
  rationale: Буквально לַהֶבֶת может обозначать клинок или острие; применительно к копью естественное русское обозначение его металлической боевой части — «наконечник».
- source_word: שֵׁשׁ מֵאוֹת שְׁקָלִים בַּרְזֶל
  choice: железный наконечник копья весил шестьсот шекелей
  rationale: 'В еврейском выражении вес дан эллиптически: «шестьсот шекелей железа». Глагол «весил» восполняет подразумеваемую связь, а «железный» передаёт материал наконечника.'
- source_word: נֹשֵׂא הַצִּנָּה
  choice: щитоносец с большим щитом
  rationale: צִנָּה обычно обозначает большой щит, прикрывающий значительную часть тела. Формулировка отличает его от малого щита и естественно звучит по-русски.
- source_word: הֹלֵךְ לְפָנָיו
  choice: перед ним шёл
  rationale: Передаёт продолжающееся движение сопровождавшего Голиафа щитоносца впереди него.
