  text: וְ/יֵֽדְעוּ֙ כָּל הַ/קָּהָ֣ל הַ/זֶּ֔ה כִּֽי לֹ֛א בְּ/חֶ֥רֶב וּ/בַ/חֲנִ֖ית יְהוֹשִׁ֣יעַ יְהוָ֑ה כִּ֤י לַֽ/יהוָה֙ הַ/מִּלְחָמָ֔ה וְ/נָתַ֥ן אֶתְ/כֶ֖ם בְּ/יָדֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/047.yaml
  text: and all this assembly will know that Yahweh does not save by sword or by spear[a]; for the battle belongs to Yahweh[c][b], and he will give you into our hand.
translation:
  language: ru
  text: И узнает всё это собрание, что не мечом и не копьём спасает Яхве[a], потому что битва принадлежит Яхве[b], и Он отдаст вас в наши руки[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не мечом и копьём избавляет Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по структуре: «у Яхве битва»; то есть битва принадлежит Ему.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в нашу руку»; это выражение означает «в нашу власть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: И узнает
  rationale: Форма Qal imperfect 3-го лица множественного числа выражает будущий результат. В русском сказуемое согласуется с собирательным существительным «собрание» в единственном числе.
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: всё это собрание
  rationale: קהל обозначает собравшихся людей; «собрание» естественно для данной сцены и не вносит излишне церковной окраски.
- source_word: לֹא בְּחֶרֶב וּבַחֲנִית יְהוֹשִׁיעַ
  choice: не мечом и не копьём спасает
  rationale: Предлог בְּ передаёт средство, а Hiphil от ישׁע — спасение или избавление. Повтор отрицания естественен по-русски и сохраняет парную конструкцию еврейского текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано принятой современной русской транслитерацией, а не заменено титулом.
- source_word: כִּי לַיהוָה הַמִּלְחָמָה
  choice: потому что битва принадлежит Яхве
  rationale: Второе כִּי имеет объяснительно-причинное значение, а конструкция с לְ выражает принадлежность. «Битва» соответствует непосредственному военному контексту.
- source_word: וְנָתַן
  choice: и Он отдаст
  rationale: Хотя употреблена форма qatal, в пророчески-предсказательном контексте она относится к предстоящему исходу; будущее время естественно передаёт этот смысл.
- source_word: אֶתְכֶם בְּיָדֵנוּ
  choice: вас в наши руки
  rationale: Еврейская идиома означает передачу во власть победителей. Русское множественное «в наши руки» является естественным идиоматическим соответствием при сохранении образа.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение יְהוֹשִׁיעַ в военном контексте
  choice: спасает
  alternative: дарует победу / избавляет
  rationale: «Спасает» сохраняет широкое значение корня ישׁע и его богословское звучание, не ограничивая смысл лишь военной победой.
- issue: Принадлежность битвы Яхве
  choice: битва принадлежит Яхве
  alternative: битва — Яхве
  rationale: Русская конструкция ясно передаёт еврейское выражение принадлежности, не добавляя утверждения о том, каким именно способом Бог обеспечит исход.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной речью. Сохранены военная образность, личное имя Яхве и смысловая напряжённость между человеческим оружием и Божьим спасением; еврейская идиома о руке передана естественным русским выражением и пояснена в сноске.
