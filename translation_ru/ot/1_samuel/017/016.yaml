  text: Сорок дней филистимлянин утром и вечером выходил вперёд и занимал позицию.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: выходил вперёд
  rationale: Глагол נגשׁ означает приближаться или подходить; в военном контексте выражение «выходил вперёд» естественно передаёт повторяющееся выступление филистимлянина перед войском.
- source_word: הַפְּלִשְׁתִּי
  choice: филистимлянин
  rationale: В еврейском тексте сказано только «филистимлянин»; добавление «воин» или «единоборец» заимствовало бы сведения из контекста.
- source_word: הַשְׁכֵּם וְהַעֲרֵב
  choice: утром и вечером
  rationale: Парное выражение естественно обозначает два ежедневных выхода; русский оборот сохраняет временной ритм исходного текста.
- source_word: וַיִּתְיַצֵּב
  choice: занимал своё место
  rationale: Возвратная порода глагола יצב означает встать или расположиться на определённом месте; выбранная формулировка передаёт намеренное занятие позиции.
- source_word: אַרְבָּעִים יוֹם
  choice: так сорок дней
  rationale: Фраза обозначает продолжительность повторяющегося действия; «так» естественно связывает срок с ежедневными выходами.
