  text: While he was speaking with them[a], behold, the champion came up—the Philistine named Goliath, from Gath, from the ranks of the Philistines—and he spoke these words[b], and David heard.
translation:
  language: ru
  text: Пока он разговаривал с ними, и вот, единоборец[a] — филистимлянин по имени Голиаф из Гефа — вышел из рядов филистимлян[b]. Он сказал эти слова, и Давид услышал это.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек между [двумя сторонами]» — воин, представляющий своё войско в поединке.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское написание в этом месте неясно; вероятный смысл — филистимские боевые ряды. Возможный перевод: «из лагеря филистимлян».'
    reason: alternative_reading
lexical_decisions:
- source_word: מְדַבֵּר עִמָּם
  choice: разговаривал с ними
  rationale: Причастие в сочетании с הוּא передаёт продолжающееся действие, а עִם указывает на разговор с собеседниками, а не только на одностороннее обращение.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Сохранён повествовательный указатель, вводящий внезапное и ярко представленное событие.
- source_word: אִישׁ הַבֵּנַיִם
  choice: единоборец
  rationale: Буквально выражение означает «человек между [двумя сторонами]» и обозначает представителя войска, выступающего на поединок. «Единоборец» точно и естественно передаёт эту функцию.
- source_word: עוֹלֶה
  choice: вышел
  rationale: В данном военном контексте причастие описывает появление Голиафа перед строями; «вышел» естественно передаёт движение из филистимского строя к месту противостояния.
- source_word: הַפְּלִשְׁתִּי שְׁמוֹ מִגַּת
  choice: филистимлянин по имени Голиаф из Гефа
  rationale: Идентификационная формула передана современным и ясным русским оборотом с традиционной формой топонима «Геф».
- source_word: ממ(ע)רות פְּלִשְׁתִּים
  choice: из рядов филистимлян
  rationale: Текстовая форма трудна, однако контекст указывает на филистимский боевой строй или расположение войска. Основной текст передаёт наиболее вероятный смысл, а вариант отмечен в сноске.
- source_word: וַיְדַבֵּר כַּדְּבָרִים הָאֵלֶּה
  choice: Он произнёс те же слова
  rationale: Оборот отсылает к ранее приведённому вызову Голиафа; «те же слова» ясно выражает повторение уже известной речи.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: и Давид услышал
  rationale: Сохранена простая повествовательная конструкция и, как в еврейском тексте, не добавлен явно не названный объект.
