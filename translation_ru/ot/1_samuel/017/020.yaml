base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/020.yaml
  text: So David rose early in the morning[a], left the sheep with a keeper, took the supplies, and went, just as Jesse had commanded him[b]. He came to the encampment as the army was going out to the battle line and shouting the war cry.
translation:
  language: ru
  text: Давид встал рано утром, оставил овец под присмотром сторожа, взял припасы и пошёл, как велел ему Иессей. Он пришёл к стану[a], когда войско выходило в боевой строй, поднимая боевой клич[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к круговому стану»; возможно также: «к ограждению из повозок». Еврейское слово может обозначать круговое расположение лагеря или его защитный периметр.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и закричали в сражении»; возможно также понимание: «закричали перед боем» или «для боя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם דָּוִד בַּבֹּקֶר
  choice: Давид встал рано утром
  rationale: Сочетание глагола со значением «встать/начать рано» и обстоятельства «утром» естественно передаётся по-русски как «встал рано утром» и подчёркивает расторопность Давида.
- source_word: וַיִּטֹּשׁ אֶת־הַצֹּאן עַל־שֹׁמֵר
  choice: оставил овец на попечение сторожа
  rationale: Оборот означает, что Давид передал овец под надзор другого человека. «На попечение сторожа» ясно выражает заботу и охрану стада.
- source_word: וַיִּשָּׂא
  choice: взял припасы
  rationale: Буквально глагол означает «поднял, понёс»; его подразумеваемый объект восстанавливается из предыдущего стиха, где названы припасы для братьев.
- source_word: כַּאֲשֶׁר צִוָּהוּ יִשָׁי
  choice: как велел ему Иессей
  rationale: Передаёт значение צוה «велеть, приказывать» без стилистической тяжеловесности.
- source_word: הַמַּעְגָּלָה
  choice: стан
  rationale: В данном военном контексте слово обозначает место расположения войска, возможно, его круговой или укреплённый периметр. Основной текст использует понятное «стан», а конкретные варианты сохранены в примечании.
- source_word: הַחַיִל הַיֹּצֵא אֶל־הַמַּעֲרָכָה
  choice: войско выходило в боевой строй
  rationale: Причастная конструкция обозначает действие, происходившее при прибытии Давида; מַעֲרָכָה здесь — построение или линия войск для сражения.
- source_word: וְהֵרֵעוּ בַּמִּלְחָמָה
  choice: поднимая боевой клич
  rationale: Глагол в этой форме обозначает громкий возглас, а контекст уточняет его военное назначение. Русское выражение естественно передаёт совокупный смысл фразы.
