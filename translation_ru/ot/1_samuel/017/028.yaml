  text: וַ/יִּשְׁמַ֤ע אֱלִיאָב֙ אָחִ֣י/ו הַ/גָּד֔וֹל בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים וַ/יִּֽחַר אַף֩ אֱלִיאָ֨ב בְּ/דָוִ֜ד וַ/יֹּ֣אמֶר לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ וְ/עַל מִ֨י נָטַ֜שְׁתָּ מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙ בַּ/מִּדְבָּ֔ר אֲנִ֧י יָדַ֣עְתִּי אֶת זְדֹנְ/ךָ֗ וְ/אֵת֙ רֹ֣עַ לְבָבֶ֔/ךָ כִּ֗י לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה יָרָֽדְתָּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/028.yaml
  text: Eliab his oldest brother heard him speaking to the men[a], and Eliab’s anger burned against David, and he said, “Why have you come down here? And with whom have you left those few sheep in the wilderness? I know your presumption and the evil of your heart[b], for you have come down to see the battle.”
translation:
  language: ru
  text: 'Елиав, старший брат Давида, услышал, как тот разговаривал с людьми. Гнев Елиава вспыхнул против Давида, и он сказал: «Почему ты спустился сюда? С кем ты оставил тех немногих овец в пустыне? Я знаю твою самонадеянность[a] и зло в твоём сердце[b]: ты спустился, чтобы посмотреть на битву».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твою гордыню»; или: «твою дерзость».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «порочность твоего сердца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדַבְּרוֹ אֶל־הָאֲנָשִׁים
  choice: как тот разговаривал с людьми
  rationale: Конструкция с инфинитивом передаёт сопутствующее или продолжающееся действие. «С людьми» сохраняет обычное значение אֲנָשִׁים, не уточняя без необходимости, что это воины.
- source_word: וַיִּחַר אַף אֱלִיאָב
  choice: гнев Елиава вспыхнул
  rationale: Передаёт яркий древнееврейский образ разгоревшегося гнева и естественно звучит по-русски.
- source_word: לָמָּה זֶּה יָרַדְתָּ
  choice: Зачем ты сюда пришёл?
  rationale: В контексте ירד означает движение к месту, где находится говорящий; «сюда» передаёт указательный оттенок זֶה. Вопрос звучит как упрёк о цели прихода.
- source_word: וְעַל־מִי נָטַשְׁתָּ
  choice: С кем ты оставил
  rationale: Это естественный русский способ спросить, на чьё попечение были оставлены овцы, без усиления смысла до полного оставления или отвержения.
- source_word: מְעַט הַצֹּאן הָהֵנָּה
  choice: тех немногих овец
  rationale: Сохраняет указательное местоимение и пренебрежительный оттенок упоминания о малом числе овец.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Традиционное и контекстуально уместное обозначение необрабатываемой открытой местности, где пасли стада.
- source_word: זְדֹנְךָ
  choice: твою самонадеянность
  rationale: Слово обозначает гордую, дерзкую уверенность в себе; «самонадеянность» хорошо передаёт обвинительный смысл, не сужая его до одного лишь высокомерия.
- source_word: רֹעַ לְבָבֶךָ
  choice: зло, которое у тебя на сердце
  rationale: Передаёт нравственно отрицательное состояние внутреннего человека и сохраняет образ сердца, оставаясь естественным для современного русского языка.
- source_word: לְמַעַן רְאוֹת הַמִּלְחָמָה
  choice: только затем, чтобы посмотреть на битву
  rationale: Передаёт конструкцию цели и обвинительный тон Елиава. «Битва» соответствует непосредственному военному противостоянию.
