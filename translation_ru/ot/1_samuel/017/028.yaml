translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Имена повторены там, где русские местоимения могли бы создать неясность; «тот» однозначно указывает на Давида. Образ вспыхнувшего гнева сохранён, а реплика Елиава передана резко, но без добавления не выраженных в источнике мотивов.
