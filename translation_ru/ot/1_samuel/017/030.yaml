  text: Then he turned away from him toward another and said the same thing[a], and the people answered him as before.
translation:
  language: ru
  text: Тогда он повернулся от него к другому и сказал то же самое, а люди ответили ему так же, как прежде.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
