    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב מֵאֶצְלוֹ
  choice: он отвернулся от него
  rationale: Сочетание передаёт как физический поворот Давида, так и прекращение разговора с прежним собеседником; местоимение относится к Елиаву.
- source_word: אֶל מוּל אַחֵר
  choice: повернулся к другому
  rationale: מול указывает на направление и положение лицом к иному человеку; явное повторение глагола делает движение естественным и понятным по-русски.
- source_word: וַיֹּאמֶר כַּדָּבָר הַזֶּה
  choice: спросил о том же
  rationale: Буквально Давид «сказал то же самое», однако контекст показывает, что он повторил свой вопрос; выбранная передача естественна и сохраняет смысл.
- source_word: וַיְשִׁבֻהוּ הָעָם
  choice: люди ответили ему
  rationale: Форма שוב в данном употреблении означает дать ответ, а עם обозначает присутствовавших людей, без необходимости сужать значение до воинов.
- source_word: דָּבָר כַּדָּבָר הָרִאשׁוֹן
  choice: так же, как прежде
  rationale: 'Идиоматично передаёт буквальное «словом, подобным первому слову»: ответ совпадал с данным ранее.'
