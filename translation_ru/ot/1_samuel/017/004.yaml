lexical_decisions:
- source_word: וַיֵּצֵא
  choice: И вышел
  rationale: Передаёт повествовательную форму с последовательным значением и естественно описывает появление воина из филистимского стана.
- source_word: אִישׁ הַבֵּנַיִם
  choice: единоборец
  rationale: Еврейское выражение буквально означает «человек между [двумя сторонами]» и обозначает воина, выходящего между боевыми линиями для поединка от лица своего войска. «Единоборец» кратко и естественно передаёт эту функцию.
- source_word: מִמַּחֲנוֹת פְּלִשְׁתִּים
  choice: из филистимских станов
  rationale: Сохраняет множественное число еврейского מַחֲנוֹת и передаёт принадлежность станов филистимлянам естественным русским определением.
- source_word: גָּלְיָת שְׁמוֹ
  choice: по имени Голиаф
  rationale: Естественная русская передача еврейской именной конструкции «имя его — Голиаф» без изменения смысла.
- source_word: מִגַּת
  choice: из Гефа
  rationale: Прямо передаёт указанное в тексте место происхождения, не заменяя его этнонимом.
- source_word: גָּבְהוֹ שֵׁשׁ אַמּוֹת וָזָרֶת
  choice: Ростом он был шесть локтей с пядью
  rationale: Сохраняет древние единицы измерения и естественно выражает рост по-русски; сочетание «с пядью» точно передаёт добавочную меру.
