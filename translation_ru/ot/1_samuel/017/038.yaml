  text: Тогда Саул одел Давида в свои одежды[a], надел Давиду на голову бронзовый шлем и облачил его в доспехи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своё воинское облачение». Еврейское слово может обозначать одежду, связанную со званием или предназначенную для боя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּלְבֵּשׁ
  choice: одел / облачил
  rationale: 'Порода hифиль выражает побуждение или действие над другим лицом: Саул надевает предметы на Давида. В первом случае естественно «одел», во втором более уместно «облачил», при этом повтор еврейского глагола отражён близкими по смыслу словами.'
- source_word: מַדָּיו
  choice: свои одежды
  rationale: מַדִּים может обозначать одежду, в том числе служебное или воинское облачение. Отдельное упоминание шлема и доспехов позволяет сохранить более широкое «одежды»; притяжательный суффикс относится к Саулу.
- source_word: קוֹבַע נְחֹשֶׁת
  choice: бронзовый шлем
  rationale: קוֹבַע означает шлем, а נְחֹשֶׁת в контексте древнего вооружения естественно передаётся как «бронза».
- source_word: עַל רֹאשׁוֹ
  choice: ему на голову
  rationale: Современная русская конструкция естественно передаёт буквальное «на его голову», причём местоимение однозначно относится к Давиду.
- source_word: שִׁרְיוֹן
  choice: доспехи
  rationale: Слово обозначает защитное вооружение для тела; множественная форма «доспехи» в современном русском языке естественна и не уточняет без достаточных оснований конкретный тип брони.
