  text: And Israel and the Philistines drew up battle line against battle line[a].
translation:
  language: ru
  text: Израильтяне и филистимляне выстроились к бою — строй против строя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «боевой строй напротив боевого строя».'
    reason: Лексическая альтернатива уточняет, что речь может идти о двух расположенных друг против друга боевых построениях.
lexical_decisions:
- source_word: וַתַּעֲרֹךְ
  choice: выстроились к бою
  rationale: Глагол ערך в военном контексте означает построение войска. Возвратная форма по-русски естественно передаёт действие обеих названных сторон; слова «к бою» ясно выражают военный смысл.
- source_word: יִשְׂרָאֵל
  choice: израильтяне
  rationale: Здесь название народа обозначает войско Израиля; «израильтяне» естественнее в русском повествовании при совместном подлежащем во множественном числе.
- source_word: וּפְלִשְׁתִּים
  choice: и филистимляне
  rationale: Общепринятое русское название народа; союз сохранён.
- source_word: מַעֲרָכָה
  choice: строй
  rationale: В данном военном контексте существительное обозначает боевой строй или линию построения. Краткое «строй» сохраняет образ организованных рядов и позволяет воспроизвести повтор исходного слова.
- source_word: לִקְרַאת
  choice: против
  rationale: Буквально выражает движение навстречу или расположение лицом к лицу; в военном контексте «против» естественно передаёт взаимное противостояние.
- source_word: מַעֲרָכָה
  choice: строй
  rationale: 'Повтор того же русского слова воспроизводит риторическую конструкцию еврейского текста: строй против строя.'
