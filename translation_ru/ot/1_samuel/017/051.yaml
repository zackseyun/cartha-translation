  text: וַ/יָּ֣רָץ דָּ֠וִד וַ/יַּעֲמֹ֨ד אֶל הַ/פְּלִשְׁתִּ֜י וַ/יִּקַּ֣ח אֶת חַ֠רְבּ/וֹ וַֽ/יִּשְׁלְפָ֤/הּ מִ/תַּעְרָ/הּ֙ וַ/יְמֹ֣תְתֵ֔/הוּ וַ/יִּכְרָת בָּ֖/הּ אֶת רֹאשׁ֑/וֹ וַ/יִּרְא֧וּ הַ/פְּלִשְׁתִּ֛ים כִּֽי מֵ֥ת גִּבּוֹרָ֖/ם וַ/יָּנֻֽסוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/051.yaml
  text: Then David ran and stood over the Philistine[a], took his sword, drew it from its sheath, and killed him; then he cut off his head with it. When the Philistines saw that their champion was dead[b], they fled.
translation:
  language: ru
  text: Тогда Давид подбежал, встал над филистимлянином[a], взял его меч, вынул его из ножен, убил филистимлянина, а затем отсёк ему голову этим мечом. Увидев, что их могучий воин[b] мёртв, филистимляне обратились в бегство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «встал рядом с филистимлянином». Еврейское выражение может означать, что Давид занял место возле него; перевод «встал над» соответствует вероятной картине: Давид стоит над поверженным Голиафом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их богатырь», «их герой». Еврейское слово обозначает сильного, доблестного воина; в этом рассказе Голиаф также выступает как представитель своего войска в поединке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: подбежал
  rationale: Глагол רוץ означает «бежать»; в данном контексте «подбежал» естественно передаёт стремительное приближение Давида к поверженному противнику.
- source_word: וַיַּעֲמֹד אֶל הַפְּלִשְׁתִּי
  choice: встал над филистимлянином
  rationale: Сочетание עמד אל может указывать на положение рядом с кем-либо; по сцене наиболее вероятно, что Давид встал над поверженным филистимлянином. Неоднозначность отмечена в сноске.
- source_word: חַרְבּוֹ
  choice: его меч
  rationale: Местоименный суффикс указывает на меч филистимлянина.
- source_word: וַיִּשְׁלְפָהּ מִתַּעְרָהּ
  choice: вынул его из ножен
  rationale: שלף обозначает извлечение оружия, а תער — его ножны; русский оборот звучит естественно и точно.
- source_word: וַיְמֹתְתֵהוּ
  choice: умертвил филистимлянина
  rationale: Каузативная форма от מות прямо сообщает о причинении смерти. Формулировка сохраняет повествовательное напряжение с предыдущим стихом, где филистимлянин уже упал после удара камнем, не пытаясь его сгладить.
- source_word: וַיִּכְרָת בָּהּ אֶת רֹאשׁוֹ
  choice: отсёк ему голову этим мечом
  rationale: כרת с רֹאשׁ означает отсечение головы; явное «этим мечом» устраняет возможную неясность русского местоимения и передаёт בָּהּ.
- source_word: גִּבּוֹרָם
  choice: их богатырь
  rationale: גבור обозначает могучего воина. «Богатырь» сохраняет значение силы и воинской доблести, не подменяя само слово более контекстуальным понятием «поединщик»; варианты отмечены в сноске.
- source_word: וַיָּנֻסוּ
  choice: обратились в бегство
  rationale: Стандартное обозначение бегства с поля боя; выражение соответствует военному контексту и литературному регистру.
theological_decisions:
- issue: Соотношение с предыдущим сообщением о падении Голиафа
  choice: Сохранено прямое «умертвил», после чего сообщается об отсечении головы
  alternative: Смягчить до «добил» либо истолковать отсечение головы как сам момент смерти
  rationale: Еврейский текст употребляет каузативную форму от מות и затем отдельный глагол «отсёк». Перевод сохраняет последовательность и возможное повествовательное напряжение, не навязывая медицинской реконструкции.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. Повтор «филистимлянина» вместо местоимения во второй части первой фразы предотвращает неоднозначность после упоминания меча; «этим мечом» ясно передаёт референт еврейского местоимения. Все маркеры сносок присутствуют в основном тексте.
