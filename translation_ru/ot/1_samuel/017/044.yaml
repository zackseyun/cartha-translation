base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/044.yaml
  text: And the Philistine said to David[a], “Come to me[b], and I will give your flesh to the birds of the heavens and to the beasts of the field.”
translation:
  language: ru
  text: 'И сказал филистимлянин Давиду: «Подойди ко мне, и я отдам твою плоть птицам небесным и зверям полевым».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: филистимлянин
  rationale: Определённая форма указывает на Голиафа; простой этноним точно передаёт еврейский текст, не добавляя отсутствующего здесь слова «воин».
- source_word: לְכָה אֵלַי
  choice: Подойди ко мне
  rationale: Императив הלך в сочетании с אֵלַי выражает прямой вызов приблизиться. «Подойди ко мне» естественнее по-русски, чем буквальное «иди ко мне», и сохраняет угрожающий тон.
- source_word: וְאֶתְּנָה
  choice: и я отдам
  rationale: Форма выражает решительное намерение говорящего; будущее время естественно передаёт угрозу.
- source_word: בְּשָׂרְךָ
  choice: твою плоть
  rationale: «Плоть» сохраняет буквальный и жестокий образ בשר, не подменяя его более толковательными словами «тело» или «труп».
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: птицам небесным
  rationale: Устойчивое и понятное русское выражение точно передаёт птиц, обитающих в небесном пространстве, и сохраняет возвышенный библейский регистр.
- source_word: וּלְבֶהֱמַת הַשָּׂדֶה
  choice: и зверям полевым
  rationale: В контексте угрозы בְּהֵמָה обозначает животных, которые растерзают останки; «звери полевые» сохраняет образ и параллелизм исходной фразы.
