base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/049.yaml
  text: Then David reached his hand into the bag[a], took a stone from there, slung it, and struck the Philistine on his forehead. The stone sank into his forehead[c][b], and he fell on his face to the ground.
translation:
  language: ru
  text: Тогда Давид протянул руку к сумке[a], взял оттуда камень, метнул его из пращи и поразил филистимлянина в лоб. Камень вонзился ему в лоб[b], и тот упал лицом на землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к мешку». Еврейское слово имеет широкое значение и здесь обозначает ёмкость, в которой Давид держал камни.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «камень погрузился в его лоб»; также возможно: «камень вошёл в его лоб».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶת־יָדוֹ אֶל־הַכֶּלִי
  choice: опустил руку в сумку
  rationale: Еврейское выражение буквально описывает движение руки к ёмкости; с учётом последующего «достал оттуда» по-русски естественно передать действие как «опустил руку в сумку».
- source_word: הַכֶּלִי
  choice: сумку
  rationale: כְּלִי — широкое обозначение предмета, сосуда или принадлежности; здесь по контексту это ёмкость, в которой Давид держал камни. «Сумка» ясно и естественно передаёт контекстуальное значение, а широта слова отмечена в сноске.
- source_word: אֶבֶן
  choice: камень
  rationale: Обычное и точное русское обозначение выбранного Давидом снаряда.
- source_word: וַיְקַלַּע
  choice: метнул его из пращи
  rationale: Глагол обозначает метание при помощи пращи. Русская формулировка ясно называет подразумеваемое орудие и сохраняет динамику повествования.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי אֶל־מִצְחוֹ
  choice: поразил филистимлянина в лоб
  rationale: «Поразил … в лоб» естественно передаёт удар и точку попадания, обозначенную אֶל.
- source_word: וַתִּטְבַּע הָאֶבֶן בְּמִצְחוֹ
  choice: камень вонзился ему в лоб
  rationale: טבע передаёт погружение или внедрение. «Вонзился» звучит естественно и выразительно по-русски, не уточняя сверх текста анатомическую глубину повреждения; более буквальный образ сохранён в сноске.
- source_word: וַיִּפֹּל עַל־פָּנָיו אָרְצָה
  choice: тот упал лицом на землю
  rationale: Формулировка близко передаёт буквальное «упал на своё лицо, к земле» и при этом звучит естественно в современном русском языке. Указательное «тот» однозначно относит действие к филистимлянину.
