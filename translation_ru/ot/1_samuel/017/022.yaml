base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/022.yaml
  text: So David left the supplies with the keeper of the supplies[a], and ran to the battle line[c][b]. When he arrived, he asked his brothers how they were.
translation:
  language: ru
  text: Тогда Давид оставил свою поклажу на попечение хранителя поклажи[a] и побежал к боевому строю[b]. Прибыв туда, он спросил братьев, всё ли у них хорошо[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «вещи», «снаряжение» или «припасы». Древнееврейское слово כֵּלִים имеет широкое значение; здесь речь идёт о принесённой Давидом поклаже.
    reason: lexical_alternative
  - marker: b
    text: Или «к боевым рядам». Древнееврейское מַעֲרָכָה обозначает выстроенную линию или строй войск.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «спросил братьев о мире». Это древнееврейское выражение означает, что Давид осведомился об их благополучии.'
    reason: idiom
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: оставил
  rationale: Глагол может означать «оставить» или «покинуть», но здесь Давид не бросает вещи, а временно передаёт их под присмотр.
- source_word: הַכֵּלִים
  choice: поклажу
  rationale: Широкое по значению слово обозначает вещи, принадлежности или снаряжение. «Поклажа» естественно указывает на принесённые Давидом вещи и не создаёт ложного впечатления, будто речь непременно идёт об оружии.
- source_word: מֵעָלָיו
  choice: свою поклажу
  rationale: Буквально сказано, что Давид оставил вещи, бывшие «на нём»; притяжательное «свою» вместе с контекстом передаёт, что речь о принесённой им ноше, без неестественного буквализма.
- source_word: עַל יַד שׁוֹמֵר הַכֵּלִים
  choice: на попечение сторожа поклажи
  rationale: Оборот «при руке» указывает на передачу под чью-либо ответственность. «На попечение» ясно передаёт этот смысл, а «сторож» сохраняет значение того, кто присматривает за вещами.
- source_word: וַיָּרָץ
  choice: побежал
  rationale: Прямое значение глагола сохраняет быстроту и энергичность действия.
- source_word: הַמַּעֲרָכָה
  choice: к боевому строю
  rationale: Слово обозначает выстроенное войско или линию войск. «Боевой строй» естественно и точно передаёт военный контекст.
- source_word: וַיָּבֹא
  choice: Подойдя
  rationale: 'Деепричастная конструкция естественно передаёт последовательность древнееврейского повествования: Давид приблизился, а затем обратился к братьям.'
- source_word: וַיִּשְׁאַל לְאֶחָיו לְשָׁלוֹם
  choice: он спросил братьев, всё ли у них хорошо
  rationale: Буквальный оборот «спросил о мире» является идиомой, обозначающей расспрос о благополучии; выбранная формулировка понятна современному русскому читателю.
