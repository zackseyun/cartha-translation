  yaml_path: translation/ot/1_samuel/017/018.yaml
  text: Also bring these ten cuts of cheese to the commander of the thousand[a], check on your brothers’ welfare, and bring back some token from them.
translation:
  language: ru
  text: А эти десять кусков сыра отнеси тысяченачальнику; проверь, всё ли у братьев благополучно, и принеси от них какой-нибудь знак[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возьми их залог». Значение еврейского слова не вполне ясно; возможно, имеется в виду предмет или иной знак, подтверждающий, как обстоят дела у братьев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרִצֵי הֶחָלָב
  choice: кусков сыра
  rationale: Сочетание обозначает нарезанные или сформованные порции молочного продукта; «куски сыра» конкретно, понятно и естественно по-русски.
- source_word: שַׂר הָאָלֶף
  choice: тысяченачальнику
  rationale: Речь о начальнике воинского подразделения, традиционно исчисляемого тысячей; русское «тысяченачальник» кратко сохраняет древнюю военную структуру.
- source_word: תִּפְקֹד לְשָׁלוֹם
  choice: проведай братьев, узнай, всё ли у них благополучно
  rationale: Глагол פקד здесь означает навестить или проверить состояние, а לְשָׁלוֹם — благополучие. Развёрнутая русская формулировка естественно передаёт оба элемента.
- source_word: עֲרֻבָּתָם
  choice: какой-нибудь знак от них
  rationale: Редкое и неоднозначное существительное может означать залог, знак или свидетельство. В контексте это, вероятно, предмет либо иной знак, подтверждающий состояние братьев; неопределённое «какой-нибудь знак» не уточняет его вид сверх текста.
- source_word: תִּקָּח
  choice: принеси
  rationale: Буквально «возьми»; с точки зрения посылающего отца подразумевается взять у братьев и принести обратно. «Принеси» естественно выражает контекстуальное направление действия.
