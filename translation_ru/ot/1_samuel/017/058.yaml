  yaml_path: translation/ot/1_samuel/017/058.yaml
  text: Saul said to him[a], “Whose son are you, young man?” And David said, “I am the son of your servant Jesse the Bethlehemite.”
translation:
  language: ru
  text: 'Саул сказал ему: «Чей ты сын, юноша?» Давид сказал: «Я сын твоего слуги Иессея, вифлеемлянина»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Сын твоего слуги Иессея, вифлеемлянина». В еврейском ответе местоимение «я» явно не выражено.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן מִי
  choice: Чей ты сын
  rationale: Еврейский оборот буквально спрашивает о происхождении по отцу. Такая формулировка естественна по-русски и сохраняет генеалогический акцент.
- source_word: הַנָּעַר
  choice: юноша
  rationale: Слово נַעַר может обозначать мальчика, отрока или молодого мужчину. В данном контексте «юноша» передаёт молодость Давида без излишнего умаления его возраста.
- source_word: עַבְדְּךָ
  choice: твоего слуги
  rationale: Здесь עֶבֶד употреблено как почтительное придворное самоумаление; «слуга» естественнее передаёт эту функцию, чем «раб».
- source_word: בֵּית הַלַּחְמִי
  choice: вифлеемлянина
  rationale: Форма указывает на происхождение Иессея из Вифлеема; русское обозначение жителя сохраняет краткость и структуру еврейского текста.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: сказал ... сказал
  rationale: В обеих частях стоит один и тот же обычный глагол «сказать». Повтор сохранён, хотя по функции первое высказывание является вопросом, а второе — ответом.
- source_word: בֶּן עַבְדְּךָ יִשַׁי
  choice: Я сын твоего слуги Иессея
  rationale: В еврейском ответе нет явно выраженной связки и местоимения «я», но по-русски их добавление делает ответ полноценным и естественным, не меняя смысла.
