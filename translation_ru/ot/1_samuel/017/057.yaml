base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/057.yaml
  text: When David returned from striking down the Philistine[a], Abner took him and brought him before Saul, with the Philistine’s head in his hand.
translation:
  language: ru
  text: Когда Давид вернулся после того, как сразил филистимлянина, Авенир взял его и привёл к Саулу; голову филистимлянина он держал в руке.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «а голова филистимлянина была в его руке». В еврейском тексте здесь безглагольная клауза, которую можно передать либо как самостоятельную сочинённую часть, либо как указание на сопутствующее обстоятельство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְשׁוּב
  choice: Когда Давид возвращался
  rationale: Сочетание союза с инфинитивом от שוב вводит временное придаточное; несовершенный вид естественно передаёт обстоятельственный фон для последующих действий.
- source_word: מֵהַכּוֹת
  choice: после того, как сразил
  rationale: נכה обозначает нанесение удара и в данном контексте смертельную победу; «сразил» сохраняет конкретность и не подменяет выражение более общим «победил».
- source_word: הַפְּלִשְׁתִּי
  choice: филистимлянина
  rationale: Сохранено нарицательное обозначение исходного текста без замены на имя Голиаф или пояснение «поединщик».
- source_word: וַיִּקַּח אֹתוֹ
  choice: Авенир взял его
  rationale: Прямо передаёт значение לקח; более сильное «схватил» необоснованно добавило бы оттенок принуждения.
- source_word: וַיְבִאֵהוּ לִפְנֵי שָׁאוּל
  choice: привёл к Саулу
  rationale: Каузативная форма בוא означает «привести»; русское «к Саулу» естественно выражает доставление в его присутствие.
- source_word: וְרֹאשׁ הַפְּלִשְׁתִּי בְּיָדוֹ
  choice: а голова филистимлянина была у него в руке
  rationale: Безглагольная еврейская клауза передана самостоятельной сочинённой частью, что сохраняет её синтаксическую заметность и не устраняет возможную неоднозначность местоимения.
