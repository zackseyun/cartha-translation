  terminology: «Посох», «гладкие камни», «праща» и «филистимлянин» удачны. «Русло потока» приемлемо для נחל; сноска корректно отмечает диапазон значений. «Пастушеская сумка» и «мешочек» передают вероятное соотношение כְּלִי и יַלְקוּט без догматизации спорной детализации.
