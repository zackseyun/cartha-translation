base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/040.yaml
  text: He took his staff in his hand and chose for himself five smooth stones from the wadi[a], and put them in the shepherd’s bag that he had, in the pouch; and his sling was in his hand[b]. Then he approached the Philistine.
translation:
  language: ru
  text: Он взял свой посох в руку, выбрал себе пять гладких камней из русла потока[a] и положил их в пастушескую сумку, то есть в мешочек[b], который был у него. Праща была у него в руке; затем он подошёл к филистимлянину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из ручья»; еврейское נַחַל может означать поток, овраг или русло сезонного водотока.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в суму»; еврейское יַלְקוּט означает небольшую сумку или мешок для переноски вещей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלוֹ
  choice: свой посох
  rationale: «Посох» естественно передаёт מַקֵּל в пастушеском контексте; возвратное «свой» ясно указывает на принадлежность Давиду.
- source_word: וַיִּבְחַר לוֹ
  choice: выбрал себе
  rationale: Дательный לוֹ сохраняется как «себе», подчёркивая личный и намеренный выбор.
- source_word: חֲמִשָּׁה חַלֻּקֵי אֲבָנִים
  choice: пять гладких камней
  rationale: Так естественно и точно передаётся гладкость камней, взятых из водотока.
- source_word: מִן הַנַּחַל
  choice: из русла потока
  rationale: נַחַל может обозначать поток, овраг или сезонное водное русло; выбранное выражение соответствует местности и остаётся понятным современному читателю.
- source_word: בִּכְלִי הָרֹעִים אֲשֶׁר לוֹ
  choice: в свою пастушескую сумку
  rationale: Широкое כְּלִי в данном контексте обозначает принадлежность или вместилище пастуха; «сумка» конкретизирует вероятный смысл без излишней буквальности.
- source_word: וּבַיַּלְקוּט
  choice: в мешочек
  rationale: יַלְקוּט обозначает небольшую сумку или мешочек и, вероятно, уточняет предыдущее более общее обозначение пастушеской сумки.
- source_word: וְקַלְּעוֹ בְיָדוֹ
  choice: Праща его была у него в руке
  rationale: В еврейском это безглагольная конструкция; добавление «была» необходимо для естественного русского синтаксиса и сохраняет повторный акцент на руке.
- source_word: וַיִּגַּשׁ אֶל הַפְּלִשְׁתִּי
  choice: и он направился к филистимлянину
  rationale: נגשׁ означает приближаться или подходить; «направился к» естественно передаёт движение навстречу противнику, не усиливая его до нападения.
