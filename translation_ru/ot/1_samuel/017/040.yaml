  source_fidelity: 'В целом переданы все основные элементы еврейского текста: посох, личный выбор пяти гладких камней из נחל, помещение в пастушеское вместилище/мешочек, праща в руке и приближение к филистимлянину. Однако «направился к» слабее, чем וַיִּגַּשׁ («подошёл, приблизился»).'
