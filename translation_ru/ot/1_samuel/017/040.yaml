translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Сохранены конкретность действий, повтор упоминания руки и уточняющее соотношение между пастушеской сумкой и мешочком; редкое «вади» заменено более прозрачным «русло потока», а варианты отражены в сноске.
