translation:
  language: ru
  text: 'И сказал царь: «Ты узнай, чей сын этот юноша».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с последовательной глагольной формой продолжает повествование; «И сказал» сохраняет библейский повествовательный ход без добавления лишнего оттенка.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное обозначает Саула по титулу; имя не подставляется, поскольку исходный текст его здесь не называет.
- source_word: שְׁאַל
  choice: разузнай
  rationale: Повелительная форма שׁאל означает «спроси, осведомись». В сочетании с косвенным вопросом «чей сын» глагол «разузнай» естественно передаёт поручение получить сведения.
- source_word: אַתָּה
  choice: ты сам
  rationale: Самостоятельное местоимение при повелительной форме имеет подчёркнутый характер; «ты сам» ясно и естественно сохраняет это выделение.
- source_word: בֶּן מִי
  choice: чей сын
  rationale: Прямой и идиоматичный русский эквивалент еврейского вопроса о происхождении по отцу.
- source_word: זֶה
  choice: этот
  rationale: Указательное местоимение мужского рода относится к находящемуся в поле внимания юноше.
- source_word: הָעָלֶם
  choice: юноша
  rationale: Слово обозначает молодого мужчину; «юноша» соответствует контексту и сохраняет достойный литературный регистр.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Прямая речь звучит естественно; эмфаза אַתָּה сохранена выражением «ты сам». Параллельные знаки в конце масоретского текста и ס являются разметкой, а не частью переводимого высказывания.
