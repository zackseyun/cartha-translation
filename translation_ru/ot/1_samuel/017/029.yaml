  text: 'Давид сказал: «Что я теперь сделал? Разве это не просто слово[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве это не просто дело?» Еврейское слово דָּבָר может означать «слово», «дело», «вопрос» или «обстоятельство».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная повествовательная форма глагола אמר, вводящая прямую речь; «сказал» — естественный русский эквивалент.
- source_word: דָּוִד
  choice: Давид
  rationale: Традиционная и общепринятая русская форма библейского имени.
- source_word: מֶה עָשִׂיתִי עָתָּה
  choice: Что я теперь сделал?
  rationale: Передаёт вопрос-протест Давида и сохраняет значение עָתָּה («теперь, сейчас»), не усиливая его до «на этот раз».
- source_word: הֲלוֹא
  choice: Разве… не
  rationale: Сохраняет риторический вопрос, предполагающий утвердительный ответ.
- source_word: דָּבָר
  choice: слово
  rationale: В данном контексте «слово» естественно передаёт попытку Давида представить сказанное им как нечто незначительное; многозначность еврейского слова отмечена в сноске.
- source_word: הוּא
  choice: это
  rationale: Указательное «это» естественно отсылает по-русски к только что обсуждавшимся словам или поступку Давида.
theological_decisions:
- issue: Неоднозначность выражения הֲלוֹא דָּבָר הוּא
  choice: Разве это было не просто слово?
  alternative: Разве это не просто дело?
  rationale: Контекст поддерживает значение «слово», однако еврейское דָּבָר допускает также значения «дело», «вопрос» или «обстоятельство»; альтернативу следует сохранить в сноске, не превращая её в определённое богословское или сюжетное толкование.
translation_notes:
  register: Современный литературный русский язык; прямая речь звучит как естественный вопрос-протест. Конструкция «Разве… не» сохраняет риторическую силу оригинала, а сноска — его подлинную лексическую неоднозначность.
