    rationale: В еврейском тексте после «предпринял/попытался пойти» стоит причинное «ибо не испытал», а не сообщение о неудаче. Добавление меняет степень определённости повествования.
  - severity: low
    issue: «Попытался ходить» менее точно передаёт לָלֶכֶת.
    rationale: Инфинитив означает «идти/пойти»; «ходить» придаёт действию длительно-повторный оттенок, которого текст не требует.
