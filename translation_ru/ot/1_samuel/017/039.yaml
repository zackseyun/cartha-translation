base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/039.yaml
  text: And David strapped his sword over his armor and tried to go[a], for he had not tested them. But David said to Saul, “I cannot go with these[b], for I have not tested them.” So David removed them from himself.
translation:
  language: ru
  text: 'Давид опоясался своим мечом поверх своих доспехов[b] и попытался пойти, потому что ещё не испытал их[a]. Тогда Давид сказал Саулу: «Я не могу идти в этом, потому что я этого не испытал». И Давид снял всё это с себя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «не пробовал их»; еврейский глагол может обозначать проверку посредством употребления или личного опыта.
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может шире означать одежду или облачение, но военный контекст здесь указывает на доспехи.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְגֹּר
  choice: опоясался
  rationale: Глагол חגר обозначает действие, при котором человек подпоясывается или закрепляет на себе оружие; «опоясался мечом» естественно и конкретно передаёт образ исходного текста.
- source_word: חַרְבּוֹ
  choice: мечом
  rationale: Обычное значение חֶרֶב; притяжательность в русском контексте достаточно ясно выражена действием Давида и не требует тяжеловесного «своим мечом».
- source_word: מֵעַל לְמַדָּיו
  choice: поверх своих доспехов
  rationale: לְמַדִּים может обозначать одежду или облачение, однако ближайший контекст, где Саул надевает на Давида воинское снаряжение, поддерживает перевод «доспехи».
- source_word: וַיֹּאֶל לָלֶכֶת
  choice: попытался ходить
  rationale: Сочетание יאל с инфинитивом может выражать намерение, решимость или предпринятую попытку. Здесь Давид пробует двигаться в незнакомом снаряжении, поэтому «попытался ходить» соответствует развитию повествования.
- source_word: כִּי לֹא נִסָּה
  choice: потому что ещё не испытывал их
  rationale: Пиэль глагола נסה означает «испытывать, пробовать». Добавление «ещё» естественно передаёт отсутствие предшествующего опыта, а местоимение «их» проясняет подразумеваемое снаряжение.
- source_word: לֹא אוּכַל לָלֶכֶת בָּאֵלֶּה
  choice: Я не могу ходить во всём этом
  rationale: הלך здесь относится к передвижению, а בָּאֵלֶּה — к совокупности надетого снаряжения. «Во всём этом» звучит по-русски естественно и сохраняет указательный характер выражения.
- source_word: לֹא נִסִּיתִי
  choice: потому что я этого не испытывал
  rationale: Сохранено то же основное значение נסה, что и ранее; объект, подразумеваемый в еврейском тексте, выражен местоимением ради ясности.
- source_word: וַיְסִרֵם ... מֵעָלָיו
  choice: снял всё это с себя
  rationale: Каузативная форма סור означает удалить или снять. Русское «снял всё это с себя» точно и естественно передаёт действие и совокупный объект.
