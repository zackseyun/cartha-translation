base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/011.yaml
  text: When Saul and all Israel heard these words of the Philistine[a], they were dismayed and greatly afraid.
translation:
  language: ru
  text: Когда Саул и весь Израиль услышали эти слова филистимлянина, они пали духом[a] и сильно испугались.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пришли в смятение».'
    reason: Еврейский глагол допускает оттенки сокрушённости, подавленности и смятения.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышали
  rationale: Глагол שׁמע в породе qal обычно означает «слышать»; множественное число в русском согласуется с составным подлежащим «Саул и весь Израиль».
- source_word: וְכָל יִשְׂרָאֵל
  choice: и весь Израиль
  rationale: Сохранено собирательное обозначение народа, которое в данном контексте относится к израильскому войску и его представителям.
- source_word: דִּבְרֵי הַפְּלִשְׁתִּי הָאֵלֶּה
  choice: эти слова филистимлянина
  rationale: Прямая и естественная передача словосочетания; определённый филистимлянин уже известен из контекста.
- source_word: וַיֵּחַתּוּ
  choice: пали духом
  rationale: חתת выражает состояние сокрушённости, подавленности или смятения. «Пали духом» естественно по-русски и не дублирует последующее указание на страх.
- source_word: וַיִּרְאוּ מְאֹד
  choice: сильно испугались
  rationale: Передаёт значение «очень боялись» современным и естественным русским выражением, сохраняя усиление наречием מְאֹד.
