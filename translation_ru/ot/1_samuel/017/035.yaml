  source_fidelity: 'В исходном тексте последовательно употреблены формы 1-го лица, описывающие действия Давида по отношению к хищнику: он пошёл/вышел за ним, ударил его, спас овцу из его пасти; когда хищник выступил против него, Давид схватил его за бороду, ударил и убил. Черновик верно различает «бил» и «убивал» и сохраняет буквальную «бороду», но «бросался вслед» добавляет не выраженную глаголом יצא стремительность, а «добычу» заменяет подразумеваемую овцу обобщающим словом.'
  naturalness: 'Несовершенный вид уместен: речь продолжает типичную, повторявшуюся ситуацию из предыдущего стиха. Однако «поднимался на меня» для нападающего животного звучит неестественно в современном русском; «нападал на меня» естественно передаёт враждебную силу קום על без лишней детализации.'
  terminology: «Хищник» ясно отсылает к льву или медведю из предыдущего стиха. «Пасть», «борода», «бил» и «убивал» сохраняют образность и смысловые различия оригинала. Примечание оставлено у «бороды», поскольку возможны более интерпретативные передачи применительно к животному.
