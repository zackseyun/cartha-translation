  text: I went out after it and struck it and rescued it from its mouth[a]; and when it rose up against me[b], I seized it by its beard and struck it and killed it.
translation:
  language: ru
  text: Я гнался за хищником, бил его и вырывал овцу из его пасти; а когда он нападал на меня, я хватал его за бороду[a], бил и убивал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «за его бороду»; применительно к животному иногда переводят по смыслу: «за гриву» или «за челюсть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָאתִי אַחֲרָיו
  choice: Я бросался вслед за зверем
  rationale: 'Буквально: «я выходил вслед за ним». В контексте погони современное «бросался вслед» естественно передаёт решительное преследование; слово «зверь» ясно обозначает хищника из предыдущего стиха и избегает неясного местоимения.'
- source_word: וְהִכִּתִיו
  choice: бил его
  rationale: נכה обозначает нанесение удара. Перевод не приписывает первому удару смертельного исхода, поскольку далее убийство названо отдельно.
- source_word: וְהִצַּלְתִּי מִפִּיו
  choice: вырывал добычу из его пасти
  rationale: Нצל в породе Hiphil значит «спасать, избавлять», а מִפִּיו — «из его рта/пасти». «Вырывал добычу» естественно передаёт спасение унесённой овцы; существительное «добычу» восстанавливает понятный из контекста объект, не сужая его до ягнёнка.
- source_word: וַיָּקָם עָלַי
  choice: когда он поднимался на меня
  rationale: Сочетание קום על выражает враждебное выступление против кого-либо. Формулировка сохраняет образ исходного текста и его временную связь с последующим действием.
- source_word: וְהֶחֱזַקְתִּי בִּזְקָנוֹ
  choice: я хватал его за бороду
  rationale: Hiphil חזק здесь означает крепко схватить, а זקן буквально значит «борода». Не заменяем яркий образ более толковательными «гривой» или «челюстью».
- source_word: וַהֲמִיתִּיו
  choice: убивал
  rationale: Hiphil מות прямо обозначает причинение смерти. Русский несовершенный вид согласуется с описанием повторявшихся случаев после условного «когда» предыдущего стиха.
