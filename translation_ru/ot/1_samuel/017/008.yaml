base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/008.yaml
  text: He stood and called out to the battle lines of Israel and said to them[a], “Why do you come out to array yourselves for battle? Am I not the Philistine, and are you not servants of Saul? Choose a man for yourselves[b], and let him come down to me.”
translation:
  language: ru
  text: 'Он встал, обратился громким голосом к боевым рядам Израиля и сказал им: «Зачем вы выходите, чтобы выстроиться к бою? Разве я не филистимлянин, а вы не рабы[a] Саула? Выберите себе человека, и пусть он спустится ко мне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуги». Еврейское слово может обозначать как слуг, так и рабов; здесь «рабы» передаёт оскорбительный тон вызова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Он встал
  rationale: Передаёт обычное повествовательное значение עמד и одновременно сохраняет картину противостояния.
- source_word: וַיִּקְרָא אֶל
  choice: обратился громким голосом к
  rationale: קרא здесь обозначает громкое публичное обращение через расстояние; такая формулировка естественна по-русски и передаёт слышимый вызов.
- source_word: מַעַרְכוֹת יִשְׂרָאֵל
  choice: боевым рядам Израиля
  rationale: Множественное מַעַרְכוֹת указывает на построенные воинские ряды, а не просто на народ или войско вообще.
- source_word: לָמָּה תֵצְאוּ לַעֲרֹךְ מִלְחָמָה
  choice: Зачем вы выходите, чтобы выстроиться к бою?
  rationale: Сохраняются вопросительный вызов, значение выхода навстречу противнику и образ построения для сражения.
- source_word: הֲלוֹא אָנֹכִי הַפְּלִשְׁתִּי
  choice: Разве я не филистимлянин
  rationale: הֲלוֹא вводит риторический вопрос, ожидающий согласия. Русский язык не выражает определённый артикль напрямую; контекст показывает, что говорящий выступает представителем филистимлян.
- source_word: עֲבָדִים לְשָׁאוּל
  choice: рабы Саула
  rationale: עֲבָדִים допускает значения «слуги» и «рабы»; в насмешливом вызове Голиафа слово «рабы» яснее передаёт унизительную силу его слов.
- source_word: בְּרוּ לָכֶם אִישׁ
  choice: Выберите себе человека
  rationale: Сохраняет повеление, возвратную заинтересованность לָכֶם и мужской единственный референт אִישׁ в контексте единоборства.
- source_word: וְיֵרֵד אֵלָי
  choice: и пусть он спустится ко мне
  rationale: Конструкция после повеления имеет побудительное значение, а ירד прямо выражает движение вниз.
theological_decisions:
- issue: Степень несвободы, выраженная словом עֲבָדִים
  choice: рабы Саула
  alternative: слуги Саула
  rationale: Оба значения лексически возможны, поэтому альтернатива отмечена в сноске. В основном тексте выбрано «рабы», поскольку Голиаф намеренно унижает израильтян, представляя их подневольными людьми Саула; это не вводит отдельного учения об их правовом статусе.
- issue: Мужской референт אִישׁ
  choice: человека
  alternative: воина
  rationale: Русское «человека» в данном контексте естественно обозначает мужчину, которого призывают выйти на единоборство, и не добавляет отсутствующего в исходном слове профессионального обозначения «воин».
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Военная образность исходного текста сохранена без архаизмов; прямая речь звучит как публичный насмешливый вызов.
