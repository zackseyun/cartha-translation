translation:
  language: ru
  text: Сыны Израиля вернулись после преследования филистимлян и разграбили их лагеря.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их станы».'
    reason: Древнееврейское מַחֲנֵיהֶם стоит во множественном числе и обозначает военные лагеря; «станы» — возможный, но более архаичный русский вариант.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: вернулись
  rationale: Обычное значение глагола שוב — «возвращаться»; форма естественно передаёт возвращение после погони.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Сыны Израиля
  rationale: Формально передаёт древнееврейское выражение и сохраняет его представительный мужской род; в современном русском остаётся понятным в библейском повествовании.
- source_word: מִדְּלֹק אַחֲרֵי
  choice: перестав преследовать
  rationale: Предлог מִן при שוב отмечает прекращение действия, а דלק אחרי означает настойчиво гнаться или преследовать; такая передача естественна по-русски.
- source_word: פְלִשְׁתִּים
  choice: филистимлян
  rationale: Устоявшееся русское название этого народа; падеж обусловлен глаголом «преследовать».
- source_word: וַיָּשֹׁסּוּ
  choice: и разграбили
  rationale: Глагол שסס обозначает разграбление или захват добычи после военного поражения.
- source_word: מַחֲנֵיהֶם
  choice: их станы
  rationale: Масоретский текст имеет форму множественного числа с местоименным суффиксом — «их станы/лагеря». «Станы» сохраняет военный контекст и морфологическое число.
