translation:
  language: ru
  text: Давид был младшим[a], а трое старших пошли вслед за Саулом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «И Давид был младшим, и трое старших пошли вслед за Саулом». Еврейские союзы можно передать простым «и», без выраженного сопоставления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/דָוִד
  choice: Давид
  rationale: Начальный союз ו связывает фразу с контекстом, но в современном русском повествовании его можно не выражать отдельным словом без потери смысла.
- source_word: הוּא
  choice: был
  rationale: Самостоятельное местоимение придаёт подлежащему некоторое выделение, однако по-русски естественная именная конструкция в прошедшем времени не требует отдельного «он».
- source_word: הַ/קָּטָן
  choice: младшим
  rationale: Буквально слово обозначает «малого/младшего», а в контексте сопоставления братьев естественно означает младшего по возрасту.
- source_word: וּ/שְׁלֹשָׁה הַ/גְּדֹלִים
  choice: а трое старших
  rationale: В семейном контексте הַגְּדֹלִים — старшие братья. Союз «а» естественно передаёт сопоставление Давида с тремя старшими, не превращая его в резкое противопоставление.
- source_word: הָלְכוּ אַחֲרֵי
  choice: пошли вслед за
  rationale: Передано близко к буквальному «пошли за», сохраняя возможный оттенок как физического следования, так и присоединения к Саулу.
- source_word: שָׁאוּל
  choice: Саулом
  rationale: Использована традиционная русская форма библейского имени с падежным оформлением после предлога.
