  text: Саул, они и все израильтяне находились в долине Элы и сражались с филистимлянами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против филистимлян». Еврейский предлог буквально означает «с», но в контексте сражения указывает на противостояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁאוּל
  choice: Саул
  rationale: Имя передано принятой русской библейской формой; начальный союз не выражен отдельно, поскольку связь с предшествующим повествованием естественно определяется контекстом.
- source_word: וְ/הֵמָּה
  choice: они
  rationale: Самостоятельное местоимение сохранено, хотя по-русски конструкция несколько необычна; оно отсылает к ранее упомянутым лицам.
- source_word: וְ/כָל אִישׁ יִשְׂרָאֵל
  choice: и все израильтяне
  rationale: Так естественно передаётся собирательное значение выражения «весь муж Израиля» без тяжеловесного буквального оборота «все мужчины Израиля».
- source_word: בְּ/עֵמֶק הָאֵלָה
  choice: в долине Эла
  rationale: עֵמֶק означает «долина», а Эла — традиционно транслитерируемое географическое название.
- source_word: נִלְחָמִים
  choice: сражались
  rationale: Причастная форма обозначает продолжавшееся действие; русское прошедшее несовершенного вида передаёт его длительность.
- source_word: עִם פְּלִשְׁתִּים
  choice: с филистимлянами
  rationale: Предлог עִם буквально означает «с»; при глаголе «сражаться» русская конструкция естественно обозначает противостояние и одновременно сохраняет форму исходного выражения.
