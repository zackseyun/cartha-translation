  text: וַ/יָּקֻ֣מוּ אַנְשֵׁי֩ יִשְׂרָאֵ֨ל וִ/יהוּדָ֜ה וַ/יָּרִ֗עוּ וַֽ/יִּרְדְּפוּ֙ אֶת הַ/פְּלִשְׁתִּ֔ים עַד בּוֹאֲ/ךָ֣ גַ֔יְא וְ/עַ֖ד שַׁעֲרֵ֣י עֶקְר֑וֹן וַֽ/יִּפְּל֞וּ חַֽלְלֵ֤י פְלִשְׁתִּים֙ בְּ/דֶ֣רֶךְ שַׁעֲרַ֔יִם וְ/עַד גַּ֖ת וְ/עַד עֶקְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/052.yaml
  text: Then the men of Israel and Judah rose up and shouted[a], and they pursued the Philistines as far as Gai and as far as the gates of Ekron. The slain Philistines fell along the road to Shaaraim[b], as far as Gath and as far as Ekron.
translation:
  language: ru
  text: Тогда воины Израиля и Иуды поднялись, издали боевой клич[a] и погнались за филистимлянами до входа в долину[b] и до ворот Екрона. Сражённые филистимляне пали по дороге в Шаараим, вплоть до Гата и Екрона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «громко закричали».'
    reason: lexical_alternative
  - marker: b
    text: Еврейская фраза буквально близка к «до твоего прихода в долину», но её синтаксис и текст не вполне ясны. Возможно также понимание «до Гая», если последнее слово считать названием места.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: поднялись
  rationale: Форма повествовательной последовательности от קום передаёт быстрое вступление воинов в действие после падения Голиафа; «поднялись» естественно и не архаично.
- source_word: אַנְשֵׁי יִשְׂרָאֵל וִיהוּדָה
  choice: воины Израиля и Иуды
  rationale: Буквально — «мужчины/люди Израиля и Иуды»; военный контекст позволяет естественно уточнить их как воинов, не меняя референта.
- source_word: וַיָּרִעוּ
  choice: издали боевой клич
  rationale: רוע обозначает здесь громкий крик в бою; выбранный оборот сохраняет военную окраску, а более общее значение отмечено в сноске.
- source_word: וַיִּרְדְּפוּ
  choice: погнались за
  rationale: רדף в военном контексте означает преследование бегущего противника; этот русский оборот передаёт энергичное действие естественнее, чем более книжное «преследовали».
- source_word: עַד בּוֹאֲךָ גַיְא
  choice: до входа в долину
  rationale: Трудная конструкция с формой «твоего прихода» понята идиоматически как указание на подход или вход в долину; неоднозначность и возможность видеть здесь топоним сохранены в сноске.
- source_word: וְעַד שַׁעֲרֵי עֶקְרוֹן
  choice: и до ворот Екрона
  rationale: Буквально сохраняет пространственный предел погони и городской образ ворот.
- source_word: וַיִּפְּלוּ חַלְלֵי פְלִשְׁתִּים
  choice: Убитые филистимляне падали
  rationale: חַלְלֵי обозначает сражённых или убитых, а не просто раненых; «падали» сохраняет глагол נפל и динамику повествования.
- source_word: בְּדֶרֶךְ שַׁעֲרַיִם
  choice: по дороге в Шаараим
  rationale: בדרך с названием места естественно обозначает дорогу, ведущую к нему.
- source_word: וְעַד גַּת וְעַד עֶקְרוֹן
  choice: вплоть до Гата и Екрона
  rationale: «Вплоть до» передаёт протяжённость потерь; оба предела названы без искусственного сглаживания географической формулировки.
