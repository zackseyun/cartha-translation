base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/055.yaml
  text: When Saul saw David going out to meet the Philistine[a], he said to Abner, the commander of the army, “Whose son is this young man, Abner?” And Abner said, “As your soul lives, O king, I do not know.”
translation:
  language: ru
  text: 'Когда Саул увидел, что Давид выходит навстречу филистимлянину, он спросил Авенира, военачальника войска: «Авенир, чей сын этот юноша?» Авенир ответил: «Жизнью твоей клянусь, царь, я не знаю».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально еврейская клятвенная формула звучит: «Жива твоя душа, царь, если я знаю». По смыслу: «Жизнью твоей клянусь, царь, я не знаю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִ/רְאוֹת
  choice: Когда Саул увидел
  rationale: Сочетание союза с инфинитивом вводит придаточное времени; такая передача естественна по-русски и сохраняет последовательность повествования.
- source_word: יֹצֵא לִ/קְרַאת
  choice: выходит навстречу
  rationale: Причастие передаёт наблюдаемое разворачивающееся действие, а לִקְרַאת — движение навстречу противнику; перевод не добавляет отсутствующего в еврейском тексте значения «вступить в бой».
- source_word: הַ/פְּלִשְׁתִּי
  choice: филистимлянину
  rationale: В оригинале употреблено только определённое обозначение по этнической принадлежности; слово «богатырь» или «воин» не добавляется.
- source_word: שַׂר הַ/צָּבָא
  choice: военачальника
  rationale: Современное литературное обозначение начальника войска, точно и сжато передающее официальный военный титул.
- source_word: בֶּן מִי זֶה הַ/נַּעַר
  choice: чей сын этот юноша?
  rationale: Сохраняется явный вопрос о происхождении по отцу; נַעַר здесь естественно передать словом «юноша», поскольку Давид молод, но выступает как участник боя.
- source_word: חֵי נַפְשְׁ/ךָ
  choice: Жизнью твоей клянусь
  rationale: Еврейская формула буквально апеллирует к жизни адресата. Русская клятвенная формула сохраняет образ и ясно выражает функцию высказывания.
- source_word: אִם יָדָעְתִּי
  choice: не знаю
  rationale: В составе клятвы אִם вводит эллиптическое отрицательное заверение; буквальное «если я знаю» по-русски исказило бы или затемнило смысл.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Имя אַבְנֵר передано в традиционной русской библейской форме «Авенир». Клятвенная формула сохранена в тексте в понятном русском виде, а её буквальное устройство пояснено в сноске.
