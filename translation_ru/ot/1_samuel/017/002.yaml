  text: וְ/שָׁא֤וּל וְ/אִֽישׁ יִשְׂרָאֵל֙ נֶאֶסְפ֔וּ וַֽ/יַּחֲנ֖וּ בְּ/עֵ֣מֶק הָאֵלָ֑ה וַ/יַּעַרְכ֥וּ מִלְחָמָ֖ה לִ/קְרַ֥את פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/002.yaml
  text: And Saul and the men of Israel gathered together and camped in the Valley of Elah[a], and they drew up for battle against the Philistines.
translation:
  language: ru
  text: А Саул и израильтяне собрались и расположились станом в долине Эла. Они выстроились для битвы с филистимлянами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «навстречу филистимлянам»; возможно также: «лицом к филистимлянам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאוּל
  choice: А Саул
  rationale: Союз связывает стих с предшествующим повествованием; русское «А» естественно передаёт переход к Саулу и его войску без излишнего смыслового уточнения.
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: и израильтяне
  rationale: Единственное число אִישׁ имеет собирательное значение. В данном военном контексте «израильтяне» естественно обозначает собравшихся мужчин Израиля, не добавляя отсутствующего в тексте слова «войско».
- source_word: נֶאֶסְפוּ
  choice: собрались
  rationale: Форма нифаль здесь естественно выражает совместное собирание; возвратное русское «собрались» точно и ясно передаёт смысл.
- source_word: וַיַּחֲנוּ
  choice: расположились станом
  rationale: Глагол означает разбить или устроить лагерь. «Расположились станом» сохраняет военный колорит и остаётся понятным в современном литературном русском.
- source_word: בְּעֵמֶק הָאֵלָה
  choice: в долине Эла
  rationale: עֵמֶק означает «долина», а הָאֵלָה в контексте выступает как географическое название, переданное транслитерацией «Эла».
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: Они выстроились для битвы
  rationale: Идиома обозначает построение войска в боевой порядок. Этот вариант передаёт конкретный военный образ естественнее, чем буквальное «расположили битву».
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: с филистимлянами
  rationale: В сочетании «для битвы с филистимлянами» ясно выражена противительная военная направленность, тогда как возможные пространственные оттенки исходного выражения отмечены в сноске.
