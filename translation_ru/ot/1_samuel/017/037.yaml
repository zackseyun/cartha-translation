- from: 'Давид сказал: «Яхве, избавивший меня от лапы льва и от лапы медведя, избавит меня и от руки этого филистимлянина». Тогда Саул сказал Давиду: «Иди, и да будет Яхве с тобой»[a].'
  to: 'Давид сказал: «Яхве, избавивший меня от лапы льва и от лапы медведя, Он избавит меня от руки этого филистимлянина». Тогда Саул сказал Давиду: «Иди, и да будет Яхве с тобой»[a].'
  rationale: 'Внесена минимальная правка: «Он избавит» прямо передаёт эмфатическое הוּא и не вводит отсутствующую в оригинале частицу «и». Сноска сохранена, поскольку корректно фиксирует реальную синтаксико-прагматическую неоднозначность формы יִהְיֶה в заключительном напутствии.'
