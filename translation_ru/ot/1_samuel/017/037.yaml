  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָ֗ה אֲשֶׁ֨ר הִצִּלַ֜/נִי מִ/יַּ֤ד הָֽ/אֲרִי֙ וּ/מִ/יַּ֣ד הַ/דֹּ֔ב ה֣וּא יַצִּילֵ֔/נִי מִ/יַּ֥ד הַ/פְּלִשְׁתִּ֖י הַ/זֶּ֑ה וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל דָּוִד֙ לֵ֔ךְ וַֽ/יהוָ֖ה יִהְיֶ֥ה עִמָּֽ/ךְס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/037.yaml
  text: David said[a], “Yahweh, who delivered me from the paw of the lion and from the paw of the bear, he will deliver me from the hand of this Philistine.” Then Saul said to David, “Go, and may Yahweh be with you.”
translation:
  language: ru
  text: 'Давид сказал: «Яхве, избавивший меня от лапы льва и от лапы медведя, Он избавит меня от руки этого филистимлянина». Тогда Саул сказал Давиду: «Иди, и да будет Яхве с тобой»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и Яхве будет с тобой». Еврейские слова можно понять и как благословение или пожелание, и как простое утверждение о будущем.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: הִצִּלַנִי / יַצִּילֵנִי
  choice: избавивший меня / избавит меня
  rationale: Глагол נצל в породе хифиль обозначает избавление от опасности; повтор одного русского корня сохраняет связь между прежним опытом Давида и его уверенностью в будущем избавлении.
- source_word: מִיַּד
  choice: от лапы / от руки
  rationale: Буквально употреблено «из руки». Применительно ко льву и медведю естественный русский образ — «от лапы», а применительно к филистимлянину сохранено «от руки».
- source_word: הָאֲרִי / הַדֹּב
  choice: льва / медведя
  rationale: Прямые современные соответствия названиям животных; определённость в русском языке выражается контекстом.
- source_word: הוּא
  choice: избавит меня и
  rationale: Самостоятельное местоимение подчёркивает, что тот же Яхве избавит Давида снова. В русском эта эмфаза естественно передана частицей «и» при сказуемом, без тяжеловесного повтора «Он» после причастного оборота.
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: этого филистимлянина
  rationale: Сохраняет указательное и несколько заострённое обозначение конкретного противника.
- source_word: לֵךְ
  choice: Иди
  rationale: Краткий прямой императив, соответствующий лаконичной речи Саула.
- source_word: יִהְיֶה עִמָּךְ
  choice: да будет с тобой
  rationale: В данном контексте несовершенный вид глагола естественно воспринимается как благословение или пожелание; русский оборот «да будет» сохраняет торжественный, но понятный регистр.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл заключительных слов Саула
  choice: «да будет Яхве с тобой» как благословение или пожелание
  alternative: «Яхве будет с тобой» как простое утверждение о будущем
  rationale: Еврейская форма допускает оба оттенка. Контекст напутствия поддерживает пожелание, однако альтернативное прочтение не исключено и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным повествовательным тоном. Синтаксический повтор «от лапы… от лапы… от руки» сохраняет ритм и образность еврейского текста; заключительное «да будет» уместно для краткого напутствия и остаётся понятным современному читателю.
