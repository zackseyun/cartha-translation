  text: And when the Philistine rose and came and drew near to meet David[a], David hurried and ran toward the battle line to meet the Philistine.
translation:
  language: ru
  text: Когда филистимлянин поднялся, пошёл и приблизился к Давиду, Давид поспешил и побежал к боевому строю[a] навстречу филистимлянину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к боевым рядам». Еврейское существительное может обозначать боевой строй или выстроенные для битвы ряды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Когда
  rationale: Повествовательная формула вводит следующее событие; «когда» естественно передаёт её временное значение в современном русском языке.
- source_word: קָם
  choice: поднялся
  rationale: Глагол обозначает вставание или поднятие и здесь передаёт начало движения филистимлянина.
- source_word: הַפְּלִשְׁתִּי
  choice: филистимлянин
  rationale: В еврейском тексте буквально сказано «филистимлянин»; слово «единоборец» было бы добавлением из ближайшего контекста.
- source_word: וַיֵּלֶךְ
  choice: двинулся вперёд
  rationale: Основное значение — «пошёл»; в данном военном контексте эта формулировка естественно передаёт направленное движение к Давиду, не подменяя последующий глагол приближения.
- source_word: וַיִּקְרַב
  choice: стал приближаться
  rationale: Передаёт последовательное движение филистимлянина к Давиду и позволяет сохранить отдельность от предшествующего «двинулся».
- source_word: לִקְרַאת
  choice: к / навстречу
  rationale: Оборот обозначает движение к встрече или столкновению. В первом случае по-русски естественно «к Давиду», во втором — «навстречу филистимлянину».
- source_word: וַיְמַהֵר
  choice: поспешил
  rationale: Глагол означает быстрое, без промедления совершённое действие; «поспешил» соответствует современному литературному повествованию.
- source_word: וַיָּרָץ
  choice: побежал
  rationale: Прямо передаёт значение глагола «бежать» и последовательность совершенных действий.
- source_word: הַמַּעֲרָכָה
  choice: к боевому строю
  rationale: Существительное может обозначать боевой строй, боевую линию или выстроенные для битвы ряды. «Боевой строй» сохраняет военное значение и естественно звучит по-русски.
