  text: אִם יוּכַ֞ל לְ/הִלָּחֵ֤ם אִתִּ/י֙ וְ/הִכָּ֔/נִי וְ/הָיִ֥ינוּ לָ/כֶ֖ם לַ/עֲבָדִ֑ים וְ/אִם אֲנִ֤י אֽוּכַל ל/וֹ֙ וְ/הִכִּיתִ֔י/ו וִ/הְיִ֤יתֶם לָ֨/נוּ֙ לַ/עֲבָדִ֔ים וַ/עֲבַדְתֶּ֖ם אֹתָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/009.yaml
  text: If he is able to fight with me and strike me down[a], then we will be your servants. But if I prevail against him and strike him down[c][b], then you will be our servants and serve us.
translation:
  language: ru
  text: Если он сможет сразиться со мной и поразит меня[a], то мы станем вашими рабами[b]. Если же я одолею его[c] и поражу его[a], то вы станете нашими рабами[b] и будете служить нам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол נכה можно также перевести как «сразит», «убьёт» или «победит». «Поразит» сохраняет решительный характер действия, не устраняя присущую слову широту значения.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слугами». Здесь слово עֲבָדִים передаёт подневольное положение народа после военного поражения, поэтому в основном тексте стоит «рабами».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквальнее: «если я смогу против него». В контексте единоборства глагол יכל с предлогом ל означает способность взять верх над противником.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּכַל לְהִלָּחֵם אִתִּי
  choice: сможет сразиться со мной
  rationale: Глагол יכל выражает способность, а נלחם с אֵת — взаимное участие в бою; перевод сохраняет условный характер вызова и смысл единоборства.
- source_word: וְהִכָּנִי / וְהִכִּיתִיו
  choice: и поразит меня / и поражу его
  rationale: נכה может обозначать нанесение удара, поражение или убийство. «Поразить» передаёт решительный исход схватки, не уточняя сверх еврейского текста, обязательно ли речь именно об убийстве.
- source_word: לַעֲבָדִים
  choice: рабами
  rationale: עֲבָדִים в данном контексте означает подневольное положение побеждённого народа, а не просто добровольную службу; «рабами» ясно передаёт характер подчинения.
- source_word: אֲנִי אוּכַל לוֹ
  choice: я одолею его
  rationale: Сочетание יכל с ל в боевом контексте означает оказаться сильнее противника, взять над ним верх; буквальное «смогу против него» по-русски неестественно.
- source_word: וַעֲבַדְתֶּם אֹתָנוּ
  choice: и будете служить нам
  rationale: Глагол עבד здесь обозначает службу победителю и естественно дополняет указание на подневольный статус.
