lexical_decisions:
- source_word: מִצְחַת
  choice: поножи
  rationale: Существительное обозначает защитные доспехи для нижней части ног; «поножи» — точный и уместный для древнего воинского снаряжения русский термин.
- source_word: נְחֹשֶׁת
  choice: бронзовый
  rationale: В контексте древнего вооружения слово, вероятнее всего, обозначает бронзу — сплав, применявшийся для оружия и доспехов.
- source_word: עַל רַגְלָיו
  choice: на ногах у него
  rationale: В сочетании с поножами речь идёт о нижней части ног, а не только о ступнях; формулировка естественна по-русски и сохраняет конструкцию исходного текста.
- source_word: כִידוֹן
  choice: дротик
  rationale: Термин может обозначать более лёгкое копьё, вероятно метательное; «дротик» позволяет отличить его от большого копья, упомянутого далее в повествовании.
- source_word: בֵּין כְּתֵפָיו
  choice: между плечами
  rationale: Буквально передаёт пространственный образ еврейского текста, не добавляя прямо не выраженного значения «был перекинут» или «за спиной».
