    text: 'Буквально: «лев и медведь»; вероятно, смысл распределительный: приходил либо один, либо другой хищник.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может означать овцу, ягнёнка или вообще одно животное из мелкого скота.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה הָיָה
  choice: пас
  rationale: Причастие с הָיָה описывает продолжительное занятие Давида. Русское «пас» естественно передаёт его роль пастуха в данном контексте.
- source_word: עַבְדְּךָ
  choice: раб твой
  rationale: Это принятая почтительная форма самоназвания при обращении к царю; она сохраняет библейскую торжественность, не выдвигая на первый план юридический статус раба.
- source_word: לְאָבִיו בַּצֹּאן
  choice: овец своего отца
  rationale: Так естественно по-русски передаётся смысл служения отцу при его стаде без тяжеловесного буквального оборота «был пастухом у своего отца среди стада».
- source_word: וּבָא
  choice: когда приходил
  rationale: Форма в контексте воспоминания может описывать повторявшуюся ситуацию; несовершенный вид «приходил» сохраняет это значение. «Когда» естественно связывает условную ситуацию с последующим рассказом.
- source_word: הָאֲרִי וְאֶת הַדּוֹב
  choice: лев или медведь
  rationale: 'Хотя в еврейском стоит союз «и», единственное число сказуемого и контекст позволяют понимать пару распределительно: приходил тот или другой хищник.'
- source_word: וְנָשָׂא
  choice: уносил
  rationale: Глагол означает взятие и унесение добычи; «уносил» кратко и точно передаёт действие хищника.
- source_word: שֶׂה
  choice: овцу
  rationale: Слово может обозначать отдельное животное из мелкого скота и не обязательно именно молодого ягнёнка; «овцу» сохраняет более широкий смысл.
- source_word: מֵהָעֵדֶר
  choice: из стада
  rationale: Обычное русское обозначение группы пасущихся овец в данном контексте.
