  text: David said to Saul[a], “Your servant was tending his father’s sheep[b], and when a lion or a bear would come and carry off a lamb from the flock,”
translation:
  language: ru
  text: 'Давид сказал Саулу: «Слуга твой пас овец своего отца. Когда приходил лев или медведь[a] и уносил овцу[b] из стада,'
