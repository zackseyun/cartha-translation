  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/פְּלִשְׁתִּ֔י אַתָּה֙ בָּ֣א אֵלַ֔/י בְּ/חֶ֖רֶב וּ/בַ/חֲנִ֣ית וּ/בְ/כִיד֑וֹן וְ/אָנֹכִ֣י בָֽא אֵלֶ֗י/ךָ בְּ/שֵׁם֙ יְהוָ֣ה צְבָא֔וֹת אֱלֹהֵ֛י מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר חֵרַֽפְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/045.yaml
  text: Then David said to the Philistine[a], “You come to me with a sword, with a spear, and with a javelin, but I come to you in the name of Yahweh of Armies, the God of the armies of Israel[c][b], whom you have defied.”
translation:
  language: ru
  text: 'Тогда Давид сказал филистимлянину: «Ты идёшь на меня с мечом, копьём и дротиком, а я иду на тебя во имя Яхве Воинств[a], Бога боевых рядов Израиля[b], которому ты бросил вызов[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве армий»; традиционно: «Господь Саваоф».'
    reason: Лексическая альтернатива для צְבָאוֹת и традиционная форма титула.
  - marker: b
    text: 'Или: «Бога войск Израиля» или «Бога боевых порядков Израиля».'
    reason: מַעַרְכוֹת может обозначать выстроенные войска, боевые ряды или боевые порядки.
  - marker: c
    text: 'Или: «которого ты поносил». Древнееврейский глагол передаёт презрительное оскорбление, соединённое здесь с дерзким вызовом.'
    reason: Сохраняет смысловой диапазон חרף.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда Давид сказал
  rationale: Последовательная форма продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: הַפְּלִשְׁתִּי
  choice: филистимлянину
  rationale: Существительное прямо обозначает Голиафа по его народности; добавлять слово «воин» здесь не требуется.
- source_word: בָּא אֵלַי / בָא אֵלֶיךָ
  choice: идёшь на меня / иду на тебя
  rationale: Причастная форма выражает происходящее или непосредственно предстоящее действие; в русском контексте противоборства конструкция «идти на» звучит естественно.
- source_word: בְּחֶרֶב וּבַחֲנִית וּבְכִידוֹן
  choice: с мечом, копьём и дротиком
  rationale: Предлог ב обозначает орудие; «дротик» отличает более лёгкое метательное оружие כידון от копья חנית.
- source_word: בְּשֵׁם
  choice: во имя
  rationale: Сохраняет библейскую формулу, включающую представительство и действие властью названного лица.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Традиционно понятное и литературное русское соответствие множественного צבאות; сохраняет широту значения «воинства, армии», не ограничивая его только земными войсками.
- source_word: אֱלֹהֵי מַעַרְכוֹת יִשְׂרָאֵל
  choice: Бога боевых рядов Израиля
  rationale: מַעַרְכוֹת обозначает выстроенные для битвы ряды или боевые порядки; перевод сохраняет образ непосредственной сцены сражения.
- source_word: אֲשֶׁר חֵרַפְתָּ
  choice: которому ты бросил вызов
  rationale: חרף включает поношение и дерзкое противостояние; в данном контексте вызов обращён не просто к израильским воинам, а к их Богу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя; его передача сохраняет различие между именем и титулом.
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Яхве армий; Господь Саваоф
  rationale: «Воинств» сохраняет военный образ и смысловую широту древнееврейского множественного числа, оставаясь естественным возвышенным русским титулом.
- issue: Объект глагола חרף
  choice: которому ты бросил вызов
  alternative: рядам которого ты бросил вызов; которого ты поносил
  rationale: Грамматически относительное местоимение допускает соотнесение с ближайшим выражением, но широкий контекст стихов 26 и 36 показывает, что оскорбление Израиля является вызовом живому Богу. Формулировка сохраняет это богословское напряжение без добавочного пояснения в основном тексте.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Параллелизм «ты идёшь… а я иду» сохранён; перечисление оружия сделано естественным для русского синтаксиса.
