base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/050.yaml
  text: So David prevailed over the Philistine with a sling and with a stone; he struck the Philistine and killed him[a], though there was no sword in David’s hand.
translation:
  language: ru
  text: 'Так Давид одолел филистимлянина пращой и камнем: он поразил филистимлянина и убил его, хотя меча в руке у Давида не было[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и меча в руке у Давида не было». Еврейский союз можно формально передать простым «и»; в основном тексте употреблено «хотя», чтобы выразить его уступительный смысл в данном контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק דָּוִד מִן הַפְּלִשְׁתִּי
  choice: Давид одолел филистимлянина
  rationale: Сочетание חזק с מִן означает, что Давид оказался сильнее противника и одержал над ним верх; «одолел» естественно передаёт это в контексте единоборства.
- source_word: בַּקֶּלַע וּבָאֶבֶן
  choice: пращой и камнем
  rationale: 'Предлог בְּ обозначает орудие действия. Сохранено единственное число «камнем»: Давид использовал один камень.'
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי
  choice: он поразил филистимлянина
  rationale: Глагол נכה означает нанесение удара; «поразил» сохраняет силу выражения и соответствует достоинству повествовательного стиля.
- source_word: וַיְמִיתֵהוּ
  choice: и убил его
  rationale: Порода хифиль глагола מות здесь прямо означает «умертвить, убить».
- source_word: וְחֶרֶב אֵין בְּיַד דָּוִד
  choice: хотя меча в руке у Давида не было
  rationale: 'Союз וְ формально может быть простым соединительным «и», но в данном контексте вводит сопутствующее обстоятельство с уступительным оттенком: победа была одержана без меча. Образ руки сохранён.'
