  text: הַ/יּ֣וֹם הַ/זֶּ֡ה יְסַגֶּרְ/ךָ֩ יְהוָ֨ה בְּ/יָדִ֜/י וְ/הִכִּיתִ֗/ךָ וַ/הֲסִרֹתִ֤י אֶת רֹֽאשְׁ/ךָ֙ מֵ/עָלֶ֔י/ךָ וְ/נָ֨תַתִּ֜י פֶּ֣גֶר מַחֲנֵ֤ה פְלִשְׁתִּים֙ הַ/יּ֣וֹם הַ/זֶּ֔ה לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/חַיַּ֣ת הָ/אָ֑רֶץ וְ/יֵֽדְעוּ֙ כָּל הָ/אָ֔רֶץ כִּ֛י יֵ֥שׁ אֱלֹהִ֖ים לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/046.yaml
  text: This day Yahweh will deliver you into my hand[a], and I will strike you down and remove your head from you. And this day I will give the corpses of the Philistine camp to the birds of the sky and to the wild animals of the earth, so that all the earth may know that there is a God for Israel.
translation:
  language: ru
  text: 'Сегодня Яхве отдаст тебя в мои руки: я поражу тебя и сниму с тебя голову. Сегодня же я отдам трупы филистимского войска птицам небесным и диким зверям на земле, чтобы вся земля узнала, что у Израиля есть Бог[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Израиле есть Бог». Буквально еврейский текст допускает передачу «у Израиля» или «для Израиля», выражая принадлежность, особое отношение или заступничество.'
    reason: Сохранение смысловой неоднозначности предлога לְ в выражении לְיִשְׂרָאֵל.
lexical_decisions:
- source_word: יְסַגֶּרְךָ יְהוָה בְּיָדִי
  choice: Яхве отдаст тебя в мои руки
  rationale: Глагол סגר в хифиле здесь означает передачу противника во власть другого. Русское выражение «отдать в руки» естественно передаёт эту военную идиому; множественное «руки» требуется русским узусом, хотя в еврейском стоит единственное число.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: וְהִכִּיתִךָ
  choice: я поражу тебя
  rationale: נכה допускает значения «ударить», «поразить» и в контексте «убить». «Поражу» сохраняет глагольный образ и не уточняет способ сверх исходного текста.
- source_word: וַהֲסִרֹתִי אֶת־רֹאשְׁךָ מֵעָלֶיךָ
  choice: и сниму с тебя голову
  rationale: Исходный текст использует סור, «удалить, снять», а не более прямой глагол «отсечь». Русская формулировка сохраняет этот образ и ясно передаёт смысл в контексте поединка.
- source_word: פֶּגֶר מַחֲנֵה פְלִשְׁתִּים
  choice: трупы филистимского войска
  rationale: Форма פֶּגֶר грамматически единственного числа имеет здесь собирательный смысл, а מַחֲנֶה обозначает не только лагерь, но и расположившееся войско. Множественное «трупы» делает подразумеваемое значение ясным по-русски.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: птицам небесным
  rationale: Сохранён устойчивый еврейский образ; формулировка понятна и стилистически соответствует возвышенной речи.
- source_word: וּלְחַיַּת הָאָרֶץ
  choice: диким зверям
  rationale: В данном сочетании חַיָּה обозначает диких наземных животных. Слово «земным» опущено как избыточное в современном русском при сохранении противопоставления небесным птицам.
- source_word: וְיֵדְעוּ כָּל־הָאָרֶץ
  choice: чтобы вся земля узнала
  rationale: Связка וְ с имперфектом в данном контексте выражает цель или ожидаемый результат. «Вся земля» сохраняет широкий риторический охват оригинала.
- source_word: כִּי יֵשׁ אֱלֹהִים לְיִשְׂרָאֵל
  choice: что у Израиля есть Бог
  rationale: Конструкция יֵשׁ ... לְ естественно выражает обладание или отношение и по-русски передаётся оборотом «у ... есть». Возможный локативный смысл отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и не вводит конфессиональной замены.
- issue: Значение לְיִשְׂרָאֵל
  choice: у Израиля есть Бог
  alternative: в Израиле есть Бог; для Израиля есть Бог
  rationale: Предлог לְ может обозначать принадлежность или отношение, а в данном обороте естественно читается как «у Израиля». Локативное понимание «в Израиле» остаётся возможным и сохранено в сноске; буквальное «для Израиля» могло бы подчёркивать благоволение или заступничество, но звучит по-русски менее естественно и несколько сужает неоднозначность.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным строем речи. Военная резкость оригинала сохранена без смягчения; устаревшие формы и чрезмерно буквальные, неестественные обороты избегаются.
