base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/032.yaml
  text: And David said to Saul[a], “Let no man's heart fail because of him[b]. Your servant will go and fight with this Philistine.”
translation:
  language: ru
  text: 'И сказал Давид Саулу: «Пусть никто не падает духом из-за него.[a] Твой слуга пойдёт и сразится с этим филистимлянином».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пусть сердце человека не падёт из-за него»; то есть пусть никто не теряет мужества из-за этого филистимлянина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד אֶל שָׁאוּל
  choice: И сказал Давид Саулу
  rationale: Последовательный вав продвигает повествование; традиционная русская конструкция сохраняет связь с предыдущим контекстом и звучит естественно в библейском повествовании.
- source_word: אַל יִפֹּל לֵב אָדָם
  choice: Пусть никто не падает духом
  rationale: Еврейская идиома буквально говорит о падении сердца. Русское «падать духом» естественно передаёт значение утраты мужества и отчасти сохраняет образ ниспадения; «никто» адекватно выражает обобщённое אָדָם.
- source_word: עָלָיו
  choice: из-за него
  rationale: Местоимение относится к филистимлянину, названному в контексте, но основной текст не уточняет референт сверх еврейского оригинала.
- source_word: עַבְדְּךָ
  choice: Твой слуга
  rationale: В обращении к царю это формула почтительного самоназвания, поэтому «слуга» контекстуально точнее, чем «раб».
- source_word: יֵלֵךְ וְנִלְחַם
  choice: пойдёт и сразится
  rationale: Имперфекты выражают решимость и намерение Давида. «Сразится» естественно обозначает личное вступление в бой.
- source_word: עִם הַפְּלִשְׁתִּי הַזֶּה
  choice: с этим филистимлянином
  rationale: Предлог עִם буквально означает «с» и в данном контексте обозначает противника в бою; русский глагол «сразиться» естественно управляет предлогом «с».
