  text: When the Philistine looked and saw David[a], he despised him, because he was a youth, ruddy and handsome in appearance.
translation:
  language: ru
  text: Филистимлянин взглянул на Давида и, увидев его, отнёсся к нему с презрением, потому что Давид был юношей, румяным[a] и красивым на вид.
