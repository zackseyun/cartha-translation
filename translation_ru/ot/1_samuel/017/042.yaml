    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: посмотрел
  rationale: Глагол נבט означает направить взгляд, посмотреть; простой русский глагол сохраняет последовательность «посмотрел и увидел» без усиления смысла.
- source_word: הַפְּלִשְׁתִּי
  choice: филистимлянин
  rationale: В еврейском тексте употреблено этническое обозначение, а не имя Голиаф и не слово «богатырь» или «единоборец».
- source_word: וַיִּרְאֶה אֶת דָּוִד
  choice: увидел Давида
  rationale: Обычное значение ראה — «видеть»; перевод сохраняет повествовательный переход от направленного взгляда к восприятию Давида.
- source_word: וַיִּבְזֵהוּ
  choice: презрел его
  rationale: בזה выражает презрение и пренебрежение; «презрел» кратко передаёт значение и сохраняет личное дополнение.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину презрения филистимлянина; причинная связь выражена прямо и естественно для современного русского языка.
- source_word: הָיָה נַעַר
  choice: тот был юношей
  rationale: נַעַר может обозначать мальчика, юношу или молодого человека; «юноша» передаёт молодость Давида, не представляя его маленьким ребёнком.
- source_word: אַדְמֹנִי
  choice: румяным
  rationale: Прилагательное указывает на красноватую окраску внешности, но само по себе не уточняет, идёт ли речь о цвете лица, кожи или волос; основной вариант звучит естественно, а лексическая неоднозначность отмечена в сноске.
- source_word: עִם יְפֵה מַרְאֶה
  choice: и красивым на вид
  rationale: Выражение описывает привлекательную внешность; этот вариант естественно передаёт יְפֵה מַרְאֶה и не добавляет отсутствующих в тексте подробностей.
