base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/026.yaml
  text: And David said to the men standing with him, “What will be done for the man who strikes down this Philistine and removes disgrace from Israel? For who is this uncircumcised Philistine, this one who has defied the battle lines of the living God?”
translation:
  language: ru
  text: 'И сказал Давид людям, стоявшим рядом с ним: «Что будет сделано тому, кто поразит этого филистимлянина и снимет позор с Израиля? Ведь кто такой этот необрезанный филистимлянин, что он посмел бросить вызов боевым рядам живого Бога?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַכֶּה
  choice: поразит
  rationale: Передаёт военный смысл глагола נכה, не уточняя сверх текста, идёт ли речь непосредственно об убийстве.
- source_word: וְהֵסִיר חֶרְפָּה
  choice: и снимет позор
  rationale: Естественно по-русски передаёт устранение бесчестья или поношения, лежащего на Израиле.
- source_word: מַעַרְכוֹת
  choice: боевым рядам
  rationale: Существительное обозначает выстроенные для битвы войска или боевые порядки; множественное число сохранено.
- source_word: חֵרֵף
  choice: посмел бросить вызов
  rationale: В данном военном контексте передаёт дерзкое поношение и вызывающее противостояние, сохраняя эмоциональную силу реплики.
- source_word: אֱלֹהִים חַיִּים
  choice: живого Бога
  rationale: Сохраняет устойчивое библейское именование и контраст с безжизненными богами народов.
theological_decisions:
- issue: Значение характеристики הֶעָרֵל
  choice: необрезанный
  alternative: чужеземный / языческий
  rationale: Сохранён конкретный богословски и заветно значимый термин исходного текста без замены толкованием.
- issue: Синтаксическая сила второго כִּי
  choice: «что он посмел…»
  alternative: «который бросил вызов…»
  rationale: Передана риторическая возмущённость вопроса и связь между ничтожностью противника в глазах Давида и его дерзостью; при этом не вводится отдельное доктринальное толкование.
translation_notes:
  register: Современный литературный русский язык; речь возвышенная, но ясная. Повтор указательного «этот» частично сохранён для передачи презрительной риторической силы еврейского текста.
