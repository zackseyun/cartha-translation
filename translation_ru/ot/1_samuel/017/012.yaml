base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/012.yaml
  text: David was the son of an Ephrathite from Bethlehem of Judah[a], whose name was Jesse, and he had eight sons. In the days of Saul, the man was old, advanced in years.
translation:
  language: ru
  text: Давид был сыном того ефрафянина из Вифлеема Иудейского, которого звали Иессей. У него было восемь сыновей. Во дни Саула этот человек был стар и достиг преклонного возраста.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение необычно; буквально: «стар, пришедший среди людей». По смыслу, вероятно, речь идёт о весьма преклонном возрасте.'
    reason: Сохраняет необычность и некоторую неясность выражения בָּא בָאֲנָשִׁים, тогда как основной текст передаёт его наиболее вероятный смысл.
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: ефрафянин
  rationale: В связи с Вифлеемом Иудейским слово обозначает выходца из Ефрафы, то есть Вифлеема, а не представителя колена Ефрема. Традиционная форма «ефрафянин» сохраняет географическое обозначение.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: из Вифлеема Иудейского
  rationale: Естественное русское географическое наименование, отличающее этот Вифлеем от одноимённых мест.
- source_word: וּשְׁמוֹ יִשַׁי
  choice: которого звали Иессеем
  rationale: Относительная конструкция естественно передаёт еврейское сочинение и однозначно относит имя к отцу Давида.
- source_word: וְלוֹ שְׁמֹנָה בָנִים
  choice: У него было восемь сыновей
  rationale: Идиоматическая русская передача еврейской конструкции обладания.
- source_word: בִּימֵי שָׁאוּל
  choice: Во дни Саула
  rationale: Достоинственная и понятная временная формула, близкая к структуре источника.
- source_word: זָקֵן
  choice: был уже стар
  rationale: Прямо передаёт состояние преклонного возраста; «уже» естественно связывает определение со следующим уточнением, не вводя нового смыслового утверждения.
- source_word: בָּא בָאֲנָשִׁים
  choice: в преклонных летах
  rationale: Необычный еврейский оборот в контексте наиболее вероятно указывает на весьма преклонный возраст. Неясная буквальная образность сохранена в примечании.
- source_word: וְהָאִישׁ
  choice: этот человек
  rationale: Сохраняет повторное обозначение Иессея как «человека» и ясно связывает предложение с предыдущим.
