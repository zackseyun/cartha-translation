base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/024.yaml
  text: Then Samuel said to all the people[a], “Do you see the one whom Yahweh has chosen? There is no one like him among all the people.” And all the people shouted and said[b], “Long live the king!”
translation:
  language: ru
  text: 'Тогда Самуил сказал всему народу: «Видите ли вы того, кого избрал Яхве?[a] Ведь среди всего народа нет никого подобного ему». И весь народ закричал: «Да живёт царь!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Видели ли вы того, кого избрал Яхве?»'
    reason: Еврейская форма может быть понята как вопрос о совершившемся восприятии, хотя в контексте она естественно привлекает внимание к представленному Саулу.
  - marker: b
    text: 'Буквально: «Пусть живёт царь!»'
    reason: Сноска показывает буквальную форму еврейского пожелания, переданного в тексте устойчивым русским возгласом.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда Самуил сказал
  rationale: Последовательная форма с waw продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: הַרְּאִיתֶם
  choice: Видите ли вы
  rationale: Хотя форма морфологически является перфектом 2-го лица множественного числа, в данной прямой речи она привлекает внимание к стоящему перед народом Саулу. В сноске сохранено возможное строго временное прочтение.
- source_word: אֲשֶׁר בָּחַר בּוֹ יְהוָה
  choice: того, кого избрал Яхве
  rationale: Относительное придаточное прямо указывает на Саула; прошедшее совершенного вида естественно передаёт завершённый выбор, значимый в настоящей сцене.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: כִּי אֵין כָּמֹהוּ
  choice: Ведь ... нет никого подобного ему
  rationale: «Ведь» естественно выражает пояснительную силу כִּי, а оборот «нет никого подобного ему» сохраняет сравнительное утверждение текста.
- source_word: בְּכָל הָעָם
  choice: среди всего народа
  rationale: Предлог обозначает сравнение Саула со всеми представителями собравшегося народа.
- source_word: וַיָּרִעוּ ... וַיֹּאמְרוּ
  choice: весь народ закричал
  rationale: Русский глагол с последующей прямой речью естественно передаёт громкий общий возглас и введение его содержания, не приписывая народу дополнительных эмоций.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Да живёт царь!
  rationale: Форма пожелания передана традиционной и понятной русской формулой царского приветствия, близкой к буквальному смыслу еврейского выражения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с dignified, но общедоступной библейской интонацией. Синтаксис прямой и естественный; коллективное «народ» согласовано в единственном числе.
