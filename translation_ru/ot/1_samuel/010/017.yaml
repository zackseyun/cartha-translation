  yaml_path: translation/ot/1_samuel/010/017.yaml
  text: Then Samuel called the people together to Yahweh at Mizpah[a].
translation:
  language: ru
  text: Затем Самуил созвал[a] народ к Яхве в Мицпе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призвал народ собраться». Еврейский глагол может обозначать призыв или созыв собрания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצְעֵק
  choice: созвал
  rationale: При прямом дополнении «народ» глагол здесь означает призыв собраться, то есть созыв; «созвал» естественно передаёт это значение по-русски.
- source_word: אֶת הָעָם
  choice: народ
  rationale: עָם обозначает здесь народ Израиля, собранный Самуилом.
- source_word: אֶל
  choice: к
  rationale: Предлог сохраняет направленность собрания к Яхве и не заменяется более толковательным «пред».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул.
- source_word: הַמִּצְפָּה
  choice: в Мицпу
  rationale: Это название места; форма с предлогом «в» естественно обозначает направление созыва в русском языке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога. Форма «Яхве» непосредственно передаёт тетраграмматон, тогда как «Господь» заменяет его титулом.
- issue: Связь выражения אֶל־יְהוָה с созывом народа
  choice: к Яхве
  alternative: пред Яхве
  rationale: Буквальная направленность предлога אֶל сохранена; вариант «пред Яхве» яснее выражал бы собрание в Божьем присутствии, но добавлял бы толкование.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательная. Сочетание «к Яхве» намеренно сохраняет необычную конструкцию исходного текста, а «в Мицпу» естественно передаёт направление движения.
