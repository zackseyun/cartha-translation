  text: וַ/יְכַל֙ מֵֽ/הִתְנַבּ֔וֹת וַ/יָּבֹ֖א הַ/בָּמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/013.yaml
  text: When he had finished prophesying[a], he came to the high place.
translation:
  language: ru
  text: Когда Саул закончил пророчествовать, он пришёл на высоту[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть к месту поклонения, обычно располагавшемуся на возвышенности; возможный перевод: «к святилищу на возвышенности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: закончил
  rationale: Глагол כלה здесь обозначает завершение предшествующего действия. Русское «закончил» естественно передаёт завершённость, не усиливая значение до полного прекращения пророческой деятельности вообще.
- source_word: מֵהִתְנַבּוֹת
  choice: пророчествовать
  rationale: Инфинитив от נבא после מן обозначает действие, которое завершилось. «Пророчествовать» прямо и идиоматично передаёт смысл, не сводя его лишь к внешнему поведению или неопределённому пророческому состоянию.
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: בוא может передавать прибытие или движение к месту. «Пришёл» сохраняет обычную повествовательную формулировку и не уточняет точку зрения сверх исходного текста.
- source_word: הַבָּמָה
  choice: на высоту
  rationale: במה обозначает «высоту», обычно место поклонения на возвышенности. Традиционный краткий эквивалент сохраняет форму исходного выражения, а сноска поясняет его культовый смысл.
- source_word: implicit subject
  choice: Саул
  rationale: В древнееврейском тексте стоит местоименно выраженный субъект «он», относящийся к Саулу. Имя восстановлено в русском тексте для ясности самостоятельного стиха без изменения референции.
theological_decisions:
- issue: Культовое значение הַבָּמָה
  choice: высота
  alternative: святилище на возвышенности
  rationale: Исходный термин указывает на место поклонения, но сам стих не оценивает его законность. Краткое «высота» вместе со сноской сохраняет историко-богословскую неопределённость и не навязывает оценку этого места.
translation_notes:
  register: Современный литературный русский язык с кратким, плавным повествовательным синтаксисом. Имя «Саул» добавлено вместо местоимения ради ясности при чтении стиха отдельно. Термин «высота» сохранён как прозрачный библейский эквивалент и разъяснён в сноске.
