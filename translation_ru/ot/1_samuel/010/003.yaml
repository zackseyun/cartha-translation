base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/003.yaml
  text: 'Then you will pass on from there and go farther[a], and you will come to the oak of Tabor. There three men going up to God at Bethel will meet you: one carrying three young goats, another carrying three loaves of bread[c][b], and another carrying a wineskin.'
translation:
  language: ru
  text: 'Потом ты пойдёшь оттуда дальше и придёшь к дубу Фавора[a]. Там тебя встретят три человека, идущие к Богу в Вефиль[b]: один будет нести трёх козлят, другой — три хлеба, а третий — бурдюк вина[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к терпентинному дереву Фавора». Еврейское слово может обозначать дуб, терпентинное или другое крупное приметное дерево; его вид точно не определён.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «восходящих к Богу — Вефиль». Вероятно, речь идёт о пути к месту поклонения Богу в Вефиле.'
    reason: cultural_note
  - marker: c
    text: 'Или: «мех с вином». Речь идёт о кожаном сосуде для вина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָלַפְתָּ מִשָּׁם וָהָלְאָה
  choice: пойдёшь оттуда дальше
  rationale: Естественно передаёт последовательное движение вперёд и значение наречия «дальше», не создавая впечатления простого прохождения мимо.
- source_word: אֵלוֹן תָּבוֹר
  choice: большое дерево у Фавора
  rationale: אֵלוֹן может обозначать дуб, терпентинное дерево или приметное большое дерево; нейтральный вариант сохраняет лексическую неопределённость, а «у Фавора» естественно передаёт связь названия с местом.
- source_word: וּמְצָאוּךָ
  choice: тебя встретят
  rationale: В контексте предсказанной встречи идиоматическое «встретят» точнее по-русски, чем буквальное «найдут».
- source_word: עֹלִים אֶל הָאֱלֹהִים בֵּית אֵל
  choice: идущие к Богу в Вефиль
  rationale: Сохраняет необычное направление «к Богу» и связь с Вефилем, не добавляя прямо не названного действия поклонения или жертвоприношения.
- source_word: גְדָיִים
  choice: козлят
  rationale: Точное и обычное русское обозначение молодых коз.
- source_word: שְׁלֹשֶׁת כִּכְּרוֹת לֶחֶם
  choice: три хлеба
  rationale: В данном перечне «хлеб» означает отдельную буханку или каравай; краткий русский оборот естественен и не навязывает форму изделий.
- source_word: נֵבֶל יָיִן
  choice: бурдюк вина
  rationale: Передаёт сосуд для жидкости вместе с прямо выраженным в еврейском тексте содержимым; примечание отмечает возможный буквальный оттенок.
theological_decisions:
- issue: Значение выражения «идущие к Богу в Вефиль»
  choice: Сохранено указание на движение к Богу в связи с Вефилем без уточнения обряда.
  alternative: «Идущие поклониться Богу в Вефиле» или «идущие к дому Божьему в Вефиль».
  rationale: Еврейский текст не называет поклонение, жертву или дом Божий прямо; перевод сохраняет религиозную направленность и присущую выражению синтаксическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранены достоинство библейской речи и трёхчастная структура перечня; архаизмы сведены к общеупотребительному культурному термину «бурдюк».
