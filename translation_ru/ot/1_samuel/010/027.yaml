base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/027.yaml
  text: But worthless men said[a], “How can this man save us?” And they despised him and did not bring him a gift. But he was like one keeping silent.
translation:
  language: ru
  text: 'Но негодные люди говорили: «Как этот человек может нас спасти?» Они презирали его и не принесли ему дара. Но он был как человек, хранящий молчание[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он словно был глухим». Еврейское выражение может описывать намеренное молчание в ответ на провокацию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בְלִיַּעַל
  choice: негодные люди
  rationale: Еврейская идиома буквально означает «сыны негодности» и характеризует нравственно низких, недостойных людей. «Негодные люди» естественно передаёт её смысл, не усиливая его до более узкого обвинения в преступности.
- source_word: מַה יֹּשִׁיעֵנוּ זֶה
  choice: Как этот человек может нас спасти?
  rationale: Вопрос с формой глагола ישׁע выражает недоверие и презрительный вызов. Указательное זֶה передано словами «этот человек», что естественно по-русски и сохраняет пренебрежительный оттенок контекста.
- source_word: וַיִּבְזֻהוּ
  choice: они презирали его
  rationale: Глагол בזה означает считать кого-либо ничтожным, относиться с презрением. Прямой русский эквивалент сохраняет лаконичность повествования.
- source_word: מִנְחָה
  choice: дар
  rationale: В контексте признания царя слово обозначает принесённый правителю дар, возможно выражавший почтение или подчинение. «Дар» сохраняет эту широту и не придаёт слову исключительно культового значения.
- source_word: כְּמַחֲרִישׁ
  choice: хранил молчание
  rationale: Причастная форма с כְּ буквально представляет Саула «словно молчащим». По-русски «хранил молчание» естественно передаёт его намеренное отсутствие ответа, тогда как возможный оттенок «словно не слышал» вынесен в примечание.
- source_word: וַיְהִי
  choice: он хранил
  rationale: Связка היה вместе со сравнительной причастной конструкцией описывает состояние или поведение Саула. В русском переводе она естественно включена в составное выражение «он хранил молчание».
theological_decisions:
- issue: Характер реакции Саула на презрение
  choice: Саул не ответил и хранил молчание
  alternative: Саул вёл себя так, словно не слышал оскорбления
  rationale: Выражение כְּמַחֲרִישׁ допускает как прямое описание молчания, так и идиоматический образ человека, будто не слышащего провокации. Основной текст передаёт более непосредственный смысл, а примечание сохраняет альтернативный оттенок, не приписывая Саулу явно не названных мотивов.
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным ритмом. Реплика передаёт презрительный скепсис без разговорной грубости; «дар» соответствует царскому контексту и не звучит как специальный культовый термин.
