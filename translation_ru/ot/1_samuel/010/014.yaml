base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/014.yaml
  text: Then Saul’s uncle said to him and to his young man[a], “Where did you go?” And he said, “To seek the donkeys. When we saw that they were nowhere to be found[b], we went to Samuel.”
translation:
  language: ru
  text: 'Дядя Саула спросил Саула и его спутника: «Куда вы ходили?» Саул ответил: «Мы ходили искать ослиц. Увидев, что их нет, мы пришли к Самуилу[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы пошли к Самуилу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד שָׁאוּל
  choice: дядя Саула
  rationale: דּוֹד в данном повествовательном контексте естественнее всего обозначает дядю; более общее «родственник» неоправданно размывает указанную степень родства.
- source_word: אֶלָיו וְאֶל נַעֲרוֹ
  choice: его и его молодого слугу
  rationale: נַעַר может означать юношу, слугу или сопровождающего. В контексте это молодой слуга, сопровождавший Саула; такая передача естественна по-русски и сохраняет обе стороны значения.
- source_word: אָן הֲלַכְתֶּם
  choice: Куда вы ходили?
  rationale: Форма второго лица множественного числа обращена к Саулу и его спутнику. «Куда вы ходили?» естественно передаёт вопрос после их возвращения.
- source_word: לְבַקֵּשׁ אֶת הָאֲתֹנוֹת
  choice: Искали ослиц
  rationale: בקשׁ означает «искать», а אֲתֹנוֹת прямо обозначает ослиц; в русском конкретное указание пола звучит естественно и не требует обобщения до «ослов».
- source_word: וַנִּרְאֶה כִי אַיִן
  choice: Увидев, что их нигде нет
  rationale: Буквально речь о том, что ослиц нет. Русская формулировка кратко и идиоматично передаёт вывод искателей, не добавляя утверждения сверх контекста.
- source_word: וַנָּבוֹא אֶל שְׁמוּאֵל
  choice: мы отправились к Самуилу
  rationale: בוא с אֶל выражает движение к Самуилу. «Отправились к» естественно для пересказа маршрута и избегает навязывания точки отсчёта, тогда как буквально возможно также «пришли к».
