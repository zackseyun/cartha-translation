translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Имя говорящего во второй реплике («Саул») выражено явно вместо буквального местоимения, чтобы устранить неестественную для русского двусмысленность при двух мужских участниках, не меняя смысла контекста.
