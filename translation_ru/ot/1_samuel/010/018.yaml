  text: וַ/יֹּ֣אמֶר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם וָ/אַצִּ֤יל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּד֙ כָּל הַ/מַּמְלָכ֔וֹת הַ/לֹּחֲצִ֖ים אֶתְ/כֶֽם׀־פ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/018.yaml
  text: 'And he said to the sons of Israel[a], “Thus says Yahweh, the God of Israel: I brought Israel up from Egypt, and I delivered you from the hand of the Egyptians and from the hand of all the kingdoms that were oppressing you.”'
translation:
  language: ru
  text: 'И он сказал сыновьям Израиля[a]: «Так говорит Яхве, Бог Израиля: Я вывел Израиль из Египта и избавил вас от власти египтян и от власти всех царств, угнетавших вас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам»; традиционно: «сынам Израилевым».'
    reason: Лексическая альтернатива для בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Формально передаёт мужское множественное число и традиционное этническое наименование; более естественный вариант «израильтянам» указан в сноске.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая и торжественная формула посланнической речи, естественная в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: הֶעֱלֵיתִי
  choice: вывел
  rationale: В контексте исхода естественно выражает каузативное движение из Египта; буквальное «поднял» по-русски здесь вводило бы в заблуждение.
- source_word: וָאַצִּיל
  choice: избавил
  rationale: Передаёт спасение от враждебной власти и соответствует возвышенному историко-богословскому регистру.
- source_word: מִיַּד
  choice: от власти
  rationale: Естественно раскрывает древнееврейскую идиому «из руки», обозначающую власть или контроль, без утраты её смысла.
- source_word: מִצְרַיִם
  choice: египтян
  rationale: После выражения «от власти» обозначает египетский народ и господство, а не территорию Египта.
- source_word: כָּל הַמַּמְלָכוֹת
  choice: всех царств
  rationale: Сохраняет множественное число и всеохватность исходного выражения, ничего не добавляя.
- source_word: הַלֹּחֲצִים אֶתְכֶם
  choice: угнетавших вас
  rationale: Причастная форма передаёт продолжительное или характерное угнетение и звучит естественно по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Передача этнонима בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам; детям Израиля
  rationale: Основной текст сохраняет явную мужскую форму древнееврейского выражения, а более идиоматичный этноним приводится в сноске.
- issue: Образ מִיַּד — «из руки»
  choice: от власти
  alternative: из руки
  rationale: В данном контексте речь о господстве и контроле. Русское «от власти» ясно передаёт смысл, тогда как повторное «из руки царств» звучало бы неестественно.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Формула «Так говорит» и имя «Яхве» сохраняют торжественность; синтаксис упрощён лишь там, где буквальная калька была бы неясной или неестественной.
