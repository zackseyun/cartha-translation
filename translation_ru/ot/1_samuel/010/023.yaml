  text: So they ran and took him from there[a], and he stood in the midst of the people. And he was taller than all the people from his shoulders upward.
translation:
  language: ru
  text: Тогда они побежали и взяли его оттуда[a]. Он встал посреди народа и был выше всего народа от плеч и выше.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «привели его оттуда». Обычно еврейский глагол означает «взять», но в этом контексте он может подразумевать, что Саула привели из места, где он прятался (см. ст. 22).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֻצוּ
  choice: они побежали
  rationale: Прямо передаёт значение רוץ и сохраняет живость повествования.
- source_word: וַיִּקָּחֻהוּ מִשָּׁם
  choice: взяли его оттуда
  rationale: Сохраняет основное значение לקח и указание места מִשָּׁם; контекстуальный оттенок «привели» дан в сноске.
- source_word: וַיִּתְיַצֵּב בְּתוֹךְ הָעָם
  choice: Он встал посреди народа
  rationale: Естественно передаёт возвратную форму יצב и пространственное значение בְּתוֹךְ без добавления церемониального оттенка.
- source_word: וַיִּגְבַּהּ מִכָּל הָעָם
  choice: был выше всех остальных
  rationale: В русском описании роста «выше» естественнее буквального «возвышался»; «остальных» ясно выражает сравнение Саула с собравшимся народом.
- source_word: מִשִּׁכְמוֹ וָמָעְלָה
  choice: на целую голову
  rationale: Еврейская идиома буквально указывает, что Саул возвышался над народом от плеч вверх; русская идиома «на целую голову» точно и естественно передаёт видимую разницу в росте.
