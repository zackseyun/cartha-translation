base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/010.yaml
  text: When they came there to the hill[a], behold, a band of prophets came to meet him, and the Spirit of God rushed upon him, and he prophesied among them.
translation:
  language: ru
  text: Когда они пришли туда, к холму[a], и вот, ему навстречу шла группа пророков. Дух Божий мощно сошёл на него, и он стал пророчествовать среди них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Гиву». Еврейскую форму можно понять и как название места, и как выражение «к холму».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַגִּבְעָתָה
  choice: к холму
  rationale: Форма с направительным окончанием допускает понимание как нарицательного «к холму» и как топонима «в Гиву». Артикль поддерживает нарицательное прочтение; неоднозначность отмечена в сноске.
- source_word: חֶבֶל נְבִאִים
  choice: группа пророков
  rationale: חבל здесь обозначает объединение людей. «Группа пророков» точно и естественно передаёт смысл, не предполагая более строгой организации, чем выражено в тексте.
- source_word: לִקְרָאתוֹ
  choice: навстречу ему вышла
  rationale: Оборот выражает движение навстречу Саулу. Русская формулировка естественно передаёт направленность действия.
- source_word: רוּחַ אֱלֹהִים
  choice: Дух Божий
  rationale: В контексте данного Богом знамения и наделения силой выражение естественно относится к Божьему Духу; перевод не вносит позднейшей догматической детализации.
- source_word: וַתִּצְלַח עָלָיו
  choice: мощно сошёл на него
  rationale: Глагол צלח в сочетании с רוח в книгах Самуила указывает на внезапное и действенное нисхождение Духа. «Мощно сошёл» сохраняет силу образа и звучит естественно по-русски.
- source_word: וַיִּתְנַבֵּא
  choice: стал пророчествовать
  rationale: Форма обозначает участие в пророческой деятельности. Перевод сохраняет широту значения, не уточняя без основания её конкретный характер.
- source_word: בְּתוֹכָם
  choice: среди них
  rationale: Выражение показывает, что Саул пророчествовал внутри этой группы и вместе с ней.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: «И вот» передаёт функцию הִנֵּה — привлечение внимания к внезапному развитию событий — в современном литературном русском регистре.
theological_decisions:
- issue: Передача רוּחַ אֱלֹהִים
  choice: Дух Божий
  alternative: дух от Бога
  rationale: Контекст указывает на непосредственное действие Божьего Духа как исполнение обещанного знамения. При этом перевод не определяет природу этого действия в категориях позднейшего богословия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «И вот» предпочтено архаичному «вот, behold»; синтаксис разделён на два предложения для ясности без изменения последовательности событий.
