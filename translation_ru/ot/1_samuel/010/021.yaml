base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/021.yaml
  text: Then he brought the tribe of Benjamin near by its clans[a], and the clan of the Matrites was taken. Then Saul son of Kish was taken, but when they sought him[b], he could not be found.
translation:
  language: ru
  text: И он велел племени Вениамина подойти по его родам[a], и жребий пал на род Матритов. Затем жребий пал на Саула, сына Киса, но, когда его стали искать, не нашли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по его семействам». Еврейское слово обозначает крупные родственные группы внутри племени.'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение «жребий пал» передаёт значение еврейского «был взят»: в этом контексте речь идёт об указании посредством жребия, а не о захвате.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: велел подойти
  rationale: Порода hифиль глагола קרב означает «приблизить, подвести, представить». В данном обрядовом контексте естественное русское «велел подойти» сохраняет каузативный и процедурный смысл.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: племени Вениамина
  rationale: שֵׁבֶט обозначает племя как основную единицу Израиля; форма родительного падежа естественна после «велел подойти».
- source_word: לְמִשְׁפְּחֹתָיו
  choice: по его родам
  rationale: מִשְׁפָּחָה здесь обозначает крупную родственную группу внутри племени. «Род» точнее русского «семья» передаёт уровень социальной организации, а «по» — распределительное значение предлога לְ.
- source_word: וַתִּלָּכֵד
  choice: жребий пал на
  rationale: Буквально нифаль לכד означает «быть взятым», но в данном контексте речь идёт об указании посредством жребия. Русское «жребий пал на» ясно передаёт культурно обусловленный смысл и не создаёт ложного впечатления о пленении.
- source_word: מִשְׁפַּחַת הַמַּטְרִי
  choice: род Матрия
  rationale: מִשְׁפַּחַת передано последовательно как «род». הַמַּטְרִי — групповое обозначение, образованное от имени Матрий; «род Матрия» звучит естественно по-русски, не утверждая сверх текста, что сам Матрий присутствует в сцене.
- source_word: וַיִּלָּכֵד שָׁאוּל בֶּן־קִישׁ
  choice: жребий пал на Саула, сына Киса
  rationale: 'Повтор глагола לכד передан той же формулой, чтобы сохранить последовательность отбора: род, затем отдельный человек.'
- source_word: וַיְבַקְשֻׁהוּ
  choice: его стали искать
  rationale: בקשׁ означает «искать». Начальная форма действия естественно связывает выбор Саула с последовавшими поисками.
- source_word: וְלֹא נִמְצָא
  choice: и не нашли
  rationale: Еврейская пассивная конструкция буквально означает «он не был найден». Неопределённо-личное русское выражение передаёт тот же результат поиска более естественно.
theological_decisions:
- issue: Способ указания избранного человека
  choice: Явно назвать жребий
  alternative: Сохранить буквальное «был взят»
  rationale: Контекст главы показывает поэтапный священный выбор, а не пленение. Уточнение «жребий пал» передаёт подразумеваемый способ выбора, не приписывая тексту конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Термины «племя» и «род» ясно отражают последовательное сужение круга. Имена переданы в традиционной русской библейской форме.
