  text: וַ/יְדַבֵּ֨ר שְׁמוּאֵ֜ל אֶל הָ/עָ֗ם אֵ֚ת מִשְׁפַּ֣ט הַ/מְּלֻכָ֔ה וַ/יִּכְתֹּ֣ב בַּ/סֵּ֔פֶר וַ/יַּנַּ֖ח לִ/פְנֵ֣י יְהוָ֑ה וַ/יְשַׁלַּ֧ח שְׁמוּאֵ֛ל אֶת כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/025.yaml
  text: Then Samuel told the people the rights and duties of the kingship[a], and he wrote them in the book and laid it before Yahweh. Then Samuel sent all the people away[b], each man to his house.
translation:
  language: ru
  text: Самуил изложил народу установления царской власти[a], записал их в книге и положил написанное перед Яхве. Затем Самуил отпустил весь народ — каждого в свой дом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «права и обязанности царской власти»; возможно также: «порядок (обычай) царской власти». Еврейское выражение может обозначать правовые установления или принятую практику царствования.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каждый — в свой дом»; это распределительное выражение, означающее, что люди разошлись каждый к себе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: изложил
  rationale: В сочетании с адресатом и прямым дополнением содержания глагол означает не просто речь, а последовательное сообщение установлений; «изложил» естественно передаёт это по-русски.
- source_word: מִשְׁפַּט הַמְּלֻכָה
  choice: установления царской власти
  rationale: מִשְׁפַּט здесь допускает значения правовой нормы, предписанного порядка или обычая, а מְלֻכָה обозначает царскую власть как институт. Формулировка сохраняет правовой оттенок, не сводя выражение только к правам и обязанностям либо к обычаю.
- source_word: וַיִּכְתֹּב בַּסֵּפֶר
  choice: записал их в книгу
  rationale: Множественное «их» естественно отсылает к упомянутым установлениям. סֵפֶר может означать книгу, свиток или письменный документ; нейтральное «книга» не уточняет материальную форму сверх текста.
- source_word: וַיַּנַּח לִפְנֵי יְהוָה
  choice: положил её пред Яхве
  rationale: Глагол выражает помещение или оставление документа; местоимение женского рода относится к книге. «Пред» сохраняет торжественный библейский регистр и вероятный культовый смысл хранения в присутствии Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно представленное тетраграмматоном, а не замещающий его титул.
- source_word: וַיְשַׁלַּח
  choice: отпустил
  rationale: По контексту Самуил распускает собравшийся народ, а не посылает его с поручением.
- source_word: אִישׁ לְבֵיתוֹ
  choice: каждого в свой дом
  rationale: 'Русская распределительная конструкция точно передаёт смысл: все разошлись по своим домам. Винительный «каждого» естественно зависит от «отпустил» и сохраняет мужскую форму исходного выражения.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя; транслитерация сохраняет различие между именем Бога и титулом.
- issue: Значение מִשְׁפַּט הַמְּלֻכָה
  choice: установления царской власти
  alternative: права и обязанности царской власти / обычай царской власти
  rationale: Еврейское выражение может обозначать нормативный порядок, права или установившуюся практику царствования. Основной текст сохраняет эту широту, а примечание указывает реальные альтернативы.
- issue: Распределительное אִישׁ לְבֵיתוֹ
  choice: каждого в свой дом
  alternative: каждый к себе домой
  rationale: Выбрана естественная русская конструкция, сохраняющая индивидуально-распределительный смысл и связь с глаголом «отпустил».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Пред Яхве» употреблено намеренно для достоинства и краткости; остальной синтаксис остаётся ясным для современного читателя.
