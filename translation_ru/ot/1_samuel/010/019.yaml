  text: וְ/אַתֶּ֨ם הַ/יּ֜וֹם מְאַסְתֶּ֣ם אֶת אֱלֹהֵי/כֶ֗ם אֲשֶׁר ה֣וּא מוֹשִׁ֣יעַ לָ/כֶם֮ מִ/כָּל רָעוֹתֵי/כֶ֣ם וְ/צָרֹֽתֵי/כֶם֒ וַ/תֹּ֣אמְרוּ ל֔/וֹ כִּי מֶ֖לֶךְ תָּשִׂ֣ים עָלֵ֑י/נוּ וְ/עַתָּ֗ה הִֽתְיַצְּבוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/שִׁבְטֵי/כֶ֖ם וּ/לְ/אַלְפֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/019.yaml
  text: But today you have rejected your God[a], who himself saves you from all your calamities and distresses, and you have said to him, ‘No[b], but set a king over us.’ So now present yourselves before Yahweh by your tribes and by your thousands.
translation:
  language: ru
  text: 'Но сегодня вы отвергли своего Бога, который Сам спасает вас от всех ваших бедствий и невзгод[a], и сказали Ему: «Нет, но поставь над нами царя». Теперь предстаньте перед Яхве по своим племенам и тысячам[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от всех ваших бед и притеснений». Еврейские слова могут обозначать переживаемые несчастья, беды, тяготы или страдания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по своим родам» или «по своим подразделениям в тысячу человек». Еврейское слово «тысячи» может обозначать общественные или военные подразделения, а не только буквальное число.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַסְתֶּם
  choice: отвергли
  rationale: Глагол מָאַס означает отвергать, отказываться или пренебрегать; «отвергли» естественно передаёт здесь серьёзность отказа Израиля от Божьего правления.
- source_word: אֱלֹהֵיכֶם
  choice: своего Бога
  rationale: Несмотря на морфологически множественную форму אֱלֹהִים, контекст и согласование указывают на единого Бога Израиля; возвратное «своего» естественно по-русски при подлежащем «вы».
- source_word: מוֹשִׁיעַ
  choice: спасает
  rationale: Причастие описывает характерное, продолжающееся действие Бога. «Спасает» сохраняет широкий смысл избавления от бед и опасностей.
- source_word: מִכָּל רָעוֹתֵיכֶם וְצָרֹתֵיכֶם
  choice: от всех ваших бедствий и невзгод
  rationale: רָעוֹת здесь обозначает переживаемые беды или несчастья, а צָרוֹת — тесноту, тяготы и невзгоды. Эта пара естественна по-русски и сохраняет два близких, но не полностью совпадающих понятия.
- source_word: כִּי
  choice: Нет
  rationale: В контексте упрёка частица вводит настойчивое требование народа, противопоставленное Божьему спасительному правлению. «Нет» естественно выражает этот контраст, хотя формально возможна и менее явная передача содержания речи.
- source_word: תָּשִׂים
  choice: поставь
  rationale: שׂוּם означает «поставить, поместить, назначить»; «поставь над нами царя» близко к еврейской конструкции и естественно для библейского повествования.
- source_word: הִתְיַצְּבוּ
  choice: предстаньте
  rationale: Форма выражает намеренное занятие места перед Яхве для последующего выбора; «предстаньте» передаёт официальный характер действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: לְשִׁבְטֵיכֶם
  choice: по своим племенам
  rationale: Предлог לְ указывает на распределение или построение по группам; «по своим племенам» естественно описывает порядок собрания.
- source_word: וּלְאַלְפֵיכֶם
  choice: и тысячам
  rationale: Основное значение אֶלֶף — «тысяча», но в административном или военном контексте слово может обозначать родовую либо военную единицу; буквальное обозначение сохранено в тексте, а неоднозначность пояснена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יְהוָה. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Сила частицы כִּי в цитате требования народа
  choice: «Нет, поставь над нами царя»
  alternative: «Поставь над нами царя»; «Но поставь над нами царя»
  rationale: Контекст противопоставляет Божье избавление требованию земного царя. «Нет» делает подразумеваемое возражение явным, не меняя содержания требования; менее эксплицитные варианты грамматически возможны.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-торжественным библейским регистром. Синтаксис остаётся близким к еврейскому ходу мысли, но звучит естественно; лексическая неоднозначность רָעוֹת/צָרוֹת и אֲלָפִים сохранена в сносках.
