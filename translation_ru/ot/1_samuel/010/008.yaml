base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/008.yaml
  text: And you shall go down before me to Gilgal. And behold[a], I am coming down to you to offer burnt offerings and to sacrifice peace offerings. You shall wait seven days, until I come to you and make known to you what you shall do.
translation:
  language: ru
  text: Ты спустишься в Гилгал раньше меня. И вот, я спущусь к тебе, чтобы принести всесожжения и заколоть мирные жертвы[a]. Жди семь дней, пока я не приду к тебе и не дам тебе знать, что тебе делать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «жертвы общения» или «жертвы благополучия». Еврейское название относится к жертвам, связанным с миром, целостностью и совместной трапезой.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתָּ
  choice: Ты спустишься
  rationale: Форма перфекта с союзом продолжает пророческо-наставительную последовательность; будущее время по-русски сохраняет одновременно предсказание и указание. Глагол «спуститься» передаёт пространственное значение ירד.
- source_word: לְפָנַי
  choice: прежде меня
  rationale: Буквально «передо мной»; в данном контексте речь о том, что Саул прибудет в Гилгал раньше Самуила. «Прежде меня» сохраняет временной оттенок, не исключая движения впереди него.
- source_word: הַגִּלְגָּל
  choice: Гилгал
  rationale: Название места передано транслитерацией, близкой к масоретскому произношению.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: «Вот» естественно для современного русского языка передаёт привлечение внимания и выразительность частицы הִנֵּה.
- source_word: יֹרֵד
  choice: я спущусь к тебе
  rationale: Причастие обозначает намеченное ближайшее действие. Будущее время естественно в русском контексте обещания; «к тебе» передаёт направленность действия к Саулу.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: чтобы принести всесожжения
  rationale: Устойчивое жертвенное выражение обозначает принесение жертв, сжигаемых целиком; «всесожжения» — точный и узнаваемый русский термин.
- source_word: לִזְבֹּחַ זִבְחֵי שְׁלָמִים
  choice: и заколоть мирные жертвы[a]
  rationale: Глагол זבח прямо указывает на заклание жертвы. Традиционный термин «мирные жертвы» краток и узнаваем, а примечание сохраняет более широкий смысл благополучия, целостности и общения.
- source_word: שִׁבְעַת יָמִים תּוֹחֵל
  choice: Жди семь дней
  rationale: В процедурном контексте יחל означает ожидание, а не надежду. Русский императив ясно передаёт обязательный характер наставления.
- source_word: עַד בּוֹאִי אֵלֶיךָ
  choice: пока я не приду к тебе
  rationale: Русская конструкция «пока не» естественно передаёт предел ожидания, выраженный עַד с инфинитивом и суффиксом.
- source_word: וְהוֹדַעְתִּי לְךָ
  choice: и не дам тебе знать
  rationale: Передаёт каузативное значение Hiphil от ידע — «сделать известным, дать знать».
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: что тебе делать
  rationale: Естественная русская передача относительной конструкции; модальный оттенок необходимости выражен дательным «тебе» с инфинитивом.
theological_decisions:
- issue: Передача названия жертв שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения; жертвы благополучия
  rationale: Традиционное выражение «мирные жертвы» сохраняет связь корня с миром и целостностью и остаётся узнаваемым, но не исчерпывает смысл участия в общей жертвенной трапезе и благополучия; поэтому альтернативные смысловые оттенки отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным и разговорно не сниженным; сохранены пророческо-наставительный тон и внимание, выраженное словами «И вот».
