  text: אַ֣חַר כֵּ֗ן תָּבוֹא֙ גִּבְעַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁר שָׁ֖ם נְצִבֵ֣י פְלִשְׁתִּ֑ים וִ/יהִי֩ כְ/בֹאֲ/ךָ֨ שָׁ֜ם הָ/עִ֗יר וּ/פָגַעְתָּ֞ חֶ֤בֶל נְבִיאִים֙ יֹרְדִ֣ים מֵֽ/הַ/בָּמָ֔ה וְ/לִ/פְנֵי/הֶ֞ם נֵ֤בֶל וְ/תֹף֙ וְ/חָלִ֣יל וְ/כִנּ֔וֹר וְ/הֵ֖מָּה מִֽתְנַבְּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/005.yaml
  text: After that you will come to Gibeath-ha-Elohim[a], where the Philistine garrison is. And when you enter there, into the city, you will meet a band of prophets coming down from the high place, with harp, tambourine, flute, and lyre before them[c][b], and they will be prophesying.
translation:
  language: ru
  text: После этого ты придёшь в Гиву Божью[a], где находится филистимский гарнизон[b]. Когда ты придёшь туда, в город, ты встретишь группу пророков, спускающихся с высоты; перед ними будут арфа, бубен, свирель и лира[c], а сами они будут пророчествовать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Божьему холму»; еврейское выражение можно понимать как название места — «Гива Божья» — или как его описание.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «филистимский пост» или «филистимские наместники»; еврейское слово может обозначать военную заставу либо поставленных должностных лиц, хотя контекст скорее указывает на гарнизон.'
    reason: alternative_reading
  - marker: c
    text: 'Точно определить древние инструменты трудно: под «арфой» мог подразумеваться другой щипковый инструмент, а под «свирелью» — флейта или иной духовой инструмент.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבְעַת הָאֱלֹהִים
  choice: Гива Божья
  rationale: Фраза, вероятно, служит названием места, но сохраняет прозрачное значение «холм/Гива Божья». Переводная форма естественна по-русски и не скрывает возможного описательного понимания; неоднозначность отмечена в сноске.
- source_word: נְצִבֵי פְלִשְׁתִּים
  choice: филистимский гарнизон
  rationale: נְצִיבֵי может обозначать поставленных должностных лиц либо военный пост. В данном повествовательном и географическом контексте наиболее вероятен собирательный военный смысл.
- source_word: וִיהִי כְבֹאֲךָ שָׁם הָעִיר
  choice: Когда войдёшь там в город
  rationale: Еврейская временная конструкция передана естественным современным русским оборотом; שָׁם и הָעִיר сохранены без громоздкой буквальности.
- source_word: וּפָגַעְתָּ
  choice: встретишь
  rationale: В контексте глагол означает встретить или повстречать на пути.
- source_word: חֶבֶל נְבִיאִים
  choice: группу пророков
  rationale: חֶבֶל здесь обозначает организованную группу. «Группа» понятно современному читателю и не создаёт ложной ассоциации с музыкальным ансамблем.
- source_word: יֹרְדִים מֵהַבָּמָה
  choice: спускающихся с высоты
  rationale: בָּמָה обозначает культовую возвышенность, обычно «высоту»; такой перевод сохраняет библейский термин, не уточняя сверх текста характер святилища.
- source_word: נֵבֶל
  choice: арфа
  rationale: Точная конструкция древнего струнного инструмента неизвестна; «арфа» — доступное традиционное приближение. Неопределённость отмечена в сноске.
- source_word: תֹף
  choice: бубен
  rationale: Речь идёт о ручном ударном инструменте; «бубен» — естественный и узнаваемый русский эквивалент.
- source_word: חָלִיל
  choice: свирель
  rationale: Название духового инструмента передано понятным литературным словом; возможное более общее «труба/флейта» учтено в сноске.
- source_word: כִּנּוֹר
  choice: лира
  rationale: Инструмент обычно определяется как разновидность лиры; это также позволяет отличить его от נֵבֶל.
- source_word: וְהֵמָּה מִתְנַבְּאִים
  choice: а сами они будут пророчествовать
  rationale: Перевод сохраняет прямую связь с пророческой деятельностью и не навязывает её конкретную форму — экстатическую речь, пение или музыкальное прославление.
theological_decisions:
- issue: Характер действия, выраженного מִתְנַבְּאִים
  choice: будут пророчествовать
  alternative: будут находиться в пророческом исступлении / будут вдохновенно воспевать
  rationale: Форма глагола указывает на пророческую деятельность, однако стих не определяет её точное проявление. Нейтральный перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён для ясности, но последовательность событий и подлинные лексические неоднозначности сохранены. Слова «Перед ними будут идти музыканты» эксплицируют подразумеваемых носителей инструментов; это делает русскую фразу естественной, не меняя образ процессии.
