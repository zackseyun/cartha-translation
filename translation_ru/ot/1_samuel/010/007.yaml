base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/007.yaml
  text: And when these signs come to you[a], do whatever your hand finds to do, for God is with you.
translation:
  language: ru
  text: Когда эти знамения сбудутся, делай всё, что будет тебе по силам[a], потому что Бог с тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «делай для себя то, что найдёт твоя рука»; то есть делай то, что окажется возможным или будет в твоей власти.'
    reason: Сноска сохраняет буквальный образ еврейской идиомы и отмечает личный оттенок לְךָ, тогда как основной текст передаёт её естественным современным русским выражением.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Когда
  rationale: Оборот вводит будущее обстоятельство; «когда» естественно передаёт его временное значение без избыточной архаичности.
- source_word: תבאינה הָאֹתוֹת הָאֵלֶּה לָךְ
  choice: сбудутся для тебя эти знамения
  rationale: Глагол בוא при слове «знамения» описывает их наступление или осуществление. «Сбудутся для тебя» естественно по-русски передаёт, что предсказанные знамения произойдут с Саулом.
- source_word: עֲשֵׂה לְךָ
  choice: делай
  rationale: В данном повелении לְךָ придаёт личную, побудительную окраску, которую отдельное «для себя» по-русски передало бы неестественно и могло бы создать неверный оттенок личной выгоды.
- source_word: אֲשֶׁר תִּמְצָא יָדֶךָ
  choice: всё, что будет тебе по силам
  rationale: Еврейская идиома буквально говорит о том, что «найдёт рука», то есть о доступном человеку действии или возможности. Русское выражение передаёт смысл ясно, а буквальный образ сохранён в сноске.
- source_word: כִּי
  choice: потому что
  rationale: 'Союз вводит основание повеления: Саул может действовать, поскольку Бог пребывает с ним.'
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Несмотря на артикль, здесь это определённое указание на Бога Израиля; в русском языке естественно употребить имя «Бог» без добавления указательного слова.
- source_word: עִמָּךְ
  choice: с тобой
  rationale: Прямо передаёт присутствие и поддержку Бога, обещанные Саулу.
theological_decisions:
- issue: Значение Божьего присутствия в словах כִּי הָאֱלֹהִים עִמָּךְ
  choice: потому что Бог с тобой
  alternative: ибо Бог с тобой
  rationale: 'Перевод сохраняет причинную связь: Божье присутствие служит основанием для действия Саула. Формулировка не уточняет сверх текста, означает ли это одобрение любого возможного поступка или данное для предстоящего случая Божье содействие.'
- issue: Артикль при הָאֱלֹהִים
  choice: Бог
  alternative: этот Бог
  rationale: Артикль обозначает конкретного, известного из контекста Бога и не требует по-русски выражения «этот Бог», которое внесло бы лишний контраст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для широкого читателя; еврейская идиома передана по смыслу, а её конкретный образ вынесен в сноску.
