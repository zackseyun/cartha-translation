base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/020.yaml
  text: Then Samuel brought near all the tribes of Israel[a], and the tribe of Benjamin was taken.
translation:
  language: ru
  text: Тогда Самуил представил все колена Израиля, и было избрано колено Вениамина[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «было взято». Здесь речь идёт об избрании посредством жребия.'
    reason: Сноска сохраняет буквальное значение еврейского глагола לכד и поясняет его контекстуальный смысл.
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: подвёл
  rationale: Порода хифиль глагола קרב означает «приблизить, подвести». «Подвёл» естественно передаёт действие Самуила, представляющего колена для определения по жребию.
- source_word: שְׁמוּאֵל
  choice: Самуил
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: все колена Израиля
  rationale: Точно передаёт собирательный охват כָּל и сохраняет принятую библейскую русскую терминологию.
- source_word: וַיִּלָּכֵד
  choice: было избрано
  rationale: Нифаль глагола לכד буквально означает «быть взятым, схваченным», но здесь обозначает результат определения посредством жребия. «Было избрано» ясно и естественно передаёт контекстуальный смысл; буквальный образ сохранён в сноске.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: колено Вениамина
  rationale: Естественная для русского библейского регистра передача сочетания существительного с именем родоначальника.
theological_decisions:
- issue: Неуказанный деятель при избрании
  choice: Сохранена пассивная конструкция «было избрано» без называния действующего лица.
  alternative: «Господь избрал» или «жребий указал на»
  rationale: Еврейский текст сообщает результат, но прямо не называет ни Бога, ни жребий грамматическим деятелем; перевод не должен устранять эту сдержанность.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой («колена Израиля»). Синтаксис краткий и торжественный, но понятный обычному читателю.
