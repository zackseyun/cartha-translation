  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶת פַּ֥ךְ הַ/שֶּׁ֛מֶן וַ/יִּצֹ֥ק עַל רֹאשׁ֖/וֹ וַ/יִּשָּׁקֵ֑/הוּ וַ/יֹּ֕אמֶר הֲ/ל֗וֹא כִּֽי מְשָׁחֲ/ךָ֧ יְהוָ֛ה עַל נַחֲלָת֖/וֹ לְ/נָגִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/001.yaml
  text: Then Samuel took the flask of oil and poured it on his head and kissed him[a], and said, “Has not Yahweh anointed you as ruler over his inheritance?”
translation:
  language: ru
  text: 'Тогда Самуил взял сосуд с маслом, вылил масло на голову Саула, поцеловал его и сказал: «Разве не Яхве помазал тебя правителем[a] над своим наследием?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вождём»; возможно также: «князем». Еврейское слово означает человека, поставленного руководить, и по оттенку не тождественно титулу «царь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּךְ הַשֶּׁמֶן
  choice: сосуд с маслом
  rationale: פַּךְ обозначает небольшой сосуд. «Сосуд с маслом» звучит естественно и сохраняет конкретный образ, не уточняя форму ёмкости сверх сказанного в еврейском тексте.
- source_word: וַיִּצֹק עַל רֹאשׁוֹ
  choice: вылил масло на голову Саула
  rationale: יצק означает «лить, выливать». Повтор слова «масло» вместо местоимения делает русскую фразу яснее; имя Саула эксплицирует подразумеваемого адресата без изменения смысла.
- source_word: וַיִּשָּׁקֵהוּ
  choice: поцеловал его
  rationale: Глагол נשׁק здесь прямо обозначает поцелуй; жест не следует смягчать или истолковывать в самом тексте.
- source_word: הֲלוֹא כִּי
  choice: Разве не
  rationale: Сочетание вводит риторический вопрос с ожидаемым утвердительным ответом. «Разве не» естественно передаёт эту силу по-русски.
- source_word: מְשָׁחֲךָ
  choice: помазал тебя
  rationale: משׁח — обычный термин для ритуального помазания, в данном контексте связанного с поставлением на управление.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: נַחֲלָתוֹ
  choice: своим наследием
  rationale: נַחֲלָה означает наследие или удел. «Наследие» сохраняет представление об Израиле как принадлежащем Яхве народе.
- source_word: לְנָגִיד
  choice: правителем
  rationale: נָגִיד обозначает поставленного руководить и не вполне совпадает по оттенку с более определённым титулом «царь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, поэтому сохранено личное имя Бога в распространённой научной русской форме.
- issue: Передача נָגִיד в контексте поставления Саула
  choice: правитель
  alternative: вождь; князь
  rationale: «Правитель» передаёт порученную власть, не отождествляя термин безоговорочно с формальным титулом «царь».
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Риторический вопрос сохранён. Местоимение «своим» оставлено со строчной буквы по современным нормам; двусмысленность здесь отсутствует, поскольку ближайший субъект — Яхве.
