  text: וַ/יִּשְׁאֲלוּ עוֹד֙ בַּֽ/יהוָ֔ה הֲ/בָ֥א ע֖וֹד הֲלֹ֣ם אִ֑ישׁ וַ/יֹּ֣אמֶר יְהוָ֔ה הִנֵּה ה֥וּא נֶחְבָּ֖א אֶל הַ/כֵּלִֽים־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/022.yaml
  text: So they inquired of Yahweh again[a], “Has the man come here yet?” And Yahweh said, “Behold, he has hidden himself among the baggage.”
translation:
  language: ru
  text: 'И они снова вопросили Яхве: «Пришёл ли уже сюда этот человек?» Яхве ответил: «Вот, он спрятался среди поклажи[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «среди вещей (предметов)». Еврейское слово может обозначать утварь, принадлежности, снаряжение или поклажу; здесь, вероятно, имеются в виду вещи собравшихся людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ עוֹד בַּיהוָה
  choice: И они снова вопросили Яхве
  rationale: Глагол שׁאל с предлогом בְּ при имени Бога обозначает обращение за ответом, а не обычный вопрос. «Вопросили» сохраняет торжественный повествовательный регистр и значение обращения к Богу; עוֹד передаёт повторность действия.
- source_word: הֲבָא עוֹד הֲלֹם אִישׁ
  choice: Пришёл ли уже сюда этот человек?
  rationale: Совершенный вид בוא спрашивает, состоялось ли прибытие; «уже» естественно передаёт контекстуальное значение עוֹד. Хотя אִישׁ формально без артикля, из контекста ясно, что речь идёт о разыскиваемом человеке — Сауле; «этот человек» сохраняет косвенное именование.
- source_word: וַיֹּאמֶר יְהוָה
  choice: Яхве ответил
  rationale: Буквально употреблено «сказал», однако в русском диалоге «ответил» естественно выражает функцию реплики и не добавляет нового содержания.
- source_word: הִנֵּה
  choice: Вот
  rationale: «Вот» передаёт указательно-эмфатическую силу הִנֵּה без архаичного оттенка.
- source_word: נֶחְבָּא
  choice: он спрятался
  rationale: 'Нифаль глагола חבא в данном контексте имеет возвратное значение: Саул сам скрылся. Совершенный вид передаёт результативное состояние.'
- source_word: אֶל הַכֵּלִים
  choice: среди поклажи
  rationale: כֵּלִים — широкое обозначение вещей, принадлежностей или снаряжения. В сцене народного собрания «поклажа» естественно обозначает сложенные дорожные вещи, за которыми можно спрятаться.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте дважды стоит собственное заветное имя יהוה. Передача «Яхве» отличает его от титула אֲדֹנָי и следует указанному решению сохранять личное имя в основном тексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным тоном. «Вопросили» выбрано как понятное, но торжественное обозначение обращения к Богу; «вот» сохраняет живую указательность оригинала. Маркер сноски поставлен непосредственно после слова, к которому относится пояснение.
