    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלוּ לְךָ לְשָׁלוֹם
  choice: Они спросят, как ты поживаешь
  rationale: Еврейское сочетание буквально означает вопрос о мире или благополучии человека и в данном контексте передаёт приветствие с вопросом о его состоянии. Русская формулировка естественно сохраняет смысл личного расспроса.
- source_word: שְׁתֵּי לֶחֶם
  choice: два хлеба
  rationale: В счётном употреблении לֶחֶם обозначает отдельные хлебы. По-русски «два хлеба» естественно и не требует добавления слова «буханки», которое неоправданно уточняло бы форму.
- source_word: וְלָקַחְתָּ מִיָּדָם
  choice: ты примешь их из их рук
  rationale: לקח буквально значит «взять», но при передаче дара естественно означает «принять». Форма «из их рук» сохраняет образ непосредственной передачи, выраженный еврейским מִיָּדָם.
