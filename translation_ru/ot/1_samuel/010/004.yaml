  text: They will ask you about your welfare and give you two loaves of bread[c][b][a], and you shall receive them from their hand.
translation:
  language: ru
  text: Они спросят, как ты поживаешь,[a] и дадут тебе два хлеба, и ты примешь их из их рук.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они поприветствуют тебя». Буквально еврейское выражение означает, что они спросят о твоём благополучии.'
    reason: lexical_alternative
  - marker: b
