base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/009.yaml
  text: And it happened[a], when he turned his back to go from Samuel, that God gave him another heart[b], and all these signs came to pass on that day.
translation:
  language: ru
  text: И когда он повернулся, чтобы уйти от Самуила[a], Бог переменил ему сердце — оно стало иным[b], и в тот день произошли все эти знамения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «повернул своё плечо, чтобы уйти от Самуила»; это образное выражение означает уход.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Бог дал ему иное сердце». Еврейское выражение передаёт Божье изменение внутреннего расположения человека.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: И когда
  rationale: В сочетании с последующим временным оборотом вводит событие; отдельное «и случилось» в современном русском было бы тяжеловесно и синтаксически избыточно.
- source_word: כְּהַפְנֹתוֹ שִׁכְמוֹ
  choice: когда он повернулся, чтобы уйти
  rationale: Буквально говорится о повороте плеча; это еврейская идиома ухода, которую естественно передаёт русский глагол «повернулся» вместе с целью действия.
- source_word: לָלֶכֶת מֵעִם שְׁמוּאֵל
  choice: чтобы уйти от Самуила
  rationale: Естественно передаёт инфинитив движения и удаление от Самуила.
- source_word: וַיַּהֲפָךְ לֹו אֱלֹהִים לֵב אַחֵר
  choice: Бог изменил его сердце, сделав его иным
  rationale: Сохраняет каузативное значение «изменил/обратил» и образ «иного сердца», не сводя перемену к конкретной доктринальной категории.
- source_word: וַיָּבֹאוּ כָּל הָאֹתוֹת הָאֵלֶּה
  choice: исполнились все эти знамения
  rationale: В контексте заранее названных знамений русский глагол «исполнились» естественно выражает то, что они произошли, хотя буквально еврейский текст говорит, что они «пришли».
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Стандартная и естественная передача временного выражения.
theological_decisions:
- issue: Характер изменения сердца Саула
  choice: Бог изменил его сердце, сделав его иным
  alternative: Бог дал ему иное сердце
  rationale: Формулировка указывает на действительное произведённое Богом внутреннее изменение, но не определяет его как возрождение, обращение или только дарование смелости для царского служения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Знамения» сохраняет религиозно-повествовательную окраску; синтаксис упрощён без устранения неоднозначности выражения об изменении сердца.
