    rationale: Она заменяет именную конструкцию «иное сердце» пояснительным результатом и может звучать так, будто Бог лишь сделал прежнее сердце иным. Следует сохранить образ «иного сердца», насколько это позволяет русский язык.
  - severity: low
    issue: «Исполнились все эти знамения»
    rationale: В контексте это возможно, но еврейский глагол означает, что знамения пришли/произошли. «Исполнились» добавляет более выраженный оттенок исполнения пророчества.
  - severity: low
    issue: Сноска b называет «изменил ему иное сердце» буквальным переводом
    rationale: Это русская калька, неудобная как формулировка буквального значения. Сноска должна объяснять конструкцию, не выдавая неестественную русскую фразу за точную буквальность.
