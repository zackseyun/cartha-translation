base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/006.yaml
  text: Then the Spirit of Yahweh will rush upon you[a], and you will prophesy with them[b], and be turned into another man.
translation:
  language: ru
  text: Тогда Дух Яхве мощно сойдёт на тебя[a], и ты будешь пророчествовать вместе с ними и станешь другим человеком[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с силой снизойдёт на тебя».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будешь изменён и станешь другим человеком».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָלְחָה עָלֶיךָ
  choice: мощно сойдёт на тебя
  rationale: В сочетании с רוּחַ יְהוָה глагол צלח обозначает сильное, действенное нисхождение Духа на человека, а не преуспевание. Формулировка передаёт силу действия и естественно звучит по-русски.
- source_word: רוּחַ יְהוָה
  choice: Дух Яхве
  rationale: רוּחַ здесь означает Божьего Духа, а личное имя יהוה передано как «Яхве», что соответствует предоставленному консультационному тексту и сохраняет отличие имени от титула «Господь».
- source_word: וְהִתְנַבִּיתָ עִמָּם
  choice: ты будешь пророчествовать вместе с ними
  rationale: Форма хитпаэль глагола נבא обозначает участие в пророческой деятельности; עִמָּם прямо выражает совместность действия.
- source_word: וְנֶהְפַּכְתָּ לְאִישׁ אַחֵר
  choice: и станешь другим человеком
  rationale: Естественная русская идиома передаёт изменение состояния, выраженное нифалем הפך, не уточняя его богословский характер или продолжительность. «Человеком» здесь относится к Саулу и не устраняет мужскую соотнесённость контекста.
theological_decisions:
- issue: Характер перемены Саула
  choice: Сохранено прямое утверждение, что Саул станет другим человеком, без уточнения природы и постоянства этой перемены.
  alternative: Понять выражение либо только как внешний пророческий экстаз, либо как полное внутреннее духовное обновление.
  rationale: Еврейский текст говорит о действии Духа, пророчествовании и реальной перемене Саула, но не определяет её как возрождение, постоянное нравственное преображение или лишь внешний опыт.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Союзная последовательность еврейского текста сохранена без тяжеловесности; богословская неоднозначность последней фразы не разрешается толкованием.
