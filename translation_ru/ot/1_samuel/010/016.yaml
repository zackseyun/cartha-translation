base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/016.yaml
  text: Saul said to his uncle[b][a], “He plainly told us that the donkeys had been found.” But he did not tell him about the matter of the kingship that Samuel had spoken of.
translation:
  language: ru
  text: 'Саул ответил своему дяде: «Он ясно сказал нам, что ослицы нашлись».[a] Но о царской власти[b], о которой говорил Самуил, Саул ему не рассказал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте глагол «сказать» употреблён в усилительной конструкции: «действительно (или ясно) сказал».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «о царстве» либо «о царском достоинстве». Здесь, вероятнее всего, имеется в виду предназначенная Саулу царская власть, а не царство как территория.'
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: своему дяде
  rationale: В данном повествовательном контексте דּוֹד обозначает родственника — дядю Саула, а не «возлюбленного».
- source_word: הַגֵּד הִגִּיד
  choice: ясно сказал
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает высказывание; «ясно сказал» естественно передаёт эту эмфазу по-русски.
- source_word: נִמְצְאוּ
  choice: нашлись
  rationale: 'Русское «нашлись» естественно передаёт контекстуальное значение пассивной формы: пропавшие животные были найдены.'
- source_word: הָאֲתֹנוֹת
  choice: ослицы
  rationale: Еврейское существительное прямо обозначает самок осла; в русском «ослицы» звучит естественно и сохраняет эту деталь.
- source_word: דְּבַר הַמְּלוּכָה
  choice: о царской власти
  rationale: דָּבָר здесь означает дело или предмет разговора, а מְלוּכָה в контексте относится к царскому достоинству и власти, предназначенным Саулу, а не прежде всего к территории государства.
- source_word: לֹא הִגִּיד לוֹ
  choice: Саул ему не рассказал
  rationale: Повтор имени устраняет возможную неясность русского местоименного ряда, сохраняя Саула как подлежащее, а дядю — как адресата.
- source_word: אֲשֶׁר אָמַר שְׁמוּאֵל
  choice: о которой говорил Самуил
  rationale: Относительное придаточное естественно связывается с «царской властью» и не добавляет содержания сверх сказанного в еврейском тексте.
theological_decisions:
- issue: Значение מְלוּכָה
  choice: царская власть
  alternative: царство
  rationale: В непосредственном контексте речь идёт о царском статусе и правлении Саула. Вариант «царство» возможен лексически, поэтому сохранён в примечании, но может быть понят как территория.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. «Ослицы» сохраняет конкретность оригинала без стилистической тяжеловесности; повтор имени «Саул» предотвращает двусмысленность.
