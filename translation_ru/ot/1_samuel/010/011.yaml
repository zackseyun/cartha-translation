  text: וַ/יְהִ֗י כָּל יֽוֹדְע/וֹ֙ מֵ/אִתְּמ֣וֹל שִׁלְשׁ֔וֹם וַ/יִּרְא֕וּ וְ/הִנֵּ֥ה עִם נְבִאִ֖ים נִבָּ֑א וַ/יֹּ֨אמֶר הָ/עָ֜ם אִ֣ישׁ אֶל רֵעֵ֗/הוּ מַה זֶּה֙ הָיָ֣ה לְ/בֶן קִ֔ישׁ הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִיאִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/011.yaml
  text: And it happened that all who had known him formerly saw[a], and behold, he was prophesying with the prophets. So the people said, each man to his neighbor[b], “What has happened to the son of Kish? Is Saul also among the prophets?”
translation:
  language: ru
  text: 'И когда все, кто знал его прежде[a], увидели его — и вот, он пророчествует вместе с пророками, — люди стали говорить друг другу: «Что случилось с сыном Киса? Неужели и Саул среди пророков?[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кто знал его со вчерашнего дня и позавчера» — еврейское выражение со значением «кто знал его прежде».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Неужели даже Саул среди пророков?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹדְעוֹ מֵאִתְּמוֹל שִׁלְשׁוֹם
  choice: кто знал его прежде
  rationale: Еврейское выражение буквально означает «кто знал его со вчерашнего и третьего дня», но идиоматически указывает на прежнее знакомство; «знал его прежде» естественно передаёт этот смысл.
- source_word: וַיְהִי
  choice: И когда
  rationale: В данном предложении повествовательная формула вводит обстоятельственную сцену, завершающуюся реакцией людей; русская конструкция с «когда» ясно и естественно передаёт синтаксическую связь.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: увидели, что вот
  rationale: «Вот» сохраняет выраженные словом וְהִנֵּה внезапность и удивление, не утяжеляя современную русскую фразу.
- source_word: עִם נְבִאִים
  choice: вместе с пророками
  rationale: Так сохраняется прямое значение предлога עִם — совместное действие, а также отличие от בַּנְּבִיאִים в заключительном вопросе, переданного как «среди пророков».
- source_word: נִבָּא
  choice: пророчествует
  rationale: Форма обозначает наблюдаемое продолжающееся пророческое действие и не утверждает, что Саул получил постоянное служение пророка.
- source_word: הָעָם אִישׁ אֶל רֵעֵהוּ
  choice: люди стали говорить друг другу
  rationale: Русское «друг другу» естественно передаёт распределительную идиому «каждый своему ближнему», а «люди» здесь уместнее буквального и тяжеловесного «народ».
- source_word: מַה זֶּה הָיָה לְבֶן קִישׁ
  choice: Что случилось с сыном Киса?
  rationale: Передаёт удивление внезапной переменой в Сауле без добавочного истолкования.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִים
  choice: Неужели и Саул среди пророков?
  rationale: «Неужели» передаёт удивлённый характер вопроса, а «и» сохраняет значение גַם; выражение не предрешает, является ли Саул пророком по постоянному статусу.
theological_decisions:
- issue: Характер пророческой деятельности Саула
  choice: он пророчествует вместе с пророками
  alternative: он пребывает в пророческом исступлении вместе с пророками
  rationale: Глагол сообщает о пророческой деятельности, но сам по себе не требует понимать её как исступление и не утверждает постоянного вступления Саула в пророческое служение.
- issue: Смысл заключительного вопроса
  choice: Неужели и Саул среди пророков?
  alternative: Разве Саул тоже из пророков?
  rationale: «Среди пророков» сохраняет пространственно-групповую неоднозначность еврейского выражения и не превращает вопрос в однозначное утверждение о принадлежности Саула к пророческому сословию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены неожиданность сцены через «вот», различие между «вместе с пророками» и «среди пророков», а также открытый вопрос о характере и статусе пророческой деятельности Саула.
