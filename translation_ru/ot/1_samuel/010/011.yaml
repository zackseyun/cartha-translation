    rationale: Фраза מֵאִתְּמוֹל שִׁלְשׁוֹם буквально содержит «со вчера и позавчера» / «со вчерашнего дня и позавчера», а не «со вчерашнего и третьего дня».
  - severity: low
    issue: Неестественная конструкция «увидели, что вот, он...»
    rationale: В современном русском «вот» неестественно вставлено после союза «что». Перестройка с прямым предъявлением наблюдаемой сцены сохраняет функцию וְהִנֵּה без потери смысла.
  - severity: low
