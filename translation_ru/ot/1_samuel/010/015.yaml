  text: Then Saul’s uncle said[a], “Please tell me what Samuel said to you.”
translation:
  language: ru
  text: 'Тогда дядя Саула сказал: «Расскажи мне, пожалуйста, что сказал вам[a] Самуил».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте «вам» стоит во множественном числе и, вероятно, относится к Саулу и его слуге.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Форма с повествовательным וַ־ продолжает последовательность событий; «тогда» естественно передаёт движение рассказа.
- source_word: דּוֹד שָׁאוּל
  choice: дядя Саула
  rationale: דּוֹד в данном контексте обозначает дядю, а сочетание имён образует конструкцию принадлежности.
- source_word: הַגִּידָה נָּא לִי
  choice: Расскажи мне, пожалуйста
  rationale: Побудительная форма глагола נגד означает «сообщить, рассказать», а частица נָא придаёт просьбе вежливый, просительный оттенок.
- source_word: מָה
  choice: что
  rationale: Вводит косвенный вопрос о содержании слов Самуила.
- source_word: אָמַר
  choice: сказал
  rationale: Сохраняет обычное и нейтральное значение глагола אמר.
- source_word: לָכֶם
  choice: вам
  rationale: Еврейская форма имеет второе лицо мужского рода множественного числа; русское «вам» точно сохраняет число, хотя без контекста может восприниматься и как вежливое обращение к одному человеку.
- source_word: שְׁמוּאֵל
  choice: Самуил
  rationale: Использована традиционная русская библейская форма имени.
