base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/012.yaml
  text: 'Then a man from there answered and said[a], “And who is their father?” Therefore it became a proverb: “Is Saul also among the prophets?”'
translation:
  language: ru
  text: 'Тогда один человек из того места ответил: «А кто их отец?[a]» Поэтому и возникла поговорка: «Неужели и Саул среди пророков?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А кто его отец?» Некоторые понимают этот вопрос как относящийся непосредственно к Саулу, однако масоретский текст читает «их отец».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: возразил
  rationale: Глагол ענה в повествовании вводит ответную реплику; «возразил» естественно передаёт реакцию говорящего на сказанное ранее и подходит контексту.
- source_word: אִישׁ מִשָּׁם
  choice: один из местных жителей
  rationale: Буквально «человек оттуда»; выбранная формулировка ясно и естественно обозначает неназванного человека из той местности.
- source_word: וּמִי אֲבִיהֶם
  choice: А кто их отец?
  rationale: Масоретская огласовка указывает на суффикс 3-го лица множественного числа — «их». Перевод сохраняет это число и не сводит вопрос исключительно к происхождению Саула.
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Оборот вводит следствие и происхождение последующей поговорки.
- source_word: הָיְתָה לְמָשָׁל
  choice: появилась поговорка
  rationale: מָשָׁל здесь означает устойчивое изречение; по-русски «появилась поговорка» естественно передаёт становление выражения общеупотребительным.
- source_word: הֲגַם
  choice: Неужели и
  rationale: Сочетание вопросительной частицы с גַּם выражает удивление по поводу включения Саула в эту группу; «неужели и» сохраняет риторическую окраску.
- source_word: בַּנְּבִאִים
  choice: среди пророков
  rationale: Предлог ב в данном контексте обозначает принадлежность к группе; «среди пророков» точно и идиоматично передаёт смысл.
theological_decisions:
- issue: К кому относится местоимение в вопросе об отце
  choice: 'Сохранено масоретское множественное число: «их отец», то есть отец пророков как группы.'
  alternative: «Кто его отец?» — вопрос, относимый непосредственно к Саулу.
  rationale: Форма אֲבִיהֶם морфологически является формой множественного числа. Она позволяет понять реплику как указание на то, что пророчество не определяется происхождением от общего отца. Сингулярное толкование не принято без текстового основания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировки рассчитаны на широкого читателя; риторическое удивление передано частицей «неужели», а масоретское множественное число сохранено без конфессионального истолкования.
