  text: בְּ/לֶכְתְּ/ךָ֤ הַ/יּוֹם֙ מֵ/עִמָּדִ֔/י וּ/מָצָאתָ֩ שְׁנֵ֨י אֲנָשִׁ֜ים עִם קְבֻרַ֥ת רָחֵ֛ל בִּ/גְב֥וּל בִּנְיָמִ֖ן בְּ/צֶלְצַ֑ח וְ/אָמְר֣וּ אֵלֶ֗י/ךָ נִמְצְא֤וּ הָ/אֲתֹנוֹת֙ אֲשֶׁ֣ר הָלַ֣כְתָּ לְ/בַקֵּ֔שׁ וְ/הִנֵּ֨ה נָטַ֤שׁ אָבִ֨י/ךָ֙ אֶת דִּבְרֵ֣י הָ/אֲתֹנ֔וֹת וְ/דָאַ֤ג לָ/כֶם֙ לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לִ/בְנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/002.yaml
  text: When you leave me today[a], you will find two men near Rachel’s tomb in the territory of Benjamin at Zelzah, and they will say to you, ‘The donkeys that you went to look for have been found, and look, your father has stopped caring about the donkeys and is anxious about you, saying[c][b], “What shall I do about my son?”’
translation:
  language: ru
  text: 'Когда ты сегодня уйдёшь от меня, то встретишь двух человек у гробницы Рахили, на территории Вениамина[a], в Целцахе. Они скажут тебе: «Ослицы, которых ты ходил искать, нашлись. Вот, твой отец перестал беспокоиться об ослицах и теперь тревожится о вас[b], говоря: „Что же мне делать с моим сыном?“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у границы Вениамина». Еврейское слово может означать как границу, так и территорию.'
    reason: lexical_alternative
  - marker: b
    text: «О вас» — во множественном числе; вероятно, имеются в виду Саул и сопровождавший его слуга.
    reason: grammatical_clarification
lexical_decisions:
- source_word: בְּלֶכְתְּךָ הַיּוֹם מֵעִמָּדִי
  choice: Когда ты сегодня уйдёшь от меня
  rationale: Конструкция с инфинитивом задаёт время действия; выражение מֵעִמָּדִי буквально указывает на уход от присутствия Самуила. Русская формулировка естественно передаёт этот смысл.
- source_word: וּמָצָאתָ
  choice: то встретишь
  rationale: В пророческом контексте форма обозначает предстоящее событие. Для встречи с людьми русское «встретишь» естественнее буквального «найдёшь».
- source_word: עִם קְבֻרַת רָחֵל
  choice: у гробницы Рахили
  rationale: עִם здесь имеет локативное значение «у, возле», а קְבֻרָה обозначает место погребения.
- source_word: בִּגְבוּל בִּנְיָמִן
  choice: на территории Вениамина
  rationale: גְּבוּל может обозначать как границу, так и ограниченную ею территорию. В основном тексте выбрано естественное контекстуальное значение, а неоднозначность сохранена в сноске.
- source_word: נִמְצְאוּ הָאֲתֹנוֹת
  choice: Ослицы ... нашлись
  rationale: אָתוֹנוֹת прямо обозначает ослиц; русская возвратная форма «нашлись» естественно передаёт результативный пассив еврейского текста.
- source_word: נָטַשׁ אָבִיךָ אֶת דִּבְרֵי הָאֲתֹנוֹת
  choice: твой отец оставил заботу об ослицах
  rationale: דִּבְרֵי здесь означает «дело, вопрос», а נָטַשׁ — оставление этого дела. «Оставил заботу» сохраняет образ исходного выражения и ясно показывает перенос внимания от ослиц к сыну.
- source_word: וְדָאַג לָכֶם
  choice: и теперь беспокоится о вас
  rationale: דאג выражает тревожную заботу. לָכֶם имеет форму множественного числа и, вероятно, относится к Саулу и сопровождавшему его слуге; русское «вас» сохраняет это число.
- source_word: מָה אֶעֱשֶׂה לִבְנִי
  choice: Что мне делать ради моего сына?
  rationale: Ламед указывает на направленность заботы или действия по отношению к сыну. «Ради моего сына» передаёт обеспокоенность отца, не создавая возможного русского оттенка «что делать с ним».
