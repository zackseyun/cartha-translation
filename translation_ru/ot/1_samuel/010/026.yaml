  text: וְ/גַ֨ם שָׁא֔וּל הָלַ֥ךְ לְ/בֵית֖/וֹ גִּבְעָ֑תָ/ה וַ/יֵּלְכ֣וּ עִמּ֔/וֹ הַ/חַ֕יִל אֲשֶׁר נָגַ֥ע אֱלֹהִ֖ים בְּ/לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/026.yaml
  text: Saul also went to his home at Gibeah[b][a], and with him went the valiant men whose hearts God had touched.
translation:
  language: ru
  text: Саул тоже пошёл к себе домой, в Гиву, и вместе с ним пошли доблестные люди[a], сердец которых коснулся Бог[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мужественные люди»; возможно также: «воины».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «коснулся их сердец». Здесь «сердце» означает внутреннего человека, включая его волю, мысли и расположение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: тоже
  rationale: Передаёт присоединение и продолжение повествования естественным для современного русского языка способом.
- source_word: הָלַךְ לְבֵיתוֹ גִּבְעָתָה
  choice: пошёл к себе домой, в Гиву
  rationale: Сохраняет и указание на дом Саула, и направительную форму названия города; запятая показывает, что дом находился в Гиве.
- source_word: וַיֵּלְכוּ עִמּוֹ
  choice: и вместе с ним пошли
  rationale: Сохраняет последовательность еврейского повествования и подчёркивает сопровождение Саула.
- source_word: הַחַיִל
  choice: доблестные люди
  rationale: В данном контексте обозначает группу способных, мужественных людей, а не войско как учреждение; примечание сохраняет возможный воинский оттенок.
- source_word: אֲשֶׁר נָגַע אֱלֹהִים בְּלִבָּם
  choice: сердец которых коснулся Бог
  rationale: Буквально сохраняет метафору Божьего воздействия на внутреннее расположение людей, не уточняя его механизм и не сводя «сердце» лишь к чувствам.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В контексте речь идёт о Боге Израиля.
- source_word: לֵב
  choice: сердец
  rationale: Еврейское слово охватывает внутреннего человека — мысли, волю и расположение; традиционное русское «сердце» сохраняет эту ёмкость образа.
theological_decisions:
- issue: Характер Божьего действия, когда Он коснулся сердец этих людей
  choice: 'Сохранить образ: «сердец которых коснулся Бог»'
  alternative: «сердца которых Бог побудил» или «расположил»
  rationale: Исходный текст утверждает Божью инициативу и воздействие на внутреннее расположение людей, но не объясняет его механизм. Буквальная метафора не вводит представлений ни о принуждении, ни об обращении, ни только об эмоциональном воодушевлении.
translation_notes:
  register: Современный литературный русский язык с естественным повествовательным строем и сохранением библейской метафоры. Формулировка понятна широкому читателю, но остаётся достойной и не привносит конфессиональных толкований.
