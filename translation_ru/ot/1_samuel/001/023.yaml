base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/023.yaml
  text: And Elqanah her husband said to her[a], “Do what seems good in your eyes. Stay until you have weaned him; only may Yahweh establish his word.” So the woman stayed and nursed her son until she had weaned him.
translation:
  language: ru
  text: 'И сказал ей её муж Елкана: «Делай то, что хорошо в твоих глазах. Оставайся, пока не отнимешь его от груди; только да утвердит Яхве его слово[a]». И осталась женщина и кормила грудью своего сына, пока не отняла его от груди.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подтвердит» или «исполнит его слово». Еврейское выражение может относиться к обещанию Яхве или к делу, о котором только что шла речь.'
    reason: Альтернативные значения и неоднозначность исходного текста.
lexical_decisions:
- source_word: אִישָׁהּ
  choice: её муж
  rationale: В данном контексте אִישׁ с местоименным суффиксом обозначает брачные отношения Елканы с Анной; «её муж» — точная и естественная русская передача.
- source_word: עֲשִׂי הַטּוֹב בְּעֵינַיִךְ
  choice: Делай то, что хорошо в твоих глазах
  rationale: Сохранён прозрачный для русского читателя еврейский образ, выражающий личное суждение о том, как лучше поступить.
- source_word: שְׁבִי
  choice: Оставайся
  rationale: Здесь ישׁב означает не физически сидеть, а оставаться на месте.
- source_word: עַד גָּמְלֵךְ אֹתוֹ / עַד גָּמְלָהּ אֹתוֹ
  choice: пока не отнимешь его от груди / пока не отняла его от груди
  rationale: В контексте ухода за ребёнком גמל обозначает прекращение грудного вскармливания.
- source_word: אַךְ
  choice: только
  rationale: Частица вводит оговорку к данному перед этим разрешению.
- source_word: יָקֵם
  choice: да утвердит
  rationale: Форма выражает пожелание или молитву, а каузативное значение קום передано глаголом «утвердить», не снимающим оттенков подтверждения и исполнения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: דְּבָרוֹ
  choice: своё слово
  rationale: 'Буквальная передача сохраняет неоднозначность דָּבָר: речь может идти о слове, обещании либо о только что высказанном деле.'
- source_word: וַתֵּינֶק
  choice: кормила грудью
  rationale: Так естественно и однозначно передаётся кормление младенца в современном русском языке.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: Сохранено нарицательное существительное исходного текста, а не подставлено имя Анны.
theological_decisions:
- issue: К чему относится выражение «своё слово» в словах Елканы
  choice: Сохранено «своё слово» без уточнения референта и характера слова
  alternative: «своё обещание»; «слово о ребёнке»; «твоё слово/обет, подтверждённый Яхве»
  rationale: Еврейский текст допускает понимание как слова или обещания Яхве, так и дела, о котором только что шла речь. Перевод не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис остаётся ясным для обычного читателя; образ «в твоих глазах» сохранён как значимый еврейский оборот. Местоимения, относящиеся к Богу, даны со строчной буквы согласно нейтральной современной орфографической практике.
