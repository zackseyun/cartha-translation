  text: וַ/תָּ֣קָם חַנָּ֔ה אַחֲרֵ֛י אָכְלָ֥ה בְ/שִׁלֹ֖ה וְ/אַחֲרֵ֣י שָׁתֹ֑ה וְ/עֵלִ֣י הַ/כֹּהֵ֗ן יֹשֵׁב֙ עַל הַ/כִּסֵּ֔א עַל מְזוּזַ֖ת הֵיכַ֥ל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/009.yaml
  text: After they had eaten in Shiloh[a], and after they had drunk, Hannah rose. Now Eli the priest was sitting on the seat by the doorpost of the temple of Yahweh.
translation:
  language: ru
  text: После того как Анна поела в Силоме и выпила, она встала. А священник Илий сидел на стуле у дверного косяка храма Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святилища Яхве».'
    reason: Лексема הֵיכָל может обозначать храм или святилище; второй вариант особенно уместен для священного сооружения в Силоме до постройки храма Соломона.
lexical_decisions:
- source_word: וַתָּקָם
  choice: встала
  rationale: Форма Qal wayyiqtol от קום обозначает, что Анна поднялась со своего места; «встала» естественно передаёт движение повествования.
- source_word: אַחֲרֵי אָכְלָה ... וְאַחֲרֵי שָׁתֹה
  choice: После того как ... поели и выпили
  rationale: Безлично-неопределённая конструкция по-русски естественна в контексте общей трапезы и не вынуждает однозначно выбирать между возможным коллективным и относящимся к Анне пониманием еврейских форм.
- source_word: בְשִׁלֹה
  choice: в Силоме
  rationale: Предлог ב имеет обычное местное значение «в»; «в Силоме» соответствует русской форме названия города.
- source_word: וְעֵלִי הַכֹּהֵן
  choice: Тем временем священник Илий
  rationale: Союз вводит фоновое обстоятельство сцены, поэтому «тем временем» точнее передаёт функцию фразы, чем простое «и».
- source_word: יֹשֵׁב
  choice: сидел
  rationale: Причастие описывает продолжающееся положение Илия; русское прошедшее несовершенного вида передаёт этот фоновый характер.
- source_word: עַל הַכִּסֵּא
  choice: на сиденье
  rationale: כִּסֵּא может означать сиденье, кресло или престол. Нейтральное «сиденье» не привносит царских ассоциаций.
- source_word: עַל מְזוּזַת
  choice: у дверного косяка
  rationale: מְזוּזָה означает дверной косяк, а עַל в данном местном употреблении естественно передаётся предлогом «у».
- source_word: הֵיכַל יְהוָה
  choice: храма Яхве
  rationale: הֵיכָל обозначает храмовое здание или святилище. «Храм» оставлен в основном тексте, а возможный перевод «святилище» указан в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией «Яхве», а не заменено титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Иегова
  rationale: «Яхве» является распространённой современной научной реконструкцией и сохраняет в переводе личное имя, не подменяя его титулом.
- issue: Значение הֵיכַל применительно к Силому
  choice: храм
  alternative: святилище
  rationale: Слово может обозначать как храм, так и святилище. «Храм» лексически оправдан, тогда как исторически понятный вариант «святилище» сохранён в сноске без устранения неоднозначности.
- issue: Субъект действий «ели» и «пили»
  choice: неопределённо-личная формулировка «поели и выпили»
  alternative: «она поела и выпила» или «они поели и выпили»
  rationale: Еврейские формы допускают разбор, связанный с Анной, тогда как контекст семейной трапезы поддерживает коллективное понимание. Русская формулировка сохраняет эту напряжённость без искусственного уточнения субъекта.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным тоном. Безлично-неопределённое «поели и выпили» сохраняет неоднозначность исходного текста и звучит естественно; «тем временем» обозначает фоновую сцену.
