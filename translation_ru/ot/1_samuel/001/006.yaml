lexical_decisions:
- source_word: וְכִעֲסַתָּה
  choice: досаждала
  rationale: Порода пиэль глагола כעס выражает причинение раздражения и огорчения. Несовершенный вид русского глагола передаёт повторяющееся, обычное действие в данном повествовательном контексте.
- source_word: צָרָתָהּ
  choice: её соперница
  rationale: Здесь צָרָה обозначает Пенинну как другую жену Елканы и соперницу Анны внутри семьи. «Соперница» естественно передаёт враждебный характер отношений, а семейно-брачное значение уточняется в сноске.
- source_word: גַּם כַּעַס
  choice: жестоко
  rationale: Сочетание усиливает значение однокоренного глагола כעס. Наречие «жестоко» передаёт интенсивность причиняемого огорчения без неестественного для русского языка повтора.
- source_word: בַּעֲבוּר
  choice: чтобы
  rationale: Предлог вводит цель действий Пенинны; русский союз «чтобы» ясно и естественно передаёт целевое значение.
- source_word: הַרְּעִמָהּ
  choice: привести её в смятение
  rationale: Редкий глагол, вероятно, означает причинение сильного внутреннего волнения или потрясения. Выражение сохраняет эту широту и не сводит действие лишь к раздражению.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, делавшую Анну уязвимой для издевательств соперницы.
- source_word: סָגַר ... בְּעַד רַחְמָהּ
  choice: не давал ей зачать
  rationale: Буквальный образ «закрыл её утробу» является древнееврейской идиомой отсутствия зачатия. Русская формулировка естественно передаёт её смысл и сохраняет продолжающееся в контексте состояние.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Божественная причинность бесплодия Анны
  choice: Яхве не давал ей зачать
  alternative: Анна не могла зачать
  rationale: Выбранный перевод сохраняет явное утверждение исходного текста о действии Яхве и не устраняет заключённое в нём богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Несовершенный вид передаёт повторяемость издевательств; причинная роль Яхве сохранена прямо. Культурно обусловленное значение «соперницы» и неопределённость редкого глагола вынесены в сноски.
