  text: וַֽ/יִּשְׁחֲט֖וּ אֶת הַ/פָּ֑ר וַ/יָּבִ֥יאוּ אֶת הַ/נַּ֖עַר אֶל עֵלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/025.yaml
  text: Then they slaughtered the bull and brought the boy to Eli[a][b].
translation:
  language: ru
  text: И закололи быка, и привели мальчика к Илию[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ребёнка». Еврейское на́ар может в зависимости от контекста означать ребёнка, мальчика или юношу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: И закололи
  rationale: Глагол שׁחט обозначает убой животного; «закололи» естественно передаёт его смысл и сохраняет жертвенный контекст. Союз «и» отражает последовательность повествования, выраженную формой wayyiqtol.
- source_word: הַפָּר
  choice: быка
  rationale: פַּר обычно означает быка, особенно в контексте жертвоприношения; определённость передана контекстуально, без неестественного уточнения.
- source_word: וַיָּבִיאוּ
  choice: и привели
  rationale: Форма продолжает цепь последовательных действий. Поскольку речь идёт о мальчике, русское «привели» здесь естественнее буквального «принесли» и не меняет направления движения.
- source_word: הַנַּעַר
  choice: мальчика
  rationale: נַעַר может обозначать ребёнка, мальчика или юношу. В данном контексте Самуил ещё мал, поэтому «мальчика» наиболее уместно; более широкая возможность отмечена в сноске.
- source_word: אֶל עֵלִי
  choice: к Илию
  rationale: Предлог אֶל выражает движение к лицу; «к Илию» — прямой и естественный русский эквивалент.
theological_decisions:
- issue: Жертвенный оттенок действия שׁחט
  choice: «закололи»
  alternative: «убили»
  rationale: Ближайший контекст связан с жертвоприношением в Силоме. «Закололи» сохраняет культовый оттенок, не добавляя отсутствующих в еврейском тексте пояснений.
translation_notes:
  register: Современный литературный русский язык с лаконичным библейским повествовательным ритмом. Повтор союза «и» сохраняет характер еврейской последовательной наррации, оставаясь естественным по-русски.
