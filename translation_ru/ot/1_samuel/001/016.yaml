base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/016.yaml
  text: Do not regard your servant as a worthless woman[b][a], for out of the abundance of my complaint and my vexation I have spoken until now.
translation:
  language: ru
  text: Не считай твою служанку негодной женщиной[a], ведь от множества моих жалоб и огорчений я говорила до сих пор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дочерью негодности» — еврейское выражение о нравственно порочной или презренной женщине.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן ... לִפְנֵי
  choice: Не считай ...
  rationale: В этом обороте נתן с לִפְנֵי означает не буквальное «дать перед», а «считать, принимать за»; русский глагол «считать» естественно передаёт смысл.
- source_word: אֲמָתְךָ
  choice: свою рабу
  rationale: Слово обозначает служанку; в смиренном самообозначении Анны традиционно-достойное «рабу» сохраняет женский род и обращение к Илию.
- source_word: בַּת בְּלִיָּעַל
  choice: негодной женщиной
  rationale: Буквально «дочь негодности» — идиома о нравственно порочной или презренной женщине. «Негодная женщина» передаёт оценочный и моральный оттенок без буквального калькирования.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит объяснение просьбы; «ведь» естественно связывает оправдание Анны с предшествующим отрицанием.
- source_word: מֵרֹב
  choice: от великой
  rationale: Оборот выражает причину и значительную меру переживания. «От великой» звучит естественно по-русски, сохраняя интенсивность.
- source_word: שִׂיחִי
  choice: скорби
  rationale: Слово допускает значения «размышление», «жалоба», «тревожная речь». В данном контексте оно обозначает мучительное внутреннее переживание, выраженное в молитве; «скорбь» передаёт это без сведения смысла только к словесной жалобе.
- source_word: וְכַעְסִי
  choice: и досады
  rationale: כעס здесь указывает на мучительное раздражение, огорчение или внутреннюю тягость, а не обязательно на гнев. «Досада» сохраняет эмоциональную напряжённость и отличается от «скорби».
- source_word: דִּבַּרְתִּי עַד הֵנָּה
  choice: я говорила до сих пор
  rationale: Совершенная форма в сочетании с «до сих пор» описывает речь, продолжавшуюся вплоть до настоящего момента; русское прошедшее несовершенного вида выражает это естественно.
theological_decisions:
- issue: Нравственный смысл выражения בַּת בְּלִיָּעַל
  choice: негодной женщиной
  alternative: нечестивой женщиной
  rationale: Выбрано более широкое выражение, сохраняющее неоднозначность идиомы между нравственной порочностью и общественной презренностью и не превращающее её в узкий конфессионально-богословский термин.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Обращение «свою рабу» сохраняет смиренную форму женского самообозначения; синтаксис остаётся ясным для обычного читателя.
