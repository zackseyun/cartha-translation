  source_fidelity: 'Перевод точно передаёт реплику Илия: ответ, обращённый к женщине императив «Иди с миром», пожелательный характер глагола יִתֵּן и содержание просьбы. «Исполнит твою просьбу» уместно передаёт буквальное «даст твою просьбу», то есть дарует просимое. Оборот «с которой ты обратилась к Нему» естественно выражает, что просьба была обращена к Богу, и не меняет контекстуально ясный референт מֵעִמּוֹ.'
