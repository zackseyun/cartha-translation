  yaml_path: translation/ot/1_samuel/001/017.yaml
  text: Then Eli answered and said[a], “Go in peace, and may the God of Israel grant your petition that you have asked from him.”
translation:
  language: ru
  text: 'Тогда Илий ответил: «Иди с миром, и пусть Бог Израиля исполнит твою просьбу, с которой ты обратилась к Нему».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ответил
  rationale: Сочетание двух глаголов речи буквально означает «ответил и сказал», но в современном русском повествовании естественно и точно передаётся одним глаголом «ответил».
- source_word: לְכִי לְשָׁלוֹם
  choice: иди с миром
  rationale: Естественная русская передача древнееврейской формулы благословения и доброго напутствия.
- source_word: וֵאלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и понятная передача сочетания, обозначающего Бога, Которому принадлежит Израиль и Которого Израиль исповедует.
- source_word: יִתֵּן
  choice: пусть ... исполнит
  rationale: В данном благословении форма выражает пожелание. «Исполнит» естественно сочетается в русском языке с просьбой и передаёт смысл дарования просимого.
- source_word: שֵׁלָתֵךְ אֲשֶׁר שָׁאַלְתְּ
  choice: твою просьбу, с которой ты обратилась
  rationale: Передаёт как сам предмет прошения, так и родственный ему глагол, избегая тяжеловесного русского повтора «просьбу, которую ты просила».
- source_word: מֵעִמּוֹ
  choice: к Нему
  rationale: Русское выражение «обратиться к Нему с просьбой» естественно передаёт просьбу, направленную Богу; прописная буква ясно указывает на контекстуальный референт местоимения.
theological_decisions:
- issue: К кому относится местоимение מֵעִמּוֹ
  choice: К Богу Израиля
  alternative: Формально местоимение можно было бы оставить менее определённым, без графического указания на референта.
  rationale: Непосредственно назван Бог Израиля, а из предыдущего контекста ясно, что Анна молилась Господу. Поэтому референт достаточно определён самим текстом.
- issue: Характер слов Илия
  choice: 'Пожелание-благословение: «пусть ... исполнит»'
  alternative: 'Утверждение или обещание: «Бог Израиля исполнит».'
  rationale: Форма יִתֵּן в этой речевой формуле естественно выражает пожелание; перевод не превращает слова Илия в безусловное пророческое обещание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «иди с миром» сохранена как понятное торжественное напутствие; синтаксически избыточная для русского языка формула «ответил и сказал» естественно сокращена.
