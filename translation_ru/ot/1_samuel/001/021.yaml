  yaml_path: translation/ot/1_samuel/001/021.yaml
  text: Then the man Elkanah went up with all his household to sacrifice to Yahweh the yearly sacrifice and his vow[a].
translation:
  language: ru
  text: Елкана вместе со всеми своими домочадцами поднялся, чтобы принести Яхве ежегодную жертву и исполнить свой обет[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и свой обет». В еврейском тексте при этих словах подразумевается действие; смысл может быть передан как «исполнить свой обет».'
    reason: лексическая и синтаксическая неоднозначность
lexical_decisions:
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Глагол עלה означает «подниматься, восходить» и здесь описывает паломничество к святилищу в Силоме; «поднялся» сохраняет это пространственное и идиоматическое значение.
- source_word: הָאִישׁ אֶלְקָנָה
  choice: Елкана
  rationale: В русском предложении имя уже однозначно обозначает действующее лицо; буквальное «муж Елкана» звучало бы тяжеловесно и не добавляло бы необходимого смысла.
- source_word: וְכָל־בֵּיתוֹ
  choice: со всем своим домом
  rationale: «Дом» здесь означает весь состав семьи или домочадцев, а не здание. Выражение сохраняет корпоративный оттенок еврейского בַּיִת и остаётся понятным в литературном русском.
- source_word: לִזְבֹּחַ
  choice: чтобы принести … жертву
  rationale: В культовом контексте זבח означает заклать или принести жертву; данная формулировка естественна по-русски.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном יהוה, а не заменяет его титулом.
- source_word: זֶבַח הַיָּמִים
  choice: ежегодную жертву
  rationale: Буквальное «жертва дней» является идиомой регулярного годового жертвоприношения; «ежегодная жертва» ясно передаёт её смысл.
- source_word: וְאֶת־נִדְרוֹ
  choice: и исполнить свой обет
  rationale: В еврейском тексте действие при втором дополнении выражено эллиптически. Русское «исполнить обет» естественно передаёт смысл исполнения принятого на себя обязательства, а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя יהוה; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Характер действия, связанного с обетом
  choice: исполнить свой обет
  alternative: принести … свой обет / и свой обет
  rationale: Еврейская конструкция допускает эллиптическое продолжение управляющего инфинитива, однако не уточняет форму исполнения обета. Перевод передаёт практический смысл, не определяя, в чём именно состоял обет.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Оборот «со всем своим домом» сохраняет древний семейно-корпоративный образ, а смысл эллиптической конструкции разъясняется без перегрузки основного текста.
