base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/001.yaml
  text: There was a certain man from Ramathaim-zophim[a], from the hill country of Ephraim, and his name was Elkanah son of Jeroham, son of Elihu, son of Tohu, son of Zuph, an Ephraimite.
translation:
  language: ru
  text: Жил один человек из Рамафаим-Цофима[a], из нагорья Ефремова. Звали его Елкана; он был сыном Иерохама, сына Елиуя, сына Тоху, сына Цуфа, ефрафянином[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «из Рамафаима, города цуфитян». Еврейское сочетание может пониматься как составное название либо как название места с уточнением.'
    reason: Синтаксис и внутренняя структура топонима רָמָתַיִם צוֹפִים допускают несколько толкований.
  - marker: b
    text: 'Или, возможно: «ефремлянином». В еврейском тексте стоит «ефрафянин»; здесь это слово может употребляться как региональное обозначение человека из Ефрема.'
    reason: Сохраняется неоднозначность этнического или географического обозначения אֶפְרָתִי.
lexical_decisions:
- source_word: וַיְהִי
  choice: Был
  rationale: Обычная повествовательная формула, открывающая рассказ; в русском естественно передаётся без добавочного «ныне» или «и».
- source_word: אִישׁ אֶחָד
  choice: один человек
  rationale: Сочетание вводит определённого, пока ещё не названного участника рассказа; «один человек» естественно сохраняет эту функцию.
- source_word: מִן הָרָמָתַיִם צוֹפִים
  choice: из Рамафаим-Цофима
  rationale: Форма передана как составное географическое название без истолкования его внутренних компонентов.
- source_word: מֵהַר אֶפְרָיִם
  choice: из нагорья Ефремова
  rationale: В территориальном выражении הַר обозначает гористую местность, а не одну гору; «нагорье Ефремово» — ясная и традиционно узнаваемая географическая формулировка.
- source_word: וּשְׁמוֹ
  choice: Звали его
  rationale: Естественная современная русская передача буквального «и имя его», сохраняющая самостоятельность еврейской именной фразы.
- source_word: אֶלְקָנָה
  choice: Елкана
  rationale: Личное имя транслитерировано в принятой русской библейской форме.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶן
  choice: сыном ... сына ... сына ... сына
  rationale: Сохранена явная генеалогическая цепочка «сын», хотя в иных контекстах בֶּן может обозначать и более отдалённого потомка.
- source_word: אֶפְרָתִי
  choice: ефрафянином
  rationale: Основной текст сохраняет формальное значение еврейского прилагательного; возможное контекстуальное понимание «ефремлянин» вынесено в примечание.
theological_decisions:
- issue: Этническое или географическое обозначение אֶפְרָתִי
  choice: ефрафянином
  alternative: ефремлянином
  rationale: Еврейская форма непосредственно соответствует обозначению «ефрафянин», однако упоминание нагорья Ефремова и связь с Цуфом допускают региональное понимание «ефремлянин». Неоднозначность не снимается молча, а отмечается в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным тоном. Синтаксис разделён на два предложения ради ясности, но последовательность сведений оригинала сохранена. Имена даны в привычных русских библейских формах; редкий географический термин пояснён сноской.
