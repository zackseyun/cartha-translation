base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/013.yaml
  text: Hannah was speaking in her heart; only her lips were moving[a], but her voice was not heard. So Eli thought she was drunk.
translation:
  language: ru
  text: 'Анна говорила в сердце своём[a]: лишь губы её двигались, но голоса её не было слышно. Поэтому Илий счёл её пьяной.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорила про себя»; «молилась про себя». Буквально: «говорила в своём сердце».'
    reason: 'Лексическая альтернатива: буквальный еврейский образ допускает более пояснительную передачу внутренней, беззвучной молитвы.'
lexical_decisions:
- source_word: מְדַבֶּרֶת עַל לִבָּהּ
  choice: говорила в сердце своём
  rationale: Передаёт внутреннюю, невысказанную речь и сохраняет еврейский образ; контекст показывает, что речь идёт о беззвучной молитве.
- source_word: רַק
  choice: лишь
  rationale: 'Выражает ограничение: внешне было заметно только движение губ.'
- source_word: שְׂפָתֶיהָ נָּעוֹת
  choice: губы её двигались
  rationale: Естественно передаёт видимое движение губ и длительный характер действия.
- source_word: וְקוֹלָהּ לֹא יִשָּׁמֵעַ
  choice: но голоса её не было слышно
  rationale: Передаёт пассивное значение формы и ясно выражает противопоставление движущимся губам.
- source_word: וַיַּחְשְׁבֶהָ
  choice: счёл её
  rationale: Точно и естественно передаёт значение «посчитал, принял за».
- source_word: לְשִׁכֹּרָה
  choice: пьяной
  rationale: Предикативное прилагательное естественно соответствует еврейскому обозначению опьянённой женщины.
- source_word: וְחַנָּה הִיא
  choice: Анна
  rationale: Русское подлежащее достаточно обозначает тематический акцент; дополнительный вводный маркер не требуется.
