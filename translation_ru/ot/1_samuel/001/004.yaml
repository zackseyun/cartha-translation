  yaml_path: translation/ot/1_samuel/001/004.yaml
  text: And when the day came[a], Elkanah sacrificed and gave portions to Peninnah his wife and to all her sons and daughters.
translation:
  language: ru
  text: И когда наступал день[a], Елкана приносил жертву и давал доли своей жене Феннане и всем её сыновьям и дочерям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И однажды, когда наступил этот день, Елкана принёс жертву и дал доли»; древнееврейские формы можно понимать как обозначение единичного события, хотя контекст позволяет видеть здесь ежегодно повторявшийся обычай.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: когда наступал день жертвоприношения
  rationale: Оборот задаёт время действия; с учётом повторяющегося ежегодного события несовершенный вид естественно передаёт обычность действия. Слово «жертвоприношения» уточняется из непосредственно следующего глагола и позволяет избежать неясного «наступал день».
- source_word: וַיִּזְבַּח
  choice: день жертвоприношения
  rationale: Глагол זבח обозначает совершение жертвенного заклания. В русском предложении его смысл естественно включён во временную конструкцию, без избыточного повторения «приносил жертву».
- source_word: וְנָתַן
  choice: давал
  rationale: Форма может обозначать единичное прошедшее действие, однако контекст ежегодного паломничества допускает и поддерживает обычное, повторявшееся действие; русское несовершенное прошедшее передаёт это естественно.
- source_word: לִפְנִנָּה אִשְׁתּוֹ
  choice: своей жене Феннáне
  rationale: Такой порядок слов естественен для современного русского языка и сохраняет указание, что Феннана была женой Елканы.
- source_word: וּלְכָל בָּנֶיהָ וּבְנוֹתֶיהָ
  choice: и всем её сыновьям и дочерям
  rationale: Сохранено явное упоминание как сыновей, так и дочерей, без обобщения словом «дети».
- source_word: מָנוֹת
  choice: доли
  rationale: Слово означает выделенные части или порции, здесь — от жертвенной трапезы. «Доли» звучит естественно и подчёркивает распределение.
theological_decisions:
- issue: Единичное или обычное действие в וְנָתַן
  choice: 'Передать как повторявшееся действие: «давал»'
  alternative: «дал»
  rationale: Древнееврейская форма допускает простое повествовательное прошедшее, но ближайший контекст описывает ежегодный обычай Елканы. Неопределённость отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Имя פְּנִנָּה передано в традиционной русской библейской форме «Феннана»; добавлено ударение для ясного чтения. Синтаксис сделан естественным, при этом сохранены все участники и распределение долей.
