base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/022.yaml
  text: But Hannah did not go up[a], for she said to her husband, “Not until the boy is weaned will I bring him[b], so that he may appear before Yahweh and stay there forever.”
translation:
  language: ru
  text: 'Но Анна не пошла, потому что сказала мужу: «Я приведу его только после того, как мальчика отнимут от груди, чтобы он предстал перед Яхве[a] и остался там навсегда[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, при ином понимании фразы либо согласно иной текстовой традиции: «и я предстану перед Яхве, а он останется там навсегда».'
    reason: alternative_reading
  - marker: b
    text: Здесь «навсегда» указывает на постоянное посвящение Самуила служению Яхве, то есть до конца его жизни.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָתָה
  choice: не пошла
  rationale: Глагол עלה буквально означает «подниматься, идти вверх» и здесь обозначает путь к святилищу в Силоме. В русском контексте достаточно естественного «не пошла», без неясного буквального «не поднялась».
- source_word: כִּי אָמְרָה לְאִישָׁהּ
  choice: потому что сказала мужу
  rationale: כִּי вводит причину поступка Анны, а אִישׁ с притяжательным суффиксом в данном контексте означает именно мужа.
- source_word: עַד יִגָּמֵל הַנַּעַר
  choice: только после того, как мальчика отнимут от груди
  rationale: 'Передаёт ограничительно-временной смысл עַד: Анна не принесёт ребёнка до его отнятия от груди. Такая формулировка естественна по-русски и сохраняет силу «не раньше чем».'
- source_word: וַהֲבִאֹתִיו
  choice: я приведу его
  rationale: Глагол בוא в каузативной породе означает «привести, принести». Для ребёнка в данном контексте естественно «приведу».
- source_word: וְנִרְאָה אֶת־פְּנֵי יְהוָה
  choice: чтобы он предстал перед Яхве
  rationale: Нифаль глагола ראה в культовой формуле передаёт явление перед Богом. Основной текст понимает подлежащим Самуила, что согласуется с последующим глаголом мужского рода и целью его посвящения; альтернативная традиция отражена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не заменено титулом.
- source_word: וְיָשַׁב שָׁם
  choice: и остался там
  rationale: ישב здесь означает длительное пребывание при святилище. «Остался» звучит естественно и достойно в современном русском языке.
- source_word: עַד עוֹלָם
  choice: навсегда
  rationale: Буквальное и традиционное соответствие выражению, при этом контекстуальный смысл пожизненного посвящения пояснён в сноске.
theological_decisions:
- issue: Кто предстанет перед Яхве
  choice: 'Самуил: «чтобы он предстал перед Яхве»'
  alternative: «и я предстану перед Яхве, а он останется там навсегда»
  rationale: В масоретском тексте последовательность после «я приведу его» наиболее естественно относится к мальчику, который предстанет перед Яхве и останется при святилище. Иное прочтение, засвидетельствованное другой текстовой или синтаксической традицией, сохранено в сноске.
- issue: Значение «навсегда»
  choice: Сохранить формулировку «навсегда» в основном тексте
  alternative: 'Передать толковательно: «до конца жизни»'
  rationale: עַד עוֹלָם следует сохранить без сужения в переводе, а подразумеваемое здесь пожизненное служение разъяснить читателю в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис прямой речи упрощён без утраты временного ограничения и цели посвящения. Сохранены личное имя Яхве, содержательная неоднозначность фразы о предстоянии и буквальное «навсегда» с пояснением.
