  text: וְ/ל/וֹ֙ שְׁתֵּ֣י נָשִׁ֔ים שֵׁ֤ם אַחַת֙ חַנָּ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פְּנִנָּ֑ה וַ/יְהִ֤י לִ/פְנִנָּה֙ יְלָדִ֔ים וּ/לְ/חַנָּ֖ה אֵ֥ין יְלָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/002.yaml
  text: He had two wives. The name of one was Hannah[a], and the name of the second was Peninnah. Peninnah had children, but Hannah had no children.
translation:
  language: ru
  text: 'У него было две жены: одну звали Анна, а вторую — Феннана. У Феннаны были дети, а у Анны детей не было.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹו
  choice: У него было
  rationale: Еврейская предложная конструкция принадлежности буквально означает «и у него», но по-русски в данном контексте естественно передаётся как «у него было»; союз учитывается в связности повествования.
- source_word: שְׁתֵּי נָשִׁים
  choice: две жены
  rationale: В контексте семейных отношений נָשִׁים означает именно «жёны», а не просто «женщины».
- source_word: שֵׁם אַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: одну звали ... а вторую —
  rationale: Естественная современная русская формула сохраняет параллельное представление обеих жён, не воспроизводя тяжеловесно буквальное повторение слова «имя».
- source_word: חַנָּה
  choice: Анна
  rationale: Использована укоренившаяся в русской библейской традиции форма личного имени.
- source_word: פְּנִנָּה
  choice: Феннана
  rationale: Использована укоренившаяся в русской библейской традиции форма личного имени.
- source_word: וַיְהִי לִפְנִנָּה יְלָדִים
  choice: У Феннаны были дети
  rationale: Экзистенциально-притяжательная конструкция передана естественным русским оборотом; יְלָדִים обозначает детей без уточнения пола.
- source_word: וּלְחַנָּה אֵין יְלָדִים
  choice: а у Анны детей не было
  rationale: אֵין выражает отсутствие. Союз «а» естественно подчёркивает заложенное в сопоставлении противопоставление, не усиливая его сверх исходного текста.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; изложение ясное и dignified, с сохранением полигинного семейного контекста и контраста между двумя жёнами. Имена даны в привычных русских библейских формах.
