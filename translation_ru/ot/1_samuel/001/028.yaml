base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/028.yaml
  text: So I also have given him to Yahweh[a]; all the days that he lives[b], he is given to Yahweh.” And he worshiped Yahweh there.
translation:
  language: ru
  text: «Поэтому и я отдала его Яхве[a]; на все дни его жизни он отдан Яхве». И он поклонился там Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский глагол связан с корнем שׁאל («просить; давать взаймы»), который повторяется ранее в рассказе о просьбе Анны. Возможна также передача: «вверила его» или, с сохранением игры слов, «одолжила его». В данном контексте речь идёт о пожизненном посвящении Яхве.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская форма традиционно понимается как единственное число: «он поклонился», хотя субъект не назван. Возможна и передача во множественном числе: «они поклонились».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁאִלְתִּהוּ
  choice: вверяю его
  rationale: Форма породы hифиль от שׁאל перекликается с прежней просьбой Анны и может означать передачу того, кто был испрошен. «Вверяю» естественно передаёт посвящение ребёнка Яхве, не создавая ошибочного впечатления о временном займе; игру корня поясняет сноска.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל выражает направленность передачи или принадлежность, а имя יהוה передано как «Яхве», то есть личным заветным именем, а не титулом.
- source_word: כָּל הַיָּמִים אֲשֶׁר הָיָה
  choice: на все дни, пока он жив
  rationale: Естественное по-русски выражение пожизненного срока, сохраняющее временную полноту исходной фразы.
- source_word: שָׁאוּל
  choice: отдан
  rationale: Причастная форма от שׁאל повторяет корень глагола הִשְׁאִלְתִּהוּ. В контексте речь идёт о передаче и посвящении Яхве; буквальное «одолжен» по-русски звучало бы временно и вводило бы в заблуждение.
- source_word: וַיִּשְׁתַּחוּ
  choice: они поклонились
  rationale: Вокализованный масоретский текст WLC содержит форму множественного числа. «Поклонились» сохраняет и телесный жест, и его богослужебный смысл.
- source_word: שָׁם
  choice: там
  rationale: Прямой и естественный эквивалент наречия места.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя Бога и отличает его от титула.
- issue: Число и субъект וַיִּשְׁתַּחוּ
  choice: они поклонились
  alternative: он поклонился
  rationale: В представленном тексте WLC глагол имеет форму множественного числа, поэтому основной текст следует масоретской вокализации. В ряде древних свидетельств и переводческих традиций встречается единственное число; этот вариант сохранён в сноске без определения конкретного субъекта.
- issue: Характер передачи Самуила Яхве
  choice: пожизненное посвящение
  alternative: временный заём
  rationale: Оборот «на все дни, пока он жив» исключает обычный смысл временного займа. При этом повтор корня שׁאל, связывающий просьбу Анны и её ответное посвящение сына, отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Реплика Анны передана естественно; редкая еврейская игра слов не воспроизводится неуклюжим русским «одолжила», а раскрывается в сноске. Множественное число заключительного глагола следует непосредственно WLC.
