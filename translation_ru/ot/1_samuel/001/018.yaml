base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/018.yaml
  text: She said[a], “May your servant find favor in your eyes.” Then the woman went on her way and ate[b], and her face was no longer downcast.
translation:
  language: ru
  text: 'Она сказала: «Пусть твоя служанка обретёт благоволение в твоих глазах[a]». Затем женщина пошла своей дорогой и поела, и лицо её уже не было таким, как прежде.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Обрести благоволение в глазах» — древнееврейское выражение, означающее встретить благосклонное отношение.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «её лицо уже не было у неё». Это эллиптический древнееврейский оборот; по контексту он означает, что её лицо больше не выражало прежней скорби.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: תִּמְצָא
  choice: пусть … обретёт
  rationale: Форма выражает вежливое пожелание в почтительном обращении, а не простое сообщение о будущем.
- source_word: שִׁפְחָתְךָ
  choice: твоя служанка
  rationale: Слово имеет женский род и здесь служит почтительным самообозначением Анны в разговоре с Илием.
- source_word: חֵן בְּעֵינֶיךָ
  choice: обретёт благоволение в твоих глазах
  rationale: Сохранён понятный по-русски древнееврейский образ, обозначающий благосклонное отношение.
- source_word: לְדַרְכָּהּ
  choice: пошла своей дорогой
  rationale: Естественно передаёт уход женщины и продолжение её пути.
- source_word: וַתֹּאכַל
  choice: поела
  rationale: Передаёт завершённое последующее действие и естественно звучит в повествовательном контексте.
- source_word: וּפָנֶיהָ לֹא הָיוּ לָהּ עוֹד
  choice: и лицо её больше не было печальным
  rationale: Неполное древнееврейское выражение описывает заметную перемену в облике Анны; слово «печальным» восстанавливается по ближайшему контексту, где показано её горе.
theological_decisions:
- issue: Причина перемены в состоянии Анны
  choice: Не уточнять, была ли перемена следствием уверенности в ответе Бога, утешения от слов Илия или обоих факторов
  alternative: Прямо связать её успокоение с верой в исполнение молитвы
  rationale: Стих сообщает о перемене в поведении и лице Анны, но сам не объясняет её богословскую причину.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Почтительная речь Анны передана без архаизмов; образ «в твоих глазах» сохранён как ясный и значимый древнееврейский оборот.
