lexical_decisions:
- source_word: מָרַת נָפֶשׁ
  choice: с горечью в душе
  rationale: Передаёт буквальный образ «горькая душой» естественным русским оборотом, сохраняя смысл глубокого внутреннего страдания.
- source_word: וַתִּתְפַּלֵּל
  choice: молилась
  rationale: Порода хитпаэль глагола פלל здесь имеет обычное значение «молиться»; усиление молитвы ясно из контекста и не добавляется в сам глагол.
- source_word: עַל יְהוָה
  choice: молилась Яхве
  rationale: Предлог עַל при глаголе молитвы указывает на того, к кому она обращена; беспредложное управление «молиться кому» естественно для русского языка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: וּבָכֹה תִבְכֶּה
  choice: горько плакала
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает действие. Русское «горько плакала» естественно выражает сильный плач в данном контексте, хотя конструкция может также подчёркивать его продолжительность.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Направленность молитвы в выражении עַל יְהוָה
  choice: молилась Яхве
  alternative: молилась пред Яхве
  rationale: Контекст допускает понимание Яхве как адресата молитвы. Вариант «пред Яхве» возможен, но менее прямо выражает её обращение к Богу.
