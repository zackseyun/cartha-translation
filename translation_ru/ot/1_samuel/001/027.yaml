  yaml_path: translation/ot/1_samuel/001/027.yaml
  text: For this boy I prayed[b][a], and Yahweh has given me my petition that I asked from him.
translation:
  language: ru
  text: Об этом мальчике я молилась[a], и Яхве дал мне то[b], о чём я Его просила.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «За этого мальчика я молилась». Еврейский предлог может указывать на того, о ком или ради кого возносится молитва.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мою просьбу, которую я просила у Него». В еврейском тексте существительное «просьба» и глагол «просить» образованы от одного корня.'
    reason: source_wordplay
lexical_decisions:
- source_word: אֶל הַנַּעַר הַזֶּה
  choice: Об этом мальчике
  rationale: Предлог אֶל при глаголе «молиться» может обозначать предмет молитвы. Русское «об этом мальчике» естественно передаёт, что Анна молилась о даровании именно этого ребёнка, не создавая впечатления, будто она лишь ходатайствовала за уже имевшегося мальчика.
- source_word: הִתְפַּלָּלְתִּי
  choice: я молилась
  rationale: Прошедшее время соответствует повествовательному контексту; форма женского рода отражает речь Анны.
- source_word: וַיִּתֵּן
  choice: дал мне
  rationale: Прямо передаёт значение еврейского глагола נתן и сохраняет образ полученного от Бога дара без добавления значения «исполнил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֶת שְׁאֵלָתִי אֲשֶׁר שָׁאַלְתִּי מֵעִמּוֹ
  choice: то, о чём я Его просила
  rationale: Естественная современная русская формулировка передаёт просьбу Анны и то, что просимое было дано ей Богом. Формальное повторение однокоренных слов в еврейском отмечено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Характер ответа на молитву
  choice: дал мне то, о чём я Его просила
  alternative: исполнил мою просьбу
  rationale: Выбранный вариант не ослабляет личное действие Бога, но ближе к буквальному значению נתן «дал» и не вводит отсутствующий в тексте глагол «исполнить».
translation_notes:
  register: Современный литературный русский язык; речь Анны звучит просто и достойно. Синтаксис сделан естественным для русского, а еврейское корневое повторение и неоднозначность предлога сохранены в сносках.
