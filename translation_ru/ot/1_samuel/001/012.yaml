  yaml_path: translation/ot/1_samuel/001/012.yaml
  text: And as she continued praying before Yahweh[a], Eli was watching her mouth.
translation:
  language: ru
  text: И когда она продолжала молиться перед Яхве[a], Илий наблюдал за её устами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «И было: когда она продолжала молиться перед Яхве, Илий наблюдал за её устами».'
    reason: Сохраняет более формальное соответствие еврейской повествовательной конструкции וְהָיָה כִּי.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И пока
  rationale: Еврейская повествовательная конструкция вводит обстоятельство, на фоне которого происходит следующее действие. «И пока» естественно передаёт временную одновременность, не утяжеляя русский текст буквальным «и было, когда».
- source_word: הִרְבְּתָה לְהִתְפַּלֵּל
  choice: она долго молилась
  rationale: Форма от רבה в сочетании с инфинитивом выражает продолжительность или усиленное повторение действия. «Долго молилась» ясно и естественно передаёт продолжительную молитву.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» передаёт молитву в присутствии Бога и сохраняет достойный библейский регистр; имя יהוה передано как «Яхве».
- source_word: שֹׁמֵר
  choice: следил
  rationale: Причастие обозначает продолжающееся внимательное наблюдение Илия. «Следил» передаёт длительность действия без добавления оценки его намерений.
- source_word: אֶת פִּיהָ
  choice: за её устами
  rationale: Пִיהָ буквально означает «её рот». «Уста» сохраняет значение исходного слова и в данном контексте звучит естественнее и достойнее, чем «рот», не подменяя его словом «губы», которое появляется в следующем стихе.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон יהוה. Транслитерация «Яхве» сохраняет личное имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенными, но понятными формами «пред» и «уста». Синтаксис сделан плавным, при этом сохранены продолжительность молитвы, одновременность наблюдения Илия и буквальная отсылка ко рту, а не к губам.
