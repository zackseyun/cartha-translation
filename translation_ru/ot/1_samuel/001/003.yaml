  terminology: «Яхве», «Воинств», «поклониться», «принести жертву», «Силом», «Илия», «Офни» и «Финеес» допустимы и соответствуют принятой русской библейской передаче. Сноска корректно фиксирует традиционный вариант титула и её маркер относится к нужному выражению.
