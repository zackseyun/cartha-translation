  source_fidelity: Первая часть точно передаёт регулярное ежегодное восхождение из города Елканы в Силом с целью поклонения и жертвоприношения. «Яхве Воинств» последовательно передаёт יהוה צבאות без привнесения толкования. Во второй части исходное именное предложение сообщает, что в Силоме находились два сына Илия, являвшиеся священниками Яхве; предложенная перестановка точнее и естественнее выражает эту структуру.
