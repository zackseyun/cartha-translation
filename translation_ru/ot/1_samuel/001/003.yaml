  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עָלָה֩ הָ/אִ֨ישׁ הַ/ה֤וּא מֵֽ/עִיר/וֹ֙ מִ/יָּמִ֣ים יָמִ֔ימָ/ה לְ/הִֽשְׁתַּחֲוֺ֧ת וְ/לִ/זְבֹּ֛חַ לַ/יהוָ֥ה צְבָא֖וֹת בְּ/שִׁלֹ֑ה וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י חָפְנִי֙ וּ/פִ֣נְחָ֔ס כֹּהֲנִ֖ים לַ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/003.yaml
  text: That man used to go up from his city year after year to worship and to sacrifice to Yahweh of Armies at Shiloh. And the two sons of Eli[a], Hophni and Phinehas, were there as priests of Yahweh.
translation:
  language: ru
  text: Из года в год этот человек поднимался из своего города в Силом, чтобы поклониться и принести жертву Яхве Воинств[a]. Там были два сына Илия — Офни и Финеес, священники Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в традиционной передаче: «Господу Саваофу».'
    reason: Лексическая альтернатива для титула יהוה צבאות; сноска сохраняет знакомую церковно-библейскую форму, тогда как основной текст прозрачно передаёт значение еврейского выражения.
lexical_decisions:
- source_word: וְעָלָה
  choice: поднимался
  rationale: Форма описывает обычное, регулярно повторявшееся действие в прошлом; несовершенный вид естественно передаёт это значение и сохраняет образ восхождения к месту поклонения.
- source_word: הָאִישׁ הַהוּא
  choice: этот человек
  rationale: Указательное выражение отсылает к уже названному Елкане; русский оборот сохраняет анафорическую определённость.
- source_word: מֵעִירוֹ
  choice: из своего города
  rationale: עִיר означает «город» или «селение»; прямое «город» не требует контекстуального уточнения.
- source_word: מִיָּמִים יָמִימָה
  choice: из года в год
  rationale: Еврейская идиома обозначает ежегодно повторяющееся действие; русский оборот точно и естественно передаёт регулярность.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: поклониться
  rationale: Глагол буквально связан с преклонением или падением ниц, а в культовом контексте обозначает поклонение; выбранный глагол сохраняет оба оттенка лучше, чем отвлечённое «совершить богослужение».
- source_word: וְלִזְבֹּחַ
  choice: принести жертву
  rationale: В культовом контексте речь идёт о совершении жертвоприношения; это естественный современный русский эквивалент.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное заветное имя, а не заменён титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Слово обозначает множества войск или небесных воинств; форма сохраняет смысл титула и не подменяет его более широким толкованием «Всемогущий».
- source_word: בְּשִׁלֹה
  choice: в Силом
  rationale: Использована традиционная русская форма географического имени; предлог естественно обозначает место паломничества и святилища.
- source_word: וְשָׁם
  choice: Там
  rationale: Кратко и прямо сохраняет еврейское указание на место.
- source_word: שְׁנֵי בְנֵי עֵלִי
  choice: два сына Илия
  rationale: Сохранены число и еврейский порядок смысловых компонентов; имя передано в принятой русской библейской форме.
- source_word: חָפְנִי וּפִנְחָס
  choice: Офни и Финеес
  rationale: Употреблены устоявшиеся русские библейские формы личных имён.
- source_word: כֹּהֲנִים לַיהוָה
  choice: священниками Яхве
  rationale: Именная конструкция передана естественным русским сказуемым и сохраняет их служение именно Яхве.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передача «Яхве» сохраняет личное имя, непосредственно стоящее в еврейском тексте, не смешивая его с титулом и не навязывая конфессионального истолкования.
- issue: Передача титула יהוה צבאות
  choice: Яхве Воинств
  alternative: Господь Саваоф; Господь Воинств; Яхве Сил
  rationale: Выбран буквальный и понятный по составу титул, сохраняющий связь צבאות с воинствами. Традиционный вариант указан в сноске, а интерпретирующее «Всемогущий» не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Несовершенный вид «поднимался» и оборот «из года в год» естественно выражают привычное ежегодное паломничество. Имена собственные даны в устоявшихся русских библейских формах; маркер сноски помещён непосредственно после относящегося к нему божественного титула.
