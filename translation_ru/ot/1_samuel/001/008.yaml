base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/008.yaml
  text: Then Elkanah her husband said to her[a], “Hannah, why are you weeping? And why do you not eat? And why is your heart troubled? Am I not better to you than ten sons?”
translation:
  language: ru
  text: 'Тогда Елкана, её муж, сказал ей: «Анна, почему ты плачешь? Почему не ешь? Почему твоё сердце скорбит?[a] Разве я для тебя не лучше десяти сыновей?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «почему твоему сердцу плохо?» Возможный перевод: «почему твоё сердце печалится?»'
    reason: Лексико-идиоматическая неоднозначность выражения יֵרַע לְבָבֵךְ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с waw продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: אֶלְקָנָה אִישָׁהּ
  choice: Елкана, её муж
  rationale: Сохраняет явное пояснение роли Елканы и естественный для русского порядок слов.
- source_word: לָמֶה
  choice: почему
  rationale: Повтор вопросительного слова передан во всех трёх вопросах ради сохранения риторического эффекта.
- source_word: תִבְכִּי
  choice: ты плачешь
  rationale: Настоящее время естественно обозначает продолжающееся действие в данной сцене.
- source_word: לֹא תֹאכְלִי
  choice: не ешь
  rationale: Передаёт наблюдаемый отказ от еды, не добавляя оттенка намерения, который могло бы внести «не хочешь есть».
- source_word: יֵרַע לְבָבֵךְ
  choice: твоё сердце скорбит
  rationale: Буквально выражение говорит, что сердцу «плохо»; в контексте оно обозначает внутреннюю печаль. Выбор сохраняет образ сердца и звучит естественно по-русски.
- source_word: הֲלוֹא
  choice: Разве ... не
  rationale: Отрицательный риторический вопрос ожидает утвердительного ответа, как и в еврейском тексте.
- source_word: טוֹב לָךְ
  choice: для тебя не лучше
  rationale: Передаёт сравнительное утверждение Елканы о собственной ценности для Анны без дополнительного толкования.
- source_word: מֵעֲשָׂרָה בָּנִים
  choice: десяти сыновей
  rationale: Сохраняет конкретно мужской род существительного и число исходного текста.
theological_decisions:
- issue: Гендерно-конкретное значение בָּנִים
  choice: сыновей
  alternative: детей
  rationale: Еврейское слово здесь имеет форму мужского рода и означает «сыновья»; нейтральное «дети» устранило бы значимую конкретность текста.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Тройное «почему» сохранено, но повтор союза перед вопросами не воспроизведён, поскольку без него русская речь звучит естественнее. Имя חַנָּה передано в традиционной русской библейской форме «Анна».
