  text: וְ/כֵ֨ן יַעֲשֶׂ֜ה שָׁנָ֣ה בְ/שָׁנָ֗ה מִ/דֵּ֤י עֲלֹתָ/הּ֙ בְּ/בֵ֣ית יְהוָ֔ה כֵּ֖ן תַּכְעִסֶ֑/נָּה וַ/תִּבְכֶּ֖ה וְ/לֹ֥א תֹאכַֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/007.yaml
  text: 'And so it happened year after year: whenever she went up to the house of Yahweh[a], Peninnah would provoke her[b], and she would weep and not eat.'
translation:
  language: ru
  text: 'Так происходило из года в год[a]: всякий раз, когда Анна поднималась в дом Яхве[b], Феннана досаждала ей, и Анна плакала и не ела.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Так он поступал из года в год». Еврейский глагол стоит в мужском роде единственного числа и может относиться к Елкане; возможна также обобщающая передача ежегодно повторявшейся ситуации.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «при её восхождении в доме Яхве» или «когда она поднималась в доме Яхве». Предлог может обозначать местонахождение, хотя с глаголом движения контекст естественно понимать как направление: «в дом Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן יַעֲשֶׂה
  choice: Так происходило
  rationale: Мужская форма глагола буквально означает «так он делал», однако в контексте вся конструкция может идиоматически обобщать ежегодно повторявшуюся ситуацию. Основной текст передаёт это естественным русским оборотом, а буквальная синтаксическая возможность сохранена в сноске.
- source_word: שָׁנָה בְשָׁנָה
  choice: из года в год
  rationale: Распределительное сочетание обозначает ежегодно повторяющееся действие; русский оборот сохраняет его итеративность.
- source_word: מִדֵּי עֲלֹתָהּ
  choice: всякий раз, когда Анна поднималась
  rationale: 'מִדֵּי с инфинитивом выражает повторяемость: «всякий раз, когда». Женский суффикс указывает на Анну; имя делает русскую фразу ясной без изменения референции.'
- source_word: בְּבֵית יְהוָה
  choice: в дом Яхве
  rationale: Хотя предлог בְּ обычно значит «в», при глаголе движения контекст допускает значение направления; по-русски естественно «поднималась в дом».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: תַּכְעִסֶנָּה
  choice: соперница досаждала ей
  rationale: Hiphil от כעס выражает намеренное раздражение или причинение огорчения. Существительное «соперница» восстанавливает подразумеваемое из предыдущего стиха подлежащее, а «досаждала» естественно передаёт враждебное повторяющееся действие.
- source_word: וַתִּבְכֶּה וְלֹא תֹאכַל
  choice: и Анна плакала и не ела
  rationale: В контексте ежегодно повторяющейся ситуации формы обозначают привычное следствие; повтор имени устраняет возможную неясность после упоминания соперницы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит личное имя Бога. Форма «Яхве» сохраняет различие между именем и титулом и соответствует принятой научной реконструкции произношения.
- issue: Подлежащее יַעֲשֶׂה
  choice: безличное «происходило» в основном тексте
  alternative: «он поступал так» — вероятно, об Елкане
  rationale: Глагол имеет форму 3-го лица мужского рода единственного числа и может относиться к Елкане, но выражение также допускает идиоматическое обобщение всей повторяющейся ситуации. Неопределённость сохранена сноской.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинным повествовательным тоном. Повтор имени «Анна» помогает различать участниц сцены; архаизмы и конфессионально маркированные формулы не используются.
