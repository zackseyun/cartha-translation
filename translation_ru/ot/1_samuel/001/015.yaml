base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/015.yaml
  text: But Hannah answered and said[a], “No, my lord. I am a woman troubled in spirit. I have drunk neither wine nor strong drink[b], but I have poured out my soul before Yahweh.”
translation:
  language: ru
  text: 'Но Анна ответила: «Нет, господин мой! Я глубоко удручённая женщина[a]. Я не пила ни вина, ни хмельного напитка[b], а излила свою душу перед Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «женщина, тяжёлая духом»; то есть глубоко скорбящая, удручённая.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ни вина, ни другого опьяняющего напитка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן חַנָּה וַתֹּאמֶר
  choice: Но Анна ответила
  rationale: Обычная древнееврейская формула с двумя глаголами естественно передаётся одним русским глаголом; «но» выражает возражение Анны на обвинение Илия.
- source_word: לֹא אֲדֹנִי
  choice: Нет, господин мой!
  rationale: אֲדֹנִי здесь — почтительное обращение к Илию, а не божественный титул. Форма «господин мой» сохраняет уважительность и притяжательный суффикс.
- source_word: אִשָּׁה קְשַׁת רוּחַ
  choice: женщина, измученная духом
  rationale: Выражение обозначает внутреннюю тяжесть, скорбь и душевную подавленность, а не упрямство. Перевод сохраняет образ רוּחַ — «дух» и остаётся понятным по-русски.
- source_word: וְיַיִן וְשֵׁכָר לֹא שָׁתִיתִי
  choice: Я не пила ни вина, ни хмельного напитка
  rationale: שֵׁכָר обозначает опьяняющий напиток, отличный от вина, без необходимости точно определять его разновидность. Конструкция «ни… ни…» естественно передаёт парные дополнения при отрицании.
- source_word: וָאֶשְׁפֹּךְ אֶת נַפְשִׁי
  choice: а изливала свою душу
  rationale: Сохранена библейская метафора полного и искреннего раскрытия себя в молитве. Несовершенный вид по-русски соответствует продолжавшемуся действию, которое Илий наблюдал.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» точно выражает молитву в присутствии Бога; личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон — личное имя Бога; транслитерация сохраняет его отличие от титула «Господь».
- issue: Значение выражения אִשָּׁה קְשַׁת רוּחַ
  choice: женщина, измученная духом
  alternative: женщина, тяжёлая духом
  rationale: Контекст требует значения глубокой скорби и душевного стеснения. Перевод не превращает состояние Анны ни в нравственный порок, ни в специальное богословское понятие.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Форма «пред Яхве» сохраняет торжественность, тогда как синтаксис реплики остаётся ясным и естественным. Все сноски привязаны к тем словам, которые они поясняют; несогласованные позиции сносок в консультационном английском слое не воспроизводятся.
