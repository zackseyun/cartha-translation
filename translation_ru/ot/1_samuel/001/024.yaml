  text: וַ/תַּעֲלֵ֨/הוּ עִמָּ֜/הּ כַּ/אֲשֶׁ֣ר גְּמָלַ֗תּ/וּ בְּ/פָרִ֤ים שְׁלֹשָׁה֙ וְ/אֵיפָ֨ה אַחַ֥ת קֶ֨מַח֙ וְ/נֵ֣בֶל יַ֔יִן וַ/תְּבִאֵ֥/הוּ בֵית יְהוָ֖ה שִׁל֑וֹ וְ/הַ/נַּ֖עַר נָֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/024.yaml
  text: When she had weaned him[a], she took him up with her, with three bulls, one ephah of flour, and a skin of wine, and brought him to the house of Yahweh at Shiloh. Now the boy was young.
translation:
  language: ru
  text: Когда она отняла его от груди, то взяла его с собой и отправилась с тремя быками[a], одной ефой муки и бурдюком вина. Она привела его в дом Яхве в Силоме. Мальчик же был ещё мал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском масоретском тексте: «три быка»; некоторые древние свидетели и толкователи читают: «один трёхлетний бык».'
    reason: textual_variant
lexical_decisions:
- source_word: וַתַּעֲלֵהוּ עִמָּהּ
  choice: взяла его с собой и отправилась
  rationale: Глагол עלה передаёт движение вверх, в данном контексте — паломничество к святилищу. Русское «отправилась» естественно обозначает начало пути, а «взяла его с собой» сохраняет объект и явно выраженное עִמָּהּ.
- source_word: כַּאֲשֶׁר גְּמָלַתּוּ
  choice: когда она отняла его от груди
  rationale: В контексте גמל означает завершить грудное вскармливание; это современное и ясное русское выражение.
- source_word: בְּפָרִים שְׁלֹשָׁה
  choice: с тремя быками
  rationale: Масоретский текст прямо говорит о трёх быках. Иное чтение древних свидетелей вынесено в примечание.
- source_word: וְאֵיפָה אַחַת קֶמַח
  choice: одной ефой муки
  rationale: Сохранена древняя мера объёма «ефа», без приблизительного пересчёта; קֶמַח передано обычным словом «мука».
- source_word: וְנֵבֶל יַיִן
  choice: и бурдюком вина
  rationale: נֵבֶל здесь обозначает сосуд для вина, вероятнее всего кожаный бурдюк.
- source_word: וַתְּבִאֵהוּ
  choice: она привела его
  rationale: Порода hифиль глагола בוא имеет каузативное значение «привести, доставить»; перевод отличает прибытие от предшествующего отправления.
- source_word: בֵית יְהוָה
  choice: дом Яхве
  rationale: «Дом» естественно передаёт обозначение святилища, а личное имя יהוה транслитерировано как «Яхве».
- source_word: שִׁלוֹ
  choice: в Силоме
  rationale: Название места передано принятой русской библейской формой «Силом»; предложный падеж обозначает местонахождение святилища.
- source_word: וְהַנַּעַר נָעַר
  choice: Мальчик же был ещё мал
  rationale: Повтор נַעַר подчёркивает малый возраст Самуила. Буквальный повтор по-русски неестественен, поэтому его смысл передан словами «ещё мал».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога, поэтому оно сохранено как имя, а не заменено титулом.
- issue: Число и возраст жертвенных животных
  choice: три быка
  alternative: один трёхлетний бык
  rationale: Основной текст следует масоретскому чтению, не согласовывая его молча с единственным быком в следующем стихе; древний вариант сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис разделён на три предложения для ясности; древняя мера «ефа» и личное имя «Яхве» сохранены. Подлинная текстологическая неоднозначность отмечена примечанием без исправления основного текста.
