  text: But to Hannah he would give a double portion[a], because he loved Hannah, though Yahweh had closed her womb.
translation:
  language: ru
  text: Анне же он давал двойную долю[a], потому что любил Анну, а Яхве сделал её бесплодной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально передаётся приблизительно как «одна доля для двух лиц (или ноздрей)» и остаётся трудным для толкования. Оно может означать «двойную долю» или «особую, почётную долю». В конце стиха еврейское «а/и Яхве сделал её бесплодной» контекстуально также может пониматься уступительно: «хотя Яхве сделал её бесплодной».'
