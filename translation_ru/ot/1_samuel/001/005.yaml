lexical_decisions:
- source_word: וּלְחַנָּה
  choice: А Анне
  rationale: Союз с предлогом вводит контраст с Пенинной и её детьми из предыдущего стиха; русское «А Анне» естественно передаёт этот переход.
- source_word: יִתֵּן
  choice: он давал
  rationale: Имперфект в повествовании обозначает обычное, повторявшееся в прошлом действие Елканы.
- source_word: מָנָה
  choice: долю
  rationale: Речь идёт о выделенной части жертвенной трапезы; «доля» звучит естественно и сохраняет смысл распределения.
- source_word: אַחַת אַפָּיִם
  choice: двойную долю
  rationale: Трудное выражение, буквально близкое к «одна доля двух лиц/ноздрей», вероятнее всего означает увеличенную либо особо почётную долю; неоднозначность отмечена в сноске.
- source_word: כִּי אֶת־חַנָּה אָהֵב
  choice: потому что любил Анну
  rationale: כִּי вводит причину особого отношения Елканы к Анне.
- source_word: וַיהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога, не заменяя его титулом.
- source_word: סָגַר רַחְמָהּ
  choice: заключил её чрево
  rationale: Глагол означает «закрыть, затворить», а רֶחֶם — «чрево, матка». Формулировка сохраняет образ источника и остаётся понятной в литературном русском.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет это различие.
- issue: Связь между любовью Елканы и бесплодием Анны
  choice: хотя Яхве заключил её чрево
  alternative: и Яхве заключил её чрево
  rationale: 'Еврейский союз формально допускает простое присоединение, но контекст может подразумевать уступку: Елкана любил Анну вопреки её бесплодию. Поскольку уступительность не выражена однозначно, буквальная альтернатива указана в сноске.'
- issue: Божественная причастность к бесплодию Анны
  choice: Яхве заключил её чрево
  alternative: она была бесплодна
  rationale: Перевод сохраняет прямое утверждение исходного текста о действии Яхве и не смягчает богословское напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Чрево» выбрано вместо клинического «матка», чтобы сохранить телесный образ исходника и достойный регистр; трудность идиомы и возможная неуступительная связь последней части стиха вынесены в сноску.
