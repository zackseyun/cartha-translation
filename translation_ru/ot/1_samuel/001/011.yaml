  text: וַ/תִּדֹּ֨ר נֶ֜דֶר וַ/תֹּאמַ֗ר יְהוָ֨ה צְבָא֜וֹת אִם רָאֹ֥ה תִרְאֶ֣ה בָּ/עֳנִ֣י אֲמָתֶ֗/ךָ וּ/זְכַרְתַּ֨/נִי֙ וְ/לֹֽא תִשְׁכַּ֣ח אֶת אֲמָתֶ֔/ךָ וְ/נָתַתָּ֥ה לַ/אֲמָתְ/ךָ֖ זֶ֣רַע אֲנָשִׁ֑ים וּ/נְתַתִּ֤י/ו לַֽ/יהוָה֙ כָּל יְמֵ֣י חַיָּ֔י/ו וּ/מוֹרָ֖ה לֹא יַעֲלֶ֥ה עַל רֹאשֽׁ/וֹ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/011.yaml
  text: She made a vow and said[a], “O Yahweh of hosts, if you will indeed look on the affliction of your female servant, and remember me, and not forget your female servant, but give your female servant a male child, then I will give him to Yahweh all the days of his life[b], and no razor shall come upon his head.”
translation:
  language: ru
  text: 'Она дала обет и сказала: «Яхве Воинств! Если Ты действительно увидишь страдание Твоей рабыни, вспомнишь обо мне и не забудешь Твою рабыню, но дашь Твоей рабыне сына[a], то я отдам его Яхве на всю его жизнь, и бритва не коснётся его головы[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «потомство мужчин»; здесь это выражение означает ребёнка мужского пола, сына.'
    reason: lexical_alternative
  - marker: b
    text: Запрет касаться волос бритвой перекликается с особым посвящением, связанным с обетом назорея; однако сам стих прямо не называет ребёнка назореем.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּדֹּר נֶדֶר
  choice: Она дала обет
  rationale: Еврейский однокоренной оборот буквально означает «обещала обет» и подчёркивает формальный характер обещания; по-русски естественно «дала обет».
- source_word: יְהוָה צְבָאוֹת
  choice: Господь Воинств
  rationale: Имя יהוה передано принятой русской библейской формой «Господь», а צְבָאוֹת — буквально и ёмко как «Воинств», без сужения до одного только земного войска.
- source_word: אִם רָאֹה תִרְאֶה
  choice: Если Ты действительно увидишь
  rationale: Инфинитив абсолютный при личной форме усиливает глагол; «действительно» передаёт это усиление, сохраняя образ видения.
- source_word: בָּעֳנִי
  choice: страдание
  rationale: Слово обозначает бедствие, унижение или тяжёлое положение; «страдание» сохраняет широту значения и естественно звучит в молитве.
- source_word: אֲמָתֶךָ / לַאֲמָתְךָ
  choice: Твоей рабы / Твою рабу
  rationale: Существительное прямо обозначает женщину-рабыню или служанку. «Раба» сохраняет пол говорящей, молитвенное самоуничижение и традиционный, но понятный регистр.
- source_word: וּזְכַרְתַּנִי
  choice: вспомнишь обо мне
  rationale: Передаёт буквальное «вспомнишь меня» естественным русским оборотом и не ослабляет молитвенно-заветный смысл.
- source_word: וְנָתַתָּה לַאֲמָתְךָ זֶרַע אֲנָשִׁים
  choice: дашь Твоей рабе сына
  rationale: Буквально «семя/потомство мужчин»; в данном контексте это идиоматическое обозначение ребёнка мужского пола. «Сын» — точная и естественная русская передача.
- source_word: וּנְתַתִּיו לַיהוָה
  choice: то я отдам его Господу
  rationale: Глагол означает «дать». «Отдам» ясно выражает обещанное вручение ребёнка Богу, не добавляя специального термина «посвящу».
- source_word: כָּל יְמֵי חַיָּיו
  choice: на все дни его жизни
  rationale: Сохраняет форму и подчёркнутую пожизненную длительность обета.
- source_word: וּמוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: и бритва не коснётся его головы
  rationale: Передаёт конкретный запрет стричь волосы. Русский оборот естественнее буквального «не взойдёт на его голову», сохраняя предметный образ.
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: В основном русском тексте употреблена широко узнаваемая библейская передача имени как «Господь». Она не изменяет референт и сохраняет достоинство молитвенного обращения; личное имя не заменено толкованием вроде «Всемогущий».
- issue: Связь запрета бритвы с назорейством
  choice: Сохранить конкретную формулировку обета, не называя ребёнка назореем в основном тексте
  alternative: Прямо назвать его назореем
  rationale: Фраза перекликается с правилами назорейства, однако стих прямо говорит лишь о пожизненной отдаче Господу и запрете бритвы. Поэтому возможная связь пояснена в примечании, а не превращена в утверждение текста.
- issue: Условная форма молитвы Анны
  choice: Сохранить последовательность будущих форм внутри условия и обещания
  alternative: 'Передать просьбу повелительными формами: «призри… вспомни… дай»'
  rationale: 'Еврейская конструкция построена как условный обет: если Бог действительно увидит, вспомнит и даст, Анна отдаст ребёнка. Русская условная конструкция сохраняет эту форму и её богословское напряжение.'
translation_notes:
  register: Современный литературный русский с dignified библейским оттенком. Синтаксис молитвы сохраняет нарастающую последовательность просьб и условный характер обета. Местоимения, обращённые к Богу, написаны с прописной буквы согласно распространённой русской религиозной норме.
