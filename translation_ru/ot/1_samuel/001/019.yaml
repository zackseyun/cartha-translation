base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/019.yaml
  text: They rose early in the morning and bowed down before Yahweh[a]. Then they returned and came to their house at Ramah, and Elkanah knew Hannah his wife[b], and Yahweh remembered her.
translation:
  language: ru
  text: Рано утром они встали и поклонились перед Яхве. Затем они вернулись домой, в Раму. Елкана познал Анну, свою жену,[a] и Яхве вспомнил о ней.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «познал» — принятый в еврейском языке эвфемизм супружеской близости.
    reason: lexical_alternative
  - marker: b
    text: В еврейском повествовании «вспомнить» нередко означает не просто припомнить, а благосклонно обратиться к человеку и начать действовать ради него.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: Рано утром они встали
  rationale: Сочетание глагола שׁכם в породе hифиль с בַבֹּקֶר означает ранний подъём; русский порядок слов естественно передаёт временной акцент.
- source_word: וַיִּשְׁתַּחֲווּ לִפְנֵי יְהוָה
  choice: и поклонились перед Яхве
  rationale: Глагол השתחוה обозначает поклон или простирание ниц. «Поклонились» сохраняет телесное действие и его богослужебный смысл, не заменяя образ более отвлечённым «поклонились Богу» или «совершили поклонение».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не замещён титулом «Господь».
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל־בֵּיתָם הָרָמָתָה
  choice: Затем они вернулись домой, в Раму
  rationale: Формулировка естественно передаёт возвращение в их дом, находившийся в Раме; направительная форма הָרָמָתָה отражена оборотом «в Раму».
- source_word: וַיֵּדַע אֶלְקָנָה אֶת־חַנָּה אִשְׁתּוֹ
  choice: Елкана познал Анну, свою жену
  rationale: ידע здесь служит сдержанным эвфемизмом супружеской близости. «Познал» сохраняет образ и возвышенный повествовательный регистр; значение поясняется в сноске.
- source_word: וַיִּזְכְּרֶהָ יְהוָה
  choice: и Яхве вспомнил о ней
  rationale: Глагол זכר передан прямо, без преждевременного уточнения последующего действия Бога. Оборот «вспомнил о ней» естественен по-русски и сохраняет смысл действенного благоволения, пояснённый в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога; его передача как «Яхве» сохраняет различие между именем и титулом.
- issue: Нужно ли раскрывать сексуальный эвфемизм в основном тексте
  choice: Сохранить «познал» и пояснить в сноске
  alternative: вступил в близость с / имел супружеские отношения с
  rationale: Исходный текст намеренно выражается сдержанно. Сохранение эвфемизма передаёт его литературный регистр, а сноска устраняет возможную неясность.
- issue: Смысл слов о том, что Яхве вспомнил Анну
  choice: Сохранить формулировку «вспомнил о ней»
  alternative: обратил на неё внимание / исполнил её просьбу
  rationale: В библейском повествовании «вспомнить» часто подразумевает действенное и благосклонное обращение к человеку, однако сам стих ещё не называет результата. Более развёрнутый перевод неоправданно предвосхитил бы продолжение.
translation_notes:
  register: 'Современный литературный русский с достоинством библейского повествования. Синтаксис упрощён до естественных русских фраз без утраты последовательности действий. Имена переданы в привычной русской библейской форме: Елкана, Анна, Рама; личное имя Бога — Яхве.'
