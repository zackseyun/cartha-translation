  yaml_path: translation/ot/1_samuel/001/020.yaml
  text: And in due time Hannah conceived and bore a son[a], and she called his name Samuel, for she said[b], “I asked for him from Yahweh.”
translation:
  language: ru
  text: 'И в положенный срок[a] Анна зачала и родила сына. Она назвала его Самуилом[b], сказав: «Я испросила его у Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при круговороте (или обороте) дней» — то есть когда наступило надлежащее время.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте имя «Самуил» поясняется игрой слов с глаголом שׁאל — «просить»: «Я испросила его у Яхве». Это пояснение не обязательно является точной этимологией имени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקֻפוֹת הַיָּמִים
  choice: в положенный срок
  rationale: Еврейское выражение буквально говорит о «круге/обороте дней» и обозначает наступление надлежащего времени. Русское «в положенный срок» естественно передаёт этот смысл в рассказе о зачатии и рождении.
- source_word: וַתַּהַר
  choice: зачала
  rationale: Точное и уместное для повествования о рождении соответствие глаголу הרה; сохраняет последовательность событий исходного текста.
- source_word: וַתֵּלֶד בֵּן
  choice: родила сына
  rationale: Естественная современная русская формулировка, точно передающая еврейское выражение.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: назвала его
  rationale: Обычная русская формула наречения имени; буквальное «назвала имя его» звучало бы неестественно.
- source_word: שְׁמוּאֵל
  choice: Самуил
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: כִּי מֵיְהוָה שְׁאִלְתִּיו
  choice: 'сказав: «Я испросила его у Яхве»'
  rationale: «Испросила» передаёт настойчивую просьбу и сохраняет связь с корнем שאל («просить»), на котором строится объяснение имени. Деепричастие «сказав» естественно вводит подразумеваемое в еврейском тексте пояснение Анны.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее непосредственно в еврейском тексте, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Тетраграмматон передан как личное имя, без замены титулом; форма «Яхве» соответствует принятой в проекте передаче.
- issue: Связь имени Самуил с глаголом שאל
  choice: Сохранить словесную связь через «испросила» и пояснить её в сноске
  alternative: Представить фразу как точную этимологию имени или отказаться от пояснения игры слов
  rationale: Стих связывает наречение Самуила с глаголом «просить», но точная этимология имени остаётся спорной. Перевод сохраняет авторское объяснение, не выдавая игру слов за бесспорную этимологию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан естественным для русского повествования; игра слов и буквальный образ временного выражения вынесены в сноски.
