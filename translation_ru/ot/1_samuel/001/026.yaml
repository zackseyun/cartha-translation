base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/026.yaml
  text: And she said[a], “Please, my lord, as surely as you live, my lord, I am the woman who stood here beside you, praying to Yahweh.
translation:
  language: ru
  text: 'И сказала она: «Прошу, господин мой! Жизнью твоей клянусь[a], господин мой: я — та женщина, которая стояла здесь рядом с тобой и молилась Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «жива душа твоя»; это формула клятвенного, настойчивого заверения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Прошу
  rationale: В обращении эта частица выражает почтительную и настойчивую просьбу; «прошу» естественно передаёт её функцию по-русски.
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Это почтительное обращение Анны к Илию, а не Божий титул. Такая форма сохраняет социальную почтительность и возвышенный тон.
- source_word: חֵי נַפְשְׁךָ
  choice: Жизнью твоей клянусь
  rationale: Еврейское выражение — формула клятвенного заверения, буквально связанная с жизнью адресата. Русская формулировка ясно передаёт её силу и звучит естественно.
- source_word: הָאִשָּׁה הַנִּצֶּבֶת
  choice: та женщина, которая стояла
  rationale: Определённая форма указывает на уже известную Илию женщину, а причастие описывает её положение во время прежней встречи.
- source_word: עִמְּכָה בָּזֶה
  choice: здесь рядом с тобой
  rationale: В данном контексте предлог обозначает пространственную близость, а указательное выражение — место прежней молитвы.
- source_word: לְהִתְפַּלֵּל
  choice: молилась
  rationale: Инфинитив называет действие, ради которого Анна находилась там; личная форма создаёт естественную русскую относительную конструкцию без изменения смысла.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное Божье имя.
- issue: Характер выражения חֵי נַפְשְׁךָ
  choice: 'клятвенное заверение: «Жизнью твоей клянусь»'
  alternative: буквальное «жива душа твоя»; менее явное «верно, как то, что ты жив»
  rationale: Контекст требует сохранить серьёзность формулы, не превращая её в обычное усилительное наречие; буквальный образ разъяснён в сноске.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной прозы. Повтор обращения «господин мой» сохранён как заметная черта еврейского текста; речь Анны передаёт почтительность и настойчивость.
