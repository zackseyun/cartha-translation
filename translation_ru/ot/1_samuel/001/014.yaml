- source_word: הָסִירִי אֶת יֵינֵךְ מֵעָלָיִךְ
  choice: Удали от себя вино
  rationale: Сохраняет образное выражение исходного текста «удали своё вино с себя», не уточняя, идёт ли речь о самом вине или о его воздействии.
