base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/005.yaml
  text: So David and his men went to Keilah and fought against the Philistines[a], and he drove off their livestock and struck them with a great blow[c][b]. So David saved the inhabitants of Keilah.
translation:
  language: ru
  text: И пошёл Давид со своими людьми в Кеиль, сразился с филистимлянами, угнал их скот[a] и нанёс им тяжёлое поражение[b]. Так Давид спас[c] жителей Кеиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает скот вообще, то есть домашних стадных животных.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поразил их великим ударом»; возможный перевод: «устроил среди них великое побоище».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «избавил», «выручил».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד וַאֲנָשָׁיו
  choice: И пошёл Давид со своими людьми
  rationale: Нарративная форма וַיֵּלֶךְ естественно передаётся глаголом «пошёл», а אֲנָשָׁיו в военном контексте означает людей из отряда Давида.
- source_word: קְעִילָה
  choice: Кеиль / Кеиля
  rationale: Использована закрепившаяся в русской библейской традиции форма топонима с падежным изменением по нормам русского языка.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: сразился с филистимлянами
  rationale: Глагол לחם с предлогом ב обозначает здесь вооружённую борьбу против филистимлян; русский оборот «сразился с» однозначен в данном контексте.
- source_word: וַיִּנְהַג אֶת־מִקְנֵיהֶם
  choice: угнал их скот
  rationale: נהג обозначает перемещение животных понуканием, а в контексте военной победы — их увод как добычи. «Угнал» кратко и естественно передаёт это действие.
- source_word: מִקְנֵיהֶם
  choice: их скот
  rationale: מִקְנֶה — собирательное обозначение домашних стад и скота, не ограниченное крупным рогатым скотом.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: нанёс им тяжёлое поражение
  rationale: Сочетание נכה и מַכָּה описывает нанесение сокрушительного военного удара. «Тяжёлое поражение» передаёт смысл идиомы, не утверждая прямо массового истребления.
- source_word: וַיּוֹשַׁע
  choice: спас
  rationale: В военном контексте ישע означает избавление или спасение от непосредственной угрозы; «спас» понятно современному читателю и сохраняет основное значение.
- source_word: יֹשְׁבֵי קְעִילָה
  choice: жителей Кеиля
  rationale: Причастная конструкция буквально обозначает живущих в Кеиле; «жители» — точная и естественная русская передача.
