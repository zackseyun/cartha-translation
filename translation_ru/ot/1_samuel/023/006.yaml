  text: וַ/יְהִ֗י בִּ֠/בְרֹחַ אֶבְיָתָ֧ר בֶּן אֲחִימֶ֛לֶךְ אֶל דָּוִ֖ד קְעִילָ֑ה אֵפ֖וֹד יָרַ֥ד בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/006.yaml
  text: When Abiathar son of Ahimelech fled to David at Keilah[a], he came down with an ephod in his hand.
translation:
  language: ru
  text: Когда Авиафар, сын Ахимелеха, бежал к Давиду в Кеиле, он спустился с эфодом в руке.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально, при сохранении порядка еврейских слов: «эфод спустился в его руке».'
    reason: 'Лексико-синтаксическая альтернатива: форма глагола формально позволяет считать «эфод» подлежащим, хотя по смыслу естественнее относить действие к Авиафару.'
lexical_decisions:
- source_word: וַיְהִי בִּבְרֹחַ
  choice: Когда … бежал
  rationale: Сочетание повествовательной формы היה с ב и инфинитивом выражает временное обстоятельство. Современное русское «когда … бежал» естественно передаёт переход в повествовании без архаического «и было».
- source_word: אֶבְיָתָר בֶּן אֲחִימֶלֶךְ
  choice: Авиафар, сын Ахимелеха
  rationale: Использованы традиционные русские формы библейских имён; патронимическая конструкция передана прямо.
- source_word: אֶל דָּוִד קְעִילָה
  choice: к Давиду в Кеилу
  rationale: Последовательность указывает на бегство к Давиду, находившемуся в Кеиле, либо на движение к Давиду с Кеилой как местом назначения. Русская конструкция сохраняет тесную связь обоих ориентиров и естественно звучит в контексте движения.
- source_word: אֵפוֹד
  choice: эфод
  rationale: Сохранён специальный древнееврейский термин для культового предмета; более общее «священное облачение» неоправданно сужало бы или поясняло значение за пределами стиха.
- source_word: יָרַד
  choice: спустился
  rationale: Глагол ירד буквально обозначает движение вниз. Выбран прямой русский эквивалент, сохраняющий направление движения.
- source_word: בְּיָדוֹ
  choice: держа в руке
  rationale: Буквально «в его руке». Деепричастная конструкция естественно передаёт, что Авиафар нёс эфод с собой, сохраняя конкретный образ.
theological_decisions:
- issue: Характер предмета אֵפוֹד
  choice: Сохранить термин «эфод» без дополнительного определения
  alternative: «священное облачение» или «священническая одежда»
  rationale: В дальнейшем повествовании предмет имеет священническое и связанное с вопрошанием Бога значение, однако сам стих не определяет его устройство или функцию. Транслитерация не вносит лишнего богословского уточнения.
- issue: Подлежащее при יָרַד
  choice: 'В основном тексте понимать подлежащим Авиафара: «он спустился»'
  alternative: 'Формально связать глагол с непосредственно предшествующим «эфодом»: «эфод спустился в его руке»'
  rationale: Мужской род единственного числа допускает обе грамматические связи, но человек как подлежащее глагола движения даёт наиболее естественный смысл. Необычный порядок еврейских слов отмечен в сноске, чтобы не скрывать формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; специальный культовый термин сохранён, а реальная неоднозначность еврейского порядка слов вынесена в сноску.
