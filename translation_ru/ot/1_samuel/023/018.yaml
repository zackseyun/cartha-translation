base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/018.yaml
  text: And the two of them made a covenant before Yahweh[a]. Then David remained in the wooded area[b], and Jonathan went to his house.
translation:
  language: ru
  text: И заключили они оба завет пред Яхве[a]. Давид остался в лесистой местности[b], а Ионафан пошёл к себе домой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «разрезали завет».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в Хореше»; еврейское слово можно понимать либо как название места, либо как обозначение лесистой местности или зарослей.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרְתוּ
  choice: заключили
  rationale: Сочетание כרת ברית буквально означает «разрезать завет», но по-русски установленное и естественное выражение — «заключить завет»; буквальный образ отмечен в сноске.
- source_word: שְׁנֵיהֶם
  choice: они оба
  rationale: Передаёт двойственное значение и совместное участие Давида и Ионафана без тяжеловесности.
- source_word: בְּרִית
  choice: завет
  rationale: Сохраняет торжественный и обязывающий характер отношений; «договор» звучал бы преимущественно юридически или политически.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Кратко и естественно передаёт совершение завета в присутствии Бога и под его свидетельством.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно представленное тетраграмматоном в еврейском тексте.
- source_word: וַיֵּשֶׁב
  choice: остался
  rationale: В контексте обозначает пребывание на месте, а не буквальное сидение.
- source_word: בַּחֹרְשָׁה
  choice: в лесистой местности
  rationale: Передаёт возможное нарицательное значение חֹרֶשׁ — лесистая местность или заросли; возможность топонима сохранена в сноске.
- source_word: הָלַךְ לְבֵיתוֹ
  choice: пошёл к себе домой
  rationale: Естественно по-русски передаёт буквальное «пошёл к своему дому».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем Яхве и титулом «Господь».
- issue: Характер завета Давида и Ионафана
  choice: завет
  alternative: договор
  rationale: «Завет» сохраняет библейскую торжественность и религиозное измерение действия, совершённого пред Яхве, не уточняя сверх текста его конкретную форму.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Пред Яхве» сохраняет торжественность, а «пошёл к себе домой» звучит естественно. Неоднозначность בַּחֹרְשָׁה вынесена в сноску.
