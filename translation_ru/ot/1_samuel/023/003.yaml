  to: 'Но люди Давида сказали ему[a]: «Мы и здесь, в Иудее, боимся; тем более будем бояться, если пойдём в Кеиль против боевых порядков филистимлян!»'
  rationale: «Тем более будем бояться» прямо передаёт усилительное значение וְאַף כִּי и делает подразумеваемое сказуемое явным для естественного русского синтаксиса. Замена «боевых рядов» на «боевые порядки» точнее отражает военное построение, обозначенное מַעַרְכוֹת. Сноска сохраняет альтернативную русскую передачу идиомы и объясняет её функцию.
