  naturalness: Текст в целом современный и естественный. Прямая передача идиомы через «тем более» будет одновременно более точной и столь же естественной по-русски.
  terminology: «Люди Давида», «Иудея», «Кеиль» и «филистимляне» употреблены удачно. «Боевые ряды» допустимо передаёт מַעַרְכוֹת; «боевые порядки» несколько точнее обозначает строй/построение.
