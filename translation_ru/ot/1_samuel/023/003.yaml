  text: But David’s men said to him[a], “Look, we are afraid here in Judah; how much more, then, if we go to Keilah against the battle lines of the Philistines?”
translation:
  language: ru
  text: 'Но люди Давида сказали ему[a]: «Мы и здесь, в Иудее, боимся; тем более будем бояться, если пойдём в Кеиль против боевых порядков филистимлян!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не говоря уже о том, если мы пойдём в Кеиль против боевых порядков филистимлян». Еврейский оборот выражает довод от меньшего к большему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Но ... сказали
  rationale: Последовательный вав продолжает повествование, а союз «но» естественно передаёт контраст между Божьим повелением в предыдущем стихе и опасениями людей Давида.
- source_word: אַנְשֵׁי דָוִד
  choice: люди Давида
  rationale: Естественная русская передача сопряжённой конструкции, обозначающей принадлежащий Давиду отряд.
- source_word: הִנֵּה
  choice: ведь
  rationale: В данной реплике частица вводит настойчивое указание на очевидное для говорящих обстоятельство; русское «ведь» передаёт этот прагматический акцент естественнее буквального «вот».
- source_word: אֲנַחְנוּ פֹה בִּיהוּדָה יְרֵאִים
  choice: мы и здесь, в Иудее, боимся
  rationale: 'Сохраняются место и состояние страха; частица «и» подчёркивает исходную, меньшую ступень аргумента: страх испытывается уже здесь, в Иудее.'
- source_word: וְאַף כִּי
  choice: что же будет, если
  rationale: Идиома выражает усиление от меньшего к большему. Выбранная русская формулировка ясно и естественно передаёт этот ход мысли, не превращая опасение в прямое утверждение.
- source_word: נֵלֵךְ קְעִלָה
  choice: мы пойдём в Кеиль
  rationale: Глагол движения с названием места обозначает направление к городу; «в Кеиль» — нормативная русская конструкция.
- source_word: אֶל מַעַרְכוֹת פְּלִשְׁתִּים
  choice: против боевых рядов филистимлян
  rationale: מַעֲרָכוֹת обозначает построенные для боя ряды или боевой строй; предлог אֶל в контексте предстоящего столкновения естественно передан как «против».
