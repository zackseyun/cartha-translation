base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/012.yaml
  text: Then David said[a], “Will the men of Keilah hand me and my men over into Saul’s hand?” And Yahweh said[c][b], “They will hand you over.”
translation:
  language: ru
  text: 'Тогда Давид спросил: «Выдадут ли жители Кеилы меня и моих людей в руки Саула[a]?» Яхве ответил: «Выдадут[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в руку Саула», то есть под его власть.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте ответ буквально звучит: «Выдадут»; кого именно, отдельно не уточняется.'
    reason: textual_clarification
lexical_decisions:
- source_word: הֲיַסְגִּרוּ / יַסְגִּירוּ
  choice: выдадут
  rationale: В породе хифиль глагол סגר здесь означает передать кого-либо во власть другого. «Выдать» естественно по-русски передаёт сдачу преследователю и позволяет последовательно воспроизвести глагол в вопросе и ответе.
- source_word: בַּעֲלֵי קְעִילָה
  choice: жители Кеилы
  rationale: В данном городском контексте выражение обозначает жителей или полноправных горожан, а не буквально «владельцев» или «господ» города. «Жители Кеилы» понятно и не сужает значение до городских начальников.
- source_word: אֹתִי וְאֶת־אֲנָשַׁי
  choice: меня и моих людей
  rationale: Перевод сохраняет два прямых дополнения и не уточняет без необходимости, были ли люди Давида воинами, спутниками или приверженцами.
- source_word: בְּיַד שָׁאוּל
  choice: в руки Саула
  rationale: Русское устойчивое выражение передаёт древнееврейский образ «в руку Саула», то есть под его власть; множественное число «руки» требуется естественной русской идиомой.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: יַסְגִּירוּ
  choice: Выдадут
  rationale: В масоретском тексте ответ не содержит выраженного дополнения. Эллиптический русский ответ сохраняет эту краткость и не добавляет «тебя» или «вас».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Краткий ответ Яхве без названного объекта
  choice: «Выдадут»
  alternative: «Тебя выдадут»; «Вас выдадут»
  rationale: Еврейская форма יַסְגִּירוּ означает «они выдадут» и в представленном масоретском тексте не имеет местоименного дополнения. Поэтому перевод не разрешает подразумеваемый объект за читателя.
translation_notes:
  register: 'Современный литературный русский язык с краткой повествовательной формой. «Спросил» естественно вводит прямой вопрос; «ответил» передаёт функцию второй реплики. Топоним передан как «Кеила» и склоняется: «Кеилы».'
