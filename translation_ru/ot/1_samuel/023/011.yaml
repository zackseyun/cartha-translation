source:
  edition: WLC
  text: הֲ/יַסְגִּרֻ֣/נִי בַעֲלֵי֩ קְעִילָ֨ה בְ/יָד֜/וֹ הֲ/יֵרֵ֣ד שָׁא֗וּל כַּֽ/אֲשֶׁר֙ שָׁמַ֣ע עַבְדֶּ֔/ךָ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַגֶּד נָ֖א לְ/עַבְדֶּ֑/ךָ וַ/יֹּ֥אמֶר יְהוָ֖ה יֵרֵֽד־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/011.yaml
  text: Will the men of Keilah hand me over into his hand? Will Saul come down[a], as your servant has heard? O Yahweh, God of Israel, please tell your servant.” And Yahweh said, “He will come down.”
translation:
  language: ru
  text: '«Выдадут ли меня жители Кеиля в его руки[a]? Спустится ли Саул, как услышал твой слуга? Яхве, Бог Израиля, прошу, скажи твоему слуге!» И Яхве ответил: «Спустится».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в его руку» — древнееврейское выражение со значением «под его власть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְגִּרֻנִי
  choice: выдадут ли меня
  rationale: Хифиль глагола סגר здесь означает передачу человека во власть врага. «Выдадут ли меня» естественно передаёт враждебную выдачу и подходит к сочетанию «в его руки».
- source_word: בַעֲלֵי קְעִילָה
  choice: жители Кеиля
  rationale: В данном городском контексте בעלי обозначает полноправных жителей или представителей города, а не буквально «владельцев». «Жители Кеиля» ясно и естественно для современного русского текста.
- source_word: בְיָדוֹ
  choice: в его руки
  rationale: Сохранён древнееврейский образ руки как власти и контроля; местоимение относится к Саулу. Смысл идиомы пояснён в сноске.
- source_word: יֵרֵד
  choice: спустится
  rationale: Глагол ירד буквально означает движение вниз. Одинаковый перевод в вопросе и ответе сохраняет словесное соответствие оригинала.
- source_word: כַּאֲשֶׁר שָׁמַע עַבְדֶּךָ
  choice: как услышал твой слуга
  rationale: Передаёт обращение Давида к полученному известию и сохраняет смиренную молитвенную самореференцию.
- source_word: עַבְדְּךָ
  choice: твой слуга
  rationale: В молитвенном обращении это традиционное выражение смирения перед Богом; «слуга» лучше соответствует контексту, чем социально более узкое «раб».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: הַגֶּד נָא
  choice: прошу, скажи
  rationale: Частица נָא при повелительной форме выражает настойчивую, но почтительную просьбу; такая формулировка естественна в современном литературном русском.
- source_word: וַיֹּאמֶר יְהוָה
  choice: И Яхве ответил
  rationale: В контексте прямого вопроса русское «ответил» естественно передаёт אמר и сохраняет повествовательную связь, вводимую וַ.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Оригинал употребляет личное имя Бога. «Яхве» передаёт тетраграмматон как имя, не подменяя его титулом.
- issue: Ответ дан только на один из двух вопросов Давида
  choice: Сохранён краткий ответ «Спустится», относящийся к вопросу о Сауле
  alternative: Дополнить ответ сведением о том, выдадут ли Давида жители Кеиля
  rationale: В данном стихе древнееврейский текст явно содержит лишь ответ יֵרֵד. Дополнение второго ответа из последующего контекста устранило бы композиционное напряжение оригинала.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Синтаксис вопросов и лаконичность Божьего ответа сохранены; архаизмы и конфессионально маркированные замены имени Бога не использованы.
