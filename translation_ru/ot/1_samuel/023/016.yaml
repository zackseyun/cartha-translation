  text: וַ/יָּ֨קָם֙ יְהוֹנָתָ֣ן בֶּן שָׁא֔וּל וַ/יֵּ֥לֶךְ אֶל דָּוִ֖ד חֹ֑רְשָׁה וַ/יְחַזֵּ֥ק אֶת יָד֖/וֹ בֵּ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/016.yaml
  text: Then Jonathan son of Saul arose and went to David at Horesh[a], and strengthened his hand in God.
translation:
  language: ru
  text: Тогда Ионафан, сын Саула, встал, пошёл к Давиду в Хореш и укрепил его руку в Боге[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или по смыслу: «ободрил его в Боге»; буквально: «укрепил его руку в Боге».'
    reason: Лексическая альтернатива и пояснение еврейской идиомы.
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Глагол קום в повествовательной последовательности обозначает начало целенаправленного действия. «Встал» сохраняет образ и естественно сочетается с последующим «пошёл».
- source_word: יְהוֹנָתָן בֶּן שָׁאוּל
  choice: Ионафан, сын Саула
  rationale: Прямо передаёт еврейское обозначение родства и сохраняет важное для контекста упоминание о связи Ионафана с Саулом.
- source_word: וַיֵּלֶךְ אֶל
  choice: пошёл к
  rationale: Оборот указывает на направленное движение к Давиду; «пошёл к» передаёт его без смены повествовательной перспективы.
- source_word: חֹרְשָׁה
  choice: в Хореш
  rationale: Форма понята как название места с направительным окончанием; поэтому она передана топонимом, а не нарицательным «лес».
- source_word: וַיְחַזֵּק
  choice: укрепил
  rationale: Порода piel глагола חזק означает «укреплять, делать сильным». Этот выбор сохраняет прямой смысл и исходный образ, не сводя его сразу к толкованию «ободрил».
- source_word: אֶת יָדוֹ
  choice: его руку
  rationale: Сохранён буквальный образ еврейской идиомы; по контексту местоимение относится к Давиду. Выражение подразумевает укрепление мужества или решимости.
- source_word: בֵּאלֹהִים
  choice: в Боге
  rationale: Предлог ב передан как «в», сохраняя возможный смысл Бога как основания или сферы укрепления и не уточняя его более интерпретирующими вариантами «через Бога» или «с Божьей помощью».
theological_decisions:
- issue: Передача אֱלֹהִים без артикля в данном контексте
  choice: Бог
  alternative: Господь
  rationale: В еврейском тексте стоит אֱלֹהִים, а не имя יהוה; поэтому перевод «Бог» следует исходному тексту и не подменяет обозначение Бога заветным именем.
- issue: Смысл выражения «укрепил его руку в Боге»
  choice: Сохранить исходную метафору в основном тексте
  alternative: 'Передать толковательно: «ободрил его, укрепив его упование на Бога»'
  rationale: Еврейская формулировка допускает понимание как ободрение или укрепление решимости, основанное на Боге, но не выражает добавленное слово «упование» прямо. Буквальный образ сохраняет богословскую и смысловую ёмкость, а значение поясняется в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис упрощён до естественной русской последовательности однородных сказуемых, при этом ключевая еврейская метафора сохранена. Топоним передан как «Хореш».
