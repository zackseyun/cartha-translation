base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/001.yaml
  text: Then they told David[a], saying, “Look, the Philistines are fighting against Keilah, and they are plundering the threshing floors.”
translation:
  language: ru
  text: 'Давиду сообщили: «Вот, филистимляне воюют против Кеилы[a] и грабят гумна».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воюют в Кеиле» или «у Кеилы». Еврейский предлог буквально означает «в» или «у», однако в этом военном контексте, вероятно, имеется в виду нападение на город.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: Давиду сообщили
  rationale: Последовательная глагольная форма вводит новое событие повествования, а множественное число допускает естественную русскую неопределённо-личную конструкцию. Двоеточие перед прямой речью передаёт функцию לֵאמֹר без тяжеловесного «говоря».
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание к срочному известию; «вот» звучит современно и сохраняет непосредственность сообщения.
- source_word: פְלִשְׁתִּים נִלְחָמִים בִּקְעִילָה
  choice: филистимляне воюют против Кеилы
  rationale: Причастие обозначает продолжающиеся военные действия. В данном контексте предлог בְּ, буквально «в/у», вероятнее всего указывает на город как объект нападения; возможная пространственная трактовка сохранена в сноске.
- source_word: וְהֵמָּה שֹׁסִים
  choice: и грабят
  rationale: Независимое местоимение подчёркивает действующий субъект, но по-русски повтор «они» здесь был бы избыточен. «Грабят» естественно передаёт военное расхищение.
- source_word: אֶת הַגֳּרָנוֹת
  choice: гумна
  rationale: גֹּרֶן обозначает место, где молотят и веют зерно. «Гумна» — точный, краткий и уместный в земледельческом контексте русский эквивалент.
