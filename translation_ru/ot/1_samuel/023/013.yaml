base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/013.yaml
  text: Then David arose with his men[a], about six hundred men, and they went out from Keilah and went wherever they could go. And it was told to Saul that David had escaped from Keilah[b], so he stopped going out.
translation:
  language: ru
  text: Тогда Давид встал со своими людьми — их было около шестисот человек — и они вышли из Кеиля, переходя с места на место, где могли[a]. Саулу донесли, что Давид ускользнул из Кеиля, и тот перестал выступать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и ходили, где ходили». Еврейское выражение подчёркивает постоянное перемещение с места на место.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и перестал выходить». Вероятно, это означает, что Саул перестал выступать в погоню за Давидом, узнав, что тот покинул Кеиль.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם דָּוִד וַאֲנָשָׁיו
  choice: Тогда Давид встал со своими людьми
  rationale: Глагол קום передаёт начало действия («встал», «поднялся»), а וַאֲנָשָׁיו по смыслу обозначает сопровождавших Давида людей; такая конструкция естественна по-русски и не превращает глагол сразу в «отправился».
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: их было около шестисот человек
  rationale: Предлог כְּ при числе указывает на приблизительность; отдельная вставная конструкция избегает неестественного повтора «людьми — около шестисот человек».
- source_word: וַיֵּצְאוּ מִקְּעִלָה
  choice: они вышли из Кеиля
  rationale: Сохраняется пространственное значение יצא — «выйти из»; форма «Кеиля» соответствует принятой русской библейской передаче топонима.
- source_word: וַיִּתְהַלְּכוּ בַּאֲשֶׁר יִתְהַלָּכוּ
  choice: переходя с места на место, куда только могли
  rationale: Повтор глагола הלך в породе hitpael выражает продолжающееся перемещение без постоянного места; перевод передаёт эту динамику, не приписывая им бесцельного блуждания.
- source_word: וּלְשָׁאוּל הֻגַּד
  choice: Саулу донесли
  rationale: Русская неопределённо-личная конструкция естественно передаёт еврейский безличный пассив hophal.
- source_word: כִּי נִמְלַט דָּוִד מִקְּעִילָה
  choice: что Давид ускользнул из Кеиля
  rationale: נמלט означает спастись, вырваться или ускользнуть; «ускользнул» точно соответствует ситуации, когда Давид покинул город до прибытия Саула.
- source_word: וַיֶּחְדַּל לָצֵאת
  choice: и тот отказался от похода
  rationale: Буквально конструкция означает «перестал/воздержался выходить»; в данном повествовательном контексте речь идёт о прекращении задуманного выступления против Давида.
