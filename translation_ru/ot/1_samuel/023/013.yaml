revisions:
- from: Тогда Давид встал со своими людьми — их было около шестисот человек — и они вышли из Кеиля, переходя с места на место, куда только могли[a]. Саулу донесли, что Давид ускользнул из Кеиля, и тот отказался от похода[b].
  to: Тогда Давид встал со своими людьми — их было около шестисот человек — и они вышли из Кеиля, переходя с места на место, где могли[a]. Саулу донесли, что Давид ускользнул из Кеиля, и тот перестал выступать[b].
  rationale: Исправлена лишь чрезмерная конкретизация в заключительной клаузе и смягчено соответствующее толкование в сноске. «Перестал выступать» сохраняет смысл еврейского «перестал выходить» и остаётся понятным в военном контексте. В первой части устранено усилительное «только», не требуемое исходным текстом; сохранены приблизительное число, традиционная форма топонима и указание на непрерывное перемещение.
