base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/023.yaml
  text: See and find out from all the hiding places where he hides there, then return to me with certainty, and I will go with you. And if he is in the land, I will search him out among all the clans of Judah.
translation:
  language: ru
  text: Осмотрите и разузнайте обо всех укрытиях, где он прячется, а затем возвратитесь ко мне с достоверными сведениями, и я пойду с вами. Если он находится в стране, я разыщу его среди всех родов Иуды[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во всех тысячах Иуды»; вероятно, имеются в виду родовые или общественно-военные подразделения Иуды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאוּ וּדְעוּ
  choice: Осмотрите и разузнайте
  rationale: Два повелительных глагола передают призыв сначала тщательно осмотреть местность, а затем добыть точные сведения; «разузнайте» естественно выражает исследовательский смысл דעוּ в данном контексте.
- source_word: מִכֹּל הַמַּחֲבֹאִים
  choice: обо всех укрытиях
  rationale: מַחֲבֹאִים означает места укрытия. Русское управление «разузнайте обо всех укрытиях» передаёт функцию предлога מִן без неестественного буквального «из всех укрытий».
- source_word: אֲשֶׁר יִתְחַבֵּא שָׁם
  choice: где он прячется
  rationale: Возвратная форма יִתְחַבֵּא передана глаголом «прячется». Пространственное שָׁם естественно включено в русское «где», без избыточного «там».
- source_word: וְשַׁבְתֶּם אֵלַי אֶל נָכוֹן
  choice: а затем возвратитесь ко мне с достоверными сведениями
  rationale: Последовательность действий выражена словами «а затем». נָכוֹן указывает на надёжность и подтверждённость полученной информации; добавление «сведениями» делает подразумеваемый смысл ясным по-русски.
- source_word: וְהָלַכְתִּי אִתְּכֶם
  choice: и я пойду с вами
  rationale: Прямо сохраняет обещание Саула лично отправиться вместе с ними.
- source_word: וְהָיָה אִם יֶשְׁנוֹ בָאָרֶץ
  choice: Если он находится в этой земле
  rationale: Условная конструкция передана естественно; «этой» указывает на обсуждаемую область, не уточняя её сверх исходного текста.
- source_word: וְחִפַּשְׂתִּי אֹתוֹ
  choice: я разыщу его
  rationale: Глагол חפשׂ обозначает тщательный поиск; «разыщу» сохраняет целенаправленный и результативный оттенок.
- source_word: בְּכֹל אַלְפֵי יְהוּדָה
  choice: среди всех родов Иуды
  rationale: אַלְפֵי буквально означает «тысячи», но здесь, вероятно, обозначает родовые или общественно-военные подразделения Иуды. «Роды» понятно современному читателю; буквальное выражение сохранено в примечании.
