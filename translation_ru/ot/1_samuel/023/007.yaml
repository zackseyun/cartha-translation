base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/007.yaml
  text: And it was reported to Saul that David had come to Keilah[a]. So Saul said, “God has delivered him into my hand[b], for he has shut himself in by entering a city with doors and bars.”
translation:
  language: ru
  text: 'И донесли Саулу, что Давид пришёл в Кеиль. Тогда Саул сказал: «Бог предал его в мою руку[a], ибо, войдя в город с двустворчатыми воротами и засовом[b], он оказался заперт».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог отдал его в мою власть». Буквально: «в мою руку».'
    reason: lexical_alternative
  - marker: b
    text: Имеются в виду укреплённые городские ворота из двух створок, запиравшиеся поперечным засовом.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: донесли
  rationale: Хофал от נגד передаёт пассивное сообщение сведений; русская безличная конструкция естественна и сохраняет смысл.
- source_word: בָא דָוִד קְעִילָה
  choice: Давид пришёл в Кеиль
  rationale: בוא с названием места означает приход или вход; «пришёл в Кеиль» естественно для повествовательного сообщения.
- source_word: נִכַּר אֹתוֹ אֱלֹהִים בְּיָדִי
  choice: Бог предал его в мою руку
  rationale: Редкое употребление נכר здесь означает «отдать, предать»; сохраняется образ власти над противником, выраженный идиомой «в руку».
- source_word: נִסְגַּר
  choice: он сам запер себя
  rationale: Нифаль допускает пассивное или возвратное понимание. По контексту Саул считает, что Давид собственным решением оказался в ловушке; частица «сам» ясно передаёт эту мысль.
- source_word: לָבוֹא
  choice: войдя
  rationale: Инфинитив поясняет, каким образом Давид, по мнению Саула, оказался заперт.
- source_word: בְּעִיר דְּלָתַיִם וּבְרִיחַ
  choice: в город с двустворчатыми воротами и засовом
  rationale: Двойственное דְּלָתַיִם указывает на две створки городских ворот, а единственное בְּרִיחַ — на запирающий их засов; перевод сохраняет конкретный образ укреплённого города.
theological_decisions:
- issue: Саул приписывает уязвимость Давида действию Бога
  choice: 'Слова Саула переданы как прямое утверждение: «Бог предал его в мою руку».'
  alternative: 'Добавить дистанцирующее пояснение: «Саул решил, что Бог предал его в его руку».'
  rationale: Еврейский текст прямо цитирует Саула и не выражает здесь одобрения рассказчика. Перевод сохраняет напряжение, не подтверждая и не опровергая его богословскую оценку.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. Союз «И» сохраняет повествовательную связь; идиома «в мою руку» оставлена в тексте и пояснена в сноске. Название קְעִילָה передано в принятой русской библейской форме «Кеиль».
