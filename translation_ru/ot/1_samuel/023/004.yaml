base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/004.yaml
  text: David again inquired of the LORD, and the LORD answered him and said, “Rise, go down to Keilah, for I am giving the Philistines into your hand.”
translation:
  language: ru
  text: 'Давид снова вопросил Господа, и Господь ответил ему: «Встань, спустись в Кеиль, потому что Я предам филистимлян в твои руки».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד
  choice: снова
  rationale: Сочетание выражает повторность действия; естественное русское «снова» передаёт смысл без избыточного буквального удвоения.
- source_word: לִשְׁאֹל בַּיהוָה
  choice: вопросил Господа
  rationale: Устойчивое библейское выражение означает обращение к Господу за указанием; «вопросил» сохраняет достоинство регистра и отличается от обычного бытового «спросил».
- source_word: קוּם רֵד
  choice: Встань, спустись
  rationale: Сохранены два повеления и пространственное значение רֵד; речь идёт о движении к Кеилю.
- source_word: אֲנִי נֹתֵן
  choice: Я предам
  rationale: В данном военном контексте идиоматически означает отдать противника во власть Давида; русское будущее передаёт обещанный ближайший результат.
- source_word: בְּיָדֶךָ
  choice: в твои руки
  rationale: Сохранён конкретный образ еврейской идиомы, понятный по-русски как передача во власть.
- source_word: קְעִילָה
  choice: Кеиль
  rationale: 'Передача топонима согласована с традиционной русской библейской формой и нормой склонения: «в Кеиль».'
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: Господь
  alternative: Яхве
  rationale: Традиционная русская передача малой капителью в исходном консультационном слое здесь выражена нормативным «Господь»; она не добавляет конфессионального толкования.
- issue: Временная форма обещания אֲנִי נֹתֵן
  choice: Я предам
  alternative: Я отдаю
  rationale: Причастная форма допускает оттенок уже совершаемого или твёрдо предстоящего действия. В контексте повеления перед битвой естественное русское будущее выражает уверенность обещания, не превращая его в утверждение об уже завершённой победе.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Синтаксис ясный и компактный; сохранены повтор имени Господа, оба повеления и образ «в руки».
