base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/025.yaml
  text: So Saul and his men went to seek him. And they told David[a], so he went down to the rock and stayed in the wilderness of Maon. When Saul heard, he pursued David in the wilderness of Maon.
translation:
  language: ru
  text: Итак, Саул и его люди пошли искать Давида. Об этом сообщили Давиду, и он спустился к скале[a] и остался в пустыне Маон. Когда Саул услышал об этом, он погнался за Давидом по пустыне Маон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к утёсу». Еврейское слово, вероятно, обозначает приметную скалу, утёс или скальное укрепление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַקֵּשׁ
  choice: искать Давида
  rationale: Инфинитив выражает цель движения. Объект, отсутствующий в еврейском тексте, естественно восстанавливается из контекста; имя «Давид» яснее русского местоимения.
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: Об этом сообщили Давиду
  rationale: Сохранена активная форма с неопределённым множественным субъектом, естественно передаваемая русской неопределённо-личной конструкцией.
- source_word: וַיֵּרֶד
  choice: он спустился
  rationale: Передаёт направленное вниз движение и звучит естественно в современном русском повествовании.
- source_word: הַסֶּלַע
  choice: к скале
  rationale: Существительное обозначает скалу, утёс или заметное скальное образование; артикль может указывать на известное в данной местности место.
- source_word: וַיֵּשֶׁב
  choice: остался
  rationale: В данном повествовательном контексте глагол указывает на пребывание в месте, а не обязательно на постоянное поселение.
- source_word: בְּמִדְבַּר מָעוֹן / מִדְבַּר מָעוֹן
  choice: в пустыне Маон / по пустыне Маон
  rationale: 'מִדְבָּר обозначает пустынную, малонаселённую местность, не обязательно песчаную. Различие предлогов обусловлено русским управлением: пребывание «в», преследование «по» местности.'
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: он погнался за
  rationale: Естественно передаёт идиому преследования и сохраняет динамику действия.
- source_word: וַיֵּלֶךְ שָׁאוּל וַאֲנָשָׁיו
  choice: Итак, Саул и его люди пошли
  rationale: Связка продолжает развитие событий предыдущего стиха; «итак» передаёт следственный оттенок и сохраняет плавность повествования.
