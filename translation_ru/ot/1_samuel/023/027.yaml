  text: 'Но к Саулу пришёл вестник и сказал: «Поспеши и иди, потому что филистимляне совершили набег на страну».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְאָךְ
  choice: Но… вестник
  rationale: מַלְאָךְ здесь означает человеческого посланца; союз передан как «но», поскольку сообщение прерывает преследование Давида и меняет ход событий.
- source_word: מַהֲרָה וְלֵכָה
  choice: Поспеши и иди
  rationale: Сохранены два повеления исходного текста без подмены второго глагола значением «приди».
- source_word: פָשְׁטוּ… עַל־הָאָרֶץ
  choice: вторглись в страну
  rationale: Глагол обозначает стремительное нападение или набег; «вторглись» естественно передаёт военное движение против территории, а «страну» — контекстуальное значение הָאָרֶץ.
