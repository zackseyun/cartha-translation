  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֵּ֨שֶׁב דָּוִ֤ד בַּ/מִּדְבָּר֙ בַּ/מְּצָד֔וֹת וַ/יֵּ֥שֶׁב בָּ/הָ֖ר בְּ/מִדְבַּר זִ֑יף וַ/יְבַקְשֵׁ֤/הוּ שָׁאוּל֙ כָּל הַ/יָּמִ֔ים וְ/לֹֽא נְתָנ֥/וֹ אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/014.yaml
  text: David stayed in the wilderness strongholds[a], and he stayed in the hill country in the wilderness of Ziph. Saul sought him all the days, but God did not give him into his hand.
translation:
  language: ru
  text: Давид оставался в укреплённых местах в пустыне и жил в горной местности пустыни Зиф. Саул искал его всё это время, но Бог не отдал Давида в руки Саула[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не отдал его в его руку», то есть под его власть.'
    reason: Передаёт буквальную форму еврейской идиомы, которая в основном тексте естественно выражена словами «в руки Саула».
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: оставался / жил
  rationale: Глагол יָשַׁב может означать «сидеть», «жить», «пребывать», «оставаться». Два близких русских глагола естественно передают повтор в еврейском тексте и длительное пребывание Давида в этих местах.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает необрабатываемую, малонаселённую местность и не обязательно песчаную пустыню. В данном географическом и библейском контексте «пустыня» — ясный и традиционный русский эквивалент.
- source_word: בַּמְּצָדוֹת
  choice: в укреплённых местах
  rationale: מְצָדוֹת — защищённые, удобные для обороны места. Перевод передаёт оборонительный смысл, не создавая впечатления, будто речь непременно идёт о построенных крепостях.
- source_word: בָּהָר
  choice: в горной местности
  rationale: הַר может обозначать как отдельную гору, так и гористую область. Контекст пустыни Зиф указывает здесь на местность, а не обязательно на одну вершину.
- source_word: בְּמִדְבַּר זִיף
  choice: пустыни Зиф
  rationale: Сопряжённая конструкция называет пустынную область, связанную с Зифом; форма «пустыня Зиф» естественна для русского библейского географического названия.
- source_word: וַיְבַקְשֵׁהוּ
  choice: искал его
  rationale: בקשׁ в данном повествовательном контексте означает разыскивать человека; «искал» кратко и точно передаёт продолжающееся преследование.
- source_word: כָּל הַיָּמִים
  choice: всё это время
  rationale: Буквально «все дни». Русское выражение «всё это время» естественно передаёт длительность и постоянство действий Саула, не подразумевая обязательно ежедневный поиск.
- source_word: וְלֹא נְתָנוֹ
  choice: не отдал Давида
  rationale: נתן в сочетании с «в руку» означает отдать под чью-либо власть. Повтор имени вместо двух местоимений устраняет неестественную для русского фразы двусмысленность, не меняя смысла.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Хотя форма אֱלֹהִים морфологически множественная, здесь она относится к Богу Израиля и согласуется с глагольной формой единственного числа.
- source_word: בְּיָדוֹ
  choice: в руки Саула
  rationale: Еврейское «в его руку» — идиома передачи под власть другого. Русское «в руки Саула» сохраняет образ и ясно обозначает референта местоимения.
theological_decisions:
- issue: Божественное сохранение Давида
  choice: Бог не отдал Давида в руки Саула
  alternative: Бог не позволил Саулу схватить Давида
  rationale: Выбранный вариант прямо сохраняет приписывание исхода действию Бога и образ еврейской идиомы, не расширяя утверждение о провидении дополнительными пояснениями.
translation_notes:
  register: Современный литературный русский язык с сдержанным повествовательным тоном. Географическая и военная лексика понятна широкому читателю; еврейская идиома сохранена в естественной русской форме и пояснена в сноске.
