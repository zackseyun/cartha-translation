  yaml_path: translation/ot/1_samuel/023/020.yaml
  text: Now then[a], O king, come down according to all the desire of your soul to come down[b], and it is for us to hand him over into the king’s hand.
translation:
  language: ru
  text: Итак, царь, если всей душой желаешь спуститься[a], спускайся же[b], а наше дело — выдать его в руки царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по всему желанию твоей души»; это выражение означает сильное, искреннее желание.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте глагол «спуститься» повторён в форме инфинитива и повелительного наклонения для усиления: «спуститься — спускайся».'
    reason: source_structure
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт переход к непосредственному призыву; в современном русском звучит естественнее буквального «и теперь».
- source_word: לְכָל אַוַּת נַפְשְׁךָ
  choice: если ты всей душой желаешь
  rationale: Передаёт полноту сильного личного желания и сохраняет образ души, не прибегая к неестественному обороту «по всему желанию твоей души».
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное употреблено как обращение; русский звательный смысл ясно выражается формой «царь» без архаизирующего «о».
- source_word: לָרֶדֶת רֵד
  choice: желaешь спуститься… непременно спускайся
  rationale: Инфинитив и повелительная форма одного корня образуют усилительную конструкцию. Повтор глагола сохранён, а усиление выражено словом «непременно».
- source_word: וְלָנוּ
  choice: а наше дело
  rationale: Конструкция подчёркивает возложенную на говорящих задачу и распределение ролей.
- source_word: הַסְגִּירוֹ
  choice: выдать его
  rationale: В породе hифиль глагол означает передачу человека во власть другого; «выдать» точно и естественно передаёт враждебный контекст.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: в руки царя
  rationale: Сохраняет еврейский образ руки как власти и одновременно является естественным русским выражением.
