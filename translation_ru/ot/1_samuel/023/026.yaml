base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/026.yaml
  text: Saul was going on one side of the mountain[a], and David and his men were on the other side of the mountain. David was hurrying to go away from Saul[c][b], while Saul and his men were closing in on David and his men to capture them.
translation:
  language: ru
  text: Саул шёл по одну сторону горы[a], а Давид со своими людьми — по другую сторону горы. Давид спешил уйти от Саула, между тем как Саул и его люди окружали Давида и его людей, чтобы схватить их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Саул шёл по стороне горы с этой стороны, а Давид и его люди — по стороне горы с этой стороны». Перевод «по одну сторону… по другую сторону» передаёт подразумеваемое противопоставление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сжимали кольцо вокруг Давида и его людей, чтобы захватить их».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: шёл
  rationale: Форма продвигает повествование, но в данном контексте также описывает движение, одновременное с движением Давида; несовершенный вид естественно передаёт эту сцену.
- source_word: מִצַּד הָהָר מִזֶּה ... מִצַּד הָהָר מִזֶּה
  choice: по одной стороне горы ... по другой стороне горы
  rationale: Еврейский текст буквально дважды указывает «с этой стороны», создавая пространственное противопоставление. Русское «по одной... по другой» ясно и естественно выражает подразумеваемое расположение.
- source_word: נֶחְפָּז
  choice: спешил
  rationale: Причастие нифаля обозначает поспешность и срочность; «спешил» передаёт это без добавления оттенка паники.
- source_word: לָלֶכֶת מִפְּנֵי שָׁאוּל
  choice: уйти от Саула
  rationale: 'Буквально: «идти от лица Саула». «Уйти от Саула» сохраняет основной глагольный смысл и не усиливает его до явно выраженного бегства.'
- source_word: עֹטְרִים
  choice: окружали
  rationale: Глагол описывает охватывающее движение войска вокруг Давида. «Окружали» сохраняет образ исходного слова; возможный динамический смысл — «сжимали кольцо вокруг».
- source_word: לְתָפְשָׂם
  choice: чтобы схватить их
  rationale: Инфинитив обозначает цель; «схватить» непосредственно передаёт значение תפׂש, тогда как «взять в плен» было бы более контекстуальным истолкованием.
