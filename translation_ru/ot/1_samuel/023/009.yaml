base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/009.yaml
  text: When David learned that Saul was secretly plotting harm against him[a], he said to Abiathar the priest[b], “Bring the ephod here.”
translation:
  language: ru
  text: 'Когда Давид узнал, что Саул замышляет против него зло[a], он сказал священнику Авиафару: «Принеси сюда эфод[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «готовит ему беду».'
    reason: lexical_alternative
  - marker: b
    text: В этом повествовании эфод — священнический предмет, связанный с обращением к Богу за указанием.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּדַע
  choice: узнал
  rationale: В повествовательной последовательности глагол указывает на то, что Давиду стало известно о замысле Саула; «узнал» естественно передаёт это в современном русском языке.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что узнал Давид.
- source_word: עָלָיו
  choice: против него
  rationale: В сочетании с обозначением злого замысла предлог выражает враждебную направленность действий против Давида.
- source_word: מַחֲרִישׁ
  choice: замышляет
  rationale: Причастная форма передаёт продолжающееся намеренное действие — подготовку враждебного замысла. Русское «замышляет» сохраняет эту окраску, не делая скрытность отдельным бесспорным элементом значения.
- source_word: הָרָעָה
  choice: зло
  rationale: '«Зло» сохраняет широту еврейского слова: речь может идти как о злом намерении, так и о беде или вреде, который Саул готовит Давиду.'
- source_word: אֶל אֶבְיָתָר הַכֹּהֵן
  choice: священнику Авиафару
  rationale: Естественный русский порядок слов ясно передаёт имя и служение адресата.
- source_word: הַגִּישָׁה
  choice: принеси сюда
  rationale: Повелительная форма означает веление приблизить или подать предмет; в данной сцене «принеси сюда» звучит естественно и сохраняет направленность действия.
- source_word: הָאֵפוֹד
  choice: эфод
  rationale: Сохранён общепринятый библейский термин для особого священнического предмета или облачения; обобщающий перевод утратил бы конкретность.
theological_decisions:
- issue: Характер замысла Саула в выражении מַחֲרִישׁ הָרָעָה
  choice: Саул замышляет против Давида зло
  alternative: Саул тайно готовит Давиду беду
  rationale: Основной текст сохраняет нравственную и событийную широту слова רעה и передаёт враждебное планирование, но не превращает возможный оттенок скрытности в однозначное утверждение.
translation_notes:
  register: Современный литературный русский язык с традиционными библейскими именами и термином «эфод». Синтаксис прост и достоин; неоднозначность רעה сохранена в основном тексте и пояснена в сноске.
