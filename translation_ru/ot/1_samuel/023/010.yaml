  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שָׁמֹ֤עַ שָׁמַע֙ עַבְדְּ/ךָ֔ כִּֽי מְבַקֵּ֥שׁ שָׁא֖וּל לָ/ב֣וֹא אֶל קְעִילָ֑ה לְ/שַׁחֵ֥ת לָ/עִ֖יר בַּ/עֲבוּרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/010.yaml
  text: Then David said[a], “O Yahweh, God of Israel, your servant has surely heard that Saul is seeking to come to Keilah to destroy the city because of me.”
translation:
  language: ru
  text: 'Тогда Давид сказал: «Яхве[a], Боже Израиля, Твой слуга доподлинно услышал, что Саул намеревается прийти в Кеиль и погубить город из-за меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (тетраграмматон); традиционно переводится «Господь».'
    reason: Указывает традиционную альтернативу передаче Божьего имени.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда Давид сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямое и естественное воспроизведение сочетания в сопряжённой конструкции.
- source_word: שָׁמֹעַ שָׁמַע
  choice: доподлинно услышал
  rationale: Инфинитив абсолютный при личной форме усиливает глагольное значение; «доподлинно» сохраняет эмфазу и звучит естественно в торжественной молитвенной речи.
- source_word: עַבְדְּךָ
  choice: Твой слуга
  rationale: Почтительное самообозначение Давида при обращении к Богу; третье лицо сохраняет еврейскую форму.
- source_word: מְבַקֵּשׁ
  choice: намеревается
  rationale: Причастие обозначает текущее стремление или намерение Саула; русский глагол передаёт смысл естественнее буквального «ищет».
- source_word: לָבוֹא אֶל קְעִילָה
  choice: прийти в Кеиль
  rationale: Сохраняется направительное значение בוא; для названия города по-русски естествен предлог «в».
- source_word: לְשַׁחֵת
  choice: погубить
  rationale: В военном контексте глагол означает причинить уничтожение; «погубить город» передаёт тяжесть угрозы и естественно сочетается с объектом.
- source_word: לָעִיר
  choice: город
  rationale: Определённый объект относится к уже названному Кеилю; в русском контексте определённость ясна без отдельного артикля.
- source_word: בַּעֲבוּרִי
  choice: из-за меня
  rationale: 'Ясно передаёт причинное значение выражения: город подвергается угрозе по причине присутствия Давида.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Самообозначение Давида в третьем лице
  choice: Твой слуга доподлинно услышал
  alternative: Я доподлинно услышал
  rationale: Сохранена почтительная молитвенная формула исходного текста без замены её прямым первым лицом.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Синтаксис остаётся ясным для широкого читателя; обращение «Бог Израиля!» оформлено естественно по-русски. Название קְעִילָה передано в принятой русской библейской форме «Кеиль».
