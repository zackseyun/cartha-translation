  source_fidelity: 'Основной смысл передан верно: Саул прекращает погоню за Давидом и идёт навстречу филистимлянам; название места объясняется этим событием. Однако «Тогда» не отражает простого повествовательного וַ־, а «прекратил преследовать» несколько сглаживает значение וַיָּשָׁב («повернул/отступил, прекратив прежнее направление»). Более точная русская конструкция может передать прекращение погони без добавления временного оттенка.'
