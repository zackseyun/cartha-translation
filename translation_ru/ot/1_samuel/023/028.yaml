lexical_decisions:
- source_word: וַיָּשָׁב
  choice: прекратил
  rationale: В сочетании с מִרְדֹף глагол указывает на прекращение Саулом прежнего действия; по-русски «прекратил преследовать» естественно и точно передаёт смысл оборота.
- source_word: מִרְדֹף אַחֲרֵי
  choice: преследовать
  rationale: רדף в военном повествовательном контексте означает погоню или преследование; инфинитив с מן обозначает прекращение действия.
- source_word: לִקְרַאת
  choice: навстречу
  rationale: Слово обозначает движение навстречу кому-либо и само по себе не уточняет, идёт ли речь о встрече или сражении; перевод сохраняет эту широту.
- source_word: פְּלִשְׁתִּים
  choice: филистимлянам
  rationale: Устоявшееся русское наименование этого народа; дательный падеж обусловлен оборотом «пошёл навстречу».
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Формула вводит объяснение названия места; «Поэтому» кратко и естественно связывает название с событием.
- source_word: קָרְאוּ לַמָּקוֹם הַהוּא
  choice: то место назвали
  rationale: Неопределённое множественное число в еврейском не требует называть действующее лицо; русская неопределённо-личная конструкция передаёт это прямо.
- source_word: סֶלַע
  choice: Скала
  rationale: סלע обозначает скалу или скальное образование; «Скала» уместно как часть топонима.
- source_word: הַמַּחְלְקוֹת
  choice: Разделения
  rationale: Форма связана с идеей разделения или расхождения. Родительный падеж естественен в русском составном названии; возможные нюансы сохранены в примечании.
