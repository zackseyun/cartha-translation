base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/024.yaml
  text: They arose and went to Ziph ahead of Saul[a]. Now David and his men were in the wilderness of Maon, in the Arabah[b], to the south of the Jeshimon.
translation:
  language: ru
  text: Они поднялись и пошли в Зиф раньше Саула. А Давид и его люди находились в пустыне Маон, в Араве, к югу[a] от Иешимона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «справа от Иешимона»; в географическом описании «правая сторона» может означать юг.'
    reason: lexical_alternative
  - marker: b
    text: Название «Иешимон» можно также понять как «пустошь» или «безлюдная местность», однако здесь оно, вероятно, является географическим названием.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֛וּמוּ וַיֵּלְכ֥וּ
  choice: Они поднялись и пошли
  rationale: Сохранены два последовательных повествовательных глагола; формулировка естественна для современного русского языка и не уточняет способ передвижения.
- source_word: זִ֖יפָה
  choice: в Зиф
  rationale: Направительный ה указывает на движение к Зифу; по-русски это естественно передаётся сочетанием «в Зиф».
- source_word: לִפְנֵ֣י שָׁא֑וּל
  choice: раньше Саула
  rationale: В данном контексте выражение указывает, что они отправились прежде Саула; этот вариант ясно передаёт временное предшествование, не добавляя мотива или цели.
- source_word: וְדָוִ֨ד וַאֲנָשָׁ֜יו
  choice: А Давид и его люди находились
  rationale: Союз «а» естественно отмечает смену фокуса повествования, а «находились» восполняет подразумеваемую в древнееврейском безглагольную связку.
- source_word: בְּמִדְבַּ֤ר מָעוֹן֙
  choice: в пустыне Маон
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность; «пустыня Маон» сохраняет географическое наименование.
- source_word: בָּעֲרָבָ֔ה
  choice: в Араве
  rationale: С артиклем слово здесь, вероятнее всего, обозначает географическую область Арава, а не просто равнину или степь.
- source_word: אֶ֖ל יְמִ֥ין הַיְשִׁימֽוֹן
  choice: к югу от Иешимона
  rationale: יָמִין буквально означает «правая сторона», но при древней ориентации лицом на восток географически указывает на юг; буквальная возможность отмечена в сноске.
- source_word: הַיְשִׁימֽוֹן
  choice: Иешимон
  rationale: Хотя слово может означать пустошь или безлюдную местность, здесь оно, вероятно, употреблено как географическое название; смысловая альтернатива сохранена в сноске.
