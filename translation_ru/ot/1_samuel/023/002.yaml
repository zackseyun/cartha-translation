base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/002.yaml
  text: So David inquired of Yahweh[a], saying, “Shall I go and strike these Philistines?” And Yahweh said to David, “Go and strike the Philistines, and save Keilah.”
translation:
  language: ru
  text: 'И вопросил Давид Яхве: «Пойти ли мне и напасть на этих филистимлян?» Яхве ответил Давиду: «Иди, напади на филистимлян и спаси Кеиль».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: вопросил ... Яхве
  rationale: Сочетание שׁאל с בּ обозначает обращение к Богу за указанием. «Вопросил» сохраняет религиозно-консультативный смысл и уместный библейский регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: הַאֵלֵךְ
  choice: Пойти ли мне
  rationale: Естественно передаёт совещательный вопрос о том, следует ли Давиду выступить.
- source_word: וְהִכֵּיתִי / וְהִכִּיתָ
  choice: напасть / напади
  rationale: В данном военном контексте נכה означает нанесение удара по противнику. «Напасть» звучит естественнее буквального «поразить» и не предполагает заранее полного разгрома.
- source_word: בַּפְּלִשְׁתִּים הָאֵלֶּה
  choice: на этих филистимлян
  rationale: Сохраняет указательное הָאֵלֶּה и обозначает конкретный отряд филистимлян.
- source_word: וְהוֹשַׁעְתָּ
  choice: и спаси
  rationale: ישׁע означает спасти или избавить; в контексте речь идёт о спасении города от военной угрозы.
- source_word: קְעִילָה
  choice: Кеиль
  rationale: Традиционная русская форма названия города, соответствующая древнееврейскому Кеила.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет это различие и не превращает имя в титул.
- issue: Значение וְהוֹשַׁעְתָּ
  choice: спаси
  alternative: избавь
  rationale: «Спаси» сохраняет широкий смысл глагола, при этом контекст ясно показывает военное, а не специально сотериологическое значение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. Синтаксис сделан ясным и кратким; повтор ключевого военного глагола сохранён посредством однокоренных форм «напасть / напади».
