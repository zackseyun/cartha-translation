base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/019.yaml
  text: Then the Ziphites went up to Saul at Gibeah[a], saying, “Is not David hiding among us in the strongholds in the wooded area, on the hill of Hachilah[b], which is to the right of the Jeshimon?”
translation:
  language: ru
  text: 'Тогда жители Зифа поднялись к Саулу в Гиву и сказали: «Разве Давид не скрывается у нас, в укреплённых местах, в лесистой местности[a], на холме Хахила, который находится справа от Иешимона[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Хореше», если это слово является названием местности.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «справа от Иешимона». В древнееврейском географическом употреблении «справа» могло означать «к югу». «Иешимон» также можно понимать как «пустошь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: пришли
  rationale: Глагол עלה буквально указывает на движение вверх, однако по-русски в сочетании с адресатом естественнее «пришли к Саулу»; направление к Гиве сохраняется контекстом.
- source_word: זִפִים
  choice: жители Зифа
  rationale: Форма обозначает жителей города или области Зиф; описательное русское обозначение яснее искусственного этнонима «зифеи».
- source_word: הַגִּבְעָתָה
  choice: в Гиву
  rationale: Направительное окончание указывает на движение к Гиве; русское «пришли к Саулу в Гиву» передаёт и направление, и место пребывания Саула.
- source_word: לֵאמֹר
  choice: и сказали
  rationale: Еврейский инфинитив вводит прямую речь; в современном русском повествовании естественно передаётся личной формой.
- source_word: הֲלוֹא
  choice: Разве ... не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: מִסְתַּתֵּר
  choice: скрывается
  rationale: Возвратная форма и причастное значение указывают на продолжающееся укрывательство.
- source_word: עִמָּנוּ
  choice: у нас
  rationale: Буквально «с нами», но здесь речь о пребывании Давида на территории жителей Зифа; «у нас» естественно выражает это по-русски.
- source_word: בַמְּצָדוֹת
  choice: в укреплённых местах
  rationale: Существительное обозначает укрепления или удобные для обороны убежища; выбранная формулировка сохраняет топографический характер без предположения о построенных крепостях.
- source_word: בַּחֹרְשָׁה
  choice: в лесистой местности
  rationale: Форма допускает понимание как нарицательного обозначения лесистой местности и как топонима Хореш; основное значение дано в тексте, топонимическое — в сноске.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: на холме Хахила
  rationale: Прямо и естественно передаёт топографическое выражение; Хахила сохранено как имя собственное.
- source_word: אֲשֶׁר מִימִין הַיְשִׁימוֹן
  choice: который находится справа от пустоши
  rationale: Сохраняет буквальный образ «справа», не устраняя возможную географическую ориентировку; הַיְשִׁימוֹן здесь передано нарицательно как безлюдная пустошь, с возможностью топонимического понимания в сноске.
