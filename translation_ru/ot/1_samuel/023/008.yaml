    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: созвал
  rationale: В породе хифиль глагол שׁמע буквально имеет значение «дал услышать», а в данном военно-административном контексте означает призыв или сбор людей. «Созвал» естественно передаёт и каузативность, и мобилизацию.
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Это буквальное соответствие еврейскому выражению. Контекст показывает, что имеются в виду люди, призванные для военных действий, однако слово «войско» в оригинале здесь не употреблено.
- source_word: לַמִּלְחָמָה
  choice: на войну
  rationale: Предложное сочетание обозначает цель созыва — военные действия. «На войну» звучит естественно и сохраняет более широкое значение, чем «на битву».
- source_word: לָרֶדֶת
  choice: пойти
  rationale: Глагол ירד буквально означает «спуститься», но в древнееврейском повествовании часто употребляется как обычное обозначение перемещения. Поскольку относительная высота мест здесь несущественна для русского читателя, «пойти» естественно передаёт смысл.
- source_word: קְעִילָה
  choice: Кеиль
  rationale: Форма названия согласована с принятой русской библейской традицией и грамматически оформлена как несклоняемый топоним мужского рода.
- source_word: לָצוּר
  choice: осадить
  rationale: В данном военном контексте צור означает окружить противника или держать его в осаде. Совершенный вид передаёт намеченную цель похода.
- source_word: אֶל דָּוִד וְאֶל אֲנָשָׁיו
  choice: Давида и его людей
  rationale: Предлог אֶל при צור указывает на цель осады. «Его люди» сохраняет широту אֲנָשָׁיו и не уточняет без основания, что это регулярные воины.
