lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Стандартная повествовательная форма от אמר; начальный союз в современном русском повествовании естественно опускается.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Традиционная русская форма библейского личного имени.
- source_word: בְּרוּכִים אַתֶּם
  choice: Да благословит вас
  rationale: Именная конструкция с прилагательным и местоимением здесь служит формулой благословения; пожелательная форма естественно передаёт её перформативную силу.
- source_word: לַיהוָה
  choice: Яхве
  rationale: В формуле благословения предлог ל обозначает отношение к источнику благословения; русская конструкция «Да благословит вас Яхве» ясно выражает этот смысл без отдельной передачи предлога.
- source_word: כִּי
  choice: за то, что
  rationale: Союз вводит основание благословения; эта русская конструкция естественно передаёт причинный смысл.
- source_word: חֲמַלְתֶּם
  choice: пожалели
  rationale: חמל обозначает жалость или сострадание и в некоторых контекстах — пощаду. При дополнении «меня» русское «пожалели» сохраняет эмоционально-отношенческий смысл и допускает оттенок милости.
- source_word: עָלָי
  choice: меня
  rationale: После חמל предлог על образует идиоматическую конструкцию; по-русски она естественно передаётся переходным глаголом «пожалеть кого».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя и соответствует указанному решению консультационного слоя.
- issue: Характер слов Саула
  choice: 'пожелание благословения: «Да благословит вас»'
  alternative: 'утверждение: «Благословенны вы у Яхве»'
  rationale: Еврейская именная конструкция допускает буквальное утверждение, но в данном речевом контексте действует как формула благословения. Альтернатива отмечена в сноске, чтобы не устранять грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой и достойной повествовательной формой. «Пожалели меня» понятно обычному читателю и ближе к непосредственной семантике חמל, чем более книжное «проявили ко мне сострадание».
