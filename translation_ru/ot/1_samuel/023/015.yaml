translation:
  language: ru
  text: Давид узнал, что Саул вышел на его поиски, чтобы лишить его жизни, а сам Давид находился в пустыне Зиф, в Хореше[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в лесу»; возможно также: «в лесистой местности». Еврейское слово можно понять как нарицательное, однако здесь оно, вероятно, является названием места — Хореш.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: узнал
  rationale: Глагол ראה буквально означает «увидел», но также выражает восприятие или осознание. В данном контексте «узнал» естественно передаёт получение Давидом сведений о действиях Саула и не создаёт впечатления, будто Давид лично видел его выступление.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что стало известно Давиду.
- source_word: יָצָא
  choice: выступил в поход
  rationale: יצא означает «выйти». Здесь речь идёт о том, что Саул отправился с вооружёнными людьми преследовать Давида; «выступил в поход» естественно передаёт это движение, не добавляя результата преследования.
- source_word: לְבַקֵּשׁ אֶת־נַפְשׁוֹ
  choice: чтобы лишить его жизни
  rationale: Буквально оборот означает «искать его жизнь/душу», а в данном контексте — разыскивать человека с намерением убить. Русское выражение передаёт смертельную угрозу без неестественной кальки «искать его жизнь».
- source_word: בְּמִדְבַּר זִיף
  choice: в пустыне Зиф
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность или степь. «Пустыня Зиф» — ясное и традиционно узнаваемое географическое обозначение.
- source_word: בַּחֹרְשָׁה
  choice: в Хореше[a]
  rationale: Форма может обозначать лесистое место, но в этом контексте, вероятнее всего, служит названием местности. Топоним сохранён в основном тексте, а лексическая возможность указана в сноске.
- source_word: וְדָוִד
  choice: а сам Давид находился
  rationale: Союз вводит сопутствующее указание на местонахождение Давида. Конструкция «а сам Давид находился» ясно различает действия Саула и положение Давида.
