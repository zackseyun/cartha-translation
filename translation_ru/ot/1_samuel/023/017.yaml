base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/017.yaml
  text: He said to him[a], “Do not be afraid, for the hand of Saul my father will not find you. You will reign over Israel, and I will be second to you[b]. Even Saul my father knows this.”
translation:
  language: ru
  text: 'Он сказал ему: «Не бойся: рука моего отца Саула не настигнет тебя[a]. Ты будешь царствовать над Израилем, а я буду вторым после тебя[b]. И мой отец Саул тоже знает, что так и будет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рука моего отца Саула не найдёт тебя». «Рука» здесь означает власть или возможность схватить.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «а я буду при тебе вторым»; то есть буду занимать положение, следующее после твоего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Естественная для современного русского языка передача отрицательного повеления с ירא, сохраняющая его прямую силу.
- source_word: לֹא תִמְצָאֲךָ יַד שָׁאוּל אָבִי
  choice: рука моего отца Саула не настигнет тебя
  rationale: Сохранён конкретный образ «руки» как обозначения власти или хватки; глагол «настигнет» естественно передаёт угрозу преследования, не сводя смысл исключительно к пленению или убийству.
- source_word: וְאַתָּה תִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: Ты будешь царствовать над Израилем
  rationale: Передаёт глагольную форму מלך и ясно выражает будущее царствование Давида.
- source_word: וְאָנֹכִי אֶהְיֶה לְּךָ לְמִשְׁנֶה
  choice: а я буду вторым после тебя
  rationale: מִשְׁנֶה указывает на второе, подчинённое положение. Формулировка сохраняет иерархию, не вводя современную должность.
- source_word: וְגַם שָׁאוּל אָבִי יֹדֵעַ כֵּן
  choice: И мой отец Саул тоже знает, что так и будет
  rationale: Явно и естественно передаёт כֵּן как отсылку ко всему предыдущему утверждению; частица «тоже» соответствует וְגַם без необходимости усиливать её до «даже».
theological_decisions:
- issue: Степень богословской определённости в словах Ионафана о будущем царствовании Давида и собственном подчинённом положении
  choice: Передать слова как прямое ожидание политического и провиденциального будущего, не добавляя упоминания Божьего назначения
  alternative: Истолковать высказывание как явно выраженное богословское пророчество о Божьем избрании Давида
  rationale: В самом стихе Ионафан уверенно говорит о будущем царствовании Давида, но имя Господа и прямое указание на Божье назначение здесь отсутствуют. Перевод не добавляет того, чего нет в данной фразе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранён образ «руки», но менее естественное русское «не найдёт тебя» вынесено в примечание. Синтаксис прямой и доступный; неоднозначность слова מִשְׁנֶה отражена в сноске.
