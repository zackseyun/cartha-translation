base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/020.yaml
  text: Then Saul and all the people who were with him were summoned, and they came to the battle[a]. And behold, every man's sword was against his companion[b], with very great confusion.
translation:
  language: ru
  text: Тогда Саул и весь народ, бывший с ним, были созваны[a] и пришли к месту сражения. И вот, меч каждого был обращён против своего товарища, и царило чрезвычайное смятение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подняли крик» либо «собрались по тревоге». Еврейский глагол здесь допускает несколько толкований.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чрезвычайно великая паника» либо «чрезвычайно великая сумятица».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֵק
  choice: были созваны
  rationale: Нифаль допускает пассивное или возвратное понимание. В данном контексте пассивное «были созваны» передаёт сбор Саула и его людей в ответ на происходящее, не превращая форму без основания в активное «созвал».
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: весь народ, бывший с ним
  rationale: Сохраняет обычное значение עָם и относительную конструкцию; военный контекст понятен из повествования без более узкого слова «воины».
- source_word: וַיָּבֹאוּ עַד הַמִּלְחָמָה
  choice: пришли к месту сражения
  rationale: Сочетание בוא с עַד обозначает достижение места, где идёт бой. «К месту сражения» естественно по-русски и не утверждает сверх текста, что они уже вступили в бой.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт внезапное переключение внимания на открывшуюся Саулу картину и сохраняет живость повествования.
- source_word: חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: меч каждого был обращён против другого
  rationale: Передаёт буквальный образ «меч человека против его ближнего/товарища» и взаимное сражение внутри неприятельского стана, не добавляя эмоционального оттенка дружбы.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: царило чрезвычайно великое смятение
  rationale: מְהוּמָה охватывает значения смятения, паники и сумятицы. «Смятение» хорошо передаёт хаотическое состояние, приведшее к взаимному поражению мечом; глагол «царило» делает бессоюзное еврейское завершение естественным по-русски.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Формула «И вот» сохраняет библейскую динамику, а остальная фраза избегает архаизмов. Подлинная неоднозначность глагола וַיִּזָּעֵק и существительного מְהוּמָה вынесена в примечания.
