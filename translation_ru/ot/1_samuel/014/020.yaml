    issue: «против другого» вместо «против своего товарища»
    rationale: Еврейское רֵעֵהוּ содержит суффикс «его» и обозначает другого человека как его товарища/соплеменника. Формулировка «против другого» ослабляет эту связь и менее ясна при слове «каждого».
