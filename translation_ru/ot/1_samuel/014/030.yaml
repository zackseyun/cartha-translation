  text: אַ֗ף כִּ֡י לוּא֩ אָכֹ֨ל אָכַ֤ל הַ/יּוֹם֙ הָ/עָ֔ם מִ/שְּׁלַ֥ל אֹיְבָ֖י/ו אֲשֶׁ֣ר מָצָ֑א כִּ֥י עַתָּ֛ה לֹֽא רָבְתָ֥ה מַכָּ֖ה בַּ/פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/030.yaml
  text: How much more if the people had eaten today from the spoil of their enemies that they found! For then the slaughter among the Philistines would have been much greater[a].
translation:
  language: ru
  text: Насколько же сильнее был бы удар по филистимлянам, если бы народ сегодня поел из добычи своих врагов, которую нашёл![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если бы только народ сегодня поел из добычи своих врагов, которую нашёл, тогда удар по филистимлянам был бы сильнее!»'
    reason: Сочетание אַף כִּי לוּא допускает передачу как усиленного контрфактического восклицания («если бы только»); מַכָּה может быть передано как «удар».
lexical_decisions:
- source_word: אַף כִּי לוּא
  choice: Тем более, если бы
  rationale: 'Сочетание вводит усиленное контрфактическое рассуждение: при несостоявшемся условии результат был бы ещё значительнее.'
- source_word: אָכֹל אָכַל
  choice: поел
  rationale: Инфинитив абсолютный усиливает глагол, однако отдельное наречие вроде «вволю» добавляло бы идею неограниченности, не выраженную однозначно; разговорно-естественное «поел» в контексте передаёт полноценное принятие пищи.
- source_word: מִשְּׁלַל אֹיְבָיו
  choice: из добычи своих врагов
  rationale: שָׁלָל — военная добыча. Формально единственное число суффикса согласуется с собирательным «народ»; русское «своих» естественно сохраняет соотнесённость с народом.
- source_word: אֲשֶׁר מָצָא
  choice: которую нашёл
  rationale: Единственное число глагола сохранено в согласовании с собирательным существительным «народ».
- source_word: מַכָּה
  choice: поражение
  rationale: В военном контексте слово обозначает удар, разгром или поражение. «Поражение» естественно сочетается с указанием на филистимлян и не сужает смысл до одного лишь числа убитых.
- source_word: לֹא רָבְתָה
  choice: было бы гораздо сильнее
  rationale: Риторическое отрицание в контрфактическом контексте естественно передаётся утвердительным сравнением; «гораздо» отражает усилительную силу высказывания.
- source_word: בַּפְּלִשְׁתִּים
  choice: филистимлян
  rationale: Предлог ב может указывать на сферу или объект нанесённого удара; при слове «поражение» русский родительный падеж ясно передаёт объект поражения.
