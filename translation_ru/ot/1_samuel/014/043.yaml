base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/043.yaml
  text: Then Saul said to Jonathan[a], “Tell me what you have done.” And Jonathan told him and said, “I indeed tasted a little honey on the tip of the staff that was in my hand, and here I am, about to die.”
translation:
  language: ru
  text: 'Тогда Саул сказал Ионафану: «Расскажи мне, что ты сделал». Ионафан рассказал ему: «Я действительно отведал немного мёда кончиком посоха, который был у меня в руке, — и вот, мне умирать»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Я действительно отведал немного мёда… и теперь мне умирать?» В еврейском тексте глагол «отведать» усилен, а последние слова могут звучать и как обречённое утверждение, и как риторический протест.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: Расскажи мне
  rationale: Повелительная форма נגד с местоименным дополнением передаёт прямое требование Саула; «расскажи мне» естественно в современной русской речи.
- source_word: מֶה עָשִׂיתָה
  choice: что ты сделал
  rationale: Прямо передаёт вопрос о завершённом поступке, последствия которого рассматриваются сейчас.
- source_word: וַיַּגֶּד לוֹ
  choice: рассказал ему
  rationale: Сохраняет лексическую связь с предыдущим נגד и подходит для повествовательного контекста.
- source_word: טָעֹם טָעַמְתִּי
  choice: я действительно отведал
  rationale: Инфинитив абсолютный при личной форме усиливает или уверенно подтверждает действие. «Действительно» сохраняет эмфазу, не добавляя явно ограничительного смысла «только».
- source_word: בִּקְצֵה הַמַּטֶּה
  choice: кончиком посоха
  rationale: קצה обозначает край или конец предмета; творительный оборот естественно передаёт способ, подразумеваемый сценой.
- source_word: הַמַּטֶּה
  choice: посох
  rationale: «Посох» — естественное обозначение носимого в руке длинного предмета в данном повествовательном контексте.
- source_word: מְעַט דְּבַשׁ
  choice: немного мёда
  rationale: Простое и точное количественное выражение на современном русском языке.
- source_word: הִנְנִי
  choice: и вот
  rationale: Передаёт указательно-восклицательную непосредственность הִנְנִי без архаического «се».
- source_word: אָמֽוּת
  choice: мне умирать
  rationale: Русская конструкция сохраняет возможность услышать слова и как обречённое утверждение, и как риторический протест, не фиксируя однозначно модальность будущего.
theological_decisions:
- issue: Модальность заключительных слов Ионафана
  choice: «и вот, мне умирать» с примечанием об интонационной неоднозначности
  alternative: «и вот, я должен умереть» / «и теперь мне умирать?»
  rationale: Еврейская форма אָמוּת без записанного вопросительного показателя допускает как смиренное утверждение о близкой смерти, так и риторический вопрос. Перевод и примечание сохраняют эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Избегаются архаизмы вроде «се» и чрезмерно канцелярское «объяви мне». Неоднозначность финальной реплики сохранена в основном тексте и пояснена в сноске.
