  text: וְ/כָל הָ/אָ֖רֶץ בָּ֣אוּ בַ/יָּ֑עַר וַ/יְהִ֥י דְבַ֖שׁ עַל פְּנֵ֥י הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/025.yaml
  text: And all the people of the land entered the forest[b][a], and there was honey on the surface of the ground.
translation:
  language: ru
  text: И весь народ[a] вошёл в лес, и на поверхности земли[b] был мёд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вся земля»; форма глагола во множественном числе позволяет понимать это выражение собирательно — как указание на людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на поверхности поля». Еврейское выражение может обозначать мёд, находившийся на видимой поверхности земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל־הָאָרֶץ
  choice: И весь народ
  rationale: 'Буквально — «и вся земля», однако глагол стоит во множественном числе (בָּאוּ), что указывает на собирательное, метонимическое значение: имеются в виду люди. «Весь народ» естественно передаёт этот смысл по-русски, не добавляя более узкого уточнения «этой земли».'
- source_word: בָּאוּ בַיַּעַר
  choice: вошёл в лес
  rationale: בוא с указанием места может означать вхождение; русское «вошёл в лес» ясно и естественно передаёт движение внутрь леса. Единственное число согласовано с собирательным существительным «народ».
- source_word: וַיְהִי דְבַשׁ
  choice: и … был мёд
  rationale: Форма היה вводит наличие мёда в описываемом месте. Конструкция с «был» сохраняет повествовательную связь и не уточняет, был ли это дикий мёд, поскольку в еврейском тексте такого определения нет.
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: на поверхности земли
  rationale: עַל־פְּנֵי обозначает нахождение на поверхности, а שָׂדֶה может в данном лесном контексте относиться к земной поверхности или открытому участку, а не обязательно к возделанному полю. Такой перевод сохраняет зрительный образ и избегает вводящего в заблуждение «поля».
