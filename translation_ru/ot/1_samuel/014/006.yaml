  text: וַ/יֹּ֨אמֶר יְהוֹנָתָ֜ן אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו לְכָ/ה֙ וְ/נַעְבְּרָ֗ה אֶל מַצַּב֙ הָ/עֲרֵלִ֣ים הָ/אֵ֔לֶּה אוּלַ֛י יַעֲשֶׂ֥ה יְהוָ֖ה לָ֑/נוּ כִּ֣י אֵ֤ין לַֽ/יהוָה֙ מַעְצ֔וֹר לְ/הוֹשִׁ֥יעַ בְּ/רַ֖ב א֥וֹ בִ/מְעָֽט־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/006.yaml
  text: Then Jonathan said to the young man who carried his armor[a], “Come, let us cross over to the garrison of these uncircumcised men. Perhaps Yahweh will act for us[c][b], for nothing can hinder Yahweh from saving by many or by few.”
translation:
  language: ru
  text: 'Ионафан сказал юноше, который нёс его оружие: «Пойдём, переберёмся к заставе этих необрезанных.[a] Может быть, Яхве совершит для нас нечто, ведь ничто не мешает Яхве спасти многими или немногими».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «этих необрезанных» — уничижительное обозначение с выраженной заветно-религиозной окраской.'
    reason: cultural_note
  - marker: b
    text: 'Возможный перевод: «ведь для Яхве нет препятствия спасти — через многих или через немногих».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: юноше, носившему его оружие
  rationale: Причастный оборот буквально описывает юношу как носившего снаряжение или оружие Ионафана; такая передача сохраняет еврейскую конструкцию и звучит естественно по-русски.
- source_word: לְכָה וְנַעְבְּרָה
  choice: Пойдём, переберёмся
  rationale: Императив в сочетании с когортативом выражает приглашение к совместному решительному действию; «переберёмся» уместно для движения через разделяющую местность.
- source_word: מַצַּב
  choice: застава
  rationale: В данном военном контексте слово обозначает укреплённую позицию или пост филистимлян; «застава» естественно передаёт небольшой передовой военный пункт.
- source_word: הָעֲרֵלִים
  choice: этих необрезанных
  rationale: Субстантивированное определение сохранено буквально, чтобы не утратить его заветно-религиозную и пренебрежительную окраску.
- source_word: אוּלַי
  choice: Может быть
  rationale: Передаёт надежду Ионафана без самоуверенного утверждения и сохраняет неопределённость оригинала.
- source_word: יַעֲשֶׂה יְהוָה לָנוּ
  choice: Яхве вступится за нас
  rationale: Широкий глагол «сделает» в контексте означает благоприятное решительное действие Бога; «вступится за нас» естественно по-русски, хотя несколько конкретизирует подразумеваемую помощь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: מַעְצוֹר
  choice: ничто не мешает
  rationale: Идиоматически передаёт отсутствие преграды или ограничения для спасительного действия Яхве.
- source_word: לְהוֹשִׁיעַ
  choice: спасти
  rationale: Сохраняет широкий смысл корня, включая непосредственное военное избавление.
- source_word: בְּרַב אוֹ בִמְעָט
  choice: через многих или через немногих
  rationale: Предлог передан как указание на средство действия; контраст между большим и малым числом участников сохранён.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Степень уверенности Ионафана в Божьем вмешательстве
  choice: Может быть, Яхве вступится за нас
  alternative: Яхве непременно вступится за нас
  rationale: אוּלַי прямо выражает возможность, поэтому надежда Ионафана не превращена в безусловное предсказание.
- issue: Кто является «многими» или «немногими»
  choice: через многих или через немногих
  alternative: с большим войском или с малым
  rationale: Оригинал не называет войско прямо; сохранена лаконичность и возможная широта отсылки к числу людей, через которых Яхве спасает.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Сохранены лаконизм военной сцены, неопределённость слова אוּלַי и резкая характеристика противников. Имя יהוה последовательно передано как «Яхве».
