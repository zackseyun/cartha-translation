  text: Then Saul went up from pursuing the Philistines[a], and the Philistines went to their own place.
translation:
  language: ru
  text: Тогда Саул прекратил преследование филистимлян[a], и филистимляне пошли к себе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднялся от [следования] за филистимлянами». В данном военном контексте это выражение означает, что Саул прекратил их преследовать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: прекратил
  rationale: Глагол עלה буквально означает «подняться, взойти», но в сочетании с מֵאַחֲרֵי в данном военном контексте выражает прекращение движения вслед за противником. Буквальное «поднялся от» по-русски не передаёт смысла и звучит неестественно.
- source_word: מֵאַחֲרֵי
  choice: преследовать
  rationale: Сочетание буквально значит «из-за, от следования за»; в контексте боя речь идёт о преследовании отступающего противника.
- source_word: פְּלִשְׁתִּים
  choice: филистимлян
  rationale: Общепринятое русское обозначение этого народа; падежная форма определяется глаголом «преследовать».
- source_word: הָלְכוּ
  choice: пошли
  rationale: Прямое соответствие обычному значению הלך «идти». Вариант «вернулись» возможен по контексту, но добавляет значение, не выраженное самим глаголом.
- source_word: לִמְקוֹמָם
  choice: к себе
  rationale: Буквально «к своему месту». Естественное русское выражение «пошли к себе» сохраняет притяжательный смысл, не уточняя место как дом или стан.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык. Перевод передаёт военный контекст естественно и ясно; непривычная буквальная конструкция вынесена в примечание. Выражение «к себе» намеренно не уточняет, ушли ли филистимляне домой, в свой стан или на свою территорию.
