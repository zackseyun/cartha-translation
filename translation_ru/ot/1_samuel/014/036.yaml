  text: וַ/יֹּ֣אמֶר שָׁא֡וּל נֵרְדָ֣ה אַחֲרֵי֩ פְלִשְׁתִּ֨ים לַ֜יְלָה וְֽ/נָבֹ֥זָה בָ/הֶ֣ם עַד א֣וֹר הַ/בֹּ֗קֶר וְ/לֹֽא נַשְׁאֵ֤ר בָּ/הֶם֙ אִ֔ישׁ וַ/יֹּ֣אמְר֔וּ כָּל הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עֲשֵׂ֑ה וַ/יֹּ֨אמֶר֙ הַ/כֹּהֵ֔ן נִקְרְבָ֥ה הֲלֹ֖ם אֶל הָ/אֱלֹהִֽים׀׀־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/036.yaml
  text: Then Saul said[a], “Let us go down after the Philistines by night and plunder them until the light of the morning, and let us not leave a man among them.” And they said, “Do whatever seems good in your eyes.” But the priest said, “Let us draw near here to God.”
translation:
  language: ru
  text: 'Тогда Саул сказал: «Спустимся ночью вслед за филистимлянами, разграбим их до рассвета и не оставим среди них ни одного человека». Они ответили: «Делай всё, что считаешь правильным». Но священник сказал: «Давайте приблизимся здесь к Богу[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давайте подойдём здесь к Богу». Вероятно, священник предлагает прежде получить Божье указание.'
    reason: Сохраняется буквальный смысл приближения к Богу и отмечается вероятный контекстуальный смысл без внесения его в основной текст.
lexical_decisions:
- source_word: נֵרְדָה
  choice: Спустимся
  rationale: Когортатив первого лица множественного числа передаёт побуждение Саула и сохраняет выраженное глаголом ירד направление вниз.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: вслед за филистимлянами
  rationale: Сохраняет основное значение אַחֲרֵי («за, вслед за»), в военном контексте естественно подразумевая преследование.
- source_word: לַיְלָה
  choice: ночью
  rationale: Передаёт обстоятельственное указание времени без добавления более конкретного «сегодня ночью».
- source_word: וְנָבֹזָה בָהֶם
  choice: и будем грабить их
  rationale: Глагол בזז означает грабить, разорять, брать добычу; русская конструкция естественно передаёт действие над филистимлянами.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: до рассвета
  rationale: Естественный современный русский эквивалент буквального «до света утра», сохраняющий временную границу действия.
- source_word: וְלֹא נַשְׁאֵר בָּהֶם אִישׁ
  choice: не оставим у них ни одного человека
  rationale: Сохраняет волитивное продолжение замысла Саула и не добавляет отсутствующего в еврейском тексте слова «живых», хотя уничтожение подразумевается контекстом.
- source_word: כָּל הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה
  choice: Делай всё, что считаешь правильным
  rationale: Передаёт смысл еврейской идиомы «всё хорошее в твоих глазах» естественным современным русским языком.
- source_word: נִקְרְבָה הֲלֹם אֶל הָאֱלֹהִים
  choice: Давайте приблизимся здесь к Богу
  rationale: Сохраняет когортатив, наречие הֲלֹם («здесь») и общий смысл приближения к Богу, не подменяя его более конкретным глаголом «вопросим».
theological_decisions:
- issue: Подразумеваемое обращение к Богу за указанием перед битвой
  choice: Передать слова священника как призыв приблизиться к Богу, не уточняя ритуальное действие.
  alternative: «Давайте здесь вопросим Бога» или «Давайте здесь обратимся к Богу за советом».
  rationale: В контексте священник, вероятно, предлагает получить Божье указание, однако еврейский текст употребляет глагол קרב («приближаться»), а не специальный глагол со значением «вопрошать».
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Прямые речи звучат естественно; образ «хорошее в твоих глазах» передан идиоматически, а выражение о приближении к Богу сохранено достаточно буквально ради смысловой и богословской сдержанности.
