  text: וַ/יֹּ֣אמֶר שָׁא֔וּל גֹּ֣שֽׁוּ הֲלֹ֔ם כֹּ֖ל פִּנּ֣וֹת הָ/עָ֑ם וּ/דְע֣וּ וּ/רְא֔וּ בַּ/מָּ֗ה הָֽיְתָ֛ה הַ/חַטָּ֥את הַ/זֹּ֖את הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/038.yaml
  text: Then Saul said[a], “Come here, all you chiefs of the people, and know and see by what this sin has happened today.”
translation:
  language: ru
  text: 'Тогда Саул сказал: «Подойдите сюда, все предводители народа[a], и узнайте и посмотрите, как случился сегодня этот грех».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все углы народа» — образное обозначение предводителей или представителей народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּשׁוּ הֲלֹם
  choice: Подойдите сюда
  rationale: Форма множественного числа повелительного наклонения с указательным наречием выражает призыв приблизиться к Саулу; перевод естественен для современного русского языка.
- source_word: כֹּל פִּנּוֹת הָעָם
  choice: все предводители народа
  rationale: Буквально «все углы народа»; это образное обозначение видных представителей или руководителей народа. «Предводители» передаёт смысл идиомы, не превращая метафору в непонятный буквализм.
- source_word: וּדְעוּ וּרְאוּ
  choice: и узнайте и посмотрите
  rationale: 'Сохранены оба повелительных глагола: первый призывает установить обстоятельства, второй — рассмотреть их и удостовериться.'
- source_word: בַּמָּה
  choice: как
  rationale: Сочетание предлога ב с вопросительным местоимением מה здесь спрашивает об обстоятельстве или способе возникновения греха. «Как» сохраняет вопрос о случившемся и не подменяет его вопросом «на ком».
- source_word: הָיְתָה
  choice: случился
  rationale: Глагол היה буквально означает «был, возник»; в данном контексте «случился» естественно передаёт возникновение проступка.
- source_word: הַחַטָּאת הַזֹּאת
  choice: этот грех
  rationale: חטאת обозначает совершённый грех или проступок перед Богом; «грех» прямо сохраняет нравственно-богословскую силу слова.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Обычный современный русский эквивалент указания на текущий день.
theological_decisions:
- issue: Образное выражение «все углы народа»
  choice: Передать как «все предводители народа»
  alternative: «все углы народа»; «все главы народа»; «все представители народа»
  rationale: Выражение обозначает видных или полномочных представителей народа, а не буквальные «углы». «Предводители» ясно передаёт идиоматический смысл, тогда как сноска сохраняет форму исходного образа.
- issue: Значение חטאת
  choice: грех
  alternative: проступок; вина; злодеяние
  rationale: В повествовании речь идёт о нарушении перед Богом, поэтому «грех» сохраняет нравственный и богословский вес слова без добавочного толкования.
- issue: Вопросительное בַּמָּה
  choice: как
  alternative: в чём; посредством чего; из-за чего
  rationale: Еврейский текст спрашивает буквально «в чём/посредством чего», а не прямо «на ком». «Как» сохраняет широту вопроса об обстоятельствах возникновения греха и не вводит преждевременно личного виновника.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной интонацией. Парное «узнайте и посмотрите» намеренно сохраняет повтор и настойчивость еврейских повелительных форм.
