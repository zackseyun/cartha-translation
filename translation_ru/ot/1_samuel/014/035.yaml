lexical_decisions:
- source_word: וַיִּבֶן
  choice: построил
  rationale: Обычное и естественное соответствие глаголу בנה в контексте сооружения жертвенника; начальное «И» сохраняет повествовательную связь.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Устоявшаяся русская форма личного имени.
- source_word: מִזְבֵּחַ
  choice: жертвенник
  rationale: Точное и традиционно понятное русское соответствие месту принесения жертв.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל обозначает посвящение или предназначение; «для Яхве» естественно передаёт эту связь, сохраняя личное имя Бога.
- source_word: אֹתוֹ הֵחֵל לִבְנוֹת
  choice: это был первый жертвенник, который он построил
  rationale: 'Контекстуально вероятное идиоматическое понимание трудной еврейской конструкции: речь идёт о первом жертвеннике, построенном Саулом для Яхве. Более буквальное прочтение сохранено в сноске.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон; форма «Яхве» сохраняет собственное заветное имя и не подменяет его титулом.
- issue: Толкование אֹתוֹ הֵחֵל לִבְנוֹת
  choice: это был первый жертвенник, который он построил
  alternative: его он начал строить как жертвенник
  rationale: Синтаксис допускает более буквальное прочтение с «начал», однако распространённое идиоматическое понимание видит здесь указание на первый жертвенник Саула. Основной текст передаёт наиболее вероятный смысл, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис прост и понятен; повтор «для Яхве» сохранён вслед за еврейским текстом. Неоднозначная идиома не сглажена без пояснения.
