base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/027.yaml
  text: But Jonathan had not heard when his father put the people under oath[a], so he stretched out the tip of the staff that was in his hand and dipped it into the honeycomb, and he brought his hand to his mouth[b], and his eyes brightened.
translation:
  language: ru
  text: Но Ионафан не слышал, как его отец заставил народ поклясться. Он протянул конец посоха, который держал в руке, обмакнул его в соты с мёдом[a], поднёс руку ко рту — и глаза его просветлели[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в чащу (или лес) мёда». Необычное древнееврейское выражение, вероятно, означает медовые соты или плотную массу мёда.'
    reason: lexical_alternative
  - marker: b
    text: «Глаза его просветлели» — древнееврейский образ, означающий, что после еды к человеку вернулись силы и бодрость.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַע
  choice: не слышал
  rationale: В данном контексте речь идёт о том, что Ионафан не знал о наложенной клятве, а не о сознательном непослушании.
- source_word: בְּהַשְׁבִּיעַ אָבִיו אֶת הָעָם
  choice: как его отец связал народ клятвой
  rationale: Каузатив глагола שבע означает заставить поклясться или поставить под клятву. Русское выражение сохраняет обязательную силу клятвы и звучит естественно.
- source_word: וַיִּשְׁלַח אֶת קְצֵה הַמַּטֶּה
  choice: протянул конец посоха
  rationale: Здесь שלח описывает движение посоха вперёд; «протянул» естественно передаёт действие, а «посох» соответствует ручному предмету в повествовании.
- source_word: וַיִּטְבֹּל אוֹתָהּ
  choice: обмакнул его
  rationale: Местоимение относится к концу посоха. «Обмакнул» точно и естественно описывает краткое погружение в мёд.
- source_word: בְּיַעְרַת הַדְּבָשׁ
  choice: в медовые соты
  rationale: Необычное יערת связано с образом леса или чащи, но в контексте, вероятно, обозначает соты либо плотную массу мёда. Основной текст передаёт наиболее вероятный предмет действия, а буквальный образ отмечен в сноске.
- source_word: וַיָּשֶׁב יָדוֹ אֶל פִּיו
  choice: поднёс руку ко рту
  rationale: Фраза описывает движение руки ко рту, чтобы съесть мёд. Такой перевод ясен и не добавляет не названных в тексте подробностей.
- source_word: וַתָּרְאֶנָה עֵינָיו
  choice: глаза его прояснились
  rationale: Сохранён древнееврейский образ, указывающий в контексте на возвращение бодрости и ясности после еды.
