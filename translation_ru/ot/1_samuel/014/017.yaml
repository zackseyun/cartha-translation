  verdict: revise
  source_fidelity: В целом перевод точно передаёт просьбу Саула проверить состав находившихся с ним людей, выяснить, кто ушёл, и обнаружение отсутствия Ионафана с оруженосцем. Однако пассивное «Их пересчитали» несколько затушёвывает активное подлежащее еврейского глагола («они произвели проверку/пересчёт») и может на мгновение восприниматься как сообщение о том, что пересчитали самих людей, а не как действие исполнителей приказа.
