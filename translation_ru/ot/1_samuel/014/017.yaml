  terminology: Имена «Саул» и «Ионафан» переданы нормативно. «Оруженосец» точно передаёт נֹשֵׂא כֵלָיו. «Пересчитать людей» уместно передаёт פקד в значении проверки наличного состава; «пожалуйста» адекватно выражает смягчающую частицу נָא.
