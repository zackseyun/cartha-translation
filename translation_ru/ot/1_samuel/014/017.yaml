base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/017.yaml
  text: Then Saul said to the people who were with him[a], “Please take a count and see who has gone from among us.” So they took a count, and behold, Jonathan and his armor-bearer were not there.
translation:
  language: ru
  text: 'Тогда Саул сказал народу, который был с ним: «Пересчитайте, пожалуйста, людей и посмотрите, кто ушёл от нас». Они пересчитали людей — и оказалось, что Ионафана и его оруженосца нет.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּקְדוּ נָא
  choice: Пересчитайте, пожалуйста, людей
  rationale: В данном контексте פקד означает проверить наличный состав, а נָא смягчает повеление. Добавление «людей» естественно для русского языка и проясняет подразумеваемое дополнение.
- source_word: וּרְאוּ
  choice: и посмотрите
  rationale: Сохраняет последовательность двух повелений и естественно передаёт значение установления результата проверки.
- source_word: מִי הָלַךְ מֵעִמָּנוּ
  choice: кто ушёл от нас
  rationale: Точно и естественно передаёт уход из находившейся с Саулом группы.
- source_word: וַיִּפְקְדוּ
  choice: Их пересчитали
  rationale: Повторяет значение פקד и в русском позволяет избежать неопределённого «они», которое могло бы быть двусмысленным.
- source_word: וְהִנֵּה
  choice: и оказалось
  rationale: Передаёт повествовательный акцент на обнаруженном результате без архаичного русского «вот» или «и вот».
- source_word: אֵין יוֹנָתָן וְנֹשֵׂא כֵלָיו
  choice: что Ионафана и его оруженосца нет
  rationale: Естественная русская конструкция наличия/отсутствия, сохраняющая смысл еврейского אֵין.
- source_word: נֹשֵׂא כֵלָיו
  choice: его оруженосец
  rationale: Устоявшееся русское обозначение военного спутника, носившего оружие воина.
