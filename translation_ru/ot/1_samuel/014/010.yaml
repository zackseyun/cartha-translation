base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/010.yaml
  text: But if they say this[a], ‘Come up to us,’ then we will go up, for Yahweh has given them into our hand[b], and this will be the sign for us.
translation:
  language: ru
  text: 'Но если они скажут так: «Поднимитесь к нам»[a], то мы поднимемся, потому что Яхве отдал их в наши руки[b]. Это будет для нас знаком.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Выступите против нас». Еврейская фраза прежде всего указывает на подъём к позиции филистимлян, а враждебный смысл подразумевается военным контекстом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в нашу руку» — еврейское выражение со значением «под нашу власть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Союз связывает фразу с предыдущим условием и противопоставляет ему второй возможный ответ филистимлян.
- source_word: כֹּה יֹאמְרוּ
  choice: они скажут так
  rationale: כֹּה вводит прямую речь; «скажут так» естественно передаёт условную конструкцию и сохраняет указательное значение наречия.
- source_word: עֲלוּ עָלֵינוּ
  choice: Поднимитесь к нам
  rationale: Глагол עלה обозначает движение вверх, а עלֵינוּ здесь указывает на приближение к позиции говорящих; военная враждебность подразумевается контекстом, но не выражена однозначно самой фразой.
- source_word: וְעָלִינוּ
  choice: то мы поднимемся
  rationale: Форма с союзом выражает следствие условия; частица «то» естественно показывает эту связь по-русски.
- source_word: כִּי נְתָנָם
  choice: потому что … отдал их
  rationale: כִּי вводит основание для действия, а перфект נתן передаёт уверенность Ионафана в уже решённом исходе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул.
- source_word: בְּיָדֵנוּ
  choice: в наши руки
  rationale: Русская идиома «отдать в чьи-либо руки» естественно выражает переход во власть или под контроль; множественное число нормативно для русского языка.
- source_word: וְזֶה לָּנוּ הָאוֹת
  choice: Это и будет для нас знаком
  rationale: Будущее время отражает перспективный характер условного знака, а частица «и» подчёркивает, что именно названный ответ послужит подтверждением.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Временной оттенок נְתָנָם
  choice: отдал их
  alternative: отдаст их
  rationale: Еврейский перфект представляет победу как уже решённую и тем самым передаёт уверенность Ионафана; перевод будущим временем ослабил бы этот оттенок.
translation_notes:
  register: Современный литературный русский язык; речь краткая и решительная. Сохранены образ подъёма к укреплённой позиции, уверенность Ионафана в исходе и личное имя Яхве. Архаизмы и конфессионально маркированные формулы не используются.
