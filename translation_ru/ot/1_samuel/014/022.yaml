base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/022.yaml
  text: And every man of Israel who had hidden themselves in the hill country of Ephraim heard that the Philistines had fled[a], and they too joined the pursuit in the battle.
translation:
  language: ru
  text: Все израильтяне, скрывавшиеся в гористой местности Ефрема, услышали, что филистимляне обратились в бегство, и они тоже неотступно преследовали их в бою[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и они тоже держались за ними в бою»; это еврейское выражение означает, что израильтяне неотступно преследовали бегущих филистимлян.'
    reason: Сохраняет указание на буквальный образ глагола דבק и поясняет его военное идиоматическое значение естественным русским языком.
lexical_decisions:
- source_word: וְכֹל אִישׁ יִשְׂרָאֵל
  choice: Все израильтяне
  rationale: Сочетание с единственным числом имеет собирательно-распределительный смысл. Русское «все израильтяне» естественно передаёт множественную референцию, подтверждённую последующими формами множественного числа, без тяжеловесного «каждый мужчина Израиля».
- source_word: הַמִּתְחַבְּאִים
  choice: скрывавшиеся
  rationale: Причастие обозначает людей, находившихся в укрытии; русская форма сохраняет это фоновое состояние и естественно соотносится с последующим «услышали».
- source_word: בְּהַר אֶפְרַיִם
  choice: в нагорье Ефрема
  rationale: הַר здесь обозначает гористую область, а не одну вершину. «Нагорье Ефрема» точно и лаконично передаёт географический смысл.
- source_word: שָׁמְעוּ כִּי נָסוּ פְּלִשְׁתִּים
  choice: услышали, что филистимляне обратились в бегство
  rationale: «Обратились в бегство» передаёт совершившийся поворот к отступлению, не уточняя сверх текста, завершилось ли бегство к моменту получения известия.
- source_word: וַיַּדְבְּקוּ גַם הֵמָּה אַחֲרֵיהֶם
  choice: и тоже стали неотступно преследовать их
  rationale: דבק с אַחֲרֵי в военном контексте означает держаться вплотную за отступающим противником, то есть упорно его преследовать. «Неотступно преследовать» сохраняет интенсивность образа и ясно звучит по-русски.
- source_word: בַּמִּלְחָמָה
  choice: в бою
  rationale: Контекст указывает на конкретное продолжающееся сражение, а не на войну в целом; «в бою» естественнее и точнее в данном предложении.
