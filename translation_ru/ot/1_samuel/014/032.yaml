  yaml_path: translation/ot/1_samuel/014/032.yaml
  text: Then the people rushed upon the spoil and took sheep and cattle and calves[a], and they slaughtered them on the ground[b], and the people ate with the blood.
translation:
  language: ru
  text: 'Тогда народ набросился на добычу[a]: они взяли овец, крупный рогатый скот и телят, закололи их на земле, и народ ел мясо вместе с кровью[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народ устремился к добыче». Значение редкого еврейского оборота в этом месте не вполне однозначно.'
    reason: lexical_alternative
  - marker: b
    text: То есть мясо ели, не дав крови как следует стечь.
    reason: explanatory
lexical_decisions:
- source_word: וַיַּעַשׂ הָעָם אֶל שָׁלָל
  choice: народ набросился на добычу
  rationale: Редкий оборот עשה אל в данном военном контексте передаёт стремительное, необузданное обращение к захваченной добыче. «Набросился» естественно выражает эту резкость, не превращая её в нейтральное «направился».
- source_word: שָׁלָל
  choice: добыча
  rationale: Обычное современное русское обозначение имущества и скота, захваченных после сражения; оно точнее по контексту, чем более общее «награбленное».
- source_word: צֹאן
  choice: овцы
  rationale: В перечне животных конкретное «овцы» звучит естественнее собирательного «мелкий скот» и соответствует ближайшему значению слова.
- source_word: בָּקָר
  choice: крупный рогатый скот
  rationale: Слово обозначает животных из стада крупного скота вообще, а не только быков или волов.
- source_word: בְּנֵי בָקָר
  choice: телята
  rationale: Буквально «детёныши крупного скота»; «телята» — точный и естественный русский эквивалент.
- source_word: וַיִּשְׁחֲטוּ אָרְצָה
  choice: закололи их прямо на земле
  rationale: Направительная форма אָרְצָה здесь указывает на совершение заклания на земле. «Прямо» естественно подчёркивает обстоятельство, важное для последующего упоминания крови.
- source_word: עַל־הַדָּם
  choice: вместе с кровью
  rationale: Сжатая формулировка сохраняет буквальную связь еды с кровью и не вносит в основной текст развёрнутое объяснение способа обескровливания.
theological_decisions:
- issue: Насколько явно раскрывать нарушение, выраженное словами עַל־הַדָּם
  choice: есть мясо вместе с кровью
  alternative: есть мясо, из которого не выпустили кровь
  rationale: Еврейский текст сформулирован кратко и не описывает процедуру подробно. Основной текст сохраняет эту сжатость и правовую напряжённость, а вероятный смысл — мясо не было должным образом обескровлено — поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Военная «добыча» и глагол «закололи» сохраняют библейский контекст без архаизации. Повтор слова «народ» оставлен вслед за еврейским текстом; «мясо» добавлено для естественности и ясности русского выражения.
