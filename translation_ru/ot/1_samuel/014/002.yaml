base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/002.yaml
  text: Saul was staying at the outskirts of Gibeah[a], under the pomegranate tree that is at Migron[b], and the people who were with him were about six hundred men.
translation:
  language: ru
  text: Саул находился[a] на окраине Гивы, под гранатовым деревом[b], которое было в Мигроне, и с ним было около шестисот человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сидел на краю Гивы». Еврейское причастие может означать как сидение, так и пребывание в каком-либо месте.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «под гранатом»; слово «деревом» добавлено для ясности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: находился
  rationale: Причастие от ישׁב может означать как сидение, так и пребывание в определённом месте. В военном повествовании «находился» естественно передаёт продолжающееся пребывание Саула, не сводя смысл к позе.
- source_word: בִּקְצֵה הַגִּבְעָה
  choice: на окраине Гивы
  rationale: קָצֶה обозначает край или предел; применительно к населённому пункту современное русское «на окраине» передаёт пространственный смысл. הַגִּבְעָה по контексту понято как название города Гива.
- source_word: תַּחַת הָרִמּוֹן
  choice: под гранатовым деревом
  rationale: Буквально רִמּוֹן — «гранат», но в данном обстоятельстве места имеется в виду гранатовое дерево; слово «дерево» добавлено для ясности русского текста.
- source_word: אֲשֶׁר בְּמִגְרוֹן
  choice: что в Мигроне
  rationale: Относительное придаточное естественнее всего относится к гранатовому дереву и указывает его местонахождение.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: а с ним было
  rationale: В данном военном контексте עָם обозначает сопровождавших Саула людей. Русская конструкция позволяет избежать тяжеловесного буквального повтора «народ, который был с ним».
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: около шестисот человек
  rationale: Префикс כ־ выражает приблизительность, а אִישׁ после числительного естественно передаётся русским «человек».
