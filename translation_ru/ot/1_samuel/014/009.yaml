  text: אִם כֹּ֤ה יֹֽאמְרוּ֙ אֵלֵ֔י/נוּ דֹּ֕מּוּ עַד הַגִּיעֵ֖/נוּ אֲלֵי/כֶ֑ם וְ/עָמַ֣דְנוּ תַחְתֵּ֔י/נוּ וְ/לֹ֥א נַעֲלֶ֖ה אֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/009.yaml
  text: If they say to us like this[b][a], ‘Stay there until we come to you,’ then we will stand where we are and will not go up to them.
translation:
  language: ru
  text: 'Если они скажут нам: «Стойте[a], пока мы не подойдём к вам», — то мы останемся на своём месте[b] и не станем подниматься к ним.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не двигайтесь», «Ждите» либо «Молчите»; еврейский глагол может обозначать неподвижность или молчание на месте.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «встанем под собой» — идиоматический оборот со значением «останемся на своём месте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם כֹּה יֹאמְרוּ אֵלֵינוּ
  choice: Если они скажут нам
  rationale: Условная конструкция передана естественно по-русски; כֹּה вводит последующую прямую речь и не требует отдельного слова «так».
- source_word: דֹּמּוּ
  choice: Стойте
  rationale: Императив от דמם может означать неподвижность, молчание или ожидание; в военном контексте «Стойте» кратко и естественно выражает требование оставаться на месте, не устраняя лексическую неоднозначность, отмеченную в сноске.
- source_word: עַד הַגִּיעֵנוּ אֲלֵיכֶם
  choice: пока мы не подойдём к вам
  rationale: В русском языке конструкция «пока не» идиоматично обозначает предел ожидания; «подойдём» передаёт направленное приближение говорящих к адресатам.
- source_word: וְעָמַדְנוּ תַחְתֵּינוּ
  choice: то мы останемся на своём месте
  rationale: Переводит результат условия и смысл необычного оборота буквально «встанем под собой», то есть останемся в занимаемой позиции.
- source_word: וְלֹא נַעֲלֶה אֲלֵיהֶם
  choice: и не станем подниматься к ним
  rationale: 'Сохраняет топографический оттенок עלה: филистимляне находятся выше, и Ионафан с оруженосцем не будут подниматься к ним.'
theological_decisions: []
