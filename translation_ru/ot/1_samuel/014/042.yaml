  yaml_path: translation/ot/1_samuel/014/042.yaml
  text: Then Saul said[a], “Cast lots between me and Jonathan my son.” And Jonathan was taken.
translation:
  language: ru
  text: 'Тогда Саул сказал: «Бросьте жребий между мной и моим сыном Ионафаном».[a] И жребий указал на Ионафана.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Заставьте упасть между мной и моим сыном Ионафаном»; имеется в виду решение дела посредством жребия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда Саул сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт смену действия в современном русском.
- source_word: הַפִּילוּ
  choice: Бросьте жребий
  rationale: Форма Hiphil повелительного наклонения множественного числа от נפל буквально означает «заставьте упасть», но в контексте определения виновного обозначает бросание жребия. Слово «жребий» восполняет подразумеваемый объект.
- source_word: בֵּינִי וּבֵין
  choice: между мной и
  rationale: Парная конструкция с предлогом בין выражает выбор между двумя сторонами и естественно передаётся русским «между … и …».
- source_word: בְּנִי
  choice: моим сыном
  rationale: 'Существительное בן с суффиксом первого лица единственного числа прямо указывает на родство: «мой сын».'
- source_word: וַיִּלָּכֵד
  choice: жребий указал на
  rationale: Niphal от לכד буквально означает «был схвачен/взят», а в контексте жеребьёвки — «был выявлен, выбран жребием». Активная русская конструкция ясно и естественно передаёт контекстуальный смысл, не создавая впечатления физического пленения.
- source_word: יוֹנָתָן
  choice: Ионафан
  rationale: Использована устоявшаяся русская библейская форма имени.
