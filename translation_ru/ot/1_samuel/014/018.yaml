lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма продолжает повествование; «тогда» естественно передаёт развитие событий.
- source_word: לַאֲחִיָּה
  choice: Ахии
  rationale: Имя אֲחִיָּה передано принятой русской библейской формой «Ахия» в дательном падеже.
- source_word: הַגִּישָׁה
  choice: Принеси сюда
  rationale: Побудительная форма глагола נגשׁ означает «поднести, приблизить»; в данном контексте это естественная русская команда.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ковчег Божий
  rationale: Передаёт буквальное выражение исходного текста, не добавляя отсутствующего слова «завета».
- source_word: כִּי
  choice: отдельное пояснительное предложение
  rationale: Частица вводит пояснение рассказчика; разделение на предложения естественно по-русски и сохраняет пояснительную связь.
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Прямое и естественное соответствие еврейскому обстоятельству времени.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: у сынов Израиля
  rationale: Предлог בְּ здесь передаёт нахождение ковчега при израильтянах; «у» звучит естественнее, а «сыны Израиля» сохраняет форму исходного текста.
theological_decisions:
- issue: «Ковчег Божий» или «эфод»
  choice: ковчег Божий
  alternative: эфод
  rationale: Масоретский текст WLC дважды содержит אֲרוֹן הָאֱלֹהִים («ковчег Божий»). Вариант «эфод» отмечен в сноске, но не внесён в основной текст.
- issue: Смысл местонахождения ковчега
  choice: был у сынов Израиля
  alternative: был там в тот день с сынами Израиля
  rationale: Еврейская конструкция допускает некоторое различие в синтаксическом членении. Основной текст передаёт наиболее прямой смысл без добавления отсутствующего наречия «там», а возможный вариант отражён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены традиционные выражения «ковчег Божий» и «сыны Израиля»; синтаксис сделан понятным современному читателю.
