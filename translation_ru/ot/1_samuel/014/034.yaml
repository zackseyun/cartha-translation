  text: וַ/יֹּ֣אמֶר שָׁא֣וּל פֻּ֣צוּ בָ/עָ֡ם וַ/אֲמַרְתֶּ֣ם לָ/הֶ֡ם הַגִּ֣ישׁוּ אֵלַ/י֩ אִ֨ישׁ שׁוֹר֜/וֹ וְ/אִ֣ישׁ שְׂיֵ֗/הוּ וּ/שְׁחַטְתֶּ֤ם בָּ/זֶה֙ וַ/אֲכַלְתֶּ֔ם וְ/לֹֽא תֶחֶטְא֥וּ לַֽ/יהוָ֖ה לֶ/אֱכֹ֣ל אֶל הַ/דָּ֑ם וַ/יַּגִּ֨שׁוּ כָל הָ/עָ֜ם אִ֣ישׁ שׁוֹר֧/וֹ בְ/יָד֛/וֹ הַ/לַּ֖יְלָה וַ/יִּשְׁחֲטוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/034.yaml
  text: And Saul said[a], “Spread out among the people and tell them, ‘Each man must bring me his ox and each man his sheep, and you must slaughter them here and eat, so that you may not sin against Yahweh by eating with the blood.’” So all the people brought, each man his ox in his hand that night[b], and they slaughtered them there.
translation:
  language: ru
  text: 'И Саул сказал: «Разойдитесь среди народа и скажите им: „Пусть каждый приведёт ко мне своего быка и свою овцу или козу. Заколите их здесь и ешьте, чтобы не грешить против Яхве, поедая мясо с кровью[a]“». И весь народ той ночью привёл свой скот — каждый своего быка, ведя его за собой[b], — и там они закололи животных.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «есть при крови» или «есть над кровью»; по контексту имеется в виду мясо, из которого не была должным образом выпущена кровь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каждый — своего быка в своей руке»; вероятно, каждый вёл своего быка рукой, возможно за привязь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֻּצוּ בָעָם
  choice: Разойдитесь среди народа
  rationale: Императив от פוץ передаёт рассредоточение посланников среди людей; по-русски «разойдитесь среди народа» естественно выражает и движение, и распределение по стану.
- source_word: הַגִּישׁוּ אֵלַי
  choice: пусть каждый приведёт ко мне
  rationale: Hифиль от נגשׁ означает «подвести, приблизить, представить»; для живых животных естественно русское «приведёт».
- source_word: אִישׁ שׁוֹרוֹ וְאִישׁ שְׂיֵהוּ
  choice: каждый … своего быка и свою овцу или козу
  rationale: Повторение אִישׁ имеет распределительное значение. שֶׂה обозначает одну голову мелкого скота и может быть как овцой, так и козой, поэтому видовая неопределённость сохранена.
- source_word: וּשְׁחַטְתֶּם בָּזֶה
  choice: Заколите их здесь
  rationale: שׁחט означает заклание животного, а не убийство вообще; בָּזֶה здесь естественно понимается как указание на данное место.
- source_word: וְלֹא תֶחֶטְאוּ לַיהוָה
  choice: чтобы не грешить против Яхве
  rationale: Отрицательная форма выражает предотвращаемый результат; לַיהוָה в данном контексте передаёт направленность проступка против Бога.
- source_word: לֶאֱכֹל אֶל־הַדָּם
  choice: поедая мясо с кровью
  rationale: Редкое сочетание буквально связывает еду с кровью. В контексте речь идёт о мясе, кровь из которого не была должным образом выпущена; «мясо» добавлено для ясности без устранения образа крови.
- source_word: וַיַּגִּשׁוּ כָל־הָעָם
  choice: весь народ … привёл свой скот
  rationale: Глагол продолжает лексику повеления. Обобщающее «скот» делает русское предложение связным перед распределительным уточнением о быках.
- source_word: אִישׁ שׁוֹרוֹ בְיָדוֹ
  choice: каждый своего быка, ведя его за собой
  rationale: Буквально сказано «каждый — своего быка в своей руке»; это, вероятнее всего, означает, что быка вели рукой, возможно за привязь. Необычная форма отмечена сноской.
- source_word: הַלַּיְלָה
  choice: той ночью
  rationale: Форма употреблена обстоятельственно и указывает на ночь описываемых событий.
- source_word: וַיִּשְׁחֲטוּ שָׁם
  choice: там они закололи животных
  rationale: Объект подразумевается из контекста и восполнен по-русски; «закололи» сохраняет специальное значение שׁחט.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон, поэтому личное имя передано как «Яхве», а не заменено титулом.
- issue: Характер греха при употреблении мяса с кровью
  choice: Не уточнять сверх текста правовую или обрядовую систему
  alternative: Истолковать как нарушение конкретного позднейшего установления
  rationale: Стих прямо называет такое употребление мяса грехом против Яхве, но не развивает здесь богословское или правовое объяснение; перевод сохраняет эту сдержанность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён для ясного чтения вслух; видовая широта שֶׂה сохранена выражением «овцу или козу», а необычные еврейские обороты пояснены в сносках.
