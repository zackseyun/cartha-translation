base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/008.yaml
  text: Jonathan said[a], “Look, we are crossing over to the men, and we will show ourselves to them.”
translation:
  language: ru
  text: 'Ионафан сказал: «Вот, мы перейдём к тем людям и покажемся им[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дадим им себя увидеть».'
    reason: Лексическая альтернатива, явно передающая значение намеренного появления перед противником.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная повествовательная формула введения прямой речи; современный и естественный русский эквивалент.
- source_word: יְהוֹנָתָן
  choice: Ионафан
  rationale: Традиционная русская библейская форма личного имени.
- source_word: הִנֵּה
  choice: вот
  rationale: Передаёт указательно-побудительную функцию частицы, привлекающей внимание к задуманному действию.
- source_word: אֲנַחְנוּ עֹבְרִים
  choice: мы перейдём
  rationale: Причастная форма описывает непосредственно предстоящее действие; будущее время естественно передаёт здесь намерение Ионафана, а явное «мы» сохраняет акцент исходного текста.
- source_word: אֶל הָאֲנָשִׁים
  choice: к тем людям
  rationale: Определённая группа — находящиеся впереди филистимляне; указательное «тем» делает эту отнесённость ясной без добавления этнонима, отсутствующего в стихе.
- source_word: וְנִגְלִינוּ אֲלֵיהֶם
  choice: и покажемся им
  rationale: Нифаль глагола גלה в данном контексте означает намеренно стать видимыми для противника; «покажемся им» естественно и точно передаёт этот смысл.
