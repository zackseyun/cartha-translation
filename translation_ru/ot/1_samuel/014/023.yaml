source:
  edition: WLC
  text: וַ/יּ֧וֹשַׁע יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא אֶת יִשְׂרָאֵ֑ל וְ/הַ֨/מִּלְחָמָ֔ה עָבְרָ֖ה אֶת בֵּ֥ית אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/023.yaml
  text: So Yahweh saved Israel that day[a], and the battle passed beyond Beth-aven.
translation:
  language: ru
  text: Так Яхве спас Израиль в тот день, и битва продвинулась за Бет-Авен.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «и битва миновала Бет-Авен» или «и битва продвинулась дальше Бет-Авена».'
    reason: 'Еврейское עבר с אֶת допускает несколько близких пространственных истолкований: движение мимо места либо дальше него.'
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: спас
  rationale: Глагол ישׁע в породе хифиль означает «спасти, избавить». «Спас» кратко передаёт действие Яхве и сохраняет богословскую весомость исходного выражения, не сужая его до одной лишь военной победы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская передача еврейского обстоятельства времени.
- source_word: אֶת יִשְׂרָאֵל
  choice: Израиль
  rationale: Прямое дополнение; здесь название обозначает народ Израиля как единое целое.
- source_word: וְהַמִּלְחָמָה
  choice: и битва
  rationale: В данном повествовательном контексте מִלְחָמָה обозначает конкретное сражение, а не войну вообще.
- source_word: עָבְרָה
  choice: продвинулась
  rationale: עבר передаёт движение дальше или мимо определённого места. «Продвинулась» естественно сочетается со словом «битва», при этом военная направленность не усиливается чрезмерно.
- source_word: אֶת בֵּית אָוֶן
  choice: за Бет-Авен
  rationale: При עבר частица אֶת может отмечать место, которое движение миновало. «За Бет-Авен» передаёт вероятный смысл движения битвы дальше этого места.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Смысл спасения Израиля
  choice: спас Израиль
  alternative: даровал Израилю победу; избавил Израиль
  rationale: «Спас» сохраняет широту ישׁע и прямое представление Яхве как действующего лица, не сводя сказанное исключительно к военному успеху.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис прост и понятен; имя «Бет-Авен» оформлено в принятой русской передаче. Неоднозначность заключительной пространственной фразы сохранена в сноске.
