lexical_decisions:
- source_word: הַשֵּׁן
  choice: утёс
  rationale: Буквально «зуб»; в данном топографическом контексте это образное обозначение острого скального выступа. «Утёс» естественно передаёт предметный смысл, а буквальный образ сохранён в примечании.
- source_word: הָאֶחָד ... וְהָאֶחָד
  choice: один… а другой
  rationale: Повторённая распределительная конструкция различает два скальных выступа; по-русски естественно передаётся парой «один… а другой».
- source_word: מָצוּק
  choice: возвышался
  rationale: Форма описывает крутой, заметно выступающий или прочно расположенный скальный объект. «Возвышался» естественно вписывается в топографическое описание, не перегружая перевод неясной этимологической детализацией.
- source_word: מִצָּפוֹן
  choice: с северной стороны
  rationale: В контексте противопоставления северной и южной сторон прохода выражение обозначает местоположение скалы.
- source_word: מוּל
  choice: напротив
  rationale: Передаёт пространственное значение нахождения лицом к объекту или по другую сторону от него.
- source_word: מִכְמָשׂ
  choice: Михмас
  rationale: Устоявшаяся русская передача данного географического названия.
- source_word: מִנֶּגֶב
  choice: с южной стороны
  rationale: Здесь נגב обозначает южную сторону в параллельном противопоставлении северной.
- source_word: גָּבַע
  choice: Гева
  rationale: Масоретский текст и географический контекст указывают на Геву, а не на Гиву.
