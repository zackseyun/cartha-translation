- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: прежде
  rationale: Буквальное «как вчера, третьего дня» является древнееврейским идиоматическим обозначением прежнего времени; современное «прежде» передаёт его функцию.
- source_word: אֲשֶׁר עָלוּ עִמָּם
  choice: пришли вместе с ними
