  yaml_path: translation/ot/1_samuel/014/021.yaml
  text: The Hebrews who had previously been with the Philistines[a], who had gone up with them into the camp all around—even they also came to be with Israel[c][b], who were with Saul and Jonathan.
translation:
  language: ru
  text: Евреи, которые прежде были с филистимлянами[a] и пришли вместе с ними в стан, расположенный вокруг[b], тоже оказались с израильтянами[c], бывшими с Саулом и Ионафаном.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как вчера, третьего дня» — древнееврейский оборот со значением «прежде», «раньше».'
    reason: lexical_alternative
  - marker: b
    text: 'Древнееврейское выражение буквально можно передать как «в стане вокруг»; его синтаксическая связь не вполне ясна. Возможны понимания: «в стане по всей округе» или «в окружавшем стане».'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «быть с Израилем». По контексту подразумевается изменение их положения; возможный перевод: «присоединились к Израилю».'
    reason: alternative_reading
