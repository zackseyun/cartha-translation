- source_word: בַּמַּחֲנֶה סָבִיב
  choice: в их стан в окрестностях
  rationale: Синтаксис оборота труден. Перевод сохраняет пространственное значение סביב, но неопределённость связи слов отмечена в сноске.
- source_word: וְגַם הֵמָּה
  choice: теперь тоже
  rationale: «Тоже» передаёт усиленное включение этих евреев; «теперь» естественно обозначает контраст с их прежним положением, выраженный контекстом.
- source_word: לִהְיוֹת עִם יִשְׂרָאֵל
  choice: оказались с Израилем
  rationale: Буквально «быть с Израилем». «Оказались с» позволяет передать наступившее новое положение, не утверждая прямо, было ли оно сознательным переходом на другую сторону.
- source_word: אֲשֶׁר עִם שָׁאוּל וְיוֹנָתָן
  choice: с теми, кто был с Саулом и Ионафаном
  rationale: Относительный оборот относится к Израилю как к собирательному обозначению людей; русская формулировка устраняет неестественное согласование, не меняя референта.
theological_decisions:
- issue: Характер перехода евреев к Израилю
  choice: оказались с Израилем
  alternative: перешли на сторону Израиля / присоединились к Израилю
  rationale: Исходное לִהְיוֹת עִם буквально означает «быть с» и в контексте предполагает перемену положения, но прямо не называет мотив или формальный переход на другую сторону. Выбран более сдержанный вариант.
