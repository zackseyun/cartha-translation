  terminology: «Яхве» последовательно передаёт тетраграмматон. «Грешит против Яхве» и «поступили вероломно» адекватно передают חטא לְ и בגד. Контекстуальное «ест мясо с кровью» оправдано, если буквальный образ и ограниченность такой экспликации отмечены в сноске.
