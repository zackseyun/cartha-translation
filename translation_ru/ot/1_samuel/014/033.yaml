  source_fidelity: 'Основной смысл передан верно: сообщают Саулу о грехе народа перед Яхве, состоящем в употреблении мяса с кровью; затем следует резкое обвинение и приказ прикатить большой камень. Однако הִנֵּה — указательная частица («вот»), а не буквальное обращение-повеление «смотри». В сноске вариант «при крови» не является удачной формальной передачей עַל; следует сохранить буквальное «над кровью» и пояснить контекстуальный смысл.'
