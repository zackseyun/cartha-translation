base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/033.yaml
  text: Then they told Saul[a], saying, “Look, the people are sinning against Yahweh by eating over the blood.” And he said, “You have acted treacherously. Roll a large stone to me today.”
translation:
  language: ru
  text: 'Тогда Саулу сообщили: «Вот, народ грешит против Яхве, потому что ест мясо с кровью[a]». Он сказал: «Вы поступили вероломно. Прикатите ко мне сегодня большой камень».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «есть над кровью». Этот оборот относится к употреблению мяса, из которого не была должным образом выпущена кровь; возможна также формальная передача: «есть с кровью».'
    reason: Сохраняет буквальный образ еврейского выражения, поясняет его контекстуальный смысл и не представляет спорную формальную передачу предлога как единственно возможную.
lexical_decisions:
- source_word: וַיַּגִּידוּ לְשָׁאוּל לֵאמֹר
  choice: Тогда Саулу сообщили
  rationale: Нарративная форма продолжает последовательность событий; безличное «сообщили» естественно передаёт множественное число при неназванных докладчиках, а отдельное «говоря» в современном русском избыточно.
- source_word: הִנֵּה
  choice: Смотри
  rationale: Частица привлекает внимание к тревожному сообщению; «смотри» сохраняет её живую дейктическую силу без архаичного «вот, behold»-подобного оттенка.
- source_word: הָעָם
  choice: народ
  rationale: Собирательное существительное обозначает здесь людей, составлявших войско Саула; «народ» сохраняет формулировку источника.
- source_word: חֹטִאים לַיהוָה
  choice: грешит против Яхве
  rationale: Глагол חטא с ל выражает проступок против Бога; единственное число «грешит» согласуется в русском с собирательным «народ».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: לֶאֱכֹל עַל־הַדָּם
  choice: ест мясо с кровью
  rationale: Буквально оборот содержит «есть над/при крови», но по контексту означает употреблять мясо, из которого не выпущена кровь. В основном тексте смысл выражен естественно, а буквальный образ сохранён в примечании.
- source_word: בְּגַדְתֶּם
  choice: Вы поступили вероломно
  rationale: בגד обозначает неверность или вероломный проступок; формулировка сохраняет нравственную тяжесть обвинения и не сводит его к общему «нарушили».
- source_word: גֹּלּוּ אֵלַי
  choice: Прикатите ко мне
  rationale: Повелительная форма от גלל буквально означает «катить»; применительно к большому камню «прикатите» конкретно и естественно.
- source_word: הַיּוֹם אֶבֶן גְּדוֹלָה
  choice: сегодня большой камень
  rationale: Сохранены прямое временное указание «сегодня» и характеристика камня как большого.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет различие между личным именем и титулом.
- issue: Характер греха народа
  choice: ест мясо с кровью
  alternative: ест над кровью
  rationale: Контекст указывает на употребление мяса с невыпущенной кровью. Перевод делает запрещённое действие понятным, не добавляя конфессионального толкования; формальная неоднозначность предлога отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной прозы. Синтаксис упрощён там, где буквальное воспроизведение еврейской формулы речи звучало бы неестественно; нравственная резкость слов Саула сохранена.
