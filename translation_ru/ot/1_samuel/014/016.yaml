    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפִים
  choice: дозорные
  rationale: Причастная форма от צפה обозначает людей, поставленных наблюдать. «Дозорные» естественно звучит в военном контексте и передаёт их назначение.
- source_word: לְשָׁאוּל
  choice: Саула
  rationale: 'Предлог ל выражает здесь принадлежность или связь: это дозорные, состоявшие при Сауле. По-русски это естественно передаётся родительным падежом.'
- source_word: בְּגִבְעַת בִּנְיָמִן
  choice: в Гиве Вениаминовой
  rationale: Традиционная и ясная русская форма названия места сохраняет уточнение, связывающее Гиву с Вениамином.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Частица привлекает внимание к внезапно открывшейся наблюдателям картине; «и вот» сохраняет её повествовательную выразительность.
- source_word: הֶהָמוֹן
  choice: полчище
  rationale: הָמוֹן может обозначать множество, толпу или шумную массу людей. В данном военном контексте «полчище» естественно обозначает массу филистимских воинов, не уточняя их построение.
- source_word: נָמוֹג
  choice: таяло
  rationale: Глагол מוג буквально передаёт образ таяния, а переносно — утрату сплочённости или мужества. «Таяло» сохраняет исходный образ и показывает распад войска.
- source_word: וַיֵּלֶךְ
  choice: двигалось
  rationale: Глагол стоит в единственном числе и согласуется с собирательным הֶהָמוֹן. «Двигалось» передаёт наблюдаемое движение без добавления причины.
- source_word: וַהֲלֹם
  choice: туда и сюда
  rationale: Краткое и необычное еврейское выражение в сочетании с глаголом движения описывает беспорядочное перемещение в разные стороны. «Туда и сюда» естественно передаёт этот смысл по-русски.
