base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/014.yaml
  text: That first slaughter[a], which Jonathan and his armor-bearer made, was about twenty men within about half a furrow in an acre of a field.
translation:
  language: ru
  text: При первой атаке Ионафан и его оруженосец сразили около двадцати человек на пространстве величиной примерно в половину борозды на участке, вспахиваемом парой волов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально можно передать: «примерно в половину борозды ярма поля». Вероятно, имеется в виду часть участка, который могла вспахать пара волов, однако точный размер и синтаксическая связь слов не вполне ясны.'
    reason: Неясное древнее обозначение расстояния или площади; буквальная форма и неопределённость сохранены в примечании.
lexical_decisions:
- source_word: הַמַּכָּה הָרִאשֹׁנָה
  choice: при первой атаке
  rationale: Существительное מַכָּה может обозначать удар, поражение или избиение. В военном контексте «при первой атаке» естественно передаёт начальный смертоносный удар, не усиливая текст до массовой резни.
- source_word: הִכָּה
  choice: сразили
  rationale: Глагол נכה означает «ударить, поразить» и в данном контексте подразумевает смертельное поражение; «сразили» сохраняет образ удара и допускает вытекающий из контекста смысл убийства.
- source_word: וְנֹשֵׂא כֵלָיו
  choice: и его оруженосец
  rationale: Устойчивое и понятное русское обозначение военного слуги, носившего оружие воина.
- source_word: כְּעֶשְׂרִים אִישׁ
  choice: около двадцати человек
  rationale: Префикс כְּ выражает приблизительность числа.
- source_word: כְּבַחֲצִי מַעֲנָה
  choice: примерно в половину борозды
  rationale: Передаёт повторную приблизительность и традиционное понимание מַעֲנָה как борозды, не превращая неясную древнюю меру в точную современную величину.
- source_word: צֶמֶד שָׂדֶה
  choice: на участке, вспахиваемом парой волов
  rationale: צֶמֶד буквально означает пару или ярмо и здесь, вероятно, участвует в обозначении площади земли по объёму пахоты; описательный перевод сохраняет земледельческий образ без сомнительного пересчёта в акры или гектары.
