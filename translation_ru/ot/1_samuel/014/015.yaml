base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/015.yaml
  text: And there was trembling in the camp[a], in the field, and among all the people; the garrison and the raiding party also trembled. And the earth quaked, so that it became a trembling from God.
translation:
  language: ru
  text: В стане, в поле и среди всего народа поднялся трепет; затрепетали также гарнизон и отряд, совершавший набеги. Земля содрогнулась, и настал трепет от Бога[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великий трепет»; возможно также: «божественный ужас». Еврейское выражение может указывать как на источник — Бога, так и на чрезвычайную силу трепета.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲרָדָה / חָרְדוּ / חֶרְדַּת
  choice: трепет / затрепетали / трепетом
  rationale: Повтор однокоренных слов передаёт страх, выраженный телесной дрожью, и сохраняет заметную в еврейском тексте словесную связь.
- source_word: בַמַּחֲנֶה בַשָּׂדֶה
  choice: стан в поле
  rationale: Сочетание допускает понимание «стан, находившийся в поле»; такая передача естественнее по-русски и не умножает искусственно места действия.
- source_word: וּבְכָל הָעָם
  choice: и весь народ
  rationale: עָם может обозначать народ или войско; буквальное «народ» сохраняет широту выражения, тогда как военный контекст остаётся очевиден.
- source_word: הַמַּצָּב
  choice: гарнизон
  rationale: В данном военном контексте слово обозначает размещённую на позиции воинскую силу; «гарнизон» кратко и понятно передаёт этот смысл.
- source_word: הַמַּשְׁחִית
  choice: отряд разорителей
  rationale: Причастие в единственном числе с артиклем может коллективно обозначать воинское подразделение, занимавшееся разорительными набегами. Слово «отряд» делает коллективный смысл ясным, не сводя выражение к одному человеку.
- source_word: וַתִּרְגַּז הָאָרֶץ
  choice: Земля содрогнулась
  rationale: רגז здесь описывает физическое сотрясение земли; «содрогнулась» сохраняет связь с общей картиной трепета и звучит естественно.
- source_word: לְחֶרְדַּת אֱלֹהִים
  choice: трепетом от Бога
  rationale: Передача понимает אֱלֹהִים как указание на источник, но сноска сохраняет также возможное усилительное значение конструкции.
theological_decisions:
- issue: Смысл לְחֶרְדַּת אֱלֹהִים
  choice: трепетом от Бога
  alternative: великим трепетом; ужасом от Бога
  rationale: Родительная конструкция может указывать либо на божественный источник, либо идиоматически на чрезвычайную силу явления. Основной текст сохраняет прямое богословское указание на Бога, а сноска не исключает усилительное прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Повтор «трепет — затрепетали — трепетом» намеренно сохраняет еврейскую игру однокоренных слов; «стан» и «гарнизон» уместны в историко-военном контексте и понятны современному читателю.
