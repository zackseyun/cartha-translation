  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם אֶל שָׁא֗וּל הֲֽ/יוֹנָתָ֤ן יָמוּת֙ אֲשֶׁ֣ר עָ֠שָׂה הַ/יְשׁוּעָ֨ה הַ/גְּדוֹלָ֣ה הַ/זֹּאת֮ בְּ/יִשְׂרָאֵל֒ חָלִ֗ילָ/ה חַי יְהוָה֙ אִם יִפֹּ֞ל מִ/שַּׂעֲרַ֤ת רֹאשׁ/וֹ֙ אַ֔רְצָ/ה כִּֽי עִם אֱלֹהִ֥ים עָשָׂ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּפְדּ֥וּ הָ/עָ֛ם אֶת יוֹנָתָ֖ן וְ/לֹא מֵֽת־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/045.yaml
  text: But the people said to Saul[a], “Should Jonathan die, who has brought about this great deliverance in Israel? Far from it! As Yahweh lives, not one hair of his head shall fall to the ground, for he has worked with God this day.” So the people redeemed Jonathan[d][c][b], and he did not die.
translation:
  language: ru
  text: 'Но народ сказал Саулу: «Неужели Ионафан — тот, кто совершил это великое избавление[a] в Израиле, — умрёт? Ни в коем случае![b] Жив Яхве: ни один волос с его головы не упадёт на землю, потому что сегодня он действовал с Богом[c]». Так народ освободил Ионафана[d], и он не умер.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это великое спасение»; «эту великую победу». Еврейское יְשׁוּעָה может обозначать избавление, спасение или победу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Да не будет этого!» — решительное выражение неприятия.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «потому что сегодня он действовал с Богом». Эти слова указывают на связь действия Ионафана с Богом, но не уточняют характера этой связи.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «вызволил Ионафана»; «спас Ионафана». Глагол פדה означает освобождение от притязания или приговора и может также передаваться как «выкупить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיוֹנָתָן יָמוּת
  choice: Неужели Ионафан умрёт
  rationale: Вопросительная частица с имперфектом образует возмущённый риторический вопрос; «неужели» естественно передаёт протест народа.
- source_word: הַיְשׁוּעָה הַגְּדוֹלָה הַזֹּאת
  choice: это великое избавление
  rationale: В военном контексте יְשׁוּעָה означает избавление, спасение или победу; «избавление» сохраняет как военный, так и богословский оттенок.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Сохраняется наиболее прямое пространственно-сферическое значение предлога ב, без сужения до «для Израиля».
- source_word: חָלִילָה
  choice: Ни в коем случае
  rationale: Сильное категорическое отвержение передано современной и достойной русской формулой без добавления отсутствующего в выражении имени Бога.
- source_word: חַי יְהוָה
  choice: Жив Яхве
  rationale: Передана древнееврейская формула клятвы с сохранением личного имени יהוה.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת רֹאשׁוֹ אַרְצָה
  choice: ни один волос с его головы не упадёт на землю
  rationale: После формулы клятвы אִם имеет силу решительного отрицания; русский оборот сохраняет образ полной неприкосновенности.
- source_word: כִּי עִם אֱלֹהִים עָשָׂה
  choice: потому что сегодня он действовал вместе с Богом
  rationale: «Вместе с Богом» непосредственно передаёт עִם אֱלֹהִים и не устраняет намеренную неоднозначность относительно божественной помощи и совместности действия.
- source_word: וַיִּפְדּוּ הָעָם אֶת יוֹנָתָן
  choice: Так народ вызволил Ионафана
  rationale: פדה обозначает освобождение от притязания или приговора. В данном контексте «вызволил» естественно передаёт спасение Ионафана от смерти, не предполагая прямо названного выкупа.
- source_word: וְלֹא מֵת
  choice: и он не умер
  rationale: Прямо сохраняется простое итоговое утверждение исходного текста.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Смысл עִם אֱלֹהִים в описании действия Ионафана
  choice: действовал вместе с Богом
  alternative: действовал с Божьей помощью; действовал ради Бога
  rationale: Предлог עִם обычно означает «с». Буквально близкая передача сохраняет богословское напряжение и не уточняет сверх текста характер соотношения действия Ионафана и Божьего содействия.
- issue: Значение פדה применительно к избавлению от смертного приговора
  choice: вызволил
  alternative: искупил; выкупил; спас
  rationale: Форма сохраняет смысл освобождения от приговора, не вводя неупомянутую плату и не придавая выражению исключительно догматический смысл.
translation_notes:
  register: Современный литературный русский язык с торжественностью, уместной для клятвы и публичного протеста. Синтаксис сделан ясным для широкого читателя; сохранены риторический вопрос, образ волоса, падающего на землю, личное имя Яхве и неоднозначное «вместе с Богом».
