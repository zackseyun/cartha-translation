  text: The name of Saul’s wife was Ahinoam daughter of Ahimaaz[a], and the name of the commander of his army was Abner son of Ner, Saul’s uncle.
translation:
  language: ru
  text: Жену Саула звали Ахиноам, дочь Ахимааца. Военачальника войска Саула звали Авенир; он был сыном Нира — дяди[a] Саула.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родственника»; еврейское слово может обозначать близкого родственника мужского пола, хотя в данном родословном контексте наиболее вероятно значение «дядя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: звали
  rationale: Естественно передаёт еврейскую именную конструкцию «имя …» в современном русском повествовании, не меняя её функции представления лиц.
- source_word: אֵשֶׁת
  choice: жену
  rationale: В сочетании с именем Саула слово однозначно обозначает супругу.
- source_word: בַּת
  choice: дочерью
  rationale: Передаёт стандартное генеалогическое указание на родство.
- source_word: שַׂר צְבָאוֹ
  choice: военачальника его войска
  rationale: Сочетание обозначает начальника царских вооружённых сил; «военачальник» звучит естественно и достойно в современном русском.
- source_word: בֶּן
  choice: сыном
  rationale: Стандартная передача патронимической формулы.
- source_word: דּוֹד
  choice: дяди
  rationale: В генеалогическом контексте наиболее вероятно обозначение дяди; падежная конструкция ясно связывает это определение с Ниром.
theological_decisions:
- issue: Значение דּוֹד в родословном сообщении о Сауле
  choice: дяди Саула
  alternative: родственника Саула
  rationale: В данном генеалогическом контексте значение «дядя» наиболее вероятно, однако еврейское слово может употребляться и шире, поэтому альтернативу следует отметить.
- issue: К кому относится приложение דּוֹד שָׁאוּל
  choice: 'к Ниру: «Нира, дяди Саула»'
  alternative: 'к Авениру: «Авенир … дядя Саула»'
  rationale: Непосредственное соседство с именем Нира и генеалогический контекст поддерживают отнесение к Ниру; русский синтаксис делает выбранное понимание явным.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранены узнаваемые русские формы имён «Саул», «Авенир» и «Нир»; формы «Ахиноам» и «Ахимаац» приближены к еврейскому источнику. Для устранения неестественного повтора формулы «имя …» использовано «звали», а вторая часть отделена точкой с запятой.
