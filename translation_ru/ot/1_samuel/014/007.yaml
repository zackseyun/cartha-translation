  verdict: revise
  source_fidelity: 'Начальное «Оруженосец сказал ему» и «Делай всё, что у тебя на сердце» точно передают еврейский текст. «Иди вперёд» является допустимой контекстуальной передачей краткого и не вполне прозрачного נְטֵה לָךְ, согласующейся с английским audit trail («Go on»). Однако «и поддержу любое твоё решение» заметно расширяет исходное заверение: в тексте нет отдельного глагола «поддержу», а «любое» неоправданно делает формулу более категоричной. Лучше сохранить её краткость и связь с желанием/намерением Ионафана.'
