  terminology: «Оруженосец» — точный и устойчивый термин. «Сердце» в первой части оправданно сохраняет библейский образ намерения; в заключительной формуле «как ты пожелаешь» передаёт её функцию, а сноска фиксирует буквальный образ и семантическую неоднозначность.
