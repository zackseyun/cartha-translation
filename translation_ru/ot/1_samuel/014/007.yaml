  yaml_path: translation/ot/1_samuel/014/007.yaml
  text: His armor-bearer said to him, “Do all that is in your heart. Go on; here I am with you, according to your heart.”
translation:
  language: ru
  text: 'Оруженосец сказал ему: «Делай всё, что у тебя на сердце. Иди вперёд; вот, я с тобой — как ты пожелаешь».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вот я с тобой, согласно твоему сердцу». Эта краткая формула выражает готовность оруженосца действовать в согласии с намерением Ионафана; её точный оттенок не вполне ясен.'
    reason: Сноска сохраняет образ «сердца» и отмечает неоднозначность заключительной древнееврейской формулы, не приписывая ей более сильного обещания, чем содержит оригинал.
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: оруженосец
  rationale: Устойчивое и точное русское обозначение человека, носившего оружие воина.
- source_word: עֲשֵׂה כָּל אֲשֶׁר בִּלְבָבֶךָ
  choice: делай всё, что у тебя на сердце
  rationale: Сохраняет древнееврейский образ сердца как средоточия намерения и решения и звучит понятно по-русски.
- source_word: נְטֵה לָךְ
  choice: иди вперёд
  rationale: В данном контексте это побуждение продолжить задуманное; буквальное «повернись/склонись» по-русски было бы неясно.
- source_word: הִנְנִי עִמְּךָ כִּלְבָבֶךָ
  choice: я с тобой и поддержу любое твоё решение
  rationale: Передаёт заверение в полной солидарности; буквальное повторение «согласно твоему сердцу» неестественно и двусмысленно в современном русском.
theological_decisions:
- issue: Степень поддержки, выраженная оруженосцем
  choice: поддержу любое твоё решение
  alternative: я с тобой, как твоё сердце
  rationale: Фраза описывает личную преданность оруженосца Ионафану, а не богословское одобрение любого внутреннего побуждения.
translation_notes:
  register: Современный литературный русский; прямая речь энергична и достойна, без архаизмов. Образ «на сердце» сохранён, тогда как заключительная идиома раскрыта ради естественности и ясности.
