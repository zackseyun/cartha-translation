lexical_decisions:
- source_word: וַיִּהְיוּ בְּנֵי שָׁאוּל
  choice: Сыновьями Саула были
  rationale: Естественная русская конструкция передаёт простое генеалогическое сообщение; начальный союз не требует отдельного временного маркера.
- source_word: יוֹנָתָן
  choice: Ионафан
  rationale: Традиционная и узнаваемая русская библейская форма имени.
- source_word: יִשְׁוִי
  choice: Ишви
  rationale: Транслитерация масоретской формы имени.
- source_word: מַלְכִּי שׁוּעַ
  choice: Малхишуа
  rationale: Цельное написание сохраняет составное еврейское имя и соответствует естественной русской передаче.
- source_word: וְשֵׁם שְׁתֵּי בְנֹתָיו
  choice: а двух его дочерей звали так
  rationale: Идиоматически передаёт буквально единственное «имя двух его дочерей» и вводит последующий перечень двух имён.
- source_word: הַבְּכִירָה
  choice: первородную
  rationale: Сохраняет прямую связь слова с порядком рождения; возможное значение «старшую» отмечено в сноске.
- source_word: מֵרַב
  choice: Мерава
  rationale: Русская форма имени с падежным окончанием, необходимым после конструкции «звали».
- source_word: הַקְּטַנָּה
  choice: младшую
  rationale: В семейном контексте обозначает младшую по возрасту, а не меньшую по размеру.
- source_word: מִיכַל
  choice: Мелхола
  rationale: Традиционная русская библейская форма имени, широко узнаваемая читателями.
