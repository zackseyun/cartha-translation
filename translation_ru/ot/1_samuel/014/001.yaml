  text: וַ/יְהִ֣י הַ/יּ֗וֹם וַ/יֹּ֨אמֶר יוֹנָתָ֤ן בֶּן שָׁאוּל֙ אֶל הַ/נַּ֨עַר֙ נֹשֵׂ֣א כֵלָ֔י/ו לְכָ֗/ה וְ/נַעְבְּרָה֙ אֶל מַצַּ֣ב פְּלִשְׁתִּ֔ים אֲשֶׁ֖ר מֵ/עֵ֣בֶר הַלָּ֑ז וּ/לְ/אָבִ֖י/ו לֹ֥א הִגִּֽיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/001.yaml
  text: One day Jonathan son of Saul said to the young man who carried his armor[a], “Come[b], let us cross over to the Philistine garrison that is on the other side.” But he did not tell his father.
translation:
  language: ru
  text: 'Однажды Ионафан, сын Саула, сказал юноше, носившему его оружие: «Пойдём, переберёмся к гарнизону филистимлян[a], что на той стороне[b]». Но своему отцу он ничего не сказал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «к посту филистимлян» или «к отряду филистимлян». Еврейское слово может обозначать военный пост либо размещённое там подразделение.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «который по ту сторону этого». Вероятно, речь идёт о проходе между скалами, описанном в следующих стихах.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Однажды
  rationale: Обычная древнееврейская формула перехода к событию в повествовании; «однажды» естественно передаёт временное значение без тяжеловесного буквального «и было в тот день».
- source_word: הַנַּעַר נֹשֵׂא כֵלָיו
  choice: юноше, носившему его оружие
  rationale: נַעַר здесь обозначает достаточно взрослого для военной службы юношу, а причастное сочетание буквально описывает его как носившего оружие или снаряжение Ионафана. Развёрнутая формулировка ближе к строению исходного текста, чем одно слово «оруженосец».
- source_word: לְכָה וְנַעְבְּרָה
  choice: Пойдём, переберёмся
  rationale: Передаёт побуждение לְכָה и следующее когортативное «давай перейдём». Глагол «переберёмся» уместен для перехода через разделяющую местность, описанную далее.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: гарнизону филистимлян
  rationale: מַצָּב в военном контексте может обозначать как военный пост, так и размещённый там отряд. «Гарнизон» естественно сохраняет обе стороны значения; альтернативы вынесены в примечание.
- source_word: אֲשֶׁר מֵעֵבֶר הַלָּז
  choice: что на той стороне
  rationale: Передаёт пространственное значение «по ту сторону / на той стороне» и указательность הַלָּז, не добавляя в основной текст отсутствующее существительное «ущелье» или «проход».
- source_word: וּלְאָבִיו לֹא הִגִּיד
  choice: Но своему отцу он ничего не сказал
  rationale: «Но» естественно выражает повествовательное противопоставление, а «ничего не сказал» идиоматично передаёт отрицание при הִגִּיד — «сообщил, рассказал».
