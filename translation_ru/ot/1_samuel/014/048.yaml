    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ חַיִל
  choice: проявил доблесть
  rationale: 'Еврейское сочетание буквально связано с силой и доблестью, но употреблено идиоматически: Саул действовал мужественно и успешно в военном отношении. Русское «проявил доблесть» сохраняет образ и естественно звучит в данном контексте.'
- source_word: וַיַּךְ
  choice: поразил
  rationale: Глагол נכה может обозначать нанесение удара или военное поражение противника. «Поразил» сохраняет широту и образность исходного глагола.
- source_word: עֲמָלֵק
  choice: амаликитян
  rationale: В еврейском тексте стоит собирательное имя «Амалик», обозначающее народ. В современном русском «амаликитян» яснее передаёт корпоративный смысл.
- source_word: וַיַּצֵּל
  choice: избавил
  rationale: Форма породы хифиль от נצל означает вырвать из опасности, спасти, избавить. «Избавил» передаёт освобождение от власти грабителей без добавления узкого богословского смысла.
- source_word: מִיַּד
  choice: из рук
  rationale: Буквально «из руки» — устойчивый образ власти или контроля. Русское «из рук» сохраняет исходную метафору и согласуется с естественным множественным обозначением грабителей.
- source_word: שֹׁסֵהוּ
  choice: тех, кто его грабил
  rationale: Причастие обозначает грабителя или разорителя; суффикс буквально имеет значение «его» и относится к собирательному имени «Израиль». Множественное «тех, кто» естественно передаёт коллективный смысл, а «его» сохраняет грамматическое соотнесение с Израилем.
