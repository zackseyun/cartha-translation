  text: וְ/שָׁא֛וּל לָכַ֥ד הַ/מְּלוּכָ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּלָּ֣חֶם סָבִ֣יב בְּֽ/כָל אֹיְבָ֡י/ו בְּ/מוֹאָ֣ב וּ/בִ/בְנֵי עַמּ֨וֹן וּ/בֶ/אֱד֜וֹם וּ/בְ/מַלְכֵ֤י צוֹבָה֙ וּ/בַ/פְּלִשְׁתִּ֔ים וּ/בְ/כֹ֥ל אֲשֶׁר יִפְנֶ֖ה יַרְשִֽׁיעַ־׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/047.yaml
  text: 'Saul had secured the kingship over Israel[a], and he fought against all his enemies on every side: against Moab, against the Ammonites, against Edom, against the kings of Zobah, and against the Philistines. Wherever he turned, he inflicted punishment.'
translation:
  language: ru
  text: 'Саул утвердил свою царскую власть над Израилем и воевал со всеми своими врагами со всех сторон: с Моавом, аммонитянами, Эдомом, царями Совы и филистимлянами. Куда бы он ни повернул, он карал врагов[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно, более буквально: «признавал их виновными». Еврейский глагол может означать «объявлять виновным»; здесь в военном контексте он, вероятно, указывает на карательное поражение врагов.'
    reason: יַרְשִׁיעַ — лексически трудная форма; примечание сохраняет судебное значение наряду с наиболее вероятным военным смыслом.
lexical_decisions:
- source_word: לָכַד הַמְּלוּכָה עַל יִשְׂרָאֵל
  choice: утвердил свою царскую власть над Израилем
  rationale: Глагол לָכַד буквально связан с захватом или овладением, но в сочетании с «царской властью» здесь описывает прочное установление власти Саула, а не обязательно её незаконный захват. «Царская власть» передаёт абстрактно-институциональное значение הַמְּלוּכָה.
- source_word: וַיִּלָּחֶם סָבִיב בְּכָל אֹיְבָיו
  choice: воевал со всеми окружавшими его врагами
  rationale: Предлог ב при לָחַם обозначает противника; по-русски нормативно «воевать с». סָבִיב указывает на врагов со всех сторон, что естественно выражено причастным оборотом.
- source_word: בְּמוֹאָב וּבִבְנֵי עַמּוֹן וּבֶאֱדֹם וּבְמַלְכֵי צוֹבָה וּבַפְּלִשְׁתִּים
  choice: с Моавом, аммонитянами, Эдомом, царями Совы и филистимлянами
  rationale: '«Аммонитяне» — естественный русский эквивалент буквального «сыны Аммона». Множественное число מַלְכֵי сохранено: «цари Совы».'
- source_word: וּבְכֹל אֲשֶׁר יִפְנֶה
  choice: Куда бы он ни обращался
  rationale: 'Передаёт распределительное значение оборота: в любом направлении действий Саула.'
- source_word: יַרְשִׁיעַ
  choice: он карал врагов
  rationale: Трудная форма Hiphil от רשע может означать признание виновным или обращение с кем-либо как с виновным. В военном контексте «карал» сохраняет судебно-наказательный оттенок, не сводя выражение просто к победе; подразумеваемый объект раскрыт как враги из предыдущего предложения.
theological_decisions:
- issue: Судебный оттенок יַרְשִׁיעַ в повествовании о войне
  choice: карал врагов
  alternative: побеждал; признавал их виновными
  rationale: «Побеждал» естественно контекстуально, но устраняет значение виновности и наказания; буквальное «признавал виновными» в данном военном контексте звучит неясно. Основной текст сохраняет напряжение через «карал», а примечание сообщает буквальную возможность.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Избегнуты архаизмы вроде «царствование» в значении института власти и чрезмерно буквальное «сыны Аммона». Традиционные и узнаваемые русские формы имён и народов сохранены.
