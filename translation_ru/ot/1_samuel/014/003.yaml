  text: וַ/אֲחִיָּ֣ה בֶן אֲחִט֡וּב אֲחִ֡י אִיכָב֣וֹד בֶּן פִּינְחָ֨ס בֶּן עֵלִ֜י כֹּהֵ֧ן יְהוָ֛ה בְּ/שִׁל֖וֹ נֹשֵׂ֣א אֵפ֑וֹד וְ/הָ/עָם֙ לֹ֣א יָדַ֔ע כִּ֥י הָלַ֖ךְ יוֹנָתָֽן־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/003.yaml
  text: Ahijah son of Ahitub[a], brother of Ichabod, son of Phinehas, son of Eli, priest of Yahweh at Shiloh, was carrying an ephod. And the people did not know that Jonathan had gone.
translation:
  language: ru
  text: Ахия, сын Ахитува, брата Ихавода, сына Финееса, сына Илия, был священником Яхве в Силоме и нёс эфод[a]. Народ не знал, что Ионафан ушёл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «носил эфод». Еврейское выражение буквально означает «нёс / носил эфод» и само по себе не уточняет, нёс ли он эфод или носил его как облачение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחִיָּה
  choice: Ахия
  rationale: Личное имя передано принятой русской библейской формой; начальный ו не воспроизведён отдельным союзом, поскольку здесь он связывает повествование с контекстом, а по-русски начало именной конструкции естественно без «и».
- source_word: בֶן אֲחִטוּב אֲחִי אִיכָבוֹד בֶּן פִּינְחָס בֶּן עֵלִי
  choice: сын Ахитува, брата Ихавода, сына Финееса, сына Илия
  rationale: 'Родословная цепочка сохранена. Формой родительного падежа показано наиболее естественное синтаксическое отношение: Ахитув — брат Ихавода и сын Финееса, а Финеес — сын Илия.'
- source_word: כֹּהֵן יְהוָה בְּשִׁלוֹ
  choice: священник Яхве в Силоме
  rationale: כֹּהֵן передано обычным культовым термином «священник»; личное имя יהוה транслитерировано как «Яхве». Предлог ב допускает «в/при», а «в Силоме» естественно обозначает место служения.
- source_word: נֹשֵׂא אֵפוֹד
  choice: нёс эфод
  rationale: נשא прежде всего означает «нести, носить». Выбранное выражение сохраняет буквальную широту и не решает без необходимости, был ли эфод надет как облачение.
- source_word: וְהָעָם לֹא יָדַע
  choice: Народ не знал
  rationale: Коллективное הָעָם естественно передаётся единственным числом «народ»; начальный союз опущен ради плавности современного русского повествования.
- source_word: כִּי הָלַךְ יוֹנָתָן
  choice: что Ионафан ушёл
  rationale: כִּי вводит изъяснительное придаточное, а הלך в данном контексте обозначает уже совершившийся уход Ионафана.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, тетраграмматон יהוה. Транслитерация «Яхве» сохраняет личное имя и не заменяет его титулом.
- issue: К кому относится «священник Яхве в Силоме»
  choice: к Ахии
  alternative: к Илию
  rationale: После завершённой родословной формула כֹּהֵן יְהוָה בְּשִׁלוֹ и последующее причастие נֹשֵׂא естественно возвращаются к главному участнику предложения, Ахии; это отражено приложением «священник».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Родословная оформлена компактно, но её отношения выражены яснее благодаря падежным формам. Термин «эфод» сохранён как традиционное название культового предмета или облачения; неоднозначность способа его ношения вынесена в сноску.
