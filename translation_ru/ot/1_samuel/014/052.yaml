  source_fidelity: 'Первое предложение точно передаёт длительную и напряжённую войну с филистимлянами. Во второй части еврейское וְרָאָה ... וַיַּאַסְפֵהוּ выражает повторяющееся действие: всякий раз, увидев человека одной из названных категорий, Саул присоединял его к себе. Перестройка с «Всякий раз, когда» делает этот смысл ясным и устраняет неудачную соотнесённость относительного местоимения с двумя однородными группами.'
