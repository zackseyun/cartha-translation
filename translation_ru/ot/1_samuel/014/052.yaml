- from: Война с филистимлянами была ожесточённой во все дни Саула[a]. Всякого сильного воина и всякого доблестного человека[b], которого замечал Саул, он брал к себе[c].
  to: Война с филистимлянами была ожесточённой во все дни Саула[a]. Всякий раз, когда Саул видел сильного воина или доблестного человека[b], он привлекал его к себе[c].
