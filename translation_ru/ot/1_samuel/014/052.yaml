base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/052.yaml
  text: And the war against the Philistines was severe all the days of Saul[a]. Whenever Saul saw any mighty man or any valiant man[c][b], he gathered him to himself.
translation:
  language: ru
  text: Война с филистимлянами была ожесточённой во все дни Саула[a]. Всякий раз, когда Саул видел сильного воина или доблестного человека[b], он привлекал его к себе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тяжёлой» или «упорной». Буквально еврейское прилагательное означает «сильной».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всякого могучего человека и всякого сына доблести».'
    reason: lexical_alternative
  - marker: c
    text: То есть принимал таких людей к себе на службу.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה
  choice: Война … была
  rationale: Простое прошедшее время естественно передаёт повествовательное продолжение, а «война» обозначает длительное противостояние, не отдельную битву.
- source_word: חֲזָקָה
  choice: ожесточённой
  rationale: Буквально прилагательное означает «сильной», но применительно к длительной войне русское «ожесточённой» естественно передаёт её напряжённость и тяжесть.
- source_word: עַל פְּלִשְׁתִּים
  choice: с филистимлянами
  rationale: В русском сочетание «война с кем-либо» идиоматично обозначает противника и точно передаёт функцию предлога עַל при слове «война».
- source_word: כֹּל יְמֵי שָׁאוּל
  choice: во все дни Саула
  rationale: Формулировка сохраняет временной образ еврейского текста и не сужает его явно ни до жизни, ни только до царствования.
- source_word: וְרָאָה
  choice: которого замечал Саул
  rationale: Несовершенный по смыслу повторяющийся характер действия передан формой «замечал» в конструкции, означающей обычное действие.
- source_word: כָּל אִישׁ גִּבּוֹר
  choice: всякого сильного воина
  rationale: «Всякого» передаёт распределительное значение כָּל, а «сильный воин» сохраняет военный оттенок גִּבּוֹר.
- source_word: וְכָל בֶּן חַיִל
  choice: и всякого доблестного человека
  rationale: Идиома «сын доблести/силы» обозначает доблестного, способного или достойного человека; выбранный вариант естественен в военном контексте и сохраняет отличие от предыдущего выражения.
- source_word: וַיַּאַסְפֵהוּ אֵלָיו
  choice: он брал к себе
  rationale: Фраза передаёт буквальный образ присоединения человека к Саулу, оставаясь естественной по-русски; подразумеваемый набор на службу поясняется в сноске.
