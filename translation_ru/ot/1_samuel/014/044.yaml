lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Стандартная повествовательная форма с waw-consecutive; союз «и» сохраняет течение еврейского рассказа, не уточняя сверх текста временную последовательность.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Общепринятая русская передача личного имени.
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים וְכֹה יוֹסִף
  choice: Пусть Бог сделает так и ещё больше
  rationale: Передаёт устойчивую формулу клятвы и проклятия, сохраняя её подразумеваемый объект и не добавляя отсутствующее в еврейском тексте «со мной».
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В этой формуле слово обозначает единого Бога, призываемого как свидетеля и исполнителя клятвенного проклятия.
- source_word: כִּי
  choice: ':'
  rationale: В данном контексте частица вводит содержание или основание клятвенного заявления; в естественной русской речи эту связь ясно и ёмко передаёт двоеточие.
- source_word: מוֹת תָּמוּת
  choice: ты непременно умрёшь
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает категоричность; наречие «непременно» передаёт эту эмфазу естественно по-русски.
- source_word: יוֹנָתָן
  choice: Ионафан
  rationale: Общепринятая русская библейская форма личного имени.
theological_decisions:
- issue: Передача формулы клятвы без добавления прямого самопроклятия
  choice: Пусть Бог сделает так и ещё больше
  alternative: Пусть Бог сделает это со мной и ещё больше
  rationale: В еврейском тексте объект угрожающего действия не назван. Выбранная формулировка сохраняет эту недосказанность и не привносит прямо выраженного «со мной».
translation_notes:
  register: Современный литературный русский язык с достоинством прямой царской речи. Формула клятвы намеренно звучит несколько торжественно и сохраняет смысловую недосказанность оригинала.
