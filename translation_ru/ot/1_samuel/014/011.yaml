base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/011.yaml
  text: When the two of them revealed themselves to the Philistine garrison[a], the Philistines said, “Look[b], the Hebrews are coming out of the holes where they had hidden themselves.”
translation:
  language: ru
  text: 'Оба они показались филистимскому гарнизону[a], и филистимляне сказали: «Смотрите! Евреи[b] выходят из дыр, где они спрятались».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «показались филистимскому сторожевому посту».'
    reason: lexical_alternative
  - marker: b
    text: «Евреи» — этническое наименование израильтян, употреблённое здесь филистимлянами.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגָּלוּ
  choice: показались
  rationale: Нифаль глагола גלה здесь передаёт намеренное появление на виду. «Показались» естественно выражает это действие, не сводя его к непроизвольному «были замечены».
- source_word: שְׁנֵיהֶם
  choice: они оба
  rationale: Сохраняет явное указание на двоих — Ионафана и его оруженосца — и звучит естественно по-русски.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: филистимская застава
  rationale: В данном военном контексте מַצָּב обозначает выставленный отряд или укреплённый пост. «Застава» передаёт и место, и находящуюся там стражу.
- source_word: הִנֵּה
  choice: Смотрите!
  rationale: Сохраняет призыв обратить внимание и восклицательную силу частицы без архаичного «вот, behold»-подобного оборота.
- source_word: עִבְרִים
  choice: Евреи
  rationale: Сохранено этническое наименование, употреблённое филистимлянами по отношению к израильтянам; оно передаёт взгляд внешней стороны и не заменяется словом «израильтяне».
- source_word: יֹצְאִים
  choice: выходят
  rationale: Причастие описывает действие, происходящее на глазах филистимлян; настоящее время естественно передаёт эту непосредственность.
- source_word: מִן הַחֹרִים
  choice: из дыр
  rationale: חֹרִים буквально означает отверстия или углубления. «Из дыр» сохраняет конкретность и возможную пренебрежительную окраску речи филистимлян, не уточняя неоправданно «пещеры».
- source_word: אֲשֶׁר הִתְחַבְּאוּ שָׁם
  choice: где они прятались
  rationale: Придаточное естественно обозначает места укрытия. Возвратное значение хитпаэля передано глаголом «прятались»; русское прошедшее время достаточно ясно обозначает предшествовавшее укрытие без тяжеловесной формы давнопрошедшего времени.
