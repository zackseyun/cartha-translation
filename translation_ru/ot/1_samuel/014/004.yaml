  text: וּ/בֵ֣ין הַֽ/מַּעְבְּר֗וֹת אֲשֶׁ֨ר בִּקֵּ֤שׁ יֽוֹנָתָן֙ לַֽ/עֲבֹר֙ עַל מַצַּ֣ב פְּלִשְׁתִּ֔ים שֵׁן הַ/סֶּ֤לַע מֵ/הָ/עֵ֨בֶר֙ מִ/זֶּ֔ה וְ/שֵׁן הַ/סֶּ֥לַע מֵ/הָ/עֵ֖בֶר מִ/זֶּ֑ה וְ/שֵׁ֤ם הָֽ/אֶחָד֙ בּוֹצֵ֔ץ וְ/שֵׁ֥ם הָ/אֶחָ֖ד סֶֽנֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/004.yaml
  text: Between the passes by which Jonathan sought to cross over to the Philistine garrison[a], there was a crag of rock on one side and a crag of rock on the other side; and the name of the one was Bozez, and the name of the other Seneh.
translation:
  language: ru
  text: Между проходами, через которые Ионафан хотел перейти к заставе филистимлян, с одной стороны был острый скальный выступ[a], а с другой — такой же; один назывался Боцец, а другой — Сенне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «зуб скалы» — образ острого скального выступа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְבְּרוֹת
  choice: проходами
  rationale: Существительное обозначает места прохода или переправы; в скалистой местности естественное «проходы» передаёт рельеф, не предполагая водной преграды.
- source_word: בִּקֵּשׁ ... לַעֲבֹר
  choice: намеревался перейти
  rationale: Сочетание выражает целенаправленное намерение или стремление; выбранная формулировка естественна по-русски и не утверждает, что попытка уже началась.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: сторожевому посту филистимлян
  rationale: В военном контексте слово обозначает выставленный пост или размещённый там отряд; «сторожевой пост» хорошо подходит к небольшому передовому укреплению.
- source_word: שֵׁן הַסֶּלַע
  choice: острый скальный выступ
  rationale: Буквально «зуб скалы»; это образ острого, выдающегося скального образования. Перевод сохраняет топографический смысл, а буквальный образ отмечен в сноске.
- source_word: מֵהָעֵבֶר מִזֶּה ... מֵהָעֵבֶר מִזֶּה
  choice: с одной стороны ... с другой
  rationale: Повтор указывает на две противоположные стороны прохода; русская парная конструкция ясно и естественно передаёт это расположение.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הָאֶחָד
  choice: один назывался ... а другой
  rationale: Идиоматическая русская формулировка сохраняет симметричную структуру называния двух скал.
- source_word: בּוֹצֵץ
  choice: Боцец
  rationale: Собственное имя передано транслитерацией с учётом еврейского согласного состава.
- source_word: סֶנֶּה
  choice: Сенне
  rationale: Собственное имя передано традиционно понятной русской транслитерацией, отражающей удвоение конечного согласного.
- source_word: וּבֵין
  choice: Между
  rationale: Начальное ו связывает стих с повествованием, но отдельное «и» в русском здесь утяжеляло бы фразу; связь естественно передаётся продолжением контекста.
