  terminology: «Застава филистимлян» — естественное современное обозначение военного поста и уместно для מַצַּב. «Острый скальный выступ» удачно передаёт образ «зуба скалы»; сноска сохраняет буквальный образ. Имена Боцец и Сенне оставлены в принятой транслитерационной форме черновика.
