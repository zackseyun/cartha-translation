  register: Современный литературный русский язык с умеренно высоким повествовательным регистром. Синтаксис упрощён относительно еврейского повторного построения, но пространственная симметрия и буквальный скальный образ сохранены; маркер [a] помещён непосредственно после соответствующего выражения.
