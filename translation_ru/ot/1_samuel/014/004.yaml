revisions:
- from: Между проходами, по которым Ионафан намеревался перейти к сторожевому посту филистимлян, с одной стороны возвышался острый скальный выступ[a], а с другой — другой; один назывался Боцец, а другой — Сенне.
  to: Между проходами, через которые Ионафан хотел перейти к заставе филистимлян, с одной стороны был острый скальный выступ[a], а с другой — такой же; один назывался Боцец, а другой — Сенне.
  rationale: 'Исправлена только неисправная русская парная конструкция: «такой же» естественно отсылает ко второму «острому скальному выступу» и передаёт повторное שֵׁן הַסֶּלַע. «Хотел перейти» сохраняет намеренный, целенаправленный оттенок בִּקֵּשׁ ... לַעֲבֹר, не утверждая уже начатую попытку. Сноска и её якорь сохранены непосредственно при переводе שֵׁן הַסֶּלַע.'
