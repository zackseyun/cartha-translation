base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/051.yaml
  text: Kish was the father of Saul[a], and Ner was the father of Abner, the son of Abiel.
translation:
  language: ru
  text: Кис был отцом Саула, а Нир, сын Авиила, — отцом Авенира.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/קִישׁ
  choice: Кис
  rationale: Личное имя передано в традиционной русской библейской форме.
- source_word: אֲבִי
  choice: был отцом
  rationale: Сопряжённая форма слова «отец» входит в безглагольное родословное предложение; связка «был» добавлена для естественного русского синтаксиса.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Личное имя передано в традиционной русской библейской форме.
- source_word: וְ/נֵר
  choice: а Нир
  rationale: Союз передан как «а», чтобы естественно выразить параллельное сопоставление двух родословных сведений; имя дано в форме «Нир», близкой к еврейскому звучанию.
- source_word: אֲבִי
  choice: отцом
  rationale: Повторное родословное обозначение сохранено; связка подразумевается при однородной конструкции.
- source_word: אַבְנֵר
  choice: Авенир
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: בֶּן
  choice: сына
  rationale: Родословное обозначение передано приложением в родительном падеже; ближайший синтаксический референт — Авенир, хотя контекст родословия допускает трудность понимания, отмеченную в сноске.
- source_word: אֲבִיאֵל
  choice: Авиэль
  rationale: Имя транслитерировано близко к еврейской форме, с сохранением конечного элемента «-эль».
theological_decisions:
- issue: К кому относится выражение בֶּן אֲבִיאֵל («сын Авиэля»)?
  choice: В основном тексте оно грамматически отнесено к ближайшему имени — Авениру.
  alternative: По родословному контексту Авиэль может пониматься как отец Киса и Нира, то есть Нир — сын Авиэля, а Авенир — внук Авиэля.
  rationale: Еврейская фраза сжата и формально допускает ближайшее присоединение к Авениру, однако 1 Цар. 9:1 и 14:50–51 создают родословное напряжение. Его нельзя молча устранять, поэтому оно отражено в примечании.
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами широко известных библейских имён. Безглагольная еврейская конструкция естественно развёрнута с помощью связки; параллелизм сохранён посредством тире.
