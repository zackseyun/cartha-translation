    rationale: Еврейское «вышли» в данном контексте обозначает, что народ не оказался выбранным/задержанным жребием. «Был оправдан» вводит судебный вердикт, не выраженный непосредственно в тексте.
  - severity: low
    issue: Вторая условная часть длинного чтения в сноске
    rationale: «Если же она на Твоём народе Израиле» подставляет «вина», отсутствующее в соответствующей части древнего чтения. Нейтральное «если это в Твоём народе Израиле» точнее сохраняет эллипсис.
