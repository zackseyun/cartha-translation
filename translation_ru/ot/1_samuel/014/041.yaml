base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/041.yaml
  text: Then Saul said to Yahweh[a], the God of Israel, “Give a perfect lot.” And Jonathan and Saul were taken, but the people escaped.
translation:
  language: ru
  text: 'Тогда Саул сказал Яхве, Богу Израиля: «Дай безупречный жребий».[a] Жребий пал на Ионафана и Саула, а народ не был выбран.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Дай совершенное (или: непорочное)». Вероятно, Саул просит о бесспорном решении посредством жребия. В Септуагинте сохранилось более длинное древнее чтение: «Почему Ты сегодня не ответил Твоему рабу? Если вина эта на мне или на моём сыне Ионафане, Яхве, Бог Израиля, дай урим; если же это в Твоём народе Израиле, дай туммим».'
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: הָבָה
  choice: Дай
  rationale: Прямой и естественный русский эквивалент формы просьбы-повеления, обращённой к Богу.
- source_word: תָמִים
  choice: безупречный жребий
  rationale: תָמִים означает «целый, совершенный, непорочный»; в контексте бросания жребия речь, вероятно, идёт о бесспорном решении. Слово «жребий» подразумевается контекстом и добавлено для ясности.
- source_word: וַיִּלָּכֵד
  choice: жребий пал на
  rationale: В контексте выявления виновного посредством жребия глагол означает, что человек был выбран или обнаружен; русская идиома ясно передаёт этот смысл и страдательный результат.
- source_word: יָצָאוּ
  choice: был оправдан
  rationale: Буквально «вышли»; в противопоставлении тем, на кого пал жребий, народ оказался исключён из числа подозреваемых. «Был оправдан» естественно передаёт судебно-жребиевый смысл, не создавая впечатления физического бегства.
theological_decisions:
- issue: Текстовая форма молитвы Саула
  choice: 'В основном тексте сохранить краткое масоретское чтение: «Дай безупречный жребий».'
  alternative: 'Принять развёрнутое древнее чтение, засвидетельствованное Септуагинтой: просьбу указать на Саула и Ионафана посредством урима либо на народ посредством туммима.'
  rationale: Предоставленный еврейский источник WLC содержит краткое и трудное чтение, поэтому оно сохраняется в основном тексте. Более длинное древнее свидетельство важно для понимания и отмечено в сноске, но не внесено в текст без оговорки.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «жребий пал на» выбрана вместо буквального «были пойманы», поскольку она естественно обозначает результат жеребьёвки. Сноска сохраняет буквальную неясность תָמִים и существенный древний текстовый вариант.
