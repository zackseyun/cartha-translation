revisions:
- from: 'Израильтянам в тот день пришлось тяжело. Саул заклял народ, сказав: «Проклят тот, кто вкусит пищу[a] до вечера, пока я не отомщу своим врагам!» Поэтому никто из народа не вкусил пищи.'
  to: 'Израильтянам в тот день пришлось тяжело. Саул заставил народ дать клятву, сказав: «Проклят тот, кто поест пищи[a] до вечера, пока я не отомщу своим врагам!» Поэтому никто из народа не вкусил пищи.'
  rationale: 'Исправлен первый глагол запрета: «поест» соответствует יֹאכַל («есть»), а «вкусил» сохранено для טָעַם в заключительной фразе. «Заставил народ дать клятву» яснее передаёт возложение клятвы Саулом. Два временных ограничения в прямой речи и их исходная синтаксическая неоднозначность сохранены.'
  reviewer_model: gpt-5.6-terra
