base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/024.yaml
  text: The men of Israel were hard-pressed that day[a], and Saul put the people under an oath, saying, “Cursed is the man who eats food before evening, before I have avenged myself on my enemies.” So none of the people tasted food.
translation:
  language: ru
  text: 'Израильтянам в тот день пришлось тяжело. Саул заставил народ дать клятву, сказав: «Проклят тот, кто поест пищи[a] до вечера, пока я не отомщу своим врагам!» Поэтому никто из народа не вкусил пищи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «хлеб» в обоих случаях; здесь, вероятно, имеется в виду пища вообще.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: Израильтянам
  rationale: Буквально «муж Израиля» употреблено собирательно и обозначает израильтян; дательный оборот естественно сочетается с русским выражением «пришлось тяжело».
- source_word: נִגַּשׂ
  choice: пришлось тяжело
  rationale: В данном контексте форма Niphal передаёт стеснённое, бедственное положение, а не пространственное приближение. Такой перевод звучит естественно и сохраняет связь с последствиями клятвы Саула.
- source_word: וַיֹּאֶל ... אֶת־הָעָם
  choice: Саул заклял народ
  rationale: Контекст прямого проклятия показывает, что Саул обязал народ клятвой. «Заклял» кратко и точно передаёт принудительную силу действия.
- source_word: אָרוּר הָאִישׁ
  choice: Проклят тот
  rationale: Сохраняется формула провозглашения проклятия; русское «тот» естественно передаёт обобщённое единственное число.
- source_word: יֹאכַל לֶחֶם
  choice: вкусит пищу
  rationale: לֶחֶם буквально означает «хлеб», но здесь обозначает пищу вообще; глагол «вкусит» сохраняет образность исходного выражения.
- source_word: עַד הָעֶרֶב וְנִקַּמְתִּי מֵאֹיְבַי
  choice: до вечера, пока я не отомщу своим врагам
  rationale: Перевод сохраняет оба названных Саулом предела — наступление вечера и совершение мести, — не устраняя некоторую неоднозначность их синтаксического соотношения.
- source_word: וְלֹא טָעַם כָּל־הָעָם לָחֶם
  choice: Поэтому никто из народа не вкусил пищи
  rationale: Отрицание при собирательном «весь народ» естественно передано как «никто из народа»; «вкусил» и «пища» согласованы с предыдущей формулировкой.
theological_decisions:
- issue: Личный характер мести Саула
  choice: «я не отомщу своим врагам»
  alternative: «не будет отмщено врагам»
  rationale: Первое лицо и притяжательное «моим» прямо присутствуют в еврейском тексте и подчёркивают личную формулировку Саула; её не следует смягчать или обезличивать.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Заклял» и «вкусил» сохраняют достоинство и выразительность текста, оставаясь понятными современному читателю.
