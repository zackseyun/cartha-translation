  - severity: low
    issue: Примечание a утверждает угрожающее значение «мы вам покажем» как допустимое лексическое значение
    rationale: Угрожающий подтекст возможен по контексту, однако не является значением данного глагола. Примечание должно пояснять буквальное «дадим вам узнать нечто» без подмены перевода.
