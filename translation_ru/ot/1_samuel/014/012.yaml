  to: 'И воины на заставе ответили Ионафану и его оруженосцу: «Поднимитесь к нам, и мы вам кое-что скажем»[a]. Тогда Ионафан сказал своему оруженосцу: «Поднимайся за мной, потому что Яхве отдал их в руки Израиля»[b].'
