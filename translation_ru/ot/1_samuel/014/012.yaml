  text: וַ/יַּעֲנוּ֩ אַנְשֵׁ֨י הַ/מַּצָּבָ֜ה אֶת יוֹנָתָ֣ן וְ/אֶת נֹשֵׂ֣א כֵלָ֗י/ו וַ/יֹּֽאמְרוּ֙ עֲל֣וּ אֵלֵ֔י/נוּ וְ/נוֹדִ֥יעָה אֶתְ/כֶ֖ם דָּבָ֑ר וַ/יֹּ֨אמֶר יוֹנָתָ֜ן אֶל נֹשֵׂ֤א כֵלָי/ו֙ עֲלֵ֣ה אַחֲרַ֔/י כִּֽי נְתָנָ֥/ם יְהוָ֖ה בְּ/יַ֥ד יִשְׂרָאֵֽל־׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/012.yaml
  text: And the men of the garrison answered Jonathan and his armor-bearer and said[a], “Come up to us, and we will tell you something.” Then Jonathan said to his armor-bearer, “Come up after me[d][c][b], for Yahweh has given them into the hand of Israel.”
translation:
  language: ru
  text: 'И воины на заставе ответили Ионафану и его оруженосцу: «Поднимитесь к нам, и мы вам кое-что скажем»[a]. Тогда Ионафан сказал своему оруженосцу: «Поднимайся за мной, потому что Яхве отдал их в руки Израиля»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и мы дадим вам узнать нечто».'
    reason: Каузативная форма глагола ידע означает «дать узнать, сообщить»; «кое-что» передаёт намеренную неопределённость слова דָּבָר.
  - marker: b
    text: 'Буквально: «отдал их в руку Израиля», то есть во власть Израиля.'
    reason: Пояснение еврейского военного идиоматического оборота.
lexical_decisions:
- source_word: אַנְשֵׁי הַמַּצָּבָה
  choice: воины с заставы
  rationale: В данном военном контексте מַצָּבָה обозначает укреплённый пост или находящийся там отряд. «Воины с заставы» естественно указывает и на людей, и на их позицию.
- source_word: נֹשֵׂא כֵלָיו
  choice: его оруженосец
  rationale: Буквально «несущий его снаряжение/оружие»; русское «оруженосец» точно и привычно передаёт военную функцию.
- source_word: עֲלוּ אֵלֵינוּ
  choice: Поднимитесь к нам
  rationale: Глагол עלה выражает движение вверх к позиции филистимлян, а «к нам» сохраняет точку отсчёта говорящих.
- source_word: וְנוֹדִיעָה אֶתְכֶם דָּבָר
  choice: и мы вам кое-что покажем
  rationale: Каузатив ידע буквально означает «дадим узнать». В контексте насмешливой угрозы русское «покажем» звучит естественно, а «кое-что» сохраняет неопределённость דָּבָר.
- source_word: עֲלֵה אַחֲרַי
  choice: Поднимайся за мной
  rationale: Форма повелительного наклонения обращена к одному человеку; перевод сохраняет и движение вверх, и следование за Ионафаном.
- source_word: כִּי נְתָנָם יְהוָה
  choice: потому что Яхве отдал их
  rationale: נתן в военном обороте с «в руки» означает передачу врага во власть победителя; «отдал» естественно передаёт завершённость действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: בְּיַד יִשְׂרָאֵל
  choice: в руки Израиля
  rationale: Сохранён понятный по-русски библейский образ передачи противника во власть Израиля.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит тетраграмматон — личное имя Бога; транслитерация позволяет не подменять его титулом.
- issue: Завершённость победы до сражения
  choice: «отдал их»
  alternative: «отдаст их»
  rationale: Перфект נְתָנָם представлен как уже совершившееся действие с точки зрения уверенности Ионафана; будущее время ослабило бы эту выразительную особенность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксическая избыточность «ответили… и сказали» сглажена без потери смысла. Формы «поднимитесь» и «поднимайся» сохраняют различие множественного и единственного числа и подчёркивают подъём к возвышенной позиции.
