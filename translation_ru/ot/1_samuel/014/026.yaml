base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/026.yaml
  text: When the people came into the forest[a], behold, there was a flow of honey, but no one put his hand to his mouth[c][b], because the people feared the oath.
translation:
  language: ru
  text: Когда народ вошёл в лес, и вот, там был поток мёда[a], но никто не поднёс руку ко рту[b], потому что народ боялся клятвы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мёд тёк»; возможно: «течение мёда». Буквально еврейское выражение означает «движение (течение) мёда».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «никто не довёл своей руки до своего рта», то есть никто не ел мёда.'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте сказано «клятвы». Имеется в виду данная ранее клятва Саула, которая фактически навлекала проклятие на всякого, кто поест до вечера (см. 1 Цар. 14:24).
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: вошёл
  rationale: Форма от בוא обозначает движение; с лесом по-русски естественно сказать «вошёл в лес».
- source_word: הָעָם
  choice: народ
  rationale: עם буквально и обычно означает «народ»; хотя в данном военном контексте возможны «воины», повторение более широкого исходного слова сохранено.
- source_word: הַיַּעַר
  choice: лес
  rationale: יער обозначает лес или лесистую местность; «лес» — ясный и прямой эквивалент.
- source_word: וְהִנֵּה
  choice: там оказался
  rationale: הנה привлекает внимание к неожиданно открывшейся картине. Русская конструкция «там оказался» естественно передаёт это повествовательное выделение без архаичного «вот».
- source_word: הֵלֶךְ דְּבָשׁ
  choice: текущий мёд
  rationale: Необычное еврейское именное выражение буквально описывает «движение/течение мёда». Основной текст сохраняет образ текущего мёда, а варианты вынесены в примечание.
- source_word: וְאֵין מַשִּׂיג יָדוֹ אֶל פִּיו
  choice: но никто не поднёс руки ко рту
  rationale: Сохранён конкретный еврейский образ руки, достигающей рта, то есть никто не стал есть мёд. Единственное число «руки» имеет обобщающее значение вслед за оригиналом.
- source_word: כִּי יָרֵא הָעָם
  choice: потому что народ боялся
  rationale: כי вводит причину, а ירא здесь означает страх нарушить наложенную клятву.
- source_word: הַשְּׁבֻעָה
  choice: клятвы
  rationale: שבועה означает «клятва». Контекстуальная связь клятвы с проклятием не подменяет её прямого лексического значения.
theological_decisions:
- issue: Отношение клятвы к проклятию Саула
  choice: В основном тексте сохранено «клятвы».
  alternative: «проклятия»
  rationale: Еврейское слово означает клятву, хотя в контексте она угрожала проклятием нарушителю. Это поясняется в сноске без смешения двух понятий.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Синтаксис сделан естественным, но сохранены повтор «народ», конкретный образ руки у рта и лексическое различие между клятвой и проклятием.
