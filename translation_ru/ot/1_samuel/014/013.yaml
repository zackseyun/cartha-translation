base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/013.yaml
  text: Then Jonathan climbed up on his hands and feet[a], with his armor-bearer behind him. They fell before Jonathan, and his armor-bearer killed them after him.
translation:
  language: ru
  text: Ионафан полез вверх на руках и ногах, а оруженосец — за ним. Враги падали перед Ионафаном, а его оруженосец, следовавший за ним, убивал их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а его оруженосец, следовавший за ним, продолжал убивать их». Еврейское причастие может подчёркивать продолжающееся действие, не уточняя, были ли эти враги уже поражены Ионафаном.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: полез вверх
  rationale: Глагол עלה означает движение вверх; в сочетании с упоминанием рук и ног естественное русское «полез вверх» ясно передаёт подъём по крутому склону, не добавляя способа сверх указанного в тексте.
- source_word: עַל יָדָיו וְעַל רַגְלָיו
  choice: на руках и ногах
  rationale: Сохраняет конкретный и выразительный образ еврейского текста; вариант «на четвереньках» более разговорный и несколько истолковывающий.
- source_word: נֹשֵׂא כֵלָיו
  choice: оруженосец
  rationale: Устоявшееся русское обозначение военного слуги, носившего оружие и снаряжение воина.
- source_word: אַחֲרָיו
  choice: за ним / шедший следом
  rationale: Передаёт пространственное следование оруженосца за Ионафаном и естественно звучит в обоих случаях употребления.
- source_word: וַיִּפְּלוּ לִפְנֵי יוֹנָתָן
  choice: враги падали перед Ионафаном
  rationale: Глагол в военном контексте говорит о поражении противников, однако формулировка не уточняет, каким именно образом Ионафан повергал каждого из них. Подлежащее «враги» восполняется из непосредственного контекста для ясности по-русски.
- source_word: מְמוֹתֵת
  choice: добивал их
  rationale: Причастная форма изображает сопутствующее или продолжающееся действие оруженосца позади Ионафана. «Добивал» естественно передаёт боевую сцену, хотя может подразумевать завершение начатого Ионафаном сильнее, чем нейтральное «убивал».
