  to: Ионафан полез вверх на руках и ногах, а оруженосец — за ним. Враги падали перед Ионафаном, а его оруженосец, следовавший за ним, убивал их.[a]
  rationale: Исправлен только небезопасный смысловой избыток в «добивал». Основной перевод теперь передаёт нейтральное значение еврейского причастия, а примечание сохраняет возможный оттенок продолжающегося действия и прямо предостерегает от вывода, будто оруженосец непременно завершал действия Ионафана.
