base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/028.yaml
  text: Then one of the people answered and said[a], “Your father strictly put the people under oath, saying[b], ‘Cursed is the man who eats food today.’ So the people were faint.”
translation:
  language: ru
  text: 'Тогда один из народа ответил: «Твой отец взял с народа строгую клятву, сказав: „Проклят тот, кто сегодня будет есть пищу[a]“». И народ изнемог[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлеба»; здесь это слово означает пищу вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «народ обессилел»; «народ был изнурён».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן אִישׁ מֵהָעָם וַיֹּאמֶר
  choice: Тогда один из народа ответил
  rationale: Естественно передаёт повествовательную формулу и сохраняет значение ответа; парное «ответил и сказал» по-русски звучало бы избыточно.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: связал народ строгой клятвой
  rationale: Каузативная конструкция с усилительным инфинитивом означает, что Саул обязал народ клятвой; «строгой» передаёт усиление без архаизма.
- source_word: אָבִיךָ
  choice: твой отец
  rationale: Сохраняет прямое обращение к Ионафану.
- source_word: אָרוּר הָאִישׁ
  choice: Проклят тот
  rationale: Передаёт торжественную формулу проклятия; местоимение «тот» естественно выражает обобщённое значение древнееврейского мужского единственного числа.
- source_word: לֶחֶם
  choice: пища
  rationale: Буквально слово означает «хлеб», но здесь обозначает еду вообще, что подтверждается ближайшим контекстом с мёдом.
- source_word: וַיָּעַף הָעָם
  choice: И народ изнемог
  rationale: Глагол обозначает состояние крайней усталости или слабости; «изнемог» кратко сохраняет возможную связь как с усталостью, так и с голодом.
