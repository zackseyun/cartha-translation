  source_fidelity: 'Основной смысл передан верно: неопределённый представитель народа обращается к Ионафану, сообщает об усиленно выраженном обязательстве, наложенном его отцом на народ, приводит формулу проклятия и отмечает изнеможение народа. Однако «связал народ строгой клятвой» менее естественно и несколько размывает каузативный смысл הִשְׁבִּיעַ — «взял с народа клятву / заставил поклясться». «Вкусит пищу» может сузить обычное אכל до пробования; в данном контексте речь о принятии пищи вообще.'
