base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/019.yaml
  text: And it happened[a], while Saul was speaking to the priest, that the tumult in the camp of the Philistines kept increasing more and more. So Saul said to the priest, “Withdraw your hand.”
translation:
  language: ru
  text: 'Пока Саул говорил со священником, смятение в стане филистимлян всё усиливалось. Тогда Саул сказал священнику: «Отведи руку»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «собери свою руку», то есть прекрати действие, которое совершаешь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Пока
  rationale: В сочетании с עַד דִּבֶּר вводная повествовательная форма естественно передаётся придаточным одновременности; отдельное «и было» в современном русском здесь было бы тяжеловесным.
- source_word: עַד דִּבֶּר
  choice: пока Саул говорил
  rationale: Конструкция описывает продолжающееся действие, на фоне которого смятение нарастает и следует распоряжение Саула.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное значение כֹּהֵן; определённость понятна из предшествующего контекста и по-русски не требует отдельного выражения.
- source_word: הֶהָמוֹן
  choice: смятение
  rationale: Слово обозначает шумное, беспорядочное движение в стане, а не только громкий звук; «смятение» передаёт и беспорядок, и тревожный гул.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: в стане филистимлян
  rationale: Точная и естественная для библейского повествования передача сочетания со значением военного лагеря.
- source_word: וַיֵּלֶךְ הָלוֹךְ וָרָב
  choice: всё усиливалось
  rationale: Сочетание личной формы с абсолютным инфинитивом выражает непрерывное нарастание; русское «всё усиливалось» кратко и естественно сохраняет прогрессивный смысл.
- source_word: אֱסֹף יָדֶךָ
  choice: Убери руку
  rationale: Буквально выражение связано с собиранием или отведением руки и в контексте приказывает священнику прекратить совершаемое действие; конкретный образ сохранён без замены общим «остановись».
theological_decisions:
- issue: Какое именно священнодействие должен был прекратить священник
  choice: Не уточнять действие в основном тексте
  alternative: Назвать обращение к ковчегу, ефоду или использование урима и туммима
  rationale: Сам стих говорит лишь об отведении руки и не называет конкретного ритуального действия; уточнение разрешило бы текстовую и контекстуальную неопределённость без достаточного основания.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским словом «стан». Синтаксис сделан плавным и повествовательным; образ руки сохранён, а подразумеваемое ритуальное действие намеренно не конкретизировано.
