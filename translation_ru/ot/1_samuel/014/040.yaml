base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/040.yaml
  text: Then he said to all Israel[a], “You be on one side, and I and Jonathan my son will be on the other side.” And the people said to Saul, “Do what seems good in your eyes.”
translation:
  language: ru
  text: 'Тогда он сказал всему Израилю: «Вы будьте с одной стороны[a], а я и мой сын Ионафан будем с другой». Народ сказал Саулу: «Делай то, что хорошо в твоих глазах».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будьте к одной стороне … будем к одной стороне». В обоих случаях в еврейском тексте употреблена та же формула; вторая группа противопоставлена первой, поэтому по-русски: «с другой стороны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵבֶר אֶחָד
  choice: по одну сторону / по другую сторону
  rationale: Слово עֵבֶר обозначает сторону или область по ту сторону; в контексте бросания жребия выражение противопоставляет две группы. Русское «по одну сторону… по другую сторону» естественно передаёт пространственный образ, не уточняя сверх текста характер разделения.
- source_word: תִּהְיוּ / נִהְיֶה
  choice: будьте / будем
  rationale: Формы глагола היה буквально означают «быть». В сочетании с «по одну сторону» русская конструкция остаётся понятной и сохраняет буквальную сбалансированность двух частей, не добавляя значения «стоять».
- source_word: כָּל יִשְׂרָאֵל
  choice: всему Израилю
  rationale: Стандартное собирательное обозначение народа; дательный падеж обусловлен глаголом «сказал».
- source_word: בְּנִי
  choice: мой сын
  rationale: Прямое обозначение родства сохранено явно.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: то, что хорошо в твоих глазах
  rationale: Сохранён образный древнееврейский оборот, выражающий то, что человек считает хорошим или правильным; он понятен в современном литературном русском и не сводится к более толковательному «как считаешь нужным».
- source_word: עֲשֵׂה
  choice: делай
  rationale: Простой императив, естественно связанный с предшествующим объектным оборотом.
- source_word: וַיֹּאמֶר / וַיֹּאמְרוּ
  choice: Тогда он сказал / Народ сказал
  rationale: Последовательность повествования передана естественными русскими связками; во второй реплике явное подлежащее «народ» сохраняет источник.
