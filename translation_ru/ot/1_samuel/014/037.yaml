base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/037.yaml
  text: Then Saul inquired of God[a], “Should I go down after the Philistines? Will you give them into the hand of Israel?” But he did not answer him that day.
translation:
  language: ru
  text: 'И Саул вопросил Бога: «Спускаться ли мне вслед за филистимлянами? Предашь ли ты их в руки Израиля?» Но в тот день Бог не ответил ему.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל שָׁאוּל בֵּאלֹהִים
  choice: И Саул вопросил Бога
  rationale: Сочетание שׁאל с ב обозначает обращение к Богу за указанием или ответом. «Вопросил Бога» передаёт целенаправленное испрашивание Божьей воли и сохраняет сжатость оригинала.
- source_word: הַאֵרֵד
  choice: Спускаться ли мне
  rationale: Вопросительная частица и форма первого лица выражают просьбу об указании; глагол ירד сохраняет конкретное значение движения вниз.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: вслед за филистимлянами
  rationale: Буквальное пространственное значение אַחֲרֵי сохранено, а военный контекст естественно передаёт смысл преследования без поясняющего расширения.
- source_word: הֲתִתְּנֵם בְּיַד יִשְׂרָאֵל
  choice: Предашь ли ты их в руки Израиля
  rationale: В военном контексте נתן с выражением «в руку» означает отдать противника во власть победителя. «Предашь» естественно передаёт этот смысл, а образ рук сохраняет древнееврейскую идиому.
- source_word: וְלֹא עָנָהוּ בַּיּוֹם הַהוּא
  choice: Но в тот день он ему не ответил
  rationale: Союз передан как противительный по смыслу. Местоименная конструкция сохраняет краткость оригинала и не заменяет подразумеваемое подлежащее явным словом «Бог».
theological_decisions:
- issue: Подразумеваемое подлежащее при «не ответил»
  choice: Сохранено местоимение «он» без явного повторения слова «Бог».
  alternative: «Но в тот день Бог ему не ответил».
  rationale: Из ближайшего контекста ясно, что речь идёт о Боге, однако в древнееврейском тексте подлежащее не названо повторно. Местоимение сохраняет эту особенность и не делает текст более определённым, чем оригинал.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «вопросил Бога». Местоимения, относящиеся к Богу, даны со строчной буквы, чтобы не вносить отсутствующую в оригинале графическую интерпретацию и сохранить местоименную связность текста.
