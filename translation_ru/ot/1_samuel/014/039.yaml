source:
  edition: WLC
  text: כִּ֣י חַי יְהוָ֗ה הַ/מּוֹשִׁ֨יעַ֙ אֶת יִשְׂרָאֵ֔ל כִּ֧י אִם יֶשְׁנ֛/וֹ בְּ/יוֹנָתָ֥ן בְּנִ֖/י כִּ֣י מ֣וֹת יָמ֑וּת וְ/אֵ֥ין עֹנֵ֖/הוּ מִ/כָּל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/039.yaml
  text: For as Yahweh lives[a], who saves Israel, even if it is in Jonathan my son, he shall surely die.” But not one of all the people answered him.
translation:
  language: ru
  text: 'Ибо жив Яхве, спасающий Израиль: даже если это окажется в Ионафане, сыне моём[a], он непременно умрёт». Но никто из всего народа не ответил ему.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если это есть в Ионафане, сыне моём». Предмет в еврейском тексте не назван; по контексту подразумевается разыскиваемая вина или нарушение.'
    reason: Сохранение эллиптичности и пояснение подразумеваемого предмета.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: жив Яхве
  rationale: Сохранена торжественная древнееврейская формула клятвы; в русском библейском стиле она звучит естественно и узнаваемо.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией тетраграмматона.
- source_word: הַמּוֹשִׁיעַ אֶת יִשְׂרָאֵל
  choice: спасающий Израиль
  rationale: Причастие с артиклем характеризует Яхве как Того, кто спасает Израиль; настоящее причастие сохраняет длительный, характерный смысл формы.
- source_word: כִּי אִם
  choice: даже если
  rationale: В контексте клятвы оборот вводит крайний предполагаемый случай.
- source_word: יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי
  choice: это окажется в Ионафане, сыне моём
  rationale: Местоимение «это» сохраняет эллиптичность еврейского текста, не называющего прямо подразумеваемую вину или проступок; глагол «окажется» делает фразу понятнее по-русски.
- source_word: מוֹת יָמוּת
  choice: он непременно умрёт
  rationale: Сочетание абсолютного инфинитива с личной формой глагола выражает усиленную неизбежность; «непременно» передаёт это усиление.
- source_word: וְאֵין עֹנֵהוּ מִכָּל הָעָם
  choice: Но никто из всего народа не ответил ему
  rationale: 'Передан партитивный смысл: ни один человек из всего народа не ответил; союз «но» естественно выражает контраст между заявлением Саула и молчанием народа.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация «Яхве» прямо передаёт личное Божье имя и не заменяет его титулом.
- issue: Неявный предмет в выражении יֶשְׁנוֹ בְּיוֹנָתָן
  choice: сохранить неопределённость словом «это»
  alternative: вина окажется на Ионафане; проступок будет найден у Ионафана
  rationale: Контекст указывает на разыскиваемую вину или нарушение, однако в самом еврейском предложении предмет не назван; перевод не должен устранять эту эллиптичность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формула клятвы сохранена, а синтаксис слегка упорядочен для ясности. Кавычка закрывает прямую речь, начатую в предшествующем контексте.
