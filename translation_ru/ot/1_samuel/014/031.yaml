  yaml_path: translation/ot/1_samuel/014/031.yaml
  text: That day they struck down the Philistines from Mikmash to Aijalon[a], and the people were very weary.
translation:
  language: ru
  text: В тот день они поразили филистимлян от Михмаса до Аиалона, и народ сильно устал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: они поражали
  rationale: Глагол נכה в повествовательной форме обозначает нанесение ударов противнику. Несовершенный вид по-русски естественно передаёт продолжительное сражение на указанном пути, не добавляя идеи полного разгрома.
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Прямой и естественный эквивалент еврейского обстоятельства времени.
- source_word: בַּפְּלִשְׁתִּים
  choice: филистимлян
  rationale: Предлог ב при глаголе удара отмечает тех, против кого направлено действие; в русском языке это естественно выражается винительным падежом без предлога.
- source_word: מִמִּכְמָשׂ אַיָּלֹנָה
  choice: от Михмаса до Аиалона
  rationale: Предлог מִן обозначает исходную точку, а направительный суффикс -ה при אַיָּלוֹן — движение к конечной точке. Формулировка сохраняет географический диапазон.
- source_word: וַיָּעַף
  choice: утомился
  rationale: Глагол выражает сильную усталость или изнеможение; вместе с מְאֹד перевод «очень утомился» сохраняет значение без усиления до более категоричного «обессилел».
- source_word: הָעָם
  choice: народ
  rationale: Собирательное существительное в единственном числе; русский эквивалент также допускает согласование в единственном числе.
- source_word: מְאֹד
  choice: очень
  rationale: Обычный русский усилитель точно передаёт еврейское наречие степени.
