lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: омывали
  rationale: Форма Qal wayyiqtol обозначает действие в повествовательной последовательности. Русское прошедшее время передаёт его естественно; несовершенный вид «омывали» уместен для ритуального омовения и согласуется с последующим описанием обстоятельств повторяющегося действия.
- source_word: מִמֶּנּוּ
  choice: Из него
  rationale: 'Предлог מן с местоименным суффиксом буквально указывает на источник: «из него», то есть из умывальника. Вариант «водой из него» яснее, но добавляет подразумеваемое слово.'
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма личного имени.
- source_word: וְאַהֲרֹן
  choice: Аарон
  rationale: Устоявшаяся русская форма личного имени; союз передан перечислительной конструкцией.
- source_word: וּבָנָיו
  choice: и его сыновья
  rationale: В священническом контексте בנים означает сыновей Аарона. Местоимение единственного числа сохранено и естественно относится к ближайшему названному лицу — Аарону.
- source_word: אֶת יְדֵיהֶם
  choice: руки
  rationale: Прямое дополнение с местоименным суффиксом; принадлежность уже понятна из подлежащего, поэтому русское «свои» или «их» необязательно и утяжелило бы фразу.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: и ноги
  rationale: Сохранена парная конструкция «руки и ноги»; принадлежность естественно определяется общим подлежащим.
