  text: וּ/מָשַׁחְתָּ֣ אֹתָ֗/ם כַּ/אֲשֶׁ֤ר מָשַׁ֨חְתָּ֙ אֶת אֲבִי/הֶ֔ם וְ/כִהֲנ֖וּ לִ֑/י וְ֠/הָיְתָה לִ/הְיֹ֨ת לָ/הֶ֧ם מָשְׁחָתָ֛/ם לִ/כְהֻנַּ֥ת עוֹלָ֖ם לְ/דֹרֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/015.yaml
  text: You shall anoint them just as you anointed their father[a], so that they may serve as priests to me. And their anointing shall be for them an everlasting priesthood throughout their generations.
translation:
  language: ru
  text: И помажь их, как ты помазал их отца, чтобы они служили Мне священниками. Их помазание посвятит их в вечное[a] священство из рода в род.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непрестанное священство». Еврейское слово может обозначать непрерывную преемственность из поколения в поколение в рамках завета.'
    reason: Лексическая альтернатива для עוֹלָם; примечание сохраняет временную неоднозначность исходного выражения.
lexical_decisions:
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: И помажь их
  rationale: Перфект с союзом в последовательности предписаний передаёт повеление; русский совершенный императив естественно выражает разовое обрядовое действие.
- source_word: כַּאֲשֶׁר מָשַׁחְתָּ אֶת אֲבִיהֶם
  choice: как ты помазал их отца
  rationale: Сохраняется прямое сопоставление с ранее совершённым помазанием Аарона; местоимение «их» устраняет возможную неясность в современном русском.
- source_word: וְכִהֲנוּ לִי
  choice: чтобы они служили Мне священниками
  rationale: Глагол כהן обозначает исполнение священнического служения. Целевой оборот естественно передаёт связь помазания с последующим служением Богу.
- source_word: מָשְׁחָתָם
  choice: Их помазание
  rationale: Существительное здесь обозначает помазание или посвящение посредством помазания; указания именно на масло в данной форме нет.
- source_word: וְהָיְתָה לִהְיוֹת לָהֶם ... לִכְהֻנַּת עוֹלָם
  choice: Их помазание даст им вечное священство
  rationale: Необычная связочная конструкция передаёт возникающий и сохраняющийся статус. «Даст им» выражает этот результат естественно, не добавляя нового действующего лица.
- source_word: לְדֹרֹתָם
  choice: во все их поколения
  rationale: Оборот обозначает преемственность священства в последовательных поколениях потомков Аарона.
theological_decisions:
- issue: Продолжительность священства, выраженная словом עוֹלָם
  choice: вечное священство
  alternative: непрестанное (или постоянное) священство
  rationale: עוֹלָם в заветно-правовом контексте обозначает длительную, не прерывающуюся в пределах поколений установившуюся реальность и не обязательно формулирует отвлечённое утверждение о метафизической бесконечности. Основной вариант сохраняет сильное и традиционное значение, а примечание отмечает допустимый смысловой оттенок.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для богослужебно-правового контекста. Синтаксис разделён на два предложения ради ясности. Заглавная буква в «Мне» следует принятой русской библейской норме при обращении к Богу.
