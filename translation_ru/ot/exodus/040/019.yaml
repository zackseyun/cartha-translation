  yaml_path: translation/ot/exodus/040/019.yaml
  text: Then he spread the tent over the tabernacle and put the covering of the tent over it from above, just as Yahweh had commanded Moses.
translation:
  language: ru
  text: Затем он раскинул шатёр над скинией и сверху на него положил покрытие шатра — точно так, как Яхве повелел Моисею.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: раскинул
  rationale: Глагол פרשׂ обозначает развёртывание или простирание материала; «раскинул» естественно передаёт действие и не привносит более конкретного значения «установил».
- source_word: הָאֹהֶל
  choice: шатёр
  rationale: אֹהֶל обычно означает «шатёр»; здесь это слой шатра над скинией. Перевод сохраняет его отличие от последующего מִכְסֶה, «покрытие».
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: В контексте Исхода «скиния» — устоявшееся и точное обозначение священного жилища; оно также позволяет сохранить различие между מִשְׁכָּן и אֹהֶל.
- source_word: וַיָּשֶׂם
  choice: положил
  rationale: Обычное значение שׂים — «класть, помещать»; «положил» естественно описывает размещение верхнего покрытия.
- source_word: מִכְסֵה הָאֹהֶל
  choice: покрытие шатра
  rationale: Конструкция буквально обозначает покрытие шатра и сохраняет лексическое различие между самим шатром и его внешним покрытием.
- source_word: עָלָיו מִלְמָעְלָה
  choice: сверху
  rationale: Русское «сверху» естественно и без избыточного повтора передаёт совокупный пространственный смысл «над ним, сверху».
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: точно так, как Яхве повелел Моисею
  rationale: «Точно так, как» подчёркивает соответствие указанию, выраженное כַּאֲשֶׁר; «повелел» соответствует торжественному контексту повторяющейся формулы послушания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве» сохраняет различие между Божьим именем и титулом «Господь».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога, а не титул. «Яхве» передаёт наиболее распространённую научную реконструкцию произношения, не заменяя имя титулом.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Термины «шатёр», «скиния» и «покрытие» намеренно разведены, чтобы сохранить различия исходного текста. Тире помогает естественно присоединить повторяющуюся формулу точного исполнения повеления.
