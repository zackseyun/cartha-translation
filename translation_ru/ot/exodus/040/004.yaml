lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: внеси
  rationale: Каузативная форма глагола בוא в указаниях об устройстве скинии обозначает внесение предметов внутрь святилища; русский глагол «внести» естественно и точно передаёт это движение.
- source_word: הַשֻּׁלְחָן
  choice: стол
  rationale: В еврейском тексте употреблено простое существительное «стол»; его культовое назначение известно из контекста, но прямо здесь не названо.
- source_word: וְעָרַכְתָּ אֶת עֶרְכּוֹ
  choice: разложи на нём всё положенное
  rationale: Однокоренная конструкция буквально говорит об упорядочивании установленного содержимого стола. Буквальное «расположи его расположение» по-русски неприемлемо, а выбранная формулировка передаёт предписанную выкладку предметов, не уточняя их сверх текста.
- source_word: הַמְּנֹרָה
  choice: светильник
  rationale: Слово обозначает храмовый светильник на подставке. «Светильник» понятно современному русскому читателю и не требует заимствования «менора».
- source_word: וְהַעֲלֵיתָ
  choice: зажги
  rationale: Каузатив глагола עלה буквально означает «заставить подняться»; в сочетании с лампами он естественно относится к поднятию пламени, то есть к зажиганию. Возможный установочный смысл сохранён в сноске.
- source_word: נֵרֹתֶיהָ
  choice: его лампы
  rationale: נֵר обозначает отдельную лампу или её огонь; здесь множественное число относится к лампам светильника.
