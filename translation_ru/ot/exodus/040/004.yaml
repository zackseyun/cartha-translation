review_pass:
  verdict: revise
  source_fidelity: «Внеси» точно передаёт каузативное «введи/внеси», а «стол» и «светильник» соответствуют простым существительным еврейского текста. В данном устойчивом сочетании הֶעֱלָה + «лампы» глагол означает зажечь лампы (буквально — дать пламени подняться); это подтверждается употреблением той же формулы в Исх. 40:25. Поэтому основной перевод «зажги» верен, но сноска, представляющая «установи лампы» как равнозначную альтернативу, недостаточно обоснована.
  naturalness: Текст звучит естественно на современном литературном русском. «Разложи на нём всё положенное» понятно, хотя «всё, что должно быть на нём» несколько яснее передаёт подразумеваемое предписанное расположение без оттенка разговорного «положенное».
  terminology: «Светильник» — удачный перевод מְנוֹרָה; «лампы» корректно передаёт נֵרוֹתֶיהָ. Конфессионально нагруженных терминов не вводится.
  issues:
  - severity: medium
    issue: Сноска даёт «установи его лампы» как лексическую альтернативу к «зажги».
    rationale: В конструкции «поднять лампы» речь обычно идёт о зажигании, то есть о подъёме пламени, а не об установке самих ламп. В этом контексте тот же оборот в Исх. 40:25 описывает зажигание ламп. Сноску следует удалить, чтобы не создавать ложной неоднозначности.
  - severity: low
    issue: «Всё положенное» слегка менее прозрачно, чем явное указание на содержимое стола.
    rationale: Однокоренная еврейская конструкция обозначает предписанное размещение/содержимое стола. Формулировка «всё, что должно быть на нём» сохраняет обобщённость оригинала и яснее в современном русском.
  revised_text: Внеси стол и разложи на нём всё, что должно быть на нём; внеси светильник и зажги его лампы.
