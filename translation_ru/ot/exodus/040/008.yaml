  text: And you shall set up the courtyard all around[a], and put up the screen for the gate of the courtyard.
translation:
  language: ru
  text: Устрой вокруг двор и повесь завесу[a] у входа во двор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «занавес»; еврейское слово מָסָךְ обозначает полотнище, закрывавшее вход во двор.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Устрой
  rationale: Глагол שׂים имеет широкое значение «поместить, поставить». В контексте сооружения скинии «устрой» естественно передаёт установку двора как целого, не сводя действие к одному отдельному предмету.
- source_word: הֶחָצֵר
  choice: двор
  rationale: חָצֵר обозначает открытое ограждённое пространство вокруг скинии; «двор» — ясный и традиционно понятный русский эквивалент.
- source_word: סָבִיב
  choice: вокруг
  rationale: Наречие означает расположение по окружности. В еврейском тексте объект, вокруг которого устраивается двор, здесь не назван явно, поэтому перевод также не добавляет «скинии».
- source_word: וְנָתַתָּ
  choice: и повесь
  rationale: Хотя נתן буквально имеет широкое значение «дать, поместить», при завесе у входа естественное русское «повесь» точно передаёт требуемое действие в данном контексте.
- source_word: מָסַךְ
  choice: завесу
  rationale: מָסָךְ здесь обозначает тканевое полотнище, закрывавшее вход. «Завеса» сохраняет конкретный культовый смысл и звучит достойно и понятно.
- source_word: שַׁעַר הֶחָצֵר
  choice: у входа во двор
  rationale: Буквально сочетание означает «ворота двора», но речь идёт об открытом проходе с тканевой завесой, а не о жёстких воротах; «у входа во двор» ясно передаёт пространственное отношение.
