  yaml_path: translation/ot/exodus/040/035.yaml
  text: And Moses was not able to enter the tent of meeting[a], because the cloud settled on it, and the glory of Yahweh filled the tabernacle.
translation:
  language: ru
  text: И Моисей не мог войти в шатёр встречи, потому что облако покоилось[a] над ним и слава Яхве наполнила скинию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пребывало». Еврейский глагол может обозначать поселение или пребывание; здесь он описывает облако, покоящееся над шатром.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכֹל
  choice: И Моисей не мог
  rationale: Последовательный союз ו передан как «и», без добавления не выраженного в тексте противопоставления; יָכֹל с отрицанием естественно передаётся как «не мог».
- source_word: לָבוֹא אֶל
  choice: войти в
  rationale: В контексте входа внутрь сооружения это точная и естественная русская передача.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Передаёт значение обоих существительных и сохраняет различие между אֹהֶל מוֹעֵד и названной далее מִשְׁכָּן — скинией.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой Моисей не мог войти.
- source_word: שָׁכַן עָלָיו
  choice: на нём покоилось
  rationale: Глагол обозначает пребывание или водворение на месте; применительно к облаку «покоилось» естественно передаёт образ облака, остающегося над шатром, и не устраняет оттенок продолжительного пребывания.
- source_word: הֶעָנָן
  choice: облако
  rationale: Определённость понятна из контекста повествования; по нормам русского языка отдельный определённый артикль не передаётся.
- source_word: כְבוֹד יְהוָה
  choice: слава Яхве
  rationale: Конструкция принадлежности передана обычным русским родительным оборотом; כָּבוֹד сохранено как богословски весомое «слава», а личное имя יהוה — как «Яхве».
- source_word: מָלֵא
  choice: наполняла
  rationale: Имперфективная форма по-русски естественно описывает состояние, служившее причиной невозможности войти, при этом сохраняет прямое значение «быть полной, наполнять».
- source_word: הַמִּשְׁכָּן
  choice: скинию
  rationale: «Скиния» — укоренившееся и точное русское обозначение переносного святилища в Исходе; оно также сохраняет различие с «шатром встречи».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה, а не титул. Транслитерация «Яхве» сохраняет имя и не заменяет его титулом.
- issue: Оттенок שָׁכַן и тема божественного обитания
  choice: покоилось
  alternative: пребывало; обитало; опустилось
  rationale: «Покоилось» сохраняет конкретный образ облака, остановившегося над шатром, не сводя значение только к движению вниз и не навязывая отвлечённой богословской терминологии. Возможный оттенок пребывания отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-торжественным звучанием. «Шатёр встречи» и «скиния» намеренно различены в соответствии с двумя еврейскими обозначениями; архаические синтаксические обороты не используются.
