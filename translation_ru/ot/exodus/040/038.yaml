base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/038.yaml
  text: For the cloud of Yahweh was over the tabernacle by day[a], and fire was in it by night[b], before the eyes of all the house of Israel throughout all their journeys.
translation:
  language: ru
  text: Ибо днём облако Яхве было над скинией, а ночью там был огонь[a] — на глазах у всего дома Израиля во время всех их переходов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Там» может относиться к облаку или к скинии.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит итоговое пояснение к предшествующему рассказу; «ибо» сохраняет эту связь и соответствует возвышенному повествовательному регистру.
- source_word: עֲנַן יְהוָה
  choice: облако Яхве
  rationale: Передаёт конструкцию принадлежности без добавочного истолкования облака как самого божественного присутствия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя в исходном тексте передано транслитерацией, а не заменено титулом «Господь».
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: Устоявшееся русское обозначение переносного святилища в книге Исход; понятно в библейском контексте и сохраняет терминологическую преемственность.
- source_word: יוֹמָם ... לַיְלָה
  choice: днём ... ночью
  rationale: Естественная русская пара временных наречий точно воспроизводит противопоставление.
- source_word: וְאֵשׁ תִּהְיֶה לַיְלָה בּוֹ
  choice: а ночью в нём был огонь
  rationale: Прошедшее время естественно для итогового описания; местоименный суффикс передан буквально, а неоднозначность его референта отмечена в сноске.
- source_word: לְעֵינֵי
  choice: перед глазами
  rationale: Сохраняет конкретный древнееврейский образ и при этом звучит естественно по-русски.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: всего дома Израиля
  rationale: Сохраняет корпоративное выражение «дом Израиля», не сводя его просто к «всему Израилю».
- source_word: בְּכָל מַסְעֵיהֶם
  choice: на всех их переходах
  rationale: מַסָּע обозначает переход или этап пути; выбранная формулировка уместна для последовательных стоянок и передвижений Израиля.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное имя Бога; транслитерация сохраняет его отличие от титула אֲדֹנָי.
- issue: К чему относится местоимение בּוֹ («в нём»)
  choice: Сохранить местоименную неоднозначность в тексте
  alternative: 'Уточнить: «в облаке» или «в скинии»'
  rationale: И «облако», и «скиния» в древнееврейском имеют мужской род и могут быть грамматическим референтом; контекст не требует молча устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Сохранены термины «скиния» и «дом Израиля», но синтаксис сделан ясным и естественным.
