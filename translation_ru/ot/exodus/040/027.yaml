lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: воскурил
  rationale: Глагол в породе хифиль здесь обозначает сжигание благовония на жертвеннике с вознесением дыма; «воскурил» естественно передаёт культовое действие по-русски.
- source_word: עָלָיו
  choice: на нём
  rationale: Местоименная форма мужского рода относится к упомянутому в контексте жертвеннику для курения.
- source_word: קְטֹרֶת סַמִּים
  choice: благовонное курение
  rationale: Сочетание обозначает курение, приготовленное из ароматических веществ. Этот вариант точен, достоин по стилю и не перегружен пояснением.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Союз вводит соответствие ранее данному повелению; русское «как» ясно и естественно выражает это отношение.
- source_word: צִוָּה
  choice: повелел
  rationale: Совершенный вид передаёт предшествующее Божье повеление без необходимости явно маркировать давнопрошедшее время, которого нет в современном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: מֹשֶׁה
  choice: Моисею
  rationale: Традиционная и общеупотребительная русская форма имени в дательном падеже после глагола «повелел».
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יהוה. «Яхве» сохраняет его как имя и не подменяет титулом, при этом соответствует современной научной транслитерации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной культовой лексикой. «Воскурил» и «курение» уместны в контексте святилища и понятны без архаизации синтаксиса.
