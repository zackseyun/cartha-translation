base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/020.yaml
  text: Then he took the testimony and put it into the ark[a], and he set the poles on the ark[b], and he placed the mercy seat on the ark above.
translation:
  language: ru
  text: Затем он взял свидетельство[a], положил его в ковчег, установил на ковчеге шесты и положил крышку искупления[b] поверх ковчега.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скрижали свидетельства». Еврейское «свидетельство» — особое наименование того, что было положено в ковчег.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «очистительную крышку»; традиционно: «очистилище».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדֻת
  choice: свидетельство
  rationale: Сохранён установленный культовый термин исходного текста. В данном контексте он обозначает конкретный предмет, помещённый в ковчег, вероятнее всего каменные скрижали, но сам еврейский текст прямо их не называет.
- source_word: הָאָרֹן
  choice: ковчег
  rationale: В контексте скинии אָרוֹן обозначает священный ковчег. Уточнение «завета» не добавлено, поскольку в этом стихе его нет.
- source_word: הַבַּדִּים
  choice: шесты
  rationale: Современное и ясное обозначение шестов, предназначенных для переноски ковчега.
- source_word: הַכַּפֹּרֶת
  choice: крышка искупления
  rationale: Передаёт как предметную функцию золотой крышки ковчега, так и её культовое значение, связанное с искуплением; при этом избегает архаичного и для многих неясного слова «очистилище».
- source_word: מִלְמָעְלָה
  choice: сверху
  rationale: Наречие указывает, что крышка была помещена на верхнюю сторону ковчега; «сверху» естественно передаёт пространственное значение без добавления отдельного объекта.
- source_word: וַיִּתֵּן ... אֶל
  choice: положил ... в
  rationale: В данном физическом контексте сочетание означает помещение предмета внутрь ковчега.
- source_word: וַיָּשֶׂם ... עַל
  choice: установил ... на
  rationale: Глагол описывает размещение шестов в предназначенном для них положении у ковчега; «установил» звучит естественно и не предполагает, что их просто положили сверху.
theological_decisions:
- issue: Что обозначает «свидетельство»
  choice: Сохранить культовое наименование «свидетельство», подразумевающее конкретный предмет внутри ковчега.
  alternative: Прямо назвать его «скрижалями свидетельства» или «скрижалями завета».
  rationale: Физическое действие указывает на конкретный предмет, вероятнее всего скрижали, однако еврейский текст употребляет технический термин עֵדוּת и не уточняет референт. Перевод сохраняет эту смысловую напряжённость.
- issue: Передача термина כַּפֹּרֶת
  choice: крышка искупления
  alternative: крышка; очистительная крышка; место умилостивления
  rationale: Термин называет особую крышку ковчега и одновременно несёт культовый смысл, связанный с искуплением. Выбранный вариант не сводит предмет к обычной крышке и не вводит узкоконфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Сохранены краткость и последовательность еврейских действий; архаизмы избегаются, а культовые термины поясняются в сносках.
