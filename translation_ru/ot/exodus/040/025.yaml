  text: And he set up the lamps before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: ru
  text: И он зажёг светильники[a] пред Яхве, как Яхве повелел Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднял светильники». Это выражение может означать установить или зажечь светильники; здесь, в контексте, вероятнее всего имеется в виду зажечь их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: зажёг
  rationale: 'Форма породы hифиль от עלה буквально означает «велел подняться / поднял». В сочетании со светильниками это культовое выражение обозначает приведение их в действие — зажигание, при котором поднимается пламя. Контекст подтверждает это: светильник уже был поставлен в предыдущем стихе (Исх. 40:24). Необычная образность исходного выражения отмечена в сноске.'
- source_word: הַנֵּרֹת
  choice: светильники
  rationale: נֵרֹת обозначает отдельные лампы светильника, а не отвлечённый свет. «Светильники» сохраняет конкретность и соответствует принятой русской библейской лексике.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי — пространственно-культовое выражение «перед, в присутствии». «Пред Яхве» естественно для торжественного повествования и сохраняет культовый оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом, что прямо отражает еврейский текст.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Союз указывает, что действие совершено в точном соответствии с данным ранее повелением; в русском контексте простое «как» передаёт это ясно и естественно.
- source_word: צִוָּה
  choice: повелел
  rationale: Перфект обозначает предшествующее повеление. Русский вид и контекст естественно выражают эту временную последовательность без громоздкой конструкции.
- source_word: אֶת מֹשֶׁה
  choice: Моисею
  rationale: Хотя אֶת обычно маркирует прямое дополнение, русское управление глагола «повелеть» требует дательного падежа; смысл — Моисей как адресат повеления.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте дважды стоит тетраграмматон как личное имя Бога. Транслитерация «Яхве» сохраняет отличие имени от титула и не вносит конфессиональной замены.
- issue: Характер действия со светильниками
  choice: зажёг светильники
  alternative: установил / поднял светильники
  rationale: Контекст после установки самого светильника в стихе 24 и обычное культовое употребление выражения указывают на зажигание. Однако буквальная форма допускает более широкое представление о «поднятии» светильников или огня, поэтому лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным культовым оттенком. «Пред Яхве» выбрано вместо разговорного «перед Яхве», а синтаксис оставлен простым и ясным. Местоимение «он» сохраняет связность с предыдущим повествованием, где действующим лицом является Моисей.
