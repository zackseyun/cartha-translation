  text: But if the cloud did not rise[a], they did not set out until the day it rose.
translation:
  language: ru
  text: Если же облако не поднималось, они не отправлялись в путь до дня его поднятия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до того дня, когда оно поднялось».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Сочетание условной частицы с союзом вводит условие, противопоставленное предыдущему стиху; «если же» естественно передаёт этот переход по-русски.
- source_word: יֵעָלֶה
  choice: поднималось
  rationale: Глагол עלה означает «подниматься, восходить». В данном контексте речь идёт об облаке, поднимающемся над скинией; возвратная форма не вводит отсутствующего в еврейском тексте действующего лица.
- source_word: הֶעָנָן
  choice: облако
  rationale: Определённое существительное указывает на уже упомянутое облако Божьего присутствия.
- source_word: יִסְעוּ
  choice: отправлялись в путь
  rationale: В контексте передвижения стана נסע обозначает выступление с места; этот оборот естественен в современном русском и точнее, чем общее «путешествовали».
- source_word: עַד יוֹם
  choice: до того дня
  rationale: Сохраняется явно выраженное в еврейском тексте слово «день», а указательное «того» делает временную конструкцию естественной по-русски.
- source_word: הֵעָלֹתוֹ
  choice: когда оно поднималось
  rationale: Инфинитивная конструкция с местоименным суффиксом буквально означает «его поднятия». Финитная придаточная конструкция яснее по-русски; местоимение относится к облаку.
