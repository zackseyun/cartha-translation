  text: בְּ/בֹאָ֞/ם אֶל אֹ֣הֶל מוֹעֵ֗ד וּ/בְ/קָרְבָתָ֛/ם אֶל הַ/מִּזְבֵּ֖חַ יִרְחָ֑צוּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/032.yaml
  text: Whenever they entered the tent of meeting, and whenever they approached the altar, they washed, just as Yahweh had commanded Moses.
translation:
  language: ru
  text: Всякий раз, когда они входили в шатёр встречи и когда приближались к жертвеннику, они омывались, как повелел Яхве Моисею.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹאָם
  choice: всякий раз, когда они входили
  rationale: Сочетание ב с инфинитивом и суффиксом 3-го лица множественного числа обозначает временное обстоятельство. «Всякий раз» естественно передаёт повторяющееся священническое действие в данном контексте.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Устойчивое и понятное обозначение святилища, где Яхве встречается с Израилем; сохраняет значение обоих компонентов еврейского выражения.
- source_word: וּבְקָרְבָתָם
  choice: и когда приближались
  rationale: Вторая конструкция с ב и инфинитивом также имеет временное значение. Глагол «приближались» естественно передаёт движение к жертвеннику.
- source_word: הַמִּזְבֵּחַ
  choice: жертвеннику
  rationale: Определённая форма передана конкретным, уже известным из контекста жертвенником; русское управление требует дательного падежа после «приближались к».
- source_word: יִרְחָצוּ
  choice: они омывались
  rationale: Имперфект в повествовательном контексте описывает обычное, повторявшееся действие. «Омывались» уместно для ритуального контекста и не добавляет отсутствующие в стихе части тела.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Кратко и естественно выражает соответствие ранее данному повелению.
- source_word: צִוָּה
  choice: повелел
  rationale: Глагол передаёт властное предписание; предшествование повеления ясно из смысла и не требует отдельной грамматической формы в русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя транслитерацией, а не заменяет его титулом.
- source_word: אֶת מֹשֶׁה
  choice: Моисею
  rationale: 'При еврейском צוה лицо, получающее повеление, отмечено как прямое дополнение, тогда как современный русский требует дательного падежа: «повелел Моисею».'
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон. «Яхве» сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Омывались» сохраняет культовый оттенок, оставаясь понятным; синтаксис подчёркивает повторяемость действия без добавления деталей из соседнего стиха.
