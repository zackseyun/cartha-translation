  text: So Moses set up the tabernacle[a], and placed its bases, and set its frames, and put in its bars[c][b], and raised up its pillars.
translation:
  language: ru
  text: 'И поставил Моисей скинию: установил её основания[a], поставил её брусья[b], вставил её перекладины и поднял её столбы[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гнёзда» — опорные детали, в которых закреплялись брусья скинии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «доски». Еврейское слово обозначает вертикальные деревянные элементы конструкции скинии.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «опоры».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: поставил / поднял
  rationale: В породе хифиль глагол קום означает «поставить, воздвигнуть, поднять». В начале стиха «поставил» естественно обозначает сооружение скинии в целом, а в конце «поднял» точно передаёт установку столбов.
- source_word: הַמִּשְׁכָּן
  choice: скинию
  rationale: מִשְׁכָּן буквально означает «жилище, обиталище», но в книге Исход это устойчивое название переносного святилища. «Скиния» сохраняет узнаваемый библейский термин.
- source_word: אֲדָנָיו
  choice: её основания
  rationale: אֶדֶן обозначает опорные элементы с гнёздами, в которых закреплялись рамы. «Основания» понятно передаёт их конструктивную функцию, не вводя излишне узкого технического толкования.
- source_word: קְרָשָׁיו
  choice: её рамы
  rationale: קֶרֶשׁ может означать доску или брус, однако здесь речь идёт о вертикальных элементах стен скинии. «Рамы» передаёт их роль в общей конструкции; буквальная альтернатива указана в сноске.
- source_word: בְּרִיחָיו
  choice: её перекладины
  rationale: בְּרִיחַ — горизонтальный брус или засов, скрепляющий вертикальные элементы. В данном строительном контексте «перекладины» ясно выражает назначение деталей.
- source_word: עַמּוּדָיו
  choice: её столбы
  rationale: עַמּוּד обозначает вертикальные опоры. «Столбы» — точное и естественное современное русское слово в описании шатровой конструкции.
- source_word: וַיִּתֵּן / וַיָּשֶׂם
  choice: установил / поставил / вставил
  rationale: Глаголы נתן и שׂים имеют широкие значения «положить, поместить, поставить». Русские варианты выбраны по сочетаемости с конкретными деталями и сохраняют последовательность сборки.
