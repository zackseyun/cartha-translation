  yaml_path: translation/ot/exodus/040/017.yaml
  text: And it happened in the first month of the second year[a], on the first day of the month[b], that the tabernacle was set up.
translation:
  language: ru
  text: И вот, в первый месяц второго года, в первый день месяца[a], скиния была установлена[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в один [день] месяца»; это древнееврейское выражение означает первый день месяца.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «была воздвигнута».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Краткая повествовательная формула сохраняет последовательность еврейского рассказа и звучит достойно, не прибегая к излишне архаичному «и случилось».
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: в первый месяц
  rationale: В данном календарном контексте חֹדֶשׁ означает «месяц», а сочетание с порядковым числительным прямо обозначает первый месяц.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: второго года
  rationale: Форма естественно включается в русскую датировочную конструкцию «в первый месяц второго года» и не уточняет отсчёт года сверх сказанного в контексте.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: в первый день месяца
  rationale: Буквально «в один [день] месяца» — обычная древнееврейская формула, обозначающая первое число месяца; явное добавление «день» делает смысл естественным и ясным по-русски.
- source_word: הוּקַם
  choice: была поставлена
  rationale: 'Хофал глагола קום выражает каузативно-пассивное действие: скинию установили, и она оказалась поставленной. Русское «была поставлена» точно и понятно передаёт сборку и установку святилища.'
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: «Скиния» — закрепившееся в русском библейском языке название переносного святилища; оно сохраняет культовую конкретность מִשְׁכָּן и остаётся узнаваемым современному читателю.
