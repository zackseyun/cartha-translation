  text: וְ/נָֽתַתָּ֙ אֶת הַ/כִּיֹּ֔ר בֵּֽין אֹ֥הֶל מוֹעֵ֖ד וּ/בֵ֣ין הַ/מִּזְבֵּ֑חַ וְ/נָתַתָּ֥ שָׁ֖ם מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/007.yaml
  text: And you shall place the basin between the tent of meeting and the altar[a], and you shall put water there.
translation:
  language: ru
  text: Поставь умывальник между шатром встречи и жертвенником[a] и налей туда воды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «алтарём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Поставь
  rationale: Форма с waw в последовательности повелений передаёт продолжение указания. В контексте размещения предмета «поставь» естественно и точно выражает пространственное значение נתן.
- source_word: הַכִּיֹּר
  choice: умывальник
  rationale: כִּיּוֹר обозначает сосуд для омовений при святилище. «Умывальник» — понятное современному читателю традиционное русское обозначение этого культового предмета; оно точнее по функции, чем общее «таз».
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: между шатром встречи и жертвенником
  rationale: Конструкция בֵּין...וּבֵין прямо обозначает положение между двумя объектами. «Шатёр встречи» прозрачно передаёт אֹהֶל מוֹעֵד без архаизации.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенником
  rationale: מִזְבֵּחַ имеет обычное значение «жертвенник»; стих не добавляет более узкого определения.
- source_word: וְנָתַתָּ שָׁם מָיִם
  choice: и налей туда воды
  rationale: 'Буквально: «и помести/дай там воду». По-русски применительно к сосуду естественно сказать «налей воды». «Туда» сохраняет שָׁם и отсылает к только что указанному месту и умывальнику, не добавляя отдельного местоименного объекта.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной, достойной формой прямого повеления. Синтаксис краток и следует последовательности еврейского текста. Выбрано «шатёр встречи», а не более традиционное «скиния собрания», чтобы непосредственно передать смысл исходного выражения; «умывальник» сохраняет узнаваемую культовую лексику. Маркер сноски поставлен после слова, к которому относится.
