  text: And you shall place there the ark of the testimony[b][a], and you shall screen the ark with the curtain.
translation:
  language: ru
  text: Поставь там ковчег свидетельства[a] и отгороди ковчег завесой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых традиционных переводах в сходных контекстах встречается: «ковчег завета». Однако здесь еврейский текст употребляет слово «свидетельство».'
    reason: alternative_reading
  - marker: b
    text: То есть внутренней завесой скинии, которая отгораживала ковчег; речь не о ткани, положенной поверх него.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Поставь
  rationale: Форма совершенного вида с союзом в последовательности предписаний передаёт повеление Моисею. Русский императив звучит естественно и точно.
- source_word: שָׁם
  choice: там
  rationale: Сохраняет указание на место, названное в предыдущем контексте, не добавляя уточнений, отсутствующих в еврейском тексте.
- source_word: אֲרוֹן הָעֵדוּת
  choice: ковчег свидетельства
  rationale: Буквально передаёт еврейское עֵדוּת — «свидетельство», не заменяя его более привычным в иных контекстах словом «завет».
- source_word: וְסַכֹּתָ עַל הָאָרֹן
  choice: закрой ковчег
  rationale: Глагол סכך здесь обозначает сокрытие или отгораживание ковчега посредством завесы. «Закрой» сохраняет образ исходного выражения и остаётся естественным по-русски; сноска поясняет пространственную функцию завесы.
- source_word: הַפָּרֹכֶת
  choice: завесой
  rationale: פָּרֹכֶת — внутренняя завеса святилища, отделявшая место ковчега. «Завеса» — понятный современный библейский термин; вариант «занавес» менее уместен в торжественном культовом контексте.
theological_decisions:
- issue: Наименование ковчега
  choice: ковчег свидетельства
  alternative: ковчег завета
  rationale: В данном стихе еврейский текст прямо употребляет עֵדוּת («свидетельство»). Перевод не гармонизирует его с более привычным выражением «ковчег завета» и тем самым сохраняет различие исходной терминологии.
- issue: Функция פָּרֹכֶת
  choice: закрой ковчег завесой
  alternative: отдели ковчег завесой
  rationale: Выбранный вариант близок к значению סכך, а примечание устраняет возможное впечатление, будто завесу следовало положить прямо поверх ковчега. Доктринальное толкование пространственного устройства не добавляется.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром. Сохранена традиционная культовая лексика «ковчег», «свидетельство», «завеса», но синтаксис сделан ясным и естественным для современного читателя.
