    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: помажь
  rationale: Глагол משׁח в обрядовом контексте означает помазание маслом для посвящения священному служению. Русское «помажь» естественно передаёт форму предписания; начальный союз отражён связью с последующим однородным повелением.
- source_word: הַכִּיֹּר
  choice: умывальник
  rationale: כִּיּוֹר обозначает большой сосуд для омовений при святилище. «Умывальник» — понятный и укоренившийся русский эквивалент в контексте скинии.
- source_word: כַּנּוֹ
  choice: его подставку
  rationale: כֵּן здесь обозначает конструкцию, поддерживающую умывальник. «Подставка» точнее и естественнее современного русского «основание», которое также возможно.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: и освяти его
  rationale: В породе Piel קדשׁ означает сделать священным, отделить для священного назначения. «Освяти» сохраняет культовый смысл, а местоимение оставлено в единственном числе, как в еврейском тексте.
theological_decisions:
- issue: Значение קדשׁ в контексте принадлежностей скинии
  choice: освяти
  alternative: посвяти для священного служения / сделай священным
  rationale: Речь идёт об обрядовом отделении предмета для священного употребления, а не о нравственном изменении; перевод не привносит позднейших доктринальных оттенков.
- issue: К чему относится единственное число אֹתוֹ
  choice: сохранить местоимение «его» без явного уточнения
  alternative: 'уточнить: «освяти умывальник вместе с подставкой»'
  rationale: Еврейский текст использует местоимение мужского рода единственного числа. Оно может указывать на умывальник как главный предмет или охватывать весь комплект; явное уточнение устранило бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткими повелительными формами. Сохранены достоинство обрядового контекста, последовательность действий и неоднозначность единственного местоимения.
