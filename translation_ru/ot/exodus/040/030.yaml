  text: He placed the basin between the tent of meeting and the altar[a], and put water there for washing.
translation:
  language: ru
  text: Он поставил умывальник между шатром встречи и жертвенником и налил в него воды для омовения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Он поставил
  rationale: Глагол שׂוּם обозначает помещение предмета в определённое место; «поставил» естественно передаёт установку умывальника.
- source_word: הַכִּיֹּר
  choice: умывальник
  rationale: כִּיּוֹר здесь — большая ёмкость для ритуального омовения при святилище. «Умывальник» ясно обозначает её назначение и сохраняет связь с принятой библейской лексикой.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: между шатром встречи и жертвенником
  rationale: Конструкция בֵּין...וּבֵין естественно передаётся по-русски как «между… и…»; אֹהֶל מוֹעֵד буквально означает «шатёр встречи».
- source_word: וַיִּתֵּן
  choice: и налил
  rationale: Хотя נָתַן буквально имеет широкое значение «дать, поместить», применительно к воде в ёмкости русское «налил» естественно и точно передаёт действие.
- source_word: שָׁמָּה
  choice: туда
  rationale: Наречие означает «туда/там». Выбор «туда» сохраняет пространственную формулировку еврейского текста, не заменяя её более толковательным «в него».
- source_word: מַיִם
  choice: воды
  rationale: Обычное обозначение воды; родительный падеж после «налил» естественен в русском языке и не задаёт точного объёма.
- source_word: לְרָחְצָה
  choice: для омовения
  rationale: Инфинитив от רָחַץ выражает цель — мытьё или омовение. Формулировка не добавляет прямо не названного субъекта.
