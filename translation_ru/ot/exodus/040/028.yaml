  text: And he put the screen at the entrance to the tabernacle[a].
translation:
  language: ru
  text: И повесил он завесу у входа в скинию[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «занавес для входа в скинию».'
    reason: 'Лексическая альтернатива: מָסָךְ может быть передано как «завеса» или «занавес», а сочетание допускает функциональную формулировку «для входа».'
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: И повесил он
  rationale: Глагол שׂוּם означает «положить, поставить, поместить»; при завесе у входа русское «повесил» естественно передаёт её установку, не подразумевая, что её просто положили рядом.
- source_word: מָסַךְ
  choice: завесу
  rationale: В описании скинии מָסָךְ обозначает закрывающую вход тканевую завесу. Этот выбор функционально точен и естественен по-русски; отличие от פָּרֹכֶת определяется контекстом и при необходимости поясняется как входная завеса.
- source_word: הַפֶּתַח
  choice: у входа
  rationale: פֶּתַח означает «вход, проём». Предлог «у» естественно выражает положение завесы при входе.
- source_word: לַמִּשְׁכָּן
  choice: в скинию
  rationale: 'מִשְׁכָּן традиционно и точно передаётся словом «скиния». Префикс ל связан с «входом»: буквально — «вход в скинию».'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением принятого библейского термина «скиния». Инверсия «повесил он» поддерживает повествовательный библейский ритм, оставаясь понятной современному читателю.
