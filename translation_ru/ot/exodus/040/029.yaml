  yaml_path: translation/ot/exodus/040/029.yaml
  text: And he set the altar of burnt offering at the entrance to the tabernacle of the tent of meeting, and offered on it the burnt offering and the grain offering, just as Yahweh had commanded Moses.
translation:
  language: ru
  text: И поставил он жертвенник всесожжения у входа в скинию, шатёр встречи, и принёс на нём всесожжение и хлебное приношение, как повелел Яхве Моисею.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: жертвенник всесожжения
  rationale: Устоявшееся и точное обозначение жертвенника по его основному культовому назначению; сохраняет специальное значение עֹלָה.
- source_word: שָׂם
  choice: поставил
  rationale: Естественно передаёт размещение и установку священного предмета в данном контексте.
- source_word: פֶּתַח
  choice: у входа в
  rationale: Передаёт пространственное значение «у входа, при входе» современным и естественным русским выражением.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: скинию, шатёр встречи
  rationale: Сохраняет оба еврейских обозначения и допускаемое синтаксисом пояснительное приложение, не сводя их к одному термину.
- source_word: וַיַּעַל עָלָיו
  choice: и принёс на нём
  rationale: В жертвенном контексте עלה означает вознести или принести жертву; русский оборот ясно передаёт действие и место совершения.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: Традиционный точный русский эквивалент специального жертвенного термина עֹלָה.
- source_word: הַמִּנְחָה
  choice: хлебное приношение
  rationale: В священническом контексте обозначает приношение из муки или зерновых продуктов; «хлебное приношение» — понятный и укоренившийся русский культовый термин.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного божественного имени сохраняет имя, представленное в еврейском тексте, вместо замены титулом.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: как повелел Яхве Моисею
  rationale: Естественно передаёт формулу исполнения Моисеем Божьего повеления без добавочного усиления, отсутствующего в явном виде.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо содержит тетраграмматон; «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Связь выражений מִשְׁכַּן и אֹהֶל מוֹעֵד
  choice: скинию, шатёр встречи
  alternative: скинию шатра встречи
  rationale: Еврейская последовательность допускает тесную конструктивную связь, однако контекст и употребление названий позволяют прочитать второе выражение как пояснение к первому. Запятая сохраняет оба обозначения и не устраняет эту синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сохранён компактным; культовые термины переданы последовательно и понятно. Местоимение «он» относится к Моисею из ближайшего контекста главы.
