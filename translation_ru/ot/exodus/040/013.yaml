base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/013.yaml
  text: And you shall clothe Aaron with the holy garments[a], and you shall anoint him and consecrate him, and he shall serve as priest to me.
translation:
  language: ru
  text: И облеки Аарона в священные одежды, помажь его и освяти его, и он будет служить Мне как священник.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы он служил Мне как священник». Еврейский глагол означает исполнять обязанности священника, не просто носить это звание.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: облеки
  rationale: Каузативная форма глагола לבשׁ означает, что Моисей должен надеть одежды на Аарона; «облеки» естественно для торжественного контекста посвящения.
- source_word: אַהֲרֹן
  choice: Аарона
  rationale: Устоявшаяся русская форма библейского имени в требуемом винительном падеже.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: священные одежды
  rationale: Конструкция буквально означает «одежды святости»; «священные одежды» ясно и естественно передаёт культовый смысл.
- source_word: וּמָשַׁחְתָּ
  choice: помажь
  rationale: Стандартное русское обозначение ритуального помазания при поставлении на священное служение.
- source_word: וְקִדַּשְׁתָּ
  choice: освяти
  rationale: Порода Piel здесь означает отделить для священного служения; «освяти» сохраняет связь с корнем קדשׁ и не подменяет действие более поздней терминологией рукоположения.
- source_word: וְכִהֵן
  choice: и он будет служить Мне как священник
  rationale: Глагол כהן означает исполнять священническое служение. Координация сохраняет формальную неоднозначность между простым последствием и целевой связью.
- source_word: לִי
  choice: Мне
  rationale: Дательный падеж непосредственно передаёт личную направленность служения Богу.
theological_decisions:
- issue: Последовательность действий при поставлении Аарона
  choice: Сохранить раздельно облачение, помазание, освящение и последующее священническое служение.
  alternative: Объединить помазание и освящение в понятие «рукоположить» или «посвятить».
  rationale: Еврейский текст называет отдельные ритуальные действия; их объединение внесло бы более позднюю церковную категорию и ослабило бы конкретность текста.
- issue: Синтаксическая сила וְכִהֵן לִי
  choice: 'Передать сочинительно: «и он будет служить Мне как священник».'
  alternative: «чтобы он служил Мне как священник».
  rationale: Переход от глаголов второго лица к третьему может обозначать результат или цель, однако союз וְ прямо не выражает цель. Сочинительная передача сохраняет эту неоднозначность; альтернативная целевая трактовка отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской окраской. Повелительные формы естественно передают еврейский ряд предписаний; прописное «Мне» соответствует принятой русской практике при прямой речи Бога.
