  text: А его сыновей подведи[a] и одень их в хитоны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «представь его сыновей» или «приведи его сыновей». Этот глагол может обозначать формальное приведение к месту священного служения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: А
  rationale: Союз с показателем прямого дополнения продолжает последовательность предписаний и выделяет новый объект; в русском показателю дополнения отдельного соответствия не требуется.
- source_word: בָּנָיו
  choice: его сыновей
  rationale: Существительное обозначает именно сыновей; местоимение относится к Аарону из ближайшего контекста.
- source_word: תַּקְרִיב
  choice: приведи
  rationale: Порода хифиль глагола קרב означает «приблизить, привести, представить». «Приведи» естественно по-русски и в данном обрядовом контексте сохраняет смысл подведения к месту священного служения; формальная оттеночность отмечена в сноске.
- source_word: וְהִלְבַּשְׁתָּ
  choice: и одень
  rationale: Каузативная форма передаёт действие «сделать так, чтобы были одеты»; русский глагол «одеть» краток, естественен и требует одушевлённого дополнения.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение прямого дополнения относится к сыновьям Аарона.
- source_word: כֻּתֳּנֹת
  choice: в хитоны
  rationale: כֻּתֹּנֶת обозначает нательную длинную одежду типа туники. «Хитоны» — устоявшийся и точный термин для священнического облачения; материал в стихе не назван и потому не добавлен.
theological_decisions:
- issue: Обрядово-священнический оттенок קרב
  choice: приведи
  alternative: подведи; представь
  rationale: Контекст посвящения сыновей Аарона придаёт глаголу формальный культовый оттенок. Основной текст остаётся естественным по-русски, а сноска сохраняет возможные оттенки «подвести» и «представить», не уточняя сверх еврейского текста характер действия.
translation_notes:
  register: Современный литературный русский с достоинством, подходящим для богослужебного контекста. Императивные формы передают еврейский йиктоль в последовательности повелений. Слово «хитоны» сохраняет точность термина без необоснованного добавления материала одежды.
