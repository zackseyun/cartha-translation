lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Он поставил
  rationale: В контексте размещения предметов נתן означает «поставить, поместить»; «поставил» естественно для стола и точно передаёт действие.
- source_word: הַשֻּׁלְחָן
  choice: стол
  rationale: В еврейском тексте сказано просто «стол» с определённым артиклем; уточнения вроде «стол хлебов» в этот стих не добавляются.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: в шатре встречи
  rationale: Прозрачная передача устойчивого названия אֹהֶל מוֹעֵד современным литературным русским языком.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן צָפֹנָה
  choice: с северной стороны скинии
  rationale: יֶרֶךְ здесь обозначает бок, или сторону, а צָפֹנָה указывает северное направление; вместе слова описывают расположение у северной стороны.
- source_word: הַמִּשְׁכָּן
  choice: скинии
  rationale: «Скиния» — устоявшееся и узнаваемое русское обозначение מִשְׁכָּן в описании святилища; оно позволяет отличить всё сооружение от шатра встречи без пояснительного расширения.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: по внешнюю сторону завесы
  rationale: Оборот сохраняет пространственное значение מִחוּץ и ясно показывает, что стол находился вне отделённого завесой внутреннего пространства, не заменяя исходную формулировку более толковательным «перед завесой».
