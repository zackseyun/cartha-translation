  yaml_path: translation/ot/exodus/040/033.yaml
  text: Then he set up the courtyard around the tabernacle and the altar[a], and put up the screen for the gate of the courtyard. So Moses finished the work.
translation:
  language: ru
  text: И поставил он двор вокруг скинии и жертвенника, и повесил завесу у входа во двор. Так Моисей завершил работу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֶם
  choice: поставил
  rationale: В контексте устройства скинии каузативная форма קום означает установить или воздвигнуть; «поставил» естественно сочетается с двором как ограждённым пространством.
- source_word: הֶחָצֵר
  choice: двор
  rationale: חָצֵר обозначает ограждённый внешний двор святилища; «двор» — ясный и установившийся русский эквивалент.
- source_word: סָבִיב
  choice: вокруг
  rationale: Наречие указывает, что двор окружал скинию и жертвенник.
- source_word: לַמִּשְׁכָּן
  choice: скинии
  rationale: «Скиния» сохраняет устоявшееся в русском библейском языке техническое обозначение переносного святилища и остаётся понятным в данном контексте.
- source_word: וְלַמִּזְבֵּחַ
  choice: и жертвенника
  rationale: Прямой эквивалент מִזְבֵּחַ; оба существительных зависят от «вокруг».
- source_word: וַיִּתֵּן
  choice: повесил
  rationale: Хотя נתן буквально означает «поместил», применительно к тканой завесе у входа естественное русское выражение — «повесил».
- source_word: מָסַךְ
  choice: завесу
  rationale: מָסַךְ здесь обозначает тканое закрытие входа. «Завеса» точно передаёт предмет, не предполагая жёсткой двери.
- source_word: שַׁעַר הֶחָצֵר
  choice: у входа во двор
  rationale: שַׁעַר обозначает вход или ворота; поскольку вход закрывался тканой завесой, «у входа во двор» звучит естественно и не создаёт образа створчатых ворот.
- source_word: וַיְכַל
  choice: завершил
  rationale: כלה выражает доведение дела до конца; «завершил» ясно передаёт итоговую формулу повествования.
- source_word: הַמְּלָאכָה
  choice: работу
  rationale: מְלָאכָה охватывает всю выполненную работу по сооружению и устройству святилища.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением традиционного культового термина «скиния». Синтаксис краткий и торжественный, но без архаизмов. Местоимение «он» сохраняет субъект первой части в соответствии с ближайшим контекстом, тогда как во второй части имя Моисея передано явно, как в еврейском тексте.
