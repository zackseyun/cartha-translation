  text: And you shall place the golden altar for incense before the ark of the testimony[b][a], and you shall set the screen for the entrance of the tabernacle.
translation:
  language: ru
  text: И поставь золотой жертвенник для воскурения благовоний перед ковчегом свидетельства[a] и установи завесу у входа в скинию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно распространённому традиционному наименованию: «ковчег завета». Буквально в еврейском тексте: «ковчег свидетельства».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: и поставь
  rationale: В контексте размещения предметов святилища נתן естественно передаётся глаголом «поставить»; повелительная форма по-русски точно выражает предписание, данное Моисею.
- source_word: מִזְבַּח הַזָּהָב
  choice: золотой жертвенник
  rationale: Сочетание буквально обозначает жертвенник из золота; «золотой жертвенник» — естественное и традиционно понятное русское выражение.
- source_word: לִקְטֹרֶת
  choice: для воскурения благовоний
  rationale: Предлог ל обозначает назначение жертвенника. Кְטֹרֶת здесь относится к ароматическому курению; развёрнутая передача яснее, чем одно слово «курение».
- source_word: לִפְנֵי
  choice: перед
  rationale: Передаёт пространственное значение расположения перед ковчегом без лишнего истолкования.
- source_word: אֲרוֹן הָעֵדֻת
  choice: ковчег свидетельства
  rationale: עֵדֻת означает «свидетельство»; перевод сохраняет точное наименование в данном стихе, не заменяя его более привычным «ковчегом завета».
- source_word: וְשַׂמְתָּ
  choice: и повесь
  rationale: Хотя שׂים буквально означает «поместить/установить», применительно к входной завесе естественный русский глагол «повесить» конкретизирует подразумеваемое действие без изменения смысла.
- source_word: מָסַךְ הַפֶּתַח
  choice: завесу у входа
  rationale: מָסַךְ обозначает входную тканевую завесу; «у входа» естественно передаёт её расположение и отличает её функцию от внутренней завесы פָּרֹכֶת.
- source_word: לַמִּשְׁכָּן
  choice: в скинию
  rationale: В составе выражения «вход в скинию» предлог ל естественно передаётся русским родительным оборотом; «скиния» сохраняет устоявшийся сакральный термин для מִשְׁכָּן.
theological_decisions:
- issue: Передача עֵדֻת в наименовании ковчега
  choice: ковчег свидетельства
  alternative: ковчег завета
  rationale: Еврейский текст прямо употребляет עֵדֻת — «свидетельство». Более привычное «ковчег завета» здесь было бы традиционным уравниванием разных наименований и снижало бы лексическую точность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Сохранены понятные традиционные термины «жертвенник», «ковчег» и «скиния»; синтаксис сделан прямым и естественным. Маркер сноски поставлен непосредственно после выражения, к которому относится.
