base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/009.yaml
  text: Then you shall take the anointing oil and anoint the tabernacle and all that is in it[a], and you shall consecrate it and all its furnishings[b], and it shall be holy.
translation:
  language: ru
  text: Затем возьми масло для помазания и помажь скинию и всё, что в ней; освяти её и все её принадлежности — и она станет святыней.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и будет святыней». В еврейском тексте здесь сказано «святыня», а не «святыня святынь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Затем возьми
  rationale: Перфект с союзом в последовательности предписаний передаёт повеление; «затем» ясно обозначает порядок действий.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: масло для помазания
  rationale: Естественная современная передача сопряжённой конструкции, сохраняющая её культовое значение.
- source_word: וּמָשַׁחְתָּ
  choice: и помажь
  rationale: В культовом контексте משׁח означает помазание маслом для посвящения святыне.
- source_word: הַמִּשְׁכָּן
  choice: скинию
  rationale: Устоявшееся и точное русское обозначение переносного святилища в пустыне.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: всё, что в ней
  rationale: Точно и естественно охватывает всё содержимое скинии.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: освяти её
  rationale: Piel от קדשׁ здесь означает отделить для священного назначения; «освятить» естественно передаёт это культовое действие.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: и все её принадлежности
  rationale: כֵּלִים — широкое обозначение предметов и утвари скинии; «принадлежности» не сужает смысл до сосудов или инструментов.
- source_word: וְהָיָה קֹדֶשׁ
  choice: и она станет святыней
  rationale: Результативная формула указывает на приобретённый после освящения священный статус; существительное קֹדֶשׁ естественно передано как «святыня» без усиления до «великой святыни».
theological_decisions:
- issue: Статус скинии после помазания и освящения
  choice: Она станет святыней, без указания превосходной степени святости.
  alternative: Она станет великой святыней / святыней святынь.
  rationale: В еврейском тексте стоит только קֹדֶשׁ («святыня; святое»), а не קֹדֶשׁ קָדָשִׁים («святыня святынь; великая святыня»). Усиление из соседних мест здесь не вносится.
translation_notes:
  register: Современный литературный русский с традиционным, общеупотребительным термином «скиния». Повелительная последовательность передана прямыми императивами; синтаксис остаётся торжественным, но понятным.
