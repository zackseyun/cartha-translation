  text: Затем подведи Аарона и его сыновей ко входу в Шатёр Встречи и омой их водой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: подведи
  rationale: Порода hифиль глагола קרב выражает побуждение приблизиться. «Подведи» естественно передаёт это значение по-русски и сохраняет ритуальный контекст.
- source_word: אַהֲרֹן
  choice: Аарона
  rationale: Имя передано в традиционной русской библейской форме и поставлено в винительный падеж согласно синтаксису.
- source_word: בָּנָיו
  choice: его сыновей
  rationale: Существительное обозначает сыновей мужского пола; местоимение относится к Аарону.
- source_word: פֶּתַח
  choice: входу
  rationale: В данном контексте слово обозначает место входа в шатёр; дательный падеж обусловлен управлением «подведи ко входу».
- source_word: אֹהֶל מוֹעֵד
  choice: Шатёр Встречи
  rationale: Устойчивая и прозрачная передача названия священного шатра как места назначенной встречи; заглавные буквы показывают, что это наименование конкретного святилища.
- source_word: וְרָחַצְתָּ
  choice: омой
  rationale: Глагол רחץ означает мыть или омывать. «Омой» естественно звучит в контексте ритуального очищения, не уточняя способ мытья сверх текста.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение относится вместе к Аарону и его сыновьям.
- source_word: בַּמָּיִם
  choice: водой
  rationale: 'Предлог ב здесь естественно понимать инструментально: омовение совершается водой.'
