  yaml_path: translation/ot/exodus/040/026.yaml
  text: And he placed the gold altar in the tent of meeting[a], before the veil.
translation:
  language: ru
  text: И поставил он золотой жертвенник в шатре встречи перед завесой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «занавесом». Еврейское слово обозначает внутреннюю разделительную завесу святилища.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: И поставил он
  rationale: Форма wayyiqtol от שׂוּם передаёт последовательное действие в повествовании. «Поставил» естественно описывает намеренное размещение предмета святилища.
- source_word: מִזְבַּח הַזָּהָב
  choice: золотой жертвенник
  rationale: Буквально — «жертвенник золота». Русское сочетание «золотой жертвенник» естественно и точно передаёт материал или характер отделки предмета.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: в шатре встречи
  rationale: Так сохраняются конкретный образ אֹהֶל («шатёр») и значение מוֹעֵד как назначенной встречи. Формулировка понятна современному читателю и не заменяет исходное выражение более специализированным традиционным термином.
- source_word: לִפְנֵי
  choice: перед
  rationale: Предлог обозначает пространственное положение жертвенника относительно внутренней завесы.
- source_word: הַפָּרֹכֶת
  choice: завесой
  rationale: פָּרֹכֶת — внутренняя разделительная завеса святилища. «Завеса» сохраняет культовую и межтекстовую окраску, не выходя за рамки предметного значения.
theological_decisions:
- issue: Обозначение внутренней перегородки святилища הַפָּרֹכֶת
  choice: завеса
  alternative: занавес
  rationale: «Завеса» точно обозначает внутреннее полотнище-разделитель и сохраняет его богословскую значимость в последующем библейском употреблении, не добавляя толкования.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанно возвышенной лексикой. Сохранены последовательность еврейского повествования, культовая терминология и лаконичный синтаксис оригинала.
