  yaml_path: translation/ot/exodus/040/016.yaml
  text: And Moses did according to all that Yahweh commanded him[a]; so he did.
translation:
  language: ru
  text: Моисей сделал всё так, как повелел ему Яхве[a]. Так он и сделал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «YHWH»; традиционно передаётся «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Глагол עשה имеет широкое значение «делать, исполнять»; здесь он обозначает точное исполнение повеления и одновременно сохраняет повтор с заключительным עָשָׂה.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма личного имени.
- source_word: כְּכֹל
  choice: всё так, как
  rationale: Передаёт полное соответствие всему повелённому и звучит естественно по-русски.
- source_word: אֲשֶׁר
  choice: как
  rationale: В сочетании с כְּכֹל вводит содержание и меру соответствия повелению.
- source_word: צִוָּה
  choice: повелел
  rationale: Форма обозначает завершённое повеление; русское прошедшее время естественно передаёт последовательность без добавления отсутствующего в еврейском плюсквамперфекта.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного Божьего имени, прямо представленного тетраграмматоном в исходном тексте.
- source_word: אֹתוֹ
  choice: ему
  rationale: 'Еврейский показатель прямого дополнения с местоименным суффиксом при צוה естественно передаётся русским дательным падежом: «повелел ему».'
- source_word: כֵּן עָשָׂה
  choice: Именно так он и сделал
  rationale: Сохраняет итоговое повторение глагола и усиленно подчёркивает точное соответствие действия повелению.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя YHWH, поэтому в основном тексте оно передано транслитерацией; традиционная замена титулом отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Перестройка «сделал всё так, как» естественно передаёт כְּכֹל, а заключительное «Именно так он и сделал» сохраняет еврейское риторическое повторение.
