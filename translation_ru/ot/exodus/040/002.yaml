  text: On the first day of the first month[a], you shall set up the tabernacle, the tent of meeting.
translation:
  language: ru
  text: В первый день первого месяца поставишь скинию — шатёр встречи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «скинию шатра встречи». В еврейском тексте соединены два обозначения святилища; второе можно понимать либо как поясняющее приложение, либо как часть более тесного сочетания.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/יוֹם הַ/חֹדֶשׁ הָ/רִאשׁוֹן בְּ/אֶחָד לַ/חֹדֶשׁ
  choice: В первый день первого месяца
  rationale: Две связанные календарные формулы указывают на первый день первого месяца; по-русски это естественно передаётся одной цельной датировкой.
- source_word: תָּקִים
  choice: поставь
  rationale: Хифиль глагола קום означает здесь «воздвигнуть, установить». Императив «поставь» прямо передаёт модальность еврейской формы и естественно сочетается со скинией.
- source_word: מִשְׁכַּן
  choice: скинию
  rationale: «Скиния» — укоренившееся в русском библейском языке обозначение переносного святилища; оно сохраняет культовый смысл и остаётся узнаваемым.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: 'Так передаётся обычное обозначение святилища в Исходе: אֹהֶל — «шатёр», а מוֹעֵד здесь связано с назначенной встречей. «Шатёр» точнее современного «палатка» по регистру и контексту.'
theological_decisions:
- issue: Соотношение מִשְׁכַּן и אֹהֶל מוֹעֵד
  choice: 'Приложение: «скинию — шатёр встречи»'
  alternative: 'Более тесная конструкция: «скинию шатра встречи»'
  rationale: Два обозначения святилища стоят рядом без явного показателя родительного отношения. Приложение ясно представляет их как два наименования одного священного сооружения, а сноска сохраняет возможное более тесное синтаксическое прочтение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Скиния» сохранена как общепринятый термин, а «шатёр встречи» выбран вместо архаичного «скиния собрания». Тире естественно оформляет пояснительное приложение.
