  text: And he arranged on it the bread in order before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: ru
  text: И разложил он на нём хлеб по порядку перед Яхве, как Яхве повелел Моисею.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: разложил
  rationale: Глагол ערך означает «располагать, раскладывать по порядку»; «разложил» естественно передаёт размещение хлеба на столе.
- source_word: עָלָיו
  choice: на нём
  rationale: Местоимение относится к столу, упомянутому в предыдущем стихе; мужской род соответствует русскому слову «стол».
- source_word: עֵרֶךְ לֶחֶם
  choice: хлеб в установленном порядке
  rationale: Сочетание обозначает хлеб, упорядоченно разложенный для богослужебного употребления. Перевод сохраняет описательный характер выражения и не подменяет его отдельным термином לֶחֶם הַפָּנִים.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Передаёт пространственно-культовое значение «перед, в присутствии» и сохраняет личное имя Бога.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: как Яхве повелел Моисею
  rationale: Естественно выражает точное соответствие ранее данному повелению; русская форма не требует отдельного показателя предпрошедшего времени.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это различие, не заменяя имя титулом.
- issue: Понимание עֵרֶךְ לֶחֶם
  choice: хлеб в установленном порядке
  alternative: ряд хлебов; хлеб предложения
  rationale: В данном стихе употреблено описательное сочетание, а не обычное выражение לֶחֶם הַפָּנִים; поэтому основной текст не вводит традиционное толкование как единственно возможное.
