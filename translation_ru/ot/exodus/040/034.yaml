  text: וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת אֹ֣הֶל מוֹעֵ֑ד וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/034.yaml
  text: Then the cloud covered the tent of meeting[a], and the glory of Yahweh filled the tabernacle.
translation:
  language: ru
  text: Тогда облако покрыло шатёр встречи, и слава Яхве[a] наполнила скинию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господа». В еврейском тексте стоит божественное имя יהוה (Яхве).'
    reason: Отмечает традиционную передачу тетраграмматона и поясняет, что в оригинале употреблено личное имя.
lexical_decisions:
- source_word: וַיְכַס
  choice: покрыло
  rationale: Глагол כסה обычно означает «покрывать». Эта передача сохраняет конкретный образ облака, закрывшего шатёр; начальное וַ передано словом «тогда», продолжающим повествование.
- source_word: הֶעָנָן
  choice: облако
  rationale: Определённая форма указывает на уже известное из повествования облако; в русском контексте определённость естественно выражается без артикля.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Передача сохраняет значение назначенного места встречи и не истолковывает מוֹעֵד как собрание людей.
- source_word: כְבוֹד יְהוָה
  choice: слава Яхве
  rationale: כָּבוֹד здесь обозначает явленное величие и присутствие Бога; краткая конструкция с родительным падежом естественна по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное божественное имя, стоящее непосредственно в еврейском тексте, а не заменяющий его титул.
- source_word: מָלֵא
  choice: наполнила
  rationale: 'Глагол מלא употреблён переходно: слава заполняет скинию. Форма женского рода согласована со словом «слава».'
- source_word: הַמִּשְׁכָּן
  choice: скинию
  rationale: «Скиния» — устоявшийся русский термин для переносного святилища в Исходе; он сохраняет специальное культовое значение מִשְׁכָּן.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В стихе прямо употреблён тетраграмматон. «Яхве» сохраняет личное заветное имя, а сноска отмечает традиционную передачу титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Шатёр встречи» прозрачно передаёт функцию אֹהֶל מוֹעֵד, тогда как «скиния» сохранена как устоявшееся название святилища; различие двух еврейских обозначений не сглажено.
