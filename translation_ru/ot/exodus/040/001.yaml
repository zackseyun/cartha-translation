lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И говорил
  rationale: Форма с повествовательным וַ продвигает рассказ и вводит очередное речевое событие; «говорил» естественно передаёт формулу божественной речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֶל מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи без отдельного предлога.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В данной формуле еврейский инфинитив вводит прямую речь; в современном русском его функцию естественно выполняет двоеточие, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В тексте стоит собственное имя Бога. «Яхве» представляет распространённую научную реконструкцию произношения; вариант «Иегова» отмечен в сноске, а замена имени титулом могла бы скрыть лексическое различие.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской повествовательной связкой «И говорил». Двоеточие идиоматично вводит последующую прямую речь и не добавляет содержания, отсутствующего в еврейском тексте.
