base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/006.yaml
  text: And you shall place the altar of burnt offering before the entrance of the tabernacle[a], the tent of meeting.
translation:
  language: ru
  text: И поставь жертвенник всесожжения перед входом в скинию[a], шатёр встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед входом в скинию шатра встречи».'
    reason: Сочетание «скиния, шатёр встречи» может пониматься как пояснительное наименование либо как конструкция принадлежности.
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: И поставь
  rationale: В контексте указаний о размещении предметов נָתַן означает «поставить, поместить». Русская форма повелительного наклонения естественно передаёт обращённое к Моисею предписание.
- source_word: מִזְבַּח הָעֹלָה
  choice: жертвенник всесожжения
  rationale: Устоявшееся и точное обозначение жертвенника, на котором приносили жертву, сжигаемую целиком.
- source_word: לִפְנֵי פֶּתַח
  choice: перед входом
  rationale: 'Прямо передаёт пространственное значение: перед входом, со стороны входа.'
- source_word: מִשְׁכַּן
  choice: скинию
  rationale: «Скиния» — закрепившийся в русском библейском употреблении термин для переносного святилища; он сохраняет культовое значение слова מִשְׁכָּן.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Буквально и понятно передаёт устойчивое название אֹהֶל מוֹעֵד. «Шатёр» естественнее в современной речи, чем «палатка», и отличает אֹהֶל от מִשְׁכָּן.
theological_decisions:
- issue: Соотношение выражений מִשְׁכַּן и אֹהֶל מוֹעֵד
  choice: скинию — шатёр встречи
  alternative: скинию шатра встречи
  rationale: Тире сохраняет наиболее естественное понимание второго выражения как поясняющего наименования того же святилища, не вводя лишней конструкции принадлежности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Сохранён традиционный термин «скиния», а אֹהֶל передано современным словом «шатёр». Краткая повелительная конструкция соответствует контексту прямых указаний.
