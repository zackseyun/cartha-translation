  text: Он поставил светильник в шатре встречи, напротив стола, с южной стороны скинии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Он поставил
  rationale: Глагол שׂים в повествовательной форме обозначает завершённое действие; «поставил» естественно передаёт намеренное размещение предмета.
- source_word: הַמְּנֹרָה
  choice: светильник
  rationale: מְנוֹרָה здесь означает культовый светильник на подставке; традиционное русское «светильник» ясно и уместно в контексте скинии.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: в шатре встречи
  rationale: Буквально и понятно передаёт устойчивое обозначение святилища как места встречи Бога с людьми.
- source_word: נֹכַח הַשֻּׁלְחָן
  choice: напротив стола
  rationale: נֹכַח обозначает расположение напротив или перед чем-либо; «напротив» лучше всего передаёт пространственное соотношение предметов здесь.
- source_word: הַשֻּׁלְחָן
  choice: стола
  rationale: В еврейском тексте сказано просто «стол»; контекстуальное уточнение о хлебах не добавляется.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן
  choice: с южной стороны скинии
  rationale: יֶרֶךְ буквально означает «бок, сторона», а вместе с последующим направительным словом указывает на южную сторону сооружения.
- source_word: נֶגְבָּה
  choice: южной
  rationale: Направительная форма указывает на юг; в русском пространственном описании естественно «с южной стороны».
- source_word: הַמִּשְׁכָּן
  choice: скинии
  rationale: «Скиния» — укоренившийся и точный русский термин для переносного святилища в Исходе.
