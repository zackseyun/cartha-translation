base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/036.yaml
  text: Whenever the cloud was taken up from over the tabernacle[a], the sons of Israel would set out in all their journeys.
translation:
  language: ru
  text: Всякий раз, когда облако поднималось от скинии, сыны Израиля[a] отправлялись в путь — во всех своих переходах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально: «сыны Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהֵעָלֹת
  choice: Всякий раз, когда … поднималось
  rationale: Сочетание союза, предлога и инфинитива вводит временное придаточное; контекст описывает повторявшийся порядок действий, поэтому «всякий раз» естественно передаёт итеративность. Глагол עלה здесь можно передать непереходным «поднималось», не вводя явно действующее лицо.
- source_word: הֶעָנָן
  choice: облако
  rationale: Определённая форма указывает на уже известное из контекста облако Божьего присутствия.
- source_word: מֵעַל
  choice: от
  rationale: Предлог обозначает удаление от положения над скинией. В русском сочетание «облако поднималось от скинии» естественно выражает начало движения от неё, тогда как буквальное «из-за пространства над» было бы тяжеловесным.
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: Устоявшееся и точное русское библейское обозначение переносного святилища; слово сохраняет достоинство стиля и понятно в контексте Пятикнижия.
- source_word: יִסְעוּ
  choice: отправлялись в путь
  rationale: Глагол נסע обозначает выступление со стоянки. Несовершенный вид передаёт повторяющееся действие, согласованное с «всякий раз».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет форму еврейского корпоративного обозначения, буквально «сыновья/сыны Израиля», а сноска поясняет его общеупотребительное значение.
- source_word: בְּכֹל מַסְעֵיהֶם
  choice: так было на всех этапах их странствий
  rationale: Фраза охватывает все переходы и стоянки во время странствований. Перестройка предложения устраняет неестественное русское сочетание «отправлялись во всех переходах», сохраняя обобщающий смысл.
theological_decisions:
- issue: Корпоративное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Формулировка сохраняет грамматический и родословный образ оригинала, не утверждая, что речь идёт исключительно о взрослых мужчинах; сноска раскрывает корпоративное употребление.
- issue: Кто поднимает облако
  choice: облако поднималось
  alternative: облако было поднято
  rationale: Еврейская форма допускает естественное описание движения облака без названного деятеля. Непереходная русская конструкция не навязывает ни явный пассив, ни дополнительное толкование о непосредственном действующем лице.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой («скиния», «сыны Израиля»). Конструкция с тире делает итоговое обобщение естественным и ясным, не устраняя повторный характер описанного порядка.
