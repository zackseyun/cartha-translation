lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Помажь
  rationale: В обрядовом контексте משׁח обозначает помазание священным маслом. Русское «помажь» точно и естественно передаёт предписанное действие.
- source_word: מִזְבַּח הָעֹלָה
  choice: жертвенник всесожжения
  rationale: Сочетание называет жертвенник, предназначенный для жертвы всесожжения; это устойчивое и понятное русское соответствие.
- source_word: כָּל כֵּלָיו
  choice: всю его утварь
  rationale: כֵּלִים здесь охватывает принадлежности и орудия жертвенника. «Утварь» сохраняет обрядовый контекст и звучит естественно в современном литературном русском.
- source_word: וְקִדַּשְׁתָּ
  choice: освяти
  rationale: В данном ритуальном предписании קדשׁ означает отделить и посвятить как святое; «освяти» кратко и точно передаёт этот смысл.
- source_word: וְהָיָה
  choice: и станет он
  rationale: Форма указывает на состояние, которое наступит вследствие освящения. «Станет» яснее выражает результат действия, чем простое «будет».
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: великой святыней
  rationale: Еврейская конструкция выражает превосходную степень святости. «Великая святыня» — ясная и достойная русская формулировка, не создающая ошибочной пространственной отсылки к Святому святых.
theological_decisions:
- issue: Передача культовой формулы קֹדֶשׁ קָדָשִׁים
  choice: великой святыней
  alternative: святыней святынь; святейшей святыней
  rationale: Формула характеризует высшую степень освящённости жертвенника, а не называет внутреннее помещение святилища. Основной текст передаёт значение естественно по-русски, а буквальная структура сохранена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественной культовой лексикой. Повелительные формы соответствуют контексту последовательных предписаний. Точка с запятой ясно разделяет помазание принадлежностей и последующее освящение жертвенника.
