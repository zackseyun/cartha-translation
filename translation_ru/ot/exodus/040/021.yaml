  text: וַ/יָּבֵ֣א אֶת הָ/אָרֹן֮ אֶל הַ/מִּשְׁכָּן֒ וַ/יָּ֗שֶׂם אֵ֚ת פָּרֹ֣כֶת הַ/מָּסָ֔ךְ וַ/יָּ֕סֶךְ עַ֖ל אֲר֣וֹן הָ/עֵד֑וּת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/021.yaml
  text: He brought the ark into the tabernacle[a], set up the veil of the screen, and screened the ark of the testimony[b], just as Yahweh had commanded Moses.
translation:
  language: ru
  text: Он внёс ковчег в скинию, установил завесу[a] и закрыл ею ковчег свидетельства[b], как и повелел Яхве Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «завесу преграды»; еврейское сочетание называет завесу и одновременно подчёркивает, что она служила преградой.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отгородил ковчег свидетельства». Еврейский глагол может означать закрыть, заслонить или отделить завесой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: внёс
  rationale: Порода hифиль глагола בוא здесь означает внесение предмета внутрь; русский глагол естественно передаёт и движение, и его каузативный характер.
- source_word: הָאָרֹן
  choice: ковчег
  rationale: В культовом контексте Исхода אָרוֹן обозначает священный ковчег, а не обычный сундук.
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: Традиционный и понятный русский термин для переносного святилища; он сохраняет специальное значение слова מִשְׁכָּן в данном контексте.
- source_word: וַיָּשֶׂם אֵת פָּרֹכֶת הַמָּסָךְ
  choice: установил завесу
  rationale: שׂים в контексте устройства святилища означает поставить или установить на предназначенное место. Слово «завеса» передаёт פָּרֹכֶת, а функцию преграды, выраженную הַמָּסָךְ, поясняет сноска, чтобы избежать тяжеловесного сочетания в основном тексте.
- source_word: וַיָּסֶךְ עַל
  choice: закрыл ею
  rationale: Глагол выражает закрывание или заслонение посредством завесы. Местоимение «ею» естественно обозначает средство и делает связь с установленной завесой явной, не меняя смысла.
- source_word: אֲרוֹן הָעֵדוּת
  choice: ковчег свидетельства
  rationale: Формально сохраняет устойчивое обозначение ковчега, связанного со скрижалями свидетельства, без пояснительного расширения непосредственно в стихе.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: как и повелел Яхве Моисею
  rationale: Оборот передаёт точное соответствие действий Моисея Божьему повелению; личное имя יְהוָה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому оно сохраняется в распространённой научной русской транслитерации, а не заменяется титулом.
- issue: Значение עֵדוּת в названии ковчега
  choice: свидетельство
  alternative: завет; скрижали свидетельства
  rationale: «Свидетельство» сохраняет лексику исходного текста и связь со скрижалями, не отождествляя сам термин с более широким понятием завета и не добавляя отсутствующее здесь слово «скрижали».
translation_notes:
  register: Современный литературный русский язык с сохранением принятой библейской терминологии («ковчег», «скиния», «свидетельство»). Синтаксис краткий и повествовательный; тяжеловесная внутренняя форма еврейского сочетания о завесе вынесена в сноску.
