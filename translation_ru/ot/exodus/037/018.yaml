translation:
  language: ru
  text: 'И шесть ветвей выходили из его боков[a]: три ветви светильника — из одного его бока[b], и три ветви светильника — из другого его бока.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выступали из его боков»; еврейское причастие изображает шесть ветвей отходящими наружу от светильника.'
