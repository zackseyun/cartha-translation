  - marker: b
    text: 'Буквально: «из одного его бока… из второго его бока».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: ветви
  rationale: В описании светильника слово обозначает отходящие от его ствола части. «Ветви» естественно передаёт образ и устройство предмета; «трости» здесь звучало бы буквально, но вводило бы в заблуждение.
- source_word: יֹצְאִים
  choice: выходили
  rationale: Причастие описывает шесть ветвей как исходящие наружу из светильника; глагольная форма сохраняет динамический характер еврейского выражения.
- source_word: מִצִּדֶּיהָ / מִצִּדָּהּ
  choice: из её боков / из одного её бока / из другого её бока
  rationale: צד означает «бок, сторона». «Из» ясно выражает исходное место ветвей, а местоимение женского рода соотносится со словом «менора/светильник» в еврейском тексте; в русском переводе оно отсылает к подразумеваемой конструкции светильника, хотя грамматически естественнее было бы «его».
- source_word: מְנֹרָה
  choice: светильник
  rationale: Обычное существительное обозначает храмовый светильник. Перевод значения понятнее современному читателю, чем транслитерация «менора».
- source_word: הָאֶחָד ... הַשֵּׁנִי
  choice: из одного ... из другого
  rationale: Буквально сказано «с одной ... со второй стороны». В современном русском парное выражение «с одного ... с другого» естественно передаёт противопоставление двух сторон без изменения смысла.
