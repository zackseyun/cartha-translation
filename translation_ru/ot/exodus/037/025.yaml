base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/025.yaml
  text: He made the altar of incense of acacia wood. Its length was one cubit[a], and its width one cubit—it was square—and its height was two cubits. Its horns were of one piece with it.
translation:
  language: ru
  text: 'Он сделал из дерева акации жертвенник для воскурения благовоний[a]: длиной в локоть и шириной в локоть — квадратный, высотой в два локтя. Его роги были сделаны заодно с ним.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвенник благовоний».'
    reason: Более краткая лексически возможная передача сочетания מִזְבַּח הַקְּטֹרֶת.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Форма с повествовательным וַ передаёт последовательное действие в прошлом; в современном русском начальное «и» можно опустить без утраты связи с контекстом.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: жертвенник для воскурения
  rationale: Сочетание обозначает жертвенник, предназначенный для воскурения благовоний; выбран естественный и понятный современному читателю культовый термин.
- source_word: עֲצֵי שִׁטִּים
  choice: из дерева акации
  rationale: Передаёт материал современным общеупотребительным названием, не прибегая к малопонятной транслитерации «ситтим».
- source_word: אַמָּה ... אַמָּתַיִם
  choice: локоть ... два локтя
  rationale: Сохранена древняя мера длины без приблизительного пересчёта, который создал бы ложную точность.
- source_word: רָבוּעַ
  choice: квадратный
  rationale: Кратко и естественно передаёт указание на квадратную форму основания жертвенника.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: Его роги составляли с ним одно целое
  rationale: Фраза указывает, что роги были выполнены как неотъемлемая часть самого жертвенника, а не прикреплены отдельно.
