  source_fidelity: 'В целом смысл передан точно: материал, размеры, квадратная форма и цельность рогов сохранены. Однако «жертвенник для воскурения» не выражает названный в еврейском тексте объект воскурения (הַקְּטֹרֶת, «благовония/курение»), поэтому допускает чрезмерно общее понимание.'
  naturalness: Фраза «локоть в длину» понятна, но описание размеров естественнее и точнее звучит как «длиной в локоть». «Роги» — уместный традиционный технический термин в описании жертвенника. «Были сделаны заодно с ним» ясно передаёт их неотдельность и звучит по-русски естественнее, чем «составляли с ним одно целое».
  terminology: «Дерево акации», «жертвенник», «локоть» и «роги» соответствуют регистру и исходному тексту. Следует назвать благовония в основном тексте. Сноска сохраняет допустимый более краткий вариант названия.
