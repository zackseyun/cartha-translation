  yaml_path: translation/ot/exodus/037/002.yaml
  text: He overlaid it with pure gold[a], inside and outside, and made for it a surrounding border of gold.
translation:
  language: ru
  text: Он обложил его чистым золотом изнутри и снаружи и сделал вокруг него золотую кайму[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «золотой ободок»; возможно также: «золотое обрамление». Еврейское слово זֵר обозначает декоративную окантовку, опоясывающую предмет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַפֵּהוּ
  choice: обложил его
  rationale: Пиэль глагола צפה в контексте изготовления священной утвари означает покрытие поверхности металлом; «обложил» точно и естественно передаёт нанесение золотого покрытия.
- source_word: זָהָב טָהוֹר
  choice: чистым золотом
  rationale: Устойчивое и ясное обозначение золота высокой чистоты в данном ремесленном контексте.
- source_word: מִבַּיִת וּמִחוּץ
  choice: изнутри и снаружи
  rationale: Естественно передаёт противопоставление внутренней и наружной поверхностей предмета.
- source_word: וַיַּעַשׂ לוֹ
  choice: сделал вокруг него
  rationale: Местоименный суффикс относится к ковчегу; сочетание с סָבִיב естественно выражается по-русски как «вокруг него».
- source_word: זֵר זָהָב
  choice: золотую кайму
  rationale: זֵר в описаниях священной утвари обозначает окружающую предмет декоративную окантовку. «Кайма» понятно передаёт эту деталь и не привносит буквальный образ царского венца.
- source_word: סָבִיב
  choice: вокруг него
  rationale: Передаёт охватывающее расположение каймы по периметру предмета.
