  text: He made the mercy seat of pure gold; its length was two and a half cubits[a], and its width a cubit and a half.
translation:
  language: ru
  text: 'Он сделал из чистого золота крышку ковчега[a]: длина её — два с половиной локтя, а ширина — полтора локтя.'
  philosophy: optimal-equivalence
  footnotes:
