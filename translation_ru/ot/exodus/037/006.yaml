    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Форма wayyiqtol от עשה обозначает последовательное действие в повествовании; в современном русском начальный союз можно опустить без утраты смысла.
- source_word: כַּפֹּרֶת
  choice: крышку очищения
  rationale: Сочетание называет золотую крышку ковчега и сохраняет связь термина с обрядовым очищением/искуплением, не превращая предмет в буквальное сиденье.
- source_word: זָהָב טָהוֹר
  choice: из чистого золота
  rationale: Естественно выражает материал, из которого изготовлен предмет.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: два с половиной локтя
  rationale: Точно и естественно передаёт еврейское обозначение меры.
- source_word: אָרְכָּהּ
  choice: длина её
  rationale: Местоимение относится к крышке; именная конструкция с тире естественна для русского описания размеров.
- source_word: וְאַמָּה וָחֵצִי
  choice: а ... полтора локтя
  rationale: Русская форма «полтора локтя» идиоматично передаёт «локоть с половиной», а союз «а» ясно сопоставляет два измерения.
- source_word: רָחְבָּהּ
  choice: ширина
  rationale: Современный и точный русский эквивалент обозначения поперечного размера.
theological_decisions:
- issue: Передача כַּפֹּרֶת в культовом контексте
  choice: крышка очищения
  alternative: крышка искупления; крышка ковчега
  rationale: Еврейское слово обозначает крышку ковчега, связанную с обрядом очищения/искупления. Основной вариант сохраняет и предметное значение, и культовую ассоциацию, не разрешая однозначно весь смысл корня כפר; альтернативы приведены в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и торжественно-нейтральный. Терминологическая сноска сохраняет смысловую широту культового названия.
