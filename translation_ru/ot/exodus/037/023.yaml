base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/023.yaml
  text: He made its seven lamps[a], its tongs[b], and its firepans of pure gold.
translation:
  language: ru
  text: Он сделал семь её светильников, щипцы[a] и лотки[b] из чистого золота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть щипцы для ухода за фитилями; возможен перевод «щипцы для снятия нагара».
    reason: lexical_alternative
  - marker: b
    text: Или «совки», «поддоны». Еврейское слово обозначает небольшие сосуды или принадлежности для сбора остатков горения; в других контекстах оно может передаваться как «жаровни».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Форма wayyiqtol от עשה продолжает повествование; в естественном русском её уместно передать простым прошедшим временем без обязательного союза «и».
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: семь её светильников
  rationale: נֵרוֹת обозначает отдельные светильники, а местоименный суффикс женского рода указывает на ранее названный светильник; русский порядок слов естественно ставит числительное перед существительным.
- source_word: מַלְקָחֶיהָ
  choice: щипцы
  rationale: Слово обозначает принадлежность для ухода за лампами, вероятно щипцы для работы с фитилями. Краткое «щипцы» сохраняет предметность и не делает вероятную функцию частью основного текста.
- source_word: מַחְתֹּתֶיהָ
  choice: лотки
  rationale: В контексте светильника речь, вероятно, идёт о небольших приёмниках или поддонах для удалённых частиц фитиля и нагара. «Лотки» лучше передаёт этот контекст, чем «кадильницы» или алтарные «жаровни», но неоднозначность отмечена в сноске.
- source_word: זָהָב טָהוֹר
  choice: из чистого золота
  rationale: Естественное русское обозначение материала; конечное положение словосочетания позволяет отнести его ко всем перечисленным предметам.
