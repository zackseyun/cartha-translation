base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/019.yaml
  text: Three almond-blossom-shaped cups were on the one branch[a], with bulb and flower; and three almond-blossom-shaped cups were on one branch, with bulb and flower[b]. So it was for the six branches coming out from the lampstand.
translation:
  language: ru
  text: На одной ветви было три чашечки в форме миндальных цветков[a], с шаровидным украшением[b] и цветком; и на одной ветви — три чашечки в форме миндальных цветков, с шаровидным украшением и цветком. Так было у шести ветвей, выходивших из светильника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «три чашечки, сделанные наподобие миндальных цветков».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово обозначает округлую выступающую деталь; возможные переводы: «шишечка» или «утолщение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: чашечки
  rationale: Слово обозначает чашеобразные декоративные элементы светильника. Уменьшительная форма естественно передаёт небольшие детали изделия.
- source_word: מְשֻׁקָּדִים
  choice: в форме миндальных цветков
  rationale: Форма связана с миндалём и в описании светильника указывает на орнамент, подобный цветкам миндаля; такой перевод яснее, чем просто «миндалевидные».
- source_word: קָנֶה
  choice: ветвь
  rationale: В данном контексте это один из боковых элементов светильника. «Ветвь» сохраняет растительный образ орнамента и понятно современному читателю.
- source_word: כַּפְתֹּר
  choice: шаровидное украшение
  rationale: Точное устройство детали не вполне ясно; слово обозначает округлый декоративный выступ. Описательный перевод не отождествляет его без достаточных оснований с бутоном или плодом.
- source_word: פֶרַח
  choice: цветок
  rationale: Прямое и естественное обозначение цветочного декоративного элемента.
- source_word: כֵּן
  choice: так были устроены
  rationale: Выражение подводит итог описанной повторяющейся композиции на всех шести ветвях.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: выходивших из светильника
  rationale: Причастная конструкция изображает ветви исходящими из корпуса светильника; буквальный образ хорошо звучит по-русски.
- source_word: מְנֹרָה
  choice: светильник
  rationale: Общеупотребительное русское название предмета ясно передаёт значение без необязательной транслитерации «менора».
