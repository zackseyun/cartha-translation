  text: Он сделал шесты из древесины акации и обложил их золотом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Форма wayyiqtol от עשה продолжает повествовательную последовательность; в естественном русском начальный союз можно не передавать.
- source_word: בַּדֵּי
  choice: шесты
  rationale: В контексте принадлежностей святилища בַּד обозначает длинные шесты для переноски; «шесты» — ясное и привычное современное соответствие.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Сопряжённая конструкция обозначает материал — древесину акации. Такой вариант точен и естественен в современном литературном русском.
- source_word: וַיְצַף
  choice: и обложил
  rationale: В ремесленном контексте צפה означает покрыть предмет слоем материала; «обложил золотом» сохраняет традиционный библейский оттенок и остаётся понятным.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение прямого дополнения во множественном числе относится к шестам.
- source_word: זָהָב
  choice: золотом
  rationale: Русский творительный падеж естественно обозначает материал покрытия.
