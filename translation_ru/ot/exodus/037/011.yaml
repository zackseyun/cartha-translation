  text: He overlaid it with pure gold[a], and made for it a gold molding all around.
translation:
  language: ru
  text: Он покрыл его чистым золотом и сделал вокруг него золотой обод.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «золотую кайму»; традиционно: «золотой венец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: покрыл
  rationale: В данном ремесленном контексте глагол означает покрытие предмета слоем металла; «покрыл золотом» естественно и точно передаёт смысл по-русски.
- source_word: אֹתוֹ
  choice: его
  rationale: Местоимение прямого дополнения относится к столу из предыдущего стиха; в русском требуется мужской род.
- source_word: זָהָב טָהוֹר
  choice: чистым золотом
  rationale: Устойчивое и понятное обозначение золота высокой степени чистоты.
- source_word: וַיַּעַשׂ לוֹ
  choice: сделал вокруг него
  rationale: Отношение к столу выражено местоимением «него», а расположение изготовленной детали уточнено последующим סָבִיב.
- source_word: זֵר
  choice: кайму
  rationale: В контексте убранства стола слово обозначает окружающий его выступающий или декоративный край; «кайма» ясно передаёт эту функцию, не вызывая посторонней ассоциации с царским венцом.
- source_word: זָהָב
  choice: золотую
  rationale: Материал естественно выражен в русском относительным прилагательным.
- source_word: סָבִיב
  choice: вокруг
  rationale: Передаёт полное окружение стола без архаичного оттенка.
