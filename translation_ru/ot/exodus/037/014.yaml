translation:
  language: ru
  text: Кольца находились рядом с обрамлением и служили держателями для шестов, на которых переносили стол.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֻמַּת הַמִּסְגֶּרֶת
  choice: рядом с обрамлением
  rationale: В данном пространственном контексте לְעֻמַּת допускает значение близости или расположения напротив; «рядом с» естественно описывает положение колец у обрамления и не создаёт ложного впечатления об отдельном предмете напротив него.
- source_word: בָּתִּים לַבַּדִּים
  choice: держателями для шестов
  rationale: Буквально «вместилищами/гнёздами для шестов»; «держатели» ясно и по-русски естественно передаёт практическую функцию колец.
- source_word: לָשֵׂאת אֶת־הַשֻּׁלְחָן
  choice: на которых переносили стол
  rationale: 'Инфинитив цели выражает назначение шестов: с их помощью стол переносили. Такая конструкция устраняет возможную ошибочную связь глагола непосредственно с кольцами.'
