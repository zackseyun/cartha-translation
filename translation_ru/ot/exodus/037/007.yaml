    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Последовательная глагольная форма продолжает повествование. В русском тексте отдельное «и» не обязательно для передачи связи с предыдущим действием.
- source_word: שְׁנֵי כְרֻבִים
  choice: двух херувимов
  rationale: «Херувимы» — устоявшееся русское обозначение этих небесных существ и точная передача еврейского множественного числа.
- source_word: זָהָב
  choice: из золота
  rationale: Существительное указывает на материал, из которого были изготовлены херувимы.
- source_word: מִקְשָׁה
  choice: вычеканил
  rationale: Термин обозначает изделие, которому придают форму ударами по металлу. Глагол «вычеканил» естественно передаёт этот способ изготовления, не превращая возможное следствие — цельность изделия — в прямое значение слова.
- source_word: עָשָׂה אֹתָם
  choice: он вычеканил их
  rationale: Местоимение сохраняет повторное указание на изготовление херувимов, а выбранный глагол одновременно естественно выражает способ работы, обозначенный словом מִקְשָׁה.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: с двух концов
  rationale: 'Предлог מִן передаёт исходную точку: херувимы были выполнены так, что поднимались от двух концов крышки. Формулировка не заменяется на менее точное «на обоих концах».'
- source_word: הַכַּפֹּרֶת
  choice: крышки искупления
  rationale: Такой перевод одновременно указывает на предмет — крышку ковчега — и сохраняет связь еврейского термина с искуплением, не вводя менее понятное современному читателю традиционное наименование «очистилище».
theological_decisions:
- issue: Передача הַכַּפֹּרֶת в описании ковчега
  choice: крышка искупления
  alternative: крышка; очистилище
  rationale: Еврейское слово обозначает золотую крышку ковчега и связано с обрядом искупления. Основной перевод сохраняет обе стороны значения; примечание сообщает более краткий и традиционный варианты, не разрешая скрыто вопрос о точном оттенке термина.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор действия частично сохранён, но тяжеловесное буквальное выражение «сделал их чеканной работы» заменено естественным глаголом «вычеканил».
