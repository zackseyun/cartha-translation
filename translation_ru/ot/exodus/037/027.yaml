    text: 'Или: «под его каймой». Еврейское זֵר обозначает декоративную окантовку или ободок вокруг верхнего края.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте стоят два близких выражения: «на двух его боковых деталях, на двух его сторонах». Перевод сохраняет этот повтор, не сглаживая его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי טַבְּעֹת זָהָב
  choice: И… два золотых кольца
  rationale: Союз продолжает описание изготовления; сочетание материала с существительным естественно передаётся прилагательным «золотых».
- source_word: עָשָׂה לוֹ
  choice: сделал он для него
  rationale: Местоименный суффикс относится к жертвеннику из контекста; дательная конструкция сохранена без подмены референта.
- source_word: מִתַּחַת לְזֵרוֹ
  choice: под его ободком
  rationale: זֵר здесь обозначает декоративную кайму или выступающий ободок вокруг верхнего края предмета; «ободок» ясно и естественно в данном контексте.
- source_word: עַל שְׁתֵּי צַלְעֹתָיו
  choice: на двух его боковых деталях
  rationale: צלע может означать бок, ребро или конструктивную боковую часть. «Боковые детали» сохраняет предметно-конструктивный смысл и не сливает выражение со следующим צִדָּיו.
- source_word: עַל שְׁנֵי צִדָּיו
  choice: с двух его сторон
  rationale: צד — обычное обозначение стороны. Формулировка сохраняет второе, близкое по смыслу указание оригинала.
- source_word: לְבָתִּים לְבַדִּים
  choice: как держатели для шестов
  rationale: Буквально «как вместилища/гнёзда для шестов»; «держатели» понятно передаёт функцию колец, а בדים в описании святилища — шесты для переноски.
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: чтобы носить его на них
  rationale: Инфинитив выражает цель, а בָּהֶם указывает на средство; «на них» естественно относится к шестам, посредством которых переносили предмет.
