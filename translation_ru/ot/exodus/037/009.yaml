base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/009.yaml
  text: The cherubim had their wings spread upward[a], overshadowing the mercy seat with their wings, and their faces were toward one another; the faces of the cherubim were toward the mercy seat.
translation:
  language: ru
  text: Херувимы простирали крылья вверх и осеняли ими крышку[a]. Лица их были обращены друг к другу; лица херувимов были обращены к крышке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Особая крышка ковчега; также можно перевести: «крышка искупления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: херувимы
  rationale: Сохранён устоявшийся русский библейский термин для изображённых небесных существ и множественное число еврейского слова.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: простирали крылья вверх
  rationale: Естественно передаёт причастную конструкцию и направленность распростёртых крыльев; глагол «простирали» сохраняет возвышенный, но понятный регистр.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: осеняли ими
  rationale: Передаёт покрывание сверху посредством крыльев, не создавая впечатления, будто предмет был полностью скрыт; местоимение «ими» устраняет тяжеловесный повтор слова «крылья».
- source_word: הַכַּפֹּרֶת
  choice: крышка
  rationale: Основное значение предметного обозначения передано ясно и без внесения в текст спорного богословского толкования; культовая функция и возможный вариант «крышка искупления» отмечены в сноске.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: Лица их были обращены друг к другу
  rationale: Русское взаимное выражение естественно передаёт еврейскую идиому «каждый к своему брату», сохраняя акцент на лицах.
- source_word: אֶל הַכַּפֹּרֶת הָיוּ פְּנֵי הַכְּרֻבִים
  choice: и к крышке — так были обращены лица херувимов
  rationale: Сохраняет повторное упоминание крышки и лиц херувимов, а тире делает еврейское резюмирующее повторение понятным по-русски.
theological_decisions:
- issue: Передача הַכַּפֹּרֶת в описании ковчега
  choice: крышка
  alternative: крышка искупления; очистилище
  rationale: «Крышка» непосредственно обозначает данный предмет и не навязывает единственное объяснение связи слова с корнем כפר. Вариант «крышка искупления» сообщает о культовом смысле, тогда как традиционное «очистилище» в современном русском непрозрачно и может быть понято как место посмертного очищения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Синтаксис упрощён лишь настолько, чтобы ясно показать одновременно взаимную обращённость лиц и их наклон к крышке; формальный повтор исходного текста частично сохранён.
