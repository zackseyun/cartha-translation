  text: He made for it a frame a handbreadth wide all around[b][a], and he made a gold molding around its frame.
translation:
  language: ru
  text: Он сделал для него раму[a] шириной в ладонь по всему периметру и сделал вокруг этой рамы золотой ободок[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бортик» или «окаймление».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «золотой венец»; здесь «ободок» означает декоративную отделку вокруг рамы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: рама
  rationale: В контексте устройства стола слово обозначает окружающую его конструктивную раму; этот вариант конкретен и понятен современному читателю, при этом возможные значения «бортик» и «окаймление» отмечены в сноске.
- source_word: טֹפַח
  choice: шириной в ладонь
  rationale: Существительное обозначает меру длины — ширину ладони; добавление «шириной» естественно выражает в русском языке отношение меры к раме.
- source_word: סָבִיב
  choice: со всех сторон / вокруг
  rationale: Оба русских выражения передают охват по периметру; варьирование устраняет тяжеловесный повтор, не устраняя повторение самой пространственной характеристики в двух частях стиха.
- source_word: זֵר
  choice: ободок
  rationale: В описании священной утвари речь идёт об окружающей предмет декоративной или выступающей отделке. «Ободок» передаёт этот предметный смысл лучше традиционного «венец», которое может ошибочно восприниматься как царская корона.
- source_word: זָהָב
  choice: золотой
  rationale: Русское относительное прилагательное естественно обозначает материал ободка и точно передаёт существительное «золото» в определительной конструкции.
- source_word: לְמִסְגַּרְתּוֹ
  choice: вокруг этой рамы
  rationale: Форма указывает на связь золотого ободка с ранее названной рамой. В сочетании с последующим סָבִיב русский вариант ясно выражает его расположение по периметру рамы.
