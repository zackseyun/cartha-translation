lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: их бутоны
  rationale: В описании светильника слово обозначает округлые декоративные элементы, связанные с растительным узором; «бутоны» естественно передаёт этот образ, не исключая более общего значения «шишечки».
- source_word: וּקְנֹתָם
  choice: и ветви
  rationale: Хотя קָנֶה буквально может означать тростник или стебель, здесь речь идёт о расходящихся частях светильника; «ветви» — ясный и устойчивый вариант в данном контексте.
- source_word: מִמֶּנָּה
  choice: были из него
  rationale: Сохраняет буквальный образ происхождения «из него» и указывает, что детали составляли со светильником единое изделие.
- source_word: כֻּלָּהּ
  choice: весь светильник
  rationale: Женский суффикс относится к меноре; явное существительное устраняет неясность русского местоимения и передаёт охват изделия целиком.
- source_word: מִקְשָׁה אַחַת
  choice: был выкован как одно целое
  rationale: Передаёт одновременно способ изготовления ковкой и конструктивное единство изделия.
- source_word: זָהָב טָהוֹר
  choice: из чистого золота
  rationale: Обычный и точный русский эквивалент обозначения материала в описании святилища.
