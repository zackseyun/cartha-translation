  register: 'Современный литературный русский язык. Троекратный параллелизм еврейского текста сохранён по смыслу через перечисление первой, второй и третьей пары; это позволяет избежать тяжеловесного буквального повтора. Терминология согласуется с растительным образом светильника: «ветви» и нейтральное «утолщение».'
