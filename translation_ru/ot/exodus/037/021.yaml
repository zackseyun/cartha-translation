  yaml_path: translation/ot/exodus/037/021.yaml
  text: and a bulb under two branches from it[a], and a bulb under two branches from it, and a bulb under two branches from it, for the six branches coming out from it.
translation:
  language: ru
  text: И утолщение[a] под двумя ветвями, выходящими из него, и утолщение под двумя ветвями, выходящими из него, и утолщение под двумя ветвями, выходящими из него — для шести ветвей, выходящих из него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шишка» — округлый декоративный элемент на светильнике.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַפְתֹּר
  choice: утолщение
  rationale: В описании светильника слово обозначает округлый декоративный элемент. «Утолщение» понятно современному читателю и не создаёт неуместной ассоциации с цветочной луковицей; возможное «шишка» отмечено в сноске.
- source_word: תַּחַת
  choice: под
  rationale: Прямо и естественно передаёт расположение декоративного элемента ниже места выхода каждой пары ветвей.
- source_word: שְׁנֵי הַקָּנִים
  choice: каждая пара ветвей
  rationale: קנה в контексте светильника означает боковую ветвь. Формулировка с «парой» естественно передаёт трижды повторённое שְׁנֵי и поясняет распределение шести ветвей без изменения смысла.
- source_word: מִמֶּנָּה
  choice: из него
  rationale: Местоимение относится к светильнику; в русском языке «светильник» мужского рода, поэтому грамматический род закономерно меняется.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: для шести ветвей
  rationale: Сохраняет краткое итоговое соотнесение трёх утолщений с шестью боковыми ветвями.
- source_word: הַיֹּצְאִים מִמֶּנָּה
  choice: выходящих из него
  rationale: Близко передаёт причастную конструкцию и образ ветвей, отходящих от центрального ствола светильника.
theological_decisions: []
