  text: He cast four gold rings for it and put the rings on the four corners at its four feet[a].
translation:
  language: ru
  text: Он отлил для него четыре золотых кольца и поместил их на четырёх углах у четырёх его ножек[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на четырёх углах, принадлежавших четырём его ножкам».'
    reason: Еврейское выражение допускает как пространственное понимание («у ножек»), так и указание на принадлежность углов ножкам.
lexical_decisions:
- source_word: וַיִּצֹק
  choice: отлил
  rationale: В контексте изготовления металлических деталей глагол обозначает литьё расплавленного металла, а не простое наливание.
- source_word: לוֹ
  choice: для него
  rationale: Местоимение относится к упомянутому ранее столу; в русском языке «стол» мужского рода.
- source_word: טַבְּעֹת זָהָב
  choice: золотые кольца
  rationale: Прямое и естественное обозначение золотых колец для шестов.
- source_word: וַיִּתֵּן
  choice: поместил
  rationale: Передаёт намеренное размещение колец и соответствует dignified modern Russian register.
- source_word: פֵּאֹת
  choice: углах
  rationale: В описании предмета обстановки слово обозначает его крайние точки, то есть углы.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: у четырёх его ножек
  rationale: Сохраняет пространственную связь углов с четырьмя ножками стола, не уточняя конструкцию сверх сказанного в еврейском тексте.
