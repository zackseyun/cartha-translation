  text: He made the poles of acacia wood and overlaid them with gold.
translation:
  language: ru
  text: Он сделал шесты из древесины акации и обложил их золотом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Форма wayyiqtol от עשה передаёт последовательное действие в повествовании; в естественном русском связку וַ можно не выражать отдельным союзом.
- source_word: הַבַּדִּים
  choice: шесты
  rationale: В контексте устройства священных предметов בַּדִּים обозначает шесты, служившие для их переноски.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Конструкция обозначает материал изготовления; такой перевод точен и естественен в современном русском.
- source_word: וַיְצַף
  choice: и обложил
  rationale: В ремесленном контексте צפה означает покрыть поверхность слоем ценного материала; «обложил золотом» сохраняет традиционный и понятный русский оборот.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение мужского рода множественного числа отсылает к шестам.
- source_word: זָהָב
  choice: золотом
  rationale: Существительное обозначает материал покрытия и в русском ставится в творительном падеже после глагола «обложил».
