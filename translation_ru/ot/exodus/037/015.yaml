lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Ваййиктоль продолжает последовательное повествование; в современном русском соединительный союз можно опустить без потери смысла.
- source_word: הַבַּדִּים
  choice: шесты
  rationale: Слово обозначает шесты, предназначенные для переноски священной утвари; «шесты» — точный и понятный современный эквивалент.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Сопряжённая конструкция обозначает материал. Такой перевод естественен по-русски и сохраняет указание на породу дерева.
- source_word: וַיְצַף אֹתָם זָהָב
  choice: и покрыл их золотом
  rationale: В ремесленном контексте глагол צפה означает покрытие поверхности металлом; «покрыл золотом» точно и естественно передаёт действие.
- source_word: לָשֵׂאת
  choice: чтобы носить
  rationale: Инфинитив выражает назначение шестов. Несовершенный вид «носить» передаёт их постоянную функцию, а не одноразовое действие.
- source_word: הַשֻּׁלְחָן
  choice: стол
  rationale: Еврейский текст употребляет обычное слово «стол» с определённым артиклем; контекст уже определяет его как стол скинии.
