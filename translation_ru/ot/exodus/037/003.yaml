  yaml_path: translation/ot/exodus/037/003.yaml
  text: He cast for it four rings of gold on its four feet[c][b][a], with two rings on one side and two rings on the other side.
translation:
  language: ru
  text: 'Он отлил для него четыре золотых кольца на четырёх его ножках[a]: два кольца — на одной его стороне, два — на другой[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на четырёх его углах»; или: «на четырёх его опорах». Еврейское слово может обозначать ножки, нижние оконечности или опорные точки.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на одной его стороне… на второй его стороне».'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּצֹק
  choice: отлил
  rationale: В контексте изготовления металлических предметов глагол יצק обозначает литьё расплавленного металла; «отлил» точно и естественно передаёт этот смысл.
- source_word: לוֹ
  choice: для него
  rationale: Местоименный суффикс относится к ковчегу, который в русском языке мужского рода.
- source_word: טַבְּעֹת זָהָב
  choice: золотых кольца
  rationale: Естественное русское соответствие еврейскому сочетанию «кольца из золота».
- source_word: פַּעֲמֹתָיו
  choice: его ножках
  rationale: Слово может обозначать ноги, нижние оконечности или опорные точки предмета. «Ножки» конкретно и понятно передаёт наиболее вероятный смысл применительно к ковчегу, а неоднозначность отмечена в сноске.
- source_word: צַלְעוֹ
  choice: его стороне
  rationale: В описании предмета צלע естественно означает бок или сторону; «сторона» подходит современному литературному русскому.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: на одной его стороне ... на другой
  rationale: Это естественная русская передача буквального противопоставления «на одной стороне ... на второй стороне» без изменения смысла.
