lexical_decisions:
- source_word: וַיְצַף
  choice: покрыл
  rationale: В контексте изготовления священной утвари глагол означает покрытие деревянного предмета слоем металла; «покрыл» естественно и точно передаёт действие.
- source_word: זָהָב טָהוֹר
  choice: чистым золотом
  rationale: Устойчивое современное соответствие, передающее качество и чистоту материала.
- source_word: גַּגּוֹ
  choice: его верх
  rationale: Хотя существительное обычно означает «крыша», здесь речь идёт о верхней поверхности небольшого жертвенника; «верх» естественно в данном предметном контексте.
- source_word: קִירֹתָיו
  choice: его стенки
  rationale: Буквальное значение связано со стенами; применительно к небольшому предмету «стенки» точнее и естественнее, чем «стены» или менее буквальное «боковые стороны».
- source_word: סָבִיב
  choice: со всех сторон / вокруг
  rationale: Оба русских выражения в соответствующих местах передают охват предмета по всему периметру и позволяют избежать неестественного повтора.
- source_word: קַרְנֹתָיו
  choice: его рога
  rationale: Сохранён установленный буквальный термин для выступов по углам жертвенника; его не следует устранять пояснительным пересказом.
- source_word: זֵר
  choice: кайму
  rationale: В данном контексте слово обозначает декоративное окаймление или выступающий ободок вокруг предмета. «Кайма» понятна современному читателю; традиционная альтернатива «венец» сохранена в сноске.
