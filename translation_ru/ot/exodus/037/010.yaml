base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/010.yaml
  text: He made the table of acacia wood; its length was two cubits[a], its width one cubit, and its height one and a half cubits.
translation:
  language: ru
  text: 'И сделал он стол из древесины акации: два локтя длиной, один локоть шириной и полтора локтя высотой.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: И сделал он
  rationale: Форма с последовательным ו продолжает повествование о завершённых действиях; начальное «И» естественно связывает стих с предыдущим контекстом.
- source_word: הַשֻּׁלְחָן
  choice: стол
  rationale: Существительное с определённым артиклем обозначает конкретный стол скинии; в русском контексте определённость передаётся без артикля.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Конструктивное сочетание буквально указывает на древесину акации; этот вариант точен и понятен современному читателю.
- source_word: אַמָּתַיִם אָרְכּוֹ
  choice: два локтя длиной
  rationale: Сохранена древняя мера длины «локоть», а русская конструкция естественно передаёт размер предмета.
- source_word: וְאַמָּה רָחְבּוֹ
  choice: один локоть шириной
  rationale: Точно передаёт второй размер и сохраняет параллельную структуру перечисления.
- source_word: וְאַמָּה וָחֵצִי קֹמָתוֹ
  choice: полтора локтя высотой
  rationale: «Полтора локтя» естественно по-русски передаёт «локоть с половиной», а קֹמָה в описании предмета означает высоту.
