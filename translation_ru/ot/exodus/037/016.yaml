base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/016.yaml
  text: 'He made the utensils that were on the table: its plates[a], its cups, its pitchers, and its bowls with which the drink offering was poured out, of pure gold.'
translation:
  language: ru
  text: 'Он сделал принадлежности, находившиеся на столе: блюда[a], чаши, кувшины и сосуды, которыми совершалось возлияние, — всё из чистого золота.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тарелки, небольшие чаши, кувшины и чаши для возлияний». Несколько названий сосудов в этом стихе редки или зависят от контекста, поэтому их точный вид и назначение не вполне ясны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: принадлежности
  rationale: Широкое обозначение предметов и сосудов; «принадлежности» естественно охватывает весь набор столовой утвари.
- source_word: אֲשֶׁר עַל הַשֻּׁלְחָן
  choice: находившиеся на столе
  rationale: Передаёт буквальное пространственное значение «которые [были] на столе», не заменяя его толкованием назначения.
- source_word: קְעָרֹתָיו
  choice: блюда
  rationale: Существительное обозначает блюдо или неглубокий сосуд; «блюда» уместно в контексте стола.
- source_word: כַּפֹּתָיו
  choice: чаши
  rationale: В данном культовом контексте слово, буквально связанное с ладонью или ложкой, обозначает небольшие вместилища; точная форма предмета неясна.
- source_word: מְנַקִּיֹּתָיו
  choice: кувшины
  rationale: Редкий термин, вероятно обозначающий сосуд для жидкости или наливания; «кувшины» — понятный современный эквивалент без архаизма.
- source_word: הַקְּשָׂוֹת
  choice: сосуды
  rationale: Редкий термин обозначает ёмкости, связанные с возлиянием. Общее слово «сосуды» сохраняет неопределённость их точной формы.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: из которых совершалось возлияние
  rationale: Страдательная форма глагола נסך указывает на совершение культового возлияния; безличная русская конструкция сохраняет пассивность и не называет действующее лицо.
- source_word: זָהָב טָהוֹר
  choice: из чистого золота
  rationale: Материал относится ко всему перечисленному набору; вынесение оборота к началу устраняет возможную двусмысленность русского синтаксиса.
