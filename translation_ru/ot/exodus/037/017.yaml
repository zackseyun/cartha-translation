  yaml_path: translation/ot/exodus/037/017.yaml
  text: He made the lampstand of pure gold[a]. He made the lampstand of hammered work; its base and its shaft, its cups, its buds[b], and its blossoms were of one piece with it.
translation:
  language: ru
  text: Он сделал светильник из чистого золота. Светильник он выковал[a]; его основание и ствол, чашечки, бутоны[b] и цветы были выкованы заодно с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделал чеканной работы». Еврейское слово указывает на металл, которому придавали форму ударами молота.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «шишечки». Еврейское слово обозначает округлые декоративные выступы; перевод «бутоны» отражает растительный узор светильника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרָה
  choice: светильник
  rationale: В контексте святилища это многоветвевой культовый светильник, а не отдельная лампа; «светильник» — естественный и устоявшийся русский эквивалент.
- source_word: זָהָב טָהוֹר
  choice: чистое золото
  rationale: В описании материала טָהוֹר обозначает чистоту и отсутствие примесей; выражение естественно по-русски.
- source_word: מִקְשָׁה
  choice: выковал как единое целое
  rationale: Термин указывает на изготовление металла ковкой из цельной массы. Глагольная передача естественна в русском и в сочетании с заключительной фразой сохраняет как способ изготовления, так и цельность изделия.
- source_word: יְרֵכָהּ
  choice: его основание
  rationale: Буквально слово может означать «бедро» или «бок», но применительно к светильнику обозначает его нижнюю опорную часть.
- source_word: קָנָהּ
  choice: ствол
  rationale: Единственное число здесь обозначает центральную вертикальную часть светильника. «Ствол» сохраняет растительный образ и не смешивает её с боковыми ветвями.
- source_word: גְּבִיעֶיהָ
  choice: его чашечки
  rationale: Уменьшительная форма хорошо передаёт декоративные чашеобразные элементы светильника.
- source_word: כַּפְתֹּרֶיהָ
  choice: бутоны
  rationale: Слово обозначает округлые декоративные выступы; «бутоны» соответствует растительному оформлению светильника, хотя возможна более формальная передача «шишечки».
- source_word: פְרָחֶיהָ
  choice: цветы
  rationale: Передаёт цветочный декоративный мотив и естественно сочетается с «бутонами».
- source_word: מִמֶּנָּה הָיוּ
  choice: составляли с ним одно целое
  rationale: Фраза означает, что перечисленные части были не присоединены отдельно, а составляли единое изделие со светильником.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Он сделал ... он выковал
  rationale: Первое עשה передано общим «сделал», а второе конкретизировано по связанному с ним מִקְשָׁה, чтобы по-русски ясно выразить способ изготовления без потери повторной синтаксической конструкции.
