  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: вставил
  rationale: В сочетании с шестами и кольцами глагол בוא описывает введение шестов в кольца; «вставил» естественно и точно передаёт конкретное действие.
- source_word: הַבַּדִּים
  choice: шесты
  rationale: בַּדִּים — шесты, предназначенные для переноски священной утвари; «шесты» — ясный современный термин.
- source_word: בַּטַּבָּעֹת
  choice: в кольца
  rationale: Предлог ב в данном контексте обозначает помещение внутрь колец; по-русски направление естественно выражается винительным падежом.
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: по сторонам ковчега
  rationale: צְלָעוֹת здесь обозначает боковые стороны или боковые части ковчега; оборот «по сторонам» ясно указывает расположение колец.
- source_word: הָאָרֹן
  choice: ковчег
  rationale: Для אָרוֹן как священного ларца в контексте скинии «ковчег» является устоявшимся и понятным русским соответствием.
- source_word: לָשֵׂאת
  choice: чтобы носить
  rationale: Инфинитив выражает назначение шестов. Несовершенный вид «носить» передаёт их постоянную функцию, а не единичное действие.
