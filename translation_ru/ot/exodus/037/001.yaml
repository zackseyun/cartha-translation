base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/001.yaml
  text: Bezalel made the ark of acacia wood. Its length was two and a half cubits[a], its width one and a half cubits, and its height one and a half cubits.
translation:
  language: ru
  text: Веселеил сделал ковчег из акациевого дерева. Его длина — два с половиной локтя[a], ширина — полтора локтя, высота — полтора локтя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Локоть — древняя единица длины; его точная величина различалась.
    reason: Поясняет сохранённую в основном тексте древнюю единицу измерения, не создавая видимости точно установленного современного эквивалента.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Обычное значение глагола עשה — «делать, изготовлять»; «сделал» прямо передаёт смысл, не добавляя отсутствующего в тексте оттенка.
- source_word: בְּצַלְאֵל
  choice: Веселеил
  rationale: Использована традиционная русская библейская форма имени, узнаваемая читателями и соответствующая литературному регистру.
- source_word: הָאָרֹן
  choice: ковчег
  rationale: Хотя אָרוֹן может обозначать ящик или сундук, в контексте скинии речь идёт о священном ковчеге; традиционный термин здесь точен и узнаваем.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Еврейское сочетание обозначает материал; такая формулировка естественна по-русски и ясно указывает на древесину.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: два с половиной локтя
  rationale: Сохранена древняя единица измерения без приблизительного пересчёта; форма естественна для современного русского языка.
- source_word: אָרְכּוֹ
  choice: длина его
  rationale: Прямо передаёт существительное с местоименным суффиксом; порядок слов поддерживает достойный повествовательный стиль.
- source_word: וְאַמָּה וָחֵצִי
  choice: полтора локтя
  rationale: Естественный русский эквивалент выражения «локоть с половиной» без изменения величины.
- source_word: רָחְבּוֹ
  choice: ширина
  rationale: Контекстуально точное современное обозначение поперечного размера предмета.
- source_word: קֹמָתוֹ
  choice: высота
  rationale: В описании размеров предмета קוֹמָה обозначает его вертикальную протяжённость.
