  source_fidelity: 'Основной смысл передан верно: два херувима расположены у противоположных краёв כַּפֹּרֶת и сделаны из неё как единое целое с нею. Однако в черновике глагол «сделал» неоправданно поставлен также в первой части, тогда как в еврейском он относится ко всей конструкции и стоит далее; «из самой крышки» добавляет усиление, которого в тексте нет.'
  naturalness: «Одного херувима он сделал с одного края» звучит несколько тяжеловесно и создаёт нежелательное впечатление двух отдельных актов изготовления. Эллиптическая конструкция в первой части и единое сказуемое во второй естественнее для современного литературного русского.
  terminology: «Херувим» сохранён правильно. «Крышка очищения» возможна как функционально окрашенный перевод כַּפֹּרֶת; примечание прозрачно сообщает альтернативы. Следует сохранить указание, что это крышка ковчега, не навязывая значение «престол».
