  yaml_path: translation/ot/exodus/037/008.yaml
  text: one cherub from one end on this side[a], and one cherub from one end on that side; from the mercy seat he made the cherubim on its two ends.
translation:
  language: ru
  text: Одного херувима — с одного края, а другого херувима — с другого края; из крышки очищения он сделал херувимов на обоих её краях[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крышки»; также переводят: «крышки искупления» или «престола милости». Еврейское слово «каппорет» обозначает золотую крышку ковчега, связанную с обрядом очищения и искупления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרוּב
  choice: херувим
  rationale: Устоявшийся русский термин точно обозначает особых небесных существ, связанных с ковчегом; описательная замена вроде «крылатое существо» была бы излишне толковательной.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: с одного края ... с другого
  rationale: Парная конструкция указывает на два противоположных края; по-русски это естественно и ясно передаётся симметричной формулой.
- source_word: הַכַּפֹּרֶת
  choice: крышка очищения
  rationale: כַּפֹּרֶת — особый термин для золотой крышки ковчега, связанной с обрядом очищения/искупления. Выбранный вариант сохраняет и предметное значение, и культовую функцию, не сводя термин просто к «крышке».
- source_word: עָשָׂה
  choice: он сделал
  rationale: Обычное значение глагола עשה здесь не требует более образного русского глагола вроде «изваял».
- source_word: מִן הַכַּפֹּרֶת ... מִשְּׁנֵי קְצוֹתָיו
  choice: на обоих краях крышки ... из самой крышки
  rationale: Предлог מִן указывает, что херувимы были выполнены из крышки как её неотделимые части; добавление «самой» естественно подчёркивает этот смысл по-русски, а «на обоих краях» ясно передаёт расположение.
theological_decisions:
- issue: Передача культового термина הַכַּפֹּרֶת
  choice: крышка очищения
  alternative: крышка; крышка искупления; престол милости
  rationale: Основной вариант сохраняет связь с обрядовым очищением, не превращая предмет в буквальный «престол» и не выбирая однозначно между близкими богословскими категориями очищения, искупления и умилостивления. Другие традиционные возможности указаны в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис перестроен ради ясности, но повтор «херувима/херувимов» и указание на оба края сохраняют композицию и смысл древнееврейского текста.
