revisions:
- from: Одного херувима он сделал с одного края, а другого херувима — с другого; херувимов на обоих краях крышки очищения[a] он сделал из самой крышки.
  to: Одного херувима — с одного края, а другого херувима — с другого края; из крышки очищения он сделал херувимов на обоих её краях[a].
  rationale: Исправлен порядок фразы, чтобы единое «сделал» охватывало обоих херувимов и их изготовление из крышки, как в оригинале. Убрано не необходимое источнику усиление «самой». Парное противопоставление краёв, термин «херувим» и нейтральная передача пространственного отношения сохранены.
  reviewer_model: gpt-5.6-terra
