  text: He made it and all its utensils from a talent of pure gold[a].
translation:
  language: ru
  text: Из таланта чистого золота он сделал её и все её принадлежности[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все её сосуды» или «все её орудия». Еврейское слово כֵּלִים имеет широкое значение и обозначает различные предметы и принадлежности светильника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: талант
  rationale: В контексте изготовления скинии слово обозначает древнюю меру веса. «Талант» — традиционное и точное русское название этой единицы.
- source_word: זָהָב טָהוֹר
  choice: чистое золото
  rationale: Естественное русское обозначение золота без примесей, соответствующее смыслу сочетания в контексте изготовления священной утвари.
- source_word: עָשָׂה
  choice: сделал
  rationale: Прямой и нейтральный эквивалент общеупотребительного глагола «делать, изготавливать».
- source_word: אֹתָהּ
  choice: её
  rationale: Местоименный суффикс женского рода отсылает к меноре, названной в предыдущем контексте; русский перевод сохраняет эту отсылку, не повторяя существительное.
- source_word: וְאֵת כָּל כֵּלֶיהָ
  choice: и все её принадлежности
  rationale: כֵּלִים — широкое обозначение связанных с предметом сосудов, орудий или иных изделий. «Принадлежности» естественно передаёт собирательный смысл, не сужая его до одного вида предметов.
