  text: וּ/בַ/מְּנֹרָ֖ה אַרְבָּעָ֣ה גְבִעִ֑ים מְשֻׁ֨קָּדִ֔ים כַּפְתֹּרֶ֖י/הָ וּ/פְרָחֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/020.yaml
  text: And on the lampstand were four cups shaped like almond blossoms[a], its buds and its flowers.
translation:
  language: ru
  text: На светильнике — четыре чашечки в виде цветков миндаля[a], его бутоны[b] и цветы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «четыре миндалевидные чашечки».'
    reason: Причастие מְשֻׁקָּדִים может описывать чашечки как выполненные в форме цветков миндаля либо шире — как миндалевидные.
  - marker: b
    text: 'Или: «выступы»; традиционно также «шишечки».'
    reason: כַּפְתּוֹר обозначает округлый выступ или утолщение; перевод «бутоны» передаёт растительный облик украшения, но не исчерпывает предметного значения.
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: На светильнике
  rationale: Предлог בְּ здесь обозначает расположение декоративных деталей на светильнике; «на» естественно передаёт это пространственное отношение по-русски.
- source_word: אַרְבָּעָה
  choice: четыре
  rationale: Точное соответствие количественному числительному, согласованному с «чашечками».
- source_word: גְבִעִים
  choice: чашечки
  rationale: Слово обозначает чашеобразные декоративные элементы; уменьшительная форма естественна для небольших деталей светильника.
- source_word: מְשֻׁקָּדִים
  choice: в виде цветков миндаля
  rationale: Причастие описывает оформление чашечек по образцу миндаля, вероятнее всего его цветков; формулировка сохраняет образ и остаётся понятной современному читателю.
- source_word: כַּפְתֹּרֶיהָ
  choice: его бутоны
  rationale: В описании светильника термин обозначает округлые выступающие украшения. «Бутоны» естественно вписываются в растительный образ, но предметное значение «выступы» сохранено в примечании.
- source_word: וּפְרָחֶיהָ
  choice: и цветы
  rationale: Прямое и ясное соответствие слову со значением «цветы, цветки»; местоименное «его» относится к светильнику и распространяется на оба однородных элемента.
