  text: וַ/יֹּ֣אמֶר יְהוָ֔ה הִנֵּ֥ה מָק֖וֹם אִתִּ֑/י וְ/נִצַּבְתָּ֖ עַל הַ/צּֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/021.yaml
  text: And the LORD said, “Look, there is a place by me, and you shall stand on the rock.”
translation:
  language: ru
  text: 'И сказал ГОСПОДЬ: «Вот место рядом со Мной; встань на этой скале».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона, соответствующая принятому в консультационном тексте LORD.
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественно и кратко передаёт указательное привлечение внимания в данном контексте.
- source_word: מָקוֹם אִתִּי
  choice: место рядом со Мной
  rationale: Передаёт пространственный смысл אִתִּי («при Мне, рядом со Мной»), не создавая неестественного русского оборота «место со Мной».
- source_word: וְנִצַּבְתָּ
  choice: встань
  rationale: Форма может иметь значение будущего или предписания; в последовательности Божьих указаний естественно звучит повелительное «встань».
- source_word: עַל הַצּוּר
  choice: на этой скале
  rationale: Определённый артикль указывает на конкретную скалу в непосредственной ситуации; указательное «этой» естественно выражает определённость по-русски.
theological_decisions:
- issue: Пространственное выражение אִתִּי применительно к Богу
  choice: рядом со Мной
  alternative: при Мне / у Меня
  rationale: Сохранён прямой пространственный образ повествования без попытки метафизически объяснить Божье присутствие.
- issue: Модальность וְנִצַּבְתָּ
  choice: встань
  alternative: ты встанешь / станешь
  rationale: Контекст последующего наставления поддерживает предписание, хотя еврейская форма сама по себе допускает оттенок будущего.
translation_notes:
  register: Современный литературный русский язык; краткая, величественная повествовательная формула. Местоимение «Мной» написано с прописной буквы по принятой русской библейской традиции.
