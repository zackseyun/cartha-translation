  text: וַ/יִּשְׁמַ֣ע הָ/עָ֗ם אֶת הַ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה וַ/יִּתְאַבָּ֑לוּ וְ/לֹא שָׁ֛תוּ אִ֥ישׁ עֶדְי֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/004.yaml
  text: When the people heard this bad news[a], they mourned[b], and no man put on his ornaments.
translation:
  language: ru
  text: Услышав эту тяжёлую весть[a], народ стал скорбеть, и никто не надел своих украшений[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «это тяжёлое (или дурное) слово/сообщение».'
    reason: Сноска сохраняет более буквальное значение דָּבָר и неоднозначность רָע, тогда как основной текст передаёт выражение естественным русским оборотом.
  - marker: b
    text: 'Или: «своего убранства»; еврейское слово обозначает различные предметы, служащие украшением.'
    reason: Указан широкий смысл עֲדִי, не ограниченный ювелирными изделиями.
lexical_decisions:
- source_word: וַיִּשְׁמַע הָעָם
  choice: Услышав… народ
  rationale: שׁמע здесь означает восприятие сообщённого; собирательное הָעָם естественно передаётся словом «народ» с глаголом в единственном числе.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: эту тяжёлую весть
  rationale: דָּבָר буквально означает «слово, дело, сообщение», но здесь отсылает к только что прозвучавшему объявлению Бога. «Весть» естественна по-русски, а «тяжёлая» передаёт контекстуальный смысл רָע без ненужного оттенка нравственного зла.
- source_word: וַיִּתְאַבָּלוּ
  choice: стал скорбеть
  rationale: Форма от אבל обозначает скорбь и состояние траура; в сочетании с собирательным «народ» единственное число звучит естественно и сохраняет значение начала реакции.
- source_word: וְלֹא שָׁתוּ אִישׁ
  choice: и никто не надел
  rationale: 'Буквально: «и не возложил каждый/человек». При отрицании אִישׁ имеет распределительное значение «никто»; «надел» идиоматично передаёт שׁית с украшениями.'
- source_word: עֶדְיוֹ עָלָיו
  choice: своих украшений
  rationale: עֲדִי охватывает украшения и предметы убранства вообще. Возвратное «своих» естественно выражает индивидуальную соотнесённость суффикса и עָלָיו.
