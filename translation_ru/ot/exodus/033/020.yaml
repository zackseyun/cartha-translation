  text: But he said[a], “You cannot see my face[b], for man shall not see me and live.”
translation:
  language: ru
  text: 'Но Он сказал: «Ты не можешь увидеть Моё лицо[a], ведь человек[b] не может увидеть Меня и остаться в живых».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моё присутствие». Буквально по-еврейски: «Моё лицо».'
    reason: lexical_alternative
  - marker: b
    text: Здесь «человек» означает любого человека; сказанное относится ко всему человечеству.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но Он сказал
  rationale: Последовательная конструкция с וַ продвигает повествование, а союз «но» естественно передаёт противопоставление просьбе Моисея в предыдущем стихе.
- source_word: לֹא תוּכַל
  choice: ты не можешь
  rationale: Глагол יכל обозначает здесь способность или возможность, а не запрет; современное русское «не можешь» точно и естественно передаёт этот смысл.
- source_word: לִרְאֹת
  choice: увидеть
  rationale: ראה здесь обозначает зрительное восприятие; совершенный вид естественен после модального «не можешь».
- source_word: אֶת־פָּנַי
  choice: Моё лицо
  rationale: פָּנִים буквально означает «лицо». Конкретный образ сохранён в основном тексте, а возможный смысл «присутствие» отмечен в сноске.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание сказанного; «потому что» ясно выражает причинно-пояснительную связь в современном русском языке.
- source_word: לֹא יִרְאַנִי
  choice: не может увидеть Меня
  rationale: Имперфект выражает общее положение. В сочетании с последующим וָחָי русская модальная конструкция естественно передаёт невозможность увидеть Бога и при этом остаться живым.
- source_word: הָאָדָם
  choice: человек
  rationale: Существительное употреблено в единственном числе с обобщающим значением. Русское «человек» сохраняет и грамматическую форму, и указание на любого представителя человечества.
- source_word: וָחָי
  choice: и остаться в живых
  rationale: Форма выражает итог или следствие. Оборот «остаться в живых» ясно показывает, что речь идёт о продолжении жизни после такого видения.
theological_decisions:
- issue: Антропоморфный образ в выражении «Моё лицо»
  choice: Сохранить «Моё лицо» в основном тексте
  alternative: Моё присутствие
  rationale: Еврейский текст использует конкретный образ «лица». Перевод не заменяет его толкованием, но указывает возможный смысл «присутствие» в сноске.
- issue: Обобщающее значение הָאָדָם
  choice: человек
  alternative: любой человек; человечество
  rationale: Форма единственного числа имеет родовое значение и относится ко всем людям, что кратко пояснено в сноске.
- issue: Связь между видением Бога и жизнью
  choice: не может увидеть Меня и остаться в живых
  alternative: не увидит Меня и останется жив
  rationale: Выбранная конструкция в естественном русском языке передаёт общее утверждение о несовместимости полного видения Бога с продолжением человеческой жизни, не уточняя сверх текста природу этой невозможности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; конкретный еврейский образ «лица» сохранён. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской издательской традицией.
