  terminology: «Присутствие» является наиболее прозрачной русской передачей פָּנֶיךָ в данном идиоматическом контексте. Сноска должна сохранять буквальное «лицо» и не приписывать тексту избыточный акцент «Ты Сам». Написание «Твоё» и «Ему» с прописной буквы согласовано с заявленным регистром.
