  text: Then he said to him[a], “If your presence does not go, do not bring us up from here.”
translation:
  language: ru
  text: 'Тогда Моисей сказал Ему: «Если Твоё присутствие не пойдёт с нами, не выводи нас отсюда».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Тогда Моисей сказал Ему
  rationale: Последовательная форма глагола продолжает повествование, поэтому «тогда» естественно передаёт ход событий. Имя Моисея восстановлено из ближайшего контекста для ясности; местоимение «Ему» относится к Богу.
- source_word: אִם אֵין פָּנֶיךָ הֹלְכִים
  choice: Если Ты Сам не пойдёшь с нами
  rationale: 'Буквально сказано: «если Твоё лицо не идёт». В данном контексте «лицо» обозначает личное присутствие Бога. Русское «Ты Сам» естественно выражает эту мысль и сохраняет личностный акцент; «с нами» делает подразумеваемое сопровождение явным.'
- source_word: אַל תַּעֲלֵנוּ
  choice: не выводи нас
  rationale: Порода хифиль глагола עלה имеет каузативный смысл «поднимать, выводить, вести вверх». В контексте дальнейшего пути Израиля «не выводи нас» звучит по-русски естественно и сохраняет смысл побуждения покинуть стоянку.
- source_word: מִזֶּה
  choice: отсюда
  rationale: Предлог с указательным словом обозначает нынешнее место говорящих; «отсюда» — точное и естественное русское соответствие.
theological_decisions:
- issue: Передача פָּנֶיךָ применительно к Богу
  choice: Ты Сам
  alternative: Твоё присутствие; Твоё лицо
  rationale: Еврейское «лицо» здесь является образом личного присутствия Бога среди народа. «Ты Сам» передаёт этот смысл естественным современным русским языком, не сводя речь к безличной силе; буквальный образ сохранён в сноске.
- issue: Подразумеваемое сопровождение Израиля
  choice: не пойдёшь с нами
  alternative: не пойдёшь
  rationale: В еврейском тексте объект сопровождения прямо не назван в условной части, но очевиден из контекста и последующего «нас». Добавление «с нами» устраняет неестественную для русского языка недосказанность, не меняя смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Формула «Ты Сам» передаёт личное Божье присутствие естественнее, чем формально возможное, но тяжеловесное «Твоё присутствие не пойдёт». Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятому русскому библейскому регистру.
