  source_fidelity: В условной части הֹלְכִים относится к פָּנֶיךָ — буквально «Твоё лицо/лица идёт/идут», идиоматически «Твоё присутствие не идёт». Вариант «Ты Сам не пойдёшь» передаёт общий контекстный смысл, но заменяет образ и грамматический субъект оригинала прямым обращением к Богу и добавляет усиление «Сам», которого текст не выражает прямо. «С нами» — допустимое прояснение сопровождающего значения. «Не выводи нас отсюда» точно передаёт отрицательное побуждение, каузативный смысл תַּעֲלֵנוּ и מִזֶּה.
