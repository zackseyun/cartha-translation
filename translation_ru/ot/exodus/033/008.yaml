base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/008.yaml
  text: And whenever Moses went out to the tent[a], all the people would rise and stand, each man at the entrance of his tent[b], and they would watch after Moses until he entered the tent.
translation:
  language: ru
  text: И всякий раз, когда Моисей выходил к шатру[a], весь народ поднимался и становился — каждый у входа в свой шатёр[b] — и смотрел вслед Моисею, пока он не войдёт в шатёр.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Шатру» — то есть к упомянутому в контексте шатру встречи.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каждый мужчина»; форма единственного числа мужского рода употреблена применительно к отдельным членам народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И всякий раз
  rationale: Сочетание waw с формой היה вводит повторявшееся обстоятельство; эта формулировка естественно передаёт обычное, многократное действие.
- source_word: כְּצֵאת מֹשֶׁה
  choice: когда Моисей выходил
  rationale: Инфинитив с כְּ имеет временное значение, а несовершенный вид русского глагола передаёт повторяемость действия.
- source_word: אֶל הָאֹהֶל
  choice: к шатру
  rationale: Сохранено простое обозначение «шатёр», без добавления отсутствующих здесь в еврейском тексте слов «собрания» или «откровения».
- source_word: יָקוּמוּ ... וְנִצְּבוּ
  choice: вставал, и каждый становился
  rationale: Глагольные формы описывают обычное повторявшееся действие; «становился» передаёт занятие определённого места.
- source_word: אִישׁ
  choice: каждый
  rationale: Единственное число употреблено дистрибутивно по отношению к членам народа; по-русски это естественно выражается словом «каждый», а буквальная особенность отмечена в сноске.
- source_word: פֶּתַח אָהֳלוֹ
  choice: у входа в свой шатёр
  rationale: Формулировка ясно передаёт положение каждого человека у входа принадлежащего ему шатра.
- source_word: וְהִבִּיטוּ אַחֲרֵי מֹשֶׁה
  choice: смотрел вслед Моисею
  rationale: Оборот с אַחֲרֵי обозначает взгляд вслед удаляющемуся Моисею; русское выражение сохраняет пространственный образ.
- source_word: עַד בֹּאוֹ הָאֹהֱלָה
  choice: пока тот не входил в шатёр
  rationale: Направительная форма существительного указывает на движение внутрь; местоимение «тот» устраняет двусмысленность русского предложения.
theological_decisions:
- issue: Обозначение шатра
  choice: шатёр
  alternative: Шатёр / шатёр собрания
  rationale: В стихе употреблено только הָאֹהֶל, хотя контекст связывает его с шатром встречи; перевод не добавляет полного наименования и сохраняет контекстуальную возможность особого референта.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Видовые формы и конструкция «всякий раз» передают повторяемость действий; слово «шатёр» последовательно сохраняет конкретный образ исходного текста.
