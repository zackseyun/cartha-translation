source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֲנִ֨י אַעֲבִ֤יר כָּל טוּבִ/י֙ עַל פָּנֶ֔י/ךָ וְ/קָרָ֧אתִֽי בְ/שֵׁ֛ם יְהוָ֖ה לְ/פָנֶ֑י/ךָ וְ/חַנֹּתִי֙ אֶת אֲשֶׁ֣ר אָחֹ֔ן וְ/רִחַמְתִּ֖י אֶת אֲשֶׁ֥ר אֲרַחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/019.yaml
  text: And he said[a], “I myself will make all my goodness pass before you, and I will proclaim the name of Yahweh before you. And I will be gracious to whom I will be gracious, and I will show mercy to whom I will show mercy.”
translation:
  language: ru
  text: 'И сказал Он: «Я Сам проведу перед тобой всю Мою благость и провозглашу перед тобой имя Яхве. Я буду милостив к тому, к кому буду милостив, и помилую того, кого помилую[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и сжалюсь над тем, над кем сжалюсь».'
    reason: Лексема רחם допускает передачу как «миловать», так и «сжалиться, проявить сострадание».
lexical_decisions:
- source_word: אֲנִי אַעֲבִיר
  choice: Я Сам проведу
  rationale: Отдельное местоимение אֲנִי подчёркивает действующее лицо, что передано сочетанием «Я Сам»; каузативная порода глагола עבר отражена переходным «проведу».
- source_word: כָּל טוּבִי
  choice: всю Мою благость
  rationale: טוּב здесь обозначает Божью благость как являемое благотворное свойство; «благость» сохраняет смысл шире, чем внешняя красота или отдельные дары.
- source_word: עַל־פָּנֶיךָ
  choice: перед тобой
  rationale: Естественная русская передача пространственного идиоматического выражения без буквального и неясного «над твоим лицом».
- source_word: וְקָרָאתִי בְשֵׁם יְהוָה
  choice: и провозглашу перед тобой имя Яхве
  rationale: В данном контексте קרא בשם означает публично назвать или провозгласить имя, а не призвать его; это согласуется с последующим самооткровением в Исх. 34.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом «Господь».
- source_word: וְחַנֹּתִי אֶת־אֲשֶׁר אָחֹן
  choice: Я буду милостив к тому, к кому буду милостив
  rationale: Повтор корня חנן сохранён повтором «милостив», чтобы передать эмфатическую форму исходного текста.
- source_word: וְרִחַמְתִּי אֶת־אֲשֶׁר אֲרַחֵם
  choice: и помилую того, кого помилую
  rationale: Повтор одного и того же корня רחם сохранён; «помилую» естественно сочетается с предшествующим высказыванием о милости и не устраняет оттенок сострадания.
theological_decisions:
- issue: Божественная свобода в проявлении милости и сострадания
  choice: Сохранены повторяющиеся формулы от первого лица без поясняющей систематизации.
  alternative: Передать высказывание как общее учение о Божьей доброте либо усилить его формулировками, прямо утверждающими ту или иную позднейшую доктрину предопределения.
  rationale: Еврейский текст подчёркивает свободу Божьего решения посредством повторов, но сам не разрешает все последующие богословские споры; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и повторы оригинала сохранены; архаические формы и конфессионально окрашенные пояснения не добавлены.
