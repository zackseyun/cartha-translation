  text: וְ/עַתָּ֡ה אִם נָא֩ מָצָ֨אתִי חֵ֜ן בְּ/עֵינֶ֗י/ךָ הוֹדִעֵ֤/נִי נָא֙ אֶת דְּרָכֶ֔/ךָ וְ/אֵדָ֣עֲ/ךָ֔ לְמַ֥עַן אֶמְצָא חֵ֖ן בְּ/עֵינֶ֑י/ךָ וּ/רְאֵ֕ה כִּ֥י עַמְּ/ךָ֖ הַ/גּ֥וֹי הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/013.yaml
  text: Now therefore[a], if I have found favor in your eyes, please make your ways known to me, so that I may know you, in order that I may find favor in your eyes[c][b]. And consider that this nation is your people.
translation:
  language: ru
  text: Итак, если я обрёл благоволение в Твоих глазах, прошу, открой мне Твои пути[a], чтобы я познал Тебя, дабы обрести благоволение в Твоих глазах. И обрати внимание[b] на то, что этот народ — Твой народ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово стоит во множественном числе: «Твои пути»; речь может идти о том, как Бог действует и намерен поступать.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «увидь»; здесь по смыслу: «прими во внимание», «учти».'
    reason: lexical_alternative
  - marker: c
    text: 'В древнееврейском тексте употреблены два слова: גּוֹי («народ, нация») и עַם («народ»). Русский перевод передаёт оба словом «народ», сохраняя смысл довода Моисея.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт переход к выводу и просьбе на основании предшествующих слов; по-русски звучит естественнее буквального «и теперь».
- source_word: נָא
  choice: прошу
  rationale: Передаёт вежливую, настойчивую просьбу без архаического оттенка.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: я обрёл благоволение в Твоих глазах
  rationale: Сохраняет понятный русский читателю древнееврейский образ и повтор этого выражения в стихе; «благоволение» здесь точнее контекстуального, межличностного смысла, чем богословски нагруженная «благодать».
- source_word: הוֹדִעֵנִי
  choice: открой мне
  rationale: Каузативная форма ידע означает «дать узнать, сделать известным». «Открой мне» естественно передаёт просьбу сообщить или явить Божьи пути.
- source_word: דְּרָכֶךָ
  choice: Твои пути
  rationale: Форма имеет множественное число и может обозначать образ действий Бога и то, как Он намерен поступать.
- source_word: וְאֵדָעֲךָ
  choice: чтобы я познал Тебя
  rationale: «Познал» сохраняет личностный и relational смысл знания, а не сводит его к получению сведений; придаточное цели естественно связано с предшествующей просьбой.
- source_word: לְמַעַן אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: и благодаря этому обрёл благоволение в Твоих глазах
  rationale: לְמַעַן выражает цель или предполагаемый результат. Формулировка сохраняет логическую связь и повтор ключевого выражения, не делая синтаксис тяжеловесным.
- source_word: וּרְאֵה
  choice: обрати внимание
  rationale: Императив ראה здесь идиоматически призывает принять во внимание существенный довод, а не просто физически посмотреть.
- source_word: כִּי עַמְּךָ הַגּוֹי הַזֶּה
  choice: этот народ — Твой народ
  rationale: 'Русское «народ» естественно передаёт здесь и גּוֹי, и עַם, а повтор подчёркивает довод Моисея: данный народ принадлежит Богу. Различие двух древнееврейских слов отмечено в сноске.'
theological_decisions:
- issue: Личностный смысл познания Бога
  choice: чтобы я познал Тебя
  alternative: чтобы я узнал о Тебе
  rationale: Прямое дополнение с ידע обозначает знание Самого Бога, а не только получение информации о Нём; перевод сохраняет личностную направленность, не добавляя особой доктринальной трактовки.
- issue: Связь между познанием Бога и обретением благоволения
  choice: чтобы я познал Тебя и благодаря этому обрёл благоволение
  alternative: и я познаю Тебя, чтобы обрести благоволение
  rationale: Древнееврейская последовательность допускает оттенки цели и результата. Выбранная формулировка передаёт логическое развитие просьбы, но не превращает благоволение в механически заслуженную награду.
- issue: Довод о принадлежности народа Богу
  choice: этот народ — Твой народ
  alternative: этот народ принадлежит Тебе
  rationale: Именная конструкция ближе к исходному тексту и сохраняет напряжённый призыв Моисея признать особую принадлежность народа, не уточняя сверх текста характер этой связи.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены повтор выражения «обрёл благоволение в Твоих глазах», множественное число «пути» и личностное «познал Тебя». Местоимения, относящиеся к Богу, написаны с прописной буквы как устойчивый русский библейский издательский приём.
