  text: וַ/יֹּאמַ֑ר הַרְאֵ֥/נִי נָ֖א אֶת כְּבֹדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/018.yaml
  text: Then he said[a], “Please show me your glory.”
translation:
  language: ru
  text: 'Тогда он сказал: «Покажи мне, пожалуйста, Твою славу[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дай мне увидеть Твоё великолепие». Еврейский глагол буквально означает «сделай так, чтобы я увидел», а слово «слава» может также обозначать явленное великолепие или честь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Тогда он сказал
  rationale: Форма с повествовательным וַ продвигает рассказ вперёд; «тогда» естественно передаёт последовательность действий, не перегружая русский текст повторяющимся союзом «и».
- source_word: הַרְאֵנִי
  choice: Покажи мне
  rationale: Побудительная форма породы hифиль от ראה с суффиксом 1-го лица буквально означает «сделай так, чтобы я увидел». Русское «покажи мне» точно и естественно передаёт это побуждение.
- source_word: נָא
  choice: пожалуйста
  rationale: Частица выражает просьбу и смягчает повелительную форму; современное «пожалуйста» передаёт её функцию без архаизации.
- source_word: אֶת
  choice: не переводится отдельно
  rationale: Служебная частица обозначает определённое прямое дополнение и не требует отдельного соответствия в русском языке.
- source_word: כְּבֹדֶךָ
  choice: Твою славу
  rationale: כָּבוֹד может обозначать славу, честь или явленное великолепие. В контексте просьбы Моисея «слава» сохраняет широту значения и не сводит просьбу лишь к зрительному сиянию.
theological_decisions:
- issue: Смысл выражения «Твою славу» в просьбе Моисея
  choice: Сохранено широкое выражение «Твою славу» без дополнительного истолкования.
  alternative: «Твоё великолепие» или «полноту Твоего присутствия»
  rationale: Еврейский текст не уточняет, просит ли Моисей увидеть сияние, величие или явление Божьего присутствия. Перевод сохраняет эту смысловую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык; просьба звучит прямо, почтительно и естественно. Заглавная буква в местоимении «Твою» служит традиционным русским знаком почтительного обращения к Богу, не добавляя нового смыслового содержания.
