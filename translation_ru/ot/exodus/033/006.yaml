    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְנַצְּלוּ
  choice: сняли с себя
  rationale: Возвратная форма глагола означает снятие с самих себя; по-русски «сняли с себя» точно и естественно передаёт это значение без излишней экспрессии.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет образ еврейского выражения и его торжественный библейский оттенок, оставаясь понятным в современном литературном русском.
- source_word: עֶדְיָם
  choice: свои украшения
  rationale: Существительное обозначает украшение или убранство; «украшения» не сужает смысл до определённого материала или вида изделий. Возвратное «свои» естественно соотносит украшения с подлежащим.
- source_word: מֵהַר חוֹרֵב
  choice: начиная от горы Хорив
  rationale: 'Передаёт вероятное временно-пространственное значение исходной точки: от пребывания у Хорива и далее. Неоднозначность между исходной точкой и местом действия сохранена в сноске.'
theological_decisions:
- issue: Продолжительность отказа от украшений
  choice: «начиная от горы Хорив» — отказ представлен как начавшийся у Хорива и продолжившийся далее
  alternative: «у горы Хорив» — указание лишь на место снятия украшений
  rationale: Предлог מִן обычно обозначает исходную точку, но в данном кратком выражении возможна локативная трактовка. Основной текст отражает контекстуально вероятное продолженное состояние, а сноска сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Оборот «сыны Израиля» выбран ради прозрачности исходного образа; синтаксис остаётся простым и понятным.
