source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה רְ֠אֵה אַתָּ֞ה אֹמֵ֤ר אֵלַ/י֙ הַ֚עַל אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַתָּה֙ לֹ֣א הֽוֹדַעְתַּ֔/נִי אֵ֥ת אֲשֶׁר תִּשְׁלַ֖ח עִמִּ֑/י וְ/אַתָּ֤ה אָמַ֨רְתָּ֙ יְדַעְתִּ֣י/ךָֽ בְ/שֵׁ֔ם וְ/גַם מָצָ֥אתָ חֵ֖ן בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/012.yaml
  text: Then Moses said to Yahweh[a], “See, you are saying to me, ‘Bring up this people,’ but you have not made known to me whom you will send with me. Yet you have said, ‘I know you by name[c][b], and you also have found favor in my sight.’”
translation:
  language: ru
  text: 'Моисей сказал Яхве: «Вот, Ты говоришь мне: „Веди этот народ“, но не дал мне знать, кого пошлёшь со мной. И всё же Ты сказал: „Я знаю тебя по имени[a], и ты также обрёл благоволение в Моих глазах[b]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «знать по имени» означает личное знание и особое расположение.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «нашёл благоволение в Моих глазах»; также возможно: «нашёл милость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; форма «Яхве» общепринята в современной русской библеистике.
- source_word: רְאֵה
  choice: Вот
  rationale: В данном обращении императив служит дискурсивным маркером, привлекающим внимание к доводу Моисея. «Вот» естественно передаёт эту функцию по-русски без излишне буквального «смотри».
- source_word: הַעַל אֶת־הָעָם הַזֶּה
  choice: Веди этот народ
  rationale: Каузатив глагола עלה буквально выражает побуждение идти вверх или выступить в путь. В русском контексте путешествия «веди» звучит естественно и сохраняет поручение Моисею, не вводя неясного «подними».
- source_word: לֹא הוֹדַעְתַּנִי
  choice: не дал мне знать
  rationale: Сохраняет каузативное значение породы hифиль — «сделать известным, дать знать» — и при этом остаётся естественным по-русски.
- source_word: אֵת אֲשֶׁר תִּשְׁלַח עִמִּי
  choice: кого пошлёшь со мной
  rationale: Субстантивированное אֲשֶׁר в контексте естественно указывает на сопровождающее Моисея лицо; עִמִּי прямо означает «со мной».
- source_word: יְדַעְתִּיךָ בְשֵׁם
  choice: Я знаю тебя по имени
  rationale: Сохраняет образ и личностную силу еврейского выражения, не превращая его в более узкое богословское толкование.
- source_word: מָצָאתָ חֵן בְּעֵינָי
  choice: ты обрёл благоволение в Моих глазах
  rationale: Сохраняет еврейский образ «найти благоволение в глазах»; «благоволение» здесь естественнее и точнее контекстуально, чем богословски нагруженное «благодать».
- source_word: וְגַם
  choice: и ты также
  rationale: Явно передаёт добавочное усиление исходной фразы.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Смысл выражения «Я знаю тебя по имени»
  choice: Сохранить идиому без расширяющего толкования
  alternative: Я знаю тебя лично; Я избрал тебя
  rationale: Фраза выражает личное знание и расположение, однако сам текст не формулирует здесь прямо более специального учения об избрании.
- issue: Передача חֵן
  choice: благоволение
  alternative: благодать; расположение
  rationale: «Благоволение» сохраняет смысл Божьего расположения и не навязывает термину более позднее систематико-богословское содержание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы в прямой речи. Синтаксический контраст жалобы Моисея сохранён сочетаниями «но» и «и всё же».
