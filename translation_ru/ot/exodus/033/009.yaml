  text: And whenever Moses entered the tent[a], the pillar of cloud would descend and stand at the entrance of the tent, and he would speak with Moses.
translation:
  language: ru
  text: И всякий раз, когда Моисей входил в шатёр, облачный столп спускался и останавливался у входа в шатёр, и он говорил с Моисеем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более явно: «и Господь говорил с Моисеем». В еврейском тексте подлежащее здесь не названо, хотя из контекста следует, что это Господь.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כְּבֹא
  choice: И всякий раз, когда … входил
  rationale: Конструкция вводит повторявшееся обстоятельство в повествовании; такая передача естественно выражает обычное действие в прошлом.
- source_word: הָאֹהֱלָה / הָאֹהֶל
  choice: в шатёр / в шатёр
  rationale: В стихе употреблено просто «шатёр», а не полное наименование «шатёр встречи»; строчная буква не добавляет отсутствующего в форме слова титульного оттенка.
- source_word: יֵרֵד
  choice: спускался
  rationale: Форма глагола продолжает описание повторявшегося действия; русский несовершенный вид естественно передаёт эту итеративность.
- source_word: עַמּוּד הֶעָנָן
  choice: столп облачный
  rationale: Сохраняется традиционный, понятный и возвышенный библейский образ; сочетание остаётся естественным для современного литературного русского.
- source_word: וְעָמַד
  choice: и останавливался
  rationale: В данном пространственном контексте глагол означает, что столп занимал положение у входа; несовершенный вид сохраняет повторяемость.
- source_word: פֶּתַח הָאֹהֶל
  choice: у входа в шатёр
  rationale: Естественная русская передача пространственного отношения без излишней буквальности.
- source_word: וְדִבֶּר
  choice: и Он говорил
  rationale: В еврейском подлежащее прямо не названо, но выражено глаголом мужского рода и определяется контекстом как Господь. Местоимение сохраняет формальную неявность имени; прописная буква помогает обычному русскому читателю распознать референта.
- source_word: עִם מֹשֶׁה
  choice: с Моисеем
  rationale: 'Предлог עִם буквально и по смыслу передаёт взаимно-личностный оттенок общения: «с Моисеем», а не только направленность речи к нему.'
theological_decisions:
- issue: Неявное подлежащее при «говорил с Моисеем»
  choice: Сохранить местоименную передачу «Он», пояснив в сноске, что в еврейском подлежащее не названо.
  alternative: Явно вставить «Господь говорил с Моисеем»; менее вероятно — отнести действие к столпу облачному.
  rationale: Контекст указывает на Господа, однако исходный текст не называет Его в этой части предложения. Местоимение вместе со сноской сохраняет и контекстуальный смысл, и формальную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Шатёр» и «столп облачный» сохраняют конкретную образность исходного текста; синтаксис плавно передаёт повторявшуюся последовательность действий.
