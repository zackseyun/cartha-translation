- from: И по чему же станет известно, что я обрёл благоволение в Твоих глазах — я и Твой народ? Не по тому ли, что Ты пойдёшь с нами и мы — я и Твой народ — будем отличены[a] от всех народов, живущих на земле?
  to: По чему же тогда станет известно, что я обрёл благоволение в Твоих глазах — я и Твой народ? Разве не тем, что Ты пойдёшь с нами и мы — я и Твой народ — будем отличены[a] от всех народов, живущих на земле?
  rationale: Правка делает первый вопрос более естественным и отчётливо передаёт инструментальное значение «Твоим шествием с нами». Повтор «я и Твой народ», риторическая форма вопроса, будущая перспектива отличия и универсальный охват всех народов сохранены.
