    rationale: Конструкция отвечает на вопрос «чем/каким образом?». Формула «Разве не тем, что Ты пойдёшь с нами» точнее, чем «Не по тому ли, что Ты пойдёшь с нами», при сохранении естественного русского синтаксиса.
  - severity: low
    issue: Начальное «И по чему же» стилистически неровно.
    rationale: Союзная связь и выводный оттенок אֵפוֹא можно естественнее выразить словом «тогда», не утрачивая связи с предыдущей репликой.
