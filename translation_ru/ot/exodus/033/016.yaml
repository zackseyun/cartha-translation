  text: וּ/בַ/מֶּ֣ה יִוָּדַ֣ע אֵפ֗וֹא כִּֽי מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲנִ֣י וְ/עַמֶּ֔/ךָ הֲ/ל֖וֹא בְּ/לֶכְתְּ/ךָ֣ עִמָּ֑/נוּ וְ/נִפְלֵ֨ינוּ֙ אֲנִ֣י וְ/עַמְּ/ךָ֔ מִ/כָּ֨ל הָ/עָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/016.yaml
  text: For how then will it be known that I have found favor in your sight[a], I and your people? Is it not by your going with us, so that I and your people are distinguished from every people who are on the face of the earth?
translation:
  language: ru
  text: По чему же тогда станет известно, что я обрёл благоволение в Твоих глазах — я и Твой народ? Разве не тем, что Ты пойдёшь с нами и мы — я и Твой народ — будем отличены[a] от всех народов, живущих на земле?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будем отделены», «будем выделены». Еврейский глагол может обозначать особую выделенность или отличие от других.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמֶּה ... אֵפוֹא
  choice: И по чему же
  rationale: Сочетание сохраняет связь с предыдущей мыслью, вопрос о признаке или средстве и усилительно-выводный оттенок частицы אֵפוֹא.
- source_word: יִוָּדַע
  choice: станет известно
  rationale: Передаёт пассивное значение нифаля и естественно звучит в современном русском.
- source_word: כִּי מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: что я обрёл благоволение в Твоих глазах
  rationale: Сохраняет образность устойчивого еврейского выражения и передаёт חֵן как благосклонное отношение, не привнося специального богословского смысла слова «благодать».
- source_word: אֲנִי וְעַמֶּךָ
  choice: я и Твой народ
  rationale: Сохраняет явное соединение Моисея с народом, за который он ходатайствует.
- source_word: הֲלוֹא
  choice: Не по тому ли
  rationale: Сохраняет форму риторического вопроса, предполагающего утвердительный ответ.
- source_word: בְּלֶכְתְּךָ עִמָּנוּ
  choice: что Ты пойдёшь с нами
  rationale: Естественно передаёт значение Божьего движения вместе с народом как основания, по которому станет видно Его благоволение.
- source_word: וְנִפְלֵינוּ
  choice: и мы ... будем отличены
  rationale: Нифаль глагола פלא здесь обозначает выделенность или особое отличие от других; пассивная конструкция сохраняет грамматическую форму и не уточняет сверх текста способ этого отличия.
- source_word: מִכָּל הָעָם
  choice: от всех народов
  rationale: Собирательное единственное число עָם в данном универсальном контексте естественно передаётся русским множественным числом.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: живущих на земле
  rationale: Передаёт общееврейское обозначение всех народов, находящихся на поверхности земли, без неестественной русской кальки.
theological_decisions:
- issue: Основание отличия Израиля от других народов
  choice: Отличительным признаком показано то, что Бог идёт вместе с Моисеем и народом.
  alternative: Считать главным отличием народа закон, землю или этническое происхождение.
  rationale: Сам стих непосредственно связывает узнаваемость Божьего благоволения и отличие народа с Божьим присутствием, выраженным словами о Его пути вместе с ними.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Местоимения, обращённые к Богу, написаны с прописной буквы. Тире выделяют пояснительное повторение «я и Твой народ», сохраняя еврейский акцент без синтаксической тяжеловесности.
