id: EXO.33.11
reference: Exodus 33:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/דִבֶּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ פָּנִ֣ים אֶל פָּנִ֔ים כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר אִ֖ישׁ אֶל רֵעֵ֑/הוּ וְ/שָׁב֙ אֶל הַֽ/מַּחֲנֶ֔ה וּ/מְשָׁ֨רְת֜/וֹ יְהוֹשֻׁ֤עַ בִּן נוּן֙ נַ֔עַר לֹ֥א יָמִ֖ישׁ מִ/תּ֥וֹךְ הָ/אֹֽהֶל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/011.yaml
  text: And Yahweh would speak to Moses face to face[a], as a man speaks to his friend. Then he would return to the camp, but his attendant Joshua son of Nun, a young man[b], would not depart from the midst of the tent.
translation:
  language: ru
  text: И Яхве говорил с Моисеем лицом к лицу[a], как человек говорит со своим другом. Потом Моисей возвращался в стан, а его помощник Иисус, сын Навина, молодой человек, не выходил из шатра[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напрямую», «лично». Еврейское выражение «лицом к лицу» указывает на необычайно непосредственное общение.'
    reason: lexical_alternative
  - marker: b
    text: То есть из шатра встречи.
    reason: contextual_clarification
lexical_decisions:
- source_word: וְדִבֶּר
  choice: говорил
  rationale: Форма глагола в данном повествовательном контексте обозначает повторявшееся, обычное действие; русское несовершенное прошедшее естественно передаёт эту повторяемость.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: פָּנִים אֶל־פָּנִים
  choice: лицом к лицу
  rationale: Сохранён еврейский образ необычайно непосредственного личного общения без сведения его к утверждению о буквальном зрительном восприятии Бога.
- source_word: כַּאֲשֶׁר יְדַבֵּר אִישׁ אֶל־רֵעֵהוּ
  choice: как человек говорит со своим другом
  rationale: Естественно передаёт сравнение и личный, доверительный характер разговора; רֵעַ в этом контексте уместно перевести как «друг».
- source_word: וְשָׁב
  choice: Потом Моисей возвращался
  rationale: Несовершенный вид продолжает описание обычного порядка действий; имя Моисея повторено ради ясности русского текста, поскольку еврейский глагол содержит лишь местоименную отсылку.
- source_word: הַמַּחֲנֶה
  choice: стан
  rationale: Традиционное и понятное в библейском повествовании обозначение израильского лагеря.
- source_word: וּמְשָׁרְתוֹ
  choice: его помощник
  rationale: Причастие обозначает человека, состоящего при Моисее и помогающего ему; «помощник» яснее современному читателю и не привносит оттенка домашнего рабства.
- source_word: יְהוֹשֻׁעַ בִּן־נוּן
  choice: Иисус, сын Навина
  rationale: Использована укоренившаяся русская библейская форма имени и патронимическое обозначение.
- source_word: נַעַר
  choice: молодой человек
  rationale: Слово может обозначать юношу или молодого служителя; здесь возрастной смысл передан без добавления уже выраженной роли помощника.
- source_word: לֹא יָמִישׁ
  choice: не выходил
  rationale: Глагол выражает неотступное пребывание, а несовершенный вид соответствует обычному, повторявшемуся действию.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: из шатра
  rationale: По-русски естественно передаёт исходное «изнутри шатра»; контекст указывает на шатёр встречи.
theological_decisions:
- issue: Антропоморфное выражение о разговоре Яхве с Моисеем «лицом к лицу»
  choice: Сохранить в основном тексте выражение «лицом к лицу» как описание непосредственной личной встречи и общения.
  alternative: Передать как «напрямую» или «лично», устранив возможное напряжение с текстами о невозможности увидеть Бога.
  rationale: 'Еврейский образ намеренно сохранён: перевод не должен заранее разрешать богословское напряжение или утверждать сверх того, что сказано, будто Моисей буквально видел Божье лицо.'
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Стан» и «шатёр» сохраняют повествовательный колорит, тогда как «помощник» и синтаксис остаются прозрачными для обычного современного читателя. Маркер [b] поставлен при слове «шатра», к которому относится пояснение.
