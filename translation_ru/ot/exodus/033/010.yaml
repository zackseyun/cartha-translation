  yaml_path: translation/ot/exodus/033/010.yaml
  text: When all the people saw the pillar of cloud standing at the entrance of the tent[a], all the people rose and worshiped, each man at the entrance of his tent.
translation:
  language: ru
  text: Когда весь народ видел облачный столп, стоявший у входа в шатёр, весь народ вставал и поклонялся[a] — каждый у входа в свой шатёр.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «склонялся» или «падал ниц». Еврейский глагол обозначает телесное выражение почтения и часто употребляется в значении поклонения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: И ... видел
  rationale: В контексте повторяющегося действия форма продвигает описание обычного хода событий; русское несовершенное «видел» естественно согласуется с последующими «вставал и поклонялся».
- source_word: כָל הָעָם
  choice: весь народ
  rationale: Прямо передаёт собирательное обозначение общины, не добавляя отсутствующего здесь уточнения «Израиля».
- source_word: עַמּוּד הֶעָנָן
  choice: облачный столп
  rationale: Устоявшееся и ясное русское соответствие, сохраняющее конкретный образ видимого знака Божьего присутствия.
- source_word: עֹמֵד
  choice: стоявший
  rationale: Передаёт положение столпа и естественно встраивается в русское предложение.
- source_word: פֶּתַח הָאֹהֶל
  choice: у входа в шатёр
  rationale: Передаёт значение «у входа/проёма шатра» без добавления слов «собрания», которых в самом стихе нет.
- source_word: וְקָם
  choice: вставал
  rationale: Обозначает поднятие на ноги; несовершенный вид отражает повторяющийся характер сцены в данном контексте.
- source_word: וְהִשְׁתַּחֲווּ
  choice: поклонялся
  rationale: Сохраняет одновременно религиозный смысл и телесный аспект почтительного преклонения, не сводя глагол только к внутреннему почитанию.
- source_word: אִישׁ
  choice: каждый
  rationale: 'Передаёт дистрибутивное значение: каждый отдельный человек из народа; по-русски местоименное «каждый» естественно и не устраняет смысл исходной формы.'
- source_word: פֶּתַח אָהֳלוֹ
  choice: у входа в свой шатёр
  rationale: Сохраняет картину, в которой каждый поклоняется у входа собственного шатра; возвратное «свой» естественно выражает принадлежность при подлежащем «каждый».
theological_decisions:
- issue: Характер действия народа перед знаком Божьего присутствия
  choice: поклонялся
  alternative: склонялся; падал ниц
  rationale: Еврейский глагол обозначает телесное преклонение и в этом контексте служит актом почитания Бога. «Поклонялся» удерживает оба оттенка, а более конкретные описания позы приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Шатёр» выбран вместо более архаичного «скиния», поскольку в стихе употреблено общее слово «шатёр»; связь с шатром встречи ясна из контекста. Несовершенные формы передают повторяющуюся сцену, заданную ближайшим контекстом.
