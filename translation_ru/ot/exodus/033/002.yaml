base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/002.yaml
  text: And I will send an angel before you[a], and I will drive out the Canaanite, the Amorite, the Hittite, the Perizzite, the Hivite, and the Jebusite.
translation:
  language: ru
  text: Я пошлю перед тобой ангела[a] и прогоню хананеев, аморреев, хеттеев, ферезеев, евеев и иевусеев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестника». Еврейское מַלְאָךְ может обозначать как ангела, так и человеческого посланника; в данном контексте лучше подходит «ангел».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: Я пошлю
  rationale: Форма совершенного вида с союзом в контексте Божьего обещания имеет будущее значение; «пошлю» естественно передаёт обещание.
- source_word: לְפָנֶיךָ
  choice: перед тобой
  rationale: Еврейский идиоматический оборот означает «перед тобой, впереди тебя»; выбранный вариант краток и сохраняет образ исходного текста.
- source_word: מַלְאָךְ
  choice: ангела
  rationale: Слово может обозначать ангела или вестника; в данном контексте уместно «ангел», но лексическая неоднозначность отмечена в сноске.
- source_word: וְגֵרַשְׁתִּי
  choice: и прогоню
  rationale: Глагол обозначает изгнание жителей с земли; «прогоню» ясно и естественно передаёт это действие.
- source_word: הַכְּנַעֲנִי ... וְהַיְבוּסִי
  choice: хананеев, аморреев, хеттеев, ферезеев, евеев и иевусеев
  rationale: Еврейские этнонимы стоят в единственном числе с собирательным значением. Русское множественное число естественно обозначает соответствующие народы; использованы традиционно узнаваемые формы названий.
theological_decisions:
- issue: Кого обозначает מַלְאָךְ
  choice: «ангела» без уточнения его личности
  alternative: «вестника» или конкретизация как «Ангела Господня»
  rationale: Сам стих не отождествляет этого посланника с Ангелом Господним и не раскрывает его природу. Перевод не вносит отсутствующей в тексте богословской конкретизации, а лексическую альтернативу сохраняет в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Собирательные этнонимы переданы естественным для русского языка множественным числом; союз перед заключительным элементом списка сохранён.
