  - severity: low
    issue: Сноска предлагает нерелевантный для русского переводческий вариант.
    rationale: Английская сноска касается различия definite/indefinite для «cleft», которое русский язык не выражает артиклями. «Утёс» как возможная замена «скалы» не нужен для понимания и не обозначает существенной спорности исходного текста.
  revised_text: И когда слава Моя пройдёт мимо, Я помещу тебя в расселине скалы и прикрою тебя Моей рукой, пока не пройду.
