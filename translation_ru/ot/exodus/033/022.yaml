- from: И когда слава Моя будет проходить мимо, Я помещу тебя в расселине скалы[a] и прикрою тебя Моей рукой, пока не пройду.
  to: И когда слава Моя пройдёт мимо, Я помещу тебя в расселине скалы и прикрою тебя Моей рукой, пока не пройду.
  rationale: Упрощено будущее время в первом придаточном, чтобы не приписывать прохождению славы специальную длительность. Сноска удалена как не несущая значимой для русского читателя информации. Остальная формулировка сохраняет лексику, синтаксические отношения и образность еврейского текста.
