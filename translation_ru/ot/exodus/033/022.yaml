base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/022.yaml
  text: And when my glory passes by[a], I will put you in a cleft of the rock, and I will cover you with my hand until I have passed by.
translation:
  language: ru
  text: И когда слава Моя пройдёт мимо, Я помещу тебя в расселине скалы и прикрою тебя Моей рукой, пока не пройду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַּעֲבֹר
  choice: И когда ... будет проходить мимо
  rationale: Сочетание וְהָיָה с ב и инфинитивом выражает временное обстоятельство. Будущее составное сказуемое естественно передаёт предстоящее действие.
- source_word: כְּבֹדִי
  choice: слава Моя
  rationale: В контексте богоявления כבוד обозначает явленную Божью славу; традиционное и точное русское соответствие — «слава».
- source_word: וְשַׂמְתִּיךָ
  choice: Я помещу тебя
  rationale: Глагол שׂים означает «положить, поместить, поставить»; «помещу» естественно сочетается с нахождением внутри расселины.
- source_word: בְּנִקְרַת הַצּוּר
  choice: в расселине скалы
  rationale: נִקְרָה — расселина или трещина в скале. Русская конструкция не требует передачи английского различия между определённым и неопределённым артиклем.
- source_word: וְשַׂכֹּתִי
  choice: прикрою
  rationale: סכך передаёт идею закрывания и заслонения. «Прикрою» сохраняет конкретный образ защиты рукой и звучит естественнее, чем буквальное «покрою тебя рукой».
- source_word: כַּפִּי
  choice: Моей рукой
  rationale: כף буквально может обозначать ладонь, но в данном антропоморфном образе русское «рукой» естественно и не конкретизирует анатомию сверх необходимости.
- source_word: עַד עָבְרִי
  choice: пока не пройду
  rationale: 'עַד с инфинитивом и суффиксом первого лица обозначает предел действия: укрытие продолжается до завершения прохождения Бога мимо.'
theological_decisions:
- issue: Антропоморфное выражение о Боге («Моей рукой»)
  choice: Сохранить конкретный образ «Моей рукой».
  alternative: 'Передать абстрактно: «Моей защитой» или «Моей силой».'
  rationale: Еврейский текст прямо использует телесный образ. Его следует сохранить, не превращая метафору в утверждение о телесности Бога и не заменяя её богословским толкованием.
- issue: Смена подлежащего от «славы Моей» к говорящему «Я»
  choice: 'Сохранить различие: слава проходит мимо, затем Бог говорит «пока не пройду».'
  alternative: Сгладить оба выражения до одного подлежащего.
  rationale: Такова напряжённая формулировка еврейского текста; перевод не должен устранять её или отождествлять славу с говорящим посредством поясняющего пересказа.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской издательской традиции. Синтаксис остаётся ясным и сохраняет конкретную образность оригинала.
