  text: 'И Он сказал: «Моё присутствие[a] пойдёт с тобой, и Я дам тебе покой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Моё лицо». Здесь это выражение означает личное присутствие Господа: Он Сам пойдёт с Моисеем и будет сопровождать народ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: И Он сказал
  rationale: Стандартная передача повествовательной формы wayyiqtol от אמר; союз сохраняет последовательность еврейского повествования.
- source_word: פָּנַי
  choice: Моё присутствие
  rationale: Буквально «Моё лицо», но здесь слово обозначает личное присутствие Господа; примечание сохраняет исходный образ.
- source_word: יֵלֵכוּ
  choice: пойдёт с тобой
  rationale: Форма глагола согласована с морфологически множественным פָּנַי. В русском «присутствие пойдёт» требует контекстуального дополнения «с тобой», передающего смысл сопровождения; адресат единственного числа выражен далее в לָךְ.
- source_word: וַהֲנִחֹתִי
  choice: и Я дам тебе покой
  rationale: Каузативная порода глагола נוח означает «дать покой, привести к покою»; выбран естественный русский оборот, сохраняющий каузативный смысл.
- source_word: לָךְ
  choice: тебе
  rationale: Предлог ל с местоименным суффиксом второго лица единственного числа естественно передаётся дательным падежом при обороте «дать покой».
theological_decisions:
- issue: Передача антропоморфного выражения פָּנַי
  choice: Моё присутствие
  alternative: Моё лицо; Я Сам
  rationale: В контексте речь идёт о личном присутствии Господа, сопровождающего Моисея и народ. Основной текст передаёт значение идиомы, а примечание сохраняет буквальный образ и не сводит присутствие к безличной силе.
- issue: Неоднозначность адресата обещанного покоя
  choice: тебе — единственное число
  alternative: вам — Моисею и народу
  rationale: Форма לָךְ грамматически имеет второе лицо единственного числа и непосредственно обращена к Моисею. Возможная коллективная значимость обещания следует из контекста, но не подменяет форму исходного текста.
translation_notes:
  register: Современный литературный русский, ясный и торжественный без архаизации. Заглавные местоимения в прямой речи помогают обозначить говорящего как Бога. Добавление «с тобой» делает русскую фразу естественной и явно передаёт подразумеваемое сопровождение, не устраняя единственное число адресата.
