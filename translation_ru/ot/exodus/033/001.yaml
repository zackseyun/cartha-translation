  source_fidelity: 'Начальная формула, имя «Яхве», два повеления, адресат, исход из Египта и обещание потомству переданы в целом верно. Однако оборот «в землю, о которой Я поклялся Аврааму...» неудачно меняет синтаксические отношения оригинала: נִשְׁבַּעְתִּי לְ обозначает клятву, данную патриархам, а не клятву «о земле».'
  naturalness: Текст в целом литературен и понятен. «Иди, поднимайся» возможно, но «Иди, поднимись» в данном единичном повелении естественнее. Переформулировка обещания делает длинную фразу грамматически ясной без утраты торжественного регистра.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Потомство» удачно сохраняет собирательное единственное число זַרְעֲךָ и не снимает присущей слову неоднозначности. Имена переданы нормативно.
