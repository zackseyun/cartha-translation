source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ עֲלֵ֣ה מִ/זֶּ֔ה אַתָּ֣ה וְ/הָ/עָ֔ם אֲשֶׁ֥ר הֶֽעֱלִ֖יתָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל הָ/אָ֗רֶץ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/001.yaml
  text: Then Yahweh said to Moses[a], “Go up from here, you and the people whom you brought up from the land of Egypt, to the land that I swore to Abraham, to Isaac, and to Jacob, saying[b], ‘I will give it to your offspring.’”
translation:
  language: ru
  text: 'И сказал Яхве Моисею[a]: «Иди, поднимись отсюда — ты и народ, который ты вывел из земли Египетской, — в землю, которую Я под клятвой обещал Аврааму, Исааку и Иакову, сказав: „Твоему потомству[b] Я отдам её“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (тетраграмматон); традиционно передаётся словом «Господь».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «семени». Еврейское слово стоит в единственном числе, но имеет собирательное значение: потомство, потомки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И сказал
  rationale: Нарративная форма с waw продвигает повествование; в формуле введения прямой речи современное русское «сказал» естественнее буквального «говорил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: לֵךְ עֲלֵה
  choice: Иди, поднимайся
  rationale: Сохраняет оба повелительных глагола и выраженные ими уход с места и движение вверх, не сглаживая парную конструкцию.
- source_word: מִזֶּה
  choice: отсюда
  rationale: Естественная современная передача указательного оборота «из этого места».
- source_word: אַתָּה וְהָעָם
  choice: ты и народ
  rationale: Точно воспроизводит личное местоимение и существительное с артиклем, не добавляя отсутствующего в еврейском указательного «этот».
- source_word: אֲשֶׁר הֶעֱלִיתָ
  choice: который ты вывел
  rationale: Hiphil глагола עלה означает «поднять, вывести»; в контексте исхода русское «вывел» естественно и сохраняет обращённое к Моисею второе лицо.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Дигнифицированная и понятная русская формула, точно передающая исход из страны Египта.
- source_word: אֶל הָאָרֶץ
  choice: в землю
  rationale: Направительное אֶל в контексте переселения естественно передаётся русским «в» с винительным падежом.
- source_word: נִשְׁבַּעְתִּי
  choice: Я поклялся
  rationale: Прямая передача формы первого лица; возвратный русский глагол идиоматически выражает принесение клятвы.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Аврааму, Исааку и Иакову
  rationale: Дательный падеж передаёт повторяемый еврейский предлог; повтор предлога по-русски не требуется, а торжественный ритм перечня сохраняется.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Сохраняет стандартную вводную формулу, обозначающую содержание клятвы.
- source_word: לְזַרְעֲךָ
  choice: твоему потомству
  rationale: «Потомство» естественно передаёт коллективное единственное זרע и не сводит его ни к одному потомку, ни исключительно к множеству отдельных потомков.
- source_word: אֶתְּנֶנָּה
  choice: Я отдам её
  rationale: Сохраняет обещание в первом лице, объектный суффикс женского рода, относящийся к земле, и смысл дарования.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон как личное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом; примечание сообщает традиционный вариант.
- issue: Коллективное значение זרע
  choice: потомство
  alternative: семя; потомки
  rationale: «Потомство» сохраняет коллективное единственное и присущую исходному слову возможность охватывать линию потомков, не разрешая возможное богословское напряжение в пользу исключительно единственного или множественного понимания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Парные императивы сохранены как «Иди, поднимайся», а тире выделяют присоединённую группу «ты и народ» и облегчают восприятие длинной фразы. Имя передано как «Яхве» с традиционной заменой в примечании.
