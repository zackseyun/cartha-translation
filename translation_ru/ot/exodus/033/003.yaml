  text: אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ כִּי֩ לֹ֨א אֶֽעֱלֶ֜ה בְּ/קִרְבְּ/ךָ֗ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ אַ֔תָּה פֶּן אֲכֶלְ/ךָ֖ בַּ/דָּֽרֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/003.yaml
  text: to a land flowing with milk and honey[a]. For I will not go up in your midst, because you are a stiff-necked people[b], lest I consume you on the way.
translation:
  language: ru
  text: в землю, где течёт молоко и мёд. Ибо Я не пойду среди тебя[a], потому что ты — упрямый[b] народ, чтобы Мне не погубить тебя[c] в пути.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внутри тебя»; возможно также: «с тобой».'
    reason: Сочетание בְּקִרְבְּךָ обозначает пребывание внутри, среди народа; в данном контексте возможно и значение сопровождения.
  - marker: b
    text: 'Букв.: «жёсткий шеей».'
    reason: Сноска сохраняет образную форму еврейского выражения קְשֵׁה־עֹרֶף, переданного в основном тексте естественным современным русским выражением.
  - marker: c
    text: 'Или: «истребить тебя»; буквально: «довести тебя до конца».'
    reason: Глагол כלה в форме Piel может означать погубить, уничтожить или довести до конца; вариант сохраняет семантический диапазон без указания на способ суда.
lexical_decisions:
- source_word: אֶל אֶרֶץ
  choice: в землю
  rationale: Предлог אֶל обозначает направление. В русском контексте естественно употребить определённое по смыслу «в землю», поскольку речь идёт об уже обещанной земле.
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: где течёт молоко и мёд
  rationale: Устойчивый русский библейский образ сохраняет метафору изобилия и звучит естественно.
- source_word: כִּי לֹא אֶעֱלֶה
  choice: Но Я не пойду
  rationale: Первое כִּי здесь допускает пояснительно-противительный переход; «но» ясно передаёт контраст между дарованием земли и отказом Бога присутствовать среди народа. Глагол «пойду» естественнее русского буквального «взойду» в данном контексте путешествия.
- source_word: בְּקִרְבְּךָ
  choice: среди тебя
  rationale: Сохраняется пространственный и богословский смысл присутствия Бога внутри народа; единственное число передаёт обращение к Израилю как к единому целому.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: народ упрямый
  rationale: Еврейская метафора буквально означает «жёсткий шеей», то есть упорно не желающий подчиняться. В современном русском «упрямый народ» передаёт смысл без неестественной кальки.
- source_word: פֶּן
  choice: иначе
  rationale: Передаёт предупреждение о возможном последствии и естественно связывает части русского предложения.
- source_word: אֲכֶלְךָ
  choice: Я истреблю тебя
  rationale: Piel глагола כלה означает довести до конца, погубить или истребить. «Истреблю» точно выражает угрозу полного уничтожения, не вводя конкретного способа суда.
- source_word: בַּדָּרֶךְ
  choice: в пути
  rationale: Краткое и естественное обозначение времени и обстоятельств путешествия.
theological_decisions:
- issue: Высказывание о Божьем присутствии
  choice: Я не пойду среди тебя
  alternative: Я не пойду с тобой
  rationale: '«Среди тебя» лучше сохраняет смысл בְּקִרְבְּךָ: опасность связана с присутствием святого Бога непосредственно внутри мятежного народа, а не только с сопровождением в пути.'
- issue: Сила угрозы в אֲכֶלְךָ
  choice: Я истреблю тебя
  alternative: Я поглощу тебя
  rationale: Еврейский глагол выражает доведение народа до конца, то есть уничтожение. «Истреблю» в современном русском ясно передаёт суровость суда, тогда как «поглощу» могло бы создать не предусмотренный текстом образ.
- issue: Связь первой части со словами об отказе идти среди народа
  choice: Но
  alternative: Ибо
  rationale: 'כִּי допускает разные дискурсивные функции. Здесь «но» сохраняет явный контраст: Бог ведёт к обещанной земле, однако не будет присутствовать среди народа. Причина затем прямо вводится вторым כִּי: «потому что».'
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Метафорически неясное для обычного читателя «жёсткий шеей» вынесено в сноску; обращение к Израилю в единственном числе сохранено. Местоимение Бога написано с прописной буквы согласно распространённой русской религиозно-издательской норме.
