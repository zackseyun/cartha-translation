  yaml_path: translation/ot/exodus/033/023.yaml
  text: Then I will remove my hand[a], and you will see my back, but my face shall not be seen.
translation:
  language: ru
  text: Тогда Я уберу Свою руку, и ты увидишь Мою спину[a], но лица Моего не будет видно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что позади Меня». Еврейское слово может обозначать спину либо заднюю, обращённую назад сторону.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: Тогда Я уберу
  rationale: Глагол סור в породе хифиль означает «убрать, отвести». Начальный союз продолжает последовательность действий из предыдущего стиха; «тогда» естественно передаёт эту связь по-русски.
- source_word: כַּפִּי
  choice: Свою руку
  rationale: כַּף может обозначать ладонь или руку. В контексте защитного прикрытия естественнее русское «руку»; возвратное местоимение «Свою» соответствует норме русского языка при совпадении обладателя с подлежащим.
- source_word: וְרָאִיתָ
  choice: и ты увидишь
  rationale: 'Перфект с союзом в последовательном повествовании после будущего действия передаёт последующий результат: «и ты увидишь».'
- source_word: אֲחֹרָי
  choice: Мою спину
  rationale: Слово обозначает спину, заднюю или обращённую назад сторону. «Мою спину» сохраняет конкретный антропоморфный образ и звучит ясно в современном русском; более широкий смысл отмечен в сноске.
- source_word: וּפָנַי
  choice: но лица Моего
  rationale: Союз передан противительным «но», поскольку здесь противопоставлено то, что Моисей сможет увидеть, тому, что увидеть невозможно. Инверсия сохраняет достойный библейский регистр без архаизации.
- source_word: לֹא יֵרָאוּ
  choice: не будет видно
  rationale: Нифаль от ראה имеет пассивное значение «быть увиденным». Безличная русская конструкция «не будет видно» естественно сохраняет пассивный смысл и не превращает высказывание в активное «не увидишь».
theological_decisions:
- issue: Антропоморфный язык о Боге
  choice: Сохранить конкретные образы «рука», «спина» и «лицо» в основном тексте.
  alternative: Заменить их абстрактными выражениями вроде «присутствие», «след славы» или «то, что остаётся после Меня».
  rationale: Еврейский текст намеренно использует телесные образы. Перевод сохраняет присущее тексту напряжение и не навязывает метафизического истолкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, но не архаичным звучанием. Прописные местоимения в прямой речи Бога применены последовательно. Маркер сноски поставлен после «спину», поскольку сноска поясняет אֲחֹרָי, а не כַּפִּי.
