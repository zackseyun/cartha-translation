base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/007.yaml
  text: Moses would take the tent and pitch it for himself outside the camp[a], far from the camp, and he called it the tent of meeting[b]. And everyone seeking Yahweh would go out to the tent of meeting that was outside the camp.
translation:
  language: ru
  text: Моисей брал[b] шатёр[a] и ставил его для себя вне стана, далеко от стана, и называл его шатром встречи. Каждый, кто искал Яхве, выходил к шатру встречи, находившемуся вне стана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «шатёр» с определённым артиклем. При слове «шатёр» нет притяжательного местоимения «свой» или «его»; возможно, имеется в виду собственный шатёр Моисея либо отдельный шатёр, который он использовал для этой цели.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейские глагольные формы здесь, вероятнее всего, описывают обычные, повторявшиеся действия: Моисей имел обыкновение брать и ставить шатёр, а ищущие Яхве — выходить к нему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח ... וְנָטָה ... יֵצֵא
  choice: брал ... ставил ... выходил
  rationale: Формы yiqtol в данном повествовательном контексте, вероятнее всего, описывают обычные, повторявшиеся действия. Русский прошедший вид несовершенного вида естественно передаёт эту повторяемость.
- source_word: הָאֹהֶל
  choice: шатёр
  rationale: В еврейском стоит определённая форма «шатёр», но притяжательного местоимения «его» нет. Поскольку в русском нет артикля, основной текст сохраняет лексему без добавления спорной принадлежности, а определённость поясняется в сноске.
- source_word: וְנָטָה לוֹ
  choice: и ставил его для себя
  rationale: נטה применительно к шатру означает «раскинуть, поставить». Местоименное לוֹ сохранено как «для себя», не уточняя сверх текста, был ли это личный шатёр Моисея или отдельный шатёр для данной цели.
- source_word: מִחוּץ לַמַּחֲנֶה הַרְחֵק מִן הַמַּחֲנֶה
  choice: вне стана, далеко от стана
  rationale: Переданы и местонахождение за пределами стана, и усиленное указание на удалённость. Повтор слова «стан» сохраняет эмфазу оригинала.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: מוֹעֵד обозначает назначенную встречу, а также назначенные время или место. «Шатёр встречи» естественно и без лишнего истолкования передаёт выражение в данном контексте.
- source_word: כָּל מְבַקֵּשׁ יְהוָה
  choice: каждый, кто искал Яхве
  rationale: בקש может означать как стремление к Богу, так и обращение к нему за ответом. Более широкое «искал» сохраняет обе смысловые возможности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя, выраженное тетраграмматоном, передано транслитерацией, а не заменено титулом.
- source_word: אֲשֶׁר מִחוּץ לַמַּחֲנֶה
  choice: находившемуся вне стана
  rationale: Причастный оборот естественно передаёт относительное придаточное и ясно относит местонахождение к шатру встречи.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон. «Яхве» сохраняет личное имя Бога и не подменяет его титулом.
- issue: Отождествление шатра
  choice: не уточнять, был ли это личный шатёр Моисея
  alternative: его шатёр; особый шатёр Моисея
  rationale: Определённый артикль у הָאֹהֶל указывает на конкретный шатёр, однако притяжательного местоимения в тексте нет. Перевод не разрешает неоднозначность, которой оригинал не разрешает.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Стан» выбран вместо разговорного «лагерь» как понятное традиционное обозначение расположения Израиля; синтаксис упрощён без устранения повтора и неоднозначности оригинала.
