base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/005.yaml
  text: And Yahweh said to Moses[a], “Say to the sons of Israel, ‘You are a stiff-necked people. In a single moment, if I were to go up in your midst, I would consume you. So now, take off your ornaments from upon you[e][d][c][b], and I will know what I should do with you.’”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Скажи сынам Израиля[a]: „Вы — жестоковыйный народ[b]. Если Я на одно мгновение пойду среди вас[c], то истреблю вас. А теперь снимите с себя украшения[d], и Я узнаю, что Мне сделать с вами[e]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам»; буквально: «сынам Израиля».'
    reason: lexical_alternative
  - marker: b
    text: То есть упрямый, непокорный народ. Еврейское выражение буквально описывает народ с жёсткой, несгибаемой шеей.
    reason: idiom_explanation
  - marker: c
    text: Глагол можно передать буквальнее как «поднимусь». Здесь и далее еврейский текст переходит к единственному числу, обращаясь к Израилю как к одному народу.
    reason: ambiguity_and_grammar
  - marker: d
    text: 'Или: «убранство», «наряды».'
    reason: lexical_alternative
  - marker: e
    text: 'Буквально: «и Я узнаю, что сделаю с тобой». Сохранён глагол «узнаю», а не пояснительное «решу».'
    reason: theological_tension
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога принятой русской транслитерацией, не заменяя его титулом «Господь».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет семейно-корпоративный образ еврейского выражения; по смыслу речь идёт обо всём народе Израиля.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: жестоковыйный народ
  rationale: Сохраняет образ несгибаемой шеи и его значение — упорное неповиновение. Слово литературное, но устойчиво в русской библейской речи.
- source_word: רֶגַע אֶחָד
  choice: хотя бы на мгновение
  rationale: Передаёт краткость предполагаемого пребывания Яхве среди народа и естественно связывается в русском с условной конструкцией.
- source_word: אֶעֱלֶה בְקִרְבְּךָ
  choice: пойду среди вас
  rationale: В контексте продолжения пути от Синая глагол обозначает движение в путь, тогда как буквальное «поднимусь среди вас» в современном русском может ошибочно пониматься как вставание. Выражение «среди вас» сохраняет тему Божьего присутствия внутри народа.
- source_word: וְכִלִּיתִיךָ
  choice: то истреблю вас
  rationale: Передаёт значение полного уничтожения в суде, не уточняя его способ.
- source_word: הוֹרֵד עֶדְיְךָ מֵעָלֶיךָ
  choice: снимите с себя украшения
  rationale: Естественно передаёт снятие носимых украшений; עֶדִי может обозначать украшение или убранство в собирательном смысле.
- source_word: וְאֵדְעָה
  choice: и Я узнаю
  rationale: Сохраняет глагол «знать» и антропоморфную формулировку исходного текста, не заменяя её толкованием «решу».
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: что Мне сделать с вами
  rationale: Оставляет характер будущего действия открытым и не сужает смысл до наказания, как сделало бы «что сделать вам».
theological_decisions:
- issue: Антропоморфное выражение о Божьем знании
  choice: «и Я узнаю, что Мне сделать с вами»
  alternative: «и Я решу, как поступить с вами»
  rationale: Исходный текст употребляет глагол «знать». Основной текст сохраняет богословское напряжение и не сводит выражение к отвлечённому принятию решения.
- issue: Переход от множественного к единственному числу при обращении к Израилю
  choice: В основном тексте употреблено естественное русское множественное число, а переход отмечен в сноске
  alternative: «среди тебя… истреблю тебя… сними… с тебя… с тобой»
  rationale: Еврейский текст сначала обращается к людям во множественном числе, затем — к Израилю как к единому народу в единственном. Буквальная смена числа в русском внутри одной реплики могла бы выглядеть как смена адресата, поэтому корпоративный смысл разъяснён сноской.
- issue: Условный оттенок угрозы
  choice: «Если Я хотя бы на мгновение пойду среди вас, то истреблю вас»
  alternative: «Я пойду среди вас на одно мгновение и истреблю вас»
  rationale: Форма глагола сама по себе не содержит явного условного союза, однако контекст 33:3–5 поддерживает условно-предостерегающий смысл. Альтернативное синтаксическое прочтение указано в сноске.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Жестоковыйный» сохранено ради исходной метафоры, но разъяснено в сноске; прочие конструкции сделаны естественными для современного читателя. Кавычки разграничивают речь Яхве, переданную через Моисея.
