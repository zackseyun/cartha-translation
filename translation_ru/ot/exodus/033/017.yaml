base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/017.yaml
  text: And Yahweh said to Moses[a], “I will also do this thing that you have spoken, because you have found favor in my eyes[b], and I know you by name.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Я исполню и эту просьбу, о которой ты говорил, потому что ты обрёл благоволение в Моих глазах[a] и Я знаю тебя по имени».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нашёл благоволение в Моих глазах» — еврейское выражение, означающее, что человек удостоился благосклонного отношения.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, соответствующей еврейскому יהוה и принятой современной русской форме.
- source_word: גַּם
  choice: и
  rationale: В данном контексте выражает добавление этой просьбы к уже данному Божьему обещанию; русское «и эту» естественно передаёт аддитивную силу.
- source_word: הַדָּבָר הַזֶּה
  choice: эту просьбу
  rationale: דָּבָר допускает значения «слово», «дело», «вопрос»; здесь речь идёт о только что высказанной Моисеем просьбе, поэтому контекстуальная передача звучит ясно и естественно.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: о которой ты говорил
  rationale: Сохраняет связь с речью Моисея и согласуется с контекстуальной передачей דָּבָר как «просьба».
- source_word: אֶעֱשֶׂה
  choice: Я исполню
  rationale: При объекте «просьбу» глагол «исполню» естественно передаёт обещание Бога сделать просимое, не меняя смысла עשה.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: ты обрёл благоволение в Моих глазах
  rationale: Сохраняет еврейский образ и передаёт חֵן современным литературным словом «благоволение».
- source_word: וָאֵדָעֲךָ
  choice: и Я знаю тебя
  rationale: Настоящее время естественно выражает продолжающееся личное знание и признание Моисея Богом.
- source_word: בְּשֵׁם
  choice: по имени
  rationale: Прямая и устойчивая русская передача, сохраняющая оттенок личного, конкретного знания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יהוה. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл Божьего знания Моисея по имени
  choice: Сохранена буквальная формулировка «Я знаю тебя по имени»
  alternative: Я избрал тебя; Я признаю тебя
  rationale: Исходный текст говорит о личном знании и признании, но не уточняет исчерпывающе его богословский объём; буквальная формулировка сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой Божьей речи. Контекстуальные «просьбу» и «исполню» делают фразу естественной, а примечание сохраняет буквальный еврейский образ идиомы.
