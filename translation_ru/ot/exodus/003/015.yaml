source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ע֨וֹד אֱלֹהִ֜ים אֶל מֹשֶׁ֗ה כֹּֽה תֹאמַר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ יְהוָ֞ה אֱלֹהֵ֣י אֲבֹתֵי/כֶ֗ם אֱלֹהֵ֨י אַבְרָהָ֜ם אֱלֹהֵ֥י יִצְחָ֛ק וֵ/אלֹהֵ֥י יַעֲקֹ֖ב שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם זֶה שְּׁמִ֣/י לְ/עֹלָ֔ם וְ/זֶ֥ה זִכְרִ֖/י לְ/דֹ֥ר דֹּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/015.yaml
  text: 'God also said to Moses[a], “Thus you shall say to the sons of Israel: Yahweh, the God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has sent me to you. This is my name forever[b], and this is my memorial from generation to generation.”'
translation:
  language: ru
  text: 'И Бог ещё сказал Моисею: «Так скажи сынам Израиля: „Яхве[a], Бог ваших отцов, Бог Авраама, Бог Исаака и Бог Иакова, послал меня к вам“. Это Моё имя навеки, и это — память обо Мне[b] из поколения в поколение».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: יהוה (YHWH); традиционный вариант передачи — «Иегова».'
    reason: alternative_reading
  - marker: b
    text: 'Также возможно: «Моё памятное имя» или «имя, которым Меня помнят».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет явный мужской род и родственную образность еврейского выражения, оставаясь понятным в возвышенной современной русской речи.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Бог ваших отцов
  rationale: Точно сохраняет мужской термин אָבוֹת и связь с названными далее праотцами.
- source_word: שְׁלָחַנִי
  choice: послал меня
  rationale: Русский глагол совершенного вида естественно выражает совершившееся поручение, сохраняющее силу в настоящем.
- source_word: זֶה שְּׁמִי לְעֹלָם
  choice: Это Моё имя навеки
  rationale: «Навеки» естественно и кратко передаёт длительность לְעֹלָם в данном контексте.
- source_word: זִכְרִי
  choice: так будут помнить Меня
  rationale: Контекстуально раскрывает производное от корня «помнить» существительное и делает смысл прозрачным по-русски, не сводя его непременно к материальному памятнику.
- source_word: לְדֹר דֹּר
  choice: из поколения в поколение
  rationale: Устойчивый русский оборот сохраняет идею непрерывной передачи через последовательные поколения.
- source_word: כֹּה תֹאמַר
  choice: Так скажи
  rationale: Естественная современная формула, точно вводящая предписанную прямую речь.
- source_word: עוֹד
  choice: И ещё
  rationale: Показывает продолжение Божьей речи, не создавая впечатления простого повторения.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя YHWH. Форма «Яхве» прямо передаёт его и не подменяет титулом; примечание указывает еврейское написание и традиционный вариант.
- issue: Сохранение мужских терминов родства
  choice: сынам Израиля; ваших отцов
  alternative: народу Израиля; ваших предков
  rationale: Еврейский текст употребляет выраженные мужские родственные термины; перевод сохраняет их без добавления конфессионального толкования.
- issue: Смысл זִכְרִי
  choice: так будут помнить Меня
  alternative: Моя память; Моё памятное имя
  rationale: Существительное допускает значения «память», «напоминание» и обозначение, посредством которого помнят. Основной текст передаёт функцию выражения, а примечание сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формы «сынам Израиля» и «навеки» сохраняют достоинство и близость к структуре оригинала; прописные буквы в «Моё/Меня» служат принятой русской типографической формой почтительного обозначения Бога, не меняя смысла.
