  text: וָ/אֵרֵ֞ד לְ/הַצִּיל֣/וֹ מִ/יַּ֣ד מִצְרַ֗יִם וּֽ/לְ/הַעֲלֹת/וֹ֮ מִן הָ/אָ֣רֶץ הַ/הִוא֒ אֶל אֶ֤רֶץ טוֹבָה֙ וּ/רְחָבָ֔ה אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֶל מְק֤וֹם הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/008.yaml
  text: And I have come down to deliver him from the hand of Egypt and to bring him up from that land to a good and broad land[a], to a land flowing with milk and honey, to the place of the Canaanite, the Hittite, the Amorite, the Perizzite, the Hivite[c][b], and the Jebusite.
translation:
  language: ru
  text: И Я сошёл, чтобы избавить его[a] из-под власти Египта[b] и вывести его из той земли в землю хорошую и просторную[c], в землю, где текут молоко и мёд, в место обитания хананеев, хеттеев, аморреев, ферезеев, евеев и иевусеев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Единственное число «его» в обоих случаях относится ко всему народу Израиля как к единому целому.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из руки Египта»; это выражение означает власть или господство Египта.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «хорошую и широкую землю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֵד
  choice: И Я сошёл
  rationale: Сохранены совершенный вид и пространственно-антропоморфный образ еврейского глагола ירד; форма естественно продолжает прямую речь Бога.
- source_word: לְהַצִּילוֹ
  choice: чтобы избавить его
  rationale: Глагол נצל в породе Hiphil обозначает избавление или вырывание из опасности. «Избавить» передаёт конкретное освобождение и не сужает смысл до отвлечённо-духовного спасения.
- source_word: מִיַּד מִצְרַיִם
  choice: из-под власти Египта
  rationale: Еврейская идиома «из руки» обозначает власть или контроль. Функциональный русский эквивалент понятен современному читателю, а исходный образ отмечен в сноске.
- source_word: וּלְהַעֲלֹתוֹ מִן הָאָרֶץ הַהִוא
  choice: и вывести его из той земли
  rationale: Hiphil глагола עלה буквально выражает побуждение к движению вверх. В данном географическом контексте русское «вывести из… в…» естественно передаёт исход и направление, тогда как «поднять его из земли» могло бы ошибочно намекать на поднятие с поверхности или воскресение.
- source_word: אֶל אֶרֶץ טוֹבָה וּרְחָבָה
  choice: в землю хорошую и просторную
  rationale: Сохранены оба определения и их порядок; «просторную» естественно передаёт идею широты и свободы пространства.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: в землю, где текут молоко и мёд
  rationale: Формулировка сохраняет образ текущего изобилия, выраженный причастием זָבַת, и звучит ясно по-русски.
- source_word: אֶל מְקוֹם הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: в место обитания хананеев, хеттеев, аморреев, ферезеев, евеев и иевусеев
  rationale: «Место» отражает מְקוֹם, а «обитания» естественно выражает связь места с перечисленными народами. Еврейские этнонимы стоят в собирательном единственном числе; русский перевод употребляет обычное множественное число.
theological_decisions:
- issue: Антропоморфное изображение движения Бога
  choice: 'Сохранить: «Я сошёл»'
  alternative: 'Передать отвлечённо: «Я вмешался» или «Я решил действовать»'
  rationale: Исходный текст пространственно и образно описывает действие Бога. Буквальная передача сохраняет напряжение повествования и не заменяет его богословским истолкованием.
- issue: Собирательное единственное число применительно к Израилю
  choice: Сохранить местоимение единственного числа «его» в обоих действиях
  alternative: Употребить множественное число «их»
  rationale: Оба еврейских местоименных суффикса имеют форму мужского рода единственного числа и представляют Израиль как единый народ. Русское «его» позволяет сохранить эту особенность без неясности.
- issue: Образ земли, где «текут молоко и мёд»
  choice: Сохранить образ буквально
  alternative: Разъяснить как «плодородную и изобильную землю»
  rationale: Метафора является значимой частью библейского описания земли и не должна заменяться истолковывающим обобщением.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой божественной речи. Синтаксис сохраняет нарастающее описание обещанной земли, но идиоматическое «из-под власти» и собирательные названия народов во множественном числе обеспечивают ясность для обычного читателя.
