base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/003.yaml
  text: Then Moses said[a], “Let me turn aside and see this great sight, why the bush is not burned up.”
translation:
  language: ru
  text: 'Тогда Моисей сказал: «Я сверну в сторону и посмотрю на это великое зрелище: почему куст не сгорает[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «почему куст не горит»; или: «почему куст не уничтожается огнём».'
    reason: Лексически форма לֹא יִבְעַר допускает акцент либо на самом горении, либо, с учётом контекста, на том, что огонь не уничтожает куст.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: אָסֻרָה נָּא
  choice: Пойду
  rationale: Когортатив с נָא выражает намерение говорящего; в данном внутреннем побуждении естественное русское «пойду» передаёт решение отклониться от пути и приблизиться, не вводя неуместной просьбы о разрешении.
- source_word: וְאֶרְאֶה
  choice: посмотрю
  rationale: В контексте речь идёт о намеренном зрительном рассмотрении необычного явления; «посмотрю» естественнее простого «увижу».
- source_word: הַמַּרְאֶה הַגָּדֹל הַזֶּה
  choice: это великое явление
  rationale: מַרְאֶה обозначает увиденное явление или зрелище; «явление» сохраняет возвышенный, но понятный регистр, а «великое» передаёт גָּדֹל без сведения смысла лишь к необычности.
- source_word: מַדּוּעַ
  choice: почему
  rationale: Прямой русский эквивалент вопросительного слова причины.
- source_word: לֹא יִבְעַר
  choice: не сгорает
  rationale: Глагол בער означает «гореть»; русское «не сгорает» в данном контексте естественно выражает парадокс продолжающего гореть, но не уничтожаемого огнём куста, сохраняя связь с лексикой горения.
- source_word: הַסְּנֶה
  choice: куст
  rationale: Общее и ясное обозначение; перевод «терновый куст» был бы возможен, но добавлял бы не вполне обязательную конкретизацию.
theological_decisions:
- issue: Характер огненного явления с кустом
  choice: почему куст не сгорает
  alternative: почему куст не горит; почему куст не уничтожается огнём
  rationale: Еврейский глагол непосредственно связан с горением, тогда как контекст указывает на отсутствие уничтожения. «Не сгорает» удерживает оба аспекта и не добавляет богословского истолкования знамения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Реплика Моисея передана естественно и ясно; двоеточие оформляет последующий вопрос как содержание того, что он намерен выяснить.
