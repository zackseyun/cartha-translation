  text: וּ/מֹשֶׁ֗ה הָיָ֥ה רֹעֶ֛ה אֶת צֹ֛אן יִתְר֥וֹ חֹתְנ֖/וֹ כֹּהֵ֣ן מִדְיָ֑ן וַ/יִּנְהַ֤ג אֶת הַ/צֹּאן֙ אַחַ֣ר הַ/מִּדְבָּ֔ר וַ/יָּבֹ֛א אֶל הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽבָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/001.yaml
  text: Moses was shepherding the flock of Jethro his father-in-law[a], the priest of Midian. He led the flock beyond the wilderness and came to the mountain of God, Horeb.
translation:
  language: ru
  text: Моисей пас стадо Иофора, своего тестя, мадиамского священника. Он повёл стадо за пустыню[a] и пришёл к горе Божьей, Хориву.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на дальнюю сторону пустыни».'
    reason: Сочетание אַחַר הַמִּדְבָּר допускает более развёрнутую пространственную передачу.
lexical_decisions:
- source_word: וּ/מֹשֶׁה
  choice: Моисей
  rationale: Союз ו вводит новую сцену; в современном русском повествовании отдельное «и» или «теперь» здесь не требуется.
- source_word: הָיָה רֹעֶה
  choice: пас
  rationale: Сочетание обозначает продолжавшееся в прошлом занятие; русский несовершенный вид естественно передаёт его без вспомогательного глагола.
- source_word: צֹאן
  choice: стадо
  rationale: Слово обозначает совокупность мелкого скота, обычно овец и коз; «стадо» — естественный русский собирательный эквивалент.
- source_word: יִתְרוֹ
  choice: Иофора
  rationale: Использована укоренившаяся русская библейская форма имени в требуемом родительном падеже.
- source_word: חֹתְנוֹ
  choice: своего тестя
  rationale: По контексту речь об отце жены Моисея; «тесть» точно и естественно обозначает это родство.
- source_word: כֹּהֵן מִדְיָן
  choice: мадиамского священника
  rationale: Атрибутивная конструкция естественно передаёт принадлежность/связь священника с Мадиамом, не уточняя сверх текста характер его служения.
- source_word: וַיִּנְהַג
  choice: повёл
  rationale: Глагол может означать «вести» или «гнать»; нейтральное «повёл» подходит для перемещения стада и не добавляет оттенка принуждения.
- source_word: אַחַר הַמִּדְבָּר
  choice: за пустыню
  rationale: Пространственное אַחַר здесь указывает на дальнюю сторону пустыни; краткое русское выражение сохраняет эту пространственную идею.
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Обычный русский повествовательный эквивалент глагола движения с достижением места.
- source_word: הַר הָאֱלֹהִים
  choice: к горе Божьей
  rationale: Прямо сохраняет конструкцию «гора Бога», не решая, была ли гора уже известна как священная или названа так ретроспективно.
- source_word: חֹרֵבָה
  choice: Хориву
  rationale: Направительный суффикс передан русским дательным падежом после подразумеваемого направления к горе; название дано как поясняющее приложение.
theological_decisions:
- issue: Следует ли толковательно обозначить הַר הָאֱלֹהִים как уже освящённую гору
  choice: гора Божья
  alternative: священная гора
  rationale: 'Прямой перевод сохраняет неопределённость: обозначение может быть ретроспективным, предвосхищающим или уже общепринятым.'
translation_notes:
  register: Современный литературный русский с традиционными русскими формами библейских имён. «Однажды» служит естественным переходом от фонового несовершенного действия к последовательности событий, не выражая точной даты. Тире перед «Хориву» ясно оформляет приложение и сохраняет Хорив как наименование горы Божьей.
