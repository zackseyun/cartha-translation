base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/012.yaml
  text: 'And he said[a], “Certainly I will be with you, and this will be the sign for you that I have sent you: when you bring the people out of Egypt, you will serve God on this mountain.”'
translation:
  language: ru
  text: 'Он сказал: «Я непременно буду с тобой. Вот знамение для тебя, что Я послал тебя: когда ты выведешь народ из Египта, вы будете служить Богу[a] на этой горе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклоняться Богу». Еврейский глагол может означать и «служить», и — когда речь идёт о Боге — «поклоняться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: непременно
  rationale: В начале ответа частица имеет утвердительно-усилительное значение и выражает заверение Бога в Своём присутствии; «непременно» естественно передаёт эту силу по-русски.
- source_word: אֶהְיֶה
  choice: буду
  rationale: Имперфект היה здесь обращён к будущему и выражает обещание сопровождающего присутствия.
- source_word: עִמָּךְ
  choice: с тобой
  rationale: Прямо передаёт значение совместного присутствия и сопровождения.
- source_word: הָאוֹת
  choice: знамение
  rationale: Слово обозначает знак, подтверждающий Божье поручение; «знамение» сохраняет библейский регистр, оставаясь понятным современному читателю.
- source_word: כִּי אָנֹכִי שְׁלַחְתִּיךָ
  choice: того, что Я послал тебя
  rationale: Придаточное указывает, что именно подтверждает знамение. Местоимение אָנֹכִי выражено формой «Я» без добавления отсутствующего в тексте пояснения.
- source_word: בְּהוֹצִיאֲךָ
  choice: когда ты выведешь
  rationale: Инфинитивная конструкция с בְּ и суффиксом 2-го лица естественно понимается как временная; Моисей выступает действующим лицом, выводящим народ.
- source_word: הָעָם
  choice: народ
  rationale: Определённое обозначение народа Израиля в данном повествовательном контексте.
- source_word: תַּעַבְדוּן
  choice: вы будете служить
  rationale: Глагол עבד может обозначать как служение, так и поклонение Богу. «Служить» сохраняет его смысловую широту, а множественное число передаёт обращение к Моисею вместе с народом.
- source_word: אֶת־הָאֱלֹהִים
  choice: Богу
  rationale: В контексте имеется в виду Бог Израиля; простое «Богу» не вносит дополнительных толкований.
- source_word: עַל הָהָר הַזֶּה
  choice: на этой горе
  rationale: Сохраняет пространственное значение עַל и конкретную связь обещания с указанной горой.
theological_decisions:
- issue: Что является обещанным знамением
  choice: Знамением служит будущее служение Богу на этой горе после исхода.
  alternative: Знамением является само обещание Божьего присутствия либо одновременно обещание и его будущее исполнение.
  rationale: Синтаксис наиболее естественно связывает содержание знамения с последующей фразой о выведении народа и служении на горе. Формулировка не превращает будущее подтверждение в отдельное немедленное чудо.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис упрощён ради ясности, но последовательность обещания, знамения и будущего служения сохранена. Местоимения в прямой речи оформлены по обычным нормам русского языка.
