base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/006.yaml
  text: Then he said, “I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.” And Moses hid his face, because he was afraid to look at God.
translation:
  language: ru
  text: 'И сказал Он: «Я — Бог твоего отца, Бог Авраама, Бог Исаака и Бог Иакова». Моисей закрыл лицо, потому что боялся взглянуть на Бога.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал Он
  rationale: Вав-последовательный продолжает повествование; «И сказал» естественно передаёт последовательность. Местоимение «Он» проясняет подразумеваемое подлежащее в русском контексте.
- source_word: אָנֹכִי
  choice: Я —
  rationale: Самостоятельное местоимение имеет эмфатический оттенок; тире естественно оформляет русское именное сказуемое и сохраняет торжественность самоидентификации.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: Бог твоего отца
  rationale: Сохраняются единственное число «отца» и прозрачная структура еврейского сопряжённого сочетания.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: Бог Авраама, Бог Исаака и Бог Иакова
  rationale: Повтор слова «Бог» сохранён как явный риторический и заветный акцент исходного текста.
- source_word: וַיַּסְתֵּר ... פָּנָיו
  choice: закрыл лицо
  rationale: Глагол в данном контексте означает скрыть или закрыть; по-русски «закрыл лицо» естественно описывает действие Моисея, не добавляя способа действия.
- source_word: כִּי יָרֵא
  choice: потому что боялся
  rationale: Передаёт причинное значение כִּי и состояние страха без архаизации.
- source_word: מֵהַבִּיט
  choice: взглянуть
  rationale: После глагола страха конструкция с מן обозначает действие, которого опасались; совершенный инфинитив «взглянуть» идиоматичен и передаёт направленный зрительный акт.
- source_word: אֶל הָאֱלֹהִים
  choice: на Бога
  rationale: Предлог и определённое אֱלֹהִים в данном контексте естественно передаются как «на Бога» — Бога праотцов, говорящего Моисею.
theological_decisions:
- issue: Передача אֱלֹהִים в прямом Божьем самооткровении
  choice: Бог
  alternative: божество
  rationale: Контекст однозначно указывает на Бога праотцов; слово «Бог» сохраняет личную и заветную самоидентификацию, не привнося дополнительной конфессиональной интерпретации.
- issue: Повтор формулы «Бог» перед именем каждого праотца
  choice: Бог Авраама, Бог Исаака и Бог Иакова
  alternative: Бог Авраама, Исаака и Иакова
  rationale: Повтор присутствует в еврейском тексте и несёт смысловое и риторическое ударение, поэтому не сглаживается.
- issue: Число в выражении אָבִיךָ
  choice: твоего отца
  alternative: твоих отцов
  rationale: Масоретский текст содержит форму единственного числа; перевод сохраняет её и не отождествляет молча «отца» с перечисленными далее праотцами.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; повтор исходного текста сохранён, архаизмы устранены.
