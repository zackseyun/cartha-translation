  text: לֵ֣ךְ וְ/אָֽסַפְתָּ֞ אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אָמַרְתָּ֤ אֲלֵ/הֶם֙ יְהוָ֞ה אֱלֹהֵ֤י אֲבֹֽתֵי/כֶם֙ נִרְאָ֣ה אֵלַ֔/י אֱלֹהֵ֧י אַבְרָהָ֛ם יִצְחָ֥ק וְ/יַעֲקֹ֖ב לֵ/אמֹ֑ר פָּקֹ֤ד פָּקַ֨דְתִּי֙ אֶתְ/כֶ֔ם וְ/אֶת הֶ/עָשׂ֥וּי לָ/כֶ֖ם בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/016.yaml
  text: 'Go and gather the elders of Israel[a], and say to them, ‘Yahweh, the God of your fathers—the God of Abraham, Isaac, and Jacob—has appeared to me[b], saying: “I have surely attended to you and to what has been done to you in Egypt.”’'
translation:
  language: ru
  text: 'Иди, собери старейшин Израиля и скажи им: «Яхве, Бог ваших отцов[a], Бог Авраама, Исаака и Иакова, явился мне и сказал: „Я обратил особое внимание на вас[b] и на то, что сделано с вами в Египте“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваших предков». Буквально: «ваших отцов»; далее названы Авраам, Исаак и Иаков.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я непременно посетил вас». Еврейская усилительная конструкция выражает решительное Божье внимание, ведущее к вмешательству, а не просто обычный приход.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ וְאָסַפְתָּ
  choice: Иди, собери
  rationale: Повеление לֵךְ передано прямым императивом, а форма с וְ после него — естественным для русского языка продолжением поручения без избыточного союза.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: старейшин Израиля
  rationale: Устойчивое обозначение признанных руководителей общины; «старейшины» сохраняет общественно-политический смысл, а не просто указание на возраст.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Бог ваших отцов
  rationale: Сохраняется буквальная патриархальная формулировка, которую далее поясняют имена Авраама, Исаака и Иакова.
- source_word: נִרְאָה אֵלַי
  choice: явился мне
  rationale: Нифаль глагола ראה здесь выражает богоявление; активное по-русски «явился» естественно передаёт этот смысл.
- source_word: לֵאמֹר
  choice: и сказал
  rationale: Формула введения речи передана естественной русской конструкцией, не меняющей говорящего и содержания сообщения.
- source_word: פָּקֹד פָּקַדְתִּי
  choice: Я непременно обратил внимание на вас
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает утверждение. «Непременно» передаёт усиление, а «обратил внимание» — целенаправленное Божье внимание, подразумевающее последующее вмешательство.
- source_word: וְאֶת הֶעָשׂוּי לָכֶם
  choice: и на то, что сделано с вами
  rationale: Пассивная конструкция сохранена без добавления отсутствующего в оригинале действующего лица; форма «сделано» передаёт результат причинённого израильтянам притеснения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе употреблено собственное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Значение פָּקֹד פָּקַדְתִּי
  choice: Я непременно обратил внимание на вас
  alternative: Я непременно посетил вас
  rationale: Еврейское выражение обозначает решительное Божье внимание, ведущее к действию. Основной текст избегает современного понимания «посетил» как обычного прихода, а примечание сохраняет традиционно возможную передачу и смысловую напряжённость.
- issue: Кого обозначают אֲבֹתֵיכֶם
  choice: ваших отцов
  alternative: ваших предков
  rationale: Непосредующее перечисление Авраама, Исаака и Иакова показывает конкретную патриархальную направленность выражения; более широкое «предков» возможно по смыслу, но менее точно в данном контексте.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис прямой и понятный; сохранены вложенная речь, личное имя Бога, патриархальная формула и пассивность последней фразы.
