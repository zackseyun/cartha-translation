source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ֣/אֱלֹהִ֔ים מִ֣י אָנֹ֔כִי כִּ֥י אֵלֵ֖ךְ אֶל פַּרְעֹ֑ה וְ/כִ֥י אוֹצִ֛יא אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/011.yaml
  text: But Moses said to God[a], “Who am I that I should go to Pharaoh and that I should bring the sons of Israel out of Egypt?”
translation:
  language: ru
  text: 'Но Моисей сказал Богу: «Кто я такой, чтобы идти к фараону и вывести сынов Израиля[a] из Египта?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян»; традиционно: «детей Израиля».'
    reason: Лексические варианты передачи בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная передача повествовательной формы глагола אמר в современном русском языке.
- source_word: אֶל הָאֱלֹהִים
  choice: Богу
  rationale: Определённая форма указывает здесь на Бога; русская конструкция «сказать кому» естественно требует дательного падежа.
- source_word: מִי אָנֹכִי
  choice: Кто я такой
  rationale: Естественный русский риторический вопрос, передающий самоумаление и ощущение несоответствия поручению без добавочного толкования.
- source_word: כִּי אֵלֵךְ
  choice: чтобы идти
  rationale: כִּי после «кто я» вводит предполагаемое действие; конструкция «кто я такой, чтобы…» идиоматична и сохраняет риторический смысл.
- source_word: פַּרְעֹה
  choice: фараону
  rationale: Устоявшаяся русская передача египетского царского титула; направление действия выражено дательным падежом с «идти к».
- source_word: וְכִי אוֹצִיא
  choice: и вывести
  rationale: Порода хифиль глагола יצא имеет каузативное значение «вывести»; союз сохраняет два параллельных аспекта возражения Моисея.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально сохраняет родственно-генеалогическое выражение בני ישראל и его грамматически мужскую форму; более идиоматичный коллективный вариант отмечен в сноске.
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Предлог מִן с каузативным «вывести» естественно передаёт исходное место конструкцией «из Египта».
theological_decisions:
- issue: Передача выражения בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; детей Израиля
  rationale: Основной текст сохраняет мужскую и генеалогическую форму еврейского выражения. Слово «израильтян» яснее обозначает весь народ, но менее буквально; традиционное «детей Израиля» в современном русском может быть ошибочно понято как указание на возраст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «Кто я такой, чтобы…» естественна для обычного читателя и сохраняет риторическую силу оригинала; «сынов Израиля» сознательно оставлено как более формально точное выражение.
