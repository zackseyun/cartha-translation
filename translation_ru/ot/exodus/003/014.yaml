base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/014.yaml
  text: 'And God said to Moses[a], “I AM WHO I AM.” And he said[b], “Thus you shall say to the sons of Israel: ‘I AM has sent me to you.’”'
translation:
  language: ru
  text: 'И сказал Бог Моисею: «Я ЕСТЬ ТОТ, КТО Я ЕСТЬ».[a] Затем Он сказал: «Так скажи израильтянам[b]: „Я ЕСТЬ“ послал меня к вам».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Я буду тем, кем буду» или «Я буду тем, чем буду». Еврейская глагольная форма здесь может иметь как настоящее, так и будущее значение.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «сынам Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Хотя форма морфологически множественного числа, в данном повествовательном контексте она обозначает единого Бога Израиля и согласуется с глаголом в единственном числе.
- source_word: אֶהְיֶה
  choice: Я ЕСТЬ
  rationale: Форма Qal imperfect, 1-е лицо единственного числа, допускает настоящее и будущее значение. В основном тексте выбрано настоящее время, поскольку выражение служит самообозначением и затем повторяется как имя; возможность будущего значения сохранена в примечании.
- source_word: אֲשֶׁר
  choice: ТОТ, КТО
  rationale: Относительное слово имеет широкий диапазон значений. В контексте личного самообозначения конструкция «ТОТ, КТО» естественна по-русски, не устраняя присущей всей формуле загадочности.
- source_word: כֹּה תֹאמַר
  choice: Так скажи
  rationale: כֹּה вводит формулу передаваемой речи, а imperfect תֹאמַר имеет здесь повелительную силу. «Так скажи» звучит ясно, торжественно и современно.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: израильтянам
  rationale: В данном контексте устойчивое еврейское выражение обозначает народ Израиля. Современное русское «израильтянам» естественно передаёт его референт; буквальная форма указана в примечании.
- source_word: שְׁלָחַנִי
  choice: послал меня
  rationale: Перфект 3-го лица мужского рода единственного числа с суффиксом 1-го лица передаёт совершившееся поручение; в русской прямой речи естественно простое прошедшее время.
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная конструкция с waw продвигает повествование; повтор «И сказал» сохраняет структуру и торжественный ритм еврейского текста.
theological_decisions:
- issue: Передача божественного самообозначения אֶהְיֶה אֲשֶׁר אֶהְיֶה
  choice: Я ЕСТЬ ТОТ, КТО Я ЕСТЬ
  alternative: Я БУДУ ТЕМ, КЕМ БУДУ
  rationale: Еврейский imperfect допускает как настоящее, так и будущее понимание. Основной вариант подчёркивает функцию самообозначения и его повтор во второй части стиха, а примечание сохраняет реальную временную неоднозначность текста.
- issue: Типографическое оформление «Я ЕСТЬ»
  choice: Прописные буквы
  alternative: Я есть; Я буду
  rationale: Прописные буквы помогают читателю распознать повторяемое божественное самообозначение. Это редакционное оформление, а не утверждение о наличии особой графической формы в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Форма «израильтянам» предпочтена архаизирующему «сынам Израиля» в основном тексте; буквальный оборот сохранён в примечании. Необычная для русского явная связка «Я ЕСТЬ» намеренно сохранена ради формы самообозначения и её точного повторения.
