  text: וְ/שָׁלַחְתִּ֤י אֶת יָדִ/י֙ וְ/הִכֵּיתִ֣י אֶת מִצְרַ֔יִם בְּ/כֹל֙ נִפְלְאֹתַ֔/י אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה בְּ/קִרְבּ֑/וֹ וְ/אַחֲרֵי כֵ֖ן יְשַׁלַּ֥ח אֶתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/020.yaml
  text: And I will stretch out my hand and strike Egypt with all my wonders that I will do in its midst[b][a]; and after that he will send you out.
translation:
  language: ru
  text: И Я простру Мою руку[a] и поражу Египет всеми Моими чудесами, которые совершу посреди него; после этого он отпустит вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пошлю Мою руку». Еврейское выражение означает протянуть руку, чтобы действовать или явить силу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вышлет вас». Еврейский глагол буквально означает «послать, выслать», а в этом контексте — отпустить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי אֶת־יָדִי
  choice: И Я простру Мою руку
  rationale: Буквально глагол שׁלח означает «послать», но в сочетании с «рукой» это устойчивый образ протянутой руки, действующей силой. «Простру руку» сохраняет конкретную метафору и звучит естественно в возвышенной современной русской речи.
- source_word: וְהִכֵּיתִי
  choice: и поражу
  rationale: נכה обозначает нанесение удара или поражение. «Поражу» подходит для предстоящих казней, не уточняя без основания ни смерть, ни полное уничтожение.
- source_word: מִצְרַיִם
  choice: Египет
  rationale: В еврейском тексте назван Египет как страна и совокупное целое, а не только отдельные египтяне.
- source_word: בְּכֹל נִפְלְאֹתַי
  choice: всеми Моими чудесами
  rationale: נפלאות — необычайные деяния, вызывающие изумление. «Чудеса» кратко и точно передаёт смысл, сохраняя библейскую образность.
- source_word: אֲשֶׁר אֶעֱשֶׂה
  choice: которые совершу
  rationale: «Совершу» естественно сочетается в русском языке с «чудесами» и передаёт простой глагол עשה без добавления нового смысла.
- source_word: בְּקִרְבּוֹ
  choice: посреди него
  rationale: Местоименный суффикс мужского рода единственного числа относится к Египту как единому целому. Формулировка сохраняет и число, и пространственный образ еврейского текста.
- source_word: וְאַחֲרֵי כֵן
  choice: после этого
  rationale: Фраза ясно обозначает временную последовательность событий.
- source_word: יְשַׁלַּח אֶתְכֶם
  choice: он отпустит вас
  rationale: Подразумеваемый субъект — фараон. В данном контексте שׁלח означает позволить народу уйти; «отпустит вас» естественно передаёт это по-русски, тогда как более буквальное «вышлет вас» отмечено в сноске.
theological_decisions:
- issue: Антропоморфный образ Божьего действия
  choice: 'Сохранить образ: «простру Мою руку»'
  alternative: 'Передать отвлечённо: «явлю Мою силу»'
  rationale: Еврейский текст описывает Божье вмешательство конкретным телесным образом. Его сохранение передаёт исходную метафору и не заменяет её богословским толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Простру» сохраняет традиционную образность, оставаясь понятным; синтаксис сделан ясным и не перегруженным.
