  text: וַ/יֹּ֖אמֶר אַל תִּקְרַ֣ב הֲלֹ֑ם שַׁל נְעָלֶ֨י/ךָ֙ מֵ/עַ֣ל רַגְלֶ֔י/ךָ כִּ֣י הַ/מָּק֗וֹם אֲשֶׁ֤ר אַתָּה֙ עוֹמֵ֣ד עָלָ֔י/ו אַדְמַת קֹ֖דֶשׁ הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/005.yaml
  text: Then he said[a], “Do not come near here. Remove your sandals from your feet[b], because the place where you are standing is holy ground.”
translation:
  language: ru
  text: 'И сказал Он: «Не подходи сюда. Сними с ног сандалии, потому что место, на котором ты стоишь, — святая земля[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «земля святости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал Он
  rationale: Ваййиктоль продолжает повествовательную последовательность; союз «и» естественно сохраняет её в русском библейском повествовании. Заглавная буква у местоимения указывает на Бога в непосредственном контексте, не добавляя имени, которого нет в стихе.
- source_word: אַל תִּקְרַב הֲלֹם
  choice: Не подходи сюда
  rationale: Отрицание с глагольной формой выражает запрет, а הֲלֹם обозначает движение к данному месту. Русская фраза передаёт оба компонента кратко и естественно.
- source_word: שַׁל נְעָלֶיךָ מֵעַל רַגְלֶיךָ
  choice: Сними с ног сандалии
  rationale: Императив означает снять или стянуть; «сандалии» сохраняет историко-культурную конкретность נְעָלִים, а «с ног» передаёт מֵעַל רַגְלֶיךָ без неестественного буквализма.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание предшествующего повеления; «потому что» ясно выражает причинное отношение в современном русском языке.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עוֹמֵד עָלָיו
  choice: место, на котором ты стоишь
  rationale: Относительная конструкция и עָלָיו переданы явно; это точно и естественно по-русски.
- source_word: אַדְמַת קֹדֶשׁ
  choice: святая земля
  rationale: Конструкция буквально означает «земля/почва святости». Устойчивое русское соответствие «святая земля» точно передаёт качественный смысл, не объясняя источник святости.
- source_word: הוּא
  choice: —
  rationale: Местоимение выполняет связочную или идентифицирующую функцию; в русском предложении с именной частью сказуемого она естественно выражается нулевой связкой и тире.
theological_decisions:
- issue: Причина святости места
  choice: Оставить утверждение «место… — святая земля» без пояснения причины святости.
  alternative: Добавить, что земля свята из-за присутствия Бога.
  rationale: Сам стих утверждает святость земли, но не формулирует отдельного объяснения её происхождения; перевод не должен вносить подразумеваемое толкование в основной текст.
- issue: Референт говорящего
  choice: Передать וַיֹּאמֶר как «И сказал Он», сохранив местоименный субъект из контекста.
  alternative: 'Уточнить в тексте: «И сказал Бог» или «И сказал Господь».'
  rationale: В еврейском стихе имя говорящего здесь не повторяется. Местоименная передача сохраняет контекст, не добавляя отсутствующего в данной фразе божественного наименования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировки ясные и неархаичные; сохранены пространственная конкретность запрета и лаконичное утверждение о святости земли.
