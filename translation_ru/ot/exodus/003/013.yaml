  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָֽ/אֱלֹהִ֗ים הִנֵּ֨ה אָנֹכִ֣י בָא֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/אָמַרְתִּ֣י לָ/הֶ֔ם אֱלֹהֵ֥י אֲבוֹתֵי/כֶ֖ם שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם וְ/אָֽמְרוּ לִ֣/י מַה שְּׁמ֔/וֹ מָ֥ה אֹמַ֖ר אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/013.yaml
  text: Then Moses said to God, “Look, when I come to the sons of Israel and say to them, ‘The God of your fathers has sent me to you,’ and they say to me, ‘What is his name?’ what shall I say to them?”
translation:
  language: ru
  text: 'И сказал Моисей Богу: «Вот, я приду к сынам Израиля и скажу им: „Бог ваших отцов послал меня к вам“. А они спросят меня: „Каково Его имя?“ Что мне сказать им?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: «Вот»
  rationale: Сохраняет вводно-указательную функцию еврейского слова и естественно обозначает предполагаемую ситуацию в речи Моисея.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: «сынам Израиля»
  rationale: Формально передаёт родовое обозначение народа Израиля и соответствует dignified библейскому регистру современного русского языка.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: «Бог ваших отцов»
  rationale: Прямо сохраняет связь с предками адресатов; «отцов» здесь означает праотцев народа.
- source_word: מַה שְּׁמוֹ
  choice: «Как Его имя?»
  rationale: Естественный русский вопрос о том, как зовут Бога, при этом сохраняющий ключевое для контекста существительное «имя».
- source_word: מָה אֹמַר אֲלֵהֶם
  choice: «Что мне сказать им?»
  rationale: Точно передаёт вопросительную конструкцию и модальное значение несовершенного вида в данном контексте.
theological_decisions:
- issue: Значение вопроса об имени Бога
  choice: Сохранён буквальный вопрос «Как Его имя?» без пояснения его богословского смысла.
  alternative: «Как Его зовут?» или развёрнутое толкование имени как характера/сущности.
  rationale: Исходный текст формулирует вопрос кратко и допускает широкий древнеближневосточный и богословский фон; перевод не должен заранее разрешать эту напряжённость.
- issue: Обозначение Бога как Бога предков
  choice: «Бог ваших отцов»
  alternative: «Бог ваших предков»
  rationale: Выбран более формальный вариант, сохраняющий лексический образ исходника, без добавления конфессиональных оттенков.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис упрощён ровно настолько, чтобы длинная условно-временная реплика оставалась ясной; повтор «к вам» сохранён вслед за оригиналом.
