  text: וְ/עַתָּ֕ה הִנֵּ֛ה צַעֲקַ֥ת בְּנֵי יִשְׂרָאֵ֖ל בָּ֣אָה אֵלָ֑/י וְ/גַם רָאִ֨יתִי֙ אֶת הַ/לַּ֔חַץ אֲשֶׁ֥ר מִצְרַ֖יִם לֹחֲצִ֥ים אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/009.yaml
  text: And now[a], behold, the cry of the sons of Israel has come to me[b], and I have also seen the oppression with which the Egyptians are oppressing them.
translation:
  language: ru
  text: И вот, теперь вопль сынов Израиля дошёл до Меня[a], и Я также увидел угнетение, которым египтяне угнетают их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пришёл ко Мне».'
    reason: Лексическая альтернатива, более буквально передающая בָּאָה אֵלַי.
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет как соединительный союз, так и временно-переходное значение выражения.
- source_word: הִנֵּה
  choice: вот
  rationale: Современная и естественная русская частица, привлекающая внимание без архаизации.
- source_word: צַעֲקַת
  choice: вопль
  rationale: Передаёт громкий крик, вызванный тяжёлым бедствием и обращённый за помощью.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет буквальный родственный и заветный образ еврейского выражения.
- source_word: בָּאָה אֵלַי
  choice: дошёл до Меня
  rationale: Естественно передаёт буквальное «пришёл ко Мне» применительно к воплю, не устраняя образ движения.
- source_word: וְגַם רָאִיתִי
  choice: и Я также увидел
  rationale: Сохраняет добавочное значение וְגַם и завершённое восприятие с актуальным для последующего действия результатом.
- source_word: הַלַּחַץ
  choice: как ... угнетают
  rationale: Русская глагольная конструкция естественно передаёт угнетение и позволяет сохранить однокоренную связь существительного с причастием лишь по смыслу, избегая тяжёлого «угнетение, которым угнетают».
- source_word: מִצְרַיִם לֹחֲצִים
  choice: египтяне угнетают
  rationale: Множественное причастие показывает, что מִצְרַיִם здесь обозначает египтян как действующих лиц; настоящее время передаёт продолжающееся действие.
- source_word: אֹתָם
  choice: их
  rationale: Прямое дополнение относится к сынам Израиля.
theological_decisions:
- issue: Родовое и заветное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: дети Израиля; израильтяне
  rationale: Буквальная формула сохраняет мужской множественный род и родственный образ исходного текста, не сводя его к одному лишь этнониму.
- issue: Божье видение угнетения
  choice: Я также увидел, как египтяне угнетают их
  alternative: Я также вижу их угнетение египтянами
  rationale: Прошедшее совершенное «увидел» соответствует форме רָאִיתִי и сохраняет связь уже увиденного Богом бедствия с начинающимся действием, не вводя дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Вот» предпочтено архаичному «се»; «вопль» сохраняет силу выражения. Формула «сыны Израиля» намеренно оставлена как традиционно понятный родственный образ. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому библейскому оформлению.
