  yaml_path: translation/ot/exodus/003/021.yaml
  text: And I will give this people favor in the sight of the Egyptians[a], and when you go[b], you will not go empty-handed.
translation:
  language: ru
  text: И Я дам этому народу благосклонность в глазах египтян, и когда вы уйдёте, то уйдёте не с пустыми руками.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: И Я дам
  rationale: Глагол נתן обычно означает «давать»; с חֵן эта формулировка сохраняет образ оригинала и естественна по-русски.
- source_word: חֵן
  choice: благосклонность
  rationale: В данном общественном контексте слово обозначает благоприятное расположение, а не специально богословское понятие «благодать».
- source_word: הָעָם הַזֶּה
  choice: этому народу
  rationale: Сохраняет собирательное единственное число еврейского עָם и указательное значение.
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: в глазах египтян
  rationale: Буквально и при этом естественно передаёт еврейскую идиому со значением того, как египтяне будут относиться к народу.
- source_word: וְהָיָה כִּי
  choice: и когда
  rationale: Кратко и естественно передаёт обычную еврейскую формулу, вводящую будущее обстоятельство.
- source_word: תֵלֵכוּן / תֵלְכוּ
  choice: вы уйдёте / уйдёте
  rationale: В контексте исхода הלך означает уход из Египта; «уйти» яснее русского «пойти» и не добавляет лишних деталей.
- source_word: רֵיקָם
  choice: не с пустыми руками
  rationale: Русская идиома точно передаёт смысл ухода без имущества или припасов.
