  source_fidelity: Существенно верно переданы обращение к Моисею, приход Моисея со старейшинами к царю Египта, имя Яхве, этноним «евреи», сообщение о встрече с Богом и вежливая просьба о трёхдневном пути для жертвоприношения. Однако в основном тексте нарушено согласование («ты ... пойдёшь ... и скажете»). «Послушаются тебя» сужает שׁמע לְקוֹל до послушания, тогда как контекст допускает также «прислушаются». «Поэтому» несколько сильнее выражает причинный вывод, чем переходное וְעַתָּה. Множественное «жертвы» не требуется формой וְנִזְבְּחָה.
