  text: וְ/שָׁמְע֖וּ לְ/קֹלֶ֑/ךָ וּ/בָאתָ֡ אַתָּה֩ וְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל אֶל מֶ֣לֶךְ מִצְרַ֗יִם וַ/אֲמַרְתֶּ֤ם אֵלָי/ו֙ יְהוָ֞ה אֱלֹהֵ֤י הָֽ/עִבְרִיִּים֙ נִקְרָ֣ה עָלֵ֔י/נוּ וְ/עַתָּ֗ה נֵֽלֲכָה נָּ֞א דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בַּ/מִּדְבָּ֔ר וְ/נִזְבְּחָ֖ה לַֽ/יהוָ֥ה אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/018.yaml
  text: And they will listen to your voice[a], and you and the elders of Israel will go to the king of Egypt and say to him, ‘Yahweh, the God of the Hebrews, has met with us. And now, please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God.’
translation:
  language: ru
  text: 'Они прислушаются к тебе[a]. Затем ты и старейшины Израиля придёте к царю Египта и скажете ему: «Яхве, Бог евреев, встретился с нами. Теперь позволь нам, пожалуйста, отправиться на три дня пути в пустыню, чтобы принести жертву Яхве, нашему Богу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «послушают твоего голоса»; выражение может означать, что они услышат Моисея, прислушаются к нему и откликнутся на его слова.'
    reason: 'Сохраняется смысловой диапазон שׁמע с לְקוֹל: от слушания до действенного отклика, без сведения его к безусловному повиновению.'
lexical_decisions:
- source_word: וְשָׁמְעוּ לְקֹלֶךָ
  choice: Они послушаются тебя
  rationale: Идиома буквально означает «услышат/послушают твой голос». В данном контексте речь идёт о том, что старейшины примут слова Моисея и откликнутся на них; современное русское «послушаются тебя» естественно передаёт этот смысл.
- source_word: וּבָאתָ אַתָּה וְזִקְנֵי יִשְׂרָאֵל
  choice: ты вместе со старейшинами Израиля пойдёшь
  rationale: Еврейский текст использует глагол в единственном числе, затем явно называет Моисея и старейшин. Русская формулировка сохраняет обращение к Моисею и естественно выражает совместное движение к царю.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: царь Египта
  rationale: Прямой и традиционно понятный перевод сопряжённой конструкции без добавления титула «фараон», которого в стихе нет.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: אֱלֹהֵי הָעִבְרִיִּים
  choice: Бог евреев
  rationale: Прямая передача этнического обозначения הָעִבְרִיִּים в современной литературной русской форме.
- source_word: נִקְרָה עָלֵינוּ
  choice: встретился с нами
  rationale: Nifal глагола קרא с עַל обозначает встречу или столкновение. Формулировка сохраняет значение божественной встречи, не сводя его к призванию или приказу.
- source_word: וְעַתָּה
  choice: Поэтому
  rationale: В данном обращении сочетание вводит просьбу, вытекающую из сообщения о встрече с Богом. «Поэтому» естественно выражает этот переход в русском, не меняя содержания просьбы.
- source_word: נֵלֲכָה נָּא
  choice: позволь нам, пожалуйста, уйти
  rationale: Когортатив с נָא выражает вежливую просьбу, обращённую к египетскому царю. «Позволь нам» устраняет возможное русское прочтение как призыва к самим себе.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: на три дня пути
  rationale: Сохранена еврейская идиома, обозначающая длительность или расстояние пути; выражение понятно и естественно по-русски.
- source_word: בַּמִּדְבָּר
  choice: в пустыню
  rationale: При глаголе движения русский винительный падеж естественно передаёт направленность внутрь пустынной, необжитой местности.
- source_word: וְנִזְבְּחָה
  choice: чтобы принести жертвы
  rationale: Второй когортатив в последовательности выражает цель пути. Множественное «жертвы» в русском естественно обозначает жертвоприношение без необоснованного уточнения его вида.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет имя и представляет наиболее принятую научную реконструкцию произношения.
- issue: Смысл выражения נִקְרָה עָלֵינוּ
  choice: встретился с нами
  alternative: явился нам; призвал нас; встретил нас
  rationale: Выбранный вариант сохраняет общее значение состоявшейся встречи с Богом и не уточняет без достаточного основания ни форму явления, ни содержание призвания.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис упрощён лишь там, где буквальное воспроизведение еврейской конструкции звучало бы неестественно; имя Яхве и этноним «евреи» сохранены прямо.
