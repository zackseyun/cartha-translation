base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/004.yaml
  text: When Yahweh saw that he had turned aside to look[a], God called to him from the midst of the bush and said, “Moses, Moses!” And he said[c][b], “Here I am.”
translation:
  language: ru
  text: 'Когда Яхве увидел, что Моисей свернул, чтобы посмотреть, Бог воззвал к нему из куста[a]: «Моисей! Моисей!» Он ответил: «Вот я».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изнутри куста». Еврейское слово, переведённое как «куст», может обозначать колючий кустарник.'
    reason: лексическая альтернатива и культурно-ботаническое уточнение
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией и сохраняет отличие от אֱלֹהִים в той же фразе.
- source_word: וַיַּרְא
  choice: увидел
  rationale: Обычное повествовательное значение ראה; здесь речь о том, что Яхве заметил действие Моисея.
- source_word: כִּי
  choice: что
  rationale: 'Вводит содержание увиденного: Яхве увидел, что Моисей свернул.'
- source_word: סָר לִרְאוֹת
  choice: свернул, чтобы посмотреть
  rationale: Передаёт движение в сторону и цель этого действия; формулировка естественна для современного русского повествования.
- source_word: וַיִּקְרָא אֵלָיו
  choice: воззвал к нему
  rationale: Сохраняет направленность обращения, выраженную אֶל; «воззвал» соответствует торжественному регистру сцены, оставаясь понятным.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Стандартно передаёт אֱלֹהִים и сохраняет исходное чередование Яхве / Бог.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: из середины куста
  rationale: Достаточно формально и точно передаёт пространственный образ; вариант «изнутри куста» также возможен.
- source_word: מֹשֶׁה מֹשֶׁה
  choice: Моисей! Моисей!
  rationale: Раздельные восклицания естественно передают настойчивое личное обращение с повтором имени.
- source_word: הִנֵּנִי
  choice: Вот я
  rationale: Устоявшийся и лаконичный русский ответ, выражающий присутствие и готовность откликнуться без добавочного толкования.
theological_decisions:
- issue: Передача יְהוָה и אֱלֹהִים в одном стихе
  choice: Яхве и Бог
  alternative: Господь и Бог; либо в обоих случаях Бог
  rationale: Различные обозначения в еврейском тексте сохранены, а личное имя не заменено титулом.
- issue: Говорящий в заключительной реплике וַיֹּאמֶר
  choice: Явно передать подразумеваемого Моисея местоимением «Он»
  alternative: «Моисей ответил»; либо буквальное «И сказал»
  rationale: Из обращения ясно, что отвечает Моисей. «Он ответил» естественно по-русски и не перегружает текст повтором имени.
- issue: Оттенок ответа הִנֵּנִי
  choice: «Вот я» без пояснения о послушании или служении
  alternative: «Я здесь»; «Я к твоим услугам»
  rationale: Исходное выражение обозначает присутствие и готовность, но само по себе не требует более узкого богословского истолкования.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; различие между «Яхве» и «Бог» сохранено. Все примечания привязаны к маркеру в основном тексте.
