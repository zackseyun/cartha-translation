  rationale: Исправлены только ясность референта и естественность пространственного выражения. Явное «Моисей» передаёт подразумеваемого субъекта еврейского глагола, а «из куста» — естественный русский эквивалент в данном контексте; альтернативное более эксплицитное «изнутри куста» сохранено в примечании. Смысл, регистр, различение имён Бога и все необходимые примечательные нюансы сохранены.
