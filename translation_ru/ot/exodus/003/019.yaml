  text: וַ/אֲנִ֣י יָדַ֔עְתִּי כִּ֠י לֹֽא יִתֵּ֥ן אֶתְ/כֶ֛ם מֶ֥לֶךְ מִצְרַ֖יִם לַ/הֲלֹ֑ךְ וְ/לֹ֖א בְּ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/019.yaml
  text: But I know that the king of Egypt will not let you go[a], except by a strong hand.
translation:
  language: ru
  text: Но Я знаю, что царь Египта не позволит вам уйти[a], если только его не принудит к этому сильная рука.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царь Египта не позволит вам уйти даже сильной рукой»; также возможно: «не позволит вам уйти иначе как сильной рукой». Еврейский оборот эллиптичен; он может означать, что царя Египта можно будет принудить отпустить вас лишь сильной рукой.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: Но Я
  rationale: Союз с самостоятельным местоимением вводит контрастный и emphатический поворот; по-русски это естественно передаётся сочетанием «Но Я».
- source_word: יָדַעְתִּי
  choice: знаю
  rationale: Перфект выражает твёрдое, актуальное знание Бога; настоящее время естественно в данном контексте.
- source_word: כִּי
  choice: двоеточие после «знаю»
  rationale: כִּי вводит содержание знания; в русском эту связь естественно и ясно передаёт бессоюзная конструкция с двоеточием.
- source_word: לֹא יִתֵּן אֶתְכֶם ... לַהֲלֹךְ
  choice: не позволит вам уйти
  rationale: נתן с инфинитивом означает разрешить или позволить; «не позволит вам уйти» точно и современно передаёт идиому.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: царь Египта
  rationale: Прямая и естественная передача сопряжённой конструкции.
- source_word: וְלֹא בְּיָד חֲזָקָה
  choice: иначе как под действием сильной руки
  rationale: Еврейская фраза эллиптична. Формулировка сохраняет образ «сильной руки», восполняя по-русски подразумеваемое принуждающее действие и не называя прямо его субъекта.
theological_decisions:
- issue: Толкование эллиптической фразы וְלֹא בְּיָד חֲזָקָה
  choice: Фараон не отпустит Израиль иначе как под принуждающим действием сильной руки.
  alternative: 'Фараон не отпустит Израиль даже под действием сильной руки; также возможно более краткое: «кроме как сильной рукой».'
  rationale: Синтаксис сжат и допускает разные понимания. Последующий стих, где Бог обещает простереть руку и поразить Египет чудесами, поддерживает значение непреодолимого принуждения, однако подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Царь» сохраняет историко-библейский регистр, а «сильная рука» — ключевой образ книги Исход. Прописное «Я» соответствует принятому русскому почтительному обозначению Бога.
