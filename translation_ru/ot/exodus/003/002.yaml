base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/002.yaml
  text: Then the angel of Yahweh appeared to him in a flame of fire from the midst of the bush. He looked[a], and behold, the bush was burning with fire, but the bush was not consumed.
translation:
  language: ru
  text: 'И явился ему ангел Яхве[a] в пламени огня из среды куста. Моисей увидел: вот, куст горит в огне, но не сгорает.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «вестник Яхве». Еврейское слово может означать как «ангел», так и «вестник».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: явился
  rationale: Форма нифаль глагола ראה в повествовании о богоявлении естественно передаётся возвратным по смыслу глаголом «явился».
- source_word: מַלְאַךְ יְהוָה
  choice: Ангел Яхве
  rationale: מַלְאַךְ может означать ангела или вестника; в контексте сверхъестественного явления основной перевод «Ангел» наиболее естественен, а имя Яхве сохраняет личное имя Бога.
- source_word: בְּלַבַּת אֵשׁ
  choice: в пламени огня
  rationale: Сохраняет образ и конструкцию исходного текста, не сводя выражение лишь к общему указанию на огонь.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: из среды куста
  rationale: Передаёт буквальное пространственное значение מִתּוֹךְ — «из середины, изнутри» — в естественном возвышенном русском регистре.
- source_word: וַיַּרְא וְהִנֵּה
  choice: 'Моисей увидел: вот'
  rationale: Имя «Моисей» ясно обозначает субъект по контексту, а «вот» сохраняет функцию הִנֵּה, привлекающую внимание к необычному зрелищу.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: горит в огне
  rationale: Настоящее время в русском повествовании после «вот» естественно передаёт продолжающееся действие причастной формы בֹּעֵר и сохраняет явное упоминание огня.
- source_word: אֵינֶנּוּ אֻכָּל
  choice: не сгорает
  rationale: Естественно передаёт продолжающееся отсутствие уничтожения огнём и сохраняет парадокс знамения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Тетраграмматон передан личным именем «Яхве», что позволяет читателю видеть употребление заветного имени непосредственно в тексте.
- issue: Передача מַלְאַךְ в контексте богоявления
  choice: Ангел
  alternative: вестник
  rationale: «Ангел» соответствует сверхъестественному контексту, но примечание сохраняет лексическую возможность «вестник», не предрешая точную природу и тождество действующего лица.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Частица «вот» сохраняет выразительность повествования, а формулировки остаются понятными современному читателю.
