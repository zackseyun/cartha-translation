  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה רָאֹ֥ה רָאִ֛יתִי אֶת עֳנִ֥י עַמִּ֖/י אֲשֶׁ֣ר בְּ/מִצְרָ֑יִם וְ/אֶת צַעֲקָתָ֤/ם שָׁמַ֨עְתִּי֙ מִ/פְּנֵ֣י נֹֽגְשָׂ֔י/ו כִּ֥י יָדַ֖עְתִּי אֶת מַכְאֹבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/007.yaml
  text: Then Yahweh said[a], “I have surely seen the affliction of my people who are in Egypt, and I have heard their cry because of their oppressors[c][b], for I know their sufferings.”
translation:
  language: ru
  text: 'И сказал Яхве: «Я действительно увидел[a] бедствие Моего народа, который находится в Египте, и услышал их вопль[b] из-за их притеснителей[c], ведь Я знаю их страдания».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «видя, Я увидел»; сочетание абсолютного инфинитива с личной формой глагола в еврейском языке служит для усиления: «Я несомненно увидел».'
    reason: Передача эмфатической конструкции абсолютного инфинитива с личной формой глагола.
  - marker: b
    text: 'Или: «их крик».'
    reason: Лексическая альтернатива для צַעֲקָה — крика или вопля, вызванного бедствием.
  - marker: c
    text: 'Или: «из-за их надсмотрщиков».'
    reason: В контексте принудительного труда נֹגֵשׂ может обозначать того, кто понуждает работников и надзирает за ними.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» является общепринятой современной русской транслитерацией.
- source_word: רָאֹה רָאִיתִי
  choice: Я действительно увидел
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает утверждение. Наречие «действительно» естественно передаёт это усиление по-русски.
- source_word: עֳנִי
  choice: бедствие
  rationale: Слово обозначает тяжёлое, униженное положение и страдание под гнётом; «бедствие» сохраняет широкий смысл, не сводя его только к внешнему притеснению.
- source_word: עַמִּי אֲשֶׁר בְּמִצְרָיִם
  choice: Моего народа, который в Египте
  rationale: Относительное придаточное прямо соотнесено с народом и естественно воспроизводит структуру еврейского текста.
- source_word: צַעֲקָתָם
  choice: их вопль
  rationale: Существительное означает громкий зов, вызванный тяжёлым положением; «вопль» передаёт остроту бедствия.
- source_word: מִפְּנֵי נֹגְשָׂיו
  choice: из-за их притеснителей
  rationale: Предлог здесь выражает причину вопля, а נֹגְשִׂים — тех, кто принуждает к труду и угнетает. «Притеснители» сохраняет более широкий смысл, чем «надсмотрщики».
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание предыдущего утверждения; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: יָדַעְתִּי
  choice: Я знаю
  rationale: Хотя в еврейском употреблена перфектная форма, здесь она выражает актуальное и личное знание; настоящее время естественно в русском контексте.
- source_word: מַכְאֹבָיו
  choice: их страдания
  rationale: Форма множественного числа охватывает боли и мучения народа в целом; «страдания» передаёт эту широту без ненужного уточнения.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Личное имя сохранено как имя, а не заменено титулом. Это удерживает связь с Божьим самооткровением в данном повествовании и не вводит конфессиональной подмены.
- issue: Характер Божьего знания о страданиях народа
  choice: Я знаю их страдания
  alternative: Мне известно об их страданиях; Я принял во внимание их страдания
  rationale: Прямое «знаю» сохраняет личную вовлечённость и богословскую напряжённость исходного текста, не сводя знание Бога к отвлечённой осведомлённости.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; усиление, причинные связи и личный характер Божьих слов сохранены без архаизации.
