  yaml_path: translation/ot/exodus/003/010.yaml
  text: And now[a], come, and I will send you to Pharaoh, and bring my people, the sons of Israel, out of Egypt.
translation:
  language: ru
  text: 'Итак, иди: Я пошлю тебя к фараону, и выведи из Египта Мой народ — сынов Израиля[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «израильтян». Буквально: «сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт временно-дискурсивный переход «и теперь / итак» естественным современным русским оборотом.
- source_word: לְכָה
  choice: ступай
  rationale: Императив הלך в данном поручении означает побуждение отправиться; «ступай» естественно выражает направление к фараону и сохраняет настойчивость призыва.
- source_word: וְאֶשְׁלָחֲךָ
  choice: Я пошлю тебя
  rationale: Прямо передаёт Qal imperfect с суффиксом второго лица, не добавляя явно не выраженного целевого оттенка.
- source_word: אֶל־פַּרְעֹה
  choice: к фараону
  rationale: Обычная русская передача направительного оборота и египетского царского титула.
- source_word: וְהוֹצֵא
  choice: и выведи
  rationale: Императив Hiphil от יצא имеет каузативное значение «заставить выйти / вывести»; «выведи» точно и естественно сочетается с «из Египта».
- source_word: עַמִּי
  choice: Мой народ
  rationale: Сохраняет прямой притяжательный язык и его значимость; прописная буква соответствует русской библейской издательской норме для речи Бога.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет мужскую родовую формулу и связь народа с предком Израилем; более идиоматичный этноним дан в сноске.
- source_word: מִמִּצְרָיִם
  choice: из Египта
  rationale: С глаголом «вывести» русский язык естественно выражает исход конструкцией «из Египта».
theological_decisions:
- issue: Передача обозначения народа завета בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян
  rationale: Основной текст сохраняет родовую и заветную образность еврейского выражения, не заменяя её только этнонимом; более естественный в современном русском эквивалент отмечен в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Двоеточие после «Итак, ступай» ясно связывает повеление с последующим Божьим поручением; тире обособляют поясняющее родовое наименование народа.
