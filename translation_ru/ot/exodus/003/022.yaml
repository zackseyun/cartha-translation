source:
  edition: WLC
  text: וְ/שָׁאֲלָ֨ה אִשָּׁ֤ה מִ/שְּׁכֶנְתָּ/הּ֙ וּ/מִ/גָּרַ֣ת בֵּיתָ֔/הּ כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹ֑ת וְ/שַׂמְתֶּ֗ם עַל בְּנֵי/כֶם֙ וְ/עַל בְּנֹ֣תֵי/כֶ֔ם וְ/נִצַּלְתֶּ֖ם אֶת מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/022.yaml
  text: Each woman shall ask from her neighbor and from the woman staying in her house articles of silver and articles of gold[a], and clothing; and you shall put them on your sons and on your daughters[c][b]. So you will plunder Egypt.
translation:
  language: ru
  text: Пусть каждая женщина попросит у своей соседки и у женщины, живущей в её доме,[a] серебряные и золотые вещи[b] и одежду. Вы наденете их на своих сыновей и дочерей и так разграбите Египет.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у живущей в её доме переселенки»; еврейское выражение может обозначать временно проживающую или пришлую женщину.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «серебряные вещи и золотые вещи»; речь может идти о различных предметах или изделиях, не обязательно только об украшениях либо сосудах.'
    reason: lexical_breadth
  - marker: c
    text: 'Или: «оберёте Египет», «лишите Египет имущества».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלָה
  choice: пусть ... попросит
  rationale: שׁאל обычно означает «просить, запрашивать». Перевод «одолжит» внёс бы не выраженное здесь обязательство вернуть вещи.
- source_word: אִשָּׁה
  choice: каждая женщина
  rationale: Неопределённое единственное число имеет распределительное значение; по-русски это естественно передаётся словом «каждая».
- source_word: מִשְּׁכֶנְתָּהּ
  choice: у своей соседки
  rationale: Форма существительного женского рода указывает на соседку; это естественно и точно передаётся по-русски.
- source_word: וּמִגָּרַת בֵּיתָהּ
  choice: у женщины, живущей в её доме
  rationale: Причастие от גור обозначает женщину, проживающую или временно остановившуюся в доме; формулировка сохраняет широту значения без искусственной конкретизации.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: серебряные и золотые вещи
  rationale: כְּלִי — широкое обозначение предмета, утвари или изделия; «вещи» не сужает смысл до сосудов либо украшений.
- source_word: וּשְׂמָלֹת
  choice: одежду
  rationale: Общее обозначение одежды; современный и достаточно широкий русский эквивалент.
- source_word: וְשַׂמְתֶּם עַל
  choice: вы наденете их на
  rationale: В контексте одежды и ценных предметов русское «надеть на» естественно передаёт שׂים + עַל.
- source_word: בְּנֵיכֶם ... בְּנֹתֵיכֶם
  choice: своих сыновей и дочерей
  rationale: Сохранено явное различение сыновей и дочерей в еврейском тексте.
- source_word: וְנִצַּלְתֶּם אֶת מִצְרָיִם
  choice: и так разграбите Египет
  rationale: Порода пиэль глагола נצל здесь означает лишить имущества, разграбить. Формулировка сохраняет резкую силу оригинала и итоговый смысл действия.
theological_decisions:
- issue: Возможное нравственно-богословское смягчение получения египетских ценностей
  choice: и так разграбите Египет
  alternative: и так оберёте Египет / и опустошите Египет
  rationale: Текст описывает предписанную Богом перемену положения и не называет вещи займом. Поэтому перевод не смягчает נצל и не подразумевает обязательства возврата.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным регистром. Сохранены женский род участников, перечисление сыновей и дочерей и сильное значение заключительного глагола. Неоднозначность выражения о проживающей в доме женщине отражена в примечании.
