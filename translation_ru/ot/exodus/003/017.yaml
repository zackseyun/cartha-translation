  text: וָ/אֹמַ֗ר אַעֲלֶ֣ה אֶתְ/כֶם֮ מֵ/עֳנִ֣י מִצְרַיִם֒ אֶל אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/017.yaml
  text: And I have said[a], ‘I will bring you up out of the affliction of Egypt to the land of the Canaanites, the Hittites, the Amorites, the Perizzites, the Hivites[b], and the Jebusites—to a land flowing with milk and honey.’
translation:
  language: ru
  text: 'И Я сказал[a]: „Я выведу вас из-под гнёта в Египте[b] в землю хананеев, хеттеев, амореев, ферезеев, евеев и иевусеев — в землю, где текут молоко и мёд“.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Я решил: „Я выведу вас…“». Еврейский глагол формально стоит в прошедшем времени, но в контексте речь идёт о решении Бога, которое Он теперь подтверждает.'
    reason: alternative_reading
  - marker: b
    text: 'Возможные переводы: «от страданий в Египте» или «из бедственного положения в Египте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: И Я сказал
  rationale: Форма глагола прошедшего времени естественно передаётся по-русски как «сказал». В контексте это ранее принятое и ныне подтверждаемое Божье решение; возможный оттенок сохраняется в сноске.
- source_word: אַעֲלֶה אֶתְכֶם
  choice: Я выведу вас
  rationale: Hiphil от עלה буквально выражает побуждение подняться, однако в русском «выведу» естественно передаёт исход из бедственного положения и движение к обещанной земле, не добавляя отдельного глагола движения.
- source_word: מֵעֳנִי מִצְרַיִם
  choice: из-под гнёта в Египте
  rationale: עֳנִי обозначает бедствие, угнетение или страдание. «Из-под гнёта в Египте» ясно передаёт здесь положение угнетаемого народа и избегает двусмысленного выражения «бедствие Египта».
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: в землю хананеев, хеттеев, амореев, ферезеев, евеев и иевусеев
  rationale: Еврейские названия народов стоят в единственном числе, но русский литературный узус требует множественного числа при обозначении народов. «В землю» естественно обозначает конечное прибытие.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: в землю, где текут молоко и мёд
  rationale: Сохранена яркая метафора плодородия и изобилия; личная форма придаточного предложения звучит в современном русском естественнее буквального причастного оборота.
theological_decisions:
- issue: Временная и дискурсивная сила וָאֹמַר в формуле Божьего обещания
  choice: И Я сказал
  alternative: И Я решил / И Я обещал
  rationale: Основной текст сохраняет формальное прошедшее время и не превращает глагол речи в более узкое богословское понятие обещания. Сноска указывает, что в контексте сказанное остаётся действующим решением Бога.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Сохранены традиционные русские формы этнонимов и образ «молока и мёда»; синтаксис сделан ясным для обычного читателя.
