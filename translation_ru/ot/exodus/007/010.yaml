base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/010.yaml
  text: So Moses and Aaron went in to Pharaoh[a], and they did so, just as Yahweh had commanded. Then Aaron threw down his staff before Pharaoh and before his servants, and it became a serpent.
translation:
  language: ru
  text: Моисей и Аарон вошли к фараону и сделали так, как повелел Яхве. Затем Аарон бросил свой посох перед фараоном и перед его слугами, и посох стал змеем[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово танни́н может также обозначать драконоподобное существо или крупное пресмыкающееся; здесь, вероятнее всего, имеется в виду змей, явленный как знамение перед фараоном.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришли
  rationale: Глагол стоит в единственном числе перед составным подлежащим «Моисей и Аарон», но по смыслу относится к обоим. Русское множественное число естественно передаёт совместное действие.
- source_word: וַיַּעַשׂוּ כֵן
  choice: сделали всё так
  rationale: Передаёт идиому исполнения ранее данного повеления и естественно связывается с последующим «как повелел».
- source_word: כַּאֲשֶׁר צִוָּה
  choice: как повелел
  rationale: Сохраняет смысл точного соответствия ранее данному повелению без ненужного усложнения русской временной формы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וַיַּשְׁלֵךְ
  choice: бросил
  rationale: Прямо и естественно передаёт действие бросания посоха; направление вниз ясно из ситуации.
- source_word: מַטֵּהוּ
  choice: свой посох
  rationale: «Посох» — современное и точное обозначение предмета; возвратное «свой» однозначно связывает его с Аароном.
- source_word: לִפְנֵי פַרְעֹה וְלִפְנֵי עֲבָדָיו
  choice: перед фараоном и его слугами
  rationale: Сохраняет публичность знамения перед фараоном и его окружением, избегая тяжеловесного повторения предлога в русском.
- source_word: עֲבָדָיו
  choice: его слугами
  rationale: Сохраняет основное значение слова; контекст допускает, что речь идёт о придворных служителях или чиновниках.
- source_word: וַיְהִי לְתַנִּין
  choice: посох стал змеем
  rationale: Повтор существительного вместо местоимения устраняет возможную двусмысленность. תַנִּין имеет широкий диапазон значений, но в данном знамении «змей» наиболее естественно; более широкий смысл отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. Транслитерация «Яхве» сохраняет это, не подменяя имя титулом.
- issue: Передача תַנִּין
  choice: змей
  alternative: драконоподобное существо; крупное пресмыкающееся
  rationale: Слово шире обычного обозначения змеи и в иных контекстах может относиться к огромному или драконоподобному существу. Здесь контекст посоха-знамения поддерживает перевод «змей», а подлинная лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным стилем. Синтаксис остаётся близким к последовательности еврейского рассказа, но избегает неестественных для русского повторов. Ударение в сноске помогает прочесть незнакомый транслитерированный термин.
