lexical_decisions:
- source_word: וַיַּשְׁלִיכוּ
  choice: бросил
  rationale: Глагол שׁלך в данном повествовательном контексте означает бросить или повергнуть предмет; русское «бросил» естественно передаёт действие без добавления отсутствующего в тексте обстоятельства.
- source_word: אִישׁ
  choice: каждый
  rationale: 'Слово אִישׁ употреблено дистрибутивно: каждый из упомянутых ранее людей бросил собственный посох.'
- source_word: מַטֵּהוּ / מַטֵּה / מַטֹּתָם
  choice: свой посох / посох / их посохи
  rationale: מַטֶּה обозначает посох или жезл. «Посох» — конкретное и понятное современному читателю слово; формы числа и принадлежности сохранены.
- source_word: וַיִּהְיוּ
  choice: они превратились
  rationale: Форма היה здесь обозначает наступившее превращение; «превратились» ясно и естественно передаёт результат.
- source_word: לְתַנִּינִם
  choice: в танни́нов
  rationale: 'תַּנִּין имеет более широкий диапазон значений, чем обычное обозначение змеи: это змееподобное чудовище, крупное пресмыкающееся или дракон. Транслитерация сохраняет намеренное лексическое отличие от נָחָשׁ в Исх. 4:3 и не сужает образ до обычных змей; смысл пояснён в сноске.'
- source_word: וַיִּבְלַע
  choice: поглотил
  rationale: בלע означает проглотить или поглотить. «Поглотил» звучит естественно и сохраняет образ полного уничтожения посохов противников.
- source_word: אֶת
  choice: '[показатель прямого дополнения не переводится]'
  rationale: אֶת маркирует определённое прямое дополнение и не имеет отдельного русского соответствия.
