  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֣ר אֶֽל אַהֲרֹ֡ן קַ֣ח מַטְּ/ךָ֣ וּ/נְטֵֽה יָדְ/ךָ֩ עַל מֵימֵ֨י מִצְרַ֜יִם עַֽל נַהֲרֹתָ֣/ם עַל יְאֹרֵי/הֶ֣ם וְ/עַל אַגְמֵי/הֶ֗ם וְ/עַ֛ל כָּל מִקְוֵ֥ה מֵימֵי/הֶ֖ם וְ/יִֽהְיוּ דָ֑ם וְ/הָ֤יָה דָם֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם וּ/בָ/עֵצִ֖ים וּ/בָ/אֲבָנִֽים־־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/019.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Take your staff and stretch out your hand over the waters of Egypt—over their rivers, over their Nile canals, over their ponds, and over every collection of their waters—that they may become blood. And there will be blood throughout all the land of Egypt[b], even in wooden and stone vessels.’”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Скажи Аарону: „Возьми свой посох и простри руку над водами Египта — над их реками, каналами Нила, прудами и всеми их водоёмами, — и они станут кровью. Кровь будет по всей земле Египта, даже в деревянных и каменных сосудах[a]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и в дереве, и в камне»; вероятно, имеются в виду деревянные и каменные сосуды с водой.'
    reason: Лаконичная еврейская фраза допускает буквальное прочтение, хотя контекст указывает на сосуды для воды.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога общепринятой современной русской транслитерацией, а не заменяет его титулом.
- source_word: מַטְּךָ
  choice: свой посох
  rationale: «Посох» естественно и точно обозначает конкретный предмет; возвратное местоимение соответствует русской норме при обращении к Аарону.
- source_word: וּנְטֵה יָדְךָ
  choice: простри руку
  rationale: Сохраняет образ и торжественный библейский регистр, оставаясь понятным современному читателю.
- source_word: נַהֲרֹתָם
  choice: их реками
  rationale: Передаёт общее обозначение рек и отличает его от следующего египетского термина יְאֹר.
- source_word: יְאֹרֵיהֶם
  choice: каналами Нила
  rationale: В египетском контексте יְאֹר обозначает Нил и связанные с ним водные русла; перевод сохраняет местную специфику и отличие от נַהֲרוֹת.
- source_word: אַגְמֵיהֶם
  choice: прудами
  rationale: Понятное обозначение стоячих или собранных вод; возможное значение «болота» здесь не навязывается.
- source_word: כָּל מִקְוֵה מֵימֵיהֶם
  choice: всеми их водоёмами
  rationale: Естественно передаёт всякое место скопления воды и всеохватность выражения, не ограничивая его искусственными резервуарами.
- source_word: וְיִהְיוּ דָם
  choice: и они станут кровью
  rationale: Передаёт ожидаемый результат повеления без ослабляющего оттенка возможности.
- source_word: וּבָעֵצִים וּבָאֲבָנִים
  choice: даже в деревянных и каменных сосудах
  rationale: Контекст говорит о воде; материалы, вероятнее всего, метонимически обозначают сосуды для её хранения. Эллиптичность оригинала отмечена в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Сохраняется личное имя, присутствующее в еврейском тексте, без конфессионально обусловленной замены титулом.
- issue: Значение וּבָעֵצִים וּבָאֲבָנִים
  choice: деревянные и каменные сосуды
  alternative: 'буквально: «в дереве и в камне»'
  rationale: В контексте перечисления водных источников и мест хранения воды наиболее вероятна метонимия материалов вместо изготовленных из них сосудов; буквальная форма сохранена в сноске, поскольку еврейский текст эллиптичен.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формы «простри» и «земля Египетская» поддерживают достоинство речи, не делая её архаичной; перечисление сохранено ясным и ритмичным.
