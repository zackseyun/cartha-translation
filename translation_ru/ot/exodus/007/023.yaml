    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: повернулся
  rationale: Глагол פנה обозначает поворот или обращение в другую сторону. «Повернулся» кратко передаёт движение, не добавляя прямо не выраженного «ушёл прочь».
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Общепринятое русское обозначение египетского царя; здесь это титул, употреблённый как наименование действующего лица.
- source_word: וַיָּבֹא אֶל־בֵּיתוֹ
  choice: пошёл в свой дом
  rationale: Сочетание בוא с אֶל выражает движение к дому или внутрь него. В данном повествовательном ракурсе «пошёл в свой дом» звучит естественно и сохраняет направленность движения, не уточняя сверх текста, вошёл ли он уже внутрь.
- source_word: וְלֹא שָׁת לִבּוֹ
  choice: не принял близко к сердцу
  rationale: Еврейская идиома буквально говорит о направлении или приложении сердца и означает серьёзно обратить внимание, придать значение. Русская идиома сохраняет образ сердца и передаёт смысл естественно.
- source_word: גַּם לָזֹאת
  choice: даже это
  rationale: 'גַּם здесь имеет усилительное значение: происшедшее не затронуло фараона, несмотря на его очевидность. «Даже это» естественно передаёт данный оттенок.'
