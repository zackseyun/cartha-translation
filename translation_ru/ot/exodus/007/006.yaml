  text: וַ/יַּ֥עַשׂ מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹתָ֖/ם כֵּ֥ן עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/006.yaml
  text: So Moses and Aaron did just as Yahweh had commanded them[a]; so they did.
translation:
  language: ru
  text: И Моисей и Аарон сделали так, как повелел им Яхве[a]. Так они и сделали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (יהוה); традиционно переводится «Господь».'
    reason: Указывает исходную форму божественного имени и традиционный вариант его передачи.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделали
  rationale: Глагол עשה имеет широкое значение «делать, совершать»; здесь речь об исполнении повеления. Множественное число естественно согласует сказуемое с составным подлежащим «Моисей и Аарон».
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Моисей и Аарон
  rationale: Употреблены традиционные и общепонятные русские формы библейских имён.
- source_word: כַּאֲשֶׁר
  choice: всё так, как
  rationale: Оборот передаёт соответствие действий данному повелению; слово «всё» естественно подчёркивает полноту исполнения, не добавляя нового предметного содержания.
- source_word: צִוָּה
  choice: повелел
  rationale: В данном повествовательном и божественном контексте «повелел» точно и литературно передаёт значение צוה — отдать повеление.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֹתָם
  choice: им
  rationale: При русском глаголе «повелеть» адресат естественно выражается дательным падежом.
- source_word: כֵּן עָשׂוּ
  choice: Именно так они и сделали
  rationale: Сохраняет итоговое повторение корня עשה и усилительное указание כֵּן, подчёркивающее точное послушание.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, поэтому в основном тексте сохранено личное имя. «Господь» является традиционной заменой имени титулом, а «Иегова» — иной исторической формой передачи.
- issue: Повтор глагола עשה
  choice: 'сохранить: «сделали… сделали»'
  alternative: устранить повтор ради стилистической гладкости
  rationale: Повтор присутствует в еврейском тексте и риторически подчёркивает полное соответствие действий Моисея и Аарона Божьему повелению.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для русского, при этом сохранены повтор и смысловой акцент оригинала.
