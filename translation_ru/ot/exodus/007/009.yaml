base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/009.yaml
  text: When Pharaoh speaks to you[a], saying, ‘Produce a sign for yourselves,’ then you shall say to Aaron, ‘Take your staff and throw it down before Pharaoh; let it become a serpent.’
translation:
  language: ru
  text: 'Когда фараон скажет вам: «Совершите знамение», — скажи Аарону: «Возьми свой посох и брось его перед фараоном; пусть он станет змеем[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово танни́н может обозначать змееподобное существо, крупное морское создание или дракона — в зависимости от контекста.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: В данном наставлении союз вводит ожидаемое будущее обстоятельство, а не причину; русское «когда» естественно передаёт временно-условный смысл.
- source_word: יְדַבֵּר אֲלֵיכֶם
  choice: скажет вам
  rationale: Имперфект обозначает предстоящее обращение фараона; совершенный вид «скажет» естественен в русской конструкции с «когда». Местоимение сохранено во множественном числе.
- source_word: מוֹפֵת
  choice: знамение
  rationale: Слово обозначает необычайный знак или предзнаменование, служащее подтверждением. «Знамение» сохраняет смысл и возвышенный, но понятный регистр.
- source_word: תְּנוּ לָכֶם מוֹפֵת
  choice: Покажите знамение
  rationale: Буквально выражение означает «дайте себе знамение», но в контексте это идиоматическое требование предъявить подтверждающий знак. «Покажите знамение» звучит естественно и не добавляет значения, отсутствующего в тексте.
- source_word: וְאָמַרְתָּ אֶל־אַהֲרֹן
  choice: скажи Аарону
  rationale: Последовательная форма вводит следующий шаг повеления. Русский императив точно и естественно передаёт предписанное Моисею действие.
- source_word: מַטְּךָ
  choice: свой посох
  rationale: מַטֶּה — посох или жезл. В обращении к Аарону русское возвратное притяжательное «свой» однозначно связывает посох с ним и сохраняет современную естественность.
- source_word: וְהַשְׁלֵךְ
  choice: брось его
  rationale: Глагол означает бросить или повергнуть. «Брось» прямо передаёт действие без архаизации.
- source_word: לִפְנֵי פַרְעֹה
  choice: перед фараоном
  rationale: Передаёт как пространственный смысл, так и совершение действия в присутствии правителя.
- source_word: יְהִי
  choice: пусть он превратится
  rationale: Юссив выражает желаемый или предписанный результат. Конструкция с «пусть» сохраняет эту модальность, а «превратится» ясно обозначает изменение посоха.
- source_word: תַנִּין
  choice: змей
  rationale: Термин шире обычного названия змеи и может обозначать крупное змееподобное, морское или драконоподобное существо. В сцене превращения посоха «змей» уместен контекстуально и лучше, чем бытовое «змея», сохраняет необычность еврейского слова.
theological_decisions:
- issue: Передача תַנִּין в рассказе о знамении с посохом
  choice: змей
  alternative: змея; дракон; крупное пресмыкающееся
  rationale: Контекст указывает на змееподобное существо, однако תַנִּין имеет более широкий диапазон значений, чем обычное слово «змея». Основной текст использует понятное «змей», а примечание сохраняет лексическую неоднозначность, не превращая её в мифологическое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Диалог передан ясно и без архаических форм; смена множественного «вам» на единственное «скажи» сохранена по еврейскому тексту.
