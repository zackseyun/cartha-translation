  source_fidelity: 'В целом синтаксис и смена адресатов переданы верно: «вам» относится к Моисею и Аарону, а последующее единственное «скажи» — к Моисею. Однако «Покажите знамение» несколько ослабляет תְּנוּ ... מוֹפֵת: фараон требует не просто показать уже имеющееся знамение, а предъявить/совершить его. «Совершите знамение» точнее передаёт требуемое демонстративное действие. «Пусть он превратится» допустимо, но «пусть он станет» ближе к יְהִי («пусть станет») без потери смысла превращения.'
