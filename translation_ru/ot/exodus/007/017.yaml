base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/017.yaml
  text: 'Thus says Yahweh: By this you will know that I am Yahweh: behold[a], I am striking the water that is in the Nile with the staff that is in my hand, and it will be turned to blood.'
translation:
  language: ru
  text: 'Так говорит Яхве: «По этому ты узнаешь, что Я — Яхве. Вот, Я ударю посохом, который у меня в руке, по воде в Ниле, и она превратится в кровь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Естественная для современного русского языка формула, сохраняющая торжественный характер древнееврейского изречения и личное имя Бога.
- source_word: בְּזֹאת תֵּדַע
  choice: По этому ты узнаешь
  rationale: 'Предлог בְּ имеет здесь инструментально-знаковое значение: последующее действие станет основанием, по которому адресат узнает, кто такой Яхве.'
- source_word: הִנֵּה אָנֹכִי מַכֶּה
  choice: Вот, я ударю
  rationale: הִנֵּה передает торжественное привлечение внимания, а причастная конструкция обозначает непосредственно предстоящее действие; русский видо-временной контекст естественно требует будущего совершенного вида.
- source_word: בַּמַּטֶּה אֲשֶׁר בְּיָדִי
  choice: посохом, который у меня в руке
  rationale: «Посох» — современный и контекстуально точный эквивалент מַטֶּה; относительное придаточное сохраняет акцент исходного текста на орудии действия.
- source_word: עַל הַמַּיִם אֲשֶׁר בַּיְאֹר
  choice: по воде в Ниле
  rationale: Глагольное сочетание «ударить по» естественно передает עַל; יְאֹר в египетском контексте обозначает Нил. Русское «вода» употреблено как собирательное существительное вместо еврейского множественного числа.
- source_word: וְנֶהֶפְכוּ לְדָם
  choice: и она превратится в кровь
  rationale: Глагол выражает изменение состояния. Местоимение единственного числа согласовано с естественным русским собирательным «вода», не изменяя смысла еврейского множественного «воды».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не заменяя титулом и не вводя позднюю гибридную форму.
- issue: Смысл формулы כִּי אֲנִי יְהוָה
  choice: что Я — Яхве
  alternative: что Я Господь
  rationale: Сохраняется самоотождествление с личным именем и центральное для повествования утверждение, не раскрываемое дополнительным толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для обычного читателя; сохранены повтор имени Яхве, указательное «вот» и образ непосредственного удара по воде.
