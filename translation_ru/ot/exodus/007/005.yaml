  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/יָדְע֤וּ מִצְרַ֨יִם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּ/נְטֹתִ֥/י אֶת יָדִ֖/י עַל מִצְרָ֑יִם וְ/הוֹצֵאתִ֥י אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/תּוֹכָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/005.yaml
  text: And the Egyptians will know that I am Yahweh when I stretch out my hand against Egypt and bring the sons of Israel out from among them[a][b].
translation:
  language: ru
  text: И узнают египтяне, что Я — Яхве[a], когда протяну Свою руку против Египта и выведу сынов Израиля[b] из их среды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — передача еврейского имени יהוה (YHWH), которое в ряде переводов традиционно заменяют словом «Господь».
    reason: alternative_reading
  - marker: b
    text: 'Или: «израильтян»; буквально: «сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: И узнают
  rationale: 'Форма с союзом в данном предсказательном контексте передаёт будущее действие: египтяне узнают и признают, кто такой Яхве, через Его грядущие деяния.'
- source_word: מִצְרַיִם
  choice: египтяне / Египет
  rationale: В первом случае слово обозначает народ, что согласуется со множественным числом сказуемого; после עַל оно обозначает страну или державу как объект Божьего действия.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что узнают египтяне.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בִּנְטֹתִי
  choice: когда протяну
  rationale: Предлог ב с инфинитивом здесь имеет временное значение. Глагол сохраняет образ простёртой руки, но передан современным русским глаголом «протянуть».
- source_word: יָדִי
  choice: Свою руку
  rationale: Сохранён конкретный антропоморфный образ исходного текста; возвратное притяжательное местоимение естественно для русского языка.
- source_word: עַל מִצְרָיִם
  choice: против Египта
  rationale: В контексте суда предлог выражает направленное против Египта действие.
- source_word: וְהוֹצֵאתִי
  choice: и выведу
  rationale: 'Передаёт каузативное значение породы хифиль: Яхве сделает так, что израильтяне выйдут.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет семейно-родовое выражение еврейского текста; более привычное «израильтян» указано в сноске.
- source_word: מִתּוֹכָם
  choice: из их среды
  rationale: Близко передаёт удаление из среды египтян и сохраняет местоименную форму оригинала.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, тогда как «Господь» является традиционной заменой, а «Иегова» отражает более позднюю гибридную форму.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Буквальная семейно-родовая формула сохранена без превращения её в богословски нагруженный термин; идиоматическая альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов «узнают египтяне» сохраняет смысловой акцент, не становясь архаичным. Образ руки и формула «сыны Израиля» сохранены как значимые особенности исходного текста.
