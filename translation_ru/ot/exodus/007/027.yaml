- source_word: וְאִם
  choice: Но если
  rationale: Сочетание союза с условной частицей вводит условие, противопоставленное предшествующему требованию; «Но если» естественно передаёт эту связь.
- source_word: מָאֵן
  choice: откажешься
  rationale: Глагол обозначает сознательный отказ, а не невозможность исполнить требование.
- source_word: לְשַׁלֵּחַ
  choice: отпустить их
  rationale: В контексте исхода речь идёт об освобождении израильтян; местоименное дополнение по-русски необходимо и ясно восстанавливается из контекста.
- source_word: הִנֵּה
  choice: вот
  rationale: Частица привлекает внимание к близкому и торжественному объявлению суда; «вот» сохраняет её функцию в современном литературном русском.
- source_word: אָנֹכִי
  choice: Я
  rationale: Отдельное личное местоимение подчёркивает действующего; прописная буква соответствует принятому русскому библейскому оформлению речи Бога.
- source_word: נֹגֵף
  choice: поражу
  rationale: Причастная форма после הִנֵּה обозначает предстоящее или близкое действие. Будущее «поражу» естественно передаёт угрозу, не устраняя возможного оттенка непосредственной близости, отмеченного в сноске.
- source_word: כָּל גְּבוּלְךָ
  choice: всю твою землю
  rationale: Здесь גְּבוּל означает всю область владений, а не только пограничную черту. «Всю твою землю» понятно и уместно в контексте бедствия, охватывающего Египет.
- source_word: בַּצְפַרְדְּעִים
  choice: лягушками
  rationale: Предлог ב обозначает средство поражения; русский творительный падеж передаёт это непосредственно и естественно.
