base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/001.yaml
  text: Then Yahweh said to Moses[a], “See, I have made you God to Pharaoh, and Aaron your brother will be your prophet.”
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Смотри, Я поставил тебя богом перед фараоном[a], а твой брат Аарон будет твоим пророком».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я поставил тебя богом для фараона». Здесь Моисей выступает перед фараоном как наделённый Божьей властью представитель, а Аарон — как его пророк.'
    reason: Пояснение необычного выражения אֱלֹהִים לְפַרְעֹה. Сноска объясняет его представительский контекст, не добавляя в основной текст отсутствующего в еврейском сравнительного оборота «как Бог».
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Вайиктоль продвигает повествование; «тогда» естественно передаёт последовательность событий в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: רְאֵה
  choice: Смотри
  rationale: Императив привлекает внимание Моисея к следующему утверждению; «смотри» кратко и естественно в прямой речи.
- source_word: נְתַתִּיךָ
  choice: Я поставил тебя
  rationale: Буквально глагол означает «дал», но при именной части «Богом» выражает назначение или наделение ролью; «поставил» естественно передаёт этот результативный смысл.
- source_word: אֱלֹהִים
  choice: Богом
  rationale: Еврейский текст прямо употребляет אֱלֹהִים как сказуемое без сравнительной частицы. Творительный падеж после «поставил» сохраняет формальную силу выражения, а сноска поясняет представительскую роль, не устраняя напряжённость текста.
- source_word: לְפַרְעֹה
  choice: для фараона
  rationale: Предлог לְ обозначает отношение Моисея к фараону; «для фараона» естественно выражает реляционный смысл, не предполагая, что Моисей становится Богом по природе.
- source_word: וְאַהֲרֹן אָחִיךָ
  choice: а твой брат Аарон
  rationale: Союз здесь вводит соотнесённую роль Аарона; «а» яснее передаёт это сопоставление по-русски.
- source_word: יִהְיֶה נְבִיאֶךָ
  choice: будет твоим пророком
  rationale: Сохранён обычный смысл נָבִיא «пророк», поскольку сам текст выстраивает отношение между Моисеем и Аароном по образцу Бога и пророка.
theological_decisions:
- issue: Как передать אֱלֹהִים применительно к Моисею перед фараоном
  choice: Богом для фараона
  alternative: как Бог для фараона; богом для фараона
  rationale: В оригинале нет частицы сравнения, поэтому «как Бог» преждевременно разрешило бы подлинную неоднозначность. Написание «Богом» и пояснение в сноске сохраняют прямоту еврейского выражения, при этом контекст с Аароном как пророком указывает на представительскую функцию и власть, а не на обожествление Моисея.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прямой речи. Синтаксис простой и ясный; ключевые термины «Бог» и «пророк» сохранены, а не заменены толковательными перифразами.
