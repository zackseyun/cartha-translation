base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/015.yaml
  text: Go to Pharaoh in the morning[a]. Look, he is going out to the water, and you shall stand to meet him on the bank of the Nile[b], and you shall take in your hand the staff that was turned into a serpent.
translation:
  language: ru
  text: Пойди к фараону утром. Вот, он выходит к воде; стань на берегу Нила[a], чтобы встретить его, и возьми в руку посох, который превратился в змею[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «реки». В книге Исход еврейское יְאֹר обычно обозначает Нил.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «змея». Еврейское נָחָשׁ может передаваться словами «змей» или «змея».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ אֶל־פַּרְעֹה
  choice: Пойди к фараону
  rationale: Прямое повеление и направление к лицу естественно передаются современным русским «пойди к».
- source_word: בַּבֹּקֶר
  choice: утром
  rationale: Краткое и естественное русское обозначение времени.
- source_word: הִנֵּה יֹצֵא הַמַּיְמָה
  choice: Вот, он выйдет к воде
  rationale: «Вот» сохраняет указательную функцию הִנֵּה; причастие в данном предсказательно-ситуативном контексте естественно передано будущим временем, а направительная форма — сочетанием «к воде».
- source_word: וְנִצַּבְתָּ לִקְרָאתוֹ
  choice: встань у него на пути
  rationale: נצב обозначает занятие позиции, а לִקְרָאתוֹ — движение или положение навстречу ему. Русское выражение сохраняет оттенок намеренной встречи, не усиливая его до явного противостояния.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: на берегу Нила
  rationale: שׂפה здесь означает берег или край, а יְאֹר в повествовании Исхода конкретно обозначает Нил.
- source_word: הַמַּטֶּה
  choice: посох
  rationale: «Посох» — естественное современное обозначение носимого Моисеем предмета; оно не привносит военного оттенка слова «жезл».
- source_word: אֲשֶׁר נֶהְפַּךְ לְנָחָשׁ
  choice: который превращался в змея
  rationale: Форма נהפך описывает совершившееся превращение; несовершенный вид по-русски уместен как указание на известное свойство/предшествующее событие. «Змей» сохраняет более высокий повествовательный регистр.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: возьми в руку
  rationale: Императив естественно передаёт предписывающее значение формы, сохраняя конкретное упоминание руки.
theological_decisions:
- issue: Значение יְאֹר
  choice: Нил
  alternative: река
  rationale: В контексте Исхода слово указывает на конкретную египетскую реку; название «Нил» делает исторический референт ясным, не добавляя богословского толкования.
- issue: Передача נָחָשׁ
  choice: змей
  alternative: змея
  rationale: Оба варианта лексически возможны. «Змей» выбран ради достоинства и традиционно-повествовательного регистра, без отождествления с каким-либо иным библейским образом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным и устным по звучанию; архаические «се», «жезл» и тяжеловесное «стань навстречу ему» не используются. Все примечания отмечены в основном тексте.
