revisions:
- from: Нил будет кишеть лягушками. Они поднимутся из него и проникнут в твой дом, в твою спальню и на твою постель, в дома твоих слуг и к твоему народу, в твои печи и в твои ёмкости для замешивания теста[a].
  to: Нил будет кишеть лягушками; они поднимутся из него и войдут в твой дом, в твою спальню и на твою постель, в дома твоих слуг, среди твоего народа, в твои печи и в твои ёмкости для замешивания теста[a].
  rationale: 'Исправлены два места, где русская формулировка отступала от пространственного значения исходного текста: «к твоему народу» заменено на «среди твоего народа», а усиленное «проникнут» — на нейтральное «войдут». Остальные решения, включая сноску при названии сосуда для теста, сохранены.'
