  naturalness: Текст звучит современно и ясно. «Среди твоего народа» естественно передаёт соответствующий член перечисления; «войдут» точнее и стилистически нейтральнее, чем «проникнут».
  terminology: «Нил», «лягушки», «спальня», «постель», «слуги», «печи» удачны. «Ёмкости для замешивания теста» допустимо как нейтральное родовое обозначение מִשְׁאֲרוֹת; сноска с вариантом «квашни» уместна.
  issues:
