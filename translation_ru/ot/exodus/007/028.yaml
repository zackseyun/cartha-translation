translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис сделан плавным, но последовательность вторжения — дом, спальня, постель, дома слуг, народ, печи и ёмкости для теста — сохранена. Маркер сноски поставлен у слова, к которому относится лексическая альтернатива.
