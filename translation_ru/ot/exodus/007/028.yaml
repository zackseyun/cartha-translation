base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/028.yaml
  text: The Nile will swarm with frogs[a], and they will come up and enter your house, your bedroom, and your bed, and the houses of your servants and your people, and your ovens and your kneading bowls.
translation:
  language: ru
  text: Нил будет кишеть лягушками; они поднимутся из него и войдут в твой дом, в твою спальню и на твою постель, в дома твоих слуг, среди твоего народа, в твои печи и в твои ёмкости для замешивания теста[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «квашни».'
    reason: Еврейское מִשְׁאֶרֶת обозначает сосуд для приготовления или замешивания теста; «квашня» — традиционный, более краткий вариант, но для части современных читателей менее привычен.
lexical_decisions:
- source_word: וְשָׁרַץ
  choice: будет кишеть
  rationale: Глагол שׁרץ передаёт обильное, массовое появление и движение мелких существ. Русское «кишеть» естественно и сохраняет яркость образа; будущее время определяется контекстом объявления казни.
- source_word: הַיְאֹר
  choice: Нил
  rationale: В египетском контексте Исхода יְאֹר обозначает Нил, поэтому конкретное название точнее общего «река».
- source_word: צְפַרְדְּעִים
  choice: лягушками
  rationale: Прямой перевод существительного во множественном числе; творительный падеж требуется русской конструкцией «кишеть кем-либо».
- source_word: וְעָלוּ
  choice: поднимутся из него
  rationale: עלה описывает движение лягушек вверх, из Нила на сушу. Добавленное местоимение «из него» естественно уточняет исходную точку, ясно заданную предыдущим упоминанием Нила.
- source_word: וּבָאוּ
  choice: проникнут
  rationale: בוא с последующими предложными сочетаниями означает вхождение в перечисленные места. «Проникнут» естественно передаёт нежелательное вторжение и позволяет связать места с разными русскими предлогами.
- source_word: בְּבֵיתֶךָ
  choice: в твой дом
  rationale: В данном перечне физических мест речь идёт о жилище фараона, а не об абстрактном «доме» как роде или семье.
- source_word: וּבַחֲדַר מִשְׁכָּבְךָ
  choice: в твою спальню
  rationale: Буквально «в комнату твоего сна/лежания»; «спальня» — точный и современный русский эквивалент.
- source_word: וְעַל מִטָּתֶךָ
  choice: на твою постель
  rationale: Сохранён предлог עַל «на», подчёркивающий, что лягушки окажутся непосредственно на постели.
- source_word: וּבְבֵית עֲבָדֶיךָ
  choice: в дома твоих слуг
  rationale: Единственное число בֵית при множественном зависимом слове допускает распределительное понимание; по-русски множественное «дома» ясно выражает смысл.
- source_word: וּבְעַמֶּךָ
  choice: к твоему народу
  rationale: Буквальное «в/среди твоего народа» по-русски плохо сочетается с глаголом движения «проникнут». «К твоему народу» естественно передаёт распространение нашествия на людей, не представляя их физическим помещением.
- source_word: וּבְתַנּוּרֶיךָ
  choice: в твои печи
  rationale: תנור обозначает домашнюю печь для выпечки; «печи» — прямой и понятный эквивалент.
- source_word: וּבְמִשְׁאֲרוֹתֶיךָ
  choice: в твои ёмкости для замешивания теста
  rationale: מִשְׁאֶרֶת обозначает сосуд или ёмкость, связанную с приготовлением и замешиванием теста. Обобщённая формулировка понятна современному читателю и не навязывает спорную конкретную форму предмета.
