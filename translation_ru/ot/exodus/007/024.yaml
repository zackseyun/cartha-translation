  text: And all the Egyptians dug around the Nile for water to drink[a], because they could not drink from the water of the Nile.
translation:
  language: ru
  text: И все египтяне копали вокруг Нила в поисках воды для питья, потому что не могли пить воду из Нила.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: копали
  rationale: Глагол חפר означает «копать, выкапывать». В еврейском тексте колодцы прямо не упомянуты, поэтому более конкретное «рыли колодцы» было бы излишним уточнением.
- source_word: כָל מִצְרַיִם
  choice: все египтяне
  rationale: Буквально возможно «весь Египет», но в данном контексте собирательное выражение обозначает жителей страны, которые искали воду.
- source_word: סְבִיבֹת הַיְאֹר
  choice: вокруг Нила
  rationale: סְבִיבֹת указывает на местность вокруг, а יְאֹר в повествовании Исхода обозначает Нил.
- source_word: מַיִם לִשְׁתּוֹת
  choice: чтобы добыть воду для питья
  rationale: Еврейская конструкция буквально означает «воду, чтобы пить». Глагол «добыть» естественно передаёт подразумеваемую цель копания, не уточняя, что речь шла именно о колодцах.
- source_word: כִּי לֹא יָכְלוּ
  choice: потому что не могли
  rationale: כִּי вводит причину, по которой египтяне копали землю вокруг Нила.
- source_word: לִשְׁתֹּת מִמֵּימֵי הַיְאֹר
  choice: пить воду из Нила
  rationale: Предлог מִן обозначает источник; по-русски сочетание «пить воду из Нила» ясно и естественно передаёт смысл.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; простой, ясный и достойный повествовательный стиль. Название «Нил» употреблено непосредственно, поскольку в контексте Исхода еврейское יְאֹר обозначает именно эту реку. Содержание стиха не требует богословских уточнений.
