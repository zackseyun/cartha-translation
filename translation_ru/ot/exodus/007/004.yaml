base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/004.yaml
  text: Pharaoh will not listen to you[a], and I will lay my hand on Egypt and bring out my hosts—my people[c][b], the sons of Israel—from the land of Egypt with great judgments.
translation:
  language: ru
  text: Но фараон не послушает вас, и Я наложу руку Мою на Египет и выведу из земли Египта Мои ополчения — Мой народ, сынов Израиля, — великими судами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׁמַע אֲלֵכֶם
  choice: не послушает вас
  rationale: Глагол שׁמע с אֶל означает «слушать, внимать кому-либо». Русское «не послушает вас» естественно передаёт отказ внимать, не сводя смысл исключительно к неповиновению.
- source_word: וְנָתַתִּי אֶת יָדִי בְּמִצְרַיִם
  choice: Я наложу руку Мою на Египет
  rationale: Буквальный образ «дать/положить руку» обозначает решительное вмешательство Бога. «Наложу руку» сохраняет этот образ и судебно-карательный контекст, не подменяя выражение отсутствующим здесь глаголом «простереть».
- source_word: צִבְאֹתַי
  choice: Мои ополчения
  rationale: צָבָא обозначает войско, сонм или организованное множество. «Ополчения» сохраняет собирательно-военный образ и допускает понимание Израиля как организованных отрядов, не утверждая, что весь народ был регулярной армией.
- source_word: עַמִּי בְנֵי יִשְׂרָאֵל
  choice: Мой народ, сынов Израиля
  rationale: 'Сохранена аппозиционная структура: «Мои ополчения — Мой народ», после чего народ уточняется как «сыны Израиля». В русском после «выведу» требуется винительный падеж: «сынов Израиля».'
- source_word: בִּשְׁפָטִים גְּדֹלִים
  choice: великими судами
  rationale: 'Прямой перевод сохраняет множественное число и судебный смысл שְׁפָטִים: это совершаемые Богом акты суда над Египтом.'
theological_decisions:
- issue: Обозначение Израиля словом צִבְאֹתַי
  choice: Мои ополчения
  alternative: Мои воинства / Мои войска
  rationale: Израиль представлен как принадлежащее Богу организованное множество. Выбор сохраняет военную и корпоративную образность, но не усиливает её до представления о регулярной армии.
- issue: Передача בְנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян / детей Израиля
  rationale: Сохранён буквальный родственно-родовой образ стандартного этнонима; при этом форма согласована с русским синтаксисом.
- issue: Характер בִּשְׁפָטִים גְּדֹלִים
  choice: великими судами
  alternative: великими деяниями суда
  rationale: Формулировка сохраняет намеренную судебную категорию и не растворяет её в более общем понятии чудес или наказаний.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Порядок фразы слегка выровнен для ясности, но параллелизм и приложения еврейского текста сохранены. Местоимение «Мою» после существительного поддерживает достоинство регистра без избыточной архаизации.
