lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: ожесточилось
  rationale: Глагол חזק буквально передаёт идею укрепления или становления твёрдым; в данном контексте естественное русское «ожесточилось» выражает упорство фараона, не называя внешнего деятеля.
- source_word: לֵב
  choice: сердце
  rationale: Обычный эквивалент לֵב; здесь обозначает внутреннюю волю и способность принимать решения.
- source_word: פַּרְעֹה
  choice: фараона
  rationale: Нормативная русская передача египетского царского титула; родительный падеж обусловлен конструкцией «сердце фараона».
- source_word: שָׁמַע אֲלֵהֶם
  choice: не послушал их
  rationale: В сочетании с אֶל глагол שׁמע означает слушать или внимать кому-либо; «не послушал их» естественно передаёт и отказ внимать, и неповиновение.
- source_word: כַּאֲשֶׁר
  choice: как и
  rationale: Выражает точное соответствие события ранее сказанному; частица «и» естественно подчёркивает это соответствие по-русски.
- source_word: דִּבֶּר
  choice: говорил
  rationale: Русский вид и контекст передают предшествование речи без обязательного употребления громоздкого «сказал прежде».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
theological_decisions:
- issue: Кто произвёл ожесточение сердца фараона
  choice: «сердце фараона ожесточилось» — изменение состояния без названного деятеля
  alternative: «сердце фараона было ожесточено» или «фараон ожесточил своё сердце»
  rationale: Еврейская форма здесь активная и непереходная и не называет того, кто непосредственно вызвал ожесточение. Возвратная русская форма сохраняет неопределённость и не снимает напряжения между другими местами Исхода, где говорится как об ответственности фараона, так и о действии Бога.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Порядок частей стиха близок к еврейскому оригиналу; «ожесточилось» звучит естественно и не приписывает действие прямо ни Богу, ни самому фараону.
