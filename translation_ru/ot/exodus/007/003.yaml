  text: But I will harden Pharaoh’s heart[a], and I will multiply my signs and my wonders in the land of Egypt.
translation:
  language: ru
  text: Но Я ожесточу сердце фараона[a] и умножу Мои знамения и чудеса в земле Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделаю сердце фараона твёрдым»; возможно также: «сделаю сердце фараона упорным». Еврейский глагол стоит в каузативной форме и прямо представляет это ожесточение как действие Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Но Я
  rationale: Союз с явным местоимением подчёркивает контраст с предшествующим поручением; «Но Я» естественно передаёт это значение по-русски.
- source_word: אַקְשֶׁה
  choice: ожесточу
  rationale: 'Порода хифиль глагола קשׁה прямо выражает причинное действие: сделать твёрдым, ожесточить. «Ожесточу» сохраняет каузативность и привычно сочетается со словом «сердце».'
- source_word: לֵב פַּרְעֹה
  choice: сердце фараона
  rationale: Сохранён древнееврейский образ сердца как средоточия внутренней воли и решений без истолковывающей замены на «волю» или «разум».
- source_word: וְהִרְבֵּיתִי
  choice: и умножу
  rationale: Форма в данном контексте имеет будущее значение; «умножу» сохраняет значение רבה и указывает на многочисленность последующих знамений и чудес.
- source_word: אֹתֹתַי
  choice: Мои знамения
  rationale: אוֹת обычно обозначает знак или знамение; «знамения» естественно передаёт здесь действия, указывающие на Божью силу и волю.
- source_word: מוֹפְתַי
  choice: Мои чудеса
  rationale: מוֹפֵת может означать чудо, диво или грозное знамение; в устойчивой паре со «знамениями» слово «чудеса» ясно и естественно передаёт смысл.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в земле Египетской
  rationale: Перевод сохраняет явно присутствующее в еврейском тексте слово «земля» и звучит достойно и естественно в библейском повествовании.
theological_decisions:
- issue: Действие Бога в ожесточении сердца фараона
  choice: Я ожесточу сердце фараона
  alternative: Я сделаю сердце фараона упорным; Я допущу, чтобы сердце фараона ожесточилось
  rationale: Еврейская каузативная форма прямо представляет Бога действующим лицом. Перевод сохраняет эту богословскую напряжённость и не ослабляет высказывание до простого позволения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краток и близок к структуре оригинала; образ «сердца» и прямое причинное действие сохранены.
