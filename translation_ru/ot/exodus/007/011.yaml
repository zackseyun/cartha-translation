  verdict: approve
  source_fidelity: 'Перевод точно передаёт структуру и смысл еврейского текста: фараон призывает две категории специалистов; «египетские чародеи» пояснительно соотнесены с ними; они повторяют предыдущее действие, используя לַהֲטִים. Два усилительных גַּם адекватно отражены словами «тоже» и «также».'
  naturalness: Текст звучит естественно в современном литературном русском и сохраняет достоинство библейского повествования. Конструкция с тире уместно оформляет пояснительное приложение. Сочетание «также сделали то же самое» несколько повторно по форме, но нормативно и оправдано двойным акцентом исходного текста.
  terminology: «Мудрецы», «колдуны» и «чародеи» — понятные и стилистически согласованные соответствия. Разведение «колдунов» и «чародеев» разумно сохраняет различие между מְכַשְּׁפִים и חַרְטֻמִּים, не утверждая специфической природы их силы. «Тайные искусства» передаёт инструментальное בְּלַהֲטֵיהֶם без догматического истолкования; сноска корректно отмечает лексическую неопределённость и привязана к соответствующему выражению.
