base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/011.yaml
  text: Then Pharaoh also called for the wise men and the sorcerers[a], and they too, the magicians of Egypt, did the same by their enchantments.
translation:
  language: ru
  text: Тогда фараон тоже призвал мудрецов и колдунов, и они — египетские чародеи — также сделали то же самое своими тайными искусствами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своими чарами». Еврейское слово может обозначать тайные, в том числе оккультные, искусства или чары; точный оттенок значения неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: призвал
  rationale: В данном контексте קרא означает вызов людей к себе; «призвал» естественно передаёт распоряжение фараона.
- source_word: גַּם
  choice: тоже / также
  rationale: Первое употребление связывает ответное действие фараона с предшествующим событием, а גַם הֵם подчёркивает, что египетские специалисты повторили показанное.
- source_word: חֲכָמִים
  choice: мудрецов
  rationale: Слово обозначает знающих придворных советников или специалистов; «мудрецы» понятно и уместно в повествовательном контексте.
- source_word: מְכַשְּׁפִים
  choice: колдунов
  rationale: Термин от כשׁף обозначает занимающихся колдовством и сохраняет отличие от последующего חַרְטֻמִּים.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: египетские чародеи
  rationale: Так переданы ритуальные специалисты фараона; выбор сохраняет отличие от «колдунов» и звучит естественно по-русски.
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: сделали то же самое
  rationale: Сочетание идиоматически указывает на повторение предшествующего знамения.
- source_word: בְּלַהֲטֵיהֶם
  choice: своими тайными искусствами
  rationale: Контекст указывает на оккультные или сокровенные приёмы как средство действия, но точный оттенок слова остаётся неясным.
theological_decisions:
- issue: Природа силы египетских чародеев
  choice: 'Описать событие феноменологически: они «сделали то же самое своими тайными искусствами».'
  alternative: Уточнить, что это было подлинное сверхъестественное действие либо только обман и ловкость рук.
  rationale: Еврейский текст сообщает о повторении действия, но не объясняет его метафизический механизм; перевод не должен разрешать эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Термины «колдуны» и «чародеи» разведены, чтобы отразить два разных еврейских обозначения; пунктуация делает «египетские чародеи» пояснением к местоимению «они».
