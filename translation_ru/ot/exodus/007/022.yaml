base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/022.yaml
  text: But the magicians of Egypt did the same by their secret arts[a], and Pharaoh’s heart was hardened, and he did not listen to them[b], just as Yahweh had spoken.
translation:
  language: ru
  text: Но египетские маги сделали то же самое своими тайными искусствами[a]. Сердце фараона ожесточилось[b], и он не послушал их, как сказал Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своими заклинаниями»; «своими оккультными искусствами».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сердце фараона стало твёрдым». Еврейский текст этого стиха прямо не указывает, кто вызвал ожесточение.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: сделали то же самое
  rationale: Естественно передаёт идиому «сделали так» и ясно связывает действие магов с предшествующим знамением.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: египетские маги
  rationale: В контексте Исхода это придворные ритуальные специалисты, подражающие знамениям; «маги» — ясное и краткое современное соответствие.
- source_word: בְּלָטֵיהֶם
  choice: своими тайными искусствами
  rationale: Сохраняет инструментальное значение предлога и оттенок скрытых магических приёмов, не конкретизируя их сверх текста.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: Сердце фараона ожесточилось
  rationale: Передаёт наступившее состояние без указания действующего лица, которого еврейская форма здесь прямо не называет.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: он не послушал их
  rationale: שׁמע с אֶל означает «слушать, внимать»; местоимение по контексту относится к Моисею и Аарону.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: как и говорил Яхве
  rationale: Формула отсылает к ранее сказанному Богом; личное имя יהוה передано транслитерацией «Яхве».
theological_decisions:
- issue: Кто ожесточил сердце фараона
  choice: «Сердце фараона ожесточилось» — результативно-непереходная формулировка без названного деятеля.
  alternative: «Сердце фараона было ожесточено» или «фараон ожесточил своё сердце».
  rationale: В данном стихе еврейский текст прямо не приписывает ожесточение ни Богу, ни самому фараону; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и достойное по тону. Термин «тайные искусства» сохраняет смысловую широту оригинала, а конструкция «сердце… ожесточилось» не вводит отсутствующего в стихе деятеля.
