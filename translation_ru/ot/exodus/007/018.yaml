translation:
  language: ru
  text: И рыба, что в Ниле, умрёт, Нил будет смердеть, и египтяне не смогут пить воду из Нила.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «египтяне изнемогут, пытаясь пить воду из Нила». Еврейский глагол может обозначать утомление или изнеможение, ведущее к невозможности пить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: рыба
  rationale: Единственное число в еврейском имеет собирательное значение; русское «рыба» естественно передаёт всю рыбу в реке.
- source_word: יְאֹר
  choice: Нил
  rationale: В контексте Исхода слово обозначает Нил; явное название устраняет ненужную для русского читателя неопределённость.
- source_word: תָּמוּת
  choice: умрёт
  rationale: Прямое соответствие глаголу מות; согласовано с собирательным существительным «рыба».
- source_word: וּבָאַשׁ
  choice: станет смердеть
  rationale: Передаёт сильное значение появления отвратительного запаха, не смягчая образ исходного текста.
- source_word: וְנִלְאוּ
  choice: не смогут
  rationale: В данном контексте Niphal глагола לאה выражает изнеможение, приводящее к практической невозможности пить; неоднозначность отмечена в сноске.
- source_word: לִשְׁתּוֹת מַיִם
  choice: пить воду
  rationale: Сохраняет явно названный в еврейском объект «воду».
- source_word: מִן הַיְאֹר
  choice: из Нила
  rationale: Естественное русское обозначение источника воды.
