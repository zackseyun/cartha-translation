lexical_decisions:
- source_word: וַיִּמָּלֵא
  choice: и прошло
  rationale: Глагол מלא в нифале применительно к периоду времени означает, что он исполнился или завершился. Русское «прошло» естественно передаёт истечение семи дней; более буквальная образность отмечена в сноске.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: Прямое обозначение семидневного периода.
- source_word: אַחֲרֵי הַכּוֹת
  choice: после того, как … поразил
  rationale: Сочетание предлога אַחֲרֵי с инфинитивом נכה выражает последующее время. Личная конструкция с прошедшим временем естественна для современного русского языка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: הַיְאֹר
  choice: Нил
  rationale: В контексте Исхода слово יְאֹר обозначает Нил; конкретное географическое название точнее общего «река».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул; транслитерация сохраняет это различие, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык. Формула «после того, как» делает временную связь ясной, а начальное «И» сохраняет повествовательную связь с предыдущим стихом. Избегнуты архаизмы «исполнилось» и «поразил реку» в основном тексте; буквальный вариант сохранён в сноске.
