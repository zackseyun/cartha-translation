base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/014.yaml
  text: Then Yahweh said to Moses[a], “Pharaoh’s heart is heavy; he refuses to let the people go.”
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Сердце фараона тяжело[a]: он отказывается отпустить народ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сердце фараона упорно». Еврейское прилагательное буквально означает «тяжёлое» и здесь служит образом упрямства или невосприимчивости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Вайиктоль продвигает повествование; «тогда» естественно передаёт последовательность событий в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: כָּבֵד
  choice: тяжело
  rationale: Сохранён конкретный образ еврейского прилагательного «тяжёлый»; в данном контексте он указывает на упрямство и невосприимчивость фараона, но не сводится молча к привычному «ожесточено».
- source_word: לֵב פַּרְעֹה
  choice: сердце фараона
  rationale: Конструкция принадлежности естественно передана родительным падежом.
- source_word: מֵאֵן
  choice: он отказывается
  rationale: Причастная форма выражает продолжающееся состояние или устойчивую позицию отказа.
- source_word: לְשַׁלַּח
  choice: отпустить
  rationale: В контексте Исхода глагол означает позволить народу уйти; «отпустить» точно и естественно передаёт этот смысл.
- source_word: הָעָם
  choice: народ
  rationale: Сохранено общее обозначение исходного текста без поясняющего добавления «Израиля».
theological_decisions:
- issue: Передача состояния сердца фараона без устранения напряжения в теме ожесточения
  choice: Сердце фараона тяжело
  alternative: Сердце фараона ожесточено / упорно
  rationale: В этом стихе употреблено слово со значением «тяжёлый». Сохранение образа отражает особую лексику данного места и не уравнивает её с другими глаголами и прилагательными в повествовании об ожесточении сердца фараона.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified повествовательная формулировка. Необычный для русского выражение «сердце … тяжело» намеренно сохраняет исходную метафору, а сноска поясняет её смысл.
