base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/002.yaml
  text: You shall speak all that I command you[a], and Aaron your brother shall speak to Pharaoh, that he may send the sons of Israel out from his land.
translation:
  language: ru
  text: Ты будешь говорить всё, что Я повелю тебе, а Аарон, твой брат, будет говорить фараону, чтобы тот отпустил сынов Израиля[a] из своей земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян»; традиционно: «детей Израиля». Буквально по-еврейски: «сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְדַבֵּר
  choice: будешь говорить
  rationale: Форма обозначает порученное Моисею действие; будущее время естественно передаёт в русском языке директивный смысл и сохраняет параллель с речью Аарона.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּךָּ
  choice: всё, что Я повелю тебе
  rationale: Передаёт всеохватность כָּל и допускаемую контекстом направленность имперфекта אֲצַוֶּךָּ на последующие повеления.
- source_word: אַהֲרֹן אָחִיךָ
  choice: Аарон, твой брат
  rationale: Сохраняет порядок еврейского выражения и звучит естественно в современном литературном русском.
- source_word: יְדַבֵּר אֶל־פַּרְעֹה
  choice: будет говорить фараону
  rationale: Глагол דבר с אֶל прямо обозначает обращённую к фараону речь; перевод не добавляет отсутствующего в тексте содержания этой речи.
- source_word: וְשִׁלַּח
  choice: чтобы тот отпустил
  rationale: В данном построении действие фараона представлено как цель речи Аарона. Указательное местоимение «тот» ясно относит действие к фараону, не превращая цель в безусловное предсказание результата.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально передаёт родословное выражение «сыны Израиля» и сохраняет образность исходного текста; более идиоматичный вариант дан в сноске.
- source_word: מֵאַרְצוֹ
  choice: из своей земли
  rationale: Предлог מִן передаёт удаление из пределов земли; возвратное «своей» естественно связывает её с фараоном.
theological_decisions:
- issue: Значение связи וְשִׁלַּח с предшествующей речью Аарона
  choice: 'цель: «чтобы тот отпустил»'
  alternative: 'последовательность или предсказанный результат: «и он отпустит»'
  rationale: Целевое прочтение естественно в контексте поручения и не утверждает, будто немедленное освобождение гарантировано, что особенно важно ввиду последующего отказа фараона; при этом оно не уточняет, насколько вероятен результат.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис остаётся прозрачным для обычного читателя; прописная буква в местоимении «Я» следует принятой русской практике при прямой речи Бога.
