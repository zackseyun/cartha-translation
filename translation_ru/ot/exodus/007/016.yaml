base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/016.yaml
  text: 'And you shall say to him[a], ‘Yahweh, the God of the Hebrews, has sent me to you, saying: Let my people go, so that they may serve me in the wilderness. But behold, until now you have not listened.’'
translation:
  language: ru
  text: 'И скажи ему: «Яхве, Бог евреев, послал меня к тебе сказать: “Отпусти Мой народ, чтобы они служили Мне в пустыне[a]”. Но вот, до сих пор ты не послушал».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклонялись Мне в пустыне». Еврейский глагол может означать как служение вообще, так и религиозное поклонение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Бог евреев
  rationale: Сохраняет этническое обозначение עִבְרִים и естественную русскую конструкцию.
- source_word: שְׁלָחַנִי
  choice: послал меня
  rationale: Завершённое поручение в данном контексте естественно передаётся русским прошедшим временем.
- source_word: לֵאמֹר
  choice: сказать
  rationale: Естественно вводит содержание переданного Моисею поручения без тяжеловесного буквального «говоря».
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Отпусти Мой народ
  rationale: Точно выражает повеление освободить и позволить уйти.
- source_word: וְיַעַבְדֻנִי
  choice: чтобы они служили Мне
  rationale: Целевая конструкция передана союзом «чтобы»; «служили» сохраняет широкий смысл עבד, включающий религиозное поклонение, но не сводящийся к нему.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Обычное и понятное русское соответствие מִדְבָּר в повествовании Исхода.
- source_word: וְהִנֵּה
  choice: Но
  rationale: В данном контексте частица подчёркивает контраст и фактическое положение дел; отдельное «вот» по-русски звучало бы менее естественно.
- source_word: לֹא שָׁמַעְתָּ
  choice: ты не послушал
  rationale: Сохраняет связь со значением «слушать», одновременно естественно подразумевая отказ внять требованию.
- source_word: עַד כֹּה
  choice: до сих пор
  rationale: Точное современное русское выражение временного значения «вплоть до настоящего момента».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение וְיַעַבְדֻנִי
  choice: служили Мне
  alternative: поклонялись Мне
  rationale: Глагол עבד может обозначать как служение вообще, так и религиозное служение; основной текст сохраняет эту смысловую широту.
translation_notes:
  register: 'Современный литературный русский язык с достойным библейским звучанием. Синтаксис слегка упрощён по сравнению с формальным калькированием: לֵאמֹר передано инфинитивом «сказать», а וְהִנֵּה — контрастным «но». Прописные буквы в «Мой/Мне» служат типографическим обозначением речи Бога, не меняя смысла оригинала.'
