base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/029.yaml
  text: The frogs will come up on you[a], on your people, and on all your servants.
translation:
  language: ru
  text: И на тебя, и на твой народ[a], и на всех твоих слуг полезут лягушки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди твоего народа». В еврейском во всех трёх сочетаниях употреблён один и тот же предлог; здесь контекст говорит о нашествии лягушек как о бедствии, обрушившемся на фараона и всё его царство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָה / וּבְעַמְּךָ / וּבְכָל עֲבָדֶיךָ
  choice: и на тебя, и на твой народ, и на всех твоих слуг
  rationale: Повтор предлога «на» сохраняет трёхчастный параллелизм еврейского текста и передаёт нашествие как бедствие, обрушившееся на фараона, его народ и слуг.
- source_word: עֲבָדֶיךָ
  choice: твоих слуг
  rationale: Слово может обозначать слуг, рабов или царедворцев. «Слуги» — наиболее широкое и нейтральное соответствие, не уточняющее без достаточных оснований их положение при дворе.
- source_word: יַעֲלוּ
  choice: полезут
  rationale: Глагол буквально означает движение вверх. В контексте лягушек, выбирающихся из вод и заполняющих владения фараона, «полезут» естественно передаёт и направление движения, и массовое нашествие.
- source_word: הַצְפַרְדְּעִים
  choice: лягушки
  rationale: Определённость в еврейском указывает на уже названное нашествие; в русском контексте она естественно выражается без отдельного указательного слова.
