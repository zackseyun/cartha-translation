base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/026.yaml
  text: 'And Yahweh said to Moses[a], “Go in to Pharaoh and say to him, ‘Thus says Yahweh: Let my people go, so that they may serve me.’”'
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Войди к фараону и скажи ему: „Так говорит Яхве: отпусти Мой народ, чтобы они служили Мне[a]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклонялись Мне». Древнееврейский глагол может обозначать служение Богу, в том числе поклонение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Сохраняет последовательное развитие древнееврейского повествования и звучит естественно в русском библейском рассказе.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Войди к фараону
  rationale: Глагол בוא может означать приход или вход; здесь речь идёт о входе к фараону, в его присутствие.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: и скажи ему
  rationale: Естественно передаёт последовательное повеление без ослабления его силы.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняет краткую и авторитетную формулу речи посланника.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: отпусти Мой народ
  rationale: Точно передаёт требование освободить народ, а не просто послать его куда-либо.
- source_word: וְיַעַבְדֻנִי
  choice: чтобы он служил Мне
  rationale: Передаёт вероятное значение цели и сохраняет широкий смысл עבד — служение Богу, включающее поклонение, но не ограниченное им.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: Исходный текст употребляет личное имя Бога. Форма «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл וְיַעַבְדֻנִי применительно к предназначению Израиля
  choice: служил Мне
  alternative: поклонялся Мне
  rationale: «Служил» сохраняет более широкий смысл глагола עבד и богословское противопоставление служения фараону служению Богу; значение поклонения отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формула «Так говорит Яхве» сохранена ради её официального и авторитетного характера; местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
