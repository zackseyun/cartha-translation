  text: וּ/מֹשֶׁה֙ בֶּן שְׁמֹנִ֣ים שָׁנָ֔ה וְ/אַֽהֲרֹ֔ן בֶּן שָׁלֹ֥שׁ וּ/שְׁמֹנִ֖ים שָׁנָ֑ה בְּ/דַבְּרָ֖/ם אֶל פַּרְעֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/007.yaml
  text: Moses was eighty years old[a], and Aaron was eighty-three years old, when they spoke to Pharaoh.
translation:
  language: ru
  text: Моисею было восемьдесят лет[a], а Аарону — восемьдесят три года, когда они обращались к фараону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Моисей был сыном восьмидесяти лет, а Аарон — сыном трёх и восьмидесяти лет».'
    reason: Поясняет еврейскую идиому обозначения возраста и исходный порядок числительных.
lexical_decisions:
- source_word: בֶּן ... שָׁנָה
  choice: было ... лет / года
  rationale: Еврейское обозначение возраста буквально строится как «сын ... лет», но современный литературный русский естественно передаёт его безличной конструкцией «кому-либо было ... лет».
- source_word: שְׁמֹנִים שָׁנָה
  choice: восемьдесят лет
  rationale: Обычное количественное обозначение возраста; форма «лет» соответствует нормам русского языка после числительного «восемьдесят».
- source_word: שָׁלֹשׁ וּשְׁמֹנִים שָׁנָה
  choice: восемьдесят три года
  rationale: В еврейском тексте буквально стоит «три и восемьдесят»; в современном русском принят порядок «восемьдесят три».
- source_word: בְּדַבְּרָם
  choice: когда они обращались
  rationale: 'Предлог ב при инфинитиве с местоименным суффиксом задаёт временное обстоятельство: «когда они говорили». Глагол «обращались» естественно передаёт речь, направленную к фараону, не предполагая непременно равноправной беседы.'
- source_word: אֶל
  choice: к
  rationale: При обозначении направленной речи אֶל указывает на адресата; по-русски это естественно выражается сочетанием «обращаться к».
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Устоявшаяся русская передача египетского царского титула.
- source_word: וּ/וְ
  choice: а; начальный союз отдельно не выражен
  rationale: Союз перед именем Аарона естественно передан русским «а», разграничивающим сведения о двух лицах. Начальный waw служит связью с повествовательным контекстом и не требует искусственного «и» в самостоятельном русском стихе.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с естественной конструкцией для обозначения возраста. Формулировка «обращались к фараону» сохраняет направленность речи, выраженную אֶל, и не превращает её без необходимости во взаимный разговор. Тире во второй части устраняет повтор сказуемого и соответствует нормам русского синтаксиса.
