  text: וְ/הַ/דָּגָ֨ה אֲשֶׁר בַּ/יְאֹ֥ר מֵ֨תָה֙ וַ/יִּבְאַ֣שׁ הַ/יְאֹ֔ר וְ/לֹא יָכְל֣וּ מִצְרַ֔יִם לִ/שְׁתּ֥וֹת מַ֖יִם מִן הַ/יְאֹ֑ר וַ/יְהִ֥י הַ/דָּ֖ם בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/021.yaml
  text: And the fish in the Nile died[a], and the Nile stank, so that the Egyptians could not drink water from the Nile. And there was blood throughout all the land of Egypt.
translation:
  language: ru
  text: И рыба в Ниле[a] погибла, и Нил стал смердеть, так что египтяне не могли пить воду из Нила. И была кровь по всей земле Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское יְאֹר буквально означает «река», но в книге Исход здесь имеется в виду Нил.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: рыба
  rationale: Еврейское существительное употреблено собирательно; русское единственное число «рыба» естественно передаёт всю рыбу в реке, не расширяя значение до всей водной жизни.
- source_word: יְאֹר
  choice: Нил
  rationale: Хотя слово может означать реку или водный канал, в повествовании Исхода здесь явно имеется в виду Нил; собственное название делает референт понятным.
- source_word: מֵתָה
  choice: погибла
  rationale: Форма обозначает наступившую смерть; «погибла» естественно сочетается с собирательным «рыба» и сохраняет последовательность событий.
- source_word: וַיִּבְאַשׁ
  choice: стал смердеть
  rationale: Глагол выражает появление сильного дурного запаха. «Стал смердеть» передаёт как начало состояния, так и резкость исходного выражения.
- source_word: וְלֹא יָכְלוּ
  choice: не могли
  rationale: Прямой и естественный русский эквивалент выражения невозможности.
- source_word: לִשְׁתּוֹת מַיִם מִן הַיְאֹר
  choice: пить воду из Нила
  rationale: Перевод сохраняет явно названный объект «воду» и источник «из Нила».
- source_word: וַיְהִי הַדָּם
  choice: и была кровь
  rationale: Оборот сохраняет повествовательную связь и бытийное значение еврейской конструкции, не уточняя сверх текста, каким именно образом кровь распространилась.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: по всей земле Египта
  rationale: Предлог «по» естественно передаёт распространение по всей территории, а «земля Египта» звучит ясно и современно.
