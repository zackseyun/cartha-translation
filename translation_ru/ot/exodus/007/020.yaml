  text: וַ/יַּֽעֲשׂוּ כֵן֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֗ה וַ/יָּ֤רֶם בַּ/מַּטֶּה֙ וַ/יַּ֤ךְ אֶת הַ/מַּ֨יִם֙ אֲשֶׁ֣ר בַּ/יְאֹ֔ר לְ/עֵינֵ֣י פַרְעֹ֔ה וּ/לְ/עֵינֵ֖י עֲבָדָ֑י/ו וַ/יֵּהָֽפְכ֛וּ כָּל הַ/מַּ֥יִם אֲשֶׁר בַּ/יְאֹ֖ר לְ/דָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/020.yaml
  text: So Moses and Aaron did so[a], just as Yahweh had commanded. And he raised the staff and struck the water that was in the Nile before Pharaoh's eyes and before the eyes of his servants, and all the water that was in the Nile was turned to blood.
translation:
  language: ru
  text: Моисей и Аарон сделали точно так, как повелел Яхве. Он поднял посох и ударил по воде в Ниле[a] на глазах у фараона и на глазах у его слуг, и вся вода в Ниле превратилась в кровь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «река»; в книге Исход это слово обычно обозначает Нил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: сделали так
  rationale: Естественно и близко передаёт сочетание עשה + כן, обозначающее исполнение данного прежде повеления.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: как повелел
  rationale: Передаёт соответствие поступка повелению; порядок событий ясен из контекста без дополнительного уточнения времени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: וַיָּרֶם
  choice: Он поднял
  rationale: Сохраняет единственное число еврейского глагола и не уточняет сверх текста, кто именно из двух названных лиц совершил действие.
- source_word: בַּמַּטֶּה
  choice: посох
  rationale: Современное и уместное в повествовании обозначение מַטֶּה.
- source_word: וַיַּךְ אֶת־הַמַּיִם
  choice: ударил по воде
  rationale: Точно и естественно передаёт действие глагола נכה в данном контексте.
- source_word: הַיְאֹר
  choice: Нил
  rationale: В повествовании Исхода יְאֹר обычно обозначает конкретно Нил; это название ясно передаёт референт, а буквальная альтернатива отмечена в сноске.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: на глазах у фараона и его слуг
  rationale: Естественная русская передача публичности действия; объединение повторяющегося оборота не устраняет его смыслового акцента.
- source_word: עֲבָדָיו
  choice: его слуг
  rationale: Сохраняет основное значение слова, не уточняя их должности или положение при дворе.
- source_word: וַיֵּהָפְכוּ ... לְדָם
  choice: вся вода ... превратилась в кровь
  rationale: Идиоматично передаёт изменение состояния и результат; русское согласование с собирательным выражением «вся вода» требует единственного числа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. «Яхве» сохраняет его как имя и представляет наиболее распространённую научную реконструкцию произношения.
- issue: Кто поднял посох и ударил по воде
  choice: Сохранить неопределённость местоимением «Он»
  alternative: Назвать Аарона или Моисея
  rationale: После упоминания Моисея и Аарона еврейский текст переходит к глаголам единственного числа, но прямо не называет действующее лицо. Контекст предшествующего повеления указывает на Аарона, однако сам стих оставляет субъект невыраженным, поэтому перевод не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным повествовательным регистром. Повтор «в Ниле» сохранён вслед за исходным текстом; формула «на глазах у» естественно передаёт публичность события.
