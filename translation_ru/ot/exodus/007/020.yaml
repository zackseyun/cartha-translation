    rationale: В еврейском тексте לְעֵינֵי повторено перед фараоном и его слугами. Хотя исходная формулировка передаёт общий смысл, повтор подчёркивает публичность события и может быть сохранён естественным русским оборотом.
  - severity: low
    issue: Сравнительный оттенок כַּאֲשֶׁר передан несколько ослабленно.
    rationale: «Сделали так, как повелел» приемлемо, но «сделали точно так, как повелел» яснее отражает исполнение в соответствии с повелением, не добавляя смысла.
