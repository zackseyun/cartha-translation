  text: Then Joseph died, and all his brothers, and all that generation.
translation:
  language: ru
  text: И умер Иосиф, и все его братья, и всё то поколение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: И умер
  rationale: Вав-последовательный с глаголом מות продолжает повествование и обозначает завершённое событие в прошлом. Русское «И умер» естественно связывает стих с предыдущим контекстом и сохраняет соединительную силу формы.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
- source_word: וְכָל אֶחָיו
  choice: и все его братья
  rationale: כָּל имеет собирательное значение, а אֶחָיו — форма множественного числа «братья» с местоименным суффиксом 3-го лица мужского рода единственного числа, то есть братья Иосифа.
- source_word: וְכֹל הַדּוֹר הַהוּא
  choice: и всё то поколение
  rationale: Повтор כֹּל сохранён, чтобы передать всеохватность еврейского текста. דּוֹר означает поколение современников, а указательное הַהוּא естественно передаётся как «то».
