  text: וַ/יֹּ֖אמֶר אֶל עַמּ֑/וֹ הִנֵּ֗ה עַ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל רַ֥ב וְ/עָצ֖וּם מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/009.yaml
  text: And he said to his people[a], “Look, the people of the sons of Israel are more numerous and stronger than we are.”
translation:
  language: ru
  text: 'И сказал он своему народу: «Вот, народ сынов Израиля многочисленнее и сильнее нас».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал он
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; союз «и» сохраняет связь с предыдущим рассказом.
- source_word: אֶל עַמּוֹ
  choice: своему народу
  rationale: עַם обозначает народ как коллектив, а суффикс 3-го лица мужского рода указывает на народ фараона; возвратное «своему» естественно по-русски соотносится с подлежащим.
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание к следующему утверждению; «вот» передаёт её дейктическую силу в современном литературном русском.
- source_word: עַם בְּנֵי יִשְׂרָאֵל
  choice: народ сынов Израиля
  rationale: Сохранена структура еврейского сочетания и родовое обозначение בְּנֵי יִשְׂרָאֵל без сведения его к более общему «израильтяне».
- source_word: רַב
  choice: многочисленнее
  rationale: 'При מִמֶּנּוּ прилагательное получает сравнительный смысл: речь идёт о численном превосходстве.'
- source_word: וְעָצוּם
  choice: и сильнее
  rationale: עָצוּם обозначает силу или могущество; сравнительная форма согласуется с общим сравнением, выраженным מִמֶּנּוּ.
- source_word: מִמֶּנּוּ
  choice: нас
  rationale: 'Предлог מִן с суффиксом 1-го лица множественного числа выражает сравнение: «чем мы / нас»; в русском после сравнительной степени естественно «нас».'
