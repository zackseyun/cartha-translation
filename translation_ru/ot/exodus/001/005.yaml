  text: And all the persons who came from Jacob’s loins were seventy persons[a], and Joseph was already in Egypt.
translation:
  language: ru
  text: Всех прямых потомков Иакова было семьдесят[a], а Иосиф уже находился в Египте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вышедших из бедра Иакова» — еврейское выражение, означающее его прямых потомков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כָּל נֶפֶשׁ
  choice: Всех ... было
  rationale: Повествовательная конструкция с היה и כָּל естественно передаётся по-русски оборотом со значением общего числа; отдельное «и» в начале стиха не требуется для сохранения связи в современном русском повествовании.
- source_word: נֶפֶשׁ ... נָפֶשׁ
  choice: потомков ... семьдесят
  rationale: В данном счётном контексте נֶפֶשׁ обозначает людей, а не «души» в специальном антропологическом смысле. Русская конструкция с числительным позволяет не повторять тяжеловесное «человек».
- source_word: יֹצְאֵי יֶרֶךְ יַעֲקֹב
  choice: прямых потомков Иакова
  rationale: Буквальная телесная идиома «вышедшие из бедра Иакова» в современном русском неясна и неестественна; «прямые потомки» точно передаёт её значение, а образ сохраняется в сноске.
- source_word: שִׁבְעִים
  choice: семьдесят
  rationale: Прямая передача количественного числительного.
- source_word: וְיוֹסֵף הָיָה בְמִצְרָיִם
  choice: а Иосиф уже находился в Египте
  rationale: Союз «а» естественно выделяет добавочное обстоятельство об Иосифе. «Уже» ясно передаёт, что к этому времени он находился в Египте, не превращая простую еврейскую форму в излишне уточнённое давнопрошедшее время.
theological_decisions:
- issue: Соотношение числа семьдесят с другими библейскими формами подсчёта семьи Иакова
  choice: Сохранено данное масоретским текстом число «семьдесят» без гармонизации.
  alternative: Уточнить или заменить число на основании иных текстовых традиций либо других способов подсчёта.
  rationale: Перевод следует представленному источнику WLC и не снимает межтекстовое напряжение посредством пояснений, отсутствующих в стихе.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Динамически передана непривычная еврейская телесная идиома, при этом её буквальная форма отмечена в сноске. Начальное повествовательное וַ не воспроизведено механическим союзом, чтобы фраза звучала естественно.
