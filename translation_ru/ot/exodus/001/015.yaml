lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Форма с последовательным וַ продвигает повествование; «тогда» естественно передаёт последовательность событий в современном русском языке.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: царь Египта
  rationale: Прямая передача сопряжённой конструкции без внесения титула «фараон», которого в данном стихе нет.
- source_word: לַמְיַלְּדֹת
  choice: повитухам
  rationale: Причастная форма от ילד обозначает женщин, помогающих при родах; «повитуха» — понятное и уместное в библейском повествовании русское соответствие.
- source_word: הָעִבְרִיֹּת
  choice: еврейским
  rationale: Прилагательное естественно согласуется с «повитухами», однако синтаксис допускает и понимание «повитухам евреек»; неоднозначность отмечена в сноске.
- source_word: אֲשֶׁר שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית ...
  choice: одну из которых звали ... а другую — ...
  rationale: Естественная русская передача распределительной конструкции «одна ... вторая» с сохранением отнесения имён к двум женщинам.
- source_word: שִׁפְרָה
  choice: Шифра
  rationale: Традиционная и близкая к еврейской форме русская транслитерация личного имени.
- source_word: פּוּעָה
  choice: Фуа
  rationale: Устоявшаяся русская библейская передача личного имени, достаточно близкая к еврейскому звучанию.
