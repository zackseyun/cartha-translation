  text: וְ/כַ/אֲשֶׁר֙ יְעַנּ֣וּ אֹת֔/וֹ כֵּ֥ן יִרְבֶּ֖ה וְ/כֵ֣ן יִפְרֹ֑ץ וַ/יָּקֻ֕צוּ מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/012.yaml
  text: But the more they afflicted them[a], the more they multiplied and the more they spread out[c][b], so that they dreaded the sons of Israel.
translation:
  language: ru
  text: Но чем больше их угнетали, тем больше они умножались и тем шире распространялись, так что египтяне страшились сынов Израиля[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сыны Израиля» — то есть израильтяне, народ Израиля; выражение относится ко всему народу, а не только к мужчинам.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «испытывали отвращение к»; еврейский глагол может выражать сильный страх, тревогу или отвращение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַאֲשֶׁר ... כֵּן ... וְכֵן
  choice: Но чем больше… тем больше…
  rationale: Коррелятивная конструкция выражает пропорциональное нарастание; «но» передаёт контраст с ожидаемым результатом угнетения.
- source_word: יְעַנּוּ אֹתוֹ
  choice: их угнетали
  rationale: Пиэль ענה означает угнетать, притеснять; местоимение единственного числа относится к Израилю как к собирательному целому, что по-русски естественно передаётся множественным числом.
- source_word: יִרְבֶּה
  choice: они умножались
  rationale: Глагол описывает численный рост народа; русское множественное число согласуется с коллективным референтом.
- source_word: יִפְרֹץ
  choice: распространялись
  rationale: В данном контексте פרץ обозначает стремительное расширение и расселение; выбор сохраняет образ роста, не вводя неясного буквального «прорывались».
- source_word: וַיָּקֻצוּ
  choice: стали испытывать страх и отвращение
  rationale: קוץ допускает оттенки как ужаса или тревоги, так и отвращения. Сочетание сохраняет широту семантики, не снимая подлинной неоднозначности.
- source_word: מִפְּנֵי
  choice: перед
  rationale: Предлог может выражать реакцию на присутствие или угрозу со стороны кого-либо; «перед» естественно сочетается со страхом и сохраняет связь с присутствием Израиля.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынами Израиля
  rationale: Формально прозрачная передача устойчивого еврейского обозначения народа; альтернативный современный этноним дан в сноске.
theological_decisions:
- issue: Коллективный Израиль и грамматическое число
  choice: их / они
  alternative: его / он
  rationale: Хотя еврейские формы единственного числа представляют Израиль как единое целое, русское множественное число яснее соотносится с людьми, которых угнетали, и не меняет смысла.
- issue: Значение реакции египтян в וַיָּקֻצוּ
  choice: стали испытывать страх и отвращение
  alternative: ужасались; гнушались
  rationale: Глагол семантически допускает и сильный страх, и отвращение. Основной текст намеренно сохраняет оба оттенка вместо выбора одного богословски или психологически более узкого толкования.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; потомки Израиля
  rationale: Сохраняется форма исходного этнонима без утверждения, что речь только о мужчинах; сноска поясняет его собирательное значение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Корреляция «чем больше… тем больше…» делает синтаксис естественным; «сыны Израиля» сохраняет заметную формальность оригинала и поясняется сноской.
