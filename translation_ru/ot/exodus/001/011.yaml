  text: וַ/יָּשִׂ֤ימוּ עָלָי/ו֙ שָׂרֵ֣י מִסִּ֔ים לְמַ֥עַן עַנֹּת֖/וֹ בְּ/סִבְלֹתָ֑/ם וַ/יִּ֜בֶן עָרֵ֤י מִסְכְּנוֹת֙ לְ/פַרְעֹ֔ה אֶת פִּתֹ֖ם וְ/אֶת רַעַמְסֵֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/011.yaml
  text: 'So they set taskmasters over him to afflict him with their burdens[c][b][a], and he built storage cities for Pharaoh: Pithom and Rameses.'
translation:
  language: ru
  text: И поставили над ним начальников, ведавших принудительными работами, чтобы изнурять его тяжёлыми повинностями[a][b]. И он построил для фараона города-хранилища[c] — Пифом и Раамсес[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально говорит «над ним», «изнурять его» и далее «он построил», представляя Израиль как единый народ. По смыслу возможно: «над ними», «изнурять их» и «они построили».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «их тяготами»; местоимение может указывать на тяготы, налагаемые начальниками или египтянами.'
    reason: source_ambiguity
  - marker: c
    text: 'Или: «города запасов».'
    reason: lexical_alternative
  - marker: d
    text: Название также передают как «Рамсес».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: поставили
  rationale: Передаёт значение שׂים ‘поставить, назначить’ в повествовательной форме.
- source_word: עָלָיו
  choice: над ним
  rationale: Сохраняет мужской род и единственное число еврейского суффикса; Израиль представлен как единый народ.
- source_word: שָׂרֵי מִסִּים
  choice: начальников принудительных работ
  rationale: מַסִּים обозначает повинность или принудительный труд, а שָׂרִים — поставленных над ним должностных лиц. Формулировка ясна современному читателю и точнее общего слова ‘надсмотрщики’.
- source_word: לְמַעַן עַנֹּתוֹ
  choice: чтобы изнурять его
  rationale: Пиэль ענה здесь выражает причинение страдания и угнетение; ‘изнурять’ естественно сочетается с тяжёлыми повинностями, не ослабляя суровости действия.
- source_word: בְּסִבְלֹתָם
  choice: тяжёлыми повинностями
  rationale: סְבָלוֹת может обозначать тяготы, ноши и тяжёлые трудовые повинности. Основной текст передаёт контекст принудительного труда, а буквальная местоименная конструкция отмечена в сноске из-за неясности её соотнесения.
- source_word: וַיִּבֶן
  choice: он построил
  rationale: Сохраняет форму третьего лица мужского рода единственного числа, согласованную с собирательным образом Израиля.
- source_word: עָרֵי מִסְכְּנוֹת
  choice: города-хранилища
  rationale: Передаёт города, служившие местами хранения запасов; сложное слово звучит естественно и не сужает значение до зернохранилищ.
- source_word: לְפַרְעֹה
  choice: для фараона
  rationale: Обычная русская передача царского титула в данном повествовании.
- source_word: פִּתֹם
  choice: Пифом
  rationale: Устоявшаяся русская библейская передача географического названия.
- source_word: רַעַמְסֵס
  choice: Раамсес
  rationale: Передаёт масоретскую форму названия רַעַמְסֵס и соответствует распространённой русской библейской традиции.
theological_decisions:
- issue: Собирательное обозначение Израиля формами единственного числа
  choice: Сохранены ‘над ним’, ‘его’ и ‘он построил’.
  alternative: 'Передать по смыслу множественным числом: ‘над ними’, ‘их’, ‘они построили’.'
  rationale: Еврейский текст последовательно употребляет здесь формы мужского рода единственного числа, представляя Израиль как единое целое. Сноска поясняет идиому, чтобы русский текст не воспринимался как ошибка.
- issue: Соотнесение местоименного суффикса в בְּסִבְלֹתָם
  choice: В основном тексте использовано неместоименное ‘тяжёлыми повинностями’, а буквальная форма раскрыта в сноске.
  alternative: ‘Их тяготами’ или ‘возложенными ими тяготами’.
  rationale: Суффикс множественного числа допускает не вполне однозначное соотнесение; явное ‘возложенными ими’ разрешило бы эту неясность за текст. Основная формулировка естественна по-русски, а сноска сохраняет языковую особенность источника.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Сохранены собирательные формы единственного числа оригинала, но их непривычность разъяснена. Терминология принудительного труда передана ясно, без архаичного ‘налога’ и без чрезмерно узкого понимания городов как зернохранилищ.
