  text: A new king arose over Egypt[b][a], who did not know Yosef.
translation:
  language: ru
  text: Над Египтом воцарился новый царь[a], который не знал Йосефа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «другой царь». Еврейское прилагательное буквально означает «новый», но некоторые понимают его как указание на иную династию или новый режим.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не признавал Йосефа». Слово «знать» здесь может означать не только отсутствие сведений, но и непризнание Йосефа или того, что с ним считались.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: воцарился
  rationale: Глагол קום в повествовании означает появление или возвышение нового правителя. «Воцарился» естественно передаёт вступление царя во власть, не добавляя отдельного указания на время.
- source_word: מֶלֶךְ
  choice: царь
  rationale: Существительное прямо обозначает царя; «правитель» было бы шире и менее точно.
- source_word: חָדָשׁ
  choice: новый
  rationale: Основное значение прилагательного — «новый». Возможный смысл смены династии или режима не вносится в основной текст.
- source_word: עַל מִצְרָיִם
  choice: над Египтом
  rationale: Предлог עַל при обозначении царской власти выражает господство над страной. Формулировка сохраняет этот оттенок точнее, чем просто «в Египте».
- source_word: אֲשֶׁר לֹא יָדַע
  choice: который не знал
  rationale: Глагол ידע обычно означает «знать». В контексте возможен оттенок непризнания или нежелания считаться с Йосефом, однако буквальная формулировка сохраняет смысловую открытость.
- source_word: יוֹסֵף
  choice: Йосеф
  rationale: Передача «Йосеф» непосредственно отражает еврейскую форму имени, не заменяя её традиционной русской формой «Иосиф».
theological_decisions:
- issue: Следует ли подразумевать смену династии или сознательное пренебрежение Йосефом
  choice: Сохранить простую формулировку «новый царь… не знал Йосефа».
  alternative: «царь из другой династии… не признавал Йосефа»
  rationale: Сам стих прямо говорит лишь о новом царе и о том, что он не знал Йосефа. Возможные исторические и политические выводы не должны превращаться в утверждения основного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Инверсия «Над Египтом воцарился…» сохраняет акцент на царской власти над страной и остаётся понятной современному читателю.
