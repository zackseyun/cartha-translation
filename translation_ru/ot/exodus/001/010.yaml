  text: הָ֥בָ/ה נִֽתְחַכְּמָ֖ה ל֑/וֹ פֶּן יִרְבֶּ֗ה וְ/הָיָ֞ה כִּֽי תִקְרֶ֤אנָה מִלְחָמָה֙ וְ/נוֹסַ֤ף גַּם הוּא֙ עַל שֹׂ֣נְאֵ֔י/נוּ וְ/נִלְחַם בָּ֖/נוּ וְ/עָלָ֥ה מִן הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/010.yaml
  text: Come[a], let us deal shrewdly with them, lest they multiply, and if war breaks out[c][b], they too may join our enemies and fight against us and go up out of the land.
translation:
  language: ru
  text: «Давайте же поступим с ними[a] хитро[b], чтобы их не стало ещё больше. И если начнётся война, они присоединятся к нашим врагам, станут сражаться против нас и уйдут из страны[c]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с ним». Местоимение единственного числа относится к Израилю как к единому народу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поступим с ними мудро». Еврейское слово может обозначать мудрое или искусное действие; здесь контекст указывает на хитрый политический расчёт.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «поднимутся из страны». Вероятный смысл — «уйдут из страны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Давайте же
  rationale: Побудительное междометие призывает к немедленному совместному действию; «давайте же» естественно передаёт его силу в современном русском языке.
- source_word: נִתְחַכְּמָה
  choice: поступим … хитро
  rationale: Форма от חכם здесь обозначает расчётливую, изобретательную политику в отношении предполагаемой угрозы. Контекст придаёт слову зловещий оттенок, поэтому «хитро» уместнее положительно окрашенного «мудро».
- source_word: לוֹ
  choice: с ними
  rationale: В еврейском тексте стоит местоимение единственного числа, относящееся к Израилю как к единому народу. Русское множественное число согласуется с дальнейшим описанием людей и звучит естественно.
- source_word: פֶּן יִרְבֶּה
  choice: чтобы их не стало ещё больше
  rationale: פֶּן вводит нежелательный исход, которого хотят избежать, а רבה выражает численное умножение. Такая формулировка ясно и естественно передаёт смысл по-русски.
- source_word: וְהָיָה כִּי תִקְרֶאנָה מִלְחָמָה
  choice: И если начнётся война
  rationale: Оборот представляет войну как возможное будущее обстоятельство. «Начнётся война» — естественный современный эквивалент выражения о наступлении войны.
- source_word: וְנוֹסַף גַּם הוּא עַל שֹׂנְאֵינוּ
  choice: они присоединятся к нашим врагам
  rationale: Глагол יסף с על в данном контексте означает присоединение к одной из сторон. Множественное число передаёт коллективного референта — народ Израиля.
- source_word: וְנִלְחַם בָּנוּ
  choice: станут сражаться против нас
  rationale: Сочетание глагола со בְּ выражает враждебное вооружённое действие; русский оборот прямо передаёт этот смысл.
- source_word: וְעָלָה מִן הָאָרֶץ
  choice: уйдут из страны
  rationale: Буквально употреблён глагол «подниматься», однако в сочетании с «из страны» выражение может обозначать уход. В основном тексте выбран ясный русский эквивалент, а исходный образ сохранён в примечании.
theological_decisions:
- issue: Коллективное единственное число в отношении Израиля
  choice: Передать местоимениями и глаголами множественного числа
  alternative: 'Сохранить единственное число: «с ним… он присоединится…»'
  rationale: Еврейская грамматика представляет Израиль как единый народ, но русское единственное число без названного antecedента было бы неясным и могло бы ошибочно указывать на отдельного человека. Множественное число сохраняет коллективный смысл без доктринального уточнения.
- issue: Значение וְעָלָה מִן הָאָרֶץ
  choice: уйдут из страны
  alternative: поднимутся из страны
  rationale: Буквальный образ допускает неоднозначность, но в данном контексте естественно обозначает уход из страны. Неоднозначность и буквальная форма открыто указаны в примечании, а не устранены молча.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным регистром. Побуждение фараона передано естественно, без архаизма «дабы»; буквальные особенности и смысловая неоднозначность вынесены в краткие примечания.
