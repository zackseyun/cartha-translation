lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Русское «вот» естественно вводит перечень и передаёт указательную силу אֵלֶּה; начальный союз וְ связывает повествование с книгой Бытия, что отмечено в сноске.
- source_word: שְׁמוֹת
  choice: имена
  rationale: Прямое соответствие еврейскому существительному; сохраняет тематическую связь с еврейским названием книги.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыновей Израиля
  rationale: Передаёт именно сыновей, названных далее поимённо, не расширяя значение до всех потомков или народа в целом.
- source_word: הַבָּאִים מִצְרָיְמָה
  choice: пришедших в Египет
  rationale: Причастная конструкция естественна по-русски; «в Египет» передаёт направительный суффикс.
- source_word: אֵת יַעֲקֹב
  choice: вместе с Иаковом
  rationale: אֵת здесь выражает сопровождение, а не показатель прямого дополнения.
- source_word: אִישׁ וּבֵיתוֹ
  choice: каждый пришёл со своим домом
  rationale: אִישׁ имеет распределительное значение «каждый»; «дом» здесь означает семейно-домашнюю общность и сохраняет библейский образ без сведения его к зданию.
- source_word: בָּאוּ
  choice: пришёл
  rationale: Финальный глагол сохранён, хотя частично повторяет причастие; форма единственного числа согласована с распределительным «каждый» и воспроизводит заключительное возобновление мысли.
