base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/016.yaml
  text: And he said[a], “When you help the Hebrew women give birth and see them on the birthstool, if it is a son, then you shall put him to death; but if it is a daughter, then she shall live.”
translation:
  language: ru
  text: 'Он сказал: «Когда вы будете помогать еврейским женщинам при родах и увидите ребёнка на родильном сиденье[a]: если это сын, умертвите его, а если дочь — пусть живёт».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на двух камнях»; вероятно, имеется в виду родильное сиденье или другое приспособление для родов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַלֶּדְכֶן אֶת־הָעִבְרִיּוֹת
  choice: Когда вы будете помогать еврейским женщинам при родах
  rationale: Порода пиэль глагола ילד в обращении к повитухам обозначает содействие при родах. Эта формулировка естественна по-русски и не подменяет действие названием должности.
- source_word: וּרְאִיתֶן
  choice: и увидите ребёнка
  rationale: 'Глагол имеет обычное значение «увидеть». Слово «ребёнка» добавлено по смыслу для естественности русского синтаксиса: далее пол новорождённого обозначен словами «сын» и «дочь».'
- source_word: עַל־הָאָבְנָיִם
  choice: на родильном сиденье[a]
  rationale: Буквально выражение связано с парой камней, но в контексте родов, вероятно, обозначает приспособление или место для родов. Функциональный смысл дан в тексте, буквальная форма сохранена в сноске.
- source_word: אִם־בֵּן הוּא
  choice: если это сын
  rationale: «Сын» прямо соответствует בן и сохраняет параллель с «дочерью».
- source_word: וַהֲמִתֶּן אֹתוֹ
  choice: умертвите его
  rationale: Каузативная порода глагола מות означает «предать смерти, умертвить». Императив передан прямым повелением во втором лице множественного числа женского рода, которое в русском не маркируется отдельно.
- source_word: וְאִם־בַּת הִיא וָחָיָה
  choice: а если дочь — пусть живёт
  rationale: Контраст передан союзом «а». Форма וחיה означает, что девочке надлежит остаться в живых; «пусть живёт» естественно выражает разрешительно-повелительный смысл.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Приказ фараона передан прямо и сурово, без смягчения его смысла. Синтаксис сделан естественным для широкой аудитории; неоднозначный древнееврейский образ «двух камней» отмечен в сноске.
