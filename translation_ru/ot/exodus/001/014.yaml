base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/014.yaml
  text: And they made their lives bitter with hard labor in mortar and bricks and in every kind of field work—all their labor that they imposed on them with harshness[a].
translation:
  language: ru
  text: 'И делали их жизнь горькой тяжёлым трудом: работой с раствором и кирпичами и всевозможными полевыми работами — всем трудом, к которому их принуждали с жестокостью[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «безжалостно». Еврейское слово обозначает суровое, сокрушительное угнетение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרְרוּ אֶת חַיֵּיהֶם
  choice: делали их жизнь горькой
  rationale: Сохраняет еврейскую метафору от корня מרר и естественно передаёт сочетание с прямым дополнением «их жизнь».
- source_word: בַּעֲבֹדָה קָשָׁה
  choice: тяжёлым трудом
  rationale: Естественное русское выражение, передающее изнурительный характер подневольной работы.
- source_word: בְּחֹמֶר וּבִלְבֵנִים
  choice: над глиной и кирпичами
  rationale: חֹמֶר может обозначать глину либо раствор; в контексте изготовления кирпичей «глина» конкретна и исторически уместна, а множественное לְבֵנִים передано множественным «кирпичами».
- source_word: וּבְכָל עֲבֹדָה בַּשָּׂדֶה
  choice: и всякой работой в поле
  rationale: Сохраняет всеохватность כָל и не сужает полевые работы до конкретного занятия.
- source_word: אֵת כָּל עֲבֹדָתָם אֲשֶׁר עָבְדוּ בָהֶם
  choice: всяким трудом, к которому их принуждали
  rationale: Еврейская конструкция тяжеловесна и повторна; русский вариант сохраняет итоговое обобщение и ясно выражает, что египтяне заставляли израильтян трудиться.
- source_word: בְּפָרֶךְ
  choice: с жестокостью
  rationale: Передаёт суровый, беспощадный и угнетающий характер обращения; альтернативное усиленное значение отмечено в сноске.
