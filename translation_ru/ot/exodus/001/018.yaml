base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/018.yaml
  text: So the king of Egypt called for the midwives and said to them[a], “Why have you done this thing and let the children live?”
translation:
  language: ru
  text: 'И призвал царь Египта повитух и сказал им: «Почему вы это сделали и оставили детей в живых[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сохранили мальчиков в живых». Еврейский глагол здесь может означать «дать жить», «оставить в живых» или «сохранить жизнь»; из контекста ясно, что речь идёт о новорождённых мальчиках.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: призвал
  rationale: קרא с предлогом ל при обозначении лиц означает позвать или вызвать к себе; «призвал» естественно передаёт официальный вызов повитух царём.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: царь Египта
  rationale: Прямая передача еврейской сопряжённой конструкции в традиционном и понятном русском выражении.
- source_word: לַמְיַלְּדֹת
  choice: повитух
  rationale: Причастная форма от ילד обозначает женщин, помогающих при родах. «Повитухи» — точный и понятный в библейском повествовании русский эквивалент.
- source_word: וַיֹּאמֶר לָהֶן
  choice: и сказал им
  rationale: Сохраняет обычную формулу введения прямой речи без добавления оттенка приказа или упрёка сверх самого контекста.
- source_word: מַדּוּעַ
  choice: почему
  rationale: Естественная краткая передача вопросительного слова, обозначающего причину.
- source_word: עֲשִׂיתֶן הַדָּבָר הַזֶּה
  choice: вы это сделали
  rationale: Идиоматичная современная русская передача буквального «сделали это дело»; множественное число адресовано обеим повитухам.
- source_word: וַתְּחַיֶּיןָ
  choice: оставили ... в живых
  rationale: Каузативно-результативная форма от חיה в данном контексте означает позволить жить или сохранить в живых. Выбранная формулировка естественна по-русски и сохраняет обвинительный смысл вопроса.
- source_word: הַיְלָדִים
  choice: детей
  rationale: Существительное יְלָדִים само по себе означает «дети»; непосредственный контекст указывает на мальчиков, однако основной текст сохраняет лексическую широту исходного слова.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Союз «И» сохраняет связь с предыдущим эпизодом. «Повитухи» уместны в древнем контексте и общеупотребительны в русской библейской речи; синтаксис прямой речи сделан естественным для современного читателя.
