  text: The midwives said to Pharaoh[a], “Because the Hebrew women are not like the Egyptian women, for they are vigorous; before the midwife comes to them, they have given birth.”
translation:
  language: ru
  text: 'Повитухи сказали фараону: «Еврейские женщины не такие, как египтянки: они полны сил[a] и успевают родить ещё до прихода повитухи».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово можно также понять как «крепки», «полны жизненных сил» или «выносливы». Некоторые толкуют его более буквально — «подобны животным», однако такое значение здесь менее определённо.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: сказали
  rationale: Обычное повествовательное значение формы глагола אמר; вводит прямую речь без дополнительного смыслового оттенка.
- source_word: הַמְיַלְּדֹת
  choice: повитухи
  rationale: В данном контексте причастное существительное от ילד обозначает женщин, помогающих при родах. «Повитухи» — понятное и уместное для древнего повествования русское слово.
- source_word: אֶל־פַּרְעֹה
  choice: фараону
  rationale: Предлог אֶל обозначает адресата речи; русский дательный падеж передаёт это естественно.
- source_word: לֹא כַנָּשִׁים הַמִּצְרִיֹּת הָעִבְרִיֹּת
  choice: Еврейские женщины не такие, как египтянки
  rationale: Сохранено противопоставление двух групп, а безглагольное сравнение выражено естественной современной русской конструкцией.
- source_word: חָיוֹת
  choice: крепки
  rationale: В контексте речь, вероятнее всего, идёт о жизненной силе и способности быстро родить. «Крепки» звучит естественно по-русски, не устраняя при этом лексическую неоднозначность, отмеченную в сноске.
- source_word: בְּטֶרֶם תָּבוֹא אֲלֵהֶן הַמְיַלֶּדֶת
  choice: ещё до того, как к ним приходит повитуха
  rationale: בטרם обозначает предшествование во времени; единственное число «повитуха» понято обобщённо.
- source_word: וְיָלָדוּ
  choice: рожают
  rationale: В сочетании с «ещё до того, как» русский глагол настоящего времени естественно описывает регулярно завершающееся до прихода повитухи действие.
