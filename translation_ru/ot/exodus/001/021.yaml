  text: And because the midwives feared God[a], he made households for them.
translation:
  language: ru
  text: Поскольку повитухи боялись Бога, Он даровал им семьи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделал им дома». Здесь «дома» может означать семьи или родовые линии, а не здания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: И за то, что
  rationale: Оборот связывает богобоязненность повитух с последующим Божьим благодеянием. Русское «за то, что» естественно выражает причинно-вознаградительную связь, не воспроизводя древнееврейскую формулу буквально.
- source_word: יָרְאוּ
  choice: боялись
  rationale: Глагол ירא по отношению к Богу включает страх и благоговение. «Боялись Бога» сохраняет библейскую формулу и её смысловую ёмкость.
- source_word: הַמְיַלְּדֹת
  choice: повитухи
  rationale: Субстантивированное причастие обозначает уже упомянутых женщин, помогавших при родах. «Повитухи» — точный и понятный русский библейский термин.
- source_word: הָאֱלֹהִים
  choice: Бога
  rationale: Артикль в древнееврейском здесь указывает на единого Бога; по-русски естественно употребить имя без дополнительного определителя.
- source_word: וַיַּעַשׂ
  choice: Он даровал
  rationale: Буквально עשׂה означает «сделал», но с объектом «дома» выражение, вероятно, означает, что Бог устроил или дал им семьи. «Даровал» естественно передаёт действие Бога как благословение, а буквальная форма отражена в сноске.
- source_word: לָהֶם
  choice: им
  rationale: Местоименный суффикс мужского рода множественного числа по контексту относится к повитухам; древнееврейский допускает такую форму при отсылке к женской группе.
- source_word: בָּתִּים
  choice: семьи
  rationale: Буквально «дома», однако «дом» в древнееврейском может обозначать семью, род или домочадцев. В данном контексте речь, вероятнее всего, о даровании повитухам собственных семей.
theological_decisions:
- issue: Значение выражения וַיַּעַשׂ לָהֶם בָּתִּים
  choice: Бог даровал повитухам семьи.
  alternative: Бог сделал/устроил им дома.
  rationale: Выражение может обозначать учреждение семей или продолжение рода как Божье благословение, но буквальный образ физических домов грамматически возможен. Основной текст передаёт наиболее вероятный контекстуальный смысл, а сноска сохраняет подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Сохранена устойчивая формула «боялись Бога»; местоимение «Он» с прописной буквы ясно указывает на Бога. «Повитухи» выбрано вместо более описательного «акушерки», поскольку речь идёт о древнем общественном контексте.
