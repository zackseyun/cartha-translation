  language: ru
  text: И египтяне безжалостно[b] принуждали сынов Израиля[a] работать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян»; традиционно: «детей Израиля». Это выражение обозначает весь народ Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с жестокостью», «с суровостью» или «без пощады». Еврейское слово обозначает суровое, беспощадное обращение при принудительном труде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִדוּ
  choice: принуждали ... работать
  rationale: Каузативная порода глагола עבד означает «заставлять служить/работать». Такой перевод передаёт принудительный характер труда, не подменяя сам глагол более широким по смыслу «поработили».
- source_word: מִצְרַיִם
  choice: египтяне
  rationale: В данном контексте название обозначает египетский народ как действующее лицо, поэтому этноним естественнее буквального «Египет».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Перевод сохраняет родовую и общинную форму еврейского обозначения народа; по-русски это понятное библейское выражение, относящееся ко всему народу, а не только к мужчинам.
- source_word: בְּפָרֶךְ
  choice: безжалостно
  rationale: Слово обозначает суровую, сокрушительную жестокость при принудительном труде. Наречие естественно связывает эту характеристику с тем, как египтяне заставляли израильтян работать.
theological_decisions:
- issue: Передача общинного обозначения בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; детей Израиля
  rationale: Основной вариант сохраняет родословное и общинное звучание исходного выражения, не сводя его к одному лишь этнониму. Здесь «сыны» — обозначение всего народа.
translation_notes:
  register: Современный литературный русский язык. Формулировка сохраняет достоинство повествования и каузативный смысл еврейского глагола; «безжалостно принуждали ... работать» звучит естественнее буквального «заставляли служить с жестокостью».
