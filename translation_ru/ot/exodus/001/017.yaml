base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/017.yaml
  text: But the midwives feared God[a], and did not do as the king of Egypt had told them; rather, they let the children live.
translation:
  language: ru
  text: Но повитухи боялись Бога и не сделали того, что велел им царь Египта, а детей оставили в живых.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сохранили детям жизнь».'
    reason: Лексическая альтернатива для каузативной формы וַתְּחַיֶּיןָ.
lexical_decisions:
- source_word: וַתִּירֶאןָ
  choice: боялись
  rationale: Глагол ירא выражает страх и благоговение перед Богом. «Боялись Бога» сохраняет устойчивый библейский оборот и не сводит смысл лишь к уважению.
- source_word: הַמְיַלְּדֹת
  choice: повитухи
  rationale: Субстантивированное причастие от ילד обозначает женщин, помогающих при родах. «Повитухи» — точное и понятное в повествовательном контексте русское соответствие.
- source_word: אֶת הָאֱלֹהִים
  choice: Бога
  rationale: После глагола «бояться» сочетание означает «боялись Бога». Определённый артикль при אֱלֹהִים не требует отдельной передачи в русском языке.
- source_word: וְלֹא עָשׂוּ כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶן
  choice: не сделали того, что велел им
  rationale: Такая формулировка близко передаёт отрицание עשׂה и смысл דבר в контексте царского приказа, оставаясь естественной для современного русского языка.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: царь Египта
  rationale: Прямая и традиционная передача древнееврейской сопряжённой конструкции без добавочного толкования.
- source_word: וַתְּחַיֶּיןָ
  choice: оставляли ... в живых
  rationale: 'Пиэль от חיה имеет каузативное значение: дать жить или сохранить в живых. Несовершенный вид по-русски естественно описывает повторявшееся действие повитух.'
- source_word: הַיְלָדִים
  choice: детей
  rationale: Существительное יְלָדִים лексически шире, чем «мальчики», хотя ближайший контекст уточняет, что речь идёт о младенцах мужского пола. «Детей» сохраняет формулировку данного стиха.
theological_decisions:
- issue: Передача אֱלֹהִים в выражении о страхе перед Богом
  choice: Бога
  alternative: Бога Израиля
  rationale: В повествовательном контексте имеется в виду истинный Бог, однако добавление «Израиля» отсутствует в тексте. Простое «Бога» сохраняет и референцию, и лаконичность оригинала.
- issue: Характер страха повитух перед Богом
  choice: боялись Бога
  alternative: благоговели перед Богом
  rationale: «Боялись» сохраняет смысловую широту ירא — реальный страх и благоговение — не разрешая эту напряжённость в пользу одного оттенка.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. «Повитухи» точно называет участниц повествования и остаётся общеупотребительным словом; синтаксис сделан ясным без ослабления противопоставления между Божьим авторитетом и приказом царя.
