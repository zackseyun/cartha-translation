base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/022.yaml
  text: Then Pharaoh commanded all his people[a], saying, “Every son who is born you must throw into the Nile[c][b], but every daughter you must let live.”
translation:
  language: ru
  text: 'Тогда фараон повелел всему своему народу: «Каждого новорождённого сына[a] бросайте в Нил[b], а[c] каждую дочь оставляйте в живых».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждого новорождённого мальчика». Еврейское слово буквально означает «сын», но здесь относится к ребёнку мужского пола.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в реку». В книге Исход это слово обычно обозначает Нил.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и». Союз «а» передаёт противопоставление двух частей указа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: повелел
  rationale: Глагол обозначает властное распоряжение; «повелел» естественно передаёт царский приказ и сохраняет достоинство повествовательного стиля.
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Общепринятое русское обозначение египетского правителя.
- source_word: לְכָל עַמּוֹ
  choice: всему своему народу
  rationale: Прямо передаёт עַם и не сужает адресатов до чиновников или подданных определённого сословия.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: В современном русском отдельное «говоря» здесь избыточно; синтаксическое оформление прямой речи естественно выполняет функцию еврейского вводного оборота.
- source_word: כָּל הַבֵּן הַיִּלּוֹד
  choice: каждого родившегося сына
  rationale: Сохраняет буквальное «сына» и пассивное значение причастия от ילד, не добавляя отсутствующего в стихе уточнения «еврейского».
- source_word: הַיְאֹרָה
  choice: в Нил
  rationale: В контексте Исхода יְאֹר обозначает Нил; направительный суффикс -ה передан предлогом «в» при глаголе движения.
- source_word: תַּשְׁלִיכֻהוּ
  choice: бросайте
  rationale: Форма обращена ко множеству адресатов и выражает приказ; русский императив непосредственно передаёт эту силу, а объект понятен из конструкции «каждого ... сына».
- source_word: וְכָל הַבַּת
  choice: а каждую дочь
  rationale: Союз «а» естественно выражает противопоставление между судьбой сыновей и дочерей, оставаясь ближе к простому еврейскому וְ, чем более резкое «но».
- source_word: תְּחַיּוּן
  choice: оставляйте в живых
  rationale: Порода Piel глагола חיה здесь означает сохранять жизнь или позволять жить; данная формулировка ясна и идиоматична по-русски.
theological_decisions:
- issue: К кому относится приказ об уничтожении сыновей
  choice: Не добавлять определение «еврейского» или «израильского»
  alternative: «Каждого родившегося еврейского мальчика»
  rationale: Ближайший контекст связывает указ с израильтянами, однако в самом еврейском тексте стиха сказано лишь «каждого родившегося сына». Добавление этнического определения устранило бы формальную широту и напряжение текста.
translation_notes:
  register: Современный литературный русский с краткой, властной формой прямой речи. Императивы во множественном числе сохраняют обращение ко всему народу. Формулировка не уточняет этническую принадлежность сыновей сверх явно сказанного в исходном стихе.
