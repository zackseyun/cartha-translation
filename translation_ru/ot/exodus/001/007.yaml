base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/007.yaml
  text: But the sons of Israel were fruitful and swarmed and multiplied and became exceedingly strong[b][a], so that the land was filled with them.
translation:
  language: ru
  text: А сыны Израиля плодились, роились[a], умножались и стали чрезвычайно сильными, так что земля наполнилась ими[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кишели»; еврейский глагол передаёт образ роющегося, стремительно размножающегося множества.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и земля наполнилась ими».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: А сыны Израиля
  rationale: «Сыны Израиля» сохраняет родовое и национальное выражение оригинала. Союз «а» естественно передаёт как связь с предыдущим повествованием, так и контраст со смертью прежнего поколения.
- source_word: פָּרוּ
  choice: были плодовиты
  rationale: Сохраняет прямой смысл плодородия и возможный отзвук языка благословения в Бытии.
- source_word: וַיִּשְׁרְצוּ
  choice: кишели
  rationale: Глагол שׁרץ рисует образ бурного, изобильного размножения, буквально роения или кишения; «кишели» передаёт эту выразительность без смягчения.
- source_word: וַיִּרְבּוּ
  choice: умножались
  rationale: Передаёт становление многочисленными и сохраняет традиционный библейский отзвук формулы благословения.
- source_word: וַיַּעַצְמוּ בִּמְאֹד מְאֹד
  choice: становились чрезвычайно сильными
  rationale: עָצַם в данном контексте означает набирать силу; удвоенное מְאֹד резко усиливает степень. Формулировка не сводит значение только к численности.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֹתָם
  choice: так что земля наполнилась ими
  rationale: Сохраняет землю в роли грамматического субъекта и естественно выражает итог предшествующего роста; сноска отмечает возможность простой последовательной связи.
theological_decisions:
- issue: Возможный отзвук благословения творения в словах о плодовитости и умножении
  choice: Сохранить последовательность «были плодовиты… умножались», не поясняя аллюзию в основном тексте
  alternative: Добавить явное указание на исполнение благословения
  rationale: Лексика оригинала позволяет услышать связь с Быт 1, но сам стих её не разъясняет; перевод сохраняет отзвук, не добавляя богословского вывода.
- issue: Сила или только многочисленность в וַיַּעַצְמוּ
  choice: «становились чрезвычайно сильными»
  alternative: «становились чрезвычайно многочисленными»
  rationale: Корневое значение связано с силой и мощью, хотя в контексте она может включать численное могущество. Более широкое «сильными» сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Слово «кишели» намеренно сохраняет резкий телесный образ еврейского глагола; «сыны Израиля» удерживает родовую формулу оригинала. Все сноски обозначены в основном тексте.
