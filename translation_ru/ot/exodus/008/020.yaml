- from: 'И сделал Яхве так: огромный рой[a] налетел на дом фараона и на дома его слуг; по всей земле Египетской земля была разорена этим роем.'
  to: 'Яхве сделал так: огромный рой[a] пришёл в дом фараона и в дома его слуг; по всей земле Египта — земля была разорена этим роем.'
  rationale: 'Заменено образное «налетел на» на нейтральное «пришёл в», чтобы передать וַיָּבֹא и направительное значение форм «в дом». Сноска уточнена: она сохраняет неопределённость עָרֹב, не вводя не подтверждённую текстом множественность роёв.'
