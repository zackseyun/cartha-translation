base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/020.yaml
  text: And Yahweh did so[a], and a heavy swarm came into Pharaoh’s house and into his servants’ houses, and throughout all the land of Egypt the land was ruined because of the swarm.
translation:
  language: ru
  text: 'Яхве сделал так: огромный рой[a] пришёл в дом фараона и в дома его слуг; по всей земле Египта — земля была разорена этим роем.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великий рой». Еврейское слово может обозначать огромное скопление насекомых; традиционно его понимают как мух.'
    reason: Лексическое значение עָרֹב и точный вид насекомых остаются не вполне определёнными.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וַיַּעַשׂ ... כֵּן
  choice: И сделал Яхве так
  rationale: Естественно передаёт повествовательную формулу и указывает, что Яхве исполнил ранее объявленное.
- source_word: עָרֹב
  choice: рой
  rationale: Точный состав нашествия неизвестен; слово «рой» сохраняет неопределённость и не сужает значение до мух.
- source_word: כָּבֵד
  choice: огромный
  rationale: Буквально прилагательное означает «тяжёлый», но применительно к рою естественно выражает его чрезвычайную многочисленность и силу.
- source_word: וַיָּבֹא
  choice: налетел
  rationale: В контексте нашествия насекомых естественно передаёт прибытие и проникновение роя, обозначенное последующими направлениями.
- source_word: בֵּיתָה פַרְעֹה
  choice: на дом фараона
  rationale: Сохраняет слово «дом», не вводя более узкого толкования «дворец»; русский глагол «налетел» естественно управляет предлогом «на».
- source_word: וּבֵית עֲבָדָיו
  choice: на дома его слуг
  rationale: Единственное собирательно-распределительное «дом» при множественном «слуг» естественно передано по-русски множественным числом; «слуги» не сужает значение до чиновников.
- source_word: תִּשָּׁחֵת הָאָרֶץ
  choice: земля была разорена
  rationale: Передаёт причинённое земле разорение, не утверждая её полного уничтожения.
- source_word: מִפְּנֵי הֶעָרֹב
  choice: этим роем
  rationale: Творительный падеж естественно выражает причину разорения в современном русском языке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Определение состава עָרֹב
  choice: рой без указания вида существ
  alternative: рой мух
  rationale: Само еврейское слово не позволяет уверенно определить вид; традиционное понимание как мух вынесено в примечание, чтобы не устранять подлинную лексическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной интонацией. Синтаксис сохраняет последовательность и нарастание еврейского рассказа; точный вид насекомых намеренно не уточняется.
