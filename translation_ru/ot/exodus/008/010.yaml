lexical_decisions:
- source_word: וַיִּצְבְּרוּ
  choice: складывали
  rationale: Глагол צבר обозначает собирание и складывание в массу или груду; «складывали» естественно передаёт конкретное действие.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение прямого дополнения относится к лягушкам из непосредственного контекста.
- source_word: חֳמָרִם חֳמָרִם
  choice: в бесчисленные груды
  rationale: Повтор существительного имеет усилительно-распределительное значение и указывает на множество отдельных груд; выбранная формулировка естественна по-русски, а форма оригинала отмечена в сноске.
- source_word: וַתִּבְאַשׁ
  choice: наполнилась смрадом
  rationale: Глагол באש означает издавать дурной запах, смердеть; эта формулировка сохраняет резкую чувственную конкретность оригинала и литературное достоинство.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Здесь אֶרֶץ обозначает землю, охваченную бедствием, а не весь мир.
