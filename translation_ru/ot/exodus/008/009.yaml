    rationale: Русское «вымерли» обычно относится к вымиранию вида либо популяции и может создать впечатление полного исчезновения жаб как таковых. Еврейское וַיָּמֻתוּ сообщает о том, что жабы умерли; «погибли» точнее и естественнее в данном контексте.
  - severity: low
    issue: Неполный оборот «сделал Господь по слову Моисея»
    rationale: Формально он понятен, но в современном русском глагол «сделал» здесь обычно требует уточнения. «Сделал так, как сказал Моисей» передаёт כִּדְבַר מֹשֶׁה и звучит естественно.
  revised_text: И Господь сделал так, как сказал Моисей, и жабы погибли в домах, во дворах и на полях.
  revised_footnotes: []
