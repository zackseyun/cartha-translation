  text: И Господь сделал так, как сказал Моисей, и жабы погибли в домах, во дворах и на полях.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона; сохраняет достоинство библейского регистра без спорной реконструкции произношения.
- source_word: כִּדְבַר מֹשֶׁה
  choice: по слову Моисея
  rationale: Формально близкая и естественная русская передача со значением исполнения сказанного Моисеем.
- source_word: וַיָּמֻתוּ הַצְפַרְדְּעִים
  choice: жабы вымерли
  rationale: Глагол «вымерли» естественно передаёт массовую гибель животных; «жабы» соответствует традиционной русской номинации этой казни.
- source_word: מִן הַבָּתִּים מִן הַחֲצֵרֹת וּמִן הַשָּׂדֹת
  choice: в домах, во дворах и на полях
  rationale: Еврейское מִן при глаголе смерти указывает на места, откуда исчезли погибшие жабы; буквальное «из домов» по-русски могло бы ошибочно означать, что они умерли после выхода наружу.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: «Господь» следует укоренённой русской библейской традиции и не привносит конфессионально маркированной реконструкции произношения.
