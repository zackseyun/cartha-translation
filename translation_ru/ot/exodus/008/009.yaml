  source_fidelity: 'Смысл передан в целом верно: Господь действует в соответствии со словом Моисея, а жабы гибнут в домах, дворах и полях. Однако «вымерли» обычно означает исчезновение вида или популяции, а не массовую гибель жаб в указанных местах; оно также несколько ослабляет прямое значение וַיָּמֻתוּ («умерли/погибли»).'
  naturalness: «И сделал Господь по слову Моисея» возможно, но без дополнения звучит менее естественно в современном литературном русском. Оборот «сделал так, как сказал Моисей» ясен и сохраняет смысл исполнения произнесённого Моисеем. «Погибли» нейтрально и литературно.
  terminology: «Господь» для יהוה и «жабы» для הַצְפַרְדְּעִים допустимы в традиционном русском библейском регистре. Замена «вымерли» на «погибли» не затрагивает терминологическое решение о жабах.
  issues:
