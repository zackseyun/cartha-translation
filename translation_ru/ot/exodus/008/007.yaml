    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרוּ
  choice: И уйдут
  rationale: Глагол סוּר означает удалиться, отойти, уйти. В контексте прекращения казни естественное русское «уйдут» передаёт исчезновение лягушек из названных мест, не уточняя способ их удаления.
- source_word: הַצְפַרְדְּעִים
  choice: лягушки
  rationale: Прямое соответствие определённому существительному во множественном числе; определённость в русском языке ясна из контекста.
- source_word: מִמְּךָ
  choice: от тебя
  rationale: Предлог מִן с суффиксом второго лица мужского рода единственного числа буквально и естественно передаётся как «от тебя».
- source_word: וּמִבָּתֶּיךָ
  choice: от твоих домов
  rationale: Сохранено множественное число еврейского בָּתִּים и обращение к фараону в единственном числе.
- source_word: וּמֵעֲבָדֶיךָ
  choice: от твоих слуг
  rationale: עֶבֶד допускает значения «слуга», «раб» и «служащий». Здесь «слуги» сохраняет широту обозначения людей, находящихся в подчинении фараона, не сужая его до чиновников и не подчёркивая рабский статус без необходимости.
- source_word: וּמֵעַמֶּךָ
  choice: от твоего народа
  rationale: עַם обозначает народ или население, подвластное фараону; «народ» — точное и привычное соответствие.
- source_word: רַק
  choice: только
  rationale: 'Частица вводит ограничение: единственным местом, где лягушки останутся, будет Нил.'
- source_word: בַּיְאֹר
  choice: в Ниле
  rationale: יְאֹר может обозначать реку, но в повествовании Исхода обычно относится конкретно к Нилу; собственное название обеспечивает контекстуальную ясность.
- source_word: תִּשָּׁאַרְנָה
  choice: останутся они
  rationale: Форма нифаля от שׁאר выражает значение «остаться, быть оставленным». «Останутся» естественно передаёт смысл, а порядок «останутся они только в Ниле» сохраняет смысловое выделение исключения без неестественной русской инверсии.
