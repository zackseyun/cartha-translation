base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/008.yaml
  text: So Moses and Aaron went out from Pharaoh[a], and Moses cried out to Yahweh concerning the frogs that he had set upon Pharaoh.
translation:
  language: ru
  text: И вышли Моисей и Аарон от фараона, и Моисей воззвал к Яхве о лягушках, которых Он навёл на фараона[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которых Он поставил для фараона»; возможно также: «которых Он обратил против фараона».'
    reason: Сочетание שׂים с предлогом לְ допускает несколько близких способов передачи; «навёл на» естественно выражает смысл в контексте казни.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышли
  rationale: Глагол יצא обозначает удаление от фараона; множественное число естественно согласует сказуемое с составным подлежащим «Моисей и Аарон».
- source_word: מֵעִם פַּרְעֹה
  choice: от фараона
  rationale: Кратко и естественно передаёт уход из присутствия фараона, не утяжеляя фразу буквальным «от лица фараона».
- source_word: וַיִּצְעַק
  choice: воззвал
  rationale: Передаёт напряжённое обращение к Богу, присущее צעק, и сохраняет dignified biblical register без сведения действия к нейтральному «помолился».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: עַל דְּבַר
  choice: о
  rationale: В данном контексте идиома означает предмет обращения — Моисей взывает по поводу лягушек.
- source_word: הַצְפַרְדְּעִים
  choice: лягушках
  rationale: Прямой современный эквивалент названия животных, составляющих казнь.
- source_word: אֲשֶׁר שָׂם לְפַרְעֹה
  choice: которых Он навёл на фараона
  rationale: «Навёл на» естественно для контекста бедствия и сохраняет основную идею שׂים — поместить или обратить нечто на кого-либо. Местоимение «Он» по контексту относится к Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя, поэтому оно сохраняется в транслитерации.
- issue: Субъект глагола שָׂם
  choice: 'Яхве: «Он навёл»'
  alternative: Моисей либо неопределённый субъект
  rationale: Ближайший контекст обращения Моисея и повествование о казни указывают на Яхве как на совершившего это действие, хотя в самой глагольной форме субъект отдельно не назван.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Союз «И» в начале сохраняет повествовательную связность еврейского текста; «воззвал» передаёт силу обращения без архаической синтаксической тяжеловесности.
