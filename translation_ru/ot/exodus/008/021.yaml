  yaml_path: translation/ot/exodus/008/021.yaml
  text: Then Pharaoh called Moses and Aaron and said[a], “Go, sacrifice to your God in the land.”
translation:
  language: ru
  text: 'Тогда фараон призвал Моисея и Аарона и сказал: «Пойдите, принесите жертвы вашему Богу в этой стране»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принесите жертвы вашему Богу в пределах страны», то есть в Египте.'
    reason: 'Лексико-контекстуальная альтернатива для בָּאָרֶץ: буквально «в земле/стране»; по контексту речь идёт о Египте и о совершении жертвоприношения внутри его пределов.'
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: призвал
  rationale: В данном повествовательном контексте קרא означает позвать к себе; «призвал» естественно передаёт действие, не придавая ему излишне официального оттенка.
- source_word: פַרְעֹה
  choice: фараон
  rationale: Общепринятое русское обозначение египетского правителя.
- source_word: אֶל מֹשֶׁה וּלְאַהֲרֹן
  choice: Моисея и Аарона
  rationale: При глаголе «призвал» русский винительный падеж естественно передаёт адресатов действия, выраженных в еврейском предлогом אֶל и לְ.
- source_word: וַיֹּאמֶר
  choice: и сказал
  rationale: Обычная передача повествовательной формы אמר; адресаты ясны из предыдущей части предложения.
- source_word: לְכוּ
  choice: Пойдите
  rationale: Форма множественного числа повелительного наклонения הלך; «пойдите» соответствует прямому разрешению фараона.
- source_word: זִבְחוּ
  choice: принесите жертвы
  rationale: Глагол זבח обозначает совершение жертвоприношения; эта формулировка яснее и естественнее современного русского глагольного «жертвуйте».
- source_word: לֵאלֹהֵיכֶם
  choice: вашему Богу
  rationale: Предлог לְ обозначает адресата жертвоприношения; дательный падеж естественно передаёт это отношение по-русски.
- source_word: בָּאָרֶץ
  choice: здесь, в этой земле
  rationale: Буквально — «в земле»; в контексте фараон разрешает жертвоприношение внутри Египта. Указательное уточнение естественно выражает контекст, сохраняя образ «земли».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской повествовательной интонацией. «Принесите жертвы» выбрано вместо менее естественного «жертвуйте»; «здесь, в этой земле» ясно передаёт ограничение фараона, не подменяя исходный образ прямым названием Египта.
