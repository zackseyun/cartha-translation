base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/015.yaml
  text: Then the magicians said to Pharaoh[a], “This is the finger of God.” But Pharaoh’s heart was hardened, and he did not listen to them[c][b], just as Yahweh had spoken.
translation:
  language: ru
  text: 'Тогда чародеи сказали фараону: «Это перст Бога[a]». Но сердце фараона ожесточилось[b], и он не послушал их, как сказал Яхве[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Перст Бога» — образное выражение, указывающее на непосредственное действие Божьей силы.
    reason: cultural_note
  - marker: b
    text: 'Возможный перевод: «сердце фараона стало твёрдым». В этой фразе еврейский текст прямо не называет того, кто вызвал ожесточение.'
    reason: lexical_alternative
  - marker: c
    text: Яхве — личное имя Бога, переданное еврейскими согласными יהוה (ЙХВХ); традиционно переводится как «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: чародеи
  rationale: Обозначает египетских ритуальных специалистов при фараоне. «Чародеи» — ясное и уместное в библейском повествовании русское соответствие, не сужающее их роль до сценических фокусников.
- source_word: אֶצְבַּע אֱלֹהִים הִוא
  choice: Это перст Бога
  rationale: Сохраняет образное выражение исходного текста, указывающее на непосредственное действие Божьей силы. «Перст» здесь звучит торжественно и остаётся понятным в устойчивом выражении.
- source_word: אֱלֹהִים
  choice: Бога
  rationale: В данном повествовательном контексте наиболее естественно понимать אֱלֹהִים как единственного Бога, хотя сама форма слова в иных контекстах допускает другие значения.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: сердце фараона ожесточилось
  rationale: Передаёт наступившее состояние непреклонности, не вводя явно названного виновника ожесточения, которого в этой клаузе еврейский текст не указывает.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: и он не послушал их
  rationale: Естественно передаёт שׁמע с אֶל в значении «слушать, внимать»; местоимение «он» ясно отсылает к фараону.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: как и говорил Яхве
  rationale: Формула отсылает к ранее высказанному слову Яхве; русское несовершенное прошедшее естественно передаёт предшествующее пророческое заявление.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя и отличает его от титула.
- issue: Причинность ожесточения сердца фараона
  choice: сердце фараона ожесточилось
  alternative: сердце фараона было ожесточено; фараон ожесточил своё сердце
  rationale: Еврейская фраза в этой клаузе не называет действующее лицо. Возвратно-результативная русская конструкция сохраняет эту неопределённость и не разрешает богословское напряжение за текст.
- issue: Смысл выражения אֶצְבַּע אֱלֹהִים
  choice: перст Бога
  alternative: сила Бога; рука Бога
  rationale: Буквальный образ важен для повествования и означает непосредственное проявление Божьей силы; заменять его толкованием в основном тексте не требуется.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Перст» сохранён как узнаваемый устойчивый образ; синтаксис сделан ясным для обычного читателя. Все примечания привязаны к маркерам в основном тексте.
