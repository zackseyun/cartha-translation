base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/005.yaml
  text: 'And Moses said to Pharaoh[a], “Have this honor over me: when shall I plead for you, for your servants, and for your people, to cut off the frogs from you and from your houses? Only in the Nile shall they remain.”'
translation:
  language: ru
  text: 'И сказал Моисей фараону: «Ты сам назначь[a], когда мне молиться за тебя, за твоих слуг и за твой народ, чтобы лягушки были удалены от тебя и из твоих домов. Только в Ниле они останутся».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможны значения: «похвались надо мной» или «возвысься надо мной». Еврейское выражение трудно для однозначного перевода; здесь Моисей предоставляет фараону право самому назначить время молитвы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְפָּאֵר עָלַי
  choice: Назначь мне сам
  rationale: Трудная еврейская идиома буквально связана с тем, чтобы «похвалиться» или «возвыситься» над Моисеем, но в контексте означает предоставленное фараону право самому назвать срок. В основном тексте передан контекстуальный смысл, а буквальная образность сохранена в примечании.
- source_word: לְמָתַי
  choice: когда
  rationale: Вопросительное выражение вводит срок, который должен выбрать фараон; простое «когда» естественно по-русски.
- source_word: אַעְתִּיר
  choice: молиться
  rationale: Глагол обозначает настойчивое прошение, обращённое к Богу. «Молиться» ясно и естественно передаёт смысл, не превращая его в специальный богословский термин.
- source_word: לְךָ וְלַעֲבָדֶיךָ וּלְעַמְּךָ
  choice: за тебя, за твоих слуг и за твой народ
  rationale: Повтор предлога передан для ясности и для сохранения трёхчастного охвата ходатайства.
- source_word: לְהַכְרִית
  choice: чтобы ... были истреблены
  rationale: כרת буквально значит «отсечь», а здесь — полностью устранить лягушек. Пассивная конструкция сохраняет подразумеваемого, но прямо не названного в этой фразе исполнителя.
- source_word: הַצֲפַרְדְּעִים
  choice: лягушки
  rationale: Прямой современный эквивалент названия животных, ставших бедствием.
- source_word: מִמְּךָ וּמִבָּתֶּיךָ
  choice: у тебя и в твоих домах
  rationale: Так по-русски естественно обозначается устранение лягушек от самого фараона и из его домов; различие между ним и домами сохранено.
- source_word: רַק
  choice: Только
  rationale: Слово вводит единственное исключение — Нил.
- source_word: בַּיְאֹר
  choice: в Ниле
  rationale: В повествовании Исхода יְאֹר обозначает именно Нил, а не неопределённую реку.
- source_word: תִּשָּׁאַרְנָה
  choice: они останутся
  rationale: Форма выражает продолжение пребывания или сохранение остатка; порядок слов подчёркивает, что единственным местом останется Нил.
theological_decisions:
- issue: Кто истребит лягушек
  choice: Сохранена пассивная формулировка «были истреблены»
  alternative: «чтобы Бог истребил лягушек»
  rationale: В контексте молитва обращена к Богу, однако в самом еврейском предложении действующее лицо при инфинитиве прямо не названо; перевод не добавляет его в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «И сказал» сохраняет повествовательную связность оригинала; обращение Моисея передано ясно для обычного читателя, а необычная еврейская идиома вынесена в примечание.
