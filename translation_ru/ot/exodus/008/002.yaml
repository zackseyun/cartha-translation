  yaml_path: translation/ot/exodus/008/002.yaml
  text: So Aaron stretched out his hand over the waters of Egypt[a], and the frogs came up and covered the land of Egypt.
translation:
  language: ru
  text: И простёр Аарон руку над водами Египта, и поднялись лягушки[a] и покрыли землю Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лягушка». В еврейском тексте употреблено единственное число, вероятно в собирательном значении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: простёр
  rationale: Глагол נטה в контексте знамений означает протянуть или простереть руку; «простёр» точно передаёт властный жест и сохраняет достоинство повествовательного стиля.
- source_word: יָדוֹ
  choice: руку
  rationale: Еврейский текст прямо называет руку, сохраняя конкретный образ совершённого Аароном жеста.
- source_word: עַל
  choice: над
  rationale: Предлог выражает пространственное положение руки относительно египетских вод; «над» естественно и точно в данном контексте.
- source_word: מֵימֵי מִצְרַיִם
  choice: водами Египта
  rationale: Форма множественного числа обозначает совокупность вод Египта; русское «воды Египта» сохраняет это значение.
- source_word: וַתַּעַל
  choice: поднялись
  rationale: Глагол עלה описывает выход лягушек из воды наверх, на сушу; «поднялись» передаёт направление движения без лишнего уточнения.
- source_word: הַצְּפַרְדֵּעַ
  choice: лягушки
  rationale: Существительное формально стоит в единственном числе с артиклем, но, вероятнее всего, употреблено собирательно; в естественном русском это значение передаётся множественным числом.
- source_word: וַתְּכַס
  choice: покрыли
  rationale: Глагол כסה прямо означает «покрывать»; выбранный вариант точен и не добавляет образности, отсутствующей в источнике.
- source_word: אֶרֶץ מִצְרָיִם
  choice: землю Египта
  rationale: Здесь אֶרֶץ обозначает территорию Египта; «земля Египта» точно и естественно передаёт географический смысл.
