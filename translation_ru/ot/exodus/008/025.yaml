  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤א מֵֽ/עִמָּ/ךְ֙ וְ/הַעְתַּרְתִּ֣י אֶל יְהוָ֔ה וְ/סָ֣ר הֶ/עָרֹ֗ב מִ/פַּרְעֹ֛ה מֵ/עֲבָדָ֥י/ו וּ/מֵ/עַמּ֖/וֹ מָחָ֑ר רַ֗ק אַל יֹסֵ֤ף פַּרְעֹה֙ הָתֵ֔ל לְ/בִלְתִּי֙ שַׁלַּ֣ח אֶת הָ/עָ֔ם לִ/זְבֹּ֖חַ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/025.yaml
  text: And Moses said[a], “Look, I am going out from you, and I will plead with Yahweh, and the swarm will depart from Pharaoh, from his servants, and from his people tomorrow. Only let Pharaoh not continue to mock by not letting the people go to sacrifice to Yahweh.”
translation:
  language: ru
  text: 'И сказал Моисей: «Вот, я ухожу от тебя и буду молить Яхве, и завтра рой[a] удалится от фараона, от его слуг и от его народа. Только пусть фараон больше не обманывает, отказываясь отпустить народ принести жертвы Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово עָרֹב может обозначать рой мух или других роящихся существ; точный смысл неизвестен.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт привлекающую внимание частицу естественным и литературным русским словом.
- source_word: יוֹצֵא מֵעִמָּךְ
  choice: я ухожу от тебя
  rationale: Естественно передаёт конкретное удаление Моисея от фараона без ненужного расширения «из твоего присутствия».
- source_word: וְהַעְתַּרְתִּי אֶל יְהוָה
  choice: буду молить Яхве
  rationale: Глагол עתר здесь обозначает настойчивое ходатайство; «молить» сохраняет его усиленный характер.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное заветное имя, а не заменяет его титулом.
- source_word: וְסָר
  choice: удалится
  rationale: Передаёт непереходное значение «отойти, исчезнуть прочь» при подлежащем «рой».
- source_word: הֶעָרֹב
  choice: рой
  rationale: Сохраняет общее обозначение скопления летающих или иных роящихся существ, не уточняя спорный биологический референт.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: от фараона, от его слуг и от его народа
  rationale: Сохраняет повтор предлога, подчёркивающий полный охват бедствия.
- source_word: מָחָר
  choice: завтра
  rationale: Прямое и естественное соответствие временному наречию.
- source_word: רַק
  choice: Только
  rationale: Кратко вводит ограничение и предостережение Моисея.
- source_word: אַל יֹסֵף ... הָתֵל
  choice: пусть фараон больше не обманывает
  rationale: Конструкция יסף с הָתֵל указывает на повторение или продолжение обманного поведения; «больше не обманывает» естественно выражает это по-русски.
- source_word: לְבִלְתִּי שַׁלַּח
  choice: отказываясь отпустить
  rationale: Передаёт содержание обмана фараона — фактический отказ отпустить народ.
- source_word: לִזְבֹּחַ
  choice: принести жертвы
  rationale: Сохраняет культовую конкретность глагола זבח и звучит естественнее, чем менее обычное здесь «жертвоприносить».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя.
- issue: Точное определение עָרֹב
  choice: рой
  alternative: рой мух; смешанный рой зверей или насекомых
  rationale: Точный зоологический референт слова неясен, поэтому общий перевод сохраняет присущую исходному тексту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет последовательность речи Моисея и повтор предлога «от», но избегает архаизмов.
