base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/027.yaml
  text: And Yahweh did according to Moses' word[a], and removed the swarm from Pharaoh, from his servants, and from his people; not one remained.
translation:
  language: ru
  text: И Яхве сделал по слову Моисея и удалил рой[a] от фараона, от его слуг и от его народа; не осталось ни одного.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рой мух». Еврейское עָרֹב обозначает нашествие роем насекомых, но само слово не уточняет их вид.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Прямо передаёт широкое значение глагола עשה и сохраняет еврейский оборот «сделал по слову».
- source_word: כִּדְבַר מֹשֶׁה
  choice: по слову Моисея
  rationale: Естественный русский оборот, сохраняющий существительное דָּבָר («слово, сказанное»), а не сводящий его к пересказу «как сказал Моисей».
- source_word: וַיָּסַר
  choice: удалил
  rationale: Каузативная форма глагола סור здесь означает устранение или удаление бедствия.
- source_word: הֶעָרֹב
  choice: рой
  rationale: Кратко передаёт собирательное обозначение нашествия, не уточняя вид существ, которого само еврейское слово однозначно не называет.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: от фараона, от его слуг и от его народа
  rationale: Повтор предлога «от» отражает трёхкратное употребление מִן и подчёркивает полное удаление бедствия от каждой названной группы.
- source_word: לֹא נִשְׁאַר אֶחָד
  choice: не осталось ни одного
  rationale: Сохраняет отрицание и усилительное единственное אֶחָד; подразумеваемый член роя естественно восстанавливается из контекста.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога. Форма «Яхве» передаёт его принятую научную реконструкцию, не подменяя имя титулом и не вводя более позднюю форму «Иегова».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Повтор «от» сохранён ради акцента исходного текста; двоеточие естественно связывает общее действие Яхве с его конкретным результатом.
