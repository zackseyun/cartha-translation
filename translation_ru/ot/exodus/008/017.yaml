  text: כִּ֣י אִם אֵינְ/ךָ֮ מְשַׁלֵּ֣חַ אֶת עַמִּ/י֒ הִנְ/נִי֩ מַשְׁלִ֨יחַ בְּ/ךָ֜ וּ/בַ/עֲבָדֶ֧י/ךָ וּֽ/בְ/עַמְּ/ךָ֛ וּ/בְ/בָתֶּ֖י/ךָ אֶת הֶ/עָרֹ֑ב וּ/מָ֨לְא֜וּ בָּתֵּ֤י מִצְרַ֨יִם֙ אֶת הֶ֣/עָרֹ֔ב וְ/גַ֥ם הָ/אֲדָמָ֖ה אֲשֶׁר הֵ֥ם עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/017.yaml
  text: For if you do not let my people go[a], behold, I am sending the swarm upon you, upon your servants, upon your people, and into your houses. The houses of Egypt will be filled with the swarm[b], and also the ground on which they are.
translation:
  language: ru
  text: Ибо если ты не отпустишь Мой народ, то вот, Я пошлю рой[a] на тебя, на твоих слуг, на твой народ и в твои дома. Дома египтян наполнятся роем, и даже земля[b], на которой стоят эти дома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скопище насекомых»; традиционно понимается как «мухи». Точный вид или состав роя, обозначенного еврейским словом עָרֹב, не установлен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «страна». Еврейское אֲדָמָה может означать как землю под ногами, так и территорию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Ибо если
  rationale: Сочетание вводит условное предостережение и связывает его с предшествующей речью.
- source_word: אֵינְךָ מְשַׁלֵּחַ אֶת עַמִּי
  choice: ты не отпустишь Мой народ
  rationale: В повествовании об исходе שׁלח означает освобождение народа, а не простую отправку; русское «отпустить» естественно передаёт этот смысл.
- source_word: הִנְנִי מַשְׁלִיחַ
  choice: то вот, Я пошлю
  rationale: Формула с причастием выражает торжественно объявленное, близкое и несомненное действие. Будущее «пошлю» звучит естественно после условного придаточного, а «вот» сохраняет указательно-эмфатическую силу הִנְנִי.
- source_word: הֶעָרֹב
  choice: рой
  rationale: Точный вид существ неясен; собирательное «рой» сохраняет неопределённость еврейского слова и не ограничивает его мухами.
- source_word: בְּךָ וּבַעֲבָדֶיךָ וּבְעַמְּךָ
  choice: на тебя, на твоих слуг, на твой народ
  rationale: Повторение «на» воспроизводит нарастающий риторический ряд и обозначает тех, кого поразит бедствие.
- source_word: וּבְבָתֶּיךָ
  choice: и в твои дома
  rationale: В контексте посылаемого роя и последующего наполнения домов русское обозначение направленности «в» наиболее естественно.
- source_word: וּמָלְאוּ בָּתֵּי מִצְרַיִם
  choice: Дома египтян наполнятся
  rationale: Передаёт результат действия естественным русским оборотом; «дома египтян» ясно выражает значение еврейской сопряжённой конструкции.
- source_word: וְגַם הָאֲדָמָה
  choice: и даже земля
  rationale: «Земля» допускает значения поверхности и территории, а «даже» естественно подчёркивает добавочное וְגַם.
- source_word: אֲשֶׁר הֵם עָלֶיהָ
  choice: на которой они находятся
  rationale: Буквальная местоименная формулировка сохраняет возможную неясность референта «они» и не добавляет отсутствующего в тексте глагола «стоять» или «жить».
