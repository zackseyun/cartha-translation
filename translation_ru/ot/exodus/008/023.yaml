  rationale: Исправлена только неудачная русская передача меры пути и приведено к более прямому русскому соответствию число при «жертве». Будущее «скажет» оставлено как допустимая передача древнееврейского имперфекта; примечание сохраняет возможное настоящее/обобщённое понимание.
