    rationale: '«На расстояние трёх дней пути» звучит тяжеловесно и тавтологично: «дни пути» уже обозначают меру расстояния. Древнееврейское דֶּרֶךְ שְׁלֹשֶׁת יָמִים естественно передать как «на три дня пути».'
  - severity: low
    issue: Число в выражении «принесём жертвы»
    rationale: Еврейский глагол זבח сам по себе не требует множественного числа объектов. Русское «принесём жертву» более прямо соответствует форме и обычному русскому употреблению, не исключая того, что жертвенное служение могло включать более одного животного.
  revised_text: Мы пойдём на три дня пути в пустыню и принесём жертву Яхве, нашему Богу, как Он скажет нам.[a]
