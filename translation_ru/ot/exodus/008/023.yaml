  verdict: revise
  source_fidelity: 'Смысл передан в целом верно: речь идёт о пути в пустыню протяжённостью в три дня и о принесении жертвы Яхве в соответствии с Его указанием. Однако «на расстояние трёх дней пути» неестественно и избыточно для русского выражения этой древнееврейской меры пути.'
  naturalness: «Мы пойдём на три дня пути в пустыню» — современная литературная и ясная формулировка. Она не превращает меру пути в неопределённое «расстояние» и сохраняет направленность движения. Единственное число «принесём жертву» естественно передаёт культовый глагол זבח без ненужного уточнения числа жертв.
  terminology: «Яхве, нашему Богу» точно передаёт личное имя יהוה и форму «наш Бог». «Принесём жертву» сохраняет жертвенный, а не просто общий религиозный смысл זבח.
