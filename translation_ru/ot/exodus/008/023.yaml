base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/023.yaml
  text: We will go a three days' journey into the wilderness and sacrifice to Yahweh our God[b][a], just as he tells us.
translation:
  language: ru
  text: Мы пойдём на три дня пути в пустыню и принесём жертву Яхве, нашему Богу, как Он скажет нам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как Он говорит нам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: на расстояние трёх дней пути
  rationale: Сочетание обозначает путь или расстояние, преодолеваемое за три дня. Такой перевод естественен по-русски и не создаёт впечатления, будто речь обязательно идёт о трёхдневном пребывании в пустыне.
- source_word: נֵלֵךְ
  choice: мы отправимся
  rationale: Имперфект первого лица множественного числа передаёт предстоящее движение; «отправимся» звучит естественно и сохраняет будущую направленность.
- source_word: בַּמִּדְבָּר
  choice: в пустыню
  rationale: При глаголе движения предлог передаёт направление. «Пустыня» здесь означает незаселённую дикую местность, а не обязательно песчаную пустыню.
- source_word: וְזָבַחְנוּ
  choice: и принесём жертвы
  rationale: Глагол זבח обозначает совершение жертвоприношения; русское выражение «принести жертвы» ясно передаёт культовый смысл.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное заветное имя יהוה транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֵינוּ
  choice: нашему Богу
  rationale: Точно передаёт форму с суффиксом первого лица множественного числа.
- source_word: כַּאֲשֶׁר יֹאמַר אֵלֵינוּ
  choice: как Он скажет нам
  rationale: Оборот выражает соответствие Божьему указанию; будущее время естественно передаёт имперфект и ожидаемое наставление.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Временное значение יֹאמַר
  choice: как Он скажет нам
  alternative: как Он говорит нам
  rationale: Имперфект допускает ожидаемое будущее указание, но также может пониматься как настоящее или общее наставление; альтернативу сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык; формулировка торжественная, но понятная. Местоимение «Он» написано с прописной буквы как уважительное обозначение Бога.
