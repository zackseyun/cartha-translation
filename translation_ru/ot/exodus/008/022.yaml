  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לֹ֤א נָכוֹן֙ לַ/עֲשׂ֣וֹת כֵּ֔ן כִּ֚י תּוֹעֲבַ֣ת מִצְרַ֔יִם נִזְבַּ֖ח לַ/יהוָ֣ה אֱלֹהֵ֑י/נוּ הֵ֣ן נִזְבַּ֞ח אֶת תּוֹעֲבַ֥ת מִצְרַ֛יִם לְ/עֵינֵי/הֶ֖ם וְ/לֹ֥א יִסְקְלֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/022.yaml
  text: But Moses said[a], “It would not be right to do so, because we would sacrifice to Yahweh our God what is detestable to the Egyptians. If we sacrifice what is detestable to the Egyptians before their eyes, will they not stone us?”
translation:
  language: ru
  text: 'Но Моисей сказал: «Так поступить было бы неправильно, потому что мы будем приносить в жертву Яхве, нашему Богу, то, что отвратительно египтянам.[a] Если мы принесём в жертву то, что отвратительно египтянам, у них на глазах, разве они не побьют нас камнями?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мерзость египтян». Здесь, вероятно, имеется в виду то, что египтяне считали отвратительным.'
    reason: Конструкция תּוֹעֲבַת מִצְרַיִם допускает разные оттенки генитивной связи; сноска сохраняет более буквальную и неоднозначную форму, тогда как основной текст передаёт наиболее вероятный контекстуальный смысл.
lexical_decisions:
- source_word: נָכוֹן
  choice: нельзя
  rationale: В данном контексте слово обозначает то, что неприемлемо или не подобает делать. Оборот «так поступить нельзя» естественно передаёт и практическую, и нравственную неприемлемость предложения.
- source_word: לַעֲשׂוֹת כֵּן
  choice: так поступить
  rationale: Естественный русский эквивалент устойчивого выражения «сделать так»; глагол «поступить» хорошо подходит к обсуждаемому решению.
- source_word: תּוֹעֲבַת מִצְרַיִם
  choice: то, что отвратительно для египтян
  rationale: 'Контекст поддерживает объективное понимание сочетания: предмет жертвоприношения вызывает отвращение или религиозное негодование египтян. Буквальная неоднозначность сохранена в сноске.'
- source_word: נִזְבַּח
  choice: мы будем приносить в жертву / мы принесём в жертву
  rationale: Имперфект выражает предполагаемое действие в случае принятия предложения фараона. В причинной части уместно длительно-предполагаемое «будем приносить», а в условной — завершённое «принесём».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога.
- source_word: אֱלֹהֵינוּ
  choice: нашему Богу
  rationale: Точно сохраняет притяжательную форму и указание на Бога Израиля.
- source_word: הֵן
  choice: если
  rationale: Здесь частица вводит наглядно представленное условие, за которым следует риторический вопрос.
- source_word: לְעֵינֵיהֶם
  choice: у них на глазах
  rationale: Естественный современный русский оборот, сохраняющий зрительную выразительность еврейской идиомы.
- source_word: יִסְקְלֻנוּ
  choice: не побьют нас камнями?
  rationale: Глагол обозначает нападение или умерщвление посредством забрасывания камнями; русский оборот точно передаёт способ действия и риторический характер вопроса.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя без замены титулом.
- issue: Значение תּוֹעֲבַת מִצְרַיִם
  choice: то, что отвратительно для египтян
  alternative: мерзость Египта
  rationale: Контекст связывает выражение с ожидаемым возмущением египтян при виде жертвоприношения. При этом буквальная конструкция допускает более формальную передачу, указанную в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но общедоступным библейским звучанием. Риторический вопрос и яркая идиома «у них на глазах» сохранены; конфессионально окрашенные уточнения не добавлялись.
