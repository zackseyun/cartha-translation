base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/012.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your staff and strike the dust of the earth, and it will become gnats throughout all the land of Egypt.’”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Скажи Аарону: „Протяни свой посох и ударь по праху земли — и он превратится в мошек[a] по всей земле Египта“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вшей». Еврейское слово обозначает мелких кусающих или докучливых насекомых; точный их вид неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма с повествовательным waw продолжает последовательность событий; традиционная русская связка звучит естественно и не добавляет временного оттенка сверх текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱמֹר
  choice: Скажи
  rationale: Прямой и естественный эквивалент повелительной формы, вводящей слова для Аарона.
- source_word: נְטֵה
  choice: Протяни
  rationale: Передаёт движение посоха наружу или вперёд без излишнего уточнения жеста.
- source_word: מַטְּךָ
  choice: свой посох
  rationale: Современное и контекстуально точное обозначение принадлежавшего Аарону жезла; возвратное местоимение естественно в русской косвенно вложенной речи.
- source_word: וְהַךְ
  choice: и ударь
  rationale: Сохраняет силу и повелительный характер глагола נכה без архаического «порази».
- source_word: עֲפַר הָאָרֶץ
  choice: по праху земли
  rationale: «Прах» передаёт мелкую сухую землю и сохраняет библейскую образность выражения; предлог «по» естественно сочетается с глаголом «ударить».
- source_word: וְהָיָה לְכִנִּם
  choice: и он превратится в мошек
  rationale: В контексте субъектом остаётся прах; «превратится» ясно выражает наступивший результат, тогда как вид насекомых оставлен достаточно общим.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: по всей земле Египетской
  rationale: Передаёт всеохватное распространение бедствия и сохраняет обычное русское библейское географическое наименование.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» прямо передаёт его общепринятой современной транслитерацией, не подменяя титулом и не выбирая менее вероятную позднюю вокализацию.
- issue: Тождество насекомых כִּנִּים
  choice: мошки с примечанием о неопределённости
  alternative: вши; комары
  rationale: Точный биологический вид, обозначенный редким еврейским словом, достоверно не установлен; основной текст использует общее понятное обозначение, а примечание сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Вложенная прямая речь сохранена. Маркер примечания поставлен при спорном названии насекомых, к которому он относится.
