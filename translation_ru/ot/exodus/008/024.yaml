  text: וַ/יֹּ֣אמֶר פַּרְעֹ֗ה אָנֹכִ֞י אֲשַׁלַּ֤ח אֶתְ/כֶם֙ וּ/זְבַחְתֶּ֞ם לַ/יהוָ֤ה אֱלֹֽהֵי/כֶם֙ בַּ/מִּדְבָּ֔ר רַ֛ק הַרְחֵ֥ק לֹא תַרְחִ֖יקוּ לָ/לֶ֑כֶת הַעְתִּ֖ירוּ בַּעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/024.yaml
  text: Then Pharaoh said, “I will let you go, so that you may sacrifice to Yahweh your God in the wilderness. Only, you must not go very far away. Plead for me.”
translation:
  language: ru
  text: 'Тогда фараон сказал: «Я отпущу вас, чтобы вы принесли жертвы Яхве, вашему Богу, в пустыне. Только не уходите слишком далеко. Помолитесь за меня».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Форма с последовательным waw продвигает повествование; «тогда» естественно передаёт последовательность событий.
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Общепринятое русское обозначение египетского правителя.
- source_word: אָנֹכִי אֲשַׁלַּח אֶתְכֶם
  choice: Я отпущу вас
  rationale: В контексте переговоров שׁלח означает разрешить уйти, освободить; отдельное אָנֹכִי придаёт местоимению смысловое ударение, естественно сохраняемое явным «я».
- source_word: וּזְבַחְתֶּם
  choice: чтобы вы принесли жертвы
  rationale: После обещания отпустить сочетание передаёт цель последующего ухода. Множественное «жертвы» естественно для русского обозначения жертвоприношений.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя, непосредственно стоящее в еврейском тексте.
- source_word: אֱלֹהֵיכֶם
  choice: вашему Богу
  rationale: Прямо передаёт притяжательную конструкцию и обозначение Бога Израиля.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: «Пустыня» — естественный и традиционный русский эквивалент מִדְבָּר в контексте Исхода, не обязательно подразумевающий одни пески.
- source_word: רַק
  choice: Только
  rationale: Вводит ограничительное условие фараона.
- source_word: הַרְחֵק לֹא תַרְחִיקוּ לָלֶכֶת
  choice: не уходите слишком далеко
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает идею удаления; русское «слишком далеко» естественно выражает установленный фараоном предел.
- source_word: הַעְתִּירוּ בַּעֲדִי
  choice: Помолитесь за меня
  rationale: В каузативной породе עתר обозначает настойчивое обращение с мольбой; в данном контексте адресатом подразумевается Бог, поэтому «помолитесь» ясно и естественно передаёт просьбу о заступнической молитве.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя. «Яхве» сохраняет это имя и не заменяет его титулом.
- issue: Смысл просьбы הַעְתִּירוּ בַּעֲדִי
  choice: Помолитесь за меня
  alternative: Умолите за меня; походатайствуйте за меня
  rationale: Форма допускает оттенки усиленной мольбы и ходатайства. Контекст указывает на обращение к Богу ради фараона, но перевод не уточняет содержание ожидаемой молитвы.
translation_notes:
  register: Современный литературный русский язык, ясный для широкого читателя; реплика фараона передана с достоинством и разговорной естественностью без архаизмов. Синтаксис сохраняет последовательность обещания, ограничения и просьбы.
