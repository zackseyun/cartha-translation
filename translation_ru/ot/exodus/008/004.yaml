base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/004.yaml
  text: Then Pharaoh called for Moses and Aaron and said[a], “Pray to Yahweh, that he may remove the frogs from me and from my people, and I will let the people go[b], so that they may sacrifice to Yahweh.”
translation:
  language: ru
  text: 'Тогда фараон призвал Моисея и Аарона и сказал: «Умолите Яхве[a], чтобы Он избавил меня и мой народ от лягушек, и я отпущу народ, чтобы они принесли жертвы Яхве[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол может означать «настойчиво просить, умолять, ходатайствовать», а не просто молиться.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и они принесут жертвы Яхве». В еврейском тексте возможно простое соединение двух действий, хотя по контексту вероятнее указание на цель освобождения народа.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... לְמֹשֶׁה וּלְאַהֲרֹן
  choice: призвал Моисея и Аарона
  rationale: Конструкция קרא с לְ обозначает вызов людей к себе; «призвал» естественно передаёт распоряжение фараона привести их.
- source_word: הַעְתִּירוּ
  choice: умолите
  rationale: Hiphil глагола עתר в молитвенном контексте выражает настойчивую просьбу или ходатайство; «умолите» сохраняет эту усиленную окраску лучше, чем нейтральное «помолитесь».
- source_word: אֶל יְהוָה
  choice: Яхве
  rationale: Предлог אֶל при глаголе обращения передан русским беспредложным управлением «умолить кого»; тетраграмматон передан как личное имя «Яхве».
- source_word: וְיָסֵר
  choice: чтобы Он удалил
  rationale: Hiphil от סור означает «удалить, устранить»; форма после повеления выражает содержание или желаемый результат просьбы.
- source_word: הַצְפַרְדְּעִים מִמֶּנִּי וּמֵעַמִּי
  choice: лягушек от меня и от моего народа
  rationale: Повторённый מִן сохранён посредством двух «от», что передаёт личное и общенародное избавление.
- source_word: וַאֲשַׁלְּחָה אֶת־הָעָם
  choice: и я отпущу народ
  rationale: Когортатив выражает заявленное намерение или обещание фараона; «отпущу» соответствует устойчивому смыслу שלח в повествовании Исхода.
- source_word: וְיִזְבְּחוּ
  choice: чтобы они принесли жертвы
  rationale: Форма может обозначать цель обещанного освобождения; русское «принесли жертвы» естественно передаёт действие זבח, не исключая буквального «совершили жертвоприношение».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и согласуется с предоставленным доктринальным решением.
- issue: Связь וְיִזְבְּחוּ с обещанием отпустить народ
  choice: 'цель: «чтобы они принесли жертвы»'
  alternative: 'простое присоединение: «и они принесут жертвы»'
  rationale: После когортатива фараона форма с וְ естественно указывает на предполагаемую цель освобождения, однако грамматика допускает и простое сочинение, поэтому альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Фараон» написано со строчной буквы как титул; местоимение «Он» в прямой речи помогает ясно обозначить Яхве. Все сноски имеют маркеры в основном тексте.
