  text: וְ/הִפְלֵיתִי֩ בַ/יּ֨וֹם הַ/ה֜וּא אֶת אֶ֣רֶץ גֹּ֗שֶׁן אֲשֶׁ֤ר עַמִּ/י֙ עֹמֵ֣ד עָלֶ֔י/הָ לְ/בִלְתִּ֥י הֱיֽוֹת שָׁ֖ם עָרֹ֑ב לְמַ֣עַן תֵּדַ֔ע כִּ֛י אֲנִ֥י יְהוָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/018.yaml
  text: But on that day I will set apart the land of Goshen[a], where my people dwell, so that no swarm will be there[b], in order that you may know that I am Yahweh in the midst of the land.
translation:
  language: ru
  text: Но в тот день Я отделю землю Гесем, где живёт Мой народ, и там не будет роя насекомых[a], чтобы ты узнал, что Я, Яхве, пребываю посреди земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рой»; еврейское слово עָרֹב может обозначать рой или полчище различных насекомых, а не только мух.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «посреди земли» либо «посреди земного мира». В данном контексте, вероятнее всего, имеется в виду земля Египта.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִפְלֵיתִי
  choice: Но в тот день Я отделю
  rationale: Форма глагола פלא в породе hифиль здесь означает провести различие, выделить и оградить от бедствия. «Отделю» кратко передаёт особое обращение с землёй Гесем; союз «но» естественно выражает контраст с поражённой землёй Египта.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: землю Гесем
  rationale: אֶרֶץ обозначает землю или область; традиционное географическое название «земля Гесем» понятно и близко к еврейской форме.
- source_word: עַמִּי עֹמֵד עָלֶיהָ
  choice: где живёт Мой народ
  rationale: Причастие עֹמֵד с предлогом עַל в данном контексте обозначает пребывание или проживание, а не буквальное стояние.
- source_word: לְבִלְתִּי הֱיוֹת שָׁם
  choice: и там не будет
  rationale: Инфинитивная конструкция выражает предполагаемый результат или цель отделения Гесема. Русская конструкция сохраняет смысл и звучит естественно.
- source_word: עָרֹב
  choice: роя насекомых
  rationale: Точное обозначение существа или множества существ спорно. «Рой насекомых» передаёт собирательный характер слова, не ограничивая его мухами.
- source_word: לְמַעַן תֵּדַע
  choice: чтобы ты узнал
  rationale: Союз לְמַעַן явно выражает цель, а глагол стоит во втором лице единственного числа и обращён к фараону.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: посреди этой земли
  rationale: בְּקֶרֶב означает «посреди, среди». Указательное «этой» естественно по-русски связывает определённое הָאָרֶץ с землёй, о которой идёт речь, при сохранении возможной более широкой трактовки в сноске.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя, поэтому оно передано транслитерацией «Яхве» без замены титулом.
- issue: Смысл утверждения אֲנִי יְהוָה בְּקֶרֶב הָאָרֶץ
  choice: что Я, Яхве, нахожусь посреди этой земли
  alternative: что Я — Яхве посреди земли; что Я, Яхве, нахожусь посреди земли/земного мира
  rationale: Русская связка «нахожусь» делает эллиптическую еврейскую фразу понятной, сохраняя утверждение о присутствии Яхве. Слово הָאָרֶץ может обозначать конкретную землю Египта или землю в более широком смысле; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; спорная природа עָרֹב и широта значения הָאָרֶץ не разрешены догматически, а сохранены в сносках.
