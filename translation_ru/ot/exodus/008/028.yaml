  text: But Pharaoh hardened his heart this time also[a], and did not let the people go.
translation:
  language: ru
  text: Но и на этот раз фараон ожесточил своё сердце[a] и не отпустил народ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделал своё сердце тяжёлым». Это древнееврейское выражение означает, что фараон стал упрям и невосприимчив.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְבֵּד
  choice: ожесточил
  rationale: В сочетании с «сердцем» глагол כבד, буквально связанный с тяжестью, выражает упрямство и нечуткость. «Ожесточил» естественно передаёт идиому и сохраняет активную роль фараона.
- source_word: לִבּוֹ
  choice: своё сердце
  rationale: Слово «сердце» сохраняет древнееврейский образ центра воли и внутреннего расположения; возвратное «своё» ясно соотносит его с подлежащим.
- source_word: גַּם בַּפַּעַם הַזֹּאת
  choice: и на этот раз
  rationale: Передаёт добавочное значение גַּם и указание на очередной случай естественным русским оборотом.
- source_word: וְלֹא שִׁלַּח
  choice: и не отпустил
  rationale: В контексте исхода שלח означает позволить народу уйти, освободить его; «не отпустил» кратко и точно передаёт этот смысл.
- source_word: הָעָם
  choice: народ
  rationale: Определённое собирательное существительное в контексте обозначает народ Израиля; по-русски определённость ясна из контекста.
- source_word: וַ
  choice: Но
  rationale: Нарративный союз допускает простое «и», однако здесь «но» естественно отмечает контраст между прекращением бедствия и новой реакцией фараона.
theological_decisions:
- issue: Кто ожесточает сердце фараона
  choice: Фараон сам ожесточил своё сердце
  alternative: Сердце фараона ожесточилось; Бог ожесточил сердце фараона
  rationale: В данном стихе фараон прямо назван подлежащим переходного глагола. Перевод сохраняет его личную ответственность и не устраняет напряжение с другими местами книги Исход, где ожесточение описывается иначе.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, естественная и возвышенно-нейтральная. Традиционный библейский оборот «ожесточил сердце» сохранён благодаря его точности и понятности.
