lexical_decisions:
- source_word: וַיֵּצֵא
  choice: и вышел
  rationale: Форма Qal wayyiqtol от יצא обозначает физический уход и продолжает последовательность повествования; «и вышел» прямо и естественно передаёт её.
- source_word: מֵעִם פַּרְעֹה
  choice: от фараона
  rationale: Сочетание מֵעִם выражает удаление от лица или присутствия того, с кем находились; по-русски «от фараона» естественно передаёт этот смысл.
- source_word: וַיֶּעְתַּר
  choice: стал горячо молить
  rationale: Глагол עתר здесь означает настойчивую, усердную мольбу, а не просто нейтральную молитву. Конструкция «стал горячо молить» передаёт интенсивность и повествовательную форму.
- source_word: אֶל יְהוָה
  choice: Яхве
  rationale: При русском глаголе «молить» адресат естественно ставится в винительном падеже без отдельного предлога; имя יהוה передано транслитерацией «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное Божье имя — тетраграмматон יהוה. Транслитерация «Яхве» сохраняет имя, не заменяя его титулом.
- issue: Характер обращения Моисея к Богу
  choice: стал горячо молить
  alternative: помолился; воззвал
  rationale: Выбранная формулировка сохраняет выраженную глаголом עתר настойчивость прошения, не уточняя сверх текста его содержание или результат.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Союз «И» сохраняет последовательность еврейского рассказа; «фараон» оформлен как титул со строчной буквы по современной русской норме.
