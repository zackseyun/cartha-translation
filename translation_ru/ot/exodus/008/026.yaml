  language: ru
  text: И Моисей вышел от фараона и обратился к Яхве с горячей мольбой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «горячо молил Яхве». Еврейский глагол обозначает настойчивую, усердную мольбу.'
