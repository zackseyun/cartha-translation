  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הַשְׁכֵּ֤ם בַּ/בֹּ֨קֶר֙ וְ/הִתְיַצֵּב֙ לִ/פְנֵ֣י פַרְעֹ֔ה הִנֵּ֖ה יוֹצֵ֣א הַ/מָּ֑יְמָ/ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/016.yaml
  text: 'Then the LORD said to Moses, “Rise early in the morning and station yourself before Pharaoh. Look, he is going out to the water, and you shall say to him, ‘Thus says the LORD: Let my people go, so that they may serve me.’”'
translation:
  language: ru
  text: 'И сказал Господь Моисею: «Встань рано утром и предстань перед фараоном. Вот, он выходит к воде. Скажи ему: „Так говорит Господь: отпусти Мой народ, чтобы он служил Мне“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: Встань рано утром
  rationale: Естественно передаёт повеление подняться и действовать с раннего утра.
- source_word: וְהִתְיַצֵּב לִפְנֵי פַרְעֹה
  choice: и предстань перед фараоном
  rationale: Глагол выражает намеренное занятие места перед фараоном; «предстань» сохраняет официальный и решительный оттенок.
- source_word: הִנֵּה יוֹצֵא הַמָּיְמָה
  choice: Вот, он выйдет к воде
  rationale: «Вот» сохраняет дискурсивный указатель הִנֵּה, а будущее время естественно в русском описывает предстоящее действие.
- source_word: שַׁלַּח עַמִּי
  choice: отпусти Мой народ
  rationale: В данном контексте שׁלח означает позволить народу уйти, освободить его для требуемого служения.
- source_word: וְיַעַבְדֻנִי
  choice: чтобы он служил Мне
  rationale: Целевая связь передана союзом «чтобы»; עבד оставлено широким «служить», не сужая значение исключительно до поклонения или труда.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: Господь
  alternative: Яхве
  rationale: Традиционное русское «Господь» обеспечивает узнаваемость и благоговейный литературный регистр, не добавляя конфессионально специфического толкования.
- issue: Значение עבד в требовании к фараону
  choice: служил Мне
  alternative: поклонялся Мне
  rationale: «Служил» сохраняет смысловую широту древнееврейского глагола и не устраняет возможное сочетание культового служения и принадлежности Богу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис упрощён для ясности, при этом сохранены повтор формулы «Так говорит Господь» и повелительный тон речи.
