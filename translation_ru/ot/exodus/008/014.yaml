base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/014.yaml
  text: And the magicians did the same by their secret arts to bring out the gnats[a], but they were not able; and the gnats were on man and on beast.
translation:
  language: ru
  text: И чародеи своими тайными искусствами также пытались произвести мошек[a], но не смогли. Мошки были на людях и на животных.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вши». Точный вид насекомого, обозначаемого еврейским словом, не установлен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: волхвы
  rationale: Устоявшееся в русском библейском языке обозначение египетских придворных магов и ритуальных специалистов; сохраняет достоинство стиля и историко-культурный оттенок.
- source_word: בְּלָטֵיהֶם
  choice: своими тайными искусствами
  rationale: Передаёт скрытый, магический характер применяемых приёмов, не уточняя сверх того, что выражено в еврейском тексте.
- source_word: לְהוֹצִיא
  choice: вывести
  rationale: Близко передаёт каузативное значение «вывести, произвести» и естественно звучит применительно к попытке вызвать насекомых.
- source_word: הַכִּנִּים / הַכִּנָּם
  choice: мошки
  rationale: Точный вид насекомого неизвестен; «мошки» — понятный современный вариант. Традиционное «вши» сохранено в примечании как реальная лексическая альтернатива.
- source_word: וְלֹא יָכֹלוּ
  choice: но не смогли
  rationale: Кратко и естественно выражает неспособность совершить задуманное.
- source_word: בָּאָדָם
  choice: на людях
  rationale: Еврейское אָדָם здесь имеет собирательное значение «человек, человечество». В современном русском «на людях» ясно передаёт множество поражённых людей и не создаёт ложного впечатления об одном мужчине.
- source_word: וּבַבְּהֵמָה
  choice: и на животных
  rationale: Передаёт собирательное בְּהֵמָה естественным русским множественным числом, сохраняя противопоставление людей и животных.
theological_decisions:
- issue: Собирательное значение אָדָם
  choice: на людях
  alternative: на человеке
  rationale: В данном контексте речь идёт не об отдельном человеке и не только о мужчинах, а о людях вообще. Русское множественное число естественно раскрывает собирательный смысл, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский с умеренно библейским оттенком. «Волхвы» сохраняет традиционную терминологию, тогда как синтаксис и прочая лексика остаются понятными современному читателю. Добавлено «попытались», чтобы естественно выразить сочетание «сделали… но не смогли» как неудавшееся действие.
