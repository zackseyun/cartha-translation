revisions:
- from: И волхвы попытались сделать то же своими тайными искусствами — вывести мошек[a], но не смогли. И мошки были на людях и на животных.
  to: И чародеи своими тайными искусствами также пытались произвести мошек[a], но не смогли. Мошки были на людях и на животных.
  rationale: Правка сохраняет неопределённость названия насекомого и смысл неудавшейся попытки, но делает русский текст более естественным и уточняет связь тайных практик чародеев с попыткой произвести мошек. Множественное число «на людях и на животных» адекватно передаёт собирательные существительные в еврейском тексте.
