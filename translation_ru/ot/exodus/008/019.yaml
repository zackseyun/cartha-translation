  yaml_path: translation/ot/exodus/008/019.yaml
  text: And I will make a distinction between my people and your people[a]. Tomorrow this sign will happen.
translation:
  language: ru
  text: И Я установлю различие между Моим народом и твоим[a]. Завтра произойдет это знамение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавление» или «искупление». Еврейское слово может обозначать спасительное действие Бога; здесь оно выражается в том, что Он проводит различие между Израилем и Египтом.'
    reason: Лексическая неоднозначность слова פְדֻת.
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: И Я установлю
  rationale: Глагол שׂים буквально означает «положить, поставить»; с отвлечённым дополнением פְדֻת по-русски естественно передаётся как «установить», сохраняя смысл целенаправленного Божьего действия.
- source_word: פְדֻת
  choice: различие
  rationale: Хотя существительное связано со значениями избавления и искупления, конструкция «между Моим народом и твоим» указывает здесь на различение двух народов посредством спасительного действия Бога. Иные возможные значения сохранены в сноске.
- source_word: בֵּין ... וּבֵין
  choice: между ... и ...
  rationale: Прямая и естественная передача соотносительной конструкции, обозначающей различение двух сторон.
- source_word: עַמִּי
  choice: Моим народом
  rationale: Притяжательная форма относится к народу Бога — Израилю.
- source_word: עַמֶּךָ
  choice: твоим
  rationale: По-русски повтор слова «народ» не требуется; форма относится к народу фараона, то есть египтянам.
- source_word: לְמָחָר
  choice: Завтра
  rationale: Обычное временное значение наречия; вынесение в начало предложения соответствует еврейскому порядку и подчёркивает срок.
- source_word: יִהְיֶה
  choice: явится
  rationale: Буквально «будет». В сочетании со «знамением» глагол «явится» естественно выражает его предстоящее осуществление и возникновение, не сводя אוֹת просто к событию.
- source_word: הָאֹת הַזֶּה
  choice: это знамение
  rationale: אוֹת обозначает данный Богом знак; «знамение» сохраняет библейский смысл и достойный современный регистр.
theological_decisions:
- issue: Передавать ли פְדֻת как «искупление/избавление» или как различение народов
  choice: 'В основном тексте: «различие»'
  alternative: «избавление» или «искупление»
  rationale: Ближайшая синтаксическая конструкция «между Моим народом и твоим» выражает различение Израиля и Египта. Вместе с тем слово несёт спасительный оттенок, поэтому варианты «избавление» и «искупление» указаны в сноске, чтобы не утратить богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Заглавные буквы в «Я» и «Моим» обозначают речь Бога. Формулировка сохраняет как непосредственный контекст различения народов, так и спасительный оттенок ключевого еврейского существительного.
