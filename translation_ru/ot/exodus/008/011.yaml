  yaml_path: translation/ot/exodus/008/011.yaml
  text: But when Pharaoh saw that there was relief[a], he hardened his heart and did not listen to them, just as Yahweh had said.
translation:
  language: ru
  text: Но когда фараон увидел, что наступило облегчение[a], он ожесточил своё сердце и не послушал их, как сказал Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наступила передышка». Еврейское слово может означать облегчение, ослабление давления или время передышки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Сохраняет прямое значение ראה и естественно передаёт осознание фараоном перемены в обстоятельствах.
- source_word: כִּי הָיְתָה הָרְוָחָה
  choice: что наступило облегчение
  rationale: הָרְוָחָה обозначает облегчение, передышку или ослабление давления; «наступило облегчение» естественно звучит по-русски в контексте прекращения бедствия.
- source_word: וְהַכְבֵּד אֶת לִבּוֹ
  choice: он ожесточил своё сердце
  rationale: Активная каузативная форма при фараоне как субъекте означает, что он сам сделал своё сердце упорным; традиционная русская библейская метафора сохраняет образ сердца.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: и не послушал их
  rationale: שׁמע с אֶל означает слушать или внимать; перевод не уточняет смысл до «не повиновался», сохраняя широту исходного выражения.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: как и говорил Яхве
  rationale: Оборот указывает на соответствие ранее сказанному Богом; русское несовершенное прошедшее естественно передаёт предшествовавшее речевое действие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Кто ожесточил сердце фараона
  choice: В этом стихе фараон сам ожесточает своё сердце.
  alternative: Его сердце стало жестоким либо здесь подразумевается непосредственное действие Бога.
  rationale: Еврейский текст употребляет активную каузативную форму, субъектом которой является фараон. Это не устраняет напряжение с другими местами Исхода, где сердце фараона ожесточает Бог.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повествования. Формулировка ясна обычному читателю; традиционная метафора «ожесточил сердце» сохранена без конфессионального истолкования.
