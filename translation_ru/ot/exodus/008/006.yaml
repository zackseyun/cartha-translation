base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/006.yaml
  text: He said[a], “Tomorrow.” And he said, “According to your word, so that you may know that there is no one like Yahweh our God.”
translation:
  language: ru
  text: 'Он ответил: «Завтра». Моисей сказал: «Будет по твоему слову, чтобы ты узнал, что нет никого, подобного Яхве, Богу нашему».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Он ответил / Моисей сказал
  rationale: Обе формы — повествовательное «и сказал». В первой реплике глагол естественно передан как «ответил», поскольку это ответ фараона на вопрос предыдущего стиха; во второй субъект «Моисей» восстановлен из контекста для ясности смены говорящего.
- source_word: לְמָחָר
  choice: На завтра
  rationale: 'Предлог לְ при временном указании передан естественным русским ответом на вопрос о назначенном сроке: «На завтра».'
- source_word: כִּדְבָרְךָ
  choice: по твоему слову
  rationale: Сохранён образный и несколько торжественный еврейский оборот «согласно твоему слову», означающий исполнение в названный фараоном срок.
- source_word: לְמַעַן תֵּדַע
  choice: чтобы ты узнал
  rationale: לְמַעַן вводит цель, а имперфект תֵּדַע обращён к одному мужчине — фараону.
- source_word: אֵין כַּיהוָה
  choice: нет никого, подобного Яхве
  rationale: Экзистенциальное отрицание с показателем сравнения כְּ естественно передаётся личной конструкцией «нет никого, подобного»; имя יהוה транслитерировано как «Яхве».
- source_word: אֱלֹהֵינוּ
  choice: Богу нашему
  rationale: В данном контексте форма אֱלֹהִים обозначает единственного Бога Израиля; порядок слов сохраняет торжественное приложение к имени Яхве.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит личное имя Бога, поэтому транслитерация сохраняет различие между יהוה и титулом אֲדֹנָי и не заменяет имя титулом.
- issue: Смысл утверждения אֵין כַּיהוָה
  choice: нет никого, подобного Яхве
  alternative: нет Бога, подобного Яхве
  rationale: В еврейском тексте после אֵין не названо существительное «Бог»; перевод сохраняет более широкую формулировку, не ограничивая сравнение добавленным словом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «По твоему слову» сохраняет форму оригинала, оставаясь понятным; явное имя «Моисей» делает смену говорящего ясной без изменения смысла контекста.
