base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/003.yaml
  text: And the magicians did the same by their secret arts[a], and they brought up the frogs over the land of Egypt.
translation:
  language: ru
  text: 'И чародеи своими тайными искусствами[a] сделали то же: заставили лягушек выйти на землю Египта.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своими чарами»; или: «своими оккультными искусствами».'
    reason: Лексема допускает передачи, подчёркивающие чары либо скрытый, эзотерический характер магических практик.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: сделали то же
  rationale: Передаёт идиому со значением повторения ранее описанного действия и естественно звучит по-русски.
- source_word: הַחֲרְטֻמִּים
  choice: чародеи
  rationale: В контексте Исхода речь идёт о придворных египетских знатоках магических практик. «Чародеи» ясно передаёт эту роль, не вызывая устойчивой ассоциации слова «волхвы» с новозаветными мудрецами.
- source_word: בְּלָטֵיהֶם
  choice: своими тайными искусствами
  rationale: Сочетание передаёт как инструментальное значение предлога, так и скрытый, эзотерический характер обозначенных практик, не уточняя их способ сверх сказанного в тексте.
- source_word: וַיַּעֲלוּ
  choice: вывели
  rationale: Каузативная форма глагола עלה указывает, что чародеи заставили лягушек выйти или подняться. «Вывели» сохраняет причинный смысл и естественно сочетается с последующим указанием места.
- source_word: אֶת הַצְפַרְדְּעִים
  choice: лягушек
  rationale: Прямое соответствие еврейскому существительному во множественном числе; определённость объекта в русском языке понятна из контекста.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: на землю Египта
  rationale: Естественно передаёт пространственное значение עַל и распространение лягушек по египетской земле.
theological_decisions:
- issue: Характер действия чародеев
  choice: Сообщить прямо, что чародеи также вывели лягушек
  alternative: Представить их действие лишь как видимость, обман или трюк
  rationale: Еврейский рассказ утверждает действие без оговорок о его мнимом характере; перевод не должен привносить скептическое или натуралистическое объяснение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Двоеточие устраняет тяжеловесное повторение союза и ясно представляет вторую часть как содержание совершённого ими подобного действия.
