base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/013.yaml
  text: And they did so[a]. Aaron stretched out his hand with his staff and struck the dust of the earth, and the gnats came upon man and beast[b]. All the dust of the earth became gnats throughout all the land of Egypt.
translation:
  language: ru
  text: И они сделали так. Аарон простёр руку с посохом и ударил по праху земли, и мошки[a] появились на людях и на скоте. И по всей земле Египта весь прах земли превратился в мошек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вши». Точный вид насекомых, обозначенных древнееврейским словом כִּנִּים, неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: И они сделали так
  rationale: Естественная русская передача повествовательной формулы, обозначающей исполнение предшествующего повеления.
- source_word: וַיֵּט אַהֲרֹן אֶת יָדוֹ בְמַטֵּהוּ
  choice: Аарон простёр руку с посохом
  rationale: «Простёр руку» сохраняет обычное значение נטה в таком сочетании; «с посохом» передаёт сопровождение или орудийность предлога בְּ, не устраняя присущую конструкции смысловую широту.
- source_word: וַיַּךְ אֶת עֲפַר הָאָרֶץ
  choice: ударил по праху земли
  rationale: «Ударил» точно и неархаично передаёт נכה, а «прах земли» сохраняет образ мелкой сухой земли и повтор ключевой фразы.
- source_word: הַכִּנָּם / כִנִּים
  choice: мошки
  rationale: Точная зоологическая идентификация древнееврейского названия неясна; «мошки» — понятная современная передача мелких жалящих или докучливых насекомых, а неопределённость отмечена в сноске.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: на людях и на скоте
  rationale: אָדָם употреблено собирательно и потому естественно передаётся словом «люди»; בְּהֵמָה в данном контексте обозначает домашних животных, для чего уместно русское «скот».
- source_word: כָּל עֲפַר הָאָרֶץ הָיָה כִנִּים
  choice: Весь прах земли превратился в мошек
  rationale: «Весь» сохраняет всеохватность כָּל, а «превратился» ясно выражает результативное значение היה в данном контексте.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: по всей земле Египетской
  rationale: Формулировка передаёт полный географический охват и сохраняет достоинство библейского повествования без непонятной архаики.
theological_decisions:
- issue: Собирательное значение אָדָם
  choice: люди
  alternative: человек / человечество
  rationale: Здесь слово относится ко всем людям в противопоставлении скоту, а не только к мужчинам. Множественное «люди» естественно выражает собирательный смысл по-русски, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской ритмикой. Сохранены повтор «прах земли» и всеохватность описания; спорная зоологическая идентификация не представлена как несомненная.
