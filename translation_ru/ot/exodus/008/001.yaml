base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/001.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your hand with your staff over the rivers, over the canals, and over the pools, and bring up the frogs over the land of Egypt.’”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Скажи Аарону: „Протяни руку с посохом над реками, каналами[a] и водоёмами и выведи лягушек на землю Египта“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «протоками Нила»; в египетском контексте еврейское слово часто обозначает водные пути, связанные с Нилом.'
    reason: Лексическая альтернатива уточняет возможное египетское значение הַיְאֹרִים, не устраняя неоднозначность из основного текста.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма глагола продолжает повествование; традиционное русское «И сказал» естественно связывает стих с предыдущим контекстом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: נְטֵה אֶת־יָדְךָ בְּמַטֶּךָ
  choice: Простри руку с посохом
  rationale: Сохраняет образ протянутой руки и инструментальное значение предлога при слове «посох».
- source_word: הַנְּהָרֹת
  choice: реками
  rationale: Основное значение слова — реки или речные потоки; перевод сохраняет первый элемент трёхчастного перечня водоёмов.
- source_word: הַיְאֹרִים
  choice: каналами
  rationale: Во множественном числе в египетском контексте обозначает водные пути, связанные с Нилом; «каналы» отличает их от рек и водоёмов, а более конкретная трактовка дана в сноске.
- source_word: הָאֲגַמִּים
  choice: водоёмами
  rationale: Нейтральное современное обозначение скоплений стоячей воды; не сужает значение исключительно до прудов или болот.
- source_word: וְהַעַל
  choice: выведи
  rationale: Каузативная форма требует, чтобы Аарон вызвал выход лягушек из воды; «выведи» передаёт это естественнее русского буквального «подними».
- source_word: הַצְפַרְדְּעִים
  choice: лягушек
  rationale: Прямой и общеупотребительный русский эквивалент.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: на землю Египта
  rationale: Сохраняет пространственное значение предлога и направление выхода лягушек из вод на египетскую землю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В исходном тексте стоит личное имя Бога. Форма «Яхве» передаёт его как имя, не подменяя титулом и не вводя менее вероятную традиционную вокализацию.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Повеления переданы ясно и кратко; трёхчастный перечень водных объектов сохранён. Кавычки разграничивают речь Яхве и вложенную в неё речь, которую Моисей должен передать Аарону.
