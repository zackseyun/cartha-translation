    reason: lexical_alternative
lexical_decisions:
- source_word: מָסָךְ
  choice: завеса
  rationale: Обозначает тканое покрытие или перегородку у входа. «Завеса» естественно звучит по-русски; сноска поясняет возможное различение с внутренней завесой.
- source_word: לְפֶתַח הָאֹהֶל
  choice: для входа в шатёр
  rationale: פֶתַח — вход или проём, а אֹהֶל — шатёр. Перевод сохраняет конкретный строительный образ, не подставляя более интерпретативное «скиния».
- source_word: תְּכֵלֶת
  choice: голубая пряжа
  rationale: Термин обозначает дорогой краситель и окрашенный материал сине-голубого или сине-фиолетового оттенка; «голубая» — традиционный и понятный русский эквивалент в данном перечне тканей.
- source_word: אַרְגָּמָן
  choice: пурпурная пряжа
  rationale: Обозначает материал, окрашенный пурпуром; «пурпурная» точно и естественно передаёт цвет.
- source_word: תוֹלַעַת שָׁנִי
  choice: алая пряжа
  rationale: Устойчивое выражение обозначает окрашенный в алый цвет материал, а не буквально червя; слово «пряжа» делает текстильный смысл явным.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: тонкий кручёный лён
  rationale: שֵׁשׁ обозначает тонкий лён, а מָשְׁזָר — скрученный материал или нить; перевод сохраняет оба признака.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: работа вышивальщика
  rationale: Конструкция подчёркивает искусную декоративную работу мастера; личное обозначение ремесленника сохраняет форму еврейского выражения.
- source_word: וְעָשִׂיתָ
  choice: Сделай
  rationale: В последовательности предписаний форма имеет повелительную силу. Русское совершенное повелительное наклонение естественнее буквального будущего и сохраняет директивный характер.
