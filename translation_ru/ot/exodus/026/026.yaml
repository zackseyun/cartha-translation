  text: И сделай пять перекладин из древесины акации для брусьев одной стороны скинии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для досок»; еврейское слово обозначает несущие элементы конструкции скинии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: И сделай
  rationale: Форма с союзом продолжает последовательность предписаний; русский императив естественно и точно передаёт повелительное значение.
- source_word: בְרִיחִם
  choice: перекладин
  rationale: В данном строительном контексте это горизонтальные элементы, соединяющие несущие части; «перекладины» ясно передаёт функцию без излишней конкретизации.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Конструктивное сочетание буквально обозначает древесину акации; такая формулировка точна и естественна в современном русском языке.
- source_word: חֲמִשָּׁה
  choice: пять
  rationale: Прямое соответствие количественному числительному.
- source_word: לְקַרְשֵׁי
  choice: для брусьев
  rationale: Кֶרֶשׁ обозначает вертикальные конструктивные элементы скинии. «Брусья» сохраняет предметность исходного термина; возможен традиционный вариант «доски».
- source_word: צֶלַע
  choice: стороны
  rationale: В контексте сооружения слово обозначает боковую сторону, а не буквальное «ребро».
- source_word: הַמִּשְׁכָּן
  choice: скинии
  rationale: «Скиния» — укоренившийся и контекстуально точный русский термин для переносного святилища в Исходе.
- source_word: הָאֶחָד
  choice: одной
  rationale: Передаёт указание на одну из соотнесённых сторон, не превращая его необоснованно в порядковое «первой».
