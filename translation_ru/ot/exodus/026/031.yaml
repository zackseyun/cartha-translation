base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/031.yaml
  text: And you shall make a veil of blue[a], purple, and scarlet yarn, and fine twisted linen; it shall be made with cherubim[c][b], the work of a skillful designer.
translation:
  language: ru
  text: И сделай завесу[a] из голубой, пурпурной и алой пряжи[b] и тонкого кручёного льна; пусть её сделают искусной работы, с херувимами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Имеется в виду внутренняя завеса, отделявшая Святое от Святого святых; возможный перевод: «занавес».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение, переданное словом «алая», обозначает окрашенный в алый материал; традиционно такой краситель связывают с насекомыми.
    reason: cultural_note
  - marker: c
    text: 'Или: «с изображениями херувимов, искусной работы». Еврейское выражение подчёркивает художественное мастерство, но не уточняет технику настолько, чтобы обязательно понимать её как вышивку или ткачество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹכֶת
  choice: завеса
  rationale: Культовый термин обозначает внутреннее полотнище, отделявшее Святое от Святого святых; «завеса» точно и естественно передаёт его функцию.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: голубая, пурпурная и алая пряжа
  rationale: Три обозначения цвета в данном перечне относятся к окрашенному материалу; общее слово «пряжа» делает текст естественным и не требует повторения при каждом цвете.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: тонкий кручёный лён
  rationale: 'Сохраняются оба элемента выражения: высококачественный льняной материал и его кручёная обработка.'
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: искусный мастер выткет
  rationale: Выражение указывает на художественную работу квалифицированного ремесленника; «выткет» соответствует тканому полотнищу, не сводя технику к вышивке.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: пусть … выткет на ней
  rationale: Третье лицо единственного числа понято как указание на мастера, а местоименный объект — как завесу; русская конструкция естественно передаёт смену лица в еврейском тексте.
- source_word: כְּרֻבִים
  choice: херувимов
  rationale: Сохраняется традиционное русское название небесных существ; в контексте они являются частью художественного узора завесы.
theological_decisions:
- issue: Передача культовой и художественной терминологии без привнесения поздней символики
  choice: Стих передан как конкретное предписание об устройстве святилища.
  alternative: Выразить в переводе позднейшие богословские ассоциации завесы и херувимов.
  rationale: Сам стих описывает материал и изготовление завесы и не объясняет её позднейшее символическое значение.
- issue: Неоднозначность конструкции מַעֲשֵׂה חֹשֵׁב יַעֲשֶׂה אֹתָהּ כְּרֻבִים
  choice: «пусть искусный мастер выткет на ней херувимов»
  alternative: «сделай её с херувимами, искусной работы»
  rationale: Выбранный вариант ясно передаёт вероятного деятеля и художественный характер работы, а альтернативная синтаксическая возможность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством предписывающего культового текста. Синтаксис сделан ясным для обычного читателя; традиционные термины «завеса» и «херувимы» сохранены. Буква «ё» используется последовательно.
