base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/005.yaml
  text: You shall make fifty loops on the one curtain[a], and you shall make fifty loops on the edge of the curtain that is in the second set; the loops shall be opposite one another.
translation:
  language: ru
  text: Сделай пятьдесят петель на одном полотнище и пятьдесят петель на краю полотнища, входящего во вторую соединённую группу; петли должны располагаться одна напротив другой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждая — к своей сестре»; это еврейское выражение означает, что петли попарно соответствуют друг другу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: петли
  rationale: Существительное обозначает петлеобразные крепления, которыми соединялись полотнища; «петли» точно отличает их от золотых застёжек следующего стиха.
- source_word: יְרִיעָה
  choice: полотнище
  rationale: В данном контексте речь идёт об отдельном крупном куске ткани в составе покрытия скинии. «Полотнище» точнее передаёт конструктивную единицу, чем «занавес».
- source_word: הָאֶחָת
  choice: одном
  rationale: Еврейский текст буквально говорит «на одном», не обозначая его как первое по порядку.
- source_word: קְצֵה
  choice: краю
  rationale: Слово обозначает границу полотнища; «край» естественно для места крепления петель.
- source_word: מַחְבֶּרֶת
  choice: соединённом ряду
  rationale: В контексте это одна из двух групп по пять соединённых полотнищ. «Соединённый ряд» передаёт и объединение, и получившуюся составную часть покрытия.
- source_word: הַשֵּׁנִית
  choice: втором
  rationale: Прямо сохраняет порядковое обозначение второй соединённой группы полотнищ.
- source_word: מַקְבִּילֹת
  choice: должны располагаться одна напротив другой
  rationale: Передаёт пространственное соответствие и выравнивание петель на двух соединяемых краях.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: одна напротив другой
  rationale: Естественно передаёт смысл еврейской идиомы о попарно соответствующих предметах; буквальный образ сохранён в примечании.
