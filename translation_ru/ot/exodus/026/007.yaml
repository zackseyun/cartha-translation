  yaml_path: translation/ot/exodus/026/007.yaml
  text: You shall make curtains of goats’ hair for a tent over the tabernacle[a]; you shall make them as eleven curtains.
translation:
  language: ru
  text: Сделай полотнища из козьей шерсти[a] для шатра над скинией; всего сделай одиннадцать полотнищ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из коз». В еврейском тексте словом «козы» обозначен получаемый от них материал, то есть козья шерсть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Сделай
  rationale: Форма с союзом продолжает ряд предписаний. В современном русском повелительное наклонение естественно и точно передаёт обращённое к Моисею указание.
- source_word: יְרִיעֹת
  choice: полотнища
  rationale: В описании скинии слово обозначает большие тканые части покрытия. «Полотнища» точнее передаёт конструктивную функцию, чем бытовое «занавеси».
- source_word: עִזִּים
  choice: из козьей шерсти
  rationale: Буквально употреблено «коз», но в данном сочетании животное обозначает материал — козью шерсть, из которой изготовлялись полотнища.
- source_word: לְאֹהֶל
  choice: для шатра
  rationale: 'Предлог לְ указывает на назначение: полотнища должны образовать шатёр или служить его покрытием. Неопределённость существительного сохранена без указательного оттенка.'
- source_word: עַל הַמִּשְׁכָּן
  choice: над скинией
  rationale: עַל обозначает положение сверху, а מִשְׁכָּן здесь является специальным названием священного сооружения; традиционное «скиния» сохраняет этот культовый смысл.
- source_word: עַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת תַּעֲשֶׂה אֹתָם
  choice: всего сделай одиннадцать полотнищ
  rationale: Перевод сохраняет прямо названное число и повтор слова «полотнища», а «всего» естественно выражает итоговое количество, подразумеваемое еврейской конструкцией.
