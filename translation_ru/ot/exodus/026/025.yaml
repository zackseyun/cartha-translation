lexical_decisions:
- source_word: קְרָשִׁים
  choice: брусья
  rationale: В описании скинии слово обозначает вертикальные несущие деревянные элементы. «Брусья» естественно передаёт их конструктивную функцию; традиционное «доски» приведено как допустимая альтернатива.
- source_word: אַדְנֵי/הֶם ... אֲדָנִים
  choice: основания
  rationale: Существительное обозначает серебряные опорные детали под брусьями. «Основания» ясно и современно; возможное «подножия» отмечено в сноске.
- source_word: כֶּסֶף
  choice: серебряных
  rationale: Прямое обозначение материала оснований.
- source_word: שִׁשָּׁה עָשָׂר
  choice: шестнадцать
  rationale: Прямая передача количественного числительного.
- source_word: תַּחַת
  choice: под
  rationale: Прямое пространственное обозначение расположения опорных деталей.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: под одним брусом ... под другим брусом
  rationale: Повтор еврейского выражения имеет распределительный смысл. Русская парная конструкция сохраняет распределение по два основания под каждый из рассматриваемых брусьев, не вводя значения последовательности.
- source_word: וְהָיוּ
  choice: И будет
  rationale: Сохранён начальный союз и форма спецификации; единственное число по-русски естественно согласуется с последующим количеством в конструкции «будет восемь».
