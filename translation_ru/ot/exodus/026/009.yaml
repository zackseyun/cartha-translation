  yaml_path: translation/ot/exodus/026/009.yaml
  text: And you shall join the five curtains separately[a], and the six curtains separately; and you shall fold the sixth curtain double at the front of the tent.
translation:
  language: ru
  text: Пять полотнищ соедини отдельно и шесть полотнищ — отдельно; шестое полотнище сложи вдвое у передней стороны шатра.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напротив передней стороны шатра».'
    reason: Сочетание אֶל מוּל может подчёркивать положение напротив лицевой стороны, а не просто у неё.
lexical_decisions:
- source_word: חִבַּרְתָּ
  choice: соедини
  rationale: Глагол חָבַר означает соединять, скреплять. Русский императив естественно передаёт предписание в данном разделе и ясно указывает на объединение полотнищ в две группы.
- source_word: יְרִיעֹת / יְרִיעָה
  choice: полотнища / полотнище
  rationale: יְרִיעָה обозначает отдельный широкий кусок ткани в устройстве святилища. «Полотнище» точнее передаёт конструктивный элемент, чем «занавес», и остаётся понятным современному читателю.
- source_word: לְבָד
  choice: отдельно
  rationale: Слово указывает, что пять полотнищ составляют одну отдельную группу, а шесть — другую.
- source_word: כָפַלְתָּ
  choice: сложи вдвое
  rationale: כָּפַל выражает складывание или удвоение материала; «сложи вдвое» ясно передаёт оба аспекта.
- source_word: הַשִּׁשִּׁית
  choice: шестое
  rationale: Прямое соответствие порядковому числительному, согласованному со словом «полотнище».
- source_word: אֶל מוּל פְּנֵי
  choice: у передней стороны
  rationale: Сочетание описывает расположение сложенного полотнища перед лицевой, входной стороной шатра. Основной вариант звучит естественно по-русски, а более буквальный пространственный оттенок отмечен в сноске.
- source_word: הָאֹהֶל
  choice: шатра
  rationale: В еврейском тексте стоит обычное слово «шатёр», а не специальное обозначение скинии; перевод сохраняет эту лексику.
theological_decisions: []
