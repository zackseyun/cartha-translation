  text: You shall overlay the frames with gold[a], and you shall make their rings of gold as holders for the bars[b], and you shall overlay the bars with gold.
translation:
  language: ru
  text: Брусья[a] обложи золотом, сделай на них золотые кольца — держатели для перекладин[b]. И перекладины обложи золотом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доски»; возможно также: «рамы». Речь идёт о вертикальных конструктивных элементах скинии.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «домами для перекладин», то есть держателями или приёмниками для перекладин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: брусья
  rationale: Кֶרֶשׁ обозначает вертикальные конструктивные элементы скинии. «Брусья» естественно передаёт их несущую функцию; возможны также «доски» или более функциональное «рамы».
- source_word: תְּצַפֶּה / וְצִפִּיתָ
  choice: обложи
  rationale: Глагол צפה в породе пиэль здесь означает покрытие поверхности слоем ценного материала; «обложи золотом» сохраняет ремесленный смысл и естественно звучит по-русски.
- source_word: זָהָב
  choice: золото / золотой
  rationale: Прямое обозначение материала. Все три упоминания в еврейском тексте смыслово сохранены, при этом для колец употреблена естественная русская форма «золотыми».
- source_word: טַבְּעֹתֵיהֶם
  choice: кольца на них
  rationale: טַבַּעַת означает кольцо; местоименный суффикс указывает на принадлежность колец упомянутым брусьям. «На них» естественно выражает это конструктивное отношение.
- source_word: תַּעֲשֶׂה
  choice: сделай
  rationale: Прямой и современный эквивалент общеупотребительного глагола עשה — «делать, изготавливать».
- source_word: בָּתִּים לַבְּרִיחִם
  choice: гнёздами для перекладин
  rationale: Буквально «домами для перекладин». В данном устройстве кольца служат местами, через которые проходят или в которых удерживаются перекладины; «гнёзда» кратко передаёт эту функцию, а буквальный образ отмечен в сноске.
- source_word: הַבְּרִיחִם
  choice: перекладины
  rationale: בְּרִיחַ здесь обозначает горизонтальные элементы, скрепляющие вертикальные брусья. «Перекладины» яснее передаёт их конструктивную функцию, чем общее «шесты».
