base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/021.yaml
  text: 'and their forty bases shall be of silver: two bases under the one frame[b][a], and two bases under the other frame.'
translation:
  language: ru
  text: 'и сорок серебряных оснований[a] для них: два основания под одним брусом[b] и два основания под другим брусом[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «гнёзд»: речь идёт о серебряных опорах с гнёздами, в которые вставлялись брусья скинии.'
    reason: lexical_alternative
  - marker: b
    text: Традиционно также «доской»; еврейское слово обозначает отдельный вертикальный элемент конструкции скинии.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально еврейский текст повторяет: «под одним брусом». По смыслу распределительной конструкции здесь имеется в виду другой брус.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וְאַרְבָּעִים אַדְנֵיהֶם כָּסֶף
  choice: и сорок серебряных оснований для них
  rationale: Союз וְ продолжает описание предыдущего стиха. Именное сочетание передано естественной русской конструкцией; כָּסֶף обозначает материал оснований.
- source_word: אֲדָנִים
  choice: основания
  rationale: В устройстве скинии אֶדֶן — серебряная опора с гнездом, в которую устанавливался вертикальный брус. «Основания» понятно современному читателю и сохраняет строительный смысл.
- source_word: קֶרֶשׁ
  choice: брус
  rationale: Слово обозначает отдельный вертикальный деревянный элемент конструкции скинии. «Брус» точнее передаёт его форму и функцию, чем «рама», которая может восприниматься как составная конструкция.
- source_word: תַּחַת
  choice: под
  rationale: Прямо передаёт пространственное положение серебряных оснований под каждым вертикальным брусом.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: под одним брусом ... под другим брусом
  rationale: Дословно еврейский текст дважды говорит «под одним брусом». В данном распределительном описании второе выражение относится к следующему брусу; «другим» ясно передаёт контраст, а буквальное повторение отмечено в сноске.
