base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/010.yaml
  text: And you shall make fifty loops on the edge of the one curtain[a], the outermost one in the set joined together, and fifty loops on the edge of the second curtain that is joined to it.
translation:
  language: ru
  text: Сделай пятьдесят петель по краю одного полотнища — крайнего в соединённой части, — и пятьдесят петель по краю полотнища второй соединённой части.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во второй части соединения». Еврейское слово обозначает единое целое, образованное соединением полотнищ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Сделай
  rationale: Форма совершенного вида с союзом в контексте предписаний передаёт повеление; русское повелительное наклонение звучит естественно и точно.
- source_word: לֻלָאֹת
  choice: петель
  rationale: Существительное обозначает тканевые петли, посредством которых соединяются полотнища.
- source_word: שְׂפַת
  choice: по краю
  rationale: Буквально «губа», но применительно к ткани естественным русским соответствием является «край».
- source_word: הַיְרִיעָה
  choice: полотнища
  rationale: В описании скинии слово обозначает крупную полосу или полотнище материала; «полотнище» точнее передаёт конструктивную функцию, чем бытовое «занавес».
- source_word: הָאֶחָת הַקִּיצֹנָה
  choice: одного полотнища — крайнего
  rationale: Сохранены как неопределённое числительное «одного», так и указание на крайнее положение этого полотнища.
- source_word: בַּחֹבָרֶת
  choice: в соединённом наборе
  rationale: Слово обозначает составную секцию, образованную соединением нескольких полотнищ; перевод раскрывает одновременно единство и способ образования этой секции.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: второго соединённого набора
  rationale: Сочетание естественнее всего понимать как вторую составную секцию полотнищ; русская формулировка сохраняет порядковое значение הַשֵּׁנִית и связь с корнем «соединять».
