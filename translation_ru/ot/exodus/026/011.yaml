  text: וְ/עָשִׂ֛יתָ קַרְסֵ֥י נְחֹ֖שֶׁת חֲמִשִּׁ֑ים וְ/הֵבֵאתָ֤ אֶת הַ/קְּרָסִים֙ בַּ/לֻּ֣לָאֹ֔ת וְ/חִבַּרְתָּ֥ אֶת הָ/אֹ֖הֶל וְ/הָיָ֥ה אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/011.yaml
  text: And you shall make fifty bronze clasps[a], and put the clasps into the loops, and join the tent together[c][b], so that it may be one.
translation:
  language: ru
  text: Сделай пятьдесят бронзовых застёжек[a], вставь их в петли и скрепи шатёр[b], чтобы он стал единым целым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «медных застёжек». Еврейское נְחֹשֶׁת в зависимости от контекста может обозначать медь или бронзу.'
    reason: lexical_alternative
  - marker: b
    text: То есть соедини отдельные полотнища так, чтобы они образовали один шатёр.
    reason: cultural_note
lexical_decisions:
- source_word: קַרְסֵי נְחֹשֶׁת
  choice: бронзовых застёжек
  rationale: קְרָסִים — крепёжные детали, соединяющие полотнища; «застёжки» точнее передаёт их функцию в данном контексте, чем более общее «крючки». נְחֹשֶׁת может обозначать медь или бронзу; для металлических деталей святилища выбрано традиционное контекстуальное соответствие «бронзовые».
- source_word: חֲמִשִּׁים
  choice: пятьдесят
  rationale: Прямое соответствие количественному числительному, относящемуся к застёжкам.
- source_word: וְהֵבֵאתָ אֶת הַקְּרָסִים בַּלֻּלָאֹת
  choice: вставь их в петли
  rationale: Каузативная форма בוא здесь описывает помещение застёжек внутрь петель. «Вставь» естественно и точно передаёт строительное действие; местоимение устраняет ненужный повтор.
- source_word: וְחִבַּרְתָּ אֶת הָאֹהֶל
  choice: скрепи шатёр
  rationale: חבר означает соединить или скрепить. «Скрепи» передаёт соединение отдельных частей крепёжными деталями, а «шатёр» непосредственно соответствует הָאֹהֶל.
- source_word: וְהָיָה אֶחָד
  choice: чтобы он стал единым целым
  rationale: Фраза выражает результат соединения. Русское «единым целым» естественно передаёт превращение составной конструкции в один шатёр, не добавляя богословского смысла.
