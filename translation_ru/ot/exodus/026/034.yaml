source:
  edition: WLC
  text: וְ/נָתַתָּ֙ אֶת הַ/כַּפֹּ֔רֶת עַ֖ל אֲר֣וֹן הָ/עֵדֻ֑ת בְּ/קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/034.yaml
  text: And you shall place the mercy seat on the ark of the testimony in the Most Holy Place[a][b][c].
translation:
  language: ru
  text: И положи крышку очищения[a] на ковчег свидетельства[b] в Святом святых[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крышку умилостивления»; традиционно также: «очистилище».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ковчег свидетельства»; его также называют ковчегом завета.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «в самом святом месте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: И положи
  rationale: Форма с союзом продолжает последовательность предписаний и по-русски естественно передаётся повелительным наклонением.
- source_word: הַכַּפֹּרֶת
  choice: крышку очищения
  rationale: Предмет является крышкой ковчега и связан с обрядовым очищением; такой перевод передаёт как предметное значение, так и культовую функцию, не превращая его в буквальное «сиденье».
- source_word: עַל
  choice: на
  rationale: Предлог обозначает размещение предмета непосредственно на ковчеге.
- source_word: אֲרוֹן הָעֵדֻת
  choice: ковчег свидетельства
  rationale: Перевод сохраняет прямое значение еврейского הָעֵדֻת — «свидетельство», не подменяя его словом «завет».
- source_word: בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: в Святом святых
  rationale: Устоявшееся и понятное русское обозначение внутреннейшего священного помещения передаёт еврейскую усилительную конструкцию.
theological_decisions:
- issue: Передача названия כַּפֹּרֶת
  choice: крышка очищения
  alternative: крышка умилостивления; очистилище
  rationale: Основной вариант сохраняет материальный характер предмета и его связь с обрядом очищения, не закрепляя спорное богословское толкование корня כפר.
- issue: Передача אֲרוֹן הָעֵדֻת
  choice: ковчег свидетельства
  alternative: ковчег завета
  rationale: В данном стихе еврейский текст говорит именно о «свидетельстве»; традиционное «ковчег завета» здесь было бы гармонизацией.
- issue: Передача קֹדֶשׁ הַקֳּדָשִׁים
  choice: Святое святых
  alternative: самое святое место
  rationale: Традиционная русская формула точно сохраняет еврейский способ выражения превосходной степени и остаётся широко понятной.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской терминологией. Краткость и синтаксическая форма предписания соответствуют контексту устройства святилища.
