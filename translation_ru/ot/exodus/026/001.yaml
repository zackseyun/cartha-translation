  text: And you shall make the tabernacle with ten curtains of finely twisted linen[a], and blue and purple and scarlet yarn; with cherubim, the work of a skillful designer, you shall make them.
translation:
  language: ru
  text: Скинию сделай из десяти полотнищ — из тонкого кручёного льна, голубой, пурпурной и алой пряжи. Сделай их с херувимами, выполненными искусной узорной работой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с искусно вытканными на них херувимами». Еврейское выражение מַעֲשֵׂה חֹשֵׁב означает искусную художественную, узорную работу по ткани, не уточняя однозначно технику исполнения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: скинию
  rationale: «Скиния» — укоренившийся в русском библейском языке термин для священного шатра-жилища; он сохраняет специальное культовое значение слова מִשְׁכָּן.
- source_word: יְרִיעֹת
  choice: полотнищ
  rationale: В данном строительном контексте речь идёт о крупных тканых составных частях покрытия. «Полотнища» точнее передаёт их материальную и конструктивную функцию, чем обычное «занавеси».
- source_word: שֵׁשׁ מָשְׁזָר
  choice: тонкого кручёного льна
  rationale: שֵׁשׁ обозначает тонкий лён, а מָשְׁזָר — скрученные нити; перевод передаёт и материал, и способ изготовления.
- source_word: תְּכֵלֶת
  choice: голубой пряжи
  rationale: Традиционное цветообозначение храмового текстиля; слово «пряжа», выраженное в конце ряда, по смыслу относится ко всем трём цветам.
- source_word: אַרְגָּמָן
  choice: пурпурной пряжи
  rationale: «Пурпурный» сохраняет специальное обозначение дорогого окрашенного материала и уместен в современном литературном русском.
- source_word: תֹלַעַת שָׁנִי
  choice: алой пряжи
  rationale: Выражение обозначает нить или материал ярко-красного, алого цвета; контекст позволяет явно назвать пряжу.
- source_word: כְּרֻבִים
  choice: херувимами
  rationale: Сохранён общепринятый русский библейский термин без привнесения позднейшего образа младенцев-ангелов.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: искусной узорной работы
  rationale: Фраза указывает на художественно задуманную, квалифицированно выполненную работу по ткани, но не вполне однозначно определяет конкретную технику.
- source_word: וְאֶת ... תַּעֲשֶׂה
  choice: Скинию сделай
  rationale: Русский порядок слов выделяет объект, как и еврейская конструкция, а повелительное наклонение естественно передаёт предписание второй личности единственного числа.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение во множественном числе отсылает к десяти полотнищам и явно сохранено во втором предписании.
