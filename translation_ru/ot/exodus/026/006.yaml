  text: And you shall make fifty gold clasps[a], and join the curtains to one another with the clasps, so that the tabernacle may be one.
translation:
  language: ru
  text: Сделай пятьдесят золотых застёжек и соедини ими полотнища друг с другом[a], и скиния станет единым целым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждая к своей сестре»; это еврейский оборот, выражающий взаимное, соответствующее соединение полотнищ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Сделай
  rationale: Перфект с союзом в последовательности предписаний передаёт повеление; форма «сделай» естественна для современного русского языка.
- source_word: חֲמִשִּׁים קַרְסֵי זָהָב
  choice: пятьдесят золотых застёжек
  rationale: קֶרֶס обозначает соединительную деталь для скрепления полотнищ; «застёжки» не уточняет без достаточных оснований их форму, в отличие от «крючков».
- source_word: וְחִבַּרְתָּ
  choice: и соедини
  rationale: Глагол חבר означает соединять, скреплять; выбран прямой и современный русский эквивалент.
- source_word: הַיְרִיעֹת
  choice: полотнища
  rationale: В описании скинии יְרִיעָה — отдельное тканое полотнище; это точнее передаёт конструктивную функцию, чем бытовое «занавеси».
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: друг с другом
  rationale: Буквально «одна женщина к своей сестре» — еврейская идиома взаимного или соответствующего соединения предметов. В основном тексте смысл передан естественно, а буквальный образ сохранён в сноске.
- source_word: בַּקְּרָסִים
  choice: ими … застёжками
  rationale: Предлог ב здесь обозначает орудие действия. Местоименная конструкция позволяет по-русски ясно связать соединение с уже названными застёжками без тяжеловесного повтора.
- source_word: וְהָיָה הַמִּשְׁכָּן אֶחָד
  choice: и скиния станет единым целым
  rationale: Фраза описывает результат соединения полотнищ. «Станет единым целым» естественно выражает возникающее конструктивное единство, сохраняя значение אֶחָד.
theological_decisions:
- issue: Передача הַמִּשְׁכָּן
  choice: скиния
  alternative: жилище
  rationale: «Скиния» — понятный и укоренившийся русский термин для переносного святилища в книге Исход; более общее «жилище» здесь ослабило бы технический смысл.
- issue: Связь заключительной фразы с предписанием
  choice: и скиния станет единым целым
  alternative: чтобы скиния стала единым целым
  rationale: Союзная конструкция וְהָיָה буквально представляет последующий результат. Перевод не превращает её однозначно в целевое придаточное, хотя целевой оттенок в контексте возможен.
translation_notes:
  register: Современный литературный русский язык с сохранением принятого библейского термина «скиния». Предписание изложено прямо и ясно; техническая лексика не перегружена архаизмами.
