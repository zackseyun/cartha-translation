lexical_decisions:
- source_word: הַבְּרִיחַ
  choice: засов
  rationale: В описании скинии בְּרִיחַ обозначает длинную поперечную деталь, скрепляющую вертикальные элементы. «Засов» — традиционный и понятный русский строительный термин; контекст исключает смысл обычного дверного запора.
- source_word: הַתִּיכֹן
  choice: средний
  rationale: Прилагательное указывает на положение этого засова среди остальных; «средний» прямо и естественно передаёт пространственный смысл.
- source_word: בְּתוֹךְ
  choice: внутри
  rationale: Предлог обозначает нахождение в пределах или среди вертикальных деталей, не уточняя сверх текста точный способ их соединения.
- source_word: הַקְּרָשִׁים
  choice: брусья
  rationale: קְרָשִׁים — вертикальные конструктивные элементы скинии. «Брусья» лучше, чем «доски», передаёт их существенную несущую функцию, не представляя их простыми тонкими досками.
- source_word: מַבְרִחַ
  choice: должен проходить
  rationale: Причастная форма описывает засов, протянувшийся вдоль всей конструкции. «Должен проходить» соответствует предписывающему контексту и сохраняет возможный смысл прохождения внутри системы брусьев.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: от одного края до другого
  rationale: Выражение обозначает полный охват длины конструкции; русский оборот естественен и точно сохраняет оба названных предела.
