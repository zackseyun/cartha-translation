  yaml_path: translation/ot/exodus/026/013.yaml
  text: And the extra cubit on this side and the extra cubit on that side[a], from the surplus in the length of the tent curtains, shall hang over the sides of the tabernacle on this side and on that side[b], to cover it.
translation:
  language: ru
  text: Излишек по длине полотнищ шатра — по локтю с одной и с другой стороны[a] — будет свисать с обеих сторон скинии[b], чтобы покрывать её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «локоть с этой стороны и локоть с той стороны». В еврейском тексте слово «локоть» повторяется с указательными оборотами и обозначает оставшуюся меру с каждой стороны.'
    reason: lexical_alternative
  - marker: b
    text: «Скиния» — перевод еврейского мишка́н, то есть священного жилища, находившегося под шатровым покрытием.
    reason: cultural_note
lexical_decisions:
- source_word: הָאַמָּה
  choice: локоть
  rationale: Стандартная древняя мера длины; контекст показывает, что речь идёт об излишке ткани величиной в локоть с каждой стороны.
- source_word: מִזֶּה ... מִזֶּה
  choice: с одной стороны ... с другой
  rationale: Повторяющиеся указательные обороты обозначают две противоположные стороны сооружения; выбран естественный русский эквивалент.
- source_word: בָּעֹדֵף
  choice: излишек
  rationale: Слово обозначает то, что осталось сверх необходимой длины; в данном случае — выступающую часть полотнищ.
- source_word: אֹרֶךְ
  choice: длина
  rationale: Прямое пространственное значение слова в контексте устройства шатра.
- source_word: יְרִיעֹת הָאֹהֶל
  choice: полотнища шатра
  rationale: יְרִיעֹת — отдельные тканевые полотнища, а הָאֹהֶל указывает на покрытие-шатёр; формулировка естественна для описания конструкции.
- source_word: יִהְיֶה סָרוּחַ
  choice: будет свисать
  rationale: Передаёт образ избыточной ткани, спускающейся по сторонам сооружения.
- source_word: צִדֵּי הַמִּשְׁכָּן
  choice: по бокам скинии
  rationale: מִשְׁכָּן обозначает священное жилище под шатровым покрытием; «скиния» — укоренившийся и точный русский библейский термин.
- source_word: לְכַסֹּתוֹ
  choice: чтобы покрывать её
  rationale: 'Инфинитив выражает цель: свисающая ткань служит покрытием скинии.'
