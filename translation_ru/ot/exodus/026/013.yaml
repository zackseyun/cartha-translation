  register: 'Современный литературный русский язык с сохранением традиционного термина «скиния». Порядок компонентов слегка перестроен ради ясности: грамматическим центром сделан «излишек», что естественно передаёт единственное число еврейского сказуемого и не устраняет пространственную конкретику оригинала.'
