base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/033.yaml
  text: And you shall place the veil under the clasps[a], and there, within the veil, you shall bring the ark of the testimony[b]; and the veil shall separate for you between the Holy Place and the Most Holy Place.
translation:
  language: ru
  text: Помести завесу под застёжками и внеси туда, за завесу, ковчег свидетельства[a]. Завеса будет отделять для вас Святое место от Святого святых[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также традиционно: «ковчег завета»; буквально здесь: «ковчег свидетельства».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Наисвятейшее место».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹכֶת
  choice: завеса
  rationale: Обозначает внутреннее полотнище, отделяющее самое святое помещение скинии; «завеса» — естественный и устоявшийся русский термин для такой священной перегородки.
- source_word: קְרָסִים
  choice: застёжки
  rationale: Речь идёт о соединительных деталях, скрепляющих полотнища скинии. «Застёжки» передаёт их функцию, не уточняя без необходимости форму механизма.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: за завесу
  rationale: Выражение указывает на пространство с внутренней стороны завесы. В данном контексте «за завесу» ясно и естественно передаёт направление внесения ковчега.
- source_word: אֲרוֹן הָעֵדוּת
  choice: ковчег свидетельства
  rationale: В еврейском тексте употреблено עֵדוּת, «свидетельство», а не слово «завет»; перевод сохраняет лексику именно этого стиха.
- source_word: וְהִבְדִּילָה
  choice: будет отделять
  rationale: Порода хифиль выражает произведение разделения; эта русская формулировка естественно описывает постоянную функцию завесы.
- source_word: לָכֶם
  choice: для вас
  rationale: Дательный суффикс сохранён, поскольку он прямо присутствует в еврейском тексте и соотносит разделение с устройством богослужения Израиля.
- source_word: הַקֹּדֶשׁ
  choice: Святое место
  rationale: Здесь слово обозначает внешнее священное помещение скинии в противопоставлении внутреннему; название с прописной буквы помогает увидеть пространственное различие.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: Святое святых
  rationale: Формула буквально означает «святое святых» и служит еврейским способом выразить высшую степень святости. Устоявшееся русское название сохраняет как смысл, так и культовое различие помещений.
theological_decisions:
- issue: Название внутреннего святилища
  choice: Святое святых
  alternative: Наисвятейшее место
  rationale: Выбрана устоявшаяся русская библейская формула, прямо отражающая еврейскую конструкцию превосходной степени; в примечании разъясняется её смысл.
- issue: Передача עֵדוּת в названии ковчега
  choice: ковчег свидетельства
  alternative: ковчег завета
  rationale: Перевод следует конкретному слову еврейского текста и не заменяет его более привычным, но отсутствующим здесь словом «завет».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского предписания. Начальные формы повеления переданы прямыми императивами, а функция завесы — будущим временем. Техническая сакральная лексика сохранена без архаизации; повтор слова «завеса» оставлен ради ясности и соответствия еврейскому тексту.
