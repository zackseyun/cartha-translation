lexical_decisions:
- source_word: וּלְצֶלַע
  choice: А для … стороны
  rationale: Союз и предлог вводят следующую строительную спецификацию; צֶלַע здесь означает боковую сторону скинии, а не буквально «ребро».
- source_word: הַמִּשְׁכָּן
  choice: скинии
  rationale: «Скиния» — устоявшееся и понятное русское обозначение священного шатрового святилища в книге Исход.
- source_word: הַשֵּׁנִית
  choice: второй
  rationale: Прилагательное обозначает вторую из двух соответствующих продольных сторон, после стороны, описанной в предыдущем стихе.
- source_word: לִפְאַת צָפוֹן
  choice: с северной стороны
  rationale: Фраза указывает на ориентацию сооружения; выбран естественный русский архитектурный оборот.
- source_word: עֶשְׂרִים
  choice: двадцать
  rationale: Прямое соответствие количественному числительному.
- source_word: קָרֶשׁ
  choice: рам
  rationale: В описании скинии термин обозначает вертикальные несущие элементы стен; «рамы» передаёт вероятную конструктивную функцию, тогда как «брусья» остаётся допустимой альтернативой.
