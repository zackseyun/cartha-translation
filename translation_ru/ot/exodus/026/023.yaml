lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: И ... две
  rationale: Союз и сочетание с числительным продолжают последовательность предписаний; по-русски естественно поставить дополнение после глагола.
- source_word: קְרָשִׁים
  choice: доски
  rationale: В описании скинии слово обозначает деревянные конструктивные элементы стен. «Доски» — традиционный и понятный эквивалент; «рамы» было бы более истолковывающим переводом.
- source_word: תַּעֲשֶׂה
  choice: сделай
  rationale: Форма второго лица единственного числа в контексте предписания имеет повелительную силу; русский императив передаёт её естественно и точно.
- source_word: לִ/מְקֻצְעֹת
  choice: для углов
  rationale: Существительное обозначает углы или места углового соединения; перевод не уточняет без достаточных оснований, что речь именно об особых угловых деталях.
- source_word: הַ/מִּשְׁכָּן
  choice: скинии
  rationale: «Скиния» — укоренившееся русское обозначение священного шатра-жилища в книге Исход и сохраняет культовый контекст термина.
- source_word: בַּ/יַּרְכָתָיִם
  choice: с задней стороны
  rationale: Двойственное число указывает на две задние крайние части; в связи с уже упомянутыми двумя углами естественный русский перевод локализует их в задней части скинии, избегая неясного буквального выражения.
