  yaml_path: translation/ot/exodus/026/008.yaml
  text: The length of each curtain shall be thirty cubits[a], and the width of each curtain four cubits[b]; all eleven curtains shall have one measure.
translation:
  language: ru
  text: Длина каждого полотнища[a] должна составлять тридцать локтей, а ширина — четыре локтя; все одиннадцать полотнищ должны быть одного размера[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «полотнище, одно»; эта еврейская конструкция имеет распределительное значение — речь идёт о каждом полотнище в отдельности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «одна мера», то есть все одиннадцать полотнищ должны быть одинакового размера.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: длина
  rationale: Обычный термин для продольного размера; здесь он образует естественную пару с רֹחַב («ширина»).
- source_word: יְרִיעָה
  choice: полотнище
  rationale: В данном контексте речь идёт об отдельном большом куске ткани, составляющем покрытие скинии. «Полотнище» точнее передаёт материальный предмет, чем «завеса».
- source_word: הָאַחַת / הָאֶחָת
  choice: каждого
  rationale: 'Буквально «одно», но повторённая определённая форма употреблена дистрибутивно: указанные размеры относятся к каждому отдельному полотнищу.'
- source_word: שְׁלֹשִׁים בָּאַמָּה
  choice: тридцать локтей
  rationale: Сохранена древняя единица длины אַמָּה («локоть») без приблизительного пересчёта в современные меры.
- source_word: רֹחַב
  choice: ширина
  rationale: Естественный современный эквивалент, противопоставленный длине.
- source_word: אַרְבַּע בָּאַמָּה
  choice: четыре локтя
  rationale: Прямо передаёт указанную в еврейском тексте меру ширины.
- source_word: מִדָּה אַחַת
  choice: одного размера
  rationale: Буквально «одна мера»; в русском «одного размера» ясно и естественно выражает одинаковые размеры всех полотнищ.
- source_word: לְעַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת
  choice: все одиннадцать полотнищ
  rationale: Предлог לְ обозначает совокупность, к которой относится единая мера; «все» естественно подчёркивает, что утверждение относится ко всему комплекту.
