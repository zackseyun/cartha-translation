  text: וּֽ/לְ/יַרְכְּתֵ֥י הַ/מִּשְׁכָּ֖ן יָ֑מָּ/ה תַּעֲשֶׂ֖ה שִׁשָּׁ֥ה קְרָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/022.yaml
  text: And for the rear side of the tabernacle[a], westward, you shall make six boards.
translation:
  language: ru
  text: А для задней стороны скинии, обращённой на запад, сделай шесть брусьев.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рам». Точная форма этих деревянных конструктивных элементов неясна: это могли быть как сплошные брусья или доски, так и открытые рамы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: А для задней стороны
  rationale: Форма обозначает удалённую, заднюю часть сооружения; такой перевод естественен в архитектурном контексте и сохраняет присоединение к предыдущим указаниям.
- source_word: הַמִּשְׁכָּן
  choice: скинии
  rationale: «Скиния» — устоявшееся и понятное русское обозначение переносного святилища в книге Исход.
- source_word: יָמָּה
  choice: обращённой на запад
  rationale: Наречие буквально указывает направление к морю, то есть на запад; формулировка ясно связывает направление с задней стороной скинии.
- source_word: תַּעֲשֶׂה
  choice: сделай
  rationale: Имперфект второго лица в данном предписании имеет повелительную силу; русский императив передаёт её прямо и естественно.
- source_word: שִׁשָּׁה
  choice: шесть
  rationale: Прямое соответствие количественному числительному.
- source_word: קְרָשִׁים
  choice: брусьев
  rationale: Слово обозначает деревянные конструктивные элементы стен скинии. «Брусья» естественно передаёт их несущую функцию, не утверждая без необходимости, что это сплошные доски.
