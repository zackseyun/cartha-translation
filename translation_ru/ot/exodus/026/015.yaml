  yaml_path: translation/ot/exodus/026/015.yaml
  text: And you shall make the frames for the tabernacle of acacia wood[b][a], standing upright.
translation:
  language: ru
  text: И сделай для скинии вертикальные брусья[a] из древесины акации.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доски»; еврейское слово обозначает деревянные конструктивные элементы скинии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: И сделай
  rationale: Форма с союзом וְ в последовательности предписаний естественно передаётся русским повелительным наклонением; «и» сохраняет связь с предыдущими указаниями.
- source_word: הַקְּרָשִׁים
  choice: брусья
  rationale: Слово обозначает деревянные несущие элементы скинии. «Брусья» конкретно и естественно передаёт их конструктивную функцию; традиционное «доски» дано как допустимая альтернатива в сноске.
- source_word: לַמִּשְׁכָּן
  choice: для скинии
  rationale: «Скиния» — устоявшийся русский эквивалент технического обозначения святилища в книге Исход; предлог לְ здесь выражает назначение.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Сочетание обозначает материал из акациевого дерева. Такая формулировка ясна современному читателю и не использует архаическую транслитерацию названия дерева.
- source_word: עֹמְדִים
  choice: вертикальные
  rationale: Причастие описывает стоячее, вертикальное положение конструктивных элементов. Прилагательное естественно передаёт этот архитектурный смысл по-русски, не превращая описание в отдельное повеление.
