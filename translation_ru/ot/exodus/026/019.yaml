  text: וְ/אַרְבָּעִים֙ אַדְנֵי כֶ֔סֶף תַּעֲשֶׂ֕ה תַּ֖חַת עֶשְׂרִ֣ים הַ/קָּ֑רֶשׁ שְׁנֵ֨י אֲדָנִ֜ים תַּֽחַת הַ/קֶּ֤רֶשׁ הָ/אֶחָד֙ לִ/שְׁתֵּ֣י יְדֹתָ֔י/ו וּ/שְׁנֵ֧י אֲדָנִ֛ים תַּֽחַת הַ/קֶּ֥רֶשׁ הָ/אֶחָ֖ד לִ/שְׁתֵּ֥י יְדֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/019.yaml
  text: 'And you shall make forty silver bases under the twenty frames: two bases under one frame for its two tenons[b][a], and two bases under the next frame for its two tenons.'
translation:
  language: ru
  text: 'И сделай сорок серебряных оснований[a] под двадцать брусьев[b]: два основания под один брус для двух его шипов и два основания под другой брус для двух его шипов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «серебряных гнёзд»; еврейское слово обозначает опорное основание, в которое вставлялся элемент конструкции.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «досок». Еврейское слово здесь обозначает вертикальные конструктивные элементы скинии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  choice: серебряные основания
  rationale: В устройстве скинии אֶדֶן обозначает опорное основание с гнездом. «Основания» ясно передаёт несущую функцию и естественно звучит по-русски; вариант «гнёзда» сохранён в примечании.
- source_word: תַּעֲשֶׂה
  choice: сделай
  rationale: Имперфект 2-го лица единственного числа в ряду предписаний имеет повелительное значение. Русский императив сохраняет прямой характер указания.
- source_word: תַּחַת
  choice: под
  rationale: Предлог непосредственно указывает на расположение оснований под конструктивными элементами.
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ
  choice: брус
  rationale: קֶרֶשׁ здесь обозначает вертикальный конструктивный деревянный элемент скинии. «Брус» точнее передаёт его форму и функцию, чем общее «доска», и не создаёт впечатления, будто каждый элемент был самостоятельной рамой.
- source_word: שְׁנֵי אֲדָנִים
  choice: два основания
  rationale: Повтор выражения указывает, что каждому деревянному элементу соответствовали две опоры; термин переведён последовательно.
- source_word: לִשְׁתֵּי יְדֹתָיו
  choice: для двух его шипов
  rationale: Буквально «для двух его рук»; в данном строительном контексте יָדוֹת — выступающие соединительные части. «Шипы» является точным и понятным столярным термином.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: один брус … другой брус
  rationale: Повтор «один» имеет распределительное значение. Естественная русская формулировка показывает, что описывается одинаковое устройство последовательных брусьев, не меняя смысла.
