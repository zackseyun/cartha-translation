  text: וְ/עָשִׂ֥יתָ אֶת הַ/קְּרָשִׁ֖ים לַ/מִּשְׁכָּ֑ן עֶשְׂרִ֣ים קֶ֔רֶשׁ לִ/פְאַ֖ת נֶ֥גְבָּ/ה תֵימָֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/018.yaml
  text: 'And you shall make the frames for the tabernacle: twenty frames for the south side[a], southward.'
translation:
  language: ru
  text: 'И сделай брусья[a] для скинии: двадцать брусьев для южной стороны, обращённой на юг.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доски». Еврейское слово обозначает конструктивные элементы скинии; их точную форму можно понимать по-разному.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: И сделай
  rationale: Форма с союзом в контексте предписаний передаёт повеление; русское «сделай» ясно и естественно выражает обязательность указания.
- source_word: הַקְּרָשִׁים
  choice: брусья
  rationale: קֶרֶשׁ обозначает вертикальные конструктивные элементы скинии. «Брусья» — конкретный и привычный русский строительный термин, не предрешающий полностью их точную форму.
- source_word: לַמִּשְׁכָּן
  choice: для скинии
  rationale: «Скиния» — устоявшееся и понятное в библейском контексте обозначение переносного святилища; предлог «для» передаёт назначение элементов.
- source_word: עֶשְׂרִים קֶרֶשׁ
  choice: двадцать брусьев
  rationale: После числительного «двадцать» русский язык требует родительного падежа множественного числа.
- source_word: לִפְאַת
  choice: для … стороны
  rationale: В описании сооружения פֵאָה естественно означает одну из его сторон.
- source_word: נֶגְבָּה תֵימָנָה
  choice: южной стороны, обращённой на юг
  rationale: Формулировка сохраняет оба близких по смыслу указания на южное направление, но выражает их естественно по-русски.
