base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/012.yaml
  text: And the overhang that remains from the tent curtains[a]—the half curtain that remains over[b]—shall hang over the back of the tabernacle.
translation:
  language: ru
  text: А излишек, остающийся от полотнищ шатра[a], — половина избыточного полотнища — должен свисать по задней стороне скинии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свисающий остаток от полотнищ шатра».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте различаются «шатёр» — тканое покрытие — и «скиния» — сооружение, служащее жилищем.
    reason: cultural_note
lexical_decisions:
- source_word: סֶרַח הָעֹדֵף
  choice: оставшаяся свисающая часть
  rationale: Сочетание обозначает избыточную, выступающую часть материала; перевод передаёт одновременно остаток и его функцию — свисать.
- source_word: יְרִיעֹת הָאֹהֶל
  choice: полотнища шатра
  rationale: יְרִיעָה здесь означает крупные тканые полотнища покрытия, а אֹהֶל — шатёр или его внешний покров; этот перевод сохраняет архитектурный образ.
- source_word: חֲצִי הַיְרִיעָה הָעֹדֶפֶת
  choice: половина оставшегося полотнища
  rationale: Фраза говорит о половине одного лишнего полотнища; единственное число и значение остатка сохранены.
- source_word: תִּסְרַח
  choice: пусть свисает
  rationale: В данном контексте глагол описывает свисание или протяжение лишней части ткани; форма передаёт предписывающий оттенок еврейского имперфекта.
- source_word: עַל אֲחֹרֵי הַמִּשְׁכָּן
  choice: с задней стороны скинии
  rationale: Выражение указывает на заднюю часть сооружения, вдоль которой должна свисать ткань; по-русски это естественнее, чем буквальное «над задом».
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: Устоявшийся русский эквивалент технического названия переносного святилища; он также позволяет отличить его от названного ранее шатра-покрытия.
