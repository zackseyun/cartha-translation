  register: Современный литературный русский язык с умеренно традиционной библейской терминологией. «Полотнища» точно передаёт крупные элементы тканого покрытия, а «скиния» сохраняет узнаваемый культовый термин. Синтаксис с пояснением между тире воспроизводит повтор и уточнение оригинала без излишней тяжеловесности.
