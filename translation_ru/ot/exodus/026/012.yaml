    rationale: «С задней стороны скинии» обозначает место, но не выражает, что ткань должна лежать или свисать по задней стороне. «По задней стороне» сохраняет этот пространственный образ.
  - severity: low
    issue: Неоднозначно выражена связь «половины» с избыточным полотнищем.
    rationale: «Половина оставшегося полотнища» может означать половину любого сохранённого полотнища. «Половина избыточного полотнища» точнее передаёт חֲצִי הַיְרִיעָה הָעֹדֶפֶת.
