base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/024.yaml
  text: They shall be paired at the bottom[a], and together they shall be complete at its top, to the first ring. So it shall be for both of them[c][b]; they shall be for the two corners.
translation:
  language: ru
  text: Снизу они должны быть соединены попарно[a], а наверху вместе составлять одно целое[b] до одного кольца[c]. Так должно быть с обеими досками; они предназначены для двух углов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «образовывать пару»; еврейское слово описывает две доски как согласованную пару.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «быть целыми (полностью соединёнными)»; речь идёт о целостности конструкции, а не о нравственном совершенстве.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «к единственному кольцу». Точное техническое значение связи досок с этим кольцом не вполне ясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאֲמִים
  choice: сдвоены
  rationale: Слово обозначает предметы, образующие согласованную пару. «Сдвоены» естественно для описания конструкции и не уточняет способ их соединения.
- source_word: מִלְּמַטָּה
  choice: снизу
  rationale: Кратко и ясно обозначает нижнюю часть досок; соответствует пространственному значению еврейского выражения.
- source_word: וְיַחְדָּו
  choice: вместе
  rationale: Передаёт совместное соединение обеих досок без добавления технических подробностей.
- source_word: תַמִּים
  choice: составлять одно целое
  rationale: В данном строительном контексте слово выражает целостность или завершённость конструкции, а не нравственное совершенство.
- source_word: עַל רֹאשׁוֹ
  choice: наверху
  rationale: Буквально «у/на его вершине»; русское «наверху» естественно обозначает верхний конец конструкции и не перегружает фразу неясным единственным местоимением.
- source_word: אֶל הַטַּבַּעַת הָאֶחָת
  choice: у одного кольца
  rationale: Сохраняет числительное «одно» и вероятную пространственную связь верхнего соединения с кольцом, не превращая его без достаточного основания в «первое».
- source_word: כֵּן יִהְיֶה לִשְׁנֵיהֶם
  choice: Так должно быть с обеими досками
  rationale: Явно восстанавливает из контекста подразумеваемые доски и естественно передаёт предписание для обеих.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: на двух углах
  rationale: מִקְצֹעֹת обозначает углы или угловые соединения. Перевод сохраняет общее пространственное значение, не добавляя отсутствующего в стихе уточнения «задних».
