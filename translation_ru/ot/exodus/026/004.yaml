  yaml_path: translation/ot/exodus/026/004.yaml
  text: And you shall make loops of blue on the edge of the one curtain at the end of the first set joined together[c][b][a]; and so you shall do on the edge of the outermost curtain in the second set joined together.
translation:
  language: ru
  text: Сделай петли из синего материала[a] на краю одного полотнища, находящегося на конце первой соединённой группы[b]. Так же сделай на краю крайнего[c] полотнища второй соединённой группы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское תְּכֵלֶת обозначает характерный окрашенный материал синего или сине-пурпурного оттенка, использованный при устройстве скинии; возможны переводы «голубой материал» и «фиолетовый материал».
    reason: lexical_alternative
  - marker: b
    text: Еврейские חֹבָרֶת и מַחְבֶּרֶת обозначают группу полотнищ, соединённых в одно целое; возможный перевод — «соединённая секция».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «находящегося с самого края».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: петли
  rationale: Слово обозначает петлеобразные крепления, которыми полотнища соединялись между собой; «петли» — ясный и точный русский эквивалент.
- source_word: תְּכֵלֶת
  choice: из синей пряжи
  rationale: Термин обозначает характерный синий или сине-пурпурный окрашенный материал. В контексте изготовления петель указание на пряжу естественно передаёт подразумеваемый материал, не сводя слово лишь к абстрактному цвету.
- source_word: שְׂפַת
  choice: по краю
  rationale: В текстильном контексте שָׂפָה означает край или кромку; «по краю» естественно описывает место крепления петель.
- source_word: יְרִיעָה
  choice: полотнище
  rationale: Речь идёт об отдельных тканых частях покрытия скинии. «Полотнище» точнее передаёт конструктивную деталь, чем бытовое «занавес».
- source_word: הָאֶחָת
  choice: того полотнища
  rationale: Еврейское выражение буквально указывает на «одно» полотнище, не называя его первым. Указательная конструкция сохраняет эту соотнесённость и звучит по-русски естественно.
- source_word: מִקָּצָה
  choice: которое находится с краю
  rationale: Форма указывает на положение у конца или края. В сочетании с חֹבָרֶת эта формулировка ясно показывает, что имеется в виду крайнее полотнище соединённой группы.
- source_word: חֹבָרֶת / מַחְבֶּרֶת
  choice: соединённый комплект
  rationale: Оба родственных существительных обозначают группу полотнищ, соединённых в единое целое. Единый перевод сохраняет их смысловую связь и понятен современному читателю.
- source_word: וְכֵן
  choice: так же
  rationale: Выражение вводит параллельное указание сделать вторую деталь тем же способом.
- source_word: הַקִּיצוֹנָה
  choice: крайнего
  rationale: Прилагательное обозначает полотнище, расположенное на конце группы; «крайнее» естественно и не навязывает счётного значения «последнее».
- source_word: הַשֵּׁנִית
  choice: во втором
  rationale: Форма прямо обозначает вторую из двух соединённых групп полотнищ.
