base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/035.yaml
  text: And you shall place the table outside the veil[a], and the lampstand opposite the table on the south side of the tabernacle[b]; and you shall put the table on the north side.
translation:
  language: ru
  text: И поставь стол вне завесы[a], а светильник — напротив стола, у южной стороны скинии[b]; стол же поставь у северной стороны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с внешней стороны занавеса». Еврейское слово обозначает внутреннюю завесу, разделявшую помещения скинии.'
    reason: lexical_alternative
  - marker: b
    text: Евр. менора; здесь переведено «светильник», а не передано транслитерацией.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: И поставь
  rationale: Форма с וְ в данном предписании естественно передаётся русским повелительным «поставь»; глагол שׂוּם обозначает помещение или установку предмета.
- source_word: הַשֻּׁלְחָן
  choice: стол
  rationale: В еврейском тексте назван просто стол; его более полное культовое наименование не следует добавлять из контекста.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: вне завесы
  rationale: מִחוּץ означает нахождение с внешней стороны, а פָּרֹכֶת — внутреннюю разделительную завесу скинии. «Вне завесы» точно и лаконично передаёт пространственное указание.
- source_word: הַמְּנֹרָה
  choice: светильник
  rationale: Здесь מְנוֹרָה — предмет храмовой обстановки с лампадами. Перевод «светильник» передаёт значение существительного без необязательной транслитерации «менора».
- source_word: נֹכַח
  choice: напротив
  rationale: Слово выражает положение одного предмета прямо против другого.
- source_word: עַל צֶלַע הַמִּשְׁכָּן תֵּימָנָה
  choice: у южной стороны скинии
  rationale: צֶלַע означает сторону или бок, а תֵּימָנָה указывает направление к югу. Русское «у южной стороны» естественно описывает размещение внутри скинии вдоль её южной стороны.
- source_word: וְהַשֻּׁלְחָן תִּתֵּן
  choice: стол же поставь
  rationale: נָתַן в контексте размещения утвари означает «поставить, поместить». Частица «же» сохраняет контрастное возвращение к столу.
- source_word: עַל צֶלַע צָפוֹן
  choice: у северной стороны
  rationale: Передаёт расположение стола вдоль северной стороны скинии без тяжеловесного буквального «на стороне севера».
