base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/002.yaml
  text: The length of each curtain shall be twenty-eight cubits[a], and the width of each curtain four cubits[b]; all the curtains shall have one measure.
translation:
  language: ru
  text: Длина каждого полотнища[a] — двадцать восемь локтей, а ширина каждого полотнища — четыре локтя; мера у всех полотнищ одна[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «полотнище, одно ... полотнище, одно»; такая еврейская конструкция указывает на каждое полотнище в отдельности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все полотнища должны быть одной меры».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: длина
  rationale: Обычное обозначение продольного размера в описании устройства святилища.
- source_word: הַיְרִיעָה
  choice: полотнище
  rationale: В данном контексте слово обозначает отдельную большую часть тканевого покрытия; «полотнище» точнее передаёт конструктивную функцию, чем «занавес».
- source_word: הָאַחַת / הָאֶחָת
  choice: каждого
  rationale: 'Буквально «одного», но повторённая еврейская конструкция имеет распределительное значение: размеры относятся к каждому отдельному полотнищу.'
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: двадцать восемь
  rationale: Прямое соответствие количественному числительному.
- source_word: בָּאַמָּה
  choice: локтей
  rationale: «Локоть» — традиционное и понятное русское название древней единицы длины אַמָּה.
- source_word: וְרֹחַב
  choice: а ширина
  rationale: «Ширина» естественно образует пару с «длиной»; союз «а» по-русски ясно вводит второй размер без выраженного противопоставления.
- source_word: אַרְבַּע
  choice: четыре
  rationale: Прямое соответствие количественному числительному.
- source_word: מִדָּה אַחַת
  choice: мера одна
  rationale: Сохраняет буквальную формулировку «одна мера» и одновременно выражает одинаковость размеров всех полотнищ.
- source_word: לְכָל הַיְרִיעֹת
  choice: у всех полотнищ
  rationale: Естественная русская конструкция для единого стандарта, относящегося ко всему набору полотнищ.
