  text: וְ/עָשִׂ֣יתָ לַ/מָּסָ֗ךְ חֲמִשָּׁה֙ עַמּוּדֵ֣י שִׁטִּ֔ים וְ/צִפִּיתָ֤ אֹתָ/ם֙ זָהָ֔ב וָוֵי/הֶ֖ם זָהָ֑ב וְ/יָצַקְתָּ֣ לָ/הֶ֔ם חֲמִשָּׁ֖ה אַדְנֵ֥י נְחֹֽשֶׁת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/037.yaml
  text: And you shall make for the screen five pillars of acacia wood[a], and overlay them with gold; their hooks shall be of gold[b]; and you shall cast for them five bases of bronze.
translation:
  language: ru
  text: И сделай для завесы пять столбов из акации[a] и обложи их золотом; крючки на них пусть будут золотыми. И отлей для них пять бронзовых оснований.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть для входной завесы скинии, в отличие от внутренней завесы перед Святым святых.
    reason: lexical_clarification
lexical_decisions:
- source_word: מָּסָךְ
  choice: завеса
  rationale: В данном контексте это тканевая завеса у входа в скинию, отличная от внутренней завесы перед Святым святых; естественное русское соответствие — «завеса», а различие поясняется в сноске.
- source_word: עַמּוּדֵי שִׁטִּים
  choice: столбов из акации
  rationale: עַמּוּדִים обозначает несущие столбы, а שִׁטִּים — акацию, древесина которой используется в устройстве скинии.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: обложи их золотом
  rationale: Глагол צפה в описании священных принадлежностей означает покрытие основы металлической облицовкой; «обложи золотом» сохраняет конкретный строительный смысл и звучит естественно по-русски.
- source_word: וָוֵיהֶם
  choice: крючки на них
  rationale: וָוִים здесь, вероятнее всего, обозначает крючки для крепления входной завесы; оборот «на них» ясно соотносит их со столбами.
- source_word: אַדְנֵי נְחֹשֶׁת
  choice: бронзовых оснований
  rationale: אַדָן — опорное основание или гнездо для столба; «основание» понятно современному читателю, а возможный более технический смысл отмечен не обязательно, поскольку контекст ясен.
- source_word: נְחֹשֶׁת
  choice: бронзовых
  rationale: В описаниях материалов скинии נְחֹשֶׁת традиционно и историко-материально уместно передавать как «бронза», а не «латунь».
- source_word: וְיָצַקְתָּ לָהֶם
  choice: отлей для них
  rationale: יצק означает отливку металлических предметов, а לָהֶם показывает, что основания изготовляются для столбов.
