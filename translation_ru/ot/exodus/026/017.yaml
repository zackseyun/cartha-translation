  text: Each board is to have two tenons joined one to another[a]; this is how you shall make all the boards of the tabernacle.
translation:
  language: ru
  text: У каждой доски должно быть по два шипа, соединённые друг с другом[a]. Так сделай все доски скинии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «две руки для одной доски, соединённые — женщина с её сестрой». Здесь «руки» означают выступающие соединительные части, то есть шипы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹת
  choice: шипа
  rationale: Буквально «руки»; в данном строительном контексте речь о выступающих соединительных частях доски. Русский столярный термин «шипы» ясно передаёт их назначение.
- source_word: מְשֻׁלָּבֹת
  choice: соединённых
  rationale: Причастие обозначает взаимное соединение или сопряжение выступов, не уточняя сверх текста точный способ устройства.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: один с другим
  rationale: Буквально «женщина к своей сестре» — устойчивый способ выразить соответствие двух однородных частей. Выбран естественный русский эквивалент, сохраняющий попарность.
- source_word: קֶרֶשׁ
  choice: доска
  rationale: Обозначает вертикальный деревянный элемент конструкции скинии; «доска» остаётся прозрачным и не переуточняющим соответствием.
- source_word: מִשְׁכָּן
  choice: скиния
  rationale: В контексте Исхода это закрепившееся обозначение переносного святилища; слово уместно в современном литературном библейском регистре.
- source_word: כֵּן תַּעֲשֶׂה
  choice: Так сделай
  rationale: Кратко и естественно передаёт указание следовать описанному образцу.
- source_word: שְׁתֵּי
  choice: два
  rationale: Прямое соответствие числительному.
- source_word: לַקֶּרֶשׁ הָאֶחָד
  choice: у каждой доски
  rationale: Формально «у одной доски», но в контексте оборот имеет распределительное значение, подтверждённое заключительным указанием обо всех досках.
