- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: полтора локтя
  rationale: Естественная современная русская передача буквального выражения «локоть и половина локтя», точно сохраняющая величину.
- source_word: רֹחַב
  choice: ширина
  rationale: Ясный современный эквивалент термина, обозначающего поперечный размер.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: каждой рамы
  rationale: Определённая форма единственного числа с אֶחָד здесь задаёт размер одного элемента из ряда; русское «каждой» естественно выражает распределительное значение.
