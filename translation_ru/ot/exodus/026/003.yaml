lexical_decisions:
- source_word: יְרִיעֹת
  choice: полотнищ
  rationale: В контексте устройства скинии слово обозначает большие тканые полотна. «Полотнища» естественно передаёт их материальную и конструктивную функцию, не вызывая бытовых ассоциаций слова «занавеси».
- source_word: תִּהְיֶיןָ
  choice: пусть будут
  rationale: Имперфект היה в составе предписаний выражает требуемое устройство; «пусть будут» сохраняет предписывающий оттенок и звучит естественно по-русски.
- source_word: חֹבְרֹת
  choice: соединены
  rationale: Причастная форма от חבר означает соединение отдельных частей. «Соединены» ясно и уместно в строительной инструкции.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: одно с другим
  rationale: Буквально «женщина к своей сестре» — древнееврейский оборот о соответствующих предметах женского рода. Русское «одно с другим» передаёт взаимное соединение полотнищ без неуместного олицетворения.
- source_word: חֲמֵשׁ ... וְחָמֵשׁ
  choice: Пять ... и пять
  rationale: Повтор числительного сохраняет симметричное деление десяти полотнищ на две группы по пять и точно следует структуре еврейского текста.
