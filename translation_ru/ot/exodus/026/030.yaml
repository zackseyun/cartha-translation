  text: And you shall set up the tabernacle according to its ordinance[a], which you were shown on the mountain.
translation:
  language: ru
  text: И поставь скинию по образцу, показанному тебе на горе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «который ты видел на горе».'
    reason: Сноска сохраняет активную форму еврейского выражения, тогда как основной текст идиоматически передаёт подразумеваемое показывание.
lexical_decisions:
- source_word: וַהֲקֵמֹתָ
  choice: И поставь
  rationale: Порода hифиль глагола קום означает «поставить, воздвигнуть». В данном контексте форма имеет предписывающую силу; «поставь» естественно описывает сооружение скинии.
- source_word: הַמִּשְׁכָּן
  choice: скинию
  rationale: «Скиния» — устоявшееся и точное русское обозначение священного шатра в книге Исход; оно позволяет отличить его от обычного жилища.
- source_word: כְּמִשְׁפָּטוֹ
  choice: в соответствии с установленным для неё устройством
  rationale: מִשְׁפָּט здесь обозначает предписанный порядок или способ устройства. Перевод сохраняет оттенок установленной нормы и при этом естественно звучит в контексте сооружения; местоименный суффикс отнесён к скинии.
- source_word: אֲשֶׁר הָרְאֵיתָ
  choice: которое было показано тебе
  rationale: Еврейская форма буквально означает «которое ты видел», однако русский пассив естественно передаёт подразумеваемое показывание Моисею. Буквальная форма приведена в сноске.
- source_word: בָּהָר
  choice: на горе
  rationale: Предлог בְּ в данном местном значении естественно передаётся по-русски как «на».
