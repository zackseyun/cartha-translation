  text: And you shall make for the tent a covering of rams’ skins dyed red[a], and a covering of tahash skins above.
translation:
  language: ru
  text: И сделай для шатра покрытие из бараньих кож, окрашенных в красный цвет, а сверху — покрытие из кож тахаша[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Значение еврейского слова «тахаш» точно не установлено. Оно может обозначать определённое животное или разновидность прочной кожи; среди предлагаемых переводов — «выделанная кожа», «шкуры морских свиней» и «шкуры дюгоней».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: И сделай
  rationale: Форма перфекта с союзом в последовательности предписаний передаёт повеление; русский императив естественно и ясно выражает эту силу.
- source_word: מִכְסֶה
  choice: покрытие
  rationale: Существительное обозначает защитный покров или слой; «покрытие» точно и естественно в контексте устройства шатра.
- source_word: לָאֹהֶל
  choice: для шатра
  rationale: אֹהֶל буквально означает «шатёр»; предлог «для» соответствует ל и не подменяет обычное существительное более специальным термином «скиния».
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: из бараньих кож, окрашенных в красный цвет
  rationale: Фраза называет кожи баранов и характеризует их как сделанные красными; такая формулировка ясно передаёт вероятную обработку материала.
- source_word: וּמִכְסֵה
  choice: а … покрытие
  rationale: Союз вводит следующий, расположенный выше слой; «а» естественно различает два покрытия без добавления отсутствующего в еврейском слова «другое».
- source_word: עֹרֹת תְּחָשִׁים
  choice: из кож тахашей
  rationale: Точное значение תְּחָשִׁים неизвестно. Транслитерация сохраняет лексическую неопределённость и не навязывает спорное отождествление животного или вида кожи.
- source_word: מִלְמָעְלָה
  choice: сверху
  rationale: Наречное выражение указывает на верхнее положение второго покрытия; «сверху» передаёт это без добавления явного указательного местоимения.
