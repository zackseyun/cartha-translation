revisions:
- from: И повесь её на четырёх столбах из древесины акации, покрытых золотом; их крючки пусть будут золотыми. Столбы поставь на четыре серебряных основания.[a]
  to: И повесь её на четырёх столбах из древесины акации, покрытых золотом, с золотыми крючками, стоящих на четырёх серебряных основаниях.[a]
  rationale: Перевод приведён к одной повелительной конструкции, как в еврейском тексте. Серебряные основания синтаксически связаны со столбами, а не представлены как предмет второго отдельного распоряжения. Сохранены все материальные и конструктивные характеристики оригинала и сноска с лексической альтернативой.
