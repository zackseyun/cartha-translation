base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/032.yaml
  text: And you shall hang it on four pillars of acacia wood overlaid with gold[a], their hooks being of gold, on four silver bases.
translation:
  language: ru
  text: И повесь её на четырёх столбах из древесины акации, покрытых золотом, с золотыми крючками, стоящих на четырёх серебряных основаниях.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «серебряных гнёздах».'
    reason: Еврейское אַדְנֵי обозначает опорные детали для столбов; «гнёзда» — допустимый вариант, подчёркивающий их функцию как мест установки.
lexical_decisions:
- source_word: וְנָתַתָּה אֹתָהּ
  choice: И повесь её
  rationale: Хотя נתן буквально имеет широкое значение «дать, поместить», здесь речь о завесе и столбах с крючками, поэтому «повесь» естественно и точно передаёт действие. Женское местоимение «её» отсылает к завесе из предыдущего стиха.
- source_word: עַל אַרְבָּעָה עַמּוּדֵי שִׁטִּים
  choice: на четырёх столбах из древесины акации
  rationale: עמוד обозначает вертикальную опору; «столб» уместен для конструкции святилища. שׁטים указывает на материал, поэтому выбрано ясное «древесина акации».
- source_word: מְצֻפִּים זָהָב
  choice: покрытых золотом
  rationale: Причастие от צפה описывает нанесённое золотое покрытие; современное русское «покрытых золотом» естественно и не уточняет без необходимости технику покрытия.
- source_word: וָוֵיהֶם זָהָב
  choice: их крючки пусть будут золотыми
  rationale: וָוִים здесь — приспособления на столбах для подвешивания завесы, поэтому «крючки» передаёт их функцию. Именное предложение естественно выражено предписанием «пусть будут».
- source_word: עַל אַרְבָּעָה אַדְנֵי כָסֶף
  choice: Столбы поставь на четыре серебряных основания
  rationale: אדן — нижняя опора или гнездо для столба. «Основания» понятно современному читателю; подразумеваемое «столбы» повторено ради ясности русской синтаксической связи.
