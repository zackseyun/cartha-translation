translation:
  language: ru
  text: и пять перекладин для досок второй стороны скинии[a], и пять перекладин для досок задней, западной стороны скинии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «другой стороны скинии».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для задней части, к западу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: перекладины
  rationale: В описании скинии это горизонтальные брусья, скрепляющие доски; «перекладины» ясно передаёт их конструктивную функцию, не добавляя лишних деталей.
- source_word: קַרְשֵׁי
  choice: доски
  rationale: קֶרֶשׁ обозначает деревянные конструктивные элементы скинии; «доски» — точный и традиционно понятный русский эквивалент.
- source_word: צֶלַע
  choice: сторона
  rationale: В архитектурном контексте слово обозначает боковую сторону сооружения.
- source_word: הַשֵּׁנִית
  choice: вторая
  rationale: Сохранено прямое значение порядкового прилагательного; по контексту имеется в виду другая, противоположная сторона.
- source_word: מִּשְׁכָּן
  choice: скиния
  rationale: В Исходе это устойчивое обозначение священного шатра; «скиния» сохраняет точность и узнаваемость термина в русском библейском языке.
- source_word: לַיַּרְכָתַיִם
  choice: задняя сторона
  rationale: В данном описании слово указывает на дальнюю, тыльную часть скинии; по-русски это естественно выражается как «задняя сторона».
- source_word: יָמָּה
  choice: с западной стороны
  rationale: Направительное наречие означает «к западу / на запад»; в описании расположения конструктивной части естественно «с западной стороны».
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: и пять ... и пять
  rationale: Повтор союза и числительного сохранён, чтобы передать перечислительную структуру еврейского текста.
