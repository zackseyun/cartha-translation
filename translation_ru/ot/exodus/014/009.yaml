  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Длинная еврейская конструкция разделена на два предложения для ясности; повтор «настигло их» сохраняет связь перечня египетских сил с главным действием. Географические имена даны в привычных русских библейских формах.
