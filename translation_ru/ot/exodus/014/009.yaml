base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/009.yaml
  text: The Egyptians pursued them and overtook them as they were camped by the sea—all Pharaoh’s horses and chariots[a], his horsemen, and his army—by Pi-hahiroth, before Baal-zephon.
translation:
  language: ru
  text: 'Египтяне погнались за ними и настигли их, когда они расположились лагерем у моря: все кони и колесницы фараона, его всадники и войско — у Пи-Гахирофа, перед Ваал-Цефоном[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напротив Ваал-Цефона». Еврейское выражение может обозначать положение напротив ориентира.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ מִצְרַיִם אַחֲרֵיהֶם
  choice: Египтяне погнались за ними
  rationale: Глагол רדף обозначает преследование; «погнались» естественно передаёт начало энергичного военного преследования в повествовательном контексте.
- source_word: וַיַּשִּׂיגוּ אוֹתָם
  choice: настигли их
  rationale: נשׂג здесь означает догнать, настичь; «настигли» кратко и точно передаёт результат преследования.
- source_word: חֹנִים עַל הַיָּם
  choice: когда те стояли лагерем у моря
  rationale: Причастие חֹנִים описывает состояние израильтян в момент прибытия египтян. Указательное «те» устраняет возможную двусмысленность русского предложения.
- source_word: כָּל סוּס רֶכֶב פַּרְעֹה
  choice: все его колесничные кони, колесницы
  rationale: Еврейское сочетание сжато и буквально указывает на коней колесничного войска фараона. В русском оно умеренно развёрнуто, чтобы естественно представить состав преследующей силы, не сводя выражение только к коням.
- source_word: וּפָרָשָׁיו
  choice: и всадники
  rationale: פָּרָשׁ обозначает конного воина; «всадники» — прозрачный современный эквивалент без лишней военно-исторической конкретизации.
- source_word: וְחֵילוֹ
  choice: Всё войско фараона
  rationale: חַיִל в данном контексте означает военную силу, войско. В русском словосочетание вынесено перед поясняющим перечнем ради ясности и естественного порядка слов.
- source_word: עַל פִּי הַחִירֹת
  choice: у Пи-Гахирофа
  rationale: Предлог имеет местное значение; название передано в форме, привычной для русской библейской традиции.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: перед Ваал-Цефоном
  rationale: לִפְנֵי в пространственном употреблении значит «перед», «напротив». Основной текст сохраняет прямой и традиционно понятный вариант, а альтернатива отмечена в сноске.
