  text: וְ/חִזַּקְתִּ֣י אֶת לֵב פַּרְעֹה֮ וְ/רָדַ֣ף אַחֲרֵי/הֶם֒ וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ וְ/יָדְע֥וּ מִצְרַ֖יִם כִּֽי אֲנִ֣י יְהוָ֑ה וַ/יַּֽעֲשׂוּ כֵֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/004.yaml
  text: And I will harden Pharaoh’s heart[a], and he will pursue them; and I will get glory over Pharaoh and over all his army[b], and the Egyptians will know that I am Yahweh.” And they did so.
translation:
  language: ru
  text: «А Я ожесточу сердце фараона[a], и он погонится за ними. Я прославлюсь над фараоном и над всем его войском[b], и египтяне узнают, что Я — Яхве». И они так и сделали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «укреплю сердце фараона», «сделаю сердце фараона твёрдым». Еврейский глагол может означать «делать сильным, твёрдым»; в повествовании Исхода такая твёрдость проявляется как упорное неповиновение, поэтому в тексте сказано «ожесточу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я прославлюсь через фараона и через всё его войско». Еврейское выражение означает, что в последующих событиях Яхве обретёт славу и явит Своё величие в отношении фараона и его войска.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי
  choice: Я ожесточу
  rationale: Порода hифиль глагола חזק буквально выражает придание силы или твёрдости; в данном повествовательном контексте речь идёт об упорстве фараона. «Ожесточу» естественно передаёт этот смысл, не ослабляя прямую причинную роль Яхве.
- source_word: לֵב פַּרְעֹה
  choice: сердце фараона
  rationale: «Сердце» сохраняет еврейский образ внутреннего средоточия воли и решений; замена на «разум» или «волю» неоправданно сужала бы значение.
- source_word: וְרָדַף אַחֲרֵיהֶם
  choice: и он погонится за ними
  rationale: Глагол רדף с אַחֲרֵי обозначает преследование; «погонится за ними» — ясное и естественное выражение начала военной погони.
- source_word: וְאִכָּבְדָה בְּפַרְעֹה
  choice: Я прославлюсь над фараоном
  rationale: Форма от כבד выражает обретение славы или явление величия, а בְּ связывает это с фараоном. В контексте суда «над фараоном» передаёт оттенок торжества, хотя грамматически возможно понимание «через фараона».
- source_word: וּבְכָל חֵילוֹ
  choice: и над всем его войском
  rationale: חַיִל здесь обозначает военную силу фараона; современное русское «войско» точно и стилистически уместно.
- source_word: וְיָדְעוּ מִצְרַיִם
  choice: и египтяне узнают
  rationale: При множественном сказуемом название страны имеет собирательный смысл; по-русски естественно назвать её жителей — «египтяне».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени тетраграмматона транслитерацией сохраняет отличие имени Бога от титула «Господь».
- source_word: וַיַּעֲשׂוּ כֵן
  choice: И они так и сделали
  rationale: Естественное русское повествовательное завершение, указывающее на исполнение данного повеления.
theological_decisions:
- issue: Действие Бога в ожесточении сердца фараона
  choice: «Я ожесточу сердце фараона»
  alternative: «Я укреплю сердце фараона» или «Я допущу, чтобы сердце фараона ожесточилось»
  rationale: Первое лицо hифиля прямо называет Яхве действующим субъектом. Перевод не превращает причинное действие в простое попущение, но сноска сохраняет буквальный оттенок придания твёрдости.
- issue: Прославление Яхве в суде над фараоном
  choice: «Я прославлюсь над фараоном»
  alternative: «Я прославлюсь через фараона»
  rationale: Контекст предстоящего поражения фараона поддерживает оттенок торжества над ним, однако конструкция допускает более инструментальное понимание; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены традиционный образ «сердца», личное имя «Яхве» и прямая речь от первого лица. Формулировки понятны широкому читателю; подлинные лексические неоднозначности вынесены в сноски без догматического сглаживания.
