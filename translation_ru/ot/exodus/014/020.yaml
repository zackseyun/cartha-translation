  text: וַ/יָּבֹ֞א בֵּ֣ין מַחֲנֵ֣ה מִצְרַ֗יִם וּ/בֵין֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יְהִ֤י הֶֽ/עָנָן֙ וְ/הַ/חֹ֔שֶׁךְ וַ/יָּ֖אֶר אֶת הַ/לָּ֑יְלָה וְ/לֹא קָרַ֥ב זֶ֛ה אֶל זֶ֖ה כָּל הַ/לָּֽיְלָה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/020.yaml
  text: And it came between the camp of Egypt and the camp of Israel[a], and there was the cloud and the darkness, yet it lit up the night; and the one did not come near the other all night.
translation:
  language: ru
  text: Он оказался между станом Египта и станом Израиля. Были облако и тьма, и оно освещало ночь[a]; один не приближался к другому всю ночь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Были облако и тьма, а оно освещало ночь». Еврейский текст здесь предельно краток; древние версии и переводы по-разному передают соотношение тьмы и света с двумя станами.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Он встал
  rationale: Глагол описывает перемещение и занятие положения между двумя станами. Местоимение «он» грамматически допускает связь и с ангелом, и со столпом из предыдущего стиха, не устраняя неоднозначность контекста.
- source_word: בֵּין ... וּבֵין
  choice: между ... и ...
  rationale: Прямое и естественное обозначение пространственного положения.
- source_word: מַחֲנֵה
  choice: стан
  rationale: В данном повествовательном и военном контексте «стан» обозначает как расположившийся народ или войско, так и место их стоянки; слово сохраняет торжественный, но понятный библейский регистр.
- source_word: מִצְרַיִם ... יִשְׂרָאֵל
  choice: Египта ... Израиля
  rationale: Сохранены названия стран и народов в еврейской конструкции «стан Египта / стан Израиля», без замены на «египтян / израильтян».
- source_word: וַיְהִי הֶעָנָן וְהַחֹשֶׁךְ
  choice: Было облако и тьма
  rationale: Сохранена краткая и необычная структура масоретского текста, не уточняющая безусловно, как облако и тьма соотносились с каждым из станов.
- source_word: וַיָּאֶר אֶת־הַלָּיְלָה
  choice: но оно освещало ночь
  rationale: Глагол אור передан как «освещало»; противительный союз естественно выражает контраст с предшествующей тьмой. Местоимение не конкретизирует сверх текста, было ли источником света облако или проявленное в нём присутствие.
- source_word: וְלֹא קָרַב זֶה אֶל־זֶה
  choice: и один стан не приближался к другому
  rationale: Идиома «этот к этому» выражает невозможность сближения двух ранее названных станов; явное слово «стан» устраняет неестественную для русского языка двусмысленность.
- source_word: כָּל־הַלָּיְלָה
  choice: всю ночь
  rationale: Краткое и точное обозначение продолжительности.
theological_decisions:
- issue: К кому относятся глаголы единственного числа в начале стиха
  choice: «Он» без явного наименования субъекта
  alternative: Назвать прямо ангела Бога, облако или столп
  rationale: В предыдущем контексте названы и ангел Бога, и облачный столп. Русское мужское местоимение может относиться к обоим существительным («ангел», «столп») и тем самым сохраняет неоднозначность еврейского повествования.
- issue: Соотношение облака, тьмы и света
  choice: 'Сохранить масоретскую последовательность: облако и тьма, но освещение ночи'
  alternative: Распределить тьму и свет между египетским и израильским станами
  rationale: Еврейский текст краток и допускает разные способы понимания; основной перевод не добавляет явного распределения явлений между двумя станами.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным словом «стан». Синтаксис сделан ясным, но намеренная краткость и смысловая напряжённость еврейского текста сохранены.
