revisions:
- from: Он встал между станом Египта и станом Израиля. Было облако и тьма, но оно освещало ночь[a], и один стан не приближался к другому всю ночь.
  to: Он оказался между станом Египта и станом Израиля. Были облако и тьма, и оно освещало ночь[a]; один не приближался к другому всю ночь.
  rationale: «Оказался между» исправляет добавленное в черновике значение «встал», сохраняя повествовательное движение и не называя спорный референт. Союз «и» вместо «но» не предрешает характер соотношения тьмы и освещения. Сноска сохранена как указание на переводческую неопределённость, но её формулировка приведена в соответствие с еврейским прямым дополнением «ночь».
