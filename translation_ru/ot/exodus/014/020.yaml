    rationale: «Встал» добавляет значение занятия неподвижного положения. Исходный глагол значит «пришёл»; в данном контексте естественная русская передача «оказался между» передаёт результат движения без такого добавления.
  - severity: medium
    issue: Явное «но» перед «оно освещало ночь»
    rationale: Противопоставление возможно как толкование, но союз в еврейском тексте отсутствует. Поскольку связь облака, тьмы и света текстологически и переводчески оспаривается, основной текст не должен навязывать противительный характер.
  - severity: low
    issue: Сноска передаёт אֶת־הַלָּיְלָה как «а ночью»
    rationale: 'В основной строке ночь является прямым объектом: «освещало ночь». Вариант в сноске лучше сохранить в той же объектной форме: «оно освещало ночь», не превращая её в обстоятельство времени.'
