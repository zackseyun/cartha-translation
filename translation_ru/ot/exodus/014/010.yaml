base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/010.yaml
  text: As Pharaoh drew near[a], the sons of Israel lifted up their eyes, and behold, the Egyptians were marching after them; and they were very afraid[b], and the sons of Israel cried out to Yahweh.
translation:
  language: ru
  text: Когда фараон приблизился, сыны Израиля[a] подняли глаза — и вот, египтяне[b] идут следом за ними. Они очень испугались, и сыны Израиля воззвали к Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально: «сыны Израиля»; это обозначение всего народа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Египет»; название страны здесь собирательно обозначает египетские силы.'
    reason: source_form
lexical_decisions:
- source_word: הִקְרִיב
  choice: приблизился
  rationale: 'Порода хифиль здесь имеет непереходное значение: фараон сам приблизился, а не «приблизил» что-либо.'
- source_word: וַיִּשְׂאוּ ... אֶת עֵינֵיהֶם
  choice: подняли глаза
  rationale: Сохранён понятный по-русски еврейский оборот, обозначающий направленный вверх или вдаль взгляд.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Передаёт внезапность увиденного и драматическую непосредственность повествования.
- source_word: מִצְרַיִם
  choice: египтяне
  rationale: В еврейском тексте буквально стоит название «Египет», но здесь оно собирательно обозначает идущее за израильтянами египетское войско; по-русски естественнее «египтяне».
- source_word: נֹסֵעַ אַחֲרֵיהֶם
  choice: идут следом за ними
  rationale: Передаёт движение египетских сил за израильтянами, не усиливая глагол до более истолковывающего «преследуют».
- source_word: וַיִּירְאוּ מְאֹד
  choice: очень испугались
  rationale: Естественно передаёт глагол страха с усилителем מְאֹד.
- source_word: וַיִּצְעֲקוּ
  choice: воззвали
  rationale: Передаёт громкий, настойчивый крик о помощи и сохраняет достойный библейский регистр без чрезмерной архаики.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранено буквальное корпоративное обозначение народа; оно понятно в современном литературном русском и соответствует мужской форме оригинала.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В оригинале употреблено собственное имя Бога, поэтому оно не заменяется титулом.
- issue: Корпоративное выражение בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Выражение буквально означает «сыны Израиля» и выступает как название всего народа; перевод сохраняет его форму, не ограничивая референцию только мужчинами.
- issue: Собирательное употребление מִצְרַיִם
  choice: египтяне
  alternative: Египет
  rationale: Контекст указывает на египетскую силу, движущуюся за Израилем. Русское множественное число ясно передаёт собирательный смысл, не уточняя сверх текста состав войска.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Обороты «подняли глаза», «и вот» и «воззвали» сохраняют повествовательную выразительность оригинала, оставаясь понятными широкому читателю.
