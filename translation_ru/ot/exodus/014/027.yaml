base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/027.yaml
  text: So Moses stretched out his hand over the sea[a], and toward morning the sea returned to its usual place, while the Egyptians were fleeing toward it[b]. And Yahweh threw the Egyptians into the midst of the sea.
translation:
  language: ru
  text: И простёр Моисей руку над морем, и к утру море вернулось в своё обычное состояние[a], а египтяне бежали ему навстречу. И Яхве бросил[b] египтян в самую середину моря.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вернулось к своей прежней силе» или «к своему прежнему состоянию». Еврейское выражение указывает на восстановление устойчивого, обычного состояния моря.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «стряхнул» или «вытряхнул». Еврейский глагол создаёт яркий образ того, как Яхве низверг египтян в море.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: простёр
  rationale: Глагол נטה в сочетании с «рукой» означает протянуть или простереть её; «простёр» естественно для возвышенного повествовательного регистра.
- source_word: הַיָּם
  choice: море
  rationale: Обычное нарицательное обозначение моря; сам стих не требует передачи как имени собственного.
- source_word: וַיָּשָׁב הַיָּם
  choice: море вернулось
  rationale: שׁוב обозначает возвращение к прежнему состоянию; русский глагол сохраняет эту направленность.
- source_word: לִפְנוֹת בֹּקֶר
  choice: к утру
  rationale: Идиоматическое обозначение наступления утра; краткая и естественная русская передача.
- source_word: לְאֵיתָנוֹ
  choice: в своё обычное состояние
  rationale: אֵיתָן здесь допускает оттенки устойчивости, силы и прежнего состояния. Формулировка описывает восстановление нормального состояния моря, не сводя смысл только к течению или силе.
- source_word: נָסִים לִקְרָאתוֹ
  choice: бежали ему навстречу
  rationale: Причастие передаёт продолжающееся бегство, а לִקְרָאתוֹ буквально выражает движение навстречу морю; яркая и намеренно парадоксальная картина сохранена.
- source_word: וַיְנַעֵר
  choice: стряхнул
  rationale: נער буквально означает «стряхивать, вытряхивать»; сохранён яркий образ, а не сглаженное «низверг» или «бросил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом.
- source_word: בְּתוֹךְ הַיָּם
  choice: в самую середину моря
  rationale: תּוֹךְ указывает на внутреннюю часть или середину; контекст и глагол позволяют естественно выразить направленность движения.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Сохранены образность глагола «стряхнул» и смысловая напряжённость выражения «бежали ему навстречу»; синтаксис остаётся доступным для обычного читателя.
