    issue: Неестественная сочетаемость «стряхнул египтян в самую середину моря».
    rationale: Еврейский נער сохраняет образ встряхивания/вытряхивания, но русское «стряхнуть кого-либо в…» предполагает не названную опору или поверхность. «Бросил» естественно передаёт действие в основном тексте; буквальный образ надёжнее пояснить сноской.
  - severity: low
