  text: And the sons of Israel went into the midst of the sea on the dry ground[a], and the waters were a wall to them on their right and on their left.
translation:
  language: ru
  text: И вошли сыны Израиля в середину моря по суше, а воды были им стеной справа и слева.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: вошли
  rationale: В данном повествовательном контексте בוא обозначает движение внутрь места; «вошли» естественно и точно передаёт направленность.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет буквальный мужской собирательный оборот еврейского текста и его торжественный повествовательный регистр.
- source_word: בְּתוֹךְ הַיָּם
  choice: в середину моря
  rationale: Передаёт пространственное значение תּוֹךְ и направленность движения внутрь моря, не добавляя идеи полного прохождения, которой в самой фразе нет.
- source_word: בַּיַּבָּשָׁה
  choice: по суше
  rationale: Естественный русский способ обозначить передвижение по сухому морскому дну; сохраняется противопоставление суши и вод.
- source_word: וְהַמַּיִם
  choice: а воды
  rationale: Множественное число сохраняет образность еврейского הַמַּיִם; союз «а» естественно отмечает сопоставление суши под ногами и вод по сторонам.
- source_word: חֹמָה
  choice: стеной
  rationale: Еврейский текст прямо называет воды стеной без сравнительной частицы; творительный сказуемого естественен по-русски.
- source_word: מִימִינָם
  choice: справа
  rationale: Кратко и естественно передаёт положение с правой стороны.
- source_word: וּמִשְּׂמֹאלָם
  choice: слева
  rationale: Симметрично предыдущему выражению и естественно передаёт положение с левой стороны.
