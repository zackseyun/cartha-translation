base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/005.yaml
  text: It was reported to the king of Egypt that the people had fled[a], and the heart of Pharaoh and his servants was turned against the people, and they said, “What is this we have done[b], that we have let Israel go from serving us?”
translation:
  language: ru
  text: 'Царю Египта донесли, что народ бежал[a]. Тогда сердце фараона и его слуг обратилось против народа, и они сказали: «Что это мы сделали, отпустив Израиль, так что он больше не служит нам[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народ обратился в бегство».'
    reason: 'лексическая альтернатива: בָּרַח означает «бежать, спасаться бегством».'
  - marker: b
    text: 'Или: «отпустив Израиль от службы у нас».'
    reason: 'лексическая альтернатива: מֵעָבְדֵנוּ буквально обозначает прекращение служения Израиля египтянам; основной текст развёртывает этот смысл естественным русским способом.'
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: донесли
  rationale: Хофал от נגד выражает сообщение с неназванным действующим лицом; русская неопределённо-личная конструкция естественно передаёт этот смысл.
- source_word: לְמֶלֶךְ מִצְרַיִם
  choice: царю Египта
  rationale: Прямое и естественное соответствие еврейской конструкции принадлежности.
- source_word: כִּי בָרַח הָעָם
  choice: что народ бежал
  rationale: ברח означает «бежать, спасаться бегством»; прошедшее время соответствует предшествующему событию в повествовании.
- source_word: וַיֵּהָפֵךְ לְבַב
  choice: сердце ... переменилось
  rationale: Сохраняется метафора сердца как средоточия мысли и воли, а форма с נהפך передаёт внутреннюю перемену или поворот.
- source_word: לְבַב פַּרְעֹה וַעֲבָדָיו
  choice: сердце фараона и его слуг
  rationale: Единственное число следует еврейскому тексту и сохраняет его собирательную конструкцию; «сердце» не сводится только к современному понятию разума.
- source_word: אֶל הָעָם
  choice: по отношению к народу
  rationale: Предлог указывает направленность перемены отношения. Нейтральная формулировка сохраняет возможную неоднозначность, тогда как контекст ясно подразумевает враждебный поворот.
- source_word: מַה זֹּאת עָשִׂינוּ
  choice: Что же мы сделали
  rationale: Передаёт сожаление и тревогу идиоматического еврейского вопроса без неестественного русского буквализма «Что это мы сделали?».
- source_word: שִׁלַּחְנוּ
  choice: отпустив
  rationale: В данном контексте שׁלח означает позволить Израилю уйти, освободить или отпустить его.
- source_word: מֵעָבְדֵנוּ
  choice: лишившись его службы
  rationale: Конструкция с עבד означает прекращение служения Израиля египтянам. Формулировка сохраняет смысл службы, не усиливая его в основном тексте до прямого обозначения рабского статуса.
theological_decisions:
- issue: Антропологический термин לְבַב
  choice: сердце
  alternative: мысли; намерения
  rationale: «Сердце» сохраняет еврейский образ внутреннего средоточия мысли и воли, не сужая его до одной психологической функции.
- issue: Направленность перемены אֶל הָעָם
  choice: по отношению к народу
  alternative: против народа
  rationale: Контекст предполагает враждебность, но сам предлог выражает прежде всего направленность отношения; основной текст не устраняет эту лексическую широту.
- issue: Статус Израиля в מֵעָבְדֵנוּ
  choice: лишившись его службы
  alternative: освободив его от рабства у нас
  rationale: Общий контекст Исхода несомненно описывает рабское угнетение, однако непосредственно эта фраза говорит о служении; перевод не подменяет её более сильной контекстуальной формулировкой.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. «Царь Египта» предпочтён современному титулу «король Египта» как устойчивое библейское обозначение без архаической грамматики. Синтаксис слегка сглажен для естественной русской речи, при этом сохранены образ сердца, коллективное единственное число и смысловая широта ключевых выражений.
