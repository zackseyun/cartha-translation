  text: הֲ/לֹא זֶ֣ה הַ/דָּבָ֗ר אֲשֶׁר֩ דִּבַּ֨רְנוּ אֵלֶ֤י/ךָ בְ/מִצְרַ֨יִם֙ לֵ/אמֹ֔ר חֲדַ֥ל מִמֶּ֖/נּוּ וְ/נַֽעַבְדָ֣ה אֶת מִצְרָ֑יִם כִּ֣י ט֥וֹב לָ֨/נוּ֙ עֲבֹ֣ד אֶת מִצְרַ֔יִם מִ/מֻּתֵ֖/נוּ בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/012.yaml
  text: Is this not the word that we spoke to you in Egypt, saying, ‘Leave us alone so that we may serve the Egyptians’? For it would have been better for us to serve the Egyptians than to die in the wilderness.
translation:
  language: ru
  text: 'Разве не это мы говорили тебе в Египте: «Оставь нас в покое, чтобы мы служили египтянам»? Ведь нам было бы лучше служить египтянам, чем умереть в пустыне.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא זֶה הַדָּבָר
  choice: Разве не это
  rationale: Естественно передаёт риторический вопрос; הַדָּבָר здесь указывает на ранее высказанное содержание, поэтому отдельное «слово» по-русски излишне.
- source_word: חֲדַל מִמֶּנּוּ
  choice: Оставь нас в покое
  rationale: Идиоматично передаёт требование прекратить вмешательство или действия в отношении говорящих.
- source_word: וְנַעַבְדָה אֶת־מִצְרָיִם
  choice: и мы будем служить египтянам
  rationale: Когортатив после требования выражает желаемое следствие; «служить египтянам» сохраняет политико-трудовой смысл עבד без ненужного уточнения.
- source_word: כִּי טוֹב לָנוּ עֲבֹד אֶת־מִצְרַיִם
  choice: Ведь лучше было нам служить египтянам
  rationale: Сравнительная конструкция требует «лучше»; прошедшее «было» естественно выражает ретроспективную оценку нереализованной альтернативы в данном контексте.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Стандартное контекстуальное соответствие для безводной, необитаемой местности пути исхода.
theological_decisions:
- issue: Характер служения египтянам
  choice: служить египтянам
  alternative: быть рабами у египтян
  rationale: Глагол עבד способен обозначать и служение, и рабский труд; нейтральное «служить» сохраняет лексическую связь с оригиналом и не сужает смысл, хотя контекст рабства очевиден.
- issue: Временная отнесённость сравнительной оценки
  choice: лучше было нам
  alternative: лучше нам
  rationale: Русская форма с прошедшим временем передаёт контрфактический взгляд из нынешней опасности, не превращая реплику в универсальное утверждение.
translation_notes:
  register: Современный литературный русский язык; прямая, эмоциональная речь передана естественно и достойно, без архаизмов. Риторический вопрос и резкий упрёк сохранены.
