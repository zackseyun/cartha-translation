base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/021.yaml
  text: Then Moses stretched out his hand over the sea[a], and Yahweh drove the sea back by a strong east wind all night and made the sea dry land[d][c][b], and the waters were split.
translation:
  language: ru
  text: Тогда Моисей простёр руку над морем, и Яхве всю ночь гнал море назад[a] сильным восточным ветром[b], превратил море в сушу[c], и воды разделились[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «заставил море двигаться»; по контексту также возможно: «отвёл море».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «могучим восточным ветром».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквальнее: «сделал море сушей»; также возможно: «превратил море в сухую землю».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «воды рассеклись».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: простёр
  rationale: В сочетании с «рукой» глагол נטה обозначает протягивание или простирание руки; «простёр» точно и естественно передаёт жест в возвышенном повествовательном стиле.
- source_word: עַל הַיָּם
  choice: над морем
  rationale: Предлог עַל здесь естественно описывает положение направленной руки по отношению к морю; «над морем» сохраняет пространственный образ.
- source_word: וַיּוֹלֶךְ יְהוָה אֶת הַיָּם
  choice: Яхве… гнал море назад
  rationale: 'Порода хифиль глагола הלך имеет каузативный смысл: Яхве заставлял море отходить. «Гнал море назад» ясно передаёт действие и сохраняет море как прямой объект, хотя направление «назад» выводится из контекста.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: בְּרוּחַ קָדִים עַזָּה
  choice: сильным восточным ветром
  rationale: רוּחַ в сочетании с указанием направления означает ветер; קָדִים — восточный, עַזָּה — сильный. Творительный падеж естественно выражает средство действия.
- source_word: כָּל הַלַּיְלָה
  choice: всю ночь
  rationale: Краткая и точная современная передача длительности действия.
- source_word: וַיָּשֶׂם אֶת הַיָּם לֶחָרָבָה
  choice: сделал море сушей
  rationale: Формулировка близко сохраняет еврейскую конструкцию «сделал море сушей» и передаёт חָרָבָה как сухую землю.
- source_word: וַיִּבָּקְעוּ הַמָּיִם
  choice: воды разделились
  rationale: Нифаль глагола בקע описывает раскалывание или разделение. «Разделились» естественно по-русски и не уточняет сверх текста способ разделения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. «Яхве» передаёт тетраграмматон как имя, не заменяя его титулом и не вводя традиционную форму с менее вероятной огласовкой.
- issue: Соотношение божественного действия и действия ветра
  choice: Яхве гнал море назад сильным восточным ветром
  alternative: Яхве отвёл море, послав сильный восточный ветер
  rationale: Сохранена грамматическая структура, в которой Яхве является действующим лицом, а ветер — средством действия; перевод не сводит событие ни к одному лишь природному процессу, ни к действию без посредства ветра.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет последовательность действий исходного текста, не становясь тяжеловесным; личное имя «Яхве» передано прямо.
