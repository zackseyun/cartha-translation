  text: But the sons of Israel walked on dry ground through the midst of the sea[b][a], and the waters were a wall to them on their right and on their left.
translation:
  language: ru
  text: Но сыны Израиля шли по сухой земле посреди моря, а воды были им стеной справа и слева.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А израильтяне шли по суше через море; воды же были для них словно стена справа и слева».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Но сыны Израиля
  rationale: Союз передан как «но», поскольку здесь безопасный переход Израиля противопоставлен гибели египтян в ближайшем контексте. «Сыны Израиля» сохраняет буквальный семейно-национальный образ еврейского выражения.
- source_word: הָלְכוּ
  choice: шли
  rationale: Глагол הלך означает «идти, ходить»; «шли» естественно передаёт движение народа через море.
- source_word: בַיַּבָּשָׁה
  choice: по сухой земле
  rationale: Существительное יַבָּשָׁה обозначает сушу или сухую землю; выбранная формулировка естественна по-русски и подчёркивает состояние морского дна.
- source_word: בְּתוֹךְ הַיָּם
  choice: посреди моря
  rationale: Выражение обозначает нахождение или движение в самой середине моря; «посреди моря» сохраняет пространственный образ без излишней тяжеловесности.
- source_word: וְהַמַּיִם לָהֶם חֹמָה
  choice: а воды были им стеной
  rationale: Морфологически множественное מַיִם передано словом «воды», а именная конструкция — прямо как «были им стеной». Союз «а» выражает сопоставление с движением по сухой земле.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: справа и слева
  rationale: Краткая симметричная формулировка естественно передаёт расположение вод по обе стороны от израильтян.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Основной текст сохраняет буквальный родственно-национальный образ оригинала; идиоматическое «израильтяне» возможно, но сглаживает его.
- issue: Буквальное или сравнительное понимание חֹמָה
  choice: были им стеной
  alternative: были для них словно стена
  rationale: В еврейском тексте отсутствует явный показатель сравнения, поэтому сохранена сильная метафорическая формулировка без добавления «словно».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены параллелизм и зримый образ оригинала; архаическое «одесную и ошуюю» не используется.
