base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/031.yaml
  text: Israel saw the great hand that Yahweh had done against Egypt[a], and the people feared Yahweh[b], and they believed in Yahweh and in Moses his servant.
translation:
  language: ru
  text: И увидел Израиль великую руку, которую явил Яхве против Египта[a]. И убоялся народ Яхве, и поверили они в Яхве и в Моисея, его слугу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которую явил Яхве в Египте» либо «которую явил Яхве Египту». Буквально: «великую руку, которую сделал Яхве в/против Египта»; «рука» здесь служит образом силы.'
    reason: Лексическая и синтаксическая неоднозначность еврейского בְּמִצְרַיִם и образного выражения «великая рука».
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Передаёт непосредственное восприятие Израилем только что совершившегося события и сохраняет простой повествовательный характер глагола ראה.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохраняет собирательное единственное число исходного текста и его чередование с последующим «народ».
- source_word: הַיָּד הַגְּדֹלָה
  choice: великую руку
  rationale: Сохраняет буквальный и повторяющийся в Исходе образ руки как проявления силы; прилагательное «великая» непосредственно соответствует גְּדֹלָה.
- source_word: אֲשֶׁר עָשָׂה יְהוָה בְּמִצְרַיִם
  choice: которую явил Яхве против Египта
  rationale: Русское «явил руку» естественно выражает совершённое Яхве проявление силы, не вводя неуклюжее «сделал руку»; «против Египта» передаёт направленность действия в данном контексте, а подлинная неоднозначность предлога отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וַיִּירְאוּ
  choice: убоялся
  rationale: Сохраняет основное значение ירא — страх, не сводя его только к благоговению; форма единственного числа согласована с собирательным «народ».
- source_word: הָעָם
  choice: народ
  rationale: Точно соответствует существительному исходного текста и не заменяет его более узким обозначением.
- source_word: וַיַּאֲמִינוּ בַּיהוָה
  choice: поверили они Яхве
  rationale: Глагол «поверили» передаёт אמן в породе хифиль; русское управление без предлога звучит естественно и допускает смысл доверия.
- source_word: וּבְמֹשֶׁה עַבְדּוֹ
  choice: и Моисею, Его слуге
  rationale: Сохраняет параллельное дополнение при глаголе веры, а «Его слуге» ясно обозначает подчинённое положение Моисея как слуги Яхве.
theological_decisions:
- issue: Характер отношения Израиля к Моисею
  choice: Народ поверил Яхве и Моисею как Его уполномоченному слуге.
  alternative: Народ отдельно доверился Моисею как личности либо просто поверил словам Яхве и Моисея.
  rationale: Одинаковая конструкция אמן + בְ относится и к Яхве, и к Моисею, однако определение «Его слуга» сохраняет различие между Богом и Его подчинённым представителем.
- issue: Смысл страха народа перед Яхве
  choice: Сохранено прямое «убоялся», допускающее страх, трепет и благоговение.
  alternative: «Исполнился благоговения» или «благоговел».
  rationale: Контекст избавления и суда допускает несколько оттенков ירא; перевод не должен заранее ограничивать их одним религиозным чувством.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. «Убоялся» выбрано как понятное, но торжественное слово, способное вместить страх и благоговение. Цепочка предложений слегка разгружена пунктуацией, при этом сохранён повествовательный параллелизм еврейского текста.
