base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/030.yaml
  text: So Yahweh saved Israel that day from the hand of Egypt[b][a], and Israel saw the Egyptians dead on the seashore.
translation:
  language: ru
  text: В тот день Яхве спас Израиль из-под власти Египта[a], и Израиль увидел мёртвых египтян на берегу моря[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из руки Египта»; это образное выражение означает избавление от власти Египта.'
    reason: cultural_note
  - marker: b
    text: 'Или: «у края моря».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: спас
  rationale: Порода хифиль глагола ישׁע обозначает здесь избавление Израиля от смертельной опасности. «Спас» естественно звучит по-русски и сохраняет богословскую значимость Божьего избавления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямое и естественное соответствие еврейскому обстоятельству времени.
- source_word: מִיַּד מִצְרָיִם
  choice: из-под власти Египта
  rationale: Буквальный образ «из руки Египта» означает избавление от власти или контроля Египта. В основном тексте значение передано ясным современным русским выражением, а исходная метафора отмечена в сноске.
- source_word: מִצְרַיִם / מִצְרָיִם
  choice: Египет / египтяне
  rationale: В первой части название страны обозначает державу и её власть, а во второй — людей, чьи тела увидел Израиль.
- source_word: וַיַּרְא
  choice: увидел
  rationale: Прямое соответствие обычному повествовательному употреблению ראה.
- source_word: מֵת
  choice: мёртвых
  rationale: Форма единственного числа в еврейском тексте имеет собирательное значение при «Египте» как обозначении египтян; русское множественное число согласуется с явным обозначением людей.
- source_word: עַל שְׂפַת הַיָּם
  choice: на берегу моря
  rationale: Еврейское выражение буквально говорит о «губе» или крае моря и идиоматически обозначает морской берег.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное Божье имя. Транслитерация «Яхве» сохраняет различие между именем и титулом и не привносит замены, отсутствующей в еврейском оригинале.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным повествовательным тоном. Синтаксис сохраняет последовательность двух действий и повтор слова «Израиль», присутствующий в оригинале.
