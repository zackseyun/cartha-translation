  text: וְ/יָדְע֥וּ מִצְרַ֖יִם כִּי אֲנִ֣י יְהוָ֑ה בְּ/הִכָּבְדִ֣/י בְּ/פַרְעֹ֔ה בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/018.yaml
  text: And the Egyptians will know that I am Yahweh[a], when I gain glory through Pharaoh, through his chariots[b], and through his horsemen.
translation:
  language: ru
  text: И узнают египтяне, что Я — Яхве[a], когда прославлюсь через фараона, через его колесницы и через его всадников[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — передача еврейского божественного имени יהוה (YHWH), традиционно заменяемого в переводах словом «ГОСПОДЬ».
    reason: divine_name
  - marker: b
    text: 'Или: «когда буду прославлен на фараоне, на его колесницах и на его всадниках».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: И узнают
  rationale: Форма с союзом продолжает повествовательно-пророческую последовательность и обозначает будущий результат предстоящего события.
- source_word: מִצְרַיִם
  choice: египтяне
  rationale: В данном контексте слово обозначает народ Египта, который узнает Яхве, а не страну как территорию.
- source_word: כִּי אֲנִי יְהוָה
  choice: что Я — Яхве
  rationale: Сохранена формула узнавания и прямое самоотождествление Бога с именем יהוה.
- source_word: בְּהִכָּבְדִי
  choice: когда прославлюсь
  rationale: Предлог בְּ с инфинитивом передаёт временное значение; нифаль глагола כבד допускает естественную русскую возвратную форму «прославлюсь», не устраняющую оттенок обретения и явления славы.
- source_word: בְּפַרְעֹה
  choice: через фараона
  rationale: Предлог בְּ здесь обозначает средство или сферу, в которой обнаруживается слава Яхве; «через» естественно передаёт эту связь без добавления явно не выраженного значения победы «над».
- source_word: בְּרִכְבּוֹ
  choice: через его колесницы
  rationale: רכב имеет собирательное значение «колесничное войско»; множественное «колесницы» ясно и естественно по-русски.
- source_word: וּבְפָרָשָׁיו
  choice: и через его всадников
  rationale: פָרָשִׁים обозначает конных воинов; «всадники» прямо передаёт военный смысл и соответствует паре с колесницами.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: В еврейском тексте стоит собственное божественное имя יהוה. Транслитерация «Яхве» сохраняет личное имя и формулу самооткровения; традиционная замена титулом указана в примечании.
- issue: Смысл прославления через гибель войска фараона
  choice: когда прославлюсь через фараона, через его колесницы и через его всадников
  alternative: когда буду прославлен на фараоне, на его колесницах и на его всадниках
  rationale: Нифаль допускает как возвратную, так и страдательную передачу. Основной текст сохраняет естественную русскую формулировку и инструментально-сферическое значение предлога, а примечание отражает формально более страдательный вариант.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической структурой. Повтор «через» сохранён ради ритма и трёхкратной конструкции еврейского текста; местоимение «его» повторено для ясности принадлежности войска фараону.
