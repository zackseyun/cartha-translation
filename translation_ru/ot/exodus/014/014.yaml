  text: יְהוָ֖ה יִלָּחֵ֣ם לָ/כֶ֑ם וְ/אַתֶּ֖ם תַּחֲרִישֽׁוּ/ן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/014.yaml
  text: Yahweh will fight for you[a], and you must be silent.
translation:
  language: ru
  text: Яхве будет сражаться за вас, а вы молчите.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а вы будете молчать»; возможны также: «а вы сохраняйте спокойствие» или «а вы оставайтесь безмолвны».'
    reason: 'Лексическая и модальная неоднозначность еврейского תַּחֲרִישׁוּן: форма может выражать как предписание, так и будущее действие; в контексте молчание может подразумевать невмешательство и спокойствие.'
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: יִלָּחֵם
  choice: будет сражаться
  rationale: Нифаль имперфекта от לחם обозначает предстоящее участие в битве; «будет сражаться» естественно и сохраняет военный смысл.
- source_word: לָכֶם
  choice: за вас
  rationale: Предлог ל с местоименным суффиксом указывает на действие в пользу Израиля; по-русски «сражаться за вас» звучит естественно и точно.
- source_word: וְאַתֶּם
  choice: а вы
  rationale: Союз с самостоятельным местоимением противопоставляет действие Яхве поведению израильтян; русское «а» ясно передаёт этот контраст.
- source_word: תַּחֲרִישׁוּן
  choice: молчите
  rationale: Глагол חרשׁ в хифиле означает «молчать, хранить молчание». В данном увещевательном контексте форма имперфекта естественно понимается как предписание, хотя возможен и оттенок будущего.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное имя, не подменяя его титулом.
- issue: Модальность תַּחֲרִישׁוּן
  choice: 'предписание: «молчите»'
  alternative: 'предсказание: «вы будете молчать»'
  rationale: Контекст речи Моисея поддерживает увещевательно-повелительное прочтение, но форма имперфекта допускает и будущее значение, поэтому оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, торжественная и понятная. Контраст между действием Яхве и требуемым поведением народа передан союзом «а».
