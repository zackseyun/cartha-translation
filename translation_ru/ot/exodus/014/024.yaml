source:
  edition: WLC
  text: וַֽ/יְהִי֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּשְׁקֵ֤ף יְהוָה֙ אֶל מַחֲנֵ֣ה מִצְרַ֔יִם בְּ/עַמּ֥וּד אֵ֖שׁ וְ/עָנָ֑ן וַ/יָּ֕הָם אֵ֖ת מַחֲנֵ֥ה מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/024.yaml
  text: And in the morning watch[a], Yahweh looked down on the camp of the Egyptians through the pillar of fire and cloud[b], and threw the camp of the Egyptians into confusion.
translation:
  language: ru
  text: Во время утренней стражи Яхве взглянул на стан египтян из столпа огня и облака[a] и привёл стан египтян в смятение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посредством столпа огня и облака».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поверг стан египтян в панику».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: во время утренней стражи
  rationale: Сочетание обозначает последнюю ночную стражу, приходившуюся на предрассветные часы. Формулировка сохраняет временную конкретность еврейского текста и остаётся понятной современному читателю.
- source_word: וַיַּשְׁקֵף
  choice: взглянул на
  rationale: В данной породе глагол שׁקף обычно описывает взгляд наружу или вниз с возвышенной позиции. Русское «взглянул на» естественно передаёт действие; направление и точка наблюдения проясняются последующим упоминанием столпа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: מַחֲנֵה מִצְרַיִם
  choice: стан египтян
  rationale: Речь идёт о военном стане египтян. Слово «стан» кратко, уместно в повествовательном регистре и точно передаёт מַחֲנֶה.
- source_word: בְּעַמּוּד אֵשׁ וְעָנָן
  choice: из столпа огня и облака
  rationale: Предлог בְּ допускает здесь локативное или инструментальное понимание. Основной текст естественно выражает взгляд Яхве из столпа, а альтернативное инструментальное прочтение сохранено в сноске.
- source_word: וַיָּהָם
  choice: привёл ... в смятение
  rationale: Каузативный глагол выражает внесение сумятицы, тревоги или паники. «Привёл в смятение» сохраняет каузативность и не опережает дальнейшее развитие разгрома египтян.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом и не вводя менее вероятную огласовку.
- issue: Роль столпа в действии Яхве
  choice: Яхве взглянул из столпа
  alternative: Яхве взглянул посредством столпа
  rationale: Еврейский предлог допускает как локативный, так и инструментальный оттенок. Основное чтение не превращает столп в самостоятельного деятеля, а возможная инструментальность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Стан» и «утренняя стража» сохраняют историко-повествовательный колорит, оставаясь понятными без архаической синтаксической тяжеловесности.
