source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מַה תִּצְעַ֖ק אֵלָ֑/י דַּבֵּ֥ר אֶל בְּנֵי יִשְׂרָאֵ֖ל וְ/יִסָּֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/015.yaml
  text: Then Yahweh said to Moses[b][a], “Why are you crying out to me? Tell the sons of Israel to set out.”
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Почему ты взываешь ко Мне? Скажи сынам Израиля[a]: пусть они двинутся в путь[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пусть они двинутся вперёд».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная повествовательная форма продвигает рассказ; «тогда» естественно выражает эту связь по-русски.
- source_word: מַה תִּצְעַק אֵלָי
  choice: Почему ты взываешь ко Мне?
  rationale: В данном вопросительном обороте מַה имеет значение «почему», а צעק обозначает настойчивый крик или обращение о помощи.
- source_word: דַּבֵּר אֶל
  choice: Скажи
  rationale: Естественно передаёт повелительную форму «говори к», не усиливая её до значения «прикажи».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет форму исходного выражения и традиционное обозначение народа; более идиоматичный вариант дан в сноске.
- source_word: וְיִסָּעוּ
  choice: пусть они двинутся в путь
  rationale: Передаёт побудительное значение формы и обычный смысл נסע — сняться с места и отправиться дальше.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: Транслитерация сохраняет различие между личным именем и титулом, не подменяя имя конфессионально привычной формой.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам
  rationale: Основной текст сохраняет образ и грамматическую форму еврейского выражения, а естественный собирательный эквивалент указан в сноске.
- issue: Направление движения в וְיִסָּעוּ
  choice: пусть они двинутся в путь
  alternative: пусть они двинутся вперёд
  rationale: Глагол прежде всего означает отправление с места; контекст допускает пространственное уточнение «вперёд», поэтому оно сохранено как вариант.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Прямая речь звучит естественно; обращение к Богу передано местоимением с прописной буквы согласно распространённой русской библейской норме.
