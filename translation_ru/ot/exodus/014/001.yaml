lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … сказал
  rationale: Форма с последовательным וַ продвигает повествование. В сочетании с לֵאמֹר естественная русская формула «сказал:» передаёт введение прямой речи без тяжеловесного буквального «говорил, говоря».
- source_word: יְהֹוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его прямое присутствие в еврейском тексте; вариант произношения пояснён в сноске.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, обозначенного предлогом אֶל; имя дано в традиционной русской форме.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит содержание последующей речи. В современном русском эту функцию естественно выполняет двоеточие; добавление «так» внесло бы отсутствующий в источнике оттенок.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — собственное имя Бога, а не титул אֲדֹנָי. «Яхве» прямо передаёт имя и соответствует наиболее распространённой научной реконструкции; сноска сохраняет сведения о форме оригинала и традиционной альтернативе.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для русского: единая формула וַיְדַבֵּר … לֵאמֹר передана как «сказал …:». Маркер сноски помещён после имени Моисея, как в консультационном тексте.'
