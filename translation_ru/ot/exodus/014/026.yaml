  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה נְטֵ֥ה אֶת יָדְ/ךָ֖ עַל הַ/יָּ֑ם וְ/יָשֻׁ֤בוּ הַ/מַּ֨יִם֙ עַל מִצְרַ֔יִם עַל רִכְבּ֖/וֹ וְ/עַל פָּרָשָֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/026.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the sea, so that the waters may return over the Egyptians, over their chariots, and over their horsemen.”
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Протяни руку над морем, чтобы воды вернулись[a] на египтян, на их колесницы и на их всадников».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и воды вернутся». Еврейский глагол можно передать простым будущим временем, хотя здесь он, вероятно, выражает предполагаемый результат действия Моисея.'
    reason: лексическая и синтаксическая альтернатива
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Вайиктоль продвигает повествование вперёд; «тогда» естественно передаёт последовательность событий в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: נְטֵה אֶת־יָדְךָ
  choice: Протяни руку
  rationale: Императив נְטֵה обозначает направленное вытягивание руки; эта формулировка точна и естественна по-русски.
- source_word: עַל־הַיָּם
  choice: над морем
  rationale: Предлог עַל здесь выражает пространственное отношение при жесте Моисея; «над морем» передаёт его без лишнего уточнения направления.
- source_word: וְיָשֻׁבוּ
  choice: чтобы … вернулись
  rationale: Префиксальная форма после повеления может выражать предполагаемый или целевой результат действия. Русская конструкция с «чтобы» ясно передаёт эту связь, не меняя значения глагола «вернуться».
- source_word: הַמַּיִם
  choice: воды
  rationale: Множественное число сохраняет форму еврейского слова и соответствует возвышенному повествовательному стилю.
- source_word: עַל מִצְרַיִם
  choice: на египтян
  rationale: עַל описывает возвращение вод на египтян; «на» сохраняет образ движения воды и не добавляет значения нападения.
- source_word: עַל רִכְבּוֹ
  choice: на их колесницы
  rationale: Формально единственное местоименное окончание относится к собирательному מִצְרַיִם; в русском естественно согласование по смыслу во множественном числе.
- source_word: וְעַל פָּרָשָׁיו
  choice: и на их всадников
  rationale: פָּרָשִׁים непосредственно обозначает конных воинов или всадников; «всадники» точнее и менее терминологично, чем «кавалерия».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В тексте стоит собственное имя Бога. Форма «Яхве» передаёт тетраграмматон как имя и не подменяет его титулом.
- issue: Связь возвращения вод с повелением Моисею
  choice: «чтобы воды вернулись» как выражение предполагаемого результата
  alternative: «и воды вернутся» как простое будущее
  rationale: Еврейская форма допускает обе синтаксические трактовки. Основной текст передаёт вероятную целевую или результативную связь, а более буквальная альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого круга читателей; повтор «на» сохранён ради структуры и ритма исходного текста.
