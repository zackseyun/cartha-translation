  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/יָשֻׁ֗בוּ וְ/יַחֲנוּ֙ לִ/פְנֵי֙ פִּ֣י הַחִירֹ֔ת בֵּ֥ין מִגְדֹּ֖ל וּ/בֵ֣ין הַ/יָּ֑ם לִ/פְנֵי֙ בַּ֣עַל צְפֹ֔ן נִכְח֥/וֹ תַחֲנ֖וּ עַל הַ/יָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/002.yaml
  text: Speak to the sons of Israel[a], that they turn back and camp before Pi-hahiroth, between Migdol and the sea. Before Baal-zephon, opposite it[c][b], you shall camp by the sea.
translation:
  language: ru
  text: Скажи сынам Израиля[a], чтобы они повернули назад и разбили лагерь перед Пи-Гахирофом, между Мигдолом и морем. Перед Баал-Цефоном[b], напротив него[c], разбейте лагерь у моря.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам». Буквально по-еврейски: «сынам Израиля».'
    reason: lexical_alternative
  - marker: b
    text: Пи-Гахироф, Мигдол и Баал-Цефон — географические названия, поэтому они переданы транслитерацией, а не переведены.
    reason: cultural_note
  - marker: c
    text: 'Или: «лицом к нему». Местоимение «него», вероятнее всего, относится к Баал-Цефону.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Скажи
  rationale: Императив породы пиэль с предлогом אֶל вводит прямое повеление Моисею обратиться к народу. «Скажи» естественно передаёт эту конструкцию по-русски.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохранён буквальный семейно-родовой оборот «сыны Израиля»; более идиоматический вариант «израильтянам» указан в сноске.
- source_word: וְיָשֻׁבוּ
  choice: чтобы они повернули назад
  rationale: Юссив после императива выражает предписанное действие. «Повернули назад» передаёт важную в контексте смену направления.
- source_word: וְיַחֲנוּ / תַחֲנוּ
  choice: разбили лагерь / разбейте лагерь
  rationale: Глагол חנה означает расположиться лагерем. Современное выражение «разбить лагерь» ясно передаёт как первое зависимое повеление, так и заключительное прямое указание.
- source_word: לִפְנֵי פִּי הַחִירֹת
  choice: перед Пи-Гахирофом
  rationale: לִפְנֵי обозначает пространственное положение «перед», а Пи-Гахироф передан как топоним, без этимологического перевода.
- source_word: בֵּין מִגְדֹּל וּבֵין הַיָּם
  choice: между Мигдолом и морем
  rationale: Парная конструкция בֵּין...וּבֵין задаёт две пространственные границы; הַיָּם здесь естественно передаётся как «море».
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: перед Баал-Цефоном
  rationale: Сохранено то же пространственное значение לִפְנֵי; название транслитерировано как топоним.
- source_word: נִכְחוֹ
  choice: напротив него
  rationale: Наречие с суффиксом 3-го лица мужского рода указывает на положение напротив упомянутого ориентира. Местоименная отсылка сохранена, а её наиболее вероятный референт пояснён в сноске.
- source_word: עַל הַיָּם
  choice: у моря
  rationale: В данном пространственном контексте עַל указывает на близость к морю, поэтому естественный русский эквивалент — «у моря».
