base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/016.yaml
  text: But as for you[a], lift up your staff and stretch out your hand over the sea and split it, so that the sons of Israel may go through the midst of the sea on dry ground.
translation:
  language: ru
  text: А ты подними свой посох, протяни руку над морем и рассеки его, чтобы сыны Израиля[a] прошли посреди моря по суше.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне»; буквально: «сыны Израиля». Здесь имеется в виду народ Израиля в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: А ты
  rationale: Союз с самостоятельным местоимением выделяет Моисея и создаёт контраст с предшествующим повелением народу; «А ты» естественно передаёт это по-русски.
- source_word: הָרֵם אֶת־מַטְּךָ
  choice: подними свой посох
  rationale: Форма породы hифиль выражает побуждение поднять предмет; «посох» — естественное современное обозначение מַטֶּה в повествовании о Моисее.
- source_word: וּנְטֵה אֶת־יָדְךָ עַל־הַיָּם
  choice: протяни руку над морем
  rationale: נטה с «рукой» обозначает её протягивание, а עַל здесь естественно передаётся пространственным «над».
- source_word: וּבְקָעֵהוּ
  choice: и рассеки его
  rationale: בקע означает расколоть или рассечь; «рассеки» сохраняет энергичность повеления и образ физического разделения моря.
- source_word: וְיָבֹאוּ
  choice: чтобы ... прошли
  rationale: В цепочке после повелений форма выражает ожидаемый результат или цель; в контексте перехода через море русское «чтобы прошли» естественнее буквального «и войдут».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняется буквальный мужской образ еврейского сочетания «сыновья Израиля»; форма «сыны» в библейском повествовании звучит торжественно, но остаётся понятной.
- source_word: בְּתוֹךְ הַיָּם
  choice: посреди моря
  rationale: בְּתוֹךְ указывает на внутреннее пространство или середину; «посреди моря» сохраняет пространственный образ без лишней тяжеловесности.
- source_word: בַּיַּבָּשָׁה
  choice: по суше
  rationale: Существительное обозначает сухую землю в противопоставлении морю; «по суше» идиоматично описывает путь движения.
theological_decisions:
- issue: Передача בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Буквальный мужской образ сохранён в основном тексте, при этом сноска поясняет, что выражение обозначает весь народ, а не только мужчин.
- issue: Смысл וְיָבֹאוּ после повелений
  choice: чтобы ... прошли
  alternative: и войдут
  rationale: Контекст допускает результативно-целевое понимание. Перевод передаёт ожидаемый итог действий Моисея, не утверждая отдельной богословской причинности сверх текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Императивы переданы прямо и энергично; архаизмы сведены к понятному традиционному выражению «сыны Израиля», пояснённому в сноске.
