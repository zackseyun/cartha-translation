  rationale: Сохраняет еврейский образ средоточия воли и внутренней решимости.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: фараона, царя Египта
  rationale: Естественно передаёт приложение и точно сохраняет титул.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: погнался за
  rationale: Передаёт направленное и враждебное преследование естественным современным русским выражением.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет повтор и форму исходного выражения; высокий, но понятный библейский регистр.
- source_word: יֹצְאִים
  choice: выходили
  rationale: Несовершенный вид передаёт длительное действие причастия, происходящее на фоне погони.
- source_word: בְּיָד רָמָה
  choice: с высоко поднятой рукой
  rationale: Сохраняет конкретный образ идиомы буквально и по-русски естественнее, чем «с высокой рукой»; переносные значения пояснены в сноске.
theological_decisions:
- issue: Божественное действие по отношению к сердцу фараона
  choice: И укрепил Господь сердце фараона
  alternative: И ожесточил Господь сердце фараона
  rationale: Прямое действие Господа сохранено без смягчения, тогда как лексическая неоднозначность חזק между укреплением и контекстуальным ожесточением явно отмечена в сноске.
