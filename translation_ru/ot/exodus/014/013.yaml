  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל הָ/עָם֮ אַל תִּירָאוּ֒ הִֽתְיַצְב֗וּ וּ/רְאוּ֙ אֶת יְשׁוּעַ֣ת יְהוָ֔ה אֲשֶׁר יַעֲשֶׂ֥ה לָ/כֶ֖ם הַ/יּ֑וֹם כִּ֗י אֲשֶׁ֨ר רְאִיתֶ֤ם אֶת מִצְרַ֨יִם֙ הַ/יּ֔וֹם לֹ֥א תֹסִ֛יפוּ לִ/רְאֹתָ֥/ם ע֖וֹד עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/013.yaml
  text: And Moses said to the people, “Do not fear. Stand firm, and see the salvation of the LORD, which he will accomplish for you today; for the Egyptians whom you see today, you will never see again forever.”
translation:
  language: ru
  text: 'И сказал Моисей народу: «Не бойтесь! Стойте твёрдо — и увидите спасение от ГОСПОДА, которое Он совершит для вас сегодня. Египтян, которых вы видите сегодня, вы больше не увидите никогда».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְיַצְבוּ
  choice: Стойте твёрдо
  rationale: Передаёт призыв занять твёрдую позицию и не отступать; естественнее по-русски, чем буквальное «встаньте».
- source_word: יְשׁוּעַת יְהוָה
  choice: спасение от ГОСПОДА
  rationale: Конструкция обозначает спасительное избавление, исходящее от Яхве. Традиционное типографическое «ГОСПОДЬ» передаёт тетраграмматон без внесения конфессионально маркированной транслитерации.
- source_word: יַעֲשֶׂה לָכֶם
  choice: Он совершит для вас
  rationale: Сохраняет деятельный характер глагола עשה и Божье действие в пользу народа.
- source_word: לֹא תֹסִיפוּ לִרְאֹתָם עוֹד עַד עוֹלָם
  choice: вы больше не увидите никогда
  rationale: Естественно передаёт усиленное отрицание повторного видения и окончательность выражения עַד עוֹלָם.
theological_decisions:
- issue: Смысл «спасения ГОСПОДА»
  choice: «спасение от ГОСПОДА»
  alternative: «спасение ГОСПОДНЕ»
  rationale: Формулировка ясно показывает Бога источником избавления, не сужая «спасение» до одного богословского оттенка.
- issue: Референт местоименного суффикса в לִרְאֹתָם
  choice: «Египтян… не увидите»
  alternative: «Египет… не увидите»
  rationale: Хотя מִצְרַיִם формально может обозначать Египет, множественный суффикс и повествовательный контекст указывают на египтян, преследующих Израиль.
- issue: Сила עַד עוֹלָם
  choice: «никогда»
  alternative: «вовеки»
  rationale: Сохраняет категорическую окончательность обещания в современном литературном русском, не утверждая сверх контекста, что Израиль вообще никогда впредь не увидит ни одного египтянина.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной устной интонацией. Императивы переданы кратко и энергично; тетраграмматон оформлен как «ГОСПОДЬ» прописными буквами.
