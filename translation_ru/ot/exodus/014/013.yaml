  terminology: «ГОСПОДА» последовательно передаёт тетраграмматон в традиционной русской типографике. «Спасение от ГОСПОДА» допустимо передаёт יְשׁוּעַת יְהוָה как избавление, исходящее от Бога, не привнося узкоконфессионального смысла. «Египтян» оправдано контекстом и множественным суффиксом в לִרְאֹתָם.
