  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: обращение Моисея к народу, запрет бояться, призыв твёрдо стоять, обещание увидеть спасительное действие ГОСПОДА и категорическое заверение, что египтян, видимых сегодня, более не увидят. «Никогда» уместно передаёт усиленную окончательность עוֹד עַד־עוֹלָם в современном русском.'
