base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/023.yaml
  text: The Egyptians pursued and went in after them into the midst of the sea—all Pharaoh’s horses[a], his chariots[b], and his horsemen.
translation:
  language: ru
  text: Египтяне погнались за ними и вошли вслед за ними в середину моря — все кони фараона, его колесницы и всадники.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: погнались
  rationale: Глагол רדף обозначает преследование; «погнались» естественно передаёт энергичное военное преследование в данном повествовании.
- source_word: מִצְרַיִם
  choice: Египтяне
  rationale: Хотя форма может обозначать Египет как страну или народ, глагол во множественном числе и контекст указывают здесь на египтян, то есть войско.
- source_word: וַיָּבֹאוּ אַחֲרֵיהֶם
  choice: и вошли вслед за ними
  rationale: בוא здесь выражает вступление внутрь, а אַחֲרֵיהֶם — следование за израильтянами; сочетание естественно передаётся как «вошли вслед за ними».
- source_word: כֹּל סוּס פַּרְעֹה
  choice: все кони фараона
  rationale: Существительное סוּס стоит в собирательном единственном числе после כֹּל; по-русски смысл естественно выражается множественным числом «все кони».
- source_word: רִכְבּוֹ
  choice: его колесницы
  rationale: רכב может обозначать колесницу, колесницы или колесничное войско. В перечне военных сил конкретное «колесницы» звучит ясно и естественно.
- source_word: וּפָרָשָׁיו
  choice: и всадники
  rationale: פָּרָשׁ обозначает конного воина или всадника; «всадники» сохраняет конкретный образ и подходит к военному контексту.
- source_word: אֶל תּוֹךְ הַיָּם
  choice: в самую середину моря
  rationale: תּוֹךְ подчёркивает внутреннее пространство моря, а не только вступление в него; «в самую середину» передаёт этот акцент современным русским языком.
