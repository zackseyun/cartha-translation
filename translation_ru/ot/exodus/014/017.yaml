  yaml_path: translation/ot/exodus/014/017.yaml
  text: And I—behold[a], I am hardening the hearts of the Egyptians so that they will go in after them, and I will get glory over Pharaoh and over all his army[b], over his chariots and over his horsemen.
translation:
  language: ru
  text: И вот Я укрепляю сердце египтян[a], и они войдут вслед за ними. И Я прославлюсь над фараоном и над всем его войском — над его колесницами и всадниками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сердце египтян»; единственное число употреблено собирательно. По смыслу возможно: «сердца египтян».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: вот, Я
  rationale: Частица с местоименным суффиксом подчёркивает личное действие говорящего; «вот, Я» сохраняет усиление и возвышенный, но понятный современный стиль.
- source_word: מְחַזֵּק
  choice: укрепляю
  rationale: Порода пиэль глагола חזק означает придание твёрдости и решимости. «Укрепляю» сохраняет основной образ исходного слова и прямое действие Бога, не сводя его к простому дозволению; в данном контексте речь идёт об укреплении египтян в их решимости преследовать Израиль.
- source_word: לֵב מִצְרַיִם
  choice: сердце египтян
  rationale: 'Единственное число לֵב сохранено как собирательное: имеется в виду общее внутреннее намерение египтян. Сноска разъясняет возможную естественную передачу во множественном числе.'
- source_word: וְיָבֹאוּ אַחֲרֵיהֶם
  choice: и они войдут вслед за ними
  rationale: בוא в контексте перехода через море обозначает вхождение египтян туда вслед за израильтянами. Союз ו передан без однозначного уточнения цели или результата, чтобы сохранить допустимую смысловую открытость связи.
- source_word: וְאִכָּבְדָה
  choice: Я прославлюсь
  rationale: Форма нифаль от כבד здесь говорит о явлении Божьей славы в суде. «Прославлюсь» естественно и точно передаёт возвратно-результативный смысл.
- source_word: בְּפַרְעֹה
  choice: над фараоном
  rationale: Предлог ב при כבד в контексте суда указывает на того, над кем явится Божья слава и победа; «над» сохраняет этот оттенок торжества.
- source_word: חֵילוֹ
  choice: его войском
  rationale: חיל в военном контексте обозначает вооружённые силы; «войско» — ясный и стилистически уместный русский эквивалент.
- source_word: רִכְבּוֹ
  choice: его колесницами
  rationale: Форма единственного числа имеет собирательное значение; русское множественное число естественно обозначает всю совокупность боевых колесниц.
- source_word: פָרָשָׁיו
  choice: всадниками
  rationale: פָּרָשִׁים обозначает конных воинов или ездоков; «всадники» сохраняет конкретный древний военный образ без излишне современного термина «кавалерия».
theological_decisions:
- issue: Прямое действие Бога в укреплении сердца египтян
  choice: «Я укрепляю сердце египтян» — прямое Божье действие сохранено
  alternative: «Я попущу сердцам египтян ожесточиться»
  rationale: Еврейский текст прямо приписывает действие Богу. Перевод не смягчает это до дозволения и сохраняет напряжение между Божьим владычеством и ответственностью египтян.
- issue: Значение חזק в повествовании об исходе
  choice: «укрепляю»
  alternative: «ожесточаю»
  rationale: «Укрепляю» ближе к образу חזק — сделать сильным или твёрдым — и не стирает отличие этого глагола от слов, непосредственно выражающих тяжесть или нечувствительность сердца. Контекст ясно показывает, что укрепляется решимость египтян продолжить преследование.
- issue: Прославление Бога через суд над фараоном
  choice: «Я прославлюсь над фараоном»
  alternative: «Я явлю Свою славу через фараона»
  rationale: Формулировка сохраняет утверждение, что Божья слава обнаруживается в суде и победе над фараоном, не превращая фараона лишь в нейтральное орудие.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Начальное «А Я — вот, Я» сохраняет сильное эмфатическое выделение; тире перед перечислением делает длинную фразу яснее. Архаизмы и конфессионально маркированная терминология не используются.
