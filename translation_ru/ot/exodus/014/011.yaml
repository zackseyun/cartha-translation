  text: And they said to Moses[a], “Was it because there were no graves in Egypt that you took us away to die in the wilderness? What is this you have done to us by bringing us out of Egypt?”
translation:
  language: ru
  text: 'И они сказали Моисею: «Разве в Египте не было могил, что ты увёл нас умирать в пустыне? Что ты с нами сделал, выведя нас из Египта?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: И они сказали Моисею
  rationale: Стандартная повествовательная формула; אֶל обозначает адресата речи.
- source_word: הֲמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם
  choice: Разве в Египте не было могил
  rationale: Естественно передаёт саркастический риторический вопрос, сохраняя упоминание об отсутствии могил.
- source_word: לְקַחְתָּנוּ
  choice: что ты увёл нас
  rationale: לקח означает «взять»; в данном контексте «увёл» естественно выражает удаление из Египта и не смешивает этот глагол с последующим הוציא.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: умирать в пустыне
  rationale: Инфинитив передаёт предполагаемую цель или результат; «пустыня» здесь обозначает необжитую пустынную местность.
- source_word: מַה־זֹּאת עָשִׂיתָ לָּנוּ
  choice: Что ты с нами сделал
  rationale: Сохраняет обвинительный и эмоциональный характер еврейского вопроса без замены его причинным «зачем».
- source_word: לְהוֹצִיאָנוּ מִמִּצְרָיִם
  choice: выведя нас из Египта
  rationale: Деепричастный оборот естественно поясняет, какое именно действие вызвало упрёк, и сохраняет ключевое значение הוציא «вывести».
