lexical_decisions:
- source_word: וְאָמַר
  choice: Ведь ... скажет
  rationale: Перфект с waw в данном повествовательном контексте передаёт предстоящее действие, а союз вводит объяснение предыдущего повеления.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: о сынах Израиля
  rationale: Предлог ל при אמר здесь естественно понимать как указание на тех, о ком говорит фараон; буквальный оборот сохраняет исходное выражение.
- source_word: נְבֻכִים
  choice: в замешательстве бродят
  rationale: Причастие обозначает растерянность и дезориентацию; выбранная формулировка передаёт состояние и возможный оттенок беспорядочного движения, не сводя смысл исключительно к физической ловушке.
- source_word: בָּאָרֶץ
  choice: по этой земле
  rationale: В сочетании с глагольной передачей נְבֻכִים русский предлог «по» звучит естественно; указательное «этой» контекстуально обозначает местность перед глазами фараона, не уточняя её границ.
- source_word: סָגַר עֲלֵיהֶם
  choice: заперла их
  rationale: Идиома рисует пустыню как пространство, которое замкнулось вокруг израильтян и лишило их выхода.
- source_word: הַמִּדְבָּר
  choice: пустыня
  rationale: Современное русское «пустыня» естественно обозначает незаселённую пустынную местность Исхода и не обязательно подразумевает лишь пески.
