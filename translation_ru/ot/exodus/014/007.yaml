lexical_decisions:
- source_word: וַיִּקַּח
  choice: И взял он
  rationale: Форма wayyiqtol от לקח последовательно развивает повествование; русский порядок слов естественно связывает стих с предыдущим контекстом.
- source_word: שֵׁשׁ מֵאוֹת
  choice: шестьсот
  rationale: Прямая передача количественного числительного.
- source_word: רֶכֶב
  choice: колесниц
  rationale: При указанном числе собирательное значение «колесничное войско» естественно конкретизируется как исчисляемые колесницы.
- source_word: בָּחוּר
  choice: отборных
  rationale: Причастное прилагательное от בחר обозначает специально выбранные, лучшие военные единицы; «отборных» точно и естественно передаёт этот оттенок.
- source_word: וְכֹל רֶכֶב מִצְרַיִם
  choice: и все колесницы Египта
  rationale: Конструкция с כֹּל обозначает всю египетскую колесничную силу помимо шестисот отборных колесниц.
- source_word: וְשָׁלִשִׁם
  choice: военачальники
  rationale: Военный термин שָׁלִשִׁים может обозначать командиров, высокопоставленных военных помощников либо лиц, связанных с колесничными подразделениями. «Военачальники» сохраняет военный статус без буквального и неясного «третьи».
- source_word: עַל כֻּלּוֹ
  choice: на каждой из них
  rationale: Формально местоименный суффикс единственного числа соотносится с собирательным רֶכֶב; в контексте конструкция имеет распределительный смысл и указывает на наличие военного начальника при каждой колеснице либо во всём колесничном строю.
