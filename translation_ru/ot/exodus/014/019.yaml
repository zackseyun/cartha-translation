base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/019.yaml
  text: Then the angel of God[a], who had been going before the camp of Israel, moved and went behind them; and the pillar of cloud moved from before them and stood behind them.
translation:
  language: ru
  text: Тогда ангел Бога[a], шедший впереди стана Израиля, двинулся и пошёл позади них; и облачный столп двинулся из положения перед ними и встал позади них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посланник Бога». Еврейское слово может означать и ангела, и посланника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: переместился
  rationale: Глагол נסע может означать выступление в путь или снятие с места, но здесь описывает смену положения ангела и столпа относительно стана; «переместился» естественно передаёт пространственное движение.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: ангел Бога
  rationale: מַלְאָךְ допускает значения «ангел» и «посланник». В данном повествовании «ангел» — естественное и традиционное соответствие, не определяющее природу этой фигуры.
- source_word: הַהֹלֵךְ
  choice: шедший
  rationale: Причастие обозначает продолжавшееся действие и прежнее положение ангела; русское причастие кратко и точно сохраняет эту функцию.
- source_word: לִפְנֵי מַחֲנֵה יִשְׂרָאֵל
  choice: впереди стана Израиля
  rationale: לִפְנֵי имеет пространственное значение «перед, впереди»; «впереди стана Израиля» ясно и естественно в современном литературном русском.
- source_word: וַיֵּלֶךְ מֵאַחֲרֵיהֶם
  choice: пошёл позади них
  rationale: מֵאַחֲרֵי указывает здесь на положение в тылу, а не на преследование; перевод сохраняет движение и конечное расположение.
- source_word: עַמּוּד הֶעָנָן
  choice: облачный столп
  rationale: Устоявшееся русское библейское выражение, прозрачно передающее образ столпа, образованного облаком.
- source_word: מִפְּנֵיהֶם
  choice: от них назад
  rationale: В контексте перехода столпа с передней позиции на заднюю это естественно выражает исходное положение и направление движения, избегая неидиоматичного «от лица их».
- source_word: וַיַּעֲמֹד
  choice: встал
  rationale: עמד обозначает остановку в устойчивом положении; «встал» точно передаёт переход к неподвижному положению.
theological_decisions:
- issue: Природа и тождество מַלְאַךְ הָאֱלֹהִים
  choice: «ангел Бога» без уточнения его природы
  alternative: «посланник Бога» либо явное указание на богоявление
  rationale: Еврейский текст называет эту фигуру, но здесь не определяет, является ли она сотворённым ангелом, явлением Бога или кем-либо ещё. Перевод сохраняет эту богословскую неопределённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Стан» и «облачный столп» сохраняют достоинство и узнаваемую образность, оставаясь понятными широкому читателю.
