    rationale: Фраза «переместился от них назад» не показывает достаточно определённо, что столп находился перед израильтянами и сменил это положение. В еврейском тексте прямо сказано, что он двинулся «от перед ними» и встал позади них.
  - severity: low
    issue: Канцелярский оттенок глагола «переместился»
    rationale: Для описания движения ангела и столпа «двинулся» более естественно в современном литературном русском и не меняет значения נסע в данном контексте.
