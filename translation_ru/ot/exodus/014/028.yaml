base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/028.yaml
  text: And the waters returned and covered the chariots and the horsemen[a], all the army of Pharaoh that had gone after them into the sea; not one of them remained.
translation:
  language: ru
  text: Воды вернулись и покрыли колесницы и всадников[a] — всё войско фараона, вошедшее вслед за ними в море. Из них не осталось ни одного.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «конницу».'
    reason: Лексема הַפָּרָשִׁים может обозначать отдельных конных воинов («всадников») либо собирательно конницу.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּיִם
  choice: Воды возвратились
  rationale: Глагол שוב описывает возвращение вод в прежнее состояние и положение; «возвратились» сохраняет повествовательную образность и соответствует форме множественного числа.
- source_word: וַיְכַסּוּ
  choice: покрыли
  rationale: Прямое значение כסה — «покрывать»; контекстный смысл гибели не нуждается в поясняющем усилении вроде «поглотили».
- source_word: הָרֶכֶב
  choice: колесницы
  rationale: Собирательное רכב обозначает колесницы или колесничное войско; конкретное «колесницы» естественно в сочетании со всадниками.
- source_word: הַפָּרָשִׁים
  choice: всадников
  rationale: פָּרָשִׁים обозначает конных воинов; «всадники» — прямой и понятный перевод, при допустимом собирательном варианте «конница».
- source_word: לְכֹל חֵיל פַּרְעֹה
  choice: всё войско фараона
  rationale: חֵיל здесь имеет военное значение «войско», а כֹל выражает полноту названной группы.
- source_word: הַבָּאִים אַחֲרֵיהֶם בַּיָּם
  choice: вошедшее вслед за ними в море
  rationale: Причастие בָּאִים в данном контексте передаёт вступление преследователей в море; «вслед за ними» сохраняет отсылку к израильтянам.
- source_word: לֹא נִשְׁאַר בָּהֶם עַד אֶחָד
  choice: не осталось из них ни одного
  rationale: Естественная русская передача эмфатической идиомы, утверждающей полное отсутствие уцелевших среди указанной группы.
theological_decisions:
- issue: Объём гибели войска фараона
  choice: Ни один из воинов фараона, вошедших вслед за израильтянами в море, не остался.
  alternative: Отнести утверждение ко всему египетскому войску без ограничения.
  rationale: Определительное выражение «вошедшее вслед за ними в море» ограничивает названную полноту именно преследовавшим отрядом; перевод не распространяет утверждение на всех египетских воинов вообще.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет торжественную повествовательность, оставаясь ясным. Тире показывает, что «всё войско фараона» поясняет перечисленные военные силы, а точка с запятой удерживает итоговое утверждение в составе одного стиха.
