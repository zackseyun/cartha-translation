base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/025.yaml
  text: And he removed the wheels from his chariots, and drove them with difficulty. And Egypt said, “Let me flee from before Israel, for the LORD is fighting for them against Egypt.”
translation:
  language: ru
  text: 'Он снял колёса с колесниц Египта, так что они с трудом двигались.[a] Тогда Египет сказал: «Побегу от Израиля, потому что ГОСПОДЬ сражается за них против Египта».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте буквально: «снял колесо его колесниц и заставил его двигаться с трудом»; существительные и местоимение стоят в единственном числе, вероятно в собирательном значении. Русское множественное число передаёт смысл в контексте.'
    reason: Сохраняет доступным для читателя необычное единственное число еврейского текста и объясняет естественную русскую перестройку.
lexical_decisions:
- source_word: וַיָּסַר
  choice: снял
  rationale: 'Передаёт основное значение глагола סור в каузативном контексте: удалить, снять; субъект в еврейском тексте выражен местоименно и восстанавливается из предыдущего стиха.'
- source_word: אֹפַן מַרְכְּבֹתָיו
  choice: колёса с его колесниц
  rationale: Еврейское «колесо» стоит в единственном числе как собирательное, а суффикс — в мужском единственном числе и согласуется с собирательным «Египет»; русский текст сохраняет эту необычную форму отсылки.
- source_word: בִּכְבֵדֻת
  choice: с трудом
  rationale: Наречное употребление существительного передаёт тяжесть, затруднённость движения.
- source_word: מִצְרַיִם ... אָנ֨וּסָה
  choice: 'Египет сказал: «Побегу»'
  rationale: 'Сохранена грамматически значимая персонификация: собирательное «Египет» говорит в первом лице единственного числа.'
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона прописными буквами, позволяющая отличать имя заветного Бога от обычного титула «Господь».
- source_word: נִלְחָם לָהֶם בְּמִצְרָיִם
  choice: сражается за них против Египта
  rationale: 'Сохраняет обе предложные связи: действие в пользу Израиля и против Египта.'
theological_decisions:
- issue: Кто снимает колёса и затрудняет движение колесниц
  choice: Сохранено местоимение «Он», отсылающее к ГОСПОДУ из контекста предыдущего стиха
  alternative: 'Явно назвать субъект: «ГОСПОДЬ снял…»'
  rationale: В данном стихе субъект не назван существительным; явное имя устранило бы формальную связь с предшествующим контекстом и добавило бы слово в основной текст.
- issue: Единственное или множественное число в речи египтян
  choice: '«Египет сказал: „Побегу“»'
  alternative: '«Египтяне сказали: „Побежим“»'
  rationale: Еврейский текст намеренно использует собирательное «Египет» и первое лицо единственного числа; перевод не сглаживает эту персонификацию.
translation_notes:
  register: Современный литературный русский, с достоинством и без архаической тяжеловесности. Собирательное «Египет» и единственное число «Побегу» сохранены ради образности и грамматики источника; прописное «ГОСПОДЬ» обозначает тетраграмматон.
