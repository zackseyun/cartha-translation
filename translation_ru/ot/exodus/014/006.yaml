  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «своим народом» здесь, вероятно, подразумеваются люди, сопровождавшие фараона, то есть его военные силы; однако в еврейском тексте сказано именно «его народ», а не прямо «его войско».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר
  choice: запряг
  rationale: Глагол אָסַר буквально означает «связать, привязать»; в контексте колесницы речь идёт о запрягании упряжки. «Запряг» естественно и конкретно передаёт действие.
- source_word: רִכְבּוֹ
  choice: свою колесницу
  rationale: Существительное רֶכֶב может обозначать также колесничное войско, но форма единственного числа с местоименным суффиксом здесь естественнее всего указывает на собственную колесницу фараона.
- source_word: עַמּוֹ
  choice: свой народ
  rationale: Слово עַם обычно означает «народ». В данном военном контексте, вероятно, имеются в виду сопровождавшие фараона люди, но перевод «войско» уточнил бы то, чего еврейский текст прямо не говорит.
- source_word: לָקַח עִמּוֹ
  choice: взял с собой
  rationale: Прямой и естественный русский эквивалент сочетания глагола «взять» с предлогом «с» и местоименным суффиксом.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и повествовательный. Возвратные притяжательные местоимения «свою» и «свой» естественно указывают на фараона как на подлежащее. Буквальное значение глагола וַיֶּאְסֹר отражено конкретным русским «запряг», поэтому отдельная сноска к нему не требуется.
