  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: И вставь
  rationale: Глагол בוא буквально означает «принести/ввести», но при шестах и кольцах естественное русское «вставь» ясно передаёт направленное помещение внутрь колец.
- source_word: הַבַּדִּים
  choice: шесты
  rationale: בַּדִּים обозначает шесты для переноски священной утвари; «шесты» — современное и понятное русское соответствие.
- source_word: בַּטַּבָּעֹת
  choice: в кольца
  rationale: Предлог ב в сочетании с глаголом движения здесь выражает направление внутрь колец.
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: по сторонам ковчега
  rationale: צְלָעוֹת означает боковые стороны или боковые части; «по сторонам» естественно описывает расположение колец.
- source_word: הָאָרֹן
  choice: ковчег
  rationale: Хотя אָרוֹן может означать сундук или ящик, в контексте святилища закрепившееся и точное обозначение — «ковчег».
- source_word: לָשֵׂאת
  choice: чтобы носить
  rationale: נשא здесь обозначает физическую переноску; несовершенный вид «носить» передаёт назначение шестов для повторяющегося использования.
- source_word: בָּהֶם
  choice: на них
  rationale: Местоимение относится к шестам как к средству и опоре при переноске; русское «на них» естественно передаёт инструментальное значение и физическую конструкцию.
