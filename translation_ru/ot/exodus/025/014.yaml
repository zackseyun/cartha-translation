  source_fidelity: 'Смысл передан точно: шесты помещаются в кольца, расположенные на боковых сторонах ковчега, и служат для его переноски. Однако в исходной русской фразе «на них» формально может соотноситься как с шестами, так и с кольцами; в еврейском בָהֶם относится к шестам.'
  naturalness: «Вставь» и «шесты» естественны для современного литературного русского. Уточнение расположения колец и явное повторное называние шестов делают конструкцию яснее без тяжеловесности.
