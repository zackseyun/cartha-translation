lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: бутоны их
  rationale: В описании светильника כַּפְתֹּר обозначает округлую декоративную деталь в растительном узоре. «Бутоны» ясно передают этот образ современному читателю.
- source_word: וּקְנֹתָם
  choice: и ветви их
  rationale: Хотя קָנֶה буквально может означать «тростник» или «стебель», здесь речь идёт о боковых частях светильника; «ветви» естественно сочетаются с растительным оформлением.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: должны быть с ним одним целым
  rationale: Оборот выражает предписание и указывает, что детали должны быть изготовлены как неотъемлемые части самого светильника, а не прикреплены отдельно.
- source_word: כֻּלָּהּ
  choice: весь светильник
  rationale: Местоименная форма подчёркивает целостность всего предмета; явное повторение «светильник» устраняет неясность рода и референта в русском тексте.
- source_word: מִקְשָׁה אַחַת
  choice: единая чеканная работа
  rationale: מִקְשָׁה описывает изделие, сформированное ударами из одного куска металла, а אַחַת подчёркивает его единство. «Чеканная работа» — традиционно понятное и точное обозначение техники.
- source_word: זָהָב טָהוֹר
  choice: чистого золота
  rationale: Естественная русская передача устойчивого древнееврейского сочетания со значением золота без примесей.
