  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «ЙХВХ»; возможные передачи: «Яхве» или «Иегова».'
