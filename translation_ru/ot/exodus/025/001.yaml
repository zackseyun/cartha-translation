lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … сказал
  rationale: Последовательная форма с וַ продвигает повествование; русское «и» естественно передаёт связь с предыдущим контекстом. В сочетании с לֵאמֹר глагол «сказал» вводит последующую прямую речь без тяжеловесного повтора.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно обозначает адресата речи; имя מֹשֶׁה передано в общепринятой русской форме «Моисей».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Формула вводит содержание последующей прямой речи. В современном русском её функцию естественно и полно передаёт двоеточие, без буквального и стилистически тяжёлого «говоря».
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה. Форма «Яхве» непосредственно передаёт имя и не заменяет его титулом; возможная иная традиционная передача отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная повествовательная формула. Двоеточие естественно вводит речь, начинающуюся в следующем стихе.
