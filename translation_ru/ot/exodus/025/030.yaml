  yaml_path: translation/ot/exodus/025/030.yaml
  text: And you shall set the bread of the Presence on the table before me continually[a].
translation:
  language: ru
  text: И всегда клади на стол предо Мной хлеб Присутствия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлеб лица» или «хлеб присутствия»; традиционно — «хлеб предложения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: И … клади
  rationale: Форма с союзом продолжает ряд предписаний; в русском языке повелительное «клади» естественно передаёт обязательное действие в данном законодательном контексте.
- source_word: עַל הַשֻּׁלְחָן
  choice: на стол
  rationale: Предлог указывает на положение хлеба на ранее описанном определённом столе; русский контекст позволяет естественно употребить существительное без указательного уточнения.
- source_word: לֶחֶם פָּנִים
  choice: хлеб Присутствия
  rationale: Сочетание буквально связано с «лицом/присутствием». «Хлеб Присутствия» сохраняет особый культовый термин и не смешивает его со следующим выражением «предо Мной».
- source_word: לְפָנַי
  choice: предо Мной
  rationale: Буквально «перед Моим лицом / передо Мной»; выбран dignified и ясный оборот прямой Божьей речи.
- source_word: תָּמִיד
  choice: всегда
  rationale: В культовом контексте обозначает постоянное, непрерывно поддерживаемое установление; «всегда» ясно и естественно передаёт это требование.
theological_decisions:
- issue: Значение культового выражения לֶחֶם פָּנִים
  choice: хлеб Присутствия
  alternative: хлеб предложения; хлеб, лежащий предо Мной
  rationale: Выбор сохраняет образ Божьего присутствия и отличие этого наименования от отдельной фразы לְפָנַי «предо Мной», не вводя позднейшую конфессиональную терминологию как единственно возможное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «предо Мной». Заглавная буква в слове «Присутствия» показывает, что речь идёт о присутствии Бога, не превращая выражение в позднейший догматический термин.
