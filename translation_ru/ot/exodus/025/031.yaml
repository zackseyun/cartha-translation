base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/031.yaml
  text: And you shall make a lampstand of pure gold[a]. The lampstand shall be made of hammered work; its base and its shaft, its cups, its buds[b], and its flowers shall be of one piece with it.
translation:
  language: ru
  text: Сделай светильник из чистого золота. Светильник должен быть чеканной работы[a]; его основание и ствол, его чашечки, бутоны[b] и цветы должны быть сделаны заодно с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избитой работы». Еврейское слово указывает на обработку металла ударами молота, по-видимому с изготовлением светильника из одного куска, а не из отдельно соединённых деталей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «округлые выступы». Еврейское слово обозначает выпуклые украшения в растительном узоре светильника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת
  choice: светильник
  rationale: Слово обозначает подставку с лампадами, а не отдельную лампу. «Светильник» — понятный и укоренённый в русском библейском языке эквивалент; транслитерация «менора» внесла бы более позднюю культурную ассоциацию.
- source_word: זָהָב טָהוֹר
  choice: чистое золото
  rationale: Естественное русское обозначение очищенного золота без примесей.
- source_word: מִקְשָׁה תֵּעָשֶׂה
  choice: должен быть выкован
  rationale: Передаёт изготовление металла ударами молота. Последующая фраза уточняет, что элементы не присоединялись отдельно, а составляли со светильником одно целое.
- source_word: יְרֵכָהּ
  choice: его основание
  rationale: Буквально слово может означать «бедро» или «бок», но применительно к предмету указывает на нижнюю опорную часть.
- source_word: וְקָנָהּ
  choice: его ствол
  rationale: В единственном числе здесь назван центральный вертикальный стержень светильника; «ствол» также согласуется с растительным обликом украшений.
- source_word: גְּבִיעֶיהָ
  choice: его чашечки
  rationale: Речь идёт о чашеобразных декоративных элементах; уменьшительная форма естественна для орнамента.
- source_word: כַּפְתֹּרֶיהָ
  choice: бутоны
  rationale: Слово обозначает округлые выступающие украшения. «Бутоны» уместны в растительном узоре, но неоднозначность отмечена в сноске.
- source_word: וּפְרָחֶיהָ
  choice: цветы
  rationale: Прямо и понятно передаёт растительный декоративный мотив.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: должны составлять с ним одно целое
  rationale: Фраза указывает, что перечисленные детали выходят из самого светильника и не являются отдельно присоединёнными частями.
