translation_notes:
  register: Современный литературный русский язык с лаконичной структурой перечня. Повторяющийся еврейский союз ו передан естественной русской координацией, без механического повторения «и». Слово «пряжу» объединяет три цветных текстильных материала; точка с запятой сохраняет незавершённость стиха как части более длинного перечня.
