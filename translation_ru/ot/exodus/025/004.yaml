  text: голубую[a], пурпурную и алую[b] пряжу, тонкий лён и козью шерсть[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «сине-фиолетовую». Еврейское слово обозначает окрашенный материал синего или сине-пурпурного оттенка.'
    reason: lexical_alternative
  - marker: b
    text: Буквально выражение связано с «червём»; имеется в виду алый краситель, который получали из насекомых, и окрашенный им материал.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «коз»; по контексту подразумевается козья шерсть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְכֵלֶת
  choice: голубую
  rationale: Обозначает дорогой окрашенный материал сине-пурпурного спектра. В контексте перечня материалов подразумевается пряжа; слово «голубую» даёт ясное и традиционно понятное обозначение цвета, а возможный сине-фиолетовый оттенок отмечен в сноске.
- source_word: אַרְגָּמָן
  choice: пурпурную
  rationale: Обозначает дорогой пурпурно окрашенный текстильный материал. Слово «пряжу», поставленное после ряда цветовых определений, естественно относится и к этому прилагательному.
- source_word: תוֹלַעַת שָׁנִי
  choice: алую пряжу
  rationale: Устойчивое сочетание обозначает алый материал, окрашенный красителем, который получали из насекомых. Буквальное зоологическое выражение в основном тексте было бы непонятно, поэтому передан результат окрашивания, а происхождение красителя сохранено в сноске.
- source_word: שֵׁשׁ
  choice: тонкий лён
  rationale: В описаниях святилища это слово обозначает тонкую качественную льняную ткань или льняной материал. «Тонкий лён» сохраняет материальный смысл и указание на качество.
- source_word: עִזִּים
  choice: козью шерсть
  rationale: В еврейском тексте буквально стоит «коз», однако в перечне сырья подразумевается получаемая от коз шерсть, использовавшаяся для тканых покрытий.
