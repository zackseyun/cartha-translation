    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: И вот
  rationale: Союз ו и указательное местоимение זֹאת вводят последующее перечисление; «И вот» естественно передаёт эту презентационную функцию.
- source_word: הַ/תְּרוּמָה
  choice: приношение
  rationale: תְּרוּמָה обозначает вклад, отделённый для священной цели. «Приношение» сохраняет сакральный оттенок и подходит к сбору материалов для святилища.
- source_word: אֲשֶׁר תִּקְח֖וּ מֵ/אִתָּם
  choice: которое вы должны брать у них
  rationale: Форма תִּקְחוּ — 2-е лицо множественного числа и в данном контексте выражает предписание. Глагол «брать» близко передаёт לקח, не заменяя его более толковательным «принимать».
- source_word: זָהָב
  choice: золото
  rationale: Прямое и общепринятое обозначение материала.
- source_word: כֶסֶף
  choice: серебро
  rationale: Прямое и общепринятое обозначение материала в перечне металлов.
- source_word: נְחֹשֶׁת
  choice: бронза
  rationale: В перечнях материалов для святилища слово обычно понимается как бронза — металл или медный сплав, пригодный для изготовления предметов; возможное значение «медь» сохранено в сноске.
