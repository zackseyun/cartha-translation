lexical_decisions:
- source_word: מַלְקָחֶיהָ
  choice: щипцы к нему
  rationale: Существительное обозначает приспособление для захватывания или подрезания; в контексте светильника «щипцы» — естественное и достаточно широкое обозначение орудия для работы с фитилями. Местоименное значение суффикса передано оборотом «к нему», поскольку речь идёт о принадлежностях светильника.
- source_word: מַחְתֹּתֶיהָ
  choice: совки к нему
  rationale: Слово обычно обозначает сосуды или приспособления для углей и огня. «Совки» сохраняет предметный и культовый контекст, не сужая значение до кадильниц; принадлежность светильнику передана словами «к нему».
- source_word: זָהָב טָהוֹר
  choice: из чистого золота
  rationale: Фраза прямо указывает материал изготовления; по-русски после перечисления предметов естественна конструкция «из чистого золота».
- source_word: וּ
  choice: и
  rationale: Союз связывает два вида принадлежностей и непосредственно передаётся русским «и».
- source_word: -הָ
  choice: к нему
  rationale: Древнееврейский суффикс женского рода относится к светильнику, грамматически женского рода в древнееврейском; в русском «светильник» мужского рода, поэтому согласование дано по нормам русского языка.
