base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/020.yaml
  text: And the cherubim shall spread out their wings upward[a], overshadowing the mercy seat with their wings, and their faces shall be one toward another; the faces of the cherubim shall be toward the mercy seat.
translation:
  language: ru
  text: Херувимы должны быть с распростёртыми вверх крыльями, осеняя ими крышку ковчега[a]. Лица их пусть будут обращены друг к другу, а лица херувимов — к крышке ковчега.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крышку искупления». Еврейское слово каппорет обозначает золотую крышку ковчега и связано с обрядом искупления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: пусть ... простирают / пусть ... будут обращены
  rationale: В контексте предписаний форма выражает требование к изготовлению; конструкция с «пусть» естественно передаёт директивную силу по-русски.
- source_word: הַכְּרֻבִים
  choice: херувимы
  rationale: Традиционное и общеупотребительное русское обозначение изображённых небесных существ.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: простирают крылья вверх
  rationale: Передаёт активную позу причастной конструкции и направленность крыльев вверх.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: осеняя ими
  rationale: «Осенять» естественно описывает распростёртые над предметом крылья и сохраняет образ покрывания сверху; местоимение «ими» относится к крыльям.
- source_word: עַל הַכַּפֹּרֶת
  choice: крышку ковчега
  rationale: כַּפֹּרֶת обозначает золотую крышку ковчега; добавление «ковчега» делает предмет ясным современному читателю, не закрепляя спорную богословскую интерпретацию в основном тексте.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: обращены лицом друг к другу
  rationale: Естественно передаёт взаимную направленность, выраженную буквальной распределительной идиомой «каждый к своему брату».
- source_word: אֶל הַכַּפֹּרֶת יִהְיוּ פְּנֵי הַכְּרֻבִים
  choice: их лица — к крышке ковчега
  rationale: Сохраняет конкретное упоминание лиц и подчёркнутую в еврейском тексте направленность к крышке.
theological_decisions:
- issue: Передача כַּפֹּרֶת в предписаниях о святилище
  choice: крышка ковчега
  alternative: крышка искупления; престол милости
  rationale: В непосредственном предметном смысле речь идёт о золотой крышке ковчега. Основной вариант не устраняет её культового значения, а сноска сохраняет богословски значимую лексическую альтернативу без навязывания одной интерпретации.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для описания священного предмета. Повтор «лица / крышка ковчега» частично сохранён ради композиции исходного текста; стих разделён на два предложения для ясности.
