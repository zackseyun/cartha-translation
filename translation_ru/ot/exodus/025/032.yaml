  text: 'And six branches shall come out from its sides: three branches of the lampstand from its one side[a], and three branches of the lampstand from its other side.'
translation:
  language: ru
  text: 'И шесть ветвей будут выходить из его боков: три ветви светильника — с одной его стороны и три ветви светильника — с другой его стороны.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָנִים
  choice: ветви
  rationale: В описании светильника слово обозначает отходящие от его корпуса элементы; «ветви» естественно передаёт растительный образ и устройство предмета.
- source_word: יֹצְאִים
  choice: будут выходить
  rationale: Причастие описывает ветви как исходящие из боков светильника; будущее время уместно передаёт предписывающий характер раздела.
- source_word: מִצִּדֶּיהָ
  choice: из его боков
  rationale: Сохранены множественное число и пространственное значение предлога מן. Местоимение согласовано с русским словом «светильник».
- source_word: קְנֵי מְנֹרָה
  choice: ветви светильника
  rationale: Конструкция принадлежности передана прямо, с сохранением повтора исходного текста.
- source_word: מְנֹרָה
  choice: светильник
  rationale: Общеупотребительное русское название предмета яснее транслитерации «менора» и соответствует культовому контексту.
- source_word: הָאֶחָד ... הַשֵּׁנִי
  choice: из одного его бока ... из другого его бока
  rationale: В русском противопоставление «одного… другого» естественно передаёт еврейскую пару «один… второй», не создавая впечатления нумерации конструктивных деталей.
