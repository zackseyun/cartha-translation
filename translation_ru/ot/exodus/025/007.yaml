  text: камни оникса[a] и камни для вставки в эфод и нагрудник[c].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «оникс», могло обозначать другой драгоценный камень; точная идентификация неизвестна.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «камни для оправы» или «камни, предназначенные для вставки».'
    reason: lexical_alternative
  - marker: c
    text: 'Традиционно: «наперсник».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי
  choice: камни
  rationale: Форма сопряжённого множественного числа от אֶבֶן имеет общее значение «камни». В перечне подразумеваются ценные камни, но нейтральный перевод сохраняет широту еврейского слова.
- source_word: שֹׁהַם
  choice: оникс
  rationale: Точная минералогическая идентификация שֹׁהַם неизвестна. «Оникс» — традиционный и узнаваемый перевод; неопределённость отмечена в сноске.
- source_word: אַבְנֵי מִלֻּאִים
  choice: камни для вставки
  rationale: מִלֻּאִים связано с заполнением или вставкой и здесь обозначает камни, предназначенные для закрепления в оправах. Выражение «для вставки» естественно по-русски и не уточняет сверх текста способ ювелирной работы.
- source_word: לָאֵפֹד
  choice: для эфода
  rationale: אֵפוֹד — специальное название священнического облачения; транслитерация сохраняет технический термин без спорной описательной замены.
- source_word: וְלַחֹשֶׁן
  choice: и нагрудника
  rationale: חֹשֶׁן обозначает священническую нагрудную принадлежность с оправами для камней. «Нагрудник» понятнее современному читателю, чем традиционное «наперсник», и не вызывает ассоциации с воинским доспехом.
