  text: וּ/בַ/מְּנֹרָ֖ה אַרְבָּעָ֣ה גְבִעִ֑ים מְשֻׁקָּדִ֔ים כַּפְתֹּרֶ֖י/הָ וּ/פְרָחֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/034.yaml
  text: And on the lampstand there shall be four cups made like almond blossoms[b][a], with its buds and its flowers.
translation:
  language: ru
  text: А на светильнике — четыре чашечки в виде цветков миндаля[a], с его бутонами[b] и цветами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «миндалевидные»; или: «украшенные цветками миндаля». Еврейское слово может указывать на форму либо на растительный орнамент.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «округлыми украшениями». Еврейское слово обозначает округлую декоративную деталь светильника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: А на светильнике
  rationale: Сочетание союза и предлога естественно передаётся как «А на»; מְנֹרָה обозначает светильник как цельную конструкцию.
- source_word: אַרְבָּעָה גְבִעִים
  choice: четыре чашечки
  rationale: גְבִעִים обозначает чашеобразные декоративные детали; уменьшительная форма «чашечки» естественна для небольших элементов светильника.
- source_word: מְשֻׁקָּדִים
  choice: в виде цветков миндаля
  rationale: Слово, образованное от названия миндаля, описывает миндалевидное или украшенное миндальным цветом оформление; выбранная формулировка ясно передаёт растительный образ, не сводя его только к гравировке.
- source_word: כַּפְתֹּרֶיהָ
  choice: с его бутонами
  rationale: כפתר — округлая декоративная деталь. «Бутоны» сохраняет растительную образность, хотя возможно более формальное «шишечки» или нейтральное «округлые украшения».
- source_word: וּפְרָחֶיהָ
  choice: и цветами
  rationale: פֶּרַח означает цветок или распустившийся цвет; «цветами» ясно и естественно сочетается с «бутонами».
theological_decisions: []
