  text: You shall overlay it with pure gold[a], and you shall make for it a gold molding all around.
translation:
  language: ru
  text: Обложи его чистым золотом и сделай вокруг него золотую кайму[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «золотой ободок», «золотую окантовку». Еврейское слово может обозначать декоративную кромку. Традиционный перевод «венец» здесь относится к украшению, проходящему вокруг стола.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: обложи
  rationale: В данном ремесленном контексте глагол צפה означает покрыть деревянный предмет слоем металла; «обложи золотом» точно и естественно передаёт эту операцию.
- source_word: אֹתוֹ
  choice: его
  rationale: Местоимение прямого дополнения относится к столу из предыдущего стиха; в русском языке сохраняется мужской род слова «стол».
- source_word: זָהָב טָהוֹר
  choice: чистым золотом
  rationale: Сочетание обозначает золото высокой чистоты; это прямой и общепонятный русский эквивалент.
- source_word: וְעָשִׂיתָ
  choice: и сделай
  rationale: Простой глагол «сделай» сохраняет характер прямого предписания и не добавляет отсутствующих в исходном тексте оттенков.
- source_word: לּוֹ
  choice: вокруг него
  rationale: Принадлежность каймы столу естественно выражена местоимением «него» в сочетании с последующим סָבִיב; такая перестройка соответствует нормам русского языка.
- source_word: זֵר
  choice: кайму
  rationale: Здесь слово обозначает окружающую предмет декоративную окантовку. «Кайма» понятно передаёт эту функцию, не навязывая традиционный, но потенциально двусмысленный образ «венца».
- source_word: זָהָב
  choice: золотую
  rationale: Материал естественно передан относительным прилагательным, согласованным со словом «кайма».
- source_word: סָבִיב
  choice: вокруг
  rationale: Наречие указывает, что кайма охватывает стол по периметру; «вокруг» передаёт это кратко и естественно.
