  terminology: «Ковчег свидетельства» и «херувимы» — точные и устойчивые библейские термины. «Крышка искупления» является допустимой предметно-культовой передачей הַכַּפֹּרֶת; сноска добросовестно отмечает вариант «крышка очищения» и традиционное «престол милости», не выдавая спорный этимологический вывод за единственно возможный. «Сыны Израиля» сохраняет форму исходного выражения; сноска даёт более естественные русские смысловые альтернативы.
