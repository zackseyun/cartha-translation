  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: место встречи, речь Бога с Моисеем, пространственные указания «над крышкой» и «между двумя херувимами», ковчег свидетельства и содержание повелений для сынов Израиля. «Буду встречаться» допустимо передаёт будущую, потенциально повторяющуюся встречу в назначенном месте. Оборот «обо всём, что Я повелю тебе» правильно связывает речь с последующими повелениями.'
