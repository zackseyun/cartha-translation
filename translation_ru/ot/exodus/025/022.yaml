  text: וְ/נוֹעַדְתִּ֣י לְ/ךָ֮ שָׁם֒ וְ/דִבַּרְתִּ֨י אִתְּ/ךָ֜ מֵ/עַ֣ל הַ/כַּפֹּ֗רֶת מִ/בֵּין֙ שְׁנֵ֣י הַ/כְּרֻבִ֔ים אֲשֶׁ֖ר עַל אֲרֹ֣ן הָ/עֵדֻ֑ת אֵ֣ת כָּל אֲשֶׁ֧ר אֲצַוֶּ֛ה אוֹתְ/ךָ֖ אֶל בְּנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/022.yaml
  text: And there I will meet with you[a], and I will speak with you from above the mercy seat, from between the two cherubim that are over the ark of the testimony[b], about all that I will command you for the sons of Israel.
translation:
  language: ru
  text: Там Я буду встречаться с тобой и говорить с тобой с места над крышкой искупления[a], между двумя херувимами, которые находятся над ковчегом свидетельства, — обо всём, что Я повелю тебе для сынов Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крышкой очищения»; традиционный перевод: «престолом милости». Имеется в виду золотая крышка ковчега.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к сынам Израиля»; по смыслу также возможно: «для израильтян».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹעַדְתִּי לְךָ שָׁם
  choice: Там Я буду встречаться с тобой
  rationale: Нифаль глагола יעד здесь обозначает встречу в назначенном месте. Будущее несовершенного вида естественно передаёт повторяющиеся встречи Бога с Моисеем у ковчега.
- source_word: וְדִבַּרְתִּי אִתְּךָ
  choice: и говорить с тобой
  rationale: Предлог אֵת при דבר поддерживает значение непосредственного общения «говорить с тобой», а не только одностороннего «говорить тебе».
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: с места над крышкой искупления
  rationale: מֵעַל указывает, откуда исходит речь. Добавление «с места» делает пространственное отношение ясным по-русски, а «крышка искупления» обозначает особую золотую крышку ковчега и сохраняет связь термина с корнем כפר.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: между двумя херувимами
  rationale: Прямо и естественно передаёт положение источника голоса; «херувимы» — принятая русская библейская форма.
- source_word: אֲשֶׁר עַל אֲרֹן הָעֵדֻת
  choice: которые находятся над ковчегом свидетельства
  rationale: «Над» соответствует положению херувимов относительно ковчега; «ковчег свидетельства» формально сохраняет הָעֵדֻת, не уточняя в основном тексте, что речь идёт о скрижалях.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּה אוֹתְךָ
  choice: обо всём, что Я повелю тебе
  rationale: Оборот с «обо всём» естественно связывается в русском с предшествующим «говорить» и сохраняет полноту כָּל.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: для сынов Израиля
  rationale: Сохраняет направленность повелений к Израилю и семейно-национальный образ буквального выражения בְּנֵי יִשְׂרָאֵל, не добавляя отсутствующего в тексте глагола «передать».
theological_decisions:
- issue: Передача הַכַּפֹּרֶת
  choice: крышка искупления
  alternative: крышка очищения; крышка ковчега; престол милости
  rationale: Контекст требует названия священной золотой крышки ковчега. Выбор сохраняет как предметное значение «крышка», так и культовую связь с искуплением, не превращая предмет буквально в престол; традиционный вариант отмечен в сноске.
- issue: Передача אֶל בְּנֵי יִשְׂרָאֵל
  choice: для сынов Израиля
  alternative: к сынам Израиля; для израильтян; народу Израиля
  rationale: Еврейская конструкция допускает оттенки направления и предназначения. Основной текст сохраняет её сжатость и семейный образ, а сноска указывает естественные смысловые варианты.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранены традиционные библейские термины «херувимы», «ковчег» и «свидетельство»; редкий культовый термин пояснён в сноске. Тире отделяет заключительное содержание Божьей речи и облегчает восприятие длинного предложения.
