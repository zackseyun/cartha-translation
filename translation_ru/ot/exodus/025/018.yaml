  rationale: Выражение «крышка искупления» понятно современному читателю, обозначает реальный предмет и сохраняет культовый смысл, не представляя его как сиденье. Традиционное «очистилище» документировано в сноске, поскольку оно узнаваемо, но в современном русском может быть воспринято как название помещения.
