lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: И сделай
  rationale: В последовательности предписаний форма с союзом передаёт повеление; русский императив естественно сохраняет инструктивный характер текста.
- source_word: שְׁנַיִם כְּרֻבִים
  choice: двух херувимов
  rationale: Традиционная передача названия небесных существ сохраняет особый референт; форма винительного падежа одушевлённого существительного нормативна для современного русского языка.
- source_word: זָהָב
  choice: из золота
  rationale: Обозначает материал, из которого следует изготовить херувимов.
- source_word: מִקְשָׁה
  choice: чеканной работы
  rationale: Слово указывает на изготовление металла выколоткой или чеканкой. Формулировка сохраняет способ изготовления, не добавляя прямо отсутствующего здесь выражения «из одного куска».
- source_word: תַּעֲשֶׂה אֹתָם
  choice: сделай их
  rationale: Повтор глагола сохранён, поскольку в еврейском тексте он вновь подчёркивает изготовление и его способ.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: с двух концов
  rationale: Сохраняет значение предлога מִן и пространственную связь херувимов с обоими концами крышки, не сводя её лишь к расположению рядом с ними.
- source_word: הַכַּפֹּרֶת
  choice: крышка искупления
  rationale: Передаёт одновременно предметное значение крышки ковчега и культовую связь термина с искуплением; более традиционный вариант приведён в сноске.
theological_decisions:
