  text: וּ/רְאֵ֖ה וַ/עֲשֵׂ֑ה בְּ/תַ֨בְנִיתָ֔/ם אֲשֶׁר אַתָּ֥ה מָרְאֶ֖ה בָּ/הָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/040.yaml
  text: And see that you make them according to their pattern[a], which was shown to you on the mountain.
translation:
  language: ru
  text: Смотри же, сделай их по их образцу[a], который показан тебе на горе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Смотри и сделай их по их образцу, который показан тебе на горе».'
    reason: Возможен более буквальный перевод двух согласованных повелительных форм וּרְאֵה וַעֲשֵׂה.
lexical_decisions:
- source_word: וּרְאֵה
  choice: Смотри же
  rationale: Императив ראה здесь служит предостережением, требующим особого внимания. «Смотри же» естественно передаёт эту функцию и сохраняет повелительную силу.
- source_word: וַעֲשֵׂה
  choice: сделай
  rationale: В контексте изготовления предметов святилища עשה означает «сделать, изготовить». Повелительная форма передана прямо и естественно.
- source_word: בְּתַבְנִיתָם
  choice: по их образцу
  rationale: תבנית может означать образец, модель или форму; суффикс 3-го лица множественного числа передан словом «их». «По образцу» выражает требуемое соответствие показанной модели.
- source_word: אֲשֶׁר
  choice: который
  rationale: Относительное местоимение вводит придаточное, относящееся к слову «образец».
- source_word: אַתָּה מָרְאֶה
  choice: показан тебе
  rationale: מָרְאֶה понимается как хофальный причастный оборот от ראה — «быть показываемым». Русская результативная пассивная конструкция естественно передаёт, что Моисею был явлен образец, не называя действующее лицо.
- source_word: בָּהָר
  choice: на горе
  rationale: В данном контексте предлог ב обозначает место пребывания Моисея; нормативный русский эквивалент — «на горе».
theological_decisions:
- issue: Природа показанного образца предметов святилища
  choice: образец
  alternative: модель; форма; план
  rationale: «Образец» сохраняет широту значения תבנית и не навязывает представление о конкретной метафизической природе небесного первообраза.
- issue: Вид и время причастия מָרְאֶה
  choice: который показан тебе
  alternative: который тебе показывают
  rationale: Пассивное значение сохраняется, а русская краткая форма причастия естественно выражает актуальный результат состоявшегося откровения. При этом перевод не уточняет, каким именно образом был показан образец.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной повелительной интонацией. Частица «же» передаёт предостерегающую функцию первого императива; богословски нагруженные уточнения не добавлены.
