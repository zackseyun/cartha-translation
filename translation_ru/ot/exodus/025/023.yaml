  yaml_path: translation/ot/exodus/025/023.yaml
  text: You shall make a table of acacia wood[a], two cubits its length, one cubit its width, and a cubit and a half its height.
translation:
  language: ru
  text: 'Сделай стол из древесины акации: длиной в два локтя, шириной в один локоть и высотой в полтора локтя.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Сделай
  rationale: Форма с союзом в последовательности предписаний передаёт повелительное значение. В русском повелительное наклонение естественно и ясно выражает директиву; начальный союз контекстуально подразумевается.
- source_word: שֻׁלְחָן
  choice: стол
  rationale: Обычное обозначение данного предмета святилища; в русском языке неопределённый артикль не требуется.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Сочетание буквально обозначает древесину дерева шиттим; «древесина акации» точно и естественно передаёт материал.
- source_word: אַמָּתַיִם אָרְכּוֹ
  choice: длиной в два локтя
  rationale: Сохраняется древняя мера длины, а русская конструкция естественно передаёт буквальное «длина его — два локтя».
- source_word: וְאַמָּה רָחְבּוֹ
  choice: шириной в один локоть
  rationale: Явное «один» поддерживает параллельный перечень размеров и точно передаёт числовое значение.
- source_word: וְאַמָּה וָחֵצִי קֹמָתוֹ
  choice: и высотой в полтора локтя
  rationale: «Полтора локтя» — естественный современный русский эквивалент еврейского «локоть и половина»; «высота» соответствует предметному контексту.
