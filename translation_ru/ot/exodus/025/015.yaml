  text: The poles shall remain in the rings of the ark[a]; they shall not be removed from it.
translation:
  language: ru
  text: Шесты должны оставаться в кольцах ковчега[a]; их нельзя вынимать из него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Шесты должны быть в кольцах ковчега; их нельзя вынимать из него».'
    reason: 'Лексическая альтернатива: יִהְיוּ буквально означает «будут / должны быть»; в контексте запрета не вынимать шесты передаёт также их постоянное нахождение в кольцах. Мִמֶּנּוּ означает «из него / от него», то есть от ковчега.'
lexical_decisions:
- source_word: בְּטַבְּעֹת
  choice: в кольцах
  rationale: Предлог בְּ естественно передаёт нахождение шестов в кольцах, прикреплённых к ковчегу.
- source_word: הָאָרֹן
  choice: ковчега
  rationale: В контексте святилища אָרוֹן обозначает священный ковчег; это точный и общепонятный русский термин.
- source_word: יִהְיוּ
  choice: должны оставаться
  rationale: Буквально глагол означает «быть», но вместе с последующим запретом выражает постоянное нахождение шестов на месте.
- source_word: הַבַּדִּים
  choice: шесты
  rationale: Речь идёт о длинных шестах для переноски ковчега; «шесты» — естественное современное русское обозначение.
- source_word: לֹא יָסֻרוּ
  choice: их нельзя вынимать
  rationale: Форма глагола סור здесь выражает запрет удаления шестов; безличная конструкция естественна по-русски и сохраняет смысл предписания.
- source_word: מִמֶּנּוּ
  choice: оттуда
  rationale: Местоименный суффикс мужского рода отсылает к ковчегу, однако по-русски применительно к выниманию шестов из его колец естественно сказать «оттуда».
