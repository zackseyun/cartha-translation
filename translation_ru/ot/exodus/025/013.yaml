  text: You shall make poles of acacia wood and overlay them with gold.
translation:
  language: ru
  text: И сделай шесты из древесины акации и обложи их золотом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: И сделай
  rationale: Форма в последовательности предписаний передаёт повеление, обращённое к одному лицу; союз וְ сохранён как «и».
- source_word: בַדֵּי
  choice: шесты
  rationale: Существительное обозначает шесты, предназначенные для переноски ковчега; «шесты» — ясный и уместный в данном контексте современный эквивалент.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Сопряжённая конструкция обозначает материал — древесину акации; такая формулировка точна и естественна по-русски.
- source_word: וְצִפִּיתָ
  choice: и обложи
  rationale: Глагол означает покрыть основу другим материалом; «обложи золотом» естественно передаёт ремесленную операцию покрытия деревянных шестов.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение прямого дополнения во множественном числе относится к шестам.
- source_word: זָהָב
  choice: золотом
  rationale: Творительный падеж естественно обозначает материал покрытия при русском глаголе «обложить».
