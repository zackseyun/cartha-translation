base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/010.yaml
  text: They shall make an ark of acacia wood[a], two and a half cubits its length, a cubit and a half its width[c][b], and a cubit and a half its height.
translation:
  language: ru
  text: 'Пусть они сделают ковчег[a] из древесины акации[b]: два с половиной локтя[c] в длину, полтора локтя в ширину и полтора локтя в высоту.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сундук» или «ларец». Еврейское слово обозначает вместилище такого рода; здесь сохранено традиционное «ковчег», поскольку речь идёт о священном ковчеге.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из дерева шиттим»; вероятно, имеется в виду древесина акации.'
    reason: lexical_alternative
  - marker: c
    text: Локоть — древняя мера длины, приблизительно равная расстоянию от локтя до кончиков пальцев.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Пусть они сделают
  rationale: Форма 3-го лица множественного числа в контексте предписания передана естественной для современного русского языка побудительной конструкцией; начальный союз не воспроизведён механически.
- source_word: אֲרוֹן
  choice: ковчег
  rationale: Слово обозначает ларь, сундук или иной вместилище, однако в данном сакральном контексте традиционное «ковчег» точно указывает на особый предмет святилища.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Сочетание обозначает материал. «Древесина акации» понятно современному читателю и точнее по смыслу, чем традиционная транслитерация названия дерева.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: два с половиной локтя
  rationale: Сохранена древняя единица длины и точно передано числовое значение.
- source_word: אָרְכּוֹ
  choice: в длину
  rationale: Естественная русская формулировка при перечислении размеров предмета; притяжательное значение ясно из контекста.
- source_word: וְאַמָּה וָחֵצִי
  choice: полтора локтя
  rationale: Идиоматичная русская передача буквального «локоть и половина» без изменения величины.
- source_word: רָחְבּוֹ
  choice: в ширину
  rationale: Передаёт горизонтальный поперечный размер предмета современным общеупотребительным словом.
- source_word: קֹמָתוֹ
  choice: в высоту
  rationale: В описании предмета слово обозначает его вертикальный размер.
theological_decisions:
- issue: Сакральное значение אֲרוֹן
  choice: ковчег
  alternative: сундук; ларец
  rationale: Перевод «ковчег» сохраняет укоренившееся обозначение священного вместилища, а сноска отмечает более широкое предметное значение еврейского слова, не навязывая дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной повествовательно-предписывающей интонацией. Порядок размеров слегка перестроен ради естественности русского перечисления, при полном сохранении единиц и величин. Все сноски привязаны к соответствующим словам в основном тексте.
