  text: Его и все эти предметы следует изготовить из таланта чистого золота.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его вместе со всеми этими предметами». Еврейское слово может обозначать различные предметы, орудия или сосуды, относящиеся к светильнику.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: талант
  rationale: Это стандартная древняя мера веса; традиционный метрологический термин здесь точнее, чем общее обозначение количества золота.
- source_word: זָהָב טָהוֹר
  choice: чистое золото
  rationale: Естественное современное обозначение золота требуемой чистоты в контексте изготовления священных предметов.
- source_word: יַעֲשֶׂה
  choice: пусть сделают
  rationale: Еврейская форма — 3-е лицо мужского рода единственного числа с подразумеваемым исполнителем. Русская неопределённо-личная конструкция естественно передаёт предписание, не вводя явно названного субъекта.
- source_word: אֹתָהּ
  choice: его
  rationale: Местоимение женского рода относится к מנורה, однако русское «светильник» — мужского рода, поэтому требуется форма «его»; сам референт без необходимости не повторяется.
- source_word: אֵת כָּל הַכֵּלִים הָאֵלֶּה
  choice: и все эти принадлежности
  rationale: כֵּלִים — широкое обозначение предметов, орудий или сосудов. «Принадлежности» естественно охватывает связанные со светильником изделия, не сужая значение до одних сосудов.
