  text: The rings shall be opposite the frame[b][a], as holders for the poles to carry the table.
translation:
  language: ru
  text: Кольца должны быть расположены напротив обрамления[a] и служить гнёздами[b] для шестов, чтобы переносить стол.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рядом с обрамлением»; или: «соответственно обрамлению». Еврейское выражение обозначает взаимное расположение, не определяя его точной геометрии.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «домами для шестов», то есть вместилищами или креплениями, в которые вставляют шесты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֻמַּת
  choice: напротив
  rationale: Передаёт пространственное соотношение с обрамлением, не уточняя геометрию сверх того, что выражено в еврейском тексте.
- source_word: הַמִּסְגֶּרֶת
  choice: обрамление
  rationale: В контексте устройства стола обозначает окружающий его конструктивный элемент; «обрамление» естественно по-русски и не сужает значение до одного лишь края.
- source_word: תִּהְיֶיןָ הַטַּבָּעֹת
  choice: кольца должны находиться
  rationale: Женская форма глагола согласуется с «кольцами»; модальная конструкция передаёт предписывающий характер указания.
- source_word: לְבָתִּים
  choice: служить держателями
  rationale: Буквально «быть домами»; здесь речь о вместилищах или креплениях, в которые вставляют шесты.
- source_word: לְבַדִּים
  choice: для шестов
  rationale: В описаниях священной утвари בַּדִּים — шесты, предназначенные для переноски.
- source_word: לָשֵׂאת אֶת־הַשֻּׁלְחָן
  choice: на которых будут переносить стол
  rationale: Естественно выражает цель шестов и сохраняет значение инфинитива נשׂא — «нести, переносить».
