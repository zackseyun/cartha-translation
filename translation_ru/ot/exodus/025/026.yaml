  text: And you shall make for it four gold rings[b][a], and you shall put the rings on the four corners that are at its four feet.
translation:
  language: ru
  text: Сделай для него четыре золотых кольца и помести кольца на четырёх углах, у четырёх его ножек[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на четырёх сторонах» или «на четырёх краях».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у четырёх его ног»; еврейское слово может означать «ногу» или «ступню».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Сделай
  rationale: Форма совершенного вида с союзом в последовательности предписаний передаёт повелительное значение; русское повелительное наклонение естественно и ясно выражает распоряжение.
- source_word: לּוֹ
  choice: для него
  rationale: Местоименный суффикс мужского рода относится к столу, который в русском языке также мужского рода.
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: четыре золотых кольца
  rationale: Естественная русская конструкция точно передаёт количество, предмет и материал.
- source_word: וְנָתַתָּ
  choice: и помести
  rationale: В контексте изготовления предмета נתן означает расположить или установить; «помести» звучит естественно и сохраняет директивный смысл.
- source_word: עַל
  choice: на
  rationale: Основное пространственное значение предлога — размещение на указанном месте; дальнейшее уточнение связывает углы с ножками.
- source_word: אַרְבַּע הַפֵּאֹת
  choice: на четырёх углах
  rationale: פֵּאָה может обозначать край, сторону или угол; применительно к четырём местам крепления стола «углы» наиболее наглядно и естественно.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: у четырёх его ножек
  rationale: רֶגֶל означает ногу или ступню; для предмета мебели современное русское «ножка» наиболее естественно. Предлог «у» передаёт связь и близкое расположение углов относительно опор.
