  text: And you shall put the mercy seat on top of the ark[a], and into the ark you shall put the testimony that I will give you.
translation:
  language: ru
  text: Помести искупительную крышку поверх ковчега[a], а в ковчег положи свидетельство, которое Я дам тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крышку для искупления». Еврейское слово обозначает крышку ковчега и связано с искупительным обрядом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֹּרֶת
  choice: крышка искупления
  rationale: Термин обозначает крышку ковчега, связанную с обрядом искупления. Такой перевод передаёт и предметное значение, и культовую связь, не превращая крышку в «престол» и не уточняя механизм искупления.
- source_word: מִלְמָעְלָה
  choice: сверху
  rationale: В данном контексте слово указывает на непосредственное расположение крышки на верхней части ковчега; «сверху» звучит естественно и точно.
- source_word: עֵדֻת
  choice: свидетельство
  rationale: Формально близкий перевод сохраняет значение свидетельства о завете и не добавляет отсутствующее в этом стихе уточнение о скрижалях.
- source_word: נָתַתָּ / תִּתֵּן / אֶתֵּן
  choice: положи / положи / дам
  rationale: 'Русские глаголы естественно различаются по контексту: человек помещает предметы, а Бог даёт свидетельство.'
- source_word: אֶל הָאָרֹן
  choice: в ковчег
  rationale: При глаголе помещения сочетание указывает на внесение свидетельства внутрь ковчега.
theological_decisions:
- issue: Передача כַּפֹּרֶת с учётом её предметного и культового значения
  choice: крышка искупления
  alternative: крышка; крышка очищения; престол милости
  rationale: Выбранный вариант ясно называет предмет и сохраняет его связь с искупительным обрядом. Он не навязывает образ трона, которого само еврейское слово прямо не выражает, и не устраняет смысловую связь с корнем כפר.
translation_notes:
  register: Современный литературный русский язык; повелительные формы передают последовательность предписаний. Повтор «положи» сохранён ради ясности и соответствия структуре еврейского текста.
