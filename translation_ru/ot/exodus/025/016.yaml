  text: וְ/נָתַתָּ֖ אֶל הָ/אָרֹ֑ן אֵ֚ת הָ/עֵדֻ֔ת אֲשֶׁ֥ר אֶתֵּ֖ן אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/016.yaml
  text: And you shall put into the ark the testimony that I will give you[a].
translation:
  language: ru
  text: И положи в ковчег свидетельство, которое Я дам тебе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, конкретнее по контексту: «скрижали свидетельства».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: И положи
  rationale: В сочетании с אֶל и названием вместилища глагол נתן означает помещение предмета внутрь; русский повелительный оборот естественно передаёт предписывающее значение формы с waw.
- source_word: אֶל
  choice: в
  rationale: При глаголе «положить» и существительном «ковчег» предлог естественно обозначает движение внутрь.
- source_word: הָאָרֹן
  choice: ковчег
  rationale: В контексте святилища это традиционный и точный русский термин для священного ларца; «сундук» не передаёт его культового значения.
- source_word: הָעֵדֻת
  choice: свидетельство
  rationale: Сохраняет прямое и намеренно неуточнённое обозначение עֵדוּת; дальнейший контекст связывает его с каменными скрижалями.
- source_word: אֲשֶׁר אֶתֵּן אֵלֶיךָ
  choice: которое Я дам тебе
  rationale: Прямо передаёт относительное придаточное и будущее действие Бога по отношению к Моисею.
theological_decisions:
- issue: К чему относится «свидетельство»
  choice: В основном тексте оставить общее слово «свидетельство».
  alternative: 'Уточнить: «скрижали свидетельства».'
  rationale: В самом стихе скрижали прямо не названы, хотя более широкий контекст указывает именно на них. Основной текст сохраняет формулировку древнееврейского источника, а сноска даёт контекстуальное уточнение.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской терминологией. Единственное число «тебе» сохраняет обращение к Моисею; прописная «Я» соответствует принятому русскому оформлению речи Бога.
