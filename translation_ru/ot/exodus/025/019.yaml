base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/019.yaml
  text: Make one cherub on one end and one cherub on the other end[a]; from the mercy seat you shall make the cherubim on its two ends.
translation:
  language: ru
  text: Сделай одного херувима на одном краю, а другого херувима — на другом краю; херувимов сделайте из самой крышки ковчега, на обоих её краях.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более явно: «Сделайте херувимов одним целым с крышкой ковчега, на обоих её краях». Еврейский предлог показывает, что херувимов следовало сформировать из самой крышки, а не изготовить отдельно и затем прикрепить.'
    reason: Уточняет материальную связь, выраженную предлогом מִן, и возможную более явную передачу конструкции.
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Сделай
  rationale: Императив передан прямым повелением. Начальный союз опущен ради естественного русского изложения последовательных предписаний.
- source_word: כְּרוּב ... וּכְרוּב
  choice: одного херувима ... другого херувима
  rationale: Единственное число сохранено для каждой из двух фигур; «херувим» — устоявшаяся русская передача данного термина.
- source_word: אֶחָד
  choice: одного ... другого
  rationale: Парная русская конструкция естественно передаёт симметричное противопоставление двух краёв, не меняя числового значения.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: с одного края ... с другого края
  rationale: Предлог «с» сохраняет оттенок исходной точки или материала, тогда как симметричная конструкция ясно указывает на расположение фигур по двум краям.
- source_word: מִן הַכַּפֹּרֶת
  choice: из самой крышки
  rationale: מִן здесь указывает, что херувимы должны быть сформированы из материала самой крышки, а не изготовлены отдельно. «Крышка» ясно называет предмет в русском языке и не навязывает спорное толкование этимологии технического термина כַּפֹּרֶת.
- source_word: תַּעֲשׂוּ
  choice: сделайте
  rationale: Форма второго лица множественного числа сохранена, несмотря на переход от единственного числа в начале стиха; это удерживает заметную смену числа в еврейском тексте.
- source_word: עַל שְׁנֵי קְצוֹתָיו
  choice: на обоих её краях
  rationale: Так естественно переданы расположение на двух краях и местоименный суффикс, относящийся к крышке.
theological_decisions:
- issue: Передача כַּפֹּרֶת
  choice: крышка
  alternative: крышка искупления; престол милости
  rationale: В данном предписании слово прежде всего обозначает особую крышку ковчега. Нейтральная предметная передача сохраняет связь с контекстом и не превращает возможную культовую или богословскую функцию слова в его бесспорное лексическое значение.
- issue: Связь херувимов с крышкой
  choice: из самой крышки
  alternative: на крышке
  rationale: 'Предлог מִן указывает не только на местоположение, но и на происхождение или материал: фигуры составляют с крышкой единое изделие. Такая передача не допускает ошибочного представления, будто их следовало изготовить отдельно и затем прикрепить.'
translation_notes:
  register: Современный литературный русский язык с ясной ремесленной терминологией и торжественной краткостью предписания. Сохранён переход от обращения в единственном числе («сделай») к множественному («сделайте»), присутствующий в еврейском тексте.
