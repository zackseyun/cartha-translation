  text: וְ/עָשִׂ֥יתָ כַפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/017.yaml
  text: And you shall make a mercy seat of pure gold; its length shall be two cubits and a half[a], and its width a cubit and a half.
translation:
  language: ru
  text: 'Сделай крышку[a] из чистого золота: два с половиной локтя в длину и полтора локтя в ширину.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крышку искупления». Еврейское слово כַּפֹּרֶת обозначает золотую крышку ковчега и связано с корнем כפר — «совершать очищение, искупать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Сделай
  rationale: Форма совершенного вида с союзом в последовательности предписаний передаёт прямое повеление; русский императив звучит естественно и сохраняет обязательную силу указания.
- source_word: כַפֹּרֶת
  choice: крышку
  rationale: Слово обозначает золотую крышку ковчега. «Крышка» ясно называет сам предмет и не вызывает у современного читателя ложной ассоциации слова «очистилище» с загробным наказанием; связь с обрядом очищения/искупления отмечена в сноске.
- source_word: זָהָב טָהוֹר
  choice: из чистого золота
  rationale: Естественная русская передача материала и его качества.
- source_word: אַמָּתַיִם וָחֵצִי אָרְכָּהּ
  choice: два с половиной локтя в длину
  rationale: Сохраняется древняя мера длины без пересчёта; конструкция с «в длину» современна и точно передаёт размер.
- source_word: וְאַמָּה וָחֵצִי רָחְבָּהּ
  choice: и полтора локтя в ширину
  rationale: Естественная и параллельная по форме передача второго размера.
theological_decisions:
- issue: Передача культового термина כַפֹּרֶת
  choice: крышка
  alternative: крышка искупления; очистилище
  rationale: В данном стихе термин называет золотое покрытие ковчега и связан с корнем כפר, относящимся к очищению или искуплению. Основной текст не превращает возможную этимологическую связь в однозначное функциональное толкование; значимая богословская окраска сохраняется в сноске. Вариант «очистилище» в современном русском способен ошибочно напомнить о чистилище.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная формулировка предписания. Синтаксис размеров сделан естественным для русского, древняя единица измерения сохранена. Маркер [a] помещён непосредственно после спорного термина.
