  text: Сделай семь его светильников, и пусть он установит их[a], чтобы они освещали пространство перед ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть он зажжёт их, чтобы они светили перед ним». Еврейский глагол буквально означает «поднять, заставить взойти» и в этом контексте может подразумевать как установку светильников, так и их зажигание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Сделай
  rationale: Форма 2-го лица мужского рода единственного числа с союзом в контексте предписаний передаёт прямое повеление Моисею.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: для него семь светильников
  rationale: נֵרֹת — «светильники»; суффикс женского рода относится к меноре, по-русски обозначенной существительным мужского рода «светильник», поэтому употреблено «для него», что также естественно передаёт принадлежность его составных ламп.
- source_word: וְהֶעֱלָה
  choice: пусть он установит
  rationale: Hiphil 3-го лица мужского рода единственного числа от עלה буквально означает «поднять / заставить взойти»; применительно к лампам может означать их установку либо зажигание. Основной текст сохраняет отдельное действие установки, а неоднозначность отмечена в сноске.
- source_word: וְהֵאִיר
  choice: чтобы они освещали
  rationale: Hiphil от אור передаёт результат или цель действия. Явный субъект «они» естественно соотносится с семью светильниками.
- source_word: עַל־עֵבֶר פָּנֶיהָ
  choice: пространство перед ним
  rationale: Выражение указывает на сторону или область перед лицевой частью меноры. Такой перевод передаёт направленность света и звучит естественно по-русски.
theological_decisions:
- issue: Не назван субъект формы וְהֶעֱלָה
  choice: пусть он установит
  alternative: пусть установят / установи
  rationale: Масоретский текст содержит форму 3-го лица мужского рода единственного числа, поэтому число и лицо сохранены без внесения прямо не названного священника.
translation_notes:
  register: Современный литературный русский язык; повелительная форма естественно передаёт предписание. Местоименный род согласован с русским словом «светильник», обозначающим менору в ближайшем контексте. Не названный в стихе субъект не отождествлён в основном тексте со священником.
