  text: You shall overlay it with pure gold; from the inside and from the outside you shall overlay it[a], and you shall make on it a gold molding all around.
translation:
  language: ru
  text: Покрой его чистым золотом; покрой его изнутри и снаружи и сделай на нём золотой бортик по всему краю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «золотую кайму», «золотой обод»; традиционно: «золотой венец». Еврейское слово זֵר обозначает декоративную окантовку по краю предмета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ / תְּצַפֶּנּוּ
  choice: покрой / покрой его
  rationale: В контексте изготовления скинии глагол обозначает нанесение металлического покрытия. «Покрой золотом» естественно и точно передаёт эту ремесленную операцию по-русски.
- source_word: זָהָב טָהוֹר
  choice: чистое золото
  rationale: Сочетание означает очищенное, не содержащее примесей золото; это обычная и ясная русская формулировка.
- source_word: מִבַּיִת וּמִחוּץ
  choice: изнутри и снаружи
  rationale: Пара слов указывает соответственно на внутреннюю и внешнюю поверхности ковчега. Формулировка сохраняет противопоставление и звучит естественно в современном русском языке.
- source_word: וְעָשִׂיתָ עָלָיו
  choice: и сделай вокруг него
  rationale: Предлог עַל указывает на расположение элемента на самом предмете; вместе с סָבִיב по-русски естественно выразить его как охватывающий предмет вокруг.
- source_word: זֵר
  choice: бортик
  rationale: Здесь слово обозначает сделанную по краю выступающую декоративную окантовку, а не головной венец. «Бортик» конкретен и понятен в описании предмета мебели.
- source_word: סָבִיב
  choice: вокруг
  rationale: Слово указывает, что бортик должен охватывать предмет со всех сторон; русское «вокруг» передаёт это без тяжеловесности.
