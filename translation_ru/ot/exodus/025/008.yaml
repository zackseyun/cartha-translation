  text: וְ/עָ֥שׂוּ לִ֖/י מִקְדָּ֑שׁ וְ/שָׁכַנְתִּ֖י בְּ/תוֹכָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/008.yaml
  text: And let them make a sanctuary for me[a], so that I may dwell among them.
translation:
  language: ru
  text: Пусть они сделают для Меня святилище, и Я буду обитать среди них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «посреди них». Еврейский текст говорит о Божьем присутствии среди народа, а не только внутри святилища.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Пусть они сделают
  rationale: Форма с союзом в контексте наставлений передаёт предписание в третьем лице множественного числа; такая конструкция естественна в современном русском языке.
- source_word: לִי
  choice: для Меня
  rationale: 'Предлог ל с местоименным суффиксом выражает предназначение: святилище должно быть устроено для Бога.'
- source_word: מִקְדָּשׁ
  choice: святилище
  rationale: Слово обозначает священное место, отделённое для Божьего присутствия; «святилище» точно и привычно передаёт этот смысл.
- source_word: וְשָׁכַנְתִּי
  choice: и Я буду обитать
  rationale: Глагол שׁכן означает «обитать, пребывать». Сочинительная связь прямо отражает еврейский текст и сохраняет возможный оттенок как результата, так и цели, не сводя его только к целевому значению.
- source_word: בְּתוֹכָם
  choice: среди них
  rationale: Еврейская форма имеет суффикс множественного числа и буквально указывает на пребывание Бога посреди людей, а не лишь внутри сооружения.
theological_decisions:
- issue: К кому относится место Божьего обитания
  choice: среди них
  alternative: в нём; посреди них
  rationale: В еврейском тексте стоит множественное число — «их», поэтому Божье присутствие связывается с народом, хотя святилище служит установленным местом этого присутствия.
- issue: Связь между сооружением святилища и Божьим обитанием
  choice: и Я буду обитать
  alternative: чтобы Мне обитать; и буду обитать
  rationale: Еврейский союз допускает понимание последующего обитания как результата или цели. Русское сочинение сохраняет эту смысловую открытость и естественно передаёт обещание Бога.
translation_notes:
  register: Современный литературный русский язык с ясной, dignified библейской интонацией. Местоимение «Меня» написано с прописной буквы как принятое в русском религиозном письме обозначение Бога; синтаксис остаётся простым и общедоступным.
