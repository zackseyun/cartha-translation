  source_fidelity: Перевод точно передаёт перечень четырёх видов принадлежностей стола, повторное предписание изготовить их и указание на чистое золото. «Которыми совершают возлияние» адекватно выражает культовое значение יֻסַּךְ («совершается/изливается возлияние»), не добавляя конкретного вещества. Выборы для двух редких терминов кְשׂוֹת и мְנַקִּיּוֹת неизбежно приблизительны и корректно снабжены сносками.
