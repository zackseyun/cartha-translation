base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/029.yaml
  text: You shall make its plates and its dishes[a], and its pitchers and its bowls with which the drink offering is poured[b]; you shall make them of pure gold.
translation:
  language: ru
  text: Сделай для него блюда и чаши, кувшины[a] и кубки[b], которыми совершают возлияние; сделай их из чистого золота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сосуды»; древнееврейское название редкое, и точная форма предмета неизвестна.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чаши»; древнееврейское название этого сосуда редкое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְּעָרֹתָיו
  choice: блюда
  rationale: קְעָרָה обозначает плоский сосуд или блюдо; в контексте стола это естественный современный эквивалент, отличающий предмет от следующего вида сосудов.
- source_word: כַפֹּתָיו
  choice: чаши
  rationale: כַּף, буквально связанное с формой ладони, может обозначать небольшой сосуд. «Чаши» сохраняет различие с блюдами и звучит естественно в перечне принадлежностей стола.
- source_word: קְשׂוֹתָיו
  choice: кувшины
  rationale: Редкое название культового сосуда. Контекст возлияния указывает на ёмкость для жидкости, поэтому «кувшины» ясно передаёт вероятную функцию без архаизма.
- source_word: מְנַקִּיֹּתָיו
  choice: кубки
  rationale: Редкое слово обозначает сосуды, связанные с возлиянием. «Кубки» уместно для культового употребления и позволяет отличить их от кувшинов.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: которыми совершают возлияние
  rationale: Пассивная форма глагола נסך относится к ритуальному возлиянию. Русская неопределённо-личная конструкция естественно передаёт действие, не называя исполнителя; «возлияние» выражает культовый смысл глагола.
- source_word: זָהָב טָהוֹר
  choice: чистое золото
  rationale: Устойчивый и точный русский эквивалент указания на материал.
- source_word: וְעָשִׂיתָ ... תַּעֲשֶׂה אֹתָם
  choice: Сделай ... сделай их
  rationale: 'Повтор глагола сохранён: он обрамляет перечень и затем вводит указание на материал. Повелительная форма естественно передаёт предписывающую силу древнееврейской конструкции.'
theological_decisions:
- issue: Смысл глагола נסך в описании сосудов
  choice: совершают возлияние
  alternative: наливают / выливают
  rationale: В культовом контексте נסך обычно обозначает именно возлияние. Перевод сохраняет ритуальный смысл, не уточняя вещество или вид приношения, которых стих прямо не называет.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой предписания. Притяжательное значение суффиксов передано словами «для него», то есть для стола из предыдущего контекста. Редкие названия культовых сосудов переведены функционально, а неопределённость отмечена в сносках.
