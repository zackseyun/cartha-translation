base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/009.yaml
  text: Exactly according to all that I am showing you—the pattern of the tabernacle and the pattern of all its furnishings—so you shall make it[a][b].
translation:
  language: ru
  text: Сделайте[b] всё в точности согласно всему, что Я показываю тебе, — образцу[a] скинии и образцу всей её утвари.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «план», «модель» или «устройство» — возможные значения еврейского слова תַּבְנִית.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте глагол «сделайте» стоит во множественном числе: речь обращена к Моисею вместе с теми, кто будет выполнять работу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: всё … в точности так, как
  rationale: Оборот выражает полное и точное соответствие показанному Богом; такая формулировка естественна по-русски и сохраняет усиление כֹּל в данном контексте.
- source_word: מַרְאֶה
  choice: Я показываю
  rationale: Причастие породы hифиль имеет здесь настоящее, продолжающееся значение; «показываю» передаёт его без тяжеловесного буквального «даю тебе увидеть».
- source_word: תַּבְנִית
  choice: образец
  rationale: Слово обозначает вид, устройство, образец или модель. «Образец» сохраняет представление о показанном эталоне, не утверждая, был ли это материальный макет, чертёж или небесный прообраз.
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: «Скиния» — устоявшееся и понятное русское обозначение священного шатра в Исходе; оно точнее контекстуально, чем общее «жилище».
- source_word: כָּל כֵּלָיו
  choice: вся её утварь
  rationale: כֵּלִים охватывает принадлежности, предметы и сосуды святилища. «Утварь» передаёт собирательное значение, не ограничивая его только сосудами.
- source_word: וְכֵן
  choice: так
  rationale: Наречие указывает на требуемое соответствие показанному образцу; в русской конструкции «так, как» эта связь выражена естественно.
- source_word: תַּעֲשׂוּ
  choice: сделайте
  rationale: Форма второго лица мужского рода множественного числа передана русским множественным числом; начальное «всё» естественно обозначает весь предписанный комплекс работ.
theological_decisions:
- issue: Следует ли переводом תַּבְנִית прямо утверждать существование небесного первообраза
  choice: образец
  alternative: план; модель; устройство
  rationale: Сам стих говорит о показанном Моисею образце, но не определяет его природу. «Образец» сохраняет эту открытость и не вносит более конкретного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционных библейских терминов «скиния» и «утварь». Синтаксис сделан ясным для обычного читателя; заглавное «Я» следует принятой русской традиции при прямой речи Бога.
