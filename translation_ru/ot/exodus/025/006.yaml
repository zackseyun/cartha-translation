lexical_decisions:
- source_word: שֶׁמֶן
  choice: масло
  rationale: Еврейское существительное обозначает масло вообще; хотя в данном контексте подразумевается оливковое масло, источник здесь этого прямо не уточняет.
- source_word: לַמָּאֹר
  choice: для светильника
  rationale: מָאוֹר может обозначать источник света или освещение; в контексте речь идёт о светильнике святилища, и этот перевод естественен по-русски.
- source_word: בְּשָׂמִים
  choice: благовония
  rationale: Слово обозначает ароматические вещества, предназначенные здесь для приготовления священных составов.
- source_word: לְשֶׁמֶן הַמִּשְׁחָה
  choice: для масла помазания
  rationale: Передаёт целевую конструкцию и конкретное священное масло, употреблявшееся для помазания.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: для благовонного курения
  rationale: Культовый термин קְטֹרֶת означает курение или фимиам, а הַסַּמִּים указывает на ароматические вещества; выбранная формулировка естественно передаёт всё сочетание без излишней буквальности.
