  text: Сделай шесты из древесины акации и обложи их золотом; стол будут переносить на них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Сделай
  rationale: Форма совершенного вида с союзом в контексте предписаний передаёт повеление; русское повелительное наклонение звучит естественно и прямо.
- source_word: הַבַּדִּים
  choice: шесты
  rationale: В описании предметов святилища слово обозначает длинные шесты для переноски; этот вариант точен и понятен современному читателю.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Конструкция обозначает материал. «Древесина акации» передаёт смысл точно и современно, не сохраняя непрозрачное традиционное название «ситтим».
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: и обложи их золотом
  rationale: В ремесленном контексте צפה означает покрыть или облицевать предмет слоем материала; «обложи золотом» соответствует стилю описания устройства святилища.
- source_word: וְנִשָּׂא בָם
  choice: на них будут носить
  rationale: Форма נשא имеет пассивное значение, а בָם обозначает средство переноски. По-русски конструкция «на них будут носить» естественно показывает, что стол несут посредством шестов.
- source_word: הַשֻּׁלְחָן
  choice: стол
  rationale: Определённость восстанавливается из ближайшего контекста; простое «стол» не добавляет отсутствующего в стихе пояснения о хлебах присутствия.
