  text: and a knob under two branches from it, and a knob under two branches from it, and a knob under two branches from it, for the six branches going out from the lampstand.
translation:
  language: ru
  text: И бутон под двумя ветвями, выходящими из светильника, и бутон под двумя ветвями, выходящими из светильника, и бутон под двумя ветвями, выходящими из светильника — для шести ветвей, выходящих из светильника.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: бутон
  rationale: В описании растительного убранства светильника слово обозначает округлый декоративный элемент; «бутон» естественно согласуется с чашечками в форме миндального цветка и сохраняет образ, тогда как «шар» или «набалдашник» звучат менее органично.
- source_word: קָנִים
  choice: ветви
  rationale: Хотя буквально это «стебли/тростники», здесь имеются в виду шесть боковых частей светильника; «ветви» ясно передаёт древовидную конструкцию и связь с центральным стволом.
- source_word: מְנֹרָה
  choice: светильник
  rationale: Общее русское обозначение данного культового предмета; не заимствует более позднее специальное название и соответствует контексту.
- source_word: מִמֶּנָּה / מִן הַמְּנֹרָה
  choice: выходящих из него / выходящих из светильника
  rationale: Сохраняет указание на конструктивное единство боковых ветвей со светильником; местоимение относится к светильнику как грамматически мужскому существительному в русском.
