lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: рама
  rationale: Слово обозначает конструктивное обрамление стола. «Рама» естественно передаёт предметную и структурную функцию, не уточняя устройство сверх еврейского текста.
- source_word: טֹפַח
  choice: шириной в ладонь
  rationale: Это мера длины — ладонь. Добавление «шириной» ясно показывает, какое измерение рамы имеется в виду.
- source_word: סָבִיב
  choice: по всему периметру / вокруг
  rationale: Два употребления сохраняют повторяющуюся идею кругового охвата; разные русские выражения обеспечивают естественность без потери смысла.
- source_word: זֵר
  choice: бордюр
  rationale: В описаниях предметов святилища слово обозначает декоративное обрамление или выступающую окантовку. «Бордюр» понятен современному читателю и не создаёт образ отдельной царской короны; традиционный вариант дан в сноске.
- source_word: זָהָב
  choice: золотой
  rationale: Прилагательное «золотой» естественно по-русски обозначает материал бордюра.
- source_word: לּוֹ / לְמִסְגַּרְתּוֹ
  choice: для него / его рамы
  rationale: Местоимения сохранены и отсылают к упомянутому в контексте столу, как и в еврейском тексте.
- source_word: וְעָשִׂיתָ
  choice: сделай
  rationale: Императив естественно передаёт предписывающую силу последовательных указаний и звучит ясно в современном русском языке.
