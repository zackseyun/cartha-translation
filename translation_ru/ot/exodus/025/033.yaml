revisions:
- from: На одной ветви — три чашечки в форме цветков миндаля, с завязью и цветком, и на другой ветви — три чашечки в форме цветков миндаля, с завязью и цветком.[a] Так должно быть на всех шести ветвях, выходящих из светильника.
  to: На одной ветви — три чашечки в форме цветков миндаля, с выпуклым украшением и цветком, и на одной ветви — три чашечки в форме цветков миндаля, с выпуклым украшением и цветком.[a] Так должно быть на всех шести ветвях, выходящих из светильника.
  rationale: Сохранён повтор исходного текста относительно «одной ветви», без добавления «другой». Неточное «завязь» заменено нейтральным описанием декоративной детали; примечание даёт краткий лексический вариант. Смысл, композиция и повторяемость описания сохранены.
  reviewer_model: gpt-5.6-terra
