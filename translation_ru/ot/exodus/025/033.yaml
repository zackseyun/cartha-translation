base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/033.yaml
  text: three almond-blossom-shaped cups on the one branch[a], with bulb and flower, and three almond-blossom-shaped cups on the one branch, with bulb and flower[c][b]; so it shall be for the six branches coming out from the lampstand.
translation:
  language: ru
  text: На одной ветви — три чашечки в форме цветков миндаля, с выпуклым украшением и цветком, и на одной ветви — три чашечки в форме цветков миндаля, с выпуклым украшением и цветком.[a] Так должно быть на всех шести ветвях, выходящих из светильника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с кнопом и цветком». Еврейское слово обозначает округлый декоративный выступ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: чашечки
  rationale: Существительное обозначает чашеобразные сосуды или элементы; уменьшительная форма естественно передаёт небольшие декоративные детали светильника.
- source_word: מְשֻׁקָּדִים
  choice: в форме цветков миндаля
  rationale: Форма от שקד указывает на миндальный орнамент; в данном растительном оформлении речь вероятнее всего о подобии цветкам миндаля.
- source_word: קָּנֶה
  choice: ветвь
  rationale: В описании светильника слово обозначает отходящую боковую часть; «ветвь» сохраняет растительный образ и понятно современному читателю.
- source_word: כַּפְתֹּר
  choice: завязь
  rationale: Слово обозначает округлый декоративный выступ. «Завязь» согласуется с растительным образом, но точная форма детали не вполне определённа, поэтому в примечании дано более нейтральное соответствие.
- source_word: פֶרַח / פָרַח
  choice: цветок
  rationale: Прямое и естественное соответствие существительному со значением «цветок, цветение».
- source_word: כֵּן לְשֵׁשֶׁת הַקָּנִים
  choice: Так должно быть на всех шести ветвях
  rationale: Передаёт применение одной и той же схемы ко всем шести боковым ветвям; «на всех» естественно выражает распределительный смысл.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: выходящих из светильника
  rationale: Близко передаёт причастие и исходную точку ветвей без лишнего истолкования.
- source_word: מְנֹרָה
  choice: светильник
  rationale: Это нарицательное обозначение сооружения для ламп; перевод значения предпочтительнее транслитерации «менора» в контексте устройства святилища.
