base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/012.yaml
  text: 'And you shall cast four rings of gold for it and put them on its four feet: two rings on one side of it and two rings on its second side[a].'
translation:
  language: ru
  text: 'Отлей для него четыре золотых кольца и размести их на четырёх его ножках: два кольца на одной его стороне и два кольца на другой[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к четырём его углам». Значение еврейского слова не вполне ясно; вероятнее всего, имеются в виду нижние опоры или ножки ковчега, а не углы как отвлечённые точки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצַקְתָּ
  choice: отлей
  rationale: В контексте изготовления золотых деталей глагол יצק означает литьё металла, а не просто наливание. Русское «отлей» естественно передаёт ремесленную операцию и форму повеления.
- source_word: טַבְּעֹת
  choice: кольца
  rationale: Существительное обозначает металлические кольца, предназначенные для шестов, на которых переносили ковчег.
- source_word: זָהָב
  choice: золотых
  rationale: Прямое обозначение материала передано естественным русским прилагательным.
- source_word: וְנָתַתָּה
  choice: и прикрепи
  rationale: Широкий по значению глагол נתן здесь описывает размещение колец на ковчеге. «Прикрепи» ясно выражает требуемое действие и не создаёт впечатления, будто кольца лишь положили сверху.
- source_word: פַּעֲמֹתָיו
  choice: к четырём его ножкам
  rationale: Трудное слово в данном предметном контексте, вероятнее всего, обозначает ножки или нижние опоры ковчега. Конкретное «ножкам» сохраняет образ исходного выражения; возможное «углам» отмечено в сноске.
- source_word: צַלְעוֹ
  choice: на одной его стороне
  rationale: В описании сооружений и предметов צלע естественно означает бок или сторону; «сторона» ясно и современно.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: на одной ... на другой
  rationale: Русская парная конструкция «на одной… на другой» естественно передаёт противопоставление двух сторон, не меняя смысла еврейского «одна… вторая».
