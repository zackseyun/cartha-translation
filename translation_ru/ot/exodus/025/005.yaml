lexical_decisions:
- source_word: עֹרֹת אֵילִם
  choice: кожи баранов
  rationale: Сочетание обозначает шкуры или кожи баранов как материал. «Кожи баранов» естественно звучит в перечне приношений и не уточняет степень обработки сверх сказанного в тексте.
- source_word: מְאָדָּמִים
  choice: окрашенные в красный цвет
  rationale: Форма указывает на то, что материал был сделан красным, а не просто имел естественный красный оттенок; перевод передаёт намеренную обработку кожи.
- source_word: עֹרֹת תְּחָשִׁים
  choice: кожи тахашей
  rationale: Точное значение תְּחָשִׁים неизвестно. Транслитерация сохраняет неопределённость исходного текста и не навязывает спорную идентификацию животного или материала; пояснение вынесено в сноску.
- source_word: עֲצֵי שִׁטִּים
  choice: древесину акации
  rationale: שִׁטִּים обычно отождествляется с акацией, а собирательное «древесина» естественно для русского перечня строительных материалов.
