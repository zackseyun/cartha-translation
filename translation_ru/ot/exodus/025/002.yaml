  yaml_path: translation/ot/exodus/025/002.yaml
  text: Speak to the sons of Israel[a], that they take an offering for me. From every man whose heart moves him[c][b], you shall take my offering.
translation:
  language: ru
  text: Скажи сынам Израиля, пусть они принесут Мне приношение. От каждого, чьё сердце побудит его, принимайте предназначенное Мне приношение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пожертвование» или «взнос». Еврейское слово обозначает дар, выделенный для священной цели и посвящённый Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל בְּנֵי יִשְׂרָאֵל
  choice: Скажи сынам Израиля
  rationale: Императив передан прямо и естественно; выражение «сыны Израиля» сохраняет стандартное заветное наименование народа и форму исходного текста.
- source_word: וְיִקְחוּ לִי
  choice: чтобы они принесли Мне
  rationale: Форма после повеления имеет целевой или побудительный оттенок. В контексте сбора русское «принесли» естественнее буквального «взяли для Меня», при этом последующий глагол передан как «принимайте».
- source_word: תְּרוּמָה
  choice: приношение
  rationale: Слово обозначает выделенный для священной цели дар или взнос. «Приношение» сохраняет посвящённость Богу, не сужая значение до жертвы определённого вида.
- source_word: מֵאֵת כָּל אִישׁ אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: От каждого, кого побуждает сердце
  rationale: Передаёт распределительное значение и еврейский образ внутреннего добровольного побуждения, не добавляя отдельного наречия «добровольно».
- source_word: תִּקְחוּ אֶת תְּרוּמָתִי
  choice: принимайте приношение Мне
  rationale: Множественное обращение сохранено. «Принимайте» идиоматично описывает действие собирающих; «Мне» передаёт принадлежность и направленность дара Богу.
theological_decisions:
- issue: Значение תְּרוּמָה при сборе материалов для святилища
  choice: приношение
  alternative: пожертвование; дар; взнос
  rationale: «Приношение» удерживает священную направленность дара и одновременно не приписывает ему значение кровной или иной установленной жертвы.
- issue: Добровольность дара в выражении יִדְּבֶנּוּ לִבּוֹ
  choice: кого побуждает сердце
  alternative: чьё сердце расположит его; кто пожелает от сердца
  rationale: Выбранный вариант сохраняет внутреннее побуждение и добровольность, не превращая образное выражение в отвлечённое богословское утверждение.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Заглавное «Мне» принято как русская издательская конвенция при прямой речи Бога. Синтаксис сделан ясным для обычного читателя, а образ сердца сохранён.
