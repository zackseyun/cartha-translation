base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/028.yaml
  text: And he was there with Yahweh forty days and forty nights[a]; he ate no bread and drank no water. And he wrote on the tablets the words of the covenant[b], the ten words.
translation:
  language: ru
  text: И пробыл он там с ГОСПОДОМ сорок дней и сорок ночей; хлеба не ел и воды не пил. И он написал[a] на скрижалях слова завета — десять слов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И ГОСПОДЬ написал», поскольку в других местах написание на скрижалях приписывается ГОСПОДУ (см. Исх. 34:1; Втор. 10:4).'
    reason: alternative_reading
  - marker: b
    text: 'Традиционно: «Десять заповедей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Передаёт тетраграмматон принятой в русской библейской традиции заменой; прописное написание отличает Божье имя от обычного титула.
- source_word: וַיְהִי שָׁם עִם
  choice: И пробыл он там у
  rationale: «Пробыл» естественно по-русски выражает нахождение Моисея там в течение указанного далее времени, не добавляя идеи сверх еврейского текста.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: сорок дней и сорок ночей
  rationale: Точная и естественная передача выражения длительности.
- source_word: לֶחֶם לֹא אָכַל וּמַיִם לֹא שָׁתָה
  choice: хлеба не ел и воды не пил
  rationale: Сохраняет конкретные существительные «хлеб» и «вода» и параллельное построение оригинала.
- source_word: וַיִּכְתֹּב
  choice: И он написал
  rationale: Глагол стоит в третьем лице мужского рода, а ближайшим продолжающимся субъектом в данном стихе является Моисей. Местоимение сохраняет формальную неопределённость референта; контекстуальная трудность отмечена в сноске.
- source_word: עַל הַלֻּחֹת
  choice: на скрижалях
  rationale: «Скрижали» — точный и прочно укоренившийся русский библейский эквивалент каменных табличек завета.
- source_word: דִּבְרֵי הַבְּרִית
  choice: слова завета
  rationale: Сохраняет конструктивную связь и заветный смысл словосочетания.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: десять слов
  rationale: Буквально и прозрачно передаёт еврейское выражение, не подменяя его традиционным толкованием «десять заповедей».
theological_decisions:
- issue: Субъект глагола «написал»
  choice: «И он написал», что в непосредственном ходе стиха естественно относится к Моисею
  alternative: «И ГОСПОДЬ написал»
  rationale: В еврейском глаголе субъект отдельно не назван. Ближайшим субъектом последовательности («пробыл… не ел… не пил… написал») является Моисей, однако Исх. 34:1 и Втор. 10:4 приписывают написание на скрижалях ГОСПОДУ. Основной текст сохраняет поверхностную грамматику и местоименную неоднозначность, а сноска — каноническое напряжение.
- issue: Передача עֲשֶׂרֶת הַדְּבָרִים
  choice: «десять слов»
  alternative: «Десять заповедей»
  rationale: Основной вариант следует буквальному значению еврейского выражения; знакомое традиционное наименование приводится в сноске, а не вносится в исходный текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Слово «скрижали» сохранено как общеизвестный и точный термин; синтаксис сделан ясным и естественным без устранения неоднозначности субъекта.
