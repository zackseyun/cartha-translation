base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/024.yaml
  text: For I will drive out nations from before you and enlarge your border[c][b][a], and no man will covet your land when you go up to appear before Yahweh your God three times in the year.
translation:
  language: ru
  text: Ибо Я изгоню народы от тебя и расширю твои пределы; и никто не возжелает твоей земли, когда ты будешь восходить, чтобы явиться перед Яхве, твоим Богом[a], три раза в год.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «видеть лицо Яхве, Бога твоего»; в контексте паломничества это выражение означает явиться перед Ним для поклонения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего повеления о паломнических праздниках; «ибо» естественно передаёт пояснительно-причинную связь.
- source_word: אוֹרִישׁ
  choice: Я изгоню
  rationale: Hифиль от ירשׁ здесь означает устранение народов с земли перед Израилем; «изгоню» ясно передаёт принудительное удаление.
- source_word: גּוֹיִם
  choice: народы
  rationale: В контексте овладения землёй речь идёт об этнополитических сообществах; «народы» точнее и естественнее, чем конфессионально окрашенное «язычники».
- source_word: מִפָּנֶיךָ
  choice: перед тобой
  rationale: Сохраняет образ удаления народов с пути и из присутствия адресата, оставаясь естественным по-русски.
- source_word: וְהִרְחַבְתִּי אֶת־גְּבוּלֶךָ
  choice: и расширю твои пределы
  rationale: Глагол означает «сделать широким, расширить», а גְּבוּל может обозначать границу или ограниченную ею территорию. Русское сочетание «расширить пределы» передаёт территориальное расширение естественно.
- source_word: לֹא יַחְמֹד אִישׁ
  choice: никто не пожелает завладеть
  rationale: אִישׁ в отрицательной конструкции имеет обобщённое значение «никто». חמד обозначает сильное, в данном контексте неправомерное желание; дополнение «завладеть» ясно выражает направленность этого желания на чужую землю.
- source_word: אַרְצְךָ
  choice: твоей землёй
  rationale: «Земля» сохраняет территориальный и заветный оттенок ארץ в контексте обетованной земли.
- source_word: בַּעֲלֹתְךָ
  choice: когда ты будешь восходить
  rationale: עלה буквально значит «подниматься, восходить» и в паломническом контексте обозначает восхождение к месту поклонения.
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: чтобы предстать пред
  rationale: Масоретская форма допускает буквальное понимание «увидеть лицо», однако в паломническом контексте устойчивый смысл — явиться или предстать перед Богом. Перевод передаёт этот смысл, а буквальная форма отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: три раза в год
  rationale: Естественная русская передача временной кратности; выражение означает три ежегодных паломничества.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. «Яхве» передаёт тетраграмматон как имя и не подменяет его титулом.
- issue: Значение паломнической формулы לֵרָאוֹת אֶת־פְּנֵי יְהוָה
  choice: предстать пред Яхве
  alternative: увидеть лицо Яхве
  rationale: Контекст предписанного поклонения поддерживает идиоматическое значение «явиться/предстать перед», однако буквальная образность сохранена в сноске, чтобы не скрывать форму еврейского выражения.
- issue: Обобщающее значение אִישׁ
  choice: никто
  alternative: ни один мужчина; ни один человек
  rationale: Хотя существительное грамматически мужского рода и единственного числа, отрицательная конструкция לֹא ... אִישׁ по-русски естественно и точно выражается местоимением «никто». Обетование касается отсутствия любого посягателя, а не подчёркивает его пол.
- issue: Смысл חמד применительно к земле
  choice: не пожелает завладеть
  alternative: не возжелает; не пожелает
  rationale: Глагол выражает неправомерное желание. В данном контексте угроза состоит не просто во внутреннем желании земли, а в посягательстве на неё во время паломничества; «пожелает завладеть» делает объект желания ясным без утверждения, что захват действительно состоится.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Предстать пред» и «восходить» сохраняют достоинство и паломническую образность текста; синтаксис упрощён настолько, чтобы стих был понятен современному читателю. Единственная сноска отмечена в основном тексте.
