  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה לִ/פְנֵ֤י יְהוָה֙ לְ/דַבֵּ֣ר אִתּ֔/וֹ יָסִ֥יר אֶת הַ/מַּסְוֶ֖ה עַד צֵאת֑/וֹ וְ/יָצָ֗א וְ/דִבֶּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת אֲשֶׁ֥ר יְצֻוֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/034.yaml
  text: But whenever Moses went in before Yahweh to speak with him[a], he would remove the veil until he came out; then he would come out and speak to the sons of Israel what he had been commanded.
translation:
  language: ru
  text: Но всякий раз, когда Моисей входил в присутствие Яхве, чтобы говорить с Ним, он снимал покрывало до тех пор, пока не выходил. Затем он выходил и говорил сынам Израиля то, что ему было повелено.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам»; буквально: «сынам Израиля».'
    reason: Лексическая альтернатива для идиоматического обозначения всего народа.
lexical_decisions:
- source_word: וּבְבֹא
  choice: Но всякий раз, когда ... входил
  rationale: Сочетание союза с ב и инфинитивом задаёт повторяющееся обстоятельство; «всякий раз» передаёт обычный характер действия, а «но» — лёгкое противопоставление предыдущему стиху.
- source_word: לִפְנֵי יְהוָה
  choice: пред лицо Яхве
  rationale: לִפְנֵי означает нахождение перед кем-либо, в его присутствии; «пред лицо» сохраняет образность оригинала, а имя יְהוָה передано как «Яхве».
- source_word: לְדַבֵּר אִתּוֹ
  choice: чтобы говорить с Ним
  rationale: Инфинитив выражает цель, а אִתּוֹ после דבר допускает значение общения «говорить с Ним».
- source_word: יָסִיר אֶת הַמַּסְוֶה
  choice: он снимал покрывало
  rationale: Имперфект описывает привычное действие. מַסְוֶה — покрытие лица Моисея; «покрывало» естественно и традиционно в данном контексте.
- source_word: עַד צֵאתוֹ
  choice: пока не выходил
  rationale: Конструкция обозначает предел времени — до выхода Моисея; русский оборот «пока не» естественно передаёт эту длительность.
- source_word: וְיָצָא וְדִבֶּר
  choice: Выйдя, он передавал
  rationale: Глаголы продолжают повторяющуюся последовательность действий. Деепричастная конструкция устраняет тяжёлый повтор «выходил и говорил», сохраняя порядок событий.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Буквально «сынам Израиля»; форма сохранена как обозначение заветного сообщества и не заменена нейтральным выражением.
- source_word: אֵת אֲשֶׁר יְצֻוֶּה
  choice: всё, что ему было повелено
  rationale: Пуаль выражает пассивное получение повеления Моисеем; русский вид и порядок слов показывают, что повеление предшествовало его передаче народу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте прямо стоит тетраграмматон; передача «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Значение בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам / народу Израиля
  rationale: Сохранено формально выраженное в еврейском тексте обозначение «сыны Израиля», хотя в данном контексте оно относится к сообществу Израиля в целом.
- issue: Кто говорит в לְדַבֵּר אִתּוֹ
  choice: Моисей входит, чтобы говорить с Яхве
  alternative: чтобы Яхве говорил с Моисеем
  rationale: Грамматическая конструкция естественно описывает цель входа Моисея — говорить с Ним, но сама по себе не устраняет взаимного характера общения; перевод не уточняет, кто именно начинает речь.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Пред лицо» сохраняет исходный пространственно-реляционный образ; синтаксис разделён на два предложения ради ясности. Местоимение «Ним» написано с прописной буквы по распространённой русской библейской норме.
