revisions:
- from: Но всякий раз, когда Моисей входил пред лицо Яхве, чтобы говорить с Ним, он снимал покрывало и оставался без него, пока не выходил. Выйдя, он передавал сынам Израиля всё, что ему было повелено.[a]
  to: Но всякий раз, когда Моисей входил в присутствие Яхве, чтобы говорить с Ним, он снимал покрывало до тех пор, пока не выходил. Затем он выходил и говорил сынам Израиля то, что ему было повелено.[a]
  rationale: Исправление устраняет невыраженное в оригинале добавление, возвращает нейтральный глагол речи и заменяет архаичное пространственное выражение более естественным современным соответствием. Повторяемость действий, временной предел снятия покрывала, имя Яхве и буквальное «сынам Израиля» сохранены.
