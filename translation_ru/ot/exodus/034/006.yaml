source:
  edition: WLC
  text: וַ/יַּעֲבֹ֨ר יְהוָ֥ה עַל פָּנָי/ו֮ וַ/יִּקְרָא֒ יְהוָ֣ה יְהוָ֔ה אֵ֥ל רַח֖וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַפַּ֖יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת׀־׀־׀
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/006.yaml
  text: Then Yahweh passed before him and proclaimed[a], “Yahweh, Yahweh, a God compassionate and gracious, slow to anger, and abounding in steadfast love and faithfulness.”
translation:
  language: ru
  text: 'Тогда Яхве прошёл перед ним и провозгласил: «Яхве, Яхве — Бог сострадательный и милостивый, не скорый на гнев, изобилующий неизменной любовью и верностью[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изобилующий неизменной любовью и истиной».'
    reason: Лексема אֱמֶת может означать как «верность, надёжность», так и «истину».
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь» и повторение имени в еврейском тексте.
- source_word: וַיַּעֲבֹר
  choice: прошёл
  rationale: В повествовательном контексте глагол обозначает движение мимо или перед кем-либо; сочетание с «перед ним» естественно передаёт пространственный смысл.
- source_word: עַל פָּנָיו
  choice: перед ним
  rationale: Идиоматическая русская передача буквального выражения «перед его лицом» без ненужной кальки.
- source_word: וַיִּקְרָא
  choice: провозгласил
  rationale: Контекст торжественного возвещения имени и свойств Бога требует более сильного значения, чем простое «позвал».
- source_word: אֵל
  choice: Бог
  rationale: Слово стоит в приложении после повторённого имени и вводит описание Божьих свойств; в русском неопределённый артикль не выражается.
- source_word: רַחוּם
  choice: сострадательный
  rationale: Передаёт глубокое сострадание и при этом сохраняет смысловое отличие от следующего חַנּוּן.
- source_word: חַנּוּן
  choice: милостивый
  rationale: Обозначает готовность оказывать милость и благоволение; это естественное и точное русское соответствие.
- source_word: אֶרֶךְ אַפַּיִם
  choice: не скорый на гнев
  rationale: Русский идиоматический эквивалент еврейского образного выражения «долгий ноздрями»; явно сохраняет тему сдерживаемого гнева.
- source_word: רַב
  choice: изобилующий
  rationale: При отвлечённых существительных выражает не просто величие, а полноту и изобилие.
- source_word: חֶסֶד
  choice: неизменная любовь
  rationale: Передаёт устойчивую, преданную и надёжную любовь; не сводит богатое значение слова только к жалости или милости.
- source_word: אֱמֶת
  choice: верность
  rationale: В паре с חֶסֶד слово описывает Божью надёжность и постоянство; буквальная и традиционная возможность «истина» сохранена в сноске.
theological_decisions:
- issue: Повторение Божьего имени יְהוָה
  choice: «Яхве, Яхве»
  alternative: «Господь Бог»
  rationale: Еврейский текст дважды повторяет личное имя, а затем отдельно употребляет אֵל («Бог»). Перевод сохраняет и повтор, и структуру фразы, не заменяя её истолковывающим сочетанием.
- issue: Значение אֱמֶת в сочетании חֶסֶד וֶאֱמֶת
  choice: «верность»
  alternative: «истина»
  rationale: В этом описании Божьего характера «верность» естественно выражает надёжность и постоянство, однако лексически возможное «истина» указано в сноске, чтобы не устранять смысловую многозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Формулировка «не скорый на гнев» сохраняет библейскую весомость без буквальной передачи еврейской идиомы; «изобилующий» подчёркивает полноту свойств. Маркер сноски помещён непосредственно после спорного слова «верностью».
