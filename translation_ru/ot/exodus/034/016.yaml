  text: and you take some of his daughters for your sons[b][a], and his daughters prostitute themselves after their gods and make your sons prostitute themselves after their gods.
translation:
  language: ru
  text: и возьмёшь некоторых из его дочерей в жёны своим сыновьям; и будут его дочери блудить вслед за своими богами[a] и побудят твоих сыновей блудить вслед за своими богами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «блудить вслед за своими богами». Язык половой неверности здесь служит образом следования другим богам.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский глагол здесь имеет причинное значение: дочери побудят сыновей поступать так же, то есть блудить вслед за своими богами.'
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ מִבְּנֹתָיו לְבָנֶיךָ
  choice: и возьмёшь из его дочерей жён для своих сыновей
  rationale: 'Форма с союзом продолжает предупреждение и выражает последующее действие. Предлог מִן передаёт выбор из числа дочерей. Слово «жён» добавлено по ясному брачному контексту: буквальное «возьмёшь из его дочерей для своих сыновей» по-русски неестественно.'
- source_word: וְזָנוּ בְנֹתָיו אַחֲרֵי אֱלֹהֵיהֶן
  choice: и станут его дочери блудить вслед за своими богами
  rationale: Сохранена намеренно резкая метафора זנה, обозначающая культовую неверность. Оборот «вслед за» воспроизводит образ следования чужим богам.
- source_word: וְהִזְנוּ אֶת בָּנֶיךָ
  choice: и вовлекут твоих сыновей в блуд
  rationale: 'Порода Hiphil имеет каузативное значение: дочери побудят сыновей к той же культовой неверности. «Вовлекут» естественно передаёт причинное воздействие, не предполагая механического принуждения.'
- source_word: אֱלֹהֵיהֶן
  choice: своими богами
  rationale: Множественное число и суффикс третьего лица женского рода множественного числа переданы прямо; возвратное «своими» естественно соотносит богов с дочерьми, выступающими подлежащим.
theological_decisions:
- issue: Передача זנה в контексте идолопоклонства
  choice: Сохранить метафору словом «блудить» и выражением «вовлекут… в блуд».
  alternative: «поклоняться идолам», «изменять Богу»
  rationale: Еврейский текст намеренно описывает следование иным богам языком половой неверности. Прямая метафора сохраняет богословскую напряжённость текста, тогда как «идолопоклонство» объясняет её, но сглаживает образ.
- issue: Конкретные обозначения пола בנותיו / בניך
  choice: «его дочери» и «твои сыновья»
  alternative: «дети», «потомки»
  rationale: В тексте прямо названы дочери и сыновья в контексте брачных союзов; обобщение было бы менее точным.
- issue: Степень причинности формы וְהִזְנוּ
  choice: «вовлекут»
  alternative: «заставят», «склонят»
  rationale: Каузатив должен быть выражен, однако «заставят» может чрезмерно усиливать принуждение. «Вовлекут» передаёт реальное побуждающее влияние и не снимает ответственности с сыновей.
translation_notes:
  register: Современный литературный русский с сохранением библейской образности. «Блудить» — намеренно сильное, но понятное слово; архаическое «блудодействовать» не использовано. Порядок маркеров [a], [b] соответствует их появлению в русском тексте.
