  terminology: «Праздник Недель» и «праздник Сбора урожая» удачно сохраняют прозрачные еврейские наименования, не подменяя их позднейшими традиционными названиями. «Первые плоды пшеничной жатвы» точнее и компактнее, чем «первые плоды жатвы пшеницы».
