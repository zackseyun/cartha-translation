  yaml_path: translation/ot/exodus/034/022.yaml
  text: And you shall observe for yourself the Feast of Weeks[a], the firstfruits of the wheat harvest, and the Feast of Ingathering at the turn of the year.
translation:
  language: ru
  text: Соблюдай праздник Недель — праздник первых плодов пшеничной жатвы — и праздник Сбора урожая в пору поворота года[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в конце года». Еврейское выражение буквально указывает на поворот, круг годового цикла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג
  choice: праздник
  rationale: В данном культовом контексте слово обозначает установленный праздник, связанный с паломничеством; «праздник» естественно и точно передаёт смысл.
- source_word: שָׁבֻעֹת
  choice: Недель
  rationale: Сохранено буквальное еврейское название праздника без замены более поздним традиционным названием «Пятидесятница».
- source_word: תַּעֲשֶׂה לְךָ
  choice: совершай
  rationale: Буквально «делай для себя»; в сочетании с חַג выражение означает соблюдать или совершать праздник. «Совершай» передаёт предписание и сохраняет торжественный регистр, не воспроизводя местоименный оборот, который по-русски звучал бы неестественно.
- source_word: בִּכּוּרֵי קְצִיר חִטִּים
  choice: праздник первых плодов жатвы пшеницы
  rationale: בִּכּוּרֵי обозначает первые плоды урожая, в том числе приносимые Богу. Повтор слова «праздник» в пояснительном приложении делает синтаксическую связь ясной по-русски, не превращая её в отдельное предписание о приношении.
- source_word: חַג הָאָסִיף
  choice: праздник Сбора урожая
  rationale: אָסִיף означает собирание земледельческих плодов; «Сбор урожая» передаёт название праздника понятно современному читателю.
- source_word: תְּקוּפַת הַשָּׁנָה
  choice: при смене года
  rationale: תְּקוּפָה указывает на поворот или завершение годового цикла. «При смене года» передаёт этот образ естественнее, чем буквальное «при повороте года», и не сводит выражение к последнему календарному дню.
