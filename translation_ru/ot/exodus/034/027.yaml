base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/027.yaml
  text: Then Yahweh said to Moses[a], “Write these words for yourself, for according to these words I have made a covenant with you and with Israel.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Запиши себе эти слова, ибо согласно этим словам Я заключил завет[a] с тобой и с Израилем».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я рассёк завет» — древнееврейская идиома со значением «заключил завет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Стандартная повествовательная форма; естественно вводит прямую речь и сохраняет связь с предшествующим контекстом.
- source_word: כְּתָב לְךָ
  choice: Запиши себе
  rationale: «Запиши» естественно выражает повеление письменно зафиксировать текст, а «себе» сохраняет личное местоимение לְךָ.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: В контексте письменного закрепления условий завета דְּבָרִים естественно означает «слова»; повтор передан последовательно.
- source_word: כִּי עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: потому что на основании этих слов
  rationale: כִּי вводит основание повеления, а עַל־פִּי здесь указывает на основу или соответствие условиям; данная формулировка ясна в современном русском.
- source_word: כָּרַתִּי ... בְּרִית
  choice: Я заключил завет
  rationale: Это естественный русский эквивалент древнееврейской идиомы «разрезать завет», сохраняющий завершённость действия.
- source_word: אִתְּךָ וְאֶת־יִשְׂרָאֵל
  choice: с тобой и с Израилем
  rationale: Повтор предлога в русском ясно показывает участие и Моисея, и Израиля в завете.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» сохраняет личное имя в тексте и не подменяет его титулом.
- issue: Передача идиомы כָּרַתִּי ... בְּרִית
  choice: Я заключил завет
  alternative: Я рассёк завет; Я установил завет
  rationale: «Заключить завет» — точная и естественная русская формула; буквальный образ вынесен в примечание.
- issue: Связь עַל־פִּי со словами завета
  choice: на основании этих слов
  alternative: согласно этим словам
  rationale: Обе трактовки возможны по смыслу; выбранная формулировка естественно выражает то, что записанные слова служат основанием завета, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис прямой и понятный; формула «заключил завет» привычна обычному читателю, а буквальная древнееврейская идиома сохранена в примечании.
