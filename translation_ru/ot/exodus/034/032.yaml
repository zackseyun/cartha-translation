base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/032.yaml
  text: Afterward all the sons of Israel came near[a], and he commanded them all that Yahweh had spoken with him on Mount Sinai.
translation:
  language: ru
  text: После этого приблизились все сыны Израиля[a], и он заповедал им всё, о чём Яхве говорил с ним на горе Синай.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны Израиля»; это обычное древнееврейское обозначение израильского народа.'
    reason: Поясняет, что грамматически мужское выражение служит национальным обозначением всего народа.
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: После этого
  rationale: Передаёт последовательность событий естественным современным русским выражением.
- source_word: נִגְּשׁוּ
  choice: приблизились
  rationale: Форма нифаль глагола נגשׁ обозначает приближение; выбор сохраняет конкретное движение людей к Моисею.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: все сыны Израиля
  rationale: Сохраняет форму стандартного древнееврейского национального обозначения и грамматически мужское множественное число исходного текста.
- source_word: וַיְצַוֵּם
  choice: и он заповедал им
  rationale: צוה означает повелевать или давать обязательные предписания; «заповедал» уместно для передачи народу Божьих повелений и не ослабляет силу глагола.
- source_word: אֵת כָּל אֲשֶׁר
  choice: всё, что
  rationale: Естественно и полно вводит содержание переданных повелений.
- source_word: דִּבֶּר יְהוָה אִתּוֹ
  choice: что Яхве говорил с ним
  rationale: «Говорил с ним» непосредственно передаёт אִתּוֹ и сохраняет оттенок общения, не заменяя его односторонним «сказал ему».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בְּהַר סִינָי
  choice: на горе Синай
  rationale: Точно и естественно по-русски обозначает место разговора.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; транслитерация «Яхве» сохраняет его как имя.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Выбранный вариант формально сохраняет грамматически мужское национальное обозначение исходного текста, не ограничивая при этом его референцию только мужчинами.
- issue: Характер речи в דִּבֶּר יְהוָה אִתּוֹ
  choice: Яхве говорил с ним
  alternative: Яхве сказал ему
  rationale: Предлог אִתּוֹ буквально указывает на речь «с ним»; перевод сохраняет возможный оттенок общения, не превращая выражение в одностороннюю передачу слов.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Заповедал» сохраняет обязательную силу передаваемых повелений, а «сыны Израиля» — формальную особенность исходного текста; потенциальная неясность пояснена сноской.
