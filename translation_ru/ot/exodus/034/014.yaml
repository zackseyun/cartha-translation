lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: не поклоняйся
  rationale: Форма глагола שׁחה обозначает преклонение или простирание ниц, здесь как действие поклонения. Русское «поклоняйся» естественно сохраняет и конкретный жест, и его культовый смысл.
- source_word: לְאֵל אַחֵר
  choice: другому богу
  rationale: Прямая передача אֵל «бог» и אַחֵר «другой»; вариант «чужому богу» возможен, но добавляет оттенок, не обязательный для данного слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, а не заменено титулом «Господь».
- source_word: קַנָּא
  choice: Ревнитель / Бог-Ревнитель
  rationale: Слово выражает исключительное притязание Яхве на верность и поклонение Его народа. «Ревнитель» позволяет сохранить повтор и употребление определения как имени, не сводя смысл к греховной зависти.
- source_word: שְׁמוֹ
  choice: имя Его
  rationale: 'Сохранена подчеркнутая именная формула еврейского текста: «Ревнитель имя Его».'
- source_word: אֵל קַנָּא הוּא
  choice: Он — Бог-Ревнитель
  rationale: Формулировка сохраняет явное местоимение הוּא, повтор ключевого слова קַנָּא и торжественную именную конструкцию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Значение קַנָּא как имени и свойства Бога
  choice: Ревнитель / Бог-Ревнитель
  alternative: Ревнивый / ревнивый Бог; Ревностный / ревностный Бог
  rationale: «Ревнитель» передает исключительное требование верности в отношениях завета и сохраняет именующий характер первой формулы. Оно также избегает преобладающего в современном русском отрицательного оттенка слова «ревнивый», не устраняя суровой богословской напряженности текста.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским ритмом. Инверсия «Ревнитель имя Его» намеренно сохраняет формулу исходного текста и разъясняется сноской; дефис в «Бог-Ревнитель» обозначает именующее приложение.
