base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/004.yaml
  text: So he cut two stone tablets like the first ones[a], and Moses rose early in the morning and went up Mount Sinai, just as Yahweh had commanded him[b], and he took the two stone tablets in his hand.
translation:
  language: ru
  text: И высек он две каменные скрижали, подобные первым[a]. Моисей рано утром встал и поднялся на гору Синай, как повелел ему Яхве, и взял в руку две каменные скрижали[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вырезал»; речь идёт о том, что Моисей изготовил скрижали из камня.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «взял в свою руку две каменные скрижали». Единственное число «рука» может употребляться идиоматически.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְסֹל
  choice: высек
  rationale: Глагол פסל обозначает обработку камня, в результате которой скрижалям придаётся нужная форма; «высек» конкретно и естественно передаёт это действие.
- source_word: לֻחֹת אֲבָנִים
  choice: каменные скрижали
  rationale: «Скрижали» — укоренившееся и понятное русское обозначение каменных табличек завета; прилагательное сохраняет указание на материал.
- source_word: כָּרִאשֹׁנִים
  choice: подобные первым
  rationale: Передаёт сравнение с прежними скрижалями без добавления того, относится ли сходство прежде всего к форме или назначению.
- source_word: וַיַּשְׁכֵּם ... בַבֹּקֶר
  choice: рано утром
  rationale: Еврейский оборот означает раннее начало действия. В русском отдельное «встал» здесь необязательно, поскольку далее прямо сказано, что Моисей поднялся на гору.
- source_word: וַיַּעַל אֶל הַר סִינַי
  choice: поднялся на гору Синай
  rationale: Сохраняет выраженное глаголом עלה движение вверх и звучит естественно по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ
  choice: как повелел ему Яхве
  rationale: Точно выражает соответствие предшествующему повелению; русская глагольная форма естественно обозначает ранее данное повеление.
- source_word: וַיִּקַּח בְּיָדוֹ
  choice: взял с собой
  rationale: Буквально «взял в свою руку»; в данном контексте русский идиом «взял с собой» естественно сообщает, что Моисей понёс скрижали, не навязывая физически маловероятного представления об одной руке.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: две каменные скрижали
  rationale: Сохраняет повтор исходного текста и ясно возвращает читателя к только что изготовленной паре.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Форма «Яхве» сохраняет его как имя и соответствует преобладающей современной научной реконструкции произношения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Короткие последовательные предложения снимают тяжеловесность длинной цепочки еврейских форм с וַ־, не меняя порядка событий. Традиционное слово «скрижали» сохранено как широко узнаваемое в данном контексте.
