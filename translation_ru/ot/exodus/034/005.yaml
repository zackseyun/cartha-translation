  yaml_path: translation/ot/exodus/034/005.yaml
  text: And Yahweh came down in the cloud and stood there with him[a], and proclaimed the name of Yahweh.
translation:
  language: ru
  text: И сошёл Яхве в облаке, и встал там с ним, и провозгласил имя Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и призвал имя Яхве»; возможно: «и провозгласил во имя Яхве». В еврейском выражении перед словом «имя» стоит предлог со значением «в», «посредством» или «при».'
    reason: Сохраняет лексическую и синтаксическую неоднозначность выражения וַיִּקְרָא בְשֵׁם יְהוָה, не создавая в русском тексте неестественного инструментального значения.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: וַיֵּרֶד
  choice: сошёл
  rationale: Естественно и конкретно передаёт нисходящее движение, выраженное глаголом ירד.
- source_word: בֶּעָנָן
  choice: в облаке
  rationale: Предлог ב здесь естественно указывает на местонахождение, а определённость формы отсылает к уже известному облаку Божьего присутствия.
- source_word: וַיִּתְיַצֵּב
  choice: встал
  rationale: Кратко и естественно передаёт значение хитпаэля от יצב — «занять место, встать».
- source_word: עִמּוֹ שָׁם
  choice: там рядом с ним
  rationale: 'Сохраняет оба элемента: указание на место שָׁם и совместность עִמּוֹ; «рядом с ним» звучит по-русски естественнее буквального «с ним» в данном описании.'
- source_word: וַיִּקְרָא
  choice: провозгласил
  rationale: В связи с последующим содержанием провозглашения передаёт декларативный смысл קרא, не сводя его к простому называнию.
- source_word: בְשֵׁם יְהוָה
  choice: имя Яхве
  rationale: В основном тексте естественно передаёт смысл как провозглашение Божьего имени; неоднозначность предлога ב и возможные иные синтаксические понимания сохранены в сноске.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте стоит личное имя, поэтому оно сохраняется в транслитерации без замены титулом.
- issue: Субъект и смысл וַיִּקְרָא
  choice: Субъект — Яхве; «провозгласил»
  alternative: Субъект — Моисей; «воззвал» или «призвал»
  rationale: Последовательность глаголов наиболее естественно сохраняет Яхве в качестве субъекта, а следующий стих содержит само Божье провозглашение. Однако конструкция קרא בשם допускает другие смысловые оттенки, которые отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор союза «и» сохраняет последовательный ритм еврейского текста; местоимение «ним» оставляет контекстуально ясную отсылку к Моисею без поясняющей вставки.
