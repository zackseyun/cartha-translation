lexical_decisions:
- source_word: אֱלֹהֵי
  choice: богов
  rationale: Форма множественного числа в сопряжённом сочетании с מַסֵּכָה обозначает здесь богов, представленных идолами; конкретное «богов» сохраняет формулировку еврейского текста.
- source_word: מַסֵּכָה
  choice: литых
  rationale: Слово обозначает изделие или изображение, изготовленное литьём, особенно металлического идола. Прилагательное «литых» естественно передаёт способ изготовления и не добавляет отсутствующее в тексте существительное «изображения».
- source_word: לֹא תַעֲשֶׂה
  choice: не делай
  rationale: Отрицание с формой имперфекта в законодательном контексте выражает прямой запрет; современное русское «не делай» ясно и естественно передаёт его силу.
- source_word: לָּךְ
  choice: себе
  rationale: Предлог с местоименным суффиксом указывает на личную предназначенность или заинтересованность; русское возвратное местоимение «себе» передаёт это кратко и точно.
theological_decisions:
- issue: Характер запрещённых предметов
  choice: «литых богов»
  alternative: «литых изображений» или «металлических идолов»
  rationale: Еврейский текст буквально соединяет «богов» с обозначением литого изделия. Перевод «литых богов» сохраняет как прямое наименование предметов поклонения, так и указание на способ их изготовления, не заменяя формулировку более истолковывающим словом «идолы».
translation_notes:
  register: Краткая запретительная формула в современном литературном русском языке. Порядок слов естественен для русского и сохраняет акцент на запрете изготовления; «литых богов» звучит достойно и понятно, а сноска раскрывает материально-технологический оттенок исходного слова.
