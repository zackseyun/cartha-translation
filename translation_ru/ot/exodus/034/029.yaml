base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/029.yaml
  text: And it happened[a], when Moses came down from Mount Sinai with the two tablets of the testimony in Moses' hand as he came down from the mountain[c][b], that Moses did not know that the skin of his face shone because he had spoken with him.
translation:
  language: ru
  text: 'И было: когда Моисей сходил с горы Синай, и две скрижали свидетельства были в руке Моисея, когда он сходил с горы, Моисей не знал, что кожа его лица сияла[a], когда он говорил с ним[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол может означать «сияла» или «испускала лучи». Исторический вариант перевода «была рогатой» связан со словом «рог», но хуже соответствует контексту.
    reason: lexical_alternative
  - marker: b
    text: В контексте речь идёт об общении Моисея с Господом.
    reason: alternative_reading
  - marker: c
    text: 'Еврейские местоименные формы не уточняют однозначно, кто именно «говорил» и с кем; возможно понимание: «когда Господь говорил с Моисеем». Оборот также можно понять причинно: «потому что он говорил с ним».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Краткая повествовательная формула сохраняет функцию еврейского wayyiqtol и звучит достойно, без излишней архаики.
- source_word: בְּרֶדֶת ... בְּרִדְתּוֹ
  choice: когда Моисей сходил ... когда он сходил
  rationale: Оба инфинитивных оборота передают временную рамку; повтор оригинала сохранён.
- source_word: מֵהַר סִינַי
  choice: с горы Синай
  rationale: Естественное современное русское обозначение географического названия.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: две скрижали свидетельства
  rationale: «Скрижали» — понятный и укоренившийся библейский термин; «свидетельство» сохраняет заветный смысл עֵדוּת, не конкретизируя его сверх текста.
- source_word: בְּיַד מֹשֶׁה
  choice: в руке Моисея
  rationale: Сохранены конкретный образ и единственное число еврейского текста.
- source_word: לֹא יָדַע
  choice: не знал
  rationale: Прямое и естественное соответствие отрицательной форме ידע.
- source_word: קָרַן
  choice: сияла
  rationale: В данном контексте глагол означает испускание лучей, сияние; этот выбор естественно сочетается с подлежащим «кожа его лица».
- source_word: עוֹר פָּנָיו
  choice: кожа его лица
  rationale: Сохранено эксплицитное упоминание кожи, а не упрощено до одного слова «лицо».
- source_word: בְּדַבְּרוֹ אִתּוֹ
  choice: оттого, что Он говорил с ним
  rationale: Причинное понимание בְּ перед инфинитивом хорошо соответствует контексту, но возможное временное понимание отмечено в сноске.
- source_word: אִתּוֹ
  choice: с ним
  rationale: Местоимение оригинала сохранено; субъект «Он» графически указывает на Господа, чья речь с Моисеем подразумевается контекстом.
theological_decisions:
- issue: Значение קָרַן применительно к лицу Моисея
  choice: сияла
  alternative: испускала лучи; стала рогатой
  rationale: Контекст описывает видимое сияние после общения Моисея с Господом. Исторический вариант о рогах лексически объясним, но контекстуально менее вероятен.
- issue: Референт подразумеваемого субъекта в בְּדַבְּרוֹ и местоимения אִתּוֹ
  choice: «Он» — Господь; «с ним» — с Моисеем
  alternative: «он» — Моисей; «с Ним» — с Господом
  rationale: Еврейские суффиксы формально допускают разное распределение участников. Ближайший контекст позволяет понимать говорящим Господа, однако альтернативный синтаксический разбор сохранён в сноске.
- issue: Значение предлога בְּ в בְּדַבְּרוֹ
  choice: 'причинное: «оттого, что»'
  alternative: 'временное: «когда»'
  rationale: Сияние естественно представлено как следствие общения с Господом, но грамматически возможно и временное прочтение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Сохранены повтор «сходил ... сходил», термин «скрижали свидетельства» и конкретное выражение «кожа его лица». Местоименная неоднозначность еврейского текста не устранена без оговорки.
