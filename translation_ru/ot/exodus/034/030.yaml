  yaml_path: translation/ot/exodus/034/030.yaml
  text: When Aaron and all the sons of Israel saw Moses[a], behold, the skin of his face was radiant, and they were afraid to come near him.
translation:
  language: ru
  text: Когда Аарон и все сыны Израиля увидели Моисея — и вот, кожа его лица сияла[a], — они побоялись приблизиться к нему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испускала лучи». Редкий еврейский глагол исторически переводили также как «была рогатой», однако контекст указывает на сияние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидели
  rationale: Форма от ראה в повествовательной последовательности естественно передаётся глаголом «увидели»; общее подлежащее включает Аарона и всех сынов Израиля.
- source_word: וְכָל בְּנֵי יִשְׂרָאֵל
  choice: и все сыны Израиля
  rationale: Сохраняется семейно-родовое обозначение оригинала; «сыны Израиля» звучит по-библейски достойно и остаётся понятным в современном русском языке.
- source_word: וְהִנֵּה
  choice: оказалось, что
  rationale: В данном зрительном контексте оборот передаёт внезапно обнаружившееся обстоятельство и повествовательное удивление частицы הִנֵּה без архаичного «вот».
- source_word: קָרַן
  choice: сияет
  rationale: Редкий глагол здесь обозначает испускание лучей, сияние. Настоящее время естественно передаёт состояние, которое увидели Аарон и израильтяне.
- source_word: עוֹר פָּנָיו
  choice: кожа его лица
  rationale: Конкретный образ оригинала сохранён без упрощения до одного слова «лицо».
- source_word: וַיִּירְאוּ
  choice: они побоялись
  rationale: Глагол передаёт вызванную увиденным боязнь; совершенный вид хорошо сочетается с последующим инфинитивом.
- source_word: מִגֶּשֶׁת אֵלָיו
  choice: приблизиться к нему
  rationale: Конструкция с מִן и инфинитивом выражает боязнь совершить действие — подойти к Моисею.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Выбрана формально близкая передача мужского семейно-родового обозначения без нейтрализации, при этом она привычна для русского библейского регистра.
- issue: Значение קָרַן применительно к лицу Моисея
  choice: сияет
  alternative: испускает лучи; стало рогатым
  rationale: Ближайший контекст описывает видимое сияние после встречи с Господом и страх народа. Исторически известное понимание через значение «рог» лексически возможно как ассоциация, но контекстуально маловероятно и потому отмечено лишь в сноске.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Синтаксис сделан естественным для русского языка, конкретное выражение «кожа его лица» и традиционное «сыны Израиля» сохранены.
