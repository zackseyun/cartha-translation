  yaml_path: translation/ot/exodus/034/013.yaml
  text: Instead[a], you shall tear down their altars, shatter their pillars[b], and cut down their Asherah poles.
translation:
  language: ru
  text: Напротив[a], разрушьте их жертвенники, разбейте их священные камни и срубите его культовый столб, посвящённый Ашере[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ибо разрушьте их жертвенники…» Еврейский союз может означать «ибо», однако в данном контексте он также естественно выражает противопоставление запрету предыдущего стиха.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово обозначает культовый предмет, связанный с богиней Ашерой; возможен более формальный перевод: «его ашеру». В масоретском тексте это слово стоит в единственном числе с суффиксом «его», в отличие от двух предыдущих членов перечня; вероятно, «его» соотносится с собирательным «жителем земли» в предыдущем стихе.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Напротив
  rationale: В данном контексте союз вводит действие, противопоставленное запрещённому заключению союза с жителями земли. Перевод сохраняет естественную для контекста контрастивную связь; причинное значение отмечено в сноске.
- source_word: מִזְבְּחֹתָם
  choice: их жертвенники
  rationale: Обычное обозначение культовых алтарей; множественное число и местоименная принадлежность сохранены.
- source_word: תִּתֹּצוּן
  choice: разрушьте
  rationale: Глагол נתץ означает разрушать или сносить сооружение. Русское повелительное наклонение естественно передаёт обязательное действие в контексте заповеди.
- source_word: מַצֵּבֹתָם
  choice: их священные камни
  rationale: מַצֵּבָה здесь обозначает установленные культовые камни. Перевод «священные камни» понятнее современному читателю, чем буквальное «столпы», и отличает их от деревянных культовых предметов в конце стиха.
- source_word: תְּשַׁבֵּרוּן
  choice: разбейте
  rationale: Порода пиэль выражает энергичное разрушение; «разбейте» естественно сочетается с каменными культовыми памятниками.
- source_word: אֲשֵׁרָיו
  choice: их столбы Ашеры
  rationale: Слово обозначает культовые предметы, связанные с богиней Ашерой; глагол «срубить» указывает на их деревянный характер. Местоимение «их» соответствует параллельным членам перечня и коллективному референту контекста, хотя в масоретской форме стоит суффикс единственного числа.
- source_word: תִּכְרֹתוּן
  choice: срубите
  rationale: כרת означает отсечь или срубить; в сочетании с деревянными культовыми предметами «срубите» наиболее естественно.
theological_decisions:
- issue: Значение אֲשֵׁרָיו
  choice: 'культовые деревянные предметы, связанные с Ашерой: «столбы Ашеры»'
  alternative: формальное «ашеры» либо «изображения Ашеры»
  rationale: Перечень говорит о физических культовых предметах, подлежащих уничтожению, а глагол «срубить» особенно уместен для деревянных объектов. Формулировка сохраняет связь с именем Ашеры, не отождествляя предметы с самой богиней.
- issue: Форма местоименного суффикса в אֲשֵׁרָיו
  choice: передать «их» по параллелизму и коллективному контексту
  alternative: буквальное «его», соотносимое с собирательным единственным числом «житель земли» в предыдущем стихе
  rationale: Предшествующие «их жертвенники» и «их священные камни» образуют единый перечень принадлежавших народам культовых предметов. Русское «его» без пояснения создало бы ложное впечатление смены референта.
translation_notes:
  register: Современный литературный русский язык с прямой, торжественной формой заповеди. Повелительные формы передают обязательность действий без архаических оборотов; специализированные культовые термины разъяснены краткими сносками.
