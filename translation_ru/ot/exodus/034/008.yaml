base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/008.yaml
  text: Moses quickly bowed down to the ground and worshiped[a][b].
translation:
  language: ru
  text: Моисей поспешно склонился до земли и поклонился[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёрся ниц»; еврейский глагол может обозначать поклон или простирание в знак почитания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: поспешно
  rationale: Глагол מהר указывает на поспешность и незамедлительность действия; наречие естественно связывает его с последующими действиями Моисея.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: וַיִּקֹּד
  choice: склонился
  rationale: Глагол קדד обозначает наклон тела или поклон; этот перевод сохраняет отдельность первого телесного действия и не дублирует следующий глагол.
- source_word: אַרְצָה
  choice: до земли
  rationale: Направительная форма существительного אֶרֶץ выражает движение вниз, к земле; сочетание «склонился до земли» естественно передаёт глубокий поклон.
- source_word: וַיִּשְׁתָּחוּ
  choice: поклонился
  rationale: В данной сцене глагол שחה обозначает простирание или поклон как выражение благоговейного почитания. Русское «поклонился» сохраняет как телесный, так и религиозный оттенок, не делая значение более однозначным, чем еврейский текст.
theological_decisions:
- issue: Передавать ли заключительный глагол как исключительно физическое простирание или прямо как поклонение Богу
  choice: поклонился
  alternative: совершил поклонение; простёрся ниц
  rationale: Контекст ясно указывает на благоговейный ответ Моисея на откровение Господа, однако сам еврейский глагол объединяет телесный поклон и почитание. «Поклонился» сохраняет эту смысловую напряжённость и не сводит действие только к позе или только к абстрактному богослужению.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок действий и повтор соединительного союза переданы плавной русской конструкцией; «поспешно» сохраняет акцент на немедленной реакции Моисея.
