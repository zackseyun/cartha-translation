base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/033.yaml
  text: When Moses finished speaking with them[a], he put a veil over his face.
translation:
  language: ru
  text: Когда Моисей закончил говорить с ними[a], он закрыл лицо покрывалом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перестал говорить с ними».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל ... מִדַּבֵּר
  choice: закончил говорить
  rationale: Конструкция כלה с מִן и инфинитивом обозначает завершение действия; «закончил говорить» естественно передаёт её по-русски.
- source_word: אִתָּם
  choice: с ними
  rationale: Предлог אֵת с местоименным суффиксом непосредственно означает «с ними»; формулировка сохраняет оттенок общения, не заменяя его более узким «им».
- source_word: וַיִּתֵּן עַל־פָּנָיו
  choice: закрыл лицо
  rationale: Буквально — «поместил на своё лицо»; с предметом «покрывало» естественная русская конструкция передаёт действие и назначение предмета.
- source_word: מַסְוֶה
  choice: покрывало
  rationale: Редкое существительное в данном контексте обозначает то, чем Моисей закрывал лицо; «покрывало» ясно и уместно в современном литературном русском.
theological_decisions: []
translation_notes:
  register: Современный литературный русский, простой и достойный по тону. Сохранено исходное «с ними»; тяжеловесная буквальная конструкция «положил покрывало на лицо» заменена естественным русским выражением без изменения смысла.
