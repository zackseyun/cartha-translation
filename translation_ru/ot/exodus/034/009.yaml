revisions:
- from: 'И он сказал: «Если я обрёл благоволение в Твоих глазах, Владыка, то пусть Владыка идёт среди нас[a], хотя это народ, который не склоняет шеи. Прости наше беззаконие и наш грех и возьми нас Себе в удел[b]».'
  to: 'И он сказал: «Если я обрёл благоволение в Твоих глазах, Владыка, то пусть Владыка пойдёт среди нас[a], ибо это народ, не склоняющий шеи. Прости наше беззаконие и наш грех и прими нас как Свой удел[b]».'
  rationale: Перевод исправлен только там, где исходная частица и русский синтаксис требуют более нейтральной и точной передачи. Причинное «ибо» сохраняет значение כִּי и не навязывает уступительное истолкование. Остальные изменения улучшают современную литературную естественность, сохраняя ключевые образы и богословскую неопределённость исходника. Сноски и их привязки сохранены.
