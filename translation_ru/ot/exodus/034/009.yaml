  text: וַ/יֹּ֡אמֶר אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֔/י יֵֽלֶךְ נָ֥א אֲדֹנָ֖/י בְּ/קִרְבֵּ֑/נוּ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ ה֔וּא וְ/סָלַחְתָּ֛ לַ/עֲוֺנֵ֥/נוּ וּ/לְ/חַטָּאתֵ֖/נוּ וּ/נְחַלְתָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/009.yaml
  text: And he said[a], “If now I have found favor in your eyes, Lord, please let the Lord go in our midst, though it is a stiff-necked people; and forgive our iniquity and our sin[b], and take us as your inheritance.”
translation:
  language: ru
  text: 'И он сказал: «Если я обрёл благоволение в Твоих глазах, Владыка, то пусть Владыка пойдёт среди нас[a], ибо это народ, не склоняющий шеи. Прости наше беззаконие и наш грех и прими нас как Свой удел[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в нашей среде»; также возможно: «посреди нас» или «с нами».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сделай нас Своим достоянием». Глагол может означать принятие или получение кого-либо в качестве удела, наследия или владения.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן
  choice: благоволение
  rationale: Передаёт благосклонность в устойчивом обороте «обрести благоволение в чьих-либо глазах», не привнося более узкого богословского значения слова «благодать».
- source_word: בְּעֵינֶיךָ
  choice: в Твоих глазах
  rationale: Сохраняет прозрачный древнееврейский образ и естественно звучит в современном русском языке.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Здесь употреблён титул обращения, а не имя יהוה. «Владыка» отличает титул от принятой передачи имени как «Господь» и сохраняет обращение к тому же лицу в обоих случаях.
- source_word: יֵלֶךְ נָא ... בְּקִרְבֵּנוּ
  choice: пусть Владыка идёт среди нас
  rationale: Передаёт просьбу и пространственный образ присутствия внутри общины; частица נָא отражена мягкой просительной конструкцией «пусть».
- source_word: קְשֵׁה עֹרֶף
  choice: народ, который не склоняет шеи
  rationale: Сохраняет телесную метафору упрямства, но избегает малопонятного современному читателю архаизма «жестоковыйный».
- source_word: עָוֹן
  choice: беззаконие
  rationale: Сохраняет нравственную тяжесть слова и отличает его от следующего חַטָּאת.
- source_word: חַטָּאת
  choice: грех
  rationale: Прямая и естественная передача, сохраняющая параллелизм с «беззаконием».
- source_word: וּנְחַלְתָּנוּ
  choice: возьми нас Себе в удел
  rationale: Выражает принадлежность народа Богу как Его наследственному уделу и естественно передаёт значение взятия во владение.
theological_decisions:
- issue: Передача אֲדֹנָי в молитве, обращённой к Богу
  choice: Владыка
  alternative: Господь; мой Владыка
  rationale: Исходный текст употребляет титул אֲדֹנָי, а не непосредственно имя יהוה. Выбор сохраняет различие между титулом и божественным именем, не добавляя отсутствующего слова «мой».
- issue: Логическое значение כִּי перед характеристикой народа
  choice: хотя
  alternative: ибо; ведь
  rationale: В данном контексте Моисей просит о Божьем присутствии вопреки упрямству народа; уступительное прочтение соответствует ходу просьбы, хотя сама частица допускает причинное значение.
- issue: Смысл וּנְחַלְתָּנוּ
  choice: возьми нас Себе в удел
  alternative: сделай нас Своим достоянием; овладей нами
  rationale: Фраза сохраняет заветную идею принадлежности народа Богу, не сводя образ ни к территории, ни к абстрактному обладанию.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Архаизм «жестоковыйный» заменён ясным выражением, сохраняющим исходную метафору. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с русской библейской традицией.
