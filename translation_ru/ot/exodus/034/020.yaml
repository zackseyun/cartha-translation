  verdict: approve
  source_fidelity: 'Русский текст точно передаёт предписания еврейского оригинала: первенец осла выкупается животным из мелкого скота, при отсутствии выкупа ему ломают шею; первенцы сыновей подлежат выкупу; являться перед Богом нельзя с пустыми руками. Повелительные формы и заключительное запрещение адекватно отражают юридико-культовый характер текста.'
  naturalness: 'Формулировки современны, понятны и выдержаны в сдержанном нормативном регистре. «Животным из мелкого скота» несколько формальнее, чем «овцой», но это оправданно: оно сохраняет более широкий объём שֶׂה и не сужает его до одного вида животного. «Предо Мною» естественно в возвышенной прямой речи.'
  terminology: «Выкупай» удачно передаёт פדה в данном правовом контексте. «Первенец», «мелкий скот», «сломай ему шею» и «с пустыми руками» точны и не привносят конфессионального толкования. Указание на «сыновей», а не на детей вообще, сохраняет грамматическое значение исходного текста.
