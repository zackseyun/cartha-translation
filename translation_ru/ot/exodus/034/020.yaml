source:
  edition: WLC
  text: וּ/פֶ֤טֶר חֲמוֹר֙ תִּפְדֶּ֣ה בְ/שֶׂ֔ה וְ/אִם לֹ֥א תִפְדֶּ֖ה וַ/עֲרַפְתּ֑/וֹ כֹּ֣ל בְּכ֤וֹר בָּנֶ֨י/ךָ֙ תִּפְדֶּ֔ה וְ/לֹֽא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/020.yaml
  text: You shall redeem the firstborn of a donkey with a lamb[a]; and if you do not redeem it, then you shall break its neck. You shall redeem every firstborn of your sons[c][b]. And none shall appear before me empty-handed.
translation:
  language: ru
  text: Первенца осла выкупай животным из мелкого скота[a]; если же не выкупишь его, сломай ему шею. Каждого первенца из твоих сыновей выкупай. Пусть никто не является предо Мною[b] с пустыми руками[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально — «одним животным из мелкого скота»; еврейское שֶׂה может обозначать овцу или козу.
    reason: lexical_alternative
  - marker: b
    text: Буквально — «пред Моим лицом»; это еврейское выражение означает явиться в Божье присутствие.
    reason: lexical_alternative
  - marker: c
    text: То есть без дара или приношения.
    reason: cultural_note
lexical_decisions:
- source_word: פֶטֶר חֲמוֹר
  choice: первенца осла
  rationale: פֶטֶר обозначает первого, открывающего утробу; в данном правовом контексте русское «первенец» передаёт смысл естественно и кратко.
- source_word: תִּפְדֶּה
  choice: выкупай
  rationale: Глагол פדה здесь означает освобождение посредством замены или выкупа. Повелительная форма по-русски естественно передаёт предписание еврейского текста.
- source_word: בְשֶׂה
  choice: животным из мелкого скота
  rationale: שֶׂה может обозначать отдельную овцу или козу, поэтому более широкая передача точнее, чем «ягнёнком».
- source_word: וַעֲרַפְתּוֹ
  choice: сломай ему шею
  rationale: ערף обозначает умерщвление посредством переламывания шеи; выбранная формулировка конкретна и естественна по-русски.
- source_word: כֹּל בְּכוֹר בָּנֶיךָ
  choice: каждого первенца из твоих сыновей
  rationale: Сохраняется прямое указание на сыновей и распределительное значение כֹּל.
- source_word: יֵרָאוּ פָנַי
  choice: пусть никто не является предо Мною
  rationale: Сочетание с «Моим лицом» является еврейским оборотом, означающим явиться в Божье присутствие; отрицательная русская конструкция передаёт смысл естественно.
- source_word: רֵיקָם
  choice: с пустыми руками
  rationale: В контексте поклонения слово означает явиться без дара или приношения; русский идиоматический оборот сохраняет подразумеваемый образ.
theological_decisions:
- issue: Передача божественного указания פָנַי в заключительной фразе
  choice: предо Мною
  alternative: пред Моим лицом
  rationale: Выбранный вариант сохраняет прямую речь Бога и передаёт смысл еврейского идиоматического оборота, не вводя дополнительного богословского толкования.
- issue: Родовое значение בָּנֶיךָ
  choice: твоих сыновей
  alternative: твоих детей
  rationale: Еврейский текст прямо говорит о сыновьях; нейтральное «детей» расширило бы значение источника.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным правовым звучанием. Формы единственного числа сохраняют обращение к каждому члену общины; «предо Мною» поддерживает достоинство божественной речи без излишней архаизации.
