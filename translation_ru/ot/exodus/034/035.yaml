  text: וְ/רָא֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶת פְּנֵ֣י מֹשֶׁ֔ה כִּ֣י קָרַ֔ן ע֖וֹר פְּנֵ֣י מֹשֶׁ֑ה וְ/הֵשִׁ֨יב מֹשֶׁ֤ה אֶת הַ/מַּסְוֶה֙ עַל פָּנָ֔י/ו עַד בֹּא֖/וֹ לְ/דַבֵּ֥ר אִתּֽ/וֹ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/035.yaml
  text: And the sons of Israel saw Moses’ face[a], that the skin of Moses’ face shone[c][b]; and Moses would put the veil back over his face until he went in to speak with him.
translation:
  language: ru
  text: И сыны Израиля[a] видели лицо Моисея — кожа на лице Моисея сияла[b]; и Моисей снова покрывал лицо покрывалом, пока не входил, чтобы говорить с ним[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны Израиля»; также можно перевести: «израильтяне».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол означает «сиять», «испускать лучи». Традиционный перевод «была рогатой» возник из старого ошибочного понимания этого слова.
    reason: lexical_alternative
  - marker: c
    text: В ближайшем контексте «с ним» означает «с Господом» (ст. 34).
    reason: cross_reference
lexical_decisions:
- source_word: וְרָאוּ
  choice: видели
  rationale: Форма в повествовательном заключении описывает наблюдаемое израильтянами действие; русский несовершенный вид естественно допускает повторяемость без добавления отдельного наречия.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет родственный образ еврейского выражения; более плавный вариант «израильтяне» отмечен в сноске.
- source_word: כִּי
  choice: —
  rationale: 'Тире вводит содержание увиденного: кожа на лице Моисея сияла. Это позволяет естественно передать функцию כִּי, не превращая её в причинное «потому что».'
- source_word: קָרַן
  choice: сияла
  rationale: Глагол обозначает испускание лучей, сияние; «сияла» ясно передаёт смысл и не воспроизводит старое ошибочное понимание как «была рогатой».
- source_word: עוֹר פְּנֵי מֹשֶׁה
  choice: кожа на лице Моисея
  rationale: Слово עוֹר означает именно кожу; конструкция сохраняет эту конкретность и звучит по-русски естественнее буквального «кожа лица Моисея».
- source_word: וְהֵשִׁיב ... אֶת הַמַּסְוֶה עַל פָּנָיו
  choice: снова покрывал лицо покрывалом
  rationale: Передаёт возвращение покрывала на лицо и повторяемость действия; избегает тяжеловесного «возвращал покрывало на лицо».
- source_word: עַד בֹּאוֹ
  choice: пока не входил
  rationale: 'Обозначает предел повторяющегося действия: покрывало оставалось на лице до очередного вхождения Моисея.'
- source_word: לְדַבֵּר אִתּוֹ
  choice: говорить с ним
  rationale: Сохраняет местоимение исходного текста, не подставляя прямо имя Господа; его референт разъяснён в сноске.
theological_decisions:
- issue: К кому относится местоимение в выражении «говорить с ним»
  choice: Оставить местоимение «с ним» в основном тексте; из ближайшего контекста оно относится к Господу.
  alternative: 'Передать явно: «говорить с Господом».'
  rationale: В еврейском тексте употреблено местоимение. Его сохранение не добавляет в стих отсутствующего имени и удерживает формальную неоднозначность, тогда как сноска сообщает контекстуальный референт.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранено традиционное выражение «сыны Израиля», но синтаксис и глагольные формы сделаны понятными современному читателю. Строчная буква в «с ним» отражает обычную грамматику исходного местоимения и не вводит конфессиональную практику почтительного написания.
