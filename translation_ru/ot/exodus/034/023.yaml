  yaml_path: translation/ot/exodus/034/023.yaml
  text: Three times in the year all your males shall appear before the Lord Yahweh[b][a], the God of Israel.
translation:
  language: ru
  text: Три раза в год все твои мужчины должны предстать перед[a] Владыкой Яхве[b], Богом Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пред лицом»; то есть в присутствии.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте различены титул «Владыка» (ха-адон) и следующее за ним личное имя Бога — Яхве.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: Три раза в год
  rationale: Естественная русская передача указания на частоту в пределах годового цикла.
- source_word: יֵרָאֶה
  choice: должны являться
  rationale: Нифаль глагола ראה здесь представляет собой устойчивое культовое выражение о явлении перед Богом; «являться» естественно передаёт этот смысл, а модальное «должны» выражает предписывающую силу формы.
- source_word: כָּל זְכוּרְךָ
  choice: все мужчины у тебя
  rationale: Сохраняет явное указание еврейского текста на лиц мужского пола и обращение во втором лице, не расширяя обязанность до всех без различия пола.
- source_word: אֶת פְּנֵי
  choice: пред
  rationale: Обычный еврейский оборот буквально означает «пред лицом» и идиоматически указывает на пребывание в чьём-либо присутствии; краткое «пред» естественно для возвышенного современного русского текста.
- source_word: הָאָדֹן
  choice: Владыкой
  rationale: Определённый титул אָדוֹן перед божественным именем передан как «Владыка», чтобы ясно отличить титул от следующего за ним личного имени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между божественным титулом הָאָדֹן и именем יהוה.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Богом Израиля
  rationale: Прямая и естественная передача сопряжённой конструкции, отождествляющей Яхве с Богом Израиля.
theological_decisions:
- issue: Передача сочетания הָאָדֹן יְהוָה
  choice: Владыкой Яхве
  alternative: Господом Богом; Господом Яхве
  rationale: Текст содержит два различных элемента — титул с артиклем и личное имя. «Владыкой Яхве» сохраняет их различие и избегает замены имени словом «Господь».
- issue: Объём обязанности, выраженной כָּל זְכוּרְךָ
  choice: все мужчины у тебя
  alternative: весь мужской пол у тебя; все твои мужчины; все у тебя
  rationale: Еврейский текст явно ограничивает предписание лицами мужского пола; гендерно нейтральная передача скрыла бы это ограничение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Форма «пред» выбрана вместо разговорно-нейтрального «перед» ради краткости и соответствия контексту богослужебного явления; архаические синтаксические конструкции избегаются.
