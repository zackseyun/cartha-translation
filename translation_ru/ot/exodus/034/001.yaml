source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה פְּסָל לְ/ךָ֛ שְׁנֵֽי לֻחֹ֥ת אֲבָנִ֖ים כָּ/רִאשֹׁנִ֑ים וְ/כָתַבְתִּי֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֥ר שִׁבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/001.yaml
  text: Then Yahweh said to Moses[a], “Cut for yourself two stone tablets like the first ones, and I will write on the tablets the words that were on the first tablets[b], which you broke.”
translation:
  language: ru
  text: 'Яхве сказал Моисею: «Высеки[a] себе две каменные скрижали[b], такие же, как первые, и Я напишу на них слова, которые были на первых скрижалях, разбитых тобой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вырежи».'
    reason: Лексическая альтернатива для глагола פְּסָל, обозначающего обработку камня.
  - marker: b
    text: 'Буквально: «две скрижали из камня».'
    reason: Показывает форму еврейского словосочетания при сохранении естественного русского варианта в основном тексте.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычный глагол речи в повествовательном введении; в современном русском начальное וַ передано естественным порядком повествования без обязательного отдельного «и».
- source_word: פְּסָל
  choice: высеки
  rationale: Императив обозначает обработку камня для изготовления скрижалей. «Высеки» конкретно и естественно передаёт это действие.
- source_word: לְךָ
  choice: себе
  rationale: Сохраняет выраженное в еврейском тексте указание, что Моисей должен сам подготовить скрижали.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: две каменные скрижали
  rationale: Точно и естественно передаёт предмет, количество и материал.
- source_word: כָּרִאשֹׁנִים
  choice: такие же, как первые
  rationale: Ясно выражает сравнение новых скрижалей с прежними.
- source_word: וְכָתַבְתִּי
  choice: и Я напишу
  rationale: Передаёт обещанное будущее действие говорящего и связь с предыдущим повелением.
- source_word: עַל הַלֻּחֹת
  choice: на них
  rationale: Местоимение устраняет тяжёлый повтор слова «скрижали», не меняя референта.
- source_word: הַדְּבָרִים
  choice: слова
  rationale: Сохраняет прямое значение существительного и не сужает его интерпретирующим вариантом «заповеди».
- source_word: אֲשֶׁר שִׁבַּרְתָּ
  choice: разбитых тобой
  rationale: Точно передаёт действие Моисея; причастный оборот звучит по-русски естественно и однозначно относится к первым скрижалям.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В стихе стоит собственное имя Бога. Форма «Яхве» сохраняет его как имя; «Господь» заменило бы имя титулом, а «Иегова» отражает более позднюю гибридную вокализацию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён без потери содержания; личное имя «Яхве» передано прямо. Маркеры сносок поставлены непосредственно после слов, к которым относятся.
