base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/011.yaml
  text: Keep what I am commanding you today[a]. Behold, I am driving out before you the Amorites, the Canaanites, the Hittites, the Perizzites, the Hivites[b], and the Jebusites.
translation:
  language: ru
  text: Соблюдай то, что Я повелеваю тебе сегодня.[a] Вот, Я изгоняю от тебя амореев, хананеев, хеттов, ферезеев, евеев и иевусеев.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Храни то, что Я повелеваю тебе сегодня»; возможно также: «Будь внимателен к тому, что Я повелеваю тебе сегодня».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «изгоняю от твоего лица» — то есть удаляю из твоего присутствия или с твоего пути.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר לְךָ
  choice: Соблюдай
  rationale: Императив שׁמר в контексте заветных повелений означает хранить и исполнять предписанное. Русское «соблюдай» естественно передаёт этот смысл; לְךָ усиливает личную обращённость, но не требует отдельного неестественного «для себя».
- source_word: אֵת אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: то, что Я повелеваю тебе сегодня
  rationale: Сохраняет относительную конструкцию, эксплицитное «тебе» и актуальный характер причастия מְצַוְּךָ.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: «Вот» в современном литературном русском сохраняет указательно-эмфатическую функцию הִנְנִי без архаического «се».
- source_word: גֹרֵשׁ
  choice: изгоняю
  rationale: Причастие после הִנְנִי изображает действие как начинающееся, предстоящее или несомненное; настоящее время сохраняет его живость и не сводит выражение к простому будущему.
- source_word: מִפָּנֶיךָ
  choice: от тебя
  rationale: Буквально «от твоего лица / из твоего присутствия»; «от тебя» естественно передаёт удаление народов с пути и из присутствия адресата, не добавляя идеи «перед тобой» как направления движения.
- source_word: הָאֱמֹרִי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: амореев, хананеев, хеттов, ферезеев, евеев и иевусеев
  rationale: Еврейские собирательные этнонимы в единственном числе естественно передаются русскими названиями народов во множественном числе; формы соответствуют укоренившейся русской библейской традиции.
theological_decisions:
- issue: Оттенок императива שׁמר в контексте завета
  choice: Передать как повеление соблюдать то, что Бог заповедует
  alternative: «Будь внимателен к тому, что Я повелеваю тебе сегодня»
  rationale: Контекст касается обязательств завета. «Соблюдай» сохраняет значение хранения и исполнения, не добавляя отсутствующее в тексте прямое «исполнять» и не превращая повеление лишь в предостережение.
- issue: Временной оттенок גֹרֵשׁ после הִנְנִי
  choice: «Вот, Я изгоняю»
  alternative: «Вот, Я изгоню»
  rationale: Еврейская конструкция допускает оттенок близкого или несомненного будущего, но форма с настоящим временем лучше сохраняет образ уже разворачивающегося божественного действия, не исключая его предстоящего осуществления.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. «Соблюдай» звучит естественно в контексте заповедей; «Вот» сохраняет торжественное смысловое выделение без архаизации. Божественное местоимение «Я» написано с прописной буквы согласно распространённой русской библейской издательской практике.
