  yaml_path: translation/ot/exodus/034/031.yaml
  text: But Moses called to them[a], and Aaron and all the leaders of the congregation returned to him, and Moses spoke to them.
translation:
  language: ru
  text: Но Моисей позвал их, и Аарон и все предводители общины вернулись к нему, и Моисей говорил с ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֲלֵהֶם
  choice: позвал их
  rationale: קרא с אֶל означает обращённый к кому-либо зов. «Позвал их» естественно передаёт действие, не усиливая его до официального приказа, как могло бы сделать «призвал».
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: вернулись к нему
  rationale: שׁוב прямо обозначает возвращение; формулировка сохраняет связь с предшествующим отступлением людей от Моисея.
- source_word: הַנְּשִׂאִים בָּעֵדָה
  choice: предводители общины
  rationale: נָשִׂיא здесь обозначает руководителей народа, а עֵדָה — собранную общину Израиля. «Предводители общины» передаёт общественную роль без архаичного или монархического оттенка слова «князья».
- source_word: וַיְדַבֵּר ... אֲלֵהֶם
  choice: говорил с ними
  rationale: דבר с אֶל допускает передачу «говорил с ними». Несовершенный русский вид естественно описывает последовавшую речь, не уточняя её продолжительность или содержание.
- source_word: וַ
  choice: Но
  rationale: Начальный waw продолжает рассказ и в контексте выражает мягкое противопоставление предыдущему стиху, где люди боялись приблизиться.
