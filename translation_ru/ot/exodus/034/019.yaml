  yaml_path: translation/ot/exodus/034/019.yaml
  text: Every firstborn of the womb is mine[a], and every male firstborn among your livestock[c][b], whether ox or sheep.
translation:
  language: ru
  text: Всё, что открывает утробу, — Моё[a]; и всякий первенец мужского пола из твоего скота — бык или овца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всё, открывающее утробу».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское שֶׂה может обозначать овцу или козу.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל פֶּטֶר רֶחֶם
  choice: Всё, что первым выходит из утробы
  rationale: 'Передаёт древнееврейскую идиому буквально и при этом понятно по-русски: речь идёт о первом потомстве, открывающем материнскую утробу.'
- source_word: לִי
  choice: Моё
  rationale: Кратко и прямо выражает заявленное Господом право принадлежности, не добавляя отсутствующего в стихе объяснения о посвящении или жертве.
- source_word: מִקְנְךָ
  choice: из твоего скота
  rationale: מִקְנֶה — собирательное обозначение принадлежащих человеку стад и домашнего скота; русское «скот» естественно охватывает дальнейшие категории.
- source_word: תִּזָּכָר
  choice: мужского пола
  rationale: Форма от זכר в данном перечислении указывает на самцов; перевод по смыслу избегает ошибочного понимания от корня со значением «помнить».
- source_word: פֶּטֶר שׁוֹר וָשֶׂה
  choice: первородный приплод … от крупного или мелкого скота
  rationale: Передаёт повторное указание на первородство и охватывает שׁוֹר как крупный рогатый скот, а שֶׂה как животное из мелкого скота — овцу либо козу.
theological_decisions:
- issue: Право Господа на первородных
  choice: Сохранено прямое утверждение «Моё» без богословского расширения.
  alternative: Явно перевести как «должно быть посвящено Мне» или ограничить смысл жертвенными животными.
  rationale: В еврейском тексте прямо выражена принадлежность посредством לִי; посвящение может подразумеваться законодательным контекстом, но здесь не названо.
- issue: Объём второй части стиха
  choice: Указан весь первородный приплод мужского пола среди крупного и мелкого скота.
  alternative: Отнести к Господу вообще всех самцов скота независимо от первородства.
  rationale: Повторное פֶּטֶר связывает требование с первородным приплодом, а תִּזָּכָר уточняет мужской пол.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формулировкой законодательного высказывания. Тире помогает ясно передать именное утверждение принадлежности и присоединённое уточнение видов скота.
