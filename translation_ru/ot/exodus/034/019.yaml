  source_fidelity: 'Первая часть передана верно: כָּל פֶּטֶר רֶחֶם означает «всё, что открывает утробу», и לִי выражает принадлежность говорящему. Во второй части повторное פֶּטֶר необходимо прямо связать с первенцем; תִּזָּכָר уточняет его мужской пол. שׁוֹר и שֶׂה лучше передать конкретными видами, а не обобщённым противопоставлением крупного и мелкого скота.'
  naturalness: Фраза «весь первородный приплод мужского пола ... от крупного или мелкого скота» тяжеловесна и семантически размывает конкретное перечисление. «Всякий первенец мужского пола из твоего скота — бык или овца» современна, ясна и сохраняет краткий законодательный стиль.
