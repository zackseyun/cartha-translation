  text: lest you make a covenant with the inhabitants of the land[a], and they prostitute themselves after their gods and sacrifice to their gods[c][b], and one of them invites you and you eat from his sacrifice.
translation:
  language: ru
  text: Не заключай завета с жителями той земли, иначе они будут блудить вслед за своими богами[a] и приносить жертвы своим богам; и кто-нибудь из них пригласит тебя[b], и ты будешь есть от его жертвы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «блудить вслед за своими богами». В еврейском тексте идолопоклонство изображено языком сексуальной неверности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и он позовёт тебя». Единственное число, вероятно, имеет распределительный смысл: «кто-нибудь из них пригласит тебя».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и ты будешь есть от его жертвы». Вероятно, имеется в виду пища, связанная с его жертвоприношением; возможный перевод: «поешь от его жертвенного приношения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן תִּכְרֹת בְּרִית
  choice: Не заключай завета… иначе
  rationale: פֶּן вводит предостережение о возможном последствии. Русская конструкция «не… иначе» естественно передаёт предупредительную силу; идиома «рубить завет» передана нормативным «заключать завет».
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: с жителями той земли
  rationale: Собирательная форма обозначает людей, населяющих землю, о которой говорится в контексте. Указательное «той» естественно связывает выражение с обещанной землёй, не добавляя нового референта.
- source_word: וְזָנוּ אַחֲרֵי אֱלֹהֵיהֶם
  choice: они станут блудить вслед за своими богами
  rationale: Сохранена намеренно резкая метафора сексуальной неверности, применённая к идолопоклонству. «Вслед за» передаёт אַחֲרֵי и сохраняет образ следования чужим богам.
- source_word: וְזָבְחוּ לֵאלֹהֵיהֶם
  choice: приносить жертвы своим богам
  rationale: Развёрнутое русское выражение ясно передаёт культовое значение глагола זבח и звучит естественнее буквального «жертвовать богам».
- source_word: וְקָרָא לְךָ
  choice: если кто-нибудь из них пригласит тебя
  rationale: 'Единственное число после множественного подлежащего понято дистрибутивно: речь идёт об одном из жителей. «Пригласит» соответствует контексту участия в жертвенной трапезе; условная связь по-русски естественно выражает развитие предупреждения.'
- source_word: וְאָכַלְתָּ מִזִּבְחוֹ
  choice: ты станешь есть от его жертвы
  rationale: Формулировка остаётся близкой к еврейскому тексту и не сужает смысл заранее до «жертвенной трапезы» или «жертвенного мяса».
theological_decisions:
- issue: Идолопоклонство как сексуальная неверность
  choice: Сохранить образ словом «блудить»
  alternative: «пойдут вслед за своими богами» или «станут поклоняться своим богам»
  rationale: Глагол זנה сознательно связывает идолопоклонство с супружеской и заветной неверностью. Более нейтральная передача устранила бы важную богословскую и литературную напряжённость.
- issue: Единственное число в וְקָרָא после множественного подлежащего
  choice: 'Передать дистрибутивно: «кто-нибудь из них пригласит тебя»'
  alternative: 'Буквально: «он пригласит тебя»; обобщённо: «они пригласят тебя»'
  rationale: Так сохраняется индивидуализированный сценарий предупреждения без неясного русского местоимения и без замены единственного числа множественным.
- issue: Характер еды от жертвы
  choice: Не уточнять в основном тексте, какая именно пища имеется в виду
  alternative: «ты станешь есть жертвенное мясо» или «примешь участие в жертвенной трапезе»
  rationale: Еврейское מִזִּבְחוֹ допускает понимание пищи, связанной с жертвоприношением, но не называет прямо ни мясо, ни трапезу. Уточнение вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи, без архаизмов вроде «дабы» и без конфессионально окрашенных уточнений. Резкая метафора «блудить» сохранена намеренно; синтаксис слегка перестроен ради ясной русской причинно-условной связи.
