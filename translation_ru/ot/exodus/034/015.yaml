  source_fidelity: 'Основной смысл передан верно: предостережение против завета с жителями земли, их культовой неверности, жертв богам, личного приглашения и вкушения от жертвы сохранено. Однако придаточное «и если кто-нибудь…» вносит в ряд еврейских союзных форм явно условную конструкцию, которой в исходнике нет. Лучше сохранить последовательное развитие предупреждаемого последствия.'
  naturalness: «Не заключай … иначе» и «приносить жертвы своим богам» естественны для современного литературного русского. Формулировку «ты станешь есть от его жертвы» следует заменить на более обычное «ты будешь есть от его жертвы».
  terminology: «Завет» точно передаёт בְּרִית. Метафора זנה должна оставаться резкой; «блудить вслед за своими богами» её сохраняет. Примечание a в нынешнем виде неточно называет буквальный смысл «распутством» и требует ясной формулировки. Примечание c не должно утверждать как прямое значение, что речь именно о пище, хотя это вероятное контекстуальное пояснение.
