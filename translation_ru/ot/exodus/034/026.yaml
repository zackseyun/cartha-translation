  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/026.yaml
  text: You shall bring the first of the firstfruits of your ground to the house of Yahweh your God[a]. You shall not boil a young goat in its mother's milk.
translation:
  language: ru
  text: Первую долю первых плодов твоей земли приноси в дом Яхве, твоего Бога.[a] Не вари козлёнка в молоке его матери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «первое из первых плодов твоей земли»; возможно также: «лучшее из первых плодов».'
    reason: Сочетание רֵאשִׁית בִּכּוּרֵי обозначает первую долю первых плодов и может включать оттенок отборности; русский основной текст передаёт первенство, а сноска сохраняет альтернативу.
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: самые первые плоды
  rationale: Сочетание буквально выражает «первое из первых плодов». Русское «самые первые плоды» естественно передаёт первенство урожая, не добавляя прямо значения «лучшие»; буквальная форма отмечена в сноске.
- source_word: אַדְמָתְךָ
  choice: своей земли
  rationale: Здесь אֲדָמָה означает возделываемую землю, приносящую урожай. «Земля» естественнее в русском сельскохозяйственном контексте, чем «почва».
- source_word: תָּבִיא
  choice: приноси
  rationale: Форма выражает предписание. Русское повелительное «приноси» передаёт постоянное установление и согласуется с обращением к одному лицу.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: в дом Яхве, твоего Бога
  rationale: «Дом» сохраняет образ святилища как Божьего дома и не вводит исторически более узкое слово «храм».
- source_word: לֹא תְבַשֵּׁל
  choice: не вари
  rationale: Глагол בשל в данном контексте конкретно допускает значение варки; эта передача точнее общего «не готовь».
- source_word: גְּדִי
  choice: козлёнка
  rationale: Современное и однозначное русское обозначение молодого козла или молодой козы в данном пищевом контексте.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: в молоке его матери
  rationale: Формально и ясно сохраняет образ исходного текста и соотносит мать именно с козлёнком.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, а не титул. «Яхве» сохраняет его как имя и представляет принятую научную реконструкцию произношения, не подменяя имя титулом.
- issue: Значение רֵאשִׁית в сочетании с בִּכּוּרֵי
  choice: 'первенство по времени: «самые первые плоды»'
  alternative: 'качественное превосходство: «лучшее из первых плодов»'
  rationale: רֵאשִׁית может подразумевать отборную долю, однако непосредственно обозначает начало или первую часть. Перевод не закрепляет добавочное значение качества, а неоднозначность отражена в документации и сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным законодательным звучанием. Формы «приноси» и «не вари» передают предписание без архаических оборотов; обращение сохранено в единственном числе.
