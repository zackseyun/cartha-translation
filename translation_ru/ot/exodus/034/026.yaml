  verdict: revise
  source_fidelity: 'Вторая заповедь передана точно: «не вари козлёнка в молоке его матери» соответствует לֹא תְבַשֵּׁל גְּדִי בַּחֲלֵב אִמּוֹ. Передача Яхве оправданно сохраняет личное имя יהוה, а «дом» не анахронистически сужает значение до храма. В первой части «самые первые плоды» передаёт идею раннего урожая, но недостаточно ясно отражает конструкцию רֵאשִׁית בִּכּוּרֵי — «первая (или отборная) доля первых плодов».'
