  text: And no man shall go up with you[a], and indeed no man shall be seen anywhere on the mountain[b]; even the flock and the herd must not graze in front of that mountain.
translation:
  language: ru
  text: Никто не должен подниматься вместе с тобой, и пусть вообще никто не появляется нигде на горе[a]; даже мелкий и крупный скот не должен пастись перед той горой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть никого не будет видно нигде на горе». Древнееврейская форма глагола может означать как «появляться», так и «быть видимым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: никто
  rationale: В обоих запретах существительное имеет обобщающее значение — ни один человек. Русское «никто» естественно и точно передаёт эту силу без неоправданного ограничения только мужчинами.
- source_word: יַעֲלֶה עִמָּךְ
  choice: не должен подниматься вместе с тобой
  rationale: Глагол עלה обозначает движение вверх, здесь — восхождение на гору; «вместе с тобой» ясно передаёт עִמָּךְ.
- source_word: וְגַם
  choice: и вообще
  rationale: 'Сочетание продолжает и усиливает запрет: Моисея никто не должен сопровождать, более того, на горе вообще никто не должен появляться.'
- source_word: אַל יֵרָא
  choice: не должен появляться
  rationale: Нифаль глагола ראה допускает значения «появляться» и «быть видимым». В основном тексте выбрано естественное русское «появляться», а пассивное значение сохранено в сноске.
- source_word: בְּכָל הָהָר
  choice: нигде на горе
  rationale: В сочетании с отрицанием фраза означает запрет присутствия в любой части горы; «нигде на горе» передаёт это по-русски естественно.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: мелкий и крупный скот
  rationale: Устойчивая древнееврейская пара различает мелкий домашний скот и крупный рогатый скот. Краткая русская формула сохраняет обе категории.
- source_word: אַל יִרְעוּ
  choice: не должен пастись
  rationale: При животных как подлежащем רעה означает «пастись, щипать траву»; отрицательная конструкция передаёт прямой запрет.
- source_word: אֶל מוּל
  choice: перед
  rationale: Сочетание указывает на пространство напротив или непосредственно перед объектом. «Перед» сохраняет пространственное значение, не уточняя расстояние.
- source_word: הָהָר הַהוּא
  choice: той горой
  rationale: Указательное местоимение выделяет конкретную, уже определённую гору; «той горой» естественно сохраняет эту отсылку.
