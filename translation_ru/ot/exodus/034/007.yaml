  text: נֹצֵ֥ר חֶ֨סֶד֙ לָ/אֲלָפִ֔ים נֹשֵׂ֥א עָוֺ֛ן וָ/פֶ֖שַׁע וְ/חַטָּאָ֑ה וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֣ד עֲוֺ֣ן אָב֗וֹת עַל בָּנִים֙ וְ/עַל בְּנֵ֣י בָנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/007.yaml
  text: keeping steadfast love for thousands[a], forgiving iniquity and transgression and sin, but he will by no means leave unpunished, visiting the iniquity of fathers on children and on children's children[c][b], to the third and to the fourth generation.
translation:
  language: ru
  text: хранящий неизменную любовь для тысяч[a], прощающий беззаконие, преступление и грех, но отнюдь не оставляющий без наказания[b]; взыскивающий за беззаконие отцов с детей и их детей[c] — до третьего и четвёртого поколения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для тысячи поколений». В еврейском тексте сказано просто «для тысяч»; вероятно, это противопоставляет долговечность Божьей неизменной любви суду «до третьего и четвёртого поколения».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «отнюдь не оправдывающий» или «отнюдь не объявляющий невиновным».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «с сыновей и с сыновей сыновей». Здесь речь идёт о нисходящих поколениях.'
    reason: cultural_note
lexical_decisions:
- source_word: נֹצֵר
  choice: хранящий
  rationale: Причастие qal передаёт продолжающееся действие — хранить, оберегать, сохранять; «хранящий» естественно продолжает формулу самооткровения.
- source_word: חֶסֶד
  choice: неизменную любовь
  rationale: Сочетание передаёт как любовь, так и её верность и постоянство в отношениях завета, оставаясь понятным современному читателю.
- source_word: לָאֲלָפִים
  choice: к тысячам
  rationale: В еврейском тексте сказано буквально «к/для тысяч» без существительного «поколений»; перевод сохраняет эту намеренную недосказанность.
- source_word: נֹשֵׂא
  choice: прощающий
  rationale: Буквально глагол означает «несущий», но в сочетании с обозначениями греха идиоматически выражает прощение.
- source_word: עָוֺן
  choice: беззаконие
  rationale: Слово может обозначать порок, вину и её последствия; «беззаконие» сохраняет нравственно-судебную весомость и допускает эту смысловую широту.
- source_word: פֶשַׁע
  choice: преступление
  rationale: Слово обозначает нарушение и мятежный проступок; «преступление» естественно входит в трёхчленное перечисление.
- source_word: חַטָּאָה
  choice: грех
  rationale: Прямой и общепонятный эквивалент, завершающий тройное обозначение человеческой вины.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: но отнюдь не оставляющий без наказания
  rationale: Инфинитив абсолютный с личной формой усиливает отрицание. Формулировка передаёт судебный смысл, не добавляя отсутствующего в оригинале прямого дополнения «виновного».
- source_word: פֹּקֵד
  choice: взыскивающий
  rationale: В контексте суда глагол означает обращать внимание на вину и приводить её к последствиям. «Взыскивающий за» сохраняет судебную силу, не сужая значение до простого «наказывающий».
- source_word: עֲוֺן אָבוֹת
  choice: беззаконие отцов
  rationale: «Отцов» точно сохраняет мужскую форму исходного текста; повтор «беззаконие» поддерживает лексическую связь с первым употреблением עָוֺן.
- source_word: עַל בָּנִים וְעַל בְּנֵי בָנִים
  choice: с детей и с детей их детей
  rationale: Формулировка естественно обозначает нисходящие поколения и согласуется с управлением русского «взыскивать с».
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: до третьего и четвёртого поколения
  rationale: Слово «поколение» подразумевается семейной последовательностью и добавлено один раз для ясности по нормам русского языка.
theological_decisions:
- issue: Напряжение между Божьим прощением и правосудием в וְנַקֵּה לֹא יְנַקֶּה
  choice: Сохранить рядом полное утверждение о прощении и усиленное отрицание безнаказанности.
  alternative: «но виновного не оправдывающий» или более буквально «но очищая не очистит»
  rationale: Исходный текст намеренно соединяет милость и правосудие. Перевод не ослабляет ни одну сторону и не вводит явного объекта «виновного», которого в еврейской фразе нет.
- issue: Следует ли добавлять «поколения» после «тысяч»
  choice: Не добавлять «поколений» в основном тексте.
  alternative: «к тысяче поколений» или «для тысяч поколений»
  rationale: В отличие от некоторых параллельных мест, здесь слово «поколения» отсутствует. Основной текст сохраняет широкое выражение оригинала, а вероятный смысл поясняется в сноске.
- issue: Межпоколенческие последствия беззакония отцов
  choice: Передать судебно открытым выражением «взыскивающий за беззаконие отцов с детей».
  alternative: «наказывающий детей за беззаконие отцов»
  rationale: Так сохраняется смысловая широта פקד и напряжение самого текста без уточнения механизма ответственности или последствий на основании внешней богословской системы.
translation_notes:
  register: Современный литературный русский язык с достоинством формулы Божьего самооткровения. Причастный ряд сохранён как продолжение предыдущего стиха. Традиционно-религиозные слова используются лишь там, где они остаются понятными и точно передают вес исходной лексики; архаизмы вроде «милость до тысяч родов» избегаются.
