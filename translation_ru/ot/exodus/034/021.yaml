source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲבֹ֔ד וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת בֶּ/חָרִ֥ישׁ וּ/בַ/קָּצִ֖יר תִּשְׁבֹּֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/021.yaml
  text: Six days you shall work[a], but on the seventh day you shall cease; in plowing time and in harvest you shall cease.
translation:
  language: ru
  text: Шесть дней работай, а в седьмой день прекращай работу[a]; и во время пахоты, и во время жатвы прекращай работу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отдыхай». Еврейский глагол означает «прекращать, переставать», а в расширенном смысле — «отдыхать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Шесть дней
  rationale: Прямо передаёт временной отрезок и сохраняет краткость еврейской фразы.
- source_word: תַּעֲבֹד
  choice: работай
  rationale: Форма в данном контексте выражает предписание; повелительное «работай» естественно и ясно передаёт его по-русски.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: а в седьмой день
  rationale: Союз «а» естественно выражает заложенное в контексте противопоставление шести рабочих дней седьмому.
- source_word: תִּשְׁבֹּת
  choice: прекращай работу
  rationale: Глагол שׁבת прежде всего означает прекращение деятельности. В контексте это естественно передаётся выражением «прекращай работу», не сводящим смысл лишь к отдыху.
- source_word: בֶּחָרִישׁ
  choice: во время пахоты
  rationale: Передаёт временное значение предлога и сельскохозяйственный смысл существительного — пахоту или сезон пахоты.
- source_word: וּבַקָּצִיר
  choice: и во время жатвы
  rationale: Естественно обозначает период сбора урожая и сохраняет параллелизм с «во время пахоты».
- source_word: תִּשְׁבֹּת (второе употребление)
  choice: прекращай работу
  rationale: Повтор сохранён, поскольку в еврейском тексте он подчёркивает обязательность прекращения работы даже в напряжённые земледельческие сезоны.
theological_decisions:
- issue: Передача связанного с субботой глагола שׁבת
  choice: «прекращай работу» в обоих случаях
  alternative: «отдыхай»
  rationale: Выбранный вариант передаёт основное значение глагола — прекращать деятельность — и подчёркивает остановку труда, не добавляя к тексту более узкого представления об отдыхе.
translation_notes:
  register: Современный литературный русский язык; лаконичная, предписывающая формулировка. Повтор ключевого выражения сохранён ради смыслового акцента и соответствия структуре оригинала.
