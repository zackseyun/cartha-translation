base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/025.yaml
  text: You shall not slaughter the blood of my sacrifice with leaven[a], and the sacrifice of the feast of the Passover shall not remain until the morning.
translation:
  language: ru
  text: Не приноси Мне жертву при квасном[a], и жертва праздника Пасхи пусть не остаётся до утра[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не закалывай при квасном кровь Моей жертвы». В еврейском тексте глагол «закалывать» употреблён со словом «кровь» как культовое выражение; в русском переводе оно передано как «не приноси Мне жертву». «При квасном» может означать при наличии квасного или вместе с ним.'
    reason: Сохраняет упоминание крови и необычную еврейскую конструкцию, не создавая неестественного русского сочетания и не добавляя отсутствующее в оригинале действие.
  - marker: b
    text: 'Возможно также: «пасхальная жертва» или «жертва праздника Песах». Еврейское выражение представляет собой компактную цепочку существительных.'
    reason: Лексико-синтаксическая альтернатива.
lexical_decisions:
- source_word: תִשְׁחַט
  choice: закалывай
  rationale: Глагол обозначает заклание животного, особенно в жертвенном контексте; «закалывай» точнее передаёт обрядовое действие, чем общее «убивай».
- source_word: עַל חָמֵץ
  choice: при квасном
  rationale: 'Предлог с существительным образует краткое культовое выражение: заклание не должно совершаться при наличии квасного или вместе с ним. Формулировка не уточняет сверх текста конкретную обрядовую ситуацию.'
- source_word: דַּם זִבְחִי
  choice: жертву, кровь которой приносится Мне
  rationale: Еврейское «кровь Моей жертвы» синтаксически связано с глаголом «закалывать», что при буквальном воспроизведении по-русски звучало бы как «закалывать кровь». Перестройка сохраняет и жертву, и явно названную кровь, и местоименный суффикс первого лица.
- source_word: יָלִין
  choice: пусть не остаётся до утра
  rationale: В данном предписании глагол означает, что жертва не должна пролежать всю ночь; указание «до утра» уже выражает временной предел без избыточного добавления «на ночь».
- source_word: זֶבַח חַג הַפָּסַח
  choice: жертва праздника Пасхи
  rationale: 'Переданы все три элемента компактной именной цепочки: жертва, праздник и Пасха. Русская конструкция остаётся ясной и не сводит выражение заранее лишь к одному из возможных кратких обозначений.'
- source_word: הַפָּסַח
  choice: Пасхи
  rationale: «Пасха» — укоренившееся русское соответствие названию израильского праздника; здесь оно употреблено в непосредственном ветхозаветном обрядовом смысле.
theological_decisions:
- issue: Передача пасхальной терминологии без привнесения позднейших богословских ассоциаций
  choice: праздника Пасхи
  alternative: праздника Песах / пасхальная жертва
  rationale: Выбранное выражение сохраняет непосредственный контекст установления праздника в Израиле и не добавляет к древнееврейскому тексту последующих толкований.
- issue: Отнесение местоименного суффикса в выражении זִבְחִי
  choice: кровь которой приносится Мне
  alternative: кровь Моей жертвы
  rationale: Суффикс сохранён как указание на принадлежность жертвы Богу, но фраза перестроена ради нормальной русской сочетаемости. Формулировка не уточняет, кто именно совершает приношение, и не вводит дополнительной доктринальной трактовки.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Слова «закалывай», «жертва», «квасное» и «Пасха» сохраняют обрядовую конкретность, а синтаксис перестроен там, где буквальное воспроизведение породило бы ненормальное русское сочетание.
