  text: וַ/יֹּ֗אמֶר הִנֵּ֣ה אָנֹכִי֮ כֹּרֵ֣ת בְּרִית֒ נֶ֤גֶד כָּֽל עַמְּ/ךָ֙ אֶעֱשֶׂ֣ה נִפְלָאֹ֔ת אֲשֶׁ֛ר לֹֽא נִבְרְא֥וּ בְ/כָל הָ/אָ֖רֶץ וּ/בְ/כָל הַ/גּוֹיִ֑ם וְ/רָאָ֣ה כָל הָ֠/עָם אֲשֶׁר אַתָּ֨ה בְ/קִרְבּ֜/וֹ אֶת מַעֲשֵׂ֤ה יְהוָה֙ כִּֽי נוֹרָ֣א ה֔וּא אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֥ה עִמָּֽ/ךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/010.yaml
  text: And he said, “Look, I am making a covenant. Before all your people I will do wonders such as have not been created in all the earth or among any of the nations. And all the people in whose midst you are will see the work of the LORD, for what I am doing with you is awe-inspiring.”
translation:
  language: ru
  text: 'И сказал Он: «Вот, Я заключаю завет. Перед всем твоим народом Я совершу чудеса, каких не бывало[a] ни на всей земле, ни среди каких-либо народов. И весь народ, среди которого ты находишься, увидит деяние ГОСПОДА, ибо внушает трепет то, что Я совершаю с тобой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «какие не были сотворены».'
    reason: Показывает необычный образ оригинала, тогда как основной текст использует естественный русский оборот.
lexical_decisions:
- source_word: הִנֵּה
  choice: «Вот»
  rationale: Сохраняет указательно-эмфатическую функцию еврейского слова и естественно вводит торжественное объявление.
- source_word: כֹּרֵת בְּרִית
  choice: «заключаю завет»
  rationale: Еврейская идиома буквально означает «режу завет», но по-русски нормативно и точно передаётся как «заключаю завет».
- source_word: נִפְלָאֹת
  choice: «чудеса»
  rationale: Обозначает необычайные, дивные деяния Бога; «чудеса» ясно и естественно в данном повествовательном контексте.
- source_word: לֹא נִבְרְאוּ
  choice: «каких не бывало»
  rationale: Буквально — «которые не были сотворены»; русский оборот передаёт смысл беспримерности деяний, не создавая неестественной фразы.
- source_word: מַעֲשֵׂה יְהוָה
  choice: «деяние ГОСПОДА»
  rationale: Единственное число сохранено; тетраграмматон передан традиционным титулом, графически выделенным прописными буквами.
- source_word: נוֹרָא
  choice: «внушает трепет»
  rationale: Слово сочетает значения устрашающего и вызывающего благоговейный трепет; выбранная формулировка сохраняет эту напряжённость.
- source_word: עֹשֶׂה עִמָּךְ
  choice: «совершаю с тобой»
  rationale: 'Сохраняет неоднозначное עִם: речь может идти как о действии по отношению к Моисею/народу, так и о действии с его участием.'
theological_decisions:
- issue: Референт местоимения в формуле «с тобой»
  choice: 'Сохранено единственное число: «с тобой»'
  alternative: «для тебя» или «с вами»
  rationale: Еврейский текст обращается к Моисею в единственном числе, но его представительская связь с народом остаётся контекстуально открытой.
- issue: Характер Божьего деяния как נוֹרָא
  choice: «внушает трепет»
  alternative: «страшно» или «величественно»
  rationale: Перевод не сводит слово ни только к страху, ни только к величию, сохраняя благоговейно-грозный оттенок.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Инверсия «И сказал Он» сохраняет повествовательный ритм; местоимение «Он» указывает на говорящего в контексте. Синтаксис не перегружен архаизмами.
