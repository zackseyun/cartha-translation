source:
  edition: WLC
  text: וֶ/הְיֵ֥ה נָכ֖וֹן לַ/בֹּ֑קֶר וְ/עָלִ֤יתָ בַ/בֹּ֨קֶר֙ אֶל הַ֣ר סִינַ֔י וְ/נִצַּבְתָּ֥ לִ֛/י שָׁ֖ם עַל רֹ֥אשׁ הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/002.yaml
  text: And be ready by the morning[b][a], and in the morning come up to Mount Sinai and present yourself there to me on the top of the mountain.
translation:
  language: ru
  text: Будь готов к утру и утром поднимись на гору Синай. Там, на вершине горы, предстань передо Мной.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стань там передо Мной на вершине горы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהְיֵה נָכוֹן
  choice: Будь готов
  rationale: Императивная конструкция с предикативным прилагательным естественно и точно передаётся современным русским повелением «будь готов».
- source_word: לַבֹּקֶר
  choice: к утру
  rationale: Предлог ל обозначает срок, к которому Моисей должен быть готов; «к утру» сохраняет отличие от следующего בַבֹּקֶר — «утром».
- source_word: וְעָלִיתָ
  choice: поднимись
  rationale: Глагол עלה обозначает движение вверх. Русское «поднимись» естественно передаёт повелительный смысл формы с последовательным союзом, не навязывая различие между «иди» и «приди».
- source_word: בַבֹּקֶר
  choice: утром
  rationale: Обычное временное значение оборота; оно указывает, когда следует взойти на гору.
- source_word: אֶל הַר סִינַי
  choice: на гору Синай
  rationale: В русском языке движение с целью восхождения на гору естественно выражается сочетанием «подняться на гору»; название передано в традиционной форме «Синай».
- source_word: וְנִצַּבְתָּ לִי
  choice: предстань передо Мной
  rationale: Нифаль глагола נצב означает «встать, занять место»; при לִי в контексте встречи с Богом «предстань передо Мной» ясно передаёт официальное появление в Его присутствии, сохраняя смысловую возможность буквального «стань там для Меня».
- source_word: שָׁם עַל רֹאשׁ הָהָר
  choice: там, на вершине горы
  rationale: רֹאשׁ в топографическом употреблении значит «вершина»; порядок и пунктуация дают ясную современную русскую фразу.
theological_decisions:
- issue: Ориентация движения в וְעָלִיתָ
  choice: поднимись
  alternative: взойди / поднимись ко Мне
  rationale: Еврейский глагол сам по себе обозначает восхождение и не требует добавлять «ко Мне». Нейтральное «поднимись» сохраняет подлинную дейктическую неопределённость и не вносит отсутствующих слов.
- issue: Значение וְנִצַּבְתָּ לִי
  choice: предстань передо Мной
  alternative: стань там для Меня
  rationale: Выбранный вариант естественно выражает явление человека перед Богом, однако буквальная конструкция допускает акцент на том, чтобы Моисей встал и оставался в указанном месте; эта возможность отмечена в сноске.
translation_notes:
  register: 'Современный литературный русский язык, ясный и торжественный без архаизации. Два временных оборота намеренно различены: «к утру» и «утром». Местоимение, относящееся к Богу в прямой речи, написано с прописной буквы по принятой русской библейской традиции.'
