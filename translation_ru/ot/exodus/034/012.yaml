  yaml_path: translation/ot/exodus/034/012.yaml
  text: Be careful[a], lest you make a covenant with the inhabitants of the land into which you are going[d][c][b], lest it become a snare in your midst.
translation:
  language: ru
  text: Берегись, чтобы не заключить завет с жителями земли, в которую ты входишь, иначе это станет западнёй в твоей среде.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол стоит в мужском роде. Поэтому заключительное «это» может относиться к жителям земли, понимаемым собирательно, либо в более широком смысле к последствиям такого завета; слово «завет» в еврейском языке женского рода.
    reason: referential_ambiguity
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Берегись
  rationale: Возвратная форма повеления естественно передаёт предостерегающую формулу и рефлексивный оттенок еврейского выражения.
- source_word: פֶּן ... פֶּן
  choice: чтобы не ... иначе
  rationale: Первое פֶּן вводит содержание предостережения, а повторное — угрожающее последствие. Такая передача сохраняет логику двух частей и звучит естественно по-русски.
- source_word: תִּכְרֹת בְּרִית
  choice: заключить завет
  rationale: Буквально «высечь/разрубить завет»; это устойчивый древнееврейский оборот, которому в современном русском соответствует «заключить завет».
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: с жителями земли
  rationale: Причастие в единственном числе имеет собирательное значение; множественное «жителями» ясно выражает смысл.
- source_word: אֲשֶׁר אַתָּה בָּא עָלֶיהָ
  choice: в которую ты входишь
  rationale: Глагол בוא с предлогом על здесь обозначает прибытие на территорию и вступление в неё; «входишь» кратко и естественно передаёт движение.
- source_word: יִהְיֶה לְמוֹקֵשׁ
  choice: он станет западнёй
  rationale: Местоимение соотнесено с ближайшим грамматически подходящим antecedent — «заветом»; «станет западнёй» сохраняет метафору опасного вовлечения.
- source_word: בְּקִרְבֶּךָ
  choice: среди вас
  rationale: Единственное число обращено к Израилю как совокупному адресату. «Среди вас» естественно передаёт присутствие опасности внутри общины.
theological_decisions:
- issue: К чему относится форма единственного числа יִהְיֶה («станет»)?
  choice: К завету с жителями земли
  alternative: К жителю/жителям земли либо ко всей возникшей ситуации
  rationale: Ближайший и наиболее связный референт — «завет». Вместе с тем еврейская форма допускает некоторую референциальную неоднозначность, поэтому она отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественным предостерегающим тоном. «Завет» сохранён как общеупотребительный библейский термин; непрозрачная буквальная идиома «высечь завет» не воспроизводится.
