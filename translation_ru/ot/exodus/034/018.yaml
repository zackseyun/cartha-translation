  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֨ת יָמִ֜ים תֹּאכַ֤ל מַצּוֹת֙ אֲשֶׁ֣ר צִוִּיתִ֔/ךָ לְ/מוֹעֵ֖ד חֹ֣דֶשׁ הָ/אָבִ֑יב כִּ֚י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֔יב יָצָ֖אתָ מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/018.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib[c][b]; for in the month of Abib you came out from Egypt.
translation:
  language: ru
  text: Соблюдай праздник опресноков[a]. Семь дней ешь пресный хлеб, как Я повелел тебе, в назначенное время, в месяце Авиве[b], потому что в месяце Авиве ты вышел из Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праздник пресного хлеба». Еврейское חַג означает священный праздник, нередко паломнический.'
    reason: lexical_alternative
  - marker: b
    text: Авив — ранневесенний месяц, связанный с исходом из Египта. Еврейское слово אָבִיב также связано с созревающими колосьями.
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: Праздник опресноков
  rationale: חַג обозначает священный праздник, нередко связанный с паломничеством, а מַצּוֹת — пресные хлебы. Традиционное русское название кратко, узнаваемо и сохраняет характер установленного праздника.
- source_word: תִּשְׁמֹר
  choice: соблюдай
  rationale: В контексте заповеди שׁמר означает хранить и исполнять установленный порядок. «Соблюдай» естественно передаёт длительную обязательность повеления.
- source_word: תֹּאכַל מַצּוֹת
  choice: ешь пресный хлеб
  rationale: Хотя מַצּוֹת имеет форму множественного числа, русское собирательное выражение «пресный хлеб» звучит естественно и точно передаёт смысл.
- source_word: אֲשֶׁר צִוִּיתִךָ
  choice: как Я повелел тебе
  rationale: Оборот связывает порядок и срок празднования с ранее данным Божьим повелением; «как» естественно передаёт эту связь.
- source_word: לְמוֹעֵד
  choice: в назначенное время
  rationale: מוֹעֵד обозначает установленный срок или время священного собрания. Выбранный вариант сохраняет идею заранее определённого времени без лишнего уточнения.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: месяц Авив
  rationale: В контексте исхода выражение служит календарным обозначением месяца. Транслитерация сохраняет древнееврейское название, а примечание поясняет его сезонный смысл.
- source_word: כִּי
  choice: потому что
  rationale: 'Союз вводит основание заповеди: праздник совершается в это время в связи с выходом из Египта.'
- source_word: יָצָאתָ מִמִּצְרָיִם
  choice: ты вышел из Египта
  rationale: יצא буквально обозначает выход. Русское «вышел из Египта» прямо и естественно сохраняет мотив исхода и форму второго лица единственного числа.
theological_decisions:
- issue: Статус названия праздника
  choice: Передать חַג הַמַּצּוֹת как установленное название «Праздник опресноков»
  alternative: «праздник пресного хлеба» или «паломнический праздник опресноков»
  rationale: Форма названия сохраняет заветный и богослужебный вес установленного Богом праздника, не добавляя более узкого толкования о паломничестве.
- issue: Единственное число обращения к Израилю
  choice: Сохранить обращение «ты»
  alternative: Передать корпоративный смысл множественным числом «вы» или заменить обращение словом «Израиль»
  rationale: Древнееврейский текст последовательно употребляет второе лицо мужского рода единственного числа. Русское «ты» сохраняет грамматическую форму и допускает корпоративное обращение к народу без поясняющей вставки.
- issue: Причинная связь с исходом
  choice: Передать כִּי явно причинным союзом «потому что»
  alternative: «ибо» или менее определённое присоединение отдельной фразы
  rationale: 'Так сохраняется выраженное в тексте основание календарного предписания: именно в этом месяце адресат вышел из Египта.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Императив «соблюдай» и формы единственного числа сохраняют структуру древнееврейского обращения. Традиционный термин «опресноки» пояснён в сноске; архаические синтаксические обороты не используются.
