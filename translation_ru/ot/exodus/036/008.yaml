source:
  edition: WLC
  text: וַ/יַּעֲשׂ֨וּ כָל חֲכַם לֵ֜ב בְּ/עֹשֵׂ֧י הַ/מְּלָאכָ֛ה אֶת הַ/מִּשְׁכָּ֖ן עֶ֣שֶׂר יְרִיעֹ֑ת שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תוֹלַ֣עַת שָׁנִ֔י כְּרֻבִ֛ים מַעֲשֵׂ֥ה חֹשֵׁ֖ב עָשָׂ֥ה אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/008.yaml
  text: And every skillful man among those doing the work made the tabernacle with ten curtains of finely twisted linen[a], and blue, and purple, and scarlet yarn; he made them with cherubim[b], the work of a skillful designer.
translation:
  language: ru
  text: 'Все искусные мастера, выполнявшие эту работу, сделали скинию из десяти полотнищ: из тонкого кручёного льна, голубой, пурпурной и алой пряжи. Он сделал их с изображениями херувимов искусной работы[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'В еврейском тексте здесь стоит глагол в единственном числе — «он сделал их», хотя в начале стиха глагол стоит во множественном числе. Некоторые переводы сглаживают эту смену числа: «они сделали их».'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: искусные мастера
  rationale: Буквально «мудрый сердцем»; в данном контексте это идиома, обозначающая умелого ремесленника. Русское «искусные мастера» естественно передаёт профессиональное умение и согласуется с начальным глаголом во множественном числе.
- source_word: בְּעֹשֵׂי הַמְּלָאכָה
  choice: среди выполнявших работу
  rationale: Предлог בְּ при причастной конструкции указывает на принадлежность к группе занятых этой работой; «среди» ясно сохраняет данный оттенок.
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: Устоявшееся русское библейское обозначение переносного святилища в Исходе; точнее в этом контексте, чем общее «жилище».
- source_word: יְרִיעֹת
  choice: полотнища
  rationale: Речь идёт о больших составных тканевых частях покрытия скинии. «Полотнища» точнее передаёт конструктивную функцию, чем бытовое «занавеси».
- source_word: שֵׁשׁ מָשְׁזָר
  choice: кручёный тонкий лён
  rationale: Сохраняет как качество льна, так и указание на скручивание нитей.
- source_word: תְכֵלֶת
  choice: голубая пряжа
  rationale: Передаёт престижный сине-голубой краситель и подразумеваемый текстильный материал; слово «пряжа» общее для ряда перечисленных цветов.
- source_word: אַרְגָּמָן
  choice: пурпурная пряжа
  rationale: «Пурпурный» — традиционный и точный эквивалент названия этого дорогого красителя.
- source_word: תוֹלַעַת שָׁנִי
  choice: алая пряжа
  rationale: Фраза обозначает окрашенный в ярко-красный цвет текстильный материал; «алая пряжа» естественно в контексте изготовления полотнищ.
- source_word: כְּרֻבִים
  choice: херувимы
  rationale: Устоявшийся русский библейский термин, сохраняющий культовый регистр.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: искусная узорная работа
  rationale: Выражение указывает на художественно задуманное и выполненное тканое изображение. «Узорная работа» передаёт ремесленно-художественный характер, не сводя технику без достаточных оснований к вышивке.
- source_word: עָשָׂה אֹתָם
  choice: он сделал их
  rationale: Сохраняет единственное число заключительного еврейского глагола и множественное число его дополнения, не сглаживая смену числа относительно начала стиха.
theological_decisions:
- issue: Передача חֲכַם לֵב в обобщённом ремесленном контексте
  choice: искусные мастера
  alternative: искусные люди; умелые работники
  rationale: Мужская грамматическая форма и ремесленный смысл сохраняются естественным для русского языка обозначением «мастера», без утверждения сверх того, что выражает исходный текст.
- issue: Смена числа у заключительного глагола
  choice: он сделал их
  alternative: они сделали их
  rationale: Масоретский текст начинает стих глаголом во множественном числе, но завершает его глаголом в единственном. Перевод сохраняет эту напряжённость, не заменяя её согласованным множественным числом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Термины «скиния» и «херувимы» сохранены как широко узнаваемые и контекстуально точные. Необычный переход от множественного числа к единственному намеренно оставлен и пояснён в сноске.
