lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Последовательная повествовательная форма от עשה передана естественным русским прошедшим временем.
- source_word: מִכְסֶה לָאֹהֶל
  choice: для шатра покрытие
  rationale: מִכְסֶה обозначает покрывающий слой, а אֹהֶל — шатёр; такой перевод сохраняет предметное различие между шатром и его покрытием.
- source_word: עֹרֹת אֵלִים מְאָדָּמִים
  choice: из бараньих кож, окрашенных в красный цвет
  rationale: Переданы как материал, так и значение формы מְאָדָּמִים — кожи были сделаны красными, то есть окрашены.
- source_word: וּמִכְסֵה
  choice: а ... покрытие
  rationale: Повтор существительного сохранён; союз «а» естественно вводит дополнительный, расположенный выше слой, не предполагая противопоставления.
- source_word: עֹרֹת תְּחָשִׁים
  choice: из кож тахашей[a]
  rationale: Значение תְּחָשִׁים достоверно не установлено. Транслитерация не навязывает спорное отождествление животного или вида кожи; неопределённость разъяснена в сноске.
- source_word: מִלְמָעְלָה
  choice: сверху
  rationale: Кратко и естественно передаёт расположение этого покрытия над предыдущим слоем.
