  source_fidelity: 'Текст точно передаёт еврейский параллелизм: сначала соединены пять полотнищ, затем — вторая группа из пяти. «Соединил» соответствует חבר и не уточняет способ скрепления. Добавленное «ещё» — естественное русское средство обозначить вторую пятёрку, подразумеваемую структурой оригинала; нового фактического содержания оно не добавляет.'
