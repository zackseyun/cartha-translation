  yaml_path: translation/ot/exodus/036/010.yaml
  text: He joined five of the curtains to one another[a], and the other five curtains he joined to one another.
translation:
  language: ru
  text: Он соединил пять полотнищ одно с другим, и ещё пять полотнищ соединил одно с другим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַבֵּר / חִבַּר
  choice: соединил
  rationale: Глагол חבר означает соединять, связывать. «Соединил» естественно звучит в современном русском языке и не уточняет сверх текста способ скрепления.
- source_word: יְרִיעֹת
  choice: полотнищ
  rationale: В контексте скинии слово обозначает большие тканые части покрытия. «Полотнища» точнее передаёт конструктивную функцию этих частей, чем бытовое «занавеси».
- source_word: חֲמֵשׁ
  choice: пять
  rationale: Прямое соответствие количественному числительному.
- source_word: אַחַת אֶל אֶחָת
  choice: одно с другим
  rationale: Еврейское сочетание описывает последовательное взаимное соединение полотнищ; русский оборот сохраняет образ отдельных частей и естественен в данном контексте.
- source_word: וְחָמֵשׁ יְרִיעֹת
  choice: и ещё пять полотнищ
  rationale: В еврейском буквально сказано «и пять полотнищ». Слово «ещё» естественно показывает, что речь идёт о второй группе из пяти, не создавая впечатления, будто она прямо выражена отдельным определением в оригинале.
