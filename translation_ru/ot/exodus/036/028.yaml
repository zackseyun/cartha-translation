lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: И ... две
  rationale: Союз продолжает последовательное описание работ, а форма числительного прямо указывает на две доски.
- source_word: קְרָשִׁים
  choice: доски
  rationale: В описании скинии слово обозначает деревянные конструктивные элементы; «доски» — традиционный и понятный русский эквивалент.
- source_word: עָשָׂה
  choice: сделал он
  rationale: Обычное значение глагола — «делать, изготовлять»; порядок слов сохраняет повествовательное продолжение и естественен для библейского регистра.
- source_word: לִ/מְקֻצְעֹת
  choice: для углов
  rationale: Форма может обозначать угловые места или особые угловые соединения; основной текст передаёт ясный пространственный смысл, а неоднозначность отмечена в сноске.
- source_word: הַ/מִּשְׁכָּן
  choice: скинии
  rationale: «Скиния» — укоренившееся русское обозначение переносного святилища в Исходе; оно точно идентифицирует предмет и сохраняет возвышенный, но понятный регистр.
- source_word: בַּ/יַּרְכָתָיִם
  choice: с задней стороны
  rationale: Двойственное число указывает на две задние оконечности или стороны сооружения. Формулировка избегает неестественного повтора слова «углы», а более буквальная возможность дана в сноске.
