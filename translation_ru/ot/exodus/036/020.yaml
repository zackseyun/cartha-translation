lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: И сделал он
  rationale: Форма wayyiqtol от עשה последовательно развивает повествование; простой прошедший вид естественно передаёт действие, не уточняя способ изготовления.
- source_word: הַקְּרָשִׁים
  choice: брусья
  rationale: В описании скинии קֶרֶשׁ обозначает несущие деревянные элементы. Русское «брусья» естественнее передаёт их конструктивную функцию и вертикальную установку, чем более широкое «доски».
- source_word: לַמִּשְׁכָּן
  choice: для скинии
  rationale: מִשְׁכָּן обозначает священное жилище; «скиния» — устоявшийся и узнаваемый русский библейский термин.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Конструктивное сочетание буквально означает древесину дерева שִׁטָּה. Формулировка «древесина акации» точна и понятна современному читателю.
- source_word: עֹמְדִים
  choice: поставленные вертикально
  rationale: Причастие описывает вертикальное положение конструктивных элементов; перевод ясно выражает архитектурный смысл, подразумеваемый контекстом.
