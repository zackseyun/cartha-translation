  yaml_path: translation/ot/exodus/036/021.yaml
  text: The length of each frame was ten cubits[a], and the width of each frame was a cubit and a half.
translation:
  language: ru
  text: Длина каждого бруса была десять локтей[a], а ширина каждого бруса — полтора локтя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доски» либо «рамы». Еврейское слово קֶרֶשׁ обозначает конструктивные элементы скинии, точная форма которых неясна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶשֶׂר אַמֹּת אֹרֶךְ
  choice: длина … десять локтей
  rationale: Сохраняется древняя мера длины и именная конструкция оригинала; по-русски размер передан естественно и ясно.
- source_word: הַקָּרֶשׁ
  choice: брус
  rationale: В контексте скинии קֶרֶשׁ обозначает несущий элемент конструкции. «Брус» естественно передаёт структурную функцию и не создаёт впечатления тонкой доски; точная форма детали остаётся не вполне определённой.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: полтора локтя
  rationale: Еврейское выражение буквально означает «локоть и половина локтя»; «полтора локтя» — его точный и естественный русский эквивалент.
- source_word: רֹחַב
  choice: ширина
  rationale: Современный и точный эквивалент существительного со значением ширины.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: каждого бруса
  rationale: В данном контексте выражение имеет распределительное значение и указывает на размеры каждого отдельного элемента, а не на «первый» брус.
