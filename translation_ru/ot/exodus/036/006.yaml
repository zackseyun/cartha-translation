base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/006.yaml
  text: So Moses commanded[a], and they sent a proclamation through the camp, saying[b], “Let neither man nor woman do any more work for the contribution of the sanctuary.” So the people were restrained from bringing more.
translation:
  language: ru
  text: 'И повелел Моисей, и по стану было объявлено[a]: «Пусть ни мужчина, ни женщина больше не выполняют никакой работы для священного приношения[b]». И народ был удержан от дальнейших приношений.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «провели голос по стану», то есть распространили объявление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для приношения святилищу»; также возможно: «для приношения для святилища».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: повелел
  rationale: Глагол צוה выражает властное распоряжение Моисея; «повелел» сохраняет его силу и соответствует достоинству повествования.
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: по всему стану было объявлено
  rationale: Буквально идиома означает «провели/распространили голос» и описывает публичное объявление, переданное по стану. Русская безлично-пассивная формулировка естественна и не конкретизирует не названных в тексте исполнителей.
- source_word: בַּמַּחֲנֶה
  choice: по всему стану
  rationale: Хотя предлог буквально может значить «в стане», при распространении объявления «по всему стану» естественно передаёт его циркуляцию среди народа.
- source_word: אִישׁ וְאִשָּׁה
  choice: ни мужчина, ни женщина
  rationale: Сочетание с запретом אַל прямо охватывает и мужчин, и женщин; парная русская конструкция сохраняет это выражение.
- source_word: אַל יַעֲשׂוּ עוֹד מְלָאכָה
  choice: больше ничего не делают
  rationale: מְלָאכָה обозначает работу, труд или изготовление. В контексте речь идёт о прекращении дальнейшей работы для приношения; конструкция сохраняет широкое значение и звучит естественно по-русски.
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  choice: для приношения святилищу
  rationale: תְּרוּמָה — отделённый дар или приношение, а הַקֹּדֶשׁ в данном контексте связано со святилищем. Дательный оборот естественно выражает предназначение приношения, не превращая его в дар самому зданию.
- source_word: וַיִּכָּלֵא
  choice: перестал
  rationale: Нифаль от כלא буквально передаёт удержание или прекращение действия. По-русски «народ перестал приносить» ясно выражает достигнутый результат, не подразумевая нежелания народа.
- source_word: מֵהָבִיא
  choice: приносить
  rationale: Предлог מן с инфинитивом обозначает прекращение или удержание от действия. Контекст уже показывает, что прекратили приносить дополнительные дары, поэтому слово «ещё» необязательно.
