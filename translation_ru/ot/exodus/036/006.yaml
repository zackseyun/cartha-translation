    rationale: מְלָאכָה означает работу/труд; «ничего» расширяет запрет и делает его менее точным.
  - severity: low
    issue: Основной вариант «для приношения святилищу» излишне конкретизирует синтаксическую связь.
    rationale: לִתְרוּמַת הַקֹּדֶשׁ может означать «для священного приношения»; понимание как приношения для святилища возможно, но предпочтительно в примечании.
