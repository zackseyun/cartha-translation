lexical_decisions:
- source_word: וַיְחַבֵּר
  choice: соединил
  rationale: Глагол חָבַר означает соединять, скреплять; «соединил» естественно в контексте изготовления скинии и не уточняет способ соединения сверх исходного текста.
- source_word: הַיְרִיעֹת
  choice: полотнищ
  rationale: יְרִיעָה здесь обозначает крупные тканевые части покрытия скинии. «Полотнища» точнее передаёт предметное значение, чем бытовое «занавеси».
- source_word: לְבָד
  choice: отдельно
  rationale: 'לְבָד указывает, что полотнища были соединены в две раздельные группы: пять в одну и шесть в другую.'
- source_word: חֲמֵשׁ
  choice: пять
  rationale: Прямое соответствие количественному числительному.
- source_word: שֵׁשׁ
  choice: шесть
  rationale: Прямое соответствие количественному числительному.
- source_word: אֶת ... וְאֶת
  choice: две однородные группы прямого дополнения
  rationale: Повторение показателя прямого дополнения выделяет две соотнесённые группы; в русском это передано параллельной конструкцией «пять... и шесть...».
