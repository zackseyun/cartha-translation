  yaml_path: translation/ot/exodus/036/023.yaml
  text: 'He made the frames for the tabernacle: twenty frames for the south side[a], toward the south.'
translation:
  language: ru
  text: 'Он сделал брусья для скинии: двадцать брусьев для южной стороны[a], обращённой к югу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «двадцать досок для южной стороны». В еврейском тексте южное направление обозначено дважды («южной… к югу»), вероятно для усиления или уточнения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Форма wayyiqtol породы qal от עשה продолжает повествовательную последовательность; в современном русском естественно простое прошедшее время. Подлежащее мужского рода единственного числа восстанавливается из контекста.
- source_word: הַקְּרָשִׁים
  choice: брусья
  rationale: Кֶרֶשׁ обозначает вертикальные несущие элементы скинии. «Брусья» конкретно передаёт деревянные конструктивные детали, не навязывая представления о сплошных досках или сложных рамах.
- source_word: לַמִּשְׁכָּן
  choice: для скинии
  rationale: מִשְׁכָּן — обычное в Исходе обозначение переносного святилища; «скиния» является укоренившимся и понятным русским библейским термином.
- source_word: עֶשְׂרִים קְרָשִׁים
  choice: двадцать брусьев
  rationale: Числительное и повторённое существительное переданы прямо; повтор сохраняет характер перечня строительных деталей.
- source_word: לִפְאַת
  choice: для ... стороны
  rationale: פֵּאָה здесь означает сторону или край сооружения; «сторона» наиболее естественно для архитектурного описания.
- source_word: נֶגֶב תֵּימָנָה
  choice: южной стороны, обращённой к югу
  rationale: 'Оба южных обозначения сохранены: נֶגֶב передано прилагательным «южной», а направительное תֵּימָנָה — выражением «обращённой к югу». Это воспроизводит уточняющее повторение без неестественного русского «к югу, на юг».'
