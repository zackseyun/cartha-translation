  text: Он сделал полотнища из козьей шерсти[a] для шатра поверх скинии; одиннадцать полотнищ сделал он.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из коз»; возможно, название материала оставлено подразумеваемым. В контексте тканых покрытий скинии наиболее вероятна козья шерсть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשָׂה
  choice: сделал / сделал
  rationale: Обычное значение глагола עשה — «делать». Повтор сохранён, поскольку он присутствует в еврейском тексте и подчёркивает итоговое число полотнищ.
- source_word: יְרִיעֹת
  choice: полотнища
  rationale: В описании скинии слово обозначает крупные тканые части покрытия. «Полотнища» точнее передаёт конструктивные элементы шатра, чем бытовое «занавеси».
- source_word: עִזִּים
  choice: из козьей шерсти
  rationale: Буквально употреблено «коз», без названия материала, но в контексте тканых покрытий подразумевается козья шерсть, а не кожа.
- source_word: לְאֹהֶל
  choice: для шатра
  rationale: 'Предлог ל выражает назначение: полотнища должны были образовать шатёр или шатровое покрытие. Формулировка сохраняет различие между אֹהֶל и מִשְׁכָּן.'
- source_word: עַל
  choice: над
  rationale: Предлог указывает, что шатровое покрытие располагалось поверх скинии; по-русски здесь естественно «над».
- source_word: הַמִּשְׁכָּן
  choice: скинией
  rationale: «Скиния» — закрепившийся русский термин для священного переносного жилища в книге Исход; он также позволяет отличить מִשְׁכָּן от названного рядом шатра.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: одиннадцать
  rationale: Прямое соответствие еврейскому составному числительному.
- source_word: אֹתָם
  choice: полотнищ
  rationale: Местоименный объект относится к полотнищам. В русском повтор существительного после числительного яснее и естественнее, чем отдельное «их».
