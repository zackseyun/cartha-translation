  yaml_path: translation/ot/exodus/036/035.yaml
  text: And he made the curtain of blue[a], purple, and scarlet yarn, and fine twisted linen; he made it with cherubim[c][b], the work of a skillful designer.
translation:
  language: ru
  text: И сделал он завесу[a] из голубой, пурпурной и алой пряжи[b] и тонкого кручёного льна, с искусно выполненными изображениями херувимов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «занавес». Речь идёт о внутренней завесе скинии.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение, переведённое как «алая пряжа», буквально обозначает окрашенный в алый цвет материал или нить; возможный перевод: «багряная пряжа».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «работы искусного мастера»; возможно также: «вышитой работы». Еврейское выражение обозначает художественную узорную работу, не уточняя однозначно технику исполнения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: завесу
  rationale: Слово обозначает внутреннюю завесу скинии. «Завеса» естественно звучит в современном русском языке и сохраняет культовый контекст без излишне специальной терминологии.
- source_word: תְּכֵלֶת
  choice: голубой пряжи
  rationale: Термин обозначает окрашенный в сине-голубой цвет материал; в контексте изготовления завесы подразумевается пряжа. Слово «пряжи» относится ко всему ряду цветных материалов.
- source_word: אַרְגָּמָן
  choice: пурпурной пряжи
  rationale: Обычное обозначение ценного материала, окрашенного в пурпурный цвет; существительное «пряжа» восстанавливается из общего ряда.
- source_word: תוֹלַעַת שָׁנִי
  choice: алой пряжи
  rationale: Выражение обозначает материал или нить алого цвета. «Алая пряжа» ясно передаёт текстильный смысл; возможен также цветовой термин «багряная».
- source_word: שֵׁשׁ מָשְׁזָר
  choice: тонкого кручёного льна
  rationale: Перевод сохраняет как материал — тонкий лён, так и указание на скручивание нитей.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: искусной узорной работы
  rationale: Фраза указывает на художественно задуманную, узорную работу мастера. Формулировка не ограничивает технику только вышивкой.
- source_word: כְּרֻבִים
  choice: херувимами
  rationale: «Херувимы» — закрепившееся в русском библейском языке название изображённых небесных существ.
- source_word: עָשָׂה אֹתָהּ כְּרֻבִים
  choice: с херувимами
  rationale: Кратко передаёт, что изображения херувимов были включены в оформление завесы, не уточняя сверх текста конкретную технику их исполнения.
