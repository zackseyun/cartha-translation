base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/003.yaml
  text: And they took from before Moses all the contribution that the sons of Israel had brought for the work of the service of the sanctuary[a], to do it[c][b]. But they still kept bringing to him freewill offerings morning after morning.
translation:
  language: ru
  text: И они взяли у Моисея всё приношение, которое сыны Израиля принесли для работ, необходимых для священного служения. А сыны Израиля продолжали приносить ему добровольные дары каждое утро.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: они взяли
  rationale: Передаёт основное значение לקח; в контексте мастера забирают у Моисея переданные ему материалы.
- source_word: מִלִּפְנֵי מֹשֶׁה
  choice: от Моисея
  rationale: Буквально выражение означает «из-пред лица Моисея», то есть из его присутствия или распоряжения. Естественное русское «от Моисея» точно передаёт движение материалов, не создавая неясного пространственного образа.
- source_word: כָּל הַתְּרוּמָה
  choice: всё приношение
  rationale: תְּרוּמָה обозначает отделённый для священной цели вклад или дар; «приношение» сохраняет культовый оттенок и охватывает совокупность материалов.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет традиционную форму коллективного обозначения Израиля; далее местоименное הֵם естественно раскрыто как «народ», поскольку речь идёт обо всём сообществе дарителей.
- source_word: לִמְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ לַעֲשֹׂת אֹתָהּ
  choice: для выполнения работ по устройству святилища
  rationale: Еврейская цепочка существительных описывает труд, необходимый для священного дела. В данном контексте הַקֹּדֶשׁ относится к святилищу, а לַעֲשֹׂת אֹתָהּ — к выполнению этой работы; перевод сохраняет смысл без тяжеловесного буквального повтора.
- source_word: וְהֵם הֵבִיאוּ
  choice: А народ продолжал приносить
  rationale: Самостоятельное הֵם подчёркивает продолжающееся действие со стороны израильтян. «А» мягко передаёт переход и оттенок сопоставления, не превращая его в сильное противопоставление.
- source_word: נְדָבָה
  choice: добровольные дары
  rationale: Слово обозначает добровольно принесённый дар. Русское множественное число естественно при повторяющемся действии и не меняет собирательного значения еврейского единственного числа.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: каждое утро
  rationale: 'Повтор существительного выражает регулярность: утро за утром. «Каждое утро» — ясная и естественная современная русская передача.'
theological_decisions: []
