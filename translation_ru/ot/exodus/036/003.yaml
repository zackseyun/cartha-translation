  register: Современный литературный русский с умеренно торжественным библейским регистром. Сохранено традиционное «сыны Израиля», но синтаксис сделан естественным и понятным; тяжёлая буквальная цепочка «работа служения святыни» передана контекстуально как работы по устройству святилища.
