  text: He made fifty loops on the one curtain[a], and he made fifty loops on the edge of the curtain that was in the second set[b]; the loops corresponded to one another.
translation:
  language: ru
  text: Он сделал пятьдесят петель на одном полотнище и пятьдесят петель на краю полотнища, входившего во вторую соединённую часть; петли располагались одна напротив другой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֻלָאֹת
  choice: петли
  rationale: Обозначает тканевые петли, служившие для соединения полотнищ; это отличает их от отдельных металлических застёжек.
- source_word: יְרִיעָה
  choice: полотнище
  rationale: В описании скинии речь идёт об отдельном большом куске ткани. «Полотнище» точнее передаёт конструктивную функцию, чем бытовое «занавес».
- source_word: בִּקְצֵה
  choice: на краю
  rationale: Передаёт расположение петель вдоль края полотнища, предназначенного для соединения.
- source_word: מַחְבֶּרֶת
  choice: соединённый ряд
  rationale: Слово обозначает образованную соединением группу полотнищ; «соединённый ряд» естественно описывает такую составную секцию и согласуется с контекстом.
- source_word: הַשֵּׁנִית
  choice: втором
  rationale: Сохранено прямое порядковое значение прилагательного.
- source_word: מַקְבִּילֹת
  choice: располагались напротив
  rationale: Причастие выражает взаимное соответствие и расположение петель друг против друга для последующего скрепления.
- source_word: אַחַת אֶל אֶחָת
  choice: одна напротив другой
  rationale: Формулировка сохраняет конкретный пространственный образ исходного выражения и звучит естественно по-русски.
- source_word: עָשָׂה
  choice: сделал
  rationale: Прямой и естественный эквивалент обычного глагола изготовления в данном контексте.
