  text: וַ/יַּ֣עַשׂ לָ֗/הּ אַרְבָּעָה֙ עַמּוּדֵ֣י שִׁטִּ֔ים וַ/יְצַפֵּ֣/ם זָהָ֔ב וָוֵי/הֶ֖ם זָהָ֑ב וַ/יִּצֹ֣ק לָ/הֶ֔ם אַרְבָּעָ֖ה אַדְנֵי כָֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/036.yaml
  text: He made for it four pillars of acacia wood and overlaid them with gold[a]; their hooks were of gold[b]; and he cast for them four silver bases.
translation:
  language: ru
  text: Он сделал для неё[a] четыре столба из акации и обложил их золотом; крючки на них были золотыми. Для них он отлил четыре серебряных основания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть для завесы, упомянутой в предыдущем стихе.
    reason: cross_reference
lexical_decisions:
- source_word: עַמּוּדֵי שִׁטִּים
  choice: столба из акации
  rationale: עַמּוּדִים обозначает вертикальные опоры, а שִׁטִּים — древесину акации, употреблявшуюся при сооружении скинии. Такой перевод точен и естественен для современного русского языка.
- source_word: וַיְצַפֵּם
  choice: обложил их золотом
  rationale: В описаниях скинии глагол צפה обозначает покрытие предмета слоем металла; «обложил золотом» — традиционное и понятное обозначение этого действия.
- source_word: וָוֵיהֶם
  choice: крючки на них
  rationale: וָוִים здесь обозначает крепёжные крючки столбов. Добавление «на них» естественно передаёт притяжательный суффикс и устраняет в русском языке неясность выражения «их крючки».
- source_word: אַדְנֵי כָסֶף
  choice: серебряных основания
  rationale: אֲדָנִים — нижние опорные детали, в которые устанавливались столбы. «Основания» ясно передаёт их функцию; возможное «подножия» менее точно для современного читателя.
- source_word: לָהּ
  choice: для неё
  rationale: Женское местоимение единственного числа сохранено и относится к завесе из предыдущего стиха, без избыточного повторения существительного в основном тексте.
- source_word: וַיִּצֹק
  choice: отлил
  rationale: В контексте изготовления серебряных опорных деталей יצק означает литьё металла в форму; «отлил» точно и идиоматично.
