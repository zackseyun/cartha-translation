translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Глагол «сделал» восстановлен из синтаксиса предыдущего стиха, где он управляет продолжением перечня; «также» делает эту связь естественной по-русски. Пунктуация сохраняет последовательность изготовления и покрытия деталей.
