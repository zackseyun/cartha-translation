translation:
  language: ru
  text: Он сделал также для неё пять столбов с крючками; их верхушки и пояски[a] он покрыл золотом, а основания этих пяти столбов были из бронзы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обручи»; возможно также: «соединительные детали». Точная форма этих элементов неизвестна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו חֲמִשָּׁה
  choice: пять столбов для неё
  rationale: עַמּוּד обозначает вертикальную опору, поэтому «столбы» естественно для устройства святилища. Местоименный суффикс соотносится с завесой у входа, упомянутой в предыдущем стихе; по-русски эта связь выражена словами «для неё».
- source_word: וָוֵיהֶם
  choice: с крючками
  rationale: В описаниях скинии וָו обозначает крючки на столбах, служившие для подвешивания ткани. Предлог «с» естественно связывает их со столбами.
- source_word: וְצִפָּה
  choice: покрыл золотом
  rationale: צפה в породе piel обозначает покрытие предмета слоем металла. «Покрыл золотом» ясно и точно передаёт ремесленное действие.
- source_word: רָאשֵׁיהֶם
  choice: верхушки столбов
  rationale: Буквально «их головы»; в данном строительном контексте речь идёт о верхних частях столбов. Повтор существительного устраняет возможную неясность местоимения.
- source_word: חֲשֻׁקֵיהֶם
  choice: их обвязки
  rationale: Редкое слово обозначает охватывающие либо соединяющие элементы столбов. «Обвязки» сохраняет функциональную широту термина и не навязывает точную форму детали; неоднозначность отмечена в сноске.
- source_word: אַדְנֵיהֶם חֲמִשָּׁה
  choice: пять их оснований
  rationale: אֶדֶן в устройстве скинии — основание или гнездо, в которое устанавливался столб. «Основания» понятно современному читателю и не переуточняет конструкцию.
- source_word: נְחֹשֶׁת
  choice: бронза
  rationale: В контексте древней металлической утвари и устройства скинии נְחֹשֶׁת традиционно и уместно передаётся как «бронза», хотя слово может охватывать медь и медные сплавы.
