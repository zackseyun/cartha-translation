revisions:
- from: Он сделал также для неё пять столбов с крючками; верхушки столбов и их обвязки[a] он покрыл золотом, а пять их оснований были из бронзы.
  to: Он сделал также для неё пять столбов с крючками; их верхушки и пояски[a] он покрыл золотом, а основания этих пяти столбов были из бронзы.
  rationale: Заменено только «обвязки» на «пояски», поскольку это более естественное современное обозначение металлических полос или декоративных элементов на столбах. Сноска сохраняет иные возможные понимания редкого еврейского термина. «Основания этих пяти столбов» устраняет тяжеловесный порядок слов без изменения смысла.
