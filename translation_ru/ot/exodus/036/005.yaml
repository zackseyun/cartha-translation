  text: וַ/יֹּאמְרוּ֙ אֶל מֹשֶׁ֣ה לֵּ/אמֹ֔ר מַרְבִּ֥ים הָ/עָ֖ם לְ/הָבִ֑יא מִ/דֵּ֤י הָֽ/עֲבֹדָה֙ לַ/מְּלָאכָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/005.yaml
  text: And they said to Moses[a], “The people are bringing much more than enough for the work of the task that Yahweh commanded to be done.”
translation:
  language: ru
  text: 'Они сказали Моисею: «Народ приносит гораздо больше, чем нужно[a] для выполнения работы, которую повелел совершить Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Народ приносит слишком много для этой работы». Древнееврейское выражение подчёркивает, что приношения превышают необходимое количество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה לֵּאמֹר
  choice: Они сказали Моисею
  rationale: Обычная древнееврейская формула введения прямой речи; לֵאמֹר отдельно не передаётся, поскольку по-русски это было бы избыточно.
- source_word: מַרְבִּים ... לְהָבִיא מִדֵּי
  choice: приносит гораздо больше, чем нужно
  rationale: Сочетание причастия породы hифиль от רבה, инфинитива להביא и выражения מִדֵּי указывает на продолжающееся принесение даров сверх достаточного количества.
- source_word: הָעָם
  choice: народ
  rationale: Естественное собирательное обозначение народа Израиля.
- source_word: הָעֲבֹדָה לַמְּלָאכָה
  choice: для выполнения работы
  rationale: Оба существительных относятся здесь к труду по сооружению святилища. Русская формулировка естественно передаёт цель приносимых материалов, не создавая тяжеловесного сочетания вроде «работа для работы».
- source_word: אֲשֶׁר צִוָּה ... לַעֲשֹׂת אֹתָהּ
  choice: которую повелел совершить
  rationale: Относительное предложение связывает работу с Божьим повелением; «совершить» сохраняет значение выполнения порученного дела.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно присутствующее в древнееврейском тексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому сохраняется личное имя Бога, а не заменяется титулом.
- issue: Степень избыточности приношений
  choice: гораздо больше, чем нужно
  alternative: слишком много
  rationale: Основной текст подчёркивает, что принесённое заметно превышает потребность, не придавая щедрости народа явно отрицательной оценки.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная, без архаичной формулы «говоря». Формулировка сохраняет акцент на продолжающейся щедрости народа и на превышении реальной потребности.
