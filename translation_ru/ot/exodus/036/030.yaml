  text: וְ/הָיוּ֙ שְׁמֹנָ֣ה קְרָשִׁ֔ים וְ/אַדְנֵי/הֶ֣ם כֶּ֔סֶף שִׁשָּׁ֥ה עָשָׂ֖ר אֲדָנִ֑ים שְׁנֵ֤י אֲדָנִים֙ שְׁנֵ֣י אֲדָנִ֔ים תַּ֖חַת הַ/קֶּ֥רֶשׁ הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/030.yaml
  text: 'There were eight frames[a], with their silver bases, sixteen bases: two bases under one frame[b], and two bases under each frame.'
translation:
  language: ru
  text: 'И было восемь брусьев[a], а серебряных оснований[b] под ними — шестнадцать: по два основания под каждым брусом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «досок»; еврейское слово обозначает вертикальные конструктивные элементы скинии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «гнёзд»; речь идёт о металлических опорах, в которые устанавливались брусья.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: И было
  rationale: Сохраняет соединительное וְ и естественно вводит итоговое число элементов в описании устройства скинии.
- source_word: קְרָשִׁים
  choice: брусьев
  rationale: Обозначает вертикальные деревянные конструктивные элементы; «брусья» конкретнее и естественнее по-русски, чем потенциально вводящее в заблуждение «рамы».
- source_word: אַדְנֵיהֶם / אֲדָנִים
  choice: оснований
  rationale: Передаёт металлические опоры, в которые устанавливались брусья; это понятное современное обозначение без излишней технической конкретизации.
- source_word: כֶּסֶף
  choice: серебряных
  rationale: Прямо передаёт материал оснований и естественно согласуется с существительным во множественном числе.
- source_word: שִׁשָּׁה עָשָׂר
  choice: шестнадцать
  rationale: Стандартная передача количественного числительного.
- source_word: שְׁנֵי אֲדָנִים שְׁנֵי אֲדָנִים תַּחַת הַקֶּרֶשׁ הָאֶחָד
  choice: по два основания под каждым брусом
  rationale: Еврейское повторение имеет распределительное значение. Русская конструкция с «по» ясно передаёт, что каждому из восьми брусьев соответствовали два основания, не создавая впечатления, будто речь лишь о двух брусьях.
- source_word: תַּחַת
  choice: под
  rationale: Обычное и точное пространственное обозначение положения опор относительно бруса.
