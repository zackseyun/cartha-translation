  text: They were paired at the bottom[a], and together they were complete up to its top, to the one ring. Thus he did for both of them[c][b], for the two corners.
translation:
  language: ru
  text: Снизу они были подогнаны попарно[a] и вместе полностью соединены[b] до самой вершины одним кольцом. Так он сделал для обеих — для двух углов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соответствовали друг другу» или «были соединены попарно»; еврейское слово подчёркивает взаимное соответствие двух частей конструкции.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «были цельными» или «завершёнными». Еврейское слово может обозначать цельность либо полную завершённость соединения до вершины.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «для двух угловых деталей». Буквально: «для двух углов»; вероятно, имеются в виду угловые доски или рамы.'
    reason: lexical_alternative
