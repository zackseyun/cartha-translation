lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: Форма wayyiqtol от בוא обозначает следующее событие повествования; простое «пришли» естественно передаёт последовательность действий.
- source_word: כָּל הַחֲכָמִים
  choice: все искусные мастера
  rationale: В данном контексте חכמים означает людей, наделённых умением для изготовления скинии, а не просто интеллектуально мудрых; «искусные мастера» ясно передаёт профессиональное мастерство.
- source_word: הָעֹשִׂים
  choice: выполнявшие
  rationale: Причастие выражает продолжавшуюся деятельность; «выполнявшие» естественно сочетается со словом «работу».
- source_word: אֵת כָּל מְלֶאכֶת הַקֹּדֶשׁ
  choice: всю работу для святилища
  rationale: מְלֶאכֶת обозначает труд или изготовление, а הַקֹּדֶשׁ в контексте скинии — святилище. Предлог «для» ясно показывает назначение работы, не превращая выражение в абстрактную «священную работу».
- source_word: אִישׁ אִישׁ
  choice: каждый
  rationale: Повтор существительного образует распределительное выражение со значением «каждый».
- source_word: מִמְּלַאכְתּוֹ אֲשֶׁר הֵמָּה עֹשִׂים
  choice: от той работы, которой занимался
  rationale: 'מִן указывает на уход от выполняемого дела. Хотя הֵמָּה грамматически стоит во множественном числе, распределительное אִישׁ אִישׁ требует в русском индивидуального согласования: «каждый… занимался».'
