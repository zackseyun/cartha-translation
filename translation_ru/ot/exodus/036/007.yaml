  language: ru
  text: Материала[a] было достаточно для выполнения всей работы, и даже осталось с избытком.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «работы». Здесь то же еврейское слово по контексту обозначает материал, приготовленный для работы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּלָאכָה
  choice: Материала
  rationale: Существительное מְלָאכָה обычно означает «работа», но здесь по контексту указывает на принесённые для сооружения материалы; такой перевод делает смысл ясным и естественным по-русски.
- source_word: הָיְתָה דַיָּם
  choice: было достаточно
  rationale: דַּי выражает достаточность, а местоименный суффикс соотносится с упомянутым материалом.
- source_word: לְכָל הַמְּלָאכָה לַעֲשׂוֹת אֹתָהּ
  choice: чтобы выполнить всю работу
  rationale: Передаёт цель и полный объём предстоящей работы без неестественного русского повтора «сделать её».
- source_word: וְהוֹתֵר
  choice: и ещё осталось
  rationale: Форма породы хифиль от יתר указывает на остаток или избыток сверх необходимого; выбранный вариант прямо передаёт наличие излишка.
