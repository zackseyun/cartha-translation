  text: And for the rear of the tabernacle[a], westward, he made six frames.
translation:
  language: ru
  text: А для задней стороны скинии, обращённой на запад, он сделал шесть рам[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «брусьев»; возможно также: «досок». Еврейское слово обозначает конструктивные элементы, точная форма которых не вполне ясна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: А для задней стороны
  rationale: Сочетание союза и предлога вводит следующую деталь устройства. יַרְכְּתֵי обозначает удалённую, заднюю часть; в русском архитектурном контексте естественно передать это как «задняя сторона».
- source_word: הַמִּשְׁכָּן
  choice: скинии
  rationale: «Скиния» — установившееся и понятное русское обозначение святилища в повествовании Исхода.
- source_word: יָמָּה
  choice: обращённой на запад
  rationale: Буквально слово связано с направлением «к морю», но в древнееврейской пространственной ориентации означает «на запад». Такая формулировка ясно связывает направление с задней стороной скинии.
- source_word: עָשָׂה
  choice: он сделал
  rationale: Прямое соответствие обычному глаголу עשה; сохраняет повторяющийся стиль рассказа о сооружении скинии.
- source_word: שִׁשָּׁה
  choice: шесть
  rationale: Прямая передача количественного числительного.
- source_word: קְרָשִׁים
  choice: рам
  rationale: Термин обозначает вертикальные конструктивные элементы скинии. «Рамы» лучше передаёт возможную каркасную функцию, чем традиционные «брусья» или «доски», но точная форма элементов остаётся не вполне определённой.
