base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/017.yaml
  text: He made fifty loops on the edge of the outer curtain in the first set[a], and he made fifty loops on the edge of the curtain of the second set.
translation:
  language: ru
  text: Он сделал пятьдесят петель по краю крайнего полотнища в первой соединённой группе и пятьдесят петель по краю полотнища во второй соединённой группе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у соединения»; еврейское слово может обозначать как само соединение, так и соединённую группу полотнищ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: петли
  rationale: Существительное обозначает тканевые петли, служившие для скрепления полотнищ. Уточнение о цвете отсутствует в данном стихе и поэтому не добавляется.
- source_word: שְׂפַת
  choice: край
  rationale: Буквально «губа»; применительно к полотнищу естественно обозначает его край.
- source_word: יְרִיעָה
  choice: полотнище
  rationale: В описании скинии речь идёт об отдельных больших отрезах ткани; «полотнище» точнее передаёт конструктивный смысл, чем бытовое «занавес».
- source_word: הַקִּיצֹנָה
  choice: крайнее
  rationale: Прилагательное указывает на полотнище, расположенное с краю соединённой группы.
- source_word: בַּמַּחְבָּרֶת
  choice: первого соединённого набора
  rationale: מַחְבָּרֶת обозначает соединение либо образованную соединением группу полотнищ. «Первого» выводится из противопоставления «второму» во второй части стиха и делает структуру понятной по-русски.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: второго набора
  rationale: Выражение указывает на соответствующее полотнище второй соединяемой группы. Краткая формулировка сохраняет параллелизм двух частей стиха.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: он сделал ... и сделал
  rationale: Повтор глагола сохранён, как в еврейском тексте, без стилистического утяжеления.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; техническая лексика описания скинии передана ясно и сдержанно. «Полотнище» и «соединённый набор» помогают различить отдельные части и две их группы, не добавляя отсутствующих в стихе деталей.
