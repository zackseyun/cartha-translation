  text: וַ/יַּ֖עַשׂ אֶת הַ/בְּרִ֣יחַ הַ/תִּיכֹ֑ן לִ/בְרֹ֨חַ֙ בְּ/ת֣וֹךְ הַ/קְּרָשִׁ֔ים מִן הַ/קָּצֶ֖ה אֶל הַ/קָּצֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/033.yaml
  text: He made the middle bar to pass through the midst of the boards from end to end[a][b].
translation:
  language: ru
  text: Он сделал среднюю перекладину, чтобы она проходила внутри рам от одного края до другого[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…чтобы она тянулась посреди рам от края до края».'
    reason: Лִבְרֹחַ в данном строительном контексте может описывать как прохождение перекладины, так и её протяжённость; בְּתוֹךְ допускает переводы «внутри» и «посреди».
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Форма wayyiqtol от עשה продолжает повествование и естественно передаётся русским прошедшим временем; начальное «и» в данном контексте можно опустить без потери смысла.
- source_word: הַבְּרִיחַ
  choice: перекладину
  rationale: בְּרִיחַ здесь обозначает горизонтальный конструктивный элемент, скрепляющий рамы; «перекладина» точнее и естественнее в современном русском, чем многозначное «засов».
- source_word: הַתִּיכֹן
  choice: среднюю
  rationale: Прилагательное указывает на среднее или центральное положение перекладины; «среднюю» прямо сохраняет пространственный смысл.
- source_word: לִבְרֹחַ
  choice: чтобы она проходила
  rationale: В строительном контексте инфинитив описывает прохождение или протяжённость перекладины через конструкцию, а не бегство; русская целевая конструкция естественно передаёт לְ с инфинитивом.
- source_word: בְּתוֹךְ
  choice: внутри
  rationale: Предлог указывает на нахождение или прохождение в середине, во внутреннем пространстве рам; «внутри» сохраняет эту пространственную характеристику без излишней конкретизации устройства.
- source_word: הַקְּרָשִׁים
  choice: рам
  rationale: В описании скинии קֶרֶשׁ обозначает стоячие деревянные конструктивные элементы; «рамы» передаёт их строительную функцию и соответствует современному употреблению.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: от одного края до другого
  rationale: Эта формула обозначает полную протяжённость по всей конструкции; выбранный оборот ясен и естественен по-русски.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной строительной терминологией. Синтаксис простой и повествовательный; сохранена неоднозначность описания того, проходила ли перекладина внутри рам или тянулась посреди них.
