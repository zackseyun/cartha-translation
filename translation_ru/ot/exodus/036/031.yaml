lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Форма wayyiqtol продолжает последовательное повествование; по-русски связь естественно передаётся без обязательного начального союза.
- source_word: בְּרִיחֵי
  choice: перекладин
  rationale: В устройстве скинии это горизонтальные элементы, соединяющие вертикальные брусья; «перекладины» ясно передаёт их форму и назначение.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Сочетание обозначает материал из акациевого дерева; формулировка точна и естественна для описания сооружения.
- source_word: חֲמִשָּׁה
  choice: пять
  rationale: Количественное числительное, относящееся к перекладинам.
- source_word: לְקַרְשֵׁי
  choice: для брусьев
  rationale: קֶרֶשׁ обозначает вертикальные несущие элементы скинии. «Брусья» естественно описывает массивные деревянные детали, не сводя их к тонким доскам.
- source_word: צֶלַע
  choice: стороны
  rationale: В архитектурном контексте слово означает боковую сторону сооружения.
- source_word: הַמִּשְׁכָּן
  choice: скинии
  rationale: «Скиния» — укоренившееся и точное русское обозначение переносного святилища в Исходе.
- source_word: הָאֶחָת
  choice: одной
  rationale: Форма женского рода согласуется со «стороной» и выделяет одну из сторон, не выражая порядкового значения «первая».
