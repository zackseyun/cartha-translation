  yaml_path: translation/ot/exodus/036/024.yaml
  text: And he made forty silver bases under the twenty frames, two bases under the one frame for its two tenons, and two bases under the other frame for its two tenons.
translation:
  language: ru
  text: 'И сделал он сорок серебряных оснований под двадцать брусьев: два основания под одним брусом — для двух его шипов, и два основания под другим брусом — для двух его шипов.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְנֵי / אֲדָנִים
  choice: основания
  rationale: В контексте устройства скинии это серебряные опорные гнёзда под брусьями; «основания» естественно и достаточно точно передаёт их функцию.
- source_word: הַקְּרָשִׁים / הַקֶּרֶשׁ
  choice: брусья / брус
  rationale: Слово обозначает жёсткие деревянные элементы конструкции; «брус» сохраняет предметность и привычно для современного русского описания сооружения.
- source_word: יְדֹתָיו
  choice: его шипов
  rationale: Буквально «руки», но здесь речь о двух выступах бруса, входящих в серебряные основания; техническое «шипы» ясно передаёт конструктивную функцию.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: одним ... другим
  rationale: Во втором случае еврейское «один» идиоматически соотносит два основания с каждым следующим брусом; русское «другим» избегает неестественного повтора, не меняя смысла.
