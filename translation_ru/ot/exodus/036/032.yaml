  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the tabernacle at the far rear on the west.
translation:
  language: ru
  text: и пять перекладин для брусьев второй стороны скинии, и пять перекладин для брусьев скинии в её дальней задней части, обращённой к западу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְרִיחִם
  choice: перекладин
  rationale: В описании скинии слово обозначает горизонтальные элементы, скрепляющие брусья; «перекладины» ясно передаёт их конструктивную функцию и естественно звучит по-русски.
- source_word: קַרְשֵׁי
  choice: брусьев
  rationale: Кֶרֶשׁ обозначает деревянные несущие элементы скинии. «Брусья» сохраняет предметность исходного слова, не навязывая спорную реконструкцию в виде рам.
- source_word: צֶלַע הַמִּשְׁכָּן הַשֵּׁנִית
  choice: второй стороны скинии
  rationale: Перевод сохраняет буквальное значение הַשֵּׁנִית «вторая» и последовательность перечисления, не заменяя его более свободным «другая».
- source_word: הַמִּשְׁכָּן
  choice: скинии
  rationale: «Скиния» — устоявшееся и понятное в библейском контексте обозначение переносного святилища; оно точнее идентифицирует предмет, чем общее «жилище».
- source_word: לַיַּרְכָתַיִם
  choice: у её дальнего заднего края
  rationale: Формулировка передаёт одновременно заднее положение и оттенок удалённости, присущий יַרְכָתַיִם, не сводя его просто к «задней стороне».
- source_word: יָמָּה
  choice: к западу
  rationale: В данном описании направления יָמָּה означает «к западу»; буквальная этимологическая передача «к морю» здесь могла бы ввести читателя в заблуждение.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: и пять ... и пять
  rationale: Повтор союза сохранён ради характерного для исходного текста перечислительного ритма.
theological_decisions: []
