base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/002.yaml
  text: Then Moses called Bezalel and Oholiab and every wise-hearted man in whose heart Yahweh had put wisdom[b][a], everyone whose heart stirred him to come to the work to do it.
translation:
  language: ru
  text: И призвал Моисей Веселеила, Аголиава и всех мудрых сердцем[a], в чьи сердца Яхве вложил мудрость, — всех, кого сердце побуждало[b] приступить к работе, чтобы исполнять её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мудрых сердцем». Здесь имеются в виду люди, наделённые мудростью и умением, необходимыми для работы.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение буквально говорит о тех, чьё сердце «подняло» их, то есть побудило добровольно взяться за дело.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: призвал
  rationale: Глагол קרא с אֶל здесь означает призыв людей к порученному делу; «призвал» естественно и несколько торжественнее, чем «позвал».
- source_word: בְּצַלְאֵל וְאֶל אָהֳלִיאָב
  choice: Веселеила, Аголиава
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён, понятные современному читателю.
- source_word: כָּל אִישׁ חֲכַם לֵב
  choice: всех мудрых сердцем
  rationale: Сохранён еврейский образ «мудрый сердцем»; в данном контексте он включает дарованное Богом умение и искусность.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה בְּלִבּוֹ
  choice: в чьи сердца Яхве вложил мудрость
  rationale: Переданы как источник мудрости — Яхве, так и библейское представление о сердце как средоточии разумения и способности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: כֹּל אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: всех, кого сердце побуждало
  rationale: Идиома буквально говорит о сердце, которое «подняло» человека; по смыслу это внутреннее побуждение и добровольная готовность.
- source_word: לְקָרְבָה אֶל הַמְּלָאכָה
  choice: приступить к работе
  rationale: В контексте קרב обозначает приближение с целью участия; русское «приступить к работе» естественно выражает включение в порученное дело.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: и выполнить её
  rationale: Местоимение относится к работе; «выполнить её» по-русски естественнее буквального «сделать её» и сохраняет целевой смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет его отличие от титула.
- issue: Природа мудрости ремесленников
  choice: Яхве вложил мудрость в их сердца
  alternative: Яхве сделал их искусными
  rationale: Сохранена прямая атрибуция дара Богу и образ сердца, без сведения חָכְמָה исключительно к техническому мастерству.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены образы сердца и богоданной мудрости; громоздкое повторение еврейских конструкций смягчено тире и естественным русским синтаксисом.
