  yaml_path: translation/ot/exodus/036/034.yaml
  text: He overlaid the frames with gold[a], and made their rings of gold as holders for the bars[b], and overlaid the bars with gold.
translation:
  language: ru
  text: Он покрыл рамы золотом[a], сделал их кольца из золота — держателями для перекладин[b] — и покрыл перекладины золотом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «брусья». Еврейское слово обозначает деревянные элементы конструкции скинии.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «домами для перекладин», то есть местами или приспособлениями, в которые вставлялись перекладины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: рамы
  rationale: В описании скинии слово обозначает вертикальные деревянные элементы конструкции. «Рамы» ясно передаёт их несущую функцию; традиционный вариант «брусья» отмечен в сноске.
- source_word: צִפָּה / וַיְצַף
  choice: покрыл
  rationale: Глагол обозначает покрытие предмета слоем другого материала. В сочетании с золотом естественное современное русское выражение — «покрыл золотом».
- source_word: זָהָב
  choice: золото / золотой
  rationale: Прямое обозначение материала. Троекратное упоминание золота в еврейском тексте смыслово сохранено, хотя во втором случае использована естественная русская предикативная форма «золотыми».
- source_word: טַבְּעֹתָם
  choice: их кольца
  rationale: Существительное означает кольца, принадлежавшие рамам; местоименный суффикс передан словом «их».
- source_word: עָשָׂה
  choice: сделал
  rationale: Обычный и точный русский эквивалент общего глагола со значением «делать, изготовлять».
- source_word: בָּתִּים
  choice: держателями
  rationale: Буквально «домами»; здесь метафорически обозначает места или приспособления, в которые входили перекладины. «Держателями» передаёт функцию без неестественного буквализма.
- source_word: לַבְּרִיחִם
  choice: для перекладин
  rationale: Речь о горизонтальных элементах, скреплявших вертикальные рамы; «перекладины» точно и понятно передаёт их конструктивную функцию.
