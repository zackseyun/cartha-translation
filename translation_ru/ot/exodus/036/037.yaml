lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: И сделал он
  rationale: Последовательная форма с וַ передаёт продолжение повествования; такой порядок слов естественен для современного литературного русского языка и сохраняет связность рассказа.
- source_word: מָסָךְ
  choice: полог[a]
  rationale: Слово обозначает тканое заграждение у входа. «Полог» естественно передаёт назначение предмета и помогает отличить его от внутренней завесы, называемой פָּרֹכֶת.
- source_word: לְפֶתַח הָאֹהֶל
  choice: для входа в шатёр
  rationale: פֶּתַח означает вход или проём, а אֹהֶל — шатёр. Перевод не подменяет обычное слово «шатёр» более специальным термином «скиния».
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: из голубой, пурпурной и алой пряжи
  rationale: Цветовые термины в данном контексте обозначают окрашенный текстильный материал; добавление «пряжи» ясно выражает этот подразумеваемый смысл по-русски.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: из кручёного тонкого льна
  rationale: Перевод сохраняет и качество льняного материала (שֵׁשׁ), и указание на его скручивание (מָשְׁזָר).
- source_word: מַעֲשֵׂה רֹקֵם
  choice: работы вышивальщика
  rationale: Формулировка близко передаёт конструкцию оригинала и указывает на искусную вышивальную работу, не смешивая её с иными видами тканья.
