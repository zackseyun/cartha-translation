  text: Two tenons for each board[a], joined one to another[b]; thus he made all the boards of the tabernacle.
translation:
  language: ru
  text: По два шипа у каждой доски[a], соединённые один с другим[b]; так он сделал все доски скинии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально «руки»: обычное еврейское слово «руки» здесь образно обозначает выступающие соединительные части каждой доски.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «расположенные один напротив другого» — с акцентом на соответствующее расположение двух шипов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי יָדֹת
  choice: по два шипа
  rationale: Буквально «две руки»; в строительном контексте это выступающие соединительные части досок. «Шипы» — точный и понятный русский столярный термин, а конструкция «по два» естественно передаёт распределительное значение.
- source_word: קֶּרֶשׁ
  choice: доска
  rationale: Обозначает отдельный деревянный конструктивный элемент скинии; «доска» ясно и последовательно передаёт предмет в данном контексте.
- source_word: מְשֻׁלָּבֹת
  choice: соединённые
  rationale: Причастие описывает согласованное взаимное устройство двух шипов. «Соединённые» сохраняет общий строительный смысл, не уточняя сверх текста способ соединения.
- source_word: אַחַת אֶל אֶחָת
  choice: один с другим
  rationale: Фраза выражает взаимное соответствие двух элементов; русский оборот сохраняет эту связь, тогда как возможное пространственное значение отмечено в сноске.
- source_word: כֵּן עָשָׂה
  choice: так он сделал
  rationale: Прямо передаёт указание на одинаковый способ изготовления всех досок.
- source_word: מִּשְׁכָּן
  choice: скиния
  rationale: Устоявшееся русское библейское название переносного святилища; оно точно и узнаваемо в контексте Исхода.
