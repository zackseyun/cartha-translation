base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/011.yaml
  text: He made loops of blue yarn on the edge of the first curtain at the end of the first set joined together[a]; likewise he made them on the edge of the outermost curtain in the second set joined together.
translation:
  language: ru
  text: Он сделал петли из синей пряжи на краю первого полотнища, на конце первого соединения[a]; так же он сделал их на краю крайнего полотнища во втором соединении.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у места соединения»; еврейское слово может обозначать само соединение, место соединения или соединённую группу полотнищ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: петли
  rationale: Существительное обозначает матерчатые петли, служившие для скрепления полотнищ; «петли» — прямой и естественный русский эквивалент.
- source_word: תְּכֵלֶת
  choice: синяя пряжа
  rationale: В описаниях скинии слово обозначает окрашенный синий текстильный материал; поскольку из него изготовлены петли, «синяя пряжа» ясно передаёт предметный смысл.
- source_word: שְׂפַת
  choice: край
  rationale: Буквально «губа»; здесь речь идёт о крае полотнища, поэтому выбран обычный современный термин.
- source_word: הַיְרִיעָה
  choice: полотнище
  rationale: В данном контексте יְרִיעָה — отдельная часть тканого покрытия скинии. «Полотнище» точнее передаёт конструктивную функцию, чем бытовое «занавес».
- source_word: הָאֶחָת
  choice: первое
  rationale: Форма буквально означает «одно», но в парной конструкции с הַשֵּׁנִית («второе») имеет порядковое значение.
- source_word: מִקָּצָה
  choice: на конце
  rationale: Предложная форма указывает на крайнее положение полотнища в соединённой группе.
- source_word: בַּמַּחְבָּרֶת
  choice: в соединённом полотне
  rationale: מַחְבֶּרֶת может обозначать соединение либо образованную соединением совокупность полотнищ. В контексте изготовления скинии естественно передать эту совокупность как «соединённое полотно», сохранив альтернативу в сноске.
- source_word: כֵּן עָשָׂה
  choice: такие же петли он сделал
  rationale: Фраза выражает соответствующее, повторное действие; явное восстановление дополнения делает русский текст ясным.
- source_word: הַקִּיצוֹנָה
  choice: крайнее
  rationale: Прилагательное указывает на полотнище, расположенное с внешнего края группы.
- source_word: הַשֵּׁנִית
  choice: второе
  rationale: Явно обозначает вторую из двух соединённых групп полотнищ.
