base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/009.yaml
  text: The length of each curtain was twenty-eight cubits[a], and the width of each curtain was four cubits[b]; all the curtains had one measurement.
translation:
  language: ru
  text: Длина каждого полотнища составляла двадцать восемь локтей, а ширина каждого полотнища — четыре локтя; все полотнища были одного размера.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרֶךְ
  choice: длина
  rationale: Обычное обозначение продольного размера предмета; естественно сочетается с «шириной».
- source_word: יְרִיעָה
  choice: полотнище
  rationale: В данном контексте слово обозначает отдельный большой отрез ткани, из которого составлялось покрытие скинии. «Полотнище» точнее передаёт эту функцию, чем более узкое по смыслу «занавес».
- source_word: הָאַחַת / הָאֶחָת
  choice: каждого
  rationale: Буквально «одного», однако в формуле, где задаются размеры всех отдельных полотнищ, слово имеет распределительное значение.
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: двадцать восемь
  rationale: Прямая передача числительного в современном русском порядке слов.
- source_word: אַמָּה
  choice: локтей
  rationale: Сохранена древнееврейская единица длины без приблизительного пересчёта в современные единицы.
- source_word: רֹחַב
  choice: ширина
  rationale: Стандартное обозначение поперечного размера, соответствующее еврейскому слову.
- source_word: אַרְבַּע
  choice: четыре
  rationale: Прямая передача числительного.
- source_word: מִדָּה אַחַת
  choice: одного размера
  rationale: Буквально «одна мера»; в контексте одинаковых длины и ширины естественное русское выражение «одного размера» ясно передаёт единообразие всех полотнищ.
- source_word: לְכָל הַיְרִיעֹת
  choice: все полотнища
  rationale: 'Передаёт полный охват: указанные одинаковые размеры относились ко всем полотнищам.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной метрической формулировкой. Во второй части предложения опущено повторение «каждого полотнища», поскольку по-русски оно избыточно, а его смысл однозначно сохраняется. Точка с запятой отражает переход от размеров отдельного полотнища к обобщению обо всех полотнищах.
