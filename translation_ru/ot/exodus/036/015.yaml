- source_word: אַמָּה
  choice: локоть
  rationale: Традиционное и понятное обозначение древней меры длины; сохраняет единицу оригинала без приблизительного пересчёта.
- source_word: מִדָּה אַחַת
  choice: одной меры
  rationale: Передаёт буквальный образ оригинала и указывает на одинаковые размеры всех одиннадцати полотнищ.
