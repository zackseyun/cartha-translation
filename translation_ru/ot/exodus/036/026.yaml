lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: и сорок
  rationale: Союз продолжает перечень деталей конструкции, а числительное передано прямо.
- source_word: אַדְנֵי/הֶם כָּסֶף
  choice: сорок серебряных оснований для них
  rationale: אֲדָנִים обозначает опорные основания рам; суффикс выражает их соотнесённость с рамами. Определение «серебряных» естественно передаёт материал.
- source_word: שְׁנֵי אֲדָנִים
  choice: два основания
  rationale: Повторяющееся выражение переведено одинаково и в согласии с первым употреблением существительного.
- source_word: תַּחַת
  choice: под
  rationale: Предлог указывает на расположение оснований под каждой рамой.
- source_word: הַ/קֶּרֶשׁ
  choice: раму
  rationale: В контексте скинии קֶרֶשׁ — вертикальный конструктивный элемент; «рама» передаёт его функцию яснее, чем традиционная «доска», не устраняя лексической альтернативы.
- source_word: הָ/אֶחָד
  choice: одну
  rationale: Еврейский текст в обеих частях дословно повторяет «одну раму»; повтор сохранён, а не заменён выражением «другую раму».
