base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/001.yaml
  text: And Bezalel and Oholiab[a], and every skillful man in whom Yahweh has put wisdom and understanding to know how to do all the work for the service of the sanctuary[c][b], shall do according to all that Yahweh has commanded.
translation:
  language: ru
  text: Веселеил, Аголиав и каждый искусный мастер[a] — все, кого Яхве наделил мудростью и разумением[b], чтобы они умели выполнить всю работу для служения в святилище[c], — сделают всё в точности так, как повелел Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждый человек, мудрый сердцем»; здесь это выражение означает искусного работника.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в них Яхве дал мудрость и разумение»; еврейское местоимение стоит во множественном числе и относится к Веселеилу, Аголиаву и всем названным искусным мастерам.'
    reason: grammatical_clarification
  - marker: c
    text: 'Возможно также: «всю работу служения святилища».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: сделают
  rationale: Единственное число сказуемого в еврейском при составном ряде деятелей естественно передаётся по-русски множественным числом; форма в данном контексте выражает предстоящее исполнение повеления.
- source_word: בְצַלְאֵל וְאָהֳלִיאָב
  choice: Веселеил, Аголиав
  rationale: Использованы устоявшиеся русские библейские формы личных имён, остающиеся понятными современному читателю.
- source_word: וְכֹל אִישׁ חֲכַם לֵב
  choice: и каждый искусный мастер
  rationale: Буквально «каждый человек, мудрый сердцем»; в контексте изготовления святилища идиома обозначает умелого, искусного работника. «Мастер» естественно передаёт практическую направленность выражения.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה וּתְבוּנָה בָהֵמָּה
  choice: которого Яхве наделил мудростью и разумением
  rationale: «Наделил» естественно выражает נתן в значении дарования способности. Еврейское בָהֵמָּה — множественное «в них» — относится ко всем названным людям; русское единственное согласовано распределительно с «каждый».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: לָדַעַת לַעֲשֹׂת
  choice: чтобы он знал, как выполнить
  rationale: Передаёт практическое знание и умение, выраженное сочетанием инфинитивов, естественным современным русским оборотом.
- source_word: כָּל מְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: всю работу для служения в святилище
  rationale: Сохраняет различие между «работой» и «служением», а הַקֹּדֶשׁ понимается конкретно как святилище; синтаксическая связь допускает и более буквальное «всю работу служения святилища».
- source_word: לְכֹל אֲשֶׁר צִוָּה יְהוָה
  choice: всё так, как повелел Яхве
  rationale: Предлог ל выражает соответствие порученной работе Божьему повелению; русская конструкция ясно и естественно передаёт этот смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя; транслитерация «Яхве» сохраняет его как имя и не смешивает с титулом.
- issue: Значение אִישׁ חֲכַם לֵב
  choice: каждый искусный мастер
  alternative: каждый мужчина, мудрый сердцем; каждый искусный человек
  rationale: Ремесленный контекст указывает на Богом данное мастерство. Перевод не превращает «мудрость» в отвлечённое нравственное качество, но сноска сохраняет буквальный образ.
- issue: Число местоимения בָהֵמָּה
  choice: распределительное единственное «которого» при слове «каждый»
  alternative: «которых Яхве наделил»
  rationale: Еврейское множественное число охватывает Веселеила, Аголиава и всех искусных мастеров; русское согласование с «каждый» естественно, а коллективный смысл отмечен в сноске.
- issue: Синтаксис כָּל מְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: всю работу для служения в святилище
  alternative: всю работу служения святилища
  rationale: Выбран ясный современный вариант без устранения возможной более тесной родительной связи; альтернатива вынесена в сноску.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Устоявшиеся формы имён «Веселеил» и «Аголиав» сочетаются с прямой передачей имени «Яхве». Буквальная идиома «мудрый сердцем» разъяснена в сноске, а в основном тексте употреблено естественное для ремесленного контекста «искусный мастер».
