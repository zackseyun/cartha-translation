  yaml_path: translation/ot/exodus/036/013.yaml
  text: And he made fifty gold clasps[a], and joined the curtains to one another with the clasps, so that the tabernacle became one.
translation:
  language: ru
  text: Он сделал пятьдесят золотых застёжек и соединил ими полотнища одно с другим, так что скиния стала единым целым.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и скиния была едина». Еврейский текст допускает более буквальный перевод; вариант «стала единым целым» яснее выражает результат соединения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Обычное значение עשה — «делать, изготовлять»; в данном контексте естественно современное «сделал».
- source_word: חֲמִשִּׁים קַרְסֵי זָהָב
  choice: пятьдесят золотых застёжек
  rationale: קֶרֶס обозначает соединительную деталь для скрепления полотнищ. «Застёжки» передаёт функцию, не уточняя без достаточных оснований их форму.
- source_word: וַיְחַבֵּר אֶת הַיְרִעֹת אַחַת אֶל אַחַת בַּקְּרָסִים
  choice: и соединил ими полотнища одно с другим
  rationale: חבר означает «соединять»; ב инструментально указывает на средство соединения. «Полотнища» точнее обозначает составные тканевые части покрытия, чем бытовое «занавеси».
- source_word: וַיְהִי הַמִּשְׁכָּן אֶחָד
  choice: так что скиния стала единым целым
  rationale: 'Фраза описывает результат соединения: скиния образовала одно целое. «Скиния» — укоренившийся русский термин для מִשְׁכָּן в Исходе.'
theological_decisions:
- issue: Смысл связи в וַיְהִי הַמִּשְׁכָּן אֶחָד
  choice: 'Передать как результат: «так что скиния стала единым целым»'
  alternative: «и скиния была едина»
  rationale: Последовательность действий позволяет понимать заключительную клаузу как достигнутый результат, однако более формальное сочинительное прочтение сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с традиционным библейским термином «скиния». Формулировка ясная и достойная, без архаической синтаксической тяжеловесности; маркер сноски помещён непосредственно в основном тексте.
