  yaml_path: translation/ot/exodus/017/016.yaml
  text: And he said[a], “A hand is upon the throne of Yah; Yahweh will have war with Amalek from generation to generation.”
translation:
  language: ru
  text: 'И он сказал: «Рука на престоле Яха[a]. Яхве будет воевать с Амаликом из поколения в поколение».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза трудна и эллиптична; буквально: «Рука на престоле Яха». Её также можно понять как «рука против престола Яха» или, что менее вероятно, истолковать כֵּס как «знамя».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И он сказал
  rationale: Стандартное продолжение повествования; мужской субъект в еврейском тексте не назван повторно.
- source_word: כִּי
  choice: не передано отдельно
  rationale: Частица вводит содержание речи; отдельное «ибо» или «потому что» при неясной эллиптической конструкции неоправданно уточнило бы синтаксическую связь.
- source_word: יָד
  choice: рука
  rationale: Существительное без артикля оставлено без уточнения принадлежности, чтобы сохранить краткость и неопределённость исходной фразы.
- source_word: עַל
  choice: на
  rationale: Передаёт основное пространственное значение предлога; возможное значение «против» отмечено в сноске.
- source_word: כֵּס
  choice: престол
  rationale: Вероятнее всего, это сокращённая или дефектная форма слова «престол»; толкование «знамя» лексически менее вероятно.
- source_word: יָהּ
  choice: Ях
  rationale: Сохранена краткая форма Божьего имени, отличная от полного имени יהוה; в сочетании употреблена форма родительного падежа «Яха».
- source_word: מִלְחָמָה לַיהוָה
  choice: У Яхве — война
  rationale: Именная конструкция передана без добавления глагола «будет воевать», сохраняя принадлежность войны Яхве и допускаемый контекстом продолжающийся или будущий смысл.
- source_word: בַּעֲמָלֵק
  choice: с Амаликом
  rationale: Предлог ב в контексте войны обозначает враждебное противостояние; по-русски естественно «война с Амаликом».
- source_word: מִדֹּר דֹּר
  choice: из поколения в поколение
  rationale: Прозрачно передаёт продолжительность противостояния на протяжении сменяющихся поколений.
theological_decisions:
- issue: Передача יָהּ и יהוה в одном стихе
  choice: Ях и Яхве
  alternative: передать оба имени как «Господь»
  rationale: Исходный текст намеренно использует сначала краткую форму имени, а затем тетраграмматон; различие сохранено.
- issue: Неясная фраза כִּי יָד עַל כֵּס יָהּ
  choice: Рука на престоле Яха
  alternative: Рука против престола Яха; рука на знамени Яха
  rationale: Буквально-консервативная передача сохраняет эллиптичность и подлинную неоднозначность текста, не превращая её без достаточных оснований в клятву, нападение или указание на знамя.
translation_notes:
  register: Современный литературный русский язык с намеренно сохранённой краткостью первой фразы. Тире в выражении «У Яхве — война» поддерживает именной характер еврейской конструкции и делает её понятной без избыточного толкования.
