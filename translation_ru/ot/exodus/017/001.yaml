base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/001.yaml
  text: Then the whole congregation of the sons of Israel set out from the wilderness of Sin by stages[a], according to the command of Yahweh, and camped at Rephidim[b]; but there was no water for the people to drink.
translation:
  language: ru
  text: И вся община сынов Израиля отправилась из пустыни Син, двигаясь от стоянки к стоянке[a], по повелению Яхве[b], и разбила лагерь в Рефидиме. Но у народа не было воды для питья.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по своим переходам»; то есть они двигались последовательными этапами, от одной стоянки к другой.'
    reason: lexical_alternative
  - marker: b
    text: Яхве — личное имя Бога; в ряде переводов оно традиционно передаётся словом «Господь». Выражение «по повелению» буквально означает «по устам».
    reason: divine_name_and_idiom
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: отправилось
  rationale: В повествовании о странствии נסע означает сняться со стоянки и двинуться дальше; «отправилось» естественно передаёт начало движения.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: всё общество сынов Израиля
  rationale: עֵדָה обозначает собранную общину как единое целое, а традиционно понятное «сыны Израиля» сохраняет форму еврейского выражения.
- source_word: מִמִּדְבַּר סִין
  choice: из пустыни Син
  rationale: מִדְבָּר здесь — пустынная местность; Син является географическим названием и передаётся транслитерацией.
- source_word: לְמַסְעֵיהֶם
  choice: переходя от стоянки к стоянке
  rationale: Множественное מַסָּע обозначает последовательные этапы пути или переходы; развёрнутая русская формулировка ясно передаёт поэтапность движения.
- source_word: עַל פִּי יְהוָה
  choice: по повелению Яхве
  rationale: Буквально «по устам Яхве» — устойчивое выражение со значением действия согласно его повелению или указанию.
- source_word: וַיַּחֲנוּ בִּרְפִידִים
  choice: расположилось станом в Рефидиме
  rationale: חנה означает разбить или расположить стан; форма единственного числа согласуется с собирательным «общество». Название места передано как «Рефидим».
- source_word: וְאֵין מַיִם לִשְׁתֹּת הָעָם
  choice: Но там не было воды, чтобы народу пить
  rationale: Союз ו по контексту имеет противительное значение, а инфинитивная конструкция указывает, что воды для питья народу не было.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, тетраграмматон. «Яхве» передаёт его как имя, не заменяя титулом; примечание сообщает о традиционной замене.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет последовательность еврейского повествования, но избегает неестественных калек; подлинное имя Яхве оставлено в основном тексте.
