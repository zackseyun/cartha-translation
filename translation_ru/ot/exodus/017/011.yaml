  text: И всякий раз, когда Моисей поднимал руку[a], Израиль одерживал верх; а всякий раз, когда он опускал руку[b], верх одерживал Амалик.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Моисей поднимал руку… когда опускал руку». Еврейскую конструкцию можно передать простым «когда», однако контекст указывает на повторявшееся во время битвы действие.'
    reason: lexical_alternative
  - marker: b
    text: Глагол, переведённый как «опускал», может также означать «давал покой» или «давал отдых». В противопоставлении словам «поднимал руку» он здесь естественно означает, что Моисей опускал руку.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כַאֲשֶׁר
  choice: И всякий раз, когда
  rationale: Сочетание וְהָיָה с כַאֲשֶׁר в данном повествовательном контексте обозначает повторявшееся во время битвы обстоятельство; такая передача естественно выражает итеративность.
- source_word: יָרִים
  choice: поднимал
  rationale: Hiphil глагола רום означает «поднимать». Несовершенный вид в русском языке уместно передаёт повторяющееся действие, не добавляя не выраженной прямо длительности.
- source_word: יָדוֹ
  choice: руку
  rationale: יָד буквально означает «рука»; контекст не требует заменять её словом «руки» или уточнять «рука вверх».
- source_word: וְגָבַר
  choice: одолевал
  rationale: גבר обозначает превосходство в силе или успех в борьбе. «Одолевал» естественно для военного контекста и не подразумевает окончательной победы.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Традиционная русская форма имени народа.
- source_word: וְכַאֲשֶׁר
  choice: а когда
  rationale: Союз «а» ясно выражает противопоставление двух повторяющихся ситуаций; итеративность второй части сохраняется из параллельной конструкции первой.
- source_word: יָנִיחַ
  choice: опускал
  rationale: Hiphil глагола נוח может означать «давать покой», «оставлять» или «опускать». В прямом контрасте с «поднимал руку» наиболее естественно «опускал».
- source_word: עֲמָלֵק
  choice: Амалик
  rationale: Традиционная русская библейская форма этнонима/имени.
