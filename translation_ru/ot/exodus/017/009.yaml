base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/009.yaml
  text: And Moses said to Joshua[a], “Choose men for us and go out; fight against Amalek. Tomorrow I will stand on the top of the hill[b], with the staff of God in my hand.”
translation:
  language: ru
  text: 'И сказал Моисей Иисусу Навину: «Выбери для нас людей и выступи на бой с Амаликом. Завтра я встану на вершине холма[a] с посохом Божьим в моей руке».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на голове холма», то есть на его вершине.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Обычная передача повествовательной формы wayyiqtol, сохраняющая последовательное развитие рассказа без излишнего уточнения временного оттенка.
- source_word: יְהוֹשֻׁעַ
  choice: Иисусу Навину
  rationale: Использовано устойчивое русское библейское именование, которое ясно отличает этого Иисуса от других носителей имени.
- source_word: בְּחַר לָנוּ אֲנָשִׁים
  choice: Выбери для нас людей
  rationale: Точно передаёт значение «выбрать» и дательный оборот «для нас»; «людей» в данном военном контексте подразумевает мужчин, способных участвовать в сражении, без добавления отсутствующего в тексте слова «воинов».
- source_word: וְצֵא הִלָּחֵם בַּעֲמָלֵק
  choice: и выступи на бой с Амаликом
  rationale: Естественная русская военная формулировка передаёт как выход навстречу противнику, так и повеление сражаться. «Амалик» сохранён как коллективное имя народа в соответствии с формой исходного текста.
- source_word: מָחָר
  choice: Завтра
  rationale: Прямо передаёт вынесенное вперёд обстоятельство времени.
- source_word: אָנֹכִי נִצָּב
  choice: я встану
  rationale: Причастная форма в сочетании с «завтра» имеет будущее значение; «встану» естественно передаёт занятие указанного места.
- source_word: עַל רֹאשׁ הַגִּבְעָה
  choice: на вершине холма
  rationale: Идиоматически передаёт буквальное «на голове холма», сохраняя образ возвышенного места.
- source_word: וּמַטֵּה הָאֱלֹהִים בְּיָדִי
  choice: с посохом Божьим в руке
  rationale: Присоединяет безглагольную заключительную фразу к положению Моисея как обстоятельство и сохраняет устойчивое обозначение посоха в книге Исход.
theological_decisions:
- issue: Передача הָאֱלֹהִים в сочетании מַטֵּה הָאֱלֹהִים
  choice: посох Божий
  alternative: посох Бога
  rationale: Форма «посох Божий» естественна для современного литературного русского языка, сохраняет определённость и конструктивную связь исходного текста и не привносит дополнительных богословских оттенков.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан ясным и естественным, при этом сохранены последовательность повелений, коллективное имя «Амалик» и образ Моисея с Божьим посохом.
