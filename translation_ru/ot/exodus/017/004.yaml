base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/004.yaml
  text: So Moses cried out to Yahweh[a], saying, “What shall I do with this people? A little more, and they will stone me!”
translation:
  language: ru
  text: 'И воззвал Моисей к Яхве: «Что мне делать с этим народом? Ещё немного — и они побьют меня камнями![a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский оборот: «ещё немного — и побьют меня камнями»; он подчёркивает непосредственную близость угрозы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: воззвал
  rationale: Глагол צעק обозначает сильный крик о помощи, вызванный бедой или страхом. «Воззвал» естественно сочетается с обращением к Богу и передаёт настоятельность мольбы, не превращая её в нейтральную речь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: לֵאמֹר
  choice: не выражено отдельным словом
  rationale: В русском языке прямая речь после глагола «воззвал» естественно передаёт функцию вводного לֵאמֹר; буквальное «говоря» было бы тяжеловесным гебраизмом.
- source_word: מָה אֶעֱשֶׂה
  choice: Что мне делать
  rationale: Форма выражает срочный вопрос Моисея о том, как ему поступить; русский оборот сохраняет совещательное значение первого лица.
- source_word: לָעָם הַזֶּה
  choice: с этим народом
  rationale: Предлог ל при עשה здесь указывает на объект, по отношению к которому требуется действие. «Что мне делать с этим народом?» — естественная русская передача без уточнения того, какого именно рода действие имеется в виду.
- source_word: עֹד מְעַט
  choice: Ещё немного
  rationale: Выражение буквально означает «ещё немного» и в контексте указывает на непосредственную близость угрозы.
- source_word: וּסְקָלֻנִי
  choice: и они побьют меня камнями
  rationale: Глагол סקל обозначает нападение или казнь посредством бросания камней. Будущее время по-русски естественно передаёт ожидаемый в ближайшее время результат.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно употреблён тетраграмматон. Транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Степень неизбежности побиения камнями
  choice: «Ещё немного — и они побьют меня камнями» как угроза, воспринимаемая Моисеем как неминуемая
  alternative: «Они уже готовы побить меня камнями»
  rationale: Текст подчёркивает непосредственную близость насилия, но буквально не говорит о совершении приготовительных действий; перевод сохраняет эту напряжённость, не усиливая её до явной попытки нападения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным глаголом «воззвал». Синтаксический гебраизм «говоря» опущен ради естественной прямой речи. Тире передаёт резкий переход к ожидаемому неминуемому последствию.
