  yaml_path: translation/ot/exodus/017/010.yaml
  text: So Joshua did as Moses had told him[a], to fight against Amalek; and Moses, Aaron, and Hur went up to the top of the hill.
translation:
  language: ru
  text: Иисус Навин сделал так, как велел ему Моисей, и вступил в бой с Амаликом[a]. А Моисей, Аарон и Ор поднялись на вершину холма.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское «Амалик»; это имя может обозначать народ амаликитян.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Глагол עשה в сочетании с כַּאֲשֶׁר выражает исполнение данного указания; «сделал так» естественно передаёт эту конструкцию.
- source_word: כַּאֲשֶׁר אָמַר לוֹ מֹשֶׁה
  choice: как велел ему Моисей
  rationale: Хотя אמר буквально означает «сказал», контекст предыдущего стиха показывает, что речь идёт о распоряжении Моисея; «велел» ясно и естественно передаёт смысл.
- source_word: לְהִלָּחֵם
  choice: вступил в бой
  rationale: Инфинитив Niphal от לחם означает «сражаться». В русском предложении форма «вступил в бой» естественно раскрывает цель исполненного приказа и избегает неловкого присоединения инфинитива.
- source_word: בַּעֲמָלֵק
  choice: с Амаликом
  rationale: При глаголе לחם предлог ב обозначает противника. Сохранено собственное имя «Амалик», а не подставлено толкование «амаликитяне».
- source_word: עָלוּ
  choice: поднялись
  rationale: Обычное значение עלה — движение вверх; «поднялись» естественно для восхождения на холм.
- source_word: רֹאשׁ הַגִּבְעָה
  choice: вершину холма
  rationale: Буквально «голова холма»; это устойчивое обозначение его верхней точки. «Вершина холма» точно и литературно передаёт образ.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Использовано закрепившееся в русской библейской традиции имя, позволяющее отличить этого персонажа от Иисуса Христа.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Общепринятая русская форма библейского имени.
- source_word: אַהֲרֹן
  choice: Аарон
  rationale: Общепринятая русская форма библейского имени.
- source_word: חוּר
  choice: Ор
  rationale: Использована традиционная русская библейская форма имени.
