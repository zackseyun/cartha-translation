base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/002.yaml
  text: So the people quarreled with Moses and said[a], “Give us water so that we may drink.” And Moses said to them[b], “Why do you quarrel with me? Why do you test Yahweh?”
translation:
  language: ru
  text: 'И народ стал спорить с Моисеем. Они сказали: «Дайте нам воды, чтобы пить». Моисей ответил им: «Почему вы спорите со мной? Почему вы испытываете[a] Яхве[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подвергаете испытанию».'
    reason: Лексически возможная более развёрнутая передача נסה.
  - marker: b
    text: 'Евр. YHWH (יהוה); традиционно: «Господь».'
    reason: Пояснение передачи личного имени Бога.
lexical_decisions:
- source_word: וַיָּרֶב
  choice: стал спорить
  rationale: Глагол ריב обозначает спор или тяжбу. «Стал спорить» естественно передаёт начало повествовательного действия и сохраняет его противоборствующий характер.
- source_word: הָעָם
  choice: народ
  rationale: В еврейском тексте сказано просто «народ» с определённым артиклем; уточнение «израильский» здесь не добавляется.
- source_word: עִם מֹשֶׁה
  choice: с Моисеем
  rationale: Предлог עִם буквально означает «с»; русское сочетание «спорить с» само выражает противостояние.
- source_word: תְּנוּ לָנוּ מַיִם
  choice: Дайте нам воды
  rationale: Прямо и естественно передаёт повелительную форму נתן с косвенным дополнением; родительный партитивный «воды» обычен по-русски.
- source_word: וְנִשְׁתֶּה
  choice: чтобы мы могли пить
  rationale: Когортатив после повеления выражает желаемую цель или результат. Такая передача ясна современному читателю и не превращает просьбу в простое предсказание.
- source_word: מַה תְּרִיבוּן עִמָּדִי
  choice: Почему вы спорите со мной?
  rationale: В укоризненном вопросе מַה имеет значение «почему». Повтор глагола «спорить» сохраняет лексическую связь с началом стиха.
- source_word: מַה תְּנַסּוּן
  choice: Почему вы испытываете
  rationale: Порода пиэль глагола נסה означает «испытывать, подвергать испытанию». Краткая формулировка сохраняет серьёзность вызова Богу.
- source_word: אֶת יְהוָה
  choice: Яхве
  rationale: Передаётся личное заветное имя יהוה, а не заменяется титулом «Господь».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо употребляет тетраграмматон. «Яхве» передаёт личное имя и не подменяет его титулом; примечание сообщает традиционный вариант.
- issue: Смысл נסה по отношению к Богу
  choice: испытываете
  alternative: подвергаете испытанию
  rationale: 'Формулировка сохраняет богословское напряжение: спор с Моисеем представлен как испытание самого Яхве, без смягчения до обычной жалобы.'
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Короткие фразы сохраняют энергичный характер спора; местоимение «они» согласует последующий глагол множественного числа וַיֹּאמְרוּ с собирательным существительным «народ».
