base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/007.yaml
  text: And he called the name of the place Massah and Meribah[a], because of the quarreling of the sons of Israel and because they tested Yahweh, saying[c][b], “Is Yahweh among us or not?”
translation:
  language: ru
  text: 'Он назвал это место Массой и Меривой[a] из-за ссоры сынов Израиля[b] и потому, что они испытывали Яхве, говоря: «Есть ли Яхве среди нас или нет?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Названия «Масса» и «Мерива» созвучны еврейским словам со значениями «испытание» и «ссора (спор)».
    reason: lexical_alternative
  - marker: b
    text: То есть израильтян; выражение «сыны Израиля» здесь обозначает народ в целом.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: И назвал он это место
  rationale: Глагол קרא со словом שֵׁם образует формулу наречения имени. По-русски «назвал это место» естественно и точно передаёт смысл, тогда как буквальное «назвал имя этого места» звучит тяжеловесно.
- source_word: מַסָּה וּמְרִיבָה
  choice: Масса и Мерива
  rationale: Названия транслитерированы; их значимая связь с корнями נסה («испытывать») и ריב («ссориться, спорить») пояснена в сноске.
- source_word: עַל רִיב בְּנֵי יִשְׂרָאֵל
  choice: из-за ссоры сынов Израиля
  rationale: עַל обозначает причину, а רִיב — ссору, спор или распрю. «Ссора» ясно связывает пояснение с названием Мерива и сохраняет корпоративное выражение «сыны Израиля».
- source_word: וְעַל נַסֹּתָם אֶת יְהוָה
  choice: и потому, что они испытывали Яхве
  rationale: Форма נסה указывает на испытание или проверку Яхве народом. Личная конструкция естественна по-русски и сохраняет прямой объект еврейского текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: הֲיֵשׁ יְהוָה בְּקִרְבֵּנוּ אִם אָיִן
  choice: Есть ли Яхве среди нас или нет?
  rationale: בקרבנו означает присутствие внутри общины — «среди нас». Конструкция הֲיֵשׁ ... אִם אָיִן выражает альтернативный вопрос «есть ли… или нет?».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Корпоративное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Более формальная передача сохраняет явный образ исходного выражения, которое в данном контексте обозначает весь народ, а не только мужчин.
- issue: Характер вопроса народа
  choice: «Есть ли Яхве среди нас или нет?»
  alternative: «С нами ли Яхве или нет?»
  rationale: Выражение оставлено как прямое сомнение в присутствии Яхве среди общины; перевод не смягчает и не усиливает богословское напряжение.
translation_notes:
  register: Современный литературный русский с умеренно формальным библейским достоинством. Синтаксис сглажен там, где буквальная еврейская формула была бы неестественна, но словесные связи между названиями места и поступками народа сохранены.
