  source_fidelity: 'Русский текст точно передаёт последовательность повелений еврейского оригинала: Моисей должен пройти перед народом, взять с собой часть старейшин Израиля, взять свой посох — тот, которым он ударил по Нилу, — и идти. Партитивное מִזִּקְנֵי корректно выражено как «некоторых из старейшин». Орудийное значение בּוֹ сохранено в обороте «которым ты ударил по Нилу».'
