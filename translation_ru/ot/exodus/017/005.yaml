  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲבֹר֙ לִ/פְנֵ֣י הָ/עָ֔ם וְ/קַ֥ח אִתְּ/ךָ֖ מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וּ/מַטְּ/ךָ֗ אֲשֶׁ֨ר הִכִּ֤יתָ בּ/וֹ֙ אֶת הַ/יְאֹ֔ר קַ֥ח בְּ/יָדְ/ךָ֖ וְ/הָלָֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/005.yaml
  text: Then Yahweh said to Moses[a], “Pass on before the people, and take with you some of the elders of Israel. Take in your hand your staff with which you struck the Nile[b], and go.”
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Пройди впереди народа и возьми с собой некоторых из старейшин Израиля. Возьми в руку свой посох, которым ты ударил по Нилу[a], и иди».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по реке»; в книге Исход это слово обычно обозначает Нил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией тетраграмматона, не заменяя его титулом.
- source_word: עֲבֹר לִפְנֵי הָעָם
  choice: Пройди впереди народа
  rationale: 'Естественно передаёт повеление и пространственный смысл: Моисей должен пройти перед народом, то есть выйти вперёд.'
- source_word: וְקַח אִתְּךָ מִזִּקְנֵי יִשְׂרָאֵל
  choice: и возьми с собой некоторых из старейшин Израиля
  rationale: 'Предлог מִן имеет здесь партитивный смысл: следует взять представителей из числа старейшин, а не обязательно всех.'
- source_word: וּמַטְּךָ
  choice: свой посох
  rationale: «Посох» — естественное современное соответствие מַטֶּה в данном повествовательном контексте.
- source_word: אֲשֶׁר הִכִּיתָ בּוֹ אֶת הַיְאֹר
  choice: которым ты ударил по Нилу
  rationale: בּוֹ передаёт орудийное значение, а הַיְאֹר в контексте Исхода обозначает Нил.
- source_word: קַח בְּיָדְךָ
  choice: Возьми в руку
  rationale: Сохраняет повтор глагола קח и последовательность повелений оригинала.
- source_word: וְהָלָכְתָּ
  choice: и иди
  rationale: Перфект с waw после повелительных форм продолжает цепочку распоряжений и по-русски естественно передаётся повелительным наклонением.
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Передаёт продвижение повествования, выраженное формой wayyiqtol.
theological_decisions:
- issue: Передача имени YHWH
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: Транслитерация сохраняет личное имя, стоящее в еврейском тексте, и не подменяет его традиционным титулом.
translation_notes:
  register: Современный литературный русский язык; повеления сформулированы ясно и сдержанно. Сохранены повтор «возьми» и последовательность действий. Партитивное значение выражения «из старейшин» раскрыто в основном тексте естественным оборотом «некоторых из старейшин».
