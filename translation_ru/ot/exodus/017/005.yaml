  terminology: «Яхве» последовательно передаёт тетраграмматон как личное имя. «Моисей», «старейшины Израиля» и «посох» являются нормативными и уместными соответствиями. «Нил» оправдан контекстом книги Исход; сноска корректно фиксирует более общее значение יְאֹר («река»).
