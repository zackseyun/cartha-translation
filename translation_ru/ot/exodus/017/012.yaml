revisions:
- from: Но руки Моисея отяжелели. Тогда они взяли камень, подложили под него, и он сел на него. Аарон и Хур поддерживали его руки — один с одной стороны, другой с другой, — и руки его оставались твёрдыми[a] до захода солнца.
  to: Но руки Моисея отяжелели. Тогда они взяли камень, положили его под Моисея, и тот сел на камень. Аарон и Хур поддерживали его руки — один с одной стороны, другой с другой, — и руки его сохраняли устойчивость[a] до захода солнца.
  rationale: Правка заменяет двусмысленное «твёрдыми» на естественное для русского описания физической устойчивости и делает референцию к камню прозрачной. Альтернативы «твёрдыми» и «стойкими», а также возможный оттенок «верности», сохранены в сноске.
