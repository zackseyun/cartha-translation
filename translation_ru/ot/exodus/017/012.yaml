base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/012.yaml
  text: But Moses’ hands were heavy[a], so they took a stone and put it under him, and he sat on it. And Aaron and Hur supported his hands, one on this side and one on that side, so his hands remained steady until the sun set.
translation:
  language: ru
  text: Но руки Моисея отяжелели. Тогда они взяли камень, положили его под Моисея, и тот сел на камень. Аарон и Хур поддерживали его руки — один с одной стороны, другой с другой, — и руки его сохраняли устойчивость[a] до захода солнца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оставались твёрдыми» или «стойкими»; древнееврейское слово может также означать «верность», но здесь прежде всего описывает физическую устойчивость рук Моисея.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידֵי מֹשֶׁה כְּבֵדִים
  choice: руки Моисея отяжелели
  rationale: Сохраняет конкретный древнееврейский образ «тяжёлых» рук и естественно передаёт наступившую от усталости тяжесть.
- source_word: וַיִּקְחוּ אֶבֶן
  choice: они взяли камень
  rationale: Глагол имеет неопределённый субъект во множественном числе; перевод не отождествляет его прямо с Аароном и Хуром, хотя контекст это допускает.
- source_word: וַיָּשִׂימוּ תַחְתָּיו
  choice: подложили под него
  rationale: Естественная русская формулировка для помещения камня под Моисея в качестве сиденья.
- source_word: תָּמְכוּ בְיָדָיו
  choice: поддерживали его руки
  rationale: Передаёт продолжительное физическое поддерживание и сохраняет повтор ключевого слова «руки».
- source_word: מִזֶּה אֶחָד וּמִזֶּה אֶחָד
  choice: один с одной стороны, другой с другой
  rationale: Ясно и естественно передаёт распределение Аарона и Хура по обе стороны от Моисея.
- source_word: וַיְהִי יָדָיו אֱמוּנָה
  choice: руки его оставались твёрдыми
  rationale: «Твёрдыми» передаёт физическую устойчивость рук, одновременно не устраняя полностью смысловой оттенок стойкости, присущий אֱמוּנָה.
- source_word: עַד בֹּא הַשָּׁמֶשׁ
  choice: до захода солнца
  rationale: Краткий, естественный и литературный русский эквивалент выражения «до прихода/захода солнца».
theological_decisions:
- issue: Значение אֱמוּנָה применительно к рукам Моисея
  choice: физическая твёрдость и устойчивость
  alternative: стойкость или верность
  rationale: Непосредственный контекст говорит об усталости Моисея и физической поддержке его рук. При этом слово обладает более широким смыслом стойкости и верности, поэтому альтернативные оттенки отмечены в сноске, а не устранены.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор слова «руки» сохранён как важный образ исходного текста; синтаксис упрощён ровно настолько, чтобы стих был понятен при обычном чтении.
