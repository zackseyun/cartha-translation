base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/003.yaml
  text: And there the people thirsted for water, and the people grumbled against Moses and said, “Why is this—that you brought us up from Egypt to kill me and my children and my livestock with thirst?”
translation:
  language: ru
  text: 'Там народ жаждал воды, и народ роптал на Моисея, говоря: «Зачем это ты вывел нас из Египта — чтобы уморить жаждой меня, моих детей и мой скот?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְמָא שָׁם הָעָם לַמַּיִם
  choice: И жаждал там народ воды
  rationale: Передаёт повтор корня и порядок смысловых компонентов исходного текста; сочетание «жаждать воды» естественно для литературного русского языка.
- source_word: וַיָּלֶן ... עַל־מֹשֶׁה
  choice: роптал ... на Моисея
  rationale: Глагол обозначает недовольный ропот или жалобу против кого-либо; «роптал на» сохраняет направленность עַל и библейское достоинство регистра.
- source_word: לָמָּה זֶּה הֶעֱלִיתָנוּ
  choice: Зачем ты вывел нас
  rationale: Идиома выражает обвинительный вопрос о цели или причине исхода; «зачем» естественно сохраняет его целевую напряжённость, а «вывел» контекстуально передаёт буквальное «поднял нас» из Египта.
- source_word: לְהָמִית ... בַּצָּמָא
  choice: чтобы уморить жаждой
  rationale: Инфинитив цели и причинно-инструментальное значение переданы кратко и естественно; «уморить жаждой» точнее по русской сочетаемости, чем буквальное «убить жаждой».
- source_word: אֹתִי וְאֶת־בָּנַי וְאֶת־מִקְנַי
  choice: меня, моих детей и мой скот
  rationale: Сохраняется примечательный переход от множественного «нас» к единственному числу «меня / моих», представляющий коллектив через речь отдельного участника; בָּנַי может означать сыновей или детей, здесь выбрано более широкое контекстуальное «детей».
theological_decisions:
- issue: Обвинительный смысл вопроса народа
  choice: «Зачем ты вывел нас из Египта — чтобы уморить…?»
  alternative: «Почему это ты вывел нас из Египта, чтобы уморить…?»
  rationale: Русское «зачем» ясно сохраняет обвинение в предполагаемой цели действия, не утверждая от лица повествователя, что Моисей действительно намеревался погубить народ.
- issue: Переход от коллективного «нас» к единственному «меня»
  choice: 'Сохранить: «нас… меня, моих детей и мой скот»'
  alternative: 'Согласовать во множественном числе: «нас, наших детей и наш скот»'
  rationale: Несогласованность чисел присутствует в масоретском тексте и отражает коллективную жалобу, произнесённую как бы каждым человеком лично; её не следует сглаживать.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским ритмом. Лексика понятна широкому читателю; синтаксический повтор «народ» сохранён как черта еврейского оригинала.
