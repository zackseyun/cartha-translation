  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה כְּתֹ֨ב זֹ֤את זִכָּרוֹן֙ בַּ/סֵּ֔פֶר וְ/שִׂ֖ים בְּ/אָזְנֵ֣י יְהוֹשֻׁ֑עַ כִּֽי מָחֹ֤ה אֶמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/014.yaml
  text: Then Yahweh said to Moses[a], “Write this as a memorial in the book, and put it in Joshua’s hearing[c][b], for I will surely blot out the remembrance of Amalek from under heaven.”
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Запиши это для памяти в книге[a] и повтори это Иисусу Навину[b], ибо Я непременно изглажу[c] память об Амалике из-под небес».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в свитке». В еврейском тексте стоит: «в книге».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «положи в уши Иисуса Навина» — то есть дай ему услышать это или повтори ему.'
    reason: lexical_alternative
  - marker: c
    text: Еврейская конструкция «изглаживая, изглажу» подчёркивает несомненность и решительность действия.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: כְּתֹב
  choice: запиши
  rationale: Повелительная форма означает «напиши»; «запиши» естественно выражает фиксацию события в книге.
- source_word: זֹאת זִכָּרוֹן
  choice: это для памяти
  rationale: 'Сохраняет целевое значение конструкции: запись должна служить напоминанием, и поддерживает смысловую связь с последующим «память об Амалике».'
- source_word: בַּסֵּפֶר
  choice: в книге
  rationale: Передаёт определённый артикль в еврейском тексте; возможны также контекстуальные понимания «в свитке» или менее определённое «в книге».
- source_word: וְשִׂים בְּאָזְנֵי יְהוֹשֻׁעַ
  choice: и вложи в уши Иисуса Навина
  rationale: Сохраняет конкретный образ еврейской идиомы, означающей веление сделать так, чтобы Иисус Навин это услышал и запомнил.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Употреблена закрепившаяся в русской библейской традиции форма имени, однозначно обозначающая данного персонажа.
- source_word: כִּי
  choice: ибо
  rationale: Естественно вводит основание или поясняющее содержание повеления, не устраняя возможный оттенок причинности.
- source_word: מָחֹה אֶמְחֶה
  choice: Я непременно изглажу
  rationale: Наречие «непременно» передаёт усиление, создаваемое сочетанием абсолютного инфинитива с личной формой того же глагола.
- source_word: זֵכֶר עֲמָלֵק
  choice: память об Амалике
  rationale: Передаёт значение памяти или воспоминания и сохраняет намеренный контраст с записью «для памяти» в первой части стиха.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: из-под небес
  rationale: Формально и понятно передаёт еврейское выражение о полном устранении из земного мира.
theological_decisions:
- issue: Передача божественного имени
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно стоит тетраграмматон יהוה. Транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Объект обещанного изглаживания
  choice: память об Амалике
  alternative: имя Амалика; воспоминание об Амалике
  rationale: זֵכֶר буквально относится к памяти или упоминанию. Перевод не расширяет высказывание до явно сформулированного уничтожения каждого отдельного человека и сохраняет напряжение исходной формулировки.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской интонацией. Идиома «вложи в уши» намеренно сохранена ради образности источника и пояснена в сноске; «изглажу» выбрано как понятное, dignified и контекстуально точное слово.
