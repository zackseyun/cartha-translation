base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/006.yaml
  text: Behold[a], I will stand before you there on the rock at Horeb, and you shall strike the rock, and water will come out from it, and the people will drink. And Moses did so in the sight of the elders of Israel.
translation:
  language: ru
  text: «Вот, Я встану перед тобой там, на скале у Хорива[a]. Ударь по скале — из неё выйдет вода, и народ будет пить». Моисей так и сделал на глазах у старейшин Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот, Я стою перед тобой там, на скале у Хорива». Еврейское причастие может быть передано настоящим временем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сочетание הִנֵּה с местоименным суффиксом вводит торжественное указание на предстоящее явление и действие Бога. «Вот, Я» сохраняет дейктическую силу и естественно звучит в современном русском.
- source_word: עֹמֵד
  choice: встану
  rationale: Причастие буквально обозначает «стоящий / стою», но в контексте указания на ближайшее действие естественно получает предстоящее значение. Вариант настоящего времени сохранён в примечании.
- source_word: לְפָנֶיךָ
  choice: перед тобой
  rationale: Прямой и естественный эквивалент пространственного выражения; сохраняет положение Бога перед Моисеем.
- source_word: הַצּוּר
  choice: скала
  rationale: צוּר обозначает скалу или массивную каменную породу. «Скала» здесь лучше передаёт конкретный природный объект и позволяет сохранить повтор того же слова.
- source_word: בְּחֹרֵב
  choice: у Хорива
  rationale: Предлог בְּ при географическом названии допускает локативное значение. «У Хорива» естественно обозначает местность при горе или в её районе, не утверждая излишне точную локализацию.
- source_word: וְהִכִּיתָ בַצּוּר
  choice: Ударь по скале
  rationale: Форма в контексте инструкции имеет повелительную силу. Русское повелительное наклонение прямо и естественно передаёт приказ.
- source_word: וְיָצְאוּ מִמֶּנּוּ מַיִם
  choice: из неё выйдет вода
  rationale: Сохраняется базовое значение глагола יצא «выйти», без добавления образа течения, которого сам глагол не требует. В русском собирательное «вода» согласуется с глаголом в единственном числе.
- source_word: וְשָׁתָה הָעָם
  choice: и народ будет пить
  rationale: Передаёт последовательный результат без превращения фразы в явно целевую конструкцию.
- source_word: וַיַּעַשׂ כֵּן
  choice: так и сделал
  rationale: Естественная русская формула исполнения сказанного; частица «и» подчёркивает соответствие повелению, не добавляя нового содержания.
- source_word: לְעֵינֵי
  choice: на глазах у
  rationale: Современный и точный русский оборот, подчёркивающий, что старейшины были непосредственными свидетелями действия.
theological_decisions:
- issue: Временное значение божественного самопредставления с причастием עֹמֵד
  choice: Вот, Я встану перед тобой
  alternative: Вот, Я стою перед тобой
  rationale: Причастие допускает настоящее значение, однако ход наставления указывает на ближайшее предстоящее действие. Основной текст передаёт эту дискурсивную направленность, а подлинная аспектуально-временная неоднозначность отмечена в сноске.
- issue: Связь слов «там, на скале у Хорива»
  choice: Они относятся к тому, где встанет Бог
  alternative: Бог будет перед Моисеем там, возле скалы у Хорива
  rationale: 'Синтаксис естественнее связывает локативную фразу с עֹמֵד: Бог встанет перед Моисеем на скале. Яркий образ сохранён без смягчения и без дополнительного богословского истолкования.'
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Синтаксис сделан естественным для устной божественной речи; тире ясно передаёт последовательность приказа и обещанного результата. Местоимение «Я» применительно к Богу написано с прописной буквы согласно устойчивой русской библейской традиции.
