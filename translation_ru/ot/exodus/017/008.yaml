  text: И пришёл Амалик и сразился с Израилем в Рефидиме[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воевал против Израиля». Еврейский предлог буквально означает «с», но в контексте сражения выражает противоборство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: И пришёл
  rationale: Вав с последовательной формой глагола продвигает повествование; простое «и» естественно передаёт связь с предыдущими событиями, а «пришёл» сохраняет основное значение בוא.
- source_word: עֲמָלֵק
  choice: Амалик
  rationale: Традиционная и узнаваемая русская передача имени; в данном контексте имя собирательно обозначает амаликитян.
- source_word: וַיִּלָּחֶם
  choice: сразился
  rationale: Форма нифаль глагола לחם здесь означает вступление в бой. «Сразился» естественно и достойно звучит в повествовательном контексте, не добавляя идеи длительной войны.
- source_word: עִם
  choice: с
  rationale: Предлог буквально означает «с»; при глаголе «сразился» русская конструкция однозначно выражает противоборство и близко сохраняет еврейскую формулировку.
- source_word: יִשְׂרָאֵל
  choice: Израилем
  rationale: Стандартная русская форма названия народа; творительный падеж обусловлен предлогом «с».
- source_word: בִּרְפִידִם
  choice: в Рефидиме
  rationale: Предлог ב обозначает место действия. «В Рефидиме» — естественная русская передача местонахождения события и традиционная форма топонима.
