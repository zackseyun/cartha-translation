lexical_decisions:
- source_word: וַיַּחֲלֹשׁ
  choice: одолел
  rationale: В военном контексте глагол חלש обозначает ослабление или одоление противника. «Одолел» естественно передаёт достигнутое военное превосходство, не подразумевая полного истребления.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Использована закрепившаяся в русской библейской традиции форма имени, понятная современному читателю.
- source_word: עֲמָלֵק
  choice: Амалик
  rationale: Сохранена традиционная русская форма имени; здесь оно может обозначать самого предводителя либо представляемые им силы.
- source_word: עַמּוֹ
  choice: его народ
  rationale: Так прямо передаётся обычное значение עַם. В данном военном контексте речь, вероятно, идёт о сражавшихся людях Амалика, однако перевод не сужает смысл до «войска».
- source_word: לְפִי חָרֶב
  choice: мечом
  rationale: Естественная русская передача еврейской идиомы, буквально означающей «устами меча» и указывающей на поражение в вооружённой битве.
