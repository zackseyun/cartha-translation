  text: And Moses built an altar and called its name[a], “Yahweh Is My Banner.”
translation:
  language: ru
  text: И построил Моисей жертвенник, и назвал его «Яхве — моё знамя»[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «Яхве — моё знамя»; возможный перевод: «Господь — моё знамя». Вероятно, это название представляет Яхве как знамя или стяг, вокруг которого собирается Израиль и под которым одерживает победу.'
    reason: Лексическая альтернатива и пояснение метафорического названия.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: построил
  rationale: Обычное повествовательное значение глагола בנה; «построил» естественно передаёт конкретное действие.
- source_word: מִזְבֵּחַ
  choice: жертвенник
  rationale: Стандартное русское соответствие месту принесения жертв и памятного поклонения.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: назвал его
  rationale: Естественно передаёт еврейскую формулу «назвал его имя», не утяжеляя современную русскую речь буквализмом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: נִסִּי
  choice: моё знамя
  rationale: Слово נֵס обозначает знамя, стяг или знак, вокруг которого собираются; притяжательный суффикс означает «моё». В русском именном сказуемом настоящего времени связка «есть» естественно опускается.
theological_decisions:
- issue: Передача имени יְהוָה в названии памятного жертвенника
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит личное имя יְהוָה; транслитерация сохраняет его функцию в составе данного Моисеем названия.
- issue: Смысл именного выражения יְהוָה נִסִּי
  choice: «Яхве — моё знамя»
  alternative: «Знамя моё — Яхве»; «Яхве — мой стяг»
  rationale: Тире естественно выражает подразумеваемую связку, не уточняя сверх текста, каким именно образом Яхве является знаменем Моисея; метафора сплочения и победы сохраняется.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Повтор союза «и» сохраняет последовательность еврейского повествования; идиома именования передана естественным выражением «назвал его».
