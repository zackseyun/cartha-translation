source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה עַד אָ֨נָה֙ מֵֽאַנְתֶּ֔ם לִ/שְׁמֹ֥ר מִצְוֺתַ֖/י וְ/תוֹרֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/028.yaml
  text: Then Yahweh said to Moses[a], “How long will you refuse to keep my commandments and my laws?”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «До каких пор вы будете отказываться соблюдать Мои заповеди и Мои законы[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мои наставления». Еврейское תּוֹרֹת (торо́т, множественное число от тора́) может означать не только законы, но и авторитетные наставления.'
    reason: Лексическая альтернатива сохраняет более широкий смысл еврейского слова.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ־ продвигает повествование; традиционная русская конструкция «И сказал» естественно передаёт связь с предыдущим событием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом «Господь».
- source_word: עַד אָנָה
  choice: До каких пор
  rationale: Устойчивое русское выражение передаёт вопрос о продолжительности упорного непослушания.
- source_word: מֵאַנְתֶּם
  choice: вы будете отказываться
  rationale: Глагол означает отказ или нежелание; будущее время в риторическом вопросе естественно выражает продолжающееся упорство группы адресатов.
- source_word: לִשְׁמֹר
  choice: соблюдать
  rationale: В сочетании с заповедями глагол שׁמר означает исполнять или соблюдать их; этот вариант естественен для современного русского юридико-заветного регистра.
- source_word: מִצְוֺתַי
  choice: Мои заповеди
  rationale: Слово обозначает повеления; «заповеди» сохраняет нормативный и заветный оттенок.
- source_word: וְתוֹרֹתָי
  choice: и Мои законы
  rationale: В параллели с «заповедями» и в контексте обязательных установлений слово имеет нормативную силу. Более широкое значение «наставления» сохранено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не заменяя титулом и не навязывая конфессиональную традицию произношения «Иегова».
- issue: Передача множественного תּוֹרֹתָי
  choice: Мои законы
  alternative: Мои наставления; Моё учение
  rationale: Контекст упрёка за несоблюдение Божьих повелений поддерживает юридическое значение, однако смысл авторитетного наставления также возможен и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Обращение к группе передано местоимением «вы». Прописная буква в формах «Мои» следует принятому в русской библейской традиции уважительному написанию в прямой речи Бога.
