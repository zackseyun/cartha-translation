base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/018.yaml
  text: When they measured it by the omer[a], the one who gathered much had nothing left over, and the one who gathered little had no lack; each one gathered according to what he could eat.
translation:
  language: ru
  text: 'Когда измерили собранное омером[a], оказалось, что у того, кто собрал много, не было излишка, а у того, кто собрал мало, не было недостатка: каждый собрал столько, сколько мог съесть.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Омер — древняя мера сыпучих тел, примерно 2,2 литра (см. Исх. 16:36).
    reason: Незнакомая современному читателю древняя единица меры сохранена в тексте и кратко пояснена.
lexical_decisions:
- source_word: וַיָּמֹדּוּ
  choice: Когда измерили
  rationale: Форма с вау продолжает повествование, но здесь естественно вводит временное условие, после которого сообщается результат измерения.
- source_word: בָעֹמֶר
  choice: омером
  rationale: עֹמֶר — древняя мера сыпучих тел; конкретная единица сохранена без приблизительного пересчёта.
- source_word: הֶעְדִּיף
  choice: не было излишка
  rationale: Глагол обозначает наличие избытка или остатка; формулировка сохраняет краткий контраст еврейского текста.
- source_word: הַמַּרְבֶּה
  choice: у собравшего много
  rationale: Причастие буквально обозначает того, кто умножал или делал много; в контексте сбора манны подразумевается собравший много.
- source_word: הֶחְסִיר
  choice: не было недостатка
  rationale: Глагол выражает нехватку или недостаток; перевод сохраняет параллелизм с отсутствием излишка.
- source_word: הַמַּמְעִיט
  choice: у собравшего мало
  rationale: Контекстуально причастие относится к человеку, собравшему малое количество манны.
- source_word: אִישׁ
  choice: каждый
  rationale: Существительное употреблено дистрибутивно и относится к каждому человеку, не обязательно только к взрослым мужчинам.
- source_word: לְפִי אָכְלוֹ
  choice: столько, сколько мог съесть
  rationale: Буквально «по мере его еды»; естественная русская формулировка передаёт количество, соответствующее потребности человека в пище.
- source_word: לָקָטוּ
  choice: собрал
  rationale: לָקַט — обычный для данного рассказа глагол собирания; единственное число по-русски согласовано с дистрибутивным «каждый».
theological_decisions:
- issue: Дистрибутивное мужское единственное число в אִישׁ ... אָכְלוֹ
  choice: «каждый ... сколько мог съесть»
  alternative: «каждый мужчина ... по мере того, сколько он ел»
  rationale: Еврейские формы мужского рода единственного числа имеют здесь обобщённо-дистрибутивную функцию. Русское «каждый» сохраняет единственное число и не вводит необоснованного ограничения только мужчинами.
- issue: Связь отсутствия излишка и недостатка с измерением
  choice: «оказалось, что...»
  alternative: 'Простое сочинение: «и не было излишка...»'
  rationale: Слово «оказалось» явно передаёт результат измерения, естественно подразумеваемый последовательностью еврейских предложений, не объясняя причину выравнивания сверх сказанного текстом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический параллелизм «у собравшего много... у собравшего мало...» сохраняет ритм и смысловую симметрию оригинала; термин «омер» оставлен без метрической замены.
