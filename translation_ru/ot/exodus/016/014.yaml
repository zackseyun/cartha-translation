    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: поднялся
  rationale: Глагол עלה буквально означает движение вверх. Перевод сохраняет образ еврейского текста и не подменяет его более объяснительным «испарился».
- source_word: שִׁכְבַת הַטָּל
  choice: слой росы
  rationale: שִׁכְבָה обозначает лежащий слой или покров; «слой росы» точно и естественно передаёт сочетание.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Частица הִנֵּה привлекает внимание к неожиданно открывшемуся зрелищу; современное русское «вот» сохраняет эту функцию.
- source_word: עַל פְּנֵי הַמִּדְבָּר
  choice: на поверхности пустыни
  rationale: Передаёт пространственное значение идиомы с פָּנִים без ненатуральной буквальности «на лице пустыни».
- source_word: דַּק
  choice: мелкое
  rationale: Прилагательное может означать тонкое, мелкое или измельчённое. В описании видимого вещества «мелкое» естественно сочетается и с его формой, и со сравнением с инеем; повтор исходного слова сохранён.
- source_word: מְחֻסְפָּס
  choice: хлопьевидное
  rationale: Редкое слово неясного оттенка, вероятно описывающее внешний вид или фактуру. «Хлопьевидное» передаёт вероятный смысл, а неопределённость отмечена в сноске.
- source_word: דַּק כַּכְּפֹר
  choice: мелкое, как иней
  rationale: Сохраняет сравнение с כְּפֹר («иней») и лексический повтор דַּק.
- source_word: עַל הָאָרֶץ
  choice: на земле
  rationale: В непосредственном физическом контексте אֶרֶץ обозначает землю под ногами; русский оборот «иней на земле» звучит естественно.
