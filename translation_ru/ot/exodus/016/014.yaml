  text: When the layer of dew had gone up[a], behold, on the surface of the wilderness was a fine, flaky thing, fine as frost on the ground.
translation:
  language: ru
  text: 'Когда слой росы поднялся, и вот: на поверхности пустыни было нечто мелкое, похожее на хлопья[a], мелкое, как иней на земле.'
  philosophy: optimal-equivalence
  footnotes:
