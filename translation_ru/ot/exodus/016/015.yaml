base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/015.yaml
  text: When the sons of Israel saw it[a], they said to one another, “What is it?” For they did not know what it was. And Moses said to them[b], “It is the bread that Yahweh has given you to eat.”
translation:
  language: ru
  text: 'Когда израильтяне увидели это, они сказали друг другу[a]: «Что это?»[b] — потому что не знали, что это такое. Моисей сказал им: «Это хлеб, который Яхве дал вам в пищу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек своему брату»; это еврейская идиома со значением «друг другу».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение, переведённое как «Что это?», традиционно связывается с названием «манна».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: израильтяне
  rationale: Естественное и точное обозначение народа в современном русском языке; буквальное «сыны Израиля» здесь звучало бы архаично и могло бы неоправданно сузить значение до мужчин.
- source_word: אִישׁ אֶל אָחִיו
  choice: друг другу
  rationale: Еврейское выражение буквально означает «человек своему брату», но является идиомой взаимного действия; русский эквивалент естественно передаёт его смысл.
- source_word: מָן הוּא
  choice: Что это?
  rationale: 'В контексте это вопрос, что подтверждается следующим пояснением: они не знали, что это такое. Перевод сохраняет повествовательную логику, а связь с названием манны отмечена в сноске.'
- source_word: לֹא יָדְעוּ מַה הוּא
  choice: не знали, что это такое
  rationale: Естественная русская передача прямого значения пояснительной фразы.
- source_word: הוּא הַלֶּחֶם
  choice: Это хлеб
  rationale: Местоименная конструкция отождествляет увиденное вещество с хлебом; краткая формулировка естественна по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: לְאָכְלָה
  choice: в пищу
  rationale: Передаёт значение цели — хлеб дан для употребления в пищу — и звучит естественно в данном русском предложении.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; форма «Яхве» непосредственно передаёт тетраграмматон, не заменяя имя титулом.
- issue: Считать ли מָן в מָן הוּא именем собственным
  choice: Передать как вопрос «Что это?»
  alternative: «Это манна»; «Манна?»
  rationale: Последующая фраза прямо объясняет, что люди не знали, что это такое. Поэтому здесь выражение функционирует как вопрос, тогда как традиционная связь с названием «манна» сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинственным повествовательным стилем. «Израильтяне» предпочтено архаизирующему «сыны Израиля»; имя «Яхве» сохранено как личное имя.
