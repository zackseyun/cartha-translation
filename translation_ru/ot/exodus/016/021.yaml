  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְקְטוּ אֹתוֹ
  choice: И собирали её
  rationale: Глагол לקט означает собирать, особенно пищу; местоимение женского рода естественно отсылает в русском контексте к манне, не вводя само существительное в стих.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: каждое утро
  rationale: Повтор существительного имеет распределительно-повторительное значение. «Каждое утро» естественно передаёт его в современном русском языке.
- source_word: אִישׁ כְּפִי אָכְלוֹ
  choice: каждый — сколько ему было нужно для еды
  rationale: אִישׁ употреблено распределительно, а буквальное «по устам его еды» является идиомой меры потребления. Перевод передаёт индивидуальную потребность, не сохраняя неестественную для русского буквальную конструкцию.
- source_word: וְחַם הַשֶּׁמֶשׁ
  choice: когда же пригревало солнце
  rationale: Форма חם описывает наступление солнечного жара; «пригревало солнце» естественно выражает временную последовательность и действие тепла.
- source_word: וְנָמָס
  choice: она таяла
  rationale: מסס здесь означает таять от тепла; женский род местоимения согласуется с подразумеваемой манной.
