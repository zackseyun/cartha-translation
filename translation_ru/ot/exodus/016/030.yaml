    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: покоился
  rationale: Глагол שׁבת в породе qal означает «прекратить, перестать; покоиться». В контексте седьмого дня «покоился» естественно передаёт действие, не расширяя текст до толкования «соблюдал субботу».
- source_word: הָעָם
  choice: народ
  rationale: עָם обозначает народ как собирательное целое; русское единственное число сохраняет эту собирательность и согласуется с глаголом.
- source_word: בַּיּוֹם הַשְּׁבִעִי
  choice: в седьмой день
  rationale: Предлог בְּ при обозначении дня естественно передаётся по-русски предлогом «в»; порядковое числительное определяет слово «день».
- source_word: וַ
  choice: И
  rationale: Последовательный waw продолжает повествование. Союз «И» прямо и естественно сохраняет связь с предшествующим событием, не усиливая её до однозначно следственного значения.
theological_decisions:
- issue: Следует ли явно вводить в глагол указание на соблюдение субботы
  choice: покоился
  alternative: соблюдал субботу; прекратил работу
  rationale: Еврейский глагол сообщает, что народ прекратил деятельность и покоился; связь с субботой уже выражена контекстом и словами «в седьмой день». Формулировка не добавляет обрядового или доктринального уточнения.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной повествовательной формой. Выбрано «покоился», а не несколько более разговорное «отдыхал», чтобы сохранить смысл прекращения деятельности и лексическую связь с покоем.
