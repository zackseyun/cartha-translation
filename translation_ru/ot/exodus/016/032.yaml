base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/032.yaml
  text: 'And Moses said[a], “This is the thing that Yahweh has commanded: Let a full omer of it be kept throughout your generations, so that they may see the bread with which I fed you in the wilderness, when I brought you out from the land of Egypt.”'
translation:
  language: ru
  text: 'И сказал Моисей: «Вот что повелел Яхве: пусть полный омер[a] этой пищи хранится из поколения в поколение, чтобы будущие поколения видели хлеб, которым Я кормил вас в пустыне, когда Я вывел вас из земли Египта».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Омер — древняя мера объёма; её точный современный эквивалент не установлен.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: И сказал Моисей
  rationale: Сохраняет повествовательную связь wayyiqtol и звучит естественно в русском библейском повествовании.
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה יְהוָה
  choice: Вот что повелел Яхве
  rationale: Естественно передаёт формулу введения повеления; имя יהוה передано как «Яхве».
- source_word: מְלֹא הָעֹמֶר מִמֶּנּוּ
  choice: полная мера — омер — этой пищи
  rationale: Передаёт значение «полный омер» и сохраняет древнюю единицу измерения; «этой пищи» ясно отсылает к манне из контекста.
- source_word: לְמִשְׁמֶרֶת לְדֹרֹתֵיכֶם
  choice: хранится из поколения в поколение
  rationale: Передаёт назначение для сохранения и длительность на протяжении последующих поколений.
- source_word: לְמַעַן יִרְאוּ
  choice: чтобы ваши потомки видели
  rationale: Явно выражает подразумеваемый субъект — будущие поколения, не меняя смысла цели.
- source_word: הַלֶּחֶם אֲשֶׁר הֶאֱכַלְתִּי אֶתְכֶם
  choice: хлеб, которым Я кормил вас
  rationale: Сохраняет буквальное «хлеб» и каузативное значение формы глагола אכל — «кормить».
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Обычное и понятное русское соответствие для מדבר в данном контексте.
- source_word: בְּהוֹצִיאִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: когда вывел вас из земли Египетской
  rationale: Естественно передаёт временное значение конструкции с инфинитивом и сохраняет традиционное географическое выражение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передаётся непосредственно употреблённое в еврейском тексте личное имя Бога без замены титулом.
- issue: Говорящий в словах «Я кормил… вывел»
  choice: Сохранена прямая речь Яхве от первого лица
  alternative: Переформулировать от третьего лица как речь Моисея
  rationale: Еврейский текст переходит внутри цитируемого повеления к первому лицу; сохранение этого перехода отражает грамматику и не устраняет богословски значимую форму речи.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Древняя мера сохранена и кратко пояснена; синтаксис упрощён лишь там, где это нужно для ясности.
