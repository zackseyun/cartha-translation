revisions:
- from: 'И сказал Моисей: «Вот что повелел Яхве: пусть полная мера — омер — этой пищи хранится из поколения в поколение, чтобы ваши потомки видели хлеб, которым Я кормил вас в пустыне, когда вывел вас из земли Египетской».[a]'
  to: 'И сказал Моисей: «Вот что повелел Яхве: пусть полный омер[a] этой пищи хранится из поколения в поколение, чтобы будущие поколения видели хлеб, которым Я кормил вас в пустыне, когда Я вывел вас из земли Египта».'
  rationale: Правка ограничена модернизацией географического выражения, переносом якоря сноски к «омеру» и осторожным пояснением древней меры. Смысл, лицо говорящего и намеренная контекстуальная отсылка «этой пищи» сохранены.
