lexical_decisions:
- source_word: וַיַּנִּיחוּ אֹתוֹ
  choice: они оставили это
  rationale: В данном контексте форма от הניח означает оставить или отложить манну до следующего утра. «Оставили это» естественно передаёт действие и сохраняет единственное число местоимения.
- source_word: עַד הַבֹּקֶר
  choice: до утра
  rationale: Обычное русское временное выражение, точно передающее предел действия.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: как повелел Моисей
  rationale: Передаёт соответствие ранее данному распоряжению Моисея без избыточного уточнения временной последовательности.
- source_word: הִבְאִישׁ
  choice: не стало смердеть
  rationale: Глагол обозначает появление дурного запаха; конструкция «не стало смердеть» передаёт начинательное значение и сохраняет выразительность исходного текста.
- source_word: רִמָּה
  choice: червей
  rationale: Еврейское существительное может обозначать червей или личинок, связанных с разложением. «Черви» сохраняет более широкое значение.
- source_word: לֹא הָיְתָה בּוֹ
  choice: в нём не появилось
  rationale: Естественная русская передача отсутствия червей в сохраняемой манне; средний род местоимения согласуется с «это» как обозначением содержимого.
