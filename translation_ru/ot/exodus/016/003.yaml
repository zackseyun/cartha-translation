revisions:
- from: 'И сыны Израиля[a] сказали им: «О, если бы мы умерли от руки Яхве[b] в земле Египетской, когда сидели у котлов с мясом[c] и ели хлеб досыта! Ведь вы вывели нас в эту пустыню, чтобы уморить голодом всё это собрание».'
  to: 'И сыны Израиля[a] сказали им: «О, если бы мы умерли от руки Яхве[b] в Египте, когда сидели у котла с мясом[c] и ели хлеб досыта! Ведь вы вывели нас в эту пустыню, чтобы уморить голодом всё это собрание».'
  rationale: Исправлено единственное число «котёл» в соответствии с еврейским סִיר. «В земле Египетской» заменено на естественное современное «в Египте» без смысловой потери. Остальные решения сохраняют смысл и риторический строй исходного текста.
