source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם בְּנֵ֣י יִשְׂרָאֵ֗ל מִֽי יִתֵּ֨ן מוּתֵ֤/נוּ בְ/יַד יְהוָה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/שִׁבְתֵּ֨/נוּ֙ עַל סִ֣יר הַ/בָּשָׂ֔ר בְּ/אָכְלֵ֥/נוּ לֶ֖חֶם לָ/שֹׂ֑בַע כִּֽי הוֹצֵאתֶ֤ם אֹתָ֨/נוּ֙ אֶל הַ/מִּדְבָּ֣ר הַ/זֶּ֔ה לְ/הָמִ֛ית אֶת כָּל הַ/קָּהָ֥ל הַ/זֶּ֖ה בָּ/רָעָֽב־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/003.yaml
  text: And the sons of Israel said to them[a], “If only we had died by the hand of Yahweh in the land of Egypt, when we sat by the pots of meat, when we ate bread to the full[c][b]. For you have brought us out into this wilderness to kill this whole assembly with hunger.”
translation:
  language: ru
  text: 'И сыны Израиля[a] сказали им: «О, если бы мы умерли от руки Яхве[b] в Египте, когда сидели у котла с мясом[c] и ели хлеб досыта! Ведь вы вывели нас в эту пустыню, чтобы уморить голодом всё это собрание».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: Яхве — передача еврейского личного имени Бога יהוה (YHWH), которое традиционно заменяют словом «Господь».
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «у котла с мясом»; речь идёт о котле, в котором готовили мясо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально передаёт родственно-заветное выражение оригинала; в современном русском возможно более идиоматичное «израильтяне», отмеченное в сноске.
- source_word: מִי יִתֵּן מוּתֵנוּ
  choice: О, если бы мы умерли
  rationale: מִי יִתֵּן здесь является идиомой сильного, неосуществившегося желания, а не буквальным вопросом «кто даст?».
- source_word: בְיַד יְהוָה
  choice: от руки Яхве
  rationale: Сохраняет конкретный образ еврейского выражения и представляет смерть как наступившую от действия Яхве, не уточняя её способ.
- source_word: בְּשִׁבְתֵּנוּ עַל סִיר הַבָּשָׂר
  choice: когда сидели у котлов с мясом
  rationale: Естественно передаёт временную конструкцию и конкретный образ котлов, в которых готовили мясо.
- source_word: בְּאָכְלֵנוּ לֶחֶם לָשֹׂבַע
  choice: и ели хлеб досыта
  rationale: Сохраняет параллельную временную картину; «досыта» точно и естественно передаёт לָשֹׂבַע.
- source_word: הַמִּדְבָּר הַזֶּה
  choice: эту пустыню
  rationale: Обычное современное русское обозначение безлюдной и негостеприимной местности в данном контексте.
- source_word: לְהָמִית ... בָּרָעָב
  choice: чтобы уморить голодом
  rationale: Русское выражение прямо передаёт каузативное «довести до смерти» и названное в оригинале средство — голод.
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: всё это собрание
  rationale: Сохраняет коллективное значение קָהָל и указательное выражение, не привнося позднейшей церковной терминологии.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя YHWH. «Яхве» передаёт его как имя, тогда как «Господь» является традиционной заменой титулом; «Иегова» — традиционная, но менее вероятная вокализация.
- issue: Заветно-родовое обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Выбор сохраняет мужскую множественную форму и родовой образ оригинала. Более гладкое «израильтяне» возможно, но скрывает этот образ.
- issue: Смерть בְיַד יְהוָה
  choice: умерли от руки Яхве
  alternative: умерли по воле Яхве; Яхве умертвил нас
  rationale: Буквальный образ сохраняет напряжение обвинительной речи и не определяет точнее, идёт ли речь о прямом поражении, суде или допущенной Богом смерти.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис прямой речи сохранён живым и обвинительным; архаизмы сведены к осмысленному выражению «сыны Израиля», пояснённому сноской.
