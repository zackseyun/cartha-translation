source:
  edition: WLC
  text: שֵׁ֥שֶׁת יָמִ֖ים תִּלְקְטֻ֑/הוּ וּ/בַ/יּ֧וֹם הַ/שְּׁבִיעִ֛י שַׁבָּ֖ת לֹ֥א יִֽהְיֶה בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/026.yaml
  text: For six days you shall gather it[a], but on the seventh day, a Sabbath[c][b], there will be none.
translation:
  language: ru
  text: Шесть дней собирайте его, но седьмой день — суббота; в этот день его не будет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в седьмой день манны не будет.
    reason: cross_reference
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Шесть дней
  rationale: Конструктивное сочетание означает продолжительность «шесть дней»; по-русски предлог не требуется.
- source_word: תִּלְקְטֻהוּ
  choice: собирайте его
  rationale: Форма 2-го лица множественного числа с местоименным суффиксом 3-го лица мужского рода передаёт предписание собирать ранее упомянутую манну.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: но седьмой день
  rationale: Союз ו допускает «и», однако контекстуальное противопоставление шести дней седьмому естественно передаётся союзом «но».
- source_word: שַׁבָּת
  choice: суббота
  rationale: Существительное стоит без артикля и приложением характеризует седьмой день; русское «суббота» сохраняет прямое наименование без пояснительного парафраза «день покоя».
- source_word: לֹא יִהְיֶה בּוֹ
  choice: в этот день его не будет
  rationale: 'Буквально: «не будет его в нём»; בּוֹ относится к седьмому дню, а подразумеваемый субъект — собираемая пища, то есть манна. Русская формулировка ясно сохраняет оба местоименных элемента, не вводя слово «манна» в основной текст.'
theological_decisions:
- issue: Передача שַׁבָּת до Синайского завета
  choice: суббота
  alternative: день покоя
  rationale: Прямой лексический эквивалент не привносит позднейшие конфессиональные уточнения и сохраняет связь с самим еврейским термином; отсутствие артикля передаётся приложением, поскольку русский язык не располагает неопределённым артиклем.
- issue: Подразумеваемый субъект в לֹא יִהְיֶה בּוֹ
  choice: его не будет
  alternative: манны не будет
  rationale: Местоимение сохраняет лаконичность и формальную неопределённость еврейского текста, тогда как сноска поясняет очевидный из контекста референт.
translation_notes:
  register: Современный литературный русский язык; повелительное «собирайте» естественно передаёт предписывающую силу формы. Тире оформляет приложение «суббота», а точка с запятой ясно разделяет установление и его следствие.
