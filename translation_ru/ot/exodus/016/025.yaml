  text: And Moses said, “Eat it today, because today is a Sabbath to the LORD; today you will not find it in the field.”
translation:
  language: ru
  text: 'Моисей сказал: «Ешьте это сегодня, потому что сегодня — суббота, посвящённая Господу; сегодня вы не найдёте манны в поле».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִכְלֻהוּ
  choice: Ешьте это
  rationale: Форма повелительного наклонения во множественном числе с местоименным суффиксом передана естественно и с сохранением прямого объекта.
- source_word: שַׁבָּת
  choice: суббота
  rationale: Обычный русский библейский эквивалент, обозначающий день прекращения труда и покоя.
- source_word: לַיהוָה
  choice: Господу
  rationale: Предлог ל передаёт посвящённость дня Господу; дательный падеж сохраняет конструкцию исходного текста. Тетраграмматон по принятой русской библейской традиции передан как «Господь».
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: Прямой и естественный эквивалент, указывающий на место, где народ прежде собирал манну.
theological_decisions:
- issue: Значение выражения שַׁבָּת ... לַיהוָה
  choice: суббота Господу
  alternative: суббота для Господа / суббота, посвящённая Господу
  rationale: Более формальная конструкция сохраняет посвящённость дня Господу и не добавляет отсутствующего в тексте пояснения.
- issue: Причинная связь с повелением
  choice: потому что
  alternative: ибо / ведь
  rationale: כִּי здесь естественно вводит основание повеления; современное «потому что» ясно выражает эту связь.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Повтор слова «сегодня» сохранён трижды ради эмфазы и структуры еврейского текста.
