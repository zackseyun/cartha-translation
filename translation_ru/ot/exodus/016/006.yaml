base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/006.yaml
  text: Then Moses and Aaron said to all the sons of Israel[a], “At evening you will know that Yahweh brought you out from the land of Egypt.”
translation:
  language: ru
  text: 'Тогда Моисей и Аарон сказали всем израильтянам[a]: «Вечером вы узнаете, что Яхве вывел вас из земли Египта».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всем сынам Израиля». Традиционно: «всем сынам Израилевым».'
    reason: «Сыны Израиля» буквально передаёт еврейское устойчивое выражение, тогда как в основном тексте «израильтяне» естественно и однозначно обозначает весь народ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказали
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию. Хотя еврейский глагол стоит в единственном числе, в русском при составном подлежащем «Моисей и Аарон» нормативно множественное число.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Моисей и Аарон
  rationale: Устоявшиеся русские формы библейских личных имён.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: всем сынам Израиля[a]
  rationale: Сохраняет буквальную форму בְּנֵי, «сыны», и традиционное обозначение народа Израиля; сноска предлагает более идиоматичный вариант.
- source_word: עֶרֶב
  choice: Вечером
  rationale: Существительное употреблено как временное обстоятельство; «вечером» естественно и не добавляет отсутствующего в тексте указания «сегодня».
- source_word: וִידַעְתֶּם
  choice: вы узнаете
  rationale: Передаёт будущий смысл формы и наступление знания вследствие предстоящего знамения.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что израильтяне узнают.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: הוֹצִיא אֶתְכֶם
  choice: вывел вас
  rationale: Каузативная порода глагола יצא в данном контексте означает «вывести»; прошедшее время указывает на уже совершившийся исход.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Сохраняет явно выраженное אֶרֶץ, «земля», в естественной и узнаваемой русской конструкции.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. «Яхве» сохраняет его как имя и является современной научно обоснованной русской передачей, тогда как «Господь» заменяет имя титулом, а «Иегова» отражает позднюю гибридную форму.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Порядок слов сделан естественным для русского языка; формула «сыны Израиля» сохранена ради прозрачности исходного выражения и снабжена сноской.
