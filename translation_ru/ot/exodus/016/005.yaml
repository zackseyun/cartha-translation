base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/005.yaml
  text: And on the sixth day[a], when they prepare what they bring in, it will be twice as much as what they gather day by day.
translation:
  language: ru
  text: А в шестой день, когда они приготовят то, что принесут, то, что они принесут, будет вдвое больше[a] того, что они собирают изо дня в день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это будет двойная доля по сравнению с тем, что они собирают каждый день».'
    reason: 'Лексико-синтаксическая альтернатива: מִשְׁנֶה может быть передано как «двойная доля», а עַל — более явно как указание на соотношение.'
lexical_decisions:
- source_word: וְהָיָה
  choice: А … будет
  rationale: Форма вводит будущее обстоятельство и его результат; такая передача естественна для русского повествовательного наставления.
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: в шестой день
  rationale: Прямая передача временного оборота без добавления отсутствующих в еврейском тексте слов «недели».
- source_word: וְהֵכִינוּ
  choice: когда они приготовят
  rationale: В данном контексте действие служит временным обстоятельством, связанным с шестым днём; совершенный вид уместно выражает предшествующее приготовление.
- source_word: אֵת אֲשֶׁר יָבִיאוּ
  choice: то, что принесут
  rationale: Относительное придаточное обозначает собранное и принесённое ими; русский оборот сохраняет широту исходного выражения.
- source_word: וְהָיָה מִשְׁנֶה
  choice: этого будет вдвое больше
  rationale: מִשְׁנֶה обозначает двойное количество; выбранная формулировка естественна по-русски и ясно передаёт количественное соотношение.
- source_word: עַל אֲשֶׁר
  choice: чем
  rationale: Предлог с относительным оборотом выражает здесь сравнение количества; русская сравнительная конструкция с «чем» передаёт эту функцию без буквализма.
- source_word: יִלְקְטוּ
  choice: они собирают
  rationale: לקט в контексте манны означает собирать; это наиболее прямой и естественный русский эквивалент.
- source_word: יוֹם יוֹם
  choice: изо дня в день
  rationale: Повтор существительного имеет распределительно-итеративное значение; оборот сохраняет повторяемость действия и ритмичность оригинала.
