base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/007.yaml
  text: And in the morning you will see the glory of Yahweh[a], because he has heard your grumblings against Yahweh. And what are we, that you grumble against us?
translation:
  language: ru
  text: А утром вы увидите славу Яхве[a], потому что Он услышал ваш ропот против Яхве. А мы кто такие, что вы ропщете на нас?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Он услышит ваш ропот против Яхве». Еврейскую конструкцию можно понимать не только причинно, но и как указание на время.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֹקֶר
  choice: А утром
  rationale: Сочетание союза с существительным имеет обстоятельственное значение времени. «А утром» естественно продолжает последовательность речи.
- source_word: וּרְאִיתֶם
  choice: вы увидите
  rationale: Форма глагола в данном контексте выражает предстоящее событие; современная русская форма будущего времени точно передаёт смысл.
- source_word: כְּבוֹד יְהוָה
  choice: славу Яхве
  rationale: כָּבוֹד обозначает явленное величие и присутствие Бога; «слава» сохраняет привычную библейскую и богословскую ёмкость выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: בְּשָׁמְעוֹ
  choice: потому что Он услышал
  rationale: Предлог ב при инфинитивной конструкции допускает причинное и временное понимание. В контексте причинное прочтение объясняет явление славы Яхве; временная возможность отмечена в сноске.
- source_word: תְּלֻנֹּתֵיכֶם
  choice: ваш ропот
  rationale: «Ропот» передаёт неодобрительную окраску недовольных, мятежных жалоб и естественно сочетается в русском с формой единственного собирательного значения.
- source_word: עַל יְהוָה
  choice: против Яхве
  rationale: Предлог עַל при обозначении ропота указывает на направленность против кого-либо.
- source_word: וְנַחְנוּ מָה
  choice: А мы кто такие
  rationale: Риторический вопрос подчёркивает незначительность Моисея и Аарона в сравнении с Яхве. Такая формулировка естественна в современном русском и сохраняет соединительный союз.
- source_word: כִּי תלונו עָלֵינוּ
  choice: что вы ропщете на нас
  rationale: כִּי вводит содержание риторического вопроса, а «ропщете на нас» идиоматично передаёт направленность действия и сохраняет связь с существительным «ропот».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» прямо передаёт тетраграмматон и не заменяет его титулом.
- issue: Причинное или временное значение בְּשָׁמְעוֹ
  choice: потому что Он услышал
  alternative: когда Он услышит
  rationale: 'Причинное прочтение хорошо передаёт логику контекста: слава Яхве будет явлена в ответ на ропот народа. Поскольку еврейская конструкция допускает и временное значение, оно сохранено в сноске.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Ропот / ропщете» сохраняет лексическую связь оригинала и его отрицательную оценку; местоимение «Он» помогает ясно обозначить Яхве как подлежащее придаточной части.
