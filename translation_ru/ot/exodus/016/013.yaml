  text: Вечером прилетели перепела и покрыли стан, а утром вокруг стана лежал слой росы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: Вечером
  rationale: Формула с וַיְהִי продолжает повествовательную последовательность; краткое обстоятельство времени естественно передаёт её в современном русском языке.
- source_word: וַתַּעַל הַשְּׂלָו
  choice: прилетели перепела
  rationale: עלה буквально обозначает движение вверх или приближение. Для перепелов в данном контексте «прилетели» естественно выражает появление птиц у стана, не вводя дополнительного богословского толкования.
- source_word: וַתְּכַס אֶת־הַמַּחֲנֶה
  choice: покрыли стан
  rationale: Глагол כסה означает «покрывать», а מַחֲנֶה здесь — место расположения израильтян; традиционно понятное и ёмкое русское «стан» соответствует контексту.
- source_word: וּבַבֹּקֶר
  choice: а утром
  rationale: Союз «а» естественно подчёркивает временное сопоставление вечера и утра, сохраняя последовательность еврейского текста.
- source_word: הָיְתָה שִׁכְבַת הַטַּל
  choice: лежал слой росы
  rationale: שִׁכְבָה обозначает лежащий слой или пласт. «Лежал слой росы» конкретно и естественно передаёт образ, тогда как буквальное «был слой» звучит менее выразительно.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: вокруг стана
  rationale: Оборот точно передаёт окружающее расположение росы по отношению к стану.
