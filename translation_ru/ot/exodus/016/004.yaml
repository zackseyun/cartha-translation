  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְ/נִ֨י מַמְטִ֥יר לָ/כֶ֛ם לֶ֖חֶם מִן הַ/שָּׁמָ֑יִם וְ/יָצָ֨א הָ/עָ֤ם וְ/לָֽקְטוּ֙ דְּבַר י֣וֹם בְּ/יוֹמ֔/וֹ לְמַ֧עַן אֲנַסֶּ֛/נּוּ הֲ/יֵלֵ֥ךְ בְּ/תוֹרָתִ֖/י אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/004.yaml
  text: Then Yahweh said to Moses[a], “Behold, I am raining bread from heaven for you, and the people shall go out and gather a day's portion each day, so that I may test them[c][b], whether they will walk in my law or not.”
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Вот, Я пошлю вам хлеб с неба, как дождь[a]. Народ будет выходить и каждый день собирать столько, сколько нужно на этот день[b], чтобы Я испытал его: будет ли он следовать Моему наставлению[c] или нет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «Я буду посылать вам с неба хлеб, как дождь». Еврейское причастие может обозначать начинающееся или близкое будущее действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дело дня в его день» — то есть необходимое на каждый день количество следует собирать в тот же день.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Моему закону». Еврейское слово תּוֹרָה может означать закон, наставление или учение.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, а не заменяет его титулом «Господь».
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Естественно вводит торжественное божественное объявление и сохраняет функцию еврейского указательного оборота.
- source_word: מַמְטִיר
  choice: пролью… словно дождь
  rationale: Передаёт каузативный образ ниспосылаемого дождя современным и понятным русским языком; совершенный вид выражает близкое предстоящее действие.
- source_word: לֶחֶם מִן הַשָּׁמַיִם
  choice: хлеб с неба
  rationale: Сохраняет конкретное слово «хлеб» и значимый библейский образ, не обобщая его до «пищи».
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: каждый день… столько, сколько нужно на этот день
  rationale: Естественно раскрывает еврейскую идиому о дневной потребности, не создавая впечатления заранее установленной меры.
- source_word: לְמַעַן אֲנַסֶּנּוּ
  choice: Так Я испытаю его
  rationale: Сохраняет цель действия и грамматическое единственное число суффикса, относящееся к собирательному существительному «народ».
- source_word: הֲיֵלֵךְ
  choice: будет ли он следовать
  rationale: Передаёт метафору поведения естественным русским оборотом без сужения смысла до одного лишь формального послушания.
- source_word: בְּתוֹרָתִי
  choice: Моему наставлению
  rationale: В данном, предсинайском контексте תּוֹרָה обозначает данное Богом руководство; «наставление» сохраняет этот широкий смысл.
- source_word: אִם לֹא
  choice: или нет
  rationale: Естественно завершает косвенный вопрос «будет ли… или нет».
theological_decisions:
- issue: Значение תּוֹרָה до дарования закона на Синае
  choice: Моему наставлению
  alternative: Моему закону
  rationale: «Наставление» точнее сохраняет широкий лексический диапазон תּוֹרָה в непосредственном контексте повелений о сборе хлеба; вариант «закон» возможен и отмечен в сноске, чтобы не устранять заветное звучание термина.
- issue: Число местоимения при собирательном הָעָם
  choice: его / он
  alternative: их / они
  rationale: Еврейские местоименный суффикс и глагол стоят в единственном числе и относятся к народу как к единому целому; русский язык допускает такое согласование и тем самым сохраняет форму оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Образ хлеба, ниспосылаемого подобно дождю, сохранён без архаизма «одождю». Согласование с «народом» в единственном числе следует грамматике оригинала и естественно звучит по-русски.
