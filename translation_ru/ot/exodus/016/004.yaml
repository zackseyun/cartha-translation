  source_fidelity: 'Основной смысл передан точно: хлеб остаётся конкретным «хлебом», сбор ограничен дневной потребностью, а испытание относится к народу как к собирательному единству. Однако «пролью вам с неба хлеб, словно дождь» синтаксически и образно неудачно: сравнение может относиться к способу «пролью», а не к падению хлеба, и глагол «пролить» здесь не воспроизводит прямо образ «дождить/проливать дождём». Целевой оборот לְמַעַן требует более явного «чтобы испытать», а не результативного «так испытаю».'
