base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/034.yaml
  text: As Yahweh commanded Moses[a], so Aaron placed it before the testimony for safekeeping.
translation:
  language: ru
  text: Как повелел Яхве Моисею, так Аарон положил сосуд перед свидетельством[a] на хранение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед свидетельством завета». Еврейское слово «свидетельство» — специальный термин, связанный со скинией; здесь оно может обозначать скрижали завета или то, что непосредственно с ними связано.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Как… так
  rationale: Передаёт соответствие действия Аарона данному повелению и естественно связывает обе части русского предложения.
- source_word: צִוָּה
  choice: повелел
  rationale: Сохраняет властный характер Божьего распоряжения и соответствует возвышенному, но современному библейскому регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: אֶל מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата повеления.
- source_word: וַיַּנִּיחֵהוּ
  choice: положил сосуд
  rationale: Глагол означает помещение предмета в назначенное место. Объектный суффикс буквально означает «его»; существительное «сосуд» восстановлено из непосредственного контекста стиха 33 ради ясности.
- source_word: אַהֲרֹן
  choice: Аарон
  rationale: Традиционная русская форма личного имени.
- source_word: לִפְנֵי
  choice: перед
  rationale: Сохраняет пространственное значение предлога и уместен в контексте святилища.
- source_word: הָעֵדֻת
  choice: свидетельством
  rationale: Сохраняет технический термин Пятикнижия и не сужает его без необходимости только до скрижалей или ковчега.
- source_word: לְמִשְׁמָרֶת
  choice: на хранение
  rationale: Естественно выражает цель помещения предмета — чтобы он сохранялся; не добавляет отсутствующей здесь идеи памятного знака.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет личное имя; транслитерация сохраняет это различие.
- issue: Референт термина הָעֵדֻת
  choice: свидетельство
  alternative: скрижали завета
  rationale: В контексте скинии термин может указывать на скрижали завета либо на связанный с ними священный объект; основной текст сохраняет присущую еврейскому выражению широту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Конструкция «как… так» отражает синтаксическую связь оригинала; «сосуд» явно восстанавливает подразумеваемый объект из предыдущего стиха.
