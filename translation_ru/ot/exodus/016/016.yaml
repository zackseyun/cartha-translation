  text: זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה לִקְט֣וּ מִמֶּ֔/נּוּ אִ֖ישׁ לְ/פִ֣י אָכְל֑/וֹ עֹ֣מֶר לַ/גֻּלְגֹּ֗לֶת מִסְפַּר֙ נַפְשֹׁ֣תֵי/כֶ֔ם אִ֛ישׁ לַ/אֲשֶׁ֥ר בְּ/אָהֳל֖/וֹ תִּקָּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/016.yaml
  text: 'This is the word that Yahweh has commanded: ‘Gather from it[a], each man according to his eating; an omer per person, according to the number of your persons. Each man shall take for those who are in his tent.’'
translation:
  language: ru
  text: 'Вот что повелел Яхве: «Собирайте её — каждый столько, сколько ему нужно для еды: по омеру на человека[a], по числу ваших людей. Пусть каждый берёт для тех, кто в его шатре».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по омеру на голову».'
    reason: Сноска сохраняет конкретную еврейскую идиому לַגֻּלְגֹּלֶת, тогда как основной текст передаёт её естественным русским выражением.
lexical_decisions:
- source_word: הַדָּבָר
  choice: вот что
  rationale: В формуле זֶה הַדָּבָר אֲשֶׁר צִוָּה речь идёт о содержании повеления. Русское «вот что повелел» естественно передаёт смысл, не превращая דָּבָר исключительно в произнесённое «слово».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: לִקְטוּ מִמֶּנּוּ
  choice: собирайте её
  rationale: Глагол означает сбор пищи, а местоимение по контексту относится к манне, которая в русском языке женского рода.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: каждый столько, сколько ему нужно для еды
  rationale: Еврейская идиома буквально соотносит сбор с потреблением каждого. Такая передача ясно выражает требуемое количество и сохраняет распределительный смысл אִישׁ.
- source_word: עֹמֶר
  choice: омер
  rationale: Название древней меры объёма транслитерировано, поскольку точная замена современной мерой была бы анахроничной.
- source_word: לַגֻּלְגֹּלֶת
  choice: на человека
  rationale: Буквально «на голову»; здесь выражение обозначает расчёт на каждого человека.
- source_word: מִסְפַּר נַפְשֹׁתֵיכֶם
  choice: по числу людей у вас
  rationale: נֶפֶשׁ в данном счётном контексте означает человека, а не отдельно мыслимую «душу».
- source_word: לַאֲשֶׁר בְּאָהֳלוֹ
  choice: для тех, кто в его шатре
  rationale: Сохранён конкретный образ шатра без сужения значения до семьи или домочадцев.
- source_word: תִּקָּחוּ
  choice: берите
  rationale: Императив второго лица множественного числа передан повелительной формой; сочетание с «каждый» сохраняет распределительную конструкцию оригинала.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не заменяет имя титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повеления. Формулировка остаётся конкретной и понятной; архаизмы сведены к необходимому названию меры «омер».
