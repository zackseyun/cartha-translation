  text: And it happened on the seventh day that some of the people went out to gather[a], but they found none.
translation:
  language: ru
  text: 'И было так: в седьмой день некоторые из народа вышли собирать, но ничего не нашли.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И случилось
  rationale: Последовательная повествовательная форма от היה вводит очередное событие; этот оборот сохраняет ход еврейского повествования и остаётся естественным для литературного русского языка.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: в седьмой день
  rationale: Прямо передаёт временное выражение, не добавляя отсутствующих в еврейском тексте слов «недели».
- source_word: יָצְאוּ
  choice: вышли
  rationale: Форма от יצא обозначает выход из стана или жилища; «вышли» естественно передаёт направление движения в данном контексте.
- source_word: מִן הָעָם
  choice: некоторые из народа
  rationale: 'Предлог מן имеет здесь партитивное значение: речь идёт о части народа, а не обо всём народе.'
- source_word: לִלְקֹט
  choice: собирать
  rationale: Инфинитив от לקט означает «собирать»; объект — манна — ясен из контекста и потому не добавлен в основной текст.
- source_word: וְלֹא מָצָאוּ
  choice: но ничего не нашли
  rationale: 'Буквально: «и не нашли». Союз «но» естественно выражает контраст между целью выхода и его безрезультатностью, а «ничего» передаёт подразумеваемый объект без его уточнения.'
