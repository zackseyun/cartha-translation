source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם ה֚וּא אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה שַׁבָּת֧וֹן שַׁבַּת קֹ֛דֶשׁ לַֽ/יהוָ֖ה מָחָ֑ר אֵ֣ת אֲשֶׁר תֹּאפ֞וּ אֵפ֗וּ וְ/אֵ֤ת אֲשֶֽׁר תְּבַשְּׁלוּ֙ בַּשֵּׁ֔לוּ וְ/אֵת֙ כָּל הָ֣/עֹדֵ֔ף הַנִּ֧יחוּ לָ/כֶ֛ם לְ/מִשְׁמֶ֖רֶת עַד הַ/בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/023.yaml
  text: 'And he said to them[a], “This is what Yahweh has spoken: Tomorrow is a solemn rest, a holy Sabbath to Yahweh. What you will bake, bake; and what you will boil, boil; and all that is left over[b], set aside for yourselves to be kept until the morning.”'
translation:
  language: ru
  text: 'Он сказал им: «Вот что сказал Яхве: завтра — день полного покоя, святая суббота, посвящённая Яхве[a]. Что будете печь — пеките, что будете варить — варите[b], а всё оставшееся отложите для себя на хранение до утра».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «суббота, святая для Яхве».'
    reason: Сочетание שַׁבַּת קֹדֶשׁ לַיהוָה допускает передачу как «святая суббота, посвящённая Яхве» либо как «суббота, святая для Яхве».
  - marker: b
    text: Еврейский глагол может означать как «варить», так и шире — «готовить пищу».
    reason: Смысловой диапазон בשל в данном контексте не требует непременно узкого значения способа приготовления.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Он сказал им
  rationale: Обычная повествовательная формула с wayyiqtol; в русском продолжение передаётся без обязательного начального союза «и».
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: Вот что сказал Яхве
  rationale: Указательная конструкция отсылает к предстоящему сообщению; совершённость речи естественно передаётся прошедшим временем.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного заветного имени, а не его замена титулом.
- source_word: שַׁבָּתוֹן
  choice: полный покой
  rationale: Существительное обозначает особый, усиленно выраженный покой или прекращение труда; «полный покой» ясно и естественно передаёт этот смысл.
- source_word: שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: святая суббота Яхве
  rationale: Сохраняются святость дня и его посвящённость Яхве; возможная синтаксическая трактовка отмечена в сноске.
- source_word: אֵת אֲשֶׁר תֹּאפוּ אֵפוּ
  choice: Что будете печь — пеките
  rationale: Повтор однокоренных глагольных форм сохраняет повелительное ударение и параллелизм оригинала.
- source_word: וְאֵת אֲשֶׁר תְּבַשְּׁלוּ בַּשֵּׁלוּ
  choice: что будете варить — варите
  rationale: Сохраняются повтор глагола и симметрия с предыдущим предписанием; смысловой диапазон глагола отмечен в сноске.
- source_word: כָּל הָעֹדֵף
  choice: всё оставшееся
  rationale: Причастная форма обозначает остаток или излишек; выбран нейтральный современный оборот.
- source_word: הַנִּיחוּ לָכֶם לְמִשְׁמֶרֶת
  choice: отложите для себя, чтобы сохранить
  rationale: Переданы намеренное откладывание, адресат пользы и цель хранения.
- source_word: עַד הַבֹּקֶר
  choice: до утра
  rationale: Естественная русская передача временного предела без ненужного уточнения «следующего».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Связь выражений שַׁבָּתוֹן и שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: «полный покой, святая суббота Яхве» как два приложенных определения одного дня
  alternative: «полный покой — суббота, святая для Яхве»
  rationale: Еврейская именная последовательность допускает близкие способы членения; основной текст сохраняет её компактность, а сноска указывает естественную альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи и ясным ритмическим параллелизмом. Повтор «печь — пеките; варить — варите» намеренно сохранён как выразительная черта еврейского текста. Архаизмы и конфессионально окрашенные замены имени Яхве не используются.
