base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/002.yaml
  text: And the whole congregation of the sons of Israel grumbled against Moses and against Aaron in the wilderness[a].
translation:
  language: ru
  text: И вся община сынов Израиля[a] роптала на Моисея и Аарона в пустыне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян»; традиционно: «детей Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלּוֹנוּ
  choice: роптало
  rationale: Глагол выражает недовольное, враждебно направленное сетование общины на её руководителей. «Роптало» сохраняет отрицательный оттенок и естественно сочетается с предлогом «на».
- source_word: כָּל
  choice: всё
  rationale: 'При собирательном существительном подчёркивает полноту общины; по-русски естественно: «всё общество».'
- source_word: עֲדַת
  choice: общество
  rationale: Здесь עֵדָה обозначает народ Израиля как единую общину. «Общество» передаёт корпоративный смысл без узкоцерковной окраски слова «собрание».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Передаёт грамматически мужскую конструкцию и сохраняет традиционный библейский образ родства; более гладкий этноним указан в сноске.
- source_word: עַל
  choice: на
  rationale: В сочетании «роптать на кого-либо» русский предлог естественно передаёт направленность жалобы и противостояние.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Обычное русское соответствие מִדְבָּר; обозначает необжитую пустынную местность, не обязательно песчаную.
theological_decisions:
- issue: Передача корпоративного обозначения בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: 'израильтян; традиционно: детей Израиля'
  rationale: Основной текст сохраняет мужскую форму и образ происхождения от Израиля, не сводя выражение к нейтральному этнониму. Более естественные варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский с умеренно библейской возвышенностью. «Роптало» понятно в контексте и точнее передаёт коллективное недовольство, чем нейтральное «жаловалось».
