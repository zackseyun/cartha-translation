base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/009.yaml
  text: Then Moses said to Aaron[a], “Say to all the congregation of the sons of Israel, ‘Come near before Yahweh[b], for he has heard your grumblings.’”
translation:
  language: ru
  text: 'Тогда Моисей сказал Аарону: «Скажи всему обществу израильтян[a]: „Подойдите к Яхве[b], потому что Он услышал ваш ропот“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всему обществу сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «приблизьтесь к Яхве»; еврейское выражение буквально включает «перед Яхве», то есть в Его присутствие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: אֱמֹר
  choice: Скажи
  rationale: Императив вводит порученную Аарону прямую речь; «скажи» здесь естественнее, чем более общее «говори».
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: всему обществу израильтян
  rationale: עֵדָה обозначает общину как единое собрание, а идиоматическое «израильтян» ясно передаёт בְּנֵי יִשְׂרָאֵל без ненужной архаизации.
- source_word: קִרְבוּ לִפְנֵי
  choice: Подойдите к
  rationale: Императив קרב выражает приближение, а לִפְנֵי указывает на приближение в присутствие Яхве. Русское «подойдите к» естественно объединяет эти значения; более буквальная пространственная формулировка дана в примечании.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание повеления и в современной русской речи ясно выражает причинную связь.
- source_word: שָׁמַע
  choice: услышал
  rationale: Перфект обозначает уже совершившееся действие, служащее основанием последующего призыва.
- source_word: תְּלֻנֹּתֵיכֶם
  choice: ваш ропот
  rationale: Собирательное «ропот» передаёт не просто жалобы, а недовольное, осуждаемое сетование народа; местоимение второго лица множественного числа отражено формой «ваш».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; форма «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер приближения к Яхве
  choice: Подойдите к Яхве
  alternative: Предстаньте перед Яхве
  rationale: Текст говорит о приближении в Божье присутствие, но сам по себе не уточняет культовый обряд. Выбранная формулировка сохраняет призыв приблизиться, не добавляя церемониальных деталей.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Прямая речь оформлена вложенными кавычками; заглавная буква в местоимении «Он» подчёркивает отнесённость к Яхве, не меняя смысла исходного текста.
