base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/029.yaml
  text: See[a], for Yahweh has given you the Sabbath; therefore on the sixth day he gives you bread for two days. Let each man stay in his place; let no man go out from his place on the seventh day.
translation:
  language: ru
  text: 'Смотрите: ибо Яхве дал вам субботу; поэтому в шестой день Он даёт вам хлеб на два дня. Пусть каждый[a] остаётся на своём месте; пусть никто не выходит со своего места в седьмой день.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте: «каждый мужчина» и «ни один мужчина»; форма мужского рода употреблена распределительно — о каждом члене общины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: Смотрите
  rationale: Повелительная форма множественного числа может призывать как посмотреть, так и осознать сказанное. «Смотрите» сохраняет прямую силу еврейского глагола, а последующее пояснение раскрывает смысл призыва.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: נָתַן לָכֶם הַשַּׁבָּת
  choice: дал вам субботу
  rationale: Совершенный вид передаёт субботу как уже дарованную Израилю; русский порядок слов естественен и сохраняет смысл дара.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: 'Ясно выражает следствие: дар субботы объясняет двойное обеспечение хлебом в шестой день.'
- source_word: נֹתֵן
  choice: даёт
  rationale: Причастная форма обозначает происходящее или установленное действие; настоящее время естественно передаёт регулярное Божье обеспечение.
- source_word: לֶחֶם יוֹמָיִם
  choice: хлеб на два дня
  rationale: Сохраняет конкретное «хлеб», не расширяя его до общего «пища», и естественно передаёт буквальный смысл «хлеб двух дней».
- source_word: שְׁבוּ אִישׁ תַּחְתָּיו
  choice: Пусть каждый остаётся на своём месте
  rationale: Глагол ישב здесь означает оставаться, а תַּחְתָּיו идиоматически указывает на место, где человек находится. Формулировка естественна по-русски и сохраняет распределительный смысл.
- source_word: אַל יֵצֵא אִישׁ מִמְּקֹמוֹ
  choice: пусть никто не выходит со своего места
  rationale: Отрицательная юссивная конструкция выражает запрет. «Никто» естественно передаёт распределительное איש в отрицательном высказывании, а повтор слова «место» сохраняет структуру оригинала.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: в седьмой день
  rationale: Точно передаёт последовательность дней без добавочного толкования.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон, личное имя Бога. «Яхве» сохраняет имя и наиболее вероятную научную реконструкцию его произношения, не подменяя его титулом.
- issue: Распределительное употребление אִישׁ
  choice: каждый / никто
  alternative: каждый мужчина / ни один мужчина
  rationale: В данном общинном предписании существительное мужского рода употреблено распределительно. Естественные русские формы «каждый» и «никто» передают охват каждого члена общины, а примечание сохраняет сведения о форме оригинала без искусственного ограничения заповеди только взрослыми мужчинами.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Двоеточие после «Смотрите» естественно вводит содержание, которое следует осознать; точка с запятой сохраняет тесную причинно-следственную связь двух частей. Местоимение «Он» написано с прописной буквы как допустимый русский религиозный обычай, при этом в оригинале отдельного местоимения нет.
