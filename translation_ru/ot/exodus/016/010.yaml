  text: וַ/יְהִ֗י כְּ/דַבֵּ֤ר אַהֲרֹן֙ אֶל כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל וַ/יִּפְנ֖וּ אֶל הַ/מִּדְבָּ֑ר וְ/הִנֵּה֙ כְּב֣וֹד יְהוָ֔ה נִרְאָ֖ה בֶּ/עָנָֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/010.yaml
  text: And it happened[a], as Aaron spoke to the whole congregation of the sons of Israel, that they turned toward the wilderness, and behold[b], the glory of Yahweh appeared in the cloud.
translation:
  language: ru
  text: 'И случилось так: пока Аарон говорил всему обществу сынов Израиля, они повернулись к пустыне — и вот, слава Яхве явилась в облаке.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И случилось так
  rationale: Передаёт повествовательную формулу, вводящую следующее событие, естественным современным русским языком без архаичного «и было».
- source_word: כְּדַבֵּר אַהֲרֹן
  choice: пока Аарон говорил
  rationale: Предлог כְּ с инфинитивом указывает на одновременность; «пока… говорил» ясно передаёт продолжающееся действие, на фоне которого произошло последующее.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: всему обществу сынов Израиля
  rationale: «Общество» передаёт עֵדָה как общину народа, а «сыны Израиля» сохраняет родственную форму еврейского выражения, оставаясь понятным в библейском контексте.
- source_word: וַיִּפְנוּ אֶל הַמִּדְבָּר
  choice: они повернулись к пустыне
  rationale: Глагол פנה с אֶל обозначает поворот в направлении пустыни; перевод не добавляет идеи движения в неё.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет указательную и привлекающую внимание силу частицы, естественно и торжественно звуча по-русски.
- source_word: כְּבוֹד יְהוָה
  choice: слава Яхве
  rationale: «Слава» передаёт כָּבוֹד как видимое проявление Божьего величия, а личное имя יהוה транслитерировано как «Яхве».
- source_word: נִרְאָה
  choice: явилась
  rationale: 'Нифаль от ראה здесь естественно передаётся возвратным по смыслу глаголом «явилась»: слава стала видимой.'
- source_word: בֶּעָנָן
  choice: в облаке
  rationale: Артикль указывает на определённое облако; перевод сохраняет эту определённость без добавочного толкования.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, а не титул; «Яхве» непосредственно передаёт тетраграмматон и не заменяет его титулом.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Выбранный вариант сохраняет родственную образность и форму мужского множественного числа исходного выражения, не исключая его общепринятого значения — народ Израиля.
- issue: Характер явления славы
  choice: слава Яхве явилась в облаке
  alternative: славу Яхве увидели в облаке
  rationale: Грамматическим субъектом является «слава Яхве». Перевод не переносит акцент на наблюдателей и не уточняет природу явления сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Двоеточие раскрывает повествовательную формулу וַיְהִי, а тире подчёркивает внезапность וְהִנֵּה. Архаизмы сведены к минимуму; традиционное «сыны Израиля» сохранено ради точности исходного образа.
