  source_fidelity: 'Перевод точно передаёт последовательность и синтаксические отношения еврейского текста: временное обстоятельство при речи Аарона, обращённой ко всему обществу сынов Израиля; поворот народа к пустыне; затем внезапно отмеченное явление славы Яхве в определённом облаке. «Пока Аарон говорил» корректно передаёт כְּדַבֵּר как одновременное действие и не вводит дополнительного смысла.'
