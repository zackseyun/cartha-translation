lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: назвал
  rationale: Глагол קרא в данной конструкции обозначает наречение имени; единственное число согласовано с собирательным выражением «дом Израиля».
- source_word: בֵּית יִשְׂרָאֵל
  choice: Дом Израиля
  rationale: Сохранено буквальное корпоративное обозначение народа; оно понятно и уместно в современном литературном русском языке.
- source_word: אֶת־שְׁמוֹ מָן
  choice: назвал это манной
  rationale: Естественная русская формула именования передаёт смысл буквального «назвал имя его ман»; традиционная форма «манна» обеспечивает узнаваемость.
- source_word: כְּזֶרַע גַּד לָבָן
  choice: похожа на белое семя кориандра
  rationale: גַּד обычно отождествляется с кориандром; לָבָן передано как определение семени, при сохранении возможной синтаксической неоднозначности в примечании.
- source_word: וְטַעְמוֹ
  choice: а вкус её
  rationale: טַעַם здесь означает вкус; местоимение женского рода соотнесено с русским словом «манна».
- source_word: כְּצַפִּיחִת בִּדְבָשׁ
  choice: на лепёшку с мёдом
  rationale: צַפִּיחִת обозначает тонкое печёное изделие, лепёшку или вафлю; «лепёшка» — ясный и естественный русский эквивалент, а בִּדְבָשׁ передано как состав или вкусовая добавка.
