  text: שָׁמַ֗עְתִּי אֶת תְּלוּנֹּת֮ בְּנֵ֣י יִשְׂרָאֵל֒ דַּבֵּ֨ר אֲלֵ/הֶ֜ם לֵ/אמֹ֗ר בֵּ֤ין הָֽ/עַרְבַּ֨יִם֙ תֹּאכְל֣וּ בָשָׂ֔ר וּ/בַ/בֹּ֖קֶר תִּשְׂבְּעוּ לָ֑חֶם וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/012.yaml
  text: I have heard the grumblings of the sons of Israel[a]. Speak to them, saying, ‘Between the evenings you shall eat meat, and in the morning you shall be filled with bread[b], and you shall know that I am Yahweh your God.’
translation:
  language: ru
  text: 'Я услышал ропот сынов Израиля[a]. Обратись к ним и скажи: «В сумерках[b] вы будете есть мясо, а утром насытитесь хлебом и узнаете, что Я — Яхве, ваш Бог».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян»; буквально: «сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «между вечерами» — еврейское выражение, обозначающее сумеречное время.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Я услышал
  rationale: Перфект первого лица обозначает уже состоявшееся действие, непосредственно относящееся к последующему ответу Бога; в русском контексте естественно простое прошедшее время.
- source_word: תְּלוּנֹּת
  choice: ропот
  rationale: Собирательное «ропот» передаёт неоднократные недовольные жалобы и сохраняет характерную для повествования пустыни отрицательную окраску.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально отражает мужское множественное число и устойчивую родословно-народную формулу еврейского текста; более гладкий вариант указан в сноске.
- source_word: דַּבֵּר אֲלֵהֶם לֵאמֹר
  choice: Обратись к ним и скажи
  rationale: Естественно по-русски передаёт повеление говорить и вводную формулу לֵאמֹר, не прибегая к тяжеловесному «говори им, говоря».
- source_word: בֵּין הָעַרְבַּיִם
  choice: в сумерках
  rationale: Передаёт временной смысл еврейской идиомы современным понятным русским языком; буквальная форма сохранена в сноске.
- source_word: תֹּאכְלוּ בָשָׂר
  choice: вы будете есть мясо
  rationale: בָשָׂר в пищевом контексте означает «мясо», а имперфект здесь выражает обещанное будущее действие.
- source_word: וּבַבֹּקֶר תִּשְׂבְּעוּ לָחֶם
  choice: а утром насытитесь хлебом
  rationale: «Насытитесь» точно и естественно передаёт состояние сытости, выраженное תִּשְׂבְּעוּ, а творительный падеж соответствует русскому управлению.
- source_word: וִידַעְתֶּם
  choice: и узнаете
  rationale: В данном контексте глагол выражает наступающее вследствие Божьего действия узнавание и признание, а не только обладание отвлечённым знанием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личная форма Божьего имени передана русской транслитерацией, а не заменена титулом.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Несмотря на морфологическую форму множественного числа, слово относится к единому Богу Израиля; местоименная форма сохраняет обращение ко всему народу.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога, поэтому оно сохраняется как имя, а не заменяется традиционным титулом.
- issue: Передача выражения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Основной текст сохраняет явную форму «сыны», не превращая её без указания в нейтральное название народа; естественная альтернатива приведена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис речевой формулы слегка сглажен ради естественности, тогда как образ насыщения хлебом и личное имя Яхве сохранены. Маркеры сносок размещены при тех словах, к которым относятся; их порядок исправлен относительно предоставленного английского слоя.
