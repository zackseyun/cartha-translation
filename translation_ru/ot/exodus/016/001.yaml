  source_fidelity: 'Основной текст в целом точно передаёт еврейское повествование: переход из Елима, прибытие всего общества, локализацию пустыни и дату относительно исхода. Однако примечание b не передаёт существенную функцию английского примечания: оно должно устранять возможное смешение названия «Син» со словом «грех», а не только различать Син и Синай. Выражение «Египетская земля» формально возможно, но менее естественно и менее соответствует обычному русскому библейскому употреблению, чем «земля Египта».'
