base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/001.yaml
  text: They set out from Elim[a], and the whole congregation of the sons of Israel came to the wilderness of Sin, which is between Elim and Sinai[b], on the fifteenth day of the second month after they had gone out from the land of Egypt.
translation:
  language: ru
  text: Они двинулись из Елима, и всё общество сынов Израиля[a] пришло в пустыню Син[b], которая находится между Елимом и Синаем, в пятнадцатый день второго месяца после их выхода из земли Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов Израиля». Это устойчивое название всего народа Израиля, а не только мужчин.'
    reason: lexical_alternative
  - marker: b
    text: Син — географическое название, а не слово «грех».
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: они двинулись
  rationale: Глагол נסע в повествовании о странствиях означает сняться с места и отправиться дальше. «Двинулись» естественно передаёт начало следующего перехода.
- source_word: מֵאֵילִם
  choice: из Елима
  rationale: אֵילִם — географическое название; передано традиционной русской транслитерацией «Елим».
- source_word: וַיָּבֹאוּ
  choice: пришло
  rationale: Обычное значение בוא — «приходить». Единственное число согласовано с собирательным существительным «общество».
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: всё общество сынов Израиля
  rationale: «Всё общество» точно передаёт כָּל עֲדַת, а «сыны Израиля» сохраняет семейно-национальный образ исходного выражения, относящийся ко всему народу.
- source_word: אֶל מִדְבַּר סִין
  choice: в пустыню Син
  rationale: מִדְבַּר обозначает пустынную, малонаселённую местность; Син — собственное географическое название.
- source_word: אֲשֶׁר בֵּין אֵילִם וּבֵין סִינָי
  choice: которая находится между Елимом и Синаем
  rationale: Относительное предложение естественно передаёт географическое положение пустыни; добавленное «находится» явно выражает подразумеваемую в еврейском тексте связку.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשֵּׁנִי
  choice: в пятнадцатый день второго месяца
  rationale: Использована нормативная русская форма календарной даты.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: после их выхода из Египетской земли
  rationale: Инфинитивная конструкция задаёт исходную точку датировки. «После их выхода» ясно передаёт временное отношение, а «Египетская земля» сохраняет компонент אֶרֶץ.
