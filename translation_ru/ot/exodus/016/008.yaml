base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/008.yaml
  text: And Moses said[a], “When Yahweh gives you meat to eat in the evening and bread in the morning to the full, because Yahweh hears your grumblings that you are grumbling against him—what are we? Your grumblings are not against us, but against Yahweh.”
translation:
  language: ru
  text: 'Моисей сказал: «Когда Яхве даст[a] вам вечером мясо для еды, а утром — хлеб досыта, — это потому, что Яхве слышит ваш ропот, которым вы ропщете против него[b]. А мы что? Ваш ропот не против нас, а против Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда Яхве даст»; еврейская конструкция сжата. Слова «это потому, что» восполняют подразумеваемую связь в русском предложении.'
    reason: Передача временной инфинитивной конструкции и еврейского эллипсиса.
  - marker: b
    text: 'Буквально: «ваш ропот, которым вы ропщете». Повтор однокоренных существительного и глагола усиливает обвинение.'
    reason: Сохранение выразительного повтора исходного текста.
lexical_decisions:
- source_word: בְּתֵת
  choice: даст
  rationale: Инфинитивная конструкция с בְּ выражает обстоятельство времени («когда даст»). В русском она передана самостоятельным сказуемым, чтобы избежать незавершённого придаточного предложения; временной оттенок отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя, обозначенное тетраграмматоном, а не заменяющий его титул.
- source_word: בָּשָׂר לֶאֱכֹל
  choice: мясо в пищу
  rationale: В данном контексте בָּשָׂר означает мясо как пищу; такая формулировка естественно передаёт также целевой инфинитив לֶאֱכֹל.
- source_word: לֶחֶם לִשְׂבֹּעַ
  choice: хлеб досыта
  rationale: Сохраняется конкретное «хлеб», а לִשְׂבֹּעַ передаёт насыщение.
- source_word: בִּשְׁמֹעַ
  choice: потому что ... слышит
  rationale: 'В контексте конструкция указывает на основание Божьего действия: Яхве откликается на ропот народа. Настоящее время передаёт продолжающееся внимание к их ропоту.'
- source_word: תְּלֻנֹּתֵיכֶם / מַלִּינִם
  choice: ваш ропот, которым вы ропщете
  rationale: Однокоренные существительное и глагол сохраняют подчёркнутый повтор исходного текста и мотив ропота в пустыне.
- source_word: וְנַחְנוּ מָה
  choice: А мы что?
  rationale: Сохранено буквальное вопросительное «что», подчёркивающее незначительность Моисея и Аарона как адресатов ропота; русское выражение кратко и естественно.
- source_word: לֹא עָלֵינוּ תְלֻנֹּתֵיכֶם כִּי עַל יְהוָה
  choice: Не против нас ваш ропот, а против Яхве
  rationale: Сохраняются отрицание, контраст и направленность ропота против Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Адресат ропота народа
  choice: ропот направлен не против Моисея и Аарона, а против Яхве
  alternative: понимать слова лишь как жалобу на обстоятельства
  rationale: Предлог עַל и явное противопоставление в еврейском тексте представляют ропот как направленный против Яхве, при этом посредники не объявляются незначимыми вообще, а только не являются конечным адресатом жалобы.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранены краткий риторический вопрос «А мы что?» и однокоренной повтор «ропот — ропщете»; архаизмы и конфессионально маркированные замены имени Бога не использованы.
