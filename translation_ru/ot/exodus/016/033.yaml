base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/033.yaml
  text: And Moses said to Aaron[a], “Take one jar, and put an omerful of manna in it, and place it before Yahweh, to be kept throughout your generations.”
translation:
  language: ru
  text: 'И сказал Моисей Аарону: «Возьми один сосуд[a], положи в него полную меру омера манны и поставь его перед Яхве; пусть он хранится на все ваши поколения».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кувшин»; точный вид названного здесь сосуда неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִנְצֶנֶת
  choice: сосуд
  rationale: Редкое название ёмкости; нейтральное «сосуд» не уточняет материал или назначение, которых текст не указывает.
- source_word: מְלֹא הָעֹמֶר
  choice: полную меру омера
  rationale: Передаёт как меру объёма «омер», так и значение полноты в מְלֹא; формулировка понятна и не превращает омер в название самого сосуда.
- source_word: מָן
  choice: манны
  rationale: Устоявшееся русское наименование вещества; родительный падеж обусловлен количественным оборотом.
- source_word: וְתֶן שָׁמָּה
  choice: положи в него
  rationale: Буквально «положи туда»; в русском контекстуальная отсылка к только что названному сосуду естественнее выражается словами «в него».
- source_word: וְהַנַּח אֹתוֹ
  choice: поставь его
  rationale: Глагол означает поместить или поставить; местоимение мужского рода естественно относится к сосуду с манной.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Сохраняет пространственно-культовое выражение «перед / в присутствии» и передаёт личное имя Бога транслитерацией.
- source_word: לְמִשְׁמֶרֶת לְדֹרֹתֵיכֶם
  choice: чтобы он хранился для будущих поколений
  rationale: Естественно выражает назначение сохраняемого сосуда и длительную значимость для последующих поколений.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. «Яхве» сохраняет имя, не заменяя его титулом.
- issue: Предмет, подлежащий хранению
  choice: местоимение «он» отнесено к сосуду с манной
  alternative: безличное «для хранения» либо отнесение только к манне
  rationale: Грамматически אֹתוֹ имеет мужской род и естественно соотносится с сосудом; при этом хранится сосуд вместе с его содержимым.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранено начальное повествовательное «И сказал». Термин «омер» оставлен как древняя мера и пояснён в самом обороте словом «мера».
