  language: ru
  text: Омер — десятая часть ефы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Омер и ефа — древнееврейские меры объёма сыпучих тел; здесь омер определяется как одна десятая ефы.
    reason: cultural_note
lexical_decisions:
- source_word: וְ
  choice: не передано отдельно
  rationale: Союз вводит пояснительное замечание; в русском определительном предложении его функция естественно выражается самим контекстом, без добавления «и» или «теперь».
- source_word: הָעֹמֶר
  choice: омер
  rationale: עֹמֶר — древнееврейская мера объёма сыпучих тел. Транслитерация сохраняет точное название единицы; определённый артикль в обобщающем определении по-русски отдельно не выражается.
- source_word: עֲשִׂרִית
  choice: десятая часть
  rationale: Слово обозначает одну десятую; выражение «десятая часть» точно и естественно передаёт дробное отношение.
- source_word: הָאֵיפָה
  choice: ефы
  rationale: אֵיפָה — древнееврейская мера объёма сыпучих тел. Сохранено традиционное русское название «ефа» в форме родительного падежа; артикль отдельно не передаётся.
- source_word: הוּא
  choice: —
  rationale: Местоимение служит связкой в именном предложении. В русском настоящем времени это отношение естественно передаётся тире без глагола «есть».
