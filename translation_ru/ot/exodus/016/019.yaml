  source_fidelity: 'Смысл запрета передан в целом верно: Моисей запрещает каждому сохранять манну до утра. Однако «от этого» неестественно в данном эллиптическом контексте и не передаёт ясно отрицательное «ничего из неё».'
  naturalness: '«Пусть никто не оставляет от этого до утра» звучит по-русски неидиоматично: оборот «оставлять от этого» без дополнения воспринимается как неполный. «Пусть никто не оставляет ничего до утра» кратко, ясно и литературно.'
  terminology: Имя «Моисей» нормативно. Нейтрально-дистрибутивное «никто» естественно передаёт אִישׁ в сочетании с запретом, не добавляя толкования.
  issues:
