  text: 'И сказал им Моисей: «Пусть никто не оставляет ничего до утра».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав-последовательный продвигает повествование; традиционная и естественная русская повествовательная связка «И сказал» сохраняет связь с предыдущим контекстом.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: אֲלֵהֶם
  choice: им
  rationale: Прямая передача предлога אֶל с местоименным суффиксом 3-го лица множественного числа без уточняющего добавления «народу».
- source_word: אִישׁ אַל
  choice: Пусть никто не
  rationale: אִישׁ имеет здесь дистрибутивное, обобщающее значение, а אַל выражает запрет. «Пусть никто не» естественно передаёт запрет, распространяющийся на каждого.
- source_word: יוֹתֵר
  choice: оставляет
  rationale: В контексте манны глагол от יתר означает оставлять часть, сохранять остаток; русское «оставлять» ясно и естественно.
- source_word: מִמֶּנּוּ
  choice: от этого
  rationale: Предлог מן с местоименным суффиксом указывает на ранее названную пищу; «от этого» сохраняет структуру исходного выражения и отсылку к контексту.
- source_word: עַד בֹּקֶר
  choice: до утра
  rationale: Обычная и точная русская передача временного предела.
