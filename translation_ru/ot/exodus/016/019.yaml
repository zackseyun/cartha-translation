    issue: Неудачная передача מִמֶּנּוּ как «от этого».
    rationale: В русском «оставлять от этого» без слова «ничего» или явного существительного звучит неполно и неясно. При отрицательном запрете «ничего» естественно выражает «ничего из этого/из неё», сохраняя смысл исходного текста.
