base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/020.yaml
  text: But they did not listen to Moses[a], and some men left some of it until morning, and it bred worms and stank[b]; and Moses was angry with them.
translation:
  language: ru
  text: 'Но они не послушали Моисея[a]: некоторые оставили часть манны до утра; в ней завелись черви[b], и она стала смердеть. Моисей разгневался на них.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не вняли Моисею». В еврейском выражении подразумевается отказ слушать, проявившийся в неповиновении.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в нём возникли черви».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֶל מֹשֶׁה
  choice: не послушали Моисея
  rationale: Сочетание שׁמע с אֶל означает «слушать, внимать» и в данном контексте подразумевает неповиновение. Русское «не послушали» естественно сохраняет оба оттенка, не сводя выражение только к формальному «не повиновались».
- source_word: וַיּוֹתִרוּ אֲנָשִׁים מִמֶּנּוּ
  choice: некоторые оставили часть собранного
  rationale: Hифиль глагола יתר означает «оставлять, сохранять остаток». «Некоторые» естественно передаёт неопределённую группу אֲנָשִׁים, а «часть собранного» ясно отсылает к манне, не вставляя её название там, где его нет в стихе.
- source_word: עַד בֹּקֶר
  choice: до утра
  rationale: Прямое и естественное соответствие временному выражению.
- source_word: וַיָּרֻם תּוֹלָעִים
  choice: в нём завелись черви
  rationale: Буквально конструкция описывает, как в оставленном «возникли» черви. «Завелись черви» — естественное современное русское выражение, сохраняющее образ и результат.
- source_word: וַיִּבְאַשׁ
  choice: оно стало смердеть
  rationale: Глагол означает «смердеть, издавать дурной запах». «Стало смердеть» передаёт наступившее состояние и сохраняет резкость повествования.
- source_word: וַיִּקְצֹף עֲלֵהֶם מֹשֶׁה
  choice: Моисей разгневался на них
  rationale: קצף обозначает сильный гнев; «разгневался» уместно в dignified narrative register и не преувеличивает интенсивность до «пришёл в ярость».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. «Смердеть» выбрано как выразительное, но понятное слово, соответствующее резкости еврейского глагола. Местоимения согласованы с подразумеваемым «собранным»/веществом, а не с прямо не названной в стихе манной.
