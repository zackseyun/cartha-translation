  yaml_path: translation/ot/exodus/016/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве сказал Моисею[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «Яхве» (יהוה, YHWH); традиционно переводится «Господь».'
    reason: Пояснение передачи тетраграмматона и традиционного варианта.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма с последовательным ו вводит новое событие повествования. В сочетании с לֵאמֹר естественный современный русский оборот «сказал …:» избегает тяжеловесного «говорил … говоря».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶל
  choice: Моисею
  rationale: Направленность речи, выраженная предлогом אֶל, естественно передана русским дательным падежом при глаголе «сказал».
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общепринятая русская форма личного имени; в контексте употреблён дательный падеж «Моисею».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитивная формула вводит прямую речь следующего стиха; в современном русском её функцию естественно выполняет двоеточие.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон. Форма «Яхве» сохраняет личное имя; примечание сообщает читателю традиционную замену «Господь».
translation_notes:
  register: 'Современный литературный русский язык. Формула речи передана естественным русским синтаксисом: «сказал Моисею:», поскольку прямая речь следует в следующем стихе. Стиль краткий и достойный, без искусственного калькирования еврейского «говоря».'
