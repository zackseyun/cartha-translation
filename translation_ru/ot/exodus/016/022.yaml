base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/022.yaml
  text: And it happened on the sixth day that they gathered twice as much bread[a], two omers for each person, and all the leaders of the congregation came and told Moses.
translation:
  language: ru
  text: И вот, в шестой день они собрали хлеба вдвое больше — по два омера[a] на человека. Тогда все главы общины пришли и сообщили об этом Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Омер — древнеизраильская мера объёма сыпучих веществ.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: И вот
  rationale: Передаёт переход к новому событию в повествовании без архаичного русского оборота «и было».
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: в шестой день
  rationale: Прямой и естественный перевод временного выражения.
- source_word: לָקְטוּ
  choice: собрали
  rationale: В контексте манны глагол означает собирание предоставленной Богом пищи.
- source_word: לֶחֶם מִשְׁנֶה
  choice: собрали хлеба вдвое больше
  rationale: Сохраняет слово «хлеб» и естественно передаёт удвоенное количество, которое далее уточняется мерой.
- source_word: שְׁנֵי הָעֹמֶר
  choice: по два омера
  rationale: Древняя мера сохранена транслитерацией; конструкция с «по» одновременно выражает указанное далее распределение.
- source_word: לָאֶחָד
  choice: на человека
  rationale: Передаёт дистрибутивный смысл буквального выражения «на одного» в современном русском языке.
- source_word: כָּל נְשִׂיאֵי הָעֵדָה
  choice: все главы общины
  rationale: «Главы» обозначает признанных руководителей, а «община» естественно передаёт собранное сообщество Израиля.
- source_word: וַיָּבֹאוּ ... וַיַּגִּידוּ לְמֹשֶׁה
  choice: пришли и сообщили об этом Моисею
  rationale: Сохраняет последовательность двух действий; «об этом» естественно обозначает содержание сообщения, ясное из контекста.
