base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/035.yaml
  text: And the sons of Israel ate the manna forty years[a], until they came to an inhabited land[c][b]; they ate the manna until they came to the border of the land of Canaan.
translation:
  language: ru
  text: Израильтяне[a] ели манну сорок лет, пока не пришли в обжитую землю[b]. Они ели манну, пока не пришли к границе[c] земли Ханаан.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны Израиля» — устойчивое обозначение народа Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в населённую землю»; выражение противопоставляет её пустыне.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «к краю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Израильтяне
  rationale: Буквально «сыны Израиля»; это устойчивое обозначение всего народа. «Израильтяне» естественно передаёт собирательный смысл на современном русском языке.
- source_word: אָכְלוּ
  choice: ели
  rationale: Форма обозначает действие в прошлом; в итоговом повествовательном сообщении естественно простое прошедшее время.
- source_word: הַמָּן
  choice: манну
  rationale: «Манна» — традиционное и общеупотребительное русское соответствие еврейскому מָן; определённость ясна из контекста.
- source_word: אַרְבָּעִים שָׁנָה
  choice: сорок лет
  rationale: Прямое и естественное обозначение продолжительности.
- source_word: עַד בֹּאָם
  choice: пока не пришли
  rationale: Оборот задаёт временной предел. Такой перевод идиоматичен и сохраняет значение глагола «приходить», не усиливая его до «войти».
- source_word: אֶל אֶרֶץ נוֹשָׁבֶת
  choice: в обитаемую землю
  rationale: Причастная форма от ישב описывает землю как населённую, пригодную для оседлой жизни, в противопоставление пустыне.
- source_word: אֶל קְצֵה אֶרֶץ כְּנָעַן
  choice: к границе земли Ханаан
  rationale: קְצֵה может означать край, предел или границу; в географическом контексте «граница» звучит естественно и не уточняет сверх исходного текста, с какой стороны она была достигнута.
