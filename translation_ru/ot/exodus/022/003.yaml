lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Стандартная условная частица, вводящая условие казуальной правовой нормы.
- source_word: הִמָּצֵא תִמָּצֵא
  choice: действительно найдётся
  rationale: Сочетание абсолютного инфинитива с личной формой нифаля усиливает глагольную идею; «действительно найдётся» естественно передаёт эмфазу в современном русском.
- source_word: בְיָדוֹ
  choice: у него
  rationale: Буквально «в его руке»; в данном правовом контексте это идиома владения или фактического обладания. Русское «у него» звучит естественно и сохраняет смысл.
- source_word: הַגְּנֵבָה
  choice: украденное
  rationale: Существительное обозначает похищенное имущество, а не действие кражи; субстантивированное «украденное» кратко и ясно.
- source_word: מִשּׁוֹר עַד חֲמוֹר עַד שֶׂה
  choice: будь то вол, осёл или овца
  rationale: Формула перечисляет виды домашнего скота; оборот «будь то…» естественно передаёт распределительный смысл правовой нормы.
- source_word: חַיִּים
  choice: живым
  rationale: Форма множественного числа согласуется с возможными видами животных, однако по-русски при собирательном «украденное» уместно предикативное «живым»; смысл в том, что животное найдено живым.
- source_word: שְׁנַיִם יְשַׁלֵּם
  choice: пусть он возместит вдвое
  rationale: Юридическая формула требует двукратного возмещения. «Пусть… возместит» передаёт нормативную силу, а «вдвое» — размер выплаты.
