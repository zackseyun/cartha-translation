  text: שְׁבֻעַ֣ת יְהוָ֗ה תִּהְיֶה֙ בֵּ֣ין שְׁנֵי/הֶ֔ם אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֣אכֶת רֵעֵ֑/הוּ וְ/לָקַ֥ח בְּעָלָ֖י/ו וְ/לֹ֥א יְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/010.yaml
  text: an oath of Yahweh shall be between the two of them[a], that he has not put his hand to his neighbor’s property; and its owner shall accept it[c][b], and he shall not make restitution.
translation:
  language: ru
  text: Пусть между ними будет клятва именем Яхве[a] в том, что он не наложил руку на имущество своего ближнего[b]. Владелец примет её[c], и давший клятву не должен будет возмещать ущерб.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «клятва Яхве». По смыслу — клятва, произнесённая именем Яхве.'
    reason: lexical_alternative
  - marker: b
    text: «Наложить руку на» — образное выражение, означающее незаконно присвоить или распорядиться чужим имуществом.
    reason: cultural_note
  - marker: c
    text: То есть признать клятву достаточной и прекратить требование о возмещении.
    reason: clarification
lexical_decisions:
- source_word: שְׁבֻעַת יְהוָה
  choice: клятва именем Яхве
  rationale: Конструкция буквально означает «клятва Яхве», но в данном судебном контексте это клятва, подтверждаемая именем Яхве. Такой перевод естественен по-русски и не создаёт ошибочного впечатления, будто клянётся сам Яхве; буквальная форма указана в сноске.
- source_word: בֵּין שְׁנֵיהֶם
  choice: между ними
  rationale: Форма прямо указывает на две стороны спора; русский оборот «между ними» естественно передаёт двусторонний характер разбирательства.
- source_word: אִם לֹא
  choice: что ... не
  rationale: В формуле клятвы сочетание вводит содержание заверения, а не обычное условие, поэтому по-русски уместно придаточное с «что».
- source_word: שָׁלַח יָדוֹ
  choice: наложил руки на
  rationale: Сохранён древнееврейский образ, обозначающий незаконное присвоение, использование или повреждение чужого имущества; смысл пояснён в сноске.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: на имущество своего ближнего
  rationale: В данном правовом контексте מְלָאכָה обозначает переданное на хранение достояние или имущество, а не отвлечённую «работу».
- source_word: וְלָקַח בְּעָלָיו
  choice: Владелец должен принять её
  rationale: Глагол «взять/принять» здесь означает признать клятву достаточным подтверждением; местоимение «её» естественно восполняет подразумеваемый объект.
- source_word: וְלֹא יְשַׁלֵּם
  choice: и возмещения не потребуется
  rationale: Piel глагола שׁלם в правовом контексте означает выплату возмещения. Безличная русская конструкция ясно передаёт итог постановления и избегает неясной местоименной отсылки.
theological_decisions:
- issue: Передача тетраграмматона יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя Бога в исходном тексте и не заменяет его титулом.
- issue: Кто произносит клятву
  choice: Содержание клятвы передано с местоимением «он», без добавления названия стороны
  alternative: «хранитель клянётся»
  rationale: Стих грамматически опирается на предшествующий контекст и сам не повторяет наименование хранителя; перевод не вносит отсутствующее в этой строке уточнение.
translation_notes:
  register: Современный литературный русский язык с достоинством правового установления. Синтаксис упрощён для ясности, но сохранены формула клятвы, юридический смысл и древнееврейский образ «наложить руки».
