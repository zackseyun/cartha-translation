source:
  edition: WLC
  text: אִם כֶּ֣סֶף תַּלְוֶ֣ה אֶת עַמִּ֗/י אֶת הֶֽ/עָנִי֙ עִמָּ֔/ךְ לֹא תִהְיֶ֥ה ל֖/וֹ כְּ/נֹשֶׁ֑ה לֹֽא תְשִׂימ֥וּ/ן עָלָ֖י/ו נֶֽשֶׁךְ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/024.yaml
  text: If you lend money to my people[a], to the poor among you, you shall not be like a creditor to him[c][b]; you shall not impose interest on him.
translation:
  language: ru
  text: Если дашь взаймы деньги[a] одному из Моего народа — бедняку, который с тобой, — не поступай с ним как взыскатель долга[b] и не взимайте с него процентов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «серебро»; здесь — деньги.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не будь для него тем, кто требует уплаты долга».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Сохраняет условную форму еврейского казуистического закона; в данном жанре она вводит предусмотренный законом случай и может по смыслу приближаться к «когда».
- source_word: כֶּסֶף
  choice: серебро
  rationale: Передаёт конкретное исходное слово, которое в этом правовом и хозяйственном контексте означает деньги; пояснение дано в сноске.
- source_word: תַּלְוֶה
  choice: дашь взаймы
  rationale: Естественно передаёт каузативную форму глагола לוה со значением «одолжить, дать в долг».
- source_word: עַמִּי
  choice: Моего народа
  rationale: Сохраняет притяжательное значение первого лица; заглавная буква указывает на речь Бога согласно русской библейской издательской норме.
- source_word: הֶעָנִי
  choice: бедняку
  rationale: Передаёт субстантивированное прилагательное мужского рода в единственном числе и конкретного адресата займа.
- source_word: עִמָּךְ
  choice: живущему рядом с тобой
  rationale: Еврейское «с тобой» здесь обозначает бедняка внутри ближайшего сообщества; развёрнутая формулировка звучит естественно и не отождествляет её исключительно с пространственной близостью.
- source_word: כְּנֹשֶׁה
  choice: как заимодавец, взыскивающий долг
  rationale: Причастие נֹשֶׁה обозначает не просто нейтрального кредитора, а того, кто требует или взыскивает уплату; формулировка сохраняет этот оттенок.
- source_word: תְשִׂימוּן עָלָיו
  choice: не налагайте на него
  rationale: Близко передаёт идиому «не кладите/не возлагайте на него» и сохраняет переход от единственного числа к форме множественного числа в еврейском тексте.
- source_word: נֶשֶׁךְ
  choice: процентов
  rationale: В контексте займа означает процентную плату; современное «проценты» точнее и понятнее, чем «лихва», которое может подразумевать лишь чрезмерную ставку.
theological_decisions:
- issue: Условная или временная сила אִם в казуистическом законе
  choice: Если дашь взаймы
  alternative: Когда даёшь взаймы
  rationale: Выбрано формальное условное «если», но не исключается типичная для правового жанра сила «когда возникнет такой случай».
- issue: Число адресата в двух запретах
  choice: не поступай… и не налагайте
  alternative: не поступай… и не налагай
  rationale: Сохранён заметный переход исходного текста от 2-го лица единственного числа женского рода к 2-му лицу множественного числа. Он создаёт некоторую стилистическую шероховатость, но является подлинной особенностью еврейского текста и не должен бесследно сглаживаться.
- issue: Объём запрета נֶשֶׁךְ
  choice: не налагайте на него процентов
  alternative: не берите с него ростовщических процентов
  rationale: Текст запрещает процентную плату в описанном случае вообще, а не только чрезмерную или незаконную ставку; поэтому «ростовщических» не добавлено.
- issue: Гендерная форма הֶעָנִי
  choice: бедняку
  alternative: бедному человеку
  rationale: Мужской род и единственное число исходного текста естественно сохраняются русским существительным «бедняк», без добавления отсутствующего слова «мужчина».
translation_notes:
  register: Современный литературный русский с достоинством правовой речи. Тире обозначают приложение «бедняку…», уточняющее, кому именно из народа даётся заём. В первом запрете употреблено единственное число, во втором — множественное, вслед за сменой числа в масоретском тексте; это сознательно сохраняет исходное напряжение.
