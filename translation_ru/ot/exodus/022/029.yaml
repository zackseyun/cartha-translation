  text: כֵּֽן תַּעֲשֶׂ֥ה לְ/שֹׁרְ/ךָ֖ לְ/צֹאנֶ֑/ךָ שִׁבְעַ֤ת יָמִים֙ יִהְיֶ֣ה עִם אִמּ֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁמִינִ֖י תִּתְּנ/וֹ לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/029.yaml
  text: 'You shall do the same with your ox and with your flock: seven days it shall remain with its mother[b][a]; on the eighth day you shall give it to me.'
translation:
  language: ru
  text: 'Так же поступай с твоим крупным и мелким скотом: семь дней первенец[a] пусть остаётся при матери[b], а на восьмой день отдай его Мне.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «первенец» не повторено в еврейском тексте этого стиха, но подразумевается из предыдущего повеления о первенцах.
    reason: cross_reference
  - marker: b
    text: 'Буквально: «пусть будет с матерью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן תַּעֲשֶׂה
  choice: Так же поступай
  rationale: Передаёт сравнительную связь с предшествующим повелением и естественно выражает обязательную силу правового предписания.
- source_word: לְשֹׁרְךָ לְצֹאנֶךָ
  choice: с твоим крупным и мелким скотом
  rationale: שׁוֹר обозначает животное крупного рогатого скота, а צֹאן — собирательно мелкий скот, прежде всего овец и коз; такая пара точнее и естественнее по-русски, чем буквальное «с волом твоим и стадом твоим».
- source_word: שִׁבְעַת יָמִים יִהְיֶה עִם אִמּוֹ
  choice: семь дней … пусть остаётся при матери
  rationale: Глагол «остаётся» естественно выявляет длительное пребывание, выраженное конструкцией «будет с матерью», не меняя её смысла.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: на восьмой день
  rationale: Обычная и точная передача еврейского временного выражения.
- source_word: תִּתְּנוֹ לִי
  choice: отдай его Мне
  rationale: Прямо передаёт נתן с объектным суффиксом и адресатом; мужской род местоимения согласован с добавленным по контексту словом «первенец».
theological_decisions:
- issue: Отнесение повеления к первенцу животного
  choice: Слово «первенец» добавлено в основной текст с примечанием, указывающим, что оно восстанавливается из предыдущего стиха.
  alternative: 'Не добавлять «первенец»: «семь дней пусть он остаётся при матери».'
  rationale: В еврейском тексте этого стиха существительное не повторено, но объект однозначно продолжает предыдущее повеление о первенцах. Явное восполнение устраняет неясное русское местоимение, а сноска сохраняет прозрачность по отношению к форме оригинала.
translation_notes:
  register: Современный литературный русский язык с краткой, весомой формой правового предписания. Местоимение «Мне» написано с прописной буквы по принятой русской библейской традиции; архаизмы и конфессионально окрашенная терминология не использованы.
