  source_fidelity: 'Передача точно отражает еврейскую конструкцию: כֵּן תַּעֲשֶׂה передано как «Так же поступай», пара שׁוֹר / צֹאן — естественным русским обобщением «крупный и мелкий скот», срок в семь дней и предписание восьмого дня сохранены. «Первенец» эксплицирует очевидный из предшествующего стиха эллиптический объект; примечание ясно сообщает, что этого слова в самом стихе нет. «Пусть остаётся при матери» адекватно передаёт יִהְיֶה עִם אִמּוֹ, не создавая лишней ритуальной интерпретации.'
