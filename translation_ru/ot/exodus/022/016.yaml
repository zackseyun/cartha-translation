  text: Если её отец решительно откажется выдать её за него[a], тот должен отвесить серебро[b] в размере брачного дара, установленного для девственниц.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дать её ему»; здесь имеется в виду согласие отца выдать её замуж.'
    reason: lexical_alternative
  - marker: b
    text: 'Глагол буквально означает «взвесить»: серебро могло служить платёжным средством и отвешиваться по весу, а не быть чеканными монетами.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Обычная условная частица, вводящая условие правовой нормы.
- source_word: מָאֵן יְמָאֵן
  choice: решительно откажется
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает значение отказа; наречие передаёт эту эмфазу естественно по-русски.
- source_word: אָבִיהָ
  choice: её отец
  rationale: Форма с суффиксом третьего лица женского рода прямо обозначает отца девушки.
- source_word: לְתִתָּהּ לוֹ
  choice: выдать её за него
  rationale: 'Буквально: «дать её ему»; в данном брачно-правовом контексте русский оборот «выдать за него» точно и естественно передаёт смысл.'
- source_word: כֶּסֶף
  choice: серебро
  rationale: Сохранено конкретное название металла, который служил средством платежа, вместо более общего «деньги».
- source_word: יִשְׁקֹל
  choice: должен отвесить
  rationale: Глагол буквально означает взвешивание; модальная конструкция выражает установленную законом обязанность и сохраняет древний способ расчёта серебром по весу.
- source_word: כְּמֹהַר
  choice: в размере брачного дара
  rationale: מֹהַר обозначает установленное брачное подношение семье невесты. «Брачный дар» передаёт обычай без излишней ассоциации с покупкой женщины, возможной у слова «выкуп».
- source_word: הַבְּתוּלֹת
  choice: за девственниц
  rationale: Определённая форма множественного числа обозначает общую категорию и обычный размер брачного дара, связанный с девственницами.
theological_decisions:
- issue: Значение выражения «дать её ему»
  choice: выдать её за него
  alternative: дать её ему
  rationale: Контекст говорит о согласии отца на брак; явное обозначение брачного смысла предотвращает неверное понимание, не добавляя конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с ясной правовой формулировкой. Сохранены эмфатический отказ отца, конкретное «серебро» и образ взвешивания платежа; архаизм «вено» не использован.
