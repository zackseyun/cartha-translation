base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/013.yaml
  text: And if a man borrows from his neighbor[a], and it is injured or dies, if its owner is not with it[b], he shall surely make restitution.
translation:
  language: ru
  text: Если кто возьмёт у ближнего что-либо взаймы и оно будет повреждено[a] или погибнет, если хозяина при нём не будет, тот непременно возместит ущерб[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будет сломано». Еврейское выражение может относиться как к повреждению взятой вещи, так и к травме взятого животного.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «непременно заплатит», то есть обязан возместить ущерб.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Если
  rationale: Вводит очередной условный правовой случай; в современном русском начальное «если» естественно передаёт эту функцию, а соединительное ו не требует отдельного выражения.
- source_word: יִשְׁאַל
  choice: возьмёт взаймы
  rationale: В данном правовом контексте глагол означает заимствование, а не простую просьбу.
- source_word: אִישׁ
  choice: кто
  rationale: Мужская форма единственного числа употреблена как типовая формула казуального права; русское «кто» естественно и не меняет область применения нормы.
- source_word: מֵעִם רֵעֵהוּ
  choice: у своего ближнего
  rationale: רֵעַ обозначает другого члена сообщества — ближнего, товарища или соседа; «ближний» сохраняет устойчивую лексику библейского права.
- source_word: וְנִשְׁבַּר
  choice: будет повреждено
  rationale: Буквально «будет сломано»; более широкое «повреждено» применимо и к вещи, и к животному и сохраняет лексическую неоднозначность.
- source_word: אוֹ מֵת
  choice: или погибнет
  rationale: Форма означает «умрёт»; «погибнет» естественно относится к животному и в контексте заимствованного имущества допускает утрату предмета.
- source_word: בְּעָלָיו אֵין עִמּוֹ
  choice: когда хозяина не было рядом
  rationale: Передаёт условие отсутствия владельца при заимствованном объекте, не перегружая русский текст неясным местоимением.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: должен полностью возместить ущерб
  rationale: Инфинитив абсолютный с личной формой усиливает обязательность и полноту выплаты; в правовом контексте речь идёт о возмещении потери.
