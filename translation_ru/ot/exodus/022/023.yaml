  text: then my anger will burn[a], and I will kill you with the sword[b], and your wives will become widows and your sons fatherless.
translation:
  language: ru
  text: Тогда воспылает Мой гнев, и Я убью вас мечом; ваши жёны станут вдовами, а сыновья останутся без отцов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: воспылает Мой гнев
  rationale: Сочетание חרה с אַף — образная идиома, обозначающая вспыхнувший гнев. «Воспылает Мой гнев» сохраняет метафору и звучит естественно в dignified modern Russian.
- source_word: וְהָרַגְתִּי אֶתְכֶם
  choice: Я убью вас
  rationale: הרג — обычный глагол со значением «убить». Прямой современный эквивалент точнее архаичного «поражу» или стилистически приподнятого «умерщвлю».
- source_word: בֶּחָרֶב
  choice: мечом
  rationale: Предлог בְּ обозначает орудие или средство действия; русский творительный падеж естественно передаёт «посредством меча» и сохраняет конкретный образ.
- source_word: וְהָיוּ נְשֵׁיכֶם אַלְמָנוֹת
  choice: ваши жёны станут вдовами
  rationale: В семейном контексте נָשִׁים означает «жёны», а היה указывает на состояние, которое наступит вследствие суда.
- source_word: וּבְנֵיכֶם יְתֹמִים
  choice: а сыновья останутся без отцов
  rationale: בנים здесь буквально означает «сыновья», а יתומים в данном контексте — детей, лишившихся отцов. Развёрнутая русская формулировка передаёт это точнее, чем неоднозначное «сироты».
theological_decisions:
- issue: Антропоморфный образ Божьего гнева
  choice: «воспылает Мой гнев»
  alternative: «разгорится Мой гнев»; буквально — «воспылает Мой нос»
  rationale: Буквальная передача части тела затемнила бы смысл древнееврейской идиомы. Выбранный вариант сохраняет метафору жара, не ослабляя утверждение о Божьем суде.
- issue: Конкретность обозначения детей, лишившихся отцов
  choice: «сыновья останутся без отцов»
  alternative: «дети станут сиротами»; «сыновья станут сиротами»
  rationale: Перевод сохраняет мужской род בנים и социально-семейную конкретность יתומים, не расширяя значение до всех детей и не создавая впечатления, будто умерли оба родителя.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. «Воспылает» сохраняет образ исходного текста; остальная лексика прямая и современная. Точка с запятой подчёркивает связь между приговором и его последствиями.
