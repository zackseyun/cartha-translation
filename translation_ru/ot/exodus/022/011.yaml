  text: Но если животное действительно украдут у него[a], он должен выплатить владельцу возмещение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально еврейский текст повторяет глагол «красть»: «если оно будет украдено, украдено от него». Инфинитив абсолютный перед личной формой усиливает смысл: животное действительно украли, когда оно находилось у этого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: В последовательности правовых предписаний союз вводит условие, противопоставленное случаю из предыдущего стиха; «но если» естественно передаёт эту связь.
- source_word: גָּנֹב יִגָּנֵב
  choice: всё же украдут
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает значение действия. Частица «всё же» передаёт эмфазу, а неопределённо-личная конструкция естественно выражает еврейский пассив.
- source_word: מֵעִמּוֹ
  choice: у него
  rationale: Буквально — «от пребывающего при нём» / «от него»; в данном правовом контексте речь идёт о краже животного, находившегося на его попечении. Русское «у него» кратко и естественно сохраняет этот смысл.
- source_word: יְשַׁלֵּם
  choice: должен возместить ущерб
  rationale: Пиэль глагола שלם в правовом контексте означает выплатить возмещение. Формулировка передаёт как обязательность предписания, так и компенсационный характер платежа.
- source_word: לִבְעָלָיו
  choice: владельцу
  rationale: בעל здесь обозначает собственника животного. Единственное число естественно по-русски передаёт грамматическую форму, которая в еврейском имеет множественное окончание, но обозначает одного владельца.
