  rationale: Перестроена первая часть условия, чтобы прямо связать выпуск животного с потравой чужого участка; это передаёт повторное בער как причинённый животным ущерб. Единственное «животное» точнее соответствует еврейскому существительному. Сноска о буквальном «другом поле» не требуется после того, как принадлежность другому человеку выражена в основном тексте.
