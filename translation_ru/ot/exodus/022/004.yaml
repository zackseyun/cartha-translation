base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/004.yaml
  text: If a man causes a field or vineyard to be grazed over[a], and lets his animal loose so that it grazes in another man's field[b], he shall make restitution from the best of his own field and the best of his own vineyard.
translation:
  language: ru
  text: Если кто, выпустив своё животное, потравит поле или виноградник другого человека[a], пусть он возместит ущерб лучшим со своего поля и лучшим из своего виноградника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «Если кто выжжет поле или виноградник». Еврейский глагол בער в некоторых контекстах означает горение или сжигание, однако последующее упоминание выпущенного животного убедительно указывает здесь на потраву, то есть поедание растительности животным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: если
  rationale: В формулировке казуистического закона вводит условный случай; «если» естественно для современного русского юридического изложения.
- source_word: יַבְעֶר
  choice: потравит
  rationale: Глагол в породе hифиль здесь обозначает причинение ущерба выпасом; «потравит» кратко передаёт и причинительный оттенок, и сельскохозяйственный контекст.
- source_word: שָׂדֶה אוֹ כֶרֶם
  choice: поле или виноградник
  rationale: Прямой перевод сельскохозяйственных терминов с сохранением единственного числа.
- source_word: וְשִׁלַּח אֶת־בְּעִירֹה
  choice: выпустив свой скот
  rationale: שִׁלַּח означает «выпустить, отпустить», а בְּעִירֹה — принадлежащее виновнику домашнее животное или скот; русское «скот» естественно в контексте выпаса.
- source_word: וּבִעֵר בִּשְׂדֵה אַחֵר
  choice: и тот будет пастись на чужом поле
  rationale: Повторный בער описывает поедание растительности скотом. «Чужом» естественно выражает подразумеваемую принадлежность поля другому лицу.
- source_word: מֵיטַב שָׂדֵהוּ וּמֵיטַב כַּרְמוֹ
  choice: лучшим со своего поля и лучшим из своего виноградника
  rationale: מֵיטַב указывает на лучшее, отборное. Формулировка сохраняет требование возмещения из лучшего, принадлежащего виновнику, не уточняя сверх текста, идёт ли речь о плодах или иной части имущества.
- source_word: יְשַׁלֵּם
  choice: пусть он возместит ущерб
  rationale: Пиэль от שׁלם в правовом контексте означает выплату или предоставление возмещения; добавление «ущерб» делает юридический смысл ясным по-русски.
