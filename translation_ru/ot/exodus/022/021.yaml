lexical_decisions:
- source_word: כָּל
  choice: ни … ни …
  rationale: 'В отрицательном предписании эта русская конструкция естественно передаёт распределительное и всеохватное значение: запрет относится к любой вдове и любому сироте.'
- source_word: אַלְמָנָה
  choice: вдова
  rationale: Прямое и общепринятое соответствие еврейскому слову.
- source_word: יָתוֹם
  choice: сирота
  rationale: Естественное современное обозначение ребёнка, лишившегося родителя или родителей; возможный более узкий смысл «ребёнок, оставшийся без отца» сохранён в сноске.
- source_word: לֹא
  choice: не
  rationale: Обычное отрицание, формирующее здесь прямой запрет.
- source_word: תְעַנּוּן
  choice: притесняйте
  rationale: Глагол ענה в породе пиэль здесь означает причинять страдание, подвергать суровому или несправедливому обращению. «Притеснять» сохраняет серьёзность и широту запрета, не сводя его только к физической обиде или экономической эксплуатации.
