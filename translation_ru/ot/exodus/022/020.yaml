lexical_decisions:
- source_word: גֵר / גֵרִים
  choice: переселенец / переселенцы
  rationale: Еврейское слово обозначает не просто чужеземца или путника, а человека некоренного происхождения, постоянно живущего среди местного населения. «Переселенец» естественно передаёт этот смысл и позволяет сохранить повтор ключевого слова.
- source_word: תוֹנֶה
  choice: не обижай
  rationale: Форма от ינה означает поступать с кем-либо несправедливо, причинять ему ущерб. «Обижать» сохраняет широкий смысл дурного и несправедливого обращения, не ограничивая его экономической эксплуатацией.
- source_word: תִלְחָצֶנּוּ
  choice: не притесняй
  rationale: לחץ выражает давление и угнетение; «притеснять» точно и естественно звучит в контексте правового предписания. Объект выражен русской формой винительного падежа существительного, поэтому отдельное местоимение не требуется.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание запрета. «Потому что» ясно передаёт причинную связь в современном русском языке.
- source_word: הֱיִיתֶם
  choice: вы сами были
  rationale: Глагол описывает прежнее положение израильтян; частица «сами» естественно подчёркивает нравственную силу сопоставления, не меняя содержания.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в Египетской земле
  rationale: Так сохраняется прямо выраженное в еврейском тексте слово «земля» и торжественно-правовой оттенок фразы.
theological_decisions:
- issue: Передача единственного мужского рода в обобщённом правовом предписании
  choice: 'Сохранить единственное число: «переселенца»'
  alternative: 'Использовать множественное число: «переселенцев»'
  rationale: В еврейском тексте стоит существительное мужского рода в единственном числе с соответствующим местоименным суффиксом; оно имеет обобщающий правовой смысл. Русское единственное число естественно сохраняет форму и функцию источника.
- issue: Повтор גֵר в запрете и историческом обосновании
  choice: 'Передать обе формы одним корнем: «переселенца … переселенцами»'
  alternative: 'Варьировать лексику: «чужеземца … пришельцами»'
  rationale: Лексический повтор связывает положение защищаемого человека с прошлым опытом Израиля; его важно сохранить, не ослабляя богословско-нравственное основание заповеди.
translation_notes:
  register: Современный литературный русский с достоинством правового предписания. Единственное число и повтор ключевого слова сохранены; синтаксис сделан естественным для русского языка.
