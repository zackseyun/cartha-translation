  text: כִּ֣י הִ֤וא כסות/ה לְ/בַדָּ֔/הּ הִ֥וא שִׂמְלָת֖/וֹ לְ/עֹר֑/וֹ בַּ/מֶּ֣ה יִשְׁכָּ֔ב וְ/הָיָה֙ כִּֽי יִצְעַ֣ק אֵלַ֔/י וְ/שָׁמַעְתִּ֖י כִּֽי חַנּ֥וּן אָֽנִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/026.yaml
  text: For it is his only covering; it is his cloak for his skin. In what will he lie down? And if he cries out to me[a], I will hear, for I am compassionate.
translation:
  language: ru
  text: Ведь это его единственное покрывало, одежда на его теле. В чём же ему спать? И если он воззовёт ко Мне, Я услышу его, потому что Я милосерден[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «милостив» или «сострадателен».'
    reason: Лексема חַנּוּן обозначает милостивое, сострадательное расположение; эти варианты передают близкие оттенки значения.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предшествующего повеления; «ведь» естественно передаёт пояснительно-причинный оттенок.
- source_word: כסות/הּ לְבַדָּהּ
  choice: это его единственное покрывало
  rationale: כְּסוּת обозначает покрывало или одежду, а לְבַדָּהּ указывает, что другого покрытия у человека нет.
- source_word: שִׂמְלָתוֹ לְעֹרוֹ
  choice: одежда на его теле
  rationale: שִׂמְלָה — одежда, накидка или плащ; עוֹר буквально означает «кожа». По-русски «на его теле» естественно сохраняет конкретный смысл и не создаёт неуместного выражения «одежда для кожи».
- source_word: בַּמֶּה יִשְׁכָּב
  choice: В чём же ему спать?
  rationale: Риторический вопрос говорит о покрывале, необходимом для сна. «В чём» передаёт בַּמֶּה, а «спать» естественно выражает контекстуальный смысл שׁכב; частица «же» подчёркивает риторическую связь.
- source_word: וְהָיָה כִּי
  choice: И если
  rationale: Оборот вводит будущую возможность; буквальное развёртывание было бы тяжеловесным в современном русском языке.
- source_word: יִצְעַק אֵלַי
  choice: он воззовёт ко Мне
  rationale: צעק означает крик или настойчивое обращение за помощью. «Воззовёт» сохраняет силу обращения и соответствует достоинству законодательного контекста.
- source_word: וְשָׁמַעְתִּי
  choice: Я услышу его
  rationale: שׁמע буквально значит «слышать» и в данном контексте подразумевает отклик на вопль угнетённого. Дополнение «его» естественно по-русски и ясно соотносит действие с взывающим.
- source_word: חַנּוּן
  choice: милосерден
  rationale: Прилагательное описывает Бога как благосклонного и сострадающего к нуждающемуся; «милосерден» естественно и ёмко передаёт оба оттенка в данном контексте.
theological_decisions:
- issue: Передача Божьего самоописания חַנּוּן
  choice: милосерден
  alternative: благодатен; сострадателен; милостив
  rationale: «Милосерден» ясно выражает готовность Бога откликнуться на бедствующего, не сужая значение до специального конфессионального термина. Другие варианты лексически возможны и отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Риторический вопрос передан естественно; буквальная образность сохранена без неидиоматичного выражения «для его кожи». Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской традиции.
