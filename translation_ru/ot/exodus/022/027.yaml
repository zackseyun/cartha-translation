  text: אֱלֹהִ֖ים לֹ֣א תְקַלֵּ֑ל וְ/נָשִׂ֥יא בְ/עַמְּ/ךָ֖ לֹ֥א תָאֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/027.yaml
  text: You shall not revile God[a], nor curse a ruler among your people.
translation:
  language: ru
  text: Не злословь Бога[a] и не проклинай правителя в своём народе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «судей». Слово אֱלֹהִים в некоторых контекстах может обозначать людей, наделённых судебной властью, хотя здесь параллелизм лучше поддерживает перевод «Бога».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Бога
  rationale: В данном законодательном контексте и в параллели с правителем наиболее вероятно указание на Бога. Возможное значение «судей» сохранено в сноске.
- source_word: תְקַלֵּל
  choice: не злословь
  rationale: Пиэль глагола קלל может обозначать проклятие, поношение или презрительную речь. «Не злословь» естественно передаёт словесное оскорбление и сохраняет отличие от более прямого «не проклинай» во второй части.
- source_word: נָשִׂיא
  choice: правителя
  rationale: נָשִׂיא обозначает возвышенного руководителя, начальника или правителя. «Правитель» ясно и достойно передаёт властное положение без архаического оттенка слова «князь».
- source_word: בְעַמְּךָ
  choice: в своём народе
  rationale: Предлог ב здесь естественно понимать как указание на положение правителя внутри народа. Формулировка передаёт принадлежность к общине и звучит естественно по-русски.
- source_word: תָאֹר
  choice: не проклинай
  rationale: Глагол ארר является обычным обозначением проклятия; «проклинать» — его прямой и естественный русский эквивалент.
theological_decisions:
- issue: К кому относится אֱלֹהִים
  choice: Бог
  alternative: судьи; боги
  rationale: Единственное по смыслу «Бог» хорошо соответствует запрету в этом правовом контексте и создаёт параллель между отношением к Богу и к человеческому правителю. Исторически значимое понимание «судьи» не исключается, а отмечается в сноске; вариант «боги» здесь менее вероятен.
translation_notes:
  register: Современный литературный русский язык; краткая законодательная формула. Различие между תְקַלֵּל и תָאֹר передано словами «злословь» и «проклинай». Местоимение «своём» естественно отражает обращение во втором лице единственного числа.
