- source_word: עִם
  choice: с
  rationale: Предлог прямо связывает глагольную конструкцию с её объектом.
- source_word: בְּהֵמָה
  choice: животным
  rationale: בְּהֵמָה здесь обозначает животное; это современное нейтральное соответствие без архаического или лишнего риторического оттенка.
- source_word: מוֹת יוּמָת
  choice: непременно должен быть предан смерти
  rationale: Инфинитив абсолютный при пассивной глагольной форме усиливает утверждение и в данном правовом контексте выражает неизбежность судебной смертной казни.
theological_decisions:
