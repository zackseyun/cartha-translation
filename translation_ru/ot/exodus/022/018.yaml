  verdict: revise
  source_fidelity: 'Основной смысл передан верно: כָּל שֹׁכֵב עִם־בְּהֵמָה — обобщённое обозначение человека, совершающего половой акт с животным; מוֹת יוּמָת — усиленная правовая формула смертной казни. Однако «непременно должен быть» в русском тексте смешивает усиление достоверности с модальностью обязанности и звучит тяжеловесно. Кроме того, сноска называет активное «умрёт» более буквальным вариантом, хотя личная форма יוּמָת стоит в пассиве.'
  naturalness: «Всякий, кто ложится с животным» понятно, но в современной русской правовой/нормативной формулировке «кто ляжет с животным» естественнее для обозначения запрещённого действия. «Должен быть предан смерти» кратко, строго и естественно; усиление еврейской конструкции лучше отразить словом «непременно», не вводя лишнего «должен».
  terminology: «Животное» — нейтральное современное соответствие בְּהֵמָה в данном контексте. «Предан смерти» точно передаёт судебно-правовой и пассивный характер יוּמָת. Не следует заменять его термином «скотоложник», поскольку он утрачивает сдержанный глагольный эвфемизм исходного текста и добавляет стилистическую окраску.
  issues:
  - severity: low
    issue: Избыточная модальная конструкция «непременно должен быть предан смерти».
    rationale: Еврейский инфинитив абсолютный с пассивным имперфектом усиливает утверждение о наказании. В русском «должен» уже выражает нормативное предписание, а «непременно должен» звучит избыточно; «непременно будет предан смерти» яснее сохраняет и усиление, и пассивную юридическую форму.
  - severity: medium
    issue: Сноска характеризует «непременно умрёт» как более буквальный вариант.
    rationale: 'Хотя такой вариант передаёт итог наказания, он не сохраняет пассивную форму יוּמָת. Более близкое к форме оригинала пояснение должно говорить о сочетании усилительного инфинитива и пассивного глагола: «смертью будет предан смерти» либо, идиоматически, «непременно будет предан смерти».'
