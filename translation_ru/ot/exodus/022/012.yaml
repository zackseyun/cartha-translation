  - severity: low
    issue: Неестественная субстантивация «за растерзанное»
    rationale: Фраза формально возможна, но в современном литературном русском менее ясна, чем «за растерзанное животное» или «за него»; первое лучше сохраняет лексический повтор הַטְּרֵפָה.
