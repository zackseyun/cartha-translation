  yaml_path: translation/ot/exodus/022/012.yaml
  text: But if it is torn by beasts[a], he shall bring it as evidence; he shall not make restitution for what was torn.
translation:
  language: ru
  text: Но если животное действительно будет растерзано хищником[a], пусть он представит его как доказательство; за растерзанное животное он не обязан возмещать ущерб.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но если оно действительно растерзано, пусть он представит растерзанное животное как доказательство; за него он не обязан возмещать ущерб».'
    reason: 'Лексико-синтаксическая альтернатива: усиленная еврейская пассивная конструкция может передаваться без явно названного деятеля; местоименный суффикс при «представит» может относиться к останкам животного.'
lexical_decisions:
- source_word: אִם
  choice: Но если
  rationale: Вводит следующий, противопоставленный предыдущему, случай в последовательности правовых предписаний.
- source_word: טָרֹף יִטָּרֵף
  choice: зверь растерзает его
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает глагольное значение. По контексту речь идёт о нападении зверя; русское «растерзает» естественно передаёт результат, не добавляя отдельного наречия усиления.
- source_word: יְבִאֵהוּ
  choice: пусть принесёт его
  rationale: Каузативная форма בוא означает «принести, представить»; местоименный суффикс отсылает к растерзанному животному или его останкам.
- source_word: עֵד
  choice: как доказательство
  rationale: Буквально «свидетель; свидетельство», но здесь останки выполняют доказательную функцию, поэтому «как доказательство» ясно и естественно по-русски.
- source_word: הַטְּרֵפָה
  choice: за растерзанное
  rationale: Субстантивированная форма обозначает растерзанное животное или его останки; краткая формулировка сохраняет компактность еврейского текста.
- source_word: לֹא יְשַׁלֵּם
  choice: он возмещать не должен
  rationale: В данном правовом контексте Piel שלם означает выплатить возмещение; модальная конструкция естественно передаёт нормативную силу предписания.
