base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/015.yaml
  text: If a man seduces a virgin who is not betrothed[a], and lies with her[b], he must surely pay the bride-price for her to be his wife.
translation:
  language: ru
  text: Если мужчина соблазнит девственницу, которая не обручена, и ляжет с ней, он непременно должен внести за неё брачный платёж[a], чтобы она стала его женой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Употреблён глагол, связанный с еврейским термином «мохар» — брачным платежом, который жених или его семья вносили за невесту; это не приданое, приносимое невестой.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַתֶּה
  choice: соблазнит
  rationale: Порода пиэль глагола פתה здесь означает склонить или увлечь в сексуальную связь. «Соблазнит» естественно передаёт этот смысл, не добавляя прямо не выраженного в тексте физического принуждения.
- source_word: אִישׁ
  choice: мужчина
  rationale: Существительное стоит в мужском роде, единственном числе и в данном законе обозначает мужчину.
- source_word: בְּתוּלָה
  choice: девственницу
  rationale: В данном брачно-правовом контексте בְּתוּלָה обозначает девушку, прежде не вступавшую в половую связь; «девственница» сохраняет значимый для закона статус.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: которая не обручена
  rationale: Форма указывает на женщину, формально не связанную обручением. «Не обручена» точно и понятно передаёт древний юридический статус.
- source_word: וְשָׁכַב עִמָּהּ
  choice: и ляжет с ней
  rationale: Это обычный древнееврейский эвфемизм половой связи. Русское выражение сохраняет образность, достоинство и ясность оригинала.
- source_word: מָהֹר יִמְהָרֶנָּה
  choice: он непременно должен уплатить за неё выкуп за невесту
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает обязательность действия. Корень מהר здесь относится к уплате мохара — брачного платежа со стороны жениха или его семьи, а не к приданому невесты.
- source_word: לּוֹ לְאִשָּׁה
  choice: чтобы она стала его женой
  rationale: Передаёт предусмотренный законом брачный результат платежа естественным современным русским языком.
theological_decisions:
- issue: Характер полового акта, описанного глаголом פתה
  choice: Соблазнение без прямого указания на физическое насилие
  alternative: Изнасилование или насильственное овладение
  rationale: Значение פתה в пиэле поддерживает смысл склонения или соблазнения. Перевод не должен добавлять принуждение, которого этот стих прямо не называет, но также не утверждает современную концепцию полностью свободного и равноправного согласия.
translation_notes:
  register: Современный литературный русский язык с достоинством юридического текста. Сохранён библейский эвфемизм «ляжет с ней», а специальный культурный термин пояснён в сноске.
