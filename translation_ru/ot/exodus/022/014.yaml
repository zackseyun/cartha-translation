  text: If its owner is with it[a], he shall not make restitution; if it is a hired thing, it came for its hire.
translation:
  language: ru
  text: Если хозяин животного находится при нём, заёмщик не обязан возмещать ущерб; если же животное было нанято, плата за наём уже включает возмещение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст краток и допускает другое понимание: «если же он наёмный работник, то он пришёл за свою плату». При таком прочтении שָׂכִיר относится к работнику, а не к нанятому животному; однако в непосредственном контексте речь идёт об ответственности за животное или другое имущество.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעָלָיו
  choice: хозяин животного
  rationale: בעל в данном правовом контексте обозначает владельца. Явное «животного» естественно по-русски и восстанавливает предмет обсуждения из контекста предыдущего стиха.
- source_word: עִמּוֹ
  choice: был при нём
  rationale: Предлог עם с местоименным суффиксом буквально означает «с ним». Формулировка «при нём» передаёт присутствие хозяина рядом с животным, не вводя лишних подробностей.
- source_word: לֹא יְשַׁלֵּם
  choice: возмещать ущерб не нужно
  rationale: Пиэль глагола שלם в юридическом контексте означает выплатить возмещение. Безличная русская конструкция ясно выражает освобождение от обязанности возместить ущерб.
- source_word: שָׂכִיר
  choice: животное было взято внаём
  rationale: Хотя שָׂכִיר обычно может означать наёмного работника, контекст ответственности за животное позволяет понимать слово эллиптически как указание на нанятое имущество. «Взято внаём» звучит естественно в современном русском юридическом изложении.
- source_word: בָּא בִּשְׂכָרוֹ
  choice: плата за наём покрывает ущерб
  rationale: 'Еврейская фраза буквально и сжато говорит: «оно пришло за свою плату». В контексте это означает, что риск уже учтён в плате за пользование; перевод делает правовой смысл понятным, а альтернативный разбор сохраняется в сноске.'
theological_decisions:
- issue: К кому относится שָׂכִיר в заключительной части стиха
  choice: К нанятому животному как предмету договора найма
  alternative: 'К наёмному работнику: «если же он наёмный работник, то оно пришло за его плату»'
  rationale: Непосредственный контекст регулирует ответственность за одолженное или нанятое животное, поэтому предметное прочтение лучше связывает обе части закона. Однако краткость еврейского текста допускает личное прочтение, которое отмечено в сноске без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с ясной правовой формулировкой. Сохранён условный характер нормы; архаизмы и узкоконфессиональная терминология не используются.
