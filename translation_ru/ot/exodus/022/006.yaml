source:
  edition: WLC
  text: כִּֽי יִתֵּן֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ כֶּ֤סֶף אֽוֹ כֵלִים֙ לִ/שְׁמֹ֔ר וְ/גֻנַּ֖ב מִ/בֵּ֣ית הָ/אִ֑ישׁ אִם יִמָּצֵ֥א הַ/גַּנָּ֖ב יְשַׁלֵּ֥ם שְׁנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/006.yaml
  text: If a man gives his neighbor money or goods to keep[a], and it is stolen from the man's house, if the thief is found[c][b], he shall pay double.
translation:
  language: ru
  text: Если человек отдаст своему ближнему на хранение деньги[a] или вещи[b], а их украдут из дома этого человека, то, если вор будет найден, он должен возместить вдвое[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «серебро»; здесь — деньги.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «предметы», «имущество».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «возместит двойное».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: В казуистической правовой формуле вводит условие; «если» естественно передаёт структуру нормы.
- source_word: יִתֵּן אִישׁ
  choice: человек отдаст
  rationale: Сохраняет единственное число и юридически обобщающий характер мужской формы, не создавая в современном русском ненужного акцента на поле.
- source_word: אֶל רֵעֵהוּ
  choice: своему ближнему
  rationale: В правовом контексте обозначает другого члена сообщества; «ближний» точно и узнаваемо передаёт значение.
- source_word: כֶּסֶף
  choice: деньги
  rationale: Буквально «серебро», но в данном имущественно-правовом контексте слово обозначает деньги.
- source_word: אוֹ כֵלִים
  choice: или вещи
  rationale: כֵלִים — широкое обозначение предметов имущества; «вещи» естественно и не сужает смысл до сосудов или орудий.
- source_word: לִשְׁמֹר
  choice: на хранение
  rationale: Инфинитив выражает цель передачи имущества; русская формула ясно указывает на ответственное хранение.
- source_word: וְגֻנַּב
  choice: а их украдут
  rationale: Пассивная форма относится к переданному имуществу; множественное местоимение естественно охватывает деньги или вещи.
- source_word: מִבֵּית הָאִישׁ
  choice: из дома этого человека
  rationale: Уточняет, что речь идёт о доме хранителя, то есть ранее названного человека.
- source_word: אִם יִמָּצֵא הַגַּנָּב
  choice: если вор будет найден
  rationale: Сохраняет буквальное значение нифаля «будет найден», не заменяя его более узким «будет пойман».
- source_word: יְשַׁלֵּם שְׁנָיִם
  choice: он должен возместить вдвое
  rationale: Передаёт юридическую обязанность двойного возмещения; местоимение относится к найденному вору.
