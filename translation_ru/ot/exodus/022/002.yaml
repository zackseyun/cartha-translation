base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/002.yaml
  text: But if the sun has risen on him[a], there is bloodguilt for him. He must surely make restitution. If he has nothing[c][b], then he shall be sold for his theft.
translation:
  language: ru
  text: Но если солнце взошло над ним[a], то убивший виновен в пролитии крови[b]. Вор должен полностью возместить ущерб; если ему нечем[c], его продадут за совершённую им кражу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если солнце взошло над ним»; по смыслу также возможно: «если это произошло после восхода солнца» или «при дневном свете».'
    reason: lexical_alternative
  - marker: b
    text: То есть в этих обстоятельствах убивший вора несёт вину за пролитую кровь.
    reason: alternative_reading
  - marker: c
    text: Продажа в услужение была способом погасить долг за совершённую кражу, когда у вора не было средств возместить ущерб.
    reason: cultural_note
lexical_decisions:
- source_word: אִם זָרְחָה הַשֶּׁמֶשׁ עָלָיו
  choice: Но если солнце уже взошло над ним
  rationale: Сохраняется конкретный еврейский образ и противопоставление ночному случаю предыдущего стиха; «уже» естественно передаёт наступившее состояние.
- source_word: דָּמִים לוֹ
  choice: то убивший виновен в пролитии крови
  rationale: Древнееврейское דמים в юридическом контексте обозначает вину за пролитую кровь. Указание «убивший» ясно передаёт референта местоимения, отличая его от вора.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: Вор должен полностью возместить ущерб
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает обязательность и полноту возмещения; субъект восстановлен из контекста.
- source_word: אִם אֵין לוֹ
  choice: если ему нечем
  rationale: Естественный современный русский оборот для отсутствия средств, необходимых для возмещения.
- source_word: וְנִמְכַּר בִּגְנֵבָתוֹ
  choice: пусть его продадут за украденное
  rationale: 'Передаёт юридическое следствие и наиболее вероятное предметное значение גנבה: продажа служит средством покрытия долга за похищенное.'
theological_decisions:
- issue: Ответственность за убийство вора после восхода солнца
  choice: Виновным в пролитии крови назван тот, кто убил вора после восхода солнца.
  alternative: Выражение можно понимать шире — как указание на обстоятельства, при которых угроза стала ясна, а не только на буквальное время суток.
  rationale: Основной текст сохраняет буквальный временной образ и юридическое противопоставление предыдущему стиху, не превращая его в более общее правило, прямо не сформулированное в еврейском тексте.
- issue: Субъект обязанности возместить ущерб
  choice: Обязанность возмещения относится к вору.
  alternative: При механическом чтении ближайшим субъектом можно счесть убившего, однако последующие слова об отсутствии средств и продаже за похищенное указывают на вора.
  rationale: Явное существительное «вор» устраняет местоименную неясность русского текста и соответствует развитию закона, не меняя его содержания.
translation_notes:
  register: Современный литературный русский язык с юридически ясной, но не канцелярской формулировкой. Сохранён конкретный образ восхода солнца; референты названы явно, чтобы избежать не присущей смыслу двусмысленности.
