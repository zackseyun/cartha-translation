  - severity: low
    issue: Добавлено «уже» в «солнце уже взошло»
    rationale: Еврейский текст говорит просто «если солнце взошло над ним». Добавка не меняет существенно смысл, но не нужна для естественного русского и несколько усиливает временной оттенок.
  - severity: low
    issue: Побудительное «пусть его продадут»
    rationale: Вав-консекут. пассивная форма выражает юридическое следствие («он будет/должен быть продан»); русское будущее пассивного значения точнее сохраняет этот характер.
