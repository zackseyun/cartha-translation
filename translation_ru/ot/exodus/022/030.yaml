  yaml_path: translation/ot/exodus/022/030.yaml
  text: And you shall be holy men to me[a]. You shall not eat flesh torn in the field[b]; you shall throw it to the dogs.
translation:
  language: ru
  text: Будьте Моими святыми людьми.[a] Не ешьте мяса, растерзанного в поле;[b] отдавайте его собакам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «людьми святости». В еврейском тексте стоит форма мужского рода, которая здесь может представлять общину завета в целом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мяса, растерзанного зверями в поле». Еврейский текст говорит лишь «мясо… растерзанное», не называя того, кто его растерзал.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי קֹדֶשׁ
  choice: святыми людьми
  rationale: Буквально конструкция означает «люди святости». Русское «святые люди» естественно передаёт посвящённость Богу; грамматический мужской род исходного выражения отмечен в сноске, поскольку в данном обращении он может представлять всю общину.
- source_word: תִּהְיוּן לִי
  choice: будьте у Меня
  rationale: Сочетание היה с לִי выражает требуемый статус и принадлежность Богу. Императив «будьте» естественно передаёт обязательную силу формы в законодательном контексте, а «у Меня» сохраняет её реляционный оттенок.
- source_word: בָשָׂר
  choice: мяса
  rationale: В пищевом предписании современное русское «мясо» естественнее, чем «плоть», и точно обозначает мясо животного.
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: Прямое пространственное соответствие еврейскому выражению; оно может обозначать открытую местность вне поселения.
- source_word: טְרֵפָה
  choice: растерзанного
  rationale: Слово обозначает растерзанную добычу или тушу. Перевод не добавляет прямо не названного деятеля, сохраняя краткость и неоднозначность исходного текста.
- source_word: לֹא תֹאכֵלוּ
  choice: не ешьте
  rationale: Ясная современная русская форма запрета, соответствующая юридической силе еврейского имперфекта с отрицанием.
- source_word: לַכֶּלֶב
  choice: псу
  rationale: Сохраняется единственное число исходного текста; в русском оно естественно допускает обобщённое значение.
- source_word: תַּשְׁלִכוּן אֹתוֹ
  choice: бросайте его
  rationale: «Бросать» — ясный современный эквивалент глагола שלך; местоимение относится к мясу.
theological_decisions:
- issue: Святость общины в законе завета
  choice: «будьте у Меня святыми людьми»
  alternative: «будьте у Меня святыми мужами» / «будьте Моим святым народом»
  rationale: Перевод сохраняет как святость, так и принадлежность Богу, не сводя קֹדֶשׁ только к ритуальному посвящению. «Люди» естественно по-русски может обозначать общину, тогда как «мужи» неоправданно сужает адресатов, а «народ» подменяет исходное слово; грамматическая форма пояснена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Формы «будьте», «не ешьте», «бросайте» ясны и не архаичны; лексическая и грамматическая неоднозначность исходного текста сохранена в основном тексте и пояснена сносками.
