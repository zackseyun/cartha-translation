  text: עַֽל כָּל דְּבַר פֶּ֡שַׁע עַל שׁ֡וֹר עַל חֲ֠מוֹר עַל שֶׂ֨ה עַל שַׂלְמָ֜ה עַל כָּל אֲבֵדָ֗ה אֲשֶׁ֤ר יֹאמַר֙ כִּי ה֣וּא זֶ֔ה עַ֚ד הָֽ/אֱלֹהִ֔ים יָבֹ֖א דְּבַר שְׁנֵי/הֶ֑ם אֲשֶׁ֤ר יַרְשִׁיעֻ/ן֙ אֱלֹהִ֔ים יְשַׁלֵּ֥ם שְׁנַ֖יִם לְ/רֵעֵֽ/הוּ־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/008.yaml
  text: For every case of wrongdoing involving an ox[a], a donkey, a sheep, a garment, or any lost thing about which someone says, ‘This is it,’ the case of both parties shall come before God[b]. The one whom God declares guilty shall pay double to his neighbor.
translation:
  language: ru
  text: 'Во всяком деле о правонарушении — о быке, об осле, о мелком скоте[a], об одежде или о какой-либо пропаже, о которой кто-либо скажет: «Вот это», — дело обеих сторон должно предстать перед Богом[b]. Тот, кого Бог признает виновным, должен возместить своему ближнему вдвойне.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское שֶׂה обозначает голову мелкого скота — овцу или козу.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перед судьями» / «перед судом». Еврейское אֱלֹהִים может обозначать непосредственно Бога либо, в правовом контексте, человеческих судей, действующих с данной Им властью.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר פֶּשַׁע
  choice: дело о правонарушении
  rationale: В данном правовом контексте דָּבָר означает «дело», а פֶּשַׁע — виновное нарушение; «правонарушение» передаёт судебный характер выражения, не уточняя состав проступка сверх текста.
- source_word: שׁוֹר
  choice: бык
  rationale: Обычное русское обозначение единицы крупного рогатого скота в перечне спорного имущества; более узкое значение «вол» контекстом не требуется.
- source_word: חֲמוֹר
  choice: осёл
  rationale: Современное и точное обозначение домашнего животного.
- source_word: שֶׂה
  choice: мелкий скот
  rationale: Еврейское слово может обозначать как овцу, так и козу; собирательное русское выражение сохраняет эту лексическую широту.
- source_word: שַׂלְמָה
  choice: одежда
  rationale: Широкое обозначение предмета одежды лучше сохраняет объём слова, чем более узкое «плащ».
- source_word: אֲבֵדָה
  choice: любая пропажа
  rationale: Слово обозначает потерянную вещь или имущество; «пропажа» естественно звучит по-русски и допускает оба оттенка.
- source_word: אֲשֶׁר יֹאמַר כִּי הוּא זֶה
  choice: 'о которой кто-либо скажет: «Вот это»'
  rationale: Фраза передаёт указание или заявление об отождествлении спорной вещи. «Вот это» сохраняет краткость и некоторую неоднозначность оригинала.
- source_word: הָאֱלֹהִים / אֱלֹהִים
  choice: Бог / Богом
  rationale: Основное лексическое значение — «Бог». Возможное судебно-институциональное понимание как судей или суда отмечено в сноске.
- source_word: יָבֹא דְּבַר שְׁנֵיהֶם
  choice: дело обеих сторон должно предстать
  rationale: Формулировка естественно передаёт прибытие совместного судебного дела на рассмотрение, сохраняя обе участвующие стороны.
- source_word: יַרְשִׁיעֻן
  choice: признает виновным
  rationale: Порода hifil глагола רשע в судебной речи означает объявить или признать кого-либо виновным.
- source_word: יְשַׁלֵּם שְׁנַיִם
  choice: должен возместить вдвойне
  rationale: Еврейское выражение предписывает двойное возмещение; русский вариант краток и ясен.
- source_word: לְרֵעֵהוּ
  choice: своему ближнему
  rationale: Сохраняет обычное значение רֵעַ — ближний, товарищ, другой член сообщества; из контекста ясно, что речь идёт о другой стороне спора.
theological_decisions:
- issue: Значение אֱלֹהִים в правовом контексте
  choice: Бог
  alternative: судьи / суд
  rationale: Форма буквально обозначает Бога, но в законодательном контексте может пониматься как судьи, осуществляющие власть от Его имени. Основной текст сохраняет прямое значение, а признанная судебная трактовка вынесена в сноску, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным правовым оттенком. Синтаксис сохраняет структуру перечня и судебного постановления, но избегает архаизмов. Маркеры сносок поставлены непосредственно при словах, к которым относятся.
