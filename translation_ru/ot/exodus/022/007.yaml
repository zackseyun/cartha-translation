base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/007.yaml
  text: If the thief is not found[a], the owner of the house shall come near to God to determine whether he has not laid his hand on his neighbor’s property.
translation:
  language: ru
  text: Если вор не будет найден, хозяин дома должен предстать перед Богом[a], чтобы было установлено, не наложил ли он руку на имущество своего ближнего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед судьями». Буквально в еврейском тексте: «к Богу»; в данном юридическом контексте это выражение может относиться к судьям, действующим с божественной властью.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא הַגַּנָּב
  choice: вор не будет найден
  rationale: Нифаль глагола מצא передан пассивной конструкцией. Формулировка оставляет открытым, идёт ли речь об обнаружении личности вора или о его задержании.
- source_word: וְנִקְרַב
  choice: должен предстать
  rationale: В юридическом контексте «предстать» естественно передаёт приближение для разбирательства, не утверждая прямо, пришёл ли хозяин сам или был приведён.
- source_word: בַּעַל הַבַּיִת
  choice: хозяин дома
  rationale: Обычное современное обозначение человека, владеющего домом или отвечающего за него; оно естественнее тяжеловесного «владелец дома».
- source_word: אֶל הָאֱלֹהִים
  choice: перед Богом
  rationale: Основной текст сохраняет прямое значение אֱלֹהִים. Предлог передан сообразно русскому юридическому обороту «предстать перед», а возможное понимание слова как обозначения судей вынесено в примечание.
- source_word: אִם לֹא שָׁלַח יָדוֹ
  choice: не наложил ли он руку на
  rationale: Сохранён образ еврейской идиомы, означающей неправомерное присвоение или использование; перевод «не украл ли» был бы более узким и толковательным.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: на имущество своего ближнего
  rationale: В контексте вверенных денег или вещей מְלָאכָה обозначает принадлежащее другому имущество. «Ближний» сохраняет характерную для закона лексику отношений внутри общины.
theological_decisions:
- issue: Значение אֱלֹהִים в юридическом контексте
  choice: перед Богом
  alternative: перед судьями
  rationale: Еврейский текст прямо говорит об אֱלֹהִים, «Боге», однако в правовых текстах это слово иногда понимают как обозначение судей, действующих с данной Богом властью. Основной текст сохраняет прямое значение, а судебная трактовка отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством правового текста. Конструкция «чтобы было установлено» ясно выражает подразумеваемую цель разбирательства, а оборот «наложил руку» сохраняет образность оригинала.
