source:
  edition: WLC
  text: אִם חָבֹ֥ל תַּחְבֹּ֖ל שַׂלְמַ֣ת רֵעֶ֑/ךָ עַד בֹּ֥א הַ/שֶּׁ֖מֶשׁ תְּשִׁיבֶ֥/נּוּ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/025.yaml
  text: If you take your neighbor’s cloak as a pledge[b][a], you shall return it to him before the sun sets.
translation:
  language: ru
  text: Если возьмёшь в залог верхнюю одежду[a] своего ближнего, возврати её ему до захода солнца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одежду», «плащ». Еврейское слово обозначает наружное одеяние или покрывало, которым можно было укрываться ночью.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «до прихода солнца», то есть до заката.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Вводит условие казуистического закона; «если» прямо и естественно передаёт эту конструкцию по-русски.
- source_word: חָבֹל תַּחְבֹּל
  choice: возьмёшь в залог
  rationale: Сочетание абсолютного инфинитива с личной формой глагола подчёркивает действие взятия залога. Буквальное повторение по-русски было бы неестественным, а выбранная формулировка ясно передаёт юридический смысл.
- source_word: שַׂלְמַת
  choice: верхнюю одежду
  rationale: Слово обозначает наружное одеяние или покрывало, которое могло служить защитой ночью; «верхняя одежда» точнее общего «одежда» и естественнее в современном русском, чем «плащ» в данном правовом контексте.
- source_word: רֵעֶךָ
  choice: своего ближнего
  rationale: «Ближний» сохраняет социально-нравственный смысл רֵעַ и привычно звучит в библейском правовом тексте.
- source_word: עַד בֹּא הַשֶּׁמֶשׁ
  choice: до захода солнца
  rationale: Буквально выражение означает «до прихода солнца», но в контексте это идиома, обозначающая закат.
- source_word: תְּשִׁיבֶנּוּ לוֹ
  choice: возврати её ему
  rationale: Каузативная форма שוב означает вернуть или восстановить у владельца; повелительная форма естественно передаёт обязательную норму закона.
