base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/001.yaml
  text: If the thief is found breaking in and is struck so that he dies[b][a], there is no bloodguilt for him.
translation:
  language: ru
  text: Если вор будет застигнут при взломе и его ударят так, что он умрёт, на ударившем нет кровной вины.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально еврейская идиома: «нет ему крови». То есть человек, ударивший вора, в этом случае не несёт юридической ответственности за кровопролитие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמַּחְתֶּרֶת
  choice: при взломе
  rationale: Существительное обозначает тайное проникновение посредством пролома или подкопа. «При взломе» естественно передаёт ситуацию, не сужая значение до конкретного «подкопа».
- source_word: יִמָּצֵא
  choice: будет застигнут
  rationale: В условной правовой формулировке нифаль от מצא означает, что вора обнаружили на месте действия; «застигнут» по-русски естественнее буквального «будет найден».
- source_word: הַגַּנָּב
  choice: вор
  rationale: Это прямое и общеупотребительное соответствие; контекст уточняет, что вор совершает взлом.
- source_word: וְהֻכָּה
  choice: его ударят
  rationale: Пассивная форма от נכה указывает на нанесение удара, не обязательно неоднократное избиение.
- source_word: וָמֵת
  choice: так, что он умрёт
  rationale: Передаёт результат нанесённого удара естественной русской конструкцией, сохраняя причинно-результативную связь.
- source_word: אֵין לוֹ דָּמִים
  choice: на ударившем нет вины за пролитую кровь
  rationale: Идиома דמים выражает юридическую ответственность за кровопролитие. Уточнение «на ударившем» проясняет референт местоимения, подразумеваемый контекстом.
theological_decisions:
- issue: Правовой смысл убийства вора при взломе
  choice: Передать отсутствие вины за пролитую кровь в данном случае.
  alternative: «Он не виновен в убийстве».
  rationale: Еврейская формула выносит ограниченное правовое суждение о кровной вине, а не даёт общего нравственного одобрения убийства; слово «убийство» могло бы внести более узкую современную уголовно-правовую категорию.
translation_notes:
  register: Современный литературный русский язык; условная правовая формула передана ясно и сдержанно. Сохранена категория кровной вины без конфессионального истолкования.
