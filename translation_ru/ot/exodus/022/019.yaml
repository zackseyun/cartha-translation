  text: זֹבֵ֥חַ לָ/אֱלֹהִ֖ים יָֽחֳרָ֑ם בִּלְתִּ֥י לַ/יהוָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/019.yaml
  text: Whoever sacrifices to any god[a], except to Yahweh alone, shall be devoted to destruction.
translation:
  language: ru
  text: Тот, кто приносит жертву какому-либо богу, кроме одного лишь Яхве, будет предан заклятию[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет предан уничтожению», «должен быть полностью уничтожен». Еврейский глагол означает, что человек или предмет безвозвратно отдаётся под заклятие, обычно с последующим уничтожением.'
    reason: Лексическая альтернатива и пояснение специального значения חרם.
lexical_decisions:
- source_word: זֹבֵחַ
  choice: Тот, кто приносит жертву
  rationale: Субстантивированное причастие породы qal передано естественной русской относительной конструкцией; выражение «приносит жертву» сохраняет культовый смысл жертвоприношения.
- source_word: לָאֱלֹהִים
  choice: какому-либо богу
  rationale: 'Форма אֱלֹהִים морфологически множественная, но здесь имеет обобщённо-дистрибутивный смысл: речь идёт о любом божестве, кроме Яхве. Такой перевод не устраняет контекстуальную многозначность слова вне данного стиха.'
- source_word: יָחֳרָם
  choice: будет предан заклятию
  rationale: Хофал глагола חרם обозначает помещение под херем — безвозвратное посвящение, ведущее к уничтожению. «Предан заклятию» сохраняет одновременно сакрально-правовой и карательный оттенки; смысл пояснён в сноске.
- source_word: בִּלְתִּי
  choice: кроме
  rationale: В этой конструкции слово вводит исключение; «кроме» ясно и естественно выражает его по-русски.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а связь с глаголом жертвоприношения в русском выражена общей конструкцией «какому-либо богу, кроме…».
- source_word: לְבַדּוֹ
  choice: одного лишь
  rationale: Сочетание подчёркивает исключительность Яхве как единственного допустимого адресата жертвы и естественно звучит в данном русском порядке слов.
theological_decisions:
- issue: Передача правового и сакрального значения חרם в наказании за идолослужение
  choice: будет предан заклятию
  alternative: будет предан уничтожению; должен быть полностью уничтожен
  rationale: Еврейское слово выражает не просто казнь, а безвозвратное помещение под херем. Основной перевод сохраняет эту богословско-правовую напряжённость, а сноска разъясняет следствие — уничтожение.
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное заветное имя יהוה; транслитерация «Яхве» позволяет не заменять его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Конструкция «Тот, кто…» понятна широкому читателю; техническое «предан заклятию» оставлено ради смысловой точности и разъяснено сноской.
