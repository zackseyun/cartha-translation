lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Частица вводит условие; перевод «если» сохраняет условный характер высказывания.
- source_word: עַנֵּה תְעַנֶּה
  choice: и в самом деле будешь притеснять
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает глагол. Оборот «и в самом деле» передаёт эмфазу, а «притеснять» естественно выражает причинение страданий и угнетение уязвимого человека.
- source_word: אֹתוֹ
  choice: его
  rationale: 'Суффикс стоит в мужском роде единственного числа и имеет распределительное значение: речь идёт о любом отдельном человеке из названных в предыдущем стихе вдов и сирот.'
- source_word: כִּי אִם
  choice: и если
  rationale: В данном построении слова продолжают условную последовательность; «и если» сохраняет связь частей без внесения противопоставления.
- source_word: צָעֹק יִצְעַק
  choice: он воззовёт
  rationale: Глагол צעק означает настойчивый крик о помощи. Русское «воззовёт» уместно для обращения к Богу; особая эмфаза еврейской конструкции пояснена в сноске, чтобы не перегружать фразу наречиями.
- source_word: אֵלַי
  choice: ко Мне
  rationale: Прямо передаёт направленность мольбы к говорящему Богу.
- source_word: שָׁמֹעַ אֶשְׁמַע
  choice: Я непременно услышу
  rationale: «Непременно» естественно передаёт усилительную конструкцию и подчёркивает несомненность Божьего ответа.
- source_word: צַעֲקָתוֹ
  choice: его вопль
  rationale: «Вопль» передаёт сильный крик бедствующего человека и сохраняет смысловую связь с глаголом «воззовёт».
theological_decisions:
- issue: Мужской род единственного числа для притесняемого человека
  choice: его / он / его
  alternative: их / они / их
  rationale: Еврейские местоименные суффиксы имеют мужской род и единственное число, однако в контексте обозначают любого отдельного представителя группы из предыдущего стиха — вдову или сироту. Формальная особенность сохранена и разъяснена в сноске, без ограничения обещания только лицами мужского пола.
translation_notes:
  register: Современный литературный русский язык с достоинством правового и пророческого контекста. «Воззовёт» и «вопль» слегка возвышенны, но понятны современному читателю; эмфатические конструкции переданы без буквального и неестественного повторения глаголов.
