    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: Вводит условие казуистического закона; «если» естественно для современного русского юридического изложения.
- source_word: יִתֵּן ... לִשְׁמֹר
  choice: отдаст ... на хранение
  rationale: Передаёт обычное значение נתן и одновременно ясно выражает цель передачи, обозначенную инфинитивом שׁמר.
- source_word: אִישׁ
  choice: человек
  rationale: В русском языке «человек» естественно выступает как обобщённое обозначение участника правового случая, не меняя референциального смысла мужского единственного числа.
- source_word: אֶל רֵעֵהוּ
  choice: своему ближнему
  rationale: «Ближний» сохраняет социально-правовой смысл רֵעַ и привычен для библейского текста, оставаясь понятным современному читателю.
- source_word: חֲמוֹר
  choice: осла
  rationale: Прямой и современный русский эквивалент.
- source_word: שׁוֹר
  choice: быка
  rationale: שׁוֹר обозначает животное крупного рогатого скота; «бык» — естественное видовое наименование в перечислении животных, тогда как «вол» мог бы неоправданно уточнить кастрацию и рабочее назначение.
- source_word: שֶׂה
  choice: овцу
  rationale: Естественный конкретный эквивалент в основном тексте; возможность обозначения козы или вообще головы мелкого скота сохранена в сноске.
- source_word: וְכָל בְּהֵמָה
  choice: или какое-либо другое домашнее животное
  rationale: בְּהֵמָה здесь обозначает домашний скот в широком смысле; «другое» естественно показывает обобщение после приведённых примеров.
- source_word: וּמֵת
  choice: а оно умрёт
  rationale: Передаёт один из возможных исходов в условной правовой ситуации; союз «а» естественно связывает передачу на хранение с последующим происшествием.
- source_word: נִשְׁבַּר
  choice: получит увечье
  rationale: Буквально форма значит «будет сломано»; применительно к животному «получит увечье» звучит естественно и передаёт серьёзное телесное повреждение.
- source_word: נִשְׁבָּה
  choice: будет уведено
  rationale: Сохраняет значение насильственного захвата или угона, не сужая его до обычной кражи.
- source_word: אֵין רֹאֶה
  choice: никто этого не увидит
  rationale: Прямо передаёт отсутствие свидетеля происшедшего и естественно встраивается в условную конструкцию.
