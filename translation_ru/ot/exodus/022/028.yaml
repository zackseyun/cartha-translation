base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/028.yaml
  text: You shall not delay the fullness of your harvest and the outflow of your press[a]. You shall give to me the firstborn of your sons.
translation:
  language: ru
  text: Не медли с приношениями от твоего полного урожая и от сока из твоего точила[a]. Первенца из твоих сыновей отдай Мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от всего твоего урожая и от твоего сока (вина)». Еврейские слова, вероятно, обозначают собранный урожай и жидкость, полученную выжиманием; возможно, конкретно зерно и вино, но точное сочетание не вполне ясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָתְךָ
  choice: от полноты твоего урожая
  rationale: Существительное מְלֵאָה буквально обозначает «полноту» или «полный урожай». В данном правовом контексте речь идёт о доле урожая, которую надлежит принести Богу; перевод сохраняет образ полноты и уточняет его земледельческий смысл.
- source_word: וְדִמְעֲךָ
  choice: от сока из твоего точила
  rationale: דִּמְעָה буквально может означать «слеза», но здесь обозначает жидкий продукт, полученный выжиманием, вероятно вино или масло. «Сок из твоего точила» передаёт образ истекающей жидкости, не ограничивая значение исключительно вином.
- source_word: לֹא תְאַחֵר
  choice: Не медли с приношением
  rationale: Глагол אחר в пиэле означает «задерживать, откладывать». Добавление «с приношением» естественно выражает подразумеваемый в контексте предмет запрета и связывает оба названия урожая с их посвящением Богу.
- source_word: בְּכוֹר
  choice: первенца
  rationale: בְּכוֹר обозначает перворождённого; винительный падеж естественно обусловлен русским глаголом «отдай».
- source_word: בָּנֶיךָ
  choice: из твоих сыновей
  rationale: В еврейском тексте употреблено конкретно «твоих сыновей», а не общее слово «детей»; перевод сохраняет это различие.
- source_word: תִּתֶּן לִּי
  choice: отдай Мне
  rationale: Форма выражает прямое правовое предписание. «Отдай Мне» звучит по-русски естественно и сохраняет акцент на Боге как получателе.
theological_decisions:
- issue: Значение земледельческой пары מְלֵאָה / דִמְעָה в постановлении о приношениях
  choice: Повеление не откладывать приношение как от собранного урожая, так и от жидкого продукта, полученного выжиманием.
  alternative: Эти слова могут обозначать конкретно зерно и вино либо, шире, начатки всякого урожая без строгого деления на виды.
  rationale: Еврейские слова, вероятно, образуют пару из твёрдого урожая и выжатой жидкости. Перевод не сужает второй термин до вина и сохраняет некоторую неопределённость исходного текста.
- issue: Передача בָּנֶיךָ
  choice: сыновей
  alternative: детей
  rationale: Исходное слово имеет мужское значение; его сохранение не привносит дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством правового Божьего повеления. Формула «Не медли с приношением» естественнее буквального соединения глагола «задерживать» с названиями урожая; прописная буква в «Мне» отражает обращение Бога от первого лица.
