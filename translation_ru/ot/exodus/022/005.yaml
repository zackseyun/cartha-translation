  text: If a fire breaks out and catches in thorns[a], so that stacked grain or standing grain or the field is consumed[b], the one who started the fire must surely make restitution.
translation:
  language: ru
  text: Если вспыхнет огонь и охватит колючий кустарник[a], так что сгорит сложенное в скирды зерно, или хлеб на корню, или поле, то тот, кто разжёг огонь, должен полностью возместить ущерб[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и найдёт колючки»; возможно также: «и охватит колючки».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «непременно возместит»; в еврейском тексте обязанность усилена сочетанием абсолютного инфинитива с личной формой глагола.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: Вводит условие казуистического закона; «если» естественно передаёт условный характер правовой нормы.
- source_word: תֵצֵא אֵשׁ
  choice: вспыхнет огонь
  rationale: Естественно передаёт идиому о возникновении и распространении огня, а не о его угасании.
- source_word: וּמָצְאָה קֹצִים
  choice: и охватит колючий кустарник
  rationale: Буквально огонь «находит» колючки; по контексту он достигает и воспламеняет сухую колючую растительность. Формулировка сохраняет образ и ясна современному читателю.
- source_word: וְנֶאֱכַל
  choice: сгорит
  rationale: Nifal от אכל описывает уничтожение огнём; «сгорит» по-русски естественнее буквального «будет пожрано».
- source_word: גָּדִישׁ
  choice: сложенное в скирды зерно
  rationale: Обозначает уже убранный урожай, собранный в кучу или скирду; перевод сохраняет противопоставление зерну на корню.
- source_word: הַקָּמָה
  choice: хлеб на корню
  rationale: Устойчивое современное русское выражение для ещё не убранной зерновой культуры.
- source_word: הַשָּׂדֶה
  choice: поле
  rationale: Прямой и ясный эквивалент; в перечне может подразумеваться и иной ущерб полю помимо зерновых.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: должен полностью возместить ущерб
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает безусловность обязанности возместить причинённый ущерб.
- source_word: הַמַּבְעִר אֶת הַבְּעֵרָה
  choice: тот, кто разжёг огонь
  rationale: Передаёт лицо, ответственное за разжигание огня, ясным языком правовой нормы.
