lexical_decisions:
- source_word: מְכַשֵּׁפָה
  choice: ворожеи
  rationale: Еврейское существительное стоит в женском роде и единственном числе и обозначает женщину, занимающуюся колдовством. «Ворожея» сохраняет эту грамматическую определённость и звучит по-русски естественно и понятно.
- source_word: לֹא
  choice: не
  rationale: Обычная отрицательная частица, непосредственно выражающая запрет.
- source_word: תְחַיֶּה
  choice: не оставляй в живых
  rationale: Пиэль, имперфект 2-го лица мужского рода единственного числа от חיה, здесь имеет значение «сохранять жизнь, оставлять в живых». Такая передача сохраняет форму прямого запрета и не добавляет отсутствующего в тексте указания на способ исполнения наказания.
theological_decisions:
- issue: Передача пола нарушителя
  choice: 'Сохранить женский род единственного числа: «ворожеи».'
  alternative: 'Передать обобщённо: «колдуна» или «того, кто занимается колдовством».'
  rationale: Форма מְכַשֵּׁפָה явно женского рода; нейтрализация пола устранила бы значимую черту исходного текста.
- issue: Сила правового запрета
  choice: «Не оставляй в живых».
  alternative: 'Более истолковывающее: «предай смерти».'
  rationale: Хотя в контексте закона речь идёт о смертной казни, еврейский текст буквально запрещает сохранять жизнь. Перевод не уточняет способ наказания и не заменяет исходную формулировку более явной судебной формулой.
translation_notes:
  register: Краткая, строгая формулировка в стиле правового предписания. «Ворожея» — литературное и понятное современному читателю слово; альтернатива «колдунья» вынесена в сноску. Единственное число повелительной формы передаёт обращение к члену народа в рамках заветного закона.
