- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Союз вводит сопоставление с образцом, показанным на горе.
- source_word: הֶרְאָה אֹתְךָ
  choice: было показано тебе
  rationale: Сохранён пассив еврейского хофаля и не назван подразумеваемый деятель, как и в исходном тексте.
- source_word: בָּהָר
  choice: на горе
  rationale: Это нормативное русское обозначение места откровения; оно естественно передаёт здесь предлог ב.
- source_word: כֵּן יַעֲשׂוּ
  choice: так пусть его и сделают
  rationale: 'Формулировка сохраняет множественное число глагола и сравнительно-результативную связь: исполнители должны сделать алтарь в соответствии с показанным образцом.'
