base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/020.yaml
  text: And you shall command the sons of Israel that they bring to you pure beaten olive oil for the light[c][b][a], to cause a lamp to burn continually.
translation:
  language: ru
  text: Ты же повели сынам Израиля, приносить тебе чистое оливковое масло из толчёных маслин для освещения, чтобы постоянно поддерживать горение светильника.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתָּה
  choice: Ты же
  rationale: Самостоятельное местоимение подчёркивает обращение к Моисею, а союз отмечает переход к новому предписанию. «Ты же» естественно передаёт оба оттенка.
- source_word: תְּצַוֶּה
  choice: повели
  rationale: Порода piel глагола צוה означает «повелевать, приказывать». Совершенный вид и повелительная форма естественно передают директивную силу в русском законодательном стиле.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохранено буквальное родственно-заветное наименование; возможное собирательное значение пояснено в сноске.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: приносить тебе
  rationale: Хотя לקח буквально означает «брать», сочетание с אֶל и местоименным суффиксом в контексте снабжения обозначает доставку к Моисею. Несовершенный вид «приносить» допускает требуемое регулярное снабжение.
- source_word: שֶׁמֶן זַיִת
  choice: оливковое масло
  rationale: Естественный современный русский эквивалент еврейского сочетания «масло оливы».
- source_word: זָךְ
  choice: чистое
  rationale: Слово характеризует чистоту и прозрачность масла; «чистое» сохраняет широту значения и уместно в культовом контексте.
- source_word: כָּתִית
  choice: из толчёных маслин
  rationale: Прилагательное указывает на масло, полученное путём толчения или дробления. В русском языке преобразование в предложное сочетание звучит естественнее буквального «толчёное масло».
- source_word: לַמָּאוֹר
  choice: для освещения
  rationale: Передаёт назначение масла и не добавляет в текст не названный здесь конкретный осветительный прибор.
- source_word: לְהַעֲלֹת נֵר
  choice: чтобы светильник горел
  rationale: Еврейская идиома буквально говорит о том, чтобы «поднимать» огонь светильника; русский перевод выражает её ясный функциональный смысл, сохраняя каузативную связь через конструкцию цели.
- source_word: תָּמִיד
  choice: постоянно
  rationale: Традиционный и достаточно широкий эквивалент, который в данном храмовом контексте может обозначать регулярно поддерживаемое действие, а не обязательно непрерывность каждую секунду.
theological_decisions:
- issue: Родственно-заветное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам; народу Израиля
  rationale: Основной текст сохраняет явно выраженную в еврейском оригинале форму «сыны Израиля», не превращая её без необходимости в нейтральное собирательное обозначение. При этом выражение является устойчивым названием заветного сообщества и само по себе не утверждает исключения женщин.
- issue: Характер постоянства, выраженный תָּמִיד
  choice: постоянно
  alternative: регулярно; непрестанно
  rationale: '«Постоянно» сохраняет смысловую широту оригинала: в предписаниях о святилище это слово может обозначать установленное регулярное поддержание светильника, не требуя догматического вывода о буквальной беспрерывности.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, но понятным стилем. Формула «Ты же повели» сохраняет прямое обращение и законодательный тон; технические подробности производства масла вынесены в сноску, чтобы основной текст оставался плавным.
