    issue: Каузативный оттенок לְהַעֲלֹת נֵר ослаблен.
    rationale: Фраза «чтобы светильник горел» описывает состояние светильника, тогда как еврейская идиома предписывает действие по зажиганию/поддержанию лампы. «Чтобы поддерживать горение светильника» яснее сохраняет направленность действия.
  - severity: low
    issue: Пунктуация в длинной инфинитивной конструкции.
    rationale: Запятая после «сына́м Израиля» отделяет адресата повеления от предписанного действия и делает современное русское чтение легче.
  revised_text: Ты же повели сынам Израиля, приносить тебе чистое оливковое масло из толчёных маслин для освещения, чтобы постоянно поддерживать горение светильника.
