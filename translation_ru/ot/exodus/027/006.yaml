  text: וְ/עָשִׂ֤יתָ בַדִּים֙ לַ/מִּזְבֵּ֔חַ בַּדֵּ֖י עֲצֵ֣י שִׁטִּ֑ים וְ/צִפִּיתָ֥ אֹתָ֖/ם נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/006.yaml
  text: You shall make poles for the altar[a], poles of acacia wood, and you shall overlay them with bronze.
translation:
  language: ru
  text: Сделай для жертвенника шесты — шесты из древесины акации — и обложи их бронзой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «медью».'
    reason: Еврейское נְחֹשֶׁת может обозначать как медь, так и медный сплав, обычно понимаемый как бронза.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Сделай
  rationale: Форма Qal 2-го лица мужского рода единственного числа с союзом в последовательности предписаний передаёт прямое повеление; русский императив звучит естественно и сохраняет обязательную силу.
- source_word: בַדִּים / בַּדֵּי
  choice: шесты
  rationale: Речь идёт о длинных шестах для переноски жертвенника. «Шесты» — ясное современное обозначение; повтор существительного сохранён в соответствии с еврейским текстом.
- source_word: לַמִּזְבֵּחַ
  choice: для жертвенника
  rationale: Перевод точно передаёт выражение данного стиха и не добавляет отсутствующее здесь уточнение о виде жертвенника.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Так естественно и точно обозначается материал; традиционная транслитерация названия древесины была бы менее понятна современному читателю.
- source_word: וְצִפִּיתָ
  choice: и обложи
  rationale: В описаниях святилища Piel глагола צפה означает покрыть предмет слоем металла. «Обложи» передаёт ремесленный смысл, не уточняя неизвестную технологию.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение относится к шестам и явно сохранено в переводе.
- source_word: נְחֹשֶׁת
  choice: бронзой
  rationale: Еврейское слово может обозначать медь или медный сплав; «бронза» соответствует распространённому пониманию металла храмовой утвари, а лексическая неопределённость отражена в сноске.
