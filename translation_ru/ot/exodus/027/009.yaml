lexical_decisions:
- source_word: חֲצַר
  choice: двор
  rationale: Обозначает открытое огороженное пространство при скинии; «двор» естественно и ясно передаёт культово-архитектурное значение.
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: Устоявшееся русское обозначение священного шатра в книге Исход; сохраняет связь с библейской культовой терминологией.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: С южной стороны, к югу
  rationale: Сохранено характерное для еврейского текста удвоенное указание на южное направление, без сведения его к одному прилагательному.
- source_word: קְלָעִים
  choice: завесы
  rationale: Речь о тканевых полотнищах, образующих внешнюю границу двора; «завесы» понятно современному читателю и соответствует их функции.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: тонкий кручёный лён
  rationale: Переданы и материал, и способ его изготовления; это понятнее современному читателю, чем традиционное, но малоупотребительное слово «виссон».
- source_word: מֵאָה בָאַמָּה
  choice: сто локтей
  rationale: Сохранена древняя единица длины без приблизительного пересчёта в современные меры.
- source_word: אֹרֶךְ
  choice: длиной
  rationale: Естественно связывает указание размера с завесами.
- source_word: לַפֵּאָה הָאֶחָת
  choice: по одной стороне
  rationale: Передаёт единичную сторону периметра двора и естественно сочетается с указанием общей длины.
