  yaml_path: translation/ot/exodus/027/001.yaml
  text: You shall make the altar of acacia wood[a], five cubits long and five cubits wide; the altar shall be square, and its height shall be three cubits.
translation:
  language: ru
  text: 'Сделай жертвенник из древесины акации: пять локтей в длину и пять локтей в ширину. Жертвенник должен быть квадратным, а высота его — три локтя.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Сделай
  rationale: Форма с союзом в контексте предписаний передаёт прямое повеление; русский императив естественно и точно выражает эту силу.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Обычный русский эквивалент מִזְבֵּחַ в контексте устройства святилища; определённость понятна из контекста и повторного упоминания.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Сочетание обозначает материал. Такой перевод понятен современному читателю и избегает непрозрачной традиционной транслитерации названия дерева.
- source_word: חָמֵשׁ אַמּוֹת אֹרֶךְ
  choice: пять локтей в длину
  rationale: Естественная русская формула линейного размера, точно передающая исходное выражение.
- source_word: וְחָמֵשׁ אַמּוֹת רֹחַב
  choice: и пять локтей в ширину
  rationale: Сохраняет параллелизм размеров и ясно передаёт ширину.
- source_word: רָבוּעַ יִהְיֶה
  choice: должен быть квадратным
  rationale: רָבוּעַ указывает на квадратную форму основания; современное «квадратным» яснее архаичных вариантов.
- source_word: וְשָׁלֹשׁ אַמּוֹת קֹמָתוֹ
  choice: а высота его — три локтя
  rationale: Передаёт существительное קֹמָה и притяжательный суффикс, сохраняя размерное утверждение в естественной русской форме.
