base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/011.yaml
  text: 'And likewise for the north side in length: hangings a hundred cubits long[a], its twenty pillars and their twenty bronze bases[b], and the hooks of the pillars and their bands shall be silver.'
translation:
  language: ru
  text: 'Так же для северной стороны по длине: завесы длиной в сто локтей[a], двадцать столбов и двадцать бронзовых оснований для них; крюки на столбах и обвязки столбов — серебряные.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте буквально: «длиной сто»; слово «локтей» добавлено по непосредственному контексту размеров двора скинии.'
    reason: cultural_note
lexical_decisions:
- source_word: וְכֵן
  choice: Так же и
  rationale: Передаёт соответствие устройству южной стороны, описанному в предыдущем стихе.
- source_word: לִפְאַת צָפוֹן בָּאֹרֶךְ
  choice: с северной стороны, вдоль неё
  rationale: פאה обозначает сторону или край, а בָּאֹרֶךְ указывает на расположение по длине; формулировка естественна по-русски и сохраняет пространственный смысл.
- source_word: קְלָעִים
  choice: завесы
  rationale: В описании двора скинии это полотнища, образующие ограждение; «завесы» — понятное и достаточно точное обозначение без добавления не названного здесь материала.
- source_word: מֵאָה אֹרֶךְ
  choice: длиной сто локтей
  rationale: В еврейском буквально сказано «длиной сто», но единица измерения ясно восстанавливается из непосредственного контекста.
- source_word: וְעַמֻּדָיו עֶשְׂרִים
  choice: двадцать столбов
  rationale: Сохраняет краткую перечислительную, безглагольную конструкцию оригинала; принадлежность очевидна из описания данной стороны двора.
- source_word: וְאַדְנֵיהֶם עֶשְׂרִים נְחֹשֶׁת
  choice: двадцать бронзовых оснований для них
  rationale: אדן здесь обозначает опору или гнездо под столб; «основания» понятно современному читателю, а «для них» однозначно связывает их со столбами.
- source_word: וָוֵי הָעַמֻּדִים
  choice: крюки на столбах
  rationale: וָוִים — крюки или зацепы, прикреплённые к столбам; предложная конструкция звучит естественно по-русски.
- source_word: וַחֲשֻׁקֵיהֶם
  choice: их скрепы
  rationale: Термин обозначает соединяющие или охватывающие детали столбов. «Скрепы» сохраняет функциональную широту слова и не навязывает точную форму детали.
- source_word: כָּסֶף
  choice: серебряные
  rationale: Передаёт материал через естественное для русского языка составное именное сказуемое.
