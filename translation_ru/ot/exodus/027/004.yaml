  text: You shall make for it a grating[a], a network of bronze[b], and on the network you shall make four bronze rings at its four corners.
translation:
  language: ru
  text: Сделай для него бронзовую решётку в виде сетки[a] и сделай на этой сетке четыре бронзовых кольца по четырём её углам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «решётку — работу сетки — из бронзы»; или: «бронзовую сетчатую решётку».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по четырём её краям» или «оконечностям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְבָּר
  choice: решётка
  rationale: Слово обозначает решётчатую конструкцию при жертвеннике; «решётка» — естественный и точный современный русский эквивалент.
- source_word: מַעֲשֵׂה רֶשֶׁת
  choice: в виде ... сетки
  rationale: Буквально «работы сетки»; оборот передаёт сетчатое устройство и сохраняет связь с последующим הָרֶשֶׁת («сетка»).
- source_word: נְחֹשֶׁת
  choice: бронзовой / бронзовых
  rationale: В контексте устройства святилища традиционное и уместное значение — «бронза», хотя древнееврейское слово может обозначать также медь или медный сплав.
- source_word: עַל הָרֶשֶׁת
  choice: к сетке
  rationale: Хотя עַל обычно означает «на», применительно к кольцам естественный русский оборот «прикрепи к сетке» ясно выражает их расположение на ней без добавления технических подробностей.
- source_word: טַבְּעֹת
  choice: кольца
  rationale: Обычное обозначение колец, служащих точками крепления в описаниях принадлежностей святилища.
- source_word: קְצוֹתָיו
  choice: по четырём её углам
  rationale: Существительное буквально обозначает края или оконечности; для четырёхугольной решётки по-русски наиболее ясно «углы», при этом буквальная альтернатива отмечена в сноске.
- source_word: לּוֹ
  choice: для него
  rationale: Местоимение относится к жертвеннику, который в русском языке мужского рода.
- source_word: וְעָשִׂיתָ
  choice: сделай / прикрепи
  rationale: Формы продолжают ряд предписаний и естественно передаются русским повелительным наклонением; во второй части «прикрепи» контекстуально раскрывает изготовление колец на сетке.
