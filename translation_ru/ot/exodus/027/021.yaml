base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/021.yaml
  text: In the tent of meeting[a], outside the veil that is before the testimony, Aaron and his sons shall arrange it before Yahweh from evening until morning[c][b]. It shall be a perpetual statute throughout their generations from the Israelites.
translation:
  language: ru
  text: В шатре встречи, вне завесы[a], находящейся перед Свидетельством[b], Аарон и его сыновья должны приводить его в порядок[c] перед Яхве с вечера до утра. Это будет вечным установлением для израильтян из поколения в поколение[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с внешней стороны завесы». Здесь имеется в виду внутренняя завеса святилища.'
    reason: lexical_alternative
  - marker: b
    text: «Свидетельство» — вероятнее всего, скрижали завета, хранившиеся в ковчеге; поэтому завеса находилась перед ковчегом со Свидетельством.
    reason: cultural_note
  - marker: c
    text: 'Или: «устраивать его», «содержать его в порядке». В контексте речь идёт о служении при светильнике; еврейский текст буквально сохраняет местоимение «его».'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «вечное установление для их поколений от сынов Израиля». Предлог может подчёркивать, что исполнение этой обязанности и необходимое для неё обеспечение исходят от израильтян.'
    reason: translation_note
lexical_decisions:
- source_word: בְּאֹהֶל מוֹעֵד
  choice: в шатре встречи
  rationale: Передаёт устойчивое культовое обозначение места встречи Бога с Израилем; «шатёр» естественно соответствует אֹהֶל и понятно современному читателю.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: с внешней стороны завесы
  rationale: פָּרֹכֶת обозначает внутреннюю завесу святилища; такая формулировка ясно выражает пространственное положение.
- source_word: אֲשֶׁר עַל הָעֵדֻת
  choice: находящейся перед Свидетельством
  rationale: Хотя עַל обычно означает «над/на», здесь оно описывает положение завесы относительно ковчега со Свидетельством. Пространственное «перед» естественно в данном контексте, а предметный смысл «Свидетельства» пояснён в сноске.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: должны приводить его в порядок
  rationale: ערך означает располагать, устраивать, приводить в порядок. Перевод сохраняет единственное число местоимения и не уточняет без необходимости, идёт ли речь о светильнике, его огне или всём служении при нём.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: с вечера до утра
  rationale: Естественная русская передача обозначенного ночного промежутка времени.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Сохраняет культовое выражение «перед» и передаёт личное заветное имя יהוה как «Яхве».
- source_word: חֻקַּת עוֹלָם
  choice: вечное установление
  rationale: Передаёт длительную и обязательную силу культового предписания, не добавляя ограничения, которого нет в тексте.
- source_word: לְדֹרֹתָם מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: для израильтян из поколения в поколение
  rationale: Естественно передаёт продолжающуюся обязанность Израиля во всех поколениях. Необычное מֵאֵת буквально указывает на исходность «от» израильтян; это сохранено в сноске как возможный более буквальный оттенок.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит Тетраграмматон; транслитерация «Яхве» сохраняет личное имя Бога и не заменяет его титулом.
- issue: Значение חֻקַּת עוֹלָם
  choice: вечное установление
  alternative: неизменное установление; постоянное установление
  rationale: Слово עוֹלָם в законодательной формуле выражает неограниченную длительность установления в рамках завета. «Вечное» сохраняет силу исходной формулы, не объясняя заранее её богословские пределы.
- issue: Референт местоимения אֹתוֹ
  choice: его
  alternative: светильник; его огонь
  rationale: Еврейский текст употребляет местоимение мужского рода единственного числа, чей предмет определяется предшествующим контекстом. Сохранение местоимения не устраняет эту контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с dignified культовым регистром. Синтаксис упрощён ровно настолько, чтобы стих легко читался, но технические слова «завеса», «Свидетельство», «установление» сохранены. Заглавная буква в «Свидетельстве» отмечает специальное название скрижалей завета.
