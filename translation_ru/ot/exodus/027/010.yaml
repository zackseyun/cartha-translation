lexical_decisions:
- source_word: עַמֻּדָיו
  choice: с двадцатью столбами
  rationale: עַמּוּד означает «столб, колонна». Начальный союз продолжает синтаксическую конструкцию предыдущего стиха; по-русски связь естественно передаётся предлогом «с». Суффикс принадлежности явно не выражен, поскольку контекст уже указывает на описываемую сторону двора.
- source_word: אַדְנֵיהֶם
  choice: двадцатью бронзовыми основаниями для них
  rationale: אֶדֶן в описании скинии обозначает опору или гнездо, в которое устанавливался столб. «Основания» понятно современному читателю, а «для них» сохраняет отнесённость местоименного суффикса к столбам.
- source_word: נְחֹשֶׁת
  choice: бронзовыми
  rationale: נְחֹשֶׁת может обозначать медь или бронзу; в контексте принадлежностей скинии традиционным и вероятным обозначением материала является бронза.
- source_word: וָוֵי
  choice: крюки
  rationale: וָו обычно обозначает крюки, служившие частью конструкции скинии; «крюки» передаёт вероятную функцию без излишней конкретизации.
- source_word: חֲשֻׁקֵיהֶם
  choice: их обручи
  rationale: Точное устройство חֲשֻׁקִים неясно. «Обручи» сохраняет представление об охватывающих или скрепляющих серебряных деталях столбов, не используя устаревшее «связи» или чрезмерно конкретное «соединительные перекладины».
- source_word: כָּסֶף
  choice: серебряные
  rationale: כֶּסֶף здесь прямо обозначает серебро как материал крюков и обручей; именная еврейская конструкция естественно передана русским прилагательным.
- source_word: וְ
  choice: с / и
  rationale: Начальный союз связывает стих с предыдущим описанием и по-русски естественно передаётся как «с»; дальнейшее перечисление оформлено сочинительной связью и пунктуацией.
