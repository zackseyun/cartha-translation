  text: And for the second side there shall be fifteen cubits of hangings[c][b][a], with three pillars and their three bases.
translation:
  language: ru
  text: И для второй стороны — завесы длиной в пятнадцать локтей[a], при них три столба и три основания[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте: «пятнадцать завес»; слово «локтей» подразумевается по параллельной формулировке в предыдущем стихе.'
    reason: implicit_unit_and_grammatical_ambiguity
  - marker: b
    text: 'Или: «гнёзд». Имеются в виду нижние опорные детали, в которых устанавливались столбы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/כָּתֵף הַ/שֵּׁנִית
  choice: И для второй стороны
  rationale: כָּתֵף буквально означает «плечо», но в описании двора обозначает боковую сторону. «Для второй стороны» прямо передаёт конструкцию и порядковое значение הַשֵּׁנִית.
- source_word: חְמֵשׁ עֶשְׂרֵה קְלָעִים
  choice: завесы длиной в пятнадцать локтей
  rationale: קְלָעִים — тканевые завесы ограды двора. Единица длины в еврейском тексте этого стиха опущена, однако из параллельной формулы в предыдущем стихе ясно подразумеваются локти; добавление «длиной» не позволяет ошибочно понять число как количество отдельных завес.
- source_word: עַמֻּדֵי/הֶם
  choice: столбов для них — три
  rationale: עַמּוּד обозначает вертикальную опору. В русском описании ограды «столб» естественнее, чем монументально звучащая «колонна»; «для них» передаёт местоименный суффикс множественного числа.
- source_word: וְ/אַדְנֵי/הֶם
  choice: и оснований — три
  rationale: אֶדֶן здесь обозначает нижнюю опорную деталь, в которой закреплялся столб. «Основание» понятно современному читателю, а более техническое «гнездо» отмечено в сноске.
