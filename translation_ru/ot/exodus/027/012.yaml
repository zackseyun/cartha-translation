  text: And for the width of the court on the west side[a], there shall be hangings of fifty cubits[b], with ten pillars and ten bases.
translation:
  language: ru
  text: А по ширине двора с западной стороны[a] — завесы в пятьдесят локтей; при них десять столбов и десять оснований[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со стороны моря»; это обычное древнееврейское обозначение западной стороны.'
    reason: lexical_alternative
