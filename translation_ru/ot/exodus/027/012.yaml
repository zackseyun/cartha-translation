    text: 'Или: «гнёзд». Речь идёт об опорах, в которые устанавливались столбы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרֹחַב הֶחָצֵר
  choice: А по ширине двора
  rationale: רֹחַב означает «ширина»; начальное וְ связывает предписание с предыдущим контекстом. Конструкция «А по ширине двора» естественно вводит описание следующей стороны ограды.
- source_word: לִפְאַת יָם
  choice: с западной стороны
  rationale: פֵאָה обозначает сторону или край, а יָם буквально значит «море», но в стандартной древнееврейской пространственной ориентации указывает на запад.
- source_word: קְלָעִים
  choice: завесы
  rationale: В описании двора скинии слово обозначает тканевые полотнища, образующие ограду. «Завесы» — понятное и уместное архитектурно-культовое обозначение.
- source_word: חֲמִשִּׁים אַמָּה
  choice: в пятьдесят локтей
  rationale: Прямо передаёт меру протяжённости завес; добавлять «длиной» необязательно, поскольку это ясно из упоминания ширины двора.
- source_word: עַמֻּדֵיהֶם עֲשָׂרָה
  choice: столбов для них — десять
  rationale: Сохраняет число и смысл местоименного суффикса 3-го лица множественного числа, связывающего столбы с завесами, но избегает неестественного русского «их столбов».
- source_word: וְאַדְנֵיהֶם עֲשָׂרָה
  choice: и оснований для них — десять
  rationale: אֶדֶן обозначает опорное основание или гнездо для столба. «Основание» наиболее понятно современному читателю; местоименный суффикс сохранён оборотом «для них».
