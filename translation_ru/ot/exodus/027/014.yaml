  text: Fifteen cubits of hangings for the shoulder[a], with their three pillars and their three bases.
translation:
  language: ru
  text: Для одной стороны — завесы длиной пятнадцать локтей; столбов для них — три, и оснований[a] для них — три.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
