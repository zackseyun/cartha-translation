lexical_decisions:
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: длиной пятнадцать локтей
  rationale: Составное числительное и стандартная мера длины переданы прямо; слово «длиной» естественно выражает по-русски подразумеваемое измерение протяжённости.
- source_word: קְלָעִים
  choice: завесы
  rationale: В описании двора скинии это тканевые полотнища, образующие ограду. «Завесы» соответствует принятой библейской строительной лексике и понятно современному читателю.
- source_word: לַכָּתֵף
  choice: для одной стороны
  rationale: Буквально существительное означает «плечо», но здесь обозначает боковую часть по одну сторону входа. Перевод передаёт архитектурное значение, не создавая в русском неясной метафоры.
- source_word: עַמֻּדֵיהֶם
  choice: столбов для них
  rationale: עַמּוּד обозначает столб или колонну; в конструкции ограды уместно «столб». Оборот «для них» передаёт местоименный суффикс, относящийся к завесам.
- source_word: אַדְנֵיהֶם
  choice: оснований для них
  rationale: אֶדֶן здесь обозначает опорное основание, в которое устанавливается столб. «Основание» ясно передаёт функцию детали; технически более узкое «гнездо» отмечено в сноске.
