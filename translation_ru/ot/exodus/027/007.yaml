  yaml_path: translation/ot/exodus/027/007.yaml
  text: Its poles shall be put into the rings[b][a], and the poles shall be on the two sides of the altar when it is carried.
translation:
  language: ru
  text: Его шесты должны быть вставлены в кольца, и при переноске жертвенника шесты должны находиться по обеим его сторонам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוּבָא
  choice: должны быть вставлены
  rationale: Хофал глагола בוא имеет пассивно-каузативное значение; в контексте колец и шестов естественное русское «быть вставленными» точно передаёт предписанное действие.
- source_word: בַּדָּיו
  choice: его шесты
  rationale: בַּד обозначает шесты для переноски предметов святилища; «шесты» — ясное и современное соответствие.
- source_word: בַּטַּבָּעֹת
  choice: в кольца
  rationale: Предлог ב здесь указывает на помещение шестов внутрь колец; русская конструкция с глаголом «вставить» требует формы «в кольца».
- source_word: וְהָיוּ
  choice: должны находиться
  rationale: В последовательности предписаний форма выражает требуемое положение шестов после их установки; «должны находиться» естественно передаёт этот смысл.
- source_word: עַל שְׁתֵּי צַלְעֹת
  choice: по обеим его сторонам
  rationale: צלע допускает значения «сторона», «боковая часть»; здесь речь о расположении шестов с двух сторон жертвенника. «По обеим сторонам» естественно передаёт пространственное отношение עַל и שְׁתֵּי.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенника
  rationale: Стандартное соответствие для מִזְבֵּחַ в культовом контексте.
- source_word: בִּשְׂאֵת אֹתוֹ
  choice: при переноске жертвенника
  rationale: Инфинитивная конструкция с ב выражает обстоятельство времени; существительное «жертвенника» ясно передаёт местоименное дополнение и устраняет возможную неясность русского «его».
