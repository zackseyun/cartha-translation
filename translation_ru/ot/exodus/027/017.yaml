  yaml_path: translation/ot/exodus/027/017.yaml
  text: All the pillars around the courtyard shall be banded with silver[c][b][a], with their hooks of silver and their bases of bronze.
translation:
  language: ru
  text: Все столбы вокруг двора должны быть снабжены серебряной обвязкой[a]; их крюки должны быть серебряными, а основания[b] — бронзовыми[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «опоясаны серебряными обручами» или «соединены серебряными стержнями». Древнееврейское слово может обозначать серебряную обвязку либо соединительные детали на столбах.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «гнёзда» — металлические опоры, в которые устанавливались столбы.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «медными». Древнееврейское слово могло обозначать медь или медный сплав.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: Все столбы вокруг двора
  rationale: Передаёт совокупность опор со всех сторон двора; «двор» естественен и ясен в контексте святилища.
- source_word: מְחֻשָּׁקִים כֶּסֶף
  choice: скреплены серебряными планками
  rationale: Причастие обозначает снабжение столбов серебряными связующими элементами или обвязкой. «Скреплены серебряными планками» понятно современному читателю и сохраняет вероятный конструктивный смысл; неоднозначность отмечена в сноске.
- source_word: וָוֵיהֶם כָּסֶף
  choice: их крюки должны быть серебряными
  rationale: וָוִים в описаниях святилища обычно обозначает крюки, служившие для крепления завес; именная древнееврейская конструкция естественно передана сказуемым.
- source_word: אַדְנֵיהֶם
  choice: основания
  rationale: Речь о металлических опорах, в которые устанавливались столбы. «Основания» — ясный общий термин; более техническое «гнёзда» приведено в сноске.
- source_word: נְחֹשֶׁת
  choice: бронзовыми
  rationale: В описании материалов святилища традиционное и контекстуально уместное соответствие — «бронза», хотя древнееврейское слово могло обозначать также медь или медный сплав.
