  yaml_path: translation/ot/exodus/027/018.yaml
  text: The length of the court shall be a hundred cubits[a], and the width fifty cubits, and the height five cubits, of finely twisted linen[b], with their bases of bronze.
translation:
  language: ru
  text: Длина двора — сто локтей, ширина — пятьдесят локтей[a], а высота завес — пять локтей; завесы — из тонкого кручёного льна, а основания столбов[b] — из бронзы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «пятьдесят на пятьдесят». Смысл необычного повторения не вполне ясен; по контексту речь идёт о ширине в пятьдесят локтей.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «гнёзда». Имеются в виду опоры, в которые устанавливались столбы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ הֶחָצֵר
  choice: длина двора
  rationale: Естественное архитектурное обозначение размера ограды святилища.
- source_word: מֵאָה בָאַמָּה
  choice: сто локтей
  rationale: Сохранена древняя единица измерения ради точности и согласованности с описанием скинии.
- source_word: וְרֹחַב חֲמִשִּׁים בַּחֲמִשִּׁים
  choice: ширина — пятьдесят локтей[a]
  rationale: Передаёт очевидный размер двора естественным русским языком; необычное буквальное повторение «пятьдесят на пятьдесят» отмечено в сноске, чтобы не скрывать форму еврейского текста.
- source_word: וְקֹמָה חָמֵשׁ אַמּוֹת
  choice: а высота — пять локтей
  rationale: Прямая передача вертикального размера завес двора.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: из кручёного тонкого льна
  rationale: שֵׁשׁ обозначает тонкий лён, а מָשְׁזָר — материал из скрученных нитей; выражение сохраняет и материал, и способ изготовления.
- source_word: וְאַדְנֵיהֶם
  choice: а их основания[b]
  rationale: אַדֶן обозначает металлическую опору или гнездо, в которое устанавливался столб; «основания» понятно современному читателю и не чрезмерно технически.
- source_word: נְחֹשֶׁת
  choice: из бронзы
  rationale: Традиционное и контекстуально уместное обозначение металла в описаниях устройства скинии; лексически возможно также понимание как меди.
