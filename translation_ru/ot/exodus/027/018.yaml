    issue: Неясный и фактически неверный референт в выражении «их основания».
    rationale: После явно введённых «завес» местоимение естественно относится к ним, тогда как еврейское суффиксальное «их» в контексте относится к столбам двора и их основаниям/гнёздам.
  - severity: low
    issue: «Завесы должны быть» добавляет модальность будущего предписания.
    rationale: Еврейская фраза представляет спецификацию материала без отдельного глагола долженствования; в русском её можно передать без добавления модальности.
