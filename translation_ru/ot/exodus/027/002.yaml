    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Сделай
  rationale: Форма с союзом в последовательности предписаний передаёт повеление. Русский совершенный императив естественно выражает конкретное указание по изготовлению.
- source_word: קַרְנֹתָיו
  choice: его роги
  rationale: Существительное קֶרֶן буквально означает «рог» и здесь обозначает рогообразные выступы жертвенника. Конкретный культовый образ сохранён.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: на четырёх его углах
  rationale: Предлог עַל передан обычным значением «на»; формулировка близка к еврейскому тексту и естественна по-русски.
- source_word: מִמֶּנּוּ תִּהְיֶיןָ קַרְנֹתָיו
  choice: роги должны составлять с ним одно целое
  rationale: 'Буквально: «из него будут его роги». В строительном предписании это означает, что роги являются неотделимой частью жертвенника, а не прикреплены отдельно; русский оборот ясно передаёт этот смысл, а буквальная форма отмечена в сноске.'
- source_word: וְצִפִּיתָ אֹתוֹ
  choice: Обложи его
  rationale: Порода пиэль глагола צפה здесь означает покрыть или облицевать предмет данным материалом. «Обложи» — естественный русский термин в описании устройства священных предметов.
- source_word: נְחֹשֶׁת
  choice: бронзой
  rationale: נְחֹשֶׁת может обозначать медь или бронзу. В контексте изготовления жертвенника наиболее вероятно и традиционно понятно «бронза», при этом лексическая неоднозначность сохранена в сноске.
