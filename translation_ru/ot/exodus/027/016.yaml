base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/016.yaml
  text: And for the gate of the courtyard there shall be a screen twenty cubits long[a], of blue, purple, and scarlet yarn, and fine twined linen, the work of an embroiderer[c][b], with their four pillars and their four bases.
translation:
  language: ru
  text: А для входа во двор — завеса длиной в двадцать локтей[a], из голубой, пурпурной и алой пряжи и кручёного тонкого льна, работы вышивальщика, с их четырьмя столбами и их четырьмя основаниями[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Двадцать локтей — приблизительно девять метров.
    reason: measurement_clarification
  - marker: b
    text: 'Или: «гнёзда» — опоры, в которые устанавливались столбы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשַׁעַר הֶחָצֵר
  choice: А для входа во двор
  rationale: שַׁעַר может обозначать ворота или вход. Поскольку проход закрывает текстильная завеса, «вход» естественно передаёт функцию сооружения, не создавая образа твёрдых ворот.
- source_word: מָסָךְ
  choice: завеса
  rationale: В описаниях скинии слово обозначает тканевое покрытие входа; «завеса» ясно и естественно передаёт этот смысл.
- source_word: עֶשְׂרִים אַמָּה
  choice: длиной в двадцать локтей
  rationale: В еврейском тексте буквально сказано «двадцать локтей». Слово «длиной» добавлено для ясности архитектурного описания.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: из голубой, пурпурной и алой пряжи
  rationale: Три выражения обозначают окрашенные текстильные материалы. Общее слово «пряжа» делает перечисление понятным по-русски, не меняя его состава.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: и кручёного тонкого льна
  rationale: שֵׁשׁ обозначает тонкий лён, а מָשְׁזָר — скрученный или сучёный способ изготовления нитей.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: работы вышивальщика
  rationale: Сохранена конструкция с мастером-исполнителем и смысл искусной многоцветной текстильной работы.
- source_word: עַמֻּדֵיהֶם אַרְבָּעָה וְאַדְנֵיהֶם אַרְבָּעָה
  choice: для неё — четыре столба, и для них — четыре основания
  rationale: 'Передана явная принадлежность, выраженная местоименными суффиксами: столбы относятся к завесе при входе, а основания — к столбам. Такая формулировка естественна в современном русском.'
