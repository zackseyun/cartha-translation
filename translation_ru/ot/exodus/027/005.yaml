  text: And you shall put it under the ledge of the altar from below[b][a], and the net shall extend to halfway up the altar.
translation:
  language: ru
  text: И помести её под выступом жертвенника[a], снизу; решётка будет простираться до середины жертвенника[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ободом жертвенника». Значение еврейского слова не вполне определённо; вероятно, имеется в виду выступающая кайма или рама.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и решётка будет до половины жертвенника».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: И помести
  rationale: В данном предписании נתן с прямым дополнением и указанием места естественно передаётся глаголом «помести», сохраняющим повелительную силу формы.
- source_word: אֹתָהּ
  choice: её
  rationale: Местоимение женского рода относится к упомянутой в предыдущем стихе медной решётке; русский язык сохраняет согласование в роде.
- source_word: תַּחַת כַּרְכֹּב הַמִּזְבֵּחַ מִלְּמָטָּה
  choice: снизу, под выступом жертвенника
  rationale: Передаёт оба пространственных элемента исходного текста. «Выступ» обозначает выдающуюся наружу кайму или обрамление и звучит естественно в описании конструкции.
- source_word: הָרֶשֶׁת
  choice: решётка
  rationale: רשת обозначает сетчатую конструкцию; в контексте бронзовой детали жертвенника «решётка» точнее русского «сеть».
- source_word: וְהָיְתָה ... עַד חֲצִי הַמִּזְבֵּחַ
  choice: так чтобы решётка доходила до середины жертвенника
  rationale: Идиоматично выражает итоговое положение решётки. Буквальная конструкция с היה и עד указывает, что она должна находиться или простираться до середины жертвенника.
