base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/003.yaml
  text: You shall make its pots for removing its ashes[a], and its shovels, and its basins, and its forks, and its firepans[b]; you shall make all its utensils of bronze.
translation:
  language: ru
  text: Сделай его котлы, чтобы убирать золу[a], а также лопатки, чаши, вилки и совки для углей. Всю его утварь сделай из бронзы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол этимологически связан со словами «жирный, тучный»; здесь он означает очищать жертвенник от золы, остающейся от приношений.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из меди».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Сделай
  rationale: Форма Qal 2 м. ед. ч. в контексте предписаний передана естественным русским повелительным наклонением; союз в начале стиха не требуется воспроизводить механически.
- source_word: סִּירֹתָיו
  choice: для него котлы
  rationale: Сִירוֹת обозначает ёмкости или котлы; их назначение раскрывает следующая фраза, поэтому слово «зола» не включено в само название предмета.
- source_word: לְדַשְּׁנוֹ
  choice: чтобы убирать золу
  rationale: Piel от דשן здесь обозначает удаление с жертвенника остатков сгоревших приношений. Формулировка ясна современному читателю, а более буквальный оттенок отмечен в сноске.
- source_word: וְיָעָיו
  choice: а также лопатки
  rationale: יָעִים — орудия для работы с золой или углями; «лопатки» естественно передаёт их форму и назначение.
- source_word: וּמִזְרְקֹתָיו
  choice: чаши
  rationale: מִזְרָקוֹת — культовые сосуды, в том числе для крови жертв; «чаши» сохраняет общее обозначение без добавления невыраженной функции.
- source_word: וּמִזְלְגֹתָיו
  choice: вилки
  rationale: Слово обозначает орудия с зубцами. «Вилки» — понятный современный эквивалент без архаичного или излишне толковательного уточнения.
- source_word: וּמַחְתֹּתָיו
  choice: совки для углей
  rationale: מַחְתּוֹת — приспособления для переноса горячих углей или огня; функциональная передача точнее и понятнее, чем неоднозначное «кадильницы».
- source_word: לְכָל־כֵּלָיו
  choice: всю его утварь
  rationale: כְּלִי — широкое обозначение принадлежности или орудия. «Утварь» естественно объединяет перечисленные принадлежности жертвенника и сохраняет приподнятый библейский регистр.
- source_word: נְחֹשֶׁת
  choice: бронзы
  rationale: В описании скинии נְחֹשֶׁת традиционно и правдоподобно понимается как бронза, хотя слово может обозначать также медь; возможность отражена в сноске.
