lexical_decisions:
- source_word: וְרֹחַב
  choice: А ширина
  rationale: רֹחַב обозначает ширину; союз ו передан как «А», что естественно продолжает последовательное описание размеров.
- source_word: הֶחָצֵר
  choice: двора
  rationale: חָצֵר здесь означает ограждённый двор святилища; «двор» — краткий и привычный русский эквивалент.
- source_word: לִפְאַת קֵדְמָה
  choice: с восточной стороны
  rationale: פֵאָה в сочетании с указанием направления означает сторону или край, а קֵדְמָה здесь ясно указывает на восток.
- source_word: מִזְרָחָה
  choice: к восходу солнца
  rationale: Передача сохраняет образ восхода и удвоенное указание восточного направления, не сводя оба еврейских выражения к одному слову.
- source_word: חֲמִשִּׁים אַמָּה
  choice: пятьдесят локтей
  rationale: Сохранена традиционная библейская мера длины без приблизительного пересчёта; форма «локтей» соответствует числительному.
