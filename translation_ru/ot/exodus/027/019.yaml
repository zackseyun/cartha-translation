  text: לְ/כֹל֙ כְּלֵ֣י הַ/מִּשְׁכָּ֔ן בְּ/כֹ֖ל עֲבֹדָת֑/וֹ וְ/כָל יְתֵדֹתָ֛י/ו וְ/כָל יִתְדֹ֥ת הֶ/חָצֵ֖ר נְחֹֽשֶׁת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/019.yaml
  text: All the utensils of the tabernacle for all its service[a], and all its pegs, and all the pegs of the courtyard, shall be bronze.
translation:
  language: ru
  text: Все принадлежности скинии для всякого служения в ней, все её колья и все колья двора должны быть из бронзы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из меди»; еврейское слово נְחֹשֶׁת может обозначать как медь, так и медный сплав.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי
  choice: принадлежности
  rationale: Широкое обозначение предметов и приспособлений; в данном контексте не ограничивается ни утварью, ни крупными элементами обстановки.
- source_word: הַמִּשְׁכָּן
  choice: скинии
  rationale: «Скиния» — устоявшееся и понятное в библейском контексте название священного переносного жилища.
- source_word: בְּכֹל עֲבֹדָתוֹ
  choice: для всякого служения в ней
  rationale: Предлог передаёт назначение предметов, а «в ней» естественно связывает служение со скинией, не сужая его до отдельного обряда.
- source_word: יְתֵדֹתָיו
  choice: её колья
  rationale: Речь идёт о кольях, которыми закрепляли скинию; местоимение сохраняет выраженную в еврейском принадлежность.
- source_word: יִתְדֹת הֶחָצֵר
  choice: колья двора
  rationale: חָצֵר обозначает ограждённый двор вокруг скинии; краткая формулировка соответствует исходному тексту.
- source_word: נְחֹשֶׁת
  choice: бронзы
  rationale: Слово может обозначать медь или медный сплав; «бронза» традиционно и контекстуально уместна в перечне материалов скинии, при этом неоднозначность отмечена в сноске.
