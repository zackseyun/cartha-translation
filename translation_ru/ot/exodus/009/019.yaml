  text: וְ/עַתָּ֗ה שְׁלַ֤ח הָעֵז֙ אֶֽת מִקְנְ/ךָ֔ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר לְ/ךָ֖ בַּ/שָּׂדֶ֑ה כָּל הָ/אָדָ֨ם וְ/הַ/בְּהֵמָ֜ה אֲשֶֽׁר יִמָּצֵ֣א בַ/שָּׂדֶ֗ה וְ/לֹ֤א יֵֽאָסֵף֙ הַ/בַּ֔יְתָ/ה וְ/יָרַ֧ד עֲלֵ/הֶ֛ם הַ/בָּרָ֖ד וָ/מֵֽתוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/019.yaml
  text: So now[a], send word and bring your livestock and everything you have in the field to safety. Every man and beast that is found in the field and is not gathered into the house—the hail will come down on them[b], and they will die.
translation:
  language: ru
  text: Итак, теперь[a] поспеши укрыть свой скот и всё, что у тебя в поле. Каждый человек и каждое животное, оказавшиеся в поле и не собранные в дом, — на них падёт град, и они умрут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А теперь немедленно»; еврейское повеление содержит оттенок настоятельной срочности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак, теперь
  rationale: Передаёт и связующий וְ, и временное עַתָּה, вводя срочное следствие из предшествующего предупреждения.
- source_word: שְׁלַח הָעֵז
  choice: пошли людей
  rationale: Сочетание повелительного שְׁלַח с הָעֵז требует немедленного распоряжения. В данном контексте естественно подразумевается отправка людей, которые должны укрыть имущество; оттенок срочности отмечен в сноске.
- source_word: מִקְנְךָ
  choice: свой скот
  rationale: מִקְנֶה обозначает принадлежащих человеку домашних животных; «скот» — ясный и естественный русский эквивалент.
- source_word: וְאֵת כָּל אֲשֶׁר לְךָ בַּשָּׂדֶה
  choice: и всё, что у тебя в поле
  rationale: Сохраняет широкий охват всех находящихся вне укрытия владений.
- source_word: כָּל הָאָדָם וְהַבְּהֵמָה
  choice: всякий человек и всякое животное
  rationale: אָדָם здесь употреблено обобщённо о людях, а בְּהֵמָה — о животных. Повтор «всякий/всякое» естественно выражает распределительное значение כָּל и согласует русскую грамматику.
- source_word: אֲשֶׁר יִמָּצֵא בַשָּׂדֶה
  choice: которые останутся в поле
  rationale: Буквально «которые будут найдены в поле»; в предупреждении речь о тех, кто к началу града всё ещё окажется снаружи, поэтому «останутся» ясно передаёт контекстуальный смысл.
- source_word: וְלֹא יֵאָסֵף הַבַּיְתָה
  choice: и не будут собраны под кров
  rationale: Нифаль יֵאָסֵף имеет пассивное значение «будут собраны», а направительная форма הַבַּיְתָה указывает на помещение внутрь дома. «Под кров» естественно обозначает защищённое внутреннее пространство.
- source_word: וְיָרַד עֲלֵהֶם הַבָּרָד
  choice: на них обрушится град
  rationale: Передаёт нисходящее движение יָרַד и гибельную силу града; субъект в единственном числе сохранён.
- source_word: וָמֵתוּ
  choice: и они умрут
  rationale: Прямо передаёт неизбежное следствие в контексте предупреждения.
theological_decisions:
- issue: Обобщённое значение אָדָם
  choice: всякий человек
  alternative: всякий мужчина
  rationale: В сочетании с животными и в предупреждении всем находящимся в поле אָדָם означает человека вообще, а не только взрослого мужчину; русский вариант сохраняет универсальный охват без добавления богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис предупреждения сохранён, но буквальное «будет найден» заменено естественным контекстуальным «останутся». Формулировка «под кров» несколько возвышенная, однако понятная и уместная в данном регистре.
