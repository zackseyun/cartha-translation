  source_fidelity: 'Начальное «пошли людей» добавляет в текст объект, которого в еврейском оригинале нет: повеление относится к срочному обеспечению безопасности скота и имущества, а не прямо к отправке людей. «Под кров» также несколько расширяет конкретное «в дом». Исправленный вариант передаёт срочность הָעֵז без такого добавления и сохраняет направление «в дом».'
  naturalness: «Поспеши укрыть» — естественная современная литературная формула для срочного повеления. «Каждый человек и каждое животное, оказавшиеся…» сохраняет общий, распределительный характер предупреждения и читается по-русски ясно.
  terminology: «Скот» соответствует מִקְנֶה; «человек» верно передаёт обобщённое אָדָם, не ограничивая референт взрослыми мужчинами. «Животное» уместно для בְּהֵמָה в данном обобщённом сочетании. «Град падёт на них» близко передаёт וְיָרַד עֲלֵהֶם הַבָּרָד без излишнего усиления.
