  text: כִּ֤י עַתָּה֙ שָׁלַ֣חְתִּי אֶת יָדִ֔/י וָ/אַ֥ךְ אוֹתְ/ךָ֛ וְ/אֶֽת עַמְּ/ךָ֖ בַּ/דָּ֑בֶר וַ/תִּכָּחֵ֖ד מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/015.yaml
  text: For by now I could have stretched out my hand and struck you and your people with pestilence[a], and you would have been cut off from the earth.
translation:
  language: ru
  text: Ибо Я уже мог простереть Свою руку, поразить тебя и твой народ мором[a], и ты был бы истреблён с земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Ибо теперь Я простёр Свою руку, поразил тебя и твой народ мором, и ты был истреблён с земли». Формально еврейские глагольные формы стоят в прошедшем времени, однако контекст убедительно указывает на контрфактический смысл.'
    reason: Альтернативное, формально более буквальное прочтение еврейских глагольных форм.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предыдущим высказыванием естественным для русского языка способом.
- source_word: עַתָּה
  choice: уже
  rationale: В контрфактическом контексте выражает смысл «к этому времени, уже теперь» без тяжеловесного буквального оборота.
- source_word: שָׁלַחְתִּי אֶת־יָדִי
  choice: Я уже мог простереть Свою руку
  rationale: Сохраняет библейскую метафору Божьего действия и передаёт обусловленный контекстом контрфактический смысл формально прошедшей глагольной формы.
- source_word: וָאַךְ
  choice: поразить
  rationale: Естественный и точный русский эквивалент נכה в контексте суда и бедствия.
- source_word: אֹתְךָ וְאֶת־עַמְּךָ
  choice: тебя и твой народ
  rationale: Прямая передача двух объектов действия.
- source_word: בַּדָּבֶר
  choice: моровой язвой
  rationale: Традиционный, но понятный русский термин для смертоносной эпидемии; он точнее общего слова «бедствие» и не смешивает её со всей последовательностью казней.
- source_word: וַתִּכָּחֵד
  choice: и тогда вы были бы истреблены
  rationale: Передаёт контрфактическое следствие и сильное значение нифаля כחד — исчезнуть вследствие уничтожения. Множественное число по смыслу охватывает фараона и его народ.
- source_word: מִן־הָאָרֶץ
  choice: с земли
  rationale: Сохраняет возможный широкий смысл אָרֶץ и естественную русскую формулу полного истребления.
theological_decisions:
- issue: Контрфактический смысл последовательности глаголов
  choice: 'Передать как нереализованную возможность: «мог… и тогда… были бы»'
  alternative: 'Формально передать прошедшим временем: «Я простёр… поразил… и вы были истреблены»'
  rationale: Стихи 15–16 противопоставляют то, что Бог мог уже сделать, тому, почему Он оставил фараона в живых. Простое прошедшее время противоречило бы самой ситуации обращения к живому фараону; при этом формальная особенность еврейского текста отмечена в сноске.
- issue: Число в результате суда
  choice: «вы были бы истреблены»
  alternative: «ты был бы истреблён»
  rationale: Еврейский глагол стоит во втором лице единственного числа и грамматически обращён к фараону, однако в контексте непосредственными объектами названы «ты и твой народ». Русское множественное число ясно передаёт общий итог для обоих; формальная форма отражена в альтернативной сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы. Оборот «моровая язва» сохраняет точность и достоинство, оставаясь понятным в контексте.
