  text: כִּ֛י אִם מָאֵ֥ן אַתָּ֖ה לְ/שַׁלֵּ֑חַ וְ/עוֹדְ/ךָ֖ מַחֲזִ֥יק בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/002.yaml
  text: For if you refuse to let them go and still hold on to them,[a]
translation:
  language: ru
  text: Ведь если ты откажешься отпустить их и по-прежнему будешь удерживать их,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и всё ещё будешь держать их».'
    reason: Сочетание מַחֲזִיק בָּם допускает более буквальную передачу через «держать», тогда как основной текст яснее выражает подразумеваемое удержание людей от ухода.
lexical_decisions:
- source_word: כִּי אִם
  choice: Ведь если
  rationale: 'Сочетание связывает условное предупреждение с предыдущими словами: «ведь» передаёт пояснительную силу כִּי, а «если» — условную силу אִם.'
- source_word: מָאֵן
  choice: откажешься
  rationale: Глагол обозначает сознательный отказ, а не неспособность или простое нежелание.
- source_word: לְשַׁלֵּחַ
  choice: отпустить их
  rationale: В контексте исхода глагол שׁלח означает позволить израильтянам уйти; местоимение «их» естественно восполняет подразумеваемый объект по контексту и по последующему בָּם.
- source_word: וְעוֹדְךָ
  choice: и по-прежнему будешь
  rationale: Передаёт продолжение действия со стороны фараона; будущее время естественно в русском условном предупреждении.
- source_word: מַחֲזִיק בָּם
  choice: удерживать их
  rationale: Причастная конструкция выражает продолжающееся удержание людей и недопущение их ухода; «удерживать» точно и естественно передаёт этот смысл.
