source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֕מָת כֹּ֖ל מִקְנֵ֣ה מִצְרָ֑יִם וּ/מִ/מִּקְנֵ֥ה בְנֵֽי יִשְׂרָאֵ֖ל לֹא מֵ֥ת אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/006.yaml
  text: And Yahweh did this thing the next day[a], and all the livestock of Egypt died; but from the livestock of the sons of Israel, not one died.
translation:
  language: ru
  text: 'На следующий день Яхве сделал это: весь скот египтян пал, а из скота сынов Израиля[a] не пало ни одного.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян». Буквально: «сынов Израиля».'
    reason: Указывает естественный этнонимический смысл выражения בְנֵי יִשְׂרָאֵל, сохраняя в основном тексте его буквальную форму.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: וַיַּעַשׂ ... אֶת־הַדָּבָר הַזֶּה
  choice: сделал это
  rationale: Естественно передаёт еврейское выражение «сделал это дело», не утяжеляя современную русскую фразу.
- source_word: מִמָּחֳרָת
  choice: на следующий день
  rationale: Точно и естественно обозначает день, следующий за днём объявления кары.
- source_word: וַיָּמָת
  choice: пал
  rationale: В отношении скота русский глагол «пал» является обычным и точным соответствием глаголу «умер».
- source_word: כֹּל מִקְנֵה מִצְרַיִם
  choice: весь скот египтян
  rationale: מִקְנֶה охватывает домашний скот, а не только крупный рогатый; כֹּל передано без ослабления как «весь».
- source_word: וּמִמִּקְנֵה בְנֵי יִשְׂרָאֵל
  choice: а из скота сынов Израиля
  rationale: Предлог מִן сохранён словом «из», а противопоставление естественно выражено союзом «а».
- source_word: לֹא מֵת אֶחָד
  choice: не пало ни одного
  rationale: 'Сохраняет краткость и усиленное отрицание: ни одно животное из их скота не погибло.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Этноним בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Основной текст сохраняет буквальный образ еврейского выражения, тогда как сноска указывает его обычное этнонимическое значение.
- issue: Объём выражения «весь скот египтян»
  choice: сохранить «весь»
  alternative: смягчить до «много скота» или «весь скот в поле»
  rationale: Текст прямо содержит כֹּל, поэтому перевод не устраняет возможное напряжение с последующими упоминаниями египетского скота.
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным ритмом. Порядок слов слегка перестроен ради естественности; противопоставление и полнота утверждения исходного текста сохранены. Маркер сноски помещён при выражении, к которому она относится.
