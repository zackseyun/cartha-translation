  text: וַ/יָּ֥שֶׂם יְהוָ֖ה מוֹעֵ֣ד לֵ/אמֹ֑ר מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה הַ/דָּבָ֥ר הַ/זֶּ֖ה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/005.yaml
  text: And Yahweh set a time[a], saying, “Tomorrow Yahweh will do this thing in the land.”
translation:
  language: ru
  text: 'И Яхве назначил срок[a], сказав: «Завтра Яхве сделает это в стране».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «назначенное время»; или: «установленный срок».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: назначил
  rationale: Глагол שׂוּם здесь означает установление или определение срока. «Назначил» естественно сочетается в русском языке со словом «срок» и сохраняет активное действие субъекта.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени Бога, а не заменён титулом «Господь».
- source_word: מוֹעֵד
  choice: срок
  rationale: В данном контексте מוֹעֵד обозначает установленное время совершения события. Русское «срок» кратко и естественно передаёт эту мысль; близкие варианты приведены в сноске.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Обычная русская передача еврейского инфинитива, вводящего прямую речь в повествовании.
- source_word: מָחָר
  choice: Завтра
  rationale: Прямо и без добавочного толкования передаёт указание на следующий день.
- source_word: יַעֲשֶׂה
  choice: сделает
  rationale: Сохраняет простоту и широту значения глагола עשה, не уточняя сверх текста характер предстоящего действия.
- source_word: הַדָּבָר הַזֶּה
  choice: это
  rationale: В контексте выражение указывает на уже объявленное действие. Русское местоименное «это» звучит естественнее буквального «эту вещь» и не сужает значение до отдельного события или дела.
- source_word: בָּאָרֶץ
  choice: в этой земле
  rationale: Сохраняет указание на землю, то есть в контексте на Египет, не добавляя отсутствующего в стихе названия страны. Указательное «этой» естественно по-русски обозначает контекстуально известную землю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте дважды стоит личное имя יְהוָה. Транслитерация «Яхве» сохраняет имя и не заменяет его титулом.
- issue: Степень конкретизации выражения הַדָּבָר הַזֶּה
  choice: это
  alternative: это дело; это событие
  rationale: Контекст связывает выражение с предстоящим судом над египетским скотом, однако само דָּבָר остаётся широким по значению. Перевод «это» сохраняет такую широту и отсылку к предшествующим словам.
translation_notes:
  register: Современный литературный русский язык с лаконичным библейским повествовательным ритмом. Формула «назначил срок» понятна обычному читателю; конструкция «сказав» сохраняет связь с еврейской повествовательной формой. Маркер [a] помещён непосредственно после слова, к которому относится сноска.
