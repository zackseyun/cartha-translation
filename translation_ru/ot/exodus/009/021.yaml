base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/021.yaml
  text: But whoever did not pay attention to the word of Yahweh left his servants and his livestock in the field[a].
translation:
  language: ru
  text: Но тот, кто не отнёсся серьёзно к слову Яхве[a], оставил своих слуг и свой скот в поле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не направил своего сердца к слову Яхве»; то есть не принял его всерьёз.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: А тот, кто
  rationale: Союз וְ в данном контексте противопоставляет эту группу людям из предыдущего стиха, а אֲשֶׁר вводит неопределённое относительное обозначение лица.
- source_word: לֹא שָׂם לִבּוֹ אֶל
  choice: не принял … близко к сердцу
  rationale: Еврейская идиома буквально означает «не направил/не расположил своё сердце к» и здесь передаёт отказ всерьёз отнестись к предупреждению. Русское выражение естественно и сохраняет образ сердца.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: דָּבָר здесь обозначает высказанное Яхве предупреждение; «слово» сохраняет устойчивое библейское выражение и не сужает значение до простого сообщения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: וַיַּעֲזֹב
  choice: оставил
  rationale: 'Глагол описывает конкретное действие: человек оставил людей и животных в поле, под угрозой града.'
- source_word: עֲבָדָיו
  choice: своих слуг
  rationale: עֶבֶד допускает значения «слуга» и «раб»; в этом контексте внимание сосредоточено на людях из хозяйства, оставленных в поле, а не на их юридическом положении.
- source_word: מִקְנֵהוּ
  choice: свой скот
  rationale: Собирательное существительное обозначает принадлежащих человеку домашних стадных животных; «скот» — точный и естественный русский эквивалент.
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: Прямое обозначение места; опасность пребывания под открытым небом ясна из контекста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Смысл реакции на слово Яхве
  choice: не принял … близко к сердцу
  alternative: не обратил внимания на; не направил сердца к
  rationale: Формулировка сохраняет сердечную образность исходной идиомы и показывает не просто рассеянность, а сознательное пренебрежение предупреждением, не добавляя мотивов, которых текст не называет.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис прост и понятен; сохранены контраст с предыдущим стихом и образ сердца из еврейской идиомы.
