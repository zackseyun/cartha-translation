lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: Частица выражает ограничение и в начальной позиции подчёркивает единственное исключение.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: в земле Гошен
  rationale: Сохраняется обозначение именованной области; «земля Гошен» естественно для библейского повествования на русском языке.
- source_word: אֲשֶׁר שָׁם
  choice: где жили
  rationale: Местное относительное выражение передано естественным русским оборотом; глагол «жили» контекстуально выражает пребывание людей в этой области.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняется буквальный родственный образ еврейского выражения, при этом традиционная русская форма остаётся понятной и возвышенной.
- source_word: לֹא הָיָה בָּרָד
  choice: не было града
  rationale: Отрицательная конструкция с היה имеет здесь значение отсутствия; родительный падеж после «не было» естественен в русском языке.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Выбор сохраняет явно выраженный в еврейском тексте мужской родственный образ, не сводя его к нейтральному этнониму; сноска сообщает идиоматические варианты.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Порядок слов сохраняет начальное ограничительное «только», а фраза остаётся ясной для широкого читателя.
