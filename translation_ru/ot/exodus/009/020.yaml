base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/020.yaml
  text: Whoever among Pharaoh’s servants feared the word of Yahweh hurried his servants and his livestock into the houses[a][b].
translation:
  language: ru
  text: Всякий из слуг фараона, кто боялся слова Яхве[a], быстро увёл своих слуг и свой скот в дома[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тот из слуг фараона, кто боялся слова Яхве».'
    reason: Еврейское причастие с артиклем употреблено как существительное и может быть передано как «всякий, кто» или «тот, кто».
  - marker: b
    text: 'Буквально: «заставил бежать»; то есть быстро отвёл их в укрытие.'
    reason: Каузативная форма глагола הֵנִיס буквально обозначает побуждение к бегству; основной текст естественно передаёт срочное перемещение в данном контексте.
lexical_decisions:
- source_word: הַיָּרֵא
  choice: тот… кто устрашился
  rationale: Артикль с причастием образует субстантивированное выражение «тот, кто боялся». Такая формулировка естественна по-русски и сохраняет выделение человека из числа слуг фараона.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: דָּבָר означает «слово» или «весть». «Слово» сохраняет устойчивый библейский оборот и не сужает значение до одного лишь предупреждения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, а не заменено титулом.
- source_word: מֵעַבְדֵי פַרְעֹה
  choice: из слуг фараона
  rationale: 'Предлог מִן имеет здесь партитивное значение: речь идёт о человеке из числа слуг фараона.'
- source_word: הֵנִיס
  choice: поспешно увёл
  rationale: Каузативная форма от נוּס буквально означает «заставил бежать». В данном контексте речь идёт о срочном перемещении людей и скота под кров; «поспешно увёл» естественно передаёт действие и не создаёт неуместного оттенка панического бегства.
- source_word: עֲבָדָיו
  choice: своих слуг
  rationale: עֶבֶד может обозначать слугу или раба. Здесь основное внимание направлено на зависимых людей в хозяйстве египетского сановника, поэтому нейтральное «слуги» уместно.
- source_word: מִקְנֵהוּ
  choice: свой скот
  rationale: מִקְנֶה — общее обозначение домашнего скота; русское «скот» не ограничивает значение только крупным рогатым скотом.
- source_word: אֶל הַבָּתִּים
  choice: в дома
  rationale: 'Сохранены значение направленного движения и множественное число существительного: людей и животных отвели внутрь строений, служивших укрытием.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Характер страха перед словом Яхве
  choice: устрашился слова Яхве
  alternative: почтил слово Яхве
  rationale: Текст употребляет ירא, прямо обозначающее страх. Перевод не заменяет его толкованием как одного лишь почтения или послушания, хотя последующее действие показывает, что страх привёл к практическому отклику.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Устрашился» сохраняет смысл страха и достоинство регистра; синтаксис остаётся ясным для широкого круга читателей.
