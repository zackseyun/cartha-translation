  text: וַ/יַּ֨ךְ הַ/בָּרָ֜ד בְּ/כָל אֶ֣רֶץ מִצְרַ֗יִם אֵ֚ת כָּל אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וְ/אֵ֨ת כָּל עֵ֤שֶׂב הַ/שָּׂדֶה֙ הִכָּ֣ה הַ/בָּרָ֔ד וְ/אֶת כָּל עֵ֥ץ הַ/שָּׂדֶ֖ה שִׁבֵּֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/025.yaml
  text: And the hail struck throughout all the land of Egypt everything that was in the field[a], from man to beast. The hail struck every plant of the field, and shattered every tree of the field.
translation:
  language: ru
  text: И град поразил по всей земле Египта всё, что было в поле, от человека до скота[a]. Град поразил всю растительность в поле и разбил все деревья в поле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от человека до животных».'
    reason: Еврейское בְּהֵמָה может обозначать как домашний скот, так и животных в более широком смысле.
lexical_decisions:
- source_word: וַיַּךְ / הִכָּה
  choice: поразил
  rationale: Глагол נכה обозначает сильный удар или поражение. «Поразил» естественно передаёт разрушительное действие града и сохраняет повтор одного и того же еврейского глагола.
- source_word: הַבָּרָד
  choice: град
  rationale: Прямое современное соответствие названию погодного явления; повтор сохранён ради смыслового акцента исходного текста.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: по всей земле Египетской
  rationale: Передаёт распространение бедствия по всей территории и сохраняет традиционное, но понятное современному читателю географическое наименование.
- source_word: אֵת כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: всё, что было в поле
  rationale: Сохраняет всеохватность כָּל אֲשֶׁר и конкретное указание на открытое поле.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: от человека до скота
  rationale: Сохраняет меризм, охватывающий людей и животных, а также форму единственного числа в собирательно-представительном значении.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: всю полевую растительность
  rationale: עֵשֶׂב здесь имеет широкое значение трав, посевов и другой растительности; русское «растительность» не сужает его до травы или отдельных растений.
- source_word: עֵץ הַשָּׂדֶה
  choice: все полевые деревья
  rationale: Передаёт распределительное значение единственного числа при כָּל и сохраняет связь деревьев с полем.
- source_word: שִׁבֵּר
  choice: поломал
  rationale: Интенсивная порода глагола שבר указывает на сильное, многократное повреждение; «поломал» естественно описывает разрушительное воздействие града на деревья.
theological_decisions:
- issue: Передача אָדָם в выражении, обозначающем весь диапазон пострадавших живых существ
  choice: человека
  alternative: людей
  rationale: «Человек» в русском языке имеет родовое значение и близко следует форме исходного текста, не ограничивая смысл мужчинами.
- issue: Объём значения בְּהֵמָה
  choice: скота
  alternative: животных
  rationale: В сельскохозяйственном контексте «скот» наиболее вероятен, однако еврейское слово может шире обозначать животных; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной библейской интонацией. Повтор слова «град» и глагола «поразил» сохранён как значимый элемент структуры исходного текста.
