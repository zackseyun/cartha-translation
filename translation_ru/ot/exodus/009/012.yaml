lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: ожесточил
  rationale: Глагол חזק буквально означает «укреплять, делать твёрдым», но в повторяющемся повествовательном обороте о сердце фараона выражает его упорное сопротивление. «Ожесточил» естественно передаёт этот смысл по-русски, сохраняя прямое действие Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом, что сохраняет форму и функцию имени в еврейском тексте.
- source_word: לֵב פַּרְעֹה
  choice: сердце фараона
  rationale: Сохранён образ сердца как средоточия воли и внутреннего расположения; поясняющая перифраза в основной текст не внесена.
- source_word: שָׁמַע אֲלֵהֶם
  choice: не послушал их
  rationale: שׁמע с אֶל означает слушать или внимать кому-либо. «Не послушал» звучит естественно и не сужает значение до формального неповиновения.
- source_word: אֲלֵהֶם
  choice: их
  rationale: Сохранено местоимение оригинала без подстановки подразумеваемых Моисея и Аарона.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: как и говорил Яхве Моисею
  rationale: Оборот передаёт соответствие случившегося прежним словам Яхве. Русское «как и говорил» естественно обозначает исполнение ранее сказанного.
theological_decisions:
- issue: Действие Бога в ожесточении сердца фараона
  choice: Яхве ожесточил сердце фараона
  alternative: Яхве сделал сердце фараона твёрдым / укрепил сердце фараона
  rationale: В еврейском тексте Яхве прямо назван субъектом, а сердце фараона — объектом действия. Перевод не смягчает эту причинность разрешительным оборотом и не снимает богословское напряжение; более буквальные значения глагола отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Союз «Но» сохраняет противопоставление, а «тот» устраняет возможную двусмысленность русского местоимения, не называя референта сверх оригинала.
