source:
  edition: WLC
  text: כִּ֣י בַּ/פַּ֣עַם הַ/זֹּ֗את אֲנִ֨י שֹׁלֵ֜חַ אֶת כָּל מַגֵּפֹתַ/י֙ אֶֽל לִבְּ/ךָ֔ וּ/בַ/עֲבָדֶ֖י/ךָ וּ/בְ/עַמֶּ֑/ךָ בַּ/עֲב֣וּר תֵּדַ֔ע כִּ֛י אֵ֥ין כָּמֹ֖/נִי בְּ/כָל הָ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/014.yaml
  text: For this time I am sending all my plagues against your heart[a], and against your servants and your people[b], so that you may know that there is none like me in all the earth.
translation:
  language: ru
  text: Ибо на этот раз Я посылаю все Мои кары на твоё сердце[a], на твоих слуг и на твой народ, чтобы ты узнал, что на всей земле[b] нет никого, подобного Мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к сердцу твоему». Это выражение может означать, что кары направлены против самого фараона, затрагивая его внутреннее существо.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во всей стране», если אֶרֶץ понимать здесь в более узком, местном смысле. Перевод «на всей земле» подчёркивает всеобщий характер несравнимости Господа.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение предыдущих слов Господа; «ибо» ясно передаёт причинно-пояснительную связь и соответствует достоинству речи.
- source_word: בַּפַּעַם הַזֹּאת
  choice: на этот раз
  rationale: Естественное современное русское выражение для нынешнего случая или очередного действия.
- source_word: אֲנִי שֹׁלֵחַ
  choice: Я посылаю
  rationale: Причастная форма передаёт близкое, уже решённое действие; настоящее время сохраняет непосредственность еврейского выражения.
- source_word: כָּל מַגֵּפֹתַי
  choice: все Мои кары
  rationale: מַגֵּפָה обозначает поражающий удар или бедствие. «Кары» сохраняет смысл бедствий как Божьего суда и в данном контексте звучит естественнее, чем архаичное «язвы».
- source_word: אֶל לִבְּךָ
  choice: в самое сердце твоё
  rationale: Сохранён явный образ сердца как внутреннего средоточия личности фараона. Слово «самое» естественно передаёт направленность удара в его глубинную сущность, не заменяя метафору толкованием.
- source_word: וּבַעֲבָדֶיךָ
  choice: на твоих слуг
  rationale: «Слуги» здесь — служащие и приближённые фараона, а не обязательно рабы; предлог передаёт направленность кары.
- source_word: וּבְעַמֶּךָ
  choice: и на твой народ
  rationale: Имеется в виду египетский народ под властью фараона; повтор предлога делает русскую координацию ясной.
- source_word: בַּעֲבוּר תֵּדַע
  choice: чтобы ты узнал
  rationale: בַּעֲבוּר выражает цель, а форма תֵּדַע после него — предполагаемый результат. «Чтобы ты узнал» естественно передаёт оба значения.
- source_word: אֵין כָּמֹנִי
  choice: нет никого, подобного Мне
  rationale: Передаёт формулу абсолютной несравнимости естественным современным русским языком.
- source_word: בְּכָל הָאָרֶץ
  choice: на всей земле
  rationale: Хотя אֶרֶץ может означать отдельную страну или землю, контекст подчёркивает всеобщую несравнимость Господа; «на всей земле» сохраняет этот масштаб.
theological_decisions:
- issue: Масштаб несравнимости Господа
  choice: 'Всеобщий: «на всей земле»'
  alternative: 'Местный: «во всей стране» или «во всей этой земле»'
  rationale: Высказывание представляет Господа несравнимым не только в Египте, но и во всём мире. При этом сноска сохраняет лексически возможное более узкое понимание אֶרֶץ.
- issue: Смысл направленности кар к сердцу фараона
  choice: 'Сохранить метафору: «в самое сердце твоё»'
  alternative: Истолковать как «на тебя самого»
  rationale: В еврейском тексте прямо названо сердце. Сохранение образа поддерживает связь с темой сердца фараона и не устраняет напряжение между внутренним и личным измерениями суда.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции. Образ «сердца» сохранён, а допустимая неоднозначность слова אֶרֶץ вынесена в сноску.
