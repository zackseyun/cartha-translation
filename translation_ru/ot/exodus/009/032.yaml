  text: וְ/הַ/חִטָּ֥ה וְ/הַ/כֻּסֶּ֖מֶת לֹ֣א נֻכּ֑וּ כִּ֥י אֲפִילֹ֖ת הֵֽנָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/032.yaml
  text: But the wheat and the spelt were not struck down[b][a], because they were late-ripening.
translation:
  language: ru
  text: А пшеница и полба[a] не были побиты, потому что созревают поздно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское название может обозначать полбу, эммер или близкий к ним вид зерновой культуры.
    reason: cultural_note
  - marker: b
    text: 'Или: «потому что они были поздними», то есть ещё не созрели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחִטָּה
  choice: А пшеница
  rationale: חִטָּה означает пшеницу; союз ו передан как «А», чтобы естественно выразить противопоставление повреждённым культурам предыдущего стиха.
- source_word: וְהַכֻּסֶּמֶת
  choice: и полба
  rationale: כֻּסֶּמֶת обозначает древний вид зерновой культуры, вероятно полбу или близкий к ней вид; «полба» — понятный и ботанически уместный русский эквивалент.
- source_word: לֹא נֻכּוּ
  choice: не были побиты
  rationale: Пассивная форма נכה в контексте града передаёт физическое поражение посевов; «побиты» естественно сочетается с градом и сохраняет силу исходного выражения.
- source_word: כִּי
  choice: потому что
  rationale: כִּי вводит причину, по которой эти культуры не пострадали.
- source_word: אֲפִילֹת הֵנָּה
  choice: созревают поздно
  rationale: 'Выражение, вероятно, указывает на позднюю стадию развития этих культур: во время града они ещё не достигли уязвимой зрелости. Перевод передаёт сельскохозяйственный смысл естественным современным языком.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная формулировка с сохранением контраста с предыдущим стихом. Термин «полба» сопровождается примечанием ввиду неопределённости точного вида зерновой культуры.
