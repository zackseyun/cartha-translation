base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/008.yaml
  text: Then Yahweh said to Moses and to Aaron[a], “Take for yourselves handfuls of soot from a furnace[c][b], and let Moses throw it toward the sky before Pharaoh’s eyes.”
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею и Аарону: «Наберите себе полные горсти[a] сажи[b] из печи, и пусть Моисей бросит её к небу[c] на глазах у фараона».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «полноту ваших горстей»; то есть столько, сколько помещается в наполненных ладонях.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «мелкий печной пепел»; однако еврейское слово прежде всего указывает на сажу или тонкий порошкообразный продукт горения.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вверх», «по направлению к небесам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Глагол אמר — обычный глагол речи; «сказал» естественен по-русски, а «тогда» передаёт повествовательную последовательность формы с וַ־.
- source_word: קְחוּ לָכֶם
  choice: Возьмите себе
  rationale: Множественное повелительное наклонение обращено к Моисею и Аарону; «себе» сохраняет оттенок לָכֶם.
- source_word: מְלֹא חָפְנֵיכֶם
  choice: полные пригоршни
  rationale: Сохраняет образ того количества, которое умещается в сложенных ладонях, и множественное обращение к двум людям.
- source_word: פִּיחַ
  choice: сажа
  rationale: Слово обозначает мелкий порошкообразный продукт горения, прежде всего сажу; это точнее общего слова «пепел».
- source_word: כִּבְשָׁן
  choice: печь
  rationale: Нейтрально передаёт печь или горн, не уточняя без достаточных оснований её промышленное назначение.
- source_word: וּזְרָקוֹ מֹשֶׁה
  choice: и пусть Моисей бросит её
  rationale: После повеления во множественном числе еврейский текст отдельно называет Моисея исполнителем действия; конструкция «пусть Моисей» ясно сохраняет этот переход.
- source_word: הַשָּׁמַיְמָה
  choice: к небу
  rationale: Направительный суффикс выражает движение вверх, по направлению к небу.
- source_word: לְעֵינֵי פַרְעֹה
  choice: на глазах у фараона
  rationale: Естественный современный русский эквивалент буквального образа «перед глазами фараона», подчёркивающий, что действие совершается у него на виду.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе употреблено собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом; «Иегова» основано на более позднем смешанном прочтении.
- issue: Значение הַשָּׁמַיְמָה в данном физическом действии
  choice: к небу
  alternative: к небесам; вверх
  rationale: Форма допускает традиционное «к небесам», однако в контексте броска обозначает видимое направление вверх. «К небу» сохраняет как пространственный смысл, так и образ исходного текста, не добавляя специального богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; зримый оборот «на глазах у фараона» сохраняет выразительность еврейской идиомы.
