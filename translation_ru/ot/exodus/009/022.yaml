source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁה נְטֵ֤ה אֶת יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ/יהִ֥י בָרָ֖ד בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם עַל הָ/אָדָ֣ם וְ/עַל הַ/בְּהֵמָ֗ה וְ/עַ֛ל כָּל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/022.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky[b], so that hail may come over all the land of Egypt—on man and on beast and on every plant of the field in the land of Egypt.”
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Простри руку к небу[a], и пусть по всей земле Египетской пойдёт град — на людей[b], на скот и на все полевые растения в земле Египетской».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к небесам». Еврейское слово может означать «небо» или «небеса»; здесь речь идёт о видимом небе, откуда приходит град.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на человека». Здесь еврейское слово имеет собирательное значение и обозначает людей вообще, в противопоставлении скоту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога принятой русской транслитерацией, а не заменяет его титулом «Господь».
- source_word: נְטֵה אֶת יָדְךָ
  choice: Простри руку
  rationale: Точно передаёт повелительное значение נטה и сохраняет естественный для возвышенного русского повествования оборот.
- source_word: עַל הַשָּׁמַיִם
  choice: к небу
  rationale: Предлог עַל здесь выражает направление жеста; «к небу» естественно по-русски и подходит к метеорологическому контексту.
- source_word: וִיהִי בָרָד
  choice: и пусть … пойдёт град
  rationale: Конструкция сохраняет волитивный оттенок формы וִיהִי, а выражение «пойдёт град» идиоматично в современном русском языке.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: по всей земле Египетской
  rationale: Передаёт всеохватность בְּכָל и распространение града по всей территории.
- source_word: הָאָדָם
  choice: людей
  rationale: Существительное с артиклем употреблено собирательно и обозначает людей вообще в противопоставлении животным; множественное число естественно передаёт это значение по-русски.
- source_word: הַבְּהֵמָה
  choice: скот
  rationale: В контексте египетских казней слово обозначает прежде всего домашних животных; «скот» сохраняет краткое противопоставление людям.
- source_word: כָּל עֵשֶׂב הַשָּׂדֶה
  choice: все полевые растения
  rationale: עֵשֶׂב охватывает травянистую растительность и сельскохозяйственные растения; выбранная формулировка ясна современному читателю.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в земле Египетской
  rationale: Заключительное повторение сохранено, поскольку в еврейском тексте оно вновь подчёркивает место и пределы бедствия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» сохраняет личное имя заветного Бога и не подменяет его титулом; вариант «Иегова» основан на более поздней смешанной форме.
- issue: Собирательное значение הָאָדָם
  choice: людей
  alternative: человека; человечество
  rationale: В данном перечислении слово относится ко всем людям, которых может поразить град. «Людей» естественно выражает собирательный смысл, не добавляя гендерного ограничения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и заключительное повторение «в земле Египетской» сохранены; архаизирующее «да будет» заменено более понятным волитивным оборотом «пусть … пойдёт».
