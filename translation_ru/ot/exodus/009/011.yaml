base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/011.yaml
  text: And the magicians were not able to stand before Moses because of the boils[a], for the boils were on the magicians and on all the Egyptians.
translation:
  language: ru
  text: И волхвы не могли предстать перед Моисеем из-за нарывов, потому что нарывы были и на волхвах, и по всему Египту[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у волхвов и во всём Египте»; по контексту речь идёт о поражении людей по всей стране.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: волхвы
  rationale: В повествовании Исхода это придворные ритуальные специалисты фараона, противостоящие Моисею и Аарону или подражающие им. «Волхвы» — устоявшийся и достаточно понятный русский эквивалент; «маги» звучало бы менее возвышенно, а «чародеи» сильнее подчёркивало бы колдовство.
- source_word: לַעֲמֹד לִפְנֵי מֹשֶׁה
  choice: предстать перед Моисеем
  rationale: Оборот буквально связан со стоянием перед кем-либо, но в данном контексте означает возможность явиться и находиться в присутствии Моисея. «Предстать перед» естественно передаёт этот смысл по-русски.
- source_word: מִפְּנֵי הַשְּׁחִין
  choice: из-за нарывов
  rationale: מִפְּנֵי выражает причину, а שְׁחִין обозначает воспалённые кожные поражения, нарывы. Множественное число естественно передаёт собирательное значение еврейского существительного.
- source_word: הַשְּׁחִין
  choice: нарывы
  rationale: Повтор сохранён ради смысловой связи и риторической структуры стиха; множественное число соответствует множественным телесным поражениям.
- source_word: בַּחֲרְטֻמִּם
  choice: на волхвах
  rationale: 'Предлог ב здесь указывает на телесное поражение: нарывы находились на волхвах.'
- source_word: וּבְכָל מִצְרָיִם
  choice: по всему Египту
  rationale: Сохранена пространственная формулировка еврейского текста — буквально «во всём Египте». Контекст подразумевает распространение язвы среди жителей страны, но основной текст не делает этот подразумеваемый объект явным.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Выбрано традиционное «волхвы», а более естественное «предстать» передаёт идиому без ненужной буквальности. Формулировка «по всему Египту» сохраняет пространственную широту оригинала и его подразумеваемый личный смысл поясняет в сноске.
