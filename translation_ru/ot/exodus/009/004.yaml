id: EXO.9.4
reference: Exodus 9:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הִפְלָ֣ה יְהוָ֔ה בֵּ֚ין מִקְנֵ֣ה יִשְׂרָאֵ֔ל וּ/בֵ֖ין מִקְנֵ֣ה מִצְרָ֑יִם וְ/לֹ֥א יָמ֛וּת מִ/כָּל לִ/בְנֵ֥י יִשְׂרָאֵ֖ל דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/004.yaml
  text: But Yahweh will make a distinction between the livestock of Israel and the livestock of Egypt[a], so that nothing belonging to the sons of Israel will die.
translation:
  language: ru
  text: Но Яхве проведёт различие между скотом Израиля и скотом Египта, и из всего, что принадлежит сынам Израиля[a], не погибнет ничего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам»; буквально: «сынам Израиля».'
    reason: лексическая альтернатива и пояснение буквальной формы
lexical_decisions:
- source_word: וְהִפְלָה
  choice: проведёт различие
  rationale: Порода hифиль глагола פלא здесь выражает действие, посредством которого Яхве явно отделит одну группу от другой; выражение сохраняет каузативный оттенок и естественно звучит по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: בֵּין ... וּבֵין
  choice: между ... и ...
  rationale: Обычная парная конструкция, обозначающая разграничение двух объектов.
- source_word: מִקְנֵה
  choice: скот
  rationale: В данном контексте обозначает совокупность домашних сельскохозяйственных животных, а не только крупный рогатый скот.
- source_word: מִצְרָיִם
  choice: Египет
  rationale: В сочетании «скот Египта» название страны представляет принадлежащий египтянам скот; русский оборот естественен и сохраняет форму оригинала.
- source_word: וְלֹא יָמוּת
  choice: не погибнет
  rationale: Союз сохранён как «и», без добавления целевого или следственного отношения, которого еврейский текст прямо не маркирует; будущее событие передано совершенным видом.
- source_word: מִכָּל ... דָּבָר
  choice: из всего ... ничего
  rationale: Отрицательная конструкция с מִכָּל и единственным דָּבָר подчёркивает, что не погибнет ни одна принадлежащая израильтянам единица скота; русский оборот передаёт смысл без неестественного буквального «ни одна вещь».
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: принадлежит сынам Израиля
  rationale: Предлог ל выражает принадлежность, а традиционное родовое обозначение בְּנֵי יִשְׂרָאֵל сохранено буквально и понятно в контексте.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: Оригинал содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Передача выражения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне / дети Израиля
  rationale: Формулировка сохраняет родовое и заветно-национальное выражение оригинала, не сужая его фактическую соотнесённость только до взрослых мужчин.
- issue: Связь заключительной части с разграничением скота
  choice: и ... не погибнет
  alternative: так что / чтобы ... не погибло
  rationale: Еврейский текст соединяет части союзом וְ; нейтральное «и» не решает сверх текста, является ли вторая часть результатом, следствием или дальнейшим содержанием предсказания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис умеренно формальный, но понятный; «скот» употреблено в широком собирательном значении. Маркер сноски поставлен непосредственно после выражения, которое она поясняет.
