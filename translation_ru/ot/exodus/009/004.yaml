  source_fidelity: 'Текст точно передаёт еврейский оригинал: хифиль פלא передан как действие Яхве по проведению различия; парная конструкция «между ... и ...» сохранена; מִקְנֶה обоснованно передано широким «скот». Заключительное «и ... не погибнет ничего» следует координации וְ и не навязывает причинно-следственную связь. Оборот «из всего, что принадлежит сынам Израиля» корректно выражает принадлежность, подразумеваемую לִבְנֵי יִשְׂרָאֵל в данном контексте.'
