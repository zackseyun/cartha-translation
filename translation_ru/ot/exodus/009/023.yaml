base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/023.yaml
  text: So Moses stretched out his staff toward the sky[a], and Yahweh sent thunder and hail, and fire came down to the earth. And Yahweh rained hail on the land of Egypt.
translation:
  language: ru
  text: И простёр Моисей свой посох к небу, и Яхве послал гром и град, и огонь сошёл на землю[a]. И Яхве обрушил град на землю Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «огонь пошёл к земле»; в контексте под огнём, вероятно, подразумевается молния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: простёр
  rationale: Глагол נָטָה обозначает протягивание или простирание; «простёр» естественно и достойно передаёт жест Моисея с посохом.
- source_word: מַטֵּהוּ
  choice: свой посох
  rationale: מַטֶּה означает посох или жезл; «посох» понятно современному читателю и не несёт излишне архаического оттенка.
- source_word: עַל הַשָּׁמַיִם
  choice: к небу
  rationale: В данном жесте предлог עַל имеет направительный смысл; «к небу» кратко и естественно передаёт поднятие посоха вверх.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: נָתַן קֹלֹת וּבָרָד
  choice: послал гром и град
  rationale: Буквально נָתַן — «дал», однако со стихийными явлениями русское «послал» ясно передаёт каузативный смысл; קֹלֹת в контексте бури означает громовые раскаты.
- source_word: וַתִּהֲלַךְ אֵשׁ אָרְצָה
  choice: и огонь устремился к земле
  rationale: Сохранён буквальный образ «огня» и выраженное направительной формой אָרְצָה движение к земле; «устремился» передаёт живую динамику глагола הָלַךְ, не подменяя образ прямым толкованием «молния».
- source_word: וַיַּמְטֵר
  choice: обрушил град
  rationale: Каузативная форма означает «послал дождём, заставил пролиться». Поскольку объектом служит град, «обрушил град» звучит естественно по-русски и сохраняет силу действия.
- source_word: אֶרֶץ מִצְרָיִם
  choice: землю Египта
  rationale: Сохранено явное географическое обозначение «земля Египта», а не сокращённое «Египет».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя, не заменяя его титулом.
- issue: Отождествление אֵשׁ с молнией
  choice: сохранить в основном тексте «огонь»
  alternative: молния
  rationale: В контексте грозы речь, вероятно, идёт о молнии, однако еврейский текст говорит именно об «огне». Образ сохранён, а вероятный природный референт указан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Союзное построение оригинала в основном сохранено; архаизмы сведены к уместному «простёр». Маркер [a] помещён непосредственно после спорного выражения, к которому относится примечание.
