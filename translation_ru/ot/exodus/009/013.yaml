  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/הִתְיַצֵּ֖ב לִ/פְנֵ֣י פַרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/013.yaml
  text: 'Then Yahweh said to Moses[a], “Rise early in the morning and present yourself before Pharaoh, and say to him, ‘Thus says Yahweh, the God of the Hebrews: Let my people go, so that they may serve me.’”'
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Встань рано утром, предстань перед фараоном и скажи ему: „Так говорит Яхве, Бог евреев: отпусти Мой народ, чтобы они служили Мне[a]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы они поклонялись Мне». Древнееврейский глагол может обозначать служение Богу, в том числе поклонение.'
    reason: 'Лексическая альтернатива: עבד имеет более широкий смысл «служить», но в контексте богослужения может передаваться как «поклоняться».'
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом «Господь».
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: Встань рано утром
  rationale: Каузативная форма שׁכם в сочетании с בַּבֹּקֶר идиоматически означает ранний подъём; русский оборот передаёт и действие, и время без неестественной буквальности.
- source_word: וְהִתְיַצֵּב לִפְנֵי
  choice: предстань перед
  rationale: Форма от יצב означает занять место или явиться перед кем-либо; «предстань перед» естественно для официальной встречи с фараоном.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохранена формула посланнического провозглашения с её торжественной и авторитетной силой.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Бог евреев
  rationale: Прямая и естественная передача древнееврейской сопряжённой конструкции.
- source_word: שַׁלַּח אֶת עַמִּי
  choice: отпусти Мой народ
  rationale: В данном контексте императив שלח требует освобождения народа и естественно передаётся глаголом «отпусти».
- source_word: וְיַעַבְדֻנִי
  choice: чтобы он служил Мне
  rationale: Союз с имперфектом выражает цель освобождения. «Служил» сохраняет широкий смысл עבד, включающий как служение Богу, так и поклонение Ему.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. «Яхве» передаёт тетраграмматон как имя, тогда как «Господь» заменяет его титулом.
- issue: Значение וְיַעַבְדֻנִי
  choice: чтобы он служил Мне
  alternative: чтобы он поклонялся Мне
  rationale: Глагол עבד применительно к Богу включает поклонение, но не ограничивается обрядовым значением; «служил» сохраняет более широкий смысл и тематическое противопоставление служения фараону и служения Богу.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формула «Так говорит» и глагол «предстань» сохраняют официальный характер речи, оставаясь понятными современному читателю. Местоимения, относящиеся к Богу, оформлены с прописной буквы в соответствии с распространённой русской библейской традицией.
