base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/033.yaml
  text: So Moses went out from Pharaoh[a], out of the city, and spread out his hands to Yahweh; and the thunder and the hail ceased[b], and rain was no longer poured down on the earth.
translation:
  language: ru
  text: Моисей вышел от фараона и покинул город. Он простёр руки к Яхве, и гром[a] и град прекратились, а дождь больше не лился на землю[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «голоса»; в контексте грозы имеются в виду раскаты грома.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на землю больше не изливался дождь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מֹשֶׁה מֵעִם פַּרְעֹה אֶת הָעִיר
  choice: Моисей ушёл от фараона и вышел из города
  rationale: Конструкция описывает удаление Моисея от фараона и выход из города. Развёрнутая русская формулировка естественно передаёт оба элемента движения и избегает синтаксической неясности.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: Он простёр руки
  rationale: Буквально речь идёт о раскрытых ладонях; выражение обозначает молитвенный жест. «Простёр руки» сохраняет образ и соответствует достоинству повествования.
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Предлог указывает на направленность молитвенного жеста, а личное имя יהוה передано как «Яхве».
- source_word: הַקֹּלוֹת
  choice: гром
  rationale: Основное значение существительного — «голоса, звуки», но в описании грозы оно обозначает раскаты грома.
- source_word: וַיַּחְדְּלוּ
  choice: прекратились
  rationale: Глагол выражает прекращение явлений; выбранное слово естественно сочетается с громом и градом.
- source_word: וּמָטָר לֹא נִתַּךְ אָרְצָה
  choice: а дождь больше не лился на землю
  rationale: Пассивная форма נתך передаёт излияние дождя, а контекст указывает на прекращение уже шедшего ливня. Частица «больше» ясно выражает это контекстуальное значение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблено личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Простёр» сохраняет достоинство и образность исходного текста; остальная синтаксическая структура сделана простой и понятной. Маркеры сносок поставлены непосредственно при словах, к которым относятся.
