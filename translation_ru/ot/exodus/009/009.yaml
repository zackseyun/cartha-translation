  text: וְ/הָיָ֣ה לְ/אָבָ֔ק עַ֖ל כָּל אֶ֣רֶץ מִצְרָ֑יִם וְ/הָיָ֨ה עַל הָ/אָדָ֜ם וְ/עַל הַ/בְּהֵמָ֗ה לִ/שְׁחִ֥ין פֹּרֵ֛חַ אֲבַעְבֻּעֹ֖ת בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/009.yaml
  text: And it will become fine dust over all the land of Egypt[b][a], and it will become boils breaking out with blisters on man and on beast throughout all the land of Egypt.
translation:
  language: ru
  text: И он станет мелкой пылью над всей землёй Египетской, а у людей и у животных по всей земле Египетской появятся нарывы, вздувающиеся волдырями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воспаления, покрывающиеся волдырями».'
    reason: Возможна иная естественная передача сочетания שְׁחִין פֹּרֵחַ אֲבַעְבֻּעֹת, буквально описывающего кожное воспаление, выступающее или вздувающееся пузырями/волдырями.
lexical_decisions:
- source_word: וְהָיָה לְאָבָק
  choice: и станет он мелкой пылью
  rationale: Глагол היה с ל обозначает здесь превращение в новое состояние. Местоимение «он» сохраняет связь с упомянутым в предыдущем стихе печным пеплом (פיח), а «мелкая пыль» передаёт אָבָק в данном контексте.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: по всей земле Египетской
  rationale: Предлог עַל здесь описывает распространение пыли по всей территории Египта; русское «по всей» звучит естественно и сохраняет пространственный смысл.
- source_word: עַל הָאָדָם
  choice: у людей
  rationale: אָדָם употреблено собирательно и противопоставлено скоту. «У людей» ясно передаёт общее обозначение человечества и естественно сочетается с появлением кожных поражений.
- source_word: וְעַל הַבְּהֵמָה
  choice: и у скота
  rationale: בְּהֵמָה — собирательное обозначение домашних крупных животных; в контексте египетских казней «скот» точнее и естественнее общего «животные».
- source_word: לִשְׁחִין
  choice: появятся нарывы
  rationale: שְׁחִין обозначает воспалительное поражение кожи, нарыв или чирей. Русское множественное число естественно при описании множественных высыпаний.
- source_word: פֹּרֵחַ אֲבַעְבֻּעֹת
  choice: высыпающие волдырями
  rationale: Причастие פֹּרֵחַ буквально выражает разрастание или выступание, а אֲבַעְבֻּעֹת — пузырчатые припухлости. Формулировка сохраняет оба элемента и образ кожной сыпи, не сводя их к одному слову.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: по всей земле Египетской
  rationale: Повтор территориальной формулы сохранён, поскольку он подчёркивает всеобщий охват бедствия.
theological_decisions:
- issue: Собирательное значение אָדָם в противопоставлении животным
  choice: людей
  alternative: человека
  rationale: В современном русском «людей» недвусмысленно передаёт родовое, собирательное значение и сохраняет противопоставление человеческого населения скоту, не ограничивая смысл одним мужчиной.
translation_notes:
  register: 'Современный литературный русский с умеренно торжественным библейским звучанием. Сохранены обе формулы «по всей земле Египетской» и последовательность образов: мелкая пыль, нарывы, волдыри. Союз «а» во второй части делает длинное русское предложение яснее, не вводя смыслового противопоставления.'
