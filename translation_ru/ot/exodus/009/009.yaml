  source_fidelity: Перевод верно передаёт превращение печной сажи в мелкую пыль, повтор территориальной формулы и кожное поражение с волдырями. Однако בְּהֵמָה в данном противопоставлении означает животных в целом, а не непременно скот; «скот» неоправданно сужает значение. Предлог עַל в первом случае точнее передать как распространение пыли «над» всей землёй.
  naturalness: 'Фраза «нарывы, высыпающие волдырями» понятна, но в современном русском звучит менее естественно: обычно волдырями покрывается или вздувается кожа/поражение. «Нарывы, вздувающиеся волдырями» сохраняет образ разрастания/выступания и звучит литературно.'
  terminology: «Люди» адекватно передаёт собирательное אָדָם. «Животные» сохраняет широту בְּהֵמָה; «нарывы» и «волдыри» являются осторожной современной передачей שְׁחִין и אֲבַעְבֻּעֹת без излишней медицинской конкретизации.
