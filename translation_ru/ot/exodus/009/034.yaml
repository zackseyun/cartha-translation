  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּֽי חָדַ֨ל הַ/מָּטָ֧ר וְ/הַ/בָּרָ֛ד וְ/הַ/קֹּלֹ֖ת וַ/יֹּ֣סֶף לַ/חֲטֹ֑א וַ/יַּכְבֵּ֥ד לִבּ֖/וֹ ה֥וּא וַ/עֲבָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/034.yaml
  text: But when Pharaoh saw that the rain and the hail and the thunder had ceased[a], he continued to sin and hardened his heart, he and his servants.
translation:
  language: ru
  text: 'Но фараон увидел, что дождь, град и гром прекратились[a], и продолжил грешить: он и его слуги ожесточили свои сердца.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «голоса»; в контексте бури имеются в виду раскаты грома.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Обычное повествовательное значение ראה; по-русски «увидел, что» естественно передаёт осознание наступившей перемены.
- source_word: כִּי
  choice: что
  rationale: 'Союз вводит содержание восприятия фараона: он увидел, что явления прекратились.'
- source_word: חָדַל
  choice: прекратились
  rationale: חדל означает «перестать, прекратиться»; множественное число естественно согласует сказуемое с перечисленными дождём, градом и громом.
- source_word: הַקֹּלֹת
  choice: гром
  rationale: Буквально существительное означает «голоса, звуки», но в контексте бури обозначает раскаты грома; примечание сохраняет исходный образ.
- source_word: וַיֹּסֶף לַחֲטֹא
  choice: продолжил грешить
  rationale: Конструкция יסף с инфинитивом выражает продолжение или повторение действия; здесь «продолжил грешить» естественно передаёт её смысл.
- source_word: וַיַּכְבֵּד לִבּוֹ
  choice: ожесточили свои сердца
  rationale: כבד в этом устойчивом контексте означает сделать сердце нечутким и упорным. Русское «ожесточить сердце» сохраняет тематическую связь повествования; число развёрнуто в соответствии с последующим «он и его слуги».
- source_word: הוּא וַעֲבָדָיו
  choice: он и его слуги
  rationale: עבדים при царском дворе может обозначать слуг, придворных или должностных лиц. «Слуги» сохраняет широту обозначения и не сужает его до чиновников либо рабов.
- source_word: וַ
  choice: Но
  rationale: Начальный waw продолжает рассказ, а «но» уместно выражает контраст с предшествующим признанием фараона.
theological_decisions:
- issue: Кто ожесточил сердце и к кому относится заключительное «он и его слуги»
  choice: 'Фараон продолжил грешить, а ожесточение сформулировано применительно к нему и его слугам: «он и его слуги ожесточили свои сердца».'
  alternative: «Он ожесточил своё сердце — он и его слуги», с формальным сохранением единственного числа еврейского глагола и дополнения.
  rationale: Еврейский текст сначала ставит глагол и «его сердце» в единственном числе, затем добавляет «он и его слуги». В русском буквальное сочетание было бы синтаксически неловким. Развёртывание во множественном числе передаёт наиболее естественную связь заключительной группы, не привнося утверждений о божественном ожесточении и сохраняя человеческую ответственность в данном стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Перечень «дождь, град и гром» передан без избыточного повторения артиклей, не свойственного русскому языку; двоеточие проясняет переход от общего действия фараона к совместному ожесточению фараона и его слуг.
