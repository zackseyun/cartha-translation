base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/024.yaml
  text: There was hail[a], and fire flashing within the hail, very severe—such as had never been in all the land of Egypt since it became a nation.
translation:
  language: ru
  text: И пошёл град, и среди града вспыхивал огонь[a]. Град был чрезвычайно сильным — такого не бывало во всей земле Египетской с тех пор, как Египет стал народом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и огонь метался среди града». В еврейском тексте буквально сказано «огонь»; вероятно, речь идёт о похожих на молнии вспышках внутри бури.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָרָד
  choice: И пошёл град
  rationale: Еврейская повествовательная конструкция сообщает о наступлении явления; русское метеорологическое выражение «пошёл град» естественно передаёт этот смысл.
- source_word: וְאֵשׁ
  choice: и … огонь
  rationale: Сохранён буквальный образ «огня», а не подставлено однозначное «молния», поскольку исходный текст допускает более широкое восприятие огненного явления.
- source_word: מִתְלַקַּחַת
  choice: вспыхивал
  rationale: Причастная форма описывает подвижное, повторяющееся разгорание или мелькание огня; «вспыхивал» естественно передаёт динамику явления.
- source_word: בְּתוֹךְ הַבָּרָד
  choice: среди града
  rationale: Передаёт пространственный смысл нахождения огня внутри, в самой гуще града, без излишне буквальной тяжеловесности.
- source_word: כָּבֵד מְאֹד
  choice: чрезвычайно сильным
  rationale: Буквальное «очень тяжёлым» здесь идиоматически означает исключительную силу и суровость града.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: такого не бывало
  rationale: Естественная русская сравнительная формула сохраняет утверждение о беспримерности этого града.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: во всей земле Египетской
  rationale: Сохраняет территориальный охват выражения и употребляет понятную, торжественную библейскую форму.
- source_word: מֵאָז הָיְתָה לְגוֹי
  choice: с тех пор, как Египет стал народом
  rationale: Сохраняет историческую точку отсчёта и значение לְגוֹי — становление народом, не заменяя его более узким понятием государства.
