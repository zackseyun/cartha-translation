  text: But as for you and your servants[b][a], I know that you do not yet fear Yahweh God.
translation:
  language: ru
  text: Но я знаю, что ты и твои слуги ещё не боитесь Яхве, Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вы всё ещё не боитесь Яхве, Бога». Еврейское слово может также иметь временное значение «прежде чем»; в таком случае возможна временная связь: «прежде чем вы станете бояться Яхве, Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Но о тебе
  rationale: Союз и самостоятельное местоимение выделяют фараона как тему и противопоставляют его предшествующему обещанию о прекращении бедствия.
- source_word: וַעֲבָדֶיךָ
  choice: и твоих слугах
  rationale: В контексте двора עֲבָדִים обозначает подчинённых и придворных фараона; «слуги» сохраняет широкое значение слова, не сужая его до рабов или сановников.
- source_word: יָדַעְתִּי
  choice: я знаю
  rationale: Перфект выражает сложившееся и актуальное знание Моисея.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание знания Моисея.
- source_word: טֶרֶם
  choice: ещё не
  rationale: Перед имперфектом слово естественно выражает отсутствие действия до настоящего момента, хотя возможно и буквальное временное прочтение «прежде чем».
- source_word: תִּירְאוּן מִפְּנֵי
  choice: боитесь
  rationale: Глагол ירא в отношении Бога охватывает страх и благоговение; русское «бояться» сохраняет эту напряжённость. Отдельная передача מִפְּנֵי была бы по-русски тяжеловесной.
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Бога
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а אֱלֹהִים — приложением «Бога», с естественным для русского языка склонением.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Смысл ירא применительно к Богу
  choice: бояться
  alternative: благоговеть; страшиться
  rationale: «Бояться» не сводит смысл ни к одному лишь ужасу, ни к одному лишь почтению и сохраняет богословскую многозначность еврейского глагола.
- issue: Временное значение טֶרֶם
  choice: ещё не
  alternative: прежде чем станете бояться; всё ещё не
  rationale: В контексте это наиболее естественное указание на пока не наступившую перемену, но примечание сохраняет допустимую синтаксическую альтернативу.
translation_notes:
  register: Современный литературный русский язык; тон прямой и достойный. Конструкция «Но о тебе и твоих слугах» естественно передаёт тематическое противопоставление. Имя «Яхве» сохранено как личное имя; архаизмы и конфессионально окрашенные уточнения не использованы.
