base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/028.yaml
  text: Pray to Yahweh[a], for there has been enough of God's thunder and hail. Then I will let you go, and you will stay no longer.
translation:
  language: ru
  text: 'Помолитесь Яхве: довольно уже Божьих раскатов грома и града. Тогда я отпущу вас, и вы больше не останетесь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַעְתִּירוּ
  choice: Помолитесь
  rationale: Побудительная форма во множественном числе означает настойчиво обратиться с мольбой. «Помолитесь» естественно звучит по-русски и подходит к обращению фараона к Моисею и Аарону.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: וְרַב מִהְיֹת
  choice: Довольно уже
  rationale: Еврейский оборот выражает достаточность и избыток; в контексте это просьба прекратить бедствие.
- source_word: קֹלֹת אֱלֹהִים
  choice: Божьего грома
  rationale: Буквально «голосов Бога»; рядом с градом и в контексте бури слово קֹלוֹת обозначает раскаты грома. Притяжательная конструкция сохраняет указание на Божье происхождение явления.
- source_word: וּבָרָד
  choice: и града
  rationale: Прямое соответствие существительному «град»; родительный падеж зависит от «довольно».
- source_word: וַאֲשַׁלְּחָה אֶתְכֶם
  choice: Тогда я отпущу вас
  rationale: В повествовании Исхода שלח с народом в качестве дополнения обычно означает позволить ему уйти, отпустить.
- source_word: וְלֹא תֹסִפוּן לַעֲמֹד
  choice: и вы больше не останетесь здесь
  rationale: Оборот «не прибавите оставаться» означает, что дальнейшего пребывания не будет. «Здесь» проясняет подразумеваемое место — Египет — не называя его прямо.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» сохраняет личное Божье имя и не заменяет его титулом.
- issue: Значение קֹלֹת אֱלֹהִים
  choice: Божьего грома
  alternative: голосов Бога; громов Божьих
  rationale: Метеорологический контекст указывает на гром, тогда как форма «Божьего» сохраняет связь явления с Богом. Буквальное значение отмечено в сноске.
- issue: Оттенок וְלֹא תֹסִפוּן לַעֲמֹד
  choice: вы больше не останетесь здесь
  alternative: вы больше не будете задерживаться; вы больше не продолжите стоять
  rationale: Фраза допускает оттенки пребывания и задержки; выбран естественный русский оборот, не превращающий обещание в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык; речь фараона передана настойчиво, но без архаизмов. Восклицательный знак после просьбы отражает её срочность. Сохранены личное имя Яхве и буквальный образ исходного текста в сноске.
