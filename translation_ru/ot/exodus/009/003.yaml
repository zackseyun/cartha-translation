base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/003.yaml
  text: Look[a], the hand of Yahweh will come upon your livestock that are in the field—upon the horses, the donkeys, the camels, the herds, and the flocks—with a very severe plague.
translation:
  language: ru
  text: Вот, рука Яхве поразит твой скот, который в поле, — коней, ослов, верблюдов, крупный рогатый и мелкий скот — чрезвычайно тяжёлым мором[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чрезвычайно тяжёлой эпидемией»; еврейское слово обозначает смертоносное поветрие, здесь поражающее скот.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательную силу и настоятельность вводного слова, оставаясь естественным для современного литературного русского.
- source_word: יַד יְהוָה
  choice: рука Яхве
  rationale: Сохранён древнееврейский образ руки как выражение Божьей силы и суда, без сведения его к абстрактному действию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо стоящее в еврейском тексте.
- source_word: הוֹיָה בְּ
  choice: поразит
  rationale: В данном контексте естественно выражает предстоящее губительное воздействие руки Яхве; русское буквальное «будет на» не передало бы смысла ясно.
- source_word: בְּמִקְנְךָ אֲשֶׁר בַּשָּׂדֶה
  choice: твой скот, который в поле
  rationale: מִקְנֶה обозначает домашний скот в широком смысле, а относительное придаточное ограничивает угрозу животными, находящимися в поле.
- source_word: בַּסּוּסִים בַּחֲמֹרִים בַּגְּמַלִּים בַּבָּקָר וּבַצֹּאן
  choice: коней, ослов, верблюдов, крупный и мелкий скот
  rationale: Сохраняет полный перечень; בָּקָר и צֹאן переданы как собирательные категории крупного и мелкого скота, без неоправданного сужения до отдельных видов.
- source_word: דֶּבֶר
  choice: мор
  rationale: В библейском контексте обозначает смертоносную эпидемию; «мор» краток, традиционно понятен и применим к массовой гибели животных.
- source_word: כָּבֵד מְאֹד
  choice: чрезвычайно тяжёлым
  rationale: Передаёт усиленную степень бедствия; «тяжёлый» естественно сочетается с «мор» в возвышенном повествовательном регистре.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет эту особенность и не заменяет имя титулом.
- issue: Образ «руки Яхве»
  choice: 'сохранить образ: «рука Яхве поразит»'
  alternative: «Яхве поразит»
  rationale: Образ значим как выражение непосредственной силы и суда Бога и потому не устранён, хотя глагольная конструкция сделана естественной по-русски.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Пунктуация делает перечень ясным; архаическое по оттенку слово «мор» пояснено в сноске.
