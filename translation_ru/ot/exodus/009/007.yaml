translation:
  language: ru
  text: 'Фараон послал узнать[a], и вот: из скота Израиля не пало ни одной головы. Но сердце фараона ожесточилось[b], и он не отпустил народ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Фараон послал»; кого именно и с каким поручением, в еврейском тексте не уточняется.'
    reason: implicit_object
  - marker: b
    text: 'Буквально: «сердце фараона стало тяжёлым» — образное выражение, передающее его непреклонность и упорство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал узнать
  rationale: Глагол буквально означает «послал», причём объект в еврейском тексте не назван. Добавленное по контексту «узнать» делает фразу естественной по-русски, не уточняя, кого именно послал фараон.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Частица привлекает внимание к обнаруженному результату и придаёт повествованию живость; русское «и вот» сохраняет эту функцию.
- source_word: לֹא מֵת מִמִּקְנֵה יִשְׂרָאֵל עַד אֶחָד
  choice: из скота Израиля не пало ни одной головы
  rationale: Оборот עַד אֶחָד подчёркивает полное отсутствие потерь — «ни одного». Счётное выражение «ни одной головы» естественно сочетается в русском языке с собирательным словом «скот».
- source_word: מִקְנֶה
  choice: скот
  rationale: Слово обозначает домашних стадных животных в широком смысле, а не только крупный рогатый скот.
- source_word: וַיִּכְבַּד לֵב פַּרְעֹה
  choice: сердце фараона отяжелело
  rationale: 'Перевод сохраняет образную конструкцию оригинала: сердце является подлежащим, а внешний деятель не назван. Это не превращает фразу ни в явное самовольное ожесточение, ни в действие извне.'
- source_word: וְלֹא שִׁלַּח אֶת הָעָם
  choice: и он не отпустил народ
  rationale: В данном повествовательном контексте שׁלח с народом в качестве дополнения означает позволить ему уйти, то есть отпустить.
theological_decisions:
- issue: Чья воля обусловила упорство фараона
  choice: сердце фараона отяжелело
  alternative: сердце фараона ожесточилось; фараон ожесточил своё сердце
  rationale: В этой фразе подлежащим выступает «сердце фараона», а деятель извне грамматически не выражен. Буквальный образ сохраняет напряжение между человеческой ответственностью и вопросом о внешнем воздействии, не разрешая его за читателя.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной повествовательной интонацией. «И вот» сохраняет выразительность еврейского повествования, а «сердце отяжелело» — исходную метафору без искусственного уточнения действующего лица.
