  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/דִבַּרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/001.yaml
  text: 'Then the LORD said to Moses, "Go in to Pharaoh and say to him, ''Thus says the LORD, the God of the Hebrews: Let my people go, so that they may serve me.''"'
translation:
  language: ru
  text: 'И сказал Господь Моисею: «Войди к фараону и скажи ему: „Так говорит Господь, Бог евреев: отпусти Мой народ, чтобы он служил Мне“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона; сохраняет достоинство библейского стиля.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: войди к фараону
  rationale: Формально передаёт глагол בוא и направление к фараону, не уточняя не выраженное прямо место встречи.
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: и скажи ему
  rationale: Естественная русская передача формулы введения прямой речи; адресат сохранён явно.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: отпусти Мой народ
  rationale: Императив передан прямо и в соответствии с устойчивым контекстуальным значением שלח в повествовании об исходе.
- source_word: וְיַעַבְדֻנִי
  choice: чтобы он служил Мне
  rationale: Передаёт целевую связь и широкое значение עבד — служить, в том числе совершать богослужение, без преждевременного сужения смысла.
theological_decisions:
- issue: Значение עבד в требовании отпустить Израиль
  choice: служил Мне
  alternative: поклонялся Мне
  rationale: «Служил» сохраняет лексическую широту исходного слова и не сводит его значение исключительно к культовому поклонению.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционным библейским звучанием. Заглавные буквы в «Мой» и «Мне» обозначают обращение Бога о Себе и соответствуют принятой русской издательской практике.
