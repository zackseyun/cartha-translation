base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/027.yaml
  text: Then Pharaoh sent and called for Moses and Aaron[a], and said to them, “I have sinned this time. Yahweh is in the right[b], and I and my people are the wicked ones.”
translation:
  language: ru
  text: 'Тогда фараон послал за Моисеем и Аароном и сказал им: «На этот раз я согрешил. Яхве праведен[a], а я и мой народ — нечестивы[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве прав».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «а я и мой народ виноваты»; также возможно: «неправы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא לְ
  choice: послал за
  rationale: Два еврейских глагола описывают распоряжение фараона позвать Моисея и Аарона; в современном русском их сочетание естественно передаётся устойчивым выражением «послал за», без тяжеловесного «послал и позвал».
- source_word: חָטָאתִי הַפָּעַם
  choice: На этот раз я согрешил
  rationale: Сохраняется прямое признание греха и временное ограничение הַפָּעַם — «на этот раз».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: הַצַּדִּיק
  choice: праведен
  rationale: Прилагательное с артиклем выражает нравственную и судебную правоту Яхве; «праведен» сохраняет более полный смысл, тогда как «прав» подчёркивает прежде всего данный спор.
- source_word: הָרְשָׁעִים
  choice: нечестивы
  rationale: Предикативное множественное прилагательное противопоставлено הַצַּדִּיק и обозначает нравственную виновность фараона и его народа, а не только фактическую неправоту.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Источник содержит тетраграмматон как личное имя; транслитерация сохраняет это различие.
- issue: Смысл противопоставления הַצַּדִּיק и הָרְשָׁעִים
  choice: «Яхве праведен… мы нечестивы»
  alternative: «Яхве прав, а мы виноваты / неправы»
  rationale: Основной текст сохраняет нравственно-судебную силу пары терминов, а сноски отмечают допустимое контекстуальное понимание как правоты и виновности.
translation_notes:
  register: Современный литературный русский с достоинством прямой речи. Порядок «я и мой народ» сохранён ради акцента на личном признании фараона. Маркеры сносок стоят непосредственно после соответствующих слов.
