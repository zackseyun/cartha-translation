  text: עוֹדְ/ךָ֖ מִסְתּוֹלֵ֣ל בְּ/עַמִּ֑/י לְ/בִלְתִּ֖י שַׁלְּחָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/017.yaml
  text: Are you still exalting yourself against my people by not letting them go?[a]
translation:
  language: ru
  text: Ты всё ещё превозносишься над Моим народом, не отпуская его?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты всё ещё надменно возвышаешься над Моим народом, не отпуская его?»'
    reason: Лексема מִסְתּוֹלֵל допускает передачу с более явным оттенком надменности и самовозвышения.
lexical_decisions:
- source_word: עוֹדְךָ
  choice: Ты всё ещё
  rationale: Сочетание עוֹד («ещё, всё ещё») с местоименным элементом 2-го лица мужского рода указывает на продолжающееся действие фараона. В контексте высказывание естественно передаётся как риторический вопрос.
- source_word: מִסְתּוֹלֵל
  choice: превозносишься
  rationale: Форма Hitpolel от סלל передаёт самовозвышение и высокомерное самоутверждение. «Превозносишься» сохраняет возвратность и оттенок гордыни.
- source_word: בְּעַמִּי
  choice: над Моим народом
  rationale: Предлог ב при глаголе самовозвышения выражает направленность на объект и притязание на превосходство над ним. «Над Моим народом» естественно сочетается с «превозносишься» и сохраняет враждебный смысл.
- source_word: לְבִלְתִּי
  choice: не отпуская
  rationale: Отрицательная инфинитивная конструкция объясняет, в чём проявляется самовозвышение фараона. Деепричастный оборот ясно и естественно передаёт значение «тем, что не…».
- source_word: שַׁלְּחָם
  choice: отпуская его
  rationale: Порода Piel глагола שלח в повествовании об исходе обозначает освобождение Израиля. Единственное число «его» согласуется в русском с собирательным существительным «народ», хотя еврейский суффикс буквально означает «их».
theological_decisions:
- issue: Божественное притязание, выраженное словами «Мой народ»
  choice: Сохранить «Моим народом» как прямое заявление Господа о принадлежности Израиля Ему
  alternative: «народом» или «Израилем»
  rationale: 'Местоименный суффикс первого лица значим в контексте Исхода: он подчёркивает особое отношение Бога к Израилю и показывает, что противодействие фараона народу направлено и против Бога.'
translation_notes:
  register: Современный литературный русский язык; обращение к фараону передано на «ты», как прямое властное обращение Бога. Заглавная буква в «Моим» отражает традиционное русское оформление местоимения, относящегося к Богу, не изменяя смысла оригинала.
