source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מֹשֶׁ֔ה כְּ/צֵאתִ/י֙ אֶת הָ/עִ֔יר אֶפְרֹ֥שׂ אֶת כַּפַּ֖/י אֶל יְהוָ֑ה הַ/קֹּל֣וֹת יֶחְדָּל֗וּ/ן וְ/הַ/בָּרָד֙ לֹ֣א יִֽהְיֶה ע֔וֹד לְמַ֣עַן תֵּדַ֔ע כִּ֥י לַ/יהוָ֖ה הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/029.yaml
  text: Moses said to him[a], “As soon as I have gone out of the city, I will spread out my hands to Yahweh; the thunder will cease, and the hail will be no more[b], so that you may know that the earth belongs to Yahweh.”
translation:
  language: ru
  text: 'Моисей сказал ему: «Как только я выйду из города, я простру руки к Яхве. Гром[a] прекратится, и града больше не будет, чтобы ты узнал, что земля принадлежит Яхве[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «голоса»; в контексте этой бури имеются в виду раскаты грома.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «что страна принадлежит Яхве».'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּצֵאתִי
  choice: Как только я выйду
  rationale: Конструкция כְּ с инфинитивом и суффиксом первого лица задаёт время действия; такой перевод естественно передаёт непосредственную последовательность событий.
- source_word: אֶפְרֹשׂ אֶת־כַּפַּי
  choice: я простру руки
  rationale: Сочетание глагола פרשׂ с כף обозначает простирание раскрытых рук в молитве; «простру руки» сохраняет жест и соответствует современному возвышенному регистру.
- source_word: יְהוָה / לַיהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет явное употребление Божьего имени в еврейском тексте.
- source_word: הַקֹּלוֹת
  choice: гром
  rationale: Буквально слово означает «голоса/звуки», но в контексте бури и града обозначает раскаты грома.
- source_word: יֶחְדָּלוּן
  choice: прекратится
  rationale: Глагол חדל означает прекращение действия; единственное число согласуется с естественным русским собирательным «гром».
- source_word: וְהַבָּרָד לֹא יִהְיֶה עוֹד
  choice: и града больше не будет
  rationale: Естественная русская конструкция точно передаёт прекращение града.
- source_word: לְמַעַן תֵּדַע
  choice: чтобы ты узнал
  rationale: לְמַעַן выражает цель; форма второго лица единственного числа обращена к фараону.
- source_word: כִּי לַיהוָה הָאָרֶץ
  choice: что земля принадлежит Яхве
  rationale: Предлог לְ выражает принадлежность, а הָאָרֶץ допускает значения «земля» и «страна»; в основном тексте выбрано более широкое «земля».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя передаёт тетраграмматон непосредственно и не заменяет его титулом.
- issue: Объём значения הָאָרֶץ
  choice: земля
  alternative: страна
  rationale: Контекст допускает универсальное утверждение о власти Яхве над землёй, однако лексическая возможность локального значения сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Простру руки» сохраняет молитвенный жест без архаизации всего стиха; синтаксис остаётся ясным для обычного читателя.
