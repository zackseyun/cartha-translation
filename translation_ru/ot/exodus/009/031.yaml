lexical_decisions:
- source_word: הַפִּשְׁתָּה
  choice: лён
  rationale: Прямое и естественное русское название растения, из которого получают льняное волокно.
- source_word: הַשְּׂעֹרָה
  choice: ячмень
  rationale: Обычное русское соответствие названию этой зерновой культуры.
- source_word: נֻכָּתָה
  choice: были побиты
  rationale: Пассивная форма от נכה описывает поражение посевов градом; множественное число естественно согласуется в русском языке с составным подлежащим.
- source_word: כִּי
  choice: ':'
  rationale: Двоеточие естественно вводит пояснение причины повреждения культур и передаёт пояснительно-причинную функцию כִּי без тяжеловесного повторения союза.
- source_word: אָבִיב
  choice: в колосе
  rationale: Передаёт стадию развития ячменя, когда колос уже сформировался, сохраняя конкретный земледельческий образ.
- source_word: גִּבְעֹל
  choice: в бутонах
  rationale: Кратко и понятно передаёт продвинутую стадию развития льна, не утверждая точнее, чем позволяет редкое древнееврейское слово.
