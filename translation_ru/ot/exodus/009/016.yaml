base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/016.yaml
  text: 'But for this purpose I have let you stand: to show you my power[a], and so that my name may be proclaimed in all the earth.'
translation:
  language: ru
  text: Но для этого Я сохранил тебя[a], чтобы показать тебе Мою силу и чтобы Моё имя возвещалось по всей земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поставил тебя», «дал тебе устоять»; традиционно: «воздвиг тебя». Еврейское выражение может означать, что Бог поставил фараона или дал ему устоять. В данном контексте оно, вероятно, указывает на то, что Бог сохранил ему жизнь, не уничтожив его сразу.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאוּלָם
  choice: Но
  rationale: Передаёт сильное противопоставление предыдущему утверждению естественно и без излишней книжности.
- source_word: בַּעֲבוּר זֹאת
  choice: для того
  rationale: Выражает цель, которая далее раскрывается двумя целевыми оборотами.
- source_word: הֶעֱמַדְתִּיךָ
  choice: Я и оставил тебя стоять
  rationale: Сохраняет образ каузативной формы глагола עמד и в контексте указывает на то, что Бог позволил фараону уцелеть и продолжать существовать, а не сразу уничтожил его.
- source_word: בַּעֲבוּר הַרְאֹתְךָ
  choice: чтобы показать тебе
  rationale: Прямо и естественно передаёт целевое значение еврейской конструкции.
- source_word: כֹּחִי
  choice: Мою силу
  rationale: В контексте казней речь идёт о явлении Божьего могущества; «сила» естественно сохраняет основное значение כֹּחַ.
- source_word: וּלְמַעַן
  choice: и чтобы
  rationale: Координирует вторую цель с первой, не подчиняя одну другой.
- source_word: סַפֵּר
  choice: возвещалось
  rationale: Передаёт значение провозглашения или рассказывания; возвратная безличная конструкция сохраняет неопределённость субъекта исходного инфинитива.
- source_word: שְׁמִי
  choice: Моё имя
  rationale: Сохраняет библейский образ имени как явленной личности и славы Бога, не разворачивая его толкование в основном тексте.
- source_word: בְּכָל הָאָרֶץ
  choice: по всей земле
  rationale: Передаёт широкий, универсальный охват выражения; «по всей» идиоматично сочетается с глаголом возвещения.
theological_decisions:
- issue: Значение הֶעֱמַדְתִּיךָ применительно к фараону
  choice: Бог оставил фараона стоять, то есть позволил ему уцелеть и продолжать существовать ради Своей цели.
  alternative: Бог воздвиг или поставил фараона, возможно возвысив его до царского положения, ради этой цели.
  rationale: Предшествующий контекст противопоставляет возможность немедленно истребить фараона тому, что он всё ещё существует. Основной текст сохраняет еврейский образ «стоять», а сноска отмечает традиционно возможное понимание «воздвиг».
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся ясным для обычного читателя; повтор «чтобы… и чтобы…» сохраняет две параллельные цели исходного текста. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
