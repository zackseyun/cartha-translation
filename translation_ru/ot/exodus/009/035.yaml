base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/035.yaml
  text: So Pharaoh’s heart was hardened[a], and he did not let the sons of Israel go[c][b], just as Yahweh had spoken through Moses.
translation:
  language: ru
  text: И сердце фараона ожесточилось[a], и он не отпустил израильтян[b], как сказал Яхве через Моисея[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стало непреклонным»; еврейский глагол буквально выражает укрепление, обретение твёрдости.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «сынов Израиля»; то есть израильский народ.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «рукой Моисея» — еврейский оборот со значением «через Моисея».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: ожесточилось
  rationale: Глагол חזק буквально передаёт укрепление или обретение твёрдости; в контексте упорного сопротивления фараона естественное русское «ожесточилось» сохраняет мотив непреклонности, не называя того, кто вызвал это состояние.
- source_word: לֵב פַּרְעֹה
  choice: сердце фараона
  rationale: Прямая передача еврейской конструкции сохраняет представление о сердце как средоточии воли и внутренних решений.
- source_word: שִׁלַּח
  choice: не отпустил
  rationale: В повествовании об исходе глагол означает позволить народу уйти; «не отпустил» кратко и естественно выражает этот смысл.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: израильтян
  rationale: Буквально выражение означает «сынов Израиля», но здесь называет народ в целом; «израильтян» ясно и естественно для современного русского читателя, а буквальная форма отмечена в сноске.
- source_word: כַּאֲשֶׁר
  choice: как и
  rationale: Оборот указывает на соответствие события ранее сказанному слову Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: בְּיַד מֹשֶׁה
  choice: через Моисея
  rationale: Буквальный оборот «рукой Моисея» является идиомой посредничества; «через Моисея» естественно передаёт его смысл.
theological_decisions:
- issue: Причинность ожесточения сердца фараона
  choice: сердце фараона ожесточилось
  alternative: Бог ожесточил сердце фараона; фараон ожесточил своё сердце
  rationale: Еврейская форма в этом стихе описывает сердце как ставшее твёрдым, но прямо не называет ни Бога, ни самого фараона причиной. Возвратная русская конструкция сохраняет эту намеренную неопределённость и богословское напряжение повествования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка проста и понятна; архаичный буквальный оборот «сыны Израиля» и идиома «рукой Моисея» вынесены в сноски. Союз «и» сохраняет последовательный повествовательный строй еврейского текста.
