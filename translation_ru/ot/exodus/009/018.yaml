  text: הִנְ/נִ֤י מַמְטִיר֙ כָּ/עֵ֣ת מָחָ֔ר בָּרָ֖ד כָּבֵ֣ד מְאֹ֑ד אֲשֶׁ֨ר לֹא הָיָ֤ה כָמֹ֨/הוּ֙ בְּ/מִצְרַ֔יִם לְ/מִן הַ/יּ֥וֹם הִוָּסְדָ֖/ה וְ/עַד עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/018.yaml
  text: Behold[a], about this time tomorrow I will rain down very heavy hail[b], such as has never been in Egypt from the day it was founded until now.
translation:
  language: ru
  text: Вот, завтра примерно в это время Я обрушу очень сильный град — такого ещё не бывало в Египте со дня его основания и доныне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: Вот
  rationale: Передаёт указательно-эмфатическую силу торжественного Божьего объявления и естественно звучит в современном литературном русском.
- source_word: מַמְטִיר
  choice: Я обрушу
  rationale: Форма хифиль выражает прямое причиняющее действие Бога. В сочетании с градом «обрушу» идиоматично передаёт ниспослание интенсивных осадков.
- source_word: כָּעֵת מָחָר
  choice: завтра примерно в это время
  rationale: Предлог כְּ допускает оттенок приблизительности; такой порядок слов естественен по-русски.
- source_word: בָּרָד כָּבֵד מְאֹד
  choice: очень сильный град
  rationale: Буквально כָּבֵד означает «тяжёлый», но применительно к граду современное русское «очень сильный» естественно выражает исключительную суровость явления.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: такого ещё не бывало
  rationale: Кратко и естественно сохраняет сравнительно-превосходный смысл еврейской конструкции.
- source_word: לְמִן הַיּוֹם הִוָּסְדָה
  choice: со дня его основания
  rationale: Нифаль указывает на основание или установление Египта; местоимение «его» грамматически соотносится с Египтом.
- source_word: וְעַד עָתָּה
  choice: и доныне
  rationale: Точно передаёт временной предел и поддерживает dignified библейский регистр без архаической непонятности.
theological_decisions:
- issue: Божественная причинность грядущей казни
  choice: 'Сохранено прямое заявление от первого лица: «Я обрушу».'
  alternative: Безличное «выпадет град».
  rationale: Первое лицо и каузативная форма מַמְטִיר прямо приписывают действие Богу; перевод не должен ослаблять эту причинность.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной речью. «Вот» и «доныне» поддерживают достоинство пророческого объявления; синтаксис остаётся естественным для обычного читателя.
