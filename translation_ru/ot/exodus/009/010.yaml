source:
  edition: WLC
  text: וַ/יִּקְח֞וּ אֶת פִּ֣יחַ הַ/כִּבְשָׁ֗ן וַ/יַּֽעַמְדוּ֙ לִ/פְנֵ֣י פַרְעֹ֔ה וַ/יִּזְרֹ֥ק אֹת֛/וֹ מֹשֶׁ֖ה הַ/שָּׁמָ֑יְמָ/ה וַ/יְהִ֗י שְׁחִין֙ אֲבַעְבֻּעֹ֔ת פֹּרֵ֕חַ בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/010.yaml
  text: So they took soot from the kiln and stood before Pharaoh[a], and Moses threw it toward the sky[b], and it became boils with blisters breaking out on man and on beast.
translation:
  language: ru
  text: Они взяли сажу из печи и предстали перед фараоном. Моисей бросил её к небу, и на людях и животных появились нарывы, покрытые волдырями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּיחַ
  choice: сажа
  rationale: Слово обозначает мелкий чёрный порошок, то есть сажу, а не пепел вообще.
- source_word: הַכִּבְשָׁן
  choice: печь
  rationale: כִּבְשָׁן — обжиговая печь или горн; «печь» здесь естественно и достаточно конкретно.
- source_word: לִפְנֵי פַרְעֹה
  choice: предстали перед фараоном
  rationale: Передаёт пребывание в присутствии фараона и сочетается с глаголом «стали» в древнееврейском тексте.
- source_word: וַיִּזְרֹק אֹתוֹ מֹשֶׁה הַשָּׁמָיְמָה
  choice: Моисей бросил её к небу
  rationale: Единственное число относится к саже как собирательной массе, а направительная форма указывает на движение вверх.
- source_word: שְׁחִין אֲבַעְבֻּעֹת
  choice: нарывы, покрытые волдырями
  rationale: 'Сохраняет оба элемента выражения: воспалённые нарывы и сопровождающие их волдыри или пустулы.'
- source_word: פֹּרֵחַ
  choice: появились
  rationale: В данном описании кожного поражения причастие передаёт возникновение и распространение высыпаний; «появились» звучит естественно по-русски.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: на людях и животных
  rationale: Собирательные единственные числа обозначают людей и животных в целом; русский множественный ряд естественно передаёт этот охват.
theological_decisions:
- issue: Собирательное אָדָם в противопоставлении животным
  choice: людях
  alternative: человеке
  rationale: Здесь слово обозначает людей вообще, а не одного мужчину. Множественное число ясно передаёт родовое значение без изменения объёма высказывания.
translation_notes:
  register: Современный литературный русский язык с повествовательной сдержанностью. Синтаксис разделён на два предложения ради естественного чтения; причинно-последовательная связь и порядок событий сохранены. Специальные сноски не требуются.
