  text: וּ/לְ/כֹהֵ֥ן מִדְיָ֖ן שֶׁ֣בַע בָּנ֑וֹת וַ/תָּבֹ֣אנָה וַ/תִּדְלֶ֗נָה וַ/תְּמַלֶּ֨אנָה֙ אֶת הָ֣/רְהָטִ֔ים לְ/הַשְׁק֖וֹת צֹ֥אן אֲבִי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/016.yaml
  text: The priest of Midian had seven daughters[b][a], and they came and drew water and filled the troughs to water their father's flock.
translation:
  language: ru
  text: У мадиамского священника[a] было семь дочерей. Они пришли, начерпали воды[b] и наполнили ею корыта, чтобы напоить стадо своего отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «у одного мадиамского священника». В еврейском тексте нет артикля, поэтому речь может идти как об определённом священнике, так и просто об одном из священников Мадиама.'
    reason: lexical_alternative
  - marker: b
    text: Глагол означает доставать, поднимать воду — здесь, по контексту, из колодца.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְכֹהֵן מִדְיָן
  choice: У мадиамского священника
  rationale: Еврейская именная конструкция со значением обладания естественно передаётся по-русски оборотом «у ... было». כֹהֵן означает «священник», а מִדְיָן указывает на связь с Мадиамом.
- source_word: שֶׁבַע בָּנוֹת
  choice: было семь дочерей
  rationale: Естественная русская передача еврейской конструкции принадлежности; женский род последующих глаголов соотносится с дочерьми.
- source_word: וַתָּבֹאנָה
  choice: они пришли
  rationale: Прямое повествовательное значение глагола בוא; местоимение делает смену подлежащего ясной по-русски.
- source_word: וַתִּדְלֶנָה
  choice: начерпали воды
  rationale: דלה обозначает доставание, черпание воды, в данном контексте — из колодца; совершенный вид естественен в последовательности завершённых действий.
- source_word: וַתְּמַלֶּאנָה אֶת הָרְהָטִים
  choice: наполнили ею корыта
  rationale: רְהָטִים — ёмкости или желоба для водопоя. «Корыта» конкретно и понятно; «ею» естественно восполняет подразумеваемую воду.
- source_word: לְהַשְׁקוֹת
  choice: чтобы напоить
  rationale: Порода Hiphil глагола שקה означает «дать пить»; целевой оборот передаёт функцию инфинитива.
- source_word: צֹאן אֲבִיהֶן
  choice: стадо своего отца
  rationale: צֹאן — собирательное обозначение мелкого домашнего скота, прежде всего овец и коз; возвратное «своего» ясно связывает отца с семью дочерьми.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Начальный союз ו не передан отдельным словом, поскольку в русском стих естественно продолжает предыдущее повествование без искусственного «и» или «теперь». Сохранена неопределённость относительно того, был ли это определённый священник Мадиама или один из них.
