base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/019.yaml
  text: They said[a], “An Egyptian man rescued us from the hand of the shepherds[b], and he even drew water for us and watered the flock.”
translation:
  language: ru
  text: 'Они ответили: «Один египтянин спас нас из рук пастухов[a], да ещё и сам начерпал для нас воды[b] и напоил стадо».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-под власти пастухов»; буквально: «из руки пастухов».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте глагол усилен повтором однокоренных форм; буквально: «черпая, начерпал для нас». Это подчёркивает, что он сам черпал воду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: Они ответили
  rationale: Форма 3-го лица женского рода множественного числа вводит ответ дочерей на вопрос отца. «Ответили» естественно передаёт функцию реплики в данном контексте; начальное וַ- отдельно не выражено ради плавности русского повествования.
- source_word: אִישׁ מִצְרִי
  choice: один египтянин
  rationale: Сочетание буквально обозначает «мужчина-египтянин». В современном русском «один египтянин» естественно представляет ранее не названного мужчину, не утрачивая указания на его пол и происхождение.
- source_word: הִצִּילָנוּ
  choice: спас нас
  rationale: Порода hифиль глагола נצל означает избавить или вырвать из опасности. «Спас» ясно и естественно передаёт физическое избавление в этой сцене.
- source_word: מִיַּד
  choice: из рук
  rationale: Сохранён буквальный образ «из руки», который в контексте означает избавление от власти или насилия пастухов и понятен по-русски.
- source_word: הָרֹעִים
  choice: пастухов
  rationale: Слово от רעה обозначает людей, пасущих стада; «пастухи» — прямой и контекстуально уместный эквивалент.
- source_word: וְגַם
  choice: да ещё и
  rationale: Оборот подчёркивает, что египтянин не только защитил женщин, но и оказал им дополнительную помощь.
- source_word: דָּלֹה דָלָה
  choice: сам начерпал
  rationale: Инфинитив абсолютный с личной формой того же глагола усиливает действие. Сочетание «да ещё и сам» естественно передаёт акцент на том, что он лично начерпал воду; «начерпал» отражает завершённое действие в данном эпизоде.
- source_word: לָנוּ
  choice: для нас
  rationale: Дательный компонент выражает действие, совершённое в пользу дочерей.
- source_word: וַיַּשְׁקְ
  choice: напоил
  rationale: Hифиль глагола שקה означает дать пить или напоить. «Напоил» естественно сочетается со стадом и передаёт результат действия.
- source_word: אֶת־הַצֹּאן
  choice: стадо
  rationale: צאן — собирательное обозначение мелкого домашнего скота, обычно овец и коз. «Стадо» сохраняет собирательность, не уточняя вид животных сверх исходного текста.
