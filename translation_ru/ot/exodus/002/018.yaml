  yaml_path: translation/ot/exodus/002/018.yaml
  text: When they came to Reuel their father[a], he said, “Why have you come back so quickly today?”
translation:
  language: ru
  text: 'Когда они пришли к своему отцу Реуилу, он спросил: «Почему вы сегодня так быстро вернулись[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более формально: «Почему вы поторопились прийти сегодня?» В еврейском тексте употреблён глагол «торопиться» с глаголом «приходить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה
  choice: Когда они пришли
  rationale: Форма 3-го лица женского рода множественного числа относится к дочерям; придаточное с «когда» естественно передаёт последовательность событий в русском повествовании.
- source_word: רְעוּאֵל
  choice: Реуил
  rationale: Имя передано непосредственно по еврейской форме, без гречески обусловленного варианта «Рагуил».
- source_word: אֲבִיהֶן
  choice: своему отцу
  rationale: Существительное с суффиксом 3-го лица женского рода множественного числа означает «их отец»; возвратное «своему» естественно по-русски и однозначно относится к дочерям.
- source_word: וַיֹּאמֶר
  choice: он спросил
  rationale: Буквально «он сказал», однако перед прямым вопросом русское «спросил» естественно передаёт речевое действие, не меняя смысла.
- source_word: מַדּוּעַ
  choice: Почему
  rationale: Прямой современный эквивалент вопросительного наречия причины.
- source_word: מִהַרְתֶּן בֹּא
  choice: так быстро вернулись
  rationale: Сочетание глагола «торопиться» с инфинитивом «приходить» описывает необычно скорое возвращение дочерей; формулировка естественна по-русски, а более формальное строение отражено в сноске.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Определённая форма слова «день» здесь идиоматически означает «сегодня».
