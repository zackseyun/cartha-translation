lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Обычное значение глагола הלך в данной повествовательной форме; сохраняет последовательность действий без добавления отсутствующего в источнике вводного слова.
- source_word: אִישׁ
  choice: один человек
  rationale: Передаёт неопределённо названного мужчину и сохраняет его первоначальную анонимность; «муж» преждевременно вводило бы брачное отношение.
- source_word: מִבֵּית לֵוִי
  choice: из дома Левия
  rationale: Сохраняет родословное выражение оригинала и его связь с племенной линией Левия; «из колена Левия» было бы несколько шире.
- source_word: וַיִּקַּח
  choice: взял в жёны
  rationale: לקח буквально значит «взял», а в данном брачном контексте означает взятие женщины в жёны. Русское идиоматическое выражение ясно передаёт этот смысл.
- source_word: אֶת
  choice: '[показатель прямого дополнения, отдельно не переводится]'
  rationale: Служебное слово отмечает определённое прямое дополнение и не требует отдельного соответствия в русском.
- source_word: בַּת לֵוִי
  choice: дочь Левия
  rationale: Сохраняет буквальную родословную формулировку и параллель с «домом Левия»; речь идёт о женщине — потомке Левия.
