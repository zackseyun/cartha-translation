base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/005.yaml
  text: Then Pharaoh’s daughter went down to bathe at the Nile[a], while her young women were walking along the bank of the Nile. She saw the basket in the midst of the reeds[c][b], and she sent her servant girl and took it.
translation:
  language: ru
  text: И дочь фараона спустилась к Нилу, чтобы искупаться, а её служанки шли вдоль берега Нила. Она увидела корзину[a] среди тростника и послала за ней свою рабыню[b], и та взяла её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое здесь как «корзина», употребляется также для Ноева «ковчега» в Быт 6–9.
    reason: cross_reference
  - marker: b
    text: 'Еврейское слово может означать «её руку»; тогда: «она протянула руку и взяла её».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: спустилась
  rationale: Сохраняет направительное значение ירד и естественно звучит по-русски.
- source_word: לִרְחֹץ עַל הַיְאֹר
  choice: к Нилу, чтобы искупаться
  rationale: רחץ в данном контексте означает купание; על передаёт местоположение у реки, а не действие на её поверхности.
- source_word: וְנַעֲרֹתֶיהָ
  choice: её служанки
  rationale: נערות буквально обозначает молодых женщин; при дворе контекст указывает на сопровождавших дочь фараона служанок. Возрастовой оттенок здесь несущественен для естественного русского текста.
- source_word: עַל יַד הַיְאֹר
  choice: вдоль берега Нила
  rationale: Идиома עַל יַד означает «рядом, возле»; с глаголом движения естественно передаётся как «вдоль берега».
- source_word: הַתֵּבָה
  choice: корзину
  rationale: В непосредственном контексте это небольшое вместилище для младенца; «корзина» ясно передаёт предмет, тогда как связь с Ноевым ковчегом отмечена в сноске.
- source_word: בְּתוֹךְ הַסּוּף
  choice: среди тростника
  rationale: Передаёт пространственное значение בְּתוֹךְ и обычное значение סוּף как прибрежных зарослей тростника или камыша.
- source_word: אֲמָתָהּ
  choice: свою рабыню
  rationale: Масоретская огласовка и синтаксис с שלח поддерживают значение «её рабыня/служанка»; «рабыня» отличает אָמָה от ранее упомянутых נַעֲרוֹת.
- source_word: וַתִּקָּחֶהָ
  choice: и та принесла её
  rationale: Грамматически форма означает «и она взяла её», но после того как дочь фараона посылает рабыню за корзиной, русский текст естественно уточняет подразумеваемого деятеля и результат действия.
theological_decisions:
- issue: Межтекстовая связь слова תֵּבָה с рассказом о Ное
  choice: корзина
  alternative: ковчег
  rationale: Размер и функция предмета в этом эпизоде требуют естественного «корзина», однако уникальная лексическая связь с Быт 6–9 не скрывается и вынесена в сноску.
- issue: Неоднозначность אֲמָתָהּ
  choice: свою рабыню
  alternative: свою руку
  rationale: Чтение «рабыню» соответствует масоретскому тексту и обычному управлению глагола «послать»; традиционное чтение «руку» сохранено в сноске, не выдавая его за основной текст.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. «Дочь фараона» и «Нил» соответствуют устойчивому библейскому словоупотреблению; архаизмы устранены. Различие между сопровождавшими служанками и одной рабыней сохранено.
