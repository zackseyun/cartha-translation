source:
  edition: WLC
  text: וַ/תֵּתַצַּ֥ב אֲחֹת֖/וֹ מֵ/רָחֹ֑ק לְ/דֵעָ֕ה מַה יֵּעָשֶׂ֖ה לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/004.yaml
  text: And his sister stood at a distance[b][a], to know what would be done to him.
translation:
  language: ru
  text: А его сестра встала поодаль, чтобы узнать, что с ним сделают.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «что ему будет сделано»; возможно также: «что с ним произойдёт».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּתַצַּב
  choice: встала
  rationale: Форма глагола יצב передаёт занятие или сохранение положения стоя; «встала» естественно звучит по-русски и не перегружает перевод оттенком возвратности.
- source_word: אֲחֹתוֹ
  choice: его сестра
  rationale: Точная и естественная передача существительного с местоименным суффиксом 3-го лица мужского рода единственного числа.
- source_word: מֵרָחֹק
  choice: поодаль
  rationale: Наречие естественно обозначает нахождение на некотором расстоянии и соответствует пространственному смыслу еврейского выражения.
- source_word: לְדֵעָה
  choice: чтобы узнать
  rationale: Инфинитив с ל выражает цель. В данном контексте ידע означает не обладание знанием, а намерение выяснить дальнейшую судьбу ребёнка.
- source_word: מַה
  choice: что
  rationale: Стандартная передача вопросительного местоимения, вводящего содержание ожидаемого события.
- source_word: יֵּעָשֶׂה
  choice: сделают
  rationale: Еврейская форма — нифаль имперфекта от עשה, буквально «будет сделано». Русская неопределённо-личная конструкция сохраняет смысл пассива и звучит естественнее буквального «будет сделано».
- source_word: לוֹ
  choice: с ним
  rationale: В сочетании с русским «сделают» конструкция «что с ним сделают» идиоматично передаёт еврейское «что будет сделано ему/с ним» и сохраняет неопределённость исхода.
