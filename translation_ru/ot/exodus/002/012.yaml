  yaml_path: translation/ot/exodus/002/012.yaml
  text: He looked this way and that[a], and when he saw that there was no one there, he struck down the Egyptian and hid him in the sand.
translation:
  language: ru
  text: Он огляделся по сторонам и, увидев, что никого нет[a], сразил египтянина и спрятал его в песке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нет человека»; в данном контексте выражение может иметь обобщённый смысл: «никого нет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן כֹּה וָכֹה
  choice: огляделся по сторонам
  rationale: Сочетание глагола פנה («повернуться») с идиомой כֹּה וָכֹה («туда и сюда», «в обе стороны») описывает осмотр вокруг; выбран естественный русский эквивалент.
- source_word: וַיַּרְא כִּי אֵין אִישׁ
  choice: увидев, что никого нет
  rationale: Буквально אִישׁ означает «человек; мужчина», но в данной отрицательной конструкции слово естественно обозначает отсутствие какого-либо человека, способного стать свидетелем.
- source_word: וַיַּךְ
  choice: сразил
  rationale: Глагол נכה прежде всего означает «ударить, поразить». Здесь смертельный исход подтверждается сокрытием тела и последующим контекстом (Исх. 2:14); «сразил» передаёт и действие, и его результат, не заменяя глагол прямым «убил».
- source_word: הַמִּצְרִי
  choice: египтянина
  rationale: Прямое обозначение этнической или национальной принадлежности с определённым артиклем; контекст по-русски делает определённость ясной без отдельного средства.
- source_word: וַיִּטְמְנֵהוּ
  choice: спрятал его
  rationale: טמן означает «прятать, скрывать»; последующее «в песке» указывает на способ сокрытия, поэтому более узкое «закопал» не требуется.
- source_word: בַּחוֹל
  choice: в песке
  rationale: חוֹל прямо означает «песок»; предложная форма естественно передаёт место сокрытия.
