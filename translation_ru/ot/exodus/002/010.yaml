source:
  edition: WLC
  text: וַ/יִגְדַּ֣ל הַ/יֶּ֗לֶד וַ/תְּבִאֵ֨/הוּ֙ לְ/בַת פַּרְעֹ֔ה וַֽ/יְהִי לָ֖/הּ לְ/בֵ֑ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ מֹשֶׁ֔ה וַ/תֹּ֕אמֶר כִּ֥י מִן הַ/מַּ֖יִם מְשִׁיתִֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/010.yaml
  text: When the child grew[a], she brought him to Pharaoh’s daughter, and he became her son. She named him Moses, for she said[b], “I drew him out of the water.”
translation:
  language: ru
  text: 'Когда ребёнок подрос, она привела его к дочери фараона, и он стал ей сыном.[a] Она назвала его Моисеем, сказав: «Я вынула его из воды».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «он стал для неё сыном»; древнееврейский текст не уточняет юридических обстоятельств этих сыновних отношений.'
    reason: lexical_alternative
  - marker: b
    text: Имя «Моисей» (древнеевр. Моше) созвучно древнееврейскому выражению «я вынула его».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִגְדַּל
  choice: подрос
  rationale: В данном контексте גדל означает, что ребёнок вырос настолько, чтобы перейти от родной матери к дочери фараона; «подрос» естественно передаёт ход повествования, не подразумевая высокого положения.
- source_word: הַיֶּלֶד
  choice: ребёнок
  rationale: יֶלֶד может означать ребёнка или мальчика; «ребёнок» сохраняет связь с предшествующим рассказом о младенчестве.
- source_word: וַתְּבִאֵהוּ
  choice: она привела его
  rationale: Побудительная порода глагола בוא обычно означает «привести/принести». Поскольку ребёнок уже подрос, по-русски естественно «привела»; субъектом по контексту остаётся его мать.
- source_word: לְבַת פַּרְעֹה
  choice: к дочери фараона
  rationale: Так естественно и точно передаётся древнееврейская конструкция принадлежности.
- source_word: וַיְהִי לָהּ לְבֵן
  choice: он стал ей сыном
  rationale: Формулировка передаёт установившиеся сыновние отношения, не добавляя отсутствующих в тексте подробностей юридического усыновления; дательный оборот также сохраняет оттенок еврейской конструкции.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: она назвала его
  rationale: Это естественная русская передача древнееврейской формулы наречения имени.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Использована укоренившаяся в русском литературном и библейском употреблении форма имени.
- source_word: כִּי
  choice: сказав
  rationale: כִּי вводит объяснение имени. Деепричастная конструкция естественно связывает наречение с последующим объяснением, не усиливая причинность сверх текста.
- source_word: מִן הַמַּיִם
  choice: из воды
  rationale: Это точная и естественная передача исходного направления движения; множественная форма древнееврейского מַיִם в русском обычно передаётся единственным числом «вода».
- source_word: מְשִׁיתִהוּ
  choice: я вынула его
  rationale: Глагол означает извлечение из воды. «Вынула» звучит естественно по-русски и сохраняет женский субъект; исходная игра слов с именем поясняется в сноске.
theological_decisions:
- issue: Характер отношений Моисея с дочерью фараона в וַיְהִי לָהּ לְבֵן
  choice: «он стал ей сыном» — реальные сыновние отношения в рамках повествования
  alternative: «он стал для неё как сын» — отношения без утверждения полноценного сыновнего статуса
  rationale: Древнееврейская конструкция выражает обретённый статус сына, но не описывает правовой порядок усыновления. Основной текст сохраняет сильную формулировку оригинала, а сноска отмечает допустимый оттенок.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис простой и общепонятный; традиционная форма имени «Моисей» сохранена, а неочевидная в русском игра слов пояснена в сноске.
