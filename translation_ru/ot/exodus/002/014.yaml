  terminology: '«Начальником и судьёй над нами» адекватно передаёт שַׂר וְשֹׁפֵט עָלֵינוּ. Не переводить אִישׁ отдельным словом в данном русском обороте оправданно: отдельное «мужчиной» было бы неестественным и не добавляло бы релевантного смысла. «Неужели ты намерен убить меня» приемлемо передаёт контекстуальный вопрос о намерении, не утверждая, что Моисей произнёс угрозу.'
