  source_fidelity: 'Основной смысл передан точно: вызов власти Моисея, угроза убийства по аналогии с убийством египтянина, страх Моисея и его вывод о том, что дело стало известно, сохранены. Однако וַיֹּאמַר означает «и сказал», а не «и подумал». Хотя слова Моисея, вероятно, выражают его внутреннее осознание, исходный текст не заменяет речь мыслью; такая замена излишне интерпретирует форму глагола.'
