source:
  edition: WLC
  text: וַ֠/יֹּאמֶר מִ֣י שָֽׂמְ/ךָ֞ לְ/אִ֨ישׁ שַׂ֤ר וְ/שֹׁפֵט֙ עָלֵ֔י/נוּ הַ/לְ/הָרְגֵ֨/נִי֙ אַתָּ֣ה אֹמֵ֔ר כַּ/אֲשֶׁ֥ר הָרַ֖גְתָּ אֶת הַ/מִּצְרִ֑י וַ/יִּירָ֤א מֹשֶׁה֙ וַ/יֹּאמַ֔ר אָכֵ֖ן נוֹדַ֥ע הַ/דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/014.yaml
  text: But he said[a], “Who made you a ruler and a judge over us? Are you saying, ‘Will you kill me as you killed the Egyptian?’” Then Moses was afraid and said, “Surely the matter has become known.”
translation:
  language: ru
  text: 'Но тот ответил: «Кто поставил тебя начальником и судьёй над нами? Неужели ты намерен убить меня, как убил египтянина?» Моисей испугался и сказал: «Значит, об этом стало известно».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי שָׂמְךָ
  choice: Кто поставил тебя
  rationale: שׂים в данной формуле означает назначение или поставление на властное положение; «поставил» естественно и близко передаёт еврейский оборот.
- source_word: לְאִישׁ שַׂר וְשֹׁפֵט
  choice: начальником и судьёй
  rationale: אִישׁ здесь входит в аппозиционную конструкцию и не требует отдельного «мужчиной» в русском; שַׂר обозначает носителя власти, а «начальник» сохраняет немонархический смысл.
- source_word: עָלֵינוּ
  choice: над нами
  rationale: Предлог עַל выражает власть над говорящими.
- source_word: הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: Неужели ты намерен убить меня
  rationale: Буквальная структура «ты говоришь убить меня?» в контексте выражает намерение; русский вопрос с «неужели» естественно передаёт вызов и тревогу, не превращая оборот во вложенную прямую речь.
- source_word: כַּאֲשֶׁר הָרַגְתָּ אֶת־הַמִּצְרִי
  choice: как убил египтянина
  rationale: Прямая сравнительная конструкция; определённость египтянина ясна из контекста и в русском не требует артикля.
- source_word: וַיִּירָא מֹשֶׁה
  choice: Моисей испугался
  rationale: Естественная русская передача повествовательной формы глагола ירא.
- source_word: וַיֹּאמַר
  choice: и подумал
  rationale: Глагол אמר буквально значит «сказал», но без названного адресата здесь может обозначать внутреннюю речь; «подумал» естественно вводит последующее осознание Моисея.
- source_word: אָכֵן
  choice: Значит
  rationale: Частица выражает вывод и подтверждение при внезапном осознании; «значит» лучше передаёт здесь вывод, чем более торжественное «воистину».
- source_word: נוֹדַע הַדָּבָר
  choice: об этом стало известно
  rationale: Нифаль ידע указывает, что дело получило огласку; безличная русская конструкция звучит естественно и сохраняет смысл.
theological_decisions:
- issue: Передача לְאִישׁ в сочетании לְאִישׁ שַׂר וְשֹׁפֵט
  choice: не переводить אִישׁ отдельным словом
  alternative: «мужчиной, начальником и судьёй» или «человеком, начальником и судьёй»
  rationale: В еврейском אִישׁ служит частью именного оборота перед обозначениями должностей. Отдельное «мужчиной» в современном русском создало бы неуместный акцент на поле и исказило бы смысл вызова власти Моисея.
- issue: Значение הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: «Неужели ты намерен убить меня»
  alternative: '«Ты говоришь: „Убью тебя“?» / «Ты хочешь сказать, что убьёшь меня?»'
  rationale: Еврейский оборот допускает оттенки речи, намерения и угрозы. Основной текст передаёт контекстуальный смысл намерения, не утверждая, что Моисей действительно произнёс угрозу.
translation_notes:
  register: Современный литературный русский, ясный и достойный повествовательный стиль. Реплика звучит резко и естественно; архаизмы и конфессионально маркированная лексика не используются.
