  text: Then the shepherds came and drove them away[a], but Moses stood up and saved them, and watered their flock.
translation:
  language: ru
  text: Тогда пришли пастухи и прогнали их, но Моисей встал, спас их[a] и напоил их стадо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавил их». Еврейский глагол означает спасать или избавлять; здесь речь идёт о том, что Моисей избавил женщин от притеснения со стороны пастухов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Тогда пришли
  rationale: Форма wayyiqtol продолжает последовательность повествования; «тогда» естественно передаёт движение рассказа.
- source_word: הָרֹעִים
  choice: пастухи
  rationale: Субстантивированное причастие от רעה обозначает тех, кто пасёт стада; «пастухи» — точный и естественный русский эквивалент.
- source_word: וַיְגָרְשׁוּם
  choice: прогнали их
  rationale: Глагол גרש выражает изгнание или насильственное удаление; «прогнали» сохраняет враждебный характер действия.
- source_word: וַיָּקָם
  choice: встал
  rationale: קום здесь обозначает решительный переход Моисея к действию; буквальное «встал» естественно и выразительно по-русски.
- source_word: וַיּוֹשִׁעָן
  choice: защитил их
  rationale: Каузативная форма ישׁע означает спасение или избавление. В данном контексте «защитил» естественно передаёт избавление женщин от притеснения пастухов, не предполагая непременно смертельной опасности.
- source_word: וַיַּשְׁקְ
  choice: напоил
  rationale: Глагол שקה означает дать пить или напоить; применительно к стаду «напоил» — краткий и идиоматичный перевод.
- source_word: צֹאנָם
  choice: их стадо
  rationale: צאן — собирательное обозначение мелкого скота, овец и коз; «стадо» сохраняет обобщённость исходного слова.
theological_decisions:
- issue: Сила значения וַיּוֹשִׁעָן
  choice: защитил их
  alternative: спас их / избавил их
  rationale: Перевод сохраняет идею действенного избавления, но учитывает непосредственный контекст конфликта у колодца и не усиливает его до явно смертельной угрозы. Более формальное значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и динамичное. Сохранена последовательность действий и напряжение между буквальным значением глагола спасения и его конкретным смыслом в сцене у колодца.
