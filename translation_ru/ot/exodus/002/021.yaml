base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/021.yaml
  text: And Moses agreed to dwell with the man[b][a], and he gave Zipporah his daughter to Moses.
translation:
  language: ru
  text: Моисей согласился жить у этого человека[a], и тот отдал Моисею свою дочь Сепфору[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моисей был готов жить у этого человека». Еврейский глагол может выражать готовность, согласие или удовлетворённость таким решением.'
    reason: lexical_alternative
  - marker: b
    text: То есть отдал Сепфору Моисею в жёны.
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: согласился
  rationale: Глагол יאל здесь выражает согласие или готовность совершить действие. «Согласился» естественно сочетается с инфинитивом и сохраняет основной смысл формы.
- source_word: לָשֶׁבֶת
  choice: жить
  rationale: В данном контексте ישב обозначает проживание у человека, а не буквальное сидение. «Жить» — ясный и современный русский эквивалент.
- source_word: אֶת הָאִישׁ
  choice: у этого человека
  rationale: Сочетание передаёт пребывание вместе с упомянутым человеком. Указательное «этого» естественно отсылает к мадиамскому священнику из ближайшего контекста, не подставляя отсутствующее в стихе имя.
- source_word: וַיִּתֵּן
  choice: отдал
  rationale: נתן буквально означает «дал». В русском рассказе о браке «отдал ... свою дочь» звучит естественно и сохраняет подразумеваемый, но не выраженный отдельным словом брачный смысл.
- source_word: צִפֹּרָה
  choice: Сепфору
  rationale: Использована укоренившаяся в русской библейской традиции форма личного имени; падежная форма обусловлена синтаксисом предложения.
- source_word: בִּתּוֹ
  choice: свою дочь
  rationale: Возвратное притяжательное местоимение по нормам русского языка однозначно связывает дочь с подлежащим «тот».
- source_word: לְמֹשֶׁה
  choice: Моисею
  rationale: Предлог ל обозначает получателя; дательный падеж прямо передаёт эту функцию без внесения в основной текст дополнительных слов.
