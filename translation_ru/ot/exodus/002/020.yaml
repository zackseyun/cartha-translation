base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/020.yaml
  text: And he said to his daughters, “Then where is he? Why is it that you left the man? Call him, so that he may eat bread.”
translation:
  language: ru
  text: 'Он сказал своим дочерям: «Так где же он? Почему вы оставили этого человека? Позовите его, пусть он поест».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: Так где же он?
  rationale: Сочетание союза с вопросительным наречием передаёт живую реакцию отца; «так» и частица «же» естественно выражают связь с предыдущим рассказом и настойчивость вопроса.
- source_word: לָמָּה זֶּה
  choice: Почему
  rationale: Идиоматическое вопросительное сочетание естественно передаётся одним словом «почему»; указательный элемент здесь усиливает вопрос и не требует отдельного буквального соответствия.
- source_word: עֲזַבְתֶּן
  choice: вы оставили
  rationale: Сохранено прямое значение глагола и обращение к нескольким дочерям.
- source_word: קִרְאֶן לוֹ
  choice: Позовите его
  rationale: В данном контексте глагол означает пригласить или позвать человека прийти; местоименное дополнение естественно выражено винительным падежом.
- source_word: וְיֹאכַל לָחֶם
  choice: пусть он поест
  rationale: Юссивное значение передано конструкцией «пусть»; «есть хлеб» — древнееврейская идиома приёма пищи, поэтому в современном русском тексте выбрано естественное «поест».
