base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/009.yaml
  text: Then Pharaoh’s daughter said to her[a], “Take this child and nurse him for me, and I will give you your wages.” So the woman took the child and nursed him.
translation:
  language: ru
  text: 'Тогда дочь фараона сказала ей: «Возьми этого ребёнка и корми его грудью для меня, а я дам тебе плату». Женщина взяла ребёнка и кормила его грудью.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: дочь фараона
  rationale: Естественная русская передача сопряжённой конструкции, точно обозначающая говорящую.
- source_word: הֵילִיכִי
  choice: возьми
  rationale: Побудительная форма глагола הלך в данном контексте идиоматически означает взять ребёнка с собой и унести для вскармливания.
- source_word: הַיֶּלֶד הַזֶּה
  choice: этого ребёнка
  rationale: יֶלֶד обозначает ребёнка или мальчика; «ребёнка» не сужает значение и естественно звучит в контексте младенца.
- source_word: וְהֵינִקִהוּ לִי
  choice: и выкорми его для меня
  rationale: Глагол ינק в каузативной форме означает кормить грудью, вскармливать. «Выкорми» естественно передаёт поручение растить младенца посредством кормления грудью, а «для меня» сохраняет לִי.
- source_word: וַאֲנִי אֶתֵּן אֶת שְׂכָרֵךְ
  choice: а я заплачу тебе
  rationale: Идиоматическая русская передача буквального «я дам твою плату»; שָׂכָר означает плату за исполненную работу.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: Сохраняется обозначение исходного текста; хотя из контекста известно, что это мать ребёнка, здесь она прямо названа женщиной.
- source_word: וַתְּנִיקֵהוּ
  choice: и стала кормить его грудью
  rationale: Форма описывает последовавшее действие кормления младенца грудью. Явная формулировка по-русски устраняет возможную двусмысленность глагола «кормить».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; изложение ясное и dignified без архаизмов. В прямой речи «выкорми» передаёт длительное поручение, а в повествовании «стала кормить его грудью» точно называет начавшееся действие.
