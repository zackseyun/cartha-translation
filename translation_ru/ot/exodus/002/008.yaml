  text: Pharaoh’s daughter said to her, “Go.” So the young woman went and called the child’s mother.
translation:
  language: ru
  text: 'Дочь фараона сказала ей: «Иди». Девушка пошла и позвала мать ребёнка.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: дочь фараона
  rationale: Естественная русская передача конструкции сопряжённого состояния; точно обозначает дочь правителя, сохраняя лаконичность оригинала.
- source_word: לֵכִי
  choice: Иди
  rationale: Краткое повелительное наклонение женского рода единственного числа точно передаёт форму и прямоту еврейского текста.
- source_word: הָעַלְמָה
  choice: девушка
  rationale: עַלְמָה обозначает молодую женщину или девушку; «девушка» здесь естественно по-русски, соответствует контексту сестры Моисея и не вносит отсутствующего в тексте уточнения о брачном статусе.
- source_word: וַתִּקְרָא אֶת אֵם הַיָּלֶד
  choice: позвала мать ребёнка
  rationale: Глагол קרא с прямым дополнением здесь означает позвать или призвать. «Позвала» естественно передаёт действие без излишне официального оттенка слова «призвала».
- source_word: הַיָּלֶד
  choice: ребёнка
  rationale: יֶלֶד допускает значения «ребёнок» и «мальчик»; в данном контексте «ребёнок» точно и естественно обозначает младенца Моисея, не усиливая конкретизацию оригинала.
