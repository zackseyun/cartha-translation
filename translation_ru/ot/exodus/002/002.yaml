  rationale: Глагол הרה обозначает зачатие или наступление беременности. «Забеременела» — ясный и естественный современный русский эквивалент.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: В еврейском тексте прямо сказано «женщина»; вариант «его жена» зависел бы от контекста и добавлял бы отсутствующее здесь обозначение отношений.
- source_word: וַתֵּלֶד בֵּן
  choice: родила сына
  rationale: Это естественная русская передача обычного еврейского выражения о рождении ребёнка мужского пола.
- source_word: וַתֵּרֶא אֹתוֹ כִּי טוֹב הוּא
  choice: увидев, что он хорош
  rationale: Деепричастная конструкция естественно передаёт последовательность повествования и связь между тем, что мать увидела в ребёнке, и последующим действием, не меняя содержания её оценки.
- source_word: כִּי טוֹב הוּא
  choice: что он хорош
  rationale: טוֹב прежде всего значит «хороший, добрый, прекрасный». «Он хорош» сохраняет широкое значение еврейского слова и возможную перекличку с Быт 1, не сводя оценку только к внешней красоте.
- source_word: וַתִּצְפְּנֵהוּ
  choice: она прятала его
  rationale: צפן означает «прятать, скрывать». Несовершенный вид «прятала» естественно выражает продолжавшееся в течение трёх месяцев сокрытие ребёнка.
- source_word: שְׁלֹשָׁה יְרָחִים
  choice: три месяца
  rationale: יֶרַח обозначает месяц, исторически лунный; в обычном повествовании естественно и достаточно сказать «три месяца».
theological_decisions:
- issue: Оценка младенца словом טוֹב
  choice: хорош
  alternative: красив; прекрасен
  rationale: Основное значение טוֹב — «хорош». Такая передача сохраняет смысловую широту и возможную литературную перекличку с формулами Быт 1. Эстетическое понимание «красив» возможно и отражено в последующей традиции, но оно более конкретно, чем сам еврейский текст, поэтому вынесено в сноску.
