  yaml_path: translation/ot/exodus/002/015.yaml
  text: When Pharaoh heard this matter[a], he sought to kill Moses. But Moses fled from Pharaoh and stayed in the land of Midian[b], and he sat down by the well.
translation:
  language: ru
  text: Когда фараон услышал об этом деле[a], он стал искать возможности убить Моисея. Но Моисей бежал от фараона, поселился в земле Мадиамской[b] и сел у колодца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально: «услышал это дело»; в данном контексте: «услышал об этом происшествии» или «узнал об этом».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте дважды употреблён один и тот же глагол: сначала в значении «поселился, жил» в Мадиаме, затем — «сел» у колодца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал
  rationale: Сохраняет основное значение שׁמע; сочетание «услышал об этом деле» естественно передаёт то, что фараону стало известно о происшествии.
- source_word: הַדָּבָר הַזֶּה
  choice: об этом деле
  rationale: דבר здесь обозначает упомянутое происшествие — убийство египтянина, — но перевод не уточняет его сверх сказанного в источнике.
- source_word: וַיְבַקֵּשׁ לַהֲרֹג
  choice: стал искать случая убить
  rationale: Передаёт בקש с инфинитивом как целенаправленное стремление совершить действие, не сводя выражение лишь к внутреннему желанию и не утверждая уже предпринятую попытку.
- source_word: וַיִּבְרַח ... מִפְּנֵי
  choice: бежал от
  rationale: Естественный русский эквивалент выражения «бежать от лица/присутствия» кого-либо.
- source_word: וַיֵּשֶׁב בְּאֶרֶץ מִדְיָן
  choice: поселился в земле Мадиамской
  rationale: Первое ישׁב в данном контексте обозначает пребывание или проживание в стране; «поселился» точно и естественно передаёт этот смысл.
- source_word: וַיֵּשֶׁב עַל הַבְּאֵר
  choice: сел у колодца
  rationale: Второе ישׁב имеет конкретный смысл «сел»; עַל при колодце естественно передаётся как «у».
- source_word: הַבְּאֵר
  choice: колодца
  rationale: Определённость еврейского существительного в русском повествовании естественно выражается контекстом без отдельного артикля.
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Устоявшаяся русская передача царского титула.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: מִדְיָן
  choice: Мадиамская
  rationale: Устоявшаяся русская библейская форма топонима в сочетании «земля Мадиамская».
