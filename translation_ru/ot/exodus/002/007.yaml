  rationale: 'Исправлены два смысловых нюанса: нейтральное «пойти» вместо «сходить» и несовершенное «кормила ребёнка грудью» вместо результативного «вскормила». Добавлено примечание к «кормилица», отражающее буквальную лексическую формулировку оригинала и английскую аудиторскую запись.'
