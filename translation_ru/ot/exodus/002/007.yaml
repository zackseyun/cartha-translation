base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/007.yaml
  text: Then his sister said to Pharaoh’s daughter[a], “Shall I go and call a nursing woman from the Hebrew women for you, so that she may nurse the child for you?”
translation:
  language: ru
  text: 'Тогда его сестра сказала дочери фараона: «Не пойти ли мне и не позвать ли для тебя кормилицу[a] из евреек, чтобы она кормила ребёнка грудью?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «женщину из евреек, кормящую грудью».'
    reason: Лексическая альтернатива для אִשָּׁה מֵינֶקֶת; основное «кормилица» идиоматично, а примечание передаёт более буквальное описание.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Тогда ... сказала
  rationale: Форма с повествовательным וַ последовательно развивает рассказ; «тогда» естественно передаёт переход к следующему действию.
- source_word: אֲחֹתוֹ
  choice: его сестра
  rationale: Местоименный суффикс мужского рода единственного числа относится по контексту к ребёнку; перевод сохраняет ту же неявную соотнесённость.
- source_word: בַּת פַּרְעֹה
  choice: дочери фараона
  rationale: Естественная русская передача древнееврейской сопряжённой конструкции.
- source_word: הַאֵלֵךְ וְקָרָאתִי
  choice: Не сходить ли мне и не позвать ли
  rationale: Вопросительная форма выражает вежливое предложение; русская конструкция с «не ... ли» естественно сохраняет этот оттенок.
- source_word: אִשָּׁה מֵינֶקֶת
  choice: кормилицу
  rationale: В контексте речь о женщине, кормящей грудью чужого младенца; «кормилица» — точное, понятное и стилистически уместное русское обозначение.
- source_word: מִן הָעִבְרִיֹּת
  choice: из евреек
  rationale: Предлог указывает на выбор женщины из числа еврейских женщин; краткая русская форма точно передаёт смысл.
- source_word: וְתֵינִק
  choice: чтобы она вскормила
  rationale: Каузативная форма ינק означает кормление грудью; после предложения естественно передать её как цель. «Вскормила» отличает действие кормилицы от общего ухода или питания.
- source_word: הַיָּלֶד
  choice: ребёнка
  rationale: Слово обозначает ребёнка; контекст уже показывает, что это младенец мужского пола, поэтому дополнительное уточнение не требуется.
