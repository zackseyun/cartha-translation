base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/003.yaml
  text: But when she could no longer hide him[a], she took for him a papyrus basket and coated it with bitumen and pitch. Then she put the child in it and placed it among the reeds by the bank of the Nile.
translation:
  language: ru
  text: Но когда она уже не могла скрывать его, то взяла для него корзину из папируса[a], обмазала её битумом и смолой, положила в неё ребёнка и поставила среди тростника у берега Нила.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ковчежец из папируса». Еврейское слово «тева» — то же слово, которым назван Ноев ковчег в книге Бытие; так возникает литературная перекличка со спасением через воду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִינוֹ
  choice: скрывать его
  rationale: Инфинитив породы hифиль от צפן с местоименным суффиксом означает «скрывать его»; несовершенный вид естественно сочетается с выражением предела возможности «уже не могла».
- source_word: תֵּבַת גֹּמֶא
  choice: корзинку из папируса
  rationale: תֵּבָה обозначает вместилище или плавучий ящик, а גֹּמֶא — папирус. В данном контексте «корзинка» естественно описывает небольшой сосуд для младенца, тогда как сноска сохраняет значимую связь с ковчегом Ноя.
- source_word: וַתַּחְמְרָה בַחֵמָר
  choice: обмазала её битумом
  rationale: Глагол означает нанесение обмазки, а חֵמָר — природный битум; «обмазала битумом» точно передаёт способ гидроизоляции.
- source_word: וּבַזָּפֶת
  choice: и смолой
  rationale: זֶפֶת обозначает смолистый гидроизоляционный материал. «Смола» — понятный современному русскому читателю эквивалент, не сливающий его полностью с битумом.
- source_word: הַיֶּלֶד
  choice: ребёнка
  rationale: יֶלֶד означает ребёнка или мальчика; «ребёнок» сохраняет степень конкретности исходного текста, не подменяя слово более возрастным «младенец».
- source_word: בַּסּוּף
  choice: среди тростника
  rationale: סוּף здесь обозначает прибрежные заросли тростника или камыша; «среди тростника» естественно выражает помещение внутрь растительности.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: у берега Нила
  rationale: Буквально «на краю/берегу реки»; в египетском контексте יְאֹר относится к Нилу. Русское «у берега Нила» ясно и идиоматично.
- source_word: לֹא יָכְלָה עוֹד
  choice: уже не могла
  rationale: Оборот выражает достигнутый предел возможности; «уже не могла» кратко и естественно передаёт его по-русски.
- source_word: לּוֹ
  choice: для него
  rationale: 'Дательный суффикс сохранён явно: корзинка была приготовлена для ребёнка.'
theological_decisions:
- issue: Литературная связь תֵּבָה с рассказом о Ное
  choice: В основном тексте употреблено «корзинка», а связь с «ковчегом» отмечена в сноске.
  alternative: Перевести в основном тексте «ковчег из папируса».
  rationale: «Корзинка» ясно передаёт предмет в непосредственном контексте, но редкое слово תֵּבָה употреблено также для Ноева ковчега и создаёт намеренное повествовательное эхо спасения через воду; сноска позволяет его не утратить.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно-достоинственный. «Корзинка» выбрана для естественности и соответствия малому размеру предмета; уменьшительная форма здесь обозначает размер, а не эмоциональную оценку. Синтаксис сохраняет последовательность действий исходного текста без излишней архаизации.
