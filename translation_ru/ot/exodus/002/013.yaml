base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/013.yaml
  text: He went out the next day[a], and behold, two Hebrew men were fighting. And he said to the wicked one[b], “Why are you striking your companion?”
translation:
  language: ru
  text: 'На следующий день он вышел, и вот — двое евреев дерутся. Он сказал тому, кто был неправ[a]: «Почему ты бьёшь своего ближнего[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «виновному»; возможен и более сильный перевод: «нечестивцу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «своего товарища», «своего соплеменника».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: он вышел
  rationale: Форма qal wayyiqtol от יצא передаёт последовательное повествовательное действие. Подлежащее «он» восстанавливается из контекста и относится к Моисею.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: на следующий день
  rationale: Буквально «во второй день»; в данном повествовательном контексте естественное русское соответствие — «на следующий день».
- source_word: וְהִנֵּה
  choice: и вот
  rationale: 'Сохраняет функцию הִנֵּה: живо представляет внезапно замеченную сцену, не сводя выражение к нейтральному «увидел».'
- source_word: שְׁנֵי אֲנָשִׁים עִבְרִים
  choice: двое евреев
  rationale: Русское собирательное числительное «двое» ясно указывает на двух мужчин; «евреев» сохраняет этническое обозначение, не требуя тяжеловесного «двое мужчин-евреев».
- source_word: נִצִּים
  choice: дерутся
  rationale: Причастная форма обозначает продолжающееся столкновение; настоящее время после «и вот» живо передаёт наблюдаемую сцену. Последующий вопрос об ударе подтверждает физический характер конфликта.
- source_word: לָרָשָׁע
  choice: тому, кто был неправ
  rationale: В контексте конкретной ссоры רָשָׁע обозначает сторону, поступающую неправильно, или виновника. Такой перевод выражает ситуативную нравственную оценку, не превращая её без необходимости в характеристику всей личности.
- source_word: לָמָּה תַכֶּה
  choice: Почему ты бьёшь
  rationale: Настоящее время несовершенного вида естественно передаёт продолжающееся действие, о котором Моисей спрашивает в момент столкновения.
- source_word: רֵעֶךָ
  choice: своего ближнего
  rationale: רֵעַ может означать ближнего, товарища или другого человека из той же общности. «Ближний» здесь краток, достоин по стилю и не утверждает личной дружбы между участниками.
theological_decisions:
- issue: Характер оценки לָרָשָׁע
  choice: тому, кто был неправ
  alternative: нечестивцу / виновному
  rationale: Контекст позволяет как более сильную нравственную характеристику, так и указание на неправую сторону в данной ссоре. Основной текст сохраняет ситуативный смысл, а сноска отмечает более резкие возможные соответствия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Оборот «и вот» и тире сохраняют живость древнееврейского представления сцены; лексика остаётся понятной широкому читателю.
