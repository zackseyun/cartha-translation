base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/023.yaml
  text: It happened in those many days that the king of Egypt died[a], and the sons of Israel groaned because of the slavery and cried out[c][b], and their cry for help went up to God because of the slavery.
translation:
  language: ru
  text: Прошло много дней[a], и умер царь Египта. Сыны Израиля[b] стонали из-за рабского труда[c] и закричали, и их вопль о помощи поднялся к Богу из-за рабского труда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в те многие дни»; возможно также: «за то долгое время» или, более истолковательно, «спустя много времени».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «сыны Израиля» здесь обозначает весь народ Израиля.
    reason: lexical_alternative
  - marker: c
    text: 'В данном контексте еврейское слово означает тяжёлый принудительный труд в условиях рабства; возможно также перевести: «из-за подневольного труда» или «из-за рабства».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: В те долгие дни
  rationale: Начальная повествовательная конструкция вводит новое событие; по-русски её функция естественно передаётся временным оборотом без архаичного «и было».
- source_word: בַיָּמִים הָרַבִּים הָהֵם
  choice: в те долгие дни
  rationale: Сохраняется образ продолжительного периода и указательное «те», без превращения оборота в точную хронологическую отметку.
- source_word: וַיָּמָת מֶלֶךְ מִצְרַיִם
  choice: умер царь Египта
  rationale: Прямое и естественное повествовательное соответствие.
- source_word: וַיֵּאָנְחוּ
  choice: стонали
  rationale: Глагол выражает слышимое проявление тяжёлого страдания; «стонали» передаёт его весомее, чем нейтральное «вздыхали».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняется форма еврейского этнонима; примечание поясняет его коллективное значение.
- source_word: מִן הָעֲבֹדָה
  choice: из-за рабского труда
  rationale: Предлог передан причинно, а עֲבֹדָה в данном контексте обозначает принудительный труд в условиях рабства. Повтор выражения сохранён.
- source_word: וַיִּזְעָקוּ
  choice: взывали
  rationale: Передаёт сильный крик, вызванный бедствием, не добавляя прямо названного адресата, которого в этой части фразы нет.
- source_word: וַתַּעַל שַׁוְעָתָם
  choice: их крик о помощи поднялся
  rationale: «Крик о помощи» раскрывает значение שַׁוְעָה, а «поднялся» сохраняет пространственную метафору оригинала.
- source_word: אֶל הָאֱלֹהִים
  choice: к Богу
  rationale: Естественное русское соответствие без ненужного смыслового расширения.
theological_decisions:
- issue: Значение עֲבֹדָה в условиях египетского угнетения
  choice: рабский труд
  alternative: труд; служба; рабство
  rationale: Контекст указывает на принудительный труд порабощённого народа. «Рабский труд» одновременно сохраняет трудовой оттенок слова и ясно передаёт угнетение, не сводя термин только к общественному статусу.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Форма оригинала сохранена, но примечание предупреждает, что выражение обозначает народ Израиля в целом, а не исключительно мужчин.
- issue: К кому направлен первоначальный вопль
  choice: не называть адресата при «взывали»
  alternative: взывали к Богу
  rationale: В первой глагольной форме адресат прямо не указан; только следующая часть сообщает, что крик поднялся к Богу. Перевод сохраняет эту последовательность и не разрешает возможную неоднозначность раньше текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Избегаются архаическое «и было» и чрезмерно разговорные обороты. Повтор «из-за рабского труда» намеренно сохранён как риторическое обрамление еврейского текста.
