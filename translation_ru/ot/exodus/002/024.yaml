base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/024.yaml
  text: God heard their groaning[a], and God remembered his covenant with Abraham, with Isaac[b], and with Jacob.
translation:
  language: ru
  text: Бог услышал их стоны[a] и вспомнил[b] свой завет с Авраамом, с Исааком и с Иаковом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их стон». Еврейское существительное может обозначать стон или мучительный крик под гнётом.'
    reason: lexical_alternative
  - marker: b
    text: 'Здесь «вспомнил» — язык завета: это не означает, что Бог прежде забыл о нём, но указывает на то, что Бог в верности обратился к исполнению обязательств завета.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал
  rationale: Глагол שׁמע в данной повествовательной форме естественно означает «услышал»; в центре внимания то, что Бог воспринял вопль страдающих.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Хотя существительное имеет морфологически множественную форму, здесь оно согласуется с глаголами в единственном числе и обозначает единого Бога Израиля.
- source_word: נַאֲקָתָם
  choice: их стоны
  rationale: Слово נַאֲקָה обозначает стон или мучительный крик угнетённых. Множественное число по-русски естественно передаёт совокупное и продолжающееся страдание народа.
- source_word: וַיִּזְכֹּר
  choice: вспомнил
  rationale: Сохранено прямое значение глагола זכר. В контексте завета оно предполагает последующее верное действие, но это следствие не следует вносить в основной текст как пояснительный пересказ.
- source_word: בְּרִיתוֹ
  choice: свой завет
  rationale: בְּרִית — обычное обозначение завета; местоимение «свой» естественно передаёт принадлежность завета Богу.
- source_word: אֶת אַבְרָהָם אֶת יִצְחָק וְאֶת יַעֲקֹב
  choice: с Авраамом, с Исааком и с Иаковом
  rationale: Предлог «с» необходим в русском после слова «завет». Его повторение перед каждым именем отражает подчёркнутый ритм еврейского текста и остаётся естественным.
theological_decisions:
- issue: Антропоморфный оборот «Бог вспомнил»
  choice: Сохранить «вспомнил» в основном тексте и пояснить его заветный смысл в сноске.
  alternative: «Бог обратился к своему завету» или «Бог начал действовать согласно своему завету».
  rationale: Еврейский текст сохраняет обычный антропоморфный язык завета. Пересказ через «начал действовать» преждевременно разрешил бы заключённое в выражении богословское напряжение; «вспомнил» указывает не на прежнюю забывчивость, а на верность завету.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и торжественным звучанием. Синтаксис близок к еврейскому, но естественен по-русски; повтор предлога «с» сохраняет ритм и выделяет каждого из праотцов.
