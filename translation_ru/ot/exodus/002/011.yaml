base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/011.yaml
  text: It happened in those days[a], when Moses had grown up, that he went out to his brothers and saw their burdens. And he saw an Egyptian man striking a Hebrew man, one of his brothers.
translation:
  language: ru
  text: И было в те дни, когда Моисей вырос, что он вышел к своим братьям[a] и увидел их тяготы. И увидел он египтянина, бьющего еврея — одного из братьев Моисея.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соплеменникам»; далее — «одного из его соплеменников». В еврейском тексте буквально говорится о «братьях», что подчёркивает единство Моисея с евреями.'
    reason: Лексическая альтернатива и пояснение родственного языка оригинала.
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: И было в те дни
  rationale: Сохраняет еврейскую повествовательную формулу и её связующую функцию, не прибегая к архаичному «и случилось» или к добавлению отсутствующего в оригинале слова «однажды».
- source_word: וַיִּגְדַּל
  choice: вырос
  rationale: В данном контексте глагол указывает на взросление Моисея, а не на приобретение величия или высокого положения.
- source_word: אֶל אֶחָיו
  choice: к своим братьям
  rationale: Буквально передаёт родственный язык оригинала и подчёркивает солидарность Моисея с евреями; «своим» естественно указывает на принадлежность к его народу.
- source_word: בְּסִבְלֹתָם
  choice: их тяжкий труд
  rationale: В контексте речь идёт о тяготах подневольного труда. Формулировка понятна современному читателю, сохраняя тяжесть положения без излишней конкретизации.
- source_word: אִישׁ מִצְרִי
  choice: египтянин
  rationale: Субстантивированное обозначение национальности естественно по-русски и достаточно передаёт сочетание «мужчина-египтянин».
- source_word: מַכֶּה
  choice: бьёт
  rationale: Передаёт продолжающееся физическое действие причастия, не усиливая его до более интерпретирующего «избивает».
- source_word: אִישׁ עִבְרִי
  choice: еврея
  rationale: Естественное русское обозначение сохраняет противопоставление египтянина и еврея; отдельное слово «мужчину» здесь было бы тяжеловесно.
- source_word: מֵאֶחָיו
  choice: одного из его братьев
  rationale: Сохраняет повтор родственного термина и связь с первым упоминанием «братьев», не заменяя его толкованием «соплеменников».
theological_decisions:
- issue: Передача родственного языка אֶחָיו / מֵאֶחָיו
  choice: братья
  alternative: соплеменники / его народ
  rationale: Оригинал дважды использует буквальное родственное обозначение, выражая принадлежность и солидарность Моисея с евреями. Перевод сохраняет этот образ, а возможное более широкое значение разъясняется в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным началом. Краткие формы «египтянин» и «еврей» естественны для русского языка; повтор «увидел» сохранён вслед за еврейским текстом.
