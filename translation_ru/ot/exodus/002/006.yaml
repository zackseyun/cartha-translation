  terminology: «Ребёнок» для הַיֶּלֶד, «мальчик» для נַעַר, «сжалилась над ним» для וַתַּחְמֹל עָלָיו и «еврейских детей» для יַלְדֵי הָעִבְרִים точны и стилистически уместны. Конфессионально нагруженной терминологии нет.
