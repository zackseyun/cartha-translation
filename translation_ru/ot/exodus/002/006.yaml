  yaml_path: translation/ot/exodus/002/006.yaml
  text: She opened it and saw him[a], the child, and behold, a boy was crying. She had compassion on him and said[c][b], “This is one of the Hebrews’ children.”
translation:
  language: ru
  text: 'Она открыла её и увидела ребёнка — и вот, мальчик плакал. Она сжалилась над ним и сказала: «Это один из еврейских детей».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּפְתַּח
  choice: Она открыла её
  rationale: Глагол означает «открыла»; местоимение «её» естественно восстанавливает из контекста корзинку, названную в предыдущем стихе.
- source_word: וַתִּרְאֵהוּ אֶת־הַיֶּלֶד
  choice: и увидела ребёнка
  rationale: Местоименный суффикс мужского рода предваряет уточняющее дополнение «ребёнка». По-русски единое «увидела ребёнка» передаёт референт без неестественного повтора «увидела его, ребёнка».
- source_word: וְהִנֵּה
  choice: —
  rationale: Частица привлекает внимание к внезапно представшей картине. В современном русском её функцию естественно передают интонационный перелом и тире, без архаического «вот» или «и вот».
- source_word: נַעַר בֹּכֶה
  choice: мальчик плакал
  rationale: נַעַר здесь обозначает младенца мужского пола, а причастие передаёт продолжающееся в момент обнаружения действие.
- source_word: וַתַּחְמֹל עָלָיו
  choice: Она сжалилась над ним
  rationale: חמל с עַל выражает жалость и сострадание; «сжалилась» точно и естественно передаёт эмоциональную реакцию, не добавляя последующего решения пощадить.
- source_word: מִיַּלְדֵי הָעִבְרִים זֶה
  choice: Это один из еврейских детей
  rationale: Конструкция с מִן имеет партитивное значение — «один из». «Еврейских детей» естественно передаёт этническое обозначение הָעִבְרִים в данном контексте.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранено различие между общим «ребёнок» (יֶלֶד) и указанием пола «мальчик» (נַעַר); еврейская зрительная частица передана пунктуационно, чтобы избежать ненужной архаизации.
