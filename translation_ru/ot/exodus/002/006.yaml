  source_fidelity: 'Основной смысл передан верно: открытие корзинки, обнаружение ребёнка, его плач, жалость дочери фараона и опознание ребёнка как еврейского сохранены. Однако וְהִנֵּה — выразительная частица, вводящая неожиданно увиденную картину, — не должна полностью растворяться в тире; одной пунктуации для этого недостаточно.'
