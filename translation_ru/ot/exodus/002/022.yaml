  yaml_path: translation/ot/exodus/002/022.yaml
  text: She gave birth to a son[a], and he called his name Gershom, for he said[b], “I have been a sojourner in a foreign land.”
translation:
  language: ru
  text: 'Она родила сына, и он дал ему имя Гирсам[a], потому что сказал: «Я был пришельцем в чужой земле».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Гирсам» созвучно еврейскому выражению «пришелец там» и связано с объяснением имени, данным Моисеем.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד בֵּן
  choice: Она родила сына
  rationale: 'Прямо и естественно передаёт еврейскую формулу рождения: ילד в породе qal означает «родить», а בֵּן — «сын».'
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: и он дал ему имя
  rationale: Естественный современный русский эквивалент буквального «назвал его имя»; сохраняет формулу наречения имени и мужской род подлежащего.
- source_word: גֵּרְשֹׁם
  choice: Гирсам
  rationale: Традиционная русская форма библейского личного имени, соответствующая еврейскому גֵּרְשֹׁם.
- source_word: כִּי אָמַר
  choice: потому что сказал
  rationale: כִּי вводит объяснение наречения имени; «потому что» ясно выражает причинно-пояснительную связь.
- source_word: גֵּר
  choice: пришелец
  rationale: Передаёт положение человека, живущего не среди своего народа и не на своей земле. Слово сохраняет библейское достоинство стиля и точнее, чем общее «иностранец», выражает проживание на чужбине.
- source_word: הָיִיתִי
  choice: я был
  rationale: Простое прошедшее время непосредственно передаёт перфект первого лица; контекст допускает также понимание состояния, продолжающегося к моменту наречения имени.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: в чужой земле
  rationale: Точно и естественно передаёт נָכְרִיָּה как землю, не принадлежащую говорящему и не являющуюся его родиной.
theological_decisions:
- issue: Временной оттенок הָיִיתִי
  choice: «Я был пришельцем»
  alternative: «Я стал пришельцем»
  rationale: Еврейский перфект обозначает состоявшийся факт, но сам по себе не требует явно начинательного значения «стал»; альтернативу следует сохранить в примечании.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Пришелец» сохраняет смысл проживания на чужбине без архаической перегруженности; синтаксис остаётся ясным и близким к еврейскому оригиналу.
