lexical_decisions:
- source_word: עֲנוֹת / עַנּוֹת
  choice: возглас / вопль / пение
  rationale: Во всех трёх случаях речь идёт о производимом людьми звуке. В первых двух параллельных оборотах сочетание с победой и поражением указывает на боевой возглас или вопль. В последнем обороте контекст празднества у тельца допускает значение пения, однако еврейская форма неоднозначна, что отражено в сноске.
- source_word: גְּבוּרָה
  choice: победа
  rationale: Хотя слово обычно означает силу или доблесть, в противопоставлении к поражению обозначает победу как повод для торжествующего возгласа.
- source_word: חֲלוּשָׁה
  choice: поражение
  rationale: Буквально слово связано со слабостью, но в военном противопоставлении обозначает положение побеждённых.
- source_word: קוֹל
  choice: возглас / вопль / звуки
  rationale: קוֹל имеет широкий диапазон — «голос, звук, шум». Контекстуально разные русские соответствия создают естественную фразу, не меняя общего образа слышимого человеческого звучания.
- source_word: אֵין
  choice: это не
  rationale: Так по-русски естественно передаётся повторная отрицательная конструкция «не звук… и не звук…».
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: я слышу
  rationale: Местоимение с причастием выражает непосредственное восприятие в настоящем времени.
- source_word: וַיֹּאמֶר
  choice: И он сказал
  rationale: Сохранена обычная последовательность еврейского повествования без добавления имени, отсутствующего в стихе.
