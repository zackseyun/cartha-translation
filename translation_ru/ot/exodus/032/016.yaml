  terminology: «Дело Бога» точно сохраняет номинальную конструкцию מַעֲשֵׂה אֱלֹהִים. «Надпись Бога» сохраняет повтор существительного в הַמִּכְתָּב / מִכְתַּב אֱלֹהִים и не превращает его в глагольную конструкцию. «Высеченная» точно передаёт חָרוּת в контексте скрижалей.
