base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/016.yaml
  text: The tablets were the work of God[a], and the writing was the writing of God, engraved on the tablets.
translation:
  language: ru
  text: Скрижали были делом Бога, и надпись была надписью Бога, высеченной на скрижалях.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַלֻּחֹת
  choice: скрижали
  rationale: В контексте речь идёт о скрижалях завета; традиционное русское слово «скрижали» точно и естественно передаёт לֻחֹת, не добавляя отсутствующее в данном стихе определение «каменные».
- source_word: מַעֲשֵׂה אֱלֹהִים
  choice: делом Бога
  rationale: Сохраняет именную конструкцию «дело Бога» и прямое отнесение самих скрижалей к Божьему действию.
- source_word: הַמִּכְתָּב
  choice: начертанное
  rationale: Передаёт написанное или надпись как результат письма и позволяет по-русски сохранить родственное повторение со следующим оборотом.
- source_word: מִכְתַּב אֱלֹהִים
  choice: начертанием Бога
  rationale: Сохраняет подчёркнутое повторение еврейского существительного и не превращает именную конструкцию в более толковательное «написано Богом».
- source_word: חָרוּת
  choice: высеченным
  rationale: Причастие обозначает вырезанную, выгравированную надпись; «высеченным» естественно описывает начертание на каменных скрижалях.
- source_word: עַל הַלֻּחֹת
  choice: на скрижалях
  rationale: Прямо передаёт местное значение предлога עַל.
- source_word: וְ
  choice: и
  rationale: Начальный וְ связывает стих с повествованием; отдельный временной маркер вроде «теперь» в источнике отсутствует, а второе וְ естественно передаётся союзом «и».
theological_decisions:
- issue: Принадлежность и происхождение скрижалей и начертания
  choice: 'Обе именные конструкции сохранены: скрижали названы «делом Бога», а начертанное — «начертанием Бога».'
  alternative: «Скрижали были сделаны Богом, и надпись была написана Богом».
  rationale: Еврейский текст прямо относит к Богу и сами скрижали, и начертание, но делает это посредством именных конструкций. Их сохранение удерживает акцент и не уточняет способ Божьего действия сверх текста.
translation_notes:
  register: Современный литературный русский язык с уместной для библейского повествования торжественностью. «Скрижали» сохранено как общеупотребительное библейское обозначение; синтаксис следует параллелизму и повтору оригинала без добавочного вводного «теперь».
