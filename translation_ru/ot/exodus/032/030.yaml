  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ/עָ֔ם אַתֶּ֥ם חֲטָאתֶ֖ם חֲטָאָ֣ה גְדֹלָ֑ה וְ/עַתָּה֙ אֶֽעֱלֶ֣ה אֶל יְהוָ֔ה אוּלַ֥י אֲכַפְּרָ֖ה בְּעַ֥ד חַטַּאתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/030.yaml
  text: And it happened on the next day that Moses said to the people[a], “You have sinned a great sin. And now I will go up to Yahweh; perhaps I can make atonement for your sin.”
translation:
  language: ru
  text: 'На следующий день Моисей сказал народу: «Вы совершили великий грех.[a] Теперь я взойду к Яхве; может быть, я смогу совершить искупление за ваш грех».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вы согрешили великим грехом»; однокоренная конструкция в еврейском языке подчёркивает тяжесть этого греха.'
    reason: Пояснение сохранённого в переводе усилительного смысла еврейской однокоренной конструкции.
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: На следующий день
  rationale: Естественно передаёт переход к следующему событию и его время; отдельное «и случилось» в современном русском здесь избыточно.
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל הָעָם
  choice: Моисей сказал народу
  rationale: Прямой и идиоматичный эквивалент обычной формулы речи אמר с אל.
- source_word: אַתֶּם חֲטָאתֶם חֲטָאָה גְדֹלָה
  choice: Вы совершили великий грех
  rationale: Начальное «вы» сохраняет акцент явного местоимения; «совершили великий грех» естественно по-русски передаёт однокоренную усилительную конструкцию.
- source_word: וְעַתָּה
  choice: Теперь
  rationale: Отмечает переход от обвинения к намерению Моисея; бессоюзное русское предложение звучит естественно, сохраняя связь по смыслу.
- source_word: אֶעֱלֶה אֶל יְהוָה
  choice: я взойду к Яхве
  rationale: «Взойду» уместно для движения на гору и сохраняет возвышенный, но современный библейский регистр; имя יהוה передано транслитерацией «Яхве».
- source_word: אוּלַי אֲכַפְּרָה
  choice: может быть, мне удастся совершить искупление
  rationale: Сохраняет выраженные אוּלַי надежду и неопределённость, не превращая слова Моисея в обещание; כפר передано установившимся богословским термином без уточнения механизма искупления.
- source_word: בְּעַד חַטַּאתְכֶם
  choice: за ваш грех
  rationale: Кратко и естественно передаёт направленность действия в пользу виновных применительно к их греху.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; «Яхве» передаёт его как имя, а не заменяет титулом.
- issue: Степень уверенности Моисея в искуплении
  choice: может быть, мне удастся совершить искупление
  alternative: может быть, я искуплю; может быть, я смогу искупить
  rationale: Формулировка сохраняет надежду и неопределённость אוּלַי и не утверждает заранее ни успеха ходатайства, ни самостоятельной действенности Моисея.
- issue: Значение אֲכַפְּרָה
  choice: совершить искупление
  alternative: умилостивить; получить прощение
  rationale: «Совершить искупление» сохраняет широту культового и ходатайственного значения כפר, не сводя его только к умилостивлению или результату в виде прощения.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сделан естественным для обычного читателя; «взойду», «Яхве» и «совершить искупление» сохраняют торжественный и богословски точный регистр без архаизации.
