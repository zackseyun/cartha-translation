- source_word: הָעָם בְּרֵעֹה
  choice: народа и его крики
  rationale: Выражение передаёт громкие возгласы народа; местоимение в единственном числе согласуется с собирательным существительным «народ». Русская формулировка сохраняет собирательность и звучит естественно.
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: он сказал Моисею
  rationale: Естественная русская передача стандартной повествовательной формулы.
- source_word: קוֹל מִלְחָמָה
  choice: шум битвы
  rationale: Сочетание буквально означает «звук/шум войны». В непосредственной сцене «битва» естественнее по-русски и передаёт восприятие Иисуса Навина как шума сражения.
- source_word: בַּמַּחֲנֶה
  choice: в стане
  rationale: «Стан» — краткое, достоинственное и общеупотребительное в библейском контексте обозначение лагеря народа.
