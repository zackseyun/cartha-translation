base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/010.yaml
  text: Now leave me alone[a], so that my anger may burn against them and I may consume them[b]; and I will make you into a great nation.
translation:
  language: ru
  text: Итак, оставь Меня в покое[a], чтобы Мой гнев воспылал против них и Я истребил их[b]; а из тебя Я сделаю великий народ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дай Мне быть».'
    reason: Лексическая альтернатива для הַנִּיחָה לִּי передаёт смысл «оставь Меня в покое», не истолковывая повеление как указание Моисею перестать ходатайствовать.
  - marker: b
    text: 'Или: «и Я уничтожу их».'
    reason: כלה в пиэле может обозначать полное уничтожение, прекращение; альтернатива передаёт тот же судебный смысл без образного оттенка «истреблю».
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительный וְ и передаёт וְעַתָּה как переход к непосредственному повелению в ходе речи.
- source_word: הַנִּיחָה לִּי
  choice: оставь Меня
  rationale: В данном идиоматическом употреблении каузативная форма от נוח означает позволить кому-либо быть или действовать без удерживания. Краткая русская формулировка сохраняет прямую силу повеления, не объясняя его возможную риторическую функцию.
- source_word: וְיִחַר אַפִּי
  choice: чтобы Мой гнев воспылал
  rationale: Идиома חרה אף изображает гнев как разгорающийся. «Воспылал» сохраняет образ и естественно сочетается со словом «гнев»; союз после повеления передан как цель или ожидаемый результат.
- source_word: בָהֶם
  choice: против них
  rationale: Предлог ב при обозначении направленного гнева естественно передаётся по-русски как «против».
- source_word: וַאֲכַלֵּם
  choice: и Я истребил их
  rationale: Пиэль глагола כלה здесь означает довести до конца, покончить, истребить. «Истребил» ясно выражает грозящий полный суд, не привнося образ поедания, которого данный глагол сам по себе не содержит.
- source_word: וְאֶעֱשֶׂה אוֹתְךָ לְגוֹי גָּדוֹל
  choice: а тебя Я сделаю великим народом
  rationale: Конструкция עשה с прямым дополнением и ל перед результатом означает «сделать кого-либо кем-либо». Противительный оттенок «а» естественно подчёркивает переход от участи Израиля к обещанию Моисею, не меняя содержания.
theological_decisions:
- issue: Антропопатический образ Божьего гнева
  choice: Сохранён образ гнева, который «воспылает».
  alternative: 'Передать отвлечённо: «чтобы Я разгневался на них».'
  rationale: Еврейская идиома намеренно рисует разгорающийся гнев. Перевод не смягчает образ и сохраняет напряжение между Божьим судом и последующим ходатайством Моисея.
- issue: Смысл повеления הַנִּיחָה לִּי в связи с ходатайством Моисея
  choice: 'Повеление передано прямо: «оставь Меня».'
  alternative: Раскрыть его как скрытое приглашение Моисею ходатайствовать или перевести «не удерживай Меня».
  rationale: Сам стих формулирует настоящее повеление, но не разъясняет, является ли оно риторическим приглашением к ходатайству. Перевод не разрешает этот вопрос за читателя.
- issue: Обещание сделать Моисея великим народом
  choice: Сохранена формулировка «тебя Я сделаю великим народом».
  alternative: «От тебя Я произведу великий народ».
  rationale: Альтернатива естественна по смыслу, но добавляет явно выраженную идею происхождения «от тебя». Основной текст точнее сохраняет Моисея как прямой объект глагола עשה и заветный отзвук обещания о великом народе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимения, относящиеся к Богу, написаны с прописной буквы по устойчивой русской издательской традиции. Синтаксис сохраняет последовательность повеления, грозящего суда и обещания, оставаясь понятным современному читателю.
