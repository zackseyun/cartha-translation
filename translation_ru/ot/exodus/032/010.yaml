  source_fidelity: 'Основной смысл передан точно: повеление Моисею, разгорающийся против народа Божий гнев, угроза полного уничтожения и обещание великого народа сохранены. Однако «оставь Меня» в современном русском без дополнения часто означает «покинь/брось Меня», а не требуемое «оставь в покое, не удерживай». Кроме того, «сделаю тебя великим народом» грамматически может создать неестественное представление, будто сам Моисей превратится в народ; русский идиоматически выражает смысл этой конструкции через «сделаю из тебя».'
  naturalness: Исправленный вариант сохраняет сжатость и высокий, но современно понятный библейский регистр. «Оставь Меня в покое» — естественная русская передача повеления без толкования его риторической функции. «Сделаю из тебя великий народ» передаёт обещание естественно для русского языка.
  terminology: «Гнев воспылает», «против них», «истреблю их» и «великий народ» уместны и сохраняют образность и судебную силу еврейского текста. Прописные буквы в местоимениях, относящихся к Богу, соответствуют заявленной издательской норме.
