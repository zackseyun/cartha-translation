  text: And I said to them[a], ‘Whoever has gold, take it off.’ So they gave it to me, and I threw it into the fire, and this calf came out.
translation:
  language: ru
  text: 'Я сказал им[a]: «Пусть каждый, у кого есть золото, снимет его с себя». Они отдали его мне, я бросил его в огонь — и появился этот телец.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я сказал им: „У кого золото? Снимите его“». Буквально: «У кого золото? Снимите [его]»; речь идёт о снятии с себя золотых украшений.'
    reason: Лаконичную еврейскую конструкцию לְמִי זָהָב можно понимать как вопрос, за которым следует повеление. В основном тексте её смысл передан естественной русской распределительной конструкцией.
lexical_decisions:
- source_word: וָאֹמַר
  choice: И сказал я
  rationale: Передаёт последовательность повествования и вводит пересказ Аароном собственных слов; инверсия естественно поддерживает связность его речи.
- source_word: לְמִי זָהָב
  choice: У кого есть золото
  rationale: Естественная русская передача еврейской конструкции принадлежности, буквально «у кого золото».
- source_word: הִתְפָּרָקוּ
  choice: снимите его
  rationale: Форма породы хитпаэль здесь означает снять с себя золотые украшения; местоимение восполняет подразумеваемый объект.
- source_word: וַיִּתְּנוּ לִי
  choice: Они отдали его мне
  rationale: «Отдали» естественно обозначает передачу снятого золота Аарону; единственное число местоимения представляет золото как вещество.
- source_word: וָאַשְׁלִכֵהוּ בָאֵשׁ
  choice: я бросил его в огонь
  rationale: Точно и современно передаёт действие; русское «в огонь» естественно выражает направление движения.
- source_word: וַיֵּצֵא
  choice: и вышел
  rationale: Сохраняет прямое, нарочито уклончивое описание появления идола без добавочного истолкования.
- source_word: הָעֵגֶל הַזֶּה
  choice: этот телец
  rationale: «Телец» — точное и устойчивое в библейском контексте обозначение молодого быка; определительное местоимение сохранено.
theological_decisions:
- issue: Уклончивое объяснение Аароном происхождения идола
  choice: 'Передать его слова прямо: «и вышел этот телец»'
  alternative: Добавить «будто сам собой», «якобы» или явно обозначить ложь
  rationale: Исходный стих не содержит такого пояснения; повествовательную иронию и напряжение следует сохранить, не превращая перевод в комментарий.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Формулировка ясна обычному читателю; тире перед заключительной частью подчёркивает резкий и уклончивый итог рассказа Аарона, не добавляя оценки.
