  to: 'Я сказал им[a]: «Пусть каждый, у кого есть золото, снимет его с себя». Они отдали его мне, я бросил его в огонь — и появился этот телец.'
  rationale: 'Исправлена синтаксическая неестественность русской прямой речи и упрощён порядок слов в вводной формуле. «Пусть каждый… снимет его с себя» эксплицирует только то, что уже подразумевается хитпаэлем הִתְפָּרָקוּ в данном контексте: снять золотые украшения с себя. Заключительное «появился этот телец» сохраняет прямое, уклончивое изложение Аарона, не приписывая событию чудесный характер и не добавляя оценки.'
