  source_fidelity: 'Смысл исходного текста в целом передан верно: Аарон говорит, что велел имеющим золото снять его, получил его, бросил в огонь, после чего появился «этот телец». Однако «И сказал я» и особенно сочетание «У кого есть золото, снимите его» звучат в современном русском менее естественно, чем возможно без потери смысла.'
  naturalness: «Я сказал им» — нейтральный естественный порядок слов. Распределительное «Пусть каждый, у кого есть золото, снимет его с себя» ясно передаёт обращённое к группе множественное повеление и подразумеваемое снятие украшений. «И появился этот телец» естественно по-русски и сохраняет уклончивую, не объясняющую происхождения формулировку Аарона.
  terminology: «Телец» — уместное традиционно-библейское и современно понятное соответствие עֵגֶל. Не следует добавлять «литой» или оценочные слова («якобы», «сам собой»), поскольку их в стихе нет.
