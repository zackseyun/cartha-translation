  text: And they rose early the next day and offered burnt offerings and brought peace offerings. Then the people sat down to eat and drink[a], and rose up to revel.
translation:
  language: ru
  text: На следующий день они встали рано, принесли всесожжения и мирные жертвы. Потом народ сел есть и пить, а затем встал предаваться разгулу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «встал играть»; возможно также: «встал веселиться». Еврейский глагол может обозначать игру, веселье или разнузданное празднество; здесь контекст указывает скорее на распущенное празднование, чем на невинную забаву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ מִמָּחֳרָת
  choice: На следующий день они встали рано
  rationale: Глагол שׁכם в породе hифиль обычно означает ранний подъём; מִמָּחֳרָת указывает на следующий день. Такой перевод точно передаёт время действия и естественно звучит по-русски.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: принесли всесожжения
  rationale: Сочетание עלה с עֹלָה обозначает принесение жертв всесожжения. «Всесожжения» — точный и устойчивый русский термин для данного вида жертвы.
- source_word: וַיַּגִּשׁוּ שְׁלָמִים
  choice: мирные жертвы
  rationale: נגשׁ здесь означает «принести, представить», а שְׁלָמִים — установленную категорию жертв, традиционно называемых по-русски мирными. Общий глагол «принесли» естественно относится к обоим видам жертв.
- source_word: וַיֵּשֶׁב הָעָם לֶאֱכֹל וְשָׁתוֹ
  choice: народ сел есть и пить
  rationale: Прямой и естественный перевод последовательности действий; инфинитивы выражают цель или занятие народа.
- source_word: וַיָּקֻמוּ לְצַחֵק
  choice: встал предаваться разгулу
  rationale: צחק может обозначать игру, веселье или разнузданное празднество. В контексте поклонения тельцу «предаваться разгулу» передаёт отрицательную окраску, не конкретизируя возможное сексуальное поведение, которого сам стих прямо не называет.
theological_decisions:
- issue: Смысл לְצַחֵק в рассказе о золотом тельце
  choice: «предаваться разгулу» с примечанием о широте значения
  alternative: «играть» или «веселиться»
  rationale: Контекст жертвоприношений перед тельцом, пиршества и последующего суда указывает не просто на невинную игру. При этом примечание сохраняет реальную лексическую неоднозначность и не утверждает, что речь непременно идёт о сексуальной распущенности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены общепринятые названия жертв, а неоднозначный глагол צחק передан контекстуально и снабжён поясняющим примечанием.
