  text: וַ/יִּקַּ֞ח אֶת הָ/עֵ֨גֶל אֲשֶׁ֤ר עָשׂוּ֙ וַ/יִּשְׂרֹ֣ף בָּ/אֵ֔שׁ וַ/יִּטְחַ֖ן עַ֣ד אֲשֶׁר דָּ֑ק וַ/יִּ֨זֶר֙ עַל פְּנֵ֣י הַ/מַּ֔יִם וַ/יַּ֖שְׁקְ אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/020.yaml
  text: He took the calf that they had made[a], burned it with fire, ground it until it was fine, scattered it on the surface of the water, and made the sons of Israel drink it.
translation:
  language: ru
  text: Он взял тельца, которого они сделали, сжёг его в огне, измельчил до мелких частиц, рассыпал по поверхности воды и напоил сынов Израиля этой водой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напоил израильтян этой водой». В еврейском тексте буквально: «сынов Израиля» — обычное обозначение всего народа Израиля.'
    reason: Лексическая альтернатива и пояснение коллективного значения исходного выражения.
lexical_decisions:
- source_word: הָעֵגֶל
  choice: тельца
  rationale: עֵגֶל обозначает телёнка или молодого быка; в данном контексте «телец» — привычное и точное название идола.
- source_word: אֲשֶׁר עָשׂוּ
  choice: которого они сделали
  rationale: Относительное придаточное указывает на изготовленного народом тельца; русское прошедшее время естественно передаёт действие, предшествующее описываемым поступкам Моисея.
- source_word: וַיִּשְׂרֹף בָּאֵשׁ
  choice: сжёг его в огне
  rationale: Конкретно и естественно передаёт глагол «сжечь» с предложным оборотом בָּאֵשׁ, не меняя образ действия.
- source_word: וַיִּטְחַן עַד אֲשֶׁר דָּק
  choice: растёр в мелкий порошок
  rationale: טחן означает измельчать или молоть, а דק — мелкий, тонкий. «В мелкий порошок» естественно выражает достигнутый результат, подразумеваемый еврейским оборотом.
- source_word: וַיִּזֶר
  choice: рассыпал
  rationale: Глагол обозначает разбрасывание или рассеивание измельчённого вещества; «рассыпал» здесь ясно и современно.
- source_word: עַל פְּנֵי הַמַּיִם
  choice: по поверхности воды
  rationale: Передаёт буквальный образ «по лицу воды» естественным современным русским выражением.
- source_word: וַיַּשְׁקְ אֶת בְּנֵי יִשְׂרָאֵל
  choice: заставил сынов Израиля пить эту воду
  rationale: Каузативная форма שׁקה означает «заставить/дать пить». «Сыны Израиля» сохраняет форму covenantal designation בְּנֵי יִשְׂרָאֵל; дополнение «эту воду» в русском ясно выражает подразумеваемый объект питья и не создаёт впечатления, будто пили сухой порошок.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян
  rationale: Основной текст сохраняет явную форму еврейского выражения «сыны Израиля», которое обозначает народ как целое; более естественный собирательный вариант отмечен в сноске.
- issue: Подразумеваемый объект при «заставил пить»
  choice: эту воду
  alternative: заставил их пить
  rationale: Еврейский текст буквально не повторяет существительное «вода», но синтаксис и ближайший контекст указывают на воду с рассыпанными по ней остатками тельца. Уточнение делает русский текст грамматически и смыслово прозрачным, не определяя сверх текста точный характер смеси.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранены конкретность действий и традиционное библейское выражение «сыны Израиля», но архаические глаголы и инвертированный синтаксис не используются.
