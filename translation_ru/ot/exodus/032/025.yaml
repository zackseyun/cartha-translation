  text: וַ/יַּ֤רְא מֹשֶׁה֙ אֶת הָ/עָ֔ם כִּ֥י פָרֻ֖עַ ה֑וּא כִּֽי פְרָעֹ֣/ה אַהֲרֹ֔ן לְ/שִׁמְצָ֖ה בְּ/קָמֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/025.yaml
  text: When Moses saw that the people were out of control—for Aaron had let them get out of control[b][a], for a derision among those who rose against them—
translation:
  language: ru
  text: Моисей увидел, что народ распоясался, потому что Аарон позволил ему распоясаться[a] на посмешище их противникам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал неуправляемым… позволил ему выйти из-под контроля». В еврейском тексте состояние народа и действие Аарона выражены формами одного и того же корня.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «восстающим против них»; также возможно: «среди их противников».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא מֹשֶׁה
  choice: Моисей увидел
  rationale: Последовательная форма глагола продолжает повествование; простая конструкция естественна для современного русского языка.
- source_word: כִּי פָרֻעַ הוּא
  choice: что народ распоясался
  rationale: Форма от פרע обозначает утрату сдерживающих рамок, разнузданность и беспорядок. «Распоясался» естественно передаёт это состояние, не сводя его к наготе.
- source_word: כִּי פְרָעֹה אַהֲרֹן
  choice: потому что Аарон позволил ему распоясаться
  rationale: Повтор «распоясался / распоясаться» сохраняет повтор одного еврейского корня; «позволил» выражает ответственность Аарона, не утверждая, что он намеренно вызвал беспорядок.
- source_word: לְשִׁמְצָה
  choice: на посмешище
  rationale: Передаёт значение позора, насмешек и презрительных разговоров естественным русским оборотом.
- source_word: בְּקָמֵיהֶם
  choice: их противникам
  rationale: Причастие от קום буквально указывает на восстающих против них; в контексте это их противники.
theological_decisions:
- issue: Смысл корня פרע
  choice: распоясался / позволил распоясаться
  alternative: стал неуправляемым / оставил без удержу; обнажился
  rationale: Контекст указывает прежде всего на потерю порядка и сдержанности. Перевод «обнажился» неоправданно сужал бы неоднозначное значение корня.
- issue: Ответственность Аарона
  choice: позволил ему распоясаться
  alternative: распустил народ
  rationale: Такая формулировка сохраняет причинную связь и ответственность Аарона, но не приписывает ему более определённого намерения, чем выражено в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык. «Распоясался» — выразительное, но общеупотребительное слово, сохраняющее образ утраты сдержанности и позволяет воспроизвести корневой повтор оригинала. Конечное тире английского слоя не перенесено, поскольку русский стих дан как завершённое предложение, а синтаксическая незавершённость обусловлена переходом к следующему стиху.
