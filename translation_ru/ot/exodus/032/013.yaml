base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/013.yaml
  text: Remember Abraham[a], Isaac, and Israel, your servants, to whom you swore by yourself and said to them, ‘I will multiply your offspring like the stars of the heavens, and all this land that I have spoken of I will give to your offspring, and they shall inherit it forever.’
translation:
  language: ru
  text: 'Вспомни Авраама, Исаака и Израиля[a], рабов Твоих, которым Ты поклялся Самим Собой и сказал: «Я умножу ваших потомков, как звёзды небесные, и всю эту землю, о которой Я говорил, отдам вашим потомкам, и они унаследуют её навеки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иакова» — патриарха, позднее получившего имя Израиль. В еврейском тексте здесь стоит «Израиль».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Вспомни
  rationale: Повелительная форма обращена к Богу в ходатайстве Моисея. «Вспомни» естественно передаёт призыв помнить о заветных обещаниях, не добавляя отсутствующего в тексте пояснения.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיִשְׂרָאֵל
  choice: Авраама, Исаака и Израиля
  rationale: Сохранено имя «Израиль», прямо стоящее в еврейском тексте; замена на «Иаков» скрыла бы значимость данного патриарху заветного имени.
- source_word: עֲבָדֶיךָ
  choice: рабов Твоих
  rationale: В возвышенной библейской речи «рабы Твои» естественно обозначает принадлежащих Богу и служащих Ему людей; контекст не говорит о социальном рабстве.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לָהֶם בָּךְ
  choice: которым Ты поклялся Самим Собой
  rationale: 'Формулировка сохраняет рефлексивный смысл בָּךְ: Бог Сам служит подтверждением Своей клятвы.'
- source_word: וַתְּדַבֵּר אֲלֵהֶם
  choice: и сказал
  rationale: Перед прямой речью русское «сказал» звучит естественнее формального «говорил им» и точно передаёт смысл.
- source_word: אַרְבֶּה אֶת זַרְעֲכֶם
  choice: Я умножу ваших потомков
  rationale: זֶרַע имеет собирательное значение. «Потомков» ясно и естественно в современном русском и согласуется с последующей формой множественного числа וְנָחֲלוּ.
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: как звёзды небесные
  rationale: Сохранён возвышенный образ и традиционно понятный литературный порядок слов.
- source_word: וְכָל הָאָרֶץ הַזֹּאת
  choice: и всю эту землю
  rationale: Переданы и охват כָּל, и указательное значение הַזֹּאת.
- source_word: אֲשֶׁר אָמַרְתִּי
  choice: о которой Я говорил
  rationale: Формулировка сохраняет отдельность относительного оборота и не сливает его с последующим обещанием «отдам».
- source_word: אֶתֵּן לְזַרְעֲכֶם
  choice: отдам вашим потомкам
  rationale: Будущее обещание передано непосредственно; повтор слова «потомкам» сохраняет лексическую связь с предыдущим זַרְעֲכֶם.
- source_word: וְנָחֲלוּ לְעֹלָם
  choice: и они унаследуют её навеки
  rationale: Местоимение «её» восполняет подразумеваемый объект — землю. «Навеки» передаёт длительное значение לְעֹלָם в контексте заветного обещания.
theological_decisions:
- issue: 'Имя патриарха: Израиль или Иаков'
  choice: Израиль в основном тексте
  alternative: Иаков
  rationale: Еврейский текст прямо называет патриарха Израилем. Это чтение сохраняет связь с данным ему Богом именем и не заменяет перевод толкованием.
- issue: Формула клятвы בָּךְ
  choice: Самим Собой
  alternative: Тобой
  rationale: «Самим Собой» ясно показывает, что Бог клянётся Собой, сохраняя богословски значимый смысл формулы без дополнительных объяснений.
- issue: Связь אֲשֶׁר אָמַרְתִּי с אֶתֵּן
  choice: «о которой Я говорил, отдам» как два различимых элемента
  alternative: «которую Я обещал отдать»
  rationale: Вариант «обещал отдать» стилистически проще, но объединяет относительное придаточное и следующую глагольную форму. Выбранный текст сохраняет структуру и некоторую неровность оригинала.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, молитвенно-заветным звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксис сохраняет последовательность еврейского обещания, но остаётся понятным при чтении вслух.
