base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/031.yaml
  text: Then Moses returned to Yahweh and said[a], “Please, this people has sinned a great sin, and they have made gods of gold for themselves.”
translation:
  language: ru
  text: 'Моисей вернулся к Яхве и сказал: «Прошу, этот народ совершил тяжкий грех: они сделали себе богов из золота[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бога из золота». В еврейском тексте стоит множественное число — «богов из золота», однако с учётом общего контекста некоторые понимают это выражение как указание на одного золотого тельца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: возвратился
  rationale: Глагол שׁוב здесь обозначает возвращение Моисея к Яхве после разговора с народом; «возвратился» точно и естественно передаёт последовательность повествования.
- source_word: אֶל־יְהוָה
  choice: к Яхве
  rationale: Предлог אֶל передаёт направленность движения («к»), а личное имя יהוה передано как «Яхве».
- source_word: אָנָּא
  choice: О
  rationale: Частица выражает настойчивую мольбу или скорбное обращение. «О» сохраняет эмоциональную силу и не добавляет отсутствующего в еврейском тексте объекта просьбы.
- source_word: חָטָא הָעָם הַזֶּה חֲטָאָה גְדֹלָה
  choice: этот народ совершил великий грех
  rationale: Русская конструкция естественно передаёт еврейский оборот с однокоренными глаголом и существительным, а «великий» сохраняет значение גְּדֹלָה и тяжесть проступка.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: они сделали себе
  rationale: 'Дательный לָהֶם имеет возвратное значение: народ изготовил предмет поклонения для себя.'
- source_word: אֱלֹהֵי זָהָב
  choice: богов из золота
  rationale: Форма אֱלֹהֵי грамматически множественная, поэтому множественное число сохранено в основном тексте; «из золота» естественно выражает материал изготовления.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное заветное имя יהוה; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Число в выражении אֱלֹהֵי זָהָב
  choice: богов из золота
  alternative: бога из золота
  rationale: Еврейская форма имеет множественное число, хотя ближайший повествовательный контекст говорит об одном золотом тельце. Основной текст сохраняет форму источника, а контекстуальное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным строем. Синтаксис остаётся понятным широкому читателю; эмоциональная частица передаёт мольбу Моисея без архаизации.
