lexical_decisions:
- source_word: וְעַתָּה
  choice: Но теперь
  rationale: Передаёт переход к настоятельной просьбе Моисея и её контраст с предшествующим контекстом.
- source_word: תִּשָּׂא חַטָּאתָם
  choice: ты простишь их грех
  rationale: Глагол נשׂא буквально означает «поднимать, нести», но в сочетании с «грехом» образует идиому прощения или удаления греха. «Простишь» ясно и естественно передаёт её смысл.
- source_word: וְאִם אַיִן
  choice: А если нет
  rationale: Передаёт эллиптическое отрицательное условие и резкий переход ко второй части мольбы.
- source_word: מְחֵנִי
  choice: изгладь меня
  rationale: Глагол מחה означает стирать или уничтожать запись; «изгладь» сохраняет образ удаления имени из книги и библейские межтекстовые связи.
- source_word: נָא
  choice: прошу
  rationale: Передаёт частицу настоятельной, смиренной просьбы естественным современным русским выражением.
- source_word: מִסִּפְרְךָ
  choice: из твоей книги
  rationale: Слово סֵפֶר может обозначать книгу, свиток или письменный реестр. «Книга» сохраняет образ оригинала, не уточняя его сверх текста.
- source_word: אֲשֶׁר כָּתָבְתָּ
  choice: которую ты написал
  rationale: Прямо передаёт относительное придаточное и подчёркивает, что книгу написал сам Бог.
theological_decisions:
- issue: Незавершённость первой условной части
  choice: если ты простишь их грех…
  alternative: если ты простишь их грех —
  rationale: В еврейском тексте следствие первого условия не высказано. Многоточие сохраняет намеренный обрыв речи Моисея и не добавляет отсутствующих слов.
- issue: Что означает «твоя книга»
  choice: твоя книга
  alternative: твой свиток / твой реестр / книга жизни
  rationale: Еврейский текст не определяет точный характер книги. Нейтральное «твоя книга» не решает, идёт ли речь о небесном списке живых, книге жизни или ином Божьем реестре.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаической инверсии. Многоточие сохраняет оборванную первую условную конструкцию оригинала. Строчные местоимения в обращении к Богу соответствуют обычной современной орфографической практике и не снижают уважительного тона.
