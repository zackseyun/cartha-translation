base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/007.yaml
  text: Then Yahweh said to Moses[a], “Go down, because your people, whom you brought up from the land of Egypt, have corrupted themselves.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Иди, спустись, потому что развратился[a] твой народ, который ты вывел из земли Египта».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступил развратно». Еврейский глагол может подчёркивать порочное поведение, а не состояние нравственной испорченности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И сказал
  rationale: Последовательная форма с וַ продвигает повествование; «сказал» естественно вводит прямую речь по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לֶךְ רֵד
  choice: Иди, спустись
  rationale: 'Сохраняет оба повелительных глагола: буквально «иди, спустись»; первый придаёт приказу настойчивость.'
- source_word: כִּי
  choice: потому что
  rationale: Вводит причину повеления и ясно передаёт логическую связь.
- source_word: שִׁחֵת
  choice: развратился
  rationale: Форма допускает смысл нравственного разложения или пагубного поведения; русский возвратный глагол кратко передаёт наступившую порчу самого народа.
- source_word: עַמְּךָ
  choice: твой народ
  rationale: Сохраняет значимое обращение Яхве к Израилю как к народу Моисея.
- source_word: אֲשֶׁר הֶעֱלֵיתָ
  choice: который ты вывел
  rationale: В контексте исхода каузативный глагол естественно означает, что Моисей вывел народ; пространственный оттенок «поднял» по-русски здесь не обязателен.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Сохраняет компонент «земля» и звучит естественно в современном возвышенном библейском регистре.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя; «Яхве» сохраняет его как имя без замены титулом.
- issue: Смысл שִׁחֵת
  choice: развратился
  alternative: поступил развратно; погубил себя; стал испорченным
  rationale: Выбор сохраняет нравственную и разрушительную окраску глагола, не уточняя сверх текста конкретный характер вины; поведенческая трактовка отмечена в сноске.
- issue: Риторическое «твой народ»
  choice: сохранено буквально
  alternative: этот народ; народ Израиля
  rationale: Притяжательное местоимение создаёт богословски значимое напряжение в словах Яхве после отступничества народа, поэтому его нельзя сглаживать.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формула «И сказал» сохраняет повествовательную связь; «Иди, спустись» намеренно удерживает два повелительных глагола исходного текста. Маркер сноски поставлен после предложения, к которому относится лексическая альтернатива.
