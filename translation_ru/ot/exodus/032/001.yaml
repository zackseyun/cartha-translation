base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/001.yaml
  text: When the people saw that Moses was taking a long time to come down from the mountain[a], the people gathered around Aaron and said to him, “Get up, make gods for us that will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.”
translation:
  language: ru
  text: 'Когда народ увидел, что Моисей долго не спускается с горы, народ собрался вокруг Аарона и сказал ему: «Встань, сделай нам богов[a], которые пойдут перед нами, потому что этот Моисей, человек, который вывел нас из земли Египта, — мы не знаем, что с ним стало».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бога, который пойдёт перед нами». Некоторые понимают אֱלֹהִים здесь в единственном числе, поскольку далее повествование сосредоточено на одном изображении тельца; однако форма этого слова и следующий за ним глагол в еврейском тексте стоят во множественном числе.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֹשֵׁשׁ
  choice: долго не спускается
  rationale: Передаёт воспринимаемую народом задержку Моисея естественным современным русским выражением.
- source_word: לָרֶדֶת מִן הָהָר
  choice: спускается с горы
  rationale: Сохраняет направление движения и определённость горы без излишне книжного «нисходит».
- source_word: וַיִּקָּהֵל ... עַל אַהֲרֹן
  choice: собрался вокруг Аарона
  rationale: Передаёт собрание народа возле Аарона и ощущение давления, но не усиливает конструкцию до открытой враждебности.
- source_word: קוּם
  choice: Встань
  rationale: Сохраняет резкий повелительный тон; русское «встань» естественно и точно.
- source_word: עֲשֵׂה לָנוּ
  choice: сделай нам
  rationale: Явно сохраняет значение действия в интересах народа.
- source_word: אֱלֹהִים ... יֵלְכוּ
  choice: богов, которые пойдут
  rationale: И существительное по форме, и согласованный с ним глагол стоят во множественном числе.
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: с этим Моисеем, человеком
  rationale: Естественно передаёт отстранённый, пренебрежительный оттенок указательного оборота и сохраняет приложение «человеком».
- source_word: הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: вывел нас из земли Египетской
  rationale: Передаёт каузативное значение «поднял/вывел» в устойчивой русской библейской формулировке, понятной современному читателю.
- source_word: מֶה הָיָה לוֹ
  choice: что случилось
  rationale: Естественно передаёт идиоматический вопрос о судьбе Моисея; дополнение «с ним» уже выражено предшествующим оборотом.
theological_decisions:
- issue: Единственное или множественное значение אֱלֹהִים
  choice: 'множественное: «богов, которые пойдут»'
  alternative: 'единственное: «бога, который пойдёт»'
  rationale: 'Непосредственная грамматика поддерживает множественное число: אֱלֹהִים имеет форму множественного числа, а יֵלְכוּ — глагол во множественном числе. Единственное число остаётся возможным контекстуальным пониманием ввиду одного образа тельца и отмечено в сноске.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка упрощён ради ясности; подлинная неоднозначность числа אֱלֹהִים сохранена посредством основного чтения и сноски.
