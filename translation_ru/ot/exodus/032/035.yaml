  text: Then Yahweh struck the people with a plague because of what they did with the calf that Aaron made[a].
translation:
  language: ru
  text: И поразил Яхве народ за то, что сделали тельца, которого сделал Аарон.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И поразил Яхве народ мором за то, что сделали тельца, которого сделал Аарон». Еврейский глагол может означать как «поразить» вообще, так и «поразить мором».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: поразил
  rationale: Глагол נָגַף обозначает поражение или кару и в некоторых контекстах может подразумевать моровое поражение. Однако средство кары здесь прямо не названо, поэтому «поразил» сохраняет широту еврейского выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом «Господь».
- source_word: הָעָם
  choice: народ
  rationale: В данном контексте собирательно обозначает народ Израиля.
- source_word: עַל אֲשֶׁר
  choice: за то, что
  rationale: Естественно передаёт причинное значение сочетания предлога с относительной конструкцией.
- source_word: עָשׂוּ אֶת הָעֵגֶל
  choice: они сделали с тельцом
  rationale: Форма множественного числа указывает на виновное действие народа в отношении тельца. Такая передача сохраняет отличие от следующей формы единственного числа, относящей изготовление тельца к Аарону, и не сглаживает напряжение исходной формулировки.
- source_word: הָעֵגֶל
  choice: тельцом
  rationale: Точно передаёт существительное «телец»; слово «золотой», известное из контекста главы, в этом стихе отсутствует.
- source_word: אֲשֶׁר עָשָׂה אַהֲרֹן
  choice: которого сделал Аарон
  rationale: Прямо передаёт относительное предложение и сохраняет повтор глагола עשה.
theological_decisions:
- issue: Характер суда, выраженного глаголом וַיִּגֹּף
  choice: «поразил» в основном тексте
  alternative: «поразил мором» / «наслал поражение»
  rationale: Глагол допускает понимание кары как морового поражения, но сам стих не называет её средство. Более общее выражение не утверждает сверх текста, а возможный оттенок отмечен в сноске.
- issue: Соотношение вины народа и изготовления тельца Аароном
  choice: 'сохранены обе формулировки: народ «сделал с тельцом», а телец — тот, «которого сделал Аарон»'
  alternative: «за то, что они сделали тельца, которого сделал Аарон»
  rationale: Буквальное повторение «сделали тельца, которого сделал Аарон» по-русски создаёт явное логическое противоречие. Контекстуально широкое значение עשה в первой части сохраняет коллективную ответственность народа, а вторая часть прямо называет Аарона изготовителем.
translation_notes:
  register: Современный литературный русский язык с библейской сдержанностью. Начальное «И» сохраняет повествовательную связь с предыдущим стихом. Имя Яхве передано последовательно как личное имя.
