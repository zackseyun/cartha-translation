  text: וַ/יְחַ֣ל מֹשֶׁ֔ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יֹּ֗אמֶר לָ/מָ֤ה יְהוָה֙ יֶחֱרֶ֤ה אַפְּ/ךָ֙ בְּ/עַמֶּ֔/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/כֹ֥חַ גָּד֖וֹל וּ/בְ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/011.yaml
  text: But Moses pleaded with Yahweh his God and said[a], “Why, Yahweh, should your anger burn against your people[b], whom you brought out of the land of Egypt with great power and with a strong hand?”
translation:
  language: ru
  text: 'Но Моисей стал умолять Яхве, своего Бога, и сказал: «Зачем, Яхве, Твоему гневу пылать против Твоего народа, который Ты вывел из земли Египетской великой силой и крепкой рукой?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַל ... אֶת־פְּנֵי
  choice: стал умолять
  rationale: В породе пиэль сочетание חלה с «лицом» обозначает настойчивую просьбу о благосклонности. Русское «стал умолять» естественно передаёт настойчивость; буквальный образ разъяснён в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его функцию в еврейском тексте и соответствует принятому в проекте решению.
- source_word: אֱלֹהָיו
  choice: своего Бога
  rationale: Возвратное «своего» ясно связывает Бога с Моисеем, субъектом предложения, и естественно звучит по-русски.
- source_word: לָמָה
  choice: зачем
  rationale: В риторической мольбе «зачем» естественно выражает вопрос о том, для чего гневу разгораться, не превращая реплику в запрос о причине.
- source_word: יֶחֱרֶה אַפְּךָ
  choice: Твоему гневу пылать
  rationale: Сохраняется метафора жара, связанная с гневом, без буквального и неясного для русского читателя упоминания носа.
- source_word: בְּעַמֶּךָ
  choice: против Твоего народа
  rationale: Предлог ב при выражении гнева указывает на его направленность; «против» ясно передаёт этот смысл.
- source_word: אֲשֶׁר הוֹצֵאתָ
  choice: который Ты вывел
  rationale: Передаёт народ как объект совершённого Богом исхода, не добавляя идеи дальнейшего водительства.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохраняет полную географическую формулу и достоинство библейского повествовательного регистра.
- source_word: בְּכֹחַ גָּדוֹל
  choice: великой силой
  rationale: Инструментальное значение ב естественно выражено творительным падежом; прилагательное «великой» прямо соответствует גָּדוֹל.
- source_word: וּבְיָד חֲזָקָה
  choice: крепкой рукой
  rationale: Сохраняет телесную метафору и прямое значение חֲזָקָה; вариант «могучей рукой» также возможен и указан в сноске.
theological_decisions:
- issue: Антропоморфный образ Божьего гнева
  choice: Твоему гневу пылать
  alternative: Тебе гневаться; Твоей ярости разгораться
  rationale: Формулировка сохраняет образ жара и напряжённость ходатайства Моисея, но не переносит в русский текст буквальный образ «горящего носа», который был бы непонятен.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Личное имя передано транслитерацией, а не заменено титулом, что сохраняет различие исходного текста.
- issue: Риторический вопрос Моисея о Божьем гневе
  choice: Зачем ... Твоему гневу пылать
  alternative: Почему Ты гневаешься
  rationale: Инфинитивная русская конструкция сохраняет характер настойчивого ходатайства, не утверждая, что Моисей отрицает основание для гнева, и не снимает повествовательную напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы как редакционная норма русского религиозного регистра. Синтаксис остаётся доступным обычному читателю; ключевые еврейские метафоры сохранены там, где они понятны по-русски.
