  text: And Yahweh relented concerning the harm that he had spoken of doing to his people[a][b].
translation:
  language: ru
  text: И Яхве отказался от бедствия, которое Он сказал, что наведёт на Свой народ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «передумал»; также возможно: «пожалел» или «раскаялся в том, что хотел навести бедствие».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «зло». Здесь еврейское слово означает грозящее бедствие, а не нравственное зло в Боге.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: отказался
  rationale: Нифаль глагола נחם здесь обозначает отказ от прежде объявленного действия. «Отказался» естественно передаёт изменение намеченного хода событий, не снимая повествовательного и богословского напряжения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: עַל הָרָעָה
  choice: от бедствия
  rationale: В данном контексте רָעָה означает грозящее народу губительное бедствие, а не нравственное зло. Сочетание נחם על допускает естественную русскую передачу «отказался от».
- source_word: אֲשֶׁר דִּבֶּר לַעֲשׂוֹת
  choice: которое обещал навести
  rationale: Буквально речь идёт о том, что Яхве сказал сделать. «Обещал навести» ясно указывает на ранее объявленное бедствие и звучит естественно по-русски, хотя «обещал» здесь имеет смысл твёрдо объявленного намерения, а не благого обетования.
- source_word: לְעַמּוֹ
  choice: на Свой народ
  rationale: Предлог обозначает народ как объект грозящего бедствия; конструкция «навести на народ» идиоматична в современном русском языке.
theological_decisions:
- issue: Человекоподобное описание Бога посредством נחם
  choice: В основном тексте передать как «отказался», сохранив реальную перемену в объявленном действии.
  alternative: «передумал»; «раскаялся»; «пожалел»
  rationale: Стих изображает отказ от объявленного суда после ходатайства Моисея. Перевод не должен ни отрицать эту повествовательную перемену, ни превращать её в исчерпывающее утверждение о природе Божьего знания или изменяемости.
translation_notes:
  register: Современный литературный русский язык; изложение краткое и достойное. Личное имя передано как «Яхве». Прописная буква в «Свой» соответствует традиционной русской почтительной орфографии, не добавляя отдельного смыслового компонента.
