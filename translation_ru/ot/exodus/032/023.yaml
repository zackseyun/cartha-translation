  text: וַ/יֹּ֣אמְרוּ לִ֔/י עֲשֵׂה לָ֣/נוּ אֱלֹהִ֔ים אֲשֶׁ֥ר יֵלְכ֖וּ לְ/פָנֵ֑י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/023.yaml
  text: And they said to me[a], ‘Make gods for us, which will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.’
translation:
  language: ru
  text: 'И они сказали мне: «Сделай нам богов, которые пойдут впереди нас, потому что этот Моисей, человек, который вывел нас из Египта, — мы не знаем, что с ним случилось»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сделай нам бога, который пойдёт впереди нас». Хотя в этом стихе употреблены существительное и глагол во множественном числе («богов… пойдут»), некоторые переводят их в единственном числе, учитывая образ одного тельца в ближайшем контексте.'
    reason: Альтернативное прочтение числа אֱלֹהִים с учётом контекста.
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: И они сказали мне
  rationale: Последовательная форма продвигает повествование; союз «и» естественно сохраняет связь с предшествующим рассказом.
- source_word: עֲשֵׂה לָנוּ
  choice: Сделай нам
  rationale: Императив передаёт прямое требование, а дательный оттенок לָנוּ естественно выражается местоимением «нам».
- source_word: אֱלֹהִים
  choice: богов
  rationale: Хотя существительное допускает единственное значение, согласованный с ним глагол יֵלְכוּ стоит во множественном числе, поэтому основной текст сохраняет множественность.
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: которые пойдут впереди нас
  rationale: Оборот означает движение впереди народа с оттенком предводительства; форма «пойдут» сохраняет множественное число еврейского глагола.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину требования и ясно передаётся современным русским причинным оборотом.
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: этот Моисей, человек
  rationale: «Этот Моисей» сохраняет дистанцирующий оттенок указательного местоимения, а приложение «человек» явно отражает הָאִישׁ.
- source_word: אֲשֶׁר הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: который вывел нас из земли Египетской
  rationale: Каузатив עלה в контексте исхода означает «вывел/привёл вверх»; «вывел» естественно по-русски и не теряет исхода из страны.
- source_word: לֹא יָדַעְנוּ מֶה הָיָה לוֹ
  choice: мы не знаем, что с ним случилось
  rationale: Перфект описывает сохраняющееся состояние незнания, а идиома מֶה הָיָה לוֹ естественно означает «что с ним случилось».
theological_decisions:
- issue: Передавать ли אֱלֹהִים как единственное или множественное число
  choice: 'множественное: «богов, которые пойдут»'
  alternative: 'единственное: «бога, который пойдёт»'
  rationale: Форма יֵלְכוּ грамматически множественная и поддерживает чтение «боги». Единственное число возможно с учётом образа одного тельца в контексте, но основной перевод не должен сглаживать напряжение между грамматикой стиха и окружающим повествованием.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис прямой речи сохраняет резкий, дистанцирующий оборот «этот Моисей». Маркер сноски поставлен в основном тексте.
