base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/019.yaml
  text: And as soon as he came near the camp and saw the calf and the dancing[a], Moses' anger burned, and he threw the tablets from his hands and shattered them at the foot of the mountain.
translation:
  language: ru
  text: Когда же он приблизился к стану и увидел тельца и пляски[a], Моисей воспылал гневом, бросил скрижали из рук и разбил их у подножия горы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и танцы». Еврейское слово стоит во множественном числе и означает праздничные или культовые пляски.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Когда же
  rationale: Естественно передаёт еврейскую повествовательную формулу и временную связь, не воспроизводя буквально «и было, когда».
- source_word: קָרַב אֶל הַמַּחֲנֶה
  choice: он приблизился к стану
  rationale: Точно передаёт пространственное значение קָרַב; «стан» сохраняет достойный библейский регистр и остаётся понятным современному читателю.
- source_word: וַיַּרְא אֶת הָעֵגֶל
  choice: и увидел тельца
  rationale: רָאָה — обычный глагол «видеть»; определённость существительного обусловлена уже известным из контекста идолом.
- source_word: וּמְחֹלֹת
  choice: и пляски
  rationale: Множественное מְחֹלֹת обозначает пляски или танцы. «Пляски» естественно в данном празднично-культовом контексте и не добавляет оценочного смысла вроде «разгула».
- source_word: וַיִּחַר אַף מֹשֶׁה
  choice: Моисей воспылал гневом
  rationale: Сохраняет образность еврейской идиомы о разгорающемся гневе и звучит естественно в современном литературном русском.
- source_word: וַיַּשְׁלֵךְ מִיָּדוֹ
  choice: бросил скрижали из рук
  rationale: שָׁלַךְ означает «бросить»; русский оборот «из рук» естественен при двух скрижалях, хотя в еврейском употреблено единственное число.
- source_word: הַלֻּחֹת
  choice: скрижали
  rationale: В контексте завета традиционное русское «скрижали» точно обозначает каменные таблички и не требует добавления слова «каменные», отсутствующего в стихе.
- source_word: וַיְשַׁבֵּר אֹתָם
  choice: и разбил их
  rationale: Прямо и точно передаёт שָׁבַר без излишнего усиления.
- source_word: תַּחַת הָהָר
  choice: у подножия горы
  rationale: В данном топографическом контексте это естественный русский эквивалент буквального «под горой».
