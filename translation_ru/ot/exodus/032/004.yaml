base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/004.yaml
  text: And he took it from their hands and fashioned it with a graving tool[a], and he made it into a cast calf. Then they said, “These are your gods, Israel[d][c][b], who brought you up from the land of Egypt.”
translation:
  language: ru
  text: 'Он взял золото из их рук, обработал его резцом[a] и сделал из него литого телёнка. Тогда они сказали: «Вот твои боги, Израиль, которые вывели тебя из земли Египетской»[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гравировальным инструментом», «стилом» либо «долотом»; точное значение еврейского слова спорно.'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых текстовых традициях: «он сказал» вместо «они сказали».'
    reason: textual_variant
  - marker: c
    text: 'Буквально по еврейскому тексту: «Вот твои боги». Традиционный перевод «Вот твой бог» согласует слова с единственным изображением тельца.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח מִיָּדָם
  choice: Он взял золото из их рук
  rationale: Глагол לקח означает «взять, принять». Объект — золото, переданное в предыдущем стихе; его явное обозначение делает русский текст естественным, не меняя смысла.
- source_word: וַיָּצַר אֹתוֹ בַּחֶרֶט
  choice: обработал его резцом
  rationale: יצר передаёт целенаправленное придание формы, а редкое חֶרֶט обозначает инструмент для письма, гравировки или обработки. «Обработал резцом» сохраняет ремесленный смысл, не утверждая точнее, чем позволяет спорная лексема.
- source_word: וַיַּעֲשֵׂהוּ עֵגֶל מַסֵּכָה
  choice: сделал из него литого телёнка
  rationale: מַסֵּכָה — металлическое литое изображение. Формулировка естественно связывает исходный материал с результатом и сохраняет прямую роль Аарона.
- source_word: וַיֹּאמְרוּ
  choice: они сказали
  rationale: Масоретский текст WLC имеет форму множественного числа; её следует сохранить в основном тексте.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: Вот твои боги
  rationale: Указательное местоимение אֵלֶּה и форма אֱלֹהֶיךָ здесь морфологически множественные. Русское «вот» естественно вводит возглас и не устраняет напряжение между множественным числом слов и единственным изображением.
- source_word: אֲשֶׁר הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: которые вывели тебя из земли Египетской
  rationale: Hiphil עלה в контексте исхода означает «вывести, привести вверх». «Вывели» — естественное русское выражение исхода из страны; «из земли Египетской» сохраняет полную формулу оригинала.
theological_decisions:
- issue: Множественное или единственное число в возгласе перед идолом
  choice: «Вот твои боги, Израиль»
  alternative: «Вот твой бог, Израиль»
  rationale: В масоретском тексте указательное слово, существительное по форме и относительное сказуемое стоят во множественном числе. Перевод сохраняет это число, хотя речь идёт об одном тельце, и не сглаживает смысловое напряжение.
- issue: Роль Аарона в изготовлении изображения
  choice: 'Сохранить прямую роль Аарона: он взял, обработал и сделал'
  alternative: Представить Аарона лишь получателем золота или руководителем работы
  rationale: Последовательные глаголы единственного числа прямо приписывают действия Аарону; перевод не должен ослаблять это свидетельство текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис следует последовательности еврейских глаголов, но остаётся понятным. «Земля Египетская» сохраняет торжественную формульность, не прибегая к архаичным местоимениям или формам.
