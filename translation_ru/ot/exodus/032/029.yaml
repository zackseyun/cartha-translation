base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/029.yaml
  text: And Moses said, “Today ordain yourselves to the LORD, for each man has been against his son and against his brother, so that he may bestow a blessing on you today.”
translation:
  language: ru
  text: 'И сказал Моисей: «Сегодня посвятите себя служению Господу[a], ибо каждый был против сына своего и брата своего, чтобы сегодня вам было даровано благословение».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наполните сегодня ваши руки для Господа» — выражение, означающее посвящение на служение.'
    reason: Поясняет древнееврейскую идиому, буквальный образ которой невозможно естественно сохранить в основном русском тексте.
lexical_decisions:
- source_word: מִלְאוּ יֶדְכֶם
  choice: посвятите себя на служение
  rationale: Буквально «наполните вашу руку» — устойчивое древнееврейское выражение о посвящении на служение. Функциональная передача понятна современному читателю и сохраняет культовый оттенок контекста.
- source_word: לַיהוָה
  choice: Господу
  rationale: Тетраграмматон передан традиционным русским эквивалентом «Господь».
- source_word: אִישׁ בִּבְנוֹ וּבְאָחִיו
  choice: каждый выступил против своего сына и своего брата
  rationale: Предлог ב здесь указывает на направленность действия против близких; глагол восполнен из непосредственного контекста казни участников идолопоклонства.
- source_word: וְלָתֵת עֲלֵיכֶם הַיּוֹם בְּרָכָה
  choice: чтобы Он даровал вам сегодня благословение
  rationale: Инфинитив передан как цель или результат; подразумеваемым дарителем по ближайшему контексту является Господь.
theological_decisions:
- issue: Смысл повеления מִלְאוּ יֶדְכֶם
  choice: посвятите себя на служение Господу
  alternative: наполните руки ваши для Господа
  rationale: Выбран смысл идиомы, а буквальная форма сохранена в сноске; это не привязывает посвящение к позднейшей конфессиональной практике.
- issue: Подразумеваемый субъект глагола «даровать»
  choice: Он, то есть Господь
  alternative: чтобы сегодня вам было даровано благословение
  rationale: Ближайший названный субъект, способный даровать благословение, — Господь; прописная буква делает эту связь ясной, не добавляя иного богословского содержания.
- issue: Действие против сына и брата
  choice: выступил против
  alternative: убил
  rationale: Источник не повторяет глагол убийства в этом стихе; более широкая формулировка сохраняет эллипсис и не добавляет прямо отсутствующий глагол.
translation_notes:
  register: Современный литературный русский язык, торжественный, но общепонятный. Синтаксис сохраняет причинно-целевую структуру еврейского стиха; повтор «сегодня» оставлен в обеих позициях оригинала.
