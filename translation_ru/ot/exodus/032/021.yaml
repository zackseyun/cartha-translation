  yaml_path: translation/ot/exodus/032/021.yaml
  text: Moses said to Aaron[a], “What did this people do to you, that you have brought a great sin upon them?”
translation:
  language: ru
  text: 'Моисей сказал Аарону: «Что сделал тебе этот народ, что ты навлёк на него великий грех?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Стандартная повествовательная форма wayyiqtol; в естественном русском рассказе начальный союз можно не передавать.
- source_word: מֶה עָשָׂה לְךָ הָעָם הַזֶּה
  choice: Что сделал тебе этот народ
  rationale: Передаёт вопросительное מֶה, конструкцию עָשָׂה לְךָ «сделал тебе» и указательное הַזֶּה «этот», сохраняя оттенок отстранённости.
- source_word: כִּי
  choice: что
  rationale: 'Союз вводит следствие или содержание упрёка: что народ сделал Аарону такого, что тот навёл на него великий грех.'
- source_word: הֵבֵאתָ עָלָיו
  choice: ты навёл на него
  rationale: Каузативная форма בוא означает «принести, навести»; עָלָיו грамматически стоит в единственном числе и согласуется с собирательным הָעָם «народ».
- source_word: חֲטָאָה גְדֹלָה
  choice: великий грех
  rationale: Прямо передаёт тяжесть проступка без добавочного усиления, отсутствующего в еврейском тексте.
theological_decisions:
- issue: Степень вины Аарона
  choice: «ты навёл на него великий грех» прямо возлагает на Аарона ответственность за грех народа
  alternative: «ты ввёл его в великий грех» или «ты навлёк на него великую вину»
  rationale: Исходный текст приписывает Аарону причинную ответственность, но не уточняет её механизм; выбранная формулировка сохраняет эту напряжённость и не усиливает её толкованием.
translation_notes:
  register: Современный литературный русский язык; торжественный, но понятный синтаксис. Единственное число «на него» естественно соотносится с собирательным существительным «народ», поэтому примечание не требуется.
