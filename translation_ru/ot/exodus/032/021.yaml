    rationale: Глагол «навести» в данном контексте не является обычным русским способом выразить причинение греха. Глагол «навлечь» передаёт причинный смысл הֵבֵאתָ עָלָיו и сохраняет образ греха, навлечённого на народ, не уточняя механизм вины Аарона.
