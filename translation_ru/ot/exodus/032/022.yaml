- source_word: כִּי
  choice: двоеточие
  rationale: В данном контексте союз вводит содержание того, что Моисей знает; в русском языке это естественно выражается бессоюзной пояснительной конструкцией.
- source_word: בְרָע הוּא
  choice: он склонен ко злу
  rationale: Идиоматическое выражение буквально означает, что народ «во зле»; выбранный вариант характеризует его устойчивую дурную направленность, не превращая фразу в утверждение о конкретном намерении.
