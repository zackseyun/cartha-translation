base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/012.yaml
  text: Why should the Egyptians say[a], ‘He brought them out with evil intent, to kill them in the mountains and to wipe them off the face of the earth’? Turn from your burning anger[c][b], and relent concerning the harm intended for your people.
translation:
  language: ru
  text: 'Почему египтяне должны говорить[a]: «Он вывел их со злым умыслом — чтобы убить их в горах и истребить их с лица земли[b]»? Отвратись от пыла Своего гнева и откажись от бедствия, предназначенного Твоему народу[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Зачем египтянам говорить».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «полностью уничтожить их с лица земли».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «отмени бедствие для Твоего народа»; древнееврейский глагол передаёт здесь человеческим языком просьбу Моисея о перемене объявленного действия.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ מִצְרַיִם
  choice: Зачем египтянам говорить
  rationale: Риторический вопрос передаёт сочетание לָמָּה с имперфектом; дательный субъект с инфинитивом естественен в современном русском.
- source_word: בְּרָעָה
  choice: со злым умыслом
  rationale: Передаёт приписываемую Богу египтянами злонамеренную цель, а не просто неблагоприятный результат.
- source_word: הוֹצִיאָם
  choice: Он вывел их
  rationale: Прямое соответствие каузативной форме יצא и устоявшемуся языку повествования об исходе.
- source_word: לַהֲרֹג אֹתָם
  choice: чтобы убить их
  rationale: Ясно выражает цель, обозначенную инфинитивной конструкцией.
- source_word: בֶּהָרִים
  choice: в горах
  rationale: Прямо передаёт форму множественного числа без неоправданного уточнения местности.
- source_word: וּלְכַלֹּתָם
  choice: и истребить их
  rationale: Глагол כלה в пиэле обозначает полное уничтожение; «истребить» естественно сочетается с последующим «с лица земли».
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: с лица земли
  rationale: Естественный русский эквивалент древнееврейской идиомы полного удаления.
- source_word: שׁוּב מֵחֲרוֹן אַפֶּךָ
  choice: Отвратись от пыла Своего гнева
  rationale: Сохраняет повелительное обращение и образ жара, заключённый в חֲרוֹן אַף, в dignified современном русском регистре.
- source_word: וְהִנָּחֵם עַל הָרָעָה
  choice: и откажись от бедствия
  rationale: «Откажись» передаёт призыв не осуществлять угрожающее действие, не внося значения нравственного раскаяния; «бедствие» обозначает пагубное последствие, а не моральное зло.
- source_word: לְעַמֶּךָ
  choice: предназначенного Твоему народу
  rationale: В контексте угрожаемого суда передаёт направленность бедствия на народ; формулировка остаётся естественной по-русски.
theological_decisions:
- issue: Антропопатический язык וְהִנָּחֵם по отношению к Богу
  choice: «откажись»
  alternative: «раскайся», «передумай», «пожалей»
  rationale: Выбор сохраняет реальность ходатайственной просьбы Моисея и возможность изменения объявленного действия, но не подразумевает нравственной ошибки Бога. Альтернативный антропопатический оттенок отмечен в сноске.
- issue: Значение הָרָעָה применительно к угрожаемому Божьему действию
  choice: «бедствие»
  alternative: «зло», «вред», «несчастье»
  rationale: «Бедствие» выражает губительный суд для народа, не приписывая Богу морального зла и не отрицая тяжести угрозы.
- issue: Повтор корня רעה в обвинении египтян и в просьбе Моисея
  choice: Развести как «злой умысел» и «бедствие»
  alternative: Передать оба употребления словом «зло»
  rationale: 'Разные русские соответствия отражают контекстуальные значения одного древнееврейского корня: приписываемый мотив в первой части и угрожаемое пагубное событие во второй.'
translation_notes:
  register: Современный литературный русский с торжественностью, уместной для прямого обращения к Богу. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской издательской традиции. Синтаксис риторического вопроса сделан естественным, при этом сохранены обвинение египтян, образ пылающего гнева и напряжённость просьбы Моисея.
