base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/005.yaml
  text: When Aaron saw it[a], he built an altar before it. Then Aaron proclaimed and said, “Tomorrow will be a feast to Yahweh.”
translation:
  language: ru
  text: 'Аарон увидел это[a] и построил перед ним жертвенник. Затем Аарон объявил: «Завтра — праздник в честь Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте дополнение при «увидел» не названо; по контексту речь идёт о тельце. Местоимение в выражении «перед ним» грамматически может относиться также к Аарону, хотя по контексту вероятнее относится к тельцу.
    reason: Сноска отмечает восполненное из контекста дополнение и сохраняет грамматическую неоднозначность референта לְפָנָיו.
lexical_decisions:
- source_word: וַיַּרְא
  choice: Увидев это
  rationale: Глагол означает «увидел»; дополнение, отсутствующее в еврейском тексте, естественно восполняется из контекста и указывает на только что сделанного тельца.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: построил жертвенник
  rationale: Прямой и естественный перевод сочетания בנה с מזבח, сохраняющий культовый смысл.
- source_word: לְפָנָיו
  choice: перед ним
  rationale: Местоименный суффикс мужского рода единственного числа естественно соотносится с тельцом; русское «ним» также сохраняет грамматическую возможность отнести его к Аарону.
- source_word: וַיִּקְרָא ... וַיֹּאמַר
  choice: провозгласил
  rationale: Два еврейских глагола вводят публичное объявление. Одно русское слово передаёт их функцию естественно, без тяжеловесного «провозгласил и сказал».
- source_word: חַג
  choice: праздник
  rationale: חַג обозначает культовый праздник; «праздник» в современном русском языке здесь естественнее, чем «пир», и не уточняет сверх текста паломнический характер.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל выражает посвящение или направленность праздника, что по-русски достаточно ясно из конструкции «праздник Яхве»; имя יהוה передано как «Яхве».
- source_word: מָחָר
  choice: Завтра —
  rationale: Именное предложение без связки естественно передаётся в русском тире и сохраняет краткость торжественного объявления.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; форма «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Референт местоимения в לְפָנָיו
  choice: жертвенник построен перед тельцом
  alternative: жертвенник построен перед Аароном
  rationale: Ближайший повествовательный контекст указывает на только что изготовленного тельца, хотя грамматика допускает соотнесение суффикса с Аароном; неоднозначность отмечена в сноске.
- issue: Связь праздника Яхве с тельцом
  choice: сохранить напряжение повествования без поясняющей интерпретации
  alternative: явно назвать праздник идолопоклонническим или отождествить тельца с Яхве
  rationale: Стих сообщает, что Аарон объявил праздник Яхве у жертвенника перед тельцом, но сам не формулирует богословское объяснение этой связи.
translation_notes:
  register: Современный литературный русский язык с лаконичным, dignified повествовательным регистром. Публичный характер объявления выражен глаголом «провозгласил»; избыточная калька «провозгласил и сказал» устранена.
