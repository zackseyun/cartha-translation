base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/015.yaml
  text: Then Moses turned and went down from the mountain[a], with the two tablets of the testimony in his hand, tablets written on both their sides; on this side and on that they were written.
translation:
  language: ru
  text: Моисей повернулся и сошёл с горы, держа в руке две скрижали свидетельства — скрижали, исписанные с обеих сторон[a]; с одной и с другой стороны они были исписаны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с обеих их сторон».'
    reason: Более буквальная передача מִשְּׁנֵי עֶבְרֵיהֶם; основное чтение передаёт выражение естественным русским оборотом.
lexical_decisions:
- source_word: וַיִּפֶן
  choice: повернулся
  rationale: Глагол פנה обозначает перемену направления перед спуском; «повернулся» точно передаёт это без избыточного уточнения «назад».
- source_word: וַיֵּרֶד
  choice: сошёл
  rationale: ירד означает движение вниз. В сочетании «сошёл с горы» это естественная современная русская повествовательная формулировка.
- source_word: הָהָר
  choice: горы
  rationale: В контексте Синая הַר уместно передать как «гора»; определённость выражена контекстом и конструкцией «с горы».
- source_word: שְׁנֵי לֻחֹת
  choice: две скрижали
  rationale: «Скрижали» — ясное и укоренившееся русское обозначение каменных табличек завета. Слово «каменные» не добавлено, поскольку в этом стихе его нет.
- source_word: הָעֵדֻת
  choice: свидетельства
  rationale: Передаёт основное значение עֵדוּת и сохраняет богословскую ёмкость устойчивого обозначения скрижалей, не сводя его к пояснительному «документу завета».
- source_word: בְּיָדוֹ
  choice: в руке у него
  rationale: Сохранено единственное число исходного текста; русская конструкция естественно обозначает то, что Моисей нёс.
- source_word: לֻחֹת כְּתֻבִים
  choice: скрижали, исписанные
  rationale: Пассивное причастие от כתב буквально указывает, что на скрижалях было написано. «Исписанные» естественно сочетается с указанием на обе стороны.
- source_word: מִשְּׁנֵי עֶבְרֵיהֶם
  choice: с обеих сторон
  rationale: Идиоматично передаёт наличие письма на двух сторонах каждой скрижали; буквальная форма отмечена в сноске.
- source_word: מִזֶּה וּמִזֶּה
  choice: и с той, и с другой стороны
  rationale: Сохраняет распределительное усиление и ритмический параллелизм еврейской фразы.
- source_word: הֵם כְּתֻבִים
  choice: они были исписаны
  rationale: Сохранено намеренное повторение исходного текста, подчёркивающее, что письмо находилось на обеих сторонах.
theological_decisions:
- issue: Передача עֵדוּת в выражении לֻחֹת הָעֵדֻת
  choice: скрижали свидетельства
  alternative: скрижали завета; скрижали откровения
  rationale: «Свидетельство» непосредственно сохраняет лексический образ עֵדוּת и его заветное звучание, тогда как «завет» истолковывает термин, а традиционное «откровение» в современном русском может ошибочно ассоциироваться прежде всего с раскрытием тайны.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Слово «скрижали» сохранено как общеизвестный точный термин; синтаксис сделан ясным для современного читателя. Повтор исходного текста не сглажен.
