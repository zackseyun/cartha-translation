    rationale: Глагол «заповедать» обычно требует содержания заповеди либо конструкции «заповедать кому-либо что-либо»; применительно к «пути» здесь естественнее «предписал им». Это точнее отражает еврейское «путь, который Я повелел им [держать]».
  - severity: low
    issue: «Из земли Египетской» звучит архаизирующе для заявленного современного литературного варианта.
    rationale: «Из земли Египта» сохраняет формульное выражение оригинала и лучше соответствует целевому регистру.
