source:
  edition: WLC
  text: סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֣וּ לָ/הֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה וַ/יִּשְׁתַּֽחֲווּ ל/וֹ֙ וַ/יִּזְבְּחוּ ל֔/וֹ וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶֽעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/008.yaml
  text: They have quickly turned aside from the way that I commanded them. They have made for themselves a cast image of a calf[a], and have bowed down to it and sacrificed to it, and said, ‘These are your gods, Israel, who brought you up from the land of Egypt.’
translation:
  language: ru
  text: 'Они быстро уклонились от пути, который Я предписал им. Они сделали себе литого тельца, поклонились ему, принесли ему жертвы и сказали: «Вот твои боги[a], Израиль, которые вывели тебя из земли Египта».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот твой бог, Израиль». Буквально в еврейском тексте: «Вот твои боги», хотя в контексте речь идёт об одном тельце.'
    reason: Сохраняет возможность согласования по смыслу, не устраняя множественное число оригинала из основного текста.
lexical_decisions:
- source_word: סָרוּ מַהֵר
  choice: быстро уклонились
  rationale: Передаёт как стремительность отступления, так и образ отклонения от предписанного пути.
- source_word: מִן הַדֶּרֶךְ אֲשֶׁר צִוִּיתִם
  choice: от пути, который Я заповедал им
  rationale: Сохраняет метафору пути как образа послушания и прямо передаёт Божье повеление.
- source_word: עָשׂוּ לָהֶם
  choice: сделали себе
  rationale: Местоименная конструкция указывает, что идола они изготовили для себя.
- source_word: עֵגֶל מַסֵּכָה
  choice: литого тельца
  rationale: מַסֵּכָה обозначает отлитое из металла изображение; по-русски сочетание «литой телец» естественно и сохраняет способ изготовления.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: поклонились ему
  rationale: Передаёт конкретное телесное действие поклонения, не заменяя его более общим богословским обозначением.
- source_word: וַיִּזְבְּחוּ לוֹ
  choice: принесли ему жертвы
  rationale: Ясно и естественно передаёт культовое жертвоприношение.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: Вот твои боги
  rationale: Сохраняет явно множественное число еврейской фразы, несмотря на упоминание одного тельца.
- source_word: הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: вывели тебя из земли Египетской
  rationale: Русское «вывели» естественно передаёт исход из Египта; упоминание земли сохранено.
theological_decisions:
- issue: Число в выражении אֵלֶּה אֱלֹהֶיךָ при единственном изображении тельца
  choice: «Вот твои боги, Израиль»
  alternative: «Вот твой бог, Израиль»
  rationale: Указательное местоимение и существительное в еврейском тексте имеют форму множественного числа. Контекст с одним тельцом создаёт подлинное напряжение, которое сохранено в основном тексте, а возможное согласование по смыслу вынесено в примечание.
- issue: Значение וַיִּשְׁתַּחֲווּ
  choice: «поклонились ему»
  alternative: «стали поклоняться ему»
  rationale: 'Выбранный вариант сохраняет отдельный телесный акт в последовательности действий: изготовили, поклонились, принесли жертвы и произнесли.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис остаётся ясным для широкого читателя; выражение «земля Египетская» сохраняет достоинство и межтекстовую узнаваемость формулы исхода.
