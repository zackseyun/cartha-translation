  yaml_path: translation/ot/exodus/032/034.yaml
  text: But now go, lead the people to where I have spoken to you. Look, my angel will go before you; but on the day when I call them to account, I will call them to account for their sin.
translation:
  language: ru
  text: А теперь иди, веди этот народ к тому месту, о котором Я говорил тебе. Вот, Мой ангел пойдёт перед тобой. Но в день, когда Я призову их к ответу, Я взыщу с них за их грех.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в день Моего посещения Я посещу их за их грех». Еврейский глагол может обозначать посещение для суда, взыскания или наказания.'
    reason: Поясняет намеренно многозначный повтор פקד и основание смыслового перевода.
lexical_decisions:
- source_word: נְחֵה
  choice: веди
  rationale: Императив каузативной породы от נחה означает «вести, направлять»; простое современное «веди» естественно передаёт поручение Моисею.
- source_word: מַלְאָכִי
  choice: Мой ангел
  rationale: Сохраняет обычное значение «вестник/ангел» и притяжательный суффикс; контекст не требует уточнять природу посланника.
- source_word: פָּקַדְתִּי / וּפָקַדְתִּי
  choice: когда Я призову их к ответу, Я взыщу
  rationale: Повтор корня פקד сохранён по смыслу через близкие судебно-ответственные выражения. «Призову к ответу / взыщу» передаёт здесь посещение ради воздаяния, не сводя значение только к физическому наказанию.
- source_word: חַטָּאתָם
  choice: их грех
  rationale: Единственное число с суффиксом третьего лица множественного числа буквально означает «их грех» и указывает на общий проступок народа.
theological_decisions:
- issue: Характер будущего Божьего посещения
  choice: «призову их к ответу… взыщу с них»
  alternative: «накажу их… накажу их»
  rationale: Формулировка сохраняет идею Божьего суда и ответственности, но не предрешает конкретную форму воздаяния, заложенную в многозначном פקד.
- issue: Идентичность מַלְאָךְ
  choice: «Мой ангел» без пояснения
  alternative: «Мой посланник» или богословская идентификация ангела
  rationale: Исходный текст не раскрывает здесь его природу; перевод не должен привносить конфессиональную идентификацию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Вот» естественно передаёт הִנֵּה; прописные местоимения относятся к Богу согласно распространённой русской библейской издательской норме.
