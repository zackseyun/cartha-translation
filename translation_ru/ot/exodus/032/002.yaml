lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם אַהֲרֹן
  choice: И сказал им Аарон
  rationale: Сохраняет последовательное повествование, выраженное формой с וַ, и явное местоимение «им», не заменяя его толкованием «народу».
- source_word: פָּרְקוּ
  choice: Снимите
  rationale: В данном контексте речь идёт об удалении украшений с ушей; «снимите» естественно по-русски, а возможный оттенок резкого или насильственного действия сохранён в сноске.
- source_word: נִזְמֵי הַזָּהָב
  choice: золотые кольца
  rationale: נֶזֶם обозначает кольцевое украшение, которое могло носиться в носу или ушах; последующая фраза прямо указывает на уши. Прилагательное «золотые» естественно передаёт материал украшений.
- source_word: אֲשֶׁר בְּאָזְנֵי
  choice: которые в ушах у
  rationale: Прямо передаёт местонахождение колец и звучит понятно в современном русском языке.
- source_word: נְשֵׁיכֶם בְּנֵיכֶם וּבְנֹתֵיכֶם
  choice: ваших жён, сыновей и дочерей
  rationale: Сохраняет конкретные семейные обозначения и параллельное перечисление исходного текста.
- source_word: וְהָבִיאוּ אֵלָי
  choice: и принесите их ко мне
  rationale: Явное «их» естественно требуется по-русски и однозначно отсылает к кольцам.
