lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Передаёт обычную последовательность древнееврейского повествования, не добавляя более узкого временного оттенка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: רָאִיתִי
  choice: Я увидел
  rationale: Сохраняет совершенный вид древнееврейской формы и смысл завершённого наблюдения, результат которого значим в момент речи.
- source_word: הָעָם הַזֶּה
  choice: этот народ
  rationale: Сохраняет собирательное единственное число и указательное значение исходного выражения.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Передаёт маркер привлечения внимания и риторический вес последующей оценки.
- source_word: קְשֵׁה עֹרֶף
  choice: упрямый
  rationale: Естественно передаёт значение древнееврейской метафоры в современном русском языке; буквальный образ сохранён в сноске.
- source_word: הוּא
  choice: он
  rationale: Местоимение согласовано с существительным мужского рода «народ» и сохраняет отсылку к собирательному единственному числу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В исходном тексте прямо употреблено личное имя Бога. Транслитерация «Яхве» сохраняет это имя, не подменяя его титулом и не принимая позднюю вокализацию «Иегова».
