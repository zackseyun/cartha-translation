source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שִׂ֥ימוּ אִישׁ חַרְבּ֖/וֹ עַל יְרֵכ֑/וֹ עִבְר֨וּ וָ/שׁ֜וּבוּ מִ/שַּׁ֤עַר לָ/שַׁ֨עַר֙ בַּֽ/מַּחֲנֶ֔ה וְ/הִרְג֧וּ אִֽישׁ אֶת אָחִ֛י/ו וְ/אִ֥ישׁ אֶת רֵעֵ֖/הוּ וְ/אִ֥ישׁ אֶת קְרֹבֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/027.yaml
  text: 'And he said to them[a], “Thus says Yahweh, the God of Israel: Each man, put his sword on his thigh. Pass through and return from gate to gate throughout the camp, and each man kill his brother, and each man his companion, and each man his neighbor.”'
translation:
  language: ru
  text: 'И сказал он им: «Так говорит Яхве, Бог Израиля: пусть каждый прикрепит свой меч к бедру. Пройдите туда и обратно, от ворот до ворот, по всему стану, и пусть каждый убьёт своего брата, каждый — своего друга, каждый — своего близкого[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «того, кто ему близок»; возможно также: «своего родственника» или «близкого родича».'
    reason: Сохраняется широкий смысл קְרֹבוֹ, который нельзя с уверенностью свести только к соседу или только к родственнику.
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: И сказал он им
  rationale: Сохраняет обычное древнееврейское повествовательное продолжение и не уточняет названного в ближайшем контексте говорящего.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная и узнаваемая по-русски передача формулы авторитетного возвещения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: שִׂימוּ אִישׁ חַרְבּוֹ עַל יְרֵכוֹ
  choice: пусть каждый прикрепит меч к бедру
  rationale: Передаёт как буквальный образ, так и практический смысл повеления вооружиться; «прикрепит» естественнее современного буквального «положит».
- source_word: עִבְרוּ וָשׁוּבוּ
  choice: пройдите туда и обратно
  rationale: Сохраняет оба повелительных глагола и выраженную ими направленность движения без архаического оборота.
- source_word: מִשַּׁעַר לָשַׁעַר בַּמַּחֲנֶה
  choice: от ворот до ворот, по всему стану
  rationale: Передаёт распределительное движение через весь стан; «стан» соответствует библейскому контексту и остаётся понятным в литературном русском.
- source_word: וְהִרְגוּ
  choice: и пусть каждый убьёт
  rationale: Прямо передаёт повеление лишить жизни, не смягчая его эвфемизмом.
- source_word: אִישׁ אֶת אָחִיו וְאִישׁ אֶת רֵעֵהוּ וְאִישׁ אֶת קְרֹבוֹ
  choice: каждый — своего брата, каждый — своего друга, каждый — своего близкого
  rationale: Сохраняет трёхкратное распределительное אִישׁ и напряжённое перечисление всё более широкого круга близких связей.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Распределительное אִישׁ в обращении к левитам
  choice: каждый
  alternative: все
  rationale: «Каждый» сохраняет индивидуальную направленность и трёхкратный повтор исходного текста, при этом русский контекст ясно подразумевает мужчин-левитов.
- issue: Объём значения קְרֹבוֹ
  choice: своего близкого[a]
  alternative: своего родственника
  rationale: Еврейское слово обозначает того, кто близок, и может указывать как на близкого человека вообще, так и на родственника; основной текст не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксический повтор намеренно сохранён ради силы и суровости повеления; архаизмы вроде «препояшьте» и «поразите» не использованы.
