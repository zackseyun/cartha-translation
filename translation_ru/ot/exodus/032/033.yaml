  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה מִ֚י אֲשֶׁ֣ר חָֽטָא לִ֔/י אֶמְחֶ֖/נּוּ מִ/סִּפְרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/033.yaml
  text: And Yahweh said to Moses[a], “Whoever has sinned against me[b], I will blot him out of my book.”
translation:
  language: ru
  text: 'И Яхве сказал Моисею: «Кто согрешил против Меня, того Я сотру[a] из Моей книги[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вычеркну».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «Моя книга» может означать Божью запись о тех, кто находится под Его попечением; некоторые понимают его более конкретно как «книгу жизни».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И … сказал
  rationale: Последовательная форма с וַ продвигает повествование; союз «и» естественно сохраняет связность еврейского рассказа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: אֶל מֹשֶׁה
  choice: Моисею
  rationale: Русское управление глагола «сказать» дательным падежом естественно передаёт направление речи, выраженное אֶל.
- source_word: מִי אֲשֶׁר
  choice: кто
  rationale: 'В данном неопределённо-относительном обороте русское «кто» естественно выражает обобщающее значение: тот, кто совершил названное действие.'
- source_word: חָטָא לִי
  choice: согрешил против Меня
  rationale: Совершенный вид отражает завершённый проступок в контексте, а «против Меня» ясно передаёт направленность греха, выраженную לִי.
- source_word: אֶמְחֶנּוּ
  choice: того Я сотру
  rationale: Глагол מחה обозначает стирание или удаление записи; «сотру» сохраняет образ удаления из книги. Указательное «того» естественно передаёт мужской единственный суффикс и связывает его с предшествующим «кто».
- source_word: מִסִּפְרִי
  choice: из Моей книги
  rationale: Предлог מן после глагола стирания естественно передаётся как «из», а סֵפֶר оставлено общим словом «книга» без уточнения характера Божьей записи.
theological_decisions:
- issue: Что означает «Моя книга»
  choice: Сохранить метафору «Моя книга» без уточнения её содержания.
  alternative: «книга жизни», «список живых» или «заветный список»
  rationale: Еврейский текст говорит только «Моя книга». Более узкая формулировка разрешила бы неоднозначность, которой сам стих не разрешает.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным строем. Синтаксис «кто…, того…» естественно сохраняет обобщение и мужской единственный референт исходного текста; местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
