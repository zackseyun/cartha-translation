  text: So all the people took off the gold rings that were in their ears and brought them to Aaron[a][b].
translation:
  language: ru
  text: И весь народ снял с себя золотые кольца, которые были у них в ушах, и принёс их Аарону[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сорвал с себя» золотые кольца. Еврейский глагол может подразумевать резкое или энергичное снятие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּרְקוּ
  choice: снял с себя
  rationale: Форма хитпаэль глагола פרק обозначает снятие украшений с самих себя. «Снял с себя» естественно передаёт возвратный оттенок; согласование в единственном числе сохраняет собирательное значение слова «народ».
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Прямое и естественное обозначение всей собравшейся общины; в русском языке слово «народ» требует сказуемого в единственном числе.
- source_word: נִזְמֵי הַזָּהָב
  choice: золотые кольца
  rationale: נֶזֶם обозначает кольцевое украшение, носимое в ухе или носу. Более широкое «кольца» сохраняет лексическую неоднозначность, тогда как следующая фраза уточняет место ношения.
- source_word: אֲשֶׁר בְּאָזְנֵיהֶם
  choice: которые были у них в ушах
  rationale: Передаёт относительную конструкцию и местонахождение украшений естественным современным русским языком.
- source_word: וַיָּבִיאוּ אֶל אַהֲרֹן
  choice: и принёс их Аарону
  rationale: Глагол означает «принести»; местоимение «их» естественно восстанавливает явно подразумеваемый объект — кольца. Единственное число согласовано с собирательным существительным «народ».
