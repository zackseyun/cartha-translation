  text: וַ/יַּֽעֲשׂ֥וּ בְנֵֽי לֵוִ֖י כִּ/דְבַ֣ר מֹשֶׁ֑ה וַ/יִּפֹּ֤ל מִן הָ/עָם֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּ/שְׁלֹ֥שֶׁת אַלְפֵ֖י אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/028.yaml
  text: And the sons of Levi did according to the word of Moses[a], and about three thousand men from among the people fell that day.
translation:
  language: ru
  text: Сыны Левия поступили по слову Моисея, и в тот день из народа пало около трёх тысяч мужчин[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Глагол «пасть» часто употребляется в значении «погибнуть» или «быть сражённым»; возможный перевод: «было убито».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: поступили
  rationale: Передаёт широкое значение עשה в сочетании с оборотом «по слову Моисея» и естественно выражает исполнение сказанного.
- source_word: בְנֵי לֵוִי
  choice: сыны Левия
  rationale: Сохраняет родственное выражение еврейского текста и при этом понятно обозначает потомков Левия.
- source_word: כִּדְבַר מֹשֶׁה
  choice: по слову Моисея
  rationale: Близко передаёт еврейскую конструкцию; «слово» в данном контексте означает данное Моисеем повеление.
- source_word: וַיִּפֹּל
  choice: пало
  rationale: Сохраняет употреблённый в оригинале идиоматический глагол «пасть», не заменяя его более конкретным «были убиты».
- source_word: מִן הָעָם
  choice: из народа
  rationale: 'Передаёт партитивное значение предлога מן: погибшие составляли часть народа.'
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественный современный русский эквивалент временного оборота.
- source_word: כִּשְׁלֹשֶׁת אַלְפֵי אִישׁ
  choice: около трёх тысяч мужчин
  rationale: «Около» передаёт приблизительность, выраженную приставкой כ, а «мужчин» точно отражает אִישׁ.
theological_decisions:
- issue: Передача сообщения о погибших в контексте суда
  choice: из народа пало около трёх тысяч мужчин
  alternative: из народа было убито около трёх тысяч мужчин
  rationale: Еврейский текст употребляет глагол «пасть», а не прямо «убить». Основной перевод сохраняет эту формулировку и её смысловую напряжённость, не конкретизируя способ гибели сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Обороты «сыны Левия» и «по слову Моисея» сохраняют образность оригинала, оставаясь понятными; порядок слов сделан естественным для русского повествования.
