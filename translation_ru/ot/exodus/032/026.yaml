base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/026.yaml
  text: Then Moses stood at the gate of the camp and said[a], “Whoever is for Yahweh[b], come to me.” And all the sons of Levi gathered to him.
translation:
  language: ru
  text: 'Тогда Моисей встал у ворот стана и сказал: «Кто за Яхве — ко мне!»[a] И собрались к нему все сыны Левия.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Кто за Яхве? Ко мне!» Краткое «ко мне» подразумевает призыв подойти к Моисею.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все левиты». Буквально: «все сыны Левия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: встал
  rationale: Обычное повествовательное значение עמד; перевод не добавляет более формального оттенка «занял место».
- source_word: בְּשַׁעַר הַמַּחֲנֶה
  choice: у ворот стана
  rationale: שַׁעַר обозначает ворота или проход; русское «у ворот» естественно передаёт местонахождение, сохраняя конкретный образ.
- source_word: מִי לַיהוָה
  choice: кто за Яхве
  rationale: Предлог ל выражает здесь принадлежность или верность стороне Яхве. Краткая формула сохраняет призывный характер и исходную эллиптичность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֵלָי
  choice: ко мне
  rationale: Сохранена резкая эллиптическая форма еврейского призыва без добавления глагола движения в основном тексте.
- source_word: וַיֵּאָסְפוּ
  choice: собрались
  rationale: Нифаль глагола אסף здесь означает собраться; нейтральное «собрались» не привносит военного оттенка.
- source_word: אֵלָיו
  choice: к нему
  rationale: Прямо передаёт направление движения к Моисею.
- source_word: כָּל בְּנֵי לֵוִי
  choice: все сыны Левия
  rationale: Сохраняет буквальное родоплеменное обозначение «сыны Левия»; более гладкий вариант «все левиты» дан в примечании.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Смысл формулы מִי לַיהוָה
  choice: Кто за Яхве
  alternative: Кто принадлежит Яхве; Кто на стороне Яхве
  rationale: Формулировка сохраняет возможные оттенки верности, принадлежности и поддержки, не сводя выражение только к одному из них.
- issue: Родоплеменное обозначение בְּנֵי לֵוִי
  choice: все сыны Левия
  alternative: все левиты
  rationale: Исходный текст использует мужское родственное обозначение; его сохранение передаёт форму оригинала и уместно в данном контексте.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Стан» и «сыны Левия» сохраняют конкретику и родоплеменной колорит оригинала; резкий призыв Моисея оставлен эллиптическим.
