  source_fidelity: 'Смысловые соответствия в целом точны: сохранены буквальные образы «на руке» и «между глазами», целевое значение לְמַעַן, образ «закон ... на устах» и объяснительное כִּי. Однако «пусть это будет» придаёт фразе оттенок пожелания или повеления, которого в данном контексте не требует еврейская форма; более точно передать её как констатацию будущего назначения: «И это будет для тебя...»'
