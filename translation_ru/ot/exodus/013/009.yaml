  text: וְ/הָיָה֩ לְ/ךָ֨ לְ/א֜וֹת עַל יָדְ/ךָ֗ וּ/לְ/זִכָּרוֹן֙ בֵּ֣ין עֵינֶ֔י/ךָ לְמַ֗עַן תִּהְיֶ֛ה תּוֹרַ֥ת יְהוָ֖ה בְּ/פִ֑י/ךָ כִּ֚י בְּ/יָ֣ד חֲזָקָ֔ה הוֹצִֽאֲ/ךָ֥ יְהֹוָ֖ה מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/009.yaml
  text: And it shall be for you as a sign on your hand and as a memorial between your eyes[a], so that the law of Yahweh may be in your mouth[c][b]; for with a strong hand Yahweh brought you out of Egypt.
translation:
  language: ru
  text: И это будет для тебя знаком на руке и напоминанием между глазами[a], чтобы закон Яхве[b] был у тебя на устах, ибо сильной рукой[c] Яхве вывел тебя из Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «между глазами» может идиоматически означать «на лбу»; в основном тексте сохранена буквальная еврейская формулировка.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наставление Яхве». Еврейское слово тора может означать как «закон», так и «наставление».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «могучей рукой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И пусть это будет
  rationale: В данном наставительном контексте форма имеет направленное в будущее, предписывающее значение. Русское «пусть это будет» естественно передаёт назначение обряда и сохраняет связь с предшествующим контекстом.
- source_word: לְאוֹת
  choice: знаком
  rationale: אוֹת обозначает знак или отличительный символ. «Знак» сохраняет широту значения и не навязывает исключительно буквальное либо исключительно символическое понимание.
- source_word: עַל יָדְךָ
  choice: на руке
  rationale: Сохранён буквальный образ еврейского текста. Перевод не вводит прямого указания на более позднюю практику ношения тфилин.
- source_word: וּלְזִכָּרוֹן
  choice: напоминанием
  rationale: זִכָּרוֹן означает то, что служит памятованию. «Напоминание» ясно и естественно по-русски, при этом выражает назначение знака — поддерживать память об избавлении.
- source_word: בֵּין עֵינֶיךָ
  choice: между глазами
  rationale: Буквальная формулировка сохраняет конкретный образ и не устраняет возможность идиоматического понимания как указания на лоб.
- source_word: תּוֹרַת יְהוָה
  choice: закон Яхве
  rationale: תּוֹרָה может означать как закон, так и наставление. В заветном контексте Исхода «закон» уместен и узнаваем; более широкое значение отмечено в сноске.
- source_word: בְּפִיךָ
  choice: был у тебя на устах
  rationale: Еврейское выражение буквально означает «в твоих устах». Русский оборот «на устах» естественно передаёт мысль о произнесении и постоянном словесном памятовании.
- source_word: בְּיָד חֲזָקָה
  choice: сильной рукой
  rationale: Перевод близко следует словам יָד «рука» и חֲזָקָה «сильная». Традиционный вариант «могучей рукой» приведён в сноске.
- source_word: הוֹצִאֲךָ
  choice: вывел тебя
  rationale: Каузативная форма глагола יצא означает «вывести, заставить выйти». «Вывел» точно и естественно передаёт избавление из Египта.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой научной транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Буквальное или истолковывающее воспроизведение образов руки и пространства между глазами
  choice: Сохранить «на руке» и «между глазами» в основном тексте.
  alternative: Передать как прямое указание на повязывание на руку и ношение на лбу либо истолковать весь образ только метафорически.
  rationale: Сам стих использует конкретные образы, но не называет позднейшие ритуальные предметы и не определяет однозначно степень буквальности. Буквальный перевод сохраняет эту открытость.
- issue: Значение תּוֹרָה
  choice: Перевести в основном тексте как «закон».
  alternative: «Наставление» или «Тора».
  rationale: «Закон» соответствует заветному контексту и устойчивому русскому словоупотреблению, однако семантическая широта еврейского слова не скрыта и отражена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Оборот «на устах» сохраняет образность оригинала, оставаясь понятным; синтаксис сделан плавным и пригодным для публичного чтения.
