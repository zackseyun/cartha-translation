  yaml_path: translation/ot/exodus/013/004.yaml
  text: Today you are going out[a], in the month of Abib.
translation:
  language: ru
  text: Сегодня вы выходите в месяце Авиве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Авив — название месяца; это слово связано со стадией созревания зерна весной.
    reason: cultural_note
lexical_decisions:
- source_word: הַיּוֹם
  choice: Сегодня
  rationale: Сочетание с артиклем употреблено обстоятельственно и обозначает нынешний день исхода; «сегодня» естественно передаёт непосредственность обращения.
- source_word: אַתֶּם
  choice: вы
  rationale: Личное местоимение второго лица мужского рода множественного числа обращено к Израилю; русское «вы» точно передаёт число без лишних уточнений.
- source_word: יֹצְאִים
  choice: выходите
  rationale: Причастие породы qal во множественном числе выражает происходящее или непосредственно предстоящее действие. Настоящее время «выходите» сохраняет эту аспектуальную открытость и направление движения из Египта.
- source_word: בְּחֹדֶשׁ
  choice: в месяце
  rationale: Предлог ב с существительным «месяц» вводит календарное указание времени; буквальное «в месяце» естественно по-русски.
- source_word: הָאָבִיב
  choice: авиве
  rationale: Название или обозначение месяца передано транслитерацией, а не истолковано как «весна» или «колосья». Строчная буква соответствует современному русскому написанию названий месяцев.
