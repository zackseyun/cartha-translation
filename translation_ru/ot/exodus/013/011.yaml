  text: וְ/הָיָ֞ה כִּֽי יְבִֽאֲ/ךָ֤ יְהוָה֙ אֶל אֶ֣רֶץ הַֽ/כְּנַעֲנִ֔י כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע לְ/ךָ֖ וְ/לַֽ/אֲבֹתֶ֑י/ךָ וּ/נְתָנָ֖/הּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/011.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], as he swore to you and to your fathers, and gives it to you[b],
translation:
  language: ru
  text: И когда[a] Яхве введёт тебя в землю хананеев, как Он поклялся тебе и твоим отцам[b], и даст её тебе,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И будет, когда».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «предкам»; буквально: «отцам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Оборот вводит будущее обстоятельство. «И когда» естественно звучит по-русски и сохраняет временное и перспективное значение, тогда как буквальное «И будет, когда» тяжеловесно.
- source_word: יְבִיאֲךָ
  choice: введёт тебя
  rationale: Каузативная форма глагола בוא означает «привести, ввести». В сочетании с אֶל אֶרֶץ естественное русское соответствие — «введёт тебя в землю».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי
  choice: в землю хананеев
  rationale: Сохраняет обозначенное предлогом направление движения и прямо передаёт еврейское выражение, не заменяя его географическим названием «Ханаан».
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: как Он поклялся
  rationale: Точно передаёт сравнение с данным прежде клятвенным обещанием; совершенный вид естественен для предшествующего действия.
- source_word: לְךָ וְלַאֲבֹתֶיךָ
  choice: тебе и твоим отцам
  rationale: Сохраняет повторное отношение дательного падежа и буквальное родовое обозначение «отцы», при этом возможное более широкое значение отмечено в сноске.
- source_word: וּנְתָנָהּ לָךְ
  choice: и отдаст её тебе
  rationale: Продолжает будущее условно-временное построение. Местоимение женского рода относится к «земле»; «отдаст» естественно выражает передачу земли во владение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте употреблено личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сглажен без устранения будущей направленности исходного текста; запятая в конце сохранена, поскольку стих образует вводную часть предложения, продолжающегося далее.
