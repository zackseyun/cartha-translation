lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Соблюдай
  rationale: В законодательном и культовом контексте שׁמר естественно передаётся глаголом «соблюдать», выражающим верность предписанию и продолжительность исполнения.
- source_word: הַחֻקָּה הַזֹּאת
  choice: это установление
  rationale: חֻקָּה обозначает установленное предписание. «Установление» сохраняет достоинство правового регистра и звучит естественнее для современного русского читателя, чем более архаичное «устав».
- source_word: לְמוֹעֲדָהּ
  choice: в назначенное для него время
  rationale: מוֹעֵד — назначенное время или установленный срок; местоименный суффикс соотносит это время с данным установлением. Формулировка явно передаёт обе части значения.
- source_word: מִיָּמִים יָמִימָה
  choice: из года в год
  rationale: Буквально выражение означает «от дней к дням», но в контексте ежегодного празднования это идиома регулярности по годам. Русское «из года в год» точно и естественно передаёт контекстуальный смысл; буквальная форма отмечена в сноске.
