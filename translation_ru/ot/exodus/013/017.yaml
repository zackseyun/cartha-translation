  text: וַ/יְהִ֗י בְּ/שַׁלַּ֣ח פַּרְעֹה֮ אֶת הָ/עָם֒ וְ/לֹא נָחָ֣/ם אֱלֹהִ֗ים דֶּ֚רֶךְ אֶ֣רֶץ פְּלִשְׁתִּ֔ים כִּ֥י קָר֖וֹב ה֑וּא כִּ֣י אָמַ֣ר אֱלֹהִ֗ים פֶּֽן יִנָּחֵ֥ם הָ/עָ֛ם בִּ/רְאֹתָ֥/ם מִלְחָמָ֖ה וְ/שָׁ֥בוּ מִצְרָֽיְמָ/ה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/017.yaml
  text: When Pharaoh let the people go[a], God did not lead them by the way of the land of the Philistines, though it was near; for God said[b], “Lest the people change their minds when they see war and return to Egypt.”
translation:
  language: ru
  text: 'Когда фараон отпустил народ, Бог не повёл их по дороге через землю филистимлян, хотя этот путь был близок[a], потому что Бог сказал: «Как бы народ, увидев войну, не передумал[b] и не возвратился в Египет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что этот путь был близок». Еврейский союз כִּי может иметь как причинное, так и уступительное значение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не пожалел об этом» или «не изменил своего решения». Еврейский глагол здесь обозначает перемену намерения перед лицом войны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁלַּח
  choice: когда фараон отпустил народ
  rationale: Предлог ב при инфинитиве שׁלח выражает временное обстоятельство; в данном контексте שׁלח означает отпустить, освободить народ.
- source_word: נָחָם
  choice: не повёл их
  rationale: Глагол נחה означает вести или направлять; форма с местоименным дополнением естественно передаётся по-русски как «повёл их».
- source_word: דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים
  choice: по дороге через землю филистимлян
  rationale: Так передаются и значение דֶּרֶךְ «дорога, путь», и географическая конструкция «земля филистимлян»; «через» делает маршрут ясным по-русски.
- source_word: כִּי קָרוֹב הוּא
  choice: хотя она была близка
  rationale: 'כִּי допускает здесь уступительное прочтение: Бог не избрал эту дорогу, несмотря на её близость. Согласование «она» относится к дороге.'
- source_word: פֶּן יִנָּחֵם
  choice: как бы … не передумал
  rationale: פֶּן вводит опасение, а Niphal נחם обозначает перемену решения или намерения, а не обязательно нравственное раскаяние.
- source_word: בִּרְאֹתָם מִלְחָמָה
  choice: увидев войну
  rationale: Инфинитив с ב выражает обстоятельство времени; מִלְחָמָה обозначает войну или вооружённое столкновение. Формулировка сохраняет образ оригинала.
- source_word: וְשָׁבוּ מִצְרָיְמָה
  choice: и не возвратился в Египет
  rationale: שׁוב означает возвращаться, а направительный суффикс в מִצְרָיְמָה передаётся предлогом «в».
theological_decisions:
- issue: Причина, по которой Бог не повёл народ путём через землю филистимлян
  choice: Сохранить прямо названное в тексте Божье предвидение возможной перемены решения народа при виде войны.
  alternative: Представить это как догадку рассказчика или как реактивное изменение Божьего плана.
  rationale: Фраза «Бог сказал» относит объяснение к самому Богу; перевод не добавляет утверждений о природе Божьего знания и не снимает заложенное в повествовании напряжение.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. «Как бы … не» естественно передаёт отрицательное опасение, выраженное פֶּן. Единственное число «народ … передумал … возвратился» сохраняет грамматическую форму еврейского собирательного существительного.
