  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת עַצְמ֥וֹת יוֹסֵ֖ף עִמּ֑/וֹ כִּי֩ הַשְׁבֵּ֨עַ הִשְׁבִּ֜יעַ אֶת בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְ/כֶ֔ם וְ/הַעֲלִיתֶ֧ם אֶת עַצְמֹתַ֛/י מִ/זֶּ֖ה אִתְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/019.yaml
  text: And Moses took Joseph’s bones with him[a], because Joseph had made the sons of Israel solemnly swear, saying, “God will surely attend to you, and you shall bring up my bones from here with you.”
translation:
  language: ru
  text: 'Моисей взял с собой кости Иосифа, потому что Иосиф строго обязал сынов Израиля дать клятву, сказав: «Бог непременно позаботится о вас[a], и вынесите мои кости отсюда с собой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог непременно посетит вас». Еврейское выражение может обозначать решительное вмешательство Бога ради своего народа.'
    reason: Лексическая альтернатива для פָּקֹד יִפְקֹד, сохраняющая буквальный образ «посещения» и его контекстуальный смысл.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычный повествовательный глагол לקח; «взял» прямо и естественно передаёт действие в данном контексте.
- source_word: עַצְמוֹת
  choice: кости
  rationale: Конкретное значение исходного слова сохранено; более общее «останки» было бы толкованием.
- source_word: עִמּוֹ
  choice: с собой
  rationale: В русском контексте, где субъект — Моисей, возвратная форма естественно передаёт сопровождение.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: взял ... торжественную клятву
  rationale: Сочетание абсолютного инфинитива с личной формой в породе хифиль выражает побуждение к клятве и усиление; эта формулировка передаёт оба оттенка современным русским языком.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранён семейно-родовой образ еврейского выражения, обозначающего потомков Израиля, без нейтрализации до «израильтян».
- source_word: לֵאמֹר
  choice: сказав
  rationale: Естественная русская формула введения прямой речи.
- source_word: פָּקֹד יִפְקֹד
  choice: непременно позаботится
  rationale: Усилительная конструкция выражает несомненность Божьего деятельного внимания; «позаботится» понятно современному читателю и не сводит смысл к простому наблюдению.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В контексте это обычное обозначение Бога Израиля в единственном числе.
- source_word: וְהַעֲלִיתֶם
  choice: и тогда вынесите
  rationale: Форма в контексте клятвы имеет последовательно-будущее и обязательное значение; повелительное «вынесите» естественно передаёт обязательство, а «тогда» обозначает связь с грядущим Божьим вмешательством.
- source_word: עַצְמֹתַי
  choice: мои кости
  rationale: Сохранена конкретная личная формулировка оригинала.
- source_word: מִזֶּה
  choice: отсюда
  rationale: Естественно передаёт указание на место, то есть Египет.
- source_word: אִתְּכֶם
  choice: с собой
  rationale: Естественная русская передача сопровождения при подлежащем второго лица; повтор мотива сопровождения сохранён.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Фамильная метафора оригинала сохранена; выражение относится к потомкам Израиля как к народу, но буквально называет их «сынами».
- issue: Передача פָּקֹד יִפְקֹד אֱלֹהִים אֶתְכֶם
  choice: Бог непременно позаботится о вас
  alternative: Бог непременно посетит вас; Бог непременно обратит на вас внимание
  rationale: Выражение обещает несомненное деятельное вмешательство Бога. Основной текст передаёт это ясно, а сноска сохраняет буквальную и богословски значимую возможность «посетит».
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис остаётся доступным, конкретное слово «кости» и повтор «с собой» сохраняют образность оригинала; архаизмы избегаются, кроме устойчивого библейского выражения «сыны Израиля».
