  text: וַֽ/יהוָ֡ה הֹלֵךְ֩ לִ/פְנֵי/הֶ֨ם יוֹמָ֜ם בְּ/עַמּ֤וּד עָנָן֙ לַ/נְחֹתָ֣/ם הַ/דֶּ֔רֶךְ וְ/לַ֛יְלָה בְּ/עַמּ֥וּד אֵ֖שׁ לְ/הָאִ֣יר לָ/הֶ֑ם לָ/לֶ֖כֶת יוֹמָ֥ם וָ/לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/021.yaml
  text: And Yahweh was going before them by day in a pillar of cloud to lead them on the way[a], and by night in a pillar of fire to give them light, so that they could travel by day and by night.
translation:
  language: ru
  text: 'Яхве шёл впереди них: днём — в облачном столпе, чтобы вести их по пути, а ночью — в огненном столпе, чтобы светить им, дабы они могли идти днём и ночью.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH), собственное имя Бога; традиционно также передаётся как «Господь».
    reason: Поясняет передачу тетраграмматона и традиционную альтернативу.
lexical_decisions:
- source_word: וַיהוָה
  choice: А Яхве
  rationale: Тетраграмматон передан транслитерацией «Яхве», чтобы сохранить личное имя Бога; וַ передано связующим «А», естественно продолжающим повествование.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: шёл впереди них
  rationale: Причастие выражает продолжительное действие в прошлом, а לִפְנֵיהֶם — пространственное движение впереди народа.
- source_word: יוֹמָם בְּעַמּוּד עָנָן
  choice: днём — в столпе облачном
  rationale: Сохранены временной параллелизм и традиционный, понятный образ; בְּ передано как «в», указывая на явление Бога в видимой форме столпа.
- source_word: לַנְחֹתָם הַדֶּרֶךְ
  choice: чтобы вести их по пути
  rationale: Инфинитив выражает цель; נחה означает вести или направлять, а הַדֶּרֶךְ естественно передаётся здесь как «по пути».
- source_word: וְלַיְלָה בְּעַמּוּד אֵשׁ
  choice: а ночью — в столпе огненном
  rationale: Фраза построена параллельно первой половине стиха и сохраняет конкретный образ огненного столпа.
- source_word: לְהָאִיר לָהֶם
  choice: чтобы светить им
  rationale: Каузативная форма אור обозначает освещение; «светить им» близко к форме оригинала и естественно по-русски.
- source_word: לָלֶכֶת יוֹמָם וָלָיְלָה
  choice: дабы они могли идти и днём и ночью
  rationale: Инфинитив передаёт цель или возможность, создаваемую светом. «Идти» сохраняет простоту исходного глагола, а «и… и…» подчёркивает обе части времени.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное заветное имя Бога. «Яхве» наиболее прямо передаёт его общепринятую научную реконструкцию, не заменяя имя титулом; примечание сообщает о еврейском написании и традиционной замене.
- issue: Характер присутствия Яхве в столпах
  choice: «в столпе» без дополнительного объяснения
  alternative: «посредством столпа» или явное отождествление Бога со столпом
  rationale: Предлог בְּ допускает оттенки местонахождения или средства. Буквально-пространственная формулировка сохраняет образ и не решает сверх текста вопрос о точном отношении Яхве к столпу.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Двоеточие и тире делают параллель «днём — ночью» ясным, не меняя структуры мысли. Союз «дабы» выбран для разграничения ближайших целей двух столпов и итоговой возможности идти в любое время.
