  source_fidelity: 'Смысл передан верно: предписывается есть маццот в течение всех семи дней, а квасное и закваска не должны находиться у адресата; во второй части явно охвачены все его пределы. Однако оборот «пусть у тебя не будет видно» в современном русском звучит неестественно и неудачно передаёт еврейский юридико-ритуальный идиоматический смысл наличия/присутствия.'
