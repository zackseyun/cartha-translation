  terminology: «Пресный хлеб», «ничего квасного» и «закваска» удачно сохраняют различие между מַצּוֹת, חָמֵץ и שְׂאֹר. «Закваска» здесь точнее и исторически уместнее, чем «дрожжи». «Пределы» приемлемо передаёт גְּבוּל, не сужая его до личной собственности.
