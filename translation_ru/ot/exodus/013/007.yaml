translation_notes:
  register: Современный литературный русский язык с умеренно торжественным нормативным звучанием. Единственное число «у тебя», «твоих» сохранено по еврейскому тексту. Различие между חָמֵץ (квасная пища или всё квасное) и שְׂאֹר (закваска как средство брожения) передано явно.
