  yaml_path: translation/ot/exodus/013/007.yaml
  text: Unleavened bread shall be eaten throughout the seven days[a], and no leaven shall be seen with you[b], and no yeast shall be seen with you within all your territory.
translation:
  language: ru
  text: Все семь дней следует есть пресный хлеб[a]. У тебя не должно быть ничего квасного[b], и во всех твоих пределах не должно быть закваски.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пресные хлебы».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не должно быть видно у тебя квасного». Это выражение подразумевает, что квасная пища не должна оставаться во владении или пределах адресата.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצּוֹת
  choice: пресный хлеб
  rationale: В контексте Пасхи обозначает хлеб без закваски; это естественное и понятное современному русскому читателю выражение.
- source_word: יֵאָכֵל
  choice: следует есть
  rationale: Передаёт пассивную форму и нормативный смысл, не усиливая её до прямого повеления.
- source_word: אֵת שִׁבְעַת הַיָּמִים
  choice: все семь дней
  rationale: Винительный длительности охватывает весь семидневный период.
- source_word: יֵרָאֶה לְךָ
  choice: не будет видно у тебя
  rationale: 'Сохраняет буквальный образ еврейского выражения и его контекстуальный смысл: предмет не должен находиться во владении или пределах адресата.'
- source_word: חָמֵץ
  choice: ничего квасного
  rationale: Обозначает заквашенное или квасное изделие в широком смысле и сохраняет отличие от שְׂאֹר — самой закваски.
- source_word: שְׂאֹר
  choice: закваска
  rationale: Обозначает вещество, вызывающее брожение; «закваска» исторически и контекстуально точнее современного «дрожжи» и сохраняет отличие от квасной пищи.
- source_word: בְּכָל גְּבֻלֶךָ
  choice: во всех твоих пределах
  rationale: Передаёт всю область, находящуюся в границах владения или обитания адресата, не сужая значение до частной собственности.
