    rationale: 'Оборот «всякого, кто первым открывает утробу у сынов Израиля» неестественен по-русски: обстоятельство «у сынов Израиля» оказывается непосредственно связано с «утробу». Кроме того, последующее «у человека и у скота» создаёт двусмысленную и стилистически тяжёлую цепочку.'
  revised_text: 'Посвяти Мне всякого первенца — всё, что впервые выходит из утробы среди сынов Израиля, из людей и из скота: оно Моё.'
