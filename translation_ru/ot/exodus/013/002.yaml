review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: повеление посвящать Богу первенцев, определённых как тех, кто первым выходит из утробы, и заключительное утверждение Божьей принадлежности сохранены. Однако «всякого, кто первым открывает утробу у сынов Израиля» синтаксически тяжеловесно и создаёт неудачную связь «открывает утробу у сынов».'
  naturalness: «У человека и у скота» понятно, но в сочетании с «у сынов Израиля» повтор предлога «у» делает фразу неестественной и может звучать так, словно скот входит в число «сынов Израиля». Предлагаемая редакция сохраняет библейскую сжатость, но яснее разграничивает общину Израиля и категории людей/скота.
  terminology: «Посвяти Мне», «первенца» и «скота» уместны в современном литературном русском с умеренно библейским регистром. Собирательное «люди» корректно передаёт אדם в противопоставлении скоту и не вносит указания на пол. Местоимение «оно» относится к формуле «всё, что…» и естественно передаёт еврейское «оно Моё».
