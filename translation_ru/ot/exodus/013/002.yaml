  text: קַדֶּשׁ לִ֨/י כָל בְּכ֜וֹר פֶּ֤טֶר כָּל רֶ֨חֶם֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה לִ֖/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/002.yaml
  text: Consecrate to me every firstborn[a], the first to open every womb among the sons of Israel, among man and among beast; it is mine.
translation:
  language: ru
  text: 'Посвяти Мне всякого первенца — всё, что впервые выходит из утробы среди сынов Израиля, из людей и из скота: оно Моё.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַדֶּשׁ
  choice: Посвяти
  rationale: Императив означает отделить для Бога как святыню. «Посвяти» естественно звучит по-русски и сохраняет сакральный смысл действия.
- source_word: לִי
  choice: Мне
  rationale: Предлог указывает на посвящение Богу; с глаголом «посвяти» дательный падеж наиболее естественен.
- source_word: כָל בְּכוֹר
  choice: каждого первенца
  rationale: בכור означает «первенец». Слово «мужского пола» в еврейском тексте прямо отсутствует и потому не добавлено.
- source_word: פֶּטֶר כָּל רֶחֶם
  choice: всякого, кто первым открывает утробу
  rationale: Фраза уточняет понятие первенца как первого вышедшего из материнской утробы. Формулировка сохраняет образ оригинала и понятна современному читателю.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: у сынов Израиля
  rationale: Сохраняется традиционная и формально близкая передача בני ישראל; предлог «у» естественно связывает эту группу с рождением первенцев.
- source_word: בָּאָדָם
  choice: у человека
  rationale: Собирательное אָדָם обозначает здесь человеческий род в противопоставлении животным; русское «человек» сохраняет это противопоставление без искусственного ограничения мужчинами.
- source_word: וּבַבְּהֵמָה
  choice: и у скота
  rationale: בְּהֵמָה в данном правовом контексте естественно обозначает домашних животных, скот. Повтор «у ... и у ...» передаёт параллельные еврейские предлоги.
- source_word: לִי הוּא
  choice: он Мой
  rationale: Заключительная фраза выражает принадлежность Богу. Мужской род местоимения согласован с «первенцем» и сохраняет лаконичность оригинала.
theological_decisions:
- issue: Собирательное אָדָם в противопоставлении בְּהֵמָה
  choice: у человека
  alternative: среди людей / у человеческого рода
  rationale: В контексте אָדָם представляет категорию людей в целом, а не только мужчин. «У человека и у скота» естественно сохраняет категориальное противопоставление и грамматическую форму единственного числа.
- issue: Пол первенца в כָל־בְּכוֹר
  choice: не добавлять «мужского пола»
  alternative: каждого первенца мужского пола
  rationale: Хотя дальнейшее законодательство уточняет применение установления, данный стих прямо не содержит слова «мужской». Перевод не должен скрыто вносить это уточнение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Заглавные буквы в «Мне» и «Мой» применены как русская традиционная форма почтительного обозначения Бога. Синтаксис сохраняет пояснительное приложение и заключительное заявление о принадлежности.
