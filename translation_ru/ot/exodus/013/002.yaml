revisions:
- from: 'Посвяти Мне каждого первенца, всякого, кто первым открывает утробу у сынов Израиля, у человека и у скота: он Мой.'
  to: 'Посвяти Мне всякого первенца — всё, что впервые выходит из утробы среди сынов Израиля, из людей и из скота: оно Моё.'
  rationale: Редакция заменяет буквальный, но неуклюжий оборот на естественное русское определение «всё, что впервые выходит из утробы». «Среди сынов Израиля» передаёт принадлежность к израильской общине, а «из людей и из скота» сохраняет противопоставление אדם и בהמה без добавления пола или конфессионального толкования. Тире оформляет пояснительное приложение, присутствующее в еврейском тексте.
  reviewer_model: gpt-5.6-terra
