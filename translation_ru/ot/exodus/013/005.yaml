- from: И когда Яхве введёт тебя в землю хананеев, хеттов, аморреев, хиввеев и иевусеев, которую Он поклялся твоим отцам отдать тебе, — землю, текущую молоком и мёдом, — совершай это служение[a] в этом месяце.
  to: И когда Яхве введёт тебя в землю хананеев, хеттов, аморреев, хиввеев и иевусеев, о которой Он поклялся твоим отцам, что даст её тебе, — землю, текущую молоком и мёдом, — будешь совершать это служение[a] в этом месяце.
