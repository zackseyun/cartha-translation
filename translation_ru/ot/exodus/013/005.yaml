base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/005.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], the Hittites, the Amorites, the Hivites, and the Jebusites, which he swore to your fathers to give you, a land flowing with milk and honey, you shall perform this service in this month.
translation:
  language: ru
  text: И когда Яхве введёт тебя в землю хананеев, хеттов, аморреев, хиввеев и иевусеев, о которой Он поклялся твоим отцам, что даст её тебе, — землю, текущую молоком и мёдом, — будешь совершать это служение[a] в этом месяце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты перевода: «этот обряд» или «это соблюдение». Еврейское слово может обозначать предписанное действие поклонения или служения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Естественно передаёт временную конструкцию, вводящую ожидаемое в будущем событие, без тяжеловесного буквального оборота «и будет, когда».
- source_word: יְבִיאֲךָ
  choice: введёт тебя
  rationale: Каузативная форма глагола בוא означает «ввести, привести внутрь»; выбор хорошо сочетается с последующим обозначением земли.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֶל אֶרֶץ
  choice: в землю
  rationale: Выражает направленное движение внутрь страны и естественно сочетается с глаголом «введёт».
- source_word: הַכְּנַעֲנִי וְהַחִתִּי וְהָאֱמֹרִי וְהַחִוִּי וְהַיְבוּסִי
  choice: хананеев, хеттов, аморреев, хиввеев и иевусеев
  rationale: Еврейские этнонимы стоят в единственном числе как собирательные названия народов; русский перевод естественно передаёт их формами множественного числа.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: которую Он поклялся твоим отцам отдать тебе
  rationale: Сохраняет связь относительного предложения со словом «земля», лексику клятвы и адресованность обещанного дара.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: землю, текущую молоком и мёдом
  rationale: Сохраняет образность и традиционно понятный смысл еврейского выражения об изобилии и плодородии.
- source_word: וְעָבַדְתָּ
  choice: совершай
  rationale: В данном культовом контексте глагол עבד обозначает исполнение предписанного священного действия; повелительная форма естественно передаёт обязательность установления.
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: это служение
  rationale: «Служение» сохраняет связь עֲבֹדָה с деятельностью, совершаемой как религиозная обязанность, не сужая значение до строго определённой литургической формы.
- source_word: בַּחֹדֶשׁ הַזֶּה
  choice: в этом месяце
  rationale: Прямо и естественно передаёт временное указание на назначенный месяц соблюдения установления.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя Бога; «Яхве» сохраняет имя и не заменяет его титулом.
- issue: Культовый оттенок עֲבֹדָה в контексте Пасхи и праздника Пресных хлебов
  choice: это служение
  alternative: этот обряд; это установление
  rationale: «Служение» передаёт одновременно действие, религиозную обязанность и поклонение, не вводя более узкого значения, чем допускает еврейское слово.
- issue: Модальность וְעָבַדְתָּ
  choice: совершай
  alternative: будешь совершать; должен совершать
  rationale: Последовательная глагольная форма в данном предписывающем контексте выражает обязательное действие после вступления в землю; русское повелительное наклонение ясно передаёт эту силу без добавления отдельного модального глагола.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Сохранено обращение к одному адресату («тебя», «тебе», «совершай»), образ «земли, текущей молоком и мёдом» и личное имя Яхве. Тире выделяют пояснительное повторное описание земли и облегчают восприятие длинного предложения.
