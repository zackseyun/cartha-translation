  yaml_path: translation/ot/exodus/013/008.yaml
  text: And you shall tell your son on that day[a], saying, ‘It is because of this that Yahweh acted for me when I came out of Egypt.’
translation:
  language: ru
  text: 'И в тот день расскажи своему сыну: «Это потому, что Яхве сделал для меня, когда я вышел из Египта».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве сделал это для меня, когда я вышел из Египта». В еврейском тексте «это» можно связать либо с причиной данного соблюдения, либо непосредственно с тем, что сделал Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגַּדְתָּ
  choice: И… расскажи
  rationale: Порода hифиль глагола נגד означает «сообщить, рассказать, объявить». В контексте наставления ребёнка естественное русское «расскажи» передаёт и содержание, и личный характер речи.
- source_word: לְבִנְךָ
  choice: своему сыну
  rationale: Предлог לְ обозначает адресата, а בֵּן стоит в единственном числе мужского рода; перевод сохраняет эту форму без нейтрализации рода.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Устойчивое временное выражение естественно передаётся по-русски как «в тот день» и сохраняет указательное значение.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Инфинитив «говоря» вводит содержание речи. Русская пунктуационная конструкция с двоеточием перед прямой речью передаёт эту функцию естественнее буквального «говоря».
- source_word: בַּעֲבוּר זֶה
  choice: Это — ради того
  rationale: בַּעֲבוּר выражает основание, цель или причинную связь, а זֶה — «это». Формулировка сохраняет связь с непосредственно наблюдаемым обрядом и не устраняет синтаксическую неоднозначность полностью.
- source_word: עָשָׂה יְהוָה לִי
  choice: что Яхве сделал для меня
  rationale: עָשָׂה имеет широкое значение «сделал, совершил». В русском придаточное с «что» естественно связывает действие Яхве с предшествующим указательным выражением; לִי передано как «для меня».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя, представленное тетраграмматоном, передано принятой русской транслитерацией «Яхве», а не заменено титулом.
- source_word: בְּצֵאתִי מִמִּצְרָיִם
  choice: когда я вышел из Египта
  rationale: Инфинитивная конструкция с בְּ имеет временное значение; сохранены первое лицо единственного числа и исход из Египта.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: 'К кому обращено семейное наставление: בִנְךָ'
  choice: своему сыну
  alternative: своему ребёнку
  rationale: Исходный текст употребляет существительное мужского рода в единственном числе; контекст не требует обобщающей гендерно-нейтральной замены.
- issue: Связь בַּעֲבוּר זֶה с последующим עָשָׂה
  choice: «Это — ради того, что Яхве сделал…» с примечанием об альтернативном членении
  alternative: «Яхве сделал это для меня…»
  rationale: Еврейская последовательность допускает связь «это» либо с основанием соблюдаемого обряда, либо непосредственно с тем, что сделал Яхве. Основной текст сохраняет указание на обрядовую ситуацию, а примечание сообщает второе возможное понимание.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Императив «расскажи» естественно выражает предписание в данном повествовательном контексте. Неоднозначность положения указательного זֶה отмечена в сноске; личное имя и первое лицо сохранены.
