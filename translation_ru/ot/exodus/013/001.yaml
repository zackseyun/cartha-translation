  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И сказал Яхве Моисею[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: יהוה (ЙХВХ); традиционная передача — «Господь», также встречается форма «Иегова».'
    reason: Уточнение передачи тетраграмматона и указание распространённых альтернатив.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И сказал
  rationale: Форма с последовательным וַ продолжает повествование; в русской библейской повествовательной речи естественно «И сказал». Хотя דבר буквально передаёт идею речи, перед прямой речью «сказал» звучит естественнее, чем «говорил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом; форма «Яхве» общепринята в современном русском языке.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи без отдельного предлога.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит последующую прямую речь. В современном русском его функцию естественно передаёт двоеточие, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. «Яхве» сохраняет его как имя и не подменяет титулом; вариант произношения отмечен в сноске, поскольку точная древняя огласовка не вполне достоверна.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для русского: адресат выражен дательным падежом, а формула לֵאמֹר передана двоеточием. Маркер сноски поставлен при имени «Яхве», к которому относится примечание.'
