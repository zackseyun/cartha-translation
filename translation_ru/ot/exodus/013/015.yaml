  text: וַ/יְהִ֗י כִּֽי הִקְשָׁ֣ה פַרְעֹה֮ לְ/שַׁלְּחֵ/נוּ֒ וַ/יַּהֲרֹ֨ג יְהֹוָ֤ה כָּל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בְּכֹ֥ר אָדָ֖ם וְ/עַד בְּכ֣וֹר בְּהֵמָ֑ה עַל כֵּן֩ אֲנִ֨י זֹבֵ֜חַ לַֽ/יהוָ֗ה כָּל פֶּ֤טֶר רֶ֨חֶם֙ הַ/זְּכָרִ֔ים וְ/כָל בְּכ֥וֹר בָּנַ֖/י אֶפְדֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/015.yaml
  text: And when Pharaoh stubbornly refused to let us go[a], Yahweh killed every firstborn in the land of Egypt, from the firstborn of man to the firstborn of beast. Therefore I sacrifice to Yahweh every male that opens the womb, but every firstborn of my sons I redeem.
translation:
  language: ru
  text: Когда фараон упорно отказывался отпустить нас, Яхве умертвил всех первенцев в Египте — от первенцев людей до первенцев скота.[a] Поэтому я приношу в жертву Яхве всякого самца, первым вышедшего из утробы, а каждого моего сына-первенца выкупаю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от первенцев человечества до первенцев домашних животных».'
    reason: Передаёт родовое значение אָדָם и уточняет значение בְּהֵמָה как домашних животных; основной текст короче и сохраняет обычное для контекста слово «скот».
lexical_decisions:
- source_word: הִקְשָׁה
  choice: упорно отказывался
  rationale: В сочетании с לְשַׁלְּחֵנוּ каузативная форма передаёт непреклонное, упрямое сопротивление фараона; это естественнее по-русски, чем буквальное «ожесточился» без названного объекта.
- source_word: לְשַׁלְּחֵנוּ
  choice: отпустить нас
  rationale: В повествовании об исходе глагол שׁלח регулярно обозначает разрешение народу уйти.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, непосредственно представленное тетраграмматоном в исходном тексте.
- source_word: בְּכוֹר
  choice: первенец
  rationale: Точное и устойчивое соответствие для первого по рождению; единообразно сохранено во всех трёх употреблениях.
- source_word: מִבְּכֹר אָדָם וְעַד בְּכוֹר בְּהֵמָה
  choice: от первенца человека до первенца скота
  rationale: Сохраняет меризм и противопоставление людей домашним животным; собирательное בְּהֵמָה в данном контексте естественно передаётся словом «скот».
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Ясно выражает причинно-следственную связь между гибелью египетских первенцев и последующей практикой жертвоприношения и выкупа.
- source_word: זֹבֵחַ
  choice: приношу в жертву
  rationale: Передаёт культовое значение жертвенного заклания и звучит естественнее, чем переходное «жертвую» применительно к первенцам животных.
- source_word: פֶּטֶר רֶחֶם
  choice: первенец, разверзающий утробу
  rationale: Сохраняет конкретный образ еврейского юридико-культового выражения о первом потомстве, выходящем из материнской утробы.
- source_word: הַזְּכָרִים
  choice: мужского пола
  rationale: Уточняет, что в жертву приносятся именно самцы из числа первенцев, открывающих утробу.
- source_word: בָּנַי
  choice: моих сыновей
  rationale: Сохраняет мужской род исходного בָּנַי, не расширяя его до общего «детей».
- source_word: אֶפְדֶּה
  choice: выкупаю
  rationale: В культово-правовом контексте פדה означает освобождение посредством установленной замены или платы; «выкупаю» понятно современному читателю и сохраняет смысл действия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное имя Бога; транслитерация сохраняет это различие и не заменяет имя титулом.
- issue: Соотношение жертвоприношения первенцев животных и выкупа сыновей
  choice: Противопоставление сохранено посредством «а»
  alternative: Соединить части союзом «и» без явного противопоставления
  rationale: Еврейский ו допускает простое соединение, однако содержание противопоставляет жертвенное принесение животных обязательному выкупу человеческих первенцев; «а» естественно выражает эту контекстуальную связь, не утверждая, что сам союз обязательно противительный.
- issue: Значение אָדָם в противопоставлении בְּהֵמָה
  choice: человек
  alternative: люди / человечество
  rationale: אָדָם здесь имеет родовое значение и противопоставляет человеческих первенцев первенцам животных; единственное число сохраняет форму и строй исходного выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Формулы «земля Египетская» и «разверзающий утробу» сохраняют достоинство и юридико-культовый характер стиха, не переходя в чрезмерную архаику.
