  text: Они отправились из Суккота и расположились станом в Этаме, на краю пустыни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: Форма wayyiqtol множественного числа от נסע обозначает следующее действие повествования — сняться с места и двинуться дальше. «Отправились» естественно передаёт начало пути.
- source_word: מִסֻּכֹּת
  choice: из Суккота
  rationale: Предлог מִן указывает на исходный пункт. Географическое название סֻכּוֹת передано принятой русской библейской формой «Суккот».
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה означает «становиться лагерем, располагаться станом». Выбранное выражение ясно и уместно для повествования о пути всего народа.
- source_word: בְאֵתָם
  choice: в Этаме
  rationale: Предлог בְ имеет здесь локативное значение. Название אֵתָם передано принятой русской формой «Этам».
- source_word: בִּקְצֵה
  choice: на краю
  rationale: Существительное קָצֶה обозначает край, предел или границу; в данном географическом контексте естественно выражение «на краю».
- source_word: הַמִּדְבָּר
  choice: пустыни
  rationale: מִדְבָּר обозначает необжитую пустынную местность, не обязательно песчаную. Русское «пустыня» сохраняет широкий библейский смысл слова.
