  text: So God led the people around by the way of the wilderness to the Sea of Reeds[b][a], and the sons of Israel went up from the land of Egypt armed.
translation:
  language: ru
  text: Бог повёл народ в обход, по пустынной дороге к Тростниковому морю[a], а сыны Израиля вышли из земли Египта вооружёнными[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Красному морю». Еврейское название буквально означает «Тростниковое море».'
    reason: alternative_reading
  - marker: b
    text: 'Значение еврейского слова не вполне ясно; возможны также переводы: «снаряжёнными для боя», «в боевом порядке» или, в более широком смысле, «организованными рядами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: повёл ... в обход
  rationale: Каузативная форма глагола סבב указывает, что Бог направил народ непрямым, обходным путём; выражение сохраняет и божественное действие, и идею обхода.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: по дороге через пустыню
  rationale: דֶּרֶךְ обозначает путь или маршрут, а הַמִּדְבָּר — пустыню; такая формулировка естественна по-русски и сохраняет маршрутный смысл.
- source_word: יַם סוּף
  choice: Тростниковое море
  rationale: Название буквально связано с тростником; традиционное «Красное море» приведено в примечании как общеизвестный вариант.
- source_word: וַחֲמֻשִׁים
  choice: вооружёнными
  rationale: Точное значение слова спорно, но контекст допускает смысл военной готовности или организованного строя; краткий перевод «вооружёнными» не устраняет неопределённость, которая отмечена в сноске.
- source_word: עָלוּ
  choice: вышли
  rationale: Хотя глагол עלה буквально означает «поднялись», в данном контексте речь идёт об исходе из Египта; «вышли» естественно передаёт движение из страны без неуместной для современного русского буквальности.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формулировка сохраняет мужской множественный образ исходного выражения и его корпоративное обозначение народа завета.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Передаёт как предлог исходной точки, так и существительное «земля», сохраняя достойный библейский регистр.
theological_decisions:
- issue: Передача יַם סוּף
  choice: Тростниковое море
  alternative: Красное море
  rationale: Выбран перевод, непосредственно отражающий еврейское название, тогда как традиционный вариант сохранён в примечании без попытки окончательно отождествить географический объект.
- issue: Передача בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Сохранена формальная образность еврейского выражения и его корпоративный смысл; более нейтральный этноним возможен, но менее прозрачен по отношению к оригиналу.
- issue: Неопределённость חֲמֻשִׁים
  choice: вооружёнными
  alternative: снаряжёнными для боя; в боевом порядке; организованными рядами
  rationale: Основной текст передаёт вероятный военный оттенок, а сноска сохраняет реальную лексическую неопределённость и не утверждает сверх текста, что каждый человек непременно нёс оружие.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис остаётся ясным для обычного читателя; «сыны Израиля» и «земля Египетская» сохраняют достоинство и формальную близость к исходному тексту без чрезмерной архаизации.
