base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/016.yaml
  text: And it shall be as a sign on your hand and as frontlets between your eyes[b][a], for with a strong hand Yahweh brought us out from Egypt.
translation:
  language: ru
  text: И пусть это будет знаком на твоей руке и повязками[a] между твоими глазами[b], потому что сильной рукой Яхве вывел нас из Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «налобными повязками»; традиционно — «филактериями». Редкое еврейское слово, вероятно, обозначает предметы, носимые на лбу как напоминание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «между твоими глазами»; это выражение часто понимают в значении «на твоём лбу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И пусть это будет
  rationale: Форма с וְ в данном контексте предписания указывает на последующее и сохраняющееся назначение; по-русски естественно передаётся конструкцией «пусть это будет».
- source_word: לְאוֹת
  choice: знаком
  rationale: אוֹת обозначает знак или памятное свидетельство; «знак» сохраняет широту значения.
- source_word: עַל יָדְכָה
  choice: на твоей руке
  rationale: Буквально сохранено יָד «рука», без интерпретирующей замены на «предплечье».
- source_word: וּלְטוֹטָפֹת
  choice: и повязкой
  rationale: Редкое טוֹטָפֹת, вероятно, обозначает предмет, носимый на лбу как напоминание. «Повязка» понятно современному читателю и не привносит более поздний специальный термин «филактерии».
- source_word: בֵּין עֵינֶיךָ
  choice: между твоими глазами
  rationale: Сохранён буквальный образ еврейского выражения; вероятное значение «на лбу» дано в примечании.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание, по которому сказанное должно служить знаком.
- source_word: בְּחֹזֶק יָד
  choice: сильной рукой
  rationale: Близко передаёт еврейское выражение о проявлении могущественной силы, не усиливая его традиционным «мышцею крепкою».
- source_word: הוֹצִיאָנוּ
  choice: вывел нас
  rationale: Каузативная форма יצא означает «вывести, сделать так, чтобы вышли»; «вывел» естественно в контексте исхода.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Обычная и точная русская передача исходного предлога с глаголом «вывел».
theological_decisions:
- issue: Следует ли понимать образы руки и глаз как прямое указание на позднейшие ритуальные предметы
  choice: 'Сохранить конкретные образы исходного текста: «на твоей руке» и «повязкой между твоими глазами»'
  alternative: Перевести как «филактерии» либо полностью истолковать как образное напоминание
  rationale: Еврейский текст использует конкретную, но не вполне однозначную лексику и прямо не отождествляет её с позднейшей практикой. Основной текст сохраняет возможность буквального, символического или совмещающего оба аспекта понимания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; личное имя Яхве и конкретная образность еврейского текста сохранены.
