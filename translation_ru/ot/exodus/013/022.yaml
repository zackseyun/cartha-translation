  text: Облачный столп днём и огненный столп ночью не отходили от народа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не удалялись от народа». Еврейский глагол подчёркивает, что столпы постоянно оставались перед народом, ведя его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִישׁ
  choice: не удалялись
  rationale: Глагол מוּשׁ означает удаляться или отходить. Русское «не удалялись» передаёт постоянное присутствие обоих столпов; множественное число естественно согласует сказуемое с двумя однородными подлежащими, хотя в еврейском стоит форма единственного числа.
- source_word: עַמּוּד
  choice: столп
  rationale: «Столп» — устоявшееся и узнаваемое русское обозначение вертикального явления в этом повествовании; оно сохраняет возвышенный библейский регистр, оставаясь понятным.
- source_word: הֶעָנָן
  choice: облачный
  rationale: Прилагательное «облачный» естественно передаёт еврейское сочетание «столп облака» и сохраняет конкретный образ облака.
- source_word: יוֹמָם
  choice: днём
  rationale: Наречная форма точно и кратко выражает время и образует естественную параллель с «ночью».
- source_word: וְעַמּוּד הָאֵשׁ
  choice: и столп огненный
  rationale: Сохраняется синтаксический и образный параллелизм со «столпом облачным».
- source_word: לָיְלָה
  choice: ночью
  rationale: Наречное употребление передаёт обстоятельство времени и уравновешивает «днём».
- source_word: לִפְנֵי
  choice: от места перед
  rationale: В сочетании с глаголом удаления предлог обозначает исходную позицию впереди народа. Формулировка «от места перед народом» точнее и естественнее буквального «из-пред народа».
- source_word: הָעָם
  choice: народом
  rationale: Собирательное существительное обозначает народ Израиля как единое целое.
