  text: שִׁבְעַ֥ת יָמִ֖ים תֹּאכַ֣ל מַצֹּ֑ת וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י חַ֖ג לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/006.yaml
  text: For seven days you shall eat unleavened bread[b][a], and on the seventh day there shall be a feast to Yahweh.
translation:
  language: ru
  text: Семь дней ешь пресный хлеб, и в седьмой день будет праздник[b] в честь Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское имя: יהוה (YHWH); традиционно переводится как «Господь».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «празднество».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Семь дней
  rationale: Сочетание выражает продолжительность; в русском языке длительность естественно передаётся винительным падежом времени без предлога.
- source_word: תֹּאכַל
  choice: ешь
  rationale: Имперфект второго лица мужского рода единственного числа в контексте предписания имеет побудительное значение. Форма «ешь» звучит прямо и естественно, не усиливая предписание до категорического «обязан есть».
- source_word: מַצֹּת
  choice: пресный хлеб
  rationale: В контексте праздника слово обозначает хлеб без закваски. Устойчивое русское выражение «пресный хлеб» понятно современному читателю.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: и в седьмой день
  rationale: Союз ו передаёт простое присоединение, а предложная конструкция обозначает время.
- source_word: חַג
  choice: праздник
  rationale: Слово обозначает священный праздник, нередко связанный с торжеством и паломничеством. «Праздник» сохраняет культовый смысл и остаётся общеупотребительным.
- source_word: לַיהוָה
  choice: в честь Яхве
  rationale: Предлог ל выражает направленность или посвящение. Оборот «в честь Яхве» естественно передаёт праздник, совершаемый для Яхве, не делая более узкого вывода о характере посвящения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя יהוה. Транслитерация «Яхве» сохраняет различие между Божьим именем и титулом; традиционная замена «Господь» указана в примечании.
- issue: Эллиптическая именная конструкция חַג לַיהוָה
  choice: будет праздник в честь Яхве
  alternative: праздник Яхве
  rationale: В еврейском тексте нет выраженной связки. Добавление русского «будет» необходимо для естественной фразы и не уточняет сверх текста, кто именно учреждает или проводит праздник.
translation_notes:
  register: Современный литературный русский язык с ясным предписывающим тоном. Синтаксис краткий и торжественный, без архаизмов; союз «и» сохраняет нейтральную связь частей исходного текста.
