  text: you shall set apart to Yahweh every one that opens the womb[b][a], and every male firstborn of the livestock that you have belongs to Yahweh.
translation:
  language: ru
  text: 'Посвящай Яхве всё, что первым выходит из утробы[a], и всех первенцев принадлежащего тебе скота[b]: самцы из них принадлежат Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всякое открывающее утробу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всё первое потомство скота». Еврейское выражение обозначает первенцев среди домашних животных; далее отдельно уточняется, что Яхве принадлежат самцы из них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: посвящай
  rationale: Побудительная порода глагола עבר буквально выражает передачу или проведение, а в данном культовом контексте — передачу Яхве в качестве посвящённого Ему. Русское «посвящай» ясно передаёт эту функцию.
- source_word: פֶּטֶר רֶחֶם
  choice: всё, что первым выходит из утробы
  rationale: Сохранён конкретный образ еврейского выражения «открывающее утробу», но фраза сформулирована естественно по-русски и указывает на первенца.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное заветное имя יהוה, а не заменяющий его титул.
- source_word: פֶּטֶר שֶׁגֶר בְּהֵמָה
  choice: весь первый приплод … скота
  rationale: שֶׁגֶר обозначает приплод животных, а сочетание с פֶּטֶר указывает на первый приплод. Выбор сохраняет образ рождения и звучит естественно по-русски.
- source_word: אֲשֶׁר יִהְיֶה לְךָ
  choice: принадлежащего тебе
  rationale: Относительное придаточное выражает принадлежность скота адресату.
- source_word: הַזְּכָרִים
  choice: самцы из них
  rationale: Форма во множественном числе выделяет самцов среди упомянутого первого приплода; «из них» делает эту связь ясной, не расширяя предписание на всех самцов скота.
- source_word: לַיהוָה
  choice: принадлежат Яхве
  rationale: Эллиптическое заключение выражает принадлежность или посвящённость; добавленный глагол требуется для естественного русского предложения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет его отличие от титула.
- issue: Характер передачи первенцев Яхве
  choice: посвящай
  alternative: передавай
  rationale: Контекст имеет культово-правовой смысл посвящения, однако формулировка не уточняет способ исполнения и тем самым не снимает напряжение, которое разъясняется в следующем стихе.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Повелительно-нормативное «посвящай» передаёт продолжительное предписание; образ утробы сохранён, а тяжёлая буквальная конструкция пояснена сноской.
