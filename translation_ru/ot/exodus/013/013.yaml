  text: And every firstborn of a donkey you shall redeem with a lamb; and if you do not redeem it[a], then you shall break its neck. And every firstborn of man among your sons you shall redeem.
translation:
  language: ru
  text: Всякого первенца ослицы выкупай животным из мелкого скота; если же не выкупишь его, переломи ему шею. И каждого первенца из твоих сыновей выкупай.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּטֶר חֲמֹר
  choice: первенец ослицы
  rationale: פֶּטֶר буквально обозначает того, кто первым открывает утробу; в данном установлении это естественно передаётся словом «первенец». חֲמֹר здесь обозначает ослицу как рождающее животное, хотя грамматически слово мужского рода.
- source_word: תִּפְדֶּה
  choice: выкупай
  rationale: Глагол פדה означает освобождение посредством выкупа или замены. Русское «выкупай» сохраняет правовой и обрядовый смысл и естественно выражает повторяемое предписание.
- source_word: בְשֶׂה
  choice: ягнёнком
  rationale: שֶׂה — животное из мелкого скота, овца или коза. В основном тексте выбрано традиционное и понятное «ягнёнком», а более широкий объём еврейского слова отмечен в сноске.
- source_word: וַעֲרַפְתּוֹ
  choice: переломи ему шею
  rationale: ערף обозначает умерщвление посредством переламывания шеи, а не обычный закол; формулировка точно и естественно передаёт действие.
- source_word: בְּכוֹר אָדָם
  choice: каждый первенец
  rationale: אָדָם противопоставляет человека животному. В русском контексте человеческая принадлежность ясно выражена последующим «из твоих сыновей», поэтому буквальное «первенец человека» было бы тяжеловесным.
- source_word: בְּבָנֶיךָ
  choice: из твоих сыновей
  rationale: Еврейский текст прямо говорит «твоих сыновей»; это сохраняет мужской референт закона о первенцах и звучит естественно по-русски.
theological_decisions:
- issue: Передача אָדָם в выражении בְּכוֹר אָדָם
  choice: Не выражать отдельным словом, поскольку человеческий референт уточнён фразой «из твоих сыновей»
  alternative: «каждого первенца человека из твоих сыновей» или «каждого первенца среди людей, из твоих сыновей»
  rationale: Здесь אָדָם создаёт противопоставление человеческого первенца первенцу животного, а не обозначает взрослого мужчину. Русское «каждый первенец из твоих сыновей» сохраняет смысл без неестественной тавтологии и не привносит дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством правового установления. Императив несовершенного вида «выкупай» передаёт постоянное, повторяемое предписание; синтаксис сохранён близким к еврейскому, но без неестественных калек.
