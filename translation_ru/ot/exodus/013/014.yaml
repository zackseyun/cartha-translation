  text: וְ/הָיָ֞ה כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֣ר מַה זֹּ֑את וְ/אָמַרְתָּ֣ אֵלָ֔י/ו בְּ/חֹ֣זֶק יָ֗ד הוֹצִיאָ֧/נוּ יְהוָ֛ה מִ/מִּצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/014.yaml
  text: And when your son asks you in time to come, saying, ‘What is this?’ then you shall say to him, ‘By a mighty hand the LORD brought us out from Egypt, from the house of servants.’
translation:
  language: ru
  text: 'И когда впоследствии твой сын спросит тебя: «Что это?» — скажи ему: «Могучей рукой ГОСПОДЬ вывел нас из Египта, из дома рабства».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָחָר
  choice: впоследствии
  rationale: В данном контексте слово обозначает будущее время, когда следующее поколение задаст вопрос, а не буквально следующий день.
- source_word: בְּחֹזֶק יָד
  choice: могучей рукой
  rationale: Естественно передаёт идиому о явленной силе Бога, сохраняя образ руки.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона прописными буквами позволяет отличать имя Бога от обычного титула.
- source_word: מִבֵּית עֲבָדִים
  choice: из дома рабства
  rationale: Сохраняет метафору Египта как места и системы порабощения; עֲבָדִים буквально означает «рабы/слуги», но русская формула естественно обозначает состояние рабства.
theological_decisions:
- issue: Отождествление последующего поколения с поколением исхода в словах «вывел нас»
  choice: сохранено «нас»
  alternative: «вывел наших предков»
  rationale: Еврейский текст прямо употребляет местоименный суффикс первого лица множественного числа; замена на «предков» сняла бы важную межпоколенческую сопричастность событию.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Конструкция לֵאמֹר не передана отдельным «говоря», поскольку прямая речь естественно выражает её функцию.
