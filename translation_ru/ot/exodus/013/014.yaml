    issue: Вопрос сына расширен
    rationale: Еврейское מַה זֹּאת — «Что это?». Перевод «Что это значит?» объясняет вероятный смысл, но добавляет компонент «значит», которого в тексте нет.
  revised_text: 'И когда впоследствии твой сын спросит тебя: «Что это?» — скажи ему: «Могучей рукой ГОСПОДЬ вывел нас из Египта, из дома рабства».'
