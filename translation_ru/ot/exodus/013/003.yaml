id: EXO.13.3
reference: Exodus 13:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָ/עָ֗ם זָכ֞וֹר אֶת הַ/יּ֤וֹם הַ/זֶּה֙ אֲשֶׁ֨ר יְצָאתֶ֤ם מִ/מִּצְרַ֨יִם֙ מִ/בֵּ֣ית עֲבָדִ֔ים כִּ֚י בְּ/חֹ֣זֶק יָ֔ד הוֹצִ֧יא יְהֹוָ֛ה אֶתְ/כֶ֖ם מִ/זֶּ֑ה וְ/לֹ֥א יֵאָכֵ֖ל חָמֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/003.yaml
  text: Then Moses said to the people[a], “Remember this day in which you came out from Egypt, from the house of slavery, because Yahweh brought you out from there by a strong hand[c][b]; and no leavened bread shall be eaten.”
translation:
  language: ru
  text: 'И сказал Моисей народу: «Помните этот день, когда вы вышли из Египта, из дома рабства, потому что сильной рукой Яхве вывел вас оттуда; и пусть не едят ничего квасного[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и пусть не едят квасного хлеба». Еврейское слово может обозначать квасное вообще либо квасной хлеб.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: Помните
  rationale: Форма единственного числа обращена к народу как к единому целому; в естественном русском обращение к собирательному адресату передаётся множественным числом. Глагол сохраняет смысл памятования и последующего соблюдения.
- source_word: הַיּוֹם הַזֶּה
  choice: этот день
  rationale: Точно и естественно передаёт сочетание определённого существительного с указательным местоимением без добавочного усиления.
- source_word: יְצָאתֶם מִמִּצְרַיִם
  choice: вы вышли из Египта
  rationale: Обычное русское выражение направления из исходной точки; соответствует значению יצא и предлога מן.
- source_word: מִבֵּית עֲבָדִים
  choice: из дома рабства
  rationale: Еврейское выражение буквально связано с «домом рабов», но функционирует как обозначение места порабощения. «Дом рабства» сохраняет метафору и ясно передаёт смысл современному читателю.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для повеления помнить этот день; причинная связь выражена явно.
- source_word: בְּחֹזֶק יָד
  choice: сильной рукой
  rationale: Сохраняет телесную метафору и близко передаёт חֹזֶק; русская форма творительного падежа естественно выражает средство могущественного действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, не заменяя его титулом.
- source_word: הוֹצִיא ... אֶתְכֶם מִזֶּה
  choice: вывел вас оттуда
  rationale: Каузативная форма יצא естественно передаётся глаголом «вывел», а «оттуда» отсылает к Египту, названному ранее.
- source_word: וְלֹא יֵאָכֵל חָמֵץ
  choice: и пусть не едят ничего квасного
  rationale: Пассивная запретительная конструкция передана естественным русским безличным предписанием. חָמֵץ может обозначать квасное как категорию пищи, поэтому перевод не сужает запрет только до хлеба.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Смысл מִבֵּית עֲבָדִים
  choice: из дома рабства
  alternative: из дома рабов
  rationale: Буквальное «дом рабов» возможно, но идиома характеризует Египет как место порабощения. Выбранный вариант сохраняет образ дома и не смягчает реальность рабства.
- issue: Объём запрета חָמֵץ
  choice: ничего квасного
  alternative: квасного хлеба
  rationale: Существительное может обозначать квасное или заквашенную пищу шире, чем только хлеб; широкий русский вариант сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Инверсия «сильной рукой Яхве вывел» сохранена ради смыслового акцента на способе Божьего избавления; архаизмы и конфессионально маркированные замены имени исключены.
