  yaml_path: translation/ot/exodus/031/017.yaml
  text: It is a sign forever between me and the sons of Israel[a], for in six days Yahweh made the heavens and the earth[c][b], and on the seventh day he ceased and was refreshed.
translation:
  language: ru
  text: Это знак навеки между Мною и сынами Израиля[a], потому что за шесть дней Яхве создал небеса и землю, и в седьмой день прекратил работу[b] и освежился[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянами».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «покоился»; еврейский глагол прежде всего означает «прекратил работу».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможна более образная передача: «взял дыхание»; в еврейском употреблён яркий человекоподобный образ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּינִי וּבֵין
  choice: между Мною и
  rationale: Естественная русская передача еврейской соотносительной конструкции; повтор предлога в русском не требуется.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: 'Сохраняет родственный образ и грамматически мужскую форму оригинала; в основном тексте употреблено в творительном падеже: «сынами Израиля».'
- source_word: אוֹת
  choice: знак
  rationale: Обычное и точное обозначение знака заветных отношений.
- source_word: לְעֹלָם
  choice: навеки
  rationale: Кратко и естественно передаёт идею непрекращающейся длительности.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит основание, по которому суббота служит знаком.
- source_word: שֵׁשֶׁת יָמִים
  choice: за шесть дней
  rationale: Естественная русская конструкция для обозначения срока, в течение которого было завершено творение.
- source_word: עָשָׂה
  choice: создал
  rationale: В контексте появления небес и земли русское «создал» точнее и естественнее общего «сделал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: небеса и землю
  rationale: Сохраняет множественную форму первого существительного и традиционный смысл всеохватной пары сотворённого мира.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: а в седьмой день
  rationale: Союз «а» естественно отмечает переход от шести дней деятельности к седьмому дню, не создавая резкого противопоставления.
- source_word: שָׁבַת
  choice: прекратил трудиться
  rationale: Передаёт основное значение глагола — прекращение деятельности; дополнение «трудиться» необходимо для естественной русской фразы и ясно из контекста.
- source_word: וַיִּנָּפַשׁ
  choice: перевёл дух
  rationale: Живой русский образ сохраняет антропоморфный характер еврейского выражения, связанного с восстановлением дыхания и сил.
theological_decisions:
- issue: Антропоморфное описание Бога в языке субботнего покоя
  choice: «прекратил трудиться и перевёл дух»
  alternative: «почил и освежился» / «перестал работать и восстановил силы»
  rationale: Формулировка сохраняет яркий человекоподобный образ оригинала и не устраняет возникающее богословское напряжение, но при этом не добавляет прямого утверждения об изнеможении Бога.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: «сыны Израиля»
  alternative: «израильтяне» / «народ Израиля»
  rationale: Родственный образ оригинала сохранён, а более гладкое собирательное обозначение дано в примечании.
- issue: Передача имени יְהוָה
  choice: «Яхве»
  alternative: «Господь» / «Иегова»
  rationale: Личное имя передано непосредственно, без замены титулом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Мною» написано с прописной буквы как местоимение, относящееся к Богу. Родственный оборот «сыны Израиля» сознательно сохранён, тогда как «перевёл дух» выбран ради живости исходного антропоморфизма.
