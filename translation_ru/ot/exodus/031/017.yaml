  source_fidelity: 'Смысл в целом передан точно: «знак», «навеки», «между Мною и сынами Израиля», шесть дней творения и седьмой день прекращения деятельности соответствуют еврейскому тексту. Однако «перевёл дух» в современном русском обычно предполагает передышку после напряжения или усталости и потому сильнее, чем исходное וַיִּנָּפַשׁ, привносит оттенок утомления. «Освежился» сохраняет антропоморфный образ и ближе к обычной передаче формы Niphal в этом контексте.'
