  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ יֵעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֧ת שַׁבָּת֛וֹן קֹ֖דֶשׁ לַ/יהוָ֑ה כָּל הָ/עֹשֶׂ֧ה מְלָאכָ֛ה בְּ/י֥וֹם הַ/שַּׁבָּ֖ת מ֥וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/015.yaml
  text: Work may be done for six days[a], but on the seventh day there is a Sabbath of complete rest, holy to Yahweh. Whoever does work on the Sabbath day shall surely be put to death.
translation:
  language: ru
  text: Шесть дней можно работать, но седьмой день — суббота полного покоя, посвящённая Яхве. Всякий, кто работает в субботний день, непременно будет предан смерти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵעָשֶׂה מְלָאכָה
  choice: можно работать
  rationale: Пассивная форма буквально означает, что работа может или должна совершаться. В контексте предписания «можно работать» естественно передаёт разрешённость труда в течение первых шести дней, не превращая форму в простое будущее.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: но седьмой день
  rationale: Союз ו может означать «и», однако здесь он вводит явное противопоставление шести рабочих дней седьмому, что по-русски естественно передаётся союзом «но».
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: суббота полного покоя
  rationale: Сочетание двух однокоренных существительных усиливает идею прекращения труда и покоя. Перевод сохраняет и название «суббота», и усилительный смысл второго слова.
- source_word: קֹדֶשׁ לַיהוָה
  choice: святая для Яхве
  rationale: קֹדֶשׁ обозначает священный статус, а ל — направленность или посвящённость Яхве. Формулировка сохраняет краткость и предикативный характер выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: כָּל הָעֹשֶׂה מְלָאכָה
  choice: всякий, кто работает
  rationale: Причастная конструкция с כָּל задаёт всеобщую правовую категорию; русский оборот естественно сохраняет эту универсальность.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: в субботний день
  rationale: Слово «день» сохранено в соответствии с явным יוֹם в еврейском тексте.
- source_word: מוֹת יוּמָת
  choice: непременно будет предан смерти
  rationale: Сочетание абсолютного инфинитива с глаголом в породе гофаль усиливает неизбежность наказания и выражает пассивное «быть преданным смерти», а не просто «умереть».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное заветное имя. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Сила выражения שַׁבַּת שַׁבָּתוֹן
  choice: суббота полного покоя
  alternative: суббота, торжественный покой; суббота покоя
  rationale: Выбранный вариант передаёт усиленную идею полного прекращения труда, не добавляя позднейших конфессиональных толкований.
- issue: Характер смертной санкции
  choice: непременно будет предан смерти
  alternative: непременно умрёт; должен быть предан смерти
  rationale: Так сохраняются и усилительная конструкция, и пассивная форма казни, не уточняя не названного в стихе исполнителя наказания.
translation_notes:
  register: Современный литературный русский язык с достоинством правового и богослужебного контекста. Синтаксис сделан ясным для обычного читателя; сохранены усиление субботнего покоя, личное имя Яхве и пассивный характер смертной санкции.
