  yaml_path: translation/ot/exodus/031/010.yaml
  text: and the finely woven garments[a], and the holy garments for Aaron the priest, and the garments of his sons for serving as priests,
translation:
  language: ru
  text: и искусно изготовленные одежды[a], и священные одежды для священника Аарона, и одежды его сыновей для священнического служения,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одежды для служения», «служебные одежды» или «тканые одежды». Значение еврейского выражения בִּגְדֵי הַשְּׂרָד не вполне ясно: оно может подчёркивать либо способ изготовления одежд, либо их назначение для служения при святилище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: искусно изготовленные одежды
  rationale: 'Значение сочетания спорно: оно может указывать либо на особое качество изготовления одежд, либо на их назначение для служения. Основной перевод естественно передаёт вероятный смысл, связанный с мастерством изготовления, а альтернативы сохранены в сноске.'
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: священные одежды
  rationale: Буквально «одежды святости»; «священные одежды» — прямой и естественный эквивалент в современном литературном русском языке.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: для священника Аарона
  rationale: Предлог לְ обозначает предназначение одежд, а הַכֹּהֵן выступает как титул Аарона. Такой порядок слов естественен по-русски.
- source_word: בִּגְדֵי בָנָיו
  choice: одежды его сыновей
  rationale: Передаёт конструкцию со значением принадлежности и сохраняет ясную отсылку местоимения к Аарону.
- source_word: לְכַהֵן
  choice: для священнического служения
  rationale: Инфинитив כהן означает исполнять обязанности священника. Формулировка кратко и естественно выражает назначение одежд, не добавляя конфессиональной терминологии.
- source_word: וְאֵת / וְאֶת
  choice: и
  rationale: Непереводимый показатель прямого дополнения אֵת опущен, а повторяющийся союз וְ сохранён, поскольку стих продолжает перечень.
