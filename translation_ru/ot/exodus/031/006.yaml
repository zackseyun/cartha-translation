  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה נָתַ֣תִּי אִתּ֗/וֹ אֵ֣ת אָהֳלִיאָ֞ב בֶּן אֲחִֽיסָמָךְ֙ לְ/מַטֵּה דָ֔ן וּ/בְ/לֵ֥ב כָּל חֲכַם לֵ֖ב נָתַ֣תִּי חָכְמָ֑ה וְ/עָשׂ֕וּ אֵ֖ת כָּל אֲשֶׁ֥ר צִוִּיתִֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/006.yaml
  text: And behold[a], I have appointed with him Oholiab son of Ahisamach, of the tribe of Dan; and in the heart of everyone wise of heart I have put wisdom[b], that they may make all that I have commanded you.
translation:
  language: ru
  text: И вот, Я поставил рядом с ним Охолиава, сына Ахисамаха, из колена Дана, и вложил мудрость в сердца всех, кто мудр сердцем[a], чтобы они сделали всё, что Я повелел тебе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мудрых сердцем»; это древнееврейское выражение обозначает людей, наделённых мудростью и умением.'
    reason: cultural_note
  - marker: b
    text: 'Или, более буквально: «и они сделают всё, что Я повелел тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: И вот, Я
  rationale: Сохраняет указательно-эмфатическую силу הִנֵּה и выраженное местоимение первого лица; при этом фраза остаётся естественной для современного литературного русского языка.
- source_word: נָתַתִּי אִתּוֹ
  choice: поставил рядом с ним
  rationale: Передаёт контекстуальный смысл назначения Охолиава в соработники Веселеилу и явно сохраняет значение אִתּוֹ — «с ним».
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: Охолиава, сына Ахисамаха
  rationale: Имена переданы в принятой русской библейской форме, а родственная связь — прямо и без добавлений.
- source_word: לְמַטֵּה דָן
  choice: из колена Дана
  rationale: מַטֶּה обозначает здесь племенную принадлежность; «колено» — понятный и укоренённый русский библейский термин.
- source_word: וּבְלֵב כָּל חֲכַם לֵב
  choice: в сердца всех, кто мудр сердцем
  rationale: Сохранены повтор לֵב и древнееврейское представление о сердце как средоточии разумения и умения; русская конструкция слегка сглажена ради ясности.
- source_word: נָתַתִּי חָכְמָה
  choice: вложил мудрость
  rationale: «Вложил» естественно сочетается с упоминанием сердец, а «мудрость» сохраняет более широкий смысл חָכְמָה, включающий в данном контексте мастерство.
- source_word: וְעָשׂוּ
  choice: чтобы они сделали
  rationale: 'Передаёт естественный целевой или результативный смысл: Бог наделяет мудростью для исполнения порученной работы, не сводя форму исключительно к простому будущему времени.'
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתִךָ
  choice: всё, что Я повелел тебе
  rationale: Прямо передаёт полноту выражения и обращение к Моисею в единственном числе.
theological_decisions:
- issue: Значение выражения חֲכַם־לֵב в контексте изготовления святилища
  choice: мудр сердцем / мудрость
  alternative: искусный / мастерство
  rationale: Контекст явно включает ремесленное умение, однако буквальный образ сердца и лексема «мудрость» показывают, что это умение понимается как данная Богом мудрость, а не только как технический навык.
- issue: Смысловая связь וְעָשׂוּ с дарованием мудрости
  choice: чтобы они сделали
  alternative: и они сделают
  rationale: Целевая формулировка естественно выражает связь между Божьим даром мудрости и последующим исполнением повеления, сохраняя при этом допустимую альтернативу в примечании.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для широкого читателя, но сохранены ключевые образы исходного текста: пребывание Охолиава рядом с главным мастером, мудрость в сердце и целевая связь Божьего дара с исполнением повеления.'
