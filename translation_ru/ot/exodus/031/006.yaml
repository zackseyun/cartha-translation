  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: эмфатическое «И вот, Я», назначение Охолиава вместе с Веселеилом, происхождение из колена Дана, дарование мудрости «в сердца» мудрых сердцем и итоговую/целевую связь с исполнением повеленного Моисею. «Поставил рядом с ним» контекстуально передаёт נָתַתִּי אִתּוֹ и явно сохраняет значение «с ним».'
