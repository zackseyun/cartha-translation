source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן אֶל מֹשֶׁ֗ה כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֤ר אִתּ/וֹ֙ בְּ/הַ֣ר סִינַ֔י שְׁנֵ֖י לֻחֹ֣ת הָ/עֵדֻ֑ת לֻחֹ֣ת אֶ֔בֶן כְּתֻבִ֖ים בְּ/אֶצְבַּ֥ע אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/018.yaml
  text: And when he finished speaking with him on Mount Sinai[a], he gave Moses the two tablets of the testimony, tablets of stone, written with the finger of God.
translation:
  language: ru
  text: Когда Бог окончил говорить с Моисеем на горе Синай, Он дал ему две скрижали свидетельства — каменные скрижали, написанные пальцем Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «написанные пальцем Бога». Этот яркий образ прямо приписывает написание Богу.'
    reason: Сохранение и пояснение конкретного антропоморфного выражения
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Он дал
  rationale: Форма wayyiqtol от נתן передаёт последовательное действие в повествовании. Местоимение указывает на Бога как на подразумеваемое подлежащее.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: когда Бог окончил говорить
  rationale: Конструкция с כ и инфинитивом כלה обозначает завершение действия во времени; «когда окончил» естественно передаёт этот смысл.
- source_word: אִתּוֹ
  choice: с Моисеем
  rationale: Местоимение естественнее всего относится к Моисею. Имя повторено по-русски для ясности, поскольку последовательность местоимений «Он… с ним… ему» была бы менее прозрачной.
- source_word: בְּהַר סִינַי
  choice: на горе Синай
  rationale: Обычное современное русское обозначение местонахождения на горе.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: две скрижали свидетельства
  rationale: «Скрижали» точно обозначает каменные таблички в данном библейском контексте, а «свидетельство» сохраняет значение עֵדוּת и его заветный смысл без пояснительного перефразирования.
- source_word: לֻחֹת אֶבֶן
  choice: каменные скрижали
  rationale: Передаёт материал и сохраняет пояснительное повторение исходного текста; тире естественно оформляет приложение по-русски.
- source_word: כְּתֻבִים
  choice: написанные
  rationale: Прямое значение пассивного причастия от כתב; вариант «начертанные» возможен, но несколько более возвышен и интерпретативен.
- source_word: בְּאֶצְבַּע אֱלֹהִים
  choice: пальцем Бога
  rationale: Инструментальное ב передано творительным падежом. Конкретный антропоморфный образ сохранён без ослабления до «силой Бога».
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В контексте слово обозначает Бога Израиля и имеет единственное значение.
theological_decisions:
- issue: Антропоморфное описание непосредственного Божьего авторства
  choice: написанные пальцем Бога
  alternative: написанные непосредственно Богом / силой Бога
  rationale: Исходный текст использует конкретный образ «пальца Бога». Перевод сохраняет его образность и богословское напряжение, не сводя выражение к абстрактному объяснению.
- issue: Подразумеваемое подлежащее первых глаголов
  choice: Бог окончил… Он дал
  alternative: Он окончил… и дал Моисею
  rationale: В ближайшем контексте действующим лицом является Бог. Экспликация имени в русском устраняет неясную цепочку местоимений, не изменяя референцию исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Слово «скрижали» сохранено как точный и общеупотребительный в данном контексте термин; более архаичное «перстом Божьим» заменено прозрачным выражением «пальцем Бога».
