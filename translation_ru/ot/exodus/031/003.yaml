base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/003.yaml
  text: And I have filled him with the Spirit of God[a], with wisdom, with understanding, with knowledge, and with every kind of craftsmanship,
translation:
  language: ru
  text: И наполнил его Духом Божьим[a], мудростью, разумением, знанием и всяким мастерством,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духом Божьим»; или: «божественным духом». Древнееврейское выражение допускает более общее понимание, однако здесь, вероятнее всего, имеется в виду собственный Дух Бога, наделяющий человека силой и способностями.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲמַלֵּא
  choice: и наполнил
  rationale: Глагол מלא означает «наполнять». В контексте уже совершённого Божьего избрания и наделения Веселеила способностями русское прошедшее время естественно передаёт завершённое действие с сохраняющимся результатом.
- source_word: אֹתוֹ
  choice: его
  rationale: Местоимение прямого дополнения относится к Веселеилу, названному в предыдущем стихе.
- source_word: רוּחַ אֱלֹהִים
  choice: Духом Божьим
  rationale: Сочетание может обозначать Божий Дух, дух от Бога или божественный дух. Здесь речь идёт о том, что сам Бог наделяет Веселеила силой и способностями для священного служения, поэтому основной перевод — «Духом Божьим».
- source_word: בְּחָכְמָה
  choice: мудростью
  rationale: Предлог ב обозначает то, чем Бог наполнил и наделил Веселеила; творительный падеж естественно передаёт это значение по-русски.
- source_word: וּבִתְבוּנָה
  choice: разумением
  rationale: תבונה означает понимание, проницательность и способность разумно различать; «разумение» сохраняет возвышенный, но понятный библейский регистр и отличается от соседних «мудрости» и «знания».
- source_word: וּבְדַעַת
  choice: знанием
  rationale: דעת прямо обозначает знание; этот выбор сохраняет краткость и трёхчастный ряд качеств.
- source_word: וּבְכָל מְלָאכָה
  choice: и всяким мастерством
  rationale: מלאכה может означать работу, занятие или ремесленный труд. В ближайшем контексте изготовления скинии «мастерство» передаёт способность к разнообразной искусной работе, а כל при отвлечённом существительном естественно переводится как «всяким».
theological_decisions:
- issue: Следует ли понимать רוּחַ אֱלֹהִים как Божий Дух или более обобщённо как дух от Бога / божественный дух
  choice: Духом Божьим
  alternative: духом Божьим; божественным духом
  rationale: Контекст изображает непосредственное Божье наделение Веселеила способностями для служения при скинии, поэтому наиболее вероятна отсылка к собственному Божьему Духу. Прописная буква отражает это понимание, но примечание сохраняет реальную лексическую неоднозначность и не вносит в стих позднейшую догматическую детализацию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Наполнил» понятнее современному читателю, чем традиционное «исполнил» в значении наделения. Перечень сохранён ритмичным и близким к структуре древнееврейского текста.
