  yaml_path: translation/ot/exodus/031/016.yaml
  text: So the sons of Israel shall keep the Sabbath[c][b][a], to observe the Sabbath throughout their generations as an everlasting covenant.
translation:
  language: ru
  text: И пусть сыны Израиля[a] соблюдают субботу, храня её[b] из поколения в поколение как вечный завет[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне» или «дети Израиля». Буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «делая субботу», то есть соблюдая её.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «непреходящий завет» или «завет навеки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: И пусть ... соблюдают
  rationale: Глагол שׁמר означает «хранить, соблюдать». Конструкция с «пусть» естественно передаёт в русском языке предписывающую силу контекста, а союз וְ передан как «и».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Буквально «сыны Израиля». Формулировка сохраняет семейно-родовое обозначение народа и мужскую форму исходного выражения, оставаясь понятной в возвышенном библейском регистре.
- source_word: הַשַּׁבָּת
  choice: субботу
  rationale: Стандартное русское обозначение установленного дня покоя и знака завета.
- source_word: לַעֲשׂוֹת אֶת הַשַּׁבָּת
  choice: храня субботу
  rationale: Буквально «делать субботу». Русское «храня субботу» естественно выражает соблюдение установления и позволяет передать смысл идиомы без неестественного буквализма.
- source_word: לְדֹרֹתָם
  choice: из поколения в поколение
  rationale: Передаёт непрерывность соблюдения в череде поколений естественным современным русским оборотом.
- source_word: בְּרִית עוֹלָם
  choice: как вечный завет
  rationale: «Завет» сохраняет значение בְּרִית, а «вечный» передаёт длительную, непреходящую силу עוֹלָם; «как» раскрывает обстоятельственно-предикативную связь заключительной фразы.
theological_decisions:
- issue: Обозначение народа выражением בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Сохранено буквальное семейно-родовое и грамматически мужское выражение, которое в контексте корпоративно обозначает народ Израиля.
- issue: Значение בְּרִית עוֹלָם
  choice: вечный завет
  alternative: непреходящий завет; завет навеки
  rationale: Формулировка сохраняет силу и длительность завета, не уточняя сверх текста, как именно его продолжительность соотносится с последующей историей откровения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Сыны Израиля» намеренно сохраняет форму оригинала; остальные обороты сделаны естественными и понятными современному читателю.
