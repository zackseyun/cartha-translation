base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/008.yaml
  text: and the table with its utensils[a], and the pure lampstand with all its utensils, and the altar of incense[c][b],
translation:
  language: ru
  text: и стол с его принадлежностями, и чистый[b] светильник[a] со всеми его принадлежностями, и жертвенник для воскурений[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «менора». Еврейское слово обозначает светильник святилища.'
    reason: lexical_alternative
  - marker: b
    text: Слово «чистый» может указывать на обрядовую чистоту; в контексте скинии оно, вероятно, также напоминает о том, что светильник был сделан из чистого золота.
    reason: cultural_note
  - marker: c
    text: 'Или: «жертвенник воскурений».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: стол
  rationale: Существительное прямо означает «стол»; его назначение ясно из контекста святилища, поэтому более полное наименование в текст не добавляется.
- source_word: כֵּלָיו
  choice: его принадлежности
  rationale: כְּלִי — широкое обозначение сосудов, орудий и иных предметов; «принадлежности» естественно охватывает всё необходимое для служения при столе.
- source_word: הַמְּנֹרָה
  choice: светильник
  rationale: מְנוֹרָה обозначает храмовый светильник на подставке. Перевод нарицательного существительного здесь понятнее обычному читателю, чем транслитерация «менора».
- source_word: הַטְּהֹרָה
  choice: чистый
  rationale: טָהוֹר означает «чистый» или «чистый, без примеси». «Чистый» сохраняет как культовый оттенок, так и возможную связь с чистым золотом.
- source_word: כָּל כֵּלֶיהָ
  choice: все его принадлежности
  rationale: Передаёт и значение совокупности כָּל, и широкий смысл כְּלִי применительно к предметам, связанным со светильником.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: жертвенник для воскурений
  rationale: Конструкция означает жертвенник, на котором воскуряли благовония; такой перевод естественен по-русски и ясно передаёт назначение предмета.
- source_word: וְאֶת
  choice: и
  rationale: Показатель прямого дополнения אֵת отдельно не переводится, а повторяющийся союз וְ сохранён, чтобы передать структуру перечня.
theological_decisions:
- issue: Значение определения הַטְּהֹרָה при светильнике
  choice: Сохранить многозначное «чистый» и пояснить её в сноске.
  alternative: 'Уточнить в основном тексте: «из чистого золота».'
  rationale: Сам стих не называет материал прямо. Уточнение о золоте согласуется с соседними описаниями, но его не следует безоговорочно вносить в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повторение союза «и» сохраняет ритм и синтаксис перечня. Фрагмент начинается со строчной буквы и заканчивается запятой, поскольку стих является частью продолжающегося предложения.
