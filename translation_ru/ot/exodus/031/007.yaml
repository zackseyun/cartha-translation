base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/007.yaml
  text: the tent of meeting[a], and the ark of the testimony, and the mercy seat that is on it[b], and all the furnishings of the tent—
translation:
  language: ru
  text: шатёр встречи, ковчег свидетельства[a], крышку искупления, которая на нём[b], и все принадлежности шатра —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ковчег для свидетельства».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «очистительную крышку»; традиционно: «престол милости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Передаёт назначение святилища как места встречи Бога с Израилем и естественно звучит по-русски.
- source_word: הָאָרֹן לָעֵדֻת
  choice: ковчег для свидетельства
  rationale: Предлог ל указывает на отношение или назначение; формулировка сохраняет это значение, не добавляя отсутствующего в тексте слова «завет».
- source_word: הַכַּפֹּרֶת
  choice: крышку искупления
  rationale: Обозначает золотую крышку ковчега и сохраняет связь термина с обрядовым очищением и искуплением, не превращая предмет в абстрактное понятие.
- source_word: אֲשֶׁר עָלָיו
  choice: которая на нём
  rationale: Прямо передаёт относительное предложение; местоимение мужского рода относится к ковчегу.
- source_word: כָּל כְּלֵי הָאֹהֶל
  choice: все принадлежности шатра
  rationale: Широкое и естественное обозначение предметов и оборудования шатра; не сужает смысл до сосудов или утвари.
theological_decisions:
- issue: Передача הַכַּפֹּרֶת в контексте святилища
  choice: крышка искупления
  alternative: престол милости; очистительная крышка
  rationale: Основной вариант ясно называет сам предмет и сохраняет его связь с искупительным обрядом. Вариант «престол милости» традиционен, но менее буквально описывает крышку ковчега; «очистительная крышка» отражает возможный обрядовый оттенок корня.
- issue: Отношение ковчега к свидетельству в הָאָרֹן לָעֵדֻת
  choice: ковчег для свидетельства
  alternative: ковчег свидетельства
  rationale: Вариант с «для» сохраняет значение еврейского предлога ל, тогда как традиционный родительный оборот оставляет отношение более неопределённым.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Стих является продолжением перечня, поэтому сохранены винительный падеж и завершающее тире.
