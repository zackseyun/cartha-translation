  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת הַ/שַּׁבָּ֔ת כִּ֛י קֹ֥דֶשׁ הִ֖וא לָ/כֶ֑ם מְחַֽלְלֶ֨י/הָ֙ מ֣וֹת יוּמָ֔ת כִּ֗י כָּל הָ/עֹשֶׂ֥ה בָ/הּ֙ מְלָאכָ֔ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/014.yaml
  text: You shall keep the Sabbath[a], because it is holy to you. Whoever profanes it shall surely be put to death, for whoever does work on it[b], that person shall be cut off from among his people.
translation:
  language: ru
  text: Соблюдайте субботу, потому что она свята для вас. Кто осквернит её, тот непременно будет предан смерти; ибо всякий, кто выполняет в субботу работу, — тот человек будет отсечён от своего народа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Будет отсечён от своего народа» — древнееврейская юридическая формула; точный способ наказания здесь не указан.
    reason: preserve_legal_ambiguity
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Соблюдайте
  rationale: Глагол שׁמר здесь выражает обязательное хранение и исполнение установления; «соблюдайте» естественно передаёт этот смысл в современном русском языке.
- source_word: הַשַּׁבָּת
  choice: субботу
  rationale: Стандартное русское обозначение установленного дня покоя; определённость понятна из контекста без артикля.
- source_word: קֹדֶשׁ הִוא לָכֶם
  choice: она свята для вас
  rationale: Сохраняет значение святости и посвящённости субботы, а также отношение, выраженное לָכֶם.
- source_word: מְחַלְלֶיהָ
  choice: кто осквернит её
  rationale: Пиэль от חלל означает осквернять, лишать священного статуса; обобщённая личная конструкция естественна для русского юридического стиля.
- source_word: מוֹת יוּמָת
  choice: непременно должен быть предан смерти
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает категоричность, а пассивная конструкция указывает на предание смерти, а не просто на факт умирания.
- source_word: כָּל הָעֹשֶׂה בָהּ מְלָאכָה
  choice: всякий, кто будет делать в неё какую-либо работу
  rationale: Передаёт обобщённую формулу и значение מְלָאכָה как работы или занятия; «в неё» сохраняет библейски возвышенный, но понятный способ обозначить действие в течение субботы.
- source_word: וְנִכְרְתָה
  choice: будет отсечён
  rationale: Сохраняет юридико-заветную метафору כרת, не уточняя не названный в стихе способ наказания.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: тот человек
  rationale: В данном правовом контексте נֶפֶשׁ обозначает конкретного человека, а не отдельно мыслимую душу.
- source_word: מִקֶּרֶב עַמֶּיהָ
  choice: от своего народа
  rationale: Естественно передаёт удаление из среды народа; местоимение «своего» не приписывает нарушителю определённого пола.
theological_decisions:
- issue: Значение формулы וְנִכְרְתָה ... מִקֶּרֶב עַמֶּיהָ
  choice: Сохранить формулу «будет отсечён от своего народа» без уточнения механизма наказания.
  alternative: Будет исключён из общины; будет устранён Божьим судом.
  rationale: Сам стих не определяет, означает ли формула казнь, исключение из общины или непосредственный Божий суд; буквальная метафора сохраняет эту значимую неоднозначность.
- issue: Передача נֶפֶשׁ в юридическом контексте
  choice: тот человек
  alternative: та душа
  rationale: Здесь слово обозначает виновного как отдельное лицо и не формулирует учение о нематериальной части человека.
- issue: Соотношение смертной казни и «отсечения»
  choice: Сохранить обе следующие друг за другом санкционные формулы, не отождествляя и не разводя их пояснением.
  alternative: Истолковать «отсечение» как повторное обозначение смертной казни либо как отдельное от неё наказание.
  rationale: Текст ставит формулы рядом, но прямо не разъясняет их точное соотношение.
translation_notes:
  register: Современный литературный русский с достоинством правового и священного установления. Синтаксис сделан ясным для обычного читателя; сохранены повтор санкций и метафора «отсечён», поскольку они существенны для формы и неоднозначности исходного текста.
