lexical_decisions:
- source_word: רְאֵה
  choice: Вот
  rationale: Императив ראה здесь служит для привлечения внимания. Русское «вот» естественно выполняет эту дискурсивную функцию, сохраняя непосредственность обращения.
- source_word: קָרָאתִי בְשֵׁם
  choice: Я призвал по имени
  rationale: Сочетание קרא בשם передаёт личное, конкретное избрание или призвание. «Призвал по имени» сохраняет образ и не сужает смысл до одного лишь назначения на должность.
- source_word: בְּצַלְאֵל
  choice: Бецалель
  rationale: Имя передано транслитерацией с древнееврейского, а не через традиционную форму, восходящую к греческой передаче.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: сына Ури, сына Хура
  rationale: Повторяющаяся родословная формула בן передана последовательно; имена транслитерированы с древнееврейского.
- source_word: לְמַטֵּה יְהוּדָה
  choice: из колена Иуды
  rationale: В данном родоплеменном контексте מַטֶּה означает «колено», а предлог לְ указывает на принадлежность.
