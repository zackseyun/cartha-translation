  yaml_path: translation/ot/exodus/031/011.yaml
  text: and the anointing oil[a], and the fragrant incense for the holy place. They shall make them according to all that I have commanded you.
translation:
  language: ru
  text: масло для помазания и благовонное курение[a] для святилища. Пусть они сделают всё так, как Я повелел тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «курение из ароматических веществ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: масло для помазания
  rationale: Передаёт назначение масла прямо и понятно, не добавляя отсутствующего в самой фразе определения «священное».
- source_word: קְטֹרֶת הַסַּמִּים
  choice: благовонное курение
  rationale: Естественно обозначает курение, приготовленное из ароматических веществ; более буквальный состав выражения указан в сноске.
- source_word: לַקֹּדֶשׁ
  choice: для святилища
  rationale: В контексте скинии לַקֹּדֶשׁ естественно понимать как указание на предназначение для святилища, хотя возможна более общая трактовка «для священного употребления».
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִךָ
  choice: всё так, как Я повелел тебе
  rationale: Сохраняет всеохватность כְּכֹל и непосредственное обращение Бога к Моисею, оставаясь естественным по-русски.
- source_word: יַעֲשׂוּ
  choice: Пусть они сделают
  rationale: Передаёт форму третьего лица множественного числа с предписывающей силой; «они» относится к ранее названным мастерам, а «всё» естественно объединяет перечисленные предметы.
theological_decisions:
- issue: Значение לַקֹּדֶשׁ
  choice: для святилища
  alternative: для священного употребления; для святого места
  rationale: Контекст изготовления принадлежностей скинии поддерживает пространственно-культовое понимание «для святилища», но более общее указание на священное назначение также грамматически возможно.
translation_notes:
  register: Современный литературный русский с понятной культовой лексикой. Выбрано общеупотребительное «масло», а не более архаичное «елей»; синтаксис сохраняет предписывающий и торжественный характер речи.
