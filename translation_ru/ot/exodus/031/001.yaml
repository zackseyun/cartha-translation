lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И ... сказал
  rationale: Ваййиктоль с וַ продвигает повествование. В русской библейской повествовательной речи союз «и» естественно передаёт последовательность, а «сказал» вводит последующую прямую речь без тяжеловесности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Предлог אֶל при глаголе речи обозначает адресата. Русский дательный падеж передаёт это естественнее буквального «к Моисею».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит содержание речи. В современном русском его функцию перед двоеточием и следующей прямой речью естественно передаёт пунктуация; буквальное «говоря» было бы стилистически избыточным.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. «Яхве» представляет принятую научную реконструкцию произношения; примечание сохраняет сведения о традиционной замене титулом и об альтернативной форме.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула לֵאמֹר передана двоеточием, поскольку далее начинается речь; это избегает неестественного калькирования. Маркер примечания поставлен после имени адресата по предоставленному образцу.
