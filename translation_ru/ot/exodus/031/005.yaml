lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: в обработке / в резьбе
  rationale: Существительное обозначает искусную ремесленную обработку. С учётом материала первый случай передан как «обработка» камня, а второй — естественным русским выражением «резьба по дереву».
- source_word: אֶבֶן
  choice: камня
  rationale: В еврейском тексте употреблено общее слово «камень». Контекст допускает драгоценные камни, однако сам стих этого не уточняет.
- source_word: לְמַלֹּאת
  choice: для вставки в оправу
  rationale: В ремесленном контексте речь идёт о подготовке камней для закрепления в предназначенном для них месте. Этот перевод передаёт смысл естественнее, чем буквальное «для наполнения».
- source_word: עֵץ
  choice: дереву
  rationale: Обычное обозначение дерева как материала; выражение «резьба по дереву» естественно для современного русского языка.
- source_word: לַעֲשׂוֹת
  choice: в выполнении
  rationale: Инфинитив עשה имеет широкое значение. Номинальная конструкция «в выполнении» согласована с перечислением навыков и не сужает смысл до изготовления предметов.
- source_word: בְּכָל מְלָאכָה
  choice: всякой работы
  rationale: מְלָאכָה означает работу, занятие или ремесленный труд. Общее выражение сохраняет широту исходного текста, а контекст указывает на искусную работу.
