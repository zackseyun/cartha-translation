id: EXO.31.13
reference: Exodus 31:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אַתָּ֞ה דַּבֵּ֨ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אַ֥ךְ אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ כִּי֩ א֨וֹת הִ֜וא בֵּינִ֤/י וּ/בֵֽינֵי/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/013.yaml
  text: And you[a], speak to the sons of Israel, saying, ‘Surely you shall keep my Sabbaths, for it is a sign between me and you throughout your generations[c][b], so that you may know that I am Yahweh who sanctifies you.’
translation:
  language: ru
  text: 'А ты скажи сынам Израиля: «Непременно соблюдайте Мои субботы[a], потому что это знак между Мной и вами во все ваши поколения, чтобы вы знали, что Я — Яхве, освящающий вас[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Только соблюдайте Мои субботы»; также возможно: «Однако соблюдайте Мои субботы». Еврейская частица может выражать ограничение или сильное подчёркивание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «делающий вас святыми».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: А ты
  rationale: Вынесенное местоимение подчёркивает адресата и отмечает переход от предыдущих повелений; «А ты» естественно передаёт этот контраст в русском языке.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальный родственный образ стандартного заветного обозначения народа Израиля и при этом звучит привычно в библейском регистре.
- source_word: אַךְ
  choice: непременно
  rationale: 'Передаёт усилительно-ограничительную силу частицы в контексте: даже при исполнении работ по устройству святилища субботы должны соблюдаться. Альтернативные оттенки отмечены в сноске.'
- source_word: שַׁבְּתֹתַי
  choice: Мои субботы
  rationale: Сохранены множественное число и притяжательная форма исходного текста.
- source_word: תִּשְׁמֹרוּ
  choice: соблюдайте
  rationale: В контексте заповеди שׁמר означает хранить или соблюдать установление; русский императив естественнее формального будущего со значением приказа.
- source_word: אוֹת
  choice: знак
  rationale: Обычное и точное обозначение видимого знака заветных отношений.
- source_word: לְדֹרֹתֵיכֶם
  choice: во все ваши поколения
  rationale: Передаёт продолжительность установления на протяжении последовательных поколений.
- source_word: לָדַעַת
  choice: чтобы вы знали
  rationale: Естественно выражает целевое значение инфинитива с ל.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: מְקַדִּשְׁכֶם
  choice: освящающий вас
  rationale: Причастная форма сохраняет характеристику продолжающегося или свойственного Богу действия; «освящающий» удерживает богословскую насыщенность корня קדש.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» прямо его передаёт, не подменяя титулом.
- issue: Значение מְקַדִּשְׁכֶם
  choice: освящающий вас
  alternative: делающий вас святыми
  rationale: Основной текст сохраняет традиционный и точный глагол «освящать», а сноска раскрывает его смысл без сведения освящения к одной конфессиональной трактовке.
- issue: Функция субботы как знака
  choice: это знак между Мной и вами
  alternative: она — знак между Мной и вами
  rationale: Еврейское הִוא формально женского рода и может соотноситься с подразумеваемой субботой, однако «это знак» по-русски естественно относится ко всему предписанию о соблюдении Божьих суббот и не устраняет смысловой диапазон.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис упрощён до естественной прямой речи, но сохранены заветные формулы, множественное число «субботы», обозначение «сыны Израиля» и личное имя «Яхве». Все маркеры сносок помещены непосредственно после соответствующих выражений.
