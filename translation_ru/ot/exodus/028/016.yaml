  text: It shall be square and doubled[a], a span its length and a span its width.
translation:
  language: ru
  text: 'Он должен быть квадратным и сложенным вдвое[a]: пядь в длину и пядь в ширину.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «двойным». Еврейское слово описывает нагрудник как сделанный в два слоя, вероятно сложенный пополам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: квадратным
  rationale: Прилагательное обозначает квадратную, а не просто четырёхугольную форму; современное русское «квадратным» точно и естественно.
- source_word: יִהְיֶה
  choice: должен быть
  rationale: Имперфект в данном предписании выражает требование к изготовлению нагрудника; «должен быть» передаёт нормативную силу естественным современным русским языком.
- source_word: כָּפוּל
  choice: сложенным вдвое
  rationale: Пассивное причастие описывает предмет как удвоенный, вероятно посредством складывания. «Сложенным вдвое» ясно передаёт форму, не уточняя сверх текста способ конструкции.
- source_word: זֶרֶת
  choice: пядь
  rationale: Это традиционная и точная русская мера длины — расстояние между концами растянутых пальцев; она не смешивается с иной мерой, шириной ладони.
- source_word: אָרְכּוֹ
  choice: в длину
  rationale: В русской формуле размеров оборот «пядь в длину» естественнее буквального «его длина — пядь» и сохраняет значение.
- source_word: וְזֶרֶת
  choice: и пядь
  rationale: Союз соединяет две одинаковые меры; повтор единицы измерения соответствует еврейскому тексту и естественен по-русски.
- source_word: רָחְבּוֹ
  choice: в ширину
  rationale: Передаёт размер по ширине в естественной русской формуле измерения и сохраняет противопоставление длине.
