  yaml_path: translation/ot/exodus/028/036.yaml
  text: 'And you shall make a plate of pure gold[a], and engrave on it, like the engravings of a seal: ‘Holy to Yahweh.’'
translation:
  language: ru
  text: 'И сделай пластину из чистого золота и вырежи на ней надпись, как вырезают на печати: «Святыня Яхве».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Посвящено Яхве».'
