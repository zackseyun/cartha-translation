lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: И сделай
  rationale: Последовательная инструкция; повелительное наклонение естественно передаёт директивную силу еврейской формы с союзом.
- source_word: צִּיץ
  choice: пластину
  rationale: В данном контексте слово обозначает золотое украшение на головном уборе первосвященника; «пластина» ясно передаёт форму предмета, не навязывая этимологический образ цветка.
- source_word: זָהָב טָהוֹר
  choice: из чистого золота
  rationale: Естественное русское обозначение материала и его качества.
- source_word: וּפִתַּחְתָּ עָלָיו
  choice: и вырежи на ней
  rationale: Глагол здесь относится к нанесению резной надписи на металлический предмет; «вырежи» также связывает фразу со следующим упоминанием печати.
- source_word: פִּתּוּחֵי חֹתָם
  choice: как вырезают на печати
  rationale: Передаёт способ исполнения — резьбу, характерную для печати, — естественным современным русским языком; множественная форма в еврейском выражении не требует буквального множественного числа в русском.
- source_word: קֹדֶשׁ לַיהוָה
  choice: Святыня Яхве
  rationale: Краткая именная формула сохраняет надписный характер и допускаемую существительную силу קֹדֶשׁ; посвящённость Яхве выражена дательным падежом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, представленное тетраграмматоном, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет это различие.
- issue: Смысл формулы קֹדֶשׁ לַיהוָה
  choice: Святыня Яхве
  alternative: Свято Яхве
  rationale: קֹדֶשׁ может обозначать «святыню/святость» либо иметь предикативно-качественную силу. Основной текст использует естественную для русской надписи именную формулу, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой культовой надписи; синтаксис инструкции прост и понятен широкому читателю.
