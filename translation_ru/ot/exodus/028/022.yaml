base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/022.yaml
  text: And you shall make on the breastpiece chains of pure gold[a], braided work like cords.
translation:
  language: ru
  text: Сделай на нагруднике цепочки из чистого золота, сплетённые наподобие шнуров[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «витые цепочки»; еврейское выражение описывает цепочки, изготовленные плетением или скручиванием наподобие шнура.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Сделай
  rationale: Перфект qal с союзом в последовательности предписаний передаёт повеление; русская форма повелительного наклонения выражает его естественно и ясно.
- source_word: עַל הַחֹשֶׁן
  choice: на нагруднике
  rationale: Предлог עַל обычно означает «на, поверх» и здесь указывает на размещение или крепление цепочек на нагруднике.
- source_word: שַׁרְשֹׁת
  choice: цепочки
  rationale: Существительное обозначает цепи; уменьшительная форма уместна для тонкой золотой ювелирной работы и согласуется с контекстом нагрудника.
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: сплетённые наподобие шнуров
  rationale: Сочетание описывает связанную, витую или плетёную технику изготовления, напоминающую шнур; перевод сохраняет образ и остаётся понятным без узкоспециальной терминологии.
- source_word: זָהָב טָהוֹר
  choice: из чистого золота
  rationale: Обычное и точное обозначение материала в предписаниях об устройстве святилища.
