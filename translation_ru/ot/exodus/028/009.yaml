  yaml_path: translation/ot/exodus/028/009.yaml
  text: And you shall take two onyx stones and engrave on them the names of the sons of Israel[a].
translation:
  language: ru
  text: И возьми два камня оникса[a] и вырежи на них имена сыновей Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово шо́хам обозначает драгоценный камень, который традиционно называют ониксом; точный вид минерала неизвестен. Предлагались также варианты «сардоникс» и «берилл».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: И возьми
  rationale: Форма с союзом וְ в последовательности предписаний передаёт повеление и связь с предыдущими указаниями; «И возьми» естественно и точно выражает это по-русски.
- source_word: שְׁתֵּי אַבְנֵי שֹׁהַם
  choice: два камня оникса
  rationale: Традиционное соответствие для שֹׁהַם — «оникс», хотя точный вид минерала неизвестен; неопределённость отмечена в сноске.
- source_word: וּפִתַּחְתָּ
  choice: и вырежи
  rationale: В контексте нанесения имён на драгоценные камни глагол обозначает вырезание, то есть гравировку надписи. «Вырежи» ясно и естественно передаёт конкретное действие.
- source_word: עֲלֵיהֶם
  choice: на них
  rationale: Предлог прямо указывает на поверхность двух камней; местоимение сохраняет множественное число.
- source_word: שְׁמוֹת
  choice: имена
  rationale: Прямое дополнение к «вырежи»; в русском языке определённость этих конкретных имён понятна из последующего родительного оборота и отдельного показателя не требует.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыновей Израиля
  rationale: Здесь имеются в виду именно сыновья патриарха Израиля, ставшие родоначальниками колен, а не израильтяне вообще; буквальное обозначение сохраняет эту точность.
