base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/030.yaml
  text: And you shall put the Urim and the Thummim into the breastpiece of judgment[a], and they shall be on Aaron’s heart when he goes in before Yahweh[c][b]. And Aaron shall bear the judgment of the sons of Israel on his heart before Yahweh continually.
translation:
  language: ru
  text: И вложи в нагрудник суда[b] урим и туммим[a]. Они будут на груди Аарона, над его сердцем, когда он будет входить перед Яхве. И Аарон будет постоянно нести суд сынов Израиля[c] на своём сердце перед Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Урим и туммим — древнееврейские названия священных предметов, связанных со священническим вынесением решений; их точный вид и способ применения неизвестны. Возможные этимологические значения — «светы» и «совершенства».
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «нагрудник для вынесения решений» или «нагрудник правосудия». Древнееврейское מִשְׁפָּט может означать суд, решение или правосудие — в зависимости от контекста.'
    reason: alternative_reading
  - marker: c
    text: «Сыны Израиля» — древнееврейское обозначение народа Израиля как заветного сообщества.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן הַמִּשְׁפָּט
  choice: нагрудник суда
  rationale: «Нагрудник» естественно обозначает предмет священнического облачения, а «суда» сохраняет повтор מִשְׁפָּט во второй половине стиха и не сужает его смысл до одного лишь решения.
- source_word: הָאוּרִים וְהַתֻּמִּים
  choice: урим и туммим
  rationale: Технические культовые названия транслитерированы, поскольку точные вид, назначение и этимология этих предметов остаются неясными.
- source_word: אֶל
  choice: в
  rationale: При глаголе נתן и названии нагрудника предлог передаёт помещение внутрь нагрудника или его вместилища; по-русски это естественно выражается сочетанием «вложи в».
- source_word: וְהָיוּ עַל לֵב אַהֲרֹן
  choice: они будут на сердце Аарона
  rationale: Сохранён конкретный образ предметов, расположенных на груди над сердцем, и возможный символический оттенок представительства.
- source_word: בְּבֹאוֹ לִפְנֵי יְהוָה
  choice: когда он будет входить пред Яхве
  rationale: «Входить» передаёт оттенок вступления в святилище, а «пред Яхве» — пребывание перед Божьим лицом без добавления отсутствующих в тексте уточнений.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой научной транслитерацией, а не заменено титулом.
- source_word: וְנָשָׂא
  choice: будет носить
  rationale: Глагол сохраняет физический смысл ношения нагрудника и одновременно допускает представительственный смысл несения ответственности.
- source_word: מִשְׁפַּט בְּנֵי יִשְׂרָאֵל
  choice: суд сынов Израиля
  rationale: «Суд» сохраняет лексическую связь с «нагрудником суда» и оставляет открытыми связанные значения судебного решения и правосудия.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранена традиционная и понятная русская передача древнееврейского заветного обозначения, при этом примечание поясняет его коллективный референт.
- source_word: עַל לִבּוֹ
  choice: на своём сердце
  rationale: Повторён образ первой части стиха; возвратное местоимение делает русскую фразу однозначной и естественной.
- source_word: תָּמִיד
  choice: постоянно
  rationale: В священническом контексте слово указывает на устойчивое, регулярное служение перед Богом, не обязательно на непрерывное действие в каждое мгновение.
theological_decisions:
- issue: Перевод названий אוּרִים и תֻּמִּים
  choice: Транслитерировать как «урим и туммим»
  alternative: Перевести как «светы и совершенства»
  rationale: Смысл и этимология названий спорны; перевод предполагаемых значений выдал бы гипотезу за установленный факт.
- issue: Значение מִשְׁפָּט в двух употреблениях
  choice: В обоих случаях передать словом «суд»
  alternative: «решение» или «правосудие»
  rationale: Так сохраняются повтор и богословская напряжённость исходного текста без преждевременного определения того, обозначает ли слово решение, судебное установление или правосудие.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: «сыны Израиля» в основном тексте
  alternative: «израильтяне» или «народ Израиля»
  rationale: Формулировка сохраняет древнееврейское заветное обозначение, а примечание предотвращает ошибочное понимание как ссылки только на непосредственных сыновей патриарха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сочетание «пред Яхве» сохраняет достоинство и лаконичность оригинала; синтаксис упрощён до естественных русских предложений без устранения повторов «суд» и «на сердце».
