  terminology: «Нагрудник суда» сохраняет традиционно-культовую и семантически широкую формулу חֹשֶׁן הַמִּשְׁפָּט; примечание корректно отмечает вариант «нагрудник решения». Передача тетраграмматона как «Яхве» последовательна. Формула «сынов Израиля» обоснованно сохраняет генеалогическую форму оригинала.
