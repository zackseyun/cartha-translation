id: EXO.28.29
reference: Exodus 28:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת שְׁמ֨וֹת בְּנֵֽי יִשְׂרָאֵ֜ל בְּ/חֹ֧שֶׁן הַ/מִּשְׁפָּ֛ט עַל לִבּ֖/וֹ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ לְ/זִכָּרֹ֥ן לִ/פְנֵֽי יְהוָ֖ה תָּמִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/029.yaml
  text: Aaron shall carry the names of the sons of Israel in the breastpiece of judgment over his heart when he goes into the Holy Place[d][c][b][a], for a memorial before Yahweh continually.
translation:
  language: ru
  text: И будет Аарон носить имена сынов Израиля на нагруднике суда[a] у своего сердца, когда входит в святилище, для постоянного напоминания пред Яхве.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на нагруднике решения».'
    reason: Слово מִשְׁפָּט может обозначать суд, судебное решение или решение, получаемое перед Богом.
  - marker: b
    text: 'Возможный перевод: «как постоянный памятный знак пред Яхве».'
    reason: Существительное זִכָּרוֹן допускает значения «напоминание» и «памятный знак».
lexical_decisions:
- source_word: וְנָשָׂא
  choice: будет носить
  rationale: Глагол נשׂא означает «нести, носить». Форма «будет носить» естественно передаёт предписанное повторяющееся священническое действие.
- source_word: שְׁמוֹת בְּנֵי יִשְׂרָאֵל
  choice: имена сынов Израиля
  rationale: Сохранены как конкретные начертанные имена, так и генеалогическая форма исходного текста.
- source_word: בְּחֹשֶׁן הַמִּשְׁפָּט
  choice: на нагруднике суда
  rationale: «Нагрудник» обозначает предмет священнического облачения; «суда» сохраняет широкий смысл מִשְׁפָּט и не сводит его функцию только к вынесению решения.
- source_word: עַל לִבּוֹ
  choice: у своего сердца
  rationale: Передаёт расположение нагрудника на груди и сохраняет символический образ ношения имён у сердца.
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  choice: когда входит в святилище
  rationale: Конструкция с инфинитивом имеет временное значение; הַקֹּדֶשׁ здесь обозначает сакральное пространство скинии.
- source_word: לְזִכָּרֹן ... תָּמִיד
  choice: для постоянного напоминания
  rationale: לְזִכָּרֹן выражает цель — служить напоминанием или памятным знаком, а תָּמִיד указывает на постоянный, регулярно продолжающийся характер служения.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» естественно передаёт присутствие перед Богом; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Значение культового названия חֹשֶׁן הַמִּשְׁפָּט
  choice: нагрудник суда
  alternative: нагрудник решения
  rationale: Родительный оборот сохраняет связь предмета с судом или решением, не уточняя сверх текста, каким именно образом эта функция осуществлялась.
- issue: Референт הַקֹּדֶשׁ
  choice: святилище
  alternative: Святое место
  rationale: В контексте скинии слово обозначает священное пространство. «Святилище» понятно современному читателю и не навязывает более узкого архитектурного толкования.
- issue: Смысл לְזִכָּרֹן לִפְנֵי יְהוָה
  choice: для постоянного напоминания пред Яхве
  alternative: как постоянный памятный знак пред Яхве
  rationale: Формулировка сохраняет направленность памятного действия «пред Яхве», не определяя однозначно, кому именно служит это напоминание.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян
  rationale: Генеалогическая формула сохранена буквально, поскольку в контексте речь идёт об именах родоначальников колен.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис остаётся близким к еврейскому, но читается естественно; подлинные смысловые варианты вынесены в примечания.
