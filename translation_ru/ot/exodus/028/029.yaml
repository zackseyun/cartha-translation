  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: Аарон носит именно «имена сынов Израиля», нагрудник назван «нагрудником суда», его расположение передано как «у своего сердца», вход во святилище выражен временным оборотом, а memorial-формула сохранена без излишнего уточнения адресата напоминания. «Постоянного» адекватно передаёт תָּמִיד в его культовом значении регулярной непрерывности.'
