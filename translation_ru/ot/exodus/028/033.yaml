base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/033.yaml
  text: You shall make on its hem pomegranates of blue and purple and scarlet yarn[a], all around its hem, with bells of gold between them all around.
translation:
  language: ru
  text: На его подоле сделай гранаты[a] из синей, пурпурной и алой пряжи — по всему подолу кругом; между ними кругом сделай золотые колокольчики.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «украшения в форме гранатов». Буквально: «гранаты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: сделай
  rationale: Форма с союзом в контексте предписаний передаёт повеление; русский императив естественен и сохраняет нормативную силу.
- source_word: עַל שׁוּלָיו
  choice: по нижнему краю его
  rationale: Речь идёт о нижней кромке одежды; выражение ясно для современного читателя и точнее локализует украшения, чем одно слово «подол».
- source_word: רִמֹּנֵי
  choice: гранаты
  rationale: Еврейское слово буквально обозначает плоды граната; вероятный смысл декоративных форм не подставлен в основной текст, а отмечен в сноске.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: из синей, пурпурной и алой пряжи
  rationale: В контексте священных одежд названия цветов обозначают окрашенный текстильный материал; добавление «пряжи» естественно выражает подразумеваемый материал.
- source_word: סָבִיב
  choice: кругом
  rationale: Передаёт размещение по всей окружности нижнего края; первое употребление дополнительно раскрыто словами «по всему».
- source_word: וּפַעֲמֹנֵי זָהָב
  choice: а ... золотые колокольчики
  rationale: Сохраняет добавление второго вида деталей и естественно связывает его с предыдущей конструкцией.
- source_word: בְּתוֹכָם
  choice: между ними
  rationale: По контексту колокольчики располагаются среди гранатов, фактически между ними; это ясная пространственная формулировка без избыточного уточнения схемы чередования.
