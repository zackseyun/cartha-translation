id: EXO.28.15
reference: Exodus 28:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חֹ֤שֶׁן מִשְׁפָּט֙ מַעֲשֵׂ֣ה חֹשֵׁ֔ב כְּ/מַעֲשֵׂ֥ה אֵפֹ֖ד תַּעֲשֶׂ֑/נּוּ זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר תַּעֲשֶׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/015.yaml
  text: 'You shall make a breastpiece of judgment[a], the work of a skillful designer; like the work of the ephod you shall make it: of gold, blue, purple, scarlet yarn[b], and finely twisted linen you shall make it.'
translation:
  language: ru
  text: 'Сделай нагрудник суда[a] работы искусного мастера[b]. Сделай его так же, как сделан эфод: из золота, голубой, пурпурной и алой пряжи и тонкого кручёного льна.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нагрудник для суда»; возможно также: «нагрудник решения».'
    reason: Сочетание может обозначать принадлежность к суду или предназначение для вынесения решения.
  - marker: b
    text: 'Буквально: «изделие замышляющего»; имеется в виду искусно задуманная и выполненная узорчатая работа.'
    reason: Еврейское выражение подчёркивает мастерство и художественный замысел, но само по себе не называет однозначно конкретную технику изготовления.
lexical_decisions:
- source_word: חֹשֶׁן
  choice: нагрудник
  rationale: Обозначает особое священническое украшение, носимое на груди. «Нагрудник» точнее, чем «наперсник» для современного читателя, и не вызывает ассоциации с воинскими доспехами, как «нагрудная броня».
- source_word: מִשְׁפָּט
  choice: суда
  rationale: Формально сохраняет конструкцию חֹשֶׁן מִשְׁפָּט и её связь с судебным решением, не уточняя в самом тексте не названный здесь механизм.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: работы искусного мастера
  rationale: Передаёт изделие, выполненное умелым ремесленником по искусно задуманному узору, не сужая значение до одного конкретного способа ткачества.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: так же, как эфод
  rationale: Естественно выражает требование изготовить нагрудник тем же способом или с тем же мастерством, что и эфод.
- source_word: אֵפֹד
  choice: эфод
  rationale: Сохранён общепринятый специальный термин для особого священнического облачения, не имеющий точного краткого русского соответствия.
- source_word: זָהָב
  choice: золото
  rationale: Прямое обозначение материала; в контексте перечисления передано формой «из золота».
- source_word: תְּכֵלֶת
  choice: голубая пряжа
  rationale: Передаёт традиционно понимаемый сине-голубой цвет дорогого красителя и текстильный характер материала.
- source_word: אַרְגָּמָן
  choice: пурпурная пряжа
  rationale: Передаёт название дорогого пурпурного красителя как цвет пряжи в перечне материалов.
- source_word: תוֹלַעַת שָׁנִי
  choice: алая пряжа
  rationale: Передаёт алый или багряный окрашенный текстиль; «алая» понятно современному читателю и соответствует контексту.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: тонкий кручёный лён
  rationale: Сохраняет качество материала и указание на скручивание льняных нитей, оставаясь естественным по-русски.
- source_word: תַּעֲשֶׂנּוּ ... תַּעֲשֶׂה אֹתוֹ
  choice: Сделай его ... Сделай
  rationale: Повтор глагола сохранён, чтобы передать настойчивый предписывающий стиль еврейского текста.
theological_decisions:
- issue: Функция חֹשֶׁן מִשְׁפָּט
  choice: «нагрудник суда» без дополнительного объяснения функции в основном тексте
  alternative: «нагрудник для принятия решений» или «нагрудник правосудия»
  rationale: Сочетание связано со священническим судом или вынесением решения, однако данный стих не объясняет точной функции. Формальная передача сохраняет культовый и судебный смысл, не навязывая более узкого толкования.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным предписывающим строем. Специальный культовый термин «эфод» сохранён. Повтор «Сделай» отражает структуру оригинала; перечень материалов сформулирован естественно для современного читателя.
