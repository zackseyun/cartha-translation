lexical_decisions:
- source_word: שַׁרְשְׁרֹת
  choice: цепочки
  rationale: Речь идёт о золотых ювелирных цепочках на священническом облачении; уменьшительная форма естественно передаёт их назначение и масштаб.
- source_word: זָהָב טָהוֹר
  choice: чистое золото
  rationale: Устойчивый и точный русский эквивалент обозначения материала.
- source_word: מִגְבָּלֹת ... מַעֲשֵׂה עֲבֹת
  choice: сплетённые наподобие шнуров
  rationale: Оба редких, семантически близких выражения описывают витую или шнурообразную работу. Сжатая формулировка сохраняет вероятный образ без неестественного повтора.
- source_word: וְנָתַתָּ
  choice: прикрепи
  rationale: В данном контексте цепочки не просто кладут, а устанавливают на золотых оправах; «прикрепи» естественно выражает требуемое действие.
- source_word: שַׁרְשְׁרֹת הָעֲבֹתֹת
  choice: плетёные цепочки
  rationale: Передаёт повторное указание на шнурообразную, витую конструкцию цепочек.
- source_word: הַמִּשְׁבְּצֹת
  choice: оправы
  rationale: Термин обозначает золотые гнёзда или обрамления, упомянутые в ближайшем контексте; «оправы» уместно для ювелирного изделия.
