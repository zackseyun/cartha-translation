base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/001.yaml
  text: 'And you[a], bring near to yourself Aaron your brother, and his sons with him, from among the sons of Israel, to serve as priests for me: Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons.'
translation:
  language: ru
  text: 'А ты приблизь к себе Аарона, брата твоего, и его сыновей вместе с ним, из среды сынов Израиля[a], для священнического служения Мне: Аарона, Надава и Авиуда, Елеазара и Ифамара, сыновей Аарона.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из среды израильтян». Буквально: «из среды сынов Израиля» — обычное обозначение народа завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: А ты
  rationale: Самостоятельное местоимение подчёркивает обращение к Моисею и обозначает переход к новому повелению.
- source_word: הַקְרֵב אֵלֶיךָ
  choice: приблизь к себе
  rationale: Сохраняет конкретный образ каузативной формы глагола קרב и личную направленность действия к Моисею, не истолковывая это слово как уже совершённое посвящение.
- source_word: אָחִיךָ
  choice: брата твоего
  rationale: Прямо передаёт указанное в еврейском тексте родство; порядок слов поддерживает достойный библейский регистр, оставаясь понятным.
- source_word: בָּנָיו אִתּוֹ
  choice: с ним его сыновей
  rationale: Явно сохраняет значение совместного приближения Аарона и его сыновей.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: из среды сынов Израиля
  rationale: Передаёт выбор изнутри народа и сохраняет исходное заветное обозначение; более обычное русское «израильтян» дано в сноске.
- source_word: לְכַהֲנוֹ לִי
  choice: для священнического служения Мне
  rationale: Передаёт целевое значение и священническую функцию, не навязывая числового толкования неоднозначной формы и не сводя действие к одному лишь формальному назначению.
- source_word: בְּנֵי אַהֲרֹן
  choice: сыновей Аарона
  rationale: Естественно по-русски сохраняет заключительное родословное уточнение.
theological_decisions:
- issue: Объём священнического служения в выражении לְכַהֲנוֹ לִי
  choice: для священнического служения Мне
  alternative: чтобы они служили Мне священниками / чтобы он служил Мне священником
  rationale: Именная конструкция по-русски сохраняет целевое значение и не разрешает без необходимости формальное напряжение между единственным числом еврейской формы и перечислением Аарона вместе с его сыновьями.
- issue: Корпоративное обозначение בְּנֵי יִשְׂרָאֵל
  choice: из среды сынов Израиля
  alternative: из среды израильтян
  rationale: Основной текст сохраняет традиционное, близкое к форме источника обозначение народа завета, а сноска поясняет его естественный коллективный смысл.
translation_notes:
  register: 'Современный литературный русский с умеренно торжественным библейским звучанием. Прописное «Мне» следует принятой русской традиции при обозначении Бога. Имена переданы в общеупотребительных русских библейских формах: Аарон, Надав, Авиуд, Елеазар, Ифамар. Маркер сноски помещён непосредственно после выражения, которое он поясняет.'
