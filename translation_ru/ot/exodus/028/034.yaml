  yaml_path: translation/ot/exodus/028/034.yaml
  text: a gold bell and a pomegranate[a], a gold bell and a pomegranate[b], around the hem of the robe all around.
translation:
  language: ru
  text: золотой колокольчик и гранат[a], золотой колокольчик и гранат — по всему подолу одеяния[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «гранат», вероятно, означает прикреплённое между колокольчиками украшение в форме плода граната.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «на подоле одеяния кругом». Еврейский текст сочетает предлог «на» с наречием «кругом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: колокольчик
  rationale: Слово обозначает небольшой колокольчик на священническом одеянии; уменьшительная форма естественно передаёт его размер и назначение.
- source_word: זָהָב
  choice: золотой
  rationale: В сочетании с названием предмета материал естественно передаётся по-русски относительным прилагательным.
- source_word: רִמּוֹן
  choice: гранат
  rationale: Основное значение слова — плод граната; в данном контексте подразумевается украшение в форме граната, но основной текст сохраняет конкретный образ еврейского оригинала.
- source_word: עַל ... סָבִיב
  choice: по всему
  rationale: Сочетание предлога со значением «на» и наречия «кругом» описывает расположение украшений вдоль всей окружности подола; «по всему подолу» естественно выражает это по-русски.
- source_word: שׁוּלֵי
  choice: подол
  rationale: В контексте одежды форма слова указывает на нижний край; «подол» — точное и понятное русское соответствие.
- source_word: מְעִיל
  choice: одеяние
  rationale: Здесь имеется в виду особая верхняя часть священнического облачения; «одеяние» сохраняет достоинство культового контекста и не сужает значение до современного пальто или плаща.
