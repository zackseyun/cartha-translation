base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/028.yaml
  text: They shall bind the breastpiece by its rings to the rings of the ephod with a cord of blue yarn[a], so that it may be on the skillfully woven band of the ephod[c][b], and the breastpiece shall not come loose from the ephod.
translation:
  language: ru
  text: Пусть нагрудник прикрепят за его кольца к кольцам эфода шнуром из голубой пряжи[a], чтобы он находился на искусно вытканном поясе эфода и не сдвигался с эфода[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «голубым шнуром». Еврейское слово תְּכֵלֶת обозначает голубой текстильный материал, употреблявшийся при изготовлении скинии и священнических облачений.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не отделялся от эфода».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְכְּסוּ
  choice: пусть прикрепят
  rationale: Глагол обозначает скрепление или прочное соединение; «прикрепят» естественно передаёт действие со шнуром и кольцами, не уточняя сверх текста способ крепления.
- source_word: הַחֹשֶׁן
  choice: нагрудник
  rationale: В контексте священнического облачения это особый предмет, носимый на груди, а не защитный доспех; «нагрудник» точно и понятно передаёт значение.
- source_word: מִטַּבְּעֹתָיו
  choice: за его кольца
  rationale: Предлог מִן указывает на исходную точку крепления; по-русски соединение предмета посредством его колец естественно выражается оборотом «за его кольца».
- source_word: טַבְּעֹת הָאֵפֹד
  choice: кольца эфода
  rationale: Прямая передача генитивной конструкции сохраняет ясность указания.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: шнуром из голубой пряжи
  rationale: פְּתִיל означает шнур или нить, а תְּכֵלֶת — окрашенный в сине-голубой оттенок текстильный материал; формулировка соответствует контексту изготовления облачения.
- source_word: לִהְיוֹת עַל
  choice: чтобы он находился на
  rationale: Инфинитив выражает цель или результат; нейтральное «находился на» сохраняет пространственное значение без добавления идеи покоя или опоры.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: искусно вытканный пояс эфода
  rationale: В данном контексте חֵשֶׁב обозначает тканую поясную перевязь эфода; определение «искусно вытканный» согласуется с описанием этой детали в ближайшем контексте.
- source_word: וְלֹא יִזַּח
  choice: и чтобы … не сдвигался
  rationale: Форма глагола передаёт смещение или отделение от закреплённого положения; «не сдвигался» сохраняет пространственный смысл и назначение крепления.
- source_word: מֵעַל הָאֵפֹד
  choice: с эфода
  rationale: Оборот обозначает удаление с положения на эфоде; русское «с эфода» кратко и точно передаёт это отношение.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной, достойной синтаксической формой предписания. Термины «нагрудник» и «эфод» последовательно отражают предметы священнического облачения; традиционное «наперсник» не выбрано как менее понятное современному читателю. Повтор слова «эфод» сохранён ради точности и устранения неоднозначности.
