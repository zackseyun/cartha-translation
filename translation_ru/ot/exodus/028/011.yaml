source:
  edition: WLC
  text: מַעֲשֵׂ֣ה חָרַשׁ֮ אֶבֶן֒ פִּתּוּחֵ֣י חֹתָ֗ם תְּפַתַּח֙ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֔ים עַל שְׁמֹ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל מֻסַבֹּ֛ת מִשְׁבְּצ֥וֹת זָהָ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/011.yaml
  text: Like the work of an engraver in stone[a], like the engravings of a signet, you shall engrave the two stones with the names of the sons of Israel[b]; you shall make them enclosed in settings of gold.
translation:
  language: ru
  text: Подобно работе резчика по камню, подобно гравировке печати, выгравируй на двух камнях имена сыновей Израиля[a]; заключи их в золотые оправы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть имена двенадцати сыновей Израиля, от которых произошли колена Израиля.
    reason: Культурно-историческое пояснение того, чьи именно имена вырезались на камнях.
lexical_decisions:
- source_word: מַעֲשֵׂה חָרַשׁ אֶבֶן
  choice: Как резчик по камню
  rationale: Сочетание указывает на способ искусной обработки камня; сравнительная конструкция естественно передаёт этот смысл по-русски.
- source_word: פִּתּוּחֵי חֹתָם
  choice: вырезает печать
  rationale: Речь идёт о глубокой резьбе, характерной для печати; по-русски это яснее и естественнее, чем буквальное «резьбою печати».
- source_word: תְּפַתַּח
  choice: вырежи
  rationale: В контексте нанесения имён на камни глагол означает вырезать или выгравировать; «вырежи» также сохраняет словесную связь с описанием работы мастера.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: на двух камнях
  rationale: Сохраняет общее исходное слово «камни», не уточняя сверх текста, что это драгоценные камни.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: имена сыновей Израиля
  rationale: Передаёт содержание надписи и сохраняет мужское родовое обозначение, связанное здесь с именами родоначальников колен.
- source_word: מֻסַבֹּת מִשְׁבְּצוֹת זָהָב
  choice: заключи их в золотые оправы
  rationale: Причастие выражает окружение или обрамление камней, а מִשְׁבְּצוֹת обозначает ювелирные оправы; формулировка точна и естественна по-русски.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: заключи их
  rationale: В сочетании с последующими словами общий глагол «сделать» естественно конкретизируется как повеление поместить камни в оправы.
theological_decisions:
- issue: Родовое обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыновей Израиля
  alternative: детей Израиля / израильтян
  rationale: Ближайший контекст говорит о двенадцати сыновьях-прародителях колен, поэтому буквальная формулировка одновременно точна исторически и не вносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повелительной формой. Синтаксис слегка перестроен ради естественности; образ резчика и печати, два камня, имена сыновей Израиля и золотые оправы сохранены.
