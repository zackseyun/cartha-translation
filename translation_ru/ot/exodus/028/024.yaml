  yaml_path: translation/ot/exodus/028/024.yaml
  text: And you shall put the two braided chains of gold on the two rings[b][a], at the ends of the breastpiece.
translation:
  language: ru
  text: Прикрепи две плетёные золотые цепочки[a] к двум кольцам на краях нагрудника[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «витые золотые цепочки».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «наперсник»; имеется в виду особая часть облачения первосвященника, а не металлический нагрудный доспех.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Прикрепи
  rationale: Форма с вау продолжает последовательность предписаний и по-русски естественно передаётся повелительным наклонением. В данном контексте речь идёт не просто о помещении, а о присоединении цепочек к кольцам.
- source_word: שְׁתֵּי עֲבֹתֹת הַזָּהָב
  choice: две плетёные золотые цепочки
  rationale: עֲבֹתֹת обозначает витые или сплетённые шнуры либо цепочки; в контексте золотых деталей священнического облачения слово «цепочки» наиболее наглядно, а «плетёные» передаёт способ изготовления.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: к двум кольцам
  rationale: Хотя עַל буквально часто означает «на», при соединении цепочек с кольцами современное русское «к» естественно выражает прикрепление.
- source_word: אֶל קְצֹוֹת הַחֹשֶׁן
  choice: на краях нагрудника
  rationale: קְצֹוֹת указывает на края или концы предмета, а חֹשֶׁן — на особую часть священнического облачения, носимую на груди; «нагрудник» точно и понятно передаёт предмет без ассоциации с металлическим доспехом.
