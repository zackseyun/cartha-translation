lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Сделай
  rationale: Форма с союзом в последовательности предписаний передаёт повеление; русский императив естественно и ясно сохраняет наставительный характер текста.
- source_word: מְעִיל
  choice: верхнюю ризу
  rationale: Слово обозначает цельную верхнюю одежду священника. «Риза» уместна как понятное обозначение культового облачения, а определение «верхняя» уточняет тип одежды.
- source_word: הָאֵפֹד
  choice: к эфоду
  rationale: «Эфод» — техническое название священнического облачения, поэтому оно транслитерируется. Конструктивное сочетание передаётся как риза, относящаяся к эфоду.
- source_word: כְּלִיל
  choice: целиком
  rationale: 'Передаёт значение полноты: вся риза должна быть изготовлена из указанного материала.'
- source_word: תְּכֵלֶת
  choice: синей ткани
  rationale: Термин обозначает дорогой окрашенный материал синего или сине-пурпурного оттенка; в данном контексте естественно назвать и цвет, и подразумеваемый материал.
