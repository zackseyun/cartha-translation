    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: а … ряд
  rationale: טוּר в описании нагрудника обозначает ряд камней. Союз וְ естественно передан как «а», поскольку стих продолжает последовательное перечисление рядов.
- source_word: הַ/שֵּׁנִי
  choice: второй
  rationale: Порядковое числительное согласовано со словом «ряд» и передано прямо.
- source_word: נֹפֶךְ
  choice: бирюза
  rationale: Точное соответствие древнего названия современному минералу не установлено; «бирюза» — вероятный и понятный вариант, а основные альтернативы отмечены в сноске.
- source_word: סַפִּיר
  choice: сапфир
  rationale: Традиционный и узнаваемый перевод; при этом древнееврейское слово могло обозначать лазурит, что отражено в сноске.
- source_word: וְ/יָהֲלֹם
  choice: и алмаз
  rationale: «Алмаз» — традиционное соответствие неопределённому названию драгоценного камня; другие возможные идентификации приведены в сноске.
