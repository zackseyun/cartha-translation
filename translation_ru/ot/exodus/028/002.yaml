  text: וְ/עָשִׂ֥יתָ בִגְדֵי קֹ֖דֶשׁ לְ/אַהֲרֹ֣ן אָחִ֑י/ךָ לְ/כָב֖וֹד וּ/לְ/תִפְאָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/002.yaml
  text: And you shall make holy garments for Aaron your brother[a], for glory and for beauty.
translation:
  language: ru
  text: И сделай священные одежды для Аарона, брата твоего, — для славы и великолепия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для чести и красоты»; или: «для славы и красоты».'
    reason: 'Лексемы כבוד и תפארת имеют пересекающиеся значения: слава, честь, достоинство; красота, великолепие, блеск.'
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: И сделай
  rationale: Форма Qal perfect 2 м. ед. с союзом в контексте предписаний передаёт повеление; русский совершенный императив естественно выражает конкретное поручение.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: священные одежды
  rationale: Сочетание обозначает одежды, отделённые для священного служения; «священные» здесь естественнее по-русски, чем буквальное «святые», и не привносит поздней церковной терминологии.
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: для Аарона, брата твоего
  rationale: Сохранены значение предлога и прямое обозначение родства; постпозиция «брата твоего» поддерживает достоинство библейского регистра, оставаясь понятной.
- source_word: לְכָבוֹד
  choice: для славы
  rationale: כבוד охватывает славу, честь и достоинство. «Слава» сохраняет возвышенность и широту выражения, не ограничивая его только человеческим почётом.
- source_word: וּלְתִפְאָרֶת
  choice: и великолепия
  rationale: תפארת может означать красоту, великолепие или блеск. «Великолепие» естественно сочетается со «славой» и передаёт как эстетическую красоту, так и торжественный блеск одежд.
theological_decisions:
- issue: Назначение священных одежд в выражении לְכָבוֹד וּלְתִפְאָרֶת
  choice: «для славы и великолепия» без уточнения, чья именно это слава
  alternative: «для чести и красоты»; «для славы и красоты»
  rationale: Еврейский текст оставляет широкими и носителя славы, и соотношение достоинства с видимой красотой. Перевод не сводит смысл ни исключительно к почёту Аарона, ни исключительно к Божьей славе.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Тире отделяет цель изготовления одежд. Маркер сноски помещён после всего вариативного выражения.
