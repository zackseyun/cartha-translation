lexical_decisions:
- source_word: וְהֵם
  choice: они
  rationale: Самостоятельное местоимение явно обозначает уже упомянутых мастеров; в русском естественно передать его без усилительного «сами».
- source_word: יִקְחוּ
  choice: пусть возьмут
  rationale: Имперфект в данном контексте имеет предписывающую силу; конструкция с «пусть» ясно и естественно передаёт распоряжение.
- source_word: הַזָּהָב
  choice: золото
  rationale: Речь идёт о материале для священнических одежд; русский язык не располагает артиклем, поэтому определённость восстанавливается из контекста.
- source_word: הַתְּכֵלֶת
  choice: голубую пряжу
  rationale: Слово обозначает не только цвет, но и окрашенный текстильный материал; контекст изготовления одежд позволяет естественно уточнить «пряжу».
- source_word: הָאַרְגָּמָן
  choice: пурпурную пряжу
  rationale: Обозначает материал, окрашенный в пурпурный цвет; «пряжа» соответствует контексту изготовления тканей и сохраняет параллелизм перечня.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: червлёную пряжу
  rationale: Устойчивое выражение обозначает ярко-красный текстильный материал, окрашенный красителем из насекомых; «червлёную» сохраняет традиционный и вместе с тем понятный библейский регистр.
- source_word: הַשֵּׁשׁ
  choice: тонкий лён
  rationale: В описаниях святилища שֵׁשׁ означает высококачественный тонкий льняной материал.
