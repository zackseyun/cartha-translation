  yaml_path: translation/ot/exodus/028/042.yaml
  text: And make for them linen undergarments to cover their naked flesh[b][a]; they shall be from the hips to the thighs.
translation:
  language: ru
  text: Сделай им льняные нижние одежды[a], чтобы прикрывать обнажённое тело; они должны доходить от талии[b] до бёдер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «льняные штаны»; речь идёт об одежде для нижней части тела, которую носили под священническим облачением.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может означать чресла, талию или область пояса.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Сделай
  rationale: Императив Qal передаёт прямое предписание; союзную последовательность в русском естественно продолжает сама форма повеления.
- source_word: לָהֶם
  choice: им
  rationale: Дательный падеж естественно передаёт адресатно-бенефактивное значение и относится к ранее названным священникам.
- source_word: מִכְנְסֵי בָד
  choice: льняные нижние одежды
  rationale: Название обозначает надеваемую под облачение одежду для нижней части тела. Этот вариант ясен современному читателю и сохраняет достоинство культового контекста; материал בָד передан как «льняные».
- source_word: לְכַסּוֹת
  choice: чтобы прикрывать
  rationale: Инфинитив выражает цель. «Прикрывать» естественно сочетается с наготой и точно передаёт назначение одежды.
- source_word: בְּשַׂר עֶרְוָה
  choice: наготу тела
  rationale: Буквально «плоть наготы». Русская формулировка сохраняет телесную конкретность, не становясь ни неестественно буквальной, ни чрезмерно эвфемистической.
- source_word: מִמָּתְנַיִם
  choice: от талии
  rationale: מָתְנַיִם обозначает область чресл, поясницы или талии. В описании границ одежды «от талии» наиболее понятно современному русскому читателю.
- source_word: וְעַד יְרֵכַיִם
  choice: до бёдер
  rationale: יָרֵךְ обычно обозначает бедро; здесь указана нижняя граница одежды.
- source_word: יִהְיוּ
  choice: они должны доходить
  rationale: Буквально «они должны быть». В русском описании протяжённости одежды «должны доходить от… до…» естественно выражает подразумеваемое пространственное значение.
