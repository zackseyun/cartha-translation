  text: 'And you shall set in it settings of stones[a], four rows of stones: the first row shall be a ruby, a topaz, and an emerald.'
translation:
  language: ru
  text: И вставь в него оправленные камни[a], расположив их в четыре ряда. В первом ряду — рубин, топаз и изумруд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
