    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתָ
  choice: И вставь
  rationale: Глагол буквально означает «наполнить», но в контексте изготовления нагрудника речь идёт о помещении драгоценных камней в оправы; «вставь» естественно передаёт ремесленное действие.
- source_word: בּוֹ
  choice: в него
  rationale: Предлог ב с местоименным суффиксом указывает на помещение камней в нагрудник.
- source_word: מִלֻּאַת אֶבֶן
  choice: оправленные камни
  rationale: Сочетание относится к камням, закреплённым в ювелирных оправах. Такая формулировка по-русски яснее буквального «наполнение камня» и сохраняет технический контекст.
- source_word: אַרְבָּעָה טוּרִים אֶבֶן
  choice: камни в четыре ряда
  rationale: טוּר обозначает упорядоченный ряд; אֶבֶן имеет собирательное значение, поэтому по-русски уместно множественное число.
- source_word: טוּר ... הָאֶחָד
  choice: В первом ряду
  rationale: Фраза обозначает первый из четырёх последовательно перечисляемых рядов.
- source_word: אֹדֶם
  choice: рубин
  rationale: Точное определение минерала неизвестно. «Рубин» — традиционный и понятный эквивалент названия красного камня; возможный вариант вынесен в примечание.
- source_word: פִּטְדָה
  choice: топаз
  rationale: Точная идентификация камня спорна. «Топаз» соответствует устойчивой переводческой традиции, а альтернативы отмечены в примечании.
- source_word: בָרֶקֶת
  choice: изумруд
  rationale: Название связано с блеском или сверканием камня, но точный минерал не установлен. Традиционный вариант «изумруд» сопровождается примечанием.
