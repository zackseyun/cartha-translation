revisions:
- from: Она будет на лбу Аарона, и Аарон будет нести на себе вину, связанную со святынями[a], которые сыны Израиля посвящают Яхве, — со всеми их священными дарами[b]. Она должна всегда находиться у него на лбу, чтобы они были приняты[c] перед Яхве.
  to: Она будет на лбу Аарона, и Аарон будет нести вину, связанную со всеми священными дарами, которые посвящают сыны Израиля[a]. Она будет всегда у него на лбу, чтобы они обрели благоволение[b] перед Яхве.
  rationale: Убрано не выраженное прямо дополнение «Яхве» при «посвящают». Трудный оборот о «святынях» и «дарах» передан естественным русским пояснением, а его формальная и синтаксическая неоднозначность сохранена в сноске. «Обрели благоволение» точнее передаёт לְרָצוֹן, не исключая варианта «были приняты».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:02:05Z'
review_pass:
  verdict: revise
  source_fidelity: В целом переданы повторное указание на лоб Аарона, идиома о несении вины, постоянное ношение знака и цель принятия перед Яхве. Однако «посвящают Яхве» добавляет прямо не выраженное в стихе дополнение, а «со всеми их священными дарами» неудачно передаёт трудную связь לְכָל מַתְּנֹת קָדְשֵׁיהֶם и может звучать так, будто дары сопровождают действие, а не составляют объём священных приношений, с которыми связана вина.
  naturalness: Русский текст в основном плавный и соответствует современному литературному регистру. Формула «нести на себе вину, связанную со святынями» понятна, но сочетание «со святынями ... — со всеми их священными дарами» тяжеловесно и семантически размывает связь между «святынями» и дарами.
  terminology: «Аарон», «сыны Израиля», «лоб», «Яхве» и «благоволение/принятие» уместны. Для הַקֳּדָשִׁים в данном контексте предпочтительнее прямо назвать «священные дары», поскольку далее текст уточняет объём этих посвящённых приношений. Идиому נָשָׂא עָוֺן следует оставить без утверждения, что Аарон устраняет вину.
  issues:
