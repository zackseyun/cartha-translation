  text: וְ/הָיָה֮ עַל מֵ֣צַח אַהֲרֹן֒ וְ/נָשָׂ֨א אַהֲרֹ֜ן אֶת עֲוֺ֣ן הַ/קֳּדָשִׁ֗ים אֲשֶׁ֤ר יַקְדִּ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לְ/כָֽל מַתְּנֹ֖ת קָדְשֵׁי/הֶ֑ם וְ/הָיָ֤ה עַל מִצְח/וֹ֙ תָּמִ֔יד לְ/רָצ֥וֹן לָ/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/038.yaml
  text: It shall be on Aaron’s forehead[a], and Aaron shall bear the iniquity of the holy things that the sons of Israel consecrate, for all the gifts of their holy things. It shall always be on his forehead[c][b], for acceptance for them before Yahweh.
translation:
  language: ru
  text: Она будет на лбу Аарона, и Аарон будет нести вину, связанную со всеми священными дарами, которые посвящают сыны Израиля[a]. Она будет всегда у него на лбу, чтобы они обрели благоволение[b] перед Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нести вину святынь ... во всех дарах их святынь». Еврейский оборот может означать несение вины или ответственности за вину, связанную с посвящёнными дарами; синтаксическая связь заключительной фразы трудна.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы они были приняты». Местоимение относится прежде всего к сынам Израиля, хотя в контексте их принятие связано с их дарами.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵצַח / מִצְחוֹ
  choice: лоб / у него на лбу
  rationale: Еврейское слово обозначает лоб, переднюю часть головы. «Лоб» — точный и естественный современный русский эквивалент.
- source_word: נָשָׂא ... עֲוֺן
  choice: нести на себе вину, связанную со святынями
  rationale: Сочетание выражает несение вины или ответственности за вину. Уточнение «связанную со святынями» делает трудный еврейский оборот понятным, не утверждая, что сами святыни греховны, и не истолковывает механизм искупления.
- source_word: הַקֳּדָשִׁים
  choice: святыни
  rationale: В священническом контексте множественное число относится к посвящённым дарам и предметам. «Святыни» сохраняет культовую категорию и звучит естественно по-русски.
- source_word: יַקְדִּישׁוּ
  choice: посвящают Яхве
  rationale: Глагол означает отделять или посвящать как святое. Дополнение «Яхве» ясно передаёт подразумеваемого адресата посвящения в данном контексте.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранено формально мужское и заветное обозначение народа Израиля; выражение «сыны Израиля» понятно и укоренено в русском библейском стиле.
- source_word: לְכָל מַתְּנֹת קָדְשֵׁיהֶם
  choice: со всеми их священными дарами
  rationale: Предложная связь в еврейском тексте трудна. Этот вариант естественно связывает вину святынь со всем кругом посвящаемых даров, а сноска сохраняет более буквальную структуру.
- source_word: תָּמִיד
  choice: всегда
  rationale: Передаёт требование постоянного нахождения предмета на лбу Аарона простым современным словом.
- source_word: לְרָצוֹן לָהֶם
  choice: чтобы они были приняты
  rationale: Целевая конструкция передаёт принятие или благоволение к людям в связи с их дарами. Местоименная неоднозначность отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
theological_decisions:
- issue: Смысл несения Аароном «вины святынь»
  choice: Аарон несёт на себе вину или ответственность за вину, связанную с посвящёнными святынями.
  alternative: Аарон непосредственно устраняет грех святынь либо лишь символически напоминает о грехах Израиля.
  rationale: Перевод сохраняет юридико-священническое напряжение идиомы и не вводит в стих разработанную теорию искупления.
- issue: К кому относится выражение לְרָצוֹן לָהֶם
  choice: Принятие относится прежде всего к сынам Израиля в связи с их посвящёнными дарами.
  alternative: Речь идёт исключительно о принятии самих даров.
  rationale: Местоимение «им» естественно указывает на людей, но контекст тесно связывает их принятие с дарами; сноска сохраняет обе стороны этой неоднозначности.
translation_notes:
  register: Современный литературный русский с достоинством священнического контекста. Синтаксис упрощён настолько, чтобы стих был понятен при чтении вслух, но ключевые культовые и юридические понятия, а также неоднозначность принятия людей и их даров сохранены.
