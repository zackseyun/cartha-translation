    rationale: Глагол «посвящают» в еврейском тексте не имеет здесь явно выраженного дополнения. Контекст посвящения Богу очевиден, но в переводе стиха безопаснее не вносить это дополнение в основной текст.
  - severity: medium
    issue: Неточно и неясно передана фраза לְכָל מַתְּנֹת קָדְשֵׁיהֶם.
    rationale: 'Оборот «со всеми их священными дарами» плохо показывает, что речь идёт о совокупности священных даров Израиля; более естественно связать их с «святынями» как пояснение: «со всеми священными дарами, которые посвящают сыны Израиля».'
