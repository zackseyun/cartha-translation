    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  choice: конца
  rationale: Существительное обозначает концевые части цепочек; «конца» точно и естественно передаёт конструктивную деталь.
- source_word: הָעֲבֹתֹת
  choice: цепочек
  rationale: Слово может обозначать плетёные шнуры или цепи. В ближайшем контексте речь идёт о золотых плетёных изделиях, поэтому «цепочки» лучше передаёт материал и назначение; возможный образ шнуров сохранён в сноске.
- source_word: הַמִּשְׁבְּצֹת
  choice: оправам
  rationale: Здесь имеются в виду золотые крепёжные элементы или гнёзда. «Оправы» — понятный и достаточно точный русский технический термин без излишней конкретизации их формы.
- source_word: כִּתְפֹת
  choice: наплечниках
  rationale: В контексте изготовления одежды слово указывает не на плечи человека, а на плечевые части эфода; «наплечники» кратко и ясно называет эти детали.
- source_word: אֵפֹד
  choice: эфода
  rationale: Специальное название священнического облачения передано традиционной русской транслитерацией, поскольку точного общеупотребительного эквивалента нет.
- source_word: אֶל מוּל פָּנָיו
  choice: с его передней стороны
  rationale: Выражение указывает на переднюю, обращённую наружу сторону эфода. Такой перевод естественно передаёт пространственное указание.
- source_word: וְנָתַתָּה
  choice: помести их
  rationale: Повтор глагола נתן передан другим естественным русским глаголом; местоимение по контексту относится к оправам с прикреплёнными концами цепочек.
