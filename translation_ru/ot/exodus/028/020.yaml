lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: Четвёртый ряд
  rationale: טוּר в перечне камней означает ряд; начальное וְ естественно передаётся последовательностью перечисления без обязательного союза «и».
