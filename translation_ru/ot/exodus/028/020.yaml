  choice: хризолит
  rationale: Точная идентификация древнего камня неизвестна; «хризолит» — традиционный и узнаваемый русский эквивалент, при этом неопределённость отмечена в сноске.
- source_word: שֹׁהַם
  choice: оникс
  rationale: Традиционный русский эквивалент в описаниях скинии, хотя точный минерал остаётся спорным.
- source_word: יָשְׁפֵה
  choice: яшма
  rationale: Устоявшееся соответствие и естественное русское название камня.
- source_word: מְשֻׁבָּצִים זָהָב
  choice: вставлены в золотые оправы
  rationale: Передаёт пассивное значение причастия и ювелирный контекст; «золотые оправы» естественно выражает способ закрепления камней.
- source_word: יִהְיוּ בְּמִלּוּאֹתָם
  choice: должны быть ... в ... оправах
  rationale: Имперфект имеет предписывающую силу, а מִלּוּאִים здесь обозначает оправы или гнёзда для камней.
