base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/041.yaml
  text: You shall clothe Aaron your brother and his sons with him[a], and you shall anoint them and ordain them and consecrate them, and they shall serve as priests to me.
translation:
  language: ru
  text: Одень Аарона, брата твоего, и его сыновей вместе с ним в эти одежды; помажь их, введи их в священническое служение[a] и освяти их — и они будут служить Мне как священники.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наполни их руку» — древнееврейское выражение, означающее введение в священническое служение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ אֹתָם
  choice: Облеки в эти одежды
  rationale: Каузативная форма глагола לבשׁ означает «одеть, облечь»; добавление «в эти одежды» естественно связывает повеление с описанными выше священными одеждами, не внося нового содержания.
- source_word: אֶת אַהֲרֹן אָחִיךָ וְאֶת בָּנָיו אִתּוֹ
  choice: Аарона, брата твоего, и вместе с ним его сыновей
  rationale: Передаёт приложение и אִתּוֹ («с ним, вместе с ним») в ясном современном русском порядке слов.
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: помажь их
  rationale: משׁח — устойчивый ритуальный термин для помазания; русское «помажь» сохраняет его культовое и богословское значение.
- source_word: וּמִלֵּאתָ אֶת יָדָם
  choice: посвяти их на служение
  rationale: Буквально «наполни их руки» — древнееврейская идиома введения в священническое служение. Функциональный перевод понятен современному читателю, а буквальная форма сохранена в сноске.
- source_word: וְקִדַּשְׁתָּ אֹתָם
  choice: освяти их
  rationale: קדשׁ здесь обозначает отделение людей как святых для священного служения; «освяти» точно и традиционно передаёт этот отдельный от введения в должность акт.
- source_word: וְכִהֲנוּ לִי
  choice: чтобы они служили Мне священниками
  rationale: Глагол כהן означает исполнять священническое служение. В данном ряду повелений русская целевая конструкция естественно выражает предполагаемый результат, тогда как «Мне» сохраняет לִי.
theological_decisions:
- issue: Передача идиомы מִלֵּא אֶת־יָד
  choice: посвяти их на служение
  alternative: наполни их руки; введи их в священническое служение
  rationale: Идиома обозначает официальное поставление на священническое служение, а не буквальное наполнение рук. «Посвяти на служение» избегает непрозрачной буквальности и не привязывает текст к поздней конфессиональной терминологии; буквальный образ отмечен в сноске.
- issue: Соотношение מִלֵּא אֶת־יָד и קדשׁ
  choice: 'передать раздельно: «посвяти их на служение и освяти их»'
  alternative: объединить как одно действие посвящения
  rationale: Еврейский текст использует два разных глагольных выражения. Раздельный перевод сохраняет различие между введением в служение и освящением, не определяя подробнее их богословское соотношение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Формы «облеки», «освяти» и прописное «Мне» сохраняют достоинство сакральной речи; синтаксис остаётся понятным широкому читателю.
