  rationale: Сохранена контекстуально необходимая отсылка к описанным выше одеждам и все четыре различаемых в еврейском тексте действия. Заключительный глагол передан координированно, без добавления целевого союза. Уточнение «в священническое служение» делает смысл идиомы прозрачным и не смешивает её с последующим освящением; сноска исправлена в соответствии с грамматической формой еврейского выражения.
