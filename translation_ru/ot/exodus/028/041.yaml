    rationale: 'וְכִהֲנוּ לִי продолжает ряд форм с waw и описывает результат: «и будут/станут служить Мне как священники». Союз «чтобы» несколько изменяет синтаксическое соотношение, делая его прямой целью предыдущих действий.'
  - severity: low
    issue: Неточная буквальная форма в сноске
    rationale: 'В выражении אֶת־יָדָם слово «рука» стоит в единственном числе с суффиксом множественного числа: буквально «наполни их руку», а не «их руки».'
  - severity: low
    issue: Общее «посвяти их на служение»
    rationale: Фраза понятна, но не обозначает, что речь именно о поставлении в священническое служение; это важно для различения с קדשׁ («освяти»).
