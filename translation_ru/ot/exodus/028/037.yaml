  text: And you shall put it on a cord of blue[a], and it shall be on the turban[b]; it shall be at the front of the turban.
translation:
  language: ru
  text: Прикрепи её к синему шнуру[a], и пусть она будет на тюрбане; она должна быть на передней стороне тюрбана[b].
  philosophy: optimal-equivalence
  footnotes:
