    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ אֹתוֹ
  choice: Прикрепи её
  rationale: Глагол שׂים буквально означает «положить, поместить», однако в сочетании со шнуром здесь естественно передаёт действие закрепления пластины; женский род местоимения соответствует подразумеваемой пластине из предыдущего стиха.
- source_word: פְּתִיל
  choice: шнур
  rationale: Слово обозначает нить, бечёвку или шнур для крепления; «шнур» лучше всего соответствует функции предмета в данном контексте.
- source_word: תְּכֵלֶת
  choice: синий
  rationale: Термин обозначает дорогой синий краситель или окрашенный им материал; точный оттенок, возможно сине-пурпурный, остаётся неопределённым.
- source_word: הַמִּצְנָפֶת
  choice: тюрбан
  rationale: Имеется в виду обёрнутый головной убор первосвященника; «тюрбан» — точный и понятный современный эквивалент.
- source_word: אֶל מוּל פְּנֵי
  choice: на передней стороне
  rationale: Сочетание указывает на расположение напротив лицевой, передней части предмета; в контексте это естественно выражается как размещение на передней стороне тюрбана.
- source_word: יִהְיֶה
  choice: она должна быть
  rationale: Повтор сказуемого сохраняет подчёркнутое в еврейском тексте указание на требуемое местоположение.
