  text: а в третьем ряду — гиацинт[a], агат[b] и аметист.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точное определение названных здесь камней неизвестно; еврейское לֶשֶׁם традиционно также передавали как «лигурий».
