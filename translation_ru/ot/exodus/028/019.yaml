    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר
  choice: а в ... ряду
  rationale: טוּר в описании нагрудника обозначает ряд камней. Союз וְ передан как «а», естественно продолжающее перечисление по-русски.
- source_word: הַשְּׁלִישִׁי
  choice: третьем
  rationale: Порядковое числительное однозначно указывает на третий ряд; предложный падеж обусловлен естественной русской конструкцией.
- source_word: לֶשֶׁם
  choice: гиацинт[a]
  rationale: Точное соответствие древнего названия современному минералу неизвестно. «Гиацинт» — распространённое и понятное традиционное приближение; неопределённость отмечена в сноске.
- source_word: שְׁבוֹ
  choice: агат[b]
  rationale: «Агат» — традиционное и правдоподобное соответствие, однако точное определение камня остаётся спорным, поэтому возможный вариант дан в сноске.
- source_word: וְאַחְלָמָה
  choice: и аметист
  rationale: Название обычно и достаточно уверенно отождествляют с аметистом; союз וְ передан как «и».
