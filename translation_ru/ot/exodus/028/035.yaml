base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/035.yaml
  text: It shall be on Aaron when he ministers[a], and its sound shall be heard when he goes into the Holy Place before Yahweh and when he comes out[c][b], so that he may not die.
translation:
  language: ru
  text: Это одеяние должно быть на Аароне, когда он служит; звон его должен быть слышен, когда он входит в святилище перед Яхве и когда выходит, чтобы он не умер.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и он не умрёт»; возможен также смысл: «иначе он умрёт».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «в святое»; здесь имеется в виду священное пространство скинии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה עַל אַהֲרֹן
  choice: Оно должно быть на Аароне
  rationale: Предписывающее употребление перфекта с союзом передано естественной для русского закона конструкцией «должно быть». Местоимение сохраняет отсылку к описанному ранее облачению, не добавляя отсутствующего в стихе существительного.
- source_word: לְשָׁרֵת
  choice: когда он совершает служение
  rationale: Инфинитив с ל допускает целевое или обстоятельственное понимание; временная формулировка естественна в данном контексте священнического служения.
- source_word: וְנִשְׁמַע קוֹלוֹ
  choice: и звон его должен быть слышен
  rationale: Буквально говорится о «звуке его», но ближайший контекст описывает колокольчики на подоле облачения. «Звон» ясно передаёт конкретный слышимый звук, а местоимение сохраняет грамматическую отсылку.
- source_word: בְּבֹאוֹ ... וּבְצֵאתוֹ
  choice: когда он входит ... и когда выходит
  rationale: Параллельные инфинитивные конструкции имеют временное значение; русские глаголы движения естественно передают вход и выход.
- source_word: אֶל הַקֹּדֶשׁ
  choice: в святилище
  rationale: Субстантивированное «святое» обозначает священное пространство скинии. «Святилище» сохраняет широту выражения и не решает без необходимости, имеется ли в виду строго определённое отделение.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» кратко и торжественно передаёт нахождение перед лицом, то есть в присутствии Бога; личное имя יהוה транслитерировано как «Яхве».
- source_word: וְלֹא יָמוּת
  choice: чтобы ему не умереть
  rationale: В ритуально-правовом контексте присоединённое отрицательное предложение выражает предотвращаемый результат. Формулировка сохраняет связь соблюдения предписания с угрозой смерти.
theological_decisions:
- issue: К чему относится слышимый звук
  choice: К звону колокольчиков на облачении Аарона
  alternative: К звуку движения или присутствия самого Аарона в более общем смысле
  rationale: В непосредственно предшествующих стихах описаны золотые колокольчики на подоле; поэтому именно их звон является наиболее вероятным смыслом «звука его».
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: Транслитерация сохраняет личное имя в исходном тексте, не заменяя его титулом.
- issue: Связь заключительной фразы с предписанием
  choice: 'Цель или предотвращаемый результат: «чтобы ему не умереть»'
  alternative: 'Сочинительное следствие: «и он не умрёт»; предостережение: «иначе он умрёт»'
  rationale: Еврейское וְלֹא יָמוּת формально допускает более прямую сочинительную передачу, но в контексте предписания естественно выражает предотвращение смертельного исхода; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской окраской. «Пред Яхве» сохраняет достоинство регистра, а синтаксис остаётся понятным современному читателю. Необычное начальное «Оно» намеренно сохраняет контекстуальную отсылку исходного текста к ранее описанному облачению.
