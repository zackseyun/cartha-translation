  source_fidelity: 'Смысл передан в целом верно: речь об описанном ранее одеянии Аарона, слышимом звоне при входе в священное пространство и выходе из него и о предотвращении смерти. Однако «чтобы ему не умереть» неестественно для современного русского и ослабляет ясную субъектную связь заключительной фразы. Явное «это одеяние» безопасно уточняет контекстуальный референт и устраняет неудачное начальное «оно».'
