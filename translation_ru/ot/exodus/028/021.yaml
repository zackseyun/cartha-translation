  text: וְ֠/הָ/אֲבָנִים תִּֽהְיֶ֜יןָ עַל שְׁמֹ֧ת בְּנֵֽי יִשְׂרָאֵ֛ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חוֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ תִּֽהְיֶ֕יןָ לִ/שְׁנֵ֥י עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/021.yaml
  text: And the stones shall correspond to the names of the sons of Israel[a], twelve according to their names. They shall be engraved like a signet, each with his name[c][b], for the twelve tribes.
translation:
  language: ru
  text: 'И камни должны соответствовать именам сыновей Израиля[a][c]: двенадцать камней — по их именам. На каждом из них, как на печати[b], должно быть выгравировано имя одного из них; они будут для двенадцати колен.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «должны носить имена сыновей Израиля». Еврейское выражение буквально допускает передачу: «будут по именам сыновей Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «гравировкой печати»; речь идёт о гравировке, подобной надписи на печатке.'
    reason: lexical_alternative
  - marker: c
    text: «Сыновья Израиля» — буквальное еврейское выражение; в данном контексте речь идёт об именах двенадцати сыновей Иакова, связанных с двенадцатью коленами.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: И камни
  rationale: Союз וְ сохраняет связь с предшествующими наставлениями, а определённость существительного передаётся контекстуально.
- source_word: תִּהְיֶיןָ עַל שְׁמֹת
  choice: должны соответствовать именам
  rationale: Глагол буквально означает «будут», однако сочетание с עַל выражает здесь соотнесённость камней с именами; выбранная формулировка естественна по-русски и не превращает отношение в физическое расположение.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыновей Израиля
  rationale: Сохранено буквальное и устойчивое библейское выражение, указывающее здесь на родоначальников двенадцати колен.
- source_word: שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: двенадцать — по их именам
  rationale: Переданы число камней и их поимённое соответствие; тире делает эллиптическое еврейское построение ясным без добавления нового содержания.
- source_word: פִּתּוּחֵי חוֹתָם
  choice: должно быть вырезано… как на печати
  rationale: Конструктивное сочетание обозначает резьбу или гравировку, характерную для печати; русский оборот сохраняет образ и ясно описывает надпись.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: На каждом… имя одного из них
  rationale: 'אִישׁ употреблено распределительно: каждый камень получает отдельное имя. Формулировка устраняет возможную неясность русского местоимения, не меняя смысла.'
- source_word: תִּהְיֶיןָ לִשְׁנֵי עָשָׂר שָׁבֶט
  choice: они предназначены для двенадцати колен
  rationale: Предлог לְ выражает назначение или соотнесённость. Еврейское שָׁבֶט стоит в единственном числе после числительного, тогда как по-русски требуется родительный падеж множественного числа.
theological_decisions:
- issue: Заветное выражение בְּנֵי יִשְׂרָאֵל
  choice: сыновей Израиля
  alternative: потомков Израиля / израильтян
  rationale: Буквальное выражение сохранено как историко-заветное обозначение сыновей-прародителей колен; примечание поясняет, что в иных контекстах оно может иметь более широкий смысл.
- issue: Соотношение камней, имён и колен
  choice: Камни соответствуют двенадцати именам и предназначены для двенадцати колен
  alternative: Камни представляют двенадцать колен
  rationale: Основной текст не усиливает значение до прямого «представляют», поскольку еврейские предлоги עַל и לְ допускают более общую соотнесённость и назначение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для обычного читателя, при этом сохранены повтор имени, число камней и формальная связь с двенадцатью коленами.
