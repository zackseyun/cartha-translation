lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Сделай
  rationale: Форма с союзом продолжает последовательность предписаний и по-русски естественно передаётся повелительным наклонением.
- source_word: עַל הַחֹשֶׁן
  choice: на нагруднике
  rationale: 'Предлог עַל здесь имеет пространственное значение: кольца делаются и располагаются на нагруднике.'
- source_word: הַחֹשֶׁן
  choice: нагрудник
  rationale: В Исходе 28 слово обозначает особую часть облачения первосвященника; «нагрудник» — ясный и устоявшийся русский эквивалент без добавления отсутствующего здесь определения «судный».
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: два золотых кольца
  rationale: Естественная русская передача обозначения материала; буквально возможно «два кольца из золота», но смысловой разницы нет.
- source_word: וְנָתַתָּ
  choice: и прикрепи
  rationale: Буквально глагол означает «помести», однако в контексте колец на краях предмета «прикрепи» ясно передаёт требуемое физическое размещение.
- source_word: עַל שְׁנֵי קְצוֹת הַחֹשֶׁן
  choice: к двум краям нагрудника
  rationale: קָצֶה обозначает край или конец. В описании плоской детали одежды «края» звучит естественно; русский предлог «к» сочетается с выбранным глаголом «прикрепи».
