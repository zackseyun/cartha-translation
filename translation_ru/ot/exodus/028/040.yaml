base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/040.yaml
  text: For Aaron’s sons you shall make tunics[a], and you shall make sashes for them, and you shall make caps for them, for glory and for beauty.
translation:
  language: ru
  text: Для сыновей Аарона сделай хитоны, сделай им пояса и сделай им головные уборы[a] — для славы и красоты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шапки», «тюрбаны» или «головные повязки» — точная форма священнического головного убора неизвестна.'
    reason: Лексема מִגְבָּעוֹת обозначает головной убор священников, но не позволяет уверенно определить его форму.
lexical_decisions:
- source_word: לִבְנֵי אַהֲרֹן
  choice: для сыновей Аарона
  rationale: Передаёт прямое указание на сыновей Аарона, не расширяя его до всех потомков.
- source_word: תַּעֲשֶׂה / וְעָשִׂיתָ
  choice: сделай
  rationale: В контексте предписаний обе глагольные формы выражают повеление; русский императив естественно сохраняет директивную силу и торжественный тон.
- source_word: כֻתֳּנֹת
  choice: хитоны
  rationale: Термин обозначает основную нательную одежду наподобие длинной рубахи; «хитоны» точно и узнаваемо передаёт древний вид одежды, не создавая современного образа пальто.
- source_word: אַבְנֵטִים
  choice: пояса
  rationale: Речь идёт о тканых поясах, оборачиваемых вокруг талии; «пояса» — ясный и естественный русский эквивалент.
- source_word: מִגְבָּעוֹת
  choice: головные уборы
  rationale: Форма этого священнического головного убора точно не установлена. Обобщённый перевод не навязывает образ шапки, тюрбана или узкой повязки; возможные конкретизации сохранены в сноске.
- source_word: לְכָבוֹד
  choice: для славы
  rationale: «Слава» сохраняет возвышенный смысл כָּבוֹד и его связь с достоинством священнического облачения.
- source_word: וּלְתִפְאָרֶת
  choice: и красоты
  rationale: «Красота» ясно передаёт эстетический смысл תִּפְאֶרֶת и естественно сочетается со словом «слава».
theological_decisions:
- issue: Назначение священнических одежд
  choice: для славы и красоты
  alternative: для чести и великолепия
  rationale: Перевод сохраняет одновременно достоинство и эстетическую выразительность одежд, не добавляя отсутствующей в стихе символической интерпретации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, предписывающим тоном. Трёхкратное «сделай» сохраняет риторическое построение еврейского текста; тире ясно присоединяет заключительную фразу о назначении одежд.
