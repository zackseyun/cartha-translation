lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Сделай
  rationale: Перфект с союзом в последовательности предписаний передаёт повеление; форма «сделай» естественна для современных русских ремесленных указаний.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: два золотых кольца
  rationale: Прямо передаёт число, предмет и материал естественным современным русским выражением.
- source_word: וְשַׂמְתָּ אֹתָם
  choice: и прикрепи их
  rationale: שׂים буквально означает «положить, поместить, установить»; в контексте колец на ткани «прикрепи» естественно выражает требуемое размещение, не уточняя способ крепления.
- source_word: עַל שְׁנֵי קְצוֹת הַחֹשֶׁן
  choice: к двум концам нагрудника
  rationale: קצה обозначает конец или край; предлог «к» по-русски естественен при глаголе «прикрепи». חֹשֶׁן передано как «нагрудник» в контексте облачения первосвященника.
- source_word: עַל שְׂפָתוֹ
  choice: к тому его краю
  rationale: שׂפה здесь означает край или кайму; «край» ясно и без излишней конкретизации описывает часть изделия.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: который обращён внутрь, к эфоду
  rationale: עֵבֶר выражает направленность или сторону, а בָּיְתָה — движение либо обращённость внутрь. Формулировка сохраняет пространственную связь края с эфодом, не представляя спорное устройство деталей как однозначное.
