  text: You shall make two gold rings and put them on the two ends of the breastpiece[a], on its edge that is toward the inner side of the ephod.
translation:
  language: ru
  text: Сделай два золотых кольца и помести их на двух концах нагрудника, на его краю, обращённом к эфоду с внутренней стороны.[a]
  philosophy: optimal-equivalence
  footnotes:
