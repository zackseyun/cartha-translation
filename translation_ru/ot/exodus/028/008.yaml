    reason: cultural_note
lexical_decisions:
- source_word: חֵשֶׁב
  choice: искусно вытканный пояс
  rationale: В описании священнического облачения слово обозначает тканую деталь эфода, служащую поясом; перевод передаёт её назначение и искусную работу.
- source_word: אֲפֻדָּתוֹ
  choice: его эфода
  rationale: Сохраняет общепринятый термин «эфод» и притяжательный суффикс.
- source_word: אֲשֶׁר עָלָיו
  choice: находящийся на нём
  rationale: Ближайший антецедент — эфод; формулировка сохраняет пространственное значение оборота, не уточняя сверх текста способ крепления.
- source_word: כְּמַעֲשֵׂהוּ
  choice: одинаковой с ним работы
  rationale: Передаёт соответствие по способу и качеству изготовления, выраженное сравнительным כ.
- source_word: מִמֶּנּוּ יִהְיֶה
  choice: составлять с ним одно целое
  rationale: Буквально «из него будет»; в контексте пояс является не отдельной приставной деталью, а интегральной частью эфода.
- source_word: זָהָב
  choice: золото
  rationale: Прямое обозначение материала без внесения отсутствующего в тексте уточнения о золотых нитях.
- source_word: תְּכֵלֶת
  choice: голубая пряжа
  rationale: Традиционный цветовой термин с явным обозначением текстильного материала, подразумеваемого перечнем.
- source_word: אַרְגָּמָן
  choice: пурпурная пряжа
  rationale: Передаёт обычное значение дорогого пурпурного красителя и окрашенного им текстиля.
- source_word: תוֹלַעַת שָׁנִי
  choice: алая пряжа
  rationale: Обозначает текстиль, окрашенный стойким алым красителем; «алая» естественно звучит в современном русском перечне цветов.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: кручёный тонкий лён
  rationale: 'Сохраняет оба элемента выражения: тонкое льняное полотно или волокно и его скрученную структуру.'
