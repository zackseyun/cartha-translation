  yaml_path: translation/ot/exodus/028/008.yaml
  text: 'And the skillfully woven band of his ephod[a], which is on it, shall be like its workmanship, of one piece with it: gold, blue, and purple, and scarlet yarn[b], and fine twisted linen.'
translation:
  language: ru
  text: 'И искусно вытканный пояс его эфода, который на нём, должен быть такой же работы и составлять с ним одно целое[a]: из золота, голубой, пурпурной и алой пряжи[b] и тонкого кручёного льна.'
  philosophy: optimal-equivalence
  footnotes:
