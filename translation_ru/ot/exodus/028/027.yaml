  yaml_path: translation/ot/exodus/028/027.yaml
  text: You shall make two rings of gold and put them on the two shoulder-pieces of the ephod[a], underneath, on its front side, opposite its seam[b], above the skillfully woven band of the ephod.
translation:
  language: ru
  text: Сделай два золотых кольца и прикрепи их к двум наплечникам эфода снизу, на его лицевой стороне, напротив места его соединения[a], над искусно вытканным поясом эфода[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «напротив его соединения». Или: «соответственно месту его соединения»; еврейское слово может обозначать соединение, место скрепления или шов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «над тканым поясом эфода». Еврейское חֵשֶׁב обозначает специально изготовленную поясную или связующую часть эфода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעוֹת
  choice: петли
  rationale: В данном контексте это золотые кольца для крепления; русское «петли» естественно обозначает функциональную деталь одежды и не подразумевает украшение.
- source_word: כִתְפוֹת
  choice: наплечники
  rationale: Слово обозначает плечевые части эфода; «наплечники» точно и естественно передаёт элемент одежды.
- source_word: הָאֵפוֹד
  choice: эфод
  rationale: Сохраняется традиционный технический термин для священнического облачения, поскольку краткого полного русского эквивалента нет.
- source_word: מִלְּמַטָּה
  choice: снизу
  rationale: Передаёт положение колец в нижней части наплечников без излишней конкретизации конструкции.
- source_word: מִמּוּל פָּנָיו
  choice: с его лицевой стороны
  rationale: Естественно передаёт пространственную идиому, буквально связанную с «лицом» предмета.
- source_word: לְעֻמַּת מֶחְבַּרְתּוֹ
  choice: у места его соединения
  rationale: מֶחְבֶּרֶת обозначает место или узел соединения; нейтральная формулировка сохраняет более широкий смысл, не сводя его непременно к шву.
- source_word: מִמַּעַל
  choice: над
  rationale: Прямо передаёт положение выше следующего ориентира.
- source_word: לְחֵשֶׁב הָאֵפֹד
  choice: над искусно вытканным поясом эфода
  rationale: חֵשֶׁב здесь обозначает специально изготовленную поясную или связующую часть эфода; «искусно вытканный пояс» согласуется с описанием его изготовления в контексте.
