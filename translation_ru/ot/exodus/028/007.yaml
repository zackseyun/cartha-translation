lexical_decisions:
- source_word: שְׁתֵּי כְתֵפֹת
  choice: две наплечные части
  rationale: В контексте одежды כְתֵפֹת обозначает детали эфода, расположенные на плечах, а не сами плечи; «наплечные части» ясно передаёт это значение.
- source_word: חֹבְרֹת
  choice: соединяющие
  rationale: Причастие от חבר характеризует эти детали как служащие для соединения частей эфода; выбор сохраняет связь с повторением того же корня в конце стиха.
- source_word: יִהְיֶה לּוֹ
  choice: у него будут
  rationale: Еврейская конструкция существования с ל выражает обладание; местоимение относится к эфоду из предыдущего контекста.
- source_word: אֶל שְׁנֵי קְצוֹתָיו
  choice: прикреплённые к двум его краям
  rationale: קָצֶה означает край или конец; применительно к предмету одежды «края» звучит естественно. «Прикреплённые» раскрывает отношение, выраженное אֶל, в сочетании с חֹבְרֹת.
- source_word: וְחֻבָּר
  choice: и он будет соединён
  rationale: Формально передаёт пассивную форму от חבר и сочинительный союз, не превращая неоднозначную связь между частями фразы однозначно в цель или результат.
