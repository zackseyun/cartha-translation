review_pass:
  verdict: revise
  source_fidelity: В целом перевод точно передаёт предписывающий характер וְהָיוּ, культовый контекст, оба обстоятельства («при входе» / «при приближении к жертвеннику») и последствие, выраженное וְלֹא יִשְׂאוּ עָוֺן וָמֵתוּ. «Шатёр встречи», «жертвенник» и «святилище» приемлемы. В исправленном тексте повторено «на» в соответствии с וְעַל и уточнена русская передача идиомы נשׂא עון.
  naturalness: «Чтобы им не понести вины» менее естественно по-русски и несколько смещает идиому в сторону понесения наказания. «Чтобы они не несли вины и не умерли» литературно, ясно и сохраняет юридико-культовую образность оригинала. «В последующих поколениях» естественнее, чем буквальное «для его потомков после него», при сохранении אַחֲרָיו.
  terminology: Термины «шатёр встречи», «жертвенник», «служение» и «святилище» выдержаны последовательно и соответствуют регистру. «Установление навеки» допустимо для חֻקַּת עוֹלָם; вариант в сноске также уместен. В английском audit trail сноска a по содержанию относится к «bear guilt», хотя технически поставлена после «tent of meeting»; русская сноска a поставлена у надлежащей фразы и исправлять её привязку не требуется.
