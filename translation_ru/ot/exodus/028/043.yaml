base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/043.yaml
  text: And they shall be on Aaron and on his sons when they enter the tent of meeting[a], or when they approach the altar to minister in the holy place, so that they may not bear guilt and die[b]. It shall be a permanent statute for him and for his offspring after him.
translation:
  language: ru
  text: Пусть они будут на Аароне и на его сыновьях, когда они входят в шатёр встречи или подходят к жертвеннику для служения в святилище, чтобы они не несли вины и не умерли.[a] Это установление навеки[b] для него и для его потомков в последующих поколениях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы им не навлечь на себя вину и не умереть». Буквально: «не нести вины» — юридико-культовое выражение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вечное установление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ עַל
  choice: Пусть они будут на
  rationale: Сохраняет предписывающую силу формы и прямое значение предлога; местоимение относится к льняному нижнему одеянию из предыдущего стиха.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Передаёт оба элемента еврейского словосочетания и обозначает священный шатёр, где Бог встречается со Своим народом.
- source_word: בְגִשְׁתָּם אֶל הַמִּזְבֵּחַ
  choice: подходят к жертвеннику
  rationale: Глагол נגשׁ в священническом контексте означает приближение для культового служения; «подходят» естественно звучит по-русски.
- source_word: לְשָׁרֵת
  choice: для служения
  rationale: Передаёт целевое значение инфинитива и особый контекст священнического служения.
- source_word: בַּקֹּדֶשׁ
  choice: в святилище
  rationale: В данном культовом контексте קֹדֶשׁ обозначает священное пространство; «святилище» естественнее русского буквального «в святом» и не сужает значение до конкретного внутреннего помещения.
- source_word: וְלֹא יִשְׂאוּ עָוֹן וָמֵתוּ
  choice: чтобы им не понести вины и не умереть
  rationale: Сохраняет юридико-культовую идиому «нести вину» и предупредительную связь между виной и смертью.
- source_word: חֻקַּת עוֹלָם
  choice: установление навеки
  rationale: Передаёт обязательный и длительный характер предписания современным литературным русским языком.
- source_word: זַרְעוֹ
  choice: его потомков
  rationale: Передаёт собирательное значение единственного числа זֶרַע естественным русским выражением.
theological_decisions:
- issue: Характер последствия за нарушение священнического предписания
  choice: 'Сохранена прямая связь: священники могут понести вину и умереть.'
  alternative: 'Передать идиому динамически: «чтобы им не навлечь на себя вину и не умереть».'
  rationale: Еврейский текст говорит о реальной виновности и смертельном последствии нарушения святости; перевод не смягчает и не объясняет сверх текста эту богословскую напряжённость.
- issue: Длительность установления
  choice: «установление навеки»
  alternative: «вечное установление» или «неизменное установление».
  rationale: Формулировка сохраняет широкую временную силу עוֹלָם, не добавляя конфессионального толкования о пределах или способе действия постановления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной культовой лексикой. Синтаксис остаётся близким к еврейскому, но устранена возможная неясность русского местоименного соотнесения посредством «когда те входят». Термины «жертвенник», «служение» и «святилище» поддерживают достоинство и ясность текста без архаизации.
