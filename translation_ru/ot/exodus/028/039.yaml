  yaml_path: translation/ot/exodus/028/039.yaml
  text: You shall weave the tunic in checker work of fine linen[a], and you shall make a turban of fine linen, and you shall make a sash, the work of an embroiderer.
translation:
  language: ru
  text: Сотки рубаху из тонкого льна с узорчатым переплетением[a], сделай тюрбан из тонкого льна и сделай пояс — изделие искусного вышивальщика.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сотки рубаху из тонкого льна с клетчатым узором». Еврейский глагол, вероятно, означает изготовление ткани с вытканным узором.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּצְתָּ
  choice: сотки ... с узорчатым переплетением
  rationale: В контексте священнических одежд глагол обозначает изготовление узорчатой ткани. Такая передача сохраняет как способ изготовления, так и видимый узор, не сводя значение к вышивке.
- source_word: הַכְּתֹנֶת
  choice: рубаху
  rationale: כְּתֹנֶת — нательная одежда с рукавами, напоминающая длинную рубаху. «Рубаха» понятно современному читателю и отличает эту одежду от верхней ризы.
- source_word: שֵׁשׁ
  choice: тонкого льна
  rationale: В описаниях скинии и священнических одежд שֵׁשׁ обозначает качественную льняную ткань; «тонкий лён» естественно передаёт материал и его высокое качество.
- source_word: מִצְנֶפֶת
  choice: тюрбан
  rationale: Слово обозначает обёрнутый вокруг головы священнический головной убор; «тюрбан» — точное и понятное современное соответствие.
- source_word: אַבְנֵט
  choice: пояс
  rationale: Речь идёт о длинном декоративном предмете священнического облачения, которым опоясывались; «пояс» — естественное и нейтральное русское обозначение.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: вышитый искусным мастером
  rationale: Выражение указывает на искусно выполненную декоративную текстильную работу. Передача сохраняет ремесленный характер фразы и звучит естественно по-русски.
