base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/004.yaml
  text: 'And these are the garments that they shall make: a breastpiece[a], an ephod, a robe, a checkered tunic, a turban, and a sash. They shall make holy garments for Aaron your brother and for his sons[d][c][b], for him to serve as priest to me.'
translation:
  language: ru
  text: 'Вот какие одежды они должны изготовить: нагрудник[a], эфод[b], верхнее одеяние, узорчатую тунику[c], тюрбан и пояс. Пусть они изготовят священные одежды[d] для твоего брата Аарона и его сыновей, чтобы он служил Мне как священник.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наперсник». Еврейское слово обозначает особый предмет священнического облачения, носимый на груди, а не воинский доспех.'
    reason: lexical_alternative
  - marker: b
    text: Эфод — особый предмет священнической одежды; точного русского соответствия этому еврейскому слову нет.
    reason: cultural_note
  - marker: c
    text: Еврейское выражение может означать тунику особой тканой, ячеистой или клетчатой работы; точный вид узора неясен.
    reason: lexical_ambiguity
  - marker: d
    text: 'Буквально: «святые одежды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגָדִים
  choice: одежды
  rationale: Обычное и точное обозначение предметов облачения; слово «облачения» звучало бы более церковно и могло бы привнести позднейшие ассоциации.
- source_word: יַעֲשׂוּ
  choice: должны изготовить / пусть изготовят
  rationale: Имперфект в контексте повелений выражает предписание. Эти формулировки естественно передают его распорядительную силу по-русски.
- source_word: חֹשֶׁן
  choice: нагрудник
  rationale: Предмет носили на груди, но он не был доспехом; «нагрудник» точнее нейтрального характера вещи, чем «нагрудная броня» или воинский «панцирь».
- source_word: אֵפוֹד
  choice: эфод
  rationale: У особого священнического предмета одежды нет точного русского эквивалента, поэтому сохранён транслитерированный технический термин.
- source_word: מְעִיל
  choice: верхнее одеяние
  rationale: Передаёт носимую поверх туники одежду без поздней церковной окраски слова «риза» и без излишне конкретного образа мантии.
- source_word: כְתֹנֶת תַּשְׁבֵּץ
  choice: узорчатая туника
  rationale: כְתֹנֶת обозначает тунику, а תַּשְׁבֵּץ — особую тканую или ячеисто-узорчатую работу; основной текст сохраняет смысл, не утверждая спорный точный вид узора.
- source_word: מִצְנֶפֶת
  choice: тюрбан
  rationale: Конкретно обозначает обёрнутый головной убор и точнее общего выражения «головной убор».
- source_word: אַבְנֵט
  choice: пояс
  rationale: Естественный русский эквивалент тканого пояса в составе священнической одежды.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: священные одежды
  rationale: Передаёт культовую принадлежность одежды и естественно звучит по-русски; возможный более буквальный вариант отмечен в сноске.
- source_word: לְאַהֲרֹן אָחִיךָ וּלְבָנָיו
  choice: для твоего брата Аарона и его сыновей
  rationale: Сохраняет обращение к Моисею, родственную связь и конкретное указание на сыновей Аарона.
- source_word: לְכַהֲנוֹ לִי
  choice: чтобы он служил Мне священником
  rationale: Передаёт цель и сохраняет единственное число местоименного суффикса, относящего служение прежде всего к Аарону.
theological_decisions:
- issue: Терминология священнической одежды без привнесения поздней церковной традиции
  choice: Употребить понятные современные названия «нагрудник», «верхнее одеяние», «туника», «тюрбан», «пояс», сохранив техническое слово «эфод».
  alternative: Использовать традиционные слова «наперсник», «риза», «хитон», «кидар» и «препоясание».
  rationale: Выбранные слова передают древнеизраильские реалии современным литературным русским языком, а транслитерация оставлена только там, где точного эквивалента нет.
- issue: Святость священнических одежд
  choice: священные одежды
  alternative: святые одежды
  rationale: Оба варианта возможны для בִגְדֵי קֹדֶשׁ. «Священные» ясно указывает на посвящённость для богослужебного употребления, а сноска сохраняет более буквальную альтернативу.
- issue: Единственное число в לְכַהֲנוֹ после упоминания Аарона и его сыновей
  choice: чтобы он служил Мне священником
  alternative: чтобы они служили Мне священниками
  rationale: Еврейский текст использует суффикс мужского рода единственного числа; перевод сохраняет эту грамматическую напряжённость и не исправляет её по смыслу во множественное число.
- issue: Указание на сыновей Аарона
  choice: его сыновей
  alternative: его детей / его потомков
  rationale: בָּנָיו в данном контексте прямо обозначает сыновей, участвующих в священническом служении; нейтрализация рода была бы менее точной.
translation_notes:
  register: Современный литературный русский язык с достоинством, но без архаизмов и поздней церковно-обрядовой терминологии. Перечень сохраняет формальный ритм исходного текста; технический термин «эфод» пояснён в сноске. Местоимение «Мне» написано с прописной буквы по принятой русской библейской издательской норме.
