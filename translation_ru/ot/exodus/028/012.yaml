source:
  edition: WLC
  text: וְ/שַׂמְתָּ֞ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֗ים עַ֚ל כִּתְפֹ֣ת הָֽ/אֵפֹ֔ד אַבְנֵ֥י זִכָּרֹ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נָשָׂא֩ אַהֲרֹ֨ן אֶת שְׁמוֹתָ֜/ם לִ/פְנֵ֧י יְהוָ֛ה עַל שְׁתֵּ֥י כְתֵפָ֖י/ו לְ/זִכָּרֹֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/012.yaml
  text: And you shall set the two stones on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], and Aaron shall bear their names before Yahweh on his two shoulders for remembrance.
translation:
  language: ru
  text: Положи два камня на наплечники эфода как камни напоминания[b] для сынов Израиля[a]. Аарон будет носить их имена перед Яхве на обоих своих плечах — в напоминание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов Израиля». Это семейно-заветное выражение здесь относится к народу Израиля в целом.'
    reason: cultural_note
  - marker: b
    text: 'Или: «памятные камни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Положи
  rationale: В контексте последовательных предписаний форма передаёт повеление. «Положи» естественно описывает закрепление камней на священническом облачении.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: два этих камня
  rationale: Указательное «этих» естественно отсылает к двум уже названным в предыдущем контексте камням, не добавляя их породу, которой в самом стихе нет.
- source_word: כִּתְפֹת הָאֵפֹד
  choice: наплечники эфода
  rationale: В контексте одежды כָּתֵף обозначает плечевые части эфода; «наплечники» точно и кратко передаёт конструкцию облачения.
- source_word: אַבְנֵי זִכָּרֹן
  choice: памятные камни
  rationale: Передаёт значение камней, служащих напоминанием, и сохраняет связь с повторным זִכָּרֹן в конце стиха. Слово «памятные» здесь не должно пониматься исключительно как память об умерших.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: для сынов Израиля
  rationale: Сохраняет родственный, заветный образ исходного выражения, которое в данном контексте обозначает народ Израиля в целом.
- source_word: וְנָשָׂא ... אֶת שְׁמוֹתָם
  choice: Аарон будет носить их имена
  rationale: «Носить» естественно передаёт физическое и представительское несение имён на священническом облачении, не усиливая богословский смысл сверх текста.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: «Перед» передаёт присутствие Бога, а «Яхве» воспроизводит личное имя יהוה, стоящее в еврейском тексте.
- source_word: עַל שְׁתֵּי כְתֵפָיו
  choice: на двух своих плечах
  rationale: Сохраняет конкретное упоминание двух плеч Аарона и отличает их от наплечников эфода в первой части стиха.
- source_word: לְזִכָּרֹן
  choice: в напоминание
  rationale: 'Сохраняет намеренную неопределённость: текст прямо не уточняет, кому именно служит напоминание, и поддерживает лексическую связь с «памятными камнями».'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное имя; «Яхве» сохраняет это различие, не заменяя имя титулом.
- issue: Значение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: народ Израиля; израильтяне
  rationale: Сохранён семейно-заветный образ еврейского выражения; сноска поясняет, что в данном месте оно относится к народу в целом, а не только к мужчинам.
- issue: Кому предназначено напоминание
  choice: оставлено неопределённым
  alternative: напоминание Богу; напоминание Израилю
  rationale: Форма לְזִכָּרֹן не называет субъекта воспоминания, поэтому перевод не разрешает эту богословски значимую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Сохранены конкретные образы плеч, имён и напоминания; термин «эфод» оставлен как традиционное название священнического облачения.
