  text: וְ/עָשׂ֖וּ אֶת הָ/אֵפֹ֑ד זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן תּוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר מַעֲשֵׂ֥ה חֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/006.yaml
  text: And they shall make the ephod of gold[a], blue, and purple, scarlet yarn, and fine twisted linen[b], the work of a skillful designer.
translation:
  language: ru
  text: Пусть они сделают эфод из золота[a], голубой, пурпурной и алой пряжи и тонкого кручёного льна — искусной узорной работы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из золотых нитей». В еврейском тексте сказано просто «из золота», но в контексте изготовления ткани, вероятно, имеется в виду золото, превращённое в нити и вплетённое в материал.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «работы искусного мастера». Еврейское выражение обозначает искусную художественную работу, выполненную по продуманному узору.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Пусть они сделают
  rationale: Форма глагола в последовательности предписаний выражает распоряжение; эта конструкция естественно передаёт его по-русски.
- source_word: הָאֵפֹד
  choice: эфод
  rationale: Техническое название священнического облачения, не имеющее точного русского эквивалента; транслитерация сохраняет особенности предмета без излишнего уточнения его формы.
- source_word: זָהָב
  choice: золото
  rationale: В еврейском тексте буквально названо золото; хотя в данном контексте, вероятно, подразумеваются золотые нити, слово «нити» здесь прямо не выражено.
- source_word: תְּכֵלֶת וְאַרְגָּמָן תּוֹלַעַת שָׁנִי
  choice: голубая, пурпурная и алая пряжа
  rationale: Названия красителей или цветов в перечне материалов обозначают окрашенную пряжу; единое существительное делает русский текст ясным и не меняет состава перечня.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: тонкий кручёный лён
  rationale: שֵׁשׁ обозначает тонкое льняное полотно или материал, а מָשְׁזָר — его скрученное качество; сочетание передано кратко и предметно.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: искусная узорная работа
  rationale: Выражение указывает на умелое художественное изготовление по продуманному узору; перевод не сужает значение до одной конкретной техники, например вышивки.
