  text: וְ/אַתָּ֗ה תְּדַבֵּר֙ אֶל כָּל חַכְמֵי לֵ֔ב אֲשֶׁ֥ר מִלֵּאתִ֖י/ו ר֣וּחַ חָכְמָ֑ה וְ/עָשׂ֞וּ אֶת בִּגְדֵ֧י אַהֲרֹ֛ן לְ/קַדְּשׁ֖/וֹ לְ/כַהֲנ/וֹ לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/003.yaml
  text: And you shall speak to all the wise of heart[a], whom I have filled with a spirit of wisdom, and they shall make Aaron’s garments to consecrate him[c][b], for him to serve me as priest.
translation:
  language: ru
  text: Ты же скажи всем, кто мудр сердцем[a], кого Я исполнил духом мудрости[b], и пусть они изготовят одежды Аарона, чтобы освятить его, дабы он служил Мне священником[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мудрые сердцем»; это еврейское выражение обозначает людей, наделённых разумением и искусностью.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «Духом мудрости». Еврейское выражение может обозначать дарованный Богом дух или внутреннее расположение к мудрости и мастерству; текст не уточняет это однозначно.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «чтобы освятить его для служения Мне в качестве священника».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: תְּדַבֵּר
  choice: скажи
  rationale: Пиэль имперфекта в контексте повеления передан естественной русской формой распоряжения; начальное «Ты же» сохраняет эмфатическое וְאַתָּה.
- source_word: חַכְמֵי לֵב
  choice: мудрым сердцем
  rationale: Сохранена еврейская метафора сердца как средоточия разумения и умения; примечание разъясняет практический оттенок выражения.
- source_word: אֲשֶׁר מִלֵּאתִיו רוּחַ חָכְמָה
  choice: каждого из которых Я исполнил духом мудрости
  rationale: Форма единственного числа в местоименном суффиксе передана распределительно — «каждого»; образ наполнения и отсутствие артикля при רוּחַ сохранены без излишней богословской конкретизации.
- source_word: וְעָשׂוּ אֶת בִּגְדֵי אַהֲרֹן
  choice: чтобы они изготовили для Аарона одежды
  rationale: В данном ремесленном контексте «изготовили» звучит естественнее общего «сделали»; принадлежность одежды Аарону передана оборотом «для Аарона».
- source_word: לְקַדְּשׁוֹ
  choice: дабы посвятить его
  rationale: В священническом контексте קדשׁ обозначает отделение и посвящение для священного служения; «посвятить» точно и понятно передаёт этот смысл.
- source_word: לְכַהֲנוֹ לִי
  choice: на служение Мне как священника
  rationale: Глагольное значение כהן — служить в качестве священника — сохранено, а לִי явно передано как направленность служения Богу.
theological_decisions:
- issue: Следует ли понимать רוּחַ חָכְמָה как прямое наименование Святого Духа
  choice: духом мудрости
  alternative: Духом мудрости
  rationale: Существительное רוּחַ не имеет артикля, а контекст говорит о дарованной Богом мудрости и искусности. Строчная буква сохраняет подлинную неоднозначность и не исключает божественного источника дара.
- issue: Соотношение посвящения Аарона и его священнического служения
  choice: посвятить его на служение Мне как священника
  alternative: посвятить его, чтобы он служил Мне священником
  rationale: Два последовательных инфинитива цели тесно связывают посвящение со священническим служением; основной текст передаёт эту связь компактно, а примечание сохраняет более расчленённый синтаксический вариант.
translation_notes:
  register: Современный литературный русский язык с достоинством, подобающим Божьему распоряжению. Сохранены эмфатическое «Ты же», образ сердца и образ исполнения духом; ремесленное действие передано ясным глаголом «изготовили». Прописная буква в «Я/Мне» отражает речь Бога, не вводя дополнительной конфессиональной терминологии.
