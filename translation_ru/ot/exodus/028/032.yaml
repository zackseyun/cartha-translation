  text: וְ/הָיָ֥ה פִֽי רֹאשׁ֖/וֹ בְּ/תוֹכ֑/וֹ שָׂפָ֡ה יִֽהְיֶה֩ לְ/פִ֨י/ו סָבִ֜יב מַעֲשֵׂ֣ה אֹרֵ֗ג כְּ/פִ֥י תַחְרָ֛א יִֽהְיֶה לּ֖/וֹ לֹ֥א יִקָּרֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/032.yaml
  text: Its opening for the head shall be in the middle of it; around its opening there shall be a woven edge[a], like the opening of a coat of mail, so that it may not be torn.
translation:
  language: ru
  text: Отверстие для головы должно быть посередине одеяния; вокруг отверстия должна быть тканая кайма, как у отверстия панциря[a], чтобы оно не разрывалось.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как у отверстия доспеха» или «как у отверстия кольчуги». Еврейское слово תַּחְרָא встречается редко; сравнение, по-видимому, указывает на укреплённое отверстие, устойчивое к разрыву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי רֹאשׁוֹ
  choice: отверстие для головы
  rationale: פֶּה буквально означает «рот», но применительно к одежде обозначает отверстие; сочетание с רֹאשׁ ясно указывает на отверстие для головы.
- source_word: בְּתוֹכוֹ
  choice: посередине одеяния
  rationale: Форма указывает на расположение внутри, в средней части предмета. Явное «одеяния» естественно уточняет местоименную отсылку в русском языке.
- source_word: שָׂפָה ... מַעֲשֵׂה אֹרֵג
  choice: тканая кайма
  rationale: שָׂפָה здесь означает край или обрамление отверстия, а מַעֲשֵׂה אֹרֵג описывает его как выполненное ткацкой работой. «Тканая кайма» передаёт и предмет, и способ изготовления.
- source_word: לְפִיו סָבִיב
  choice: вокруг отверстия
  rationale: Повторное פֶּה обозначает отверстие одежды, а סָבִיב — его полное окружение.
- source_word: כְּפִי תַחְרָא
  choice: как у отверстия панциря
  rationale: תַחְרָא — редкое слово, вероятно обозначающее защитный доспех или панцирь. Сравнение касается укреплённого отверстия; лексическая неопределённость отмечена в сноске.
- source_word: לֹא יִקָּרֵעַ
  choice: чтобы оно не разрывалось
  rationale: Нифаль допускает пассивно-результативный смысл. В контексте конструкция естественно выражает цель укрепления отверстия — предотвращение разрыва.
