  text: the altar of burnt offering[a], and the bronze grating that belongs to it, its poles, and all its utensils[b], the basin and its stand—
translation:
  language: ru
  text: жертвенник всесожжения, принадлежавшую ему бронзовую решётку, шесты и всю его утварь, умывальник и его подставку —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: жертвенник всесожжения
  rationale: Устоявшееся и понятное обозначение жертвенника, предназначенного для жертв, сжигаемых целиком; конструкция исходного текста передана естественно для современного русского языка.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: бронзовая решётка
  rationale: מִכְבָּר обозначает решётчатое приспособление при жертвеннике; «решётка» ясно передаёт устройство предмета, не уточняя сверх исходного текста его точную форму.
- source_word: אֲשֶׁר לוֹ
  choice: принадлежавшую ему
  rationale: Оборот выражает принадлежность или связь с жертвенником, но сам по себе не уточняет пространственного положения решётки.
- source_word: בַּדָּיו
  choice: шесты
  rationale: Речь о шестах для переноски священных предметов; краткое «шесты» естественно в данном перечне, а назначение ясно из контекста скинии.
- source_word: כָּל כֵּלָיו
  choice: всю его утварь
  rationale: כֵּלִים — собирательное обозначение принадлежностей и орудий жертвенника; «утварь» уместно в культовом контексте и остаётся понятным современному читателю.
- source_word: הַכִּיֹּר
  choice: умывальник
  rationale: Термин обозначает сосуд для ритуального омовения во дворе скинии; «умывальник» точно передаёт его функцию и сохраняет библейский регистр.
- source_word: כַּנּוֹ
  choice: его подставку
  rationale: כֵּן обозначает основание или опору сосуда; «подставка» конкретно и естественно передаёт поддерживающую конструкцию.
