- source_word: אַבְנֵי שֹׁהַם
  choice: камни оникса
  rationale: Традиционная и узнаваемая передача названия драгоценного камня שֹׁהַם; поскольку точная минералогическая идентификация неясна, неопределённость отмечена в сноске.
- source_word: אַבְנֵי מִלֻּאִים
  choice: камни для вставки
  rationale: Слово מִלֻּאִים в данном контексте обозначает камни, предназначенные для закрепления в оправе; функциональная передача естественна для современного русского языка.
- source_word: לָאֵפֹד
  choice: в эфод
  rationale: Технический культовый термин אֵפֹד сохраняется как устоявшееся заимствование; предлог «в» естественно сочетается с камнями, вставляемыми в предмет облачения.
- source_word: וְלַחֹשֶׁן
  choice: и нагрудник
  rationale: «Нагрудник» ясно обозначает священнический предмет облачения и, в отличие от «нагрудной брони», не вызывает военных ассоциаций.
