- source_word: חַכְמַת לֵב
  choice: мудрая сердцем
  rationale: Сохраняет древнееврейский образ, связывающий внутреннюю мудрость с практическим мастерством; значение поясняется в сноске.
- source_word: בְּיָדֶיהָ
  choice: своими руками
  rationale: Естественно передаёт инструментальное значение предлога ב и подчёркивает ручную работу.
- source_word: טָוּוּ
  choice: пряла
  rationale: Глагол обозначает прядение волокна в нить или пряжу; форма единственного числа согласована с распределительным «каждая женщина».
- source_word: וַיָּבִיאוּ
  choice: и они принесли
  rationale: Сохраняет переход исходного текста от распределительного единственного числа к собирательному множественному.
- source_word: מַטְוֶה
  choice: то, что напряли
  rationale: Ясно и естественно передаёт существительное со значением спрядённого материала и вводит последующий перечень.
- source_word: תְּכֵלֶת
  choice: голубую пряжу
  rationale: В контексте скинии обозначает ценный окрашенный текстильный материал; слово «пряжа» делает предмет перечня понятным.
- source_word: אַרְגָּמָן
  choice: пурпурную пряжу
  rationale: Стандартно передаёт пурпурный окрашенный материал, использовавшийся для священных тканей.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: алую пряжу
  rationale: Передаёт устойчивое обозначение материала, окрашенного в алый цвет, без неясного буквального упоминания червя-красителя.
- source_word: שֵׁשׁ
  choice: тонкий лён
  rationale: В описаниях скинии слово обычно обозначает высококачественный тонкий льняной материал.
