lexical_decisions:
- source_word: שֶׁמֶן
  choice: масло
  rationale: Существительное обозначает масло, в данном контексте обычно оливковое; родовое «масло» не добавляет отсутствующей в еврейском тексте конкретизации.
- source_word: לַמָּאוֹר
  choice: для освещения
  rationale: מָאוֹר может обозначать свет или источник света; здесь речь о назначении масла. «Для освещения» естественно передаёт смысл, не подставляя прямо не названный светильник.
- source_word: בְשָׂמִים
  choice: благовония
  rationale: Множественное число обозначает ароматические вещества для священных составов. «Благовония» понятно современному читателю и уместно в культовом контексте.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: масло помазания
  rationale: Устойчивое и ясное русское обозначение ритуального масла; сохраняет конструкцию и значение еврейского словосочетания.
- source_word: קְטֹרֶת
  choice: курение
  rationale: В контексте скинии слово обозначает сжигаемое ароматическое вещество. «Курение» сохраняет культовое значение и сочетается с определением «ароматное».
- source_word: הַסַּמִּים
  choice: ароматного
  rationale: Буквально выражение קְטֹרֶת הַסַּמִּים означает «курение из благовоний/ароматических веществ». Прилагательное «ароматного» естественно передаёт качество состава без тяжеловесной конструкции.
