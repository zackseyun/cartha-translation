lexical_decisions:
- source_word: וְכָל הַנָּשִׁים
  choice: И все женщины
  rationale: 'Сочетание כָּל с существительным во множественном числе естественно передаётся собирательно: «все женщины».'
- source_word: אֲשֶׁר נָשָׂא לִבָּן אֹתָנָה
  choice: которых побуждало сердце
  rationale: Еврейский оборот буквально говорит о сердце, которое «поднимало» их; в данном контексте это означает внутреннее побуждение и готовность действовать. Формулировка сохраняет образ сердца и звучит естественно по-русски.
- source_word: בְּחָכְמָה
  choice: которые обладали мастерством
  rationale: В контексте изготовления святилища חָכְמָה обозначает не отвлечённую мудрость, а практическое умение, искусность в ремесле. Отдельная относительная конструкция устраняет неестественное русское сочетание «побуждало с мастерством».
- source_word: טָווּ
  choice: пряли
  rationale: Глагол обозначает прядение волокна; обычный русский ремесленный термин точно передаёт действие.
- source_word: אֶת הָעִזִּים
  choice: козью шерсть
  rationale: 'Буквально сказано «коз», но в контексте прядения это эллипсис: подразумевается козья шерсть. Явное называние материала предотвращает ошибочное понимание.'
