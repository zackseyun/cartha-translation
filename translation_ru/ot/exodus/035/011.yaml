lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: скинию
  rationale: В контексте святилища מִשְׁכָּן обозначает священное жилище Бога среди Израиля; «скиния» — устоявшийся русский библейский термин, сохраняющий отличие от אָהֶל, «шатра».
- source_word: אָהֳלוֹ
  choice: её шатёр
  rationale: אָהֶל означает «шатёр»; суффикс относится к скинии как комплексу. Форма «её» естественно передаёт грамматическую связь в русском языке.
- source_word: מִכְסֵהוּ
  choice: её покрытие
  rationale: מִכְסֶה означает защитное покрытие; перевод не уточняет материал или положение слоя сверх сказанного в еврейском тексте.
- source_word: קְרָסָיו
  choice: её застёжки
  rationale: קֶרֶס обозначает соединительные детали покрывал. «Застёжки» ясно передаёт их функцию, не навязывая слишком узкой современной технической формы.
- source_word: קְרָשָׁיו
  choice: её брусья
  rationale: קֶרֶשׁ обозначает деревянные конструктивные элементы скинии. «Брусья» естественно для современного русского описания сооружения и не утверждает с полной определённостью, были ли они сплошными досками или рамами.
- source_word: בְּרִיחָיו
  choice: её перекладины
  rationale: בְּרִיחַ — горизонтальные элементы, скреплявшие брусья; «перекладины» точнее передаёт строительную функцию, чем многозначное «засовы».
- source_word: עַמֻּדָיו
  choice: её столбы
  rationale: עַמּוּד означает вертикальную опору. «Столбы» уместны для переносной конструкции и понятны современному читателю.
- source_word: אֲדָנָיו
  choice: её основания
  rationale: אֶדֶן обозначает опорные гнёзда или подножия, в которые устанавливались конструктивные элементы. «Основания» — ясный общий термин; более конкретное «гнёзда» отмечено в примечании.
