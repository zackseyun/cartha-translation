lexical_decisions:
- source_word: מְנֹרַת הַמָּאוֹר
  choice: светильник для освещения
  rationale: מְנוֹרָה обозначает храмовый светильник на подставке, а הַמָּאוֹר — свет или освещение. Перевод естественно передаёт целевое отношение и сохраняет связь с повторным выражением «масло для освещения».
- source_word: כֵּלֶיהָ
  choice: его принадлежности
  rationale: כְּלִי — широкое обозначение предметов, сосудов или орудий. «Принадлежности» не сужает значение и естественно звучит применительно к светильнику.
- source_word: נֵרֹתֶיהָ
  choice: его лампады
  rationale: נֵר здесь обозначает отдельные масляные лампы, установленные на светильнике. «Лампады» точнее передаёт древний культовый предмет, чем современное широкое «лампы».
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: масло для освещения
  rationale: Буквально сочетание означает «масло света/освещения». Целевой оборот естественен по-русски и сохраняет повтор הַמָּאוֹר.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֵת
  choice: и ... и ... и ... и
  rationale: Повтор союза сохраняет структуру перечня и ритм еврейского текста; непереводимый показатель прямого дополнения отдельно не отражается.
