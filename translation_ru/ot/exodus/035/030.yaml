source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל רְא֛וּ קָרָ֥א יְהוָ֖ה בְּ/שֵׁ֑ם בְּצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֥ה יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/030.yaml
  text: Then Moses said to the sons of Israel[a], “See, Yahweh has called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.”
translation:
  language: ru
  text: 'И сказал Моисей сынам Израиля[a]: «Смотрите: Яхве призвал по имени Веселеила, сына Урия, сына Хура, из колена Иуды».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам»; буквально: «сынам Израиля».'
    reason: 'Лексическая альтернатива: выражение имеет корпоративное значение, но буквально содержит слово «сыновья».'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с последовательным значением продвигает повествование; обычная русская библейская повествовательная формула естественно передаёт связь с предшествующим контекстом.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет выраженную в еврейском тексте родственную формулу и мужской множественный род; более идиоматичное «израильтянам» дано в примечании.
- source_word: רְאוּ
  choice: Смотрите
  rationale: Форма множественного числа соответствует обращению ко всему собранию и естественно привлекает внимание к последующему сообщению.
- source_word: קָרָא ... בְּשֵׁם
  choice: призвал по имени
  rationale: Сохраняет еврейскую идиому личного и целенаправленного избрания; «назвал» могло бы ошибочно означать лишь наречение именем.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בְּצַלְאֵל
  choice: Веселеил
  rationale: Использована укоренившаяся русская библейская форма имени, узнаваемая современным читателем.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: сына Урия, сына Хура
  rationale: Повторение слова «сын» сохраняет структуру еврейского родословного обозначения и ясно указывает происхождение Веселеила.
- source_word: לְמַטֵּה יְהוּדָה
  choice: из колена Иуды
  rationale: Естественно и точно обозначает принадлежность Веселеила к колену Иуды.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Корпоративное выражение בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам
  rationale: Основной текст сохраняет буквальный родственный образ и грамматически мужскую форму, не отрицая корпоративного значения выражения; идиоматический вариант указан в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; архаизм «сынам» сохранён точечно ради исходной родственной формулы, а не как общий стилистический принцип.
