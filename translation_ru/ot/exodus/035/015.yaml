base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/015.yaml
  text: the altar of incense and its poles[a], and the anointing oil, and the fragrant incense, and the screen for the entrance to the tabernacle[c][b];
translation:
  language: ru
  text: жертвенник для благовоний и шесты для него, масло для помазания, благовонное курение[a] и завесу у входа в скинию;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «курение из благовоний»; возможный перевод: «ароматическое курение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: жертвенник для благовоний
  rationale: Конструктивное сочетание обозначает жертвенник, предназначенный для курения благовоний. Такой перевод естественен по-русски и сохраняет культовую функцию предмета.
- source_word: בַּדָּיו
  choice: шесты для него
  rationale: В описаниях скинии это шесты, служащие для переноски священной утвари. Формулировка ясна и не требует добавлять отсутствующее в тексте уточнение «для переноски».
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: масло для помазания
  rationale: Естественная современная передача устойчивого культового выражения с сохранением ритуального значения.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: благовонное курение
  rationale: סַמִּים указывает на ароматические вещества, а קְטֹרֶת — на состав для воскурения. «Благовонное курение» передаёт смысл естественно и соответствует библейскому регистру.
- source_word: מָסַךְ הַפֶּתַח
  choice: завесу у входа
  rationale: מָסָךְ здесь обозначает тканевую завесу, закрывающую вход. «Завеса» точнее для предмета обстановки скинии, чем современное бытовое «ширма».
- source_word: לְפֶתַח הַמִּשְׁכָּן
  choice: у входа в скинию
  rationale: Предлог לְ выражает отношение завесы ко входу; по-русски это естественно передаётся как её расположение или назначение у входа в скинию.
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: Устоявшийся русский библейский термин для переносного святилища Исхода; сохраняет точную референцию и достойный регистр.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской терминологией («жертвенник», «помазание», «скиния»). Союзы, многократно повторённые в еврейском перечне, опущены там, где это требуется естественным русским синтаксисом. Маркер сноски поставлен непосредственно после выражения, к которому относится.
