base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/035.yaml
  text: He has filled them with wisdom of heart to do every kind of work of an engraver[a], a designer, and an embroiderer in blue, in purple, in scarlet yarn, and in fine linen[c][b], and of a weaver—makers of every kind of work and designers of designs.
translation:
  language: ru
  text: 'Он исполнил их мудростью сердца[b], чтобы они выполняли всякую работу: работу резчика[a], мастера узоров, вышивальщика, работающего с голубой, пурпурной и алой пряжей и с тонким льном, и ткача, — выполняя всякую работу и замышляя замыслы[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мастера». Еврейское слово может обозначать искусного ремесленника вообще, хотя здесь, вероятно, названа одна из особых специальностей при изготовлении святилища.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мудростью сердца» — еврейское выражение, обозначающее внутреннее разумение, умение и мастерство.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «замышляя замыслы». В еврейском тексте употреблены однокоренные слова, подчёркивающие способность разрабатывать художественные решения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא אֹתָם
  choice: исполнил их
  rationale: Порода пиэль глагола מלא означает «наполнить, исполнить». Формулировка сохраняет прямой объект еврейского текста и указывает на совершённое Богом наделение.
- source_word: חָכְמַת לֵב
  choice: мудростью сердца
  rationale: Сохранён еврейский образ, объединяющий внутреннее разумение, умение и практическое мастерство; пояснение дано в сноске.
- source_word: לַעֲשׂוֹת כָּל מְלֶאכֶת
  choice: чтобы они выполняли всякую работу
  rationale: Инфинитив выражает цель или результат, а מלאכה обозначает работу, в данном контексте квалифицированный труд.
- source_word: חָרָשׁ
  choice: резчика
  rationale: В контексте изготовления святилища слово может обозначать мастера вообще, однако в перечне специальностей уместно более конкретное «резчик»; широта значения отмечена в сноске.
- source_word: חֹשֵׁב
  choice: составителя узоров
  rationale: В художественно-ремесленном контексте причастие от חשב обозначает мастера, задумывающего и создающего сложные узоры; перевод отличает его от вышивальщика и ткача.
- source_word: רֹקֵם
  choice: вышивальщика
  rationale: Обычное значение в текстильном контексте — мастер декоративной вышивки.
- source_word: תְּכֵלֶת וּבָאַרְגָּמָן בְּתוֹלַעַת הַשָּׁנִי
  choice: по голубой, пурпурной и алой пряже
  rationale: Цветовые термины обозначают дорого окрашенный текстильный материал; слово «пряжа» естественно передаёт подразумеваемый материал в контексте вышивки.
- source_word: שֵׁשׁ
  choice: тонкому льну
  rationale: В описаниях святилища שש означает качественный тонкий лён.
- source_word: אֹרֵג
  choice: ткача
  rationale: Прямое обозначение человека, занимающегося ткачеством.
- source_word: עֹשֵׂי כָּל מְלָאכָה
  choice: чтобы они исполняли всякую работу
  rationale: Причастная конструкция характеризует названных мастеров как исполнителей всех видов работ; в русском предложении она естественно продолжает целевую конструкцию.
- source_word: חֹשְׁבֵי מַחֲשָׁבֹת
  choice: разрабатывали искусные замыслы
  rationale: Еврейское сочетание однокоренных слов подчёркивает способность задумывать художественные решения. Русский перевод передаёт смысл без неестественного повтора.
