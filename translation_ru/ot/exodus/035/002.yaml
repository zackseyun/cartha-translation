base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/002.yaml
  text: Work may be done for six days[a], but on the seventh day there shall be for you a holy Sabbath, a complete rest to Yahweh[b]. Whoever does work on it shall surely be put to death.
translation:
  language: ru
  text: 'Шесть дней можно работать, а седьмой день будет для вас свят: это суббота полного покоя[a], посвящённая Яхве[b]. Всякий, кто будет выполнять в этот день работу, будет предан смерти.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «суббота субботнего покоя». Повтор родственных слов подчёркивает полное прекращение работы.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение можно также передать: «для Яхве» или «принадлежащая Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה
  choice: можно выполнять
  rationale: 'Нифаль передаёт безлично-пассивную формулировку закона: в течение шести дней работа может совершаться. Русская безличная конструкция естественна и не превращает фразу в прямое повеление конкретному лицу.'
- source_word: מְלָאכָה
  choice: работа
  rationale: В законодательстве о субботе слово обозначает работу или обычную трудовую деятельность; «работа» ясно и не сужает смысл до тяжёлого физического труда.
- source_word: קֹדֶשׁ
  choice: святыня
  rationale: 'Существительное употреблено предикативно: седьмой день должен иметь для народа священный, отделённый Богу статус. «Святыня» сохраняет именную форму еврейского выражения.'
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: суббота полного покоя
  rationale: Сочетание родственных слов усиливает мысль о прекращении работы. «Полный покой» передаёт это усиление яснее, чем традиционное, но менее точное «торжественный покой».
- source_word: לַיהוָה
  choice: посвящённой Яхве
  rationale: Предлог ל может выражать направленность, посвящение или принадлежность. В основном тексте выбрано естественное русское выражение посвящённости дня Богу; другие оттенки отмечены в сноске.
- source_word: כָּל הָעֹשֶׂה
  choice: всякий, кто станет выполнять
  rationale: Конструкция вводит общий правовой случай и распространяет норму на любого нарушителя.
- source_word: בּוֹ
  choice: в этот день
  rationale: Местоимение относится к седьмому дню; явное повторение слова «день» естественно по-русски и устраняет неясность местоименной отсылки.
- source_word: יוּמָת
  choice: будет предан смерти
  rationale: Хофаль глагола מות выражает каузативно-пассивное наказание — человека подвергнут смерти. Дополнительное усиление «непременно» не внесено, поскольку в данном стихе нет инфинитива абсолютного.
- source_word: שֵׁשֶׁת יָמִים ... וּבַיּוֹם הַשְּׁבִיעִי
  choice: шесть дней ... а седьмой день
  rationale: Конструкция сохраняет временное противопоставление шести рабочих дней и освящённого седьмого дня.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон — личное заветное имя Бога. «Яхве» передаёт имя, не заменяя его титулом.
- issue: Характер отношения субботы к Яхве в выражении לַיהוָה
  choice: посвящённой Яхве
  alternative: для Яхве; принадлежащей Яхве
  rationale: Предлог допускает несколько близких оттенков — посвящение, направленность и принадлежность. Основной текст передаёт посвящение, а сноска сохраняет возможную смысловую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксис сделан ясным для обычного читателя; сохранены безличный характер первой нормы, усиленное обозначение субботнего покоя и строгая пассивная формула наказания.
