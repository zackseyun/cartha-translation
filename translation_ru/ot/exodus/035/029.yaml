base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/029.yaml
  text: Every man and woman whose heart moved them to bring something for all the work that Yahweh had commanded to be done through Moses—the children of Israel brought a freewill offering to Yahweh[a][b][c].
translation:
  language: ru
  text: Каждый мужчина и каждая женщина, чьё сердце побудило их принести что-либо для выполнения всей работы, которую Яхве повелел совершить через Моисея, — сыны Израиля — принесли Яхве добровольное приношение[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой Моисея»; это еврейская идиома со значением «через Моисея».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «израильтяне принесли». Буквально: «сыны Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: Каждый мужчина и каждая женщина
  rationale: Передаёт распределительное значение כָּל и прямо сохраняет упоминание мужчин и женщин.
- source_word: נָדַב לִבָּם אֹתָם
  choice: которых сердце побудило
  rationale: Естественно передаёт еврейскую идиому о внутренней готовности и добровольном побуждении, не устраняя образ сердца.
- source_word: לְהָבִיא
  choice: принести что-либо
  rationale: Глагол означает «принести»; неопределённое «что-либо» естественно восполняет подразумеваемый из контекста предмет приношения.
- source_word: לְכָל הַמְּלָאכָה
  choice: для всех работ
  rationale: מְלָאכָה здесь охватывает совокупность работ по сооружению святилища и изготовлению его принадлежностей.
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשׂוֹת בְּיַד מֹשֶׁה
  choice: которые Яхве повелел выполнить через Моисея
  rationale: «Через Моисея» передаёт идиому בְּיַד מֹשֶׁה («рукой Моисея») как указание на посредничество; форма «выполнить» сохраняет связь с работами.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация передаёт личное имя, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: הֵבִיאוּ בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля принесли
  rationale: Сохраняет традиционный и близкий к форме исходного этнонима оборот; в данном контексте он включает ранее названных мужчин и женщин.
- source_word: נְדָבָה
  choice: добровольное приношение
  rationale: Передаёт приношение, сделанное по собственной готовности, без принуждения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранён образ сердца и традиционный этноним; громоздкая еврейская синтаксическая конструкция слегка упорядочена без устранения её итогового обобщения.
