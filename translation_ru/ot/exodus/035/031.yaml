  text: וַ/יְמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה בִּ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/031.yaml
  text: and he filled him with the Spirit of God[a], with wisdom, with understanding, and with knowledge[b], and with every kind of craftsmanship.
translation:
  language: ru
  text: и исполнил его Духом Божьим[a], мудростью, разумением, знанием и искусством во всяком деле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духом Божьим»; возможно также: «божественным духом». Еврейское выражение допускает более общее понимание, однако здесь, вероятнее всего, речь идёт о Божьем Духе, наделяющем человека силой и способностями.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «всяким мастерством»; или: «во всяком ремесле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֹתוֹ
  choice: и исполнил его
  rationale: Повествовательная форма передаёт завершённое действие; подразумеваемый субъект — Бог из предыдущего стиха, а местоимение относится к Веселеилу.
- source_word: רוּחַ אֱלֹהִים
  choice: Духом Божьим
  rationale: В контексте дарования способности к священному служению выражение вероятнее всего обозначает Божий Дух; при этом примечание сохраняет допустимую смысловую неоднозначность еврейской конструкции.
- source_word: בְּחָכְמָה
  choice: мудростью
  rationale: Передаёт חָכְמָה как данную Богом практическую мудрость; предлог ב в ряду дарований естественно выражен русским творительным падежом.
- source_word: בִּתְבוּנָה
  choice: разумением
  rationale: Слово «разумение» сохраняет оттенок способности понимать и различать, а также отделяет תְבוּנָה от следующего דַּעַת.
- source_word: וּבְדַעַת
  choice: знанием
  rationale: Сохраняет основное значение דַּעַת и не сужает его до одного лишь ремесленного навыка.
- source_word: וּבְכָל מְלָאכָה
  choice: и искусством во всяком деле
  rationale: В контексте изготовления скинии מְלָאכָה обозначает искусную работу или ремесло; формулировка передаёт и мастерство, и широкий охват деятельности.
theological_decisions:
- issue: Следует ли понимать רוּחַ אֱלֹהִים лично как Божий Дух или более общо как божественный дух/дарование
  choice: Духом Божьим
  alternative: духом Божьим; божественным духом
  rationale: Непосредственный контекст говорит о Божьем наделении Веселеила способностями для священного труда, поэтому личное понимание наиболее вероятно. Альтернативы отмечены, поскольку в еврейском выражении нет артикля и сама конструкция допускает более общее прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Исполнил» сохраняет образ наполнения, а последовательность «мудростью, разумением, знанием» воспроизводит различия исходной тройки без искусственного упрощения.
