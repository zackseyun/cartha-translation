  terminology: «Способность обучать» точно передаёт инфинитив хифиля לְהוֹרוֹת в контексте ремесленного наставничества. Формы имён «Веселеил», «Оголиав» и «Ахисамах» соответствуют устойчивой русской библейской передаче. Уточнение имени Веселеила оправдано непосредственным контекстом и позволяет по-русски ясно передать эксплицитное местоимение оригинала.
