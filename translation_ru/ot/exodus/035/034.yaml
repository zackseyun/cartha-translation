lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: умение обучать
  rationale: Инфинитив породы хифиль от ירה означает «учить, наставлять». Добавление «умение» естественно передаёт внутреннее дарование в сочетании с נָתַן בְּלִבּוֹ и по контексту включает обучение искусному ремеслу.
- source_word: נָתַן בְּלִבּוֹ
  choice: вложил в их сердца
  rationale: Древнееврейская идиома обозначает внутреннее наделение способностью или побуждением. «Вложил в сердца» сохраняет библейский образ сердца; множественное число в начальной формулировке делает по-русски ясным, что дар получили оба названных человека.
- source_word: הוּא
  choice: его
  rationale: Явное местоимение относится к Веселеилу из предшествующего контекста. Конструкция «в сердце его и Оголиава» сохраняет распределительное уточнение исходного текста без внесения имени, отсутствующего в данном стихе.
- source_word: וְאָהֳלִיאָב
  choice: и Оголиава
  rationale: Имя передано в традиционной русской библейской форме, обеспечивающей узнаваемость.
- source_word: בֶּן אֲחִיסָמָךְ
  choice: сына Ахисамаха
  rationale: Прямое и естественное обозначение происхождения; имя передано в традиционной русской форме.
- source_word: לְמַטֵּה דָן
  choice: из племени Дана
  rationale: Предлог לְ здесь выражает племенную принадлежность; «из племени Дана» естественно и точно передаёт этот смысл.
