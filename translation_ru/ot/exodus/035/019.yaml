base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/019.yaml
  text: the finely woven garments for ministering in the sanctuary[a], the holy garments for Aaron the priest[b], and the garments of his sons for serving as priests.
translation:
  language: ru
  text: искусно вытканные одежды[a] для служения в святилище[b], священные одежды для священника Аарона и одежды его сыновей для священнического служения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служебные одежды»; значение редкого еврейского слова допускает понимание особых одежд или тканых изделий для служения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в святом месте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: искусно вытканные одежды
  rationale: Сочетание обозначает особые изделия для служения при святилище; перевод передаёт вероятную связь редкого слова הַשְּׂרָד с искусно изготовленной тканью, а альтернативное понимание «служебные одежды» сохранено в сноске.
- source_word: לְשָׁרֵת
  choice: для служения
  rationale: Передаёт целевое значение инфинитива и сакральный контекст, не вводя более узкой конфессиональной терминологии.
- source_word: בַּקֹּדֶשׁ
  choice: в святилище
  rationale: В контексте скинии הַקֹּדֶשׁ указывает на священное место или пространство; «святилище» естественно и ясно по-русски, а более буквальная альтернатива дана в сноске.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: священные одежды
  rationale: Идиоматически передаёт одежды, посвящённые для священного употребления, сохраняя отличие от первой группы изделий.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: для священника Аарона
  rationale: Естественно передаёт принадлежность одежд Аарону и его должность; такая последовательность слов соответствует современному литературному русскому.
- source_word: בִּגְדֵי בָנָיו
  choice: одежды его сыновей
  rationale: Сохраняет структуру и смысл еврейского сочетания без лишнего уточнения.
- source_word: לְכַהֵן
  choice: для священнического служения
  rationale: Порода пиэль глагола כהן означает исполнять обязанности священника; выбранная формулировка ясно передаёт функцию одежд.
theological_decisions:
- issue: Соотношение בִּגְדֵי הַשְּׂרָד и בִּגְדֵי הַקֹּדֶשׁ
  choice: Первая фраза представлена как отдельная позиция перечня — особые тканые одежды для служения, после которой названы священные одежды Аарона и его сыновей.
  alternative: Считать первую фразу общим или приложенным описанием тех же священнических одежд.
  rationale: Повторение אֶת поддерживает перечислительную структуру и позволяет различать названные изделия. При этом редкость הַשְּׂרָד и параллельные места не позволяют исключить смысловое перекрытие, поэтому перевод не добавляет пояснений, жёстко разводящих эти категории.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Термины «святилище», «священные одежды» и «священническое служение» понятны широкому читателю и не привязаны к поздней церковной номенклатуре.
