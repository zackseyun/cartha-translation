lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: стол
  rationale: Существительное обозначает культовый стол; его назначение раскрывается далее упоминанием хлеба Присутствия, поэтому уточнение здесь было бы избыточным.
- source_word: בַּדָּיו
  choice: его шесты
  rationale: В контексте скинии בַּד обозначает шесты, на которых переносили священные предметы обстановки. «Шесты» — ясное и принятое в современном русском библейском языке слово.
- source_word: כָּל כֵּלָיו
  choice: всю его утварь
  rationale: כְּלִי — широкое обозначение принадлежностей, сосудов и орудий. В отношении стола «утварь» естественно охватывает весь набор принадлежностей, не сужая значения до одних сосудов.
- source_word: לֶחֶם הַפָּנִים
  choice: хлеб Присутствия
  rationale: Буквально выражение связано с «лицом/присутствием». «Хлеб Присутствия» сохраняет образность и культовый смысл еврейского выражения, тогда как традиционное «хлеб предложения» для многих современных читателей непрозрачно.
theological_decisions:
- issue: Чьё присутствие подразумевается в выражении לֶחֶם הַפָּנִים
  choice: хлеб Присутствия
  alternative: хлеб, лежащий перед Господом
  rationale: Контекст подразумевает присутствие Господа, однако Его имя в еврейском тексте этого стиха не названо. Перевод сохраняет эту лаконичность и не превращает подразумеваемое в прямо высказанное.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства культовой лексики. Синтаксис оставлен как элемент перечня; итоговая запятая отражает продолжение предложения в контексте главы.
