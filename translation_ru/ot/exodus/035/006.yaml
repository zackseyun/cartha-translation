lexical_decisions:
- source_word: תְכֵלֶת
  choice: синюю пряжу
  rationale: Существительное обозначает окрашенный в синий или сине-пурпурный цвет текстильный материал. В русском перечне слово «пряжу» естественно относится сразу к трём цветовым определениям.
- source_word: אַרְגָּמָן
  choice: пурпурную пряжу
  rationale: Термин обозначает материал, окрашенный пурпуром; общее слово «пряжу» передаёт подразумеваемый текстильный материал.
- source_word: תוֹלַעַת שָׁנִי
  choice: алую пряжу
  rationale: Устойчивое древнееврейское выражение обозначает материал, окрашенный алым красителем, который получали из насекомых. Перевод передаёт цвет и текстильный контекст без неестественной буквальности.
- source_word: שֵׁשׁ
  choice: тонкий лён
  rationale: В контексте материалов для святилища слово обозначает тонкую высококачественную льняную ткань или льняной материал. «Тонкий лён» понятно современному читателю и не требует архаизма «виссон».
- source_word: עִזִּים
  choice: козью шерсть
  rationale: Буквально стоит множественное число «козы», но в перечне материалов подразумевается козья шерсть, из которой изготовляли полотнища.
- source_word: וְ
  choice: и
  rationale: Повтор союза перед каждым элементом сохраняет многосоюзный ритм древнееврейского перечня.
