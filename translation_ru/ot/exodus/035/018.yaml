  text: колья скинии, колья двора и их верёвки —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִתְדֹת
  choice: колья
  rationale: Обозначает колья, которыми закрепляли скинию и ограждение двора; «колья» — точное и естественное современное соответствие.
- source_word: הַמִּשְׁכָּן
  choice: скинии
  rationale: В книге Исход מִשְׁכָּן — устойчивое обозначение священного переносного жилища; «скиния» сохраняет принятую библейскую терминологию.
- source_word: הֶחָצֵר
  choice: двора
  rationale: В данном контексте חָצֵר обозначает ограждённое пространство вокруг скинии; «двор» краток и понятен.
- source_word: מֵיתְרֵיהֶם
  choice: их верёвки
  rationale: Слово обозначает верёвки, служившие для закрепления конструкции и ограды. «Верёвки» понятно современному читателю и передаёт практическое назначение предметов.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: колья ... колья ... и их верёвки
  rationale: Повторяющиеся показатели прямого дополнения образуют перечень; в русском они не передаются отдельно, но структура перечисления сохранена.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением традиционного термина «скиния». Лаконичная форма перечня соответствует контексту. Конечное тире сохраняет незавершённость синтаксической конструкции стиха как части более длинного списка.
