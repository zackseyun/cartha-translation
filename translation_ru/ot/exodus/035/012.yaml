translation:
  language: ru
  text: ковчег и шесты к нему, крышку искупления[a] и завесу-перегородку;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крышку очищения»; традиционно: «очистилище».'
    reason: Лексически и богословски значимый термин הַכַּפֹּרֶת допускает несколько устоявшихся передач.
lexical_decisions:
- source_word: הָאָרֹן
  choice: ковчег
  rationale: В контексте скинии слово обозначает священный ковчег; это точный и устойчивый русский эквивалент, тогда как «сундук» звучал бы слишком обобщённо.
- source_word: בַּדָּיו
  choice: шесты к нему
  rationale: Речь идёт о шестах для переноски ковчега. Оборот «к нему» естественно передаёт местоименный суффикс принадлежности и не создаёт впечатления, будто шесты являются неотъемлемыми частями самого ковчега.
- source_word: הַכַּפֹּרֶת
  choice: крышку искупления
  rationale: Термин обозначает золотую крышку ковчега, связанную с обрядом очищения и искупления. Выражение сохраняет как предметное значение «крышка», так и культовый смысл, не сводя слово только к одному из них.
- source_word: פָּרֹכֶת
  choice: завесу
  rationale: Слово обозначает внутреннюю завесу скинии, отделявшую священное пространство. «Завеса» сохраняет её разделительную и культовую функцию.
- source_word: הַמָּסָךְ
  choice: для ограждения
  rationale: Существительное обозначает закрывающий полог или преграду. В сочетании с «завесой» русский оборот «завеса для ограждения» естественно сохраняет оба элемента еврейской конструкции, не отождествляя её с обычной занавеской.
- source_word: אֶת / וְאֶת
  choice: не переводятся отдельно
  rationale: Повторяющиеся показатели определённого прямого дополнения переданы винительным падежом и сочинительной связью.
theological_decisions:
- issue: Передача הַכַּפֹּרֶת в культовом контексте
  choice: крышка искупления
  alternative: 'крышка очищения; традиционно: очистилище'
  rationale: Еврейское слово называет крышку ковчега и связано с обрядами очищения/искупления, однако точный оттенок нельзя безоговорочно свести к одной богословской формуле. Основной текст сохраняет предметный и культовый аспекты, а примечание сообщает другие принятые варианты.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской лексикой. Сохранена форма перечисления в винительном падеже, зависящая от глагола в предшествующем контексте. Точка с запятой отражает незавершённость перечня в пределах более длинного предложения.
