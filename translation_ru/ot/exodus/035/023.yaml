lexical_decisions:
- source_word: וְכָל אִישׁ
  choice: Каждый
  rationale: Сочетание כָל с אִישׁ имеет распределительное значение — «каждый». Русское «каждый» сохраняет грамматическую форму и не добавляет утверждения, будто речь идёт исключительно о мужчинах, поскольку в данном контексте дары приносило всё общество.
- source_word: אֲשֶׁר נִמְצָא אִתּוֹ
  choice: у кого нашлись
  rationale: Передаёт пассивную конструкцию «оказались/нашлись при нём, у него» достаточно близко к еврейскому тексту и при этом естественно по-русски.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: голубая, пурпурная или алая пряжа
  rationale: В перечне материалов для святилища названия красителей обозначают окрашенный текстиль; «пряжа» ясно передаёт подразумеваемый материал. Союз «или» по-русски показывает, что у одного человека мог быть любой из перечисленных видов, не отрицая возможности иметь несколько.
- source_word: שֵׁשׁ
  choice: тонкий лён
  rationale: В текстах о святилище слово обозначает высококачественный льняной материал; «тонкий лён» понятно современному читателю и отражает качественный оттенок.
- source_word: עִזִּים
  choice: козья шерсть
  rationale: Буквально «козы», однако в перечне материалов подразумевается козья шерсть, из которой изготовляли покрытия; перевод не создаёт ложного впечатления, будто приносили живых коз.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: выкрашенные в красный цвет бараньи шкуры
  rationale: Передаёт и материал, и значение причастия מְאָדָּמִים — шкуры были окрашены или обработаны так, что стали красными.
- source_word: עֹרֹת תְּחָשִׁים
  choice: кожи тахаш[a]
  rationale: Значение תְּחָשׁ достоверно не установлено. Транслитерация сохраняет неопределённость исходного текста, а сноска сообщает основные предлагаемые толкования.
- source_word: הֵבִיאוּ
  choice: принёс их
  rationale: Еврейский глагол стоит во множественном числе и относится ко всем перечисленным людям; русское согласование с распределительным «каждый» требует единственного числа. Местоимение «их» естественно выражает подразумеваемый объект.
