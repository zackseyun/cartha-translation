lexical_decisions:
- source_word: הַבֹּשֶׂם
  choice: благовония
  rationale: Существительное обозначает ароматические вещества или пряности. В перечне материалов для святилища множественное собирательное «благовония» звучит естественно и не сужает значение до конкретного бальзама.
- source_word: הַשָּׁמֶן
  choice: масло
  rationale: В еврейском тексте употреблено обычное слово «масло» без прямого уточнения, что оно оливковое.
- source_word: לְמָאוֹר
  choice: для светильника
  rationale: Буквально выражение связано со светом или источником света; в данном культовом контексте речь идёт о назначении масла для светильника. Перевод естественен по-русски, хотя возможен более буквальный вариант «для освещения».
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: масло помазания
  rationale: Устойчивая и ясная русская передача сочетания, обозначающего священное масло, предназначенное для помазания.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: благовонное курение
  rationale: Выражение обозначает курение из ароматических веществ. Такая передача естественна и сохраняет как культовое действие или вещество для воскурения, так и его ароматический характер.
- source_word: וְאֶת ... וְאֶת ... וּלְ ... וְלִ
  choice: и ... и ... для ... и для
  rationale: Повтор союзов сохраняет характер перечисления, продолжающего предыдущий стих; объектные показатели отдельно не переводятся.
