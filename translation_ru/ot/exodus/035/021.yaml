base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/021.yaml
  text: And everyone came whose heart stirred him[a], and everyone whose spirit moved him willingly brought Yahweh’s contribution for the work of the tent of meeting, for all its service[b], and for the holy garments.
translation:
  language: ru
  text: И пришли все, кого побудило сердце,[a] и все, кого дух расположил к добровольному приношению. Они принесли приношение для Яхве — для работ над шатром встречи, для всего служения в нём и для священных одежд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чьё сердце вознесло его». Это еврейская идиома внутреннего побуждения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: И пришли
  rationale: Прямо передаёт повествовательную форму глагола בוא, не добавляя более толковательного «выступили вперёд».
- source_word: כָּל אִישׁ
  choice: все
  rationale: В данном контексте выражение имеет обобщённо-распределительный смысл и относится ко всем откликнувшимся людям; русское «все» естественно передаёт его без ненужного гендерного сужения.
- source_word: אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: кого побудило сердце
  rationale: Еврейская идиома буквально говорит, что сердце «подняло» человека. По-русски «побудило сердце» сохраняет образ внутреннего побуждения и звучит естественно.
- source_word: וְכֹל אֲשֶׁר נָדְבָה רוּחוֹ אֹתוֹ
  choice: и все, кого дух расположил к добровольной щедрости
  rationale: נדב выражает добровольную готовность и щедрый порыв; перевод сохраняет и внутреннее движение духа, и добровольный характер дара.
- source_word: הֵבִיאוּ
  choice: Они принесли
  rationale: Простой глагол «принесли» точно передаёт конкретное действие жертвователей и ясно обозначает подлежащее после двух однородных описаний.
- source_word: תְּרוּמַת יְהוָה
  choice: приношение Яхве
  rationale: תְּרוּמָה здесь означает выделенный добровольный вклад или приношение. Конструкция с именем Яхве допускает оттенки принадлежности и назначения; «приношение Яхве» сохраняет эту компактную неоднозначность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное божественное имя, а не заменяющий его титул.
- source_word: לִמְלֶאכֶת אֹהֶל מוֹעֵד
  choice: для работ над шатром встречи
  rationale: מְלָאכָה обозначает выполняемые работы, связанные с изготовлением святилища и его принадлежностей; «над шатром встречи» естественно выражает назначение материалов.
- source_word: וּלְכָל עֲבֹדָתוֹ
  choice: для всего служения в нём
  rationale: עֲבֹדָה в контексте святилища охватывает его культовое служение и функции. Местоименный суффикс соотнесён с шатром встречи.
- source_word: וּלְבִגְדֵי הַקֹּדֶשׁ
  choice: и для священных одежд
  rationale: «Священные одежды» ясно и достойно обозначает посвящённые Богу священнические облачения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его отличие от титула אֲדֹנָי.
- issue: Направленность выражения תְּרוּמַת יְהוָה
  choice: приношение Яхве
  alternative: приношение для Яхве
  rationale: Еврейская генитивная конструкция может указывать как на принадлежность Яхве, так и на посвящение Ему. Краткое «приношение Яхве» не устраняет эту смысловую напряжённость.
- issue: Характер внутреннего побуждения
  choice: сердце побудило; дух расположил к добровольной щедрости
  alternative: сердце вознесло; дух сделал добровольным
  rationale: Перевод различает две параллельные идиомы и сохраняет акцент второй на свободной готовности, не утверждая отдельного сверхъестественного воздействия, которого грамматика сама по себе не требует.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис разделён на два предложения ради ясности; параллелизм двух внутренних побуждений сохранён. Термин «шатёр встречи» последовательно передаёт אֹהֶל מוֹעֵד.
