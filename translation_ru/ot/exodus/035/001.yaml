  text: Then Moses assembled all the congregation of the sons of Israel and said to them[b][a], “These are the things that Yahweh has commanded to be done.”
translation:
  language: ru
  text: 'Моисей созвал всё общество сынов Израиля[a] и сказал им: «Вот что[b] Яхве повелел сделать».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны Израиля» — заветное обозначение израильского народа; здесь оно относится ко всему обществу, а не только к мужчинам.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Вот слова»; также возможно: «Вот дела» или «Вот предписания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: созвал
  rationale: Порода hифиль глагола קהל означает, что Моисей собрал народ как единое собрание; «созвал» естественно и точно передаёт побудительный смысл.
- source_word: כָּל עֲדַת
  choice: всё общество
  rationale: עֵדָה обозначает организованное сообщество Израиля. «Всё общество» сохраняет собирательный и заветный смысл и звучит естественно в современном русском.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формулировка сохраняет грамматически мужское выражение исходного текста и его традиционный заветный характер; в данном контексте оно обозначает весь народ, а не только мужчин.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: вот что
  rationale: דְּבָרִים допускает значения «слова», «дела» и «предписания». Перед последующими повелениями русское «вот что» естественно сохраняет широту выражения, не сводя его только к словам.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменено титулом.
- source_word: לַעֲשֹׂת אֹתָם
  choice: исполнить
  rationale: Инфинитив с местоименным дополнением указывает на предписания, которые следует осуществить; «исполнить» идиоматично сочетается с «повелел» и сохраняет деятельный смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. «Яхве» прямо передаёт тетраграмматон и не подменяет имя титулом.
- issue: Гендерная и заветная форма בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Сохранена мужская форма исходного выражения и его заветное звучание, при этом примечание поясняет, что речь идёт обо всём народе.
- issue: Неоднозначность אֵלֶּה הַדְּבָרִים
  choice: вот что
  alternative: вот слова; вот дела; вот предписания
  rationale: Контекст относится к повелениям, которые нужно исполнять, однако существительное דָּבָר шире любого одного русского соответствия; краткое примечание сохраняет эту смысловую многозначность.
translation_notes:
  register: Современный литературный русский, с умеренно торжественным библейским регистром. Порядок примечаний соответствует месту соответствующих выражений в стихе; маркеры вынесены после цитаты, чтобы не разрывать короткую фразу.
