  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/004.yaml
  text: Then Moses said to all the congregation of the sons of Israel[a], “This is the thing that Yahweh has commanded[c][b], saying,”
translation:
  language: ru
  text: 'И сказал Моисей всему собранию сынов Израиля[a]: «Вот что повелел Яхве:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всей общине израильтян».'
    reason: 'Лексико-стилистическая альтернатива: עֲדָה может передаваться как «община», а בְּנֵי יִשְׂרָאֵל — как этноним «израильтяне».'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Повествовательная форма с וַ־ продолжает последовательность событий; традиционное и естественное русское «И сказал» сохраняет эту связь.
- source_word: עֲדַת
  choice: собранию
  rationale: Слово обозначает собранную общину Израиля. «Собрание» передаёт корпоративный смысл и естественно звучит в данном контексте.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально сохраняется мужская форма исходного выражения; при этом в Пятикнижии оно служит наименованием народа Израиля в целом.
- source_word: זֶה הַדָּבָר
  choice: Вот что
  rationale: דָּבָר допускает значения «слово», «дело», «вещь». Здесь оборот вводит содержание повеления, поэтому идиоматическое «Вот что» точно передаёт его функцию без неестественного русского «вот это слово».
- source_word: צִוָּה
  choice: повелел
  rationale: Глагол выражает властное предписание; русское «повелел» соответствует торжественному повествовательному регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: לֵאמֹר
  choice: сказать
  rationale: Инфинитив вводит содержание повеления, которое следует далее; конструкция «повелел сказать» естественно передаёт его синтаксическую роль.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон, поэтому сохранено личное имя, а не заменяющий его титул.
- issue: Объём выражения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне / дети Израиля
  rationale: Выбранная формально точная передача сохраняет мужское множественное число исходника, хотя выражение обозначает народную общину в целом.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Формула «Вот что повелел Яхве сказать» естественно связывает стих с последующим содержанием повеления и избегает калькирования.
