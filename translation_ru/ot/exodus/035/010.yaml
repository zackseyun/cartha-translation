base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/010.yaml
  text: And every skillful person among you shall come and make all that Yahweh has commanded:[a][b]
translation:
  language: ru
  text: 'И пусть каждый из вас, кто искусен[a][b], придёт и сделает всё, что повелел Яхве:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мудрый сердцем» — еврейское выражение о человеке, обладающем умением и мастерством, особенно в ремесле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все искусные среди вас». В еврейском тексте выражение стоит в мужском роде и единственном числе, но имеет распределительное значение; следующие за ним глаголы употреблены во множественном числе.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כָל
  choice: И пусть каждый
  rationale: Союз וְ связывает призыв с предыдущим наставлением, а כָל перед существительным в единственном числе имеет распределительное значение — «каждый».
- source_word: חֲכַם לֵב
  choice: кто искусен
  rationale: Буквально выражение означает «мудрый сердцем», но в контексте изготовления скинии обозначает практическое умение и мастерство.
- source_word: בָּ/כֶם
  choice: из вас
  rationale: Предлог ב с местоименным суффиксом указывает на человека внутри общины; по-русски естественно передаётся как «из вас».
- source_word: יָבֹאוּ
  choice: пусть … придёт
  rationale: Имперфект в данном призыве имеет побудительное значение. В русском распределительное «каждый» требует сказуемого в единственном числе.
- source_word: וְ/יַעֲשׂוּ
  choice: и сделает
  rationale: В контексте сооружения скинии עָשָׂה обозначает изготовление предписанных предметов; число согласовано с русским «каждый».
- source_word: אֵת כָּל אֲשֶׁר
  choice: всё, что
  rationale: Естественно передаёт совокупность всего предписанного.
- source_word: צִוָּה יְהוָה
  choice: повелел Яхве
  rationale: Перфект указывает на уже данное повеление, а личное имя יְהוָה передано как «Яхве».
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно употреблено имя יהוה; транслитерация сохраняет его как личное заветное имя, не заменяя титулом.
- issue: Род и распределительное значение חֲכַם לֵב
  choice: каждый из вас, кто искусен
  alternative: все искусные среди вас
  rationale: Форма в еврейском тексте — мужской род, единственное число, однако она имеет распределительное значение и не утверждает прямо, что речь идёт исключительно о мужчинах. Русское «каждый» сохраняет грамматическую форму, а примечание сообщает о её функции.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Побудительная конструкция «пусть … придёт и сделает» естественно передаёт директивную силу еврейских форм. Двоеточие сохранено, поскольку далее следует перечень того, что надлежит изготовить.
