  text: You shall not kindle a fire in any of your dwellings on the Sabbath day.
translation:
  language: ru
  text: Не зажигайте огня ни в одном из ваших жилищ в субботний день.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְבַעֲרוּ
  choice: зажигайте
  rationale: Пиэль глагола בער здесь означает разжигать, воспламенять. «Зажигать огонь» — естественное современное русское выражение, точно передающее действие и не расширяющее запрет до всякого использования огня.
- source_word: אֵשׁ
  choice: огня
  rationale: Существительное אֵשׁ обозначает огонь; родительный падеж обусловлен нормативным русским управлением в отрицательной конструкции «не зажигайте огня».
- source_word: בְּכֹל
  choice: ни в одном
  rationale: При отрицательном повелении сочетание с כֹּל имеет распределительный смысл. «Ни в одном» ясно показывает, что запрет распространяется на каждое жилище, и звучит естественнее буквального «во всех».
- source_word: מֹשְׁבֹתֵיכֶם
  choice: из ваших жилищ
  rationale: מוֹשָׁב может обозначать место проживания или обитания. «Жилища» сохраняет широту и достоинство исходного выражения, не сужая его до частных домов и не превращая в обозначение поселений.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: в субботний день
  rationale: Перевод сохраняет явно названный в еврейском тексте «день» и естественно передаёт временное значение предложной конструкции.
theological_decisions:
- issue: Объём субботнего запрета, связанного с огнём
  choice: Передать прямой запрет зажигать огонь, не добавляя запрета на всякое использование или поддержание уже горящего огня.
  alternative: Расширить формулировку до запрета пользоваться огнём либо истолковать её в свете позднейших галахических положений.
  rationale: Еврейский текст непосредственно говорит о зажигании огня в жилищах в субботний день. Перевод не должен разрешать более широкие толковательные вопросы, которых сам стих явно не раскрывает.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Повелительная форма во множественном числе передаёт обращение к общине; архаизмы и конфессионально окрашенные добавления отсутствуют.
