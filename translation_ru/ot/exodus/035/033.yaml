    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: в обработке / в резьбе
  rationale: Существительное обозначает искусную обработку материала. С камнем естественно «обработка», а с деревом — «резьба»; такое варьирование учитывает материал, сохраняя общий смысл еврейского слова.
- source_word: אֶבֶן
  choice: камней
  rationale: Единственное число в еврейском имеет собирательно-вещественное значение; в русском описании ремесла естественнее множественное число.
- source_word: לְמַלֹּאת
  choice: для вставки
  rationale: В контексте изготовления священных предметов речь идет о вставке камней в оправу или гнездо, а не об общем значении «наполнять».
- source_word: עֵץ
  choice: дереву
  rationale: Здесь слово обозначает древесину как материал, а не живое дерево.
- source_word: לַעֲשׂוֹת
  choice: чтобы выполнять
  rationale: Передает целевое значение инфинитива и естественно сочетается в русском с существительным «работа».
- source_word: בְּכָל מְלֶאכֶת
  choice: всякую ... работу
  rationale: Передает охват всего круга ремесленных работ без неестественного буквального оборота «каждую работу».
- source_word: מַחֲשָׁבֶת
  choice: искусно задуманную
  rationale: Слово связано с замыслом, проектированием и искусным исполнением. Сочетание сохраняет как идею продуманного замысла, так и художественно-ремесленный контекст.
