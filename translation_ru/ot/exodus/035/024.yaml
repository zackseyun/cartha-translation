  variant: modern literary Russian
source:
  edition: WLC
  text: כָּל מֵרִ֗ים תְּר֤וּמַת כֶּ֨סֶף֙ וּ/נְחֹ֔שֶׁת הֵבִ֕יאוּ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה וְ/כֹ֡ל אֲשֶׁר֩ נִמְצָ֨א אִתּ֜/וֹ עֲצֵ֥י שִׁטִּ֛ים לְ/כָל מְלֶ֥אכֶת הָ/עֲבֹדָ֖ה הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/024.yaml
  text: Everyone who offered a contribution of silver or bronze brought Yahweh’s contribution[b][a], and everyone with whom acacia wood was found for any work of the service brought it.
translation:
  language: ru
  text: Все, кто приносил в дар серебро или бронзу[a], приносили приношение Яхве; и все, у кого была древесина акации[b] для любой работы служения, приносили её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «серебро и бронзу». Еврейский союз допускает буквальное «и», однако в данном контексте может распределительно указывать на тот металл, который приносил каждый человек.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «у кого находилась древесина акации» — древнееврейский оборот, означающий, что она у человека была или имелась в его распоряжении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מֵרִים
  choice: все, кто выделял в приношение
  rationale: Причастие от רוּם в сочетании с תְּרוּמָה обозначает представление или выделение дара для священной цели. Формулировка передаёт это значение естественным современным русским языком.
- source_word: תְּרוּמַת כֶּסֶף וּנְחֹשֶׁת
  choice: в приношение серебро или бронзу
  rationale: תְּרוּמָה — дар или приношение, отделённое для священной цели. נְחֹשֶׁת может означать медь или бронзу; в перечне материалов святилища уместно традиционное контекстуальное соответствие «бронза». Союз передан как «или», поскольку речь идёт о том металле, который мог принести каждый человек; буквальное «и» отмечено в сноске.
- source_word: הֵבִיאוּ אֵת תְּרוּמַת יְהוָה
  choice: приносили приношение Яхве
  rationale: Сочетание в сопряжённой конструкции обозначает приношение, принадлежащее Яхве или посвящённое Ему. Краткая русская формулировка сохраняет эту смысловую ёмкость.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное заветное имя Бога, а не замещающий титул.
- source_word: וְכֹל אֲשֶׁר נִמְצָא אִתּוֹ
  choice: и все, у кого была
  rationale: Буквальное «у кого находилась» является древнееврейским оборотом со значением наличия или доступности; по-русски естественно «у кого была».
- source_word: עֲצֵי שִׁטִּים
  choice: древесина акации
  rationale: Доступное современному читателю обозначение строительного материала; слово «древесина» отражает собирательное значение формы עֲצֵי.
- source_word: לְכָל מְלֶאכֶת הָעֲבֹדָה
  choice: для какой-либо работы служения
  rationale: 'Сохранены оба понятия: מְלָאכָה — работа или ремесленное дело, עֲבֹדָה — служение или труд. «Какой-либо» естественно передаёт распределительное значение כָּל, не добавляя прямо не названное здесь слово «скиния».'
- source_word: הֵבִיאוּ
  choice: приносили её
  rationale: Местоимение соотнесено с русским существительным «древесина» и делает заключительную часть фразы естественной.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное заветное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Смысл выражения תְּרוּמַת יְהוָה
  choice: приношение Яхве
  alternative: приношение для Яхве; приношение, принадлежащее Яхве
  rationale: Еврейская сопряжённая конструкция допускает оттенки принадлежности и посвящения. Краткая формулировка не сводит её без необходимости только к адресату или только к владению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Сохранён повтор слова «приношение» и различие между «работой» и «служением»; синтаксис слегка сглажен для ясности. Все сноски отмечены в основном тексте.
