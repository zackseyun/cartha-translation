lexical_decisions:
- source_word: וְ/לַ/חְשֹׁב מַחַשָׁבֹת
  choice: разрабатывать художественные замыслы
  rationale: Глагол חשׁב и однокоренное существительное מַחֲשָׁבוֹת в ремесленном контексте обозначают творческое продумывание и разработку художественных проектов. Русское сочетание передаёт смысл естественно, а однокоренная усилительная конструкция отмечена в сноске.
- source_word: לַ/עֲשֹׂת
  choice: работать
  rationale: В сочетании с названиями материалов широкий по значению глагол עשה указывает на ремесленную обработку и изготовление; «работать с» здесь звучит естественно и не конкретизирует технику сверх источника.
- source_word: בַּ/זָּהָב
  choice: с золотом
  rationale: Предлог ב в перечне материалов обозначает материал или сферу ремесленной работы; по-русски нормативно «работать с золотом».
- source_word: וּ/בַ/כֶּסֶף
  choice: серебром
  rationale: Сохраняется параллельный перечень материалов; повторение предлога в русском не требуется.
- source_word: וּ/בַ/נְּחֹשֶׁת
  choice: бронзой
  rationale: נְחֹשֶׁת традиционно и контекстуально передаётся как «бронза», хотя слово может обозначать также медь или медный сплав; неоднозначность отражена в сноске.
