lexical_decisions:
- source_word: קַלְעֵי
  choice: завесы
  rationale: Обозначает полотнища, образующие ограду двора; «завесы» естественно передаёт тканевый характер ограждения и отличается от входного полога.
- source_word: חָצֵר
  choice: двор
  rationale: Обозначает ограждённое внешнее пространство скинии; «двор» — краткий и устоявшийся русский эквивалент.
- source_word: עַמֻּדָיו
  choice: его столбы
  rationale: Речь о вертикальных опорах ограды двора; «столбы» точнее и естественнее здесь, чем архитектурно окрашенные «колонны».
- source_word: אֲדָנֶיהָ
  choice: основания
  rationale: Обозначает опорные элементы, в которые устанавливались столбы; «основания» понятно современному читателю, тогда как «гнёзда» было бы более техническим.
- source_word: מָסַךְ
  choice: полог
  rationale: В контексте скинии это тканевая завеса, закрывающая вход; «полог» позволяет отличить её от боковых завес двора.
- source_word: שַׁעַר
  choice: ворота
  rationale: Обозначает входной проём ограды двора; «ворота» прямо передаёт пространственный образ исходного слова.
