base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/005.yaml
  text: 'Take from among you an offering for Yahweh[a]. Everyone whose heart is willing shall bring it—Yahweh’s offering: gold, silver[b], and bronze.'
translation:
  language: ru
  text: 'Соберите среди себя приношение для Яхве[a]. Пусть каждый, кто желает от сердца, принесёт приношение для Яхве: золото, серебро и бронзу[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте стоит личное имя Бога — יהוה (ЙХВХ), здесь переданное как «Яхве».
    reason: divine_name
  - marker: b
    text: Еврейское слово может обозначать медь или бронзу; в перечнях материалов скинии традиционно переводится как «бронза».
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ מֵאִתְּכֶם
  choice: Возьмите из того, что у вас есть
  rationale: Императив קְחוּ передаёт прямое повеление, а מֵאִתְּכֶם указывает, что пожертвование должно исходить от самой общины. Такая формулировка естественна по-русски и не создаёт ошибочного впечатления, будто речь идёт о выборе людей из среды народа.
- source_word: תְּרוּמָה
  choice: приношение
  rationale: В данном контексте это добровольно передаваемые и посвящаемые Богу материалы для святилища. «Приношение» сохраняет сакральный смысл и не вводит узкого обрядового значения.
- source_word: לַיהוָה / יְהוָה
  choice: для Яхве / приношение Яхве
  rationale: Тетраграмматон передан личным именем «Яхве»; предлог ל обозначает посвящение, а конструкция תְּרוּמַת יְהוָה допускает естественную русскую передачу «приношение Яхве».
- source_word: כֹּל נְדִיב לִבּוֹ
  choice: каждый, кого побуждает сердце
  rationale: Фраза обозначает добровольное внутреннее расположение. Перевод сохраняет образ сердца и не превращает добровольный отклик в обязательный сбор.
- source_word: יְבִיאֶהָ
  choice: пусть … принесёт
  rationale: Форма обозначает ожидаемое действие, а местоименный суффикс отсылает к приношению. Конструкция с «пусть» естественно согласуется с добровольностью контекста.
- source_word: זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: золото, серебро и бронзу
  rationale: Первые два материала переданы прямо; נְחֹשֶׁת в перечнях материалов скинии традиционно и контекстуально передаётся как «бронза», хотя слово может обозначать также медь.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит личное имя Бога. Передача «Яхве» сохраняет его как имя завета, не подменяя титулом.
- issue: Добровольность приношения
  choice: кого побуждает сердце
  alternative: щедрый сердцем
  rationale: Выбранная формулировка сохраняет внутреннюю добровольную готовность и не сужает смысл до одной лишь щедрости как устойчивого качества.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; сохранены образ сердца, добровольный характер приношения и повтор имени Яхве.
