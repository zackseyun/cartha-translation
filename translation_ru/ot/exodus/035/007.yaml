  text: и окрашенные в красный цвет бараньи шкуры, и кожи тахашей[a], и древесину акации.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Значение еврейского слова תְּחָשִׁים (тахаши) неясно; его понимают, в частности, как обозначение особого вида выделанной кожи либо шкур морских коров, дюгоней, дельфинов или коз.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: окрашенные в красный цвет бараньи шкуры
  rationale: Форма מְאָדָּמִים выражает результат обработки — шкуры сделаны красными; «окрашенные в красный цвет» естественно передаёт это без уточнения не названного в тексте способа окраски.
- source_word: עֹרֹת תְּחָשִׁים
  choice: кожи тахашей
  rationale: Значение תְּחָשִׁים достоверно не установлено. Транслитерация сохраняет предметную отсылку и не выдаёт спорное определение животного за несомненное; основные варианты объяснены в сноске.
- source_word: עֲצֵי שִׂטִּים
  choice: древесину акации
  rationale: Устойчивое и понятное современному читателю обозначение материала из дерева, называемого שִׁטָּה.
