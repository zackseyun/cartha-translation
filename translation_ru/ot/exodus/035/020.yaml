  text: И всё общество сынов Израиля вышло от Моисея.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: И ... вышло
  rationale: Форма wayyiqtol продолжает последовательное повествование. Союз «И» естественно передаёт связь с предыдущим контекстом, а «вышло» сохраняет прямое пространственное значение יצא.
- source_word: כָּל עֲדַת
  choice: всё общество
  rationale: כָּל указывает на совокупность целиком, а עֵדָה обозначает собранную общину Израиля. «Всё общество» звучит естественно и сохраняет корпоративный смысл.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Буквальное выражение «сыны Израиля» в современном русском звучит архаично; «сынов Израиля» внутри сочетания «общество сынов Израиля» точно сохраняет мужской термин בְּנֵי и родовое имя Израиля.
- source_word: מִלִּפְנֵי
  choice: от
  rationale: В данном контексте еврейская пространственная идиома означает удаление от присутствия Моисея. Русское «вышло от Моисея» передаёт этот смысл естественно, без неясного буквализма «от лица Моисея».
- source_word: מֹשֶׁה
  choice: Моисея
  rationale: Нормативная русская форма имени מֹשֶׁה в родительном падеже после предлога «от».
