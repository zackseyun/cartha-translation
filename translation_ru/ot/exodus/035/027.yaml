  text: Вожди же принесли камни оникса[a] и камни для вставки в оправы — для эфода и нагрудного украшения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «камни шохама»; точный вид этого драгоценного камня неизвестен. «Оникс» — традиционный перевод.'
