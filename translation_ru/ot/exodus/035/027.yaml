lexical_decisions:
- source_word: וְהַנְּשִׂאִם
  choice: А вожди
  rationale: נְשִׂיאִים обозначает глав общины или племенных предводителей. «Вожди» ясно передаёт руководящее положение и не подразумевает царского происхождения, как могло бы слово «князья».
- source_word: הֵבִיאוּ
  choice: принесли
  rationale: Каузативная форма глагола בוא здесь имеет обычное значение «принесли» в контексте пожертвований для святилища.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: камни оникса[a]
  rationale: Традиционное соответствие שֹׁהַם — «оникс», однако точный вид минерала неизвестен; неопределённость отмечена в сноске.
- source_word: אַבְנֵי הַמִּלֻּאִים
  choice: камни для оправы
  rationale: מִלֻּאִים в ювелирном контексте указывает на закрепление или вставку камней. «Для оправы» естественно выражает их назначение, не воспроизводя неясную буквальную формулу «камни наполнения».
- source_word: לָאֵפֹד
  choice: для эфода
  rationale: אֵפֹד — особое священническое облачение; традиционная транслитерация сохраняет специальный культовый термин, не имеющий точного русского эквивалента.
- source_word: וְלַחֹשֶׁן
  choice: и нагрудника[b]
  rationale: חֹשֶׁן обозначает носимый на груди священнический предмет, прикреплённый к эфоду. «Нагрудник» естественнее и точнее, чем «наперсник» для современного читателя, и не создаёт образа воинского доспеха.
