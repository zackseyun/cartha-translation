  text: So the men came with the women[a]. Everyone whose heart was willing brought brooches, earrings, rings, and ornaments—all kinds of gold jewelry[b]. And every man who presented a wave offering of gold to Yahweh did so.
translation:
  language: ru
  text: И пришли мужчины вместе с женщинами[a]. Все, чьё сердце было расположено, принесли застёжки, серьги, кольца и украшения — всевозможные золотые изделия[b]. И каждый мужчина возносил Яхве золото как приношение возношения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально: «мужчины на/над женщинами». Это трудный идиоматический оборот; вероятно, он означает, что мужчины пришли вместе с женщинами или в дополнение к ним.'
    reason: alternative_reading
  - marker: b
    text: Точное значение некоторых названий украшений неизвестно. «Застёжки» могли быть пряжками или кольцами, «серьги» — также носовыми кольцами, а последнее слово могло обозначать особый вид подвески или браслета.
    reason: lexical_alternative
