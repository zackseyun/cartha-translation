- source_word: כָּל כְּלִי זָהָב
  choice: всевозможные золотые изделия
  rationale: כְּלִי — широкое обозначение предмета или изделия; такой перевод точнее исходного, чем ограничение значения только ювелирными украшениями.
- source_word: וְכָל אִישׁ
  choice: И каждый мужчина
  rationale: Сохраняет выраженную в еврейском тексте форму אִישׁ и её мужское значение.
- source_word: הֵנִיף תְּנוּפַת זָהָב
  choice: возносивший золото как приношение
  rationale: Сохраняет ритуальный образ поднятия или возношения дара и одновременно ясно передаёт его функцию как приношения.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя сохранено в основном тексте.
- issue: Ритуальное значение תְּנוּפָה
