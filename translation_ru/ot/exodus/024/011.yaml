  yaml_path: translation/ot/exodus/024/011.yaml
  text: But he did not stretch out his hand against the nobles of the sons of Israel; they saw God[a], and they ate and drank.
translation:
  language: ru
  text: Но Он не простёр руки против знатных из сынов Израиля; они увидели Бога[a], ели и пили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «созерцали Бога»; этот глагол может также означать «взирать на Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: на
  rationale: 'В сочетании с выражением «поднять руку» предлог передаёт направленность враждебного действия: Бог не поразил их.'
- source_word: אֲצִילֵי
  choice: знатных людей
  rationale: Слово обозначает видных, особо уважаемых представителей народа; «знатные люди» понятно современному читателю и не сужает значение до официальной должности.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранено родственное обозначение народа, непосредственно отражающее еврейское выражение.
- source_word: שָׁלַח יָדוֹ
  choice: не поднял руки
  rationale: Русское выражение естественно передаёт образ направленной руки и подразумеваемую угрозу удара или суда, не заменяя метафору прямым «не поразил».
- source_word: וַיֶּחֱזוּ
  choice: увидели
  rationale: Глагол означает видеть, созерцать или взирать. «Увидели» ясно и прямо передаёт утверждение текста, а более интенсивный оттенок отмечен в сноске.
- source_word: אֶת הָאֱלֹהִים
  choice: Бога
  rationale: Определённая форма указывает на Бога Израиля; в русском языке имя «Бог» в таком употреблении не требует артиклевой передачи.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: ели и пили
  rationale: Простая последовательность действий передана кратко и естественно, без ослабления поразительного сочетания боговидения и трапезы.
theological_decisions:
- issue: Подлежащее при выражении «не поднял руки»
  choice: Местоимение «Он» указывает на Бога как подразумеваемое подлежащее.
  alternative: Оставить подлежащее невыраженным или прямо повторить «Бог».
  rationale: В еврейском тексте подлежащее подразумевается, а контекст однозначно указывает на Бога. Местоимение проясняет синтаксис, не добавляя нового богословского утверждения.
- issue: Характер встречи с Богом
  choice: «Они увидели Бога»
  alternative: «Они увидели явление Бога» или «они созерцали Бога».
  rationale: Исходный текст прямо говорит, что они увидели Бога. Добавление слова «явление» преждевременно снимало бы богословское напряжение с другими местами Писания; вариант «созерцали» сохранён как лексическая возможность в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Выражение «поднял руки на» естественно передаёт угрозу удара; прямое «увидели Бога» сохраняет намеренную богословскую напряжённость исходного текста.
