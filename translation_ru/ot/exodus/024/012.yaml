  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲלֵ֥ה אֵלַ֛/י הָ/הָ֖רָ/ה וֶ/הְיֵה שָׁ֑ם וְ/אֶתְּנָ֨ה לְ/ךָ֜ אֶת לֻחֹ֣ת הָ/אֶ֗בֶן וְ/הַ/תּוֹרָה֙ וְ/הַ/מִּצְוָ֔ה אֲשֶׁ֥ר כָּתַ֖בְתִּי לְ/הוֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/012.yaml
  text: Then Yahweh said to Moses[a], “Come up to me on the mountain and remain there, and I will give you the stone tablets, and the law and the commandment[b], which I have written for their instruction.”
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Поднимись ко Мне на гору и оставайся там. Я дам тебе каменные скрижали, закон[a] и заповедь[b], которые Я написал, чтобы наставлять их».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставление» или «учение». Еврейское слово тора часто означает наставление или учение, а не только закон как совокупность предписаний.'
    reason: lexical_alternative
  - marker: b
    text: Слова «закон и заповедь» могут обозначать дополнительные наставления завета наряду со скрижалями или пояснять, что именно написано на скрижалях.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога общепринятой русской транслитерацией, не заменяя его титулом.
- source_word: עֲלֵה אֵלַי הָהָרָה
  choice: Поднимись ко Мне на гору
  rationale: Сохраняет повеление, направление движения к говорящему и движение на гору; формулировка естественна для современного русского языка.
- source_word: וֶהְיֵה שָׁם
  choice: и оставайся там
  rationale: В данном контексте выражение означает не только прибытие, но и продолжительное пребывание.
- source_word: לֻחֹת הָאֶבֶן
  choice: каменные скрижали
  rationale: «Скрижали» — ясное и укоренившееся русское обозначение каменных табличек завета.
- source_word: וְהַתּוֹרָה
  choice: закон
  rationale: В синайском контексте «закон» узнаваем и уместен, тогда как более широкое значение «наставление, учение» отмечено в сноске.
- source_word: וְהַמִּצְוָה
  choice: заповедь
  rationale: Сохраняет единственное число еврейского существительного и традиционное значение слова.
- source_word: אֲשֶׁר כָּתַבְתִּי
  choice: которые Я написал
  rationale: Передаёт завершённость божественного написания и оставляет относительное предложение соотнесённым с предшествующим рядом предметов.
- source_word: לְהוֹרֹתָם
  choice: чтобы наставлять их
  rationale: Передаёт целевое значение инфинитива породы hifil и местоименный суффикс третьего лица множественного числа, относящийся к народу Израиля.
theological_decisions:
- issue: Отношение слов «закон и заповедь» к каменным скрижалям
  choice: 'Сохранить последовательность однородных существительных: «каменные скрижали, закон и заповедь».'
  alternative: Понять «закон и заповедь» как пояснение содержания скрижалей либо свести все выражение только к Десяти заповедям.
  rationale: Еврейский текст соединяет существительные союзами и не требует однозначно решать, обозначают ли они отдельные наставления или поясняют содержание скрижалей.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Личное имя передано как «Яхве»; местоимение, относящееся к Богу, написано с прописной буквы. Синтаксис сохраняет координацию еврейского оригинала и его смысловую неоднозначность.
