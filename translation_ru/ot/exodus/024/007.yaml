base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/007.yaml
  text: Then he took the Book of the Covenant and read it in the hearing of the people[a], and they said, “All that Yahweh has spoken we will do, and we will obey.”
translation:
  language: ru
  text: 'Затем он взял Книгу Завета и прочитал её вслух народу. Они сказали: «Всё, что сказал Яхве, исполним и будем слушать[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и будем слушаться». Еврейский глагол может означать как «слышать, слушать», так и, особенно в контексте завета, «слушаться, повиноваться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Затем он взял
  rationale: Последовательная форма wayyiqtol продвигает повествование; «затем» естественно передаёт переход к следующему действию, не добавляя нового смысла.
- source_word: סֵפֶר הַבְּרִית
  choice: Книгу Завета
  rationale: «Книга» сохраняет конкретный образ письменного документа, а прописные буквы указывают на определённый, известный из контекста заветный документ.
- source_word: וַיִּקְרָא בְּאָזְנֵי הָעָם
  choice: прочитал её вслух народу
  rationale: При письменном документе קרא означает «читать», а выражение «в уши народа» указывает на публичное чтение вслух. Русская формулировка естественна и сохраняет оба элемента.
- source_word: כֹּל אֲשֶׁר דִּבֶּר יְהוָה
  choice: Всё, что сказал Яхве
  rationale: Передаёт полноту כֹּל אֲשֶׁר и естественно соотносит совершенное действие דִּבֶּר с уже возвещёнными словами.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: נַעֲשֶׂה
  choice: исполним
  rationale: В данном контексте «исполним» естественнее буквального «сделаем» применительно ко всему сказанному и сохраняет смысл практического осуществления требований завета.
- source_word: וְנִשְׁמָע
  choice: и будем слушать
  rationale: שׁמע охватывает буквальное слушание и обусловленное им послушание. «Будем слушать» сохраняет слуховой образ в контексте чтения завета и не устраняет смысловую многозначность.
theological_decisions:
- issue: Смысл заветного ответа וְנִשְׁמָע
  choice: и будем слушать
  alternative: и будем слушаться / и будем повиноваться
  rationale: В контексте завета שׁמע может обозначать послушание, но его основное слуховое значение также актуально, поскольку слова только что читались народу. Основной текст сохраняет эту напряжённость, а сноска прямо указывает на заветный оттенок послушания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка ясна обычному читателю; буквальная еврейская идиома «в уши народа» заменена естественным «вслух народу». Сноска поставлена непосредственно после спорного выражения.
