  text: וַ/יִּכְתֹּ֣ב מֹשֶׁ֗ה אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וַ/יַּשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וַ/יִּ֥בֶן מִזְבֵּ֖חַ תַּ֣חַת הָ/הָ֑ר וּ/שְׁתֵּ֤ים עֶשְׂרֵה֙ מַצֵּבָ֔ה לִ/שְׁנֵ֥ים עָשָׂ֖ר שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/004.yaml
  text: And Moses wrote down all the words of Yahweh[a]. He rose early in the morning and built an altar at the foot of the mountain[b], and twelve pillars for the twelve tribes of Israel.
translation:
  language: ru
  text: Моисей записал все слова Яхве. Рано утром он встал, соорудил жертвенник у подножия горы[a] и поставил двенадцать каменных столбов[b] — по числу двенадцати племён Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «под горой», то есть у её основания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вертикально поставленных камней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: записал
  rationale: Глагол כתב означает «писать»; «записал» естественно передаёт фиксацию ранее произнесённых слов.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: все слова Яхве
  rationale: «Слова» сохраняет прямое значение דְּבָרִים, не сужая его до «заповедей»; тетраграмматон передан личным именем «Яхве».
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: Рано утром он встал
  rationale: Порода хифиль глагола שׁכם выражает ранний подъём, а בַּבֹּקֶר явно указывает на утро.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: соорудил жертвенник
  rationale: Передаёт обычное сочетание בנה с מִזְבֵּחַ естественным и достойным русским выражением.
- source_word: תַּחַת הָהָר
  choice: у подножия горы
  rationale: Буквально «под горой»; в данном пространственном контексте имеется в виду место внизу, у основания горы.
- source_word: וּשְׁתֵּים עֶשְׂרֵה מַצֵּבָה
  choice: и поставил двенадцать каменных столбов
  rationale: מַצֵּבָה обозначает вертикально установленный камень или столб. Глагол «поставил» восстановлен по смыслу эллиптической еврейской конструкции; «каменных» уточняет материальный образ термина, не превращая столбы в сооружённые колонны.
- source_word: לִשְׁנֵים עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: по числу двенадцати племён Израиля
  rationale: 'Предлог ל выражает соответствие: двенадцать столбов соотносятся с двенадцатью племенами.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Значение двенадцати столбов
  choice: по числу двенадцати племён Израиля
  alternative: для двенадцати племён Израиля; представлявшие двенадцать племён Израиля
  rationale: Формулировка передаёт соответствие, выраженное предлогом ל, не уточняя сверх текста ритуальную или богословскую функцию столбов.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным для русского текста; подлежащее при эллиптическом втором объекте выражено глаголом «поставил». Все маркеры сносок присутствуют в основном тексте.
