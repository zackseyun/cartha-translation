  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְסַפֵּ֤ר לָ/עָם֙ אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וְ/אֵ֖ת כָּל הַ/מִּשְׁפָּטִ֑ים וַ/יַּ֨עַן כָּל הָ/עָ֜ם ק֤וֹל אֶחָד֙ וַ/יֹּ֣אמְר֔וּ כָּל הַ/דְּבָרִ֛ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/003.yaml
  text: Then Moses came and told the people all the words of Yahweh and all the ordinances[a], and all the people answered with one voice and said, “All the words that Yahweh has spoken we will do.”
translation:
  language: ru
  text: 'Моисей пришёл и передал народу все слова Яхве и все правовые постановления[a]. Тогда весь народ ответил в один голос: «Всё, что сказал Яхве, мы исполним».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «установления»; еврейское мишпати́м обозначает правовые нормы, постановления и решения в рамках завета.'
    reason: Лексическая альтернатива поясняет юридический оттенок מִשְׁפָּטִים.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Моисей пришёл
  rationale: Глагол בוא означает «приходить»; последовательная форма с וַ продолжает повествование, что естественно передаётся порядком предложений без обязательного отдельного «тогда».
- source_word: וַיְסַפֵּר
  choice: передал народу
  rationale: Пиэль глагола ספר здесь означает рассказать или сообщить. «Передал» естественно выражает сообщение народу всего ранее сказанного Яхве.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: все слова Яхве
  rationale: Сохраняется конкретное «слова», а не более узкое «заповеди», и личное имя יהוה передаётся как «Яхве».
- source_word: הַמִּשְׁפָּטִים
  choice: установления
  rationale: В контексте завета מִשְׁפָּטִים обозначает правовые постановления. «Установления» звучит естественно по-русски и не сужает значение до судебных приговоров.
- source_word: וַיַּעַן כָּל הָעָם קוֹל אֶחָד
  choice: Весь народ единодушно ответил
  rationale: Буквально «ответил весь народ одним голосом»; «единодушно» естественно передаёт идиому קוֹל אֶחָד и подчёркивает общий согласный ответ.
- source_word: כָּל הַדְּבָרִים אֲשֶׁר דִּבֶּר יְהוָה
  choice: Всё, что сказал Яхве
  rationale: Русское «всё, что сказал» естественно сохраняет полноту כָּל и смысловую связь между словами Яхве и ответом народа.
- source_word: נַעֲשֶׂה
  choice: мы исполним
  rationale: 'Форма от עשה буквально выражает действие: «сделаем». В отношении сказанных установлений «исполним» ясно передаёт обещание осуществить их, не заменяя его более интерпретирующим «будем повиноваться».'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон, поэтому сохраняется личное имя Бога в принятой научной передаче «Яхве», а не заменяется титулом.
- issue: Характер ответа народа
  choice: «мы исполним»
  alternative: «будем повиноваться»
  rationale: Перевод сохраняет прямое значение עשה и обещание народа совершить всё сказанное, не добавляя отдельного понятия послушания, хотя оно подразумевается контекстом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка упрощён ради ясности; повтор «и… и… и» не воспроизводится механически. Формула «единодушно ответил» естественно передаёт еврейское «одним голосом».
