  text: וְ/אֶל מֹשֶׁ֨ה אָמַ֜ר עֲלֵ֣ה אֶל יְהוָ֗ה אַתָּה֙ וְ/אַהֲרֹן֙ נָדָ֣ב וַ/אֲבִיה֔וּא וְ/שִׁבְעִ֖ים מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וְ/הִשְׁתַּחֲוִיתֶ֖ם מֵ/רָחֹֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/001.yaml
  text: Then he said to Moses[a], “Come up to Yahweh, you and Aaron, Nadab and Abihu, and seventy of the elders of Israel, and bow down from a distance.”
translation:
  language: ru
  text: 'Затем Он сказал Моисею[a]: «Поднимись к Яхве — ты, Аарон, Надав, Авиуд и семьдесят из старейшин Израиля — и поклонитесь издали».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально порядок слов в еврейском тексте: «А Моисею Он сказал». Далее говорящий, судя по контексту, — Яхве, однако Он говорит: «Поднимись к Яхве». В еврейском тексте первое повеление стоит в единственном числе, а «поклонитесь» — во множественном. Некоторые переводы сглаживают необычную формулировку: «поднимитесь ко Мне» или «предстаньте перед Яхве».'
    reason: Сохранение необычной формулировки, а также различия между единственным и множественным числом повелений в еврейском тексте.
lexical_decisions:
- source_word: וְאֶל מֹשֶׁה אָמַר
  choice: Затем Он сказал Моисею
  rationale: Конструкция открывает новую, связанную с предыдущим контекстом речь. В русском естественно назвать косвенное дополнение после сказуемого; местоимение «Он» восполняет невыраженное подлежащее из контекста. Прописная буква указывает на Бога как говорящего.
- source_word: עֲלֵה
  choice: Поднимитесь
  rationale: Императив עלה означает движение вверх. Форма множественного числа в русском согласована со всем перечисленным кругом призванных, хотя в еврейском стоит единственное число, непосредственно обращённое к Моисею, а остальные добавлены перечислением.
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Предлог אֶל передаёт направленность «к», а личное имя יהוה транслитерируется как «Яхве». Необычная речь Бога о Яхве в третьем лице сохранена, а не сглажена до «ко Мне».
- source_word: אַתָּה וְאַהֲרֹן נָדָב וַאֲבִיהוּא
  choice: ты, Аарон, Надав, Авиуд
  rationale: Явное местоимение начинает и подчёркивает перечень. Имена переданы в традиционной русской библейской форме.
- source_word: וְשִׁבְעִים מִזִּקְנֵי יִשְׂרָאֵל
  choice: и семьдесят из старейшин Израиля
  rationale: 'Предлог מִן имеет разделительное значение: речь идёт о семидесяти из числа старейшин, а не просто о семидесяти старейшинах.'
- source_word: וְהִשְׁתַּחֲוִיתֶם
  choice: и поклонитесь
  rationale: Глагол обозначает почтительное склонение или простирание. «Поклонитесь» естественно по-русски и сохраняет как телесный, так и религиозный оттенок, не уточняя позу сверх источника.
- source_word: מֵרָחֹק
  choice: издали
  rationale: Наречие ясно и кратко передаёт требование сохранять пространственную дистанцию.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблено собственное заветное имя Бога. Форма «Яхве» наиболее вероятно передаёт его произношение и отличает имя от титула.
- issue: Необычная формула, в которой Бог говорит «к Яхве»
  choice: Сохранить «к Яхве» в основном тексте
  alternative: ко Мне; предстаньте перед Яхве
  rationale: Источник прямо говорит אֶל יְהוָה. Замена устранила бы реальную повествовательную и богословскую напряжённость, которую сам еврейский текст не разъясняет.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Тире выделяют перечень участников и облегчают восприятие длинного повеления. Традиционные формы имён «Надав» и «Авиуд» сохранены для узнаваемости; архаизмы сведены к минимуму.
