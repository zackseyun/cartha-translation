revisions:
- from: И слава Яхве пребывала на горе Синай, и облако покрывало её[a] шесть дней. На седьмой день Он воззвал к Моисею из среды облака[b].
  to: И слава Яхве поселилась на горе Синай, и облако покрывало её[a] шесть дней. На седьмой день Яхве позвал Моисея из облака[b].
  rationale: Перевод уточнён в сторону современного литературного русского и более точного отражения еврейских глаголов. «Поселилась» передаёт установившееся присутствие, выраженное שכן; «позвал» остаётся нейтральным соответствием קרא. Имя Яхве повторено, чтобы ясно обозначить подразумеваемого говорящего. Сноска a сохраняет подлинно возможную, хотя и менее вероятную, связь суффикса со «славой».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:01:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: слава Яхве связана с горой Синай, облако покрывает наиболее вероятно гору в течение шести дней, а на седьмой день Яхве обращается к Моисею из облака. Однако «пребывала» несколько сглаживает повествовательное значение וַיִּשְׁכֹּן («поселилась/утвердилась, пребывая»), а «воззвал» сильнее, чем нейтральное וַיִּקְרָא («позвал»).'
  naturalness: «Из среды облака» понятно, но для современного литературного русского менее естественно, чем «из облака». Повторное называние Яхве в последнем предложении устраняет нежелательную русскую двусмысленность, при которой «Он» после слова «облако» может быть воспринято как относящееся к облаку.
  terminology: «Слава Яхве», «гора Синай» и «облако» удачны. Имя Яхве последовательно сохранено. «Поселилась» передаёт שכן без архаизации и без сведения значения к простому длительному состоянию.
  issues:
  - severity: medium
    issue: Видовое значение «пребывала»
    rationale: Форма וַיִּשְׁכֹּן — повествовательная форма, обозначающая установление пребывания славы на горе. «Пребывала» передаёт лишь уже длящееся состояние. «Поселилась» естественно передаёт начало устойчивого присутствия.
  - severity: low
    issue: «Воззвал» вместо нейтрального «позвал»
    rationale: וַיִּקְרָא означает «позвал/призвал». «Воззвал» допустимо, но добавляет оттенок торжественного громкого возглашения, отсутствующий в самом глаголе.
  - severity: low
    issue: Не вполне естественное «из среды облака»
    rationale: Оборот «из среды» обычно относится к людям или множеству предметов. «Из облака» естественно выражает исход речи из внутреннего пространства облака; вариант «изнутри облака» можно оставить в сноске.
