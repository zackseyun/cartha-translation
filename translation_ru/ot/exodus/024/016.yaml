base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/016.yaml
  text: And the glory of Yahweh settled on Mount Sinai[a], and the cloud covered it for six days[b]. On the seventh day he called to Moses from the midst of the cloud.
translation:
  language: ru
  text: И слава Яхве поселилась на горе Синай, и облако покрывало её[a] шесть дней. На седьмой день Яхве позвал Моисея из облака[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «облако покрывало славу Яхве», если местоименный суффикс относится к «славе», а не к горе Синай.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «изнутри облака».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: пребывала
  rationale: Глагол שכן обозначает установившееся присутствие или пребывание. «Пребывала» естественно и достойно передаёт продолжительное присутствие славы на горе, не прибегая к архаичному «обитала» и не добавляя образа движения, которого нет в самом глаголе.
- source_word: כְּבוֹד יְהוָה
  choice: слава Яхве
  rationale: כבוד здесь обозначает явленное величие и присутствие Бога; конструкция принадлежности естественно передаётся русским родительным падежом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя, переданное тетраграмматоном, сохраняется в транслитерации, а не заменяется титулом.
- source_word: עַל הַר סִינַי
  choice: на горе Синай
  rationale: Прямое и естественное обозначение местонахождения в современном русском языке.
- source_word: וַיְכַסֵּהוּ
  choice: покрывало её
  rationale: Местоименный суффикс мужского рода в еврейском тексте, вероятнее всего, относится к горе Синай. В русском «гора» женского рода, поэтому употреблено «её». Несовершенный вид передаёт состояние, продолжавшееся шесть дней; неоднозначность референта отмечена в сноске.
- source_word: הֶעָנָן
  choice: облако
  rationale: Определённое существительное указывает на уже известное из контекста облако богоявления.
- source_word: שֵׁשֶׁת יָמִים
  choice: шесть дней
  rationale: Русская форма длительности не требует дополнительного предлога и точно передаёт еврейский винительный времени.
- source_word: וַיִּקְרָא
  choice: Он воззвал
  rationale: «Воззвал» передаёт обращённый к Моисею призыв и сохраняет возвышенный, но понятный повествовательный регистр. Местоимение сохраняет невыраженный в еврейской форме субъект, понимаемый из контекста как Яхве.
- source_word: אֶל מֹשֶׁה
  choice: к Моисею
  rationale: Нормальное русское управление с глаголом «воззвать».
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: На седьмой день
  rationale: Естественное русское временное выражение, сохраняющее определённое порядковое числительное.
- source_word: מִתּוֹךְ הֶעָנָן
  choice: из среды облака
  rationale: מתוך указывает на исход из внутреннего пространства. «Из среды облака» сохраняет пространственную выразительность оригинала; более разговорный вариант указан в сноске.
theological_decisions:
- issue: Кто подразумевается как субъект глагола «воззвал»
  choice: Яхве, обозначенный местоимением «Он»
  alternative: «Слава Яхве» как метонимическое обозначение говорящего
  rationale: Ход повествования и контекст синайского богоявления указывают на Яхве как говорящего. Местоимение сохраняет краткость еврейского текста и не вводит в основной текст повторения имени.
- issue: К чему относится суффикс в וַיְכַסֵּהוּ
  choice: К горе Синай
  alternative: К славе Яхве
  rationale: Контекстуальная картина облака, покрывающего гору, делает гору наиболее вероятным референтом, однако грамматика допускает отнесение суффикса к «славе», поэтому альтернативное понимание сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Имя Яхве передано прямо; синтаксис остаётся ясным для обычного читателя. Подлинная неоднозначность местоименного суффикса не устранена молча, а отражена в сноске.
