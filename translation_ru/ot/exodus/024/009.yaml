  text: Then Moses went up, and Aaron, Nadab, Abihu, and seventy of the elders of Israel.
translation:
  language: ru
  text: Тогда Моисей поднялся вместе с Аароном, Надавом, Авиудом и семьюдесятью старейшинами Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Глагол עלה выражает движение вверх. «Поднялся» естественно по-русски передаёт направление, не добавляя прямо не названное в стихе слово «гора».
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: וְאַהֲרֹן
  choice: вместе с Аароном
  rationale: Еврейский союз координирует Аарона с Моисеем как участника восхождения; русская конструкция «вместе с» ясно и естественно показывает совместное действие.
- source_word: נָדָב
  choice: Надавом
  rationale: Устоявшаяся русская передача имени; творительный падеж обусловлен конструкцией «вместе с».
- source_word: וַאֲבִיהוּא
  choice: Авиудом
  rationale: Устоявшаяся русская библейская форма имени; творительный падеж обусловлен конструкцией «вместе с».
- source_word: וְשִׁבְעִים
  choice: и семьюдесятью
  rationale: Сохраняется количественное значение и сочинительная связь перечисления; падеж согласован с русской конструкцией совместности.
- source_word: מִזִּקְנֵי
  choice: старейшинами
  rationale: 'זָקֵן здесь обозначает представителей руководства народа, а מן имеет партитивный смысл: семьдесят человек из числа старейшин. В русском это естественно выражается числительным с существительным без отдельного предлога.'
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Устоявшееся название народа; родительный падеж обозначает принадлежность старейшин Израилю.
