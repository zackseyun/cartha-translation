base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/005.yaml
  text: And he sent the young men of the sons of Israel[b][a], and they offered up burnt offerings and sacrificed peace offerings of bulls to Yahweh.
translation:
  language: ru
  text: Он послал молодых людей из числа сынов Израиля[a], и они принесли всесожжения и принесли Яхве мирные жертвы из быков[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молодых израильтян».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жертвы общения» или «жертвы благополучия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал он
  rationale: Простая повествовательная передача глагола שׁלח; местоимение сохраняет связь с Моисеем из контекста, не добавляя его имени в сам стих.
- source_word: נַעֲרֵי בְּנֵי יִשְׂרָאֵל
  choice: молодых людей из сынов Израиля
  rationale: נַעַר передано как «молодой человек», а конструкция בְּנֵי יִשְׂרָאֵל сохранена достаточно близко к форме оригинала; более естественный собирательный вариант дан в сноске.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: принесли всесожжения
  rationale: Сочетание עלה с עֹלָה является жертвенным оборотом; «принесли всесожжения» ясно и естественно обозначает совершение этого вида жертвы.
- source_word: וַיִּזְבְּחוּ
  choice: закололи
  rationale: В культовом контексте זבח обозначает ритуальное заклание; выбранный глагол сохраняет конкретное действие, а жертвенный смысл выражен дальнейшим оборотом.
- source_word: זְבָחִים שְׁלָמִים
  choice: мирные жертвы
  rationale: «Мирные жертвы» — узнаваемое русское название данного вида жертв; возможные смысловые передачи сохранены в сноске.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано непосредственно как «Яхве», а дательный падеж естественно выражает адресата жертвоприношения.
- source_word: פָּרִים
  choice: быков
  rationale: Слово прямо называет жертвенных животных; оборот «быков как мирные жертвы» ясно связывает их с предшествующим видом жертвоприношения.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Передача выражения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Основной текст сохраняет грамматически мужскую и традиционную форму исходного выражения, тогда как более идиоматичный собирательный вариант отмечен в сноске.
- issue: Смысл жертв שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения; жертвы благополучия
  rationale: Еврейский термин допускает акцент на мире, благополучии и совместном жертвенном общении; основной вариант использует устоявшееся название, не устраняя альтернативные смысловые оттенки.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис близок к последовательности еврейского повествования, но формулировки остаются понятными современному читателю.
