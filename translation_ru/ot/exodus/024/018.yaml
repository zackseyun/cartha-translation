  text: Moses entered into the midst of the cloud and went up the mountain[a]. And Moses was on the mountain forty days and forty nights.
translation:
  language: ru
  text: Моисей вошёл внутрь облака[a] и поднялся на гору. Моисей был на горе сорок дней и сорок ночей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в середину облака» или «в облако». Еврейский текст подчёркивает, что Моисей вошёл в само облако.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: вошёл
  rationale: В данном контексте בוא обозначает движение внутрь облака; «вошёл» естественно и точно передаёт направленность.
- source_word: בְּתוֹךְ
  choice: в самую середину
  rationale: תּוֹךְ указывает на внутреннюю часть или середину. Добавление «самую» естественно подчёркивает, что Моисей вошёл внутрь самого облака.
- source_word: הֶעָנָן
  choice: облака
  rationale: Прямой перевод עָנָן с определённостью, заданной контекстом и артиклем; это уже упомянутое облако божественного присутствия.
- source_word: וַיַּעַל אֶל הָהָר
  choice: и поднялся на гору
  rationale: עלה передаёт движение вверх, а אֶל обозначает направление к цели; русское «поднялся на гору» естественно объединяет обе составляющие.
- source_word: וַיְהִי מֹשֶׁה בָּהָר
  choice: И пробыл Моисей на горе
  rationale: Хотя היה буквально означает «был», при указанной далее продолжительности русское «пробыл» ясно и естественно выражает пребывание в течение сорока дней и ночей, не предполагая ничего сверх контекста.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: сорок дней и сорок ночей
  rationale: Стандартная и точная русская передача еврейского выражения продолжительности.
theological_decisions:
- issue: Образ облака, связанного с божественным присутствием
  choice: облака
  alternative: густого облака
  rationale: В еврейском тексте стоит обычное עָנָן без прилагательного «густой»; перевод сохраняет образ, не расширяя его толкованием.
- issue: Степень подчёркивания вхождения Моисея внутрь облака
  choice: в самую середину облака
  alternative: в облако
  rationale: בְּתוֹךְ прямо обозначает внутренность или середину, поэтому основной текст сохраняет этот пространственный акцент.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Инверсия «пробыл Моисей» сохраняет достоинство повествования, оставаясь понятной современному читателю.
