lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: они увидели
  rationale: Прямо передаёт повествовательную форму глагола ראה и не смягчает утверждение о зрительном восприятии.
- source_word: אֵת אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Сохраняет прямой объект и определённое обозначение Бога, Которому принадлежит Израиль.
- source_word: וְתַחַת רַגְלָיו
  choice: и под Его ногами было
  rationale: Передаёт пространственное значение תחת и мужской суффикс; связка «было» естественно восполняет безглагольную еврейскую конструкцию.
- source_word: כְּמַעֲשֵׂה לִבְנַת
  choice: нечто подобное настилу
  rationale: Сравнительная конструкция описывает вид изготовленной, выложенной кирпичом или плиткой поверхности; «настил» естественнее, чем буквальное «изделие кирпича».
- source_word: הַסַּפִּיר
  choice: сапфир
  rationale: Сохраняет традиционное название камня, при этом неопределённость его древней минералогической идентификации отмечена в сноске.
- source_word: וּכְעֶצֶם הַשָּׁמַיִם
  choice: как само небо
  rationale: עֶצֶם здесь усиливает сравнение; «само небо» естественно передаёт значение «небо как таковое».
- source_word: לָטֹהַר
  choice: ясное
  rationale: В зрительном описании טֹהַר указывает на чистоту и прозрачную ясность; прилагательное связывает эту характеристику со всей увиденной поверхностью.
theological_decisions:
- issue: Антропоморфное видение Бога
  choice: Сохранено прямое утверждение «увидели Бога Израиля» и выражение «под Его ногами».
  alternative: «увидели явление Бога Израиля» или «увидели место, где стоял Бог Израиля»
  rationale: Еврейский текст прямо говорит, что они увидели Бога Израиля, и использует телесный образ Его ног. Перевод не снимает возникающее богословское напряжение посредством добавленного толкования.
translation_notes:
