  text: וְ/נִגַּ֨שׁ מֹשֶׁ֤ה לְ/בַדּ/וֹ֙ אֶל יְהוָ֔ה וְ/הֵ֖ם לֹ֣א יִגָּ֑שׁוּ וְ/הָ/עָ֕ם לֹ֥א יַעֲל֖וּ עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/002.yaml
  text: Moses alone shall come near to Yahweh[a], but they shall not come near, and the people shall not go up with him.
translation:
  language: ru
  text: Только Моисей пусть приблизится к Яхве; они пусть не приближаются, и народ пусть не поднимается вместе с ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִגַּשׁ
  choice: пусть приблизится
  rationale: Форма от נגשׁ передаёт приближение; в контексте предписаний естественная русская конструкция «пусть приблизится» сохраняет директивную силу.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная русская форма личного имени.
- source_word: לְבַדּוֹ
  choice: один
  rationale: 'Выражает исключительность: приблизиться разрешено только Моисею.'
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Предлог אֶל обозначает направленность к Богу, а личное имя יהוה передано как «Яхве».
- source_word: וְהֵם
  choice: они же
  rationale: Местоимение отсылает к названным в предыдущем стихе спутникам Моисея; частица «же» ясно передаёт противопоставление.
- source_word: לֹא יִגָּשׁוּ
  choice: пусть не приближаются
  rationale: Повтор того же русского глагола сохраняет лексическую связь и контраст с разрешением Моисею приблизиться.
- source_word: וְהָעָם
  choice: и народ
  rationale: Буквально передаёт עם без добавления отсутствующего в стихе уточнения «Израиля».
- source_word: לֹא יַעֲלוּ
  choice: пусть не поднимается
  rationale: עלה здесь описывает движение вверх, на гору; единственное число естественно согласуется с собирательным существительным «народ».
- source_word: עִמּוֹ
  choice: вместе с ним
  rationale: Передаёт совместность действия и однозначно отсылает к Моисею.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, а сноска сообщает традиционный вариант перевода.
- issue: Степень директивности форм יִגַּשׁוּ и יַעֲלוּ
  choice: пусть не приближаются / пусть не поднимается
  alternative: не приблизятся / не поднимется
  rationale: Контекст Божьих указаний поддерживает предписывающее значение; русская конструкция с «пусть» передаёт его без превращения высказывания в категорический императив.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Параллельные конструкции сохранены, а местоименное противопоставление передано естественно для русского синтаксиса.
