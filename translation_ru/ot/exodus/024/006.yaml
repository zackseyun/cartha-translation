lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное повествовательное значение לקח; русский глагол естественно передаёт последовательное действие.
- source_word: חֲצִי הַדָּם
  choice: половину крови
  rationale: Сохраняет партитивный смысл еврейской конструкции и ясно показывает разделение крови на две части.
- source_word: וַיָּשֶׂם
  choice: поместил
  rationale: Нейтрально передаёт широкий по значению глагол שׂים применительно к жидкости; буквальное «положил» по-русски здесь неестественно, а «налил» конкретизировало бы способ действия.
- source_word: בָּאַגָּנֹת
  choice: в чаши
  rationale: אַגָּנֹת обозначает сосуды для жидкости; «чаши» — понятное и уместное в культовом контексте соответствие без излишней конкретизации формы.
- source_word: זָרַק
  choice: плеснул
  rationale: В контексте жертвоприношения глагол обозначает энергичное нанесение крови на жертвенник. «Плеснул» сохраняет физическую выразительность действия и не сводит его к лёгкому кроплению.
- source_word: עַל הַמִּזְבֵּחַ
  choice: на жертвенник
  rationale: Предлог עַל здесь указывает на поверхность, на которую была нанесена кровь; сочетание «плеснул на жертвенник» естественно по-русски.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма библейского имени.
theological_decisions:
- issue: Способ нанесения крови на жертвенник
  choice: плеснул на жертвенник
  alternative: окропил жертвенник; разбрызгал по жертвеннику
  rationale: Еврейский זָרַק допускает разные переводы в жертвенном контексте, но, вероятно, описывает более энергичное движение, чем обычно подразумевает русское «окропил». Выбор передаёт ритуальное действие без дополнительного догматического истолкования.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-торжественным повествовательным регистром. Местоимение «её» устраняет ненужное повторение, а параллель «половину… другую половину» сохраняет структуру исходного текста.
