  footnotes:
  - marker: a
    text: 'Или: «разбрызгал по жертвеннику»; также возможно: «окропил жертвенник». Еврейский глагол в описаниях жертвоприношений может передаваться по-разному; вариант в основном тексте подчёркивает энергичный характер действия.'
