  text: וַ/יַּ֥עַל מֹשֶׁ֖ה אֶל הָ/הָ֑ר וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/015.yaml
  text: Then Moses went up onto the mountain[a], and the cloud covered the mountain.
translation:
  language: ru
  text: Тогда Моисей поднялся на гору[a], и облако покрыло гору.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Моисей поднялся к горе». Еврейский повествовательный союз можно передать простым «и», а предлог — как «к» или, в сочетании с глаголом «поднялся», как «на».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: тогда… поднялся
  rationale: Глагол עלה означает движение вверх; «поднялся» естественно и точно передаёт его направленность. Союз וַ продвигает повествование и здесь передан словом «тогда».
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: אֶל־הָהָר
  choice: на гору
  rationale: При глаголе движения вверх предлог אֶל допускает значение направления «к» или, по контексту, движения «на» гору; основной вариант естественно передаёт восхождение.
- source_word: וַיְכַס
  choice: и… покрыло
  rationale: כסה прямо означает «покрывать»; форма согласуется с подлежащим «облако».
- source_word: הֶעָנָן
  choice: облако
  rationale: Определённое существительное указывает на уже известное из контекста облако; в русском языке его определённость выражается контекстом.
- source_word: אֵת
  choice: не переводится отдельно
  rationale: Показатель определённого прямого дополнения передаётся русским синтаксисом.
theological_decisions:
- issue: Природа облака
  choice: облако
  alternative: облако славы; облако Господа
  rationale: Еврейский текст называет только облако. Хотя контекст связывает его с Божьим присутствием, перевод не добавляет отсутствующих в стихе богословских уточнений.
translation_notes:
  register: Современный литературный русский язык; краткий и торжественно-сдержанный повествовательный стиль. Повтор слова «гора» сохранён вслед за еврейским текстом.
