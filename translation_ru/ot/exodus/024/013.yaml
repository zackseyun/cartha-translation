base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/013.yaml
  text: So Moses arose with Joshua his attendant[a], and Moses went up to the mountain of God.
translation:
  language: ru
  text: И встал Моисей с Иисусом, своим помощником[a], и взошёл Моисей на гору Божью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугой». Еврейское слово обозначает человека, который состоит при другом и служит ему; здесь речь, вероятно, идёт о личном помощнике Моисея.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Глагол קום в повествовательной форме обозначает, что Моисей поднялся, чтобы действовать дальше; «встал» естественно передаёт последовательность событий, не добавляя значения отправления.
- source_word: וִיהוֹשֻׁעַ
  choice: Иисус
  rationale: Использована укоренившаяся в русской библейской традиции форма имени Иисус (Навин); добавление «Навин» отсутствует в исходном тексте и здесь не требуется.
- source_word: מְשָׁרְתוֹ
  choice: своим помощником
  rationale: Причастие от שׁרת с местоименным суффиксом обозначает человека, состоящего при Моисее и служащего ему. «Помощник» ясно передаёт роль Иисуса, не создавая ассоциации с рабством или церковным служением.
- source_word: וַיַּעַל
  choice: взошёл
  rationale: Глагол עלה здесь обозначает движение вверх, на гору; «взошёл» точно и естественно передаёт пространственный смысл.
- source_word: הַר הָאֱלֹהִים
  choice: гору Божью
  rationale: Сочетание буквально обозначает «гору Бога». Русское «гора Божья» сохраняет принадлежность и сакральное значение без поясняющей конкретизации как Синай или Хорив.
theological_decisions:
- issue: Характер отношений Моисея и Иисуса в слове מְשָׁרְתוֹ
  choice: Иисус назван личным помощником Моисея.
  alternative: «слуга» или «служитель» Моисея
  rationale: Контекст указывает на служение при Моисее, но не уточняет социальный статус и не предполагает особой культовой должности. «Помощник» передаёт функцию, не привнося рабских либо институционально-религиозных оттенков.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным звучанием. Повтор имени «Моисей» сохранён вслед за еврейским текстом; союзная цепочка также передана без сглаживания структуры стиха.
