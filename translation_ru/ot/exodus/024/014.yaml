  text: וְ/אֶל הַ/זְּקֵנִ֤ים אָמַר֙ שְׁבוּ לָ֣/נוּ בָ/זֶ֔ה עַ֥ד אֲשֶׁר נָשׁ֖וּב אֲלֵי/כֶ֑ם וְ/הִנֵּ֨ה אַהֲרֹ֤ן וְ/חוּר֙ עִמָּ/כֶ֔ם מִי בַ֥עַל דְּבָרִ֖ים יִגַּ֥שׁ אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/014.yaml
  text: And to the elders he said[a], “Wait here for us until we return to you. And look, Aaron and Hur are with you. Whoever has a dispute, let him approach them.”
translation:
  language: ru
  text: 'Старейшинам же он сказал: «Ждите нас здесь, пока мы не вернёмся к вам. Вот, Аарон и Ор с вами. Если у кого есть спор[a], пусть обратится к ним».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «У кого есть судебное дело».'
    reason: Лексическая альтернатива для идиомы בַעַל דְּבָרִים, которая может обозначать спор, тяжбу или подлежащее разбирательству дело.
lexical_decisions:
- source_word: הַזְּקֵנִים
  choice: старейшинам
  rationale: Слово обозначает признанных старейшин и руководителей общины, а не просто пожилых мужчин.
- source_word: שְׁבוּ לָנוּ בָזֶה
  choice: ждите нас здесь
  rationale: Форма от ישׁב буквально выражает пребывание на месте; в данном повелении естественное русское «ждите нас здесь» передаёт требование оставаться до возвращения Моисея и его спутника.
- source_word: עַד אֲשֶׁר נָשׁוּב אֲלֵיכֶם
  choice: пока мы не вернёмся к вам
  rationale: Так естественно передаётся временная граница действия и значение שוב «вернуться».
- source_word: וְהִנֵּה
  choice: вот
  rationale: «Вот» сохраняет функцию привлечения внимания и звучит современно и достойно, без архаичности «се».
- source_word: עִמָּכֶם
  choice: с вами
  rationale: Прямо передаёт присутствие Аарона и Ора среди оставшихся старейшин.
- source_word: מִי בַעַל דְּבָרִים
  choice: у кого возникнет спор
  rationale: Идиома относится к человеку, имеющему тяжбу, претензию или судебное дело; «возникнет спор» ясно передаёт юридический контекст и не сужает значение до формально заведённого дела.
- source_word: יִגַּשׁ אֲלֵהֶם
  choice: пусть обратится к ним
  rationale: Имперфект имеет здесь побудительную силу. В контексте разрешения споров «обратится к ним» естественно передаёт обращение к назначенным руководителям, тогда как буквальное «подойдёт» может скрыть юридическую функцию.
theological_decisions:
- issue: Обобщённое единственное число в юридическом предписании
  choice: у кого возникнет спор, пусть обратится
  alternative: те, у кого возникнут споры, пусть обращаются
  rationale: Еврейский текст использует обобщённую конструкцию единственного числа מִי ... יִגַּשׁ. Русская форма «у кого… пусть обратится» сохраняет это число, оставаясь естественной и применимой к любому человеку.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Имена переданы в традиционной русской форме «Аарон» и «Ор». Частица «же» отражает переход к обращению Моисея к старейшинам; «вот» сохраняет дискурсивную силу וְהִנֵּה без архаизма.
