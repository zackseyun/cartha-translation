  terminology: «Старейшины», «Аарон» и «Ор» уместны; «Ор» соответствует традиционной русской передаче имени חוּר. «Спор» приемлем как основной эквивалент юридической идиомы, а сноска корректно уточняет альтернативу «судебное дело».
