base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/008.yaml
  text: Then Moses took the blood and threw it on the people[a], and said, “Behold[b], the blood of the covenant that Yahweh has made with you concerning all these words.”
translation:
  language: ru
  text: 'Тогда Моисей взял кровь и бросил её на народ[a], и сказал: «Вот кровь завета, который Яхве заключил с вами на основании всех этих слов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «окропил кровью народ». Еврейский глагол буквально означает «бросить», «кинуть», но в жертвенном контексте может обозначать ритуальное нанесение крови.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное повествовательное значение לקח; простой и естественный русский эквивалент.
- source_word: הַדָּם
  choice: кровь
  rationale: Речь идёт об уже упомянутой в контексте жертвенной крови; русское существительное естественно передаёт определённость без отдельного артикля.
- source_word: וַיִּזְרֹק עַל־הָעָם
  choice: окропил ею народ
  rationale: Глагол זרק буквально обозначает бросание или разбрасывание, но в данном жертвенном контексте описывает ритуальное нанесение крови. «Окропил» естественно и ясно по-русски; более конкретная образность еврейского слова отмечена в сноске.
- source_word: הִנֵּה
  choice: вот
  rationale: Передаёт указательно-предъявительное и торжественное значение частицы естественным современным русским словом.
- source_word: דַם הַבְּרִית
  choice: кровь завета
  rationale: Формально передаёт сопряжённую конструкцию и сохраняет её важную внутрибиблейскую формулировку.
- source_word: כָּרַת ... בְּרִית
  choice: заключил ... завет
  rationale: Нормальный русский эквивалент устойчивой еврейской идиомы «резать завет»; буквальный образ пояснён в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: עִמָּכֶם
  choice: с вами
  rationale: Точно передаёт предлог и суффикс второго лица множественного числа.
- source_word: עַל כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: на основании всех этих слов
  rationale: Передаёт связь завета со всеми только что провозглашёнными словами, не сужая דְּבָרִים до юридического термина «условия».
theological_decisions:
- issue: Передача идиомы כָּרַת ... בְּרִית
  choice: заключил ... завет
  alternative: 'буквально: «разрезал ... завет»'
  rationale: В русском буквальная калька не является понятной идиомой и может создать ложное предметное значение. Основной текст передаёт смысл, а сноска сохраняет доступ к образу оригинала, уместному в контексте жертвенной крови.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Связь завета с עַל כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: на основании всех этих слов
  alternative: относительно всех этих слов; согласно всем этим словам
  rationale: Предлог עַל допускает оттенки основания и отношения. Выбранная формулировка естественно связывает заключение завета с ранее произнесёнными словами, не превращая их исключительно в юридические «условия».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён до двух предложений ради ясности, при этом ключевые формулы «кровь завета» и личное имя «Яхве» сохранены.
