id: EXO.24.17
reference: Exodus 24:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/מַרְאֵה֙ כְּב֣וֹד יְהוָ֔ה כְּ/אֵ֥שׁ אֹכֶ֖לֶת בְּ/רֹ֣אשׁ הָ/הָ֑ר לְ/עֵינֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/017.yaml
  text: And the appearance of the glory of Yahweh was like a consuming fire on the top of the mountain in the sight of the sons of Israel[a][b].
translation:
  language: ru
  text: Вид славы Яхве был подобен пожирающему огню[a] на вершине горы, на глазах у сынов Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поглощающему огню».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «детей Израиля»; или: «израильтян».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה
  choice: вид
  rationale: Передаёт видимое явление, то, что предстало взору, не создавая впечатления пророческого видения.
- source_word: כְּבוֹד
  choice: слава
  rationale: В отношении Яхве обозначает Его явленное, воспринимаемое присутствие; «слава» — естественный и контекстуально точный русский эквивалент.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: כְּאֵשׁ אֹכֶלֶת
  choice: подобен пожирающему огню
  rationale: Сохраняет выраженное предлогом כְּ сравнение и образ огня, который «ест», то есть пожирает или поглощает.
- source_word: בְּרֹאשׁ הָהָר
  choice: на вершине горы
  rationale: Естественно и точно обозначает верхнюю часть горы.
- source_word: לְעֵינֵי
  choice: на глазах у
  rationale: Современная русская идиома сохраняет зрительный акцент исходного выражения «перед глазами».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально отражает мужской род и конструкцию исходного текста; более идиоматические собирательные варианты приведены в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: Исходный текст непосредственно употребляет тетраграмматон; транслитерация сохраняет личное заветное имя и не подменяет его титулом.
- issue: Передача заветного обозначения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: дети Израиля; израильтяне
  rationale: Основной текст сохраняет грамматически мужскую форму и традиционное заветное обозначение, а сноска отмечает естественные коллективные эквиваленты без изменения референта.
- issue: Характер явления славы
  choice: вид славы был подобен огню
  alternative: слава была огнём
  rationale: Сравнительная частица כְּ указывает на подобие; перевод не отождествляет славу Яхве с огнём и сохраняет различие между явлением и тем, чему оно уподоблено.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка близка к синтаксису оригинала, но естественна по-русски; «на глазах у» делает зрительный аспект ясным, а «сыны Израиля» сохраняет форму исходного заветного обозначения.
