base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/006.yaml
  text: And you shall place it before the veil that is before the ark of the testimony[a], before the mercy seat that is over the testimony[b], where I will meet with you.
translation:
  language: ru
  text: Поставь его перед завесой, которая перед ковчегом свидетельства[a], перед крышкой искупления[b], находящейся над свидетельством, — там Я буду встречаться с тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ковчег свидетельства». Традиционный вариант: «ковчег откровения».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «крышка очищения»; традиционный вариант — «престол милости». Это золотая крышка ковчега, над которой совершалось искупление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה אֹתוֹ
  choice: Поставь его
  rationale: נתן имеет широкое значение «дать, поместить, поставить»; в указании о размещении жертвенника естественно русское «поставь». Местоимение сохраняет связь с жертвенником из предыдущих стихов.
- source_word: לִפְנֵי
  choice: перед
  rationale: Повторяющийся предлог передан одинаково и пространственно ясно.
- source_word: הַפָּרֹכֶת
  choice: завеса
  rationale: «Завеса» — точный, понятный и укоренившийся русский термин для внутренней преграды святилища.
- source_word: אֲשֶׁר עַל אֲרֹן הָעֵדֻת
  choice: которая напротив ковчега Свидетельства
  rationale: Предлог עַל многозначен; здесь он описывает взаимное расположение завесы и ковчега. «Напротив» передаёт пространственную связь естественнее, чем буквальное и вводящее в заблуждение «над ковчегом».
- source_word: אֲרֹן הָעֵדֻת
  choice: ковчег Свидетельства
  rationale: עֵדוּת означает «свидетельство», а не прямо «завет». Заглавная буква показывает, что речь идёт об установленном священном обозначении содержимого ковчега.
- source_word: הַכַּפֹּרֶת
  choice: крышка искупления
  rationale: Слово обозначает золотую крышку ковчега и связано с корнем כפר, выражающим очищение/искупление. Перевод одновременно называет предмет и сохраняет его культовое значение.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: там Я буду встречаться с тобой
  rationale: Нифаль глагола יעד в данном контексте означает назначенную встречу. Наречие שָׁמָּה передано явно словом «там».
theological_decisions:
- issue: Передача культового термина הַכַּפֹּרֶת
  choice: крышка искупления
  alternative: крышка очищения; престол милости
  rationale: 'Основной текст не превращает предмет только в абстрактный символ и не навязывает узкое конфессиональное толкование: он сохраняет как предметное значение «крышка», так и связь термина с искуплением. Альтернативы указаны в примечании.'
- issue: Передача עֵדוּת в названии ковчега
  choice: Свидетельство
  alternative: откровение; завет
  rationale: Еврейский текст дважды употребляет עֵדוּת. «Свидетельство» сохраняет эту лексику и не подменяет её словом «завет», хотя в контексте речь идёт о скрижалях завета.
- issue: Место встречи Бога с Моисеем
  choice: там Я буду встречаться с тобой
  alternative: где Я буду встречаться с тобой
  rationale: Сохранено прямое утверждение текста о назначенном месте встречи без дополнительного объяснения характера Божьего присутствия.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Императив естественно передаёт силу древнееврейской формы предписания. Повтор «перед» сохранён ради структуры оригинала; тире перед заключительной фразой облегчает восприятие длинного пространственного описания.
