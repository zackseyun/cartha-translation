  text: You shall overlay it with pure gold—its top[a], its walls all around, and its horns—and you shall make for it a gold molding all around.
translation:
  language: ru
  text: 'И покрой его чистым золотом: его верх, его стенки со всех сторон и его рога; и сделай вокруг него золотой бортик[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «золотой венец». Еврейское зэр может означать бортик, обод, кайму или венцеобразное обрамление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ אֹתוֹ
  choice: и покрой его
  rationale: Глагол צפה в этой конструкции означает покрытие поверхности предмета металлом; русское «покрой» естественно передаёт золочение без идеи свободно лежащего покрова.
- source_word: זָהָב טָהוֹר
  choice: чистым золотом
  rationale: Устойчивый и ясный русский эквивалент для золота высокой чистоты.
- source_word: גַּגּוֹ
  choice: его верх
  rationale: Хотя גג обычно означает «крыша», применительно к небольшому жертвеннику речь идёт о верхней поверхности; «верх» здесь естественнее.
- source_word: קִירֹתָיו
  choice: его стенки
  rationale: Сохраняет предметное значение «стены», но уменьшительная форма естественна для стенок небольшого жертвенника.
- source_word: סָבִיב
  choice: со всех сторон / вокруг
  rationale: Оба выражения передают охватывающий характер действия и сохраняют двукратное употребление слова в еврейском тексте.
- source_word: קַרְנֹתָיו
  choice: его рога
  rationale: Сохранён буквальный культовый термин для выступов по углам жертвенника.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: и сделай вокруг него
  rationale: Предлог ל выражает отношение детали к жертвеннику; вместе с последующим סָבִיב естественный русский порядок слов — «сделай вокруг него».
- source_word: זֵר זָהָב
  choice: золотой бортик
  rationale: זֵר обозначает окружающую предмет выступающую кайму, обод или венцеобразное обрамление. «Бортик» ясно описывает физическую деталь и не вносит прежде времени царскую образность.
theological_decisions:
- issue: Передача терминов устройства священной утвари
  choice: Сохранить «рога», а זֵר передать как «бортик».
  alternative: Передать זֵר как «венец», «обод» или «кайма».
  rationale: Стих описывает устройство жертвенника, поэтому «рога» сохраняют установленную культовую терминологию, а «бортик» ясно обозначает конструктивную деталь. Возможное венцеобразное значение זֵר отмечено в сноске, не превращаясь в однозначное богословское толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством предписывающей речи. Синтаксический параллелизм и повтор охватывающего значения סָבִיב сохранены; терминология конкретна и понятна обычному читателю.
