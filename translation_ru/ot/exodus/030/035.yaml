  yaml_path: translation/ot/exodus/030/035.yaml
  text: And you shall make it into incense[a], a perfume blended by the work of a perfumer, salted, pure[c][b], holy.
translation:
  language: ru
  text: И приготовь из этого благовоние[a] — ароматную смесь, составленную по искусству составителя благовоний, посоленную[b], чистую и святую[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смесь для воскурения». Еврейское выражение обозначает тщательно составленное ароматическое благовоние.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «смешанную с солью», «приправленную солью».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «священную». В еврейском тексте здесь сказано «святую», а не «святое святых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתָהּ
  choice: И приготовь из этого
  rationale: В контексте предписания форма передаёт повеление. «Приготовь» естественно описывает изготовление сложной ароматической смеси, а «из этого» ясно отсылает к перечисленным в предыдущем стихе веществам.
- source_word: קְטֹרֶת
  choice: благовоние
  rationale: Слово обозначает священную ароматическую смесь, предназначенную для воскурения; «благовоние» — точный и укоренившийся русский эквивалент.
- source_word: רֹקַח
  choice: ароматную смесь
  rationale: Передаёт значение тщательно составленного ароматического состава и сохраняет пояснительное отношение к слову «благовоние».
- source_word: מַעֲשֵׂה רוֹקֵחַ
  choice: составленную по искусству мастера
  rationale: Буквально речь идёт об изделии составителя ароматических веществ. Формулировка передаёт искусность приготовления, оставаясь понятной современному читателю.
- source_word: מְמֻלָּח
  choice: просоленную
  rationale: Пассивное причастие от корня, связанного с солью, наиболее прямо означает «просоленную» или «смешанную с солью»; конкретный образ сохранён, несмотря на его непривычность применительно к благовонию.
- source_word: טָהוֹר
  choice: чистую
  rationale: Передаёт как вещественную, так и культовую чистоту приготовленной смеси.
- source_word: קֹדֶשׁ
  choice: святую
  rationale: Еврейское слово прямо обозначает посвящённость и отделённость для священного употребления; форма согласована с пояснительным словом «смесь».
theological_decisions:
- issue: Степень святости благовония
  choice: святую
  alternative: священную; святыню великую
  rationale: В этом стихе стоит простое קֹדֶשׁ без выражения превосходной степени. Перевод не усиливает культовый статус до «великой святыни» или «святого святых», хотя ближайший контекст подчёркивает особую посвящённость смеси.
translation_notes:
  register: Современный литературный русский с достоинством культового предписания. Повелительная форма звучит естественно; тире ясно вводит пояснение. Необычное упоминание соли сохранено, а не сглажено.
