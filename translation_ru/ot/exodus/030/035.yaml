  source_fidelity: 'Смысловой каркас передан верно: предписание изготовить благовоние, его профессионально составленный характер, соль, чистота и святость сохранены. Однако «просоленную» обычно означает сильно пропитанную солью и неоправданно усиливает מְמֻלָּח; нейтральное «посоленную» точнее. «Мастер» без уточнения несколько размывает רוֹקֵחַ — составителя ароматических веществ.'
