base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/020.yaml
  text: When they enter the tent of meeting[a], they shall wash with water, so that they may not die; or when they come near the altar to minister, to burn a food offering to Yahweh[b],
translation:
  language: ru
  text: Когда они входят в шатёр встречи, они должны омываться водой, чтобы не умерли[a]; или когда подходят к жертвеннику для служения, чтобы возжигать огненную жертву Яхве[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также: «и не умрут»; или: «чтобы не умерли».'
    reason: lexical_alternative
  - marker: b
    text: 'Также: «жертву, совершаемую огнём»; возможен функциональный перевод: «пищевое приношение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹאָם
  choice: Когда они входят
  rationale: 'Предлог ב с инфинитивом и местоименным суффиксом образует временную конструкцию: «когда они входят». Настоящее время естественно выражает повторяющееся предписание.'
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Сочетание обозначает святилище, где Бог встречается с Израилем. «Шатёр встречи» точно передаёт оба компонента и звучит понятно на современном русском.
- source_word: יִרְחֲצוּ מַיִם
  choice: пусть омываются водой
  rationale: Глагол רחץ здесь означает ритуальное омовение; «омываются» естественно передаёт подразумеваемый возвратный смысл, а упоминание воды сохраняется явно.
- source_word: וְלֹא יָמֻתוּ
  choice: чтобы не умереть
  rationale: Формально это сочинённая фраза «и не умрут», но в контексте она выражает цель или предотвращаемое последствие омовения. Выбранный вариант ясен по-русски, а формальная альтернатива сохранена в примечании.
- source_word: אוֹ
  choice: или
  rationale: Сохранён простой разделительный союз, вводящий второе обстоятельство, при котором требуется омовение.
- source_word: בְגִשְׁתָּם אֶל־הַמִּזְבֵּחַ
  choice: когда подходят к жертвеннику
  rationale: נגשׁ означает приближаться, подходить, в том числе в контексте священного служения.
- source_word: לְשָׁרֵת
  choice: для служения
  rationale: Форма с ל выражает цель приближения; «служение» сохраняет культовый контекст без излишне конфессиональной терминологии.
- source_word: לְהַקְטִיר
  choice: чтобы возжигать
  rationale: Hiphil глагола קטר означает заставлять жертву подниматься в дыму. «Возжигать» кратко и уместно передаёт жертвенное действие.
- source_word: אִשֶּׁה
  choice: жертву
  rationale: Слово обозначает жертвенное приношение, связанное с огнём; в основном тексте выбрано естественное общее обозначение, а более буквальные и функциональные варианты приведены в примечании.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל перед божественным именем выражает адресата приношения. Имя יהוה передано как «Яхве», а не заменено титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: В еврейском тексте прямо стоит личное заветное имя יהוה. Транслитерация сохраняет различие между именем и титулом.
- issue: Смысл וְלֹא יָמֻתוּ
  choice: чтобы не умереть
  alternative: и не умрут / иначе умрут
  rationale: Формально возможна координация «и не умрут», однако контекст связывает смерть с нарушением требования об омовении. Перевод передаёт целевое или предупредительное значение, не смягчая реальность смертной санкции; формальная неоднозначность отмечена.
- issue: Характер אִשֶּׁה
  choice: жертву
  alternative: огненную жертву / пищевое приношение
  rationale: Термин допускает традиционное понимание как приношения, совершаемого огнём, и функциональное описание как жертвенной пищи. Основной текст не разрешает эту лексическую дискуссию искусственно, а варианты вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной культовой лексикой («шатёр встречи», «жертвенник», «возжигать»). Синтаксис сохраняет продолжение мысли в следующем стихе, поэтому в конце оставлена запятая. Маркеры примечаний поставлены непосредственно после соответствующих неоднозначных выражений.
