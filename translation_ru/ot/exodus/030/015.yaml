  variant: modern literary Russian
source:
  edition: WLC
  text: הֶֽ/עָשִׁ֣יר לֹֽא יַרְבֶּ֗ה וְ/הַ/דַּל֙ לֹ֣א יַמְעִ֔יט מִֽ/מַּחֲצִ֖ית הַ/שָּׁ֑קֶל לָ/תֵת֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/015.yaml
  text: The rich shall not give more[a], and the poor shall not give less, than the half-shekel, when giving the contribution to Yahweh to make atonement for your lives.
translation:
  language: ru
  text: Богатый не должен давать больше, а бедный — меньше половины шекеля, внося приношение Яхве, чтобы совершить искупление за ваши жизни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за вас самих» или «за ваши души». Еврейское слово «нефеш» может означать душу, жизнь, человека или самого себя; здесь, в контексте переписи, вероятнее всего имеются в виду жизни или лица учтённых людей.'
    reason: Лексическая многозначность נֶפֶשׁ.
lexical_decisions:
- source_word: הֶעָשִׁיר
  choice: богатый
  rationale: Субстантивированное прилагательное обозначает представителя состоятельных людей; единственное число сохраняет форму еврейского текста и естественно образует противопоставление слову «бедный».
- source_word: יַרְבֶּה
  choice: пусть не даёт больше
  rationale: В контексте установленного взноса глагол означает не увеличивать предписанную сумму; добавление «даёт» естественно передаёт подразумеваемое действие.
- source_word: הַדַּל
  choice: бедный
  rationale: Здесь слово обозначает человека с малыми материальными средствами и прямо противопоставлено богатому.
- source_word: יַמְעִיט
  choice: пусть не даёт меньше
  rationale: Передаёт параллельную юридическую формулу и значение запрета уменьшать установленную сумму.
- source_word: מִמַּחֲצִית הַשָּׁקֶל
  choice: меньше половины шекеля
  rationale: Предлог מן при сравнительном значении естественно передаётся русской конструкцией с родительным падежом; «половина шекеля» обозначает фиксированный размер взноса.
- source_word: לָתֵת אֶת תְּרוּמַת יְהוָה
  choice: когда вы приносите приношение Яхве
  rationale: Инфинитив связывает установленную сумму с актом внесения священного взноса. «Приношение» сохраняет культовый оттенок תְּרוּמָה, не превращая платёж в жертву.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его функцию в исходном тексте и не заменяет имя титулом.
- source_word: לְכַפֵּר
  choice: чтобы совершить искупление
  rationale: Устоявшаяся русская библейская формула сохраняет культово-богословскую ёмкость корня כפר, не уточняя спорный механизм искупления.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: за ваши жизни
  rationale: В контексте переписи נֶפֶשׁ обозначает жизнь или самого человека; «жизни» передаёт конкретный смысл, не сводя слово к нематериальной душе.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога. Транслитерация «Яхве» позволяет отличить имя от титула и непосредственно отражает исходную форму.
- issue: Смысл נֶפֶשׁ в контексте искупительного взноса
  choice: за ваши жизни
  alternative: за ваши души; за вас самих
  rationale: Контекст переписи и выкупа указывает прежде всего на жизнь и личность каждого учтённого человека, а не задаёт учение о составе человека; лексическая широта отмечена в сноске.
- issue: Передача כפר
  choice: совершить искупление
  alternative: очистить; внести выкуп
  rationale: «Совершить искупление» сохраняет культовую и богословскую напряжённость выражения, не ограничивая его только очищением либо денежным выкупом.
translation_notes:
  register: Современный литературный русский язык с достоинством правовой и культовой речи. Параллелизм «богатый… больше / бедный… меньше» сохранён. Термин «шекель» оставлен как историческая единица веса и стоимости.
