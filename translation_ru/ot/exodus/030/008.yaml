base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/008.yaml
  text: And when Aaron sets up the lamps at twilight[a], he shall burn it, a regular incense[b], before Yahweh throughout your generations.
translation:
  language: ru
  text: И когда Аарон зажигает светильники в сумерках[a], пусть он регулярно воскуряет благовония[b] перед Яхве, из поколения в поколение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «между вечерами» — древнееврейское выражение, обозначающее вечерний сумеречный период. Глагол также может подразумевать приведение светильников в порядок для горения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пусть он воскуряет постоянное (непрестанное) благовоние». Еврейское слово может подчёркивать постоянство либо установленную регулярность предписанного приношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲלֹת
  choice: И когда ... зажигает
  rationale: Предлог בְּ с инфинитивом образует временное придаточное; каузативная форма עלה применительно к светильникам означает поднятие пламени, то есть зажигание или подготовку светильников к горению. «Зажигает» естественно и ясно в данном контексте.
- source_word: הַנֵּרֹת
  choice: светильники
  rationale: נֵרוֹת — обычное обозначение светильников в контексте устройства святилища; «светильники» точнее, чем современные «лампы».
- source_word: בֵּין הָעַרְבַּיִם
  choice: в сумерках
  rationale: Буквально «между вечерами»; устойчивое древнееврейское выражение обозначает вечерний сумеречный период. Буквальная форма сохранена в примечании.
- source_word: יַקְטִירֶנָּה
  choice: пусть он воскуряет его
  rationale: Каузатив קטר в культовом контексте означает сжигать благовоние, поднимая дым. Русское «воскурять» точно передаёт ритуальное действие; местоимение согласовано с русским словом «курение».
- source_word: קְטֹרֶת תָּמִיד
  choice: постоянное курение
  rationale: קְטֹרֶת означает благовонное курение, а תָּמִיד здесь подчёркивает установленную непрерывную повторяемость обряда, а не действие каждое мгновение.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי указывает на совершение обряда перед лицом Бога, в Его присутствии; краткое «пред» соответствует возвышенному культовому регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом, поскольку исходный текст прямо употребляет тетраграмматон.
- source_word: לְדֹרֹתֵיכֶם
  choice: из поколения в поколение
  rationale: Идиома выражает продолжение предписания во всех последующих поколениях народа; выбран естественный современный русский эквивалент.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит личное имя יהוה. «Яхве» сохраняет различие между именем и титулом, не добавляя конфессионального толкования.
- issue: Характер курения, выраженный תָּמִיד
  choice: постоянное курение
  alternative: регулярное курение
  rationale: «Постоянное» сохраняет традиционную силу תָּמִיד, тогда как примечание уточняет, что в обрядовом расписании речь может идти о неизменно повторяющемся, а не ежемгновенном действии.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной культовой лексикой. «Воскуряет», «курение» и «пред Яхве» сохраняют достоинство и ритуальный оттенок текста, оставаясь понятными в контексте. Все примечания обозначены в основном тексте.
