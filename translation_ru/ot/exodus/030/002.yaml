lexical_decisions:
- source_word: אַמָּה
  choice: один локоть
  rationale: Стандартная древняя мера длины; сохранение «локоть» избегает неточного пересчёта в современные единицы.
- source_word: אָרְכּוֹ
  choice: длиной он
  rationale: Суффикс 3-го лица мужского рода относится к описываемому в контексте жертвеннику; русская конструкция естественно передаёт размер.
- source_word: רָחְבּוֹ
  choice: шириной
  rationale: Современный и ясный русский эквивалент обозначения поперечного размера.
- source_word: רָבוּעַ
  choice: квадратным
  rationale: Передаёт форму основания как квадрата без архаичного оборота «четырёхугольным».
- source_word: יִהְיֶה
  choice: должен быть
  rationale: Имперфект в контексте предписаний выражает требуемую характеристику конструкции.
- source_word: אַמָּתַיִם
  choice: два локтя
  rationale: Двойственное число прямо обозначает два локтя.
- source_word: קֹמָתוֹ
  choice: высотой
  rationale: В описании сооружения это естественный русский термин.
- source_word: מִמֶּנּוּ
  choice: должны составлять с ним одно целое
  rationale: Буквально «из него»; в ремесленном контексте речь об integralной конструкции, при которой рога не являются отдельно прикреплёнными деталями.
- source_word: קַרְנֹתָיו
  choice: его рога
  rationale: Сохраняет устойчивый культовый термин для рогообразных выступов жертвенника и межтекстовые связи.
