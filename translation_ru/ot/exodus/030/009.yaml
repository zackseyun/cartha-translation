base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/009.yaml
  text: You shall not offer unauthorized incense on it[a], or a burnt offering, or a grain offering; and you shall not pour out a drink offering on it.
translation:
  language: ru
  text: Не возносите на нём непредписанных благовоний, ни всесожжения, ни хлебного приношения; не совершайте на нём и возлияния[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чуждых благовоний». Возможные варианты: «посторонних» или «непредписанных благовоний». В данном культовом контексте речь идёт о благовониях, не разрешённых или не предусмотренных установленным порядком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲלוּ
  choice: возносите
  rationale: В породе хифиль глагол עלה буквально означает «поднимать, заставлять восходить», а в контексте жертвенника — «возносить как приношение». «Возносить благовония» естественно передаёт и культовый смысл, и образ поднимающегося дыма.
- source_word: עָלָיו
  choice: на нём / на него
  rationale: Местоимение относится к жертвеннику для благовоний из ближайшего контекста. Разные формы обусловлены управлением русских глаголов «возносить» и «возливать».
- source_word: קְטֹרֶת
  choice: благовония
  rationale: В данном культовом контексте существительное обозначает ароматическое вещество, сжигаемое на жертвеннике. «Благовония» — ясный и укоренившийся русский эквивалент.
- source_word: זָרָה
  choice: не предписанных Богом
  rationale: Прилагательное זָרָה здесь обозначает благовония, выходящие за пределы дозволенного или установленного для этого жертвенника. Развёрнутый перевод ясно выражает культово-правовой смысл; упоминание Бога эксплицирует подразумеваемого установителя предписания.
- source_word: וְעֹלָה
  choice: ни всесожжения
  rationale: עֹלָה — жертва, целиком сжигаемая на жертвеннике. В отрицательном перечислении еврейское ו естественно передаётся русским «ни».
- source_word: וּמִנְחָה
  choice: ни хлебного приношения
  rationale: В священническом контексте מִנְחָה обозначает приношение из продуктов земледелия, прежде всего муки. «Хлебное приношение» является понятным культовым термином и не создаёт ошибочного впечатления, будто речь обязательно о цельном зерне.
- source_word: וְנֵסֶךְ
  choice: возлияния
  rationale: נֵסֶךְ обозначает жидкое приношение, которое выливают. «Возлияние» точно и кратко передаёт этот ритуальный термин.
- source_word: תִסְּכוּ
  choice: возливайте
  rationale: Глагол נסך в этом контексте означает ритуально выливать жидкое приношение. «Возливать возлияние» сохраняет терминологическую связь и звучит естественно в библейском регистре.
theological_decisions:
- issue: Культовый смысл זָרָה при слове «благовония»
  choice: не предписанных Богом
  alternative: посторонних / чуждых благовоний
  rationale: Контекст регулирует служение на жертвеннике благовоний, поэтому речь, вероятнее всего, о составе или виде благовоний, не разрешённом установленным порядком, а не об их этнической «чужеземности». Сноска сохраняет буквальные лексические альтернативы и присущую выражению неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной культовой терминологией («всесожжение», «хлебное приношение», «возлияние»). Синтаксис запрета передан естественным русским рядом с повторяющимся «ни»; точка с запятой сохраняет две соотнесённые глагольные части еврейского стиха.
