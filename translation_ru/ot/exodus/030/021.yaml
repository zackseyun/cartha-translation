base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/021.yaml
  text: They shall wash their hands and their feet[a], so that they may not die. This shall be a permanent statute for them[b], for him and for his offspring throughout their generations.
translation:
  language: ru
  text: 'Они должны омывать руки и ноги, чтобы не умереть. Это будет для них вечным установлением[a]: для него[b] и для его потомков из поколения в поколение.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «постоянным установлением», «непреходящим установлением». Еврейское חָק עוֹלָם — обычная юридико-культовая формула, обозначающая установление, сохраняющее силу длительное время.'
    reason: lexical_alternative
  - marker: b
    text: «Для него» — то есть для Аарона, упомянутого в ближайшем контексте.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: они должны омывать
  rationale: В контексте культового предписания форма передаёт обязательное действие. «Должны омывать» естественно выражает нормативную силу; глагол «омыть/омывать» сохраняет ритуальный оттенок.
- source_word: יְדֵיהֶם וְרַגְלֵיהֶם
  choice: руки и ноги
  rationale: Точное обозначение частей тела; принадлежность ясна из подлежащего «они», поэтому повторение притяжательного местоимения по-русски не требуется.
- source_word: וְלֹא יָמֻתוּ
  choice: чтобы не умереть
  rationale: В данном предписании оборот выражает предотвращаемое смертельное последствие. Такой перевод естественен по-русски и сохраняет серьёзность предупреждения.
- source_word: וְהָיְתָה לָהֶם
  choice: это будет для них
  rationale: Указательное «это» восполняет подразумеваемое подлежащее и отсылает к предписанному омовению, не добавляя нового содержания.
- source_word: חָק עוֹלָם
  choice: установлением на все времена
  rationale: Передаёт устойчивую юридико-культовую формулу как долговременное, постоянно действующее предписание, не превращая עוֹלָם в отвлечённое утверждение о метафизической бесконечности.
- source_word: לוֹ
  choice: для него
  rationale: Сохранено местоимение мужского рода единственного числа; его ближайший контекстуальный референт — Аарон.
- source_word: וּלְזַרְעוֹ
  choice: и для его потомков
  rationale: זֶרַע здесь обозначает потомство как продолжающийся род. «Потомки» ясно и естественно передаёт смысл в современном русском языке.
- source_word: לְדֹרֹתָם
  choice: во все их поколения
  rationale: Сохраняет формулу преемственности предписания в последовательных поколениях.
theological_decisions:
- issue: Продолжительность установления, выраженная формулой חָק עוֹלָם
  choice: установление на все времена
  alternative: вечное установление; постоянное установление
  rationale: Выбранная формулировка сохраняет силу долговременного заветного предписания, но не решает сверх текста вопрос о его действии вне данных культовых и заветных рамок.
- issue: Референт местоимения לוֹ
  choice: сохранить «для него» и пояснить, что речь об Аароне
  alternative: заменить местоимение в тексте именем «Аарон»
  rationale: Местоименная форма оригинала сохраняется в основном тексте, а контекстуальный референт разъясняется в сноске без устранения формальной особенности еврейской фразы.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном, подходящим для текста закона. Сохранён переход от множественного «для них» к единственному «для него», присутствующий в еврейском тексте; тире помогает читателю воспринять последующую конкретизацию.
