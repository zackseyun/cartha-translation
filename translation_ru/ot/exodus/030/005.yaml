  text: And you shall make the poles of acacia wood and overlay them with gold.
translation:
  language: ru
  text: И сделай шесты из древесины акации и обложи их золотом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: И сделай
  rationale: Форма совершенного вида с союзом в последовательности предписаний передаёт повеление; русское повелительное наклонение естественно выражает эту директивную силу и связь с контекстом.
- source_word: הַבַּדִּים
  choice: шесты
  rationale: В описании священной утвари בַּד обозначает шесты для её переноски. «Шесты» — ясный современный русский эквивалент.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Конструкция буквально означает древесину акации. Такая формулировка точна, естественна и не прибегает к малопонятной транслитерации названия дерева.
- source_word: וְצִפִּיתָ
  choice: и обложи
  rationale: В ремесленном контексте צפה означает покрыть изделие слоем материала; «обложи золотом» — устойчивое и понятное русское выражение.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение прямого дополнения относится к шестам и естественно передаётся русским «их».
- source_word: זָהָב
  choice: золотом
  rationale: Русский творительный падеж естественно обозначает материал покрытия.
