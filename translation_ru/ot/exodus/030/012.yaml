  text: כִּ֣י תִשָּׂ֞א אֶת רֹ֥אשׁ בְּנֵֽי יִשְׂרָאֵ֘ל לִ/פְקֻדֵי/הֶם֒ וְ/נָ֨תְנ֜וּ אִ֣ישׁ כֹּ֧פֶר נַפְשׁ֛/וֹ לַ/יהוָ֖ה בִּ/פְקֹ֣ד אֹתָ֑/ם וְ/לֹא יִהְיֶ֥ה בָ/הֶ֛ם נֶ֖גֶף בִּ/פְקֹ֥ד אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/012.yaml
  text: When you take a census of the sons of Israel according to those numbered among them[a], then each man shall give to Yahweh a ransom for his life when you number them[c][b], so that there will be no plague among them when you number them.
translation:
  language: ru
  text: Когда будешь проводить перепись сынов Израиля по их числу[a], каждый пусть даст Яхве выкуп за свою жизнь[b] при их исчислении, чтобы при их исчислении среди них не было мора.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднимать голову сынов Израиля» — древнееврейское выражение, означающее пересчёт или перепись.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «выкуп за себя». Здесь еврейское нэфеш означает жизнь или самого человека, а не только «душу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: когда
  rationale: В данном установлении частица вводит ожидаемое обстоятельство; «когда» естественнее, чем условное «если».
- source_word: תִשָּׂא אֶת רֹאשׁ
  choice: будешь пересчитывать
  rationale: Буквально «поднимешь голову» — идиома проведения переписи; перевод передаёт её смысл современным русским языком.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет родственное выражение и грамматический род исходного текста.
- source_word: לִפְקֻדֵיהֶם
  choice: при их переписи
  rationale: Форма от פקד имеет административный смысл учёта или переписи; краткая формулировка не перегружает стих повтором.
- source_word: וְנָתְנוּ אִישׁ
  choice: пусть каждый даст
  rationale: 'אִישׁ имеет распределительное значение: каждый из пересчитываемых мужчин; в русском «каждый» естественно передаёт это значение в данном контексте.'
- source_word: כֹּפֶר
  choice: выкуп
  rationale: Обозначает плату, вносимую за жизнь человека и предотвращающую поражение; «выкуп» сохраняет конкретный платёжный смысл.
- source_word: נַפְשׁוֹ
  choice: за свою жизнь
  rationale: נפש здесь означает жизнь или самого человека, а не исключительно нематериальную «душу».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт собственное имя יהוה, употреблённое в исходном тексте.
- source_word: בִּפְקֹד אֹתָם
  choice: когда их будут пересчитывать / при их пересчёте
  rationale: Оборот обозначает время и обстоятельство переписи. Безличная форма естественна по-русски и не вводит нового действующего лица.
- source_word: נֶגֶף
  choice: мор
  rationale: В контексте Божьего поражения народа слово обозначает смертоносное бедствие; «мор» точно и лаконично передаёт этот смысл.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет Тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Значение נַפְשׁוֹ в формуле выкупа
  choice: за свою жизнь
  alternative: за свою душу; за себя
  rationale: Контекст говорит о сохранении жизни пересчитываемого человека и не требует позднейшего антропологического значения слова «душа».
- issue: Мужские формы בְּנֵי יִשְׂרָאֵל и אִישׁ
  choice: сынов Израиля ... каждый
  alternative: израильтян ... каждый человек
  rationale: Перепись и индивидуальный платёж выражены мужскими формами. Перевод сохраняет «сынов Израиля», а распределительное אִישׁ естественно передаёт словом «каждый» без изменения референта.
- issue: Связь выкупа с предотвращением поражения
  choice: чтобы ... не было мора
  alternative: и не будет среди них мора
  rationale: Так передаётся целевая или результативная связь, подразумеваемая последовательностью предписания, без уточнения механизма искупления сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Идиома תִשָּׂא אֶת רֹאשׁ раскрыта в основном тексте, а буквальная форма сохранена в сноске. Повтор корня פקד по возможности отражён лексикой пересчёта и переписи. Архаичное, но понятное слово «мор» выбрано как точное обозначение смертоносного поражения.
