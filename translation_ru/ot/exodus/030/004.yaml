  text: And you shall make two gold rings for it under its molding[a]; on its two side panels you shall make them, on its two sides[c][b], and they shall be holders for poles with which to carry it.
translation:
  language: ru
  text: И сделай для него два золотых кольца под его обрамлением[a]. Сделай их на двух его боковых частях — с двух его сторон[b]; они будут гнёздами для шестов[c], чтобы переносить его с их помощью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под его каймой» либо «под его венцом»; еврейское זֵר обозначает декоративное обрамление вокруг жертвенника.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на двух его боковых частях… на двух его сторонах»; повтор подчёркивает, что кольца должны находиться с обеих сторон.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «они будут домами для шестов», то есть местами, в которые вставляются шесты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: два золотых кольца
  rationale: Передаёт предмет и материал прямо и естественно по-русски.
- source_word: מִתַּחַת לְזֵרוֹ
  choice: под его обрамлением
  rationale: זֵר обозначает декоративную кайму или обрамление жертвенника; «обрамление» сохраняет архитектурно-ремесленный смысл, не сводя его непременно к верхнему краю.
- source_word: צַלְעֹתָיו ... צִדָּיו
  choice: на обеих его боковых стенках
  rationale: צֵלָע здесь относится к боковым конструктивным частям предмета, а последующее צַד подчёркивает размещение с двух сторон. Русская формулировка передаёт оба элемента без тяжеловесного повтора.
- source_word: לְבָתִּים לְבַדִּים
  choice: держателями для шестов
  rationale: Буквально «домами для шестов»; в данном контексте речь о гнёздах или креплениях, удерживающих шесты.
- source_word: בַדִּים
  choice: шесты
  rationale: В описании переноски священной утвари בַּדִּים — длинные шесты; это современное и ясное русское обозначение.
- source_word: לָשֵׂאת אֹתוֹ בָּהֵמָּה
  choice: чтобы носить его на них
  rationale: 'Сохраняет цель и инструментальное значение местоимения: жертвенник переносят посредством шестов.'
- source_word: תַּעֲשֶׂה ... תַּעֲשֶׂה
  choice: сделай ... Сделай
  rationale: Императив естественно передаёт предписывающую силу древнееврейского имперфекта в данном законодательном контексте и сохраняет повтор глагола.
