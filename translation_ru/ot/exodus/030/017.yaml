lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И ... сказал
  rationale: Форма wayyiqtol продвигает повествование; союз «и» сохраняет связь с контекстом. В русской библейской формуле перед прямой речью естественно «сказал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, не заменяя его титулом.
- source_word: אֶל מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи без отдельного предлога.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В этой формуле инфинитив вводит последующую прямую речь; в современном русском его функцию естественно и без смысловой потери передаёт двоеточие, избегая тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» сохраняет его как имя; традиционная замена «Господь» отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая и естественная формула введения прямой речи. Маркер сноски поставлен после имени Моисея по структуре предоставленного консультационного текста, хотя сама сноска поясняет имя «Яхве».
