  yaml_path: translation/ot/exodus/030/023.yaml
  text: 'And you[a], take for yourself the finest spices: five hundred shekels of flowing myrrh, and half as much—two hundred fifty—of fragrant cinnamon, and two hundred fifty of fragrant cane[b],'
translation:
  language: ru
  text: 'А ты возьми себе лучших благовоний: свободно истекающей мирры[a] — пятьсот шекелей, душистой корицы — половину этого количества — двести пятьдесят шекелей, и душистого тростника[b] — двести пятьдесят шекелей,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «чистой мирры». Еврейское выражение, вероятно, означает мирру, свободно истекающую в естественном состоянии.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «сладкой корицы» и «благовонного аира». Еврейские выражения шире обозначают душистые корицу и тростник.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂמִים רֹאשׁ
  choice: лучших благовоний
  rationale: רֹאשׁ буквально означает «голова», но здесь идиоматически указывает на высшее качество; בְּשָׂמִים — ароматические вещества. Выражение «лучших благовоний» естественно передаёт оба компонента.
- source_word: מָר דְּרוֹר
  choice: текучей мирры
  rationale: מָר означает «мирра», а דְּרוֹר, вероятно, описывает свободно истекающую мирру в её естественном состоянии. «Текучая» сохраняет образ исходного выражения, не сводя его безоговорочно к значению «чистая».
- source_word: חֲמֵשׁ מֵאוֹת
  choice: пятьсот шекелей
  rationale: В стихе названо только число, однако единица веса подразумевается рецептом и прямо указана далее, в ст. 24. Добавление «шекелей» устраняет неясность для современного читателя.
- source_word: קִנְּמָן בֶּשֶׂם
  choice: душистой корицы
  rationale: קִנְּמָן — корица, а בֶּשֶׂם подчёркивает аромат. «Душистая» описывает запах и не создаёт ложного акцента на вкусовой сладости.
- source_word: מַחֲצִיתוֹ
  choice: половину этого количества
  rationale: Местоименный суффикс отсылает к предыдущему количеству — пятистам. Такая формулировка ясно передаёт эту связь по-русски.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: двести пятьдесят
  rationale: Число дано как точное пояснение к половине предыдущего количества; сохранена пояснительная структура еврейского текста.
- source_word: קְנֵה בֹשֶׂם
  choice: душистого тростника
  rationale: קָנֶה обозначает тростник или камыш, а בֹשֶׂם — его ароматический характер. «Тростник» не навязывает более узкую ботаническую идентификацию «аир».
