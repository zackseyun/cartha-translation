  text: וְ/קִדָּ֕ה חֲמֵ֥שׁ מֵא֖וֹת בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ וְ/שֶׁ֥מֶן זַ֖יִת הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/024.yaml
  text: and cassia[a], five hundred shekels by the sanctuary shekel, and a hin of olive oil.
translation:
  language: ru
  text: и кассии — пятьсот сиклей по священному сиклю, и гин[a] оливкового масла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Гин — древняя мера объёма жидкостей; обычно её оценивают примерно в 3,5–4 литра.
    reason: cultural_note
lexical_decisions:
- source_word: קִדָּה
  choice: кассия
  rationale: Название ароматической коры, употреблявшейся в благовониях; «кассия» — точный и принятый русский эквивалент.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: пятьсот сиклей
  rationale: Числительное обозначает вес кассии; слово «сиклей» естественно восполняется по следующему указанию на мерный стандарт.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному сиклю
  rationale: Фраза указывает, что вес следует рассчитывать согласно установленному священному стандарту сикля.
- source_word: שֶׁמֶן זַיִת
  choice: оливковое масло
  rationale: Естественная русская передача еврейского сочетания «масло оливы».
- source_word: הִין
  choice: гин
  rationale: Сохранено название древней меры объёма; приблизительный современный эквивалент дан в примечании.
- source_word: וְ
  choice: и
  rationale: Союз сохраняет связь с предшествующими компонентами перечня.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением традиционных названий древних мер. Тире помогает ясно отделить название вещества от указания его веса. Маркер примечания помещён после слова «гин», поскольку примечание объясняет именно эту меру.
