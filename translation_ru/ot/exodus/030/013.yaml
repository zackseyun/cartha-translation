  text: זֶ֣ה יִתְּנ֗וּ כָּל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מַחֲצִ֥ית הַ/שֶּׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֤ים גֵּרָה֙ הַ/שֶּׁ֔קֶל מַחֲצִ֣ית הַ/שֶּׁ֔קֶל תְּרוּמָ֖ה לַֽ/יהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/013.yaml
  text: 'This is what everyone who passes over to those who are numbered shall give: half a shekel according to the sanctuary shekel (the shekel is twenty gerahs)[a], half a shekel as an offering to Yahweh.'
translation:
  language: ru
  text: 'Вот что должен дать каждый, кто входит в число исчисляемых: половину сикля по сиклю святилища (сикль составляет двадцать гер) — половину сикля как приношение Яхве.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה יִתְּנוּ
  choice: Вот что должен дать
  rationale: Указательная формула и имперфект в законодательном контексте переданы естественной современной конструкцией с предписывающим значением.
- source_word: כָּל הָעֹבֵר עַל הַפְּקֻדִים
  choice: каждый, кто проходит перепись
  rationale: Оборот относится к вступающим в официальный подсчёт; перевод сохраняет образ прохождения и ясно передаёт контекст переписи.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: половину сикля
  rationale: Прямое и принятое обозначение половины древней весовой и денежной единицы.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному сиклю
  rationale: Предлог ב обозначает меру или стандарт; выражение указывает на установленный при святилище весовой эталон.
- source_word: עֶשְׂרִים גֵּרָה הַשֶּׁקֶל
  choice: в сикле двадцать гер
  rationale: Кратко и ясно передаёт пояснение о составе единицы, сохраняя множественное число русской формы «гер».
- source_word: תְּרוּמָה לַיהוָה
  choice: как приношение Яхве
  rationale: «Приношение» передаёт вклад, отделяемый для Бога, не сужая значение до специального обряда возношения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация сохраняет личное имя Бога.
- issue: Характер תְּרוּמָה
  choice: приношение
  alternative: взнос
  rationale: «Приношение» сохраняет одновременно материальный и культовый оттенки; «взнос» передал бы главным образом административный характер.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного и культового контекста. Термины «сикль» и «гера» сохранены как исторические единицы; синтаксис упрощён для ясности без устранения образности еврейского оборота.
