  text: И сделай жертвенник для воскурения благовоний[a]; из дерева акации сделай его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный более краткий перевод: «жертвенник благовоний» или «жертвенник для благовоний». Буквальнее еврейское выражение означает жертвенник, предназначенный для воскурения благовоний.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: И сделай
  rationale: Форма с союзом продолжает последовательность предписаний; русский императив естественно передаёт директивную силу, а «и» сохраняет связь с контекстом.
- source_word: מִזְבֵּחַ
  choice: жертвенник
  rationale: Устоявшееся и точное русское обозначение культового сооружения для приношений.
- source_word: מִקְטַר קְטֹרֶת
  choice: для воскурения благовоний
  rationale: Передаёт функциональную конструкцию оригинала и сохраняет различие между действием воскурения и самим ароматическим веществом.
- source_word: עֲצֵי שִׁטִּים
  choice: из дерева акации
  rationale: Естественно передаёт еврейское обозначение материала; родовое «акация» понятно современному читателю без спорного уточнения конкретного ботанического вида.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: сделай его
  rationale: Сохраняет повтор глагола и возобновление объекта перед указанием материала, не сглаживая структуру еврейской фразы.
