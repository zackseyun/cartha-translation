  text: and the altar of burnt offering with all its utensils[a], and the basin with its stand.
translation:
  language: ru
  text: и жертвенник всесожжения со всеми его принадлежностями, и умывальник с его подставкой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: жертвенник всесожжения
  rationale: מִזְבַּח означает «жертвенник», а הָעֹלָה — жертву всесожжения. Традиционное русское сочетание точно и естественно передаёт культовый термин.
- source_word: כָּל כֵּלָיו
  choice: все его принадлежности
  rationale: כְּלִי охватывает сосуды, орудия и иные предметы, относящиеся к жертвеннику. «Принадлежности» сохраняет эту широту и ясно соотносится с жертвенником благодаря местоимению «его».
- source_word: הַכִּיֹּר
  choice: умывальник
  rationale: כִּיּוֹר обозначает ёмкость для ритуального омовения при святилище. «Умывальник» — понятный современному читателю и укоренённый в русском библейском употреблении термин.
- source_word: כַּנּוֹ
  choice: его подставка
  rationale: כֵּן здесь обозначает опору или основание умывальника. «Подставка» естественно передаёт её функцию, не уточняя форму сверх исходного текста.
- source_word: וְאֶת
  choice: и
  rationale: Повторяющееся сочетание союза с показателем прямого дополнения координирует предметы перечня; непереводимый показатель אֶת по-русски опускается, а וְ передаётся союзом «и».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением принятой сакральной терминологии. Фрагментарное начало с «и» сохранено, поскольку стих продолжает перечень из предыдущего контекста.
