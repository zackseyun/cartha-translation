revisions:
- from: Раз в год Аарон будет совершать очищение[a] на рогах жертвенника. Кровью жертвы за грех, приносимой для очищения, он будет совершать очищение жертвенника раз в год из поколения в поколение. Это великая святыня для Яхве.
  to: Раз в год Аарон должен совершать обряд очищения[a] над его рогами. Кровью жертвы за грех для очищения он должен совершать обряд очищения над ним раз в год, во все ваши поколения. Это великая святыня для Яхве.
  rationale: Исправлена неестественная конструкция с «на рогах», устранено добавленное причастное значение «приносимой», а трудная конструкция חַטַּאת הַכִּפֻּרִים передана кратко и нейтрально с поясняющей сноской. Повтор ежегодности, ритуальная направленность כפר на жертвенник, множественность поколений и формула высшей святости сохранены.
