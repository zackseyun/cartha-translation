base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/010.yaml
  text: Aaron shall make atonement on its horns once a year[a]. With the blood of the sin offering of atonement he shall make atonement for it once a year throughout your generations. It is most holy to Yahweh.
translation:
  language: ru
  text: Раз в год Аарон должен совершать обряд очищения[a] над его рогами. Кровью жертвы за грех для очищения он должен совершать обряд очищения над ним раз в год, во все ваши поколения. Это великая святыня для Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершать искупление». Буквально далее: «из крови жертвы за грех очищений (искуплений)». Еврейское выражение допускает также передачу: «кровью жертвы за грех для искупления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  choice: будет совершать очищение
  rationale: В священническом контексте כפר обозначает обряд, устраняющий осквернение и восстанавливающий возможность приближения к святыне. «Совершать очищение» естественно по-русски и, в отличие от отвлечённого «искупать», ясно передаёт ритуальное действие над рогами и жертвенником.
- source_word: קַרְנֹתָיו
  choice: на рогах жертвенника
  rationale: Местоименный суффикс относится к ранее названному жертвеннику курений. Повтор существительного устраняет неясность, естественную для отдельного стиха.
- source_word: אַחַת בַּשָּׁנָה
  choice: раз в год
  rationale: Обычный современный русский эквивалент, точно выражающий периодичность обряда.
- source_word: מִדַּם
  choice: кровью
  rationale: 'Предлог מן здесь имеет инструментальное значение: очищение совершается посредством крови.'
- source_word: חַטַּאת
  choice: жертва за грех
  rationale: В данном культовом контексте слово называет жертвоприношение, а не грех как отвлечённое понятие. Традиционный термин понятен современному читателю.
- source_word: הַכִּפֻּרִים
  choice: приносимой для очищения
  rationale: Формально множественное כִּפֻּרִים входит в устойчивое культовое выражение и указывает на очистительно-искупительный обряд; функциональная передача избегает неестественного русского «очищений».
- source_word: לְדֹרֹתֵיכֶם
  choice: из поколения в поколение
  rationale: Естественно передаёт непрерывное действие предписания для последующих поколений адресатов.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: великая святыня
  rationale: Еврейское сочетание выражает высшую степень святости. «Великая святыня» — понятная русская культовая формула, не смешивающая классификацию святости со Святая святых как помещением.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог выражает принадлежность или посвящённость, а тетраграмматон передан личным именем «Яхве», что соответствует предоставленному актуальному английскому консультационному тексту и сохраняет отличие имени от титула.
theological_decisions:
- issue: Значение כפר применительно к жертвеннику
  choice: совершать очищение
  alternative: совершать искупление
  rationale: Объектом действия служат рога жертвенника и сам жертвенник, поэтому русский глагол должен допускать ритуальное удаление осквернения. В сноске сохранена традиционная искупительная альтернатива, не устраняя богословскую многозначность корня.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: Текст прямо сохраняет личное заветное имя, не превращая его в титул; это не привязывает перевод к конфессиональному толкованию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён без потери повторов «раз в год» и «совершать очищение», значимых для структуры еврейского текста.
