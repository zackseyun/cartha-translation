  text: And you shall anoint Aaron and his sons, and you shall consecrate them to serve as priests to me.
translation:
  language: ru
  text: Помажь Аарона и его сыновей и освяти их, чтобы они служили Мне священниками.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּמְשָׁח
  choice: помажь
  rationale: Глагол משׁח обозначает ритуальное помазание священным маслом. Русское «помажь» сохраняет конкретный обрядовый и богословский смысл; повелительная форма естественно передаёт предписание в данном контексте.
- source_word: וְקִדַּשְׁתָּ
  choice: и освяти
  rationale: Пиэль от קדשׁ означает отделить для священного служения, посвятить Богу. «Освяти» точно сохраняет связь со святостью и уместно в русском библейском и культовом контексте.
- source_word: לְכַהֵן
  choice: чтобы они служили священниками
  rationale: Глагольная форма от כהן означает исполнять священническое служение. Эта формулировка ясно передаёт не только статус, но и деятельность.
- source_word: לִי
  choice: Мне
  rationale: Предлог ל с суффиксом первого лица указывает, что священническое служение обращено к Господу. «Мне» непосредственно и естественно передаёт еврейскую конструкцию.
- source_word: בָּנָיו
  choice: его сыновей
  rationale: Еврейский текст прямо говорит о сыновьях Аарона; мужской род существенен в контексте священнической линии.
- source_word: וְאֶת ... וְאֶת
  choice: Аарона и его сыновей
  rationale: Повторяющийся показатель прямого дополнения выделяет оба однородных объекта, но в естественном русском его достаточно передать простым соединением существительных.
theological_decisions:
- issue: Культовое значение קדשׁ и כהן
  choice: «освяти» и «служили Мне священниками»
  alternative: «посвяти» и «совершали для Меня священническое служение»
  rationale: Выбранная формулировка сохраняет лексику святости и ясно обозначает священническую функцию, не привнося позднейших церковных представлений.
- issue: Передача вида предписания
  choice: 'Русское повелительное наклонение: «Помажь… освяти»'
  alternative: «Ты должен помазать… и освятить»
  rationale: В последовательности наставлений еврейские формы yiqtol и qatal с вавом имеют предписывающую силу. Прямое повеление звучит по-русски естественно и не изменяет модальность.
- issue: Родовое значение בָּנָיו
  choice: «его сыновей»
  alternative: «его детей»
  rationale: Источник и контекст священнического установления относятся именно к сыновьям Аарона; нейтрализация рода была бы менее точной.
translation_notes:
  register: Современный литературный русский язык с достоинством, подобающим законодательному и культовому контексту. Синтаксис краткий и ясный; местоимение «Мне» написано с прописной буквы по принятой русской библейской традиции.
