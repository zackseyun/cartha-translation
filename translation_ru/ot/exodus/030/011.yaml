lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма с последовательным вау вводит новый шаг повествования. В русской библейской формуле «сказал» естественно передаёт דבר и вместе с последующим לֵאמֹר вводит прямую речь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом; форма «Яхве» общеупотребительна в современной русской библеистике.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного предлогом אֶל; имя מֹשֶׁה передано в традиционной русской форме.
- source_word: לֵאמֹר
  choice: двоеточие после речевой формулы
  rationale: Инфинитив вводит содержание последующей прямой речи. В современном русском его функция естественно выражается двоеточием без избыточного «говоря».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как имя. Транслитерация сохраняет это различие, а примечание сообщает традиционный вариант передачи.
translation_notes:
  register: Современный литературный русский язык с лаконичной и dignified повествовательной формулой. Синтаксическая функция לֵאמֹר передана русской пунктуацией; архаическое «говоря» не использовано.
