  text: אִ֚ישׁ אֲשֶׁ֣ר יִרְקַ֣ח כָּמֹ֔/הוּ וַ/אֲשֶׁ֥ר יִתֵּ֛ן מִמֶּ֖/נּוּ עַל זָ֑ר וְ/נִכְרַ֖ת מֵ/עַמָּֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/033.yaml
  text: Whoever compounds any like it[a], or puts any of it on a stranger[b], shall be cut off from his people.
translation:
  language: ru
  text: Кто приготовит подобное ему масло или нанесёт часть его на постороннего[a], тот будет отсечён от своего народа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на человека, которому это не дозволено». Здесь «посторонний» означает не обязательно чужеземца, а того, кто не допущен к такому священному употреблению масла.'
    reason: lexical_alternative
  - marker: b
    text: «Будет отсечён от своего народа» — заветно-правовая формула; конкретный способ наказания в этом стихе не указан.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Кто
  rationale: 'В данном правовом установлении сочетание имеет обобщающее значение: речь идёт о любом человеке, который совершит запрещённое действие.'
- source_word: יִרְקַח
  choice: приготовит
  rationale: Глагол обозначает составление смеси, в частности благовонного состава. В сочетании со словом «масло» русский глагол «приготовит» естественно передаёт этот технический процесс.
- source_word: כָּמֹהוּ
  choice: подобное ему масло
  rationale: Местоимение отсылает к священному маслу для помазания, описанному выше. Формулировка сохраняет указание на подобие состава, не утверждая сверх текста абсолютную тождественность.
- source_word: וַאֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: или нанесёт часть его
  rationale: נתן על в этом контексте означает поместить или нанести масло на человека, а מִמֶּנּוּ — взять некоторое количество от него. «Нанесёт часть его» точно и естественно передаёт оба элемента.
- source_word: עַל זָר
  choice: на постороннего
  rationale: В священническом контексте זָר обозначает не обязательно иноплеменника, а человека, не допущенного к данному священному употреблению. «Посторонний» сохраняет это контекстуальное значение без этнического уточнения.
- source_word: וְנִכְרַת
  choice: будет отсечён
  rationale: Сохранена традиционная образность древнееврейской заветно-правовой формулы; перевод не уточняет механизм наказания, которого данный стих не называет.
- source_word: מֵעַמָּיו
  choice: от своего народа
  rationale: Прямо передаёт принадлежность человека к народу, от которого он будет отсечён, и сохраняет общинно-заветный смысл выражения.
theological_decisions:
- issue: Значение זָר в законе о священном масле
  choice: посторонний, то есть не допущенный к такому священному употреблению
  alternative: чужеземец; мирянин; неуполномоченный человек
  rationale: Контекст определяет границу священного употребления, а не этническую принадлежность. Основной текст сохраняет краткость исходного слова, а сноска поясняет его культовый смысл.
- issue: Смысл формулы וְנִכְרַת מֵעַמָּיו
  choice: будет отсечён от своего народа
  alternative: будет изгнан из своего народа; будет предан смерти
  rationale: Древнееврейская формула допускает обсуждение конкретного способа исполнения наказания, но сам стих его не уточняет. Поэтому неоднозначность сохранена.
