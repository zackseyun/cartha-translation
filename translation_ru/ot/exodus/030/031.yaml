  yaml_path: translation/ot/exodus/030/031.yaml
  text: And you shall speak to the sons of Israel, saying, ‘This shall be a holy anointing oil to me throughout your generations.’
translation:
  language: ru
  text: 'Скажи сынам Израиля: «Это будет для Меня священным маслом помазания во все ваши поколения».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Устойчивое библейское обозначение народа Израиля; сохраняет образ исходного выражения и остаётся понятным современному читателю.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: священным маслом для помазания
  rationale: Передаёт конструкцию как масло, предназначенное для священного помазания; «священное» естественнее по-русски согласуется с маслом.
- source_word: יִהְיֶה זֶה לִי
  choice: это будет у Меня
  rationale: Сохраняет значение принадлежности и исключительной посвящённости Богу, выраженное לִי, не сводя его лишь к пользе «для Меня».
- source_word: לְדֹרֹתֵיכֶם
  choice: во все ваши поколения
  rationale: Передаёт длительность установления из поколения в поколение и соответствует формуле исходного текста.
theological_decisions:
- issue: Значение לִי в формуле посвящения
  choice: у Меня
  alternative: для Меня / Моим
  rationale: «У Меня» сохраняет буквальную направленность и оттенок принадлежности Богу, не уточняя сверх текста, означает ли это собственность, назначение или культовую посвящённость.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Развёрнутая древнееврейская вводная формула «говори… говоря» естественно передана одним повелением «Скажи».
