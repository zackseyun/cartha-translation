base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/018.yaml
  text: You shall make a bronze basin[a], with its stand of bronze, for washing; and you shall place it between the tent of meeting and the altar[c][b], and you shall put water there.
translation:
  language: ru
  text: Сделай умывальник[a] из бронзы[b] и подставку[c] к нему из бронзы — для омовения. Поставь его между шатром встречи и жертвенником и налей в него воды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чан для омовений».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из меди». Еврейское слово может обозначать как медь, так и медный сплав.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «основание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיּוֹר
  choice: умывальник
  rationale: Обозначает большой сосуд с водой для ритуального омовения. «Умывальник» — традиционное, понятное современному русскому читателю название; возможное «чан» отмечено в сноске.
- source_word: נְחֹשֶׁת
  choice: бронза
  rationale: В описаниях предметов святилища термин традиционно и контекстуально уместно передавать как «бронза», хотя он может обозначать медь или медный сплав; эта неоднозначность сохранена в сноске.
- source_word: כַנּוֹ
  choice: подставка к нему
  rationale: Слово обозначает опору или основание сосуда. «Подставка» ясно передаёт функцию и естественно звучит по-русски.
- source_word: לְרָחְצָה
  choice: для омовения
  rationale: Инфинитив выражает назначение предмета. Формулировка сохраняет краткость исходного текста и не добавляет прямо не названный объект действия.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Точное и прозрачное обозначение священного шатра, где Бог встречается со Своим народом; не отождествляет его без необходимости со всем комплексом скинии.
- source_word: מִזְבֵּחַ
  choice: жертвенник
  rationale: Обычный и точный русский эквивалент для культового алтаря в данном контексте.
- source_word: שָׁמָּה
  choice: туда
  rationale: Сохраняет пространственное наречие «туда/там» и естественно связывает воду с только что установленным умывальником, не заменяя наречие более явным «в него».
- source_word: מָיִם
  choice: воды
  rationale: Родительный падеж после «налей» естественно передаёт неопределённое количество воды в русском языке.
- source_word: וְעָשִׂיתָ ... וְנָתַתָּ ... וְנָתַתָּ
  choice: Сделай ... Поставь ... налей
  rationale: В контексте наставлений эти формы имеют предписывающую силу. Русские повелительные формы передают её яснее и естественнее, чем двусмысленное будущее время.
