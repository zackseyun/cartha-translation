  text: Aaron and his sons shall wash their hands and their feet from it[a].
translation:
  language: ru
  text: Аарон и его сыновья должны омывать водой из него[a] руки и ноги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из него»; то есть водой из умывальника, упомянутого в ближайшем контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: пусть омывают
  rationale: В данном предписывающем контексте форма выражает обязательное установление. «Пусть омывают» естественно передаёт директивную силу и сохраняет возвышенный культовый регистр.
- source_word: אַהֲרֹן
  choice: Аарон
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: וּבָנָיו
  choice: и его сыновья
  rationale: Здесь בנים обозначает сыновей Аарона, принадлежащих к мужской священнической линии; более широкое «дети» было бы неточным.
- source_word: מִמֶּנּוּ
  choice: из него
  rationale: Предлог מן с местоименным суффиксом буквально указывает на источник и относится к умывальнику из предыдущего стиха. Дополнение «водой» контекстуально верно, но не выражено в данной фразе явно, поэтому вынесено в сноску.
- source_word: אֶת יְדֵיהֶם
  choice: руки
  rationale: Прямое обозначение первой части тела; принадлежность уже естественно понятна из русского построения с подлежащим во множественном числе.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: и ноги
  rationale: Прямое обозначение второй части тела, соединённое с первым однородным дополнением.
theological_decisions:
- issue: Указание на мужскую священническую линию
  choice: и его сыновья
  alternative: и его дети
  rationale: Контекст говорит об Аароне и его сыновьях, несущих священническое служение; родовое обозначение не нейтрализуется.
- issue: Неявно подразумеваемая вода
  choice: из него
  alternative: водой из него
  rationale: Основной текст сохраняет краткость и синтаксическую неоднозначность еврейского выражения, тогда как явное указание на воду даётся в сноске на основании ближайшего контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром культового предписания. Глагол «омывают» выбран вместо бытового «моют», а конструкция «из него» сохраняет формальную близость к еврейскому тексту; сноска устраняет возможную неясность без добавления подразумеваемого слова в основной текст.
