  yaml_path: translation/ot/exodus/030/034.yaml
  text: 'Then Yahweh said to Moses[a], “Take for yourself spices: stacte and onycha and galbanum, spices, and pure frankincense; they shall be in equal parts.”'
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Возьми себе благовония: стакти, ониху и гальбан; эти благовония и чистый ладан — всё в равных долях».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Естественно передаёт повествовательную последовательность еврейского текста без излишнего усиления временного значения.
- source_word: קַח לְךָ
  choice: Возьми себе
  rationale: Сохраняет личный оттенок конструкции с לְךָ.
- source_word: סַמִּים
  choice: благовония
  rationale: Широкое обозначение ароматических веществ, здесь предназначенных для приготовления курения; в русском контексте звучит естественнее, чем «пряности».
- source_word: נָטָף
  choice: стакти
  rationale: Традиционное обозначение конкретного ароматического вещества, точная идентификация которого остаётся неясной.
- source_word: שְׁחֵלֶת
  choice: ониха
  rationale: Традиционное название вещества для курения; точный природный источник не установлен.
- source_word: חֶלְבְּנָה
  choice: гальбан
  rationale: Общепринятое современное название ароматической смолы, соответствующее наиболее вероятной идентификации.
- source_word: לְבֹנָה זַכָּה
  choice: чистый ладан
  rationale: Точно и естественно передаёт существительное и определяющее его прилагательное.
- source_word: בַּד בְּבַד
  choice: в равных долях
  rationale: Передаёт смысл идиомы как указание на равное количество каждого компонента.
- source_word: יִהְיֶה
  choice: всё ... [будет]
  rationale: Единственное число согласуется с совокупностью перечисленных компонентов; в русском настоящая связка естественно опускается.
