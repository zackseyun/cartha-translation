  text: With it you shall anoint the tent of meeting and the ark of the testimony[a].
translation:
  language: ru
  text: Им помажь шатёр встречи и ковчег свидетельства[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по более традиционной передаче: «ковчег завета»; в еврейском тексте здесь буквально: «свидетельства».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: помажь
  rationale: Форма Qal 2-го лица мужского рода единственного числа с союзом продолжает последовательность предписаний и по-русски естественно передаётся повелительным наклонением. «Помазать» точно выражает культовое значение משׁח.
- source_word: בּוֹ
  choice: им
  rationale: Предлог ב с местоименным суффиксом указывает на елей для помазания из предшествующего контекста и имеет инструментальное значение.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Передаёт конструкцию буквально и понятно современному читателю, сохраняя идею места встречи без конфессионально закреплённого термина «скиния собрания».
- source_word: אֲרוֹן
  choice: ковчег
  rationale: В контексте святилища это традиционный и узнаваемый русский эквивалент названия священного ларца.
- source_word: הָעֵדֻת
  choice: свидетельства
  rationale: Прямо передаёт употреблённое в еврейском тексте עדות и не подменяет его словом «завет».
theological_decisions:
- issue: Передача אֲרוֹן הָעֵדֻת
  choice: ковчег свидетельства
  alternative: ковчег завета
  rationale: В данном стихе еврейский текст прямо говорит о «свидетельстве». Более привычное «ковчег завета» встречается как традиционное обозначение, но здесь было бы менее точным лексически.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и предписывающая. «Шатёр встречи» выбран как ясная и близкая к источнику передача; «ковчег свидетельства» сохраняет терминологию именно этого стиха.
