  text: Whoever makes any like it to smell it shall be cut off from his people[a][b].
translation:
  language: ru
  text: Кто приготовит благовоние, подобное ему, чтобы вдыхать его аромат[a], тот будет отсечён от своего народа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы наслаждаться его ароматом». Буквально: «чтобы обонять его». Речь идёт о приготовлении такого благовония ради его аромата.'
    reason: lexical_alternative
  - marker: b
    text: «Будет отсечён от своего народа» — устойчивая юридическая формула. В зависимости от контекста она может подразумевать смерть, изгнание из общины или устранение Божьим судом.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Кто
  rationale: 'В юридической формуле сочетание имеет обобщающее значение: любой человек, который совершит указанное действие.'
- source_word: יַעֲשֶׂה
  choice: приготовит
  rationale: Хотя עשה обычно означает «делать», в контексте изготовления смеси благовоний русское «приготовит» точнее и естественнее.
- source_word: כָמֹהָ
  choice: подобное ему
  rationale: Выражение отсылает к составу священного благовония; перевод сохраняет возможность понимать как такой же или сходный состав, не уточняя степень тождества.
- source_word: לְהָרִיחַ בָּהּ
  choice: чтобы наслаждаться его ароматом
  rationale: Инфинитив обозначает цель приготовления — вдыхать аромат для себя. Такой перевод естественно передаёт смысл конструкции, тогда как буквальное «чтобы нюхать его» в современном русском звучит грубо и двусмысленно.
- source_word: וְנִכְרַת
  choice: тот будет истреблён
  rationale: Форма Niphal передаёт устранение человека; «будет истреблён» сохраняет устойчивую библейскую юридическую формулу, не определяя исполнителя и конкретный способ наказания.
- source_word: מֵעַמָּיו
  choice: из среды своего народа
  rationale: Передаёт принадлежность к народу и последующее удаление из него естественной для русского библейского регистра формулой.
theological_decisions:
- issue: Смысл формулы וְנִכְרַת מֵעַמָּיו
  choice: Сохранить формулу «будет истреблён из среды своего народа», не определяя точный механизм наказания.
  alternative: «будет предан смерти»; «будет исключён из общины»; «будет устранён Божьим судом»
  rationale: Древнееврейская юридическая формула может подразумевать смерть, изгнание из общины или Божье устранение. Контекст не позволяет бесспорно выбрать один механизм, поэтому неоднозначность сохранена и пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным юридико-сакральным оттенком. Синтаксис краток и доступен; традиционная формула наказания сохранена ради смысловой и богословской неоднозначности.
