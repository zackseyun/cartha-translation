  source_fidelity: 'Первое лицо в черновике («Не лейте») передаёт запрет, но еврейская форма יִיסָךְ — непереходная/страдательная форма 3-го лица ед. числа: «не будет (не должно быть) возливаемо». Безличное «его нельзя возливать» естественно по-русски и точнее сохраняет направленность запрета на употребление масла. «По его составу не изготовляйте ничего подобного» передаёт וּבְמַתְכֻּנְתּוֹ לֹא תַעֲשׂוּ כָּמֹהוּ без невыраженного в самом стихе добавления «другого елея».'
  naturalness: Исправленный текст использует современный литературный русский и сохраняет сдержанно библейский регистр. «Святыня» в современном русском обычно обозначает почитаемый священный предмет или место и менее удачна как предикат для елея; «свят» и «святым» естественно передают повтор קֹדֶשׁ.
