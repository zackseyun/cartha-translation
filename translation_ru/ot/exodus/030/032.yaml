base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/032.yaml
  text: It shall not be poured on human flesh[a], and in its composition you shall not make any like it. It is holy; it shall be holy to you.
translation:
  language: ru
  text: Его нельзя возливать на тело человека[a], и не изготовляйте по его составу ничего подобного. Он свят; святым он должен быть для вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «на плоть человека»; еврейское слово אָדָם здесь обозначает человека вообще.
    reason: Уточняет буквальную форму выражения и родовое значение еврейского слова.
lexical_decisions:
- source_word: יִיסָךְ
  choice: не лейте
  rationale: Передаёт конкретное значение пассивной формы глагола נסך — лить или наносить посредством выливания — без замены его более широким обрядовым термином «помазывать».
- source_word: עַל בְּשַׂר אָדָם
  choice: на тело человека
  rationale: בשר буквально означает «плоть», а אדם здесь употреблено родово — о человеке вообще. В современном русском «тело человека» естественно передаёт смысл; буквальная форма отмечена в сноске.
- source_word: וּבְמַתְכֻּנְתּוֹ
  choice: такого же состава
  rationale: מַתְכֹּנֶת обозначает состав, соотношение компонентов или установленную рецептуру. «Такого же состава» ясно выражает запрет воспроизводить смесь.
- source_word: לֹא תַעֲשׂוּ כָּמֹהוּ
  choice: не делайте другого елея такого же состава
  rationale: Сравнительная конструкция запрещает изготовление другого елея, подобного священному составу. Слово «елей» восстановлено из ближайшего контекста для естественности русского текста.
- source_word: קֹדֶשׁ הוּא
  choice: Он — святыня
  rationale: Предикативное существительное קֹדֶשׁ передано как «святыня», что сохраняет не только качество святости, но и статус елея как отделённого для Бога.
- source_word: קֹדֶשׁ יִהְיֶה לָכֶם
  choice: святыней он должен быть для вас
  rationale: Сохраняет повтор קֹדֶשׁ и обязательную силу формы יִהְיֶה, не сводя фразу к простому описанию.
theological_decisions:
- issue: Родовое значение אָדָם
  choice: человека
  alternative: человеческое тело; плоть человека
  rationale: В данном контексте אָדָם обозначает человека вообще, а не конкретно мужчину. Русское «человека» сохраняет исходный образ и естественно выражает родовое значение.
- issue: Передача קֹדֶשׁ как существительного или прилагательного
  choice: святыня
  alternative: свят; священен
  rationale: Еврейское קֹדֶשׁ здесь формально является существительным. «Святыня» сохраняет категориальность и намеренный повтор двух предложений, не исключая значения святости.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Елей» согласуется с непосредственным контекстом и позволяет ясно соотнести местоимения; синтаксис упрощён ради естественности, при этом повтор «святыня» сохранён.
