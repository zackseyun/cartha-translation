    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: будет воскурять
  rationale: В породе hифиль глагол קטר в культовом контексте означает сжигать приношение так, чтобы оно восходило дымом. «Воскурять» естественно для русского библейского и богослужебного контекста и точнее, чем общее «сжигать».
- source_word: עָלָיו
  choice: на нём
  rationale: Местоимение отсылает к жертвеннику для курений из предыдущего контекста и сохраняет локативное значение.
- source_word: קְטֹרֶת סַמִּים
  choice: благовонное курение
  rationale: Сочетание обозначает курение, составленное из ароматических веществ. Этот вариант передаёт и предмет, и его благоухание без неестественной кальки «курение благовоний».
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: каждое утро
  rationale: Повтор существительного имеет распределительное значение и подчёркивает регулярное ежедневное действие. «Каждое утро» ясно и естественно передаёт эту функцию в современном русском.
- source_word: בְּהֵיטִיבוֹ
  choice: когда он будет приводить в порядок
  rationale: Hифильный инфинитив от יטב здесь означает обслуживание и подготовку светильников. Формулировка сохраняет широкий смысл и не сводит действие только к подрезанию фитилей.
- source_word: הַנֵּרֹת
  choice: светильники
  rationale: Речь идёт о храмовых светильниках, известных из контекста; уточнение «на светильнике» не требуется.
- source_word: יַקְטִירֶנָּה
  choice: он будет воскурять его
  rationale: Суффикс женского рода отсылает к קְטֹרֶת. Русское местоимение согласовано с выбранным словом «курение» и сохраняет анафорическую связь.
