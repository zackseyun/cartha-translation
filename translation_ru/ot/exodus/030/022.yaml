lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: В формуле введения прямой речи глагол דבר естественно передаётся по-русски как «сказал»; он также обозначает новый шаг повествования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста, не заменяя её титулом.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного предлогом אֶל; имя מֹשֶׁה передаётся в общепринятой русской форме «Моисей».
- source_word: לֵאמֹר
  choice: ':'
  rationale: В данном контексте инфинитив вводит содержание речи, которое следует в следующем стихе; в современном русском эту функцию естественно и точно выполняет двоеточие.
- source_word: וַ
  choice: И
  rationale: Союз сохраняет повествовательную связь с предшествующим контекстом; русское «и» соответствует последовательному продвижению рассказа без излишнего уточнения временного отношения.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя, поэтому транслитерация «Яхве» сохраняет различие между именем и титулом. Сноска указывает традиционную передачу, не подменяя ею основной текст.
translation_notes:
  register: Современный литературный русский язык, краткая и достойная библейская повествовательная формула. Двоеточие вместо буквального «говоря» избегает неестественной русской конструкции и ясно вводит продолжение прямой речи.
