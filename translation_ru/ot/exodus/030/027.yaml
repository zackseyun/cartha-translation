  text: and the table and all its utensils[a], and the lampstand and its utensils, and the altar of incense,
translation:
  language: ru
  text: и стол со всеми его принадлежностями, и светильник с его принадлежностями, и жертвенник для воскурения благовоний[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвенник благовонного курения».'
    reason: Лексически возможная более формальная передача конструкции מִזְבַּח הַקְּטֹרֶת.
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: стол
  rationale: В еврейском тексте здесь употреблено простое существительное «стол» без повторения его полного культового наименования; краткий перевод сохраняет форму источника и ясен из контекста.
- source_word: כָּל כֵּלָיו
  choice: со всеми его принадлежностями
  rationale: כְּלִי обозначает сосуд, орудие или иной предмет оснащения. «Принадлежности» естественно и достаточно широко передаёт совокупность предметов при столе.
- source_word: הַמְּנֹרָה
  choice: светильник
  rationale: Перевод передаёт значение нарицательного существительного מְנוֹרָה, не заменяя его транслитерацией «менора»; в контексте скинии речь идёт о священном светильнике.
- source_word: כֵּלֶיהָ
  choice: с его принадлежностями
  rationale: То же широкое значение כְּלִי передано последовательно; местоимение согласовано с русским словом «светильник».
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: жертвенник для воскурения благовоний
  rationale: Сочетание обозначает жертвенник, связанный с קְטֹרֶת — благовонным курением. Такой перевод ясно передаёт назначение жертвенника и звучит естественно в современном литературном русском.
