  text: וְ/קִדַּשְׁתָּ֣ אֹתָ֔/ם וְ/הָי֖וּ קֹ֣דֶשׁ קָֽדָשִׁ֑ים כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִקְדָּֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/029.yaml
  text: You shall consecrate them[a], and they shall be most holy. Whatever touches them shall become holy.
translation:
  language: ru
  text: Освяти их, и они станут великой святыней. Всё, что прикоснётся к ним, станет святым.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет святым» либо «будет освящено». Еврейская форма может указывать на обретение святости вследствие соприкосновения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתָּ
  choice: Освяти
  rationale: Пиэль глагола קדשׁ означает посвятить Богу, отделив как святое. «Освяти» естественно для русского библейского и богослужебного контекста и сохраняет связь с последующим «святым».
- source_word: אֹתָם
  choice: их
  rationale: Местоимение прямого дополнения указывает на перечисленные в ближайшем контексте принадлежности святилища.
- source_word: וְהָיוּ
  choice: и они станут
  rationale: Результативное «станут» естественно передаёт состояние, наступающее вследствие освящения, не сводя фразу к простому описанию.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: великой святыней
  rationale: Сопряжённая конструкция выражает высшую степень святости. Устойчивое русское «великая святыня» передаёт культовый смысл и в единственном числе согласуется с еврейским предикативным существительным קֹדֶשׁ.
- source_word: כָּל הַנֹּגֵעַ
  choice: Всё, что прикоснётся
  rationale: Сочетание כָּל с причастием имеет обобщающее значение. Средний род сохраняет широкий охват, не ограничивая сказанное только людьми или только предметами.
- source_word: בָּהֶם
  choice: к ним
  rationale: Предлог ב при נגע естественно передаётся по-русски конструкцией «прикоснуться к»; местоимение относится к освящённым предметам.
- source_word: יִקְדָּשׁ
  choice: станет святым
  rationale: 'Каль имперфекта קדשׁ допускает результативно-инхоативное понимание: соприкоснувшееся входит в состояние святости. «Станет святым» ясно выражает это, сохраняя неоднозначность последствий такой святости.'
theological_decisions:
- issue: Характер святости, возникающей от соприкосновения
  choice: Соприкоснувшееся с освящёнными предметами становится святым; характер и последствия этой святости не поясняются.
  alternative: Истолковать это либо как благотворительное посвящение, либо как попадание в опасную и ограниченную сферу святости.
  rationale: Еврейский текст утверждает наступление святости, но не уточняет, является ли оно благотворным, опасным или влекущим ритуальные ограничения. Перевод сохраняет это богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной культовой лексикой. «Великая святыня» звучит естественнее буквального «святость святынь» и не создаёт ошибочной пространственной ассоциации с помещением «Святое святых».
