  text: וְ/לָקַחְתָּ֞ אֶת כֶּ֣סֶף הַ/כִּפֻּרִ֗ים מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/נָתַתָּ֣ אֹת֔/וֹ עַל עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֤ל לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/016.yaml
  text: You shall take the atonement money from the sons of Israel and give it for the service of the tent of meeting[a], and it shall be for the sons of Israel as a memorial before Yahweh[b], to make atonement for your lives.
translation:
  language: ru
  text: Возьми у сынов Израиля деньги искупления и отдай их для служения в шатре встречи. Эти деньги будут для сынов Израиля напоминанием перед Яхве, чтобы совершить искупление за ваши жизни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «за ваши души»; здесь еврейское נֶפֶשׁ означает жизнь или самого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף הַכִּפֻּרִים
  choice: деньги искупления
  rationale: כֶּסֶף может означать «серебро» или «деньги»; здесь речь идёт о денежном взносе, установленном в предыдущих стихах. «Деньги искупления» естественно передаёт назначение платежа и культовый смысл כִּפֻּרִים.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: у сынов Израиля
  rationale: Сохранено формально точное обозначение covenantного народа בְּנֵי יִשְׂרָאֵל; предлог «у» естественно сочетается в русском с глаголом «возьми».
- source_word: עַל עֲבֹדַת אֹהֶל מוֹעֵד
  choice: на служение при шатре встречи
  rationale: עַל выражает назначение средств, а עֲבֹדָה обозначает работу или служение, связанное со святилищем. «При шатре встречи» ясно указывает на относящееся к нему служение, не сужая смысл до богослужебного обряда.
- source_word: וְהָיָה ... לְזִכָּרוֹן
  choice: они будут ... напоминанием
  rationale: זִכָּרוֹן означает памятное напоминание. Число согласовано с русским множественным существительным «деньги», хотя в еврейском местоименная отсылка к כֶּסֶף имеет единственное число.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Сохранено обычное пространственно-культовое выражение «перед», то есть в присутствии Бога, и прямо передано личное имя יהוה.
- source_word: לְכַפֵּר עַל נַפְשֹׁתֵיכֶם
  choice: для искупления ваших жизней
  rationale: Инфинитив לְכַפֵּר передаёт цель или назначение, а נֶפֶשׁ в данном контексте относится к жизни или самой личности, а не обязательно к «душе» в позднейшем дуалистическом смысле.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное заветное имя передано непосредственно как «Яхве».
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Формально мужское множественное обозначение заветного народа сохранено без нейтрализации; в самом тексте употреблена падежная форма «сынов Израиля».
- issue: Связь денег с искуплением
  choice: для искупления ваших жизней
  alternative: чтобы искупить вас; для очищения ваших душ
  rationale: Формулировка сохраняет культовый смысл корня כפר и непосредственную связь с жизнью людей, не объясняя сверх текста механизм искупления и не вводя противопоставление души и тела.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан ясным для широкого читателя; сохранены ключевые культовые термины «искупление», «шатёр встречи» и личное имя «Яхве».
