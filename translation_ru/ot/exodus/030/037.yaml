base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/037.yaml
  text: And the incense that you make according to its composition[a], you shall not make for yourselves[b]; it shall be holy to you for Yahweh.
translation:
  language: ru
  text: А благовоние, которое ты приготовишь по его составу[a], не делайте для себя[b]; оно должно быть для тебя святыней, посвящённой Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по его рецептуре»; возможно также: «в тех же пропорциях».'
    reason: lexical_alternative
  - marker: b
    text: То есть эту священную смесь нельзя было воспроизводить для обычного личного употребления.
    reason: cultural_note
lexical_decisions:
- source_word: הַקְּטֹרֶת
  choice: курение
  rationale: В контексте речь идёт об особой священной ароматической смеси для воскурения. «Курение» — традиционное и при этом понятное обозначение такой смеси; добавление «благовонное» в этом стихе не обязательно.
- source_word: אֲשֶׁר תַּעֲשֶׂה
  choice: которое ты приготовишь
  rationale: Глагол עשה буквально означает «делать», но применительно к составлению смеси естественное русское «приготовишь» точнее передаёт действие.
- source_word: בְּמַתְכֻּנְתָּהּ
  choice: по этому составу
  rationale: מַתְכֹּנֶת здесь обозначает предписанный состав, соотношение или способ приготовления. «По этому составу» естественно отсылает к рецептуре предыдущего стиха, не придавая выражению излишне научного оттенка.
- source_word: לֹא תַעֲשׂוּ לָכֶם
  choice: не делайте для себя
  rationale: 'Сохранена смена числа в еврейском тексте: после единственного «ты приготовишь» следует множественное запрещение «не делайте». Оборот «для себя» сохраняет прямую формулировку и подразумевает запрет личного, обыденного употребления.'
- source_word: קֹדֶשׁ תִּהְיֶה לְךָ
  choice: пусть оно будет для тебя святыней
  rationale: Предикативное קֹדֶשׁ указывает на священный статус смеси. Существительное «святыня» в этой конструкции звучит по-русски естественнее, чем буквальное «свято», и сохраняет сакральную весомость.
- source_word: לַיהוָה
  choice: посвящённой Яхве
  rationale: Предлог ל выражает принадлежность или посвящение. «Посвящённой Яхве» ясно передаёт эту связь, а имя יהוה транслитерируется как «Яхве» согласно принятому решению проекта.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон יהוה. Передача «Яхве» сохраняет личное заветное имя и соответствует указанной доктрине проекта.
- issue: Смысл святости курения
  choice: святыня, посвящённая Яхве
  alternative: свято для тебя пред Яхве; принадлежит Яхве как святыня
  rationale: Формулировка одновременно сохраняет отношение адресата к смеси как к святыне и её посвящённость Яхве, не усиливая קֹדֶשׁ до «великой святыни» или «святыни святынь».
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Сохранена заметная смена адресации с единственного числа («ты приготовишь», «для тебя») на множественное («не делайте»), присутствующая в еврейском тексте. Местоимение «оно» согласовано с русским словом среднего рода «курение».
