lexical_decisions:
- source_word: כֹּל
  choice: Каждый
  rationale: 'Перед причастным оборотом слово имеет распределительное значение: речь идёт о каждом человеке, отвечающем указанным условиям.'
- source_word: הָעֹבֵר עַל הַפְּקֻדִים
  choice: кто проходит в число исчисленных
  rationale: Перевод сохраняет конкретный образ прохождения, выраженный глаголом עבר, и одновременно передаёт его связь с включением человека в число переписанных. Необычность еврейской переписной формулы отмечена в сноске.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: от двадцати лет и старше
  rationale: Естественная современная русская формула возрастного порога, точно передающая исходное выражение.
- source_word: יִתֵּן
  choice: должен дать
  rationale: Имперфект в данном законодательном контексте выражает обязательное предписание; конструкция «должен дать» передаёт эту силу ясно и без архаизации.
- source_word: תְּרוּמַת
  choice: приношение
  rationale: Слово обозначает вклад или дар, отделяемый для Бога. «Приношение» сохраняет религиозный характер дара, не сводя его лишь к денежному налогу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Степень явности переписной идиомы
  choice: проходит в число исчисленных
  alternative: числится среди пересчитанных
  rationale: Выбранный вариант сохраняет образ «прохождения» и не устраняет характерную неоднозначность еврейской формулы, а сноска поясняет вероятную связь с процедурой переписи.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного предписания. Формулировка «проходит в число исчисленных» намеренно сохраняет необычный конкретный образ оригинала; сноска предлагает другой возможный способ понять конструкцию.
