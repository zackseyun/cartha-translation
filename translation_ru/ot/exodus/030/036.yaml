  text: וְ/שָֽׁחַקְתָּ֣ מִמֶּ/נָּה֮ הָדֵק֒ וְ/נָתַתָּ֨ה מִמֶּ֜/נָּה לִ/פְנֵ֤י הָ/עֵדֻת֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָׁ֑מָּ/ה קֹ֥דֶשׁ קָֽדָשִׁ֖ים תִּהְיֶ֥ה לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/036.yaml
  text: And you shall grind some of it very fine[a], and put some of it before the testimony in the tent of meeting, where I will meet with you. It shall be most holy for you.
translation:
  language: ru
  text: Часть его разотри в очень мелкий порошок и положи часть его перед Свидетельством в шатре встречи, где Я буду встречаться с тобой. Это будет для вас величайшей святыней[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «святыней святынь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַקְתָּ מִמֶּנָּה הָדֵק
  choice: Часть его разотри в мельчайший порошок
  rationale: Глагол שׁחק обозначает растирание или измельчение, מִמֶּנָּה имеет разделительное значение «часть его», а הָדֵק указывает на предельно мелкую степень измельчения. Формулировка естественна по-русски и ясно передаёт результат действия.
- source_word: וְנָתַתָּה מִמֶּנָּה
  choice: и положи
  rationale: נתן в данном обрядовом контексте означает помещение чего-либо в определённое место. Повторное מִמֶּנָּה не выражено отдельным «часть его», поскольку по-русски уже названная часть естественно остаётся объектом обоих действий.
- source_word: לִפְנֵי הָעֵדֻת
  choice: перед Свидетельством
  rationale: Сохранён буквальный культовый термин הָעֵדֻת без уточняющей подстановки «ковчег» или «скрижали», которых непосредственно в тексте стиха нет. Заглавная буква отмечает его употребление как особого наименования.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: в шатре встречи
  rationale: Выражение передаёт значение назначенного места встречи и сохраняет образ шатра. Оно понятно современному читателю и не заменяет исходный термин более широким словом «скиния».
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: где Я буду встречаться с тобой
  rationale: Нифаль глагола יעד здесь обозначает назначенную встречу. Несовершенный вид «буду встречаться» естественно передаёт повторяющееся действие в месте богоприсутствия; единственное число «с тобой» сохранено.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: величайшей святыней
  rationale: Еврейское сочетание выражает высшую степень святости. «Величайшая святыня» звучит естественно и достойно по-русски, а буквальная форма сохранена в примечании.
- source_word: תִּהְיֶה לָכֶם
  choice: Это будет для вас
  rationale: Формулировка сохраняет отношение, выраженное לָכֶם, не сводя его к владению. Указательное «это» избегает неясного согласования при подразумеваемом благовонном составе.
theological_decisions:
- issue: Референт слова «Свидетельство»
  choice: Сохранить термин «Свидетельство» без поясняющей замены.
  alternative: «перед ковчегом Свидетельства» или «перед скрижалями завета»
  rationale: Еврейский текст прямо называет Свидетельство, но не уточняет здесь, идёт ли речь о скрижалях или о связанном с ними ковчеге. Перевод сохраняет эту референциальную сжатость.
- issue: Передача превосходной степени святости
  choice: «величайшей святыней» в основном тексте
  alternative: «святыней святынь»
  rationale: Основной вариант ясно передаёт значение еврейской превосходной конструкции в современном русском языке; буквальная традиционная форма дана в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным обрядовым регистром. Синтаксис сделан плавным и понятным, при этом сохранены технические термины и неоднозначность исходного текста.
