base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/017.yaml
  text: You shall not covet your neighbor’s house; you shall not covet your neighbor’s wife[a], or his male servant, or his female servant, or his ox, or his donkey, or anything that belongs to your neighbor.
translation:
  language: ru
  text: Не желай дома ближнего твоего; не желай жены ближнего твоего, ни его раба, ни его рабыни, ни его вола, ни его осла — ничего, что принадлежит ближнему твоему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַחְמֹד
  choice: не желай
  rationale: Глагол חמד обозначает желание завладеть тем, что принадлежит другому. В русском языке «не желай» естественно для формулировки заповеди и сохраняет направленность запрета на внутреннее стремление, тогда как «не пожелай» может восприниматься как запрет лишь на отдельный акт.
- source_word: בֵּית רֵעֶךָ
  choice: дома ближнего твоего
  rationale: בַּיִת может означать как дом, так и домохозяйство; последующее отдельное перечисление жены, рабов и животных делает предметное значение «дом» наиболее естественным здесь.
- source_word: רֵעֶךָ
  choice: ближнего твоего
  rationale: רֵעַ в законодательном контексте означает другого человека, прежде всего члена сообщества. «Ближний» — ясный и устойчивый русский эквивалент с межличностным и нравственным смыслом.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: жены ближнего твоего
  rationale: Сочетание прямо обозначает жену другого человека; родительный падеж естественно сочетается с «не желай».
- source_word: עַבְדּוֹ
  choice: его раба
  rationale: עֶבֶד обозначает человека в подневольном, зависимом статусе. В данном юридическом перечне принадлежности другому лицу слово «раб» точнее передает социально-правовой смысл, чем более широкое «слуга».
- source_word: אֲמָתוֹ
  choice: его рабыни
  rationale: אָמָה обозначает женщину в рабском или зависимом служебном статусе. «Рабыня» сохраняет как статус, так и выраженное в еврейском тексте различие пола.
- source_word: שׁוֹרוֹ
  choice: его вола
  rationale: שׁוֹר здесь обозначает крупное рабочее животное; «вол» — точный и традиционно понятный русский эквивалент в законодательном перечне.
- source_word: חֲמֹרוֹ
  choice: его осла
  rationale: חֲמוֹר означает осла; это обычный современный русский эквивалент.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: ничего, что принадлежит ближнему твоему
  rationale: Итоговая формула охватывает всё принадлежащее ближнему. После отрицательного повеления русское «ничего» синтаксически и стилистически естественно передает всеобъемлющий характер запрета.
- source_word: לֹא ... לֹא
  choice: не желай ... не желай
  rationale: Повтор отрицательного запрета сохранен, чтобы передать структуру и усиление еврейского текста.
theological_decisions:
- issue: Значение בֵּית в первой части стиха
  choice: дом
  alternative: домохозяйство, семья
  rationale: Хотя בַּיִת может охватывать домочадцев и имущество, далее жена, рабы и животные названы отдельно. Поэтому «дом» лучше сохраняет последовательность перечисления и не устраняет лексическую неоднозначность путем расширительного перевода.
- issue: Передача терминов עֶבֶד и אָמָה
  choice: раб / рабыня
  alternative: слуга / служанка
  rationale: В юридическом перечне людей и имущества особенно заметен подневольный социальный статус. «Раб» и «рабыня» прямо передают эту историческую реальность, не смягчая ее и не привнося конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным строем заповеди. Инверсия «ближнего твоего» сохраняет достоинство и узнаваемость библейской речи, оставаясь понятной. Архаичные формы вроде «не возжелай» не использованы; повтор запрета и полный перечень сохранены.
