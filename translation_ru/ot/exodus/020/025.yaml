base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/025.yaml
  text: And if you make for me an altar of stones[a], you shall not build it of cut stones; for if you wield your sword on it[b], you will profane it.
translation:
  language: ru
  text: И если сделаешь Мне жертвенник из камней, то не строй его из тёсаных камней[a], ибо, занеся над ним свой меч[b], ты осквернишь его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из обтёсанного камня».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «твой меч»; в данном контексте, вероятно, имеется в виду металлическое орудие, которым обрабатывали камни.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: И если
  rationale: Сохраняет как связь с предшествующим наставлением, выраженную союзом וְ, так и условный характер אִם.
- source_word: מִזְבַּח אֲבָנִים
  choice: жертвенник из камней
  rationale: Прямо и естественно передаёт конструкцию со значением материала, из которого сооружается жертвенник.
- source_word: תַּעֲשֶׂה לִּי
  choice: будешь делать Мне
  rationale: Передаёт глагол «делать» и дательное отношение לִי, не добавляя невыраженной цели.
- source_word: לֹא תִבְנֶה אֶתְהֶן גָּזִית
  choice: не строй его из тёсаных камней
  rationale: «Не строй» сохраняет форму правового запрета; местоимение согласовано в русском с «жертвенником», а גָּזִית передано как камни, обработанные тесанием.
- source_word: כִּי
  choice: потому что, если
  rationale: Передаёт обоснование запрета и делает явным условный смысл последующей фразы, естественный в русском контексте.
- source_word: חַרְבְּךָ
  choice: свой меч
  rationale: Сохраняет прямое значение существительного «меч», не заменяя его толковательным «орудие»; возвратное «свой» естественно при подлежащем второго лица.
- source_word: הֵנַפְתָּ עָלֶיהָ
  choice: занесёшь над ним
  rationale: «Занести меч над» естественно передаёт поднятие и направленное применение меча к камню, сохраняя образ исходного текста.
- source_word: וַתְּחַלְלֶהָ
  choice: то осквернишь его
  rationale: Глагол «осквернить» сохраняет культовый смысл חלל — лишить святыню её священного статуса, — не сводя его к физическому повреждению.
theological_decisions:
- issue: Характер осквернения жертвенника
  choice: Обработка камней мечом оскверняет жертвенник в культовом смысле.
  alternative: Запрет может символически осуждать насилие либо предписывать простоту жертвенника.
  rationale: Глагол חלל прямо выражает профанацию святыни. Однако стих не раскрывает, почему именно применение меча имеет такой результат, поэтому перевод не закрепляет какую-либо дополнительную символическую трактовку.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим правовому и культовому контексту. Сохранены связующее «И», прямое обозначение «меч» и богословски значимое «осквернишь»; синтаксис слегка сглажен для ясности обычному читателю.
