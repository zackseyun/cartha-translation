  source_fidelity: 'Требуется безопасная правка синтаксической связи жертв с животными. В еврейском тексте צֹאנְךָ וּבְקָרְךָ являются дополнительными прямыми дополнениями к «приноси в жертву», а не пояснительным приложением к «всесожжениям и мирным жертвам». Основной перевод каузативной формы אַזְכִּיר сохранён, но сформулирован более прямо: Бог делает так, чтобы Его имя помнили.'
