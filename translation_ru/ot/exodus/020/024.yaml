base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/024.yaml
  text: You shall make for me an altar of earth[a], and on it you shall sacrifice your burnt offerings and your peace offerings, your flock and your herd. In every place where I cause my name to be remembered, I will come to you and bless you.
translation:
  language: ru
  text: Сделай Мне жертвенник из земли и приноси на нём в жертву свои всесожжения и мирные жертвы, а также свой мелкий и крупный скот. В каждом месте, где Я сделаю так, чтобы Моё имя помнили[a], Я приду к тебе и благословлю тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «где Я возвещу Своё имя»; возможно также: «где Я запишу Своё имя». Еврейский глагол имеет каузативную форму: Бог делает так, что Его имя помнят или упоминают. Точный оттенок может включать провозглашение, увековечение памяти или призывание Божьего имени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח אֲדָמָה
  choice: жертвенник из земли
  rationale: Конструктивное сочетание обозначает жертвенник, сделанный из земли или грунта. Такой перевод конкретен, естественен по-русски и не превращает материал в отвлечённую характеристику.
- source_word: תַּעֲשֶׂה לִּי
  choice: Сделай Мне
  rationale: Имперфект в предписывающем контексте передан естественным русским повелительным наклонением; дательный לִי сохраняет посвящённость жертвенника Богу.
- source_word: וְזָבַחְתָּ עָלָיו
  choice: и приноси на нём в жертву
  rationale: В культовом контексте זבח означает жертвенное заклание или принесение жертвы. Формулировка передаёт ритуальный смысл без излишне буквального «закалывай» и сохраняет указание на жертвенник.
- source_word: עֹלֹתֶיךָ
  choice: свои всесожжения
  rationale: «Всесожжение» — точный и укоренившийся русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: שְׁלָמֶיךָ
  choice: мирные жертвы
  rationale: Традиционное выражение сохраняет связь термина с миром, благополучием и целостностью, не сужая его до одной функции, например общения.
- source_word: אֶת צֹאנְךָ וְאֶת בְּקָרֶךָ
  choice: мелкий и крупный скот
  rationale: צֹאן охватывает мелкий скот, прежде всего овец и коз, а בָּקָר — крупный рогатый скот. Перевод сохраняет широту обеих категорий точнее, чем «овцы и быки».
- source_word: בְּכָל הַמָּקוֹם
  choice: На всяком месте
  rationale: Передаёт дистрибутивный смысл выражения и звучит естественно в русском нормативном предписании.
- source_word: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: где Я установлю память о Своём имени
  rationale: Каузативная форма זכר указывает на действие Бога, благодаря которому Его имя помнят или упоминают. «Установлю память» сохраняет божественную инициативу и мемориальный оттенок, а примечание отмечает иные возможные нюансы.
- source_word: אָבֹא אֵלֶיךָ וּבֵרַכְתִּיךָ
  choice: Я приду к тебе и благословлю тебя
  rationale: Прямо и естественно передаёт обещание Божьего приближения и благословения, сохраняя обе личные формы.
theological_decisions:
- issue: Смысл Божьего действия в אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: где Я установлю память о Своём имени
  alternative: где Я возвещу Своё имя; где Я запишу Своё имя; где Я сделаю так, что Моё имя будут вспоминать
  rationale: Каузативная форма допускает оттенки установления памяти, провозглашения, упоминания или фиксации имени. Основной текст сохраняет Божью инициативу, а сноска оставляет реальную лексическую неоднозначность, не определяя точный способ присутствия имени.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной и богослужебной речи. Синтаксис сделан ясным для обычного читателя; сохранены традиционные термины «жертвенник», «всесожжения» и «мирные жертвы». Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской практикой.
