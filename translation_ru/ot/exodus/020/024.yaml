  - severity: low
    issue: «Установлю память о Своём имени»
    rationale: Оборот возможен, но менее прямо передаёт каузативное действие глагола זכר и в современном русском звучит несколько отвлечённо. Более прозрачное «сделаю так, чтобы Моё имя помнили» сохраняет заявленную неоднозначность; альтернативы остаются в сноске.
