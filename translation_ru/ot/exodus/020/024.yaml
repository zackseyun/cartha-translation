  terminology: «Жертвенник», «всесожжения» и «мирные жертвы» уместны и точны. «Мелкий и крупный скот» адекватно передаёт צֹאן и בָּקָר. Формулировка «сделаю так, чтобы Моё имя помнили» передаёт каузативность без чрезмерно специального или двусмысленного оборота «установлю память».
  issues:
