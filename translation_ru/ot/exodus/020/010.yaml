  source_fidelity: 'Перечень субъектов запрета и значение ключевых слов в целом переданы точно. Однако «в твоих воротах» является буквальным, но по-русски неестественным воспроизведением древнееврейской метонимии: речь о живущем в пределах поселения/общины адресата, а не о нахождении у ворот. Связь субботы с Яхве лучше выразить естественной русской конструкцией, сохранив значение посвящённости предлога לְ.'
  naturalness: «Суббота Яхве, Богу твоему» звучит синтаксически шероховато из-за двух последовательно поставленных дательных форм. «Переселенец, находящийся в твоих воротах» также создаёт в современном русском буквальный и неверно конкретный образ. Предлагаемая редакция остаётся литературной и сдержанно-правовой.
  terminology: «Яхве», «раб», «рабыня» и «скот» уместны и точны. «Чужеземец, живущий в твоих поселениях» яснее передаёт גֵּר и смысл выражения «в твоих воротах», не стирая его в примечании.
