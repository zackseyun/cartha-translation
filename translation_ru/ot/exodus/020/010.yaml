base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/010.yaml
  text: but the seventh day is a Sabbath to Yahweh your God[a]; you shall not do any work—you, or your son, or your daughter, your male servant, or your female servant, or your livestock[c][b], or the sojourner within your gates.
translation:
  language: ru
  text: 'А седьмой день — суббота, посвящённая Яхве, твоему Богу[a]. Не делай никакой работы: ни ты, ни твой сын, ни твоя дочь, ни твой раб, ни твоя рабыня[b], ни твой скот, ни чужеземец, живущий в твоих поселениях[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «суббота для Яхве, твоего Бога». Еврейский предлог может выражать посвящённость, принадлежность или направленность.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейские слова обозначают раба и рабыню; традиционный перевод: «слуга и служанка».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в твоих воротах». В этом контексте «ворота» могут обозначать поселения или общины, находящиеся под властью адресата. «Чужеземец» — не местный по происхождению житель, живущий среди израильтян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹם הַשְּׁבִיעִי
  choice: А седьмой день
  rationale: Союз ו допускает простое соединение («и»), но в контексте противопоставляет седьмой день шести дням труда. Русское «а» естественно передаёт обе функции, не усиливая противопоставление до «но».
- source_word: שַׁבָּת
  choice: суббота
  rationale: Сохраняется ключевое существительное, обозначающее установленный день прекращения труда, без сведения его смысла к общему понятию отдыха.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Яхве, Богу твоему
  rationale: Предлог ל выражает посвящённость и принадлежность дня Яхве; приложение «Богу твоему» непосредственно передаёт אֱלֹהֶיךָ.
- source_word: לֹא תַעֲשֶׂה כָל מְלָאכָה
  choice: Не делай никакой работы
  rationale: Отрицательная правовая заповедь передана прямым русским повелением; «никакой» сохраняет всеохватность כָּל.
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: твой раб, ни твоя рабыня
  rationale: В перечне членов зависимого домохозяйства эти слова обозначают людей в рабском положении; перевод не смягчает историческую социальную реальность словом «слуга».
- source_word: וּבְהֶמְתֶּךָ
  choice: твой скот
  rationale: Собирательное обозначение домашних хозяйственных животных естественно передаётся русским словом «скот».
- source_word: וְגֵרְךָ
  choice: переселенец
  rationale: גֵּר — не просто незнакомец, а человек чужого происхождения, постоянно живущий среди Израиля и находящийся под его общественным порядком.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: находящийся в твоих воротах
  rationale: Сохранён древний образ ворот как обозначения пространства поселения под властью данной общины; добавленное причастие делает конструкцию грамматически естественной по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; личное заветное имя передано распространённой научно обоснованной русской формой, без замены титулом.
- issue: Круг тех, на кого распространяется субботний запрет
  choice: 'Сохранён полный перечень: адресат, его дети, рабы, скот и переселенец'
  alternative: Обобщить как «весь твой дом» или смягчить социальные категории
  rationale: Прямой перечень показывает, что прекращение работы распространяется не только на главу домохозяйства, и сохраняет напряжённую историческую реальность рабства, не оправдывая и не скрывая её.
translation_notes:
  register: Современный литературный русский язык с достоинством правового текста. Повтор «ни» делает охват запрета ясным и естественным. Порядок перечисления и древний образ «в воротах» сохранены; архаичные «пришелец» и «рабыня-служанка» не используются.
