  text: אָֽנֹכִ֖י יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/002.yaml
  text: I am Yahweh your God[a], who brought you out from the land of Egypt[b], from the house of servants.
translation:
  language: ru
  text: Я — Яхве[a], твой Бог, который вывел тебя из земли Египта, из дома рабов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. YHWH (יהוה), традиционно передаётся как «Господь»; здесь транслитерировано «Яхве».
    reason: alternative_reading
  - marker: b
    text: 'Идиоматически: «из дома рабства»; буквально по-еврейски: «из дома рабов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: Я —
  rationale: Самостоятельное местоимение имеет эмфатический оттенок. Тире естественно оформляет в русском языке торжественное безглагольное самоименование.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул; традиционный вариант указан в сноске.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Несмотря на формально множественную основу, здесь слово относится к единому Богу Израиля; суффикс второго лица мужского рода единственного числа передан словом «твой».
- source_word: אֲשֶׁר
  choice: который
  rationale: Относительное местоимение вводит определительное высказывание о Яхве и естественно передаётся русским «который».
- source_word: הוֹצֵאתִיךָ
  choice: вывел тебя
  rationale: Каузативная форма глагола יצא означает «вывести, заставить выйти». Выражение сохраняет прямое обращение к Израилю в единственном числе.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египта
  rationale: Предлог מן обозначает исходную точку, а конструкция с существительным «земля» сохранена без ненужного сглаживания до одного слова «Египет».
- source_word: מִבֵּית עֲבָדִים
  choice: из дома рабов
  rationale: Конкретный еврейский образ буквально говорит о «доме рабов». Слово «рабы» точнее «слуг» передаёт подневольное положение Израиля в Египте; более идиоматический вариант разъяснён в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит тетраграмматон — личное имя Бога. Транслитерация сохраняет различие между именем и титулом, а традиционная передача отмечена в сноске.
- issue: Передача עֲבָדִים в контексте египетского угнетения
  choice: рабы
  alternative: слуги
  rationale: Контекст принудительного труда и национальной неволи требует обозначения подневольного статуса; «слуги» ослабило бы смысл.
- issue: Образ בֵּית עֲבָדִים
  choice: дом рабов
  alternative: дом рабства
  rationale: Сохранён конкретный образ и множественное существительное оригинала. Более отвлечённое и привычное выражение «дом рабства» возможно, но не должно незаметно вытеснять буквальную метафору.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Единственное число «твой/тебя» сохраняет форму прямого обращения к Израилю как к одному адресату. Параллельное повторение «из… из…» воспроизводит структуру еврейской фразы.
