  text: לֹֽ֣א יִהְיֶֽה לְ/ךָ֛ אֱלֹהִ֥ים אֲחֵרִ֖ים עַל פָּנָֽ/יַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/003.yaml
  text: You shall have no other gods before me[a].
translation:
  language: ru
  text: Пусть не будет у тебя других богов предо Мною[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «кроме Меня» или «в Моём присутствии». Буквально: «перед Моим лицом».'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Пусть не будет у тебя
  rationale: Еврейская конструкция буквально выражает отсутствие или недопустимость существования чего-либо «у тебя». Русская формула сохраняет глагол «быть», отношение принадлежности и силу запрета, оставаясь естественной и торжественной.
- source_word: אֱלֹהִים
  choice: богов
  rationale: Форма множественного числа с определением «других» обозначает соперничающие божества; «богов» — прямой и понятный эквивалент.
- source_word: אֲחֵרִים
  choice: других
  rationale: Передаёт обычное значение «другие, иные», не добавляя отсутствующего в тексте уточнения «чужеземные».
- source_word: עַל פָּנָי
  choice: предо Мною
  rationale: 'Буквально выражение связано с лицом говорящего: «перед Моим лицом». Формула «предо Мною» сохраняет пространственно-реляционный образ и допускает подразумеваемое в контексте требование исключительной верности.'
theological_decisions:
- issue: Значение עַל פָּנָי в первой заповеди
  choice: предо Мною
  alternative: кроме Меня; в Моём присутствии
  rationale: Еврейское выражение допускает оттенок нахождения перед лицом Бога или в Его присутствии, а в контексте завета также указывает на исключительность поклонения. Основной текст сохраняет образную формулировку, а примечание сообщает возможные смысловые передачи, не сводя неоднозначность к одному толкованию.
translation_notes:
  register: Современный литературный русский с достоинством заповедной речи. «Предо Мною» слегка возвышенно, но понятно и точно сохраняет образ исходного текста; прописная буква в местоимении соответствует принятому русскому оформлению прямой Божьей речи.
