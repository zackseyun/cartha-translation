base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/007.yaml
  text: You shall not bear the name of Yahweh your God falsely[a], for Yahweh will not leave unpunished the one who bears his name falsely.
translation:
  language: ru
  text: Не носи имени Яхве, твоего Бога, напрасно[a], потому что Яхве не оставит без наказания того, кто носит Его имя напрасно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный перевод: «Не произноси имени Господа, Бога твоего, напрасно». Еврейский текст буквально говорит: «не носи имени ... для пустоты»; слово может означать также ложь, тщету или ничтожность. Запрет может включать ложную клятву, пустое призывание Божьего имени и неправомерное представление Бога тем, кто носит Его имя.'
    reason: Передаёт широкий смысл נשא שם לשוא, сохраняет традиционный вариант и поясняет, почему в основном тексте сохранён глагол «носить».
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: носи / носит
  rationale: Глагол נשא буквально означает «поднимать, нести». «Носить имя» сохраняет конкретный образ и повтор одного глагола в запрете и его обосновании; «употреблять» было бы уже и сводило бы смысл преимущественно к речи.
- source_word: שֵׁם / שְׁמוֹ
  choice: имени / Его имя
  rationale: Сохраняет прямое значение «имя» и явную отсылку к имени Яхве; в контексте имя включает Его явленную идентичность, репутацию и заветное притязание.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога
  rationale: Сохраняет обращение во втором лице единственного числа и личный, заветный характер формулы.
- source_word: לַשָּׁוְא
  choice: во лжи
  rationale: שָׁוְא охватывает ложь, пустоту, тщетность и ничтожность. «Во лжи» естественно по-русски сочетается с «носить имя», указывает на неправомерное представительство и ложное призывание, но примечание сохраняет более широкий диапазон слова.
- source_word: כִּי
  choice: потому что
  rationale: Вводит основание запрета и ясно выражает причинную связь в современном русском языке.
- source_word: יְנַקֶּה (נקה)
  choice: не оставит без наказания
  rationale: Порода piel здесь выражает отказ освободить от вины или наказания. Выбранная формулировка ясно передаёт судебный смысл и естественна для современного читателя.
- source_word: אֲשֶׁר
  choice: того, кто
  rationale: Естественно передаёт обобщённую относительную конструкцию, относящую предупреждение к любому поступающему так.
theological_decisions:
- issue: Объём запрета, связанного с Божьим именем
  choice: Широкий запрет ложно, пусто или недостойно носить имя Яхве, а не только запрет на определённые речевые формулы.
  alternative: Узкий запрет исключительно на ложные клятвы либо на бранное и легкомысленное произнесение имени.
  rationale: Сочетание נשא («нести») с שֵׁם («имя») и שָׁוְא («ложь, пустота, тщета») допускает ложные клятвы и пустое призывание, но не ограничивается ими; оно также может обозначать неправомерное представление Бога теми, кто носит Его имя.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, явленное Богу Израилю, не подменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксический повтор «носи / носит» намеренно сохраняет еврейскую композицию. Заглавная буква в «Его» служит русской издательской конвенции для ясной отсылки к Богу, не добавляя нового смысла.
