base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/011.yaml
  text: For in six days Yahweh made the heavens and the earth[a], the sea, and all that is in them, and he rested on the seventh day. Therefore Yahweh blessed the Sabbath day and made it holy.
translation:
  language: ru
  text: Ведь за шесть дней Яхве создал небо и землю, море и всё, что в них, а в седьмой день почил[a]. Поэтому Яхве благословил субботний день и освятил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прекратил работу». Древнееврейский глагол может обозначать как покой, так и прекращение работы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предшествующей заповеди; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: שֵׁשֶׁת יָמִים
  choice: за шесть дней
  rationale: Передаёт временной промежуток, в пределах которого совершено творение, и звучит естественно по-русски.
- source_word: עָשָׂה
  choice: создал
  rationale: В контексте происхождения неба, земли и моря русское «создал» естественно передаёт широкое значение «сделал», не добавляя описания способа творения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Сохраняет личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: небо и землю
  rationale: Устойчивая русская формула целокупности сотворённого мира; «небо» естественно передаёт древнееврейскую форму множественного числа в данном контексте.
- source_word: הַיָּם
  choice: море
  rationale: Сохраняет единственное число исходного текста.
- source_word: כָּל אֲשֶׁר בָּם
  choice: всё, что в них
  rationale: Близко и ясно передаёт всеохватную относительную конструкцию; местоимение относится к перечисленным областям творения.
- source_word: וַיָּנַח
  choice: покоился
  rationale: Передаёт отдых и прекращение труда в контексте субботы, не предполагая усталости; возможный оттенок прекращения работы отмечен в сноске.
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Ясно обозначает вывод из установленного при творении образца.
- source_word: בֵּרַךְ
  choice: благословил
  rationale: Стандартно передаёт дарование Богом благословения этому дню.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: и освятил его
  rationale: Сохраняет значение отделения дня как святого и местоименную связь с субботним днём.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя; транслитерация «Яхве» сохраняет его и не подменяет титулом.
- issue: Описание действия Бога в седьмой день
  choice: покоился
  alternative: прекратил трудиться
  rationale: Глагол נוח допускает смысл покоя и прекращения работы. Основной текст сохраняет образ покоя, а сноска отражает иной возможный оттенок, не истолковывая покой как следствие усталости.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся ясным для широкого читателя; причинная связь и параллелизм исходного текста сохранены. Маркер сноски поставлен непосредственно после спорного глагола.
