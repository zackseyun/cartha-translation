base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/019.yaml
  text: And they said to Moses[a], “You speak with us, and we will listen; but let not God speak with us, lest we die.”
translation:
  language: ru
  text: 'И сказали они Моисею: «Ты говори с нами, и мы будем слушать[a], но пусть Бог не говорит с нами, иначе мы умрём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будем внимать»; еврейский глагол может означать как слышание и внимательное слушание, так и готовность послушаться услышанного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И сказали они
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; простой глагол прошедшего времени с союзом естественно передаёт её по-русски.
- source_word: דַּבֵּר אַתָּה
  choice: Ты говори
  rationale: 'Повелительное наклонение вместе с явным местоимением подчёркивает противопоставление: говорить должен Моисей, а не Бог. Порядок слов «Ты говори» сохраняет это ударение.'
- source_word: עִמָּנוּ
  choice: с нами
  rationale: Предлог עִם обычно означает «с»; выражение «говори с нами» сохраняет оттенок непосредственного общения.
- source_word: וְנִשְׁמָעָה
  choice: и мы будем слушать
  rationale: Когортативная форма выражает готовность народа внимать словам Моисея. «Будем слушать» передаёт не только физическое восприятие речи, но и внимательный, отзывчивый слух, не превращая возможный оттенок послушания в однозначное утверждение.
- source_word: וְאַל יְדַבֵּר
  choice: но пусть ... не говорит
  rationale: Сочетание אַל с имперфектом имеет запретительно-желательное значение; «пусть не говорит» естественно передаёт его по-русски, а «но» обозначает контраст с предыдущей просьбой.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологически множественную форму существительного, единственное число глагола и контекст Синая указывают на единственного Бога Израиля.
- source_word: פֶּן נָמוּת
  choice: иначе мы умрём
  rationale: פֶּן вводит последствие, которого опасаются. «Иначе мы умрём» ясно и естественно выражает эту угрозу в современном русском языке.
theological_decisions:
- issue: Число и референт אֱלֹהִים
  choice: Бог, единственное число
  alternative: боги
  rationale: Контекст Синая и глагол в единственном числе грамматически указывают на Бога Израиля; множественное прочтение здесь контекстуально неприемлемо.
- issue: Степень выраженности послушания в וְנִשְׁמָעָה
  choice: мы будем слушать
  alternative: мы послушаемся
  rationale: Корень שׁמע может включать отзывчивое послушание, однако в данном контексте сохраняется и прямое значение слушания речи. Перевод не должен устранять эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной интонацией. Эмфатическое «Ты говори» сохраняет напряжённое противопоставление между посредничеством Моисея и непосредственной речью Бога.
