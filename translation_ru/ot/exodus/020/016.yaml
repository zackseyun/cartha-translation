  language: ru
  text: Не давай ложного свидетельства против ближнего твоего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не свидетельствуй ложно против ближнего твоего».'
    reason: 'Лексическая альтернатива: תַעֲנֶה в судебном контексте можно непосредственно передать глаголом «свидетельствовать».'
lexical_decisions:
- source_word: לֹא
  choice: не
  rationale: Стандартное отрицание, вводящее запрет; по-русски естественно передаётся конструкцией «не» с повелительной формой.
- source_word: תַעֲנֶה
  choice: давай свидетельства
  rationale: В данном судебно-правовом контексте глагол означает выступать со свидетельством, свидетельствовать. Выражение «давать свидетельство» сохраняет юридический смысл и звучит понятно в современном русском языке.
- source_word: בְרֵעֲךָ
  choice: против ближнего твоего
  rationale: Предлог בְּ в судебном контексте указывает на направленность свидетельства против другого лица. רֵעַ передано традиционным и достаточно ясным словом «ближний».
- source_word: עֵד
  choice: свидетельство
  rationale: Хотя существительное буквально может обозначать «свидетеля», в сочетании с глаголом ענה фраза описывает действие свидетельствования; русское «давать свидетельство» естественно передаёт эту конструкцию.
- source_word: שָׁקֶר
  choice: ложного
  rationale: Слово обозначает ложь или обман; «ложное свидетельство» — точное и устоявшееся русское юридико-библейское выражение.
