  text: Remember the Sabbath day[a], to keep it holy.
translation:
  language: ru
  text: Помни субботний день, чтобы освящать его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святить его»; «отделять его как святой день».'
    reason: Лексические варианты передают смысл посвящения дня Богу и обращения с ним как со святым.
lexical_decisions:
- source_word: זָכוֹר
  choice: Помни
  rationale: Форма от זכר употреблена как повеление и требует деятельно помнить о дне субботы. «Помни» прямо передаёт значение и сохраняет заветную силу заповеди, не сводя её только к соблюдению.
- source_word: אֶת
  choice: '[показатель определённого прямого дополнения, отдельно не переводится]'
  rationale: Служебное слово отмечает определённое прямое дополнение и не требует отдельного соответствия в русском тексте.
- source_word: יוֹם הַשַּׁבָּת
  choice: субботний день
  rationale: Естественное и укоренённое в русском библейском языке обозначение конкретного дня субботы; оно сохраняет как значение «день», так и особое название שַׁבָּת.
- source_word: לְקַדְּשׁוֹ
  choice: чтобы святить его
  rationale: 'Инфинитив с местоименным суффиксом выражает цель: относиться к этому дню как к святому, посвящая и отделяя его. «Святить» кратко и точно сохраняет лексику святости.'
theological_decisions:
- issue: Передача קדשׁ в заповеди о субботе
  choice: чтобы святить его
  alternative: чтобы освящать его; чтобы отделять его как святой
  rationale: Еврейское выражение охватывает признание дня святым, его посвящение и отделение. Выбранный вариант сохраняет богословскую насыщенность, не сужая смысл до одного лишь ритуального соблюдения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Порядок слов естественный; глагол «святить» понятен в религиозном контексте и сохраняет краткость еврейской заповеди.
