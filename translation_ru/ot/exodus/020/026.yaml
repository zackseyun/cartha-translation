  text: And you shall not go up by steps to my altar[a], so that your nakedness may not be exposed on it.
translation:
  language: ru
  text: Не поднимайся по ступеням на Мой жертвенник, чтобы над ним не открылась твоя нагота.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲלֶה
  choice: не поднимайся
  rationale: Глагол עלה означает «подниматься, восходить»; форма с לֹא выражает прямой запрет. Единственное число соответствует древнееврейскому тексту.
- source_word: בְמַעֲלֹת
  choice: по ступеням
  rationale: מַעֲלוֹת обозначает ступени или лестницу; сочетание «подниматься по ступеням» естественно для современного русского языка и точно передаёт предлог בְּ.
- source_word: מִזְבְּחִי
  choice: к Моему жертвеннику
  rationale: מִזְבֵּחַ с суффиксом первого лица единственного числа означает «Мой жертвенник»; предлог «к» естественно сочетается в русском с глаголом движения «подниматься».
- source_word: אֲשֶׁר לֹא
  choice: чтобы не
  rationale: В данном контексте сочетание вводит отрицательное следствие или цель запрета. «Чтобы не» ясно передаёт эту связь, не устраняя возможный оттенок предостережения.
- source_word: תִּגָּלֶה
  choice: обнажилась
  rationale: Нифаль от גלה имеет значение «быть открытым, обнажиться». Русское «обнажилась» сохраняет пассивно-результативный смысл и естественно сочетается со словом «нагота».
- source_word: עֶרְוָתְךָ
  choice: твоя нагота
  rationale: עֶרְוָה обозначает наготу, в том числе интимное обнажение. Выбор сохраняет прямоту оригинала, не сужая значение до конкретных частей тела.
- source_word: עָלָיו
  choice: над ним
  rationale: Местоименный суффикс относится к жертвеннику. При подъёме по ступеням нагота оказывается открыта над жертвенником; «над ним» передаёт пространственное отношение естественнее русского «на нём» и сохраняет мужской референт.
theological_decisions:
- issue: Причина запрета подниматься к жертвеннику по ступеням
  choice: Передать прямо названную в тексте заботу о том, чтобы нагота поклоняющегося не оказалась обнажена над жертвенником.
  alternative: Истолковать запрет как символ смирения перед Богом либо прямо связать его с особенностями священнической одежды.
  rationale: Древнееврейский текст называет телесное обнажение непосредственной причиной запрета, но не объясняет его символически и не упоминает здесь священнические одежды. Перевод не должен добавлять такую конкретизацию.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Сохранено обращение во втором лице единственного числа, как в древнееврейском тексте. Заглавная буква в «Моему» используется как принятая в русском библейском стиле форма почтительного обозначения Бога.
