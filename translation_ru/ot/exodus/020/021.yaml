  text: וַ/יַּעֲמֹ֥ד הָ/עָ֖ם מֵ/רָחֹ֑ק וּ/מֹשֶׁה֙ נִגַּ֣שׁ אֶל הָֽ/עֲרָפֶ֔ל אֲשֶׁר שָׁ֖ם הָ/אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/021.yaml
  text: The people stood at a distance[a], and Moses approached the thick darkness where God was.
translation:
  language: ru
  text: Народ стоял вдали, а Моисей приблизился к густому мраку[a], где был Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тёмному облаку»; или: «мгле». Еврейское слово может обозначать плотную тьму, связанную с явлением Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: стоял
  rationale: Форма повествует о положении, которое занял и сохранял народ; «стоял» кратко и естественно передаёт это значение.
- source_word: הָעָם
  choice: народ
  rationale: С определённым артиклем слово обозначает уже упомянутый собравшийся у Синая народ; добавлять «Израиля» нет необходимости.
- source_word: מֵרָחֹק
  choice: вдали
  rationale: Выражение обозначает пространственную удалённость; «вдали» естественно и лаконично передаёт её без усиления.
- source_word: נִגַּשׁ
  choice: приблизился
  rationale: Глагол означает «подойти, приблизиться»; такой перевод не утверждает сверх текста, что Моисей вошёл внутрь мрака.
- source_word: הָעֲרָפֶל
  choice: густой мрак
  rationale: Слово обозначает плотную тьму или мглу, в том числе связанную с явлением Бога. «Густой мрак» сохраняет конкретность и торжественную напряжённость образа.
- source_word: אֲשֶׁר שָׁם הָאֱלֹהִים
  choice: где был Бог
  rationale: Относительное придаточное прямо указывает место Божьего присутствия; буквальное отдельное воспроизведение שָׁם в русском было бы избыточным.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: В данном контексте форма однозначно относится к Богу Израиля и передаётся единственным числом.
theological_decisions:
- issue: Явление Бога во мраке
  choice: «густой мрак, где был Бог»
  alternative: «тёмное облако» или «мгла, где присутствовал Бог»
  rationale: Перевод сохраняет парадокс Божьего присутствия, связанного с непроницаемостью и недоступностью, не сводя образ лишь к погодному явлению и не добавляя поясняющего «присутствовал».
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным построением фразы. Сохранён контраст между народом, стоящим вдали, и Моисеем, приближающимся к мраку. Сноска поставлена непосредственно после слова «мраку», к которому относится лексическая альтернатива.
