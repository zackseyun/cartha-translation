language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לֹֽ֣א תַֽעֲשֶׂ֨ה לְ/ךָ֥ פֶ֨סֶל֙ וְ/כָל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/004.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[c][b], or in the waters under the earth.
translation:
  language: ru
  text: Не делай себе резного изображения[a] и никакого образа[b] того, что на небесах вверху, что на земле внизу и что в водах под землёй[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изваяния». Еврейское слово обозначает изображение, вырезанное или высеченное из материала; перевод «идол» был бы более истолковывающим.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подобия» либо «изображения».'
    reason: lexical_alternative
  - marker: c
    text: 'Стих описывает сотворённый мир в пространственных представлениях древности: небеса вверху, землю внизу и воды под землёй.'
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: Не делай себе
  rationale: 'Сочетание לֹא с имперфектом выражает прямой запрет, а לְךָ передаёт личную направленность действия: «себе».'
- source_word: פֶסֶל
  choice: резное изображение
  rationale: Слово обозначает изображение, изготовленное посредством высекания или резьбы. Этот вариант точнее нейтрального «идол» и понятнее несколько книжного «изваяние».
- source_word: וְכָל תְּמוּנָה
  choice: и никакого образа
  rationale: В отрицательной конструкции כָּל естественно передаётся как «никакого»; תְּמוּנָה может означать образ, подобие или изображение. «Образ» сохраняет широту значения и не дублирует полностью предыдущее выражение.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: того, что на небесах вверху
  rationale: Сохранены множественная форма שָׁמַיִם и пространственное противопоставление «вверху — внизу».
- source_word: וַאֲשֶׁר בָּאָרֶץ מִתָּחַת
  choice: что на земле внизу
  rationale: Предлог ב передан естественным русским оборотом «на земле», а מִתַּחַת — как «внизу».
- source_word: וַאֲשֶׁר בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: и что в водах под землёй
  rationale: Перевод сохраняет пространственный образ вод, находящихся под землёй, не заменяя его современным космологическим объяснением.
theological_decisions:
- issue: Объём запрета второй заповеди
  choice: Текст прямо запрещает делать резное изображение и какой-либо образ из перечисленных областей творения, не добавляя в переводе цели поклонения.
  alternative: Передать פֶסֶל как «идол» либо добавить «для поклонения»; или сформулировать стих как явный запрет всякого изобразительного искусства.
  rationale: Сам стих не содержит слов «для поклонения», хотя следующий стих вводит поклонение и служение. Поэтому перевод не сужает и не расширяет формулировку, а сохраняет её напряжение и позволяет ближайшему контексту уточнять смысл.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой заповеди. Сохранены параллельная структура и древняя пространственная образность; архаизм «кумир» и избыточно интерпретирующее «идол» в основном тексте не употреблены.
