lexical_decisions:
- source_word: לֹא
  choice: не
  rationale: Стандартное еврейское отрицание; вместе с формой глагола передаёт категорический запрет и естественно выражается по-русски конструкцией «не» с повелительным наклонением.
- source_word: תִּנְאָף
  choice: прелюбодействуй
  rationale: Глагол נאף в породе qal означает совершать прелюбодеяние. Русский глагол «прелюбодействовать» точно и традиционно передаёт юридически-нравственный смысл запрета; форма 2-го лица единственного числа сохраняет прямое личное обращение.
theological_decisions:
- issue: Форма запрета в Десяти заповедях
  choice: Не прелюбодействуй.
  alternative: Не совершай прелюбодеяния.
  rationale: Еврейская конструкция לֹא с имперфектом 2-го лица единственного числа имеет силу категорического заветного запрета. Краткая русская форма с отрицательным повелительным наклонением естественна, торжественна и сохраняет лаконизм оригинала.
- issue: Охват формы мужского рода единственного числа
  choice: Прямое обращение во 2-м лице единственного числа без указания пола
  alternative: Формулировка, явно обращённая только к мужчине
  rationale: В еврейском глагол имеет форму мужского рода единственного числа, но в Десяти заповедях она служит представительным обращением к члену сообщества завета. Русская форма «прелюбодействуй» не маркирует пол и не вводит неоправданного ограничения.
translation_notes:
  register: Современный литературный русский язык с достоинством и предельной краткостью, соответствующей аподиктической форме Десяти заповедей. Слово «прелюбодействуй» несколько возвышенно, но общепонятно и точно в библейском и нравственно-правовом контексте.
