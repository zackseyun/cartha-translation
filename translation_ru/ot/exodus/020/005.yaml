revisions:
- from: Не поклоняйся им[a] и не служи им[b], потому что Я — Яхве, твой Бог, Бог ревнивый, взыскивающий с детей за беззаконие отцов до третьего и четвёртого поколения тех, кто ненавидит Меня[c][d].
  to: Не поклоняйся им[a] и не служи им[b], ибо Я — Яхве, твой Бог, ревнивый Бог, взыскивающий беззаконие отцов на детях — на третьем и на четвёртом поколениях тех, кто ненавидит Меня[c][d].
  rationale: 'Исправление сохраняет два разных глагола запрета, личное имя Яхве и смысл קַנָּא как исключительной, «ревнивой» верности. Центральная формула приведена ближе к еврейскому образу: «взыскивающий беззаконие отцов на детях» не предрешает, как именно следует понимать פֹּקֵד и עָוֹן, в отличие от более конкретных «наказывает» или «взыскивает с детей за». Повтор «на третьем и на четвёртом» отражает оба употребления עַל в оригинале. Примечания исправлены так, чтобы оставаться естественными по-русски и не выдавать альтернативный синтаксис за единственное толкование.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:00:29Z'
