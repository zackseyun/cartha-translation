  verdict: revise
  source_fidelity: Начальное «Не поклоняйся им и не служи им» верно сохраняет различие בין השתחוה и עבד. Однако «взыскивающий с детей за беззаконие отцов» несколько сильнее оформляет еврейский оборот как прямое взыскание с детей, а «до третьего и четвёртого поколения тех, кто ненавидит Меня» не вполне ясно передаёт синтаксическую связь заключительного определения. Более буквальная и при этом понятная формула с «на детях» лучше сохраняет образ פֹּקֵד עֲוֹן ... עַל־בָּנִים и не разрешает спорный вопрос о механизме этого посещения.
  naturalness: «Бог ревнивый» возможно, но в современном литературном русском естественнее «ревнивый Бог». «Потому что» допустимо, однако «ибо» лучше соответствует торжественно-законодательному регистру данного изречения. Формула «взыскивающий беззаконие отцов на детях» намеренно несколько приподнята, но ясна в контексте и позволяет не заменять исходный образ однозначным «наказывает».
  terminology: '«Яхве», «Бог», «ревнивый», «беззаконие», «отцы» и «дети» выбраны удачно. Следует исправить примечание a: «простирайся перед ними» не является естественным русским обозначением простирания ниц; «падай перед ними ниц» точнее передаёт телесный аспект глагола. Примечание d не должно пояснять вариант как однозначно равный основному прочтению: это альтернативная синтаксическая возможность.'
