  text: לֹֽא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָֽנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָבֹ֧ת עַל בָּנִ֛ים עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/005.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, on the third and on the fourth generations of those who hate me[d][c][b],
translation:
  language: ru
  text: Не поклоняйся им[a] и не служи им[b], ибо Я — Яхве, твой Бог, ревнивый Бог, взыскивающий беззаконие отцов на детях — на третьем и на четвёртом поколениях тех, кто ненавидит Меня[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не падай перед ними ниц»; еврейский глагол обозначает преклонение перед кем-либо или чем-либо в знак почитания.'
    reason: lexical_alternative
  - marker: b
    text: Здесь «служить» может означать совершать культовое служение, то есть поклоняться идолам.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «посещающий беззаконие отцов на детях». Такая формулировка сохраняет еврейский оборот; о личной ответственности см. также Второзаконие 24:16 и Иезекииль 18.'
    reason: cross_reference
  - marker: d
    text: 'Возможен перевод: «до третьего и четвёртого поколения тех, кто ненавидит Меня».'
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: поклоняйся
  rationale: Глагол обозначает преклонение или простирание перед почитаемым объектом. «Поклоняться» естественно передаёт это действие по-русски, а примечание сохраняет его конкретный телесный оттенок.
- source_word: תָעָבְדֵם
  choice: служи им
  rationale: «Служить» сохраняет отличие עבד от предшествующего глагола и в данном контексте подразумевает культовое служение идолам.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени транслитерацией сохраняет имя Бога, присутствующее в еврейском тексте, вместо замены его титулом.
- source_word: אֵל קַנָּא
  choice: Бог ревнивый
  rationale: «Ревнивый» передаёт исключительное право Бога на верность народа и Его неприятие соперничающего поклонения; «ревностный» ослабило бы этот реляционный смысл.
- source_word: פֹּקֵד
  choice: взыскивающий
  rationale: פקד здесь выражает деятельный судебный ответ Бога. Русское «взыскивающий» сохраняет юридическую весомость, не сводя смысл исключительно к механическому наказанию.
- source_word: עֲוֺן
  choice: беззаконие
  rationale: Слово может охватывать проступок, вину и её последствия; «беззаконие» сохраняет нравственную тяжесть и некоторую смысловую широту.
- source_word: אָבֹת
  choice: отцов
  rationale: Сохраняется конкретное мужское множественное число исходного текста и традиционная формула предупреждения.
- source_word: בָּנִים
  choice: детей
  rationale: В межпоколенческой формуле слово обозначает потомков и не обязательно только сыновей; «детей» естественно передаёт этот охват.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: до третьего и четвёртого поколения
  rationale: Порядковые числительные употреблены эллиптически о поколениях. Добавление «поколения» делает смысл ясным; «до» естественно выражает временной охват по-русски.
- source_word: לְשֹׂנְאָי
  choice: тех, кто ненавидит Меня
  rationale: Фраза сохраняет ограничение предупреждения линией тех, кто отвергает Бога, и передаёт её личностный характер.
theological_decisions:
- issue: Передача Божьей ревности
  choice: Бог ревнивый
  alternative: Бог ревностный
  rationale: Контекст касается исключительной заветной верности и запрета идолопоклонства. «Ревнивый» сохраняет напряжённость и силу законного исключительного требования Бога.
- issue: Межпоколенческое взыскание
  choice: взыскивающий с детей за беззаконие отцов до третьего и четвёртого поколения тех, кто ненавидит Меня
  alternative: карающий детей за грех отцов до третьего и четвёртого поколения
  rationale: Формулировка не устраняет напряжение исходного текста, но избегает более узкого истолкования פקד как исключительно прямого наказания детей. Примечания указывают буквальную конструкцию и связанные места о личной ответственности.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Единственное число повеления соответствует обращению к каждому члену Израиля. Порядок примечаний приведён к последовательности их появления в тексте.
