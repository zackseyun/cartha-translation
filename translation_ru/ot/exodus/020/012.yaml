base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/012.yaml
  text: Honor your father and your mother[b][a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: ru
  text: Почитай своего отца и свою мать, чтобы дни твои были долгими[a] на земле[b], которую Яхве, твой Бог, даёт тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «дни твои были долгими» означает долгую жизнь.
    reason: cultural_note
  - marker: b
    text: 'Возможен перевод: «в земле». Древнееврейский предлог буквально означает «на, над», однако в данном контексте «земля» может обозначать страну или территорию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד
  choice: Почитай
  rationale: Повелительная форма породы пиэль от כבד требует относиться к родителям как к достойным чести. «Почитай» передаёт не только внутреннее уважение, но и деятельное признание их значимости.
- source_word: אָבִיךָ וְאֶת אִמֶּךָ
  choice: своего отца и свою мать
  rationale: Естественная русская передача существительных с суффиксом 2-го лица единственного числа; возвратные притяжательные местоимения устраняют стилистическую тяжеловесность без изменения смысла.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое или результативное отношение между заповедью и следующим за ней обещанием, не сводя намеренно возможный оттенок только к одной категории.
- source_word: יַאֲרִכוּן יָמֶיךָ
  choice: дни твои были долгими
  rationale: Сохраняет образное древнееврейское выражение и его библейское звучание; смысл долгой жизни пояснён в сноске.
- source_word: עַל הָאֲדָמָה
  choice: на земле
  rationale: «Земля» здесь обозначает землю, даруемую Израилю, а предлог «на» близко соответствует עַל. Возможное по-русски «в земле» отмечено в сноске, поскольку речь идёт также о стране или территории.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Прямая и естественная передача сочетания существительного с суффиксом 2-го лица единственного числа.
- source_word: נֹתֵן לָךְ
  choice: даёт тебе
  rationale: Причастная форма обозначает продолжающееся или актуальное дарование; настоящее время естественно по-русски и соответствует ситуации у Синая, когда земля обещана, но ещё не занята.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение הָאֲדָמָה в обещании
  choice: земля, даруемая Израилю
  alternative: почва; вся земля
  rationale: Контекст Десяти заповедей и уточнение «которую… даёт тебе» указывают на даруемую народу землю, но перевод не добавляет отсутствующее в тексте определение «обетованная».
- issue: Связь заповеди с долгой жизнью
  choice: сохранена формула цели или результата «чтобы»
  alternative: жёстко причинная формулировка гарантии каждому отдельному человеку
  rationale: לְמַעַן допускает целевой и результативный оттенки. Перевод сохраняет данное в тексте обещание, не добавляя систематического объяснения его применения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов «дни твои» сохраняет исходный образ и торжественный ритм, не делая фразу архаичной. Обращение во 2-м лице единственного числа сохранено.
