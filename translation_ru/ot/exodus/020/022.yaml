base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/022.yaml
  text: 'Then Yahweh said to Moses[c][b][a], “Thus you shall say to the sons of Israel: You yourselves have seen that I have spoken to you from heaven.”'
translation:
  language: ru
  text: 'Затем Яхве сказал Моисею: «Так скажи сынам Израиля[a]: „Вы сами видели, что Я говорил с вами[b] с неба[c]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам», «народу Израиля». Буквально: «сынам Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «говорил вам». Буквально в еврейском тексте: «говорил с вами», что подчёркивает непосредственность встречи.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «с небес»; в еврейском употреблена форма множественного числа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Затем … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «затем» естественно передаёт эту связь по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога (тетраграмматон), а не заменяет его титулом.
- source_word: כֹּה תֹאמַר
  choice: Так скажи
  rationale: Краткая и естественная русская передача стандартной формулы посланника.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальный образ еврейского выражения и его собирательное обозначение народа завета.
- source_word: אַתֶּם רְאִיתֶם
  choice: Вы сами видели
  rationale: Самостоятельное местоимение אַתֶּם при глаголе имеет эмфатическую функцию, которую передаёт «сами».
- source_word: כִּי
  choice: что
  rationale: В данном контексте союз вводит содержание увиденного.
- source_word: מִן הַשָּׁמַיִם
  choice: с неба
  rationale: Естественная русская идиома для исходящего с небес божественного голоса; грамматическое множественное число отмечено в сноске.
- source_word: דִּבַּרְתִּי עִמָּכֶם
  choice: Я говорил с вами
  rationale: Предлог עִם буквально означает «с» и подчёркивает непосредственную встречу; совершенная форма описывает уже состоявшееся событие, очевидцами которого они являются.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя Бога. Транслитерация «Яхве» сохраняет отличие имени от титула и наиболее вероятную реконструкцию произношения.
- issue: Собирательное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам; народу Израиля; детям Израиля
  rationale: Формулировка сохраняет явный образ исходного текста, при этом в контексте относится ко всему народу Израиля.
- issue: Характер Божьего обращения דִּבַּרְתִּי עִמָּכֶם
  choice: говорил с вами
  alternative: говорил вам
  rationale: «С вами» сохраняет значение предлога עִם и оттенок непосредственного общения, не утверждая при этом полноценного двустороннего диалога.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным звучанием. Формула «Так скажи» сохраняет достоинство прямой речи; «сынам Израиля» намеренно оставлено как близкое к исходному образное выражение и пояснено в сноске.
