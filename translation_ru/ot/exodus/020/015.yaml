lexical_decisions:
- source_word: לֹא
  choice: не
  rationale: Обычное еврейское отрицание; вместе с формой имперфекта выражает прямой запрет.
- source_word: תִּגְנֹב
  choice: кради
  rationale: Форма qal, имперфект, 2-е лицо единственного числа от גנב. Без названного объекта глагол имеет общий смысл «красть», а не более узкий «похищать человека». Русская формула «Не кради» сохраняет краткость, прямоту и торжественный характер заповеди.
theological_decisions:
- issue: Форма запрета в Десяти заповедях
  choice: Не кради.
  alternative: Ты не должен красть.
  rationale: Еврейская конструкция לֹא + имперфект выражает категорический запрет. В современном русском краткая форма «Не кради» естественна, общеупотребительна и сохраняет юридико-заветную силу исходного текста без добавления местоимения или модального глагола.
translation_notes:
  register: Краткий, торжественный и понятный современному читателю стиль. Традиционная формулировка не является архаичной; она точно передаёт лаконизм еврейского текста.
