  text: שֵׁ֤שֶׁת יָמִים֙ תַּֽעֲבֹ֔ד וְ/עָשִׂ֖יתָ כָּל מְלַאכְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/009.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: ru
  text: Шесть дней трудись и делай всю свою работу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В течение шести дней работай».'
    reason: Лексико-синтаксический вариант, явно выражающий длительность и передающий תַּעֲבֹד нейтральным глаголом «работай».
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Шесть дней
  rationale: Сочетание числительного с существительным естественно передаёт длительность без добавления отсутствующего в еврейском тексте предлога.
- source_word: תַּעֲבֹד
  choice: трудись
  rationale: Глагол עבד в породе qal означает «работать, трудиться, служить»; здесь повелительная форма по-русски ясно передаёт предписывающую силу имперфекта в законодательном контексте.
- source_word: וְעָשִׂיתָ
  choice: и делай
  rationale: Широкое значение עשה — «делать, совершать»; в сочетании со словом «работа» естественно звучит «делай».
- source_word: כָּל
  choice: всю
  rationale: 'כָּל в данном сочетании означает полноту объёма и согласуется по-русски с существительным женского рода: «всю».'
- source_word: מְלַאכְתֶּךָ
  choice: свою работу
  rationale: מְלָאכָה обозначает работу, занятие или дело. Возвратное «свою» естественно для русского языка при подлежащем второго лица и точно передаёт притяжательный суффикс.
theological_decisions:
- issue: Предписывающая сила имперфекта в заповеди о субботе
  choice: трудись
  alternative: можешь трудиться; будешь трудиться
  rationale: В контексте Десяти заповедей форма выражает наставление или предписание, а не простое предсказание и не только разрешение. Русское повелительное наклонение сохраняет эту юридически-наставительную силу.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, достойная и доступная. «Трудись» сохраняет серьёзный тон заповеди, а «делай всю свою работу» естественно передаёт вторую часть стиха.
