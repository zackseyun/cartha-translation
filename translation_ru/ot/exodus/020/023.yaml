source:
  edition: WLC
  text: לֹ֥א תַעֲשׂ֖וּ/ן אִתִּ֑/י אֱלֹ֤הֵי כֶ֨סֶף֙ וֵ/אלֹהֵ֣י זָהָ֔ב לֹ֥א תַעֲשׂ֖וּ לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/023.yaml
  text: You shall not make gods of silver alongside me[a], nor shall you make for yourselves gods of gold.
translation:
  language: ru
  text: Не делайте наряду со Мною[a] богов из серебра и не делайте себе богов из золота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со Мною»; возможно также: «рядом со Мною».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲשׂוּן / תַעֲשׂוּ
  choice: не делайте
  rationale: Глагол עשה здесь обозначает изготовление предметов культа. «Делать» естественно и прямо передаёт запрет, не уточняя без необходимости способ изготовления.
- source_word: אִתִּי
  choice: наряду со Мною
  rationale: Буквально предлог означает «со Мною». В данном контексте «наряду со Мною» естественно выражает отношение идолов к поклонению Богу, сохраняя при этом отмеченную в сноске буквальную возможность.
- source_word: אֱלֹהֵי כֶסֶף
  choice: богов из серебра
  rationale: Русское «боги из серебра» ясно передаёт вещество изготовленных изображений и звучит естественнее буквального «боги серебра».
- source_word: וֵאלֹהֵי זָהָב
  choice: и не делайте себе богов из золота
  rationale: Повтор отрицания и глагола сохранён, как в еврейском тексте; союз «и» естественно соединяет два параллельных запрета.
- source_word: לָכֶם
  choice: себе
  rationale: Возвратное «себе» кратко и идиоматично передаёт значение «для вас самих», то есть изготовление этих богов для собственного почитания.
- source_word: לֹא ... לֹא
  choice: не делайте ... и не делайте
  rationale: Повторное отрицательное повеление сохраняет параллелизм и обязательную силу двух запретов.
theological_decisions:
- issue: Следует ли истолковывать אִתִּי как запрет ставить иных богов рядом с Богом
  choice: наряду со Мною
  alternative: со Мною; рядом со Мною
  rationale: Контекст указывает на недопустимость соперничающего культа, однако буквальное значение предлога — «со Мною». Основной текст передаёт контекстуальный смысл без чрезмерного уточнения, а сноска сохраняет буквальную форму и другую возможную передачу.
translation_notes:
  register: Современный литературный русский язык с прямым, достойным и понятным звучанием законодательного запрета. Местоимение «Мною» написано с прописной буквы как традиционное русское обозначение Бога в прямой речи.
