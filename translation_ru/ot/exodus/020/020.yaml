  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל הָ/עָם֮ אַל תִּירָאוּ֒ כִּ֗י לְ/בַֽ/עֲבוּר֙ נַסּ֣וֹת אֶתְ/כֶ֔ם בָּ֖א הָ/אֱלֹהִ֑ים וּ/בַ/עֲב֗וּר תִּהְיֶ֧ה יִרְאָת֛/וֹ עַל פְּנֵי/כֶ֖ם לְ/בִלְתִּ֥י תֶחֱטָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/020.yaml
  text: And Moses said to the people[a], “Do not fear, for God has come to test you, and so that the fear of him may be before you[c][b], so that you may not sin.”
translation:
  language: ru
  text: 'Моисей сказал народу: «Не бойтесь[a]. Бог пришёл, чтобы испытать вас и чтобы страх перед Ним[b] всегда был у вас перед глазами[c], чтобы вы не грешили».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не страшитесь». В еврейском тексте здесь и далее, в выражении «страх перед Ним», употреблён один и тот же корень, что создаёт намеренный контраст между испугом и должным страхом перед Богом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «благоговение перед Ним». Еврейское существительное может означать не только боязнь, но и благоговейный трепет.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «на ваших лицах» — образ того, что постоянно находится перед человеком и остаётся в его сознании.'
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: Не бойтесь
  rationale: Глагол ירא может обозначать страх, ужас или благоговение. Здесь запрещён испуг перед богоявлением, тогда как далее говорится о должном страхе перед Богом. Естественное русское «не бойтесь» сохраняет смысловой контраст со словом «страх».
- source_word: לְבַעֲבוּר
  choice: чтобы
  rationale: Оборот вводит цель прихода Бога; русское «чтобы» ясно и естественно передаёт целевое значение.
- source_word: נַסּוֹת
  choice: испытать
  rationale: Глагол נסה означает подвергнуть испытанию, проверить. «Испытать» точно передаёт смысл и не подразумевает склонения ко злу.
- source_word: בָּא
  choice: пришёл
  rationale: Форма совершенного вида описывает состоявшийся приход Бога в непосредственной сцене у Синая. Русское прошедшее совершенного вида естественно передаёт это значение.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Здесь существительное обозначает Бога Израиля; тетраграмматон в стихе не употреблён.
- source_word: וּבַעֲבוּר
  choice: и чтобы
  rationale: Второе употребление оборота также вводит цель; повтор «чтобы» сохраняет параллельное построение исходного текста.
- source_word: יִרְאָתוֹ
  choice: страх перед Ним
  rationale: Существительное יִרְאָה может обозначать как страх, так и благоговейный трепет. «Страх перед Ним» сохраняет неоднозначность и смысловую связь с начальным «не бойтесь», не снимая напряжения толкованием.
- source_word: עַל־פְּנֵיכֶם
  choice: всегда был у вас перед глазами
  rationale: Буквально «на ваших лицах»; это образ постоянного присутствия перед человеком или в его сознании. Русский оборот «быть перед глазами» естественно передаёт образ, а «всегда» проясняет его устойчивый характер.
- source_word: לְבִלְתִּי תֶחֱטָאוּ
  choice: чтобы вы не грешили
  rationale: Конструкция выражает отрицательную цель; выбранная формулировка ясна, естественна и сохраняет целевое значение.
theological_decisions:
- issue: Кажущееся противоречие между «не бойтесь» и «страх перед Ним»
  choice: Сохранить оба обозначения страха в основном тексте
  alternative: Передать первое как «не пугайтесь», а второе как «благоговение перед Ним»
  rationale: Еврейский текст намеренно употребляет один корень, противопоставляя панический страх должному страху перед Богом. Русские «бойтесь» и «страх» не однокоренные, но сохраняют явную смысловую связь и не устраняют богословское напряжение.
- issue: Характер Божьего испытания
  choice: Передать נַסּוֹת как «испытать» без добавочного нравственного пояснения
  alternative: «проверить» или «подвергнуть испытанию»
  rationale: Стих говорит о проверке народа с целью удержать его от греха. «Испытать» не вносит представления о склонении ко злу и не добавляет отсутствующего в тексте доктринального истолкования.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейского повествования синтаксисом. Повтор целевого союза «чтобы» сохраняет структуру оригинала. Формулировка «у вас перед глазами» передаёт древнееврейский образ естественным русским оборотом; добавление «всегда» раскрывает подразумеваемое постоянное присутствие, отмеченное в сноске.
