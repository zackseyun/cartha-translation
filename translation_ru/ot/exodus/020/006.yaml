  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: ru
  text: но проявляющий неизменную любовь к тысячам[a] — тем, кто любит Меня и соблюдает Мои заповеди.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тысяче поколений» (ср. Второзаконие 5:10); буквально в еврейском тексте: «тысячам».'
    reason: Альтернативное понимание эллиптического выражения לַאֲלָפִים.
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: но являющий
  rationale: Причастие продолжает описание Бога из предыдущего стиха. Союз «но» естественно передаёт контраст между наказанием и милостью, а «являющий» сохраняет продолженную причастную конструкцию.
- source_word: חֶסֶד
  choice: неизменную любовь
  rationale: Слово обозначает верную, устойчивую любовь и благость в отношениях завета. «Неизменная любовь» передаёт постоянство этой любви, не сужая смысл до одного лишь сострадания.
- source_word: לַאֲלָפִים
  choice: тысячам
  rationale: В еврейском тексте буквально стоит «тысячам», без выраженного существительного «поколения». Основной текст сохраняет эту краткость и неоднозначность.
- source_word: לְאֹהֲבַי
  choice: тем, кто любит Меня
  rationale: Причастие с местоименным суффиксом естественно передаётся по-русски определительным оборотом, обозначающим людей, постоянно любящих Бога.
- source_word: וּלְשֹׁמְרֵי
  choice: и соблюдает
  rationale: В сочетании с заповедями שׁמר означает их хранить и исполнять; современное русское «соблюдает» точно и естественно передаёт этот смысл.
- source_word: מִצְוֺתָי
  choice: Мои заповеди
  rationale: «Заповеди» сохраняет правовой и заветный регистр Десяти заповедей.
theological_decisions:
- issue: Значение לַאֲלָפִים
  choice: тысячам
  alternative: тысяче поколений; тысячам поколений
  rationale: Сам стих не содержит слова «поколения», поэтому оно не добавлено в основной текст. Возможное понимание в смысле поколений отмечено в сноске на основании контекста и параллели во Второзаконии 5:10.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим контексту Десяти заповедей. Начальное «но» и причастие сохраняют синтаксическую связь с предыдущим стихом; прописные местоимения при обращении к Богу следуют принятому русскому библейскому регистру.
