base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/018.yaml
  text: All the people were seeing the thunder and the flashes of fire[a], and the sound of the trumpet, and the mountain smoking; and when the people saw it[c][b], they trembled and stood at a distance.
translation:
  language: ru
  text: Весь народ видел раскаты грома[a], вспышки огня[b], звук рога и дымящуюся гору. Увидев всё это[c], народ задрожал и встал поодаль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «звуки» или «голоса»; здесь, вероятно, имеются в виду раскаты грома.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «факелы»; в этом контексте слово, вероятно, обозначает огненные вспышки, подобные молниям.'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте сказано, что народ «видел» явления, среди которых названы и звуки. Такой необычный образ передаёт ошеломляющую силу происходящего.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים
  choice: видел
  rationale: Причастие изображает продолжающееся восприятие сцены; в русском длительность достаточно передаётся контекстом, а форма «видел» сохраняет ключевой глагол зрения.
- source_word: הַקּוֹלֹת
  choice: раскаты грома
  rationale: Буквально «звуки» или «голоса»; в контексте синайской теофании множественное число естественно обозначает громовые раскаты.
- source_word: הַלַּפִּידִם
  choice: вспышки огня
  rationale: Буквально «факелы»; контекст указывает на яркие огненные, подобные молниям вспышки, но перевод не сводит образ однозначно к молниям.
- source_word: קוֹל הַשֹּׁפָר
  choice: звук рога
  rationale: Шофар — духовой сигнальный инструмент из рога; «рог» конкретнее передаёт предмет, чем обобщённая «труба».
- source_word: הָהָר עָשֵׁן
  choice: дымящуюся гору
  rationale: Передаёт предикативный образ горы, охваченной дымом, естественной современной русской конструкцией.
- source_word: וַיַּרְא הָעָם
  choice: увидев всё это
  rationale: Возобновляет описание реакции народа и собирательно отсылает к перечисленным явлениям.
- source_word: וַיָּנֻעוּ
  choice: народ задрожал
  rationale: Глагол выражает сотрясение или движение от страха; «задрожал» естественно передаёт испуганную реакцию.
- source_word: וַיַּעַמְדוּ מֵרָחֹק
  choice: остановился вдали
  rationale: Близко передаёт буквальное «стал/встал издали» и пространственное отступление народа.
- source_word: וְכָל הָעָם
  choice: весь народ
  rationale: Прямой и естественный русский эквивалент, представляющий собравшийся Израиль как единое целое.
theological_decisions:
- issue: 'Смешение зрительного и слухового восприятия: народ буквально «видит» звуки'
  choice: Сохранить глагол «видел» при громовых раскатах, но для звука рога употребить «слышал»
  alternative: Последовательно перевести «видел» со всем рядом явлений либо полностью нормализовать как «воспринимал»
  rationale: Так сохраняется заметная синестезия еврейского текста в отношении грома, но русская фраза остаётся понятной и не создаёт ненужной грамматической тяжеловесности. Сноска прямо отмечает буквальную особенность оригинала.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной библейской интонацией. Синтаксис слегка разгружен относительно еврейского перечисления; лексические и образные неоднозначности сохранены в основном тексте и сносках.
