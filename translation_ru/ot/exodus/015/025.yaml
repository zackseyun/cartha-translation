revisions:
- from: Тогда Моисей воззвал к ГОСПОДУ, и ГОСПОДЬ указал ему дерево. Моисей бросил его в воду, и вода стала сладкой. Там Он установил для народа постановление и закон и там испытал его.
  to: Тогда Моисей воззвал к ГОСПОДУ, и ГОСПОДЬ указал ему дерево. Моисей бросил его в воду, и воды стали сладкими. Там Он установил для него устав и закон и там испытал его.
  rationale: Исправление сохраняет вероятного божественного субъекта, но не устраняет формальную неоднозначность местоименных дополнений оригинала. Также восстановлено множественное число «воды» и уточнена передача юридической пары חֹק וּמִשְׁפָּט без конфессиональной интерпретации.
