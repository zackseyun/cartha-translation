base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/025.yaml
  text: So he cried out to the LORD, and the LORD showed him a tree. He threw it into the water, and the water became sweet. There he made for them a statute and a judgment, and there he tested them.
translation:
  language: ru
  text: Тогда Моисей воззвал к ГОСПОДУ, и ГОСПОДЬ указал ему дерево. Моисей бросил его в воду, и воды стали сладкими. Там Он установил для него устав и закон и там испытал его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: воззвал
  rationale: Передаёт настойчивое обращение за помощью и сохраняет возвышенный, но понятный библейский регистр.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона; прописные буквы отличают имя от обычного титула.
- source_word: עֵץ
  choice: дерево
  rationale: Основное значение слова; контекст допускает также «кусок дерева», однако источник прямо не уточняет форму предмета.
- source_word: וַיִּמְתְּקוּ הַמָּיִם
  choice: вода стала сладкой
  rationale: Сохраняет конкретный образ еврейского текста и естественно противопоставляется горькой воде предыдущего контекста.
- source_word: חֹק וּמִשְׁפָּט
  choice: постановление и закон
  rationale: Сохраняет два соотнесённых юридических термина, не сводя их к одному понятию.
- source_word: נִסָּהוּ
  choice: испытал его
  rationale: Глагол означает проверку или испытание; местоимение мужского рода единственного числа естественно относится к народу как собирательному целому.
theological_decisions:
- issue: Субъект глаголов שָׂם и נִסָּהוּ
  choice: «Он» — ГОСПОДЬ
  alternative: Не выражать субъект явно либо понимать субъектом Моисея
  rationale: Ближайший названный деятель — ГОСПОДЬ, и следующий стих представляет испытание как Божье обращение к народу; при этом прописное «Он» лишь проясняет синтаксис, не добавляя нового содержания.
- issue: Объект местоимения לוֹ и נִסָּהוּ
  choice: «для народа» / «его»
  alternative: «для него» / «его», с формально неуточнённым референтом
  rationale: Единственное число отражает собирательное обозначение Израиля; «для народа» по-русски устраняет ошибочное отнесение к Моисею, а «его» сохраняет грамматическое число источника.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Имя Моисея повторено во втором предложении для ясности референции местоимений. Союз «Тогда» естественно передаёт повествовательную последовательность וַ־.
