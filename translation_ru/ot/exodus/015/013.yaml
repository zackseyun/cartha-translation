    reason: alternative_reading
lexical_decisions:
- source_word: נָחִיתָ
  choice: Ты повёл
  rationale: Форма породы хифиль от נחה означает «вести, направлять». «Повёл» естественно звучит по-русски и передаёт завершённое спасительное действие в поэтическом повествовании.
- source_word: בְחַסְדְּךָ
  choice: В Своей верной любви
  rationale: חֶסֶד объединяет значения милости, любви и неизменной верности отношениям завета. «Верная любовь» сохраняет как личностный, так и устойчивый характер этого понятия; предлог ב передан как сфера и основание действия.
- source_word: עַם זוּ
  choice: народ
  rationale: זוּ имеет указательное или относительное употребление. В сочетании с последующим גָּאָלְתָּ фраза естественно понимается как «народ, который Ты искупил»; возможная указательная сила отмечена в сноске.
- source_word: גָּאָלְתָּ
  choice: который искупил
  rationale: גאל обозначает выкуп, избавление и возвращение того, на кого есть право близкого родственника. «Искупил» сохраняет ключевой богословский и заветный смысл глагола.
- source_word: נֵהַלְתָּ
  choice: Ты направил его
  rationale: נהל означает заботливо вести или направлять, иногда с пастырским оттенком. «Направил» отличает этот глагол от предшествующего נחה и ясно передаёт движение к цели.
- source_word: בְעָזְּךָ
  choice: Своей силой
  rationale: עֹז означает силу или могущество. Творительный оборот естественно передаёт инструментальное значение ב и сохраняет параллелизм с Божьей верной любовью.
- source_word: אֶל
  choice: к
  rationale: Предлог указывает движение к цели, не вынуждая понимать его ни как вступление внутрь, ни лишь как направление без достижения.
- source_word: נְוֵה קָדְשֶׁךָ
  choice: к Своей святой обители
  rationale: נָוֶה может обозначать жилище, обитель, место пребывания или пастбище. «Святая обитель» естественна для возвышенной песни и не сужает выражение до конкретного географического места.
theological_decisions:
- issue: К чему относится «Твоя святая обитель»
  choice: Сохранено широкое обозначение места святого Божьего присутствия без уточнения конкретной местности.
  alternative: Синай; обещанная земля; Сион или храм.
  rationale: Еврейское выражение не называет место однозначно, а поэзия песни может представлять всё Божье спасительное водительство как уже совершившееся. Поэтому основной текст не разрешает эту богословскую и временную напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции. Два параллельных полустишия сохранены; различие между נחה и נהל передано глаголами «повёл» и «направил».
