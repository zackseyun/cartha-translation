  yaml_path: translation/ot/exodus/015/027.yaml
  text: Then they came to Elim[a], where there were twelve springs of water and seventy palm trees[c][b], and they camped there by the water.
translation:
  language: ru
  text: Затем они пришли в Елим, где было двенадцать источников воды и семьдесят финиковых пальм[a]. Там, у воды[b], они разбили лагерь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пальм». Еврейское слово обозначает пальмы, обычно финиковые.'
