  - marker: b
    text: 'Буквально: «у вод»; форма множественного числа здесь может иметь собирательное значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Затем они пришли
  rationale: Последовательная глагольная форма продолжает повествование; «затем» естественно передаёт переход к следующему событию.
- source_word: אֵילִמָה
  choice: в Елим
  rationale: Направительный суффикс передан предлогом «в»; название места сохранено в привычной русской библейской форме.
- source_word: וְשָׁם
  choice: где было; там
  rationale: Еврейское «и там» естественно встроено в русское относительное предложение, а затем «там» использовано в следующей фразе для ясного обозначения места стоянки.
- source_word: עֵינֹת מַיִם
  choice: источников воды
  rationale: עַיִן здесь означает природный водный источник; сочетание передано прямо и понятно.
- source_word: תְּמָרִים
  choice: финиковых пальм
  rationale: Слово обозначает пальмы, обычно финиковые; конкретный русский эквивалент естественен для описания оазиса, а более общее значение отмечено в сноске.
- source_word: וַיַּחֲנוּ
  choice: они разбили лагерь
  rationale: Современное и естественное выражение для расположения на стоянку без архаичного оттенка.
- source_word: עַל הַמָּיִם
  choice: у воды
  rationale: Предлог עַל в данном пространственном контексте выражает близость; русское «у воды» точно и идиоматично.
