  source_fidelity: В целом перевод точно передаёт последовательность вражеской похвальбы и образ меча. Однако тּוֹרִישֵׁמוֹ (Hiphil от ירשׁ) имеет область значений «лишить владения / изгнать», а в данном военном контексте также «уничтожить»; основное «истребит» допустимо, но несколько книжно и чрезмерно сужает значение без ясной, естественной оговорки в сноске.
  naturalness: Текст звучит естественно и сохраняет сжатый ритм песни. «Уничтожит» — более современное литературное слово, чем «истребит». Формулировка «лишит их владения» в сноске неестественна по-русски; лучше «лишит их владений».
  terminology: «Душа моя насытится ими» удачно сохраняет образ נֶפֶשׁ и не навязывает психологического либо богословского истолкования. «Обнажу меч» — точная русская идиома для אָרִיק חַרְבִּי. Альтернативы к последнему глаголу следует сформулировать так, чтобы они действительно отражали изгнание и лишение владений.
