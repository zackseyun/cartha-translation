base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/009.yaml
  text: The enemy said[a], ‘I will pursue, I will overtake, I will divide the spoil; my desire will be satisfied on them. I will draw my sword[b]; my hand will dispossess them.’
translation:
  language: ru
  text: 'Враг сказал: «Погонюсь, настигну, разделю добычу; душа моя насытится ими[a]. Обнажу свой меч — рука моя уничтожит их[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я насыщусь ими», то есть «я утолю ими свою жажду».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рука моя изгонит их» или «лишит их владений».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר אוֹיֵב
  choice: Враг сказал
  rationale: Простое прошедшее время естественно вводит хвастливую речь врага в контексте песни; единственное число представляет преследующего противника собирательно.
- source_word: אֶרְדֹּף אַשִּׂיג
  choice: Погонюсь, настигну
  rationale: Формы выражают намерение врага. Краткие глаголы сохраняют стремительный ритм и образ военной погони.
- source_word: אֲחַלֵּק שָׁלָל
  choice: разделю добычу
  rationale: Устойчивое и понятное обозначение раздела захваченной на войне добычи.
- source_word: תִּמְלָאֵמוֹ נַפְשִׁי
  choice: душа моя насытится ими
  rationale: Передаёт конкретный образ исходного текста и не устраняет неоднозначность נֶפֶשׁ, которое здесь может обозначать душу, желание или алчную жажду.
- source_word: אָרִיק חַרְבִּי
  choice: Обнажу свой меч
  rationale: Сочетание буквально связано с извлечением меча из ножен; «обнажу меч» — естественная русская военная идиома.
- source_word: תּוֹרִישֵׁמוֹ יָדִי
  choice: рука моя истребит их
  rationale: В контексте хвастовства преследователя речь идёт о полном сокрушении врагов. При этом многозначность формы от ירשׁ отмечена в сноске.
theological_decisions:
- issue: Степень конкретизации угрозы в תּוֹרִישֵׁמוֹ
  choice: истребит их
  alternative: прогонит их; лишит их владения
  rationale: Контекст допускает значение уничтожения, но глагол также может описывать изгнание или лишение владения; альтернативы сохранены, а не сведены к одному богословски нагруженному толкованию.
translation_notes:
  register: Современный литературный русский язык с приподнятым, но понятным песенным ритмом. Последовательность коротких глаголов сохраняет напор вражеской похвальбы; архаизмы и конфессионально окрашенные выражения не используются.
