  - marker: b
    text: 'Или: «свою ярость». Еврейское слово буквально обозначает пылающий гнев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹב גְּאוֹנְךָ
  choice: В полноте своего величия
  rationale: רֹב передаёт обилие или огромную меру, а גָּאוֹן здесь обозначает величие и возвышенное превосходство. Формулировка сохраняет поэтический образ и естественно звучит по-русски; значение предлога ב допускает как сферу, так и средство.
- source_word: תַּהֲרֹס
  choice: ты сокрушаешь
  rationale: Глагол הרס буквально означает разрушать или сносить. При личном дополнении «восстающих» глагол «сокрушать» естественно передаёт военно-поэтический смысл.
- source_word: קָמֶיךָ
  choice: восстающих против тебя
  rationale: Причастие от קום сохраняет буквальный образ тех, кто поднимается или выступает против Бога, не заменяя его общим словом «враги».
- source_word: תְּשַׁלַּח
  choice: ты посылаешь
  rationale: Прямое соответствие глаголу שׁלח; сила действия выражена самим образом пылающего гнева и последующим пожиранием.
- source_word: חֲרֹנְךָ
  choice: свой пылающий гнев
  rationale: חָרוֹן обозначает яростный, буквально разгорающийся гнев. «Пылающий гнев» сохраняет образ жара и подготавливает сравнение с пожираемой огнём соломой.
- source_word: יֹאכְלֵמוֹ
  choice: он пожирает их
  rationale: Единственное число отсылает к гневу; «пожирает» сохраняет олицетворение и сильный образ уничтожения.
- source_word: כַּקַּשׁ
  choice: как солому
  rationale: קַשׁ означает солому или сухие остатки стеблей после жатвы. «Солома» ясно передаёт образ легко сгорающего материала и естественнее для широкого круга современных читателей.
theological_decisions:
- issue: Прямое изображение Божьего суда
  choice: ты посылаешь свой пылающий гнев — он пожирает их, как солому
  alternative: ты насылаешь ярость — она уничтожает их, словно жнивьё
  rationale: Перевод не смягчает приписанное Богу действие и сохраняет огненно-разрушительную поэтическую образность, не добавляя богословских объяснений.
- issue: Обращение к Богу во втором лице
  choice: тебя; ты; свой
  alternative: Тебя; Ты; Свой
  rationale: Сохранено прямое обращение песни к Богу. Строчные буквы соответствуют современной русской издательской норме и не уменьшают торжественности текста.
translation_notes:
  register: Современный литературный русский язык с торжественным песенным ритмом. Сохранены параллелизм, прямое обращение и сильная образность исходного текста; архаичные местоимения и искусственно церковнославянские обороты не используются.
