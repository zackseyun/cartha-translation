  text: Услышали народы — и содрогнулись[a]; мука охватила жителей Филистии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Услышали народы — и трепещут». Еврейская поэзия допускает здесь как повествование о прошлом, так и живое настоящее либо перспективный оттенок.'
    reason: лексико-грамматическая альтернатива
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: услышали
  rationale: Форма qal perfect 3-го лица множественного числа от שׁמע. Совершенный вид естественно передаёт завершённое восприятие вести и сохраняет лаконизм поэтической строки.
- source_word: עַמִּים
  choice: народы
  rationale: Множественное число от עם обозначает окружающие этнические сообщества. «Народы» точно сохраняет множественность и поэтическую широту.
- source_word: יִרְגָּזוּ/ן
  choice: содрогнулись
  rationale: Глагол רגז может означать дрожь, трепет или сильное волнение. «Содрогнулись» передаёт телесный и эмоциональный страх; прошедшее время согласуется с соседними перфектами, хотя поэтическая форма допускает более живое настоящее или перспективное прочтение.
- source_word: חִיל
  choice: мука
  rationale: Существительное обозначает мучительное содрогание, корчи или боль, в том числе подобную родовой. «Мука» сохраняет сочетание телесного и душевного страдания, не делая родовой образ обязательным.
- source_word: אָחַז
  choice: охватила
  rationale: Qal perfect от אחז буквально выражает захватывание или овладение. В русском сочетание «мука охватила» естественно и сохраняет образ внезапно овладевшего страдания.
- source_word: יֹשְׁבֵי
  choice: жителей
  rationale: Субстантивированное причастие от ישׁב в сопряжённой конструкции означает живущих или обитателей данной земли. «Жителей» — ясный современный эквивалент.
- source_word: פְּלָשֶׁת
  choice: Филистии
  rationale: Это название территории филистимлян, поэтому передано географическим именем «Филистия», а не названием народа.
theological_decisions:
- issue: Временная перспектива поэтических глаголов
  choice: 'Основной текст передан в прошедшем времени: «услышали… содрогнулись… охватила».'
  alternative: 'Возможно живое настоящее или перспективное прочтение: «народы слышат — и содрогаются; мука охватила жителей Филистии».'
  rationale: Песнь соединяет воспоминание и пророческую перспективу. Прошедшее время естественно связывает формы שָׁמְעוּ и אָחַז, но yiqtol יִרְגָּזוּ допускает незавершённый, живописный или будущий оттенок; эта неоднозначность отмечена в сноске, а не устранена.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным ритмом песни. Тире передаёт параллелизм и резкий переход от вести к реакции. «Содрогнулись» и «мука охватила» звучат естественно и достойно, не архаизируя текст.
