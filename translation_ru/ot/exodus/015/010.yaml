  text: נָשַׁ֥פְתָּ בְ/רוּחֲ/ךָ֖ כִּסָּ֣/מוֹ יָ֑ם צָֽלֲלוּ֙ כַּֽ/עוֹפֶ֔רֶת בְּ/מַ֖יִם אַדִּירִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/010.yaml
  text: You blew with your wind; the sea covered them[a]. They sank like lead in mighty waters.
translation:
  language: ru
  text: Ты дунул ветром Твоим[a] — море покрыло их; они погрузились, словно свинец, в могучих водах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дыханием Твоим». Еврейское слово может означать «ветер», «дыхание» или «дух»; в контексте перехода через море наиболее вероятно значение «ветер».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁפְתָּ
  choice: Ты дунул
  rationale: Глагол означает «дуть, выдыхать». В поэтическом описании Божьего действия над морем «Ты дунул» прямо и естественно передаёт образ.
- source_word: בְרוּחֲךָ
  choice: ветром Твоим
  rationale: רוּחַ может означать ветер, дыхание или дух. Контекст перехода через море и глагол «дунул» прежде всего указывают здесь на ветер; возможное значение «дыхание» сохранено в сноске.
- source_word: כִּסָּמוֹ יָם
  choice: море покрыло их
  rationale: Сохранено основное значение глагола כסה — «покрывать», без усилительного истолкования вроде «поглотило».
- source_word: צָלֲלוּ
  choice: они погрузились
  rationale: В данном контексте глагол описывает движение вниз, в воду. «Погрузились» естественно сочетается со сравнением со свинцом и сохраняет поэтический регистр.
- source_word: כָּעוֹפֶרֶת
  choice: словно свинец
  rationale: Точно сохраняет сравнение и образ тяжёлого металла.
- source_word: בְמַיִם אַדִּירִים
  choice: в могучих водах
  rationale: Прилагательное אַדִּיר выражает мощь и величие. «Могучие воды» сохраняет эту силу и не подменяет её понятием глубины.
theological_decisions:
- issue: Значение רוּחַ в поэтическом описании Божьего явления и действия
  choice: ветер
  alternative: дыхание; дух
  rationale: Непосредственный контекст гибели египтян в море и сочетание с «Ты дунул» благоприятствуют физическому образу ветра. «Дыхание» остаётся реальной лексической возможностью и отмечено в сноске; чтение «дух» не навязывается как прямое упоминание Божьего Духа.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным поэтическим звучанием. Постпозиция «ветром Твоим» сохраняет песенный ритм и торжественный регистр; прописная буква в местоимении следует принятой русской библейской традиции.
