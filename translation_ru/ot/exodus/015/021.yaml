base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/021.yaml
  text: 'And Miriam answered them: “Sing to Yahweh[a], for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: ru
  text: 'И Мариам отвечала им[a]:


    «Пойте Яхве,

    ведь Он величественно восторжествовал[b];

    коня и его всадника

    Он бросил в море».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пела им в ответ». В песенном контексте глагол «отвечать» может обозначать ответное, попеременное пение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «высоко возвысился» или «весьма превознёсся». Еврейская усилительная конструкция выражает величие Яхве, явленное в победе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  choice: отвечала
  rationale: Основное значение глагола — «отвечать, откликаться». Несовершенный вид естественно передаёт происходившее в песенном действии и не исключает попеременного, антифонного пения.
- source_word: לָהֶם
  choice: им
  rationale: Сохранено мужское множественное местоимение еврейского текста без уточнения состава адресатов, хотя ближайший контекст упоминает женщин.
- source_word: מִרְיָם
  choice: Мариам
  rationale: Употреблена традиционная русская библейская форма имени.
- source_word: שִׁירוּ
  choice: Пойте
  rationale: Прямой перевод повелительного наклонения множественного числа; добавление «хвалу» самим глаголом не выражено.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном יהוה, а не заменено титулом.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание призыва петь; «ведь» естественно звучит в современной русской поэтической речи.
- source_word: גָאֹה גָּאָה
  choice: величественно восторжествовал
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает значение корня גאה. Выбор передаёт и возвышенное величие, и явленную в победе торжественность, не воспроизводя тяжеловесную буквальную конструкцию.
- source_word: סוּס
  choice: коня
  rationale: Единственное число сохранено как обобщённый образ пары «конь — всадник».
- source_word: וְרֹכְבוֹ
  choice: и его всадника
  rationale: Местоименный суффикс относится к коню; русская конструкция ясно передаёт эту связь.
- source_word: רָמָה
  choice: Он бросил
  rationale: Прямо передано значение «бросить, повергнуть»; явное местоимение помогает сохранить поэтическую ясность после переноса строки.
- source_word: בַיָּם
  choice: в море
  rationale: При глаголе движения русское «бросил в море» естественно передаёт направленность и результат действия.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст употребляет собственное имя Бога. Форма «Яхве» передаёт тетраграмматон и не подменяет его титулом.
- issue: Смысл усилительной формулы גָאֹה גָּאָה
  choice: величественно восторжествовал
  alternative: высоко превознёсся; высоко возвысился
  rationale: В контексте победной песни выражение описывает явленное величие Яхве в победе. Формулировка сохраняет оттенок величия, но не сводит смысл к отвлечённому самовозвышению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным песенным ритмом. Строфическое оформление отражает поэзию исходного текста; синтаксис остаётся понятным обычному читателю. Неоднозначность глагола «отвечала» и усилительной формулы сохранена и пояснена в сносках.
