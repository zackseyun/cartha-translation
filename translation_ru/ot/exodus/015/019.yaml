  text: כִּ֣י בָא֩ ס֨וּס פַּרְעֹ֜ה בְּ/רִכְבּ֤/וֹ וּ/בְ/פָרָשָׁי/ו֙ בַּ/יָּ֔ם וַ/יָּ֧שֶׁב יְהוָ֛ה עֲלֵ/הֶ֖ם אֶת מֵ֣י הַ/יָּ֑ם וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֥וֹךְ הַ/יָּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/019.yaml
  text: For Pharaoh’s horses went into the sea with his chariots and with his horsemen[a], and Yahweh brought back the waters of the sea over them[b]; but the sons of Israel walked on dry ground through the midst of the sea.
translation:
  language: ru
  text: Ибо кони фараона вошли в море вместе с его колесницами и всадниками[a], и Яхве возвратил на них воды моря; а сыны Израиля шли по суше посреди моря[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «конь фараона… с его колесницей»; формы единственного числа здесь могут иметь собирательное значение и обозначать конницу и колесничное войско фараона.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально союз можно передать: «и сыны Израиля»; в основном тексте «а» выражает подразумеваемый контраст.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Вводит пояснение к предшествующему песенному возгласу и сохраняет причинно-пояснительную связь.
- source_word: בָא
  choice: вошли
  rationale: При בַיָּם обозначает движение внутрь моря; русский глагол естественно передаёт это направление.
- source_word: סוּס פַּרְעֹה
  choice: кони фараона
  rationale: Еврейское единственное число допускает собирательное значение; множественное число по-русски ясно обозначает конную силу фараона.
- source_word: בְּרִכְבּוֹ וּבְפָרָשָׁיו
  choice: вместе с его колесницами и всадниками
  rationale: רכב в военном контексте может обозначать колесничное войско собирательно, а פָּרָשׁ — конных воинов.
- source_word: וַיָּשֶׁב יְהוָה
  choice: и Яхве возвратил
  rationale: Каузативная форма שוב указывает, что Яхве заставил воды вернуться, сохраняя явную божественную субъектность.
- source_word: מֵי הַיָּם
  choice: воды моря
  rationale: Прямо и образно передаёт еврейскую сопряжённую конструкцию.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: а сыны Израиля
  rationale: «Сыны Израиля» формально прозрачно передаёт выражение; союз «а» естественно выражает контраст, возникающий в контексте, не усиливая его до резкого противопоставления.
- source_word: הָלְכוּ בַיַּבָּשָׁה בְּתוֹךְ הַיָּם
  choice: шли по суше посреди моря
  rationale: Сохраняет обычное значение глагола הלך и пространственный образ сухого пути внутри моря.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя; транслитерация сохраняет отличие имени от титула.
- issue: Связь между гибелью египетского войска и переходом Израиля
  choice: а сыны Израиля
  alternative: и сыны Израиля
  rationale: Еврейский союз ו формально означает «и», но здесь контекстуально связывает резко различающиеся исходы. Русское «а» передаёт этот контраст без добавления более сильного «но».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис ясен для широкого читателя; «ибо» сохраняет связь с предшествующим контекстом, а «сыны Израиля» — формальную образность оригинала.
