base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/008.yaml
  text: At the blast of your nostrils the waters piled up[a]; the flowing waters stood like a heap[d][c][b]; the depths congealed in the heart of the sea.
translation:
  language: ru
  text: От дыхания Твоих ноздрей[a] воды нагромоздились; текущие воды встали, словно груда[b]; бездны сгустились[c] в сердце моря[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «От ветра, исходящего из Твоих ноздрей». Еврейское слово может означать дыхание или ветер.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово означает «груда» или «насыпь». В некоторых переводах: «словно стена» — под влиянием образа перехода через море.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «застыли». Еврейский глагол может обозначать сгущение или затвердевание.'
    reason: lexical_alternative
  - marker: d
    text: То есть посреди моря.
    reason: idiom_clarification
lexical_decisions:
- source_word: וּבְרוּחַ אַפֶּיךָ
  choice: От дуновения из Твоих ноздрей
  rationale: רוּחַ может означать ветер или дыхание; в сочетании с «ноздрями» оно рисует мощный выдох. «Дуновение» сохраняет образ, а предлог «из» делает выражение естественным по-русски.
- source_word: נֶעֶרְמוּ מַיִם
  choice: воды нагромоздились
  rationale: Глагол означает собираться грудой, нагромождаться. Возвратная форма передаёт состояние вод без добавления явно названного деятеля.
- source_word: נִצְּבוּ
  choice: встали
  rationale: Глагол обозначает стояние или занятие устойчивого положения; «встали» естественно передаёт динамический поэтический образ.
- source_word: כְמוֹ נֵד
  choice: словно груда
  rationale: נֵד прежде всего обозначает груду или нагромождение. Перевод не подменяет этот образ «стеной» под влиянием параллельного рассказа.
- source_word: נֹזְלִים
  choice: текучие воды
  rationale: Причастная форма связана с течением; выражение сохраняет характеристику вод как текущих и одновременно создаёт намеренное поэтическое напряжение с «встали».
- source_word: קָפְאוּ
  choice: сгустились
  rationale: Глагол может обозначать сгущение, затвердевание или застывание. «Сгустились» не навязывает современное представление о замерзании воды.
- source_word: תְהֹמֹת
  choice: бездны
  rationale: Множественное число обозначает глубинные воды или морские бездны; «бездны» сохраняет поэтический масштаб.
- source_word: בְּלֶב יָם
  choice: в сердце моря
  rationale: Буквальный образ «сердца моря» понятен по-русски и поэтичнее нейтрализующего «посреди моря».
theological_decisions:
- issue: Антропоморфное изображение Бога в Песни у моря
  choice: Сохранить конкретный образ Божьих ноздрей и исходящего из них дуновения.
  alternative: Передать выражение отвлечённо, например через Божий гнев.
  rationale: Еврейский текст намеренно использует телесный поэтический образ для описания могущественного Божьего действия; его отвлечённая передача неоправданно устранила бы образность.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической образностью. Синтаксический параллелизм еврейской песни сохранён; редкое, но понятное «в сердце моря» удерживает метафору оригинала.
