base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/003.yaml
  text: Yahweh is a warrior[b][a]; Yahweh is his name.
translation:
  language: ru
  text: Яхве[a] — воин[b]; Яхве — имя его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. YHWH; традиционные варианты передачи: «Господь» и «Иегова».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «муж войны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь»; форма «Яхве» общепринята в современной русской библеистике.
- source_word: אִישׁ מִלְחָמָה
  choice: воин
  rationale: Буквально сочетание означает «муж войны», но в данном поэтическом контексте это еврейская именная конструкция со значением «воин». Русское «воин» естественно, кратко и сохраняет возвышенный регистр песни.
- source_word: שְׁמוֹ
  choice: имя его
  rationale: Сохраняет краткость и порядок смысловых компонентов безглагольного еврейского предложения «Яхве — имя его».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя YHWH. Транслитерация сохраняет различие между именем Бога и титулом, а примечание сообщает традиционные варианты.
- issue: Образ אִישׁ מִלְחָמָה
  choice: воин
  alternative: муж войны; муж брани
  rationale: «Воин» передаёт смысл древнееврейского выражения на естественном современном русском языке. Буквальная образная форма отмечена в сноске, чтобы не скрывать устройство оригинала.
translation_notes:
  register: Краткая, ритмичная поэтическая строка в современном литературном русском. Слово «воин» сохраняет торжественность, не прибегая к архаичному «муж брани»; оборот «имя его» поддерживает песенный параллелизм.
