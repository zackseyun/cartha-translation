  text: אָ֣ז יָשִֽׁיר מֹשֶׁה֩ וּ/בְנֵ֨י יִשְׂרָאֵ֜ל אֶת הַ/שִּׁירָ֤ה הַ/זֹּאת֙ לַֽ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֵ/אמֹ֑ר אָשִׁ֤ירָה לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/001.yaml
  text: 'Then Moses and the sons of Israel sang this song to Yahweh[a], and they said: “I will sing to Yahweh, for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: ru
  text: 'Тогда Моисей и сыны Израиля воспели эту песнь Яхве[a]. Они сказали:


    «Буду петь Яхве,


    ибо Он величественно восторжествовал[b]:


    коня и его всадника


    Он низверг в море».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно передаётся «Господь».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «высоко превознёсся». В еврейском тексте значение глагола усилено повтором однокоренных форм.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז יָשִׁיר
  choice: Тогда … воспели
  rationale: Сочетание אָז с имперфектом в повествовательном контексте обозначает последовавшее событие; прошедшее время естественно передаёт последовательность.
- source_word: מֹשֶׁה וּבְנֵי יִשְׂרָאֵל
  choice: Моисей и сыны Израиля
  rationale: Сохраняет родовую формулу оригинала и её торжественно-поэтический характер; «сыны» здесь означает потомков и народ Израиля.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: эту песнь
  rationale: Прямой перевод без добавления жанрового толкования; «песнь» соответствует возвышенному поэтическому контексту.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: Они сказали
  rationale: Естественная русская передача формулы введения прямой речи; буквальное удвоение «сказали, говоря» было бы избыточным.
- source_word: אָשִׁירָה
  choice: Буду петь
  rationale: Передаёт когортативное волеизъявление первого лица и сохраняет переход от множественного числа во введении к единственному числу в голосе песни.
- source_word: גָאֹה גָּאָה
  choice: величественно восторжествовал
  rationale: Повтор однокоренных форм усиливает значение возвышения и превосходства; в контексте избавления у моря глагол также выражает победное торжество.
- source_word: סוּס וְרֹכְבוֹ
  choice: коня и всадника его
  rationale: Сохраняет собирательное единственное число и притяжательный суффикс, а также краткость поэтической строки.
- source_word: רָמָה בַיָּם
  choice: низверг в море
  rationale: Передаёт резкое бросание вниз или прочь и направительное значение предлога в данном контексте; глагол подходит возвышенному регистру песни.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст непосредственно употребляет тетраграмматон; транслитерационная форма сохраняет личное заветное имя, а примечание сообщает традиционный вариант.
- issue: Смысл усилительной конструкции גָאֹה גָּאָה
  choice: величественно восторжествовал
  alternative: высоко превознёсся
  rationale: Основной текст учитывает победный контекст, но не сводит выражение только к военной победе; примечание сохраняет возможный акцент на возвышенности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Разбиение прямой речи на строки отражает песенный характер текста; синтаксис остаётся ясным для современного читателя.
