  yaml_path: translation/ot/exodus/015/011.yaml
  text: Who is like you among the gods, O LORD? Who is like you, majestic in holiness, feared in praises, doing wonders?
translation:
  language: ru
  text: Кто подобен Тебе среди богов, Господи? Кто подобен Тебе, величественному в святости, грозному в славословиях, Творящему чудеса?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֵלִם
  choice: среди богов
  rationale: Передаёт обычное значение множественного אֵלִם и сохраняет поэтическое утверждение несравненности Господа, не заменяя исходный образ толкованием вроде «среди сильных».
- source_word: יְהוָה
  choice: Господи
  rationale: Традиционная русская передача тетраграмматона в форме обращения; соответствует функции имени в стихе и консультационному слою LORD.
- source_word: נֶאְדָּר בַּקֹּדֶשׁ
  choice: величественный в святости
  rationale: Причастная форма נֶאְדָּר выражает величие и славу, а בַּקֹּדֶשׁ здесь естественно понимается как сфера или качество святости.
- source_word: נוֹרָא תְהִלֹּת
  choice: грозный в славословиях
  rationale: 'Сохраняет буквальную напряжённость конструкции: נוֹרָא — внушающий страх и благоговение, תְהִלֹּת — хваления или славословия. Русское «грозный» передаёт устрашающее величие, не сводя смысл к современному «удивительный».'
- source_word: עֹשֵׂה פֶלֶא
  choice: творящий чудеса
  rationale: Естественная русская передача причастной конструкции; собирательное פֶלֶא допускает множественное «чудеса» как обозначение чудесных деяний.
theological_decisions:
- issue: Упоминание «богов»
  choice: среди богов
  alternative: среди сильных
  rationale: Исходное выражение оставлено без богословского сглаживания. Контекст провозглашает несравненность Господа, но сам по себе стих не требует заменять «богов» истолковывающим обозначением.
- issue: Смысл נוֹרָא в связи со славословиями
  choice: грозный в славословиях
  alternative: дивный в славословиях
  rationale: Выбрано значение внушающего страх и благоговение, согласующееся с исходным נוֹרָא и английским audited-слоем «feared»; неоднозначная связь со «славословиями» сохранена.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим строем. Параллелизм двух риторических вопросов сохранён; местоимение «Тебе» написано с прописной буквы как уместная в библейском издании форма почтительного обращения к Богу.
