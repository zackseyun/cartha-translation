base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/016.yaml
  text: Terror and dread will fall on them[a]; by the greatness of your arm they will be still as a stone, until your people pass by, O Yahweh[c][b], until this people whom you acquired pass by.
translation:
  language: ru
  text: 'Ужас и страх падут на них;


    от мощи Твоей руки


    они замрут, как камень.[a]


    Пока не пройдёт Твой народ, Яхве,


    пока не пройдёт этот народ,[b]


    который Ты приобрёл.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они умолкнут» или «они останутся неподвижны, как камень».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пока не перейдёт Твой народ… пока не перейдёт этот народ».'
    reason: lexical_alternative
  - marker: c
    text: «Приобрёл» можно также перевести как «купил», а в более широком смысле — «сделал Своим».
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפֹּל עֲלֵיהֶם אֵימָתָה וָפַחַד
  choice: Ужас и страх падут на них
  rationale: Сохраняется образ «падения» ужаса и страха на народы, а два близких по значению существительных передают поэтическое усиление оригинала. Единственное число еврейского глагола естественно передаётся русским множественным при однородном составном подлежащем.
- source_word: בִּגְדֹל זְרוֹעֲךָ
  choice: от величия Твоей руки
  rationale: Предлог ב передан как указание на основание или действующую причину; сохранён библейский образ руки как проявления силы, без замены метафоры толкованием.
- source_word: יִדְּמוּ כָּאָבֶן
  choice: они замрут, как камень
  rationale: «Замрут» естественно соединяет оттенки неподвижности и оцепенения, подходящие к сравнению с камнем; возможный оттенок молчания сохранён в примечании.
- source_word: עַד יַעֲבֹר
  choice: пока не пройдёт
  rationale: Русская конструкция «пока не» естественно передаёт предел действия, не превращая отрицание в отрицательный смысл. Глагол עבר допускает также значение перехода или переправы, отмеченное в примечании.
- source_word: עַמְּךָ ... עַם זוּ
  choice: Твой народ ... этот народ
  rationale: Сохранены как отношение принадлежности в עַמְּךָ, так и указательное значение архаического поэтического זוּ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не заменено титулом.
- source_word: קָנִיתָ
  choice: Ты приобрёл
  rationale: «Приобрёл» сохраняет широкое значение קנה и не сужает его до искупления, покупки или сотворения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; его транслитерация сохраняет различие между именем и титулом.
- issue: Смысл קָנִיתָ применительно к народу
  choice: который Ты приобрёл
  alternative: который Ты купил / сделал Своим / создал
  rationale: Выбрано лексически широкое соответствие, чтобы не разрешать без достаточных оснований богословскую многозначность глагола в сторону покупки, искупления либо сотворения.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической песни. Сохранены параллелизм, повтор «пока не пройдёт», метафора руки и прямое обращение «Яхве». Прописные местоимения при обращении к Богу использованы как традиционная русская стилистическая норма.
