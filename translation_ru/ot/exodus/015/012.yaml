lexical_decisions:
- source_word: נָטִיתָ
  choice: Ты простёр
  rationale: Форма qal perfect, 2-е лицо мужского рода единственного числа, прямо обращённая к Богу. «Простёр» естественно для возвышенной поэзии и сохраняет конкретный образ действия.
- source_word: יְמִינְךָ
  choice: Свою правую руку
  rationale: Буквально «твою правую руку». Хотя в поэтическом контексте правая рука означает силу, конкретный антропоморфный образ сохранён, а возвратное «Свою» естественно по-русски при подлежащем «Ты».
- source_word: תִּבְלָעֵמוֹ
  choice: поглотила их
  rationale: Глагол בלע означает «глотать, поглощать»; форма имеет подлежащее женского рода единственного числа и объектный суффикс 3-го лица множественного числа. «Поглотила» сохраняет яркую метафору и сочетается с «земля».
- source_word: אָרֶץ
  choice: земля
  rationale: Слово может обозначать землю, сушу, почву или страну. Здесь «земля» сохраняет широкий и драматический поэтический образ, не сужая значение до конкретной территории или грунта.
theological_decisions:
- issue: Антропоморфный образ Божьего действия
  choice: Сохранить выражение «Свою правую руку»
  alternative: Передать как «Свою силу» или «Свою могучую руку»
  rationale: Еврейский текст использует конкретный поэтический образ. Его сохранение передаёт литературную и богословскую выразительность стиха, не заменяя образ толкованием.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией. Тире передаёт резкий переход от Божьего жеста к его результату.
