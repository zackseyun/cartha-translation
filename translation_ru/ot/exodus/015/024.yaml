lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: возроптал
  rationale: Глагол לון/לין в рассказах о странствиях по пустыне обозначает недовольный ропот или жалобу общины. «Возроптал» естественно сочетается с «на Моисея», передаёт коллективный и отрицательный характер реакции и сохраняет библейское достоинство стиля.
- source_word: הָעָם
  choice: народ
  rationale: Прямое соответствие существительному עם с определённым артиклем; уточнение «народ Израиля» не добавляется, поскольку его нет в непосредственном тексте.
- source_word: עַל
  choice: на
  rationale: При глаголе ропота предлог עַל указывает на лицо, против которого направлено недовольство; русское сочетание «роптать на кого-либо» точно передаёт эту связь.
- source_word: מֹשֶׁה
  choice: Моисея
  rationale: Имя передано в традиционной русской библейской форме и поставлено в требуемый управлением винительный падеж.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Инфинитивная формула вводит прямую речь. «Говоря» формально сохраняет синтаксическую связь исходного текста, оставаясь понятным в литературном русском.
- source_word: מַה
  choice: что
  rationale: Прямое соответствие вопросительному местоимению.
- source_word: נִּשְׁתֶּה
  choice: нам пить
  rationale: Форма Qal imperfect 1-го лица множественного числа от שׁתה выражает насущный вопрос о питье. Безличная русская конструкция «Что нам пить?» естественно передаёт смысл «что мы будем/должны пить», не закрепляя излишне конкретную модальность.
