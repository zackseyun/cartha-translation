- source_word: יֹאחֲזֵמוֹ רָעַד
  choice: объяла дрожь
  rationale: Сочетание אחז и רָעַד ярко изображает дрожь, овладевшую людьми; русская конструкция сохраняет эту персонификацию.
- source_word: נָמֹגוּ
  choice: пали духом
  rationale: В контексте страха מוג метафорически означает «таять», то есть лишаться мужества. «Пали духом» естественно передаёт смысл, не создавая впечатления физического исчезновения.
- source_word: כֹּל יֹשְׁבֵי כְנָעַן
  choice: все жители Ханаана
  rationale: Прямой и естественный перевод причастной конструкции, сохраняющий её всеохватность.
