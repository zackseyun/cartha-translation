  yaml_path: translation/ot/exodus/015/020.yaml
  text: Then Miriam the prophetess[a], Aaron’s sister, took the tambourine in her hand, and all the women went out after her with tambourines and dancing.
translation:
  language: ru
  text: Тогда Мариам, пророчица, сестра Аарона, взяла бубен в руку, и все женщины вышли вслед за ней с бубнами и танцами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «танцуя». Еврейское существительное во множественном числе может обозначать как танцы, так и само действие танцевания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: Тогда ... взяла
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: מִרְיָם
  choice: Мариам
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: הַנְּבִיאָה
  choice: пророчица
  rationale: Еврейское существительное имеет женскую форму; русское «пророчица» точно и естественно сохраняет это значение.
- source_word: אֲחוֹת אַהֲרֹן
  choice: сестра Аарона
  rationale: Сохранено явное указание исходного текста именно на родство Мариам с Аароном.
- source_word: הַתֹּף
  choice: бубен
  rationale: תֹף обозначает ручной ударный инструмент, вероятнее всего рамочный барабан; «бубен» — ясный и традиционно понятный русский эквивалент.
- source_word: בְּיָדָהּ
  choice: в руку
  rationale: В сочетании с глаголом «взяла» русское направление «в руку» звучит естественнее буквального «в её руке», сохраняя смысл исходного выражения.
- source_word: וַתֵּצֶאןָ כָל הַנָּשִׁים אַחֲרֶיהָ
  choice: все женщины вышли вслед за ней
  rationale: Переданы множественное женское подлежащее, движение наружу и следование за Мариам, вероятно в праздничном шествии.
- source_word: בְּתֻפִּים
  choice: с бубнами
  rationale: Сохранена связь с тем же инструментом, названным ранее в единственном числе; предлог передан инструментально-сопроводительным оборотом.
- source_word: וּבִמְחֹלֹת
  choice: и танцами
  rationale: Форма множественного числа обозначает праздничные танцы или само действие танцевания; основной текст сохраняет форму множественного числа, а смысловая альтернатива отмечена в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Синтаксис остаётся близким к еврейской последовательности, но не калькирует её. Термин «пророчица» сохраняет явно выраженный женский род, а «бубен» избегает архаичного «тимпан».
