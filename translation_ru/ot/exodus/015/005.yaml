lexical_decisions:
- source_word: תְּהֹמֹת
  choice: пучины
  rationale: Форма множественного числа обозначает глубокие воды, бездну. «Пучины» сохраняет поэтический образ и водную семантику.
- source_word: יְכַסְיֻמוּ
  choice: покрыли их
  rationale: Прямая передача глагола כסה «покрывать» с местоименным суффиксом 3-го лица множественного числа.
- source_word: יָרְדוּ
  choice: они погрузились
  rationale: Глагол ירד буквально означает движение вниз. В контексте моря «погрузились» естественно передаёт это движение, не вводя причины сверх сказанного в тексте.
- source_word: בִמְצוֹלֹת
  choice: в морские глубины
  rationale: מְצוֹלָה обозначает глубину, особенно морскую. Уточнение «морские» естественно в русском и позволяет отличить этот термин от תְּהֹמֹת, поскольку в еврейском употреблены разные слова.
- source_word: כְּמוֹ
  choice: как
  rationale: Обычная русская передача сравнительной частицы.
- source_word: אָבֶן
  choice: камень
  rationale: Прямое значение существительного; в сравнении по-русски естественно употребляется без неопределённого артикля.
