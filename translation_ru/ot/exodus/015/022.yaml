translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Начальное «И» сохраняет повествовательную связь еврейского текста; обратный порядок «вышли они», «шли они» поддерживает достоинство стиля, оставаясь понятным современному читателю.
