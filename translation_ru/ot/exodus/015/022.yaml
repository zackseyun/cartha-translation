base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/022.yaml
  text: Then Moses led Israel on from the Sea of Reeds[a], and they went out into the wilderness of Shur. They went three days in the wilderness and found no water.
translation:
  language: ru
  text: И повёл Моисей Израиль от Тростникового моря[a], и вышли они в пустыню Шур. Три дня шли они по пустыне и не нашли воды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Традиционный перевод — «Красное море»; по-еврейски — «Тростниковое море».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסַּע
  choice: повёл
  rationale: Каузативная форма глагола נסע указывает, что Моисей побудил Израиль двинуться дальше. «Повёл» естественно передаёт эту каузативность и его ведущую роль.
- source_word: מִיַּם סוּף
  choice: от Тростникового моря
  rationale: Название יַם־סוּף буквально связано с тростником; перевод следует еврейскому выражению, а традиционное «Красное море» указанно в сноске.
- source_word: מִדְבַּר שׁוּר
  choice: пустыню Шур
  rationale: מִדְבָּר обозначает пустынную, необжитую местность; «пустыня» — естественный и устойчивый русский эквивалент.
- source_word: וַיֵּצְאוּ
  choice: вышли
  rationale: Прямо передаёт движение из области моря в пустыню и сохраняет последовательность повествования.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: три дня
  rationale: Винительный длительности передан естественным русским обозначением продолжительности без добавления отсутствующего в тексте слова «путь».
- source_word: בַּמִּדְבָּר
  choice: по пустыне
  rationale: Хотя предлог ב буквально может передаваться как «в», при глаголе движения русское «по пустыне» идиоматично выражает путь в пределах этой местности, не добавляя конечного пункта.
- source_word: וְלֹא מָצְאוּ מָיִם
  choice: и не находили воды
  rationale: Передаёт отсутствие воды на протяжении трёхдневного пути; несовершенный вид естественно связывает итоговое сообщение с указанной длительностью.
