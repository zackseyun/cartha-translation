  text: Yahweh will reign forever and ever[a].
translation:
  language: ru
  text: Яхве будет царствовать во веки веков.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: יהוה (ЙХВХ). Традиционно Божье имя передают словом «ГОСПОДЬ»; встречается также форма «Иегова».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: יִמְלֹךְ
  choice: будет царствовать
  rationale: Имперфект в контексте победной песни естественно выражает продолжающееся в будущем царствование; «царствовать» сохраняет царскую семантику глагола מלך.
- source_word: לְעֹלָם וָעֶד
  choice: во веки веков
  rationale: Устойчивое и понятное русское выражение передаёт усиленное обозначение неограниченной длительности и торжественный поэтический регистр еврейской формулы.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон. Форма «Яхве» сохраняет личное имя; примечание сообщает традиционную замену и альтернативную русскую форму, не внося их в основной текст.
- issue: Временная характеристика царствования
  choice: будет царствовать
  alternative: царствует
  rationale: Форма יִמְלֹךְ допускает оттенок настоящего или будущего в провозглашении вечной царской власти; в данном контексте выбрано естественное будущее время, при этом смысл не сводится к тому, будто царствование ещё не началось.
translation_notes:
  register: Краткая торжественная строка победной песни. Выражение «во веки веков» сохраняет библейско-поэтическую возвышенность, оставаясь понятным современному читателю.
