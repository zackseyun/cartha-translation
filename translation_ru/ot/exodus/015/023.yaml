  yaml_path: translation/ot/exodus/015/023.yaml
  text: Then they came to Marah[a], but they could not drink the water from Marah because it was bitter. Therefore it was named Marah.
translation:
  language: ru
  text: И пришли они в Мару[a], но не могли пить воду из Мары, потому что она была горькой. Поэтому это место назвали Марой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Мара» созвучно еврейскому слову «горький».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: И пришли они
  rationale: Форма wayyiqtol глагола בוא продолжает последовательное повествование; начальное «И» естественно передаёт связь с предыдущими событиями и сохраняет библейскую повествовательную плавность без архаизации.
- source_word: מָרָתָה
  choice: в Мару
  rationale: Название места מָרָה передано традиционной русской транслитерацией «Мара»; направительный ה выражен русским винительным падежом с предлогом «в».
- source_word: וְלֹא יָכְלוּ
  choice: но не могли
  rationale: Союз וְ здесь вводит смысловое противопоставление между прибытием и невозможностью пить; русское «но» ясно и естественно передаёт эту функцию.
- source_word: לִשְׁתֹּת מַיִם מִמָּרָה
  choice: пить воду из Мары
  rationale: מִן обозначает источник воды, поэтому выбрано «из Мары», а не более общее «в Маре».
- source_word: כִּי מָרִים הֵם
  choice: потому что она была горькой
  rationale: כִּי передаёт причину. Хотя в еврейском сказуемое стоит во множественном числе при грамматически множественном מַיִם, в современном русском «вода» требует единственного числа; смысл сохранён без неестественной кальки.
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Кратко и естественно передаёт причинно-следственный переход к объяснению названия.
- source_word: קָרָא שְׁמָהּ מָרָה
  choice: это место назвали Марой
  rationale: У глагола 3-го лица мужского рода единственного числа нет явного подлежащего, что допускает неопределённо-личное понимание. «Назвали» естественно сохраняет неопределённость деятеля; добавление «это место» делает русскую фразу ясной, не приписывая имя воде.
- source_word: מָרָה / מָרִים
  choice: Мара / горькой
  rationale: Имя собственное транслитерировано, а однокоренное прилагательное переведено. Связь названия со значением поясняется в сноске, поскольку русская форма сама по себе не раскрывает еврейскую игру слов.
