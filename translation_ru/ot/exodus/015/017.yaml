base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/017.yaml
  text: You will bring them in and plant them on the mountain of your inheritance— the place[a], Yahweh, that you made for your dwelling, the sanctuary, Lord[c][b], that your hands established.
translation:
  language: ru
  text: Ты приведёшь их и насадишь их[a] на горе Твоего наследия[b] — там, где Ты, Яхве, устроил место для Своего пребывания, святилище, которое утвердили Твои руки, Господи[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Насадишь их» сохраняет образ прочного поселения народа; по смыслу возможно также: «утвердишь их» или «поселишь их».'
    reason: lexical_alternative
  - marker: b
    text: «Гора Твоего наследия» может обозначать в широком смысле землю, где Бог поселяет Свой народ, или более конкретно гору Его святилища.
    reason: alternative_reading
  - marker: c
    text: В еврейском тексте здесь употреблён титул «Господи», тогда как ранее в стихе стоит личное имя Бога — Яхве.
    reason: cultural_note
lexical_decisions:
- source_word: תְּבִאֵמוֹ
  choice: Ты приведёшь их
  rationale: Каузативная форма глагола בוא означает, что Бог приведёт народ к предназначенному месту. «Приведёшь» естественно передаёт это движение по-русски, не добавляя отсутствующего в тексте уточнения о границах места.
- source_word: וְתִטָּעֵמוֹ
  choice: и насадишь их
  rationale: Глагол נטע буквально означает «сажать, насаждать». Сохранён конкретный поэтический образ прочного поселения народа, а не только его истолкование как «поселишь» или «утвердишь».
- source_word: בְּהַר נַחֲלָתְךָ
  choice: на горе Твоего наследия
  rationale: Формулировка сохраняет образ горы, принадлежащей Яхве как Его уделу или наследию, и не сужает возможный смысл до одной географической точки.
- source_word: מָכוֹן לְשִׁבְתְּךָ
  choice: на месте, которое Ты ... устроил для Своего обитания
  rationale: מָכוֹן обозначает устроенное, утверждённое место. Русская конструкция передаёт назначение этого места как Божьей обители и остаётся ясной для современного читателя.
- source_word: פָּעַלְתָּ
  choice: устроил
  rationale: פעל имеет широкое значение «сделать, совершить». В сочетании с местом Божьего обитания «устроил» звучит естественно и передаёт целенаправленное действие без чрезмерной конкретизации.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом; так сохраняется различие между יְהוָה и אֲדֹנָי в этом же стихе.
- source_word: מִקְּדָשׁ
  choice: во святилище
  rationale: מקדש означает святое место, святилище. «Святилище» — точный и естественный русский эквивалент; предлог согласует приложение с предшествующим обозначением места.
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Божественный титул передан традиционной русской формой обращения «Господи», что отличает его от личного имени «Яхве» и соответствует синтаксису поэтического обращения.
- source_word: כּוֹנְנוּ יָדֶיךָ
  choice: которое утвердили Твои руки
  rationale: Форма от כון выражает прочное основание или утверждение. Сохранён антропоморфный образ Божьих рук и множественное число подлежащего.
theological_decisions:
- issue: Передача יְהוָה и אֲדֹנָי в одном стихе
  choice: יְהוָה передано как «Яхве», а אֲדֹנָי — как «Господи»
  alternative: Передать оба обозначения словом «Господь» либо передать אֲדֹנָי как «Владыка»
  rationale: Различные русские формы сохраняют заметное в еврейском тексте различие между личным именем и титулом. Форма «Господи» естественно передаёт обращение и не добавляет притяжательного «мой».
- issue: Соотношение «горы Твоего наследия» и святилища
  choice: Сохранить широкую поэтическую формулировку без прямого отождествления горы с Сионом, храмовой горой или всей землёй Ханаана
  alternative: Явно назвать Сион или, напротив, истолковать гору как всю обещанную землю
  rationale: Контекст допускает движение от общего образа дарованной народу земли к конкретному месту Божьего святилища. Перевод сохраняет эту смысловую напряжённость и не решает вопрос точнее исходного текста.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим строем. Конкретные образы «насадишь» и «Твои руки» сохранены. Заглавные буквы в местоимениях, относящихся к Богу, поддерживают принятый в русском библейском стиле почтительный регистр; личное имя «Яхве» и титул «Господи» последовательно различены.
