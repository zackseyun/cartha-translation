  text: וַ/יֹּאמֶר֩ אִם שָׁמ֨וֹעַ תִּשְׁמַ֜ע לְ/ק֣וֹל יְהוָ֣ה אֱלֹהֶ֗י/ךָ וְ/הַ/יָּשָׁ֤ר בְּ/עֵינָי/ו֙ תַּעֲשֶׂ֔ה וְ/הַֽאֲזַנְתָּ֙ לְ/מִצְוֺתָ֔י/ו וְ/שָׁמַרְתָּ֖ כָּל חֻקָּ֑י/ו כָּֽל הַ/מַּֽחֲלָ֞ה אֲשֶׁר שַׂ֤מְתִּי בְ/מִצְרַ֨יִם֙ לֹא אָשִׂ֣ים עָלֶ֔י/ךָ כִּ֛י אֲנִ֥י יְהוָ֖ה רֹפְאֶֽ/ךָ־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/026.yaml
  text: He said[a], “If you diligently listen to the voice of Yahweh your God, and do what is right in his eyes, and give ear to his commandments, and keep all his statutes, I will put none of the diseases on you that I put on Egypt, for I am Yahweh, your healer.”
translation:
  language: ru
  text: 'Он сказал: «Если ты будешь внимательно слушать голос Яхве, твоего Бога, делать то, что правильно в его глазах, внимательно прислушиваться к его заповедям и соблюдать все его установления, то Я не наведу на тебя ни одной из тех болезней, которые навёл на Египет, ибо Я — Яхве, твой целитель[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо Я — Яхве, исцеляющий тебя».'
    reason: Причастие רֹפְאֶךָ можно понять как именное обозначение «твой целитель» или как глагольную характеристику «исцеляющий тебя».
lexical_decisions:
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: будешь усердно слушать
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает глагольную идею. «Усердно слушать» передаёт и буквальный слуховой образ, и подразумеваемую готовность повиноваться.
- source_word: לְקוֹל
  choice: голос
  rationale: Сохраняется конкретный образ еврейского выражения «слушать голос», понятный и в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное заветное имя Бога, стоящее в еврейском тексте.
- source_word: וְהַיָּשָׁר בְּעֵינָיו
  choice: делать то, что правильно в его глазах
  rationale: Формулировка сохраняет моральное значение יָשָׁר и исходный образ оценки «в его глазах», не заменяя его более толковательным «угодно ему».
- source_word: וְהַאֲזַנְתָּ
  choice: внимательно прислушиваться
  rationale: Передаётся значение сосредоточенного внимания и сохраняется небольшое смысловое отличие от первого глагола שׁמע.
- source_word: לְמִצְוֺתָיו
  choice: к его заповедям
  rationale: «Заповеди» — точное и естественное обозначение данных Богом обязательных повелений.
- source_word: וְשָׁמַרְתָּ כָּל חֻקָּיו
  choice: соблюдать все его установления
  rationale: «Соблюдать» естественно передаёт юридическое значение שׁמר, а «установления» — предписывающий характер חֻקִּים.
- source_word: כָּל הַמַּחֲלָה
  choice: ни одной из болезней
  rationale: Еврейское единственное число имеет собирательный смысл; отрицательная русская конструкция естественно передаёт охват всего множества болезней.
- source_word: אֲשֶׁר שַׂמְתִּי בְמִצְרַיִם / לֹא אָשִׂים עָלֶיךָ
  choice: которые навёл на Египет / не наведу на тебя
  rationale: Повтор одного русского глагола сохраняет лексическую связь двух форм שׂים; «навести болезнь» естественно по-русски и не уточняет сверх текста способ воздействия.
- source_word: רֹפְאֶךָ
  choice: твой целитель
  rationale: Именное выражение кратко передаёт причастную форму и сохраняет торжественное самообозначение; возможное глагольное прочтение вынесено в сноску.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно употреблён тетраграмматон; форма «Яхве» сохраняет личное имя, не подменяя его титулом.
- issue: Характер обещания о болезнях
  choice: условное заветное обещание Израилю в связи с послушанием и судом над Египтом
  alternative: безусловная гарантия физического исцеления каждому человеку; исключительно метафорическое духовное исцеление
  rationale: Условная конструкция самого стиха связывает обещание с внимательным послушанием и с конкретными бедствиями Египта. Перевод не расширяет и не сужает это утверждение богословски.
- issue: Грамматическая сила רֹפְאֶךָ
  choice: твой целитель
  alternative: исцеляющий тебя; тот, кто исцеляет тебя
  rationale: Причастие допускает как именное, так и глагольное понимание. Основной текст сохраняет лаконичное самообозначение, а сноска отражает реальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксический параллелизм условий сохранён, но архаизмы вроде «внимать» и «уставы» не используются. Местоимения, относящиеся к Богу, внутри предложения даны со строчной буквы по общим современным орфографическим нормам; «Я» после тире сохраняет прописную как начало самостоятельного самообозначения в прямой речи.
