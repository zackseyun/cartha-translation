  yaml_path: translation/ot/exodus/015/004.yaml
  text: Pharaoh’s chariots and his army he cast into the sea[a], and the choicest of his officers were sunk in the Sea of Reeds.
translation:
  language: ru
  text: Колесницы фараона и его войско Он бросил в море, и лучшие из его военачальников были потоплены в Тростниковом море.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный перевод: «Красное море». Буквально в еврейском тексте: «Тростниковое море».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְכְּבֹת
  choice: колесницы
  rationale: Множественное число обозначает боевые колесницы фараона; это точный и естественный русский эквивалент.
- source_word: פַּרְעֹה
  choice: фараона
  rationale: Устоявшаяся русская передача египетского царского титула; родительный падеж отражает принадлежность колесниц.
- source_word: וְחֵילוֹ
  choice: и войско его
  rationale: חַיִל в данном военном контексте означает вооружённые силы. Порядок слов сохраняет возвышенный поэтический регистр, оставаясь понятным.
- source_word: יָרָה
  choice: бросил
  rationale: Глагол передаёт энергичное действие — бросить или метнуть. «Бросил» естественно по-русски и сохраняет образ намеренного низвержения в море.
- source_word: בַיָּם
  choice: в море
  rationale: При глаголе движения русское «в море» естественно выражает направление внутрь вод.
- source_word: וּמִבְחַר
  choice: и лучшие из
  rationale: Существительное обозначает отборную, лучшую часть группы; конструкция «лучшие из» ясно передаёт селективное значение.
- source_word: שָׁלִשָׁיו
  choice: его военачальников
  rationale: שָׁלִישׁ обозначает высокопоставленного или отборного военного служащего, нередко связанного с колесничным войском. «Военачальники» передаёт военный ранг, не вводя чрезмерно узкой должности.
- source_word: טֻבְּעוּ
  choice: потоплены
  rationale: Страдательная форма сохранена и передаёт погружение под воду, не сводя образ только к факту смерти от утопления.
- source_word: בְיַם סוּף
  choice: в Тростниковом море
  rationale: Буквальное значение еврейского выражения — «море тростника/камыша». «Тростниковое море» передаёт исходную лексику, а традиционное название вынесено в примечание.
theological_decisions:
- issue: Передача יַם סוּף
  choice: Тростниковое море
  alternative: Красное море
  rationale: Основной текст следует буквальному значению еврейского названия, не отождествляя его без пояснения с традиционным географическим названием. Знакомый читателям вариант сохранён в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Заглавное «Он» указывает на Господа как на действующее лицо из ближайшего контекста песни; синтаксис сохраняет параллелизм исходного стиха.
