base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/002.yaml
  text: Yah is my strength and song[a], and he has become my salvation. This is my God, and I will praise him; my father's God, and I will exalt him.
translation:
  language: ru
  text: Ях — сила моя и песнь моя; Он стал моим спасением. Вот мой Бог — я прославлю Его[a]; Бог моего отца — я превознесу Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я устрою Ему жилище». Еврейский глагол здесь труден для однозначного толкования; он может также подразумевать украшение или прославление.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָזִּי
  choice: сила моя
  rationale: Существительное עֹז означает силу или мощь. Инверсия «сила моя» сохраняет поэтическую возвышенность и остаётся понятной современному читателю.
- source_word: וְזִמְרָת יָהּ
  choice: и песнь; Ях — сила моя и песнь
  rationale: זִמְרָה обозначает песнь или музыкальную хвалу. В устойчивом поэтическом сочетании со «силой» выбрано «песнь», а יָהּ понято как подлежащее всей именной фразы.
- source_word: יָהּ
  choice: Ях
  rationale: Сохранена краткая форма Божьего имени יָהּ, отличная по форме от тетраграмматона יהוה; русская передача «Ях» узнаваема и соответствует поэтическому характеру строки.
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: Он стал мне спасением
  rationale: Конструкция היה с ל выражает становление или обретённый результат для говорящего. Формулировка сохраняет еврейский образ, не сводя «спасение» только к действию.
- source_word: זֶה אֵלִי
  choice: Вот мой Бог
  rationale: «Вот» естественно передаёт указательное и эмфатическое זֶה в русском поэтическом высказывании.
- source_word: וְאַנְוֵהוּ
  choice: я прославлю Его
  rationale: Глагол допускает разные толкования. «Прославлю» хорошо соответствует контексту победной песни и параллели «превознесу», тогда как возможный смысл об устроении жилища сохранён в примечании.
- source_word: אֱלֹהֵי אָבִי
  choice: Бог моего отца
  rationale: Прямая и естественная передача конструкции с существительным в единственном числе и суффиксом первого лица.
- source_word: וַאֲרֹמְמֶנְהוּ
  choice: я превознесу Его
  rationale: «Превознесу» сохраняет метафору возвышения и уместный для гимна торжественный регистр.
theological_decisions:
- issue: Передача краткой формы Божьего имени יָהּ
  choice: Ях
  alternative: Господь
  rationale: Исходный текст содержит именно краткую форму יָהּ, а не полную форму יהוה. Её сохранение передаёт различие, присутствующее в еврейском тексте, без конфессионального истолкования.
- issue: Толкование וְאַנְוֵהוּ
  choice: я прославлю Его
  alternative: я устрою Ему жилище
  rationale: Основной вариант поддерживается поэтическим параллелизмом с «я превознесу Его» и контекстом хвалы. Поскольку морфология и этимология глагола допускают смысл жилища или украшения, альтернативу следует явно сохранить в примечании.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Инверсия «сила моя» и глагол «превознесу» поддерживают песенный регистр, не делая текст архаичным. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской издательской традиции.
