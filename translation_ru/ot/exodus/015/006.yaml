base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/006.yaml
  text: Your right hand[a], O Yahweh, is majestic in power; your right hand, O Yahweh[c][b], shatters the enemy.
translation:
  language: ru
  text: Твоя правая рука, Яхве[a], величественна своей мощью[b]; Твоя правая рука, Яхве, сокрушает врага[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH); традиционно передаётся «Господь».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «славна своей силой».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «разбивает врага».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִינְךָ
  choice: Твоя правая рука
  rationale: Сохраняет конкретный образ правой руки, которая в песне означает силу и победоносное действие Бога, не заменяя образ отвлечённым понятием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; форма обращения выражена русской пунктуацией.
- source_word: נֶאְדָּרִי
  choice: величественна
  rationale: Передаёт значение величия, славы и великолепия; согласование с выражением «правая рука» отражает предикативное употребление формы.
- source_word: בַּכֹּחַ
  choice: своей мощью
  rationale: Естественно передаёт сочетание предлога ב с существительным «сила, мощь» и по-русски связывается с «величественна» лучше, чем буквальное «в силе».
- source_word: תִּרְעַץ
  choice: сокрушает
  rationale: Сохраняет резкую, решительную силу глагола רָעַץ — разбивать, дробить, сокрушать — и подходит возвышенной воинской поэзии.
- source_word: אוֹיֵב
  choice: врага
  rationale: Сохраняет грамматическое единственное число; в контексте оно может обозначать врага собирательно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя יְהוָה. Транслитерация сохраняет его отличие от титула «Господь» и не вводит конфессионального толкования.
- issue: Образ Божьей правой руки
  choice: сохранён конкретный образ «правая рука»
  alternative: сила или могущество
  rationale: Текст поэтически приписывает победоносное действие правой руке Яхве. Перевод не устраняет телесный образ и не пытается заранее разрешить его метафорический смысл.
translation_notes:
  register: Возвышенный, но современный поэтический регистр. Повтор выражения «Твоя правая рука, Яхве» сохранён как важный элемент параллелизма победной песни. Архаичное «десница» не использовано ради ясности для современного читателя.
