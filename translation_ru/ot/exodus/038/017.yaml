base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/017.yaml
  text: The bases for the pillars were bronze[a], and the hooks of the pillars and their bands were silver, and the overlay of their tops was silver[b]; all the pillars of the courtyard were banded with silver.
translation:
  language: ru
  text: Основания[a] столбов были из бронзы, крюки на столбах и обручи[b] на них — из серебра; верхушки столбов были обложены серебром. Все столбы двора были опоясаны серебром.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подножия», «гнёзда».'
    reason: lexical_alternative
  - marker: b
    text: Точная форма этих деталей неизвестна; возможно, это были серебряные ободки или скрепы на столбах.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדָנִים
  choice: подножия
  rationale: В описании святилища слово обозначает опорные основания, в которые устанавливались столбы. «Подножия» понятно современному читателю и не создаёт излишне точного представления об их устройстве.
- source_word: עַמֻּדִים
  choice: столбы
  rationale: Речь идёт о вертикальных опорах ограды двора; «столбы» здесь естественнее, чем монументально звучащие «колонны».
- source_word: נְחֹשֶׁת
  choice: бронза
  rationale: В контексте древних металлических изделий это обычный и вероятный эквивалент; буквальная лексема может шире обозначать медь или медный сплав.
- source_word: וָוֵי
  choice: крюки
  rationale: Слово обозначает прикреплённые к столбам крюки как детали конструкции.
- source_word: חֲשׁוּקֵיהֶם
  choice: обручи
  rationale: Точная форма этой архитектурной детали неизвестна; «обручи» передаёт идею охватывающей или скрепляющей серебряной детали и сохраняет связь с однокоренным причастием далее.
- source_word: צִפּוּי רָאשֵׁיהֶם
  choice: верхушки столбов были обложены
  rationale: Передаёт металлическое покрытие верхней части столбов без чрезмерно технического термина «капители».
- source_word: מְחֻשָּׁקִים
  choice: опоясаны
  rationale: Передаёт наличие охватывающих серебряных деталей и сохраняет смысловую связь с «обручами».
- source_word: חָצֵר
  choice: двор
  rationale: В контексте святилища это ограждённый внешний двор; краткое «двор» соответствует устойчивой русской библейской терминологии.
