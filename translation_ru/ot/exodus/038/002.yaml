  text: He made its horns on its four corners[a]; its horns were of one piece with it[b], and he overlaid it with bronze.
translation:
  language: ru
  text: На четырёх его углах он сделал рога; они составляли с ним одно целое[a]. И обложил его бронзой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из него были его рога», то есть они не были изготовлены отдельно и затем прикреплены.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово нехошет может означать бронзу или медь; в описаниях святилища его традиционно переводят как «бронза».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: он сделал
  rationale: Обычная передача повествовательной формы глагола עשה; выражает простое действие без смыслового расширения.
- source_word: קַרְנֹתָיו
  choice: его рога
  rationale: Кֶרֶן буквально означает «рог»; применительно к жертвеннику это рогообразные выступы по углам. Конкретный образ и устоявшийся культовый термин сохранены.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: на четырёх его углах
  rationale: Близко передаёт пространственное значение עַל и естественно звучит по-русски.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: они составляли с ним одно целое
  rationale: 'Буквально: «из него были его рога». В описании изготовления это указывает, что рога не были отдельными прикреплёнными деталями.'
- source_word: וַיְצַף אֹתוֹ
  choice: и обложил его
  rationale: В контексте изготовления священных предметов צפה обозначает покрытие основы слоем металла; «обложил» — точная и естественная традиционная передача.
- source_word: נְחֹשֶׁת
  choice: бронзой
  rationale: Термин может обозначать медь или бронзу. В описаниях принадлежностей святилища «бронза» является общепринятой и контекстуально вероятной передачей; лексическая неоднозначность отмечена в сноске.
