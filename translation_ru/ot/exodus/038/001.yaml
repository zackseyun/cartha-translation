  text: He made the altar of burnt offering of acacia wood[a], five cubits its length and five cubits its width, square, and three cubits its height.
translation:
  language: ru
  text: 'Он сделал жертвенник для всесожжения из древесины акации: пять локтей в длину и пять локтей в ширину — квадратный, и три локтя в высоту.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Форма с последовательным waw повествует о завершённом действии; «он сделал» естественно продолжает русский рассказ, не добавляя отсутствующих в тексте оттенков.
- source_word: מִזְבַּח הָעֹלָה
  choice: жертвенник для всесожжения
  rationale: Сочетание обозначает жертвенник, предназначенный для жертвы всесожжения. Предлог «для» ясно передаёт назначение и звучит естественно по-русски.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: שִׁטִּים обозначает акацию; современное название породы понятнее традиционной транслитерации «ситтим».
- source_word: חָמֵשׁ אַמּוֹת
  choice: пять локтей
  rationale: Древнюю единицу измерения сохранено без пересчёта, что соответствует системе размеров скинии во всём контексте.
- source_word: אָרְכּוֹ
  choice: в длину
  rationale: В русской размерной формуле это естественный эквивалент буквального «его длина».
- source_word: רָחְבּוֹ
  choice: в ширину
  rationale: Современное и ясное обозначение поперечного размера.
- source_word: רָבוּעַ
  choice: квадратный
  rationale: Прилагательное означает квадратную, равностороннюю в плане форму; «квадратный» точно и естественно передаёт это значение.
- source_word: קֹמָתוֹ
  choice: в высоту
  rationale: В описании сооружения слово обозначает высоту; предложная конструкция согласуется с русской формулой размеров.
