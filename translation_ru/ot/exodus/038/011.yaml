    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹן
  choice: с северной стороны
  rationale: פאה обозначает сторону или край; вместе с צפון выражение указывает на северную сторону двора. Русская формулировка естественна для описания расположения.
- source_word: מֵאָה בָאַמָּה
  choice: сто локтей
  rationale: Фраза сообщает длину стороны. «Локоть» — общепринятая русская передача меры אַמָּה.
- source_word: עַמּוּדֵיהֶם
  choice: двадцать столбов
  rationale: עַמּוּדִים здесь означает вертикальные опоры ограды. Буквальное местоименное согласование древнееврейского текста по-русски звучало бы неясно, поэтому принадлежность передана контекстом.
- source_word: אַדְנֵיהֶם
  choice: двадцать оснований под ними
  rationale: אֶדֶן в описании святилища — опорное основание или гнездо для столба. Добавление «под ними» ясно связывает основания со столбами, не меняя смысла.
- source_word: נְחֹשֶׁת
  choice: бронза
  rationale: В описаниях святилища נְחֹשֶׁת традиционно и уместно передаётся как «бронза», хотя слово может охватывать медь и медные сплавы.
- source_word: וָוֵי הָעַמּוּדִים
  choice: крюки на столбах
  rationale: וָוִים в данном архитектурном контексте — крюки, прикреплённые к столбам. Предлог «на» естественнее русского буквального родительного оборота.
- source_word: חֲשֻׁקֵיהֶם
  choice: скрепы на них
  rationale: Термин обозначает серебряные детали столбов, вероятно охватывающие или соединяющие элементы. «Скрепы» сохраняет общий функциональный смысл без ложной точности; неопределённость уточнена в сноске.
- source_word: כָּסֶף
  choice: серебро
  rationale: Обычное название материала; здесь оно относится и к крюкам, и к скрепам.
