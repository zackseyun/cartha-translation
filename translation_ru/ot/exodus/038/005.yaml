lexical_decisions:
- source_word: וַיִּצֹק
  choice: Он отлил
  rationale: Глагол יצק в контексте изготовления металлических частей означает литьё металла; «отлил» естественно и точно передаёт завершённое действие.
- source_word: אַרְבַּע טַבָּעֹת
  choice: четыре кольца
  rationale: Прямое и обычное обозначение металлических колец, служивших креплениями для переноски.
- source_word: בְּאַרְבַּע הַקְּצָוֺת
  choice: на четырёх углах
  rationale: קָצֶה может означать край, конец или оконечность; для прямоугольной решётки «углы» ясно передаёт вероятное расположение, а подлинная лексическая неоднозначность отмечена в сноске.
- source_word: לְמִכְבַּר הַנְּחֹשֶׁת
  choice: медной решётки
  rationale: מִכְבָּר обозначает решётчатую конструкцию; נְחֹשֶׁת в данном контексте традиционно и естественно передаётся как «медь», без анахроничного уточнения состава сплава.
- source_word: בָּתִּים
  choice: гнёзда
  rationale: Буквально «дома», но здесь слово обозначает вместилища или крепления, в которые входили шесты; «гнёзда» кратко передаёт эту конструктивную функцию.
- source_word: לַבַּדִּים
  choice: для шестов
  rationale: בַּדִּים — шесты для переноски священной утвари; «шесты» — ясный и принятый современный эквивалент.
