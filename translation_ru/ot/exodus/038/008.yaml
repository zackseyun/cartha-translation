  yaml_path: translation/ot/exodus/038/008.yaml
  text: He made the basin of bronze and its stand of bronze from the mirrors of the women who served at the entrance to the tent of meeting[a][b].
translation:
  language: ru
  text: Он сделал бронзовый умывальник и его бронзовую подставку из зеркал женщин, служивших у входа в шатёр собрания[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «женщин, собиравшихся у входа в шатёр собрания». Еврейское выражение может указывать как на организованное собрание, так и на служение.'
    reason: alternative_reading
  - marker: b
    text: В древности зеркала обычно делали не из стекла, а из отполированного металла, в данном случае — из бронзы.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹר
  choice: умывальник
  rationale: Обозначает большую ёмкость для омовений при служении у святилища. «Умывальник» ясно передаёт назначение предмета и сохраняет достоинство стиля.
- source_word: כַּן
  choice: основание
  rationale: Обозначает опору или подставку умывальника. «Основание» естественно сочетается с данным предметом и передаёт его конструктивную функцию.
- source_word: נְחֹשֶׁת
  choice: бронзовый
  rationale: В описании принадлежностей святилища еврейское слово традиционно и правдоподобно обозначает бронзу, хотя в более широком употреблении может относиться также к меди.
- source_word: בְּמַרְאֹת
  choice: из зеркал
  rationale: 'Предлог ב здесь указывает на материал или источник: умывальник и его основание изготовлены из зеркал.'
- source_word: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: женщин, служивших
  rationale: Однокоренные формы צבא могут выражать организованное собирание для определённой службы. «Служивших» передаёт целенаправленное участие, не приписывая женщинам прямо не названного священнического статуса.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: у входа в шатёр встречи
  rationale: Передаёт пространственное значение выражения и использует понятное современному читателю наименование переносного святилища.
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Форма продолжает повествовательную последовательность; русское простое прошедшее время естественно передаёт действие, а субъект восстанавливается из контекста.
theological_decisions:
- issue: Кем были הַצֹּבְאֹת אֲשֶׁר צָבְאוּ и в чём состояла их роль
  choice: женщины, служившие у входа в шатёр встречи
  alternative: женщины, собиравшиеся у входа в шатёр встречи
  rationale: Корень צבא допускает оттенки организованного собрания и службы. Основной текст передаёт наиболее вероятную в контексте целенаправленную деятельность, но не определяет её как священническое служение; возможное значение «собиравшиеся» сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной и достойной библейской интонацией. Синтаксис близок к еврейскому тексту, но естественен по-русски; неоднозначность роли женщин вынесена в примечание.
