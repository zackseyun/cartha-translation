  yaml_path: translation/ot/exodus/038/026.yaml
  text: 'a beka per head[a], that is, half a shekel by the sanctuary shekel, for everyone who passed over to those counted[c][b], from twenty years old and upward: 603,550.'
translation:
  language: ru
  text: по беке с человека[a] — то есть по полшекеля согласно священному шекелю — со всякого, проходившего в число исчисленных[b], от двадцати лет и старше; всего 603 550 человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Бека — мера веса, равная половине шекеля по священному стандарту.
    reason: cultural_note
  - marker: b
    text: 'Или: «со всякого, проходившего среди исчисленных». В еврейском тексте использован язык переписи с образом людей, проходящих для регистрации.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּקַע
  choice: бека
  rationale: Техническое обозначение меры веса сохранено транслитерацией; следующее пояснение прямо указывает, что бека равна половине шекеля.
- source_word: לַגֻּלְגֹּלֶת
  choice: с человека
  rationale: Буквально «на череп»; в данном контексте это счётная идиома со значением «с каждого человека». Естественная русская передача избегает неуместного буквального образа.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: половина шекеля
  rationale: Прямая передача величины беки.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному шекелю
  rationale: Оборот обозначает установленный священный стандарт веса; формулировка сохраняет культовую отнесённость и естественна по-русски.
- source_word: לְכֹל הָעֹבֵר עַל הַפְּקֻדִים
  choice: со всякого, кто прошёл при исчислении
  rationale: Сохранён глагольный образ прохождения в контексте переписи, а не сведён к абстрактному «был записан»; сноска отмечает возможную синтаксическую передачу.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Естественная современная русская формула возрастного порога.
- source_word: לְשֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: всего с 603 550 человек
  rationale: Число передано цифрами по современной русской типографической норме; добавление «всего» и «человек» ясно выражает функцию еврейского оборота как указание общего количества учтённых лиц.
