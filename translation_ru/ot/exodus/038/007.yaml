  - marker: b
    text: 'Буквально: «полый, доски». Краткое еврейское выражение, вероятно, означает, что жертвенник был полой конструкцией из досок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: вставил
  rationale: Каузативная форма глагола בוא с указанием колец описывает помещение шестов внутрь них; «вставил» естественно и точно передаёт действие.
- source_word: הַבַּדִּים
  choice: шесты
  rationale: В контексте скинии это шесты, предназначенные для переноса священных предметов; слово современно и понятно.
- source_word: בַּטַּבָּעֹת
  choice: в кольца
  rationale: При глаголе движения предлог ב обозначает помещение внутрь колец.
- source_word: עַל צַלְעֹת הַמִּזְבֵּחַ
  choice: по сторонам жертвенника
  rationale: צלעות обозначает боковые стороны; «по сторонам» естественно указывает на расположение колец.
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: чтобы носить его на них
  rationale: Инфинитив выражает цель, а местоимение относится к шестам; в русском предмет обычно несут «на шестах».
- source_word: נְבוּב
  choice: полым
  rationale: Прилагательное прямо характеризует жертвенник как пустой внутри.
- source_word: לֻחֹת
  choice: из досок
  rationale: Краткое еврейское сочетание נְבוּב לֻחֹת описывает полую дощатую конструкцию; «из досок» передаёт материал и устройство без лишнего уточнения.
- source_word: עָשָׂה אֹתוֹ
  choice: он сделал
  rationale: Сохраняет простое значение עשה и отдельную заключительную конструкцию исходного текста.
