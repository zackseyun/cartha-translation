  text: וַ/יַּ֜עַשׂ אֶֽת כָּל כְּלֵ֣י הַ/מִּזְבֵּ֗חַ אֶת הַ/סִּירֹ֤ת וְ/אֶת הַ/יָּעִים֙ וְ/אֶת הַ/מִּזְרָקֹ֔ת אֶת הַ/מִּזְלָגֹ֖ת וְ/אֶת הַ/מַּחְתֹּ֑ת כָּל כֵּלָ֖י/ו עָשָׂ֥ה נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/003.yaml
  text: 'He made all the utensils of the altar: the pots[a], the shovels, the basins, the forks, and the firepans[b]. He made all its utensils of bronze.'
translation:
  language: ru
  text: 'Он сделал все принадлежности жертвенника: горшки[a], лопатки, чаши, вилки и совки для углей. Все его принадлежности он сделал из бронзы[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возможно, речь идёт о сосудах для удаления золы.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из меди».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי הַמִּזְבֵּחַ / כָּל כֵּלָיו
  choice: принадлежности жертвенника / все его принадлежности
  rationale: Широкое כְּלִי обозначает предметы оснащения, сосуды и орудия; «принадлежности» естественно охватывает весь перечень и позволяет сохранить лексический повтор.
- source_word: הַסִּירֹת
  choice: горшки
  rationale: Слово обычно обозначает горшки или котлы. В данном контексте они могли служить для удаления золы, но сам еврейский текст этого прямо не уточняет.
- source_word: הַיָּעִים
  choice: лопатки
  rationale: יַע — орудие для сгребания или зачерпывания; «лопатки» ясно передаёт форму и функцию в контексте служения у жертвенника.
- source_word: הַמִּזְרָקֹת
  choice: чаши
  rationale: מִזְרָק обозначает ритуальный сосуд, в частности для крови или других жидкостей; «чаши» — понятное и традиционно уместное обозначение без излишнего уточнения функции.
- source_word: הַמִּזְלָגֹת
  choice: вилки
  rationale: Существительное обозначает вилообразные орудия; буквальное «вилки» не добавляет отсутствующей в тексте конкретизации вроде «вилки для мяса».
- source_word: הַמַּחְתֹּת
  choice: совки для углей
  rationale: מַחְתָּה — приспособление для сгребания или переноса горячих углей. Функциональный перевод понятнее современному читателю, чем редкое культовое наименование.
- source_word: נְחֹשֶׁת
  choice: бронза
  rationale: В описании принадлежностей святилища традиционное и исторически правдоподобное соответствие — «бронза», хотя еврейское слово может также обозначать медь.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Он сделал ... он сделал
  rationale: 'Сохранён повтор глагола עשה: сначала он вводит перечень, затем подытоживает материал всех принадлежностей.'
theological_decisions: []
