  text: And with the one thousand seven hundred and seventy-five he made hooks for the pillars[a], overlaid their tops, and made bands for them.
translation:
  language: ru
  text: А из тысячи семисот семидесяти пяти шекелей он сделал крючки для столбов, покрыл серебром их верхушки и снабдил их обвязками.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соединил их полосами». Еврейский глагол может означать, что столбы снабдили охватывающими или соединительными металлическими полосами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הָאֶלֶף וּשְׁבַע הַמֵּאוֹת וַחֲמִשָּׁה וְשִׁבְעִים
  choice: А из тысячи семисот семидесяти пяти шекелей
  rationale: Фраза продолжает подсчёт серебра из предыдущего стиха. В русском для ясности естественно передать подразумеваемую единицу веса «шекелей» и показать, что это количество серебра было использовано на перечисленные изделия.
- source_word: עָשָׂה
  choice: он сделал
  rationale: Обычное и уместное обозначение изготовления в повествовательной описи.
- source_word: וָוִים
  choice: крючки
  rationale: В описании скинии слово обозначает металлические крючки, прикреплённые к столбам.
- source_word: לָעַמּוּדִים
  choice: для столбов
  rationale: «Столбы» — понятное и точное обозначение вертикальных опор двора скинии.
- source_word: וְצִפָּה רָאשֵׁיהֶם
  choice: покрыл серебром их верхушки
  rationale: Глагол в породе piel означает покрывать или облицовывать металлом; серебро ясно задано контекстом подсчёта. «Верхушки» естественно передаёт буквальное «головы» столбов.
- source_word: וְחִשַּׁק אֹתָם
  choice: и сделал для них обручи
  rationale: Редкий глагол в данном строительном контексте указывает на снабжение столбов охватывающими металлическими деталями. «Обручи» понятнее современному читателю, чем техническое или архаичное «связи/пояски», но неоднозначность отмечена в сноске.
