translation:
  language: ru
  text: С западной стороны были завесы длиной в пятьдесят локтей; при них было десять столбов и десять оснований. Крючки столбов и их обвязки[a] были серебряными.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово обозначает технические детали у столбов; возможны переводы: «обручи», «связи» или «соединительные детали». Их точный вид неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְאַת יָם
  choice: С западной стороны
  rationale: יָם буквально означает «море», но в данном описании служит обычным обозначением запада; פאה указывает на сторону сооружения.
- source_word: קְלָעִים
  choice: завесы
  rationale: В описании двора скинии слово обозначает полотнища, образующие ограду; «завесы» естественно и достаточно конкретно передаёт смысл.
- source_word: חֲמִשִּׁים בָּאַמָּה
  choice: простирались на пятьдесят локтей
  rationale: Еврейский текст кратко указывает меру; глагол «простирались» естественно выражает подразумеваемую протяжённость, не превращая её явно в высоту или иной размер.
- source_word: עַמּוּדֵיהֶם עֲשָׂרָה
  choice: столбов для них было десять
  rationale: Сохранены число и связь столбов с завесами, а инвентарная именная конструкция передана естественным современным русским синтаксисом.
- source_word: וְאַדְנֵיהֶם עֲשָׂרָה
  choice: и оснований — десять
  rationale: אֶדֶן здесь обозначает основание или гнездо под столб; «основание» понятно современному читателю и уместно в строительном контексте.
- source_word: וָוֵי הָעַמֻּדִים
  choice: Крючки столбов
  rationale: וָוִים в описании скинии — прикреплённые к столбам крючки; родительная конструкция следует еврейскому тексту без лишнего уточнения.
- source_word: וַחֲשׁוּקֵיהֶם
  choice: и их крепления
  rationale: Точный вид обозначенных техническим термином деталей неясен. Общее слово «крепления» сохраняет их строительную функцию, не утверждая без достаточных оснований, что это именно обручи, тяги или планки.
- source_word: כָּסֶף
  choice: были серебряными
  rationale: Существительное «серебро» употреблено предикативно и характеризует материал крючков и креплений; русская форма прилагательного передаёт это естественно.
