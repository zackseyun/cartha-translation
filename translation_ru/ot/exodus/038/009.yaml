  yaml_path: translation/ot/exodus/038/009.yaml
  text: He made the courtyard. On the south side[a], toward the south, the hangings of the courtyard were of finely twisted linen, a hundred cubits long.
translation:
  language: ru
  text: Он устроил двор. С южной стороны, к югу, завесы двора были из кручёного тонкого льна, длиной в сто локтей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он устроил
  rationale: Глагол עשה обозначает изготовление или устройство; в отношении двора естественное русское «устроил» точнее, чем буквальное «сделал», и сохраняет последовательность повествования без обязательного союза.
- source_word: הֶחָצֵר
  choice: двор
  rationale: חָצֵר здесь — ограждённый внешний двор скинии; «двор» является ясным и традиционно понятным русским соответствием.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: С южной стороны, к югу
  rationale: Перевод сохраняет оба южных ориентира еврейского текста, не сводя выражение к одному определению.
- source_word: קַלְעֵי הֶחָצֵר
  choice: завесы двора
  rationale: קְלָעִים обозначает полотнища, образующие ограду двора; «завесы» естественно и точно передаёт их функцию в данном контексте.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: из кручёного тонкого льна
  rationale: שֵׁשׁ указывает на тонкий лён, а מָשְׁזָר — на скрученную нить; формулировка передаёт и материал, и способ изготовления.
- source_word: מֵאָה בָּאַמָּה
  choice: длиной в сто локтей
  rationale: Слово «длиной» естественно выражает подразумеваемое измерение протяжённости завес; «локоть» сохраняет древнюю единицу меры.
