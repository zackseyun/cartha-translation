base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/024.yaml
  text: All the gold that was used for the work[a], in all the work of the sanctuary—the gold of the wave offering—was twenty-nine talents and seven hundred thirty shekels[b], according to the sanctuary shekel.
translation:
  language: ru
  text: Всё золото, использованное для всех работ, связанных со святилищем, — золото возношения[a], — составило двадцать девять талантов и семьсот тридцать шекелей[b], по священному шекелю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возношение — приношение, которое представляли перед Господом особым ритуальным движением.
    reason: cultural_note
  - marker: b
    text: Талант и шекель — древние единицы веса; здесь расчёт произведён по священному шекелю, то есть по принятому для святилища весовому стандарту.
    reason: measurement_note
lexical_decisions:
- source_word: הֶעָשׂוּי לַמְּלָאכָה
  choice: употреблённого для работы
  rationale: Причастие от עשה описывает золото в отношении строительных работ. «Употреблённого» ясно передаёт, что золото было использовано, а не изготовлено.
- source_word: בְּכֹל מְלֶאכֶת הַקֹּדֶשׁ
  choice: для всех работ по святилищу
  rationale: מְלָאכָה здесь обозначает совокупность работ по сооружению и оснащению святилища; такая формулировка естественна по-русски и сохраняет конкретный контекст.
- source_word: זְהַב הַתְּנוּפָה
  choice: золота, принесённого как возношение
  rationale: תְּנוּפָה — культовый термин для дара, представляемого перед Господом особым ритуальным движением. «Возношение» сохраняет связь с этим обрядовым понятием, а причастная конструкция звучит естественнее буквального «золото возношения».
- source_word: תֵּשַׁע וְעֶשְׂרִים כִּכָּר וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים שֶׁקֶל
  choice: двадцать девять талантов и семьсот тридцать шекелей
  rationale: Числа переданы в обычном современном русском порядке; древние единицы веса сохранены без пересчёта в основном тексте.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному шекелю
  rationale: Предлог בְּ указывает на применённый весовой стандарт. «По священному шекелю» кратко и точно передаёт этот смысл, не превращая святилище в обладателя шекеля.
theological_decisions:
- issue: Характер תְּנוּפָה как приношения
  choice: Сохранён обрядовый термин «возношение» с пояснением в сноске.
  alternative: «добровольное приношение» или просто «дар»
  rationale: Более общее обозначение было бы понятнее, но стёрло бы особый культовый термин и возможную связь с ритуальным движением дара перед Господом.
translation_notes:
  register: Современный литературный русский язык с достоинством, подобающим учётному разделу Пятикнижия. Тире помогают ясно передать пояснительное приложение в еврейском синтаксисе; древние культовые и весовые термины сохранены и кратко разъяснены.
