  text: וְֽ/כָל הַ/יְתֵדֹ֞ת לַ/מִּשְׁכָּ֧ן וְ/לֶ/חָצֵ֛ר סָבִ֖יב נְחֹֽשֶׁת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/020.yaml
  text: And all the pegs for the tabernacle and for the surrounding courtyard were bronze[a].
translation:
  language: ru
  text: И все колья для скинии и для двора вокруг неё были из бронзы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «меди». Еврейское נְחֹשֶׁת в зависимости от контекста может обозначать медь или бронзу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: И все
  rationale: Сочетание союза וְ с כָּל и существительным во множественном числе естественно передаётся собирательным оборотом «и все».
- source_word: הַיְתֵדֹת
  choice: колья
  rationale: יָתֵד обозначает кол или колышек, которым закрепляли шатровую конструкцию; «колья» кратко и естественно в данном контексте.
- source_word: לַמִּשְׁכָּן
  choice: для скинии
  rationale: מִשְׁכָּן — обычное в Исходе обозначение священного переносного жилища; «скиния» сохраняет устоявшуюся русскую библейскую терминологию и референциальную ясность.
- source_word: וְלֶחָצֵר סָבִיב
  choice: и для двора вокруг неё
  rationale: חָצֵר обозначает ограждённый двор, а סָבִיב — его расположение вокруг скинии. Местоимение «неё» естественно проясняет подразумеваемую пространственную связь, не меняя смысла.
- source_word: נְחֹשֶׁת
  choice: бронзы
  rationale: В описании материалов скинии נְחֹשֶׁת традиционно и контекстуально уместно передавать как «бронза», хотя слово может обозначать также медь.
