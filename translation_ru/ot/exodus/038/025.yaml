review_pass:
  verdict: revise
  source_fidelity: Числовые величины и единицы веса переданы точно. Однако «исчисленных из общины» в русском языке может означать людей, выделенных из общины, тогда как еврейская конструкция обозначает тех, кто был исчислен в составе общины. Замена предлога на «в» устраняет это ложное смысловое направление.
  naturalness: Фраза «серебра от исчисленных в общине» сохраняет краткий отчётный стиль и звучит естественнее, чем вариант с «из общины».
  terminology: '«Серебро», «таланты», «шекели» и «священный шекель» приемлемы. Примечание следует исправить: исходный текст говорит о стандарте веса, связанном со святилищем, но не уточняет, что этот стандарт был именно «для священных приношений».'
  issues:
  - severity: medium
    issue: Неудачное «из общины»
    rationale: Предлог «из» способен передать выборку или происхождение из группы, а не принадлежность исчисленных к общине; в оригинале פְּקוּדֵי הָעֵדָה — исчисленные/зарегистрированные в общине.
  - severity: low
    issue: Примечание добавляет «для священных приношений»
    rationale: בְּשֶׁקֶל הַקֹּדֶשׁ обозначает мерный стандарт «священного/святилищного шекеля»; конкретизация назначения стандарта священными приношениями не выражена в стихе.
  revised_text: А серебра от исчисленных в общине было сто талантов и тысяча семьсот семьдесят пять шекелей — по священному шекелю.[a]
