lexical_decisions:
- source_word: כֶסֶף
  choice: серебро
  rationale: В контексте отчёта о собранном материале речь идёт о металле, а не о деньгах вообще.
- source_word: פְּקוּדֵי
  choice: исчисленные
  rationale: Слово обозначает людей, зарегистрированных при исчислении; причастная форма сохраняет административный оттенок и связь с переписью.
- source_word: הָעֵדָה
  choice: община
  rationale: Здесь имеется в виду сообщество народа Израиля; «община» естественно и точно передаёт собирательное значение.
- source_word: מְאַת כִּכָּר
  choice: сто талантов
  rationale: Сохранена традиционная единица древнего веса без приблизительного пересчёта.
- source_word: וְאֶלֶף וּשְׁבַע מֵאוֹת וַחֲמִשָּׁה וְשִׁבְעִים שֶׁקֶל
  choice: и тысяча семьсот семьдесят пять шекелей
  rationale: Аддитивная еврейская числовая конструкция передана обычной русской формой полного числа.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному шекелю
  rationale: Фраза указывает на установленный священный стандарт веса; такой перевод краток и не ограничивает значение словом «святилище».
