- from: А серебра от исчисленных из общины было сто талантов и тысяча семьсот семьдесят пять шекелей — по священному шекелю.[a]
  to: А серебра от исчисленных в общине было сто талантов и тысяча семьсот семьдесят пять шекелей — по священному шекелю.[a]
