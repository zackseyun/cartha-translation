  yaml_path: translation/ot/exodus/038/013.yaml
  text: And for the east side[a], eastward, fifty cubits.
translation:
  language: ru
  text: А с восточной стороны[a], к восходу солнца, — пятьдесят локтей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для стороны к востоку, к восходу солнца».'
    reason: Сноска отражает сочетание двух близких древнееврейских обозначений восточного направления и более буквально передаёт предлог לְ.
lexical_decisions:
- source_word: וְ/לִ/פְאַת
  choice: А с … стороны
  rationale: פֵּאָה обозначает сторону, край или границу. В контексте измерения двора естественно русское «сторона»; предлогу לְ здесь соответствует идиоматическое «с», а союз וְ передан как «а», продолжая ряд измерений.
- source_word: קֵדְמָה
  choice: восточной
  rationale: В сочетании с מִזְרָחָה слово указывает на восточную сторону; определение «восточной» естественно согласуется со словом «стороны».
- source_word: מִזְרָחָה
  choice: к восходу солнца
  rationale: מִזְרָח буквально связано с местом восхода солнца и обозначает восток. Такой перевод сохраняет парное направительное выражение оригинала, не сводя два близких обозначения к одному.
- source_word: חֲמִשִּׁים
  choice: пятьдесят
  rationale: Прямое соответствие количественному числительному.
- source_word: אַמָּה
  choice: локтей
  rationale: Стандартное библейское обозначение линейной меры אַמָּה; после «пятьдесят» требуется родительный падеж множественного числа.
