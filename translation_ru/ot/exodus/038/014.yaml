lexical_decisions:
- source_word: קְלָעִים
  choice: завесы
  rationale: В описании двора скинии слово обозначает полотнища, образующие ограду. «Завесы» — ясный и устоявшийся русский термин в этом контексте.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: длиной в пятнадцать локтей
  rationale: В еврейском тексте дана мера без отдельного слова «длина»; в русском оно добавлено для естественной и однозначной передачи размера завес.
- source_word: אֶל הַכָּתֵף
  choice: с одной стороны
  rationale: כָּתֵף буквально означает «плечо», а здесь — боковую сторону участка у входа во двор. Формулировка передаёт пространственный смысл без излишнего уточнения, отсутствующего в данном стихе.
- source_word: עַמּוּדֵיהֶם
  choice: для них было три столба
  rationale: Местоименная связь относится к завесам или названному участку. «Столбы» — естественный архитектурный термин; конструкция «для них» ясно выражает принадлежность.
- source_word: אַדְנֵיהֶם
  choice: три основания
  rationale: Слово обозначает опорные основания, в которые устанавливались столбы. «Основания» понятно широкому читателю, а более техническое «гнёзда» сохранено в примечании.
