base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/015.yaml
  text: And for the other side[a], on this side and on that side of the gate of the courtyard, there were hangings of fifteen cubits, their pillars three[b], and their bases three.
translation:
  language: ru
  text: Для другой боковой стороны — с одной и с другой стороны от ворот двора — были завесы длиной в пятнадцать локтей, три столба и три основания[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «гнёзда».'
    reason: Еврейское אֶדֶן может означать основание или опорное гнездо, в которое устанавливался столб.
lexical_decisions:
- source_word: לַכָּתֵף ... הַשֵּׁנִית
  choice: с другой стороны
  rationale: כָּתֵף буквально означает «плечо, бок, сторона»; здесь речь идёт о второй боковой части ограды у ворот. «С другой стороны» естественно передаёт пространственный смысл.
- source_word: מִזֶּה וּמִזֶּה
  choice: по эту и по ту сторону
  rationale: Фраза распределительно указывает на обе части, примыкающие к воротам, и сохраняет явную симметрию еврейского выражения.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: ворот двора
  rationale: Сочетание связывает боковые участки с воротами двора; родительная конструкция по-русски передаёт эту связь ясно и естественно.
- source_word: קְלָעִים
  choice: завесы
  rationale: В описании скинии слово обозначает полотнища, образующие ограду двора. «Завесы» — понятный и традиционно уместный архитектурный термин.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: по пятнадцать локтей
  rationale: Древняя мера сохранена без пересчёта. Частица «по» ясно показывает, что указанная длина относится к каждой из двух боковых завес, что следует из контекста и параллельной конструкции стиха 14.
- source_word: עַמֻּדֵיהֶם שְׁלֹשָׁה
  choice: три столба
  rationale: עַמּוּד здесь обозначает вертикальную опору ограды. «Столбы» естественнее для конструкции двора, чем «колонны», а число сохранено.
- source_word: וְאַדְנֵיהֶם שְׁלֹשָׁה
  choice: и три основания
  rationale: אֶדֶן обозначает нижнюю опорную деталь, иногда понимаемую как гнездо. «Основания» доступнее современному читателю, а буквальная альтернатива приведена в сноске.
