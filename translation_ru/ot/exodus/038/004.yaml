  yaml_path: translation/ot/exodus/038/004.yaml
  text: He made for the altar a grating[a], a network of bronze, under its ledge, beneath[c][b], up to its halfway point.
translation:
  language: ru
  text: И сделал он для жертвенника бронзовую решётку[a] сетчатой работы — под его выступом, снизу до половины его высоты.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «решётку — изделие сетчатой работы — из бронзы».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст допускает более буквальный перевод: «под его выступом, снизу до его середины». Слово, переведённое как «выступ», можно также понять как «обод», «кайма» или «опоясывающая полоса».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: И сделал он
  rationale: Форма wayyiqtol продолжает последовательность повествования; начальное «и» естественно сохраняет связность еврейского текста.
- source_word: לַמִּזְבֵּחַ
  choice: для жертвенника
  rationale: Предлог ל обозначает назначение изготовленного предмета, а не его местоположение.
- source_word: מִכְבָּר מַעֲשֵׂה רֶשֶׁת
  choice: решётку в виде сетки
  rationale: מִכְבָּר обозначает решётчатую конструкцию, а מַעֲשֵׂה רֶשֶׁת уточняет её сетчатое устройство; формулировка передаёт оба элемента без тяжеловесного буквального повтора.
- source_word: נְחֹשֶׁת
  choice: бронзовую
  rationale: В контексте принадлежностей скинии традиционное и контекстуально вероятное значение — бронза; медь лексически возможна.
- source_word: כַּרְכֻּבּוֹ
  choice: его выступом
  rationale: Редкое слово указывает на выступающую кайму или опоясывающую часть жертвенника; «выступ» ясно передаёт конструктивный характер детали, не утверждая чрезмерно точную форму.
- source_word: מִלְּמַטָּה עַד חֶצְיוֹ
  choice: внизу … до половины его высоты
  rationale: Передаёт пространственный диапазон от нижней части до середины жертвенника естественным современным русским языком.
