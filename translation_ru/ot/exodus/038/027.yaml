base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/027.yaml
  text: 'The hundred talents of silver were for casting the bases of the sanctuary and the bases of the veil: one hundred bases for the hundred talents[b][a], a talent for each base.'
translation:
  language: ru
  text: 'Сто талантов серебра пошли на отливку оснований[a] святилища и оснований завесы[b]: сто оснований на сто талантов — по таланту на каждое основание.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «гнёзд» — металлических опорных деталей в основании скинии.
    reason: lexical_alternative
  - marker: b
    text: Здесь имеется в виду внутренняя завеса, отделявшая Святое место от Святого святых.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: пошли
  rationale: В контексте отчёта глагол указывает, на что было употреблено серебро; «пошли на» естественно передаёт это значение по-русски.
- source_word: מְאַת כִּכַּר הַכֶּסֶף
  choice: сто талантов серебра
  rationale: Точно передаёт количество и меру веса в естественной русской конструкции.
- source_word: לָצֶקֶת
  choice: на отливку
  rationale: Инфинитив выражает назначение, а в контексте обработки металла корень יצק означает литьё, то есть изготовление путём отливки.
- source_word: אַדְנֵי
  choice: оснований
  rationale: Речь идёт о металлических опорных деталях под брусьями святилища и столбами завесы; «основания» понятно современному читателю и не навязывает чрезмерно узкую форму детали.
- source_word: הַקֹּדֶשׁ
  choice: святилища
  rationale: Здесь слово обозначает священное сооружение скинии, основания которого перечисляются отдельно от оснований завесы.
- source_word: הַפָּרֹכֶת
  choice: завесы
  rationale: Это специальная внутренняя завеса скинии, отделявшая Святое святых; «завеса» сохраняет культовую специфику термина.
- source_word: לִמְאַת הַכִּכָּר
  choice: из ста талантов
  rationale: Предлог соотносит сто оснований со ста талантами серебра; русское «из» естественно обозначает материал, использованный для их отливки, при сохранении числового соответствия.
- source_word: כִּכָּר לָאָדֶן
  choice: по таланту на каждое основание
  rationale: 'Передаёт распределительное соотношение: один талант серебра на одно основание.'
