  source_fidelity: 'Текст точно передаёт еврейскую конструкцию: כָּל («все»), קַלְעֵי («завесы/полотнища»), הֶחָצֵר («двора»), סָבִיב («по всему периметру») и שֵׁשׁ מָשְׁזָר («из кручёного льна»). «По всему периметру» удачно раскрывает пространственное значение סָבִיב в контексте ограды двора.'
