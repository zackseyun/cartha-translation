  text: כָּל קַלְעֵ֧י הֶ/חָצֵ֛ר סָבִ֖יב שֵׁ֥שׁ מָשְׁזָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/016.yaml
  text: All the hangings of the courtyard all around were of finely twisted linen[a].
translation:
  language: ru
  text: Все завесы двора по всему периметру были из кручёного льна.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Все полотнища двора со всех сторон были из кручёного льна».'
    reason: Лексические варианты для קַלְעֵי и סָבִיב; «полотнища» подчёркивает тканевую конструкцию ограды, а «со всех сторон» ближе воспроизводит пространственное значение наречия.
lexical_decisions:
- source_word: כָּל
  choice: все
  rationale: Передаёт совокупность всех завес двора и естественно сочетается с формой множественного числа.
- source_word: קַלְעֵי
  choice: завесы
  rationale: В данном культово-архитектурном контексте обозначает полотнища, образующие ограду двора; «завесы» точнее и естественнее, чем более общее «занавеси».
- source_word: הֶחָצֵר
  choice: двора
  rationale: חָצֵר здесь означает ограждённый внешний двор при скинии.
- source_word: סָבִיב
  choice: по всему периметру
  rationale: Ясно выражает расположение завес со всех сторон двора и естественно звучит в описании сооружения.
- source_word: שֵׁשׁ
  choice: лён
  rationale: В описаниях скинии слово обозначает льняной материал; перевод существительным сохраняет предметность исходного выражения.
- source_word: מָשְׁזָר
  choice: кручёный
  rationale: Обозначает материал из скрученных или ссученных нитей; «кручёный лён» сохраняет технический характер описания без добавления отсутствующего в еврейском тексте определения «тонкий».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка в стиле описания устройства скинии. Термин «завесы» сохраняет культово-архитектурный оттенок, а «кручёный лён» не вносит спорного добавочного значения «тонкий».
