  source_fidelity: 'Основной смысл передан верно: פְקוּדֵי обозначает официальный отчёт/учёт, «скиния свидетельства» сохраняет повтор и термин עֵדֻת, а «по повелению Моисея» точно передаёт עַל־פִּי מֹשֶׁה. Однако «который ... составили левиты» слишком прямо превращает конструкцию «служение левитов» в личное сказуемое. Более нейтральная пассивная формулировка лучше сохраняет синтаксическую и смысловую связь оригинала.'
