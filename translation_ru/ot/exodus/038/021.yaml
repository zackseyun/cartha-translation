  text: אֵ֣לֶּה פְקוּדֵ֤י הַ/מִּשְׁכָּן֙ מִשְׁכַּ֣ן הָ/עֵדֻ֔ת אֲשֶׁ֥ר פֻּקַּ֖ד עַל פִּ֣י מֹשֶׁ֑ה עֲבֹדַת֙ הַ/לְוִיִּ֔ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/021.yaml
  text: These are the records of the tabernacle[a], the tabernacle of the testimony, as they were recorded at the command of Moses[c][b], by the service of the Levites under the direction of Ithamar son of Aaron the priest.
translation:
  language: ru
  text: Вот отчёт[a] о скинии — скинии свидетельства[b], составленный по повелению Моисея левитами под руководством[c] Итамара, сына Аарона, священника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опись» или «учёт». Еврейское слово обозначает официальное исчисление.'
    reason: lexical_alternative
  - marker: b
    text: «Свидетельство», вероятно, относится к свидетельству завета, прежде всего к скрижалям, помещённым в ковчег.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «рукой Итамара» — оборот, обозначающий посредничество или руководство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: отчёт
  rationale: Существительное обозначает официальное исчисление или учёт материалов. «Отчёт» естественно передаёт административный характер данного раздела; возможны также «опись» и «учёт».
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: Устоявшееся русское библейское обозначение переносного святилища; оно точно соответствует культовому контексту книги Исход.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: скиния свидетельства
  rationale: Сохранено повторение и широкое значение עֵדֻת, не сводя его в основном тексте исключительно к скрижалям или документу завета.
- source_word: פֻּקַּד
  choice: составили
  rationale: Пассивная форма глагола פקד продолжает тему официального учёта. В русской фразе активная конструкция «который… составили левиты» яснее выражает подразумеваемых исполнителей, не меняя смысла.
- source_word: עַל פִּי מֹשֶׁה
  choice: по повелению Моисея
  rationale: Идиома буквально связана с «устами», но здесь означает действие согласно слову или распоряжению Моисея.
- source_word: עֲבֹדַת הַלְוִיִּם
  choice: составили левиты
  rationale: Буквально выражение означает «служение/работа левитов». В контексте учёта оно указывает, что порученную работу выполнили левиты.
- source_word: בְּיַד אִיתָמָר
  choice: под руководством Итамара
  rationale: Оборот «рукой Итамара» обозначает его посредничество или надзор; в данном контексте естественнее значение руководства.
- source_word: הַכֹּהֵן
  choice: священника
  rationale: Обычное русское соответствие титулу כֹּהֵן; зависимая форма «сына священника Аарона» естественно передаёт еврейское приложение «сына Аарона, священника».
theological_decisions:
- issue: Значение выражения «свидетельство»
  choice: Сохранено «скиния свидетельства» без уточнения предмета свидетельства в основном тексте.
  alternative: «Скиния скрижалей завета» или «скиния заветного свидетельства».
  rationale: В контексте, вероятно, имеются в виду скрижали свидетельства, находившиеся в ковчеге, однако еврейское выражение допускает более широкую формулировку; конкретизация дана только в примечании.
translation_notes:
  register: 'Современный литературный русский с сохранением привычных библейских терминов «скиния», «левиты» и «священник». Синтаксис упрощён для ясности: пассивная еврейская конструкция передана активной, а тире сохраняет пояснительное повторение оригинала. Имя אִיתָמָר передано непосредственно с древнееврейского как «Итамар», а не в традиционной грецизированной форме «Ифамар».'
