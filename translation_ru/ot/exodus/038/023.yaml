  yaml_path: translation/ot/exodus/038/023.yaml
  text: And with him was Oholiab son of Ahisamach[a], of the tribe of Dan, an engraver, a designer, and an embroiderer in blue, in purple, in scarlet yarn[b], and in fine linen.
translation:
  language: ru
  text: Вместе с ним был Аголиав, сын Ахисамаха, из колена Дана, — мастер, мастер узоров и вышивальщик, работавший с голубой, пурпурной и алой пряжей[a] и тонким льном.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение обозначает текстильный материал, окрашенный в алый цвет; возможно также: «алым материалом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתּוֹ
  choice: Вместе с ним был
  rationale: Естественно передаёт вводную предложную конструкцию без выраженного глагола и связывает Аголиава с Веселеилом из предыдущего стиха.
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: Аголиав, сын Ахисамаха
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён, при этом патронимическая конструкция передана прямо.
- source_word: לְמַטֵּה דָן
  choice: из колена Дана
  rationale: Фраза обозначает принадлежность к племени; «колено» остаётся понятным и уместным термином в библейском повествовании.
- source_word: חָרָשׁ
  choice: резчик
  rationale: В данном перечне ремёсел слово обозначает искусного мастера; конкретное «резчик» соответствует контексту изготовления святилища, хотя само еврейское слово может иметь более широкое значение.
- source_word: וְחֹשֵׁב
  choice: художник по узорам
  rationale: Передаёт художественное замышление и выполнение узоров, не сводя роль однозначно только к ткачеству или только к абстрактному проектированию.
- source_word: וְרֹקֵם
  choice: вышивальщик
  rationale: Ясное современное обозначение мастера вышивки по тканям.
- source_word: בַּתְּכֵלֶת וּבָאַרְגָּמָן וּבְתוֹלַעַת הַשָּׁנִי וּבַשֵּׁשׁ
  choice: работавший с голубой, пурпурной и алой пряжей и тонким льном
  rationale: Естественная русская формулировка сохраняет все четыре вида материала и не навязывает более точного технического отношения между пряжей, вышивкой и льном, чем выражено в еврейском тексте.
