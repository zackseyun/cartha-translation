  text: And the screen for the gate of the courtyard was the work of an embroiderer[a], in blue and purple and scarlet yarn, and fine twined linen, twenty cubits long, and five cubits high[c][b], corresponding in width to the hangings of the courtyard.
translation:
  language: ru
  text: 'Завеса у входа во двор была работой вышивальщика: из голубой, пурпуровой и алой пряжи и тонкого кручёного льна. Длина её была двадцать локтей, а высота — пять локтей[a], в соответствии с полотнищами двора.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «а высота по ширине — пять локтей»; вероятно, имеется в виду, что высота входной завесы соответствовала высоте остальных полотнищ двора.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָסַךְ שַׁעַר הֶחָצֵר
  choice: завеса у входа во двор
  rationale: מָסַךְ обозначает тканевую завесу, закрывающую вход; שַׁעַר здесь естественно передать как «вход», поскольку речь не о жёстких воротах, а о проходе с тканевой завесой.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: выполнена вышивальщиком
  rationale: Сохраняет указание на работу искусного мастера по узорчатому текстилю и звучит естественно по-русски.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: из голубой, пурпуровой и алой пряжи
  rationale: Цветовые термины обозначают окрашенные текстильные материалы; слово «пряжа» эксплицирует подразумеваемый материал без изменения смысла.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: тонкого кручёного льна
  rationale: Передаёт как качество льна, так и способ его изготовления; это устойчивая формула описания материалов святилища.
- source_word: עֶשְׂרִים אַמָּה אֹרֶךְ
  choice: длиной она была двадцать локтей
  rationale: Сохраняет древнюю меру и ясно передаёт размерную формулу.
- source_word: וְקוֹמָה בְרֹחַב חָמֵשׁ אַמּוֹת
  choice: а высотой — пять локтей
  rationale: Передаёт наиболее вероятный смысл трудной еврейской размерной конструкции; необычное בְרֹחַב отмечено в сноске.
- source_word: לְעֻמַּת קַלְעֵי הֶחָצֵר
  choice: в соответствии с завесами двора
  rationale: לְעֻמַּת выражает соответствие; завеса входа имела ту же высоту, что и окружающие двор полотнища.
