  terminology: «Завеса», «двор», «локти», цветовые обозначения и «тонкий кручёный лён» уместны. Для קַלְעִים предпочтительно «полотнища», поскольку это окружающие двор текстильные полотнища, а не та же входная завеса. Сноска сохраняет спорную/необычную размерную конструкцию без её догматического разрешения.
  issues:
