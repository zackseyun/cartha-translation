  - severity: low
    issue: «Была выполнена вышивальщиком» несколько сглаживает именную формулу «работа вышивальщика».
    rationale: מַעֲשֵׂה רֹקֵם буквально характеризует изделие как работу мастера. Замена на «была работой вышивальщика» точнее при сохранении естественного русского звучания.
