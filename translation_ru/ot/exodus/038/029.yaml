  text: וּ/נְחֹ֥שֶׁת הַ/תְּנוּפָ֖ה שִׁבְעִ֣ים כִּכָּ֑ר וְ/אַלְפַּ֥יִם וְ/אַרְבַּע מֵא֖וֹת שָֽׁקֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/029.yaml
  text: And the bronze of the wave offering was seventy talents and 2,400 shekels[a][b].
translation:
  language: ru
  text: А бронзы[a], принесённой как приношение потрясания[b], было семьдесят талантов и две тысячи четыреста шекелей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «меди»; еврейское נְחֹשֶׁת может обозначать как медь, так и бронзу — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: '«Приношение потрясания» — специальное название дара, который представляли перед Господом посредством ритуального движения; возможен более общий перевод: «представленное приношение» или «пожертвование».'
    reason: cultural_note
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: бронза
  rationale: Еврейское слово может обозначать медь или бронзу. В перечне обработанного металла для принадлежностей скинии уместен традиционный и контекстуально вероятный перевод «бронза», при этом возможное значение «медь» отмечено в сноске.
- source_word: הַתְּנוּפָה
  choice: приношение потрясания
  rationale: Сохранён специальный культовый термин, обозначающий приношение, которое ритуально двигали перед Господом. Оборот «принесённой как» естественно связывает название обряда с металлом.
- source_word: שִׁבְעִים כִּכָּר
  choice: семьдесят талантов
  rationale: Древняя крупная мера веса сохранена без приблизительного пересчёта в основном тексте.
- source_word: וְאַלְפַּיִם וְאַרְבַּע מֵאוֹת שָׁקֶל
  choice: две тысячи четыреста шекелей
  rationale: Шекель сохранён как древняя мера веса, а число передано словами в плавном литературном стиле.
- source_word: וְ
  choice: А
  rationale: Союз связывает стих с предшествующим перечнем итоговых количеств; русское «А» естественно вводит следующий пункт учёта.
