lexical_decisions:
- source_word: עַמּוּדֵיהֶם
  choice: столбов у них
  rationale: עַמּוּדִים обозначает несущие столбы или стойки. Суффикс 3-го лица множественного числа сохранён без уточнения референта, поскольку контекст допускает связь с ранее упомянутыми завесами или стороной двора.
- source_word: עֶשְׂרִים
  choice: двадцать
  rationale: Обычное количественное числительное; одинаково передано в обоих случаях.
- source_word: אַדְנֵיהֶם
  choice: оснований у них
  rationale: В описании скинии אֶדֶן — основание с гнездом для установки столба или бруса. «Основание» понятно современному читателю, а более предметное «гнездо» вынесено в примечание.
- source_word: נְחֹשֶׁת
  choice: медных
  rationale: נְחֹשֶׁת может обозначать медь или медный сплав, включая бронзу. «Медных» сохраняет традиционное и лексически широкое русское обозначение без необоснованного уточнения состава сплава.
- source_word: וָוֵי הָעַמֻּדִים
  choice: крюки на столбах
  rationale: וָוִים — крюки или крепёжные элементы, принадлежавшие столбам. Русское «на столбах» естественно выражает эту принадлежность и вероятное расположение.
- source_word: חֲשֻׁקֵיהֶם
  choice: обручи на них
  rationale: Редкое слово связано с охватывающими столбы деталями; «обручи» передаёт основное предметное значение, не исключая функции крепления или соединения.
- source_word: כָּסֶף
  choice: серебряными
  rationale: Прямое обозначение материала — серебра.
