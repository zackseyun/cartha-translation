lexical_decisions:
- source_word: אַדְנֵי
  choice: основания
  rationale: В контексте устройства скинии слово обозначает металлические опорные детали, в которые устанавливались стойки. «Основания» — ясный современный эквивалент, подходящий и для ограды, и для её ворот.
- source_word: חָצֵר
  choice: ограда
  rationale: Здесь слово обозначает ограждённое внешнее пространство святилища, а в сочетании с основаниями и кольями внимание сосредоточено на самой окружающей конструкции. «Ограда» естественно передаёт этот строительный контекст.
- source_word: סָבִיב
  choice: по всему её периметру
  rationale: Передаёт пространственно-распределительное значение «кругом, со всех сторон» и естественно сочетается с оградой.
- source_word: שַׁעַר
  choice: ворота
  rationale: Прямое и традиционное обозначение входа в ограду; множественное число естественно для русского названия ворот как конструкции.
- source_word: יִתְדֹת
  choice: колья
  rationale: Слово обозначает крепёжные колья, удерживавшие скинию и ограду; «колья» точно и естественно передаёт предмет переносного святилища.
- source_word: מִּשְׁכָּן
  choice: скиния
  rationale: Устоявшееся русское библейское обозначение переносного шатра-святилища; сохраняет терминологическую точность и связь с контекстом Исхода.
- source_word: כָּל
  choice: все
  rationale: Естественно выражает полноту перечисления перед существительным во множественном числе.
- source_word: וְאֵת / וְאֶת
  choice: и
  rationale: Повторяющиеся союз и показатель прямого дополнения организуют перечень; по-русски это естественно передаётся сочинением без отдельного перевода показателя дополнения.
