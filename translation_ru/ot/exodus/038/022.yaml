  text: וּ/בְצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֣ה יְהוּדָ֑ה עָשָׂ֕ה אֵ֛ת כָּל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/022.yaml
  text: And Bezalel son of Uri[a], son of Hur, of the tribe of Judah, made all that Yahweh had commanded Moses.
translation:
  language: ru
  text: И Веселеил, сын Урии, сына Ора, из колена Иуды, сделал всё, что Яхве[a] повелел Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно переводится «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְצַלְאֵל
  choice: И Веселеил
  rationale: Союз ו передан как «И», чтобы сохранить связь с предшествующим повествованием. Для имени использована укоренившаяся русская библейская форма «Веселеил».
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: сын Урии, сына Ора
  rationale: Повторение בֶּן обозначает непосредственную родословную цепочку. Родительный оборот по-русски естественно показывает, что Ор — отец Урии, а не второй отец Веселеила.
- source_word: לְמַטֵּה יְהוּדָה
  choice: из колена Иуды
  rationale: מַטֶּה в контексте принадлежности к Израилю означает племя/колено; «из колена Иуды» — понятная и устоявшаяся русская библейская формулировка.
- source_word: עָשָׂה
  choice: сделал
  rationale: Широкое значение глагола — «делать, изготовлять». В контексте сооружения святилища «сделал» сохраняет и конкретный, и обобщающий смысл.
- source_word: אֵת כָּל אֲשֶׁר
  choice: всё, что
  rationale: Оборот передаёт полноту исполненного и естественно звучит на современном русском языке.
- source_word: צִוָּה
  choice: повелел
  rationale: «Повелел» точно передаёт властное распоряжение и сохраняет достойный библейский регистр без ненужного предпрошедшего времени, которого еврейская форма сама по себе не требует.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом; традиционный русский вариант указан в сноске.
- source_word: אֶת מֹשֶׁה
  choice: Моисею
  rationale: 'После צִוָּה частица אֵת маркирует лицо, которому дано повеление; нормативное русское управление требует дательного падежа: «повелел Моисею».'
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно сохранено в основном тексте. Традиционная замена именем-титулом «Господь» отмечена в сноске, без смешения имени и титула.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Сохранены традиционные русские формы библейских имён; синтаксис упрощён лишь настолько, чтобы родословная и принадлежность к колену были однозначно понятны.
