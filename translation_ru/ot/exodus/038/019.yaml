  footnotes:
  - marker: a
    text: 'Или: «подножия» или «гнёзда». Еврейское слово обозначает металлические опоры у основания столбов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «покрытие верхушек». Еврейское слово буквально означает «покрытие» или «обкладка».'
    reason: lexical_alternative
  - marker: c
    text: Точная форма этих серебряных деталей неясна. Возможны также переводы «пояски», «полосы» или «соединительные планки».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵיהֶם
  choice: столбов… у них
  rationale: עַמּוּד обозначает столб или колонну; «столб» — естественный и устойчивый термин в описании двора скинии.
- source_word: אַדְנֵיהֶם
  choice: оснований
  rationale: אֶדֶן здесь обозначает металлическую опору у подножия столба. «Основание» понятно современному читателю; возможное «подножие» отмечено в сноске.
- source_word: נְחֹשֶׁת
  choice: бронзовых
  rationale: В перечнях материалов скинии נְחֹשֶׁת традиционно и уместно передаётся как «бронза», хотя слово может шире обозначать медь или медный сплав.
- source_word: וָוֵיהֶם
  choice: крюки на них
  rationale: וָו обозначает крепёжные крюки; «крюки» точно и понятно передаёт их функцию без излишней конкретизации.
- source_word: כֶּסֶף
  choice: серебряные
  rationale: כֶּסֶף в данном контексте однозначно обозначает материал — серебро. В русском естественна форма относительного прилагательного.
- source_word: צִפּוּי רָאשֵׁיהֶם
  choice: обкладка их верхушек
  rationale: צִפּוּי — покрытие или обкладка, а רָאשֵׁיהֶם буквально «их головы», то есть верхушки. Именная конструкция оригинала сохранена.
- source_word: חֲשֻׁקֵיהֶם
  choice: обручи на них
  rationale: Точная форма этих деталей не вполне ясна. «Обручи» сохраняет образ охватывающих элементов и не навязывает слишком узкой реконструкции.
