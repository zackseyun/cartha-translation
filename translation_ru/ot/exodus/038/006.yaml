  terminology: «Шесты» верно передаёт баддим как переносные шесты, а не конструктивные перекладины. «Акация» понятна современному читателю. «Бронза» согласуется с обычным обозначением נְחֹשֶׁת в описаниях скинии; сноска корректно сохраняет допустимую альтернативу «медь» без искусственного устранения лексической неоднозначности.
