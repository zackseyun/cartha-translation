lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Форма Qal wayyiqtol от עשה продолжает последовательное повествование. В русском тексте союз можно опустить без утраты смысла.
- source_word: הַבַּדִּים
  choice: шесты
  rationale: В контексте священной утвари בַּדִּים обозначает шесты для переноски; это точнее, чем «перекладины».
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Конструкция буквально означает древесину акации. Такое выражение естественно и понятно в современном литературном русском языке.
- source_word: וַיְצַף
  choice: и обложил
  rationale: В ремесленном контексте צפה означает покрыть поверхность предмета слоем металла; «обложил» сохраняет традиционную точность описания.
- source_word: אֹתָם
  choice: их
  rationale: Местоименный суффикс прямого дополнения относится к шестам.
- source_word: נְחֹשֶׁת
  choice: бронзой
  rationale: נְחֹשֶׁת может обозначать медь или бронзу. «Бронза» соответствует обычному обозначению этого материала в описаниях скинии, при сохранении альтернативы в сноске.
