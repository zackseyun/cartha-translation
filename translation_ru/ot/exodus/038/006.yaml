  source_fidelity: 'Текст точно передаёт еврейский оригинал: וַיַּעַשׂ передано как «Он сделал», הַבַּדִּים — как «шесты», עֲצֵי שִׁטִּים — «из древесины акации», а וַיְצַף...נְחֹשֶׁת — «обложил их бронзой». Местоимение «их» однозначно относится к шестам. Последовательный союз wayyiqtol в русском естественно не выражен отдельным «и».'
