  yaml_path: translation/ot/exodus/038/030.yaml
  text: With it he made the bases for the entrance of the tent of meeting[a], the bronze altar, the bronze grating for it[b], and all the utensils of the altar.
translation:
  language: ru
  text: Из неё он сделал основания для входа в Шатёр встречи[a], бронзовый жертвенник, бронзовую решётку для него[b] и всю утварь жертвенника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гнёзда для входа в Шатёр встречи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бронзовую сетку, принадлежавшую ему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: он сделал
  rationale: Обычное повествовательное значение глагола עשה; естественная и точная передача в данном перечне изготовленных предметов.
- source_word: בָּהּ
  choice: из неё
  rationale: Местоимение отсылает к бронзе, исчисленной в предыдущем стихе; по-русски материал изготовления естественно обозначить конструкцией «из неё».
- source_word: אַדְנֵי
  choice: основания
  rationale: В описаниях святилища אַדֶן обозначает металлические опорные основания; этот вариант понятен современному читателю и не чрезмерно технический.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: для входа в Шатёр встречи
  rationale: Передаёт назначение оснований и значение פֶּתַח как входа или проёма; «Шатёр встречи» сохраняет образ переносного святилища и смысл назначенной встречи.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: бронзовый жертвенник
  rationale: Нְחֹשֶׁת может обозначать медь или бронзу; в контексте древней металлической утвари традиционное «бронзовый» уместно, а вещественная неоднозначность отмечена неявно контекстом и общепринятой терминологией.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: бронзовую решётку
  rationale: מִכְבָּר обозначает решётчатое или сетчатое приспособление жертвенника; «решётка» конкретно и естественно по-русски.
- source_word: אֲשֶׁר לוֹ
  choice: для него
  rationale: Кратко сохраняет широкую связь принадлежности или назначения между решёткой и жертвенником, не уточняя её расположения.
- source_word: כָּל כְּלֵי הַמִּזְבֵּחַ
  choice: всю утварь жертвенника
  rationale: Собирательное «утварь» естественно передаёт כְּלֵי как совокупность принадлежностей и орудий жертвенника.
