  terminology: «Основания» — понятная передача אַדְנֵי; сноска корректно сообщает более специальный вариант «гнёзда». «Бронзовый жертвенник» и «бронзовая решётка» соответствуют контексту и принятым русским библейским обозначениям. Сноска b предлагает допустимый вариант для מִכְבָּר и относительной связи с жертвенником.
