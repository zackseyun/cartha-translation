  text: You shall no longer give straw to the people for making bricks as before[a]; let them go and gather straw for themselves.
translation:
  language: ru
  text: «Больше не давайте народу соломы для изготовления кирпичей, как прежде[a]. Пусть сами идут и собирают себе солому».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как вчера и позавчера»; это выражение означает «как прежде» или «раньше».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאסִפוּן לָתֵת
  choice: Больше не давайте
  rationale: Отрицание с формой глагола יסף выражает прекращение прежнего действия. Такая передача естественно и ясно обозначает запрет впредь выдавать солому.
- source_word: תֶּבֶן
  choice: солома
  rationale: Обычное значение слова в данном контексте — растительный материал, использовавшийся при изготовлении кирпичей.
- source_word: לָעָם
  choice: народу
  rationale: Сохраняет прямое значение עַם и не сужает обозначение до «работников», хотя в контексте речь идёт об израильтянах, занятых на работах.
- source_word: לִלְבֹּן הַלְּבֵנִים
  choice: для изготовления кирпичей
  rationale: Инфинитив с дополнением обозначает цель; выбранная формулировка точна и естественна для современного русского языка.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: как прежде
  rationale: Буквально выражение отсылает ко «вчера и третьему дню», но идиоматически означает прежнее, обычное доныне положение.
- source_word: הֵם יֵלְכוּ
  choice: Пусть сами идут
  rationale: Самостоятельное местоимение подчёркивает, что теперь это должны делать они; имперфект в данном распоряжении имеет побудительную силу.
- source_word: וְקֹשְׁשׁוּ
  choice: и собирают
  rationale: קשש означает собирать разбросанный материал; «собирают» ясно передаёт действие без излишней конкретизации.
- source_word: לָהֶם
  choice: себе
  rationale: Дательный местоименный суффикс показывает, что народ должен добывать солому для собственных нужд, а не получать её от надсмотрщиков.
