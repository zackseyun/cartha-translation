base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/021.yaml
  text: And they said to them[a], “May Yahweh look on you and judge, because you have made us stink in the sight of Pharaoh and in the sight of his servants, putting a sword in their hand to kill us.”
translation:
  language: ru
  text: 'И сказали им: «Пусть Яхве посмотрит на вас и рассудит, ведь вы сделали нас отвратительными[a] в глазах фараона и его слуг, вложив им в руки меч, чтобы убить нас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вы сделали наш запах зловонным», то есть сделали нас отвратительными или неприятными.'
    reason: Сноска сохраняет конкретный образ еврейского текста и поясняет его идиоматический смысл, не добавляя более сильное толкование «ненавистными».
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵהֶם
  choice: И сказали им
  rationale: Сохраняет повествовательную связь и местоимение еврейского текста; из контекста речь обращена к Моисею и Аарону, но имена здесь не добавляются.
- source_word: יֵרֶא יְהוָה עֲלֵיכֶם וְיִשְׁפֹּט
  choice: Пусть Яхве увидит вас и рассудит
  rationale: Обе формы переданы как пожелание-проклятие. «Рассудит» сохраняет идею Божьего суда, не уточняя сверх текста характер приговора.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: אֲשֶׁר
  choice: ведь
  rationale: Естественно вводит основание обвинения и передаёт причинную связь.
- source_word: הִבְאַשְׁתֶּם אֶת־רֵיחֵנוּ
  choice: вы сделали нас отвратительными
  rationale: Еврейская фраза буквально говорит о том, что запах стал зловонным; по-русски выбран ясный идиоматический смысл, а образ отмечен в сноске.
- source_word: בְּעֵינֵי פַרְעֹה וּבְעֵינֵי עֲבָדָיו
  choice: в глазах фараона и его слуг
  rationale: Сохраняется повторяемый еврейский образ оценки или отношения со стороны фараона и его служителей, без тяжеловесного удвоения «в глазах».
- source_word: לָתֵת חֶרֶב בְּיָדָם לְהָרְגֵנוּ
  choice: вложив им в руки меч, чтобы убить нас
  rationale: Передаёт образ предоставления средств или повода для убийства; единственное число «меч» соответствует еврейскому тексту.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет это различие.
- issue: Смысл וְיִשְׁפֹּט в проклятии
  choice: и рассудит
  alternative: и осудит вас
  rationale: Более широкое «рассудит» сохраняет судебную семантику, не подменяя обращение к Божьему суду уже вынесенным обвинительным приговором.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Реплика звучит резко и обвинительно; образ меча и обращение к Божьему суду сохранены.
