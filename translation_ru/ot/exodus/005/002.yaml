source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה מִ֤י יְהוָה֙ אֲשֶׁ֣ר אֶשְׁמַ֣ע בְּ/קֹל֔/וֹ לְ/שַׁלַּ֖ח אֶת יִשְׂרָאֵ֑ל לֹ֤א יָדַ֨עְתִּי֙ אֶת יְהוָ֔ה וְ/גַ֥ם אֶת יִשְׂרָאֵ֖ל לֹ֥א אֲשַׁלֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/002.yaml
  text: Pharaoh said[a], “Who is Yahweh, that I should obey his voice and let Israel go? I do not know Yahweh, and moreover I will not let Israel go.”
translation:
  language: ru
  text: 'Фараон сказал: «Кто такой Яхве[a], чтобы мне слушаться его голоса и отпустить Израиль? Я не знаю Яхве, да и Израиль не отпущу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (тетраграмматон); традиционно переводится «Господь». Другой вариант передачи имени — «Иегова».'
    reason: Указывает форму Божьего имени в исходном тексте и основные традиции его передачи.
lexical_decisions:
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Общепринятое русское обозначение египетского правителя; в данном контексте это титул конкретного правителя.
- source_word: מִי יְהוָה
  choice: Кто такой Яхве
  rationale: מִי спрашивает о личности; добавление естественного для русского вопроса слова «такой» передаёт пренебрежительный вызов фараона, не превращая вопрос в запрос о свойствах.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление Божьего имени в еврейском тексте, а не заменяет его титулом.
- source_word: אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ
  choice: чтобы мне слушаться его голоса
  rationale: שׁמע с בְּקוֹל обозначает не просто слышание, а послушание. Русское «слушаться его голоса» сохраняет и смысл повиновения, и образ исходного выражения.
- source_word: לְשַׁלַּח אֶת יִשְׂרָאֵל
  choice: отпустить Израиль
  rationale: В контексте исхода שׁלח означает позволить народу уйти; «отпустить» естественно и точно передаёт это значение.
- source_word: לֹא יָדַעְתִּי
  choice: Я не знаю
  rationale: Форма выражает нынешнее заявление фараона. «Не знаю» сохраняет возможный диапазон от незнакомства до отказа признавать, не выбирая молча только одно толкование.
- source_word: וְגַם
  choice: да и
  rationale: 'Русское «да и» естественно передаёт добавочное усиление: фараон не только заявляет, что не знает Яхве, но и прямо отказывается отпустить Израиль.'
- source_word: לֹא אֲשַׁלֵּחַ
  choice: не отпущу
  rationale: Имперфект здесь выражает решительный отказ; будущее время в русском языке передаёт волю фараона.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Традиционная русская форма имени; здесь обозначает народ Израиля как единое целое.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе стоит собственное имя Бога, поэтому транслитерация «Яхве» сохраняет различие между именем и титулом. В сноске указаны традиционная замена и альтернативная форма.
- issue: Смысл заявления לֹא יָדַעְתִּי אֶת־יְהוָה
  choice: Я не знаю Яхве
  alternative: Я не признаю Яхве
  rationale: Буквальная и естественная формулировка сохраняет богословское напряжение между фактическим незнанием и вызывающим отказом признать власть Яхве.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Формулировка краткая и резкая, как в еврейском оригинале; «да и» передаёт усиление без книжной тяжеловесности. Имя «Яхве» не склоняется.
