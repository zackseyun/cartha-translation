  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ מֶ֣לֶךְ מִצְרַ֔יִם לָ֚/מָּה מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן תַּפְרִ֥יעוּ אֶת הָ/עָ֖ם מִ/מַּֽעֲשָׂ֑י/ו לְכ֖וּ לְ/סִבְלֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/004.yaml
  text: But the king of Egypt said to them[a], “Why, Moses and Aaron[b], are you causing the people to neglect their work? Go to your burdens.”
translation:
  language: ru
  text: 'Но царь Египта сказал им: «Моисей и Аарон, зачем вы отрываете народ от работы?[a] Ступайте на свои тяжёлые работы[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зачем вы мешаете народу трудиться?»'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к своим тяготам»; возможно: «на свои принудительные работы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но … сказал
  rationale: Последовательная форма глагола продолжает повествование, а союз «но» естественно передаёт противопоставление ответа царя просьбе Моисея и Аарона в предыдущем стихе.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: царь Египта
  rationale: Точная и естественная передача древнееврейской сопряжённой конструкции.
- source_word: לָמָּה
  choice: зачем
  rationale: В контексте обвинительного вопроса «зачем» звучит по-русски естественнее, чем «почему», и передаёт упрёк в намеренном действии.
- source_word: תַּפְרִיעוּ
  choice: отрываете
  rationale: Каузативная форма глагола פרע здесь означает, что Моисей и Аарон мешают народу продолжать назначенную работу. «Отрываете … от работы» сохраняет каузативный смысл без положительного оттенка освобождения.
- source_word: הָעָם
  choice: народ
  rationale: Сохранено широкое обозначение исходного текста; оно не сужено до «работников».
- source_word: מִמַּעֲשָׂיו
  choice: от работы
  rationale: Единственное число местоименного суффикса согласовано с собирательным существительным «народ»; по-русски принадлежность здесь и без местоимения ясна из контекста.
- source_word: לְכוּ
  choice: ступайте
  rationale: Повелительная форма передана прямо; «ступайте» естественно выражает резкий приказ царя в литературном русском языке.
- source_word: לְסִבְלֹתֵיכֶם
  choice: на свои тяжёлые работы
  rationale: Существительное סְבָלוֹת обозначает тяжёлые трудовые тяготы или повинности. Выбранная формулировка естественна по-русски и сохраняет представление об изнурительном труде, не делая принудительный характер более явным, чем в самом слове.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой, властной репликой царя. Формулировки понятны широкому читателю; обвинительный тон и тяжесть труда сохранены без конфессиональных уточнений.
