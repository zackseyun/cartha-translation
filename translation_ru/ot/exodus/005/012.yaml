lexical_decisions:
- source_word: וַיָּפֶץ
  choice: рассеялся
  rationale: Форма от פוץ описывает рассредоточение народа по обширной территории; русское «рассеялся» естественно передаёт это вынужденное движение, не вводя явно выраженного в еврейском тексте деятеля.
- source_word: הָעָם
  choice: народ
  rationale: Обычное соответствие עם; здесь слово собирательно обозначает израильтян, привлечённых к работе.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: по всей земле Египетской
  rationale: Оборот передаёт распространение движения по всей территории Египта; эта формулировка сохраняет библейское достоинство и понятна современному читателю.
- source_word: לְקֹשֵׁשׁ
  choice: чтобы собирать
  rationale: קשש означает собирать мелкие разрозненные остатки растений; целевая конструкция с «чтобы» естественно передаёт ל с инфинитивом.
- source_word: קַשׁ
  choice: жнивьё
  rationale: Слово обозначает оставшиеся на поле сухие стебли или стерню. «Жнивьё» сохраняет отличие от תֶּבֶן и подходит для материала, который собирают после жатвы.
- source_word: לַתֶּבֶן
  choice: вместо соломы
  rationale: В контексте собранные остатки растений должны заменить ранее выдававшуюся солому. «Вместо соломы» ясно передаёт подразумеваемое заместительное назначение, хотя буквально предлог допускает более общее «для соломы».
