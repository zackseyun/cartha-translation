    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Тогда ... пришли
  rationale: Форма wayyiqtol продвигает повествование; «тогда» естественно передаёт последовательность событий.
- source_word: שֹׁטְרֵי
  choice: надсмотрщики
  rationale: В данном контексте это израильтяне, поставленные над рабочими и подчинённые египетским распорядителям; «надсмотрщики» ясно передаёт их функцию.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: из сынов Израиля
  rationale: Сохранён буквальный родовой образ исходного выражения; предлог «из» естественно показывает, что сами надсмотрщики принадлежали к сынам Израиля.
- source_word: וַיִּצְעֲקוּ
  choice: воззвали
  rationale: Глагол выражает настойчивый вопль или жалобное обращение, а не просто спокойную просьбу.
- source_word: אֶל פַּרְעֹה
  choice: к фараону
  rationale: Предлог указывает адресата и направление обращения; сочетание естественно связано и с приходом, и с воззванием.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Еврейский стандартный вводитель речи в современном русском естественно передаётся пунктуационно без избыточного «говоря».
- source_word: לָמָּה תַעֲשֶׂה כֹה
  choice: Почему ты так поступаешь
  rationale: Передаёт буквальное «почему ты делаешь так» близко к форме оригинала и одновременно естественно по-русски.
- source_word: לַעֲבָדֶיךָ
  choice: со своими рабами
  rationale: В условиях принудительного труда עבד может обозначать рабов; притяжательное «своими» естественно передаёт обращённое к фараону «твоими» в русской конструкции с «поступать».
theological_decisions:
- issue: Степень несвободы, выраженная עבד
  choice: рабы
  alternative: слуги
  rationale: Контекст принудительного труда поддерживает значение «рабы», однако почтительная формула обращения к правителю допускает перевод «слуги»; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного стиля. «Воззвали» сохраняет силу жалобы, не становясь разговорным; обращение к фараону передано на «ты», как в древнееврейском оригинале.
