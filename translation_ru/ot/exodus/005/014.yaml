translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Термины выбраны так, чтобы различать израильских распорядителей и фараоновых надсмотрщиков; архаичные «десятники» и чрезмерно современные «бригадиры» не использованы.
