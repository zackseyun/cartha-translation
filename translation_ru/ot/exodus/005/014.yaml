base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/014.yaml
  text: And the Israelite foremen[a], whom Pharaoh’s taskmasters had set over them, were beaten, saying, “Why have you not finished your quota of brickmaking as before, both yesterday and today?”
translation:
  language: ru
  text: 'Израильских распорядителей, которых надсмотрщики фараона поставили над другими израильтянами, били со словами: «Почему вы не выполнили установленную вам норму изготовления кирпичей, как прежде[a], ни вчера, ни сегодня?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как вчера и третьего дня»; это выражение означает «как прежде» или «как раньше».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּכּוּ
  choice: били
  rationale: Пассивная форма глагола נכה обозначает физическое наказание, не уточняя его способ; русское «били» сохраняет эту неопределённость.
- source_word: שֹׁטְרֵי בְּנֵי יִשְׂרָאֵל
  choice: распорядителей из числа израильтян
  rationale: В контексте принудительных работ שֹׁטְרִים — поставленные над другими израильтянами низшие руководители или учётчики. «Распорядители» отличает их от египетских надсмотрщиков и не вносит узкого современного значения слова «бригадиры».
- source_word: אֲשֶׁר שָׂמוּ עֲלֵהֶם נֹגְשֵׂי פַרְעֹה
  choice: которых надсмотрщики фараона поставили над ними
  rationale: נֹגְשִׂים здесь — надсмотрщики, принуждавшие людей к работе; относительная конструкция и местоименная соотнесённость сохранены.
- source_word: לֵאמֹר
  choice: и спрашивали
  rationale: Стандартный ввод прямой речи перед вопросом естественно передан русским глаголом речи «спрашивали»; он не добавляет содержания к самому вопросу.
- source_word: מַדּוּעַ לֹא כִלִּיתֶם
  choice: Почему вы не выполнили
  rationale: כלה с обозначением установленной нормы означает довести предписанное до исполнения; «выполнили» естественно сочетается со словом «норма».
- source_word: חָקְכֶם
  choice: установленную вам норму
  rationale: חֹק означает предписанную или установленную долю; в трудовом контексте точным современным соответствием служит «норма».
- source_word: לִלְבֹּן
  choice: изготовления кирпичей
  rationale: Инфинитив от לבן в данном контексте обозначает изготовление кирпичей и грамматически зависит от слова «норма».
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: как прежде
  rationale: Буквальное указание на вчерашний и предшествующий день функционирует как идиома со значением прежнего порядка или обычая.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: ни вчера, ни сегодня
  rationale: Парная конструкция גַּם...גַּם находится в сфере отрицания; русское «ни... ни...» естественно и точно выражает невыполнение нормы в оба дня.
