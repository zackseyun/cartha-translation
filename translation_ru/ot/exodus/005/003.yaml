  text: וַ/יֹּ֣אמְר֔וּ אֱלֹהֵ֥י הָ/עִבְרִ֖ים נִקְרָ֣א עָלֵ֑י/נוּ נֵ֣לֲכָה נָּ֡א דֶּרֶךְ֩ שְׁלֹ֨שֶׁת יָמִ֜ים בַּ/מִּדְבָּ֗ר וְ/נִזְבְּחָה֙ לַֽ/יהוָ֣ה אֱלֹהֵ֔י/נוּ פֶּ֨ן יִפְגָּעֵ֔/נוּ בַּ/דֶּ֖בֶר א֥וֹ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/003.yaml
  text: And they said[a], “The God of the Hebrews has met with us. Please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God, lest he strike us with plague or with the sword.”
translation:
  language: ru
  text: 'И они сказали: «Бог евреев встретился с нами[a]. Позволь нам отправиться на три дня пути в пустыню, чтобы принести жертву Яхве, нашему Богу, иначе Он поразит нас мором или мечом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призвал нас». Еврейский оборот может означать, что Бог встретился с ними или призвал их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Бог евреев
  rationale: Сохраняет буквальное этническое обозначение עִבְרִים, употреблённое в этом повествовании, не заменяя его словом «израильтяне».
- source_word: נִקְרָא עָלֵינוּ
  choice: явился нам
  rationale: Естественно по-русски передаёт совершившуюся встречу с Богом; возможное значение призыва сохранено в сноске.
- source_word: נֵלֲכָה נָּא
  choice: Позволь же нам уйти
  rationale: Передаёт побудительное значение когортатива и просительный оттенок частицы נָא без излишне разговорного «пожалуйста».
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: на три дня пути
  rationale: Естественная русская передача еврейского оборота, обозначающего длительность или расстояние пути.
- source_word: בַּמִּדְבָּר
  choice: в пустыню
  rationale: Обычная и понятная русская передача מִדְבָּר; здесь речь идёт о незаселённой пустынной местности, а не обязательно о песчаной пустыне.
- source_word: וְנִזְבְּחָה
  choice: и принести жертву
  rationale: Сохраняет последовательность когортативов; в русском инфинитив естественно зависит от просьбы «позволь нам» и выражает цель пути.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога, тетраграмматон יהוה.
- source_word: פֶּן
  choice: иначе
  rationale: Современная и ясная русская передача предостерегающего значения פֶּן; менее архаична, чем «дабы не» или «как бы не».
- source_word: יִפְגָּעֵנוּ
  choice: Он поразит нас
  rationale: В данном контексте פגע обозначает враждебное или карающее воздействие; «поразит» естественно сочетается с язвой и мечом.
- source_word: בַּדֶּבֶר
  choice: моровой язвой
  rationale: Передаёт דֶּבֶר как смертоносную эпидемию; выражение сохраняет библейское достоинство и остаётся понятным современному читателю.
- source_word: בֶחָרֶב
  choice: мечом
  rationale: Прямая инструментальная передача существительного חֶרֶב с предлогом בְּ.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе стоит собственное имя Бога. Форма «Яхве» прямо обозначает тетраграмматон и не смешивает имя с титулом «Господь».
- issue: Субъект угрозы в יִפְגָּעֵנוּ
  choice: Он поразит нас
  alternative: Бог поразит нас; поразят нас
  rationale: Местоимение «Он» грамматически соотнесено с Яхве, нашим Богом, и сохраняет представленную говорящими угрозу Божьего наказания, не объясняя её дополнительно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; подлинная неоднозначность נִקְרָא עָלֵינוּ вынесена в сноску.
