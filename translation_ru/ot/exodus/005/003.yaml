  naturalness: «Бог евреев встретился с нами» несколько необычно, но в современном литературном русском понятно и уместно для возвышенного библейского повествования; сноска сохраняет альтернативу. «Отправиться на три дня пути» и «чтобы принести жертву» яснее выражают соответственно путь и цель просьбы. «Мором» — естественное, краткое и достаточно понятное в данном регистре соответствие דֶּבֶר.
  terminology: «Евреи» точно сохраняет עִבְרִים, не подменяя его «израильтянами». «Яхве» последовательно передаёт יהוה. «Мечом» и «мором» сохраняют инструментальную конструкцию и библейский регистр без доктринального истолкования.
