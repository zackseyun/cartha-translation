base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/023.yaml
  text: For since I came to Pharaoh to speak in your name[a], he has done evil to this people[c][b], and you have certainly not delivered your people.
translation:
  language: ru
  text: Ведь с тех пор, как я пришёл к фараону говорить от Твоего имени[a], он причинил зло этому народу[b], а Ты так и не избавил Свой народ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорить именем Твоим», то есть как Твой представитель, с Твоими полномочиями.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «он ухудшил положение этого народа».'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте инфинитив абсолютный соединён с личной формой того же глагола — буквально: «избавляя, Ты не избавил». Эта конструкция усиливает отрицание: «Ты вовсе не избавил» или «Ты так и не избавил».'
    reason: source_language_explanation
lexical_decisions:
- source_word: וּמֵאָז
  choice: Ведь с тех пор, как
  rationale: 'מֵאָז обозначает время, начиная с определённого момента: «с тех пор». Союз וּ в контексте продолжает и поясняет жалобу Моисея, поэтому передан словом «ведь».'
- source_word: בָּאתִי אֶל־פַּרְעֹה
  choice: я пришёл к фараону
  rationale: Перфект 1-го лица единственного числа от בוא и предлог направления אֶל прямо передаются как «я пришёл к фараону».
- source_word: לְדַבֵּר בִּשְׁמֶךָ
  choice: говорить от Твоего имени
  rationale: Инфинитив выражает цель прихода. Оборот בִּשְׁמֶךָ буквально связан с именем и в данном контексте означает речь как Божьего представителя, с Его полномочиями.
- source_word: הֵרַע לָעָם הַזֶּה
  choice: он причиняет зло этому народу
  rationale: Hифиль от רעע может означать «причинять зло, вред» либо «ухудшать положение». Формулировка сохраняет как нравственную окраску, так и значение причинённого вреда; настоящее время естественно сочетается по-русски с «с тех пор» и описывает продолжающийся результат действий фараона.
- source_word: וְהַצֵּל לֹא הִצַּלְתָּ
  choice: а Ты так и не избавил
  rationale: Инфинитив абсолютный рядом с личной формой того же глагола усиливает отрицание. Русский оборот «так и не» естественно передаёт подчёркнутую безрезультатность. Союз וְ передан контекстуально как «а», поскольку в жалобе действия фараона противопоставлены отсутствию избавления.
- source_word: אֶת־עַמֶּךָ
  choice: Свой народ
  rationale: Объектная конструкция означает «Твой народ». Возвратное притяжательное местоимение «Свой» естественно для русского языка при подлежащем «Ты» и сохраняет смысл принадлежности народа Богу.
theological_decisions:
- issue: Усиленное отрицание в жалобе Моисея Богу
  choice: а Ты так и не избавил Свой народ
  alternative: и Ты вовсе не избавил Твой народ; и Ты нисколько не избавил Свой народ
  rationale: Еврейская конструкция с инфинитивом абсолютным усиливает отрицание. «Так и не избавил» сохраняет резкость и напряжённость слов Моисея, не смягчая его жалобу и не превращая её в окончательное богословское суждение о Божьем замысле.
- issue: Значение בִּשְׁמֶךָ
  choice: от Твоего имени
  alternative: именем Твоим; с Твоей властью
  rationale: Выбранный оборот понятен современному читателю и сохраняет связь с Божьим именем, одновременно выражая представительство. Более узкая парафраза «с Твоей властью» сделала бы подразумеваемый смысл явным ценой утраты образа имени.
- issue: Характер действий фараона в הֵרַע
  choice: причиняет зло этому народу
  alternative: ухудшил положение этого народа; причинил вред этому народу
  rationale: Еврейский глагол допускает как нравственно окрашенное «причинить зло», так и результативное «сделать хуже». Основной текст сохраняет первое, а примечание отмечает второе, не снимая смысловой напряжённости.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи Моисея. Обороты «от Твоего имени» и «так и не избавил» общеупотребительны и ясны; традиционное написание местоимений, относящихся к Богу, с прописной буквы поддерживает благоговейный, но не архаичный регистр.
