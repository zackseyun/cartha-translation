source:
  edition: WLC
  text: וְ/אַחַ֗ר בָּ֚אוּ מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן וַ/יֹּאמְר֖וּ אֶל פַּרְעֹ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יָחֹ֥גּוּ לִ֖/י בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/001.yaml
  text: 'Afterward Moses and Aaron went in and said to Pharaoh[a], “Thus says Yahweh, the God of Israel: Let my people go[b], so that they may hold a feast to me in the wilderness.”'
translation:
  language: ru
  text: 'После этого Моисей и Аарон пришли к фараону и сказали: «Так говорит Яхве[a], Бог Израиля: „Отпусти Мой народ, чтобы они совершили в пустыне праздник в честь Меня[b]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (ЙХВХ) — личное имя Бога; также передаётся как «Иегова». В традиционных переводах имя нередко заменяется титулом «Господь».
    reason: Уточняет форму тетраграмматона и различает её передачу транслитерацией и традиционную титульную замену.
  - marker: b
    text: 'Или: «праздновали в Мою честь»; еврейский глагол означает праздновать или соблюдать праздник.'
    reason: Сохраняет лексическую вариативность глагола חגג и его празднично-культовое значение.
lexical_decisions:
- source_word: וְאַחַר
  choice: После этого
  rationale: Передаёт временной переход к следующему событию, не уточняя продолжительность промежутка.
- source_word: בָּאוּ
  choice: пришли к фараону
  rationale: В данном контексте глагол описывает прибытие Моисея и Аарона для аудиенции; по-русски это естественнее буквального «вошли» без названного помещения.
- source_word: וַיֹּאמְרוּ אֶל־פַּרְעֹה
  choice: и сказали
  rationale: Естественная передача стандартной древнееврейской формулы введения прямой речи; адресат уже указан при глаголе движения.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохраняет торжественную и властную формулу посланнической речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и естественная передача сопряжённой конструкции.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Отпусти Мой народ
  rationale: Императив требует от фараона освободить Израиль и позволить ему уйти; формулировка сохраняет силу повеления.
- source_word: וְיָחֹגּוּ לִי
  choice: чтобы они совершили для Меня праздник
  rationale: Глагол חגג обозначает соблюдение или совершение праздника, а не поклонение вообще; перевод сохраняет целевое значение конструкции и культово-праздничный оттенок.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: В русском библейском и литературном употреблении «пустыня» естественно обозначает незаселённую пустынную местность и не обязательно только песчаную пустыню.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет различие между именем и титулом и отражает наиболее принятую научную реконструкцию произношения.
- issue: Характер действия, выраженного וְיָחֹגּוּ לִי
  choice: совершили для Меня праздник
  alternative: поклонились Мне; отпраздновали предо Мной
  rationale: Текст говорит именно о празднике, совершаемом в честь Яхве; более общее «поклонились» устранило бы культово-праздничную конкретику.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном. Формула «Так говорит» сохраняет авторитетный стиль послания, а остальная фраза остаётся ясной для широкого читателя. Прописные буквы в «Мой» и «Меня» употреблены по принятой русской религиозно-издательской норме.
