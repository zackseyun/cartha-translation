  yaml_path: translation/ot/exodus/005/010.yaml
  text: 'So the taskmasters of the people and their officers went out and said to the people[a], “Thus says Pharaoh: I am not giving you straw.”'
translation:
  language: ru
  text: 'И вышли надсмотрщики народа и его старосты[a] и сказали народу: «Так говорит фараон: „Я не даю вам соломы“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его распорядители». Еврейское слово может обозначать подчинённых должностных лиц из среды народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשֵׂי
  choice: надсмотрщики
  rationale: В данном контексте это поставленные над народом лица, принуждавшие его выполнять нормы работ; «надсмотрщики» передаёт как надзор, так и властно-принудительный характер их роли.
- source_word: שֹׁטְרָיו
  choice: его распорядители
  rationale: Суффикс указывает на народ; слово обозначает подчинённых должностных лиц, вероятно поставленных из среды самого народа. «Распорядители» сохраняет административный смысл, не сужая его до одной конкретной функции.
- source_word: וַיֵּצְאוּ
  choice: вышли
  rationale: Прямое соответствие обычному значению глагола и естественное обозначение ухода от фараона к народу.
- source_word: הָעָם
  choice: народ
  rationale: Коллективное обозначение израильтян, занятых на принудительных работах.
- source_word: לֵאמֹר
  choice: сказали
  rationale: Еврейская формула введения прямой речи естественно передаётся по-русски личной формой «сказали».
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохраняет формальную вестническую формулу и её силу действующего провозглашения.
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Общепринятое русское обозначение египетского царя.
- source_word: אֵינֶנִּי נֹתֵן
  choice: Я не даю
  rationale: Сохраняет настоящее значение причастной конструкции и непосредственный характер объявленного отказа, не превращая его исключительно в сообщение о будущем.
- source_word: תֶּבֶן
  choice: солома
  rationale: Обычное русское название материала, использовавшегося при изготовлении кирпичей.
