  text: Let the work be heavy on the men[a], so that they may labor at it and not pay attention to lying words.
translation:
  language: ru
  text: Пусть работа будет тяжела для людей, чтобы они занимались ею и не обращали внимания[a] на лживые слова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не внимали лживым словам»; еврейский глагол может означать «обращать внимание», «принимать во внимание» или «внимать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְבַּד
  choice: пусть будет тяжела
  rationale: Форма Qal с «работа» в роли подлежащего буквально передаёт идею тяжести; в контексте это распоряжение фараона усилить бремя труда, но без внесения в сам глагол явно каузативного значения.
- source_word: הָעֲבֹדָה
  choice: работа
  rationale: Слово обозначает работу, труд или службу; здесь речь идёт о принудительном изготовлении кирпичей, и «работа» звучит естественно и конкретно.
- source_word: עַל הָאֲנָשִׁים
  choice: для этих людей
  rationale: Предлог עַל изображает работу как бремя, лежащее на людях. По-русски конструкция «работа тяжела для людей» естественно передаёт этот смысл. Указательное «этих» ясно отсылает к уже упомянутым работникам и не расширяет референт.
- source_word: וְיַעֲשׂוּ בָהּ
  choice: пусть они занимаются ею
  rationale: Буквально — «пусть делают в ней/её». Русское «занимаются ею» сохраняет отсылку местоимения к работе и передаёт продолжительное выполнение назначенного труда.
- source_word: וְאַל יִשְׁעוּ
  choice: и не обращают внимания
  rationale: Глагол שעה может означать «обращать внимание», «принимать во внимание», «внимать». Выбран ясный современный оборот; запрет после אַל передан как продолжение распоряжения.
- source_word: בְּדִבְרֵי שָׁקֶר
  choice: на лживые слова
  rationale: דִּבְרֵי означает «слова/речи», а שֶׁקֶר — ложь или обман. «Лживые слова» сохраняют обвинительную характеристику фараона, не подтверждая её истинность от лица повествователя.
theological_decisions:
- issue: Оценка слов Моисея и Аарона как лживых
  choice: Сохранено выражение «лживые слова» как речь фараона.
  alternative: «пустые слова» или пояснение, что это лишь мнение фараона
  rationale: Еврейский текст прямо передаёт формулировку фараона. Контекст показывает говорящего, поэтому перевод не должен ни смягчать его обвинение, ни добавлять оправдительное пояснение в основной текст.
translation_notes:
  register: Современный литературный русский с достоинством прямой царской речи. Повтор «пусть» передаёт последовательность распоряжений и сохраняет повелительно-целевой оттенок еврейских форм. Маркер сноски помещён непосредственно при выражении, к которому относится лексическая альтернатива.
