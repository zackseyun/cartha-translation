  yaml_path: translation/ot/exodus/005/017.yaml
  text: But he said[a], “You are idle, idle! That is why you say, ‘Let us go and sacrifice to Yahweh.’”
translation:
  language: ru
  text: 'Но он сказал: «Вы бездельники, бездельники! Вот почему вы говорите: „Пойдём, принесём жертву Яхве“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но он сказал
  rationale: Последовательная форма продолжает повествование, а союз «но» естественно передаёт контекстуальное противопоставление жалобе израильтян.
- source_word: נִרְפִּים אַתֶּם נִרְפִּים
  choice: Ленивы вы, ленивы!
  rationale: «Ленивы» передаёт обвинение в праздности и нерадивости; повтор сохранён ради эмфазы и резкого ритма речи фараона.
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Кратко и естественно выражает причинно-следственный вывод, который делает фараон.
- source_word: אַתֶּם אֹמְרִים
  choice: вы и говорите
  rationale: 'Причастие передано формой настоящего времени; частица «и» идиоматически подчёркивает мнимую причинную связь: «вот поэтому и».'
- source_word: נֵלְכָה נִזְבְּחָה
  choice: Пойдём, принесём жертву
  rationale: Обе когортативные формы переданы согласованными побудительными формами первого лица множественного числа; «принесём жертву» естественно выражает культовое значение זבח.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה, сохраняя его функцию как имени Бога и направление жертвоприношения, выраженное предлогом ל.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» отличает его от титула «Господь» и сохраняет форму обращения исходного текста.
translation_notes:
  register: Современный литературный русский язык с сохранением резкого, обвинительного тона фараона. Инверсия «Ленивы вы» и буквальный повтор создают требуемую эмфазу, не звуча архаично.
