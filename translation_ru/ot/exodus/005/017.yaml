  source_fidelity: Нִרְפִּים в контексте означает «праздны, без дела; бездельничаете» и повторено для усиления. «Ленивы» допустимо как лексический оттенок, но в русском легче воспринимается как постоянная черта характера, тогда как фараон обвиняет людей в праздности. Когортативы נֵלְכָה נִזְבְּחָה точно переданы побудительным «Пойдём, принесём жертву», а «Яхве» корректно передаёт יהוה.
  naturalness: Исходный текст в целом литературен и понятен. Замена «Ленивы вы, ленивы» на «Вы бездельники, бездельники» делает реплику более естественной в современном русском, сохраняет резкость обвинения и явный повтор. «Вот почему» естественнее связывает вывод фараона с его обвинением, чем нейтральное «Поэтому».
  terminology: '«Принесём жертву Яхве» точно передаёт культовый глагол זבח и предлог ל как адресата жертвы. Имя «Яхве» последовательно соответствует тетраграмматону. Дополнительная сноска не требуется: повтор и смысл обвинения ясно переданы в основном тексте.'
