  text: Then Moses returned to Yahweh and said[a], “Lord, why have you brought harm on this people? Why then did you send me?”
translation:
  language: ru
  text: 'Тогда Моисей вернулся к Яхве и сказал: «Господи, зачем Ты навёл беду на этот народ? Зачем же[a] Ты послал меня?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Зачем это Ты послал меня?» Слово «это» усиливает вопрос; по-русски этот оттенок передан частицей «же».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: вернулся
  rationale: Глагол שוב в данной форме естественно обозначает возвращение; «вернулся» ясно и современно передаёт, что после встречи с фараоном Моисей вновь обратился к Богу.
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Предлог אֶל передаёт направление обращения, а личное имя יהוה транслитерировано как «Яхве», чтобы сохранить употреблённое в еврейском тексте имя Бога.
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Это почтительное обращение к Богу; форма звательного обращения «Господи» естественна для современного литературного русского языка.
- source_word: לָמָה
  choice: зачем
  rationale: В обоих вопросах речь идёт не просто о причине, но о цели или смысле Божьего действия; русское «зачем» естественно передаёт упрёк Моисея.
- source_word: הֲרֵעֹתָה
  choice: Ты навёл беду на
  rationale: 'Порода hифиль глагола רעע имеет причинительное значение: причинить зло, бедствие или вред. «Навёл беду на» сохраняет резкость обвинительного вопроса Моисея, не превращая его автоматически в утверждение о нравственном зле.'
- source_word: לָעָם הַזֶּה
  choice: этот народ
  rationale: עָם обозначает народ как общность; «этот народ» точно и естественно соответствует контексту Израиля.
- source_word: לָמָּה זֶּה
  choice: зачем же
  rationale: Сочетание вопросительного слова с זֶה усиливает вопрос. Частица «же» естественно передаёт эту эмфазу по-русски.
- source_word: שְׁלַחְתָּנִי
  choice: Ты послал меня
  rationale: Форма qatal второго лица мужского рода с суффиксом первого лица единственного числа прямо означает «Ты послал меня».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное заветное имя Бога, поэтому транслитерация сохраняет различие между יהוה в повествовании и אֲדֹנָי в обращении Моисея.
- issue: Смысл обвинения הֲרֵעֹתָה
  choice: навёл беду на этот народ
  alternative: сделал зло этому народу
  rationale: Выбранная формулировка сохраняет причинительный смысл и остроту жалобы Моисея, но не предрешает, обвиняет ли он Бога именно в нравственном зле или говорит о постигшем народ бедствии.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Сохранена резкость жалобы Моисея; синтаксически неуклюжая еврейская эмфаза передана естественной русской частицей «же». Местоимение «Ты» написано с прописной буквы как знак почтительного обращения к Богу.
