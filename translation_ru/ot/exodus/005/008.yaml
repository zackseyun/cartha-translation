base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/008.yaml
  text: And the quota of bricks that they were making yesterday and the day before[a], you shall impose on them; you shall not reduce any of it, because they are idle. Therefore they are crying out, saying, ‘Let us go and sacrifice to our God.’
translation:
  language: ru
  text: 'А прежнюю норму кирпичей, которую они выполняли вчера и позавчера[a], возложите на них; ничуть не уменьшайте её. Они бездельничают, поэтому и кричат: «Пойдём принесём жертву нашему Богу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более обобщённо: «прежде» или «как раньше». Буквально: «вчера и третьего дня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתְכֹּנֶת
  choice: норма
  rationale: В контексте принудительного труда слово обозначает установленное количество продукции; «норма кирпичей» естественно звучит по-русски и согласуется с запретом её уменьшать.
- source_word: הַלְּבֵנִים
  choice: кирпичей
  rationale: Прямое обозначение кирпичей в контексте их изготовления.
- source_word: תְּמוֹל שִׁלְשֹׁם
  choice: вчера и позавчера
  rationale: Сохраняет конкретный древнееврейский оборот и при этом естественно звучит на современном русском; выражение может также иметь более общее значение «прежде».
- source_word: תָּשִׂימוּ עֲלֵיהֶם
  choice: возложите на них
  rationale: Передаёт как образ наложения обязанности, так и административно-принудительный характер приказа.
- source_word: לֹא תִגְרְעוּ מִמֶּנּוּ
  choice: ничуть не уменьшайте её
  rationale: Ясно выражает запрет сокращать какую-либо часть установленной нормы.
- source_word: נִרְפִּים
  choice: бездельничают
  rationale: Передаёт обвинение фараона в праздности или недостаточном усердии, не представляя его оценку как объективный факт.
- source_word: צֹעֲקִים
  choice: кричат
  rationale: Передаёт интенсивное голосовое требование или призыв и сохраняет лаконичность исходного текста.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: Пойдём принесём жертву
  rationale: Два когортатива переданы естественной русской побудительной конструкцией; «принесём жертву» — обычное русское выражение для жертвоприношения.
- source_word: לֵאלֹהֵינוּ
  choice: нашему Богу
  rationale: Прямо передаёт адресата жертвоприношения.
