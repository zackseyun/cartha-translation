  text: Then the officers of the sons of Israel saw that they were in trouble when it was said[a], “You must not reduce the number of your bricks[b], the daily quota each day.”
translation:
  language: ru
  text: 'Надсмотрщики сынов Израиля увидели, что оказались в беде, когда им сказали: «Не уменьшайте число кирпичей — дневную норму на каждый день».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: увидели
  rationale: Сохраняет основное значение ראה; в данном контексте естественно передаёт также осознание положения.
- source_word: שֹׁטְרֵי
  choice: надсмотрщики
  rationale: Здесь речь об израильтянах, поставленных следить за работой под властью египтян; «надсмотрщики» ясно передаёт их подчинённую административную роль.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально близко передаёт еврейское выражение и сохраняет его традиционно понятную в русском библейском контексте форму.
- source_word: אֹתָם בְּרָע
  choice: что попали в беду
  rationale: Местоимение относится к самим надсмотрщикам, а בְּרָע обозначает тяжёлое, неблагоприятное положение, не нравственное зло.
- source_word: לֵאמֹר
  choice: когда им было сказано
  rationale: Вводит слова, по которым надсмотрщики поняли своё бедственное положение; пассивная конструкция естественна по-русски.
- source_word: לֹא תִגְרְעוּ
  choice: не убавляйте
  rationale: Точно передаёт запрет уменьшать установленное количество.
- source_word: מִלִּבְנֵיכֶם
  choice: числа кирпичей
  rationale: Передаёт исходную идею уменьшения от назначенного количества кирпичей без добавления отсутствующего в тексте существительного «норма».
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: положенного на каждый день
  rationale: Еврейская идиома означает установленное количество, которое требуется ежедневно; выбран естественный русский эквивалент.
