base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/016.yaml
  text: No straw is given to your servants[a], yet they say to us, ‘Make bricks!’ And behold, your servants are being beaten, but the fault is with your own people.
translation:
  language: ru
  text: 'Соломы рабам твоим не дают, а нам говорят: «Делайте кирпичи!» И вот, рабов твоих бьют, а виноват твой народ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «и твой народ согрешил». Еврейское выражение сжато и допускает такое прочтение, но в данном контексте, вероятно, означает, что вина лежит на людях фараона.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּבֶן
  choice: солома
  rationale: Обычное русское обозначение материала, который использовали при изготовлении сырцовых кирпичей.
- source_word: אֵין נִתָּן
  choice: не дают
  rationale: Отрицательная конструкция с пассивным причастием указывает, что солому не предоставляют; неопределённо-личная форма естественна по-русски и сохраняет продолжающийся характер жалобы.
- source_word: לַעֲבָדֶיךָ / עֲבָדֶיךָ
  choice: рабам твоим / рабов твоих
  rationale: В обращении к фараону это формула подчинённости и почтительности. «Рабы» сохраняет социальную реальность и придворную форму речи.
- source_word: לְבֵנִים
  choice: кирпичи
  rationale: Прямой и контекстуально точный эквивалент для требуемой продукции.
- source_word: אֹמְרִים לָנוּ עֲשׂוּ
  choice: 'нам говорят: «Делайте кирпичи!»'
  rationale: Сохраняется прямая речь и повелительная форма; слово «кирпичи» повторено для естественной ясности по-русски.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт указательно-эмфатическую силу частицы и звучит естественно в современном литературном русском.
- source_word: מֻכִּים
  choice: бьют
  rationale: Настоящее время передаёт продолжающееся физическое наказание; активная неопределённо-личная конструкция естественнее буквального пассива «бывают биты».
- source_word: וְחָטָאת עַמֶּךָ
  choice: а виноват твой народ
  rationale: Сжатая и трудная еврейская конструкция в контексте, вероятнее всего, возлагает вину на людей фараона. Перевод сохраняет обвинительную силу, а сноска отмечает более буквальное прочтение.
theological_decisions:
- issue: Неоднозначность выражения וְחָטָאת עַמֶּךָ
  choice: а виноват твой народ
  alternative: и твой народ согрешил
  rationale: Контекст жалобы указывает на вину египетских надсмотрщиков, однако грамматически возможно более буквальное понимание со значением «согрешил»; неоднозначность сохранена в сноске, а не устранена молча.
translation_notes:
  register: Современный литературный русский с достоинством прямой речи перед правителем. Инверсия «рабам твоим» и «рабов твоих» слегка приподнимает регистр и сохраняет характер почтительного обращения, не делая фразу архаичной.
