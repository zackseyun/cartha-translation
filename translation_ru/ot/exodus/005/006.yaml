lexical_decisions:
- source_word: וַיְצַו
  choice: приказал
  rationale: Форма от צוה продолжает повествование и выражает властное распоряжение; «приказал» естественно и точно передаёт этот смысл.
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Общепринятое русское обозначение египетского правителя; в середине предложения пишется со строчной буквы.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямо передаёт еврейское обстоятельство времени, не усиливая его до «в тот же день».
- source_word: הַנֹּגְשִׂים בָּעָם
  choice: надсмотрщикам над народом
  rationale: נגשׂים обозначает тех, кто принуждал к труду и взыскивал установленную норму; сочетание с בָּעָם в данном контексте естественно передаётся как сфера их власти — «над народом».
- source_word: שֹׁטְרָיו
  choice: его распорядителям
  rationale: Термин обозначает подчинённых должностных лиц, участвовавших в организации и учёте работ. «Распорядители» сохраняет административный характер роли, не сужая её до писцов.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейская формула введения прямой речи естественно передаётся в современном русском двоеточием, поскольку сама речь следует в следующем стихе.
