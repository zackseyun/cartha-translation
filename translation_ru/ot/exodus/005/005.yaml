lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт указательно-восклицательную силу частицы естественным для современного литературного русского языка способом.
- source_word: רַבִּים
  choice: многочислен
  rationale: Предикативное прилагательное точно передаёт количественное значение и согласуется с собирательным существительным «народ».
- source_word: עַם הָאָרֶץ
  choice: народ этой земли
  rationale: Сохраняет формальный образ еврейского выражения и не вводит более узкого толкования «простонародье»; указательное «этой» естественно в речи фараона об Египте.
- source_word: עַתָּה
  choice: теперь
  rationale: Прямо передаёт временное наречие и подчёркивает нынешнее положение, вызывающее недовольство фараона.
- source_word: וְהִשְׁבַּתֶּם
  choice: а вы отвлекаете его
  rationale: Каузативная форма глагола שׁבת означает, что Моисей и Аарон заставляют народ прекратить работу. «Отвлекаете» естественно передаёт обвинительный смысл реплики, не приписывая прекращению труда положительной оценки.
- source_word: מִסִּבְלֹתָם
  choice: от работ
  rationale: В данном контексте слово обозначает возложенные на израильтян тяжёлые трудовые повинности. «Работы» естественно сочетается с «отвлекаете», тогда как буквальное «от бремён» в русском звучало бы здесь неясно.
