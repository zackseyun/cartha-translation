  text: They met Moses and Aaron[a], who were standing to meet them when they came out from Pharaoh.
translation:
  language: ru
  text: Выйдя от фараона, они встретили Моисея и Аарона[a], которые стояли, чтобы встретить их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повстречали Моисея и Аарона». В некоторых контекстах этот глагол может иметь оттенок столкновения или противостояния, однако здесь сам по себе он не требует такого значения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגְּעוּ
  choice: они встретили
  rationale: Глагол פגע здесь естественно означает «встретить, повстречать». Последующая резкая речь допускает напряжённость сцены, но сам глагол не требует перевода «столкнулись» или «вступили в противостояние».
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Моисея и Аарона
  rationale: Имена переданы в принятой русской библейской форме; показатели прямого дополнения отдельно не переводятся.
- source_word: נִצָּבִים
  choice: которые стояли
  rationale: Причастие от נצב обозначает пребывание стоя или занятую позицию. Относительное предложение естественно передаёт длительное состояние.
- source_word: לִקְרָאתָם
  choice: и ждали их
  rationale: В сочетании с «стояли» выражение передаёт положение Моисея и Аарона, расположившихся навстречу выходившим, чтобы встретить их. По-русски «стояли и ждали их» естественнее буквального повтора «стояли, чтобы встретить их» и не приписывает фразе враждебности.
- source_word: בְּצֵאתָם
  choice: Выйдя
  rationale: Инфинитивная конструкция с בְּ выражает временное обстоятельство. Деепричастие кратко и ясно связывает встречу с выходом надзирателей.
- source_word: מֵאֵת פַּרְעֹה
  choice: от фараона
  rationale: מֵאֵת указывает на удаление от лица, то есть «от фараона» или «из присутствия фараона». Краткая русская формулировка сохраняет смысл.
