lexical_decisions:
- source_word: אַתֶּם
  choice: Вы сами
  rationale: 'Самостоятельное местоимение перед повелительными формами выражает подчёркивание: теперь они должны действовать сами.'
- source_word: לְכוּ
  choice: идите
  rationale: Прямая и естественная передача повелительной формы множественного числа от הלך.
- source_word: קְחוּ לָכֶם
  choice: берите себе
  rationale: Сочетание передаёт как действие приобретения соломы, так и значение заинтересованности/самостоятельности, выраженное לָכֶם.
- source_word: תֶּבֶן
  choice: солому
  rationale: В контексте изготовления кирпичей תֶּבֶן обозначает солому, используемую как материал.
- source_word: מֵאֲשֶׁר תִּמְצָאוּ
  choice: там, где найдёте
  rationale: Естественно передаёт требование добывать солому в любом доступном месте; буквальное исходное значение предлога מִן отмечено в сноске.
- source_word: כִּי
  choice: потому что
  rationale: Сохранено обычное причинное значение союза כִּי, соответствующее масоретскому тексту и последней редакционной правке консультационного перевода.
- source_word: אֵין נִגְרָע מֵעֲבֹדַתְכֶם דָּבָר
  choice: из вашей работы ничего не будет убавлено
  rationale: Формулировка сохраняет отрицательную конструкцию, страдательное значение נִגְרָע и образ убавления чего-либо от назначенной работы, не сводя עֲבֹדָה исключительно к числовой норме.
