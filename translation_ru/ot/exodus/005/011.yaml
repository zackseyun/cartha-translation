  source_fidelity: 'Основной смысл передан верно: подчёркнутое «вы сами», два повеления, солома и отказ уменьшить возложенную работу. Однако «из вашей работы ничего не будет убавлено» буквально ориентировано, но по-русски не вполне естественно; в данном контексте речь идёт об объёме назначенной работы.'
  naturalness: «Идите и берите себе солому» понятно, но «добывайте себе солому» точнее передаёт необходимость самим обеспечить себя материалом. «Где только найдёте» естественно выражает открытый характер מֵאֲשֶׁר תִּמְצָאוּ. «Объём вашей работы ничуть не будет уменьшен» современно и сохраняет жёсткий приказной регистр.
  terminology: «Солома» — верный термин для תֶּבֶן в контексте изготовления кирпичей. «Объём вашей работы» адекватно передаёт עֲבֹדָה, не навязывая более узкий термин «норма кирпичей». Причинное «потому что» соответствует обычному значению כִּי и английской аудиторской правке.
  issues:
