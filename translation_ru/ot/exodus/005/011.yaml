    rationale: Русское «убавить из работы» звучит калькированно и может быть понято как сокращение содержания работы, а не количества возложенного труда. «Объём вашей работы ... не будет уменьшен» ясно передаёт смысл, не добавляя конкретной меры, которой в самом стихе нет.
  - severity: low
