  yaml_path: translation/ot/exodus/005/018.yaml
  text: So now[a], go, work; but straw will not be given to you, yet you must deliver the required number of bricks.
translation:
  language: ru
  text: А теперь идите, работайте! Соломы вам не дадут, но положенное количество кирпичей[a] вы должны сдать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «норму кирпичей». Еврейское תֹכֶן означает установленное или отмеренное количество, которое требовалось сдать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт переход к заключительному повелению фараона и его подчёркнутый характер естественным современным русским оборотом.
- source_word: לְכוּ
  choice: идите
  rationale: Прямое соответствие повелительной форме глагола הלך; в данном контексте звучит достаточно властно без стилистического усиления.
- source_word: עִבְדוּ
  choice: работайте
  rationale: Здесь речь идёт о принудительном труде, а не о культовом служении; «работайте» ясно передаёт контекстуальный смысл.
- source_word: וְתֶבֶן לֹא יִנָּתֵן לָכֶם
  choice: Соломы вам не дадут
  rationale: Активная неопределённо-личная конструкция естественна по-русски и точно передаёт отрицательную пассивную форму «не будет дано вам».
- source_word: תֹכֶן לְבֵנִים
  choice: положенное количество кирпичей
  rationale: תֹכֶן обозначает установленное или отмеренное количество. Выбор сохраняет значение требования и остаётся понятным современному читателю.
- source_word: תִּתֵּנוּ
  choice: вы должны сдать
  rationale: Буквально глагол означает «дадите», но в производственном контексте речь о сдаче установленного объёма кирпичей; модальная конструкция передаёт обязательность повеления.
