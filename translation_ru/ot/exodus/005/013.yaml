base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/013.yaml
  text: And the taskmasters kept pressing them[a], saying, “Finish your work, each day’s matter in its day, just as when there was straw.”
translation:
  language: ru
  text: 'А надсмотрщики подгоняли их, говоря: «Заканчивайте свою работу — положенную на каждый день норму работы, — как тогда, когда была солома[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дело дня в его день»; то есть объём работы, установленный на каждый день.'
    reason: Сохраняет буквальную форму еврейской идиомы и поясняет её значение в контексте трудовой повинности.
lexical_decisions:
- source_word: הַנֹּגְשִׂים
  choice: надсмотрщики
  rationale: В контексте принудительных работ это начальники, взыскивающие с израильтян установленный объём труда; «надсмотрщики» — естественное современное соответствие, сохраняющее властный и принудительный оттенок.
- source_word: אָצִים
  choice: подгоняли
  rationale: Причастная форма выражает продолжающееся настойчивое давление. «Подгоняли» передаёт и длительность, и принудительный характер действия.
- source_word: כַּלּוּ מַעֲשֵׂיכֶם
  choice: Выполняйте свою работу
  rationale: Императив требует доводить назначенную работу до полного объёма; по-русски «выполняйте» естественно выражает требование исполнения нормы, не сужая значение слова מַעֲשֵׂיכֶם.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: дневную норму каждый день
  rationale: Еврейская идиома буквально говорит о «деле дня в его день», а в данном трудовом контексте означает установленный на каждый день объём работы. Перевод делает этот смысл понятным, а буквальная образность отмечена в сноске.
- source_word: כַּאֲשֶׁר בִּהְיוֹת הַתֶּבֶן
  choice: как и тогда, когда была солома
  rationale: Формулировка сохраняет сравнение с прежними условиями и не добавляет прямо не выраженного в стихе указания на то, кем солома предоставлялась.
