  text: וַ/יְכַ֞ס אֶת עֵ֣ין כָּל הָ/אָרֶץ֮ וַ/תֶּחְשַׁ֣ךְ הָ/אָרֶץ֒ וַ/יֹּ֜אכַל אֶת כָּל עֵ֣שֶׂב הָ/אָ֗רֶץ וְ/אֵת֙ כָּל פְּרִ֣י הָ/עֵ֔ץ אֲשֶׁ֥ר הוֹתִ֖יר הַ/בָּרָ֑ד וְ/לֹא נוֹתַ֨ר כָּל יֶ֧רֶק בָּ/עֵ֛ץ וּ/בְ/עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/015.yaml
  text: And it covered the face of the whole land[a], so that the land was darkened; and it ate every plant of the land and all the fruit of the trees that the hail had left. No green thing remained on the trees or on the plants of the field in all the land of Egypt.
translation:
  language: ru
  text: Она покрыла поверхность всей земли[a], и земля потемнела. Она съела всю растительность на земле и все плоды деревьев, которые оставил град. Во всей земле Египта не осталось ничего зелёного — ни на деревьях, ни среди полевой растительности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «глаз всей земли» — идиома, означающая её видимую поверхность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַס
  choice: Она покрыла
  rationale: Глагол стоит в единственном числе и относится к собирательно понимаемой саранче из контекста; русский женский род согласуется со словом «саранча».
- source_word: עֵין כָּל הָאָרֶץ
  choice: поверхность всей земли
  rationale: Буквально «глаз всей земли»; это идиоматическое обозначение видимой поверхности. «Поверхность» ясно передаёт смысл без неестественной для современного русского метафоры.
- source_word: וַתֶּחְשַׁךְ הָאָרֶץ
  choice: и земля потемнела
  rationale: Глагол выражает наступление темноты; непереходная конструкция естественно передаёт еврейскую форму и последовательность событий.
- source_word: וַיֹּאכַל
  choice: Она съела
  rationale: Сохранено единственное число собирательного субъекта; простой глагол «съела» соответствует основному значению, не усиливая его до «истребила».
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: всю растительность на земле
  rationale: עֵשֶׂב охватывает растительность шире, чем только траву; собирательное «растительность» естественно в описании всеобщего опустошения.
- source_word: כָּל פְּרִי הָעֵץ
  choice: все плоды на деревьях
  rationale: Единственное עֵץ имеет собирательный смысл; множественное «деревьях» естественно передаёт распределённое значение.
- source_word: אֲשֶׁר הוֹתִיר הַבָּרָד
  choice: которые оставил град
  rationale: Прямо передаёт то, что плоды уцелели после предыдущей казни, не добавляя оценочного оттенка «пощадил».
- source_word: וְלֹא נוֹתַר כָּל יֶרֶק
  choice: не осталось ничего зелёного
  rationale: Естественная русская отрицательная конструкция передаёт полное отсутствие какой-либо зелени и результативный смысл глагола.
- source_word: בָּעֵץ וּבְעֵשֶׂב הַשָּׂדֶה
  choice: ни на деревьях, ни среди полевых растений
  rationale: Парная конструкция «ни… ни…» ясно передаёт исчерпывающий охват; разные предлоги выбраны ради естественного русского словоупотребления.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: Во всей земле Египетской
  rationale: Традиционно-достоинная, но понятная территориальная формула, точно сохраняющая охват всей страны.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Собирательная «саранча» передана местоимением женского рода в единственном числе; образное еврейское выражение вынесено в сноску, а в тексте дано ясное идиоматическое соответствие.
