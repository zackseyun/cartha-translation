lexical_decisions:
- source_word: כִּי אִם
  choice: Ибо если
  rationale: 'Сочетание вводит условное предостережение, связанное с предыдущей речью: «ибо» передаёт обосновывающую связь, а «если» — условие.'
- source_word: מָאֵן
  choice: откажешься
  rationale: Глагол обозначает сознательный, упорный отказ, а не неспособность или колебание.
- source_word: לְשַׁלֵּחַ
  choice: отпустить
  rationale: В контексте Исхода это естественная русская передача требования позволить народу уйти; она не добавляет специального юридического оттенка.
- source_word: עַמִּי
  choice: Мой народ
  rationale: Сохраняет прямое притяжательное выражение и его значимость в повествовании.
- source_word: הִנְנִי
  choice: то вот
  rationale: «Вот» передаёт торжественное указание на близкое и несомненное действие; «то» естественно связывает его с условной частью фразы.
- source_word: מֵבִיא
  choice: Я наведу
  rationale: Причастная форма с הִנְנִי выражает близкое будущее. «Наведу» естественно описывает насылание бедствия, сохраняя деятельное значение «приведу/навлеку».
- source_word: מָחָר
  choice: завтра
  rationale: Прямая передача временного наречия.
- source_word: אַרְבֶּה
  choice: саранчу
  rationale: Существительное имеет форму единственного числа, но употреблено собирательно. Русское «саранча» также естественно функционирует как собирательное название.
- source_word: בִּגְבֻלֶךָ
  choice: на твои пределы
  rationale: «Пределы» сохраняет связь слова со значениями границы и территории, а предлог «на» естественно сочетается с глаголом «наведу» и передаёт вторжение в область фараона.
