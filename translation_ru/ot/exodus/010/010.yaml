base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/010.yaml
  text: And he said to them[a], “May Yahweh indeed be with you, if I ever send you and your little ones out! See[b], for evil is before your faces.”
translation:
  language: ru
  text: 'И сказал он им: «Пусть Яхве и вправду будет с вами, если я отпущу вас и ваших маленьких детей»[a]. «Смотрите: ведь зло перед вами»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Яхве будет с вами, когда я отпущу вас и ваших маленьких детей»; вероятно, эти слова сказаны саркастически.'
    reason: alternative_reading
  - marker: b
    text: 'Еврейская фраза неоднозначна: она может означать «вас ждёт беда» или «у вас на уме зло».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי כֵן יְהוָה עִמָּכֶם
  choice: Пусть Яхве и вправду будет с вами
  rationale: Сохраняет побудительно-желательное значение יְהִי и усиление כֵן, а саркастический оттенок возникает из контекста, не вносясь в текст прямым пояснением.
- source_word: כַּאֲשֶׁר אֲשַׁלַּח
  choice: если я отпущу
  rationale: Враждебный контекст позволяет передать כַּאֲשֶׁר условно; «отпущу» естественно выражает значение שׁלח в повествовании об исходе.
- source_word: טַפְּכֶם
  choice: ваших малых детей
  rationale: טַף обозначает прежде всего маленьких детей; перевод сохраняет эту более узкую смысловую окраску.
- source_word: רְאוּ
  choice: Смотрите
  rationale: Форма является повелительным наклонением от ראה и здесь звучит как предостережение, при этом не усиливается до однозначного «берегитесь».
- source_word: כִּי רָעָה נֶגֶד פְּנֵיכֶם
  choice: ведь зло перед вами
  rationale: 'Близкая к еврейскому формулировка сохраняет неясность: речь может идти либо о грозящем бедствии, либо о злом намерении собеседников.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Личное имя передано транслитерацией, без замены титулом.
- issue: Сарказм в словах фараона
  choice: Сохранить его как контекстуально воспринимаемый оттенок
  alternative: Явно переформулировать как насмешку или угрозу
  rationale: Еврейская конструкция допускает буквальное прочтение, хотя в контексте, вероятнее всего, саркастична; перевод не устраняет эту напряжённость.
- issue: Неоднозначность רָעָה נֶגֶד פְּנֵיכֶם
  choice: зло перед вами
  alternative: вас ждёт беда; у вас на уме зло
  rationale: Основной текст не выбирает между внешней угрозой и обвинением в злом умысле.
translation_notes:
  register: Современный литературный русский язык с краткой, напряжённой репликой. Синтаксис сохраняет торжественно-ироническое пожелание фараона и намеренно необычную, но понятную формулу «зло перед вами», чтобы не снимать неоднозначность оригинала.
