  yaml_path: translation/ot/exodus/010/020.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he did not let the sons of Israel go.
translation:
  language: ru
  text: Но Яхве ожесточил[a] сердце фараона, и тот не отпустил сыновей Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделал сердце фараона твёрдым», «укрепил сердце фараона»; древнееврейский глагол буквально означает «сделать сильным, твёрдым».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть израильтян; традиционно также: «детей Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: ожесточил
  rationale: Глагол חזק буквально связан с приданием силы или твёрдости, но в повторяющейся формуле Исхода естественное русское «ожесточил» передаёт закрепившееся внутреннее сопротивление фараона и сохраняет повествовательно-богословскую силу выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени «Яхве» сохраняет отличие имени Бога от титула «Господь».
- source_word: לֵב
  choice: сердце
  rationale: «Сердце» естественно сохраняет древнееврейский образ, охватывающий волю, решимость и внутренний настрой.
- source_word: פַּרְעֹה
  choice: фараона
  rationale: Общепринятая русская передача царского титула; родительный падеж обусловлен конструкцией «сердце фараона».
- source_word: שִׁלַּח
  choice: не отпустил
  rationale: В контексте освобождения Израиля «отпустить» точнее и естественнее буквального «послать».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально прозрачная передача родственного выражения сохраняет его библейский образ; значение относится к народу Израиля в целом, а не только к мужчинам.
theological_decisions:
- issue: Действие Бога в ожесточении фараона
  choice: Яхве ожесточил сердце фараона
  alternative: Яхве сделал сердце фараона твёрдым / укрепил сердце фараона
  rationale: Древнееврейский текст прямо называет Яхве действующим лицом. Перевод не смягчает божественное действие и не добавляет объяснения о соотношении Божьей воли и ответственности фараона, сохраняя напряжение повествования.
translation_notes:
  register: Современный литературный русский язык с сохранением dignified библейского образа. Союз «но» передаёт повествовательное противопоставление; местоименная конструкция «и тот» ясно относит последующее действие к фараону и избегает двусмысленности русского «он» после упоминания Яхве.
