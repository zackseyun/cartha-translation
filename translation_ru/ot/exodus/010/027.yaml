base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/027.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he was not willing to let them go.
translation:
  language: ru
  text: Но Яхве ожесточил сердце фараона[a], и тот не захотел отпустить их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделал сердце фараона твёрдым (непреклонным)». Еврейский глагол может означать «укреплять» или «делать твёрдым»; в данном сочетании он передаёт ожесточение воли.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отказался отпустить их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: ожесточил
  rationale: Глагол חזק буквально связан с укреплением и приданием твёрдости, но в повторяющейся формуле о сердце фараона естественно передаёт смысл «ожесточил». Лексическая широта отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: לֵב
  choice: сердце
  rationale: «Сердце» сохраняет библейский образ; здесь оно обозначает внутреннюю волю и расположение человека.
- source_word: פַּרְעֹה
  choice: фараона
  rationale: Нормативная русская передача египетского царского титула; родительный падеж обусловлен синтаксисом.
- source_word: לֹא אָבָה
  choice: не захотел
  rationale: Оборот прямо выражает отсутствие желания или согласия и естественно звучит по-русски, не усиливая его до однозначного «отказался».
- source_word: לְשַׁלְּחָם
  choice: отпустить их
  rationale: В контексте исхода שׁלח означает позволить израильтянам уйти; «отпустить» точно и естественно передаёт повторяющийся мотив повествования.
theological_decisions:
- issue: Божественное ожесточение и человеческая воля
  choice: 'Сохранить обе части как самостоятельные утверждения: Яхве ожесточил сердце фараона, а фараон не захотел отпустить их.'
  alternative: «Яхве укрепил сердце фараона, так что тот отказался отпустить их».
  rationale: 'Еврейский текст прямо приписывает действие Яхве и одновременно говорит о нежелании фараона. Союз не следует превращать в причинное «так что»: перевод сохраняет напряжение между божественным действием и человеческой волей.'
translation_notes:
  register: Современный литературный русский язык с сохранением библейского образа «сердце». Местоимение «тот» устраняет возможную двусмысленность субъекта второй части. Порядок сносок приведён к последовательному [a], [b].
