base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/012.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the land of Egypt for the locusts, so that they may come up over the land of Egypt and eat every plant of the land[b], everything that the hail has left.”
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Протяни руку над землёй Египта для саранчи[a], чтобы она поднялась на землю Египта и съела всю растительность земли — всё, что оставил град».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский предлог перед словом «саранча» труден для толкования. Возможны, в частности, передачи «для саранчи», «относительно саранчи», «против саранчи» или «над саранчой».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: נְטֵה יָדְךָ
  choice: Протяни руку
  rationale: Прямой и естественный перевод повелительной формы и существительного; соответствует языку повествования о знамениях и казнях.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: над землёй Египта
  rationale: Сохраняет пространственное значение предлога עַל и явное упоминание «земли».
- source_word: בָּאַרְבֶּה
  choice: чтобы вызвать саранчу
  rationale: Предлог בְּ здесь труден для буквальной передачи. В контексте жест Моисея должен привести к нашествию саранчи; целевая конструкция звучит по-русски естественно, а неоднозначность отмечена в сноске.
- source_word: אַרְבֶּה ... וְיַעַל ... וְיֹאכַל
  choice: саранчу ... пусть она поднимется ... и съест
  rationale: Сохраняет грамматическое единственное число еврейского собирательного существительного и согласованных с ним глаголов; русское «саранча» также естественно употребляется собирательно.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: всю растительность земли
  rationale: עֵשֶׂב обозначает растительность в широком смысле, не только траву; выбранная формулировка подходит контексту сельскохозяйственного разорения.
- source_word: אֵת כָּל אֲשֶׁר הִשְׁאִיר הַבָּרָד
  choice: всё, что оставил град
  rationale: Точно передаёт связь с предшествующей казнью и допускает естественный смысл «оставил нетронутым» без лишнего пояснения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя исходного текста и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Собирательное «саранча» позволяет сохранить единственное число оригинала без искусственной конструкции; тире выделяет итоговое пояснение о растительности, уцелевшей после града.
