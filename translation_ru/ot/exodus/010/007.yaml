source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ עַבְדֵ֨י פַרְעֹ֜ה אֵלָ֗י/ו עַד מָתַי֙ יִהְיֶ֨ה זֶ֥ה לָ֨/נוּ֙ לְ/מוֹקֵ֔שׁ שַׁלַּח֙ אֶת הָ֣/אֲנָשִׁ֔ים וְ/יַֽעַבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם הֲ/טֶ֣רֶם תֵּדַ֔ע כִּ֥י אָבְדָ֖ה מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/007.yaml
  text: Then Pharaoh’s servants said to him[a], “How long will this man be a snare to us? Send the men away so that they may serve Yahweh their God[e][d][c][b]. Do you not yet know that Egypt is ruined?”
translation:
  language: ru
  text: 'Тогда слуги фараона сказали ему: «Долго ли этот человек[a] будет для нас западнёй[b]? Отпусти этих мужчин[c], пусть они служат[d] Яхве[e], своему Богу. Неужели ты до сих пор не понял, что Египет разорён?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «этот»; по контексту речь идёт о Моисее.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ловушкой».'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте: «мужчин»; некоторые переводы передают шире — «людей» или «народ».'
    reason: lexical_alternative
  - marker: d
    text: Глагол может означать как служение Богу, так и поклонение Ему.
    reason: lexical_alternative
  - marker: e
    text: В еврейском тексте стоит божественное имя יהוה (YHWH), традиционно заменяемое в переводах словом «ГОСПОДЬ».
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: слуги
  rationale: Прямое соответствие слову, обозначающему состоящих при фараоне людей; в данном контексте это могли быть придворные сановники, но «слуги» не добавляет отсутствующего в тексте уточнения.
- source_word: עַד מָתַי
  choice: долго ли
  rationale: Естественная русская передача идиоматического вопроса «до каких пор?» с оттенком настойчивого упрёка.
- source_word: זֶה
  choice: этот человек
  rationale: Указательное местоимение по контексту относится к Моисею; добавление «человек» делает выражение естественным по-русски, не устраняя резкого оттенка указания.
- source_word: לְמוֹקֵשׁ
  choice: западнёй
  rationale: Сохраняет образ западни или ловушки и передаёт представление об источнике гибельной опасности.
- source_word: שַׁלַּח
  choice: отпусти
  rationale: В контексте повеление требует позволить им уйти; «отпусти» естественно и точно передаёт каузативную форму глагола.
- source_word: הָאֲנָשִׁים
  choice: этих мужчин
  rationale: Сохраняет конкретное мужское множественное число исходного существительного, не расширяя его до всего народа.
- source_word: וְיַעַבְדוּ
  choice: пусть они служат
  rationale: Передаёт значение служения Богу и сохраняет возможность культового смысла — поклонения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: הֲטֶרֶם תֵּדַע
  choice: Неужели ты до сих пор не понял
  rationale: 'Естественно выражает вопрос-упрёк: фараон уже должен был осознать случившееся.'
- source_word: אָבְדָה
  choice: разорён
  rationale: Обозначает уже наступившее гибельное состояние Египта после казней, не утверждая его полного исчезновения.
- source_word: מִצְרָיִם
  choice: Египет
  rationale: Обычная русская форма географического названия; здесь обозначает страну как целое.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение עבד применительно к Богу
  choice: служат
  alternative: поклоняются
  rationale: «Служат» ближе к широкому значению глагола и не исключает подразумеваемого культового поклонения.
- issue: Объём значения הָאֲנָשִׁים
  choice: этих мужчин
  alternative: этих людей / народ
  rationale: Исходное слово имеет мужское множественное значение; перевод не расширяет его до всего народа, хотя дальнейший контекст книги раскрывает спор о том, кто именно должен уйти.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Реплика придворных звучит настойчиво и резко, но без архаизмов. Синтаксис сохраняет последовательность исходного текста и риторическую силу заключительного вопроса.
