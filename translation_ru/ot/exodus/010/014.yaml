lexical_decisions:
- source_word: וַיַּעַל
  choice: поднялась
  rationale: Сохраняет пространственный образ глагола עלה («подниматься, восходить») и естественно описывает наступление летящей саранчи.
- source_word: הָאַרְבֶּה
  choice: саранча
  rationale: Еврейское существительное имеет собирательное значение; русское «саранча» также естественно употребляется как собирательное в единственном числе.
- source_word: עַל כָּל אֶרֶץ מִצְרַיִם
  choice: над всей землёй Египетской
  rationale: Передаёт распространение саранчи над всей страной; «земля Египетская» сохраняет достоинство библейского регистра и остаётся понятной современному читателю.
- source_word: וַיָּנַח
  choice: опустилась
  rationale: В данном контексте глагол נוח обозначает, что летящая саранча остановилась и покрыла местность; «опустилась» звучит естественнее буквального «успокоилась» или «почила».
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: по всей территории Египта
  rationale: גְּבוּל здесь означает не только границу, но всю область в её пределах. Русская формулировка ясно указывает на распространение по всей стране.
- source_word: כָּבֵד מְאֹד
  choice: чрезвычайно многочисленна
  rationale: Буквально «очень тяжёлая»; применительно к собирательному «саранча» выражение указывает на исключительную массу и силу нашествия. Основной текст передаёт смысл естественно, а сноска сохраняет буквальный образ.
- source_word: לְפָנָיו לֹא הָיָה כֵן אַרְבֶּה כָּמֹהוּ
  choice: прежде не бывало такой саранчи
  rationale: Идиоматично передаёт утверждение, что это нашествие не имело прецедента.
- source_word: וְאַחֲרָיו לֹא יִהְיֶה כֵּן
  choice: и впредь такой не будет
  rationale: Сохраняет направленное в будущее сопоставление с последующими временами.
