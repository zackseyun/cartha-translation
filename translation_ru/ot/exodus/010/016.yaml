  text: וַ/יְמַהֵ֣ר פַּרְעֹ֔ה לִ/קְרֹ֖א לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֑ן וַ/יֹּ֗אמֶר חָטָ֛אתִי לַ/יהוָ֥ה אֱלֹֽהֵי/כֶ֖ם וְ/לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/016.yaml
  text: Then Pharaoh hurried to call for Moses and Aaron, and he said, “I have sinned against Yahweh your God and against you.”
translation:
  language: ru
  text: 'Тогда фараон поспешил позвать Моисея и Аарона и сказал: «Я согрешил против Яхве, вашего Бога, и против вас».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: поспешил
  rationale: Глагол מהר передаёт поспешность и быстрое действие; «поспешил» естественно и точно выражает срочность.
- source_word: לִקְרֹא
  choice: позвать
  rationale: В данном контексте инфинитив означает распорядиться, чтобы Моисей и Аарон явились; «позвать» звучит естественно и не усиливает значение до официального «призвать».
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Устоявшееся русское обозначение египетского правителя.
- source_word: לְמֹשֶׁה וּלְאַהֲרֹן
  choice: Моисея и Аарона
  rationale: При русском глаголе «позвать» лица естественно ставятся в винительном падеже, что передаёт функцию еврейского ל в этой конструкции.
- source_word: וַיֹּאמֶר
  choice: и сказал
  rationale: Стандартная передача повествовательной формы wayyiqtol, вводящей прямую речь.
- source_word: חָטָאתִי
  choice: Я согрешил
  rationale: Совершенный вид прямо передаёт признание совершённого греха и сохраняет нравственно-богословскую силу глагола חטא.
- source_word: לַיהוָה
  choice: против Яхве
  rationale: После חטא предлог ל обозначает сторону, против которой совершён грех; по-русски это естественно выражается предлогом «против».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: Суффикс второго лица множественного числа относится к Моисею и Аарону; «вашего» сохраняет дистанцию в словах фараона.
- source_word: וְלָכֶם
  choice: и против вас
  rationale: Повторно подразумевается глагол «согрешил»; местоимение множественного числа обращено к Моисею и Аарону.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; «Яхве» сохраняет личное заветное имя и не превращает его в титул.
- issue: Формулировка признания фараона
  choice: Я согрешил против Яхве, вашего Бога, и против вас
  alternative: Я согрешил перед Яхве, вашим Богом, и перед вами
  rationale: Предлог ל при חטא здесь обозначает тех, против кого направлен проступок. «Против» ясно передаёт смысл оскорбления; «вашего Бога» точно сохраняет второе лицо множественного числа и не представляет фараона исповедующим Яхве своим Богом.
translation_notes:
  register: Современный литературный русский язык; повествование лаконичное и достойное. Синтаксис сохраняет последовательность еврейского текста, но избегает неестественного оборота «поспешил призвать к».
