  text: וַ/יַּהֲפֹ֨ךְ יְהוָ֤ה רֽוּחַ יָם֙ חָזָ֣ק מְאֹ֔ד וַ/יִּשָּׂא֙ אֶת הָ֣/אַרְבֶּ֔ה וַ/יִּתְקָעֵ֖/הוּ יָ֣מָּ/ה סּ֑וּף לֹ֤א נִשְׁאַר֙ אַרְבֶּ֣ה אֶחָ֔ד בְּ/כֹ֖ל גְּב֥וּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/019.yaml
  text: And Yahweh turned a very strong west wind[a], and it carried away the locusts and drove them into the Sea of Reeds[b]. Not one locust remained in all the territory of Egypt.
translation:
  language: ru
  text: И Яхве переменил ветер на очень сильный западный ветер[a]. Этот ветер подхватил саранчу и загнал её в Тростниковое море[b]. Во всех пределах Египта не осталось ни одной саранчи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «морской ветер», то есть ветер со стороны моря; в Египте это западный ветер.'
    reason: Сохраняет буквальный образ רוּחַ יָם и объясняет контекстуальное обозначение направления.
  - marker: b
    text: Еврейское название означает «Тростниковое море»; традиционный перевод — «Красное море».
    reason: Указывает традиционное название и позволяет читателю соотнести его с более буквальной передачей еврейского топонима.
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: переменил ветер на
  rationale: Глагол הפך означает «повернуть, изменить». В данном контексте речь идёт о перемене ветра; добавление объекта делает русскую фразу ясной и естественной.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: רוּחַ יָם חָזָק מְאֹד
  choice: очень сильный западный ветер
  rationale: Буквально יָם — «море», но в системе древнееврейских обозначений сторон света «морской ветер» здесь означает ветер с запада, со стороны Средиземного моря. Контекстуальное значение вынесено в текст, а буквальный образ сохранён в примечании.
- source_word: וַיִּשָּׂא אֶת־הָאַרְבֶּה
  choice: тот подхватил саранчу
  rationale: נשא допускает значения «поднять, понести, унести». «Подхватил» естественно описывает действие сильного ветра и не дублирует следующий глагол.
- source_word: וַיִּתְקָעֵהוּ
  choice: унёс её
  rationale: תקע здесь выражает сильное направленное перемещение, вплоть до «бросил, загнал». Русское «унёс её в море» естественно передаёт результат действия ветра; местоимение единственного числа сохраняет собирательное понимание саранчи и соответствует форме суффикса.
- source_word: יָמָּה סּוּף
  choice: в Тростниковое море
  rationale: Название יַם־סוּף буквально связано с тростником или камышом. «Тростниковое море» сохраняет еврейское наименование; традиционный вариант дан в примечании.
- source_word: לֹא נִשְׁאַר אַרְבֶּה אֶחָד
  choice: не осталось ни одной саранчи
  rationale: Передаёт отрицание и усиление словом אֶחָד («один») естественной современной русской конструкцией.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: во всех пределах Египта
  rationale: גְּבוּל обозначает границу, область или территориальные пределы. Множественное русское выражение «во всех пределах» охватывает всю территорию страны и сохраняет пространственный оттенок исходного слова.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Передача топонима יַם־סוּף
  choice: Тростниковое море
  alternative: Красное море
  rationale: Выбран вариант, непосредственно отражающий еврейское название, без отождествления с более поздним традиционным топонимом. Знакомая читателям традиционная форма сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Короткие фразы облегчают чтение; местоимение «тот» ясно относит действие к ветру. Названия «Яхве» и «Тростниковое море» последовательно передают формы исходного текста.
