base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/009.yaml
  text: Moses said, “We will go with our young and our old; we will go with our sons and our daughters, with our flocks and our herds, because we must hold a feast to the LORD.”
translation:
  language: ru
  text: 'Моисей сказал: «Мы пойдём с нашими юными и пожилыми; пойдём с нашими сыновьями и дочерьми, с нашим мелким и крупным скотом, ибо у нас праздник в честь Господа».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְעָרֵינוּ וּבִזְקֵנֵינוּ
  choice: с нашими молодыми и стариками
  rationale: Передаёт меризм, охватывающий людей всех возрастов; «молодыми» естественно и не сужает значение до юношей мужского пола.
- source_word: בְּצֹאנֵנוּ וּבִבְקָרֵנוּ
  choice: с нашим мелким и крупным скотом
  rationale: צֹאן обозначает овец и коз как мелкий скот, а בָּקָר — крупный рогатый скот; формулировка точна и понятна современному читателю.
- source_word: חַג
  choice: праздник
  rationale: Слово означает религиозный праздник, нередко сопровождавшийся паломничеством и жертвенной трапезой; здесь естественнее «праздник», чем более узкое «пир».
- source_word: כִּי חַג יְהוָה לָנוּ
  choice: потому что у нас праздник Господу
  rationale: Сохраняет причинное כִּי и краткую именную конструкцию оригинала; дательный «Господу» передаёт направленность праздника к Яхве без добавления модального «мы должны устроить».
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Использована укоренённая русская библейская передача, обозначающая тетраграмматон; она не вносит конфессионально специфического толкования.
- issue: Модальность последней фразы
  choice: у нас праздник Господу
  alternative: мы должны устроить праздник Господу
  rationale: В еврейском тексте нет явного глагола долженствования. Выбранный вариант сохраняет утверждение и не усиливает его дополнительной модальностью.
translation_notes:
  register: Современный литературный русский с торжественной, но доступной библейской интонацией. Повтор глагола נֵלֵךְ частично свёрнут ради естественности русского перечисления, при этом полный охват людей и имущества сохранён.
