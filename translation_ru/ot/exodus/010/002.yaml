source:
  edition: WLC
  text: וּ/לְמַ֡עַן תְּסַפֵּר֩ בְּ/אָזְנֵ֨י בִנְ/ךָ֜ וּ/בֶן בִּנְ/ךָ֗ אֵ֣ת אֲשֶׁ֤ר הִתְעַלַּ֨לְתִּי֙ בְּ/מִצְרַ֔יִם וְ/אֶת אֹתֹתַ֖/י אֲשֶׁר שַׂ֣מְתִּי בָ֑/ם וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/002.yaml
  text: so that you may tell in the hearing of your son and of your grandson how I dealt harshly with Egypt[a], and my signs that I placed among them[b], and so that you may know that I am Yahweh.
translation:
  language: ru
  text: чтобы ты рассказывал своему сыну и внуку о том, как сурово Я обошёлся с Египтом[a], и о Моих знамениях, которые Я явил среди них, и чтобы вы знали, что Я — Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как Я посрамил Египет». Еврейский глагол может подчёркивать не только суровое обращение с Египтом, но и его унижение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и вы узнаете, что Я — Яхве». Заключительную фразу можно понимать не только как цель, но и как будущий результат.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְמַעַן
  choice: чтобы
  rationale: Передаёт целевое значение союза и естественно связывает стих с предшествующим повелением.
- source_word: תְּסַפֵּר
  choice: ты рассказывал
  rationale: Порода пиэль здесь означает пересказывать события последующим поколениям; несовершенный вид естественен для предполагаемого повторяющегося рассказа.
- source_word: בְּאָזְנֵי
  choice: своему сыну и внуку
  rationale: Буквально «в уши» — еврейская идиома, означающая рассказать так, чтобы адресаты услышали. В русском прямое дополнение передаёт её естественно, без неуклюжего буквализма.
- source_word: בִנְךָ וּבֶן בִנְךָ
  choice: своему сыну и внуку
  rationale: «Сын твоего сына» естественно передаётся словом «внук»; последовательность поколений сохранена.
- source_word: הִתְעַלַּלְתִּי
  choice: как сурово Я обошёлся
  rationale: Передаёт тяжесть Божьих действий против Египта, не сводя значение глагола лишь к насмешке; оттенок унижения сохранён в примечании.
- source_word: בְּמִצְרַיִם
  choice: с Египтом
  rationale: Соответствует управлению русского выражения «обойтись с» и сохраняет Египет как объект Божьего действия.
- source_word: אֹתֹתַי
  choice: Моих знамениях
  rationale: Прямо передаёт אות как «знамение», не добавляя отсутствующего в тексте определения «чудесный».
- source_word: שַׂמְתִּי בָם
  choice: которые Я явил среди них
  rationale: Буквально глагол означает «поместил, установил». «Явил среди них» естественно по-русски описывает данные Богом знамения и сохраняет пространственную связь с египтянами.
- source_word: וִידַעְתֶּם
  choice: и чтобы вы знали
  rationale: Продолжает целевую конструкцию, начатую לְמַעַן, и сохраняет переход от единственного числа «ты» к множественному «вы» в еврейском тексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
theological_decisions:
- issue: Значение הִתְעַלַּלְתִּי в описании Божьих действий против Египта
  choice: как сурово Я обошёлся с Египтом
  alternative: как Я посрамил Египет
  rationale: Основной текст подчёркивает суровый характер суда через казни; примечание сохраняет возможный оттенок унижения и осмеяния Египта.
- issue: Целевое или результативное понимание וִידַעְתֶּם
  choice: и чтобы вы знали
  alternative: и вы узнаете
  rationale: Начальное לְמַעַן позволяет понимать заключительную часть как продолжение цели, однако форма также допускает оттенок будущего результата; он отмечен в сноске.
- issue: Переход от единственного числа к множественному
  choice: ты рассказывал ... вы знали
  alternative: унифицировать обращение по числу
  rationale: Смена числа присутствует в еврейском тексте и может расширять адресатов от Моисея или отдельного израильтянина к народу; перевод не устраняет эту значимую особенность.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Избегается неестественный буквализм «в уши», но сохраняются межпоколенческая перспектива, смена числа обращения и личное имя Яхве.
