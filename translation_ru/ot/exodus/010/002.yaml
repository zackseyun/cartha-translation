  source_fidelity: Перевод точно передаёт целевую конструкцию לְמַעַן, повествовательное значение תְּסַפֵּר, межпоколенческую пару «сыну и внуку», суровый судебный смысл הִתְעַלַּלְתִּי и «знамения», помещённые/явленные среди египтян. Смена адресата с единственного числа («ты») на множественное («вы») сохранена. «Среди них» корректно воспроизводит множественное местоимение בָם, не устраняя возможную отсылку к египтянам.
  naturalness: Текст звучит естественно на современном литературном русском языке. Формула «чтобы ты рассказывал своему сыну и внуку» уместна в библейском регистре, но не архаична. «Как сурово Я обошёлся с Египтом» ясно и стилистически ровно.
  terminology: «Знамения» является точным и устоявшимся соответствием אֹתוֹת; «Яхве» последовательно передаёт тетраграмматон как личное имя. Основной вариант «сурово Я обошёлся с Египтом» не исключает оттенка унижения, который надлежащим образом сохранён в сноске.
