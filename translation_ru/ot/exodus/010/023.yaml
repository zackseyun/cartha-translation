source:
  edition: WLC
  text: לֹֽא רָא֞וּ אִ֣ישׁ אֶת אָחִ֗י/ו וְ/לֹא קָ֛מוּ אִ֥ישׁ מִ/תַּחְתָּ֖י/ו שְׁלֹ֣שֶׁת יָמִ֑ים וּֽ/לְ/כָל בְּנֵ֧י יִשְׂרָאֵ֛ל הָ֥יָה א֖וֹר בְּ/מוֹשְׁבֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/023.yaml
  text: They did not see one another[a], and no one rose from his place for three days[b]; but all the sons of Israel had light in their dwellings.
translation:
  language: ru
  text: Они не видели друг друга[a], и три дня никто не вставал со своего места; но у всех сынов Израиля[b] в их жилищах был свет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек не видел своего брата». Это взаимное выражение означает, что люди не видели друг друга.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть у всех израильтян; буквально: «у всех сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ ... אֶת־אָחִיו
  choice: не видели друг друга
  rationale: Сочетание אִישׁ אֶת־אָחִיו имеет взаимное значение. Русское «друг друга» естественно передаёт смысл, не сужая его до родных братьев и не добавляя отсутствующего в еврейском тексте модального оттенка «не могли».
- source_word: אִישׁ ... וְלֹא קָמוּ אִישׁ
  choice: никто не вставал
  rationale: אִישׁ употреблено дистрибутивно и обобщённо; «никто» точно и естественно передаёт отрицательную конструкцию, не ограничивая её мужчинами.
- source_word: קָמוּ
  choice: не вставал
  rationale: Глагол קום означает «вставать, подниматься». «Не вставал» сохраняет образ исходного текста и звучит естественно в повествовании.
- source_word: מִתַּחְתָּיו
  choice: со своего места
  rationale: Буквальное «из-под себя» здесь идиоматически означает покинуть то место, где человек находился. «Со своего места» ясно передаёт этот смысл.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: три дня
  rationale: В русском винительный времени естественно обозначает продолжительность без дополнительного предлога.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранено семейно-народное обозначение еврейского текста. В данном контексте оно относится ко всему народу Израиля, а не только к мужчинам или непосредственным сыновьям патриарха.
- source_word: הָיָה אוֹר
  choice: был свет
  rationale: Конструкция буквально сообщает, что у израильтян был свет. Русская формулировка сохраняет простоту утверждения и контраст с тьмой.
- source_word: בְּמֹשְׁבֹתָם
  choice: в их жилищах
  rationale: מוֹשָׁב может обозначать место жительства или поселение. «В их жилищах» хорошо соответствует непосредственному контексту и не требует уточнять, шла ли речь о каждом доме или обо всех местах проживания.
