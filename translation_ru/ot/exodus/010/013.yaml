  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יהוָ֗ה נִהַ֤ג ר֥וּחַ קָדִים֙ בָּ/אָ֔רֶץ כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה הַ/בֹּ֣קֶר הָיָ֔ה וְ/ר֨וּחַ֙ הַ/קָּדִ֔ים נָשָׂ֖א אֶת הָ/אַרְבֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/013.yaml
  text: So Moses stretched out his staff over the land of Egypt[a], and Yahweh drove an east wind over the land all that day and all the night. When morning came, the east wind had brought the locusts.
translation:
  language: ru
  text: И простёр Моисей свой посох над землёй Египта, а Яхве гнал по земле восточный ветер[a] весь тот день и всю ночь. Когда настало утро, восточный ветер принёс саранчу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ветер с востока».'
    reason: 'Лексическая альтернатива: רוּחַ קָדִים можно передать как устойчивым сочетанием «восточный ветер», так и описательно — «ветер с востока».'
lexical_decisions:
- source_word: וַיֵּט
  choice: простёр
  rationale: Глагол נטה означает «простирать, протягивать»; «простёр» естественно передаёт торжественную повествовательную формулу о посохе Моисея.
- source_word: מַטֵּהוּ
  choice: свой посох
  rationale: מַטֶּה обозначает посох или жезл. «Посох» понятен современному читателю и соответствует предмету, которым действует Моисей.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: над землёй Египта
  rationale: Предлог עַל при жесте с посохом естественно передаётся как «над».
- source_word: וַיהוָה
  choice: Яхве
  rationale: Передано собственное заветное имя יהוה, а не заменяющий его титул.
- source_word: נִהַג
  choice: гнал
  rationale: נהג выражает активное направление или движение; применительно к ветру «гнал» сохраняет образ того, как Яхве направлял ветер по земле.
- source_word: רוּחַ קָדִים
  choice: восточный ветер
  rationale: Устойчивое и естественное русское обозначение ветра, дующего с востока; возможный более прозрачный вариант указан в сноске.
- source_word: בָּאָרֶץ
  choice: по земле
  rationale: В контексте движения ветра «по земле» естественно выражает его распространение по Египту.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: весь тот день и всю ночь
  rationale: Сохранён повтор כָּל («весь/всю») и подчёркнута непрерывная продолжительность действия; русское «всю ночь» естественнее буквального воспроизведения артикля.
- source_word: הַבֹּקֶר הָיָה
  choice: Когда настало утро
  rationale: Естественная временная конструкция, точно передающая переход повествования к утру.
- source_word: נָשָׂא אֶת הָאַרְבֶּה
  choice: принёс саранчу
  rationale: נשא может означать «нести, приносить»; здесь ветер доставляет саранчу. Русская форма совершенного вида ясно передаёт завершившийся результат.
- source_word: הָאַרְבֶּה
  choice: саранчу
  rationale: Еврейское существительное в единственном числе имеет собирательное значение; русское «саранча» также является естественным собирательным обозначением.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה. Форма «Яхве» непосредственно обозначает заветное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет последовательность действий оригинала, но избегает неестественного буквального воспроизведения еврейских артиклей и видо-временных форм.
