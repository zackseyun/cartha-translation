  to: 'Тогда Яхве сказал Моисею: «Пойди к фараону, потому что Я ожесточил[a] его сердце и сердце его слуг, чтобы Я установил эти Мои знамения среди них[b]».'
  rationale: 'Исправлены три безопасные точки: «явить» заменено на более близкое к שׂים «установить»; сохранено единственное число «сердце его слуг»; уточнена буквальная формулировка первой сноски. «Пойди к фараону» даёт естественный современный русский эквивалент повеления בֹּא אֶל־פַּרְעֹה. Неоднозначность בְּקִרְבּוֹ сохранена в сноске, а прямое приписывание ожесточения Яхве оставлено без доктринального истолкования.'
