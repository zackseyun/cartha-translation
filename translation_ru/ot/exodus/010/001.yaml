source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה כִּֽי אֲנִ֞י הִכְבַּ֤דְתִּי אֶת לִבּ/וֹ֙ וְ/אֶת לֵ֣ב עֲבָדָ֔י/ו לְמַ֗עַן שִׁתִ֛/י אֹתֹתַ֥/י אֵ֖לֶּה בְּ/קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/001.yaml
  text: Then Yahweh said to Moses[a], "Go in to Pharaoh, because I have hardened his heart and the heart of his servants[b], so that I may set these signs of mine among them."
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Пойди к фараону, потому что Я ожесточил[a] его сердце и сердце его слуг, чтобы Я установил эти Мои знамения среди них[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я сделал тяжёлым его сердце». Это древнееврейское выражение означает, что Яхве сделал сердце фараона невосприимчивым и упорным.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в его среде». Речь может идти о самом фараоне либо о фараоне вместе с его слугами и двором.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Войди к фараону
  rationale: Глагол בוא может означать «прийти/войти»; в контексте аудиенции у фараона «войди к фараону» сохраняет направительный оттенок.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание данного повеления.
- source_word: הִכְבַּדְתִּי
  choice: Я ожесточил
  rationale: Каузатив от כבד буквально означает «сделать тяжёлым»; применительно к сердцу это идиома невосприимчивости и упорства. «Ожесточил» естественно передаёт её по-русски, а буквальный образ отмечен в сноске.
- source_word: לִבּוֹ ... לֵב עֲבָדָיו
  choice: его сердце и сердца его слуг
  rationale: «Сердце» сохраняет древнееврейское обозначение внутреннего центра воли и мысли. Русское множественное «сердца» при группе слуг естественно передаёт собирательное древнееврейское единственное.
- source_word: עֲבָדָיו
  choice: его слуг
  rationale: Слово может обозначать рабов, слуг или царедворцев; нейтральное «слуги» не сужает значение до одной должностной категории.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое значение оборота.
- source_word: שִׁתִי
  choice: явить
  rationale: Буквально глагол означает «положить, поместить, установить». Сочетание «явить знамения» естественно для современного русского и передаёт их совершение и предъявление в среде фараона и его двора.
- source_word: אֹתֹתַי אֵלֶּה
  choice: эти Мои знамения
  rationale: Сохраняет и указательное местоимение, и принадлежность знамений говорящему.
- source_word: בְּקִרְבּוֹ
  choice: среди них
  rationale: Форма буквально имеет единственное число — «среди него/в его среде», однако контекст упоминает фараона вместе с его слугами. Множественное число даёт естественный контекстуальный смысл, а подлинная неоднозначность отражена в сноске.
theological_decisions:
- issue: Божественное ожесточение сердца фараона
  choice: Я ожесточил его сердце
  alternative: Я сделал его сердце тяжёлым / упорным
  rationale: Текст прямо приписывает действие Яхве. Перевод не смягчает этого утверждения и не разрешает за пределами стиха напряжение между Божьим владычеством и человеческой ответственностью.
- issue: Сфера совершения знамений
  choice: среди них
  alternative: среди него / внутри него
  rationale: Контекст допускает отнесение к фараону и его окружению, тогда как грамматическая форма местоименного суффикса единственна. Основной текст читается естественно, а сноска сохраняет формальную и смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис простой и общедоступный; личное имя «Яхве» и прямое утверждение о Божьем действии сохранены. Сноски поставлены непосредственно после тех выражений, которые они поясняют.
