  source_fidelity: Смысл ожесточения передан точно и без богословского смягчения. Однако שִׁתִי означает «поместить/установить», а не «явить»; последнее интерпретирует результат знамений вместо передачи глагола. Кроме того, в еврейском тексте «сердце его слуг» стоит в единственном числе.
  naturalness: Перевод в целом литературен. «Установил ... знамения среди них» сохраняет образ оригинала и остаётся приемлемым в современном возвышенном библейском регистре. «Пойди к фараону» естественнее, чем несколько неуклюжее «войди к фараону».
  terminology: «Яхве», «ожесточил», «сердце» и «знамения» выбраны удачно. «Слуги» допустимо сохраняет широту עֲבָדָיו, не сводя их только к чиновникам. Сноска к a должна буквально включать объект идиомы — «его сердце».
