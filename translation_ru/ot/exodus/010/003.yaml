base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/003.yaml
  text: 'So Moses and Aaron went in to Pharaoh and said to him[a], “Thus says Yahweh, the God of the Hebrews: How long will you refuse to humble yourself before me? Let my people go[b], so that they may serve me.”'
translation:
  language: ru
  text: 'Моисей и Аарон пришли к фараону и сказали ему: «Так говорит Яхве, Бог евреев: „До каких пор ты будешь отказываться смириться передо Мной?[a] Отпусти Мой народ, чтобы он служил Мне[b]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «покориться Мне». Еврейский глагол может означать как смирение перед Богом, так и подчинение Ему или состояние униженности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поклонялся Мне». Еврейский глагол обозначает служение и в данном контексте включает служение Богу и поклонение Ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא מֹשֶׁה וְאַהֲרֹן אֶל־פַּרְעֹה
  choice: Моисей и Аарон пришли к фараону
  rationale: Глагол בוא с אֶל обозначает приход к человеку или вхождение в его присутствие. «Пришли к фараону» естественно передаёт сцену явления перед правителем, не добавляя отсутствующего в тексте указания на помещение.
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: и сказали ему
  rationale: Прямая и нейтральная передача обычной формулы введения речи.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохраняет традиционную вестническую формулу и её актуальную силу при введении Божьих слов.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Бог евреев
  rationale: Точно передаёт конструкцию принадлежности и употреблённое здесь этническое обозначение.
- source_word: עַד מָתַי מֵאַנְתָּ
  choice: До каких пор ты будешь отказываться
  rationale: Русская вопросительная формула естественно передаёт продолжающееся и упорное нежелание фараона.
- source_word: לֵעָנֹת מִפָּנָי
  choice: смириться передо Мной
  rationale: Передаёт требуемое от фараона смирение перед Богом; форма допускает также оттенок подчинения или состояния униженности, отмеченный в сноске.
- source_word: שַׁלַּח עַמִּי
  choice: Отпусти Мой народ
  rationale: Естественная и точная передача повторяющегося требования об освобождении народа.
- source_word: וְיַעַבְדֻנִי
  choice: чтобы он служил Мне
  rationale: «Служить» сохраняет широкий смысл עבד, который в данном контексте включает богослужение, не сужая его только до обряда. Местоимение «он» согласовано в русском языке с собирательным существительным «народ».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет это имя и не подменяет его титулом.
- issue: Значение לֵעָנֹת применительно к фараону
  choice: смириться передо Мной
  alternative: покориться Мне; быть униженным передо Мной
  rationale: Контекст требует признания фараоном Божьей власти, однако форма глагола допускает взаимосвязанные оттенки смирения, подчинения и униженности; основной текст и сноска сохраняют эту напряжённость.
- issue: Значение וְיַעַבְדֻנִי в требовании Исхода
  choice: чтобы он служил Мне
  alternative: чтобы он поклонялся Мне
  rationale: עבד охватывает служение вообще и культовое служение в частности. «Служил» сохраняет более полный диапазон значения, тогда как «поклонялся» выражает только религиозную сторону.
translation_notes:
  register: Современный литературный русский язык с достойным, но понятным библейским звучанием. Формула «Так говорит» сохраняет торжественный характер речи без архаизации. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской религиозно-издательской практикой.
