translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис упрощён там, где буквальное воспроизведение еврейской конструкции звучало бы неестественно, однако повтор «Она съест» и смысловая многослойность выражения об уцелевшем остатке сохранены.
