base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/005.yaml
  text: And it will cover the surface of the land[a], so that one will not be able to see the land; and it will eat what remains of the survivors left to you from the hail[b], and it will eat every tree growing for you out of the field.
translation:
  language: ru
  text: Она покроет поверхность земли[a], так что земли нельзя будет увидеть. Она съест остаток того, что уцелело от града и осталось у вас[b], и съест всякое дерево, растущее у вас в поле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «глаз земли» — еврейское выражение, означающее видимую поверхность земли.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «остаток спасшегося, оставшийся у вас от града».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִסָּה
  choice: Она покроет
  rationale: Глагол כסה означает «покрывать, скрывать». Будущее время соответствует предсказанию нашествия саранчи; местоимение женского рода согласуется с русским словом «саранча», названным в предшествующем контексте.
- source_word: עֵין הָאָרֶץ
  choice: поверхность земли
  rationale: Буквально «глаз земли»; это еврейская идиома, обозначающая видимую поверхность земли. Естественный русский эквивалент вынесен в текст, а буквальный образ сохранён в сноске.
- source_word: וְלֹא יוּכַל לִרְאֹת אֶת הָאָרֶץ
  choice: так что земли нельзя будет увидеть
  rationale: 'Еврейская конструкция содержит безлично употреблённое единственное число: буквально «не сможет увидеть землю». Русская безличная конструкция естественно передаёт тот же смысл, не вводя неопределённого деятеля.'
- source_word: וְאָכַל
  choice: Она съест
  rationale: אכל — обычный глагол «есть». Единственное число сохранено в соответствии с собирательным обозначением саранчи.
- source_word: יֶתֶר הַפְּלֵטָה
  choice: остаток того, что уцелело
  rationale: Сочетание обозначает оставшуюся часть того, что избежало уничтожения. Формулировка сохраняет два смысловых компонента — остаток и уцелевшее — без неуместного для неодушевлённых растений слова «выжившие».
- source_word: הַנִּשְׁאֶרֶת לָכֶם מִן הַבָּרָד
  choice: что уцелело и осталось у вас после града
  rationale: Причастие נשאר передано как «осталось», а מן הַבָּרָד в данном контексте естественно означает остаток после опустошительного града. Добавленное «уцелело» также раскрывает значение הַפְּלֵטָה.
- source_word: כָּל הָעֵץ
  choice: всякое дерево
  rationale: Единственное собирательное עץ с כל допускает распределительное понимание «всякое дерево», соответствующее форме оригинала.
- source_word: הַצֹּמֵחַ לָכֶם מִן הַשָּׂדֶה
  choice: растущее у вас в поле
  rationale: צמח означает «расти, произрастать». Русское «в поле» естественно передаёт происхождение и местонахождение растительности, выраженные сочетанием מן הַשדה; «у вас» сохраняет לָכֶם, указывающее на принадлежность или пользу.
