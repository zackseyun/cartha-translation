base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/011.yaml
  text: No! Let the men go now and serve Yahweh[b][a], for that is what you are seeking.” Then he drove them out from Pharaoh’s presence.
translation:
  language: ru
  text: «Нет![a] Идите же, мужчины[b], и служите Яхве, ведь именно этого вы и добиваетесь». Тогда фараон прогнал их от себя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Нет, не так» — более формальная передача резкого отказа фараона.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мужчины» — речь идёт о лицах мужского пола, а не обо всём народе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: Нет!
  rationale: Краткий резкий отказ естественно передаёт силу фараоновой реплики; более буквальный вариант отмечен в сноске.
- source_word: לְכוּ נָא
  choice: Пусть теперь пойдут
  rationale: Частица נָא здесь естественнее выражает настойчивость и немедленность, а не вежливую просьбу.
- source_word: הַגְּבָרִים
  choice: мужчины
  rationale: Существительное указывает именно на лиц мужского пола и сохраняет ограничительный характер уступки фараона.
- source_word: וְעִבְדוּ אֶת יְהוָה
  choice: и послужат Яхве
  rationale: Глагол עבד в отношении Бога охватывает служение и поклонение; «служить» сохраняет более широкий смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: כִּי אֹתָהּ אַתֶּם מְבַקְשִׁים
  choice: ведь именно этого вы и добиваетесь
  rationale: Женское местоимение отсылает к подразумеваемому предмету просьбы; формулировка не вводит в текст явно не названный антецедент и передаёт оттенок настойчивого требования.
- source_word: וַיְגָרֶשׁ אֹתָם
  choice: И их прогнали
  rationale: Еврейский глагол стоит в единственном числе без явно названного субъекта. Русская неопределённо-личная конструкция сохраняет эту недосказанность и силу насильственного удаления.
- source_word: מֵאֵת פְּנֵי פַרְעֹה
  choice: от лица фараона
  rationale: Достоинная и понятная русская передача придворной идиомы «из присутствия фараона».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как собственное имя; транслитерация «Яхве» сохраняет его отличие от титула «Господь».
- issue: Ограничение круга уходящих
  choice: мужчины
  alternative: народ; одни мужчины
  rationale: Еврейское הַגְּבָרִים относится к мужчинам, а не ко всему народу; это сохраняет напряжение частичной уступки фараона.
- issue: Субъект изгнания
  choice: их прогнали
  alternative: он прогнал их; фараон прогнал их
  rationale: Форма единственного числа допускает подразумеваемого фараона, однако субъект прямо не назван; неопределённо-личная конструкция избегает молчаливого устранения этой неоднозначности.
translation_notes:
  register: Современный литературный русский язык с краткой, резкой интонацией прямой речи. «Послужат» сохраняет библейскую торжественность без архаизации; «от лица фараона» поддерживает придворный контекст.
