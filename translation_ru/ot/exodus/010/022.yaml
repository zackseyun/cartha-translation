    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: простёр
  rationale: Глагол נטה при описании этого жеста означает «протянуть, простереть». «Простёр» точно передаёт физическое действие и соответствует достоинству библейского повествования.
- source_word: יָדוֹ
  choice: руку
  rationale: יָד обычно означает «рука, кисть руки»; контекст не требует расширять значение до «мышцы» или «предплечья».
- source_word: עַל הַשָּׁמַיִם
  choice: к небу
  rationale: При глаголе жеста עַל может обозначать направленность. שָׁמַיִם допускает значения «небо» и «небеса»; в контексте казни естественно «к небу».
- source_word: וַיְהִי
  choice: и ... покрыла
  rationale: Форма היה вводит наступившее состояние. В русском естественная конструкция с глаголом «покрыла» передаёт возникновение тьмы над всей страной, хотя буквально возможно «и была».
- source_word: חֹשֶׁךְ אֲפֵלָה
  choice: густая тьма
  rationale: Сочетание двух слов со значением тьмы усиливает образ. «Густая тьма» естественно по-русски передаёт крайнюю, словно ощутимую темноту.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: покрыла всю землю Египетскую
  rationale: Предлог בְּ буквально указывает на нахождение «во всей земле»; русская конструкция «покрыла всю землю» идиоматично выражает распространение тьмы, не меняя объёма утверждения.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: на три дня
  rationale: В русском «на три дня» естественно обозначает длительность наступившего состояния; также возможно более буквально «три дня».
