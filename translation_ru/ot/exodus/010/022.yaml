  text: Моисей простёр руку к небу[a], и во всей земле Египта на три дня наступила густая тьма[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к небесам». Еврейское слово שָׁמַיִם в зависимости от контекста может означать «небо» или «небеса».'
    reason: lexical_alternative
  - marker: b
