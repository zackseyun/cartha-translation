base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/017.yaml
  text: So now[a], please forgive my sin just this once, and plead with Yahweh your God[b], that he may remove from me this death only.
translation:
  language: ru
  text: Итак, прости, пожалуйста, мой грех лишь на этот раз[a], и усердно помолитесь Яхве, вашему Богу, чтобы Он отвёл от меня лишь эту смерть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «подними (или понеси) мой грех». Это еврейское выражение означает снять вину, то есть простить.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «эту смерть». Вероятно, фараон имеет в виду нынешнее смертоносное бедствие и его последствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт связующий и выводный оттенок сочетания «и теперь» в естественной современной русской речи.
- source_word: שָׂא נָא חַטָּאתִי
  choice: прости, пожалуйста, мой грех
  rationale: Оборот буквально говорит о «несении/снятии» греха, но идиоматически означает прощение; נָא передаётся вежливым и настойчивым «пожалуйста».
- source_word: אַךְ הַפַּעַם
  choice: лишь на этот раз
  rationale: Сохраняет ограничительный смысл просьбы фараона и единственное число исходного выражения.
- source_word: וְהַעְתִּירוּ
  choice: и горячо помолитесь
  rationale: Форма множественного числа обращена к Моисею и Аарону; глагол обозначает настойчивую молитву-просьбу к Богу.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: Яхве, вашему Богу
  rationale: Передаёт личное имя יהוה и сохраняет дистанцирующее выражение фараона «вашему Богу».
- source_word: וְיָסֵר מֵעָלַי
  choice: чтобы Он отвёл от меня
  rationale: Передаёт желаемый результат ходатайственной молитвы; «отвёл» естественно сочетается в русском с бедствием и смертью.
- source_word: רַק אֶת־הַמָּוֶת הַזֶּה
  choice: хотя бы эту смерть
  rationale: 'Сохраняет буквальное «эту смерть» и передаёт רַק как минимальную, настоятельную просьбу: удалить именно это смертоносное бедствие.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя без замены титулом.
- issue: Значение выражения «эта смерть»
  choice: сохранить буквальную формулировку
  alternative: эта смертоносная напасть
  rationale: Контекст указывает на нашествие саранчи и его смертельные последствия, однако текст не называет здесь прямо ни саранчу, ни язву; буквальная передача сохраняет образ и его неопределённость.
translation_notes:
  register: Современный литературный русский язык с уважительным обращением во множественном числе к Моисею и Аарону. Формулировка сохраняет настойчивость речи фараона, имя Яхве, его слова «вашему Богу» и необычный образ «эта смерть».
