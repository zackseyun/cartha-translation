  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה גַּם אַתָּ֛ה תִּתֵּ֥ן בְּ/יָדֵ֖/נוּ זְבָחִ֣ים וְ/עֹל֑וֹת וְ/עָשִׂ֖ינוּ לַ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/025.yaml
  text: But Moses said[a], “You also must give into our hands sacrifices and burnt offerings, and we will offer them to Yahweh our God.”
translation:
  language: ru
  text: 'Но Моисей сказал: «Ты также должен дать нам жертвы и всесожжения, и мы принесём их Яхве, нашему Богу».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но Моисей сказал
  rationale: Последовательная форма продвигает повествование, а союз «но» естественно передаёт противопоставление ограничению фараона в предыдущем стихе.
- source_word: גַּם אַתָּה
  choice: Ты также
  rationale: Сочетание частицы с самостоятельным местоимением подчёркивает, что и сам фараон должен предоставить необходимое; этот акцент передан без тяжеловесного «ты сам».
- source_word: תִּתֵּן בְּיָדֵנוּ
  choice: должен дать нам
  rationale: נתן означает «дать», а конструкция буквально говорит о передаче «в наши руки». В современном русском «дать нам» звучит естественнее, не меняя смысла; модальное «должен» передаёт настойчивую силу высказывания в контексте.
- source_word: זְבָחִים
  choice: жертвы
  rationale: Общее и понятное обозначение закалываемых жертвоприношений; в паре со всесожжениями термин не следует искусственно сужать.
- source_word: וְעֹלֹת
  choice: и всесожжения
  rationale: Устоявшийся точный русский термин для жертв, целиком сжигаемых на жертвеннике.
- source_word: וְעָשִׂינוּ
  choice: и мы принесём их
  rationale: Глагол עשה буквально означает «делать», но применительно к жертвам обозначает совершение жертвоприношения. «Принесём» ясно передаёт культовый смысл; местоимение «их» естественно связывает действие с названными дарами.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: Яхве, нашему Богу
  rationale: Предлог ל обозначает адресата жертвоприношения, а тетраграмматон передан как личное имя «Яхве», без замены титулом; אֱלֹהֵינוּ — «нашему Богу».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: В еврейском тексте прямо употреблено личное имя יהוה. Транслитерация «Яхве» сохраняет различие между именем и титулом, не добавляя конфессионального толкования.
- issue: Предоставляет ли фараон сами жертвы или лишь животных для них
  choice: «дать нам жертвы и всесожжения» — формулировка сохранена без уточнения
  alternative: «дать нам животных для жертв и всесожжений»
  rationale: Исходный текст называет זְבָחִים וְעֹלֹת и не уточняет отдельно, идёт ли речь о жертвенных животных до принесения или о жертвоприношениях как таковых. Перевод сохраняет эту сжатость.
translation_notes:
  register: Современный литературный русский, сдержанный и достоинственный. Синтаксис остаётся близким к еврейскому, но буквальная идиома «дать в наши руки» сглажена до естественного «дать нам». В основном тексте нет сносок, поэтому маркеры не требуются.
