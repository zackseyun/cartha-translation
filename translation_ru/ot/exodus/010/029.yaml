  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה כֵּ֣ן דִּבַּ֑רְתָּ לֹא אֹסִ֥ף ע֖וֹד רְא֥וֹת פָּנֶֽי/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/029.yaml
  text: And Moses said[a], “As you have spoken[b], I will not again see your face.”
translation:
  language: ru
  text: 'И сказал Моисей: «Верно ты сказал[a]: я больше не увижу твоего лица[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как ты сказал»; возможно также: «Пусть будет так, как ты сказал».'
    reason: alternative_reading
  - marker: b
    text: То есть больше не предстану перед тобой и не встречусь с тобой лицом к лицу.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Стандартная передача повествовательной формы с waw-consecutive; сохраняет связь с предшествующим рассказом.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: כֵּן דִּבַּרְתָּ
  choice: Верно ты сказал
  rationale: Передаёт согласие Моисея со словами фараона. Оборот допускает также смысл «как ты сказал» или «пусть будет так, как ты сказал».
- source_word: לֹא אֹסִף עוֹד
  choice: я больше не
  rationale: 'Естественно передаёт еврейскую идиому с отрицанием יסף и עוֹד: названное действие впредь не повторится.'
- source_word: רְאוֹת
  choice: увижу
  rationale: Инфинитив ראה после идиомы с יסף обозначает действие, которое более не повторится; русская личная форма необходима синтаксически.
- source_word: פָּנֶיךָ
  choice: твоего лица
  rationale: Сохраняет буквальный образ еврейского текста; в данном контексте выражение также означает личную встречу или пребывание перед фараоном.
