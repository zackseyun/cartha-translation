  terminology: Имя «Моисей» нормативно. «Лицо» соответствует פָּנֶיךָ; пояснительная сноска корректно раскрывает контекстуальный смысл, не подменяя основной текст. Сноска a добросовестно отмечает допустимые оттенки כֵּן דִּבַּרְתָּ и согласуется с английским аудиторским следом.
