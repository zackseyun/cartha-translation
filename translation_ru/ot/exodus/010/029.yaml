  source_fidelity: 'Русский текст точно передаёт еврейский оригинал: כֵּן דִּבַּרְתָּ естественно передано как «Верно ты сказал», а לֹא אֹסִף עוֹד רְאוֹת פָּנֶיךָ — как решительное «я больше не увижу твоего лица». Будущее значение и отрицательная необратимость выражены корректно.'
