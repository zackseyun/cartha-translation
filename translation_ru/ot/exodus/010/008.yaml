  text: So Moses and Aaron were brought back to Pharaoh[a], and he said to them, “Go, serve Yahweh your God. Who are the ones going?”
translation:
  language: ru
  text: 'Моисея и Аарона привели обратно к фараону, и он сказал им: «Идите, служите Яхве, вашему Богу. Кто именно[a] пойдёт?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Кто и кто идут?» — оборот, требующий точно назвать тех, кто отправится.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוּשַׁב
  choice: возвратили
  rationale: 'Хофал глагола שוב выражает каузативно-пассивное действие: Моисея и Аарона заставили вернуться, то есть возвратили. Русская неопределённо-личная конструкция естественно передаёт действие без названного исполнителя.'
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Моисея и Аарона
  rationale: Имена переданы в принятой русской библейской форме; показатели прямого дополнения выражены винительным падежом.
- source_word: אֶל פַּרְעֹה
  choice: к фараону
  rationale: Предлог אֶל обозначает направленность к лицу; «к фараону» прямо и естественно передаёт эту связь.
- source_word: לְכוּ
  choice: идите
  rationale: Прямое соответствие императиву множественного числа от הלך.
- source_word: עִבְדוּ
  choice: служите
  rationale: Глагол עבד здесь обозначает служение Богу и может включать поклонение; «служите» сохраняет более широкий смысл, не сужая его до обряда.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве», а не заменяющим его титулом.
- source_word: אֱלֹהֵיכֶם
  choice: вашему Богу
  rationale: Форма с суффиксом второго лица множественного числа передана притяжательной конструкцией.
- source_word: מִי וָמִי
  choice: кто именно
  rationale: Повтор «кто и кто» требует точного перечисления участников; «кто именно» естественно передаёт идиоматический акцент, а буквальная форма отмечена в сноске.
- source_word: הַהֹלְכִים
  choice: пойдёт
  rationale: Субстантивированное причастие обозначает тех, кто собирается идти. В русском вопрос «кто именно пойдёт?» естественно передаёт эту группу без тяжеловесного «кто те идущие».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому транслитерация сохраняет различие между именем и титулом.
