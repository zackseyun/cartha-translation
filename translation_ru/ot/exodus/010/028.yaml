  yaml_path: translation/ot/exodus/010/028.yaml
  text: Then Pharaoh said to him[a], “Go away from me. Watch yourself; do not see my face again, for on the day you see my face[b], you will die.”
translation:
  language: ru
  text: 'Тогда фараон сказал ему: «Уйди от меня! Берегись: больше не смотри мне в лицо[a], потому что в тот день, когда увидишь моё лицо[b], ты умрёшь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не продолжай видеть моего лица»; это еврейский оборот со значением «больше не являйся предо мной» или «больше не смотри мне в лицо».'
    reason: lexical_alternative
  - marker: b
    text: «Моё лицо» может также означать «моё присутствие»; в еврейском тексте слово «лицо» повторено для усиления.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ פַרְעֹה
  choice: Тогда фараон сказал ему
  rationale: Последовательная форма глагола продолжает повествование; «тогда» естественно передаёт развитие событий, а местоимение «ему» сохранено.
- source_word: לֵךְ מֵעָלָי
  choice: Уйди от меня
  rationale: Прямое и естественное по-русски требование удалиться, сохраняющее резкость приказа.
- source_word: הִשָּׁמֶר לְךָ
  choice: Берегись
  rationale: Краткое предупреждение с угрожающим оттенком соответствует возвратной форме глагола שמר и дательному заинтересованного лица.
- source_word: אַל תֹּסֶף רְאוֹת פָּנַי
  choice: не смей больше видеть моего лица
  rationale: «Больше» естественно передаёт идиому יסף с инфинитивом, а «не смей» выражает силу запрета в данном угрожающем контексте. Слово «лицо» сохранено ради образа и повтора.
- source_word: בְּיוֹם
  choice: в тот день
  rationale: Сохраняет буквальный временной оборот и торжественно-угрожающий тон; в контексте он может иметь смысл «когда».
- source_word: רְאֹתְךָ פָנַי
  choice: когда увидишь моё лицо
  rationale: Инфинитивная конструкция естественно передана придаточным времени, при этом повтор слова «лицо» сохранён.
- source_word: תָּמוּת
  choice: ты умрёшь
  rationale: Современная и однозначная передача прямой угрозы без архаического оттенка.
theological_decisions:
- issue: Значение повторённого פָּנַי
  choice: моего лица / моё лицо
  alternative: предо мной / в моём присутствии
  rationale: Буквальный образ и риторический повтор сохранены, не исключая метонимического значения «присутствие»; оно отмечено в сноске, а не подменяет текст.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой царской речи. Угрожающий тон передан краткими императивами; еврейский повтор слова «лицо» сохранён, хотя по-русски он звучит несколько формально.
