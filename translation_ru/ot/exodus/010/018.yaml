  yaml_path: translation/ot/exodus/010/018.yaml
  text: So he went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: ru
  text: Он вышел от фараона и взмолился Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал молить Яхве»; возможно также: «усердно помолился Яхве». Еврейский глагол выражает настойчивую мольбу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Форма глагола יצא обозначает выход или уход; «вышел» сохраняет конкретное движение из присутствия фараона и последовательность повествования.
- source_word: מֵעִם
  choice: от
  rationale: Сочетание указывает на удаление от того, с кем находился человек. Русское «от фараона» естественно передаёт смысл ухода из его присутствия.
- source_word: פַּרְעֹה
  choice: фараона
  rationale: Общепринятая русская передача египетского царского титула; родительный падеж обусловлен предлогом «от».
- source_word: וַיֶּעְתַּר
  choice: взмолился
  rationale: Глагол עתר выражает настойчивую, горячую мольбу, часто обращённую к Богу. «Взмолился» кратко и естественно передаёт как молитвенный характер действия, так и его напряжённость.
- source_word: אֶל
  choice: Яхве (дательный падеж)
  rationale: Предлог אֶל направляет мольбу к адресату; при русском глаголе «взмолиться» это естественно выражается беспредложным дательным падежом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблён тетраграмматон, поэтому личное имя передано транслитерацией, а не заменено титулом.
- issue: Характер обращения к Богу в глаголе עתר
  choice: взмолился
  alternative: помолился; стал молить; воззвал
  rationale: Выбрано слово, сохраняющее оттенок настойчивой мольбы, но не уточняющее содержание просьбы и не добавляющее конфессиональной интерпретации.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным строем. Подлежащее оставлено местоименным, как в еврейском тексте; имя Моисея не добавлено. Начальный союз не воспроизведён механически, поскольку последовательность действий ясно выражена порядком предложений и союзом «и».
