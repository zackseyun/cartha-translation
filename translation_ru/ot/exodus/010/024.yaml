base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/024.yaml
  text: Then Pharaoh called to Moses and said[a], “Go, serve Yahweh. Only let your flocks and your herds remain behind[b]; even your little ones may go with you.”
translation:
  language: ru
  text: 'Тогда фараон позвал Моисея и сказал: «Идите, служите Яхве. Только ваш мелкий и крупный скот пусть останется; даже ваши дети пусть идут с вами».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה אֶל מֹשֶׁה
  choice: фараон позвал Моисея
  rationale: В данном повествовательном контексте קרא אל означает позвать или обратиться; русское «позвал Моисея» естественно передаёт вызов к разговору без усиления до официального «призвал».
- source_word: לְכוּ עִבְדוּ
  choice: идите, служите
  rationale: Сохраняется множественное число повелительных форм и ключевой для Исхода мотив служения Израиля Яхве, а не фараону; «служите» также не исключает культового смысла поклонения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, представленное тетраграмматоном, а не заменяется титулом.
- source_word: רַק
  choice: только
  rationale: Слово вводит ограничение, которым фараон обусловливает своё разрешение.
- source_word: צֹאנְכֶם וּבְקַרְכֶם
  choice: мелкий и крупный скот ваш
  rationale: צֹאן обозначает главным образом овец и коз, а בָּקָר — крупный рогатый скот; такая пара точнее исходных категорий и естественна в современном русском.
- source_word: יֻצָּג
  choice: пусть останется
  rationale: Хофаль от יצג здесь выражает оставление скота на месте. «Пусть останется» естественно передаёт результативно-пассивный смысл в контексте требования фараона.
- source_word: גַּם טַפְּכֶם
  choice: даже дети ваши
  rationale: גַּם имеет здесь усилительно-уступительный оттенок, а טַף обозначает детей, особенно малых, либо семейных иждивенцев; «даже дети» ясно выражает уступку фараона без архаизма.
- source_word: יֵלֵךְ עִמָּכֶם
  choice: пусть идут с вами
  rationale: Единственное число сказуемого согласовано в еврейском с собирательным טַף; по-русски естественно множественное число при слове «дети».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога. Форма «Яхве» сохраняет его как имя и соответствует наиболее принятой научной реконструкции произношения, не вводя конфессиональной замены титулом.
- issue: Значение עבד в обращении к Богу
  choice: служите
  alternative: поклоняйтесь
  rationale: «Служите» непосредственно передаёт глагол и сохраняет богословски значимое противопоставление служения Яхве рабской службе фараону, при этом культовый оттенок остаётся возможным.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок «скот ваш», «дети ваши» слегка приподнят, но понятен и помогает сохранить ритм прямой речи. Неясность между общим служением и культовым поклонением не устранена.
