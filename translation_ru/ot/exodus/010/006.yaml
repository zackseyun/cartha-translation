    rationale: Еврейское אֲשֶׁר לֹא רָאוּ продолжает предшествующее описание. Начало новой фразы «Ничего подобного...» понятно, но менее тесно связывает невиданное явление с заполнением домов.
  - severity: low
    issue: Оттенок глагола «появились»
    rationale: «Появились на земле» может означать возникновение или прибытие; в данной временной формуле предпочтительнее нейтрально передать длительное пребывание людей на земле.
