base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/006.yaml
  text: And they will fill your houses[a], the houses of all your servants[b], and the houses of all Egypt—something your fathers and your fathers’ fathers have not seen from the day they were on the land until this day.” Then he turned and went out from Pharaoh.
translation:
  language: ru
  text: И они наполнят твои дома, дома всех твоих слуг и дома всех египтян[a] — такого не видели ни твои предки, ни предки твоих предков с того дня, как они живут на земле, до сегодняшнего дня». Затем Моисей повернулся и вышел от фараона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дома всего Египта».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: И наполнят они
  rationale: Форма продолжает будущее значение предшествующего объявления; подразумеваемое подлежащее — саранча. Порядок слов сохраняет связь с контекстом и торжественный тон угрозы.
- source_word: בָתֶּיךָ ... וּבָתֵּי כָל עֲבָדֶיךָ ... וּבָתֵּי כָל מִצְרַיִם
  choice: твои дома, дома всех твоих слуг и дома всех египтян
  rationale: Повтор слова «дома» передаёт трёхчастное нарастание в еврейском тексте. «Дома всех египтян» естественнее по-русски, чем буквальное «дома всего Египта».
- source_word: עֲבָדֶיךָ
  choice: твоих слуг
  rationale: Слово может обозначать придворных и должностных лиц фараона, но нейтральное «слуги» не сужает значение и сохраняет лексику источника.
- source_word: אֲשֶׁר לֹא רָאוּ
  choice: Ничего подобного не видели
  rationale: Относительное придаточное характеризует невиданную прежде язву. Русская самостоятельная фраза ясно передаёт эту связь без неестественной конструкции.
- source_word: אֲבֹתֶיךָ וַאֲבֹת אֲבֹתֶיךָ
  choice: твои предки, ни предки твоих предков
  rationale: «Предки» охватывает ряд поколений; «отцы» в современном русском могло бы быть понято слишком узко. Повтор сохраняет усилительную древнееврейскую формулу.
- source_word: מִיּוֹם הֱיוֹתָם עַל הָאֲדָמָה
  choice: с тех пор, как они появились на земле
  rationale: Передаёт исходный момент их существования или пребывания на земле и звучит естественно в современном русском.
- source_word: הָאֲדָמָה
  choice: земле
  rationale: В данном выражении слово допускает значения «земля», «суша» или «почва»; «на земле» естественно обозначает человеческое существование в мире, не исключая локального оттенка.
- source_word: וַיִּפֶן וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: Затем Моисей повернулся и вышел от фараона
  rationale: Имя Моисея восстановлено из контекста ради ясности русского повествования. Два последовательных действия источника сохранены.
