  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה נְטֵ֤ה יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ֥/יהִי חֹ֖שֶׁךְ עַל אֶ֣רֶץ מִצְרָ֑יִם וְ/יָמֵ֖שׁ חֹֽשֶׁךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/021.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky, so that there may be darkness over the land of Egypt, and the darkness may be felt.”
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Протяни руку к небу, и пусть над землёй Египта наступит тьма — тьма, которую можно будет ощутить[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский текст можно понять как «и тьму можно будет ощутить» или, возможно, «и будут ощупью двигаться во тьме». Здесь употреблён редкий глагол; выражение подчёркивает необычайную плотность и гнетущую силу тьмы.
    reason: Редкий глагол וְיָמֵשׁ допускает разные синтаксические и лексические толкования, поэтому существенная неоднозначность сохранена в примечании.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, общепринятой современной русской транслитерацией, не заменяя его титулом.
- source_word: נְטֵה יָדְךָ
  choice: Протяни руку
  rationale: Прямая и естественная передача повелительной формы и существительного с местоименным суффиксом.
- source_word: עַל הַשָּׁמַיִם
  choice: к небу
  rationale: В контексте направленного вверх жеста предлог עַל естественно передаётся как «к», а множественная по форме лексема שָׁמַיִם в русском языке соответствует единственному числу «небо».
- source_word: וִיהִי חֹשֶׁךְ
  choice: и пусть … наступит тьма
  rationale: Передаёт волитивное значение формы וִיהִי и звучит естественно по-русски применительно к наступлению тьмы.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: над землёй Египта
  rationale: Сохраняет существительное אֶרֶץ и пространственное значение עַל; творительный падеж после «над» соответствует русской норме.
- source_word: וְיָמֵשׁ חֹשֶׁךְ
  choice: тьма, которую можно будет ощутить
  rationale: Передаёт наиболее вероятный смысл редкого глагола как указание на физически ощутимую, гнетущую тьму, не превращая образ в буквальное утверждение о прикосновении.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. «Яхве» сохраняет это различие и представляет наиболее распространённую в современной библеистике русскую форму.
- issue: Характер египетской тьмы
  choice: тьма, которую можно будет ощутить
  alternative: и будут нащупывать во тьме; и тьма сгустится
  rationale: Основной текст сохраняет традиционное понимание редкого глагола как описания ощутимой тьмы, а лексическая неопределённость отмечена в сноске без догматического уточнения природы чуда.
translation_notes:
  register: Современный литературный русский язык с торжественной, но общедоступной библейской интонацией. Повтор «тьма — тьма» передаёт усиление заключительной фразы и позволяет ясно присоединить пояснение. Маркер сноски поставлен непосредственно при спорном выражении.
