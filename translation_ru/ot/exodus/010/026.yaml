base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/026.yaml
  text: And even our livestock will go with us; not a hoof will be left behind[a], for from them we must take to serve Yahweh our God, and we do not know with what we must serve Yahweh until we arrive there.
translation:
  language: ru
  text: 'И даже весь наш скот пойдёт с нами; ни одно копыто не останется: ведь из него мы возьмём, чтобы служить[a] Яхве, нашему Богу; а мы не знаем, чем будем служить Яхве, пока не придём туда.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклоняться». Еврейский глагол может означать «служить» или, в данном контексте, «поклоняться»; он повторяется далее в стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵנוּ
  choice: наш скот
  rationale: מִקְנֶה — собирательное обозначение домашних животных; «скот» естественно и достаточно широко передаёт значение.
- source_word: יֵלֵךְ עִמָּנוּ
  choice: пойдёт с нами
  rationale: Прямо передаёт будущее движение и сопровождение в современном русском языке.
- source_word: לֹא תִשָּׁאֵר פַּרְסָה
  choice: ни одного копыта не останется
  rationale: Сохраняет буквальный образ «копыта» и эмфатический смысл отрицательной конструкции.
- source_word: כִּי מִמֶּנּוּ נִקַּח
  choice: потому что из него мы возьмём
  rationale: Сохраняет неопределённый объект еврейского выражения, не добавляя отсутствующего в тексте «то, что нужно».
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵינוּ
  choice: для служения Яхве, нашему Богу
  rationale: «Служение» сохраняет широкий смысл עבד и связь со вторым употреблением того же корня; имя יהוה передано транслитерацией «Яхве».
- source_word: וַאֲנַחְנוּ לֹא נֵדַע
  choice: мы не узнаем
  rationale: 'В сочетании с עַד выражение ориентировано на будущее: знание не будет получено до прибытия.'
- source_word: מַה נַּעֲבֹד אֶת יְהוָה
  choice: чем нам служить Яхве
  rationale: 'В контексте מַה естественно понимать инструментально: какие животные или приношения потребуются для служения.'
- source_word: עַד בֹּאֵנוּ שָׁמָּה
  choice: пока не придём туда
  rationale: Естественно передаёт предел времени и прибытие к месту назначения.
theological_decisions:
- issue: Значение עבד в контексте жертвоприношения и поклонения
  choice: служить / служение Яхве
  alternative: поклоняться Яхве / поклонение Яхве
  rationale: Контекст допускает значение «поклоняться», однако «служить» сохраняет повтор еврейского корня и не сужает его широкий заветный смысл до одной лишь обрядовой сферы.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя в исходном тексте, а не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Сохранены конкретный образ «копыта», повтор идеи служения и некоторая синтаксическая неопределённость фразы «из него мы возьмём».
