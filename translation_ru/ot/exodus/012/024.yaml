  text: And you shall keep this thing as a statute for you and for your sons forever[a][b].
translation:
  language: ru
  text: Соблюдайте это[a] как установление для вас и ваших сыновей[b] навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать «слово», «дело», «предмет» или «обстоятельство».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ваших детей»; «ваших потомков». В еврейском тексте: «ваших сыновей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Соблюдайте
  rationale: В правовом и заветном контексте שׁמר означает хранить предписание, то есть соблюдать его. Русское «соблюдайте» естественно передаёт требование постоянного исполнения.
- source_word: הַדָּבָר הַזֶּה
  choice: это
  rationale: דָּבָר может означать слово, дело, предмет или нечто предписанное. Местоименное «это» естественно отсылает ко всему только что изложенному порядку Пасхи и не сужает широкого значения еврейского слова; неоднозначность отмечена в сноске.
- source_word: לְחָק
  choice: как установление
  rationale: חֹק обозначает установленное, обязательное предписание. «Установление» сохраняет правовой характер выражения и в данном синтаксисе звучит по-русски естественнее, чем более канцелярское «статут».
- source_word: לְךָ וּלְבָנֶיךָ
  choice: для себя и своих сыновей
  rationale: Еврейский текст буквально говорит о «сыновьях». Основной текст сохраняет эту форму, не заменяя её истолковывающими вариантами «дети» или «потомки».
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Сочетание עַד עוֹלָם выражает неограниченную или постоянную длительность. «Навеки» кратко и естественно передаёт эту силу.
theological_decisions:
- issue: Круг наследников в выражении «твои сыновья»
  choice: Сохранить в основном тексте «своих сыновей»
  alternative: «своих детей» или «своих потомков»
  rationale: Источник прямо употребляет слово «сыновья». Хотя в контексте преемственности поколений оно может представлять более широкий круг потомков, такое расширение является толкованием и потому вынесено в сноску.
- issue: Характер и длительность обязанности
  choice: «как установление… навеки»
  alternative: «как обычай… из поколения в поколение»
  rationale: Текст использует правовой термин חֹק и сильное выражение длительности עַד עוֹלָם. Перевод не ослабляет их до обычая и не уточняет богословски, каким образом это установление действует в последующие эпохи.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повелительное «соблюдайте» передаёт обращение во множественном числе; оборот «для себя и своих сыновей» естественно выражает распределительное значение последующих форм единственного числа в обращении к общине.
