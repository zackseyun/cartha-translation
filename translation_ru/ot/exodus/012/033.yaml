lexical_decisions:
- source_word: וַתֶּחֱזַק מִצְרַיִם עַל־הָעָם
  choice: Египтяне настойчиво торопили народ
  rationale: Глагол חזק с עַל выражает сильное давление на людей. «Настойчиво торопили» естественно передаёт одновременно силу нажима и срочность, не подразумевая физического насилия.
- source_word: מִצְרַיִם
  choice: Египтяне
  rationale: Название страны употреблено как собирательное обозначение её жителей; по-русски личный субъект яснее передаётся словом «египтяне».
- source_word: לְמַהֵר לְשַׁלְּחָם
  choice: чтобы скорее выслать их
  rationale: Последовательность двух инфинитивов выражает цель и крайнюю поспешность. «Чтобы скорее выслать» сохраняет эту связь и звучит естественно по-русски.
- source_word: מִן־הָאָרֶץ
  choice: из страны
  rationale: Буквально «из земли»; в контексте речь идёт о стране Египет. «Из страны» сохраняет референцию без ненужного уточнения.
- source_word: כִּי אָמְרוּ
  choice: потому что говорили
  rationale: כִּי вводит причину настойчивости египтян, а форма אָמְרוּ естественно передаётся прошедшим временем.
- source_word: כֻּלָּנוּ מֵתִים
  choice: Мы все умрём!
  rationale: Буквально сочетание допускает «мы все мертвы» или «мы все умираем», но из уст живых египтян после гибели первенцев оно идиоматически выражает уверенность в неминуемой смерти. Будущее время естественно передаёт смысл, не создавая логического противоречия.
