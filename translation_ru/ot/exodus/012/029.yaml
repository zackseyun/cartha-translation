source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַֽ/יהוָה֮ הִכָּ֣ה כָל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכֹ֤ר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שְּׁבִ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/בּ֑וֹר וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/029.yaml
  text: And at midnight Yahweh struck down every firstborn in the land of Egypt[a], from the firstborn of Pharaoh, who sat on his throne, to the firstborn of the captive who was in the prison pit, and every firstborn of the livestock.
translation:
  language: ru
  text: В полночь Яхве поразил всех первенцев в земле Египта — от первенца фараона, сидящего на своём престоле, до первенца пленника, находившегося в тюремной яме[a], — а также всех первенцев скота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «первенца узника, находившегося в темнице».'
    reason: 'Лексическая альтернатива: הַשְּׁבִי допускает передачу «узник», а בֵּית הַבּוֹר в тюремном контексте может обозначать темницу без буквального воспроизведения образа ямы.'
lexical_decisions:
- source_word: וַיְהִי בַּחֲצִי הַלַּיְלָה
  choice: В полночь
  rationale: Нарративная формула וַיְהִי вводит следующее событие и в современном русском не требует отдельного архаического оборота «и было». בַּחֲצִי הַלַּיְלָה естественно передаётся как «в полночь».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, обозначенное тетраграмматоном, без замены титулом «Господь».
- source_word: הִכָּה
  choice: поразил
  rationale: Глагол означает нанесение поражающего удара; контекст ясно указывает на смертельный исход, а «поразил» сохраняет исходный образ и не сводит его к пояснительному «убил».
- source_word: כָל בְּכוֹר
  choice: всех первенцев
  rationale: Сочетание выражает совокупность перворождённых; форма множественного числа естественна по-русски и сохраняет всеохватность כָל.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в земле Египетской
  rationale: Сохранено полное географическое выражение, а не сокращённое «в Египте»; выбран привычный для литературного русского порядок слов.
- source_word: מִבְּכֹר פַּרְעֹה ... עַד בְּכוֹר הַשְּׁבִי
  choice: от первенца фараона ... до первенца пленника
  rationale: Прямо сохранена конструкция диапазона מִן ... עַד («от ... до»), показывающая охват от вершины общества до его низов.
- source_word: הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: сидящего на своём престоле
  rationale: Причастный оборот передаёт царский статус фараона и сохраняет образ престола без лишнего истолкования.
- source_word: הַשְּׁבִי
  choice: пленника
  rationale: Слово обозначает человека, взятого в плен; «пленник» ближе к его основному значению, чем более общее «узник».
- source_word: בְּבֵית הַבּוֹר
  choice: в тюремной яме
  rationale: Переданы и тюремный контекст, и конкретный образ ямы (בּוֹר), не сведённый к общему слову «темница».
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: а также всех первенцев скота
  rationale: בְּהֵמָה здесь охватывает домашних животных; «скот» является естественным русским собирательным обозначением. «А также» ясно присоединяет последнюю категорию к человеческим первенцам.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет имя и не заменяет его титулом; форма «Иегова» основана на более позднем смешанном чтении.
- issue: Смысл глагола הִכָּה в контексте последней казни
  choice: поразил
  alternative: убил; умертвил
  rationale: Смертельный результат несомненен из контекста, однако исходный глагол изображает поражающий удар. «Поразил» сохраняет этот образ и не делает перевод более прямолинейным, чем еврейский текст.
translation_notes:
  register: Современный литературный русский с торжественной, но не архаической библейской интонацией. Синтаксис «от ... до ...» сохраняет риторический размах стиха; тире помогают ясно отделить диапазон человеческих жертв от упоминания скота.
