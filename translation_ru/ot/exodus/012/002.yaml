  yaml_path: translation/ot/exodus/012/002.yaml
  text: This month shall be for you the beginning of months[a]; it shall be the first month of the year for you.
translation:
  language: ru
  text: Этот месяц будет для вас началом месяцев[a]; он будет для вас первым среди месяцев года.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это новолуние»: еврейское слово может также означать «новолуние»; здесь оно обозначает календарный месяц.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹדֶשׁ הַזֶּה
  choice: Этот месяц
  rationale: В календарно-правовом контексте חֹדֶשׁ естественно означает «месяц», хотя слово связано также с новолунием.
- source_word: לָכֶם
  choice: для вас
  rationale: Предлог выражает отнесённость установленного порядка к Израилю; повтор сохранён вслед за еврейским текстом.
- source_word: רֹאשׁ חֳדָשִׁים
  choice: началом месяцев
  rationale: רֹאשׁ буквально означает «голова», но применительно ко времени указывает на начало или первое место; выбран естественный русский эквивалент.
- source_word: רִאשׁוֹן הוּא
  choice: он будет ... первым
  rationale: Рִאשׁוֹן выражает порядковое первенство, а местоимение הוּא возобновляет подлежащее «этот месяц».
- source_word: לְחָדְשֵׁי הַשָּׁנָה
  choice: среди месяцев года
  rationale: 'Фраза обозначает сферу исчисления: этот месяц занимает первое место по отношению к остальным месяцам года.'
theological_decisions:
- issue: Временная и предписывающая сила безглагольных еврейских предложений
  choice: будет
  alternative: есть / является
  rationale: Контекст передаёт установление календарного порядка Богом, поэтому будущее «будет» естественно выражает предписывающую силу, не добавляя доктринального содержания.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет торжественную простоту установительного высказывания и повтор «для вас». «Среди месяцев года» яснее воспроизводит еврейскую сферу соотнесения, чем сжатое «первым месяцем года».
