  yaml_path: translation/ot/exodus/012/020.yaml
  text: You shall not eat anything leavened[b][a]; in all your dwellings you shall eat unleavened bread.
translation:
  language: ru
  text: Не ешьте ничего квасного[a]; во всех местах, где вы живёте[b], ешьте пресный хлеб.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никакой заквашенной пищи». Еврейское слово обозначает всё приготовленное с закваской, а не только хлеб.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во всех ваших поселениях». Речь идёт о всяком месте, где вы живёте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַחְמֶצֶת
  choice: ничего квасного
  rationale: В отрицательной конструкции כָּל придаёт запрету всеохватный смысл, а מַחְמֶצֶת обозначает любую заквашенную пищу, не только хлеб. Русское «ничего квасного» кратко, естественно и сохраняет широту значения.
- source_word: לֹא תֹאכֵלוּ
  choice: не ешьте
  rationale: Сочетание לֹא с имперфектом во множественном числе выражает прямой запрет. Повелительная форма естественна для современного русского языка и сохраняет нормативную силу.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: во всех местах, где вы живёте
  rationale: מוֹשָׁב может означать место жительства или поселение. Выбранная формулировка ясно передаёт распространение предписания на всякое место проживания, не сужая его до отдельных домов.
- source_word: תֹּאכְלוּ
  choice: ешьте
  rationale: Имперфект здесь имеет предписывающую силу и образует параллель с предшествующим запретом. Русская повелительная форма передаёт это прямо и естественно.
- source_word: מַצּוֹת
  choice: пресный хлеб
  rationale: Множественное מַצּוֹת обозначает хлебные изделия без закваски; собирательное русское «пресный хлеб» является ясным и общепринятым соответствием.
