  text: וַ/יַּֽעֲשׂ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֥ה וְ/אֶֽת אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/050.yaml
  text: And all the sons of Israel did as Yahweh had commanded Moses and Aaron[b][a]; so they did.
translation:
  language: ru
  text: И все сыны Израиля[a] сделали так, как Яхве повелел Моисею и Аарону; так они и сделали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально: «сыны Израиля».'
    reason: Лексическая альтернатива
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: И ... сделали
  rationale: Глагол עשה в контексте исполнения повеления естественно передаётся словом «сделали»; повтор в конце стиха сохранён.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: все сыны Израиля
  rationale: Сохранено буквальное родовое обозначение «сыны Израиля» и значение совокупности, выраженное כָּל.
- source_word: כַּאֲשֶׁר
  choice: так, как
  rationale: Оборот ясно выражает соответствие поступков данному повелению и естественно звучит по-русски.
- source_word: צִוָּה
  choice: повелел
  rationale: В данном контексте «повелел» передаёт властное предписание и соответствует возвышенному, но понятному библейскому регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, без замены титулом.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Моисею и Аарону
  rationale: Еврейские показатели прямого дополнения показывают адресатов повеления; русское управление глагола «повелеть» требует дательного падежа.
- source_word: כֵּן עָשׂוּ
  choice: так они и сделали
  rationale: Сохранены итоговое усиление כֵּן и намеренный повтор глагола עשה.
theological_decisions:
- issue: Передача заветного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя; форма «Яхве» непосредственно передаёт его принятую научную реконструкцию, тогда как «Господь» является традиционной заменой титулом.
- issue: Передача выражения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Основной текст сохраняет родовое и грамматически мужское выражение источника; более идиоматичный этноним указан в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический повтор оригинала сохранён ради подчёркивания полного послушания; устаревшие формы и ненужные пояснения в основном тексте избегаются.
