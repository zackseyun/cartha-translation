base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/042.yaml
  text: It was a night of vigil for Yahweh[a], to bring them out from the land of Egypt; this same night is a vigil for Yahweh for all the children of Israel throughout their generations.
translation:
  language: ru
  text: Это была ночь бдения для Яхве — для того чтобы вывести их из земли Египетской. Эта самая ночь — бдение для Яхве для всех сынов Израиля во все их поколения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ночь бодрствования», «ночь стражи» или «ночь соблюдения». Еврейское שִׁמֻּרִים связано с бодрствованием, охраной и соблюдением; оно может обозначать как бдение, так и памятное соблюдение этой ночи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵיל שִׁמֻּרִים
  choice: ночь бдения
  rationale: Сочетание конструктивной формы לֵיל с שִׁמֻּרִים обозначает ночь, отмеченную бодрствованием, хранением или соблюдением. «Ночь бдения» кратко и естественно сохраняет этот диапазон значений.
- source_word: שִׁמֻּרִים
  choice: бдение
  rationale: Слово от корня שׁמר («хранить, стеречь, соблюдать») может указывать как на бодрствование, так и на памятное священное соблюдение; «бдение» не сводит его лишь к одному из этих оттенков.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל выражает отношение или посвящение; «для Яхве» сохраняет эту открытость и не превращает выражение однозначно ни в действие самого Яхве, ни только в поклонение Ему.
- source_word: לְהוֹצִיאָם
  choice: когда Он выводил их
  rationale: Инфинитив с ל связан с избавлением из Египта и допускает целевой либо обстоятельственный оттенок. В русском буквальное «чтобы вывести их» при обороте «ночь для Яхве» звучит неясно; временная формулировка передаёт историческую связь, а местоимение указывает на Яхве как действующего в ближайшем контексте.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Сохранено явно выраженное אֶרֶץ («земля»); традиционное русское сочетание остаётся понятным и литературным.
- source_word: הוּא הַלַּיְלָה הַזֶּה
  choice: эту самую ночь
  rationale: «Самую» передаёт подчёркнутое отождествление, выраженное местоимением и указательным оборотом.
- source_word: לְכָל בְּנֵי יִשְׂרָאֵל
  choice: все сыны Израиля
  rationale: «Сыны Израиля» сохраняет родственно-заветную форму еврейского выражения и при этом привычно для русского библейского стиля.
- source_word: לְדֹרֹתָם
  choice: из поколения в поколение
  rationale: Естественная русская формула для непрерывного соблюдения последующими поколениями.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; форма «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Значение שִׁמֻּרִים в историко-культовом контексте
  choice: бдение
  alternative: стража; бодрствование; соблюдение
  rationale: «Бдение» удерживает напряжение между ночным бодрствованием и памятным религиозным соблюдением, не ограничивая слово только одним смыслом.
- issue: Кто совершает бдение в первой части стиха
  choice: сохранена формула «ночь бдения для Яхве»
  alternative: ночь, когда Яхве бодрствовал; ночь бдения перед Яхве
  rationale: Еврейская конструкция допускает связь бдения как с охраняющим действием Яхве, так и с посвящённым Ему соблюдением. Перевод не закрепляет исключительно одну трактовку; неоднозначность пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Формы «Яхве», «сыны Израиля» и «земля Египетская» сохраняют заветно-исторический характер стиха; синтаксис второй части слегка развёрнут ради ясности по-русски.
