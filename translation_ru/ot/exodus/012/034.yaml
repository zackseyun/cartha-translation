translation_notes:
  register: 'Современный литературный русский с ясным, конкретным образом поспешного ухода. Синтаксис слегка перестроен ради естественности: повтор «они несли» делает однозначным, что на плечах находились увязанные сосуды. Маркер сноски поставлен непосредственно после слова, к которому относится лексическая альтернатива.'
