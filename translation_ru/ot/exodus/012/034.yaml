  yaml_path: translation/ot/exodus/012/034.yaml
  text: So the people carried their dough before it was leavened[a], with their kneading bowls bound up in their cloaks on their shoulders.
translation:
  language: ru
  text: Народ нёс своё тесто, ещё не успевшее закваситься, и сосуды для замешивания[a], завёрнутые в свои верхние одежды, на плечах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «квашни» — ёмкости, в которых замешивали тесто.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: понёс
  rationale: Глагол נשׂא здесь обозначает физическое несение вещей при уходе; «понёс» естественно передаёт начало движения в повествовательном контексте.
- source_word: הָעָם
  choice: народ
  rationale: עָם обозначает здесь израильский народ как единое целое.
- source_word: בְּצֵקוֹ
  choice: тесто
  rationale: Формально единственное число согласуется с собирательным «народ»; по-русски достаточно употребить существительное без притяжательного местоимения.
- source_word: טֶרֶם יֶחְמָץ
  choice: ещё не успевшее закваситься
  rationale: Передаёт временное значение טֶרֶם и то, что процесс заквашивания теста ещё не произошёл.
- source_word: מִשְׁאֲרֹתָם
  choice: сосуды для замешивания
  rationale: Еврейское слово обозначает ёмкости, использовавшиеся при приготовлении теста; описательный перевод понятен современному читателю и не конкретизирует без необходимости форму или материал.
- source_word: צְרֻרֹת
  choice: увязанные
  rationale: Страдательное причастие от צרר рисует предметы, связанные или собранные в узлы для переноски.
- source_word: בְּשִׂמְלֹתָם
  choice: в верхнюю одежду
  rationale: שִׂמְלָה обычно означает одежду, особенно наружную; единственное собирательное выражение естественно в русском контексте.
- source_word: עַל שִׁכְמָם
  choice: на плечах
  rationale: Передаёт способ переноски; множественное число естественно согласуется с собирательным субъектом.
