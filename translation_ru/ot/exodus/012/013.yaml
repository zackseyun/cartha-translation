base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/013.yaml
  text: And the blood shall be a sign for you on the houses where you are[a]. When I see the blood, I will pass over you[b], and no plague will be among you to destroy, when I strike the land of Egypt.
translation:
  language: ru
  text: И кровь будет для вас знаком на домах, в которых вы находитесь. Увидев кровь, Я пройду мимо вас[a], и не будет среди вас губительной язвы[b], когда Я поражу землю Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я пощажу вас» или «Я защищу вас».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и не будет среди вас язвы от губителя»; еврейское слово может пониматься как существительное «губитель».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה הַדָּם לָכֶם לְאֹת
  choice: И кровь будет для вас знаком
  rationale: Будущее «будет» передаёт результативно-обещательный смысл формы; «для вас знаком» естественно выражает לָכֶם לְאֹת и сохраняет роль крови как знака.
- source_word: עַל הַבָּתִּים אֲשֶׁר אַתֶּם שָׁם
  choice: на домах, в которых вы находитесь
  rationale: Сохраняется пространственное «на домах», а относительное предложение ясно указывает на дома, где находятся израильтяне.
- source_word: וְרָאִיתִי אֶת הַדָּם
  choice: Увидев кровь
  rationale: 'Деепричастная конструкция естественно передаёт временную последовательность: действие совершается при виде крови, без изменения субъекта.'
- source_word: וּפָסַחְתִּי עֲלֵכֶם
  choice: Я пройду мимо вас
  rationale: Передаёт основное пространственное значение פסח с עַל и сохраняет связь с названием Пасхи, не сводя неоднозначный глагол только к его следствию — пощаде или защите.
- source_word: וְלֹא יִהְיֶה בָכֶם נֶגֶף לְמַשְׁחִית
  choice: и не будет среди вас губительной язвы
  rationale: «Среди вас» естественно отражает בָכֶם; «губительная язва» передаёт נֶגֶף и результативно-целевой оттенок לְמַשְׁחִית, не вводя в основной текст отдельного личного губителя.
- source_word: בְּהַכֹּתִי בְּאֶרֶץ מִצְרָיִם
  choice: когда Я поражу землю Египта
  rationale: Временное придаточное точно и естественно передаёт инфинитивную конструкцию с ב; «поражу» соответствует контексту Божьего удара по Египту.
theological_decisions:
- issue: Значение וּפָסַחְתִּי עֲלֵכֶם при установлении Пасхи
  choice: Я пройду мимо вас
  alternative: Я пощажу вас; Я защищу вас
  rationale: Основной текст сохраняет образ действия и каноническую связь с Пасхой, а сноска отмечает возможные смысловые оттенки, не разрешая спорную лексическую деталь однозначно.
- issue: Является ли לְמַשְׁחִית указанием на действие уничтожения или на личного губителя
  choice: губительной язвы
  alternative: язвы от губителя; язвы для губителя
  rationale: Прилагательное выражает разрушительное действие язвы и не требует персонификации; допустимое субстантивное понимание формы сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимение «Я» при речи Бога написано с прописной буквы по устойчивой русской библейской традиции. «Язва» сохранена как понятное в библейском контексте обозначение поражающего бедствия; синтаксис сделан плавным и доступным.
