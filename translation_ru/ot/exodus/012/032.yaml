  text: גַּם צֹאנְ/כֶ֨ם גַּם בְּקַרְ/כֶ֥ם קְח֛וּ כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם וָ/לֵ֑כוּ וּ/בֵֽרַכְתֶּ֖ם גַּם אֹתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/032.yaml
  text: Take both your flocks and your herds[a], just as you have said, and go—and bless me also.
translation:
  language: ru
  text: Возьмите с собой и мелкий, и крупный ваш скот, как вы говорили, и уходите. Благословите и меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם צֹאנְכֶם גַּם בְּקַרְכֶם
  choice: и мелкий, и крупный скот ваш
  rationale: Повтор גַּם подчёркивает обе категории. צֹאן обозначает главным образом овец и коз, а בָּקָר — крупный рогатый скот; сочетание «и мелкий, и крупный скот» точно и естественно передаёт охват обеих групп.
- source_word: קְחוּ
  choice: Возьмите
  rationale: Прямой перевод повелительной формы множественного числа; в контексте подразумевается, что скот следует взять с собой.
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם
  choice: как вы говорили
  rationale: Фраза отсылает к ранее высказанному требованию Моисея и Аарона и сохраняет уступительный оттенок слов фараона.
- source_word: וָלֵכוּ
  choice: и уходите
  rationale: В данном контексте הלך означает покинуть Египет; «уходите» яснее передаёт направленность команды, чем нейтральное «идите».
- source_word: וּבֵרַכְתֶּם
  choice: И … благословите
  rationale: Форма от ברך прямо выражает просьбу о благословении; перевод не уточняет ни способ, ни предполагаемый источник благословения.
- source_word: גַּם אֹתִי
  choice: и меня
  rationale: גַּם добавляет самого фараона к тем, кого затрагивает исход; русское «и меня» естественно сохраняет присоединительный акцент. Возможное усилительное понимание «даже меня» не требуется контекстом и потому не вынесено в основной текст.
theological_decisions:
- issue: Характер просьбы фараона о благословении
  choice: 'Передать как прямую просьбу: «И меня благословите»'
  alternative: Уточнить как просьбу ходатайствовать перед Богом Израиля либо понять как обычное благопожелание при прощании
  rationale: Еврейский текст ясно говорит о благословении, но не поясняет, ожидает ли фараон Божьего благоволения через Моисея и Аарона или прощального благопожелания. Прямой перевод сохраняет эту неопределённость.
translation_notes:
  register: 'Современный литературный русский язык, краткий и повелительный синтаксис. Инверсия «скот ваш» придаёт фразе умеренно возвышенный библейский тон, оставаясь понятной современному читателю. Тире перед последней просьбой не добавлялось: разделение на два предложения ясно передаёт её особый акцент без избыточной драматизации.'
