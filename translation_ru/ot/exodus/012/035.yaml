  text: וּ/בְנֵי יִשְׂרָאֵ֥ל עָשׂ֖וּ כִּ/דְבַ֣ר מֹשֶׁ֑ה וַֽ/יִּשְׁאֲלוּ֙ מִ/מִּצְרַ֔יִם כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/035.yaml
  text: And the sons of Israel did according to the word of Moses[a], and they asked the Egyptians for articles of silver and articles of gold and clothing.
translation:
  language: ru
  text: Сыны Израиля поступили по слову Моисея и попросили у египтян серебряные и золотые вещи, а также одежду.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «запросили». Еврейский глагол обычно означает «просить» или «запрашивать», а не обязательно «брать взаймы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Сыны Израиля
  rationale: Сохраняет буквальный семейно-корпоративный образ еврейского выражения и при этом соответствует достойному литературному регистру.
- source_word: עָשׂוּ כִּדְבַר מֹשֶׁה
  choice: поступили по слову Моисея
  rationale: Естественно передаёт сочетание עשה с כדבר, сохраняя существительное «слово» и не усиливая его до явно выраженного «повеления».
- source_word: וַיִּשְׁאֲלוּ
  choice: попросили
  rationale: Основное значение שאל здесь — «просить, запрашивать»; перевод не привносит отсутствующего в самом глаголе значения «взять взаймы» или «ограбить».
- source_word: מִמִּצְרַיִם
  choice: у египтян
  rationale: Хотя форма буквально означает «из Египта», контекст указывает на людей, у которых просили предметы; по-русски личный объект естественно выражается оборотом «у египтян».
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: серебряные и золотые вещи
  rationale: Широкое слово כְּלִי не ограничивается сосудами или утварью; «вещи» сохраняет необходимую смысловую широту.
- source_word: וּשְׂמָלֹת
  choice: одежду
  rationale: Современный и широкий эквивалент для обозначения предметов одежды без неоправданного сужения до плащей или отдельных одежд.
theological_decisions:
- issue: Потенциально оценочный перевод וַיִּשְׁאֲלוּ в контексте исхода и обирания Египта
  choice: попросили
  alternative: взяли взаймы; выпросили; ограбили
  rationale: Основной текст сохраняет обычное лексическое значение глагола и не вносит моральной оценки или идеи обязательного возврата. Последующий итог повествования нельзя подставлять вместо значения данного глагола.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Выражение «Сыны Израиля» сохранено как осмысленный формальный образ; остальная фраза построена естественно для современного читателя.
