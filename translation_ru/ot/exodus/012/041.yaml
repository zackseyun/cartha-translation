base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/041.yaml
  text: And at the end of four hundred and thirty years[a], on that very day, all the hosts of Yahweh went out from the land of Egypt.
translation:
  language: ru
  text: И вот, по окончании четырёхсот тридцати лет, в тот самый день все воинства[a] Яхве вышли из земли Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «войска». Еврейское слово может обозначать организованные отряды или армии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: по окончании
  rationale: Сочетание מִן с קֵץ указывает на момент завершения периода; «по окончании» естественно передаёт временное значение.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: четырёхсот тридцати лет
  rationale: Русский порядок числительных естественно передаёт общую продолжительность в 430 лет.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: в тот самый день
  rationale: Оборот сохраняет усиление и указание на точное совпадение во времени, оставаясь естественным для современного русского повествования.
- source_word: יָצְאוּ
  choice: вышли
  rationale: Простое и прямое соответствие глаголу יצא, описывающее исход из Египта.
- source_word: כָּל צִבְאוֹת
  choice: все воинства
  rationale: «Воинства» сохраняет множественное число и значение организованных подразделений, не утверждая однозначно, что речь идёт о действующей армии.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из Египетской земли
  rationale: Перевод сохраняет явно присутствующее אֶרֶץ и передаёт географически-национальный смысл исхода.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Значение צִבְאוֹת יְהוָה
  choice: воинства Яхве
  alternative: войска Яхве; ополчения Яхве
  rationale: Выбрано слово с корпоративным и военно-организационным оттенком, но без чрезмерно узкого утверждения, будто израильтяне здесь изображены именно как сражающаяся армия.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Начальное «И вот» передаёт повествовательное וַיְהִי без тяжеловесной кальки «и было». Повтор וַיְהִי не воспроизведён буквально, но его повествовательно-эмфатическая функция выражена построением фразы и словами «в тот самый день».
