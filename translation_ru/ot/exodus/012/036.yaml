  naturalness: '«Расположил египтян к народу» — естественно для современного литературного русского. Однако в исходной конструкции два последовательных «они» имеют разных референтов: первое относится к египтянам, второе — к народу Израиля. В русском черновике второе «они» легко и первоначально читается как египтяне, поэтому субъект заключительного действия следует назвать явно.'
