base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/036.yaml
  text: And Yahweh gave the people favor in the eyes of the Egyptians[a], so that they let them have what they asked; and they plundered Egypt.
translation:
  language: ru
  text: И Яхве расположил египтян к народу[a], так что они дали им то, чего те просили; а израильтяне обобрали Египет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дал народу благоволение в глазах египтян». Далее возможно и традиционное понимание: «так что они дали им взаймы». Еврейский глагол здесь допускает понимание как предоставления просимого, так и предоставления взаймы.'
    reason: Сохраняет еврейскую идиому и отмечает реальную лексическую неоднозначность וַיַּשְׁאִלוּם.
lexical_decisions:
- source_word: וַֽיהוָה
  choice: И Яхве
  rationale: Передаёт личное имя Бога, явно присутствующее в еврейском тексте, без замены его титулом.
- source_word: נָתַן אֶת־חֵן הָעָם בְּעֵינֵי מִצְרַיִם
  choice: расположил египтян к народу
  rationale: Естественно по-русски передаёт еврейскую идиому «дал благоволение народа в глазах египтян», то есть вызвал у египтян благосклонное отношение к народу.
- source_word: וַיַּשְׁאִלוּם
  choice: они дали им то, чего те просили
  rationale: В данном контексте передаёт положительный отклик египтян на просьбы израильтян, не вводя непременно представление об обычном займе с возвратом.
- source_word: וַיְנַצְּלוּ
  choice: обобрали
  rationale: Передаёт сильное значение Piel от נצל — лишить имущества, ограбить или опустошить; при этом звучит понятно и естественно в современном русском языке.
- source_word: אֶת־מִצְרָיִם
  choice: Египет
  rationale: Сохраняет корпоративный объект исходного текста — страну Египет, а не только отдельных египтян.
theological_decisions:
- issue: Означает ли וַיַּשְׁאִלוּם выдачу просимого или предоставление взаймы
  choice: так что они дали им то, чего те просили
  alternative: так что они одолжили им
  rationale: Контекст подчёркивает благосклонный ответ египтян и последующее разорение Египта. Основной перевод не навязывает идею обычной ссуды, но традиционное и лексически возможное понимание сохранено в сноске.
- issue: Степень силы глагола וַיְנַצְּלוּ
  choice: обобрали Египет
  alternative: разорили Египет / ограбили Египет
  rationale: «Обобрали» сохраняет образ лишения ценностей и итоговый характер действия, не смягчая напряжение повествования.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным повествовательным строем. Еврейская идиома передана естественным русским выражением; неоднозначность спорного глагола вынесена в сноску.
