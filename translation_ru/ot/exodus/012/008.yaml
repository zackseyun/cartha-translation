lexical_decisions:
- source_word: וְאָכְלוּ
  choice: пусть они едят
  rationale: В контексте обрядового предписания форма передаёт повелительно-предписывающее значение; конструкция с «пусть» естественна для современного русского языка.
- source_word: הַבָּשָׂר
  choice: мясо
  rationale: В пищевом контексте это естественный современный эквивалент; «плоть» звучало бы неуместно.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: в эту ночь
  rationale: Буквально и естественно передаёт указание на конкретную ночь, о которой идёт речь.
- source_word: צְלִי אֵשׁ
  choice: испечённое на огне
  rationale: Передаёт способ приготовления посредством огня и сохраняет важное противопоставление варке в следующем стихе.
- source_word: וּמַצּוֹת
  choice: с пресным хлебом
  rationale: מַצּוֹת обозначает хлебные изделия без закваски; «пресный хлеб» — ясное и устойчивое русское соответствие.
- source_word: עַל
  choice: с
  rationale: В данном пищевом контексте предлог обозначает сопровождение, а не буквальное положение «на» чём-либо.
- source_word: מְרֹרִים
  choice: горькими травами
  rationale: Контекстуально точное и традиционно понятное обозначение горькой зелени, сопровождающей пасхальную трапезу.
- source_word: יֹאכְלֻהוּ
  choice: пусть едят его
  rationale: Повтор глагола с объектным суффиксом сохранён, чтобы передать структуру и усиление еврейского текста; местоимение относится к мясу.
