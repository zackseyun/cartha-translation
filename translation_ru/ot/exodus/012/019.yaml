id: EXO.12.19
reference: Exodus 12:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֔ים שְׂאֹ֕ר לֹ֥א יִמָּצֵ֖א בְּ/בָתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל מַחְמֶ֗צֶת וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל בַּ/גֵּ֖ר וּ/בְ/אֶזְרַ֥ח הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/019.yaml
  text: For seven days no leaven is to be found in your houses[a], for whoever eats anything leavened, that person shall be cut off from the congregation of Israel[c][b], whether a sojourner or a native of the land.
translation:
  language: ru
  text: Семь дней в ваших домах не должно быть закваски, потому что всякий, кто съест что-либо квасное, будет отсечён[a] от общины Израиля[c], будь то переселенец[b] или уроженец этой земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «та душа будет отсечена». В данном обороте «душа» означает человека, а выражение может подразумевать изгнание, смерть или Божий суд — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чужеземец, постоянно живущий среди израильтян».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «собрания» или «сообщества».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Семь дней
  rationale: Винительный времени указывает на продолжительность; краткая русская формулировка естественна и точно передаёт срок.
- source_word: שְׂאֹר
  choice: закваска
  rationale: Слово обозначает заквашивающее вещество, а не квасную пищу вообще; «закваска» точно и понятно передаёт различие с מַחְמֶצֶת.
- source_word: לֹא יִמָּצֵא
  choice: не должно находиться
  rationale: Нифаль глагола מצא описывает запрещённое наличие; эта формулировка сохраняет образ «не быть найденным», оставаясь естественной по-русски.
- source_word: בְּבָתֵּיכֶם
  choice: в ваших домах
  rationale: Сохранено прямое значение множественного числа и обращение ко всему народу.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание предшествующего запрета.
- source_word: כָּל אֹכֵל
  choice: всякий, кто съест
  rationale: Сочетание כָּל с причастием имеет обобщающее значение; совершенный вид по-русски естественно выражает нарушение запрета как действие.
- source_word: מַחְמֶצֶת
  choice: что-либо квасное
  rationale: Обозначение шире, чем один только хлеб, поэтому перевод не сужает запрет до квасного хлеба.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: тот человек будет отсечён
  rationale: נֶפֶשׁ здесь означает самого человека. «Будет отсечён» сохраняет образ и неопределённость заветной санкции, не уточняя без достаточного основания её способ.
- source_word: מֵעֲדַת יִשְׂרָאֵל
  choice: от общины Израиля
  rationale: עֵדָה обозначает собранное сообщество народа; «община» передаёт коллективный и заветный смысл без узкоконфессиональной окраски.
- source_word: בַּגֵּר
  choice: переселенец
  rationale: גֵּר — некоренной человек, постоянно живущий среди народа; «переселенец» достаточно ясно передаёт статус и избегает архаичного «пришелец».
- source_word: וּבְאֶזְרַח הָאָרֶץ
  choice: коренной житель страны
  rationale: Формулировка сохраняет противопоставление переселенцу и не привносит современного юридического понятия гражданства.
theological_decisions:
- issue: Значение заветной санкции כרת («отсечь»)
  choice: Сохранить выражение «будет отсечён», не уточняя способ наказания.
  alternative: «будет предан смерти» или «будет исключён из общины»
  rationale: В данном обороте возможны значения смерти, удаления из сообщества или Божьего суда. Исходный текст не разрешает эту напряжённость однозначно, поэтому перевод её сохраняет.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Различие между «закваской» и «квасным» сохранено; архаизмы и современные политико-правовые категории по возможности исключены. Маркеры примечаний размещены при соответствующих словам, а не воспроизводят ошибочное расположение маркеров в консультационном английском слое.
