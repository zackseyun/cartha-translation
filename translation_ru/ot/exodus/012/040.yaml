  yaml_path: translation/ot/exodus/012/040.yaml
  text: The dwelling of the sons of Israel[a], who lived in Egypt, was four hundred thirty years.
translation:
  language: ru
  text: Пребывание сынов Израиля[a] в Египте продолжалось четыреста тридцать лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых древних свидетелях: «Пребывание сынов Израиля и их отцов в Египте и в Ханаане продолжалось четыреста тридцать лет».'
    reason: textual_variant
lexical_decisions:
- source_word: מוֹשַׁב
  choice: пребывание
  rationale: Существительное обозначает проживание или период проживания. «Пребывание» сохраняет его предметное значение, а глагол «продолжалось» естественно выражает длительность.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально передаёт традиционное заветное наименование и остаётся понятным в современном литературном русском языке.
- source_word: אֲשֶׁר יָשְׁבוּ בְּמִצְרָיִם
  choice: в Египте
  rationale: Относительная конструкция буквально говорит о пребывании, которым они пребывали в Египте. По-русски это значение естественно включается в сочетание «пребывание … в Египте», без тяжеловесного повтора.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: четыреста тридцать лет
  rationale: Порядок компонентов числа приведён в соответствие с нормой русского языка при полном сохранении указанной продолжительности.
theological_decisions:
- issue: Относится ли период в 430 лет только к пребыванию в Египте или также к пребыванию праотцов в Ханаане
  choice: Основной текст следует масоретскому тексту WLC и относит пребывание к Египту.
  alternative: Некоторые древние свидетели добавляют отцов и Ханаан, тем самым расширяя хронологические рамки.
  rationale: Предоставленный еврейский источник прямо называет Египет. Существенный древний вариант не вносится в основной текст, но приводится в сноске, чтобы сохранить текстологическую и хронологическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Сыны Израиля» сохраняет традиционную формулу; синтаксис упрощён ради ясности без изменения смысла.
