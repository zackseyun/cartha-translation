  text: Животное из мелкого скота[a] у вас должно быть без порока, самцом первого года; берите его из овец или из коз.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское שֶׂה обозначает отдельное животное из мелкого скота — ягнёнка или козлёнка; далее прямо сказано, что его берут из овец или из коз.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂה
  choice: животное из мелкого скота
  rationale: Слово обозначает отдельное животное из мелкого скота — ягнёнка или козлёнка. Такое выражение точно сохраняет широту еврейского слова и согласуется с последующим уточнением об овцах и козах.
- source_word: תָמִים
  choice: без порока
  rationale: В контексте жертвенного животного слово указывает на отсутствие физического изъяна; это традиционное, ясное и точное русское выражение.
- source_word: זָכָר
  choice: самец
  rationale: Прямое обозначение пола животного, естественное для современного русского языка.
- source_word: בֶּן שָׁנָה
  choice: первого года
  rationale: Еврейское выражение буквально означает «сын года» и, вероятнее всего, указывает на животное, которому ещё не исполнился год. «Первого года» сохраняет эту возрастную формулировку точнее, чем «годовалый».
- source_word: יִהְיֶה לָכֶם
  choice: пусть у вас будет
  rationale: Передаёт предписывающую силу формы и сохраняет значение дательного לָכֶם без тяжеловесности.
- source_word: מִן הַכְּבָשִׂים וּמִן הָעִזִּים
  choice: из овец или из коз
  rationale: Названы две допустимые группы животных. Русское «или» естественно выражает выбор одной из них, хотя в еврейском тексте стоит обычный союз «и».
- source_word: תִּקָּחוּ
  choice: берите его
  rationale: Форма выражает предписание во втором лице множественного числа. Императив «берите» передаёт его яснее, чем разрешительное «можете взять»; местоимение добавлено по смыслу.
