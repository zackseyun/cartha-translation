  text: אַל תֹּאכְל֤וּ מִמֶּ֨/נּוּ֙ נָ֔א וּ/בָשֵׁ֥ל מְבֻשָּׁ֖ל בַּ/מָּ֑יִם כִּ֣י אִם צְלִי אֵ֔שׁ רֹאשׁ֥/וֹ עַל כְּרָעָ֖י/ו וְ/עַל קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/009.yaml
  text: Do not eat any of it raw or boiled in water[a], but only roasted over the fire, with its head, its legs, and its inner parts.
translation:
  language: ru
  text: Не ешьте его сырым[a] или варённым в воде, а только жаренным на огне — с головой, ногами и внутренностями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не до конца приготовленным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָא
  choice: сырым
  rationale: В данном кулинарном контексте слово обозначает мясо, не приготовленное должным образом огнём или варкой. «Сырым» — ясный и обычный русский эквивалент; возможное значение «недожаренным» сохранено в сноске.
- source_word: וּבָשֵׁל מְבֻשָּׁל בַּמָּיִם
  choice: или сваренным в воде
  rationale: Сочетание форм корня בשל с уточнением «в воде» указывает именно на варку; русский перевод естественно передаёт конкретный запрещённый способ приготовления.
- source_word: כִּי אִם
  choice: но только
  rationale: Оборот выражает сильное противопоставление и исключительность предписанного способа приготовления.
- source_word: צְלִי אֵשׁ
  choice: зажаренным на огне
  rationale: Передаёт приготовление посредством непосредственного жара огня и звучит естественно в современном русском языке.
- source_word: רֹאשׁוֹ עַל־כְּרָעָיו וְעַל־קִרְבּוֹ
  choice: вместе с головой, ногами и внутренностями
  rationale: Повторяющийся предлог עַל в данном перечислении имеет присоединительное значение. Формулировка показывает, что животное следует жарить целиком, включая названные части.
- source_word: מִמֶּנּוּ
  choice: его
  rationale: Русское «не ешьте его» естественно передаёт партитивный смысл контекста, не требуя буквального и тяжеловесного «от него».
