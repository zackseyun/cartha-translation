  yaml_path: translation/ot/exodus/012/028.yaml
  text: Then the sons of Israel went and did so; just as Yahweh had commanded Moses and Aaron[a], so they did.
translation:
  language: ru
  text: И пошли сыны Израиля[a] и сделали так, как Яхве повелел Моисею и Аарону; так они и сделали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно: «израильтяне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: пошли
  rationale: Форма от הלך последовательно продвигает повествование. «Пошли» естественно передаёт действие, не добавляя прямо не выраженной цели.
- source_word: וַיַּעֲשׂוּ
  choice: сделали
  rationale: Форма от עשה отсылает к ранее данным предписаниям. В русском контексте дополнение можно не повторять, сохраняя лаконичность оригинала.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально передаёт мужское родственное выражение «сыновья/сыны Израиля» и сохраняет библейское обозначение народа; более идиоматичный вариант указан в сноске.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Выражает соответствие действий повелению. Русское «как» естественно и достаточно ясно передаёт точное следование приказу.
- source_word: צִוָּה
  choice: повелел
  rationale: Совершенный вид естественно показывает, что повеление предшествовало исполнению; «повелел» соответствует торжественному, но понятному регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶת מֹשֶׁה וְאַהֲרֹן
  choice: Моисею и Аарону
  rationale: Хотя אֶת формально отмечает прямое дополнение, русское управление глагола «повелеть» требует дательного падежа; лица, получившие повеление, остаются теми же.
- source_word: כֵּן עָשׂוּ
  choice: так они и сделали
  rationale: Сохраняет итоговое повторение и подчёркивает полное соответствие исполнения повелению.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Основной текст сохраняет родственное и грамматически мужское выражение оригинала, а более обычный современный эквивалент дан в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской окраской. Повтор «сделали… так они и сделали» намеренно сохранён как риторическое подчёркивание точного послушания. Маркер сноски помещён после предложения, к которому относится лексическая альтернатива.
