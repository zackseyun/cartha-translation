  source_fidelity: 'Смысл и синтаксические связи переданы верно: בני ישראל — «сыны Израиля», Яхве является субъектом повеления, а Моисей и Аарон — адресатами; заключительное «так они и сделали» оправданно сохраняет усилительное повторение כֵּן עָשׂוּ. Однако в исходной пунктуации «и сделали: как…» глагол «сделали» остаётся неестественно непереходным и связь с последующим «как» оформлена неудачно.'
