source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן זֹ֖את חֻקַּ֣ת הַ/פָּ֑סַח כָּל בֶּן נֵכָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/043.yaml
  text: 'And Yahweh said to Moses and Aaron[a], “This is the statute of the Passover: no foreigner may eat of it.”'
translation:
  language: ru
  text: 'И сказал Яхве Моисею и Аарону: «Вот установление о Пасхе: никакой чужеземец[a] не должен есть её».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сын чужбины»; то есть чужеземец.'
    reason: Сохраняет сведения о еврейской идиоме, не перегружая основной текст и не добавляя в него более узкое толкование.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Обычная повествовательная форма глагола אמר естественно передаётся русским «сказал»; союз сохраняет связь с предшествующим повествованием.
- source_word: זֹאת חֻקַּת הַפָּסַח
  choice: Вот установление о Пасхе
  rationale: «Вот» естественно вводит предписание, а «установление» сохраняет нормативно-правовой оттенок חֻקָּה. Оборот «о Пасхе» допускает значение как обряда, так и пасхальной жертвы/трапезы.
- source_word: כָּל בֶּן נֵכָר
  choice: никакой чужеземец
  rationale: При последующем отрицании כָּל естественно передаётся как «никакой». Идиома בֶּן נֵכָר обозначает чужеземца, но не разворачивается в тексте в более узкую богословскую категорию.
- source_word: לֹא יֹאכַל בּוֹ
  choice: не должен есть её
  rationale: В правовом контексте «не должен» ясно выражает запрет. Местоимение согласовано с русским словом «Пасха» и означает участие в пасхальной пище.
theological_decisions:
- issue: Кого исключает данное предписание
  choice: «чужеземец» без добавления «необрезанный» или пояснения о заветном статусе в основном тексте
  alternative: «чужеземец, не принадлежащий к общине завета»
  rationale: Само выражение בֶּן נֵכָר означает чужеземца; ближайший контекст далее уточняет условия участия, но их не следует преждевременно вносить в этот стих.
- issue: Значение הַפָּסַח
  choice: «Пасха» с сохранением широты обозначения
  alternative: «пасхальная жертва» или «пасхальная трапеза»
  rationale: В контексте речь идёт о том, что Пасху едят, однако существительное может обозначать пасхальное установление и жертву; более узкий вариант снял бы подлинную смысловую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательно-правового регистра. «Установление» сохраняет официальный оттенок без архаизации; «чужеземец» точнее и стилистически уместнее, чем разговорное «иностранец» или устаревающее «иноплеменник».
