  yaml_path: translation/ot/exodus/012/038.yaml
  text: A mixed multitude also went up with them[a], and flocks and herds—a very great amount of livestock.
translation:
  language: ru
  text: С ними вышло и множество самого разного люда[a], и мелкий и крупный скот — в огромном количестве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многочисленная смешанная толпа». Еврейское выражение עֵרֶב רַב обозначает неоднородную группу людей, присоединившуюся к Израилю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/גַם
  choice: и
  rationale: В сочетании с порядком слов передаёт добавочное значение «также», не перегружая русскую фразу повтором наречия.
- source_word: עֵרֶב רַב
  choice: множество самого разного люда
  rationale: Передаёт и многочисленность, выраженную רַב, и неоднородный состав группы, не сводя его непременно к этническому происхождению.
- source_word: עָלָה
  choice: вышло
  rationale: В контексте исхода глагол обозначает выступление в путь; русское «вышло» естественно передаёт движение из Египта, тогда как буквальное «поднялось» здесь звучало бы неестественно.
- source_word: אִתָּם
  choice: с ними
  rationale: Прямо передаёт совместность и сохраняет отсылку к израильтянам из ближайшего контекста.
- source_word: וְ/צֹאן וּ/בָקָר
  choice: и мелкий и крупный скот
  rationale: צֹאן — собирательное обозначение овец и коз, а בָקָר — крупного рогатого скота; традиционная русская пара точно и ясно сохраняет различие.
- source_word: מִקְנֶה
  choice: скот
  rationale: Общее собирательное наименование домашних стад; в русском тексте оно естественно соотносится с уже названными мелким и крупным скотом.
- source_word: כָּבֵד מְאֹד
  choice: в огромном количестве
  rationale: Буквально «очень тяжёлый», но применительно к скоту сочетание идиоматически выражает исключительную многочисленность.
