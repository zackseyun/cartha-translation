  yaml_path: translation/ot/exodus/012/010.yaml
  text: You shall not leave any of it until morning[a], and what remains of it until morning you shall burn with fire.
translation:
  language: ru
  text: Не оставляйте от него ничего до утра; а то, что останется от него до утра, сожгите в огне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תוֹתִירוּ
  choice: не оставляйте
  rationale: Порода hифиль глагола יתר здесь означает «оставлять, сохранять остаток»; отрицательный имперфект выражает прямой запрет.
- source_word: מִמֶּנּוּ
  choice: от него ничего / от него
  rationale: Предлог מן с местоименным суффиксом естественно передаётся как «от него»; в первом предложении «ничего» явно выражает подразумеваемое отрицанием отсутствие остатка.
- source_word: עַד בֹּקֶר
  choice: до утра
  rationale: Оборот обозначает временной предел и естественно передаётся по-русски как «до утра».
- source_word: הַנֹּתָר
  choice: то, что останется
  rationale: Субстантивированное причастие нифаля от יתר обозначает оставшуюся часть; придаточная конструкция звучит ясно и современно.
- source_word: בָּאֵשׁ
  choice: в огне
  rationale: Предлог ב при אֵשׁ допускает значение средства или среды; с русским «сжечь» сочетание «в огне» естественно и сохраняет образ исходного текста.
- source_word: תִּשְׂרֹפוּ
  choice: сожгите
  rationale: Имперфект в контексте предписания имеет повелительную силу; совершенный вид точно выражает требование полностью уничтожить остаток огнём.
theological_decisions:
- issue: Характер предписания об остатках пасхальной жертвы
  choice: Прямой запрет оставлять мясо до утра, за которым следует обязательное предписание сжечь остаток
  alternative: Практический совет, не имеющий обязательной силы
  rationale: Грамматические формы и контекст ритуальных установлений выражают обязательные повеления. Перевод не добавляет символического толкования, которого нет в самом стихе.
translation_notes:
  register: Современный литературный русский язык; форма множественного числа сохраняет обращение к общине. Формулировка dignified and direct, без архаического «да не оставляйте» и без лишних пояснений.
