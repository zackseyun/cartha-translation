  source_fidelity: 'Текст точно передаёт обе директивы еврейского оригинала: запрет оставлять какую-либо часть до утра и предписание сжечь огнём то, что останется к утру. Повтор «от него» и «до утра» отражает повтор в исходном тексте, не добавляя толкования.'
  naturalness: Формулировка естественна для современного литературного русского и сохраняет ясный предписывающий тон. «Сожгите в огне» несколько тавтологично в современном употреблении, однако это оправдано явным בָּאֵשׁ («в/огнём») оригинала и звучит нормально в ритуально-правовом контексте.
  terminology: «Не оставляйте», «то, что останется» и «сожгите в огне» адекватно передают соответственно хифиль, нифальное причастие и предписывающий имперфект. Специальные богословские термины в стихе отсутствуют; конфессионально окрашенные интерпретации не вносятся.
