base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/051.yaml
  text: And on that very day[b][a], Yahweh brought the sons of Israel out from the land of Egypt according to their divisions.
translation:
  language: ru
  text: И в тот самый день Яхве вывел сынов Израиля[a] из земли Египта по их отрядам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «детей Израиля», или «израильтян». Буквально по-еврейски: «сынов Израиля»; это родственно-корпоративное обозначение всего народа.'
    reason: lexical_alternative
  - marker: b
    text: Или «по их воинствам», «по их ополчениям». Еврейское выражение может подчёркивать, что израильтяне вышли организованными группами.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И
  rationale: Последовательная конструкция с היה вводит итоговое повествовательное сообщение. В современном русском её функцию естественно передаёт союз «И», без архаического «и было».
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: в тот самый день
  rationale: Оборот подчёркивает точное совпадение во времени; «тот самый день» сохраняет усиление и соответствует ретроспективной перспективе повествования.
- source_word: הוֹצִיא
  choice: вывел
  rationale: 'Порода хифиль глагола יצא имеет каузативное значение: «вывести». Русский глагол точно и естественно передаёт действие, не уточняя способ передвижения.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранено буквальное родственно-корпоративное обозначение. В данном контексте оно относится к народу Израиля в целом.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египта
  rationale: Сохранено существительное אֶרֶץ «земля, страна» и выражено движение из Египта.
- source_word: עַל צִבְאֹתָם
  choice: по их отрядам
  rationale: צָבָא может обозначать войско, ополчение или организованную группу. «По их отрядам» передаёт упорядоченность выхода, не утверждая однозначно, что речь идёт о боевых подразделениях.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Корпоративное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: дети Израиля; израильтяне
  rationale: Форма «сыны Израиля» сохраняет родственную образность исходного выражения, при этом в стихе обозначая весь народ, а не только мужчин.
- issue: Характер групп צִבְאֹת
  choice: отряды
  alternative: воинства; ополчения; подразделения
  rationale: Контекст допускает военную окраску, но не требует понимания этих групп как боевых частей. Выбранное слово сохраняет представление об организованном порядке выхода.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и естественный; избегаются как церковнославянизмы, так и излишне административная лексика. Все примечания отмечены в основном тексте.
