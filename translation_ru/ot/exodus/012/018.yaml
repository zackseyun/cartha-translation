base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/018.yaml
  text: In the first month[a], on the fourteenth day of the month at evening, you shall eat unleavened bread, until the twenty-first day of the month at evening.
translation:
  language: ru
  text: В первом месяце, с вечера четырнадцатого дня месяца до вечера двадцать первого дня месяца ешьте пресный хлеб.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вечером» в обоих случаях.'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: בָּרִאשֹׁן
  choice: В первом месяце
  rationale: Хотя буквально сказано «в первом», подразумеваемое слово «месяце» ясно из последующей календарной формулы и необходимо для естественного русского языка.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: в четырнадцатый день
  rationale: Еврейское обозначение даты посредством количественного числительного естественно передаётся русским порядковым числительным.
- source_word: לַחֹדֶשׁ
  choice: месяца
  rationale: В формуле даты חֹדֶשׁ означает месяц, а не новолуние.
- source_word: בָּעֶרֶב / בָּעָרֶב
  choice: с вечера / до вечера
  rationale: Одинаковое еврейское выражение обозначает вечерние границы установленного периода. Русские предлоги «с» и «до» естественно показывают начальную и конечную границы, не уточняя точного момента внутри вечера.
- source_word: תֹּאכְלוּ
  choice: ешьте
  rationale: Имперфект в законодательном контексте имеет предписывающую силу; русский повелительный оборот кратко и ясно передаёт это предписание, обращённое к множеству людей.
- source_word: מַצֹּת
  choice: пресный хлеб
  rationale: Термин обозначает хлеб без закваски; «пресный хлеб» — ясное и устоявшееся русское соответствие.
- source_word: עַד
  choice: до
  rationale: Предлог обозначает конечную временную границу периода.
- source_word: יוֹם הָאֶחָד וְעֶשְׂרִים
  choice: двадцать первого дня
  rationale: Еврейская конструкция со значением «двадцать первый» естественно передаётся русским порядковым числительным.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной календарной формулировкой и умеренно торжественным библейским регистром. Формы «с вечера» и «до вечера» подчёркивают границы срока, сохраняя допустимое понимание בָּעֶרֶב как «вечером» в сноске.
