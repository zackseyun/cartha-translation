  yaml_path: translation/ot/exodus/012/044.yaml
  text: But every man's servant[a], bought with silver—when you have circumcised him[b], then he may eat of it.
translation:
  language: ru
  text: Но всякий раб, купленный человеком за серебро[a], после того как ты обрежешь его[b], может есть от пасхальной жертвы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть купленный за деньги.
    reason: lexical_alternative
  - marker: b
    text: Раб мог участвовать в пасхальной трапезе только после обрезания.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כָל
  choice: А всякий
  rationale: Союз связывает предписание с предыдущим стихом, а «всякий» передаёт распределительное значение כָּל.
- source_word: עֶבֶד אִישׁ
  choice: раб, которого кто-либо купил
  rationale: עֶבֶד в контексте покупки обозначает человека в рабском состоянии; אִישׁ указывает на отдельного владельца, что естественно передано неопределённым «кто-либо».
- source_word: מִקְנַת כָּסֶף
  choice: купил за серебро
  rationale: Оборот обозначает приобретение за серебро, то есть за деньги; сохранён конкретный образ исходного текста.
- source_word: וּ/מַלְתָּה אֹתוֹ
  choice: после того как ты обрежешь его
  rationale: Форма выражает действие, которое должно предшествовать допуску к пасхальной трапезе; сохранено обращение во втором лице единственного числа.
- source_word: אָז יֹאכַל בּוֹ
  choice: он может есть её
  rationale: אָז задаёт следствие после обрезания, а имперфект в данном правовом контексте выражает разрешение. Местоимение относится к Пасхе, упомянутой в контексте.
theological_decisions:
- issue: Передача обозначения раба в правовом и заветном контексте
  choice: раб
  alternative: слуга
  rationale: Прямое упоминание покупки за серебро делает несвободный и принадлежащий владельцу статус смыслообразующим; «слуга» неоправданно смягчило бы социальную реальность текста.
- issue: Условие участия в пасхальной трапезе
  choice: после того как ты обрежешь его, он может есть её
  alternative: и обрежешь его, тогда он будет есть её
  rationale: Последовательность формулирует обрезание как предварительное условие допуска, не утверждая, что после него участие обязательно.
translation_notes:
  register: Современный литературный русский язык с ясной правовой формулировкой. Слово «раб» сохранено без эвфемизма; синтаксис сделан естественным для современного читателя, а образ покупки «за серебро» оставлен в основном тексте.
