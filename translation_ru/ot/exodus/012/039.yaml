  source_fidelity: 'В целом перевод точно передаёт: выпечку теста, вынесенного из Египта; пресные лепёшки; отсутствие заквашивания; насильственное изгнание; невозможность медлить; отсутствие заранее приготовленных припасов. Однако в нынешней русской цепочке «не могли медлить и не приготовили» второй союз может прочитываться как следствие невозможности медлить, тогда как וְגַם вводит самостоятельное дополнительное обстоятельство.'
