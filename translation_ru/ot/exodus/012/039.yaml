base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/039.yaml
  text: 'They baked the dough they had brought out of Egypt into unleavened cakes, since it had not become leavened: they had been driven out of Egypt and could not delay, and had not prepared provisions for themselves.'
translation:
  language: ru
  text: 'Из теста, которое они вынесли из Египта, они испекли пресные лепёшки, потому что оно не заквасилось: их изгнали из Египта, и они не могли медлить; кроме того, они не приготовили себе припасов.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאפוּ
  choice: они испекли
  rationale: Обычный современный глагол точно передаёт повествовательную форму; начальный союз в отдельном русском стихе необязателен.
- source_word: הַבָּצֵק
  choice: тесто
  rationale: Прямое и естественное соответствие существительному בצק.
- source_word: אֲשֶׁר הוֹצִיאוּ מִמִּצְרַיִם
  choice: которое они вынесли из Египта
  rationale: Относительное придаточное прямо определяет тесто и сохраняет исходный смысл движения из Египта.
- source_word: עֻגֹת מַצּוֹת
  choice: пресные лепёшки
  rationale: עֻגֹת обозначает лепёшки или круглые хлебы, а מַצּוֹת указывает, что они были пресными; сочетание понятно современному читателю и не вызывает ассоциации с кондитерскими изделиями.
- source_word: כִּי לֹא חָמֵץ
  choice: потому что оно не заквасилось
  rationale: Глагольная форма описывает то, что тесто не перешло в заквашенное состояние; перевод сохраняет эту динамику.
- source_word: כִּי גֹרְשׁוּ מִמִּצְרַיִם
  choice: их изгнали из Египта
  rationale: Пассивная конструкция передаёт принудительное удаление, а «изгнали» сохраняет силу исходного глагола.
- source_word: וְלֹא יָכְלוּ לְהִתְמַהְמֵהַּ
  choice: и они не могли медлить
  rationale: Современное и точное выражение отсутствия возможности задерживаться.
- source_word: צֵדָה
  choice: припасов
  rationale: Слово охватывает приготовленную в дорогу пищу и иные необходимые запасы; «припасы» уместно в данном повествовательном контексте.
- source_word: לָהֶם
  choice: себе
  rationale: Возвратное местоимение естественно передаёт значение «для самих себя».
