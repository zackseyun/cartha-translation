  text: וַ/אֲמַרְתֶּ֡ם זֶֽבַח פֶּ֨סַח ה֜וּא לַֽ/יהוָ֗ה אֲשֶׁ֣ר פָּ֠סַח עַל בָּתֵּ֤י בְנֵֽי יִשְׂרָאֵל֙ בְּ/מִצְרַ֔יִם בְּ/נָגְפּ֥/וֹ אֶת מִצְרַ֖יִם וְ/אֶת בָּתֵּ֣י/נוּ הִצִּ֑יל וַ/יִּקֹּ֥ד הָ/עָ֖ם וַ/יִּֽשְׁתַּחֲוּֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/027.yaml
  text: you shall say[a], ‘It is the Passover sacrifice to Yahweh[c][b], who passed over the houses of the sons of Israel in Egypt when he struck Egypt and delivered our houses.’ And the people bowed down and worshiped.
translation:
  language: ru
  text: 'И скажите: «Это пасхальная жертва, посвящённая Яхве[a], который минул[b] дома сынов Израиля[c] в Египте, когда поразил Египет, а наши дома избавил». И народ склонился, и они поклонились.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «жертва Песаха»; то есть жертва, приносимая в связи с Песахом.'
    reason: lexical_alternative
  - marker: b
    text: Глагол «минул» образован в еврейском от того же корня, что и «Песах»; в данном контексте он может также подразумевать, что Яхве пощадил или защитил эти дома.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «дома израильтян»; буквально: «дома сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח פֶּסַח
  choice: пасхальная жертва
  rationale: Передаёт сочетание как жертву, связанную с Песахом, сохраняя культовый смысл и естественно звуча по-русски.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל выражает посвящение жертвы Яхве; формулировка «жертва Яхве» естественно передаёт принадлежность и посвящение.
- source_word: פָּסַח
  choice: миновал
  rationale: Сохраняет основное пространственное значение и связь с названием Песаха; защитный оттенок отмечен в сноске и раскрывается дальнейшим «избавил».
- source_word: בָּתֵּי בְנֵי יִשְׂרָאֵל
  choice: дома сынов Израиля
  rationale: Сохраняет семейно-заветную формулу исходного текста; более естественное «дома израильтян» дано как допустимый смысл в сноске.
- source_word: בְּנָגְפּוֹ אֶת מִצְרַיִם
  choice: когда поражал Египет
  rationale: Конструкция с בְּ передаёт одновременное временное обстоятельство, а נָגַף — нанесение поражения или кары без неоправданного сужения до конкретной язвы.
- source_word: הִצִּיל
  choice: избавил
  rationale: Передаёт спасение от грозящей гибели точнее, чем одно лишь «пощадил», и сохраняет контраст с поражением Египта.
- source_word: וַיִּקֹּד
  choice: низко склонился
  rationale: Передаёт телесное склонение в почтении и отличает его от следующего глагола.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: поклонился
  rationale: Передаёт благоговейное поклонение; вместе с предыдущим глаголом сохраняет последовательность двух действий.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя и не заменяет его титулом.
- issue: Значение פָּסַח
  choice: миновал
  alternative: пощадил / защитил
  rationale: Контекст допускает защитный оттенок, но «миновал» сохраняет связь глагола с названием Песаха и не устраняет лексическую многозначность.
- issue: Выражение בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Более буквальная формула сохраняет родовой и заветный образ исходного текста, не исключая того, что в контексте речь идёт о народе Израиля.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Синтаксис следует движению еврейского текста, но остаётся естественным; два заключительных глагола сохранены раздельно, чтобы не сгладить последовательность почтительных действий.
