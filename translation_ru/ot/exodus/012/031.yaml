  text: וַ/יִּקְרָא֩ לְ/מֹשֶׁ֨ה וּֽ/לְ/אַהֲרֹ֜ן לַ֗יְלָה וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִ/תּ֣וֹךְ עַמִּ֔/י גַּם אַתֶּ֖ם גַּם בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/לְכ֛וּ עִבְד֥וּ אֶת יְהוָ֖ה כְּ/דַבֶּרְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/031.yaml
  text: Then he called for Moses and Aaron by night and said[a], “Rise up, go out from among my people, both you and the sons of Israel, and go, serve Yahweh[b], as you have said.”
translation:
  language: ru
  text: 'Ночью он позвал Моисея и Аарона и сказал: «Встаньте, выйдите из среды моего народа — и вы, и сыны Израиля. Идите и служите Яхве, как вы говорили».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: позвал
  rationale: В сочетании с לְ глагол обозначает обращённый к кому-либо срочный вызов. «Позвал» естественно по-русски и не добавляет официального оттенка слова «призвал».
- source_word: לַיְלָה
  choice: ночью
  rationale: Форма употреблена как обстоятельство времени; краткое «ночью» точно и естественно передаёт её значение.
- source_word: קוּמוּ צְּאוּ
  choice: встаньте, выйдите
  rationale: Сохранена последовательность двух повелений и их срочный характер; «выйдите» также удерживает пространственный смысл исходного יצא.
- source_word: מִתּוֹךְ עַמִּי
  choice: из среды моего народа
  rationale: Передаёт буквальный образ удаления изнутри египетского народа, оставаясь понятным в современном русском языке.
- source_word: גַּם אַתֶּם גַּם בְּנֵי יִשְׂרָאֵל
  choice: и вы, и сыны Израиля
  rationale: Парная конструкция «и… и…» сохраняет повтор גַּם и подчёркнутое включение как Моисея с Аароном, так и всего Израиля. «Сыны Израиля» передаёт устойчивое родовое обозначение исходного текста.
- source_word: עִבְדוּ
  choice: служите
  rationale: «Служите» сохраняет широкий смысл עבד применительно к Богу, включающий поклонение, но не ограниченный только обрядовым действием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: כְּדַבֶּרְכֶם
  choice: как вы говорили
  rationale: Фраза указывает на согласие с ранее высказанным требованием Моисея и Аарона. Несовершенный вид естественен для русского пересказа их повторявшейся просьбы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Значение עבד по отношению к Богу
  choice: служите
  alternative: поклоняйтесь
  rationale: Исходное слово охватывает как культовое поклонение, так и более широкое служение. Выбор «служите» не сужает эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Повеления переданы кратко и энергично. Местоименное «он» сохранено без добавления имени фараона, поскольку в данном стихе субъект выражен только глагольной формой и определяется ближайшим контекстом. Ошибочно соотнесённые маркеры примечаний в английском консультационном слое не перенесены.
