  text: וּ/בַ/יּ֤וֹם הָ/רִאשׁוֹן֙ מִקְרָא קֹ֔דֶשׁ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלָאכָה֙ לֹא יֵעָשֶׂ֣ה בָ/הֶ֔ם אַ֚ךְ אֲשֶׁ֣ר יֵאָכֵ֣ל לְ/כָל נֶ֔פֶשׁ ה֥וּא לְ/בַדּ֖/וֹ יֵעָשֶׂ֥ה לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/016.yaml
  text: On the first day there shall be a holy assembly for you[a], and on the seventh day a holy assembly. No work shall be done on them[c][b], except what every person must eat—that alone may be prepared for you.
translation:
  language: ru
  text: В первый день пусть будет у вас священное собрание[a], и в седьмой день — священное собрание. Никакой работы нельзя делать в эти дни; только то, что нужно для еды каждому человеку[b], — лишь это можно приготовить для вас[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «святое собрание»; традиционно также: «священное созывание».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для всякой нефеш». Здесь еврейское נֶפֶשׁ означает человека, а не «душу» в современном смысле.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «лишь это пусть будет сделано для вас». По контексту имеется в виду приготовление пищи как единственное исключение из запрета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרָא קֹדֶשׁ
  choice: священное собрание
  rationale: Сочетание обозначает созванное собрание, посвящённое Богу. «Священное собрание» естественно для современного русского языка и передаёт оба элемента выражения.
- source_word: יִהְיֶה לָכֶם
  choice: пусть будет у вас
  rationale: Передаёт значение היה с адресатным לָכֶם и звучит естественно как предписание, не превращая его в прямую команду «соберитесь».
- source_word: כָּל מְלָאכָה לֹא יֵעָשֶׂה בָהֶם
  choice: никакой работы нельзя делать в эти дни
  rationale: «Никакой работы» естественно передаёт сочетание כָּל с отрицанием; безличная конструкция сохраняет общий запрет, а «в эти дни» ясно раскрывает временное значение местоименной формы.
- source_word: אַךְ
  choice: только
  rationale: Здесь частица вводит единственное исключение из запрета.
- source_word: אֲשֶׁר יֵאָכֵל לְכָל נֶפֶשׁ
  choice: то, что нужно для еды каждому человеку
  rationale: Формулировка сохраняет связь с тем, что будет съедено, не приписывая глаголу прямо выраженную модальность «должен». נֶפֶשׁ в данном правовом контексте означает отдельного человека.
- source_word: הוּא לְבַדּוֹ
  choice: лишь это
  rationale: 'Передаёт усиленное ограничение: разрешено только названное исключение.'
- source_word: יֵעָשֶׂה לָכֶם
  choice: можно приготовить для вас
  rationale: В контексте исключения речь идёт о приготовлении пищи; «для вас» сохраняет значение לָכֶם, а разрешительное «можно» естественно выражает юридическую функцию фразы.
theological_decisions:
- issue: Объём разрешённого приготовления пищи
  choice: Не уточнять сверх текста, какие именно действия и какой объём приготовления необходимы
  alternative: Ограничить разрешение только минимально необходимым приготовлением либо разрешить любое приготовление пищи
  rationale: Еврейский текст допускает приготовление того, что будет съедено каждым человеком, но не формулирует здесь более подробных мер или условий.
translation_notes:
  register: Современный литературный русский язык с dignified правовым звучанием. Избегнуты архаичные «созывание» в основном тексте и вводящее в заблуждение «душа». Повтор «священное собрание» сохранён вслед за симметрией еврейского текста.
