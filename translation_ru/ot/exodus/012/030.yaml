base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/030.yaml
  text: And Pharaoh rose in the night[a], he and all his servants and all Egypt, and there was a great cry in Egypt[b], for there was no house where there was not someone dead.
translation:
  language: ru
  text: Фараон встал той ночью — он сам, все его слуги и все египтяне; и поднялся великий вопль в Египте, потому что не было дома, где не было бы умершего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «не было дома, где не было мёртвого».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Форма Qal wayyiqtol от קום обозначает последовательное повествовательное действие; «встал» естественно передаёт ночное пробуждение без добавочного истолкования.
- source_word: לַיְלָה הוּא
  choice: той ночью
  rationale: Сочетание существительного «ночь» с указательным местоименным элементом идиоматически указывает на конкретную ночь; «той ночью» естественно в современном русском повествовании.
- source_word: עֲבָדָיו
  choice: его слуги
  rationale: В контексте царского двора עֶבֶד обозначает подчинённых фараона; «слуги» сохраняет широту слова и не сужает его до одних чиновников.
- source_word: וְכָל מִצְרַיִם
  choice: и все египтяне
  rationale: Название страны употреблено метонимически о её населении. По-русски «весь Египет» также возможно, но «все египтяне» яснее обозначает людей и избегает впечатления, будто встал сам край.
- source_word: צְעָקָה גְדֹלָה
  choice: великий вопль
  rationale: צְעָקָה — крик или вопль бедствия, а גְדֹלָה подчёркивает его силу и масштаб; «великий вопль» сохраняет торжественно-трагический повествовательный регистр.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину всеобщего вопля; «потому что» прямо и естественно выражает причинную связь.
- source_word: אֵין בַּיִת אֲשֶׁר אֵין שָׁם מֵת
  choice: не было дома, где не было бы умершего
  rationale: Сохранены слово «дом» и усилительная отрицательная конструкция оригинала. «Умерший» передаёт субстантивированное מֵת без добавления сведений о личности умершего.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным звучанием. Синтаксический параллелизм еврейского текста в основном сохранён; метонимия «весь Египет» раскрыта как «все египтяне» ради естественности и ясности.
