  text: And the sons of Israel journeyed from Rameses to Succoth[a], about six hundred thousand men on foot[d][c][b], besides children.
translation:
  language: ru
  text: И отправились сыны Израиля из Раамсеса в Сокхоф — около шестисот тысяч пеших мужчин, не считая детей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не считая малых детей». Еврейское טַף может обозначать детей, особенно малолетних, а также малых иждивенцев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: отправились
  rationale: Глагол נסע в повествовании о переходах означает сняться с места и выступить в путь; «отправились» естественно передаёт начало движения.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранён образ родства, выраженный буквальным «сыновья Израиля»; форма «сыны» уместна в современном литературном библейском регистре и не смешивает эту группу с упомянутыми отдельно детьми.
- source_word: מֵרַעְמְסֵס
  choice: из Раамсеса
  rationale: Предлог מן передаёт исходный пункт движения; «Раамсес» — традиционная и узнаваемая русская передача топонима.
- source_word: סֻכֹּתָה
  choice: в Сокхоф
  rationale: Направительное окончание -ה обозначает движение к месту; русское «в» естественно выражает направление. Использована традиционная русская форма топонима.
- source_word: כְּשֵׁשׁ מֵאוֹת אֶלֶף
  choice: около шестисот тысяч
  rationale: Префикс כְּ при числительном указывает на приблизительность.
- source_word: רַגְלִי הַגְּבָרִים
  choice: пеших мужчин
  rationale: רַגְלִי обозначает передвигавшихся пешком, а הַגְּבָרִים — мужчин; компактная русская формулировка сохраняет оба элемента.
- source_word: לְבַד מִטָּף
  choice: не считая детей
  rationale: Оборот לְבַד מִן исключает названную группу из числа, а טַף обозначает малых детей или малолетних иждивенцев; основной текст передаёт наиболее естественное значение.
theological_decisions:
- issue: Состав исчисляемой группы
  choice: Число относится к пешим мужчинам, а дети в него не входят.
  alternative: Понимать число как общую численность всех вышедших.
  rationale: Синтаксическая связь числительного с רַגְלִי הַגְּבָרִים и последующее לְבַד מִטָּף прямо отличают мужчин от детей, не уточняя при этом возрастную границу мужчин и не называя число женщин.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. «Сыны Израиля» сохраняет исходную родовую формулу; прочая фраза построена естественно и без архаической перегруженности. Маркер сноски поставлен непосредственно после слова «детей», к которому относится примечание.
