  text: A sojourner or a hired worker shall not eat of it[a][b].
translation:
  language: ru
  text: Ни чужеземец, проживающий среди израильтян[a], ни наёмный работник не должны есть её[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «живущий среди народа чужеземец», «временно проживающий чужеземец» или «поселенец».'
    reason: lexical_alternative
  - marker: b
    text: То есть пасхальную трапезу; в более узком смысле — пасхального ягнёнка.
    reason: cross_reference
lexical_decisions:
- source_word: תּוֹשָׁב
  choice: чужеземец-поселенец
  rationale: Слово обозначает не коренного израильтянина, постоянно или временно живущего среди народа, но не вошедшего полностью в общину завета. Составное обозначение передаёт как проживание на месте, так и положение чужеземца.
- source_word: שָׂכִיר
  choice: наёмный работник
  rationale: Речь идёт о человеке, работающем за плату. Это ясное современное выражение без архаического или уничижительного оттенка слова «наёмник».
- source_word: לֹא יֹאכַל
  choice: не должны есть
  rationale: Отрицание с имперфектом в законодательном контексте выражает запрет. Конструкция с «ни… ни…» естественно показывает, что запрет относится к каждой из названных категорий.
- source_word: בּוֹ
  choice: есть её
  rationale: Предлог ב при глаголе «есть» здесь указывает на участие в пасхальной пище. Женское местоимение согласовано по-русски со словом «Пасха», подразумеваемым из контекста.
theological_decisions:
- issue: К чему относится местоимение בּוֹ («её/его»)
  choice: Сохранено местоимение «её», отсылающее к Пасхе как пасхальной жертве или трапезе.
  alternative: 'Передать прямо: «не должны есть пасхальную жертву» или, уже по смыслу, «пасхального ягнёнка».'
  rationale: В еврейском тексте стоит краткое местоименное указание, смысл которого задаётся ближайшим контекстом. Местоименный перевод сохраняет эту краткость и не сужает неоправданно значение до одного лишь ягнёнка.
translation_notes:
  register: Современный литературный русский язык с кратким законодательным звучанием. Парная конструкция «ни… ни…» естественно передаёт запрет для каждой категории, тогда как буквальное «и» по-русски могло бы ошибочно звучать как запрет лишь для их сочетания.
