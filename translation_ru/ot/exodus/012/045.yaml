  source_fidelity: Текст верно передаёт запрет, две названные категории и подразумеваемый объект вкушения. Однако «чужеземец-поселенец» — искусственно образованное и не вполне естественное для современного русского составное обозначение תּוֹשָׁב. Более прозрачное описательное выражение сохраняет значение лица, проживающего среди израильтян, но не принадлежащего к ним как коренной член общины. Местоимение и примечание обоснованно не сужают בּוֹ исключительно до ягнёнка.
  naturalness: Конструкция «ни … ни … не должны» естественна для современного законодательного русского. «Есть её» возможно при подразумеваемой Пасхе/пасхальной трапезе, хотя контекстное примечание необходимо и уже имеется. Замена дефисного неологизма на описательное словосочетание заметно улучшает литературную естественность.
  terminology: «Наёмный работник» точно и современно передаёт שָׂכִיר. Для תּוֹשָׁב выбран оборот «чужеземец, проживающий среди израильтян»; он лучше, чем «чужеземец-поселенец», выражает сочетание статуса чужеземца и проживания. Не следует заменять его просто «пришельцем», поскольку это русское традиционное слово может смешать данный термин с גֵּר.
