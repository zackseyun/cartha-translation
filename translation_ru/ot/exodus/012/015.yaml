base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/015.yaml
  text: For seven days you shall eat unleavened bread[a]. But on the first day you shall remove leaven from your houses, for whoever eats anything leavened, that person shall be cut off from Israel[b], from the first day to the seventh day.
translation:
  language: ru
  text: Семь дней ешьте пресный хлеб. Но в первый день удалите закваску из ваших домов[a], потому что всякий, кто с первого дня до седьмого будет есть квасное, — тот человек будет отсечён от Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделайте так, чтобы закваска исчезла»; возможны также переводы: «устраните» или «уничтожьте закваску».'
    reason: lexical_alternative
  - marker: b
    text: «Будет отсечён» — еврейское юридическое выражение. Оно может подразумевать исключение из общины, смерть или Божий суд; точный способ наказания в этом стихе не указан.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצּוֹת
  choice: пресный хлеб
  rationale: Слово обозначает хлеб, приготовленный без закваски. Единственное число с собирательным значением естественно для современного русского языка и ясно передаёт обрядовый контекст.
- source_word: אַךְ
  choice: но уже
  rationale: Частица вводит подчёркнутое уточнение общего повеления; сочетание «но уже» естественно выделяет требование, относящееся к первому дню.
- source_word: תַּשְׁבִּיתוּ
  choice: удалите
  rationale: Каузативная форма глагола שׁבת буквально означает «сделайте так, чтобы прекратилось». В данном контексте речь идёт об устранении закваски из домов; «удалите» ясно передаёт практический смысл, а буквальная образность отмечена в сноске.
- source_word: שְּׂאֹר
  choice: закваска
  rationale: Термин обозначает ферментирующую закваску, а не только современные промышленные дрожжи. «Закваска» точно и понятно передаёт предмет запрета.
- source_word: חָמֵץ
  choice: квасное
  rationale: Слово охватывает то, что подверглось заквашиванию, и не ограничивается одним только хлебом. Субстантивированное «квасное» сохраняет широту еврейского выражения.
- source_word: וְנִכְרְתָה
  choice: будет отсечён
  rationale: Сохранён еврейский юридико-заветный оборот без уточнения способа наказания, поскольку сам стих не определяет, имеется ли в виду исключение, смерть или Божий суд.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: тот человек
  rationale: В данной правовой формуле נֶפֶשׁ обозначает отдельного человека. Такой перевод естественен по-русски и не навязывает узкого антропологического смысла слова «душа».
- source_word: מִיִּשְׂרָאֵל
  choice: от Израиля
  rationale: Краткая формулировка сохраняет образ исходного текста и указывает на удаление из общины Израиля, не определяя точный характер санкции.
- source_word: מִיּוֹם הָרִאשֹׁן עַד יוֹם הַשְּׁבִעִי
  choice: с первого дня до седьмого
  rationale: В русском предложении оборот поставлен при глаголе «есть», чтобы ясно обозначить весь период действия запрета и избежать ошибочного впечатления, будто наказание длится только семь дней.
theological_decisions:
- issue: Смысл санкции וְנִכְרְתָה («будет отсечён»)
  choice: Сохранить формальный юридический оборот «будет отсечён от Израиля».
  alternative: «Будет исключён из общины», «будет предан смерти» или «будет устранён Божьим судом».
  rationale: Выражение имеет заветно-судебный смысл, однако данный стих не указывает точного способа исполнения санкции. Формальный перевод вместе со сноской сохраняет заложенную в тексте неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясной повелительной формой. Сохранены традиционные и понятные термины «пресный хлеб», «закваска» и юридический образ «отсечён», причём его неоднозначность пояснена в сноске. Маркер [a] поставлен непосредственно после выражения «удалите закваску», к которому относится соответствующее примечание.
