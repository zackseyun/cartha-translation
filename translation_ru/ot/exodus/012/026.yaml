  language: en
  yaml_path: translation/ot/exodus/012/026.yaml
  text: And when your sons say to you[a], ‘What is this service to you?’
translation:
  language: ru
  text: 'И когда ваши сыновья скажут вам: «Что это у вас за служение?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Что это служение для вас?»'
    reason: Более формальная передача конструкции מָה ... לָכֶם; основной текст передаёт её естественным русским вопросительным оборотом.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Устойчивая древнееврейская конструкция вводит будущую временную ситуацию; русский оборот «И когда» передаёт её естественно и без излишней буквальности.
- source_word: יֹאמְרוּ אֲלֵיכֶם
  choice: скажут вам
  rationale: Сохраняется обычное значение אמר — «сказать». Хотя далее следует вопрос, перевод «спросят» был бы допустимым, но более истолковывающим.
- source_word: בְּנֵיכֶם
  choice: ваши сыновья
  rationale: Мужской род множественного числа передан точно; более широкое «дети» здесь не требуется.
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: это служение
  rationale: עֲבֹדָה может обозначать работу, служение или обрядовое служение. В контексте Пасхи «служение» сохраняет культовый смысл, не сужая его до одного лишь «обряда».
- source_word: מָה ... לָכֶם
  choice: Что это за … у вас?
  rationale: Русская конструкция естественно передаёт вопрос о характере и значении служения, сохраняя обращённое к общине לָכֶם и не заменяя его однозначным толкованием «что это означает».
theological_decisions:
- issue: Смысл вопроса מָה הָעֲבֹדָה הַזֹּאת לָכֶם
  choice: 'Сохранён открытый вопрос: «Что это за служение у вас?»'
  alternative: «Что означает для вас это служение?»
  rationale: Альтернатива явно истолковывает вопрос как просьбу объяснить значение обряда. Основной перевод сохраняет более широкую формулировку оригинала и возможное напряжение выражения לָכֶם.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировка понятна обычному читателю, но не сглаживает характерную для древнееврейского текста конструкцию вопроса.
