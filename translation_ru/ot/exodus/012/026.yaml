  verdict: revise
  source_fidelity: Временной оборот «И когда», «ваши сыновья» и «скажут вам» точно передают еврейский текст. «Служение» удачно сохраняет широту עֲבֹדָה в пасхальном контексте. Однако порядок слов «Что это за служение у вас?» несколько ослабляет связь לָכֶם с вопросом и может звучать как вопрос о служении, происходящем «у вас».
  naturalness: «Что это у вас за служение?» — естественная современная русская вопросительная конструкция. Она лучше передаёт оттенок «что это за ваше служение?» и не превращает вопрос прямо в истолкование о значении обряда.
  terminology: «Служение» уместно и не сужает עֲבֹדָה до «обряда» или «богослужения». «Сыновья» верно отражает בְּנֵיכֶם.
