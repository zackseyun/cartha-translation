  text: כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יַעֲשׂ֥וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/047.yaml
  text: All the congregation of Israel shall do it[a].
translation:
  language: ru
  text: Вся община Израиля должна совершать её[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё общество Израиля должно совершать её».'
    reason: 'Лексическая альтернатива: עֵדָה можно передать словом «общество»; основной текст использует более естественное в данном контексте «община».'
lexical_decisions:
- source_word: כָּל
  choice: всё
  rationale: Передаёт полноту охвата и естественно согласуется в русском языке с собирательным существительным «общество».
- source_word: עֲדַת
  choice: общество
  rationale: Еврейское עֵדָה обозначает общину, собрание народа как единое целое; «общество Израиля» сохраняет корпоративный смысл и уместно в контексте пасхальных установлений.
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Стандартная русская форма собственного имени в родительном падеже после «общество».
- source_word: יַעֲשׂוּ
  choice: должно совершать
  rationale: В данном предписании форма глагола עשה выражает обязательное исполнение пасхального установления. «Совершать» естественнее буквального «делать» в русском культовом контексте, не уточняя действие сверх контекста.
- source_word: אֹתוֹ
  choice: её
  rationale: Местоименный объект оставлен без явного уточнения референта; женский род по-русски соотносит его с подразумеваемой Пасхой, сохраняя контекстуальную отсылку.
theological_decisions:
- issue: Корпоративный субъект пасхального предписания
  choice: «Всё общество Израиля» — народ рассматривается как единое целое.
  alternative: «Каждый израильтянин» — индивидуализирующее прочтение.
  rationale: Собирательное существительное עֵדָה с названием народа обозначает всю общину корпоративно и само по себе не утверждает, что речь идёт о каждом человеке в отдельности.
- issue: Референт местоимения אֹתוֹ
  choice: В основном тексте сохранена местоименная отсылка «её», контекстуально указывающая на Пасху.
  alternative: 'Явно уточнить: «Пасху», «обряд» или «это».'
  rationale: Еврейский текст использует местоимение и не устраняет полностью возможную отсылку к предшествующему пасхальному установлению; явное существительное было бы более толковательным.
translation_notes:
  register: Современный литературный русский, сдержанный и понятный. «Должно совершать» передаёт нормативную силу формы и культовый контекст; «общество» подчёркивает совокупность Израиля, а сноска предлагает более привычную церковно-библейскую формулировку.
