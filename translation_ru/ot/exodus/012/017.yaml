base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/017.yaml
  text: And you shall keep the Feast of Unleavened Bread[a], because on this very day I brought your hosts out from the land of Egypt[c][b]. And you shall keep this day throughout your generations as a permanent statute.
translation:
  language: ru
  text: Соблюдайте праздник Пресных хлебов[a], потому что именно в этот день Я вывел ваши отряды[b] из земли Египта. Соблюдайте этот день из поколения в поколение как постоянное установление[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пресные хлебы»; выражение может обозначать как сами пресные хлебы, так и связанный с ними праздник.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ваши войска», «ваши воинства» или «ваши множества». Еврейское слово изображает Израиль как организованное сообщество, выходящее из Египта.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «как установление на все времена» или «как вечное установление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: соблюдайте
  rationale: В обрядовом и заветном контексте שׁמר означает хранить или соблюдать предписание. Повтор одного и того же глагола сохранён в обеих частях стиха.
- source_word: הַמַּצּוֹת
  choice: праздник Пресных хлебов
  rationale: Буквально выражение обозначает «пресные хлебы», но здесь они выступают названием предписанного празднования. Слово «праздник» добавлено для ясности, а буквальная форма отмечена в сноске.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: именно в этот день
  rationale: Оборот подчёркивает точное совпадение дня; «именно» естественно передаёт усилительную силу עֶצֶם.
- source_word: הוֹצֵאתִי
  choice: Я вывел
  rationale: Порода hifil глагола יצא имеет каузативное значение «вывести»; русский глагол кратко и естественно передаёт исход из Египта.
- source_word: צִבְאוֹתֵיכֶם
  choice: ваши ополчения
  rationale: צָבָא может обозначать войско, организованные отряды или сонм. «Ополчения» сохраняет образ народа как упорядоченного сообщества, не утверждая, что речь непременно о регулярной армии.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Предлог מִן указывает исходную точку движения; традиционное русское словосочетание остаётся понятным и соответствует возвышенному регистру.
- source_word: לְדֹרֹתֵיכֶם
  choice: из поколения в поколение
  rationale: Передаёт непрерывность соблюдения среди последующих поколений естественным современным русским оборотом.
- source_word: חֻקַּת עוֹלָם
  choice: как вечное установление
  rationale: חֻקָּה — обязательное предписание или установление, а עוֹלָם выражает длительную, неограниченную перспективу. «Вечное установление» сохраняет силу исходного выражения.
theological_decisions:
- issue: Обозначает ли הַמַּצּוֹת сами пресные хлебы или праздник
  choice: В основном тексте — «праздник Пресных хлебов», с буквальной альтернативой в сноске.
  alternative: «пресные хлебы»
  rationale: Непосредственным объектом соблюдения по контексту является праздничное установление, однако еврейский текст буквально называет пресные хлебы; сноска сохраняет эту лексическую неоднозначность.
- issue: Как передать длительность в חֻקַּת עוֹלָם
  choice: «вечное установление»
  alternative: «неизменное установление» или «установление на все времена»
  rationale: Перевод сохраняет сильную временную формулировку текста, не добавляя разъяснений о её дальнейшем богословском применении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «Соблюдайте» воспроизводит структуру еврейского стиха; формы «Пресных хлебов» и «земли Египетской» сохраняют узнаваемую библейскую лексику без архаической грамматики.
