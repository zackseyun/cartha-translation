  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/כָל זִקְנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם מִֽשְׁכ֗וּ וּ/קְח֨וּ לָ/כֶ֥ם צֹ֛אן לְ/מִשְׁפְּחֹתֵי/כֶ֖ם וְ/שַׁחֲט֥וּ הַ/פָּֽסַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/021.yaml
  text: Then Moses called for all the elders of Israel and said to them[a], “Draw out and take for yourselves sheep according to your families[c][b], and slaughter the Passover lamb.”
translation:
  language: ru
  text: 'И созвал Моисей всех старейшин Израиля и сказал им: «Выберите и возьмите себе мелкий скот по вашим семьям и заколите пасхальную жертву[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «заколите Пасху»; здесь «Пасха» означает пасхальное жертвенное животное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: созвал
  rationale: В данном контексте глагол обозначает призыв старейшин собраться для получения наставлений; «созвал» естественно передаёт этот смысл.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: старейшин Израиля
  rationale: Устойчивое обозначение признанных руководителей и представителей народа.
- source_word: מִשְׁכוּ
  choice: выберите
  rationale: Буквально глагол означает «тяните, вытяните»; здесь речь, вероятно, идёт о выделении животного из стада. В русском «выберите» ясно и естественно передаёт контекстуальный смысл, тогда как буквальное «выведите» добавляло бы не выраженное прямо направление движения.
- source_word: וּקְחוּ לָכֶם
  choice: и возьмите себе
  rationale: Сохраняет второй императив и возвратный оттенок לָכֶם, не сливая его с первым действием.
- source_word: צֹאן
  choice: мелкий скот
  rationale: Собирательное слово охватывает овец и коз; это особенно важно в свете Исх 12:5. Перевод «ягнят» был бы неоправданно узким.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: по вашим семьям
  rationale: Передаёт распределение животных соответственно семейным или родовым группам; в современном русском «семьям» здесь доступнее, чем «родам».
- source_word: וְשַׁחֲטוּ
  choice: и заколите
  rationale: Точный и традиционно понятный русский глагол для ритуального убоя животного, без архаической тяжеловесности.
- source_word: הַפָּסַח
  choice: пасхальную жертву
  rationale: Буквально стоит «Пасху», но здесь название праздника метонимически обозначает закалываемое пасхальное животное. «Жертву» делает референт ясным и не сужает его до ягнёнка.
theological_decisions:
- issue: Референт הַפָּסַח
  choice: пасхальная жертва
  alternative: Пасха; пасхальный ягнёнок
  rationale: 'Сочетание с «заколите» показывает, что имеется в виду жертвенное животное. Формулировка «пасхальная жертва» раскрывает метонимию, но сохраняет широту контекста: согласно Исх 12:5 животное могло быть из овец или коз.'
- issue: Вид животного, обозначенного צֹאן
  choice: мелкий скот
  alternative: овцы; ягнята
  rationale: Еврейское собирательное существительное включает овец и коз. Нейтральный родовой термин не вносит более узкого традиционного образа в сам текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «И созвал» сохраняет повествовательную связь וַ־ без тяжеловесного «тогда». Повеления переданы ясно и без архаизмов; подлинная широта צֹאן и метонимия הַפָּסַח сохранены.
