  source_fidelity: 'Перевод точно передаёт основные элементы еврейского текста: Моисей созывает старейшин, обращается к ним с двумя повелениями, сохраняется возвратный оттенок «себе», а распределение обозначено «по вашим семьям». «Выберите» является контекстуально обоснованным переводом מִשְׁכוּ: буквальное значение глагола — «тянуть/выводить», но в данном контексте речь идёт об отделении животного из стада. «Мелкий скот» удачно сохраняет широту צֹאן, включающего овец и коз. «Пасхальную жертву» обоснованно раскрывает метонимическое הַפָּסַח, не сужая референт до ягнёнка.'
