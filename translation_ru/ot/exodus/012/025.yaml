  yaml_path: translation/ot/exodus/012/025.yaml
  text: And when you come into the land that Yahweh will give you[a], just as he promised[b], you shall keep this service.
translation:
  language: ru
  text: Когда вы войдёте в землю, которую Яхве даст вам, как Он и обещал[a], соблюдайте этот обряд[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как Он сказал». Буквально: «как Он сказал»; в данном контексте речь идёт о прежнем обещании.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «это служение» или «это установление». Здесь имеется в виду установленный пасхальный ритуал.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Когда
  rationale: Обычная древнееврейская формула вводит будущее обстоятельство; русское «когда» естественно передаёт временное значение без буквализма «и будет».
- source_word: תָבֹאוּ אֶל הָאָרֶץ
  choice: вы придёте в землю
  rationale: בוא может означать «приходить» или «входить»; сочетание «прийти в землю» понятно и сохраняет перспективу обещанного места назначения.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לָכֶם
  choice: которую Яхве даст вам
  rationale: Форма יִתֵּן в данном будущем контексте передана будущим временем; личное имя יְהוָה транслитерировано как «Яхве».
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: как Он и обещал
  rationale: Буквально оборот означает «как Он говорил», но в контексте данного прежде Божьего слова имеет силу обещания; частица «и» естественно подчёркивает соответствие.
- source_word: וּשְׁמַרְתֶּם
  choice: соблюдайте
  rationale: При обозначении установленного обряда שׁמר означает хранить и исполнять предписание; русский императив передаёт обязательную силу древнееврейской формы в данном наставлении.
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: это служение
  rationale: עֲבֹדָה означает служение или работу, а здесь относится к установленному пасхальному богослужебному действию; «служение» сохраняет культовый оттенок и остаётся понятным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога, поэтому оно передано непосредственно как «Яхве», без замены титулом.
- issue: Смысл כַּאֲשֶׁר דִּבֵּר
  choice: как Он и обещал
  alternative: как Он сказал; как Он говорил
  rationale: Контекст указывает на исполнение прежде данного слова о земле, однако буквальная возможность «сказал» сохранена в сноске.
- issue: Характер הָעֲבֹדָה הַזֹּאת
  choice: это служение
  alternative: этот обряд; это установление
  rationale: Речь идёт о пасхальном ритуальном служении. Перевод не сужает значение исключительно до церемонии, а возможные уточнения отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис упрощён по сравнению с древнееврейской формулой, но последовательность мысли и обязательный характер наставления сохранены.
