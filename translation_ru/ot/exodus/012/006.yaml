base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/006.yaml
  text: And it shall be kept by you until the fourteenth day of this month[a], and the whole assembly of the congregation of Israel shall slaughter it between the evenings.
translation:
  language: ru
  text: Держите его у себя до четырнадцатого дня этого месяца, и всё собрание общины Израиля должно заколоть его между двумя вечерами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Древнееврейское выражение буквально означает «между двумя вечерами»; его обычно понимают как время около заката, в сумерках.
    reason: Сохраняется буквальная и допускающая разные толкования формулировка, а её обычное временное понимание поясняется читателю.
lexical_decisions:
- source_word: וְהָיָה לָכֶם לְמִשְׁמֶרֶת
  choice: Он должен оставаться у вас под присмотром
  rationale: Сочетание выражает обязанность сохранять выбранное животное до назначенного дня. Формулировка передаёт значение хранения и ответственности без неестественной для русского языка пассивной конструкции.
- source_word: עַד אַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: до четырнадцатого дня этого месяца
  rationale: Естественная русская передача древнееврейского обозначения календарной даты.
- source_word: וְשָׁחֲטוּ אֹתוֹ
  choice: пусть … заколет его
  rationale: Глагол שׁחט обозначает заклание животного, а местоимение относится к ранее выбранному ягнёнку или козлёнку. Русское «заколет» сохраняет конкретное значение и соответствует собирательному подлежащему в единственном числе.
- source_word: כֹּל קְהַל עֲדַת יִשְׂרָאֵל
  choice: всё собрание общины Израиля
  rationale: Сохранены оба собирательных элемента еврейского выражения, подчёркивающие совокупное участие Израиля, хотя по-русски оборот остаётся понятным и торжественным.
- source_word: בֵּין הָעַרְבָּיִם
  choice: между двумя вечерами
  rationale: Буквальная передача формы двойственного числа сохраняет неоднозначность древнееврейского временного выражения; вероятное значение поясняется в сноске.
theological_decisions:
- issue: Совокупный субъект повеления о заклании
  choice: всё собрание общины Израиля заколет его
  alternative: каждая семья заколет своего ягнёнка
  rationale: В еврейском тексте субъектом выступает Израиль как единое собрание. Перевод сохраняет корпоративную формулировку стиха и не подменяет её практическим пояснением из ближайшего контекста.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного наставления. Конструкция «пусть … заколет» передаёт предписывающую силу формы, а «между двумя вечерами» намеренно сохраняет особенность и неоднозначность оригинала.
