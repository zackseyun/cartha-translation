  rationale: Заменено сужающее «оставаться у вас под присмотром» на естественное «Держите его у себя», передающее требование сохранять выбранное животное. «Пусть ... заколет» заменено на «должно заколоть» для ясной нормативной силы при сохранении коллективного субъекта. Спорная идиома оставлена буквально в основном тексте и снабжена сноской.
