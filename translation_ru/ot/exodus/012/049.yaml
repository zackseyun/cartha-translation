lexical_decisions:
- source_word: תּוֹרָה
  choice: закон
  rationale: В контексте предписаний о Пасхе слово обозначает обязательную правовую норму; «закон» точно и естественно передаёт этот смысл.
- source_word: אַחַת
  choice: один
  rationale: Подчёркивает единство правовой нормы для обеих групп; сохраняет форму еврейского выражения «один закон».
- source_word: יִהְיֶה
  choice: будет
  rationale: Прямо передаёт форму глагола «быть» и естественно звучит в нормативном утверждении.
- source_word: אֶזְרָח
  choice: коренной житель
  rationale: Обозначает исконного члена общины и не привносит позднейших политико-правовых категорий, связанных со словом «гражданин».
- source_word: גֵּר
  choice: переселенец
  rationale: Передаёт смысл некоренного человека, постоянно или длительно живущего среди Израиля; современнее и точнее, чем двусмысленное «пришелец».
- source_word: הַגָּר
  choice: живущего
  rationale: Причастие уточняет статус переселенца как проживающего среди общины; по-русски лексический повтор «переселенца, переселяющегося» был бы неестественен.
- source_word: בְּתוֹכְכֶם
  choice: среди вас
  rationale: Ясно и естественно передаёт нахождение внутри общины.
