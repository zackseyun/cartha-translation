  language: ru
  text: Один закон будет и для коренного жителя, и для чужеземца, живущего среди вас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Одно установление будет и для коренного жителя, и для чужеземца, живущего среди вас».'
