  yaml_path: translation/ot/exodus/012/007.yaml
  text: And they shall take some of the blood and put it on the two doorposts and on the lintel of the houses in which they eat it[a].
translation:
  language: ru
  text: И пусть возьмут немного крови и нанесут её на оба косяка и на притолоку тех домов, в которых будут есть ягнёнка.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будут есть его». Речь идёт о пасхальном ягнёнке.'
    reason: clarity
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: И пусть возьмут
  rationale: В последовательности предписаний форма передаёт повелительно-инструктивное значение; конструкция с «пусть» естественна для современного русского языка и сохраняет торжественный тон.
- source_word: מִן הַדָּם
  choice: немного крови
  rationale: 'Предлог מִן употреблён партитивно: речь идёт о некотором количестве крови, а не обо всей крови.'
- source_word: וְנָתְנוּ
  choice: и нанесут её
  rationale: Глагол נתן имеет широкое значение «дать, положить, поместить»; в контексте нанесения крови на элементы дверного проёма русский глагол «нанести» звучит конкретно и естественно.
- source_word: עַל שְׁתֵּי הַמְּזוּזֹת
  choice: на оба косяка
  rationale: מְזוּזוֹת обозначает две вертикальные стойки дверного проёма; «оба косяка» — точный и общеупотребительный русский эквивалент.
- source_word: וְעַל הַמַּשְׁקוֹף
  choice: и на притолоку
  rationale: מַשְׁקוֹף обозначает верхнюю горизонтальную перекладину дверного проёма; «притолока» является точным архитектурным термином.
- source_word: עַל הַבָּתִּים
  choice: тех домов
  rationale: В контексте оборот уточняет, каким домам принадлежат косяки и притолоки. Родительная конструкция по-русски естественнее буквального повторения «на домах».
- source_word: אֲשֶׁר יֹאכְלוּ אֹתוֹ בָהֶם
  choice: в которых будут есть ягнёнка
  rationale: Относительное предложение относится к домам, а имперфект допускает будущее значение в контексте предписания. Местоименное «его» могло бы быть неясным по-русски, поэтому подразумеваемый объект из предыдущего контекста назван как «ягнёнок».
