  terminology: «Яхве» корректно передаёт тетраграмматон в соответствии с выбранной редакционной практикой; примечание добросовестно указывает традиционную передачу «ГОСПОДЬ» и альтернативу «Иегова». «Боги Египта» соответствует אֱלֹהֵי מִצְרַיִם и не навязывает интерпретацию «идолы» или «правители». Маркеры сносок [a] и [b] присутствуют и соответствуют имеющимся сноскам.
