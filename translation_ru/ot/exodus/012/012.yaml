  source_fidelity: 'Текст точно передаёт последовательность и основные элементы еврейского оригинала: прохождение по земле Египта именно в эту ночь, поражение каждого первенца от человека до скота, судебное действие против всех богов Египта и заключительную формулу самоотождествления Яхве. «Пройду по земле» верно избегает вводящего в заблуждение значения «пройду мимо». Единственное число в «совершу суд» идиоматично выражает совокупное действие, хотя еврейское שְׁפָטִים формально стоит во множественном числе; смысл не утрачен.'
