reference: Exodus 12:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עָבַרְתִּ֣י בְ/אֶֽרֶץ מִצְרַיִם֮ בַּ/לַּ֣יְלָה הַ/זֶּה֒ וְ/הִכֵּיתִ֤י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וּ/בְ/כָל אֱלֹהֵ֥י מִצְרַ֛יִם אֶֽעֱשֶׂ֥ה שְׁפָטִ֖ים אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/012.yaml
  text: For I will pass through the land of Egypt on this night[a], and I will strike every firstborn in the land of Egypt, from man to beast; and against all the gods of Egypt I will execute judgments[c][b]. I am Yahweh.
translation:
  language: ru
  text: И пройду Я по земле Египетской в эту ночь[a] и поражу всякого первенца в земле Египетской — от человека до скота; и над всеми богами Египта совершу суд. Я — Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пройду через». Здесь говорится о прохождении по земле Египетской, а не о том, что Бог «пройдёт мимо» и пощадит.'
    reason: lexical_alternative
  - marker: b
    text: Евр. YHWH (тетраграмматон); традиционная передача — «ГОСПОДЬ», другой вариант — «Иегова».
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַרְתִּי
  choice: и пройду Я по
  rationale: Глагол עבר с предлогом ב и указанием земли означает движение по территории, а не «пройти мимо» в смысле пощадить.
- source_word: בְאֶרֶץ מִצְרַיִם
  choice: по земле Египетской
  rationale: Сохраняет явно названную землю как пространство действия и звучит естественно в возвышенном современном русском.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: в эту ночь
  rationale: Прямо передаёт временное значение и указательное ударение исходной фразы.
- source_word: וְהִכֵּיתִי
  choice: поражу
  rationale: Точно и ёмко передаёт נכה; гибель первенцев ясна из контекста, поэтому дополнительное «насмерть» не требуется.
- source_word: כָּל בְּכוֹר
  choice: всякого первенца
  rationale: Передаёт собирательное единственное число; указание на мужской пол не добавляется, поскольку в еврейском тексте его здесь нет.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: от человека до скота
  rationale: Сохраняет меризм, охватывающий людей и домашних животных; «скот» в данном контексте естественнее общего «животного».
- source_word: וּבְכָל אֱלֹהֵי מִצְרַיִם
  choice: над всеми богами Египта
  rationale: Предлог в сочетании с формулой совершения суда обозначает объект направленного судебного действия; «богами» сохраняет прямой смысл אֱלֹהִים без сведения его к идолам.
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: совершу суд
  rationale: Русское единственное число естественно передаёт идиому о приведении в исполнение судебных приговоров, не ослабляя её судебной силы.
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Передаёт формулу самоотождествления и личное имя YHWH; тире подчёркивает итоговое торжественное утверждение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: Текст непосредственно употребляет тетраграмматон как личное имя Бога. Транслитерация «Яхве» сохраняет это имя, а примечание сообщает традиционные варианты.
- issue: Статус אֱלֹהֵי מִצְרַיִם
  choice: боги Египта
  alternative: идолы Египта; божественные существа Египта
  rationale: Еврейский текст прямо говорит о богах Египта. Перевод не решает сверх текста вопрос об их онтологическом статусе и не сводит их заранее лишь к изображениям.
- issue: Число в שְׁפָטִים
  choice: совершу суд
  alternative: совершу суды; произведу суд
  rationale: Множественное число может обозначать отдельные акты суда, однако русская формула в единственном числе естественно выражает совокупное Божье судебное действие. Теологический смысл наказания сохраняется.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Инверсия «пройду Я» подчёркивает действующего Лица, а повтор «земле Египетской / Египта» сохраняет структуру оригинала. Все примечания имеют маркеры в основном тексте.
