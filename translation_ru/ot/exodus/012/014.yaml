source:
  edition: WLC
  text: וְ/הָיָה֩ הַ/יּ֨וֹם הַ/זֶּ֤ה לָ/כֶם֙ לְ/זִכָּר֔וֹן וְ/חַגֹּתֶ֥ם אֹת֖/וֹ חַ֣ג לַֽ/יהוָ֑ה לְ/דֹרֹ֣תֵי/כֶ֔ם חֻקַּ֥ת עוֹלָ֖ם תְּחָגֻּֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/014.yaml
  text: And this day shall be for you as a memorial[a], and you shall celebrate it as a feast to Yahweh; throughout your generations, you shall celebrate it as a permanent statute.
translation:
  language: ru
  text: И этот день будет для вас днём памяти. Празднуйте его как праздник в честь Яхве; из поколения в поколение празднуйте его как установление на все времена.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вечное установление» или «непреходящее установление». Еврейское выражение חֻקַּת עוֹלָם обозначает установление, сохраняющее силу на протяжении неопределённо долгого времени.'
    reason: Лексическая альтернатива для חֻקַּת עוֹלָם и сохранение диапазона значения עוֹלָם.
lexical_decisions:
- source_word: וְהָיָה הַיּוֹם הַזֶּה
  choice: И этот день будет
  rationale: Форма וְהָיָה в контексте предписания имеет будущее значение; указательное сочетание הַיּוֹם הַזֶּה передано прямо и без добавочного усиления.
- source_word: לָכֶם לְזִכָּרוֹן
  choice: для вас днём памяти
  rationale: זִכָּרוֹן обозначает память или памятное напоминание. Выражение «день памяти» естественно по-русски и сохраняет смысл установленного воспоминания о событии.
- source_word: וְחַגֹּתֶם אֹתוֹ חַג
  choice: Празднуйте его как праздник
  rationale: Однокоренные глагол חגג и существительное חַג переданы однокоренными русскими словами, что сохраняет намеренный повтор и культово-праздничный смысл.
- source_word: לַיהוָה
  choice: в честь Яхве
  rationale: Предлог לְ указывает, кому посвящён праздник. Оборот «в честь» естественно выражает направленность празднования, а личное имя יהוה передано как «Яхве».
- source_word: לְדֹרֹתֵיכֶם
  choice: из поколения в поколение
  rationale: Русский идиоматический оборот ясно передаёт непрерывность соблюдения среди последующих поколений.
- source_word: חֻקַּת עוֹלָם
  choice: установление на все времена
  rationale: חֻקָּה — обязательное установленное предписание, а עוֹלָם здесь подчёркивает его длительную, постоянную силу. Выбор сохраняет юридический характер и не навязывает философского уточнения об абсолютной бесконечности.
- source_word: תְּחָגֻּהוּ
  choice: празднуйте его
  rationale: Повтор глагола חגג воспроизведён тем же русским глаголом, чтобы сохранить усиление предписания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Продолжительность предписания в выражении חֻקַּת עוֹלָם
  choice: установление на все времена
  alternative: вечное установление; непреходящее установление
  rationale: Формулировка выражает постоянную обязательность установления для поколений Израиля, сохраняя широту значения עוֹלָם и не разрешая сверх текста вопрос о метафизически бесконечной длительности.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным звучанием. Повтор «празднуйте… праздник… празднуйте» намеренно сохраняет однокоренной повтор и усиление еврейского текста.
