base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/022.yaml
  text: And you shall take a bunch of hyssop and dip it in the blood that is in the basin[a], and touch the lintel and the two doorposts with some of the blood that is in the basin. And none of you shall go out from the entrance of his house until morning.
translation:
  language: ru
  text: Возьмите пучок иссопа, обмакните его в кровь, которая в чаше[a], и нанесите кровь из чаши на притолоку и на оба косяка. Никто из вас не должен выходить из дверного проёма своего дома до утра.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на пороге». Еврейское слово «саф» может означать как сосуд, так и порог. Здесь предпочтительно значение «чаша», поскольку кровь находится в ней и в неё обмакивают иссоп.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגֻדַּת אֵזוֹב
  choice: пучок иссопа
  rationale: «Пучок» естественно передаёт связанное или собранное вместе количество растений; «иссоп» — традиционное обозначение ритуального растения, точная ботаническая идентификация которого остаётся спорной.
- source_word: וּטְבַלְתֶּם בַּדָּם
  choice: обмакните его в кровь
  rationale: Глагол טבל обозначает погружение или обмакивание, а предлог ב указывает среду, в которую погружают предмет.
- source_word: הַסַּף
  choice: чаша
  rationale: Упоминание крови, находящейся внутри, и обмакивания в неё иссопа указывает здесь на сосуд. «Чаша» передаёт открытую ёмкость и звучит естественно; вариант «порог» сохранён в сноске.
- source_word: וְהִגַּעְתֶּם
  choice: коснитесь
  rationale: Каузативная форма נגע выражает приведение крови в соприкосновение с частями дверного проёма. «Коснитесь» сохраняет конкретность действия и не усиливает его до «ударьте».
- source_word: הַמַּשְׁקוֹף
  choice: притолока
  rationale: Точный и общеупотребительный русский термин для верхней горизонтальной части дверного проёма.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: оба косяка
  rationale: Речь идёт о двух вертикальных боковых частях дверного проёма; «оба косяка» естественнее по-русски, чем буквальное «два косяка».
- source_word: מִן הַדָּם אֲשֶׁר בַּסָּף
  choice: кровью из чаши
  rationale: Предлог מִן указывает на кровь, взятую из находящегося там количества; русский творительный падеж естественно передаёт средство действия.
- source_word: לֹא תֵצְאוּ אִישׁ
  choice: никто из вас не должен выходить
  rationale: Существительное אִישׁ после запрета во множественном числе имеет распределительное значение, которое естественно выражается оборотом «никто из вас».
- source_word: מִפֶּתַח בֵּיתוֹ
  choice: за дверь своего дома
  rationale: Оборот естественно обозначает выход наружу через вход дома и сохраняет распределительное соотнесение каждого человека со своим домом.
- source_word: עַד בֹּקֶר
  choice: до утра
  rationale: Прямое и естественное соответствие временному пределу, выраженному еврейским оборотом.
theological_decisions:
- issue: Распределительное выражение אִישׁ ... בֵּיתוֹ
  choice: Никто из вас не должен выходить за дверь своего дома
  alternative: Не выходите из своих домов; никто не должен выходить за дверь дома
  rationale: 'Формулировка сохраняет индивидуально-распределительный смысл: запрет относится к каждому из адресатов. Русское «своего» передаёт соотнесённость дома с каждым человеком, не создавая ненужного утверждения, будто заповедь касается только мужчин.'
- issue: Значение הַסַּף в данном стихе
  choice: чаша
  alternative: порог
  rationale: Непосредственный контекст говорит о крови, находящейся «в» этом предмете, и об иссопе, который в неё обмакивают, поэтому значение сосуда предпочтительно. Реальная лексическая альтернатива «порог» не устраняется и указана в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной ритуальной лексикой. Синтаксис повеления сохранён, но приспособлен к естественному русскому порядку слов. Термины «притолока» и «косяки» точны и понятны без излишней архаизации.
