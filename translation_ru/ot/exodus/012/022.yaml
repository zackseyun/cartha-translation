review_pass:
  verdict: revise
  source_fidelity: 'В первой части смысл передан верно: пучок иссопа обмакивают в кровь, находящуюся в сосуде, и этой кровью отмечают притолоку и оба косяка. Сноска корректно сохраняет реальную лексическую альтернативу «порог» для הַסַּף. Однако «выходить за дверь своего дома» несколько смещает исходное «выходить от/из входа дома»: оно описывает выход через вход, а не просто местонахождение по ту сторону двери.'
  naturalness: «Коснитесь кровью ... притолоки и обоих косяков» грамматически возможно, но в современном русском звучит тяжеловесно и не вполне ясно описывает нанесение крови. «Нанесите кровь ... на притолоку и на оба косяка» естественно передаёт требуемое действие без добавления богословского или ритуального толкования. «Из дверного проёма своего дома» точно, хотя несколько формальнее, передаёт פֶּתַח.
  terminology: «Пучок иссопа», «притолока» и «косяки» удачны. «Чаша» допустима как обозначение сосуда, хотя еврейское слово не уточняет форму сосуда; сноска надлежащим образом отмечает альтернативу. Распределительное «никто из вас ... своего дома» сохранено естественно по-русски.
  issues:
  - severity: medium
    issue: Не вполне естественное и недостаточно ясное выражение «коснитесь кровью ... притолоки и обоих косяков».
    rationale: Оригинал требует привести кровь в соприкосновение с элементами дверного проёма; русское «нанесите кровь ... на» ясно и естественно передаёт это действие.
  - severity: low
    issue: «Выходить за дверь своего дома» менее точно, чем исходное «выходить из входа/дверного проёма дома».
    rationale: Оборот «за дверь» естественен, но несколько перефразирует пространственную конструкцию מִפֶּתַח בֵּיתוֹ. Уточнение «из дверного проёма» лучше сохраняет образ и синтаксическую направленность оригинала.
