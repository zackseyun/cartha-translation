source:
  edition: WLC
  text: וְ/כִֽי יָג֨וּר אִתְּ/ךָ֜ גֵּ֗ר וְ/עָ֣שָׂה פֶסַח֮ לַ/יהוָה֒ הִמּ֧וֹל ל֣/וֹ כָל זָכָ֗ר וְ/אָז֙ יִקְרַ֣ב לַ/עֲשֹׂת֔/וֹ וְ/הָיָ֖ה כְּ/אֶזְרַ֣ח הָ/אָ֑רֶץ וְ/כָל עָרֵ֖ל לֹֽא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/048.yaml
  text: If a sojourner resides with you and keeps the Passover to Yahweh[a], every male belonging to him must be circumcised; then he may come near to keep it, and he shall be like a native of the land[c][b]. But no uncircumcised person may eat of it.
translation:
  language: ru
  text: Если переселенец, живущий среди вас, совершает Пасху в честь Яхве[a], пусть у него будут обрезаны все мужчины. Тогда он сможет приступить к её совершению и будет как коренной житель страны. Но ни один необрезанный не должен есть её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога, переданное в еврейском тексте четырьмя согласными יהוה (YHWH).
    reason: alternative_reading
lexical_decisions:
- source_word: גֵּר
  choice: переселенец
  rationale: Обозначает не случайного путника, а некоренного жителя, постоянно живущего среди Израиля; «переселенец» естественно передаёт этот общественно-правовой статус.
- source_word: יָגוּר אִתְּךָ
  choice: живущий среди вас
  rationale: Глагол גור указывает на проживание в качестве пришельца; форма единственного числа «тебя» в законодательном обращении естественно передана собирательным «вас».
- source_word: וְעָשָׂה פֶסַח
  choice: совершает Пасху
  rationale: Буквально «делает Пасху»; «совершает» подходит к обрядовому празднованию и не добавляет отсутствующего в еврейском тексте значения желания.
- source_word: לַיהוָה
  choice: в честь Яхве
  rationale: Предлог ל выражает направленность или посвящение обряда; «в честь» звучит естественно по-русски, а имя Яхве передаёт тетраграмматон.
- source_word: הִמּוֹל לוֹ כָל זָכָר
  choice: пусть у него будут обрезаны все мужчины
  rationale: Инфинитив абсолютный имеет предписывающую силу; формулировка сохраняет отнесённость всех мужчин к дому или группе переселенца, не уточняя сверх текста характер принадлежности.
- source_word: וְאָז יִקְרַב לַעֲשֹׂתוֹ
  choice: тогда он сможет приступить к её совершению
  rationale: קרב здесь означает допуск к участию после выполнения условия, а не только физическое приближение; местоимение относится к Пасхе.
- source_word: כְּאֶזְרַח הָאָרֶץ
  choice: как коренной житель страны
  rationale: אֶזְרַח обозначает местного, полноправного уроженца; перевод сохраняет правовое сравнение без расширения его на все возможные сферы статуса.
- source_word: וְכָל עָרֵל לֹא יֹאכַל בּוֹ
  choice: ни один необрезанный не должен есть её
  rationale: Мужской единственный עָרֵל выражает общее правило о необрезанном мужчине; отрицательная форма передаёт запрет на участие в пасхальной трапезе.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное Божье имя, поэтому оно передано непосредственно как «Яхве», без замены титулом.
- issue: Допуск переселенца к Пасхе
  choice: Участие допускается после обрезания всех мужчин, относящихся к его дому или группе; после этого он уподобляется коренному жителю в данном контексте.
  alternative: Безусловное этническое исключение; устранение всех границ заветного сообщества
  rationale: Еврейский текст одновременно утверждает возможность включения и конкретное условие участия. Перевод сохраняет оба положения, не вводя более поздних богословских выводов.
- issue: Сфера выражения «как коренной житель страны»
  choice: Сохранено общее сравнение без поясняющего ограничения в основном тексте.
  alternative: Явно ограничить равенство только пасхальной трапезой; распространить его на весь правовой статус
  rationale: Непосредственный контекст относится к Пасхе, однако само выражение сформулировано шире; перевод не разрешает эту напряжённость за автора.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксис сделан понятным для широкого читателя; сохранены ритуально-правовые термины и условная структура оригинала.
