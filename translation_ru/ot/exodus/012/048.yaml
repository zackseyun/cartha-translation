review_pass:
  verdict: revise
  source_fidelity: В целом перевод точно передаёт условие для участия переселенца в Пасхе, обязательность обрезания всех принадлежащих ему лиц мужского пола, последующий допуск и запрет для необрезанного. «В честь Яхве» допустимо передаёт посвящённость, выраженную לַיהוָה. Однако «станет как» несколько сильнее подразумевает изменение статуса, тогда как כְּאֶזְרַח означает «будет/окажется как коренной житель» в результате соблюдения названного условия.
  naturalness: Текст литературный и понятный. Перестановка определения «живущий среди вас» после слова «переселенец» делает условную конструкцию более естественной. Замена «станет как» на «будет как» одновременно естественнее и ближе к формулировке оригинала.
  terminology: «Переселенец» удачно передаёт גֵּר как постоянно проживающего некоренного человека; «Яхве», «Пасха», «обрезаны», «коренной житель» уместны в современном литературном и законодательно-ритуальном регистре. Сноска к имени Яхве корректна и её якорь поставлен непосредственно после имени.
