base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/023.yaml
  text: For Yahweh will pass through to strike Egypt[a], and when he sees the blood on the lintel and on the two doorposts[b], Yahweh will pass over the doorway and will not allow the destroyer to enter your houses to strike.
translation:
  language: ru
  text: И пройдёт Яхве, чтобы поразить Египет; и, увидев кровь на притолоке и на обоих дверных косяках, Яхве пройдёт мимо дверного проёма[a] и не позволит губителю[b] войти в ваши дома, чтобы поразить вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пощадит» либо «защитит». Здесь употреблён еврейский глагол, связанный с названием праздника Песах.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский текст не уточняет, кто такой «губитель»; некоторые понимают под ним ангела, исполняющего суд.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: וְעָבַר
  choice: пройдёт
  rationale: Глагол עבר здесь обозначает прохождение по Египту с целью суда; он намеренно отличён от последующего פסח.
- source_word: לִנְגֹּף
  choice: чтобы поразить
  rationale: נגף обозначает поражение в контексте смертельного суда; «поразить» ясно и сохраняет серьёзность действия.
- source_word: וְרָאָה
  choice: увидев
  rationale: Форма продолжает будущую последовательность и естественно выражает обстоятельство, предшествующее следующему действию.
- source_word: הַמַּשְׁקוֹף
  choice: притолока
  rationale: Точный и общеупотребительный русский термин для верхней горизонтальной части дверного проёма.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: оба косяка
  rationale: Обозначает две вертикальные боковые части дверного проёма; эта формулировка естественна по-русски.
- source_word: וּפָסַח
  choice: минует
  rationale: Передаёт движение мимо входа и сохраняет связь с повествованием о Песахе, не сводя многозначность глагола исключительно к «пощадит» или «защитит».
- source_word: עַל הַפֶּתַח
  choice: этот вход
  rationale: פתח обозначает вход или дверной проём; указательное «этот» естественно отсылает к отмеченному кровью входу.
- source_word: וְלֹא יִתֵּן
  choice: не позволит
  rationale: נתן с инфинитивом здесь идиоматически выражает разрешение или допущение.
- source_word: הַמַּשְׁחִית
  choice: губителю
  rationale: Сохраняет определённое обозначение действующего лица, не уточняя его природу сверх еврейского текста.
- source_word: אֶל בָּתֵּיכֶם לִנְגֹּף
  choice: войти в ваши дома, чтобы поразить вас
  rationale: Объект последнего «поразить» в еврейском подразумевается; «вас» делает русскую фразу ясной и передаёт контекстуальный смысл, не называя первенцев прямо.
theological_decisions:
- issue: Соотношение Яхве и «губителя»
  choice: 'Сохранить их грамматически различными: Яхве проходит в суде и не позволяет губителю войти.'
  alternative: Отождествить губителя с Яхве либо уточнить в основном тексте, что это ангел.
  rationale: Еврейский текст различает יְהוָה и הַמַּשְׁחִית, но не определяет природу губителя; перевод сохраняет эту напряжённость.
- issue: Значение פסח
  choice: «минует» в основном тексте с примечанием о возможных значениях «пощадит» и «защитит».
  alternative: «пощадит» или «защитит».
  rationale: פסח — ключевой глагол повествования о Песахе. Выбранный вариант сохраняет образ прохождения мимо, а примечание показывает реальную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет последовательность действий оригинала; архаизмы избегаются, кроме укоренённого и ясного слова «притолока».
