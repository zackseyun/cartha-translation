  text: וְ/כָכָה֮ תֹּאכְל֣וּ אֹת/וֹ֒ מָתְנֵי/כֶ֣ם חֲגֻרִ֔ים נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם וּ/מַקֶּלְ/כֶ֖ם בְּ/יֶדְ/כֶ֑ם וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/חִפָּז֔וֹן פֶּ֥סַח ה֖וּא לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/011.yaml
  text: 'And this is how you shall eat it: with your waist belted[a], your sandals on your feet, and your staff in your hand. You shall eat it in haste[b]; it is the Passover of Yahweh.'
translation:
  language: ru
  text: 'Ешьте его так: подпоясавшись[a], в сандалиях, с посохом в руке. Ешьте его в спешке; это Пасха Яхве.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ваши чресла препоясаны»; то есть одежда подобрана и закреплена поясом, чтобы быть готовыми немедленно отправиться в путь.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «это Пасха для Яхве» или «Пасха, посвящённая Яхве».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָכָה
  choice: так
  rationale: Естественно вводит предписанный способ совершения трапезы и точно передаёт значение «таким образом».
- source_word: תֹּאכְלוּ
  choice: ешьте
  rationale: Повелительное наклонение по-русски ясно передаёт директивную силу формы в контексте установления.
- source_word: מָתְנֵיכֶם חֲגֻרִים
  choice: пусть ваши бёдра будут препоясаны
  rationale: Сохраняет конкретный древний образ одежды, подобранной и закреплённой поясом для немедленного пути; пояснение идиомы вынесено в сноску.
- source_word: נַעֲלֵיכֶם בְּרַגְלֵיכֶם
  choice: сандалии — на ногах
  rationale: «Сандалии» исторически точнее общего «обувь», а русская эллиптическая конструкция естественно воспроизводит перечень состояний готовности.
- source_word: וּמַקֶּלְכֶם בְּיֶדְכֶם
  choice: а посох — в руке
  rationale: «Посох» соответствует дорожному контексту и передаёт מַקֵּל без излишне сниженного оттенка слова «палка».
- source_word: בְּחִפָּזוֹן
  choice: поспешно
  rationale: Передаёт срочность и готовность к немедленному выходу, не добавляя отсутствующей в тексте причины спешки.
- source_word: פֶּסַח
  choice: Пасха
  rationale: Устоявшееся русское название обряда и трапезы; здесь слово определяет происходящее как Пасху.
- source_word: הוּא לַיהוָה
  choice: это Пасха Яхве
  rationale: Сохраняет краткость именной фразы и широкое отношение принадлежности или посвящённости, выраженное לַ; возможная развёрнутая передача отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт присутствующее в еврейском тексте личное имя Бога транслитерацией, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон. «Яхве» непосредственно представляет личное имя и не подменяет его титулом; форма «Иегова» менее вероятно отражает древнее произношение.
- issue: Отношение, выраженное לַיהוָה
  choice: Пасха Яхве
  alternative: Пасха для Яхве; Пасха, посвящённая Яхве
  rationale: Предлог לַ допускает оттенки принадлежности, назначения и посвящения. Краткая родительная конструкция сохраняет эту смысловую ёмкость, а сноска показывает возможное развёртывание.
- issue: Образ מָתְנֵיכֶם חֲגֻרִים
  choice: бёдра будут препоясаны
  alternative: будьте одеты и готовы к пути
  rationale: Буквальный телесный образ важен для сцены исхода; перевод не заменяет его толкованием, но объясняет практический смысл в сноске.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным звучанием. Императивы переданы прямо; параллельный перечень оформлен естественно для русского языка. Архаизирующее «чресла» исключено, однако исходный образ препоясывания сохранён.
