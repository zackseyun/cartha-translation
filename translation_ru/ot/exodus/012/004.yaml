base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/004.yaml
  text: And if the household is too small for a lamb[a], then he and his nearest neighbor shall take one according to the number of persons; each man according to what he can eat[b], you shall count for the lamb.
translation:
  language: ru
  text: Если же семья слишком мала для ягнёнка[a], пусть он и его ближайший сосед возьмут ягнёнка по числу людей. Рассчитывайте на ягнёнка, исходя из того, сколько может съесть каждый[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское שֶׂה может обозначать животное из мелкого скота — овцу или козу; «ягнёнок» выбран здесь как естественное обозначение в пасхальном контексте.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «каждого по тому, сколько он может съесть, учитывайте при расчёте на ягнёнка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְעַט הַבַּיִת מִהְיֹת מִשֶּׂה
  choice: семья слишком мала для целого ягнёнка
  rationale: הַבַּיִת здесь обозначает не здание, а домочадцев; сочетание יִמְעַט ... מִהְיֹת передаёт недостаточность числа едоков для одного животного. Слово «целого» естественно выражает подразумеваемый смысл, не меняя условия.
- source_word: שֶׂה
  choice: ягнёнок
  rationale: В данном пасхальном контексте это ясное и привычное русское обозначение, хотя еврейское слово шире и может означать одну голову мелкого скота — овцу или козу; эта широта отмечена в сноске.
- source_word: וְלָקַח הוּא וּשְׁכֵנוֹ הַקָּרֹב אֶל־בֵּיתוֹ
  choice: пусть глава семьи вместе со своим ближайшим соседом возьмёт одного
  rationale: Местоимение הוּא соотносится с представителем упомянутого дома; «глава семьи» делает эту связь понятной по-русски. «Одного» восполняет подразумеваемый объект, а «ближайший сосед» естественно передаёт הַקָּרֹב אֶל־בֵּיתוֹ.
- source_word: בְּמִכְסַת נְפָשֹׁת
  choice: сообразуясь с числом людей
  rationale: מִכְסָה указывает на установленное число или долю, а נְפָשֹׁת здесь означает людей, а не отделённые от тела души.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: по тому, сколько каждый может съесть
  rationale: Буквально выражение говорит о каждом «по мере его еды»; русский вариант передаёт распределительный смысл и учитываемую способность каждого съесть свою долю.
- source_word: תָּכֹסּוּ עַל־הַשֶּׂה
  choice: рассчитывайте число участников на ягнёнка
  rationale: Редкий глагол в контексте означает подсчёт или определение числа людей применительно к одному животному. Перевод сохраняет расчётный смысл и множественное число обращения.
