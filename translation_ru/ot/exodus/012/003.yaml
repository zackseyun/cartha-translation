  source_fidelity: 'Смысл в целом передан точно: обращение ко всей общине, дата, распределительное предписание, широкое значение שֶׂה и различие между «отчим домом» и домашним хозяйством сохранены. Передача שֶׂה как «животное из мелкого скота» особенно оправданна, поскольку в Исх. 12:5 допускаются и овца, и коза.'
  naturalness: Сочетание «на отцовский дом» в современном литературном русском звучит неестественно и может быть понято как направление действия. «Для отчего дома» ясно и естественно обозначает семейно-родовую единицу. Повтор «по одному» лучше сохранить перед обоими упоминаниями животного, чтобы явнее отразить повтор שֶׂה и распределительный строй еврейского текста.
  terminology: «Община Израиля», «животное из мелкого скота», «отчий дом» и «семья» уместны. «Отчий дом» точнее и литературнее, чем «отцовский дом», при этом не сводит выражение к зданию.
