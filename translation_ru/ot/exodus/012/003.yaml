revisions:
- from: 'Скажите всей общине Израиля: «В десятый день этого месяца пусть каждый возьмёт себе по одному животному из мелкого скота[a] на отцовский дом — по одному на семью.»'
  to: 'Скажите всей общине Израиля: «В десятый день этого месяца пусть каждый возьмёт себе по одному животному из мелкого скота[a] для отчего дома — по одному животному на семью».'
  rationale: Исправлена неестественная конструкция «на отцовский дом» на «для отчего дома» и восстановлен повтор «по одному животному» во второй части. Это улучшает русский синтаксис и сохраняет распределительный параллелизм исходного текста, не сужая значение שֶׂה до ягнёнка.
