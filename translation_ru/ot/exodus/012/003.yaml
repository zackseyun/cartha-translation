  yaml_path: translation/ot/exodus/012/003.yaml
  text: Speak to all the congregation of Israel[a], saying, ‘On the tenth day of this month each man shall take for himself a lamb according to his fathers’ house, a lamb for the household.’
translation:
  language: ru
  text: 'Скажите всей общине Израиля: «В десятый день этого месяца пусть каждый возьмёт себе по одному животному из мелкого скота[a] для отчего дома — по одному животному на семью».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово שֶׂה обозначает животное из мелкого скота — овцу или козу; ср. стих 5.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ אֶל כָּל עֲדַת יִשְׂרָאֵל
  choice: Скажите всей общине Израиля
  rationale: Множественное повеление передано естественной русской формой «скажите»; עֵדָה обозначает соборную общину Израиля.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Стандартная еврейская формула введения речи в современном русском естественно передаётся пунктуационно, без тяжеловесного «говоря».
- source_word: בֶּעָשֹׂר לַחֹדֶשׁ הַזֶּה
  choice: В десятый день этого месяца
  rationale: Слово «день» добавлено как подразумеваемое, чтобы дата звучала ясно и естественно по-русски.
- source_word: וְיִקְחוּ לָהֶם אִישׁ
  choice: пусть каждый возьмёт себе
  rationale: Имперфект имеет предписывающее значение; distributивное אִישׁ естественно передано словом «каждый» без ненужного ограничения по полу.
- source_word: שֶׂה
  choice: животное из мелкого скота
  rationale: שֶׂה может обозначать как овцу, так и козу; контекст следующего стиха прямо допускает оба вида. Основной текст сохраняет эту широту, а не сужает значение до «ягнёнка».
- source_word: לְבֵית אָבֹת
  choice: на отцовский дом
  rationale: Формулировка сохраняет патрилинейную семейно-родовую структуру выражения בֵּית אָבוֹת; «отцовский дом» здесь означает родственную группу, а не здание.
- source_word: שֶׂה לַבָּיִת
  choice: по одному на семью
  rationale: בַּיִת здесь обозначает домашнюю семью; повтор שֶׂה передан «по одному», чтобы сохранить распределительный смысл без неестественного повтора.
theological_decisions:
- issue: Вид пасхального животного
  choice: животное из мелкого скота
  alternative: ягнёнок
  rationale: 'Перевод не ограничивает שֶׂה овцой: в Исх. 12:5 уточняется, что животное можно взять из овец или коз. Это лексическое, а не конфессиональное решение.'
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксис упрощён относительно буквальной еврейской формулы, но распределительная структура предписания сохранена. Термин «отцовский дом» оставлен как социально-родовое обозначение и отличён от более узкого «семья» во второй части стиха.
