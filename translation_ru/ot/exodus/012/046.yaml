  text: בְּ/בַ֤יִת אֶחָד֙ יֵאָכֵ֔ל לֹא תוֹצִ֧יא מִן הַ/בַּ֛יִת מִן הַ/בָּשָׂ֖ר ח֑וּצָ/ה וְ/עֶ֖צֶם לֹ֥א תִשְׁבְּרוּ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/046.yaml
  text: It shall be eaten in one house; you shall not take any of the meat outside the house[a], and you shall not break a bone of it.
translation:
  language: ru
  text: Его следует есть в одном доме[a]; не выносите из дома наружу ничего из мяса и не ломайте ни одной его кости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в одном домохозяйстве». Еврейское слово может обозначать как дом-здание, так и живущих в нём домочадцев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַיִת אֶחָד
  choice: в одном доме
  rationale: בַּיִת может означать как здание, так и домочадцев. Однако последующее запрещение выносить мясо из дома наружу делает здесь основным конкретное пространственное значение.
- source_word: יֵאָכֵל
  choice: следует есть его
  rationale: Нифаль несовершенного вида выражает предписание в пассивной форме. Русская безличная конструкция передаёт нормативную силу естественнее буквального «он будет съеден»; местоимение проясняет подразумеваемый объект.
- source_word: לֹא תוֹצִיא ... מִן הַבָּשָׂר חוּצָה
  choice: не выносите ... наружу ничего из мяса
  rationale: Каузатив יצא означает «выносить», חוּצָה указывает движение наружу, а частичное מִן при בָּשָׂר передано сочетанием «ничего из мяса».
- source_word: מִן הַבַּיִת
  choice: из дома
  rationale: Предлог מִן обозначает исходную точку движения; вместе с «наружу» перевод сохраняет и источник, и направленность.
- source_word: וְעֶצֶם לֹא תִשְׁבְּרוּ בוֹ
  choice: и не ломайте в нём ни одной кости
  rationale: Единственное עֶצֶם в отрицательной конструкции имеет распределительный смысл. בּוֹ буквально передано как «в нём», с отсылкой к пасхальной жертве.
theological_decisions:
- issue: Референт местоимения בּוֹ
  choice: пасхальная жертва, выражено местоимением «в нём»
  alternative: уточнить как «у ягнёнка» или передать «его кости»
  rationale: Мужское единственное местоимение отсылает к обсуждаемой пасхальной жертве, но сам стих не называет её ягнёнком. Местоименная передача не вносит более узкого обозначения и сохраняет связь с контекстом.
translation_notes:
  register: Современный литературный русский язык с ясным предписывающим тоном. Формы множественного числа «не выносите», «не ломайте» отражают еврейские формы 2-го лица множественного числа; архаизмы и конфессионально обусловленные уточнения исключены.
