  text: And if a man strikes his male servant or his female servant with a rod[a], and the servant dies under his hand, he must surely be avenged.
translation:
  language: ru
  text: Если кто ударит своего раба или свою рабыню палкой и раб или рабыня умрёт под его рукой, за него непременно должно быть отомщено.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «виновный непременно должен быть наказан». Буквальнее: «за него непременно должно быть отомщено»; в еврейском это усиленная правовая формула.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Если кто
  rationale: Вводит условную норму казуистического права; русское «если» естественно передаёт условие, а связь с предшествующим контекстом не требует отдельного «и».
- source_word: יַכֶּה אִישׁ
  choice: кто ударит
  rationale: נכה имеет широкое значение «ударить»; неопределённо-личное «кто» естественно для современного русского законодательного стиля и не меняет мужской формы участника в исходном тексте.
- source_word: עַבְדּוֹ אוֹ אֶת אֲמָתוֹ
  choice: своего раба или свою рабыню
  rationale: В данном правовом контексте слова обозначают людей в рабском, а не просто служебном положении; пара «раб — рабыня» точно и ясно сохраняет различение пола.
- source_word: בַּשֵּׁבֶט
  choice: палкой
  rationale: שֵׁבֶט здесь обозначает орудие побоев. «Палка» в современном русском яснее и естественнее архаизирующего «жезл» или неоднозначного «посох».
- source_word: וּמֵת תַּחַת יָדוֹ
  choice: и тот умрёт от его руки
  rationale: «Тот» устраняет местоименную неясность, указывая на раба или рабыню; «от его руки» сохраняет древнееврейский образ и выражает смерть непосредственно вследствие нанесённых хозяином ударов.
- source_word: נָקֹם יִנָּקֵם
  choice: за него непременно должно быть отомщено
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает обязательность действия. Страдательная конструкция сохраняет буквальное значение «быть отмщённым», не уточняя не названную здесь меру наказания.
theological_decisions:
- issue: Характер правового последствия в נָקֹם יִנָּקֵם
  choice: за него непременно должно быть отомщено
  alternative: виновный непременно должен быть наказан
  rationale: Исходный текст настойчиво требует возмездия, но в этом стихе не определяет его конкретный судебный вид. Основной перевод сохраняет эту смысловую напряжённость и не отождествляет возмездие с какой-либо одной мерой наказания.
translation_notes:
  register: Современный литературный русский с ясной правовой формулировкой. Слова «раб» и «рабыня» прямо передают обозначенный в тексте несвободный статус. Формула возмездия оставлена несколько непривычной, чтобы сохранить лексическую и юридическую неопределённость оригинала.
