lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Сохраняет условную форму казуистического закона.
- source_word: אַחֶרֶת יִקַּח לוֹ
  choice: он возьмёт себе другую жену
  rationale: Глагол לקח в данном брачном контексте означает взять женщину в жёны; «себе» передаёт לוֹ, а «жену» естественно восполняет подразумеваемое существительное.
- source_word: שְׁאֵרָהּ
  choice: пищи
  rationale: В перечне обязанностей мужа редкое слово обозначает материальное содержание, прежде всего пищу; этот вариант ясен и не перегружен толкованием.
- source_word: כְּסוּתָהּ
  choice: одежды
  rationale: Передаёт обычное значение существительного — одежда или покрытие — естественным современным русским словом.
- source_word: וְעֹנָתָהּ
  choice: супружеской близости
  rationale: Термин обозначает обязанность мужа поддерживать брачные интимные отношения; формулировка точна, понятна и сохраняет достойный регистр.
- source_word: לֹא יִגְרָע
  choice: не должен лишать
  rationale: В применении ко всем трём обязанностям по-русски естественно выражает запрет урезать или не предоставлять положенное.
theological_decisions:
- issue: Референт женских суффиксов в שְׁאֵרָהּ, כְּסוּתָהּ и וְעֹנָתָהּ
  choice: первую[a]
  alternative: её
  rationale: По контексту стиха 9 речь идёт о прежней женщине, чьи права нельзя урезать после появления другой жены. Слово «первую» проясняет референт, а сноска отмечает, что в еврейском тексте стоит только местоименный суффикс.
translation_notes:
  register: Современный литературный русский язык с ясным юридическим оттенком. Сохранена условная конструкция; редкий термин עֹנָה передан достойно и конкретно, без архаизма «супружеские права» и без клинической прямоты.
