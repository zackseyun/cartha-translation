  text: וְ/כִֽי יְרִיבֻ֣/ן אֲנָשִׁ֔ים וְ/הִכָּה אִישׁ֙ אֶת רֵעֵ֔/הוּ בְּ/אֶ֖בֶן א֣וֹ בְ/אֶגְרֹ֑ף וְ/לֹ֥א יָמ֖וּת וְ/נָפַ֥ל לְ/מִשְׁכָּֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/018.yaml
  text: If men quarrel and one strikes his neighbor with a stone or with his fist[a], and he does not die but is confined to bed,
translation:
  language: ru
  text: Если мужчины поссорятся и один ударит другого камнем или кулаком, а тот не умрёт, но сляжет в постель[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «упадёт на постель» — то есть из-за ранения будет вынужден лежать в постели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Если
  rationale: Вводит казуистическое правовое условие; «если» естественно для русского законодательного изложения.
- source_word: יְרִיבֻן אֲנָשִׁים
  choice: мужчины поссорятся
  rationale: ריב обозначает спор или ссору, способную перейти в насилие; אֲנָשִׁים здесь указывает на мужчин — участников случая.
- source_word: וְהִכָּה אִישׁ אֶת רֵעֵהוּ
  choice: и один ударит другого
  rationale: Естественно передаёт индивидуализацию одного из участников; רֵעַ в данном взаимном контексте означает другого участника, без необходимости вводить более узкое «ближнего».
- source_word: בְּאֶבֶן אוֹ בְאֶגְרֹף
  choice: камнем или кулаком
  rationale: Предлог בְּ имеет инструментальное значение; אֶגְרֹף означает «кулак».
- source_word: וְלֹא יָמוּת
  choice: а тот не умрёт
  rationale: Русское «а» ясно выражает контекстуальное противопоставление; «тот» однозначно отсылает к пострадавшему.
- source_word: וְנָפַל לְמִשְׁכָּב
  choice: но сляжет в постель
  rationale: Сохраняет образное выражение оригинала «падёт/сляжет в постель» и естественно сообщает, что пострадавший оказался прикован к постели из-за травмы.
