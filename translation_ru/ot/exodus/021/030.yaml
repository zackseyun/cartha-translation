base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/030.yaml
  text: If a ransom is imposed on him[a], then he shall give the redemption price for his life according to all that is imposed on him.
translation:
  language: ru
  text: Если на него будет наложен выкуп[a], он должен уплатить выкупную цену за свою жизнь — согласно всему, что будет на него наложено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если на него возложат выкупной платёж…» В еврейском тексте употреблены два родственных, но различных слова: כֹּפֶר («выкуп») и פִּדְיֹן («выкупная цена»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Передаёт условие в продолжении закона об ответственности владельца быка.
- source_word: כֹּפֶר
  choice: выкуп
  rationale: Обозначает плату, позволяющую избежать установленного наказания; сохраняет юридический смысл без привнесения культовой терминологии.
- source_word: יוּשַׁת עָלָיו
  choice: будет наложен на него
  rationale: Пассивная конструкция с שׁית и עַל выражает возложение юридического обязательства.
- source_word: וְנָתַן
  choice: пусть он отдаст
  rationale: Естественно передаёт предписание и сохраняет базовое значение глагола «дать».
- source_word: פִּדְיֹן נַפְשׁוֹ
  choice: за свою жизнь выкупную цену
  rationale: Сохраняет отличие פִּדְיֹן от כֹּפֶר и передаёт נֶפֶשׁ в данном судебном контексте как «жизнь».
- source_word: כְּכֹל אֲשֶׁר יוּשַׁת עָלָיו
  choice: всю сумму, которая будет на него наложена
  rationale: Передаёт требование уплатить полностью назначенный размер выкупа; добавление «сумму» делает юридический смысл ясным и естественным по-русски.
theological_decisions:
- issue: Характер платежа при ответственности, влекущей смертную казнь
  choice: Юридический платёж назван «выкупом» и «выкупной ценой» без указания на нравственную невиновность или культовое искупление.
  alternative: Передать оба еврейских термина словом «штраф» либо использовать выраженную жертвенно-искупительную лексику.
  rationale: Еврейский текст говорит о плате, посредством которой сохраняется жизнь виновного, но использует два родственных и всё же различных юридико-выкупных термина.
translation_notes:
  register: Современный литературный русский язык с ясной юридической формулировкой. Повтор глагола «наложить» сохранён вслед за еврейским текстом; лексическое различие между כֹּפֶר и פִּדְיֹן также сохранено.
