  language: ru
  text: Но если случится вред[a], то отдай жизнь за жизнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тяжкий вред»; возможно также: «смертельный исход». Еврейское слово может обозначать тяжкий вред или бедствие; толкователи расходятся во мнениях, говорится ли здесь о вреде вообще или именно о смерти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Передаёт условное противопоставление предыдущему стиху и естественно звучит по-русски.
- source_word: אָסוֹן
  choice: причинён вред
  rationale: Сохраняет широту еврейского существительного, которое может обозначать тяжкий вред, бедствие или смертельный исход, не сужая смысл без достаточных оснований.
- source_word: יִהְיֶה
  choice: причинён
  rationale: В сочетании «если причинён вред» естественно передаёт наступление вреда в русском юридическом контексте, хотя буквально глагол означает «будет/произойдёт».
- source_word: וְנָתַתָּה
  choice: то отдай
  rationale: Сохраняет буквальное значение «дать» и повелительно-правовую силу формы; вариант «заплати» мог бы необоснованно предположить денежное возмещение.
- source_word: נֶפֶשׁ
  choice: жизнь
  rationale: В формуле воздаяния слово обозначает жизнь, а не отвлечённую «душу»; выбор сохраняет смысл и симметрию выражения.
- source_word: תַּחַת
  choice: за
  rationale: Кратко и естественно выражает соответствие или замещение в устойчивой правовой формуле «жизнь за жизнь».
theological_decisions:
- issue: Объём и референт вреда, обозначенного словом אָסוֹן
  choice: Передать широко как «вред», не уточняя, кому именно он причинён и обязательно ли означает смерть.
  alternative: «тяжкое увечье» или «смертельный исход»
  rationale: Сам стих не называет прямо ни пострадавшего, ни точную степень последствий. Широкая передача сохраняет спорность контекста и не навязывает одно толкование.
translation_notes:
  register: Современный литературный русский язык с лаконичной, торжественно-правовой формулировкой. Сохранена традиционная и ясная симметрия «жизнь за жизнь»; неоднозначность אָסוֹן вынесена в примечание.
