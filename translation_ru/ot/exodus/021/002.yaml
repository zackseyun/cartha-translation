lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: Частица вводит условие казуистического закона. «Если» естественно для русского юридического изложения; возможное «когда» отмечено в сноске.
- source_word: תִקְנֶה
  choice: ты купишь
  rationale: Глагол קנה здесь обозначает покупку или приобретение; в контексте регулируемой подневольной службы «купишь» передаёт коммерческий характер действия прямо и ясно.
- source_word: עֶבֶד עִבְרִי
  choice: раба-еврея
  rationale: עֶבֶד может означать раба или слугу, но упоминание покупки и последующего освобождения подчёркивает несвободный статус. עִבְרִי передано именно как «еврей», а не более широким «израильтянин».
- source_word: שֵׁשׁ שָׁנִים יַעֲבֹד
  choice: он будет служить шесть лет
  rationale: Будущее изъявительное естественно передаёт предписание в русском тексте закона, а «служить» сохраняет смысл עבד без тяжеловесного повтора слова «раб».
- source_word: וּבַשְּׁבִעִת
  choice: а на седьмой год
  rationale: Союз передан как противопоставительное «а»; слово «год», подразумеваемое еврейским текстом, восстановлено ради естественности и ясности по-русски.
- source_word: יֵצֵא לַחָפְשִׁי
  choice: выйдет на свободу
  rationale: Формулировка сохраняет еврейский образ выхода и одновременно ясно выражает освобождение.
- source_word: חִנָּם
  choice: без платы
  rationale: Передаёт отсутствие требуемой платы за освобождение, не добавляя отсутствующего в тексте специального термина «выкуп».
theological_decisions:
- issue: Передача עֶבֶד в законе о купленном человеке
  choice: раб
  alternative: слуга; зависимый слуга
  rationale: Контекст покупки, установленного срока службы и выхода на свободу указывает на юридически несвободное положение. «Раб» не смягчает этот статус, тогда как сноска сохраняет более широкий лексический диапазон слова.
translation_notes:
  register: Современный литературный русский язык с лаконичным правовым ритмом. Местоимение «ты» выражено для ясности обращения в единственном числе. Формулировки избегают как архаизации, так и смягчения обозначенного в тексте рабского статуса.
