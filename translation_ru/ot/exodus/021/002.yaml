  - marker: b
    text: Еврейское слово может также переводиться как «слуга», однако здесь речь идёт о купленном человеке, который до освобождения находится в несвободном положении.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «даром» или «бесплатно», то есть за освобождение не требуется платы.'
