  text: But if he did not lie in wait[a], and God caused it to come into his hand, then I will appoint for you a place to which he may flee.
translation:
  language: ru
  text: Но если он не подстерегал его, а Бог сделал так, что тот оказался в его руках[a], то Я назначу тебе место, куда он сможет бежать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «а Бог устроил [это] в его руке». Еврейский оборот описывает непреднамеренную смерть как событие, происшедшее через действие человека и в пределах Божьего провидения.'
    reason: Поясняет идиоматическое значение אִנָּה לְיָדוֹ, сохраняя прямое Божье участие и человеческое действие без богословского истолкования сверх текста.
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Но если
  rationale: Оборот вводит противопоставленный предыдущему стиху условный случай; по-русски условная конструкция звучит ясно и естественно.
- source_word: לֹא צָדָה
  choice: не подстерегал его
  rationale: В данном правовом контексте צדה обозначает отсутствие засады и предумышленного намерения, а не буквальную охоту.
- source_word: וְהָאֱלֹהִים
  choice: а Бог
  rationale: 'Здесь אֱלֹהִים естественнее понимать как Бога: речь идёт о провиденциально допущенном событии, а не о действии судей.'
- source_word: אִנָּה לְיָדוֹ
  choice: попустил тому погибнуть от его руки
  rationale: Передаёт одновременно Божье провидение, смерть подразумеваемого потерпевшего и человеческую посредствующую роль, не превращая непредумышленное деяние в умышленное убийство.
- source_word: וְשַׂמְתִּי לְךָ מָקוֹם
  choice: то Я назначу тебе место
  rationale: «Назначу» естественно передаёт установление определённого места убежища; «тебе» сохраняет форму еврейского текста.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: куда тот сможет убежать
  rationale: Сохраняет направительное значение שָׁמָּה и выражает предоставленную законом возможность бегства.
theological_decisions:
- issue: Божье участие в непредумышленной смерти
  choice: Бог попустил тому погибнуть от его руки
  alternative: Бог подвёл его под его руку / Бог предал его в его руку
  rationale: Формулировка сохраняет напряжение текста между отсутствием умысла у человека и Божьим провидением, не приписывая Богу нравственную виновность и не устраняя Его участие.
- issue: Значение אֱלֹהִים
  choice: Бог
  alternative: судьи
  rationale: Контекст случайного, не подготовленного человеком события поддерживает прямое значение «Бог»; судебное истолкование здесь менее вероятно.
translation_notes:
  register: Современный литературный русский язык с достоинством правового текста. Местоимение «Я» написано с прописной буквы как прямая речь Бога. Указательные «тому» и «тот» различают погибшего и человека, которому предоставляется убежище.
