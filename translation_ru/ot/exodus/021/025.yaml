  text: ожог за ожог, рана за рану, кровоподтёк за кровоподтёк.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּוִיָּה
  choice: ожог
  rationale: Существительное обозначает ожог или оставленный им след. «Ожог» кратко и естественно сохраняет конкретный характер повреждения и ритм правовой формулы.
- source_word: תַּחַת
  choice: за
  rationale: В данном правовом контексте предлог выражает соответствие или возмещение. Русское «за» естественно передаёт краткую формулу равного воздаяния.
- source_word: פֶּצַע
  choice: рана
  rationale: Слово обозначает телесную рану вообще. «Рана» конкретнее, чем более широкое «повреждение», и не сужает смысл до пореза.
- source_word: חַבּוּרָה
  choice: кровоподтёк
  rationale: Существительное обозначает след, полосу, припухлость или кровоподтёк от удара. «Кровоподтёк» — ясный современный эквивалент, передающий видимое повреждение от удара без архаичности слова «рубец».
