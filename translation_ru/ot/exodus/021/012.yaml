lexical_decisions:
- source_word: מַכֵּה
  choice: ударит
  rationale: 'Причастная форма от נכה вводит казуистическую правовую норму: «тот, кто ударит». Будущее совершенного вида естественно передаёт это условное значение в современном русском и не вносит в сам глагол указания на смертельный исход.'
- source_word: אִישׁ
  choice: человека
  rationale: Хотя אִישׁ часто означает взрослого мужчину, в данной правовой формуле слово обозначает человеческую жертву удара. «Человека» сохраняет обычный русский юридический охват, не утверждая без необходимости, что норма относится только к жертве мужского пола.
- source_word: וָמֵת
  choice: так, что тот умрёт
  rationale: Союз с формой от מות обозначает последствие удара. Оборот «так, что тот умрёт» ясно и естественно передаёт результат и устраняет возможную для русского местоименную двусмысленность.
- source_word: מוֹת יוּמָת
  choice: должен быть предан смерти
  rationale: Сочетание абсолютного инфинитива с пассивной глагольной формой усиливает категоричность смертного приговора. «Должен быть предан смерти» сохраняет пассивную юридическую формулировку и обязательность наказания.
theological_decisions:
- issue: Степень категоричности смертного приговора в конструкции מוֹת יוּמָת
  choice: должен быть предан смерти
  alternative: непременно да будет предан смерти
  rationale: Выбранная формулировка передаёт обязательность приговора современным литературным русским языком, не превращая грамматическое усиление в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным юридическим звучанием. Синтаксис приспособлен к русской казуистической формуле; буквальная координация и усиление отражены в сноске.
