lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Передаёт условное продолжение предыдущего правового предписания и связующую силу ו естественным русским оборотом.
- source_word: שְׁלָשׁ אֵלֶּה
  choice: этих трёх обязанностей
  rationale: Выражение указывает на три обязанности, названные в предыдущем стихе; слово «обязанностей» ясно передаёт правовой контекст, не добавляя нового содержания.
- source_word: לֹא יַעֲשֶׂה לָהּ
  choice: не исполнит для неё
  rationale: Глагол עשה буквально означает «делать», а здесь — выполнять три установленные обязанности по отношению к женщине. «Исполнит» естественно звучит в современном русском правовом изложении.
- source_word: וְיָצְאָה
  choice: то она выйдет
  rationale: В законах о рабстве יצא обозначает выход из зависимого положения; следующий оборот прямо уточняет, что речь идёт об освобождении.
- source_word: חִנָּם
  choice: на свободу
  rationale: В данном контексте слово означает безвозмездное освобождение; русский оборот «выйдет на свободу» ясно передаёт смысл отпущения.
- source_word: אֵין כָּסֶף
  choice: без выкупа
  rationale: Фраза подчёркивает, что за освобождение не требуется денежная плата. «Без выкупа» кратко и естественно выражает юридико-экономический смысл.
