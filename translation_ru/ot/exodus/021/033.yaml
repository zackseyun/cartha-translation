  text: And if a man opens a pit[a], or if a man digs a pit and does not cover it, and an ox or a donkey falls into it[b],
translation:
  language: ru
  text: Если кто-нибудь[b] откроет[a] яму или выкопает яму и не накроет её, и туда упадёт бык или осёл,
