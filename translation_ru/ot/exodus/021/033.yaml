    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: Если
  rationale: Вводит условие казуистического закона; начальное וְ связывает этот случай с предыдущими предписаниями, но в русском отдельный стих естественно начинается с «Если».
- source_word: יִפְתַּח
  choice: откроет
  rationale: Буквально «откроет»; вероятно, речь об открытии уже существующей ямы, в отличие от её выкапывания в следующей части.
- source_word: אִישׁ
  choice: кто-нибудь
  rationale: Мужской род единственного числа служит здесь общей формулой казуистического права; «кто-нибудь» естественно передаёт обобщённого участника правового случая без изменения смысла.
- source_word: בּוֹר
  choice: яма
  rationale: Широкое и уместное в данном законе обозначение углубления, опасного для скота; возможное значение «водосборная яма» контекстом не требуется.
- source_word: א֠וֹ כִּי
  choice: или
  rationale: Вводит второй, параллельный вариант правового случая; повторять «если» по-русски необязательно.
- source_word: יִכְרֶה
  choice: выкопает
  rationale: Точно и естественно обозначает создание ямы и сохраняет отличие от «откроет».
- source_word: וְ/לֹא יְכַסֶּנּוּ
  choice: и не накроет её
  rationale: Глагол обозначает физическое закрытие ямы; местоимение согласовано с русским словом «яма».
- source_word: וְ/נָפַל
  choice: и ... упадёт
  rationale: В последовательности условия форма описывает возможное последующее событие; русское будущее естественно для законодательной формулы.
- source_word: שָׁמָּה
  choice: туда
  rationale: Сохраняет направительное значение еврейского наречия и естественно относится к ранее названной яме.
- source_word: שּׁוֹר
  choice: бык
  rationale: Обычное современное русское обозначение единичного животного крупного рогатого скота; архаичное «вол» могло бы неоправданно уточнять, что животное кастрировано.
- source_word: א֥וֹ חֲמוֹר
  choice: или осёл
  rationale: Точное и современное название обычного домашнего вьючного животного.
