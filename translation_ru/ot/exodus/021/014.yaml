  yaml_path: translation/ot/exodus/021/014.yaml
  text: But if a man schemes against his neighbor to kill him by treachery[c][b][a], you shall take him even from my altar to die.
translation:
  language: ru
  text: Но если человек злоумышляет[a] против своего ближнего, чтобы коварно[b] убить его, забери его даже от Моего жертвенника[c] для предания смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «самонадеянно выступает»; еврейский глагол подчёркивает сознательное, намеренное действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с хитростью», «обманным путём».'
    reason: lexical_alternative
  - marker: c
    text: То есть даже если этот человек ищет убежища у жертвенника, его следует оттуда забрать для исполнения приговора.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: Но если
  rationale: Союз вводит противопоставленный предыдущему закону условный случай; «но если» естественно передаёт обе функции.
- source_word: יָזִד
  choice: злоумышляет
  rationale: Глагол выражает намеренное, дерзновенное действие, а в контексте убийства — сознательный злой умысел; выбор сохраняет значение преднамеренности, не сливая его с указанием на коварный способ действия.
- source_word: אִישׁ
  choice: человек
  rationale: В русском юридическом изложении «человек» естественно передаёт единичного участника нормы без ненужного указания на пол.
- source_word: עַל רֵעֵהוּ
  choice: против своего ближнего
  rationale: Сохраняет направленность враждебного действия и общинно-этическое значение רֵעַ.
- source_word: לְהָרְגוֹ
  choice: чтобы … убить его
  rationale: Инфинитив передаёт цель умышленного действия; «убить» сохраняет прямой смысл корня הרג, тогда как противоправность определяется всем контекстом.
- source_word: בְעָרְמָה
  choice: коварно
  rationale: Передаёт хитрый, обманный характер действия в естественной современной русской форме.
- source_word: מֵעִם מִזְבְּחִי
  choice: даже от Моего жертвенника
  rationale: '«От» передаёт удаление от места у жертвенника, а «даже» раскрывает контекстуальный акцент: священное место не защищает преднамеренного убийцу.'
- source_word: תִּקָּחֶנּוּ
  choice: забери виновного
  rationale: Повелительная форма сохраняет обращённое к ответственному лицу предписание; «виновного» естественно уточняет референт местоименного суффикса и избегает тяжёлого повторения «его».
- source_word: לָמוּת
  choice: и предай смерти
  rationale: В данном правовом контексте инфинитив обозначает назначение взятия — казнь; русская формула ясно передаёт результат, не создавая двусмысленного оборота «взять на смерть».
theological_decisions:
- issue: Даёт ли жертвенник убежище преднамеренному убийце
  choice: Текст указывает, что виновного следует забрать даже от жертвенника и предать смерти.
  alternative: Фраза может лишь называть место, откуда обвиняемого забирают, не делая убежище главным предметом нормы.
  rationale: Правовой контекст и упоминание жертвенника подразумевают отказ в защите тому, кто действовал преднамеренно и коварно; основной текст сохраняет эту импликацию, а примечание объясняет её.
translation_notes:
  register: Современный литературный русский с достоинством правовой речи. Формулировка избегает избыточной архаики, сохраняет условную структуру, преднамеренность и коварство как отдельные смысловые признаки.
