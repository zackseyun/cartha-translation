  text: eye for eye[a], tooth for tooth, hand for hand, foot for foot.
translation:
  language: ru
  text: глаз за глаз[a], зуб за зуб, руку за руку, ногу за ногу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глаз вместо глаза, зуб вместо зуба, рука вместо руки, нога вместо ноги».'
    reason: 'Лексическая альтернатива для תַּחַת: «вместо» яснее выражает замещение, тогда как основной вариант «за» сохраняет лаконичную юридическую формулу.'
lexical_decisions:
- source_word: עַיִן
  choice: глаз
  rationale: Существительное обозначает физический глаз. Форма без артикля в русском сохраняет краткость и ритм юридической формулы.
- source_word: תַּחַת
  choice: за
  rationale: В данном правовом контексте предлог выражает соответствующее возмещение или замену, а не пространственное значение «под». Русское «за» естественно передаёт традиционную краткую формулу, не уточняя сверх текста способ возмещения.
- source_word: שֵׁן
  choice: зуб
  rationale: Прямое обозначение физического зуба; выбранная форма сохраняет параллелизм исходного текста.
- source_word: יָד
  choice: руку
  rationale: יָד здесь означает физическую руку. Винительный падеж обусловлен естественным русским оборотом «руку за руку» и сохраняет точное лексическое соответствие.
- source_word: רֶגֶל
  choice: ногу
  rationale: רֶגֶל может обозначать ступню либо ногу в более широком смысле. В русской устойчивой формуле естественно «ногу за ногу»; вариант «ступню» был бы анатомически уже и менее идиоматичен.
theological_decisions:
- issue: Характер правовой формулы
  choice: 'Сохранена краткая формула соразмерного возмещения: «глаз за глаз… ногу за ногу».'
  alternative: 'Разъясняющий перевод: «наказание должно соответствовать причинённому увечью».'
  rationale: Еврейский текст состоит из пар названий частей тела, соединённых תַּחַת. Развёрнутая формулировка преждевременно истолковала бы юридический механизм, которого сам стих прямо не поясняет.
translation_notes:
  register: Современный литературный русский язык; лаконичный, ритмичный и достойный регистр, соответствующий казуистическому праву. Начальная строчная буква сохраняет фрагментарное продолжение перечня из предыдущего стиха.
