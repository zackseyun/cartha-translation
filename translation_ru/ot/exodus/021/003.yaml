  yaml_path: translation/ot/exodus/021/003.yaml
  text: If he comes in by himself[a], he shall go out by himself; if he is married[b], then his wife shall go out with him.
translation:
  language: ru
  text: Если он пришёл один[a], то один и выйдет; если он женат[b], то его жена выйдет вместе с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Древнееврейское выражение буквально связано с его «телом» или «самим собой»; здесь это идиома со значением «один, без сопровождающих».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «если он муж женщины», то есть «если он женат».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגַפּוֹ
  choice: один
  rationale: Редкий древнееврейский оборот в данном юридическом контексте означает, что мужчина пришёл без сопровождающих его членов семьи. «Один» естественно передаёт этот смысл и сохраняет повтор в обеих половинах условия.
- source_word: יָבֹא
  choice: пришёл
  rationale: В контексте речь идёт о поступлении в рабство; прошедшее время естественно для русского условного предложения и образует смысловую пару с будущим «выйдет».
- source_word: יֵצֵא
  choice: пусть … выйдет
  rationale: Глагол обозначает выход на свободу из рабства. Конструкция с «пусть» передаёт предписывающую силу древнееврейского имперфекта в юридическом постановлении.
- source_word: בַּעַל אִשָּׁה
  choice: был женат
  rationale: Буквально-идиоматическое сочетание «муж женщины» означает женатого мужчину. «Был женат» звучит естественно и указывает на его семейное положение при поступлении в рабство.
- source_word: וְיָצְאָה אִשְׁתּוֹ עִמּוֹ
  choice: пусть его жена выйдет вместе с ним
  rationale: Женский глагол согласован с «его жена»; формулировка сохраняет юридическую параллель и ясно говорит, что жена выходит вместе с мужем.
theological_decisions:
- issue: Относится ли постановление к жене, которая уже была с мужчиной при его поступлении в рабство
  choice: 'Фраза сохранена без добавочного пояснения в основном тексте: «если он был женат… жена выйдет вместе с ним».'
  alternative: 'Добавить: «если он пришёл женатым» или «если жена пришла с ним».'
  rationale: Ближайший контекст поддерживает речь о его исходном семейном положении, однако сам стих не повторяет глагол «пришёл» во второй условной части. Перевод не добавляет отсутствующих слов и не снимает эту контекстуальную напряжённость.
translation_notes:
  register: Современный литературный русский язык с краткой, dignified юридической формулировкой. Повтор «один» и пара «пришёл — выйдет» сохраняют структуру оригинала; «пусть … выйдет» передаёт нормативный характер постановления без канцелярской тяжеловесности.
