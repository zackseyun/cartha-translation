  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִ֡ם שׁוֹר֩ נַגָּ֨ח ה֜וּא מִ/תְּמֹ֣ל שִׁלְשֹׁ֗ם וְ/הוּעַ֤ד בִּ/בְעָלָי/ו֙ וְ/לֹ֣א יִשְׁמְרֶ֔/נּוּ וְ/הֵמִ֥ית אִ֖ישׁ א֣וֹ אִשָּׁ֑ה הַ/שּׁוֹר֙ יִסָּקֵ֔ל וְ/גַם בְּעָלָ֖י/ו יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/029.yaml
  text: But if the ox was accustomed to gore from yesterday and the day before[a], and its owner had been warned but did not keep it in, and it kills a man or a woman, the ox shall be stoned[b], and its owner also shall be put to death.
translation:
  language: ru
  text: Но если бык и прежде был бодлив[a], а его хозяин был предупреждён, но не удерживал его, и бык убил мужчину или женщину, то быка следует побить камнями, а его хозяина также предать смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со вчерашнего дня и третьего дня» — еврейское выражение, указывающее на ранее известную, устойчивую склонность животного бодаться.'
    reason: Передача идиомы и повторяющегося характера поведения.
lexical_decisions:
- source_word: שׁוֹר
  choice: бык
  rationale: Обычное и естественное обозначение одной головы крупного рогатого скота в данном правовом контексте; пол животного здесь не является смысловым акцентом.
- source_word: נַגָּח הוּא מִתְּמֹל שִׁלְשֹׁם
  choice: и прежде бодался
  rationale: Причастие и идиома «со вчера и третьего дня» вместе указывают на ранее известную, повторяющуюся склонность животного бодаться. Русское «и прежде бодался» естественно передаёт установленное предшествующее поведение; буквальная форма дана в примечании.
- source_word: וְהוּעַד בִּבְעָלָיו
  choice: его хозяин был предупреждён
  rationale: В правовом контексте пассивная форма выражает доведение до владельца предупреждения или свидетельства об опасном поведении животного.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: не удерживал его
  rationale: Глагол означает охранять или держать под контролем; здесь речь о том, что хозяин не обеспечил надлежащего ограничения опасного животного.
- source_word: וְהֵמִית
  choice: бык убил
  rationale: Причинная форма прямо обозначает, что животное стало причиной смерти. Повтор существительного устраняет возможную русскую двусмысленность местоимения.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: мужчину или женщину
  rationale: Сохраняется явное указание исходного текста на жертву любого из двух полов.
- source_word: הַשּׁוֹר יִסָּקֵל
  choice: быка следует побить камнями
  rationale: Пассивная форма задаёт предписанное законом наказание — умерщвление посредством побивания камнями. «Следует» естественно передаёт нормативную силу формы в русском законодательном изложении.
- source_word: וְגַם בְּעָלָיו יוּמָת
  choice: его хозяина также предать смерти
  rationale: Хофаль глагола מות является формулой назначенной смертной казни, а не простым сообщением о будущей смерти.
theological_decisions:
- issue: Юридическая сила наказания хозяина
  choice: его хозяина также предать смерти
  alternative: его хозяин также умрёт
  rationale: Форма יוּמָת обозначает назначенное властью лишение жизни; нейтральное «умрёт» ослабило бы судебно-правовой смысл.
- issue: Обозначение погибшего
  choice: мужчину или женщину
  alternative: человека
  rationale: Исходный текст намеренно называет обе категории, поэтому перевод сохраняет их без обобщения.
- issue: Степень буквальности временной идиомы
  choice: и прежде бодался
  alternative: бодался со вчерашнего и третьего дня
  rationale: Идиома выражает ранее установленную привычку, а буквальный русский оборот звучит неясно. Его форма и смысл сохранены в примечании без искусственного определения точного срока.
translation_notes:
  register: Современный литературный русский язык с достоинством правового текста. Синтаксис упрощён для ясности, но сохранены условная структура, нормативная сила наказаний и прямое упоминание мужчины и женщины. Формулировка не уточняет способ казни хозяина, поскольку исходный текст его не называет.
