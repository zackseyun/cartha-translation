base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/037.yaml
  text: If a man steals an ox or a sheep and slaughters it or sells it[b][a], he shall repay five cattle for the ox and four sheep for the sheep.
translation:
  language: ru
  text: Если человек украдёт быка или животное из мелкого скота[a] и зарежет украденное животное или продаст его, он должен возместить[b] пять голов крупного скота за быка и четыре головы мелкого скота за животное из мелкого скота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское שֶׂה обозначает животное из мелкого скота, например овцу или козу.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «должен уплатить». В этом правовом контексте еврейский глагол означает выплату возмещения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: Вводит условие казуистического закона; «если» естественно передаёт структуру условия и следствия.
- source_word: יִגְנֹב אִישׁ
  choice: человек украдёт
  rationale: «Человек» точно и естественно передаёт אִישׁ в обобщённой правовой формулировке, а совершенный вид глагола уместен в русском условном предложении.
- source_word: שׁוֹר
  choice: бык
  rationale: В данном законе обозначает отдельную голову крупного рогатого скота; «бык» — традиционный и понятный русский эквивалент без привнесения значения рабочего кастрированного животного, возможного у слова «вол».
- source_word: שֶׂה
  choice: одна голова мелкого скота
  rationale: Слово может обозначать как овцу, так и козу; обобщённый перевод сохраняет исходный объём значения.
- source_word: וּטְבָחוֹ
  choice: и зарежет её
  rationale: Передаёт специальное значение טבח — забой животного, а не просто его убийство.
- source_word: מְכָרוֹ
  choice: либо продаст
  rationale: Точно передаёт альтернативное действие; «либо» ясно связывает два способа распорядиться украденным животным.
- source_word: חֲמִשָּׁה בָקָר
  choice: пять голов крупного скота
  rationale: בָקָר — собирательное обозначение крупного рогатого скота; счётное слово «голов» делает русскую формулировку естественной и точной.
- source_word: יְשַׁלֵּם
  choice: пусть возместит
  rationale: В юридическом контексте глагол означает компенсацию или возмещение; такая форма ясно выражает предписание.
- source_word: תַּחַת
  choice: за
  rationale: 'Естественно передаёт замещение и компенсацию: определённое количество животных отдаётся за украденное животное.'
- source_word: וְאַרְבַּע צֹאן
  choice: и четыре головы мелкого скота
  rationale: צֹאן — собирательное обозначение овец и коз; перевод не сужает его до одних овец.
