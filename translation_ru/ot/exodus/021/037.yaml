revisions:
- from: Если человек украдёт быка или одну голову мелкого скота[a] и зарежет её либо продаст, пусть возместит[b] пять голов крупного скота за быка и четыре головы мелкого скота за одну голову мелкого скота.
  to: Если человек украдёт быка или животное из мелкого скота[a] и зарежет украденное животное или продаст его, он должен возместить[b] пять голов крупного скота за быка и четыре головы мелкого скота за животное из мелкого скота.
  rationale: Исправлена ошибочная родовая референция местоимения и сглажена неестественная формулировка, без сужения שֶׂה до овцы или козы. Сохранены условная юридическая конструкция, противопоставление крупного и мелкого скота и установленные размеры возмещения.
  reviewer_model: gpt-5.6-terra
