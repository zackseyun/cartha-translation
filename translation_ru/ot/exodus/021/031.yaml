id: EXO.21.31
reference: Exodus 21:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אוֹ בֵ֥ן יִגָּ֖ח אוֹ בַ֣ת יִגָּ֑ח כַּ/מִּשְׁפָּ֥ט הַ/זֶּ֖ה יֵעָ֥שֶׂה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/031.yaml
  text: If it gores a son or a daughter[b][a], it shall be done to him according to this judgment.
translation:
  language: ru
  text: Если вол забодает сына или дочь, с его хозяином следует поступить по тому же установлению.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть к хозяину вола применяется та же правовая мера, которая указана в предыдущем стихе.
    reason: cross_reference
lexical_decisions:
- source_word: אוֹ
  choice: если
  rationale: В казуистическом законе союз вводит ещё один возможный случай; по-русски условное «если» естественно продолжает предыдущую норму.
- source_word: בֵן ... בַת
  choice: сына или дочь
  rationale: Сохранена буквальная и симметричная пара родственных обозначений; в контексте речь идёт о чьём-либо сыне или дочери.
- source_word: יִגָּח
  choice: вол забодает
  rationale: Глагол נגח обозначает удар рогами, а подразумеваемый субъект — вол из предыдущего контекста. Слово «вол» восстановлено ради ясности.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: по тому же установлению
  rationale: מִשְׁפָּט здесь означает установленную правовую норму или решение; «тому же» естественно указывает на предписание предыдущего стиха.
- source_word: יֵעָשֶׂה לּוֹ
  choice: с его хозяином следует поступить
  rationale: Безлично-пассивная конструкция передаёт еврейский пассив и ясно обозначает, что правовая мера применяется к владельцу вола, названному в контексте.
theological_decisions:
- issue: К кому относится местоимение לּוֹ
  choice: к хозяину вола
  alternative: оставить буквальное и потенциально неясное «ему»
  rationale: Предыдущий стих прямо устанавливает ответственность хозяина; явное обозначение референта сохраняет смысл и не вносит нового богословского толкования.
translation_notes:
  register: Современный литературный русский язык с краткой юридической формулировкой. Выражение «по тому же установлению» сохраняет правовой оттенок מִשְׁפָּט и связь с предыдущим стихом; архаическая конструкция «будет сделано ему» заменена естественной безличной формой.
