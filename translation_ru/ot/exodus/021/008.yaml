  verdict: approve
  source_fidelity: 'Основной текст точно передаёт кетив לא («не»): «который не предназначил её для себя». «Неугодна своему господину», «должен позволить выкупить её», «не вправе продать её чужеземному народу» и «поступил с ней вероломно» адекватно отражают соответственно רָעָה בְּעֵינֵי, וְהֶפְדָּהּ, לֹא יִמְשֹׁל לְמָכְרָהּ и בְּבִגְדוֹ בָהּ. Смысловой диапазон יְעָדָהּ сохранён без неоправданного сведения только к браку.'
  naturalness: Перевод звучит естественно на современном литературном русском и сохраняет уместный для правового установления сдержанный регистр. Связка «то он должен позволить выкупить её» ясна и не утверждает, что выкуп обязан оплатить сам господин.
  terminology: «Господин» уместно передаёт общественно-правовое значение אֲדֹנֶיהָ; «чужеземный народ» сохраняет коллективное значение לְעַם נָכְרִי; «не вправе» удачно передаёт юридическое отсутствие полномочия. Примечание a корректно отмечает масоретское чтение (qere) לו и не скрывает текстовую трудность.
