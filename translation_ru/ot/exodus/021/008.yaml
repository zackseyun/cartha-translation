id: EXO.21.8
reference: Exodus 21:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אִם רָעָ֞ה בְּ/עֵינֵ֧י אֲדֹנֶ֛י/הָ אֲשֶׁר לא יְעָדָ֖/הּ וְ/הֶפְדָּ֑/הּ לְ/עַ֥ם נָכְרִ֛י לֹא יִמְשֹׁ֥ל לְ/מָכְרָ֖/הּ בְּ/בִגְד/וֹ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/008.yaml
  text: If she is displeasing in the eyes of her master[a], who has not designated her for himself, then he shall let her be redeemed. He has no right to sell her to a foreign people[b], since he has dealt deceitfully with her.
translation:
  language: ru
  text: Если она неугодна своему господину, который не предназначил её для себя[a], то он должен позволить выкупить её. Он не вправе продать её чужеземному народу, поскольку поступил с ней вероломно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно масоретскому чтению: «который предназначил (обручил) её себе». Еврейский текст этого оборота допускает разные прочтения и толкования.'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «при его вероломстве по отношению к ней»; то есть из-за того, что он нарушил своё обязательство перед ней.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה בְּעֵינֵי
  choice: неугодна
  rationale: Еврейский оборот означает, что она не нравится или неприемлема для господина, а не то, что она нравственно зла. «Неугодна» естественно и кратко передаёт идиому.
- source_word: אֲדֹנֶיהָ
  choice: своему господину
  rationale: В данном правовом контексте слово обозначает мужчину, который приобрёл девушку и обладает над ней установленной законом властью. «Господин» сохраняет характер общественно-правовых отношений.
- source_word: יְעָדָהּ
  choice: предназначил её для себя
  rationale: Глагол указывает на назначение девушки для брачного союза, но сам по себе допускает более широкое значение, чем «обручил». Выбор сохраняет эту смысловую широту.
- source_word: וְהֶפְדָּהּ
  choice: должен позволить выкупить её
  rationale: Побудительная порода глагола פדה здесь выражает разрешение или обеспечение выкупа; формулировка не предполагает, что господин сам платит выкуп.
- source_word: לְעַם נָכְרִי
  choice: чужеземному народу
  rationale: Сочетание имеет собирательное значение и обозначает народ вне данного сообщества, а не отдельного иностранца.
- source_word: לֹא יִמְשֹׁל לְמָכְרָהּ
  choice: не вправе продать её
  rationale: Оборот с משל говорит о власти или законном праве; «не вправе» естественно передаёт юридический запрет.
- source_word: בְּבִגְדוֹ בָהּ
  choice: поскольку поступил с ней вероломно
  rationale: בגד обозначает нарушение верности или обязательства. «Вероломно» сохраняет нравственно-правовую силу обвинения и не сводит его к простой нечестности.
theological_decisions:
- issue: Неоднозначность יְעָדָהּ и масоретского различия между написанием לא и чтением לו
  choice: который не предназначил её для себя
  alternative: который предназначил (обручил) её себе
  rationale: Основной текст следует представленному написанию לא («не»), тогда как масоретское чтение לו («ему, для себя») даёт утвердительный смысл. Правовой контекст допускает более конкретное понимание «обручил», поэтому альтернативное чтение сохранено в примечании, а неоднозначность не устранена молча.
translation_notes:
  register: Современный литературный русский язык с достоинством правового установления. Синтаксис сделан ясным для обычного читателя; юридические формулировки «должен позволить» и «не вправе» передают нормативную силу текста. Подлинная текстовая неоднозначность вынесена в примечание.
