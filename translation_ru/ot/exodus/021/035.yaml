base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/035.yaml
  text: And if one man's ox strikes his neighbor's ox and it dies[a], then they shall sell the live ox and divide its price[c][b], and they shall also divide the dead one.
translation:
  language: ru
  text: Если вол одного человека ударит вола его соседа и тот умрёт[a], пусть они продадут живого вола и разделят деньги, вырученные за него[b]; также пусть разделят и мёртвого вола[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «забодает»; еврейский глагол может обозначать сильный удар вола, в том числе удар рогами.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «разделят его серебро (деньги)», то есть деньги, вырученные от продажи живого вола.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «мёртвого»; имеется в виду мёртвый вол.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Если
  rationale: Вводит условие казуистического закона; в современном русском начальное «и» для связи с контекстом необязательно.
- source_word: יִגֹּף
  choice: забодает
  rationale: Глагол обозначает сильный удар животного, в данном контексте — удар рогами; «забодает» естественно применительно к волу, хотя еврейское слово допускает и более общее «ударит».
- source_word: שׁוֹר אִישׁ
  choice: вол одного человека
  rationale: Ясно передаёт принадлежность и сохраняет единичную правовую формулировку.
- source_word: שׁוֹר רֵעֵהוּ
  choice: вола другого
  rationale: רֵעַ здесь указывает на другого участника правового случая; «другого» звучит естественно и не сужает значение до живущего по соседству.
- source_word: וָמֵת
  choice: и тот умрёт
  rationale: Местоимение «тот» недвусмысленно относит смерть к пострадавшему волу и сохраняет простую результативную связь.
- source_word: וּמָכְרוּ
  choice: пусть они продадут
  rationale: Передаёт предписанное законом последствие без чрезмерно категоричного модального усиления.
- source_word: הַשּׁוֹר הַחַי
  choice: живого вола
  rationale: Естественное русское обозначение уцелевшего животного.
- source_word: וְחָצוּ אֶת כַּסְפּוֹ
  choice: разделят вырученные за него деньги
  rationale: כֶּסֶף буквально означает «серебро, деньги», а контекст продажи показывает, что имеются в виду полученные от продажи деньги.
- source_word: וְגַם אֶת הַמֵּת יֶחֱצוּן
  choice: также пусть разделят и мёртвого вола
  rationale: В оригинале буквально «мёртвого»; добавление «вола» устраняет неестественную для русского субстантивацию, не уточняя способ раздела и не заменяя животное интерпретирующим словом «туша».
