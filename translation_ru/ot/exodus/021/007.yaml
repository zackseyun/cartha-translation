source:
  edition: WLC
  text: וְ/כִֽי יִמְכֹּ֥ר אִ֛ישׁ אֶת בִּתּ֖/וֹ לְ/אָמָ֑ה לֹ֥א תֵצֵ֖א כְּ/צֵ֥את הָ/עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/007.yaml
  text: And if a man sells his daughter as a female servant[b][a], she shall not go out as the male servants go out.
translation:
  language: ru
  text: Если мужчина продаст свою дочь в рабыни[a], она не выйдет на свободу так, как выходят рабы-мужчины[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в служанки». Еврейское אָמָה обозначает женщину или девушку в подневольном служении; «рабыня» яснее передаёт её правовой статус в этом законе.'
    reason: lexical_alternative
  - marker: b
    text: То есть она освобождается не на тех же условиях, что рабы-мужчины.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִּי
  choice: Если
  rationale: Сочетание вводит очередной условный случай в своде законов. В русском юридическом изложении «если» естественно передаёт условие; соединительная функция ו выражена связью с предыдущим контекстом и не требует обязательного «и».
- source_word: יִמְכֹּר
  choice: продаст
  rationale: Глагол прямо обозначает продажу; совершенный вид в форме будущего времени естественно описывает возможный случай в русском условном предложении.
- source_word: אִישׁ
  choice: мужчина
  rationale: Форма мужского рода в данном семейно-правовом контексте обозначает мужчину, продающего свою дочь; нейтральное «кто-либо» скрыло бы это указание.
- source_word: בִּתּוֹ
  choice: свою дочь
  rationale: Возвратное притяжательное местоимение естественно по-русски передаёт дочь подлежащего и исключает ненужную двусмысленность.
- source_word: לְאָמָה
  choice: в рабыни
  rationale: אָמָה обозначает женщину или девушку в подневольном служении. В контексте продажи слово «рабыня» ясно передаёт её правовой статус, а конструкция «продать в рабыни» естественно выражает значение роли у предлога לְ.
- source_word: לֹא תֵצֵא
  choice: она не выйдет на свободу
  rationale: Буквальное «не выйдет» по-русски нуждается в уточнении; «выйти на свободу» сохраняет образ исхода и ясно передаёт юридическое освобождение, не превращая фразу в утверждение, что освобождение невозможно вообще.
- source_word: כְּצֵאת
  choice: так, как выходят
  rationale: Сравнительная конструкция и глагольная параллель с תֵצֵא сохранены в естественной русской форме.
- source_word: הָעֲבָדִים
  choice: рабы-мужчины
  rationale: На фоне אָמָה и предшествующего закона речь идёт о рабах мужского пола. Уточнение сохраняет значимое для данного постановления гендерное различие.
theological_decisions:
- issue: Передача терминов рабства в законах завета
  choice: «рабыни» и «рабы-мужчины»
  alternative: «служанки» и «слуги»
  rationale: Продажа и условия освобождения показывают подневольный правовой статус. Термины «рабыня» и «раб» передают его прямо, не смягчая социальную реальность текста и не добавляя конфессионального толкования.
- issue: Смысл выражения «не выйдет»
  choice: Сохранить сравнение способов освобождения и пояснить его сноской
  alternative: 'Перевести непосредственно: «она освобождается не на тех же условиях»'
  rationale: Еврейский текст формулирует различие через образ выхода, не перечисляя здесь конкретных условий. Основной текст сохраняет этот образ, а сноска разъясняет юридический смысл, не устраняя лаконичность оригинала.
translation_notes:
  register: Современный литературный русский язык с лаконичной структурой, соответствующей формулировке отдельного правового случая. Термины прямые и юридически ясные; оборот «выйти на свободу» сохраняет исходный образ, оставаясь понятным обычному читателю.
