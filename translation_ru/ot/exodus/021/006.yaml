base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/006.yaml
  text: then his master shall bring him to God[a], and shall bring him to the door or to the doorpost, and his master shall pierce his ear with an awl; and he shall serve him forever.
translation:
  language: ru
  text: тогда его господин должен привести его к Богу[a], привести его к двери или к дверному косяку, и его господин проколет ему ухо шилом; и он будет служить ему навсегда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к судьям». В некоторых правовых контекстах еврейское אֱלֹהִים может обозначать судей или судебную власть.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגִּישׁוֹ
  choice: приведёт его / подведёт его
  rationale: Порода хифиль глагола נגשׁ означает побуждение приблизиться или приведение к лицу либо месту. В первом случае «приведёт» естественно передаёт представление перед властью, во втором «подведёт» — движение к конкретному месту обряда.
- source_word: אֲדֹנָיו
  choice: его господин
  rationale: В данном правовом контексте слово обозначает человека, которому служит раб. «Господин» — традиционное и точное русское обозначение этих социально-правовых отношений; строчная буква исключает божественный смысл.
- source_word: הָאֱלֹהִים
  choice: к Богу
  rationale: Основное значение формы — «Бог»; определённость передана русским именованием. Возможное понимание как судебной власти сохранено в сноске.
- source_word: הַדֶּלֶת
  choice: к двери
  rationale: Прямое и естественное обозначение буквальной двери, у которой совершается обряд.
- source_word: הַמְּזוּזָה
  choice: к дверному косяку
  rationale: «Дверной косяк» точно и понятно передаёт архитектурное значение מזוזה и не вызывает ассоциации с более поздним ритуальным предметом.
- source_word: רָצַע
  choice: проколет
  rationale: Глагол обозначает прокалывание или просверливание; «проколет» ясно сочетается с ухом и названным орудием.
- source_word: אָזְנוֹ
  choice: ему ухо
  rationale: Естественная русская конструкция с внешним обладателем передаёт буквальное «его ухо» без смыслового изменения.
- source_word: בַּמַּרְצֵעַ
  choice: шилом
  rationale: Шило — точный общеупотребительный русский эквивалент острого инструмента для прокалывания.
- source_word: וַעֲבָדוֹ
  choice: и тот будет служить ему
  rationale: Глагол עבד прямо означает «служить, работать». Местоимение «тот» устраняет возможную русскую двусмысленность между господином и рабом, не меняя референта.
- source_word: לְעֹלָם
  choice: навсегда
  rationale: Это прямой эквивалент выражения длительности לְעֹלָם. В правовом контексте речь идёт о постоянной, фактически пожизненной службе, однако перевод не сужает значение до явно не названного «до конца жизни».
theological_decisions:
- issue: Значение הָאֱלֹהִים в правовом контексте
  choice: Бог
  alternative: судьи / судебная власть
  rationale: Наиболее прямое лексическое прочтение — «Бог», то есть представление раба перед Богом в рамках священно-правового действия. Вместе с тем в юридических текстах слово может обозначать судей или судебную власть; эта давняя и правдоподобная альтернатива отмечена в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксис сохраняет последовательность действий оригинала, но «тот» добавлено для ясности референта. Термин «раб» в самом стихе не добавляется, поскольку статус задан ближайшим контекстом, а здесь употреблён глагол «служить».
