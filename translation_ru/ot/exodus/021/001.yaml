  text: These are the judgments that you shall set before them:[a]
translation:
  language: ru
  text: 'И вот постановления[a], которые ты изложишь перед ними:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «судебные решения» или «правовые нормы». Еврейское слово обозначает юридические решения и нормы, в том числе нормы, сформулированные применительно к конкретным случаям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: И вот
  rationale: Сочетание союза וְ с указательным местоимением связывает новый раздел с предшествующим текстом. «И вот» естественно передаёт эту связь и не вносит временного значения.
- source_word: הַ/מִּשְׁפָּטִים
  choice: постановления
  rationale: В данном контексте מִשְׁפָּטִים обозначает юридические установления и решения, представленные далее как конкретные правовые нормы. «Постановления» звучит естественно в современном русском и сохраняет юридический оттенок; возможные варианты отмечены в сноске.
- source_word: אֲשֶׁר
  choice: которые
  rationale: Естественное русское относительное местоимение, согласованное с существительным во множественном числе.
- source_word: תָּשִׂים
  choice: предложишь
  rationale: Буквально глагол означает «положишь, поставишь», но в сочетании с לִפְנֵיהֶם речь идёт о представлении установлений народу. «Предложишь им» точно и естественно передаёт этот смысл, не подразумевая, что народ вправе их отклонить.
- source_word: לִ/פְנֵי/הֶם
  choice: им
  rationale: В сочетании с «предложишь» русский дательный падеж естественно передаёт идиому «перед ними, на их рассмотрение» без ненужного буквализма.
theological_decisions:
- issue: Передача מִשְׁפָּטִים в контексте законодательства завета
  choice: постановления
  alternative: судебные решения; правовые нормы; законы
  rationale: Термин имеет юридико-судебный диапазон значений. «Постановления» сохраняет правовой характер последующего раздела, не сужая его исключительно до судебных приговоров и не превращая в общее обозначение всего закона.
translation_notes:
  register: Современный литературный русский, краткий и торжественный без архаизмов. Начальное «И вот» сохраняет связь с предыдущим разделом. Двоеточие показывает, что далее следует перечень постановлений.
