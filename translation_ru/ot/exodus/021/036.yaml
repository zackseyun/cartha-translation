  naturalness: Текст в целом современный и ясный. «Не обеспечил за ним надзора» естественно для современного литературного русского и сохраняет правовой регистр. «Бык уже прежде бодался» передаёт известную ранее склонность к боданию без чрезмерной архаизации.
