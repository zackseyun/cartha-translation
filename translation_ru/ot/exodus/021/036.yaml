base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/036.yaml
  text: Or if it was known that the ox was accustomed to gore from yesterday and the day before[a], and its owner did not keep it in, he must surely pay ox for ox[c][b], and the dead animal will be his.
translation:
  language: ru
  text: Или если было известно, что бык уже прежде бодался[a], а хозяин не обеспечил за ним надзора, то он непременно должен отдать быка за быка, а мёртвый бык достанется ему[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со вчера и третьего дня» — древнееврейское выражение, означающее, что бык уже раньше проявлял такую повадку.'
    reason: cultural_note
  - marker: b
    text: 'То есть погибшее животное. В древнееврейском тексте буквально: «мёртвый будет ему»; получатель не назван повторно.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: א֣וֹ
  choice: Или если
  rationale: Вводит альтернативный правовой случай; условный смысл естественно выражен сочетанием «или если».
- source_word: נוֹדַע כִּי
  choice: было известно, что
  rationale: 'Сохраняет безлично-пассивный юридический смысл: опасная повадка быка была известна.'
- source_word: שׁוֹר נַגָּח הוּא
  choice: бык ... бодался
  rationale: Передаёт устойчивую склонность животного нападать рогами, не сужая значение до единичного случая.
- source_word: מִתְּמוֹל שִׁלְשֹׁם
  choice: и прежде
  rationale: Естественно передаёт древнееврейскую идиому «со вчера и третьего дня», обозначающую уже проявлявшуюся ранее повадку; буквальная форма вынесена в примечание.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: не удерживал его
  rationale: В данном правовом контексте означает, что хозяин не принял мер, чтобы опасное животное не причинило вреда.
- source_word: בְּעָלָיו
  choice: хозяин
  rationale: Обычное и ясное русское обозначение владельца животного.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: непременно должен отдать
  rationale: Передаёт усиленную обязательность возмещения, выраженную инфинитивом абсолютным при личной форме глагола.
- source_word: שׁוֹר תַּחַת הַשּׁוֹר
  choice: быка за быка
  rationale: Сохраняет краткую формулу равноценного возмещения.
- source_word: וְהַמֵּת יִהְיֶה לּוֹ
  choice: мёртвый бык достанется ему
  rationale: Сохраняет буквальную отсылку к погибшему животному и местоименную неоднозначность того, кому именно оно достаётся.
theological_decisions:
- issue: Референт местоимения לוֹ («ему»)
  choice: сохранить местоимение «ему» без пояснения в основном тексте
  alternative: 'уточнить: «хозяину погибшего быка» или «виновному хозяину»'
  rationale: Древнееврейский текст грамматически не называет референта прямо; уточнение разрешило бы реальную неоднозначность за источник.
translation_notes:
  register: Современный литературный русский с ясным юридическим звучанием. «Непременно должен» передаёт эмфатическую конструкцию, а «быка за быка» сохраняет лаконичную правовую формулу. Архаическая идиома раскрыта в сноске; подлинная местоименная неоднозначность сохранена.
