base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/022.yaml
  text: When men struggle together and strike a pregnant woman so that her children come out[a], but there is no harm, he shall surely be fined as the woman's husband imposes on him[c][b], and he shall pay according to the judges.
translation:
  language: ru
  text: Если мужчины подерутся и ударят беременную женщину, так что она родит[a], но тяжкого вреда не будет[b], с виновного непременно взыщут сумму, которую потребует муж женщины; он уплатит её по решению судей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «её дети выйдут». Это может означать преждевременные роды; некоторые переводы понимают это выражение как указание на выкидыш.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский текст этого стиха сам по себе не уточняет, относится ли тяжкий вред к матери, к ребёнку или к обоим.
    reason: alternative_reading
  - marker: c
    text: 'Возможные переводы: «по судебному решению» или «перед судом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Если
  rationale: Вводит условие казуистического закона; в современном русском юридическом изложении «если» естественно передаёт эту функцию.
- source_word: יִנָּצוּ אֲנָשִׁים
  choice: мужчины подерутся
  rationale: Сохраняет явно мужское множественное число и передаёт физическую схватку естественным современным языком.
- source_word: וְנָגְפוּ
  choice: ударят
  rationale: Передаёт конкретное физическое воздействие, не предрешая степень причинённого вреда.
- source_word: אִשָּׁה הָרָה
  choice: беременную женщину
  rationale: Прямой и естественный современный эквивалент.
- source_word: וְיָצְאוּ יְלָדֶיהָ
  choice: так что её дети выйдут
  rationale: Намеренно сохраняет буквальную и неоднозначную формулировку источника, не сводя её ни к выкидышу, ни к преждевременным родам живых детей.
- source_word: אָסוֹן
  choice: тяжкий вред
  rationale: Передаёт значение серьёзного несчастья или повреждения, не ограничивая его смертью и не уточняя, кого именно оно касается.
- source_word: עָנוֹשׁ יֵעָנֵשׁ
  choice: непременно должен уплатить штраф
  rationale: Инфинитив абсолютный усиливает обязательность наказания; последующий контекст показывает, что речь идёт о денежной выплате.
- source_word: כַּאֲשֶׁר יָשִׁית עָלָיו בַּעַל הָאִשָּׁה
  choice: какой наложит на него муж женщины
  rationale: Сохраняет роль мужа в назначении требуемой суммы и юридический оттенок глагола «наложить».
- source_word: וְנָתַן בִּפְלִלִים
  choice: и выплатить его по решению судей
  rationale: В финансово-правовом контексте וְנָתַן означает выплату, а בִּפְלִלִים указывает на судебное установление или контроль.
theological_decisions:
- issue: Характер исхода беременности и область применения выражения אָסוֹן
  choice: Сохранить буквальное «её дети выйдут» и не уточнять, касается ли тяжкий вред женщины, детей или тех и других.
  alternative: Перевести как «у неё случится выкидыш» либо прямо отнести вред только к матери или также к ребёнку.
  rationale: Еврейский текст сам по себе не разрешает эти спорные вопросы однозначно; конкретизация внесла бы в перевод богословски и этически значимое толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксис остаётся ясным для обычного читателя; спорная формулировка о выходе детей сохранена максимально близко к древнееврейскому тексту и пояснена в сноске.
