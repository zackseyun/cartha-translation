  source_fidelity: 'Требуется уточнение нескольких мест. «Сможет ходить» добавляет значение способности, которого в еврейском тексте нет: употреблён глагол «ходить / расхаживать». «Вне дома» чрезмерно конкретизирует בַּחוּץ как именно пространство за пределами дома; нейтральнее «снаружи». Формула «полностью оплатить лечение» правдоподобно передаёт правовое следствие, но непосредственно еврейский текст усиленно говорит об обеспечении исцеления; лучше сохранить это в основном тексте, а оплату пояснить в примечании. Буквальное пояснение в сноске c неверно: רַפֹּא יְרַפֵּא — не «лечением вылечит», а усиленная форма от «исцелять».'
