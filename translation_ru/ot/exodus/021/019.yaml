  text: אִם יָק֞וּם וְ/הִתְהַלֵּ֥ךְ בַּ/ח֛וּץ עַל מִשְׁעַנְתּ֖/וֹ וְ/נִקָּ֣ה הַ/מַּכֶּ֑ה רַ֥ק שִׁבְתּ֛/וֹ יִתֵּ֖ן וְ/רַפֹּ֥א יְרַפֵּֽא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/019.yaml
  text: If he gets up and walks about outside on his staff[a], then the one who struck him shall be cleared[c][b]; he must only pay for his lost time and have him thoroughly healed.
translation:
  language: ru
  text: Если он встанет и будет ходить снаружи, опираясь на свой посох[a], то ударивший его не подлежит наказанию; он должен лишь возместить пострадавшему потерянное время[b] и обеспечить его полное выздоровление[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на своём посохе». Эта фраза означает, что он ходит, опираясь на посох; это служит признаком частичного выздоровления.'
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду возмещение за время вынужденной неработоспособности пострадавшего.
    reason: cultural_note
  - marker: c
    text: 'В еврейском тексте употреблена усилительная конструкция, буквально: «исцеляя исцелит» или «непременно исцелит». В данном правовом контексте она возлагает на виновного обязанность обеспечить лечение и выздоровление пострадавшего, в том числе, вероятно, покрыть связанные с лечением расходы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָקוּם
  choice: если он встанет
  rationale: Условная формула казуального права; קום здесь обозначает восстановление, достаточное для того, чтобы подняться после травмы.
- source_word: וְהִתְהַלֵּךְ בַּחוּץ
  choice: и сможет ходить вне дома
  rationale: Hitpael от הלך передаёт способность передвигаться; בַּחוּץ указывает на выход наружу как видимое свидетельство частичного выздоровления.
- source_word: עַל מִשְׁעַנְתּוֹ
  choice: опираясь на свою палку
  rationale: Предлог עַל буквально означает «на», а существительное обозначает опору; по-русски естественно явно выразить поддерживаемую ходьбу.
- source_word: וְנִקָּה הַמַּכֶּה
  choice: то ударивший его освобождается от наказания
  rationale: Niphal от נקה в юридическом контексте означает освобождение от основной уголовной ответственности; последующие слова сохраняют обязанность возмещения.
- source_word: רַק שִׁבְתּוֹ יִתֵּן
  choice: он должен лишь возместить пострадавшему потерянное время
  rationale: שִׁבְתּוֹ в законе о телесном повреждении обозначает период вынужденной неработоспособности, а נתן — обязательную выплату компенсации.
- source_word: וְרַפֹּא יְרַפֵּא
  choice: и полностью оплатить его лечение
  rationale: Инфинитив абсолютный с личной формой усиливает обязанность обеспечить лечение; в данном правовом контексте виновник не обязательно лечит сам, но несёт расходы на лечение.
theological_decisions:
- issue: Объём освобождения виновного по וְנִקָּה
  choice: освобождается от наказания
  alternative: будет невиновен / освобождается от всякой ответственности
  rationale: Фраза не может означать полное отсутствие ответственности, поскольку далее прямо предписаны компенсация времени и лечение. Перевод сохраняет юридическое различие между наказанием за тяжкий исход и остающейся имущественной обязанностью.
- issue: Характер обязанности по וְרַפֹּא יְרַפֵּא
  choice: полностью оплатить лечение
  alternative: полностью исцелить его
  rationale: Буквальная лечебная формулировка в контексте закона выражает ответственность виновного за выздоровление пострадавшего, вероятнее всего через покрытие лечения, а не обещание гарантированного результата.
translation_notes:
  register: Современный литературный русский язык с ясной юридической формулировкой. Сохранена структура условного закона и различие между освобождением от наказания и сохраняющейся обязанностью возместить ущерб. Слово «палка» выбрано вместо более архаичного «посох» как естественное обозначение опоры при ходьбе.
