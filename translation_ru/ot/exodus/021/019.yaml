  terminology: «Палка» допустима как современное обозначение опоры, однако «посох» точнее соответствует מִשְׁעֶנֶת и остаётся понятным в современном литературном русском. «Обеспечить полное выздоровление» передаёт усиленную конструкцию и не утверждает, что виновный лично лечит пострадавшего.
