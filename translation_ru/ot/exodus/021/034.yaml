  yaml_path: translation/ot/exodus/021/034.yaml
  text: The owner of the pit shall make restitution[a]; he shall pay money to its owner[b], and the dead animal shall be his.
translation:
  language: ru
  text: 'Владелец ямы должен возместить ущерб: он выплатит деньги[a] владельцу животного, а погибшее животное будет принадлежать ему[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «серебро»; здесь имеется в виду денежное возмещение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «туша будет принадлежать ему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבּוֹר
  choice: владелец ямы
  rationale: В данном правовом контексте בַּעַל обозначает человека, которому принадлежит яма или который несёт за неё ответственность; «владелец» — естественный современный эквивалент. בּוֹר здесь означает открытую яму, в которую упало животное.
- source_word: יְשַׁלֵּם
  choice: должен возместить ущерб
  rationale: Пиэль глагола שׁלם в правовом контексте выражает обязанность компенсировать причинённый ущерб, а не просто совершить платёж.
- source_word: כֶּסֶף יָשִׁיב
  choice: он отдаст деньги
  rationale: כֶּסֶף буквально означает «серебро», но здесь служит обозначением денежной выплаты; каузативная форма שוב передаёт возвращение или возмещение стоимости потерпевшему.
- source_word: לִבְעָלָיו
  choice: владельцу животного
  rationale: Местоименный суффикс указывает на владельца погибшего животного. Явное существительное «животного» устраняет неестественную для русского языка неясность, не добавляя нового содержания.
- source_word: וְהַמֵּת
  choice: а мёртвое животное
  rationale: Субстантивированное «мёртвое» обозначает погибшее в яме животное. Добавление слова «животное» делает подразумеваемый референт ясным; возможный более предметный вариант — «туша».
- source_word: יִהְיֶה לוֹ
  choice: будет принадлежать ему
  rationale: Формула буквально означает «будет ему» и устанавливает принадлежность погибшего животного. Русская формулировка сохраняет неуточнённый референт местоимения «ему».
theological_decisions:
- issue: К кому относится местоимение לוֹ («ему») в заключительной части стиха
  choice: 'Сохранить местоименную неоднозначность: «будет принадлежать ему»'
  alternative: «достанется владельцу ямы»
  rationale: Еврейский текст прямо не называет лицо повторно. По устройству компенсации наиболее вероятен владелец ямы, однако перевод не должен незаметно устранять формальную неоднозначность исходного текста.
translation_notes:
  register: Современный литературный русский язык с ясной правовой формулировкой. Конструкция «должен возместить ущерб» передаёт обязательный характер нормы, а последующие слова поясняют способ возмещения. Сохранена значимая местоименная неоднозначность заключительной фразы.
