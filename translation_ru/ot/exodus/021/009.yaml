  text: But if he designates her for his son[a], he shall deal with her according to the rights of daughters.
translation:
  language: ru
  text: Если же он предназначит её своему сыну, то должен поступить с ней согласно праву, установленному для дочерей[a].
  philosophy: optimal-equivalence
  footnotes:
