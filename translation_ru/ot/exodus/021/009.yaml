    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Вводит следующий условный случай и одновременно отмечает противопоставление предыдущему предписанию.
- source_word: לִבְנוֹ
  choice: своему сыну
  rationale: Предлог ל указывает, для кого предназначают девушку; по-русски это естественно передаётся дательным падежом.
- source_word: יִיעָדֶנָּה
  choice: предназначит её
  rationale: Глагол יעד обозначает формальное назначение девушки для брачного союза; «предназначит» сохраняет юридический оттенок и не сужает значение до конкретной формы обручения.
- source_word: כְּמִשְׁפַּט
  choice: по праву
  rationale: מִשְׁפָּט здесь может обозначать установленное право, норму или обычай. Основной текст передаёт прежде всего юридический смысл, а альтернативный оттенок отмечен в сноске.
- source_word: הַבָּנוֹת
  choice: дочерей
  rationale: Сохраняет прямое значение еврейского существительного во множественном числе и связь с положением дочерей в семье.
- source_word: יַעֲשֶׂה לָּהּ
  choice: должен поступить с ней
  rationale: Конструкция עשה + ל описывает требуемое действие по отношению к человеку; модальное «должен» естественно выражает предписание в русском юридическом контексте.
theological_decisions:
- issue: Характер обязательства перед девушкой, предназначенной сыну
  choice: Текст требует обращаться с ней в соответствии с установленным правом дочерей.
  alternative: Фраза может относиться к принятому обычаю обращения с дочерьми, особенно при заключении брака.
  rationale: Юридический контекст поддерживает значение установленного права, однако диапазон слова מִשְׁפָּט включает также норму и обычай; поэтому более узкое толкование не вносится в основной текст.
translation_notes:
  register: Современный литературный русский язык с кратким юридическим звучанием. Формулировка сохраняет условную структуру, формальный характер назначения и смысловую широту слова מִשְׁפָּט.
