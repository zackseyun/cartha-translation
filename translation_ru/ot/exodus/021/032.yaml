base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/032.yaml
  text: If the ox gores a male servant or a female servant[a], he shall give thirty shekels of silver to his master, and the ox shall be stoned.
translation:
  language: ru
  text: Если вол забодает раба или рабыню, хозяин вола должен заплатить хозяину раба или рабыни тридцать шекелей серебра, а вола следует побить камнями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶבֶד
  choice: раб
  rationale: В данном правовом контексте слово обозначает мужчину, находящегося в рабском подчинении; «раб» точно передаёт и социально-правовой статус, и мужской род.
- source_word: אָמָה
  choice: рабыня
  rationale: В паре с עֶבֶד слово обозначает женщину, находящуюся в рабском подчинении; современное «рабыня» ясно сохраняет различие по полу и правовой статус.
- source_word: יִגַּח
  choice: забодает
  rationale: Глагол נגח в законах о волах означает удар рогами; «забодает» естественно и точно передаёт это действие.
- source_word: כֶּסֶף שְׁלֹשִׁים שְׁקָלִים
  choice: тридцать шекелей серебра
  rationale: Фраза указывает количество серебра, измеренное в шекелях; такая формулировка сохраняет весовой характер древней денежной меры.
- source_word: יִתֵּן
  choice: должен отдать
  rationale: Имперфект в казуистическом законе выражает обязательное правовое последствие; «должен отдать» ясно передаёт эту нормативную силу на современном русском языке.
- source_word: לַאדֹנָיו
  choice: их хозяину
  rationale: Суффикс относится к пострадавшему рабу или рабыне. Русское «их» здесь употреблено как обобщённая отсылка к одному из двух названных лиц и позволяет избежать ошибочного ограничения только мужчиной.
- source_word: יִסָּקֵל
  choice: следует побить камнями
  rationale: Форма от סקל обозначает предписанную казнь через побиение камнями; перевод сохраняет краткость и правовой тон исходного текста.
theological_decisions:
- issue: Неявный субъект выплаты
  choice: хозяин вола должен отдать
  alternative: он должен отдать
  rationale: В еврейском тексте субъект יִתֵּן не назван прямо, но из ближайшего закона и самой правовой ситуации ясно, что платит хозяин вола. Явное обозначение устраняет неестественную для русского текста неопределённость, не изменяя смысла.
translation_notes:
  register: Современный литературный русский язык с ясным правовым строем фразы. Сохранены конкретность рабского статуса, обязательный характер выплаты и лаконичность предписания; архаизмы вроде «господин его» и смягчающее «слуга» не использованы.
