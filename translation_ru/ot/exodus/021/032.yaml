    issue: Неудачное местоимение «их хозяину».
    rationale: В оригинале стоит единственное число («его хозяину»), относящееся к рабу либо рабыне. Русское множественное «их» не требуется для гендерного охвата и делает отсылку неясной. Следует прямо назвать хозяина раба или рабыни.
  revised_text: Если вол забодает раба или рабыню, хозяин вола должен заплатить хозяину раба или рабыни тридцать шекелей серебра, а вола следует побить камнями.
