  yaml_path: translation/ot/exodus/021/016.yaml
  text: Whoever kidnaps a man and sells him[a], or he is found in his hand[b], shall surely be put to death.
translation:
  language: ru
  text: Тот, кто похитит человека и продаст его[a] или у кого похищенный будет найден[b], непременно должен быть предан смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «украдёт человека». В этом контексте речь идёт о похищении человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будет найден в его руке», то есть в его владении или под его властью. Союз можно также перевести как «и».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹנֵב
  choice: похитит
  rationale: Буквально глагол означает «украдёт», но при дополнении אִישׁ и в сочетании с продажей либо удержанием человека обозначает похищение человека. «Похитит» ясно передаёт смысл правовой нормы по-русски.
- source_word: אִישׁ
  choice: человека
  rationale: В данном правовом контексте אִישׁ обозначает человека как жертву похищения. Русское «человека» естественно и не сужает норму до взрослого мужчины без достаточных оснований.
- source_word: וּמְכָרוֹ
  choice: и продаст его
  rationale: Форма глагола מכר с местоименным суффиксом 3-го лица мужского рода единственного числа прямо указывает на продажу похищенного человека.
- source_word: וְנִמְצָא בְיָדוֹ
  choice: или тот будет найден у него
  rationale: נמצא означает «будет найден», а בידו, буквально «в его руке», идиоматически указывает на владение или контроль. «У него» естественно передаёт эту идиому; «тот» устраняет двусмысленность русского местоимения, обозначая похищенного.
- source_word: מֹות יוּמָת
  choice: непременно должен быть предан смерти
  rationale: Сочетание инфинитива абсолютного с личной формой того же глагола усиливает обязательность смертного приговора. Такая формулировка передаёт судебный, а не просто предсказательный смысл.
theological_decisions:
- issue: Объём правонарушения
  choice: Закон охватывает похищение человека как в случае его последующей продажи, так и в случае, если похищенный остаётся под властью похитителя.
  alternative: 'Союз וְ во второй части можно передать соединительно: «и он будет найден у него», понимая это как дополнительное обстоятельство, а не как отдельную альтернативу продаже.'
  rationale: В контексте казуистического закона продажа и продолжающееся удержание естественно понимаются как альтернативные состояния похищенного. Перевод «или» делает правовой смысл ясным, а сноска сохраняет формальную неоднозначность союза.
translation_notes:
  register: Современный литературный русский язык с достоинством правовой формулы. Формулировка ясна обычному читателю; тире разграничивают две альтернативы, а повтор «тот» различает похищенного и похитителя.
