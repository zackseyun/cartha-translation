base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/015.yaml
  text: Whoever strikes his father or his mother shall surely be put to death[a].
translation:
  language: ru
  text: Кто ударит своего отца или свою мать, тот непременно должен быть предан смерти[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и свою мать»; союз передан как «или», поскольку закон предусматривает наказание за удар любого из родителей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: ударит
  rationale: Причастная форма от נכה обозначает того, кто наносит удар. В русском законодательном условии естественно употребить совершенный вид «ударит»; он передаёт физическое действие, не усиливая его до «изобьёт» и не сужая до нападения с оружием.
- source_word: אָבִיו
  choice: своего отца
  rationale: Еврейский текст прямо называет отца в единственном числе; «своего» естественно соотносит его с субъектом действия.
- source_word: אִמּוֹ
  choice: свою мать
  rationale: Еврейский текст отдельно и прямо называет мать; раздельное упоминание обоих родителей сохраняет конкретность правовой формулы.
- source_word: מוֹת יוּמָת
  choice: непременно должен быть предан смерти
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает пассивную формулу смертной казни. Перевод сохраняет и категоричность, и судебно-правовой характер наказания.
- source_word: וּ / וְ
  choice: или
  rationale: 'Формально союз означает «и», однако в данном казуистическом законе перечисление имеет разделительный правовой смысл: наказание относится к ударившему любого из родителей. Русское «или» не создаёт ложного впечатления, будто необходимо ударить обоих.'
theological_decisions:
- issue: Передача формулы смертной казни
  choice: непременно должен быть предан смерти
  alternative: да будет предан смерти; непременно умрёт
  rationale: Стих устанавливает судебное наказание, а не просто предсказывает смерть. Пассивная конструкция сохраняет смысл казни по правовому решению, а «непременно» передаёт усиление еврейской конструкции.
translation_notes:
  register: Современный литературный русский язык с краткой и торжественной правовой формулировкой. «Предан смерти» сохраняет достоинство и судебный оттенок исходного текста, не прибегая к архаичному «да будет умерщвлён».
