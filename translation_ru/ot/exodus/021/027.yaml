base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/027.yaml
  text: And if he knocks out the tooth of his male servant or the tooth of his female servant[a], he shall let him go free in compensation for his tooth.
translation:
  language: ru
  text: Если он выбьет зуб у своего раба или у своей рабыни, то должен отпустить пострадавшего[a] на свободу в возмещение за выбитый зуб.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его»: в еврейской правовой формуле употреблено местоимение мужского рода в единственном числе, однако закон относится и к рабу, и к рабыне.'
    reason: Сохранение грамматической особенности оригинала и общего применения нормы без неестественной русской формулировки.
lexical_decisions:
- source_word: וְאִם
  choice: Если
  rationale: Условная формула продолжает ряд правовых случаев; в современном русском начальное «и» необязательно и утяжеляло бы фразу.
- source_word: שֵׁן
  choice: зуб
  rationale: Прямое соответствие анатомическому термину с сохранением единственного числа.
- source_word: עַבְדּוֹ
  choice: своего раба
  rationale: В законах данного раздела עבד обозначает зависимого человека в рабском правовом положении; «раб» точнее, чем смягчающее «слуга».
- source_word: אֲמָתוֹ
  choice: своей рабыни
  rationale: Передаёт женский род и рабский статус, явно противопоставленные мужской форме.
- source_word: יַפִּיל
  choice: выбьет
  rationale: Каузатив от נפל буквально означает «сделает так, что выпадет»; при повреждении зуба естественный русский эквивалент — «выбьет».
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: должен отпустить пострадавшего на свободу
  rationale: Передаёт обязательную силу правовой нормы и освобождение от рабского статуса; «пострадавшего» позволяет естественно применить формулу как к рабу, так и к рабыне, не стирая грамматическую особенность еврейского текста.
- source_word: תַּחַת שִׁנּוֹ
  choice: в возмещение за зуб
  rationale: תחת здесь обозначает возмещение, предоставляемое за причинённое увечье.
theological_decisions:
- issue: Терминология рабства в законодательстве Книги Завета
  choice: раб / рабыня
  alternative: слуга / служанка
  rationale: Контекст регулирует положение несвободных людей, поэтому прямые термины сохраняют социально-правовую реальность текста и не смягчают её.
- issue: Род освобождаемого лица в заключительной правовой формуле
  choice: пострадавшего с пояснительной сноской
  alternative: его; раба или рабыню; их
  rationale: Еврейский суффикс имеет мужской род и единственное число, хотя условие охватывает раба и рабыню. Русское «пострадавшего» естественно выражает общее применение нормы, а сноска сохраняет сведения о форме оригинала.
translation_notes:
  register: Современный литературный русский с ясным правовым звучанием. Термины «раб» и «рабыня» намеренно не смягчены. Формула «должен отпустить» передаёт нормативную обязательность, а не простой прогноз.
