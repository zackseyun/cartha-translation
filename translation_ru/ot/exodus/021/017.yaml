  text: וּ/מְקַלֵּ֥ל אָבִ֛י/ו וְ/אִמּ֖/וֹ מ֥וֹת יוּמָֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/017.yaml
  text: Whoever curses his father or his mother shall surely be put to death[a].
translation:
  language: ru
  text: Кто проклинает своего отца или свою мать, тот непременно должен быть предан смерти[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально на древнееврейском: «и свою мать»; в этой правовой формулировке имеется в виду проклятие любого из родителей.'
    reason: Сноска сохраняет формальное значение союза וְ и объясняет его распределительную передачу словом «или».
lexical_decisions:
- source_word: וּמְקַלֵּל
  choice: Кто проклинает
  rationale: Причастие породы пиэль употреблено субстантивированно и в правовой формулировке обозначает любого совершившего это преступление. «Проклинает» точнее передаёт направленную против человека словесную клятву, чем более широкое «злословит».
- source_word: אָבִיו
  choice: своего отца
  rationale: Возвратное притяжательное местоимение естественно по-русски соотносит отца с обобщённо названным нарушителем и передаёт суффикс 3-го лица мужского рода единственного числа.
- source_word: וְאִמּוֹ
  choice: или свою мать
  rationale: 'Хотя וְ буквально означает «и», в данной правовой паре союз имеет распределительный смысл: наказание относится к проклятию любого из родителей. Русское «или» ясно передаёт этот смысл.'
- source_word: מוֹת יוּמָת
  choice: непременно должен быть предан смерти
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает предписание, а пассивная каузативная форма указывает на назначенную смертную казнь, а не просто на неизбежность смерти.
theological_decisions:
- issue: Распределительный смысл пары «отец — мать»
  choice: Передать как «отца или свою мать», то есть применительно к каждому из родителей в отдельности.
  alternative: Формально сохранить «отца и свою мать».
  rationale: Союз וְ формально означает «и», однако в казуистической правовой формуле защищён каждый из двух родителей. «Или» сохраняет объём запрета и устраняет возможное ошибочное впечатление, будто наказуемо лишь одновременное проклятие обоих.
- issue: Смысл формулы смертной казни
  choice: «непременно должен быть предан смерти» как судебно-правовое предписание.
  alternative: «непременно умрёт» или «должен умереть».
  rationale: Пассивная каузативная форма יוּמָת обозначает предание смерти другими, то есть исполнение приговора; усилительная конструкция מוֹת יוּמָת подчёркивает обязательность наказания.
translation_notes:
  register: Современный литературный русский язык с кратким и строгим правовым звучанием. Формула «предан смерти» сохраняет достоинство библейского регистра, оставаясь понятной современному читателю; обобщённая конструкция «кто… тот» естественно передаёт древнееврейское субстантивированное причастие.
