  text: וְ/כִֽי יִגַּ֨ח שׁ֥וֹר אֶת אִ֛ישׁ א֥וֹ אֶת אִשָּׁ֖ה וָ/מֵ֑ת סָק֨וֹל יִסָּקֵ֜ל הַ/שּׁ֗וֹר וְ/לֹ֤א יֵאָכֵל֙ אֶת בְּשָׂר֔/וֹ וּ/בַ֥עַל הַ/שּׁ֖וֹר נָקִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/028.yaml
  text: And if an ox gores a man or a woman and he dies[a], the ox shall surely be stoned, and its flesh shall not be eaten; but the owner of the ox is clear.
translation:
  language: ru
  text: Если бык ударит рогами мужчину или женщину и пострадавший умрёт, быка непременно следует побить камнями, а мясо его нельзя есть; хозяин же быка свободен от ответственности[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «невиновен»; или: «не подлежит наказанию». Еврейское слово נָקִי — правовой термин, означающий, что в данном случае хозяин свободен от вины или взыскания.'
    reason: 'Лексическая альтернатива: еврейский термин шире любого одного русского юридического соответствия.'
lexical_decisions:
- source_word: וְכִי
  choice: Если
  rationale: Формула вводит условный случай в своде законов; в современном русском юридическом изложении начальное «если» естественно передаёт эту функцию, тогда как отдельное «и» звучало бы тяжеловесно.
- source_word: יִגַּח
  choice: ударит рогами
  rationale: Глагол обозначает удар или бодание рогами. Описательный перевод точен и, в отличие от «забодает», не предполагает сам по себе, что удар непременно оказался смертельным.
- source_word: שׁוֹר
  choice: бык
  rationale: В данном правовом контексте это обычное и понятное обозначение крупного рогатого животного; «вол» могло бы неоправданно указывать на кастрированного самца.
- source_word: אֶת־אִישׁ אוֹ אֶת־אִשָּׁה
  choice: мужчину или женщину
  rationale: Сохранено явное упоминание обоих полов, присутствующее в еврейском тексте.
- source_word: וָמֵת
  choice: и тот человек умрёт
  rationale: Так ясно обозначена смерть пострадавшего независимо от его пола и избегается двусмысленность местоимения в русском языке.
- source_word: סָקוֹל יִסָּקֵל
  choice: непременно должны побить камнями
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает предписание; «непременно» передаёт эту эмфазу.
- source_word: וְלֹא יֵאָכֵל אֶת־בְּשָׂרוֹ
  choice: а мясо его нельзя есть
  rationale: Естественная русская формулировка сохраняет запрет на употребление мяса животного в пищу.
- source_word: וּבַעַל הַשּׁוֹר
  choice: хозяин же быка
  rationale: בעל здесь обозначает владельца животного; «хозяин» ясно и естественно звучит в данном контексте.
- source_word: נָקִי
  choice: свободен от ответственности
  rationale: В правовом контексте слово обозначает освобождение от вины, взыскания или наказания. Выбранная формулировка сохраняет юридическую широту значения, не сводя его только к моральной невиновности.
theological_decisions:
- issue: Правовой статус хозяина быка в заключительной части стиха
  choice: Хозяин свободен от ответственности в описанном основном случае.
  alternative: Хозяин невиновен; либо хозяин освобождён лишь от конкретного наказания.
  rationale: Еврейское נָקִי кратко указывает на отсутствие вменяемой ответственности, но не уточняет здесь, идёт ли речь о моральной вине, гражданской обязанности или смертной казни. Более конкретные условия виновной небрежности появляются в следующих стихах, поэтому перевод не должен преждевременно сужать смысл.
translation_notes:
  register: Современный литературный русский язык с ясным правовым тоном. Синтаксис сделан естественным для обычного читателя, при этом сохранены условная структура, эмфатическое предписание и неопределённая широта заключительного правового термина.
