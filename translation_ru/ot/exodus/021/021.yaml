  yaml_path: translation/ot/exodus/021/021.yaml
  text: However[a], if he survives for a day or two, he shall not be avenged[b], for he is his money.
translation:
  language: ru
  text: Но если он проживёт день или два, то за него не будет взыскано возмездие[a], потому что он — деньги своего господина[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за него не будут мстить». Еврейская страдательная форма обозначает взыскание мести или правового возмездия, а не просто наказание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «потому что он — его деньги». Так выражена экономическая ценность раба для господина.'
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Передаёт противопоставление и оговорку к предыдущему правовому случаю естественно для современного русского языка.
- source_word: יוֹם אוֹ יוֹמַיִם יַעֲמֹד
  choice: проживёт ещё день или два
  rationale: Глагол буквально означает «стоять», но здесь указывает на то, что пострадавший остаётся в живых после побоев; формулировка не предполагает полного выздоровления.
- source_word: לֹא יֻקַּם
  choice: за него не будут мстить
  rationale: Страдательная форма от נקם говорит о возмездии за пострадавшего; безличная русская конструкция сохраняет юридико-ретрибутивный смысл и не подменяет его общим «не накажут».
- source_word: כִּי כַסְפּוֹ הוּא
  choice: потому что он — деньги своего господина
  rationale: Сохраняет резкую буквальную экономическую формулировку «он — его деньги», одновременно проясняя, к кому относится притяжательное местоимение.
theological_decisions:
- issue: Экономическое обоснование нормы о рабстве
  choice: Сохранить прямую формулировку «он — деньги своего господина».
  alternative: «он — его собственность» или «господин сам терпит убыток»
  rationale: Еврейский текст выражает основание нормы в денежно-экономических категориях. Смягчение формулировки скрыло бы тяжесть и напряжённость исходного текста.
- issue: Характер возмездия
  choice: «за него не будут мстить»
  alternative: «господина не накажут»
  rationale: Корень נקם конкретнее общего наказания и обозначает месть или правовое возмездие; перевод сохраняет эту смысловую особенность без уточнения не названной в стихе меры.
translation_notes:
  register: Современный литературный русский язык с лаконичным юридическим строем. «Господина» добавлено для ясности референта местоимения и отмечено буквальной формой в сноске; резкость экономического обоснования сохранена.
