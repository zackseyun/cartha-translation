base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/004.yaml
  text: If his master gives him a wife and she bears him sons or daughters[a], the wife and her children shall belong to her master[b], and he shall go out by himself.
translation:
  language: ru
  text: Если его хозяин даст ему жену и она родит ему сыновей или дочерей, жена и её дети будут принадлежать хозяину жены, а он уйдёт один.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть он уйдёт без жены и детей.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Сохраняет условную форму казуистического закона.
- source_word: אֲדֹנָיו / לַאדֹנֶיהָ
  choice: его хозяин / её хозяину
  rationale: В данном правовом контексте «хозяин» естественно передаёт власть над рабом и не вызывает ассоциации с божественным титулом, возможные при слове «господин».
- source_word: יִתֶּן לוֹ אִשָּׁה
  choice: даст ему жену
  rationale: אִשָּׁה допускает значения «женщина» и «жена», но упоминание рождённых ею детей указывает здесь на брачный союз.
- source_word: וְיָלְדָה לוֹ
  choice: она родит ему
  rationale: Естественная русская передача глагола ילד с косвенным дополнением; сохраняет связь детей с мужчиной.
- source_word: בָנִים אוֹ בָנוֹת
  choice: сыновей или дочерей
  rationale: Воспроизводит явное различение детей мужского и женского пола в еврейском тексте.
- source_word: הָאִשָּׁה וִילָדֶיהָ תִּהְיֶה לַאדֹנֶיהָ
  choice: жена и её дети будут принадлежать её хозяину
  rationale: Конструкция с היה ל выражает правовую принадлежность. Множественное «будут» требуется нормами русского согласования при составном подлежащем.
- source_word: וְהוּא יֵצֵא
  choice: а он уйдёт
  rationale: В этом законе יצא означает уход раба по окончании срока службы; «уйдёт» звучит естественно и не добавляет отсутствующего в форме глагола пояснения «будет освобождён».
- source_word: בְגַפּוֹ
  choice: один
  rationale: Идиома обозначает уход без сопровождения; контекст уточняет, что жена и дети с ним не уходят.
theological_decisions:
- issue: Передача отношений рабства и правовой принадлежности
  choice: Сохранить слова «хозяин» и «будут принадлежать», не смягчая описанную зависимость.
  alternative: Передать как «наниматель» и «останутся у», что ослабило бы выраженный в тексте правовой статус.
  rationale: Стих регулирует существовавшие отношения рабства. Перевод должен ясно передать правовую реальность текста, не оправдывая её и не заменяя современными трудовыми категориями.
- issue: Значение ухода мужчины одного
  choice: В основном тексте оставить краткое «уйдёт один», пояснив его в сноске.
  alternative: Вставить в основной текст толкование «уйдёт без жены и детей».
  rationale: Так сохраняется лаконичная еврейская идиома и одновременно устраняется возможная неясность для современного читателя.
translation_notes:
  register: Современный литературный русский язык с лаконичным правовым строем фразы. Союз «то» делает длинное условное предложение прозрачным; «а» подчёркивает контраст между принадлежностью семьи хозяину и уходом мужчины в одиночку.
