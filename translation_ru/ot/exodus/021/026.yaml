  yaml_path: translation/ot/exodus/021/026.yaml
  text: And if a man strikes the eye of his male servant or the eye of his female servant and destroys it[c][b][a], he shall let him go free in compensation for his eye.
translation:
  language: ru
  text: Если мужчина ударит своего раба или свою рабыню в глаз и повредит этот глаз, пусть отпустит раба или рабыню на свободу в возмещение за этот глаз[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и лишит этот глаз зрения». Еврейский глагол означает испортить или разрушить глаз и здесь подразумевает тяжёлое, постоянное повреждение. Буквально в конце: «за его глаз» или «вместо его глаза»; смысл выражения — освобождение как возмещение за повреждённый глаз.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Если
  rationale: Вводит условие казуистического закона; в русском юридическом изложении союз «если» естественно передаёт условную конструкцию, тогда как начальное ו не требует отдельного «и».
- source_word: יַכֶּה
  choice: ударит
  rationale: Прямое соответствие נכה в данном контексте; не предполагает многократного избиения.
- source_word: אִישׁ
  choice: мужчина
  rationale: Сохраняет грамматически мужское и конкретное обозначение лица в еврейском тексте.
- source_word: עַבְדּוֹ / אֲמָתוֹ
  choice: своего раба / свою рабыню
  rationale: В контексте владения и обязательного освобождения речь идёт о несвободном статусе; «слуга» и «служанка» смягчили бы социально-правовой смысл.
- source_word: וְשִׁחֲתָהּ
  choice: и повредит его
  rationale: שחת обозначает порчу или разрушение глаза, по контексту серьёзное и постоянное повреждение; «повредит» сохраняет широту значения, не сводя его непременно к полной слепоте.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: пусть отпустит пострадавшего на свободу
  rationale: Передаёт предписание об освобождении. «Пострадавшего» естественно охватывает как раба, так и рабыню и устраняет неясность русского местоимения.
- source_word: תַּחַת עֵינוֹ
  choice: в возмещение за глаз
  rationale: В правовом контексте תחת выражает замену или компенсацию; формулировка передаёт освобождение как возмещение за нанесённый глазу вред.
theological_decisions:
- issue: Передача терминов несвободного статуса
  choice: раб / рабыня
  alternative: слуга / служанка
  rationale: Закон предполагает власть хозяина и освобождение как правовое последствие увечья, поэтому прямое обозначение рабского статуса точнее и не смягчает историческую реальность.
- issue: Род субъекта казуистического закона
  choice: мужчина
  alternative: человек / кто-нибудь
  rationale: Еврейское אִישׁ имеет мужскую форму; перевод сохраняет её, не превращая норму в гендерно нейтральную формулировку.
- issue: Мужской объектный суффикс после упоминания раба и рабыни
  choice: пострадавшего
  alternative: его / её
  rationale: Еврейский текст использует мужской суффикс как обобщающий, хотя правило относится к обоим названным лицам. Русское существительное сохраняет общий охват без искусственного выбора одного пола.
translation_notes:
  register: Современный литературный русский с ясной правовой формулировкой. Слово «раб» сохраняет историко-правовую реальность текста; синтаксис сделан естественным для современного читателя без устранения смысловой широты глагола שחת.
