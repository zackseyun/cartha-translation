  to: Если мужчина ударит своего раба или свою рабыню в глаз и повредит этот глаз, пусть отпустит раба или рабыню на свободу в возмещение за этот глаз[a].
  rationale: 'Исправлена двусмысленность русского местоимения: повреждается именно глаз, а не неопределённо обозначенное лицо. В предписании повторены «раба или рабыню», чтобы ясно сохранить охват обеих альтернатив при естественном русском синтаксисе. Примечания объединены в одно, поскольку оба оставшихся комментария относятся к лексическому диапазону повреждения глаза и к значению правовой формулы; прежнее грамматическое пояснение переформулировано через основной текст и не требуется.'
