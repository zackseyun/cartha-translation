base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/014.yaml
  text: So Moses went down from the mountain to the people[a], and he consecrated the people, and they washed their garments.
translation:
  language: ru
  text: Моисей сошёл с горы к народу и освятил[a] народ, а они выстирали свои одежды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвятил», «сделал священным»; то есть подготовил к встрече с Богом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: сошёл
  rationale: Глагол ירד обозначает движение вниз; «сошёл» естественно передаёт спуск Моисея с горы.
- source_word: מִן הָהָר
  choice: с горы
  rationale: В ближайшем контексте הַר — гора Синай; обычное русское соответствие — «гора».
- source_word: אֶל הָעָם
  choice: к народу
  rationale: עָם обычно означает «народ», а предлог אֶל указывает направление движения к нему.
- source_word: וַיְקַדֵּשׁ
  choice: освятил
  rationale: В породе пиэль קדשׁ здесь означает ритуально подготовить и отделить для встречи с Богом. «Освятил» сохраняет библейский язык святости; смысл уточнён в сноске без сведения действия лишь к нравственному изменению.
- source_word: הָעָם
  choice: народ
  rationale: Повтор существительного сохранён вслед за еврейским текстом, а не заменён местоимением.
- source_word: וַיְכַבְּסוּ
  choice: выстирали
  rationale: כבס обозначает именно стирку одежды; «выстирали» точнее русского «омыли» и естественнее в современном языке.
- source_word: שִׂמְלֹתָם
  choice: свои одежды
  rationale: שִׂמְלָה обозначает одежду или одеяние. Возвратное «свои» естественно указывает, что люди выстирали принадлежавшую им одежду, а «одежды» сохраняет dignified ritual register.
theological_decisions:
- issue: Передача языка ритуальной святости при подготовке к богоявлению на Синае
  choice: освятил народ
  alternative: посвятил народ; отделил народ как святой
  rationale: «Освятил» прямо сохраняет корень и богословскую напряжённость קדשׁ, тогда как контекст и сноска показывают, что речь идёт о ритуальной подготовке и отделении для встречи с Богом, а не обязательно о внутреннем нравственном преобразовании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Союз «а» перед последним действием разграничивает действие Моисея и ответное действие народа. Повтор «народ» сохранён ради соответствия еврейской структуре.
