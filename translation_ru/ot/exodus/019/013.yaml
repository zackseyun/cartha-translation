  text: לֹא תִגַּ֨ע בּ֜/וֹ יָ֗ד כִּֽי סָק֤וֹל יִסָּקֵל֙ אוֹ יָרֹ֣ה יִיָּרֶ֔ה אִם בְּהֵמָ֥ה אִם אִ֖ישׁ לֹ֣א יִחְיֶ֑ה בִּ/מְשֹׁךְ֙ הַ/יֹּבֵ֔ל הֵ֖מָּה יַעֲל֥וּ בָ/הָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/013.yaml
  text: No hand shall touch him[a], for he must surely be stoned or surely shot; whether beast or man, he shall not live. When the ram’s horn sounds a long blast[c][b], they may go up on the mountain.
translation:
  language: ru
  text: Никто не должен касаться его рукой[a], ибо его непременно должны побить камнями или поразить стрелой[b]. Будь то животное или человек, он не должен остаться в живых. Когда протяжно прозвучит бараний рог[c], они могут взойти на гору.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Никто не должен касаться её рукой», если местоимение относится к горе или в более общем смысле — к тому, что стало запретным. Вероятнее, речь идёт о нарушителе, которого нельзя касаться непосредственно и которого следует казнить на расстоянии.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «пронзить». Еврейский глагол может означать поражение выстрелом — в данном контексте, вероятно, стрелой.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «при протяжном звучании йовеля». Здесь «йовель», вероятно, означает бараний рог, а выражение — долгий, протяжный сигнал.'
    reason: cultural_note
lexical_decisions:
- source_word: תִגַּע בּוֹ יָד
  choice: Пусть никто не касается его рукой
  rationale: Передаёт буквальный образ руки и безлично-правовой запрет; местоимение мужского рода естественнее всего относится к нарушителю, которого нельзя касаться непосредственно.
- source_word: סָקוֹל יִסָּקֵל
  choice: его непременно следует побить камнями
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает обязательность и неизбежность наказания; «непременно следует» естественно выражает обе стороны значения.
- source_word: יָרֹה יִיָּרֶה
  choice: застрелить
  rationale: В данном контексте глагол ירה вероятнее всего обозначает поражение выстрелом, скорее всего стрелами; русский глагол сохраняет способ казни на расстоянии.
- source_word: אִם בְּהֵמָה אִם אִישׁ
  choice: Будь то животное или человек
  rationale: Ясно передаёт распространение одной и той же санкции на обе названные категории.
- source_word: לֹא יִחְיֶה
  choice: он не должен остаться в живых
  rationale: Сохраняет судебно-нормативную силу фразы и естественно соотносится с единичным представителем любой из двух категорий.
- source_word: בִּמְשֹׁךְ הַיֹּבֵל
  choice: Когда протяжно прозвучит бараний рог
  rationale: Передаёт идиому «при протягивании йовеля» как длительный сигнал бараньего рога, не смешивая её с позднейшим значением юбилейного года.
- source_word: הֵמָּה יַעֲלוּ בָהָר
  choice: они могут взойти на гору
  rationale: В контексте снятия прежнего запрета форма понимается как разрешение; «взойти» соответствует возвышенному, но современному регистру.
theological_decisions:
- issue: К чему относится местоименный суффикс в בּוֹ («его/её»)
  choice: К нарушителю, прикоснувшемуся к горе
  alternative: К горе или, шире, к тому, что стало запретным вследствие соприкосновения
  rationale: Ближайший правовой контекст говорит о человеке или животном, переступившем границу; запрет прямого прикосновения к нарушителю согласуется с последующей казнью на расстоянии. Подлинная неоднозначность отмечена в сноске.
- issue: Значение יָרֹה יִיָּרֶה
  choice: Будет застрелен, вероятно стрелами
  alternative: Будет пронзён
  rationale: Корень ירה способен обозначать стрельбу; контекст противопоставляет или сочетает способы казни без непосредственного прикосновения. Более широкое значение сохранено в сноске.
- issue: Модальность הֵמָּה יַעֲלוּ
  choice: 'Разрешение: «они могут взойти»'
  alternative: 'Простой футурум или предписание: «они взойдут / пусть взойдут»'
  rationale: После сигнала прекращается установленный ранее запрет, поэтому разрешительное понимание наиболее естественно, хотя сама глагольная форма модальность явно не маркирует.
translation_notes:
  register: Современный литературный русский язык с кратким судебно-торжественным звучанием. Архаизмы сведены к минимуму; «взойти» сохранено как естественное слово для подъёма на гору. Синтаксис делает ясными запрет, наказание и последующее разрешение, не устраняя неоднозначность местоимения и глагола ירה.
