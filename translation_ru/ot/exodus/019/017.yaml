  yaml_path: translation/ot/exodus/019/017.yaml
  text: Then Moses brought the people out of the camp to meet God[a], and they took their stand at the foot of the mountain.
translation:
  language: ru
  text: Тогда Моисей вывел народ из лагеря навстречу Богу, и они встали у подножия горы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у основания горы». Еврейское выражение обозначает нижнюю часть горы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: вывел
  rationale: Каузативная форма глагола יצא означает, что Моисей побудил народ выйти; «вывел» точно и естественно передаёт это значение.
- source_word: לִקְרַאת
  choice: навстречу
  rationale: Сочетание указывает на движение к предстоящей встрече; русское «навстречу Богу» сохраняет как направленность движения, так и смысл встречи.
- source_word: הָאֱלֹהִים
  choice: Богу
  rationale: В данном контексте слово однозначно обозначает Бога; форма с определённым артиклем не требует добавления указательного или иного уточнения в русском языке.
- source_word: מִן הַמַּחֲנֶה
  choice: из лагеря
  rationale: Фраза обозначает исходный пункт движения. «Из лагеря» — ясное современное соответствие без лишней архаизации.
- source_word: וַיִּתְיַצְּבוּ
  choice: они встали
  rationale: Возвратная порода передаёт занятие устойчивого положения. В контексте «встали» звучит естественно и не добавляет не выраженной в тексте военной или церемониальной окраски.
- source_word: בְּתַחְתִּית הָהָר
  choice: у подножия горы
  rationale: Выражение обозначает нижнюю часть или основание горы; «у подножия горы» — точный и обычный русский оборот, не создающий ошибочного впечатления, будто народ находился буквально под горой.
theological_decisions:
- issue: Передача הָאֱלֹהִים в повествовании о богоявлении на Синае
  choice: Богу
  alternative: этому Богу / Божеству
  rationale: Контекст говорит о Боге Израиля, а обычная русская передача имени-обозначения здесь — «Бог». Варианты с дополнительным определением были бы неестественны и могли бы привнести отсутствующее в еврейском тексте противопоставление.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Лагерь» предпочтён архаичному «стан», а простое «встали» сохраняет ясность и не усиливает церемониальный оттенок сверх исходного текста.
