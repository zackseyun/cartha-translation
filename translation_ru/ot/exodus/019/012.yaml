base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/012.yaml
  text: And you shall set bounds for the people all around[a], saying, ‘Be careful not to go up on the mountain or touch its edge. Whoever touches the mountain shall surely be put to death.’
translation:
  language: ru
  text: 'Установи для народа границу со всех сторон и скажи: «Остерегайтесь подниматься на гору или прикасаться к её краю. Всякий, кто прикоснётся к горе, непременно будет казнён[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непременно умрёт». Древнееврейская конструкция особо подчёркивает неизбежность смерти; перевод «будет казнён» отражает пассивную форму глагола и следующий стих, где говорится об умерщвлении нарушителя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְבַּלְתָּ
  choice: Проведи границу
  rationale: Каузативная форма глагола גבל означает установить или обозначить предел. «Проведи границу» естественно передаёт конкретное установление запретного рубежа, не предполагая непременно сооружения ограды.
- source_word: אֶת־הָעָם סָבִיב
  choice: для народа … со всех сторон
  rationale: עם обозначает собравшийся народ Израиля, а סביב — окружность или периметр. Русская формулировка ясно показывает, что граница должна окружать место пребывания народа.
- source_word: לֵאמֹר
  choice: и скажи
  rationale: Инфинитив вводит содержание повеления; личная форма в русском языке звучит естественнее буквального «говоря».
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Остерегайтесь
  rationale: 'Возвратная конструкция с שׁמר выражает настойчивое предостережение: следить за собой, чтобы не совершить запрещённого.'
- source_word: עֲלוֹת בָּהָר
  choice: подниматься на гору
  rationale: עלה с предлогом ב здесь означает восходить на гору, вступая в запретную область.
- source_word: וּנְגֹעַ בְּקָצֵהוּ
  choice: и прикасаться к её краю
  rationale: נגע означает «прикасаться», а קצה — край или оконечность. Союз «и» остаётся в сфере общего запрета после «остерегайтесь».
- source_word: כָּל־הַנֹּגֵעַ בָּהָר
  choice: Всякий, кто прикоснётся к горе
  rationale: Причастная конструкция имеет обобщающее и распределительное значение; выбранная формулировка естественна по-русски и сохраняет всеобщность предупреждения.
- source_word: מוֹת יוּמָת
  choice: непременно будет предан смерти
  rationale: Сочетание абсолютного инфинитива с пассивной формой глагола усиливает неизбежность наказания. «Будет предан смерти» сохраняет пассивный смысл, а «непременно» передаёт эмфатическую конструкцию.
theological_decisions:
- issue: 'Значение формулы מוֹת יוּמָת: неизбежная смерть или назначенная казнь'
  choice: непременно будет предан смерти
  alternative: непременно умрёт
  rationale: Пассивная глагольная форма и непосредственное продолжение в стихе 13, где описан способ умерщвления нарушителя, поддерживают смысл назначенной казни. Альтернатива остаётся грамматически возможной и указана в сноске, чтобы не скрывать диапазон древнееврейской формулы.
translation_notes:
  register: 'Современный литературный русский язык с достоинством прямой божественной заповеди. Императив «Проведи» передаёт повелительное значение контекста; формулировки понятны без специальной церковной лексики. Синтаксическая сфера запрета сохранена: запрещены и восхождение на гору, и прикосновение к её краю.'
