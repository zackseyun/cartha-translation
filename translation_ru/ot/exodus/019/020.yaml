source:
  edition: WLC
  text: וַ/יֵּ֧רֶד יְהוָ֛ה עַל הַ֥ר סִינַ֖י אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/יִּקְרָ֨א יְהוָ֧ה לְ/מֹשֶׁ֛ה אֶל רֹ֥אשׁ הָ/הָ֖ר וַ/יַּ֥עַל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/020.yaml
  text: And Yahweh came down on Mount Sinai[a], to the top of the mountain. Then Yahweh called Moses to the top of the mountain[b], and Moses went up.
translation:
  language: ru
  text: И Яхве сошёл на гору Синай[a], на вершину горы. Затем Яхве позвал Моисея на вершину горы[b], и Моисей поднялся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спустился на гору Синай, к вершине горы».'
    reason: Лексически ירד может быть передано как «сошёл» или «спустился», а предлог אֶל — как направленность «на» либо «к» в зависимости от осмысления движения.
  - marker: b
    text: 'Буквально: «к голове горы», то есть к её верхней части, вершине.'
    reason: Сохранено пояснение пространственной метафоры еврейского слова רֹאשׁ — «голова, верх, вершина».
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: сошёл
  rationale: Глагол ירד означает движение вниз — «сходить, спускаться». «Сошёл» естественно для современного русского повествования и образует смысловой контраст с последующим «поднялся».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, обозначенное тетраграмматоном יהוה, а не заменяет его титулом.
- source_word: הַר סִינַי
  choice: гора Синай
  rationale: Общепринятое и естественное русское наименование этой горы.
- source_word: אֶל רֹאשׁ הָהָר
  choice: на вершину горы
  rationale: רֹאשׁ буквально значит «голова», но применительно к горе обозначает её верх или вершину. Выбран идиоматичный русский эквивалент.
- source_word: וַיִּקְרָא
  choice: позвал
  rationale: В данном контексте קרא означает обращённый к человеку зов. «Позвал» непосредственно передаёт смысл, не усиливая его до более властного «призвал» или «вызвал».
- source_word: לְמֹשֶׁה
  choice: Моисея
  rationale: Имя передано в традиционной русской форме и поставлено в падеж, требуемый глаголом «позвал».
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Глагол עלה означает движение вверх. «Поднялся» звучит естественно и сохраняет противопоставление со словом «сошёл».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно употреблено личное имя יהוה. Форма «Яхве» сохраняет имя и не подменяет его титулом; вариант «Иегова» отражает более позднюю смешанную традицию произношения.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным ритмом. Повтор «вершину горы» сохранён вслед за еврейским текстом, а не устранён стилистически. Союз וַ перед вторым действием передан словом «затем», чтобы ясно показать последовательность событий.
