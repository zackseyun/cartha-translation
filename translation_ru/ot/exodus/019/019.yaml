  text: וַ/יְהִי֙ ק֣וֹל הַ/שּׁוֹפָ֔ר הוֹלֵ֖ךְ וְ/חָזֵ֣ק מְאֹ֑ד מֹשֶׁ֣ה יְדַבֵּ֔ר וְ/הָ/אֱלֹהִ֖ים יַעֲנֶ֥/נּוּ בְ/קֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/019.yaml
  text: And the sound of the trumpet kept growing stronger and stronger[a]; Moses would speak[b], and God would answer him with a voice.
translation:
  language: ru
  text: Звук трубы становился всё сильнее и сильнее[a]. Моисей говорил, и Бог отвечал ему голосом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «становился всё громче и громче». Буквально еврейский текст описывает звук трубы как «идущий и становящийся очень сильным».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «голосом». Возможно также: «громом» или «так, что это было слышно».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: становился
  rationale: Повествовательная форма вводит развитие сцены и естественно передаётся вместе с продолжающимся усилением, выраженным далее причастием.
- source_word: קוֹל הַשּׁוֹפָר
  choice: звук трубы
  rationale: В сочетании с שׁוֹפָר слово קוֹל естественно означает «звук»; «труба» ясно передаёт рог, служащий сигнальным инструментом.
- source_word: הוֹלֵךְ וְחָזֵק מְאֹד
  choice: становился всё сильнее и сильнее
  rationale: Конструкция описывает непрерывное нарастание. «Сильнее и сильнее» сохраняет образ усиления, не сужая его непременно до громкости.
- source_word: מֹשֶׁה יְדַבֵּר
  choice: Моисей говорил
  rationale: Имперфект изображает продолжающееся либо повторявшееся действие внутри сцены; русское несовершенное прошедшее сохраняет эту незавершённость без неестественной конструкции.
- source_word: וְהָאֱלֹהִים יַעֲנֶנּוּ
  choice: и Бог отвечал ему
  rationale: Несовершенный вид естественно согласуется с продолжающейся или повторяющейся речью Моисея и ответом Бога.
- source_word: בְּקוֹל
  choice: голосом
  rationale: Это формально и естественно сохраняет буквальное значение «голосом/звуком», не вводя толкование «громом».
theological_decisions:
- issue: Характер ответа Бога на Синае
  choice: Бог отвечал Моисею «голосом»
  alternative: Бог отвечал ему громом; Бог отвечал ему так, что это было слышно
  rationale: Еврейское בְּקוֹל допускает значение голоса или слышимого звука, но само по себе не называет гром. Основной текст сохраняет исходную формулировку и её смысловую напряжённость, а толковательные варианты вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной интонацией. Несовершенный вид глаголов передаёт продолжающееся или повторявшееся взаимодействие. Все примечания обозначены в основном тексте.
