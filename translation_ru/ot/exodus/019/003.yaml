base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/003.yaml
  text: And Moses went up to God[a], and Yahweh called to him from the mountain, saying, “Thus you shall say to the house of Jacob, and tell the sons of Israel:”
translation:
  language: ru
  text: 'Моисей поднялся к Богу, и Яхве воззвал к нему с горы: «Так скажи дому Иакова и объяви сыновьям Израиля[a]:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детям Израиля»; «народу Израиля». В еврейском тексте буквально: «сыновьям Израиля» — мужское собирательное выражение.'
    reason: Лексическая альтернатива и пояснение охвата собирательного выражения.
lexical_decisions:
- source_word: עָלָה
  choice: поднялся
  rationale: Передаёт направленное вверх движение естественным современным русским глаголом.
- source_word: הָאֱלֹהִים
  choice: к Богу
  rationale: Определённая форма указывает здесь на Бога Израиля; русская конструкция с именем «Бог» не требует передачи артикля.
- source_word: וַיִּקְרָא אֵלָיו
  choice: воззвал к нему
  rationale: Сочетание קרא с אֶל означает обращённый к кому-либо зов; «воззвал к нему» сохраняет направленность и достойный библейский регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: מִן הָהָר
  choice: с горы
  rationale: הַר в контексте обозначает гору Синай; русское «с горы» естественно передаёт исходную точку голоса.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Инфинитив вводит прямую речь; в современном русском его функцию естественно выполняет пунктуационное оформление без избыточного «говоря».
- source_word: כֹּה תֹאמַר
  choice: Так скажи
  rationale: Сохраняет формулу передачи официального повеления и звучит естественно по-русски.
- source_word: לְבֵית יַעֲקֹב
  choice: дому Иакова
  rationale: Буквально сохраняет коллективный и заветный образ дома Иакова.
- source_word: וְתַגֵּיד
  choice: и возвести
  rationale: Порода hифиль глагола נגד выражает сообщение или объявление; «возвести» сохраняет параллелизм с «скажи» и торжественность поручения.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет грамматически мужское собирательное выражение и параллель с «домом Иакова»; возможное инклюзивное значение пояснено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное заветное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Мужское собирательное выражение לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: детям Израиля; народу Израиля
  rationale: «Сынам» формально соответствует בְּנֵי и сохраняет параллельную структуру исходного текста, а более широкое собирательное значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис прямой и понятный; вводное לֵאמֹר передано двоеточием. Маркер сноски поставлен непосредственно после выражения, которое он поясняет.
