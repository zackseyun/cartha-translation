base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/009.yaml
  text: And Yahweh said to Moses[a], “Behold, I am coming to you in a thick cloud, so that the people may hear when I speak with you, and may also believe in you forever.” Then Moses told Yahweh the words of the people.
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Вот, Я иду к тебе в густом облаке, чтобы народ слышал, как Я говорю с тобой, и всегда верил в тебя[a]». И Моисей передал Яхве слова народа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доверял тебе» или «верил тебе». Еврейское выражение может обозначать доверие к Моисею как к подтверждённому Богом вестнику.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: הִנֵּה אָנֹכִי בָּא
  choice: Вот, Я иду
  rationale: Сохраняет указательно-торжественное «вот» и передаёт причастную форму как близкое, уже предстоящее действие.
- source_word: בְּעַב הֶעָנָן
  choice: в густом облаке
  rationale: Естественно по-русски передаёт образ плотного, густого облака.
- source_word: בַּעֲבוּר
  choice: чтобы
  rationale: В данном контексте вводит цель Божьего явления.
- source_word: בְּדַבְּרִי עִמָּךְ
  choice: как Я говорю с тобой
  rationale: Передаёт временное значение конструкции и сохраняет взаимную направленность разговора.
- source_word: וְגַם בְּךָ יַאֲמִינוּ לְעוֹלָם
  choice: и чтобы он всегда верил тебе
  rationale: Глагол с предлогом ב выражает устойчивое доверие к Моисею как к подтверждённому Богом вестнику; «верил тебе» естественно относится к достоверности его слов.
- source_word: וַיַּגֵּד ... אֶת דִּבְרֵי הָעָם
  choice: И Моисей передал ... слова народа
  rationale: «Передал» ясно выражает сообщение сказанного, а «слова народа» сохраняет лексику оригинала.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит личное имя; транслитерация сохраняет его и не подменяет титулом.
- issue: Смысл בְּךָ יַאֲמִינוּ применительно к Моисею
  choice: верил тебе
  alternative: доверял тебе; верил в тебя
  rationale: Фраза говорит о признании Моисея достоверным Божьим посредником. Выбранный вариант сохраняет доверительный смысл, не придавая ему оттенка поклонения; допустимая неоднозначность отмечена в сноске.
- issue: Длительность לְעוֹלָם
  choice: всегда
  alternative: вовеки; навсегда
  rationale: «Всегда» ясно передаёт продолжительность, не уточняя сверх контекста её точные границы.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся близким к еврейскому повествованию, но не выглядит архаичным; прописная буква в местоимении «Я» подчёркивает прямую речь Бога без добавления смыслов к оригиналу.
