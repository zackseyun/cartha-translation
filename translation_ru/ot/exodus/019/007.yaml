base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/007.yaml
  text: So Moses came and called for the elders of the people[b][a], and set before them all these words that Yahweh had commanded him.
translation:
  language: ru
  text: Итак, Моисей пришёл, позвал старейшин народа[a] и предложил им все эти слова[b], которые повелел ему Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «созвал старейшин народа».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все эти дела» или «всё это». Еврейское слово может обозначать произнесённые слова, дела или предметы; здесь выбрано «слова», поскольку Моисей передаёт сказанное Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Глагол בוא может передаваться как «приходить» или «идти» в зависимости от точки отсчёта; здесь Моисей возвращается от Яхве к народу, поэтому «пришёл» естественно для повествования.
- source_word: וַיִּקְרָא לְזִקְנֵי הָעָם
  choice: позвал старейшин народа
  rationale: Сочетание קרא с ל может означать обращение к кому-либо или призыв явиться. «Позвал» сохраняет эту широту и не придаёт действию излишне официальный оттенок.
- source_word: זִקְנֵי הָעָם
  choice: старейшин народа
  rationale: זקנים обозначает признанных старших представителей общины; «старейшины» сохраняет общественно-политический смысл термина.
- source_word: וַיָּשֶׂם לִפְנֵיהֶם
  choice: изложил им
  rationale: Буквально выражение означает «положил перед ними», но применительно к сообщению по-русски естественно «изложил им»; образ представления содержания перед слушателями сохраняется по смыслу.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: דברים может означать «слова», «дела», «вопросы» или «вещи». В контексте Моисей передаёт предшествующую речь Бога, поэтому выбрано «слова», а более широкие значения отмечены в сноске.
- source_word: אֲשֶׁר צִוָּהוּ יְהוָה
  choice: которые повелел ему Яхве
  rationale: Относительное предложение указывает, что эти слова исходят от Яхве и имеют силу повеления. Русская конструкция следует форме еврейского текста, не добавляя явно отсутствующего глагола «передать».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано как «Яхве», что непосредственно отражает тетраграмматон и отличает его от титула «Господь».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблён тетраграмматон. Передача «Яхве» сохраняет личное имя Бога, не заменяя его титулом и не привнося конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Союз «итак» передаёт повествовательную связь с предыдущим эпизодом; «изложил им» естественно воспроизводит еврейскую идиому без неясного буквального оборота «положил перед ними».
