base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/002.yaml
  text: They set out from Rephidim and came to the wilderness of Sinai[a], and they camped in the wilderness. There Israel camped before the mountain.
translation:
  language: ru
  text: Они отправились из Рефидима, пришли в Синайскую пустыню и расположились станом в пустыне. Там Израиль расположился станом перед горой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напротив горы». Еврейский предлог может обозначать положение перед чем-либо или напротив него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: они отправились
  rationale: Глагол נסע в повествовании о переходах означает сняться с места и двинуться дальше; «отправились» естественно передаёт начало пути.
- source_word: מֵרְפִידִים
  choice: из Рефидима
  rationale: Название места передано принятой русской транслитерацией; предлог מ передан как «из».
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: בוא может означать «приходить», «входить» или «прибывать»; «пришли» естественно сочетается с обозначением места назначения.
- source_word: מִדְבַּר סִינַי
  choice: Синайскую пустыню
  rationale: מִדְבָּר обозначает пустынную, необжитую местность; сочетание с Синаем по-русски естественно передаётся как «Синайская пустыня».
- source_word: וַיַּחֲנוּ
  choice: расположились станом
  rationale: חנה означает разбить или расположить стан; эта формулировка сохраняет походный контекст и звучит достойно в современном русском.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Повтор слова מִדְבָּר сохранён вслед за еврейским текстом, а не устранён стилистически.
- source_word: וַיִּחַן שָׁם יִשְׂרָאֵל
  choice: Там Израиль расположился станом
  rationale: Единственное число глагола при собирательном имени «Израиль» сохранено; вынесенное вперёд «там» отражает порядок и лёгкое смысловое выделение места в еврейском тексте.
- source_word: נֶגֶד הָהָר
  choice: перед горой
  rationale: נֶגֶד указывает на положение перед чем-либо, напротив него или лицом к нему. «Перед горой» сохраняет пространственное значение, не уточняя ориентацию чрезмерно.
