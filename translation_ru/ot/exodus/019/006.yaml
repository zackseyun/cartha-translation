  text: וְ/אַתֶּ֧ם תִּהְיוּ לִ֛/י מַמְלֶ֥כֶת כֹּהֲנִ֖ים וְ/ג֣וֹי קָד֑וֹשׁ אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁ֥ר תְּדַבֵּ֖ר אֶל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/006.yaml
  text: And you shall be to me a kingdom of priests and a holy nation[b][a]. These are the words that you shall speak to the sons of Israel.
translation:
  language: ru
  text: А вы будете Мне царством священников[a] и святым народом. Вот слова, которые ты скажешь сынам Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священническим царством». Еврейское выражение может означать царство, состоящее из священников, или царство, отличающееся священническим характером. Сравните 1 Пет. 2:9, где употреблено родственное выражение «царственное священство».'
    reason: lexical_alternative
  - marker: b
    text: «Сыны Израиля» — еврейское обозначение всего народа Израиля, а не только мужчин.
    reason: cultural_note
lexical_decisions:
- source_word: תִּהְיוּ
  choice: будете
  rationale: Имперфект Qal глагола היה выражает здесь будущее состояние в рамках заветного провозглашения; форма «будете» сохраняет и обещание, и торжественную направленность высказывания, не превращая его однозначно в приказ.
- source_word: לִי
  choice: у Меня
  rationale: Предлог ל с суффиксом первого лица обозначает принадлежность и отношение к Богу. По-русски «у Меня» естественно передаёт принадлежность в конструкции «будете у Меня», не сводя смысл только к служению «для Меня».
- source_word: מַמְלֶכֶת כֹּהֲנִים
  choice: царством священников
  rationale: Конструктная цепочка буквально обозначает «царство священников». Такое соответствие сохраняет существительное «царство» и не подменяет еврейское выражение позднейшей формулой «царственное священство».
- source_word: גּוֹי קָדוֹשׁ
  choice: святым народом
  rationale: Слово גּוֹי здесь обозначает народ как единое сообщество, а קָדוֹשׁ — его отделённость и посвящённость Богу. «Святой народ» сохраняет заветное и богословское звучание.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Вот слова
  rationale: В контексте прямого поручения דְּבָרִים означает «слова». Русское «вот слова» естественно вводит содержание, которое Моисей должен передать.
- source_word: תְּדַבֵּר
  choice: ты должен сказать
  rationale: Имперфект Piel второго лица единственного числа обращён к Моисею и в данном контексте выражает поручение. «Ты должен сказать» ясно передаёт обязательность, оставаясь естественным современным русским выражением.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Перевод сохраняет буквально выраженную в еврейском тексте сыновнюю и грамматически мужскую форму; примечание поясняет, что идиома относится ко всему народу Израиля.
theological_decisions:
- issue: Корпоративное призвание Израиля в завете
  choice: царством священников
  alternative: священническим царством; царственным священством
  rationale: 'Основной текст сохраняет формальную структуру еврейского словосочетания и присущую ему неоднозначность: речь может идти как о царстве, состоящем из священников, так и о царстве со священническим характером. Формула из 1 Пет. 2:9 не вносится в основной текст.'
- issue: Гендерно выраженное обозначение народа завета
  choice: сынам Израиля
  alternative: израильтянам; народу Израиля; детям Израиля
  rationale: Выбор сохраняет мужскую сыновнюю форму источника, а примечание предотвращает ошибочное понимание, будто речь идёт только о мужчинах.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранены заветная формула, образ царства и буквальное корпоративное наименование Израиля; местоимение «Меня» написано с прописной буквы как уважительное обозначение Бога.
