source:
  edition: WLC
  text: וְ/הַ֤ר סִינַי֙ עָשַׁ֣ן כֻּלּ֔/וֹ מִ֠/פְּנֵי אֲשֶׁ֨ר יָרַ֥ד עָלָ֛י/ו יְהוָ֖ה בָּ/אֵ֑שׁ וַ/יַּ֤עַל עֲשָׁנ/וֹ֙ כְּ/עֶ֣שֶׁן הַ/כִּבְשָׁ֔ן וַ/יֶּחֱרַ֥ד כָּל הָ/הָ֖ר מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/018.yaml
  text: Mount Sinai was all in smoke because Yahweh had descended on it in fire[a], and its smoke went up like the smoke of a furnace, and the whole mountain trembled greatly.
translation:
  language: ru
  text: Гора Синай вся дымилась, потому что Яхве сошёл на неё в огне. Дым от неё поднимался, как дым из печи[a], и вся гора сильно содрогалась.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как дым из обжиговой печи».'
    reason: Еврейское כִּבְשָׁן может обозначать печь, используемую для обжига; примечание сохраняет более конкретную лексическую возможность.
lexical_decisions:
- source_word: וְהַר סִינַי
  choice: Гора Синай
  rationale: Название передано естественно для русского повествования; начальный וְ не требует отдельного союза вне более широкого контекста стиха.
- source_word: עָשַׁן כֻּלּוֹ
  choice: вся дымилась
  rationale: Сохраняет глагольный образ и подчёркивает, что дымом была охвачена вся гора.
- source_word: מִפְּנֵי אֲשֶׁר
  choice: потому что
  rationale: Оборот прямо вводит причину происходящего.
- source_word: יָרַד עָלָיו יְהוָה
  choice: Яхве сошёл на неё
  rationale: יָרַד передано как «сошёл», а местоименный суффикс относится к горе; имя יהוה сохранено как личное имя «Яхве».
- source_word: בָּאֵשׁ
  choice: в огне
  rationale: Передаёт огонь как сопровождающую форму или среду нисхождения, не уточняя сверх исходного текста.
- source_word: וַיַּעַל עֲשָׁנוֹ
  choice: Дым от неё поднимался
  rationale: Местоименный суффикс естественно отнесён к горе; «поднимался» сохраняет направленное вверх движение.
- source_word: כְּעֶשֶׁן הַכִּבְשָׁן
  choice: как дым из печи
  rationale: כִּבְשָׁן обозначает печь, в том числе обжиговую; общее «печь» сохраняет образ без излишней конкретизации.
- source_word: וַיֶּחֱרַד כָּל הָהָר מְאֹד
  choice: и вся гора сильно содрогалась
  rationale: «Содрогалась» выражает мощное физическое дрожание горы, а «сильно» передаёт усилитель מְאֹד.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным звучанием. Повтор слова «гора» сохранён ради ясности и ритма исходного описания; маркер примечания поставлен при слове, к которому относится лексическая альтернатива.
