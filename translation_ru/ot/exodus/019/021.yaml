  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רֵ֖ד הָעֵ֣ד בָּ/עָ֑ם פֶּן יֶהֶרְס֤וּ אֶל יְהוָה֙ לִ/רְא֔וֹת וְ/נָפַ֥ל מִמֶּ֖/נּוּ רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/021.yaml
  text: And Yahweh said to Moses[a], “Go down; warn the people, lest they break through to Yahweh to look[b], and many of them fall.”
translation:
  language: ru
  text: 'И Яхве сказал Моисею: «Спустись и предупреди народ, чтобы они не прорвались к Яхве, желая увидеть его[a], иначе многие из них падут[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посмотреть на него». Еврейский глагол может означать как «увидеть», так и «посмотреть»; здесь речь идёт о попытке увидеть явление Яхве.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и падёт много из них». В этом контексте слово «падут» может подразумевать смерть, но еврейский текст не выражает это прямо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: רֵד
  choice: спустись
  rationale: Естественно передаёт повелительную форму глагола ירד и направление движения с горы вниз.
- source_word: הָעֵד בָּעָם
  choice: предупреди народ
  rationale: В данной ситуации Hифиль глагола עוד означает настоятельно предостеречь народ от нарушения установленной границы.
- source_word: פֶּן
  choice: чтобы … не; иначе
  rationale: Отрицательная предупредительная конструкция по-русски естественно передаётся сочетанием «чтобы не», а следствие — словом «иначе».
- source_word: יֶהֶרְסוּ אֶל־יְהוָה
  choice: не прорвались к Яхве
  rationale: Сохраняет образ силового нарушения границы и движения к явленному присутствию Яхве.
- source_word: לִרְאוֹת
  choice: желая увидеть его
  rationale: Инфинитив выражает цель попытки прорыва. «Увидеть» сохраняет широту значения ראה; местоимение делает русскую фразу грамматически полной, не уточняя способ явления.
- source_word: וְנָפַל מִמֶּנּוּ רָב
  choice: иначе многие из них падут
  rationale: Сохраняет буквальный глагол «пасть» и не делает подразумеваемую смерть более явной, чем в еврейском тексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя, поэтому транслитерация сохраняет его отличие от титула.
- issue: Значение глагола נפל как последствия нарушения священной границы
  choice: падут
  alternative: погибнут
  rationale: Контекст допускает и, вероятно, подразумевает смерть, однако сам еврейский текст употребляет более широкий глагол «пасть»; перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён до естественной русской предупредительной конструкции; сохранены личное имя Яхве и смысловая неопределённость глагола «пасть».
