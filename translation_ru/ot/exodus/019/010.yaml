  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ אֶל הָ/עָ֔ם וְ/קִדַּשְׁתָּ֥/ם הַ/יּ֖וֹם וּ/מָחָ֑ר וְ/כִבְּס֖וּ שִׂמְלֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/010.yaml
  text: Then Yahweh said to Moses[a], “Go to the people and consecrate them today and tomorrow, and let them wash their garments.”
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Пойди к народу и освяти их[a] сегодня и завтра, пусть они выстирают свои одежды».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвяти их»; «сделай их святыми».'
    reason: 'Лексическая альтернатива: קדשׁ здесь может подчёркивать освящение, посвящение или ритуальную подготовку народа к встрече с Богом.'
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма продвигает повествование; «тогда» естественно выражает переход к следующему событию.
- source_word: לֵךְ אֶל־הָעָם
  choice: Пойди к народу
  rationale: Прямо и естественно передаёт повеление и обозначение общины Израиля как народа.
- source_word: וְקִדַּשְׁתָּם
  choice: и освяти их
  rationale: Глагол קדשׁ в породе пиэль здесь обозначает приведение народа в состояние святости и готовности к встрече с Богом; «освяти» сохраняет сакральный смысл и допускает ритуальную подготовку, не сводя её лишь к нравственному изменению.
- source_word: הַיּוֹם וּמָחָר
  choice: сегодня и завтра
  rationale: Естественно и точно обозначает двухдневный период подготовки.
- source_word: וְכִבְּסוּ שִׂמְלֹתָם
  choice: пусть они выстирают свои одежды
  rationale: Побудительная конструкция ясно передаёт требуемое действие народа; «одежды» соответствует широкому значению שִׂמְלָה и уместно в торжественном контексте.
theological_decisions:
- issue: Смысл ритуальной подготовки в קדשׁ
  choice: освяти их
  alternative: посвяти их; приготовь их как святых
  rationale: Контекст говорит о подготовке народа к явлению Бога у Синая. Выбранный вариант сохраняет идею святости и ритуального отделения, не утверждая, что речь идёт исключительно о внутреннем нравственном преобразовании.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис краток и сохраняет последовательность повелений исходного текста.
