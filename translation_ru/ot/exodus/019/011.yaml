  text: וְ/הָי֥וּ נְכֹנִ֖ים לַ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כִּ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י יֵרֵ֧ד יְהוָ֛ה לְ/עֵינֵ֥י כָל הָ/עָ֖ם עַל הַ֥ר סִינָֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/011.yaml
  text: and let them be ready for the third day[a], because on the third day Yahweh will come down in the sight of all the people on Mount Sinai.
translation:
  language: ru
  text: и пусть они будут готовы к третьему дню, потому что в третий день Яхве сойдёт на гору Синай на глазах у всего народа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ
  choice: и пусть они будут
  rationale: В контексте последовательных повелений форма выражает предписание; конструкция с «пусть» естественно передаёт это значение по-русски.
- source_word: נְכֹנִים
  choice: готовы
  rationale: Прилагательное обозначает состояние подготовленности к предстоящему явлению.
- source_word: לַיּוֹם הַשְּׁלִישִׁי
  choice: к третьему дню
  rationale: Предлог ל указывает на срок или момент, к которому народ должен быть готов; русский оборот сохраняет эту временную направленность.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание данного предписания.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: в третий день
  rationale: Обычное временное значение предлога ב; это естественная русская формулировка.
- source_word: יֵרֵד
  choice: сойдёт
  rationale: Глагол ירד означает движение вниз; «сойдёт» сохраняет образ нисхождения Бога и хорошо сочетается с направлением «на гору».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: לְעֵינֵי כָל הָעָם
  choice: на глазах у всего народа
  rationale: Естественный современный русский оборот, сохраняющий буквальный зрительный образ выражения «перед глазами всего народа».
- source_word: עַל הַר סִינָי
  choice: на гору Синай
  rationale: При глаголе движения עַל обозначает место, на которое нисходит Яхве; винительный падеж с «на» ясно передаёт направленность движения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте употреблено личное имя Бога; транслитерация сохраняет отличие имени от титула.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис близок к еврейскому, но не выглядит искусственным; выражение «на глазах у всего народа» передаёт наглядность оригинала.
