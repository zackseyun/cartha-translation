  source_fidelity: Основной смысл передан верно, включая добавочное усиление («тоже») и повтор имени Яхве. Однако «поразит их» заменяет образное יִפְרֹץ בָּהֶם («внезапно прорвётся/обрушится на них») результатом действия и тем самым ослабляет лексику исходника. Более близкая и естественная передача — «обрушится на них».
  naturalness: «Также и священники ... пусть освятят себя» — естественный современный литературный русский с уместным библейским оттенком. Формула «чтобы ... не обрушился» точнее выражает предостережение פֶּן, чем «иначе» при сохранении плавного синтаксиса.
  terminology: «Священники», «освятят себя» и «Яхве» соответствуют культовому контексту и принятой передаче тетраграмматона. «Освятят себя» сохраняет возвратно-подготовительный смысл hitpael без конфессионального истолкования.
