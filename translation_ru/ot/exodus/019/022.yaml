base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/022.yaml
  text: And even the priests who come near to Yahweh must consecrate themselves[b][a], lest Yahweh break out against them.
translation:
  language: ru
  text: Также и священники, приближающиеся к Яхве[a], пусть освятят себя, чтобы Яхве не обрушился на них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подходящие к Яхве»; «предстающие перед Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы Яхве не прорвался на них». Еврейский глагол передаёт образ внезапного, неудержимого проявления суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: И … тоже
  rationale: 'Передаёт присоединительное усиление: предупреждение распространяется также и на священников.'
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Обычное обозначение священников в культовом контексте; определённость естественно выражена контекстом.
- source_word: הַנִּגָּשִׁים אֶל יְהוָה
  choice: приближающиеся к Яхве
  rationale: Сохраняет значение причастия נגשׁ — приближение к Божьему присутствию для служения — без излишнего уточнения.
- source_word: יִתְקַדָּשׁוּ
  choice: должны освятить себя
  rationale: Возвратная форма передаёт требование подготовить и отделить себя как святых; формулировка естественна и сохраняет культовый смысл.
- source_word: פֶּן
  choice: иначе
  rationale: Естественно выражает предостережение и возможное негативное последствие.
- source_word: יִפְרֹץ בָּהֶם
  choice: поразит их
  rationale: В контексте передаёт внезапное губительное выступление Бога против нарушителей; образ прорыва дополнительно отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя, прямо употреблённое в еврейском тексте, и сохраняет его повтор в конце стиха.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст дважды употребляет тетраграмматон; транслитерация сохраняет личное заветное имя без подмены титулом.
- issue: Характер предупреждения יִפְרֹץ בָּהֶם יְהוָה
  choice: Яхве внезапно выступит против них и поразит их
  alternative: Яхве прорвётся к ним / обрушится на них
  rationale: Контекст границ Синая указывает на опасный Божий суд, однако текст не уточняет конкретный способ наказания; сноска сохраняет яркую метафору внезапного прорыва.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис остаётся ясным для широкого читателя; культовые понятия переданы без конфессиональных уточнений.
