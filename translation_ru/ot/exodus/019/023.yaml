base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/023.yaml
  text: And Moses said to Yahweh[a], “The people cannot go up to Mount Sinai, because you yourself warned us, saying[b], ‘Set bounds around the mountain and consecrate it.’”
translation:
  language: ru
  text: 'Моисей сказал Яхве: «Народ не может подняться на гору Синай, ведь ты сам предупредил нас[a], сказав: „Установи границу вокруг горы и освяти её[b]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «строго повелел нам» или «засвидетельствовал нам». Еврейский глагол может обозначать официальное предостережение или свидетельство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Установи границу для горы и освяти её».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул «Господь».
- source_word: לֹא יוּכַל
  choice: не сможет
  rationale: Форма глагола выражает неспособность народа подняться при уже установленном ограничении; будущее время естественно в русской прямой речи.
- source_word: לַעֲלֹת אֶל הַר סִינָי
  choice: подняться на гору Синай
  rationale: Сохраняется значение движения вверх; оборот звучит естественно в современном русском языке.
- source_word: אַתָּה
  choice: Ты Сам
  rationale: Отдельное местоимение в еврейском тексте эмфатично и подчёркивает, что предупреждение исходило от самого Яхве.
- source_word: הַעֵדֹתָה בָּנוּ
  choice: строго предостерёг нас
  rationale: Порода hифиль глагола עוד здесь обозначает настойчивое или официальное предупреждение. «Строго предостерёг» передаёт и предупреждение, и его торжественную силу.
- source_word: הַגְבֵּל אֶת הָהָר
  choice: проведи границу вокруг горы
  rationale: Повелительная форма означает установить предел, который нельзя пересекать. Добавление «вокруг» естественно выражает пространственный смысл в данном контексте.
- source_word: וְקִדַּשְׁתּוֹ
  choice: и освяти её
  rationale: Глагол קדשׁ в породе пиэль означает отделить как святое или посвятить; «освяти» сохраняет сакральный смысл и соответствует возвышенному регистру.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не подменяет имя титулом.
- issue: Смысл освящения горы
  choice: освяти её
  alternative: отдели её как святую; посвяти её
  rationale: Перевод сохраняет культово-сакральное значение глагола, не уточняя сверх текста, каким именно обрядом или действием гора должна быть освящена.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Прямая речь оформлена естественно; эмфаза אַתָּה сохранена как «Ты Сам». Термины «предостерёг» и «освяти» передают официальную и сакральную окраску оригинала без конфессиональных добавлений.
