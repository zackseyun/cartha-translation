  source_fidelity: 'В целом смысл передан верно: Моисей ссылается на предшествующее повеление Яхве ограничить гору и освятить её. Однако «не сможет» сдвигает актуальную невозможность, выраженную в контексте, в будущее; «не может» точнее. Наречие «строго» не выражено прямо в данном стихе, хотя формальный, настоятельный характер предупреждения можно передать без этого добавления.'
