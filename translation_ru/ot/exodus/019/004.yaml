base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/004.yaml
  text: You yourselves have seen what I did to Egypt[c][b][a], and how I carried you on eagles’ wings and brought you to myself.
translation:
  language: ru
  text: Вы сами видели, что Я сделал с Египтом, и как понёс вас на орлиных крыльях[a][b] и привёл вас к Себе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на крыльях орлов». Это еврейское выражение — яркий образ могущественного и оберегающего избавления.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово, переведённое как «орлиных», может обозначать и других крупных хищных птиц.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ко Мне».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַתֶּם
  choice: вы сами
  rationale: Самостоятельное местоимение усиливает обращение; «вы сами» естественно передаёт это смысловое ударение по-русски.
- source_word: רְאִיתֶם
  choice: видели
  rationale: Совершённое действие относится к недавнему опыту Израиля, сохраняющему значение в настоящем; русское прошедшее время естественно выражает это без дополнительного уточнения.
- source_word: אֲשֶׁר עָשִׂיתִי לְמִצְרָיִם
  choice: что Я сделал с Египтом
  rationale: Предлог לְ здесь обозначает объект, затронутый Божьими действиями. «С Египтом» ясно передаёт этот смысл, сохраняя название страны как собирательное обозначение.
- source_word: וָאֶשָּׂא אֶתְכֶם
  choice: понёс вас
  rationale: נשא означает «нести»; «понёс вас» сохраняет образ мощного и заботливого избавления и звучит естественно в контексте движения из Египта.
- source_word: עַל כַּנְפֵי נְשָׁרִים
  choice: на орлиных крыльях
  rationale: Это яркий образ стремительного и оберегающего избавления. «Орлиные» — традиционное и наиболее вероятное контекстуальное соответствие, хотя название птицы допускает более широкое понимание.
- source_word: וָאָבִא אֶתְכֶם אֵלָי
  choice: и привёл вас к Себе
  rationale: Буквально אֵלָי означает «ко Мне». Возвратное «к Себе» грамматически естественно в русской прямой речи Бога и сохраняет личностно-реляционный акцент.
theological_decisions:
- issue: Личностная направленность избавления Богом
  choice: привёл вас к Себе
  alternative: привёл вас ко Мне
  rationale: Исход представлен не только как освобождение от Египта, но и как приведение народа к Богу. «К Себе» сохраняет этот акцент, не добавляя содержания к еврейскому אֵלָי.
translation_notes:
  register: Современный литературный русский язык с торжественным, но общепонятным звучанием. Заглавные буквы в местоимениях, относящихся к Богу, поддерживают принятый русский библейский регистр. Синтаксис сохраняет прямое обращение и последовательность еврейского текста.
