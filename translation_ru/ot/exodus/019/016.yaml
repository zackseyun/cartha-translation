base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/016.yaml
  text: And it happened on the third day[a], when morning came, that there were thunders and lightnings, and a heavy cloud on the mountain, and the sound of a trumpet, very loud[c][b]; and all the people who were in the camp trembled.
translation:
  language: ru
  text: На третий день, когда наступило утро, раздались раскаты грома[a], засверкали молнии, над горой было густое облако, и раздался чрезвычайно громкий звук шофара[b][c]; весь народ, находившийся в стане, задрожал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «звуки» или «голоса». Еврейское слово может иметь все эти значения, но рядом с молниями здесь, вероятнее всего, имеются в виду раскаты грома.'
    reason: lexical_alternative
  - marker: b
    text: Шофар — духовой инструмент из рога животного, часто бараньего.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «очень сильный»; здесь это выражение характеризует силу, то есть громкость, звука.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי בִּהְיֹת הַבֹּקֶר
  choice: На третий день, с наступлением утра
  rationale: Два употребления היה выполняют повествовательную и временную функции. Естественная русская конструкция передаёт наступление события без архаичного «и было».
- source_word: קֹלֹת
  choice: раскаты грома
  rationale: У קוֹל широкий диапазон значений — «голос, звук»; рядом с молниями множественное число естественнее всего обозначает раскаты грома. Семантическая неоднозначность отмечена в сноске.
- source_word: וּבְרָקִים
  choice: засверкали молнии
  rationale: Глагольная русская формулировка естественно передаёт появление названных явлений и сохраняет множественное число.
- source_word: עָנָן כָּבֵד עַל הָהָר
  choice: густое облако покрыло гору
  rationale: В сочетании с облаком כָּבֵד указывает на плотность или тяжесть; «густое облако» звучит естественно. עַל допускает пространственное значение «на, над»; «покрыло гору» ясно передаёт сцену, не уточняя лишнего.
- source_word: קֹל שֹׁפָר
  choice: звук шофара
  rationale: Сохранено конкретное название рогового сигнального инструмента, уже освоенное современным русским библейским употреблением; пояснение дано в сноске.
- source_word: חָזָק מְאֹד
  choice: чрезвычайно громкий
  rationale: Буквально «очень сильный»; применительно к звуку естественный русский эквивалент описывает его большую громкость. Буквальное значение отмечено в сноске.
- source_word: וַיֶּחֱרַד כָּל הָעָם אֲשֶׁר בַּמַּחֲנֶה
  choice: и весь народ в стане задрожал
  rationale: חרד передаёт дрожь от страха или потрясения, не сводя её только к внутренней эмоции. Краткое «народ в стане» естественно передаёт еврейское относительное выражение.
theological_decisions:
- issue: Образы богоявления на Синае
  choice: Передать явления как непосредственно воспринимаемые гром, молнии, облако и звук шофара, не добавляя их богословского истолкования.
  alternative: Перевести קֹלֹת как «голоса», предполагая сверхъестественные или небесные голоса.
  rationale: В сочетании с молниями контекст поддерживает значение «гром», однако более широкий смысл слова сохранён в сноске, чтобы не скрывать подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным повествовательным ритмом. «Стан» сохранён как понятное библейское обозначение лагеря; «шофар» обеспечивает точность и сопровождается кратким пояснением.
