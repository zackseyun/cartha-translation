lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־הָעָם
  choice: Он сказал народу
  rationale: Форма wayyiqtol продолжает повествование и вводит речь Моисея. Русское «Он сказал» естественно передаёт последовательность событий; местоимение сохраняет обозначенного контекстом говорящего, не добавляя имени в сам текст.
- source_word: הֱיוּ נְכֹנִים
  choice: Будьте готовы
  rationale: Сочетание императива היה с נְכֹנִים выражает требование быть готовыми, то есть подготовиться к предстоящему явлению Бога.
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: к третьему дню
  rationale: В непосредственном контексте стихов 11 и 16 речь идёт о готовности к третьему дню. При этом необычная форма буквально связана с «тремя днями», поэтому возможная временная неоднозначность отмечена в сноске.
- source_word: אַל תִּגְּשׁוּ
  choice: не приближайтесь
  rationale: נגשׁ означает приближаться или подходить, а אַל придаёт глаголу значение запрета. Выбранная формулировка сохраняет образность и эвфемизм оригинала.
- source_word: אֶל־אִשָּׁה
  choice: к женщине
  rationale: Буквально выражение означает «к женщине». В данном контексте это эвфемистическое указание воздерживаться от половых отношений; буквальная форма сохранена в тексте, а смысл пояснён в сноске.
theological_decisions:
- issue: Следует ли прямо назвать половые отношения в основном тексте
  choice: 'Сохранить эвфемизм: «не приближайтесь к женщине»'
  alternative: «не вступайте в половые отношения с женщинами» или «не прикасайтесь к своим жёнам»
  rationale: Еврейский текст употребляет обычный эвфемизм и не называет действие прямо. Его сохранение не сужает «женщину» до «жены» и не делает выражение более явным, чем оригинал; контекстуальный смысл дан в сноске.
- issue: Как передать временную фразу לִשְׁלֹשֶׁת יָמִים
  choice: «к третьему дню» с указанием варианта в сноске
  alternative: «в течение трёх дней» или «на три дня»
  rationale: Упоминание третьего дня в ближайшем контексте поддерживает целевое значение подготовки к нему, но форма допускает связь с трёхдневным периодом. Сноска сохраняет эту языковую напряжённость, не перегружая основной текст.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным строем. Синтаксис остаётся ясным для обычного читателя; эвфемизм оригинала сохранён и разъяснён сноской.
