  text: וְ/עַתָּ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמְעוּ֙ בְּ/קֹלִ֔/י וּ/שְׁמַרְתֶּ֖ם אֶת בְּרִיתִ֑/י וִ/הְיִ֨יתֶם לִ֤/י סְגֻלָּה֙ מִ/כָּל הָ֣/עַמִּ֔ים כִּי לִ֖/י כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/005.yaml
  text: And now[a], if you will indeed listen to my voice and keep my covenant, then you will be my treasured possession out of all the peoples[c][b], for all the earth is mine.
translation:
  language: ru
  text: И теперь, если вы действительно будете слушаться Моего голоса и хранить Мой завет, то будете Моим драгоценным достоянием из числа всех народов[a], потому что вся земля принадлежит Мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди всех народов». Буквально: «из всех народов»; выражение указывает на выделение из их числа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет как соединительное ו, так и временное עַתָּה, связывая условие с предшествующим контекстом.
- source_word: שָׁמוֹעַ תִּשְׁמְעוּ בְּקֹלִי
  choice: действительно будете слушаться Моего голоса
  rationale: Конструкция с абсолютным инфинитивом усиливает значение глагола. «Слушаться голоса» естественно передаёт одновременно образ слышания и заложенное в идиоме послушание.
- source_word: וּשְׁמַרְתֶּם אֶת בְּרִיתִי
  choice: и хранить Мой завет
  rationale: «Хранить» передаёт верность и соблюдение обязательств завета, не сводя действие лишь к формальному исполнению.
- source_word: וִהְיִיתֶם לִי סְגֻלָּה
  choice: то будете Моим драгоценным достоянием
  rationale: «То» естественно обозначает следствие условия; «драгоценное достояние» передаёт и особую ценность, и принадлежность, выраженные סְגֻלָּה.
- source_word: מִכָּל הָעַמִּים
  choice: среди всех народов
  rationale: В данном контексте מן указывает на избрание из числа народов. «Среди» естественно по-русски выражает особое положение Израиля, не подразумевая, будто прочие народы не принадлежат Богу.
- source_word: כִּי לִי כָּל הָאָרֶץ
  choice: потому что вся земля принадлежит Мне
  rationale: כִּי вводит основание предыдущего утверждения, а לִי выражает принадлежность. Универсальное «вся земля» соответствует упоминанию всех народов.
theological_decisions:
- issue: Передача שׁמע в контексте завета как слышания или послушания
  choice: слушаться Моего голоса
  alternative: слушать Мой голос
  rationale: Еврейская идиома включает действенное, послушное слушание. Русское «слушаться» ясно передаёт эту сторону значения, а дополнение «голоса» сохраняет конкретный образ исходного текста.
- issue: Особый статус Израиля как סְגֻלָּה и универсальная принадлежность земли Богу
  choice: Моим драгоценным достоянием среди всех народов
  alternative: Моим особым достоянием из всех народов
  rationale: Формулировка сохраняет избрание Израиля и одновременно не превращает его в утверждение об отсутствии Божьей власти над другими народами; следующая часть стиха прямо подтверждает универсальную принадлежность всей земли Богу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции; синтаксис остаётся ясным для обычного читателя.
