  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁלִישִׁ֔י לְ/צֵ֥את בְּנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֣רֶץ מִצְרָ֑יִם בַּ/יּ֣וֹם הַ/זֶּ֔ה בָּ֖אוּ מִדְבַּ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/001.yaml
  text: In the third month after the sons of Israel had gone out from the land of Egypt[b][a], on this very day they came to the wilderness of Sinai.
translation:
  language: ru
  text: В третий месяц после выхода сынов Израиля[a] из земли Египта, в этот самый день[b], они пришли в Синайскую пустыню.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян», «потомков Израиля». Буквально: «сынов Израиля» — так назван весь народ.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в этот день». Оборот может подчёркивать точный день прибытия: «именно в этот день».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: в третий месяц
  rationale: חֹדֶשׁ в хронологических формулах обычно означает «месяц»; выбран естественный и точный русский эквивалент.
- source_word: לְצֵאת
  choice: после выхода
  rationale: Инфинитивная конструкция с לְ задаёт временную точку отсчёта. «После выхода» естественно передаёт отношение к третьему месяцу, не превращая оборот в отдельное действие.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранено прозрачное соответствие буквальному национально-заветному обозначению «сыновья Израиля»; форма «сыны» уместна в достойном библейском регистре, а более общеупотребительный этноним дан в сноске.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египта
  rationale: Существительное אֶרֶץ явно присутствует в источнике; сочетание «земля Египта» сохраняет полноту выражения и звучит естественно по-русски.
- source_word: בַּיּוֹם הַזֶּה
  choice: в этот самый день
  rationale: Указательное местоимение «этот» передано прямо, а «самый» отражает возможную эмфазу оборота, не уточняя, о каком календарном числе идёт речь.
- source_word: בָּאוּ
  choice: они пришли
  rationale: Прямое соответствие обычному значению בוא «приходить»; вариант «прибыли» был бы несколько более интерпретирующим.
- source_word: מִדְבַּר סִינָי
  choice: Синайскую пустыню
  rationale: מִדְבָּר обозначает пустынную, незаселённую местность. Устоявшееся русское географическое сочетание «Синайская пустыня» естественно передаёт конструкцию принадлежности.
theological_decisions:
- issue: Передача обозначения народа בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; потомки Израиля
  rationale: Фраза является традиционным обозначением всего народа, хотя грамматически имеет форму мужского множественного числа. Основной текст сохраняет образ и форму источника, а сноска поясняет собирательное национальное значение, не исключающее женщин и детей.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. Синтаксис следует временной структуре еврейского текста, но остаётся понятным; архаизм «сыны» ограничен устойчивым обозначением народа и разъяснён в сноске.
