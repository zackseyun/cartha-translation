base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/024.yaml
  text: And Yahweh said to him[a], “Go down, and come up—you and Aaron with you. But the priests and the people must not break through to come up to Yahweh, lest he break out against them.”
translation:
  language: ru
  text: 'И сказал ему Яхве: «Спустись, а затем поднимись — ты и Аарон с тобой. Но священники и народ пусть не пытаются прорваться, чтобы взойти к Яхве, иначе Он обрушится на них[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также передачи: «иначе Он прорвётся против них» или «прорвётся среди них». В еврейском тексте вторжение людей и суд Яхве описаны родственными образами прорыва.'
    reason: Сохраняет заметную в оригинале игру образов и отмечает возможные оттенки выражения בלי излишнего утверждения о буквальности вариантов.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона общепринятой русской транслитерацией сохраняет личное имя Бога, не заменяя его титулом.
- source_word: לֶךְ רֵד
  choice: Спустись
  rationale: Сочетание двух повелительных форм идиоматически выражает приказ пойти вниз; по-русски естественно передаётся одним глаголом.
- source_word: וְעָלִיתָ
  choice: а затем поднимись
  rationale: Форма перфекта в последовательности повелений имеет предписывающее значение; «затем» ясно передаёт порядок действий.
- source_word: אַתָּה וְאַהֲרֹן עִמָּךְ
  choice: ты и Аарон с тобой
  rationale: Сохранены как подчёркнутое местоимение «ты», так и указание на сопровождение Аарона.
- source_word: הַכֹּהֲנִים וְהָעָם
  choice: священники и народ
  rationale: Прямая и естественная передача двух названных групп.
- source_word: אַל יֶהֶרְסוּ לַעֲלֹת
  choice: пусть не прорываются наверх
  rationale: Глагол הרס здесь обозначает насильственное преодоление установленной границы, а инфинитив сохраняет образ восхождения на гору.
- source_word: פֶּן יִפְרָץ בָּם
  choice: иначе Он обрушится на них
  rationale: Выражение передаёт внезапное действие Божьего суда. «Обрушится на них» естественно звучит по-русски, а связь образов прорыва пояснена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» сохраняет личное имя в тексте и не подменяет его титулом, не утверждая при этом абсолютной достоверности реконструированной древней вокализации.
- issue: Субъект глагола יִפְרָץ
  choice: Он, то есть Яхве
  alternative: безличная передача Божьего наказания
  rationale: Грамматический контекст естественно относит действие к Яхве; местоимение с прописной буквы ясно указывает на Него, не добавляя нового действующего лица.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Повеления переданы прямо; конкретный образ нарушения границы сохранён без архаизмов.
