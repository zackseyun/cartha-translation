  to: 'Тогда Яхве сказал Моисею: «Ещё одно бедствие[a] Я наведу на фараона и на Египет. После этого он отпустит вас отсюда. Когда он отпустит вас, то непременно окончательно прогонит вас отсюда[b]».'
