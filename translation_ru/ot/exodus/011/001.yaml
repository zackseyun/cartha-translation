base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/001.yaml
  text: Then Yahweh said to Moses[a], “One more plague I will bring upon Pharaoh and upon Egypt. After that he will send you away from here. When he sends you away[b], he will surely drive you out completely from here.”
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Ещё одно бедствие[a] Я наведу на фараона и на Египет. После этого он отпустит вас отсюда. Когда он отпустит вас, то непременно окончательно прогонит вас отсюда[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово можно также перевести как «поражение», «удар» или «бедствие».
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте выражение «непременно прогонит» усилено повтором однокоренных форм; буквально: «изгоняя, изгонит». Слово «окончательно» передаёт полноту изгнания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; «Яхве» — устоявшаяся русская транслитерация.
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная повествовательная форма продвигает рассказ; «тогда» естественно выражает эту связь по-русски.
- source_word: עוֹד נֶגַע אֶחָד
  choice: Ещё одно бедствие
  rationale: עוֹד имеет добавочное значение «ещё одно», а נֶגַע обозначает поражение или тяжёлое бедствие; контекст позволяет понимать его как очередную египетскую казнь, не сужая основной перевод до традиционного термина.
- source_word: אָבִיא עַל
  choice: Я наведу на
  rationale: Каузативная форма בוא с עַל означает, что бедствие будет приведено или навлечено на фараона и Египет; «наведу на» естественно передаёт этот смысл.
- source_word: יְשַׁלַּח אֶתְכֶם מִזֶּה
  choice: он отпустит вас отсюда
  rationale: В данном контексте שׁלח означает позволить уйти, отпустить; это отличается от более сильного גּרש в заключительной части стиха.
- source_word: כְּשַׁלְּחוֹ
  choice: Когда он будет отпускать вас
  rationale: Префикс כְּ здесь имеет временной смысл. Несовершенный вид по-русски сохраняет оттенок самого действия отпускания, за которым следует усиленное указание на изгнание.
- source_word: כָּלָה גָּרֵשׁ יְגָרֵשׁ
  choice: то непременно прогонит вас отсюда всех до одного
  rationale: Инфинитив абсолютный с личной формой глагола усиливает утверждение, а כָּלָה указывает на полноту изгнания. Русская формулировка передаёт как решительность, так и всеохватность действия.
- source_word: מִזֶּה
  choice: отсюда
  rationale: Естественно передаёт указание на место, то есть на Египет, где находятся участники повествования.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя, поэтому оно сохраняется в транслитерации. Титул «Господь» скрывает различие между именем и титулом, а форма «Иегова» отражает более позднее смешение согласных тетраграмматона с подставными гласными.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Различие между более нейтральным «отпустит» и сильным «прогонит» сохранено; полнота изгнания выражена естественным оборотом «всех до одного».
