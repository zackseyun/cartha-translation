base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/010.yaml
  text: And Moses and Aaron did all these signs before Pharaoh[a], and Yahweh hardened Pharaoh’s heart[c][b], and he did not let the sons of Israel go out from his land.
translation:
  language: ru
  text: Моисей и Аарон совершили все эти знамения[a] перед фараоном. И Яхве сделал сердце фараона непреклонным[b], и тот не отпустил сынов Израиля[c] из своей земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все эти чудеса». Еврейское слово может обозначать чудесные знаки или дивные дела.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «укрепил сердце фараона» или «сделал сердце фараона твёрдым»; также возможно: «ожесточил сердце фараона».'
    reason: lexical_alternative
  - marker: c
    text: 'То есть израильтян, народ Израиля. Буквально: «сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Моисей и Аарон
  rationale: Устоявшиеся русские формы личных имён.
- source_word: עָשׂוּ אֶת כָּל הַמֹּפְתִים הָאֵלֶּה
  choice: совершили все эти знамения
  rationale: Глагол עשה широк по значению, а «совершили» естественно сочетается со «знамениями». מופת обозначает чудесное действие, служащее знамением или свидетельством.
- source_word: לִפְנֵי פַרְעֹה
  choice: перед фараоном
  rationale: Прямой и естественный перевод пространственно-реляционного выражения.
- source_word: וַיְחַזֵּק ... אֶת לֵב פַּרְעֹה
  choice: Но ... сделал сердце фараона непреклонным
  rationale: חזק в каузативной форме буквально передаёт придание силы или твёрдости; в данном контексте речь об утверждении фараона в сопротивлении. «Непреклонным» сохраняет образ твёрдости и естественно звучит по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом.
- source_word: שִׁלַּח
  choice: не отпустил
  rationale: В повествовании об исходе это естественный русский эквивалент со значением разрешить народу уйти.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет буквальный образ древнееврейского выражения, которое здесь обозначает народ Израиля в целом.
- source_word: מֵאַרְצוֹ
  choice: из своей земли
  rationale: Возвратное местоимение ясно соотносит землю с фараоном и позволяет избежать двусмысленного русского «его».
theological_decisions:
- issue: Действие Яхве над сердцем фараона
  choice: Яхве сделал сердце фараона непреклонным
  alternative: Яхве укрепил сердце фараона / сделал сердце фараона твёрдым / ожесточил сердце фараона
  rationale: Перевод сохраняет прямое приписывание действия Яхве и не снимает напряжения между Божьим действием и ответственностью фараона. При этом «сделал непреклонным» ближе к образу корня חזק, чем традиционное «ожесточил».
- issue: Значение בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян / детей Израиля
  rationale: Буквальная форма сохранена в основном тексте, а корпоративное значение выражения пояснено в сноске.
- issue: Связь предложений союзом ו
  choice: Но
  alternative: И
  rationale: Хотя ו обычно передаётся союзом «и», здесь русский противительный союз естественно выражает контраст между совершёнными знамениями и отказом фараона, не меняя фактической последовательности повествования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис разделён на два предложения для ясности. Личное имя «Яхве» сохранено. Формулировка «и тот» однозначно указывает на фараона; «из своей земли» устраняет местоименную двусмысленность.
