base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/009.yaml
  text: And Yahweh said to Moses[a], “Pharaoh will not listen to you[c][b], so that my wonders may be multiplied in the land of Egypt.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею[c]: «Фараон не станет вас слушать[a], чтобы умножились Мои чудеса[b] в земле Египта».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не послушает вас», «не внемлет вам».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Мои знамения». Еврейское слово может обозначать чудеса, знамения или предзнаменования.'
    reason: lexical_alternative
  - marker: c
    text: 'Некоторые переводы: «Яхве прежде сказал Моисею», связывая эти слова с предшествующим повествованием; сама еврейская глагольная форма обычно передаёт простое повествовательное прошедшее.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Стандартная повествовательная форма прошедшего времени; плюсквамперфект контекстуально возможен, но самой еврейской формой не требуется.
- source_word: לֹא יִשְׁמַע אֲלֵיכֶם
  choice: не послушает вас
  rationale: שׁמע с אֶל означает «слушать, внимать»; «не послушает» естественно передаёт отказ внимать, не усиливая значение до прямого «не подчинится». Местоимение во множественном числе сохранено.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое, при возможном оттенке результата, отношение между отказом фараона и умножением чудес.
- source_word: רְבוֹת
  choice: умножились
  rationale: Инфинитив רבה выражает увеличение числа последующих знамений; русская возвратная форма естественно передаёт этот смысл.
- source_word: מוֹפְתַי
  choice: Мои чудеса
  rationale: מוֹפֵת может означать чудо, знамение или предзнаменование; в повествовании о египетских казнях «чудеса» передаёт необычайный, вызывающий изумление характер деяний.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в земле Египетской
  rationale: Сохраняет явное אֶרֶץ и звучит естественно в dignified русском библейском повествовании.
theological_decisions:
- issue: Божественная цель в связи с отказом фараона
  choice: «чтобы умножились Мои чудеса»
  alternative: «так что умножатся Мои чудеса»
  rationale: לְמַעַן прежде всего выражает цель. Перевод сохраняет напряжение между отказом фараона и целью Бога, не добавляя объяснения о природе ожесточения.
- issue: Временная соотнесённость речи Яхве с контекстом
  choice: «И сказал Яхве»
  alternative: «Яхве прежде сказал»
  rationale: Wayyiqtol обычно передаёт последовательное повествовательное прошедшее. Контекст допускает ретроспективное понимание, однако форма сама по себе его не маркирует.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис прост и понятен; личное имя «Яхве» и множественное «вас» сохранены по еврейскому тексту. Все маркеры сносок присутствуют в основном тексте.
