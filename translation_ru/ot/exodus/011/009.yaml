  source_fidelity: 'Основной смысл передан верно: יְהוָה передано личным именем «Яхве»; множественное «вас» сохраняет адресацию Моисею и Аарону; לְמַעַן передано целевым союзом «чтобы»; «умножились Мои чудеса» точно передаёт увеличение числа מוֹפְתַי. Однако «не послушает вас» в современном русском преимущественно может означать «не подчинится вам», тогда как שׁמע с אֶל здесь означает «не станет слушать / не внемлет». Также следует отразить в сноске засвидетельствованную в английском аудите контекстуальную возможность плюсквамперфекта, не выдавая её за значение самой еврейской формы.'
