  terminology: «Яхве», «Моисей», «фараон» и «чудеса» употреблены последовательно и приемлемо. «Чудеса» хорошо соответствует מוֹפְתַי в данном контексте; сноска «знамения» обоснованно сохраняет альтернативу. Добавлена сноска о варианте «прежде сказал» как о контекстуальном переводческом решении, а не лексическом значении формы.
