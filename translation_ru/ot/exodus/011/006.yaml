lexical_decisions:
- source_word: וְהָיְתָה
  choice: И будет
  rationale: Форма совершенного вида с союзом в контексте пророческого возвещения имеет будущее значение; краткая русская формула сохраняет предсказательный характер.
- source_word: צְעָקָה
  choice: вопль
  rationale: Существительное обозначает громкий крик, вызванный бедствием. «Вопль» естественно передаёт и громкость, и страдание, не уточняя сверх сказанного причину или характер плача.
- source_word: גְדֹלָה
  choice: великий
  rationale: Прилагательное указывает на исключительную силу и масштаб вопля. «Великий» сохраняет выразительность еврейского сочетания, тогда как «громкий» сужает смысл до громкости.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: по всей земле Египетской
  rationale: Предлог с выражением всеохватности обозначает распространение по всей территории; традиционная, но понятная современному читателю формулировка звучит естественно и торжественно.
- source_word: אֲשֶׁר כָּמֹהוּ לֹא נִהְיָתָה
  choice: какого прежде не бывало
  rationale: Сравнительное придаточное соотносится с «воплем» и утверждает его беспримерность в прошлом; русская идиома близко передаёт конструкцию с глаголом «быть».
- source_word: וְכָמֹהוּ לֹא תֹסִף
  choice: и впредь не будет
  rationale: Конструкция с יסף под отрицанием означает, что подобное больше не повторится. «Впредь не будет» сохраняет абсолютное сравнение и лаконичный параллелизм.
