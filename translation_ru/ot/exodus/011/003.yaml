  text: וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת חֵ֥ן הָ/עָ֖ם בְּ/עֵינֵ֣י מִצְרָ֑יִם גַּ֣ם הָ/אִ֣ישׁ מֹשֶׁ֗ה גָּד֤וֹל מְאֹד֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/עֵינֵ֥י עַבְדֵֽי פַרְעֹ֖ה וּ/בְ/עֵינֵ֥י הָ/עָֽם־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/003.yaml
  text: And Yahweh gave the people favor in the sight of the Egyptians[a]. Moreover, the man Moses was very great in the land of Egypt[d][c][b], in the sight of Pharaoh’s servants and in the sight of the people.
translation:
  language: ru
  text: И Яхве даровал народу благоволение в глазах египтян[a]. Кроме того, сам Моисей[b] был весьма велик в земле Египта — в глазах слуг фараона[c] и в глазах народа[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в глазах египтян», то есть египтяне относились к народу благосклонно.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «человек Моисей»; эта необычная формулировка особо выделяет Моисея.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «служителей (чиновников) фараона»; еврейское слово буквально означает «слуг».'
    reason: lexical_alternative
  - marker: d
    text: Под «народом» здесь, вероятно, подразумевается население Египта в целом, в отличие от слуг фараона; однако еврейский текст этого прямо не уточняет.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул; форма «Яхве» общепринята в современной русской библеистике.
- source_word: וַיִּתֵּן ... חֵן
  choice: даровал ... благоволение
  rationale: Сохраняется образ еврейского выражения «дал благоволение»; глагол «даровал» делает сочетание естественным и достойным по-русски, не придавая слову חֵן специально богословского значения.
- source_word: הָעָם
  choice: народу
  rationale: Источник говорит просто «народ»; контекст указывает на израильтян, но добавлять это уточнение в основной текст не требуется.
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: в глазах египтян
  rationale: Буквальный образ еврейской идиомы понятен по-русски и означает благоприятное отношение египтян.
- source_word: גַּם
  choice: кроме того
  rationale: Передаёт присоединительное значение частицы и естественно вводит дополнительное сообщение о Моисее.
- source_word: הָאִישׁ מֹשֶׁה
  choice: сам Моисей
  rationale: Русское «сам Моисей» естественно передаёт выделение личности Моисея, тогда как буквальное «человек Моисей» звучит неидиоматично; буквальная форма отмечена в сноске.
- source_word: גָּדוֹל מְאֹד
  choice: весьма велик
  rationale: Сохраняет широту значения — величие, влияние и высокий статус — не сводя его только к известности или уважению.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в земле Египетской
  rationale: Сохраняет полную формулу оригинала и соответствует современному литературному библейскому регистру.
- source_word: בְּעֵינֵי עַבְדֵי פַרְעֹה
  choice: в глазах слуг фараона
  rationale: Передаёт עֲבָדִים буквально как «слуги», сохраняя возможность понимать их как придворных служителей или должностных лиц.
- source_word: וּבְעֵינֵי הָעָם
  choice: и в глазах народа
  rationale: Сохранено неопределённое «народ» без внесения отсутствующих в тексте уточнений «египетский» или «простой».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» передаёт личное имя в исходном тексте и не заменяет его титулом; вариант не вносит дополнительного конфессионального толкования.
- issue: Характер величия Моисея
  choice: весьма велик
  alternative: весьма влиятелен; пользовался большим уважением
  rationale: Более широкая формулировка сохраняет смысловую напряжённость גָּדוֹל и не решает без основания, идёт ли речь прежде всего о положении, влиянии или почёте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; повтор «в глазах» сохранён как значимый параллелизм оригинала.
