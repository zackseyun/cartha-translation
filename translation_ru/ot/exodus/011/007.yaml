  yaml_path: translation/ot/exodus/011/007.yaml
  text: But against any of the sons of Israel[a], not a dog will sharpen its tongue, from man to beast, so that you may know that Yahweh makes a distinction between Egypt and Israel.
translation:
  language: ru
  text: Но против сынов Израиля — ни против человека, ни против скота — не залает ни одна собака[a], чтобы вы знали, что Яхве проводит различие между Египтом и Израилем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ни одна собака не навострит своего языка»; то есть не залает и не проявит угрозы. Это образ полного мира и безопасности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל בְּנֵי יִשְׂרָאֵל
  choice: Но у сынов Израиля
  rationale: Союз передаёт противопоставление участи Египта, а предложная конструкция обозначает сферу, в которой не произойдёт никакого враждебного действия. Выражение «сыны Израиля» сохраняет форму исходного текста и остаётся понятным по-русски.
- source_word: לֹא יֶחֱרַץ כֶּלֶב לְשֹׁנוֹ
  choice: не залает ни одна собака[a]
  rationale: Еврейское образное выражение буквально говорит, что собака не «заострит язык»; по смыслу речь о том, что она не подаст даже угрожающего голоса. В основном тексте выбран ясный русский эквивалент, а буквальный образ сохранён в сноске.
- source_word: לְמֵאִישׁ וְעַד בְּהֵמָה
  choice: ни на человека, ни на скот
  rationale: Передаёт полный охват людей и домашних животных и естественно сочетается по-русски с глаголом «залает».
- source_word: לְמַעַן תֵּדְעוּן
  choice: чтобы вы знали
  rationale: Естественная передача целевой конструкции и формы второго лица множественного числа.
- source_word: יַפְלֶה
  choice: проводит различие
  rationale: В данном контексте каузативная форма указывает на отделение одной стороны от другой, а не прежде всего на совершение чуда. Настоящее время сохраняет обобщённую силу еврейского имперфекта в объяснении цели знамения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, не заменяя его титулом.
- source_word: בֵּין מִצְרַיִם וּבֵין יִשְׂרָאֵל
  choice: между Египтом и Израилем
  rationale: Сохраняет национальные наименования и прямое противопоставление исходного текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер различия между Египтом и Израилем
  choice: проводит различие
  alternative: отделит; дивно поступит
  rationale: Контекст указывает на различную участь Египта и Израиля. Формулировка не уточняет сверх текста ни основание, ни богословский механизм этого различия.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис перестроен ради естественности, но контраст, полный охват людей и скота и личное имя Яхве сохранены.
