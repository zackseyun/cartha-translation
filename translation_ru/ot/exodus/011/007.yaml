  naturalness: Исправленный порядок слов естественен для современного литературного русского и сохраняет сдержанно-библейский регистр. Тире удобно выделяет уточняющий оборот «ни против человека, ни против скота».
  terminology: «Сыны Израиля», «скот», «Яхве» и «проводит различие» приемлемы. Имя Яхве последовательно передаёт тетраграмматон; формулировка о различии не добавляет богословских объяснений.
