base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/008.yaml
  text: Then all these servants of yours will come down to me and bow down to me[a], saying, ‘Go out[b], you and all the people who are at your feet,’ and after that I will go out.” And he went out from Pharaoh in burning anger.
translation:
  language: ru
  text: 'Тогда все эти слуги твои придут ко мне, падут ниц передо мной и скажут: «Выйди — ты и весь народ, который следует за тобой[a]», — а после этого я выйду». И Моисей вышел от фараона, пылая гневом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «который у твоих ног» — то есть сопровождает тебя или следует за тобой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: придут
  rationale: Глагол буквально означает «сойдут, спустятся». В русском «придут ко мне» естественно передаёт движение к говорящему; вертикальный образ несущественен для понимания и в данном контексте по-русски звучал бы неясно.
- source_word: עֲבָדֶיךָ
  choice: слуги твои
  rationale: עבד может обозначать слугу, раба или царедворца. «Слуги» сохраняет широту еврейского слова и прямое обращение к фараону; в контексте имеются в виду его придворные.
- source_word: וְהִשְׁתַּחֲוּוּ לִי
  choice: падут передо мной
  rationale: Форма глагола שׁחה обозначает поклон или простирание ниц. Выражение передаёт физический жест почтения и не придаёт ему непредусмотренного значения религиозного поклонения.
- source_word: צֵא אַתָּה
  choice: Выйди — ты
  rationale: «Выйди» сохраняет обычное значение יצא и связь с темой исхода, а тире подчёркивает явно выраженное местоимение אַתָּה.
- source_word: וְכָל הָעָם אֲשֶׁר בְּרַגְלֶיךָ
  choice: и весь народ, который следует за тобой
  rationale: Буквально «который у твоих ног»; это идиоматическое обозначение людей, идущих вслед за человеком или сопровождающих его. Смысловой перевод понятен современному русскому читателю, а буквальный образ указан в сноске.
- source_word: וְאַחֲרֵי כֵן אֵצֵא
  choice: После этого я выйду
  rationale: Передана прямая временная последовательность и сохранено единообразие перевода глагола יצא.
- source_word: וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: И Моисей вышел от фараона
  rationale: В еврейском подлежащее подразумевается и определяется контекстом. Имя «Моисей» делает смену от прямой речи к повествованию ясной по-русски, не меняя референта.
- source_word: בָּחֳרִי אָף
  choice: пылая гневом
  rationale: Выражение буквально связано с жаром гнева. Русская формулировка естественно сохраняет метафору и интенсивность состояния.
