    issue: Неверно оформлена граница слов слуг и последующего заявления Моисея.
    rationale: 'В варианте «…скажут: „Выйди …“. После этого я выйду“» фраза «После этого я выйду» грамматически оказывается частью того, что скажут слуги. По еврейскому синтаксису они говорят только «Выйди, ты и весь народ, который у твоих ног», затем Моисей добавляет: «а после этого я выйду».'
  - severity: low
