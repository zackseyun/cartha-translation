  - severity: low
    issue: Сноска b неточна в формулировке и избыточна.
    rationale: В еврейском здесь не стоит отдельное буквальное слово «он»; субъект закодирован в глагольной форме и ясен из контекста. Поскольку имя Моисея может быть названо в русском основном тексте ради ясности, сноска не нужна.
