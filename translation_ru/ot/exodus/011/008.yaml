revisions:
- from: 'Тогда все эти слуги твои придут ко мне, падут передо мной и скажут: «Выйди — ты и весь народ, который следует за тобой[a]». После этого я выйду». И Моисей[b] вышел от фараона, пылая гневом.'
  to: 'Тогда все эти слуги твои придут ко мне, падут ниц передо мной и скажут: «Выйди — ты и весь народ, который следует за тобой[a]», — а после этого я выйду». И Моисей вышел от фараона, пылая гневом.'
  rationale: 'Исправлено разграничение вложенных слов слуг и слов Моисея: их требование закрывается после «следует за тобой», а «после этого я выйду» остаётся в речи Моисея. Уточнён перевод жеста почтения как «падут ниц». Удалена ненужная и неточно сформулированная сноска о подразумеваемом субъекте; значение текста не изменено.'
