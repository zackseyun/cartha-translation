source:
  edition: WLC
  text: וּ/מֵ֣ת כָּל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכ֤וֹר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שִּׁפְחָ֔ה אֲשֶׁ֖ר אַחַ֣ר הָ/רֵחָ֑יִם וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/005.yaml
  text: And every firstborn in the land of Egypt will die[a], from the firstborn of Pharaoh, who sits on his throne, to the firstborn of the servant woman who is behind the millstones, and every firstborn of the livestock.
translation:
  language: ru
  text: И умрёт каждый первенец в земле Египта — от первенца фараона, сидящего на своём престоле, до первенца рабыни[a], находящейся за жерновами, и каждый первенец скота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служанки». Еврейское слово обозначает женщину в подневольном, рабском положении; упоминание жерновов указывает на тяжёлый труд, обычно поручавшийся людям низкого статуса.'
    reason: Лексическая альтернатива и пояснение историко-социального образа.
lexical_decisions:
- source_word: וּמֵת
  choice: И умрёт
  rationale: Форма совершенного вида в пророческом возвещении выражает предстоящее событие как несомненное; русское будущее время естественно передаёт и будущность, и категоричность.
- source_word: כָּל בְּכוֹר
  choice: каждый первенец
  rationale: Сочетание с существительным в единственном числе имеет распределительное значение; «каждый первенец» точно и естественно передаёт его по-русски.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в Египетской земле
  rationale: Сохранён явно выраженный в еврейском тексте географический термин «земля», при этом формулировка остаётся понятной современному читателю.
- source_word: מִבְּכוֹר ... עַד בְּכוֹר
  choice: от первенца… до первенца
  rationale: Конструкция «от… до…» передаёт весь охват бедствия — от вершины общественной иерархии до её низов.
- source_word: פַּרְעֹה הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: фараона, сидящего на своём престоле
  rationale: Причастный оборот близко передаёт еврейскую конструкцию и в русском, как и в исходном тексте, допускает отнесение определения к фараону либо к его первенцу.
- source_word: הַשִּׁפְחָה
  choice: рабыни
  rationale: Слово обозначает женщину подневольного, рабского статуса; «рабыня» сохраняет резкий социальный контраст с фараоном и не смягчает исходный текст.
- source_word: אַחַר הָרֵחָיִם
  choice: которая за жерновами
  rationale: Сохранён конкретный образ женщины, занятой тяжёлым и низкостатусным трудом у жерновов.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: и каждый первенец скота
  rationale: בְּהֵמָה здесь обозначает домашних животных в целом; собирательное «скот» кратко и точно передаёт этот смысл.
theological_decisions:
- issue: Передача социального статуса שִׁפְחָה
  choice: рабыня
  alternative: служанка
  rationale: «Рабыня» непосредственно отражает подневольный статус женщины и сохраняет риторический диапазон от царского дома до самого низкого положения, не привнося конфессионального толкования.
- issue: К кому относится оборот «сидящий на своём престоле»
  choice: 'Сохранена синтаксическая неоднозначность: «фараона, сидящего на своём престоле»'
  alternative: Явно отнести оборот либо к фараону, либо к его первенцу
  rationale: Еврейская конструкция допускает спор о связи причастного оборота; русская формулировка не разрешает эту неоднозначность без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Сохранены повтор «каждый первенец», образ жерновов и социальный контраст; архаизмы и конфессионально окрашенные добавления не использованы.
