source:
  edition: WLC
  text: דַּבֶּר נָ֖א בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/יִשְׁאֲל֞וּ אִ֣ישׁ מֵ/אֵ֣ת רֵעֵ֗/הוּ וְ/אִשָּׁה֙ מֵ/אֵ֣ת רְעוּתָ֔/הּ כְּלֵי כֶ֖סֶף וּ/כְלֵ֥י זָהָֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/002.yaml
  text: Speak now in the hearing of the people[a], and let each man ask from his neighbor, and each woman from her neighbor, for articles of silver and articles of gold.
translation:
  language: ru
  text: '«Скажи теперь народу во всеуслышание: пусть каждый мужчина попросит[a] у своего соседа, а каждая женщина — у своей соседки серебряные и золотые вещи».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возьмёт взаймы». Еврейский глагол означает «просить» или «запрашивать» и сам по себе не указывает, что полученные вещи следовало вернуть.'
    reason: Лексическая альтернатива, существенная для толкования повествования.
lexical_decisions:
- source_word: דַּבֶּר נָא
  choice: Скажи теперь
  rationale: Императив דַּבֶּר передаёт прямое повеление говорить, а частица נָא здесь естественно выражает безотлагательность; «теперь» не придаёт Божьей речи неуместно просительного оттенка.
- source_word: בְּאָזְנֵי הָעָם
  choice: народу во всеуслышание
  rationale: Еврейская идиома буквально говорит об обращении «в уши народа», то есть так, чтобы весь народ услышал. Русское «во всеуслышание» сохраняет образ публично и слышимо произнесённых слов без буквализма.
- source_word: וְיִשְׁאֲלוּ
  choice: пусть … попросит
  rationale: Форма после повеления имеет побудительное значение. «Попросит» передаёт שאל как просьбу или запрос, не добавляя отсутствующей в самом глаголе обязанности вернуть полученное.
- source_word: אִישׁ
  choice: каждый мужчина
  rationale: Мужское единственное число употреблено распределительно и образует параллель с последующим «каждая женщина».
- source_word: מֵאֵת רֵעֵהוּ
  choice: у своего соседа
  rationale: רֵעַ может обозначать ближнего, товарища или соседа; в данном бытовом контексте «сосед» естественно и сохраняет широкое значение члена окружающего сообщества.
- source_word: וְאִשָּׁה מֵאֵת רְעוּתָהּ
  choice: а каждая женщина — у своей соседки
  rationale: Сохранены распределительность, женский род и параллелизм двух частей стиха; тире естественно восполняет опущенный в русском повтор глагола.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: серебряные и золотые вещи
  rationale: כְּלִי — широкое обозначение предмета, изделия, сосуда или принадлежности. «Вещи» не сужает значение до сосудов либо украшений и звучит естественно по-русски.
theological_decisions:
- issue: Значение שאל в рассказе о получении израильтянами ценностей у египтян
  choice: попросит
  alternative: возьмёт взаймы
  rationale: Глагол שאל сам по себе означает «просить, запрашивать» и не указывает, что полученное надлежало вернуть. Основной текст не вносит идею займа, однако традиционное толкование отмечено в сноске ввиду его влияния на понимание эпизода.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Формула «народу во всеуслышание» естественно передаёт еврейскую идиому; пара «каждый мужчина — каждая женщина» сохраняет распределительный и гендерный параллелизм оригинала.
