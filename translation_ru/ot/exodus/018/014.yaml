  text: וַ/יַּרְא֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵ֛ת כָּל אֲשֶׁר ה֥וּא עֹשֶׂ֖ה לָ/עָ֑ם וַ/יֹּ֗אמֶר מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ אֲשֶׁ֨ר אַתָּ֤ה עֹשֶׂה֙ לָ/עָ֔ם מַדּ֗וּעַ אַתָּ֤ה יוֹשֵׁב֙ לְ/בַדֶּ֔/ךָ וְ/כָל הָ/עָ֛ם נִצָּ֥ב עָלֶ֖י/ךָ מִן בֹּ֥קֶר עַד עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/014.yaml
  text: When Moses's father-in-law saw all that he was doing for the people[a], he said, “What is this thing that you are doing for the people? Why do you sit alone[b], while all the people stand before you from morning until evening?”
translation:
  language: ru
  text: 'Когда тесть Моисея увидел всё, что тот делал для народа, он сказал: «Что это ты делаешь для народа? Почему ты сидишь один, а весь народ стоит перед тобой с утра до вечера?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֹתֵן מֹשֶׁה
  choice: тесть Моисея
  rationale: חֹתֵן обозначает родственника по браку; в данном контексте это тесть Моисея, Иофор.
- source_word: וַיַּרְא
  choice: увидел
  rationale: Сохраняет прямое повествовательное значение глагола ראה без добавочного оттенка наблюдения или оценки.
- source_word: אֵת כָּל אֲשֶׁר הוּא עֹשֶׂה
  choice: всё, что тот делал
  rationale: Причастная форма описывает продолжавшуюся деятельность Моисея; местоимение «тот» естественно устраняет возможную неясность в русском предложении.
- source_word: לָעָם
  choice: для народа
  rationale: Предлог ל здесь указывает на деятельность в интересах народа; перевод «для» лучше всего передаёт эту функцию.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר אַתָּה עֹשֶׂה לָעָם
  choice: Что это ты делаешь для народа?
  rationale: Естественная русская вопросительная конструкция передаёт смысл буквального «что это за дело, которое ты делаешь», не утяжеляя речь.
- source_word: אַתָּה יוֹשֵׁב לְבַדֶּךָ
  choice: ты сидишь один
  rationale: Сохраняет как буквальное сидение Моисея, так и контекстуальный смысл единоличного исполнения судебной функции.
- source_word: וְכָל הָעָם נִצָּב עָלֶיךָ
  choice: а весь народ стоит перед тобой
  rationale: Хотя עָלֶיךָ буквально может передаваться как «над/около тебя», в данной сцене выражение обозначает стояние перед Моисеем в ожидании разбирательства.
- source_word: מִן בֹּקֶר עַד עָרֶב
  choice: с утра до вечера
  rationale: Современный и естественный русский эквивалент временного выражения, обозначающего весь день.
