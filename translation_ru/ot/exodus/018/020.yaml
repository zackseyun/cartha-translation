base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/020.yaml
  text: And you shall warn them about the statutes and the laws[b][a], and make known to them the way in which they must walk and the work that they must do.
translation:
  language: ru
  text: Предупреждай их о постановлениях и законах[a] и разъясняй им, каким путём им следует идти[b] и что им следует делать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставлениях». Еврейское «торот» может обозначать не только законы, но и наставления или учения; здесь юридический контекст поддерживает перевод «законах».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «путь, по которому они будут ходить». Слово «идти» сохраняет еврейскую метафору пути как образа поведения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזְהַרְתָּה
  choice: наставляй
  rationale: В породе хифиль глагол זהר может означать предостерегать, увещевать или наставлять с указанием на ответственность. В данном судебно-административном контексте «наставляй» естественно передаёт требовательное разъяснение установлений, не сужая значение до одного лишь предупреждения.
- source_word: הַחֻקִּים
  choice: постановления
  rationale: חֻקִּים обозначает установленные предписания или узаконенные нормы; «постановления» сохраняет юридический оттенок и понятно современному читателю.
- source_word: הַתּוֹרֹת
  choice: законы
  rationale: Хотя תּוֹרָה может шире означать наставление или учение, множественное число рядом с חֻקִּים и судебный контекст поддерживают юридическое значение. Возможная более широкая передача отмечена в сноске.
- source_word: וְהוֹדַעְתָּ
  choice: указывай
  rationale: Хифиль ידע буквально выражает причинение знания — «давать знать». В сочетании с «путём» русское «указывай им путь» естественно передаёт этот каузативный смысл.
- source_word: הַדֶּרֶךְ ... יֵלְכוּ בָהּ
  choice: путь, по которому они должны идти
  rationale: Сохранена древнееврейская метафора пути и хождения как образа поведения; «должны» передаёт предписывающую силу контекста.
- source_word: הַמַּעֲשֶׂה אֲשֶׁר יַעֲשׂוּן
  choice: дела, которые они должны совершать
  rationale: מַעֲשֶׂה обозначает совершаемое дело или действие. Русское множественное число звучит естественнее в обобщённом предписании и передаёт требуемые поступки, а «должны» выражает обязательность.
