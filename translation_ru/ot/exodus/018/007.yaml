  yaml_path: translation/ot/exodus/018/007.yaml
  text: Moses went out to meet his father-in-law[a], bowed down, and kissed him. Then each asked the other about his welfare, and they went into the tent.
translation:
  language: ru
  text: Моисей вышел навстречу своему тестю, поклонился ему и поцеловал его. Они спросили друг друга о благополучии[a] и вошли в шатёр.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «спросили друг друга о мире»; здесь «мир» означает благополучие, то есть всё ли у человека хорошо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרַאת
  choice: навстречу
  rationale: В сочетании с глаголом «вышел» выражает намеренное движение навстречу прибывшему человеку.
- source_word: חֹתְנוֹ
  choice: своему тестю
  rationale: В данном контексте речь идёт об Иофоре, отце жены Моисея; современное русское «тесть» точно передаёт родство.
- source_word: וַיִּשְׁתַּחוּ
  choice: поклонился ему
  rationale: Передаёт жест почтения, не придавая ему обязательного значения поклонения Богу.
- source_word: וַיִּשַּׁק לוֹ
  choice: поцеловал его
  rationale: Естественно передаёт принятый при встрече поцелуй.
- source_word: וַיִּשְׁאֲלוּ אִישׁ לְרֵעֵהוּ לְשָׁלוֹם
  choice: Они расспросили друг друга о благополучии
  rationale: Взаимность передана словами «друг друга», а идиома «спрашивать о мире» — естественным русским выражением о благополучии.
- source_word: הָאֹהֱלָה
  choice: вошли в шатёр
  rationale: Направительный суффикс обозначает движение внутрь; принадлежность шатра в еврейском тексте не указана.
theological_decisions:
- issue: Значение поклона Моисея перед Иофором
  choice: жест почтения
  alternative: акт религиозного поклонения
  rationale: Контекст встречи родственников и последующий поцелуй указывают на обычный знак уважения; перевод «поклонился» сохраняет сам жест без богословского переосмысления.
translation_notes:
  register: Современный литературный русский язык; повествование звучит естественно и достойно. «Шатёр» выбран как уместное для древнего повествования обозначение переносного жилища.
