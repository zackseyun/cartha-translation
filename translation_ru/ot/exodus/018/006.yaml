base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/006.yaml
  text: He said to Moses[a], “I, Jethro your father-in-law, am coming to you, with your wife and her two sons with her.”
translation:
  language: ru
  text: 'Он сказал Моисею: «Я, Иофор, твой тесть, иду к тебе вместе с твоей женой; с ней — двое её сыновей[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и твоя жена, и двое её сыновей с ней». В еврейском тексте у слова «сыновья» стоит суффикс женского рода: речь идёт о сыновьях жены Моисея. В некоторых переводах это сглажено как: «двое твоих сыновей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: Он сказал Моисею
  rationale: Последовательная форма глагола продолжает повествование; начальное «и» в современном русском можно опустить без потери смысла.
- source_word: אֲנִי חֹתֶנְךָ יִתְרוֹ
  choice: Я, Иофор, твой тесть
  rationale: Сохранено эксплицитное, эмфатическое אֲנִי; приложение передано естественным русским порядком слов. חֹתֵן здесь означает отца жены Моисея.
- source_word: בָּא אֵלֶיךָ
  choice: иду к тебе
  rationale: Причастие выражает происходящее или предстоящее прибытие; «иду к тебе» естественно передаёт движение к адресату, не превращая его в уже завершившееся.
- source_word: וְאִשְׁתְּךָ וּשְׁנֵי בָנֶיהָ עִמָּהּ
  choice: со мной твоя жена и двое её сыновей
  rationale: Идея совместного прибытия выражена естественной русской конструкцией. Местоименный суффикс в בָנֶיהָ — женского рода, 3-го лица единственного числа, поэтому «её сыновей», а עִמָּהּ указывает, что сыновья находятся с ней.
theological_decisions:
- issue: Чьи сыновья названы в еврейском тексте
  choice: двое её сыновей
  alternative: двое твоих сыновей
  rationale: Масоретский текст содержит суффикс 3-го лица женского рода единственного числа и прямо относит сыновей к жене Моисея; гармонизация до «твоих» не требуется.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно-достоинственный. Повтор еврейского «с ней» не воспроизведён буквально в основном тексте, а естественно включён в конструкцию «со мной»; точная форма отмечена в сноске.
