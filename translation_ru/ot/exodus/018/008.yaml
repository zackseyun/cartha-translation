  text: וַ/יְסַפֵּ֤ר מֹשֶׁה֙ לְ/חֹ֣תְנ֔/וֹ אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/פַרְעֹ֣ה וּ/לְ/מִצְרַ֔יִם עַ֖ל אוֹדֹ֣ת יִשְׂרָאֵ֑ל אֵ֤ת כָּל הַ/תְּלָאָה֙ אֲשֶׁ֣ר מְצָאָ֣תַ/ם בַּ/דֶּ֔רֶךְ וַ/יַּצִּלֵ֖/ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/008.yaml
  text: Moses told his father-in-law all that Yahweh had done to Pharaoh and to Egypt for Israel’s sake[a], all the hardship that had come upon them on the way[b], and how Yahweh had delivered them.
translation:
  language: ru
  text: Моисей рассказал своему тестю обо всём, что Яхве сделал фараону и Египту ради Израиля[a], обо всех тяготах, постигших их в пути[b], и о том, как Яхве избавил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за Израиля»; «по причине Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обо всех невзгодах, постигших их в пути»; «обо всех бедах, постигших их в пути».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: рассказал
  rationale: Порода пиэль глагола ספר означает «рассказывать, повествовать». «Рассказал» естественно передаёт подробное изложение событий.
- source_word: חֹתְנוֹ
  choice: своему тестю
  rationale: В данном контексте речь об Иофоре, отце жены Моисея; русское «тесть» точно и естественно передаёт это родство.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה יְהוָה לְפַרְעֹה וּלְמִצְרַיִם
  choice: обо всём, что Яхве сделал с фараоном и Египтом
  rationale: Предлог ל обозначает направленность действий; «сделал с» сохраняет относительную нейтральность еврейской конструкции, тогда как «против» сильнее истолковывает её.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: עַל אֹדוֹת יִשְׂרָאֵל
  choice: ради Израиля
  rationale: Идиома выражает причину или действие в интересах Израиля; «ради Израиля» кратко и естественно передаёт оба оттенка.
- source_word: הַתְּלָאָה
  choice: бедствиях
  rationale: Существительное обозначает тяготы, беду или невзгоды. Множественное «бедствиях» естественно сочетается с כָּל и охватывает совокупность испытаний.
- source_word: מְצָאָתַם
  choice: постигших их
  rationale: Буквально трудность «нашла» их; русское «постигла» сохраняет образ внезапно встретившегося бедствия и звучит естественно.
- source_word: בַּדֶּרֶךְ
  choice: в пути
  rationale: Фраза обозначает время и обстоятельства странствия после выхода из Египта; «в пути» лаконично и идиоматично.
- source_word: וַיַּצִּלֵם
  choice: избавил их
  rationale: Глагол נצל означает избавить или спасти от опасности. «Избавил» соответствует повествовательному контексту и не сужает смысл до одного конкретного случая спасения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон. «Яхве» передаёт личное имя, не заменяя его титулом.
- issue: Значение עַל אֹדוֹת יִשְׂרָאֵל
  choice: ради Израиля
  alternative: из-за Израиля; по причине Израиля
  rationale: Выбранный вариант передаёт действие в интересах Израиля, сохраняя причинный оттенок; примечание отмечает более формальные причинные варианты.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет трёхчастное перечисление еврейского текста, но оформлен естественно для русского читателя; повтор «обо» делает связи между частями прозрачными.
