  yaml_path: translation/ot/exodus/018/015.yaml
  text: Moses said to his father-in-law[a], “Because the people come to me to seek God.”
translation:
  language: ru
  text: 'Моисей сказал своему тестю: «Потому что народ приходит ко мне, чтобы искать Бога[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вопрошать Бога» или «обращаться к Богу за решением». Еврейское выражение может подразумевать обращение к Богу за указанием или решением спорного дела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная повествовательная форма глагола אמר, вводящая ответ Моисея; простое прошедшее время естественно для русского повествования.
- source_word: לְחֹתְנוֹ
  choice: своему тестю
  rationale: В данном контексте חֹתֵן обозначает Иофора, отца жены Моисея; «тесть» — точный и естественный русский эквивалент.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину действий Моисея, отвечая на вопрос Иофора; «потому что» ясно передаёт причинное значение.
- source_word: יָבֹא אֵלַי הָעָם
  choice: народ приходит ко мне
  rationale: Сочетание בוא с אֶל обозначает движение к Моисею; настоящее время соответствует повторяющемуся действию, объясняемому в прямой речи.
- source_word: לִדְרֹשׁ
  choice: искать
  rationale: Глагол דרש при дополнении «Бог» может означать как искать Бога, так и вопрошать Его или обращаться к Нему за решением. «Искать» сохраняет широту исходного выражения, а более узкие значения указаны в сноске.
- source_word: אֱלֹהִים
  choice: Бога
  rationale: В еврейском тексте прямым дополнением является Бог, поэтому перевод сохраняет явное упоминание Бога, не заменяя его толкованиями вроде «Божья воля» или «решение свыше».
theological_decisions:
- issue: Передача выражения לִדְרֹשׁ אֱלֹהִים
  choice: искать Бога
  alternative: вопрошать Бога; узнавать у Бога решение
  rationale: Еврейское выражение допускает как более широкое понимание поиска Бога, так и обращение к Нему за указанием или судебным решением. Основной текст сохраняет эту широту, а контекстуально вероятные уточнения вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным библейским регистром. Синтаксис близок к еврейскому оригиналу, но естественен для обычного современного читателя.
