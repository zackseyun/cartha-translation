base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/019.yaml
  text: Now listen to my voice[a]; I will advise you, and God be with you. You be for the people before God[c][b], and you shall bring the matters to God.
translation:
  language: ru
  text: 'Теперь послушай меня: я дам тебе совет, и да будет Бог с тобой.[a] Ты представляй народ перед Богом[b] и приноси Богу дела[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть Бог будет с тобой». Еврейская форма выражает пожелание или благословение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будь ты для народа перед Богом».'
    reason: alternative_reading
  - marker: c
    text: То есть вопросы и тяжбы народа, требующие решения.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Теперь
  rationale: Передаёт временной и дискурсивный переход к наставлению Иофора естественным современным русским словом.
- source_word: שְׁמַע בְּקֹלִי
  choice: послушай меня
  rationale: Естественно передаёт еврейскую идиому «слушай мой голос» в контексте совета, не усиливая её до безусловного «повинуйся».
- source_word: אִיעָצְךָ
  choice: я дам тебе совет
  rationale: Точно и современно передаёт значение глагола יעץ — «советовать, давать совет».
- source_word: וִיהִי אֱלֹהִים עִמָּךְ
  choice: и да будет Бог с тобой
  rationale: Сохраняет пожелательный оттенок еврейской формы и достоинство благословения.
- source_word: הֱיֵה אַתָּה לָעָם מוּל הָאֱלֹהִים
  choice: Ты представляй народ перед Богом
  rationale: Естественно раскрывает функцию Моисея, выраженную буквально как «будь ты для народа перед Богом», не добавляя специальной богословской терминологии.
- source_word: וְהֵבֵאתָ
  choice: и приноси
  rationale: В последовательности после повелительной формы имеет наставительный смысл; русский императив естественно продолжает указание.
- source_word: הַדְּבָרִים
  choice: дела
  rationale: В судебном контексте обозначает вопросы и тяжбы, которые надлежит вынести на решение; «дела» сохраняет достаточную широту значения.
- source_word: אֶל הָאֱלֹהִים
  choice: к Богу
  rationale: Прямо и естественно передаёт направление обращения Моисея с делами народа.
theological_decisions:
- issue: Значение אֱלֹהִים в повествовательном контексте
  choice: Бог
  alternative: истинный Бог
  rationale: Здесь слово недвусмысленно обозначает Бога Израиля в единственном смысловом числе; расширение «истинный» текстом не требуется.
- issue: Степень явности посреднической роли Моисея
  choice: Ты представляй народ перед Богом
  alternative: Будь ты за народ перед Богом
  rationale: Выбранный вариант ясно и естественно выражает представительскую функцию, заключённую в еврейской конструкции, тогда как буквальная русская калька звучит неясно.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным тоном. Избегаются как архаическая калька «слушай голоса моего», так и чрезмерно специальная юридическая или конфессиональная терминология.
