lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Прямое соответствие обычному значению לקח; формулировка не уточняет, взял ли Иофор Сепфору под свою опеку или с собой.
- source_word: יִתְרוֹ
  choice: Иофор
  rationale: Традиционная и общепринятая русская форма имени, уместная для современного литературного библейского перевода.
- source_word: חֹתֵן מֹשֶׁה
  choice: тесть Моисея
  rationale: В данном контексте термин родства по браку обозначает отца жены Моисея; «тесть» — точное и естественное русское соответствие.
- source_word: צִפֹּרָה
  choice: Сепфора
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: אֵשֶׁת מֹשֶׁה
  choice: жена Моисея
  rationale: Естественно и точно передаёт еврейскую сопряжённую конструкцию.
- source_word: אַחַר
  choice: после того как
  rationale: Передаёт временную последовательность и позволяет естественно связать оборот с глагольной формой в русском тексте.
- source_word: שִׁלּוּחֶיהָ
  choice: тот отпустил её
  rationale: Еврейское отглагольное существительное буквально означает «её отсылание/отпущение» и не называет деятеля. Местоимение «тот» по контексту указывает на Моисея, но неоднозначность отмечена в сноске.
theological_decisions:
- issue: Кто совершил действие, выраженное оборотом שִׁלּוּחֶיהָ
  choice: 'В основном тексте подразумевается Моисей: «тот отпустил её».'
  alternative: «после того как её отослали» или буквально «после её отсылания».
  rationale: Еврейский текст не называет деятеля, однако Моисей является наиболее естественным подразумеваемым субъектом в контексте. Поскольку грамматика сохраняет реальную неопределённость, безлично-пассивная возможность вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов сохраняет повествовательный акцент оригинала; традиционные русские формы имён обеспечивают узнаваемость. Местоимение «тот» устраняет возможное ошибочное отнесение действия к Иофору, а сноска сохраняет невыраженность деятеля в еврейском тексте.
