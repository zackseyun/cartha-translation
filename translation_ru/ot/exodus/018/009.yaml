base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/009.yaml
  text: Jethro rejoiced over all the good that Yahweh had done for Israel[b][a], whom he had delivered from the hand of Egypt.
translation:
  language: ru
  text: Иофор возрадовался[a] всему добру, которое Яхве сделал для Израиля, избавив его из руки Египта[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обрадовался». Еврейский глагол может обозначать радость или ликование.'
    reason: lexical_alternative
  - marker: b
    text: «Из руки Египта» — еврейский образ, означающий избавление из-под власти Египта.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַדְּ
  choice: возрадовался
  rationale: Глагол обозначает радость; «возрадовался» естественно передаёт заметную положительную реакцию Иофора, сохраняя при этом достойный повествовательный регистр.
- source_word: יִתְרוֹ
  choice: Иофор
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: עַל כָּל הַטּוֹבָה
  choice: всему добру
  rationale: Предлог עַל при глаголе эмоции указывает на повод для радости, а существительное в единственном числе имеет собирательное значение.
- source_word: עָשָׂה
  choice: сделал
  rationale: Простое прошедшее время естественно в русском повествовании; предшествование действию «возрадовался» ясно из контекста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: לְיִשְׂרָאֵל
  choice: для Израиля
  rationale: 'Предлог לְ здесь выражает пользу: Яхве действовал во благо Израиля.'
- source_word: אֲשֶׁר הִצִּילוֹ
  choice: избавив его
  rationale: Местоименный суффикс единственного числа относится к Израилю как к единому народу; деепричастный оборот естественно связывает избавление со всем совершённым добром.
- source_word: מִיַּד מִצְרָיִם
  choice: из руки Египта
  rationale: Сохранён выразительный еврейский образ «из руки», обозначающий освобождение из-под власти Египта; его смысл пояснён в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо употреблено личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Единственное число в הִצִּילוֹ при Израиле
  choice: «его» — Израиль как единый народ
  alternative: «их» — израильтяне
  rationale: Единственное число исходного текста сохранено без превращения собирательного «Израиль» во множественное число.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Возрадовался» сохраняет силу эмоциональной реакции, а традиционный образ «из руки Египта» оставлен в тексте и кратко разъяснён.
