  yaml_path: translation/ot/exodus/018/003.yaml
  text: and her two sons[a], of whom the name of the one was Gershom, for he said, “I have been a foreigner in a foreign land.”
translation:
  language: ru
  text: 'и двух её сыновей, одного из которых звали Гершом, потому что он сказал: «Я был пришельцем[a] в чужой стране».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужеземцем». Еврейское гер может означать чужака или человека, живущего не в своей стране.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: и
  rationale: Союз продолжает перечень прямых дополнений из предыдущего стиха; непереводимый показатель прямого дополнения אֵת отдельно не передаётся.
- source_word: שְׁנֵי בָנֶיהָ
  choice: двух её сыновей
  rationale: Передаёт конструктивное сочетание «два сына её» естественным современным русским выражением и сохраняет указание на мужской пол.
- source_word: אֲשֶׁר שֵׁם הָאֶחָד
  choice: Одного из них звали
  rationale: Естественно передаёт относительную конструкцию «из которых имя одного», не превращая הָאֶחָד в порядковое «первый».
- source_word: גֵּרְשֹׁם
  choice: Гирсом
  rationale: Использована традиционная русская библейская форма имени, позволяющая читателю узнавать межтекстовые упоминания персонажа.
- source_word: כִּי אָמַר
  choice: потому что он сказал
  rationale: Сохраняет причинно-пояснительную связь между именем и словами Моисея, не уточняя сверх текста временной оттенок глагола.
- source_word: גֵּר
  choice: пришельцем
  rationale: В данном контексте слово обозначает человека, живущего не в своей земле как чужак или временный житель; «пришелец» сохраняет этот социальный оттенок и связь с именованием.
- source_word: הָיִיתִי
  choice: я был
  rationale: Простое прошедшее время прямо и естественно передаёт еврейский перфект в ретроспективном высказывании, не навязывая продолжающееся состояние.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: в чужой земле
  rationale: Естественное и достаточно формальное соответствие, подчёркивающее, что земля была для Моисея не своей.
