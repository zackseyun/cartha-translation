  text: כִּֽי יִהְיֶ֨ה לָ/הֶ֤ם דָּבָר֙ בָּ֣א אֵלַ֔/י וְ/שָׁ֣פַטְתִּ֔י בֵּ֥ין אִ֖ישׁ וּ/בֵ֣ין רֵעֵ֑/הוּ וְ/הוֹדַעְתִּ֛י אֶת חֻקֵּ֥י הָ/אֱלֹהִ֖ים וְ/אֶת תּוֹרֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/016.yaml
  text: When they have a matter[a], it comes to me, and I judge between a man and his neighbor[c][b], and I make known the statutes of God and his laws.
translation:
  language: ru
  text: Когда у них возникает спорное дело[a], оно поступает ко мне, и я разрешаю спор между человеком и его ближним[b], и сообщаю им постановления Бога и Его наставления[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вопрос»; в данном контексте речь идёт о деле, требующем разбирательства.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «между человеком и его ближним»; это форма единственного числа с представительным значением.'
    reason: cultural_note
  - marker: c
    text: 'Или: «Его законы». Еврейское слово может обозначать наставления или предписания; здесь оно употреблено в правовом контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: когда
  rationale: В данном контексте союз вводит повторяющееся обстоятельство, объясняющее обычный порядок действий Моисея; «когда» естественно передаёт условно-временной смысл.
- source_word: יִהְיֶה לָהֶם דָּבָר
  choice: у них возникает спорное дело
  rationale: דָּבָר имеет широкий смысл «дело, вопрос», но судебный контекст указывает на спор, подлежащий разбирательству; сочетание сохраняет юридический оттенок без чрезмерного сужения до формального судебного иска.
- source_word: בָּא אֵלַי
  choice: оно поступает ко мне
  rationale: Мужской род единственного числа בָּא естественно соотносится с דָּבָר; по-русски «дело поступает ко мне» точно и идиоматично передаёт эту конструкцию.
- source_word: וְשָׁפַטְתִּי
  choice: я рассуживаю
  rationale: שׁפט обозначает осуществление суда и вынесение решения. «Рассуживаю» сохраняет традиционно понятный судебный смысл, не сводя действие только к оглашению решения.
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: между одним человеком и его ближним
  rationale: Передаёт грамматически мужское единственное число и представительный характер юридической формулы; «ближний» соответствует социально-правовому значению רֵעַ.
- source_word: וְהוֹדַעְתִּי
  choice: объявляю им
  rationale: Hiphil от ידע означает «давать знать, сообщать». «Объявляю им» естественно передаёт каузативный смысл; дополнение «им» ясно восстанавливается из контекста.
- source_word: חֻקֵּי הָאֱלֹהִים
  choice: постановления Бога
  rationale: חֻקִּים — установленные предписания или постановления; выбранный вариант точен в юридическом контексте и понятен современному читателю.
- source_word: תּוֹרֹתָיו
  choice: Его наставления
  rationale: Множественное תּוֹרֹתָיו буквально обозначает Его наставления или предписания. «Наставления» сохраняет более широкий смысл תורה, тогда как юридическая нормативность уже выражена словом «постановления» и контекстом.
theological_decisions:
- issue: Представительное мужское единственное число в אִישׁ ... רֵעֵהוּ
  choice: между одним человеком и его ближним
  alternative: между людьми; между одним и другим
  rationale: Выбранная формулировка сохраняет форму исходного юридического выражения и не исключает его представительного применения.
- issue: Значение תּוֹרֹתָיו в юридическом контексте
  choice: Его наставления
  alternative: Его законы
  rationale: תּוֹרָה может означать как обязательное установление, так и наставление. Параллельное חֻקֵּי и судебный контекст обеспечивают правовой оттенок, а «наставления» не устраняет более широкую семантику слова.
- issue: Субъект формы בָּא
  choice: спорное дело поступает к Моисею
  alternative: стороны приходят к Моисею
  rationale: Форма בָּא стоит в мужском роде единственного числа и наиболее непосредственно соотносится с דָּבָר «дело»; перевод не подменяет грамматический субъект подразумеваемыми участниками спора.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис сохраняет последовательность еврейского текста, оставаясь естественным. Заглавная буква в «Его» обозначает Бога согласно принятой русской религиозной издательской практике.
