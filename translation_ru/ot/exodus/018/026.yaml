base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/026.yaml
  text: And they judged the people at all times. Every difficult matter they would bring to Moses[a], but every small matter they themselves would judge.
translation:
  language: ru
  text: Они судили народ во всякое время. Всякое трудное дело они приносили Моисею[a], а всякое малое дело судили сами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякое сложное судебное дело… всякое незначительное дело». В еврейском тексте противопоставлены трудные и малые дела, подлежавшие суду.'
    reason: Лексическая альтернатива поясняет юридический смысл слова «дело» и возможные оттенки противопоставленных прилагательных.
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: они судили
  rationale: Форма Qal описывает постоянную деятельность поставленных судей; русское прошедшее несовершенного вида естественно передаёт повторяющееся действие в повествовательном итоге.
- source_word: הָעָם
  choice: народ
  rationale: В контексте Исхода עם обозначает весь народ; это прямой и естественный русский эквивалент.
- source_word: בְּכָל עֵת
  choice: во всякое время
  rationale: Фраза указывает на постоянную доступность суда. Такой перевод сохраняет форму и смысл еврейского выражения, оставаясь понятным по-русски.
- source_word: הַדָּבָר הַקָּשֶׁה
  choice: всякое трудное дело
  rationale: В судебном контексте דָּבָר означает дело или вопрос, а קָשֶׁה — трудный. Значение класса передано словом «всякое».
- source_word: יְבִיאוּן אֶל מֹשֶׁה
  choice: они приносили Моисею
  rationale: Несовершенный вид передаёт обычное, повторяющееся действие; дательный падеж естественно выражает направление передачи дела Моисею.
- source_word: כָל הַדָּבָר הַקָּטֹן
  choice: всякое малое дело
  rationale: «Малое» прямо сохраняет лексический контраст с «трудным», не уточняя без необходимости, было ли дело незначительным или лишь более простым.
- source_word: יִשְׁפּוּטוּ הֵם
  choice: судили сами
  rationale: «Сами» передаёт эмфатическое самостоятельное местоимение הֵם и подчёркивает, что такие дела решали назначенные судьи, а не Моисей.
