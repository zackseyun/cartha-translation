  language: en
  yaml_path: translation/ot/exodus/018/024.yaml
  text: So Moses listened to the voice of his father-in-law and did all that he said[a].
translation:
  language: ru
  text: Моисей послушался своего тестя и сделал всё, что тот сказал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע ... לְקוֹל
  choice: послушался
  rationale: Сочетание שׁמע с לְקוֹל означает не просто физически услышать голос, а внять сказанному и поступить соответственно. Русское «послушался» естественно передаёт этот смысл; последующая часть стиха раскрывает послушание действием.
- source_word: חֹתְנוֹ
  choice: своего тестя
  rationale: В контексте речь идёт об Иофоре, отце жены Моисея. «Тесть» — точное и естественное современное русское обозначение.
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Обычное значение עשה — «делать». Прямой перевод хорошо сочетается с последующим придаточным.
- source_word: כֹּל אֲשֶׁר אָמָר
  choice: всё, что тот сказал
  rationale: Передаёт относительную конструкцию без добавления отсутствующего в еврейском тексте временного оттенка. Местоимение «тот» естественно устраняет возможную для русского языка двусмысленность субъекта.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза. Еврейская идиома «слушать голос» передана естественным русским «послушался», поскольку буквальное «послушал голоса» здесь звучало бы неестественно.
