  yaml_path: translation/ot/exodus/018/018.yaml
  text: You will surely wear yourself out[a], both you and this people who are with you, because the matter is too heavy for you. You are not able to do it by yourself.
translation:
  language: ru
  text: Ты непременно изнуришься[a] — и ты, и этот народ, который с тобой, — потому что это дело слишком тяжело для тебя. Ты не сможешь сделать это один.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты непременно выбьешься из сил». В еврейском тексте для усиления повторён один и тот же глагольный корень; буквально: «увядая, увянешь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבֹל תִּבֹּל
  choice: ты непременно изнуришься
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает утверждение и подчёркивает неизбежность полного истощения. «Непременно изнуришься» естественно передаёт и усиление, и предупреждение об изнеможении от чрезмерной нагрузки.
- source_word: גַּם אַתָּה גַּם הָעָם הַזֶּה
  choice: и ты, и народ
  rationale: Повтор גַּם включает обе стороны. Русская конструкция «и ты, и народ» точно и естественно передаёт это соотнесение; указательное «этот» опущено как стилистически избыточное в данном контексте.
- source_word: אֲשֶׁר עִמָּךְ
  choice: который с тобой
  rationale: Сохраняет относительную конструкцию и согласование с собирательным существительным «народ» в единственном числе.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание предупреждения; «потому что» ясно выражает причинную связь в современном русском языке.
- source_word: כָבֵד מִמְּךָ הַדָּבָר
  choice: это дело слишком тяжело для тебя
  rationale: Сохранена метафора тяжести в כָבֵד, а דָּבָר передано широким словом «дело», без неоправданного уточнения административной или судебной задачи.
- source_word: לֹא תוּכַל עֲשֹׂהוּ
  choice: ты не сможешь справиться с ним
  rationale: Буквально выражена неспособность «сделать это». В русском «справиться с ним» естественно связывает высказывание с тяжёлым делом, не меняя смысла.
- source_word: לְבַדֶּךָ
  choice: один
  rationale: Передаёт невозможность выполнить дело без помощи. Форма мужского рода соответствует обращению к Моисею.
