source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע יִתְר֨וֹ כֹהֵ֤ן מִדְיָן֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה אֱלֹהִים֙ לְ/מֹשֶׁ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּ֑/וֹ כִּֽי הוֹצִ֧יא יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/001.yaml
  text: Jethro[a], the priest of Midian, Moses’ father-in-law, heard all that God had done for Moses and for Israel his people, that Yahweh had brought Israel out of Egypt.
translation:
  language: ru
  text: Иофор, священник Мадиама и тесть Моисея, услышал обо всём, что Бог сделал для Моисея и для Израиля, народа его[a], — о том, как Яхве вывел Израиль из Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Местоимение «его» вероятнее всего относится к Богу: Израиль — народ Бога. Однако грамматически возможен и другой смысл: «Израиля, народа Моисея».'
    reason: Сохранение неоднозначности возможного антецедента местоименного суффикса עַמּוֹ.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал
  rationale: Последовательная форма продолжает повествование; отдельное вводное «тогда» или «и» в русском не требуется.
- source_word: כֹהֵן מִדְיָן
  choice: священник Мадиама
  rationale: Сочетание указывает на служение Иофора и его связь с Мадиамом; определённость естественно передаётся контекстом без артикля.
- source_word: חֹתֵן מֹשֶׁה
  choice: тесть Моисея
  rationale: В данном контексте термин обозначает отца жены Моисея; это точный и естественный русский эквивалент.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה אֱלֹהִים
  choice: обо всём, что Бог сделал
  rationale: Передаёт обобщающее значение כָּל אֲשֶׁר и естественно вводит содержание услышанного.
- source_word: לְמֹשֶׁה וּלְיִשְׂרָאֵל
  choice: для Моисея и для Израиля
  rationale: Предлог ל обозначает благотворное действие в пользу Моисея и Израиля.
- source_word: עַמּוֹ
  choice: народа его
  rationale: Строчная буква и постпозиция местоимения сохраняют возможную соотнесённость как с Богом, так и, грамматически, с Моисеем, не снимая неоднозначности исходного текста.
- source_word: כִּי
  choice: о том, как
  rationale: Оборот раскрывает содержание того, о чём услышал Иофор, и естественно связывает поясняющую часть русского предложения.
- source_word: הוֹצִיא
  choice: вывел
  rationale: Каузативная форма глагола יצא означает «заставить выйти, вывести» и здесь обозначает исход из Египта.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, а не заменяет его титулом.
- source_word: מִמִּצְרָיִם
  choice: из Египта
  rationale: В сочетании с «вывел» естественно передаёт движение из пределов Египта.
theological_decisions:
- issue: К кому относится местоименный суффикс в עַמּוֹ
  choice: «Израиля, народа его» — наиболее вероятно, народа Бога, при сохранении грамматической неоднозначности
  alternative: «Израиля, народа Моисея»
  rationale: 'По смыслу и ближайшему явно названному действующему лицу наиболее вероятен Бог: Израиль — его народ. Однако грамматически суффикс может быть соотнесён и с Моисеем, поэтому основной текст не заменяет местоимение словом «Божьего», а сноска сообщает альтернативу.'
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Союз в начале не добавлен, поскольку еврейская последовательная форма сама продвигает рассказ, а русское предложение естественно читается без формального «и» или «тогда». Конструкция «народа его» несколько приподнята, но понятна и позволяет сохранить реальную неоднозначность оригинала.
