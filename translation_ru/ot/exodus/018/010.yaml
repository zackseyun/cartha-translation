  text: וַ/יֹּאמֶר֮ יִתְרוֹ֒ בָּר֣וּךְ יְהוָ֔ה אֲשֶׁ֨ר הִצִּ֥יל אֶתְ/כֶ֛ם מִ/יַּ֥ד מִצְרַ֖יִם וּ/מִ/יַּ֣ד פַּרְעֹ֑ה אֲשֶׁ֤ר הִצִּיל֙ אֶת הָ/עָ֔ם מִ/תַּ֖חַת יַד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/010.yaml
  text: And Yitro said[a], “Blessed be Yahweh, who delivered you from the hand of the Egyptians and from the hand of Pharaoh[b], who delivered the people from under the hand of the Egyptians.”
translation:
  language: ru
  text: 'И сказал Итро: «Благословен Яхве, который избавил вас из руки египтян и из руки фараона; Он избавил народ из-под руки египтян[b]».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Да будет благословен Яхве». Еврейская формула допускает и утверждение хвалы, и благопожелательный оттенок.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из руки Египта… из-под руки Египта». «Рука» здесь — образ власти или контроля; название «Египет» имеет коллективный смысл: египтяне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма продолжает последовательность повествования; союз «и» сохраняет ход еврейского рассказа, не добавляя более узкого временного оттенка.
- source_word: יִתְרוֹ
  choice: Итро
  rationale: Передача непосредственно отражает еврейскую форму имени и соответствует принципу транслитерации личных имён; традиционная русская форма — «Иофор».
- source_word: בָּרוּךְ יְהוָה
  choice: Благословен Яхве
  rationale: Краткая русская формула сохраняет хвалебную силу еврейского причастного оборота, который допускает как утверждение, так и благопожелательное прочтение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не замещающий его титул.
- source_word: הִצִּיל
  choice: избавил
  rationale: Каузативная форма נצל обозначает освобождение или спасение от враждебной власти; «избавил» естественно звучит в контексте исхода и сохраняет смысл освобождения.
- source_word: אֶתְכֶם
  choice: вас
  rationale: Сохранено обращение во втором лице множественного числа без уточнения его адресатов сверх сказанного в тексте.
- source_word: מִיַּד
  choice: из руки
  rationale: Сохранён конкретный еврейский образ руки как власти и контроля; по-русски оборот понятен, хотя имеет библейскую окраску.
- source_word: מִצְרַיִם
  choice: египтян
  rationale: В сочетании с образом руки название Египта имеет коллективный смысл и указывает на египтян как угнетающую силу.
- source_word: פַּרְעֹה
  choice: фараона
  rationale: Обычная русская передача египетского царского титула.
- source_word: הָעָם
  choice: народ
  rationale: В контексте речь идёт о народе Израиля как едином целом; русское «народ» передаёт это без внесения слова «Израиль», отсутствующего в стихе.
- source_word: מִתַּחַת יַד
  choice: из-под руки
  rationale: Сохранён усиленный образ подчинения под чужой властью, а также отличие от более краткого оборота מִיַּד ранее в стихе.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя יהוה. Форма «Яхве» передаёт его как имя и не заменяет титулом.
- issue: Смысл формулы בָּרוּךְ יְהוָה
  choice: Благословен Яхве
  alternative: Да будет благословен Яхве
  rationale: Еврейская формула может восприниматься и как провозглашение хвалы, и как благопожелание. Основной текст сохраняет её краткость, а примечание отмечает допустимый оттенок, не устраняя неоднозначности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной повествовательной интонацией. Конкретный образ «руки» сохранён ради связи с еврейским текстом; его значение разъяснено в примечании. Имя Итро передано по еврейской форме, а не в традиционной русской форме «Иофор».
